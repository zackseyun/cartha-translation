id: JHN.4.5
reference: John 4:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἔρχεται οὖν εἰς πόλιν τῆς Σαμαρείας λεγομένην Συχὰρ πλησίον τοῦ χωρίου ὃ ἔδωκεν Ἰακὼβ ⸀τῷ Ἰωσὴφ τῷ υἱῷ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/john/004/005.yaml
  text: So he came to a town of Samaria called Sychar[b][a], near the piece of land that Jacob had given to Joseph his son.
translation:
  language: fr
  text: Il arriva donc dans une ville de Samarie appelée Sychar[a], près du terrain[b] que Jacob avait donné à son fils Joseph.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une localité appelée Sychar ». Le mot grec πόλις peut désigner une ville ou une localité, selon le contexte.
    reason: lexical_alternative
  - marker: b
    text: Ou « champ », « propriété » ou « parcelle de terre ». Le mot grec χωρίον peut désigner différents types de biens fonciers.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχεται
  choice: il arriva
  rationale: Le présent grec est un présent historique dans le récit ; le passé simple rend naturellement la progression narrative en français.
- source_word: οὖν
  choice: donc
  rationale: Le connecteur marque ici la continuité et la conséquence narrative avec le contexte précédent.
- source_word: πόλιν
  choice: ville
  rationale: πόλις peut désigner une ville ou une localité ; « ville » est le correspondant français courant, sans imposer une taille précise.
- source_word: τῆς Σαμαρείας
  choice: de Samarie
  rationale: Le génitif rattache directement la ville à la région de Samarie.
- source_word: λεγομένην Συχὰρ
  choice: appelée Sychar
  rationale: Rend de façon idiomatique le participe qui indique le nom de la ville.
- source_word: πλησίον
  choice: près de
  rationale: Expression spatiale simple et naturelle.
- source_word: χωρίου
  choice: terrain
  rationale: χωρίον désigne une étendue ou une propriété foncière ; « terrain » reste général et naturel sans la limiter à un champ cultivé.
- source_word: ὃ ἔδωκεν Ἰακὼβ
  choice: que Jacob avait donné
  rationale: Le plus-que-parfait présente clairement ce don comme antérieur à l'arrivée racontée.
- source_word: τῷ Ἰωσὴφ τῷ υἱῷ αὐτοῦ
  choice: à son fils Joseph
  rationale: Cette formulation française naturelle conserve Joseph comme bénéficiaire et explicite son lien filial avec Jacob.
theological_decisions: []
