  text: ἀφῆκεν τὴν Ἰουδαίαν καὶ ἀπῆλθεν ⸀πάλιν εἰς τὴν Γαλιλαίαν.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/003.yaml
  text: he left Judea and went back to Galilee[a].
translation:
  language: fr
  text: il quitta la Judée et retourna en Galilée[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « partit de nouveau pour la Galilée ». L’adverbe grec πάλιν peut se traduire par « de nouveau », mais il exprime probablement ici l’idée d’un retour.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφῆκεν
  choice: quitta
  rationale: Dans ce contexte, l’aoriste de ἀφίημι signifie laisser un lieu derrière soi. « quitta » est direct, naturel et s’emploie correctement avec « la Judée » comme complément.
- source_word: τὴν Ἰουδαίαν
  choice: la Judée
  rationale: Nom français usuel de la région géographique évoquée dans l’Évangile.
- source_word: ἀπῆλθεν
  choice: retourna
  rationale: Le verbe exprime ici le déplacement vers un autre lieu; associé à πάλιν, « retourna » rend naturellement l’idée d’un départ qui ramène en Galilée.
- source_word: πάλιν
  choice: retourna
  rationale: L’adverbe peut signifier « de nouveau », mais, dans ce contexte de déplacement, il indique vraisemblablement un retour. Son sens est intégré au verbe « retourna ».
- source_word: εἰς τὴν Γαλιλαίαν
  choice: en Galilée
  rationale: εἰς marque la destination. En français courant, on dit naturellement « retourner en Galilée ».
theological_decisions: []
