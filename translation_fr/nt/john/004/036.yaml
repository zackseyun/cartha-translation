id: JHN.4.36
reference: John 4:36
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸀ὁ θερίζων μισθὸν λαμβάνει καὶ συνάγει καρπὸν εἰς ζωὴν αἰώνιον, ⸀ἵνα ὁ σπείρων ὁμοῦ χαίρῃ καὶ ὁ θερίζων.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/036.yaml
  text: The one who reaps is receiving wages and gathering fruit for eternal life[b][a], so that the one who sows and the one who reaps may rejoice together.
translation:
  language: fr
  text: Celui qui moissonne reçoit un salaire[a] et recueille du fruit pour la vie éternelle[b], afin que celui qui sème et celui qui moissonne se réjouissent ensemble.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une récompense ». Le terme grec peut désigner soit le salaire d’un travail, soit une rétribution.
    reason: lexical_alternative
  - marker: b
    text: Ou « en vue de la vie éternelle ». L’expression peut indiquer le but ou le résultat.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ θερίζων
  choice: celui qui moissonne
  rationale: Le participe présent substantivé désigne la personne qui accomplit l’action. Cette formulation moderne conserve la valeur verbale et le parallélisme avec « celui qui sème ».
- source_word: μισθὸν
  choice: un salaire
  rationale: Le terme peut désigner la rémunération d’un travail ou, plus largement, une récompense. « Un salaire » maintient ici l’image concrète du travail de la moisson.
- source_word: λαμβάνει
  choice: reçoit
  rationale: Le présent français exprime naturellement l’action en cours dans ce contexte, sans la lourdeur de « est en train de recevoir ».
- source_word: συνάγει
  choice: recueille
  rationale: Le verbe décrit l’action de rassembler ce qui est produit. « Recueille » s’accorde naturellement avec « du fruit » et conserve l’action distincte de moissonner.
- source_word: καρπὸν
  choice: du fruit
  rationale: « Fruit » préserve la métaphore et sa portée, sans confondre ce qui est recueilli avec l’acte même de la moisson.
- source_word: εἰς ζωὴν αἰώνιον
  choice: pour la vie éternelle
  rationale: La préposition εἰς peut marquer l’orientation, le but ou le résultat. « Pour » reste naturel en français tout en conservant cette ouverture sémantique.
- source_word: ἵνα
  choice: afin que
  rationale: Cette locution introduit clairement la proposition de but, tout en permettant au contexte de laisser entendre un résultat.
- source_word: ὁ σπείρων
  choice: celui qui sème
  rationale: Cette formulation rend le participe présent substantivé et maintient le parallélisme exact avec « celui qui moissonne ».
- source_word: ὁμοῦ
  choice: ensemble
  rationale: L’adverbe souligne que la joie est partagée par celui qui sème et celui qui moissonne.
- source_word: χαίρῃ
  choice: se réjouissent
  rationale: Le subjonctif présent après « afin que » rend naturellement le subjonctif grec et exprime une joie commune.
theological_decisions:
- issue: Valeur de εἰς dans l’expression εἰς ζωὴν αἰώνιον
  choice: pour la vie éternelle
  alternative: en vue de la vie éternelle / jusque dans la vie éternelle
  rationale: Le texte peut évoquer le but, l’orientation ou le résultat de la récolte. « Pour » conserve cette tension sans imposer une explication théologique particulière.
- issue: Rapport exprimé par ἵνα
  choice: afin que
  alternative: de sorte que
  rationale: La construction indique principalement le but, mais peut comporter une nuance de résultat. « Afin que » rend le lien syntaxique sans développer le sens au-delà du grec.
- issue: Force du présent de λαμβάνει et συνάγει
  choice: 'présents simples : « reçoit » et « recueille »'
  alternative: 'formes progressives : « est en train de recevoir » et « de recueillir »'
  rationale: En français, le présent simple peut désigner une action actuelle ou en cours. Il garde l’immédiateté du contexte sans ajouter l’adverbe « déjà », absent de ce verset.
translation_notes:
  register: Français international moderne, clair et digne. La répétition de « celui qui » est maintenue pour reproduire le parallélisme grec. Le vocabulaire agricole reste concret, tandis que les notes signalent les principales ambiguïtés lexicales sans les résoudre artificiellement.
