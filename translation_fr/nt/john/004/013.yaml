  text: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῇ· Πᾶς ὁ πίνων ἐκ τοῦ ὕδατος τούτου διψήσει πάλιν·
base_translation:
  language: en
  yaml_path: translation/nt/john/004/013.yaml
  text: Jesus answered and said to her[a], “Everyone who drinks from this water will be thirsty again.”
translation:
  language: fr
  text: 'Jésus lui répondit[a] : « Toute personne qui boit de cette eau aura de nouveau soif. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Jésus lui répondit et lui dit ».'
    reason: Formule narrative grecque rendue de manière idiomatique en français.
lexical_decisions:
- source_word: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῇ
  choice: Jésus lui répondit
  rationale: En français narratif actuel, « répondit » exprime naturellement l’ensemble de la formule grecque « répondit et dit », tandis que « lui » rend explicitement le datif αὐτῇ.
- source_word: Πᾶς ὁ πίνων
  choice: Toute personne qui boit
  rationale: Le participe présent substantivé a une portée générale et inclut toute personne, sans restriction de sexe. Cette formulation conserve cette universalité dans un français clair.
- source_word: ἐκ τοῦ ὕδατος τούτου
  choice: de cette eau
  rationale: « De » est la préposition française naturelle avec « boire », et « cette eau » conserve la référence démonstrative à l’eau dont il est question.
- source_word: διψήσει πάλιν
  choice: aura de nouveau soif
  rationale: Cette tournure française naturelle conserve le futur de διψήσει et la répétition exprimée par πάλιν.
theological_decisions:
- issue: Formule double ἀπεκρίθη ... καὶ εἶπεν
  choice: La rendre idiomatiquement par « répondit » et signaler la forme grecque en note
  alternative: « répondit et lui dit »
  rationale: Le grec emploie une formule narrative à deux verbes. Sa reproduction mot à mot serait lourde et peu naturelle en français; la note préserve toutefois la texture formelle du texte source sans lui attribuer une portée théologique supplémentaire.
- issue: Portée du masculin grammatical dans Πᾶς ὁ πίνων
  choice: « Toute personne qui boit »
  alternative: « Quiconque boit »
  rationale: Le masculin grec est générique et non limité aux hommes. La formulation retenue rend explicitement cette portée universelle sans modifier le sens.
translation_notes:
  register: Français international moderne, naturel et digne. « Toute personne » est immédiatement compréhensible et maintient la portée universelle; « aura de nouveau soif » est plus idiomatique que « sera de nouveau assoiffée ».
