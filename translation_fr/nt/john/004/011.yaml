id: JHN.4.11
reference: John 4:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ⸂ἡ γυνή⸃· Κύριε, οὔτε ἄντλημα ἔχεις καὶ τὸ φρέαρ ἐστὶν βαθύ· πόθεν οὖν ἔχεις τὸ ὕδωρ τὸ ζῶν;
base_translation:
  language: en
  yaml_path: translation/nt/john/004/011.yaml
  text: The woman said to him[a], “Lord, you have neither a bucket nor is the well deep[b]. So where do you get the living water?”
translation:
  language: fr
  text: 'La femme lui dit : « Seigneur[a], tu n’as pas de seau, et le puits est profond. D’où as-tu donc cette eau vive[b] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Monsieur ». Le grec κύριε peut être une formule d’adresse respectueuse ou signifier « Seigneur », selon le contexte.
    reason: alternative_reading
  - marker: b
    text: Ou « eau courante », c’est-à-dire une eau fraîche qui coule, par opposition à une eau stagnante. « Eau vive » conserve aussi le sens plus profond des paroles de Jésus.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει αὐτῷ ἡ γυνή
  choice: La femme lui dit
  rationale: Le présent historique grec est rendu par le présent de narration, naturel en français et fidèle à la forme du récit johannique. Dans ce contexte, γυνή désigne la femme samaritaine.
- source_word: Κύριε
  choice: Seigneur
  rationale: « Seigneur » conserve la traduction habituelle de κύριος ainsi que sa possible portée théologique, tandis qu’une note signale que le mot peut ici n’être qu’une formule de politesse.
- source_word: ἄντλημα
  choice: seau
  rationale: Le nom désigne un récipient ou instrument servant à puiser. « Seau » est concret, courant et adapté à la scène.
- source_word: τὸ φρέαρ ἐστὶν βαθύ
  choice: le puits est profond
  rationale: 'Cette traduction directe préserve l’affirmation positive du grec : la profondeur du puits, jointe à l’absence de récipient, fonde la question de la femme.'
- source_word: πόθεν οὖν ἔχεις
  choice: D’où as-tu donc
  rationale: « D’où » exprime l’origine demandée par πόθεν, et « donc » rend la valeur inférentielle de οὖν.
- source_word: τὸ ὕδωρ τὸ ζῶν
  choice: cette eau vive
  rationale: « Eau vive » peut évoquer une eau fraîche et courante tout en conservant le sens plus profond que prend l’expression dans le dialogue. Le démonstratif français renvoie naturellement à l’eau dont Jésus vient de parler.
theological_decisions:
- issue: Portée de κύριε dans l’adresse de la Samaritaine à Jésus
  choice: Seigneur
  alternative: Monsieur
  rationale: À ce stade du dialogue, le mot peut être une simple marque de respect et ne prouve pas que la femme reconnaît déjà pleinement l’identité de Jésus. Le texte principal conserve néanmoins « Seigneur », et la note maintient l’ambiguïté pragmatique.
- issue: Double sens de ὕδωρ τὸ ζῶν
  choice: eau vive
  alternative: eau courante
  rationale: L’expression peut désigner concrètement une eau fraîche qui coule, ce qui explique la compréhension littérale de la femme, mais elle porte aussi le sens spirituel développé par Jésus. « Eau vive » préserve cette tension.
translation_notes:
  register: Français moderne, courant et digne. Le tutoiement correspond au dialogue direct sans introduire de distance sociale étrangère au grec. La coordination « et le puits est profond » suit le texte grec et évite de transformer à tort cette affirmation en négation corrélative.
