source:
  edition: SBLGNT
  text: ἔγνω οὖν ὁ πατὴρ ⸀ὅτι ἐκείνῃ τῇ ὥρᾳ ἐν ᾗ εἶπεν αὐτῷ ὁ ⸀Ἰησοῦς· Ὁ υἱός σου ζῇ, καὶ ἐπίστευσεν αὐτὸς καὶ ἡ οἰκία αὐτοῦ ὅλη.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/053.yaml
  text: So the father knew that it was at that hour when Jesus said to him[a], “Your son lives,” and he himself believed[b], and his whole household.
translation:
  language: fr
  text: 'Le père comprit donc que c’était à cette heure-là que Jésus lui avait dit : « Ton fils est vivant[a]. » Lui et toute sa maisonnée crurent[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Ton fils vit. »'
    reason: lexical_alternative
  - marker: b
    text: Le verbe « crurent » peut renvoyer soit à la confiance accordée précisément à la parole de Jésus, soit à une foi plus pleine en Jésus ; le grec n’en précise pas la portée.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔγνω
  choice: comprit
  rationale: Dans ce contexte, l’aoriste exprime la prise de conscience du père lorsqu’il établit la correspondance entre l’heure indiquée par ses serviteurs et la parole de Jésus. « Comprit » rend ce mouvement cognitif plus naturellement que « sut ».
- source_word: οὖν
  choice: donc
  rationale: Le terme relie cette conclusion au rapport des serviteurs dans le verset précédent et en marque l’inférence.
- source_word: ὁ πατήρ
  choice: le père
  rationale: La désignation familiale suit directement le grec et maintient l’accent narratif sur la relation entre le père et son fils.
- source_word: ἐκείνῃ τῇ ὥρᾳ
  choice: à l’heure
  rationale: Le français emploie naturellement « à l’heure où » pour désigner le moment précis déjà identifié par le contexte. Ajouter « même » introduirait une insistance qui n’est pas lexicalement explicite.
- source_word: εἶπεν αὐτῷ ὁ Ἰησοῦς
  choice: Jésus lui avait dit
  rationale: Le plus-que-parfait situe naturellement en français la parole de Jésus avant la prise de conscience du père, sans modifier la relation temporelle du grec.
- source_word: Ὁ υἱός σου ζῇ
  choice: Ton fils est vivant
  rationale: ζῇ est un présent qui décrit l’état actuel du fils. « Est vivant » est idiomatique en français moderne, tandis que « vit » est plus littéral mais peut paraître moins naturel dans cette déclaration.
- source_word: ἐπίστευσεν
  choice: il crut
  rationale: « Crut » conserve la simplicité et l’ouverture de πιστεύω sans préciser au-delà du texte l’objet ou le degré de sa foi.
- source_word: αὐτός
  choice: lui-même
  rationale: Le pronom explicite a une valeur emphatique et distingue la foi personnelle du père de celle de toute sa maisonnée.
- source_word: ἡ οἰκία αὐτοῦ ὅλη
  choice: toute sa maisonnée
  rationale: οἰκία désigne ici l’ensemble des personnes de la maison, et non le bâtiment. « Maisonnée » inclut ce groupe domestique plus largement que la seule famille nucléaire.
theological_decisions:
- issue: Portée de la foi du père
  choice: Le texte affirme simplement qu’il crut, sans définir davantage l’objet ni le degré de cette foi.
  alternative: Comprendre qu’il crut seulement à la parole précise de guérison, ou qu’il parvint alors à une foi plus pleine en Jésus.
  rationale: Dans Jean, πιστεύω peut avoir une forte portée théologique, mais ce verset n’explicite pas si la foi du père porte ici uniquement sur la parole prononcée ou si elle désigne un approfondissement global de sa foi en Jésus. La traduction préserve cette tension.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe reste proche du mouvement du grec tout en employant un plus-que-parfait idiomatique pour l’antériorité. « Maisonnée » évite de réduire οἰκία au bâtiment ou à la seule famille nucléaire.
