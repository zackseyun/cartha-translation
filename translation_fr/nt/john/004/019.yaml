id: JHN.4.19
reference: John 4:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ἡ γυνή· Κύριε, θεωρῶ ὅτι προφήτης εἶ σύ.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/019.yaml
  text: The woman said to him[a], “Lord, I see that you are a prophet.”
translation:
  language: fr
  text: 'La femme lui dit : « Seigneur[a], je vois que tu es prophète. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Monsieur ». Le grec κύριε peut être une formule d’adresse respectueuse aussi bien que signifier « Seigneur ».
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει
  choice: dit
  rationale: Le présent historique grec est rendu par le présent français, naturel dans une narration vivante et fidèle à la forme verbale du texte source.
- source_word: αὐτῷ
  choice: lui
  rationale: Le pronom au datif indique le destinataire des paroles ; « lui dit » est la tournure française idiomatique.
- source_word: ἡ γυνή
  choice: La femme
  rationale: Dans le contexte, γυνή désigne la femme samaritaine, non une épouse.
- source_word: Κύριε
  choice: Seigneur
  rationale: « Seigneur » conserve le rendu usuel de κύριε et sa possible portée christologique, tandis que la valeur de simple adresse respectueuse est signalée en note.
- source_word: θεωρῶ
  choice: je vois
  rationale: Ici, θεωρέω exprime une constatation ou une compréhension fondée sur ce que Jésus vient de révéler ; « je vois » est naturel et préserve cette nuance.
- source_word: ὅτι
  choice: que
  rationale: La conjonction introduit directement le contenu de la constatation.
- source_word: προφήτης
  choice: prophète
  rationale: Après « être », le français omet normalement l’article devant un nom indiquant une qualité ou une fonction ; cette formulation ne présente pas Jésus comme « le Prophète » au sens déterminé.
- source_word: σύ
  choice: tu
  rationale: Le pronom grec est explicite et légèrement emphatique. Le français exige ici un sujet exprimé ; aucune emphase supplémentaire n’est ajoutée artificiellement.
theological_decisions:
- issue: Valeur de κύριε dans l’adresse à Jésus
  choice: Seigneur
  alternative: Monsieur
  rationale: Dans ce contexte, la femme peut employer une formule de respect sans formuler encore une pleine confession christologique. Le texte principal garde néanmoins « Seigneur », et la note préserve l’ambiguïté pragmatique du grec.
- issue: Portée de προφήτης
  choice: tu es prophète
  alternative: tu es un prophète
  rationale: L’absence d’article en français après « être » est idiomatique et correspond à l’attribution de la qualité de prophète. Elle n’identifie pas explicitement Jésus au « Prophète » attendu.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement correspond à l’usage habituel dans les dialogues bibliques. Le présent narratif « dit » suit le présent historique grec sans raideur.
