  yaml_path: translation/nt/john/004/008.yaml
  text: For his disciples had gone away into the city to buy food[a][b].
translation:
  language: fr
  text: En effet, ses disciples étaient allés à la ville acheter de quoi manger[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « acheter des provisions ».
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: En effet
  rationale: La conjonction introduit l’explication de la situation précédente; « En effet » conserve ce lien de manière naturelle en français.
- source_word: μαθηταὶ αὐτοῦ
  choice: ses disciples
  rationale: Formulation possessive française naturelle, qui rend exactement le groupe nominal grec.
- source_word: ἀπεληλύθεισαν
  choice: étaient allés
  rationale: Le plus-que-parfait grec situe ce déplacement avant la scène en cours; le plus-que-parfait français en préserve l’antériorité.
- source_word: εἰς τὴν πόλιν
  choice: à la ville
  rationale: Dans ce contexte, εἰς indique la destination. « À la ville » est idiomatique et conserve πόλις sans imposer l’idée d’entrée physique.
- source_word: ἵνα
  choice: acheter
  rationale: L’infinitif français exprime naturellement le but introduit par ἵνα.
- source_word: τροφὰς
  choice: de quoi manger
  rationale: Cette expression courante rend naturellement le pluriel grec désignant des aliments ou des provisions, sans lourdeur.
- source_word: ἀγοράσωσιν
  choice: acheter
  rationale: « Acheter » est l’équivalent moderne et direct du verbe grec dans cette proposition de but.
