id: JHN.4.18
reference: John 4:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: πέντε γὰρ ἄνδρας ἔσχες, καὶ νῦν ὃν ἔχεις οὐκ ἔστιν σου ἀνήρ· τοῦτο ἀληθὲς εἴρηκας.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/018.yaml
  text: For you have had five husbands[a], and the man you now have is not your husband; this you have said truly.
translation:
  language: fr
  text: Car tu as eu cinq maris[a], et l’homme avec qui tu es maintenant n’est pas ton mari ; en cela, tu as dit vrai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « Car tu as eu cinq hommes, et celui que tu as maintenant n’est pas ton homme/mari. » Le mot grec ἀνήρ peut signifier « homme » ou « mari » ; ici, le contexte favorise « mari ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πέντε γὰρ ἄνδρας ἔσχες
  choice: Car tu as eu cinq maris
  rationale: « Car » conserve la valeur explicative de γάρ. Dans ce contexte relationnel, ἄνδρας désigne naturellement des maris, et le passé composé rend en français actuel l’histoire antérieure encore pertinente.
- source_word: καὶ νῦν ὃν ἔχεις
  choice: et l’homme avec qui tu es maintenant
  rationale: Le grec dit littéralement « celui que tu as maintenant ». En français, « l’homme avec qui tu es » exprime naturellement la relation sans suggérer une possession, tout en conservant la référence masculine et la situation présente.
- source_word: οὐκ ἔστιν σου ἀνήρ
  choice: n’est pas ton mari
  rationale: 'Le contexte et le génitif σου donnent ici à ἀνήρ son sens conjugal : « mari ».'
- source_word: τοῦτο ἀληθὲς εἴρηκας
  choice: en cela, tu as dit vrai
  rationale: Cette formulation naturelle et digne conserve le démonstratif τοῦτο, la valeur de vérité de ἀληθές et la portée actuelle du parfait εἴρηκας.
theological_decisions:
- issue: Sens de ἀνήρ dans ses deux occurrences
  choice: « maris » dans la première occurrence et « mari » dans la seconde, avec « l’homme » pour expliciter l’antécédent du relatif ὃν
  alternative: Traduire plus littéralement par « hommes » et « homme »
  rationale: Le contraste entre les relations passées et le fait que l’homme actuel n’est pas son mari indique le sens conjugal de ἀνήρ. La note conserve néanmoins l’ambiguïté lexicale réelle du grec.
- issue: Nature de la relation actuelle
  choice: « l’homme avec qui tu es maintenant »
  alternative: « l’homme que tu as maintenant »
  rationale: Le grec emploie ἔχω, mais le calque « que tu as » serait moins naturel en français et pourrait évoquer indûment la possession. La traduction ne précise pas davantage la nature de la relation.
translation_notes:
  register: Français international moderne, courant et digne. Le tutoiement correspond au dialogue singulier. La phrase garde le lien explicatif initial et le contraste du grec, sans expliciter au-delà du texte la nature de la relation actuelle.
