  text: Après ces deux jours, il partit de là pour la Galilée.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μετὰ δὲ τὰς δύο ἡμέρας
  choice: Après ces deux jours
  rationale: μετά avec l’accusatif exprime ici la succession temporelle. L’article renvoie naturellement aux deux jours de séjour mentionnés au verset précédent. δέ est rendu implicitement, car une conjonction explicite alourdirait la narration en français.
- source_word: ἐξῆλθεν
  choice: il partit
  rationale: L’aoriste de ἐξέρχομαι signifie littéralement « il sortit », mais, dans ce récit de déplacement, « il partit » exprime naturellement le départ du lieu où Jésus séjournait.
- source_word: ἐκεῖθεν
  choice: de là
  rationale: Cet adverbe indique le point de départ déjà connu par le contexte. « De là » est la formulation française la plus directe et naturelle.
- source_word: εἰς τὴν Γαλιλαίαν
  choice: pour la Galilée
  rationale: εἰς indique le mouvement vers une destination. Avec « partir », « pour la Galilée » est une tournure française idiomatique qui conserve ce sens directionnel.
