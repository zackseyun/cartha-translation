source:
  edition: SBLGNT
  text: ἦν δὲ ἐκεῖ πηγὴ τοῦ Ἰακώβ. ὁ οὖν Ἰησοῦς κεκοπιακὼς ἐκ τῆς ὁδοιπορίας ἐκαθέζετο οὕτως ἐπὶ τῇ πηγῇ· ὥρα ἦν ⸀ὡς ἕκτη.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/006.yaml
  text: Jacob’s well was there[a]. So Jesus, wearied from the journey, was sitting there by the well[c][b]. It was about the sixth hour.
translation:
  language: fr
  text: Le puits de Jacob se trouvait là[a]. Jésus, fatigué par le voyage, était donc assis près du puits[b]. C’était environ la sixième heure[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la source de Jacob »; le mot grec peut désigner une source ou un puits.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « était assis ainsi près du puits ». « Ainsi » peut évoquer la manière dont il était assis ou signifier « tel qu’il était ».
    reason: lexical_alternative
  - marker: c
    text: Selon le décompte juif habituel des heures à partir du lever du jour, il s’agirait d’environ midi. Certains proposent toutefois un autre système de calcul.
    reason: chronological_ambiguity
lexical_decisions:
- source_word: πηγή
  choice: puits
  rationale: Le mot grec peut désigner une source ou un puits. Ici, le lieu où l’on vient puiser de l’eau et l’expression française consacrée « puits de Jacob » rendent « puits » naturel, sans exclure l’autre sens, signalé en note.
- source_word: κεκοπιακὼς ἐκ τῆς ὁδοιπορίας
  choice: fatigué par le voyage
  rationale: Le participe parfait décrit l’état de fatigue produit par l’effort du déplacement. « Fatigué par le voyage » exprime clairement cet état et sa cause dans un français courant et digne.
- source_word: ἐκαθέζετο
  choice: était assis
  rationale: L’imparfait grec présente Jésus dans une position durable à ce moment du récit. « Était assis » en conserve l’aspect descriptif.
- source_word: οὕτως
  choice: implicite dans la phrase, avec note
  rationale: L’adverbe signifie littéralement « ainsi », mais sa nuance exacte est difficile ici et peut évoquer la manière ou l’état dans lequel Jésus s’est assis. Une traduction explicite serait peu naturelle ou trancherait indûment; la note préserve l’ambiguïté.
- source_word: ἐπὶ τῇ πηγῇ
  choice: près du puits
  rationale: Avec le datif, ἐπί a ici une valeur locale. « Près du puits » est naturel et n’impose pas l’idée que Jésus était assis sur la margelle.
- source_word: ὥρα ἦν ὡς ἕκτη
  choice: C’était environ la sixième heure
  rationale: « Environ » rend ὡς, tandis que « la sixième heure » conserve le mode antique de compter les heures sans imposer dans le texte principal une équivalence moderne débattue.
- source_word: δὲ / οὖν
  choice: absence de connecteur initial / donc
  rationale: δὲ assure ici une progression narrative légère qui n’exige pas de mot initial en français. οὖν est rendu par « donc », qui relie la fatigue de Jésus à la situation décrite.
theological_decisions:
- issue: Équivalence moderne de « la sixième heure »
  choice: Conserver « environ la sixième heure » dans le texte principal.
  alternative: « Environ midi » selon le décompte juif habituel des heures diurnes; environ 18 heures selon l’hypothèse d’un décompte romain.
  rationale: Le grec ne précise pas le système de calcul. La formulation littérale maintient l’incertitude chronologique au lieu de résoudre dans la traduction une question discutée.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe reste simple et accessible. Les notes préservent les ambiguïtés de πηγή, de οὕτως et du mode de calcul de la sixième heure sans alourdir le texte principal.
