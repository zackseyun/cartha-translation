id: JHN.4.34
reference: John 4:34
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: λέγει αὐτοῖς ὁ Ἰησοῦς· Ἐμὸν βρῶμά ἐστιν ἵνα ⸀ποιήσω τὸ θέλημα τοῦ πέμψαντός με καὶ τελειώσω αὐτοῦ τὸ ἔργον.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/034.yaml
  text: Jesus said to them[b][a], “My food is to do the will of him who sent me and to complete his work.”
translation:
  language: fr
  text: 'Jésus leur dit : « Ma nourriture, c’est de faire la volonté de celui qui m’a envoyé[b] et d’accomplir son œuvre[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « d’achever son œuvre » ou « de mener son œuvre à son terme ».'
    reason: lexical_alternative
  - marker: b
    text: Dans le contexte, « celui qui m’a envoyé » désigne le Père, bien que le grec ne lui donne pas explicitement ce titre ici.
    reason: cross_reference
lexical_decisions:
- source_word: βρῶμά
  choice: nourriture
  rationale: Le nom désigne ordinairement la nourriture. Ce choix conserve la métaphore concrète, importante dans le contexte où les disciples parlent de manger.
- source_word: Ἐμὸν βρῶμά ἐστιν
  choice: Ma nourriture, c’est
  rationale: Cette tournure française naturelle maintient la métaphore et met en relief « ma nourriture », comme le fait le grec.
- source_word: ἵνα ποιήσω
  choice: c’est de faire
  rationale: Après « ma nourriture », l’infinitif rend naturellement en français la proposition grecque qui précise en quoi consiste cette nourriture.
- source_word: τὸ θέλημα
  choice: la volonté
  rationale: « La volonté » est ici le terme français précis et usuel pour ce que veut celui qui a envoyé Jésus.
- source_word: τοῦ πέμψαντός με
  choice: de celui qui m’a envoyé
  rationale: La proposition relative personnelle rend fidèlement le participe substantivé sans ajouter explicitement le titre « Père », absent du verset grec.
- source_word: τελειώσω
  choice: d’accomplir
  rationale: Le verbe peut exprimer l’action de mener quelque chose à son achèvement. « Accomplir » convient à une œuvre confiée et conserve la nuance de réalisation complète.
- source_word: ἔργον
  choice: œuvre
  rationale: « Œuvre » rend naturellement ἔργον dans ce contexte de mission divine et s’accorde bien avec le verbe « accomplir ».
- source_word: λέγει αὐτοῖς ὁ Ἰησοῦς
  choice: Jésus leur dit
  rationale: Le présent historique grec est rendu par le présent de narration français « dit », forme naturelle et idiomatique dans un récit.
theological_decisions:
- issue: Identité de « celui qui m’a envoyé »
  choice: 'Conserver la désignation implicite : « celui qui m’a envoyé ».'
  alternative: 'Expliciter : « le Père qui m’a envoyé ».'
  rationale: Dans le contexte johannique, cette expression renvoie au Père, mais le grec ne donne pas ici ce titre. Le texte traduit préserve donc l’implicite, tandis que la note fournit l’éclairage contextuel.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation garde la métaphore concrète de la nourriture, l’identité implicite de celui qui envoie Jésus et la nuance d’achèvement portée par τελειόω.
