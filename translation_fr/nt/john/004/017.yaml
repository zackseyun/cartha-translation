  text: ἀπεκρίθη ἡ γυνὴ καὶ εἶπεν ⸀αὐτῷ· Οὐκ ἔχω ἄνδρα. λέγει αὐτῇ ὁ Ἰησοῦς· Καλῶς εἶπας ὅτι Ἄνδρα οὐκ ἔχω·
base_translation:
  language: en
  yaml_path: translation/nt/john/004/017.yaml
  text: 'The woman answered and said to him[a], “I do not have a husband.” Jesus said to her[b], “You have spoken well: ‘I do not have a husband.’”'
translation:
  language: fr
  text: 'La femme lui répondit : « Je n’ai pas de mari[a]. » Jésus lui dit : « Tu as bien dit : “Je n’ai pas de mari.” »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot grec peut signifier « homme » ou « mari » ; ici, le contexte indique « mari ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη ἡ γυνὴ καὶ εἶπεν
  choice: La femme lui répondit
  rationale: La formule grecque associe littéralement « répondit » et « dit ». En français narratif moderne, « répondit » exprime naturellement les deux éléments sans lourde redondance.
- source_word: Οὐκ ἔχω ἄνδρα
  choice: Je n’ai pas de mari
  rationale: Le nom ἀνήρ peut désigner un homme ou un mari. Le contexte immédiat, notamment le verset suivant, montre qu’il est ici question de la situation conjugale de la femme.
- source_word: λέγει
  choice: dit
  rationale: Le présent historique grec est rendu par le passé simple, temps naturel du récit en français écrit.
- source_word: Καλῶς εἶπας
  choice: Tu as bien dit
  rationale: Cette tournure française conserve l’approbation exprimée par καλῶς tout en restant naturelle et digne.
- source_word: ὅτι
  choice: ':'
  rationale: ὅτι introduit ici le contenu des paroles précédentes. Les deux-points suivis de la citation rendent cette fonction clairement en français.
- source_word: Ἄνδρα οὐκ ἔχω
  choice: Je n’ai pas de mari
  rationale: La répétition est maintenue puisque Jésus reprend explicitement les paroles de la femme; l’ordre marqué du grec n’exige pas une inversion artificielle en français.
theological_decisions:
- issue: Sens de ἀνήρ dans la déclaration de la femme
  choice: mari
  alternative: homme
  rationale: Les deux sens sont lexicalement possibles, mais la discussion sur les unions de la femme au verset suivant établit le sens conjugal ici, sans qu’il soit nécessaire d’ajouter une interprétation doctrinale.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple convient au registre narratif biblique sans archaïsme excessif. Les paroles directes emploient le passé composé, naturel dans le dialogue.
