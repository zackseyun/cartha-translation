source:
  edition: SBLGNT
  text: οὐχ ὑμεῖς λέγετε ὅτι Ἔτι τετράμηνός ἐστιν καὶ ὁ θερισμὸς ἔρχεται; ἰδοὺ λέγω ὑμῖν, ἐπάρατε τοὺς ὀφθαλμοὺς ὑμῶν καὶ θεάσασθε τὰς χώρας ὅτι λευκαί εἰσιν πρὸς θερισμόν· ἤδη
base_translation:
  language: en
  yaml_path: translation/nt/john/004/035.yaml
  text: 'Do you not say[a], ‘There are still four months, and then the harvest comes’? Look, I tell you: lift up your eyes and see the fields, that they are white for harvest already.'
translation:
  language: fr
  text: 'Ne dites-vous pas : « Encore quatre mois, et la moisson arrive » ? Voyez, je vous le dis : levez les yeux et regardez les champs ; ils sont déjà blancs[a] pour la moisson.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ils sont déjà mûrs pour la moisson ». Le grec dit littéralement « blancs », image visuelle qui indique que les champs sont prêts à être moissonnés.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχ ὑμεῖς λέγετε
  choice: Ne dites-vous pas
  rationale: La question négative est rendue naturellement en français. Le pronom inclus dans la forme verbale suffit ici à porter l’adresse aux disciples sans alourdir la phrase par « vous-mêmes ».
- source_word: Ἔτι τετράμηνός ἐστιν
  choice: Encore quatre mois
  rationale: Cette tournure française concise exprime naturellement le délai qui reste avant la moisson.
- source_word: ὁ θερισμὸς ἔρχεται
  choice: la moisson arrive
  rationale: Le présent grec est conservé par un présent français naturel. « Moisson » maintient à la fois l’événement agricole et l’image développée dans le verset.
- source_word: ἰδοὺ λέγω ὑμῖν
  choice: Eh bien, je vous le dis
  rationale: « Eh bien » attire l’attention et marque la transition avec naturel, tandis que « je vous le dis » rend explicitement le destinataire sans recourir à l’archaïque « voici » dans cette construction.
- source_word: ἐπάρατε τοὺς ὀφθαλμοὺς ὑμῶν
  choice: levez les yeux
  rationale: Cette expression française courante conserve l’image concrète et l’impératif du grec.
- source_word: θεάσασθε
  choice: regardez
  rationale: Le verbe grec appelle une observation attentive ; « regardez » le rend plus directement que le simple constat « voyez ».
- source_word: τὰς χώρας
  choice: les champs
  rationale: Dans ce contexte de moisson, le terme désigne naturellement les terres cultivées plutôt que des régions au sens large.
- source_word: λευκαί εἰσιν
  choice: ils sont blancs
  rationale: La traduction garde la couleur explicitement nommée par le grec et ne remplace pas silencieusement l’image par son interprétation, « mûrs ».
- source_word: πρὸς θερισμόν
  choice: pour la moisson
  rationale: Cette formulation concise conserve l’image agricole et la destination exprimée par la préposition.
- source_word: ἤδη
  choice: déjà
  rationale: « Déjà » souligne que les champs sont dès maintenant en état d’être moissonnés, en contraste avec l’attente de quatre mois évoquée au début.
theological_decisions:
- issue: Faut-il expliciter dans le texte la portée spirituelle de la moisson ?
  choice: Conserver uniquement l’image agricole dans la traduction.
  alternative: Paraphraser en disant que des personnes sont déjà prêtes à être rassemblées.
  rationale: Dans le contexte, la moisson peut désigner métaphoriquement des personnes prêtes à recevoir le message, mais le grec laisse cette portée s’exprimer par l’image elle-même. L’expliciter dans le corps du texte supprimerait une part de sa force et de son ouverture.
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve les impératifs imagés (« levez les yeux ») ainsi que l’expression inhabituelle mais signifiante « blancs pour la moisson », éclairée par une note.
