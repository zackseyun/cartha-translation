  text: λέγει αὐτῇ ὁ Ἰησοῦς· Ἐγώ εἰμι, ὁ λαλῶν σοι.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/026.yaml
  text: Jesus said to her[a], “I am, the one speaking to you.”
translation:
  language: fr
  text: 'Jésus lui dit : « Je le suis, moi qui te parle. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: dit
  rationale: Le présent historique grec est rendu par le passé simple, temps naturel du récit en français écrit.
- source_word: αὐτῇ
  choice: lui
  rationale: Le datif marque ici le destinataire féminin; « lui » est la formulation française naturelle.
- source_word: Ἐγώ εἰμι
  choice: Je le suis
  rationale: Dans le contexte immédiat, Jésus s’identifie comme le Messie attendu. Le pronom « le », nécessaire à une formulation française naturelle, reprend cette identité sans l’expliciter davantage.
- source_word: ὁ λαλῶν σοι
  choice: moi qui te parle
  rationale: Cette tournure rend naturellement le participe substantivé et présent, tout en conservant l’insistance personnelle de l’expression grecque.
theological_decisions:
- issue: Faut-il expliciter l’identification messianique dans le texte principal ?
  choice: Employer « Je le suis » sans ajouter « le Messie ».
  alternative: « C’est moi, le Messie » ou, de façon plus littérale, « Moi, je suis, celui qui te parle ».
  rationale: Le verset précédent fournit clairement l’antécédent messianique, mais le grec n’énonce aucun prédicat après « je suis ». La traduction garde donc l’identification implicite et signale en note la forme concise de l’original, préservant ainsi sa possible résonance théologique.
translation_notes:
  register: Français moderne, courant et digne. « Je le suis, moi qui te parle » reste naturel à l’oral comme à l’écrit, tout en conservant la concision et l’insistance du grec.
