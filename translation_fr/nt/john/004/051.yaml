id: JHN.4.51
reference: John 4:51
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἤδη δὲ αὐτοῦ καταβαίνοντος οἱ δοῦλοι αὐτοῦ ⸀ὑπήντησαν ⸀αὐτῷ λέγοντες ὅτι ὁ παῖς ⸀αὐτοῦ ζῇ.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/051.yaml
  text: And while he was already going down[a], his servants met him, saying that his child was alive.
translation:
  language: fr
  text: Alors qu’il descendait déjà, ses serviteurs vinrent à sa rencontre et lui dirent que son enfant était vivant[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « son fils » ou « son serviteur ». Le grec pais peut signifier « enfant », « garçon » ou, dans certains contextes, « serviteur ».
    reason: Alternative lexicale préservant l’étendue sémantique de παῖς.
lexical_decisions:
- source_word: ἤδη
  choice: déjà
  rationale: Indique que la descente était déjà en cours au moment de la rencontre.
- source_word: δὲ
  choice: Alors que
  rationale: Le connecteur fait progresser le récit sans marquer ici une opposition forte; intégré à la proposition temporelle, il donne un français naturel.
- source_word: καταβαίνοντος
  choice: il descendait
  rationale: Le participe présent dans le génitif absolu décrit une action en cours et simultanée; «descendre» convient au trajet de Cana vers Capernaüm.
- source_word: δοῦλοι
  choice: serviteurs
  rationale: Dans ce cadre domestique, le terme désigne des personnes placées sous l’autorité de l’officier. «Serviteurs» est clair en français actuel, sans nier que le mot grec peut désigner des esclaves.
- source_word: ὑπήντησαν αὐτῷ
  choice: vinrent à sa rencontre
  rationale: Rend la nuance possible d’un déplacement effectué pour aller rencontrer quelqu’un, plus explicitement que le simple «rencontrèrent».
- source_word: λέγοντες
  choice: et lui dirent
  rationale: Transforme naturellement en français le participe d’action concomitante, tout en conservant son lien avec la rencontre.
- source_word: παῖς
  choice: enfant
  rationale: Préserve la largeur sémantique du grec et le sens familial indiqué par le contexte, sans préciser davantage l’âge.
- source_word: ζῇ
  choice: était vivant
  rationale: Dans un récit au passé et un discours indirect, l’imparfait français est naturel tout en gardant le sens littéral «être en vie», sans ajouter explicitement l’idée de guérison.
theological_decisions:
- issue: Référence de παῖς dans le récit de guérison
  choice: son enfant
  alternative: son fils; son serviteur
  rationale: Le contexte familial favorise «enfant», mais παῖς demeure lexicalement plus large. La traduction ne l’harmonise donc pas silencieusement avec υἱός («fils») employé ailleurs dans le passage; la note signale les autres sens possibles.
translation_notes:
  register: Français moderne, international et digne. La phrase suit le mouvement narratif avec une subordination temporelle naturelle. «Serviteurs» est retenu comme terme courant pour le personnel domestique; «était vivant» maintient la formulation sobre du grec.
