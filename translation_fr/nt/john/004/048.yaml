reference: John 4:48
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἶπεν οὖν ὁ Ἰησοῦς πρὸς αὐτόν· Ἐὰν μὴ σημεῖα καὶ τέρατα ἴδητε, οὐ μὴ πιστεύσητε.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/048.yaml
  text: So Jesus said to him[a], “Unless you see signs and wonders, you will certainly not believe.”
translation:
  language: fr
  text: 'Jésus lui dit donc[a] : « Si vous ne voyez pas de signes et de prodiges, vous ne croirez certainement pas. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les verbes « voyez » et « croirez » sont au pluriel en grec ; les paroles de Jésus semblent donc dépasser le seul officier et viser un groupe plus large.
    reason: Le français « vous » ne permet pas à lui seul de distinguer ici le singulier de politesse du pluriel grec.
lexical_decisions:
- source_word: οὖν
  choice: donc
  rationale: Marque la continuité logique et narrative avec l’échange précédent, dans un français naturel.
- source_word: πρὸς αὐτόν
  choice: lui dit
  rationale: Rend directement l’introduction de la parole adressée à cet homme, sans alourdir la phrase.
- source_word: Ἐὰν μὴ
  choice: Si vous ne… pas
  rationale: Cette construction française rend naturellement la condition négative grecque tout en conservant sa force.
- source_word: σημεῖα
  choice: signes
  rationale: Dans Jean, le terme désigne des actes qui renvoient au-delà d’eux-mêmes à leur signification; « signes » préserve cette portée sans explicitation interprétative.
- source_word: τέρατα
  choice: prodiges
  rationale: « Prodiges » est l’équivalent français traditionnel et intelligible dans l’expression « signes et prodiges », et évoque des phénomènes extraordinaires qui suscitent l’étonnement.
- source_word: ἴδητε
  choice: vous voyez
  rationale: Le présent français convient dans la proposition conditionnelle et le pronom « vous » permet de conserver, sans expansion, la forme plurielle du grec.
- source_word: οὐ μὴ πιστεύσητε
  choice: vous ne croirez certainement pas
  rationale: La tournure rend la négation grecque fortement emphatique sans transformer celle-ci en une affirmation temporelle absolue comme pourrait le faire « jamais ».
- source_word: πιστεύσητε
  choice: croirez
  rationale: « Croire » correspond à l’usage johannique habituel de πιστεύω et évite de préciser indûment l’objet ou la nature de la foi.
theological_decisions:
- issue: Nombre et portée des destinataires
  choice: Conserver le singulier dans l’introduction (« lui dit »), puis employer « vous » dans les paroles de Jésus, avec une note signalant le pluriel grec.
  alternative: Comprendre toute la déclaration comme visant uniquement l’officier, ou expliciter le pluriel par « vous tous » / « vous autres ».
  rationale: Le cadre narratif présente Jésus parlant à un seul homme, tandis que les deux verbes de sa déclaration sont au pluriel. La traduction et la note préservent cette tension sans imposer l’identité précise du groupe plus large visé.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche du grec sans être artificielle; « signes et prodiges » conserve le vocabulaire johannique et biblique usuel.
