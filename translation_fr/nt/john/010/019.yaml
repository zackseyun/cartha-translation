  text: ⸀Σχίσμα πάλιν ἐγένετο ἐν τοῖς Ἰουδαίοις διὰ τοὺς λόγους τούτους.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/019.yaml
  text: Because of these words[a], a division arose again among the Jews.
translation:
  language: fr
  text: À cause de ces paroles, une division se produisit de nouveau parmi les Juifs.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les Judéens » ou, dans certains contextes chez Jean, « les chefs juifs ». Ici, « les Juifs » traduit directement le grec, mais, dans cet Évangile, cette expression désigne souvent un groupe particulier selon le contexte, et non le peuple juif dans son ensemble.
    reason: lexical_alternative
lexical_decisions:
- source_word: Σχίσμα
  choice: une division
  rationale: Le nom désigne une déchirure ou une division; ici, il décrit les réactions opposées suscitées par les paroles de Jésus.
- source_word: πάλιν
  choice: de nouveau
  rationale: L’adverbe marque la répétition et rappelle une division antérieure dans le récit.
- source_word: ἐγένετο
  choice: se produisit
  rationale: Le verbe exprime ici la survenue d’un événement; cette tournure est naturelle en français avec « division ».
- source_word: ἐν τοῖς Ἰουδαίοις
  choice: parmi les Juifs
  rationale: Cette traduction suit directement le grec tout en laissant une note préciser que, chez Jean, le groupe visé dépend du contexte.
- source_word: διὰ
  choice: À cause de
  rationale: 'Avec l’accusatif, la préposition exprime la cause: les paroles précédentes provoquent la division.'
- source_word: τοὺς λόγους τούτους
  choice: ces paroles
  rationale: L’expression renvoie aux propos que Jésus vient de tenir; « paroles » est clair, naturel et digne.
theological_decisions:
- issue: Référent de Ἰουδαῖοι dans l’Évangile selon Jean
  choice: « les Juifs » dans le texte, avec une note contextuelle
  alternative: « les Judéens » ou « les chefs juifs »
  rationale: Le grec est conservé sans imposer une identification plus étroite que le contexte ne l’exige. La note prévient toutefois une lecture qui généraliserait le propos à l’ensemble du peuple juif.
translation_notes:
  register: Français international moderne, naturel et digne. L’ordre de la phrase met en relief la cause, comme le grec, tandis que « se produisit de nouveau » conserve la valeur événementielle et répétitive de l’original.
