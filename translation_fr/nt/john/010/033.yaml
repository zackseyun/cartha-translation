id: JHN.10.33
reference: John 10:33
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀπεκρίθησαν αὐτῷ οἱ ⸀Ἰουδαῖοι· Περὶ καλοῦ ἔργου οὐ λιθάζομέν σε ἀλλὰ περὶ βλασφημίας, καὶ ὅτι σὺ ἄνθρωπος ὢν ποιεῖς σεαυτὸν θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/033.yaml
  text: The Jews answered him[a], “We are not stoning you for a good work, but for blasphemy, and because you, being a man, make yourself God.”
translation:
  language: fr
  text: 'Les Juifs lui répondirent : « Ce n’est pas pour une bonne œuvre que nous te lapidons, mais pour blasphème, parce que toi, qui es un homme, tu te fais Dieu[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « un dieu ». Le nom grec traduit par « Dieu » n’a pas d’article ; cette autre traduction est donc grammaticalement possible. Dans ce contexte d’accusation de blasphème, « Dieu » est toutefois le sens le plus probable.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἰουδαῖοι
  choice: Les Juifs
  rationale: Rend directement le terme grec et préserve la manière de parler propre à Jean. Dans ce contexte, il désigne le groupe hostile qui affronte Jésus dans le Temple, sans préciser davantage s’il s’agit des autorités juives ou de Judéens.
- source_word: Περὶ καλοῦ ἔργου
  choice: pour une bonne œuvre
  rationale: La préposition περί avec le génitif indique ici le motif de l’action. « Une bonne œuvre » conserve le singulier et la valeur morale de καλοῦ dans un français naturel.
- source_word: λιθάζομέν
  choice: nous te lapidons
  rationale: Le présent grec exprime l’action envisagée comme immédiate dans cette confrontation. Le présent français en conserve la vivacité sans ajouter explicitement une intention future.
- source_word: βλασφημίας
  choice: blasphème
  rationale: Terme français usuel et précis pour une parole ou une prétention qui porte atteinte à l’honneur de Dieu.
- source_word: ἄνθρωπος ὢν
  choice: toi, qui es un homme
  rationale: 'Cette formulation garde le contraste accusateur du grec : selon les interlocuteurs, Jésus est un homme qui s’attribue un statut divin. Elle évite d’ajouter « seulement », absent du texte.'
- source_word: ποιεῖς σεαυτὸν θεόν
  choice: tu te fais Dieu
  rationale: La construction signifie « se faire » ou « se présenter comme » quelqu’un. Dans le contexte monothéiste et celui de l’accusation de blasphème, « Dieu » exprime le plus probablement la portée de l’accusation, tout en signalant l’autre possibilité en note.
theological_decisions:
- issue: Sens de θεόν sans article dans l’accusation ποιεῖς σεαυτὸν θεόν
  choice: Dieu
  alternative: un dieu
  rationale: L’absence d’article permet grammaticalement la traduction « un dieu », mais le contexte immédiat de l’accusation de blasphème indique plus probablement que les adversaires reprochent à Jésus de s’attribuer un statut appartenant à Dieu. La variante est maintenue en note afin de préserver l’ambiguïté grammaticale réelle.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve l’insistance de « toi » et le contraste entre l’humanité de Jésus et la prétention que lui attribuent ses accusateurs.
