  yaml_path: translation/nt/john/010/042.yaml
  text: And many believed in him there.
translation:
  language: fr
  text: Et là, beaucoup crurent en lui.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: Et
  rationale: Conjonction de coordination simple qui relie ce constat au récit précédent sans ajouter de nuance causale ou temporelle.
- source_word: πολλοὶ
  choice: beaucoup
  rationale: L’adjectif substantivé désigne un grand nombre de personnes; « beaucoup » est naturel en français et n’explicite pas inutilement « de personnes ».
- source_word: ἐπίστευσαν
  choice: crurent
  rationale: L’aoriste de πιστεύω présente ici l’acte de croire; le passé simple convient au registre narratif biblique soutenu tout en restant clair.
- source_word: εἰς αὐτόν
  choice: en lui
  rationale: Avec πιστεύω, cette construction exprime une foi ou une confiance dirigée vers Jésus; « croire en lui » est l’équivalent français idiomatique et direct.
- source_word: ἐκεῖ
  choice: là
  rationale: L’adverbe locatif renvoie au lieu mentionné dans le contexte; placé après « Et », « là » conserve naturellement son relief narratif.
theological_decisions:
- issue: Portée de πιστεύω εἰς αὐτόν dans un contexte de foi en Jésus
  choice: crurent en lui
  alternative: mirent leur foi en lui
  rationale: « Crurent en lui » préserve le langage johannique de la foi dirigée vers Jésus sans préciser davantage la nature ou le degré de cette foi que ne le fait le texte grec.
translation_notes:
  register: Français international moderne, concis et digne. Le passé simple maintient la continuité du récit littéraire; l’antéposition de « là » rend l’emphase locative du grec sans lourdeur.
