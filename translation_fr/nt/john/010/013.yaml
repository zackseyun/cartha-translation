id: JHN.10.13
reference: John 10:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸀ὅτι μισθωτός ἐστιν καὶ οὐ μέλει αὐτῷ περὶ τῶν προβάτων.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/013.yaml
  text: because he is a hired hand and does not care about the sheep.
translation:
  language: fr
  text: parce qu’il est salarié et ne se soucie pas des brebis.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: parce que
  rationale: Dans le contexte, la conjonction introduit la raison de la fuite mentionnée juste avant. « Parce que » exprime naturellement cette valeur causale en français moderne.
- source_word: μισθωτός
  choice: salarié
  rationale: Le mot désigne quelqu’un qui travaille contre rémunération, par contraste avec le berger auquel les brebis appartiennent. « Salarié » est courant et précis; « mercenaire » ajouterait facilement une nuance péjorative plus forte que le terme grec lui-même.
- source_word: οὐ μέλει αὐτῷ περὶ
  choice: ne se soucie pas de
  rationale: Cette tournure impersonnelle exprime l’absence de souci ou d’intérêt pour quelqu’un. « Ne se soucie pas de » est idiomatique et conserve la portée morale de l’affirmation.
- source_word: τῶν προβάτων
  choice: des brebis
  rationale: La traduction directe préserve l’image pastorale du discours. « Troupeau » serait plus collectif et légèrement plus interprétatif.
theological_decisions:
- issue: Caractérisation du salarié par contraste avec le bon berger
  choice: Formuler directement son absence de souci pour les brebis, sans préciser davantage son identité.
  alternative: Identifier le salarié à une catégorie déterminée de faux dirigeants, ou atténuer le contraste en simple distance professionnelle.
  rationale: Le verset explique son comportement par son statut de salarié et son manque de souci pour les brebis. La traduction conserve ce contraste éthique sans importer une identification doctrinale absente du texte.
translation_notes:
  register: Français international moderne, naturel et digne. La proposition commence par une minuscule, car elle poursuit syntaxiquement la phrase du verset précédent.
source_grounding:
  english_pob_role: consult_only
