  text: ὁ πατήρ μου ⸀ὃ δέδωκέν ⸀μοι ⸂πάντων μεῖζων⸃ ἐστίν, καὶ οὐδεὶς δύναται ἁρπάζειν ἐκ τῆς χειρὸς τοῦ ⸀πατρός.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/029.yaml
  text: My Father[a], who has given them to me, is greater than all, and no one is able to snatch them out of the Father's hand.
translation:
  language: fr
  text: Mon Père[a], qui me les a données, est plus grand que tout, et personne ne peut les arracher de la main du Père.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « Mon Père, ce qu’il m’a donné, est plus grand que tout. » La formulation grecque est difficile ; certains comprennent que le sujet de la comparaison est le don lui-même plutôt que les personnes données.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ πατήρ μου
  choice: Mon Père
  rationale: Expression française naturelle qui préserve la relation filiale exprimée par le possessif.
- source_word: ὃ δέδωκέν μοι
  choice: qui me les a données
  rationale: Le relatif neutre singulier est syntaxiquement difficile; dans le contexte des brebis des versets 27–28, le français explicite le référent personnel collectif par « les ». Le passé composé rend l’acte accompli dont le résultat demeure.
- source_word: πάντων μεῖζων
  choice: plus grand que tous
  rationale: Cette formulation conserve la portée large de πάντων sans préciser indûment s’il s’agit de personnes ou de toutes choses.
- source_word: οὐδεὶς δύναται ἁρπάζειν
  choice: personne ne peut les arracher
  rationale: « Ne peut » exprime naturellement l’incapacité, tandis qu’« arracher » communique l’idée d’enlèvement énergique et reprend adéquatement l’image du contexte.
- source_word: ἐκ τῆς χειρὸς τοῦ πατρός
  choice: de la main du Père
  rationale: La formulation française idiomatique préserve la métaphore de la main comme lieu de possession, de puissance et de protection.
theological_decisions:
- issue: Difficulté textuelle et syntaxique de ὃ δέδωκέν μοι
  choice: Comprendre le relatif d’après les brebis du contexte et traduire « qui me les a données »
  alternative: « Mon Père, ce qu’il m’a donné, est plus grand que tout » ou « Ce que mon Père m’a donné est plus grand que tout »
  rationale: Le grec imprimé est difficile et la tradition manuscrite varie. Le contexte immédiat concerne les brebis données au Fils et que nul ne peut arracher. Le texte principal rend ce lien intelligible, tandis qu’une note conserve l’autre analyse possible.
- issue: Portée de la comparaison πάντων μεῖζων
  choice: « plus grand que tous »
  alternative: « plus grand que tout » ou « plus grand que toutes choses »
  rationale: Le grec permet une portée générale. La traduction évite de réduire la comparaison aux seules personnes ou de l’étendre explicitement aux seules choses.
translation_notes:
  register: Français international moderne, digne et accessible. « Arracher de la main » maintient l’image forte du texte et le lien lexical avec le verset précédent. L’accord féminin pluriel de « données » renvoie aux brebis.
