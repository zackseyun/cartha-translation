id: JHN.10.12
reference: John 10:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ ⸀μισθωτὸς καὶ οὐκ ὢν ποιμήν, οὗ οὐκ ⸀ἔστιν τὰ πρόβατα ἴδια, θεωρεῖ τὸν λύκον ἐρχόμενον καὶ ἀφίησιν τὰ πρόβατα καὶ φεύγει— καὶ ὁ λύκος ἁρπάζει αὐτὰ καὶ ⸀σκορπίζει—
base_translation:
  language: en
  yaml_path: translation/nt/john/010/012.yaml
  text: The hired hand[a], who is not a shepherd and whose sheep are not his own, sees the wolf coming and leaves the sheep and flees—and the wolf snatches them and scatters them.
translation:
  language: fr
  text: Le salarié, qui n’est pas berger et à qui les brebis n’appartiennent pas, voit venir le loup, laisse[a] les brebis et s’enfuit ; le loup les saisit et les disperse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « abandonne les brebis ».'
    reason: Le verbe ἀφίημι peut ici désigner non seulement le fait de laisser, mais celui d’abandonner les brebis face au danger.
lexical_decisions:
- source_word: μισθωτός
  choice: salarié
  rationale: Désigne une personne qui travaille contre rémunération. « Salarié » est actuel et concis, sans la nuance péjorative intrinsèque que peut avoir « mercenaire » en français moderne.
- source_word: οὐκ ὢν ποιμήν
  choice: qui n’est pas berger
  rationale: La proposition relative rend naturellement le participe grec tout en maintenant l’affirmation qu’il n’est pas berger.
- source_word: οὗ οὐκ ἔστιν τὰ πρόβατα ἴδια
  choice: à qui les brebis n’appartiennent pas
  rationale: Cette formulation exprime clairement l’absence d’appartenance personnelle indiquée par ἴδια, sans alourdir la phrase.
- source_word: θεωρεῖ τὸν λύκον ἐρχόμενον
  choice: voit venir le loup
  rationale: Expression française naturelle qui conserve la perception du danger en train d’approcher.
- source_word: ἀφίησιν
  choice: laisse
  rationale: Équivalent direct qui peut, dans ce contexte, prendre le sens plus fort d’abandonner; cette possibilité est signalée en note.
- source_word: φεύγει
  choice: s’enfuit
  rationale: Rend avec naturel et vivacité la fuite devant le danger.
- source_word: ἁρπάζει αὐτά
  choice: les saisit
  rationale: « Saisit » exprime l’action violente du prédateur sans ajouter une issue précise, telle que la mise à mort, que le grec n’énonce pas.
- source_word: σκορπίζει
  choice: les disperse
  rationale: Conserve l’image des brebis séparées les unes des autres; le pronom reprend explicitement les brebis.
theological_decisions:
- issue: Portée métaphorique de l’image pastorale
  choice: Conserver les termes concrets « berger », « brebis » et « loup », ainsi que le statut de « salarié », sans les remplacer par une interprétation.
  alternative: Employer des termes explicatifs tels que « dirigeant », « fidèles » ou « ennemi ».
  rationale: Le discours de Jean 10 repose sur une métaphore pastorale soutenue. L’expliciter dans le corps du texte réduirait sa richesse et introduirait une interprétation absente de la formulation grecque.
translation_notes:
  register: Français international moderne, clair et digne. « Salarié » évite l’archaïsme et la charge morale préalable de « mercenaire »; le contexte fait lui-même ressortir le contraste avec le véritable berger.
