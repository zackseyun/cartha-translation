  text: ἀπεκρίθη αὐτοῖς ὁ Ἰησοῦς· Πολλὰ ⸂ἔργα καλὰ ἔδειξα ὑμῖν⸃ ἐκ τοῦ ⸀πατρός· διὰ ποῖον αὐτῶν ἔργον ⸂ἐμὲ λιθάζετε⸃;
base_translation:
  language: en
  yaml_path: translation/nt/john/010/032.yaml
  text: Jesus answered them[a], “I showed you many good works from the Father[b]; for which of them are you stoning me?”
translation:
  language: fr
  text: 'Jésus leur répondit : « Je vous ai montré beaucoup de bonnes œuvres venant du Père[a] ; à cause de laquelle de ces œuvres me lapidez-vous ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec dit simplement « du Père », et non « de mon Père ».
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθη αὐτοῖς ὁ Ἰησοῦς
  choice: Jésus leur répondit
  rationale: Formulation narrative naturelle en français, qui conserve le sens ordinaire du verbe ἀποκρίνομαι et les destinataires de la réponse.
- source_word: Πολλὰ ἔργα καλὰ
  choice: beaucoup de bonnes œuvres
  rationale: « Œuvres » préserve le vocabulaire johannique des actes de Jésus, tandis que « bonnes » rend la qualité bénéfique et digne exprimée par καλά.
- source_word: ἔδειξα ὑμῖν
  choice: je vous ai montré
  rationale: Le passé composé convient naturellement au discours direct en français moderne et « montré » conserve l’idée de rendre les œuvres visibles ou manifestes.
- source_word: ἐκ τοῦ πατρός
  choice: venant du Père
  rationale: Cette formulation exprime clairement l’origine indiquée par ἐκ, sans ajouter le possessif « mon », absent du texte grec.
- source_word: διὰ ποῖον αὐτῶν ἔργον
  choice: pour laquelle de ces œuvres
  rationale: « Pour » exprime ici la cause ou le motif, et la tournure conserve la référence à une œuvre particulière parmi celles qui viennent d’être mentionnées.
- source_word: ἐμὲ λιθάζετε
  choice: me lapidez-vous
  rationale: Le présent français maintient la force directe de l’indicatif présent grec sans ajouter explicitement l’idée de tentative ou d’intention.
theological_decisions:
- issue: Désignation du Père dans les paroles de Jésus
  choice: du Père
  alternative: de mon Père
  rationale: Le grec porte simplement τοῦ πατρός, sans pronom possessif. La traduction conserve donc la formulation du texte tout en laissant le contexte préciser la relation entre Jésus et le Père.
- issue: Origine ou mandat des œuvres
  choice: venant du Père
  alternative: accomplies au nom du Père
  rationale: La préposition ἐκ indique d’abord la source ou l’origine. Une formulation comme « au nom du Père » introduirait l’idée plus précise de mandat ou de représentation, qui n’est pas explicitement formulée ici.
translation_notes:
  register: Français moderne, digne et direct. La formulation garde le terme johannique « œuvres » et la question accusatrice de Jésus, sans expliciter davantage l’intention de ses interlocuteurs.
