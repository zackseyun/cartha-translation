id: JHN.10.3
reference: John 10:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τούτῳ ὁ θυρωρὸς ἀνοίγει, καὶ τὰ πρόβατα τῆς φωνῆς αὐτοῦ ἀκούει καὶ τὰ ἴδια πρόβατα ⸀φωνεῖ κατ’ ὄνομα καὶ ἐξάγει αὐτά.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/003.yaml
  text: To him the gatekeeper opens[a], and the sheep hear his voice, and he calls his own sheep by name and leads them out.
translation:
  language: fr
  text: Le gardien lui ouvre, les brebis entendent sa voix, et il appelle ses propres brebis par leur nom et les mène dehors.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les fait sortir ».'
    reason: Alternative lexicale pour ἐξάγει, qui peut mettre davantage l’accent sur le fait de faire sortir que sur l’action de guider.
lexical_decisions:
- source_word: τούτῳ
  choice: lui
  rationale: Le datif renvoie au berger du verset précédent. « Lui » est naturel en français et conserve la référence personnelle sans explicitation interprétative.
- source_word: ὁ θυρωρός
  choice: le gardien
  rationale: Dans le cadre de l’enclos, « le gardien » désigne naturellement celui qui surveille et ouvre l’entrée. « Portier » serait possible, mais évoque plus facilement un bâtiment.
- source_word: ἀνοίγει
  choice: ouvre
  rationale: Le présent actif simple est rendu directement et naturellement.
- source_word: τὰ πρόβατα
  choice: les brebis
  rationale: « Brebis » est le terme traditionnel et courant dans cette image pastorale; le pluriel français commande un verbe au pluriel malgré le verbe grec au singulier avec un sujet neutre pluriel.
- source_word: τῆς φωνῆς αὐτοῦ ἀκούει
  choice: entendent sa voix
  rationale: Cette formulation conserve à la fois la perception et la reconnaissance suggérées par le contexte, sans renforcer le sens en « obéissent » ou « écoutent ».
- source_word: τὰ ἴδια πρόβατα
  choice: ses propres brebis
  rationale: « Propres » rend l’insistance de ἴδια sur l’appartenance et la relation particulière.
- source_word: φωνεῖ
  choice: appelle
  rationale: « Appelle » est le verbe français naturel dans le contexte du berger qui connaît et fait sortir ses brebis.
- source_word: κατ’ ὄνομα
  choice: par leur nom
  rationale: L’expression indique un appel individuel. Avec le collectif pluriel « brebis », « par leur nom » est idiomatique et clair.
- source_word: ἐξάγει αὐτά
  choice: les conduit dehors
  rationale: ἐξάγω peut signifier faire sortir, mener dehors ou conduire dehors. « Conduit dehors » préserve ici l’idée de direction personnelle propre à l’image du berger.
theological_decisions:
- issue: Image du berger et identité de l’acteur
  choice: Conserver les référents sous la forme « lui » et « il », comme dans le grec.
  alternative: Nommer explicitement Jésus ou le berger dans ce verset.
  rationale: Le contexte permet d’identifier le personnage, mais le verset lui-même poursuit l’image sans explicitation christologique. La traduction ne doit pas résoudre l’image à la place du texte.
- issue: Portée de l’écoute des brebis
  choice: « entendent sa voix »
  alternative: « écoutent sa voix » ou « obéissent à sa voix »
  rationale: « Entendent » rend directement ἀκούει et laisse au contexte la nuance de reconnaissance ou de réponse, sans introduire explicitement l’obéissance.
translation_notes:
  register: Français international moderne, fluide et digne. La répétition de « brebis » est conservée parce qu’elle porte l’accent du grec sur celles qui appartiennent en propre au berger. Le marqueur de note [a] est placé après « dehors », le mot concerné.
