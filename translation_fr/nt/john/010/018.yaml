id: JHN.10.18
reference: John 10:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὐδεὶς ⸀αἴρει αὐτὴν ἀπ’ ἐμοῦ, ἀλλ’ ἐγὼ τίθημι αὐτὴν ἀπ’ ἐμαυτοῦ. ἐξουσίαν ἔχω θεῖναι αὐτήν, καὶ ἐξουσίαν ἔχω πάλιν λαβεῖν αὐτήν· ταύτην τὴν ἐντολὴν ἔλαβον παρὰ τοῦ πατρός μου.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/018.yaml
  text: No one takes it from me[a], but I lay it down of myself. I have authority to lay it down, and I have authority to take it up again[c][b]. This command I received from my Father.
translation:
  language: fr
  text: Personne ne me l’enlève, mais je la donne de moi-même[a]. J’ai l’autorité[b] de la donner et l’autorité de la reprendre[c]. Ce commandement, je l’ai reçu de mon Père.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de ma propre initiative ». L’expression souligne que Jésus donne sa vie volontairement, sans nier le commandement reçu du Père.
    reason: lexical_alternative
  - marker: b
    text: Ou « le pouvoir » ou « le droit ». Le terme grec peut désigner à la fois la capacité d’agir et l’autorisation légitime.
    reason: lexical_alternative
  - marker: c
    text: C’est-à-dire reprendre sa vie ; le pronom « la » renvoie à « ma vie » au verset 17.
    reason: cross_reference
lexical_decisions:
- source_word: αἴρει αὐτὴν ἀπ’ ἐμοῦ
  choice: ne me l’enlève
  rationale: « Enlever » exprime naturellement l’idée de prendre la vie de Jésus contre son gré et fait ressortir le contraste avec le don volontaire qui suit.
- source_word: τίθημι αὐτήν / θεῖναι αὐτήν
  choice: je la donne / de la donner
  rationale: En français, « donner sa vie » est l’expression naturelle dans ce contexte. Elle rend le geste volontaire exprimé par τίθημι tout en maintenant le pronom féminin qui renvoie à « ma vie » au verset précédent.
- source_word: ἀπ’ ἐμαυτοῦ
  choice: de moi-même
  rationale: Cette formulation conserve la force réflexive et souligne que Jésus agit volontairement, sans développer le grec en une paraphrase telle que « de ma propre initiative ».
- source_word: ἐξουσίαν
  choice: le pouvoir
  rationale: Dans la construction française « avoir le pouvoir de », le terme peut désigner à la fois la capacité et l’autorité légitime. Une note conserve explicitement cette amplitude sémantique.
- source_word: πάλιν λαβεῖν αὐτήν
  choice: la reprendre
  rationale: « Reprendre » exprime avec concision l’idée de prendre de nouveau et convient au retour à la vie évoqué ici, sans préciser davantage le mode de l’action.
- source_word: ἐντολήν
  choice: commandement
  rationale: « Commandement » correspond directement à ἐντολή et préserve la relation d’obéissance au Père sans l’atténuer en simple mission.
- source_word: παρὰ τοῦ πατρός μου
  choice: de mon Père
  rationale: La préposition παρά avec le génitif indique ici la source; « de mon Père » est naturel et conserve le langage relationnel du texte.
theological_decisions:
- issue: Portée de ἐξουσία concernant la mort et la reprise de la vie de Jésus
  choice: le pouvoir
  alternative: l’autorité; le droit
  rationale: « Avoir le pouvoir de » est idiomatique en français et peut inclure tant la capacité effective que l’autorisation légitime. La note évite de réduire le terme à la seule puissance brute ou au seul droit juridique.
- issue: Force de ἀπ’ ἐμαυτοῦ
  choice: de moi-même
  alternative: de ma propre initiative; volontairement
  rationale: La formulation affirme le caractère volontaire du don de Jésus sans suggérer qu’il agirait indépendamment du Père, puisque la fin du verset mentionne le commandement reçu de lui.
- issue: Référent de αὐτήν
  choice: la
  alternative: ma vie
  rationale: Le pronom féminin renvoie à « ma vie » dans le contexte immédiat. Le conserver respecte la cohésion du grec, tandis qu’une note prévient toute ambiguïté lors d’une lecture isolée.
- issue: Sens de πάλιν λαβεῖν dans le contexte de la résurrection
  choice: la reprendre
  alternative: la recevoir de nouveau
  rationale: Le grec permet une nuance de prise ou de réception. « Reprendre » rend naturellement l’action attribuée à Jésus tout en laissant subsister la tension avec le commandement reçu du Père.
translation_notes:
  register: Français international moderne, digne et accessible. « Donner sa vie » et « la reprendre » sont idiomatiques sans effacer le contraste verbal du passage. La dislocation « Ce commandement, je l’ai reçu » reproduit naturellement la mise en relief de l’objet en grec.
