id: JHN.10.4
reference: John 10:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸀ὅταν τὰ ἴδια ⸀πάντα ἐκβάλῃ, ἔμπροσθεν αὐτῶν πορεύεται, καὶ τὰ πρόβατα αὐτῷ ἀκολουθεῖ, ὅτι οἴδασιν τὴν φωνὴν αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/john/010/004.yaml
  text: When he has brought out all his own[a], he goes before them, and the sheep follow him, because they know his voice.
translation:
  language: fr
  text: Quand il a fait sortir toutes celles qui lui appartiennent[a], il marche devant elles, et les brebis le suivent, parce qu’elles connaissent sa voix.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « chassé dehors », « poussé dehors » ou « mené dehors » ; le verbe grec peut évoquer le fait de faire sortir avec une certaine vigueur ou simplement de conduire hors d’un enclos.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: Quand
  rationale: Introduit une proposition temporelle indéfinie avec le subjonctif. « Quand » convient au caractère général de la scène sans insister artificiellement sur la répétition.
- source_word: τὰ ἴδια πάντα
  choice: toutes celles qui lui appartiennent
  rationale: Cette formulation naturelle renvoie, dans le contexte, aux brebis du berger, tout en conservant l’expression d’appartenance du grec sans répéter prématurément le nom « brebis ».
- source_word: ἐκβάλῃ
  choice: a fait sortir
  rationale: Le verbe exprime ici le mouvement hors de l’enclos. « A fait sortir » préserve cette idée sans imposer la nuance brutale que pourrait suggérer « chasser ».
- source_word: ἔμπροσθεν αὐτῶν πορεύεται
  choice: il marche devant elles
  rationale: La formulation restitue simplement l’image spatiale du berger qui prend la tête du troupeau.
- source_word: τὰ πρόβατα αὐτῷ ἀκολουθεῖ
  choice: les brebis le suivent
  rationale: « Brebis » est le terme pastoral courant, et le datif régi par ἀκολουθέω se rend naturellement par un complément direct en français.
- source_word: ὅτι οἴδασιν τὴν φωνὴν αὐτοῦ
  choice: parce qu’elles connaissent sa voix
  rationale: « Parce que » exprime clairement la cause, tandis que « connaissent » conserve le sens premier de οἴδασιν et laisse subsister la nuance contextuelle de reconnaissance.
theological_decisions:
- issue: Image pastorale et force de ἐκβάλῃ
  choice: a fait sortir
  alternative: a chassé dehors / a poussé dehors / a mené dehors
  rationale: Le contexte décrit le berger conduisant ses propres brebis hors de l’enclos, non une expulsion hostile. La traduction conserve le mouvement concret vers l’extérieur sans introduire une idée théologique de coercition.
translation_notes:
  register: Français international moderne, clair et digne. La tournure « toutes celles qui lui appartiennent » préserve l’idée d’appartenance et évite une répétition anticipée de « brebis ». Le féminin des pronoms découle naturellement du référent contextuel.
