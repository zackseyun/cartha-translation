id: JHN.10.5
reference: John 10:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀλλοτρίῳ δὲ οὐ μὴ ⸀ἀκολουθήσουσιν ἀλλὰ φεύξονται ἀπ’ αὐτοῦ, ὅτι οὐκ οἴδασι τῶν ἀλλοτρίων τὴν φωνήν.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/005.yaml
  text: But they will certainly not follow a stranger[a]; instead, they will flee from him[b], because they do not know the voice of strangers.
translation:
  language: fr
  text: Mais elles ne suivront certainement pas un étranger[a] ; au contraire, elles le fuiront, parce qu’elles ne connaissent pas la voix[b] des étrangers.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « elles ne suivront jamais un étranger ». Le grec emploie une négation emphatique (οὐ μή).'
    reason: lexical_alternative
  - marker: b
    text: « Connaître la voix » peut aussi se comprendre comme « reconnaître la voix ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλοτρίῳ
  choice: un étranger
  rationale: Dans l’image du berger et des brebis, le terme désigne quelqu’un qui n’appartient pas à leur cercle familier. « Étranger » est naturel en français et n’introduit pas une idée d’origine ethnique.
- source_word: οὐ μὴ ἀκολουθήσουσιν
  choice: ne suivront certainement pas
  rationale: La double négation οὐ μή avec le futur exprime un refus fortement affirmé. Cette tournure en restitue l’intensité dans un français moderne sans archaïsme.
- source_word: ἀκολουθήσουσιν
  choice: suivront
  rationale: « Suivre » est le verbe le plus direct et le plus naturel dans le contexte des brebis et du berger.
- source_word: φεύξονται ἀπ’ αὐτοῦ
  choice: elles le fuiront
  rationale: Le futur de φεύγω avec ἀπό exprime l’éloignement face à l’étranger. « Le fuiront » conserve la force du verbe et offre une formulation française fluide.
- source_word: οἴδασι
  choice: connaissent
  rationale: οἶδα peut exprimer la connaissance ou la reconnaissance. « Connaissent » préserve l’expression grecque et le contraste relationnel avec la voix familière du berger, sans exclure la nuance de reconnaissance.
- source_word: τῶν ἀλλοτρίων
  choice: des étrangers
  rationale: Le génitif pluriel renvoie à la catégorie des personnes étrangères aux brebis. Le pluriel du grec est conservé.
- source_word: φωνήν
  choice: la voix
  rationale: Dans ce discours, φωνή désigne la voix ou l’appel identifiable d’une personne. « Voix » maintient les dimensions littérale et relationnelle.
- source_word: δὲ ... ἀλλὰ
  choice: Mais ... au contraire
  rationale: Les particules marquent une opposition nette entre ne pas suivre et fuir. Cette construction restitue naturellement ce contraste en français.
theological_decisions:
- issue: Portée métaphorique de l’image des brebis et du berger
  choice: Conserver directement la métaphore sans en expliciter le référent.
  alternative: Identifier dans le texte principal l’« étranger » à un faux enseignant ou à un dirigeant illégitime.
  rationale: Le verset reste dans le cadre de l’image et n’identifie pas explicitement ici le référent de l’étranger. Une explicitation ajouterait une interprétation théologique au texte.
translation_notes:
  register: Français international moderne, digne et accessible. Le pronom féminin pluriel « elles » reprend naturellement les brebis du contexte. La formulation conserve le contraste appuyé du grec ainsi que le passage du singulier « un étranger » au pluriel « des étrangers ».
