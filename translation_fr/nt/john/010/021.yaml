id: JHN.10.21
reference: John 10:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸀ἄλλοι ἔλεγον· Ταῦτα τὰ ῥήματα οὐκ ἔστιν δαιμονιζομένου· μὴ δαιμόνιον δύναται τυφλῶν ὀφθαλμοὺς ⸀ἀνοῖξαι;
base_translation:
  language: en
  yaml_path: translation/nt/john/010/021.yaml
  text: Others were saying[a], “These words are not those of a demon-possessed man. A demon cannot open the eyes of the blind, can it?”
translation:
  language: fr
  text: 'D’autres disaient : « Ces paroles ne sont pas celles d’un homme sous l’emprise d’un démon. Un démon peut-il ouvrir les yeux des aveugles ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄλλοι
  choice: D’autres
  rationale: Marque naturellement le contraste avec le groupe qui parlait au verset précédent.
- source_word: ἔλεγον
  choice: disaient
  rationale: L’imparfait grec évoque une prise de parole en cours ou répétée; l’imparfait français la rend directement.
- source_word: Ταῦτα τὰ ῥήματα
  choice: Ces paroles
  rationale: Désigne les propos prononcés par Jésus; « paroles » est direct, naturel et digne en français.
- source_word: οὐκ ἔστιν δαιμονιζομένου
  choice: ne sont pas celles d’un homme sous l’emprise d’un démon
  rationale: Rend l’expression génitive idiomatique en explicitant que de telles paroles ne caractérisent pas une personne soumise à une influence démoniaque, sans imposer une théorie technique de la possession.
- source_word: μὴ δαιμόνιον δύναται
  choice: Un démon peut-il
  rationale: La question française, dans ce contexte argumentatif, conserve l’attente d’une réponse négative portée par μή sans transformer la phrase en affirmation.
- source_word: τυφλῶν ὀφθαλμοὺς
  choice: les yeux des aveugles
  rationale: Préserve la construction et l’image concrète du grec, ainsi que le lien contextuel avec la guérison de l’aveugle.
- source_word: ἀνοῖξαι
  choice: ouvrir
  rationale: Reproduit l’image explicite de l’ouverture des yeux plutôt que de paraphraser par « rendre la vue ».
theological_decisions:
- issue: Rendu de δαιμονίζομαι et δαιμόνιον
  choice: sous l’emprise d’un démon / un démon
  alternative: possédé par un démon / un démon
  rationale: « Sous l’emprise d’un démon » exprime clairement l’état visé tout en évitant de figer δαιμονίζομαι dans une doctrine technique de la possession; δαιμόνιον reste rendu directement par « démon ».
- issue: Force de la question introduite par μή
  choice: Un démon peut-il ouvrir les yeux des aveugles ?
  alternative: Un démon ne peut tout de même pas ouvrir les yeux des aveugles !
  rationale: La formulation interrogative préserve l’attente d’une réponse négative et le raisonnement des interlocuteurs, sans accentuation interprétative excessive.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe reste accessible, conserve l’image concrète du grec et maintient la portée rhétorique de la question.
