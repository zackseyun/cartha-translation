id: JHN.10.17
reference: John 10:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: διὰ τοῦτό ⸂με ὁ πατὴρ⸃ ἀγαπᾷ ὅτι ἐγὼ τίθημι τὴν ψυχήν μου, ἵνα πάλιν λάβω αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/017.yaml
  text: For this reason the Father loves me[a], because I lay down my life so that I may take it up again.
translation:
  language: fr
  text: 'C’est pour cela que le Père m’aime : je donne ma vie[a] afin de la reprendre.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « mon âme ». Ici, ψυχή désigne le plus naturellement la vie que Jésus donne en mourant et qu’il reprend ensuite.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: C’est pour cela
  rationale: Cette tournure française naturelle conserve le lien causal avec ce qui suit et avec le contexte.
- source_word: με ὁ πατὴρ ἀγαπᾷ
  choice: le Père m’aime
  rationale: Le grec dit « le Père », sans possessif, et place clairement Jésus comme objet de son amour.
- source_word: ὅτι
  choice: ':'
  rationale: Les deux-points introduisent naturellement en français la raison annoncée par « pour cela », sans la lourdeur de « c’est pour cela… parce que ».
- source_word: τίθημι τὴν ψυχήν μου
  choice: je donne ma vie
  rationale: Dans ce contexte, l’expression désigne l’acte volontaire par lequel Jésus livre sa vie à la mort. « Déposer ma vie » serait un calque peu naturel en français moderne.
- source_word: ἵνα
  choice: afin de
  rationale: Cette formulation conserve nettement la valeur de visée ou de but de la proposition grecque.
- source_word: πάλιν λάβω αὐτήν
  choice: la reprendre
  rationale: « Reprendre » exprime idiomatiquement le fait de recouvrer la vie après l’avoir donnée; le préfixe re- rend ici la valeur de πάλιν.
theological_decisions:
- issue: Sens de ψυχή dans le contexte du don volontaire de soi par Jésus
  choice: vie
  alternative: âme
  rationale: Le contexte évoque la mort de Jésus puis la reprise de sa vie. « Âme » risquerait d’introduire une distinction anthropologique que le verset ne met pas en avant.
- issue: Valeur de ἵνα devant λάβω
  choice: afin de la reprendre
  alternative: pour que je la reprenne
  rationale: « Afin de » maintient la visée exprimée par ἵνα sans trancher davantage la relation théologique entre la mort volontaire de Jésus et sa résurrection.
- issue: Lien entre l’amour du Père et le don de la vie de Jésus
  choice: La raison est introduite par deux-points après « C’est pour cela »
  alternative: C’est pour cela que le Père m’aime, parce que…
  rationale: Cette construction garde le lien causal affirmé par le grec tout en évitant une répétition pesante en français; elle ne cherche pas à atténuer la tension théologique de l’énoncé.
translation_notes:
  register: Français international moderne, clair et digne. « Donner sa vie » est idiomatique et conserve l’idée d’un acte volontaire; « afin de » maintient une légère solennité adaptée au discours johannique.
