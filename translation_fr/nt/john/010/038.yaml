  source_fidelity: Le sens général est fidèle au grec. Cependant, « croyez les œuvres » est très peu idiomatique en français pour des œuvres envisagées comme témoignage; « croyez aux œuvres » rend naturellement le datif grec dans ce contexte. La distinction entre γνῶτε et γινώσκητε ne permet pas d’affirmer avec sûreté l’idée de continuité; la conserver dans le texte sous la forme « continuiez à reconnaître » alourdit et interprète la nuance.
  naturalness: « Afin que vous sachiez et reconnaissiez » est fluide, digne et naturel en français international moderne. « Croyez aux œuvres » est la formulation usuelle et compréhensible, sans faire des œuvres un objet de foi religieuse autonome.
