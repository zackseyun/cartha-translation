  text: εἰ δὲ ποιῶ, κἂν ἐμοὶ μὴ πιστεύητε τοῖς ἔργοις ⸀πιστεύετε, ἵνα γνῶτε καὶ ⸀γινώσκητε ὅτι ἐν ἐμοὶ ὁ πατὴρ κἀγὼ ἐν ⸂τῷ πατρί⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/038.yaml
  text: But if I do them[a], even if you do not believe me, believe the works, so that you may know and continue to know that the Father is in me[c][b], and I am in the Father.
translation:
  language: fr
  text: Mais si je les accomplis, même si vous ne me croyez pas[a], croyez aux œuvres, afin que vous sachiez et reconnaissiez[b] que le Père est en moi et que je suis dans le Père.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « même si vous ne croyez pas en moi ». Le grec peut signifier « me croire » ou « croire en moi »; ici, « me croire » correspond bien au contraste avec l’appel à croire aux œuvres.
    reason: lexical_alternative
  - marker: b
    text: 'Les deux formes grecques du verbe « connaître » peuvent suggérer le fait de parvenir à la connaissance, puis d’y demeurer. On pourrait aussi traduire : « afin que vous parveniez à connaître et continuiez à connaître ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιῶ
  choice: je les accomplis
  rationale: Le présent renvoie aux œuvres de Jésus dans le contexte immédiat. Le pronom « les » explicite en français l’objet sous-entendu, repris ensuite par « les œuvres ».
- source_word: κἂν ἐμοὶ μὴ πιστεύητε
  choice: même si vous ne me croyez pas
  rationale: Avec le pronom au datif, πιστεύω peut signifier croire quelqu’un ou croire en lui. Ici, « ne me croyez pas » forme le contraste le plus naturel avec l’appel à croire les œuvres.
- source_word: τοῖς ἔργοις πιστεύετε
  choice: croyez les œuvres
  rationale: Cette formulation compacte conserve la construction grecque et présente les œuvres comme un témoignage à croire, sans suggérer qu’elles seraient elles-mêmes l’objet d’une foi religieuse.
- source_word: ἔργοις
  choice: œuvres
  rationale: « Œuvres » maintient le vocabulaire johannique des actes révélateurs de Jésus; « signes » interpréterait ἔργα comme σημεῖα.
- source_word: ἵνα γνῶτε καὶ γινώσκητε
  choice: afin que vous sachiez et continuiez à reconnaître
  rationale: 'La formulation cherche à rendre la succession de l’aoriste et du présent: parvenir à une connaissance établie, puis demeurer dans une reconnaissance continue. La note signale la nuance et évite de la présenter comme certaine.'
- source_word: ἐν ἐμοὶ ὁ πατὴρ κἀγὼ ἐν τῷ πατρί
  choice: le Père est en moi et je suis dans le Père
  rationale: Les prépositions « en » et « dans » rendent naturellement en français la réciprocité de ἐν tout en conservant l’image de l’inhabitation mutuelle sans paraphrase doctrinale.
- source_word: πατήρ
  choice: le Père
  rationale: Le grec porte l’article et dit « le Père », non « mon Père ».
theological_decisions:
- issue: Inhabitation mutuelle du Père et du Fils
  choice: Conserver la formulation relationnelle directe « le Père est en moi et je suis dans le Père ».
  alternative: « le Père est uni à moi et je suis uni au Père » ou « le Père demeure en moi et je demeure dans le Père »
  rationale: La formulation littérale préserve la force christologique et la tension du texte johannique sans introduire directement une terminologie doctrinale postérieure.
translation_notes:
  register: Français international moderne, digne et accessible. « Accomplir les œuvres » appartient au registre biblique courant sans être archaïque. La répétition conceptuelle de « savoir/reconnaître » est maintenue pour refléter les deux formes grecques, avec une note qui préserve l’incertitude aspectuelle.
