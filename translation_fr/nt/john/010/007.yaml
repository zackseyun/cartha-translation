review_pass:
  verdict: revise
  source_fidelity: 'La structure et les principaux éléments grecs sont bien rendus : οὖν (« donc »), πάλιν (« de nouveau »), l’emphase de ἐγώ (« moi, je »), θύρα (« porte ») et le génitif volontairement non explicité (« des brebis »). En revanche, « Oui, vraiment » ne restitue pas adéquatement la formule johannique redoublée Ἀμὴν ἀμὴν : « oui » introduit une nuance d’assentiment qui n’est pas celle de cette formule déclarative solennelle.'
  naturalness: « Jésus leur dit donc de nouveau » et « moi, je suis la porte des brebis » sont naturels dans un français moderne de registre biblique. « En vérité, en vérité, je vous le dis » est à la fois idiomatique, reconnaissable et solennel. Le repère de note est placé avant la ponctuation finale selon l’usage français courant.
  terminology: « Brebis » convient précisément à l’imagerie pastorale et « porte » conserve la métaphore sans la paraphraser. La note propose « portail », alternative française plus appropriée que « entrée », cette dernière étant plus abstraite et moins directement équivalente à θύρα. Elle maintient aussi « porte pour les brebis » comme explicitation contextuelle possible, sans l’imposer au texte.
  issues:
  - severity: medium
    issue: La formule « Oui, vraiment » pour Ἀμὴν ἀμὴν
    rationale: Elle ne conserve ni le redoublement lexical ni la fonction rhétorique traditionnelle de l’assertion solennelle. « En vérité, en vérité » rend la répétition et la force de la formule sans recourir à un hébraïsme non traduit.
  - severity: low
    issue: « entrée » comme première alternative pour θύρα
    rationale: « Entrée » peut convenir contextuellement, mais désigne plus volontiers le passage ou l’accès que l’objet architectural. « Portail » préserve mieux l’alternative « gate » dans l’image de l’enclos.
  - severity: low
    issue: Position du repère de note
    rationale: En français, le repère se place normalement avant le signe de ponctuation final.
