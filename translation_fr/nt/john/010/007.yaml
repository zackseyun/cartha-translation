source:
  edition: SBLGNT
  text: Εἶπεν οὖν πάλιν ⸀αὐτοῖς ὁ Ἰησοῦς· Ἀμὴν ἀμὴν λέγω ὑμῖν ⸀ὅτι ἐγώ εἰμι ἡ θύρα τῶν προβάτων.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/007.yaml
  text: So Jesus said to them again[a], “Truly, truly, I say to you, I am the door for the sheep.”
translation:
  language: fr
  text: 'Jésus leur dit donc de nouveau : « En vérité, en vérité, je vous le dis : moi, je suis la porte des brebis[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le portail des brebis » ou « la porte pour les brebis ». Le mot grec peut désigner une porte ou un portail, notamment dans l’image d’un enclos pour les brebis.
    reason: Alternative lexicale pour θύρα et explicitation possible, mais non imposée, de la relation exprimée par le génitif τῶν προβάτων.
lexical_decisions:
- source_word: οὖν
  choice: donc
  rationale: Marque la suite logique et narrative de l’échange précédent, de manière naturelle en français.
- source_word: πάλιν
  choice: de nouveau
  rationale: Exprime clairement la répétition de la prise de parole sans lourdeur.
- source_word: Ἀμὴν ἀμὴν
  choice: Oui, vraiment
  rationale: Rend la formule johannique solennelle et emphatique dans un français moderne et compréhensible, sans conserver l’hébraïsme opaque « amen, amen ».
- source_word: λέγω ὑμῖν
  choice: je vous le dis
  rationale: Formulation française idiomatique qui garde la solennité de la déclaration.
- source_word: ἐγώ εἰμι
  choice: moi, je suis
  rationale: Le pronom disjoint « moi » restitue l’insistance portée en grec par le pronom explicite ἐγώ.
- source_word: θύρα
  choice: porte
  rationale: Équivalent direct qui convient aussi à l’entrée d’un enclos; « entrée » reste une possibilité contextuelle.
- source_word: τῶν προβάτων
  choice: des brebis
  rationale: Conserve le génitif grec et son ambiguïté relationnelle, sans préciser arbitrairement « pour les brebis ».
theological_decisions:
- issue: Identification métaphorique de Jésus comme θύρα
  choice: je suis la porte des brebis
  alternative: je suis la porte pour les brebis / l’entrée de l’enclos des brebis
  rationale: La formulation maintient l’image et l’ambiguïté du génitif sans développer la métaphore en explication doctrinale.
translation_notes:
  register: Français international moderne, digne et oralement fluide. La ponctuation met en valeur la déclaration solennelle; « brebis » conserve le vocabulaire traditionnel et précis de l’image pastorale.
