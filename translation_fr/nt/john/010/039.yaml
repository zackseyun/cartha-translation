  text: ἐζήτουν οὖν ⸂πάλιν αὐτὸν⸃ πιάσαι· καὶ ἐξῆλθεν ἐκ τῆς χειρὸς αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/039.yaml
  text: So they were seeking again to seize him[a], but he escaped from their hand.
translation:
  language: fr
  text: Ils cherchaient donc de nouveau à se saisir de lui, mais il leur échappa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « il sortit de leur main »; c’est-à-dire qu’il échappa à leur prise ou à leur pouvoir.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐζήτουν
  choice: ils cherchaient
  rationale: L’imparfait exprime une action en cours ou une tentative répétée dans le passé; « cherchaient à » est naturel en français et en conserve l’aspect.
- source_word: οὖν
  choice: donc
  rationale: Le connecteur marque la conséquence ou la progression par rapport à l’échange précédent.
- source_word: πάλιν
  choice: de nouveau
  rationale: L’expression indique clairement la répétition d’une tentative déjà faite.
- source_word: πιάσαι
  choice: à se saisir de lui
  rationale: Cette formulation conserve l’idée d’une prise physique hostile sans imposer la nuance juridique plus précise d’une arrestation.
- source_word: ἐξῆλθεν ἐκ τῆς χειρὸς αὐτῶν
  choice: il leur échappa
  rationale: Le grec dit littéralement qu’il « sortit de leur main », idiome désignant leur prise ou leur pouvoir. « Il leur échappa » en transmet naturellement le sens en français, tandis que la note conserve la forme de l’expression grecque.
theological_decisions:
- issue: Faut-il expliciter la délivrance de Jésus par le verbe « échapper » ou reproduire littéralement l’image de sortir de leur main ?
  choice: il leur échappa
  alternative: il sortit de leur main
  rationale: La formulation française littérale serait peu naturelle et pourrait sembler décrire un simple mouvement physique. « Il leur échappa » communique l’issue narrative sans préciser comment cela s’est produit; la note signale l’image et l’ambiguïté idiomatique du grec.
translation_notes:
  register: Français moderne, international et digne. La phrase reste concise et narrative; « se saisir de lui » rend l’hostilité de l’action, tandis que « il leur échappa » évite un calque obscur.
