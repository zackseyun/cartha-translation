source:
  edition: SBLGNT
  text: ἐκύκλωσαν οὖν αὐτὸν οἱ Ἰουδαῖοι καὶ ἔλεγον αὐτῷ· Ἕως πότε τὴν ψυχὴν ἡμῶν αἴρεις; εἰ σὺ εἶ ὁ χριστός, εἰπὲ ἡμῖν παρρησίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/024.yaml
  text: So the Jews surrounded him and were saying to him[a], “How long will you keep us in suspense? If you are the Messiah[b], tell us plainly.”
translation:
  language: fr
  text: 'Les Juifs[b] l’entourèrent donc et lui disaient : « Jusqu’à quand nous tiendras-tu dans l’incertitude ?[a] Si tu es le Messie, dis-le-nous clairement. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement, l’expression évoque le fait de « lever » ou d’« enlever notre âme »; c’est un idiome qui signifie maintenir quelqu’un dans l’incertitude.
    reason: lexical_alternative
  - marker: b
    text: Dans l’Évangile selon Jean, « les Juifs » peut, selon le contexte, désigner plus précisément des autorités juives ou des adversaires de Jésus, et non le peuple juif dans son ensemble.
    reason: cultural_note
lexical_decisions:
- source_word: ἐκύκλωσαν
  choice: l’entourèrent
  rationale: Le verbe exprime le fait de se placer autour de quelqu’un; « entourèrent » reste naturel tout en conservant la possible tonalité de confrontation.
- source_word: οὖν
  choice: donc
  rationale: Le connecteur marque ici la progression ou la conséquence narrative.
- source_word: οἱ Ἰουδαῖοι
  choice: les Juifs
  rationale: Cette traduction formelle préserve l’expression grecque sans en restreindre explicitement le référent; une note signale la portée contextuelle possible dans Jean.
- source_word: ἔλεγον
  choice: lui disaient
  rationale: L’imparfait grec présente la parole dans son déroulement, nuance que rend l’imparfait français.
- source_word: Ἕως πότε τὴν ψυχὴν ἡμῶν αἴρεις
  choice: Jusqu’à quand nous tiendras-tu dans l’incertitude ?
  rationale: L’expression littérale concernant l’âme est idiomatique et désigne le fait de maintenir quelqu’un dans l’incertitude; cette formulation en restitue naturellement le sens.
- source_word: ὁ χριστός
  choice: le Messie
  rationale: Χριστός fonctionne ici comme le titre du libérateur royal attendu dans le cadre juif.
- source_word: εἰπὲ ἡμῖν παρρησίᾳ
  choice: dis-le-nous clairement
  rationale: La formulation rend à la fois l’impératif direct et l’idée d’une déclaration franche, ouverte et sans ambiguïté.
theological_decisions:
- issue: Traduction de Χριστός
  choice: le Messie
  alternative: le Christ
  rationale: Dans cette question, le terme fonctionne comme un titre messianique plutôt que comme une désignation devenue quasi nominale.
- issue: Référent de οἱ Ἰουδαῖοι dans Jean
  choice: les Juifs
  alternative: les responsables juifs / les Judéens
  rationale: Le verset ne précise pas lui-même un groupe dirigeant. Le texte principal conserve donc l’expression grecque, tandis qu’une note prévient qu’elle peut avoir chez Jean un référent contextuellement plus restreint.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe demeure proche du grec sans conserver un idiome qui serait obscur en français. Les deux appels de note sont placés à la fin du verset, chacun correspondant à l’expression concernée dans l’ordre où elle apparaît.
