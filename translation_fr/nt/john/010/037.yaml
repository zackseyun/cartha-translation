  text: εἰ οὐ ποιῶ τὰ ἔργα τοῦ πατρός μου, μὴ πιστεύετέ μοι·
base_translation:
  language: en
  yaml_path: translation/nt/john/010/037.yaml
  text: If I am not doing the works of my Father[a], do not believe me;
translation:
  language: fr
  text: Si je ne fais pas les œuvres de mon Père, ne me croyez pas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰ οὐ ποιῶ
  choice: Si je ne fais pas
  rationale: La proposition conditionnelle et sa négation sont rendues directement. Le présent français convient à l’action en cours ou habituelle sans imposer une tournure progressive peu naturelle.
- source_word: τὰ ἔργα
  choice: les œuvres
  rationale: « Œuvres » conserve le terme johannique qui désigne les actes de Jésus, notamment ceux qui témoignent de son identité et de sa mission.
- source_word: τοῦ πατρός μου
  choice: de mon Père
  rationale: Le génitif est rendu simplement; la majuscule indique que « Père » désigne ici Dieu dans sa relation avec Jésus.
- source_word: μὴ πιστεύετέ μοι
  choice: ne me croyez pas
  rationale: Avec le datif μοι, πιστεύω signifie naturellement « croire quelqu’un ». Cette formulation garde ensemble la personne de Jésus et la crédibilité de ses paroles sans explicitation interprétative.
theological_decisions:
- issue: Valeur de πιστεύω suivi du datif μοι
  choice: ne me croyez pas
  alternative: ne croyez pas ce que je dis
  rationale: La construction grecque permet de comprendre « croire quelqu’un ». Dans le contexte, les œuvres servent de fondement à la crédibilité des affirmations de Jésus; les dimensions personnelle et propositionnelle se recoupent. La traduction directe préserve cette tension sans développement ajouté.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe brève reproduit la force de l’énoncé conditionnel et de l’impératif négatif.
