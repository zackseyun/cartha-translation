id: JHN.10.8
reference: John 10:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: πάντες ὅσοι ἦλθον ⸂πρὸ ἐμοῦ⸃ κλέπται εἰσὶν καὶ λῃσταί· ἀλλ’ οὐκ ἤκουσαν αὐτῶν τὰ πρόβατα.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/008.yaml
  text: All who came before me are thieves and robbers[a], but the sheep did not listen to them.
translation:
  language: fr
  text: Tous ceux qui sont venus avant moi sont des voleurs et des brigands[a], mais les brebis ne les ont pas écoutés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en avant de moi ». L’expression peut être comprise dans un sens temporel (« avant moi ») ou désigner ceux qui se sont présentés en prétendant exercer une autorité indépendamment de Jésus. Le contexte évoque de faux bergers plutôt que tous les serviteurs de Dieu venus auparavant.
    reason: alternative_reading
lexical_decisions:
- source_word: πάντες ὅσοι
  choice: Tous ceux qui
  rationale: Expression distributive naturelle en français, qui conserve la portée générale du grec sans préciser davantage le groupe visé.
- source_word: ἦλθον
  choice: sont venus
  rationale: Le passé composé rend naturellement l’aoriste dans ce propos en français moderne.
- source_word: πρὸ ἐμοῦ
  choice: avant moi
  rationale: Rend directement la valeur temporelle la plus naturelle, tout en laissant en note la nuance possible « en avant de moi ».
- source_word: κλέπται
  choice: voleurs
  rationale: Équivalent courant de κλέπται, adapté au contexte de personnes qui s’emparent illégitimement des brebis.
- source_word: λῃσταί
  choice: brigands
  rationale: Distingue ce terme de « voleurs » et conserve sa nuance plus violente ou prédatrice sans surinterprétation.
- source_word: ἀλλ’
  choice: mais
  rationale: Rend simplement et naturellement l’opposition exprimée par la conjonction grecque.
- source_word: οὐκ ἤκουσαν αὐτῶν
  choice: ne les ont pas écoutés
  rationale: Avec le génitif, ἀκούω peut exprimer l’écoute attentive ou l’obéissance; « écouter » convient au motif des brebis qui reconnaissent une voix et la suivent.
- source_word: τὰ πρόβατα
  choice: les brebis
  rationale: « Brebis » est le terme traditionnel et naturel dans l’image pastorale, avec le pluriel et l’article conservés.
theological_decisions:
- issue: Portée de « tous ceux qui sont venus avant moi »
  choice: Conserver dans le texte la formulation générale « Tous ceux qui sont venus avant moi » sans identifier explicitement le groupe.
  alternative: « Tous ceux qui sont venus en avant de moi », ou une explicitation visant ceux qui revendiquent une autorité indépendante de Jésus.
  rationale: La forme grecque est large, tandis que le contexte vise des bergers illégitimes et ne requiert pas de comprendre que Jésus condamne tous les anciens serviteurs envoyés par Dieu. La traduction préserve cette tension, et la note signale l’ambiguïté.
translation_notes:
  register: Français international moderne, clair et digne. « Brigands » maintient la distinction lexicale avec « voleurs ». Le passé composé et « écouter » donnent une formulation naturelle sans effacer l’ambiguïté du grec.
