  text: ἐγώ εἰμι ὁ ποιμὴν ὁ καλός, καὶ γινώσκω τὰ ἐμὰ καὶ ⸂γινώσκουσί με τὰ ἐμά⸃,
base_translation:
  language: en
  yaml_path: translation/nt/john/010/014.yaml
  text: I am the good shepherd[a], and I know my own, and my own know me,
translation:
  language: fr
  text: Moi, je suis le bon berger ; je connais les miens[a], et les miens me connaissent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « mes brebis ». Le grec emploie dans les deux propositions un pluriel neutre, littéralement « ce qui est à moi ».'
    reason: alternative de traduction et précision lexicale
lexical_decisions:
- source_word: ποιμήν
  choice: berger
  rationale: « Berger » est le sens ordinaire du terme et conserve l’image concrète du discours, sans introduire les associations ecclésiales ultérieures de « pasteur ».
- source_word: καλός
  choice: bon
  rationale: « Bon » exprime naturellement ici l’excellence morale et la qualité exemplaire du berger, tout en restant idiomatique en français.
- source_word: γινώσκω / γινώσκουσί
  choice: connais / connaissent
  rationale: Le verbe exprime une connaissance personnelle et réciproque, et non une simple identification. « Connaître » préserve cette portée relationnelle.
- source_word: τὰ ἐμὰ / τὰ ἐμά
  choice: ceux qui m’appartiennent
  rationale: L’adjectif possessif substantivé, au pluriel neutre, désigne ici les êtres appartenant au berger. Cette formulation naturelle en français conserve l’idée d’appartenance sans ajouter explicitement « brebis », absent de ce verset.
- source_word: ἐγώ εἰμι
  choice: Moi, je suis
  rationale: Le pronom grec explicite donne du relief à l’auto-identification. « Moi, je suis » restitue cette insistance en français tout en conservant la formule johannique.
- source_word: καί
  choice: et
  rationale: La conjonction coordonne simplement les deux propositions et maintient leur parallélisme.
theological_decisions:
- issue: Exprimer la relation réciproque entre Jésus et ceux qui lui appartiennent sans importer une formulation doctrinale ultérieure
  choice: ceux qui m’appartiennent
  alternative: les miens ; mes brebis
  rationale: Cette formulation préserve à la fois l’appartenance relationnelle et la réciprocité de la connaissance. « Mes brebis » est conforme au contexte, mais explicite un nom que le grec ne répète pas ici ; « les miens » est plus littéral, mais peut paraître moins clair ou plus familier en français contemporain.
translation_notes:
  register: Français international moderne, naturel et digne. La répétition de « ceux qui m’appartiennent » reproduit le parallélisme lexical du grec. Aucune note n’est nécessaire, puisque la traduction principale rend explicitement mais sans surinterprétation le possessif substantivé.
