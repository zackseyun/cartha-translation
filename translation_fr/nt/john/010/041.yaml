id: JHN.10.41
reference: John 10:41
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ πολλοὶ ἦλθον πρὸς αὐτὸν καὶ ἔλεγον ὅτι Ἰωάννης μὲν σημεῖον ἐποίησεν οὐδέν, πάντα δὲ ὅσα εἶπεν Ἰωάννης περὶ τούτου ἀληθῆ ἦν.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/041.yaml
  text: And many came to him and were saying, “John did no sign, but everything that John said about this man was true.”
translation:
  language: fr
  text: 'Et beaucoup vinrent à lui et disaient : « Jean n’a accompli aucun signe[a], mais tout ce que Jean a dit au sujet de cet homme[b] était vrai. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « n’a fait aucun signe »; autre traduction possible : « n’a accompli aucun miracle ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « à son sujet ». Le grec emploie un démonstratif : « au sujet de celui-ci » ou « de cet homme ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: beaucoup
  rationale: L’adjectif substantivé désigne de nombreuses personnes; « beaucoup » est naturel en français sans ajout explicatif.
- source_word: ἦλθον πρὸς αὐτόν
  choice: vinrent à lui
  rationale: Rend directement le mouvement vers Jésus exprimé par ἔρχομαι avec πρός et l’accusatif.
- source_word: ἔλεγον
  choice: disaient
  rationale: L’imparfait français conserve l’aspect duratif ou répété de l’imparfait grec.
- source_word: σημεῖον
  choice: signe
  rationale: « Signe » préserve la terminologie caractéristique de Jean et ce qui distingue σημεῖον d’un simple prodige.
- source_word: ἐποίησεν οὐδέν
  choice: n’a accompli aucun signe
  rationale: Expression française naturelle qui conserve la négation totale; « accomplir » convient à l’idée de produire un signe.
- source_word: πάντα δὲ ὅσα
  choice: mais tout ce que
  rationale: Cette formulation idiomatique garde la portée globale de la construction grecque.
- source_word: περὶ τούτου
  choice: au sujet de cet homme
  rationale: « Cet homme » conserve la valeur démonstrative de τούτου et désigne clairement Jésus dans les paroles rapportées.
- source_word: ἀληθῆ ἦν
  choice: était vrai
  rationale: Rendu direct du prédicat grec; le singulier collectif français s’accorde naturellement avec « tout ce que ».
theological_decisions:
- issue: Terminologie johannique de σημεῖον
  choice: signe
  alternative: miracle
  rationale: « Signe » maintient la portée thématique du terme dans l’Évangile selon Jean sans réduire celui-ci à la seule idée de miracle.
- issue: Valeur référentielle de περὶ τούτου
  choice: au sujet de cet homme
  alternative: à son sujet
  rationale: Le démonstratif grec est conservé de manière naturelle et son référent, Jésus, reste explicite sans ajout doctrinal.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple porte l’action narrative ponctuelle, tandis que l’imparfait rend la parole continue ou répétée. La citation reste naturelle tout en préservant le vocabulaire johannique.
