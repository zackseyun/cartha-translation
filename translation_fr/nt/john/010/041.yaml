  source_fidelity: 'Le texte rend fidèlement les contrastes verbaux grecs : « vinrent » pour l’aoriste ἦλθον et « disaient » pour l’imparfait ἔλεγον. « Signe » traduit correctement σημεῖον dans son emploi johannique, et « au sujet de cet homme » préserve de façon explicite mais naturelle la valeur démonstrative de περὶ τούτου. « Tout ce que Jean a dit … était vrai » respecte la portée totale de πάντα ὅσα et le prédicat ἀληθῆ ἦν.'
