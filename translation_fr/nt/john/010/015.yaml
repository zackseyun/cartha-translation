id: JHN.10.15
reference: John 10:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καθὼς γινώσκει με ὁ πατὴρ κἀγὼ γινώσκω τὸν πατέρα, καὶ τὴν ψυχήν μου τίθημι ὑπὲρ τῶν προβάτων.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/015.yaml
  text: just as the Father knows me and I know the Father[b][a], and I lay down my life for the sheep.
translation:
  language: fr
  text: de même que le Père me connaît et que je connais le Père, et je donne ma vie[a] pour les brebis[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « mon âme ». Ici, dans le contexte du don de soi, le mot désigne la vie.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « en faveur des brebis ». La préposition grecque peut exprimer une portée représentative ou sacrificielle.'
    reason: alternative_reading
lexical_decisions:
- source_word: καθὼς
  choice: de même que
  rationale: Cette expression introduit naturellement en français une comparaison étroite avec la connaissance réciproque mentionnée dans le contexte précédent.
- source_word: γινώσκει / γινώσκω
  choice: connaît / connais
  rationale: « Connaître » conserve le lien lexical et laisse au contexte la profondeur relationnelle du verbe sans l’expliciter excessivement.
- source_word: ὁ πατὴρ / τὸν πατέρα
  choice: le Père
  rationale: L’article grec et l’usage johannique appellent « le Père », sans ajout d’un possessif absent du texte.
- source_word: κἀγὼ
  choice: et que je
  rationale: La coordination est conservée, tandis que la reprise de « que » rend la construction comparative naturelle en français.
- source_word: τὴν ψυχήν μου
  choice: ma vie
  rationale: Dans le contexte de la mort volontaire du bon berger, ψυχή désigne sa vie, et non spécifiquement une âme immatérielle.
- source_word: τίθημι
  choice: je donne
  rationale: Avec « sa vie », le français idiomatique dit « donner sa vie ». Une traduction littérale comme « déposer ma vie » serait obscure et peu naturelle.
- source_word: ὑπὲρ
  choice: pour
  rationale: « Pour » exprime de façon concise le bénéfice et la portée sacrificielle de l’acte sans réduire la préposition à une formulation doctrinale unique.
- source_word: τῶν προβάτων
  choice: les brebis
  rationale: « Les brebis » maintient l’image pastorale précise du passage; « le troupeau » changerait le nom grec et atténuerait le parallélisme contextuel.
theological_decisions:
- issue: Portée de ὑπὲρ dans le don de soi de Jésus
  choice: pour les brebis
  alternative: en faveur des brebis; à la place des brebis
  rationale: « Pour » garde la portée bénéficiaire, représentative et sacrificielle possible de ὑπέρ sans imposer à la traduction une définition technique plus étroite que le grec.
- issue: Sens de ψυχή dans ce contexte
  choice: ma vie
  alternative: mon âme
  rationale: Le contexte parle de la mort volontaire du berger. « Vie » transmet donc ici le sens contextuel de ψυχή et évite de suggérer que Jésus ne donnerait que la composante immatérielle de sa personne.
translation_notes:
  register: Français international moderne, sobre et digne. La reprise « et que je » assure une syntaxe naturelle après « de même que ». La ponctuation rattache la comparaison à la phrase précédente tout en donnant à l’acte volontaire de Jésus une proposition distincte. Les marqueurs de notes sont placés immédiatement après les expressions concernées.
