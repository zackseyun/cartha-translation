id: JHN.10.6
reference: John 10:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ταύτην τὴν παροιμίαν εἶπεν αὐτοῖς ὁ Ἰησοῦς· ἐκεῖνοι δὲ οὐκ ἔγνωσαν τίνα ⸀ἦν ἃ ἐλάλει αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/006.yaml
  text: Jesus spoke this figure of speech to them[a], but they did not understand what he was saying to them.
translation:
  language: fr
  text: Jésus leur dit cette parole figurée[a], mais ils ne comprirent pas ce qu’il leur disait.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « cette parabole », « cette image », « cette illustration » ou « ce proverbe ». Le mot grec peut désigner de manière générale une parole figurée ; ici, il introduit le discours du berger sous une forme non littérale.
    reason: lexical_alternative
lexical_decisions:
- source_word: παροιμίαν
  choice: image
  rationale: Dans ce contexte, παροιμία désigne une parole figurée ou une illustration voilée. « Image » rend naturellement en français le caractère non littéral du discours du berger sans le classer trop précisément comme parabole ou proverbe.
- source_word: εἶπεν
  choice: parla en employant
  rationale: Cette formulation française s’accorde naturellement avec « cette image » tout en rendant l’acte de parler exprimé par λέγω.
- source_word: ἐκεῖνοι δὲ
  choice: mais ils
  rationale: Le pronom reprend les interlocuteurs et δέ marque ici le contraste avec Jésus.
- source_word: οὐκ ἔγνωσαν
  choice: ne comprirent pas
  rationale: Dans le contexte, γινώσκω exprime l’absence de compréhension du sens du discours figuré plutôt qu’un simple défaut de connaissance.
- source_word: τίνα ἦν ἃ ἐλάλει αὐτοῖς
  choice: ce qu’il leur disait
  rationale: Cette tournure idiomatique restitue le sens de la construction grecque, assez lourde littéralement, sans ajouter explicitement « ce qu’il voulait dire ».
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve la répétition de l’idée d’adresse aux interlocuteurs, tout en évitant un calque maladroit de la syntaxe grecque.
