  text: ἀλλὰ ὑμεῖς οὐ πιστεύετε, ⸂ὅτι οὐκ⸃ ἐστὲ ἐκ τῶν προβάτων τῶν ⸀ἐμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/026.yaml
  text: But you do not believe[a], because you are not among my sheep.
translation:
  language: fr
  text: Mais vous, vous ne croyez pas[a], parce que vous ne faites pas partie de mes brebis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Mais vous, vous ne croyez pas que vous ne faites pas partie de mes brebis. » La conjonction grecque peut introduire le contenu de ce qui n’est pas cru plutôt qu’en donner la cause.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλὰ
  choice: Mais
  rationale: Marque naturellement en français l’opposition avec ce qui précède.
- source_word: ὑμεῖς
  choice: vous, vous
  rationale: Le pronom grec est explicite et emphatique; la dislocation française rend cette insistance sans lourdeur excessive.
- source_word: οὐ πιστεύετε
  choice: vous ne croyez pas
  rationale: Le présent négatif se rend naturellement par le présent simple; «croire» convient à l’usage johannique.
- source_word: ὅτι
  choice: parce que
  rationale: La valeur causale s’accorde le mieux avec le fil du discours, tout en laissant dans une note l’autre analyse syntaxiquement possible.
- source_word: οὐκ ἐστὲ ἐκ τῶν προβάτων
  choice: vous ne faites pas partie de mes brebis
  rationale: ἐκ exprime ici l’appartenance à un groupe; cette formulation est idiomatique et plus précise que le calque «vous n’êtes pas de mes brebis».
- source_word: τῶν ἐμῶν
  choice: mes
  rationale: Le possessif français rend directement et naturellement la relation exprimée par le grec.
theological_decisions:
- issue: Valeur de ὅτι et rapport entre l’incrédulité et l’appartenance aux brebis de Jésus
  choice: 'Lecture causale: «parce que vous ne faites pas partie de mes brebis»'
  alternative: 'Lecture complétive: «vous ne croyez pas que vous ne faites pas partie de mes brebis»'
  rationale: Le contexte immédiat favorise une explication de leur refus de croire par leur non-appartenance aux brebis de Jésus. La note conserve toutefois l’ambiguïté réelle de ὅτι, sans trancher par la traduction un débat théologique plus large.
translation_notes:
  register: Français international moderne, digne et accessible. La reprise «vous, vous» restitue l’emphase du pronom grec; «faire partie de» exprime clairement l’appartenance au groupe.
