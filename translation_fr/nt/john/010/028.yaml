id: JHN.10.28
reference: John 10:28
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: κἀγὼ ⸂δίδωμι αὐτοῖς ζωὴν αἰώνιον⸃, καὶ οὐ μὴ ἀπόλωνται εἰς τὸν αἰῶνα, καὶ οὐχ ἁρπάσει τις αὐτὰ ἐκ τῆς χειρός μου.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/028.yaml
  text: And I give them eternal life, and they will certainly never perish forever, and no one will snatch them out of my hand.
translation:
  language: fr
  text: Et moi, je leur donne la vie éternelle ; elles ne périront absolument jamais, et personne ne les arrachera de ma main.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κἀγώ
  choice: Moi, je
  rationale: La tournure disloquée française exprime naturellement l’insistance portée par κἀγώ (« et moi / moi, je »), sans alourdir la phrase.
- source_word: ζωὴν αἰώνιον
  choice: la vie éternelle
  rationale: Expression française consacrée et exacte pour une vie appartenant à l’âge à venir et sans fin.
- source_word: οὐ μὴ ἀπόλωνται εἰς τὸν αἰῶνα
  choice: elles ne périront certainement jamais
  rationale: « Certainement » rend la négation grecque fortement emphatique οὐ μή, tandis que « jamais » rend l’expression εἰς τὸν αἰῶνα. Cette formulation évite le pléonasme peu naturel « jamais pour toujours » tout en conservant les deux éléments.
- source_word: ἁρπάσει
  choice: arrachera
  rationale: Le verbe exprime l’action de saisir et d’enlever par force ; « arracher de ma main » est idiomatique et conserve cette vigueur.
- source_word: ἐκ τῆς χειρός μου
  choice: de ma main
  rationale: Traduction directe qui préserve l’image de protection et de possession.
theological_decisions:
- issue: Force et durée de la négation concernant la perdition
  choice: elles ne périront certainement jamais
  alternative: elles ne périront jamais
  rationale: La traduction retenue représente explicitement à la fois l’emphase de οὐ μή et la portée temporelle de εἰς τὸν αἰῶνα, sans développer les implications doctrinales au-delà du texte.
- issue: Référent du pronom αὐτά
  choice: elles
  alternative: ceux-ci / eux
  rationale: Le féminin pluriel reprend naturellement « mes brebis » du verset précédent et conserve ainsi l’image pastorale immédiate.
translation_notes:
  register: Français international moderne, clair et digne. La ponctuation met en relief les trois affirmations coordonnées. Aucun ajout explicatif ni vocabulaire confessionnel n’est introduit.
