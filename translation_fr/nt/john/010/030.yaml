  text: ἐγὼ καὶ ὁ πατὴρ ἕν ἐσμεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/030.yaml
  text: I and the Father are one[a].
translation:
  language: fr
  text: Moi et le Père, nous sommes un[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot grec traduit par « un » est au neutre; il affirme l’unité sans présenter Jésus et le Père comme une seule personne.
    reason: Précision grammaticale et préservation de la tension théologique du texte.
lexical_decisions:
- source_word: ἐγὼ
  choice: Moi
  rationale: Le pronom grec est exprimé et porte ici une valeur emphatique. « Moi » conserve cette insistance devant le groupe coordonné et permet une tournure française naturelle avec reprise par « nous ».
- source_word: καὶ
  choice: et
  rationale: Conjonction de coordination simple, sans nuance supplémentaire.
- source_word: ὁ πατὴρ
  choice: le Père
  rationale: Dans le contexte johannique, l’expression désigne le Père de Jésus comme titre personnel; la majuscule rend cet emploi en français.
- source_word: ἕν
  choice: un
  rationale: L’adjectif numéral est au neutre singulier. « Un » est la correspondance française la plus directe et préserve l’affirmation de l’unité sans la réduire à un simple accord ni la développer en formulation doctrinale ultérieure.
- source_word: ἐσμεν
  choice: nous sommes
  rationale: Le verbe est à la première personne du pluriel. La reprise française par « nous » est idiomatique après « Moi et le Père » et maintient nettement la pluralité grammaticale des sujets.
theological_decisions:
- issue: Portée du neutre ἕν associé au pluriel ἐσμεν dans une affirmation christologique
  choice: « Moi et le Père, nous sommes un. » affirme une véritable unité tout en maintenant la distinction indiquée par le sujet coordonné et le verbe pluriel.
  alternative: « Le Père et moi, nous sommes un »; « Moi et le Père, nous sommes dans l’unité »; « Moi et le Père, nous sommes une seule chose »
  rationale: L’ordre grec place Jésus en premier et le pronom explicite est emphatique; « Moi et le Père » le conserve. Le neutre ἕν ne désigne pas les deux comme une seule personne, tandis que le pluriel ἐσμεν maintient leur distinction. Une paraphrase telle que « dans l’unité » affaiblirait potentiellement l’énoncé, et « une seule chose » serait plus interprétatif et moins digne en français.
translation_notes:
  register: Français international moderne, concis et solennel. La dislocation « Moi et le Père, nous sommes… » est naturelle en français et rend à la fois l’emphase de ἐγώ, l’ordre des mots grec et le pluriel de ἐσμεν. Le marqueur [a] figure dans le texte.
