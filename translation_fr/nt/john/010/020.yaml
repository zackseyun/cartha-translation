  text: ἔλεγον δὲ πολλοὶ ἐξ αὐτῶν· Δαιμόνιον ἔχει καὶ μαίνεται· τί αὐτοῦ ἀκούετε;
base_translation:
  language: en
  yaml_path: translation/nt/john/010/020.yaml
  text: But many of them were saying[a], “He has a demon and is insane. Why do you listen to him?”
translation:
  language: fr
  text: 'Mais beaucoup d’entre eux disaient : « Il a un démon et il est fou. Pourquoi l’écoutez-vous ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγον
  choice: disaient
  rationale: L’imparfait grec présente leurs paroles comme répétées ou prolongées dans la scène ; l’imparfait français en rend naturellement l’aspect.
- source_word: δὲ
  choice: Mais
  rationale: La conjonction marque ici le contraste avec la réaction rapportée dans le contexte précédent.
- source_word: πολλοὶ ἐξ αὐτῶν
  choice: beaucoup d’entre eux
  rationale: 'Cette formulation française rend naturellement l’expression partitive : il s’agit d’une grande partie du groupe, non nécessairement de tous.'
- source_word: Δαιμόνιον ἔχει
  choice: Il a un démon
  rationale: Traduction directe et transparente de l’expression grecque, sans la reformuler par une notion plus interprétative comme « possédé ».
- source_word: μαίνεται
  choice: il est fou
  rationale: Dans cette accusation hostile, « être fou » exprime en français courant l’idée d’avoir perdu la raison, sans recourir au vocabulaire clinique moderne.
- source_word: τί αὐτοῦ ἀκούετε;
  choice: Pourquoi l’écoutez-vous ?
  rationale: τί a ici la valeur idiomatique de « pourquoi », et ἀκούω avec le génitif désigne le fait d’écouter quelqu’un ou de prêter attention à ses paroles.
theological_decisions:
- issue: Formulation de l’accusation hostile portée contre Jésus
  choice: Il a un démon et il est fou
  alternative: Il est possédé par un démon et il a perdu la raison
  rationale: La formulation retenue conserve les deux accusations du grec sans les atténuer ni expliquer doctrinalement le rapport entre elles. « Il a un démon » reste plus proche du texte que « il est possédé ».
translation_notes:
  register: Français international moderne, direct et digne. La tournure « il est fou » est volontairement placée dans la bouche des adversaires et traduit leur accusation, non un diagnostic du narrateur.
