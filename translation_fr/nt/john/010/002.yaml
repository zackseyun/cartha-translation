source:
  edition: SBLGNT
  text: ὁ δὲ εἰσερχόμενος διὰ τῆς θύρας ποιμήν ἐστιν τῶν προβάτων.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/002.yaml
  text: But the one who enters through the door is the shepherd of the sheep[a].
translation:
  language: fr
  text: Mais celui qui entre par la porte est le berger des brebis[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « un berger des brebis ». En grec, le nom traduit par « berger » n’a pas d’article, mais le contexte favorise le sens défini : il s’agit du berger légitime, par opposition aux intrus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ εἰσερχόμενος
  choice: Mais celui qui entre
  rationale: Le participe présent substantivé désigne la personne caractérisée par cette manière d’entrer. « Celui qui entre » est naturel en français moderne, tandis que « Mais » rend le contraste introduit par δέ avec le voleur et le brigand du verset précédent.
- source_word: διὰ τῆς θύρας
  choice: par la porte
  rationale: διά avec le génitif exprime ici le passage par une ouverture. En français, « entrer par la porte » rend naturellement ce mouvement sans qu’il soit nécessaire de dire « à travers la porte ».
- source_word: ποιμήν
  choice: le berger
  rationale: Bien que le nom attribut soit sans article en grec, le contraste discursif présente celui qui entre légitimement comme le berger reconnu des brebis. Le français appelle naturellement l’article défini dans cette identification.
- source_word: τῶν προβάτων
  choice: des brebis
  rationale: Le génitif exprime la relation entre le berger et les animaux dont il a la charge. « Brebis » conserve l’image concrète de πρόβατα et correspond à l’expression française courante « berger des brebis ».
theological_decisions:
- issue: Valeur définie ou indéfinie de ποιμήν comme nom attribut
  choice: le berger
  alternative: un berger
  rationale: L’absence d’article devant ποιμήν permet grammaticalement une formulation indéfinie, mais le contexte oppose l’entrant légitime aux intrus et favorise l’identification du berger reconnu. La note conserve l’autre possibilité sans charger le verset d’une interprétation christologique plus précise que la métaphore immédiate.
translation_notes:
  register: Français international moderne, simple et digne. La formulation conserve la métaphore pastorale et le contraste avec le verset précédent; « par la porte » est l’expression idiomatique française pour le mouvement décrit.
