review_pass:
  verdict: revise
  source_fidelity: 'Le texte grec pose directement la question « dites-vous de celui que le Père a consacré et envoyé dans le monde : “Tu blasphèmes”, parce que j’ai dit : “Je suis le Fils de Dieu” ? ». Le choix « consacré » pour ἡγίασεν, « envoyé » pour ἀπέστειλεν, « le monde » pour κόσμον et « le Fils de Dieu » est fidèle. En revanche, « comment pouvez-vous dire » ajoute l’idée de possibilité/manière, absente du grec, et « dire à celui » déplace légèrement le complément de « de celui » vers une adresse directe.'
  naturalness: La formulation révisée est naturelle dans un registre biblique moderne et soutenu. « Dites-vous de celui que… » conserve la construction argumentative du grec tout en laissant l’accusation au discours direct.
  terminology: « Le Père », « consacré », « envoyé », « le monde », « blasphèmes » et « le Fils de Dieu » sont cohérents avec l’usage johannique et le français international moderne. La note lexicale sur « consacré » préserve utilement les autres possibilités sans imposer une interprétation doctrinale.
  issues:
  - severity: medium
    issue: « comment pouvez-vous dire »
    rationale: Cette tournure rendrait plutôt une question introduite par πῶς (« comment ») ou une idée d’incapacité. Le grec demande simplement si les interlocuteurs prononcent cette accusation.
  - severity: low
    issue: « dire à celui que »
    rationale: Le grec emploie λέγετε avec ὃν, « dites-vous de celui que ». « Dire à » est possible avec l’apostrophe citée, mais atténue la construction grecque qui porte sur ce qu’ils disent au sujet de Jésus.
  revised_text: 'Dites-vous de celui que le Père a consacré[a] et envoyé dans le monde : « Tu blasphèmes », parce que j’ai dit : « Je suis le Fils de Dieu » ?'
