  text: do you say of the one whom the Father sanctified and sent into the world[a], ‘You are blaspheming,’ because I said, ‘I am the Son of God’?”
translation:
  language: fr
  text: 'Dites-vous de celui que le Père a consacré[a] et envoyé dans le monde : « Tu blasphèmes », parce que j’ai dit : « Je suis le Fils de Dieu » ?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sanctifié » ou « mis à part ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡγίασεν
  choice: a consacré
  rationale: Dans ce contexte d’envoi et de mission, « consacrer » exprime naturellement l’idée de vouer à Dieu et de mettre à part, sans suggérer une amélioration morale du Fils. Une note conserve les autres valeurs lexicales possibles.
- source_word: ἀπέστειλεν
  choice: envoyé
  rationale: « Envoyer » rend directement le verbe et préserve le langage johannique récurrent de la mission confiée par le Père.
- source_word: κόσμον
  choice: le monde
  rationale: Traduction usuelle et contextuellement appropriée, qui conserve les résonances théologiques du terme dans Jean.
- source_word: Βλασφημεῖς
  choice: Tu blasphèmes
  rationale: Le présent français rend directement l’accusation citée et convient au registre actuel et digne.
- source_word: Υἱὸς τοῦ θεοῦ
  choice: le Fils de Dieu
  rationale: Cette formulation idiomatique conserve la force christologique et titulaire de l’expression dans le contexte.
- source_word: ὃν ὁ πατὴρ
  choice: à celui que le Père
  rationale: La tournure française est naturelle après « dire à » et préserve clairement l’antécédent personnel du relatif.
- source_word: ὅτι ... ὅτι
  choice: 'dire à celui que… : … parce que'
  rationale: Le premier ὅτι introduit les paroles rapportées et le second indique la raison de l’accusation; la ponctuation et « parce que » rendent cette relation clairement en français.
theological_decisions:
- issue: Sens de ἡγίασεν appliqué au Fils
  choice: consacré
  alternative: sanctifié; mis à part
  rationale: « Consacré » conserve l’idée de destination sacrée et de mise à part pour la mission, tout en évitant que le lecteur comprenne nécessairement une purification morale. La note signale néanmoins l’étendue lexicale du grec.
- issue: Force christologique de Υἱὸς τοῦ θεοῦ
  choice: le Fils de Dieu
  alternative: un fils de Dieu; le fils de Dieu
  rationale: Dans le contexte de l’accusation de blasphème et de l’argument de Jésus, l’expression a une force titulaire que rend naturellement la majuscule française, sans ajouter une formulation doctrinale absente du verset.
translation_notes:
  register: Français international moderne, naturel et digne. La question rhétorique est formulée avec « comment pouvez-vous » afin de rendre clairement l’indignation argumentative, tandis que les paroles accusatrices restent au discours direct.
