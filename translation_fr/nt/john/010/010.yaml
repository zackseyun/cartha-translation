source:
  edition: SBLGNT
  text: ὁ κλέπτης οὐκ ἔρχεται εἰ μὴ ἵνα κλέψῃ καὶ θύσῃ καὶ ἀπολέσῃ· ἐγὼ ἦλθον ἵνα ζωὴν ἔχωσιν καὶ περισσὸν ἔχωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/010.yaml
  text: The thief comes only to steal and slaughter and destroy[a]; I came so that they may have life[b], and have it abundantly.
translation:
  language: fr
  text: Le voleur ne vient que pour voler, égorger et détruire[a] ; moi, je suis venu pour qu’ils aient la vie et qu’ils l’aient en abondance[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tuer » pour « égorger » (θύσῃ). Le verbe grec désigne souvent l’abattage d’un animal, ce qui convient à l’image des brebis dans le contexte.
    reason: lexical_alternative
  - marker: b
    text: Ou « qu’ils aient la vie en abondance » ou « qu’ils l’aient pleinement ».
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ κλέπτης
  choice: le voleur
  rationale: L’article grec présente le voleur comme une figure définie et représentative dans le discours sur le berger ; « le voleur » restitue naturellement cette valeur en français.
- source_word: οὐκ ἔρχεται εἰ μὴ
  choice: ne vient que
  rationale: 'Cette tournure française rend avec concision l’exclusivité exprimée par l’idiome grec : sa venue n’a pas d’autre but que les actions qui suivent.'
- source_word: ἵνα κλέψῃ
  choice: pour voler
  rationale: Après « ne vient que », l’infinitif de but est idiomatique en français et conserve la fonction de la proposition grecque.
- source_word: θύσῃ
  choice: égorger
  rationale: Le verbe θύω désigne fréquemment l’abattage d’un animal. « Égorger » est vif, naturel et particulièrement adapté à l’image des brebis dans le contexte, sans exclure le sens plus général de « tuer ».
- source_word: ἀπολέσῃ
  choice: détruire
  rationale: « Détruire » exprime l’ampleur de la dévastation et maintient la progression avec « voler » et « égorger », sans préciser indûment la manière ni l’objet.
- source_word: ἐγὼ ἦλθον
  choice: moi, je suis venu
  rationale: Le pronom détaché « moi » rend l’insistance de ἐγώ et marque le contraste avec le voleur. Le passé composé est le temps naturel du français moderne pour cet aoriste.
- source_word: ἵνα ζωὴν ἔχωσιν
  choice: pour qu’elles aient la vie
  rationale: La proposition finale est conservée. « La vie » rend ζωὴ sans ajouter « éternelle », adjectif absent du verset. Le féminin pluriel renvoie naturellement aux brebis du contexte français.
- source_word: περισσὸν ἔχωσιν
  choice: qu’elles l’aient en abondance
  rationale: Le pronom reprend clairement « la vie », tandis que « en abondance » exprime la mesure ou la plénitude indiquée par περισσόν sans suggérer une prospérité matérielle.
theological_decisions:
- issue: Portée de ζωὴ dans l’usage johannique
  choice: la vie
  alternative: la vie éternelle ; la vraie vie
  rationale: Le grec emploie ζωὴ sans l’adjectif « éternelle ». La formulation retenue préserve la profondeur théologique johannique sans inscrire dans le texte une précision qui n’y figure pas explicitement.
- issue: Force de περισσὸν
  choice: en abondance
  alternative: pleinement ; en plénitude
  rationale: L’expression qualifie la richesse et la plénitude de la vie donnée par Jésus. Elle ne doit pas être développée en promesse de prospérité ou de biens matériels.
- issue: Référent implicite de ἔχωσιν
  choice: elles, en référence aux brebis du contexte
  alternative: ils ; les humains
  rationale: Le grec ne répète pas le sujet nominal, mais le discours porte sur les brebis. En français, le féminin pluriel assure une reprise contextuelle naturelle sans universaliser ni restreindre davantage le référent.
translation_notes:
  register: Français international moderne, clair et digne. La construction « ne vient que pour » est idiomatique ; « moi, je suis venu » maintient le contraste emphatique. « Égorger » conserve la force concrète de l’image pastorale, tandis que la note fournit l’équivalent plus général. La ponctuation met en relief l’opposition entre le voleur et Jésus.
