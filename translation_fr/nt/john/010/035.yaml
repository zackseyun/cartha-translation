source:
  edition: SBLGNT
  text: εἰ ἐκείνους εἶπεν θεοὺς πρὸς οὓς ὁ λόγος τοῦ θεοῦ ἐγένετο, καὶ οὐ δύναται λυθῆναι ἡ γραφή,
base_translation:
  language: en
  yaml_path: translation/nt/john/010/035.yaml
  text: If he called those to whom the word of God came ‘gods’—and the Scripture cannot be broken—[a][b]
translation:
  language: fr
  text: Si Dieu a appelé « dieux »[a] ceux à qui la parole de Dieu est parvenue — et l’Écriture ne peut être annulée[b] —,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « êtres divins ». Le grec dit littéralement « dieux », en écho au Psaume 82.6 ; certains comprennent qu’il désigne des juges humains.'
    reason: alternative lexicale et référentielle
  - marker: b
    text: 'Ou : « l’Écriture ne peut être abolie » ou « ne peut être mise de côté ».'
    reason: alternative lexicale
lexical_decisions:
- source_word: εἰ
  choice: Si
  rationale: Conserve la structure conditionnelle de l’argument de Jésus, sans affaiblir la prémisse qu’il tire de l’Écriture.
- source_word: ἐκείνους εἶπεν θεοὺς
  choice: elle a appelé « dieux » ceux
  rationale: Le sujet implicite de εἶπεν est naturellement l’Écriture, nommée dans la proposition suivante. « Appeler » rend en français la construction prédicative, tandis que « dieux » reproduit le terme décisif de la citation du Psaume 82.
- source_word: πρὸς οὓς
  choice: à qui
  rationale: Dans cette tournure, πρός indique les destinataires vers qui la parole divine est venue.
- source_word: ὁ λόγος τοῦ θεοῦ
  choice: la parole de Dieu
  rationale: Expression française transparente qui désigne ici la parole ou déclaration divine, sans l’identifier au Logos personnel de Jean 1.
- source_word: ἐγένετο
  choice: est parvenue
  rationale: Rend le mouvement de la parole vers ses destinataires dans un français naturel et légèrement soutenu.
- source_word: οὐ δύναται λυθῆναι
  choice: ne peut être annulée
  rationale: Exprime directement l’idée qu’un texte faisant autorité ne peut être invalidé ou privé de force; évite le calque français peu naturel « brisée ».
- source_word: ἡ γραφή
  choice: l’Écriture
  rationale: Désigne l’Écriture faisant autorité; la majuscule est l’usage français courant dans ce sens.
theological_decisions:
- issue: Sens de « dieux » dans la citation
  choice: Maintenir « dieux » dans le texte principal
  alternative: juges; êtres divins
  rationale: L’argument dépend du mot même employé dans le Psaume 82. Le remplacer par une interprétation précise résoudrait indûment l’ambiguïté concernant les personnes visées.
- issue: Sujet de εἶπεν
  choice: « elle », renvoyant à l’Écriture
  alternative: « il », renvoyant à Dieu
  rationale: Le grec omet le sujet explicite. La proximité de ἡ γραφή et le contexte de la citation permettent de comprendre l’Écriture comme sujet, mais Dieu demeure une lecture grammaticalement possible; cette ambiguïté est signalée en note.
- issue: Force de « l’Écriture ne peut être annulée »
  choice: Formulation exprimant l’impossibilité d’invalider l’Écriture
  alternative: l’Écriture ne peut être abolie; l’Écriture ne peut être mise de côté
  rationale: λυθῆναι évoque ici la suppression de la force ou de l’autorité de l’Écriture. « Annulée » communique cette valeur sans ajouter une formulation confessionnelle.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la forme argumentative et parenthétique du grec. Les guillemets signalent le terme cité, et les notes préservent les ambiguïtés grammaticales et référentielles sans les trancher.
