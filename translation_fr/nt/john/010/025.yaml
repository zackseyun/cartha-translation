id: JHN.10.25
reference: John 10:25
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀπεκρίθη αὐτοῖς ὁ Ἰησοῦς· Εἶπον ὑμῖν καὶ οὐ πιστεύετε· τὰ ἔργα ἃ ἐγὼ ποιῶ ἐν τῷ ὀνόματι τοῦ πατρός μου ταῦτα μαρτυρεῖ περὶ ἐμοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/john/010/025.yaml
  text: Jesus answered them[a], “I told you, and you do not believe[b]. The works that I do in the name of my Father—these testify about me.”
translation:
  language: fr
  text: 'Jésus leur répondit : « Je vous l’ai dit, et vous ne croyez pas. Les œuvres que j’accomplis au nom de mon Père[a], ce sont elles qui témoignent à mon sujet[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « par l’autorité de mon Père ».
    reason: lexical_alternative
  - marker: b
    text: Ou « rendent témoignage à mon sujet ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: répondit
  rationale: Formulation narrative courante et naturelle pour introduire la réponse de Jésus dans un dialogue.
- source_word: Εἶπον ὑμῖν
  choice: Je vous l’ai dit
  rationale: Le passé composé renvoie naturellement en français à une parole déjà adressée aux interlocuteurs; le pronom « l’ » reste volontairement non précisé, comme l’objet implicite en grec.
- source_word: οὐ πιστεύετε
  choice: vous ne croyez pas
  rationale: « Croire » conserve le vocabulaire johannique et laisse ouverte la portée exacte de l’incrédulité sans la réduire à la confiance seule.
- source_word: τὰ ἔργα
  choice: les œuvres
  rationale: « Œuvres » maintient le terme caractéristique de Jean pour les actes de Jésus et ses liens avec les autres passages du livre.
- source_word: ἃ ἐγὼ ποιῶ
  choice: que j’accomplis
  rationale: « Accomplir » est naturel avec « œuvres » et exprime l’action de Jésus sans ajouter l’idée plus précise de miracle ou de signe.
- source_word: ἐν τῷ ὀνόματι τοῦ πατρός μου
  choice: au nom de mon Père
  rationale: 'Cette expression française conserve la formulation grecque ainsi que sa gamme de sens: représentation, mandat et autorité.'
- source_word: ταῦτα μαρτυρεῖ περὶ ἐμοῦ
  choice: ce sont elles qui témoignent à mon sujet
  rationale: La tournure emphatique reprend le démonstratif ταῦτα et met les œuvres en relief; « témoignent » préserve le motif juridique et testimonial important dans Jean.
theological_decisions:
- issue: Rapport entre les œuvres de Jésus et l’autorité du Père
  choice: au nom de mon Père
  alternative: par l’autorité de mon Père
  rationale: La traduction retenue exprime l’autorisation et la représentation sans réduire la formule à la seule notion d’autorité ni développer au-delà du texte sa portée christologique.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve le contraste direct entre la parole déjà donnée et l’incrédulité présente. « Ce sont elles » reproduit l’insistance du démonstratif grec sans alourdir excessivement le français.
