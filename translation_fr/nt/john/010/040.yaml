id: JHN.10.40
reference: John 10:40
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ ἀπῆλθεν πάλιν πέραν τοῦ Ἰορδάνου εἰς τὸν τόπον ὅπου ἦν Ἰωάννης τὸ πρῶτον βαπτίζων, καὶ ἔμεινεν ἐκεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/040.yaml
  text: And he went away again across the Jordan to the place where John had first been baptizing[a], and he stayed there.
translation:
  language: fr
  text: Il s’en alla de nouveau au-delà du Jourdain, à l’endroit où Jean avait d’abord baptisé, et il y resta.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπῆλθεν
  choice: repartit
  rationale: Le verbe exprime un départ, et πάλιν indique que Jésus se rend de nouveau ailleurs. « Repartit » réunit naturellement ces deux nuances en français.
- source_word: πάλιν
  choice: re- (dans « repartit »)
  rationale: La répétition exprimée par πάλιν est intégrée au verbe « repartit », formulation fluide qui signifie qu’il partit de nouveau.
- source_word: πέραν τοῦ Ἰορδάνου
  choice: de l’autre côté du Jourdain
  rationale: Cette expression rend clairement la localisation sur la rive opposée sans imposer le point cardinal historique que le grec ne précise pas ici.
- source_word: εἰς τὸν τόπον
  choice: à l’endroit
  rationale: εἰς marque la destination; « à l’endroit » est naturel en français dans cette proposition relative.
- source_word: ὅπου ἦν Ἰωάννης τὸ πρῶτον βαπτίζων
  choice: où Jean baptisait au début
  rationale: L’imparfait « baptisait » restitue l’activité en cours exprimée par ἦν avec le participe présent, tandis que « au début » conserve la valeur temporelle de τὸ πρῶτον.
- source_word: ἔμεινεν
  choice: resta
  rationale: « Resta » traduit directement l’aoriste de μένω et convient au registre narratif.
- source_word: ἐκεῖ
  choice: y
  rationale: Le pronom adverbial « y » reprend naturellement « à l’endroit » et évite une répétition pesante.
theological_decisions: []
translation_notes:
  register: Français moderne, courant et digne. La phrase suit de près le mouvement du grec tout en évitant un calque lourd. Aucun renvoi n’est ajouté puisque « de l’autre côté du Jourdain » exprime directement l’ambiguïté géographique de πέραν sans la résoudre.
