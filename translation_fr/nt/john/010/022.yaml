  text: Ἐγένετο ⸀τότε τὰ ἐγκαίνια ἐν ⸀τοῖς Ἱεροσολύμοις· ⸀χειμὼν ἦν,
base_translation:
  language: en
  yaml_path: translation/nt/john/010/022.yaml
  text: At that time the Feast of Dedication took place in Jerusalem[a]. It was winter,
translation:
  language: fr
  text: Alors, il y eut à Jérusalem la fête de la Dédicace[a]. C’était l’hiver.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Hanoucca », fête juive commémorant la redédicace du temple.
    reason: Note culturelle identifiant la fête désignée par le terme grec.
lexical_decisions:
- source_word: Ἐγένετο
  choice: on célébrait
  rationale: Dans ce contexte festif, le verbe introduit la tenue de la fête. Cette tournure idiomatique française conserve la valeur événementielle sans donner l’impression que la fête venait seulement de commencer.
- source_word: τότε
  choice: À ce moment-là
  rationale: Rend clairement la transition temporelle dans un français narratif naturel.
- source_word: τὰ ἐγκαίνια
  choice: la fête de la Dédicace
  rationale: Le pluriel grec désigne ici la fête commémorant la nouvelle dédicace du temple. Cette formulation traduit le terme tout en restant intelligible aux lecteurs qui ne connaissent pas son nom courant.
- source_word: ἐν τοῖς Ἱεροσολύμοις
  choice: à Jérusalem
  rationale: « À Jérusalem » est l’expression locative française naturelle avec un nom de ville.
- source_word: χειμὼν ἦν
  choice: C’était l’hiver
  rationale: Traduction directe, naturelle et descriptive de la proposition grecque, qui conserve sa brièveté et sa portée saisonnière.
theological_decisions:
- issue: Identification de τὰ ἐγκαίνια
  choice: la fête de la Dédicace dans le texte principal
  alternative: Hanoucca
  rationale: Le texte principal traduit le terme grec au lieu de lui substituer son appellation courante. La note fournit cette appellation et précise la portée historique de la fête sans surinterprétation doctrinale.
translation_notes:
  register: Français international moderne, digne et accessible. « On célébrait » est plus naturel que le calque « eut lieu », tandis que « C’était l’hiver » garde la sobriété de la notation grecque.
