source:
  edition: SBLGNT
  text: καὶ ἄλλα πρόβατα ἔχω ἃ οὐκ ἔστιν ἐκ τῆς αὐλῆς ταύτης· κἀκεῖνα ⸂δεῖ με⸃ ἀγαγεῖν, καὶ τῆς φωνῆς μου ἀκούσουσιν, καὶ ⸀γενήσονται μία ποίμνη, εἷς ποιμήν.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/016.yaml
  text: And I have other sheep that are not from this sheepfold[a]. I must bring them also, and they will listen to my voice. Then there will be one flock[b], one shepherd.
translation:
  language: fr
  text: J’ai aussi d’autres brebis qui ne sont pas de cet enclos. Je dois aussi les amener, et elles écouteront ma voix.[a] Alors il y aura un seul troupeau, un seul berger.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « elles entendront ma voix ». Le verbe grec peut signifier « entendre » ou « écouter » ; ici, le contexte suggère probablement une écoute réceptive.'
    reason: lexical_alternative
  - marker: b
    text: Le grec distingue l’« enclos » (αὐλή), où les brebis sont gardées, du « troupeau » (ποίμνη), c’est-à-dire le groupe de brebis. La dernière expression signifie donc « un seul troupeau », et non « un seul enclos ».
    reason: alternative_reading
lexical_decisions:
- source_word: ἄλλα πρόβατα
  choice: d’autres brebis
  rationale: πρόβατα désigne des brebis ou des moutons, sans évoquer spécifiquement des agneaux. « D’autres brebis » est naturel en français et maintient le lien avec l’image pastorale.
- source_word: αὐλή
  choice: enclos
  rationale: Dans ce contexte pastoral, αὐλή désigne l’espace clos où sont gardées les brebis. « Enclos » est clair et permet de le distinguer de ποίμνη, le troupeau.
- source_word: κἀκεῖνα
  choice: Celles-là aussi
  rationale: Le pronom neutre pluriel grec renvoie aux « autres brebis ». Le féminin pluriel convient naturellement à « brebis » en français, et « aussi » rend καί.
- source_word: δεῖ με ἀγαγεῖν
  choice: je dois les conduire
  rationale: δεῖ exprime une nécessité forte, rendue par « je dois ». Dans l’image du berger, « conduire » traduit naturellement ἄγω tout en conservant l’idée de mener les brebis.
- source_word: τῆς φωνῆς μου ἀκούσουσιν
  choice: elles écouteront ma voix
  rationale: ἀκούω peut signifier entendre ou écouter. Ici, l’image johannique des brebis suggère une écoute réceptive; « écouteront » exprime cette nuance sans rendre explicite une obéissance que le verbe ne formule pas à lui seul.
- source_word: γενήσονται
  choice: il y aura
  rationale: Le futur de γίνομαι décrit ici le résultat à venir. « Il y aura » est idiomatique en français et conserve ce sens, bien que « elles deviendront » soit grammaticalement possible.
- source_word: μία ποίμνη
  choice: un seul troupeau
  rationale: ποίμνη désigne le groupe de brebis, non leur enceinte. « Un seul troupeau » préserve la distinction avec αὐλή, rendu par « enclos ».
- source_word: εἷς ποιμήν
  choice: un seul berger
  rationale: ποιμήν signifie « berger ». La répétition de « un seul » restitue le parallélisme et l’unité exprimée par μία et εἷς.
theological_decisions:
- issue: Distinction entre αὐλή et ποίμνη
  choice: de cet enclos … un seul troupeau
  alternative: de cette bergerie … une seule bergerie
  rationale: 'Le grec emploie deux noms différents : αὐλή pour l’enceinte et ποίμνη pour le groupe de brebis. Les rendre distinctement évite de transformer l’unité du troupeau sous un berger en unité d’un même lieu clos ou d’une structure institutionnelle.'
- issue: Force de δεῖ
  choice: je dois les conduire
  alternative: il me faut les conduire
  rationale: « Je dois » conserve clairement la nécessité exprimée par δεῖ, qui peut avoir une portée théologique dans Jean, sans expliquer ni préciser la source de cette nécessité.
- issue: Sens de ἀκούω
  choice: elles écouteront ma voix
  alternative: elles entendront ma voix
  rationale: Le contexte pastoral favorise une audition réceptive, mais le verbe peut aussi se traduire littéralement par « entendre ». Le texte principal retient « écouter », tandis que la note conserve l’autre possibilité.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation reste accessible, préserve la métaphore pastorale et maintient la distinction lexicale essentielle entre l’enclos et le troupeau.
