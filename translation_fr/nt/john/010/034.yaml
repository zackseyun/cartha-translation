  text: ἀπεκρίθη αὐτοῖς ὁ Ἰησοῦς· Οὐκ ἔστιν γεγραμμένον ἐν τῷ νόμῳ ὑμῶν ⸀ὅτι Ἐγὼ εἶπα· Θεοί ἐστε;
base_translation:
  language: en
  yaml_path: translation/nt/john/010/034.yaml
  text: Jesus answered them[a], “Is it not written in your Law, ‘I said, you are gods’?”
translation:
  language: fr
  text: 'Jésus leur répondit : « N’est-il pas écrit dans votre Loi : “J’ai dit : vous êtes des dieux[a]” ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des êtres divins ». Jésus cite le Psaume 82.6, dont l’interprétation fait débat ; le texte principal conserve la formulation directe de la citation.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη αὐτοῖς
  choice: leur répondit
  rationale: Tournure narrative naturelle en français, qui rend à la fois le verbe de réponse et son complément au datif.
- source_word: Οὐκ ἔστιν γεγραμμένον
  choice: N’est-il pas écrit
  rationale: Formule française consacrée et naturelle pour introduire une citation de l’Écriture, tout en conservant la forme interrogative grecque.
- source_word: ἐν τῷ νόμῳ ὑμῶν
  choice: dans votre Loi
  rationale: « Loi » désigne ici les Écritures juives au sens large, puisque la citation vient du Psaume 82; la majuscule signale cet emploi scripturaire.
- source_word: Ἐγὼ εἶπα
  choice: J’ai dit
  rationale: Le passé composé est l’équivalent idiomatique du discours direct en français moderne et conserve le sujet explicite de la citation.
- source_word: Θεοί ἐστε
  choice: Vous êtes des dieux
  rationale: Traduction directe du nom pluriel et de la copule, sans ajouter une interprétation telle que « vous êtes appelés ».
theological_decisions:
- issue: Traduction de θεοί dans la citation du Psaume 82.6
  choice: dieux
  alternative: êtres divins
  rationale: « Dieux » conserve le sens lexical direct et la force rhétorique de la citation de Jésus. L’autre possibilité est indiquée en note afin de préserver le débat interprétatif sans le trancher dans le texte.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation garde la tension théologique du texte et évite de paraphraser θεοί. Le marqueur [a] est placé immédiatement après le terme concerné.
