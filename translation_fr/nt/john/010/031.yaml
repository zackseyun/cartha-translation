  text: Ἐβάστασαν ⸀οὖν πάλιν λίθους οἱ Ἰουδαῖοι ἵνα λιθάσωσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/031.yaml
  text: So the Jews picked up stones again to stone him[a].
translation:
  language: fr
  text: Alors, les Juifs ramassèrent de nouveau des pierres pour le lapider[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou peut-être, selon le contexte : « les chefs juifs » ou « les Judéens ». Chez Jean, l’expression « les Juifs » désigne souvent certains adversaires juifs de Jésus plutôt que le peuple juif dans son ensemble.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐβάστασαν
  choice: ramassèrent
  rationale: Avec λίθους dans cette scène hostile, « ramasser des pierres » exprime naturellement en français le fait de les prendre pour s’en servir immédiatement.
- source_word: οὖν
  choice: Alors
  rationale: Le terme relie cette réaction aux paroles précédentes de Jésus. « Alors » convient au déroulement narratif sans alourdir la phrase.
- source_word: πάλιν
  choice: de nouveau
  rationale: Cette expression rend clairement l’idée de répétition et rappelle une réaction hostile antérieure.
- source_word: λίθους
  choice: des pierres
  rationale: Traduction directe de λίθους; la finalité meurtrière est exprimée par le verbe suivant plutôt que ajoutée au nom.
- source_word: οἱ Ἰουδαῖοι
  choice: les Juifs
  rationale: La formulation grecque est conservée dans le texte principal sans en restreindre explicitement la portée; une note précise que, chez Jean, elle peut désigner plus particulièrement certains adversaires juifs de Jésus.
- source_word: ἵνα λιθάσωσιν αὐτόν
  choice: pour le lapider
  rationale: « Pour » exprime la finalité de ἵνα avec le subjonctif, et « lapider » rend précisément λιθάζω dans un français naturel et concis.
theological_decisions:
- issue: Référent et portée de οἱ Ἰουδαῖοι dans l’Évangile selon Jean
  choice: Conserver « les Juifs » dans le texte principal et signaler en note une portée contextuellement plus restreinte.
  alternative: « les chefs juifs » ou « les Judéens »
  rationale: Le grec dit explicitement « les Juifs » et le verset ne précise pas qu’il s’agit des chefs. Toutefois, chez Jean, cette expression vise souvent des adversaires juifs particuliers de Jésus plutôt que l’ensemble du peuple juif; la note préserve cette nuance sans résoudre silencieusement l’ambiguïté.
translation_notes:
  register: Français international moderne, naturel et digne. « Lapider » est courant et précis; la syntaxe reste concise tout en préservant le lien narratif et l’ambiguïté du référent.
