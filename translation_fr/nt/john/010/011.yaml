id: JHN.10.11
reference: John 10:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἐγώ εἰμι ὁ ποιμὴν ὁ καλός· ὁ ποιμὴν ὁ καλὸς τὴν ψυχὴν αὐτοῦ τίθησιν ὑπὲρ τῶν προβάτων·
base_translation:
  language: en
  yaml_path: translation/nt/john/010/011.yaml
  text: I am the good shepherd[c][b][a]. The good shepherd lays down his life for the sheep.
translation:
  language: fr
  text: Moi, je suis le bon berger[a]. Le bon berger donne sa vie[b] pour les brebis[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le noble berger »; le grec peut désigner ce qui est bon, noble, admirable ou exemplaire.
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « dépose son âme »; cette expression grecque signifie ici « donne sa vie ».
    reason: lexical_alternative
  - marker: c
    text: Ou « en faveur des brebis ».
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐγώ εἰμι
  choice: Moi, je suis
  rationale: Le pronom grec explicite donne de l’emphase. « Moi, je suis » la restitue naturellement en français sans transformer la formule en affirmation théologique plus explicite que le contexte immédiat.
- source_word: ποιμήν
  choice: berger
  rationale: « Berger » correspond directement à l’image grecque et évite les associations ecclésiales plus tardives que pourrait introduire « pasteur ».
- source_word: καλός
  choice: bon
  rationale: « Bon » est naturel, exact et consacré dans cette expression; le mot grec peut également évoquer ce qui est noble, admirable ou exemplaire, nuance signalée en note.
- source_word: τὴν ψυχὴν αὐτοῦ τίθησιν
  choice: donne sa vie
  rationale: Dans cette expression, ψυχή désigne la vie et non distinctement l’âme immatérielle. « Donner sa vie » rend en français courant l’idée de s’en dessaisir volontairement, là où un calque comme « déposer sa vie » serait peu naturel.
- source_word: ὑπὲρ
  choice: pour
  rationale: « Pour » conserve de façon concise la portée bénéficiaire ou représentative de la préposition sans imposer une théorie particulière de l’expiation.
- source_word: τῶν προβάτων
  choice: les brebis
  rationale: « Les brebis » est l’équivalent français traditionnel et naturel dans l’image du berger; aucun possessif absent du grec n’est ajouté.
theological_decisions:
- issue: Portée de l’auto-identification Ἐγώ εἰμι
  choice: « Moi, je suis » sans explicitation supplémentaire
  alternative: « Je suis »; ou une formulation faisant explicitement allusion au nom divin
  rationale: La construction est ici une identification avec attribut. L’emphase du pronom est conservée, mais les éventuelles résonances johanniques plus larges ne sont pas inscrites de force dans la traduction.
- issue: Sens de καλός dans le titre du berger
  choice: « le bon berger »
  alternative: « le noble berger » ou « le berger exemplaire »
  rationale: « Bon » préserve l’expression établie et laisse ouvertes les nuances de noblesse, de beauté morale et de caractère exemplaire du terme grec.
- issue: Portée de ὑπὲρ τῶν προβάτων
  choice: « pour les brebis »
  alternative: « en faveur des brebis » ou « à la place des brebis »
  rationale: Le français « pour » maintient la latitude bénéficiaire et représentative de ὑπέρ sans réduire la phrase à une formulation technique d’une doctrine particulière de l’expiation.
translation_notes:
  register: Français international moderne, digne et accessible. « Moi, je suis » marque l’emphase grecque sans lourdeur excessive. « Donne sa vie » privilégie l’idiome français naturel, tandis que la note conserve la forme littérale. Les marqueurs sont placés immédiatement après les expressions concernées.
