source:
  edition: SBLGNT
  text: Ἀμὴν ἀμὴν λέγω ὑμῖν, ὁ μὴ εἰσερχόμενος διὰ τῆς θύρας εἰς τὴν αὐλὴν τῶν προβάτων ἀλλὰ ἀναβαίνων ἀλλαχόθεν ἐκεῖνος κλέπτης ἐστὶν καὶ λῃστής·
base_translation:
  language: en
  yaml_path: translation/nt/john/010/001.yaml
  text: Truly[a], truly, I say to you, the one who does not enter through the door into the sheepfold[c][b], but climbs up from somewhere else—that man is a thief and a robber.
translation:
  language: fr
  text: '« En vérité, en vérité, je vous le dis : celui qui n’entre pas par la porte dans l’enclos des brebis[a], mais qui y monte par un autre endroit, celui-là est un voleur et un brigand[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans la bergerie ». Le grec αὐλή désigne une cour ou un espace clos servant ici à rassembler les brebis.
    reason: lexical_alternative
  - marker: b
    text: Le grec distingue le « voleur » (κλέπτης), qui dérobe, du « brigand » (λῃστής), terme qui peut évoquer le vol par la force ou la violence.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀμὴν ἀμὴν
  choice: Oui, je vous le dis en vérité
  rationale: Cette formule française naturelle et solennelle rend la double affirmation sémitique propre à Jésus. Elle en conserve la forte valeur d’attestation sans employer le peu idiomatique « amen, amen ».
- source_word: λέγω ὑμῖν
  choice: je vous le dis
  rationale: Rend directement la formule d’adresse tout en s’intégrant naturellement à l’expression introductive française.
- source_word: ὁ μὴ εἰσερχόμενος
  choice: celui qui n’entre pas
  rationale: Conserve le participe substantivé au singulier sous une forme française claire et actuelle.
- source_word: διὰ τῆς θύρας
  choice: par la porte
  rationale: « Porte » est l’équivalent direct de θύρα et convient à l’image concrète d’un accès à l’enclos; « entrée » ou « portail » expliciteraient davantage le contexte.
- source_word: εἰς τὴν αὐλὴν τῶν προβάτων
  choice: dans l’enclos des brebis
  rationale: αὐλή désigne ici un espace clos. « Enclos des brebis » préserve la construction grecque et reste immédiatement compréhensible.
- source_word: ἀλλὰ ἀναβαίνων ἀλλαχόθεν
  choice: mais qui y monte par un autre endroit
  rationale: « Monte » garde le mouvement exprimé par ἀναβαίνων, qui suggère ici le franchissement de l’enceinte, tandis que « par un autre endroit » rend ἀλλαχόθεν sans le transformer en abstrait « d’une autre manière ».
- source_word: ἐκεῖνος
  choice: celui-là
  rationale: Le démonstratif français restitue l’insistance de ἐκεῖνος sans ajouter un nom absent du grec.
- source_word: κλέπτης
  choice: voleur
  rationale: Terme courant pour celui qui dérobe, souvent de manière furtive.
- source_word: λῃστής
  choice: brigand
  rationale: Distingue λῃστής de κλέπτης et suggère le vol ouvert ou violent, tout en restant intelligible dans un registre biblique digne.
theological_decisions:
- issue: Portée métaphorique de l’image de la porte et de l’enclos
  choice: Conserver l’image concrète sans en expliciter ici les correspondances théologiques.
  alternative: Identifier dès ce verset la porte, les brebis ou les intrus à leurs référents possibles dans la suite du discours.
  rationale: Le verset introduit une comparaison que le contexte développera. L’explication dans la traduction anticiperait le discours et réduirait sa tension interprétative.
- issue: Rapport entre κλέπτης et λῃστής
  choice: 'Maintenir deux désignations distinctes : « voleur » et « brigand ».'
  alternative: Fusionner les termes en une seule idée, par exemple « un voleur » ou « un malfaiteur ».
  rationale: Le grec coordonne deux noms dont les nuances ne sont pas identiques; leur maintien préserve l’intensification et la possible idée de violence.
- issue: Référence générique du participe masculin singulier
  choice: Employer « celui qui… celui-là », formulation générique au singulier.
  alternative: Employer « quiconque » ou une formulation plurielle épicène.
  rationale: Cette construction suit le singulier du grec, reste naturelle en français et n’ajoute pas « homme » au texte.
translation_notes:
  register: Français international moderne, clair et digne. L’ouverture adopte une tournure idiomatique consacrée pour la double formule Ἀμὴν ἀμὴν. La syntaxe conserve le mouvement de la longue phrase grecque, avec une ponctuation qui en facilite la lecture.
