  text: τὰ πρόβατα τὰ ἐμὰ τῆς φωνῆς μου ⸀ἀκούουσιν, κἀγὼ γινώσκω αὐτά, καὶ ἀκολουθοῦσίν μοι,
base_translation:
  language: en
  yaml_path: translation/nt/john/010/027.yaml
  text: My sheep hear my voice, and I know them, and they follow me.
translation:
  language: fr
  text: Mes brebis entendent ma voix, et moi, je les connais, et elles me suivent.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πρόβατα
  choice: brebis
  rationale: Dans la métaphore pastorale, « brebis » est l’équivalent français traditionnel et naturel du nom grec neutre pluriel, qui peut désigner collectivement les moutons du troupeau.
- source_word: τὰ ἐμὰ
  choice: mes
  rationale: L’adjectif possessif substantivé et articulé marque l’appartenance. Le possessif français « mes » l’exprime naturellement sans alourdir par « qui sont à moi ».
- source_word: φωνῆς
  choice: voix
  rationale: Dans le contexte où les brebis reconnaissent le berger, « voix » rend précisément le sens personnel de φωνή, plutôt que le terme plus général « son ».
- source_word: ἀκούουσιν
  choice: écoutent
  rationale: Avec « ma voix », le français idiomatique emploie volontiers « écouter ». Le présent exprime ici une conduite caractéristique et continue. « Entendent » resterait possible, mais pourrait n’évoquer que la perception auditive.
- source_word: κἀγὼ
  choice: moi, je
  rationale: La crase unit καί et ἐγώ. Après le point-virgule, « moi, je » rend l’accent porté par le pronom exprimé tout en gardant une tournure française naturelle.
- source_word: γινώσκω
  choice: connais
  rationale: « Connaître » conserve à la fois le sens direct du verbe et sa profondeur relationnelle dans Jean, sans ajouter une explication doctrinale.
- source_word: αὐτά
  choice: les
  rationale: Le pronom objet renvoie aux brebis. Le clitique français « les » est la reprise naturelle, malgré le genre grammatical féminin de « brebis ».
- source_word: ἀκολουθοῦσίν μοι
  choice: elles me suivent
  rationale: Le présent simple rend l’action habituelle ou caractéristique. Le pronom féminin pluriel s’accorde grammaticalement avec « brebis ».
theological_decisions:
- issue: Portée relationnelle de γινώσκω dans la métaphore du berger et des brebis
  choice: « je les connais », sans explicitation
  alternative: « je les connais personnellement » ou « je les reconnais »
  rationale: Le grec présente une relation entre Jésus et ses brebis, mais n’impose pas une paraphrase. « Connais » préserve la richesse et la tension théologiques sans les réduire à une formulation doctrinale plus étroite.
translation_notes:
  register: Français international moderne, simple et digne. Le point-virgule distingue les trois affirmations coordonnées sans rompre leur unité. « Écoutent » est retenu pour son naturel avec « voix » et sa pertinence relationnelle, tandis que « moi, je » reflète la légère emphase de κἀγώ.
