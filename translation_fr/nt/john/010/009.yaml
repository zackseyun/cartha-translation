id: JHN.10.9
reference: John 10:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐγώ εἰμι ἡ θύρα· δι’ ἐμοῦ ἐάν τις εἰσέλθῃ σωθήσεται καὶ εἰσελεύσεται καὶ ἐξελεύσεται καὶ νομὴν εὑρήσει.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/009.yaml
  text: I am the door. If anyone enters through me[a], he will be saved, and will go in and go out and find pasture.
translation:
  language: fr
  text: Je suis la porte[a]. Si quelqu’un entre par moi, il sera sauvé ; il entrera et sortira, et il trouvera un pâturage.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le portail ». Le mot grec peut désigner une porte ou un portail ; « porte » est retenu dans le texte comme l’équivalent lexical le plus direct.'
    reason: lexical_alternative
lexical_decisions:
- source_word: θύρα
  choice: porte
  rationale: « Porte » est l’équivalent lexical le plus direct et conserve la formulation concise de la métaphore johannique. Dans le contexte pastoral, le terme grec peut aussi désigner la porte ou l’entrée d’un enclos.
- source_word: δι’ ἐμοῦ
  choice: par moi
  rationale: Avec le génitif, διά exprime ici le moyen ou l’intermédiaire. « Par moi » est naturel en français et présente Jésus comme le moyen d’entrer.
- source_word: ἐάν τις εἰσέλθῃ
  choice: Si quelqu’un entre
  rationale: La construction ἐάν suivie du subjonctif exprime une condition générale et ouverte. Cette formulation française en préserve le caractère indéfini.
- source_word: σωθήσεται
  choice: il sera sauvé
  rationale: Le verbe peut signifier sauver, secourir ou délivrer. « Sera sauvé » maintient à la fois la portée théologique du quatrième Évangile et l’imagerie de sécurité du contexte, sans la réduire à l’une ou à l’autre.
- source_word: εἰσελεύσεται καὶ ἐξελεύσεται
  choice: il entrera et sortira
  rationale: Cette traduction reproduit le parallélisme des deux verbes de mouvement sans ajouter explicitement une idée de permission, de liberté ou de sécurité.
- source_word: νομὴν
  choice: un pâturage
  rationale: Le nom désigne un pâturage ou ce qui sert à paître. « Un pâturage » s’intègre clairement à l’image des brebis dans le contexte immédiat.
- source_word: εὑρήσει
  choice: il trouvera
  rationale: « Trouver » rend directement le sens courant de εὑρίσκω et conserve la simplicité de l’énoncé.
theological_decisions:
- issue: Rendu métaphorique de θύρα dans un contexte pastoral
  choice: porte
  alternative: porte de l’enclos / portail
  rationale: « Porte » conserve l’équivalent lexical direct ainsi que la forme traditionnelle et frappante de la parole « Je suis ». La note signale la nuance pastorale possible sans l’introduire de manière interprétative dans le texte principal.
- issue: Portée de σωθήσεται
  choice: il sera sauvé
  alternative: il sera secouru / délivré
  rationale: Le choix retenu ne limite pas le verbe à une protection physique et ne lui impose pas non plus une définition systématique plus étroite que celle du passage. Il préserve la tension entre salut théologique et sécurité évoquée par l’image pastorale.
translation_notes:
  register: Français international moderne, simple et digne. La syntaxe reste proche du rythme grec, notamment dans la suite « il entrera et sortira », tout en employant une ponctuation française naturelle.
