  text: καὶ περιεπάτει ὁ Ἰησοῦς ἐν τῷ ἱερῷ ἐν τῇ στοᾷ ⸀τοῦ Σολομῶνος.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/023.yaml
  text: And Jesus was walking in the temple courts[b][a], in Solomon’s Portico.
translation:
  language: fr
  text: Et Jésus marchait dans l’enceinte du Temple, dans le portique de Salomon[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «dans la colonnade de Salomon»; le mot grec désigne une galerie couverte bordée de colonnes.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Et
  rationale: Rend simplement la coordination grecque, sans ajouter une nuance temporelle absente du texte.
- source_word: περιεπάτει
  choice: marchait
  rationale: L’imparfait grec présente l’action comme en cours dans le passé; l’imparfait français la restitue naturellement.
- source_word: ἐν τῷ ἱερῷ
  choice: dans l’enceinte du Temple
  rationale: ἱερόν désigne ici l’ensemble du complexe du Temple, et non le sanctuaire intérieur; «enceinte» évite de limiter indûment le lieu à un bâtiment précis.
- source_word: ἐν τῇ στοᾷ
  choice: sous le portique
  rationale: στοά désigne une galerie couverte bordée de colonnes; «sous» exprime naturellement le déplacement à l’intérieur de cet espace couvert.
- source_word: τοῦ Σολομῶνος
  choice: de Salomon
  rationale: Le génitif grec forme avec στοά le nom usuel du lieu; le complément avec «de» est idiomatique en français.
theological_decisions: []
translation_notes:
  register: Français moderne, naturel et digne. La majuscule à «Temple» signale le Temple de Jérusalem. Le choix «enceinte du Temple» préserve la distinction entre ἱερόν, l’ensemble du complexe, et ναός, le sanctuaire proprement dit.
