id: JHN.1.20
reference: John 1:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ὡμολόγησεν καὶ οὐκ ἠρνήσατο, καὶ ὡμολόγησεν ὅτι ⸂Ἐγὼ οὐκ εἰμὶ⸃ ὁ χριστός.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/020.yaml
  text: And he confessed and did not deny[a], but confessed, “I am not the Messiah.”
translation:
  language: fr
  text: 'Il le déclara ouvertement et ne le nia pas ; il déclara : « Je ne suis pas le Messie[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le Christ ». Le titre grec est Χριστός (Christos). Ici, il est employé comme titre messianique ; le texte principal le traduit donc par « le Messie ».'
    reason: alternative_reading
lexical_decisions:
- source_word: ὡμολόγησεν
  choice: déclara ouvertement / déclara
  rationale: Dans ce contexte, ὁμολογέω désigne une déclaration publique et sans détour. « Déclara » restitue ce sens avec naturel en français, tandis que la répétition préserve l’insistance solennelle du grec.
- source_word: οὐκ ἠρνήσατο
  choice: ne le nia pas
  rationale: Cette traduction directe conserve la formulation emphatique et correspond à l’emploi johannique courant de ἀρνέομαι.
- source_word: καὶ ... καὶ ... καὶ
  choice: et ... ; ...
  rationale: Le premier « et » et la reprise de « déclara » maintiennent l’accumulation rhétorique. Le point-virgule rend le dernier καί avec une articulation naturelle en français sans introduire un contraste absent du propos.
- source_word: Ἐγὼ οὐκ εἰμὶ
  choice: Je ne suis pas
  rationale: Le français exprime ici une négation directe et suffisamment emphatique par « Je ne suis pas ». Ajouter « moi-même » alourdirait inutilement la phrase.
- source_word: ὁ χριστός
  choice: le Messie
  rationale: Χριστός fonctionne ici comme le titre du libérateur oint attendu, et non comme un nom propre. « Le Messie » restitue clairement ce cadre juif.
theological_decisions:
- issue: Traduction de Χριστός employé comme titre
  choice: le Messie
  alternative: le Christ
  rationale: Jean nie être l’oint attendu. « Le Messie » rend la fonction titulaire du terme et son arrière-plan juif, tandis que « le Christ » reste une traduction possible signalée en note.
translation_notes:
  register: Français international moderne, sobre et digne. La répétition de « déclara » conserve l’insistance du grec sans employer « confessa », qui évoquerait trop facilement l’aveu d’une faute en français contemporain.
