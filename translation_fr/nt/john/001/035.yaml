  text: Τῇ ἐπαύριον πάλιν εἱστήκει ⸀ὁ Ἰωάννης καὶ ἐκ τῶν μαθητῶν αὐτοῦ δύο,
base_translation:
  language: en
  yaml_path: translation/nt/john/001/035.yaml
  text: On the next day[a], John was standing there again, and two of his disciples were with him.
translation:
  language: fr
  text: Le lendemain[a], Jean se tenait de nouveau là, et deux de ses disciples étaient avec lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Le lendemain, Jean se tenait de nouveau là, avec deux de ses disciples. »'
    reason: 'La coordination grecque est elliptique : cette formulation française rend la présence conjointe sans expliciter le prédicat « étaient avec lui ».'
lexical_decisions:
- source_word: Τῇ ἐπαύριον
  choice: Le lendemain
  rationale: Cette expression temporelle idiomatique désigne le jour suivant. « Le lendemain » est la formulation française la plus naturelle dans ce récit.
- source_word: πάλιν
  choice: de nouveau
  rationale: Le terme signale la répétition par rapport à la scène précédente et assure la continuité narrative.
- source_word: εἱστήκει
  choice: se tenait … là
  rationale: Cette forme décrit un état qui durait dans le passé. « Se tenait là » rend naturellement en français la posture ou la présence de Jean; « là » est explicité pour l’idiomaticité sans ajouter un lieu précis.
- source_word: ὁ Ἰωάννης
  choice: Jean
  rationale: Le texte grec donne simplement le nom « Jean ». Le préciser comme Jean-Baptiste dans le corps du texte dépasserait la formulation de la source.
- source_word: καὶ
  choice: et
  rationale: La conjonction coordonne simplement Jean et les deux disciples, conformément à la parataxe grecque.
- source_word: ἐκ τῶν μαθητῶν αὐτοῦ δύο
  choice: deux de ses disciples étaient avec lui
  rationale: « Deux de ses disciples » conserve la valeur partitive de ἐκ. Le prédicat « étaient avec lui » est suppléé naturellement à partir de la scène, sans imposer que les disciples adoptaient exactement la même posture.
theological_decisions: []
translation_notes:
  register: Français international actuel, simple et digne. La syntaxe reste proche de la coordination grecque tout en explicitant le prédicat nécessaire à une lecture française naturelle.
