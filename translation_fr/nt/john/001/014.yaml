id: JHN.1.14
reference: John 1:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ ὁ λόγος σὰρξ ἐγένετο καὶ ἐσκήνωσεν ἐν ἡμῖν, καὶ ἐθεασάμεθα τὴν δόξαν αὐτοῦ, δόξαν ὡς μονογενοῦς παρὰ πατρός, πλήρης χάριτος καὶ ἀληθείας·
base_translation:
  language: en
  yaml_path: translation/nt/john/001/014.yaml
  text: And the Word became flesh and dwelt among us[a], and we saw his glory, glory as of the one and only Son from the Father[b], full of grace and truth.
translation:
  language: fr
  text: Et la Parole est devenue chair et a habité parmi nous[a]. Nous avons contemplé sa gloire, une gloire comme celle du Fils unique venu du Père[b], lui qui est plein de grâce et de vérité.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « a dressé sa tente parmi nous » ; le verbe grec peut évoquer la tente sacrée, ou tabernacle, où Dieu manifestait sa présence.
    reason: lexical_alternative
  - marker: b
    text: On peut aussi rendre le grec par « le seul engendré » ou « l’Unique ». Le terme souligne que ce Fils est sans pareil.
    reason: alternative_reading
lexical_decisions:
- source_word: λόγος
  choice: la Parole
  rationale: Conserve le titre johannique établi et la richesse personnelle et théologique du terme, que « message » ou « raison » ne rendraient que partiellement.
- source_word: σὰρξ
  choice: chair
  rationale: Rend directement le grec et affirme la réalité de l’existence humaine corporelle de la Parole sans la réduire à une abstraction comme « nature humaine ».
- source_word: ἐγένετο
  choice: est devenue
  rationale: Exprime naturellement en français le changement affirmé par le texte, tout en maintenant la continuité du sujet, la Parole.
- source_word: ἐσκήνωσεν ἐν ἡμῖν
  choice: a habité parmi nous
  rationale: Formulation claire et naturelle. L’écho possible à la tente sacrée ou au tabernacle est conservé en note.
- source_word: ἐθεασάμεθα
  choice: avons contemplé
  rationale: Exprime une perception directe et attentive sans recourir au registre vieilli de « nous avons vu de nos yeux » ou « nous avons admiré ».
- source_word: δόξαν
  choice: gloire
  rationale: Terme biblique courant qui conserve la portée théologique du grec et ses résonances dans le prologue.
- source_word: ὡς
  choice: comme celle de
  rationale: Maintient la comparaison qualitative introduite par ὡς sans la transformer en simple identité grammaticale.
- source_word: μονογενοῦς
  choice: du Fils unique
  rationale: Dans la relation au Père, « Fils » est le substantif implicite naturel. « Unique » exprime ici le caractère sans pareil de cette filiation sans imposer une analyse étymologique contestée.
- source_word: παρὰ πατρός
  choice: venu du Père
  rationale: Rend naturellement l’idée de provenance ou de relation exprimée par παρά dans ce contexte johannique.
- source_word: πλήρης χάριτος καὶ ἀληθείας
  choice: lui qui est plein de grâce et de vérité
  rationale: Le tour avec « lui » évite que le féminin français « pleine » fasse grammaticalement de la gloire, plutôt que de la Parole ou du Fils, le référent de πλήρης.
theological_decisions:
- issue: Sens christologique de μονογενοῦς
  choice: le Fils unique
  alternative: le seul engendré ; l’Unique
  rationale: Le contexte paternel autorise l’explicitation « Fils », tandis que « unique » conserve le sens de singularité sans faire dépendre la traduction d’une étymologie débattue. Les autres possibilités sont signalées en note.
- issue: Écho au tabernacle dans ἐσκήνωσεν
  choice: a habité parmi nous
  alternative: a dressé sa tente parmi nous
  rationale: Le texte principal privilégie un français actuel et digne. La note préserve l’image concrète de la tente et son possible écho à la présence divine dans le tabernacle sans imposer cette interprétation dans le corps du verset.
- issue: Référent de πλήρης
  choice: lui qui est plein de grâce et de vérité
  alternative: pleine de grâce et de vérité
  rationale: Le masculin singulier grec rattache πλήρης à la Parole ou au Fils, et non au nom féminin français « gloire ». La reprise pronominale maintient ce lien tout en laissant ouverte la nuance précise entre la Parole et le Fils unique.
translation_notes:
  register: Français international moderne, accessible et digne. « La Parole », « chair », « gloire », « grâce » et « vérité » conservent le vocabulaire biblique central. La ponctuation en deux phrases améliore la lisibilité sans modifier la progression du grec. La reprise « lui qui » empêche une fausse association grammaticale entre « pleine » et « gloire ».
