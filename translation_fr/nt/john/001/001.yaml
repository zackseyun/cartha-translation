id: JHN.1.1
reference: John 1:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἐν ἀρχῇ ἦν ὁ λόγος, καὶ ὁ λόγος ἦν πρὸς τὸν θεόν, καὶ θεὸς ἦν ὁ λόγος.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/001.yaml
  text: In the beginning was the Word[a], and the Word was with God[b], and the Word was God.
translation:
  language: fr
  text: Au commencement, était la Parole, la Parole était avec Dieu, et la Parole était Dieu.[a][b]
  philosophy: optimal-equivalence
  footnotes: &id001
  - marker: a
    text: 'On peut aussi rendre ou expliciter la nuance ainsi : « la Parole était de nature divine » ou « ce que Dieu était, la Parole l’était ». Dans la dernière proposition, « Dieu » est employé sans article et avant le verbe en grec; cette formulation peut mettre l’accent sur ce qu’était la Parole, tout en la distinguant de Dieu, avec qui elle était dans la proposition précédente.'
    reason: alternative_reading
  - marker: b
    text: Cette expression fait écho à Genèse 1.1 et associe la Parole au commencement de la création.
    reason: cross_reference
lexical_decisions:
- source_word: Ἐν ἀρχῇ
  choice: Au commencement
  rationale: Cette expression naturelle et solennelle fait écho à Genèse 1.1 et situe la Parole avant et au seuil de la création.
- source_word: ἦν
  choice: était
  rationale: L’imparfait de εἰμί se rend naturellement par « était » et permet de conserver la cadence répétée du grec.
- source_word: ὁ λόγος
  choice: la Parole
  rationale: « La Parole » est le titre français établi qui conserve les dimensions de parole, de révélation et d’identité personnelle présentes dans le contexte johannique, sans réduire λόγος à « message » ni le translittérer en « Logos ».
- source_word: πρὸς τὸν θεόν
  choice: avec Dieu
  rationale: Dans ce contexte, « avec Dieu » exprime naturellement la proximité relationnelle ainsi que la distinction personnelle. « tournée vers Dieu » ferait davantage ressortir l’orientation impliquée par πρός, mais serait moins direct en français courant.
- source_word: θεὸς ἦν ὁ λόγος
  choice: la Parole était Dieu
  rationale: 'Cette formulation française fidèle et concise rend la valeur qualitative du prédicat θεός : elle affirme ce qu’est la Parole quant à sa nature, sans l’identifier personnellement au Dieu mentionné dans la proposition précédente.'
theological_decisions:
- issue: Rendu du prédicat θεός sans article dans la dernière proposition
  choice: la Parole était Dieu
  alternative: la Parole était de nature divine ; ce que Dieu était, la Parole l’était
  rationale: L’ordre et l’absence d’article donnent ici au prédicat une force qualitative. Le texte principal garde la formulation française la plus directe, qui affirme pleinement la divinité de la Parole, tandis que la note explicite la nuance et préserve la distinction avec Dieu dans la proposition précédente.
translation_notes:
  register: Français international moderne, clair et digne. La répétition de « la Parole était » conserve le parallélisme solennel du grec. Les marqueurs de notes sont placés auprès des expressions qu’ils expliquent.
