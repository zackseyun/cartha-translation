  text: καὶ ἤκουσαν ⸂οἱ δύο μαθηταὶ αὐτοῦ⸃ λαλοῦντος καὶ ἠκολούθησαν τῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/037.yaml
  text: And the two disciples heard him speaking[a], and they followed Jesus.
translation:
  language: fr
  text: Les deux disciples de Jean[a] l’entendirent parler et suivirent Jésus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ses deux disciples » ; le pronom renvoie à Jean le Baptiste.'
    reason: La note signale l’expression pronominale grecque tout en expliquant son référent contextuel.
lexical_decisions:
- source_word: ἤκουσαν
  choice: entendirent
  rationale: L’aoriste de ἀκούω présente simplement le fait qu’ils ont entendu les paroles prononcées, sans nécessairement exprimer une écoute prolongée ou attentive.
- source_word: οἱ δύο μαθηταὶ αὐτοῦ
  choice: les deux disciples de Jean
  rationale: Le pronom αὐτοῦ renvoie, d’après le contexte immédiat de Jean 1.35-36, à Jean le Baptiste. Nommer Jean en français évite que « ses deux disciples » soit compris à tort comme désignant les disciples de Jésus.
- source_word: λαλοῦντος
  choice: parler
  rationale: 'Le participe présent indique une action concomitante : ils l’ont entendu pendant qu’il parlait. « Parler » est naturel, neutre et adapté au registre narratif.'
- source_word: ἠκολούθησαν
  choice: suivirent
  rationale: Le verbe désigne ici le fait de marcher à la suite de Jésus tout en laissant résonner le sens plus large de devenir son disciple.
- source_word: τῷ Ἰησοῦ
  choice: Jésus
  rationale: Avec ἀκολουθέω, le datif désigne la personne suivie. En français, le verbe « suivre » prend naturellement un complément d’objet direct.
theological_decisions:
- issue: Référent de αὐτοῦ dans οἱ δύο μαθηταὶ αὐτοῦ
  choice: Le pronom est compris comme renvoyant à Jean le Baptiste, explicité dans le texte.
  alternative: Conserver la formulation ambiguë « ses deux disciples ».
  rationale: Dans le contexte immédiat, Jean se tient avec deux de ses disciples et leur parle de Jésus. L’explicitation prévient une attribution erronée à Jésus sans modifier l’identité narrative des personnages.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au récit écrit et maintient une formulation concise. La phrase préserve à la fois le mouvement concret à la suite de Jésus et la possible résonance de l’engagement comme disciples.
