  source_fidelity: Le sens causal de ὅτι, la provenance exprimée par ἐκ, l’insistance de ἡμεῖς πάντες et la réception exprimée par ἐλάβομεν sont correctement rendus. Pour χάριν ἀντὶ χάριτος, il convient de conserver une formulation qui laisse percevoir la valeur de remplacement/succession de ἀντί sans imposer l’interprétation cumulative.
  naturalness: '« grâce à la place de grâce » n’est pas une tournure française acceptable : « grâce à » s’interprète normalement comme une cause ou un moyen. « grâce en remplacement de grâce » est grammatical, intelligible et conserve volontairement la tension de l’original. L’ancre de note doit porter sur l’expression qu’elle explique, non sur « reçu ».'
