  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸀ὅτι ἐκ τοῦ πληρώματος αὐτοῦ ἡμεῖς πάντες ἐλάβομεν, καὶ χάριν ἀντὶ χάριτος·
base_translation:
  language: en
  yaml_path: translation/nt/john/001/016.yaml
  text: For from his fullness we have all received[a], and grace upon grace.
translation:
  language: fr
  text: Car, de sa plénitude, nous avons tous reçu, et grâce en remplacement de grâce[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « grâce sur grâce » ou « une grâce après l’autre ». L’expression grecque peut évoquer une succession de grâces, l’une prenant la suite de l’autre, bien que ἀντί signifie plus littéralement « en remplacement de » ou « à la place de ».
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: Car
  rationale: La conjonction introduit ici une explication ou un fondement de ce qui précède; « Car » en conserve naturellement la valeur causale et explicative.
- source_word: ἐκ τοῦ πληρώματος αὐτοῦ
  choice: de sa plénitude
  rationale: Cette formulation concise conserve l’idée que ce qui est reçu provient de la plénitude propre au Logos.
- source_word: ἡμεῖς πάντες
  choice: nous avons tous
  rationale: Le pronom explicite et πάντες donnent une insistance que l’ordre français « nous avons tous » restitue naturellement.
- source_word: ἐλάβομεν
  choice: avons reçu
  rationale: Le passé composé exprime naturellement en français une réception passée dont les effets demeurent présents.
- source_word: καὶ
  choice: et
  rationale: La conjonction relie directement la seconde expression à la première sans préciser davantage leur rapport.
- source_word: χάριν ἀντὶ χάριτος
  choice: grâce à la place de grâce
  rationale: ἀντί signifie fondamentalement « à la place de » ou « en échange de ». Cette traduction volontairement tendue préserve l’ambiguïté entre remplacement et succession plutôt que de la résoudre dans le texte principal.
theological_decisions:
- issue: Interprétation de χάριν ἀντὶ χάριτος
  choice: grâce à la place de grâce
  alternative: grâce sur grâce; une grâce après l’autre
  rationale: L’expression grecque est discutée. Le texte principal conserve la valeur lexicale la plus directe de ἀντί et laisse ouverte la relation entre les deux occurrences de « grâce »; la note présente les lectures plus idiomatiques.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure « grâce à la place de grâce » est moins idiomatique, mais elle est maintenue afin de rendre visible la tension réelle de l’expression grecque; la note fournit les formulations françaises plus naturelles.
