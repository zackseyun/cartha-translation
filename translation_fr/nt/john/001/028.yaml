  text: ταῦτα ἐν Βηθανίᾳ ἐγένετο πέραν τοῦ Ἰορδάνου, ὅπου ἦν ⸀ὁ Ἰωάννης βαπτίζων.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/028.yaml
  text: These things took place in Bethany beyond the Jordan[a], where John was baptizing.
translation:
  language: fr
  text: Cela se passa à Béthanie, de l’autre côté du Jourdain[a], là où Jean baptisait.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Certains manuscrits et des traditions de traduction plus tardives portent « Béthabara » au lieu de « Béthanie ».
    reason: textual_variant
lexical_decisions:
- source_word: ταῦτα
  choice: Cela
  rationale: Le démonstratif grec est pluriel et renvoie à l’ensemble des paroles et événements précédents. En français courant, le singulier collectif « Cela » reprend naturellement cet ensemble sans en modifier le sens.
- source_word: ἐν Βηθανίᾳ
  choice: à Béthanie
  rationale: Avec un nom de ville, le français emploie normalement « à » pour rendre la valeur locative de ἐν.
- source_word: ἐγένετο
  choice: se passa
  rationale: Dans ce contexte narratif, γίνομαι indique qu’un événement a eu lieu. « Se passa » est naturel, actuel et suffisamment soutenu.
- source_word: πέραν τοῦ Ἰορδάνου
  choice: de l’autre côté du Jourdain
  rationale: Cette formulation exprime clairement la position située au-delà du fleuve par rapport au point de vue narratif, sans prétendre préciser la rive.
- source_word: ὅπου
  choice: là où
  rationale: « Là où » rattache naturellement la proposition relative au lieu qui vient d’être nommé.
- source_word: ἦν … βαπτίζων
  choice: baptisait
  rationale: La construction périphrastique à l’imparfait présente une activité en cours. L’imparfait français « baptisait » en restitue naturellement l’aspect.
theological_decisions:
- issue: Lecture du nom de lieu Βηθανίᾳ (« Béthanie ») ou variante Βηθαβαρᾷ (« Béthabara »)
  choice: Béthanie
  alternative: Béthabara
  rationale: Le texte critique SBLGNT porte Βηθανίᾳ. La variante historiquement connue « Béthabara » est signalée en note plutôt qu’introduite dans le texte principal.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation concise conserve le rythme narratif; « Jean baptisait » maintient le vocabulaire biblique établi sans développer le mode du baptême.
