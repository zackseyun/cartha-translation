id: JHN.1.50
reference: John 1:50
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ· Ὅτι εἶπόν σοι ⸀ὅτι εἶδόν σε ὑποκάτω τῆς συκῆς πιστεύεις; μείζω τούτων ⸀ὄψῃ.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/050.yaml
  text: Jesus answered and said to him[a], “Because I told you that I saw you under the fig tree, do you believe? You will see greater things than these.”
translation:
  language: fr
  text: 'Jésus lui répondit : « Parce que je t’ai dit que je t’ai vu sous le figuier, tu crois ?[a] Tu verras de plus grandes choses que celles-ci. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Est-ce parce que je t’ai dit que je t’ai vu sous le figuier que tu crois ? »'
    reason: La relation entre la proposition causale initiale et la question peut être explicitée ainsi en français.
lexical_decisions:
- source_word: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ
  choice: Jésus lui répondit
  rationale: La formule narrative grecque associe littéralement « répondit » et « dit », mais le français naturel les fond en « répondit » sans perte de sens.
- source_word: Ὅτι
  choice: Parce que
  rationale: Le premier ὅτι a ici une valeur causale et introduit le motif soumis à la question.
- source_word: ὅτι
  choice: que
  rationale: Le second ὅτι introduit le contenu des paroles de Jésus.
- source_word: εἶδόν σε ὑποκάτω τῆς συκῆς
  choice: je t’ai vu sous le figuier
  rationale: Le passé composé convient au récit oral en français moderne et conserve l’image concrète du texte grec.
- source_word: πιστεύεις
  choice: tu crois ?
  rationale: Le présent et la forme interrogative sont conservés, sans préciser davantage l’objet de la foi ni transformer la question en reproche explicite.
- source_word: μείζω τούτων ὄψῃ
  choice: Tu verras des choses plus grandes encore
  rationale: Le neutre pluriel substantivé est rendu par « des choses »; « encore » donne une formulation française naturelle au comparatif sans modifier la promesse.
theological_decisions:
- issue: Portée de la question πιστεύεις;
  choice: 'Une question rhétorique ouverte : « tu crois ? »'
  alternative: Une affirmation (« tu crois parce que… ») ou une question explicitement développée (« Est-ce parce que… que tu crois ? »)
  rationale: La traduction maintient l’interrogation et son possible ton de léger étonnement ou de mise à l’épreuve, sans la durcir en reproche ni résoudre son ambiguïté pragmatique.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement correspond au singulier grec et à l’usage habituel du dialogue biblique. La formule redondante « répondit et dit » n’est pas reproduite, car elle serait pesante en français.
