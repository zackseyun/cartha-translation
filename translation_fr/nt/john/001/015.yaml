  text: (Ἰωάννης μαρτυρεῖ περὶ αὐτοῦ καὶ κέκραγεν λέγων· Οὗτος ἦν ⸂ὃν εἶπον⸃· Ὁ ὀπίσω μου ἐρχόμενος ἔμπροσθέν μου γέγονεν, ὅτι πρῶτός μου ἦν·)
base_translation:
  language: en
  yaml_path: translation/nt/john/001/015.yaml
  text: John testifies about him and has cried out[a], saying, “This was he of whom I said, ‘The one coming after me has become before me[b], because he was before me.’”
translation:
  language: fr
  text: 'Jean témoigne à son sujet et s’est écrié : « C’est de lui que j’ai dit : “Celui qui vient après moi est passé devant moi[a], parce qu’il était avant moi[b].” »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « a pris le pas sur moi », « m’a surpassé » ou « m’a précédé ». Le grec peut exprimer la priorité ou le rang aussi bien que l’ordre de succession.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « il existait avant moi ». « Il était avant moi » suit de plus près la formulation grecque, tout en laissant entendre la préexistence dans ce contexte.'
    reason: alternative_reading
lexical_decisions:
- source_word: μαρτυρεῖ περὶ αὐτοῦ
  choice: témoigne à son sujet
  rationale: Le présent grec présente le témoignage de Jean comme actuel ou vivement rapporté. « Témoigne à son sujet » est naturel en français moderne et conserve le sens de témoignage.
- source_word: κέκραγεν
  choice: s’est écrié
  rationale: Le passé composé rend naturellement en français le parfait grec, qui présente le cri comme proféré avec une portée encore actuelle.
- source_word: Οὗτος ἦν ὃν εἶπον
  choice: C’est de lui que j’ai dit
  rationale: Cette formulation idiomatique identifie clairement la personne désignée. Elle évite le tour peu naturel « C’était celui dont j’ai dit », tout en conservant le renvoi à une parole antérieure.
- source_word: Ὁ ὀπίσω μου ἐρχόμενος
  choice: Celui qui vient après moi
  rationale: Le participe substantivé est rendu par une relative naturelle. « Après moi » laisse ouverte l’idée d’une venue postérieure dans le temps ou dans le ministère.
- source_word: ἔμπροσθέν μου γέγονεν
  choice: a pris place devant moi
  rationale: Cette expression conserve l’image spatiale de ἔμπροσθεν et la valeur résultative du parfait de γίνομαι, sans imposer exclusivement une lecture chronologique ou hiérarchique.
- source_word: ὅτι πρῶτός μου ἦν
  choice: parce qu’il était avant moi
  rationale: « Parce que » marque explicitement la relation causale. « Il était avant moi » reste proche du grec et permet au contexte de porter l’implication de préexistence.
theological_decisions:
- issue: Degré d’explicitation de la préexistence du Christ dans πρῶτός μου ἦν
  choice: parce qu’il était avant moi
  alternative: parce qu’il existait avant moi
  rationale: Le contexte johannique soutient fortement la préexistence, mais le verbe grec est simplement « était ». La traduction retenue préserve la portée théologique sans ajouter explicitement « existait ».
- issue: Sens de ἔμπροσθέν μου γέγονεν
  choice: a pris place devant moi
  alternative: m’a surpassé / a pris le pas sur moi / m’a précédé
  rationale: Le grec peut évoquer la position, la priorité ou le rang. Le texte principal garde cette tension, tandis que la note signale les principales interprétations possibles.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste fluide à l’oral comme à l’écrit. Les formulations choisies évitent le vocabulaire confessionnel spécialisé et maintiennent l’ambiguïté réelle entre antériorité, préséance et supériorité.
