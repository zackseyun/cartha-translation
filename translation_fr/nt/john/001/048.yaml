  text: λέγει αὐτῷ Ναθαναήλ· Πόθεν με γινώσκεις; ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ· Πρὸ τοῦ σε Φίλιππον φωνῆσαι ὄντα ὑπὸ τὴν συκῆν εἶδόν σε.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/048.yaml
  text: Nathanael said to him[a], “How do you know me?” Jesus answered and said to him, “Before Philip called you, while you were under the fig tree, I saw you.”
translation:
  language: fr
  text: 'Nathanaël lui dit[a] : « Comment me connais-tu ? » Jésus lui répondit : « Avant que Philippe t’appelle, alors que tu étais sous le figuier, je t’ai vu. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « D’où me connais-tu ? »'
    reason: alternative_lexical_rendering
lexical_decisions:
- source_word: Πόθεν με γινώσκεις
  choice: D’où me connais-tu ?
  rationale: « D’où » conserve le sens littéral de Πόθεν et exprime naturellement en français une interrogation sur l’origine ou le fondement de la connaissance de Jésus.
- source_word: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ
  choice: Jésus lui répondit
  rationale: En français moderne, « répondit » rend naturellement la formule discursive grecque à deux verbes sans lourdeur inutile.
- source_word: Πρὸ τοῦ σε Φίλιππον φωνῆσαι
  choice: Avant que Philippe t’appelle
  rationale: Cette formulation rend clairement l’antériorité marquée par Πρὸ τοῦ avec l’infinitif et le sens courant de φωνέω dans ce contexte.
- source_word: ὄντα ὑπὸ τὴν συκῆν
  choice: quand tu étais sous le figuier
  rationale: La proposition circonstancielle restitue naturellement le participe ὄντα et la situation dans laquelle Jésus a vu Nathanaël.
- source_word: εἶδόν σε
  choice: je t’ai vu
  rationale: Le passé composé est la forme narrative naturelle en dialogue français et rend directement l’aoriste, l’antériorité étant déjà indiquée par « Avant que ».
theological_decisions:
- issue: Nature de la connaissance que Jésus a de Nathanaël
  choice: Présenter simplement le fait que Jésus l’a vu auparavant
  alternative: Préciser qu’il s’agit d’une connaissance surnaturelle, prophétique ou d’une observation ordinaire
  rationale: Le verset ne précise pas comment Jésus a vu ou connu Nathanaël. La traduction conserve cette indétermination et laisse le contexte orienter l’interprétation.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement correspond au dialogue direct singulier. « Nathanaël » suit l’orthographe française usuelle du nom biblique.
