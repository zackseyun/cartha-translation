source:
  edition: SBLGNT
  text: ἔφη· Ἐγὼ φωνὴ βοῶντος ἐν τῇ ἐρήμῳ· Εὐθύνατε τὴν ὁδὸν κυρίου, καθὼς εἶπεν Ἠσαΐας ὁ προφήτης.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/023.yaml
  text: He said[a], “I am a voice of one crying out in the wilderness, ‘Make straight the way of the Lord,’ just as Isaiah the prophet said.”
translation:
  language: fr
  text: 'Il dit[a] : « Moi, je suis une voix, celle de quelqu’un qui crie dans le désert : “Rendez droit le chemin du Seigneur”, comme l’a dit le prophète Ésaïe. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre rattachement possible : « Moi, je suis une voix dans le désert, celle de quelqu’un qui crie. » En grec, « dans le désert » peut se rattacher soit à « celui qui crie », soit à « voix » ; le texte principal retient le rattachement le plus naturel.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἔφη
  choice: Il déclara
  rationale: Dans cette réponse solennelle où Jean cite l’Écriture, « déclara » rend naturellement l’introduction du discours sans alourdir la phrase.
- source_word: Ἐγὼ
  choice: Moi, je
  rationale: Le pronom grec explicite porte une certaine emphase; la dislocation française « Moi, je » la fait entendre naturellement dans cette identification contrastive.
- source_word: φωνὴ
  choice: la voix
  rationale: Même sans article en grec, le français idiomatique emploie ici l’article défini dans la formule identificatrice qui reprend Ésaïe; cela ne transforme pas la voix en titre technique.
- source_word: βοῶντος
  choice: de celui qui crie
  rationale: Le participe génitif se rattache naturellement à « voix »; « crie » conserve la vigueur de l’appel prophétique.
- source_word: ἐν τῇ ἐρήμῳ
  choice: dans le désert
  rationale: « Désert » est le terme français courant pour ἔρημος dans ce contexte, pouvant désigner une région inhabitée sans imposer un désert de sable.
- source_word: Εὐθύνατε
  choice: Rendez droit
  rationale: L’impératif exprime une action directe et conserve l’image d’un chemin que l’on rectifie.
- source_word: τὴν ὁδὸν
  choice: le chemin
  rationale: « Chemin » préserve à la fois l’image concrète et sa portée métaphorique, dans un français naturel.
- source_word: κυρίου
  choice: du Seigneur
  rationale: Dans la citation d’Ésaïe, « Seigneur » maintient la portée scripturaire et théologique de κύριος sans la réduire à « maître ».
- source_word: καθὼς
  choice: comme
  rationale: « Comme » marque clairement et sobrement la correspondance avec la parole prophétique.
- source_word: εἶπεν
  choice: l’a dit
  rationale: Le passé composé convient au français moderne pour une parole ancienne toujours invoquée comme témoignage.
- source_word: Ἠσαΐας ὁ προφήτης
  choice: le prophète Ésaïe
  rationale: Cet ordre est le plus naturel en français tout en transmettant pleinement l’apposition grecque.
theological_decisions:
- issue: Sens de κύριος dans la citation d’Ésaïe
  choice: le Seigneur
  alternative: le maître
  rationale: « Seigneur » conserve l’écho de la désignation divine dans le texte prophétique et la tension christologique du contexte johannique, sans l’expliciter davantage.
- issue: Rattachement de « dans le désert »
  choice: la voix de celui qui crie dans le désert
  alternative: la voix dans le désert de celui qui crie
  rationale: Le rattachement au criant est la lecture syntaxique la plus naturelle et correspond au portrait narratif de Jean; la note signale néanmoins l’autre construction que permet l’ordre grec.
- issue: Valeur de l’article devant « voix »
  choice: la voix
  alternative: une voix
  rationale: Le français demande naturellement « la voix de celui qui crie » dans cette citation définie. Le choix ne prétend pas effacer l’absence d’article grec ni faire de l’expression un titre exclusif.
translation_notes:
  register: Français international moderne, digne et oralement fluide. La citation conserve une formulation biblique reconnaissable sans archaïsme. « Moi, je » rend l’emphase de Ἐγώ; « désert » est plus idiomatique que « lieu désert ».
