  naturalness: Le français est globalement fluide et de registre biblique moderne. « Il dit » est plus naturel dans ce dialogue. La note actuelle propose une formulation française pesante et ambiguë (« la voix dans le désert de celui qui crie ») ; elle doit présenter l’autre rattachement syntaxique de manière française et intelligible.
  terminology: « désert », « chemin » et « Seigneur » sont des équivalents appropriés et conservent l’imagerie ainsi que la portée scripturaire de la citation. « Rendez droit » est une traduction compréhensible et proche de l’impératif grec.
