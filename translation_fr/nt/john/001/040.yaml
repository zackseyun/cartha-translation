source:
  edition: SBLGNT
  text: ἦν Ἀνδρέας ὁ ἀδελφὸς Σίμωνος Πέτρου εἷς ἐκ τῶν δύο τῶν ἀκουσάντων παρὰ Ἰωάννου καὶ ἀκολουθησάντων αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/john/001/040.yaml
  text: Andrew[a], Simon Peter’s brother, was one of the two who had heard from John and followed him.
translation:
  language: fr
  text: André, le frère de Simon Pierre, était l’un des deux qui avaient entendu Jean et qui avaient suivi Jésus[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « et qui l’avaient suivi ». Dans le contexte, « l’ » désigne Jésus.'
    reason: Préciser la formulation pronominale du grec et son référent contextuel.
lexical_decisions:
- source_word: ἦν
  choice: était
  rationale: L’imparfait de εἰμί sert ici de copule et identifie André comme l’un des deux disciples.
- source_word: Ἀνδρέας
  choice: André
  rationale: Forme française traditionnelle et courante du nom grec.
- source_word: ὁ ἀδελφὸς Σίμωνος Πέτρου
  choice: le frère de Simon Pierre
  rationale: Cette formulation naturelle conserve la relation familiale et le double nom « Simon Pierre ».
- source_word: εἷς ἐκ τῶν δύο
  choice: l’un des deux
  rationale: Équivalent idiomatique et précis de l’expression partitive grecque.
- source_word: τῶν ἀκουσάντων παρὰ Ἰωάννου
  choice: qui avaient entendu Jean
  rationale: Dans ce contexte, ἀκούω suivi de παρά avec le génitif désigne naturellement le fait d’entendre une personne parler; le plus-que-parfait marque l’antériorité par rapport à l’identification exprimée par « était ».
- source_word: καὶ ἀκολουθησάντων αὐτῷ
  choice: et qui avaient suivi Jésus
  rationale: ἀκολουθέω signifie « suivre ». Le nom « Jésus » explicite en français l’antécédent de αὐτῷ, clairement établi par le contexte immédiat, tout en signalant dans une note la formulation grecque littérale.
theological_decisions:
- issue: Référent de αὐτῷ
  choice: Jésus
  alternative: Jean
  rationale: En Jean 1.35-39, les deux disciples entendent Jean puis suivent Jésus. Le contexte narratif identifie donc Jésus comme référent, même si le grec emploie simplement le pronom « lui ».
translation_notes:
  register: Français moderne, international et digne. La répétition de « qui avaient » clarifie que les deux actions concernent les mêmes deux personnes; « entendu Jean » est plus naturel que « entendu de Jean » en français actuel.
