id: JHN.1.32
reference: John 1:32
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἐμαρτύρησεν Ἰωάννης λέγων ὅτι Τεθέαμαι τὸ πνεῦμα καταβαῖνον ⸀ὡς περιστερὰν ἐξ οὐρανοῦ, καὶ ἔμεινεν ἐπ’ αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/john/001/032.yaml
  text: And John testified[a], saying, “I have seen the Spirit descending like a dove out of heaven[b], and it remained on him.”
translation:
  language: fr
  text: 'Jean rendit ce témoignage : « J’ai vu l’Esprit descendre du ciel[a] comme une colombe[b], et il est demeuré sur lui. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « hors du ciel »; on peut aussi traduire : « depuis le ciel ».'
    reason: La préposition ἐξ souligne l’origine et peut évoquer un mouvement hors d’un lieu; « du ciel » est toutefois la formulation française naturelle avec « descendre ».
  - marker: b
    text: 'Ou : « telle une colombe ». Le grec exprime une comparaison sans préciser davantage la nature de la manifestation.'
    reason: Cette note préserve la portée comparative et l’ambiguïté de ὡς περιστερὰν.
lexical_decisions:
- source_word: ἐμαρτύρησεν
  choice: rendit ce témoignage
  rationale: Cette tournure française naturelle conserve la notion de témoignage portée par μαρτυρέω et introduit aisément les paroles rapportées.
- source_word: λέγων
  choice: ':'
  rationale: En français, les deux-points rendent naturellement la fonction du participe λέγων lorsqu’il introduit le contenu du témoignage, sans alourdir la phrase par « en disant ».
- source_word: Τεθέαμαι
  choice: J’ai vu
  rationale: Le passé composé exprime simplement le parfait grec et la portée actuelle d’une vision dont Jean demeure témoin.
- source_word: τὸ πνεῦμα
  choice: l’Esprit
  rationale: Le contexte immédiat désigne l’Esprit Saint; la majuscule identifie ce référent sans ajouter le qualificatif « Saint », absent de ce verset.
- source_word: καταβαῖνον
  choice: descendre
  rationale: Après « j’ai vu », l’infinitif français rend naturellement le participe grec décrivant le mouvement de l’Esprit.
- source_word: ὡς περιστερὰν
  choice: comme une colombe
  rationale: « Comme » conserve la valeur comparative de ὡς sans affirmer que l’Esprit était littéralement une colombe.
- source_word: ἐξ οὐρανοῦ
  choice: du ciel
  rationale: Avec « descendre », « du ciel » exprime naturellement en français le mouvement depuis ou hors du ciel indiqué par ἐξ.
- source_word: ἔμεινεν
  choice: est demeuré
  rationale: « Demeurer » conserve le vocabulaire johannique important de μένω et reste intelligible dans un registre digne.
- source_word: ἐπ’ αὐτόν
  choice: sur lui
  rationale: Cette expression rend directement et naturellement la relation spatiale indiquée par ἐπί avec l’accusatif.
theological_decisions:
- issue: Identification de τὸ πνεῦμα
  choice: « l’Esprit », avec une majuscule, désigne l’Esprit Saint
  alternative: « l’esprit », avec une minuscule
  rationale: Jean 1.32-33 présente l’Esprit comme le signe divin permettant d’identifier celui qui baptise dans l’Esprit Saint. La majuscule explicite le référent contextuel sans ajouter de titre au texte.
- issue: Valeur de ὡς περιστερὰν
  choice: 'comparaison : « comme une colombe »'
  alternative: « sous la forme d’une colombe » ou « en tant que colombe »
  rationale: ὡς exprime naturellement une ressemblance. La traduction garde ouverte la nature exacte de la manifestation et n’impose pas une identification matérielle.
- issue: Genre du pronom reprenant l’Esprit
  choice: « il est demeuré », selon le genre grammatical français de « Esprit »
  alternative: répéter « l’Esprit est demeuré »
  rationale: Le grec omet le pronom sujet devant ἔμεινεν. Le masculin français est imposé par le genre grammatical du nom « Esprit » et ne constitue pas l’ajout d’une précision présente dans le grec.
translation_notes:
  register: Français international moderne, sobre et digne. Le passé simple convient à la narration écrite, tandis que les deux-points évitent le calque plus lourd « en disant ». « Demeurer » est conservé pour maintenir l’écho thématique johannique de μένω.
