  source_fidelity: 'Le texte rend fidèlement les éléments essentiels du grec : Jean donne témoignage, rapporte une vision accomplie (« J’ai vu »), l’Esprit descend, la comparaison avec une colombe est maintenue, l’origine céleste est exprimée, et l’Esprit demeure sur Jésus. L’ordre français « descendre du ciel comme une colombe » reste clair et ne transforme pas la comparaison en identification littérale.'
  naturalness: Le français est naturel, sobre et adapté à une narration biblique moderne. « Jean rendit ce témoignage » et l’introduction par deux-points sont idiomatiques. Le passé simple narratif et « est demeuré » forment un registre cohérent et accessible.
  terminology: « l’Esprit » est contextuellement justifié et respecte l’usage français. « Demeuré » préserve opportunément l’écho johannique de μένω sans archaïsme excessif. « Sur lui » rend directement ἐπ’ αὐτόν. Le pronom masculin « il » suit le genre grammatical français d’« Esprit » sans imposer une interprétation doctrinale supplémentaire.
