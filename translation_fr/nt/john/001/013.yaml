source:
  edition: SBLGNT
  text: οἳ οὐκ ἐξ αἱμάτων οὐδὲ ἐκ θελήματος σαρκὸς οὐδὲ ἐκ θελήματος ἀνδρὸς ἀλλ’ ἐκ θεοῦ ἐγεννήθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/013.yaml
  text: who were born, not from bloods, nor from the will of the flesh, nor from the will of a man, but from God.
translation:
  language: fr
  text: qui sont nés, non des sangs[a], ni de la volonté de la chair, ni de la volonté d’un homme, mais de Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de manière plus idiomatique : « d’une ascendance humaine ». Le grec emploie le pluriel inhabituel « des sangs », qui renvoie à la filiation naturelle ou aux liens du sang.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἳ
  choice: qui
  rationale: Le pronom relatif reprend les personnes mentionnées au verset précédent et conserve le lien syntaxique du grec.
- source_word: ἐξ αἱμάτων
  choice: des sangs
  rationale: Le pluriel inhabituel du grec est conservé afin de rendre son expression frappante, qui évoque l’ascendance naturelle ou la filiation humaine; une formulation plus idiomatique est donnée en note.
- source_word: θελήματος
  choice: volonté
  rationale: « Volonté » rend naturellement le terme grec et permet de maintenir la répétition structurante des deux propositions.
- source_word: σαρκὸς
  choice: la chair
  rationale: « La chair » conserve le vocabulaire concret du texte et désigne ici la génération ou l’impulsion procréatrice humaine, sans lui imposer le sens de « nature pécheresse ».
- source_word: ἀνδρὸς
  choice: un homme
  rationale: Cette expression conserve le singulier et la référence probable à l’agent masculin dans la procréation, sans la réduire au seul sens de « mari ».
- source_word: ἐκ θεοῦ
  choice: de Dieu
  rationale: « De Dieu » exprime naturellement en français l’origine et maintient le contraste avec les trois sources humaines niées.
- source_word: ἐγεννήθησαν
  choice: sont nés
  rationale: Dans ce contexte, le passif de γεννάω se rend clairement et naturellement par « sont nés », tout en laissant entendre que Dieu est la source de cette naissance.
theological_decisions:
- issue: Nature du contraste entre l’origine humaine et l’origine divine
  choice: Le verset affirme une naissance qui ne provient ni de l’ascendance naturelle ni d’une volonté procréatrice humaine, mais de Dieu.
  alternative: On peut comprendre la première négation plus étroitement comme une exclusion de la seule ascendance ethnique, ou interpréter l’ensemble selon des lectures sacramentelles ou métaphysiques ultérieures.
  rationale: La triple négation oppose le mode ordinaire de la génération humaine à une origine divine. La traduction maintient ce contraste sans préciser davantage la nature de cette naissance ni importer une doctrine confessionnelle particulière.
translation_notes:
  register: Français international moderne, digne et lisible. La structure répétitive du grec est conservée. L’expression volontairement étrange « des sangs » est maintenue dans le texte et expliquée en note afin de préserver à la fois la forme marquée de l’original et son sens probable.
