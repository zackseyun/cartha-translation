  text: ⸀ὁ ὀπίσω μου ⸀ἐρχόμενος, οὗ ⸂οὐκ εἰμὶ⸃ ἄξιος ἵνα λύσω αὐτοῦ τὸν ἱμάντα τοῦ ὑποδήματος.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/027.yaml
  text: the one coming after me[a], whose sandal strap I am not worthy to untie.
translation:
  language: fr
  text: celui qui vient après moi[a], dont je ne suis pas digne de dénouer la lanière de la sandale.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « celui qui vient derrière moi » ; le mot grec peut exprimer une position derrière quelqu’un ou une succession dans le temps.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ὀπίσω μου ἐρχόμενος
  choice: celui qui vient après moi
  rationale: Le participe présent substantivé désigne une personne précise. « Celui qui vient après moi » est naturel en français et conserve ici le sens de succession de ὀπίσω μου sans expliciter davantage sa supériorité.
- source_word: οὗ
  choice: dont
  rationale: Le pronom relatif au génitif établit le rapport avec l’action dont cette personne est l’objet. La tournure française « dont je ne suis pas digne de… » rend naturellement la construction grecque, tandis que la possession est exprimée par l’article défini devant « sandale ».
- source_word: οὐκ εἰμὶ ἄξιος
  choice: je ne suis pas digne
  rationale: Cette formulation rend directement l’idée de dignité ou d’aptitude exprimée par ἄξιος et préserve l’humilité de Jean sans surinterprétation.
- source_word: ἵνα λύσω
  choice: de dénouer
  rationale: Après « digne », l’infinitif français rend idiomatiquement ἵνα avec le subjonctif. « Dénouer » décrit précisément l’action exercée sur une lanière nouée.
- source_word: ἱμάντα
  choice: lanière
  rationale: Ἱμάς désigne une lanière ou courroie, notamment celle d’une sandale. « Lanière » est précis, courant et adapté au contexte.
- source_word: τοῦ ὑποδήματος
  choice: de la sandale
  rationale: Ὑπόδημα désigne une chaussure attachée au pied; « sandale » est le terme le plus précis dans ce cadre historique.
theological_decisions:
- issue: Rapport entre « après moi » et celui qui vient
  choice: 'Lecture temporelle et successive : « celui qui vient après moi »'
  alternative: « celui qui vient derrière moi »
  rationale: Dans le contexte johannique, Jean parle de celui qui lui succède dans l’ordre d’apparition. La traduction conserve ce sens courant sans importer dans cette proposition l’affirmation plus développée de sa prééminence présente dans les versets voisins.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste fluide tout en conservant l’humilité marquée de Jean et l’ambiguïté limitée de ὀπίσω entre position et succession.
