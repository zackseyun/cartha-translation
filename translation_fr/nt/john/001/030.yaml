  text: οὗτός ἐστιν ⸀ὑπὲρ οὗ ἐγὼ εἶπον· Ὀπίσω μου ἔρχεται ἀνὴρ ὃς ἔμπροσθέν μου γέγονεν, ὅτι πρῶτός μου ἦν·
base_translation:
  language: en
  yaml_path: translation/nt/john/001/030.yaml
  text: This is he of whom I said[a], ‘After me comes a man who ranks before me[b], because he was before me.’
translation:
  language: fr
  text: 'C’est lui dont j’ai dit : « Après moi vient un homme qui est passé devant moi[a], parce qu’il était avant moi[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « a pris le pas sur moi ». Le grec peut exprimer la préséance ou un rang supérieur, et pas seulement une succession dans le temps.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « il existait avant moi ». Dans ce contexte, ces mots évoquent probablement la préexistence de Jésus, mais le grec dit plus simplement : « il était avant moi ».'
    reason: alternative_reading
lexical_decisions:
- source_word: οὗτός ἐστιν
  choice: C’est lui
  rationale: Cette tournure française naturelle conserve l’identification emphatique introduite par le démonstratif et la copule.
- source_word: ὑπὲρ οὗ ἐγὼ εἶπον
  choice: dont j’ai dit
  rationale: Après le verbe « dire », ὑπὲρ οὗ désigne ici la personne au sujet de laquelle Jean a parlé. « Dont j’ai dit » est concis et idiomatique en français.
- source_word: Ὀπίσω μου ἔρχεται
  choice: Après moi vient
  rationale: La formulation maintient l’ordre comparatif et la position marquée du complément, tout en exprimant naturellement une succession plutôt qu’un simple emplacement spatial.
- source_word: ἀνὴρ
  choice: un homme
  rationale: Le nom grec désigne explicitement un homme adulte et présente Jésus comme une personne humaine concrète.
- source_word: ἔμπροσθέν μου γέγονεν
  choice: a pris place devant moi
  rationale: Le parfait exprime un état acquis. Cette formulation permet de comprendre aussi bien une préséance qu’une position supérieure, sans réduire le sens à la seule chronologie.
- source_word: ὅτι
  choice: parce que
  rationale: La conjonction introduit la raison de la proposition précédente ; « parce que » rend clairement ce lien causal en français moderne.
- source_word: πρῶτός μου ἦν
  choice: il était avant moi
  rationale: Cette expression compacte garde ouverte la portée temporelle et la notion de priorité, sans expliciter davantage que le grec la préexistence de Jésus.
theological_decisions:
- issue: Degré d’explicitation de la préexistence du Christ dans la dernière proposition
  choice: il était avant moi
  alternative: il existait avant moi
  rationale: Le contexte johannique oriente fortement vers la préexistence, mais le grec formule plus sobrement la priorité de Jésus. La traduction retenue préserve cette tension au lieu de l’interpréter directement.
- issue: Sens de la préséance exprimée par ἔμπροσθέν μου γέγονεν
  choice: a pris place devant moi
  alternative: a pris le pas sur moi
  rationale: La formulation principale conserve l’image spatiale tout en pouvant évoquer la préséance. L’alternative rend plus explicitement l’idée de rang supérieur, sans l’imposer dans le corps du texte.
translation_notes:
  register: Français international moderne, digne et accessible. La structure légèrement solennelle « Après moi vient » convient au témoignage public de Jean. Les formulations retenues évitent le jargon théologique dans le texte principal tout en conservant l’ambiguïté intentionnelle entre priorité temporelle et préséance.
