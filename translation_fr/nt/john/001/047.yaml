  text: εἶδεν ⸀ὁ Ἰησοῦς τὸν Ναθαναὴλ ἐρχόμενον πρὸς αὐτὸν καὶ λέγει περὶ αὐτοῦ· Ἴδε ἀληθῶς Ἰσραηλίτης ἐν ᾧ δόλος οὐκ ἔστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/047.yaml
  text: Jesus saw Nathanael coming toward him and said about him, “Look, truly an Israelite in whom there is no deceit.”
translation:
  language: fr
  text: 'Jésus vit Nathanaël venir vers lui et dit à son sujet : « Voici vraiment un Israélite en qui il n’y a aucune tromperie. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἴδε
  choice: Voici
  rationale: Interjection naturelle et digne qui attire l’attention sur Nathanaël sans l’archaïsme de « Voyez ».
- source_word: ἀληθῶς Ἰσραηλίτης
  choice: vraiment un Israélite
  rationale: Conserve la portée de l’adverbe ἀληθῶς et l’ambiguïté possible entre une simple affirmation et l’idée d’un Israélite authentique.
- source_word: δόλος
  choice: tromperie
  rationale: Rend le sens de fraude, duplicité ou intention de tromper sans réduire le terme à la seule ruse intellectuelle.
- source_word: λέγει
  choice: dit
  rationale: Le présent historique grec est rendu par le passé simple, temps narratif naturel en français après « vit ».
theological_decisions:
- issue: Sens de « vraiment un Israélite »
  choice: Maintenir la formulation « vraiment un Israélite »
  alternative: « un véritable Israélite »
  rationale: La formulation retenue préserve la tension entre l’affirmation emphatique de l’identité de Nathanaël et un possible jugement sur son authenticité spirituelle, sans trancher explicitement.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proche du grec tout en suivant une narration française naturelle.
