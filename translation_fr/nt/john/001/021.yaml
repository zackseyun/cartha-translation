source:
  edition: SBLGNT
  text: καὶ ἠρώτησαν αὐτόν· Τί οὖν; ⸂σὺ Ἠλίας εἶ⸃; καὶ λέγει· Οὐκ εἰμί. Ὁ προφήτης εἶ σύ; καὶ ἀπεκρίθη· Οὔ.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/021.yaml
  text: And they asked him[a], “What then? Are you Elijah?” And he says, “I am not.” “Are you the Prophet?” And he answered[b], “No.”
translation:
  language: fr
  text: 'Ils lui demandèrent : « Quoi donc ? Es-tu Élie ? » Il dit[b] : « Je ne le suis pas. » « Es-tu le Prophète[a] ? » Il répondit : « Non. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ce Prophète » ; il s’agit probablement du prophète attendu, semblable à Moïse (Deutéronome 18.15, 18).
    reason: alternative_reading
  - marker: b
    text: 'Le grec emploie ici le présent historique : « il dit », procédé narratif qui donne de la vivacité au récit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠρώτησαν
  choice: demandèrent
  rationale: Dans ce récit, le verbe introduit une question directe. « Demandèrent » est naturel en français moderne sans ajouter l’intensité que pourrait suggérer « interrogèrent ».
- source_word: Τί οὖν;
  choice: Alors quoi ?
  rationale: Cette formule brève relance l’interrogatoire après la réponse précédente. « Alors quoi ? » en conserve le caractère abrupt et l’enchaînement logique, sans expliciter « qui es-tu ? », absent du grec.
- source_word: σὺ Ἠλίας εἶ
  choice: Es-tu Élie ?
  rationale: La tournure interrogative française rend naturellement la question grecque. Le pronom explicite σὺ est suffisamment représenté par « tu », et Ἠλίας reçoit sa forme française conventionnelle « Élie ».
- source_word: Οὐκ εἰμί
  choice: Je ne le suis pas
  rationale: Le français exige ici normalement le pronom « le » pour reprendre l’identité proposée. La réponse reste brève et catégorique, sans préciser la nature de l’identification ni harmoniser ce démenti avec d’autres passages.
- source_word: Ὁ προφήτης
  choice: le Prophète
  rationale: L’article défini désigne une figure particulière attendue, et non un prophète quelconque. La majuscule signale cet emploi titulaire sans identifier explicitement cette figure dans le corps du texte.
- source_word: λέγει
  choice: Il dit
  rationale: Le présent historique grec apporte de la vivacité au récit. Le présent français le conserve ici de manière intelligible, malgré l’aoriste précédent rendu au passé simple.
- source_word: ἀπεκρίθη
  choice: Il répondit
  rationale: Le passé simple convient au verbe narratif à l’aoriste et distingue cette forme du présent historique λέγει.
- source_word: Οὔ
  choice: Non
  rationale: La particule négative isolée constitue une réponse directe et catégorique ; « Non » en est l’équivalent français naturel.
theological_decisions:
- issue: Identité du « Prophète »
  choice: Conserver « le Prophète » sans préciser son identité dans le texte principal.
  alternative: « ce prophète » ou une explicitation telle que « le prophète semblable à Moïse »
  rationale: L’article grec désigne vraisemblablement une figure attendue, souvent mise en rapport avec Deutéronome 18. La traduction préserve toutefois l’expression du texte sans trancher entièrement son référent.
- issue: Démenti de Jean concernant Élie
  choice: Rendre directement « Je ne le suis pas » sans explication harmonisante.
  alternative: Préciser « Je ne suis pas Élie au sens littéral » ou rapprocher explicitement cette réponse des passages synoptiques.
  rationale: Le verset présente un refus net. Une harmonisation avec d’autres textes résoudrait une tension que la traduction doit préserver.
translation_notes:
  register: Français international moderne, sobre et digne. Le passé simple maintient le registre narratif biblique sans archaïsme marqué. La formule « Alors quoi ? » conserve la brièveté abrupte du grec, tandis que le présent « Il dit » reproduit délibérément le présent historique johannique.
