id: JHN.1.10
reference: John 1:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἐν τῷ κόσμῳ ἦν, καὶ ὁ κόσμος δι’ αὐτοῦ ἐγένετο, καὶ ὁ κόσμος αὐτὸν οὐκ ἔγνω.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/010.yaml
  text: He was in the world[a], and the world came into being through him[b], and the world did not know him.
translation:
  language: fr
  text: Il était dans le monde, et le monde est venu à l’existence par lui[a], et le monde ne l’a pas connu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le monde a été fait par lui ». Le verbe grec signifie « venir à l’existence » ou « commencer à exister ».
    reason: lexical_alternative
  - marker: b
    text: « Ne l’a pas connu » peut aussi se comprendre « ne l’a pas reconnu ».
    reason: lexical_alternative
lexical_decisions:
- source_word: κόσμῳ / κόσμος
  choice: monde
  rationale: La répétition de « monde » dans les trois propositions reproduit celle du grec et préserve l’éventail de sens johannique, qui peut inclure la création, le monde habité et l’humanité.
- source_word: ἦν
  choice: était
  rationale: L’imparfait exprime simplement la présence continue du sujet dans le monde, tout en maintenant le contraste avec ἐγένετο.
- source_word: δι’ αὐτοῦ
  choice: par lui
  rationale: Avec le génitif, διά exprime ici l’intermédiaire ou l’agent. « Par lui » est naturel en français et correspond au rôle déjà énoncé en Jean 1.3.
- source_word: ἐγένετο
  choice: est venu à l’existence
  rationale: Cette formulation rend le passage à l’existence et distingue clairement ce verbe de ἦν, « était », sans réduire le sens au seul verbe « faire ».
- source_word: ἔγνω
  choice: ne l’a pas connu
  rationale: « Connaître » conserve la formulation grecque et sa profondeur relationnelle. Dans ce contexte, le verbe peut aussi comporter les idées de reconnaître ou d’accueillir comme tel, signalées en note.
- source_word: αὐτόν / αὐτοῦ
  choice: lui / l’
  rationale: Les pronoms renvoient personnellement au Logos dans le contexte immédiat. Les formes françaises masculines maintiennent cette référence.
theological_decisions:
- issue: Référent du sujet sous-entendu
  choice: Employer « Il », avec pour référent le Logos du contexte immédiat.
  alternative: Employer une forme impersonnelle ou neutre si l’on isolait artificiellement le verset de son contexte.
  rationale: Le sujet n’est pas nommé dans ce verset, mais le prologue vient de présenter le Logos comme un sujet personnel. « Il » suit la continuité du discours sans ajouter de désignation absente du grec.
- issue: Langage de la création en rapport avec le Logos
  choice: Traduire « le monde est venu à l’existence par lui ».
  alternative: « le monde a été fait par lui »
  rationale: Le choix maintient le contraste textuel entre l’existence continue exprimée par ἦν et l’entrée dans l’existence exprimée par ἐγένετο, sans introduire une terminologie doctrinale extérieure au verset.
- issue: Portée de la dernière conjonction καί
  choice: Conserver « et » dans la troisième proposition.
  alternative: « mais »
  rationale: Le contexte comporte un contraste évident, mais le grec répète καί. Garder « et » préserve la structure sobre et cumulative de l’original sans expliciter davantage la relation logique.
translation_notes:
  register: Français international moderne, sobre et digne. La triple répétition de « monde » et le double « et » gardent le rythme et l’ambiguïté du grec. « Est venu à l’existence » est légèrement soutenu, mais clair et précis dans ce contexte.
