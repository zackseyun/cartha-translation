  text: Τῇ ἐπαύριον βλέπει τὸν Ἰησοῦν ἐρχόμενον πρὸς αὐτόν, καὶ λέγει· Ἴδε ὁ ἀμνὸς τοῦ θεοῦ ὁ αἴρων τὴν ἁμαρτίαν τοῦ κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/029.yaml
  text: The next day he sees Jesus coming toward him and says, “Look, the Lamb of God, who takes away the sin of the world!”
translation:
  language: fr
  text: 'Le lendemain, il voit Jésus venir vers lui et dit : « Voici l’Agneau de Dieu, celui qui enlève le péché du monde ! »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τῇ ἐπαύριον
  choice: Le lendemain
  rationale: Expression française naturelle qui rend directement l’indication temporelle grecque.
- source_word: βλέπει
  choice: il voit
  rationale: Le présent narratif grec est conservé pour maintenir la vivacité du récit.
- source_word: Ἴδε
  choice: Regardez !
  rationale: Impératif d’appel à l’attention, naturel en français moderne et adressé aux personnes présentes.
- source_word: ὁ ἀμνὸς τοῦ θεοῦ
  choice: l’Agneau de Dieu
  rationale: Rend littéralement le titre métaphorique et conserve ses résonances sacrificielles sans les expliciter dans le texte.
- source_word: ὁ αἴρων
  choice: celui qui enlève
  rationale: La construction substantivée est rendue explicitement; « enlève » conserve le sens central de αἴρω sans imposer ici une explication précise du mécanisme.
- source_word: τὴν ἁμαρτίαν τοῦ κόσμου
  choice: le péché du monde
  rationale: Le singulier grec est maintenu, ainsi que la portée universelle de κόσμος.
theological_decisions:
- issue: Sens de αἴρων appliqué au péché
  choice: celui qui enlève
  alternative: celui qui porte
  rationale: αἴρω peut évoquer le fait de soulever, porter ou ôter. Dans cette construction, « enlever le péché » est idiomatique et contextuellement fort, tout en évitant de préciser au-delà du grec comment cet enlèvement s’accomplit.
- issue: Référent sacrificiel de « l’Agneau de Dieu »
  choice: conserver la métaphore sans l’expliquer
  alternative: expliciter une référence à l’agneau pascal ou au sacrifice
  rationale: Le verset ne précise pas lui-même quelle tradition scripturaire particulière domine; la formulation préserve donc la richesse et l’ambiguïté théologiques de l’image.
translation_notes:
  register: Français international moderne, clair et digne. Le présent narratif est conservé. « Regardez ! » restitue l’interpellation vive de Ἴδε; la ponctuation met en relief la proclamation sans ajouter de contenu.
