id: JHN.1.9
reference: John 1:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἦν τὸ φῶς τὸ ἀληθινὸν ὃ φωτίζει πάντα ἄνθρωπον ἐρχόμενον εἰς τὸν κόσμον.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/009.yaml
  text: The true light[a], which enlightens every person, was coming into the world.
translation:
  language: fr
  text: La vraie lumière[a], qui éclaire tout être humain, venait dans le monde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « La vraie lumière, qui éclaire tout être humain venant dans le monde, était là. » Le participe grec traduit par « venant » peut se rapporter à « tout être humain » plutôt qu’à « la vraie lumière ».'
    reason: alternative_reading
lexical_decisions:
- source_word: φῶς
  choice: lumière
  rationale: Le nom courant « lumière » conserve l’image johannique et sa portée christologique sans imposer une majuscule absente du grec.
- source_word: ἀληθινόν
  choice: vraie
  rationale: « Vraie » exprime ici ce qui est authentique et ultime, conformément à l’usage johannique, plutôt qu’une simple exactitude factuelle.
- source_word: φωτίζει
  choice: éclaire
  rationale: « Éclaire » rend naturellement en français à la fois l’image lumineuse et sa portée métaphorique.
- source_word: πάντα ἄνθρωπον
  choice: tout être humain
  rationale: Cette expression restitue le singulier distributif et la référence générique à l’humanité dans un français moderne et inclusif.
- source_word: ἐρχόμενον εἰς τὸν κόσμον
  choice: venait dans le monde
  rationale: Le texte principal rattache par le sens le participe à « la vraie lumière »; avec l’imparfait ἦν, « venait » donne une formulation française naturelle tout en conservant l’idée de son entrée dans le monde.
- source_word: κόσμον
  choice: monde
  rationale: « Monde » est l’équivalent français normal de κόσμος dans ce contexte johannique.
- source_word: ἦν
  choice: venait
  rationale: L’imparfait est intégré à la construction participiale pour former « venait dans le monde », plutôt qu’un calque maladroit avec « était ».
theological_decisions:
- issue: Rattachement syntaxique de ἐρχόμενον (« venant »)
  choice: 'Rattachement par le sens à « la vraie lumière » : « La vraie lumière… venait dans le monde. »'
  alternative: 'Rattachement à « tout être humain » : « La vraie lumière, qui éclaire tout être humain venant dans le monde, était là. »'
  rationale: Le participe masculin singulier à l’accusatif peut grammaticalement qualifier ἄνθρωπον. Toutefois, le contexte du prologue et l’usage johannique de la venue dans le monde favorisent la lecture christologique. La variante en note maintient l’ambiguïté réelle du grec.
translation_notes:
  register: Français international moderne, clair et digne. « Tout être humain » évite le masculin générique potentiellement ambigu aujourd’hui. La syntaxe reste fluide tout en signalant en note l’ambiguïté du participe grec.
