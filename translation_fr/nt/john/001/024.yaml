  variant: modern international French
source:
  edition: SBLGNT
  text: ⸀Καὶ ἀπεσταλμένοι ἦσαν ἐκ τῶν Φαρισαίων.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/024.yaml
  text: And they had been sent from the Pharisees[a].
translation:
  language: fr
  text: Or, ceux qui avaient été envoyés étaient issus du groupe des pharisiens[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Or, ils avaient été envoyés par les pharisiens. » Le grec dit plus littéralement qu’ils étaient issus des pharisiens.'
    reason: alternative_reading
lexical_decisions:
- source_word: Καὶ
  choice: Or
  rationale: Connecteur narratif naturel en français dans ce contexte; il assure la continuité sans ajouter une succession temporelle absente du grec.
- source_word: ἀπεσταλμένοι ἦσαν
  choice: ceux qui avaient été envoyés
  rationale: La construction périphrastique, formée du participe parfait passif et de l’imparfait de « être », évoque un envoi déjà accompli; le plus-que-parfait français en rend naturellement l’antériorité et l’état résultant.
- source_word: ἐκ
  choice: venaient de
  rationale: Cette formulation exprime clairement la provenance ou l’appartenance indiquée par ἐκ, sans la transformer en complément d’agent.
- source_word: τῶν Φαρισαίων
  choice: des pharisiens
  rationale: Désignation française courante du groupe; la minuscule suit l’usage moderne pour les membres d’un courant religieux.
theological_decisions:
- issue: Rapport entre les envoyés et les pharisiens
  choice: Les envoyés venaient du groupe des pharisiens, ce qui met en avant leur provenance ou leur appartenance.
  alternative: Ils avaient été envoyés par les pharisiens, ce qui met davantage en avant l’initiative ou l’autorité des pharisiens.
  rationale: Le grec emploie ἐκ avec le génitif, marque plus directe de provenance que d’agent. Le texte principal préserve cette nuance, tandis que la note signale la compréhension possible en termes de mandat.
translation_notes:
  register: Français moderne, courant et digne. La tournure « ceux qui… venaient de » évite l’ambiguïté peu naturelle de « envoyés des pharisiens » tout en conservant la distinction entre provenance et agent.
