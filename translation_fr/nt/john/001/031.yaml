  text: κἀγὼ οὐκ ᾔδειν αὐτόν, ἀλλ’ ἵνα φανερωθῇ τῷ Ἰσραὴλ διὰ τοῦτο ἦλθον ἐγὼ ⸀ἐν ὕδατι βαπτίζων.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/031.yaml
  text: 'And I did not know him[a], but for this reason I came baptizing in water: that he might be revealed to Israel.'
translation:
  language: fr
  text: Moi, je ne le connaissais pas[a]. Mais c’est pour qu’il soit révélé à Israël que je suis venu baptiser dans l’eau.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « je ne l’avais pas reconnu ». Le grec peut évoquer soit l’absence de connaissance, soit l’absence de reconnaissance ; le texte principal conserve la formulation la plus large.
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀγὼ
  choice: Moi non plus
  rationale: Dans le prolongement du verset précédent, καί avec ἐγώ relie le témoignage de Jean à l’affirmation antérieure tout en mettant le sujet en relief. Avec la négation, « Moi non plus » exprime naturellement cette continuité en français.
- source_word: οὐκ ᾔδειν αὐτόν
  choice: je ne le connaissais pas
  rationale: L’imparfait de οἶδα décrit ici un état passé de non-connaissance. Cette formulation conserve la portée large du grec sans préciser s’il s’agit d’absence de connaissance personnelle ou de non-reconnaissance de son identité.
- source_word: ἀλλ’
  choice: Mais
  rationale: La conjonction marque le contraste entre la non-connaissance antérieure de Jean et la finalité de sa mission baptismale.
- source_word: ἵνα φανερωθῇ τῷ Ἰσραήλ
  choice: pour qu’il soit révélé à Israël
  rationale: « Pour que » rend la finalité introduite par ἵνα, tandis que « soit révélé » conserve la voix passive de φανερωθῇ. « À Israël » maintient le référent collectif du texte.
- source_word: διὰ τοῦτο ἦλθον ἐγὼ
  choice: si je suis venu… c’est pour
  rationale: Cette construction française idiomatique met en relief la raison annoncée par διὰ τοῦτο et la relie clairement à la proposition de but, tout en rendant l’insistance de l’explicite ἐγώ.
- source_word: ἐν ὕδατι βαπτίζων
  choice: baptiser dans l’eau
  rationale: « Baptiser » conserve le terme religieux usuel et « dans l’eau » rend directement ἐν ὕδατι sans trancher davantage la question du mode.
theological_decisions:
- issue: Sens de la déclaration de Jean selon laquelle il ne connaissait pas Jésus
  choice: « je ne le connaissais pas », sans préciser la nature de cette non-connaissance
  alternative: « je ne l’avais pas reconnu » ou « je ne savais pas qu’il était le Messie »
  rationale: Le grec ne précise pas explicitement si Jean parle d’une absence de relation personnelle ou d’une absence de reconnaissance de l’identité de Jésus. La formulation retenue préserve cette ambiguïté et évite une harmonisation implicite.
translation_notes:
  register: Français international moderne, digne et accessible. La structure « si je suis venu… c’est pour » restitue naturellement la mise en relief et la finalité de la phrase grecque, sans lourdeur littérale.
