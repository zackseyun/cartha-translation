id: JHN.1.33
reference: John 1:33
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: κἀγὼ οὐκ ᾔδειν αὐτόν, ἀλλ’ ὁ πέμψας με βαπτίζειν ἐν ὕδατι ἐκεῖνός μοι εἶπεν· Ἐφ’ ὃν ἂν ἴδῃς τὸ πνεῦμα καταβαῖνον καὶ μένον ἐπ’ αὐτόν, οὗτός ἐστιν ὁ βαπτίζων ἐν πνεύματι ἁγίῳ·
base_translation:
  language: en
  yaml_path: translation/nt/john/001/033.yaml
  text: And I did not know him[a], but the one who sent me to baptize in water said to me, ‘The one on whom you see the Spirit descending and remaining on him[c][b], this is he who baptizes in the Holy Spirit.’
translation:
  language: fr
  text: 'Et moi, je ne le connaissais pas[a]. Mais celui qui m’a envoyé baptiser dans l’eau m’a dit : « Celui sur qui tu verras l’Esprit descendre et demeurer[b], c’est lui qui baptise dans l’Esprit Saint. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « je ne l’avais pas reconnu ». Le grec peut désigner ici soit l’absence de connaissance, soit l’absence de reconnaissance.'
    reason: lexical_alternative
  - marker: b
    text: « Demeurer » traduit un verbe important chez Jean, également rendu selon le contexte par « rester » ou « habiter ».
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀγὼ
  choice: Et moi
  rationale: La crase καί + ἐγώ marque à la fois la continuité du discours et l’insistance sur le témoignage personnel de Jean.
- source_word: οὐκ ᾔδειν αὐτόν
  choice: je ne le connaissais pas
  rationale: Rendu direct de l’imparfait de οἶδα ; le contexte permet aussi la nuance « je ne l’avais pas reconnu », signalée en note.
- source_word: ὁ πέμψας με βαπτίζειν
  choice: celui qui m’a envoyé baptiser
  rationale: Le participe aoriste substantivé est rendu par une relative naturelle en français ; l’infinitif exprime la mission confiée.
- source_word: ἐν ὕδατι
  choice: dans l’eau
  rationale: « Dans » conserve la préposition ἐν et son parallèle délibéré avec ἐν πνεύματι ἁγίῳ.
- source_word: Ἐφ’ ὃν ἂν ἴδῃς
  choice: Celui sur qui tu verras
  rationale: La tournure française exprime naturellement le signe futur d’identification porté par la relative grecque avec ἄν et le subjonctif.
- source_word: τὸ πνεῦμα καταβαῖνον καὶ μένον ἐπ’ αὐτόν
  choice: l’Esprit descendre et demeurer
  rationale: Les infinitifs français dépendent de « verras ». « Demeurer » conserve la portée johannique de μένω ; le complément « sur lui », déjà exprimé après « celui », n’est pas répété en français.
- source_word: οὗτός ἐστιν ὁ βαπτίζων
  choice: c’est lui qui baptise
  rationale: Cette formule française préserve l’identification emphatique du démonstratif sans lourdeur artificielle.
- source_word: ἐν πνεύματι ἁγίῳ
  choice: dans l’Esprit Saint
  rationale: Le choix maintient le parallèle avec « dans l’eau » et identifie naturellement le référent divin.
theological_decisions:
- issue: Identification de πνεῦμα / πνεύματι ἁγίῳ
  choice: l’Esprit … l’Esprit Saint
  alternative: l’esprit … un esprit saint
  rationale: Le contexte immédiat relie l’Esprit qui descend à l’expression explicite πνεύματι ἁγίῳ ; les majuscules françaises indiquent ce référent sans ajouter de contenu doctrinal.
- issue: Préposition dans les deux expressions baptismales
  choice: baptiser dans l’eau … baptise dans l’Esprit Saint
  alternative: baptiser avec de l’eau … baptise avec l’Esprit Saint
  rationale: « Dans » préserve l’emploi répété de ἐν et la tension imagée du parallèle grec, tandis que « avec » mettrait davantage l’accent sur le moyen.
- issue: Sens de οὐκ ᾔδειν
  choice: je ne le connaissais pas
  alternative: je ne l’avais pas reconnu
  rationale: Le grec peut exprimer l’absence de connaissance ou de reconnaissance. Le texte principal retient le sens le plus direct et la note conserve l’autre possibilité contextuelle.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe évite l’archaïsme tout en conservant le parallèle « dans l’eau / dans l’Esprit Saint » et le vocabulaire johannique de la demeure.
