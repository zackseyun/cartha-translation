  source_fidelity: 'Le texte rend fidèlement les éléments grecs essentiels : κἀγώ (« Et moi »), l’imparfait οὐκ ᾔδειν (« je ne le connaissais pas »), la mission de baptiser, le signe de l’Esprit qui descend et demeure sur Jésus, et l’identification de celui qui baptise ἐν πνεύματι ἁγίῳ. La construction française « Celui sur qui tu verras l’Esprit descendre et demeurer » exprime naturellement que « sur qui » régit les deux infinitifs, sans omission de sens.'
