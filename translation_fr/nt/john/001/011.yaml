id: JHN.1.11
reference: John 1:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἰς τὰ ἴδια ἦλθεν, καὶ οἱ ἴδιοι αὐτὸν οὐ παρέλαβον.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/011.yaml
  text: He came to his own[b][a], and his own people did not receive him.
translation:
  language: fr
  text: Il est venu dans ce qui était à lui[a], et les siens ne l’ont pas reçu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « chez lui » ou « dans son propre domaine ». En grec, la première expression est au neutre pluriel et se distingue de la suivante, au masculin pluriel, qui désigne « les siens ».
    reason: alternative_reading
  - marker: b
    text: Ou « ne l’ont pas accueilli » ou « ne l’ont pas accepté ».
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς τὰ ἴδια
  choice: dans ce qui lui appartenait
  rationale: Le neutre pluriel désigne ce qui était à lui — son domaine, son pays ou sa demeure — sans le réduire à un lieu précis. Cette formulation maintient aussi la distinction avec le masculin pluriel qui suit.
- source_word: ἦλθεν
  choice: est venu
  rationale: Rend simplement et naturellement l’aoriste de ἔρχομαι dans ce mouvement narratif.
- source_word: οἱ ἴδιοι
  choice: les siens
  rationale: Le masculin pluriel renvoie ici à des personnes. « Les siens » est idiomatique en français et conserve l’écho lexical avec « ce qui lui appartenait ».
- source_word: παρέλαβον
  choice: ne l’ont pas accueilli
  rationale: Dans ce contexte, παραλαμβάνω exprime le fait de recevoir quelqu’un auprès de soi, avec les nuances possibles d’accueil et d’acceptation. « Accueilli » convient naturellement en français sans imposer une explication doctrinale.
- source_word: αὐτόν
  choice: l’
  rationale: Le pronom masculin renvoie au Logos mentionné dans le contexte; le pronom objet français est la forme naturelle.
theological_decisions:
- issue: Référent et nuance du double emploi de ἴδιος
  choice: La première expression désigne ce qui lui appartenait, tandis que la seconde désigne les siens, c’est-à-dire des personnes.
  alternative: Comprendre les deux expressions comme désignant uniquement son propre peuple, ou préciser la première comme « sa propre demeure ».
  rationale: Le passage du neutre pluriel τὰ ἴδια au masculin pluriel οἱ ἴδιοι paraît intentionnel. La traduction préserve la différence entre domaine ou biens et personnes, sans déterminer plus précisément le premier référent.
- issue: Valeur de καί entre les deux propositions
  choice: et
  alternative: mais
  rationale: « Et » reproduit la coordination grecque et laisse le contraste ressortir du contenu même des propositions, sans l’expliciter davantage.
translation_notes:
  register: Français international moderne, simple et digne. « Ce qui lui appartenait » reste accessible tout en préservant l’indétermination du neutre pluriel grec; « les siens » rend naturellement le contraste avec les personnes de la seconde proposition.
