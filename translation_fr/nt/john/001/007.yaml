id: JHN.1.7
reference: John 1:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὗτος ἦλθεν εἰς μαρτυρίαν, ἵνα μαρτυρήσῃ περὶ τοῦ φωτός, ἵνα πάντες πιστεύσωσιν δι’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/007.yaml
  text: He came as a witness[a], so that he might testify about the Light[b], so that all might believe through him.
translation:
  language: fr
  text: Il vint comme témoin, pour témoigner au sujet de la Lumière, afin que tous croient par lui.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le pronom « lui » renvoie probablement à Jean : les gens croiraient par l’intermédiaire de son témoignage. Il peut aussi être compris comme renvoyant à la Lumière.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὗτος
  choice: Il
  rationale: Le pronom reprend naturellement Jean, présenté au verset précédent. En français moderne, « Il » est plus fluide que « Celui-ci » tout en gardant clairement le même référent dans le contexte.
- source_word: ἦλθεν
  choice: vint
  rationale: Le passé simple restitue sobrement l’aoriste narratif de ἔρχομαι et convient au registre dignifié d’un récit écrit.
- source_word: εἰς μαρτυρίαν
  choice: comme témoin
  rationale: Cette formulation française naturelle exprime la fonction dans laquelle Jean est venu, tout en conservant le champ lexical judiciaire et testimonial de μαρτυρία.
- source_word: ἵνα μαρτυρήσῃ
  choice: pour témoigner
  rationale: « Pour » rend clairement la finalité exprimée par ἵνα, et « témoigner » maintient le lien lexical avec « témoin ».
- source_word: περὶ τοῦ φωτός
  choice: au sujet de la Lumière
  rationale: περί avec le génitif signifie ici « au sujet de » ou « concernant ». La majuscule indique que la lumière fonctionne dans ce contexte comme une désignation personnelle, sans ajouter de précision absente du grec.
- source_word: ἵνα πάντες πιστεύσωσιν
  choice: afin que tous croient
  rationale: « Afin que » préserve la seconde proposition de but, tandis que « tous » conserve la portée non restreinte de πάντες et « croient » rend normalement πιστεύω.
- source_word: δι’ αὐτοῦ
  choice: par lui
  rationale: Cette traduction concise rend διά avec le génitif comme moyen ou médiation et conserve l’ambiguïté grammaticale du pronom quant à son référent.
theological_decisions:
- issue: Référent de αὐτοῦ dans δι’ αὐτοῦ
  choice: Conserver « par lui » dans le texte, avec Jean comme référent contextuellement le plus probable
  alternative: Comprendre le pronom comme renvoyant à la Lumière
  rationale: Jean est le sujet humain du verset et le contexte présente son témoignage comme le moyen conduisant les autres à croire. Toutefois, la forme grecque peut aussi être rapportée à la Lumière; la traduction ne tranche donc pas silencieusement.
- issue: Statut de « la lumière »
  choice: « la Lumière » avec une majuscule
  alternative: « la lumière » sans majuscule
  rationale: Le grec ancien ne marque pas cette distinction typographique, mais le contexte johannique immédiat emploie la lumière comme désignation personnelle. La majuscule rend cette fonction au lecteur moderne sans remplacer l’image par une identification explicite.
translation_notes:
  register: Français international moderne, clair et dignifié. La répétition « témoin / témoigner » reproduit volontairement celle de μαρτυρία / μαρτυρέω. Le passé simple maintient un ton narratif soutenu sans archaïsme lexical.
