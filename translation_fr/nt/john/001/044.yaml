  text: ἦν δὲ ὁ Φίλιππος ἀπὸ Βηθσαϊδά, ἐκ τῆς πόλεως Ἀνδρέου καὶ Πέτρου.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/044.yaml
  text: Philip was from Bethsaida[a], from the town of Andrew and Peter.
translation:
  language: fr
  text: Philippe était de Bethsaïda, la ville d’où venaient André et Pierre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἦν
  choice: était
  rationale: L’imparfait de εἰμί exprime ici un état passé et indique l’origine de Philippe. « Était » reste direct et naturel en français.
- source_word: δὲ
  choice: non rendu explicitement
  rationale: δέ marque une transition narrative légère. En français, l’enchaînement est naturel sans ajouter « or » ou « mais », qui risqueraient de surmarquer le lien.
- source_word: ὁ Φίλιππος
  choice: Philippe
  rationale: Forme française traditionnelle et courante du nom personnel grec Φίλιππος.
- source_word: ἀπὸ Βηθσαϊδά
  choice: de Bethsaïda
  rationale: ἀπό indique ici la provenance ou l’origine. « De Bethsaïda » est idiomatique et précis.
- source_word: ἐκ τῆς πόλεως
  choice: la ville
  rationale: πόλις désigne une ville ou une localité. L’apposition « la ville » restitue naturellement en français le second groupe prépositionnel grec sans la lourdeur de « de la ville » après « de Bethsaïda ».
- source_word: Ἀνδρέου καὶ Πέτρου
  choice: d’André et de Pierre
  rationale: 'Les génitifs rattachés à πόλεως indiquent l’association ou l’origine : Bethsaïda est la ville dont André et Pierre étaient originaires. La formulation concise préserve la structure grecque.'
theological_decisions: []
translation_notes:
  register: Français international moderne, simple et digne. La répétition grecque ἀπό… ἐκ est rendue par une apposition fluide. « Ville » conserve la valeur ordinaire de πόλις sans imposer une estimation moderne de la taille de Bethsaïda.
