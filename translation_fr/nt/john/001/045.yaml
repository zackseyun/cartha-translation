- from: 'Philippe trouve Nathanaël et lui dit : « Nous avons trouvé celui dont Moïse a parlé dans la Loi, et dont les prophètes ont aussi parlé : Jésus, fils de Joseph, celui qui vient de Nazareth. »'
  to: 'Philippe trouve Nathanaël et lui dit : « Nous avons trouvé celui au sujet duquel Moïse a écrit dans la Loi, et les prophètes aussi : Jésus, fils de Joseph, de Nazareth. »'
  rationale: La révision remplace « a parlé » par « a écrit » afin de rendre ἔγραψεν avec fidélité, tout en conservant une syntaxe française fluide. « De Nazareth » rend l’identification finale sans expliciter au-delà du grec la nuance exacte d’origine ou d’association.
