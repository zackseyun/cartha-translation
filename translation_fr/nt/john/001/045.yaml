id: JHN.1.45
reference: John 1:45
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εὑρίσκει Φίλιππος τὸν Ναθαναὴλ καὶ λέγει αὐτῷ· Ὃν ἔγραψεν Μωϋσῆς ἐν τῷ νόμῳ καὶ οἱ προφῆται εὑρήκαμεν, ⸀Ἰησοῦν υἱὸν τοῦ Ἰωσὴφ τὸν ἀπὸ Ναζαρέτ.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/045.yaml
  text: 'Philip found Nathanael and said to him[a], “We have found him of whom Moses in the Law and also the prophets wrote: Jesus son of Joseph[b], from Nazareth.”'
translation:
  language: fr
  text: 'Philippe trouve Nathanaël et lui dit : « Nous avons trouvé celui au sujet duquel Moïse a écrit dans la Loi, et les prophètes aussi : Jésus, fils de Joseph, de Nazareth. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὑρίσκει
  choice: trouve
  rationale: Le présent historique grec se rend naturellement au présent dans le récit français et donne de la vivacité à la scène.
- source_word: λέγει
  choice: dit
  rationale: Le présent narratif français correspond naturellement au présent historique grec et s'accorde avec « trouve ».
- source_word: Ὃν ... ἔγραψεν
  choice: celui dont ... a parlé
  rationale: Littéralement, le grec dit « celui que Moïse a écrit », construction peu naturelle en français. « Celui dont ... a parlé » exprime clairement qu'il est l'objet du témoignage écrit sans introduire d'interprétation supplémentaire.
- source_word: ἐν τῷ νόμῳ
  choice: dans la Loi
  rationale: La majuscule indique ici le corpus scripturaire associé à Moïse, et non la loi au sens général.
- source_word: οἱ προφῆται
  choice: les prophètes
  rationale: Cette expression désigne les prophètes comme témoins scripturaires; la formulation française usuelle conserve cette portée.
- source_word: εὑρήκαμεν
  choice: nous avons trouvé
  rationale: 'Le passé composé rend bien le parfait grec et son résultat présent : la personne recherchée est désormais identifiée.'
- source_word: υἱὸν τοῦ Ἰωσὴφ
  choice: fils de Joseph
  rationale: Cette identification sociale est conservée telle qu'elle est formulée par Philippe, sans ajout harmonisant.
- source_word: τὸν ἀπὸ Ναζαρέτ
  choice: celui qui vient de Nazareth
  rationale: Cette formulation explicite naturellement en français la valeur d'origine de ἀπό tout en conservant l'apposition grecque.
- source_word: Ναθαναὴλ
  choice: Nathanaël
  rationale: Forme française traditionnelle et immédiatement reconnaissable du nom.
- source_word: Ἰησοῦν
  choice: Jésus
  rationale: Forme française usuelle du nom.
- source_word: Μωϋσῆς
  choice: Moïse
  rationale: Forme française usuelle du nom.
theological_decisions:
- issue: La désignation « fils de Joseph » et la christologie
  choice: Conserver « Jésus, fils de Joseph » comme parole de Philippe
  alternative: Jésus, que l'on croyait fils de Joseph
  rationale: Le verset rapporte l'identification faite par Philippe. Ajouter « que l'on croyait » importerait dans ce passage une précision absente du grec et atténuerait la perspective propre au locuteur.
- issue: La portée du témoignage de Moïse et des prophètes
  choice: Présenter Moïse et les prophètes comme ayant parlé de « celui » qui a été trouvé
  alternative: Préciser explicitement « le Messie annoncé par Moïse et les prophètes »
  rationale: Philippe affirme un témoignage scripturaire convergent, mais le texte ne contient pas ici le titre « Messie ». La traduction conserve donc l'affirmation sans la développer.
translation_notes:
  register: Français international moderne, naturel et digne. Le présent narratif est maintenu, usage courant en français. La répétition de « parlé » clarifie que Moïse et les prophètes sont tous deux sujets de l'action, tandis que « celui qui vient de Nazareth » préserve plus directement la valeur de provenance de ἀπό que le traditionnel « de Nazareth ».
