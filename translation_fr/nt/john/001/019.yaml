id: JHN.1.19
reference: John 1:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ αὕτη ἐστὶν ἡ μαρτυρία τοῦ Ἰωάννου ὅτε ⸀ἀπέστειλαν οἱ Ἰουδαῖοι ἐξ Ἱεροσολύμων ἱερεῖς καὶ Λευίτας ἵνα ἐρωτήσωσιν αὐτόν· Σὺ τίς εἶ;
base_translation:
  language: en
  yaml_path: translation/nt/john/001/019.yaml
  text: And this is the testimony of John[a], when the Jews sent priests and Levites from Jerusalem to ask him, “Who are you?”
translation:
  language: fr
  text: 'Et voici le témoignage de Jean, lorsque les Juifs[a] envoyèrent de Jérusalem des prêtres et des lévites pour lui demander : « Qui es-tu ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les chefs juifs » ou « les Judéens ». Dans l’Évangile selon Jean, l’expression « les Juifs » désigne souvent plus particulièrement les autorités religieuses de Judée plutôt que l’ensemble du peuple juif.
    reason: alternative lexicale et clarification du référent contextuel
lexical_decisions:
- source_word: μαρτυρία
  choice: témoignage
  rationale: « Témoignage » rend naturellement le nom grec tout en conservant la dimension juridique et testimoniale caractéristique de Jean.
- source_word: τοῦ Ἰωάννου
  choice: de Jean
  rationale: 'Le génitif est compris comme subjectif : il s’agit du témoignage rendu par Jean, non d’un témoignage à son sujet.'
- source_word: ὅτε
  choice: lorsque
  rationale: Cette conjonction temporelle introduit l’occasion où Jean a rendu ce témoignage; « lorsque » convient au registre narratif digne du passage.
- source_word: ἀπέστειλαν
  choice: envoyèrent
  rationale: Traduction directe et naturelle de l’aoriste dans ce récit au passé.
- source_word: οἱ Ἰουδαῖοι
  choice: les Juifs
  rationale: La formulation principale conserve le sens littéral de l’expression grecque; une note précise que, dans ce contexte johannique, elle peut viser plus particulièrement les autorités juives de Judée.
- source_word: ἐξ Ἱεροσολύμων
  choice: de Jérusalem
  rationale: Rend simplement et idiomatiquement le lieu d’origine de la délégation.
- source_word: ἱερεῖς καὶ Λευίτας
  choice: des prêtres et des lévites
  rationale: Ces deux groupes liés au service du Temple restent distinctement nommés.
- source_word: ἵνα ἐρωτήσωσιν αὐτόν
  choice: pour lui demander
  rationale: L’infinitif précédé de « pour » exprime clairement et naturellement le but de l’envoi.
- source_word: Σὺ τίς εἶ;
  choice: Qui es-tu ?
  rationale: Formulation française naturelle qui traduit la question directe; le contexte porte suffisamment l’accent exprimé par le pronom grec.
theological_decisions:
- issue: Référent de οἱ Ἰουδαῖοι dans l’Évangile selon Jean
  choice: « les Juifs » dans le texte, avec une note explicative
  alternative: « les chefs juifs » ou « les Judéens »
  rationale: Cette solution préserve la formulation grecque et son ambiguïté, sans étendre abusivement la référence à l’ensemble du peuple juif. L’envoi de prêtres et de lévites depuis Jérusalem indique que les autorités religieuses judéennes sont probablement particulièrement visées.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple convient au récit écrit biblique; « voici » conserve la fonction présentative du grec sans lourdeur. La ponctuation suit le déroulement de la phrase grecque avec une virgule avant la proposition temporelle.
