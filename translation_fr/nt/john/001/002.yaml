  text: οὗτος ἦν ἐν ἀρχῇ πρὸς τὸν θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/002.yaml
  text: He was in the beginning with God[a].
translation:
  language: fr
  text: Il était au commencement avec Dieu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Celui-ci était au commencement avec Dieu. »'
    reason: Alternative lexicale conservant la valeur démonstrative formelle de οὗτος.
lexical_decisions:
- source_word: οὗτος
  choice: Il
  rationale: Le démonstratif renvoie au Logos du verset 1. En français moderne, le pronom personnel « Il » reprend naturellement ce référent masculin et personnel, tandis que « Celui-ci » reste possible mais plus marqué.
- source_word: ἦν
  choice: était
  rationale: L’imparfait de εἰμί décrit ici un état continu. « Était » est à la fois idiomatique et fidèle, sans ajouter la précision interprétative de « existait ».
- source_word: ἐν ἀρχῇ
  choice: au commencement
  rationale: Cette formulation naturelle et consacrée maintient l’écho évident de Genèse 1.1 ainsi que la continuité avec Jean 1.1.
- source_word: πρὸς
  choice: avec
  rationale: Avec l’accusatif dans ce contexte, πρός exprime une relation et une orientation personnelles. « Avec » rend sobrement la proximité relationnelle et la distinction sans explicitation métaphysique supplémentaire.
- source_word: τὸν θεόν
  choice: Dieu
  rationale: L’article grec n’appelle pas ici l’ajout de l’article défini en français. « Dieu » désigne naturellement le référent voulu.
theological_decisions:
- issue: Référent de οὗτος par rapport à Jean 1.1
  choice: Le démonstratif renvoie à la Parole et est rendu personnellement par « Il ».
  alternative: « Celui-ci »
  rationale: Le verset reprend et souligne ce qui vient d’être dit au sujet du Logos. « Il » conserve le référent personnel de façon naturelle sans ajouter au texte de formulation doctrinale.
- issue: Portée de πρὸς τὸν θεόν
  choice: La relation et la distinction sont exprimées par « avec Dieu ».
  alternative: « tourné vers Dieu » ou « auprès de Dieu »
  rationale: La formulation grecque indique la relation du Logos à Dieu tout en les distinguant. « Avec Dieu » préserve cette tension théologique sans préciser davantage la nature de cette relation.
translation_notes:
  register: Français international moderne, simple et digne. La syntaxe brève reproduit la structure récapitulative du grec et maintient l’écho de Jean 1.1.
