source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτῷ Ναθαναήλ· Ἐκ Ναζαρὲτ δύναταί τι ἀγαθὸν εἶναι; λέγει αὐτῷ ⸀ὁ Φίλιππος· Ἔρχου καὶ ἴδε.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/046.yaml
  text: And Nathanael said to him[a], “Can anything good come from Nazareth?” Philip said to him, “Come and see.”
translation:
  language: fr
  text: 'Et Nathanaël lui dit : « De Nazareth peut-il venir quelque chose de bon[a] ? » Philippe lui dit : « Viens et vois. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « Quelque chose de bon peut-il être de Nazareth ? »'
    reason: Alternative lexicale préservant le sens formel de εἶναι (« être »), par opposition à l’expression française idiomatique « venir de ».
lexical_decisions:
- source_word: καὶ εἶπεν αὐτῷ Ναθαναήλ
  choice: Nathanaël lui dit
  rationale: Le français n’a pas besoin de rendre systématiquement le καί initial. « Lui dit » exprime naturellement le datif αὐτῷ et conserve le déroulement narratif.
- source_word: Ἐκ Ναζαρὲτ
  choice: De Nazareth
  rationale: ἐκ indique ici l’origine. La mise en tête de « De Nazareth » conserve l’accent porté par l’ordre grec sur ce lieu.
- source_word: δύναταί τι ἀγαθὸν εἶναι
  choice: peut-il venir quelque chose de bon
  rationale: La formulation française naturelle avec un lieu d’origine emploie « venir ». La note conserve la possibilité d’une traduction plus formelle de εἶναι par « être ».
- source_word: λέγει αὐτῷ ὁ Φίλιππος
  choice: Philippe lui dit
  rationale: Le présent historique λέγει est rendu au présent de narration français, qui est naturel dans ce récit et maintient la vivacité du grec.
- source_word: Ἔρχου καὶ ἴδε
  choice: Viens et vois
  rationale: Traduction directe des deux impératifs, qui préserve à la fois l’invitation concrète et la portée johannique du verbe « voir ».
theological_decisions:
- issue: Ton de la question de Nathanaël au sujet de Nazareth
  choice: Une question rhétorique exprimant le scepticisme, sans ajouter de sarcasme explicite
  alternative: « Est-ce que quelque chose de bon peut être de Nazareth ? »
  rationale: Le grec manifeste le doute de Nathanaël, mais ne précise pas davantage son ton. La traduction évite donc d’amplifier son mépris éventuel.
translation_notes:
  register: Français moderne, courant et digne. « Viens et vois » reste volontairement bref et mémorable. Le nom Nathanaël suit l’usage biblique français établi.
