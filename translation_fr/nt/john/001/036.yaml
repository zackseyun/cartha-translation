  text: 'Et, fixant son regard sur Jésus qui marchait, il dit : « Voici l’Agneau de Dieu ! »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμβλέψας
  choice: fixant les yeux sur
  rationale: Exprime le regard attentif et soutenu du verbe, plus précisément qu’un simple « regardant ».
- source_word: περιπατοῦντι
  choice: qui passait
  rationale: Dans ce contexte narratif, rend naturellement Jésus en train de marcher, sans suggérer une promenade.
- source_word: Ἴδε
  choice: Regardez
  rationale: Impératif déictique adressé aux deux disciples ; cette forme moderne et naturelle attire leur attention sur Jésus.
- source_word: ὁ ἀμνὸς τοῦ θεοῦ
  choice: l’Agneau de Dieu
  rationale: Conserve l’image centrale et la relation au génitif sans en préciser davantage l’interprétation théologique.
theological_decisions:
- issue: Portée de « l’Agneau de Dieu »
  choice: Conserver la formule sans explication dans le texte
  alternative: Expliciter « l’Agneau offert par Dieu » ou « qui enlève le péché »
  rationale: Le génitif τοῦ θεοῦ et l’image de l’agneau peuvent porter plusieurs résonances ; le verset ne les résout pas explicitement.
translation_notes:
  register: Français international moderne, narratif et digne. Le présent historique λέγει est rendu par le présent « il dit ». La ponctuation après « Regardez » met naturellement en relief l’identification qui suit.
