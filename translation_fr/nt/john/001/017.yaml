id: JHN.1.17
reference: John 1:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὅτι ὁ νόμος διὰ Μωϋσέως ἐδόθη, ἡ χάρις καὶ ἡ ἀλήθεια διὰ Ἰησοῦ Χριστοῦ ἐγένετο.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/017.yaml
  text: For the law was given through Moses[a]; grace and truth came through Jesus the Messiah.
translation:
  language: fr
  text: Car la Loi a été donnée par l’intermédiaire de Moïse ; la grâce et la vérité sont venues par Jésus le Messie[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, selon la formulation traditionnelle : « Jésus-Christ ».'
    reason: Signale la traduction traditionnelle de Χριστός tout en maintenant dans le texte principal le sens du titre « Messie ».
lexical_decisions:
- source_word: ὅτι
  choice: Car
  rationale: Dans le contexte, ὅτι introduit l’explication de l’affirmation précédente ; « Car » en conserve naturellement la valeur explicative et causale.
- source_word: ὁ νόμος
  choice: la Loi
  rationale: Le terme désigne ici le corps connu de l’enseignement mosaïque. La majuscule aide le lecteur français à reconnaître ce référent précis sans ajouter de contenu.
- source_word: διὰ Μωϋσέως
  choice: par l’intermédiaire de Moïse
  rationale: διά suivi du génitif exprime la médiation ou l’agent intermédiaire. Cette formulation distingue clairement Moïse de la source implicite du don.
- source_word: ἐδόθη
  choice: a été donnée
  rationale: Le passé composé passif rend sobrement l’aoriste passif et préserve l’idée d’un don transmis sans expliciter son auteur.
- source_word: ἡ χάρις
  choice: la grâce
  rationale: « Grâce » conserve la richesse théologique de χάρις et fait écho à Jean 1.14, sans réduire le terme à une simple faveur humaine.
- source_word: ἡ ἀλήθεια
  choice: la vérité
  rationale: « Vérité » correspond à l’usage johannique et maintient l’écho direct à Jean 1.14.
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: par Jésus le Messie
  rationale: « Par » conserve ici la médiation exprimée par διά. Χριστός est rendu comme un titre intelligible, « le Messie », plutôt que seulement translittéré sous la forme traditionnelle « Christ ».
- source_word: ἐγένετο
  choice: sont venues
  rationale: Dans cette opposition avec « a été donnée », « sont venues » exprime naturellement l’entrée historique de la grâce et de la vérité par Jésus. L’accord pluriel est requis en français, même si le grec emploie un verbe au singulier.
theological_decisions:
- issue: Traduction de Χριστοῦ dans Ἰησοῦ Χριστοῦ
  choice: Jésus le Messie
  alternative: Jésus-Christ
  rationale: Le grec conserve ici la portée du titre messianique. « Jésus le Messie » en communique le sens au lecteur moderne, tandis que la forme ecclésiale traditionnelle est signalée en note.
- issue: Rapport entre la Loi et la grâce et la vérité
  choice: Conserver la coordination contrastive sans ajouter « mais »
  alternative: mais la grâce et la vérité sont venues
  rationale: Le texte grec juxtapose les deux propositions sans conjonction adversative explicite. Le point-virgule laisse percevoir le contraste sans le renforcer en opposition absolue.
translation_notes:
  register: Français international moderne, digne et accessible. Le point-virgule reproduit la construction parallèle du grec. « Par l’intermédiaire de » explicite la médiation de Moïse ; le second « par » allège la phrase tout en conservant le parallélisme conceptuel.
