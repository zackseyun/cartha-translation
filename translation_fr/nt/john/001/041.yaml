id: JHN.1.41
reference: John 1:41
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εὑρίσκει οὗτος ⸀πρῶτον τὸν ἀδελφὸν τὸν ἴδιον Σίμωνα καὶ λέγει αὐτῷ· Εὑρήκαμεν τὸν Μεσσίαν (ὅ ἐστιν μεθερμηνευόμενον χριστός).
base_translation:
  language: en
  yaml_path: translation/nt/john/001/041.yaml
  text: He first found his own brother Simon and said to him[a], “We have found the Messiah” (which means Messiah).
translation:
  language: fr
  text: 'Il trouve d’abord son propre frère Simon et lui dit : « Nous avons trouvé le Messie » (ce qui se traduit par « Christ »).'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὑρίσκει
  choice: Il trouve
  rationale: Le présent historique grec est naturel dans un récit en français et conserve ici la forme verbale de la source.
- source_word: οὗτος
  choice: Il
  rationale: Le démonstratif renvoie à André dans le contexte ; le pronom personnel est la formulation naturelle en français.
- source_word: πρῶτον
  choice: d’abord
  rationale: Rend la valeur adverbiale temporelle ou séquentielle du texte SBLGNT sans suggérer plus précisément que le grec qui aurait agi ensuite.
- source_word: τὸν ἀδελφὸν τὸν ἴδιον
  choice: son propre frère
  rationale: Conserve l’insistance portée par ἴδιον tout en désignant clairement le lien fraternel masculin.
- source_word: Σίμωνα
  choice: Simon
  rationale: Translittération française usuelle du nom propre.
- source_word: λέγει αὐτῷ
  choice: lui dit
  rationale: Formulation française naturelle et proche du grec ; le présent « dit » peut fonctionner comme présent historique.
- source_word: Εὑρήκαμεν
  choice: Nous avons trouvé
  rationale: Le passé composé rend naturellement le parfait grec et la pertinence actuelle de la découverte.
- source_word: Μεσσίαν
  choice: le Messie
  rationale: Reproduit le titre sémitique sous sa forme française établie et préserve son cadre juif.
- source_word: μεθερμηνευόμενον
  choice: ce qui se traduit par
  rationale: Exprime explicitement que l’auteur donne l’équivalent grec du titre sémitique, plutôt qu’une simple paraphrase générale.
- source_word: χριστός
  choice: Christ
  rationale: « Christ » est en français la forme traditionnelle issue du grec χριστός et constitue l’équivalent distinct de « Messie » requis par la parenthèse explicative.
theological_decisions:
- issue: Rapport entre les titres Μεσσίας et χριστός
  choice: « le Messie » suivi de « ce qui se traduit par “Christ” »
  alternative: « le Messie » suivi de « ce qui signifie “l’Oint” »
  rationale: La parenthèse du grec établit une équivalence de traduction entre le titre sémitique Μεσσίας et son correspondant grec χριστός. Employer « Messie » puis « Christ » conserve cette distinction historique et la fonction explicative du texte, tandis que « l’Oint » expliciterait davantage l’étymologie mais remplacerait l’équivalent grec traditionnel.
translation_notes:
  register: Français international moderne, sobre et digne. Le présent historique respecte la source tout en restant idiomatique. La répétition apparente est évitée en distinguant nettement « Messie » de « Christ », conformément à la parenthèse explicative grecque.
