id: JHN.1.38
reference: John 1:38
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: στραφεὶς δὲ ὁ Ἰησοῦς καὶ θεασάμενος αὐτοὺς ἀκολουθοῦντας λέγει αὐτοῖς· Τί ζητεῖτε; οἱ δὲ εἶπαν αὐτῷ· Ῥαββί (ὃ λέγεται ⸀μεθερμηνευόμενον Διδάσκαλε), ποῦ μένεις;
base_translation:
  language: en
  yaml_path: translation/nt/john/001/038.yaml
  text: Then Jesus turned and[a], seeing them following, said to them, “What are you seeking?” They said to him, “Rabbi” (which translated means Teacher)[c][b], “where are you staying?”
translation:
  language: fr
  text: 'Alors Jésus se retourna et, voyant qu’ils le suivaient, leur dit : « Que cherchez-vous ? » Ils lui dirent : « Rabbi — ce qui signifie “Maître”[a] —, où demeures-tu[b] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Rabbi » est un titre hébreu ou araméen qui désigne un maître, un enseignant.
    reason: cultural_note
  - marker: b
    text: Ou « où loges-tu ? » Le verbe grec est souvent traduit ailleurs dans Jean par « demeurer » ou « rester ».
    reason: lexical_alternative
lexical_decisions:
- source_word: στραφεὶς
  choice: se retourna
  rationale: Le participe aoriste indique que Jésus se tourne avant de parler. « Se retourna » exprime naturellement le mouvement dans ce contexte.
- source_word: θεασάμενος
  choice: voyant
  rationale: Le participe évoque une perception visuelle attentive. « Voyant » reste concis sans ajouter l’idée plus interprétative de surprise ou de simple remarque.
- source_word: ἀκολουθοῦντας
  choice: qu’ils le suivaient
  rationale: Le participe présent marque une action en cours. « Suivre » conserve à la fois le sens concret immédiat et l’éventuelle résonance liée à la condition de disciple.
- source_word: Τί ζητεῖτε;
  choice: Que cherchez-vous ?
  rationale: ζητέω peut désigner le fait de chercher, mais aussi l’objet profond d’une quête. Cette formulation française est naturelle et préserve cette possible double portée johannique.
- source_word: Ῥαββί
  choice: Rabbi
  rationale: Le titre sémitique est conservé par translittération puisque le narrateur en donne immédiatement l’explication.
- source_word: μεθερμηνευόμενον Διδάσκαλε
  choice: ce qui signifie « Maître »
  rationale: La parenthèse explique le titre à un lectorat qui ne le connaît pas. « Maître » est ici un titre d’adresse français naturel et digne, proche de la fonction de διδάσκαλος.
- source_word: ποῦ μένεις;
  choice: où demeures-tu ?
  rationale: Dans le contexte immédiat, la question porte sur le lieu où Jésus loge. « Demeurer » reste idiomatique en français tout en conservant l’écho lexical de μένω, important ailleurs dans Jean.
theological_decisions:
- issue: La portée de μένω lors de sa première occurrence dans Jean
  choice: où demeures-tu ?
  alternative: où loges-tu ?
  rationale: « Demeurer » convient à la question concrète sur le lieu de séjour, tout en laissant perceptible la continuité lexicale avec les emplois théologiquement chargés de μένω plus loin dans l’Évangile, sans imposer ici tout leur contenu.
- issue: La possible double portée johannique de ζητέω
  choice: Que cherchez-vous ?
  alternative: Qu’est-ce que vous cherchez ?
  rationale: La formulation choisie est naturelle mais légèrement plus solennelle; elle permet d’entendre aussi bien une question pratique qu’une interrogation plus profonde sur l’objet de leur quête.
- issue: Traduction de Διδάσκαλε comme titre adressé à Jésus
  choice: Maître
  alternative: Enseignant
  rationale: « Maître » est le titre d’adresse idiomatique en français pour un enseignant reconnu. Il n’ajoute pas de doctrine particulière et correspond à l’explication narrative de « Rabbi ».
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement reflète l’adresse grecque au singulier. La ponctuation en tirets rend clairement la parenthèse explicative du narrateur. Les termes « cherchez » et « demeures » préservent les résonances johanniques sans rendre l’échange artificiel.
