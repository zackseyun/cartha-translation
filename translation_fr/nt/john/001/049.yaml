  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀπεκρίθη ⸂αὐτῷ Ναθαναήλ⸃· Ῥαββί, σὺ εἶ ὁ υἱὸς τοῦ θεοῦ, σὺ ⸂βασιλεὺς εἶ⸃ τοῦ Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/049.yaml
  text: Nathanael answered him, “Rabbi, you are the Son of God; you are the King of Israel.”
translation:
  language: fr
  text: 'Nathanaël lui répondit : « Rabbi, tu es le Fils de Dieu, tu es le roi d’Israël. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: répondit
  rationale: Équivalent narratif naturel et direct de ἀποκρίνομαι dans un dialogue.
- source_word: Ῥαββί
  choice: Rabbi
  rationale: Conserve le titre d’adresse juif et son contexte culturel du premier siècle; « maître » en exprimerait le sens, mais effacerait sa forme particulière.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: le Fils de Dieu
  rationale: Rend la construction définie et préserve toute la portée christologique du titre sans l’expliciter davantage.
- source_word: βασιλεὺς
  choice: roi
  rationale: Équivalent lexical direct; malgré l’absence d’article devant le prédicat grec, le groupe qualifié par « d’Israël » a ici une valeur définie.
- source_word: τοῦ Ἰσραήλ
  choice: d’Israël
  rationale: Rend directement le génitif et maintient la forme du titre royal.
- source_word: σὺ εἶ … σὺ … εἶ
  choice: tu es… tu es
  rationale: La répétition conserve le parallélisme emphatique et confessionnel du grec.
- source_word: Ναθαναήλ
  choice: Nathanaël
  rationale: Forme française conventionnelle du nom propre.
theological_decisions:
- issue: Portée christologique de la confession « le Fils de Dieu »
  choice: Conserver sans atténuation ni développement le titre « le Fils de Dieu ».
  alternative: « un fils de Dieu » ou une paraphrase qui réduirait la force titulaire
  rationale: Dans l’Évangile selon Jean, l’expression possède une forte portée messianique et christologique. La traduction garde la formulation grecque sans lui imposer une expansion doctrinale ultérieure.
- issue: Sens royal et messianique de « roi d’Israël »
  choice: Traduire par le titre explicite « le roi d’Israël ».
  alternative: « roi sur Israël » ou « le roi des Israélites »
  rationale: La formulation préserve le titre royal associé à l’attente messianique d’Israël, sans expansion interprétative.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement convient à l’adresse directe en contexte biblique et permet de reproduire l’insistance de σὺ. La virgule entre les deux déclarations conserve leur parallélisme serré.
