  text: οὐκ ἦν ἐκεῖνος τὸ φῶς, ἀλλ’ ἵνα μαρτυρήσῃ περὶ τοῦ φωτός.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/008.yaml
  text: He was not the light[a], but came to bear witness about the light.
translation:
  language: fr
  text: Il n’était pas la lumière, mais il est venu pour rendre témoignage à la lumière.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus près du grec : « Il n’était pas la lumière, mais [il est venu] afin qu’il rende témoignage au sujet de la lumière. » Après « mais », le grec exprime le but par « afin que » et laisse le verbe principal sous-entendu ; le contexte le fournit.'
    reason: alternative lexicale et ellipse syntaxique
lexical_decisions:
- source_word: οὐκ ἦν ἐκεῖνος
  choice: Il n’était pas
  rationale: Le pronom « il » reprend naturellement Jean dans le contexte. L’imparfait négatif de εἰμί est rendu directement, sans renforcer artificiellement le grec par « lui-même ».
- source_word: τὸ φῶς
  choice: la lumière
  rationale: L’article défini est conservé, car il s’agit de la lumière précise déjà présentée dans le prologue.
- source_word: ἀλλ’ ἵνα
  choice: mais il est venu pour
  rationale: Après ἀλλά, le grec laisse le verbe principal sous-entendu et enchaîne sur une proposition de but. « Il est venu pour » explicite naturellement en français ce que le contexte fournit, sans modifier le rôle attribué à Jean.
- source_word: μαρτυρήσῃ
  choice: rendre témoignage
  rationale: Cette expression conserve la nuance testimoniale et quasi judiciaire de μαρτυρέω, tout en restant claire et digne en français courant.
- source_word: περὶ τοῦ φωτός
  choice: à la lumière
  rationale: Avec « rendre témoignage », le français idiomatique emploie « à » pour désigner ce dont on atteste la réalité ou l’identité. « Au sujet de la lumière » serait plus explicite mais plus lourd.
theological_decisions:
- issue: Identité et rôle de Jean par rapport à la lumière
  choice: Le verset nie que Jean soit la lumière et présente sa venue comme orientée vers le témoignage rendu à la lumière.
  alternative: 'Traduction plus littérale : « Il n’était pas la lumière, mais afin de rendre témoignage au sujet de la lumière. »'
  rationale: La formulation maintient nettement la distinction johannique entre le témoin et la lumière, sans ajouter d’explication doctrinale. Le verbe « est venu » explicite seulement l’ellipse grecque à partir du contexte.
translation_notes:
  register: Français international moderne, naturel et digne. « Rendre témoignage » maintient le vocabulaire caractéristique du prologue; la note signale honnêtement l’explicitation de l’ellipse grecque.
