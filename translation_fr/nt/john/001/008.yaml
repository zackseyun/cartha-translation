review_pass:
  verdict: revise
  source_fidelity: Le texte principal rend correctement οὐκ ἦν (« n’était pas »), τὸ φῶς (« la lumière ») et la fonction testimoniale de μαρτυρήσῃ. L’explicitation « il est venu pour » est justifiée par l’ellipse après ἀλλά et par le contexte immédiat (v. 6), comme dans la piste d’audit anglaise. « Rendre témoignage à la lumière » est une tournure biblique française recevable, mais « au sujet de la lumière » rend plus explicitement περί.
  naturalness: Le français du texte principal est naturel, moderne et d’un registre approprié. La note actuelle, en revanche, présente comme « plus littérale » une proposition française elliptique (« mais afin de rendre témoignage ») qui ne rend pas clairement la construction ἵνα avec subjonctif et peut sembler inachevée.
  terminology: « La lumière » et « rendre témoignage » sont cohérents avec le vocabulaire johannique. La révision conserve ces termes et emploie « au sujet de » dans la note pour expliciter sans ambiguïté le sens de περί.
  issues:
  - severity: low
    issue: La formulation de la note dite « plus littérale » est syntaxiquement incomplète et ne reflète pas explicitement le subjonctif introduit par ἵνα.
    rationale: '« Mais afin de rendre témoignage » n’est pas, à elle seule, une restitution claire de « ἀλλ’ ἵνα μαρτυρήσῃ ». Il convient de signaler l’ellipse tout en donnant une formulation française complète : « mais [il est venu] afin qu’il rende témoignage au sujet de la lumière ». La note peut alors expliquer que les mots entre crochets sont fournis par le contexte.'
