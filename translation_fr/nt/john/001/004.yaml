id: JHN.1.4
reference: John 1:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐν αὐτῷ ζωὴ ἦν, καὶ ἡ ζωὴ ἦν τὸ φῶς τῶν ἀνθρώπων·
base_translation:
  language: en
  yaml_path: translation/nt/john/001/004.yaml
  text: In him was life[a], and the life was the light of men.
translation:
  language: fr
  text: En lui était la vie, et la vie était la lumière des êtres humains.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν αὐτῷ
  choice: En lui
  rationale: La préposition ἐν avec le datif se rend naturellement par « en ». Le pronom renvoie au Logos du contexte précédent, présenté personnellement ; « lui » convient donc mieux que « cela ».
- source_word: ζωὴ
  choice: la vie
  rationale: ζωή signifie simplement « vie ». Le contexte johannique lui donne une forte portée théologique, qu’il vaut mieux laisser au contexte plutôt que d’expliciter ici par « vie éternelle ».
- source_word: ἦν
  choice: était
  rationale: L’imparfait de εἰμί se traduit naturellement par « était » et maintient la cadence du prologue sans surinterpréter par « existait ».
- source_word: ἡ ζωὴ
  choice: la vie
  rationale: L’article et la répétition reprennent la vie déjà mentionnée ; conserver « la vie » préserve cette reprise anaphorique.
- source_word: τὸ φῶς
  choice: la lumière
  rationale: φῶς se rend directement par « lumière ». L’article défini convient à l’identification thématique exprimée dans la proposition.
- source_word: τῶν ἀνθρώπων
  choice: des êtres humains
  rationale: Le pluriel ἀνθρώπων désigne ici l’humanité en général, sans distinction de sexe. « Des êtres humains » conserve le génitif et exprime clairement cette portée générique en français moderne.
theological_decisions:
- issue: Référent et valeur personnelle de αὐτῷ
  choice: Le pronom est rendu personnellement par « lui », en référence à la Parole.
  alternative: « cela », si λόγος était compris de manière abstraite
  rationale: Dans le contexte immédiat, la Parole est présentée personnellement, notamment par sa relation avec Dieu et, plus loin, par son incarnation. « Lui » préserve cette valeur sans ajouter de formulation doctrinale étrangère au verset.
- issue: Portée générique de ἀνθρώπων
  choice: « des êtres humains », au sens de l’ensemble des humains
  alternative: « de l’humanité » ou « des hommes »
  rationale: Le grec emploie un pluriel grammaticalement masculin mais générique. « Des êtres humains » restitue exactement cette portée inclusive et la construction génitive, tandis que « des hommes » pourrait être compris aujourd’hui comme visant seulement les personnes de sexe masculin.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve la simplicité, le parallélisme et la densité théologique du grec. Aucun marqueur de note n’est nécessaire, car « êtres humains » rend directement la portée générique de ἀνθρώπων.
