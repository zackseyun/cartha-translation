id: JHN.1.12
reference: John 1:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὅσοι δὲ ἔλαβον αὐτόν, ἔδωκεν αὐτοῖς ἐξουσίαν τέκνα θεοῦ γενέσθαι, τοῖς πιστεύουσιν εἰς τὸ ὄνομα αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/john/001/012.yaml
  text: But to all who received him[a], he gave them the right to become children of God—to those who believe in his name,
translation:
  language: fr
  text: Mais à tous ceux qui l’ont reçu, il a donné le droit[a] de devenir enfants de Dieu, à ceux qui croient en son nom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’autorité » ou « le pouvoir » de devenir enfants de Dieu. Le terme grec peut désigner une autorité accordée, un droit ou une capacité.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅσοι
  choice: tous ceux qui
  rationale: Cette expression rend naturellement le pluriel collectif et inclusif du grec.
- source_word: δὲ
  choice: Mais
  rationale: La conjonction marque ici le contraste avec le rejet évoqué au verset précédent.
- source_word: ἔλαβον αὐτόν
  choice: l’ont reçu
  rationale: Dans ce contexte, le verbe désigne l’accueil de la Parole; « reçu » reste fidèle sans réduire le sens à une simple acceptation intellectuelle.
- source_word: ἔδωκεν
  choice: il a donné
  rationale: Traduction directe de l’aoriste de δίδωμι; la nuance d’octroi est précisée par le complément.
- source_word: ἐξουσίαν
  choice: le droit
  rationale: Ici, le terme évoque une autorisation ou une qualité accordée, plutôt qu’une puissance brute; « droit » est clair et naturel en français.
- source_word: τέκνα θεοῦ
  choice: enfants de Dieu
  rationale: τέκνα est un terme filial inclusif et ne signifie pas spécifiquement « fils ».
- source_word: γενέσθαι
  choice: de devenir
  rationale: Le verbe indique l’entrée dans un nouvel état, nuance mieux conservée par « devenir » que par « être ».
- source_word: τοῖς πιστεύουσιν
  choice: à ceux qui croient
  rationale: Le participe présent caractérise ces personnes par leur foi; la formulation française est naturelle et conserve la forme verbale.
- source_word: εἰς τὸ ὄνομα αὐτοῦ
  choice: en son nom
  rationale: Avec πιστεύω, l’expression désigne une confiance dirigée vers la personne telle que son nom la révèle; « croire en son nom » conserve explicitement ὄνομα.
theological_decisions:
- issue: Relation entre « le recevoir » et « croire en son nom »
  choice: Conserver les deux expressions, la seconde reprenant et précisant les bénéficiaires.
  alternative: Fusionner les deux expressions en une seule idée.
  rationale: Le grec maintient les deux formulations. Les conserver respecte la texture johannique sans définir plus précisément que le texte leur relation exacte.
- issue: Sens du terme filial τέκνα
  choice: enfants de Dieu
  alternative: fils de Dieu
  rationale: Le texte emploie τέκνα, terme qui inclut les personnes des deux sexes, et non υἱοί, « fils ».
translation_notes:
  register: Français international moderne, clair et digne. La répétition « à tous ceux… à ceux… » est maintenue afin de préserver la reprise explicative du grec. Le marqueur [a] est placé après « droit », le terme auquel la note se rapporte.
