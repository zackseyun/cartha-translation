  yaml_path: translation/nt/john/001/022.yaml
  text: So they said to him, “Who are you, so that we may give an answer to those who sent us? What do you say about yourself?”
translation:
  language: fr
  text: 'Ils lui dirent donc : « Qui es-tu, afin que nous donnions une réponse à ceux qui nous ont envoyés ? Que dis-tu de toi-même ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  choice: donc
  rationale: Marque la suite logique de l’échange précédent tout en restant naturel en français moderne.
- source_word: εἶπαν ... αὐτῷ
  choice: Ils lui dirent
  rationale: Rend directement le verbe introducteur du discours et son complément, dans un registre narratif digne et courant.
- source_word: Τίς εἶ;
  choice: Qui es-tu ?
  rationale: Conserve la brièveté et le caractère direct de la question d’identité.
- source_word: ἵνα ἀπόκρισιν δῶμεν
  choice: Il faut que nous donnions une réponse
  rationale: Exprime ici la finalité pratique et la nécessité qui en découle en français idiomatique, sans modifier l’objet de la mission.
- source_word: τοῖς πέμψασιν ἡμᾶς
  choice: à ceux qui nous ont envoyés
  rationale: Reproduit naturellement le participe substantivé et maintient l’accord du participe passé avec le complément antéposé « nous ».
- source_word: τί λέγεις περὶ σεαυτοῦ;
  choice: Que dis-tu de toi-même ?
  rationale: Rend la demande de témoignage sur sa propre identité avec une formulation française naturelle et fidèle.
