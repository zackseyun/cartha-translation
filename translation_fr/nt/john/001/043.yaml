source:
  edition: SBLGNT
  text: Τῇ ἐπαύριον ἠθέλησεν ἐξελθεῖν εἰς τὴν Γαλιλαίαν. καὶ εὑρίσκει Φίλιππον καὶ λέγει αὐτῷ ὁ Ἰησοῦς· Ἀκολούθει μοι.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/043.yaml
  text: The next day he wanted to go out into Galilee[a], and Jesus finds Philip and says to him[c][b], “Follow me.”
translation:
  language: fr
  text: 'Le lendemain, il voulut partir pour la Galilée. Jésus trouve Philippe et lui dit[a] : « Suis-moi. »[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Les verbes « trouve » et « dit » sont au présent en grec : il s’agit de présents historiques qui donnent de la vivacité au récit.'
    reason: lexical_alternative
  - marker: b
    text: « Suis-moi » peut évoquer à la fois le fait d’accompagner Jésus et l’appel plus large à devenir son disciple.
    reason: alternative_reading
lexical_decisions:
- source_word: Τῇ ἐπαύριον
  choice: Le lendemain
  rationale: Expression temporelle naturelle en français moderne, qui conserve clairement la progression du récit.
- source_word: ἠθέλησεν
  choice: il voulut
  rationale: Le verbe exprime ici la volonté ou l’intention sans imposer l’idée plus délibérative de « décida ». Le sujet, Jésus, ressort du contexte et est ensuite nommé explicitement.
- source_word: ἐξελθεῖν εἰς τὴν Γαλιλαίαν
  choice: partir pour la Galilée
  rationale: « Partir » rend naturellement en français le mouvement exprimé par ἐξέρχομαι, tandis que « pour » indique la destination sans la lourdeur de « sortir vers/dans ».
- source_word: εὑρίσκει Φίλιππον
  choice: trouve Philippe
  rationale: Le présent historique grec est conservé afin de respecter la vivacité narrative propre au passage.
- source_word: λέγει αὐτῷ
  choice: lui dit
  rationale: Le français emploie naturellement le présent de « dire » sous la forme « dit », identique graphiquement au passé simple; dans la séquence avec « trouve », il se comprend comme un présent historique.
- source_word: Ἀκολούθει μοι
  choice: Suis-moi
  rationale: Formulation française directe et consacrée, qui peut désigner à la fois l’accompagnement concret et l’appel durable à devenir disciple.
- source_word: Φίλιππον
  choice: Philippe
  rationale: Forme française traditionnelle et courante du nom propre.
- source_word: ὁ Ἰησοῦς
  choice: Jésus
  rationale: Le sujet explicite grec est maintenu et placé devant les deux présents historiques pour obtenir une narration française claire.
theological_decisions:
- issue: Portée de l’ordre adressé à Philippe
  choice: « Suis-moi » laisse entendre un appel à devenir disciple tout en gardant son sens concret de suivre Jésus.
  alternative: Réduire l’expression à une simple invitation au déplacement physique, telle que « Viens avec moi ».
  rationale: Dans les Évangiles, ἀκολουθέω peut porter une forte dimension de discipulat, mais la formulation elle-même demeure ouverte à son sens concret. La traduction préserve cette tension sans l’expliciter dans le corps du verset.
translation_notes:
  register: Français international moderne, sobre et digne. « Le lendemain » et « partir pour la Galilée » assurent une lecture naturelle. Le passage du passé simple aux présents historiques reproduit le changement de temps du grec sans rendre la phrase artificielle.
