id: JHN.1.42
reference: John 1:42
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸀ἤγαγεν αὐτὸν πρὸς τὸν Ἰησοῦν. ἐμβλέψας αὐτῷ ὁ Ἰησοῦς εἶπεν· Σὺ εἶ Σίμων ὁ υἱὸς ⸀Ἰωάννου, σὺ κληθήσῃ Κηφᾶς (ὃ ἑρμηνεύεται Πέτρος).
base_translation:
  language: en
  yaml_path: translation/nt/john/001/042.yaml
  text: He brought him to Jesus[a]. Looking at him, Jesus said, “You are Simon, the son of John[b]; you will be called Cephas” (which is translated Peter).
translation:
  language: fr
  text: 'Il l’amena à Jésus. Jésus posa son regard sur lui et dit : « Tu es Simon, fils de Jean[a] ; tu seras appelé Céphas[b] » (ce qui se traduit par Pierre).'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Certains manuscrits portent « Jonas » au lieu de « Jean » ; le texte du SBLGNT porte « Jean ».
    reason: textual_variant
  - marker: b
    text: Céphas est le nom sémitique auquel correspond le nom grec Pierre ; ces deux noms ont le sens de « pierre » ou de « rocher ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤγαγεν αὐτὸν πρὸς τὸν Ἰησοῦν
  choice: Il l’amena à Jésus
  rationale: Le verbe ἄγω à l’aoriste décrit ici l’action accomplie de conduire quelqu’un auprès d’une personne. « Amener à Jésus » est naturel en français et respecte le mouvement exprimé par πρός avec l’accusatif.
- source_word: ἐμβλέψας αὐτῷ
  choice: Jésus posa son regard sur lui
  rationale: ἐμβλέπω suggère un regard attentif plutôt qu’un simple coup d’œil. Cette formulation française en garde l’intensité sans ajouter l’idée plus forte d’un regard scrutateur.
- source_word: Σὺ εἶ Σίμων ὁ υἱὸς Ἰωάννου
  choice: Tu es Simon, fils de Jean
  rationale: Le pronom explicite σὺ donne de la directeté à l’adresse. En français, « Tu es » la rend naturellement. « Fils de Jean » suit la leçon Ἰωάννου du SBLGNT.
- source_word: σὺ κληθήσῃ Κηφᾶς
  choice: tu seras appelé Céphas
  rationale: 'Le futur passif κληθήσῃ est rendu directement par « seras appelé ». Le nom sémitique Κηφᾶς est translittéré selon l’usage français établi : « Céphas ».'
- source_word: ὃ ἑρμηνεύεται Πέτρος
  choice: ce qui se traduit par Pierre
  rationale: La parenthèse grecque explique le nom sémitique par son correspondant grec. « Pierre » est la forme française traditionnelle du nom Πέτρος ; la traduction conserve donc deux noms propres plutôt que de remplacer le second par le nom commun « rocher ».
theological_decisions:
- issue: Portée du nouveau nom Céphas/Pierre
  choice: Conserver « Céphas » et « Pierre » comme noms propres, avec leur sens lexical en note
  alternative: Traduire directement l’un des noms par « Rocher » ou « Pierre » au sens commun
  rationale: Le verset rapporte l’attribution d’un nouveau nom sans expliciter ici toutes ses implications théologiques. Garder les noms propres préserve la fonction de nomination et évite d’imposer une interprétation doctrinale, tandis que la note signale leur sens commun.
translation_notes:
  register: 'Français moderne, international et digne. « Posa son regard » exprime la force de ἐμβλέπω de façon naturelle. Les marqueurs de notes sont placés après les éléments qu’ils expliquent : « Jean[a] » pour la variante textuelle et « Céphas[b] » pour le sens du nom.'
