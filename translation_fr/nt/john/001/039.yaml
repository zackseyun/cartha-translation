id: JHN.1.39
reference: John 1:39
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: λέγει αὐτοῖς· Ἔρχεσθε καὶ ⸂ὄψεσθε. ἦλθαν οὖν⸃ καὶ εἶδαν ποῦ μένει, καὶ παρ’ αὐτῷ ἔμειναν τὴν ἡμέραν ἐκείνην· ὥρα ἦν ὡς δεκάτη.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/039.yaml
  text: He said to them[a], “Come, and you will see.” So they went and saw where he was staying, and they stayed with him that day. It was about the tenth hour.
translation:
  language: fr
  text: 'Il leur dit : « Venez, et vous verrez. » Ils vinrent donc et virent où il séjournait, et ils restèrent avec lui ce jour-là. C’était environ la dixième heure.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, si l’on compte à partir du lever du soleil, environ 16 heures ; certains comprennent l’expression selon le calcul romain, soit environ 10 heures.
    reason: Le système de calcul des heures n’est pas précisé dans le texte grec.
lexical_decisions:
- source_word: λέγει αὐτοῖς
  choice: Il leur dit
  rationale: Le présent historique grec est rendu par le passé simple, temps naturel du récit écrit en français.
- source_word: Ἔρχεσθε καὶ ὄψεσθε
  choice: Venez, et vous verrez
  rationale: Cette formulation conserve l’impératif d’invitation et le futur explicite, sans ajouter de nuance absente du grec.
- source_word: ἦλθαν οὖν
  choice: Ils vinrent donc
  rationale: « Donc » exprime la conséquence marquée par οὖν, tandis que « vinrent » suit directement le mouvement suscité par l’invitation de Jésus.
- source_word: εἶδαν
  choice: virent
  rationale: Le verbe simple conserve en français l’écho avec « vous verrez ».
- source_word: ποῦ μένει
  choice: où il séjournait
  rationale: Dans ce contexte, μένω désigne l’endroit où Jésus se trouvait pour un séjour, sans nécessairement suggérer une résidence permanente.
- source_word: παρ’ αὐτῷ ἔμειναν
  choice: ils restèrent avec lui
  rationale: La formulation exprime à la fois la durée indiquée par μένω et la proximité ou la compagnie indiquée par παρά avec le datif.
- source_word: τὴν ἡμέραν ἐκείνην
  choice: ce jour-là
  rationale: La traduction suit précisément l’expression temporelle sans ajouter « le reste de », qui serait interprétatif.
- source_word: ὥρα ἦν ὡς δεκάτη
  choice: Il était environ la dixième heure
  rationale: La formulation conserve l’ordinal grec et l’approximation exprimée par ὡς, sans trancher le système de calcul des heures.
theological_decisions:
- issue: Mode de calcul de « la dixième heure »
  choice: Conserver « la dixième heure » dans le texte principal.
  alternative: Environ 16 heures selon un calcul à partir du lever du soleil, ou environ 10 heures selon un calcul romain.
  rationale: Le texte grec ne précise pas le système horaire employé. Garder l’expression littérale préserve cette ambiguïté réelle, tandis que la note présente les principales compréhensions possibles.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple convient au registre narratif biblique sans être archaïque. « Séjournait » évite de faire de l’endroit une résidence permanente, et la répétition verbale « verrez / virent » conserve un écho important du grec.
