id: JHN.1.26
reference: John 1:26
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀπεκρίθη αὐτοῖς ὁ Ἰωάννης λέγων· Ἐγὼ βαπτίζω ἐν ὕδατι· ⸀μέσος ὑμῶν ⸀ἕστηκεν ὃν ὑμεῖς οὐκ οἴδατε,
base_translation:
  language: en
  yaml_path: translation/nt/john/001/026.yaml
  text: John answered them[a], saying, “I baptize in water. Among you stands one whom you do not know,”
translation:
  language: fr
  text: 'Jean leur répondit : « Moi, je baptise dans l’eau. Au milieu de vous[a] se tient quelqu’un que vous ne connaissez pas. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Parmi vous » se tient quelqu’un que vous ne connaissez pas.'
    reason: Variante idiomatique possible pour μέσος ὑμῶν; elle exprime la présence au sein du groupe sans l’image plus spatiale de « au milieu de vous ».
lexical_decisions:
- source_word: ἀπεκρίθη αὐτοῖς ὁ Ἰωάννης λέγων
  choice: 'Jean leur répondit :'
  rationale: 'La tournure française naturelle « répondit : » introduit directement les paroles et rend à la fois le verbe de réponse et la fonction du participe λέγων, sans le lourd « répondit en disant ».'
- source_word: Ἐγώ
  choice: Moi, je
  rationale: Le pronom sujet grec est exprimé et porte une certaine insistance; la dislocation française « Moi, je » la conserve naturellement.
- source_word: βαπτίζω
  choice: je baptise
  rationale: « Baptiser » est le terme français établi et convient au contexte sans réduire le sens à une modalité précise comme « immerger ».
- source_word: ἐν ὕδατι
  choice: dans l’eau
  rationale: Cette formulation conserve la valeur locative naturelle de ἐν avec le datif tout en restant idiomatique en français.
- source_word: μέσος ὑμῶν
  choice: Au milieu de vous
  rationale: La formulation rend directement la présence de la personne au sein du groupe; « parmi vous » est une possibilité plus idiomatique signalée en note.
- source_word: ἕστηκεν
  choice: se tient
  rationale: Le parfait exprime ici un état présent résultant du fait d’avoir pris place; « se tient » en restitue naturellement la valeur stative.
- source_word: ὃν
  choice: quelqu’un que
  rationale: Le français exige un antécédent explicite dans cette construction. « Quelqu’un » maintient l’identité de la personne dans l’ombre, comme le fait le récit à ce point.
- source_word: οὐκ οἴδατε
  choice: vous ne connaissez pas
  rationale: « Connaître » rend directement οἶδα sans préciser indûment qu’il s’agirait seulement de ne pas reconnaître la personne.
theological_decisions:
- issue: Identité de la personne non nommée qui se tient au milieu d’eux
  choice: Employer le terme indéfini « quelqu’un » sans identifier explicitement cette personne.
  alternative: « le Messie » ou « celui-ci »
  rationale: Même si le contexte plus large permet d’identifier Jésus, le verset maintient ici son identité implicite. La traduction conserve cette tension narrative au lieu de l’expliciter.
translation_notes:
  register: Français international moderne, digne et accessible. La ponctuation directe évite le calque « répondit en disant ». « Moi, je » préserve l’emphase du pronom grec, tandis que « quelqu’un » maintient l’effet d’attente du texte.
