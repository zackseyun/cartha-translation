  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτῷ· Ἀμὴν ἀμὴν λέγω ⸀ὑμῖν, ὄψεσθε τὸν οὐρανὸν ἀνεῳγότα καὶ τοὺς ἀγγέλους τοῦ θεοῦ ἀναβαίνοντας καὶ καταβαίνοντας ἐπὶ τὸν υἱὸν τοῦ ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/051.yaml
  text: And he said to him[a], “Truly, truly, I say to you[b], you will see heaven opened and the angels of God ascending and descending on the Son of Man.”
translation:
  language: fr
  text: 'Et il lui dit : « En vérité, en vérité, je vous le dis : vous[a] verrez le ciel ouvert et les anges de Dieu monter et descendre sur le Fils de l’homme[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dans « je vous le dis » et « vous verrez », le « vous » est pluriel en grec.
    reason: lexical_alternative
  - marker: b
    text: Cette image fait écho au rêve de Jacob en Genèse 28.12, mais elle est ici centrée sur le Fils de l’homme.
    reason: cross_reference
lexical_decisions:
- source_word: Ἀμὴν ἀμὴν
  choice: Oui, je vous le dis en vérité
  rationale: Cette tournure française naturelle et solennelle rend la formule redoublée qui introduit avec insistance une déclaration certaine. Elle évite un « amen, amen » moins immédiatement intelligible tout en conservant sa force.
- source_word: ὑμῖν
  choice: vous
  rationale: Le pronom grec est pluriel. Le français « vous » convient naturellement, mais son nombre peut sembler ambigu dans une adresse faite d’abord à Nathanaël ; une note précise donc le passage au pluriel.
- source_word: ὄψεσθε
  choice: vous verrez
  rationale: Le futur de ὁράω se rend directement et naturellement par le futur simple français.
- source_word: τὸν οὐρανὸν ἀνεῳγότα
  choice: le ciel ouvert
  rationale: Le participe parfait décrit le ciel dans l’état résultant de son ouverture. « Le ciel ouvert » préserve cette nuance sans ajout interprétatif.
- source_word: ἀγγέλους
  choice: les anges
  rationale: Dans cette scène visionnaire explicitement liée à Dieu, le terme désigne des êtres célestes plutôt que de simples messagers humains.
- source_word: ἀναβαίνοντας καὶ καταβαίνοντας
  choice: monter et descendre
  rationale: Ce couple verbal courant restitue précisément les deux mouvements et garde perceptible l’écho de Genèse 28. L’infinitif français après « verrez » est idiomatique.
- source_word: ἐπὶ
  choice: sur
  rationale: Avec l’accusatif, ἐπί exprime ici le mouvement des anges en relation avec le Fils de l’homme. « Sur » conserve l’image et son ambiguïté spatiale sans l’expliquer.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: le Fils de l’homme
  rationale: Cette désignation traditionnelle de Jésus conserve ses résonances scripturaires et apocalyptiques sans la paraphraser.
theological_decisions:
- issue: L’adresse narrative est singulière (αὐτῷ), tandis que les pronoms du discours direct sont pluriels (ὑμῖν, ὄψεσθε).
  choice: Conserver « vous » dans le texte et signaler explicitement son pluriel en note.
  alternative: Expliciter dans le texte par « vous tous ».
  rationale: Le grec élargit l’adresse au-delà de Nathanaël, mais « vous tous » ajouterait une insistance absente du texte. La note préserve la portée exégétique du pluriel.
- issue: La montée et la descente des anges évoquent le rêve de Jacob en Genèse 28.12 et recentrent l’image sur le Fils de l’homme.
  choice: Préserver l’image sans l’interpréter dans le corps du texte, avec une note de renvoi.
  alternative: Paraphraser le texte afin d’expliciter que Jésus est le lieu de la révélation divine.
  rationale: L’allusion est forte, mais le texte ne formule pas lui-même cette explication théologique ; elle doit rester une observation de note.
- issue: La préposition ἐπί peut susciter plusieurs représentations spatiales dans cette image visionnaire.
  choice: Employer « sur le Fils de l’homme » sans préciser davantage la relation.
  alternative: Traduire par « au-dessus du Fils de l’homme » ou développer « vers… et depuis… ».
  rationale: « Sur » suit au plus près la formulation grecque et maintient une ambiguïté authentique que les autres choix résoudraient prématurément.
translation_notes:
  register: 'Français international moderne, digne et accessible. La formule « Oui, je vous le dis en vérité » garde la solennité de Ἀμὴν ἀμὴν sans archaïsme. Les marqueurs de notes sont placés après les éléments qu’ils éclairent : [a] après le second « vous », et [b] après « Fils de l’homme ».'
