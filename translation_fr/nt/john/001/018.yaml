id: JHN.1.18
reference: John 1:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: θεὸν οὐδεὶς ἑώρακεν πώποτε· ⸂μονογενὴς θεὸς⸃ ὁ ὢν εἰς τὸν κόλπον τοῦ πατρὸς ἐκεῖνος ἐξηγήσατο.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/018.yaml
  text: No one has ever seen God[a]; the one and only God, who is in the bosom of the Father[c][b], has made him known.
translation:
  language: fr
  text: Personne n’a jamais vu Dieu ; le Dieu unique[a], qui est dans le sein du Père[b], l’a fait connaître[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Certains manuscrits portent « le Fils unique » (ou « le Fils seul engendré ») au lieu de « le Dieu unique ».
    reason: textual_variant
  - marker: b
    text: Ou « auprès du Père ». Le grec dit littéralement « dans le sein du Père », image d’une profonde intimité.
    reason: lexical_alternative
  - marker: c
    text: Ou « l’a expliqué » ou « l’a révélé ».
    reason: lexical_alternative
lexical_decisions:
- source_word: θεὸν
  choice: Dieu
  rationale: Complément direct de ἑώρακεν ; θεός désigne ici Dieu de manière absolue.
- source_word: οὐδεὶς
  choice: Personne
  rationale: Équivalent français naturel qui conserve la négation universelle.
- source_word: ἑώρακεν πώποτε
  choice: n’a jamais vu
  rationale: Le parfait associé à πώποτε s’exprime naturellement en français par « n’a jamais vu ».
- source_word: μονογενὴς θεὸς
  choice: le Dieu unique
  rationale: Le texte imprimé du SBLGNT porte θεός. μονογενής exprime ici l’unicité, le caractère sans pareil, plutôt que l’idée lexicale explicite d’un engendrement.
- source_word: ὁ ὢν
  choice: qui est
  rationale: Le participe substantivé qualifie le Dieu unique ; une proposition relative est naturelle en français.
- source_word: εἰς τὸν κόλπον τοῦ πατρὸς
  choice: dans le sein du Père
  rationale: Cette formulation conserve l’image grecque du κόλπος et son expression d’une proximité intime, sans la remplacer dans le texte par une interprétation.
- source_word: πατρὸς
  choice: du Père
  rationale: Titre relationnel défini dans l’usage johannique, désignant Dieu comme Père.
- source_word: ἐκεῖνος
  choice: sujet repris implicitement
  rationale: Le démonstratif est emphatique en grec, mais l’ajout de « celui-là » ou d’un pronom redondant alourdirait la phrase française ; le sujet demeure clairement le Dieu unique.
- source_word: ἐξηγήσατο
  choice: l’a fait connaître
  rationale: Le verbe peut signifier raconter, exposer ou expliquer ; dans ce contexte, « faire connaître » rend clairement la révélation de Dieu tout en gardant une formulation naturelle.
theological_decisions:
- issue: Variante textuelle μονογενὴς θεὸς / ὁ μονογενὴς υἱός
  choice: 'Le texte principal suit le SBLGNT : « le Dieu unique ».'
  alternative: « le Fils unique » ou, traditionnellement, « le Fils seul engendré »
  rationale: La leçon fournie est μονογενὴς θεός. Comme cette variante est importante sur les plans textuel et christologique, l’autre leçon est signalée en note plutôt que passée sous silence.
- issue: Sens de μονογενής
  choice: unique
  alternative: seul engendré
  rationale: Les données lexicales favorisent le sens de « seul de son espèce, unique ». La traduction évite donc d’introduire directement la notion d’engendrement dans le sens lexical, tout en mentionnant la formulation traditionnelle dans la note consacrée à la variante.
- issue: Image de la relation avec le Père
  choice: dans le sein du Père
  alternative: auprès du Père
  rationale: Le texte principal préserve la métaphore de l’intimité sans la réduire à une simple proximité spatiale ; une formulation plus idiomatique est proposée en note.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la métaphore du « sein du Père » et la lecture difficile du SBLGNT, tandis que les principales variantes textuelles et lexicales sont documentées en notes.
