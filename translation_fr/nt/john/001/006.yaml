  variant: modern international French
source:
  edition: SBLGNT
  text: Ἐγένετο ἄνθρωπος ἀπεσταλμένος παρὰ θεοῦ, ὄνομα αὐτῷ Ἰωάννης·
base_translation:
  language: en
  yaml_path: translation/nt/john/001/006.yaml
  text: There was a man sent from God[a], whose name was John.
translation:
  language: fr
  text: Il y eut un homme envoyé de la part de Dieu, du nom de Jean.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐγένετο
  choice: Il y eut
  rationale: Le verbe introduit un nouveau personnage dans le récit. « Il y eut » conserve la valeur existentielle sans suggérer sa création ni une simple apparition.
- source_word: ἄνθρωπος
  choice: un homme
  rationale: Le terme désigne ici un individu masculin, Jean ; « un homme » est naturel et précis en français.
- source_word: ἀπεσταλμένος
  choice: envoyé
  rationale: Le participe parfait passif présente Jean comme quelqu’un qui a reçu une mission ; « envoyé » en conserve sobrement le sens et la voix passive.
- source_word: παρὰ θεοῦ
  choice: de la part de Dieu
  rationale: Avec le génitif, παρά exprime ici la provenance de la mission. « De la part de Dieu » rend à la fois la source et l’idée de mandat, sans réduire la formule à la seule agence.
- source_word: ὄνομα αὐτῷ Ἰωάννης
  choice: du nom de Jean
  rationale: Cette formulation française restitue naturellement l’idiome grec d’identification, de manière concise sans modifier son sens.
- source_word: Ἰωάννης
  choice: Jean
  rationale: La forme française traditionnelle et immédiatement reconnaissable du nom est retenue.
theological_decisions:
- issue: Nature de la mission de Jean
  choice: Jean est présenté comme envoyé et mandaté de la part de Dieu.
  alternative: Jean était seulement associé à Dieu ; ou, plus explicitement quant à l’agence, « envoyé par Dieu ».
  rationale: Le participe passif ἀπεσταλμένος associé à παρὰ θεοῦ indique que la mission a Dieu pour origine. La traduction conserve cette affirmation sans ajouter au texte un titre prophétique ni une autre précision doctrinale.
translation_notes:
  register: Français moderne, digne et accessible. La tournure « Il y eut » garde la solennité narrative de l’introduction, tandis que « de la part de Dieu » exprime clairement la provenance du mandat. Aucune note n’est nécessaire, car « du nom de Jean » rend directement et naturellement l’idiome grec.
