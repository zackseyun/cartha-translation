review_pass:
  verdict: revise
  source_fidelity: 'La question est bien rendue dans son ensemble, ainsi que les titres « le Messie », « Élie » et « le Prophète ». Cependant, « encore » n’est pas exprimé par le grec. Le texte comporte deux verbes narratifs coordonnés : « ils l’interrogèrent et lui dirent ». Les conserver est possible et naturel en français.'
  naturalness: '« Ils l’interrogèrent et lui dirent : » est un français moderne, clair et narratif; il évite à la fois l’ajout de « encore » et l’effacement de εἶπαν αὐτῷ. La question directe est idiomatique.'
  terminology: « Messie » rend fidèlement ὁ χριστός dans son contexte titularisé. « Élie » est la forme française usuelle. La majuscule dans « le Prophète » convient à la figure déterminée visée sans imposer son identification. La note sur Deutéronome doit toutefois éviter de présenter l’identification comme plus établie que ne le permet le texte.
