id: JHN.1.25
reference: John 1:25
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἠρώτησαν αὐτὸν καὶ εἶπαν αὐτῷ· Τί οὖν βαπτίζεις εἰ σὺ οὐκ εἶ ὁ χριστὸς ⸂οὐδὲ Ἠλίας οὐδὲ⸃ ὁ προφήτης;
base_translation:
  language: en
  yaml_path: translation/nt/john/001/025.yaml
  text: And they asked him and said to him[a], “Why then are you baptizing, if you are not the Messiah, nor Elijah[b], nor the Prophet?”
translation:
  language: fr
  text: 'Ils l’interrogèrent et lui dirent : « Pourquoi donc baptises-tu, si tu n’es ni le Messie[a], ni Élie, ni le Prophète[b] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le Christ ». Le titre grec Christos est rendu ici par « Messie » afin de préserver le contexte de l’attente messianique juive.
    reason: alternative_reading
  - marker: b
    text: Le « Prophète » renvoie probablement au prophète semblable à Moïse attendu d’après Deutéronome 18.15.
    reason: cross_reference
lexical_decisions:
- source_word: ἠρώτησαν αὐτὸν καὶ εἶπαν αὐτῷ
  choice: Ils l’interrogèrent encore
  rationale: Le grec cumule littéralement « ils l’interrogèrent et lui dirent », tournure sémitisante peu naturelle en français. « Ils l’interrogèrent encore » restitue l’acte de parole et la progression du dialogue; καί peut ici marquer la continuation.
- source_word: Τί οὖν βαπτίζεις
  choice: Pourquoi donc baptises-tu
  rationale: 'Dans ce contexte, τί demande la raison ou le fondement de l’acte, tandis que οὖν marque la conséquence logique : « Pourquoi donc… ? » Le présent exprime la pratique actuelle de Jean.'
- source_word: ὁ χριστός
  choice: le Messie
  rationale: Χριστός est ici un titre lié à l’attente juive; « le Messie » en transmet directement le sens et le contexte.
- source_word: Ἠλίας
  choice: Élie
  rationale: Forme française traditionnelle et courante du nom biblique.
- source_word: ὁ προφήτης
  choice: le Prophète
  rationale: L’article défini désigne une figure attendue et reconnue, distincte du Messie et d’Élie; la majuscule signale cette valeur titulaire sans préciser davantage son identité.
- source_word: οὐδὲ ... οὐδὲ
  choice: ni ... ni
  rationale: Après la négation « tu n’es », la coordination française naturelle des deux autres possibilités exclues est « ni… ni ».
theological_decisions:
- issue: Rendu de Χριστός comme titre
  choice: le Messie
  alternative: le Christ
  rationale: Le dialogue porte sur une figure attendue; « Messie » préserve nettement le cadre juif et évite de faire du titre un nom propre.
- issue: Statut de ὁ προφήτης
  choice: le Prophète
  alternative: le prophète
  rationale: La formulation grecque présente une figure déterminée dans l’attente des interlocuteurs. La majuscule française rend cette valeur de titre tout en laissant au lecteur l’identification précise; une note indique le rapprochement probable avec Deutéronome 18.15.
translation_notes:
  register: Français moderne, international et digne. La tournure redondante grecque « ils l’interrogèrent et lui dirent » est allégée pour produire un dialogue naturel, sans modifier le contenu de la question. « Baptises-tu » conserve la deuxième personne du singulier et la valeur actuelle du présent.
