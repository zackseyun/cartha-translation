  - severity: low
    issue: Note b légèrement trop affirmative sur l’identification du Prophète
    rationale: Le rapprochement avec le prophète semblable à Moïse est très plausible dans le contexte johannique, mais la note devrait conserver explicitement le caractère probable de cette identification et ne pas suggérer que le grec l’énonce.
