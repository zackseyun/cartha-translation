id: JHN.1.5
reference: John 1:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ τὸ φῶς ἐν τῇ σκοτίᾳ φαίνει, καὶ ἡ σκοτία αὐτὸ οὐ κατέλαβεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/005.yaml
  text: And the light shines in the darkness[a], and the darkness has not overcome it.
translation:
  language: fr
  text: La lumière brille dans les ténèbres, et les ténèbres ne l’ont pas vaincue.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ne l’ont pas comprise » ou « ne l’ont pas saisie ». Le verbe grec peut signifier vaincre, s’emparer de, saisir ou comprendre.'
    reason: alternative_reading
lexical_decisions:
- source_word: φῶς
  choice: la lumière
  rationale: L’article défini préserve la référence thématique à la lumière déjà établie dans le prologue.
- source_word: σκοτίᾳ / σκοτία
  choice: les ténèbres
  rationale: Le pluriel lexicalisé « les ténèbres » est l’expression française naturelle et solennelle pour l’obscurité envisagée comme puissance opposée à la lumière; l’article grec est conservé.
- source_word: φαίνει
  choice: brille
  rationale: Le présent rend naturellement l’action actuelle et continue, sans surcharger l’aspect verbal.
- source_word: κατέλαβεν
  choice: ne l’ont pas vaincue
  rationale: Dans l’image d’un affrontement entre lumière et ténèbres, « vaincre » exprime bien le sens hostile possible de καταλαμβάνω. L’ambiguïté avec « saisir/comprendre » est conservée en note.
- source_word: αὐτό
  choice: l’
  rationale: Le pronom renvoie grammaticalement à « la lumière ». En français, le pronom objet féminin s’accorde avec ce nom, sans imposer ici une référence personnelle explicite.
theological_decisions:
- issue: Sens de κατέλαβεν dans l’opposition entre la lumière et les ténèbres
  choice: ne l’ont pas vaincue
  alternative: ne l’ont pas comprise / saisie
  rationale: Le contexte imagé favorise l’idée que les ténèbres n’ont pas triomphé de la lumière, mais le verbe grec peut aussi exprimer le fait de saisir intellectuellement ou de parvenir à appréhender. La note préserve cette polysémie et la tension johannique.
translation_notes:
  register: Français moderne, international et digne. « Les ténèbres » conserve le contraste thématique traditionnel sans archaïsme marqué; « vaincue » s’accorde avec « la lumière ».
