id: JHN.1.3
reference: John 1:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: πάντα δι’ αὐτοῦ ἐγένετο, καὶ χωρὶς αὐτοῦ ἐγένετο οὐδὲ ἕν. ὃ γέγονεν
base_translation:
  language: en
  yaml_path: translation/nt/john/001/003.yaml
  text: All things came into being through him[a], and apart from him not even one thing came into being that has come into being.
translation:
  language: fr
  text: Tout est venu à l’existence par lui[a], et sans lui, rien de ce qui est venu à l’existence n’est venu à l’existence.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, en faisant commencer le verset 4 par les derniers mots du verset 3 : « Ce qui est venu à l’existence en lui était la vie. »'
    reason: Lecture alternative due à l’absence de ponctuation dans les plus anciens manuscrits grecs.
lexical_decisions:
- source_word: πάντα
  choice: Tout
  rationale: Le neutre pluriel a ici une portée globale. En français actuel, « Tout » exprime naturellement l’ensemble de la réalité créée sans suggérer que le Logos lui-même en ferait partie.
- source_word: δι’ αὐτοῦ
  choice: par lui
  rationale: διά suivi du génitif marque ici la médiation ou l’agent intermédiaire. « Par lui » est idiomatique en français et conserve cette valeur sans la développer excessivement.
- source_word: ἐγένετο
  choice: est venu à l’existence
  rationale: Le verbe γίνομαι désigne ici l’entrée dans l’existence. Cette formulation garde la portée ontologique du grec, contrairement à « a été fait », qui pourrait évoquer seulement la fabrication.
- source_word: χωρὶς αὐτοῦ
  choice: sans lui
  rationale: χωρίς exprime l’absence ou la séparation. « Sans lui » rend clairement et naturellement l’idée qu’aucune réalité créée n’a une origine indépendante de lui.
- source_word: οὐδὲ ἕν
  choice: rien
  rationale: Littéralement, l’expression signifie « pas même une seule chose ». Dans la phrase française retenue, « rien de ce qui existe » transmet l’exclusion exhaustive avec plus de naturel.
- source_word: ὃ γέγονεν
  choice: de ce qui existe
  rationale: Le relatif est rattaché à la phrase précédente. Le parfait γέγονεν décrit ce qui est venu à l’existence et demeure existant; « ce qui existe » en restitue ici le résultat présent dans une tournure française fluide.
theological_decisions:
- issue: Rattachement de la proposition finale ὃ γέγονεν
  choice: 'La rattacher au verset 3 : « rien de ce qui existe n’est venu à l’existence sans lui »'
  alternative: 'Commencer le verset 4 ainsi : « Ce qui est venu à l’existence en lui était vie. »'
  rationale: Les plus anciens manuscrits grecs ne fournissent pas une ponctuation permettant de trancher sans ambiguïté. Le rattachement au verset 3 donne une affirmation cohérente de l’universalité de la création par le Logos; l’autre analyse, réelle et ancienne, est conservée en note.
translation_notes:
  register: Français international moderne, naturel et digne. La répétition de « venu à l’existence » maintient le lien lexical avec γίνομαι, tandis que la seconde moitié est restructurée selon l’usage français afin d’éviter une formulation pesante sans perdre l’insistance exhaustive du grec.
