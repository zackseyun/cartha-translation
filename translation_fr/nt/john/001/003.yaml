    issue: Le parfait ὃ γέγονεν est rendu par « ce qui existe ».
    rationale: Cette expression ne traduit que le résultat présent et ne conserve pas explicitement l’idée de ce qui « est venu à l’existence ». Elle rend aussi moins visible le rattachement retenu de la proposition finale au verset 3.
  - severity: low
    issue: La note porte « était vie ».
    rationale: Dans cette formulation française, « était la vie » est plus naturel et rend sans ajout doctrinal la prédication grecque ἦν ζωή.
  revised_text: Tout est venu à l’existence par lui[a], et sans lui, rien de ce qui est venu à l’existence n’est venu à l’existence.
