id: JHN.1.34
reference: John 1:34
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: κἀγὼ ἑώρακα, καὶ μεμαρτύρηκα ὅτι οὗτός ἐστιν ὁ ⸀ἐκλεκτὸς τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/034.yaml
  text: And I have seen and have testified that this is the Chosen One of God[a].
translation:
  language: fr
  text: Et moi, j’ai vu et j’ai témoigné que c’est lui, l’Élu de Dieu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Certains manuscrits portent « le Fils de Dieu » au lieu de « l’Élu de Dieu ».
    reason: textual_variant
lexical_decisions:
- source_word: κἀγώ
  choice: Et moi
  rationale: La crase de καί et ἐγώ exprime à la fois la continuité et l’insistance sur le témoin; « Et moi » rend naturellement ces deux nuances.
- source_word: ἑώρακα
  choice: j’ai vu
  rationale: Le passé composé français convient au parfait grec et présente l’expérience visuelle de Jean comme un fait accompli dont la portée demeure.
- source_word: μεμαρτύρηκα
  choice: j’ai témoigné
  rationale: Le passé composé rend clairement le témoignage accompli et toujours valable; « témoigné » est courant et conserve le vocabulaire johannique du témoignage.
- source_word: ὅτι
  choice: que
  rationale: La conjonction introduit ici le contenu du témoignage, et non sa cause.
- source_word: οὗτός
  choice: c’est lui
  rationale: Cette tournure idiomatique conserve la désignation directe et emphatique de Jésus sans le tour peu naturel « celui-ci » dans ce contexte.
- source_word: ἐκλεκτός
  choice: l’Élu
  rationale: L’adjectif substantivé avec article désigne celui que Dieu a choisi. « l’Élu » est bref, dignifié et naturel en français; la majuscule signale son emploi comme titre contextuel sans ajouter de contenu doctrinal.
- source_word: τοῦ θεοῦ
  choice: de Dieu
  rationale: Le génitif est rendu directement et naturellement dans la construction titulaire « l’Élu de Dieu ».
theological_decisions:
- issue: Titre christologique en Jean 1.34
  choice: l’Élu de Dieu
  alternative: le Fils de Dieu
  rationale: Le texte fourni du SBLGNT porte ὁ ἐκλεκτὸς τοῦ θεοῦ; le texte principal traduit donc cette leçon sans la conformer à la variante plus familière. La variante christologiquement importante « le Fils de Dieu » est signalée en note afin de préserver les données textuelles.
translation_notes:
  register: Français international moderne, naturel et digne. La répétition « j’ai vu et j’ai témoigné » conserve le parallélisme des deux parfaits grecs. « C’est lui » évite un démonstratif raide tout en maintenant l’insistance du texte.
