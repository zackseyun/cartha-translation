source:
  edition: SBLGNT
  text: ⸀εἶπεν αὐτῷ ὁ Ἰησοῦς· Καὶ ἑώρακας αὐτὸν καὶ ὁ λαλῶν μετὰ σοῦ ἐκεῖνός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/037.yaml
  text: Jesus said to him[a], “You have seen him, and the one speaking with you is he.”
translation:
  language: fr
  text: 'Jésus lui dit : « Tu l’as vu, et celui qui te parle[a], c’est lui. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « celui qui parle avec toi ». Le grec dit plus littéralement : « celui qui parle avec toi ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν αὐτῷ
  choice: Jésus lui dit
  rationale: Le datif αὐτῷ désigne naturellement l’interlocuteur. Dans ce récit au présent de narration français, « lui dit » rend sobrement l’aoriste εἶπεν.
- source_word: Καὶ
  choice: et
  rationale: La conjonction coordonne les deux affirmations sans qu’il soit nécessaire d’ajouter une valeur emphatique comme « en effet ».
- source_word: ἑώρακας
  choice: tu l’as vu
  rationale: Le passé composé français exprime ici l’acte accompli dont la pertinence demeure au moment où Jésus parle, ce qui correspond bien au parfait grec.
- source_word: αὐτόν
  choice: l’
  rationale: Le pronom masculin singulier reprend sans l’expliciter le référent mentionné dans le contexte précédent.
- source_word: ὁ λαλῶν μετὰ σοῦ
  choice: celui qui te parle
  rationale: Cette formulation est naturelle en français moderne. Le français dit normalement « parler à quelqu’un » là où le grec emploie μετά avec le génitif, littéralement « parler avec toi ».
- source_word: ἐκεῖνός ἐστιν
  choice: c’est lui
  rationale: La tournure française conserve l’identification directe et marquée, sans répéter le titre donné dans le contexte ni ajouter d’explication.
theological_decisions:
- issue: L’identification de Jésus au référent de la question précédente
  choice: « celui qui te parle, c’est lui »
  alternative: « c’est lui qui parle avec toi »
  rationale: Le texte grec identifie directement Jésus au personnage évoqué précédemment, sans en répéter le titre. La traduction garde cette révélation explicite tout en évitant une expansion interprétative.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement correspond au dialogue singulier. La dislocation « celui qui te parle, c’est lui » est idiomatique et conserve l’accent porté par ἐκεῖνος.
