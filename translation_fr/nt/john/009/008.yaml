  text: οἱ οὖν γείτονες καὶ οἱ θεωροῦντες αὐτὸν τὸ πρότερον ὅτι ⸀προσαίτης ἦν ἔλεγον· Οὐχ οὗτός ἐστιν ὁ καθήμενος καὶ προσαιτῶν;
base_translation:
  language: en
  yaml_path: translation/nt/john/009/008.yaml
  text: So the neighbors[a], and those who had seen him before as a beggar, were saying, “Is this not the man who used to sit and beg?”
translation:
  language: fr
  text: 'Alors les voisins et ceux qui l’avaient vu auparavant alors qu’il était mendiant disaient : « N’est-ce pas l’homme qui était assis et mendiait ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  choice: Alors
  rationale: Marque naturellement la progression du récit et le lien avec la guérison qui précède, sans surcharger le texte d’une conclusion logique.
- source_word: γείτονες
  choice: les voisins
  rationale: Équivalent direct et courant pour les personnes qui vivaient près de lui.
- source_word: θεωροῦντες αὐτὸν τὸ πρότερον
  choice: ceux qui l’avaient vu auparavant
  rationale: Le plus-que-parfait situe clairement leurs observations avant l’événement présent, tandis qu’« auparavant » rend τὸ πρότερον.
- source_word: ὅτι προσαίτης ἦν
  choice: mendier
  rationale: Dans la construction française, l’infinitif après « vu » exprime naturellement ce sous quoi ils le connaissaient, sans imposer à ὅτι une valeur causale contestable.
- source_word: ἔλεγον
  choice: disaient
  rationale: L’imparfait conserve l’aspect duratif ou répété du verbe grec et convient à un échange au sein du groupe.
- source_word: Οὐχ οὗτός ἐστιν
  choice: N’est-ce pas l’homme
  rationale: La question négative attend une réponse affirmative et exprime la reconnaissance mêlée d’étonnement.
- source_word: ὁ καθήμενος καὶ προσαιτῶν
  choice: l’homme qui se tenait assis et mendiait
  rationale: Les participes substantivés identifient l’homme par son activité habituelle antérieure. L’imparfait français rend cette habitude tout en conservant les deux actions du grec.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La formulation évite le littéralisme maladroit « parce qu’il était mendiant » et rend l’identification publique de l’homme par son ancienne pratique. Aucun marqueur de note n’est nécessaire.
