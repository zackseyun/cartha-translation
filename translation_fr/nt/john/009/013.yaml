  text: Ἄγουσιν αὐτὸν πρὸς τοὺς Φαρισαίους τόν ποτε τυφλόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/013.yaml
  text: They brought the man who had formerly been blind to the Pharisees[a].
translation:
  language: fr
  text: On conduit l’homme qui était autrefois aveugle aux pharisiens.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἄγουσιν
  choice: On conduit
  rationale: Le présent grec est un présent historique. Le présent de narration est naturel en français et conserve ici la vivacité du récit. Le sujet pluriel non exprimé est rendu par « on », puisque les personnes concernées ne sont pas identifiées dans ce verset.
- source_word: αὐτὸν
  choice: l’homme
  rationale: Le pronom « lui » est explicité par « l’homme » en lien avec l’expression substantivée qui suit, afin d’obtenir une phrase française claire et naturelle sans changer le référent.
- source_word: πρὸς τοὺς Φαρισαίους
  choice: vers les pharisiens
  rationale: Avec l’accusatif, πρός marque ici le mouvement en direction de personnes. « Vers » rend directement cette orientation sans ajouter l’idée plus interprétative d’une comparution officielle.
- source_word: Φαρισαίους
  choice: pharisiens
  rationale: Forme française usuelle du nom de ce groupe. La minuscule suit l’usage typographique courant en français pour les membres d’un groupe religieux.
- source_word: τόν ποτε τυφλόν
  choice: l’homme qui avait été aveugle
  rationale: L’article et l’adjectif forment une expression substantivée, « celui qui était autrefois aveugle ». Une relative explicite naturellement en français l’état antérieur de cet homme et son contraste avec sa guérison présente.
- source_word: ποτε
  choice: avait été
  rationale: La valeur temporelle de ποτε, « autrefois/jadis », est exprimée idiomatiquement par le plus-que-parfait, qui situe clairement la cécité dans le passé sans alourdir la phrase avec un adverbe.
- source_word: τυφλόν
  choice: aveugle
  rationale: Équivalent français direct de l’adjectif décrivant son ancienne condition.
