id: JHN.9.29
reference: John 9:29
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἡμεῖς οἴδαμεν ὅτι Μωϋσεῖ λελάληκεν ὁ θεός, τοῦτον δὲ οὐκ οἴδαμεν πόθεν ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/029.yaml
  text: We know that God has spoken to Moses[a], but as for this man, we do not know where he is from.
translation:
  language: fr
  text: Nous savons que Dieu a parlé à Moïse. Mais celui-ci, nous ne savons pas d’où il vient[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « quelle est son origine ». Dans l’Évangile selon Jean, les questions sur l’origine de Jésus peuvent avoir à la fois un sens ordinaire et une portée théologique plus profonde.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμεῖς
  choice: Nous
  rationale: Le pronom explicite souligne la position assurée des locuteurs et leur opposition avec ce qu’ils disent de Jésus.
- source_word: οἴδαμεν
  choice: savons
  rationale: Le verbe exprime ici un savoir tenu pour certain. La même traduction est conservée dans ses deux occurrences.
- source_word: Μωϋσεῖ
  choice: Moïse
  rationale: Forme française usuelle du nom propre biblique.
- source_word: λελάληκεν
  choice: a parlé
  rationale: Le passé composé rend naturellement en français l’action accomplie dont les locuteurs affirment la validité présente.
- source_word: ὁ θεός
  choice: Dieu
  rationale: Désignation française directe et usuelle, sans ajout interprétatif.
- source_word: τοῦτον δὲ
  choice: Mais celui-ci
  rationale: Cette formulation marque à la fois le contraste, le changement de thème et la distance méprisante des locuteurs, sans ajouter un qualificatif absent du grec.
- source_word: οὐκ οἴδαμεν
  choice: nous ne savons pas
  rationale: La répétition de « savons » reproduit le contraste rhétorique avec la première proposition.
- source_word: πόθεν ἐστίν
  choice: d’où il vient
  rationale: Cette expression française naturelle porte sur la provenance ou l’origine et préserve la possibilité d’un sens à la fois ordinaire et plus profond.
theological_decisions:
- issue: La portée de l’origine de Jésus dans πόθεν ἐστίν
  choice: d’où il vient
  alternative: quelle est son origine
  rationale: La formulation retenue ne tranche pas entre une provenance géographique, l’origine de l’autorité de Jésus et la portée théologique plus profonde que cette question peut recevoir dans l’Évangile selon Jean. Elle conserve ainsi l’ironie narrative et la tension du texte.
translation_notes:
  register: Français international moderne, naturel et digne. La reprise de « nous savons » maintient l’assurance polémique des locuteurs ; « celui-ci » conserve leur ton de mise à distance.
