id: JHN.9.1
reference: John 9:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ παράγων εἶδεν ἄνθρωπον τυφλὸν ἐκ γενετῆς.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/001.yaml
  text: And as he was passing by[a], he saw a man blind from birth.
translation:
  language: fr
  text: En passant[a], Jésus vit un homme aveugle de naissance.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Comme il passait par là » ; le participe grec présente Jésus en train de poursuivre son chemin lorsqu’il vit l’homme.'
    reason: alternative_lexicale
lexical_decisions:
- source_word: Καὶ
  choice: En passant
  rationale: Le lien narratif est naturellement intégré à la construction participiale française; ajouter « Et » alourdirait inutilement la phrase sans perdre la continuité avec le contexte.
- source_word: παράγων
  choice: En passant
  rationale: Le participe présent grec décrit l'action en cours au moment où Jésus voit l'homme. « En passant » est idiomatique et conserve cette simultanéité.
- source_word: εἶδεν
  choice: vit
  rationale: L'aoriste de ὁράω exprime simplement le fait de voir; « vit » n'ajoute pas la nuance interprétative de « remarqua ».
- source_word: ἄνθρωπον
  choice: un homme
  rationale: Dans ce récit, le terme désigne un individu précis présenté comme masculin; « un homme » correspond naturellement au grec et au contexte.
- source_word: τυφλὸν
  choice: aveugle
  rationale: L'adjectif qualifie directement l'homme et se rend naturellement en français par « un homme aveugle ».
- source_word: ἐκ γενετῆς
  choice: de naissance
  rationale: Expression française courante et précise pour indiquer que la cécité existait depuis la naissance.
theological_decisions:
- issue: Rendu genré de ἄνθρωπον
  choice: un homme
  alternative: une personne
  rationale: Bien que ἄνθρωπος puisse avoir un sens générique, il désigne ici un individu masculin précis dans le récit. « Un homme » préserve cette donnée contextuelle sans généralisation.
- issue: Sujet implicite de παράγων et εἶδεν
  choice: Jésus
  alternative: il
  rationale: Le grec laisse le sujet implicite, repris du contexte antérieur. En français, nommer Jésus rend le verset autonome et clair sans modifier l'identité du sujet établie par le récit.
translation_notes:
  register: Français international moderne, simple et digne. La tournure concise « En passant » maintient le mouvement narratif; le nom « Jésus » explicite en français le sujet sous-entendu par le grec et fourni par le contexte.
