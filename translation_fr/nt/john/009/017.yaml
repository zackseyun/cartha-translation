  variant: modern international French
source:
  edition: SBLGNT
  text: λέγουσιν ⸀οὖν τῷ τυφλῷ πάλιν· ⸂Τί σὺ⸃ λέγεις περὶ αὐτοῦ, ὅτι ἠνέῳξέν σου τοὺς ὀφθαλμούς; ὁ δὲ εἶπεν ὅτι Προφήτης ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/017.yaml
  text: So they said again to the blind man[a], “What do you say about him, since he opened your eyes?” And he said[c][b], “He is a prophet.”
translation:
  language: fr
  text: 'Ils dirent donc de nouveau à l’aveugle : « Et toi, que dis-tu de lui, puisqu’il t’a ouvert les yeux ? » Il répondit : « C’est un prophète. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  choice: donc
  rationale: Marque la progression logique et narrative par rapport à l’échange précédent, sans alourdir le français.
- source_word: τῷ τυφλῷ
  choice: à l’aveugle
  rationale: L’adjectif grec est substantivé. Cette formulation concise conserve la manière dont les interlocuteurs désignent l’homme dans la scène.
- source_word: πάλιν
  choice: de nouveau
  rationale: Conserve l’idée de reprise dans l’interrogatoire en cours.
- source_word: Τί σὺ λέγεις
  choice: Et toi, que dis-tu
  rationale: La dislocation naturelle « Et toi » rend explicitement l’accent porté par le pronom grec σὺ, sans recourir à une note.
- source_word: περὶ αὐτοῦ
  choice: de lui
  rationale: Équivalent français courant de περί avec le génitif dans une question portant sur l’opinion de quelqu’un.
- source_word: ὅτι
  choice: puisque
  rationale: Introduit naturellement le fait qui motive la question. Le lien causal demeure perceptible sans imposer une nuance polémique.
- source_word: ἠνέῳξέν σου τοὺς ὀφθαλμούς
  choice: il t’a ouvert les yeux
  rationale: Le passé composé convient au français narratif et souligne le résultat encore pertinent de l’acte accompli.
- source_word: Προφήτης ἐστίν
  choice: C’est un prophète
  rationale: Rend naturellement le prédicat nominal sans article. Le nom commun indéfini convient au jugement progressif de l’homme sur Jésus et n’impose pas un titre déterminé.
theological_decisions:
- issue: 'Valeur de Προφήτης : nom commun indéfini ou titre'
  choice: un prophète
  alternative: le Prophète / Prophète
  rationale: Le contexte rapporte l’évaluation encore progressive de l’homme guéri. Le grec permet ici naturellement une lecture qualitative ou indéfinie ; traduire par un titre précis risquerait d’introduire une identification messianique que le verset n’explicite pas.
translation_notes:
  register: Français moderne, international et digne. « Et toi » restitue dans le corps du texte l’emphase du pronom grec. Le dialogue reste direct et accessible ; aucune note n’est nécessaire.
