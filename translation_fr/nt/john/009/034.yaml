source:
  edition: SBLGNT
  text: ἀπεκρίθησαν καὶ εἶπαν αὐτῷ· Ἐν ἁμαρτίαις σὺ ἐγεννήθης ὅλος, καὶ σὺ διδάσκεις ἡμᾶς; καὶ ἐξέβαλον αὐτὸν ἔξω.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/034.yaml
  text: They answered and said to him[a], “You were born entirely in sins[c][b], and are you teaching us?” And they cast him out.
translation:
  language: fr
  text: 'Ils lui répondirent : « Tu es né tout entier dans les péchés, et c’est toi qui nous enseignes ? » Et ils le chassèrent dehors.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ils le mirent dehors ». Dans ce contexte, cette expulsion peut aussi impliquer son exclusion de la communauté de la synagogue.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθησαν καὶ εἶπαν αὐτῷ
  choice: Ils lui répondirent
  rationale: En français naturel, « répondre » exprime à lui seul la formule narrative grecque à deux verbes; « ils répondirent et lui dirent » serait inutilement lourd.
- source_word: Ἐν ἁμαρτίαις
  choice: dans les péchés
  rationale: Le pluriel grec est conservé afin de ne pas atténuer l’accusation en la transformant en une affirmation doctrinale générale sur « le péché ».
- source_word: ἐγεννήθης ὅλος
  choice: Tu es né tout entier
  rationale: « Tout entier » rend la valeur intensive de ὅλος et fait porter l’insulte sur l’état de l’homme depuis sa naissance.
- source_word: καὶ σὺ διδάσκεις ἡμᾶς;
  choice: et c’est toi qui nous enseignes ?
  rationale: La tournure clivée rend naturellement l’emphase de σὺ ainsi que l’indignation méprisante de la question.
- source_word: ἐξέβαλον αὐτὸν ἔξω
  choice: ils le mirent dehors
  rationale: Cette expression française actuelle restitue l’expulsion hostile sans préciser au-delà du grec s’il s’agit seulement de le chasser de leur présence ou de l’exclure de la communauté.
theological_decisions:
- issue: Sens de l’accusation selon laquelle l’homme est né « dans les péchés »
  choice: Conserver le pluriel et la formulation accusatrice sans expliquer de quels péchés il s’agit
  alternative: « Tu es né dans le péché » ou « Tu es né entièrement pécheur »
  rationale: Les accusateurs associent sa condition de naissance aux péchés, mais le texte ne précise ni culpabilité personnelle prénatale, ni péché hérité, ni faute parentale. La traduction maintient cette tension.
- issue: Portée de l’expulsion
  choice: « ils le mirent dehors », avec une note signalant la possible portée communautaire
  alternative: « ils l’exclurent de la synagogue »
  rationale: Le verbe et l’adverbe décrivent directement une mise dehors; le contexte peut suggérer une exclusion plus large, mais l’énoncer dans le corps du texte lèverait une ambiguïté réelle.
translation_notes:
  register: Français moderne, digne et direct. La question clivée conserve le mépris des interlocuteurs; le pluriel inhabituel « dans les péchés » est volontairement maintenu pour rester proche de l’accusation grecque.
