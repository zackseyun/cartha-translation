  yaml_path: translation/nt/john/009/012.yaml
  text: And they said to him[a], “Where is that man?” He says, “I do not know.”
translation:
  language: fr
  text: 'Et ils lui dirent : « Où est cet homme[a] ? » Il dit : « Je ne sais pas. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Où est-il ? » Le grec emploie « celui-là », un démonstratif que l’on peut traduire plus littéralement, mais de façon moins naturelle, par « Où est celui-là ? »'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Et
  rationale: Conserve la coordination simple avec le récit précédent sans lui ajouter une valeur causale ou temporelle.
- source_word: εἶπαν αὐτῷ
  choice: ils lui dirent
  rationale: Rend directement le verbe λέγω et son complément au datif. Même si les paroles prononcées constituent une question, « dirent » évite de préciser davantage que le grec.
- source_word: Ποῦ ἐστιν ἐκεῖνος
  choice: Où est cet homme ?
  rationale: « Où » rend l’adverbe interrogatif Ποῦ. Le démonstratif substantivé ἐκεῖνος marque une certaine distance; « cet homme » en restitue naturellement la force en français dans ce contexte.
- source_word: λέγει
  choice: Il répond
  rationale: Le présent conserve la vivacité du présent historique grec. Dans cet échange, « répond » est plus naturel en français que « dit » tout en décrivant fidèlement la fonction de la réplique.
- source_word: Οὐκ οἶδα
  choice: Je ne sais pas
  rationale: Formulation française directe, courante et digne, correspondant exactement à la négation et au verbe grec.
theological_decisions: []
translation_notes:
  register: Français international moderne, simple et digne. Le présent « Il répond » maintient la vivacité narrative du présent historique grec; « cet homme » exprime naturellement la valeur démonstrative de ἐκεῖνος.
