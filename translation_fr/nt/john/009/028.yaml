id: JHN.9.28
reference: John 9:28
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸀ἐλοιδόρησαν αὐτὸν καὶ εἶπον· Σὺ ⸂μαθητὴς εἶ⸃ ἐκείνου, ἡμεῖς δὲ τοῦ Μωϋσέως ἐσμὲν μαθηταί·
base_translation:
  language: en
  yaml_path: translation/nt/john/009/028.yaml
  text: They reviled him and said[a], “You are that man's disciple, but we are disciples of Moses.”
translation:
  language: fr
  text: 'Ils l’injurièrent et lui dirent : « Toi, tu es disciple de cet homme-là[a] ; nous, nous sommes disciples de Moïse. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « tu es son disciple ». Le grec dit littéralement « de celui-là », expression qui peut avoir ici une nuance de mépris.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλοιδόρησαν
  choice: Ils l’injurièrent
  rationale: Le verbe λοιδορέω désigne des paroles outrageantes ou injurieuses. « Injurier » conserve la force de l’hostilité verbale sans ajouter l’idée d’une violence physique.
- source_word: αὐτὸν
  choice: l’
  rationale: Le pronom renvoie à l’homme qui avait été guéri et fonctionne comme complément direct d’« injurièrent ».
- source_word: καὶ εἶπον
  choice: et lui dirent
  rationale: Le complément indirect, naturel en français avec « dire », explicite sans ambiguïté que les paroles lui sont adressées.
- source_word: Σὺ
  choice: Toi, tu
  rationale: Le pronom grec placé en tête est emphatique. La dislocation française « Toi, tu » en restitue naturellement l’insistance polémique.
- source_word: μαθητὴς / μαθηταί
  choice: disciple / disciples
  rationale: « Disciple » exprime ici l’attachement à un maître, et pas seulement une relation d’apprentissage. Le même terme dans les deux propositions préserve le contraste rhétorique.
- source_word: ἐκείνου
  choice: de cet homme-là
  rationale: Le démonstratif marque une certaine distance et, dans ce contexte hostile, peut avoir une nuance méprisante. « Cet homme-là » rend cette distance en français courant sans la renforcer excessivement.
- source_word: ἡμεῖς δὲ
  choice: nous, nous
  rationale: La reprise du pronom met en relief le groupe des interlocuteurs et fait entendre le contraste porté par δέ. Le point-virgule suffit à marquer l’opposition en français.
- source_word: τοῦ Μωϋσέως
  choice: de Moïse
  rationale: Le génitif indique la relation des disciples à leur maître. « Disciples de Moïse » est la formulation française habituelle et transparente.
- source_word: ἐσμὲν μαθηταί
  choice: nous sommes disciples
  rationale: La structure copulative est conservée, avec une formulation naturelle qui n’introduit pas l’idée qu’ils seraient les seuls disciples de Moïse.
theological_decisions:
- issue: Nuance de ἐκείνου lorsqu’il désigne Jésus
  choice: « cet homme-là » pour conserver la distance hostile des locuteurs
  alternative: « lui » ou « celui-là », plus neutres ou moins idiomatiques
  rationale: Le contexte immédiat est celui d’injures et d’une opposition entre l’attachement à Jésus et celui revendiqué envers Moïse. La traduction garde la nuance potentiellement méprisante du démonstratif sans ajouter une qualification absente du grec.
- issue: Parallélisme autour de μαθητής
  choice: Employer « disciple » dans les deux membres de la phrase
  alternative: Employer « partisan », « élève » ou « adepte »
  rationale: « Disciple » maintient la tension du texte entre deux allégeances revendiquées et ne réduit pas μαθητής à une simple relation scolaire.
translation_notes:
  register: Français international actuel, digne et accessible. « Toi, tu » et « nous, nous » rendent l’emphase des pronoms grecs et le contraste polémique. « Injurier » conserve la gravité de l’attaque verbale, tandis que « cet homme-là » fait entendre la distance hostile sans recourir à une expression familière comme « ce type-là ».
