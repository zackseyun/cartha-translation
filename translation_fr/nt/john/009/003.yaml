id: JHN.9.3
reference: John 9:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς· Οὔτε οὗτος ἥμαρτεν οὔτε οἱ γονεῖς αὐτοῦ, ἀλλ’ ἵνα φανερωθῇ τὰ ἔργα τοῦ θεοῦ ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/003.yaml
  text: Jesus answered[a], “Neither this man sinned, nor his parents[c][b], but so that the works of God might be revealed in him.”
translation:
  language: fr
  text: 'Jésus répondit : « Ni lui ni ses parents n’ont péché, mais c’est afin que les œuvres de Dieu soient manifestées en lui[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « par son intermédiaire ». Le grec dit littéralement « en lui » et peut désigner la personne en qui, ou par l’intermédiaire de qui, les œuvres de Dieu deviennent manifestes.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: répondit
  rationale: Équivalent narratif courant et direct dans un dialogue.
- source_word: Οὔτε ... οὔτε
  choice: Ni… ni…
  rationale: Cette construction corrélative rend naturellement en français la double négation emphatique du grec.
- source_word: οὗτος
  choice: lui
  rationale: Le référent, l’homme aveugle de naissance, est clair dans le contexte ; « lui » est naturel en français sans ajouter d’information.
- source_word: ἥμαρτεν
  choice: ont péché
  rationale: Le passé composé exprime naturellement en français l’aoriste de ἁμαρτάνω dans cette réponse portant sur la cause supposée de la cécité.
- source_word: γονεῖς
  choice: parents
  rationale: Équivalent précis et idiomatique du pluriel γονεῖς.
- source_word: ἀλλ’ ἵνα
  choice: mais c’est afin que
  rationale: Le grec passe abruptement des causes rejetées à une proposition de finalité. L’ajout minimal de « c’est » produit une phrase française intelligible tout en conservant la visée exprimée par ἵνα.
- source_word: φανερωθῇ
  choice: soient manifestées
  rationale: Ce choix conserve la voix passive et l’idée que les œuvres deviennent visibles ou reconnaissables.
- source_word: τὰ ἔργα τοῦ θεοῦ
  choice: les œuvres de Dieu
  rationale: Formulation transparente qui préserve le vocabulaire johannique et la construction génitive.
- source_word: ἐν αὐτῷ
  choice: en lui
  rationale: Rendu le plus direct de ἐν avec le datif, sans trancher en faveur d’une interprétation instrumentale.
theological_decisions:
- issue: Portée du refus d’un lien entre le péché et la cécité de cet homme
  choice: La traduction nie les deux causes proposées dans ce cas précis, sans formuler de règle universelle sur tout péché et toute souffrance.
  alternative: Paraphraser le verset comme une négation générale de tout lien entre péché et souffrance.
  rationale: Jésus répond à la question précise des disciples concernant cet homme et ses parents ; il ne convient pas d’élargir explicitement la portée de sa réponse.
- issue: 'Valeur de ἵνα : finalité ou simple résultat'
  choice: 'Employer une formulation de finalité : « afin que ».'
  alternative: Employer une formulation de simple résultat, ou modifier la ponctuation pour détacher cette finalité de la cécité.
  rationale: La lecture finale de ἵνα avec le subjonctif est la plus directe. La traduction conserve ainsi la tension théologique du texte sans expliquer davantage l’action de Dieu.
translation_notes:
  register: Français international actuel, digne et accessible. La formulation garde le contraste abrupt du grec, tout en ajoutant le minimal « c’est » requis pour une syntaxe française naturelle. Le vocabulaire « œuvres de Dieu » et « manifestées » préserve la tonalité johannique.
