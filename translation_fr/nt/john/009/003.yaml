  terminology: « Jésus répondit », « péché », « parents », « œuvres de Dieu » et « manifestées » sont précis, cohérents et adaptés à un français international moderne. La note sur « en lui » signale adéquatement la possible nuance instrumentale sans la substituer au sens premier.
