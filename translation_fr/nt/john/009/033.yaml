  source_fidelity: 'Le texte rend fidèlement la construction grecque εἰ μὴ ... οὐκ ἠδύνατο : « Si cet homme ne venait pas de Dieu, il ne pourrait rien faire. » Le couple imparfait/conditionnel français exprime de manière appropriée le raisonnement hypothétique à portée contraire au fait. « Venait de Dieu » restitue naturellement παρὰ θεοῦ comme expression de provenance, sans ajouter l’idée plus précise d’envoi ou d’autorisation. « Ne pourrait rien faire » rend clairement l’incapacité totale de οὐκ ἠδύνατο ποιεῖν οὐδέν.'
  naturalness: La formulation est naturelle, claire et d’un registre moderne international. « Cet homme » convient au démonstratif personnel οὗτος dans ce contexte. La phrase est fluide et conserve la sobriété argumentative de l’original.
  terminology: « Dieu », « cet homme », « venir de Dieu » et « faire » sont appropriés et cohérents avec la portée non technique du grec. La traduction ne surinterprète pas la relation de Jésus à Dieu. L’ancre de note et la note sont correctement placées et l’alternative « à moins que » est recevable.
