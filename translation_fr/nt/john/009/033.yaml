id: JHN.9.33
reference: John 9:33
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἰ μὴ ἦν οὗτος παρὰ θεοῦ, οὐκ ἠδύνατο ποιεῖν οὐδέν.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/033.yaml
  text: If this man were not from God[a], he could do nothing.
translation:
  language: fr
  text: Si cet homme ne venait pas de Dieu[a], il ne pourrait rien faire.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « À moins que cet homme ne vienne de Dieu, il ne pourrait rien faire. »'
    reason: εἰ μή peut aussi se rendre par « à moins que », bien que « si… ne… pas » restitue plus directement ici la condition contraire au fait.
lexical_decisions:
- source_word: εἰ μὴ
  choice: si… ne… pas
  rationale: Avec les imparfaits ἦν et ἠδύνατο, cette tournure exprime naturellement en français une condition contraire au fait, tout en conservant la structure conditionnelle du grec.
- source_word: ἦν
  choice: venait
  rationale: Dans l’expression παρὰ θεοῦ, « venait de Dieu » rend de façon naturelle l’idée de provenance. L’imparfait convient à la protase française introduite par « si ».
- source_word: οὗτος
  choice: cet homme
  rationale: Le démonstratif désigne ici Jésus, un homme déjà au centre de la discussion. « Cet homme » est clair et idiomatique.
- source_word: παρὰ θεοῦ
  choice: de Dieu
  rationale: παρά avec le génitif marque ici la provenance ou l’origine. « Venir de Dieu » préserve cette portée sans préciser davantage qu’il serait « envoyé » ou « autorisé » par Dieu.
- source_word: οὐκ ἠδύνατο
  choice: il ne pourrait
  rationale: Le conditionnel présent français rend naturellement l’incapacité envisagée dans cette construction irréelle.
- source_word: ποιεῖν
  choice: faire
  rationale: Le verbe a ici un sens général. « Faire » reste naturel et n’explicite pas les actes comme des miracles au-delà de ce que dit la proposition.
- source_word: οὐδέν
  choice: rien
  rationale: Avec la négation, « ne… rien » exprime clairement l’incapacité totale indiquée par le grec.
theological_decisions:
- issue: Portée de « de Dieu » à propos de Jésus
  choice: Conserver l’idée générale de provenance avec « venait de Dieu ».
  alternative: « était envoyé par Dieu » ou « était autorisé par Dieu »
  rationale: Le texte rattache Jésus et sa capacité d’agir à Dieu, mais παρὰ θεοῦ ne définit pas ici avec plus de précision la nature de cette relation. La traduction évite donc d’ajouter une formulation doctrinale plus étroite.
translation_notes:
  register: Français international moderne, simple et digne. La construction « si + imparfait / conditionnel présent » est naturelle et rend clairement le raisonnement hypothétique.
