source:
  edition: SBLGNT
  text: πῶς δὲ νῦν βλέπει οὐκ οἴδαμεν, ἢ τίς ἤνοιξεν αὐτοῦ τοὺς ὀφθαλμοὺς ἡμεῖς οὐκ οἴδαμεν· ⸂αὐτὸν ἐρωτήσατε, ἡλικίαν ἔχει⸃, αὐτὸς περὶ ἑαυτοῦ λαλήσει.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/021.yaml
  text: But how he now sees[a], we do not know; or who opened his eyes, we do not know. Ask him; he is of age. He will speak for himself.
translation:
  language: fr
  text: 'Mais comment il voit maintenant, nous ne le savons pas ; ou qui lui a ouvert les yeux, nous ne le savons pas. Interrogez-le : il est en âge de répondre. Il parlera lui-même de ce qui le concerne.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Il peut répondre lui-même. » Le futur grec peut exprimer ici, de manière pratique, sa capacité ou sa responsabilité de répondre.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πῶς δὲ νῦν βλέπει
  choice: Mais comment il voit maintenant
  rationale: Rend directement πῶς (« comment »), δέ (« mais »), νῦν (« maintenant ») et le présent βλέπει (« il voit »), sans transformer explicitement la vue en capacité.
- source_word: οὐκ οἴδαμεν
  choice: nous ne le savons pas
  rationale: Traduction naturelle de οὐκ οἴδαμεν ; la répétition grecque est conservée pour maintenir l’insistance du témoignage.
- source_word: ἢ τίς ἤνοιξεν αὐτοῦ τοὺς ὀφθαλμούς
  choice: et qui lui a ouvert les yeux
  rationale: Dans la suite de la phrase française, « et qui » introduit naturellement le second objet de leur ignorance. « Ouvrir les yeux » conserve l’image et le vocabulaire récurrent du récit.
- source_word: αὐτὸν ἐρωτήσατε
  choice: Interrogez-le
  rationale: L’impératif aoriste pluriel appelle les interlocuteurs à s’adresser directement au fils. « Interrogez-le » convient au contexte d’un questionnement officiel tout en restant courant.
- source_word: ἡλικίαν ἔχει
  choice: il est en âge de répondre
  rationale: Le contexte indique qu’il a l’âge requis pour répondre en son propre nom. L’ajout « de répondre » explicite en français la valeur contextuelle de l’expression sans préciser un âge légal non donné par le texte.
- source_word: αὐτὸς περὶ ἑαυτοῦ λαλήσει
  choice: Il parlera lui-même de ce qui le concerne
  rationale: Cette formulation conserve le futur λαλήσει, l’emphase de αὐτός et le sens de περὶ ἑαυτοῦ, tout en évitant de réduire le futur à une simple expression de capacité.
theological_decisions:
- issue: Sens de ἡλικίαν ἔχει
  choice: Il a l’âge suffisant pour répondre indépendamment
  alternative: Il est simplement mûr, ou il a atteint une certaine stature physique
  rationale: Le contexte porte sur sa capacité reconnue à répondre personnellement aux autorités. La stature physique est lexicalement possible dans d’autres contextes, mais peu probable ici.
- issue: Valeur de αὐτὸς περὶ ἑαυτοῦ λαλήσει
  choice: 'Conserver une déclaration au futur : « Il parlera lui-même de ce qui le concerne »'
  alternative: « Il peut répondre lui-même »
  rationale: Le futur grec peut avoir une portée pratique proche de la capacité ou de la responsabilité, mais sa forme demeure un futur. Le texte principal la préserve et la note signale l’autre nuance possible.
translation_notes:
  register: Français international moderne, naturel et digne. La répétition de « nous ne le savons pas » respecte l’insistance de l’original. « Il est en âge de répondre » est plus transparent pour un lectorat général que l’idiome isolé « il est majeur », qui pourrait introduire une catégorie juridique moderne trop précise.
