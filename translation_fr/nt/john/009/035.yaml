source:
  edition: SBLGNT
  text: ⸀Ἤκουσεν Ἰησοῦς ὅτι ἐξέβαλον αὐτὸν ἔξω, καὶ εὑρὼν αὐτὸν ⸀εἶπεν· Σὺ πιστεύεις εἰς τὸν υἱὸν τοῦ ⸀ἀνθρώπου;
base_translation:
  language: en
  yaml_path: translation/nt/john/009/035.yaml
  text: Jesus heard that they had thrown him out[a], and when he found him, he said, “Do you believe in the Son of Man?”
translation:
  language: fr
  text: 'Jésus apprit qu’ils l’avaient chassé. Après l’avoir trouvé, il lui dit : « Toi, crois-tu au Fils de l’homme[a] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Certains manuscrits portent « le Fils de Dieu » au lieu de « le Fils de l’homme ».
    reason: textual_variant
lexical_decisions:
- source_word: ἐξέβαλον αὐτὸν ἔξω
  choice: ils l’avaient chassé
  rationale: La combinaison emphatique de ἐκβάλλω avec ἔξω exprime une expulsion. « Chassé » restitue naturellement en français la force du geste et l’exclusion sociale suggérée par le contexte.
- source_word: εὑρὼν αὐτὸν
  choice: Après l’avoir trouvé
  rationale: Le participe aoriste marque ici naturellement une action antérieure à la parole de Jésus. Cette formulation française rend clairement la succession des actions.
- source_word: Σὺ πιστεύεις
  choice: Crois-tu
  rationale: πιστεύω signifie ici croire en quelqu’un, avec l’idée de confiance. La tournure interrogative directe est naturelle en français; la présence explicite de Σὺ donne une légère insistance à l’interpellation sans exiger une construction lourde.
- source_word: πιστεύεις εἰς
  choice: crois-tu au
  rationale: Avec πιστεύω, εἰς désigne la foi ou la confiance dirigée vers une personne. « Croire au Fils de l’homme » est la formulation française consacrée et intelligible dans ce contexte.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: le Fils de l’homme
  rationale: Cette traduction reconnue conserve la valeur de titre ainsi que les résonances intertextuelles de l’expression, notamment avec Daniel 7 et son emploi dans l’Évangile selon Jean.
theological_decisions:
- issue: Le titre christologique dans la question
  choice: le Fils de l’homme
  alternative: le Fils de Dieu
  rationale: Le texte principal du SBLGNT porte ἀνθρώπου (« homme »). La variante « Dieu », importante dans l’histoire du texte et sur le plan christologique, est signalée en note sans remplacer la leçon retenue dans le texte principal.
translation_notes:
  register: Français international moderne, digne et accessible. « Chassé » garde la vigueur de l’expulsion; « Après l’avoir trouvé » évite la raideur d’un participe présent. Le marqueur de note est placé après le titre concerné par la variante textuelle.
