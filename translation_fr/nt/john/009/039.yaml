id: JHN.9.39
reference: John 9:39
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ εἶπεν ὁ Ἰησοῦς· Εἰς κρίμα ἐγὼ εἰς τὸν κόσμον τοῦτον ἦλθον, ἵνα οἱ μὴ βλέποντες βλέπωσιν καὶ οἱ βλέποντες τυφλοὶ γένωνται.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/039.yaml
  text: And Jesus said[a], “For judgment I came into this world, so that those who do not see may see, and those who see may become blind.”
translation:
  language: fr
  text: 'Et Jésus dit : « C’est pour un jugement[a] que je suis venu dans ce monde, afin que ceux qui ne voient pas voient, et que ceux qui voient deviennent aveugles. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « pour le jugement ». Le grec peut mettre l’accent sur l’effet judiciaire de la venue de Jésus, et pas seulement sur la condamnation.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κρίμα
  choice: un jugement
  rationale: Le nom κρίμα désigne ici l’effet judiciaire ou discriminant de la venue de Jésus. « Un jugement » garde la concision du grec sans réduire le propos à la seule condamnation.
- source_word: κόσμον
  choice: monde
  rationale: « Monde » est l’équivalent français naturel de κόσμος et convient à l’usage johannique pour le monde humain dans lequel Jésus vient.
- source_word: οἱ μὴ βλέποντες / οἱ βλέποντες
  choice: ceux qui ne voient pas / ceux qui voient
  rationale: Cette formulation conserve le parallélisme des participes substantivés ainsi que l’ambiguïté entre vue physique et perception spirituelle.
- source_word: βλέπωσιν
  choice: voient
  rationale: Le présent du subjonctif après ἵνα est rendu naturellement après « afin que » et maintient ensemble les sens physique et spirituel.
- source_word: τυφλοὶ γένωνται
  choice: deviennent aveugles
  rationale: « Deviennent » exprime la valeur résultative de γένωνται, tandis qu’« aveugles » préserve la force abrupte de l’adjectif prédicatif.
- source_word: εἰς τὸν κόσμον τοῦτον ἦλθον
  choice: je suis venu dans ce monde
  rationale: Cette tournure française naturelle restitue le mouvement exprimé par εἰς avec ἔρχομαι et conserve le langage johannique de la venue de Jésus.
theological_decisions:
- issue: Rapport avec Jean 3.17, où le Fils n’est pas envoyé pour juger le monde
  choice: Conserver explicitement « jugement » et la tension entre les deux passages.
  alternative: Paraphraser par « provoquer une séparation » ou employer « condamnation ».
  rationale: 'Le verset présente la venue de Jésus comme produisant un renversement judiciaire : ceux qui ne voient pas voient, tandis que ceux qui voient deviennent aveugles. La traduction ne doit ni harmoniser cette affirmation avec Jean 3.17 ni limiter κρίμα à une condamnation punitive.'
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme et l’ambiguïté entre vision physique et spirituelle sont conservés. La ponctuation rend clairement la parole directe sans alourdir la phrase.
