  text: ἔλεγον οὖν αὐτῷ· ⸀Πῶς ἠνεῴχθησάν σου οἱ ὀφθαλμοί;
base_translation:
  language: en
  yaml_path: translation/nt/john/009/010.yaml
  text: So they said to him[a], “How were your eyes opened?”
translation:
  language: fr
  text: 'Ils lui demandaient donc : « Comment tes yeux ont-ils été ouverts[a] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec emploie une forme passive.
    reason: grammatical_note
lexical_decisions:
- source_word: ἔλεγον
  choice: demandaient
  rationale: L’imparfait grec présente une parole en cours ou répétée. En français, « demandaient » rend naturellement cet aspect dans le récit et convient à la forme interrogative qui suit.
- source_word: οὖν
  choice: donc
  rationale: « Donc » conserve la valeur de liaison ou de conséquence de οὖν, en reliant la question à ce qui précède.
- source_word: αὐτῷ
  choice: lui
  rationale: Le pronom complément indirect « lui » rend directement le datif αὐτῷ.
- source_word: Πῶς
  choice: Comment
  rationale: « Comment » est l’équivalent français naturel de l’adverbe interrogatif portant sur la manière.
- source_word: ἠνεῴχθησάν
  choice: ont-ils été ouverts
  rationale: Le passé composé passif rend l’aoriste passif de manière idiomatique dans un récit français au passé composé, sans désigner l’agent de l’ouverture.
- source_word: σου
  choice: tes
  rationale: Le déterminant possessif « tes » exprime naturellement le génitif de la deuxième personne du singulier.
- source_word: οἱ ὀφθαλμοί
  choice: yeux
  rationale: « Yeux » est l’équivalent courant de ὀφθαλμοί ; l’article grec est naturellement absorbé par le possessif français « tes ».
theological_decisions:
- issue: Agent non exprimé de l’ouverture des yeux
  choice: 'Maintien du passif : « ont-ils été ouverts »'
  alternative: « Comment as-tu recouvré la vue ? »
  rationale: Le grec ne nomme pas l’agent. Le passif préserve cette indétermination et évite d’attribuer explicitement l’action soit à Jésus, soit à l’homme.
translation_notes:
  register: Français moderne, clair et digne. L’imparfait « demandaient » préserve l’aspect de ἔλεγον, tandis que le passé composé passif dans la question reste naturel à l’oral comme à l’écrit. Le tutoiement correspond au singulier σου et au dialogue direct.
