id: JHN.9.16
reference: John 9:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἔλεγον οὖν ἐκ τῶν Φαρισαίων τινές· ⸂Οὐκ ἔστιν οὗτος παρὰ θεοῦ ὁ ἄνθρωπος⸃, ὅτι τὸ σάββατον οὐ τηρεῖ. ⸀ἄλλοι ἔλεγον· Πῶς δύναται ἄνθρωπος ἁμαρτωλὸς τοιαῦτα σημεῖα ποιεῖν; καὶ σχίσμα ἦν ἐν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/016.yaml
  text: So some of the Pharisees were saying[a], “This man is not from God, because he does not keep the Sabbath.” But others were saying[b], “How can a sinful man do such signs?” And there was a division among them.
translation:
  language: fr
  text: 'Alors, certains des pharisiens disaient : « Cet homme ne vient pas de Dieu, puisqu’il n’observe pas le sabbat. » Mais d’autres disaient : « Comment un homme pécheur peut-il accomplir de tels signes[a] ? » Et il y avait une division parmi eux.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de tels signes miraculeux ». Dans l’Évangile selon Jean, les « signes » sont des actes qui révèlent qui est Jésus.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγον ... τινές
  choice: certains ... disaient
  rationale: L’imparfait « disaient » rend l’aspect duratif de ἔλεγον dans la scène, tandis que « certains » traduit naturellement τινές.
- source_word: οὖν
  choice: Alors
  rationale: Le connecteur poursuit le récit avec une nuance de conséquence; « alors » est naturel en français et évite la lourdeur de « donc » en tête de phrase.
- source_word: ἐκ τῶν Φαρισαίων
  choice: certains des pharisiens
  rationale: Cette tournure idiomatique désigne le sous-groupe issu des pharisiens sans calquer maladroitement « parmi ».
- source_word: οὗτος ... ὁ ἄνθρωπος
  choice: Cet homme
  rationale: La traduction conserve le démonstratif et la référence masculine explicite, sans accentuer artificiellement le mépris.
- source_word: παρὰ θεοῦ
  choice: vient de Dieu
  rationale: Avec le verbe français nécessaire à une phrase naturelle, cette formulation exprime l’origine ou l’autorisation divine sans ajouter l’idée plus précise d’un envoi.
- source_word: τηρεῖ
  choice: observe
  rationale: « Observer le sabbat » est l’expression française courante pour respecter cette prescription religieuse.
- source_word: τὸ σάββατον
  choice: le sabbat
  rationale: Terme français standard et précis pour le jour juif de repos.
- source_word: ἄλλοι
  choice: d’autres
  rationale: Rend simplement et naturellement le groupe opposé.
- source_word: Πῶς δύναται
  choice: Comment ... peut-il
  rationale: Cette interrogation idiomatique conserve la notion de possibilité ou de capacité.
- source_word: ἄνθρωπος ἁμαρτωλὸς
  choice: un homme pécheur
  rationale: Conserve la construction adjectivale grecque et son accusation morale, plutôt que de la restructurer en « un pécheur ».
- source_word: τοιαῦτα σημεῖα
  choice: de tels signes
  rationale: « Signes » maintient le vocabulaire johannique et sa portée révélatrice; « de tels » rend τοιαῦτα.
- source_word: σχίσμα
  choice: division
  rationale: Le mot exprime clairement la fracture du groupe et correspond au registre digne du passage.
theological_decisions:
- issue: Traduction du terme johannique σημεῖα
  choice: signes
  alternative: miracles / signes miraculeux
  rationale: Jean emploie régulièrement ce terme pour des actes dont la portée dépasse le prodige et révèle l’identité de Jésus. « Signes » préserve cette dimension sans explicitation ajoutée.
- issue: Affirmation concernant l’origine de Jésus
  choice: vient de Dieu
  alternative: est envoyé par Dieu
  rationale: La formulation garde l’ambiguïté entre origine et autorisation divines; « envoyé par Dieu » préciserait indûment le langage de mission.
translation_notes:
  register: Français international actuel, clair et digne. « Pharisiens » est écrit avec une minuscule conformément à l’usage typographique français pour les membres d’un groupe religieux. Le rythme des deux prises de parole et l’imparfait narratif sont conservés.
