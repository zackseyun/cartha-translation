id: JHN.9.31
reference: John 9:31
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸀οἴδαμεν ὅτι ⸂ἁμαρτωλῶν ὁ θεὸς⸃ οὐκ ἀκούει, ἀλλ’ ἐάν τις θεοσεβὴς ᾖ καὶ τὸ θέλημα αὐτοῦ ποιῇ τούτου ἀκούει.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/031.yaml
  text: We know that God does not listen to sinners; but if anyone is God-fearing and does his will[a], he listens to him.
translation:
  language: fr
  text: Nous savons que Dieu n’écoute pas les pécheurs ; mais si quelqu’un craint Dieu[a] et fait sa volonté, il l’écoute.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « adore Dieu ».'
    reason: Alternative lexicale possible pour θεοσεβής, qui peut désigner une personne révérant Dieu ou lui rendant un culte.
lexical_decisions:
- source_word: οἴδαμεν
  choice: Nous savons
  rationale: Le parfait οἶδα a ici un sens présent ; « nous savons » est l’équivalent français naturel.
- source_word: ἁμαρτωλῶν
  choice: les pécheurs
  rationale: Le génitif pluriel désigne la catégorie de personnes concernée. « Les pécheurs » conserve avec concision la portée morale et religieuse du terme.
- source_word: ἀκούει
  choice: écoute
  rationale: Avec une personne comme complément au génitif, ἀκούω évoque ici une écoute favorable, et non la simple perception auditive. « Écouter » préserve ce sens sans expliciter excessivement par « exaucer ».
- source_word: θεοσεβὴς
  choice: craint Dieu
  rationale: L’adjectif désigne une personne qui révère Dieu. La tournure verbale « craint Dieu » est naturelle en français biblique moderne, garde la référence explicite à Dieu et ne limite pas le sens au culte.
- source_word: τὸ θέλημα αὐτοῦ ποιῇ
  choice: fait sa volonté
  rationale: Cette formulation rend directement et naturellement l’expression idiomatique ποιεῖν τὸ θέλημα.
- source_word: τούτου ἀκούει
  choice: il l’écoute
  rationale: Le démonstratif τούτου reprend avec relief la personne qui craint Dieu et fait sa volonté. Le pronom « l’ » assure une reprise française fluide, tandis que la répétition d’« écoute » correspond à celle du grec.
- source_word: ἀλλ’ ἐάν τις
  choice: mais si quelqu’un
  rationale: Cette formulation conserve clairement le contraste et la condition indéfinie au singulier.
theological_decisions:
- issue: Portée de l’affirmation selon laquelle Dieu n’écoute pas les pécheurs
  choice: Conserver l’affirmation telle que le locuteur la formule, sans l’atténuer ni la transformer en proposition doctrinale générale.
  alternative: « Dieu n’exauce pas les prières des pécheurs » ou « Dieu n’approuve pas les pécheurs »
  rationale: Le grec dit simplement que Dieu n’« écoute » pas les pécheurs, par contraste avec la personne qui le révère et fait sa volonté. La traduction maintient cette tension sans préciser davantage le type de prière ni systématiser tous les sens possibles de l’écoute divine.
- issue: Sens de θεοσεβής
  choice: craint Dieu
  alternative: « adore Dieu » ou « révère Dieu »
  rationale: « Craint Dieu » exprime la révérence envers Dieu et reste intelligible dans ce contexte. La note conserve l’autre nuance possible, liée au culte rendu à Dieu.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase reste proche de la structure grecque tout en employant une syntaxe naturelle. « Écoute » est retenu plutôt qu’« exauce » afin de ne pas expliciter au-delà du texte ; « craint Dieu » exprime ici la révérence, non la terreur.
