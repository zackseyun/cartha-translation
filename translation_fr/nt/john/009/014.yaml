  text: ἦν δὲ σάββατον ⸂ἐν ᾗ ἡμέρᾳ⸃ τὸν πηλὸν ἐποίησεν ὁ Ἰησοῦς καὶ ἀνέῳξεν αὐτοῦ τοὺς ὀφθαλμούς.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/014.yaml
  text: It was a Sabbath on the day when Jesus made the mud and opened his eyes.
translation:
  language: fr
  text: C’était un jour de sabbat, le jour où[a] Jésus avait fait la boue[b] et lui avait ouvert les yeux[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Quelques manuscrits omettent « le jour où ».
    reason: textual_variant
  - marker: b
    text: Ou « l’argile ».
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « il ouvrit ses yeux » ; cette expression concrète désigne ici la guérison.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σάββατον
  choice: un jour de sabbat
  rationale: Cette formulation française naturelle exprime le sens calendaire du nom grec sans suggérer une interprétation de la controverse qui suit.
- source_word: ἐν ᾗ ἡμέρᾳ
  choice: le jour où
  rationale: Équivalent temporel idiomatique qui conserve la reprise du mot « jour » présente dans le grec.
- source_word: πηλός
  choice: boue
  rationale: Dans le contexte où de la salive est mêlée à de la terre, « boue » est le terme courant le plus naturel; « argile » reste possible.
- source_word: ἐποίησεν
  choice: avait fait
  rationale: Le plus-que-parfait situe naturellement cette action antérieure dans le récit; « faire » rend simplement ποιέω.
- source_word: ἀνέῳξεν
  choice: avait ouvert
  rationale: Le verbe concret « ouvrir » préserve l’expression johannique plutôt que de l’expliciter par « rendre la vue ».
- source_word: αὐτοῦ τοὺς ὀφθαλμούς
  choice: lui avait ouvert les yeux
  rationale: La construction française avec pronom indirect est naturelle et conserve la référence corporelle concrète aux yeux.
- source_word: δὲ
  choice: non exprimé séparément
  rationale: La légère transition narrative est suffisamment portée par l’enchaînement en français; « or » ou « mais » donnerait ici une nuance trop marquée.
theological_decisions:
- issue: La mention du sabbat en rapport avec la guérison accomplie par Jésus
  choice: Présenter simplement le repère temporel et les actes de Jésus.
  alternative: Ajouter une précision sur la loi du sabbat ou annoncer explicitement la controverse.
  rationale: Le verset prépare le débat qui suit sans lui-même trancher la question; la traduction doit conserver cette tension narrative et théologique.
translation_notes:
  register: Français international moderne, simple et digne. « Un jour de sabbat » est plus naturel que le calque « un sabbat ». La répétition « un jour de sabbat, le jour où » reflète la structure insistante du grec sans lourdeur excessive.
