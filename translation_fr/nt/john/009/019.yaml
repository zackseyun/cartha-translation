  text: καὶ ἠρώτησαν αὐτοὺς λέγοντες· Οὗτός ἐστιν ὁ υἱὸς ὑμῶν, ὃν ὑμεῖς λέγετε ὅτι τυφλὸς ἐγεννήθη; πῶς οὖν ⸂βλέπει ἄρτι⸃;
base_translation:
  language: en
  yaml_path: translation/nt/john/009/019.yaml
  text: And they asked them, saying, “Is this your son, whom you say was born blind? How then does he now see?”
translation:
  language: fr
  text: 'Ils leur demandèrent : « Est-ce votre fils, celui dont vous dites qu’il est né aveugle ? Comment donc se fait-il qu’il voie maintenant ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠρώτησαν αὐτοὺς λέγοντες
  choice: Ils leur demandèrent
  rationale: 'Le français naturel n’a pas besoin de reproduire littéralement le participe « disant » : le verbe « demandèrent » introduit directement les paroles tout en conservant la valeur narrative de l’aoriste.'
- source_word: Οὗτός ἐστιν ὁ υἱὸς ὑμῶν
  choice: Est-ce bien votre fils
  rationale: La tournure grecque, formellement déclarative, fonctionne ici comme une question. « Est-ce bien » rend naturellement la demande de confirmation sans ajouter une accusation explicite.
- source_word: ὃν ὑμεῖς λέγετε
  choice: celui dont vous dites
  rationale: « Vous dites » reste neutre et préserve l’accent porté par le pronom explicite ὑμεῖς, sans introduire le soupçon plus marqué de « vous prétendez ».
- source_word: τυφλὸς ἐγεννήθη
  choice: qu’il est né aveugle
  rationale: Cette formulation française courante exprime clairement que la cécité était présente dès la naissance.
- source_word: πῶς οὖν
  choice: Comment donc se fait-il
  rationale: « Donc » conserve la valeur inférentielle de οὖν, tandis que « se fait-il » produit une question idiomatique en français.
- source_word: βλέπει ἄρτι
  choice: qu’il voie maintenant
  rationale: « Voie maintenant » exprime son état présent et le contraste avec sa cécité antérieure. Le subjonctif est imposé en français par la tournure « comment se fait-il que », sans modifier la portée du présent grec.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La formulation garde la neutralité de « vous dites » et évite le calque lourd « ils les interrogèrent en disant ».
