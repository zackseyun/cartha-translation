  yaml_path: translation/nt/john/009/020.yaml
  text: So his parents answered and said[a], “We know that this is our son and that he was born blind.
translation:
  language: fr
  text: 'Ses parents répondirent donc : « Nous savons que c’est notre fils et qu’il est né aveugle. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  choice: donc
  rationale: Marque la suite logique et narrative de l’interrogatoire précédent, dans un français naturel.
- source_word: οἱ γονεῖς αὐτοῦ
  choice: ses parents
  rationale: Désigne collectivement le père et la mère de l’homme; cette formulation est précise et idiomatique.
- source_word: ἀπεκρίθησαν ... καὶ εἶπαν
  choice: répondirent
  rationale: En français moderne, la formule sémitisante « répondirent et dirent » serait lourde; un seul verbe restitue naturellement l’acte de parole sans perte de sens.
- source_word: Οἴδαμεν
  choice: Nous savons
  rationale: Rend directement l’affirmation de connaissance et de certitude des parents.
- source_word: οὗτός ἐστιν ὁ υἱὸς ἡμῶν
  choice: c’est bien notre fils
  rationale: « C’est notre fils » identifie naturellement la personne montrée; « bien » rend la force contextuelle de l’identification sans surtraduire le démonstratif.
- source_word: τυφλὸς ἐγεννήθη
  choice: il est né aveugle
  rationale: Rend directement et idiomatiquement l’adjectif prédicatif et le passif de γεννάω dans son sens natal.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple convient au registre narratif biblique écrit sans être archaïque. La coordination grecque « répondirent et dirent » est allégée selon l’usage français.
