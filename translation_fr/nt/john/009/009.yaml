id: JHN.9.9
reference: John 9:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἄλλοι ἔλεγον ὅτι Οὗτός ἐστιν· ἄλλοι ⸂ἔλεγον· Οὐχί, ἀλλὰ⸃ ὅμοιος αὐτῷ ἐστιν. ἐκεῖνος ἔλεγεν ὅτι Ἐγώ εἰμι.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/009.yaml
  text: Some were saying[a], “This is he.” Others were saying, “No, but he is like him.” He kept saying, “I am he.”
translation:
  language: fr
  text: 'Les uns disaient : « C’est lui. » D’autres disaient : « Non, mais il lui ressemble. » Lui répétait : « C’est bien moi[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Moi, je suis. » Ici, l’homme affirme qu’il est bien celui dont ils parlent.'
    reason: alternative lexicale et clarification contextuelle
lexical_decisions:
- source_word: ἄλλοι … ἄλλοι
  choice: Les uns… D’autres
  rationale: Cette tournure française naturelle rend la répartition de la foule en deux groupes opposés.
- source_word: ἔλεγον
  choice: disaient
  rationale: L’imparfait restitue les propos en cours ou répétés dans la foule.
- source_word: Οὗτός ἐστιν
  choice: C’est lui
  rationale: Formulation française directe et naturelle qui conserve l’identification déictique du grec sans ajouter « l’homme ».
- source_word: Οὐχί, ἀλλὰ
  choice: Non, mais
  rationale: Rend simplement la négation appuyée et le contraste exprimés en grec.
- source_word: ὅμοιος αὐτῷ ἐστιν
  choice: il lui ressemble
  rationale: Exprime clairement la ressemblance par opposition à l’identité; plus naturel ici que « il est semblable à lui ».
- source_word: ἐκεῖνος ἔλεγεν
  choice: Lui répétait
  rationale: Le pronom disjoint met l’homme en contraste avec les groupes qui parlent, et « répétait » fait ressortir la valeur durative ou itérative de l’imparfait.
- source_word: Ἐγώ εἰμι
  choice: C’est bien moi
  rationale: Dans le contexte, l’expression sert à identifier l’homme comme la personne dont on parle. « Bien » rend son insistance sans conférer artificiellement à la formule une portée absolue.
theological_decisions:
- issue: Portée de Ἐγώ εἰμι dans le contexte johannique
  choice: C’est bien moi
  alternative: Je suis
  rationale: Le contexte immédiat porte sur l’identité de l’homme guéri. La traduction exprime donc l’identification ordinaire, tandis que la note conserve la forme plus littérale et évite de masquer l’écho verbal possible avec d’autres emplois johanniques.
translation_notes:
  register: Français international moderne, oral et digne. Le dialogue reste bref et vif; l’imparfait maintient la scène en cours, tandis que « répétait » traduit l’insistance de l’homme.
