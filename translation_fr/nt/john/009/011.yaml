source:
  edition: SBLGNT
  text: ἀπεκρίθη ⸀ἐκεῖνος· ⸂Ὁ ἄνθρωπος ὁ⸃ λεγόμενος Ἰησοῦς πηλὸν ἐποίησεν καὶ ἐπέχρισέν μου τοὺς ὀφθαλμοὺς καὶ εἶπέν μοι ⸀ὅτι Ὕπαγε εἰς ⸀τὸν Σιλωὰμ καὶ νίψαι· ἀπελθὼν ⸀οὖν καὶ νιψάμενος ἀνέβλεψα.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/011.yaml
  text: He answered[a], “The man called Jesus made mud and spread it on my eyes, and he told me, ‘Go to Siloam and wash.’ So I went away and washed[c][b], and I received my sight.”
translation:
  language: fr
  text: 'Il répondit : « L’homme qu’on appelle Jésus a fait de la boue[a], en a enduit mes yeux[b] et m’a dit : “Va à Siloé et lave-toi.” Je suis donc parti, je me suis lavé et j’ai reçu la vue[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de l’argile ». Le mot grec peut désigner de la boue ou de l’argile.
    reason: lexical_alternative
  - marker: b
    text: Ou « a oint mes yeux ». Le verbe grec décrit l’application d’une substance et peut aussi être traduit par « oindre ».
    reason: lexical_alternative
  - marker: c
    text: Ou « j’ai recouvré la vue ». Dans ce contexte, le verbe désigne le fait de recevoir la vue après avoir été aveugle ; « recouvré » peut toutefois suggérer une vue antérieure.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη ἐκεῖνος
  choice: Il répondit
  rationale: Formule narrative naturelle en français. Le pronom démonstratif ἐκεῖνος reprend ici l’homme déjà au centre de l’échange et n’exige pas le tour lourd « celui-ci répondit ».
- source_word: Ὁ ἄνθρωπος ὁ λεγόμενος Ἰησοῦς
  choice: L’homme qu’on appelle Jésus
  rationale: Cette formulation conserve l’identification sobre de Jésus comme « l’homme » et rend naturellement le participe λεγόμενος, sans anticiper une confession plus développée du personnage.
- source_word: πηλὸν ἐποίησεν
  choice: a fait de la boue
  rationale: πηλός peut désigner de la boue ou de l’argile. Dans le contexte immédiat, où Jésus mêle sa salive à la terre, « boue » est le terme français courant le plus naturel.
- source_word: ἐπέχρισέν μου τοὺς ὀφθαλμούς
  choice: m’en a enduit les yeux
  rationale: Le verbe ἐπιχρίω décrit l’application d’une substance sur une surface. « Enduire » rend précisément le geste sans les connotations rituelles possibles de « oindre ».
- source_word: εἶπέν μοι ὅτι
  choice: m’a dit
  rationale: Tour français direct et naturel pour introduire les paroles rapportées qui suivent.
- source_word: Ὕπαγε εἰς τὸν Σιλωάμ
  choice: Va à Siloé
  rationale: L’impératif est rendu simplement, et le nom traditionnel français « Siloé » suffit ici puisque le bassin a déjà été identifié dans le contexte précédent.
- source_word: νίψαι
  choice: lave-toi
  rationale: L’impératif moyen appelle naturellement le pronom réfléchi en français.
- source_word: ἀπελθὼν οὖν
  choice: Je suis donc parti
  rationale: « Donc » exprime la conséquence signalée par οὖν, tandis que « partir » reflète le mouvement d’éloignement contenu dans ἀπέρχομαι.
- source_word: νιψάμενος
  choice: je me suis lavé
  rationale: La forme moyenne est naturellement rendue par le verbe pronominal français.
- source_word: ἀνέβλεψα
  choice: j’ai pu voir
  rationale: Dans un récit de guérison de la cécité, ἀναβλέπω signifie accéder à la vue ou la recouvrer. « J’ai pu voir » évite de laisser entendre que cet homme, aveugle de naissance, avait auparavant possédé la vue.
theological_decisions:
- issue: La manière dont l’homme guéri caractérise Jésus
  choice: L’homme qu’on appelle Jésus
  alternative: Jésus / le Seigneur Jésus
  rationale: 'Le texte préserve l’étape présente de la compréhension du personnage : il identifie Jésus simplement comme un homme portant ce nom. La traduction n’introduit pas par anticipation une confession christologique plus explicite.'
- issue: La vue reçue par un homme aveugle de naissance
  choice: j’ai pu voir
  alternative: j’ai retrouvé la vue / j’ai recouvré la vue
  rationale: Les rendus conventionnels « retrouver » ou « recouvrer » pourraient suggérer une vue antérieure, alors que le contexte précise qu’il est aveugle de naissance. Le choix retenu exprime l’effet de la guérison sans effacer ce détail narratif.
translation_notes:
  register: Français international moderne, courant et digne. Le discours reste simple, conformément au témoignage direct de l’homme guéri. « Siloé » suit l’usage biblique français établi, tandis que « boue », « enduire » et « j’ai pu voir » privilégient une compréhension immédiate sans ajouter de connotations rituelles ni contredire la cécité de naissance mentionnée dans le contexte.
