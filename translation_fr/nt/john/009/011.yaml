- from: 'Il répondit : « L’homme qu’on appelle Jésus a fait de la boue[a], m’en a enduit les yeux[b] et m’a dit : “Va à Siloé et lave-toi.” Je suis donc parti, je me suis lavé et j’ai pu voir[c]. »'
