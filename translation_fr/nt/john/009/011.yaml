  rationale: La révision améliore l’idiomaticité française de la description du geste et rend explicitement le résultat de la guérison. Elle maintient le registre simple du témoignage, le nom traditionnel « Siloé », ainsi que l’identification non confessionnelle de Jésus. Les ancres de notes restent attachées aux unités lexicales pertinentes.
