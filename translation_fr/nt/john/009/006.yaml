id: JHN.9.6
reference: John 9:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ταῦτα εἰπὼν ἔπτυσεν χαμαὶ καὶ ἐποίησεν πηλὸν ἐκ τοῦ πτύσματος, καὶ ⸀ἐπέχρισεν ⸀αὐτοῦ τὸν πηλὸν ἐπὶ τοὺς ⸀ὀφθαλμούς,
base_translation:
  language: en
  yaml_path: translation/nt/john/009/006.yaml
  text: After saying these things[a], he spit on the ground and made mud from the saliva, and he spread the mud on his eyes,
translation:
  language: fr
  text: Après avoir dit cela, il cracha par terre, fit de la boue avec sa salive et l’étala[a] sur les yeux de l’aveugle.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : «oignit les yeux de l’aveugle avec la boue». Le verbe grec peut signifier «oindre» ou «étaler sur».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα εἰπὼν
  choice: Après avoir dit cela
  rationale: Le participe aoriste marque une action antérieure aux verbes principaux. Cette formulation française exprime naturellement la succession des actions.
- source_word: ἔπτυσεν χαμαί
  choice: il cracha par terre
  rationale: χαμαί désigne le sol; «par terre» rend concrètement et naturellement le geste en français courant.
- source_word: ἐποίησεν πηλὸν ἐκ τοῦ πτύσματος
  choice: fit de la boue avec sa salive
  rationale: πηλός désigne ici de la terre humide ou de la boue. «Avec sa salive» exprime idiomatiquement la matière employée, sans donner à ἐκ un sens causal étranger au contexte.
- source_word: ἐπέχρισεν
  choice: l’étala
  rationale: Le verbe signifie enduire, étaler ou oindre. Avec de la boue comme objet, «étala» décrit clairement l’application physique sans suggérer d’emblée un rite.
- source_word: αὐτοῦ ... ἐπὶ τοὺς ὀφθαλμούς
  choice: sur les yeux de l’aveugle
  rationale: Le pronom renvoie à l’homme aveugle dans le contexte. L’explicitation évite que «sur ses yeux» soit compris en français comme désignant les yeux de Jésus.
- source_word: τὸν πηλόν
  choice: l’
  rationale: Le pronom reprend naturellement en français «la boue» qui vient d’être mentionnée, tout en conservant la valeur anaphorique de l’article grec.
theological_decisions:
- issue: Éventuelle nuance cérémonielle de ἐπέχρισεν
  choice: «l’étala sur les yeux de l’aveugle»
  alternative: «oignit les yeux de l’aveugle avec la boue»
  rationale: Le contexte décrit une application concrète de boue, sans affirmer explicitement une onction rituelle. Le texte principal reste donc descriptif, tandis que la note conserve l’autre valeur lexicale possible.
translation_notes:
  register: Français international moderne, simple et digne. La phrase conserve la succession rapide des gestes du grec. «Cracha» et «boue» sont concrets sans être inutilement techniques; l’explicitation «de l’aveugle» lève une ambiguïté pronominale propre au français.
