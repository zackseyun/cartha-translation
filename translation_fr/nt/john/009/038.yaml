id: JHN.9.38
reference: John 9:38
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ δὲ ἔφη· Πιστεύω, κύριε· καὶ προσεκύνησεν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/038.yaml
  text: And he said[a], “I believe[b], Lord,” and he worshiped him.
translation:
  language: fr
  text: 'Il dit : « Je crois, Seigneur[a] », et il se prosterna devant lui[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Monsieur ». Le grec κύριε peut être une formule respectueuse; « Seigneur » est retenu ici parce que le contexte culmine dans une confession de foi et une prosternation.
    reason: alternative_reading
  - marker: b
    text: Ou « et il l’adora » / « et il lui rendit hommage ». Le verbe grec peut désigner une prosternation, un hommage ou l’adoration; le contexte donne à ce geste une forte portée religieuse.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ
  choice: Il
  rationale: L’article a une valeur pronominale et renvoie à l’homme guéri. En français, le pronom suffit; δέ n’a pas besoin d’être rendu explicitement dans ce bref enchaînement narratif.
- source_word: ἔφη
  choice: dit
  rationale: L’aoriste de φημί introduit simplement la parole; « dit » est naturel, sobre et fidèle.
- source_word: Πιστεύω
  choice: Je crois
  rationale: Cette formulation répond directement à la révélation de Jésus et conserve le vocabulaire johannique de la foi sans paraphrase.
- source_word: κύριε
  choice: Seigneur
  rationale: Le contexte, qui culmine dans la confession de foi et le geste de προσκύνησις, favorise l’adresse élevée « Seigneur », tout en laissant possible le sens respectueux « monsieur ».
- source_word: προσεκύνησεν
  choice: se prosterna devant
  rationale: Cette expression conserve directement la dimension corporelle de προσκυνέω et laisse au contexte sa portée cultuelle, sans trancher dans le texte principal entre prosternation, hommage et adoration.
- source_word: αὐτῷ
  choice: devant lui
  rationale: Avec « se prosterner », le datif grec se rend naturellement par « devant lui ».
theological_decisions:
- issue: κύριε peut être une adresse respectueuse ou porter le titre « Seigneur ».
  choice: Seigneur
  alternative: Monsieur
  rationale: Après que Jésus s’est révélé à lui, l’homme confesse sa foi et se prosterne. « Seigneur » convient donc au mouvement culminant du récit, tandis qu’une note maintient l’ambiguïté lexicale réelle.
- issue: προσεκύνησεν peut désigner une prosternation, un hommage ou l’adoration.
  choice: se prosterna devant lui
  alternative: l’adora
  rationale: La traduction retenue préserve le geste exprimé par le grec et évite de résoudre silencieusement sa portée théologique. Dans ce contexte de foi adressée à Jésus, « l’adora » reste une interprétation forte et plausible, signalée en note.
translation_notes:
  register: Français international moderne, simple et digne. Le rythme bref de la narration et de la confession est conservé. Les notes rendent visibles les deux ambiguïtés importantes sans alourdir le texte principal.
