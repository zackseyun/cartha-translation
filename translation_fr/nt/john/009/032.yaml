id: JHN.9.32
reference: John 9:32
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐκ τοῦ αἰῶνος οὐκ ἠκούσθη ὅτι ἠνέῳξέν τις ὀφθαλμοὺς τυφλοῦ γεγεννημένου·
base_translation:
  language: en
  yaml_path: translation/nt/john/009/032.yaml
  text: From of old it has never been heard that anyone opened the eyes of one born blind[a].
translation:
  language: fr
  text: Depuis toujours, on n’a jamais entendu dire que quelqu’un ait ouvert les yeux d’un aveugle de naissance[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Depuis que le monde existe, on n’a jamais entendu dire… »'
    reason: Alternative lexicale pour l’expression temporelle ἐκ τοῦ αἰῶνος.
lexical_decisions:
- source_word: ἐκ τοῦ αἰῶνος
  choice: Depuis toujours
  rationale: Cette expression idiomatique embrasse toute la durée de la mémoire humaine. « Depuis toujours » est naturel en français et évite le sens métaphysique plus fort de « depuis l’éternité ».
- source_word: οὐκ ἠκούσθη
  choice: on n’a jamais entendu dire
  rationale: La tournure impersonnelle française exprime naturellement le passif grec et l’absence de tout précédent rapporté.
- source_word: ὅτι
  choice: que
  rationale: Introduit simplement le contenu de ce qui n’a jamais été entendu dire.
- source_word: ἠνέῳξέν
  choice: ait ouvert
  rationale: « Ouvrir les yeux » reproduit l’expression grecque sans l’interpréter comme une simple restauration; le subjonctif est naturel après « on n’a jamais entendu dire que » dans cette affirmation négative.
- source_word: τις
  choice: quelqu’un
  rationale: Indéfini approprié dans le cadre d’une négation universelle.
- source_word: ὀφθαλμοὺς
  choice: les yeux
  rationale: Expression française idiomatique correspondant directement au grec.
- source_word: τυφλοῦ γεγεννημένου
  choice: d’un aveugle de naissance
  rationale: Rend clairement l’état de cécité présent dès la naissance, sans ajouter le substantif « homme » absent du grec.
theological_decisions:
- issue: Portée temporelle de ἐκ τοῦ αἰῶνος
  choice: « Depuis toujours », au sens de toute la mémoire historique
  alternative: « Depuis que le monde existe » ou « depuis l’éternité »
  rationale: Le locuteur affirme l’absence de précédent dans l’expérience humaine, sans nécessairement formuler une proposition métaphysique sur l’éternité. La variante en note conserve l’interprétation traditionnelle plus explicite.
translation_notes:
  register: Français international moderne, clair et digne. La tournure impersonnelle « on n’a jamais entendu dire » est courante sans être familière; « aveugle de naissance » est concise et naturelle.
