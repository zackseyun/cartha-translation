id: JHN.9.22
reference: John 9:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ταῦτα εἶπαν οἱ γονεῖς αὐτοῦ ὅτι ἐφοβοῦντο τοὺς Ἰουδαίους, ἤδη γὰρ συνετέθειντο οἱ Ἰουδαῖοι ἵνα ἐάν τις αὐτὸν ὁμολογήσῃ χριστόν, ἀποσυνάγωγος γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/022.yaml
  text: His parents said these things because they were afraid of the Jews[a], for the Jews had already agreed that if anyone confessed him as the Messiah[b], he would be put out of the synagogue.
translation:
  language: fr
  text: Ses parents dirent cela parce qu’ils avaient peur des Juifs[a]. En effet, les Juifs avaient déjà convenu que, si quelqu’un reconnaissait Jésus comme le Messie[b], il serait exclu de la synagogue.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Grec : « les Juifs ». Dans ce contexte, il s’agit probablement des autorités juives plutôt que du peuple juif sans distinction.'
    reason: cultural_note
  - marker: b
    text: 'Ou : « reconnaissait Jésus comme le Christ » ou « reconnaissait qu’il était le Christ ».'
    reason: alternative_reading
lexical_decisions:
- source_word: ταῦτα εἶπαν
  choice: dirent cela
  rationale: Le démonstratif pluriel grec renvoie aux paroles précédentes; en français idiomatique, « cela » reprend naturellement l’ensemble de ces propos.
- source_word: οἱ γονεῖς αὐτοῦ
  choice: ses parents
  rationale: Équivalent français direct et naturel de l’expression grecque.
- source_word: ἐφοβοῦντο
  choice: avaient peur
  rationale: L’imparfait grec présente une crainte persistante; l’imparfait français en conserve l’aspect.
- source_word: τοὺς Ἰουδαίους / οἱ Ἰουδαῖοι
  choice: les Juifs
  rationale: Conserve la désignation explicite du grec sans en réduire silencieusement la portée; une note précise le référent vraisemblable dans ce contexte.
- source_word: ἤδη γὰρ συνετέθειντο
  choice: En effet, les Juifs avaient déjà convenu
  rationale: Le plus-que-parfait marque un accord antérieur, ἤδη est rendu par « déjà », et γάρ introduit l’explication de leur peur.
- source_word: ἐάν τις αὐτὸν ὁμολογήσῃ χριστόν
  choice: si quelqu’un reconnaissait Jésus comme le Messie
  rationale: « Reconnaître comme » exprime naturellement l’aveu ou la déclaration publique visée par ὁμολογέω. Le nom « Jésus » explicite en français le pronom grec sans ambiguïté, et χριστόν est ici un titre.
- source_word: ἀποσυνάγωγος γένηται
  choice: il serait exclu de la synagogue
  rationale: Rend clairement le fait d’être banni de la communauté synagogale, avec une tournure française naturelle.
theological_decisions:
- issue: Sens de χριστόν
  choice: le Messie
  alternative: le Christ
  rationale: Le mot fonctionne ici comme un titre désignant l’oint attendu; « le Messie » rend explicite son cadre juif tout en préservant la variante traditionnelle en note.
- issue: Référent de οἱ Ἰουδαῖοι dans ce contexte johannique
  choice: les Juifs, avec note contextuelle
  alternative: les autorités juives
  rationale: Le texte principal conserve la formulation grecque, tandis que la note indique que le pouvoir d’exclure de la synagogue oriente probablement le référent vers les autorités juives concernées, et non vers tous les Juifs sans distinction.
translation_notes:
  register: Français international moderne, digne et accessible. « En effet » assure un enchaînement explicatif naturel. « Exclu de la synagogue » est plus courant que « chassé de la synagogue » et rend précisément la sanction institutionnelle.
