  text: ἀπεκρίθη οὖν ⸀ἐκεῖνος· Εἰ ἁμαρτωλός ἐστιν οὐκ οἶδα· ἓν οἶδα ὅτι τυφλὸς ὢν ἄρτι βλέπω.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/025.yaml
  text: 'So that man answered[a], “Whether he is a sinner, I do not know. One thing I do know: though I was blind, now I see.”'
translation:
  language: fr
  text: 'Cet homme répondit donc : « Je ne sais pas s’il est pécheur. Je sais une chose : j’étais aveugle, et maintenant je vois. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη οὖν ἐκεῖνος
  choice: Cet homme répondit donc
  rationale: « Répondit » rend directement le verbe narratif, « donc » maintient le lien discursif, et « cet homme » conserve la valeur démonstrative explicite de ἐκεῖνος tout en restant naturel en français.
- source_word: Εἰ ἁμαρτωλός ἐστιν οὐκ οἶδα
  choice: Je ne sais pas s’il est pécheur
  rationale: Après un verbe de connaissance, « si » introduit naturellement en français une interrogation indirecte et préserve l’incertitude exprimée par le locuteur, sans transformer ses paroles en jugement théologique du narrateur.
- source_word: ἁμαρτωλός
  choice: pécheur
  rationale: Le nom prédicatif « pécheur » reprend avec concision l’accusation formulée dans le contexte.
- source_word: ἓν οἶδα
  choice: Je sais une chose
  rationale: Cette tournure française simple garde l’opposition emphatique avec « Je ne sais pas ».
- source_word: τυφλὸς ὢν ἄρτι βλέπω
  choice: j’étais aveugle, et maintenant je vois
  rationale: La proposition rend clairement le contraste entre l’état antérieur et la situation présente. « Maintenant » traduit ἄρτι sans exagérer l’idée d’immédiateté, et « je vois » reste proche du présent simple βλέπω.
theological_decisions:
- issue: Préserver la perspective limitée de l’homme guéri concernant l’accusation portée contre Jésus
  choice: Je ne sais pas s’il est pécheur.
  alternative: S’il est pécheur, je ne le sais pas.
  rationale: La formulation choisie exprime idiomatiquement l’interrogation indirecte en français et rapporte la limite de connaissance du personnage sans valider ni réfuter ici l’accusation.
- issue: Valeur du participe τυφλὸς ὢν dans le contraste entre passé et présent
  choice: j’étais aveugle, et maintenant je vois
  alternative: bien que j’aie été aveugle, maintenant je vois
  rationale: Le participe peut recevoir plusieurs nuances circonstancielles. La coordination conserve le contraste temporel évident sans imposer une valeur concessive plus précise que ne l’exige le grec.
translation_notes:
  register: Français international moderne, digne et accessible. Syntaxe orale naturelle adaptée au dialogue, sans contraction familière ni vocabulaire confessionnel ajouté.
