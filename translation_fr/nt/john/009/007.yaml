    rationale: Cette expression est peu idiomatique en français moderne et risque d’affaiblir la force résultative de ἦλθεν βλέπων. « Revint voyant » est plus direct et plus proche de la construction grecque.
  - severity: low
    issue: Présentation de la glose par un tiret
    rationale: Le grec place la glose entre parenthèses. Des parenthèses françaises signalent plus clairement qu’il s’agit d’une explication du nom, sans modifier le sens.
