  verdict: revise
  source_fidelity: 'Le sens est globalement fidèle au grec : l’ordre de se laver au bassin, la glose sur Siloé, la conséquence narrative et le retour avec la vue sont tous conservés. « Il y alla » explicite de façon acceptable la destination sous-entendue par ἀπῆλθεν, mais « partit » reflète plus directement le contraste grec entre le départ et le retour.'
  naturalness: « Revint en voyant » est grammaticalement possible, mais peu naturel en français moderne et peut décrire la manière du retour plutôt que le résultat de la guérison. « Revint voyant » conserve de manière concise la valeur résultative du participe βλέπων dans un registre biblique clair. La glose gagne aussi en netteté avec des parenthèses, comme dans le texte source.
  terminology: « Bassin », « Siloé » et « Envoyé » sont appropriés. « Envoyé » conserve la forme participiale passive sans imposer une interprétation théologique.
