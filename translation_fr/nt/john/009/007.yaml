source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτῷ· Ὕπαγε νίψαι εἰς τὴν κολυμβήθραν τοῦ Σιλωάμ (ὃ ἑρμηνεύεται Ἀπεσταλμένος). ἀπῆλθεν οὖν καὶ ἐνίψατο, καὶ ἦλθεν βλέπων.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/007.yaml
  text: And he said to him[a], “Go, wash in the pool of Siloam” (which is translated “Sent”). So he went and washed, and came back seeing.
translation:
  language: fr
  text: 'Il lui dit : « Va te laver dans le bassin de Siloé » (ce nom se traduit par « Envoyé »). Il partit donc, se lava et revint voyant.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὕπαγε
  choice: Va
  rationale: Impératif simple de mouvement, rendu directement et naturellement en français moderne.
- source_word: νίψαι / ἐνίψατο
  choice: te laver / se lava
  rationale: νίπτω désigne l’action de laver, souvent une partie du corps. Le pronom réfléchi est nécessaire en français dans ce contexte, sans impliquer un bain complet.
- source_word: εἰς τὴν κολυμβήθραν
  choice: dans le bassin
  rationale: κολυμβήθρα désigne un bassin ou un réservoir. Avec « se laver », « dans le bassin » est idiomatique et conserve la valeur spatiale de εἰς sans imposer l’idée qu’il devait entrer entièrement dans l’eau.
- source_word: Σιλωάμ
  choice: Siloé
  rationale: Forme française traditionnelle et largement reconnue du nom de lieu biblique.
- source_word: ὃ ἑρμηνεύεται Ἀπεσταλμένος
  choice: nom qui se traduit par « Envoyé »
  rationale: La tournure garde l’explication étymologique explicite du grec. « Envoyé » rend le participe passif Ἀπεσταλμένος sans développer davantage sa portée symbolique.
- source_word: οὖν
  choice: donc
  rationale: 'Marque ici la conséquence narrative : l’homme obéit à l’ordre reçu.'
- source_word: ἀπῆλθεν
  choice: il y alla
  rationale: Rend le départ vers le lieu qui vient d’être nommé et assure une transition naturelle en français.
- source_word: ἦλθεν βλέπων
  choice: revint en voyant
  rationale: « Revint » exprime le retour impliqué par la séquence narrative, tandis que « en voyant » conserve autant que possible la construction participiale vive du grec et présente la vue comme résultat du lavage.
theological_decisions:
- issue: Portée symbolique de la glose sur le nom Siloé
  choice: Conserver dans le texte l’explication « Envoyé » sans en expliciter la signification christologique éventuelle.
  alternative: Développer le lien possible avec Jésus comme envoyé du Père.
  rationale: L’évangéliste fournit lui-même la traduction du nom, mais n’explicite pas ici sa portée symbolique. La traduction doit préserver cette possibilité sans imposer une interprétation.
translation_notes:
  register: Français moderne, clair et digne. Le tiret détache naturellement la glose explicative sans alourdir la phrase. Aucun appel de note n’est nécessaire, car l’explication du nom appartient au texte grec lui-même.
