  text: εἶπον ⸂οὖν αὐτῷ⸃· Τί ἐποίησέν σοι; πῶς ἤνοιξέν σου τοὺς ὀφθαλμούς;
base_translation:
  language: en
  yaml_path: translation/nt/john/009/026.yaml
  text: So they said to him, “What did he do to you? How did he open your eyes?”
translation:
  language: fr
  text: 'Ils lui dirent donc : « Que t’a-t-il fait ? Comment t’a-t-il ouvert les yeux ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπον
  choice: Ils dirent
  rationale: L’aoriste de λέγω introduit les paroles du groupe qui interroge l’homme. « Ils dirent » rend directement le verbe sans le préciser en « demandèrent », même si les paroles prennent la forme de questions.
- source_word: οὖν
  choice: donc
  rationale: Le connecteur marque ici la suite logique de l’échange; « donc » en conserve la valeur discursive sans le réduire à une simple succession temporelle.
- source_word: αὐτῷ
  choice: lui
  rationale: Le datif désigne l’homme auparavant aveugle comme destinataire des paroles; « lui » est la tournure française naturelle.
- source_word: Τί ἐποίησέν σοι
  choice: Que t’a-t-il fait ?
  rationale: La formulation conserve le sens ouvert de ποιέω avec le datif, sans présumer que les interlocuteurs présentent l’acte comme un bienfait.
- source_word: πῶς ἤνοιξέν σου τοὺς ὀφθαλμούς
  choice: Comment t’a-t-il ouvert les yeux ?
  rationale: Cette formulation rend directement la question sur la manière ou le moyen et transpose naturellement en français la construction grecque relative aux parties du corps.
theological_decisions: []
translation_notes:
  register: Français moderne, naturel et digne. Le passé simple convient au registre narratif biblique tout en restant clair; les questions directes gardent le ton insistant de l’interrogatoire.
