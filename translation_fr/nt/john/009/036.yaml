id: JHN.9.36
reference: John 9:36
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀπεκρίθη ἐκεῖνος καὶ εἶπεν· Καὶ τίς ἐστιν, κύριε, ἵνα πιστεύσω εἰς αὐτόν;
base_translation:
  language: en
  yaml_path: translation/nt/john/009/036.yaml
  text: He answered and said[a], “And who is he, Lord, that I may believe in him?”
translation:
  language: fr
  text: 'Il répondit : « Et qui est-il, Seigneur[a], pour que je croie en lui ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « monsieur ». Le grec κύριε peut servir de formule de politesse (« monsieur ») ou signifier « Seigneur ».
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθη ἐκεῖνος καὶ εἶπεν
  choice: Il répondit
  rationale: La formule narrative grecque associe littéralement « il répondit » et « il dit ». En français moderne, « Il répondit » rend naturellement l’ensemble sans reproduire un doublet lourd.
- source_word: Καὶ τίς ἐστιν
  choice: Et qui est-il
  rationale: Le « Et » conserve la continuité vive de la réponse, tandis que « qui est-il » rend directement l’interrogation grecque.
- source_word: κύριε
  choice: Seigneur
  rationale: « Seigneur » est l’équivalent formel usuel de κύριε. Ici, le mot peut aussi être une formule de politesse signifiant « monsieur » ; cette ambiguïté contextuelle est signalée en note.
- source_word: ἵνα πιστεύσω εἰς αὐτόν
  choice: pour que je croie en lui
  rationale: « Pour que » exprime la visée portée par ἵνα avec le subjonctif, et « croire en lui » rend de façon transparente πιστεύω εἰς.
theological_decisions:
- issue: Sens de κύριε avant la confession explicite de l’homme guéri
  choice: Seigneur
  alternative: monsieur
  rationale: Le grec permet aussi bien une adresse respectueuse qu’un titre à portée plus forte. Le texte principal conserve « Seigneur », sans effacer l’autre possibilité, donnée en note afin de préserver la tension narrative.
translation_notes:
  register: Français moderne, digne et direct. Le doublet sémitisant « répondit et dit » est allégé en « répondit », conformément à l’usage narratif naturel du français, tandis que le καί ouvrant la question est conservé par « Et ».
