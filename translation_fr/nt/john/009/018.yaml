id: JHN.9.18
reference: John 9:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Οὐκ ἐπίστευσαν οὖν οἱ Ἰουδαῖοι περὶ αὐτοῦ ὅτι ⸂ἦν τυφλὸς⸃ καὶ ἀνέβλεψεν, ἕως ὅτου ἐφώνησαν τοὺς γονεῖς αὐτοῦ ⸂τοῦ ἀναβλέψαντος⸃
base_translation:
  language: en
  yaml_path: translation/nt/john/009/018.yaml
  text: So the Jews did not believe concerning him that he had been blind and had received sight[a], until they called the parents of the one who had received sight.
translation:
  language: fr
  text: Les Juifs ne crurent donc pas, à son sujet, qu’il avait été aveugle et qu’il avait recouvré la vue, jusqu’à ce qu’ils appellent les parents de celui qui avait recouvré la vue[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, selon le sens donné dans ce contexte à l’expression employée par Jean : « les chefs juifs » ou « les Judéens ».'
    reason: L’expression οἱ Ἰουδαῖοι est littéralement « les Juifs », mais son référent dans l’Évangile selon Jean varie selon le contexte et peut être plus restreint.
lexical_decisions:
- source_word: ἐπίστευσαν
  choice: ne crurent pas
  rationale: Avec la proposition de contenu introduite par ὅτι, πιστεύω désigne ici le fait de tenir une affirmation pour vraie. « Ne crurent pas » rend directement l’aoriste sans ajouter l’idée d’un refus volontaire.
- source_word: οἱ Ἰουδαῖοι
  choice: les Juifs
  rationale: Cette traduction formelle conserve l’expression grecque sans en restreindre d’emblée le référent aux chefs juifs ou aux Judéens; une note signale l’ambiguïté contextuelle propre à l’usage johannique.
- source_word: περὶ αὐτοῦ
  choice: à son sujet
  rationale: Cette tournure française naturelle rend περί avec le génitif et rattache explicitement l’incrédulité à ce qui est affirmé de l’homme.
- source_word: ἦν τυφλὸς
  choice: il avait été aveugle
  rationale: Le plus-que-parfait exprime naturellement en français l’état antérieur de cécité, considéré depuis le moment postérieur à la guérison.
- source_word: ἀνέβλεψεν
  choice: il avait recouvré la vue
  rationale: Dans un récit de guérison, ἀναβλέπω signifie retrouver ou recevoir la vue. « Recouvrer la vue » est une expression française idiomatique et digne; dans ce contexte, elle n’impose pas nécessairement que l’homme ait vu auparavant.
- source_word: ἕως ὅτου
  choice: jusqu’à ce que
  rationale: Cette locution marque la limite temporelle de leur incrédulité et correspond naturellement à la construction grecque.
- source_word: ἐφώνησαν
  choice: ils appellent
  rationale: « Appeler » conserve la portée assez large de φωνέω. Le présent après « jusqu’à ce que » est idiomatique en français, bien que le récit grec emploie l’aoriste.
- source_word: τοὺς γονεῖς αὐτοῦ
  choice: les parents
  rationale: Le possesseur est déjà clairement exprimé par « de celui qui… »; éviter « ses parents de celui » produit un français naturel sans perte de sens.
- source_word: τοῦ ἀναβλέψαντος
  choice: de celui qui avait recouvré la vue
  rationale: La relative substantivée reproduit le participe grec articulé sans ajouter le nom « homme », seulement implicite dans le contexte.
theological_decisions:
- issue: Référent et nuance de οἱ Ἰουδαῖοι dans Jean
  choice: les Juifs
  alternative: les chefs juifs; les Judéens
  rationale: Le texte principal préserve la désignation grecque et son ambiguïté. Le contexte peut viser plus précisément les autorités juives chargées de l’enquête, tandis que l’usage johannique permet aussi une lecture géographique; la note expose ces possibilités sans trancher à la place du texte.
- issue: Portée temporelle de ἕως ὅτου
  choice: jusqu’à ce qu’ils appellent
  alternative: avant d’avoir appelé
  rationale: La traduction conserve la limite temporelle exprimée par le grec sans affirmer davantage que la convocation des parents aurait ensuite produit la foi.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe garde la progression argumentative du grec tout en évitant un calque lourd. La répétition de « recouvré la vue » est maintenue parce qu’elle correspond à la reprise lexicale du texte source.
