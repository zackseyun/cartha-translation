source:
  edition: SBLGNT
  text: Ἐφώνησαν οὖν ⸂τὸν ἄνθρωπον ἐκ δευτέρου⸃ ὃς ἦν τυφλὸς καὶ εἶπαν αὐτῷ· Δὸς δόξαν τῷ θεῷ· ἡμεῖς οἴδαμεν ὅτι ⸂οὗτος ὁ ἄνθρωπος⸃ ἁμαρτωλός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/024.yaml
  text: So they called the man who had been blind a second time and said to him[a], “Give glory to God; we know that this man is a sinner.”
translation:
  language: fr
  text: 'Ils appelèrent donc une deuxième fois l’homme qui avait été aveugle et lui dirent[a] : « Rends gloire à Dieu ! Nous savons que cet homme est un pécheur. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou peut-être, comme formule solennelle : « Rends gloire à Dieu », c’est-à-dire : « Dis la vérité devant Dieu » ou « Fais ouvertement un aveu devant Dieu ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐφώνησαν
  choice: ils appelèrent
  rationale: Le verbe indique qu’ils font revenir l’homme devant eux. « Appelèrent » reste naturel et n’ajoute pas la contrainte officielle que pourrait suggérer « convoquèrent ».
- source_word: οὖν
  choice: donc
  rationale: « Donc » conserve le lien logique et la progression narrative avec l’échange précédent.
- source_word: ἐκ δευτέρου
  choice: une deuxième fois
  rationale: Cette expression rend directement l’idée d’un nouvel appel, pour la seconde fois.
- source_word: ὃς ἦν τυφλός
  choice: qui avait été aveugle
  rationale: Le plus-que-parfait français situe la cécité dans le passé et évite de laisser entendre que l’homme est encore aveugle après sa guérison.
- source_word: Δὸς δόξαν τῷ θεῷ
  choice: Donne gloire à Dieu
  rationale: La formulation littérale est conservée, tandis que sa probable valeur d’adjuration solennelle est expliquée en note.
- source_word: ἡμεῖς οἴδαμεν
  choice: Nous savons
  rationale: Le pronom exprimé en grec souligne l’assurance revendiquée par les interlocuteurs; la formulation française la préserve naturellement.
- source_word: οὗτος ὁ ἄνθρωπος
  choice: cet homme
  rationale: Traduction directe qui n’introduit pas une nuance méprisante absente des mots grecs eux-mêmes.
- source_word: ἁμαρτωλός
  choice: un pécheur
  rationale: Le nom prédicatif français rend clairement l’accusation portée contre Jésus.
theological_decisions:
- issue: Valeur idiomatique de Δὸς δόξαν τῷ θεῷ
  choice: Conserver « Donne gloire à Dieu » dans le texte principal
  alternative: Rendre explicitement l’adjuration par « Dis la vérité devant Dieu » ou « Avoue-le devant Dieu »
  rationale: L’expression fonctionne probablement comme une sommation solennelle à dire la vérité ou à faire un aveu, mais sa forme grecque parle littéralement de rendre gloire à Dieu. Le texte principal conserve cette formulation et la note présente l’implication possible sans trancher excessivement.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple convient au registre narratif biblique sans être archaïque. L’impératif « Donne gloire à Dieu » reste immédiatement compréhensible, tandis que la note en précise la portée idiomatique possible.
