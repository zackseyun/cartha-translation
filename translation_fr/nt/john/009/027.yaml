id: JHN.9.27
reference: John 9:27
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀπεκρίθη αὐτοῖς· Εἶπον ὑμῖν ἤδη καὶ οὐκ ἠκούσατε· τί πάλιν θέλετε ἀκούειν; μὴ καὶ ὑμεῖς θέλετε αὐτοῦ μαθηταὶ γενέσθαι;
base_translation:
  language: en
  yaml_path: translation/nt/john/009/027.yaml
  text: He answered them[a], “I already told you, and you did not listen. Why do you want to hear it again? You do not also want to become his disciples[b], do you?”
translation:
  language: fr
  text: 'Il leur répondit : « Je vous l’ai déjà dit, et vous n’avez pas écouté[a]. Pourquoi voulez-vous l’entendre de nouveau ? Vous ne voudriez tout de même pas, vous aussi, devenir ses disciples[b] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vous n’avez pas entendu ». Le verbe grec peut signifier « entendre » ou « écouter » ; ici, il évoque probablement le refus de prêter attention à ce qui a été dit.
    reason: lexical_alternative
  - marker: b
    text: La question grecque est formulée de manière à attendre une réponse négative. Ou « Est-ce que vous aussi, vous voudriez devenir ses disciples ? »
    reason: grammatical_rhetorical_force
lexical_decisions:
- source_word: ἀπεκρίθη αὐτοῖς
  choice: Il leur répondit
  rationale: Formulation narrative française naturelle qui conserve explicitement le complément αὐτοῖς.
- source_word: ἤδη
  choice: déjà
  rationale: Rend directement l’antériorité soulignée par l’adverbe grec.
- source_word: οὐκ ἠκούσατε
  choice: vous n’avez pas écouté
  rationale: Dans ce reproche, ἀκούω désigne vraisemblablement non une incapacité à percevoir les paroles, mais le refus d’y prêter attention ou d’en tenir compte.
- source_word: τί πάλιν θέλετε ἀκούειν;
  choice: Pourquoi voulez-vous l’entendre de nouveau ?
  rationale: Dans ce contexte, τί a naturellement une valeur interrogative proche de « pourquoi »; le pronom « l’ » reprend en français ce qui a déjà été dit.
- source_word: μὴ καὶ ὑμεῖς
  choice: Est-ce que vous aussi, vous voudriez… ?
  rationale: La tournure interrogative et le conditionnel français communiquent l’étonnement ironique d’une question qui appelle normalement une réponse négative, tandis que « vous aussi » conserve l’insistance de καὶ ὑμεῖς.
- source_word: αὐτοῦ μαθηταὶ γενέσθαι
  choice: devenir ses disciples
  rationale: « Devenir » préserve la valeur d’entrée dans un nouvel état de γενέσθαι; « ses disciples » est l’expression française naturelle.
theological_decisions:
- issue: Force rhétorique de la question finale
  choice: 'Une question ironique qui laisse attendre une réponse négative : « Est-ce que vous aussi, vous voudriez devenir ses disciples ? »'
  alternative: « Vous ne voudriez tout de même pas, vous aussi, devenir ses disciples ? »
  rationale: μή oriente normalement vers une réponse négative. La formulation retenue préserve cette orientation sans transformer l’implicite grammatical en affirmation trop appuyée.
translation_notes:
  register: Français international moderne, courant et digne. Le dialogue garde le ton direct et légèrement ironique de l’homme guéri, sans familiarité excessive ni explicitation doctrinale.
