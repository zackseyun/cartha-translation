source:
  edition: SBLGNT
  text: ⸀ἤκουσαν ἐκ τῶν Φαρισαίων ταῦτα οἱ ⸂μετ’ αὐτοῦ ὄντες⸃, καὶ εἶπον αὐτῷ· Μὴ καὶ ἡμεῖς τυφλοί ἐσμεν;
base_translation:
  language: en
  yaml_path: translation/nt/john/009/040.yaml
  text: Some of the Pharisees who were with him heard these things and said to him[a], “Surely we are not blind too, are we?”
translation:
  language: fr
  text: 'Quelques-uns des Pharisiens qui étaient avec lui entendirent cela et lui dirent : « Nous ne sommes quand même pas aveugles, nous non plus[a] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Nous non plus, nous ne sommes pas aveugles ? » En grec, la question introduite par μή laisse attendre une réponse négative.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤκουσαν
  choice: entendirent
  rationale: L’aoriste décrit ici le fait d’avoir entendu les paroles que Jésus venait de prononcer ; « entendirent » convient naturellement au récit.
- source_word: ἐκ τῶν Φαρισαίων
  choice: Quelques-uns des pharisiens
  rationale: La construction partitive ἐκ avec le génitif désigne certains membres du groupe, et non l’ensemble des pharisiens.
- source_word: ταῦτα
  choice: cela
  rationale: Le démonstratif pluriel renvoie à ce que Jésus vient de dire. En français courant, « cela » reprend naturellement l’ensemble de ses propos sans les réduire explicitement à de simples paroles.
- source_word: οἱ μετ’ αὐτοῦ ὄντες
  choice: qui étaient avec lui
  rationale: Cette proposition relative restitue avec naturel le groupe participial qui identifie les pharisiens présents auprès de Jésus.
- source_word: εἶπον αὐτῷ
  choice: lui dirent
  rationale: Cette formulation traduit directement le verbe λέγω et introduit naturellement la question au discours direct.
- source_word: Μὴ
  choice: Nous ne sommes tout de même pas… ?
  rationale: La question introduite par μή appelle normalement une réponse négative. La tournure française avec « ne… pas » et « tout de même » exprime cette attente incrédule sans transformer la question en affirmation.
- source_word: καὶ
  choice: aussi
  rationale: Le terme associe les interlocuteurs aux aveugles dont il vient d’être question ; « nous aussi » est l’expression française naturelle.
- source_word: τυφλοί
  choice: aveugles
  rationale: Le texte emploie le terme sans préciser « spirituellement ». Le conserver tel quel maintient l’image et l’ironie du passage.
theological_decisions:
- issue: Explicitation du sens métaphorique de τυφλοί
  choice: Conserver « aveugles » sans ajouter « spirituellement »
  alternative: « spirituellement aveugles »
  rationale: Le contexte indique une portée figurée, mais le grec laisse l’adjectif sans qualification. La traduction préserve ainsi l’ambiguïté expressive et l’ironie johannique.
- issue: Orientation attendue de la question introduite par μή
  choice: Employer une question négative qui laisse attendre la réponse « non »
  alternative: « Serions-nous aveugles, nous aussi ? »
  rationale: La formulation retenue rend la présupposition des pharisiens sans supprimer la forme interrogative ni leur méprise.
translation_notes:
  register: Français moderne, naturel et digne. Le passé simple convient au registre narratif biblique sans être archaïque. « Tout de même » communique l’incrédulité portée par μή, tandis que « aveugles » conserve sans explication ajoutée la tension entre le sens physique et le sens figuré.
