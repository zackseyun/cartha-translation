id: JHN.9.4
reference: John 9:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸀ἡμᾶς δεῖ ἐργάζεσθαι τὰ ἔργα τοῦ πέμψαντός με ἕως ἡμέρα ἐστίν· ἔρχεται νὺξ ὅτε οὐδεὶς δύναται ἐργάζεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/004.yaml
  text: We must do the works of the one who sent me while it is day; night is coming[a], when no one can work.
translation:
  language: fr
  text: Nous devons accomplir les œuvres de celui qui m’a envoyé tant qu’il fait jour. La nuit vient[a] ; alors, personne ne peut travailler.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Certains manuscrits portent : « Je dois accomplir les œuvres de celui qui m’a envoyé. »'
    reason: textual_variant
lexical_decisions:
- source_word: ἡμᾶς
  choice: Nous
  rationale: Avec δεῖ, l’accusatif pluriel signifie littéralement « il nous faut »; « nous devons » en donne une formulation française naturelle tout en suivant le texte du SBLGNT.
- source_word: δεῖ
  choice: devons
  rationale: Exprime ici une nécessité ou une obligation; « nous devons » conserve cette force en français courant.
- source_word: ἐργάζεσθαι τὰ ἔργα
  choice: accomplir les œuvres
  rationale: Évite la répétition peu naturelle « travailler les œuvres » tout en préservant le terme johannique « œuvres » et l’idée de les mener à bien.
- source_word: τοῦ πέμψαντός με
  choice: de celui qui m’a envoyé
  rationale: Rend naturellement le participe substantivé sans préciser dans le texte principal l’identité de celui qui envoie.
- source_word: ἕως ἡμέρα ἐστίν
  choice: tant qu’il fait jour
  rationale: Exprime la durée disponible pour agir et maintient le contraste avec la nuit qui vient.
- source_word: ἔρχεται νὺξ
  choice: La nuit vient
  rationale: Conserve le présent grec et son caractère imminent dans une formulation française concise.
- source_word: ὅτε
  choice: où
  rationale: Dans cette métaphore temporelle, « où » rattache naturellement la proposition à « la nuit » sans en modifier le sens.
- source_word: οὐδεὶς δύναται ἐργάζεσθαι
  choice: personne ne peut travailler
  rationale: Rend directement l’incapacité générale exprimée par le grec; ici, le verbe est employé sans complément.
theological_decisions:
- issue: 'Variante textuelle initiale : ἡμᾶς (« nous ») ou ἐμέ (« moi »)'
  choice: Nous devons accomplir les œuvres de celui qui m’a envoyé
  alternative: Je dois accomplir les œuvres de celui qui m’a envoyé
  rationale: Le texte source fourni, le SBLGNT, porte ἡμᾶς et exige donc le pluriel. La variante au singulier, largement attestée dans la tradition manuscrite, est signalée en note afin de préserver la transparence textuelle.
translation_notes:
  register: Français international moderne, clair et digne. « Accomplir les œuvres » conserve le vocabulaire johannique sans produire une tournure maladroite; « tant qu’il fait jour » rend l’opposition imagée entre le jour disponible et la nuit imminente.
