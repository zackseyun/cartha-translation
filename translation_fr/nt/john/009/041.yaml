id: JHN.9.41
reference: John 9:41
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἶπεν αὐτοῖς ὁ Ἰησοῦς· Εἰ τυφλοὶ ἦτε, οὐκ ἂν εἴχετε ἁμαρτίαν· νῦν δὲ λέγετε ὅτι Βλέπομεν· ⸀ἡ ἁμαρτία ὑμῶν μένει.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/041.yaml
  text: Jesus said to them[a], “If you were blind, you would not have sin. But now you say, ‘We see,’ so your sin remains.”
translation:
  language: fr
  text: 'Jésus leur dit : « Si vous étiez aveugles, vous n’auriez pas de péché[a]. Mais maintenant, vous dites : “Nous voyons.” Votre péché demeure. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « vous ne seriez pas coupables ». Le grec dit « vous n’auriez pas de péché » ; ici, « péché » peut inclure l’idée de culpabilité.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τυφλοὶ
  choice: aveugles
  rationale: Le terme signifie littéralement « aveugles ». Le contexte lui donne une portée métaphorique liée à la perception spirituelle, sans qu’il soit nécessaire de l’expliciter dans le texte.
- source_word: οὐκ ἂν εἴχετε
  choice: vous n’auriez pas
  rationale: L’imparfait avec ἄν exprime ici le résultat irréel d’une condition contraire aux faits ; le conditionnel présent est la tournure française naturelle.
- source_word: ἁμαρτίαν
  choice: de péché
  rationale: « Péché » est l’équivalent lexical direct et maintient le vocabulaire johannique. Dans ce contexte, le mot peut aussi comporter l’idée de culpabilité.
- source_word: νῦν δὲ
  choice: Mais maintenant
  rationale: Cette formulation rend clairement le contraste entre l’hypothèse précédente et la situation présente.
- source_word: λέγετε ὅτι Βλέπομεν
  choice: 'vous dites : “Nous voyons.”'
  rationale: La citation directe conserve le passage rhétorique de la deuxième personne du pluriel à la première personne du pluriel ainsi que l’ironie du propos.
- source_word: ἡ ἁμαρτία ὑμῶν μένει
  choice: Votre péché demeure donc
  rationale: « Demeure » conserve la portée du verbe johannique μένει et l’idée d’un état qui continue. « Donc » explicite en français le rapport logique porté par la juxtaposition grecque et rendu par « so » dans la couche de consultation anglaise.
theological_decisions:
- issue: Faut-il expliciter que la cécité est spirituelle et que le péché désigne ici la culpabilité devant Dieu ?
  choice: Conserver les termes simples « aveugles » et « péché » dans le texte principal.
  alternative: « Si vous étiez aveugles spirituellement, vous ne seriez pas coupables. »
  rationale: Le contexte concerne bien la perception spirituelle, mais la formulation de Jésus prolonge délibérément la métaphore de la cécité physique développée dans le chapitre. Une explicitation réduirait l’ambiguïté et la tension théologique du grec.
translation_notes:
  register: Français moderne, international et digne. La syntaxe reste directe et orale, tout en conservant la métaphore, la citation interne et le vocabulaire johannique.
