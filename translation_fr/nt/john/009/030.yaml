id: JHN.9.30
reference: John 9:30
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀπεκρίθη ὁ ἄνθρωπος καὶ εἶπεν αὐτοῖς· Ἐν ⸂τούτῳ γὰρ τὸ⸃ θαυμαστόν ἐστιν ὅτι ὑμεῖς οὐκ οἴδατε πόθεν ἐστίν, καὶ ἤνοιξέν μου τοὺς ὀφθαλμούς.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/030.yaml
  text: 'The man answered and said to them[a], “This is the remarkable thing: you do not know where he is from[b], and yet he opened my eyes.”'
translation:
  language: fr
  text: 'L’homme leur répondit : « Voilà justement ce qui est étonnant : vous ne savez pas d’où il vient, et pourtant il m’a ouvert les yeux ! »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη ὁ ἄνθρωπος καὶ εἶπεν αὐτοῖς
  choice: L’homme leur répondit
  rationale: La formule grecque littérale « répondit et leur dit » est idiomatiquement condensée en français sans perte de sens; « l’homme » renvoie précisément à l’homme né aveugle.
- source_word: Ἐν τούτῳ γὰρ τὸ θαυμαστόν ἐστιν
  choice: Voilà justement ce qui est étonnant
  rationale: « Voilà… ce qui » rend naturellement la construction démonstrative, tandis que « justement » restitue la valeur explicative et l’insistance de γάρ dans cette réplique ironique. « Étonnant » exprime le caractère remarquable ou surprenant de θαυμαστόν.
- source_word: ὑμεῖς οὐκ οἴδατε
  choice: vous ne savez pas
  rationale: Le pronom explicite ὑμεῖς porte une insistance que la présence obligatoire de « vous » en français ne marque que partiellement, mais le contexte et « justement » soutiennent le contraste sans alourdir la phrase.
- source_word: πόθεν ἐστίν
  choice: d’où il vient
  rationale: Formulation française courante qui conserve la question de l’origine de Jésus sans la préciser davantage.
- source_word: καὶ
  choice: et pourtant
  rationale: Le simple καί relie ici deux faits placés en contraste ironique; « et pourtant » explicite naturellement cette valeur discursive sans modifier leur contenu.
- source_word: ἤνοιξέν μου τοὺς ὀφθαλμούς
  choice: il m’a ouvert les yeux
  rationale: Traduction à la fois fidèle et idiomatique, désignant immédiatement la guérison physique tout en laissant subsister la résonance johannique possible.
theological_decisions:
- issue: Résonance métaphorique possible de « il m’a ouvert les yeux »
  choice: Conserver l’expression littérale de la guérison sans expliciter une illumination spirituelle
  alternative: Employer une formulation mettant au premier plan la compréhension ou l’éveil spirituel
  rationale: Dans l’immédiat, l’homme parle de la restauration physique de sa vue. La formulation retenue laisse le thème johannique de la vue et de l’aveuglement se dégager du contexte sans imposer une interprétation.
translation_notes:
  register: Français international moderne, naturel et digne. La réplique conserve son étonnement et sa pointe ironique. Aucun appel de note n’est nécessaire, les principales nuances lexicales étant adéquatement représentées dans le texte.
