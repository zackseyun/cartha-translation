  yaml_path: translation/nt/john/009/005.yaml
  text: While I am in the world, I am the light of the world.
translation:
  language: fr
  text: Tant que je suis dans le monde, je suis la lumière du monde.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅταν
  choice: Tant que
  rationale: Dans ce contexte, ὅταν avec le subjonctif ὦ exprime la durée conditionnelle ou temporelle de la présence de Jésus dans le monde. « Tant que » rend naturellement cette nuance, sans adopter le sens itératif habituel de « chaque fois que ».
- source_word: ἐν τῷ κόσμῳ
  choice: dans le monde
  rationale: Rend directement l’expression grecque et conserve le sens johannique de κόσμος sans l’expliciter.
- source_word: φῶς εἰμι τοῦ κόσμου
  choice: je suis la lumière du monde
  rationale: Traduction formellement proche, naturelle en français, qui préserve la métaphore et sa portée théologique sans ajout interprétatif.
theological_decisions:
- issue: Portée temporelle de la déclaration
  choice: Tant que je suis dans le monde
  alternative: Chaque fois que je suis dans le monde
  rationale: Bien que ὅταν puisse avoir une valeur indéfinie, le contexte immédiat concerne le temps disponible pour accomplir les œuvres avant la venue de la nuit. « Tant que » exprime cette portée temporelle sans suggérer plusieurs venues dans le monde.
translation_notes:
  register: Français international moderne, simple et digne. La répétition de « monde » est conservée afin de respecter la structure et l’accent du grec.
