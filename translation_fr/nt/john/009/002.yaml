id: JHN.9.2
reference: John 9:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἠρώτησαν αὐτὸν οἱ μαθηταὶ αὐτοῦ λέγοντες· Ῥαββί, τίς ἥμαρτεν, οὗτος ἢ οἱ γονεῖς αὐτοῦ, ἵνα τυφλὸς γεννηθῇ;
base_translation:
  language: en
  yaml_path: translation/nt/john/009/002.yaml
  text: And his disciples asked him[a], saying, “Rabbi, who sinned, this man or his parents, that he should be born blind?”
translation:
  language: fr
  text: 'Ses disciples lui demandèrent : « Rabbi, qui a péché, cet homme ou ses parents, pour qu’il naisse aveugle[a] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « de sorte qu’il est né aveugle ». La proposition grecque peut exprimer le rapport de but ou de conséquence présupposé dans la question des disciples.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἠρώτησαν
  choice: demandèrent
  rationale: Le verbe introduit ici une question directe adressée à Jésus. « Demandèrent » est le tour narratif français naturel, sans ajouter d’intensité.
- source_word: μαθηταὶ
  choice: disciples
  rationale: « Disciples » conserve la relation de formation et d’attachement à un maître propre au récit évangélique.
- source_word: λέγοντες
  choice: rendu par les deux-points et le discours direct
  rationale: 'En français actuel, « lui demandèrent : » introduit naturellement les paroles qui suivent. Ajouter « en disant » serait possible, mais plus lourd.'
- source_word: Ῥαββί
  choice: Rabbi
  rationale: Cette forme d’adresse juive, aisément reconnaissable en français, préserve la couleur historique du passage.
- source_word: τίς
  choice: qui
  rationale: L’interrogatif demande laquelle des personnes mentionnées serait responsable.
- source_word: ἥμαρτεν
  choice: a péché
  rationale: Le passé composé rend naturellement en français cette action passée présentée comme pertinente pour la situation évoquée.
- source_word: οὗτος
  choice: cet homme
  rationale: Le démonstratif désigne l’homme aveugle présent dans le contexte. « Cet homme » est clair et idiomatique.
- source_word: γονεῖς
  choice: parents
  rationale: C’est l’équivalent français direct et courant du terme grec désignant le père et la mère.
- source_word: ἵνα
  choice: pour que
  rationale: Cette tournure conserve le lien de finalité ou de conséquence supposé dans la question des disciples, sans le présenter comme une affirmation du narrateur.
- source_word: τυφλὸς
  choice: aveugle
  rationale: L’adjectif décrit directement l’état de l’homme à sa naissance.
- source_word: γεννηθῇ
  choice: naisse
  rationale: Le subjonctif après « pour que » reproduit naturellement la construction subordonnée grecque et son lien envisagé avec le péché supposé.
theological_decisions:
- issue: Nuance causale ou finale de ἵνα dans la question sur le péché et la cécité de naissance
  choice: « pour qu’il naisse aveugle »
  alternative: « de sorte qu’il est né aveugle »
  rationale: Le texte rapporte le présupposé des disciples sans enseigner lui-même que le péché de l’homme ou de ses parents a causé sa cécité. La formulation conserve leur logique et la tension de la question sans la valider ni la corriger par anticipation.
translation_notes:
  register: Français international moderne, clair et digne. Le discours direct est introduit sans le calque pesant « en disant ». « Rabbi » conserve l’ancrage juif du récit, tandis que « pour qu’il naisse aveugle » maintient l’ambiguïté réelle entre but et conséquence.
