id: JHN.9.15
reference: John 9:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: πάλιν οὖν ἠρώτων αὐτὸν καὶ οἱ Φαρισαῖοι πῶς ἀνέβλεψεν. ὁ δὲ εἶπεν αὐτοῖς· Πηλὸν ἐπέθηκέν μου ἐπὶ τοὺς ὀφθαλμούς, καὶ ἐνιψάμην, καὶ βλέπω.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/015.yaml
  text: So the Pharisees also asked him again how he had received his sight[a]. He said to them, “He put mud on my eyes, and I washed[b], and I see.”
translation:
  language: fr
  text: 'Alors, les pharisiens lui demandèrent eux aussi de nouveau comment il avait retrouvé la vue. Il leur répondit : « Il m’a mis de la boue sur les yeux, je me suis lavé et je vois. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάλιν οὖν
  choice: Alors… de nouveau
  rationale: « Alors » assure naturellement la progression du récit sans donner à οὖν une force logique excessive; « de nouveau » marque la répétition de l’interrogatoire.
- source_word: καὶ οἱ Φαρισαῖοι
  choice: les pharisiens… eux aussi
  rationale: « Eux aussi » conserve la valeur additive de καί et indique que les pharisiens se joignent aux personnes qui l’ont déjà interrogé.
- source_word: ἠρώτων
  choice: demandèrent
  rationale: L’imparfait grec peut suggérer un interrogatoire en cours ou répété; en français, le passé simple avec « de nouveau » exprime clairement et naturellement cet aspect narratif.
- source_word: πῶς ἀνέβλεψεν
  choice: comment il avait retrouvé la vue
  rationale: Dans ce contexte de guérison d’un homme aveugle, ἀναβλέπω signifie recouvrer ou retrouver la vue. Le plus-que-parfait convient à la question rapportée après l’événement.
- source_word: Πηλὸν
  choice: de la boue
  rationale: πηλός peut désigner de la boue ou de l’argile; « boue » est ici le terme français courant et correspond à la matière préparée avec de la salive au verset 6.
- source_word: ἐπέθηκέν μου ἐπὶ τοὺς ὀφθαλμούς
  choice: Il m’a mis de la boue sur les yeux
  rationale: Cette formulation simple et idiomatique reproduit le geste de poser la matière sur les yeux.
- source_word: ἐνιψάμην
  choice: je me suis lavé
  rationale: Le moyen grec se rend naturellement par la forme pronominale française et renvoie, dans le contexte, au fait que l’homme s’est lavé les yeux.
- source_word: βλέπω
  choice: maintenant je vois
  rationale: Le présent grec souligne son état actuel. « Maintenant » rend explicite cette valeur résultative sans changer le sens contextuel.
theological_decisions: []
translation_notes:
  register: Français international moderne, courant et digne. La réponse brève de l’homme est conservée, avec une syntaxe orale naturelle. « Pharisiens » prend la minuscule conformément à l’usage français pour les membres d’un courant religieux.
