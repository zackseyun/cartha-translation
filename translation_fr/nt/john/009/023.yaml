  source_fidelity: 'Le sens général est juste : διὰ τοῦτο renvoie à ce qui précède, et les parents renvoient les enquêteurs à leur fils. Toutefois, « lui-même » est mieux rattaché à l’acte de répondre qu’à « interrogez-le », afin de refléter l’emphase de αὐτόν sans produire une tournure française un peu lourde. La note actuelle contient aussi « demandez-le-lui », qui ne rend pas correctement ἐπερωτήσατε αὐτόν.'
