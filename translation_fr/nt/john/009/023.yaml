  text: διὰ τοῦτο οἱ γονεῖς αὐτοῦ εἶπαν ὅτι Ἡλικίαν ἔχει, αὐτὸν ⸀ἐπερωτήσατε.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/023.yaml
  text: For this reason his parents said[a], “He is of age; ask him.”
translation:
  language: fr
  text: 'C’est pourquoi ses parents dirent : « Il est en âge de répondre lui-même[a] ; interrogez-le. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Il est assez âgé pour répondre lui-même. »'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: C’est pourquoi
  rationale: Cette expression renvoie à la crainte exposée au verset 22 et en marque naturellement la conséquence en français.
- source_word: οἱ γονεῖς αὐτοῦ
  choice: ses parents
  rationale: Le pluriel désigne collectivement le père et la mère de l’homme ; « ses parents » est l’équivalent français courant et précis.
- source_word: εἶπαν
  choice: dirent
  rationale: Le verbe signifie simplement qu’ils ont parlé ; « dirent » conserve cette valeur sans préciser indûment qu’il s’agissait d’une réponse.
- source_word: Ἡλικίαν ἔχει
  choice: Il est en âge de répondre
  rationale: L’expression idiomatique indique qu’il a l’âge requis pour parler en son propre nom. L’ajout « de répondre », impliqué par le contexte, rend l’expression claire et naturelle en français.
- source_word: αὐτὸν
  choice: lui-même
  rationale: 'Le pronom placé en tête du groupe verbal porte une emphase : c’est l’homme lui-même qu’il faut interroger.'
- source_word: ἐπερωτήσατε
  choice: interrogez
  rationale: L’impératif demande de lui adresser directement la question. « Interrogez » convient au contexte d’enquête et conserve une nuance légèrement plus formelle que « demandez ».
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple convient au registre narratif biblique. La formulation explicite le sens idiomatique de Ἡλικίαν ἔχει sans introduire de précision doctrinale.
