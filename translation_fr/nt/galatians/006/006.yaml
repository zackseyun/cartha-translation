source:
  edition: SBLGNT
  text: Κοινωνείτω δὲ ὁ κατηχούμενος τὸν λόγον τῷ κατηχοῦντι ἐν πᾶσιν ἀγαθοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/006.yaml
  text: Let the one who is taught the word share in all good things with the one who teaches.
translation:
  language: fr
  text: Que celui à qui l’on enseigne la Parole partage toutes sortes de bonnes choses avec celui qui l’enseigne.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « fasse participer celui qui l’enseigne à tous les biens » ; cela comprend vraisemblablement un soutien matériel.'
    reason: Alternative de construction pour κοινωνέω et ἐν πᾶσιν ἀγαθοῖς ; la note indique la probabilité d’un soutien matériel sans restreindre le sens du texte à celui-ci.
lexical_decisions:
- source_word: Κοινωνείτω
  choice: qu’il partage
  rationale: L’impératif présent appelle une pratique régulière. « Partager » conserve la portée large de κοινωνέω, qui désigne ici vraisemblablement un soutien concret sans se limiter explicitement à l’argent.
- source_word: δὲ
  choice: non exprimé séparément
  rationale: δέ marque une transition légère. En français, un connecteur comme « mais » surchargerait le contraste; la continuité peut rester implicite.
- source_word: ὁ κατηχούμενος τὸν λόγον
  choice: celui à qui l’on enseigne la Parole
  rationale: Cette formulation rend le participe passif présent de façon naturelle et évite le terme technique ultérieur « catéchumène ». « La Parole » désigne ici le message chrétien enseigné.
- source_word: τῷ κατηχοῦντι
  choice: celui qui l’enseigne
  rationale: Le participe actif désigne la personne qui dispense l’enseignement; le pronom reprend naturellement « la Parole ».
- source_word: ἐν πᾶσιν ἀγαθοῖς
  choice: tous ses biens
  rationale: Dans ce contexte de partage avec l’enseignant, ἀγαθά désigne vraisemblablement des biens ou ressources concrètes. L’ajout idiomatique du possessif explicite ce que le français exige naturellement sans réduire le soutien à l’argent seul.
theological_decisions:
- issue: Nature du partage prescrit
  choice: Un partage concret des biens avec la personne qui enseigne, susceptible d’inclure un soutien matériel.
  alternative: Une participation générale à toutes sortes de bonnes choses, notamment spirituelles.
  rationale: La construction de κοινωνέω avec le destinataire au datif et ἐν πᾶσιν ἀγαθοῖς favorise l’idée d’un partage pratique. Le texte reste cependant assez large pour ne pas limiter le commandement à une rémunération financière.
translation_notes:
  register: Français moderne, clair et digne. La structure corrélative « celui à qui… / celui qui… » reproduit le lien entre les deux participes grecs sans employer de vocabulaire ecclésiastique technique.
