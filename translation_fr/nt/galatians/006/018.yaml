id: GAL.6.18
reference: Galatians 6:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἡ χάρις τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ μετὰ τοῦ πνεύματος ὑμῶν, ἀδελφοί· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/018.yaml
  text: The grace of our Lord Jesus Christ be with your spirit[a], brothers[b]. Amen.
translation:
  language: fr
  text: Que la grâce de notre Seigneur Jésus le Messie soit avec votre esprit[a], frères[b]. Amen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec emploie « esprit » au singulier avec « votre » au pluriel, en s’adressant à toute la communauté.
    reason: clarification
  - marker: b
    text: Ici, « frères » s’adresse à la communauté croyante et peut inclure aussi bien les hommes que les femmes ; on pourrait aussi traduire « frères et sœurs ».
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις
  choice: grâce
  rationale: Terme consacré et naturel dans les bénédictions pauliniennes; il conserve à la fois la portée théologique et l’idée de faveur accordée.
- source_word: κυρίου
  choice: Seigneur
  rationale: Équivalent français usuel de κύριος dans la confession chrétienne primitive et dans cette formule de bénédiction.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jésus Christ
  rationale: En français courant, « Jésus Christ » demeure la formulation biblique la plus naturelle et la plus immédiatement intelligible; « Christ » conserve le titre grec traditionnellement translittéré, dont le sens est « Messie ».
- source_word: μετὰ
  choice: soit avec
  rationale: La phrase grecque est sans verbe, conformément au style des bénédictions; l’ajout de « soit » exprime naturellement en français la valeur optative de la formule.
- source_word: πνεύματος ὑμῶν
  choice: votre esprit
  rationale: Cette traduction garde le singulier πνεύματος avec le possessif pluriel ὑμῶν et préserve la formulation de Paul sans la réduire à un simple « vous ».
- source_word: ἀδελφοί
  choice: frères
  rationale: Le vocatif masculin pluriel est rendu directement; dans ce contexte communautaire, il peut désigner l’ensemble des croyants, femmes comprises, ce que précise la note.
- source_word: ἀμήν
  choice: Amen
  rationale: La translittération consacrée convient à cette conclusion liturgique.
theological_decisions:
- issue: Valeur du titre Χριστός dans la bénédiction finale
  choice: Christ
  alternative: Messie
  rationale: « Christ » est la forme française consacrée et naturelle dans le nom-titre « Jésus Christ ». Une note rappelle son sens afin de ne pas laisser le titre devenir un simple second nom.
- issue: Portée de ἀδελφοί dans une communauté chrétienne mixte
  choice: frères
  alternative: frères et sœurs
  rationale: « Frères » respecte la forme masculine plurielle du grec, tandis que la note explicite que l’adresse peut inclure les femmes de la communauté.
translation_notes:
  register: Français international moderne, digne et fluide. La tournure optative « Que… soit » restitue la bénédiction grecque sans verbe explicite. « Jésus Christ » privilégie l’usage français établi, tandis que les notes éclairent les formulations susceptibles d’être mal comprises.
