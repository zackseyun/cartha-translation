id: GAL.6.5
reference: Galatians 6:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἕκαστος γὰρ τὸ ἴδιον φορτίον βαστάσει.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/005.yaml
  text: For each one will carry his own load[a].
translation:
  language: fr
  text: Car chacun portera sa propre charge[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « son propre fardeau ». Le grec emploie ici φορτίον (« charge »), un mot différent de βάρη (« fardeaux ») au verset 2.
    reason: Variante lexicale et distinction contextuelle.
lexical_decisions:
- source_word: ἕκαστος
  choice: chacun
  rationale: Le pronom distributif singulier « chacun » souligne naturellement en français la responsabilité individuelle.
- source_word: γὰρ
  choice: car
  rationale: « Car » conserve le lien explicatif avec le contexte précédent sans préciser davantage la nature de l’argument.
- source_word: τὸ ἴδιον
  choice: sa propre
  rationale: Cette formulation rend l’idée de ce qui appartient en propre à chaque personne et s’accorde naturellement avec « chacun ».
- source_word: φορτίον
  choice: charge
  rationale: « Charge » exprime ce qui doit être porté tout en permettant de distinguer ce terme de βάρη, rendu par « fardeaux » au verset 2.
- source_word: βαστάσει
  choice: portera
  rationale: Le futur simple rend directement le futur actif grec et « porter » convient concrètement à une charge.
theological_decisions:
- issue: Rapport entre Galates 6.5 et Galates 6.2
  choice: Maintenir la distinction lexicale entre les « fardeaux » du verset 2 et la « charge » de chaque personne ici.
  alternative: Employer « fardeau » dans les deux versets, ou expliciter ici une responsabilité lors du jugement final.
  rationale: Le grec emploie deux noms différents dans le contexte immédiat. La traduction préserve cette nuance et la tension entre l’entraide mutuelle et la responsabilité personnelle, sans imposer une harmonisation ni une interprétation eschatologique précise.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase brève conserve l’ordre logique et la force distributive du grec.
