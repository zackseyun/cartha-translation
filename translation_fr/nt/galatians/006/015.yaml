id: GAL.6.15
reference: Galatians 6:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸂οὔτε γὰρ⸃ περιτομή τί ⸀ἐστιν οὔτε ἀκροβυστία, ἀλλὰ καινὴ κτίσις.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/015.yaml
  text: For neither circumcision counts for anything[a], nor uncircumcision[b], but a new creation.
translation:
  language: fr
  text: Car ni la circoncision ni l’incirconcision ne comptent ; ce qui compte, c’est une création nouvelle[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « une nouvelle créature ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὔτε γὰρ
  choice: Car ni
  rationale: « Car » conserve la valeur explicative de γάρ et relie le verset à l’argument précédent ; « ni » introduit la première partie de la corrélation οὔτε… οὔτε.
- source_word: περιτομή
  choice: la circoncision
  rationale: Terme français courant et précis, qui conserve à la fois la réalité du rite et sa portée identitaire dans le contexte paulinien.
- source_word: τί ἐστιν
  choice: ne comptent
  rationale: Dans cette tournure, τί ἐστιν exprime l’absence d’importance décisive. « Ne comptent » est naturel en français et évite la formulation peu idiomatique « ne sont rien » appliquée aux deux statuts.
- source_word: οὔτε ἀκροβυστία
  choice: ni l’incirconcision
  rationale: « Incirconcision » rend le statut opposé à la circoncision et préserve la symétrie du grec sans réduire le terme à son sens anatomique.
- source_word: ἀλλὰ
  choice: ce qui compte, c’est
  rationale: 'Cette formulation française explicite l’ellipse verbale après ἀλλά tout en maintenant le contraste fort : les deux statuts sont sans importance décisive, contrairement à la création nouvelle.'
- source_word: καινὴ κτίσις
  choice: une création nouvelle
  rationale: « Création nouvelle » conserve la portée potentiellement large de κτίσις et l’accent de καινή sur une nouveauté de nature. L’ordre nom-adjectif est idiomatique et soutenu en français.
theological_decisions:
- issue: Portée du contraste entre circoncision, incirconcision et création nouvelle
  choice: Le texte nie l’importance décisive des deux statuts et place l’accent sur la création nouvelle.
  alternative: Comprendre la phrase comme visant uniquement des marqueurs sociaux, ou comme affirmant que les deux statuts constituent des voies également valables.
  rationale: La traduction maintient le contraste absolu du grec sans préciser davantage la nature sotériologique, ecclésiale ou eschatologique de la « création nouvelle ».
- issue: Portée de καινὴ κτίσις
  choice: une création nouvelle
  alternative: une nouvelle créature
  rationale: « Création » préserve l’ambiguïté entre la réalité renouvelée d’une personne et l’œuvre créatrice plus vaste de Dieu ; « créature » restreindrait plus nettement le référent à un individu.
translation_notes:
  register: Français moderne, international et digne. La reprise « ce qui compte » rend naturelle en français la construction grecque elliptique et fortement contrastive, sans ajouter de contenu confessionnel.
