review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est bien rendu : la condition concessive, la faute, la restauration douce et l’avertissement contre la tentation sont conservés. Toutefois, « Mais » introduit une opposition absente du grec, et l’alternance « vous… rétablissez » / « veille sur toi-même » produit en français une rupture d’accord qui peut faire croire que l’ordre ne s’adresse plus au même groupe. Une formulation distributive rend naturellement le singulier grec sans perdre l’adresse plurielle.'
  naturalness: Le registre est moderne et digne. « Frères et sœurs », « quelqu’un », « faute » et « rétablissez » sont idiomatiques. La correction proposée supprime une transition injustifiée et remplace l’impératif singulier isolé par une tournure française fluide.
  terminology: « Vous qui êtes spirituels » préserve l’ouverture de οἱ πνευματικοί; « dans un esprit de douceur » ne tranche pas indûment la portée de πνεῦμα; « rétablissez » conserve la finalité réparatrice de καταρτίζετε. « Frères et sœurs » est une explicitation française recevable de l’adresse communautaire, avec une note sur le masculin grec.
  issues:
  - severity: medium
    issue: Ajout de « Mais »
    rationale: Aucune particule adversative ne figure dans le grec entre l’ordre de restaurer et l’avertissement personnel. « Mais » suggère une opposition qui n’est pas exprimée.
  - severity: medium
    issue: Discordance française dans « vous… rétablissez… veille sur toi-même »
    rationale: Le grec passe effectivement au singulier dans le participe et dans « toi aussi », mais un impératif singulier autonome après un impératif pluriel est syntaxiquement et pragmatiquement maladroit en français. « Que chacun de vous veille sur lui-même » rend la portée distributive du singulier sans altérer le sens.
