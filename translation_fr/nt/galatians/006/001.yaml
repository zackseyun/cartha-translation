id: GAL.6.1
reference: Galatians 6:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἀδελφοί, ἐὰν καὶ προλημφθῇ ἄνθρωπος ἔν τινι παραπτώματι, ὑμεῖς οἱ πνευματικοὶ καταρτίζετε τὸν τοιοῦτον ἐν πνεύματι πραΰτητος, σκοπῶν σεαυτόν, μὴ καὶ σὺ πειρασθῇς.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/001.yaml
  text: Brothers[a], even if a man is caught in some trespass, you who are spiritual should restore such a one in a spirit of gentleness, watching yourself[c][b], lest you also be tempted.
translation:
  language: fr
  text: Frères et sœurs[a], même si quelqu’un est pris dans une faute[b], vous qui êtes spirituels, rétablissez cette personne dans un esprit de douceur, et que chacun de vous veille sur lui-même, de peur que lui aussi ne soit tenté.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec emploie ici le pluriel masculin « frères », qui peut s’adresser à l’ensemble des croyants, hommes et femmes.
    reason: lexical_alternative
  - marker: b
    text: Ou « est rattrapé par une faute », « est surpris par une faute » ou « est pris en faute ».
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀδελφοί
  choice: Frères et sœurs
  rationale: Le vocatif masculin pluriel peut désigner l’ensemble des croyants, hommes et femmes. Cette formulation courante en français moderne explicite naturellement cette portée, tandis qu’une note signale la forme grecque.
- source_word: ἐὰν καὶ
  choice: même si
  rationale: La tournure rend la valeur conditionnelle et concessive de l’expression grecque.
- source_word: προλημφθῇ
  choice: est pris
  rationale: Le passif peut évoquer une personne surprise, rattrapée ou prise par la faute. « Est pris » reste concis et permet de conserver cette latitude grâce à une note.
- source_word: ἄνθρωπος
  choice: quelqu’un
  rationale: Dans ce contexte, le singulier ἄνθρωπος a une portée générique. « Quelqu’un » est naturel et n’ajoute aucune précision de sexe absente de la référence visée.
- source_word: ἔν τινι παραπτώματι
  choice: dans une faute
  rationale: παράπτωμα désigne un faux pas ou une transgression. « Faute » exprime clairement la dimension morale sans employer un terme inutilement technique.
- source_word: οἱ πνευματικοὶ
  choice: vous qui êtes spirituels
  rationale: Cette traduction conserve l’adjectif substantivé et son ambiguïté entre maturité spirituelle et caractérisation par l’Esprit.
- source_word: καταρτίζετε
  choice: rétablissez
  rationale: L’impératif désigne la remise en bon état ou le réajustement. « Rétablissez » garde l’idée de restauration plutôt que celle d’une simple réprimande.
- source_word: τὸν τοιοῦτον
  choice: cette personne
  rationale: L’expression renvoie au cas singulier qui vient d’être évoqué; cette formulation est idiomatique en français actuel.
- source_word: ἐν πνεύματι πραΰτητος
  choice: dans un esprit de douceur
  rationale: La formulation conserve la référence possible à une disposition intérieure tout en laissant résonner le rôle de l’Esprit dans la douceur.
- source_word: σκοπῶν σεαυτόν
  choice: veille sur toi-même
  rationale: Le participe au singulier interpelle personnellement chaque membre du groupe chargé de rétablir l’autre. Le français conserve ce passage du pluriel au singulier.
- source_word: μὴ καὶ σὺ πειρασθῇς
  choice: de peur que toi aussi, tu ne sois tenté
  rationale: La formulation rend l’avertissement négatif, souligne par « toi aussi » la vulnérabilité commune et retient le sens moral probable de πειράζω.
theological_decisions:
- issue: Portée de οἱ πνευματικοὶ
  choice: vous qui êtes spirituels
  alternative: vous qui vivez par l’Esprit
  rationale: Le texte peut viser ceux qui font preuve de maturité spirituelle ou ceux dont la vie est conduite par l’Esprit. La traduction choisie ne tranche pas entre ces nuances.
- issue: Sens de πνεῦμα dans ἐν πνεύματι πραΰτητος
  choice: dans un esprit de douceur
  alternative: avec la douceur que donne l’Esprit
  rationale: Le grec peut mettre l’accent sur la disposition humaine sans exclure son origine dans l’Esprit. La traduction conserve cette tension au lieu d’identifier explicitement πνεῦμα au Saint-Esprit.
- issue: Valeur de προλημφθῇ
  choice: est pris dans une faute
  alternative: est surpris par une faute; est pris en faute
  rationale: Le verbe peut décrire quelqu’un rattrapé ou surpris par la faute, ou découvert en faute. Le texte principal évite de fixer entièrement le scénario, et la note présente les principales nuances.
- issue: Passage du pluriel au singulier dans l’exhortation
  choice: vous… rétablissez; veille sur toi-même
  alternative: vous… rétablissez; veillez chacun sur vous-même
  rationale: Le maintien du singulier reproduit l’interpellation personnelle marquée par σκοπῶν σεαυτόν et σὺ, sans effacer le changement grammatical du grec.
translation_notes:
  register: Français international moderne, clair et digne. « Frères et sœurs » convient à une adresse communautaire actuelle; « rétablissez » préserve la visée réparatrice de l’impératif. Le passage du pluriel au singulier est volontaire et suit de près la structure grecque.
