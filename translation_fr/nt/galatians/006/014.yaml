id: GAL.6.14
reference: Galatians 6:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐμοὶ δὲ μὴ γένοιτο καυχᾶσθαι εἰ μὴ ἐν τῷ σταυρῷ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, δι’ οὗ ἐμοὶ κόσμος ἐσταύρωται ⸀κἀγὼ κόσμῳ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/014.yaml
  text: But far be it from me to boast except in the cross of our Lord Jesus the Messiah[a], through which the world has been crucified to me[b], and I to the world.
translation:
  language: fr
  text: Mais pour moi, qu’il ne soit jamais question de me glorifier, sinon dans la croix de notre Seigneur Jésus le Messie, par laquelle[a] le monde a été crucifié pour moi, et moi pour le monde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « par qui », si le pronom relatif renvoie au Seigneur Jésus le Messie plutôt qu’à la croix.
    reason: alternative_reading
lexical_decisions:
- source_word: μὴ γένοιτο
  choice: qu’il ne soit jamais question de
  rationale: Cette tournure française exprime une répudiation énergique tout en conservant le lien personnel introduit par « pour moi ».
- source_word: καυχᾶσθαι
  choice: me glorifier
  rationale: Dans ce contexte paulinien, « se glorifier » rend le fait de tirer sa fierté ou son motif d’honneur de quelque chose et convient au registre biblique sans être obscur.
- source_word: εἰ μὴ
  choice: sinon
  rationale: La conjonction introduit ici l’unique exception, c’est-à-dire le seul motif légitime de se glorifier.
- source_word: σταυρῷ
  choice: croix
  rationale: « Croix » est l’équivalent français conventionnel et contextuellement exact dans l’évocation de la mort de Jésus.
- source_word: κυρίου
  choice: Seigneur
  rationale: « Seigneur » est le rendu français naturel du titre κύριος dans ce contexte confessionnel.
- source_word: Χριστοῦ
  choice: le Messie
  rationale: Le titre grec Χριστός signifie « Messie »; sa traduction préserve ici son contenu sémantique plutôt que de le traiter uniquement comme un nom propre.
- source_word: δι’ οὗ
  choice: par laquelle
  rationale: Le pronom relatif masculin singulier peut grammaticalement reprendre σταυρός, également masculin en grec. En français, l’accord féminin avec « croix » est nécessaire; « par laquelle » exprime la valeur instrumentale.
- source_word: κόσμος
  choice: le monde
  rationale: « Le monde » conserve l’étendue et la possible densité théologique de κόσμος sans expliciter de manière interprétative « l’ordre présent du monde ».
- source_word: ἐσταύρωται
  choice: a été crucifié
  rationale: Le passé composé passif rend l’action accomplie et son résultat durable, tout en conservant la métaphore de la crucifixion.
- source_word: κἀγὼ κόσμῳ
  choice: et moi pour le monde
  rationale: Le grec omet le verbe dans le second membre. Le français peut garder cette ellipse claire et préserver ainsi le parallélisme ramassé de la phrase.
theological_decisions:
- issue: Traduction de Χριστοῦ dans « Ἰησοῦ Χριστοῦ »
  choice: Jésus le Messie
  alternative: Jésus-Christ
  rationale: Χριστός conserve ici sa valeur de titre. « Jésus le Messie » en traduit explicitement le sens sans introduire de particularité confessionnelle.
- issue: Antécédent de δι’ οὗ
  choice: 'la croix : « par laquelle »'
  alternative: 'le Seigneur Jésus le Messie : « par qui »'
  rationale: L’antécédent le plus proche est « la croix »; en grec, σταυρός et οὗ sont tous deux masculins singuliers. Cette lecture respecte la syntaxe immédiate, tandis que l’autre demeure grammaticalement possible puisque les référents personnels précédents sont eux aussi masculins.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve la vigueur de la répudiation initiale, le vocabulaire paulinien de la glorification, le titre « Messie » et l’ellipse finale. Le marqueur [a] est placé après la proposition concernée.
