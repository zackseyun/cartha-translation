id: GAL.6.8
reference: Galatians 6:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὅτι ὁ σπείρων εἰς τὴν σάρκα ἑαυτοῦ ἐκ τῆς σαρκὸς θερίσει φθοράν, ὁ δὲ σπείρων εἰς τὸ πνεῦμα ἐκ τοῦ πνεύματος θερίσει ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/008.yaml
  text: For the one who sows to his own flesh will reap corruption from the flesh[c][b][a], but the one who sows to the Spirit will reap eternal life from the Spirit.
translation:
  language: fr
  text: Car celui qui sème pour sa propre chair[a] récoltera de la chair la corruption[b], mais celui qui sème pour l’Esprit[c] récoltera de l’Esprit la vie éternelle.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sa propre nature pécheresse ». Le mot grec traduit par « chair » peut désigner le corps humain ou, dans les contrastes éthiques de Paul, l’orientation humaine déchue qui s’oppose à l’Esprit.
    reason: lexical_alternative
  - marker: b
    text: Ou « la ruine » ou « la dégradation ». Le terme grec peut désigner la corruption, la ruine ou le dépérissement.
    reason: lexical_alternative
  - marker: c
    text: Il s’agit vraisemblablement du Saint-Esprit. Le grec ancien ne distingue pas « Esprit » et « esprit » par des majuscules, mais, dans Galates, ce contraste renvoie habituellement à l’Esprit de Dieu.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: Car
  rationale: Dans le contexte, la conjonction introduit la raison qui fonde l’exhortation précédente. « Car » en conserve naturellement la valeur explicative.
- source_word: ὁ σπείρων
  choice: celui qui sème
  rationale: Le participe présent substantivé a une portée générale. Cette formulation préserve le caractère proverbial et la métaphore agricole.
- source_word: εἰς τὴν σάρκα ἑαυτοῦ
  choice: pour sa propre chair
  rationale: Avec σπείρω, εἰς indique ici l’orientation ou le bénéficiaire de l’action. « Pour » est idiomatique en français, tandis que « sa propre » restitue l’accent du réfléchi ἑαυτοῦ. « Chair » conserve le vocabulaire paulinien sans le réduire à une paraphrase interprétative.
- source_word: ἐκ τῆς σαρκὸς
  choice: de la chair
  rationale: ἐκ marque la source. « De la chair » maintient le parallélisme avec « de l’Esprit ».
- source_word: θερίσει
  choice: récoltera
  rationale: Le verbe maintient clairement le rapport entre semer et récolter dans l’image agricole.
- source_word: φθοράν
  choice: la corruption
  rationale: Le terme peut désigner la corruption, la dégradation ou la ruine. « Corruption » conserve cette amplitude sémantique et la tension morale et eschatologique du passage.
- source_word: ὁ δὲ σπείρων
  choice: mais celui qui sème
  rationale: « Mais » exprime le contraste introduit par δέ, et la répétition de la structure fait ressortir l’antithèse équilibrée.
- source_word: εἰς τὸ πνεῦμα
  choice: pour l’Esprit
  rationale: Dans le contraste chair/Esprit propre à Galates, πνεῦμα désigne très probablement l’Esprit de Dieu. La majuscule indique ce référent contextuel.
- source_word: ἐκ τοῦ πνεύματος
  choice: de l’Esprit
  rationale: ἐκ exprime la source; la formulation reproduit le parallélisme précis avec « de la chair ».
- source_word: ζωὴν αἰώνιον
  choice: la vie éternelle
  rationale: Expression française établie, exacte et naturelle pour désigner la vie caractérisée par l’âge à venir et sa durée sans fin.
theological_decisions:
- issue: Sens de σάρξ dans le contraste éthique paulinien
  choice: chair
  alternative: nature pécheresse
  rationale: Même si le contexte est éthique, « chair » préserve le terme et la tension théologique de Paul. « Nature pécheresse » expliciterait une interprétation possible tout en risquant de rétrécir le sens.
- issue: Référent de πνεῦμα
  choice: Esprit
  alternative: esprit
  rationale: Dans Galates, notamment dans l’opposition entre chair et Esprit, le référent le plus probable est l’Esprit de Dieu. La note reconnaît néanmoins que le grec ancien ne distingue pas ce sens par une majuscule.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe équilibrée conserve l’antithèse et l’image agricole du grec. « Pour sa propre chair » est plus naturel que le calque « dans sa propre chair », tout en gardant l’idée d’orientation de l’action. Les marqueurs de notes sont placés immédiatement après les expressions concernées.
