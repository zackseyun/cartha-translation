id: GAL.6.4
reference: Galatians 6:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τὸ δὲ ἔργον ἑαυτοῦ δοκιμαζέτω ἕκαστος, καὶ τότε εἰς ἑαυτὸν μόνον τὸ καύχημα ἕξει καὶ οὐκ εἰς τὸν ἕτερον,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/004.yaml
  text: But let each one test his own work[a], and then he will have his reason for boasting in himself alone and not in the other person[b],
translation:
  language: fr
  text: Mais que chacun examine son propre travail. Alors il aura de quoi se glorifier, à son propre sujet seulement et non à celui d’un autre.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « son sujet de gloire ». Le terme grec peut désigner soit le fait de se glorifier, soit ce qui en fournit le motif.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔργον
  choice: travail
  rationale: '« Travail » garde la portée générale du terme grec : il peut désigner ici ce qu’une personne accomplit ou l’ensemble de sa conduite, sans réduire le sens à un acte isolé.'
- source_word: δοκιμαζέτω
  choice: qu’il examine
  rationale: L’impératif appelle chacun à soumettre son propre travail à l’épreuve afin d’en apprécier la qualité. « Examiner » exprime naturellement cette évaluation sans présumer qu’elle aboutira à une approbation.
- source_word: ἕκαστος
  choice: chacun
  rationale: « Chacun » conserve la valeur distributive du grec et s’accorde avec les formes singulières qui suivent.
- source_word: ἑαυτοῦ
  choice: son propre
  rationale: Le réfléchi insiste sur le travail de la personne elle-même, par opposition à celui d’autrui.
- source_word: καύχημα
  choice: de quoi se glorifier
  rationale: Cette formulation rend naturellement l’idée du motif ou du fondement permettant de se glorifier, tout en laissant une note signaler que le nom grec peut aussi renvoyer à la glorification elle-même.
- source_word: εἰς ἑαυτὸν μόνον
  choice: par rapport à lui-même seulement
  rationale: La formulation conserve l’orientation vers soi-même et la force restrictive de μόνον, tout en rendant explicite le contraste avec l’évaluation fondée sur autrui.
- source_word: τὸν ἕτερον
  choice: quelqu’un d’autre
  rationale: Le grec désigne une autre personne mise en contraste avec soi. Cette expression est claire et naturelle en français moderne.
- source_word: δέ
  choice: Mais
  rationale: La conjonction marque ici une légère opposition avec ce qui précède; « Mais » rend clairement cette transition.
theological_decisions:
- issue: Portée de καύχημα dans le contexte paulinien
  choice: « de quoi se glorifier »
  alternative: « sa fierté » ou « son sujet de gloire »
  rationale: 'Ce choix préserve l’idée possible d’un fondement de glorification sans transformer le propos en approbation de l’orgueil. Il ne tranche pas non plus la question de savoir si cette glorification est moralement positive : l’accent du verset reste sur l’examen de soi sans comparaison avec autrui.'
- issue: Rapport entre l’examen de soi et autrui
  choice: « par rapport à lui-même seulement, et non par rapport à quelqu’un d’autre »
  alternative: « en lui seul, et non en l’autre »
  rationale: Cette traduction rend le contraste porté par les deux groupes introduits par εἰς sans ajouter que la personne serait indépendante de Dieu ni nier la responsabilité mutuelle affirmée dans le contexte.
translation_notes:
  register: Français moderne, sobre et digne. Le singulier générique « chacun » permet de suivre la structure grecque sans lourdeur. La division en deux phrases clarifie le rapport logique tout en conservant l’enchaînement du texte source.
