id: GAL.6.12
reference: Galatians 6:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὅσοι θέλουσιν εὐπροσωπῆσαι ἐν σαρκί, οὗτοι ἀναγκάζουσιν ὑμᾶς περιτέμνεσθαι, μόνον ⸀ἵνα τῷ σταυρῷ τοῦ ⸀Χριστοῦ ⸀μὴ διώκωνται·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/012.yaml
  text: As many as want to make a good showing in the flesh[a], these are forcing you to be circumcised[c][b], only so that they may not be persecuted for the cross of the Messiah.
translation:
  language: fr
  text: Tous ceux qui veulent faire bonne figure dans la chair[a], ce sont eux qui vous contraignent à vous faire circoncire, uniquement pour ne pas être persécutés à cause de la croix du Messie[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « faire bonne impression extérieurement ».'
    reason: lexical_alternative
  - marker: b
    text: 'Traduction traditionnelle : « la croix du Christ ».'
    reason: alternative_rendering
lexical_decisions:
- source_word: ὅσοι
  choice: Tous ceux qui
  rationale: Cette tournure française naturelle conserve la portée globale de l’expression grecque, qui désigne toute une catégorie de personnes.
- source_word: θέλουσιν
  choice: veulent
  rationale: Rend simplement et directement la volonté exprimée par le présent grec.
- source_word: εὐπροσωπῆσαι
  choice: faire bonne figure
  rationale: Expression française courante qui évoque le souci de paraître favorablement et laisse entendre la critique d’une apparence extérieure.
- source_word: ἐν σαρκί
  choice: dans la chair
  rationale: Conserve le terme paulinien chargé de sens et son ambiguïté entre la sphère corporelle, l’apparence extérieure et une logique proprement humaine; la note explicite le sens contextuel probable.
- source_word: οὗτοι
  choice: ce sont eux qui
  rationale: Restitue l’insistance du démonstratif grec en désignant avec force les personnes mêmes qui exercent cette pression.
- source_word: ἀναγκάζουσιν
  choice: contraignent
  rationale: Exprime clairement la pression coercitive du verbe grec; le présent indique une action en cours.
- source_word: ὑμᾶς περιτέμνεσθαι
  choice: vous contraignent à vous faire circoncire
  rationale: Le français pronominal rend naturellement l’infinitif passif et conserve la référence concrète à la circoncision.
- source_word: μόνον ἵνα
  choice: uniquement pour
  rationale: Rend à la fois la restriction de μόνον et le but exprimé par ἵνα dans une formulation française fluide.
- source_word: τῷ σταυρῷ
  choice: à cause de la croix
  rationale: Explicite la valeur causale ou référentielle du datif avec le passif de διώκω et évite l’ambiguïté peu naturelle de «pour la croix» en français.
- source_word: τοῦ Χριστοῦ
  choice: du Messie
  rationale: Dans ce génitif, Χριστός garde nettement sa valeur de titre; «Messie» en transmet le sens plutôt que de le traiter comme un simple nom propre.
- source_word: μὴ διώκωνται
  choice: pour ne pas être persécutés
  rationale: Conserve la valeur de but et la voix passive du subjonctif grec dans un français idiomatique.
theological_decisions:
- issue: Sens de ἐν σαρκί
  choice: dans la chair
  alternative: extérieurement; dans le domaine des apparences
  rationale: Le texte principal conserve le vocabulaire paulinien et sa tension sémantique sans le réduire à la seule apparence physique. La note donne le sens contextuel probable lié à la circoncision et au prestige visible.
- issue: Valeur de Χριστοῦ dans τῷ σταυρῷ τοῦ Χριστοῦ
  choice: la croix du Messie
  alternative: la croix du Christ
  rationale: Le génitif conserve ici la portée titulaire de Χριστός. «Messie» traduit ce titre, tandis que la note préserve la formulation française traditionnelle.
- issue: Rapport du datif τῷ σταυρῷ avec διώκωνται
  choice: persécutés à cause de la croix
  alternative: persécutés pour la croix
  rationale: Le datif peut exprimer la cause ou la référence. La formulation retenue transmet clairement le motif de la persécution sans préciser davantage comment la proclamation de la croix la provoque.
translation_notes:
  register: Français international moderne, digne et accessible. « Faire bonne figure » est idiomatique sans être familier; « contraignent » maintient la force polémique du passage. La syntaxe « ce sont eux qui » préserve l’emphase du grec.
