id: GAL.6.17
reference: Galatians 6:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Τοῦ λοιποῦ κόπους μοι μηδεὶς παρεχέτω, ἐγὼ γὰρ τὰ στίγματα ⸀τοῦ Ἰησοῦ ἐν τῷ σώματί μου βαστάζω.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/017.yaml
  text: From now on let no one cause me trouble[a], for I bear the marks of Jesus on my body.
translation:
  language: fr
  text: Désormais, que personne ne me cause d’ennuis, car je porte sur mon corps les marques de Jésus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot grec peut désigner des marques corporelles servant à indiquer l’appartenance ou l’allégeance.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῦ λοιποῦ
  choice: Désormais
  rationale: Expression temporelle idiomatique signifiant « à partir de maintenant ». « Désormais » convient au ton ferme et conclusif de Paul.
- source_word: κόπους μοι μηδεὶς παρεχέτω
  choice: que personne ne me cause d’ennuis
  rationale: Dans l’expression κόπους παρέχειν, κόπους désigne les peines ou désagréments causés à quelqu’un. La tournure française rend naturellement l’impératif prohibitif à la troisième personne.
- source_word: τὰ στίγματα
  choice: les marques
  rationale: Le terme désigne des marques corporelles, qui peuvent notamment être des marques d’appartenance. « Marques » reste transparent et ne réduit pas le sens à des cicatrices ou à des marques au fer.
- source_word: τοῦ Ἰησοῦ
  choice: de Jésus
  rationale: Le génitif est conservé sans préciser s’il indique l’appartenance, la cause ou l’identification avec Jésus.
- source_word: ἐν τῷ σώματί μου
  choice: sur mon corps
  rationale: Bien que ἐν signifie littéralement « dans », le français emploie naturellement « sur » pour situer des marques corporelles visibles.
- source_word: βαστάζω
  choice: je porte
  rationale: « Porter » rend directement l’idée de βαστάζω et convient à des marques présentes sur le corps.
theological_decisions:
- issue: Nature des στίγματα de Paul
  choice: 'Formulation neutre : « les marques de Jésus »'
  alternative: « les cicatrices reçues pour Jésus » ou « les marques indiquant que j’appartiens à Jésus »
  rationale: Le terme peut évoquer des traces physiques de persécution ainsi que l’appartenance et l’identification à Jésus. Le texte ne tranche pas explicitement entre ces dimensions; la traduction conserve donc cette tension.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase conserve la fermeté de l’exhortation finale et l’ambiguïté du génitif « de Jésus ».
