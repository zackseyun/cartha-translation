  text: τὸ δὲ καλὸν ποιοῦντες μὴ ⸀ἐγκακῶμεν, καιρῷ γὰρ ἰδίῳ θερίσομεν μὴ ἐκλυόμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/009.yaml
  text: And let us not grow weary in doing good[a], for in due time we will reap[c][b], if we do not give up.
translation:
  language: fr
  text: Ne nous lassons pas de faire le bien, car, au moment voulu[a], nous récolterons, si nous ne faiblissons pas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en son temps » ou « au moment approprié ».
    reason: lexical_alternative
  - marker: b
    text: Ou « sans défaillir », « sans nous décourager » ou « sans abandonner ».
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ καλὸν ποιοῦντες
  choice: de faire le bien
  rationale: L’adjectif neutre substantivé avec ποιέω forme une expression signifiant « faire ce qui est bon ». « Faire le bien » est naturel en français et conserve la portée éthique de l’expression.
- source_word: μὴ ἐγκακῶμεν
  choice: Ne nous lassons pas
  rationale: Le verbe exprime la perte de courage ou la lassitude qui risque de conduire à l’abandon. Cette formulation française convient à l’exhortation et maintient la distinction avec ἐκλυόμενοι.
- source_word: καιρῷ ... ἰδίῳ
  choice: au moment voulu
  rationale: καιρός désigne ici le moment approprié, tandis que ἴδιος souligne qu’il lui est propre. « Au moment voulu » rend naturellement l’idée du temps convenable sans préciser explicitement qui le détermine.
- source_word: θερίσομεν
  choice: nous récolterons
  rationale: Le futur prolonge la métaphore agricole du contexte. « Récolter » est courant en français moderne et garde cette image.
- source_word: μὴ ἐκλυόμενοι
  choice: si nous ne nous relâchons pas
  rationale: Le participe peut décrire le fait de faiblir, de s’épuiser ou de se relâcher. La proposition conditionnelle explicite sa valeur contextuelle tout en évitant de répéter « se lasser ».
theological_decisions:
- issue: Rapport entre les deux expressions de persévérance ἐγκακῶμεν et ἐκλυόμενοι
  choice: Les différencier par « ne nous lassons pas » et « si nous ne nous relâchons pas ».
  alternative: « ne perdons pas courage » et « sans défaillir »
  rationale: Paul emploie deux expressions proches mais non identiques. Les différencier préserve le mouvement rhétorique et la tension de l’exhortation sans définir au-delà du texte la nature théologique de la condition.
- issue: Valeur de μὴ ἐκλυόμενοι
  choice: Exprimer sa portée contextuellement conditionnelle par « si nous ne nous relâchons pas ».
  alternative: 'Conserver une tournure circonstancielle : « sans nous relâcher » ou « sans défaillir ».'
  rationale: Le participe peut être compris comme une circonstance négative portant une nuance conditionnelle. La traduction choisie rend cette relation intelligible tout en signalant l’alternative dans une note.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition exhortative est conservée, ainsi que la métaphore agricole. Les deux verbes liés à la persévérance sont rendus par des expressions distinctes.
