id: GAL.6.2
reference: Galatians 6:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀλλήλων τὰ βάρη βαστάζετε, καὶ οὕτως ⸀ἀναπληρώσετε τὸν νόμον τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/002.yaml
  text: Carry one another’s burdens[a], and in this way you will fulfill the law of Messiah.
translation:
  language: fr
  text: Portez les fardeaux les uns des autres, et vous accomplirez ainsi la loi du Messie[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « du Christ ».'
    reason: Autre manière traditionnelle de rendre le titre grec Χριστός.
lexical_decisions:
- source_word: ἀλλήλων
  choice: les uns des autres
  rationale: Cette expression réciproque naturelle en français préserve l’idée de mutualité au sein de la communauté.
- source_word: τὰ βάρη
  choice: les fardeaux
  rationale: « Fardeaux » rend le sens métaphorique de poids, de difficultés ou d’épreuves que d’autres ont à porter.
- source_word: βαστάζετε
  choice: Portez
  rationale: L’impératif présent pluriel appelle la communauté à une pratique continue; « portez » est direct, naturel et conserve l’image du fardeau.
- source_word: οὕτως
  choice: ainsi
  rationale: « Ainsi » relie clairement l’action commandée à son résultat, sans alourdir la phrase.
- source_word: ἀναπληρώσετε
  choice: vous accomplirez
  rationale: Le futur de l’indicatif est conservé. Avec « loi », « accomplir » exprime naturellement la mise en œuvre pleine de ce qu’elle demande.
- source_word: τὸν νόμον
  choice: la loi
  rationale: « Loi » conserve le sens ordinaire de νόμος ainsi que sa portée éthique et ses résonances pauliniennes, sans le réduire à un simple principe.
- source_word: τοῦ Χριστοῦ
  choice: du Messie
  rationale: Dans cette construction, Χριστός garde sa valeur de titre; « Messie » en rend le sens et le contexte juif messianique en français.
theological_decisions:
- issue: Traduction de Χριστοῦ
  choice: du Messie
  alternative: du Christ
  rationale: Le grec peut être rendu par le titre traduit « Messie » ou par la forme traditionnelle « Christ ». Le texte principal retient « Messie » pour expliciter la valeur du titre, tandis que la note préserve l’autre formulation française bien établie.
translation_notes:
  register: Français international moderne, clair et digne. La formulation reste concise, garde l’image concrète des fardeaux et conserve la relation entre l’impératif et le futur de résultat.
