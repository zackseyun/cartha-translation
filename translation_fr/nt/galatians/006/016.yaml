id: GAL.6.16
reference: Galatians 6:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ὅσοι τῷ κανόνι τούτῳ στοιχήσουσιν, εἰρήνη ἐπ’ αὐτοὺς καὶ ἔλεος, καὶ ἐπὶ τὸν Ἰσραὴλ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/016.yaml
  text: And as many as will walk by this rule—peace be upon them and mercy[c][b][a], and upon the Israel of God.
translation:
  language: fr
  text: 'Et tous ceux qui marcheront selon cette règle[a] : paix et miséricorde sur eux, et sur l’Israël de Dieu[b][c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tous ceux qui suivront cette norme ». Le verbe évoque le fait de marcher en ligne, de rester dans le rang ou de régler sa conduite sur une norme.
    reason: lexical_alternative
  - marker: b
    text: 'L’expression « l’Israël de Dieu » est débattue : Paul peut désigner les Juifs croyants, l’ensemble de l’Église ou, plus largement, le peuple de Dieu. La traduction conserve la formulation grecque sans trancher.'
    reason: alternative_reading
  - marker: c
    text: Le dernier « et » peut soit ajouter un autre groupe (« et sur l’Israël de Dieu »), soit reformuler le groupe déjà mentionné (« c’est-à-dire sur l’Israël de Dieu »).
    reason: alternative_reading
lexical_decisions:
- source_word: ὅσοι
  choice: tous ceux qui
  rationale: Rend naturellement en français la portée collective et indéfinie du relatif grec, sans restreindre le groupe visé.
- source_word: κανόνι
  choice: règle
  rationale: Le terme désigne ici une norme qui oriente la conduite. « Règle » est concis, courant et proche de la formulation grecque.
- source_word: στοιχήσουσιν
  choice: marcheront selon
  rationale: Conserve l’image de la marche ordonnée conformément à une norme, tout en restant compréhensible en français moderne.
- source_word: εἰρήνη
  choice: paix
  rationale: Équivalent usuel dans une formule de bénédiction.
- source_word: ἔλεος
  choice: miséricorde
  rationale: Équivalent traditionnel et précis dans ce contexte de bénédiction divine.
- source_word: ἐπ’ αὐτοὺς ... καὶ ἐπὶ
  choice: sur eux, et sur
  rationale: Reproduit la préposition répétée et maintient la tonalité solennelle de la bénédiction.
- source_word: Ἰσραὴλ τοῦ θεοῦ
  choice: l’Israël de Dieu
  rationale: Rend directement le génitif grec et laisse ouverte l’identité exacte du groupe désigné.
theological_decisions:
- issue: Référent de « l’Israël de Dieu »
  choice: La formulation grecque est conservée sans préciser le groupe visé.
  alternative: Les Juifs croyants, l’ensemble de l’Église, ou plus largement tout le peuple de Dieu.
  rationale: Le référent est débattu et le texte grec ne tranche pas explicitement; la traduction ne doit pas imposer une conclusion confessionnelle.
- issue: Valeur du dernier καί
  choice: Traduit par « et », avec une valeur laissée ouverte.
  alternative: Une addition désignant un autre groupe, ou une reformulation appositive du même groupe (« c’est-à-dire l’Israël de Dieu »).
  rationale: Le simple « et » préserve l’ambiguïté syntaxique et théologique du grec.
translation_notes:
  register: Français international moderne, digne et lisible. La tournure brève sans verbe explicite dans « paix et miséricorde sur eux » conserve le caractère de bénédiction du grec. L’image paulinienne de la marche est maintenue sans archaïsme excessif.
