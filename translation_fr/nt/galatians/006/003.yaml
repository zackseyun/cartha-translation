id: GAL.6.3
reference: Galatians 6:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἰ γὰρ δοκεῖ τις εἶναί τι μηδὲν ὤν, ⸂φρεναπατᾷ ἑαυτόν⸃·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/003.yaml
  text: For if anyone thinks he is something when he is nothing[a], he deceives himself.
translation:
  language: fr
  text: En effet, si quelqu’un pense être quelque chose alors qu’il n’est rien, il se trompe lui-même.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « il s’illusionne ».'
    reason: Alternative lexicale pour φρεναπατᾷ, qui peut désigner le fait de se tromper ou de s’abuser mentalement.
lexical_decisions:
- source_word: εἰ γὰρ
  choice: En effet, si
  rationale: Cette formulation rend à la fois la valeur explicative de γάρ et la valeur conditionnelle de εἰ, tout en restant naturelle en français.
- source_word: δοκεῖ
  choice: pense
  rationale: Le verbe désigne ici le jugement que la personne porte sur elle-même, et non l’impression qu’elle donne aux autres.
- source_word: τις
  choice: quelqu’un
  rationale: Le pronom indéfini a une portée générale; « quelqu’un » convient naturellement au singulier en français.
- source_word: εἶναί τι
  choice: être quelque chose
  rationale: Cette traduction conserve l’expression concise de Paul et son contraste direct avec « rien », sans expliciter excessivement l’idée d’importance.
- source_word: μηδὲν ὤν
  choice: alors qu’il n’est rien
  rationale: La tournure exprime naturellement en français le contraste implicite du participe, sans ajouter une explication étrangère au texte.
- source_word: φρεναπατᾷ
  choice: se trompe
  rationale: Le verbe évoque une tromperie qui agit sur l’esprit; « se trompe lui-même » est clair et idiomatique, tandis que « s’illusionne » constitue une autre possibilité.
- source_word: ἑαυτόν
  choice: lui-même
  rationale: Le pronom réfléchi renvoie au sujet indéfini singulier et souligne que la personne est l’objet de sa propre tromperie.
theological_decisions:
- issue: Référence masculine à valeur générique
  choice: quelqu’un… il… lui-même
  alternative: une personne… elle-même
  rationale: Le grec emploie un singulier grammaticalement masculin à valeur représentative. Le français courant reprend naturellement « quelqu’un » par « il », sans limiter le propos aux hommes.
- issue: Portée de « rien »
  choice: conserver l’affirmation absolue « il n’est rien »
  alternative: expliciter « il n’est pas aussi important qu’il le croit »
  rationale: La formulation conserve la force rhétorique et la tension du grec, sans atténuer ni interpréter le jugement de Paul.
translation_notes:
  register: Français international moderne, clair et digne. La structure brève et antithétique « quelque chose / rien » est préservée. « En effet, si » relie explicitement le verset à l’exhortation précédente.
