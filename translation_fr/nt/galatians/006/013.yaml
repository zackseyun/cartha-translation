source:
  edition: SBLGNT
  text: οὐδὲ γὰρ οἱ ⸀περιτεμνόμενοι αὐτοὶ νόμον φυλάσσουσιν, ἀλλὰ θέλουσιν ὑμᾶς περιτέμνεσθαι ἵνα ἐν τῇ ὑμετέρᾳ σαρκὶ καυχήσωνται.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/013.yaml
  text: For not even those who are circumcised themselves keep the law[a], but they want you to be circumcised so that they may boast in your flesh.
translation:
  language: fr
  text: Car même ceux qui sont circoncis n’observent pas eux-mêmes la Loi[a] ; mais ils veulent que vous soyez circoncis afin de se vanter de votre chair.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les circoncis ». Le grec emploie un participe substantivé : « ceux qui sont circoncis » / « ceux qui se font circoncire ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲ γὰρ
  choice: Car même… ne… pas
  rationale: « Car » maintient le lien explicatif avec le verset précédent, tandis que « même… ne… pas » rend naturellement la négation emphatique οὐδέ.
- source_word: οἱ περιτεμνόμενοι
  choice: ceux qui se font circoncire
  rationale: Le participe présent substantivé désigne ceux qui reçoivent la circoncision. Cette formulation française préserve l’aspect présent sans les réduire explicitement aux seuls promoteurs de la circoncision.
- source_word: αὐτοὶ
  choice: eux-mêmes
  rationale: 'Conserve l’insistance portée sur le sujet : ces personnes elles-mêmes n’observent pas la Loi.'
- source_word: νόμον φυλάσσουσιν
  choice: n’observent pas la Loi
  rationale: « Observer la Loi » est une expression française naturelle pour l’obéissance à ses prescriptions. La majuscule signale ici la Loi mosaïque visée par le contexte.
- source_word: ἀλλὰ θέλουσιν ὑμᾶς περιτέμνεσθαι
  choice: mais ils veulent que vous soyez circoncis
  rationale: Rend directement la volonté exprimée et respecte la forme passive de l’infinitif grec.
- source_word: ἵνα
  choice: afin de pouvoir
  rationale: Exprime clairement le but. « Pouvoir » donne une tournure française idiomatique sans modifier la finalité.
- source_word: ἐν τῇ ὑμετέρᾳ σαρκὶ
  choice: de ce qui est fait dans votre chair
  rationale: Le complément explicite en français le lien entre leur vantardise et la marque corporelle de la circoncision, tout en conservant « chair » et son sens physique contextuel.
- source_word: καυχήσωνται
  choice: se vanter
  rationale: Rend le sens négatif de καυχάομαι dans un français moderne et digne.
theological_decisions:
- issue: Sens de σάρξ dans ce contexte
  choice: la chair corporelle où la circoncision laisse sa marque
  alternative: la nature pécheresse
  rationale: Le contexte immédiat de la circoncision impose le sens physique. Traduire par « nature pécheresse » introduirait ici une interprétation théologique étrangère au passage.
- issue: Force de περιτεμνόμενοι
  choice: ceux qui se font circoncire
  alternative: les circoncis / ceux qui prônent la circoncision
  rationale: Le participe présent décrit le groupe par rapport à la circoncision. La traduction évite de transformer cette désignation en une paraphrase explicite sur leur activité de propagande.
- issue: Objet de la vantardise
  choice: ce qui est fait dans votre chair
  alternative: votre chair elle-même
  rationale: La tournure française met en évidence la marque de la circoncision comme motif de vantardise sans résoudre davantage la formulation grecque, qui situe cette vantardise « dans » la chair des destinataires.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve le lien argumentatif, l’emphase sur « eux-mêmes » et le terme concret « chair ». La formulation évite aussi bien le jargon théologique que la paraphrase confessionnelle.
