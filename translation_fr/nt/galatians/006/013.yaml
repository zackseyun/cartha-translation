- from: Car même ceux qui se font circoncire n’observent pas eux-mêmes la Loi[a] ; mais ils veulent que vous soyez circoncis afin de pouvoir se vanter de ce qui est fait dans votre chair.
  to: Car même ceux qui sont circoncis n’observent pas eux-mêmes la Loi[a] ; mais ils veulent que vous soyez circoncis afin de se vanter de votre chair.
  rationale: La révision supprime les ajouts interprétatifs tout en conservant le sens corporel de « chair » dans le contexte de la circoncision. Elle rend la finalité de ἵνα sans nuance modale supplémentaire et maintient l’ambiguïté sobre de la formulation grecque concernant la vantardise « dans/de » la chair des Galates.
