  text: μὴ πλανᾶσθε, θεὸς οὐ μυκτηρίζεται· ὃ γὰρ ⸀ἐὰν σπείρῃ ἄνθρωπος, τοῦτο καὶ θερίσει·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/007.yaml
  text: 'Do not be deceived: God is not mocked[a], for whatever a man sows, this he will also reap.'
translation:
  language: fr
  text: 'Ne vous y trompez pas : on ne se moque pas de Dieu. En effet, ce qu’une personne sème, elle le récoltera aussi.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ πλανᾶσθε
  choice: Ne vous y trompez pas
  rationale: L’impératif présent passif pluriel met en garde contre l’illusion ou l’égarement. Cette tournure française idiomatique conserve le ton direct et proverbial.
- source_word: θεὸς οὐ μυκτηρίζεται
  choice: on ne se moque pas de Dieu
  rationale: Le verbe μυκτηρίζω évoque la moquerie méprisante, voire le fait de traiter avec dédain. La construction française impersonnelle est naturelle et garde la force de l’affirmation grecque.
- source_word: ὃ γὰρ ἐὰν
  choice: En effet, ce que
  rationale: La relative indéfinie exprime une règle générale. « Ce que » la rend clairement, tandis que γάρ est traduit par « En effet ».
- source_word: σπείρῃ
  choice: sème
  rationale: Le sens agricole est conservé littéralement afin de maintenir la métaphore et son lien avec la récolte.
- source_word: ἄνθρωπος
  choice: une personne
  rationale: Dans ce contexte, le singulier ἄνθρωπος a une valeur générique et désigne tout être humain. « Une personne » exprime directement cette portée en français moderne sans restreindre le principe aux hommes.
- source_word: τοῦτο καὶ θερίσει
  choice: elle le récoltera aussi
  rationale: Le pronom « le » reprend précisément ce qui a été semé, et « aussi » rend καί en soulignant la correspondance entre semailles et récolte.
theological_decisions:
- issue: Portée générique de ἄνθρωπος
  choice: une personne
  alternative: un homme
  rationale: Le grec formule un principe universel au moyen d’un singulier représentatif. En français actuel, « une personne » en communique naturellement la portée humaine générale sans modifier le contenu théologique.
- issue: Force de θεὸς οὐ μυκτηρίζεται
  choice: on ne se moque pas de Dieu
  alternative: Dieu ne se laisse pas traiter avec mépris
  rationale: La traduction retenue préserve la formulation brève et proverbiale sans expliciter le mécanisme ni résoudre la tension entre la tentative humaine de mépris et l’impossibilité d’en faire réellement Dieu l’objet.
translation_notes:
  register: Français international moderne, direct et digne. La structure proverbiale, les images agricoles et la correspondance emphatique entre semer et récolter sont préservées. Aucun marqueur de note n’est nécessaire.
