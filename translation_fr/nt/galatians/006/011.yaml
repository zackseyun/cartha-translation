  text: Ἴδετε πηλίκοις ὑμῖν γράμμασιν ἔγραψα τῇ ἐμῇ χειρί.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/011.yaml
  text: See with what large letters I have written to you with my own hand[a].
translation:
  language: fr
  text: Voyez avec quelles grandes lettres je vous ai écrit de ma propre main[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « Voyez quelle longue lettre je vous ai écrite de ma propre main. »'
    reason: La construction grecque peut être comprise comme une référence soit à la taille des caractères, soit à la longueur de la lettre.
lexical_decisions:
- source_word: Ἴδετε
  choice: Voyez
  rationale: L’impératif attire directement l’attention des destinataires. « Voyez » reste concis, naturel et proche de la forme grecque.
- source_word: πηλίκοις
  choice: quelles grandes
  rationale: Dans son association avec γράμμασιν, le terme désigne très probablement la taille remarquable des caractères manuscrits.
- source_word: γράμμασιν
  choice: lettres
  rationale: Le pluriel désigne naturellement ici les lettres ou caractères de l’écriture, tout en permettant de signaler en note l’interprétation minoritaire portant sur la longueur de l’épître.
- source_word: ὑμῖν
  choice: vous
  rationale: Le pronom au datif indique les destinataires de ce que Paul écrit.
- source_word: ἔγραψα
  choice: je vous écris
  rationale: Bien que la forme grecque soit un aoriste, le présent épistolaire est le tour le plus naturel en français lorsque l’auteur attire l’attention sur les mots qu’il est en train d’inscrire sous les yeux des lecteurs.
- source_word: τῇ ἐμῇ χειρί
  choice: de ma propre main
  rationale: Cette expression française idiomatique rend la valeur instrumentale du datif ainsi que l’insistance portée par ἐμῇ sur l’intervention personnelle de Paul.
theological_decisions:
- issue: Interprétation de πηλίκοις γράμμασιν
  choice: la grande taille des caractères manuscrits
  alternative: la longueur de la lettre
  rationale: Le sens ordinaire de γράμματα comme caractères écrits, joint à la mention « de ma propre main », favorise une référence à la taille de l’écriture. Comme πηλίκος peut aussi exprimer l’ampleur et que l’autre interprétation possède un appui historique, celle-ci est conservée en note.
translation_notes:
  register: Français moderne, international et digne. « Voyez » conserve l’adresse directe; « de ma propre main » est idiomatique et souligne sans surinterprétation que Paul écrit personnellement.
