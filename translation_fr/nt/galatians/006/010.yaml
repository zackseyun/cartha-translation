id: GAL.6.10
reference: Galatians 6:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἄρα οὖν ὡς καιρὸν ⸀ἔχομεν, ἐργαζώμεθα τὸ ἀγαθὸν πρὸς πάντας, μάλιστα δὲ πρὸς τοὺς οἰκείους τῆς πίστεως.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/010.yaml
  text: So then[a], as we have opportunity, let us do what is good toward everyone[c][b], and especially toward those who are of the household of faith.
translation:
  language: fr
  text: Ainsi donc, pendant que nous en avons l’occasion[a], faisons le bien à tous, et surtout à ceux qui font partie de la famille[b] de la foi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tant que nous en avons le temps ». Le grec καιρός désigne surtout un moment favorable ou approprié, et non simplement le temps en général.
    reason: lexical_alternative
  - marker: b
    text: Le grec désigne les membres d’une maisonnée ou ceux qui lui appartiennent. Il emploie l’image du foyer pour parler de ceux qui appartiennent à la communauté croyante.
    reason: lexical_alternative
  - marker: c
    text: « La foi » peut aussi désigner ici la foi chrétienne commune, c’est-à-dire ce que cette communauté croit et confesse.
    reason: alternative_reading
lexical_decisions:
- source_word: ἄρα οὖν
  choice: Ainsi donc
  rationale: Les deux particules introduisent une conclusion tirée de ce qui précède. « Ainsi donc » en conserve clairement la force logique dans un français actuel et digne.
- source_word: ὡς καιρὸν ἔχομεν
  choice: pendant que nous en avons l’occasion
  rationale: καιρός désigne ici le moment propice ou l’occasion d’agir plutôt que le temps chronologique en général. Cette formulation garde aussi la dimension temporelle de ὡς.
- source_word: ἐργαζώμεθα τὸ ἀγαθὸν
  choice: faisons le bien
  rationale: Le subjonctif présent a une valeur exhortative et appelle une action continue. « Faire le bien » est l’expression française naturelle correspondant à l’adjectif substantivé τὸ ἀγαθόν.
- source_word: πρὸς πάντας
  choice: à tous
  rationale: πρός indique ici les personnes vers lesquelles l’action est dirigée. « À tous » exprime naturellement la portée universelle de l’exhortation.
- source_word: μάλιστα δὲ
  choice: et surtout
  rationale: μάλιστα établit une priorité particulière à l’intérieur de l’obligation générale, sans exclure les autres. « Et surtout » préserve cette relation additive.
- source_word: τοὺς οἰκείους τῆς πίστεως
  choice: ceux qui font partie de la famille de la foi
  rationale: οἰκεῖοι désigne les gens de la maison ou les membres d’un foyer. « Famille » restitue naturellement en français la métaphore domestique, tandis que « font partie de » évite de suggérer un lien biologique.
- source_word: πίστεως
  choice: foi
  rationale: Le génitif identifie cette famille par la foi. Le choix « foi » conserve la latitude du grec sans imposer un sens exclusivement institutionnel, confessionnel ou moral.
theological_decisions:
- issue: Étendue et priorité de la bienfaisance chrétienne
  choice: L’exhortation vise tous, tout en accordant une attention particulière aux membres de la communauté croyante.
  alternative: Limiter l’exhortation aux seuls croyants, ou nier toute priorité particulière envers eux.
  rationale: πρὸς πάντας établit la portée universelle, puis μάλιστα introduit une priorité sans annuler cette portée. La traduction maintient les deux aspects.
- issue: Sens de τῆς πίστεως
  choice: « foi » caractérise la famille sans préciser davantage la nature de ce génitif.
  alternative: Comprendre « la foi » au sens de la confession chrétienne commune, ou « fidélité » comme une qualité.
  rationale: Le contexte favorise l’identité croyante de la communauté, mais la formulation grecque ne contraint pas à une lecture strictement institutionnelle ou doctrinale. Le texte principal conserve donc « foi » et la note signale l’autre lecture plausible.
translation_notes:
  register: Français international moderne, naturel et digne. « Faisons le bien » privilégie l’idiome courant sans affaiblir l’exhortation. « Famille de la foi » conserve l’image du foyer tout en restant immédiatement compréhensible.
