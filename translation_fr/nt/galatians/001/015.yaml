  source_fidelity: 'Le sens de tous les éléments grecs est globalement conservé : δέ est rendu par « Mais », ὅτε par « quand », ἀφορίσας par « mis à part », καλέσας par « appelé », et διὰ τῆς χάριτος αὐτοῦ par « par sa grâce ». « A bien voulu » est une bonne traduction contextuelle de εὐδόκησεν et laisse correctement la phrase en suspens pour la suite au v. 16. Une légère révision de l’expression imagée est préférable : « dès le sein de ma mère » est l’idiome biblique français plus établi pour ἐκ κοιλίας μητρός μου, tout en restant littéral dans son image.'
  naturalness: La phrase demeure naturelle dans un registre moderne et soutenu, et son inachèvement est requis par la syntaxe qui se poursuit au verset suivant. « Dès le ventre de ma mère » est compréhensible, mais moins idiomatique en français que « dès le sein de ma mère ».
  terminology: « Mettre à part » évite d’imposer une lecture doctrinale de l’élection ou de la prédestination. « Appelé » et « grâce » préservent la terminologie paulinienne sans surinterprétation. « Sein de ma mère » conserve l’imagerie scripturaire de la vocation, sans la réduire à « naissance » dans le texte principal.
