source:
  edition: SBLGNT
  text: ὅτε δὲ ⸀εὐδόκησεν ὁ ἀφορίσας με ἐκ κοιλίας μητρός μου καὶ καλέσας διὰ τῆς χάριτος αὐτοῦ
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/015.yaml
  text: But when the one who set me apart from my mother’s womb and called me through his grace was pleased[a]
translation:
  language: fr
  text: Mais quand celui qui m’avait mis à part dès le sein de ma mère[a] et m’avait appelé par sa grâce a bien voulu
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dès ma naissance » ; comparez le langage de la vocation prophétique en Jérémie 1.5 et Ésaïe 49.1.
    reason: Signale une autre manière naturelle de comprendre l’expression grecque et son arrière-plan prophétique.
lexical_decisions:
- source_word: ὅτε δὲ
  choice: Mais quand
  rationale: « Quand » conserve la valeur temporelle de ὅτε, tandis que « mais » rend la transition légèrement contrastive de δέ dans un français naturel.
- source_word: εὐδόκησεν
  choice: a bien voulu
  rationale: Cette tournure française exprime une volonté favorable et délibérée, sans réduire le verbe à une simple décision. La proposition se poursuit au verset suivant, comme en grec.
- source_word: ὁ ἀφορίσας με
  choice: celui qui m’avait mis à part
  rationale: « Celui qui » restitue le participe substantivé, et « mettre à part » garde l’idée de consécration ou de destination particulière sans introduire explicitement une doctrine systématique de l’élection.
- source_word: ἐκ κοιλίας μητρός μου
  choice: dès le ventre de ma mère
  rationale: La formulation conserve l’image concrète du grec et l’écho au langage de vocation prophétique. « Dès » exprime naturellement le point de départ en français.
- source_word: καλέσας
  choice: m’avait appelé
  rationale: « Appeler » est le terme français naturel pour l’appel divin. Le plus-que-parfait présente cet acte, avec la mise à part, comme antérieur au verbe principal dans la construction française.
- source_word: διὰ τῆς χάριτος αὐτοῦ
  choice: par sa grâce
  rationale: « Par » rend naturellement διά avec le génitif en présentant la grâce comme le moyen de l’appel.
theological_decisions:
- issue: Faut-il rendre ἀφορίσας par un terme explicitant une doctrine particulière de la prédestination ou de l’élection ?
  choice: m’avait mis à part
  alternative: m’avait choisi / m’avait destiné / m’avait séparé
  rationale: Le grec évoque une mise à part divine, probablement dans le registre de la vocation prophétique, mais ne demande pas ici une formulation doctrinale plus précise.
- issue: Faut-il expliciter que la mise à part a eu lieu avant la naissance ?
  choice: dès le ventre de ma mère
  alternative: avant ma naissance / dès ma naissance
  rationale: La traduction retenue préserve l’image et l’ambiguïté temporelle de l’expression grecque au lieu de préciser davantage que le texte.
translation_notes:
  register: Français moderne, courant et digne. La syntaxe reste volontairement ouverte à la fin, puisque la phrase grecque se poursuit au verset 16. L’image du ventre maternel est conservée plutôt que remplacée dans le texte principal par une paraphrase.
