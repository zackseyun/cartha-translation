  rationale: 'La seule correction remplace « ventre » par « sein » afin d’employer l’idiome français le plus naturel et le plus traditionnellement attesté pour cette expression de vocation, sans modifier le sens ni résoudre l’ambiguïté théologique du grec. Le plus-que-parfait est maintenu : il situe naturellement la mise à part et l’appel avant l’action introduite par « a bien voulu », tout en laissant la phrase ouverte vers le verset 16.'
