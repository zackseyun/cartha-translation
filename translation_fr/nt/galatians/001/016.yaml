  text: ἀποκαλύψαι τὸν υἱὸν αὐτοῦ ἐν ἐμοὶ ἵνα εὐαγγελίζωμαι αὐτὸν ἐν τοῖς ἔθνεσιν, εὐθέως οὐ προσανεθέμην σαρκὶ καὶ αἵματι,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/016.yaml
  text: to reveal his Son in me[a], so that I might proclaim him among the Gentiles, I did not immediately consult with flesh and blood[b],
translation:
  language: fr
  text: de révéler son Fils en moi[a], afin que je le proclame parmi les non-Juifs, je n’ai pas aussitôt consulté la chair et le sang[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à moi » ou « par mon intermédiaire ».
    reason: alternative_reading
  - marker: b
    text: « La chair et le sang » est une expression qui désigne des êtres humains.
    reason: cultural_note
lexical_decisions:
- source_word: ἀποκαλύψαι
  choice: révéler
  rationale: « Révéler » exprime clairement le dévoilement produit par Dieu et s’intègre comme infinitif à la construction commencée au verset précédent.
- source_word: τὸν υἱὸν αὐτοῦ
  choice: son Fils
  rationale: Cette formulation française naturelle conserve le titre filial et sa portée christologique sans ajout explicatif.
- source_word: ἐν ἐμοὶ
  choice: en moi
  rationale: Le sens premier de ἐν est conservé afin de ne pas trancher entre une révélation intérieure, une révélation faite à Paul ou une révélation opérée par son intermédiaire.
- source_word: ἵνα εὐαγγελίζωμαι αὐτὸν
  choice: afin que je le proclame
  rationale: Le pronom « le » garde le Fils lui-même comme objet direct, tandis que « proclame » communique naturellement l’idée d’annoncer la bonne nouvelle sans transformer l’objet en « message à son sujet ».
- source_word: ἐν τοῖς ἔθνεσιν
  choice: parmi les non-Juifs
  rationale: Dans ce contexte paulinien, ἔθνη désigne les peuples qui ne sont pas juifs. « Non-Juifs » est plus immédiatement compréhensible en français moderne que « païens » ou « Gentils ».
- source_word: εὐθέως
  choice: aussitôt
  rationale: « Aussitôt » est une équivalence naturelle et digne qui marque l’immédiateté.
- source_word: οὐ προσανεθέμην
  choice: je n’ai pas aussitôt pris conseil auprès de
  rationale: La tournure rend le sens moyen de consulter ou de conférer avec quelqu’un et demeure naturelle devant l’expression idiomatique qui suit.
- source_word: σαρκὶ καὶ αἵματι
  choice: la chair et du sang
  rationale: L’expression imagée est conservée plutôt que remplacée silencieusement par « des êtres humains »; son sens idiomatique est précisé en note.
theological_decisions:
- issue: Sens de ἐν ἐμοὶ dans la révélation du Fils
  choice: Maintenir « en moi » dans le texte principal
  alternative: « à moi » ou « par mon intermédiaire »
  rationale: Le grec permet d’envisager une révélation intérieure, une révélation adressée à Paul ou une manifestation par son intermédiaire. La traduction conserve cette tension au lieu d’imposer une seule lecture.
translation_notes:
  register: Français international actuel, clair et digne. « Non-Juifs » privilégie la compréhension immédiate; « la chair et le sang » conserve l’image paulinienne, expliquée en note. La ponctuation finale et l’infinitif initial respectent le fait que ce segment poursuit la phrase commencée au verset précédent.
