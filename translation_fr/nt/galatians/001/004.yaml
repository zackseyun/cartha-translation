  variant: modern international French
source:
  edition: SBLGNT
  text: τοῦ δόντος ἑαυτὸν ⸀ὑπὲρ τῶν ἁμαρτιῶν ἡμῶν ὅπως ἐξέληται ἡμᾶς ἐκ τοῦ ⸂αἰῶνος τοῦ ἐνεστῶτος⸃ πονηροῦ κατὰ τὸ θέλημα τοῦ θεοῦ καὶ πατρὸς ἡμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/004.yaml
  text: who gave himself for our sins so that he might rescue us from the present evil age[a], according to the will of our God and Father,
translation:
  language: fr
  text: lui qui s’est donné lui-même pour nos péchés afin de nous délivrer de l’ère actuelle, qui est mauvaise[a], selon la volonté de notre Dieu et Père,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « du monde actuel mauvais ».
    reason: Alternative lexicale traditionnelle pour αἰών, qui peut être rendu contextuellement par « monde », bien que son sens premier soit temporel.
lexical_decisions:
- source_word: δόντος ἑαυτόν
  choice: s’est donné lui-même
  rationale: Cette formulation rend le don volontaire de sa propre personne et conserve la forme participiale qui rattache le verset à son contexte.
- source_word: ὑπὲρ τῶν ἁμαρτιῶν ἡμῶν
  choice: pour nos péchés
  rationale: « Pour » exprime naturellement la portée rédemptrice de ὑπέρ sans préciser un mécanisme d’expiation que le texte ne formule pas ici.
- source_word: ὅπως ἐξέληται ἡμᾶς
  choice: afin de nous arracher
  rationale: Le verbe ἐξαιρέω évoque le fait de retirer quelqu’un d’une situation dangereuse ou dominatrice. « Arracher » en restitue la force en français actuel.
- source_word: ἐκ τοῦ αἰῶνος τοῦ ἐνεστῶτος πονηροῦ
  choice: à l’ère présente, qui est mauvaise
  rationale: αἰών désigne d’abord une époque ou un âge. « Ère » conserve cette dimension temporelle, tandis que la proposition relative rattache clairement πονηροῦ à l’ère présente dans un français naturel.
- source_word: κατὰ τὸ θέλημα
  choice: selon la volonté
  rationale: Cette expression rend avec concision la conformité au dessein voulu par Dieu.
- source_word: τοῦ θεοῦ καὶ πατρὸς ἡμῶν
  choice: de notre Dieu et Père
  rationale: La formulation conserve le référent unique de la construction grecque et reste digne et compréhensible.
theological_decisions:
- issue: Portée de ὑπὲρ τῶν ἁμαρτιῶν ἡμῶν
  choice: pour nos péchés
  alternative: à cause de nos péchés ; en faveur de nos péchés
  rationale: La traduction retenue garde la portée sacrificielle et rédemptrice du grec sans imposer une théorie particulière de l’expiation.
- issue: Sens de αἰών
  choice: l’ère présente
  alternative: le monde présent
  rationale: Le terme grec a ici une portée temporelle et cosmique. « Ère » la préserve mieux que « monde », tout en laissant l’alternative traditionnelle en note.
translation_notes:
  register: Français international moderne, clair et digne. « Arracher » communique vigoureusement l’idée de délivrance, et « l’ère présente, qui est mauvaise » évite le tour vieilli « le présent siècle mauvais ».
