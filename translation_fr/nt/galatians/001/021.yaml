lexical_decisions:
- source_word: ἔπειτα
  choice: Ensuite
  rationale: Marque naturellement la succession des étapes dans le récit de Paul.
- source_word: ἦλθον
  choice: je suis allé
  rationale: Bien que le verbe puisse se rendre formellement par « je suis venu », le français narratif emploie naturellement « je suis allé » pour un déplacement depuis le lieu précédemment évoqué.
- source_word: εἰς
  choice: dans
  rationale: Avec une destination régionale, « dans » exprime naturellement le mouvement vers l’intérieur de ces territoires; « vers » reste possible si l’on souligne seulement la direction.
- source_word: κλίματα
  choice: régions
  rationale: Désigne ici des zones géographiques; « régions » est clair, courant et suffisamment large, tandis que « contrées » est plus littéraire.
- source_word: Συρίας
  choice: Syrie
  rationale: Forme française usuelle du nom géographique.
- source_word: Κιλικίας
  choice: Cilicie
  rationale: Forme française usuelle du nom géographique.
