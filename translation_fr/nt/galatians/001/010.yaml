id: GAL.1.10
reference: Galatians 1:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἄρτι γὰρ ἀνθρώπους πείθω ἢ τὸν θεόν; ἢ ζητῶ ἀνθρώποις ἀρέσκειν; ⸀εἰ ἔτι ἀνθρώποις ἤρεσκον, Χριστοῦ δοῦλος οὐκ ἂν ἤμην.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/010.yaml
  text: For am I now persuading people[a], or God? Or am I seeking to please people? If I were still pleasing people[b], I would not be Messiah’s servant.
translation:
  language: fr
  text: En effet, est-ce maintenant des humains que je cherche à convaincre, ou Dieu[a] ? Ou bien est-ce que je cherche à plaire aux humains ? Si je plaisais encore aux humains, je ne serais pas esclave du Messie[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « est-ce maintenant l’approbation des humains que je cherche à gagner, ou celle de Dieu ? »'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « serviteur du Christ ». Le mot grec traduit par « esclave » souligne ici l’appartenance entière à un maître.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄρτι
  choice: maintenant
  rationale: Rend directement le repère temporel présent, qui peut suggérer un contraste avec la conduite antérieure de Paul.
- source_word: γὰρ
  choice: En effet
  rationale: Marque naturellement en français le lien explicatif avec ce qui précède.
- source_word: πείθω
  choice: je cherche à convaincre
  rationale: Préserve le sens premier de « convaincre, persuader » ainsi que l’étrangeté voulue de l’alternative « des humains, ou Dieu »; une autre nuance possible est signalée en note.
- source_word: ἀνθρώπους
  choice: des humains / aux humains
  rationale: Désigne les êtres humains en général sans restreindre le propos aux hommes de sexe masculin.
- source_word: ζητῶ
  choice: je cherche
  rationale: Rend simplement le présent et l’idée d’une intention poursuivie.
- source_word: ἀρέσκειν / ἤρεσκον
  choice: plaire / plaisais
  rationale: Correspond directement au verbe grec et maintient la répétition qui structure l’opposition entre l’approbation humaine et le service du Messie.
- source_word: εἰ ἔτι
  choice: Si… encore
  rationale: Conserve la condition et l’idée d’une conduite qui se prolongerait depuis une période antérieure.
- source_word: Χριστοῦ
  choice: du Messie
  rationale: Rend explicitement le titre grec Χριστός; « du Christ » demeure une traduction traditionnelle possible.
- source_word: δοῦλος
  choice: esclave
  rationale: Exprime la dépendance et l’appartenance entière impliquées ici, plus fortement que le français « serviteur ».
theological_decisions:
- issue: Sens de πείθω dans l’opposition entre les humains et Dieu
  choice: « chercher à convaincre » dans le texte
  alternative: « chercher à gagner l’approbation »
  rationale: Le verbe peut évoquer l’action de persuader ou celle de gagner la faveur de quelqu’un. Le texte principal conserve le sens verbal direct sans éliminer l’autre nuance contextuelle, donnée en note.
- issue: Rendu de Χριστοῦ δοῦλος
  choice: « esclave du Messie »
  alternative: « serviteur du Christ »
  rationale: « Esclave » préserve la force de δοῦλος dans ce contraste d’allégeance, tandis que « Messie » explicite la valeur titulaire de Χριστός. La formulation traditionnelle reste indiquée en note sans affaiblir le texte principal.
translation_notes:
  register: Français international actuel, clair et soutenu sans archaïsme. « Humains » évite le masculin générique; « esclave du Messie » conserve volontairement la force et la tension de l’expression grecque.
