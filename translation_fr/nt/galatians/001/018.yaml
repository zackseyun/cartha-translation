id: GAL.1.18
reference: Galatians 1:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἔπειτα μετὰ ⸂ἔτη τρία⸃ ἀνῆλθον εἰς Ἱεροσόλυμα ἱστορῆσαι ⸀Κηφᾶν, καὶ ἐπέμεινα πρὸς αὐτὸν ἡμέρας δεκαπέντε·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/018.yaml
  text: Then after three years I went up to Jerusalem to visit Cephas[b][a], and I stayed with him fifteen days.
translation:
  language: fr
  text: Puis, après trois ans, je suis monté à Jérusalem pour faire la connaissance de Céphas[a][b], et je suis resté auprès de lui pendant quinze jours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour rendre visite à Céphas »; le verbe grec peut aussi évoquer le fait d’apprendre à connaître quelqu’un par une rencontre personnelle.
    reason: lexical_alternative
  - marker: b
    text: Céphas est le nom araméen de Pierre.
    reason: name_explanation
lexical_decisions:
- source_word: Ἔπειτα
  choice: Puis
  rationale: Marque naturellement l’étape suivante dans le récit de Paul.
- source_word: μετὰ ἔτη τρία
  choice: après trois ans
  rationale: Rend directement l’expression temporelle grecque sans préciser à partir de quel événement les années sont comptées.
- source_word: ἀνῆλθον
  choice: je suis monté
  rationale: Conserve l’idée de montée associée au déplacement vers Jérusalem, tout en restant idiomatique en français.
- source_word: Ἱεροσόλυμα
  choice: Jérusalem
  rationale: Forme française usuelle du nom de lieu.
- source_word: ἱστορῆσαι
  choice: pour faire la connaissance de
  rationale: Le verbe rare évoque une rencontre personnelle visant à connaître quelqu’un; une note conserve l’autre traduction naturelle possible, « rendre visite à ».
- source_word: Κηφᾶν
  choice: Céphas
  rationale: Respecte le nom effectivement employé par Paul au lieu de l’harmoniser avec Pierre.
- source_word: ἐπέμεινα πρὸς αὐτὸν
  choice: je suis resté auprès de lui
  rationale: Exprime la présence prolongée auprès de Céphas sans affirmer nécessairement que Paul logeait chez lui.
- source_word: ἡμέρας δεκαπέντε
  choice: pendant quinze jours
  rationale: Rend explicitement et naturellement en français l’accusatif grec de durée.
theological_decisions:
- issue: Identification de Céphas
  choice: Conserver « Céphas » dans le texte et signaler son identification avec Pierre en note.
  alternative: Remplacer directement « Céphas » par « Pierre ».
  rationale: Le texte grec nomme précisément Κηφᾶς; conserver cette forme évite une harmonisation silencieuse tout en donnant au lecteur l’information nécessaire.
translation_notes:
  register: Français international moderne, naturel et digne. « Faire la connaissance de » conserve la nuance particulière de ἱστορῆσαι; « auprès de lui » évite de surinterpréter la nature exacte du séjour.
