id: GAL.1.1
reference: Galatians 1:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Παῦλος ἀπόστολος, οὐκ ἀπ’ ἀνθρώπων οὐδὲ δι’ ἀνθρώπου ἀλλὰ διὰ Ἰησοῦ Χριστοῦ καὶ θεοῦ πατρὸς τοῦ ἐγείραντος αὐτὸν ἐκ νεκρῶν,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/001.yaml
  text: Paul[a], an apostle—not from men nor through a man, but through Jesus the Messiah and God the Father, who raised him from the dead,
translation:
  language: fr
  text: Paul, apôtre — non de la part d’êtres humains ni par l’intermédiaire d’un être humain, mais par Jésus le Messie[a] et Dieu le Père, qui l’a ressuscité d’entre les morts —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Jésus-Christ ».'
    reason: Alternative lexicale lorsque Χριστός est compris comme faisant partie d’une désignation devenue quasi nominale plutôt que comme un titre explicitement rendu.
lexical_decisions:
- source_word: ἀπόστολος
  choice: apôtre
  rationale: « Apôtre » est le titre reconnu qui désigne ici une personne mandatée et conserve la portée particulière de l’identité et de la mission de Paul.
- source_word: ἀπ’ ἀνθρώπων
  choice: de la part d’êtres humains
  rationale: Avec le génitif, ἀπό indique ici l’origine du mandat. Cette formulation moderne garde le pluriel et prépare le contraste avec le singulier qui suit.
- source_word: δι’ ἀνθρώπου
  choice: par l’intermédiaire d’un être humain
  rationale: Avec le génitif, διά exprime l’intermédiaire ou l’agent. Le singulier est conservé afin de respecter l’opposition rhétorique avec le pluriel précédent.
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: par Jésus le Messie
  rationale: « Par » exprime l’agent du mandat de Paul et répond à la proposition négative précédente. « Le Messie » restitue la valeur titulaire de Χριστός dans un français idiomatique.
- source_word: θεοῦ πατρὸς
  choice: Dieu le Père
  rationale: Cette désignation naturelle et traditionnelle conserve la coordination de Jésus le Messie et de Dieu le Père comme agents du mandat apostolique.
- source_word: τοῦ ἐγείραντος αὐτὸν ἐκ νεκρῶν
  choice: qui l’a ressuscité d’entre les morts
  rationale: La relative se rapporte à Dieu le Père. « Ressusciter d’entre les morts » exprime clairement et naturellement l’affirmation de la résurrection portée par le grec.
theological_decisions:
- issue: Valeur de Χριστοῦ dans Ἰησοῦ Χριστοῦ
  choice: Jésus le Messie
  alternative: Jésus-Christ
  rationale: Dans cette salutation, Χριστός conserve une valeur de titre. « Jésus le Messie » rend cette valeur sans traiter le terme comme un simple élément de nom.
- issue: Origine et médiation du mandat apostolique
  choice: Distinguer « de la part de » pour ἀπό et « par l’intermédiaire de / par » pour διά
  alternative: Employer simplement « par » dans tous les cas
  rationale: La distinction française préserve la différence entre l’origine niée du mandat et l’intermédiaire nié, tout en maintenant Jésus le Messie et Dieu le Père comme véritables agents.
translation_notes:
  register: Français international moderne, digne et lisible. Les tirets conservent la longue incise grecque et signalent que la phrase se poursuit au verset suivant. « Êtres humains » évite l’ambiguïté contemporaine de « hommes » tout en maintenant l’opposition entre pluriel et singulier.
