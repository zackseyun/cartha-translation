  text: ἕτερον δὲ τῶν ἀποστόλων οὐκ εἶδον, εἰ μὴ Ἰάκωβον τὸν ἀδελφὸν τοῦ κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/019.yaml
  text: But I saw none of the other apostles except James[a], the Lord’s brother.
translation:
  language: fr
  text: Mais je n’ai vu aucun des autres apôtres, si ce n’est Jacques[a], le frère du Seigneur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Je n’ai vu aucun autre apôtre — seulement Jacques, le frère du Seigneur. » Certains comprennent cette formulation sans considérer Jacques comme un apôtre.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἕτερον
  choice: aucun des autres
  rationale: Avec le partitif τῶν ἀποστόλων et la négation, cette tournure exprime naturellement en français l’idée d’un autre membre du groupe.
- source_word: δέ
  choice: Mais
  rationale: La conjonction marque ici un léger contraste avec ce qui précède.
- source_word: ἀποστόλων
  choice: apôtres
  rationale: Le terme français consacré convient au cercle apostolique évoqué dans ce contexte paulinien.
- source_word: οὐκ εἶδον
  choice: je n’ai vu aucun
  rationale: Le passé composé est naturel en français moderne pour ce récit, et la négation s’articule avec le complément partitif.
- source_word: εἰ μὴ
  choice: si ce n’est
  rationale: Cette locution introduit idiomatiquement une exception tout en conservant la relation syntaxique et une légère possibilité d’ambiguïté interprétative.
- source_word: Ἰάκωβον
  choice: Jacques
  rationale: Forme française traditionnelle du nom Ἰάκωβος dans le Nouveau Testament.
- source_word: ἀδελφὸν
  choice: frère
  rationale: C’est le sens direct et ordinaire du terme; le contexte n’impose pas un terme de parenté plus vague.
- source_word: τοῦ κυρίου
  choice: du Seigneur
  rationale: Cette formulation française naturelle conserve le titre κύριος et la relation exprimée par le génitif.
theological_decisions:
- issue: Jacques est-il compté parmi les apôtres dans cette construction ?
  choice: Le texte principal présente Jacques comme l’exception à « aucun des autres apôtres », ce qui l’inclut naturellement dans cette désignation.
  alternative: On peut comprendre que Paul n’a vu aucun autre apôtre, mais qu’il a vu Jacques en plus, sans nécessairement ranger celui-ci parmi les apôtres.
  rationale: La construction grecque εἰ μὴ introduit le plus naturellement une exception au groupe mentionné. La note conserve toutefois l’autre analyse syntaxique sans trancher davantage.
translation_notes:
  register: Français international moderne, clair et digne. « Si ce n’est » maintient un registre biblique accessible sans archaïsme marqué. Le marqueur [a] figure immédiatement après « Jacques », conformément à la note.
