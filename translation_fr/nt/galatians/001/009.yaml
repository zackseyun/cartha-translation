id: GAL.1.9
reference: Galatians 1:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὡς προειρήκαμεν, καὶ ἄρτι πάλιν λέγω, εἴ τις ὑμᾶς εὐαγγελίζεται παρ’ ὃ παρελάβετε, ἀνάθεμα ἔστω.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/009.yaml
  text: 'As we have said before[a], so now I say again: if anyone is preaching a gospel to you contrary to what you received[b], let him be accursed.'
translation:
  language: fr
  text: 'Comme nous l’avons déjà dit, je le répète maintenant : si quelqu’un vous annonce un évangile contraire à celui que vous avez reçu[a], qu’il soit maudit[b] !'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « différent de ce que vous avez reçu » ou « allant au-delà de ce que vous avez reçu » ; l’expression grecque indique ici une déviation par rapport au message reçu.
    reason: lexical_alternative
  - marker: b
    text: 'Ou « qu’il soit sous le coup d’une malédiction » ; grec : anathema estō.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς προειρήκαμεν
  choice: Comme nous l’avons déjà dit
  rationale: Cette formulation naturelle rend l’idée d’une déclaration antérieure qui demeure pertinente.
- source_word: ἄρτι πάλιν λέγω
  choice: je le répète maintenant
  rationale: « maintenant » rend ἄρτι et « je le répète » exprime naturellement πάλιν λέγω.
- source_word: εἴ τις ὑμᾶς εὐαγγελίζεται
  choice: si quelqu’un vous annonce un évangile
  rationale: Le verbe désigne l’annonce d’une bonne nouvelle, ici comprise dans le contexte comme un message prétendant être l’Évangile.
- source_word: παρ’ ὃ
  choice: contraire à celui que
  rationale: Dans ce contexte polémique, παρά marque une déviation par rapport au message reçu, sans exclure la nuance plus littérale « différent de » ou « au-delà de ».
- source_word: παρελάβετε
  choice: vous avez reçu
  rationale: « Recevoir » convient au fait d’accueillir un message transmis et conserve la formulation sobre du grec.
- source_word: ἀνάθεμα ἔστω
  choice: qu’il soit maudit
  rationale: Cette expression française actuelle conserve la force solennelle de la condamnation sans introduire explicitement un agent que le grec ne nomme pas.
theological_decisions:
- issue: Portée de la condamnation exprimée par ἀνάθεμα ἔστω
  choice: qu’il soit maudit
  alternative: qu’il soit sous le coup d’une malédiction ; qu’il soit anathème
  rationale: Le choix conserve la sévérité de l’avertissement tout en évitant de préciser au-delà du texte la nature ou l’agent de la malédiction.
translation_notes:
  register: Français international moderne, naturel et digne. « Évangile » conserve le vocabulaire théologique central, tandis que « qu’il soit maudit » rend directement la gravité de la formule grecque.
