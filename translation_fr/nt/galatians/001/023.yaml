revisions:
- from: 'Elles entendaient seulement dire : « Celui qui nous persécutait autrefois annonce maintenant la foi[a] qu’il cherchait alors à détruire. »'
  to: 'Elles n’entendaient que ceci : « Celui qui nous persécutait autrefois annonce maintenant la foi[a] qu’il détruisait autrefois. »'
  rationale: La révision remplace l’atténuation conative de « cherchait à détruire » par un imparfait qui rend directement ἐπόρθει, remplace « alors » par « autrefois » pour le second ποτέ, et fluidifie l’expression de la connaissance limitée des Églises. Elle conserve l’ambiguïté lexicale de πίστις et l’ancrage de note existant.
