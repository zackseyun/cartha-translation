source:
  edition: SBLGNT
  text: μόνον δὲ ἀκούοντες ἦσαν ὅτι Ὁ διώκων ἡμᾶς ποτε νῦν εὐαγγελίζεται τὴν πίστιν ἥν ποτε ἐπόρθει,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/023.yaml
  text: They were only hearing[a], “The one who formerly persecuted us now proclaims the faith he once tried to destroy.”
translation:
  language: fr
  text: 'Elles n’entendaient que ceci : « Celui qui nous persécutait autrefois annonce maintenant la foi[a] qu’il détruisait autrefois. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la Bonne Nouvelle » ; le grec porte « la foi », probablement au sens du message ou de la foi chrétienne que Paul combattait autrefois.
    reason: lexical_alternative
lexical_decisions:
- source_word: μόνον
  choice: seulement
  rationale: 'Marque la limitation : les Églises de Judée ne connaissaient Paul que par ce qu’elles entendaient dire à son sujet.'
- source_word: ἀκούοντες ἦσαν
  choice: entendaient … dire
  rationale: Cette tournure française naturelle rend la construction périphrastique à l’imparfait, qui évoque la réception continue ou répétée de cette information.
- source_word: ὁ διώκων ἡμᾶς ποτε
  choice: Celui qui nous persécutait autrefois
  rationale: Le participe substantivé désigne Paul par son ancienne activité, tandis que ποτέ situe celle-ci dans le passé.
- source_word: νῦν εὐαγγελίζεται
  choice: annonce maintenant
  rationale: Le verbe désigne la proclamation de la Bonne Nouvelle ; « annonce » reste naturel devant le complément « la foi » et conserve le contraste temporel avec « autrefois ».
- source_word: τὴν πίστιν
  choice: la foi
  rationale: Avec l’article et dans ce contexte, le terme renvoie vraisemblablement à la foi chrétienne comme message confessé et proclamé, plutôt qu’au seul acte subjectif de croire.
- source_word: ἣν ποτε ἐπόρθει
  choice: qu’il cherchait alors à détruire
  rationale: πορθέω exprime une action dévastatrice visant la destruction. « Cherchait à détruire » rend idiomatiquement l’entreprise hostile sans suggérer qu’elle avait pleinement réussi ; « alors » distingue clairement ce second ποτέ de « maintenant ».
theological_decisions:
- issue: Sens de τὴν πίστιν
  choice: « la foi » désigne ici la foi chrétienne, comprise comme le message que Paul annonce désormais
  alternative: « la Bonne Nouvelle » ; ou la foi comme acte de croire
  rationale: Le contraste porte sur ce que Paul attaquait auparavant et proclame maintenant. L’article et l’emploi de εὐαγγελίζεται favorisent le sens objectif de message ou de contenu de la foi, tout en conservant le terme grec sans réduire entièrement son amplitude à « la Bonne Nouvelle ».
translation_notes:
  register: Français international moderne, naturel et digne. « Elles » reprend les Églises de Judée mentionnées au verset précédent. La formulation garde le contraste appuyé entre « autrefois », « maintenant » et « alors ».
