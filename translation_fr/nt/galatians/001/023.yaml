review_pass:
  verdict: revise
  source_fidelity: Le sens général est fidèle, y compris la valeur objective probable de « la foi ». Toutefois, ἐπόρθει est un imparfait de πορθέω (« ravager », « détruire ») et ne comporte pas en lui-même l’idée conative de « cherchait à ». Une formulation française peut conserver l’imparfait et l’action hostile sans l’atténuer.
  naturalness: « Elles entendaient seulement dire » est compréhensible, mais « Elles entendaient seulement ceci » rend plus naturellement en français la restriction de μόνον sur le contenu limité de ce qu’elles savaient. « Autrefois » est préférable à « alors » pour le second ποτέ et maintient le parallélisme temporel du verset.
  terminology: « La foi » convient pour τὴν πίστιν dans ce contexte et préserve l’expression sans imposer « Bonne Nouvelle ». La note offre utilement cette dernière comme possibilité contextuelle, tout en indiquant le grec.
  issues:
  - severity: medium
    issue: « qu’il cherchait alors à détruire »
    rationale: « Cherchait à détruire » introduit une nuance d’intention ou d’échec qui n’est pas explicitement portée par ἐπόρθει. Le verbe grec décrit l’action destructive en cours à l’imparfait. « Qu’il détruisait autrefois » conserve plus directement l’aspect et le sens.
  - severity: low
    issue: « alors » pour le second ποτέ
    rationale: ποτε signifie ici de nouveau « autrefois / jadis », non simplement « à ce moment-là ». Employer « autrefois » dans les deux membres reflète mieux le grec et le contraste avec « maintenant ».
  - severity: low
    issue: Tour « entendaient seulement dire »
    rationale: La tournure est possible, mais « n’entendaient que ceci » est plus idiomatique et rend clairement que leur connaissance se limitait à ce rapport.
  revised_text: 'Elles n’entendaient que ceci : « Celui qui nous persécutait autrefois annonce maintenant la foi[a] qu’il détruisait autrefois. »'
  revised_footnotes:
  - marker: a
    text: Ou « la Bonne Nouvelle » ; le grec porte « la foi », probablement au sens du message ou de la foi chrétienne que Paul combattait autrefois.
    reason: lexical_alternative
