id: GAL.1.12
reference: Galatians 1:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὐδὲ γὰρ ἐγὼ παρὰ ἀνθρώπου παρέλαβον αὐτό, ⸀οὔτε ἐδιδάχθην, ἀλλὰ δι’ ἀποκαλύψεως Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/012.yaml
  text: For I neither received it from a human source[a], nor was I taught it, but through a revelation of Jesus the Messiah.
translation:
  language: fr
  text: En effet, je ne l’ai reçu d’aucun être humain, et il ne m’a pas non plus été enseigné, mais je l’ai reçu par une révélation de Jésus le Messie.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression peut aussi être comprise comme « une révélation venant de Jésus le Messie » ou « une révélation concernant Jésus le Messie ».
    reason: alternative_reading
lexical_decisions:
- source_word: παρὰ ἀνθρώπου
  choice: d’aucun être humain
  rationale: Le singulier grec est générique. Cette formulation française exprime naturellement l’absence de toute origine ou médiation humaine sans désigner une personne précise.
- source_word: παρέλαβον
  choice: je l’ai reçu
  rationale: « Recevoir » convient au contexte de transmission d’un message et maintient le contraste entre tradition humaine et révélation.
- source_word: ἐδιδάχθην
  choice: il ne m’a pas non plus été enseigné
  rationale: Le passif grec est conservé dans une formulation française claire, qui souligne que Paul n’a reçu ce message par l’enseignement de personne.
- source_word: δι’ ἀποκαλύψεως
  choice: par une révélation
  rationale: « Par » rend la valeur de moyen de διά, tandis que l’article indéfini présente la révélation comme un événement concret.
- source_word: Ἰησοῦ Χριστοῦ
  choice: de Jésus le Messie
  rationale: Le complément introduit par « de » préserve en français l’ambiguïté du génitif grec entre la source de la révélation et son objet. « Le Messie » rend Χριστός comme titre.
theological_decisions:
- issue: Valeur du génitif dans ἀποκαλύψεως Ἰησοῦ Χριστοῦ
  choice: 'Formulation ambiguë : « une révélation de Jésus le Messie »'
  alternative: « une révélation venant de Jésus le Messie » ou « une révélation concernant Jésus le Messie »
  rationale: Le grec peut désigner Jésus comme celui qui donne la révélation ou comme celui qu’elle révèle. La traduction principale ne tranche pas artificiellement, et la note explicite les deux possibilités.
translation_notes:
  register: Français international moderne, digne et accessible. La reprise de « je l’ai reçu » après « mais » clarifie la construction française tout en conservant l’opposition centrale du grec.
