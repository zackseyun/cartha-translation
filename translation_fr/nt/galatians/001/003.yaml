  text: χάρις ὑμῖν καὶ εἰρήνη ἀπὸ θεοῦ πατρὸς ⸂καὶ κυρίου ἡμῶν⸃ Ἰησοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/003.yaml
  text: Grace to you and peace from God our Father and the Lord Jesus the Messiah,[a]
translation:
  language: fr
  text: Grâce et paix à vous de la part de Dieu le Père et de notre Seigneur Jésus, le Messie,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Jésus-Christ ».'
    reason: Signale la forme française traditionnelle correspondant au titre grec Χριστός.
lexical_decisions:
- source_word: χάρις
  choice: Grâce
  rationale: Terme consacré de la salutation paulinienne, qui conserve à la fois la forme de bénédiction et la portée théologique du mot.
- source_word: ὑμῖν
  choice: à vous
  rationale: Le datif désigne naturellement les destinataires de la salutation.
- source_word: εἰρήνη
  choice: paix
  rationale: Rend le sens courant tout en préservant l’arrière-plan biblique de plénitude et de bien-être.
- source_word: ἀπὸ
  choice: de la part de
  rationale: Exprime clairement la source de la grâce et de la paix dans une formule française naturelle.
- source_word: θεοῦ πατρὸς
  choice: Dieu le Père
  rationale: Suit l’ordre et la construction du texte grec retenu, où ἡμῶν se rattache le plus naturellement à κυρίου.
- source_word: κυρίου ἡμῶν
  choice: notre Seigneur
  rationale: Préserve le possessif et la force christologique du titre κύριος.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jésus, le Messie
  rationale: Traduit Χριστός comme titre messianique; l’apposition avec article est idiomatique en français moderne.
theological_decisions:
- issue: Faut-il traduire Χριστοῦ comme un titre ou conserver la forme traditionnelle « Christ » ?
  choice: Jésus, le Messie
  alternative: Jésus-Christ
  rationale: Dans cette salutation, Χριστός conserve sa valeur de désignation messianique. La traduction du titre est donc retenue, tandis que la forme traditionnelle est signalée en note.
- issue: À quel nom rattacher ἡμῶν (« notre ») ?
  choice: Dieu le Père et notre Seigneur
  alternative: Dieu notre Père et le Seigneur
  rationale: Dans le texte principal du SBLGNT fourni, ἡμῶν suit κυρίου et s’y rattache le plus naturellement. La traduction suit cette syntaxe sans harmoniser avec des formules pauliniennes voisines.
translation_notes:
  register: Formulation brève, digne et actuelle. La phrase nominale du grec est conservée plutôt que développée par « Que… soient données ». La virgule avant « le Messie » clarifie en français la valeur de titre en apposition.
