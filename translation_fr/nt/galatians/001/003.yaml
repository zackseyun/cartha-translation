  naturalness: La formulation est brève, claire et convenablement solennelle pour une salutation épistolaire. « Grâce et paix à vous » est une formule biblique française établie et naturelle dans ce registre. L’apposition « Jésus, le Messie » est lisible en français moderne et permet de distinguer le titre de la forme traditionnelle du nom.
