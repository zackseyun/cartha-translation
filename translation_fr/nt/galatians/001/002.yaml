  text: καὶ οἱ σὺν ἐμοὶ πάντες ἀδελφοί, ταῖς ἐκκλησίαις τῆς Γαλατίας·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/002.yaml
  text: 'and all the brothers with me[a], to the churches of Galatia:'
translation:
  language: fr
  text: 'et tous les frères qui sont avec moi[a], aux Églises de Galatie :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « frères et sœurs ». Le grec dit « frères », terme qui peut désigner l’ensemble des croyants, hommes et femmes.'
    reason: alternative lexicale; préserve la portée inclusive possible de ἀδελφοί sans l’expliciter dans le texte principal
lexical_decisions:
- source_word: καὶ
  choice: et
  rationale: La conjonction relie ce groupe d’expéditeurs à Paul, nommé au verset précédent; la minuscule préserve la continuité de la phrase.
- source_word: οἱ σὺν ἐμοὶ πάντες ἀδελφοί
  choice: tous les frères et sœurs qui sont avec moi
  rationale: Dans ce contexte communautaire, le pluriel masculin ἀδελφοί peut désigner collectivement les croyants des deux sexes. « Frères et sœurs » exprime naturellement cette portée possible en français moderne, tandis que « qui sont avec moi » rend clairement σὺν ἐμοί.
- source_word: ἐκκλησίαις
  choice: Églises
  rationale: Dans l’adresse paulinienne, ἐκκλησία désigne les communautés chrétiennes locales; « Églises » est l’équivalent français courant et digne.
- source_word: τῆς Γαλατίας
  choice: de Galatie
  rationale: Le complément au génitif est rendu directement par « de Galatie », formulation idiomatique qui conserve la relation exprimée par le grec.
theological_decisions:
- issue: Portée de ἀδελφοί
  choice: frères et sœurs
  alternative: frères
  rationale: Le masculin pluriel grec peut avoir ici une portée collective englobant des femmes. La traduction inclusive évite que le français moderne ne suggère à tort un groupe exclusivement masculin, sans ajouter de distinction théologique.
translation_notes:
  register: Français international moderne, naturel et digne. La tournure reste intégrée à l’adresse épistolaire commencée au verset 1; la ponctuation finale annonce la suite.
