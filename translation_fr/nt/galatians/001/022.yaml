id: GAL.1.22
reference: Galatians 1:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἤμην δὲ ἀγνοούμενος τῷ προσώπῳ ταῖς ἐκκλησίαις τῆς Ἰουδαίας ταῖς ἐν Χριστῷ,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/022.yaml
  text: But I was personally unknown by face to the churches of Judea that are in Messiah[b][a],
translation:
  language: fr
  text: Mais les Églises de Judée qui sont dans le Messie[b] ne me connaissaient pas de vue[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ne me connaissaient pas personnellement » ou « j’étais personnellement inconnu des Églises ».
    reason: lexical_alternative
  - marker: b
    text: Ou « dans le Christ ».
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Mais
  rationale: La particule marque ici une transition avec une légère nuance de contraste; « Mais » rend naturellement ce mouvement du discours.
- source_word: ἤμην … ἀγνοούμενος
  choice: ne me connaissaient pas
  rationale: La construction périphrastique à l’imparfait exprime le fait que Paul demeurait inconnu de ces communautés. La tournure active est plus naturelle en français que « j’étais inconnu » tout en conservant le sens.
- source_word: τῷ προσώπῳ
  choice: de vue
  rationale: L’expression idiomatique indique l’absence de connaissance ou de reconnaissance personnelle, en face à face. « De vue » est précis et naturel en français.
- source_word: ἐκκλησίαις
  choice: Églises
  rationale: Dans ce contexte paulinien, le terme désigne les communautés chrétiennes; « Églises » est le terme français courant et clair.
- source_word: Ἰουδαίας
  choice: Judée
  rationale: Il s’agit du nom géographique conventionnel en français.
- source_word: ἐν Χριστῷ
  choice: dans le Messie
  rationale: Χριστός conserve ici sa valeur de titre, « le Messie », et la préposition ἐν est maintenue par « dans », sans expliciter davantage la relation théologique.
theological_decisions:
- issue: Traduction de Χριστῷ dans ἐν Χριστῷ
  choice: Messie
  alternative: Christ
  rationale: Le titre grec signifie « Messie » ou « Oint ». Dans cette formule, il caractérise les Églises par leur relation au Messie; « Christ » demeure toutefois la formulation traditionnelle possible.
- issue: Portée de l’expression ἐν Χριστῷ
  choice: dans le Messie
  alternative: qui appartiennent au Messie
  rationale: La traduction formelle « dans le Messie » préserve la densité et l’ambiguïté relationnelle de la formule paulinienne, sans la réduire à la seule idée d’appartenance.
translation_notes:
  register: Français moderne, clair et digne. La syntaxe française place les Églises comme sujet afin de rendre naturellement l’idiome grec, tandis que « de vue » conserve l’idée de τῷ προσώπῳ. La majuscule à « Églises » marque ici les communautés chrétiennes locales.
