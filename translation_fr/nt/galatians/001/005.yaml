lexical_decisions:
- source_word: ᾧ
  choice: à qui
  rationale: Le pronom relatif au datif introduit naturellement la doxologie et renvoie à « notre Dieu et Père » au verset précédent.
- source_word: δόξα
  choice: la gloire
  rationale: « La gloire » est l’expression française consacrée dans une doxologie et conserve la portée religieuse du terme grec.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: pour toujours et à jamais
  rationale: Cette formule idiomatique exprime une durée sans fin. La tournure retenue est claire, solennelle et naturelle en français contemporain.
- source_word: ἀμήν
  choice: Amen
  rationale: La translittération traditionnelle française conserve la fonction d’affirmation solennelle qui clôt la doxologie.
theological_decisions:
- issue: Sens verbal sous-entendu dans la doxologie
  choice: à qui soit la gloire
  alternative: à qui appartient la gloire
  rationale: Le grec n’exprime aucun verbe. Le subjonctif « soit » restitue naturellement en français la force doxologique et priante, sans transformer explicitement la formule en affirmation de possession.
translation_notes:
  register: Français moderne, digne et liturgiquement familier. La syntaxe concise respecte la forme elliptique et solennelle de la doxologie grecque.
