id: GAL.1.13
reference: Galatians 1:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἠκούσατε γὰρ τὴν ἐμὴν ἀναστροφήν ποτε ἐν τῷ Ἰουδαϊσμῷ, ὅτι καθ’ ὑπερβολὴν ἐδίωκον τὴν ἐκκλησίαν τοῦ θεοῦ καὶ ἐπόρθουν αὐτήν,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/013.yaml
  text: For you have heard of my former way of life in Judaism[d][c][b][a], that I was persecuting the church of God beyond measure and was ravaging it.
translation:
  language: fr
  text: 'Vous avez en effet entendu parler de ma conduite d’autrefois dans le judaïsme[a] : je persécutais à l’extrême[b] l’Église de Dieu et je la ravageais[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans la religion juive » ou « selon le mode de vie juif ».
    reason: lexical_alternative
  - marker: b
    text: Ou « de façon démesurée » ou « à un degré extraordinaire ».
    reason: lexical_alternative
  - marker: c
    text: Ou « je la détruisais » ou « je cherchais à la détruire ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστροφήν ποτε
  choice: ma conduite d’autrefois
  rationale: ἀναστροφή désigne la conduite ou la manière de vivre, tandis que ποτε situe celle-ci dans le passé. Cette formulation française est naturelle et conserve les deux éléments.
- source_word: Ἰουδαϊσμῷ
  choice: dans le judaïsme
  rationale: Le terme désigne ici la religion et le mode de vie juifs auxquels Paul appartenait alors. « Judaïsme » est le terme français établi et direct.
- source_word: καθ’ ὑπερβολὴν
  choice: à l’extrême
  rationale: L’expression marque un degré exceptionnel et excessif. « À l’extrême » en restitue la force sans alourdir la phrase.
- source_word: ἐδίωκον
  choice: je persécutais
  rationale: L’imparfait français rend l’action passée prolongée ou répétée exprimée par l’imparfait grec.
- source_word: ἐκκλησίαν τοῦ θεοῦ
  choice: l’Église de Dieu
  rationale: Dans ce contexte, ἐκκλησία désigne la communauté des croyants en Christ. « Église » est le rendu français courant, sans préciser indûment sa structure institutionnelle.
- source_word: ἐπόρθουν
  choice: je cherchais à la détruire
  rationale: Le verbe exprime une action dévastatrice et peut, avec l’imparfait, présenter une entreprise en cours plutôt que sa réussite. Cette traduction évite de laisser entendre que l’Église a effectivement été détruite.
theological_decisions:
- issue: Rendre ἐκκλησία par « Église » ou « assemblée »
  choice: l’Église de Dieu
  alternative: l’assemblée de Dieu
  rationale: « Église » identifie naturellement en français la communauté croyante que Paul persécutait. Le choix ne suppose pas ici une institution ultérieure particulière.
- issue: Présenter ἐπόρθουν comme destruction accomplie ou entreprise de destruction
  choice: je cherchais à la détruire
  alternative: je la ravageais
  rationale: Le contexte décrit l’effort violent de Paul contre l’Église, non sa destruction effective. Le rendu retenu préserve la force du verbe et la valeur durative de l’imparfait sans affirmer un résultat accompli.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve le lien explicatif de γάρ avec « en effet » et emploie les imparfaits pour refléter les actions continues du texte grec.
