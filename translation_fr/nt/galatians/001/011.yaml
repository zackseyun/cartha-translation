id: GAL.1.11
reference: Galatians 1:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Γνωρίζω ⸀γὰρ ὑμῖν, ἀδελφοί, τὸ εὐαγγέλιον τὸ εὐαγγελισθὲν ὑπ’ ἐμοῦ ὅτι οὐκ ἔστιν κατὰ ἄνθρωπον·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/011.yaml
  text: For I make known to you[a], brothers[b], that the gospel proclaimed by me is not according to man.
translation:
  language: fr
  text: 'Je veux en effet que vous le sachiez, frères et sœurs[a] : l’Évangile que j’ai annoncé n’est pas d’origine humaine[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : frères. Le terme grec peut ici désigner les hommes et les femmes de la communauté.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : selon l’homme. L’expression peut aussi signifier « conforme aux critères humains ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Γνωρίζω ὑμῖν
  choice: je veux que vous le sachiez
  rationale: Cette tournure rend naturellement en français moderne la formule par laquelle Paul introduit une précision importante, tout en conservant l’idée de faire savoir.
- source_word: γὰρ
  choice: en effet
  rationale: Le connecteur introduit une explication liée à ce qui précède ; « en effet » exprime clairement ce rapport en français.
- source_word: ἀδελφοί
  choice: frères et sœurs
  rationale: Bien que le nom grec soit grammaticalement masculin pluriel, il désigne ici vraisemblablement l’ensemble de la communauté ; la note conserve la forme littérale.
- source_word: εὐαγγέλιον
  choice: l’Évangile
  rationale: « Évangile » est le terme français consacré et convient au sens paulinien précis.
- source_word: τὸ εὐαγγελισθὲν ὑπ’ ἐμοῦ
  choice: que j’ai annoncé
  rationale: La reformulation active est naturelle en français et conserve l’idée de la proclamation publique faite par Paul.
- source_word: κατὰ ἄνθρωπον
  choice: d’origine humaine
  rationale: Le verset suivant met l’accent sur le fait que Paul n’a reçu ni appris cet Évangile d’un être humain ; cette formulation rend donc le sens contextuel le plus probable sans supprimer l’autre possibilité, signalée en note.
theological_decisions:
- issue: κατὰ ἄνθρωπον peut indiquer l’origine humaine ou la conformité à des critères humains.
  choice: d’origine humaine
  alternative: 'conforme aux critères humains ; littéralement : selon l’homme'
  rationale: Galates 1.12 développe immédiatement la question de la provenance de l’Évangile. La traduction principale suit ce contexte, tandis que la note préserve l’ambiguïté réelle de l’expression grecque.
- issue: ἀδελφοί est une forme masculine susceptible d’inclure toute la communauté.
  choice: frères et sœurs
  alternative: frères
  rationale: Dans cette adresse communautaire, la forme grecque peut inclure les croyantes aussi bien que les croyants. La traduction explicite cette portée probable, et la note donne la forme littérale.
translation_notes:
  register: Français international moderne, clair et digne. « Je veux que vous le sachiez » évite la raideur de « je vous le fais savoir », tandis que « en effet » maintient le lien explicatif avec le contexte précédent.
