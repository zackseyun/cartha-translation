  source_fidelity: 'Le texte rend fidèlement la structure de Ga 1.6 : l’étonnement indigné (Θαυμάζω), la rapidité (οὕτως ταχέως), la défection envers « celui qui vous a appelés », et le déplacement vers un évangile qualitativement différent. « Pour vous tourner vers » explicite avec naturel en français le mouvement impliqué par εἰς, sans identifier celui qui appelle ni résoudre la valeur de ἐν.'
