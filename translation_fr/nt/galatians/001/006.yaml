  terminology: « Messie » rend légitimement le titre Χριστός, conformément au choix de projet attesté dans l’audit anglais. « Évangile » est le terme français établi pour εὐαγγέλιον, et « différent » convient à ἕτερον sans anticiper indûment le contraste argumenté au verset suivant. Les notes a et c préservent correctement les ambiguïtés pertinentes; la note b explique le choix lexical.
