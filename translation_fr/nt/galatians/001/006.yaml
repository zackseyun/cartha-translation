id: GAL.1.6
reference: Galatians 1:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Θαυμάζω ὅτι οὕτως ταχέως μετατίθεσθε ἀπὸ τοῦ καλέσαντος ὑμᾶς ἐν χάριτι Χριστοῦ εἰς ἕτερον εὐαγγέλιον,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/006.yaml
  text: I am astonished that you are so quickly deserting the one who called you in the grace of Messiah for a different gospel[c][b][a],
translation:
  language: fr
  text: Je suis stupéfait que vous abandonniez si vite celui qui vous a appelés dans la grâce du Messie[a][b], pour vous tourner vers un évangile différent[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « par la grâce du Messie ». La préposition grecque peut indiquer le domaine dans lequel l’appel a lieu ou le moyen par lequel il s’accomplit.'
    reason: alternative_reading
  - marker: b
    text: Le grec emploie ici Christos, titre qui signifie « Messie ».
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « vers un autre évangile ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Θαυμάζω
  choice: Je suis stupéfait
  rationale: Exprime en français actuel l’étonnement indigné et consterné de Paul, avec plus de force que « je m’étonne ».
- source_word: οὕτως ταχέως
  choice: si vite
  rationale: Rend naturellement l’insistance sur la rapidité surprenante de leur changement.
- source_word: μετατίθεσθε
  choice: vous abandonniez
  rationale: Le contexte décrit une défection à l’égard d’une personne qui les a appelés, et non un simple changement d’opinion. Le subjonctif français dépend naturellement de « je suis stupéfait que ».
- source_word: τοῦ καλέσαντος ὑμᾶς
  choice: celui qui vous a appelés
  rationale: Conserve l’appel antérieur exprimé par le participe aoriste sans préciser dans le texte l’identité du sujet implicite.
- source_word: ἐν χάριτι Χριστοῦ
  choice: dans la grâce du Messie
  rationale: Traduction transparente qui préserve la possibilité que ἐν indique le domaine ou le moyen, ainsi que le rapport génitif avec le Messie.
- source_word: Χριστοῦ
  choice: du Messie
  rationale: Rend le contenu titulaire de Χριστός plutôt que de le traiter uniquement comme un nom propre traditionnel.
- source_word: εἰς ἕτερον εὐαγγέλιον
  choice: pour vous tourner vers un évangile différent
  rationale: La formulation française explicite naturellement le mouvement vers un autre message; « différent » rend la nuance qualitative de ἕτερον, développée au verset suivant.
theological_decisions:
- issue: Identité de « celui qui vous a appelés »
  choice: L’identité reste implicite dans le texte principal.
  alternative: « Dieu, qui vous a appelés » ou « le Messie, qui vous a appelés »
  rationale: Le grec immédiat ne nomme pas explicitement celui qui appelle; la traduction conserve cette retenue et la tension interprétative.
- issue: Valeur de ἐν dans « ἐν χάριτι Χριστοῦ »
  choice: « dans la grâce du Messie »
  alternative: « par la grâce du Messie »
  rationale: La traduction principale garde la notion de sphère, tandis que la note signale la valeur instrumentale possible sans trancher.
translation_notes:
  register: Français international moderne, digne et direct. « Je suis stupéfait » conserve le ton de vive consternation; « abandonniez » souligne la dimension personnelle de la défection. La phrase reste fluide tout en maintenant les ambiguïtés du grec dans les notes.
