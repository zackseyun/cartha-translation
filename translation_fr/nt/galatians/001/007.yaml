  text: ὃ οὐκ ἔστιν ἄλλο· εἰ μή τινές εἰσιν οἱ ταράσσοντες ὑμᾶς καὶ θέλοντες μεταστρέψαι τὸ εὐαγγέλιον τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/007.yaml
  text: which is not another gospel[b][a]; except that there are some who are troubling you and wanting to distort the gospel of Messiah.
translation:
  language: fr
  text: qui n’est pas un autre Évangile. Il y a seulement des gens qui vous troublent et qui veulent dénaturer[b] l’Évangile du Messie[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « du Christ ».
    reason: lexical_alternative
  - marker: b
    text: Ou « pervertir ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλο
  choice: un autre
  rationale: Le nom « Évangile » est sous-entendu d’après le verset 6. La tournure « qui n’en est pas un autre » conserve le lien relatif et la négation catégorique de Paul sans répéter inutilement le nom.
- source_word: εἰ μή
  choice: seulement
  rationale: Dans ce contexte, εἰ μή introduit une réserve explicative plutôt qu’une condition stricte. « Seulement » exprime naturellement cette qualification en français.
- source_word: ταράσσοντες
  choice: vous jettent dans le trouble
  rationale: Cette expression restitue la force active du participe et l’idée de bouleversement ou de confusion, tout en restant claire en français moderne.
- source_word: θέλοντες
  choice: cherchent à
  rationale: Avec l’infinitif qui suit, « cherchent à » exprime une intention active de manière plus idiomatique que le calque « veulent », sans affirmer qu’ils atteignent leur but.
- source_word: μεταστρέψαι
  choice: dénaturer
  rationale: Le verbe désigne une transformation qui altère profondément la nature du message. « Dénaturer » est actuel, précis et suffisamment fort; « pervertir » demeure une possibilité plus marquée.
- source_word: εὐαγγέλιον
  choice: l’Évangile
  rationale: « Évangile » est le terme français établi dans le contexte paulinien et conserve ici la portée définie du message proclamé.
- source_word: Χριστοῦ
  choice: du Messie
  rationale: Χριστός conserve ici sa valeur de titre. « Messie » rend cette dimension explicitement et maintient l’arrière-plan messianique juif du terme.
theological_decisions:
- issue: Valeur titulaire ou forme devenue nom propre de Χριστοῦ
  choice: du Messie
  alternative: du Christ
  rationale: Le génitif peut désigner l’Évangile appartenant au Messie ou ayant le Messie pour objet. Le texte ne tranche pas entre ces nuances; rendre Χριστός par « Messie » préserve sa valeur titulaire sans résoudre le rapport précis du génitif.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve son caractère de proposition relative dépendant du verset précédent. « Certaines personnes » évite le masculin générique inutile, tandis que « vous jettent dans le trouble » garde la vigueur pastorale de l’original.
