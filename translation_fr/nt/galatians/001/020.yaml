  variant: modern international French
source:
  edition: SBLGNT
  text: ἃ δὲ γράφω ὑμῖν, ἰδοὺ ἐνώπιον τοῦ θεοῦ ὅτι οὐ ψεύδομαι.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/020.yaml
  text: What I am writing to you—behold[a], before God[b], I am not lying.
translation:
  language: fr
  text: Ce que je vous écris — voici, devant Dieu, je ne mens pas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἃ
  choice: ce que
  rationale: Le pronom relatif neutre pluriel désigne idiomatiquement le contenu des affirmations écrites de Paul ; « ce que » est naturel en français moderne.
- source_word: δὲ
  choice: —
  rationale: La particule marque ici une légère transition ou mise en relief plutôt qu’une forte opposition ; la ponctuation française en rend discrètement la fonction sans ajouter un connecteur pesant.
- source_word: γράφω ὑμῖν
  choice: je vous écris
  rationale: Le présent français convient naturellement au contexte épistolaire, et « vous » désigne les destinataires.
- source_word: ἰδοὺ
  choice: oui[a]
  rationale: La particule appelle solennellement l’attention. « Oui » en restitue ici l’insistance dans un français actuel ; la note conserve le sens littéral « voici ».
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: devant Dieu[b]
  rationale: Cette formule concise exprime que Paul affirme sa véracité sous le regard et devant l’autorité de Dieu.
- source_word: ὅτι
  choice: '[rendu par la ponctuation]'
  rationale: La conjonction introduit le contenu de l’affirmation solennelle ; en français, les deux-points implicites de la construction et la ponctuation suffisent.
- source_word: οὐ ψεύδομαι
  choice: je ne mens pas
  rationale: Formulation directe, actuelle et fidèle de la dénégation emphatique de Paul.
theological_decisions:
- issue: Portée de l’appel à Dieu
  choice: Une affirmation solennelle prononcée devant Dieu
  alternative: Une simple formule d’insistance sans dimension de responsabilité devant Dieu
  rationale: ἐνώπιον τοῦ θεοῦ place explicitement Paul sous le regard de Dieu et renforce sa déclaration de vérité, sans qu’il soit nécessaire d’ajouter la notion plus précise d’un serment formel.
translation_notes:
  register: Français moderne, direct et digne. Le tiret maintient le mouvement solennel de la phrase, tandis que « oui » évite l’emploi peu naturel de « voici » isolé tout en conservant sa valeur emphatique grâce à la note.
