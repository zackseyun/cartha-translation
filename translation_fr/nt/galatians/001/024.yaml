lexical_decisions:
- source_word: καὶ
  choice: Et
  rationale: Conjonction simple qui poursuit naturellement le récit de Paul.
- source_word: ἐδόξαζον
  choice: rendaient gloire
  rationale: L’expression française « rendre gloire à Dieu » traduit précisément δοξάζω. L’imparfait restitue ici l’aspect continu ou répété de l’imparfait grec.
- source_word: ἐν ἐμοὶ
  choice: à cause de moi
  rationale: 'Dans ce contexte, ἐν ἐμοὶ indique naturellement le motif de leur réaction : ce qu’ils avaient appris au sujet de Paul les amenait à glorifier Dieu. La traduction plus littérale est conservée en note.'
- source_word: τὸν θεόν
  choice: Dieu
  rationale: Complément direct de ἐδόξαζον ; « Dieu » est la traduction française normale et exacte.
theological_decisions:
- issue: Sens de ἐν ἐμοὶ
  choice: 'Valeur causale ou associative : « à cause de moi »'
  alternative: 'Valeur plus littérale ou sphérique : « en moi »'
  rationale: Le contexte décrit la réaction des communautés de Judée à la nouvelle de la conversion et du ministère de Paul. « À cause de moi » exprime clairement qu’elles glorifiaient Dieu en raison de ce qu’il avait accompli dans la vie de Paul, tandis que la note préserve l’ambiguïté réelle de la formulation grecque.
translation_notes:
  register: Français moderne, courant et digne. L’imparfait « rendaient » conserve la nuance durative ou répétée du grec sans alourdir la phrase.
