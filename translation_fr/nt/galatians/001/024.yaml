  text: And they glorified God because of me[a].
translation:
  language: fr
  text: Et ils rendaient gloire à Dieu à cause de moi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « en moi » ou « à mon sujet ».'
