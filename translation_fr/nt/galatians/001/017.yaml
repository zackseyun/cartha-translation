id: GAL.1.17
reference: Galatians 1:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὐδὲ ἀνῆλθον εἰς Ἱεροσόλυμα πρὸς τοὺς πρὸ ἐμοῦ ἀποστόλους, ἀλλὰ ἀπῆλθον εἰς Ἀραβίαν, καὶ πάλιν ὑπέστρεψα εἰς Δαμασκόν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/017.yaml
  text: Nor did I go up to Jerusalem to those who were apostles before me, but I went away to Arabia, and returned again to Damascus.
translation:
  language: fr
  text: Je ne suis pas non plus monté à Jérusalem auprès de ceux qui étaient apôtres avant moi, mais je suis parti pour l’Arabie et je suis revenu une nouvelle fois à Damas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐδὲ
  choice: Je ne suis pas non plus
  rationale: Relie étroitement la phrase au contexte négatif précédent et rend naturellement en français la valeur de continuation de οὐδὲ.
- source_word: ἀνῆλθον
  choice: monté
  rationale: Conserve l’expression conventionnelle et géographique du déplacement vers Jérusalem, sans recourir au terme trop soutenu « ascendu ».
- source_word: Ἱεροσόλυμα
  choice: Jérusalem
  rationale: Forme française usuelle du nom de lieu.
- source_word: πρὸς τοὺς πρὸ ἐμοῦ ἀποστόλους
  choice: auprès de ceux qui étaient apôtres avant moi
  rationale: « Auprès de » convient à une visite auprès de personnes, tandis que la relative exprime clairement l’antériorité temporelle sans suggérer une supériorité de rang.
- source_word: ἀλλὰ
  choice: mais
  rationale: Marque simplement le contraste entre le déplacement non effectué à Jérusalem et le départ pour l’Arabie.
- source_word: ἀπῆλθον
  choice: je suis parti
  rationale: Rend le mouvement de départ porté par le préverbe ἀπ- dans un français naturel; « je me suis éloigné » serait inutilement appuyé.
- source_word: Ἀραβίαν
  choice: Arabie
  rationale: Nom français usuel de la région, dont le verset ne précise pas l’étendue historique.
- source_word: πάλιν
  choice: puis
  rationale: Dans cette séquence de déplacements, le retour lui-même exprime déjà l’idée de « revenir »; « puis » rend naturellement l’enchaînement, sans le pléonasme peu élégant « retourné de nouveau ».
- source_word: ὑπέστρεψα
  choice: je suis retourné
  rationale: Équivalent français direct et idiomatique dans un contexte de voyage.
- source_word: Δαμασκόν
  choice: Damas
  rationale: Forme française usuelle du nom de la ville.
theological_decisions:
- issue: Sens de « avant moi » à propos des apôtres
  choice: 'Antériorité temporelle: ils étaient apôtres avant Paul'
  alternative: Supériorité de rang ou d’autorité par rapport à Paul
  rationale: πρὸ ἐμοῦ indique le plus naturellement une priorité dans le temps. La formulation française préserve ce sens sans introduire une hiérarchie que le texte n’énonce pas.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche du mouvement argumentatif grec tout en évitant les tournures artificielles. Aucun appel de note n’est nécessaire.
