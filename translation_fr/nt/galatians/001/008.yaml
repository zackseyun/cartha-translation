reference: Galatians 1:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀλλὰ καὶ ἐὰν ἡμεῖς ἢ ἄγγελος ἐξ οὐρανοῦ ⸀εὐαγγελίζηται ⸀ὑμῖν παρ’ ὃ εὐηγγελισάμεθα ὑμῖν, ἀνάθεμα ἔστω.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/008.yaml
  text: But even if we or an angel from heaven should proclaim good news to you contrary to what we proclaimed to you[c][b][a], let him be accursed.
translation:
  language: fr
  text: Mais même si nous-mêmes, ou un ange venu du ciel, vous annoncions une bonne nouvelle[a] contraire à ce que nous vous avons annoncé[b], qu’il soit maudit[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vous prêchions l’Évangile ». Le grec emploie le verbe qui signifie « annoncer une bonne nouvelle ».
    reason: lexical_alternative
  - marker: b
    text: Ou « différente de ce que nous vous avons annoncé » ou « allant au-delà de ce que nous vous avons annoncé ».
    reason: lexical_alternative
  - marker: c
    text: Ou « qu’il soit anathème » ou « qu’il soit sous la malédiction ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ καὶ ἐὰν
  choice: Mais même si
  rationale: Rend à la fois l’opposition marquée par ἀλλά, l’insistance de καί et l’hypothèse introduite par ἐάν dans un français naturel.
- source_word: ἡμεῖς ἢ ἄγγελος ἐξ οὐρανοῦ
  choice: nous-mêmes, ou un ange venu du ciel
  rationale: « Nous-mêmes » fait ressortir l’insistance du pronom grec, tandis que « venu du ciel » exprime naturellement l’origine indiquée par ἐξ οὐρανοῦ.
- source_word: εὐαγγελίζηται
  choice: vous annoncions une bonne nouvelle
  rationale: Conserve la forme verbale grecque et son sens concret d’annonce d’une bonne nouvelle, sans la remplacer d’emblée par le nom théologique « Évangile ».
- source_word: παρ’ ὃ
  choice: contraire à celle que
  rationale: Dans ce contexte polémique, παρά signale un écart par rapport au message apostolique reçu. « Contraire à » en exprime bien la gravité, tandis qu’une note maintient les nuances possibles « différente de » et « allant au-delà de ».
- source_word: εὐηγγελισάμεθα
  choice: nous vous avons annoncée
  rationale: Reprend le verbe « annoncer » et maintient ainsi le lien lexical avec εὐαγγελίζηται sans alourdir la phrase.
- source_word: ἀνάθεμα ἔστω
  choice: qu’il soit maudit
  rationale: Restitue clairement et solennellement la formule imprécatoire, sans donner à ἀνάθεμα un sens ecclésiastique technique plus tardif.
theological_decisions:
- issue: Portée de la formule de malédiction prononcée par Paul
  choice: Une véritable sentence de malédiction contre quiconque annonce un message opposé à celui déjà proclamé
  alternative: Une formule technique d’excommunication, ou plus largement l’affirmation que cette personne se trouve sous une malédiction divine
  rationale: Le grec est solennel et judiciaire, mais ne précise pas ici une procédure ecclésiastique. « Qu’il soit maudit » conserve sa force sans imposer un développement doctrinal ultérieur.
- issue: Nature de l’écart exprimé par παρ’ ὃ
  choice: Un message contraire au message apostolique antérieur
  alternative: Un message différent de celui-ci ou qui va au-delà de celui-ci
  rationale: Le contexte immédiat favorise une opposition grave au message reçu, mais la note préserve l’étendue sémantique réelle de la préposition.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation garde l’insistance de « nous-mêmes », le contraste saisissant avec un messager céleste et la sévérité de la conclusion. L’accord verbal à la première personne du pluriel tient compte de la présence de « nous-mêmes » parmi les deux sujets coordonnés par « ou ».
