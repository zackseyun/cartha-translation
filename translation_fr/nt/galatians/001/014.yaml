  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ προέκοπτον ἐν τῷ Ἰουδαϊσμῷ ὑπὲρ πολλοὺς συνηλικιώτας ἐν τῷ γένει μου, περισσοτέρως ζηλωτὴς ὑπάρχων τῶν πατρικῶν μου παραδόσεων.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/014.yaml
  text: And I was advancing in Judaism beyond many of my contemporaries among my people[b][a], being far more zealous for the traditions of my fathers.
translation:
  language: fr
  text: Et je faisais plus de progrès dans le judaïsme[a] que beaucoup de ceux de mon âge au sein de mon peuple[b], étant bien plus zélé pour les traditions de mes ancêtres[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans la religion juive » ou « dans le mode de vie juif ».
    reason: lexical_alternative
  - marker: b
    text: Ou « dans ma nation » ; le mot grec peut désigner un peuple, une nation ou un groupe d’origine.
    reason: lexical_alternative
  - marker: c
    text: Littéralement, « les traditions de mes pères ».
    reason: lexical_alternative
lexical_decisions:
- source_word: προέκοπτον
  choice: je progressais
  rationale: L’imparfait grec présente une progression continue dans le passé. « Je progressais » conserve cet aspect sans transformer explicitement la progression en réussite ou en supériorité absolue.
- source_word: Ἰουδαϊσμῷ
  choice: dans le judaïsme
  rationale: « Judaïsme » est le terme français courant et concis. Une note signale que le mot grec peut désigner plus largement la religion ou le mode de vie juif.
- source_word: ὑπὲρ πολλοὺς συνηλικιώτας
  choice: plus que beaucoup de ceux de mon âge
  rationale: ὑπέρ exprime ici une comparaison, tandis que συνηλικιώτας désigne des personnes du même âge. Cette formulation est plus immédiatement claire que « contemporains », qui n’exprime pas toujours l’idée d’âge égal.
- source_word: ἐν τῷ γένει μου
  choice: au sein de mon peuple
  rationale: γένος peut désigner le groupe d’origine, le peuple ou la nation. « Mon peuple » rend naturellement la référence ethnosociale sans employer le terme moderne potentiellement trompeur de « race ».
- source_word: περισσοτέρως
  choice: bien plus
  rationale: Cette expression française naturelle conserve la forte valeur comparative de l’adverbe.
- source_word: ζηλωτὴς ὑπάρχων
  choice: moi qui étais bien plus zélé
  rationale: La tournure relative restitue le participe grec avec naturel, sans imposer une relation causale explicite. « Zélé » préserve l’intensité du terme sans les connotations politiques possibles de « zélote ».
- source_word: τῶν πατρικῶν μου παραδόσεων
  choice: pour les traditions de mes ancêtres
  rationale: πατρικός renvoie à ce qui vient des pères ou des ancêtres. « Traditions de mes ancêtres » exprime clairement en français moderne le caractère hérité de ces traditions, tandis qu’une note conserve la formulation plus littérale.
