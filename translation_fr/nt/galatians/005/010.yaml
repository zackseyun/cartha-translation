id: GAL.5.10
reference: Galatians 5:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐγὼ πέποιθα εἰς ὑμᾶς ἐν κυρίῳ ὅτι οὐδὲν ἄλλο φρονήσετε· ὁ δὲ ταράσσων ὑμᾶς βαστάσει τὸ κρίμα, ὅστις ⸀ἐὰν ᾖ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/010.yaml
  text: I am confident in the Lord about you[a], that you will think nothing else; but the one who is troubling you will bear the judgment[b], whoever he may be.
translation:
  language: fr
  text: 'J’ai confiance dans le Seigneur, en ce qui vous concerne : vous n’adopterez aucun autre point de vue[a]. Mais celui qui vous trouble aura à subir le jugement, qui qu’il soit[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vous ne penserez pas autrement ». Le verbe grec peut désigner non seulement l’acte de penser, mais aussi une manière de voir ou une disposition d’esprit.
    reason: lexical_alternative
  - marker: b
    text: Ou « peu importe qui il est ».
    reason: alternative_rendering
lexical_decisions:
- source_word: πέποιθα
  choice: J’ai confiance
  rationale: Le parfait grec exprime ici un état de confiance établi. Le présent idiomatique français « J’ai confiance » en rend naturellement la valeur actuelle.
- source_word: εἰς ὑμᾶς
  choice: à votre sujet
  rationale: Avec πέποιθα, la préposition oriente la confiance vers les destinataires. « À votre sujet » exprime clairement que la confiance de Paul concerne leur réaction, sans suggérer qu’ils en sont le fondement.
- source_word: ἐν κυρίῳ
  choice: dans le Seigneur
  rationale: Cette expression paulinienne présente le Seigneur comme la sphère ou le fondement de la confiance de Paul, sans obliger à trancher entre ces nuances.
- source_word: οὐδὲν ἄλλο φρονήσετε
  choice: vous ne penserez pas autrement
  rationale: Cette formulation française naturelle conserve la négation de toute autre manière de penser. La note signale la nuance possible de point de vue ou de disposition d’esprit portée par φρονέω.
- source_word: ὁ δὲ ταράσσων ὑμᾶς
  choice: Mais celui qui vous trouble
  rationale: Le participe présent désigne la personne qui provoque actuellement agitation et désarroi parmi les Galates. « Trouble » garde cette force sans préciser davantage la nature de son action.
- source_word: βαστάσει τὸ κρίμα
  choice: subira le jugement
  rationale: En français, « subir le jugement » rend naturellement l’idée de devoir en supporter la conséquence. « Jugement » préserve l’étendue sémantique de κρίμα entre verdict, sentence et peine, sans imposer l’idée de condamnation éternelle.
- source_word: ὅστις ἐὰν ᾖ
  choice: qui qu’il soit
  rationale: La construction relative indéfinie indique que l’identité ou le rang du perturbateur ne change rien à l’avertissement. « Qui qu’il soit » en exprime clairement la portée concessive.
theological_decisions:
- issue: Nature de la confiance de Paul envers les Galates
  choice: Paul exprime au sujet de leur future manière de penser une confiance fondée dans le Seigneur.
  alternative: Une certitude absolue et inconditionnelle quant à la persévérance de tous, ou un simple optimisme humain.
  rationale: Le texte associe une confiance personnelle explicite à l’expression « dans le Seigneur » et à une attente au futur. La traduction maintient ensemble ces éléments sans transformer cette confiance en affirmation déterministe ni la réduire à un sentiment personnel.
- issue: Portée de τὸ κρίμα
  choice: Un jugement que le perturbateur devra subir, sans précision sur sa forme exacte.
  alternative: La condamnation éternelle en particulier, ou de simples conséquences sociales et disciplinaires.
  rationale: κρίμα peut désigner le jugement, le verdict ou la peine qui en résulte. Le verset n’en précise pas davantage la nature ; « le jugement » maintient donc la gravité de l’avertissement sans excès doctrinal.
translation_notes:
  register: Français international moderne, digne et accessible. La ponctuation par deux-points explicite naturellement le contenu de la confiance sans ajouter de lien logique étranger au grec. « Subira le jugement » privilégie une expression française courante tout en maintenant l’indétermination de κρίμα.
