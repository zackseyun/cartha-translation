  text: ἡ πεισμονὴ οὐκ ἐκ τοῦ καλοῦντος ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/008.yaml
  text: This persuasion is not from the one who calls you[a].
translation:
  language: fr
  text: Cette persuasion ne vient pas de celui qui vous appelle[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Cette influence ne vient pas de celui qui vous appelle. »
    reason: Alternative lexicale pour le nom rare πεισμονή, qui peut évoquer l’influence persuasive exercée sur les Galates.
lexical_decisions:
- source_word: πεισμονὴ
  choice: persuasion
  rationale: Ce nom grec rare peut désigner l’action de persuader, le fait d’être gagné à une idée ou l’influence persuasive qui en résulte. « Persuasion » conserve cette abstraction et son ambiguïté sans développer excessivement le sens.
- source_word: ἐκ
  choice: vient de
  rationale: La préposition marque ici la source ou l’origine. « Vient de » exprime cette relation de façon naturelle en français.
- source_word: τοῦ καλοῦντος ὑμᾶς
  choice: celui qui vous appelle
  rationale: Le participe présent substantivé est rendu par une proposition relative, formulation française claire qui conserve l’idée d’un appel en cours sans nommer explicitement son auteur.
- source_word: οὐκ
  choice: ne… pas
  rationale: La négation grecque est rendue directement afin de préserver la fermeté du démenti de Paul.
theological_decisions:
- issue: Identité de « celui qui vous appelle »
  choice: Conserver la désignation « celui qui vous appelle » sans ajouter « Dieu ».
  alternative: Expliciter « Dieu, qui vous appelle ».
  rationale: Dans le contexte de Galates, le référent est très probablement Dieu, mais le grec emploie un participe substantivé et ne le nomme pas ici. La traduction préserve donc la formulation et la retenue du texte source.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation concise reproduit la force de l’énoncé grec; « persuasion », légèrement abstrait mais courant, maintient l’ambiguïté lexicale du terme source.
