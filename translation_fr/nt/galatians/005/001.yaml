  naturalness: Le français est globalement clair et de registre actuel. La formulation révisée « ne vous remettez pas sous un joug d’esclavage » est plus directe et idiomatique que « ne vous laissez pas ... assujettir à un joug », sans affaiblir l’image ni la force de l’exhortation.
