id: GAL.5.1
reference: Galatians 5:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τῇ ἐλευθερίᾳ ⸂ἡμᾶς Χριστὸς ἠλευθέρωσεν· στήκετε οὖν⸃ καὶ μὴ πάλιν ζυγῷ δουλείας ἐνέχεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/001.yaml
  text: For freedom Messiah set us free[a]; therefore stand firm[b], and do not again be held by a yoke of slavery.
translation:
  language: fr
  text: C’est pour la liberté que le Messie nous a libérés[a]. Tenez donc ferme et ne vous remettez pas de nouveau sous un joug d’esclavage[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « C’est dans la liberté que le Messie nous a libérés. » L’expression grecque placée au début est condensée et peut se comprendre de plusieurs manières étroitement apparentées.'
    reason: alternative_reading
  - marker: b
    text: 'Le verbe grec peut évoquer le fait d’être soumis à quelque chose ou d’être retenu, voire pris au piège, par cela. Une autre traduction possible est : « ne vous soumettez pas de nouveau à un joug d’esclavage ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ ἐλευθερίᾳ
  choice: pour la liberté
  rationale: Le datif initial, très condensé, peut exprimer le but ou le résultat. « Pour la liberté » conserve l’accent rhétorique et laisse ouverte la relation précise avec le verbe.
- source_word: Χριστὸς
  choice: le Messie
  rationale: Χριστός est rendu comme un titre porteur de sens, ce qui préserve son contexte messianique juif.
- source_word: ἠλευθέρωσεν
  choice: nous a libérés
  rationale: « Libérer » rend directement ἐλευθερόω et maintient en français le lien lexical et rhétorique avec « liberté ».
- source_word: στήκετε
  choice: Tenez donc ferme
  rationale: Cette expression française naturelle rend l’appel présent à demeurer résolus et inébranlables.
- source_word: οὖν
  choice: donc
  rationale: « Donc » marque clairement la conséquence tirée de la déclaration précédente.
- source_word: ζυγῷ δουλείας
  choice: un joug d’esclavage
  rationale: Cette formulation conserve la métaphore concrète du joug et la force de δουλεία, qui désigne l’état d’esclavage.
- source_word: ἐνέχεσθε
  choice: ne vous laissez pas … assujettir
  rationale: La tournure rend l’idée d’être placé ou retenu sous l’autorité de quelque chose, tout en convenant naturellement à l’image du joug.
- source_word: πάλιν
  choice: de nouveau
  rationale: L’expression indique clairement le retour à un état antérieur.
theological_decisions:
- issue: Rendre Χριστός comme titre ou comme forme devenue quasi nominale
  choice: le Messie
  alternative: le Christ
  rationale: La traduction du titre en explicite le sens et maintient l’arrière-plan messianique sans réduire Χριστός à un simple nom propre.
- issue: Force à donner à δουλεία
  choice: esclavage
  alternative: servitude
  rationale: « Esclavage » exprime avec plus de force l’opposition théologique entre liberté et asservissement, tandis que « servitude » pourrait atténuer la réalité évoquée.
- issue: Relation du datif τῇ ἐλευθερίᾳ avec ἠλευθέρωσεν
  choice: but ou résultat, exprimé par « pour la liberté »
  alternative: sphère ou état, exprimé par « dans la liberté »
  rationale: La construction grecque est condensée et autorise des nuances proches. Le texte principal retient la lecture de but, tandis que la note préserve l’autre possibilité.
translation_notes:
  register: Français international actuel, digne et accessible. La formulation conserve le jeu lexical « liberté / libérés », le titre « le Messie », l’exhortation énergique et la métaphore concrète du joug, sans résoudre artificiellement l’ambiguïté du datif initial.
