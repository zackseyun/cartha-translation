source:
  edition: SBLGNT
  text: μαρτύρομαι δὲ πάλιν παντὶ ἀνθρώπῳ περιτεμνομένῳ ὅτι ὀφειλέτης ἐστὶν ὅλον τὸν νόμον ποιῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/003.yaml
  text: And I testify again to every man who receives circumcision that he is obligated to keep the whole law[a][b][c].
translation:
  language: fr
  text: Et j’atteste de nouveau à tout homme qui se fait circoncire[a] qu’il est tenu d’observer toute la Loi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qui est circoncis » ou « qui se laisse circoncire ». Dans ce contexte, le grec désigne probablement celui qui se soumet à la circoncision.
    reason: alternative_reading
  - marker: b
    text: Littéralement « il est débiteur, tenu de faire toute la Loi ».
    reason: lexical_alternative
lexical_decisions:
- source_word: μαρτύρομαι
  choice: j’atteste
  rationale: Le verbe exprime ici une déclaration personnelle ferme et solennelle. « J’atteste » en conserve la force sans introduire explicitement l’idée d’avertissement.
- source_word: δὲ
  choice: Et
  rationale: La particule assure ici une transition continue avec le verset précédent plutôt qu’une opposition marquée.
- source_word: πάλιν
  choice: de nouveau
  rationale: Cette expression naturelle marque la répétition ou l’insistance renouvelée.
- source_word: παντὶ ἀνθρώπῳ
  choice: à tout homme
  rationale: Le singulier masculin distributif convient au contexte précis de la circoncision masculine; il ne s’agit pas ici de neutraliser une référence générique certaine.
- source_word: περιτεμνομένῳ
  choice: qui se fait circoncire
  rationale: Le participe présent désigne dans ce contexte celui qui se soumet à la circoncision. La formulation française préserve l’acte subi volontairement sans préciser un motif absent du grec.
- source_word: ὀφειλέτης ἐστίν
  choice: il est tenu
  rationale: Le nom signifie littéralement qu’il est débiteur, donc soumis à une obligation. « Est tenu » communique clairement cette obligation non financière.
- source_word: ὅλον τὸν νόμον
  choice: toute la Loi
  rationale: La formulation souligne la totalité de la Loi. La majuscule aide à identifier la Loi mosaïque visée dans le contexte.
- source_word: ποιῆσαι
  choice: de mettre en pratique
  rationale: Avec « la Loi », ποιέω signifie l’accomplir par l’obéissance. « Mettre en pratique » est idiomatique et reste proche de l’idée de faire.
theological_decisions:
- issue: Portée de l’affirmation concernant la circoncision et l’obligation envers la Loi
  choice: Le propos vise tout homme qui se soumet à la circoncision dans la controverse galate et affirme qu’il se place ainsi sous l’obligation de pratiquer toute la Loi.
  alternative: Le propos viserait indistinctement tout homme circoncis, y compris celui qui l’a été dans son enfance.
  rationale: Le participe présent, relié immédiatement à Galates 5.2, favorise l’idée d’une personne qui se fait circoncire dans la situation débattue. La traduction n’ajoute toutefois pas explicitement le motif religieux de cet acte.
translation_notes:
  register: Français international moderne, digne et direct. « J’atteste » maintient la solennité; « se fait circoncire » rend naturellement la participation volontaire suggérée par le contexte; « mettre en pratique » évite le calque peu idiomatique « faire la Loi ».
