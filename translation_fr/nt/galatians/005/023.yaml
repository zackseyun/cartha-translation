source:
  edition: SBLGNT
  text: πραΰτης, ἐγκράτεια· κατὰ τῶν τοιούτων οὐκ ἔστιν νόμος.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/023.yaml
  text: gentleness[a], self-control[b]; against such things there is no law.
translation:
  language: fr
  text: la douceur, la maîtrise de soi. Contre de telles choses[a], il n’y a pas de loi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « contre de telles personnes »; dans ce contexte, l’expression renvoie toutefois plus probablement aux qualités qui viennent d’être énumérées.
    reason: lexical_alternative
  - marker: b
    text: Ou « il n’y a pas de Loi contre de telles choses », si « Loi » désigne ici plus particulièrement la Loi de Moïse.
    reason: theological_ambiguity
lexical_decisions:
- source_word: πραΰτης
  choice: douceur
  rationale: Dans cette liste de vertus, le terme désigne une disposition humble, paisible et non brutale. « Douceur » est naturel en français moderne et conserve la portée morale du grec sans suggérer de faiblesse.
- source_word: ἐγκράτεια
  choice: maîtrise de soi
  rationale: Le mot exprime la capacité de gouverner ses désirs et ses impulsions. « Maîtrise de soi » est l’équivalent français courant et précis.
- source_word: κατὰ τῶν τοιούτων
  choice: contre de telles choses
  rationale: Le pluriel grec peut grammaticalement viser des choses ou des personnes. Dans le contexte immédiat, il renvoie très probablement aux qualités qui constituent le fruit de l’Esprit; la formulation choisie reste idiomatique et cette ambiguïté est signalée en note.
- source_word: νόμος
  choice: loi
  rationale: νόμος est sans article. « Loi » préserve ici la portée générale et sentencieuse de l’énoncé sans exclure l’arrière-plan de la Loi de Moïse.
theological_decisions:
- issue: Portée de νόμος dans l’affirmation de Paul
  choice: « loi », au sens large
  alternative: « la Loi », comme référence particulière à la Loi de Moïse
  rationale: La lettre aux Galates traite directement de la Loi de Moïse, mais l’absence d’article et la forme proverbiale de la phrase permettent une portée plus générale. La traduction conserve cette tension au lieu de trancher implicitement.
- issue: Référent de τῶν τοιούτων
  choice: les qualités qui viennent d’être énumérées
  alternative: les personnes qui manifestent ces qualités
  rationale: Le neutre français « de telles choses » correspond le mieux au mouvement de la liste du fruit de l’Esprit, tout en signalant en note la possibilité grammaticale d’un référent personnel.
translation_notes:
  register: Français international moderne, clair et digne. « Maîtrise de soi » est privilégié à « tempérance », plus ancien et potentiellement plus étroit. La ponctuation conserve la conclusion aphoristique du grec.
