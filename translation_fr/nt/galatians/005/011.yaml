id: GAL.5.11
reference: Galatians 5:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐγὼ δέ, ἀδελφοί, εἰ περιτομὴν ἔτι κηρύσσω, τί ἔτι διώκομαι; ἄρα κατήργηται τὸ σκάνδαλον τοῦ σταυροῦ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/011.yaml
  text: But I[a], brothers, if I am still preaching circumcision[b], why am I still being persecuted? Then the offense of the cross has been removed.
translation:
  language: fr
  text: Mais moi, frères[a], si je prêche encore la circoncision, pourquoi suis-je encore persécuté ? Dans ce cas, le scandale[b] de la croix a été supprimé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « frères et sœurs » ; en grec, « frères » peut désigner un groupe mixte.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « l’obstacle que constitue la croix » ; le terme grec désigne ce qui fait trébucher ou provoque le rejet.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀδελφοί
  choice: frères
  rationale: Le vocatif masculin pluriel est rendu directement. Dans l’usage épistolaire grec, il peut s’adresser à l’ensemble d’une communauté mixte, ce que précise la note.
- source_word: περιτομήν
  choice: la circoncision
  rationale: Équivalent français direct et usuel ; dans le contexte de Galates, le terme désigne aussi la pratique exigée comme marqueur d’observance de la Loi, sans qu’il soit nécessaire d’expliciter cette portée dans le texte.
- source_word: ἔτι
  choice: encore
  rationale: Le même adverbe est conservé dans les deux propositions afin de préserver le parallélisme et la logique temporelle de l’argument.
- source_word: κηρύσσω
  choice: je prêche
  rationale: Rend naturellement en français le présent de κηρύσσω et sa nuance de proclamation publique.
- source_word: διώκομαι
  choice: suis-je encore persécuté
  rationale: Le passif est maintenu et « persécuté » exprime clairement l’opposition hostile visée dans le contexte paulinien.
- source_word: ἄρα
  choice: Dans ce cas
  rationale: Cette formulation marque clairement la conclusion tirée de l’hypothèse précédente, sans la présenter comme une affirmation indépendante.
- source_word: κατήργηται
  choice: a été supprimé
  rationale: 'Le passé composé passif rend l’état résultant exprimé par le parfait grec : si Paul prêchait encore la circoncision, l’effet provocateur de la croix se trouverait ôté.'
- source_word: σκάνδαλον
  choice: scandale
  rationale: « Scandale » conserve la force provocatrice de la croix et l’écho traditionnel du terme grec, tout en laissant en note l’autre image possible, celle de l’obstacle qui fait trébucher.
- source_word: σταυροῦ
  choice: de la croix
  rationale: Équivalent français standard de σταυρός dans ce contexte théologique, sans ajout interprétatif.
theological_decisions:
- issue: Portée de ἀδελφοί dans l’adresse à une communauté mixte
  choice: frères
  alternative: frères et sœurs
  rationale: Le masculin du texte source est conservé, tandis qu’une note indique que cette adresse grecque peut inclure les femmes de la communauté.
- issue: Sens de σκάνδαλον τοῦ σταυροῦ
  choice: le scandale de la croix
  alternative: l’obstacle que constitue la croix
  rationale: Le choix principal préserve la tension théologique de la croix comme réalité qui choque et provoque le rejet. La note maintient la valeur imagée de σκάνδαλον comme cause de chute.
- issue: Valeur logique de la dernière proposition
  choice: Dans ce cas, le scandale de la croix a été supprimé
  alternative: Alors, le scandale de la croix a été supprimé
  rationale: '« Dans ce cas » rend explicitement l’inférence liée à l’hypothèse : si Paul prêche encore la circoncision, la croix ne constitue plus le motif d’opposition. La formulation n’efface pas le caractère rhétorique de l’argument.'
translation_notes:
  register: Français international moderne, digne et direct. La répétition d’« encore » et la question rhétorique sont conservées. « Prêcher la circoncision » demeure volontairement concis, comme le grec, et « scandale de la croix » garde la tension de l’expression sans l’expliquer dans le corps du verset.
