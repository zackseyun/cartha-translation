id: GAL.5.19
reference: Galatians 5:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: φανερὰ δέ ἐστιν τὰ ἔργα τῆς σαρκός, ἅτινά ⸀ἐστιν πορνεία, ἀκαθαρσία, ἀσέλγεια,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/019.yaml
  text: 'The works of the flesh are evident: sexual immorality[a], impurity, sensuality,'
translation:
  language: fr
  text: 'Les œuvres de la chair[a] sont manifestes : inconduite sexuelle, impureté, débauche,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « de la nature pécheresse ». Le grec emploie le mot « chair » (σάρξ), que Paul utilise ici comme une métaphore de l’orientation et des désirs humains marqués par le péché.'
    reason: Signaler une traduction interprétative possible tout en conservant dans le texte la métaphore grecque.
lexical_decisions:
- source_word: φανερὰ
  choice: manifestes
  rationale: L’adjectif désigne ce qui apparaît clairement. « Manifestes » convient au registre biblique tout en restant compréhensible en français moderne.
- source_word: δέ
  choice: non exprimé séparément
  rationale: La particule marque ici une transition légère. En français, l’enchaînement avec le contexte suffit, sans ajouter un « maintenant » temporel ni accentuer le contraste par « mais ».
- source_word: τὰ ἔργα
  choice: les œuvres
  rationale: « Œuvres » conserve le vocabulaire paulinien et le contraste immédiat entre les œuvres de la chair et le fruit de l’Esprit.
- source_word: τῆς σαρκός
  choice: de la chair
  rationale: Cette traduction préserve la métaphore théologiquement chargée de Paul sans la réduire d’emblée à une seule explication.
- source_word: ἅτινά ἐστιν
  choice: ':'
  rationale: Les deux-points introduisent naturellement en français la liste explicative qui suit.
- source_word: πορνεία
  choice: inconduite sexuelle
  rationale: L’expression désigne largement les comportements sexuels illicites. « Inconduite sexuelle » est actuelle, claire et moins étroite que « fornication ».
- source_word: ἀκαθαρσία
  choice: impureté
  rationale: Le terme exprime ici une souillure morale ; « impureté » en garde le sens éthique dans un français naturel.
- source_word: ἀσέλγεια
  choice: débauche
  rationale: Le mot grec évoque une conduite effrénée et éhontée, souvent dans le domaine sexuel. « Débauche » rend mieux cette dimension que « sensualité », qui peut être neutre en français contemporain.
theological_decisions:
- issue: Sens de σάρξ dans le contexte éthique paulinien
  choice: chair
  alternative: nature pécheresse
  rationale: « Chair » maintient le contraste propre à Paul entre la chair et l’Esprit ainsi que la tension de sa métaphore. « Nature pécheresse » explicite une interprétation possible, mais risque de faire entendre une définition anthropologique plus précise que le grec.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve le vocabulaire paulinien de la « chair ». « Débauche » est retenu plutôt que « sensualité », dont le sens français moderne peut être moralement neutre.
