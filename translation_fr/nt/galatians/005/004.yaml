source:
  edition: SBLGNT
  text: κατηργήθητε ⸀ἀπὸ Χριστοῦ οἵτινες ἐν νόμῳ δικαιοῦσθε, τῆς χάριτος ἐξεπέσατε.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/004.yaml
  text: You who are seeking to be justified by law have been severed from the Messiah; you have fallen away from grace.
translation:
  language: fr
  text: Vous êtes séparés du Christ[a][b], vous qui cherchez à être déclarés justes par la loi[c] ; vous êtes déchus de la grâce.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « coupés du Christ » ou « devenus étrangers au Christ ».
    reason: lexical_alternative
  - marker: b
    text: Ou « du Messie ». Le grec Christos peut se traduire par « Christ » ou, lorsque sa valeur de titre est mise en avant, par « Messie ».
    reason: alternative_reading
  - marker: c
    text: 'Plus littéralement : « vous qui êtes déclarés justes par la loi » ou « vous qui êtes en train d’être déclarés justes par la loi ». Dans ce contexte, la traduction principale fait ressortir que Paul parle de ceux qui recherchent la justification sur la base de la loi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατηργήθητε
  choice: vous avez été coupés
  rationale: Avec ἀπὸ Χριστοῦ, le verbe exprime ici une séparation d’avec le Christ. « Avez été coupés » conserve la force de l’aoriste passif et l’image tranchante du grec, sans préciser à lui seul les conséquences doctrinales définitives de cette séparation.
- source_word: ἀπὸ Χριστοῦ
  choice: du Christ
  rationale: ἀπό marque la séparation. En français courant, « le Christ » garde clairement la valeur de titre de Χριστός tout en étant plus naturel ici que « le Messie » dans cette formulation paulinienne.
- source_word: οἵτινες
  choice: vous qui
  rationale: Cette tournure désigne directement, au sein des destinataires, ceux qui sont concernés et conserve la force de l’adresse à la deuxième personne.
- source_word: ἐν νόμῳ
  choice: par la loi
  rationale: La préposition exprime ici la base ou le moyen recherché pour la justification. En français, « par la loi » est idiomatique; l’article français est requis naturellement et ne prétend pas reproduire mécaniquement l’absence d’article grec.
- source_word: δικαιοῦσθε
  choice: cherchez à être déclarés justes
  rationale: Le présent passif signifie formellement « êtes déclarés justes » ou « êtes en train d’être déclarés justes ». Dans l’argument de Paul, il vise ceux qui recherchent cette justification sur la base de la loi; la formulation choisie rend cette visée sans présenter leur justification par la loi comme un fait accompli.
- source_word: τῆς χάριτος
  choice: de la grâce
  rationale: Le génitif dépend de ἐξεπέσατε. « Déchoir de la grâce » est une expression française établie qui conserve la relation de séparation exprimée par le grec.
- source_word: ἐξεπέσατε
  choice: vous êtes déchus
  rationale: Le passé composé rend naturellement l’aoriste comme un état résultant d’un événement décisif. « Être déchu de » préserve la force de la métaphore sans la réduire à un simple changement d’opinion.
theological_decisions:
- issue: La portée doctrinale de la séparation d’avec le Christ et de la déchéance de la grâce
  choice: 'Conserver l’avertissement direct et sévère : « coupés du Christ » et « déchus de la grâce ».'
  alternative: Atténuer en disant « éloignés du Christ » ou interpréter comme « vous avez abandonné le principe de la grâce ».
  rationale: Le grec affirme fortement une rupture de relation, mais le verset ne développe pas ici une conclusion systématique sur la possibilité ou l’impossibilité de perdre définitivement le salut. La traduction maintient donc la tension du texte sans trancher le débat confessionnel.
- issue: Le passif δικαιοῦσθε dans un contexte où Paul nie la justification par la loi
  choice: Traduire « cherchez à être déclarés justes » et signaler en note la forme plus littérale.
  alternative: Traduire directement « êtes déclarés justes » ou « êtes en train d’être déclarés justes ».
  rationale: La traduction principale évite de laisser entendre que Paul reconnaît comme effective une justification par la loi, tout en rendant l’intention des personnes visées. La note conserve l’ambiguïté grammaticale du présent passif.
translation_notes:
  register: Français international moderne, direct et digne. La phrase garde l’ordre marqué du grec — d’abord la séparation d’avec le Christ, puis l’identification des personnes concernées — et emploie le vocabulaire biblique courant de la justification et de la grâce sans jargon confessionnel supplémentaire.
