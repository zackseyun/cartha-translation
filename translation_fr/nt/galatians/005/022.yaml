id: GAL.5.22
reference: Galatians 5:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ὁ δὲ καρπὸς τοῦ πνεύματός ἐστιν ἀγάπη, χαρά, εἰρήνη, μακροθυμία, χρηστότης, ἀγαθωσύνη, πίστις,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/022.yaml
  text: But the fruit of the Spirit is love[a], joy, peace, patience, kindness, goodness, faithfulness,
translation:
  language: fr
  text: Mais le fruit de l’Esprit est l’amour, la joie, la paix, la patience, la bienveillance, la bonté, la foi[a] ;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la fidélité ». Le mot grec pistis peut désigner la foi, la confiance ou la fidélité. Dans cette liste de qualités, « fidélité » est également possible.
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: Mais
  rationale: Marque le contraste avec les œuvres de la chair énumérées aux versets 19 à 21.
- source_word: καρπὸς
  choice: fruit
  rationale: Conserve la métaphore paulinienne et le singulier, qui présente ces qualités comme le produit unifié de l’Esprit.
- source_word: τοῦ πνεύματός
  choice: de l’Esprit
  rationale: Dans le contexte immédiat de Galates 5, il s’agit de l’Esprit Saint, opposé à la chair.
- source_word: ἀγάπη
  choice: amour
  rationale: Équivalent français courant, naturel et suffisamment large de ἀγάπη.
- source_word: χαρά
  choice: joie
  rationale: Équivalent direct et usuel dans une liste de qualités.
- source_word: εἰρήνη
  choice: paix
  rationale: Préserve sans la restreindre la portée personnelle et relationnelle du terme.
- source_word: μακροθυμία
  choice: patience
  rationale: Terme français moderne qui exprime l’endurance patiente, notamment envers autrui.
- source_word: χρηστότης
  choice: bonté
  rationale: Rend la disposition aimable et généreuse envers autrui; ce choix reste naturel en français.
- source_word: ἀγαθωσύνη
  choice: bienveillance
  rationale: Distingue ce terme de χρηστότης tout en exprimant une bonté morale active; « générosité » ou « droiture » seraient plus étroits.
- source_word: πίστις
  choice: foi
  rationale: Sens lexical central et rendu traditionnel; dans cette liste de qualités, « fidélité » demeure également plausible et est conservé en note.
theological_decisions:
- issue: Référent de πνεῦμα
  choice: l’Esprit Saint
  alternative: l’esprit humain
  rationale: Le contraste immédiat entre l’Esprit et la chair dans Galates 5 favorise la référence à l’Esprit Saint, sans ajouter le qualificatif « Saint » absent du texte grec.
- issue: Sens de πίστις dans la liste
  choice: foi
  alternative: fidélité
  rationale: Les deux sens sont lexicalement possibles. Le texte principal conserve « foi », tandis que la note préserve « fidélité », particulièrement plausible parmi des qualités de caractère.
translation_notes:
  register: Français international moderne, digne et accessible. La structure nominale et le singulier « fruit » sont conservés. « C’est » rend naturellement ἐστιν dans la phrase française. La ponctuation finale indique que la liste se poursuit au verset suivant.
