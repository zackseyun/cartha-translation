id: GAL.5.6
reference: Galatians 5:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐν γὰρ Χριστῷ Ἰησοῦ οὔτε περιτομή τι ἰσχύει οὔτε ἀκροβυστία, ἀλλὰ πίστις δι’ ἀγάπης ἐνεργουμένη.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/006.yaml
  text: For in Messiah Jesus neither circumcision nor uncircumcision counts for anything[c][b][a], but faith working through love.
translation:
  language: fr
  text: Car, dans le Messie Jésus[a], ni la circoncision ni l’incirconcision n’ont de valeur, mais la foi[b] agissant par l’amour[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Christ Jésus ». Le titre grec Χριστός est rendu ici par « Messie » afin d’en conserver le sens.
    reason: alternative_reading
  - marker: b
    text: Le mot grec πίστις peut aussi évoquer la « confiance » ou la « fidélité ».
    reason: lexical_alternative
  - marker: c
    text: 'On pourrait aussi traduire : « la foi qui est active par l’amour », « la foi qui s’exprime par l’amour » ou « la foi rendue agissante par l’amour ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν γὰρ Χριστῷ Ἰησοῦ
  choice: Car, dans le Messie Jésus
  rationale: γάρ introduit l’explication de l’affirmation précédente. « dans » conserve le langage paulinien de l’union avec le Messie, et Χριστός est rendu comme un titre plutôt que comme un simple nom propre.
- source_word: οὔτε περιτομή ... οὔτε ἀκροβυστία
  choice: ni la circoncision ni l’incirconcision
  rationale: Cette formulation maintient le parallélisme grec et les deux catégories identitaires, sans réduire les termes à leur seule dimension physique.
- source_word: τι ἰσχύει
  choice: n’ont de valeur
  rationale: Dans ce contexte, l’expression désigne ce qui compte ou possède une efficacité réelle, et non la force physique. « n’ont de valeur » est naturel en français tout en restant suffisamment ouvert.
- source_word: πίστις
  choice: la foi
  rationale: « foi » demeure le rendu principal, sans exclure les nuances possibles de confiance ou de fidélité, signalées en note.
- source_word: δι’ ἀγάπης
  choice: par l’amour
  rationale: διά avec le génitif exprime ici le moyen ou le canal. « par l’amour » rend cette relation de façon concise sans en préciser excessivement le mécanisme.
- source_word: ἐνεργουμένη
  choice: agissant
  rationale: Le participe présent moyen/passif décrit la foi comme active ou opérante. « agissant » garde la force verbale, tandis qu’une note préserve les autres analyses possibles de la voix.
theological_decisions:
- issue: Traduction de Χριστός
  choice: Messie
  alternative: Christ
  rationale: Le terme grec garde ici sa valeur de titre. Le texte principal en traduit donc le sens, tandis que la forme traditionnelle « Christ » est indiquée en note.
- issue: Sens de πίστις
  choice: foi
  alternative: confiance ou fidélité
  rationale: « foi » est le terme français le plus établi dans ce contexte, mais la gamme sémantique grecque permet aussi les nuances de confiance et de fidélité; la note évite de trancher silencieusement.
- issue: Voix de ἐνεργουμένη
  choice: agissant
  alternative: rendue agissante
  rationale: La forme grecque peut être comprise avec une nuance moyenne ou passive. Le texte principal adopte une formulation fluide sans exclure l’autre possibilité, conservée en note.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche du parallélisme grec, tandis que « n’ont de valeur » évite un calque peu naturel de ἰσχύει. Les notes conservent les principales ambiguïtés lexicales et grammaticales.
