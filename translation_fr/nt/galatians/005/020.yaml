id: GAL.5.20
reference: Galatians 5:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἰδωλολατρία, φαρμακεία, ἔχθραι, ⸂ἔρις, ζῆλος⸃, θυμοί, ἐριθεῖαι, διχοστασίαι, αἱρέσεις,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/020.yaml
  text: idolatry[a], sorcery, hostilities, strife, jealousy, outbursts of anger, selfish ambition, divisions, factions[b],
translation:
  language: fr
  text: l’idolâtrie, la sorcellerie[a], les haines, les querelles, la jalousie, les accès de colère, les ambitions égoïstes, les divisions, les factions[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la magie ».
    reason: lexical_alternative
  - marker: b
    text: Ou « les sectes »; dans l’usage ecclésiastique plus tardif, « les hérésies ».
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδωλολατρία
  choice: l’idolâtrie
  rationale: Terme français courant et précis pour le culte ou le service rendu aux idoles.
- source_word: φαρμακεία
  choice: la sorcellerie
  rationale: Dans cette liste de vices, le mot désigne des pratiques occultes liées à la magie, et non la médecine en général.
- source_word: ἔχθραι
  choice: les haines
  rationale: Le pluriel grec évoque des attitudes ou manifestations d’hostilité; « les haines » est naturel et conserve leur dimension intérieure et relationnelle.
- source_word: ἔρις
  choice: les querelles
  rationale: Rend clairement l’idée de conflit et de dispute dans une liste décrivant les relations humaines.
- source_word: ζῆλος
  choice: la jalousie
  rationale: Le contexte négatif appelle le sens défavorable de rivalité jalouse plutôt que celui, positif, de zèle.
- source_word: θυμοί
  choice: les accès de colère
  rationale: Le pluriel désigne des explosions répétées de colère plutôt qu’une disposition permanente.
- source_word: ἐριθεῖαι
  choice: les ambitions égoïstes
  rationale: Exprime la recherche partisane de son propre intérêt et l’avancement personnel aux dépens d’autrui.
- source_word: διχοστασίαι
  choice: les divisions
  rationale: Désigne la séparation de personnes en groupes opposés; « divisions » est clair et idiomatique.
- source_word: αἱρέσεις
  choice: les factions
  rationale: Dans ce contexte communautaire, le terme désigne d’abord des partis ou groupements qui divisent, sans imposer le sens ecclésiastique plus tardif d’« hérésies ».
theological_decisions:
- issue: Sens de αἱρέσεις
  choice: les factions
  alternative: les sectes; les hérésies
  rationale: La liste met l’accent sur des comportements qui déchirent les relations et la communauté. « Factions » préserve ce sens social immédiat, tandis qu’« hérésies » risquerait d’introduire anachroniquement un sens doctrinal technique plus tardif.
translation_notes:
  register: Français international moderne, digne et accessible. La structure nominale en série et la ponctuation finale indiquent que le verset poursuit une liste commencée auparavant et continuée ensuite. Les pluriels grecs sont conservés lorsque leur force distributive ou répétitive est pertinente.
