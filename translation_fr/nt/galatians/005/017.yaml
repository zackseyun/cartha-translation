id: GAL.5.17
reference: Galatians 5:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἡ γὰρ σὰρξ ἐπιθυμεῖ κατὰ τοῦ πνεύματος, τὸ δὲ πνεῦμα κατὰ τῆς σαρκός, ταῦτα ⸀γὰρ ⸂ἀλλήλοις ἀντίκειται⸃, ἵνα μὴ ἃ ⸀ἐὰν θέλητε ταῦτα ποιῆτε.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/017.yaml
  text: For the flesh desires what is against the Spirit[a], and the Spirit what is against the flesh; for these oppose each other[b], so that you do not do the things you want.
translation:
  language: fr
  text: Car la chair[a] désire ce qui est contraire à l’Esprit[b], et l’Esprit ce qui est contraire à la chair. En effet, ils s’opposent l’un à l’autre, de sorte que vous ne fassiez pas ce que vous voulez.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la nature pécheresse ». Le mot grec σάρξ (sarx), traduit par « chair », a ici un sens éthique plus large que celui du seul corps physique.
    reason: lexical_alternative
  - marker: b
    text: Ou « l’esprit », si le terme désigne ici l’esprit humain plutôt que l’Esprit Saint.
    reason: alternative_reading
lexical_decisions:
- source_word: σάρξ
  choice: la chair
  rationale: Ce choix conserve la métaphore et le vocabulaire caractéristiques de Paul. Dans ce contexte éthique, le terme dépasse le simple corps physique, sans qu’il soit nécessaire de le réduire dans le texte à une paraphrase comme « nature pécheresse ».
- source_word: ἐπιθυμεῖ
  choice: désire
  rationale: « Désire » rend naturellement l’orientation de la volonté exprimée par le verbe; l’hostilité est précisée par la construction avec κατά.
- source_word: κατὰ τοῦ πνεύματος / κατὰ τῆς σαρκός
  choice: ce qui est contraire à l’Esprit / ce qui est contraire à la chair
  rationale: L’ajout idiomatique de « ce qui est » permet une formulation française naturelle tout en conservant la force adversative de κατά avec le génitif.
- source_word: πνεῦμα
  choice: l’Esprit
  rationale: Le contexte immédiat de Galates 5 favorise une référence à l’Esprit Saint, opposé à la chair dans la vie des croyants. Une note conserve toutefois l’autre compréhension possible.
- source_word: ἀλλήλοις ἀντίκειται
  choice: ils s’opposent l’un à l’autre
  rationale: Cette formulation exprime clairement et sans amplification l’opposition réciproque des deux réalités.
- source_word: ἵνα μὴ
  choice: de sorte que… ne… pas
  rationale: La formulation garde ouverte la nuance de conséquence ou de visée pratique de la proposition grecque tout en restant naturelle en français.
- source_word: ἃ ἐὰν θέλητε ταῦτα ποιῆτε
  choice: vous ne faites pas ce que vous voulez
  rationale: Cette tournure française concise rend la construction relative indéfinie et le verbe ποιέω sans lui ajouter une idée d’habitude.
theological_decisions:
- issue: Sens de σάρξ dans le contexte éthique paulinien
  choice: Conserver « chair » dans le texte principal.
  alternative: « nature pécheresse »
  rationale: « Chair » préserve la métaphore et la tension anthropologique du texte. « Nature pécheresse » explicite une interprétation possible, mais risque de figer le terme dans une catégorie plus étroite que son emploi paulinien.
- issue: Référent de πνεῦμα
  choice: Employer « Esprit » avec une majuscule, en référence probable à l’Esprit Saint.
  alternative: « esprit », compris comme l’esprit humain
  rationale: Les versets environnants présentent l’Esprit comme celui par qui les croyants marchent et sont conduits. Néanmoins, le grec ne comporte pas de distinction graphique équivalente à la majuscule française; l’autre lecture est donc signalée.
- issue: Valeur de ἵνα μὴ
  choice: Traduire par « de sorte que… ne… pas » sans trancher strictement entre but et résultat.
  alternative: « afin que vous ne fassiez pas… »
  rationale: La proposition décrit l’effet pratique de l’opposition entre la chair et l’Esprit; une traduction exclusivement finale pourrait suggérer une intention plus explicite que ne l’exige ici la construction.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proche de l’enchaînement argumentatif grec, tandis que « ce qui est contraire à » évite le tour peu naturel « désire contre ». Les pronoms masculins pluriels dans « ils s’opposent » reprennent « la chair » et « l’Esprit » comme deux réalités mises en contraste.
