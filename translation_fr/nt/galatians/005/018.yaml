id: GAL.5.18
reference: Galatians 5:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἰ δὲ πνεύματι ἄγεσθε, οὐκ ἐστὲ ὑπὸ νόμον.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/018.yaml
  text: But if you are led by the Spirit[b][a], you are not under the law.
translation:
  language: fr
  text: Mais si vous êtes conduits par l'Esprit[a], vous n'êtes pas sous la Loi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «si vous vous laissez conduire par l'Esprit».
    reason: La forme grecque est un présent passif et peut souligner une conduite en cours, sans que cet aspect doive nécessairement être explicité dans le texte.
  - marker: b
    text: Être «sous la Loi», c'est être sous son autorité ou sa juridiction; voir aussi Galates 5.23.
    reason: Précise l'idiome paulinien et fournit le renvoi contextuel sans alourdir le verset.
lexical_decisions:
- source_word: εἰ
  choice: si
  rationale: Introduit naturellement en français la proposition conditionnelle.
- source_word: δὲ
  choice: mais
  rationale: Marque le léger contraste avec l'opposition précédente entre les désirs de la chair et la conduite de l'Esprit.
- source_word: πνεύματι
  choice: par l'Esprit
  rationale: Le datif exprime ici l'agent de la conduite; dans le contexte de Galates 5.16-25, πνεῦμα désigne l'Esprit Saint. La majuscule explicite ce référent contextuel.
- source_word: ἄγεσθε
  choice: vous êtes conduits
  rationale: Rend le présent passif de ἄγω sans forcer la valeur progressive; «conduits» est naturel et conserve l'action de l'Esprit comme agent.
- source_word: οὐκ ἐστὲ
  choice: vous n'êtes pas
  rationale: Équivalent direct et idiomatique de l'expression copulative niée.
- source_word: ὑπὸ νόμον
  choice: sous la Loi
  rationale: Conserve l'image de la soumission à l'autorité ou au régime de la Loi; la majuscule signale la Loi mosaïque visée dans le contexte de Galates.
theological_decisions:
- issue: Référent de πνεύματι
  choice: l'Esprit Saint
  alternative: l'esprit humain
  rationale: Le contexte immédiat oppose la chair à l'Esprit et présente ce dernier comme l'agent divin qui conduit les croyants; la traduction reste concise et n'ajoute pas «Saint», absent du grec.
- issue: Sens de ὑπὸ νόμον
  choice: sous l'autorité ou le régime de la Loi mosaïque
  alternative: sous une loi au sens général
  rationale: Dans l'argumentation de Galates, l'expression renvoie à la Loi comme régime auquel on est soumis. Le texte garde la formulation imagée de Paul plutôt que de développer une interprétation doctrinale.
translation_notes:
  register: Français international moderne, clair et digne. «Vous êtes conduits» préserve le passif grec. La majuscule à «Esprit» identifie le référent divin; celle de «Loi» indique la Loi mosaïque dans ce contexte.
