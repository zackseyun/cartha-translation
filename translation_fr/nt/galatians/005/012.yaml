id: GAL.5.12
reference: Galatians 5:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὄφελον καὶ ἀποκόψονται οἱ ἀναστατοῦντες ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/012.yaml
  text: I wish those who are upsetting you would even mutilate themselves[a][b].
translation:
  language: fr
  text: Si seulement ceux qui vous troublent[b] allaient jusqu’à se mutiler[a] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, plus littéralement, « se coupent eux-mêmes » ou « se retranchent eux-mêmes ». Dans le contexte de la circoncision, Paul évoque probablement une mutilation allant jusqu’à la castration.
    reason: lexical_alternative
  - marker: b
    text: Ou « vous bouleversent » ou « sèment le désordre parmi vous ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ὄφελον
  choice: Si seulement
  rationale: Cette tournure française actuelle exprime naturellement un souhait vif et irréalisé, en conservant la force exclamative de la particule grecque.
- source_word: καὶ
  choice: allaient jusqu’à
  rationale: 'Dans ce contexte, καί marque une surenchère : Paul souhaite que les partisans de la circoncision poussent leur geste plus loin encore. La tournure « aller jusqu’à » rend cette progression avec naturel.'
- source_word: ἀποκόψονται
  choice: se mutiler
  rationale: Le verbe signifie littéralement couper ou retrancher. Dans la controverse immédiate sur la circoncision, il évoque très probablement, par une pointe mordante, une mutilation plus radicale, voire la castration. « Se mutiler » en préserve la violence sans imposer dans le corps du texte le sens le plus précis.
- source_word: οἱ ἀναστατοῦντες
  choice: ceux qui vous troublent
  rationale: Le participe désigne ceux qui agitent, perturbent ou bouleversent les destinataires. « Troublent » est clair, digne et naturel, tout en gardant une certaine amplitude sémantique.
- source_word: ὑμᾶς
  choice: vous
  rationale: Le pronom désigne collectivement les croyants de Galatie ; le français « vous » en rend directement le pluriel.
theological_decisions:
- issue: Portée du souhait de Paul dans le contexte de la circoncision
  choice: Paul formule avec une ironie mordante le souhait que les défenseurs de la circoncision aillent jusqu’à se mutiler.
  alternative: Paul souhaiterait simplement qu’ils se retranchent eux-mêmes de la communauté.
  rationale: Le contexte immédiat porte explicitement sur la circoncision, ce qui rend très probable un jeu de mots sur le fait de couper. Le texte principal garde cette force corporelle, tandis que la note signale l’autre possibilité lexicale sans neutraliser la tension.
translation_notes:
  register: Français international moderne, direct et digne. L’exclamation et « si seulement » conservent la vigueur du souhait ; « allaient jusqu’à » rend la surenchère rhétorique sans tournure archaïque.
