    issue: Formule introductive légèrement paraphrastique
    rationale: « Mais voici ce que je dis » est fidèle dans l’ensemble, mais « Mais je vous dis » reflète plus simplement Λέγω δέ et convient mieux au français courant.
  - severity: medium
    issue: Glose de note trop assimilatrice pour σάρξ
    rationale: Dire que σάρξ « peut désigner l’être humain déchu » risque d’identifier la chair à la personne entière. Dans ce passage, le terme désigne plus précisément la condition ou tendance humaine déchue opposée à l’Esprit.
