reference: Galatians 5:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Λέγω δέ, πνεύματι περιπατεῖτε καὶ ἐπιθυμίαν σαρκὸς οὐ μὴ τελέσητε.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/016.yaml
  text: But I say[a], walk by the Spirit, and you will certainly not carry out the desire of the flesh.
translation:
  language: fr
  text: 'Mais je vous dis : marchez par l’Esprit, et vous n’accomplirez certainement pas le désir de la chair.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la nature pécheresse ». Le mot grec signifie littéralement « chair » ; chez Paul, il peut désigner la condition humaine déchue dans son opposition à l’Esprit.
    reason: Signaler une interprétation courante du sens métaphorique de σάρξ tout en conservant le terme grec dans le texte principal.
lexical_decisions:
- source_word: Λέγω δέ
  choice: Mais voici ce que je dis
  rationale: δέ marque ici une transition légèrement contrastive. Cette tournure française rend clairement le mouvement rhétorique sans durcir excessivement l’opposition.
- source_word: πνεύματι
  choice: par l’Esprit
  rationale: Le datif peut exprimer le moyen ou la sphère. Dans le contexte de Galates 5, il renvoie vraisemblablement à l’Esprit Saint ; « par l’Esprit » exprime naturellement son action directrice.
- source_word: περιπατεῖτε
  choice: marchez
  rationale: Le choix conserve la métaphore paulinienne de la marche, compréhensible en français et importante dans le raisonnement du passage.
- source_word: ἐπιθυμίαν
  choice: le désir
  rationale: ἐπιθυμία désigne un désir dont la valeur dépend du contexte. « Désir » garde sa largeur sémantique, tandis que le complément « de la chair » en précise ici le caractère négatif.
- source_word: σαρκὸς
  choice: de la chair
  rationale: « Chair » préserve le vocabulaire et la tension anthropologique de Paul, plutôt que de réduire d’emblée le terme à la seule glose interprétative « nature pécheresse ».
- source_word: οὐ μὴ τελέσητε
  choice: vous n’accomplirez certainement pas
  rationale: La construction οὐ μή avec le subjonctif aoriste porte une négation fortement emphatique. « Certainement pas » en restitue la force, et « accomplir » exprime l’idée de mener le désir à exécution.
theological_decisions:
- issue: Référent de πνεύματι
  choice: l’Esprit Saint
  alternative: l’esprit humain ou un principe spirituel
  rationale: Le contraste immédiat entre l’Esprit et la chair dans Galates 5 favorise la référence à l’Esprit Saint. La majuscule rend ce jugement contextuel sans ajouter un qualificatif absent du grec.
- issue: Sens de σάρξ
  choice: la chair
  alternative: la nature pécheresse
  rationale: Même si le terme a ici une portée morale négative, « la chair » maintient la catégorie propre à Paul et évite de résoudre entièrement une notion plus riche par une paraphrase doctrinale.
translation_notes:
  register: Français international moderne, digne et accessible. La métaphore « marchez » et le terme théologique « chair » sont conservés ; la note aide les lecteurs à comprendre ce dernier. Le deux-points après la formule introductive rend naturellement la structure de l’exhortation.
