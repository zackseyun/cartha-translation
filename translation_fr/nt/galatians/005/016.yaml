review_pass:
  verdict: revise
  source_fidelity: 'Le sens principal est bien rendu : πνεύματι est correctement compris comme renvoyant à l’Esprit, la métaphore de περιπατεῖτε est conservée, « chair » préserve σάρξ, et « certainement pas » rend de façon adéquate la force de οὐ μή. La formule introductive actuelle est acceptable, mais « Mais je vous dis » est plus direct et plus près de Λέγω δέ. La note devrait éviter d’identifier σάρξ à « l’être humain déchu », formulation trop totalisante pour le terme paulinien dans ce contexte.'
  naturalness: « Marchez par l’Esprit » est un français biblique moderne compréhensible et conserve l’image grecque. « Mais je vous dis » est plus naturel et moins périphrastique que « Mais voici ce que je dis ».
  terminology: La majuscule à « Esprit » est justifiée par le contexte. « La chair » est le bon terme principal; « nature pécheresse » doit rester une glose possible en note, sans remplacer la catégorie paulinienne. La note est ajustée afin de parler de la condition humaine déchue plutôt que de définir la chair comme la personne humaine elle-même.
  issues:
