id: GAL.5.13
reference: Galatians 5:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ὑμεῖς γὰρ ἐπ’ ἐλευθερίᾳ ἐκλήθητε, ἀδελφοί· μόνον μὴ τὴν ἐλευθερίαν εἰς ἀφορμὴν τῇ σαρκί, ἀλλὰ διὰ τῆς ἀγάπης δουλεύετε ἀλλήλοις·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/013.yaml
  text: For you were called to freedom[a], brothers; only do not use your freedom as an opportunity for the flesh[d][c][b], but through love serve one another.
translation:
  language: fr
  text: Car vous avez été appelés à la liberté, frères[a]. Seulement, ne faites pas de cette liberté une occasion[b] pour la chair[c] ; mais, par amour, mettez-vous au service les uns des autres[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot grec traduit par « frères » est un masculin pluriel qui, dans cette lettre, s’adresse à toute la communauté croyante, femmes comprises.
    reason: lexical_alternative
  - marker: b
    text: Ou « un point de départ » ou « un prétexte ». Le terme peut désigner une base à partir de laquelle on agit.
    reason: lexical_alternative
  - marker: c
    text: Ici, « la chair » ne désigne pas simplement le corps physique, mais l’être humain livré à ses impulsions pécheresses. Certaines traductions disent « la nature pécheresse ».
    reason: alternative_reading
  - marker: d
    text: Le verbe grec est apparenté au mot désignant un esclave et évoque le fait de se mettre entièrement au service d’autrui.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑμεῖς
  choice: vous
  rationale: Le pronom explicite met les destinataires en relief ; « vous » conserve naturellement cette insistance en français.
- source_word: γὰρ
  choice: car
  rationale: « Car » marque le lien explicatif avec l’argument précédent sans transformer ce lien en causalité trop étroite.
- source_word: ἐπ’ ἐλευθερίᾳ
  choice: à la liberté
  rationale: La préposition avec le datif présente ici la liberté comme la condition ou le but auquel les croyants ont été appelés ; cette tournure est naturelle et précise en français.
- source_word: ἐκλήθητε
  choice: avez été appelés
  rationale: Le passif de καλέω est conservé sans préciser explicitement l’auteur de l’appel ni imposer un système théologique particulier.
- source_word: ἀδελφοί
  choice: frères
  rationale: Le masculin pluriel grec est rendu formellement ; une note précise que, dans cette adresse communautaire, il inclut aussi les femmes.
- source_word: μόνον
  choice: seulement
  rationale: Le terme introduit une restriction essentielle à l’affirmation de la liberté.
- source_word: μὴ τὴν ἐλευθερίαν εἰς ἀφορμὴν
  choice: ne faites pas de cette liberté une occasion
  rationale: La proposition grecque est elliptique. L’ajout idiomatique de « faites de » explicite le rapport syntaxique sans modifier le sens, tandis qu’« occasion » conserve la possibilité d’un point de départ ou d’un prétexte.
- source_word: σάρξ
  choice: la chair
  rationale: Le terme paulinien chargé de sens est conservé plutôt que remplacé par une interprétation comme « nature pécheresse ».
- source_word: διὰ τῆς ἀγάπης
  choice: par amour
  rationale: La tournure rend la valeur instrumentale de διά et produit une exhortation naturelle en français.
- source_word: δουλεύετε
  choice: mettez-vous au service
  rationale: Cette formulation française exprime clairement le service réciproque et évite l’ambiguïté de « servez-vous », tout en laissant une note signaler l’image plus forte de l’esclavage présente dans le verbe grec.
- source_word: ἀλλήλοις
  choice: les uns des autres
  rationale: Cette expression rend naturellement la réciprocité du pronom grec.
theological_decisions:
- issue: Portée de ἀδελφοί dans l’adresse à la communauté
  choice: frères
  alternative: frères et sœurs
  rationale: Le texte principal garde la forme masculine du grec, tandis que la note préserve la portée inclusive probable de l’adresse sans effacer sa forme linguistique.
- issue: Sens de σάρξ dans l’exhortation éthique de Paul
  choice: la chair
  alternative: la nature pécheresse
  rationale: '« La chair » préserve l’expression et sa tension théologique : elle ne désigne pas simplement le corps physique, mais il ne convient pas non plus de réduire silencieusement son champ à une formulation doctrinale unique.'
- issue: Force de δουλεύετε dans un commandement réciproque
  choice: mettez-vous au service les uns des autres
  alternative: soyez esclaves les uns des autres
  rationale: Le texte principal privilégie une exhortation française claire et digne ; la note conserve la force de l’image servile portée par le verbe grec.
translation_notes:
  register: Français international actuel, clair et digne. La syntaxe elliptique du grec est légèrement explicitée dans « ne faites pas de cette liberté », et « mettez-vous au service » évite l’ambiguïté moderne de « servez-vous » tout en préservant la nuance forte dans une note.
