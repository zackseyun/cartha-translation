  revision_rationale: 'La révision remplace une image française maladroite par « marchons aussi selon l’Esprit », qui est à la fois naturelle et proche de la fonction exhortative de στοιχῶμεν. La note conserve les deux nuances lexicales pertinentes: « dans l’Esprit » pour le datif et la conduite conforme à l’Esprit pour στοιχέω, sans imposer une lecture doctrinale supplémentaire.'
