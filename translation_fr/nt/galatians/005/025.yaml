- from: Si nous vivons par l’Esprit[a], avançons aussi au pas de l’Esprit.
  to: Si nous vivons par l’Esprit[a], marchons aussi selon l’Esprit.
  rationale: 'La révision remplace une image française maladroite par « marchons aussi selon l’Esprit », qui est à la fois naturelle et proche de la fonction exhortative de στοιχῶμεν. La note conserve les deux nuances lexicales pertinentes: « dans l’Esprit » pour le datif et la conduite conforme à l’Esprit pour στοιχέω, sans imposer une lecture doctrinale supplémentaire.'
