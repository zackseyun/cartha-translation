id: GAL.5.25
reference: Galatians 5:25
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἰ ζῶμεν πνεύματι, πνεύματι καὶ στοιχῶμεν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/025.yaml
  text: If we live by the Spirit[a], let us also walk by the Spirit.
translation:
  language: fr
  text: Si nous vivons par l’Esprit[a], marchons aussi selon l’Esprit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Si nous vivons dans l’Esprit, conformons aussi notre conduite à l’Esprit. »'
    reason: Le datif πνεύματι peut exprimer la sphère (« dans l’Esprit »). Le verbe στοιχέω peut souligner l’idée de régler sa conduite sur une norme, de rester en ligne ou de suivre le même pas.
lexical_decisions:
- source_word: εἰ
  choice: Si
  rationale: La conjonction conditionnelle grecque est conservée afin de respecter la forme et la logique exhortative de la phrase. « Puisque » serait possible dans le contexte, mais expliciterait davantage la relation logique.
- source_word: ζῶμεν
  choice: nous vivons
  rationale: Le présent de ζάω désigne ici la vie reçue par l’action de l’Esprit, et non la simple existence biologique.
- source_word: πνεύματι
  choice: par l’Esprit
  rationale: Le datif peut exprimer le moyen ou la sphère. « Par l’Esprit » fait ressortir l’Esprit comme source de la vie, tandis que la note conserve la possibilité de comprendre « dans l’Esprit ».
- source_word: καὶ
  choice: aussi
  rationale: '« Aussi » rend la valeur corrélative du terme : à la vie par l’Esprit doit correspondre une conduite conforme à l’Esprit.'
- source_word: στοιχῶμεν
  choice: avançons au pas
  rationale: 'Le subjonctif présent a ici une valeur exhortative. L’expression « avancer au pas » restitue l’idée propre à στοιχέω : suivre une ligne, rester en rang ou marcher au même pas, plutôt que le sens plus général de « marcher ».'
theological_decisions:
- issue: Référent de πνεύματι
  choice: l’Esprit Saint
  alternative: l’esprit humain
  rationale: Dans le contexte immédiat de Galates 5, l’opposition entre la chair et l’Esprit indique fortement qu’il s’agit de l’Esprit Saint. La majuscule signale cette compréhension contextuelle.
- issue: Valeur du datif πνεύματι
  choice: 'moyen ou source : « par l’Esprit »'
  alternative: 'sphère : « dans l’Esprit »'
  rationale: La construction grecque permet les deux nuances. Le texte principal met en avant l’Esprit comme source de la vie, sans supprimer l’autre possibilité, conservée en note.
translation_notes:
  register: Français international moderne, digne et accessible. « Avançons au pas de l’Esprit » conserve l’image dynamique et ordonnée de στοιχέω tout en évitant de confondre ce verbe avec le verbe plus général traduit par « marcher » en Galates 5.16.
