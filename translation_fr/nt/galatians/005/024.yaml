  text: οἱ δὲ τοῦ ⸀Χριστοῦ τὴν σάρκα ἐσταύρωσαν σὺν τοῖς παθήμασιν καὶ ταῖς ἐπιθυμίαις.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/024.yaml
  text: Those who belong to Messiah have crucified the flesh along with its passions and desires[a][b].
translation:
  language: fr
  text: Mais ceux qui appartiennent au Messie ont crucifié la chair avec ses passions et ses désirs[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ceux qui appartiennent au Christ ».'
    reason: alternative_reading
  - marker: b
    text: Dans ce contexte, « la chair » est opposée à l’Esprit ; certaines traductions rendent ce terme par « la nature humaine pécheresse ».
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ τοῦ Χριστοῦ
  choice: Mais ceux qui appartiennent au Messie
  rationale: La construction avec le génitif désigne les personnes qui sont au Messie ou lui appartiennent. « Appartiennent au » est idiomatique en français, tandis que « mais » rend le contraste léger marqué par δέ avec ce qui précède.
- source_word: τὴν σάρκα
  choice: la chair
  rationale: Dans ce contexte éthique, σάρξ désigne la condition humaine opposée à l'Esprit. Conserver « chair » maintient le vocabulaire et la tension théologique de Paul sans les réduire à une interprétation.
- source_word: ἐσταύρωσαν
  choice: ont crucifié
  rationale: Le passé composé exprime naturellement en français une action décisive accomplie dont la portée demeure. « Crucifié » conserve l'évocation explicite de la croix.
- source_word: σὺν τοῖς παθήμασιν καὶ ταῖς ἐπιθυμίαις
  choice: avec ses passions et ses désirs
  rationale: σύν marque l'accompagnement. Les articles grecs renvoient aux passions et désirs associés à la chair; le possessif français « ses » explicite naturellement ce lien. Ici, παθήματα désigne des passions plutôt que des souffrances, et ἐπιθυμίαι des désirs, sans restriction au seul domaine sexuel.
theological_decisions:
- issue: Traduction de Χριστοῦ
  choice: Messie
  alternative: Christ
  rationale: Χριστός peut fonctionner comme titre messianique ou comme désignation devenue quasi nominale. « Messie » met en avant le titre sans exclure « Christ », signalé en note comme autre traduction possible.
- issue: Sens de σάρξ dans l'opposition éthique paulinienne
  choice: chair
  alternative: nature humaine pécheresse
  rationale: « Chair » préserve le terme imagé de Paul et son opposition à l'Esprit. Traduire directement par « nature humaine pécheresse » lèverait une ambiguïté interprétative que le texte grec conserve.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase conserve le contraste léger de δέ, le titre « Messie » et la métaphore paulinienne de « la chair ». Les notes rendent visibles les principales possibilités lexicales sans surcharger le texte.
