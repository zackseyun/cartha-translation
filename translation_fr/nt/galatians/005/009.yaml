id: GAL.5.9
reference: Galatians 5:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: μικρὰ ζύμη ὅλον τὸ φύραμα ζυμοῖ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/009.yaml
  text: A little leaven leavens the whole batch of dough[a].
translation:
  language: fr
  text: Un peu de levain fait lever toute la pâte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μικρὰ
  choice: un peu de
  rationale: L’adjectif indique ici une petite quantité de levain. « Un peu de » est naturel en français et conserve la forme concise du proverbe.
- source_word: ζύμη
  choice: levain
  rationale: « Levain » désigne adéquatement l’agent de fermentation dans le monde ancien et préserve les résonances bibliques de l’image, sans la réduire à la levure moderne.
- source_word: ὅλον
  choice: toute
  rationale: « Toute » exprime clairement la totalité de la pâte affectée et s’accorde naturellement avec le nom féminin singulier.
- source_word: φύραμα
  choice: pâte
  rationale: Le terme désigne une masse de pâte pétrie. « Pâte » rend l’image concrète dans un français moderne et idiomatique; « masse » serait moins immédiatement clair.
- source_word: ζυμοῖ
  choice: fait lever
  rationale: Le verbe signifie faire fermenter ou faire lever au moyen du levain. « Fait lever » est l’expression française courante et maintient l’image sans expliciter son application métaphorique.
theological_decisions:
- issue: Portée métaphorique du proverbe
  choice: Conserver l’image concrète du levain qui fait lever la pâte, sans expliciter son application.
  alternative: Une petite influence mauvaise se répand dans toute la communauté.
  rationale: Le verset énonce un proverbe et laisse le contexte en déterminer l’application. L’expliciter dans le texte résoudrait indûment l’image et ajouterait une interprétation absente de la formulation grecque.
translation_notes:
  register: Formulation brève, proverbiale et digne, en français international courant. « Fait lever » est plus idiomatique que le verbe rare « fait fermenter » ou le calque « fait lever toute la masse ».
