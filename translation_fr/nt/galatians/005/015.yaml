id: GAL.5.15
reference: Galatians 5:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἰ δὲ ἀλλήλους δάκνετε καὶ κατεσθίετε, βλέπετε μὴ ὑπ’ ἀλλήλων ἀναλωθῆτε.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/015.yaml
  text: But if you bite and devour one another[a], watch out that you are not consumed by one another.
translation:
  language: fr
  text: Mais si vous vous mordez et vous dévorez les uns les autres, prenez garde de ne pas être consumés les uns par les autres.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰ δὲ
  choice: Mais si
  rationale: εἰ introduit la condition et δέ marque un contraste léger avec l’exhortation précédente. « Mais si » est naturel et fidèle en français.
- source_word: ἀλλήλους
  choice: les uns les autres
  rationale: Le pronom réciproque exprime des actes mutuels au sein de la communauté.
- source_word: δάκνετε
  choice: vous vous mordez
  rationale: Le verbe signifie littéralement « mordre ». Le présent français conserve naturellement l’idée d’une conduite actuelle ou répétée sans surinterpréter l’aspect.
- source_word: κατεσθίετε
  choice: vous dévorez
  rationale: Le verbe intensif évoque le fait de dévorer ou de manger entièrement. « Dévorer » maintient la violence de l’image et s’associe naturellement à « mordre ».
- source_word: βλέπετε
  choice: prenez garde
  rationale: L’impératif appelle à une vigilance urgente. « Prenez garde » est clair, actuel et digne.
- source_word: μὴ
  choice: de ne pas
  rationale: Avec le subjonctif passif, μή introduit ici un résultat redouté. Après « prenez garde », « de ne pas » l’exprime naturellement.
- source_word: ὑπ’ ἀλλήλων
  choice: les uns par les autres
  rationale: ὑπό suivi du génitif indique l’agent du passif; cette formulation conserve la réciprocité et l’ironie tragique de l’autodestruction mutuelle.
- source_word: ἀναλωθῆτε
  choice: être anéantis
  rationale: ἀναλίσκω peut signifier consumer entièrement, épuiser ou détruire. « Être anéantis » rend clairement l’aboutissement destructeur tout en évitant en français la possible lecture involontaire de « consommés » au sens alimentaire ou commercial.
theological_decisions:
- issue: Violence métaphorique au sein de la communauté chrétienne
  choice: Conserver littéralement les images de morsure et de dévoration, puis rendre leur aboutissement par « anéantis ».
  alternative: 'Expliciter en termes généraux : « si vous vous faites du mal et vous détruisez les uns les autres ».'
  rationale: La rhétorique de Paul est volontairement animale, vive et urgente. L’adoucir en langage général de conflit réduirait sa force. « Anéantis » maintient l’idée de ruine totale portée par ἀναλωθῆτε sans imposer une précision doctrinale étrangère au texte.
translation_notes:
  register: Français international moderne, direct et digne. La répétition « vous vous » est idiomatique et nécessaire avec les verbes pronominaux employés réciproquement. Aucun marqueur de note n’est requis puisqu’aucune note n’est proposée.
