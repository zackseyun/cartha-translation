id: GAL.5.14
reference: Galatians 5:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ γὰρ πᾶς νόμος ἐν ἑνὶ λόγῳ ⸀πεπλήρωται, ἐν τῷ· Ἀγαπήσεις τὸν πλησίον σου ὡς ⸀σεαυτόν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/014.yaml
  text: 'For the whole law is fulfilled in one statement: “You shall love your neighbor as yourself.”[a][b]'
translation:
  language: fr
  text: 'Car toute la Loi trouve son accomplissement[b] dans une seule parole[a] : « Tu aimeras ton prochain comme toi-même. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans un seul énoncé ». Le grec dit littéralement « dans une seule parole », au sens d’une unique déclaration ou d’un unique commandement.
    reason: lexical_alternative
  - marker: b
    text: 'Ou « a été accomplie » ; de manière plus interprétative : « se résume ». Le verbe grec est au parfait passif et signifie littéralement « est accomplie » ; il peut aussi indiquer que l’intention de la Loi atteint son plein aboutissement dans ce commandement.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ γὰρ
  choice: Car
  rationale: γάρ introduit la raison ou l’explication de l’exhortation précédente ; « Car » conserve ce lien de manière concise et naturelle.
- source_word: πᾶς νόμος
  choice: toute la Loi
  rationale: L’article et le singulier désignent la Loi considérée dans son ensemble. La majuscule signale ici la Loi biblique sans en restreindre la portée à une catégorie particulière de commandements.
- source_word: ἐν ἑνὶ λόγῳ
  choice: dans une seule parole
  rationale: λόγος désigne ici une parole ou un énoncé, à savoir le commandement cité. « Une seule parole » est idiomatique en français biblique courant et ne suppose pas un unique mot lexical.
- source_word: πεπλήρωται
  choice: trouve son accomplissement
  rationale: Le parfait passif de πληρόω exprime un accomplissement dont le résultat demeure. Cette formulation française préserve l’idée plus forte d’accomplissement, plutôt que de réduire le verbe à un simple résumé.
- source_word: Ἀγαπήσεις
  choice: Tu aimeras
  rationale: Le futur grec de la citation de Lévitique 19.18 a valeur prescriptive. Le futur français reproduit naturellement la forme traditionnelle et solennelle du commandement.
- source_word: τὸν πλησίον σου
  choice: ton prochain
  rationale: « Ton prochain » est l’équivalent établi et exact dans ce contexte éthique et citationnel.
- source_word: ὡς σεαυτόν
  choice: comme toi-même
  rationale: Cette expression restitue directement la comparaison du grec.
theological_decisions:
- issue: Rapport entre l’ensemble de la Loi et le commandement d’aimer son prochain
  choice: La Loi tout entière trouve son accomplissement dans ce commandement.
  alternative: La Loi est simplement résumée dans ce commandement.
  rationale: πληρόω signifie plus directement « accomplir » que « résumer ». La traduction garde cette force tout en évitant de préciser, au-delà du texte, si Paul parle uniquement des prescriptions éthiques ou formule une conclusion doctrinale plus large sur le statut de la Loi.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation « trouve son accomplissement » rend naturellement le parfait passif grec tout en maintenant la tension entre accomplissement et récapitulation. La citation conserve le futur prescriptif traditionnel « Tu aimeras ».
