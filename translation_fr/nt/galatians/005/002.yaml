id: GAL.5.2
reference: Galatians 5:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἴδε ἐγὼ Παῦλος λέγω ὑμῖν ὅτι ἐὰν περιτέμνησθε Χριστὸς ὑμᾶς οὐδὲν ὠφελήσει.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/002.yaml
  text: 'Look: I[a], Paul, say to you that if you receive circumcision[b], Messiah will benefit you nothing.'
translation:
  language: fr
  text: 'Attention : moi, Paul, je vous dis que, si vous vous faites circoncire[a], le Messie[b] ne vous servira à rien.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « si vous êtes circoncis » ou « si vous acceptez de vous faire circoncire ».'
    reason: lexical_alternative
  - marker: b
    text: 'Grec : « Christ »; le terme est traduit ici par « le Messie » parce que Χριστός fonctionne comme un titre.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἴδε
  choice: 'Attention :'
  rationale: Le terme introduit une mise en garde appuyée. « Attention » en restitue naturellement la force interpellative en français moderne, contrairement au calque peu idiomatique « Voyez ».
- source_word: ἐγὼ Παῦλος
  choice: moi, Paul,
  rationale: Le pronom explicite est emphatique. « Moi, Paul » conserve à la fois l’auto-identification et l’insistance rhétorique.
- source_word: λέγω ὑμῖν
  choice: je vous dis
  rationale: Cette formulation directe correspond naturellement au verbe λέγω suivi du pronom au datif.
- source_word: ἐὰν περιτέμνησθε
  choice: si vous vous faites circoncire
  rationale: Le présent passif au subjonctif décrit le fait de subir la circoncision. La tournure causative réfléchie est idiomatique en français et convient au contexte où les destinataires envisagent de se soumettre à ce rite.
- source_word: Χριστὸς
  choice: le Messie
  rationale: Ici, Χριστός désigne Jésus dans sa fonction messianique; « le Messie » maintient la valeur du titre.
- source_word: οὐδὲν ὠφελήσει
  choice: ne vous servira à rien
  rationale: Cette expression française courante restitue clairement et vigoureusement l’absence totale de bénéfice exprimée par οὐδέν.
theological_decisions:
- issue: Traduction de Χριστός
  choice: le Messie
  alternative: Christ
  rationale: La valeur titulaire demeure pertinente dans cet avertissement; « le Messie » rend explicitement le sens de Χριστός sans transformer le terme en simple nom propre.
- issue: Portée de l’avertissement relatif à la circoncision
  choice: Conserver l’énoncé conditionnel sans préciser dans le corps du verset le motif pour lequel les Galates accepteraient la circoncision.
  alternative: Ajouter qu’il s’agit de rechercher la justification par l’observance de la Loi.
  rationale: Le contexte de la lettre éclaire l’enjeu, mais le verset lui-même ne formule pas cette précision. La traduction évite donc aussi bien de condamner explicitement toute circoncision médicale ou ethnique que d’insérer une explication absente du grec.
translation_notes:
  register: Français international moderne, direct et digne. « Attention » rend l’interpellation initiale avec vigueur; « moi, Paul » conserve l’emphase; « ne vous servira à rien » exprime la conclusion sans lourdeur ni archaïsme.
