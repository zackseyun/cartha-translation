source:
  edition: SBLGNT
  text: ⸀φθόνοι, μέθαι, κῶμοι, καὶ τὰ ὅμοια τούτοις, ἃ προλέγω ὑμῖν ⸀καθὼς προεῖπον ὅτι οἱ τὰ τοιαῦτα πράσσοντες βασιλείαν θεοῦ οὐ κληρονομήσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/021.yaml
  text: envy[a], drunkenness, carousing, and things like these, about which I warn you, just as I warned before, that those who practice such things will not inherit the kingdom of God.
translation:
  language: fr
  text: 'l’envie, les ivrogneries, les fêtes débridées[a] et autres choses semblables. Je vous en avertis, comme je vous en ai déjà averti : ceux qui se livrent à de telles pratiques n’hériteront pas du royaume de Dieu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « réjouissances tapageuses ». Le terme grec désigne des festivités marquées par l’excès, souvent associées à la boisson.
    reason: Préciser l’étendue de κῶμοι et éviter que le lecteur ne lui attribue nécessairement un sens sexuel.
lexical_decisions:
- source_word: φθόνοι
  choice: l’envie
  rationale: Le pluriel grec désigne les manifestations de l’envie comme catégorie morale. Le singulier collectif est plus naturel en français moderne et exprime le désir hostile suscité par le bien d’autrui.
- source_word: μέθαι
  choice: les ivrogneries
  rationale: Le terme désigne l’ivresse et les épisodes d’ivrognerie. Ce choix conserve la catégorie morale sans la réduire au simple fait de boire.
- source_word: κῶμοι
  choice: les fêtes débridées
  rationale: Le mot évoque des réjouissances collectives marquées par l’excès, souvent liées à la boisson. « Fêtes débridées » est clair en français actuel, tandis qu’« orgies » suggérerait à tort un contenu nécessairement sexuel.
- source_word: τὰ ὅμοια τούτοις
  choice: autres choses semblables
  rationale: Cette expression maintient le caractère ouvert de la liste et indique que les comportements nommés ne sont pas exhaustifs.
- source_word: ἃ προλέγω ὑμῖν
  choice: Je vous en avertis
  rationale: Dans ce contexte d’exhortation morale, προλέγω a valeur d’avertissement. Le pronom « en » reprend naturellement en français l’ensemble des comportements mentionnés.
- source_word: καθὼς προεῖπον
  choice: comme je vous en ai déjà avertis
  rationale: La reprise du même verbe souligne que Paul renouvelle un avertissement antérieur. La répétition est conservée pour respecter cet effet rhétorique.
- source_word: οἱ τὰ τοιαῦτα πράσσοντες
  choice: ceux qui se livrent à de telles pratiques
  rationale: Le participe présent avec πράσσω présente ces actes comme une conduite caractéristique. Cette formulation française exprime une pratique suivie sans ajouter explicitement une fréquence absente du texte.
- source_word: βασιλείαν θεοῦ
  choice: le royaume de Dieu
  rationale: Formulation française établie qui conserve directement l’expression théologique grecque.
- source_word: οὐ κληρονομήσουσιν
  choice: n’hériteront pas
  rationale: Le verbe futur maintient l’image biblique de l’héritage ainsi que la portée prospective de l’avertissement.
theological_decisions:
- issue: L’avertissement vise-t-il des actes isolés ou une conduite caractéristique ?
  choice: « ceux qui se livrent à de telles pratiques »
  alternative: « ceux qui font de telles choses »
  rationale: Le participe présent πράσσοντες, dans cette liste de vices, évoque naturellement une conduite pratiquée. La traduction le signale sans tirer de conclusion doctrinale sur chaque faute isolée.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase reste liée à la liste commencée aux versets précédents; elle débute donc sans majuscule autonome. Les répétitions de l’avertissement et le langage de l’héritage sont conservés.
