  text: Ἐτρέχετε καλῶς· τίς ὑμᾶς ἐνέκοψεν ⸀τῇ ἀληθείᾳ μὴ πείθεσθαι;
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/007.yaml
  text: You were running well[a]. Who hindered you from obeying the truth?
translation:
  language: fr
  text: Vous couriez bien. Qui vous a empêchés d’obéir à la vérité[a] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « de vous laisser convaincre par la vérité ». Le verbe grec peut signifier aussi bien « obéir » que « se laisser convaincre ».'
    reason: Alternative lexicale
lexical_decisions:
- source_word: Ἐτρέχετε
  choice: Vous couriez
  rationale: L’imparfait exprime une action qui se poursuivait dans le passé. « Couriez » conserve sans ajout la métaphore de la course.
- source_word: καλῶς
  choice: bien
  rationale: Cet adverbe qualifie la manière de courir et se rend naturellement ainsi en français moderne.
- source_word: τίς
  choice: Qui
  rationale: Le pronom interrogatif désigne ici la personne ou les personnes à l’origine de l’entrave.
- source_word: ἐνέκοψεν
  choice: a empêchés
  rationale: Le verbe signifie entraver ou faire obstacle, avec une possible évocation de quelqu’un qui gêne un coureur. « A empêchés » exprime clairement sa fonction avec l’infinitif qui suit, tandis que la métaphore demeure perceptible grâce à « couriez ».
- source_word: τῇ ἀληθείᾳ
  choice: à la vérité
  rationale: Le datif dépend de πείθεσθαι. L’article désigne vraisemblablement la vérité de l’Évangile déjà reçue par les Galates.
- source_word: μὴ πείθεσθαι
  choice: d’obéir
  rationale: Dans ce contexte, πείθεσθαι peut exprimer l’obéissance à la vérité, tout en gardant la nuance possible de se laisser persuader. Cette autre lecture est signalée en note.
theological_decisions:
- issue: Sens de πείθεσθαι avec ἀληθείᾳ
  choice: obéir à la vérité
  alternative: se laisser convaincre par la vérité
  rationale: Le contexte porte sur la réponse concrète des Galates à l’Évangile et sur leur abandon de cette voie. « Obéir » rend cette dimension sans imposer une lecture confessionnelle, tandis que la note conserve l’autre valeur sémantique réelle du verbe.
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve la métaphore de la course et s’adresse au groupe par le pluriel.
