  to: 'Ne devenons pas vaniteux[a] : ne nous provoquons pas les uns les autres et ne nous envions pas les uns les autres.'
  rationale: La révision remplace la construction participiale, lourde en français, par des défenses coordonnées. Elle maintient les trois éléments de l’exhortation grecque — ne pas devenir κενόδοξοι, ne pas provoquer autrui et ne pas l’envier — sans trancher de façon doctrinale ou causale le rapport précis des participes à l’exhortation principale. La note est reformulée pour une expression française plus naturelle et une meilleure restitution de la notion de « gloire vide ».
