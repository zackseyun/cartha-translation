  source_fidelity: « Ne devenons pas » rend fidèlement la défense exhortative (μή + subjonctif présent, 1re personne du pluriel) et la nuance d’entrée dans un état de γινώμεθα. « Vaniteux » est une équivalence recevable de κενόδοξοι, avec une note qui conserve l’idée de gloire vide. Les deux expressions réciproques traduisent correctement ἀλλήλους / ἀλλήλοις, et « provoquer » तथा « envier » rendent bien προκαλεῖσθαι et φθονεῖν.
  naturalness: La suite « nous provoquant les uns les autres et nous enviant les uns les autres » est grammaticalement possible comme participe présent, mais elle est pesante et peu idiomatique en français moderne. Elle peut aussi faire hésiter sur son rapport exact avec l’exhortation. Une coordination de défenses est plus fluide et claire en français, sans imposer une causalité entre les participes et le fait de devenir vaniteux.
  terminology: « Vaniteux » convient dans un registre moderne et accessible. La formulation actuelle de la note, « avides d’une gloire sans valeur », est moins naturelle et risque de présenter la gloire comme un objet simplement dénué de valeur plutôt que de rendre le composé κενό-δοξος (« gloire vaine/vide »). « En quête d’une gloire vaine » est plus idiomatique et plus proche de la nuance lexicale.
