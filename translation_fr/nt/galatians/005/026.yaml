  text: Let us not become conceited[a], provoking one another, envying one another.
translation:
  language: fr
  text: 'Ne devenons pas vaniteux[a] : ne nous provoquons pas les uns les autres et ne nous envions pas les uns les autres.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en quête d’une gloire vaine ». Le mot grec évoque le désir d’une gloire vide, ou une importance que l’on s’attribue sans fondement.
    reason: alternative lexicale et explicitation de la nuance du grec
lexical_decisions:
- source_word: μὴ γινώμεθα
  choice: Ne devenons pas
  rationale: Le subjonctif présent à la première personne du pluriel avec μή exprime une exhortation négative. « Ne devenons pas » conserve à la fois la nuance exhortative et l’idée d’entrer dans un état.
- source_word: κενόδοξοι
  choice: vaniteux
  rationale: Le terme désigne ceux qui recherchent une gloire vide ou qui se donnent une importance sans fondement. « Vaniteux » est naturel en français moderne et garde l’idée de vaine gloire; la note précise cette nuance.
- source_word: ἀλλήλους / ἀλλήλοις
  choice: les uns les autres
  rationale: Cette tournure française exprime clairement la réciprocité dans les deux propositions.
- source_word: προκαλούμενοι
  choice: nous provoquant
  rationale: Le participe évoque le fait de lancer un défi ou de susciter une rivalité. « Provoquant » en préserve l’étendue sans le réduire à la simple irritation.
- source_word: φθονοῦντες
  choice: nous enviant
  rationale: Le verbe signifie éprouver de l’envie envers autrui. « Enviant » est direct et maintient le parallélisme participial.
theological_decisions:
- issue: Rapport des participes avec l’exhortation principale
  choice: 'Les participes décrivent les comportements qui accompagnent la vanité : « nous provoquant les uns les autres et nous enviant les uns les autres ».'
  alternative: On pourrait les comprendre comme des développements presque impératifs ou comme indiquant le moyen par lequel on devient vaniteux.
  rationale: La structure grecque présente le plus naturellement κενόδοξοι comme attribut principal après γινώμεθα, tandis que les participes décrivent des conduites concomitantes. La traduction garde cette relation assez ouverte sans imposer un lien causal.
translation_notes:
  register: Français international moderne, digne et accessible. La construction participiale est conservée afin de refléter le parallélisme grec; « vaniteux » reste courant tout en permettant à la note de rendre la notion plus précise de gloire vide.
