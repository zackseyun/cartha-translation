  text: ἡμεῖς γὰρ πνεύματι ἐκ πίστεως ἐλπίδα δικαιοσύνης ἀπεκδεχόμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/005.yaml
  text: For through the Spirit[a], by faith[d][c][b], we eagerly await the hope of righteousness.
translation:
  language: fr
  text: Car, par l’Esprit[a], sur la base de la foi[b], nous attendons avec ardeur l’espérance de la justice[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans l’Esprit ». Le datif grec peut désigner le moyen (« par l’Esprit ») ou la sphère dans laquelle se vit cette attente (« dans l’Esprit »).
    reason: lexical_alternative
  - marker: b
    text: Littéralement « à partir de la foi ». Le grec πίστις peut aussi, selon le contexte, évoquer la confiance ou la fidélité.
    reason: lexical_alternative
  - marker: c
    text: L’expression peut aussi se comprendre comme « la justice que nous espérons » ou, éventuellement, « l’espérance produite par la justice ». Le grec ne précise pas entièrement la relation entre « espérance » et « justice ».
    reason: alternative_reading
lexical_decisions:
- source_word: ἡμεῖς
  choice: nous
  rationale: Le pronom sujet explicite porte une certaine emphase en grec. Le français « nous » la laisse percevoir par contraste avec le contexte, sans alourdir la phrase par « nous-mêmes ».
- source_word: γὰρ
  choice: car
  rationale: La conjonction introduit l’explication de l’affirmation précédente. « Car » convient au registre argumentatif de Paul.
- source_word: πνεύματι
  choice: par l’Esprit
  rationale: Le datif peut exprimer le moyen ou la sphère. Dans le contexte de Galates 5, il désigne très probablement l’Esprit saint; « par » retient ici la valeur instrumentale, tandis que l’autre possibilité est signalée en note.
- source_word: ἐκ πίστεως
  choice: sur la base de la foi
  rationale: La préposition ἐκ marque ici la source ou le fondement. Cette formulation est plus naturelle en français que le calque « à partir de la foi » et plus précise que le simple « par la foi ».
- source_word: ἐλπίδα
  choice: l’espérance
  rationale: Le nom est l’objet direct du verbe. « Espérance » exprime en français biblique courant une attente confiante tournée vers l’avenir.
- source_word: δικαιοσύνης
  choice: de la justice
  rationale: « Justice » est l’équivalent français courant de δικαιοσύνη et maintient ouverte la relation exacte du génitif avec « espérance ».
- source_word: ἀπεκδεχόμεθα
  choice: nous attendons avec ardeur
  rationale: Le verbe désigne une attente soutenue et confiante. « Avec ardeur » en rend la force sans suggérer une impatience fébrile.
theological_decisions:
- issue: Référent de πνεύματι
  choice: l’Esprit saint
  alternative: l’esprit humain
  rationale: Le contraste entre l’Esprit, la chair et la Loi dans le contexte immédiat favorise nettement une référence à l’Esprit saint. La majuscule l’indique sans développer le texte.
- issue: Valeur du datif πνεύματι
  choice: 'moyen : « par l’Esprit »'
  alternative: 'sphère : « dans l’Esprit »'
  rationale: Les deux analyses grammaticales sont possibles. La valeur instrumentale est retenue dans le texte, et la valeur locative ou sphérique reste explicitement accessible en note.
- issue: Sens de ἐλπίδα δικαιοσύνης
  choice: « l’espérance de la justice »
  alternative: « la justice que nous espérons » ou « l’espérance produite par la justice »
  rationale: La formulation française conserve la tension du génitif grec au lieu de décider si la justice est l’objet attendu ou la source de l’espérance.
- issue: Sens de πίστις
  choice: foi
  alternative: fidélité ou confiance
  rationale: « Foi » est le sens le plus probable dans ce contexte paulinien, mais le terme grec peut selon le contexte désigner aussi la confiance ou la fidélité; cette latitude est conservée en note.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase garde le mouvement argumentatif de Paul tout en plaçant les compléments avant le verbe de façon naturelle. « Espérance » et « justice » maintiennent le vocabulaire théologique courant sans imposer une interprétation confessionnelle.
