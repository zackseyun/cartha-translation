id: GAL.3.5
reference: Galatians 3:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ οὖν ἐπιχορηγῶν ὑμῖν τὸ πνεῦμα καὶ ἐνεργῶν δυνάμεις ἐν ὑμῖν ἐξ ἔργων νόμου ἢ ἐξ ἀκοῆς πίστεως;
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/005.yaml
  text: So then[a], does the one who supplies the Spirit to you and works miracles among you do so by works of the law[b], or by hearing with faith?
translation:
  language: fr
  text: Ainsi donc, celui qui vous accorde l’Esprit et accomplit des miracles parmi vous[a] le fait-il par les œuvres de la loi, ou par l’écoute accompagnée de foi[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en vous ».
    reason: lexical_alternative
  - marker: b
    text: Ou « par l’audition de la foi », ou « par le message entendu avec foi ».
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπιχορηγῶν
  choice: accorde
  rationale: Le participe présent évoque l’action continue de fournir ou d’accorder. « Accorde » est naturel en français et convient à l’idée d’un don venant de Dieu sans ajouter explicitement la nuance de générosité.
- source_word: τὸ πνεῦμα
  choice: l’Esprit
  rationale: L’article et l’usage paulinien indiquent une référence définie à l’Esprit. Il n’est pas nécessaire d’ajouter « Saint », absent du grec.
- source_word: ἐνεργῶν δυνάμεις
  choice: accomplit des miracles
  rationale: Cette formulation française rend naturellement l’expression désignant la production d’actes puissants, sans le calque obscur « opère des puissances ».
- source_word: ἐν ὑμῖν
  choice: parmi vous
  rationale: Dans le contexte des communautés galates, « parmi vous » exprime clairement le cadre communautaire des actes puissants. Le sens « en vous » demeure possible et figure en note.
- source_word: ἐξ ἔργων νόμου
  choice: en raison des œuvres de la loi
  rationale: ἐκ indique ici le fondement ou le moyen invoqué dans l’opposition rhétorique. « En raison de » rend ce rapport clairement, tandis que « œuvres de la loi » conserve la formulation paulinienne.
- source_word: νόμου
  choice: la loi
  rationale: Bien que l’article soit absent en grec, le contexte de l’argument de Paul vise la Loi mosaïque; le français demande naturellement l’article défini.
- source_word: ἀκοῆς πίστεως
  choice: parce que vous avez entendu avec foi
  rationale: Cette formulation explicite en français idiomatique l’écoute accompagnée de foi, tout en conservant en note d’autres analyses possibles de la construction concise au génitif.
- source_word: πίστεως
  choice: foi
  rationale: « Foi » est le sens le plus naturel dans l’opposition paulinienne entre les œuvres de la loi et l’accueil croyant de ce qui est entendu.
theological_decisions:
- issue: La construction ἀκοῆς πίστεως peut décrire une écoute accompagnée de foi, l’audition de la foi, ou le message entendu dans la foi.
  choice: parce que vous avez entendu avec foi
  alternative: par l’audition de la foi ; par le message entendu avec foi
  rationale: Le texte principal exprime naturellement l’accueil croyant de la proclamation sans enfermer la construction grecque dans une paraphrase doctrinale. Les autres relations possibles entre ἀκοή et πίστις sont signalées en note.
- issue: La préposition ἐν dans ἐν ὑμῖν peut situer les miracles au sein de la communauté ou à l’intérieur des croyants.
  choice: parmi vous
  alternative: en vous
  rationale: Le cadre communautaire convient bien à des miracles observables, mais la possibilité d’une action intérieure n’est pas écartée et reste indiquée en note.
translation_notes:
  register: Français international moderne, digne et accessible. La question rhétorique est conservée. « Ainsi donc » maintient le lien argumentatif avec les versets précédents; les notes préservent les ambiguïtés réelles de ἐν ὑμῖν et de ἀκοῆς πίστεως.
