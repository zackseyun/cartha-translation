- from: Ainsi donc, celui qui vous accorde l’Esprit et accomplit des miracles parmi vous[a] le fait-il en raison des œuvres de la loi, ou parce que vous avez entendu avec foi[b] ?
  to: Ainsi donc, celui qui vous accorde l’Esprit et accomplit des miracles parmi vous[a] le fait-il par les œuvres de la loi, ou par l’écoute accompagnée de foi[b] ?
  rationale: La révision évite d’ajouter un accomplissement verbal (« vous avez entendu ») absent du grec, tout en rendant de façon intelligible la lecture principale « hearing with faith ». Elle rétablit aussi le parallélisme entre « par les œuvres de la loi » et « par l’écoute accompagnée de foi ».
