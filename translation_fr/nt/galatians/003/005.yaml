    issue: La proposition « parce que vous avez entendu avec foi » ajoute une forme verbale au parfait et personnalise l’« audition ».
    rationale: ἀκοῆς πίστεως est un syntagme nominal compact. Le rendre par « vous avez entendu » réduit la marge d’ambiguïté du grec et peut suggérer un acte passé déterminé.
  - severity: low
    issue: « En raison des œuvres de la loi » est moins parallèle à l’autre membre de l’alternative.
    rationale: Les deux syntagmes grecs sont introduits par ἐκ. « Par les œuvres de la loi » conserve plus clairement cette symétrie argumentative.
