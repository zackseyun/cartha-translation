  source_fidelity: Le sens général et la question rhétorique sont bien rendus. Toutefois, « parce que vous avez entendu avec foi » transforme le syntagme nominal grec ἐξ ἀκοῆς πίστεως en une proposition au parfait et introduit ainsi un événement d’audition accompli qui n’est pas exprimé par le grec. « Par les œuvres de la loi » rend plus directement le parallélisme des deux emplois de ἐκ.
  naturalness: La formulation révisée reste naturelle dans un français moderne et conserve la construction interrogative de Paul. « L’écoute accompagnée de foi » explicite sobrement la lecture retenue sans prétendre éliminer les autres possibilités, qui demeurent en note.
  terminology: « L’Esprit », « miracles » et « œuvres de la loi » sont appropriés et cohérents avec le vocabulaire paulinien. L’absence de « Saint » respecte le texte grec. Les notes conservent les ambiguïtés réelles de ἐν ὑμῖν et d’ἀκοῆς πίστεως.
  issues:
