id: GAL.3.18
reference: Galatians 3:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἰ γὰρ ἐκ νόμου ἡ κληρονομία, οὐκέτι ἐξ ἐπαγγελίας· τῷ δὲ Ἀβραὰμ δι’ ἐπαγγελίας κεχάρισται ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/018.yaml
  text: For if the inheritance is from the law[a], it is no longer from a promise; but God has graciously given it to Abraham through a promise.
translation:
  language: fr
  text: Car si l’héritage vient de la Loi, il ne vient plus d’une promesse ; or Dieu en a fait don à Abraham par une promesse.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Dieu l’a accordé à Abraham par une promesse. »'
    reason: 'Variante lexicale : « accorder » rend aussi κεχάρισται, mais « en a fait don » conserve plus explicitement la nuance de don gracieux.'
lexical_decisions:
- source_word: κληρονομία
  choice: l’héritage
  rationale: Terme paulinien naturel qui désigne ce qui est reçu en qualité d’héritier et convient au contraste entre la Loi et la promesse.
- source_word: ἐκ νόμου
  choice: vient de la Loi
  rationale: Rend la provenance exprimée par ἐκ et maintient le parallélisme avec ἐξ ἐπαγγελίας. La majuscule indique ici la Loi mosaïque visée dans le contexte.
- source_word: ἐξ ἐπαγγελίας
  choice: vient d’une promesse
  rationale: La formulation française est naturelle tout en conservant l’idée de source ou de fondement et la forme sans article du grec.
- source_word: οὐκέτι
  choice: ne … plus
  rationale: Exprime clairement l’exclusion logique formulée par Paul.
- source_word: δι’ ἐπαγγελίας
  choice: au moyen d’une promesse
  rationale: Conserve la valeur instrumentale de διά et distingue cette expression de la provenance exprimée plus tôt par ἐκ.
- source_word: κεχάρισται
  choice: l’a accordé gratuitement
  rationale: Le passé composé rend convenablement le parfait grec en français, tandis que « gratuitement » préserve la nuance de faveur contenue dans χαρίζομαι.
- source_word: τῷ … Ἀβραὰμ
  choice: à Abraham
  rationale: Rend directement le datif du bénéficiaire.
theological_decisions:
- issue: Explicitation de la nuance de grâce dans κεχάρισται
  choice: l’a accordé gratuitement
  alternative: lui en a fait don / l’a accordé
  rationale: Cette formulation conserve la nuance de don gracieux du verbe sans développer une doctrine au-delà du texte.
- issue: Identification de νόμος dans le contexte
  choice: la Loi
  alternative: la loi
  rationale: Le contexte de Galates vise la Loi mosaïque comme régime opposé ici à la promesse ; la majuscule française rend cette référence sans ajouter d’explication au verset.
translation_notes:
  register: Français international moderne, clair et digne. La structure argumentative et le contraste entre Loi et promesse sont conservés, avec une ponctuation naturelle en français.
