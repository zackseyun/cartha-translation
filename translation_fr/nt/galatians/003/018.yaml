- from: Car si l’héritage vient de la Loi, il ne vient plus d’une promesse ; or Dieu l’a accordé gratuitement à Abraham au moyen d’une promesse.[a]
  to: Car si l’héritage vient de la Loi, il ne vient plus d’une promesse ; or Dieu en a fait don à Abraham par une promesse.[a]
  rationale: La révision remplace seulement une formulation française potentiellement ambiguë par « en a fait don », qui rend naturellement la valeur de χαρίζομαι. Elle conserve le parfait (« en a fait don »), le bénéficiaire au datif et la valeur instrumentale de διά (« par une promesse »), sans modifier l’argument du verset ni en préciser indûment la portée théologique.
