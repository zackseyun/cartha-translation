    issue: « gratuitement » pour κεχάρισται
    rationale: En français contemporain, « gratuitement » signifie d’abord « sans paiement » ou « sans contrepartie ». Le verbe « faire don » exprime plus naturellement le don accordé avec faveur, sans introduire cette connotation commerciale.
