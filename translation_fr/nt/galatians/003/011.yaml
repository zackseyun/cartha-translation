id: GAL.3.11
reference: Galatians 3:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὅτι δὲ ἐν νόμῳ οὐδεὶς δικαιοῦται παρὰ τῷ θεῷ δῆλον, ὅτι Ὁ δίκαιος ἐκ πίστεως ζήσεται,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/011.yaml
  text: It is evident that no one is justified before God by the law[b][a], because "The righteous will live by faith."
translation:
  language: fr
  text: Or, il est évident que personne n’est déclaré juste devant Dieu par la loi, puisque « le juste vivra par la foi[a] »[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le juste vivra par la fidélité ».'
    reason: lexical_alternative
  - marker: b
    text: Paul cite Habacuc 2.4.
    reason: cross_reference
lexical_decisions:
- source_word: ὅτι δὲ
  choice: Or, … puisque
  rationale: δὲ marque une transition légère dans l’argumentation, rendue naturellement par « Or ». Le second ὅτι introduit la raison probante et se rend ici par « puisque ».
- source_word: ἐν νόμῳ
  choice: par la loi
  rationale: Dans ce raisonnement juridique, ἐν exprime le moyen ou le domaine; « par la loi » est idiomatique et garde le lien direct avec la justification.
- source_word: οὐδεὶς
  choice: personne
  rationale: Cette formulation française naturelle conserve la négation universelle.
- source_word: δικαιοῦται
  choice: n’est déclaré juste
  rationale: Le verbe a ici une portée judiciaire. « Déclaré juste » rend ce sens plus clairement en français courant que le terme religieux spécialisé « justifié », sans suggérer que Dieu rend moralement juste par ce seul acte déclaratif.
- source_word: παρὰ τῷ θεῷ
  choice: devant Dieu
  rationale: La locution décrit la position d’une personne au regard du jugement de Dieu; « devant Dieu » en conserve la nuance judiciaire.
- source_word: δῆλον
  choice: il est évident
  rationale: Cette tournure impersonnelle restitue le ton affirmatif et argumentatif du grec.
- source_word: ὁ δίκαιος
  choice: le juste
  rationale: L’adjectif substantivé désigne la personne juste; « le juste » est une formulation française concise, digne et traditionnelle sans être archaïque.
- source_word: ἐκ πίστεως
  choice: par la foi
  rationale: « Par la foi » est la lecture la plus directe dans l’emploi paulinien de la citation. La possibilité lexicale « par la fidélité » est conservée en note.
- source_word: ζήσεται
  choice: vivra
  rationale: Le futur simple rend exactement et naturellement le futur grec.
theological_decisions:
- issue: Sens judiciaire de δικαιοῦται
  choice: n’est déclaré juste
  alternative: n’est justifié
  rationale: Le choix principal rend accessible la dimension de verdict sans dépendre d’un vocabulaire théologique technique; il ne tranche pas les débats plus larges sur les effets de la justification.
- issue: Interprétation de Ὁ δίκαιος ἐκ πίστεως ζήσεται
  choice: le juste vivra par la foi
  alternative: celui qui est juste par la foi vivra; le juste vivra par la fidélité
  rationale: Le texte principal conserve l’enchaînement syntaxique le plus naturel, où « par la foi » se rattache à « vivra ». La valeur possible de πίστις comme « fidélité » est signalée en note afin de préserver l’ambiguïté lexicale sans l’imposer.
translation_notes:
  register: Français international moderne, clair et digne. « Or » marque sobrement la progression du raisonnement. La citation est mise entre guillemets français, et les deux notes sont placées au point précis auquel elles se rapportent.
