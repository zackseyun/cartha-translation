  text: Γινώσκετε ἄρα ὅτι οἱ ἐκ πίστεως, οὗτοι ⸂υἱοί εἰσιν⸃ Ἀβραάμ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/007.yaml
  text: Know, then, that those of faith—these are Abraham’s sons.
translation:
  language: fr
  text: Sachez donc que ce sont ceux qui ont la foi qui sont fils d’Abraham.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Γινώσκετε
  choice: Sachez
  rationale: L’impératif présent peut appeler les destinataires à reconnaître ou tenir pour certain ce qui suit. « Sachez » conserve directement la force exhortative du grec.
- source_word: οἱ ἐκ πίστεως
  choice: ceux qui relèvent de la foi
  rationale: La tournure ἐκ πίστεως désigne ceux dont l’identité ou le statut procède de la foi. « Relèvent de la foi » préserve cette relation sans ajouter explicitement « vivent » ou « sont justifiés ».
- source_word: οὗτοι
  choice: ce sont eux
  rationale: Le démonstratif reprend le groupe précédent avec insistance et contraste. La dislocation française « ce sont eux » restitue cette emphase.
- source_word: υἱοί
  choice: les fils
  rationale: Le terme signifie littéralement « fils » et, dans ce contexte de filiation abrahamique, désigne les descendants ou héritiers véritables. Le maintien de « fils » conserve l’image familiale et le lien lexical avec Abraham.
theological_decisions:
- issue: Nature de la filiation d’Abraham
  choice: Conserver l’expression imagée « fils d’Abraham »
  alternative: « descendants d’Abraham » ou « enfants d’Abraham »
  rationale: Paul formule ici une identité de filiation fondée sur la foi, avec de possibles implications d’appartenance et d’héritage. « Fils » traduit directement υἱοί sans réduire la tension théologique à la seule descendance biologique ni l’expliciter au-delà du texte.
- issue: Portée de ἐκ πίστεως
  choice: « ceux qui relèvent de la foi »
  alternative: « ceux qui ont la foi »
  rationale: La formulation retenue conserve la construction relationnelle du grec et évite de décider si Paul souligne principalement l’origine, le principe directeur ou l’appartenance au groupe caractérisé par la foi.
translation_notes:
  register: Français moderne, digne et accessible. La phrase conserve l’insistance grecque grâce à « ce sont eux », tout en restant naturelle. Aucun marqueur de note n’est requis.
