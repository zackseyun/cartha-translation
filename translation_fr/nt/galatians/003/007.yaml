    issue: « ceux qui relèvent de la foi »
    rationale: Cette tournure est inhabituelle en français moderne et sonne administrative. Elle obscurcit inutilement le sens de οἱ ἐκ πίστεως, qui désigne ici ceux qui ont la foi ou qui se définissent par elle.
  - severity: low
    issue: Restitution de l’insistance de οὗτοι
    rationale: « ce sont eux les fils » est moins idiomatique. La dislocation « ce sont ceux qui ont la foi qui sont fils d’Abraham » conserve naturellement l’identification emphatique du grec.
  revised_text: Sachez donc que ce sont ceux qui ont la foi qui sont fils d’Abraham.
