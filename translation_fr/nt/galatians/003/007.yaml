  source_fidelity: 'Le sens fondamental est bien rendu : Γινώσκετε est un impératif d’exhortation, ἐκ πίστεως désigne les personnes caractérisées par la foi, et υἱοί Ἀβραάμ maintient l’image de la filiation abrahamique. Toutefois, « relèvent de la foi » ne rend pas idiomatiquement cette expression grecque dans un français moderne et peut suggérer une catégorie administrative plutôt qu’une relation définie par la foi.'
  naturalness: La phrase proposée est compréhensible, mais « ceux qui relèvent de la foi » est raide et peu naturel. La construction « ce sont eux les fils » est également moins fluide que la dislocation française complète « ce sont ceux qui ont la foi qui sont fils d’Abraham ».
  terminology: « Fils d’Abraham » est conservé, conformément au terme υἱοί et à l’imagerie paulinienne, sans le réduire à la descendance biologique ni imposer une interprétation doctrinale. « Ceux qui ont la foi » est une expression moderne et naturelle qui rend de façon sûre le groupe οἱ ἐκ πίστεως dans ce contexte.
  issues:
