  rationale: La révision remplace une expression française peu naturelle par « ceux qui ont la foi », tout en préservant l’opposition implicite et sans expliciter davantage la portée théologique de ἐκ πίστεως. La structure « ce sont … qui » restitue l’emphase du démonstratif οὗτοι. « Fils d’Abraham » est maintenu littéralement et sans note, aucune ambiguïté textuelle ne nécessitant ici d’ancrage.
