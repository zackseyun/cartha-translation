- from: Galates insensés, qui vous a ensorcelés[a], vous qui avez eu sous les yeux Jésus le Messie[b] présenté publiquement comme crucifié[c] ?
  to: Galates insensés ! Qui vous a ensorcelés ? Jésus le Messie a été dépeint publiquement devant vos yeux comme crucifié.
  rationale: La révision supprime le parfait ajouté par « avez eu », rétablit une relation directe entre la présentation et « devant vos yeux », et adopte « dépeint publiquement » pour mieux rendre la portée visuelle et proclamative de προεγράφη. Les notes conservent les alternatives lexicales sans trancher entre une affiche matérielle et une présentation vive par la prédication.
