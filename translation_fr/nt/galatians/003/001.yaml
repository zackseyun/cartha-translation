id: GAL.3.1
reference: Galatians 3:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ὦ ἀνόητοι Γαλάται, τίς ὑμᾶς ⸀ἐβάσκανεν, οἷς κατ’ ὀφθαλμοὺς Ἰησοῦς Χριστὸς ⸀προεγράφη ἐσταυρωμένος;
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/001.yaml
  text: You foolish Galatians[a], who has bewitched you[c][b], before whose eyes Jesus the Messiah was publicly portrayed as crucified?
translation:
  language: fr
  text: Galates insensés ! Qui vous a ensorcelés ? Jésus le Messie a été dépeint publiquement devant vos yeux comme crucifié.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνόητοι
  choice: insensés
  rationale: Rend le reproche portant sur le manque de discernement sans lui donner une portée morale plus forte que le grec.
- source_word: Γαλάται
  choice: Galates
  rationale: Désignation française habituelle des habitants de la Galatie auxquels Paul s’adresse.
- source_word: ἐβάσκανεν
  choice: a ensorcelés
  rationale: Conserve l’image vive d’un enchantement ou d’une influence malfaisante, plutôt que de l’aplatir en simple tromperie.
- source_word: οἷς κατ’ ὀφθαλμοὺς
  choice: vous qui avez eu sous les yeux
  rationale: Formulation française naturelle qui maintient l’idée d’une présentation placée directement et clairement devant eux.
- source_word: Ἰησοῦς Χριστός
  choice: Jésus le Messie
  rationale: Traduit Χριστός comme un titre porteur de sens, conformément à son origine messianique, plutôt que comme un élément assimilable à un nom de famille.
- source_word: προεγράφη
  choice: présenté publiquement
  rationale: Exprime une mise en évidence ouverte et frappante; le contexte évoque vraisemblablement la proclamation qui a rendu le Christ crucifié comme visible à leurs yeux.
- source_word: ἐσταυρωμένος
  choice: comme crucifié
  rationale: Le participe décrit l’état sous lequel Jésus a été présenté; «comme crucifié» en conserve la valeur prédicative.
theological_decisions:
- issue: Traduction de Χριστός dans l’expression Ἰησοῦς Χριστός
  choice: Jésus le Messie
  alternative: Jésus-Christ
  rationale: «Messie» fait entendre la valeur de titre de Χριστός sans imposer une interprétation confessionnelle supplémentaire; la forme française traditionnelle est signalée en note.
- issue: Nature de la présentation de Jésus crucifié
  choice: présenté publiquement comme crucifié
  alternative: dépeint avec évidence comme crucifié
  rationale: La formulation préserve la force visuelle et publique possible de προγράφω sans décider si Paul renvoie à une image matérielle, à une affiche ou à sa proclamation vivante.
translation_notes:
  register: Français international actuel, digne et direct. L’apostrophe « Galates insensés » garde la vigueur du reproche. La reprise par « vous qui » évite une relative lourde tout en conservant le lien syntaxique entre les destinataires et ce qui a été placé sous leurs yeux.
