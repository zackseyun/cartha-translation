id: GAL.3.25
reference: Galatians 3:25
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐλθούσης δὲ τῆς πίστεως οὐκέτι ὑπὸ παιδαγωγόν ἐσμεν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/025.yaml
  text: But now that faith has come[b][a], we are no longer under a guardian.
translation:
  language: fr
  text: Mais maintenant que la foi est venue[a], nous ne sommes plus sous l’autorité d’un gardien[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dans ce contexte, « la foi » peut aussi désigner la réalité ou l’époque de la foi désormais manifestée.
    reason: alternative_reading
  - marker: b
    text: Le mot grec désigne la personne chargée, dans une maisonnée, de surveiller et d’encadrer un enfant mineur, et non principalement un enseignant.
    reason: cultural_note
lexical_decisions:
- source_word: ἐλθούσης
  choice: maintenant que … est venue
  rationale: Le participe aoriste dans ce génitif absolu exprime naturellement une circonstance temporelle. Cette formulation présente la venue comme accomplie et toujours déterminante.
- source_word: δὲ
  choice: Mais
  rationale: La conjonction marque ici un léger contraste avec la période décrite au verset précédent.
- source_word: πίστεως
  choice: la foi
  rationale: « La foi » est le sens normal de πίστις ici. L’article est indispensable en français, tandis que le contexte permet d’entendre soit la foi elle-même, soit la nouvelle situation historique caractérisée par elle.
- source_word: οὐκέτι
  choice: ne … plus
  rationale: Cette tournure exprime clairement la cessation de la situation antérieure.
- source_word: ὑπὸ παιδαγωγόν
  choice: sous l’autorité d’un gardien
  rationale: La formulation conserve l’image de la soumission à une personne chargée d’encadrer un mineur. « Gardien » évite de faire du παιδαγωγός principalement un enseignant.
- source_word: ἐσμεν
  choice: nous sommes
  rationale: Le présent simple du verbe εἰμί se rend directement par la copule française.
theological_decisions:
- issue: Sens de la venue de la foi dans le contexte
  choice: « la foi est venue »
  alternative: Comprendre « la foi » comme désignant plus explicitement l’ère ou la réalité de la foi désormais manifestée
  rationale: La traduction conserve la formulation de Paul et son caractère historique sans décider si « la foi » désigne surtout l’acte de croire, la réalité révélée en Christ ou l’époque qu’elle inaugure.
translation_notes:
  register: Français international moderne, naturel et digne. La structure temporelle et le contraste avec la période précédente sont explicites, tandis que l’image antique du gardien est conservée et expliquée en note.
