id: GAL.3.15
reference: Galatians 3:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἀδελφοί, κατὰ ἄνθρωπον λέγω· ὅμως ἀνθρώπου κεκυρωμένην διαθήκην οὐδεὶς ἀθετεῖ ἢ ἐπιδιατάσσεται.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/015.yaml
  text: 'Brothers[a], I am speaking in human terms: even a covenant ratified by a man[b], no one sets aside or adds to it.'
translation:
  language: fr
  text: 'Frères[a], je parle en termes humains : même une alliance humaine ratifiée[b], personne ne l’annule ni n’y ajoute quoi que ce soit.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec porte « Frères » (masculin pluriel). Paul s’adresse aux croyants, probablement à des femmes comme à des hommes.
    reason: cultural_note
  - marker: b
    text: 'Ou : « testament » ; le mot grec peut désigner une alliance ou un testament.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀδελφοί
  choice: Frères et sœurs
  rationale: Le vocatif masculin pluriel désigne ici les croyants auxquels Paul s’adresse, vraisemblablement un groupe mixte. La formulation inclusive exprime naturellement en français moderne la portée contextuelle du terme, tandis qu’une note signale sa forme grammaticale grecque.
- source_word: κατὰ ἄνθρωπον λέγω
  choice: je parle en termes humains
  rationale: Cette tournure idiomatique introduit un exemple tiré des usages humains ordinaires. La traduction reste proche de l’image grecque tout en étant naturelle en français.
- source_word: ὅμως
  choice: même
  rationale: 'Dans l’enchaînement de l’argument, le mot renforce l’exemple : même dans le cas d’une alliance humaine, le principe énoncé vaut.'
- source_word: ἀνθρώπου
  choice: par un être humain
  rationale: Le génitif singulier indique ici l’origine humaine de l’alliance. « Être humain » conserve le singulier sans donner à tort au masculin grammatical une portée exclusivement masculine.
- source_word: κεκυρωμένην
  choice: ratifiée
  rationale: Le participe parfait passif présente l’alliance comme officiellement confirmée et désormais en vigueur. « Ratifiée » rend bien cette nuance juridique.
- source_word: διαθήκην
  choice: alliance
  rationale: Dans le contexte immédiat, Paul traite de la promesse faite à Abraham; « alliance » maintient cette continuité biblique et théologique. Le sens juridique possible de « testament » est indiqué en note.
- source_word: ἀθετεῖ
  choice: annule
  rationale: Le verbe signifie rendre sans effet ou invalider. « Annule » est clair, actuel et adapté au contexte juridique.
- source_word: ἐπιδιατάσσεται
  choice: n’y ajoute quoi que ce soit
  rationale: Le verbe évoque l’ajout ultérieur de dispositions. Cette formulation française rend explicitement l’interdiction de toute addition sans alourdir le texte.
theological_decisions:
- issue: 'Sens de διαθήκη : « alliance » ou « testament »'
  choice: alliance
  alternative: testament
  rationale: L’argument de Galates 3 porte sur la promesse faite à Abraham et sur l’alliance divine. « Alliance » préserve donc le fil théologique du passage, sans nier la nuance juridique réelle de « testament », mentionnée en note.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe garde la progression argumentative de Paul; le vocabulaire juridique reste accessible. L’inclusion de l’auditoire mixte est rendue dans le texte et la forme grecque est documentée en note.
