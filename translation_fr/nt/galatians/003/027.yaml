id: GAL.3.27
reference: Galatians 3:27
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὅσοι γὰρ εἰς Χριστὸν ἐβαπτίσθητε, Χριστὸν ἐνεδύσασθε·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/027.yaml
  text: For as many of you as were baptized into Messiah have put on Messiah[a][b].
translation:
  language: fr
  text: Car tous ceux d’entre vous qui avez été baptisés dans le Christ ont revêtu le Christ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « vous vous êtes revêtus du Christ ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅσοι
  choice: vous tous qui
  rationale: Rend naturellement en français la portée corrélative et inclusive de ὅσοι dans l’adresse directe aux Galates.
- source_word: γὰρ
  choice: En effet
  rationale: Conserve le lien explicatif avec l’argument précédent, dans un français courant et soutenu.
- source_word: εἰς
  choice: en
  rationale: Dans l’expression française consacrée « baptisés en Christ », « en » peut porter l’idée d’entrée et d’incorporation exprimée par εἰς sans ajouter d’explication doctrinale.
- source_word: Χριστόν
  choice: Christ
  rationale: En français, « Christ » demeure le titre biblique naturel et immédiatement reconnaissable; il convient ici aux deux occurrences et maintient leur parallélisme.
- source_word: ἐβαπτίσθητε
  choice: avez été baptisés
  rationale: Préserve la forme passive et évite de préciser un mode baptismal que le verbe ne tranche pas ici.
- source_word: ἐνεδύσασθε
  choice: avez revêtu
  rationale: Conserve directement et dignement la métaphore du vêtement, tout en restant idiomatique en français biblique moderne.
theological_decisions:
- issue: La formulation baptismale doit-elle impliquer une théologie sacramentelle ou un mode précis de baptême ?
  choice: avez été baptisés en Christ
  alternative: avez été immergés en Christ / avez été baptisés relativement à Christ
  rationale: Le grec exprime une orientation ou incorporation en Christ, mais ne tranche pas à lui seul les débats doctrinaux ultérieurs sur l’efficacité sacramentelle ni sur le mode physique du baptême.
- issue: Faut-il expliciter la portée théologique de la métaphore du vêtement ?
  choice: vous avez revêtu Christ
  alternative: vous vous êtes habillés de Christ
  rationale: La traduction maintient la métaphore sans la réduire à l’imitation morale, à l’union mystique ou à un statut juridique particulier.
translation_notes:
  register: Français international moderne, naturel et digne. « Revêtir » garde la force de l’image vestimentaire; la répétition de « Christ » reproduit le parallélisme appuyé du grec.
