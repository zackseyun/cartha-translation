id: GAL.3.8
reference: Galatians 3:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: προϊδοῦσα δὲ ἡ γραφὴ ὅτι ἐκ πίστεως δικαιοῖ τὰ ἔθνη ὁ θεὸς προευηγγελίσατο τῷ Ἀβραὰμ ὅτι Ἐνευλογηθήσονται ἐν σοὶ πάντα τὰ ἔθνη.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/008.yaml
  text: 'And the Scripture[a], foreseeing that God justifies the nations by faith[b], proclaimed the good news beforehand to Abraham: “In you all the nations will be blessed.”'
translation:
  language: fr
  text: 'Or l’Écriture, prévoyant que Dieu justifie les nations[a] par la foi, a d’avance annoncé la bonne nouvelle[b] à Abraham : « En toi, toutes les nations seront bénies. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les non-Juifs » ; le grec ἔθνη peut signifier « nations » ou « non-Juifs ».
    reason: lexical_alternative
  - marker: b
    text: Ou « a d’avance annoncé l’Évangile à Abraham ».
    reason: lexical_alternative
lexical_decisions:
- source_word: προϊδοῦσα
  choice: prévoyant
  rationale: Le participe aoriste exprime une perception anticipée. « Prévoyant » est naturel en français et conserve la personnification de l’Écriture.
- source_word: ἡ γραφή
  choice: l’Écriture
  rationale: Il s’agit de l’emploi paulinien consacré pour les textes sacrés, ici personnifiés, et non d’un simple « écrit ».
- source_word: ἐκ πίστεως
  choice: par la foi
  rationale: Cette formulation française courante exprime le moyen ou le fondement sans préciser davantage une relation que le grec laisse concise.
- source_word: δικαιοῖ
  choice: justifie
  rationale: Le présent grec est conservé. « Justifie » rend sobrement le verbe paulinien sans le développer en paraphrase interprétative.
- source_word: τὰ ἔθνη ... πάντα τὰ ἔθνη
  choice: les nations ... toutes les nations
  rationale: La répétition de « nations » maintient le lien lexical explicite entre l’affirmation de Paul et la promesse faite à Abraham. Une note signale que le premier emploi peut aussi désigner les non-Juifs.
- source_word: προευηγγελίσατο
  choice: a d’avance annoncé la bonne nouvelle
  rationale: Cette formulation rend à la fois l’antériorité marquée par προ- et la notion de bonne nouvelle portée par εὐαγγελ-, dans un français accessible.
- source_word: τῷ Ἀβραὰμ
  choice: à Abraham
  rationale: Rendu direct du complément d’attribution au datif.
- source_word: Ἐνευλογηθήσονται
  choice: seront bénies
  rationale: Le futur passif de la promesse est rendu directement, sans expliciter l’agent ni paraphraser la bénédiction.
- source_word: ἐν σοὶ
  choice: En toi
  rationale: La préposition et la place initiale dans la citation sont conservées afin de préserver la formulation représentative de la promesse sans en imposer une interprétation.
theological_decisions:
- issue: 'Sens de ἔθνη : « nations » ou « non-Juifs »'
  choice: « nations » aux deux occurrences
  alternative: « non-Juifs » dans la première proposition, puis « nations » dans la citation
  rationale: « Nations » préserve la répétition grecque et rend visible le rapport établi par Paul entre la justification par la foi et la promesse abrahamique. La possibilité du sens « non-Juifs » est maintenue en note.
- issue: Valeur de δικαιόω
  choice: « justifie »
  alternative: « déclare justes »
  rationale: Le terme théologique français usuel reste suffisamment proche du grec et évite de trancher par une périphrase la portée précise du verbe dans ce contexte.
translation_notes:
  register: Français international moderne, digne et accessible. La personnification de l’Écriture et la structure de la promesse sont conservées. Les marqueurs de note sont placés sur les expressions auxquelles les variantes se rapportent.
