  yaml_path: translation/nt/galatians/003/020.yaml
  text: A mediator is not of one[b][a], but God is one.
translation:
  language: fr
  text: Or, un médiateur n’est pas d’un seul[a], mais Dieu est un[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, en explicitant le sens possible : « un médiateur n’agit pas pour un seul » ou « n’intervient pas pour une seule partie ». Le grec dit littéralement : « n’est pas d’un seul ».'
    reason: alternative_reading
  - marker: b
    text: « Dieu est un » fait probablement écho à la confession de l’unicité de Dieu en Deutéronome 6,4.
    reason: cross_reference
lexical_decisions:
- source_word: μεσίτης
  choice: médiateur
  rationale: « Médiateur » est le terme français courant et précis pour une personne qui intervient entre des parties; il conserve la portée relationnelle et juridique du grec sans paraphrase.
- source_word: ἑνὸς
  choice: d’un seul
  rationale: Cette formulation rend directement le génitif grec, qui demeure très condensé et ambigu. La note indique les principales compréhensions possibles sans en imposer une dans le texte.
- source_word: οὐκ ἔστιν
  choice: n’est pas
  rationale: La traduction directe préserve la formulation énigmatique de Paul plutôt que de la développer en « n’agit pas pour » ou « ne concerne pas ».
- source_word: δὲ … δὲ
  choice: Or … mais
  rationale: Le premier δέ introduit l’énoncé dans le raisonnement, tandis que le second marque le contraste avec l’affirmation concernant Dieu. « Or » ne lui donne pas un sens temporel.
- source_word: ὁ θεὸς εἷς ἐστιν
  choice: Dieu est un
  rationale: Cette traduction concise respecte l’affirmation grecque et son probable écho à la confession de l’unicité de Dieu.
theological_decisions:
- issue: Le sens de l’affirmation condensée sur le médiateur
  choice: Maintenir dans le texte la formulation littérale « n’est pas d’un seul » et expliciter seulement en note ses sens relationnels possibles.
  alternative: « Un médiateur n’intervient pas pour une seule partie » ou « un médiateur suppose plus d’une partie ».
  rationale: Galates 3.20 est notoirement difficile. Une paraphrase plus explicite risquerait de trancher la logique de Paul et d’introduire une construction précise sur la Loi, Moïse, le Christ ou les alliances que ce seul énoncé ne formule pas.
- issue: L’unicité de Dieu
  choice: « Dieu est un »
  alternative: « Il n’y a qu’un seul Dieu » ou « Dieu est unique ».
  rationale: La formulation retenue conserve la brièveté et la tension avec « un seul » dans la première proposition, tout en laissant perceptible l’écho possible à Deutéronome 6.4.
translation_notes:
  register: 'Français moderne, sobre et digne. La légère étrangeté de « n’est pas d’un seul » est volontaire : elle reflète la concision et l’ambiguïté réelles du grec, tandis que la note aide le lecteur sans résoudre le débat dans le corps du texte.'
