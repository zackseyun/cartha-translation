  text: πάντες γὰρ υἱοὶ θεοῦ ἐστε διὰ τῆς πίστεως ἐν Χριστῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/026.yaml
  text: For you are all sons of God through faith in Messiah Jesus[a][b].
translation:
  language: fr
  text: Car, par la foi, vous êtes tous fils de Dieu[a] en Jésus le Messie[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec dit « fils de Dieu ». Dans ce contexte, cette filiation et le statut d’héritier qui l’accompagne concernent tous les croyants, femmes et hommes. On pourrait aussi traduire : « enfants de Dieu ».'
    reason: lexical_alternative
  - marker: b
    text: 'La formulation grecque peut aussi se comprendre : « par la foi en Jésus le Messie ». Traduction traditionnelle : « en Jésus-Christ ».'
    reason: syntactic_and_lexical_alternative
lexical_decisions:
- source_word: πάντες
  choice: tous
  rationale: Avec le verbe à la deuxième personne du pluriel, le terme inclut et souligne l’ensemble des destinataires.
- source_word: γὰρ
  choice: Car
  rationale: La conjonction introduit le fondement de l’affirmation précédente; « Car » conserve explicitement ce lien logique.
- source_word: υἱοὶ θεοῦ
  choice: fils de Dieu
  rationale: Le grec dit précisément « fils ». Ce choix préserve le langage filial ainsi que sa portée de statut et d’héritage, tout en visant l’ensemble des croyants selon le contexte.
- source_word: διὰ τῆς πίστεως
  choice: par la foi
  rationale: διά avec le génitif exprime ici le moyen; « par la foi » est idiomatique et fidèle en français.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: en Jésus le Messie
  rationale: « en » conserve la formulation paulinienne et sa possible nuance d’union; Χριστός est rendu comme le titre « Messie », dans un ordre naturel en français.
theological_decisions:
- issue: Langage filial genré
  choice: fils de Dieu
  alternative: enfants de Dieu
  rationale: « Fils » correspond directement à υἱοί et maintient la nuance paulinienne de filiation et d’héritage. La note précise que, dans le contexte, cette dignité appartient à tous les croyants, femmes et hommes.
- issue: Portée de ἐν Χριστῷ Ἰησοῦ
  choice: en Jésus le Messie
  alternative: foi en Jésus le Messie
  rationale: La construction peut être rattachée à la foi ou à l’état d’être fils de Dieu. Le texte principal conserve « en » et la note signale cette ambiguïté au lieu de la trancher silencieusement.
- issue: Rendu de Χριστός
  choice: le Messie
  alternative: le Christ
  rationale: Χριστός est ici un titre; « Messie » en exprime le sens plutôt que de simplement le translittérer.
translation_notes:
  register: Français international moderne, sobre et digne. La place de « par la foi » rend la phrase fluide tout en laissant « en Jésus le Messie » porter la nuance paulinienne d’union. « Jésus le Messie » est plus naturel en français que « Messie Jésus ».
