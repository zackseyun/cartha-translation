id: GAL.3.2
reference: Galatians 3:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τοῦτο μόνον θέλω μαθεῖν ἀφ’ ὑμῶν, ἐξ ἔργων νόμου τὸ πνεῦμα ἐλάβετε ἢ ἐξ ἀκοῆς πίστεως;
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/002.yaml
  text: 'This only I want to learn from you: did you receive the Spirit by works of the law[b][a], or by hearing with faith?'
translation:
  language: fr
  text: 'Je veux seulement savoir ceci de vous : est-ce par les œuvres de la Loi que vous avez reçu l’Esprit, ou en écoutant avec foi[a][b] ?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « par l’écoute de la foi » ; l’expression grecque condensée peut aussi se comprendre comme l’écoute du message avec foi.
    reason: alternative_reading
  - marker: b
    text: « Fidélité » est ici une nuance moins probable de « foi », mais elle est parfois envisagée en raison de la construction grecque condensée.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο μόνον
  choice: seulement … ceci
  rationale: Conserve l’insistance initiale de Paul tout en adoptant un ordre naturel en français.
- source_word: θέλω μαθεῖν
  choice: je veux apprendre
  rationale: Rend directement θέλω suivi de l’infinitif et préserve le ton personnel et interrogatif.
- source_word: ἀφ’ ὑμῶν
  choice: de vous
  rationale: Reproduit simplement la préposition et le pronom pluriel, sans explicitation inutile.
- source_word: ἐξ ἔργων νόμου
  choice: par les œuvres de la Loi
  rationale: Préserve l’expression paulinienne et le contraste de moyen ou de fondement introduit par ἐξ. La majuscule à « Loi » indique ici la Loi mosaïque visée dans le contexte.
- source_word: τὸ πνεῦμα
  choice: l’Esprit
  rationale: Le contexte désigne l’Esprit de Dieu reçu par les croyants. La majuscule marque ce référent personnel sans ajouter « Saint », absent du grec.
- source_word: ἐλάβετε
  choice: vous avez reçu
  rationale: Le passé composé exprime naturellement en français l’événement passé dont les effets demeurent pertinents dans la question de Paul.
- source_word: ἐξ ἀκοῆς πίστεως
  choice: en écoutant avec foi
  rationale: Formulation française claire qui maintient le contraste entre les œuvres et une écoute accompagnée de foi, tout en signalant en note les autres analyses possibles du génitif condensé.
- source_word: πίστεως
  choice: foi
  rationale: « Foi » est ici le sens le plus probable de πίστις; « fidélité » reste une nuance possible mais moins vraisemblable.
theological_decisions:
- issue: Référent de « l’Esprit »
  choice: L’Esprit de Dieu donné aux croyants
  alternative: Une expérience ou une puissance spirituelle au sens plus général
  rationale: Le contexte immédiat de Galates 3 parle de l’Esprit que Dieu donne aux Galates; le référent divin personnel est donc le plus probable.
- issue: Rapport entre ἀκοῆς et πίστεως
  choice: Une écoute accompagnée de foi
  alternative: L’écoute du message qui suscite ou appelle la foi; « l’écoute de la foi »
  rationale: La construction grecque est condensée et autorise plusieurs rapports entre les deux noms. Le texte principal retient une lecture idiomatique sans supprimer les autres possibilités, indiquées en note.
translation_notes:
  register: Français international moderne, clair et digne. La structure rhétorique de la question est conservée, ainsi que le parallélisme entre « par les œuvres de la Loi » et « en écoutant avec foi ». Les notes maintiennent l’ambiguïté réelle de ἀκοῆς πίστεως sans alourdir le texte principal.
