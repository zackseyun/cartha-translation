  source_fidelity: Le texte rend avec justesse la question téléologique « Τί οὖν ὁ νόμος; », le passif de « προσετέθη », la fonction volontairement non précisée de « τῶν παραβάσεων χάριν », ainsi que la limite temporelle introduite par « ἄχρις οὗ ». « La descendance » est une solution française naturelle pour τὸ σπέρμα et la note conserve utilement « semence » et « descendant ». Les deux médiations, par les anges et par un médiateur, sont toutes deux maintenues sans identifier ce médiateur. La phrase séparée qui reprend « Elle » ne change pas le rattachement de διαταγεὶς à la Loi.
