id: GAL.3.19
reference: Galatians 3:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Τί οὖν ὁ νόμος; τῶν παραβάσεων χάριν προσετέθη, ἄχρις ⸀οὗ ἔλθῃ τὸ σπέρμα ᾧ ἐπήγγελται, διαταγεὶς δι’ ἀγγέλων ἐν χειρὶ μεσίτου·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/019.yaml
  text: Why then the law? It was added because of transgressions until the seed should come to whom the promise had been made[c][b][a], having been ordained through angels by the hand of a mediator.
translation:
  language: fr
  text: Pourquoi donc la Loi ? Elle a été ajoutée à cause des transgressions[b], jusqu’à ce que vienne la descendance[a] à qui la promesse avait été faite. Elle a été établie[c] par l’intermédiaire d’anges, par la main d’un médiateur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « semence » ou « descendant ».
    reason: lexical_alternative
  - marker: b
    text: « À cause des transgressions » peut signifier que la Loi devait les traiter, les mettre en évidence ou les contenir ; le grec ne précise pas davantage.
    reason: alternative_reading
  - marker: c
    text: Ou « ordonnée » ou « disposée ».
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί οὖν ὁ νόμος;
  choice: Pourquoi donc la Loi ?
  rationale: La question elliptique porte naturellement sur la raison d’être de la Loi dans l’argument de Paul, plutôt que sur sa définition. La majuscule signale ici la Loi mosaïque.
- source_word: τῶν παραβάσεων χάριν
  choice: à cause des transgressions
  rationale: Cette formulation française conserve la concision et l’ambiguïté de χάριν avec le génitif, sans préciser si la Loi devait réprimer, révéler ou provoquer les transgressions.
- source_word: προσετέθη
  choice: a été ajoutée
  rationale: Rend directement le passif aoriste et présente la Loi comme un élément ajouté dans le déroulement de l’argument.
- source_word: ἄχρις οὗ ἔλθῃ
  choice: jusqu’à ce que vienne
  rationale: Le subjonctif français exprime naturellement la limite fixée par un événement encore à venir du point de vue de l’ajout de la Loi.
- source_word: τὸ σπέρμα
  choice: la descendance
  rationale: « Descendance » est naturel en français et peut conserver la valeur collective de σπέρμα, tout en permettant le lien avec la promesse faite à Abraham. Les autres possibilités sont signalées en note.
- source_word: ᾧ ἐπήγγελται
  choice: à qui la promesse avait été faite
  rationale: La tournure rend explicite la promesse déjà présente dans le contexte et exprime l’antériorité ainsi que la portée durable du parfait grec.
- source_word: διαταγεὶς
  choice: elle a été établie
  rationale: La reprise explicite de « la Loi » évite une construction participiale lourde. « Établie » rend l’idée d’une disposition officiellement instituée sans imposer un sens plus étroit.
- source_word: δι’ ἀγγέλων
  choice: par l’intermédiaire d’anges
  rationale: Cette expression rend clairement l’agence médiatrice indiquée par διά avec le génitif.
- source_word: ἐν χειρὶ μεσίτου
  choice: par la main d’un médiateur
  rationale: La formulation conserve l’image concrète de l’expression grecque tout en restant intelligible dans un registre biblique digne.
theological_decisions:
- issue: Sens de « à cause des transgressions »
  choice: Conserver la formulation générale « à cause des transgressions ».
  alternative: Préciser « pour réprimer », « pour révéler » ou « pour faire ressortir les transgressions ».
  rationale: Le grec n’indique pas plus précisément le rapport visé; la traduction ne tranche donc pas une question théologique débattue.
- issue: Valeur de σπέρμα dans l’argument de Paul
  choice: Employer « descendance » dans le texte.
  alternative: Employer « semence » ou « descendant ».
  rationale: « Descendance » préserve la souplesse entre valeur collective et référent singulier sans rendre le français artificiel; la note maintient visibles les autres valeurs lexicales importantes.
- issue: Médiation de la Loi
  choice: 'Conserver les deux expressions de médiation: « par l’intermédiaire d’anges » et « par la main d’un médiateur ».'
  alternative: Fusionner en « transmise par des anges au moyen d’un médiateur ».
  rationale: La structure retenue reflète les deux formulations grecques sans identifier davantage le médiateur ni expliquer son rôle.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe elliptique de la question est conservée; la longue phrase grecque est divisée pour éviter une ambiguïté grammaticale, tout en maintenant le lien entre la Loi et son établissement médiatisé.
