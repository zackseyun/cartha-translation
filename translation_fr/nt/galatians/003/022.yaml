id: GAL.3.22
reference: Galatians 3:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀλλὰ συνέκλεισεν ἡ γραφὴ τὰ πάντα ὑπὸ ἁμαρτίαν ἵνα ἡ ἐπαγγελία ἐκ πίστεως Ἰησοῦ Χριστοῦ δοθῇ τοῖς πιστεύουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/022.yaml
  text: But the Scripture imprisoned everything under sin[b][a], so that the promise by faith in Jesus the Messiah might be given to those who believe.
translation:
  language: fr
  text: Mais l’Écriture a tout enfermé sous le péché[b], afin que la promesse soit donnée, par la foi en Jésus le Messie[a], à ceux qui croient.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « par la fidélité de Jésus le Messie ».'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « a enfermé toutes choses sous le péché ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: συνέκλεισεν
  choice: a enfermé
  rationale: Rend l’idée d’enclore et de maintenir sous contrainte, tout en restant naturel en français moderne.
- source_word: ἡ γραφή
  choice: l’Écriture
  rationale: Conserve le singulier et la personnification paulinienne de l’Écriture comme témoin agissant.
- source_word: τὰ πάντα
  choice: tout
  rationale: Préserve la portée globale du neutre pluriel sans la limiter explicitement aux seules personnes.
- source_word: ὑπὸ ἁμαρτίαν
  choice: sous le péché
  rationale: Maintient la métaphore de sujétion sans ajouter dans le texte principal une précision interprétative telle que « sous le pouvoir du péché ».
- source_word: ἡ ἐπαγγελία
  choice: la promesse
  rationale: Traduction directe et naturelle du nom grec, sans expliciter comme « don promis » ce qui reste implicite.
- source_word: ἐκ πίστεως Ἰησοῦ Χριστοῦ
  choice: fondée sur la foi en Jésus le Messie
  rationale: Adopte dans le texte principal la lecture objective courante du génitif, tout en rendant la valeur de ἐκ de manière française; la lecture subjective est conservée en note.
- source_word: Χριστοῦ
  choice: le Messie
  rationale: Rend Χριστός comme titre messianique associé au nom Jésus.
- source_word: δοθῇ
  choice: soit donnée
  rationale: Le subjonctif passif après « afin que » exprime naturellement en français la visée indiquée par ἵνα.
- source_word: τοῖς πιστεύουσιν
  choice: à ceux qui croient
  rationale: Conserve la valeur active du participe et établit le lien lexical avec la foi.
theological_decisions:
- issue: Le génitif dans πίστεως Ἰησοῦ Χριστοῦ
  choice: 'Lecture objective : « la foi en Jésus le Messie »'
  alternative: 'Lecture subjective : « la fidélité de Jésus le Messie »'
  rationale: La construction grecque est réellement ambiguë et débattue. Le texte principal retient la lecture objective courante, tandis que la note préserve la lecture subjective sans trancher silencieusement la tension théologique.
translation_notes:
  register: Français international moderne, digne et accessible. « Enfermé » maintient l’image forte de la captivité; « sous le péché » conserve la formulation métaphorique concise de Paul. Les marqueurs suivent immédiatement les expressions concernées.
