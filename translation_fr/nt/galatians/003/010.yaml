revisions:
- from: 'En effet, tous ceux qui relèvent des œuvres de la Loi[a] sont sous le coup d’une malédiction, car il est écrit : « Maudit est quiconque ne persévère pas dans la mise en pratique de tout ce qui est écrit dans le livre de la Loi[b]. »'
  to: 'En effet, tous ceux qui relèvent des œuvres de la Loi[a] sont sous le coup d’une malédiction, car il est écrit : « Maudit est quiconque ne persévère pas dans tout ce qui est écrit dans le livre de la Loi[b], pour le mettre en pratique. »'
  rationale: La révision conserve le choix prudent de « relèvent des œuvres de la Loi », sans imposer l’interprétation « comptent sur ». Elle rétablit dans le texte le complément final exprimant la mise en pratique. Le singulier « le » reprend naturellement en français « tout ce qui est écrit »; la note garde la pluralité formelle du grec (« les choses… les faire »).
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T11:37:17Z'
review_pass:
  verdict: revise
  source_fidelity: Le sens général est bien rendu, y compris la portée universelle, la condition de malédiction et la totalité des prescriptions écrites. Toutefois, le texte principal absorbe et déplace l’infinitif final τοῦ ποιῆσαι αὐτά (« pour les faire ») dans « la mise en pratique », tandis que la note le présente comme un élément distinct. Une formulation qui conserve explicitement ce complément final est préférable.
  naturalness: « Relèvent des œuvres de la Loi » est compréhensible et préserve utilement l’ambiguïté de ἐξ ἔργων νόμου, bien que son registre soit légèrement abstrait. La révision rend la seconde partie de la citation plus transparente et plus proche de la syntaxe grecque sans devenir un calque.
  terminology: « Œuvres de la Loi », « la Loi », « malédiction » et « il est écrit » conviennent. La majuscule à « Loi » est cohérente avec la référence à la Torah. « Persévérer dans » rend de façon acceptable ἐμμένει; « pour les mettre en pratique » restitue clairement ποιῆσαι αὐτά.
