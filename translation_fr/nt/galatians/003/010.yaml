id: GAL.3.10
reference: Galatians 3:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ὅσοι γὰρ ἐξ ἔργων νόμου εἰσὶν ὑπὸ κατάραν εἰσίν, γέγραπται γὰρ ⸀ὅτι Ἐπικατάρατος πᾶς ὃς οὐκ ⸀ἐμμένει πᾶσιν τοῖς γεγραμμένοις ἐν τῷ βιβλίῳ τοῦ νόμου τοῦ ποιῆσαι αὐτά.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/010.yaml
  text: For all who are of works of the law are under a curse[a], for it is written, “Cursed is everyone who does not remain in all the things written in the book of the law[b], to do them.”
translation:
  language: fr
  text: 'En effet, tous ceux qui relèvent des œuvres de la Loi[a] sont sous le coup d’une malédiction, car il est écrit : « Maudit est quiconque ne persévère pas dans tout ce qui est écrit dans le livre de la Loi[b], pour le mettre en pratique. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « qui comptent sur les œuvres de la Loi ».'
    reason: alternative_reading
  - marker: b
    text: 'Littéralement : « ne persévère pas dans toutes les choses écrites dans le livre de la Loi, pour les faire ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅσοι γὰρ
  choice: En effet, tous ceux qui
  rationale: « Tous ceux qui » conserve la portée plurielle et générale de ὅσοι ; « en effet » rend la valeur explicative de γάρ dans un français naturel.
- source_word: ἐξ ἔργων νόμου
  choice: qui relèvent des œuvres de la Loi
  rationale: Cette formulation indique l’appartenance à une catégorie caractérisée par les œuvres de la Loi, sans réduire d’emblée l’expression à l’idée de confiance ou de dépendance.
- source_word: ὑπὸ κατάραν
  choice: sous le coup d’une malédiction
  rationale: Expression française idiomatique qui rend la situation de sujétion exprimée par ὑπό, tout en respectant l’absence d’article devant κατάραν.
- source_word: γέγραπται
  choice: il est écrit
  rationale: Formule française consacrée pour introduire une citation faisant autorité ; elle reflète la portée durable du parfait grec.
- source_word: Ἐπικατάρατος πᾶς ὃς
  choice: Maudit est quiconque
  rationale: Rend la déclaration solennelle et sa portée universelle sans introduire de distinction de genre absente du sens générique.
- source_word: ἐμμένει
  choice: persévère
  rationale: Exprime l’adhésion continue et durable demandée par le verbe grec.
- source_word: πᾶσιν τοῖς γεγραμμένοις ἐν τῷ βιβλίῳ τοῦ νόμου
  choice: dans la mise en pratique de tout ce qui est écrit dans le livre de la Loi
  rationale: « Tout ce qui est écrit » conserve la totalité visée, tandis que la formulation française permet de rattacher naturellement l’exigence d’obéissance exprimée à la fin de la proposition.
- source_word: τοῦ ποιῆσαι αὐτά
  choice: dans la mise en pratique
  rationale: L’idée concrète de faire ou d’accomplir les prescriptions est intégrée à la phrase en français naturel, sans l’omettre.
theological_decisions:
- issue: Sens de ἐξ ἔργων νόμου
  choice: qui relèvent des œuvres de la Loi
  alternative: qui comptent sur les œuvres de la Loi
  rationale: Le texte principal préserve la formulation relationnelle et théologiquement chargée de Paul sans décider que ἐκ désigne exclusivement la confiance subjective ; la note donne l’interprétation courante.
- issue: Étendue de l’obéissance exigée dans la citation
  choice: tout ce qui est écrit dans le livre de la Loi
  alternative: certains commandements de la Loi
  rationale: La répétition de πᾶς/πᾶσιν impose une portée totale ; la traduction ne l’atténue pas et ne développe pas davantage ses implications doctrinales.
translation_notes:
  register: Français international moderne, clair et digne. La majuscule à « Loi » signale ici la Torah dans son cadre scripturaire. « Relèvent de » conserve autant que possible l’ambiguïté de ἐξ tout en évitant le calque français peu intelligible « sont des œuvres de la Loi ».
