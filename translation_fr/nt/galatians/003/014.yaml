id: GAL.3.14
reference: Galatians 3:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἵνα εἰς τὰ ἔθνη ἡ εὐλογία τοῦ Ἀβραὰμ γένηται ἐν ⸂Χριστῷ Ἰησοῦ⸃, ἵνα τὴν ἐπαγγελίαν τοῦ πνεύματος λάβωμεν διὰ τῆς πίστεως.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/014.yaml
  text: so that the blessing of Abraham might come to the Gentiles in Messiah Jesus[c][b][a], so that we might receive the promise of the Spirit through faith.
translation:
  language: fr
  text: afin que la bénédiction d’Abraham parvienne aux non-Juifs[a] en Jésus le Messie[b], afin que nous recevions, par la foi, la promesse de l’Esprit[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « aux nations ».'
    reason: lexical_alternative
  - marker: b
    text: 'Traditionnellement : « dans le Christ Jésus ».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « l’Esprit promis ».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἵνα
  choice: afin que
  rationale: Rend clairement la valeur finale des deux propositions et conserve leur structure parallèle.
- source_word: εἰς τὰ ἔθνη
  choice: aux non-Juifs
  rationale: Dans ce contexte paulinien, ἔθνη désigne les peuples autres que le peuple juif; cette formulation exprime naturellement le contraste, tandis que « aux nations » reste signalé en note.
- source_word: ἡ εὐλογία τοῦ Ἀβραὰμ
  choice: la bénédiction d’Abraham
  rationale: Formulation directe qui garde le lien explicite avec la bénédiction associée à Abraham.
- source_word: γένηται
  choice: parvienne
  rationale: Dans cette construction, « parvienne aux non-Juifs » exprime idiomatiquement le fait que la bénédiction leur advient, sans imposer le calque peu naturel « devienne ».
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: dans le Messie Jésus
  rationale: « Messie » traduit la valeur de titre de Χριστός, particulièrement pertinente dans l’argument relatif à Abraham et à la promesse.
- source_word: τὴν ἐπαγγελίαν τοῦ πνεύματος
  choice: la promesse de l’Esprit
  rationale: Conserve la construction génitive grecque et son ambiguïté, sans décider dans le texte principal qu’il s’agit nécessairement de « l’Esprit promis ».
- source_word: λάβωμεν
  choice: nous recevions
  rationale: Le subjonctif après « afin que » rend naturellement l’aoriste subjonctif grec dans une proposition finale.
- source_word: διὰ τῆς πίστεως
  choice: par la foi
  rationale: Rend la médiation exprimée par διά et retient le sens courant de πίστις dans ce passage.
theological_decisions:
- issue: Valeur de Χριστῷ comme titre ou forme devenue quasi nominale
  choice: le Messie Jésus
  alternative: le Christ Jésus
  rationale: Le contexte de la bénédiction d’Abraham et de la promesse maintient nettement la portée titulaire de Χριστός; « Messie » la rend explicitement, tandis que la formulation traditionnelle est indiquée en note.
- issue: Sens du génitif τοῦ πνεύματος
  choice: la promesse de l’Esprit
  alternative: l’Esprit promis
  rationale: La traduction principale reproduit l’ambiguïté formelle du grec, qui peut désigner une promesse relative à l’Esprit; l’interprétation contextuellement plausible « l’Esprit promis » est conservée en note.
translation_notes:
  register: Français international moderne, digne et accessible. Le double « afin que » conserve le parallélisme intentionnel du grec. La ponctuation autour de « par la foi » favorise la lisibilité sans modifier son rattachement au verbe « recevions ».
