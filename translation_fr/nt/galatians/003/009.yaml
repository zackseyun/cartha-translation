id: GAL.3.9
reference: Galatians 3:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὥστε οἱ ἐκ πίστεως εὐλογοῦνται σὺν τῷ πιστῷ Ἀβραάμ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/009.yaml
  text: So then[a], those who are of faith are blessed along with Abraham, the faithful one.
translation:
  language: fr
  text: Ainsi donc, ceux qui ont la foi sont bénis avec Abraham, l’homme de foi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Abraham le fidèle ».
    reason: Le grec πιστός peut ici signifier qu’Abraham croit ou qu’il est fidèle.
lexical_decisions:
- source_word: ὥστε
  choice: Ainsi donc
  rationale: Exprime clairement la conséquence tirée de l’argument précédent, dans un français naturel.
- source_word: οἱ ἐκ πίστεως
  choice: ceux qui ont la foi
  rationale: Rend naturellement en français les personnes caractérisées par la foi, sans introduire un objet de foi absent du grec.
- source_word: πίστεως
  choice: foi
  rationale: Dans ce contexte, πίστις désigne la foi plutôt que la fidélité et fait écho à la foi d’Abraham évoquée juste auparavant.
- source_word: εὐλογοῦνται
  choice: sont bénis
  rationale: Conserve la voix passive et présente la bénédiction comme reçue plutôt que produite.
- source_word: σὺν
  choice: avec
  rationale: Préserve simplement l’idée qu’Abraham et ceux qui ont la foi partagent la même bénédiction.
- source_word: τῷ πιστῷ Ἀβραάμ
  choice: Abraham, l’homme de foi
  rationale: Formulation française naturelle qui met en valeur, dans le contexte immédiat, Abraham comme croyant, tout en signalant en note l’autre nuance possible de πιστός.
theological_decisions:
- issue: Sens de πιστός appliqué à Abraham dans un passage centré sur la foi
  choice: Abraham, l’homme de foi
  alternative: Abraham le fidèle
  rationale: πιστός peut qualifier celui qui croit ou celui qui est fidèle. Le contexte de Galates 3 met particulièrement en avant la foi d’Abraham, mais la note conserve la nuance de fidélité afin de ne pas effacer l’ambiguïté lexicale.
translation_notes:
  register: Français international moderne, clair et digne. « Ceux qui ont la foi » évite le calque peu naturel « ceux qui sont de la foi », tandis que « l’homme de foi » maintient le lien lexical et argumentatif avec la foi d’Abraham.
