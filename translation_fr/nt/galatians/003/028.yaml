reference: Galatians 3:28
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὐκ ἔνι Ἰουδαῖος οὐδὲ Ἕλλην, οὐκ ἔνι δοῦλος οὐδὲ ἐλεύθερος, οὐκ ἔνι ἄρσεν καὶ θῆλυ· ⸀πάντες γὰρ ὑμεῖς εἷς ἐστε ἐν Χριστῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/028.yaml
  text: There is no Jew or Greek[a], there is no servant or free, there is no male and female[b]; for you are all one in Messiah Jesus.
translation:
  language: fr
  text: Il n’y a ni Juif ni Grec, il n’y a ni esclave ni homme libre, il n’y a ni mâle ni femelle[a] ; car vous êtes tous un dans Jésus le Messie[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec emploie ici « mâle et femelle », avec « et », contrairement aux deux premières paires ; cela fait probablement écho à Genèse 1.27.
    reason: Préserver la différence syntaxique du grec et l’allusion scripturaire probable sans produire une phrase française obscure.
  - marker: b
    text: 'Grec : « dans le Christ Jésus » ; « Jésus le Messie » rend le même titre dans un ordre plus naturel en français.'
    reason: Signaler le rendu de Χριστός comme titre et l’écart d’ordre idiomatique entre le grec et le français.
lexical_decisions:
- source_word: οὐκ ἔνι
  choice: il n’y a ni
  rationale: Cette tournure française naturelle rend la négation existentielle répétée et, avec les termes coordonnés, conserve le rythme insistant de Paul.
- source_word: Ἰουδαῖος
  choice: Juif
  rationale: Dans l’opposition avec Ἕλλην, le sens ethnoreligieux est premier ; « Juif » est la désignation française établie.
- source_word: Ἕλλην
  choice: Grec
  rationale: Le texte porte précisément « Grec », et non le terme plus général « non-Juif » ; le choix conserve la paire concrète employée par Paul.
- source_word: δοῦλος
  choice: esclave
  rationale: Face à ἐλεύθερος, le statut de personne asservie est déterminant ; « esclave » est plus exact que « serviteur ».
- source_word: ἐλεύθερος
  choice: homme libre
  rationale: Dans ce contraste de statut social, « homme libre » est une expression française claire et évite l’ambiguïté adjectivale d’un simple « libre » substantivé.
- source_word: ἄρσεν
  choice: mâle
  rationale: Le mot désigne le sexe plutôt que l’homme adulte ; « mâle » préserve aussi l’écho probable de Genèse 1.27.
- source_word: θῆλυ
  choice: femelle
  rationale: Associé à ἄρσεν, le terme appelle « femelle », qui maintient la précision lexicale et l’écho probable du récit de création.
- source_word: καὶ
  choice: ni… ni dans la syntaxe principale, avec mention littérale en note
  rationale: Une reproduction mécanique par « et » après une négation serait peu naturelle et potentiellement trompeuse en français. La note conserve toutefois la différence formelle avec οὐδὲ et l’allusion probable à Genèse 1.27.
- source_word: πάντες… ὑμεῖς
  choice: vous êtes tous
  rationale: Cette formulation garde à la fois le pronom de deuxième personne et l’accent collectif.
- source_word: εἷς
  choice: un
  rationale: Le singulier prédicatif affirme l’unité collective sans préciser « une seule personne » ni paraphraser par « unis ».
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: dans le Messie Jésus
  rationale: « Messie » rend Χριστός comme titre, tandis que « dans » conserve la formulation relationnelle concise de ἐν.
theological_decisions:
- issue: Rendu de ἄρσεν καὶ θῆλυ après la négation
  choice: ni mâle ni femelle, avec note sur le grec « mâle et femelle »
  alternative: il n’y a pas mâle et femelle
  rationale: Le corps du texte reste naturel et intelligible en français, tandis que la note préserve le changement de conjonction grecque et l’écho vraisemblable à Genèse 1.27, sans les effacer.
- issue: Portée de εἷς ἐστε
  choice: vous êtes tous un
  alternative: vous formez tous une seule personne / vous êtes tous unis
  rationale: La traduction conserve l’affirmation forte mais concise de l’unité, sans conclure que toute distinction créée ou sociale serait abolie dans tous les sens.
- issue: Valeur de Χριστός
  choice: Messie
  alternative: Christ
  rationale: Le terme est traité ici comme un titre messianique appliqué à Jésus, tout en signalant en note la traduction française traditionnelle.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition « il n’y a ni » maintient la cadence rhétorique. « Mâle » et « femelle » sont volontairement retenus pour leur précision et pour l’écho à Genèse, avec une note qui expose la forme grecque inhabituelle. Les marqueurs [a] et [b] figurent dans le texte.
