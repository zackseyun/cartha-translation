  text: οὕτως ἀνόητοί ἐστε; ἐναρξάμενοι πνεύματι νῦν σαρκὶ ἐπιτελεῖσθε;
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/003.yaml
  text: Are you so foolish? Having begun by the Spirit[c][b][a], are you now being perfected by the flesh?
translation:
  language: fr
  text: Êtes-vous à ce point insensés ? Après avoir commencé par l’Esprit[a], allez-vous maintenant parvenir à l’accomplissement[c] par la chair[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « dans l’Esprit ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou, selon le sens donné ici à « chair » : « par des moyens humains » ; peut-être aussi : « par la nature pécheresse ».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « êtes-vous maintenant achevés » ; autre traduction possible : « êtes-vous maintenant rendus parfaits ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: à ce point
  rationale: Dans cette question de reproche, l’expression indique surtout le degré et se rend naturellement ainsi en français.
- source_word: ἀνόητοί
  choice: insensés
  rationale: Le terme dénonce un manque de compréhension et de discernement, sans employer une insulte familière ou inutilement forte.
- source_word: ἐναρξάμενοι
  choice: après avoir commencé
  rationale: Cette tournure restitue l’antériorité du participe aoriste par rapport à l’action présente évoquée ensuite.
- source_word: πνεύματι
  choice: par l’Esprit
  rationale: Le datif est probablement instrumental et renvoie, dans le contexte immédiat de Galates 3, à l’Esprit Saint. La préposition « par » maintient le parallèle avec « par la chair ».
- source_word: νῦν
  choice: maintenant
  rationale: Ce choix conserve avec concision le contraste temporel entre le commencement et la situation présente.
- source_word: σαρκὶ
  choice: par la chair
  rationale: « Chair » préserve le vocabulaire paulinien et sa portée complexe, sans le réduire d’emblée à l’effort humain ou à la nature pécheresse.
- source_word: ἐπιτελεῖσθε
  choice: êtes-vous menés à l’accomplissement
  rationale: Cette formulation rend la valeur passive possible du présent et l’idée de conduire jusqu’au terme. Elle évite que « rendus parfaits » soit compris uniquement comme une perfection morale.
theological_decisions:
- issue: Référent de πνεύματι
  choice: l’Esprit Saint
  alternative: l’esprit humain ou un principe spirituel
  rationale: Le contexte immédiat parle de l’Esprit reçu par la foi et de son action parmi les Galates ; la majuscule est donc justifiée.
- issue: Sens de σάρξ en contraste avec l’Esprit
  choice: la chair
  alternative: l’effort humain ou la nature pécheresse
  rationale: Le terme paulinien peut associer faiblesse humaine, moyens purement humains et orientation opposée à l’Esprit. Le conserver dans le texte principal maintient cette tension.
- issue: Voix et portée de ἐπιτελεῖσθε
  choice: processus passif menant à l’accomplissement
  alternative: achever ou mener soi-même à son terme
  rationale: La forme grecque peut être comprise comme moyenne ou passive. Le texte principal adopte une lecture passive naturelle tout en signalant l’autre possibilité en note.
translation_notes:
  register: Français international moderne, direct et digne. « À ce point insensés » conserve la vigueur de la réprimande sans tomber dans un registre familier. Le parallélisme « par l’Esprit / par la chair » est maintenu, tandis que « menés à l’accomplissement » exprime clairement l’idée d’achèvement.
