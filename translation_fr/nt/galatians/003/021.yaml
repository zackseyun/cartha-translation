id: GAL.3.21
reference: Galatians 3:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ὁ οὖν νόμος κατὰ τῶν ἐπαγγελιῶν τοῦ θεοῦ; μὴ γένοιτο· εἰ γὰρ ἐδόθη νόμος ὁ δυνάμενος ζῳοποιῆσαι, ὄντως ⸂ἐκ νόμου ἂν⸃ ἦν ἡ δικαιοσύνη.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/021.yaml
  text: Is the law then against the promises of God? May it never be! For if a law had been given that was able to give life[a], then righteousness really would have been from the law.
translation:
  language: fr
  text: La loi est-elle donc contraire aux promesses de Dieu ? Certainement pas ! Car si une loi capable de donner la vie avait été donnée, alors la justice[a] serait réellement issue de la loi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la qualité d’être juste ».
    reason: Alternative lexicale pour δικαιοσύνη, dont le champ sémantique peut inclure la justice et le fait d’être juste.
lexical_decisions:
- source_word: νόμος
  choice: loi
  rationale: Le premier emploi défini renvoie à la loi déjà discutée, tandis que le second, indéfini, présente hypothétiquement toute loi qui aurait la capacité de donner la vie. Le dernier emploi conserve la formulation générale « de la loi ».
- source_word: κατὰ
  choice: contraire à
  rationale: Avec le génitif, κατά exprime ici l’opposition. « Contraire aux promesses » est naturel en français et convient à la question rhétorique.
- source_word: ἐπαγγελιῶν
  choice: promesses
  rationale: Le pluriel explicite du grec est conservé et renvoie aux promesses divines évoquées dans le contexte.
- source_word: μὴ γένοιτο
  choice: Certainement pas !
  rationale: Cette formule rend avec force et naturel le rejet catégorique exprimé par l’idiome grec.
- source_word: ἐδόθη
  choice: avait été donnée
  rationale: Le plus-que-parfait passif s’intègre naturellement à la condition irréelle en français.
- source_word: δυνάμενος ζῳοποιῆσαι
  choice: capable de donner la vie
  rationale: Cette formulation exprime clairement la capacité attribuée hypothétiquement à une loi et conserve le sens vivifiant de ζῳοποιέω.
- source_word: ὄντως
  choice: réellement
  rationale: L’adverbe maintient l’insistance du raisonnement grec sans alourdir la phrase.
- source_word: ἐκ νόμου
  choice: de la loi
  rationale: « De la loi » préserve l’idée de source portée par ἐκ et demeure idiomatique en français.
- source_word: δικαιοσύνη
  choice: justice
  rationale: « Justice » est l’équivalent français usuel qui peut désigner ici la justice ou la qualité d’être juste. Une autre explicitation possible est signalée en note afin de préserver l’étendue sémantique du terme.
theological_decisions:
- issue: Sens de δικαιοσύνη dans l’argument paulinien
  choice: justice
  alternative: qualité d’être juste
  rationale: Le texte affirme que la justice ne tire pas sa source de la loi. La traduction « justice » conserve la densité du terme grec sans décider à elle seule entre conduite juste, état de juste et verdict favorable.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe conditionnelle reste naturelle, et la distinction entre « la loi » et « une loi » préserve le mouvement de l’argument grec.
