  text: τοσαῦτα ἐπάθετε εἰκῇ; εἴ γε καὶ εἰκῇ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/004.yaml
  text: Did you suffer so many things in vain?—if indeed it really was in vain[a].
translation:
  language: fr
  text: Avez-vous tant souffert pour rien ? Si toutefois cela a vraiment été pour rien[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Avez-vous fait l’expérience de tant de choses pour rien ? »'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοσαῦτα
  choice: tant
  rationale: Le neutre pluriel désigne globalement tout ce que les Galates ont traversé. « Tant » est naturel en français et conserve l’idée d’ampleur sans explicitation superflue.
- source_word: ἐπάθετε
  choice: avez-vous souffert
  rationale: πάσχω peut signifier « souffrir » ou, plus largement, « faire l’expérience de ». Dans ce contexte, « souffrir » rend vraisemblablement la force du verbe, tandis que le sens plus large est signalé en note.
- source_word: εἰκῇ
  choice: pour rien
  rationale: Cette expression française courante exprime ici l’absence de résultat ou de but, avec une force rhétorique naturelle.
- source_word: εἴ γε
  choice: si toutefois
  rationale: La tournure maintient la réserve introduite par la particule conditionnelle et laisse entendre que Paul ne tient pas cette issue pour acquise.
- source_word: καὶ
  choice: vraiment
  rationale: Dans la reprise « καὶ εἰκῇ », καὶ renforce la qualification. « Vraiment » transmet cette insistance de manière idiomatique.
- source_word: εἰκῇ
  choice: pour rien
  rationale: La répétition est conservée afin de reproduire l’effet rhétorique du grec.
theological_decisions: []
translation_notes:
  register: Français moderne, direct et digne. La question rhétorique et sa qualification prudente sont conservées. « Pour rien » est préféré à « en vain » pour une formulation plus courante, sans perte notable de sens.
