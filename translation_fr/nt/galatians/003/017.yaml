id: GAL.3.17
reference: Galatians 3:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τοῦτο δὲ λέγω· διαθήκην προκεκυρωμένην ὑπὸ τοῦ ⸀θεοῦ ὁ μετὰ ⸂τετρακόσια καὶ τριάκοντα ἔτη⸃ γεγονὼς νόμος οὐκ ἀκυροῖ, εἰς τὸ καταργῆσαι τὴν ἐπαγγελίαν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/017.yaml
  text: 'This is what I mean: the law[a], which came four hundred and thirty years later, does not invalidate a covenant previously ratified by God[b], so as to abolish the promise.'
translation:
  language: fr
  text: 'Voici ce que je veux dire : la Loi, venue quatre cent trente ans plus tard, n’annule pas[a] une alliance que Dieu avait ratifiée auparavant, de manière à annuler la promesse[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ne rend pas invalide » ou « ne révoque pas ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « rendre la promesse sans effet » ou « la mettre de côté ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο δὲ λέγω
  choice: Voici ce que je veux dire
  rationale: Formulation française naturelle qui introduit l’explication de Paul sans ajouter un marqueur temporel absent du grec.
- source_word: διαθήκην
  choice: une alliance
  rationale: Dans ce contexte, le terme désigne l’alliance liée à la promesse faite par Dieu à Abraham, plutôt qu’un testament au sens moderne.
- source_word: προκεκυρωμένην
  choice: avait ratifiée auparavant
  rationale: Le plus-que-parfait et l’adverbe expriment l’établissement antérieur et durable de l’alliance porté par le participe parfait préfixé.
- source_word: ὑπὸ τοῦ θεοῦ
  choice: que Dieu avait ratifiée
  rationale: La tournure active est plus naturelle en français et conserve clairement Dieu comme agent de la ratification.
- source_word: ὁ ... γεγονὼς νόμος
  choice: la Loi, venue
  rationale: « Venue » exprime sobrement l’apparition ultérieure de la Loi dans l’histoire, sans surcharger le français.
- source_word: μετὰ τετρακόσια καὶ τριάκοντα ἔτη
  choice: quatre cent trente ans plus tard
  rationale: Rend clairement l’intervalle chronologique et le contraste temporel de l’argument.
- source_word: οὐκ ἀκυροῖ
  choice: n’annule pas
  rationale: « Annuler » restitue la portée juridique du verbe tout en restant courant et immédiatement compréhensible.
- source_word: εἰς τὸ καταργῆσαι
  choice: au point de rendre ... sans effet
  rationale: Cette formulation préserve la nuance de résultat ou de conséquence sans trancher excessivement entre but et résultat.
- source_word: τὴν ἐπαγγελίαν
  choice: la promesse
  rationale: Terme précis et cohérent avec l’argument de Paul concernant la promesse faite à Abraham.
theological_decisions:
- issue: Sens de διαθήκη dans l’argument de Paul
  choice: alliance
  alternative: testament, disposition juridique
  rationale: Le contexte porte sur l’engagement et la promesse de Dieu envers Abraham; « alliance » conserve ce cadre biblique sans imposer une lecture testamentaire.
- issue: Rapport exprimé par εἰς τὸ καταργῆσαι
  choice: 'conséquence : « au point de rendre la promesse sans effet »'
  alternative: 'but : « afin d’abolir la promesse »'
  rationale: La construction peut évoquer le but ou le résultat. Dans la phrase négative, « au point de » garde cette tension et exprime naturellement que la Loi ne saurait produire l’annulation de la promesse.
translation_notes:
  register: Français international moderne, digne et accessible. La majuscule à « Loi » signale ici la Loi donnée ultérieurement dans l’histoire biblique. La syntaxe conserve la priorité chronologique de l’alliance et la force juridique du raisonnement.
