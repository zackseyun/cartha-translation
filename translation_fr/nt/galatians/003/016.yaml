review_pass:
  verdict: revise
  source_fidelity: Le texte rend fidèlement les promesses, le contraste indispensable entre le pluriel et le singulier de σπέρμα, ainsi que l’identification finale au Messie. Toutefois, « mais comme d’une seule » fait porter le contraste sur le nom féminin « descendance » et risque de présenter une seule descendance plutôt que l’un visé par l’argument grec (ἐφ’ ἑνός).
  naturalness: Le français est globalement clair et de registre approprié. « Descendances » est volontairement inhabituel, mais il est justifié par l’argument grammatical de Paul et expliqué en note. La reformulation proposée rend plus naturellement l’opposition « plusieurs / un seul ».
  terminology: « Descendance » maintient utilement le singulier collectif de σπέρμα; « semence » est correctement proposé comme alternative. « Le Messie » rend Χριστός comme titre de manière naturelle et non confessionnellement surinterprétée.
