  to: 'Les promesses ont été faites à Abraham et à sa descendance[a]. Il n’est pas dit : « Et à tes descendances[b] », comme s’il s’agissait de plusieurs, mais d’un seul : « Et à ta descendance », qui est le Messie[c].'
  rationale: La seule révision nécessaire remplace « comme d’une seule » par « mais d’un seul ». Elle rend correctement le masculin singulier grec et évite d’assimiler indûment le référent à une « descendance » féminine, tout en conservant le contraste rhétorique et la progression du texte.
