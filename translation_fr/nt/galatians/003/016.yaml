id: GAL.3.16
reference: Galatians 3:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τῷ δὲ Ἀβραὰμ ἐρρέθησαν αἱ ἐπαγγελίαι καὶ τῷ σπέρματι αὐτοῦ· οὐ λέγει· Καὶ τοῖς σπέρμασιν, ὡς ἐπὶ πολλῶν, ἀλλ’ ὡς ἐφ’ ἑνός· Καὶ τῷ σπέρματί σου, ὅς ἐστιν Χριστός.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/016.yaml
  text: The promises were spoken to Abraham and to his offspring[a]. It does not say, “And to offsprings,” as referring to many, but as referring to one[c][b], “And to your offspring,” who is Messiah.
translation:
  language: fr
  text: 'Les promesses ont été faites à Abraham et à sa descendance[a]. Il n’est pas dit : « Et à tes descendances[b] », comme s’il s’agissait de plusieurs, mais d’un seul : « Et à ta descendance », qui est le Messie[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « semence » dans tout ce verset ; le grec emploie un nom collectif singulier qui est au cœur de l’argument de Paul.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « Et aux semences » ; Paul souligne ici la forme plurielle, par contraste avec le singulier.
    reason: lexical_alternative
  - marker: c
    text: Ou « le Christ ».
    reason: alternative_reading
lexical_decisions:
- source_word: ἐρρέθησαν
  choice: ont été faites
  rationale: En français, une promesse est naturellement « faite » à quelqu’un. Cette tournure rend idiomatiquement le passif de λέγω tout en préparant la formule « Il n’est pas dit » qui suit.
- source_word: ἐπαγγελίαι
  choice: les promesses
  rationale: « Promesses » est le sens paulinien courant et rend directement le pluriel grec.
- source_word: σπέρμα / σπέρματι
  choice: descendance
  rationale: « Descendance » est un nom collectif singulier naturel en français et maintient la forme grammaticale sur laquelle repose l’argument de Paul. Une note signale l’équivalent plus littéral « semence ».
- source_word: τοῖς σπέρμασιν
  choice: descendances
  rationale: Le pluriel inhabituel est conservé, malgré sa légère étrangeté en français, car Paul oppose expressément le pluriel au singulier.
- source_word: ὡς ἐπὶ πολλῶν
  choice: comme s’il s’agissait de plusieurs
  rationale: Cette formulation exprime clairement et naturellement la portée explicative de la locution grecque.
- source_word: ἀλλ’ ὡς ἐφ’ ἑνός
  choice: mais comme d’une seule
  rationale: Le féminin renvoie à « descendance » et préserve l’accent mis sur l’unité sans préciser davantage que le texte grec.
- source_word: Χριστός
  choice: le Messie
  rationale: Dans cette identification christologique, Χριστός garde sa valeur de titre; « le Messie » en rend le sens explicitement en français moderne.
theological_decisions:
- issue: Portée de l’argument fondé sur le singulier collectif σπέρμα
  choice: Conserver « descendance » au singulier et le pluriel délibérément inhabituel « descendances »
  alternative: Employer « descendant » et « descendants »
  rationale: Le texte raisonne sur la forme singulière du mot cité, tout en employant un nom qui peut avoir une valeur collective. « Descendance » maintient cette tension, tandis que « descendant » individualiserait plus tôt le terme et résoudrait implicitement l’ambiguïté.
- issue: Traduction de Χριστός dans la formule d’identification
  choice: le Messie
  alternative: le Christ
  rationale: 'La valeur titulaire est active ici : Paul identifie la descendance promise à l’Oint attendu. « Le Messie » rend cette fonction sans ajouter de précision doctrinale.'
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve l’étrangeté nécessaire du pluriel « descendances », puisque l’argument du verset dépend précisément du contraste grammatical entre pluriel et singulier.
