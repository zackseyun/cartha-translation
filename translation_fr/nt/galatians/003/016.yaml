    issue: Accord féminin dans « mais comme d’une seule »
    rationale: 'Le grec dit ἐφ’ ἑνός, « au sujet d’un seul ». L’accord féminin français renvoie nécessairement à « descendance » et peut donc brouiller le mouvement de l’argument, qui conduit ensuite à l’identification personnelle : « qui est le Messie ». « Au sujet d’un seul » préserve la formulation explicative et l’ambiguïté grammaticale jusqu’à cette identification.'
