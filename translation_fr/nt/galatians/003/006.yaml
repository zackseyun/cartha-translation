source:
  edition: SBLGNT
  text: καθὼς Ἀβραὰμ ἐπίστευσεν τῷ θεῷ, καὶ ἐλογίσθη αὐτῷ εἰς δικαιοσύνην.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/006.yaml
  text: Just as Abraham believed God[a], and it was counted to him as righteousness,
translation:
  language: fr
  text: De même qu’Abraham crut Dieu, et cela lui fut compté comme justice,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθὼς
  choice: Ainsi
  rationale: Introduit naturellement en français l’exemple scripturaire qui vient appuyer l’argument de Paul, tout en conservant le lien comparatif avec ce qui précède.
- source_word: Ἀβραὰμ
  choice: Abraham
  rationale: Forme française usuelle du nom biblique.
- source_word: ἐπίστευσεν
  choice: crut
  rationale: Rend directement l’aoriste de πιστεύω et respecte la formulation traditionnelle de la citation de Genèse 15.6 sans ajouter une nuance interprétative.
- source_word: τῷ θεῷ
  choice: Dieu
  rationale: Avec croire, le complément direct « crut Dieu » traduit le datif grec en soulignant qu’Abraham a tenu la parole de Dieu pour vraie, plutôt que le sens plus général de « crut en Dieu ».
- source_word: ἐλογίσθη
  choice: fut compté
  rationale: Le passif de λογίζομαι conserve l’idée d’imputation ou de mise au compte, dans une formulation française concise et compréhensible.
- source_word: αὐτῷ
  choice: lui
  rationale: Rend le datif désignant Abraham comme celui au compte de qui la chose est portée.
- source_word: εἰς δικαιοσύνην
  choice: comme justice
  rationale: « Comme justice » exprime le statut ou la valeur attribuée. En français biblique moderne, « justice » couvre naturellement δικαιοσύνη sans imposer une paraphrase doctrinale.
theological_decisions:
- issue: Sens de δικαιοσύνη dans la citation paulinienne
  choice: justice
  alternative: justification; fait d’être juste
  rationale: « Justice » est l’équivalent français normal de δικαιοσύνη et maintient ouvertes ses dimensions relationnelle, judiciaire et morale. La note signale des formulations possibles sans réduire le terme à une seule théorie.
- issue: Référent implicite du sujet de ἐλογίσθη
  choice: cela
  alternative: sa foi
  rationale: Le grec emploie un sujet implicite sans nommer explicitement « la foi ». « Cela » préserve cette formulation et évite d’expliciter davantage que le texte source.
translation_notes:
  register: Français international moderne, digne et accessible. « Crut Dieu » est volontairement conservé plutôt que « crut en Dieu » afin de rendre précisément la construction grecque. La virgule finale marque la continuité syntaxique avec le verset suivant.
