  source_fidelity: '« Ainsi » affaiblit la valeur comparative de καθὼς, qui introduit explicitement un parallèle avec l’argument précédent. « De même que » la restitue plus précisément. Le reste suit bien le grec : « crut Dieu » rend πιστεύω avec le datif sans lui substituer « crut en Dieu » ; « cela » conserve le référent non exprimé de ἐλογίσθη ; et « fut compté comme justice » reflète correctement le passif et εἰς δικαιοσύνην.'
  naturalness: La formulation révisée est naturelle dans un registre biblique moderne et soutenu. « Crut Dieu » est moins courant dans la conversation contemporaine, mais demeure clair et est ici préférable à une reformulation qui changerait la construction et la nuance. La virgule finale est maintenue, car la phrase se poursuit syntaxiquement au verset suivant.
