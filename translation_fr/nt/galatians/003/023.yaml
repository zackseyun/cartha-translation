id: GAL.3.23
reference: Galatians 3:23
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Πρὸ τοῦ δὲ ἐλθεῖν τὴν πίστιν ὑπὸ νόμον ἐφρουρούμεθα ⸀συγκλειόμενοι εἰς τὴν μέλλουσαν πίστιν ἀποκαλυφθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/023.yaml
  text: But before faith came[a], we were being guarded under the law[d][c][b], confined until the faith that was about to be revealed.
translation:
  language: fr
  text: Mais avant que la foi vienne[a], nous étions gardés sous la Loi[b], tenus enfermés[c] jusqu’à la révélation de la foi qui devait être révélée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avant que cette foi vienne » ; l’article grec peut désigner l’époque de la foi inaugurée avec le Christ.
    reason: alternative_reading
  - marker: b
    text: Ou « sous la loi » ; ici, le contexte renvoie à la Loi de Moïse.
    reason: referent_clarification
  - marker: c
    text: Ou « détenus » ou « emprisonnés ».
    reason: lexical_alternative
lexical_decisions:
- source_word: Πρὸ τοῦ δὲ ἐλθεῖν
  choice: Mais avant que … vienne
  rationale: La construction πρό avec l’infinitif articulé exprime naturellement l’antériorité. Le présent du subjonctif après « avant que » est idiomatique en français et ne change pas la référence passée donnée par le contexte.
- source_word: τὴν πίστιν
  choice: la foi
  rationale: L’article grec est conservé, car il peut désigner la foi comme réalité apparue dans l’histoire du salut, sans exclure l’acte de croire.
- source_word: ὑπὸ νόμον
  choice: sous la Loi
  rationale: Cette formulation rend l’idée d’être sous l’autorité ou le régime de la Loi mosaïque. La majuscule précise le référent contextuel sans ajouter « de Moïse » au texte.
- source_word: ἐφρουρούμεθα
  choice: nous étions gardés
  rationale: L’imparfait passif grec décrit une situation continue dans le passé. « Gardés » préserve une possible nuance protectrice autant que carcérale.
- source_word: συγκλειόμενοι
  choice: tenus enfermés
  rationale: Le participe exprime l’enfermement ou la clôture. « Tenus enfermés » rend à la fois son caractère passif et sa force restrictive.
- source_word: εἰς
  choice: jusqu’à
  rationale: Dans ce contexte, εἰς oriente la période de garde vers le moment où la foi devait être révélée; « jusqu’à » exprime clairement cette limite temporelle sans nier la nuance de visée.
- source_word: τὴν μέλλουσαν πίστιν ἀποκαλυφθῆναι
  choice: la révélation de la foi qui devait venir
  rationale: Cette formulation rattache correctement μέλλουσαν à πίστιν tout en faisant de la révélation l’événement attendu. Elle évite l’ambiguïté française selon laquelle « qui devait être révélée » pourrait modifier la foi sans bien rendre sa venue imminente.
theological_decisions:
- issue: 'Sens de πίστις : acte de croire ou réalité historique inaugurée avec le Christ'
  choice: « la foi », avec maintien de l’article
  alternative: « foi » sans article, « la fidélité » ou « le régime de la foi »
  rationale: Le contexte de Galates 3 oppose deux périodes de l’histoire du salut, mais le mot peut encore évoquer la foi vécue. « La foi » conserve cette tension sans imposer une paraphrase doctrinale.
- issue: Fonction de la Loi avant la révélation de la foi
  choice: Associer « gardés » et « tenus enfermés »
  alternative: « détenus » ou « emprisonnés »
  rationale: Le grec juxtapose une garde susceptible d’une nuance protectrice et un enfermement nettement restrictif. La traduction conserve les deux aspects au lieu de réduire la Loi à un rôle exclusivement protecteur ou punitif.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la métaphore de la garde et celle de l’enfermement, ainsi que la répétition de « la foi ». L’ordre final a été légèrement restructuré pour éviter une relative française lourde ou ambiguë.
