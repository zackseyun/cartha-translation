  source_fidelity: 'La structure principale est bien rendue : l’antériorité, l’imparfait passif de garde, l’enfermement et la limite orientée vers la foi sont conservés. Toutefois, « la foi qui devait venir » déplace légèrement l’accent de μέλλουσαν πίστιν ἀποκαλυφθῆναι : le grec qualifie la foi comme devant être révélée, non simplement comme devant venir. Une formulation explicite de la révélation est préférable.'
  naturalness: Le français est clair, moderne et d’un registre approprié. « Nous étions gardés » et « tenus enfermés » rendent naturellement les deux images grecques. La révision proposée garde cette fluidité tout en clarifiant le rapport syntaxique final.
