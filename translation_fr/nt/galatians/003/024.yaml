  terminology: « Messie » respecte la valeur titulaires de Χριστός. « La loi », « justifiés » et « la foi » sont cohérents avec le vocabulaire paulinien traditionnel sans imposer d’interprétation confessionnelle. Les deux notes ont des ancres correctes et correspondent aux ambiguïtés lexicales et syntaxiques pertinentes.
