  source_fidelity: 'Le texte rend correctement la structure grecque : « Ainsi donc » exprime l’inférence de ὥστε, « la loi » correspond à ὁ νόμος, et « est devenue » conserve de manière idiomatique la valeur résultative du parfait γέγονεν. « Notre gardien » rend de façon défendable παιδαγωγός sans lui attribuer anachroniquement un rôle d’enseignant. « Jusqu’au Messie » reflète le sens contextuel de terme/objectif donné à εἰς Χριστόν, tandis que la note préserve utilement la nuance directionnelle. « Afin que nous soyons justifiés par la foi » rend fidèlement ἵνα, le subjonctif passif δικαιωθῶμεν et ἐκ πίστεως.'
