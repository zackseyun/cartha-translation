id: GAL.3.24
reference: Galatians 3:24
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὥστε ὁ νόμος παιδαγωγὸς ἡμῶν γέγονεν εἰς Χριστόν, ἵνα ἐκ πίστεως δικαιωθῶμεν·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/024.yaml
  text: So then[a], the law has become our guardian until Messiah[b], so that we might be justified by faith.
translation:
  language: fr
  text: Ainsi donc, la loi est devenue notre gardien[a] jusqu’au Messie[b], afin que nous soyons justifiés par la foi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « surveillant ». Dans le monde gréco-romain, le παιδαγωγός était chargé de surveiller et d’encadrer un enfant; il n’était pas principalement un enseignant.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « vers le Messie »; l’expression peut aussi se comprendre au sens de « pour nous conduire au Messie ».
    reason: alternative_reading
lexical_decisions:
- source_word: ὥστε
  choice: Ainsi donc
  rationale: Dans ce contexte, ὥστε introduit la conclusion tirée de l’argument précédent. « Ainsi donc » exprime naturellement cette valeur déductive.
- source_word: ὁ νόμος
  choice: la loi
  rationale: L’expression désigne ici la loi mosaïque comme réalité bien identifiée dans l’argument de Galates.
- source_word: παιδαγωγὸς
  choice: gardien
  rationale: Le παιδαγωγός du monde gréco-romain était principalement chargé de surveiller et d’encadrer un enfant; il n’était pas d’abord un enseignant. « Gardien » évite le sens scolaire que « pédagogue » a pris en français moderne.
- source_word: ἡμῶν
  choice: notre
  rationale: Le génitif exprime le rapport du gardien avec le groupe auquel Paul s’identifie.
- source_word: γέγονεν
  choice: est devenue
  rationale: Le parfait présente un état résultant; « est devenue » en conserve la valeur tout en s’accordant avec le nom féminin « loi ».
- source_word: εἰς Χριστόν
  choice: jusqu’au Messie
  rationale: Dans le contexte immédiat, εἰς présente le Messie comme le terme ou l’aboutissement de la fonction temporaire de la loi. La note conserve la portée directionnelle de l’expression grecque.
- source_word: Χριστόν
  choice: Messie
  rationale: Χριστός garde ici sa valeur de titre; « Messie » la rend directement en français.
- source_word: ἵνα
  choice: afin que
  rationale: ἵνα introduit le but. « Afin que » est clair, naturel et d’un registre digne.
- source_word: ἐκ πίστεως
  choice: par la foi
  rationale: La préposition ἐκ exprime ici le fondement ou le moyen; « par la foi » est la formulation française naturelle dans ce contexte paulinien.
- source_word: δικαιωθῶμεν
  choice: nous soyons justifiés
  rationale: Cette formulation rend l’aoriste passif subjonctif et conserve le vocabulaire judiciaire de Paul sans développer l’expression en paraphrase interprétative.
theological_decisions:
- issue: Portée de εἰς Χριστόν dans la fonction de la loi
  choice: jusqu’au Messie
  alternative: vers le Messie; pour nous conduire au Messie
  rationale: Le contexte souligne la fonction temporaire de la loi avant la venue de la foi, tandis que εἰς peut aussi évoquer une direction ou un but. Le texte principal exprime le terme temporel et téléologique; la note préserve l’autre nuance sans réduire la loi au simple rôle d’enseignante.
- issue: Sens judiciaire de δικαιόω
  choice: être justifiés
  alternative: être déclarés justes; être reconnus justes
  rationale: « Être justifiés » conserve le terme théologique traditionnel tout en respectant la forme passive et la dimension judiciaire du verbe grec, sans préciser au-delà du texte la manière exacte dont cette déclaration doit être comprise.
translation_notes:
  register: Français international moderne, clair et digne. « Gardien » est préféré à « pédagogue », devenu principalement scolaire en français. La syntaxe reste proche du raisonnement grec tout en étant naturelle en français.
