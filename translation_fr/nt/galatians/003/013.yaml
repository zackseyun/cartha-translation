id: GAL.3.13
reference: Galatians 3:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Χριστὸς ἡμᾶς ἐξηγόρασεν ἐκ τῆς κατάρας τοῦ νόμου γενόμενος ὑπὲρ ἡμῶν κατάρα, ⸂ὅτι γέγραπται⸃· Ἐπικατάρατος πᾶς ὁ κρεμάμενος ἐπὶ ξύλου,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/013.yaml
  text: 'The Messiah redeemed us from the curse of the law by becoming a curse for us[d][c][b][a], because it is written: “Cursed is everyone who hangs on a tree.”'
translation:
  language: fr
  text: 'Le Christ nous a rachetés de la malédiction de la loi en devenant malédiction pour nous[a], car il est écrit : « Maudit est quiconque est pendu à un arbre[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Pour nous » peut aussi avoir le sens de « en notre faveur » et, dans ce contexte, éventuellement de « à notre place ».
    reason: lexical_alternative
  - marker: b
    text: Le mot grec peut désigner un arbre, du bois ou un objet en bois; « arbre » conserve ici la formulation de la citation scripturaire.
    reason: lexical_alternative
lexical_decisions:
- source_word: Χριστός
  choice: le Christ
  rationale: « Christ » est en français le titre traditionnel et courant correspondant au grec Χριστός; il conserve ici sa portée titulaire sans imposer une reformulation explicative.
- source_word: ἐξηγόρασεν
  choice: a rachetés
  rationale: Le verbe évoque l’acquisition qui libère; « racheter » en conserve à la fois l’arrière-plan commercial et la portée salvatrice dans un français naturel.
- source_word: κατάρας / κατάρα
  choice: malédiction
  rationale: La répétition du même nom français reproduit le lien rhétorique saisissant entre la malédiction de la loi et le fait que le Christ devient lui-même malédiction.
- source_word: νόμου
  choice: de la loi
  rationale: Cette traduction directe laisse le contexte identifier la loi en question sans ajouter une majuscule interprétative absente du grec.
- source_word: γενόμενος
  choice: en devenant
  rationale: La tournure exprime naturellement le moyen associé au participe grec, sans transformer celui-ci en proposition temporelle.
- source_word: ὑπὲρ ἡμῶν
  choice: pour nous
  rationale: '« Pour nous » garde l’étendue sémantique de ὑπέρ: bénéfice et représentation, avec une possible nuance substitutive que la traduction principale ne tranche pas.'
- source_word: ὅτι γέγραπται
  choice: car il est écrit
  rationale: « Car » introduit naturellement la citation comme fondement explicatif de l’affirmation précédente.
- source_word: Ἐπικατάρατος
  choice: Maudit
  rationale: Équivalent français direct et vigoureux, adapté au style d’une citation scripturaire.
- source_word: κρεμάμενος
  choice: est pendu
  rationale: Le passif français convient au supplice évoqué et rend naturellement le participe grec substantivé dans la formule générale.
- source_word: ξύλου
  choice: un arbre
  rationale: ξύλον peut désigner le bois ou un objet en bois, mais « arbre » maintient clairement l’écho de la citation de Deutéronome et son image concrète.
theological_decisions:
- issue: Portée de ὑπὲρ ἡμῶν dans le langage de l’expiation
  choice: pour nous
  alternative: en notre faveur; à notre place
  rationale: Le grec affirme sans ambiguïté que l’acte du Christ concerne et bénéficie aux croyants, mais ὑπέρ ne commande pas à lui seul une formulation exclusivement substitutive. Le texte principal conserve cette amplitude, et la note signale les nuances possibles.
- issue: Force de γενόμενος κατάρα
  choice: en devenant malédiction
  alternative: en devenant maudit
  rationale: Le grec emploie le nom κατάρα, et non un simple adjectif. Garder « malédiction » préserve la formulation volontairement forte de Paul sans expliquer à la place du texte comment elle doit être systématisée.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la répétition abrupte de « malédiction », essentielle à l’argument de Paul. « Le Christ » est plus idiomatique en français biblique courant que « le Messie » dans cette formule, tandis que « rachetés » garde la métaphore de libération par acquisition.
