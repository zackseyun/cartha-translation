  text: ὁ δὲ νόμος οὐκ ἔστιν ἐκ πίστεως, ἀλλ’· Ὁ ποιήσας ⸀αὐτὰ ζήσεται ἐν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/012.yaml
  text: But the law is not from faith[a]; rather[b], “The one who does them will live by them.”
translation:
  language: fr
  text: 'Mais la loi ne procède pas de la foi ; au contraire : « Celui qui les met en pratique vivra par elles[a]. »[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vivra en elles ».
    reason: lexical_alternative
  - marker: b
    text: Citation de Lévitique 18.5.
    reason: cross_reference
lexical_decisions:
- source_word: νόμος
  choice: la loi
  rationale: Le nom commun « loi » préserve la portée de l’expression paulinienne tout en laissant le contexte désigner la loi de Moïse, sans lui imposer une majuscule absente du grec.
- source_word: ἐκ πίστεως
  choice: procède de la foi
  rationale: « Procède de » exprime naturellement en français la provenance ou le principe marqué par ἐκ, sans développer l’expression en paraphrase théologique.
- source_word: πίστεως
  choice: foi
  rationale: « Foi » est le correspondant français courant de πίστις ici et maintient le contraste paulinien avec la loi.
- source_word: ἀλλά
  choice: au contraire
  rationale: Cette tournure marque nettement l’opposition et introduit naturellement la citation scripturaire.
- source_word: ὁ ποιήσας αὐτά
  choice: celui qui les met en pratique
  rationale: La formulation conserve le singulier générique et le pronom renvoyant aux prescriptions, tout en rendant ποιέω de manière idiomatique dans le contexte de commandements.
- source_word: ζήσεται
  choice: vivra
  rationale: Le futur simple reproduit directement le futur grec dans un registre moderne et digne.
- source_word: ἐν αὐτοῖς
  choice: par elles
  rationale: Dans la citation, « par elles » peut exprimer le moyen ou le principe selon lequel la personne vivra. Le sens spatial plus littéral est conservé en note.
theological_decisions:
- issue: Le contraste établi par Paul entre la loi et la foi
  choice: « la loi ne procède pas de la foi »
  alternative: « la loi ne repose pas sur la foi » ou « la loi ne relève pas de la foi »
  rationale: La traduction maintient l’antithèse et son caractère condensé, sans expliquer la relation entre loi, foi et vie au-delà de ce que dit le grec.
- issue: Le rapport entre l’obéissance et la vie dans la citation
  choice: « vivra par elles »
  alternative: « vivra en elles »
  rationale: Le texte principal rend ἐν dans un sens instrumental ou normatif possible dans ce contexte, tandis que la note préserve la formulation plus littérale et son ambiguïté.
translation_notes:
  register: Français international moderne, clair et digne. « Mettre en pratique » est plus idiomatique que « faire » pour l’observance de prescriptions. La structure brève et contrastive de l’argument grec est conservée.
