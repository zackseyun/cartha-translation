id: GAL.3.29
reference: Galatians 3:29
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἰ δὲ ὑμεῖς Χριστοῦ, ἄρα τοῦ Ἀβραὰμ σπέρμα ἐστέ, ⸀κατ’ ἐπαγγελίαν κληρονόμοι.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/029.yaml
  text: And if you are Messiah’s[a], then you are Abraham’s seed[b], heirs according to promise.
translation:
  language: fr
  text: Et si vous appartenez au Messie[a], alors vous êtes la descendance d’Abraham[b], héritiers selon la promesse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « au Christ ». Le grec emploie ici le titre Christos, qui signifie « Messie » ou « Oint ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « la semence d’Abraham ». Le grec emploie un singulier collectif qui reprend le vocabulaire utilisé plus haut dans ce chapitre; on peut aussi traduire « la postérité d’Abraham » ou « les descendants d’Abraham ».
    reason: lexical_alternative
lexical_decisions:
- source_word: Χριστοῦ
  choice: appartenez au Messie
  rationale: Le génitif exprime ici l’appartenance. « Appartenir au Messie » est plus naturel en français moderne que le calque « être au Messie », tout en conservant le titre messianique de Χριστός.
- source_word: σπέρμα
  choice: descendance
  rationale: « Descendance » rend naturellement en français le singulier collectif grec et maintient le lien avec l’argument développé plus haut au sujet de la descendance d’Abraham. Une note signale l’image littérale de la « semence ».
- source_word: κληρονόμοι
  choice: héritiers
  rationale: « Héritiers » est l’équivalent français direct et usuel dans ce contexte familial et relatif à la promesse.
- source_word: κατ’ ἐπαγγελίαν
  choice: selon la promesse
  rationale: Cette formulation concise préserve la souplesse de κατά sans préciser indûment s’il s’agit du fondement, de la norme ou des modalités de l’héritage.
- source_word: εἰ δὲ ὑμεῖς ... ἄρα
  choice: Et si vous… alors
  rationale: Cette tournure reproduit clairement la condition et la conclusion, tandis que « Et » rend δέ comme une liaison légère avec ce qui précède.
theological_decisions:
- issue: Préserver le lien entre σπέρμα au verset 29 et l’argument antérieur de Paul sur la « descendance » promise à Abraham.
  choice: descendance
  alternative: semence; postérité; descendants
  rationale: « Descendance » est un singulier collectif naturel et compréhensible. Il conserve la continuité lexicale et argumentative sans imposer au texte français le mot « semence », plus littéral mais peu idiomatique pour désigner des personnes.
- issue: Exprimer le génitif Χριστοῦ comme appartenance sans réduire Χριστός à un simple nom propre.
  choice: appartenez au Messie
  alternative: êtes au Messie; appartenez au Christ
  rationale: La formulation choisie explicite seulement la relation possessive déjà portée par le génitif et garde à Χριστός sa valeur de titre.
translation_notes:
  register: Français international moderne, naturel et digne. « Descendance » reste accessible tout en préservant le singulier collectif; « selon la promesse » conserve la densité et une part de l’ambiguïté de la construction grecque.
