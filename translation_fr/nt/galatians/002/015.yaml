lexical_decisions:
- source_word: Ἡμεῖς
  choice: Nous, nous
  rationale: Le pronom explicite porte une légère emphase; la dislocation, naturelle en français, la conserve sans lourdeur excessive.
- source_word: φύσει
  choice: de naissance
  rationale: Dans ce contexte, le terme désigne l’origine ethnique naturelle, non une constitution morale intérieure.
- source_word: Ἰουδαῖοι
  choice: juifs
  rationale: Le nom courant préserve directement l’identité ethnique mise en contraste dans la phrase.
- source_word: ἐξ ἐθνῶν
  choice: issus des autres peuples
  rationale: Cette formulation rend la construction d’origine et le contraste avec les Juifs; «autres peuples» exprime ici les nations non juives dans un français accessible.
- source_word: ἁμαρτωλοί
  choice: pécheurs
  rationale: Le terme théologique traditionnel et direct conserve la formulation abrupte du texte grec.
theological_decisions:
- issue: La phrase présente-t-elle comme vraie une supériorité morale intrinsèque des Juifs sur les non-Juifs?
  choice: Conserver sans l’atténuer la distinction ethnique formulée par Paul, sans l’élargir en affirmation de justice morale inhérente.
  alternative: «et non considérés comme pécheurs à la manière des non-Juifs»
  rationale: Le grec énonce le contraste de façon brève et directe. Le contexte en précise la portée, mais cette précision ne doit pas être introduite artificiellement dans ce seul verset.
translation_notes:
  register: Français international moderne, digne et accessible. «Nous, nous» restitue l’emphase du pronom grec; «issus des autres peuples» évite un terme potentiellement moins transparent tout en maintenant le contraste ethnique.
