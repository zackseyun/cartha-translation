  text: Ἡμεῖς φύσει Ἰουδαῖοι καὶ οὐκ ἐξ ἐθνῶν ἁμαρτωλοί,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/015.yaml
  text: We are Jews by birth and not sinners from among the Gentiles[b][a],
translation:
  language: fr
  text: Nous, nous sommes juifs de naissance[a], et non des pécheurs d'entre les nations[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « par nature » ; ici, l’expression renvoie à l’origine ethnique.'
