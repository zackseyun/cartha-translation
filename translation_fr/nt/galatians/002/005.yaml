source:
  edition: SBLGNT
  text: οἷς οὐδὲ πρὸς ὥραν εἴξαμεν τῇ ὑποταγῇ, ἵνα ἡ ἀλήθεια τοῦ εὐαγγελίου διαμείνῃ πρὸς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/005.yaml
  text: To them we did not yield in submission even for a moment[b][a], so that the truth of the gospel might remain for you.
translation:
  language: fr
  text: Nous ne leur avons pas cédé en nous soumettant, pas même un instant[a], afin que la vérité de l’Évangile demeure auprès de vous[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « pas même pour une heure », expression qui signifie « pas même un instant ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « demeure pour vous » ou « demeure parmi vous ».'
    reason: alternative_reading
lexical_decisions:
- source_word: οἷς
  choice: leur
  rationale: Le pronom relatif au datif renvoie aux personnes mentionnées au verset précédent. « Leur » exprime naturellement ce rapport en français.
- source_word: οὐδὲ πρὸς ὥραν
  choice: pas même un instant
  rationale: L’expression signifie que Paul et ses compagnons n’ont cédé si peu que ce soit. « Un instant » restitue clairement l’usage idiomatique de « une heure ».
- source_word: εἴξαμεν
  choice: nous n’avons pas cédé
  rationale: Le verbe désigne le fait de céder ou de plier. Cette formulation conserve l’idée d’un refus actif sans la confondre avec le nom ὑποταγή qui suit.
- source_word: τῇ ὑποταγῇ
  choice: par soumission
  rationale: Le datif peut indiquer la manière dont ils auraient cédé. « Par soumission » reste proche de la construction grecque et évite de préciser indûment s’il s’agissait d’une soumission personnelle ou institutionnelle.
- source_word: ἵνα
  choice: afin que
  rationale: La conjonction introduit ici le but poursuivi par ce refus. « Afin que » en conserve nettement la valeur finale.
- source_word: ἡ ἀλήθεια τοῦ εὐαγγελίου
  choice: la vérité de l’Évangile
  rationale: Cette traduction directe préserve une expression paulinienne importante. « Évangile » est courant dans le registre biblique français et désigne ici la bonne nouvelle annoncée.
- source_word: διαμείνῃ
  choice: demeure
  rationale: Le verbe exprime la continuation ou le maintien dans la durée. « Demeure » rend cette idée avec concision et dignité.
- source_word: πρὸς ὑμᾶς
  choice: pour vous
  rationale: La préposition peut ici exprimer l’orientation vers les Galates, avec une nuance de bénéfice. « Pour vous » est naturel, tout en signalant en note l’autre compréhension possible.
theological_decisions:
- issue: Portée du refus de céder aux opposants
  choice: Paul affirme qu’ils n’ont aucunement cédé par soumission, afin de préserver la vérité de l’Évangile.
  alternative: Limiter ce refus soit à une soumission strictement personnelle, soit à une concession institutionnelle précise.
  rationale: Le grec ne tranche pas entre ces précisions. La traduction conserve donc la portée générale et la tension du texte sans y introduire une interprétation confessionnelle.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation reste proche de la structure grecque tout en étant compréhensible à la lecture courante; elle évite de résoudre artificiellement la nature exacte de la soumission évoquée.
