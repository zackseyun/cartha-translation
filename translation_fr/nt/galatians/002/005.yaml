review_pass:
  verdict: revise
  source_fidelity: 'Le sens du grec est globalement bien rendu : le refus de céder est absolu (« pas même un instant »), la subordination n’est pas précisée au-delà du texte, et ἵνα conserve la finalité. Toutefois, « céder par soumission » est une formulation française ambiguë et peu idiomatique ; elle peut donner l’impression que la soumission est le moyen choisi pour céder, plutôt que ce à quoi Paul refuse de consentir. « En nous soumettant » restitue plus clairement τῇ ὑποταγῇ sans en définir la nature. Pour πρὸς ὑμᾶς, « auprès de vous » est une restitution française naturelle de l’orientation relationnelle ; « pour vous » demeure une possibilité signalée.'
  naturalness: La phrase révisée est fluide en français international moderne et garde un registre biblique sobre. Le déplacement de « pas même un instant » après « en nous soumettant » évite de séparer artificiellement le verbe de la précision qui en exprime la manière.
  terminology: « Vérité de l’Évangile » préserve la formulation paulinienne établie. « Nous soumettant » maintient la portée générale de ὑποταγή, sans imposer une lecture personnelle, institutionnelle ou doctrinale.
  issues:
  - severity: medium
    issue: « par soumission » est ambigu et peu naturel après « céder ».
    rationale: En français, « céder par soumission » peut être compris comme une explication causale ou instrumentale de l’acte de céder. Le grec associe τῇ ὑποταγῇ à la manière de céder, dans le sens d’un refus de se soumettre. « En nous soumettant » rend ce rapport de façon plus claire.
  - severity: low
    issue: « demeure pour vous » est grammatical mais raide en français courant.
    rationale: La préposition πρός admet une nuance relationnelle (« auprès de vous ») aussi bien qu’une nuance de bénéfice (« pour vous »). Employer « auprès de vous » dans le texte et garder « pour vous » en note donne une phrase plus naturelle sans éliminer l’ambiguïté.
