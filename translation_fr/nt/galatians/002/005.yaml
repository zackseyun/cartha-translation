  rationale: La révision corrige l’ambiguïté syntaxique de « par soumission » et améliore la naturalité de la finale française. Elle maintient le refus total exprimé par le grec, la valeur finale de ἵνα, la terminologie de « l’Évangile » et l’ambiguïté légitime de πρὸς ὑμᾶς, explicitée en note.
