id: GAL.2.4
reference: Galatians 2:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: διὰ δὲ τοὺς παρεισάκτους ψευδαδέλφους, οἵτινες παρεισῆλθον κατασκοπῆσαι τὴν ἐλευθερίαν ἡμῶν ἣν ἔχομεν ἐν Χριστῷ Ἰησοῦ, ἵνα ἡμᾶς ⸀καταδουλώσουσιν—
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/004.yaml
  text: But because of the false brothers secretly brought in[a], who slipped in to spy out our freedom that we have in Messiah Jesus[b], so that they might enslave us—
translation:
  language: fr
  text: Mais à cause des faux frères[a] introduits en secret, qui s’étaient infiltrés pour épier la liberté que nous avons en Jésus le Messie[b], afin de nous réduire en esclavage —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « faux frères » désigne ici des personnes qui se présentaient comme membres de la communauté des croyants.
    reason: cultural_note
  - marker: b
    text: Ou « en Christ Jésus ».
    reason: alternative_reading
lexical_decisions:
- source_word: παρεισάκτους
  choice: introduits en secret
  rationale: Rend l’idée d’une introduction clandestine tout en distinguant cet adjectif du verbe παρεισῆλθον qui suit.
- source_word: ψευδαδέλφους
  choice: faux frères
  rationale: Conserve l’image familiale, la forme masculine et la force polémique de l’expression grecque.
- source_word: παρεισῆλθον
  choice: s’étaient infiltrés
  rationale: Exprime naturellement l’entrée clandestine et hostile suggérée par le verbe.
- source_word: κατασκοπῆσαι
  choice: pour épier
  rationale: Préserve l’idée d’une observation secrète menée dans une intention hostile.
- source_word: ἐλευθερίαν
  choice: liberté
  rationale: Équivalent français courant qui garde toute la portée sociale et théologique du terme.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: en Jésus le Messie
  rationale: Fait entendre Χριστός comme un titre tout en employant une tournure française naturelle.
- source_word: ἵνα ἡμᾶς καταδουλώσουσιν
  choice: afin de nous réduire en esclavage
  rationale: Rend clairement le but recherché et la force du verbe, qui signifie assujettir à l’esclavage.
theological_decisions:
- issue: Valeur de Χριστῷ comme titre ou comme élément quasi nominal
  choice: Jésus le Messie
  alternative: Jésus-Christ / Christ Jésus
  rationale: Le contexte permet encore d’entendre le sens titulaire de Χριστός. La formulation choisie le rend explicitement sans traiter « Christ » comme un simple nom propre.
- issue: Identification des ψευδάδελφοι
  choice: faux frères
  alternative: faux croyants
  rationale: La traduction ne décide pas davantage que le grec de leur statut spirituel ultime; elle conserve la désignation polémique et familiale employée par Paul.
translation_notes:
  register: Français moderne, digne et accessible. La répétition entre « introduits en secret » et « s’étaient infiltrés » est maintenue parce qu’elle correspond à deux termes grecs apparentés et souligne le caractère clandestin de leur présence. Le tiret final conserve la phrase suspendue, qui se poursuit au verset suivant.
