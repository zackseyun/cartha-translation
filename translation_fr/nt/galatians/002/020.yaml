id: GAL.2.20
reference: Galatians 2:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ζῶ δὲ οὐκέτι ἐγώ, ζῇ δὲ ἐν ἐμοὶ Χριστός· ὃ δὲ νῦν ζῶ ἐν σαρκί, ἐν πίστει ζῶ τῇ τοῦ ⸂υἱοῦ τοῦ θεοῦ⸃ τοῦ ἀγαπήσαντός με καὶ παραδόντος ἑαυτὸν ὑπὲρ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/020.yaml
  text: And it is no longer I who live[a], but Messiah lives in me. And the life that I now live in the flesh, I live by faith in the Son of God, who loved me and gave himself for me.
translation:
  language: fr
  text: Ce n’est plus moi qui vis, mais le Messie vit en moi. Et la vie que je vis maintenant dans la chair, je la vis par la foi dans le Fils de Dieu[a], qui m’a aimé et s’est livré lui-même pour moi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « par la fidélité du Fils de Dieu ».'
    reason: 'Lecture alternative du génitif après πίστις : il peut exprimer la fidélité exercée par le Fils plutôt que la foi placée en lui.'
lexical_decisions:
- source_word: Χριστός
  choice: le Messie
  rationale: Le titre grec est traduit plutôt que simplement translittéré. En français courant, l’article défini rend l’expression naturelle tout en maintenant sa portée messianique.
- source_word: ὃ δὲ νῦν ζῶ
  choice: la vie que je vis maintenant
  rationale: La construction relative neutre est elliptique en grec. Cette formulation explicite naturellement en français l’idée de la vie présente sans ajouter de contenu interprétatif.
- source_word: σάρξ
  choice: chair
  rationale: « Chair » conserve le terme paulinien et désigne ici l’existence humaine présente et corporelle, sans introduire l’idée plus interprétative de « nature pécheresse ».
- source_word: πίστει
  choice: foi
  rationale: « Foi » est le sens principal retenu. L’ambiguïté créée par le génitif qui suit est signalée dans une note.
- source_word: τῇ τοῦ υἱοῦ τοῦ θεοῦ
  choice: dans le Fils de Dieu
  rationale: Le texte principal comprend le génitif comme indiquant l’objet de la foi. « La foi dans le Fils de Dieu » est clair et naturel en français moderne, tandis que l’autre analyse possible est conservée en note.
- source_word: παραδόντος ἑαυτὸν ὑπὲρ ἐμοῦ
  choice: s’est livré lui-même pour moi
  rationale: Cette formulation garde l’idée forte de se remettre volontairement et la valeur sacrificielle de l’expression grecque. « Lui-même » représente explicitement ἑαυτόν.
theological_decisions:
- issue: Sens de πίστις suivi du génitif dans τῇ τοῦ υἱοῦ τοῦ θεοῦ
  choice: par la foi dans le Fils de Dieu
  alternative: par la fidélité du Fils de Dieu
  rationale: Le génitif peut désigner soit l’objet de la foi, soit le sujet dont la fidélité est en vue. Le texte principal adopte la lecture objective, immédiatement compréhensible, mais la note préserve la véritable ambiguïté exégétique et théologique.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe répétitive « la vie que je vis… je la vis » conserve l’insistance du grec tout en restant idiomatique. « Chair » est maintenu comme terme paulinien contextuellement intelligible.
