  text: Ἔπειτα διὰ δεκατεσσάρων ἐτῶν πάλιν ἀνέβην εἰς Ἱεροσόλυμα μετὰ Βαρναβᾶ συμπαραλαβὼν καὶ Τίτον·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/001.yaml
  text: Then after fourteen years I went up again to Jerusalem with Barnabas, also taking Titus along.
translation:
  language: fr
  text: Puis, quatorze ans plus tard, je suis de nouveau monté à Jérusalem avec Barnabas, en prenant aussi Tite avec moi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔπειτα
  choice: Puis
  rationale: Marque naturellement la suite du récit de Paul tout en restant bref et courant.
- source_word: διὰ δεκατεσσάρων ἐτῶν
  choice: quatorze ans plus tard
  rationale: Rend idiomatiquement la durée écoulée avant l’événement suivant, sans préciser à partir de quel point les quatorze ans sont comptés.
- source_word: πάλιν
  choice: de nouveau
  rationale: Indique la répétition d’une montée à Jérusalem dans un français naturel.
- source_word: ἀνέβην
  choice: je suis monté
  rationale: Conserve l’image conventionnelle de la montée vers Jérusalem, qui peut refléter la géographie et l’usage consacré.
- source_word: εἰς Ἱεροσόλυμα
  choice: à Jérusalem
  rationale: Expression française normale de la destination.
- source_word: μετὰ Βαρναβᾶ
  choice: avec Barnabas
  rationale: Rend directement l’accompagnement exprimé par la préposition grecque.
- source_word: συμπαραλαβὼν καὶ Τίτον
  choice: en prenant aussi Tite avec moi
  rationale: Le participe exprime une action concomitante, et καί souligne que Tite s’ajoute à Barnabas comme compagnon de voyage.
theological_decisions: []
