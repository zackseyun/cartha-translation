id: GAL.2.6
reference: Galatians 2:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀπὸ δὲ τῶν δοκούντων εἶναί τι— ὁποῖοί ποτε ἦσαν οὐδέν μοι διαφέρει· πρόσωπον ⸀θεὸς ἀνθρώπου οὐ λαμβάνει— ἐμοὶ γὰρ οἱ δοκοῦντες οὐδὲν προσανέθεντο,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/006.yaml
  text: But from those who were reputed to be something—whatever they once were makes no difference to me[a]; God shows no partiality—to me, indeed[c][b], those of reputation added nothing.
translation:
  language: fr
  text: Mais ceux qui passaient pour être importants[a] — quels qu’ils aient pu être, cela ne m’importe pas ; Dieu ne fait pas de favoritisme[b] —, ces personnes considérées comme importantes ne m’ont, en effet, rien ajouté[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ceux qui semblaient être quelque chose ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « Dieu ne reçoit pas le visage d’un être humain », expression qui signifie que Dieu ne favorise personne en fonction de son statut ou de son apparence.'
    reason: cultural_note
  - marker: c
    text: 'Ou : « ne m’ont rien imposé de plus ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τῶν δοκούντων εἶναί τι / οἱ δοκοῦντες
  choice: ceux qui passaient pour être importants / ceux qui étaient reconnus
  rationale: Cette formulation exprime une réputation ou un statut reconnu tout en conservant la légère distance rhétorique de Paul, sans dénigrer explicitement les responsables de Jérusalem.
- source_word: ὁποῖοί ποτε ἦσαν
  choice: ce qu’ils étaient autrefois
  rationale: « Autrefois » rend naturellement ποτε, tandis que la tournure indique que leur statut antérieur n’a aucune incidence sur le jugement de Paul.
- source_word: οὐδέν μοι διαφέρει
  choice: m’est indifférent
  rationale: Expression française concise et naturelle qui signifie que leur statut ne change rien à l’évaluation de Paul.
- source_word: πρόσωπον θεὸς ἀνθρώπου οὐ λαμβάνει
  choice: Dieu ne fait pas de favoritisme
  rationale: La traduction restitue le sens de l’expression idiomatique grecque plutôt que son image littérale, peu intelligible en français moderne.
- source_word: ἐμοὶ γὰρ
  choice: ne m’ont, en effet
  rationale: Le pronom « m’ » maintient le datif explicite ἐμοί, et « en effet » rend γάρ en reliant l’affirmation à l’expérience personnelle de Paul.
- source_word: οὐδὲν προσανέθεντο
  choice: rien ajouté
  rationale: 'Ce choix conserve la formulation ouverte du grec : les personnes reconnues n’ont apporté aucun complément au message ou à la mission de Paul, sans préciser à tort l’objet sous-entendu.'
theological_decisions:
- issue: Le degré de distance de Paul envers les responsables reconnus de Jérusalem
  choice: Conserver une distance mesurée fondée sur leur réputation, sans présenter Paul comme méprisant leur autorité.
  alternative: Traduire plus durement par « ceux qui se croyaient importants », ou plus positivement par « les dirigeants reconnus ».
  rationale: Paul affirme que le statut humain de ces responsables ne détermine pas la vérité de son Évangile, mais il ne nie pas nécessairement la réalité de leur rôle. La formulation choisie maintient cette tension.
- issue: Ce que les personnes reconnues n’ont pas ajouté
  choice: Ne pas expliciter l’objet sous-entendu.
  alternative: Préciser qu’elles n’ont rien ajouté à l’Évangile de Paul, ou qu’elles ne lui ont imposé aucune exigence supplémentaire.
  rationale: Le contexte permet ces nuances, mais le grec du verset laisse l’objet ouvert. Le texte principal conserve donc cette ambiguïté et signale l’autre sens possible en note.
translation_notes:
  register: Français international moderne, digne et accessible. Les tirets conservent la parenthèse rhétorique de Paul et la structure légèrement heurtée du grec. « Favoritisme » communique clairement l’impartialité divine, tandis que « rien ajouté » préserve l’ambiguïté du complément implicite.
