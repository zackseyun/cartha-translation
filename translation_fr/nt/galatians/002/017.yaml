id: GAL.2.17
reference: Galatians 2:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἰ δὲ ζητοῦντες δικαιωθῆναι ἐν Χριστῷ εὑρέθημεν καὶ αὐτοὶ ἁμαρτωλοί, ἆρα Χριστὸς ἁμαρτίας διάκονος; μὴ γένοιτο·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/017.yaml
  text: But if[a], while seeking to be justified in Messiah, we ourselves also were found to be sinners, is Messiah then a servant of sin? May it never be!
translation:
  language: fr
  text: Mais si, en cherchant à être déclarés justes dans le Messie[a], nous avons nous aussi été trouvés pécheurs, le Messie est-il donc au service du péché ? Certainement pas !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Messie : traditionnellement traduit par « Christ » ici et dans la seconde occurrence du verset.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ζητοῦντες
  choice: en cherchant
  rationale: Le participe présent exprime une circonstance contemporaine du verbe principal; cette tournure la restitue naturellement en français.
- source_word: δικαιωθῆναι
  choice: être déclarés justes
  rationale: Cette formulation rend clairement la valeur passive et judiciaire du verbe sans imposer le vocabulaire plus technique de « justifier ».
- source_word: ἐν Χριστῷ
  choice: dans le Messie
  rationale: « Messie » conserve ici la valeur titulaire de Χριστός, tandis que « dans » préserve la formulation relationnelle dense de Paul sans l’expliciter.
- source_word: εὑρέθημεν
  choice: nous avons été trouvés
  rationale: Le passif grec et sa force rhétorique sont conservés, sans préciser qui constate cet état ni comment.
- source_word: καὶ αὐτοὶ ἁμαρτωλοί
  choice: nous aussi, pécheurs
  rationale: « Nous aussi » rend l’emphase de καὶ αὐτοί; « pécheurs » demeure un attribut direct, comme en grec.
- source_word: ἁμαρτίας διάκονος
  choice: au service du péché
  rationale: Cette expression française naturelle restitue l’idée de διάκονος comme personne servant les intérêts du péché, sans suggérer une fonction ecclésiale.
- source_word: μὴ γένοιτο
  choice: Certainement pas !
  rationale: Cette formule idiomatique exprime avec vigueur le rejet catégorique porté par l’optatif grec.
theological_decisions:
- issue: La question rhétorique pourrait-elle laisser entendre que le Messie favorise ou produit le péché ?
  choice: le Messie serait-il donc au service du péché ?
  alternative: le Messie est-il donc un serviteur du péché ?
  rationale: Le conditionnel fait naturellement ressortir en français la conséquence supposée du raisonnement, tandis que la question puis le rejet catégorique préservent la tension du grec sans transformer l’accusation en affirmation doctrinale.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve le raisonnement serré de Paul; les virgules mettent en relief « nous aussi » sans alourdir la phrase.
