id: GAL.2.7
reference: Galatians 2:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀλλὰ τοὐναντίον ἰδόντες ὅτι πεπίστευμαι τὸ εὐαγγέλιον τῆς ἀκροβυστίας καθὼς Πέτρος τῆς περιτομῆς,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/007.yaml
  text: But on the contrary[a], when they saw that I had been entrusted with the gospel for the uncircumcised, just as Peter had been for the circumcised,
translation:
  language: fr
  text: Mais au contraire, lorsqu’ils ont vu que l’Évangile destiné aux incirconcis m’avait été confié, tout comme l’Évangile destiné aux circoncis l’avait été à Pierre,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « l’Évangile de l’incirconcision […] de la circoncision », c’est-à-dire l’Évangile confié en vue de ces deux groupes.'
    reason: alternative lexicale et précision sur la valeur des génitifs
lexical_decisions:
- source_word: ἀλλὰ τοὐναντίον
  choice: Mais au contraire
  rationale: L’expression redoublée marque une opposition forte avec ce qui précède; cette formulation française en conserve l’insistance.
- source_word: ἰδόντες
  choice: lorsqu’ils ont vu
  rationale: Le participe aoriste exprime ici la circonstance; une proposition temporelle est naturelle et claire en français.
- source_word: πεπίστευμαι
  choice: m’avait été confié
  rationale: Le parfait passif de πιστεύω signifie ici recevoir quelque chose en dépôt ou comme mission. Le plus-que-parfait convient à la perception rapportée dans le récit.
- source_word: τὸ εὐαγγέλιον
  choice: l’Évangile
  rationale: « Évangile » est le terme français consacré en contexte paulinien et conserve la portée théologique de εὐαγγέλιον.
- source_word: τῆς ἀκροβυστίας
  choice: pour les incirconcis
  rationale: Le génitif désigne le groupe auquel s’adresse la mission. Cette formulation reste proche du marqueur employé par Paul sans le remplacer par « non-Juifs ».
- source_word: καθὼς
  choice: comme
  rationale: Introduit naturellement en français le parallèle entre les missions confiées à Paul et à Pierre.
- source_word: Πέτρος
  choice: Pierre
  rationale: Forme française traditionnelle et courante du nom de l’apôtre.
- source_word: τῆς περιτομῆς
  choice: celui pour les circoncis
  rationale: « Celui » reprend explicitement « l’Évangile » et restitue l’ellipse grecque, tandis que « pour les circoncis » préserve la désignation employée dans le texte source.
theological_decisions:
- issue: Faut-il rendre ἀκροβυστία et περιτομή par des désignations ethniques ou conserver les marqueurs liés à la circoncision ?
  choice: les incirconcis / les circoncis
  alternative: les non-Juifs / les Juifs; l’incirconcision / la circoncision
  rationale: Le grec désigne les groupes par leur rapport à la circoncision. Conserver cette manière de parler respecte le cadrage paulinien sans réduire les expressions à une simple paraphrase ethnique.
translation_notes:
  register: Français moderne, international et digne. La phrase conserve la forte opposition initiale et le parallélisme du grec, tout en explicitant discrètement l’ellipse après Pierre pour assurer une lecture naturelle.
