id: GAL.2.13
reference: Galatians 2:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ συνυπεκρίθησαν αὐτῷ ⸀καὶ οἱ λοιποὶ Ἰουδαῖοι, ὥστε καὶ Βαρναβᾶς συναπήχθη αὐτῶν τῇ ὑποκρίσει.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/013.yaml
  text: And the rest of the Jews also joined him in hypocrisy[b][a], so that even Barnabas was carried away by their hypocrisy.
translation:
  language: fr
  text: Les autres Juifs se joignirent eux aussi à lui dans l’hypocrisie, au point que même Barnabé fut entraîné par leur hypocrisie.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνυπεκρίθησαν
  choice: se joignirent eux aussi à lui dans l’hypocrisie
  rationale: Le verbe composé exprime une participation commune au comportement hypocrite. Cette formulation française conserve à la fois l’association avec Pierre et la dimension collective marquée par le préfixe συν-.
- source_word: αὐτῷ
  choice: à lui
  rationale: Le datif indique ici l’association avec Pierre; « se joindre à lui » l’exprime naturellement en français.
- source_word: οἱ λοιποὶ Ἰουδαῖοι
  choice: les autres Juifs
  rationale: Dans ce contexte, λοιποί désigne les autres membres du groupe juif concerné, tandis que Ἰουδαῖοι renvoie aux Juifs comme groupe ethnoreligieux plutôt qu’aux seuls habitants de la Judée.
- source_word: ὥστε
  choice: au point que
  rationale: Cette tournure introduit naturellement en français le résultat notable du comportement collectif décrit.
- source_word: συναπήχθη
  choice: fut entraîné
  rationale: Le passif présente Barnabé comme ayant été amené à suivre le mouvement sous l’influence des autres; « fut entraîné » préserve cette force sans préciser excessivement le mécanisme.
- source_word: τῇ ὑποκρίσει
  choice: par leur hypocrisie
  rationale: Le datif désigne ce qui a entraîné Barnabé. La répétition d’« hypocrisie » reflète l’insistance lexicale de Paul.
theological_decisions: []
translation_notes:
  register: Français moderne, courant et digne. La phrase conserve la répétition rhétorique d’« hypocrisie », l’association collective avec Pierre et le contraste marqué par « même Barnabé ».
