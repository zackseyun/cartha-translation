id: GAL.2.11
reference: Galatians 2:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ὅτε δὲ ἦλθεν ⸀Κηφᾶς εἰς Ἀντιόχειαν, κατὰ πρόσωπον αὐτῷ ἀντέστην, ὅτι κατεγνωσμένος ἦν·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/011.yaml
  text: But when Cephas came to Antioch[a], I opposed him to his face[b], because he stood condemned.
translation:
  language: fr
  text: Mais lorsque Céphas vint à Antioche[a], je lui résistai en face, car il était condamnable[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Céphas est le nom araméen de Pierre.
    reason: cross_reference
  - marker: b
    text: 'Ou : « il était manifestement dans son tort ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅτε δὲ
  choice: Mais lorsque
  rationale: Rend à la fois la transition temporelle et le léger contraste exprimé par δέ, dans un français naturel.
- source_word: Κηφᾶς
  choice: Céphas
  rationale: Conserve la forme du nom présente dans le texte grec, plutôt que de lui substituer Pierre.
- source_word: ἦλθεν εἰς Ἀντιόχειαν
  choice: vint à Antioche
  rationale: Expression française idiomatique du déplacement vers une ville; le passé simple convient au registre narratif digne.
- source_word: κατὰ πρόσωπον αὐτῷ
  choice: à lui en face
  rationale: Préserve l’image d’une opposition personnelle et directe sans la réduire au seul adverbe « directement ».
- source_word: ἀντέστην
  choice: je me suis opposé à lui
  rationale: Exprime clairement la confrontation ouverte indiquée par le verbe, dans un français actuel.
- source_word: ὅτι
  choice: parce que
  rationale: Introduit explicitement la raison de l’opposition de Paul.
- source_word: κατεγνωσμένος ἦν
  choice: il était condamné
  rationale: Préserve la voix passive et l’état résultant de la construction périphrastique, tout en laissant ouverte la question de savoir par qui ou selon quel critère il était condamné.
theological_decisions:
- issue: Identité et forme du nom Κηφᾶς
  choice: Conserver « Céphas » dans le texte principal
  alternative: Employer « Pierre » pour une reconnaissance immédiate
  rationale: Le grec porte Κηφᾶς; conserver Céphas respecte la forme source sans trancher davantage que le texte. Une note fournit l’identification usuelle.
- issue: Portée de κατεγνωσμένος ἦν
  choice: « il était condamné »
  alternative: « il était manifestement dans son tort »
  rationale: La formulation retenue maintient le passif et la tension du grec. L’alternative explicite davantage une culpabilité démontrée, mais interprète le sens au lieu de préserver toute son ambiguïté.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple « vint » assure une narration littéraire naturelle; le passé composé « je me suis opposé » met en relief l’intervention personnelle de Paul. Les marqueurs [a] et [b] figurent tous deux dans le texte principal.
