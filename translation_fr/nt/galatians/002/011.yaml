review_pass:
  verdict: revise
  source_fidelity: « À lui en face » ne rend pas idiomatiquement κατὰ πρόσωπον αὐτῷ en français. « Lui résister en face » conserve à la fois le caractère direct de la confrontation et la force de ἀντέστην. Pour κατεγνωσμένος ἦν, « condamnable » évite de suggérer indûment une condamnation formelle déjà prononcée, tout en gardant l'évaluation négative et l'état exprimés par le grec.
  naturalness: Le mélange de « vint » et de « je me suis opposé » est possible, mais une narration au passé simple est plus cohérente ici. « Je lui résistai en face » est une formulation française claire, digne et naturelle; « je me suis opposé à lui en face » est lourd et peu idiomatique.
  terminology: « Céphas » respecte la forme Κηφᾶς du texte grec, et la note qui l'identifie comme le nom araméen de Pierre est appropriée. « Antioche » et « condamné/condamnable » ne soulèvent aucune difficulté terminologique supplémentaire.
  issues:
  - severity: medium
    issue: Rendu peu idiomatique de κατὰ πρόσωπον αὐτῷ
    rationale: « Je me suis opposé à lui en face » sonne maladroit en français et ne reproduit pas naturellement l'idiome de confrontation directe. « Je lui résistai en face » est plus idiomatique et fidèle.
  - severity: low
    issue: Temps narratifs hétérogènes
    rationale: « Vint » suivi de « je me suis opposé » mêle passé simple et passé composé dans une même séquence narrative sans effet discursif nécessaire. Le passé simple harmonise la phrase.
  - severity: medium
    issue: « Il était condamné » peut surspécifier le sens
    rationale: Cette expression française évoque facilement un verdict ou une sanction déjà prononcés. Le participe grec peut exprimer qu'il était répréhensible ou reconnu en faute, sans identifier l'auteur d'une condamnation formelle. « Il était condamnable » préserve mieux cette ouverture.
  revised_text: Mais lorsque Céphas vint à Antioche[a], je lui résistai en face, car il était condamnable[b].
  revised_footnotes:
