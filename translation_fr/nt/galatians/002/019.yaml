  terminology: « La loi », « Dieu » et « le Messie » sont cohérents avec le contexte paulinien et avec le traitement de Χριστός comme titre. « Vivre pour Dieu » est plus moderne et transparent que « vivre à Dieu », tout en conservant convenablement l’orientation vers Dieu sans ajouter d’interprétation doctrinale.
