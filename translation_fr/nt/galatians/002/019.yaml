id: GAL.2.19
reference: Galatians 2:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐγὼ γὰρ διὰ νόμου νόμῳ ἀπέθανον ἵνα θεῷ ζήσω· Χριστῷ συνεσταύρωμαι·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/019.yaml
  text: For through the law I died to the law, so that I might live to God. I have been crucified with Messiah.
translation:
  language: fr
  text: Car c’est par la loi que je suis mort à la loi, afin de vivre pour Dieu. J’ai été crucifié avec le Messie.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γὰρ
  choice: Car
  rationale: Introduit l’explication qui fonde l’affirmation précédente et conserve clairement le mouvement argumentatif.
- source_word: διὰ νόμου
  choice: par la loi
  rationale: διά suivi du génitif exprime ici le moyen. En français, « par la loi » est à la fois naturel et suffisamment proche de la formulation grecque.
- source_word: νόμῳ
  choice: à la loi
  rationale: Le datif est rendu par l’expression française idiomatique « mourir à », qui marque la rupture du rapport antérieur sans expliciter davantage sa nature.
- source_word: ἀπέθανον
  choice: je suis mort
  rationale: Le passé composé exprime naturellement en français un événement décisif passé dont la portée demeure dans l’argument.
- source_word: ἵνα
  choice: afin de
  rationale: Rend explicitement la valeur de but tout en gardant un registre digne et courant.
- source_word: θεῷ ζήσω
  choice: vivre pour Dieu
  rationale: « Vivre pour Dieu » restitue naturellement en français l’orientation relationnelle du datif; « vivre à Dieu » serait aujourd’hui archaïque et peu transparent.
- source_word: Χριστῷ
  choice: avec le Messie
  rationale: Le datif dépend de συνεσταύρωμαι et désigne celui avec qui Paul a été crucifié. « Messie » maintient ici la valeur titulaire de Χριστός.
- source_word: συνεσταύρωμαι
  choice: J’ai été crucifié avec
  rationale: Le passé composé passif rend l’action accomplie et sa portée présente, conformément au parfait grec, dans un français naturel.
theological_decisions:
- issue: Faut-il expliciter comment Paul est mort à la loi par la loi?
  choice: Conserver la formulation dense « par la loi… mort à la loi ».
  alternative: « condamné par la loi, je suis mort à son autorité »
  rationale: Le grec ne précise pas le mécanisme théologique envisagé. Une expansion résoudrait une tension que le texte maintient.
- issue: Rendre θεῷ par « à Dieu » ou « pour Dieu »
  choice: « pour Dieu »
  alternative: « à Dieu »
  rationale: « Pour Dieu » est l’expression française moderne et intelligible pour une vie orientée vers Dieu, sans réduire nécessairement le datif à la seule idée d’utilité.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe parallèle « par la loi… à la loi » est volontairement conservée malgré sa densité. « Car » maintient le lien logique avec le contexte, et « le Messie » traite Χριστός comme un titre.
