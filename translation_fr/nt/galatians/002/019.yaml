  source_fidelity: 'Le texte rend fidèlement la structure et les relations du grec : γάρ est conservé par « Car » ; διὰ νόμου et νόμῳ par « par la loi » et « à la loi » ; le but introduit par ἵνα est clairement exprimé ; et le parfait passif συνεσταύρωμαι est bien rendu par « J’ai été crucifié avec le Messie ». La formulation dense ne résout pas indûment le sens théologique disputé de « mourir à la loi par la loi ».'
