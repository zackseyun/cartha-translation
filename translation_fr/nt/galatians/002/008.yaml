source:
  edition: SBLGNT
  text: ὁ γὰρ ἐνεργήσας Πέτρῳ εἰς ἀποστολὴν τῆς περιτομῆς ἐνήργησεν καὶ ἐμοὶ εἰς τὰ ἔθνη,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/008.yaml
  text: For the one who worked through Peter for apostleship to the circumcised also worked through me for the Gentiles[b][a],
translation:
  language: fr
  text: Car celui qui a agi en Pierre pour l’apostolat auprès des circoncis[a] a aussi agi en moi auprès des non-Juifs[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « pour l’apostolat de la circoncision ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « les nations ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνεργήσας / ἐνήργησεν
  choice: a agi / a aussi agi
  rationale: La répétition du même verbe français conserve le parallélisme délibéré du grec sans préciser indûment la manière dont s’exerce l’action divine.
- source_word: Πέτρῳ / ἐμοὶ
  choice: par Pierre / par moi
  rationale: 'Les datifs sont compris ici dans un sens instrumental : celui qui agit le fait par l’intermédiaire de Pierre et de Paul dans leurs missions respectives.'
- source_word: εἰς ἀποστολὴν
  choice: pour l’apostolat
  rationale: Cette formulation garde le sens formel d’ἀποστολή et exprime l’orientation de l’action vers le ministère apostolique.
- source_word: τῆς περιτομῆς
  choice: auprès des circoncis
  rationale: « La circoncision » désigne ici, par métonymie, le peuple juif circoncis. « Les circoncis » maintient l’image paulinienne et le contraste avec les non-Juifs.
- source_word: τὰ ἔθνη
  choice: les non-Juifs
  rationale: Dans ce contraste avec les circoncis, le terme désigne les peuples non juifs. « Non-Juifs » est clair en français moderne, tandis que le sens plus littéral est signalé en note.
theological_decisions:
- issue: Faut-il nommer explicitement Dieu comme sujet ?
  choice: celui qui a agi
  alternative: Dieu, qui a agi
  rationale: Le grec emploie un participe substantivé, « celui qui a agi », sans nommer explicitement Dieu dans ce verset. La traduction conserve cette forme tout en laissant le contexte identifier le sujet.
- issue: Nature de l’action exercée en Pierre et en Paul
  choice: a agi par
  alternative: a rendu efficace / a donné la capacité à
  rationale: Le simple verbe « agir » préserve l’ambiguïté du grec quant aux modalités précises de l’action et évite d’introduire une interprétation théologique plus étroite.
translation_notes:
  register: Français moderne, sobre et digne. Le parallélisme entre Pierre et Paul est maintenu, ainsi que la désignation indirecte du sujet divin. « Auprès de » rend naturellement l’orientation de leurs missions respectives.
