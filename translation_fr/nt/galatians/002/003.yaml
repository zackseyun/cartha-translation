  text: ἀλλ’ οὐδὲ Τίτος ὁ σὺν ἐμοί, Ἕλλην ὤν, ἠναγκάσθη περιτμηθῆναι·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/003.yaml
  text: But not even Titus[a], who was with me, though he was a Greek[b], was compelled to be circumcised.
translation:
  language: fr
  text: Mais pas même Tite, qui était avec moi, bien que grec, n’a été contraint de se faire circoncire.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλλ’
  choice: Mais
  rationale: Marque le contraste avec le contexte précédent de manière concise et naturelle.
- source_word: οὐδὲ
  choice: même… n’a pas
  rationale: Cette tournure française idiomatique conserve la négation emphatique centrée sur Tite.
- source_word: Τίτος
  choice: Tite
  rationale: Forme française traditionnelle et courante du nom propre.
- source_word: ὁ σὺν ἐμοί
  choice: qui était avec moi
  rationale: Rend directement l’expression descriptive sans ajouter l’idée plus forte de compagnon ou de collaborateur.
- source_word: Ἕλλην ὤν
  choice: bien qu’il soit grec
  rationale: Exprime naturellement la valeur concessive du participe dans ce contexte, tout en conservant le terme précis « grec ».
- source_word: Ἕλλην
  choice: grec
  rationale: Préserve la désignation ethnique et culturelle précise du grec, au lieu de la généraliser en « non-Juif ».
- source_word: ἠναγκάσθη
  choice: n’a pas été contraint
  rationale: Le passif indique une pression ou une contrainte extérieure; « contraint » convient au registre digne du passage.
- source_word: περιτμηθῆναι
  choice: de se faire circoncire
  rationale: Tournure française naturelle qui rend le passif de l’infinitif grec sans suggérer que Tite aurait pratiqué lui-même l’acte.
theological_decisions:
- issue: Rendre Ἕλλην comme désignation ethnique ou comme raccourci religieux interprétatif
  choice: grec
  alternative: non-Juif
  rationale: Le texte désigne précisément Tite comme grec. Dans le contexte, cela implique son statut d’incirconcis, mais la traduction ne doit pas remplacer le mot source par une catégorie plus générale.
- issue: Valeur circonstancielle de Ἕλλην ὤν
  choice: bien qu’il soit grec
  alternative: étant grec
  rationale: Le contexte favorise une nuance concessive, sans éliminer la possibilité d’une formulation plus strictement participiale; celle-ci est signalée en note.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase conserve l’emphase de οὐδὲ par « même… n’a pas », évite un calque lourd et maintient la désignation précise « grec ».
