id: GAL.2.18
reference: Galatians 2:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἰ γὰρ ἃ κατέλυσα ταῦτα πάλιν οἰκοδομῶ, παραβάτην ἐμαυτὸν ⸀συνιστάνω.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/018.yaml
  text: For if I rebuild the things I tore down[b][a], I prove myself to be a transgressor.
translation:
  language: fr
  text: Car si je reconstruis ce que j’ai démoli[a], je montre par là que je suis moi-même un transgresseur[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « détruit » ou « renversé ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « je prouve moi-même que je suis un transgresseur » ; autre traduction possible : « je me constitue moi-même transgresseur ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ γὰρ
  choice: Car si
  rationale: « Car » conserve le lien explicatif établi par γάρ avec l’argument précédent, tandis que « si » maintient la valeur conditionnelle de εἰ.
- source_word: ἃ ... ταῦτα
  choice: ce que
  rationale: Cette tournure française naturelle rend la structure corrélative grecque sans alourdir la phrase. Le neutre pluriel grec désigne ici ce qui a été démoli puis reconstruit.
- source_word: κατέλυσα
  choice: j’ai démoli
  rationale: « Démoli » forme avec « reconstruis » une image architecturale claire et fidèle. Des choix comme « aboli » imposeraient une interprétation plus précise que le grec.
- source_word: πάλιν οἰκοδομῶ
  choice: je reconstruis
  rationale: Le verbe français « reconstruire » exprime naturellement à la fois πάλιν, « de nouveau », et οἰκοδομῶ, « je construis », tout en gardant le présent.
- source_word: παραβάτην
  choice: un transgresseur
  rationale: « Transgresseur » préserve la portée morale et juridique de παραβάτης sans limiter explicitement la transgression à une loi particulière.
- source_word: ἐμαυτὸν συνιστάνω
  choice: je montre par là que je suis moi-même
  rationale: Cette formulation rend naturellement l’idée de se révéler ou de s’établir soi-même comme transgresseur, en conservant l’insistance du pronom réfléchi ἐμαυτόν.
theological_decisions:
- issue: Objet de la démolition et de la reconstruction
  choice: Ne pas préciser dans le verset ce qui est démoli puis reconstruit
  alternative: Identifier explicitement cet objet à la Loi, aux pratiques de la Loi ou à une manière de vivre
  rationale: Le grec emploie une expression générale, ἃ ... ταῦτα. Préciser l’objet résoudrait dans la traduction une question que le contexte laisse à l’interprétation.
translation_notes:
  register: Français international moderne, clair et digne. L’image cohérente « démolir/reconstruire » est conservée, et « transgresseur » maintient la nuance morale et juridique du grec.
