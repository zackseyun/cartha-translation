source:
  edition: SBLGNT
  text: ἀλλ’ ὅτε εἶδον ὅτι οὐκ ὀρθοποδοῦσιν πρὸς τὴν ἀλήθειαν τοῦ εὐαγγελίου, εἶπον τῷ ⸀Κηφᾷ ἔμπροσθεν πάντων· Εἰ σὺ Ἰουδαῖος ὑπάρχων ἐθνικῶς ⸂καὶ ⸀οὐκ Ἰουδαϊκῶς ζῇς⸃, ⸀πῶς τὰ ἔθνη ἀναγκάζεις Ἰουδαΐζειν;
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/014.yaml
  text: But when I saw that they were not walking in step with the truth of the gospel[a], I said to Cephas before them all, “If you, though a Jew, live like a Gentile and not like a Jew[b], how do you compel the Gentiles to live like Jews?”
translation:
  language: fr
  text: 'Mais quand j’ai vu que leur conduite n’était pas conforme à la vérité de l’Évangile[a], j’ai dit à Céphas devant tout le monde : « Si toi, qui es Juif, tu vis à la manière des non-Juifs et non à la manière des Juifs, comment obliges-tu les non-Juifs à vivre à la manière des Juifs[b] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « qu’ils ne marchaient pas droit selon la vérité de l’Évangile ».'
    reason: lexical_alternative
  - marker: b
    text: 'On traduit traditionnellement : « à judaïser ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀρθοποδοῦσιν
  choice: leur conduite n’était pas conforme
  rationale: Le verbe évoque littéralement le fait de marcher droit, mais désigne ici une conduite qui ne s’accorde pas avec la vérité de l’Évangile. Cette formulation est naturelle en français moderne; la métaphore littérale est signalée en note.
- source_word: πρὸς τὴν ἀλήθειαν τοῦ εὐαγγελίου
  choice: conforme à la vérité de l’Évangile
  rationale: Avec ὀρθοποδοῦσιν, πρός exprime ici la conformité à une norme plutôt qu’un simple mouvement en direction de celle-ci.
- source_word: Κηφᾷ
  choice: Céphas
  rationale: Le texte grec emploie le nom araméen translittéré Κηφᾶς; « Céphas » le conserve au lieu de lui substituer « Pierre ».
- source_word: ἐθνικῶς
  choice: à la manière des non-Juifs
  rationale: L’adverbe décrit une manière de vivre. « Non-Juifs » rend clairement le contraste ethnique et social avec « Juifs » sans employer le terme français potentiellement vieilli « païens ».
- source_word: Ἰουδαϊκῶς
  choice: à la manière des Juifs
  rationale: La formulation parallèle à ἐθνικῶς préserve l’opposition explicite du grec.
- source_word: ἀναγκάζεις
  choice: obliges-tu
  rationale: « Obliger » conserve l’idée de contrainte sans préciser indûment si celle-ci est physique, juridique ou sociale.
- source_word: Ἰουδαΐζειν
  choice: vivre à la manière des Juifs
  rationale: L’infinitif signifie adopter un mode de vie juif. Cette formulation est intelligible aujourd’hui et évite les connotations polémiques ultérieures du terme technique « judaïser », conservé en note.
- source_word: πῶς
  choice: comment
  rationale: La traduction directe « comment » maintient la question accusatrice de Paul sans introduire une nuance de capacité par « comment peux-tu ».
theological_decisions:
- issue: Rendre Ἰουδαΐζειν sans importer des polémiques doctrinales postérieures
  choice: vivre à la manière des Juifs
  alternative: judaïser; adopter les coutumes juives
  rationale: Le contexte immédiat porte sur la conduite commune et les marqueurs de distinction entre Juifs et non-Juifs. La traduction retenue préserve cette tension sociale et religieuse sans transformer le verbe en terme technique relevant d’un système théologique ultérieur.
- issue: Nature de la contrainte exprimée par ἀναγκάζεις
  choice: obliges-tu
  alternative: forces-tu; pousses-tu
  rationale: Le texte affirme une contrainte mais n’en définit pas précisément le mécanisme. « Obliger » conserve cette indétermination.
translation_notes:
  register: Français international moderne, digne et accessible. « Devant tout le monde » rend naturellement ἔμπροσθεν πάντων. Le parallélisme « à la manière des non-Juifs… à la manière des Juifs » maintient l’opposition du grec, tandis que les notes conservent la métaphore de la marche et le terme traditionnel « judaïser ».
