revisions:
- from: Mais je suis monté en réponse à une révélation[a], et je leur ai exposé l’Évangile que je proclame parmi les non-Juifs — mais je l’ai fait en privé devant ceux qui étaient considérés comme importants[b] —, de peur de courir ou d’avoir couru pour rien[c].
  to: Mais je suis monté en réponse à une révélation[a], et je leur ai exposé l’Évangile que je proclame parmi les non-Juifs — mais, en privé, à ceux qui étaient considérés comme importants[b] —, de peur que, d’une manière ou d’une autre, je ne coure ou n’aie couru pour rien[c].
  rationale: La révision restitue πως, qui nuance la crainte de Paul, et simplifie la parenthèse afin de rendre plus directement κατ’ ἰδίαν δὲ τοῖς δοκοῦσιν (« mais, en privé, à ceux qui étaient considérés comme importants »). Elle maintient la neutralité de « exposé », l’ambiguïté relative au statut des personnes concernées et le contraste entre courir et avoir couru.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T11:37:37Z'
review_pass:
  verdict: revise
  source_fidelity: La traduction rend avec justesse la montée, la révélation comme motif, l’exposé de l’Évangile, les non-Juifs, le caractère privé et la double référence à l’activité présente et passée. Toutefois, πως (« d’une manière ou d’une autre », « peut-être ») n’est pas représenté dans le texte principal. La formulation révisée le restitue et rattache plus directement « en privé » aux personnes réputées.
  naturalness: Le français est globalement moderne et accessible. La double articulation « — mais je l’ai fait… — » est toutefois un peu lourde. « Mais, en privé, à ceux… » restitue plus souplement la restriction introduite par δέ.
  terminology: « Évangile » et « non-Juifs » conviennent au contexte paulinien et au français international moderne. « Ceux qui étaient considérés comme importants » préserve l’idée de réputation sans imposer une fonction officielle ni une ironie marquée.
  issues:
  - severity: medium
    issue: Omission de πως dans la proposition finale.
    rationale: μή πως exprime une crainte nuancée (« de peur que, d’une manière ou d’une autre »). Le texte français « de peur de courir » ne rend pas cette nuance.
  - severity: low
    issue: La construction parenthétique avec « mais je l’ai fait en privé devant… » est plus explicative que la formulation grecque.
    rationale: Le grec associe directement l’exposé privé aux personnes « considérées comme importantes ». Une formulation avec « à ceux » est plus proche de la syntaxe et évite l’ajout d’une seconde proposition.
