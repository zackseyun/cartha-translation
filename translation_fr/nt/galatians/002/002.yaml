  text: ἀνέβην δὲ κατὰ ἀποκάλυψιν· καὶ ἀνεθέμην αὐτοῖς τὸ εὐαγγέλιον ὃ κηρύσσω ἐν τοῖς ἔθνεσιν, κατ’ ἰδίαν δὲ τοῖς δοκοῦσιν, μή πως εἰς κενὸν τρέχω ἢ ἔδραμον.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/002.yaml
  text: But I went up in response to a revelation[a], and I laid before them the gospel that I proclaim among the Gentiles—but privately before those of repute—lest somehow I should be running, or had run[c][b], in vain.
translation:
  language: fr
  text: Mais je suis monté en réponse à une révélation[a], et je leur ai exposé l’Évangile que je proclame parmi les non-Juifs — mais, en privé, à ceux qui étaient considérés comme importants[b] —, de peur que, d’une manière ou d’une autre, je ne coure ou n’aie couru pour rien[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « à cause d’une révélation ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « ceux qui paraissaient influents ».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « de peur que, d’une manière ou d’une autre, je ne sois en train de courir ou n’aie couru pour rien ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέβην
  choice: je suis monté
  rationale: Le verbe signifie simplement « monter ». La destination est fournie par le contexte, mais n’est pas exprimée dans ce verset ; elle n’est donc pas ajoutée.
- source_word: κατὰ ἀποκάλυψιν
  choice: en réponse à une révélation
  rationale: Cette formulation française naturelle indique que la révélation a motivé le déplacement, tout en laissant en note une autre expression possible du rapport causal.
- source_word: ἀνεθέμην
  choice: je leur ai exposé
  rationale: Le verbe désigne ici le fait de mettre une question ou un contenu devant d’autres personnes pour examen. « Exposé » reste neutre et n’implique pas que Paul soumettait son message à une autorité supérieure pour le faire approuver.
- source_word: τὸ εὐαγγέλιον
  choice: l’Évangile
  rationale: « Évangile » est le terme français courant et concis dans ce contexte paulinien ; il désigne ici le message proclamé.
- source_word: ἐν τοῖς ἔθνεσιν
  choice: parmi les non-Juifs
  rationale: Dans ce contexte, ἔθνη désigne les peuples autres que le peuple juif. « Non-Juifs » est plus immédiatement compréhensible en français moderne que « Gentils » et moins ambigu que « nations ».
- source_word: κατ’ ἰδίαν
  choice: en privé
  rationale: La locution indique que cette démarche auprès des personnes mentionnées s’est faite à part, dans un cadre privé.
- source_word: τοῖς δοκοῦσιν
  choice: ceux qui étaient considérés comme importants
  rationale: La formulation conserve l’idée de réputation ou de statut reconnu sans trancher entre une affirmation franche de leur autorité et une possible distance rhétorique de Paul.
- source_word: μή πως εἰς κενὸν τρέχω ἢ ἔδραμον
  choice: de peur de courir ou d’avoir couru pour rien
  rationale: La traduction garde la métaphore de la course, la différence entre l’activité présente et le travail déjà accompli, ainsi que la crainte d’un effort sans résultat.
theological_decisions:
- issue: La présentation privée signifie-t-elle que Paul soumettait son Évangile à l’approbation des responsables de Jérusalem ?
  choice: '« je leur ai exposé » reste neutre : Paul a placé devant eux le message qu’il proclamait, sans que le verbe affirme une subordination doctrinale.'
  alternative: « je leur ai soumis » pourrait suggérer une demande formelle d’autorisation ; à l’inverse, « je les en ai simplement informés » exclurait indûment toute dimension d’examen ou de concertation.
  rationale: Le grec indique une présentation privée liée à la crainte d’une course vaine, mais ne précise pas à lui seul le rapport exact d’autorité. La traduction préserve cette tension.
- issue: Le statut de τοῖς δοκοῦσιν
  choice: « ceux qui étaient considérés comme importants » présente leur importance comme un statut reconnu sans décider du ton exact de Paul.
  alternative: « les principaux responsables » affirmerait plus directement leur fonction officielle, tandis que « ceux qui paraissaient importants » pourrait être entendu comme franchement ironique.
  rationale: Le participe δοκοῦσιν peut évoquer des personnes réputées ou influentes, avec une nuance que le contexte peut rendre légèrement distante. Il convient de ne pas supprimer cette ambiguïté.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la métaphore paulinienne de la course et la parenthèse marquant le caractère privé de la rencontre. « Non-Juifs » évite l’archaïsme de « Gentils » ; « Évangile » garde le vocabulaire biblique courant.
