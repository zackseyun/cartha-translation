id: GAL.2.21
reference: Galatians 2:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὐκ ἀθετῶ τὴν χάριν τοῦ θεοῦ· εἰ γὰρ διὰ νόμου δικαιοσύνη, ἄρα Χριστὸς δωρεὰν ἀπέθανεν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/021.yaml
  text: I do not nullify the grace of God[a], for if righteousness comes through the law[c][b], then Messiah died for nothing.
translation:
  language: fr
  text: Je n’annule pas la grâce de Dieu, car si la justice s’obtient par la loi, alors le Messie est mort pour rien[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « est mort en vain ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀθετῶ
  choice: je n’annule pas
  rationale: « Annuler » exprime ici l’idée de rendre sans effet ou d’invalider, en accord avec la force du verbe dans l’argument de Paul.
- source_word: χάριν
  choice: la grâce
  rationale: « Grâce » est le terme français courant et précis pour la faveur généreuse de Dieu dans ce contexte paulinien.
- source_word: διὰ νόμου
  choice: s’obtient par la loi
  rationale: Le grec omet le verbe; « s’obtient » restitue naturellement en français l’idée implicite d’une justice qui viendrait par le moyen de la loi, sans préciser davantage le mécanisme.
- source_word: δικαιοσύνη
  choice: la justice
  rationale: « Justice » est l’équivalent français normal, capable de désigner ici la juste condition devant Dieu tout en conservant l’étendue sémantique du grec.
- source_word: Χριστὸς
  choice: le Messie
  rationale: Dans cette proposition, Χριστός garde sa valeur de titre; « le Messie » la rend explicitement en français.
- source_word: δωρεὰν
  choice: pour rien
  rationale: Dans cet argument conditionnel, l’adverbe exprime l’inutilité ou l’absence de raison de la mort du Messie; « pour rien » est direct et naturel.
theological_decisions:
- issue: Rapport entre la justice, la loi et la mort du Messie
  choice: La proposition affirme que, si la justice pouvait s’obtenir par la loi, la mort du Messie aurait été inutile.
  alternative: On peut entendre δικαιοσύνη avec une nuance plus large de justice ou de rectification opérée par Dieu.
  rationale: La formulation française conserve la logique conditionnelle de Paul sans expliquer doctrinalement comment la justice est accordée ni réduire le champ de δικαιοσύνη.
translation_notes:
  register: Français international moderne, sobre et digne. La phrase reste concise et suit étroitement la structure argumentative du grec, tout en explicitant par « s’obtient » le verbe sous-entendu.
source_grounding:
  english_pob_role: consult_only
