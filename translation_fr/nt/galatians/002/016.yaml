  to: Sachant pourtant qu’une personne n’est pas déclarée juste sur la base des œuvres de la Loi, mais seulement par la foi en Jésus le Messie[a], nous aussi, nous avons cru en Jésus le Messie, afin d’être déclarés justes par la foi en le Messie[b] et non sur la base des œuvres de la Loi, car sur la base des œuvres de la Loi, aucun être humain[c] ne sera déclaré juste.
  rationale: La seule correction nécessaire remplace « aucune créature humaine » par « aucun être humain ». Elle améliore la fidélité lexicale et l’idiomaticité sans effacer l’arrière-plan biblique de « chair », lequel est maintenu dans la note. Le reste du texte conserve les choix cohérents du projet, y compris le rendu de Χριστός par « Messie » et les deux notes sur le génitif de πίστις Χριστοῦ.
