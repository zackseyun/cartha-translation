id: GAL.2.16
reference: Galatians 2:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἰδότες ⸀δὲ ὅτι οὐ δικαιοῦται ἄνθρωπος ἐξ ἔργων νόμου ἐὰν μὴ διὰ πίστεως ⸂Ἰησοῦ Χριστοῦ⸃, καὶ ἡμεῖς εἰς Χριστὸν Ἰησοῦν ἐπιστεύσαμεν, ἵνα δικαιωθῶμεν ἐκ πίστεως Χριστοῦ καὶ οὐκ ἐξ ἔργων νόμου, ⸂ὅτι ἐξ ἔργων νόμου οὐ δικαιωθήσεται⸃ πᾶσα σάρξ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/016.yaml
  text: Yet knowing that a person is not justified by works of the law except through faith in Jesus the Messiah[a], even we have believed in Messiah Jesus, so that we might be justified by faith in Messiah and not by works of the law[c][b], because by works of the law no flesh will be justified.
translation:
  language: fr
  text: Sachant pourtant qu’une personne n’est pas déclarée juste sur la base des œuvres de la Loi, mais seulement par la foi en Jésus le Messie[a], nous aussi, nous avons cru en Jésus le Messie, afin d’être déclarés justes par la foi en le Messie[b] et non sur la base des œuvres de la Loi, car sur la base des œuvres de la Loi, aucun être humain[c] ne sera déclaré juste.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « par la fidélité de Jésus le Messie ».'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « par la fidélité du Messie ».'
    reason: alternative_reading
  - marker: c
    text: 'Littéralement : « aucune chair »; tournure biblique désignant ici aucun être humain.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δικαιοῦται / δικαιωθῶμεν / δικαιωθήσεται
  choice: est déclarée juste / être déclarés justes / ne sera déclarée juste
  rationale: « Déclarer juste » conserve la dimension judiciaire du verbe grec tout en étant plus transparent en français moderne que le seul terme technique « justifier ».
- source_word: ἄνθρωπος
  choice: une personne
  rationale: Le singulier générique désigne ici tout être humain; « une personne » est naturel et exact en français actuel.
- source_word: ἐξ ἔργων νόμου
  choice: sur la base des œuvres de la Loi
  rationale: La tournure rend la valeur de ἐκ sans réduire l’expression aux bonnes œuvres en général. La majuscule signale ici la Loi biblique dans le raisonnement de Paul.
- source_word: διὰ πίστεως Ἰησοῦ Χριστοῦ
  choice: par la foi en Jésus le Messie
  rationale: Le texte principal adopte la lecture objective du génitif, courante et cohérente avec « nous avons cru en », tout en signalant en note la lecture subjective réellement possible.
- source_word: εἰς Χριστὸν Ἰησοῦν ἐπιστεύσαμεν
  choice: nous avons cru en Jésus le Messie
  rationale: Cette formulation française rend naturellement πιστεύω avec εἰς. L’ordre idiomatique du nom et du titre évite l’expression peu naturelle « Messie Jésus ».
- source_word: ἐκ πίστεως Χριστοῦ
  choice: par la foi en le Messie
  rationale: La même décision est maintenue pour le second génitif, avec l’autre lecture conservée en note.
- source_word: Χριστός
  choice: le Messie
  rationale: Le titre grec est traduit plutôt que simplement translittéré, avec l’article exigé par le français idiomatique.
- source_word: πᾶσα σάρξ
  choice: aucune créature humaine
  rationale: Cette formulation conserve l’arrière-plan biblique de « toute chair » tout en exprimant clairement la portée humaine dans un français compréhensible.
- source_word: εἰδότες δὲ
  choice: sachant pourtant
  rationale: Le participe reste lié au contexte précédent et « pourtant » rend la légère valeur adversative de δέ.
- source_word: ἐὰν μὴ
  choice: mais seulement par
  rationale: Dans cette construction opposant deux bases de justification, la tournure marque nettement l’exclusion sans suggérer que la foi serait une catégorie d’« œuvres de la Loi ».
theological_decisions:
- issue: Sens de πίστις Χριστοῦ / πίστεως Ἰησοῦ Χριστοῦ
  choice: 'Lecture objective : « foi en Jésus le Messie » / « foi en le Messie »'
  alternative: 'Lecture subjective : « fidélité de Jésus le Messie » / « fidélité du Messie »'
  rationale: Le génitif est réellement ambigu. Le texte principal suit la lecture objective, soutenue dans ce contexte par « nous avons cru en », tandis que les notes préservent la lecture subjective sans résoudre silencieusement le débat.
- issue: Valeur de δικαιόω
  choice: « déclarer juste »
  alternative: « justifier » ou « considérer comme juste »
  rationale: « Déclarer juste » préserve la portée judiciaire du terme paulinien sans transformer le verset en paraphrase confessionnelle.
- issue: Portée de ἔργα νόμου
  choice: « œuvres de la Loi »
  alternative: « pratique de la Loi »
  rationale: La formulation littérale maintient l’expression paulinienne et n’en restreint pas arbitrairement la portée à certains commandements ou marqueurs identitaires.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la progression argumentative et les répétitions du grec. « Loi » est capitalisé pour désigner la Loi biblique, et « Messie » traduit Χριστός de manière constante.
