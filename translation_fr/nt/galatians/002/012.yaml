id: GAL.2.12
reference: Galatians 2:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: πρὸ τοῦ γὰρ ἐλθεῖν τινας ἀπὸ Ἰακώβου μετὰ τῶν ἐθνῶν συνήσθιεν· ὅτε δὲ ⸀ἦλθον, ὑπέστελλεν καὶ ἀφώριζεν ἑαυτόν, φοβούμενος τοὺς ἐκ περιτομῆς.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/012.yaml
  text: For before certain men came from James[a], he used to eat with the Gentiles; but when they came, he began to draw back and separate himself[c][b], fearing those of the circumcision.
translation:
  language: fr
  text: En effet, avant l’arrivée de quelques hommes venus de chez Jacques[a], il avait l’habitude de manger avec les non-Juifs ; mais quand ils arrivèrent, il se mit à se retirer et à se tenir à l’écart, par crainte de ceux de la circoncision[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression grecque peut indiquer qu’ils venaient de l’entourage de Jacques ; elle ne précise pas si Jacques les avait officiellement envoyés.
    reason: alternative_reading
  - marker: b
    text: 'Ou : « le groupe de la circoncision ». Littéralement : « ceux de la circoncision ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸ τοῦ ἐλθεῖν
  choice: avant l’arrivée de
  rationale: Cette formulation française naturelle conserve clairement la valeur temporelle de πρό suivi de l’infinitif substantivé.
- source_word: τινας ἀπὸ Ἰακώβου
  choice: quelques hommes venus de chez Jacques
  rationale: « Quelques hommes » garde l’indétermination de τινας. « De chez Jacques » exprime une provenance ou une association sans affirmer que Jacques les avait officiellement envoyés.
- source_word: μετὰ τῶν ἐθνῶν
  choice: avec les non-Juifs
  rationale: Dans ce contexte paulinien, ἔθνη désigne les personnes qui ne sont pas juives. Cette expression est claire en français moderne et n’ajoute pas explicitement qu’elles étaient croyantes.
- source_word: συνήσθιεν
  choice: il avait l’habitude de manger
  rationale: L’imparfait grec décrit ici une pratique habituelle antérieure ; cette tournure en restitue nettement l’aspect.
- source_word: ὑπέστελλεν
  choice: il se mit à se retirer
  rationale: La formulation rend le mouvement de recul exprimé par le verbe et la valeur progressive ou inchoative de l’imparfait dans ce contexte.
- source_word: ἀφώριζεν ἑαυτόν
  choice: à se tenir à l’écart
  rationale: Cette expression naturelle restitue la séparation sociale volontaire et la valeur réfléchie de ἑαυτόν.
- source_word: φοβούμενος
  choice: par crainte de
  rationale: La tournure exprime de manière concise la nuance causale du participe.
- source_word: τοὺς ἐκ περιτομῆς
  choice: les partisans de la circoncision
  rationale: Dans ce contexte, l’expression désigne un groupe défini par son attachement à la circoncision. « Partisans » rend ce sens relationnel sans suggérer que tous les circoncis sont visés.
theological_decisions:
- issue: Le rapport entre les hommes mentionnés et Jacques
  choice: venus de chez Jacques
  alternative: envoyés par Jacques
  rationale: Le grec ἀπὸ Ἰακώβου indique la provenance ou l’association, mais ne précise pas à lui seul que Jacques les avait mandatés ni qu’il approuvait leur position.
- issue: L’identité de τοὺς ἐκ περιτομῆς
  choice: les partisans de la circoncision
  alternative: ceux de la circoncision
  rationale: L’expression française retenue indique un groupe caractérisé par son attachement à la circoncision tout en évitant d’identifier indistinctement ce groupe à l’ensemble des Juifs ou des circoncis.
translation_notes:
  register: 'Français international moderne, digne et accessible. « Non-Juifs » est préféré à « païens » ou « nations » pour désigner clairement les ἔθνη sans connotation dépréciative. Les deux imparfaits grecs décrivant le recul sont rendus comme les étapes liées d’un même comportement : « se retirer » puis « se tenir à l’écart ».'
