  text: μόνον τῶν πτωχῶν ἵνα μνημονεύωμεν, ὃ καὶ ἐσπούδασα αὐτὸ τοῦτο ποιῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/010.yaml
  text: only that we should remember the poor, which was exactly what I was eager to do.
translation:
  language: fr
  text: Ils nous ont seulement demandé de nous souvenir des pauvres, ce que je me suis précisément empressé de faire.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μόνον
  choice: seulement
  rationale: Marque l’unique demande ajoutée à l’accord évoqué; « seulement » est naturel et précis en français.
- source_word: τῶν πτωχῶν
  choice: des pauvres
  rationale: Désigne les personnes pauvres; cette formulation simple conserve le sens concret et collectif du grec.
- source_word: ἵνα μνημονεύωμεν
  choice: de nous souvenir
  rationale: Après μόνον, ἵνα exprime le contenu de la demande. « Se souvenir des pauvres » préserve l’image grecque, qui implique ici une sollicitude concrète.
- source_word: ὃ
  choice: ce que
  rationale: Le pronom relatif reprend l’ensemble de la demande précédente et assure une liaison naturelle en français.
- source_word: ἐσπούδασα
  choice: je me suis empressé
  rationale: Exprime à la fois l’empressement et la mise en œuvre diligente, sans réduire le verbe à une simple disposition intérieure.
- source_word: αὐτὸ τοῦτο ποιῆσαι
  choice: précisément … de faire
  rationale: L’expression intensive souligne que Paul s’est appliqué à faire cette chose même; « précisément » restitue cette insistance avec naturel.
theological_decisions:
- issue: Sujet implicite de la demande
  choice: Ils nous ont seulement demandé
  alternative: Seulement, nous devions nous souvenir
  rationale: Le grec est elliptique et ne comporte pas de verbe explicite de demande, mais le contexte immédiat présente les responsables de Jérusalem comme interlocuteurs. La formulation française explicite sobrement cette relation afin d’éviter une phrase artificielle, sans ajouter de stipulation théologique.
translation_notes:
  register: Français moderne, courant et digne. La formulation conserve « se souvenir des pauvres » tout en rendant explicite l’ellipse grecque. « Se sont empressé de faire » traduit l’ardeur orientée vers l’action.
