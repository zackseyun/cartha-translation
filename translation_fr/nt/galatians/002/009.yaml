id: GAL.2.9
reference: Galatians 2:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ γνόντες τὴν χάριν τὴν δοθεῖσάν μοι, Ἰάκωβος καὶ Κηφᾶς καὶ Ἰωάννης, οἱ δοκοῦντες στῦλοι εἶναι, δεξιὰς ἔδωκαν ἐμοὶ καὶ Βαρναβᾷ κοινωνίας, ἵνα ⸀ἡμεῖς εἰς τὰ ἔθνη, αὐτοὶ δὲ εἰς τὴν περιτομήν·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/009.yaml
  text: and recognizing the grace that had been given to me[a], James and Cephas and John, who were regarded as pillars, gave to Barnabas and me the right hands of fellowship[c][b], so that we would go to the Gentiles and they to the circumcised.
translation:
  language: fr
  text: Reconnaissant la grâce qui m’avait été accordée, Jacques, Céphas[a] et Jean, qui étaient considérés comme des piliers, ont tendu à Barnabas et à moi la main droite en signe de communion[b], afin que nous allions vers les non-Juifs[c], et eux vers les circoncis[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Céphas est le nom araméen de Pierre.
    reason: identification du nom
  - marker: b
    text: 'Littéralement : « ont donné à Barnabas et à moi les mains droites de communion ».'
    reason: idiome et forme littérale
  - marker: c
    text: 'Ou : « les nations »; ici, les peuples non juifs.'
    reason: alternative lexicale
  - marker: d
    text: 'Littéralement : « la circoncision », expression désignant ici les Juifs.'
    reason: métonymie de l’original
lexical_decisions:
- source_word: γνόντες
  choice: Reconnaissant
  rationale: Le participe aoriste exprime ici à la fois la prise de conscience et la reconnaissance de la grâce reçue par Paul, laquelle motive le geste qui suit.
- source_word: χάριν τὴν δοθεῖσάν μοι
  choice: la grâce qui m’avait été accordée
  rationale: « Grâce » conserve la portée théologique habituelle de χάρις chez Paul sans la réduire à une fonction apostolique précise. Le plus-que-parfait marque naturellement l’antériorité du don.
- source_word: Κηφᾶς
  choice: Céphas
  rationale: La traduction conserve le nom employé dans le texte grec plutôt que de lui substituer Pierre.
- source_word: οἱ δοκοῦντες στῦλοι εἶναι
  choice: qui étaient considérés comme des piliers
  rationale: Cette formulation rend leur statut reconnu sans donner artificiellement à δοκοῦντες une nuance méprisante ou dubitative.
- source_word: δεξιὰς ἔδωκαν ... κοινωνίας
  choice: ont tendu ... la main droite en signe de communion
  rationale: La tournure française exprime naturellement le geste d’accord et de solidarité représenté par les mains droites données. « Communion » garde l’idée de participation et d’engagement partagé portée par κοινωνία.
- source_word: τὰ ἔθνη
  choice: les non-Juifs
  rationale: Dans ce contraste avec la circoncision, ἔθνη désigne les peuples autres que le peuple juif plutôt que des États ou nations au sens politique.
- source_word: τὴν περιτομήν
  choice: les circoncis
  rationale: Le nom abstrait est employé par métonymie pour désigner les Juifs; cette traduction rend le référent intelligible tout en conservant l’image du texte.
theological_decisions:
- issue: Portée de κοινωνία dans le geste des mains droites
  choice: communion
  alternative: collaboration; partenariat
  rationale: Le contexte comprend un accord sur les champs de mission, mais κοινωνία est plus large qu’une simple répartition administrative. « Communion » préserve l’idée d’une participation et d’une solidarité reconnues sans imposer une structure institutionnelle précise.
- issue: Nuance de οἱ δοκοῦντες στῦλοι εἶναι
  choice: qui étaient considérés comme des piliers
  alternative: qui paraissaient être des piliers
  rationale: La formule peut lexicalement évoquer ce qui paraît ou ce qui est réputé. Ici, elle indique le statut reconnu des trois hommes; la traduction évite cependant d’affirmer que Paul ratifie lui-même un titre officiel.
- issue: Nature de la répartition entre les deux groupes
  choice: afin que nous allions vers les non-Juifs, et eux vers les circoncis
  alternative: pour que les non-Juifs nous soient confiés, et les circoncis à eux
  rationale: Le grec laisse le verbe de mouvement sous-entendu après εἰς. La traduction explicite seulement l’ellipse nécessaire en français, sans présenter l’accord comme une séparation ethnique absolue ou exclusive.
translation_notes:
  register: Français international actuel, digne et accessible. La phrase conserve la progression du grec tout en rendant idiomatiquement le geste des mains droites et l’ellipse du verbe de mouvement. « Non-Juifs » est préféré à « païens » pour éviter des connotations modernes étrangères au contraste ethnique du passage.
