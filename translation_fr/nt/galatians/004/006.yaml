id: GAL.4.6
reference: Galatians 4:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὅτι δέ ἐστε υἱοί, ἐξαπέστειλεν ὁ θεὸς τὸ πνεῦμα τοῦ υἱοῦ αὐτοῦ εἰς τὰς καρδίας ⸀ἡμῶν, κρᾶζον· Αββα ὁ πατήρ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/006.yaml
  text: And because you are sons[a], God sent the Spirit of his Son into our hearts, crying, “Abba[c][b], Father.”
translation:
  language: fr
  text: 'Et parce que vous êtes des fils[a], Dieu a envoyé dans nos cœurs[b] l’Esprit de son Fils, qui crie : « Abba[c], Père ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot « fils » conserve ici le langage de Paul sur la filiation et l’héritage ; dans ce contexte, il englobe tous les croyants, hommes et femmes.
    reason: cultural_note
  - marker: b
    text: Certains manuscrits portent « vos cœurs » au lieu de « nos cœurs ».
    reason: textual_variant
  - marker: c
    text: Abba est une forme araméenne employée pour s’adresser à son père ; elle est conservée ici, suivie de son équivalent grec, « Père ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι δέ
  choice: Et parce que
  rationale: ὅτι donne la raison de l’action qui suit, tandis que δέ assure une liaison légère avec le développement précédent. « Et parce que » conserve ces deux fonctions sans alourdir la phrase.
- source_word: ἐστε
  choice: vous êtes
  rationale: Le présent de εἰμί décrit ici le statut actuel des destinataires, sur lequel Paul fonde l’action de Dieu.
- source_word: υἱοί
  choice: des fils
  rationale: Le grec emploie explicitement le terme « fils », lié dans le contexte au statut filial et à l’héritage. Ce choix préserve cette image juridique et théologique, qui englobe ici tous les croyants.
- source_word: ἐξαπέστειλεν
  choice: a envoyé
  rationale: L’aoriste présente l’envoi comme une action accomplie. « A envoyé » est naturel en français et rend suffisamment le verbe sans emphase ajoutée.
- source_word: τὸ πνεῦμα τοῦ υἱοῦ αὐτοῦ
  choice: l’Esprit de son Fils
  rationale: Cette formulation conserve directement la relation exprimée par le génitif ainsi que le poids théologique de l’expression.
- source_word: εἰς τὰς καρδίας ἡμῶν
  choice: dans nos cœurs
  rationale: La traduction garde le terme anthropologique biblique « cœurs » et suit la leçon ἡμῶν du SBLGNT.
- source_word: κρᾶζον
  choice: qui crie
  rationale: Le participe neutre singulier se rapporte grammaticalement à « l’Esprit ». La proposition relative française rend explicite ce lien et conserve la vigueur du verbe.
- source_word: Αββα
  choice: Abba
  rationale: Cette forme araméenne insérée dans le texte grec est translittérée afin de conserver la forme originale de l’adresse.
- source_word: ὁ πατήρ
  choice: Père
  rationale: Bien que l’article soit présent en grec, l’expression fonctionne comme une adresse en apposition à « Abba » ; le français idiomatique dit donc « Père ».
theological_decisions:
- issue: Traduction de υἱοί dans le contexte de la filiation et de l’héritage
  choice: des fils
  alternative: des enfants
  rationale: L’argument de Galates 3–4 repose sur le statut de fils donnant accès à l’héritage. « Fils » préserve cette continuité conceptuelle sans limiter la référence aux hommes, comme l’indique la note.
- issue: Variante textuelle du possessif avec « cœurs »
  choice: nos cœurs
  alternative: vos cœurs
  rationale: Le texte SBLGNT fourni porte ἡμῶν, « nos ». La variante « vos » est signalée en note en raison de son importance dans la tradition manuscrite.
- issue: Sujet du cri
  choice: l’Esprit crie
  alternative: les croyants crient par l’Esprit
  rationale: 'Le participe κρᾶζον s’accorde grammaticalement avec τὸ πνεῦμα : dans cette proposition, l’Esprit est donc explicitement celui qui crie, même si son cri exprime aussi l’adresse filiale des croyants.'
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe place « l’Esprit de son Fils » immédiatement avant « qui crie » afin d’identifier sans ambiguïté le sujet du cri. Les guillemets français et l’espace avant les deux-points suivent les conventions typographiques françaises.
