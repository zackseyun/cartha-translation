source:
  edition: SBLGNT
  text: νῦν δὲ γνόντες θεόν, μᾶλλον δὲ γνωσθέντες ὑπὸ θεοῦ, πῶς ἐπιστρέφετε πάλιν ἐπὶ τὰ ἀσθενῆ καὶ πτωχὰ στοιχεῖα, οἷς πάλιν ἄνωθεν ⸀δουλεύειν θέλετε;
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/009.yaml
  text: But now[a], having come to know God—or rather, having been known by God—how can you turn back again to the weak and poor elemental principles, to which you want to be enslaved all over again?
translation:
  language: fr
  text: Mais maintenant que vous en êtes venus à connaître Dieu — ou plutôt que Dieu vous a connus —, comment pouvez-vous retourner encore à ces principes élémentaires faibles et pauvres, dont vous voulez redevenir esclaves ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γνόντες θεόν
  choice: maintenant que vous connaissez Dieu
  rationale: Le participe aoriste marque ici l’entrée dans la connaissance de Dieu. Une subordonnée temporelle est plus naturelle en français qu’un participe composé, tout en gardant le lien avec la question principale.
- source_word: μᾶλλον δὲ γνωσθέντες ὑπὸ θεοῦ
  choice: ou plutôt que vous êtes connus de Dieu
  rationale: « Ou plutôt » rend la correction introduite par μᾶλλον δέ. Le passif explicite conserve la priorité donnée à l’action et à la relation de Dieu, sans préciser davantage la nature de cette connaissance.
- source_word: πῶς ἐπιστρέφετε πάλιν
  choice: comment pouvez-vous retourner encore
  rationale: La tournure exprime l’étonnement réprobateur de Paul. « Retourner encore » garde l’idée de retour et la répétition soulignée par πάλιν.
- source_word: τὰ ἀσθενῆ καὶ πτωχὰ στοιχεῖα
  choice: ces faibles et pauvres éléments du monde
  rationale: « Éléments du monde » est une expression française ouverte qui peut désigner les composantes ou principes fondamentaux de l’ordre ancien, voire les puissances élémentaires. Les adjectifs « faibles et pauvres » rendent directement ἀσθενῆ καὶ πτωχά.
- source_word: οἷς
  choice: dont
  rationale: Le relatif neutre pluriel renvoie aux στοιχεῖα. En français, « dont devenir esclaves » exprime naturellement la dépendance à leur égard sans les personnaliser.
- source_word: πάλιν ἄνωθεν
  choice: de nouveau
  rationale: L’expression grecque insiste sur une reprise depuis le commencement. « De nouveau », renforcé dans la phrase par « retourner encore », transmet la répétition sans lourdeur excessive.
- source_word: δουλεύειν θέλετε
  choice: vous voulez de nouveau devenir esclaves
  rationale: δουλεύειν désigne la condition ou le service d’un esclave, et θέλετε la volonté. « Devenir esclaves » convient au mouvement de retour vers une servitude antérieure.
theological_decisions:
- issue: Sens de στοιχεῖα en Galates 4.9
  choice: éléments du monde
  alternative: principes élémentaires ; puissances élémentaires ; rudiments
  rationale: Le terme peut renvoyer aux principes fondamentaux de l’ancien ordre religieux ou à des puissances cosmiques. Le texte principal conserve cette ouverture, tandis que la note signale les principales possibilités.
- issue: Portée de « connus de Dieu »
  choice: maintien explicite du passif et de la correction
  alternative: accent uniquement relationnel, sans priorité implicite de l’initiative divine
  rationale: μᾶλλον δέ corrige réellement l’énoncé précédent. La formulation garde l’accent sur le fait que Dieu les connaît, sans importer un système doctrinal extérieur au verset.
translation_notes:
  register: Français international moderne, naturel et digne. La question rhétorique conserve le ton d’étonnement et de reproche. L’expression contestée στοιχεῖα reste volontairement ouverte, avec ses principales interprétations en note.
