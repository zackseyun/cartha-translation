revisions:
- from: Mais maintenant que vous connaissez Dieu — ou plutôt que vous êtes connus de Dieu —, comment pouvez-vous retourner encore à ces faibles et pauvres éléments du monde[a], dont vous voulez de nouveau devenir esclaves ?
  to: Mais maintenant que vous en êtes venus à connaître Dieu — ou plutôt que Dieu vous a connus —, comment pouvez-vous retourner encore à ces principes élémentaires faibles et pauvres, dont vous voulez redevenir esclaves ?
  rationale: La correction retire l’ajout non exprimé « du monde », rend les deux aoristes sans alourdir la phrase, et conserve l’ambiguïté de στοιχεῖα dans le texte comme dans la note. La formulation « retourner encore » puis « redevenir esclaves » reflète les deux expressions grecques qui soulignent la répétition.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T11:37:42Z'
review_pass:
  verdict: revise
  source_fidelity: 'La mention « du monde » n’apparaît pas dans le grec de 4.9 : elle semble être importée de l’expression apparentée de 4.3 et restreint indûment στοιχεῖα. Le participe aoriste γνόντες et le passif aoriste γνωσθέντες sont mieux rendus par « en êtes venus à connaître » et « Dieu vous a connus ». La double insistance πάλιν / πάλιν ἄνωθεν est conservée par « retourner encore » et « redevenir esclaves ».'
  naturalness: La révision garde une phrase française moderne et fluide. « Principes élémentaires » est naturel dans un registre biblique contemporain; « redevenir esclaves » est plus direct et idiomatique que « dont vous voulez de nouveau devenir esclaves ».
  terminology: « Principes élémentaires » rend στοιχεῖα sans ajouter « monde » ni trancher entre principes, éléments et puissances. La note conserve les options pertinentes. « Esclaves » maintient l’image forte de δουλεύειν.
  issues:
  - severity: medium
    issue: « éléments du monde » ajoute « du monde » au texte principal.
    rationale: Le grec de ce verset porte seulement τὰ ... στοιχεῖα. Bien que « éléments du monde » soit présent dans le contexte proche (4.3), son insertion ici ajoute un déterminant absent et peut orienter l’interprétation du terme disputé.
  - severity: low
    issue: Les formes verbales « vous connaissez / vous êtes connus » atténuent les aoristes grecs.
    rationale: Le présent français peut se défendre dans une formulation temporelle, mais « en êtes venus à connaître / Dieu vous a connus » rend plus précisément l’entrée dans cette connaissance et la correction marquée par μᾶλλον δέ.
  revised_text: Mais maintenant que vous en êtes venus à connaître Dieu — ou plutôt que Dieu vous a connus —, comment pouvez-vous retourner encore à ces principes élémentaires faibles et pauvres, dont vous voulez redevenir esclaves ?
  revised_footnotes:
  - marker: a
    text: Ou « éléments », « puissances élémentaires » ou « rudiments » pour στοιχεῖα.
    reason: 'Alternative lexicale : le sens de ce terme grec est débattu dans ce contexte.'
  revision_rationale: La correction retire l’ajout non exprimé « du monde », rend les deux aoristes sans alourdir la phrase, et conserve l’ambiguïté de στοιχεῖα dans le texte comme dans la note. La formulation « retourner encore » puis « redevenir esclaves » reflète les deux expressions grecques qui soulignent la répétition.
