reference: Galatians 4:27
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: γέγραπται γάρ· Εὐφράνθητι, στεῖρα ἡ οὐ τίκτουσα, ῥῆξον καὶ βόησον, ἡ οὐκ ὠδίνουσα· ὅτι πολλὰ τὰ τέκνα τῆς ἐρήμου μᾶλλον ἢ τῆς ἐχούσης τὸν ἄνδρα.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/027.yaml
  text: 'For it is written: “Rejoice[a], barren woman who is not bearing children; break forth and cry out, you who are not in labor[c][b]; because the children of the desolate woman are more numerous than those of the woman who has a husband.”'
translation:
  language: fr
  text: 'Car il est écrit : « Réjouis-toi, femme stérile, toi qui n’enfantes pas ! Éclate et pousse des cris, toi qui ne connais pas les douleurs de l’enfantement ! Les enfants de la femme délaissée sont plus nombreux que ceux de la femme qui a un mari. »[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Citation d’Ésaïe 54.1.
    reason: cross_reference
  - marker: b
    text: 'Ou : « Éclate et crie » ; le mot traduit par « délaissée » peut aussi signifier « abandonnée » ou « désolée » dans ce contexte figuré.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γέγραπται
  choice: il est écrit
  rationale: Formule française consacrée pour introduire une citation de l’Écriture; le parfait grec présente l’écrit comme toujours valable.
- source_word: Εὐφράνθητι
  choice: Réjouis-toi
  rationale: Impératif direct et naturel qui conserve le ton prophétique de l’appel.
- source_word: στεῖρα ἡ οὐ τίκτουσα
  choice: femme stérile, toi qui n’enfantes pas
  rationale: L’adjectif substantivé désigne la femme interpellée; la proposition participiale maintient le parallélisme et l’idée de ne pas mettre au monde.
- source_word: ῥῆξον καὶ βόησον
  choice: Éclate en cris de joie
  rationale: L’expression grecque décrit le jaillissement soudain d’un cri. Le complément « de joie », implicite dans le contexte de l’appel à se réjouir, donne une tournure française idiomatique sans réduire l’intensité.
- source_word: ἡ οὐκ ὠδίνουσα
  choice: toi qui ne connais pas les douleurs de l’accouchement
  rationale: ὠδίνω renvoie précisément aux douleurs du travail; cette formulation est claire en français moderne et conserve l’image maternelle.
- source_word: πολλὰ τὰ τέκνα ... μᾶλλον ἢ
  choice: les enfants ... sont plus nombreux que ceux
  rationale: Rend explicitement et naturellement en français la comparaison quantitative exprimée par μᾶλλον ἢ.
- source_word: τῆς ἐρήμου
  choice: de la femme délaissée
  rationale: Dans cette image personnelle, ἔρημος peut évoquer une femme laissée seule, abandonnée ou privée de mari; « délaissée » conserve cette nuance sans la confondre avec la stérilité.
- source_word: τῆς ἐχούσης τὸν ἄνδρα
  choice: de la femme qui a un mari
  rationale: Rendu proche de la structure grecque, il préserve le contraste avec la femme délaissée plutôt que de généraliser en « femme mariée ».
theological_decisions:
- issue: Citation d’Ésaïe 54.1 dans l’argument allégorique de Galates 4
  choice: Traduire l’image prophétique telle qu’elle est citée, sans identifier explicitement la femme à Sara ou à la Jérusalem d’en haut.
  alternative: Introduire dans le verset une identification explicite avec Sara ou la Jérusalem d’en haut.
  rationale: Le texte présente d’abord une citation scripturaire; c’est le contexte argumentatif de Paul qui en fournit l’application. La traduction ne doit pas intégrer cette interprétation à la citation elle-même.
- issue: Sens figuré de τῆς ἐρήμου
  choice: la femme délaissée
  alternative: la femme désolée / abandonnée
  rationale: « Délaissée » exprime naturellement l’isolement relationnel suggéré par le contraste avec celle qui a un mari, tout en laissant subsister la portée figurée.
translation_notes:
  register: Français international moderne, digne et accessible. La cadence poétique de la citation est conservée par les impératifs et le parallélisme. Les marqueurs de notes sont placés à la fin de la citation, dans l’ordre [a][b].
