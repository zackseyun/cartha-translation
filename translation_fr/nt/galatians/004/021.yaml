id: GAL.4.21
reference: Galatians 4:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Λέγετέ μοι, οἱ ὑπὸ νόμον θέλοντες εἶναι, τὸν νόμον οὐκ ἀκούετε;
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/021.yaml
  text: Tell me[a], you who want to be under the law, do you not listen to the law?
translation:
  language: fr
  text: 'Dites-moi, vous qui voulez être sous la loi : n’écoutez-vous pas la loi[a] ?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « n’entendez-vous pas la loi ? » Le verbe grec peut signifier « entendre » ou « écouter ». Ici, « la loi » renvoie probablement à la loi de Moïse, en particulier au récit scripturaire que Paul cite ensuite.'
    reason: alternative lexicale et précision référentielle
lexical_decisions:
- source_word: Λέγετέ μοι
  choice: Dites-moi
  rationale: L’impératif présent pluriel introduit une interpellation directe. « Dites-moi » est idiomatique en français actuel et conserve la force de la sommation.
- source_word: οἱ ὑπὸ νόμον θέλοντες εἶναι
  choice: vous qui voulez être sous la loi
  rationale: La tournure désigne le groupe caractérisé par ce désir. « Être sous la loi » conserve l’image juridique et l’expression paulinienne sans l’expliciter indûment.
- source_word: νόμον / τὸν νόμον
  choice: la loi
  rationale: La répétition du même terme préserve le jeu entre le régime sous lequel les destinataires veulent se placer et le texte scripturaire auquel Paul va faire appel. La minuscule maintient l’amplitude du terme tout en laissant le contexte désigner la loi mosaïque.
- source_word: οὐκ ἀκούετε
  choice: n’écoutez-vous pas
  rationale: ἀκούω peut exprimer le fait d’entendre ou celui d’écouter avec attention. Ici, « écouter » convient à l’appel à prêter attention au témoignage de la loi, sans exclure entièrement la nuance plus simple d’« entendre », signalée en note.
theological_decisions:
- issue: Référence et portée du mot « loi »
  choice: Employer « la loi » avec une minuscule dans les deux occurrences
  alternative: Employer « la Loi » pour identifier explicitement la Torah mosaïque
  rationale: Paul joue sur νόμος comme régime auquel certains veulent être soumis et comme Écriture dont il va citer le récit. La minuscule évite de résoudre trop vite cette tension, tandis que le contexte rend la référence mosaïque perceptible.
- issue: Portée de ἀκούω appliqué à la loi
  choice: « écouter » dans le texte principal
  alternative: « entendre »
  rationale: « Écouter » met en relief l’attention que requiert l’argument scripturaire qui suit, mais la note conserve le sens auditif plus direct possible dans le grec.
translation_notes:
  register: Français moderne, direct et digne. Les deux occurrences de « loi » sont maintenues afin de préserver la reprise rhétorique de Paul. Les deux-points rendent naturelle l’interpellation suivie de la question.
