id: GAL.4.29
reference: Galatians 4:29
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀλλ’ ὥσπερ τότε ὁ κατὰ σάρκα γεννηθεὶς ἐδίωκε τὸν κατὰ πνεῦμα, οὕτως καὶ νῦν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/029.yaml
  text: But just as then the one born according to the flesh persecuted the one born according to the Spirit[b][a], so also it is now.
translation:
  language: fr
  text: Mais, tout comme à cette époque celui qui était né selon la chair persécutait celui qui était né selon l’Esprit[a], il en est de même maintenant.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « celui selon l’Esprit » ; le verbe « naître » est sous-entendu dans ce second membre. « Selon la chair » peut ici se comprendre comme « par les moyens humains ordinaires ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: Mais
  rationale: Marque le contraste avec l’explication précédente de Paul, de manière naturelle et concise en français.
- source_word: ὥσπερ τότε ... οὕτως καὶ νῦν
  choice: tout comme à cette époque ... il en est de même maintenant
  rationale: Conserve la structure comparative et le contraste temporel du grec tout en rendant explicitement l’ellipse finale dans un français idiomatique.
- source_word: ὁ ... γεννηθεὶς
  choice: celui qui était né
  rationale: Rend le participe aoriste passif substantivé par une tournure nominale naturelle. La même expression est reprise dans le second membre pour expliciter le parallèle.
- source_word: κατὰ σάρκα
  choice: selon la chair
  rationale: Préserve le vocabulaire et le contraste pauliniens sans réduire la locution à une valeur purement instrumentale. Ici, la chair renvoie à la naissance humaine ordinaire plutôt qu’à une nature pécheresse.
- source_word: ἐδίωκε
  choice: persécutait
  rationale: Exprime l’hostilité visée par διώκω et respecte la valeur passée, possiblement durative ou habituelle, de l’imparfait.
- source_word: τὸν κατὰ πνεῦμα
  choice: celui qui était né selon l’Esprit
  rationale: Le verbe « naître », sous-entendu dans le second membre grec, est repris pour clarifier le parallélisme en français. « Selon » maintient l’ambiguïté relationnelle de κατά mieux que le seul instrumental « par ».
- source_word: πνεῦμα
  choice: Esprit
  rationale: Dans ce contexte de la promesse et du contraste avec la chair, le terme désigne vraisemblablement l’Esprit Saint; la majuscule signale ce jugement contextuel.
- source_word: νῦν
  choice: maintenant
  rationale: Rend simplement l’adverbe temporel qui applique à la situation présente le modèle évoqué.
theological_decisions:
- issue: Sens de κατὰ σάρκα dans le contraste entre Ismaël et Isaac
  choice: « selon la chair », compris comme une naissance par les moyens humains ordinaires
  alternative: « par des moyens purement humains » ou, à tort dans ce contexte, « selon la nature pécheresse »
  rationale: Le contexte immédiat, notamment Galates 4.23, oppose la naissance naturelle à celle qui dépend de la promesse. La formulation littérale conserve néanmoins le réseau lexical et la tension théologique de Paul.
- issue: Référent de πνεῦμα
  choice: L’Esprit Saint
  alternative: l’esprit humain ou un principe spirituel
  rationale: Dans l’argument de Galates, l’Esprit est associé à l’accomplissement de la promesse et à l’identité présente des croyants. La majuscule reflète cette lecture sans paraphraser le texte.
- issue: Verbe sous-entendu dans τὸν κατὰ πνεῦμα
  choice: Répéter « était né » dans le second membre
  alternative: Traduire littéralement « celui selon l’Esprit »
  rationale: Le grec sous-entend le participe du premier membre. Sa répétition en français rend le parallèle intelligible sans ajouter de contenu conceptuel.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme est conservé, avec explicitation minimale de l’ellipse grecque. « Chair » et « Esprit » maintiennent le vocabulaire théologique de Paul sans en aplanir le contraste.
