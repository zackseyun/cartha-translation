id: GAL.4.1
reference: Galatians 4:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Λέγω δέ, ἐφ’ ὅσον χρόνον ὁ κληρονόμος νήπιός ἐστιν, οὐδὲν διαφέρει δούλου κύριος πάντων ὤν,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/001.yaml
  text: I say that as long as the heir is a child[a], he differs in nothing from a servant, though he is lord of all[b],
translation:
  language: fr
  text: 'Voici ce que je veux dire : tant que l’héritier est un enfant[a], il ne diffère en rien d’un esclave[b], bien qu’il soit maître de tout,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un mineur ». Le grec peut désigner un enfant encore immature et, dans ce contexte, une personne mineure.
    reason: lexical_alternative
  - marker: b
    text: Ou « un serviteur ». Le grec désigne souvent un esclave ou une personne asservie ; « esclave » conserve ici la force de la comparaison de Paul.
    reason: lexical_alternative
lexical_decisions:
- source_word: Λέγω δέ
  choice: Voici ce que je veux dire
  rationale: Cette formule française naturelle introduit l’explication que Paul va donner. Elle rend la légère transition marquée par δέ sans lui attribuer une valeur temporelle ni un contraste trop appuyé.
- source_word: ἐφ’ ὅσον χρόνον
  choice: tant que
  rationale: L’expression indique une durée qui se prolonge jusqu’à une limite; « tant que » la rend avec précision et concision.
- source_word: ὁ κληρονόμος
  choice: l’héritier
  rationale: « Héritier » est le terme français courant pour la personne appelée à recevoir un héritage.
- source_word: νήπιός
  choice: un enfant
  rationale: νήπιος peut désigner un jeune enfant ou, plus largement ici, une personne qui n’a pas encore atteint l’âge requis. « Un enfant » reste naturel sans préciser excessivement son âge.
- source_word: οὐδὲν διαφέρει
  choice: il ne diffère en rien
  rationale: Cette formulation proche du grec exprime qu’en pratique aucune différence n’est perceptible dans la situation décrite.
- source_word: δούλου
  choice: d’un esclave
  rationale: δοῦλος désigne ici une personne asservie. « Esclave » conserve la force du contraste entre le statut futur de l’héritier et son absence présente d’autonomie.
- source_word: κύριος πάντων ὤν
  choice: bien qu’il soit maître de tout
  rationale: « Maître » exprime ici la possession ou l’autorité, et non un titre divin. « Bien que » explicite la valeur concessive naturelle du participe dans ce contexte.
theological_decisions:
- issue: Traduction de δοῦλος dans la comparaison de Paul
  choice: esclave
  alternative: serviteur
  rationale: La comparaison repose sur l’absence temporaire d’autonomie de l’héritier. « Esclave » rend clairement la condition de dépendance évoquée par δοῦλος, tandis que « serviteur » pourrait atténuer cette force.
translation_notes:
  register: Français international moderne, clair et digne. La tournure introductive est idiomatique, tandis que « il ne diffère en rien » garde une proximité mesurée avec la formulation grecque. Le marqueur de la seconde note est placé après « esclave », le mot auquel elle se rapporte.
