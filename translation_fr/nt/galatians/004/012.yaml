  text: Γίνεσθε ὡς ἐγώ, ὅτι κἀγὼ ὡς ὑμεῖς, ἀδελφοί, δέομαι ὑμῶν. οὐδέν με ἠδικήσατε·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/012.yaml
  text: Become as I am[a], because I also am as you are, brothers; I beg you[c][b], you did me no wrong.
translation:
  language: fr
  text: 'Devenez comme moi, puisque moi aussi je suis comme vous[a]. Frères, je vous en prie : vous ne m’avez fait aucun tort.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec ne comporte pas de verbe dans cette proposition. Autre traduction possible : « puisque moi aussi je suis devenu comme vous ».'
    reason: alternative_reading
lexical_decisions:
- source_word: Γίνεσθε ὡς ἐγώ
  choice: Devenez comme moi
  rationale: L’impératif présent de γίνομαι appelle les destinataires à adopter une manière d’être; « devenez » en garde le caractère dynamique, tandis que « comme moi » exprime naturellement la comparaison en français.
- source_word: ὅτι κἀγὼ ὡς ὑμεῖς
  choice: puisque moi aussi je suis comme vous
  rationale: ὅτι donne ici le motif de l’appel. La proposition grecque est elliptique, sans verbe exprimé; « je suis » fournit en français une lecture sobre qui ne tranche pas implicitement en faveur d’un changement passé.
- source_word: ἀδελφοί
  choice: frères et sœurs
  rationale: Dans cette adresse aux assemblées de Galatie, le pluriel désigne vraisemblablement l’ensemble de la communauté croyante. « Frères et sœurs » en rend clairement la portée collective dans le français contemporain; une note signale la forme masculine du grec.
- source_word: δέομαι ὑμῶν
  choice: je vous en prie
  rationale: δέομαι avec le génitif exprime une demande pressante. « Je vous en prie » conserve l’intensité de l’appel sans registre archaïque.
- source_word: οὐδέν με ἠδικήσατε
  choice: Vous ne m’avez fait aucun tort
  rationale: Cette formulation française directe rend οὐδέν avec ἀδικέω et conserve με comme personne lésée. Le passé composé convient naturellement au récit d’un fait passé ayant une pertinence présente.
theological_decisions:
- issue: Portée de l’adresse ἀδελφοί
  choice: « frères et sœurs » dans le texte, avec une note sur la forme grecque
  alternative: « frères » seulement
  rationale: Le masculin pluriel grec peut servir d’adresse à toute la communauté. Le français moderne « frères et sœurs » rend cette portée probable sans prétendre que deux substantifs distincts figurent dans le texte source.
- issue: Verbe sous-entendu dans κἀγὼ ὡς ὑμεῖς
  choice: « je suis comme vous »
  alternative: « je suis devenu comme vous »
  rationale: Le grec ne répète aucun verbe. La traduction principale évite d’imposer l’idée d’un changement passé, tandis que la note conserve cette interprétation contextuellement plausible.
translation_notes:
  register: Français international actuel, naturel et digne. Le tiret met en relief l’appel pressant « je vous en prie » tout en conservant l’ordre général du grec; la dernière phrase reste nette et indépendante.
