id: GAL.4.2
reference: Galatians 4:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀλλὰ ὑπὸ ἐπιτρόπους ἐστὶ καὶ οἰκονόμους ἄχρι τῆς προθεσμίας τοῦ πατρός.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/002.yaml
  text: but he is under guardians and stewards until the time set by his father[a][b].
translation:
  language: fr
  text: mais il est sous l’autorité de tuteurs et d’intendants[a] jusqu’à la date fixée par son père[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « administrateurs » ; le terme grec désigne ceux qui gèrent une maison ou un domaine.
    reason: lexical_alternative
  - marker: b
    text: Ou « jusqu’au moment fixé par le père ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: mais
  rationale: La conjonction marque le contraste avec la situation décrite au verset précédent; « mais » est naturel et direct en français.
- source_word: ὑπὸ
  choice: sous l’autorité de
  rationale: Avec l’accusatif, la préposition exprime ici la soumission à une autorité ou à une surveillance. Cette formulation explicite le rapport sans alourdir la phrase.
- source_word: ἐπιτρόπους
  choice: tuteurs
  rationale: Le terme désigne des personnes chargées de veiller sur un mineur. « Tuteurs » convient au contexte juridique et familial de l’héritier encore enfant.
- source_word: ἐστὶ
  choice: il est
  rationale: Le pronom reprend le sujet sous-entendu du verset précédent, l’héritier.
- source_word: καὶ
  choice: et
  rationale: La conjonction relie simplement les deux catégories de responsables.
- source_word: οἰκονόμους
  choice: intendants
  rationale: Le mot désigne ceux qui administrent une maison, des biens ou un domaine. « Intendants » conserve cette nuance historique de gestion domestique ou patrimoniale.
- source_word: ἄχρι
  choice: jusqu’à
  rationale: La préposition indique la limite temporelle de cette situation.
- source_word: τῆς προθεσμίας
  choice: la date fixée
  rationale: Le nom désigne un moment déterminé à l’avance. « La date fixée » est précis, naturel et adapté au cadre juridique de l’image.
- source_word: τοῦ πατρός
  choice: par son père
  rationale: Le génitif indique vraisemblablement que le père est celui qui fixe la date; « son » rend explicite le lien familial déjà présent dans l’analogie.
theological_decisions:
- issue: Valeur du génitif dans τοῦ πατρός
  choice: « par son père », le père étant celui qui fixe la date
  alternative: « du père », formulation plus littérale qui laisse le rapport syntaxique moins explicite
  rationale: Dans l’image d’un héritier mineur placé sous surveillance, le père détermine naturellement la date prévue. Ce choix contextuel n’ajoute aucune affirmation doctrinale.
translation_notes:
  register: Français international moderne, clair et digne. Le vocabulaire « tuteurs » et « intendants » maintient la distinction entre la surveillance personnelle du mineur et l’administration de la maison ou du patrimoine.
