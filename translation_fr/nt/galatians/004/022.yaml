id: GAL.4.22
reference: Galatians 4:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: γέγραπται γὰρ ὅτι Ἀβραὰμ δύο υἱοὺς ἔσχεν, ἕνα ἐκ τῆς παιδίσκης καὶ ἕνα ἐκ τῆς ἐλευθέρας·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/022.yaml
  text: For it is written that Abraham had two sons[a], one by the servant woman and one by the free woman.
translation:
  language: fr
  text: Car il est écrit qu’Abraham a eu deux fils, l’un de la femme esclave et l’autre de la femme libre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γέγραπται
  choice: il est écrit
  rationale: Formule française consacrée qui rend naturellement le parfait passif et signale l’autorité durable du texte scripturaire.
- source_word: γὰρ
  choice: car
  rationale: Conserve le lien explicatif avec l’argument précédent dans un registre courant et digne.
- source_word: ὅτι
  choice: que
  rationale: Introduit directement en français le contenu de ce qui est écrit.
- source_word: Ἀβραὰμ
  choice: Abraham
  rationale: Forme française traditionnelle du nom propre.
- source_word: δύο υἱοὺς
  choice: deux fils
  rationale: υἱούς désigne précisément des fils, et non simplement des enfants.
- source_word: ἔσχεν
  choice: a eu
  rationale: Expression française naturelle pour indiquer ici la paternité, sans expliciter davantage que le grec.
- source_word: ἕνα ... καὶ ἕνα
  choice: l’un ... et l’autre
  rationale: Tour idiomatique français qui préserve la structure parallèle et l’opposition entre les deux fils.
- source_word: ἐκ
  choice: de
  rationale: Dans « avoir un fils de telle femme », la préposition française exprime naturellement la filiation maternelle tout en restant proche de la formulation grecque.
- source_word: παιδίσκης
  choice: femme esclave
  rationale: Le terme désigne une servante ou esclave; « femme esclave » rend explicite le statut de non-liberté qui structure l’argument de Paul, sans la connotation juvénile possible de « jeune servante ».
- source_word: ἐλευθέρας
  choice: femme libre
  rationale: L’adjectif substantivé désigne une femme de condition libre; cette formulation maintient le contraste direct avec « femme esclave ».
theological_decisions:
- issue: Contraste de statut social au cœur de l’argument de Paul
  choice: « femme esclave » / « femme libre »
  alternative: « servante » / « femme libre »
  rationale: Le contexte immédiat développe explicitement l’opposition entre esclavage et liberté. La traduction retenue rend visible cette tension sans ajouter d’interprétation doctrinale.
translation_notes:
  register: Français international moderne, clair et digne. « Car il est écrit » conserve le ton scripturaire; « l’un… et l’autre » est plus naturel en français que la répétition littérale « un… et un ». Aucun appel de note n’est nécessaire, puisque l’alternative « servante » ne signale ni variante textuelle ni ambiguïté indispensable à la compréhension.
