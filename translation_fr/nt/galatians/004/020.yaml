id: GAL.4.20
reference: Galatians 4:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἤθελον δὲ παρεῖναι πρὸς ὑμᾶς ἄρτι, καὶ ἀλλάξαι τὴν φωνήν μου, ὅτι ἀποροῦμαι ἐν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/020.yaml
  text: But I wish I could be with you right now and change my tone[a], because I am perplexed about you.
translation:
  language: fr
  text: Mais je voudrais être auprès de vous en ce moment même et changer de ton[a], car je suis perplexe à votre sujet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « changer ma voix »; il s’agit probablement ici de changer de ton ou de manière de parler.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤθελον
  choice: je voudrais
  rationale: L’imparfait de θέλω exprime ici avec nuance un désir présent qui ne peut se réaliser immédiatement. « Je voudrais » est naturel en français et évite d’ajouter explicitement une incapacité que le grec laisse implicite.
- source_word: δὲ
  choice: Mais
  rationale: La particule marque une transition légèrement contrastive avec ce qui précède.
- source_word: παρεῖναι πρὸς ὑμᾶς
  choice: être auprès de vous
  rationale: Cette formulation rend la présence personnelle exprimée par παρεῖναι et la relation indiquée par πρὸς, dans un français naturel et digne.
- source_word: ἄρτι
  choice: en ce moment même
  rationale: Cette expression conserve l’insistance temporelle et l’urgence de ἄρτι.
- source_word: ἀλλάξαι τὴν φωνήν μου
  choice: changer de ton
  rationale: Littéralement, le grec dit « changer ma voix », mais, dans ce contexte épistolaire et pastoral, l’expression vise probablement la manière de parler. « Changer de ton » transmet ce sens sans lourdeur; une note conserve le sens littéral.
- source_word: ὅτι
  choice: car
  rationale: ὅτι introduit la raison du souhait de Paul. « Car » convient au registre biblique moderne sans être archaïque.
- source_word: ἀποροῦμαι
  choice: je suis perplexe
  rationale: Le verbe exprime l’incertitude, l’embarras ou le fait de ne pas savoir que faire. « Je suis perplexe » préserve cette tension sans préciser excessivement sa nature.
- source_word: ἐν ὑμῖν
  choice: à votre sujet
  rationale: Après ἀπορέω, ἐν ὑμῖν indique ici vraisemblablement la référence ou l’objet de la perplexité. « À votre sujet » est idiomatique tout en restant proche de cette valeur.
theological_decisions:
- issue: Sens de φωνή dans le contexte
  choice: La « voix » désigne probablement le ton ou la manière dont Paul s’adresserait aux Galates.
  alternative: Paul voudrait changer sa voix au sens littéral, ou l’expression pourrait plus largement signifier qu’il adapterait ses paroles en leur présence.
  rationale: Le contexte oppose les limites d’une lettre à une rencontre personnelle et chargée de sollicitude. Le sens figuré « ton » est probable, mais la note maintient visible la formulation littérale et son ambiguïté.
translation_notes:
  register: Français international moderne, naturel et digne. « Auprès de vous » souligne la présence personnelle; « en ce moment même » rend l’urgence; « perplexe » conserve l’incertitude pastorale de Paul sans la transformer en doute doctrinal.
