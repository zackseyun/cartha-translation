id: GAL.4.31
reference: Galatians 4:31
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸀διό, ἀδελφοί, οὐκ ἐσμὲν παιδίσκης τέκνα ἀλλὰ τῆς ἐλευθέρας.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/031.yaml
  text: Therefore[a], brothers, we are not children of the servant woman[b], but of the free woman.
translation:
  language: fr
  text: Ainsi donc, frères[a], nous ne sommes pas les enfants de la femme esclave[b], mais ceux de la femme libre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « frères et sœurs » : le grec dit « frères », terme qui peut ici s’adresser de manière représentative à un groupe mixte.'
    reason: lexical_alternative
  - marker: b
    text: Ou « de la jeune esclave »; le terme grec désigne une femme ou une jeune fille esclave ou servante. Ici, il renvoie à Agar, mise en contraste avec Sara dans l’allégorie de Paul (Galates 4.21-31).
    reason: lexical_alternative
lexical_decisions:
- source_word: διό
  choice: Ainsi donc
  rationale: Introduit la conclusion tirée de l’argument allégorique précédent et conserve clairement la valeur déductive du grec.
- source_word: ἀδελφοί
  choice: frères
  rationale: Reproduit le vocatif masculin pluriel du grec; dans ce contexte, il peut désigner de manière représentative l’ensemble des croyants, hommes et femmes, ce que précise la note.
- source_word: οὐκ ἐσμὲν
  choice: nous ne sommes pas
  rationale: Rend simplement la négation au présent, sans ajouter une nuance temporelle telle que « nous ne sommes plus ».
- source_word: παιδίσκης
  choice: de la femme esclave
  rationale: Le statut servile d’Agar est essentiel au contraste avec la femme libre; « femme esclave » est clair, actuel et plus précis ici que « servante ».
- source_word: τέκνα
  choice: les enfants
  rationale: Le terme est inclusif et désigne les enfants ou la descendance, sans se limiter aux fils.
- source_word: ἀλλὰ
  choice: mais
  rationale: Marque naturellement l’opposition entre les deux appartenances.
- source_word: τῆς ἐλευθέρας
  choice: ceux de la femme libre
  rationale: L’adjectif féminin substantivé renvoie à Sara; « femme libre » explicite le référent, tandis que « ceux » reprend naturellement « les enfants » en français.
theological_decisions:
- issue: Degré d’explicitation du contraste allégorique entre Agar et Sara
  choice: « la femme esclave » et « la femme libre »
  alternative: « la servante » et « la femme libre »
  rationale: Le raisonnement de Paul repose sur l’opposition entre esclavage et liberté. Cette formulation maintient ce contraste sans ajouter d’interprétation doctrinale étrangère au texte.
- issue: Portée de l’apostrophe ἀδελφοί
  choice: Conserver « frères » dans le texte avec une note sur sa portée représentative
  alternative: « frères et sœurs »
  rationale: Cette solution préserve la forme masculine du grec tout en signalant clairement que l’apostrophe peut inclure les femmes de l’assemblée.
translation_notes:
  register: Français international moderne, naturel et digne. La répétition lourde de « les enfants » est évitée dans le second membre par le pronom « ceux », sans perdre le parallélisme ni le référent. Les marqueurs de notes [a] et [b] figurent tous deux dans le texte principal.
