  rationale: Marque le contraste avec la Jérusalem actuelle mentionnée au verset précédent.
- source_word: ἄνω
  choice: d’en haut
  rationale: Conserve l’image spatiale du grec et le contraste avec la Jérusalem terrestre, sans expliciter davantage par « céleste ».
- source_word: Ἰερουσαλήμ
  choice: Jérusalem
  rationale: Forme française usuelle du nom propre.
- source_word: ἐλευθέρα
  choice: libre
  rationale: Adjectif attribut qui maintient le contraste entre esclavage et liberté dans l’allégorie, sans ajouter « femme ».
- source_word: ἥτις
  choice: et c’est elle qui
  rationale: Rend naturellement la reprise relative tout en faisant ressortir la personnification féminine de Jérusalem.
- source_word: μήτηρ
  choice: mère
  rationale: Préserve directement la métaphore maternelle au cœur de l’argument.
- source_word: ἡμῶν
  choice: notre
  rationale: Rendu possessif naturel en français.
theological_decisions:
- issue: Référent et personnification de « la Jérusalem d’en haut »
  choice: « et c’est elle qui est notre mère »
  alternative: « laquelle est notre mère »
  rationale: Le féminin grammatical et l’allégorie maternelle permettent une reprise personnelle et naturelle, sans ajouter de contenu théologique au texte.
