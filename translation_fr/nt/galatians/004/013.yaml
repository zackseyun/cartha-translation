id: GAL.4.13
reference: Galatians 4:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οἴδατε δὲ ὅτι δι’ ἀσθένειαν τῆς σαρκὸς εὐηγγελισάμην ὑμῖν τὸ πρότερον,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/013.yaml
  text: But you know that it was because of an illness of the flesh that I first proclaimed the good news to you,[a]
translation:
  language: fr
  text: 'Mais vous le savez : c’est à cause d’une faiblesse physique que je vous ai annoncé la bonne nouvelle la première fois.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à cause d’une maladie du corps ». Le grec dit littéralement « à cause d’une faiblesse/maladie de la chair ».
    reason: lexical_alternative
lexical_decisions:
- source_word: οἴδατε
  choice: vous le savez
  rationale: Le parfait οἶδα a ici un sens présent. Cette formulation naturelle rappelle ce que les Galates savent déjà.
- source_word: δὲ
  choice: Mais
  rationale: δέ marque une transition légèrement contrastive avec ce qui précède.
- source_word: ὅτι
  choice: ':'
  rationale: En français, les deux-points introduisent naturellement le contenu de ce que les Galates savent, sans alourdir la phrase avec « que c’est » après « vous le savez ».
- source_word: δι’ ἀσθένειαν τῆς σαρκὸς
  choice: à cause d’une faiblesse physique
  rationale: διά avec l’accusatif exprime la cause. ἀσθένεια peut désigner une faiblesse ou une maladie, et τῆς σαρκός précise ici son caractère corporel. « Faiblesse physique » préserve mieux l’indétermination du grec que le seul mot « maladie ».
- source_word: εὐηγγελισάμην
  choice: je vous ai annoncé la bonne nouvelle
  rationale: Cette expression rend clairement l’acte de proclamation évangélique sans recourir à un jargon ecclésiastique.
- source_word: ὑμῖν
  choice: vous
  rationale: Le pronom est placé comme complément indirect du verbe « annoncer » dans une construction française naturelle.
- source_word: τὸ πρότερον
  choice: la première fois
  rationale: Dans ce contexte, l’expression renvoie vraisemblablement à la première occasion où Paul a annoncé la bonne nouvelle aux Galates; « la première fois » reste naturel tout en laissant ouverte la question du nombre exact de visites.
theological_decisions:
- issue: Sens de σάρξ dans ἀσθένειαν τῆς σαρκὸς
  choice: 'sens corporel : « faiblesse physique »'
  alternative: « maladie du corps », « faiblesse de la chair » ou un sens moral lié à la nature pécheresse
  rationale: Le contexte évoque l’état corporel de Paul lors de son premier séjour, non une corruption morale. La traduction retient le sens physique tout en conservant l’ambiguïté entre faiblesse et maladie dans une note.
translation_notes:
  register: Français international moderne, clair et digne. « Bonne nouvelle » traduit le vocabulaire évangélique de manière accessible. La formulation principale privilégie « faiblesse physique » afin de ne pas préciser plus que le grec s’il s’agissait d’une maladie déterminée.
