  text: ἀλλὰ τί λέγει ἡ γραφή; Ἔκβαλε τὴν παιδίσκην καὶ τὸν υἱὸν αὐτῆς, οὐ γὰρ μὴ ⸀κληρονομήσει ὁ υἱὸς τῆς παιδίσκης μετὰ τοῦ υἱοῦ τῆς ἐλευθέρας.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/030.yaml
  text: But what does the Scripture say? “Cast out the servant woman and her son[c][b][a], for the son of the servant woman will certainly not inherit with the son of the free woman.”
translation:
  language: fr
  text: Mais que dit l’Écriture ? « Chasse la femme esclave[a] et son fils, car le fils de la femme esclave n’héritera certainement pas[c] avec le fils de la femme libre. »[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la servante ». Le terme grec désigne ici une femme esclave ou de condition servile ; « femme esclave » met en évidence le contraste entre esclavage et liberté qui structure ce passage.
    reason: lexical_alternative
  - marker: b
    text: Cette citation reprend Genèse 21.10.
    reason: cross_reference
  - marker: c
    text: 'Le grec emploie une négation emphatique : « n’héritera certainement pas » ; autre traduction possible : « n’héritera en aucun cas ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Mais
  rationale: Introduit nettement le contraste avec l’argument qui précède, dans un français naturel.
- source_word: τί λέγει ἡ γραφή
  choice: que dit l’Écriture ?
  rationale: Conserve le présent et la personnification de l’Écriture comme autorité qui parle.
- source_word: Ἔκβαλε
  choice: Chasse
  rationale: Rend la force de l’impératif et l’idée d’expulsion, sans l’atténuer en « renvoie ».
- source_word: παιδίσκην
  choice: la femme esclave
  rationale: Le terme désigne ici une femme en condition servile ; cette formulation rend explicite le contraste central entre esclavage et liberté.
- source_word: υἱὸν αὐτῆς
  choice: son fils
  rationale: Rend directement la construction possessive grecque.
- source_word: οὐ γὰρ μὴ κληρονομήσει
  choice: car … n’héritera certainement pas
  rationale: La tournure traduit la négation grecque fortement emphatique sans introduire une interprétation supplémentaire.
- source_word: μετὰ τοῦ υἱοῦ τῆς ἐλευθέρας
  choice: avec le fils de la femme libre
  rationale: Exprime l’association dans l’héritage et restitue le substantif sous-entendu par l’adjectif grec substantivé.
theological_decisions:
- issue: Rendu de παιδίσκη dans le contraste entre Agar et Sara
  choice: femme esclave
  alternative: servante ; femme de condition servile
  rationale: Le raisonnement de Paul repose explicitement sur l’opposition entre esclavage et liberté. « Femme esclave » préserve cette opposition sans ajouter de précision doctrinale étrangère au texte.
- issue: Force de l’exclusion exprimée par οὐ μή avec le futur
  choice: n’héritera certainement pas
  alternative: n’héritera en aucun cas ; n’héritera jamais
  rationale: Le grec formule une exclusion catégorique. « Certainement pas » en conserve l’intensité tout en restant naturel en français moderne.
translation_notes:
  register: Français international moderne, digne et direct. « Chasse » conserve la vigueur de l’ordre ; « femme esclave » évite l’archaïsme de « servante » lorsque celui-ci pourrait masquer le statut servile. La syntaxe de la citation reste proche du grec tout en étant idiomatique.
