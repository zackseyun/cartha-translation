id: GAL.4.8
reference: Galatians 4:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἀλλὰ τότε μὲν οὐκ εἰδότες θεὸν ἐδουλεύσατε τοῖς ⸂φύσει μὴ⸃ οὖσι θεοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/008.yaml
  text: But at that time[a], when you did not know God, you were enslaved to those that by nature are not gods.
translation:
  language: fr
  text: Mais à cette époque[a], quand vous ne connaissiez pas Dieu, vous étiez esclaves de ceux qui, par nature, ne sont pas des dieux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Mais autrefois, ne connaissant pas Dieu, vous étiez esclaves de ceux qui ne sont pas réellement des dieux. »'
    reason: Signale les autres rendus naturels de τότε μὲν et de la construction participiale, ainsi qu’une formulation possible du sens de φύσει.
lexical_decisions:
- source_word: Ἀλλὰ
  choice: Mais
  rationale: Marque naturellement le contraste avec l’argument précédent, sans le renforcer excessivement.
- source_word: τότε μὲν
  choice: à cette époque
  rationale: Renvoie à la période passée des Galates et prépare le contraste avec le verset suivant. « Autrefois » est également possible.
- source_word: οὐκ εἰδότες θεὸν
  choice: quand vous ne connaissiez pas Dieu
  rationale: La proposition temporelle rend naturellement le participe et conserve le sens relationnel de « connaître » dans ce contexte paulinien.
- source_word: θεὸν
  choice: Dieu
  rationale: Le singulier sans article désigne ici le vrai Dieu, par contraste avec les « dieux » mentionnés ensuite.
- source_word: ἐδουλεύσατε
  choice: vous étiez esclaves de
  rationale: Conserve le champ lexical fort de l’esclavage, essentiel à l’argument de Galates, plutôt que de l’affaiblir en simple service.
- source_word: τοῖς ... οὖσι θεοῖς
  choice: de ceux qui ... ne sont pas des dieux
  rationale: La formulation reste proche du grec sans identifier ces référents comme des idoles ou des démons, ce que le verset ne précise pas.
- source_word: φύσει μὴ
  choice: par nature, ne sont pas
  rationale: Exprime le constat portant sur leur réalité intrinsèque et maintient la portée de la négation.
- source_word: θεοῖς
  choice: des dieux
  rationale: Le nom commun pluriel rend directement le grec et fait ressortir le contraste avec Dieu.
theological_decisions:
- issue: Nature des anciens objets de culte
  choice: '« ceux qui, par nature, ne sont pas des dieux » : négation de leur divinité réelle'
  alternative: « ceux qui ne sont pas réellement des dieux » ou « des êtres faussement appelés dieux »
  rationale: La traduction conserve l’affirmation ontologique de φύσει μὴ οὖσι θεοῖς, tout en s’abstenant de préciser s’il s’agit d’idoles, de puissances spirituelles ou d’autres réalités.
translation_notes:
  register: Français international moderne, digne et accessible. « Étiez esclaves de » maintient le motif de l’esclavage sans introduire l’idée passive d’une réduction en esclavage. « Ceux qui » laisse volontairement ouverte la nature personnelle ou non des référents.
