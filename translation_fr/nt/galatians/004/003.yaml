id: GAL.4.3
reference: Galatians 4:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὕτως καὶ ἡμεῖς, ὅτε ἦμεν νήπιοι, ὑπὸ τὰ στοιχεῖα τοῦ κόσμου ⸀ἤμεθα δεδουλωμένοι·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/003.yaml
  text: So also we[a], when we were children, were enslaved under the elemental principles of the world.
translation:
  language: fr
  text: De même, nous aussi, lorsque nous étions des enfants, nous étions réduits en esclavage sous les principes élémentaires du monde.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les puissances élémentaires du monde » ; le terme grec peut désigner soit des principes ou éléments fondamentaux, soit des puissances spirituelles cosmiques.
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως καὶ
  choice: De même
  rationale: Exprime naturellement en français l’analogie avec l’héritier mineur évoqué dans les versets précédents.
- source_word: ἡμεῖς
  choice: nous aussi
  rationale: Conserve le pronom explicite et sa valeur emphatique, tandis que « aussi » rend la force de καί.
- source_word: ὅτε ἦμεν νήπιοι
  choice: lorsque nous étions des enfants
  rationale: Préserve l’image de l’enfance et de l’immaturité dans le prolongement de l’exemple de l’héritier, sans adopter le terme plus juridique « mineurs ».
- source_word: ὑπὸ
  choice: sous
  rationale: Maintient la métaphore de la domination et fait écho au langage contextuel de la sujétion.
- source_word: τὰ στοιχεῖα τοῦ κόσμου
  choice: les principes élémentaires du monde
  rationale: Rend le sens possible de structures ou principes fondamentaux sans exclure silencieusement l’interprétation concurrente de puissances spirituelles, signalée en note.
- source_word: ἤμεθα δεδουλωμένοι
  choice: nous étions réduits en esclavage
  rationale: Restitue clairement la force du passif périphrastique et le vocabulaire explicite de l’asservissement.
theological_decisions:
- issue: Sens de τὰ στοιχεῖα τοῦ κόσμου
  choice: « les principes élémentaires du monde » dans le texte principal
  alternative: « les puissances élémentaires du monde » ou « les esprits élémentaires du monde »
  rationale: Le terme στοιχεῖα peut désigner des éléments ou principes fondamentaux, mais aussi, selon le contexte paulinien, des puissances cosmiques. Le texte principal retient une formulation non personnelle compatible avec l’analogie de la minorité, tandis que la note préserve l’ambiguïté théologique réelle.
translation_notes:
  register: Français international moderne, naturel et digne. La répétition « nous… nous » reflète l’insistance du grec, et « réduits en esclavage » conserve la vigueur de l’image paulinienne.
