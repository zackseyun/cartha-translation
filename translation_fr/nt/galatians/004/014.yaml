reference: Galatians 4:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ τὸν πειρασμὸν ⸀ὑμῶν ἐν τῇ σαρκί μου οὐκ ἐξουθενήσατε οὐδὲ ἐξεπτύσατε, ἀλλὰ ὡς ἄγγελον θεοῦ ἐδέξασθέ με, ὡς Χριστὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/014.yaml
  text: And though my bodily condition was a trial to you[a], you did not treat me with contempt or disgust; rather, you welcomed me as an angel of God[c][b], as Messiah Jesus.
translation:
  language: fr
  text: Et bien que mon état physique ait été une épreuve pour vous[a], vous ne m’avez ni méprisé ni repoussé avec dégoût[b]. Au contraire, vous m’avez accueilli comme un ange de Dieu, comme Jésus le Messie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « et votre épreuve dans ma chair ». Le texte grec permet difficilement de déterminer avec certitude le rapport entre « votre épreuve » et « ma chair ».'
    reason: alternative_reading
  - marker: b
    text: 'Littéralement : « vous n’avez pas craché », expression marquant la répulsion ou le rejet.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πειρασμὸν ὑμῶν ἐν τῇ σαρκί μου
  choice: bien que mon état physique ait été une épreuve pour vous
  rationale: La formulation grecque est difficile, mais le contexte indique que la condition physique de Paul a constitué une épreuve pour les Galates. Cette tournure française naturelle en rend le sens probable sans masquer l’autre construction possible, signalée en note.
- source_word: ἐξουθενήσατε
  choice: traité avec mépris
  rationale: Le verbe exprime le fait de dédaigner quelqu’un ou de le tenir pour négligeable; cette expression convient à l’objet personnel implicite, « me ».
- source_word: ἐξεπτύσατε
  choice: traité avec dégoût
  rationale: Le verbe évoque littéralement le fait de cracher, geste de répulsion ou de rejet. « Avec dégoût » transmet clairement sa force idiomatique, tandis que l’image littérale est conservée en note.
- source_word: ἐδέξασθέ με
  choice: vous m’avez accueilli
  rationale: « Accueilli » exprime ici une réception personnelle et favorable, plus justement que le neutre « reçu ».
- source_word: ἄγγελον θεοῦ
  choice: un ange de Dieu
  rationale: Même si ἄγγελος peut désigner un messager, le parallélisme élevé avec Jésus le Messie favorise ici le sens d’« ange ».
- source_word: Χριστὸν Ἰησοῦν
  choice: Jésus le Messie
  rationale: Χριστός garde ici sa valeur de titre. En français, « Jésus le Messie » est plus naturel que « Messie Jésus » tout en rendant explicitement ce titre.
theological_decisions:
- issue: Portée de la comparaison « comme un ange de Dieu, comme Jésus le Messie »
  choice: Elle décrit l’accueil extraordinairement honorifique réservé à Paul.
  alternative: La seconde comparaison peut être comprise comme une intensification rhétorique de la première.
  rationale: Les deux propositions introduites par ὡς indiquent la manière dont les Galates ont accueilli Paul; elles ne l’identifient ni à un ange ni à Jésus.
- issue: Sens de σάρξ
  choice: La condition physique de Paul
  alternative: « ma chair », formulation plus littérale qui ne précise pas la nature exacte de l’affliction
  rationale: Le contexte concerne une faiblesse ou affection corporelle, non une prétendue « nature pécheresse ». La traduction ne précise pas de diagnostic absent du texte.
translation_notes:
  register: Français international moderne, clair et digne. Le passé composé convient au récit adressé directement aux Galates. La tournure concessive rend le lien logique implicite, et les notes préservent la difficulté syntaxique ainsi que l’image concrète du grec.
