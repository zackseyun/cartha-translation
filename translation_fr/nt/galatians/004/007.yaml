source:
  edition: SBLGNT
  text: ὥστε οὐκέτι εἶ δοῦλος ἀλλὰ υἱός· εἰ δὲ υἱός, καὶ κληρονόμος ⸂διὰ θεοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/007.yaml
  text: So you are no longer a servant but a son[a]; and if a son[b], then also an heir through God.
translation:
  language: fr
  text: Ainsi, tu n’es plus esclave, mais fils[a] ; et si tu es fils, tu es aussi héritier, grâce à Dieu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « enfant ». Le grec dit « fils », terme qui préserve la logique de l’adoption et de l’héritage dans ce passage, bien que Paul applique ce statut à tous les croyants.
    reason: lexical_alternative
  - marker: b
    text: Certains manuscrits portent « héritier de Dieu par le Christ » (ou « par le Messie ») au lieu de « héritier, grâce à Dieu ».
    reason: textual_variant
lexical_decisions:
- source_word: ὥστε
  choice: Ainsi
  rationale: Introduit naturellement en français la conclusion tirée de l’argument précédent.
- source_word: οὐκέτι εἶ
  choice: tu n’es plus
  rationale: Conserve la deuxième personne du singulier et exprime clairement le changement de condition.
- source_word: δοῦλος
  choice: esclave
  rationale: Le terme désigne ici une condition d’asservissement, mise en contraste avec celle de fils et d’héritier ; « serviteur » atténuerait cette opposition.
- source_word: ἀλλὰ υἱός
  choice: mais fils
  rationale: « Fils » préserve le vocabulaire juridique et familial de l’adoption et de l’héritage dans le contexte, tout en laissant une note préciser la portée pour tous les croyants.
- source_word: εἰ δὲ υἱός
  choice: et si tu es fils
  rationale: Rend explicitement en français la copule sous-entendue dans la proposition grecque et maintient la progression logique.
- source_word: καὶ κληρονόμος
  choice: tu es aussi héritier
  rationale: La reprise de « tu es » produit une phrase française naturelle, tandis que « aussi » conserve la force additive de καί.
- source_word: διὰ θεοῦ
  choice: par l’action de Dieu
  rationale: Exprime en français courant l’idée que cette qualité d’héritier advient par Dieu, sans ajouter que Dieu serait l’objet de l’héritage.
theological_decisions:
- issue: Langage filial genré de υἱός
  choice: fils
  alternative: enfant
  rationale: Le masculin singulier appartient à l’argument de Paul sur l’adoption et le statut d’héritier. « Enfant » serait plus inclusif en surface, mais affaiblirait ce lien juridique ancien ; une note précise que ce statut concerne tous les croyants.
- issue: Leçon textuelle à la fin du verset
  choice: par l’action de Dieu
  alternative: héritier de Dieu par le Christ / par le Messie
  rationale: Le texte grec retenu, διὰ θεοῦ, attribue à Dieu l’établissement de ce statut. Les formulations mentionnant le Christ ou le Messie relèvent de variantes manuscrites et sont donc signalées en note plutôt qu’intégrées au texte.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement singulier conserve l’adresse grammaticale de Paul. « Esclave » maintient la vigueur du contraste, et « par l’action de Dieu » évite le tour peu idiomatique « à travers Dieu ».
