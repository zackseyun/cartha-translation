  rationale: La révision remplace l’explicitation non textuelle « par l’action de Dieu » par « grâce à Dieu », expression française naturelle qui rend la médiation ou la causalité indiquée par διὰ θεοῦ sans introduire un substantif absent du grec. Les autres choix sont conservés, et la note de variante est harmonisée avec le texte révisé.
