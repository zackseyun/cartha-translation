  source_fidelity: La structure argumentative, le singulier et les termes « esclave », « fils » et « héritier » rendent fidèlement le grec. Toutefois, διὰ θεοῦ signifie littéralement « par Dieu » / « grâce à Dieu » selon le contexte ; « par l’action de Dieu » explicite et ajoute « action », absent du texte. Une formulation plus directe préserve mieux la concision et l’ambiguïté relative du grec.
  naturalness: « Ainsi » et la construction au tutoiement sont naturelles en français moderne. « Tu es aussi héritier par Dieu » est grammaticalement possible mais un peu raide ; « tu es aussi héritier, grâce à Dieu » est idiomatique tout en évitant l’ajout interprétatif de « l’action ».
  terminology: « Esclave » maintient à juste titre le contraste avec le statut filial. « Fils » respecte υἱός et son lien argumentatif avec l’héritage ; la note explique adéquatement la portée inclusive. La note textuelle doit correspondre exactement au texte principal révisé.
