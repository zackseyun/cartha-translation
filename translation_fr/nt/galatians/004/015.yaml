id: GAL.4.15
reference: Galatians 4:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸀ποῦ ⸀οὖν ὁ μακαρισμὸς ὑμῶν; μαρτυρῶ γὰρ ὑμῖν ὅτι εἰ δυνατὸν τοὺς ὀφθαλμοὺς ὑμῶν ⸀ἐξορύξαντες ἐδώκατέ μοι.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/015.yaml
  text: Where then is your blessedness? For I testify to you that[a], if possible[b], you would have torn out your eyes and given them to me.
translation:
  language: fr
  text: 'Où donc est votre bonheur[a] ? Car je vous l’atteste : si cela avait été possible, vous vous seriez arraché les yeux[b] pour me les donner.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « votre bénédiction » ou « le fait que vous vous estimiez bénis ». Le grec peut désigner un état de bonheur ou de bénédiction, ou encore le fait de déclarer quelqu’un heureux.
    reason: lexical_alternative
  - marker: b
    text: L’expression est probablement une hyperbole évoquant leur dévouement d’autrefois. Certains y voient aussi une allusion possible à l’état physique de Paul.
    reason: interpretive_ambiguity
lexical_decisions:
- source_word: ποῦ οὖν
  choice: Où donc est
  rationale: Rend la question rhétorique et la valeur inférentielle de οὖν sans expliciter davantage l’idée possible de « qu’est devenu ».
- source_word: μακαρισμὸς ὑμῶν
  choice: votre bonheur
  rationale: Expression française naturelle pouvant désigner l’état heureux dont les Galates se considéraient auparavant bénéficiaires. Une note conserve les nuances de bénédiction et de déclaration de bonheur portées par μακαρισμός.
- source_word: μαρτυρῶ γὰρ ὑμῖν
  choice: Car je vous l’atteste
  rationale: Conserve le ton solennel et testimonial de μαρτυρέω dans un français actuel et digne.
- source_word: εἰ δυνατὸν
  choice: si cela avait été possible
  rationale: Le grec est concis, mais le contexte passé et irréel appelle naturellement en français cette formulation au plus-que-parfait.
- source_word: τοὺς ὀφθαλμοὺς ὑμῶν ἐξορύξαντες
  choice: vous vous seriez arraché les yeux
  rationale: Préserve l’image concrète et violente de ἐξορύσσω ainsi que sa valeur conditionnelle liée au verbe principal.
- source_word: ἐδώκατέ μοι
  choice: pour me les donner
  rationale: Exprime naturellement en français le don envisagé comme but de l’action précédente, sans modifier son objet explicite, les yeux.
theological_decisions:
- issue: Faut-il comprendre la mention des yeux comme une hyperbole de dévouement ou comme une allusion à l’état physique de Paul ?
  choice: Conserver littéralement l’image des yeux arrachés sans en préciser la portée dans le texte.
  alternative: Généraliser en « vous m’auriez tout donné » ou présenter explicitement les yeux comme un indice de la maladie de Paul.
  rationale: Le grec nomme expressément les yeux et emploie un verbe très concret. Le contexte permet l’hyperbole et éventuellement une allusion physique, mais ne tranche pas entre ces lectures.
translation_notes:
  register: Français international moderne, naturel et digne. La question initiale reste concise et rhétorique ; l’image très vive des yeux est maintenue sans imposer une interprétation médicale.
