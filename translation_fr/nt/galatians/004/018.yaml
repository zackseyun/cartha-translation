id: GAL.4.18
reference: Galatians 4:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καλὸν ⸀δὲ ζηλοῦσθαι ἐν καλῷ πάντοτε, καὶ μὴ μόνον ἐν τῷ παρεῖναί με πρὸς ὑμᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/018.yaml
  text: But it is good to be sought eagerly for a good purpose at all times[b][a], and not only when I am present with you.
translation:
  language: fr
  text: Mais il est bon d’être recherché avec empressement[a] pour une bonne cause[b], en tout temps, et pas seulement lorsque je suis présent parmi vous.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi comprendre : « être zélé » ou « manifester du zèle ». Le verbe grec peut être interprété de plusieurs manières, mais son sens passif correspond bien au contraste avec ceux qui recherchent ardemment les Galates au verset précédent.'
    reason: alternative_reading
  - marker: b
    text: 'Littéralement : « dans une bonne chose » ou « dans ce qui est bien » ; l’expression peut désigner une bonne intention, une bonne cause ou une bonne manière d’agir.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καλὸν
  choice: il est bon
  rationale: L’adjectif prédicatif est rendu par une tournure impersonnelle naturelle en français.
- source_word: δὲ
  choice: Mais
  rationale: La conjonction marque ici un contraste avec les mauvaises intentions évoquées au verset précédent.
- source_word: ζηλοῦσθαι
  choice: d’être recherché avec empressement
  rationale: L’infinitif présent passif est maintenu comme tel; cette lecture correspond au contraste immédiat avec ceux qui recherchent ardemment les Galates au verset 17.
- source_word: ἐν καλῷ
  choice: pour une bonne cause
  rationale: Cette expression concise rend l’idée d’une visée ou d’un motif moralement bon, tout en signalant en note le caractère plus indéterminé du grec.
- source_word: πάντοτε
  choice: en tout temps
  rationale: Cette formulation s’articule clairement avec la restriction temporelle qui suit.
- source_word: καὶ μὴ μόνον
  choice: et pas seulement
  rationale: Rendu français direct et idiomatique de la coordination restrictive.
- source_word: ἐν τῷ παρεῖναί με πρὸς ὑμᾶς
  choice: lorsque je suis présent parmi vous
  rationale: La construction infinitive articulée avec ἐν a une valeur temporelle; «parmi vous» exprime naturellement la présence personnelle de Paul auprès de la communauté.
theological_decisions:
- issue: Voix et sens de ζηλοῦσθαι
  choice: 'Sens passif: être recherché avec empressement'
  alternative: Être zélé / manifester du zèle
  rationale: La forme est passive et le contexte immédiat reprend le vocabulaire de ζηλόω employé au verset 17 pour désigner l’empressement d’autres personnes envers les Galates. La variante est néanmoins conservée en note afin de ne pas masquer l’ambiguïté reconnue.
- issue: Portée de ἐν καλῷ
  choice: pour une bonne cause
  alternative: dans ce qui est bien / d’une bonne manière
  rationale: Le contexte oppose vraisemblablement de bonnes intentions aux motifs mauvais du verset précédent, mais le grec reste littéralement indéterminé; une note conserve cette latitude.
translation_notes:
  register: Français international moderne, clair et digne. « Recherché avec empressement » conserve le sens passif et la notion de zèle sans employer le plus étroit « courtisé ». Les marqueurs [b][a] suivent immédiatement les expressions qu’ils éclairent conjointement.
