id: GAL.4.16
reference: Galatians 4:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὥστε ἐχθρὸς ὑμῶν γέγονα ἀληθεύων ὑμῖν;
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/016.yaml
  text: So then[a], have I become your enemy by telling you the truth?
translation:
  language: fr
  text: Ainsi donc, suis-je devenu votre ennemi en vous disant la vérité[a] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en vous parlant vrai ». Le participe grec peut signifier « parler vrai » ou « dire la vérité ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: Ainsi donc
  rationale: La conjonction introduit ici une conséquence tirée de ce qui précède; « Ainsi donc » rend clairement cette transition rhétorique.
- source_word: ἐχθρὸς
  choice: ennemi
  rationale: Employé comme attribut, le terme désigne quelqu’un considéré comme hostile; « ennemi » est l’équivalent français direct et naturel.
- source_word: ὑμῶν
  choice: votre
  rationale: Le génitif dépend de « ennemi » et se rend idiomatiquement en français par l’adjectif possessif « votre ».
- source_word: γέγονα
  choice: suis-je devenu
  rationale: Le parfait de γίνομαι présente un changement accompli dont l’état résultant demeure; le passé composé français convient naturellement.
- source_word: ἀληθεύων
  choice: en vous disant la vérité
  rationale: Le participe peut décrire le fait de parler avec vérité ou de dire la vérité. Dans ce contexte d’adresse directe aux Galates, cette formulation est naturelle tout en signalant l’alternative en note.
- source_word: ὑμῖν
  choice: vous
  rationale: Le datif désigne les destinataires de la parole véridique; il s’intègre naturellement dans « vous disant la vérité ».
theological_decisions:
- issue: Portée de ἀληθεύων dans la question rhétorique de Paul
  choice: Paul demande si le fait de dire la vérité aux Galates l’a rendu leur ennemi.
  alternative: Paul demande si sa manière d’agir avec vérité envers eux l’a rendu leur ennemi.
  rationale: Le contexte immédiat favorise une parole vraie adressée aux Galates, sans exclure lexicalement la nuance plus générale de parler ou d’agir avec vérité.
translation_notes:
  register: Français international moderne, naturel et digne. La question rhétorique est conservée, ainsi que la valeur résultative du parfait et l’ambiguïté lexicale du participe grâce à la note.
