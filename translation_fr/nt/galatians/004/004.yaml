source:
  edition: SBLGNT
  text: ὅτε δὲ ἦλθεν τὸ πλήρωμα τοῦ χρόνου, ἐξαπέστειλεν ὁ θεὸς τὸν υἱὸν αὐτοῦ, γενόμενον ἐκ γυναικός, γενόμενον ὑπὸ νόμον,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/004.yaml
  text: But when the fullness of time had come[a], God sent out his Son, born of a woman, born under the law[d][c][b],
translation:
  language: fr
  text: Mais quand vint la plénitude du temps[a], Dieu envoya son Fils, né d’une femme[b], né sous la Loi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « lorsque le temps fut accompli » ; littéralement : « quand vint la plénitude du temps ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « issu d’une femme ». L’expression souligne la véritable naissance humaine du Fils.'
    reason: lexical_alternative
  - marker: c
    text: C’est-à-dire sous l’autorité de la Loi mosaïque.
    reason: cross_reference
lexical_decisions:
- source_word: ὅτε δὲ
  choice: Mais quand
  rationale: Rend la transition légère de δέ et la valeur temporelle de ὅτε, tout en maintenant le lien avec le contexte précédent.
- source_word: ἦλθεν τὸ πλήρωμα τοῦ χρόνου
  choice: le temps fut pleinement accompli
  rationale: Formulation française naturelle qui exprime l’arrivée du moment où le temps atteint son accomplissement, sans préciser au-delà du grec comment cet accomplissement a été déterminé.
- source_word: ἐξαπέστειλεν
  choice: envoya
  rationale: En français, « envoya » rend naturellement l’acte de mission. Le préfixe ἐξ- peut suggérer l’envoi depuis un lieu ou une présence, mais « envoya au-dehors » serait lourd et risquerait de surtraduire.
- source_word: τὸν υἱὸν αὐτοῦ
  choice: son Fils
  rationale: Rend directement l’objet et le possessif. La majuscule identifie le titre christologique selon l’usage éditorial français.
- source_word: γενόμενον ἐκ γυναικός
  choice: né d’une femme
  rationale: Dans cette construction, γίνομαι désigne naturellement la naissance; ἐκ marque l’origine. La formulation affirme la véritable naissance humaine du Fils.
- source_word: γενόμενον ὑπὸ νόμον
  choice: né sous la Loi
  rationale: La répétition de « né » reproduit le parallélisme des deux participes. « Sous la Loi » conserve la formulation concise de Paul; la majuscule signale ici la Loi mosaïque indiquée par le contexte de Galates.
theological_decisions:
- issue: Préexistence et véritable humanité du Fils
  choice: Conserver « Dieu envoya son Fils » puis « né d’une femme »
  alternative: Comprendre γενόμενον de manière générale comme « devenu » ou « venu à l’existence »
  rationale: Le texte juxtapose l’envoi du Fils et sa naissance humaine. « Né » exprime l’usage contextuel du participe sans effacer la tension avec l’envoi préalable.
- issue: Référence de νόμος
  choice: « la Loi », comprise dans le contexte comme la Loi mosaïque
  alternative: « une loi » ou la loi au sens général
  rationale: Dans l’argument de Galates, l’expression renvoie très probablement au régime de la Loi mosaïque. La traduction reste néanmoins concise et n’insère pas « mosaïque » dans le corps du verset.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation évite l’archaïsme « lorsque les temps furent accomplis » tout en gardant la solennité et le parallélisme du grec.
