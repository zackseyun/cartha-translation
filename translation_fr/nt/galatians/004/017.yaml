  source_fidelity: Le grec répète ζηλόω dans les deux membres; une formulation française doit idéalement conserver ce parallélisme sans ajouter une intensité absente du texte. « Exclure » rend directement ἐκκλεῖσαι et, comme le grec, ne précise pas le cadre de cette exclusion.
  naturalness: « Déployer beaucoup de zèle pour » est lourd en français actuel et « beaucoup » ajoute une intensité non explicitée par le grec. « Porter un vif intérêt à » est idiomatique, relationnel et peut être repris naturellement dans la proposition finale.
  terminology: « Porter un vif intérêt » transmet ici l’idée de sollicitude empressée / de recherche d’adhésion de ζηλόω sans suggérer une ferveur religieuse particulière. « D’une manière honorable » conserve l’évaluation ouverte de οὐ καλῶς.
