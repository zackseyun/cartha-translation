revisions:
- from: Ils déploient beaucoup de zèle pour vous[a], mais pas d’une manière honorable. Au contraire, ils veulent vous tenir à l’écart[b], afin que vous déployiez du zèle pour eux.
  to: Ils vous portent un vif intérêt[a], mais pas d’une manière honorable. Au contraire, ils veulent vous exclure[b], afin que vous leur portiez un vif intérêt.
  rationale: La révision remplace une expression lourde et intensifiée par une tournure française moderne qui maintient la répétition de ζηλόω dans les deux propositions. « Vous exclure » reflète de près ἐκκλεῖσαι tout en laissant implicite ce dont les Galates seraient exclus. Les notes conservent les alternatives lexicales et l’interprétation contextuelle comme probable, non comme une précision imposée au texte.
