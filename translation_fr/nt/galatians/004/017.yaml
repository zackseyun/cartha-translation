  - severity: medium
    issue: Formulation principale peu naturelle
    rationale: « Déployer du zèle pour quelqu’un » est possible, mais pesant et moins idiomatique que nécessaire en français international moderne.
  - severity: low
    issue: Référents imprécis dans la note b
    rationale: « Les détacher de Paul » peut momentanément laisser ambigu le référent de « les ». Nommer les Galates clarifie la note sans lever l’ambiguïté conservée dans le texte principal.
