id: GAL.4.17
reference: Galatians 4:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ζηλοῦσιν ὑμᾶς οὐ καλῶς, ἀλλὰ ἐκκλεῖσαι ὑμᾶς θέλουσιν, ἵνα αὐτοὺς ζηλοῦτε.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/017.yaml
  text: They are zealous for you[a], but not in a good way. Rather, they want to shut you out[b], so that you may be zealous for them.
translation:
  language: fr
  text: Ils vous portent un vif intérêt[a], mais pas d’une manière honorable. Au contraire, ils veulent vous exclure[b], afin que vous leur portiez un vif intérêt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Ils vous recherchent avec empressement ». Le verbe grec peut exprimer un vif intérêt, le désir de gagner quelqu’un ou une démarche pressante auprès de lui.
    reason: lexical_alternative
  - marker: b
    text: Ou « vous tenir à l’écart ». Il s’agit probablement de détacher les Galates de Paul et de ses collaborateurs pour qu’ils recherchent plutôt la faveur de ces autres enseignants, mais le grec ne précise pas explicitement de qui ou de quoi ils veulent les écarter.
    reason: alternative_reading
lexical_decisions:
- source_word: ζηλοῦσιν … ζηλοῦτε
  choice: déploient beaucoup de zèle pour … déployiez du zèle pour
  rationale: Cette formulation conserve la répétition rhétorique du même verbe grec et son idée d’intérêt ardent ou de recherche empressée, sans lui donner nécessairement une nuance romantique.
- source_word: οὐ καλῶς
  choice: mais pas d’une manière honorable
  rationale: Le grec porte un jugement négatif qui peut viser la manière d’agir ou les intentions. Cette traduction reste assez ouverte tout en étant naturelle en français.
- source_word: ἀλλὰ
  choice: Au contraire
  rationale: Marque nettement la correction et introduit l’explication du caractère répréhensible de leur zèle.
- source_word: ἐκκλεῖσαι ὑμᾶς
  choice: vous tenir à l’écart
  rationale: Rend l’idée d’exclure ou de couper d’une relation, sans préciser de qui ou de quoi les Galates seraient écartés, puisque le texte grec ne le dit pas explicitement.
- source_word: θέλουσιν
  choice: ils veulent
  rationale: Équivalent courant et direct du verbe de volonté.
- source_word: ἵνα
  choice: afin que
  rationale: Exprime clairement le but poursuivi par les adversaires.
theological_decisions:
- issue: De qui ou de quoi les adversaires veulent-ils écarter les Galates ?
  choice: La traduction ne précise pas le complément implicite de « tenir à l’écart ».
  alternative: Expliciter qu’ils veulent les détacher de Paul et de ses collaborateurs, ou les exclure de la communauté ou de la bénédiction de Dieu.
  rationale: Le contexte relationnel rend vraisemblable une séparation d’avec Paul, mais le grec ne nomme pas ce dont les Galates seraient exclus. Le texte principal préserve donc cette ambiguïté.
translation_notes:
  register: Français international moderne, clair et digne. La répétition de « zèle » reproduit le jeu verbal du grec. « Tenir à l’écart » garde une image relationnelle naturelle sans surinterpréter le complément absent.
