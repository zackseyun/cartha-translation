source:
  edition: SBLGNT
  text: ⸂ὑμεῖς δέ, ἀδελφοί, κατὰ Ἰσαὰκ ἐπαγγελίας τέκνα ἐστέ⸃·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/028.yaml
  text: You[a], brothers, like Isaac, are children of promise.
translation:
  language: fr
  text: Mais vous, frères et sœurs, comme Isaac, vous êtes enfants de la promesse.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑμεῖς
  choice: vous … vous
  rationale: Le pronom de deuxième personne du pluriel est explicite et emphatique. Sa reprise avec le verbe est naturelle en français après l’apostrophe et fait ressortir les destinataires.
- source_word: δέ
  choice: Mais
  rationale: La particule marque ici un léger contraste avec la catégorie évoquée au verset précédent; « Mais » le rend clairement sans lui donner une valeur temporelle.
- source_word: ἀδελφοί
  choice: frères et sœurs
  rationale: Le masculin pluriel sert ici d’adresse collective à la communauté, qui comprend vraisemblablement hommes et femmes. La formule française explicite naturellement cette portée représentative.
- source_word: κατὰ Ἰσαὰκ
  choice: comme Isaac
  rationale: 'κατά exprime la correspondance ou le modèle: les destinataires sont enfants de la promesse à la manière d’Isaac.'
- source_word: ἐπαγγελίας
  choice: de la promesse
  rationale: Le génitif est conservé dans l’expression paulinienne « enfants de la promesse », avec l’article requis par l’usage naturel du français.
- source_word: τέκνα
  choice: enfants
  rationale: Le nom pluriel est neutre quant au sexe et souligne la filiation ou l’appartenance; « enfants » en est l’équivalent direct et naturel.
- source_word: ἐστέ
  choice: êtes
  rationale: Présent de l’indicatif, deuxième personne du pluriel, reliant les destinataires à l’attribut « enfants de la promesse ».
theological_decisions:
- issue: Identification des croyants à Isaac dans l’argument allégorique de Paul
  choice: « comme Isaac, vous êtes enfants de la promesse »
  alternative: « vous êtes, à la manière d’Isaac, des enfants promis »
  rationale: La formulation retenue garde Isaac comme terme de comparaison et « enfants de la promesse » comme attribut. Elle préserve ainsi l’analogie et la résonance théologique du génitif sans transformer celui-ci en simple adjectif.
translation_notes:
  register: Français international moderne, digne et accessible. L’adresse inclusive « frères et sœurs » rend la portée communautaire du vocatif masculin pluriel. La répétition de « vous » est idiomatique et conserve l’accent porté par le pronom grec explicite.
