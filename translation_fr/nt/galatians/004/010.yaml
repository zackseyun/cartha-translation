  text: You are carefully observing days and months and seasons and years.
translation:
  language: fr
  text: Vous observez scrupuleusement les jours, les mois, les temps fixés et les années.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Vous observez les jours, les mois, les saisons et les années. » La liste renvoie à des observances calendaires ; « saisons » est une autre traduction possible de « temps fixés » (καιρούς).'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμέρας
  choice: les jours
  rationale: Rend directement l’accusatif pluriel de ἡμέρα. Le contexte indique des observances calendaires, sans qu’il soit nécessaire d’ajouter « spéciaux » ou « sacrés ».
- source_word: παρατηρεῖσθε
  choice: vous observez scrupuleusement
  rationale: Le présent souligne une pratique en cours, et le verbe peut exprimer une observation attentive ou méticuleuse. « Scrupuleusement » fait entendre ici cette nuance critique sans transformer le verbe en « célébrer ».
- source_word: μῆνας
  choice: les mois
  rationale: Traduction directe de μήν au pluriel, conservée dans la série calendaire.
- source_word: καιρούς
  choice: les temps fixés
  rationale: καιρός peut désigner un temps déterminé ou approprié. Dans cette liste calendaire, « temps fixés » préserve cette valeur sans préciser indûment qu’il s’agit de fêtes.
- source_word: ἐνιαυτούς
  choice: les années
  rationale: Traduction directe de ἐνιαυτός, qui clôt la progression des unités calendaires.
- source_word: καὶ
  choice: et
  rationale: La coordination est rendue naturellement en français tout en maintenant l’effet cumulatif de la liste.
theological_decisions:
- issue: Faut-il préciser que les observances sont juives ou religieuses ?
  choice: Conserver dans le texte les seules catégories temporelles, sans ajouter « juifs », « religieux », « sacrés » ou « fêtes ».
  alternative: Vous observez scrupuleusement les jours sacrés, les mois, les fêtes saisonnières et les années.
  rationale: Le contexte de Galates éclaire la nature religieuse de ces pratiques, mais le grec du verset se limite à une liste de périodes. La traduction ne doit pas introduire une précision confessionnelle absente de la formulation.
- issue: Nuance de παρατηρεῖσθε
  choice: vous observez scrupuleusement
  alternative: vous observez
  rationale: Le verbe peut porter l’idée de surveiller ou d’observer avec soin. Dans ce contexte polémique, « scrupuleusement » rend cette nuance, tandis que le simple « observez » demeure possible.
translation_notes:
  register: Français international moderne, clair et digne. La répétition des articles rend la liste naturelle tout en conservant son rythme cumulatif. « Temps fixés » est compréhensible et garde l’indétermination du grec.
