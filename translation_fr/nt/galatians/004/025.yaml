  text: τὸ ⸀δὲ Ἁγὰρ Σινᾶ ὄρος ἐστὶν ἐν τῇ Ἀραβίᾳ, συστοιχεῖ δὲ τῇ νῦν Ἰερουσαλήμ, δουλεύει ⸀γὰρ μετὰ τῶν τέκνων αὐτῆς·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/025.yaml
  text: Hagar is Mount Sinai in Arabia[a], and she corresponds to the present Jerusalem, for she is enslaved with her children.
translation:
  language: fr
  text: Agar, c’est le mont Sinaï en Arabie[a], et elle correspond à la Jérusalem actuelle, car elle est en esclavage avec ses enfants.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « Or, cette Agar est le mont Sinaï en Arabie. » Le grec place un article devant « Agar », ce qui donne une construction syntaxique difficile.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ δὲ Ἁγὰρ
  choice: Agar
  rationale: Le nom est rendu directement; δέ assure une transition légère que le français n’a pas besoin d’expliciter ici. L’article neutre τὸ produit une construction grecque difficile, signalée en note plutôt que reproduite maladroitement.
- source_word: Σινᾶ ὄρος ἐστὶν ἐν τῇ Ἀραβίᾳ
  choice: c’est le mont Sinaï en Arabie
  rationale: La tournure française avec « c’est » conserve l’identification directe et convient naturellement après le nom détaché. « En Arabie » préserve la désignation géographique sans en préciser artificiellement les frontières.
- source_word: συστοιχεῖ
  choice: correspond à
  rationale: Le verbe exprime une mise en parallèle ou une appartenance à la même série dans l’argument allégorique de Paul; « correspond à » reste clair sans développer l’image.
- source_word: τῇ νῦν Ἰερουσαλήμ
  choice: la Jérusalem actuelle
  rationale: « Actuelle » rend la valeur temporelle de νῦν et prépare le contraste avec « la Jérusalem d’en haut » au verset suivant.
- source_word: δουλεύει
  choice: elle est esclave
  rationale: Cette formulation exprime directement la condition servile et maintient le contraste théologique entre esclavage et liberté dans le passage.
- source_word: μετὰ τῶν τέκνων αὐτῆς
  choice: avec ses enfants
  rationale: La préposition marque l’association, et τέκνα désigne ici les enfants dans le cadre familial et allégorique.
theological_decisions:
- issue: Identification allégorique d’Agar au Sinaï et correspondance avec la Jérusalem actuelle
  choice: 'Conserver l’identification directe : « Agar, c’est le mont Sinaï »'
  alternative: « Agar représente le mont Sinaï »
  rationale: Le grec emploie une proposition équative directe, puis un verbe de correspondance. Introduire « représente » atténuerait et interpréterait davantage la formulation de Paul.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation « Agar, c’est… » est naturelle tout en conservant la force de l’identification; « est esclave » maintient explicitement le vocabulaire de l’esclavage.
