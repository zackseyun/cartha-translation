  text: ἀλλ’ ὁ μὲν ἐκ τῆς παιδίσκης κατὰ σάρκα γεγέννηται, ὁ δὲ ἐκ τῆς ἐλευθέρας ⸀δι’ ἐπαγγελίας.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/023.yaml
  text: But the son by the servant woman was born according to the flesh[b][a], while the son by the free woman was born through promise.
translation:
  language: fr
  text: Mais le fils de la femme esclave est né selon la chair[a], tandis que celui de la femme libre l’est en vertu d’une promesse[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « de manière purement humaine » ou « par des moyens humains ordinaires ». Grec : « selon la chair ».'
    reason: lexical_alternative
  - marker: b
    text: Ou « par une promesse ». L’expression indique que cette naissance résulte de la promesse de Dieu, et non simplement de la procréation humaine ordinaire.
    reason: lexical_alternative
lexical_decisions:
- source_word: παιδίσκη
  choice: femme esclave
  rationale: Le statut de dépendance est essentiel au contraste avec la femme libre et à l’argument de Paul. « Femme esclave » est clair en français moderne et évite d’atténuer ce statut.
- source_word: κατὰ σάρκα
  choice: selon la chair
  rationale: Cette formulation conserve le terme paulinien σάρξ et la tension du contraste, tout en laissant une note préciser qu’il s’agit ici de la génération humaine ordinaire, sans connotation morale nécessaire.
- source_word: γεγέννηται
  choice: est né
  rationale: Le parfait passif grec désigne la naissance du fils; « est né » est la tournure française naturelle et exacte dans ce contraste.
- source_word: ἐλευθέρα
  choice: femme libre
  rationale: L’adjectif substantivé s’oppose directement à παιδίσκη; « femme libre » préserve clairement la dimension sociale du contraste.
- source_word: δι’ ἐπαγγελίας
  choice: par l’intermédiaire d’une promesse
  rationale: La préposition διά avec le génitif exprime l’intermédiaire ou le moyen. L’article indéfini reflète l’absence d’article grec sans empêcher le contexte d’identifier la promesse divine.
- source_word: ὁ μὲν ... ὁ δὲ
  choice: le fils ... tandis que le fils
  rationale: Le nom « fils », implicite en grec, est répété pour rendre la comparaison claire et naturelle en français.
theological_decisions:
- issue: Contraste entre κατὰ σάρκα et δι’ ἐπαγγελίας
  choice: Conserver « selon la chair » face à « par l’intermédiaire d’une promesse »
  alternative: « de manière purement humaine » face à « en vertu de la promesse »
  rationale: Le contexte oppose une naissance obtenue selon les possibilités humaines ordinaires à une naissance rendue possible conformément à la promesse de Dieu. Garder « chair » préserve le vocabulaire et l’ambiguïté théologique de Paul sans laisser entendre que la naissance physique serait en elle-même pécheresse.
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme entre « femme esclave » et « femme libre » est maintenu, de même que le terme paulinien « chair ». Les notes explicitent les deux principales possibilités de formulation sans imposer une interprétation confessionnelle.
