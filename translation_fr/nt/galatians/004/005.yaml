id: GAL.4.5
reference: Galatians 4:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἵνα τοὺς ὑπὸ νόμον ἐξαγοράσῃ, ἵνα τὴν υἱοθεσίαν ἀπολάβωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/005.yaml
  text: so that he might redeem those under the law[a], so that we might receive adoption as sons.
translation:
  language: fr
  text: afin de racheter ceux qui sont sous la Loi, afin que nous recevions l’adoption en tant que fils[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou simplement « l’adoption ». Le terme grec désigne littéralement l’établissement dans la condition de fils et souligne un plein statut filial, avec les droits d’héritage qui s’y rattachent. Ici, il inclut tous les croyants, femmes et hommes.
    reason: Préciser la portée de υἱοθεσία et éviter que le masculin filial soit compris comme excluant les femmes.
lexical_decisions:
- source_word: ἵνα
  choice: afin de / afin que
  rationale: Les deux occurrences introduisent le but. La variation grammaticale française — infinitif lorsque le sujet reste le même, puis subjonctif lorsque le sujet change — exprime naturellement la même valeur finale.
- source_word: τοὺς ὑπὸ νόμον
  choice: ceux qui étaient sous la Loi
  rationale: La tournure conserve l’image paulinienne d’une condition sous l’autorité de la Loi. L’imparfait situe cette condition par rapport à l’acte rédempteur exprimé par l’aoriste.
- source_word: νόμον
  choice: la Loi
  rationale: Dans ce contexte, νόμος désigne très probablement la Loi mosaïque plutôt que la loi au sens abstrait. La majuscule signale ce référent sans ajouter une précision absente du texte.
- source_word: ἐξαγοράσῃ
  choice: racheter
  rationale: Ce verbe rend à la fois l’arrière-plan d’acquisition et l’effet libérateur de ἐξαγοράζω, tout en restant courant dans le registre biblique français.
- source_word: τὴν υἱοθεσίαν
  choice: l’adoption comme fils
  rationale: Cette formulation conserve la dimension explicitement filiale de υἱοθεσία ainsi que son association au statut et à l’héritage, sans limiter le groupe bénéficiaire aux hommes.
- source_word: ἀπολάβωμεν
  choice: nous recevions
  rationale: « Recevoir » rend clairement ἀπολαμβάνω ici; le sens de « recevoir en retour » n’est pas imposé par le contexte.
theological_decisions:
- issue: Portée genrée de υἱοθεσία
  choice: l’adoption comme fils
  alternative: l’adoption; le statut de fils
  rationale: Le masculin filial est significatif dans l’argument sur l’héritage, mais le « nous » inclut les croyantes comme les croyants. La note explicite cette portée inclusive sans effacer la forme conceptuelle du grec.
- issue: Référent de « ceux qui étaient sous la Loi »
  choice: La formule vise principalement les personnes placées sous la Loi mosaïque.
  alternative: La formule désigne plus largement toute personne soumise à une loi.
  rationale: Le contexte immédiat de Galates 4.4–5, où le Fils est né sous la Loi, favorise le cadre mosaïque. La traduction préserve néanmoins la formulation concise de Paul plutôt que d’insérer « mosaïque » dans le verset.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « afin » reproduit la structure en deux propositions finales du grec. « Racheter » et « sous la Loi » conservent les images théologiques de Paul sans les développer dans le corps du verset.
