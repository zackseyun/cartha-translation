    rationale: Le grec emploie l’expression substantivée τοὺς ὑπὸ νόμον sans marque explicite d’imparfait. Le présent français rend plus directement la condition des personnes que le Christ vient racheter.
  - severity: low
    issue: Formulation française de υἱοθεσία
    rationale: « Adoption comme fils » est moins naturel et peut se lire comme une comparaison. « Adoption en tant que fils » énonce plus nettement le statut reçu, sans réduire le terme à une simple adoption générique.
