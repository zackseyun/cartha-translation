review_pass:
  verdict: revise
  source_fidelity: La structure finale double (ἵνα … ἵνα) et les choix « racheter », « sous la Loi » et « recevoir » rendent fidèlement le grec. « Étaient sous la Loi » est défendable dans le cadre narratif, mais « sont sous la Loi » reflète plus directement la caractérisation participiale τοὺς ὑπὸ νόμον et évite d’ajouter une temporalité passée au groupe désigné.
  naturalness: « L’adoption comme fils » est compréhensible, mais demeure peu idiomatique en français moderne. « L’adoption en tant que fils » exprime plus clairement le statut filial visé, tout en préservant le masculin conceptuel du terme grec. Le déplacement de l’appel de note avant le point suit la ponctuation française usuelle.
  terminology: « Loi » avec majuscule est approprié ici pour la Loi mosaïque. « Racheter » conserve la portée libératrice de ἐξαγοράζω. La note explique correctement que le masculin de υἱοθεσία renvoie au statut filial et à l’héritage sans exclure les femmes.
  issues:
