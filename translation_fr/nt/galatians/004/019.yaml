source:
  edition: SBLGNT
  text: ⸀τέκνα μου, οὓς πάλιν ὠδίνω ⸀μέχρις οὗ μορφωθῇ Χριστὸς ἐν ὑμῖν·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/019.yaml
  text: My children[a], for whom I am again suffering birth pains until Messiah is formed in you[c][b],
translation:
  language: fr
  text: Mes enfants, pour qui j’éprouve de nouveau les douleurs de l’enfantement[c] jusqu’à ce que le Messie[a] soit formé en vous[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le Christ ». « Messie » traduit le titre grec Χριστός ; « Christ » en est la forme française traditionnelle.
    reason: alternative_reading
  - marker: b
    text: Ou « parmi vous », ce qui met davantage en relief la dimension communautaire possible.
    reason: lexical_alternative
  - marker: c
    text: Littéralement, « pour qui je suis de nouveau en travail » ou « pour qui je souffre de nouveau les douleurs de l’enfantement ».
    reason: lexical_alternative
lexical_decisions:
- source_word: τέκνα μου
  choice: Mes enfants
  rationale: Le vocatif est affectueux, mais le nom τέκνα ne signifie pas explicitement « petits enfants ». « Mes enfants » est naturel, digne et précis.
- source_word: οὓς
  choice: vous pour qui
  rationale: Le relatif accusatif reprend les destinataires. Cette formulation française l’intègre naturellement à la métaphore des douleurs de l’accouchement.
- source_word: πάλιν
  choice: de nouveau
  rationale: πάλιν indique la répétition; « de nouveau » est ici plus fluide que « encore », qui pourrait suggérer la continuité plutôt que la reprise.
- source_word: ὠδίνω
  choice: j’éprouve les douleurs de l’accouchement
  rationale: Le verbe évoque directement les douleurs du travail. La formulation conserve l’image maternelle vive sans devenir obscure ou excessivement littérale.
- source_word: μέχρις οὗ
  choice: jusqu’à ce que
  rationale: Cette locution rend naturellement la limite temporelle ou le but vers lequel tend l’image de Paul.
- source_word: μορφωθῇ
  choice: soit formé
  rationale: Le passif préserve l’idée que le Messie prend forme chez les destinataires sans préciser l’agent ni transformer la métaphore en énoncé doctrinal technique.
- source_word: Χριστὸς
  choice: le Messie
  rationale: Χριστός est ici rendu comme un titre. L’article français est nécessaire dans cet emploi naturel, même si le grec n’en porte pas.
- source_word: ἐν ὑμῖν
  choice: en vous
  rationale: Cette traduction conserve le sens intérieur le plus immédiat, tandis que le pluriel permet aussi une portée communautaire. « Parmi vous » reste possible.
theological_decisions:
- issue: Sens du Messie « formé en vous »
  choice: Conserver l’image d’une formation du Messie chez les croyants, sans en définir le mécanisme doctrinal
  alternative: Comprendre avant tout une formation du Messie au sein de la communauté, ou une allusion précise à la conversion et à la nouvelle naissance
  rationale: Le grec permet une dimension personnelle et collective. La traduction maintient cette tension et ne réduit pas la métaphore pastorale de Paul à une formulation doctrinale plus étroite.
- issue: Valeur de ἐν ὑμῖν
  choice: en vous
  alternative: parmi vous
  rationale: « En vous » représente le sens local ou intérieur le plus direct, mais le pronom pluriel laisse ouverte la dimension collective; une note signale explicitement l’autre possibilité.
translation_notes:
  register: Français international moderne, accessible et soutenu. La syntaxe « vous pour qui » évite une construction pesante tout en conservant l’adresse affectueuse et l’image maternelle. La virgule finale reflète le caractère suspendu et passionné du passage dans son contexte, plutôt que d’imposer une conclusion absente de la source fournie.
