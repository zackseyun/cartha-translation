  source_fidelity: 'Le sens du grec est bien rendu : Paul s’adresse affectueusement aux Galates et reprend la métaphore des douleurs de l’enfantement, répétées « jusqu’à ce que » le Messie soit formé en eux. « En vous » maintient correctement la possibilité d’une portée individuelle et communautaire.'
  naturalness: La formulation « vous pour qui » est grammaticalement possible, mais elle est plus lourde et moins naturelle en français moderne que « pour qui » après l’apostrophe. « Les douleurs de l’enfantement » est également l’expression française plus idiomatique pour cette métaphore. La phrase doit se clore par un point plutôt que par une virgule.
  terminology: « Le Messie » rend correctement Χριστός conformément au choix éditorial fourni. « Formé en vous » préserve le passif et ne résout pas indûment la portée théologique de l’expression. Les notes sont conservées, avec une légère révision de la note littérale pour éviter de présenter une paraphrase comme une formulation strictement littérale.
