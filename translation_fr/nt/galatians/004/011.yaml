  source_fidelity: Le projet rend correctement l’inquiétude présente de φοβοῦμαι, l’incertitude appréhendée de μή πως, le parfait de κεκοπίακα et l’idée de vanité de εἰκῇ. Toutefois, « d’une manière ou d’une autre » tend à évoquer plusieurs moyens possibles plutôt que l’éventualité indéterminée (« peut-être », « par hasard ») de μή πως. La reprise explicite de la crainte sous forme de discours indirect libre après deux-points rend mieux la relation syntaxique et sémantique de l’ensemble.
  naturalness: '« Je crains pour vous d’avoir… » est grammaticalement possible, mais l’enchaînement est lourd et peut momentanément faire porter « pour vous » sur le travail plutôt que sur l’objet de l’inquiétude. « J’ai peur pour vous : peut-être ai-je travaillé en vain auprès de vous » est naturel, sobre et clair en français international moderne.'
  terminology: « J’ai peur pour vous » rend fidèlement la préoccupation pastorale sans suggérer que Paul a peur des Galates. « Travaillé en vain » et « auprès de vous » sont idiomatiques et conservent respectivement l’effort vain et le travail dirigé vers les destinataires. Aucun terme théologique spécialisé ne demande d’ajustement.
