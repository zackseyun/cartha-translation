    rationale: 'Cette locution française décrit normalement une pluralité ou une indétermination de moyens. Dans une proposition de crainte, μή πως exprime plutôt la possibilité redoutée : « peut-être » conserve cette nuance sans l’élargir.'
  - severity: low
    issue: Construction « Je crains pour vous d’avoir travaillé… »
    rationale: La construction infinitive compacte deux relations distinctes — la crainte au sujet des Galates et la possibilité que le travail de Paul ait été vain — et sonne moins spontanée. Une ponctuation après « vous » clarifie ces deux éléments sans modifier le sens.
