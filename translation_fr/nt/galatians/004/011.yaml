  text: φοβοῦμαι ὑμᾶς μή πως εἰκῇ κεκοπίακα εἰς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/011.yaml
  text: I fear for you[a], that somehow I have labored over you in vain.
translation:
  language: fr
  text: 'J’ai peur pour vous[a] : peut-être ai-je travaillé en vain auprès de vous.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Je crains, à votre sujet, d’avoir peut-être travaillé en vain auprès de vous. »
    reason: 'Alternative lexicale et syntaxique : « je crains » peut remplacer « j’ai peur », et la construction infinitive peut rendre le contenu de l’appréhension.'
lexical_decisions:
- source_word: φοβοῦμαι ὑμᾶς
  choice: Je crains pour vous
  rationale: Le présent exprime l’inquiétude actuelle de Paul. Avec le pronom à l’accusatif, le français « craindre pour vous » indique naturellement qu’il redoute ce qui pourrait leur arriver, et non qu’il a peur d’eux.
- source_word: μή πως
  choice: d’une manière ou d’une autre
  rationale: Dans cette construction d’appréhension, la locution conserve l’idée d’une possibilité redoutée sans imposer une tournure française lourde comme « de peur que peut-être ».
- source_word: εἰκῇ
  choice: en vain
  rationale: Cette expression française courante rend directement l’idée d’un effort qui risquerait de rester sans résultat.
- source_word: κεκοπίακα
  choice: d’avoir travaillé
  rationale: 'L’infinitif passé dépend naturellement de « je crains » et reflète le parfait grec : Paul considère un travail déjà accompli dont le résultat présent est en question. « Travaillé » reste clair, tandis que le contexte communique l’effort soutenu.'
- source_word: εἰς ὑμᾶς
  choice: parmi vous
  rationale: La préposition présente le travail comme dirigé vers les Galates. « Parmi vous » est idiomatique pour l’activité apostolique exercée auprès d’une communauté; la note conserve l’autre possibilité, « pour vous ».
theological_decisions:
- issue: Nature de l’inquiétude de Paul
  choice: 'Une appréhension pastorale : son travail auprès des Galates pourrait finalement rester sans fruit.'
  alternative: Une simple anxiété personnelle sans référence marquée à l’échec possible de son œuvre apostolique.
  rationale: L’enchaînement φοβοῦμαι… μή πως… εἰκῇ κεκοπίακα lie explicitement son inquiétude à la possibilité que son travail déjà fourni ne produise pas le résultat attendu.
- issue: Valeur du parfait κεκοπίακα sous μή πως
  choice: Rendre un travail déjà accompli dont l’efficacité présente est redoutée comme nulle.
  alternative: Employer une forme explicitement potentielle, telle que « que je n’aie peut-être travaillé », ou affirmer sans nuance « j’ai travaillé en vain ».
  rationale: Le parfait est indicatif, mais il se trouve dans le contenu d’une crainte. « Je crains… d’avoir travaillé » préserve à la fois l’accompli et le caractère non affirmé du résultat redouté.
translation_notes:
  register: Français international moderne, sobre et pastoral. La phrase demeure concise et digne. La virgule après « pour vous » est évitée, car la construction infinitive s’enchaîne naturellement en français.
