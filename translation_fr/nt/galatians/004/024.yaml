source:
  edition: SBLGNT
  text: ἅτινά ἐστιν ἀλληγορούμενα· αὗται γάρ εἰσιν δύο διαθῆκαι, μία μὲν ἀπὸ ὄρους Σινᾶ, εἰς δουλείαν γεννῶσα, ἥτις ἐστὶν Ἁγάρ,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/024.yaml
  text: 'These things are being interpreted allegorically[a], for these women are two covenants: one from Mount Sinai, bearing children for slavery[b]; she is Hagar.'
translation:
  language: fr
  text: 'Ces faits sont interprétés de manière allégorique[a] : ces femmes représentent en effet deux alliances. L’une vient du mont Sinaï et met au monde des enfants pour l’esclavage[b] : c’est Agar.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « sont présentés sous forme d’allégorie » ou « ont un sens allégorique ». Le grec indique que Paul emploie le récit précédent de manière allégorique.'
    reason: lexical_alternative
  - marker: b
    text: 'Autre traduction possible : « met au monde des enfants dans l’esclavage ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἅτινά
  choice: Ces éléments
  rationale: Le pronom relatif neutre pluriel renvoie au récit précédent. « Ces éléments » garde ce renvoi sans réduire l’antécédent aux seules femmes.
- source_word: ἀλληγορούμενα
  choice: sont interprétés de manière allégorique
  rationale: La périphrase passive présente décrit l’usage interprétatif du récit par Paul, sans nier son caractère historique ni affirmer simplement que les personnages seraient irréels.
- source_word: αὗται
  choice: ces femmes
  rationale: Le démonstratif féminin pluriel renvoie à Sara et Agar; l’ajout de « femmes » explicite naturellement l’antécédent en français.
- source_word: διαθῆκαι
  choice: alliances
  rationale: « Alliances » est le terme biblique français usuel pour les διαθῆκαι mises en relation avec le Sinaï.
- source_word: μία μὲν ἀπὸ ὄρους Σινᾶ
  choice: L’une vient du mont Sinaï
  rationale: « L’une » amorce le contraste poursuivi au verset suivant; « vient de » exprime naturellement l’origine marquée par ἀπό.
- source_word: εἰς δουλείαν γεννῶσα
  choice: met au monde des enfants destinés à l’esclavage
  rationale: La formulation conserve l’image maternelle de γεννῶσα et la direction ou le résultat exprimé par εἰς, dans un français naturel.
- source_word: ἥτις ἐστὶν Ἁγάρ
  choice: c’est Agar
  rationale: Cette identification concise garde le lien allégorique entre l’alliance issue du Sinaï et Agar, sans personnaliser grammaticalement l’alliance de façon artificielle.
theological_decisions:
- issue: Nature de l’emploi du récit de Sara et d’Agar
  choice: Le récit est « interprété de manière allégorique ».
  alternative: « Ces éléments sont une allégorie » ou une formulation qui nierait l’historicité du récit.
  rationale: Le participe passif ἀλληγορούμενα indique le mode d’interprétation ou d’emploi du récit. La traduction préserve cette nuance sans trancher au-delà du texte.
- issue: Portée de δουλεία
  choice: esclavage
  alternative: servitude; dépendance
  rationale: « Esclavage » restitue la force de δουλεία et le contraste paulinien, sans en atténuer la condition de sujétion.
- issue: Relation entre l’alliance du Sinaï et Agar
  choice: « c’est Agar » conserve l’identification rhétorique directe.
  alternative: Ajouter une explication doctrinale sur la loi mosaïque ou Israël.
  rationale: Le texte établit l’identification dans le cadre de l’allégorie, mais n’en développe pas encore toutes les implications dans ce verset.
translation_notes:
  register: Français international moderne, digne et accessible. « Met au monde » maintient l’image maternelle; « destinés à » rend idiomatiquement le mouvement vers une condition sans masquer la nuance de résultat. Les deux-points structurent le raisonnement et annoncent le contraste poursuivi au verset suivant.
