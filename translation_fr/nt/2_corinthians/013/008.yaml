source:
  edition: SBLGNT
  text: οὐ γὰρ δυνάμεθά τι κατὰ τῆς ἀληθείας, ἀλλὰ ὑπὲρ τῆς ἀληθείας.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/008.yaml
  text: For we are not able to do anything against the truth[a], but for the truth.
translation:
  language: fr
  text: Car nous ne pouvons rien contre la vérité, mais pour la vérité.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐ γὰρ
  choice: Car… ne… rien
  rationale: γάρ introduit l’explication de l’affirmation précédente ; « Car » rend ce lien avec concision. La négation οὐ, associée à τι, se rend naturellement par « ne… rien ».
- source_word: δυνάμεθά
  choice: nous ne pouvons
  rationale: δύναμαι exprime ici la capacité. « Nous ne pouvons » est naturel en français moderne et conserve explicitement l’idée d’incapacité.
- source_word: τι
  choice: rien
  rationale: Sous la portée de la négation, l’indéfini τι correspond idiomatiquement à « rien » et donne à l’énoncé sa portée générale.
- source_word: κατὰ τῆς ἀληθείας
  choice: contre la vérité
  rationale: κατά avec le génitif a ici un sens hostile ou oppositif. L’article est conservé dans « la vérité », sans réduire cette expression à une formulation doctrinale particulière.
- source_word: ἀλλὰ
  choice: mais
  rationale: ἀλλά marque le contraste net entre les deux membres de l’antithèse.
- source_word: ὑπὲρ τῆς ἀληθείας
  choice: seulement pour la vérité
  rationale: ὑπέρ exprime l’action en faveur de la vérité. « Pour la vérité » préserve le parallélisme avec « contre la vérité ». « Seulement » rend explicite la valeur restrictive produite par l’opposition οὐ… ἀλλά, courante en grec, sans prétendre qu’un adverbe grec distinct soit présent.
theological_decisions:
- issue: Portée de « la vérité »
  choice: Conserver « la vérité » sans la définir plus étroitement
  alternative: « la vérité de l’Évangile » ou « ce qui est vrai »
  rationale: Dans ce contexte, l’expression inclut certainement la vérité de l’Évangile, mais le grec reste plus large. La traduction conserve donc cette ampleur et la tension théologique du texte.
- issue: Nature de l’incapacité exprimée
  choice: Ne pas préciser s’il s’agit d’une incapacité morale, apostolique ou absolue
  alternative: Paraphraser par « notre autorité ne peut servir qu’à soutenir la vérité »
  rationale: Le texte affirme l’incapacité sans en expliciter ici la nature. Une paraphrase plus précise résoudrait indûment une ambiguïté réelle.
translation_notes:
  register: Formulation concise, digne et naturelle en français international moderne. Le parallélisme « contre… pour… » reproduit l’antithèse grecque. « Seulement » clarifie la construction restrictive οὐ… ἀλλά et évite que le second membre paraisse elliptique ou inachevé en français.
