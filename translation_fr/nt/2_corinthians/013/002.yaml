  source_fidelity: La version rend correctement l’avertissement et ses destinataires, mais sa réorganisation (« Je l’ai déjà dit à ceux… lorsque j’étais présent… ») rattache plus étroitement la première déclaration aux destinataires et à la deuxième présence que ne le fait la syntaxe grecque condensée. Une formulation qui conserve la double situation — présent lors de la deuxième fois, absent maintenant — est plus fidèle.
