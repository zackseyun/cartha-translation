source:
  edition: SBLGNT
  text: προείρηκα καὶ προλέγω ὡς παρὼν τὸ δεύτερον καὶ ἀπὼν ⸀νῦν, τοῖς προημαρτηκόσιν καὶ τοῖς λοιποῖς πᾶσιν, ὅτι ἐὰν ἔλθω εἰς τὸ πάλιν οὐ φείσομαι,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/002.yaml
  text: I have said before[a], and I say beforehand now while absent, as when present the second time, to those who sinned previously and to all the rest, that if I come again, I will not spare them.
translation:
  language: fr
  text: 'Je l’ai déjà dit, et maintenant que je suis absent, je le dis d’avance — comme lorsque j’étais présent pour la deuxième fois — à ceux qui avaient déjà péché et à tous les autres : si je reviens[a], je ne les épargnerai pas.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de manière plus explicite : « si je viens une troisième fois ». Le grec dit littéralement « si je viens de nouveau » ; dans le contexte, cela peut désigner une nouvelle venue après la deuxième.'
    reason: alternative_reading
lexical_decisions:
- source_word: προείρηκα
  choice: Je l’ai déjà dit
  rationale: Le parfait renvoie à une déclaration antérieure qui reste valable. Cette formulation conserve ce sens sans ajouter explicitement l’idée d’un avertissement.
- source_word: προλέγω
  choice: je le leur dis d’avance
  rationale: Le verbe signifie littéralement « dire d’avance ». La reprise de « dire » maintient le lien lexical avec προείρηκα, tandis que « leur » explicite naturellement les destinataires en français.
- source_word: ὡς παρὼν τὸ δεύτερον καὶ ἀπὼν νῦν
  choice: lorsque j’étais présent pour la deuxième fois… maintenant que je suis absent
  rationale: La tournure grecque est condensée. Le français déploie le contraste entre la deuxième présence de Paul et son absence actuelle sans transformer explicitement cette présence en « deuxième visite ».
- source_word: τοῖς προημαρτηκόσιν
  choice: à ceux qui avaient péché auparavant
  rationale: Le plus-que-parfait situe naturellement leur péché avant la déclaration faite lors de la deuxième présence, sans préciser s’ils se sont repentis depuis.
- source_word: τοῖς λοιποῖς πᾶσιν
  choice: à tous les autres
  rationale: Cette expression rend la portée inclusive de πᾶσιν et distingue ce groupe de ceux qui avaient péché auparavant.
- source_word: ἐὰν ἔλθω εἰς τὸ πάλιν
  choice: si je reviens
  rationale: La tournure idiomatique grecque évoque une nouvelle venue. « Si je reviens » est naturel et n’impose pas dans le texte principal le décompte interprétatif d’une troisième visite.
- source_word: οὐ φείσομαι
  choice: je ne les épargnerai pas
  rationale: φείδομαι exprime le fait d’épargner ou de s’abstenir de sévir. Le pronom objet, nécessaire en français courant, renvoie aux personnes qui viennent d’être interpellées sans définir la forme précise de la sévérité annoncée.
theological_decisions:
- issue: Portée de la sévérité annoncée par Paul
  choice: L’avertissement est adressé à ceux qui avaient péché auparavant ainsi qu’à tous les autres, et Paul annonce qu’il ne les épargnera pas s’il revient.
  alternative: Limiter la menace aux seuls pécheurs mentionnés en premier, ou préciser une forme particulière de discipline ecclésiale.
  rationale: La syntaxe nomme les deux groupes comme destinataires. La traduction conserve l’ampleur et la gravité de l’avertissement, mais ne précise pas la mesure que Paul prendra.
translation_notes:
  register: Français international moderne, digne et direct. La phrase grecque très condensée est réorganisée pour rendre clairement le contraste temporel entre la deuxième présence et l’absence actuelle, tout en conservant le vocabulaire de « dire » plutôt que d’introduire deux fois le verbe interprétatif « avertir ».
