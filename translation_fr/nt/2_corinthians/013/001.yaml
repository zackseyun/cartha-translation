  source_fidelity: 'Le sens est bien rendu : Paul annonce sa troisième venue et cite le principe juridique de Deutéronome 19.15. « Deux ou trois témoins » restitue correctement la formule traditionnelle malgré le καί grec. Toutefois, « déposition » rend plus exactement et plus naturellement la fonction juridique de ἐπὶ στόματος que « témoignage » dans ce contexte. La note d’alternative doit conserver « sur la bouche », non « par la bouche », pour refléter la préposition grecque.'
  naturalness: Le français est clair, moderne et d’un registre approprié. « C’est la troisième fois que je viens chez vous » est idiomatique. Dans la citation juridique, « sur la déposition de deux ou trois témoins » est une collocation française plus précise et plus fluide.
