  text: Τρίτον τοῦτο ἔρχομαι πρὸς ὑμᾶς· ἐπὶ στόματος δύο μαρτύρων καὶ τριῶν σταθήσεται πᾶν ῥῆμα.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/001.yaml
  text: 'This is the third time I am coming to you: “Every matter will be established by the testimony of two witnesses or three.”[a][b]'
translation:
  language: fr
  text: 'C’est la troisième fois que je viens chez vous : « Toute affaire sera établie sur la déposition de deux ou trois témoins. »[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction : « Toute parole sera établie sur la bouche de deux ou trois témoins. » Le grec reprend de près la formulation de Deutéronome 19.15 et emploie un idiome juridique.'
    reason: lexical_alternative
  - marker: b
    text: Allusion à Deutéronome 19.15.
    reason: cross_reference
lexical_decisions:
- source_word: Τρίτον τοῦτο
  choice: C’est la troisième fois
  rationale: Le groupe accusatif neutre a une valeur adverbiale et indique qu’il s’agit de la troisième venue. Cette tournure est naturelle en français moderne.
- source_word: ἔρχομαι πρὸς ὑμᾶς
  choice: que je viens chez vous
  rationale: Le présent ἔρχομαι annonce ici une venue imminente. « Je viens chez vous » conserve l’immédiateté et rend naturellement la destination auprès de la communauté.
- source_word: ἐπὶ στόματος
  choice: sur le témoignage de
  rationale: L’expression est un idiome juridique, repris de Deutéronome 19.15. « Sur le témoignage de » transmet sa portée probatoire sans le calque obscur « sur la bouche de ».
- source_word: δύο μαρτύρων καὶ τριῶν
  choice: deux ou trois témoins
  rationale: Dans cette formule scripturaire, καί exprime le choix distributif « deux ou trois », et non l’addition de deux et de trois témoins. L’ordre choisi est idiomatique en français.
- source_word: σταθήσεται
  choice: sera établie
  rationale: Dans ce contexte juridique, le futur passif de ἵστημι signifie qu’une affaire sera tenue pour fondée ou confirmée.
- source_word: πᾶν ῥῆμα
  choice: Toute affaire
  rationale: ῥῆμα peut désigner une parole ou une déclaration, mais, dans cette citation juridique, il renvoie plus largement à ce qui doit être établi. « Affaire » préserve cette portée sans limiter le sens à une accusation précise.
theological_decisions:
- issue: Portée de la citation juridique de Deutéronome dans le contexte disciplinaire de Paul
  choice: Rendre πᾶν ῥῆμα par « Toute affaire », sans limiter explicitement le principe à la discipline de l’Église.
  alternative: « Toute parole », « toute déclaration » ou « toute accusation »
  rationale: Paul invoque un principe scripturaire de preuve. La traduction garde sa portée juridique générale et évite d’imposer une interprétation ecclésiale plus étroite que le grec.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation principale privilégie un idiome juridique clair, tandis que la note conserve l’alternative plus littérale et signale l’écho scripturaire.
