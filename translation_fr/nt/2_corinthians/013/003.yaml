id: 2CO.13.3
reference: 2 Corinthians 13:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐπεὶ δοκιμὴν ζητεῖτε τοῦ ἐν ἐμοὶ λαλοῦντος Χριστοῦ· ὃς εἰς ὑμᾶς οὐκ ἀσθενεῖ ἀλλὰ δυνατεῖ ἐν ὑμῖν,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/003.yaml
  text: since you are seeking proof that Messiah is speaking in me—he is not weak toward you[a], but is powerful in you[b],
translation:
  language: fr
  text: 'puisque vous cherchez une preuve que le Messie parle en moi[a] : il n’est pas faible à votre égard, mais il déploie sa puissance en vous[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « parle par mon intermédiaire ». Le grec dit plus littéralement « parle en moi ».
    reason: lexical_alternative
  - marker: b
    text: Ou « parmi vous ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεὶ
  choice: puisque
  rationale: Introduit la raison de la fermeté annoncée par Paul dans le contexte. « Puisque » conserve naturellement la valeur causale.
- source_word: δοκιμὴν ζητεῖτε
  choice: vous cherchez une preuve
  rationale: δοκιμή désigne ici l’élément probant qui atteste une réalité, et le présent ζητεῖτε suggère une démarche en cours.
- source_word: τοῦ ἐν ἐμοὶ λαλοῦντος Χριστοῦ
  choice: que le Messie parle en moi
  rationale: La construction au génitif après δοκιμή est rendue idiomatiquement par une proposition complétive. « En moi » maintient la préposition grecque sans imposer l’interprétation « par mon intermédiaire ».
- source_word: Χριστοῦ
  choice: le Messie
  rationale: Χριστός garde ici sa valeur de titre; « le Messie » en exprime le sens en français courant.
- source_word: εἰς ὑμᾶς
  choice: envers vous
  rationale: Exprime la direction ou la relation à l’égard des Corinthiens; « envers vous » est naturel et proche du grec.
- source_word: οὐκ ἀσθενεῖ
  choice: il n’est pas faible
  rationale: Conserve le vocabulaire de la faiblesse et son contraste théologique avec la puissance dans le contexte.
- source_word: ἀλλὰ δυνατεῖ
  choice: mais il agit avec puissance
  rationale: Le verbe rare δυνατέω indique l’exercice effectif de la puissance. Cette formulation verbale est naturelle en français et maintient le contraste avec la faiblesse.
- source_word: ἐν ὑμῖν
  choice: en vous
  rationale: Rend directement la préposition ἐν et le pluriel; l’expression peut viser les croyants intérieurement ou la communauté dans son ensemble.
theological_decisions:
- issue: Valeur de Χριστοῦ
  choice: le Messie
  alternative: le Christ
  rationale: Le terme est compris comme un titre dans cette formulation. « Le Messie » en préserve explicitement le sens sans ajouter de particularité confessionnelle.
- issue: Portée de ἐν ἐμοί
  choice: parle en moi
  alternative: parle par mon intermédiaire
  rationale: La formulation principale suit littéralement la préposition et préserve la tension entre présence intérieure et action médiatisée; la note signale l’autre compréhension naturelle.
- issue: Portée de ἐν ὑμῖν
  choice: agit avec puissance en vous
  alternative: agit avec puissance parmi vous
  rationale: « En vous » correspond directement au grec, tandis que « parmi vous » peut mieux exprimer l’action au sein de la communauté. La note conserve cette ambiguïté.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe demeure étroitement liée au grec tout en étant idiomatique; les notes préservent les ambiguïtés des deux emplois de ἐν.
