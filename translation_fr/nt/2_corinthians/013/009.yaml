  verdict: revise
  source_fidelity: 'Le sens fondamental est bien rendu : Paul se réjouit de sa propre faiblesse apparente et de la force des Corinthiens, et il prie pour leur κατάρτισις. Toutefois, l’appel de note est actuellement placé après « forts », alors que la note explique « rétablissement » (κατάρτισιν).'
  naturalness: Le français est globalement naturel et de registre approprié. « C’est aussi ce que nous demandons dans nos prières » rend plus directement τοῦτο καὶ εὐχόμεθα que « Et voici aussi ce que nous demandons dans nos prières », tout en restant idiomatique.
  terminology: « Faibles / forts » préserve utilement le contraste ἀσθενῶμεν / δυνατοὶ. « Rétablissement » est un choix défendable pour κατάρτισις dans ce contexte; les nuances de maturité, d’équipement et de mise en bon état doivent rester signalées en note.
  issues:
