source:
  edition: SBLGNT
  text: χαίρομεν γὰρ ὅταν ἡμεῖς ἀσθενῶμεν, ὑμεῖς δὲ δυνατοὶ ἦτε· ⸀τοῦτο καὶ εὐχόμεθα, τὴν ὑμῶν κατάρτισιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/009.yaml
  text: 'For we rejoice when we are weak and you are strong[a]. And this also is what we pray for: your restoration.'
translation:
  language: fr
  text: 'Car nous nous réjouissons lorsque nous sommes faibles et que vous êtes forts. C’est aussi ce que nous demandons dans nos prières : votre rétablissement[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « votre maturité », « votre perfectionnement » ou « le fait que vous soyez rendus pleinement aptes ». Le grec peut évoquer un rétablissement, un équipement ou l’action d’amener quelqu’un à l’état qui convient.
    reason: lexical_alternative
lexical_decisions:
- source_word: χαίρομεν
  choice: nous nous réjouissons
  rationale: Le présent exprime la disposition actuelle de Paul. « Nous nous réjouissons » conserve la force positive du verbe et son emploi paulinien courant.
- source_word: γὰρ
  choice: car
  rationale: « Car » maintient le lien explicatif avec le contexte précédent dans un français naturel et soutenu.
- source_word: ὅταν
  choice: lorsque
  rationale: Avec le subjonctif grec, la conjonction a ici une valeur temporelle générale. « Lorsque » rend cette valeur sans alourdir la phrase.
- source_word: ἀσθενῶμεν
  choice: nous sommes faibles
  rationale: Le terme peut évoquer une faiblesse physique, sociale ou rhétorique. « Faibles » préserve cette amplitude et le contraste direct avec δυνατοί.
- source_word: δυνατοὶ
  choice: forts
  rationale: « Forts » constitue l’antonyme naturel de « faibles » et respecte le contraste rhétorique sans préciser indûment la nature de cette force.
- source_word: τοῦτο καὶ εὐχόμεθα
  choice: Et voici aussi ce que nous demandons dans nos prières
  rationale: Cette formulation rend l’accent placé sur τοῦτο et comprend εὔχομαι au sens de prier, tout en restant idiomatique en français.
- source_word: κατάρτισιν
  choice: rétablissement
  rationale: Le nom peut désigner la remise en bon état, l’équipement ou l’action de mener à l’état qui convient. Dans le contexte des corrections pastorales adressées aux Corinthiens, « rétablissement » convient bien sans exclure les autres nuances, signalées en note.
theological_decisions:
- issue: Sens de κατάρτισις dans le but pastoral de Paul
  choice: votre rétablissement
  alternative: votre maturité ; votre perfectionnement ; le fait que vous soyez rendus pleinement aptes
  rationale: « Rétablissement » exprime vraisemblablement l’idée que les Corinthiens soient remis en bon ordre, sans introduire une doctrine technique de perfection. La note conserve l’éventail sémantique réel du grec.
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme « faibles / forts » est conservé, ainsi que le lien explicatif initial. La tournure « demandons dans nos prières » évite l’ambiguïté française de « prier pour votre rétablissement », qui pourrait être comprise comme une prière adressée au rétablissement.
