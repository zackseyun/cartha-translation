    issue: Appel de note lexical placé après « forts » au lieu de « rétablissement ».
    rationale: La note a traite des sens possibles de κατάρτισις, rendu par « rétablissement », et non de δυνατοί (« forts »). L’ancre doit donc être déplacée afin que le lecteur identifie correctement le terme commenté.
  - severity: low
    issue: « Et voici aussi ce que nous demandons dans nos prières » est légèrement plus démonstratif que nécessaire.
    rationale: τοῦτο καὶ εὐχόμεθα signifie directement « nous prions/demandons aussi ceci ». Une formulation française plus directe conserve mieux l’enchaînement de la phrase grecque.
