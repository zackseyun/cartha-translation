id: 2CO.13.12
reference: 2 Corinthians 13:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀσπάσασθε ἀλλήλους ἐν ἁγίῳ φιλήματι. ἀσπάζονται ὑμᾶς οἱ ἅγιοι πάντες.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/012.yaml
  text: Greet one another with a holy kiss[b][a]. All the saints greet you.
translation:
  language: fr
  text: Saluez-vous les uns les autres par un saint baiser. Tous les saints[a] vous saluent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ici, « saints » désigne les croyants, c’est-à-dire le peuple que Dieu a mis à part; le terme ne se limite pas à une catégorie particulière de chrétiens canonisés.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: Saluez-vous
  rationale: L’impératif aoriste moyen à la deuxième personne du pluriel formule une exhortation directe. Avec le complément réciproque, « Saluez-vous » est naturel et concis en français.
- source_word: ἀλλήλους
  choice: les uns les autres
  rationale: Ce pronom réciproque indique une action mutuelle au sein de la communauté.
- source_word: ἐν ἁγίῳ φιλήματι
  choice: par un saint baiser
  rationale: Dans cette formule de salutation, ἐν exprime naturellement le moyen ou la manière. « Saint » conserve la portée de ἁγίῳ, et « baiser » rend directement φίλημα sans effacer le geste concret.
- source_word: ἀσπάζονται ὑμᾶς
  choice: vous saluent
  rationale: Dans une conclusion épistolaire, cette formulation rend naturellement le présent de ἀσπάζονται avec son complément pluriel ὑμᾶς.
- source_word: οἱ ἅγιοι πάντες
  choice: Tous les saints
  rationale: Chez Paul, οἱ ἅγιοι désigne couramment les croyants comme peuple consacré à Dieu. « Tous » préserve la totalité exprimée par πάντες.
theological_decisions:
- issue: Sens communautaire de οἱ ἅγιοι
  choice: les saints
  alternative: ceux qui appartiennent à Dieu / le peuple saint de Dieu
  rationale: « Les saints » conserve le terme théologique traditionnel et le lien lexical avec ἅγιος. Une note précise qu’il s’agit de l’ensemble des croyants, sans introduire la notion plus tardive d’une catégorie restreinte de personnes canonisées.
- issue: Nature du « saint baiser »
  choice: conserver le geste concret sans en imposer une application culturelle intemporelle précise
  alternative: une salutation fraternelle
  rationale: Le grec nomme explicitement un baiser qualifié de saint. Le paraphraser comme simple salutation supprimerait une donnée du texte; inversement, le verset ne développe pas ici les modalités culturelles de sa mise en pratique.
translation_notes:
  register: Français international moderne, simple et digne. « Saint baiser » conserve l’expression concrète et cultuelle du grec; « baiser » est ici préférable à « embrassade », plus interprétatif et variable selon les usages régionaux.
