  source_fidelity: La structure ternaire, les génitifs (« l’amour de Dieu », « la communion du Saint-Esprit ») et l’inclusivité de πάντων ὑμῶν (« vous tous ») sont fidèlement rendus. « Messie » traduit correctement Χριστοῦ comme titre.
