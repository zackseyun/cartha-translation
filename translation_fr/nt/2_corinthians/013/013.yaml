  - severity: low
    issue: Note b interprétative au sujet de κοινωνία
    rationale: La mention d’une relation « que produit le Saint-Esprit » privilégie une compréhension causative du génitif. Il est préférable de ne signaler que l’alternative lexicale sans résoudre l’ambiguïté.
