id: 2CO.13.13
reference: 2 Corinthians 13:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἡ χάρις τοῦ κυρίου Ἰησοῦ Χριστοῦ καὶ ἡ ἀγάπη τοῦ θεοῦ καὶ ἡ κοινωνία τοῦ ἁγίου πνεύματος μετὰ πάντων ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/013.yaml
  text: The grace of the Lord Jesus Christ[a], and the love of God, and the fellowship of the Holy Spirit[b], be with all of you.
translation:
  language: fr
  text: Que la grâce du Seigneur Jésus le Messie[a], l’amour de Dieu et la communion du Saint-Esprit[b] soient avec vous tous.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, selon la formulation traditionnelle : « Jésus-Christ ».'
    reason: alternative_reading
  - marker: b
    text: Ou « la participation au Saint-Esprit ».
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις
  choice: grâce
  rationale: Terme consacré et naturel dans une bénédiction paulinienne; il conserve la richesse théologique du grec mieux que « faveur ».
- source_word: κυρίου
  choice: Seigneur
  rationale: Rend naturellement le titre christologique κύριος dans ce contexte.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jésus Messie
  rationale: Χριστός garde ici sa valeur de titre; « Messie » en transmet le sens, tandis que la forme traditionnelle est indiquée en note.
- source_word: ἀγάπη τοῦ θεοῦ
  choice: l’amour de Dieu
  rationale: Cette formulation respecte le génitif grec sans préciser indûment s’il désigne l’amour venant de Dieu ou une relation d’amour avec lui.
- source_word: κοινωνία τοῦ ἁγίου πνεύματος
  choice: la communion du Saint-Esprit
  rationale: « Communion » exprime en français la relation partagée et la participation contenues dans κοινωνία, tout en conservant l’ouverture du génitif.
- source_word: μετὰ πάντων ὑμῶν
  choice: soient avec vous tous
  rationale: Le verbe est légitimement suppléé dans la bénédiction; « vous tous » rend explicitement πάντων ὑμῶν.
theological_decisions:
- issue: Valeur de Χριστοῦ dans le titre de Jésus
  choice: Messie
  alternative: Christ
  rationale: Le terme grec est un titre signifiant « oint ». Le texte principal en traduit le sens, et la note conserve la formulation traditionnelle.
- issue: Sens de κοινωνία τοῦ ἁγίου πνεύματος
  choice: la communion du Saint-Esprit
  alternative: la participation au Saint-Esprit
  rationale: Le génitif peut évoquer une communion accordée ou produite par l’Esprit, ou encore la participation à l’Esprit. La formulation retenue maintient cette amplitude sans trancher.
- issue: Portée de ἀγάπη τοῦ θεοῦ
  choice: l’amour de Dieu
  alternative: l’amour que Dieu donne
  rationale: Le génitif grec demeure ouvert; la traduction littérale évite de limiter le sens à une seule relation possible.
translation_notes:
  register: Français international actuel, digne et fluide. La structure ternaire de la bénédiction est conservée. Le pluriel « soient » explicite naturellement en français le verbe sous-entendu par la phrase nominale grecque.
