revisions:
- from: Enfin[a], frères[b], réjouissez-vous, laissez-vous rétablir[c], laissez-vous encourager[d], pensez de même[e], vivez en paix, et le Dieu de l’amour et de la paix sera avec vous.
  to: Enfin[a], frères[b], réjouissez-vous, mettez-vous en ordre[c], laissez-vous encourager[d], ayez la même pensée[e], vivez en paix, et le Dieu de l’amour et de la paix sera avec vous.
  rationale: La révision remplace deux formulations françaises susceptibles d’affaiblir ou de déplacer le sens. « Mettez-vous en ordre » exprime l’objectif de restauration/bon état de καταρτίζεσθε dans une forme française naturelle; la note préserve les principales possibilités, y compris la lecture passive. « Ayez la même pensée » restitue explicitement l’unité visée par τὸ αὐτὸ φρονεῖτε. Les autres choix, y compris la coordination finale sans expliciter une relation logique plus forte, sont maintenus.
