review_pass:
  verdict: revise
  source_fidelity: Le sens général et la série d’impératifs sont bien rendus. Toutefois, « pensez de même » signifie plus spontanément « pensez ainsi / pareillement » en français et ne transmet pas nettement l’appel mutuel de τὸ αὐτὸ φρονεῖτε. « Laissez-vous rétablir » est grammatical, mais introduit l’idée particulière de consentir à l’action d’un agent extérieur et reste peu idiomatique ici; καταρτίζεσθε garde une nuance moyenne/passive plus large de remise en bon ordre.
  naturalness: Le registre est moderne, clair et digne. Les corrections proposées rendent les deux exhortations centrales plus idiomatiques tout en conservant leur brièveté paratactique.
  terminology: « Frères » avec la note inclusive est cohérent avec le choix de traduction. « Le Dieu de l’amour et de la paix » et « sera avec vous » sont fidèles et naturels. Les notes lexicales sont conservées et ajustées pour correspondre exactement au texte révisé.
  issues:
  - severity: medium
    issue: « pensez de même »
    rationale: Cette expression française est normalement anaphorique (« pensez de même que lui ») et peut ne pas exprimer que les destinataires doivent partager une même pensée. Le grec τὸ αὐτὸ φρονεῖτε porte explicitement sur cette unité.
  - severity: medium
    issue: « laissez-vous rétablir »
    rationale: La formulation est moins naturelle en français et restreint l’ambiguïté moyenne/passive du grec à l’idée de se laisser passivement restaurer. « Mettez-vous en ordre » rend de façon plus directe l’appel à la remise en bon état, sans imposer une notion de perfection.
