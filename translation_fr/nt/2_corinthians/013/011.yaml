reference: 2 Corinthians 13:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Λοιπόν, ἀδελφοί, χαίρετε, καταρτίζεσθε, παρακαλεῖσθε, τὸ αὐτὸ φρονεῖτε, εἰρηνεύετε, καὶ ὁ θεὸς τῆς ἀγάπης καὶ εἰρήνης ἔσται μεθ’ ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/011.yaml
  text: Finally[a], brothers, rejoice, be restored, be encouraged, think the same thing, live in peace[e][d][c][b], and the God of love and peace will be with you.
translation:
  language: fr
  text: Enfin[a], frères[b], réjouissez-vous, mettez-vous en ordre[c], laissez-vous encourager[d], ayez la même pensée[e], vivez en paix, et le Dieu de l’amour et de la paix sera avec vous.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour terminer ». Le mot grec peut introduire la conclusion d’une lettre.
    reason: lexical_alternative
  - marker: b
    text: Ici, « frères » désigne collectivement les membres de l’assemblée et inclut vraisemblablement les hommes et les femmes.
    reason: cultural_note
  - marker: c
    text: Ou « soyez rétablis », « soyez rendus complets » ou « remettez de l’ordre parmi vous ».
    reason: lexical_alternative
  - marker: d
    text: Ou « accueillez l’encouragement » ou « accueillez l’exhortation ».
    reason: lexical_alternative
  - marker: e
    text: Littéralement « pensez la même chose », c’est-à-dire « soyez d’un même avis ».
    reason: lexical_alternative
lexical_decisions:
- source_word: Λοιπόν
  choice: Enfin
  rationale: Marque naturellement l’entrée dans la conclusion de la lettre, sans alourdir la phrase.
- source_word: ἀδελφοί
  choice: frères
  rationale: Conserve la forme masculine plurielle du grec; dans cette adresse collective, le mot englobe vraisemblablement toute l’assemblée, hommes et femmes, ce qu’explicite la note.
- source_word: χαίρετε
  choice: réjouissez-vous
  rationale: Bien que le terme puisse servir de formule d’adieu, sa place dans une série d’exhortations favorise ici son sens verbal.
- source_word: καταρτίζεσθε
  choice: laissez-vous rétablir
  rationale: Rend la forme passive ou moyenne et l’idée de remise en bon état, particulièrement pertinente dans le contexte des difficultés de l’Église, sans suggérer une perfection absolue.
- source_word: παρακαλεῖσθε
  choice: laissez-vous encourager
  rationale: 'Préserve autant que possible la valeur passive ou moyenne: recevoir encouragement, exhortation ou réconfort.'
- source_word: τὸ αὐτὸ φρονεῖτε
  choice: pensez de même
  rationale: Reste proche de l’expression grecque «pensez la même chose» tout en étant naturel en français et en conservant l’appel à l’unité de pensée.
- source_word: εἰρηνεύετε
  choice: vivez en paix
  rationale: Exprime clairement l’appel continu à des relations paisibles au sein de la communauté.
- source_word: ὁ θεὸς τῆς ἀγάπης καὶ εἰρήνης
  choice: le Dieu de l’amour et de la paix
  rationale: Reproduit directement et naturellement les deux génitifs grecs sans en préciser excessivement la relation.
- source_word: ἔσται μεθ’ ὑμῶν
  choice: sera avec vous
  rationale: Rend simplement le futur grec dans un français moderne et digne.
theological_decisions:
- issue: Portée inclusive de ἀδελφοί dans l’adresse à l’assemblée
  choice: «frères» dans le texte, avec une note précisant la portée collective
  alternative: «frères et sœurs»
  rationale: La traduction conserve la forme grammaticale masculine du grec tout en signalant que, dans ce contexte, l’adresse vise vraisemblablement l’ensemble de la communauté.
- issue: Valeur de καταρτίζεσθε
  choice: «laissez-vous rétablir»
  alternative: «devenez accomplis» ou «remettez de l’ordre parmi vous»
  rationale: Le choix maintient l’idée d’une restauration de la communauté et la voix ambiguë du verbe sans introduire la notion doctrinalement chargée de perfection sans péché.
- issue: Rapport entre les exhortations et la présence promise de Dieu
  choice: Conserver la coordination simple «et»
  alternative: Exprimer une conséquence explicite, par exemple «alors»
  rationale: Le grec coordonne les propositions sans définir précisément si la dernière est promesse, conséquence ou encouragement lié aux impératifs; la traduction préserve cette tension.
translation_notes:
  register: Français international moderne, clair et digne. La succession d’impératifs est conservée. Les tournures «laissez-vous rétablir» et «laissez-vous encourager» gardent la valeur passive ou moyenne des formes grecques, malgré une légère répétition voulue.
