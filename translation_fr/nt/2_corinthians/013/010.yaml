id: 2CO.13.10
reference: 2 Corinthians 13:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: διὰ τοῦτο ταῦτα ἀπὼν γράφω, ἵνα παρὼν μὴ ἀποτόμως χρήσωμαι κατὰ τὴν ἐξουσίαν ἣν ⸂ὁ κύριος ἔδωκέν μοι⸃, εἰς οἰκοδομὴν καὶ οὐκ εἰς καθαίρεσιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/010.yaml
  text: For this reason I write these things while absent[a], so that when present I may not have to act harshly[b], according to the authority that the Lord gave me for building up and not for tearing down.
translation:
  language: fr
  text: C’est pourquoi j’écris ces choses pendant mon absence, afin que, lorsque je serai présent, je n’aie pas à agir avec sévérité[a], conformément à l’autorité que le Seigneur m’a donnée pour construire et non pour démolir[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « je n’aie pas à faire preuve de rigueur » ou « je n’aie pas à intervenir durement ».
    reason: lexical_alternative
  - marker: b
    text: 'Ou « pour l’édification et non pour la destruction ». Le grec emploie une image architecturale : construire plutôt que démolir.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: C’est pourquoi
  rationale: Ce connecteur naturel en français conserve le lien causal et conséquentiel explicite avec le contexte précédent.
- source_word: ταῦτα
  choice: ces choses
  rationale: Le pluriel du démonstratif grec est conservé et renvoie au contenu de la lettre ou aux avertissements qui précèdent.
- source_word: ἀπὼν
  choice: pendant mon absence
  rationale: Cette formulation temporelle idiomatique prépare le contraste avec παρὼν.
- source_word: γράφω
  choice: j’écris
  rationale: Le présent simple convient au style épistolaire et reste direct.
- source_word: ἵνα
  choice: afin que
  rationale: La proposition de but est exprimée clairement dans un registre digne et courant.
- source_word: παρὼν
  choice: une fois présent
  rationale: La formulation rend la valeur temporelle du participe et maintient le contraste présence-absence.
- source_word: μὴ ἀποτόμως χρήσωμαι
  choice: je n’aie pas à agir avec sévérité
  rationale: χράομαι exprime ici la manière d’agir ou de traiter, tandis que ἀποτόμως évoque la rudesse ou la rigueur. « Ne pas avoir à » rend naturellement la nécessité indésirable impliquée par le contexte.
- source_word: κατὰ τὴν ἐξουσίαν
  choice: conformément à l’autorité
  rationale: κατά indique ici que l’action serait conforme à l’autorité confiée à Paul; « autorité » est le sens contextuel normal de ἐξουσία.
- source_word: ὁ κύριος
  choice: le Seigneur
  rationale: Le titre est rendu sans préciser davantage son référent que ne le fait ce verset.
- source_word: ἔδωκέν μοι
  choice: m’a donnée
  rationale: Le passé composé est naturel en français pour une autorité reçue antérieurement et toujours pertinente.
- source_word: εἰς οἰκοδομὴν
  choice: pour construire
  rationale: Cette expression accessible préserve l’image architecturale employée par Paul.
- source_word: καθαίρεσιν
  choice: démolir
  rationale: Le verbe maintient le contraste imagé entre construction et démolition, sans recourir à un vocabulaire ecclésiastique abstrait.
theological_decisions:
- issue: Référent du titre « le Seigneur » dans l’affirmation concernant l’autorité reçue
  choice: Conserver simplement « le Seigneur »
  alternative: Préciser « le Seigneur Jésus » ou comprendre le titre dans un sens divin plus général
  rationale: Le grec porte ὁ κύριος. La traduction garde ce titre et ne tranche pas une identification que le verset ne formule pas explicitement.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve le contraste entre absence et présence ainsi que la métaphore de la construction, tout en évitant un vocabulaire inutilement ecclésiastique.
