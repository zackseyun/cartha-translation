revisions:
- from: Mettez-vous vous-mêmes à l’épreuve pour voir si vous êtes dans la foi[a] ; examinez-vous vous-mêmes. Ou bien ne reconnaissez-vous pas que Jésus le Messie est en vous[b] ? À moins, peut-être, que vous n’ayez échoué à l’épreuve.
  to: Mettez-vous vous-mêmes à l’épreuve pour voir si vous êtes dans la foi[a] ; examinez-vous vous-mêmes. Ou bien ne reconnaissez-vous pas que Jésus le Messie est en vous[b] ? À moins que vous ne soyez disqualifiés.
  rationale: La révision remplace l’expression au parfait « n’ayez échoué à l’épreuve » par le prédicat présent « soyez disqualifiés », qui correspond plus étroitement à ἀδόκιμοί ἐστε et reste naturel. Elle simplifie aussi l’introduction de l’exception. Le reste du texte et les deux notes préservent les ambiguïtés du grec sans les résoudre doctrinalement.
