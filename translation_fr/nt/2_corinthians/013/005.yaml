reference: 2 Corinthians 13:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἑαυτοὺς πειράζετε εἰ ἐστὲ ἐν τῇ πίστει, ἑαυτοὺς δοκιμάζετε· ἢ οὐκ ἐπιγινώσκετε ἑαυτοὺς ὅτι ⸂Ἰησοῦς Χριστὸς⸃ ἐν ⸀ὑμῖν; εἰ μήτι ἀδόκιμοί ἐστε.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/005.yaml
  text: Test yourselves to see whether you are in the faith[a]; examine yourselves[c][b]. Or do you not recognize that Jesus the Messiah is in you?—unless indeed you are disqualified.
translation:
  language: fr
  text: Mettez-vous vous-mêmes à l’épreuve pour voir si vous êtes dans la foi[a] ; examinez-vous vous-mêmes. Ou bien ne reconnaissez-vous pas que Jésus le Messie est en vous[b] ? À moins que vous ne soyez disqualifiés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Dans la foi » peut désigner le fait de demeurer dans la foi chrétienne ou celui de posséder une foi authentique.
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « parmi vous ».'
    reason: alternative_reading
lexical_decisions:
- source_word: πειράζετε
  choice: mettez à l’épreuve
  rationale: Dans ce contexte, le verbe demande une vérification de soi, non une tentation. « Mettre à l’épreuve » garde clairement le sens évaluatif.
- source_word: ἐν τῇ πίστει
  choice: dans la foi
  rationale: Cette formulation naturelle conserve l’article et l’ambiguïté entre l’appartenance effective à la foi chrétienne et la possession d’une foi authentique.
- source_word: δοκιμάζετε
  choice: examinez
  rationale: Le choix distingue ce verbe du précédent tout en exprimant l’examen destiné à établir ce qui est authentique ou approuvé.
- source_word: ἐπιγινώσκετε ἑαυτούς
  choice: ne reconnaissez-vous pas
  rationale: En français, l’objet réfléchi explicite serait lourd et ambigu. Le contexte et la répétition des impératifs réfléchis rendent la référence à soi évidente.
- source_word: Ἰησοῦς Χριστός
  choice: Jésus le Messie
  rationale: Χριστός garde ici sa valeur de titre dans cette affirmation à portée confessionnelle ; « Messie » en transmet le sens.
- source_word: ἐν ὑμῖν
  choice: est en vous
  rationale: Le contexte d’examen personnel favorise la présence du Messie en chacun des destinataires, tandis que le sens collectif « parmi vous » reste possible et figure en note.
- source_word: εἰ μήτι
  choice: à moins, peut-être, que
  rationale: Cette tournure restitue à la fois l’exception et la nuance rhétorique ou légèrement atténuante de μήτι.
- source_word: ἀδόκιμοί
  choice: ayez échoué à l’épreuve
  rationale: La formulation rend explicite le contraste lexical avec l’examen et évite les connotations doctrinales ultérieures de termes comme « réprouvés ».
theological_decisions:
- issue: Sens de Χριστός
  choice: Messie
  alternative: Christ
  rationale: Le contexte permet de comprendre Χριστός comme un titre. « Messie » en communique le contenu sans ajouter de particularité confessionnelle.
- issue: Sens de ἐν τῇ πίστει
  choice: dans la foi
  alternative: dans une foi authentique
  rationale: Le grec peut viser la permanence dans la foi chrétienne ou la réalité de la foi personnelle. La traduction ne tranche pas cette tension.
- issue: Sens de ἐν ὑμῖν
  choice: en vous
  alternative: parmi vous
  rationale: L’examen de soi favorise le sens intérieur, mais le pluriel collectif autorise aussi une lecture communautaire, signalée en note.
- issue: Portée de ἀδόκιμοι
  choice: avoir échoué à l’épreuve
  alternative: être disqualifiés
  rationale: La traduction conserve l’image de l’épreuve sans transformer le verset en déclaration technique sur un statut théologique définitif.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition « vous-mêmes » reflète l’insistance initiale du grec ; la seconde occurrence est maintenue pour porter l’accent de l’impératif. Les notes ne présentent que les ambiguïtés réellement soutenues par le texte grec.
