  text: ⸀εὐχόμεθα δὲ πρὸς τὸν θεὸν μὴ ποιῆσαι ὑμᾶς κακὸν μηδέν, οὐχ ἵνα ἡμεῖς δόκιμοι φανῶμεν, ἀλλ’ ἵνα ὑμεῖς τὸ καλὸν ποιῆτε, ἡμεῖς δὲ ὡς ἀδόκιμοι ὦμεν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/007.yaml
  text: We pray to God that you may do nothing wrong—not so that we may appear approved[a], but so that you may do what is right[c][b], even if we may seem disqualified.
translation:
  language: fr
  text: Nous prions Dieu pour que vous ne fassiez rien de mal. Ce n’est pas pour que nous paraissions approuvés[a], mais pour que vous fassiez ce qui est bien, même si nous sommes considérés comme non approuvés[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « reconnus comme authentiques » ou « ayant fait leurs preuves ». Le terme grec désigne ce qui a été mis à l’épreuve et approuvé; il s’oppose au terme rendu à la fin du verset par « non approuvés ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « même si nous sommes comme non approuvés » ou « même si nous paraissons non approuvés ». Le grec peut évoquer la manière dont Paul et ses collaborateurs sont considérés, sans trancher entièrement entre apparence et état réel.'
    reason: alternative_reading
lexical_decisions:
- source_word: εὐχόμεθα δὲ πρὸς τὸν θεόν
  choice: Nous prions Dieu
  rationale: εὔχομαι désigne ici une prière adressée à Dieu. La formulation française est directe et naturelle; le contenu de la prière est introduit par « pour que ». Le δέ, faiblement connectif, n’exige pas nécessairement un mot de liaison explicite en français.
- source_word: μὴ ποιῆσαι ὑμᾶς κακὸν μηδέν
  choice: pour que vous ne fassiez rien de mal
  rationale: La construction infinitive exprime le contenu de la prière. κακὸν μηδέν constitue une négation forte et générale; « rien de mal » conserve sa portée éthique sans exagérer le registre.
- source_word: οὐχ ἵνα ἡμεῖς δόκιμοι φανῶμεν
  choice: Ce n’est pas pour que nous paraissions avoir fait nos preuves
  rationale: La tournure conserve le but nié de οὐχ ἵνα, tandis que « paraissions » rend φανῶμεν. « Avoir fait nos preuves » exprime le résultat favorable d’une mise à l’épreuve impliqué par δόκιμοι.
- source_word: ἀλλ’ ἵνα ὑμεῖς τὸ καλὸν ποιῆτε
  choice: mais pour que vous fassiez ce qui est bien
  rationale: La proposition de but et son contraste sont maintenus. Dans ce contexte moral, τὸ καλόν désigne ce qui est bon ou juste.
- source_word: ἡμεῖς δὲ ὡς ἀδόκιμοι ὦμεν
  choice: quitte à ce que nous passions, nous, pour des gens qui ont échoué à l’épreuve
  rationale: La formulation maintient l’insistance sur ἡμεῖς et rend intelligible l’antithèse δόκιμοι/ἀδόκιμοι. « Passions pour » reflète la dimension d’apparence suggérée par le contraste avec φανῶμεν, tandis que la note conserve une lecture plus littérale de ὡς.
theological_decisions:
- issue: Portée de ὡς ἀδόκιμοι appliqué à Paul et à ses collaborateurs
  choice: Ils acceptent de passer pour des personnes ayant échoué à l’épreuve si les Corinthiens font le bien.
  alternative: Ils sont « comme désapprouvés » ou considérés comme n’ayant pas fait leurs preuves, sans que le texte précise s’il s’agit seulement d’apparence.
  rationale: Le contexte immédiat porte sur la preuve et la reconnaissance du ministère apostolique. La traduction évite de transformer ἀδόκιμοι en affirmation de condamnation spirituelle définitive, tout en signalant dans la note l’ambiguïté réelle de ὡς et de la copule ὦμεν.
translation_notes:
  register: Français international actuel, clair et digne. Le champ lexical de l’épreuve est maintenu afin de faire entendre l’opposition entre δόκιμοι et ἀδόκιμοι. « Quitte à ce que » exprime ici la concession et la disponibilité de Paul à subir une appréciation défavorable, sans introduire l’idée d’une condamnation ultime.
