  source_fidelity: La structure de la prière, le but nié et le contraste entre le bien des Corinthiens et la situation de Paul sont bien rendus. Toutefois, « des gens qui ont échoué à l’épreuve » affirme un échec accompli et personnalise inutilement l’expression; ἀδόκιμοι signifie plus sobrement « non approuvés / désapprouvés » et demeure qualifié par ὡς. La révision conserve également l’opposition lexicale avec δόκιμοι.
  naturalness: Le français est globalement clair, mais « quitte à ce que nous passions, nous, pour des gens qui ont échoué à l’épreuve » est plus lourd et plus interprétatif que nécessaire. « Même si nous sommes considérés comme non approuvés » est idiomatique, soutenu sans être archaïque, et exprime naturellement la concession.
  terminology: « Approuvés » / « non approuvés » rend de façon transparente et corrélée δόκιμοι / ἀδόκιμοι. Cette paire conserve l’image d’une évaluation sans imposer l’idée d’une condamnation définitive ni celle d’un échec déjà établi.
