  to: Nous prions Dieu pour que vous ne fassiez rien de mal. Ce n’est pas pour que nous paraissions approuvés[a], mais pour que vous fassiez ce qui est bien, même si nous sommes considérés comme non approuvés[b].
  rationale: La révision rend plus directement le couple δόκιμοι / ἀδόκιμοι par « approuvés » / « non approuvés ». Elle évite d’affirmer un échec effectif là où le grec emploie une désignation évaluative qualifiée par ὡς, tout en maintenant la concession et la possible dimension de perception publique.
