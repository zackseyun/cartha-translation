  text: ἐλπίζω δὲ ὅτι γνώσεσθε ὅτι ἡμεῖς οὐκ ἐσμὲν ἀδόκιμοι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/006.yaml
  text: But I hope that you will know that we are not disqualified[a].
translation:
  language: fr
  text: Mais j’espère que vous reconnaîtrez que nous ne sommes pas disqualifiés.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « nous ne sommes pas désapprouvés » ou « nous n’avons pas échoué à l’épreuve ». Le mot grec désigne ceux qui, après avoir été mis à l’épreuve, ne sont pas reconnus aptes.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλπίζω
  choice: j’espère
  rationale: Le présent de l’indicatif exprime naturellement l’attente de Paul; « j’espère » est direct et courant.
- source_word: δὲ
  choice: Mais
  rationale: La conjonction marque ici un léger contraste avec la crainte exprimée au verset précédent.
- source_word: γνώσεσθε
  choice: vous reconnaîtrez
  rationale: Le futur de γινώσκω désigne ici la constatation ou la prise de conscience à venir des Corinthiens; « reconnaîtrez » convient mieux que le simple « saurez » dans ce contexte d’évaluation.
- source_word: ἡμεῖς
  choice: nous, nous
  rationale: La reprise pronominale rend l’emphase du pronom grec explicite, en distinguant Paul et ses collaborateurs des destinataires invités à s’examiner.
- source_word: οὐκ ἐσμὲν
  choice: nous n’avons pas
  rationale: La tournure française s’adapte idiomatiquement à l’expression verbale retenue pour ἀδόκιμοι, sans renforcer la négation.
- source_word: ἀδόκιμοι
  choice: échoué à l’épreuve
  rationale: Dans le contexte immédiat de mise à l’épreuve, l’adjectif qualifie ceux qui ne sont pas reconnus aptes après examen. Cette formulation garde l’image de l’épreuve et évite les connotations doctrinales ou administratives que pourraient porter « réprouvés » ou « disqualifiés ».
theological_decisions:
- issue: Sens de ἀδόκιμοι dans le contexte de l’examen et de la légitimité apostolique
  choice: nous n’avons pas échoué à l’épreuve
  alternative: nous ne sommes pas disqualifiés / désapprouvés
  rationale: Le choix conserve le rapport lexical avec l’action de mettre à l’épreuve dans les versets voisins et indique un résultat négatif à l’examen, sans préciser au-delà du texte la nature exacte de l’approbation ni importer le sens théologique traditionnel de « réprouvés ».
translation_notes:
  register: Français international moderne, naturel et digne. « Reconnaîtrez » exprime une constatation dans ce contexte, tandis que « échoué à l’épreuve » rend clairement l’image d’évaluation qui relie ce verset à son contexte immédiat.
