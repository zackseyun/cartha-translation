reference: 2 Corinthians 13:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ⸀γὰρ ἐσταυρώθη ἐξ ἀσθενείας, ἀλλὰ ζῇ ἐκ δυνάμεως θεοῦ. καὶ γὰρ ἡμεῖς ἀσθενοῦμεν ἐν αὐτῷ, ἀλλὰ ⸀ζήσομεν σὺν αὐτῷ ἐκ δυνάμεως θεοῦ εἰς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/004.yaml
  text: For indeed he was crucified in weakness[a], but he lives by the power of God. For indeed we are weak in him[d][c][b], but we will live with him by the power of God toward you.
translation:
  language: fr
  text: En effet, il a été crucifié dans la faiblesse[a], mais il vit par la puissance de Dieu. Nous aussi, en effet, nous sommes faibles en lui, mais nous vivrons avec lui par la puissance de Dieu[b], à votre égard[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en raison de la faiblesse ». Littéralement, « de la faiblesse ». La préposition grecque peut exprimer la source ou le fondement ; « dans la faiblesse » rend ici plus naturellement la condition dans laquelle il a été crucifié.
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « de la puissance de Dieu ». Le grec emploie la même préposition que dans l’expression traduite par « dans la faiblesse », établissant ainsi un contraste marqué entre faiblesse et puissance divine.
    reason: lexical_alternative
  - marker: c
    text: Ou « pour vous », « parmi vous » ou « envers vous ». L’expression grecque est concise et peut indiquer la direction, la relation ou l’effet. « Nous vivrons avec lui » peut viser l’action de Paul, rendue puissante par le Christ, à l’égard des Corinthiens, tout en évoquant plus largement la vie avec le Christ.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐσταυρώθη
  choice: a été crucifié
  rationale: Le passif aoriste de σταυρόω est rendu par la formulation française habituelle et précise.
- source_word: ἐξ ἀσθενείας
  choice: dans la faiblesse
  rationale: Cette expression française naturelle rend la condition ou le cadre de faiblesse associé à la crucifixion; une note conserve la nuance plus littérale de provenance ou de fondement portée par ἐξ.
- source_word: ζῇ
  choice: il vit
  rationale: Le présent simple préserve la force verbale et le contraste avec la crucifixion.
- source_word: ἐκ δυνάμεως θεοῦ
  choice: par la puissance de Dieu
  rationale: « Par » exprime naturellement en français la puissance divine comme source ou moyen de cette vie, tout en maintenant le contraste avec la faiblesse.
- source_word: ἀσθενοῦμεν
  choice: nous sommes faibles
  rationale: Cette traduction reprend le même champ lexical que « faiblesse » dans la première proposition.
- source_word: ἐν αὐτῷ
  choice: en lui
  rationale: La formulation compacte préserve le langage paulinien de participation ou d’union au Christ sans l’expliciter excessivement.
- source_word: ζήσομεν
  choice: nous vivrons
  rationale: Le futur du grec est conservé sans décider s’il vise surtout l’action apostolique prochaine ou un horizon plus large de vie avec le Christ.
- source_word: σὺν αὐτῷ
  choice: avec lui
  rationale: Cette expression rend directement l’association indiquée par σύν.
- source_word: εἰς ὑμᾶς
  choice: à votre égard
  rationale: Cette formulation garde la relation orientée vers les Corinthiens sans imposer exclusivement le sens « pour vous » ou « parmi vous ».
theological_decisions:
- issue: Sens de la faiblesse du Christ lors de la crucifixion
  choice: Conserver sans atténuation le paradoxe entre la faiblesse dans laquelle il a été crucifié et la puissance de Dieu par laquelle il vit.
  alternative: Paraphraser comme une faiblesse seulement apparente ou perçue par les humains.
  rationale: Le texte affirme la faiblesse liée à la crucifixion sans expliquer ici sa nature; la traduction ne doit ni nier cette affirmation ni lui faire porter une conclusion sur la nature divine ou la condition morale du Christ.
- issue: Portée de « nous vivrons avec lui »
  choice: Laisser l’expression assez ouverte pour inclure la manifestation future de la vie et de la puissance du Christ dans les rapports de Paul avec les Corinthiens, tout en préservant sa résonance plus large.
  alternative: Limiter l’expression soit à la résurrection finale, soit exclusivement à l’exercice prochain de l’autorité apostolique.
  rationale: Le contexte immédiat, notamment εἰς ὑμᾶς, concerne les Corinthiens, mais le langage de vie avec le Christ peut aussi évoquer une réalité plus vaste; le simple futur conserve cette tension.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « en effet » reflète les deux occurrences de καὶ γάρ sans alourdir excessivement la phrase. Les formulations « en lui » et « avec lui » restent volontairement compactes afin de préserver la distinction des prépositions grecques et l’ambiguïté théologique du passage.
