  text: I rejoice that in every way I have confidence in you[a].
translation:
  language: fr
  text: Je me réjouis d’avoir confiance en vous à tous égards.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χαίρω
  choice: Je me réjouis
  rationale: Le présent « je me réjouis » conserve la force verbale et le ton digne du grec, tout en restant naturel en français moderne.
- source_word: ὅτι
  choice: de pouvoir
  rationale: La tournure infinitive française introduit naturellement le contenu de la joie de Paul. La nuance causale possible de ὅτι est signalée en note.
- source_word: ἐν παντί
  choice: en toute chose
  rationale: Cette expression rend la portée globale de la locution adverbiale grecque sans la limiter à une circonstance précise.
- source_word: θαρρῶ
  choice: compter
  rationale: Avec un complément personnel, « compter sur » exprime idiomatiquement l'assurance et la confiance que Paul éprouve, plutôt qu'un simple courage intérieur.
- source_word: ἐν ὑμῖν
  choice: sur vous
  rationale: « Compter sur vous » est l'équivalent français naturel de la confiance relationnelle exprimée ici par ἐν avec θαρρέω.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. « Compter sur vous » privilégie l’idiome courant tout en gardant la dimension relationnelle de la confiance; la note préserve les autres nuances possibles de la syntaxe grecque.
