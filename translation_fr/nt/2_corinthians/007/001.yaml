id: 2CO.7.1
reference: 2 Corinthians 7:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ταύτας οὖν ἔχοντες τὰς ἐπαγγελίας, ἀγαπητοί, καθαρίσωμεν ἑαυτοὺς ἀπὸ παντὸς μολυσμοῦ σαρκὸς καὶ πνεύματος, ἐπιτελοῦντες ἁγιωσύνην ἐν φόβῳ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/001.yaml
  text: Therefore[a], since we have these promises, beloved, let us cleanse ourselves from every defilement of flesh and spirit[c][b], bringing holiness to completion in the fear of God.
translation:
  language: fr
  text: Ainsi donc, bien-aimés, puisque nous avons ces promesses, purifions-nous de toute souillure de la chair et de l’esprit[a], en menant la sainteté à son accomplissement[b] dans la crainte de Dieu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de toute impureté du corps et de l’esprit ».
    reason: lexical_alternative
  - marker: b
    text: Ou « en perfectionnant la sainteté ».
    reason: lexical_alternative
  - marker: c
    text: Ici, la « crainte de Dieu » évoque une profonde révérence devant Dieu, et non la seule terreur.
    reason: lexical_clarification
lexical_decisions:
- source_word: οὖν
  choice: Ainsi donc
  rationale: La locution marque clairement la déduction tirée des promesses citées dans le contexte précédent, tout en restant naturelle en français.
- source_word: ταύτας ... τὰς ἐπαγγελίας
  choice: ces promesses
  rationale: Le démonstratif renvoie aux assurances divines qui précèdent, et « promesses » est le terme français courant et précis dans ce contexte paulinien.
- source_word: ἀγαπητοί
  choice: bien-aimés
  rationale: Ce vocatif conserve à la fois l’affection pastorale et la dignité du registre épistolaire.
- source_word: καθαρίσωμεν ἑαυτοὺς
  choice: purifions-nous
  rationale: Le subjonctif grec à valeur exhortative appelle une exhortation inclusive. « Purifier » s’accorde naturellement avec le champ lexical de la souillure et de la sainteté.
- source_word: ἀπὸ παντὸς μολυσμοῦ
  choice: de toute souillure
  rationale: « Souillure » rend la contamination morale et religieuse évoquée par μολυσμός sans réduire l’expression à une simple saleté physique.
- source_word: σαρκὸς καὶ πνεύματος
  choice: de la chair et de l’esprit
  rationale: La traduction littérale maintient le contraste entre les dimensions corporelle et intérieure de la personne, sans imposer ici à σάρξ le sens spécialisé de « nature pécheresse ».
- source_word: ἐπιτελοῦντες ἁγιωσύνην
  choice: en menant la sainteté à son accomplissement
  rationale: La tournure participiale indique ce qui accompagne et caractérise la purification exhortée. Elle conserve l’idée d’un processus conduit jusqu’à son terme.
- source_word: ἐν φόβῳ θεοῦ
  choice: dans la crainte de Dieu
  rationale: Cette formulation préserve l’idiome biblique et sa force, sans réduire φόβος à la seule notion plus douce de respect.
theological_decisions:
- issue: Sens de σάρξ dans « souillure de la chair et de l’esprit »
  choice: chair
  alternative: corps
  rationale: L’opposition avec « esprit » vise vraisemblablement l’être humain dans ses dimensions extérieure et intérieure. « Chair » conserve toutefois le lexique grec et l’ambiguïté du terme, sans introduire la lecture « nature pécheresse ».
- issue: Force de καθαρίσωμεν
  choice: purifions-nous
  alternative: nous devons nous purifier
  rationale: La première personne du pluriel au subjonctif est une exhortation qui inclut Paul avec ses destinataires, et non une simple déclaration d’obligation.
- issue: Rapport entre purification et accomplissement de la sainteté
  choice: Le participe est rendu par « en menant », sans définir plus étroitement s’il exprime surtout la manière, le moyen ou le résultat.
  alternative: et menons la sainteté à son accomplissement
  rationale: La construction française retenue préserve le lien étroit établi par le participe grec, tout en évitant de transformer sans nécessité les deux éléments en commandements coordonnés indépendants.
- issue: Sens de φόβος devant Dieu
  choice: crainte de Dieu
  alternative: respect révérencieux envers Dieu
  rationale: La crainte inclut ici la révérence et l’émerveillement devant Dieu, mais le terme plus fort doit être conservé afin de ne pas aplanir la tension théologique de l’expression biblique.
translation_notes:
  register: Français international moderne, digne et accessible. « Bien-aimés », « sainteté » et « crainte de Dieu » maintiennent le registre biblique sans archaïsme grammatical. La phrase conserve la progression logique du grec et son exhortation communautaire.
