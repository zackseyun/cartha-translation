source:
  edition: SBLGNT
  text: οὐ μόνον δὲ ἐν τῇ παρουσίᾳ αὐτοῦ, ἀλλὰ καὶ ἐν τῇ παρακλήσει ᾗ παρεκλήθη ἐφ’ ὑμῖν, ἀναγγέλλων ἡμῖν τὴν ὑμῶν ἐπιπόθησιν, τὸν ὑμῶν ὀδυρμόν, τὸν ὑμῶν ζῆλον ὑπὲρ ἐμοῦ, ὥστε με μᾶλλον χαρῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/007.yaml
  text: and not only by his coming, but also by the comfort with which he was comforted because of you, as he reported to us your longing, your mourning, and your zeal for me, so that I rejoiced even more.
translation:
  language: fr
  text: et non seulement par son arrivée[a], mais aussi par le réconfort[b] qu’il a reçu grâce à vous, en nous rapportant votre profond désir, votre douleur[c] et votre zèle pour moi, si bien que je me suis réjoui encore davantage.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sa présence ».
    reason: lexical_alternative
  - marker: b
    text: Ou « l’encouragement »; le même terme grec et le verbe apparenté peuvent aussi évoquer la consolation ou l’encouragement.
    reason: lexical_alternative
  - marker: c
    text: Ou « vos lamentations ».
    reason: lexical_alternative
lexical_decisions:
- source_word: παρουσίᾳ
  choice: arrivée
  rationale: Dans ce contexte de déplacement personnel, le mot désigne l’arrivée de Tite. « Arrivée » exprime plus précisément l’événement que le simple fait de sa présence.
- source_word: παρακλήσει … παρεκλήθη
  choice: réconfort … avait reçu
  rationale: « Réconfort » convient au soulagement affectif du contexte. La répétition étymologique grecque ne peut être reproduite naturellement en français sans lourdeur; « le réconfort qu’il avait reçu » conserve néanmoins le nom et le sens passif.
- source_word: ἐφ’ ὑμῖν
  choice: grâce à vous
  rationale: La préposition avec le datif indique ici vraisemblablement la cause ou l’occasion du réconfort de Tite, suscitée par les Corinthiens et leur réaction. La traduction demeure naturelle et cohérente avec le contexte.
- source_word: ἀναγγέλλων
  choice: Il nous a fait part
  rationale: Le participe indique que Tite a communiqué à Paul les dispositions des Corinthiens. Une proposition indépendante évite une longue phrase française tout en gardant le lien logique avec ce qui précède.
- source_word: ἐπιπόθησιν
  choice: profond désir
  rationale: Le nom exprime une aspiration intense. « Profond désir » est clair et actuel, sans préciser indûment l’objet sous-entendu.
- source_word: ὀδυρμόν
  choice: douleur
  rationale: Le terme évoque un chagrin qui peut s’exprimer par des lamentations. « Douleur » rend naturellement l’affliction, tandis qu’une note conserve la nuance expressive possible.
- source_word: ζῆλον
  choice: zèle
  rationale: « Zèle » garde l’idée de ferveur et d’empressement sérieux, ainsi que l’ambivalence potentielle du terme selon son contexte.
- source_word: ὑπὲρ ἐμοῦ
  choice: pour moi
  rationale: 'Cette formulation concise conserve la portée assez large de la préposition: leur zèle est orienté vers Paul ou en sa faveur.'
- source_word: ὥστε με μᾶλλον χαρῆναι
  choice: si bien que je me suis réjoui encore davantage
  rationale: « Si bien que » marque le résultat, et « encore davantage » restitue la force comparative de μᾶλλον.
