source:
  edition: SBLGNT
  text: νῦν χαίρω, οὐχ ὅτι ἐλυπήθητε, ἀλλ’ ὅτι ἐλυπήθητε εἰς μετάνοιαν, ἐλυπήθητε γὰρ κατὰ θεόν, ἵνα ἐν μηδενὶ ζημιωθῆτε ἐξ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/009.yaml
  text: Now I rejoice[a], not because you were grieved, but because you were grieved into a change of mind; for you were grieved according to God[c][b], so that you might suffer no loss from us.
translation:
  language: fr
  text: À présent, je me réjouis, non pas parce que vous avez été attristés, mais parce que votre tristesse vous a amenés à vous repentir[a]. En effet, vous avez été attristés d’une manière conforme à Dieu[b], afin que vous ne subissiez aucune perte à cause de nous[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « à la repentance » ; ou : « à changer de pensée ou d’attitude ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « selon Dieu », « comme Dieu le veut » ou « d’une manière qui plaît à Dieu ».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « afin que vous ne subissiez aucun préjudice de notre part ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: νῦν
  choice: À présent
  rationale: Marque le point de vue actuel de Paul en contraste avec la situation antérieure, dans un français naturel.
- source_word: χαίρω
  choice: je me réjouis
  rationale: Conserve la valeur verbale et le registre digne de l’original.
- source_word: ἐλυπήθητε
  choice: vous avez été attristés
  rationale: Respecte la forme passive et reprend le champ lexical de la tristesse sans préciser indûment son agent.
- source_word: εἰς μετάνοιαν
  choice: votre tristesse vous a amenés à vous repentir
  rationale: Exprime naturellement en français le mouvement vers le résultat indiqué par εἰς, tout en conservant la portée morale et spirituelle de μετάνοια.
- source_word: κατὰ θεόν
  choice: d’une manière conforme à Dieu
  rationale: Maintient le rapport de la tristesse à Dieu, à sa volonté ou à sa norme, sans réduire l’expression à une simple émotion pieuse.
- source_word: ζημιωθῆτε
  choice: ne subir aucun préjudice
  rationale: Rend la notion de perte ou de dommage sans lui donner nécessairement un sens matériel ou physique.
- source_word: ἐξ ἡμῶν
  choice: de notre part
  rationale: Exprime idiomatiquement la provenance ou la cause associée à Paul et à ses collaborateurs.
theological_decisions:
- issue: Sens moral et spirituel de μετάνοια
  choice: vous repentir
  alternative: changer de pensée ou d’attitude
  rationale: 'Dans ce contexte, le terme désigne plus qu’un simple changement intellectuel : la tristesse produit un retournement moral. « Se repentir » transmet cette force sans ajouter de particularité confessionnelle.'
- issue: Nature de la tristesse exprimée par κατὰ θεόν
  choice: d’une manière conforme à Dieu
  alternative: selon Dieu ; comme Dieu le veut ; d’une manière qui plaît à Dieu
  rationale: La formulation retenue préserve le lien ouvert entre cette tristesse et Dieu — sa norme, sa volonté ou son dessein — sans trancher plus précisément que le grec.
- issue: Portée du préjudice évoqué par ζημιωθῆτε ἐξ ἡμῶν
  choice: ne subir aucun préjudice de notre part
  alternative: ne subir aucune perte à cause de nous
  rationale: Le texte peut évoquer une perte ou un dommage imputable au ministère apostolique. La traduction garde cette portée générale sans préciser la nature du préjudice.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase conserve l’opposition de Paul entre le fait d’avoir causé de la tristesse et le résultat salutaire de celle-ci. Les notes signalent les formulations plus littérales et les ambiguïtés réelles du grec.
