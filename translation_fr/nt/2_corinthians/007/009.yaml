revisions:
- from: À présent, je me réjouis, non pas de ce que vous avez été attristés, mais de ce que votre tristesse vous a amenés à vous repentir[a]. En effet, vous avez été attristés d’une manière conforme à Dieu[b], afin de ne subir aucun préjudice de notre part[c].
  to: À présent, je me réjouis, non pas parce que vous avez été attristés, mais parce que votre tristesse vous a amenés à vous repentir[a]. En effet, vous avez été attristés d’une manière conforme à Dieu[b], afin que vous ne subissiez aucune perte à cause de nous[c].
  rationale: La révision conserve les choix lexicaux principaux et les ambiguïtés du grec. Elle améliore la formulation causale et, surtout, rend ἐξ ἡμῶν par « à cause de nous », qui évite d’attribuer trop étroitement à Paul et à ses collaborateurs un préjudice qu’ils auraient directement infligé.
