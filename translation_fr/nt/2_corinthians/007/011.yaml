id: 2CO.7.11
reference: 2 Corinthians 7:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἰδοὺ γὰρ αὐτὸ τοῦτο τὸ κατὰ θεὸν ⸀λυπηθῆναι πόσην κατειργάσατο ὑμῖν σπουδήν, ἀλλὰ ἀπολογίαν, ἀλλὰ ἀγανάκτησιν, ἀλλὰ φόβον, ἀλλὰ ἐπιπόθησιν, ἀλλὰ ζῆλον, ἀλλὰ ἐκδίκησιν· ἐν παντὶ συνεστήσατε ἑαυτοὺς ἁγνοὺς ⸀εἶναι τῷ πράγματι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/011.yaml
  text: 'For see what earnestness this very grief according to God has produced in you: but also a defense[a], but also indignation, but also fear, but also longing, but also zeal, but also vindication[c][b]. In every way you proved yourselves to be pure in the matter.'
translation:
  language: fr
  text: 'Car voyez ce que cette tristesse selon Dieu[a] a produit en vous : quel empressement, mais aussi quelle défense[b], quelle indignation, quelle crainte, quel ardent désir, quel zèle, quelle action pour réparer le tort[c] ! En tout, vous avez démontré que vous étiez purs dans cette affaire.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « cette tristesse conforme à la volonté de Dieu ».
    reason: lexical_alternative
  - marker: b
    text: Ou « quel empressement à vous disculper ».
    reason: lexical_alternative
  - marker: c
    text: Ou « quelle punition », « quelle justice rendue » ou « quelle réparation du tort ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ γὰρ
  choice: Voyez, en effet
  rationale: « Voyez » conserve l’appel emphatique à considérer les faits, tandis que « en effet » rend la valeur explicative de γάρ dans un français naturel.
- source_word: αὐτὸ τοῦτο τὸ κατὰ θεὸν λυπηθῆναι
  choice: le fait même d’avoir été attristés selon Dieu
  rationale: La tournure substantive rend l’infinitif grec et maintient l’expression inhabituelle « selon Dieu », sans la réduire silencieusement à une seule interprétation.
- source_word: πόσην κατειργάσατο ὑμῖν σπουδήν
  choice: quel empressement a produit en vous
  rationale: « Produire en vous » exprime le résultat effectif de κατεργάζομαι ; « empressement » traduit l’engagement sérieux et actif de σπουδή.
- source_word: ἀλλὰ
  choice: Mais aussi quelle
  rationale: La formule introduit la série cumulative et conserve sa poussée rhétorique, sans répéter lourdement « mais aussi » devant chacun des six noms.
- source_word: ἀπολογίαν
  choice: défense
  rationale: Le terme désigne une réponse destinée à se défendre ou à se disculper. « Défense » reste concis et laisse ouverte la nuance exacte.
- source_word: ἀγανάκτησιν
  choice: indignation
  rationale: Le mot exprime une vive réprobation morale sans préciser contre qui ou contre quoi elle se dirige.
- source_word: φόβον
  choice: crainte
  rationale: Le grec ne nomme pas l’objet de la crainte ; la traduction préserve cette indétermination.
- source_word: ἐπιπόθησιν
  choice: ardent désir
  rationale: Cette expression française rend l’intensité du désir sans préciser son objet, que le contexte seul permet d’inférer.
- source_word: ζῆλον
  choice: zèle
  rationale: « Zèle » conserve la force morale du terme et le distingue de l’« empressement » mentionné auparavant.
- source_word: ἐκδίκησιν
  choice: souci de faire justice
  rationale: Cette formulation exprime la volonté active de redresser le tort sans suggérer nécessairement une vengeance personnelle ni limiter le sens à une sanction pénale.
- source_word: ἐν παντὶ συνεστήσατε ἑαυτοὺς ἁγνοὺς εἶναι τῷ πράγματι
  choice: En tout, vous avez démontré que vous étiez purs dans cette affaire
  rationale: « Démontré » rend la valeur probante de συνίστημι ; « purs dans cette affaire » maintient le vocabulaire moral de ἁγνούς et le rapport précis au cas concerné.
theological_decisions:
- issue: Sens de κατὰ θεόν
  choice: selon Dieu
  alternative: conformément à la volonté de Dieu ; d’une tristesse venant de Dieu
  rationale: 'La formulation littérale préserve la tension du grec : la tristesse peut être comprise comme conforme à Dieu, mesurée selon lui ou produite dans une relation juste avec lui. Le texte principal ne tranche pas entre ces nuances.'
- issue: Portée de ἐκδίκησις dans un contexte de repentance
  choice: souci de faire justice
  alternative: punition ; réparation du tort ; action pour obtenir justice
  rationale: Le contexte évoque une réaction repentante et résolue face au mal. La traduction retient l’idée de redresser la situation sans imposer le sens plus étroit de punition ni celui de vengeance personnelle.
- issue: Portée de ἁγνούς dans l’affaire
  choice: purs dans cette affaire
  alternative: innocents dans cette affaire ; irréprochables dans cette affaire
  rationale: « Purs » conserve le terme moral grec sans affirmer plus précisément une innocence juridique absolue ; la qualification demeure limitée à « cette affaire ».
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme exclamatif restitue l’accumulation énergique de Paul. La répétition grecque de ἀλλά est condensée après une première occurrence afin d’éviter une lourdeur artificielle, tandis que la série de « quelle » en conserve la progression rhétorique.
