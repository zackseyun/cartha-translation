  terminology: « Tristesse selon Dieu », « empressement », « défense », « indignation », « crainte », « ardent désir », « zèle » et « purs dans cette affaire » sont des choix justes et ne surinterprètent pas les objets implicites. « Action pour réparer le tort » préserve mieux le caractère effectif de ἐκδίκησις sans imposer l’idée de vengeance personnelle ou une sanction exclusivement pénale.
