  source_fidelity: 'Le sens général et la série rhétorique des effets de la tristesse « selon Dieu » sont fidèlement rendus. Toutefois, « souci de faire justice » affaiblit ἐκδίκησιν : le grec désigne une action ou une mesure de redressement, de justice ou de sanction, plutôt qu’une simple disposition intérieure.'
