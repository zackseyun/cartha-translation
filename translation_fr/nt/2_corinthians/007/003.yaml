  text: ⸂πρὸς κατάκρισιν οὐ⸃ λέγω, προείρηκα γὰρ ὅτι ἐν ταῖς καρδίαις ἡμῶν ἐστε εἰς τὸ συναποθανεῖν καὶ συζῆν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/003.yaml
  text: I do not say this to condemn you[a], for I have said before that you are in our hearts[b], to die together and to live together.
translation:
  language: fr
  text: 'Je ne dis pas cela pour vous condamner[a] ; car je l’ai déjà dit : vous êtes dans nos cœurs, pour que nous mourions et vivions ensemble[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en vue d’une condamnation ».
    reason: lexical_alternative
  - marker: b
    text: Ou « afin de mourir ensemble et de vivre ensemble ». Le grec souligne une solidarité partagée aussi bien dans la mort que dans la vie.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸς κατάκρισιν
  choice: pour vous condamner
  rationale: La construction πρός avec l’accusatif exprime ici la visée. Cette formulation française naturelle indique que les paroles de Paul n’ont pas pour but de condamner les Corinthiens, tout en signalant en note la tournure nominale possible.
- source_word: λέγω
  choice: je ne dis pas cela
  rationale: Le présent est rendu directement par « je dis » ; « cela » explicite naturellement en français le renvoi aux propos précédents.
- source_word: προείρηκα
  choice: je l’ai déjà dit
  rationale: Le passé composé rend l’antériorité et la pertinence actuelle du parfait grec ; « déjà » exprime le préverbe προ-.
- source_word: ἐν ταῖς καρδίαις ἡμῶν ἐστε
  choice: vous êtes dans nos cœurs
  rationale: La traduction suit le pluriel grec et conserve l’image d’une affection profonde et d’un attachement intérieur partagés par Paul et ses collaborateurs.
- source_word: εἰς τὸ συναποθανεῖν καὶ συζῆν
  choice: pour mourir ensemble et vivre ensemble
  rationale: « Pour » conserve la relation ouverte de visée ou de conséquence exprimée par εἰς τό, tandis que la répétition d’« ensemble » restitue les deux préfixes συν- et le parallélisme appuyé.
- source_word: συναποθανεῖν
  choice: mourir ensemble
  rationale: Le préfixe συν- marque une solidarité partagée et doit rester perceptible.
- source_word: συζῆν
  choice: vivre ensemble
  rationale: Le même rendu de συν- maintient l’équilibre rhétorique avec « mourir ensemble ».
theological_decisions:
- issue: Nature de l’union exprimée par « mourir ensemble et vivre ensemble »
  choice: Conserver le langage de solidarité relationnelle sans lui attribuer une catégorie théologique technique.
  alternative: Y voir explicitement une fidélité d’alliance ou une participation à la mort et à la vie du Christ.
  rationale: Le texte affirme un attachement et une solidarité profonds, jusque dans la mort et la vie, mais ne précise pas qu’il s’agit ici d’une union conjugale, d’alliance ou christologique.
translation_notes:
  register: Français international moderne, digne et accessible. La ponctuation met en relief la déclaration affective qui motive la précision initiale. « Cœurs » conserve l’image biblique sans réduire le terme au seul sentiment.
