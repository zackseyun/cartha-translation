  text: Χωρήσατε ἡμᾶς· οὐδένα ἠδικήσαμεν, οὐδένα ἐφθείραμεν, οὐδένα ἐπλεονεκτήσαμεν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/002.yaml
  text: Make room for us[a]. We have wronged no one, corrupted no one[b], taken advantage of no one.
translation:
  language: fr
  text: Faites-nous une place[a]. Nous n’avons fait de tort à personne, nous n’avons porté personne à sa perte[b], nous n’avons exploité personne.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Accueillez-nous » ou « Ouvrez-nous vos cœurs ». Le grec dit littéralement « Faites-nous une place », ce qui prolonge probablement l’image relationnelle de 6.11–13.
    reason: lexical_alternative
  - marker: b
    text: Ou « nous n’avons corrompu personne » ou « nous n’avons ruiné personne ».
    reason: lexical_alternative
lexical_decisions:
- source_word: Χωρήσατε
  choice: Faites-nous une place
  rationale: L’impératif de χωρέω signifie littéralement « faites de la place ». Dans le contexte de 2 Corinthiens 6.11–13, il exprime vraisemblablement un appel à l’accueil et à l’ouverture relationnelle. Cette formulation conserve l’image grecque sans ajouter explicitement « dans vos cœurs ».
- source_word: ἡμᾶς
  choice: nous
  rationale: Pronom objet direct de l’impératif, désignant Paul et ses collaborateurs.
- source_word: οὐδένα
  choice: personne
  rationale: La triple répétition de οὐδένα est reproduite afin de préserver l’insistance rhétorique de Paul.
- source_word: ἠδικήσαμεν
  choice: avons fait de tort à
  rationale: ἀδικέω désigne le fait d’agir injustement envers quelqu’un ou de lui causer du tort. Cette expression française est naturelle et garde la portée générale du verbe.
- source_word: ἐφθείραμεν
  choice: avons corrompu
  rationale: φθείρω peut signifier corrompre, gâter ou causer la perte. « Corrompu » convient au possible préjudice moral ou spirituel, tout en laissant en note l’autre nuance importante.
- source_word: ἐπλεονεκτήσαμεν
  choice: avons exploité
  rationale: πλεονεκτέω signifie tirer un avantage indu de quelqu’un, l’exploiter ou le léser par cupidité. « Exploité » est clair en français moderne et ne limite pas nécessairement l’accusation à une fraude financière.
theological_decisions:
- issue: Nature de l’appel exprimé par Χωρήσατε ἡμᾶς
  choice: Un appel relationnel à faire une place à Paul et à ses collaborateurs
  alternative: Une invitation plus générale à les accueillir ou à les recevoir
  rationale: Le contexte immédiat évoque des cœurs ouverts et demande aux Corinthiens de s’ouvrir largement (6.11–13). Le texte principal conserve néanmoins la métaphore non explicitée du grec plutôt que d’y introduire directement le mot « cœur ».
- issue: Portée de ἐφθείραμεν
  choice: Un préjudice pouvant être compris comme une corruption morale ou spirituelle
  alternative: Le fait d’avoir ruiné quelqu’un ou causé sa perte
  rationale: Le verbe grec possède une portée assez large. La traduction ne précise ni le domaine ni le mécanisme du tort et la note maintient l’autre lecture possible.
translation_notes:
  register: Français international moderne, sobre et digne. La triple structure négative est conservée. « Faites-nous une place » reste idiomatique tout en maintenant l’image du texte grec; « exploité » exprime clairement l’idée d’un avantage indu sans restreindre le propos au domaine financier.
