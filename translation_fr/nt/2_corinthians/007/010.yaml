reference: 2 Corinthians 7:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἡ γὰρ κατὰ θεὸν λύπη μετάνοιαν εἰς σωτηρίαν ἀμεταμέλητον ⸀ἐργάζεται· ἡ δὲ τοῦ κόσμου λύπη θάνατον κατεργάζεται.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/010.yaml
  text: For godly sorrow produces repentance leading to salvation without regret[b][a], but worldly sorrow produces death.
translation:
  language: fr
  text: En effet, la tristesse selon Dieu[a] produit une repentance qui conduit au salut et ne laisse aucun regret[b] ; mais la tristesse du monde produit la mort.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression grecque signifie littéralement « la tristesse selon Dieu » et peut désigner une tristesse en accord avec Dieu.
    reason: lexical_alternative
  - marker: b
    text: 'L’adjectif grec peut se comprendre directement avec « repentance » : « une repentance sans regret » ou « que l’on ne regrette pas ». En raison de l’ordre des mots, certains le comprennent plus largement avec la repentance orientée vers le salut.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ θεὸν
  choice: conforme à la volonté de Dieu
  rationale: L’expression indique une tristesse en accord avec Dieu ou mesurée selon lui. Cette formulation est naturelle en français moderne ; la note conserve la tournure grecque plus littérale.
- source_word: λύπη
  choice: tristesse
  rationale: « Tristesse » rend naturellement l’état affectif et moral désigné dans les deux membres du contraste.
- source_word: μετάνοιαν
  choice: repentance
  rationale: Dans ce contexte, le terme désigne un retournement moral et spirituel, et non un simple changement d’avis. « Repentance » est l’équivalent français établi et précis.
- source_word: εἰς σωτηρίαν
  choice: qui conduit au salut
  rationale: La préposition exprime le but ou l’aboutissement. Cette tournure garde cette orientation sans définir plus précisément le mécanisme du salut.
- source_word: ἀμεταμέλητον
  choice: que l’on ne regrette pas
  rationale: L’adjectif s’accorde grammaticalement avec « repentance » et la qualifie comme une repentance qui ne donne pas lieu au regret. La note signale une autre manière possible de structurer l’ensemble en français.
- source_word: ἐργάζεται / κατεργάζεται
  choice: produit / produit
  rationale: Les deux verbes expriment ici l’obtention d’un résultat. Employer le même verbe français préserve le parallélisme rhétorique sans exagérer la légère variation grecque.
- source_word: τοῦ κόσμου
  choice: du monde
  rationale: Le génitif désigne une tristesse appartenant au monde ou caractéristique de celui-ci. La formulation reste proche du grec et évite les connotations parfois plus étroites de « mondaine ».
- source_word: θάνατον
  choice: la mort
  rationale: Le contexte ne précise pas s’il s’agit principalement de mort spirituelle, physique ou ultime ; le terme général conserve cette amplitude.
theological_decisions:
- issue: Nature du contraste entre les deux tristesses
  choice: Opposer « la tristesse conforme à la volonté de Dieu » à « la tristesse du monde » sans préciser la nature de la mort.
  alternative: Comprendre la seconde comme une tristesse seulement humaine et la mort comme exclusivement spirituelle.
  rationale: Paul établit le contraste sans définir ici plus étroitement la sorte de mort produite ; la traduction préserve cette ouverture.
- issue: Rapport entre la repentance et le salut
  choice: Rendre εἰς σωτηρίαν par « qui conduit au salut ».
  alternative: « pour le salut » ou « qui aboutit au salut »
  rationale: Cette formulation exprime le but ou le résultat indiqué par le grec sans transformer la repentance en cause méritoire autonome ni imposer une construction doctrinale particulière.
- issue: Portée de ἀμεταμέλητον
  choice: Rattacher explicitement « que l’on ne regrette pas » à « repentance ».
  alternative: Laisser l’expression porter plus largement sur la repentance conduisant au salut, ou la rapprocher du salut en raison de l’ordre des mots.
  rationale: L’accord grammatical grec relie directement l’adjectif à μετάνοιαν, tout en permettant que l’idée concerne l’ensemble du processus orienté vers le salut ; la note préserve cette nuance de structure.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve le parallélisme des deux propositions et le vocabulaire théologique courant, tout en explicitant dans les notes les formulations grecques plus littérales et l’ambiguïté de structure.
