reference: 2 Corinthians 7:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: διὰ τοῦτο παρακεκλήμεθα. Ἐπὶ δὲ τῇ παρακλήσει ⸀ἡμῶν περισσοτέρως μᾶλλον ἐχάρημεν ἐπὶ τῇ χαρᾷ Τίτου, ὅτι ἀναπέπαυται τὸ πνεῦμα αὐτοῦ ἀπὸ πάντων ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/013.yaml
  text: For this reason we have been comforted[a]. And in addition to our comfort, we rejoiced even more abundantly at Titus’s joy[b], because his spirit has been refreshed by all of you.
translation:
  language: fr
  text: Voilà pourquoi nous avons été réconfortés[a]. Et, en plus de notre réconfort, nous nous sommes réjouis bien plus encore de la joie de Tite, car son esprit a trouvé du repos grâce à vous tous[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « encouragés » ; les termes grecs employés ici peuvent exprimer aussi bien le réconfort que l’encouragement.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « son esprit a été revigoré par vous tous ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Voilà pourquoi
  rationale: Cette tournure française naturelle conserve le lien de conséquence explicite avec ce qui précède.
- source_word: παρακεκλήμεθα
  choice: nous avons été réconfortés
  rationale: Le parfait passif exprime un réconfort reçu dont l’effet demeure. « Réconfortés » convient au contexte relationnel et affectif, tout en laissant « encouragés » comme possibilité en note.
- source_word: Ἐπὶ δὲ τῇ παρακλήσει ἡμῶν
  choice: Et, en plus de notre réconfort
  rationale: Cette formulation rend l’idée qu’à leur propre réconfort s’ajoute une joie plus grande, sans donner à δέ une opposition plus forte que ne l’exige le contexte.
- source_word: περισσοτέρως μᾶλλον
  choice: bien plus encore
  rationale: L’expression restitue en français l’intensification produite par les deux comparatifs grecs sans lourdeur excessive.
- source_word: ἐχάρημεν ἐπὶ τῇ χαρᾷ Τίτου
  choice: nous nous sommes réjouis […] de la joie de Tite
  rationale: Le verbe et le nom apparentés sont conservés par « réjouis » et « joie »; « de » exprime naturellement le motif de cette joie en français.
- source_word: ἀναπέπαυται τὸ πνεῦμα αὐτοῦ
  choice: son esprit a trouvé du repos
  rationale: Le parfait indique un apaisement acquis et durable. La formulation conserve l’image du repos et le langage anthropologique de πνεῦμα.
- source_word: ἀπὸ πάντων ὑμῶν
  choice: grâce à vous tous
  rationale: Dans ce contexte, ἀπό désigne la source ou les personnes dont l’accueil a procuré ce repos; « grâce à » l’exprime clairement en français courant.
theological_decisions:
- issue: Sens de πνεῦμα à propos de Tite
  choice: l’esprit humain de Tite, son être intérieur
  alternative: l’Esprit Saint
  rationale: Le possessif αὐτοῦ (« son ») et le contexte décrivant la réaction personnelle de Tite renvoient à son esprit ou à sa disposition intérieure, et non à l’Esprit Saint.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition « réconfortés / réconfort » reproduit le lien lexical du grec; « bien plus encore » conserve son insistance, tandis que « a trouvé du repos » maintient son image sans paraître archaïque.
