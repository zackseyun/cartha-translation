reference: 2 Corinthians 7:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἄρα εἰ καὶ ἔγραψα ὑμῖν, οὐχ ⸀ἕνεκεν τοῦ ἀδικήσαντος, ⸀οὐδὲ ⸁ἕνεκεν τοῦ ἀδικηθέντος, ἀλλ’ ⸀1ἕνεκεν τοῦ φανερωθῆναι τὴν σπουδὴν ὑμῶν τὴν ὑπὲρ ἡμῶν πρὸς ὑμᾶς ἐνώπιον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/012.yaml
  text: So even if I wrote to you[a], it was not because of the one who did wrong, nor because of the one who was wronged[b], but so that your earnestness for us might be made known among you before God.
translation:
  language: fr
  text: Ainsi, même si je vous ai écrit, ce n’était ni à cause de celui qui a commis une injustice, ni à cause de celui qui l’a subie, mais afin que votre empressement[a] pour nous soit manifesté parmi vous devant Dieu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « votre zèle », « votre diligence » ou « votre profonde sollicitude ».
    reason: lexical_alternative
  - marker: b
    text: 'Certains manuscrits portent : « afin que notre empressement pour vous soit manifesté parmi vous devant Dieu ».'
    reason: textual_variant
lexical_decisions:
- source_word: ἄρα εἰ καὶ
  choice: Ainsi, même si
  rationale: « Ainsi » restitue la conclusion introduite par ἄρα, tandis que « même si » conserve la valeur concessive de εἰ καί dans un français naturel.
- source_word: ἔγραψα
  choice: je vous ai écrit
  rationale: Le passé composé désigne naturellement, en français moderne, la lettre antérieure de Paul dont les effets restent pertinents.
- source_word: οὐχ ἕνεκεν … οὐδὲ ἕνεκεν
  choice: ce n’était ni à cause de… ni à cause de
  rationale: Cette tournure rend le motif exprimé par ἕνεκεν et conserve la structure parallèle et négative du grec.
- source_word: τοῦ ἀδικήσαντος
  choice: celui qui a commis l’injustice
  rationale: La formulation garde la valeur verbale du participe substantivé sans préciser abusivement la nature de la faute.
- source_word: τοῦ ἀδικηθέντος
  choice: celui qui l’a subie
  rationale: Le pronom reprend « l’injustice » et rend clairement le participe passif, tout en maintenant le parallélisme avec l’auteur de l’injustice.
- source_word: ἀλλ’ ἕνεκεν τοῦ φανερωθῆναι
  choice: mais afin que… soit manifesté
  rationale: « Afin que » exprime la finalité de la construction avec ἕνεκεν et l’infinitif articulé; le passif « soit manifesté » respecte la voix de φανερωθῆναι.
- source_word: τὴν σπουδὴν ὑμῶν
  choice: votre empressement
  rationale: « Empressement » exprime ici une disposition sérieuse, active et zélée, sans réduire le terme à la seule diligence pratique.
- source_word: τὴν ὑπὲρ ἡμῶν
  choice: pour nous
  rationale: La formule concise conserve l’orientation favorable de leur empressement envers Paul et ses collaborateurs.
- source_word: πρὸς ὑμᾶς
  choice: parmi vous
  rationale: Dans cette construction difficile, « parmi vous » donne un sens français intelligible au rapport de la manifestation avec les destinataires, sans effacer l’ambiguïté signalée par la tradition textuelle.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: devant Dieu
  rationale: Cette traduction concise conserve l’idée solennelle de la présence et du regard de Dieu.
theological_decisions:
- issue: Référents des pronoms dans la proposition concernant l’empressement
  choice: « votre empressement pour nous… parmi vous »
  alternative: « notre empressement pour vous… parmi vous »
  rationale: Le texte imprimé du SBLGNT porte ὑμῶν (« votre ») et ὑπὲρ ἡμῶν (« pour nous »). Cette lecture, bien que syntaxiquement difficile avec πρὸς ὑμᾶς, est conservée dans le texte principal; l’autre forme manuscrite est donnée en note afin de ne pas résoudre silencieusement la tension textuelle.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve le parallélisme rhétorique du grec ainsi que la difficulté réelle de la proposition finale, tout en évitant un vocabulaire juridique ou confessionnel trop spécialisé.
