  text: ἀλλ’ ὁ παρακαλῶν τοὺς ταπεινοὺς παρεκάλεσεν ἡμᾶς ὁ θεὸς ἐν τῇ παρουσίᾳ Τίτου·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/006.yaml
  text: But God[a], who comforts the humble[b], comforted us by the coming of Titus.
translation:
  language: fr
  text: Mais Dieu, qui réconforte les humbles[a], nous a réconfortés par la venue de Tite[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ceux qui sont abattus » ou « les gens de condition modeste ».
    reason: lexical_alternative
  - marker: b
    text: Ou « par la présence de Tite ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: Mais
  rationale: Marque naturellement le contraste avec les détresses évoquées juste avant.
- source_word: ὁ παρακαλῶν
  choice: qui réconforte
  rationale: Le participe présent décrit l’action caractéristique de Dieu. « Réconforte » convient au contexte d’affliction et maintient le lien lexical avec παρεκάλεσεν.
- source_word: τοὺς ταπεινοὺς
  choice: ceux qui sont abaissés
  rationale: Cette formulation conserve l’idée de personnes placées dans une condition basse ou éprouvante sans réduire le terme à une disposition morale ni au seul abattement émotionnel.
- source_word: παρεκάλεσεν
  choice: a réconfortés
  rationale: Le verbe reprend la même racine que ὁ παρακαλῶν ; la répétition française préserve ce lien et exprime le soulagement reçu.
- source_word: ἐν τῇ παρουσίᾳ
  choice: par la venue
  rationale: παρουσία peut désigner la présence ou la venue. Ici, le contexte présente l’arrivée de Tite comme le moyen concret du réconfort.
- source_word: Τίτου
  choice: de Tite
  rationale: Forme française traditionnelle et courante du nom grec Τίτος.
- source_word: ὁ θεὸς
  choice: Dieu
  rationale: Dieu est explicitement le sujet de l’action ; l’ordre adopté est naturel en français tout en gardant son rôle central.
theological_decisions:
- issue: Sens de τοὺς ταπεινοὺς dans le contexte
  choice: ceux qui sont abaissés
  alternative: les humbles ; ceux qui sont abattus ; les gens de condition modeste
  rationale: Le terme peut évoquer une situation d’abaissement, une humble condition ou l’abattement causé par l’épreuve. Le texte principal garde cette amplitude sans transformer nécessairement l’expression en qualité morale.
- issue: Sens de παρουσία appliqué à Tite
  choice: la venue de Tite
  alternative: la présence de Tite
  rationale: Le contexte immédiat met l’accent sur l’arrivée de Tite, mais le nom grec peut également désigner sa présence effective ; cette possibilité est conservée en note.
translation_notes:
  register: Français moderne, international et digne. La répétition de « réconforte / réconfortés » reproduit volontairement la reprise lexicale grecque. « Ceux qui sont abaissés » reste accessible tout en préservant l’ambiguïté de ταπεινούς.
