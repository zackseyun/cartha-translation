  text: Καὶ γὰρ ἐλθόντων ἡμῶν εἰς Μακεδονίαν οὐδεμίαν ⸀ἔσχηκεν ἄνεσιν ἡ σὰρξ ἡμῶν, ἀλλ’ ἐν παντὶ θλιβόμενοι— ἔξωθεν μάχαι, ἔσωθεν φόβοι—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/005.yaml
  text: For even when we came into Macedonia[a], our flesh had no rest, but we were afflicted in every way—conflicts on the outside, fears on the inside—
translation:
  language: fr
  text: 'Car, même lorsque nous sommes arrivés en Macédoine, notre chair[a] n’a connu aucun répit, mais nous étions affligés de toute manière : au-dehors, des conflits ; au-dedans, des craintes.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « nous-mêmes n’avons connu aucun répit ». Le grec dit littéralement « notre chair », expression qui évoque ici la faiblesse et la détresse de l’être humain dans sa condition corporelle.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ γὰρ
  choice: Car, même
  rationale: « Car » marque le lien explicatif avec le contexte, tandis que « même » conserve la légère insistance de la tournure grecque.
- source_word: ἐλθόντων ἡμῶν εἰς Μακεδονίαν
  choice: lorsque nous sommes arrivés en Macédoine
  rationale: Le génitif absolu a une valeur temporelle. « Arriver en Macédoine » est plus naturel en français actuel que le calque « venir dans ».
- source_word: οὐδεμίαν ἔσχηκεν ἄνεσιν
  choice: n’a connu aucun répit
  rationale: ἄνεσις désigne le repos ou le soulagement après une pression. « Aucun répit » convient particulièrement au contexte d’épreuves continues.
- source_word: ἡ σὰρξ ἡμῶν
  choice: notre chair
  rationale: La formulation conserve l’expression concrète du grec, qui évoque ici la fragilité de l’existence humaine incarnée sans désigner une « nature pécheresse ». Une reformulation idiomatique est donnée en note.
- source_word: ἀλλ’ ἐν παντὶ θλιβόμενοι
  choice: Au contraire, nous étions accablés de toutes parts
  rationale: Le participe passif exprime une pression ou une détresse subie. « De toutes parts » rend naturellement l’étendue indéfinie de ἐν παντί.
- source_word: ἔξωθεν μάχαι
  choice: au-dehors, des conflits
  rationale: μάχαι peut désigner des luttes, querelles ou affrontements. « Conflits » garde cette largeur sans suggérer nécessairement des combats physiques.
- source_word: ἔσωθεν φόβοι
  choice: au-dedans, des craintes
  rationale: Cette formulation conserve le contraste symétrique entre les pressions extérieures et les peurs intérieures.
theological_decisions:
- issue: Sens de σάρξ
  choice: notre chair
  alternative: nous-mêmes / notre corps
  rationale: Dans ce passage, σάρξ renvoie à la condition humaine incarnée, vulnérable et éprouvée, non à une inclination morale au péché. Garder « chair » préserve la texture et l’ambiguïté mesurée du texte source; la note explicite le sens idiomatique possible.
translation_notes:
  register: Français international actuel, digne et accessible. La structure finale, brève et parallèle (« au-dehors… au-dedans… »), reproduit la force rhétorique du grec. Le point avant « Au contraire » évite une phrase trop lourde tout en conservant l’opposition.
