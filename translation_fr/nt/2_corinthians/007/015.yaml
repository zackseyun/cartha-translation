reference: 2 Corinthians 7:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ τὰ σπλάγχνα αὐτοῦ περισσοτέρως εἰς ὑμᾶς ἐστιν ἀναμιμνῃσκομένου τὴν πάντων ὑμῶν ὑπακοήν, ὡς μετὰ φόβου καὶ τρόμου ἐδέξασθε αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/015.yaml
  text: And his affection for you is even greater as he remembers the obedience of all of you[a], how you received him with fear and trembling.
translation:
  language: fr
  text: Et son affection pour vous est d’autant plus grande lorsqu’il se souvient de l’obéissance dont vous avez tous fait preuve et de la manière dont vous l’avez accueilli avec crainte et tremblement.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avec respect et tremblement » ; l’expression « crainte et tremblement » décrit chez Paul une attitude sérieuse et humble, empreinte d’un profond respect.
    reason: lexical_alternative
lexical_decisions:
- source_word: σπλάγχνα
  choice: affection
  rationale: Le terme désigne littéralement les entrailles, mais exprime ici les sentiments profonds et tendres. « Affection » est naturel en français moderne et conserve la force émotionnelle.
- source_word: περισσοτέρως
  choice: d’autant plus grande
  rationale: L’adverbe comparatif intensifie l’affection de Tite, en lien avec son souvenir de l’accueil reçu.
- source_word: εἰς ὑμᾶς
  choice: pour vous
  rationale: Avec un terme d’affection, la préposition indique l’orientation de ses sentiments vers les Corinthiens.
- source_word: ἀναμιμνῃσκομένου
  choice: lorsqu’il se souvient
  rationale: Le participe au génitif exprime la circonstance associée à l’affection croissante de Tite, sans imposer un rapport causal trop strict.
- source_word: τὴν πάντων ὑμῶν ὑπακοήν
  choice: l’obéissance de vous tous
  rationale: Cette formulation conserve le sens direct de ὑπακοή et l’insistance sur l’ensemble de la communauté.
- source_word: ὡς
  choice: et de la manière dont
  rationale: Dans ce contexte, ὡς introduit le souvenir de la façon dont les Corinthiens ont accueilli Tite. La coordination française explicite naturellement le lien avec « se souvient ».
- source_word: μετὰ φόβου καὶ τρόμου
  choice: avec crainte et tremblement
  rationale: La formulation préserve l’expression paulinienne et sa tension entre crainte réelle, profond respect et humble empressement; une note en précise la portée probable.
- source_word: ἐδέξασθε
  choice: vous l’avez accueilli
  rationale: Le verbe désigne ici la réception personnelle de Tite. « Accueilli » est plus idiomatique que « reçu » dans ce contexte tout en restant fidèle.
- source_word: αὐτόν
  choice: l’
  rationale: Le pronom renvoie à Tite, clairement identifié dans le contexte immédiat, comme dans le grec.
theological_decisions:
- issue: Sens de « crainte et tremblement » lors de l’accueil de Tite
  choice: Conserver l’expression paulinienne dans le texte, comprise principalement comme une attitude de profond respect, de sérieux et d’humble empressement
  alternative: Traduire directement par « avec un profond respect et en tremblant », ou y voir principalement une peur littérale
  rationale: Le grec permet de percevoir à la fois la crainte et la révérence. Garder l’idiome évite de supprimer cette tension, tandis que la note indique sa portée contextuelle probable.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase conserve l’affection de Tite, l’accent collectif de « vous tous » et l’idiome paulinien sans l’aplanir.
