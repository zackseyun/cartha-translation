  rationale: La révision conserve la force relationnelle de παρρησία, rétablit le parallélisme de πολλή… πολλή et maintient le caractère favorable, sans l’affaiblir, de la καύχησις paulinienne. « Réconfort » améliore l’idiomaticité française tout en laissant les autres sens légitimes de παράκλησις dans la note. La relation non résolue entre joie et détresse demeure exprimée par « au milieu de ».
