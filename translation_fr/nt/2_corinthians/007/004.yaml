  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: πολλή μοι παρρησία πρὸς ὑμᾶς, πολλή μοι καύχησις ὑπὲρ ὑμῶν· πεπλήρωμαι τῇ παρακλήσει, ὑπερπερισσεύομαι τῇ χαρᾷ ἐπὶ πάσῃ τῇ θλίψει ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/004.yaml
  text: I have great boldness toward you[a], and great boasting on your behalf. I am filled with encouragement[c][b]; I overflow with joy in all our affliction.
translation:
  language: fr
  text: J’ai une grande assurance à votre égard[a], et je tire une grande fierté de vous[b]. Je suis rempli de réconfort[c] ; je déborde de joie au milieu de toute notre détresse[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une grande franchise envers vous ». Le mot grec peut désigner une assurance qui s’exprime avec liberté et ouverture.
    reason: lexical_alternative
  - marker: b
    text: Ou « je me glorifie beaucoup à votre sujet ». Le terme grec peut désigner le fait de se glorifier ou de se vanter favorablement au sujet de quelqu’un.
    reason: lexical_alternative
  - marker: c
    text: Ou « encouragement » ou « consolation ». Le mot grec comprend à la fois l’idée de fortifier et celle de consoler.
    reason: lexical_alternative
  - marker: d
    text: Ou « malgré toute notre détresse ». Le grec peut évoquer une joie qui déborde au cœur même de l’épreuve.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρρησία
  choice: assurance
  rationale: Le nom exprime ici une confiance ouverte et franche envers les Corinthiens. « Assurance » est naturel en français et conserve cette force sans limiter le sens à la seule liberté de parole.
- source_word: πρὸς ὑμᾶς
  choice: à votre égard
  rationale: Cette expression rend la relation ou l’orientation indiquée par πρός avec l’accusatif dans un français idiomatique.
- source_word: πολλή ... πολλή
  choice: une grande ... très
  rationale: La répétition grecque marque l’intensité. La variation française évite une formulation pesante tout en maintenant l’accent sur l’abondance.
- source_word: καύχησις ὑπὲρ ὑμῶν
  choice: je suis très fier de vous
  rationale: Dans ce contexte positif, καύχησις désigne le fait de tirer fierté des Corinthiens et de parler favorablement d’eux. Cette tournure française est plus naturelle que « j’ai une grande fierté » ; une note conserve l’image paulinienne de la glorification.
- source_word: πεπλήρωμαι
  choice: je suis rempli
  rationale: 'Le parfait passif décrit un état présent résultant : Paul se trouve pleinement encouragé.'
- source_word: παρακλήσει
  choice: encouragement
  rationale: παράκλησις réunit les idées de réconfort, de consolation et de force communiquée. « Encouragement » garde bien cette amplitude dans le contexte.
- source_word: ὑπερπερισσεύομαι
  choice: je déborde
  rationale: Le verbe intensif exprime une surabondance ; « déborder » en conserve l’image avec concision.
- source_word: χαρᾷ
  choice: joie
  rationale: Équivalent direct, naturel et précis de χαρά.
- source_word: ἐπὶ πάσῃ τῇ θλίψει ἡμῶν
  choice: au milieu de toute notre détresse
  rationale: La formulation situe la joie dans la détresse elle-même et préserve la coexistence paradoxale des deux, sans transformer explicitement la relation en opposition.
theological_decisions:
- issue: Conserver l’emploi positif du langage paulinien de la καύχησις
  choice: Employer « je suis très fier de vous », avec une note signalant la traduction plus littérale « je me glorifie beaucoup à votre sujet »
  alternative: « je me glorifie beaucoup à votre sujet »
  rationale: Le contexte présente cette fierté comme favorable aux Corinthiens, non comme une exaltation coupable de soi. Le texte principal reste naturel en français, tandis que la note préserve le motif rhétorique paulinien.
- issue: Préserver la tension entre joie et souffrance
  choice: « au milieu de toute notre détresse »
  alternative: « malgré toute notre détresse »
  rationale: Le grec permet de comprendre que la joie surabonde au sein même de l’épreuve. « Malgré » rendrait la relation nettement adversative et résoudrait une ambiguïté que le texte laisse ouverte.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve le parallélisme et l’intensité du grec, tout en privilégiant des collocations françaises naturelles. Les notes rendent visibles les principales possibilités lexicales et l’ambiguïté de la relation entre joie et détresse.
