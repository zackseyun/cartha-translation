  naturalness: « J’ai une grande assurance à votre égard » et « je déborde de joie au milieu de toute notre détresse » sont naturels dans un français international moderne. « Je suis rempli de réconfort » est une collocation plus fluide que « rempli d’encouragement ». « Je tire une grande fierté de vous » est naturel tout en conservant la forme nominale et la répétition emphatique du grec.
