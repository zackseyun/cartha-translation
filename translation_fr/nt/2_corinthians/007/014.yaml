revisions:
- from: Car si je me suis un tant soit peu vanté de vous auprès de lui, je n’ai pas été couvert de honte. Au contraire, de même que tout ce que nous vous avons dit était vrai, de même ce dont nous nous sommes vantés auprès de Tite[a] s’est révélé vrai.
  to: Car si je me suis tant soit peu vanté de vous auprès de lui, je n’ai pas été déshonoré. Au contraire, de même que nous vous avons toujours parlé avec vérité, de même ce dont nous nous étions vantés auprès de Tite[a] s’est avéré vrai.
  rationale: La révision corrige la formulation idiomatique de la première conditionnelle, rend plus directement le passif grec, et restitue plus précisément la valeur de manière et de totalité dans πάντα ἐν ἀληθείᾳ. Elle conserve le lien lexical de la famille « se vanter » et l’ouverture contrôlée de ἐπὶ Τίτου dans la note.
