source:
  edition: SBLGNT
  text: ὅτι εἴ τι αὐτῷ ὑπὲρ ὑμῶν κεκαύχημαι, οὐ κατῃσχύνθην, ἀλλ’ ὡς πάντα ἐν ἀληθείᾳ ἐλαλήσαμεν ὑμῖν, οὕτως καὶ ἡ καύχησις ἡμῶν ⸀ἡ ἐπὶ Τίτου ἀλήθεια ἐγενήθη.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/014.yaml
  text: For if I have boasted to him at all about you[a], I was not put to shame; rather, just as we spoke everything to you in truth[b], so also our boasting to Titus proved true.
translation:
  language: fr
  text: Car si je me suis tant soit peu vanté de vous auprès de lui, je n’ai pas été déshonoré. Au contraire, de même que nous vous avons toujours parlé avec vérité, de même ce dont nous nous étions vantés auprès de Tite[a] s’est avéré vrai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « devant Tite ». L’expression grecque peut désigner une vantardise exprimée en présence de Tite ; le contexte indique qu’elle concernait les Corinthiens.
    reason: alternative lexicale et ambiguïté de la préposition grecque
lexical_decisions:
- source_word: κεκαύχημαι / ἡ καύχησις ἡμῶν
  choice: je me suis vanté / ce dont nous nous sommes vantés
  rationale: Le verbe « se vanter » conserve la force rhétorique de la famille καυχάομαι/καύχησις et le lien lexical entre les deux propositions. Le contexte montre qu’il s’agit d’une appréciation confiante et justifiée, non d’une arrogance condamnable.
- source_word: εἴ τι
  choice: si je me suis un tant soit peu
  rationale: « Un tant soit peu » exprime naturellement la valeur indéfinie de τι dans cette tournure conditionnelle, sans exagérer la portée de l’affirmation.
- source_word: οὐ κατῃσχύνθην
  choice: je n’ai pas été couvert de honte
  rationale: 'Cette formulation garde la valeur passive du grec : les faits n’ont pas démenti Paul ni exposé ses paroles comme honteusement fausses.'
- source_word: πάντα ἐν ἀληθείᾳ ἐλαλήσαμεν ὑμῖν
  choice: tout ce que nous vous avons dit était vrai
  rationale: Cette formulation française naturelle conserve la portée globale de πάντα et rend idiomatiquement ἐν ἀληθείᾳ, qui qualifie les paroles comme conformes à la vérité.
- source_word: ἡ ἐπὶ Τίτου
  choice: auprès de Tite
  rationale: Dans ce contexte, ἐπί avec le génitif situe les propos tenus en présence de Tite ou à son intention. « Auprès de Tite » est naturel et maintient une légère ouverture sémantique.
- source_word: ἀλήθεια ἐγενήθη
  choice: s’est révélé vrai
  rationale: L’expression indique que les faits ont confirmé les propos de Paul. « S’est révélé vrai » rend cette validation de façon idiomatique.
- source_word: ὅτι
  choice: Car
  rationale: La conjonction introduit ici l’explication de ce qui précède ; « Car » marque clairement ce lien discursif.
theological_decisions:
- issue: Nature de la « vantardise » de Paul
  choice: Conserver le verbe « se vanter », en laissant le contexte montrer que les faits ont justifié ses propos.
  alternative: Employer « être fier » ou « exprimer sa confiance » afin d’éviter la connotation négative de « se vanter ».
  rationale: La famille καυχάομαι/καύχησις peut désigner chez Paul une mise en valeur ou une fierté légitime. La traduction ne doit ni transformer automatiquement cette notion en arrogance coupable, ni en atténuer la force rhétorique.
translation_notes:
  register: Français international actuel, digne et accessible. La répétition de « vrai » reflète l’insistance du grec sur la vérité, tandis que la reprise de « se vanter » préserve le lien entre le verbe et le nom grecs.
