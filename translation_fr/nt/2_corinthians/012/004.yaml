source:
  edition: SBLGNT
  text: ὅτι ἡρπάγη εἰς τὸν παράδεισον καὶ ἤκουσεν ἄρρητα ῥήματα ἃ οὐκ ἐξὸν ἀνθρώπῳ λαλῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/004.yaml
  text: that he was caught up into paradise and heard inexpressible words, which a man is not permitted to speak.
translation:
  language: fr
  text: qu’il fut emporté au paradis et entendit des paroles inexprimables, qu’il n’est pas permis à un être humain de prononcer.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡρπάγη
  choice: fut emporté
  rationale: Rend l’aoriste passif et l’idée d’un déplacement soudain subi, sans préciser explicitement l’agent.
- source_word: παράδεισον
  choice: paradis
  rationale: Équivalent français direct qui conserve la portée religieuse du terme grec.
- source_word: ἄρρητα ῥήματα
  choice: des paroles inexprimables
  rationale: Conserve la tension entre ce qui ne peut être exprimé et ce qu’il n’est pas permis de prononcer, explicitée ensuite par la proposition relative.
- source_word: ἀνθρώπῳ
  choice: un être humain
  rationale: Le nom générique ἄνθρωπος désigne ici l’humain en tant que tel, non spécifiquement un homme de sexe masculin.
- source_word: λαλῆσαι
  choice: prononcer
  rationale: Dans ce contexte de paroles interdites à la communication humaine, « prononcer » est naturel et précis.
theological_decisions:
- issue: Nature de l’interdiction exprimée par οὐκ ἐξόν
  choice: « il n’est pas permis »
  alternative: « il n’est pas possible »
  rationale: L’expression impersonnelle ἐξόν porte normalement sur ce qui est autorisé ou licite. La traduction maintient donc l’idée d’interdiction sans en préciser la source.
- issue: Agent de l’enlèvement
  choice: 'passif sans agent explicite : « fut emporté »'
  alternative: « Dieu l’emporta »
  rationale: Le grec emploie un passif et ne nomme pas l’agent; la traduction préserve cette retenue.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation garde la structure du grec tout en évitant le masculin générique potentiellement ambigu de « un homme ».
