language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: μὴ πάλιν ⸂ἐλθόντος μου⸃ ⸀ταπεινώσῃ ⸀με ὁ θεός μου πρὸς ὑμᾶς, καὶ πενθήσω πολλοὺς τῶν προημαρτηκότων καὶ μὴ μετανοησάντων ἐπὶ τῇ ἀκαθαρσίᾳ καὶ πορνείᾳ καὶ ἀσελγείᾳ ᾗ ἔπραξαν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/021.yaml
  text: I fear that when I come again[a], my God may humble me before you[d][c][b], and I will mourn over many who have sinned before and have not repented of the impurity and sexual immorality and sensuality that they practiced.
translation:
  language: fr
  text: Je crains que, quand je reviendrai[a], mon Dieu ne m’humilie devant vous[b], et que je pleure sur beaucoup de ceux qui ont péché auparavant et ne se sont pas repentis de l’impureté, de l’immoralité sexuelle et de la débauche auxquelles ils se sont livrés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à mon retour ». Littéralement « lorsque je viendrai de nouveau ».
    reason: πάλιν marque une nouvelle venue de Paul ; les deux formulations françaises sont possibles.
  - marker: b
    text: Ou « ne m’abaisse parmi vous ». Le verbe grec peut signifier « abaisser », « humilier » ou « rendre humble », selon le contexte.
    reason: Le degré de l’abaissement et la nuance exacte de πρὸς ὑμᾶς demeurent ouverts dans le grec.
lexical_decisions:
- source_word: μὴ πάλιν ἐλθόντος μου
  choice: Je crains qu’à mon retour
  rationale: Le verbe de crainte est sous-entendu depuis le verset précédent. « À mon retour » rend naturellement la proposition participiale et πάλιν, qui indique une nouvelle visite.
- source_word: ταπεινώσῃ με ὁ θεός μου πρὸς ὑμᾶς
  choice: mon Dieu ne m’humilie devant vous
  rationale: Après un verbe de crainte, le français emploie naturellement « ne » sans valeur négative. « Humilie » conserve ici la possibilité d’un abaissement éprouvé en présence des Corinthiens; « devant vous » rend la nuance contextuelle de πρὸς ὑμᾶς.
- source_word: πενθήσω
  choice: je n’aie à pleurer sur
  rationale: πενθέω exprime un deuil ou une profonde affliction. « Pleurer sur » est naturel en français et garde la gravité du terme.
- source_word: πολλοὺς τῶν προημαρτηκότων
  choice: beaucoup de ceux qui ont péché auparavant
  rationale: La tournure partitive du grec est conservée, et le parfait indique des péchés antérieurs qui demeurent pertinents dans la situation présente.
- source_word: μὴ μετανοησάντων
  choice: ne se sont pas repentis
  rationale: Le passé composé exprime naturellement qu’au moment envisagé leur repentance n’a toujours pas eu lieu.
- source_word: ἀκαθαρσίᾳ
  choice: impureté
  rationale: Terme français courant qui conserve la portée morale assez large du grec.
- source_word: πορνείᾳ
  choice: immoralité sexuelle
  rationale: Expression moderne et compréhensible qui rend la portée générale de πορνεία sans la réduire à une seule forme de conduite sexuelle.
- source_word: ἀσελγείᾳ
  choice: débauche
  rationale: Le mot évoque une conduite effrénée et éhontée, souvent sexuelle, et distingue ce vice des deux précédents.
- source_word: ᾗ ἔπραξαν
  choice: auxquelles ils se sont livrés
  rationale: Le relatif singulier grec reprend collectivement les trois comportements. En français, le pluriel s’accorde naturellement avec l’énumération, tandis que « se livrer à » suggère une conduite pratiquée.
theological_decisions:
- issue: Portée de μή et continuité syntaxique avec le verset précédent
  choice: Rendre explicitement la crainte par « Je crains que… »
  alternative: « De peur qu’à mon retour… »
  rationale: Le grec poursuit la crainte exprimée au verset 20 plutôt que d’introduire une affirmation indépendante. L’explicitation est nécessaire pour obtenir une phrase française autonome et claire.
- issue: Sens de l’abaissement de Paul par Dieu
  choice: « mon Dieu ne m’humilie devant vous »
  alternative: « mon Dieu ne m’abaisse parmi vous »
  rationale: Le contexte peut évoquer une humiliation vécue en présence de l’Église, mais le texte ne précise ni sa forme ni son mécanisme. La traduction préserve cette tension sans lui donner une interprétation doctrinale.
- issue: Distinction des trois vices
  choice: « l’impureté, l’immoralité sexuelle et la débauche »
  alternative: « l’impureté, la prostitution et le dérèglement »
  rationale: Les trois termes grecs, proches mais distincts, restent séparés. Les choix français évitent de restreindre πορνεία à une catégorie trop étroite.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la solennité et l’intensité affective de Paul, tout en évitant les termes vieillissants comme « impudicité » ou « dissolution ». Les deux marqueurs de note figurent dans le texte principal.
