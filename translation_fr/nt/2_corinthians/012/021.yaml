  naturalness: Le français est globalement moderne et soutenu. « Quand je reviendrai » rend plus directement et naturellement πάλιν ἐλθόντος μου que « à mon retour », tout en conservant le sens. La coordination au subjonctif après « Je crains que » est idiomatique.
  terminology: « Impureté », « immoralité sexuelle » et « débauche » maintiennent utilement la distinction de ἀκαθαρσία, πορνεία et ἀσέλγεια. « Se sont livrés » rend convenablement la pratique collective des conduites énumérées. « Humilier devant vous » demeure une option recevable pour ταπεινόω πρὸς ὑμᾶς, avec une note qui préserve l’alternative « parmi vous ».
