reference: 2 Corinthians 12:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: παρεκάλεσα Τίτον καὶ συναπέστειλα τὸν ἀδελφόν· μήτι ἐπλεονέκτησεν ὑμᾶς Τίτος; οὐ τῷ αὐτῷ πνεύματι περιεπατήσαμεν; οὐ τοῖς αὐτοῖς ἴχνεσιν;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/018.yaml
  text: I urged Titus to go and sent the brother with him. Titus did not take advantage of you[a], did he? Did we not walk in the same spirit? Did we not walk in the same footsteps?
translation:
  language: fr
  text: J’ai demandé avec insistance à Tite d’y aller et j’ai envoyé le frère avec lui. Tite ne vous a pas exploités, n’est-ce pas ? N’avons-nous pas marché dans le même esprit[a] ? N’avons-nous pas suivi les mêmes traces ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « par le même Esprit » ; il pourrait s’agir de l’Esprit Saint plutôt que simplement d’une même disposition ou manière d’agir.'
    reason: Lecture alternative préservant l’ambiguïté de πνεῦμα et la tension théologique du texte.
lexical_decisions:
- source_word: παρεκάλεσα Τίτον
  choice: J’ai demandé avec insistance à Tite d’y aller
  rationale: Dans ce contexte de mission pratique, παρακαλέω exprime une demande pressante. « D’y aller » explicite naturellement en français le déplacement impliqué par le contexte, sans ajouter de destination.
- source_word: συναπέστειλα
  choice: j’ai envoyé le frère avec lui
  rationale: Le préverbe συν- indique que le frère a été envoyé avec Tite. Cette formulation française rend clairement cette relation.
- source_word: τὸν ἀδελφόν
  choice: le frère
  rationale: Le grec porte l’article défini sans possessif. « Le frère » conserve cette forme et désigne vraisemblablement un croyant connu des destinataires.
- source_word: μήτι ἐπλεονέκτησεν ὑμᾶς Τίτος
  choice: Tite ne vous a pas exploités, n’est-ce pas ?
  rationale: μήτι introduit une question qui appelle une réponse négative. « Exploiter » rend ici l’idée de tirer profit de quelqu’un à ses dépens, notamment sur le plan matériel.
- source_word: τῷ αὐτῷ πνεύματι
  choice: dans le même esprit
  rationale: Le datif peut indiquer la sphère ou la manière. Cette formulation évoque naturellement une disposition commune tout en laissant possible une allusion à l’Esprit Saint.
- source_word: περιεπατήσαμεν
  choice: avons-nous marché
  rationale: « Marcher » conserve la métaphore paulinienne de la conduite de vie, qui reste intelligible en français moderne.
- source_word: τοῖς αὐτοῖς ἴχνεσιν
  choice: avons-nous suivi les mêmes traces
  rationale: ἴχνος désigne une trace ou une empreinte, puis figurativement une ligne de conduite. « Suivre les mêmes traces » préserve l’image dans un français naturel.
theological_decisions:
- issue: Sens de « dans le même esprit »
  choice: une même disposition ou manière d’agir, avec « esprit » en minuscule
  alternative: « par le même Esprit », en référence directe à l’Esprit Saint
  rationale: Le contexte immédiat souligne la cohérence entre la conduite de Paul et celle de Tite. La minuscule convient au sens probable de disposition commune, tandis que la note maintient ouverte la possibilité d’une référence à l’Esprit Saint.
translation_notes:
  register: Français international moderne, naturel et digne. Les deux dernières propositions sont rendues comme deux questions distinctes, conformément à la ponctuation et au parallélisme grecs. Le marqueur de note est placé après « esprit », expression à laquelle la variante se rapporte.
