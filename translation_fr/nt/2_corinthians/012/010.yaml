  text: διὸ εὐδοκῶ ἐν ἀσθενείαις, ἐν ὕβρεσιν, ἐν ἀνάγκαις, ἐν διωγμοῖς ⸀καὶ στενοχωρίαις, ὑπὲρ Χριστοῦ· ὅταν γὰρ ἀσθενῶ, τότε δυνατός εἰμι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/010.yaml
  text: Therefore I delight in weaknesses[a], in insults, in hardships, in persecutions and distresses, for the sake of Messiah; for when I am weak, then I am strong.
translation:
  language: fr
  text: C’est pourquoi je trouve mon plaisir dans les faiblesses, les outrages, les épreuves, les persécutions et les détresses, pour le Messie[a] ; car, lorsque je suis faible, c’est alors que je suis fort.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, selon la formulation traditionnelle : « pour Christ » .'
    reason: Signale la traduction traditionnelle de Χριστοῦ, tandis que le texte conserve « le Messie » pour rendre la valeur titulaire.
lexical_decisions:
- source_word: διὸ
  choice: C’est pourquoi
  rationale: Introduit naturellement en français la conclusion tirée de l’argument précédent.
- source_word: εὐδοκῶ
  choice: je prends plaisir
  rationale: Conserve la force paradoxale du verbe, qui exprime une disposition favorable ou le fait de trouver son plaisir, plutôt qu’une simple résignation.
- source_word: ἐν ἀσθενείαις
  choice: aux faiblesses
  rationale: Le pluriel maintient la portée générale du terme, qui ne se limite pas à la maladie physique.
- source_word: ἐν ὕβρεσιν
  choice: aux outrages
  rationale: Rend l’idée d’insultes humiliantes et de mauvais traitements avec une intensité adaptée au contexte.
- source_word: ἐν ἀνάγκαις
  choice: aux épreuves
  rationale: Exprime en français courant les circonstances pénibles et contraignantes visées ici, sans adopter le littéralisme peu naturel « nécessités ».
- source_word: ἐν διωγμοῖς
  choice: aux persécutions
  rationale: Correspond au sens clair du terme dans cette liste de souffrances endurées.
- source_word: καὶ στενοχωρίαις
  choice: et aux angoisses
  rationale: Évoque la pression et l’oppression extrêmes contenues dans l’image d’un espace resserré, tout en restant naturel en français.
- source_word: ὑπὲρ Χριστοῦ
  choice: pour le Messie
  rationale: « Pour » conserve la latitude de ὑπέρ, qui peut évoquer à la fois la cause, l’engagement et l’intérêt de celui pour qui ces souffrances sont endurées. « Messie » maintient ici la valeur titulaire de Χριστός.
- source_word: ὅταν γὰρ ἀσθενῶ
  choice: car lorsque je suis faible
  rationale: Rend la valeur temporelle générale de ὅταν avec le présent, dans un français fluide.
- source_word: τότε δυνατός εἰμι
  choice: c’est alors que je suis fort
  rationale: La tournure emphatique fait ressortir le contraste temporel et paradoxal entre faiblesse et force.
theological_decisions:
- issue: Traduction de Χριστοῦ
  choice: le Messie
  alternative: Christ
  rationale: Dans cette expression, Χριστός peut garder sa valeur de titre. « Le Messie » rend cette valeur explicitement, tandis que la formulation traditionnelle « Christ » est signalée en note.
- issue: Nature de la force dans « je suis fort »
  choice: Conserver l’énoncé sans préciser explicitement la source de la force
  alternative: je suis fort par la puissance du Messie
  rationale: Le contexte précédent associe cette force à la puissance du Messie, mais le grec du verset formule délibérément le paradoxe sans complément. La traduction n’ajoute donc aucune explicitation théologique.
translation_notes:
  register: Français international moderne, digne et accessible. La structure en série est conservée, mais les prépositions répétées du grec sont regroupées selon l’usage naturel du français. Le paradoxe final reste bref et fortement marqué.
