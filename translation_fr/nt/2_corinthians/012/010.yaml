revisions:
- from: C’est pourquoi je prends plaisir aux faiblesses, aux outrages, aux épreuves, aux persécutions et aux angoisses, pour le Messie[a] ; car lorsque je suis faible, c’est alors que je suis fort.
  to: C’est pourquoi je trouve mon plaisir dans les faiblesses, les outrages, les épreuves, les persécutions et les détresses, pour le Messie[a] ; car, lorsque je suis faible, c’est alors que je suis fort.
  rationale: La révision remplace un terme psychologisant par « détresses », améliore l’idiomaticité de la première proposition tout en conservant la série en « dans », et simplifie la note traditionnelle. Elle ne modifie ni la portée de la liste ni le paradoxe final.
