reference: 2 Corinthians 12:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἰδοὺ τρίτον ⸀τοῦτο ἑτοίμως ἔχω ἐλθεῖν πρὸς ὑμᾶς, καὶ οὐ ⸀καταναρκήσω· οὐ γὰρ ζητῶ τὰ ὑμῶν ἀλλὰ ὑμᾶς, οὐ γὰρ ὀφείλει τὰ τέκνα τοῖς γονεῦσιν θησαυρίζειν, ἀλλὰ οἱ γονεῖς τοῖς τέκνοις.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/014.yaml
  text: Look, this is the third time I am ready to come to you, and I will not be a burden to you. For I do not seek what is yours, but you. For children are not obligated to store up for their parents, but parents for their children.
translation:
  language: fr
  text: 'Voici : pour la troisième fois[a], je suis prêt à venir chez vous, et je ne serai pas à votre charge[b]. En effet, ce ne sont pas vos biens que je cherche, mais vous-mêmes. Car ce n’est pas aux enfants de mettre de côté pour leurs parents, mais aux parents de le faire pour leurs enfants.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « cette troisième fois, je suis prêt à venir chez vous ».'
    reason: La tournure grecque est compacte et peut désigner une troisième préparation ou tentative de visite sans préciser à elle seule le nombre de visites déjà effectuées.
  - marker: b
    text: Le verbe traduit par « être à votre charge » peut désigner le fait d’imposer à quelqu’un une charge, en particulier financière.
    reason: Précise la nuance contextuelle d’un verbe grec rare sans la réduire entièrement à son aspect financier.
lexical_decisions:
- source_word: Ἰδοὺ
  choice: Voici
  rationale: Marque naturellement l’attention en français moderne, avec un registre digne sans l’archaïsme de « voici que » ou « voyez ».
- source_word: τρίτον τοῦτο ἑτοίμως ἔχω ἐλθεῖν
  choice: c’est la troisième fois que je suis prêt à venir
  rationale: Rend la troisième disposition ou préparation de Paul à venir, sans affirmer explicitement que deux visites antérieures ont effectivement eu lieu.
- source_word: πρὸς ὑμᾶς
  choice: chez vous
  rationale: Expression française naturelle pour une venue auprès de la communauté destinataire.
- source_word: καταναρκήσω
  choice: je ne serai pas à votre charge
  rationale: Le verbe évoque ici le fait d’imposer une charge, notamment matérielle ou financière ; cette tournure est claire et idiomatique.
- source_word: ζητῶ τὰ ὑμῶν ἀλλὰ ὑμᾶς
  choice: ce ne sont pas vos biens que je cherche, mais vous-mêmes
  rationale: Préserve nettement l’opposition entre les possessions des Corinthiens et leurs personnes, en explicitant le sens matériel de l’expression grecque.
- source_word: ὀφείλει
  choice: ce n’est pas aux enfants de
  rationale: Exprime en français courant l’obligation normative indiquée par le verbe grec.
- source_word: θησαυρίζειν
  choice: mettre de côté
  rationale: Rend l’idée d’accumuler ou d’épargner des ressources pour quelqu’un, de façon naturelle dans le contexte familial.
- source_word: γονεῦσιν / γονεῖς
  choice: parents
  rationale: Le terme grec désigne les parents sans restriction de genre.
- source_word: τέκνα / τέκνοις
  choice: enfants
  rationale: Le terme grec est générique et inclut filles et garçons.
theological_decisions:
- issue: Portée de la mention « la troisième fois »
  choice: La formulation porte sur la troisième fois où Paul est prêt à venir.
  alternative: Comprendre qu’il s’agit nécessairement de sa troisième visite effective.
  rationale: La syntaxe grecque rattache la mention de la troisième fois à l’état de préparation de Paul ; la traduction évite donc de trancher une reconstruction de son itinéraire que le verset n’impose pas à lui seul.
translation_notes:
  register: Français international moderne, clair et digne. « Voici » conserve la fonction d’appel à l’attention ; « à votre charge » et « mettre de côté » sont courants sans être familiers. Le contraste rhétorique entre les biens et les personnes est maintenu.
