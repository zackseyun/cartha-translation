  text: καὶ οἶδα τὸν τοιοῦτον ἄνθρωπον— εἴτε ἐν σώματι εἴτε ⸀χωρὶς τοῦ σώματος οὐκ οἶδα, ὁ θεὸς οἶδεν—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/003.yaml
  text: And I know such a man—whether in the body or apart from the body I do not know[a]; God knows—
translation:
  language: fr
  text: Et je connais un tel homme — s’il était dans son corps ou hors de son corps[a], je ne sais pas ; Dieu le sait —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « en dehors de son corps » pour « hors de son corps ». Paul ne dit pas si l’expérience a eu lieu dans le corps ou hors du corps.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἶδα
  choice: je connais / je sais / le sait
  rationale: Le français distingue naturellement la connaissance d’une personne (« je connais un tel homme ») de la connaissance d’un fait (« je ne sais pas »). Les trois formes rendent néanmoins le même verbe grec et en préservent la répétition sémantique.
- source_word: τὸν τοιοῦτον ἄνθρωπον
  choice: un tel homme
  rationale: Cette formulation conserve le masculin singulier et la manière indirecte dont Paul désigne l’homme déjà évoqué, sans l’identifier explicitement à Paul.
- source_word: εἴτε ... εἴτε
  choice: si ... ou
  rationale: Dans une interrogation indirecte exprimant deux possibilités, « si… ou » est naturel en français et conserve l’alternative grecque.
- source_word: ἐν σώματι
  choice: dans son corps
  rationale: Le possessif est nécessaire à la fluidité et à la clarté en français dans ce contexte ; il n’affirme rien de plus sur la nature de l’expérience.
- source_word: χωρὶς τοῦ σώματος
  choice: hors de son corps
  rationale: « Hors de » exprime clairement la séparation indiquée par χωρίς tout en maintenant l’opposition avec « dans son corps », sans définir métaphysiquement l’expérience.
- source_word: οὐκ οἶδα, ὁ θεὸς οἶδεν
  choice: je ne sais pas ; Dieu le sait
  rationale: La formulation conserve le contraste appuyé entre l’ignorance de Paul et la connaissance de Dieu. Le pronom « le » est idiomatique en français et reprend la question implicite.
- source_word: θεὸς
  choice: Dieu
  rationale: Équivalent français standard et non ambigu.
theological_decisions:
- issue: La désignation indirecte de Paul et la nature de l’expérience
  choice: Conserver « un tel homme » et laisser ouverte la question de savoir si l’expérience s’est produite dans le corps ou hors de celui-ci.
  alternative: Identifier explicitement cet homme à Paul, employer « une telle personne » ou présenter l’événement comme une expérience assurément extracorporelle.
  rationale: Le grec maintient une distance rhétorique et ne tranche pas entre les deux possibilités. La traduction préserve cette ambiguïté et cette tension.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure « un tel homme » conserve la solennité et l’indirection du grec. Les tirets reproduisent le caractère parenthétique et inachevé de la phrase dans son contexte.
