revisions:
- from: Les signes qui caractérisent un apôtre[a] ont vraiment été accomplis parmi vous avec une persévérance sans faille, par des signes, des prodiges et des actes de puissance[b].
  to: Les signes d’un apôtre[a] ont vraiment été accomplis parmi vous en toute persévérance, par des signes, des prodiges et des actes de puissance[b].
  rationale: La révision remplace « avec une persévérance sans faille » par « en toute persévérance » afin de rendre ἐν πάσῃ ὑπομονῇ sans intensification indue. Elle emploie aussi « les signes d’un apôtre », formulation plus proche du grec qui préserve l’ambiguïté qualitative, générique ou potentiellement référentielle signalée par la note. Le reste du texte et les ancres de notes sont conservés.
