  timestamp: '2026-07-14T11:36:52Z'
review_pass:
  verdict: revise
  source_fidelity: La traduction rend bien la structure générale, le passif de κατειργάσθη, le cadre communautaire de ἐν ὑμῖν et la triade finale. Toutefois, « sans faille » renforce πάσῃ au point de suggérer une persévérance irréprochable ou parfaite, nuance qui n’est pas exprimée par le grec. « En toute persévérance » conserve mieux l’intensité et l’ampleur de l’expression sans ajout interprétatif.
  naturalness: Le français demeure moderne, clair et d’un registre approprié. « Les signes qui caractérisent un apôtre » est naturel, mais « les signes d’un apôtre » est plus proche de la formulation grecque et préserve plus directement l’ambiguïté du génitif, laquelle est explicitée en note.
  terminology: « Signes », « prodiges » et « actes de puissance » conservent utilement les distinctions de la triade σημεῖα, τέρατα et δυνάμεις. « Persévérance » convient à ὑπομονή. La note b est correctement ancrée à « actes de puissance » et la note a à l’expression dont elle traite.
  issues:
  - severity: medium
    issue: « une persévérance sans faille » surinterprète ἐν πάσῃ ὑπομονῇ.
    rationale: πάσῃ exprime la totalité ou la pleine mesure de la persévérance/endurance, mais « sans faille » peut introduire l’idée d’une absence de tout défaut. « en toute persévérance » est plus littéral et ne surcharge pas le sens.
  - severity: low
    issue: La reformulation « qui caractérisent un apôtre » explicite le génitif plus que nécessaire.
    rationale: Elle est défendable, mais « les signes d’un apôtre » conserve plus directement la forme et l’ambiguïté de τοῦ ἀποστόλου, tout en restant intelligible grâce à la note.
  revised_text: Les signes d’un apôtre[a] ont vraiment été accomplis parmi vous en toute persévérance, par des signes, des prodiges et des actes de puissance[b].
