source:
  edition: SBLGNT
  text: τὰ μὲν σημεῖα τοῦ ἀποστόλου κατειργάσθη ἐν ὑμῖν ἐν πάσῃ ⸀ὑπομονῇ, σημείοις ⸀τε καὶ τέρασιν καὶ δυνάμεσιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/012.yaml
  text: Indeed[a], the signs of an apostle were performed among you with all perseverance[b], with signs and wonders and powers.
translation:
  language: fr
  text: Les signes d’un apôtre[a] ont vraiment été accomplis parmi vous en toute persévérance, par des signes, des prodiges et des actes de puissance[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les signes de l’apôtre », si l’expression renvoie précisément à Paul plutôt qu’aux marques de l’apostolat en général.'
    reason: alternative_reading
  - marker: b
    text: L’expression « actes de puissance » peut aussi se traduire par « miracles » ou « œuvres puissantes » ; le terme grec met l’accent sur la puissance à l’œuvre.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ μὲν σημεῖα
  choice: les signes… vraiment
  rationale: μέν souligne ici l’affirmation, sans δέ exprimé. « vraiment » restitue naturellement cette insistance en français, tandis que σημεῖα reste rendu par « signes ».
- source_word: τοῦ ἀποστόλου
  choice: qui caractérisent un apôtre
  rationale: 'Cette formulation fait entendre la valeur probablement qualitative ou générique du génitif : les signes propres à un apôtre. Elle évite de réduire d’emblée l’expression à Paul seul, tout en signalant l’autre possibilité en note.'
- source_word: κατειργάσθη
  choice: ont été accomplis
  rationale: L’aoriste passif indique que ces signes ont été produits ou réalisés. « ont été accomplis » conserve la voix passive et le caractère résultatif sans préciser l’agent.
- source_word: ἐν ὑμῖν
  choice: parmi vous
  rationale: Dans ce contexte communautaire, l’expression désigne ce qui s’est produit au milieu des Corinthiens plutôt qu’une réalité intérieure.
- source_word: ἐν πάσῃ ὑπομονῇ
  choice: avec une persévérance sans faille
  rationale: ὑπομονή désigne l’endurance ferme dans l’épreuve. « sans faille » exprime idiomatiquement la force de πάσῃ sans suggérer une perfection doctrinale abstraite.
- source_word: σημείοις τε καὶ τέρασιν καὶ δυνάμεσιν
  choice: par des signes, des prodiges et des actes de puissance
  rationale: La triade est conservée. « actes de puissance » rend δυνάμεσιν sans le confondre simplement avec les signes ou les prodiges et exprime clairement son sens concret dans ce contexte.
theological_decisions:
- issue: Sens de « les signes qui caractérisent un apôtre »
  choice: La formule désigne les marques attestant un ministère apostolique, manifestées ici dans la persévérance ainsi que dans les signes, prodiges et actes de puissance.
  alternative: La formule désigne uniquement les miracles comme signes distinctifs de l’apostolat, ou « les signes de l’apôtre » renvoie précisément à Paul.
  rationale: La syntaxe énonce d’abord les signes caractéristiques d’un apôtre, puis mentionne la persévérance et les manifestations puissantes. La traduction maintient cette portée large et l’ambiguïté du génitif sans établir une liste doctrinale exhaustive.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure « qui caractérisent un apôtre » explicite sobrement le génitif qualitatif, tandis que « ont été accomplis » en conserve la voix passive. La répétition de « signes » est maintenue parce qu’elle appartient à la structure du grec.
