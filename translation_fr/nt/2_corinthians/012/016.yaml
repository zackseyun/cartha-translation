    rationale: En français contemporain, « prendre quelqu’un par tromperie » ne rend pas clairement l’idée de le prendre au piège ou de l’avoir par stratagème. « Je vous ai eus par la ruse » est idiomatique et reste compatible avec l’ambiguïté de λαμβάνω.
  - severity: low
    issue: « rusé comme je l’étais » surinterprète légèrement la forme participiale et affaiblit l’abrupte accusation reprise ironiquement.
    rationale: La tournure introduit un imparfait descriptif (« je l’étais ») absent du grec. L’apposition « rusé » est plus proche de ὑπάρχων πανοῦργος et plus nerveuse en français.
