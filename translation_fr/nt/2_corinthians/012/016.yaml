revisions:
- from: Soit, je ne vous ai pas été à charge[a]. Pourtant, rusé comme je l’étais, je vous ai pris par tromperie[b][c].
  to: Soit, je ne vous ai pas été à charge[a]. Mais, rusé, je vous ai eus par la ruse[b][c].
  rationale: La révision remplace une expression littérale mais peu française par « je vous ai eus par la ruse », qui rend de manière idiomatique l’idée de saisir ou de prendre quelqu’un au moyen d’un stratagème. Elle simplifie aussi la traduction du participe afin de ne pas attribuer une valeur temporelle ou affirmative excessive à la formule que Paul semble reprendre ironiquement. Les notes conservent les alternatives pertinentes et signalent l’ironie probable sans l’imposer dans le texte.
