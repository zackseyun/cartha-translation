review_pass:
  verdict: revise
  source_fidelity: « Soit, je ne vous ai pas été à charge » rend fidèlement la concession rhétorique de ἔστω δέ et le sens contextuel de κατεβάρησα. En revanche, « je vous ai pris par tromperie » est peu idiomatique en français et ne communique pas clairement la valeur hostile de ἔλαβον dans ce contexte. « Je vous ai eus par la ruse » exprime naturellement l’idée de prendre/capturer quelqu’un par stratagème, sans transformer le texte en aveu explicite d’exploitation.
  naturalness: « Rusé comme je l’étais » est grammatical mais alourdit la phrase et présente la ruse comme un état personnel affirmé au passé, alors que le participe grec maintient la formule accusatrice abrupte. « Mais, rusé, je vous ai eus par la ruse » est plus direct, moderne et conserve la tension rhétorique. La répétition de « ruse » est acceptable ici, car elle reflète les deux termes grecs distincts πανοῦργος et δόλῳ.
  terminology: « Être à charge » convient au contexte matériel sans le restreindre indûment. « Rusé » conserve la connotation négative de πανοῦργος, et « par la ruse » rend naturellement le datif instrumental δόλῳ. La note sur l’ironie est nécessaire et adéquate.
