  text: ἔστω δέ, ἐγὼ οὐ κατεβάρησα ὑμᾶς· ἀλλὰ ὑπάρχων πανοῦργος δόλῳ ὑμᾶς ἔλαβον.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/016.yaml
  text: 'But let it be so: I did not burden you[a]. Yet, being crafty[c][b], I took you by deceit.'
translation:
  language: fr
  text: Soit, je ne vous ai pas été à charge[a]. Mais, rusé, je vous ai eus par la ruse[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Admettons » ou « Quoi qu’il en soit » ; Paul semble concéder ce point pour les besoins de son argumentation.
    reason: lexical_alternative
  - marker: b
    text: Les mots « rusé, je vous ai eus par la ruse » reprennent probablement avec ironie une accusation portée contre Paul ; ils ne constituent vraisemblablement pas un aveu.
    reason: alternative_reading
  - marker: c
    text: Ou « je vous ai piégés par la ruse » ou « j’ai profité de vous par tromperie ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔστω δέ
  choice: Soit
  rationale: Cette formule concessive naturelle introduit un point admis pour les besoins de l’argumentation, sans expliciter davantage la stratégie rhétorique.
- source_word: κατεβάρησα
  choice: je ne vous ai pas été à charge
  rationale: Dans ce contexte, le verbe évoque surtout une charge matérielle ou financière. Cette tournure française courante conserve cette portée sans la limiter explicitement à l’argent.
- source_word: ὑπάρχων
  choice: comme je l’étais
  rationale: La tournure accompagne « rusé » sans imposer au participe une valeur causale ou concessive que le grec ne précise pas.
- source_word: πανοῦργος
  choice: rusé
  rationale: Le mot désigne ici une habileté retorse et porte la nuance négative de l’accusation rapportée.
- source_word: δόλῳ
  choice: par tromperie
  rationale: Le datif exprime le moyen; « par tromperie » rend directement la manière frauduleuse alléguée.
- source_word: ἔλαβον
  choice: je vous ai pris
  rationale: Cette traduction proche du sens fondamental de λαμβάνω préserve l’ambiguïté entre prendre, piéger et tirer profit de quelqu’un; le complément « par tromperie » fait entendre la portée hostile de l’accusation.
theological_decisions:
- issue: Les mots qui suivent ἀλλά constituent-ils un aveu de Paul ou la reprise ironique d’une accusation portée contre lui?
  choice: Conserver dans le texte la formulation directe de l’accusation, sans ajouter de marque explicite de citation ou d’ironie.
  alternative: Expliciter dans le texte que Paul reprend ironiquement les propos de ses accusateurs.
  rationale: Le contexte plus large montre que Paul nie avoir exploité les Corinthiens, mais la syntaxe du verset présente directement l’accusation. La traduction maintient donc cette tension, tandis qu’une note signale sa probable valeur ironique.
translation_notes:
  register: Français international moderne, sobre et digne. « Être à charge » est idiomatique et convient au contexte financier. La seconde phrase reste volontairement abrupte afin de préserver l’ironie et la tension de l’original.
