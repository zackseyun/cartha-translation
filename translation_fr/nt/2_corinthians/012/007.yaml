source:
  edition: SBLGNT
  text: καὶ τῇ ὑπερβολῇ τῶν ἀποκαλύψεων. ⸀διὸ ἵνα μὴ ὑπεραίρωμαι, ἐδόθη μοι σκόλοψ τῇ σαρκί, ἄγγελος ⸀Σατανᾶ, ἵνα με κολαφίζῃ, ⸂ἵνα μὴ ὑπεραίρωμαι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/007.yaml
  text: And because of the surpassing greatness of the revelations—so that I might not exalt myself—a thorn in the flesh was given to me[a], a messenger of Satan, so that it might torment me[e][d][c][b], so that I might not exalt myself.
translation:
  language: fr
  text: 'Et, à cause de la grandeur exceptionnelle des révélations — afin que je ne m’enorgueillisse pas —, une écharde dans la chair[a] m’a été donnée : un messager de Satan[b], pour qu’il me frappe[c], afin que je ne m’enorgueillisse pas.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une épine dans la chair » ou « un pieu dans la chair ». Le mot grec peut désigner divers objets pointus ; l’image exacte reste incertaine.
    reason: lexical_alternative
  - marker: b
    text: Ou « un ange de Satan ». Le mot grec peut signifier « messager » ou « ange ».
    reason: alternative_reading
  - marker: c
    text: Ou « pour qu’il me tourmente ». Le verbe grec évoque littéralement le fait de frapper à coups de poing ou de porter des coups répétés.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπερβολῇ τῶν ἀποκαλύψεων
  choice: la grandeur exceptionnelle des révélations
  rationale: Cette formulation exprime l’ampleur hors du commun des révélations tout en restant naturelle en français moderne.
- source_word: ὑπεραίρωμαι
  choice: je ne m’enorgueillisse pas
  rationale: Le verbe désigne ici le fait de s’élever ou de devenir orgueilleux. « M’enorgueillisse » rend naturellement cette valeur réflexive et est répété aux deux endroits comme dans le grec.
- source_word: ἐδόθη μοι
  choice: il m’a été donné
  rationale: Le passif conserve la formulation grecque sans identifier explicitement celui qui donne ou permet l’affliction.
- source_word: σκόλοψ τῇ σαρκί
  choice: une écharde dans la chair
  rationale: « Écharde » maintient l’image d’un objet pointu causant une souffrance sans définir la nature exacte de l’affliction; « dans la chair » conserve la formulation concrète du grec.
- source_word: ἄγγελος Σατανᾶ
  choice: un messager de Satan
  rationale: « Messager » garde ouverte la question de savoir s’il s’agit d’un ange, d’un autre être spirituel ou d’un agent, tandis que le complément « de Satan » demeure explicite.
- source_word: κολαφίζῃ
  choice: pour qu’il me frappe
  rationale: Le verbe évoque littéralement des coups répétés. « Frappe » préserve cette image plus directement que le terme interprétatif « tourmente ».
theological_decisions:
- issue: Nature de l’« écharde dans la chair »
  choice: Conserver la métaphore sans préciser la nature de l’affliction.
  alternative: Une maladie physique, des persécuteurs ou une oppression démoniaque.
  rationale: Le texte grec ne permet pas de déterminer précisément ce que désigne l’écharde.
- issue: Agent implicite de « il m’a été donné »
  choice: Maintenir le passif sans nommer celui qui donne.
  alternative: « Dieu m’a donné » ou « cela a été permis ».
  rationale: Le passage peut suggérer une permission divine, mais il ne nomme pas explicitement l’agent; le passif préserve la tension entre cette permission et l’action attribuée à Satan.
- issue: Identité du « messager de Satan »
  choice: Employer le terme large « messager ».
  alternative: « Un ange de Satan ».
  rationale: ἄγγελος peut désigner un messager ou un ange; la traduction ne tranche donc pas son identité ontologique.
translation_notes:
  register: Français international moderne, digne et accessible. Les tirets isolent la première proposition de but afin de rendre lisible la construction inhabituelle du grec. La répétition finale de « afin que je ne m’enorgueillisse pas » est volontairement conservée.
