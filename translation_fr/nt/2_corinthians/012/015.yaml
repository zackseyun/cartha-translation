source:
  edition: SBLGNT
  text: ἐγὼ δὲ ἥδιστα δαπανήσω καὶ ἐκδαπανηθήσομαι ὑπὲρ τῶν ψυχῶν ὑμῶν. ⸀εἰ περισσοτέρως ὑμᾶς ⸀ἀγαπῶν, ἧσσον ἀγαπῶμαι;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/015.yaml
  text: But I will most gladly spend and be spent for your souls. If I love you more abundantly[a], am I loved less?
translation:
  language: fr
  text: Pour ma part, je dépenserai très volontiers, et je me dépenserai moi-même pour vos âmes[a]. Si je vous aime davantage, suis-je moins aimé ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec peut aussi désigner vos vies ou vous-mêmes.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἥδιστα
  choice: très volontiers
  rationale: Le superlatif grec exprime un empressement chaleureux. « Très volontiers » rend naturellement cette intensité en français moderne.
- source_word: δαπανήσω
  choice: je dépenserai
  rationale: Le verbe garde l’image de la dépense, qui prépare le verbe intensif suivant. L’emploi absolu, quoique marqué, permet de ne pas ajouter un complément absent du grec.
- source_word: ἐκδαπανηθήσομαι
  choice: je me dépenserai moi-même
  rationale: 'Cette formulation française naturelle conserve l’intensification : Paul ne donnera pas seulement ses ressources, mais sa propre personne. Le tour réfléchi rend idiomatiquement le passif grec sans effacer la métaphore.'
- source_word: ὑπὲρ
  choice: pour
  rationale: Dans ce contexte, la préposition indique le bénéficiaire du sacrifice de Paul. « Pour » est à la fois exact et naturel.
- source_word: τῶν ψυχῶν ὑμῶν
  choice: pour vous[a]
  rationale: Ici, ψυχή peut désigner la vie, la personne elle-même ou l’âme. « Pour vous » exprime naturellement en français le dévouement pastoral envers les personnes entières, tandis que la note conserve l’étendue lexicale du grec.
- source_word: εἰ
  choice: Si
  rationale: « Si » maintient la forme conditionnelle de la question rhétorique sans la résoudre en une affirmation causale.
- source_word: περισσοτέρως
  choice: davantage
  rationale: « Davantage » exprime clairement le degré comparatif renforcé et s’oppose naturellement à « moins ».
- source_word: ἀγαπῶν
  choice: je vous aime
  rationale: Le participe grec est rendu par une proposition verbale, conformément à l’usage naturel du français dans cette question conditionnelle.
- source_word: ἧσσον
  choice: moins
  rationale: Ce comparatif bref et naturel maintient le contraste direct avec περισσοτέρως.
- source_word: ἀγαπῶμαι
  choice: serai-je moins aimé
  rationale: Le passif est conservé. En français, le futur s’accorde naturellement avec la formulation conditionnelle et la perspective de la proposition principale, bien que le grec emploie formellement le présent.
theological_decisions:
- issue: Portée de ψυχή dans ce contexte pastoral
  choice: vous, avec une note indiquant « vos âmes », « vos vies » ou « vous-mêmes »
  alternative: vos âmes
  rationale: « Vos âmes » pourrait suggérer en français moderne une opposition technique entre l’âme et le corps que le contexte n’impose pas. Le texte principal vise donc les personnes dans leur totalité, tandis que la note préserve l’ambiguïté lexicale et la formulation plus littérale.
- issue: Temps de ἀγαπῶμαι dans la question rhétorique
  choice: serai-je moins aimé ?
  alternative: suis-je moins aimé ?
  rationale: Le grec présente un passif au présent, mais après « si je vous aime davantage », le futur français formule plus naturellement la conséquence paradoxale envisagée. Cette adaptation ne tranche pas la tension théologique ou relationnelle du propos.
translation_notes:
  register: 'Français international moderne, digne et direct. La répétition « dépenserai / me dépenserai » est volontaire : elle conserve le jeu verbal et l’image sacrificielle du grec. La question finale reste rhétorique et conserve le passif, sans préciser qui aime Paul en retour.'
