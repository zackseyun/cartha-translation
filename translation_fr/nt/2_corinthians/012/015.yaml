  naturalness: « Je dépenserai très volontiers et je me dépenserai moi-même » est une formulation recevable, solennelle et intelligible dans un registre biblique moderne. La question « Si je vous aime davantage, suis-je moins aimé ? » est naturelle et conserve la vigueur rhétorique de l’original.
  terminology: « Vos âmes » correspond au lexique explicite de ψυχαί sans imposer une anthropologie technique. La note indique les sens contextuellement possibles (« vies », « vous-mêmes »). « Davantage » / « moins » maintient le contraste comparatif, et « aimé » conserve le passif sans identifier les personnes qui aiment ou non Paul.
