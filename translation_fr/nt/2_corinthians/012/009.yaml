id: 2CO.12.9
reference: 2 Corinthians 12:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ εἴρηκέν μοι· Ἀρκεῖ σοι ἡ χάρις μου· ἡ γὰρ ⸀δύναμις ἐν ἀσθενείᾳ ⸀τελεῖται. ἥδιστα οὖν μᾶλλον καυχήσομαι ἐν ταῖς ἀσθενείαις ⸀μου, ἵνα ἐπισκηνώσῃ ἐπ’ ἐμὲ ἡ δύναμις τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/009.yaml
  text: And he has said to me[a], “My grace is sufficient for you, for my power is made perfect in weakness.” Therefore I will boast all the more gladly in my weaknesses[d][c][b], so that the power of Messiah may dwell upon me.
translation:
  language: fr
  text: 'Et il m’a dit : « Ma grâce te suffit, car la puissance[a] atteint son plein accomplissement dans la faiblesse[b]. » Je me glorifierai donc bien plus volontiers de mes faiblesses, afin que la puissance du Messie[c] demeure sur moi[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « ma puissance ». Le texte grec retenu ici dit littéralement « la puissance », sans possessif explicite.'
    reason: textual_or_contextual_alternative
  - marker: b
    text: 'Ou : « devient parfaite dans la faiblesse »; autre formulation possible : « se manifeste pleinement dans la faiblesse ».'
    reason: lexical_alternative
  - marker: c
    text: 'Traduit traditionnellement : « du Christ ».'
    reason: alternative_reading
  - marker: d
    text: 'Ou : « repose sur moi »; plus littéralement, le verbe évoque le fait de dresser sa tente sur quelqu’un.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴρηκέν
  choice: il m’a dit
  rationale: Le parfait grec renvoie à une parole prononcée dont la portée demeure; le passé composé français l’exprime naturellement dans ce contexte.
- source_word: Ἀρκεῖ σοι ἡ χάρις μου
  choice: Ma grâce te suffit
  rationale: Formulation française directe et digne, qui conserve χάρις par « grâce » et rend exactement l’idée d’une grâce pleinement suffisante.
- source_word: ἡ δύναμις
  choice: la puissance
  rationale: Le texte grec fourni ne porte pas de possessif avec δύναμις; l’article défini préserve cette formulation sans ajouter « ma », tout en laissant le contexte relier cette puissance au Seigneur.
- source_word: τελεῖται
  choice: atteint son plein accomplissement
  rationale: Cette expression rend la valeur télique de τελέω — parvenir à son accomplissement ou à sa pleine expression — sans suggérer que la puissance divine aurait auparavant été moralement imparfaite.
- source_word: ἀσθενείᾳ / ἀσθενείαις
  choice: faiblesse / faiblesses
  rationale: Le singulier énonce le principe général, tandis que le pluriel désigne les faiblesses concrètes de Paul; la répétition lexicale et le changement de nombre sont conservés.
- source_word: ἥδιστα οὖν μᾶλλον
  choice: donc d’autant plus volontiers
  rationale: Cette tournure idiomatique française réunit l’intensification et la comparaison portées par ἥδιστα et μᾶλλον, sans lourdeur.
- source_word: καυχήσομαι
  choice: je me glorifierai
  rationale: « Se glorifier » est naturel dans le registre paulinien et conserve le paradoxe rhétorique d’une fierté placée dans les faiblesses.
- source_word: ἐπισκηνώσῃ ἐπ’ ἐμέ
  choice: demeure sur moi
  rationale: La formulation reste lisible tout en conservant l’idée d’une présence venant s’établir sur Paul; l’image plus littérale de la tente est signalée en note.
- source_word: Χριστοῦ
  choice: du Messie
  rationale: Χριστός est ici compris comme un titre; « le Messie » en restitue explicitement la valeur, sans imposer la forme devenue nom propre « Christ ».
theological_decisions:
- issue: Présence ou absence d’un possessif avec δύναμις
  choice: « la puissance » dans le texte principal
  alternative: « ma puissance »
  rationale: Le texte SBLGNT fourni lit ἡ δύναμις sans μου. Le contexte permet de comprendre qu’il s’agit de la puissance du Seigneur, mais la traduction principale n’ajoute pas le possessif et la note indique l’autre formulation.
- issue: Sens de τελεῖται appliqué à la puissance divine
  choice: « atteint son plein accomplissement »
  alternative: « devient parfaite » ou « se manifeste pleinement »
  rationale: Le choix principal préserve la tension de l’énoncé grec et son orientation vers l’accomplissement, sans expliquer théologiquement de quelle manière la puissance est « parfaite » dans la faiblesse.
- issue: Valeur de Χριστοῦ
  choice: « du Messie »
  alternative: « du Christ »
  rationale: La traduction retient la valeur titulaire de Χριστός; la forme traditionnelle française demeure possible et est donnée en note.
- issue: Image de ἐπισκηνόω
  choice: « demeure sur moi »
  alternative: « repose sur moi » ou, plus littéralement, « dresse sa tente sur moi »
  rationale: Le texte principal privilégie une expression compréhensible sans effacer la dimension spatiale « sur moi »; la note conserve l’image rare de la tente et l’autre rendu courant.
translation_notes:
  register: Français international moderne, courant mais digne. La phrase garde le paradoxe paulinien entre puissance et faiblesse. « Atteint son plein accomplissement » est légèrement soutenu, mais reste intelligible et rend mieux la force de τελεῖται qu’une paraphrase explicative. Les notes signalent les formulations traditionnelles et les ambiguïtés réelles sans les imposer au texte principal.
