  text: μή τινα ὧν ἀπέσταλκα πρὸς ὑμᾶς, δι’ αὐτοῦ ἐπλεονέκτησα ὑμᾶς;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/017.yaml
  text: Did I exploit you through any of those whom I sent to you?[a]
translation:
  language: fr
  text: Ai-je profité de vous par l’intermédiaire de l’un de ceux que je vous ai envoyés ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vous ai-je exploités » ou « vous ai-je escroqués ». Le verbe grec évoque le fait de tirer profit de quelqu’un à ses dépens.
    reason: lexical_alternative
lexical_decisions:
- source_word: μή
  choice: Ai-je… ?
  rationale: La particule introduit une question rhétorique qui attend une réponse négative. En français naturel, le contexte et la forme interrogative rendent cette attente suffisamment perceptible sans ajouter « ne… pas ».
- source_word: τινα ὧν
  choice: l’un de ceux que
  rationale: Cette formulation exprime naturellement en français qu’il s’agit de n’importe quel membre du groupe des personnes envoyées.
- source_word: ἀπέσταλκα
  choice: je vous ai envoyés
  rationale: Le passé composé rend ici naturellement le parfait grec et désigne les personnes que Paul a dépêchées auprès des Corinthiens.
- source_word: πρὸς ὑμᾶς
  choice: vous ai envoyés
  rationale: Le pronom « vous » intégré à la construction avec « envoyer » exprime idiomatiquement la destination auprès des destinataires.
- source_word: δι’ αὐτοῦ
  choice: par l’intermédiaire de l’un de ceux
  rationale: Le grec emploie littéralement le singulier « par son intermédiaire », avec une valeur distributive renvoyant à toute personne éventuelle du groupe. La formulation française explicite ce lien sans ambiguïté artificielle.
- source_word: ἐπλεονέκτησα
  choice: profité de vous
  rationale: Dans ce contexte, le verbe désigne le fait de tirer un avantage aux dépens d’autrui. « Profiter de vous » est actuel, clair et conserve la dimension relationnelle ou financière sans la restreindre à une fraude juridiquement définie.
- source_word: ὑμᾶς
  choice: vous
  rationale: Le pronom désigne collectivement les croyants de Corinthe comme personnes potentiellement lésées.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La question rhétorique reste directe; la tournure « par l’intermédiaire de » préserve l’idée d’une action accomplie au moyen d’un envoyé.
