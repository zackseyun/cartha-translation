  text: ἐὰν γὰρ θελήσω καυχήσασθαι, οὐκ ἔσομαι ἄφρων, ἀλήθειαν γὰρ ἐρῶ· φείδομαι δέ, μή τις εἰς ἐμὲ λογίσηται ὑπὲρ ὃ βλέπει με ἢ ἀκούει ⸀τι ἐξ ἐμοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/006.yaml
  text: For if I should want to boast[a], I would not be foolish, for I would be speaking the truth. But I refrain, so that no one may reckon me above what he sees in me or hears from me.
translation:
  language: fr
  text: En effet, si je voulais me vanter, je ne serais pas insensé, car je dirais la vérité. Mais je m’en abstiens, afin que personne ne se fasse de moi une idée qui dépasse ce qu’il voit en moi ou entend de ma part[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « entend quelque chose de ma part ».'
    reason: Le grec comporte explicitement l’indéfini τι (« quelque chose »), qui peut rester implicite dans une formulation française idiomatique.
lexical_decisions:
- source_word: θελήσω καυχήσασθαι
  choice: si je voulais me vanter
  rationale: La construction ἐὰν avec le subjonctif aoriste présente une éventualité hypothétique. « Si je voulais » l’exprime naturellement en français, tandis que « me vanter » rend le sens contextuel et légèrement ironique de καυχάομαι.
- source_word: οὐκ ἔσομαι ἄφρων
  choice: je ne serais pas déraisonnable
  rationale: Dans cette hypothèse, le conditionnel français est naturel. « Déraisonnable » conserve la valeur adjectivale de ἄφρων et évite ici la formulation plus dure « je ne serais pas fou », tout en maintenant le lien avec le thème paulinien de la folie.
- source_word: ἀλήθειαν γὰρ ἐρῶ
  choice: car je dirais la vérité
  rationale: Le conditionnel inscrit le futur grec ἐρῶ dans l’éventualité introduite par ἐὰν et rend clairement l’affirmation selon laquelle le contenu de cette vantardise serait vrai.
- source_word: φείδομαι δέ
  choice: Mais je m’en abstiens
  rationale: Le verbe exprime ici le fait de se retenir de poursuivre cette vantardise. Le pronom « en » renvoie naturellement à l’action précédente.
- source_word: μή τις εἰς ἐμὲ λογίσηται ὑπὲρ ὃ
  choice: afin que personne ne se fasse de moi une idée qui dépasse ce que
  rationale: Cette formulation idiomatique conserve la dimension évaluative de λογίζομαι et l’idée de dépassement exprimée par ὑπέρ, sans réduire le sens à une simple pensée passagère.
- source_word: βλέπει με
  choice: il voit en moi
  rationale: La formulation française exprime que l’évaluation de Paul doit reposer sur ce qui est effectivement observable en lui.
- source_word: ἀκούει τι ἐξ ἐμοῦ
  choice: entend de ma part
  rationale: Cette tournure naturelle rend la provenance marquée par ἐξ ἐμοῦ. L’élément indéfini τι reste implicite dans le texte principal, comme cela est possible en français, et sa présence explicite est signalée en note.
theological_decisions:
- issue: La vantardise véridique de Paul et son refus de s’y livrer
  choice: Présenter comme hypothétique une vantardise qui ne serait pas déraisonnable parce qu’elle serait véridique, tout en maintenant le refus effectif de Paul.
  alternative: Faire dire à Paul que se vanter est en soi légitime, ou au contraire que toute vantardise serait nécessairement mensongère ou coupable.
  rationale: Le grec maintient une tension entre la vérité de ce que Paul pourrait dire et sa décision de s’abstenir afin de ne pas susciter une estime excessive. La traduction ne transforme pas cette affirmation contextuelle en principe doctrinal général.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la progression argumentative de Paul et son contraste entre une affirmation hypothétiquement vraie et sa retenue effective. « Dénraisonnable » n’est pas utilisé ; la forme correcte retenue est « déraisonnable ».
