  text: Γέγονα ⸀ἄφρων· ὑμεῖς με ἠναγκάσατε· ἐγὼ γὰρ ὤφειλον ὑφ’ ὑμῶν συνίστασθαι. οὐδὲν γὰρ ὑστέρησα τῶν ὑπερλίαν ἀποστόλων, εἰ καὶ οὐδέν εἰμι·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/011.yaml
  text: I have become a fool; you forced me to it. For I ought to have been commended by you[a], for I fell short in nothing compared with those super-apostles, even if I am nothing.
translation:
  language: fr
  text: Je suis devenu fou ; c’est vous qui m’y avez contraint. En effet, c’est vous qui auriez dû me recommander. Car je n’ai en rien été inférieur à ces super-apôtres[a], même si je ne suis rien.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « aux apôtres les plus éminents ». L’expression grecque est fortement emphatique et peut être ironique dans ce contexte.'
    reason: alternative_reading
lexical_decisions:
- source_word: Γέγονα
  choice: Je suis devenu
  rationale: Le parfait grec exprime un état présent résultant de ce qui précède ; le passé composé français rend naturellement cette nuance.
- source_word: ἄφρων
  choice: fou
  rationale: L’adjectif substantivé décrit ici, avec ironie, celui qui se livre à une vantardise insensée ; « fou » est direct et naturel.
- source_word: ὑμεῖς με ἠναγκάσατε
  choice: c’est vous qui m’y avez contraint
  rationale: La tournure clivée maintient l’insistance portée par ὑμεῖς ; « y » renvoie sans lourdeur à cette conduite de fou dans le contexte.
- source_word: ὑφ’ ὑμῶν συνίστασθαι
  choice: être recommandé par vous
  rationale: Dans ce contexte, συνίστημι désigne le fait de présenter quelqu’un favorablement ou de se porter garant de lui. « Recommandé » conserve cette idée sans supposer une louange générale.
- source_word: οὐδὲν ... ὑστέρησα
  choice: je n’ai été inférieur en rien
  rationale: La formulation rend explicitement la comparaison implicite dans ὑστερέω et s’accorde naturellement en français avec le complément introduit par « à ».
- source_word: τῶν ὑπερλίαν ἀποστόλων
  choice: ces « super-apôtres »
  rationale: Le néologisme garde l’intensité exceptionnelle de ὑπερλίαν ainsi que la possible pointe ironique ou polémique, sans identifier davantage les personnes visées.
- source_word: εἰ καὶ οὐδέν εἰμι
  choice: même si je ne suis rien
  rationale: Cette formulation préserve la concession et la tension entre l’affirmation apostolique de Paul et son abaissement personnel.
theological_decisions:
- issue: Portée de τῶν ὑπερλίαν ἀποστόλων
  choice: « ces “super-apôtres” » dans le texte, avec une note signalant l’autre compréhension possible
  alternative: « les apôtres les plus éminents »
  rationale: Dans le contexte de 2 Corinthiens, l’expression paraît probablement ironique et polémique, mais sa forme grecque peut aussi se comprendre comme un superlatif visant des apôtres de tout premier rang. Le texte et la note maintiennent cette ambiguïté.
- issue: Rapport entre la supériorité revendiquée et « je ne suis rien »
  choice: Conserver littéralement « même si je ne suis rien »
  alternative: Reformuler comme une simple marque d’humilité, par exemple « bien que je n’aie aucune importance par moi-même »
  rationale: La formulation abrupte de Paul crée une tension rhétorique et théologique que la traduction ne doit pas atténuer ni expliquer à sa place.
translation_notes:
  register: Français international moderne, digne et oralement fluide. La tournure « c’est vous qui » restitue l’emphase grecque. Les guillemets autour de « super-apôtres » signalent le caractère rhétorique inhabituel du terme sans ajouter « soi-disant », qui rendrait l’ironie certaine.
