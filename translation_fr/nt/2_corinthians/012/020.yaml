  to: Car je crains qu’à mon arrivée, je ne vous trouve pas tels que je le souhaite, et que vous ne me trouviez pas tel que vous le souhaitez. Je crains qu’il n’y ait des querelles, de la jalousie, des accès de colère, des rivalités égoïstes, des médisances, des chuchotements[a], de l’orgueil et des désordres.
