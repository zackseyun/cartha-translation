reference: 2 Corinthians 12:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: φοβοῦμαι γὰρ μή πως ἐλθὼν οὐχ οἵους θέλω εὕρω ὑμᾶς, κἀγὼ εὑρεθῶ ὑμῖν οἷον οὐ θέλετε, μή πως ⸀ἔρις, ⸀ζῆλος, θυμοί, ἐριθεῖαι, καταλαλιαί, ψιθυρισμοί, φυσιώσεις, ἀκαταστασίαι·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/020.yaml
  text: For I fear that perhaps when I come I may find you not as I wish[a], and I may be found by you to be as you do not wish—that perhaps there may be strife, jealousy, outbursts of anger, selfish ambition, slanders, whisperings, conceit, and disorder.
translation:
  language: fr
  text: Car je crains qu’à mon arrivée, je ne vous trouve pas tels que je le souhaite, et que vous ne me trouviez pas tel que vous le souhaitez. Je crains qu’il n’y ait des querelles, de la jalousie, des accès de colère, des rivalités égoïstes, des médisances, des chuchotements[a], de l’orgueil et des désordres.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « commérages ».
    reason: Le grec ψιθυρισμοί désigne des propos chuchotés et peut, dans ce contexte, évoquer des commérages.
lexical_decisions:
- source_word: φοβοῦμαι
  choice: je crains
  rationale: Le présent exprime l’inquiétude actuelle et persistante de Paul; « je crains » est direct, naturel et digne.
- source_word: μή πως
  choice: je crains que… ne / je crains qu’il n’y ait
  rationale: La tournure française avec « craindre que » et le ne explétif rend naturellement la possibilité redoutée, exprimée deux fois dans le grec.
- source_word: ἐλθὼν
  choice: à mon arrivée
  rationale: Le participe aoriste a ici une valeur temporelle; cette formulation indique clairement le moment où Paul pourrait faire ce constat.
- source_word: οὐχ οἵους θέλω
  choice: pas tels que je le souhaite
  rationale: Le masculin pluriel renvoie à l’état ou au comportement des destinataires; « tels que » préserve cette construction sans la surinterpréter.
- source_word: εὕρω ὑμᾶς
  choice: je ne vous trouve
  rationale: Le subjonctif français après « je crains que » exprime convenablement l’éventualité redoutée.
- source_word: κἀγὼ εὑρεθῶ ὑμῖν
  choice: et que vous ne me trouviez pas
  rationale: La reformulation active est idiomatique en français et conserve la réciprocité voulue entre ce que Paul trouvera chez eux et ce qu’ils trouveront chez lui.
- source_word: οἷον οὐ θέλετε
  choice: tel que vous le souhaitez
  rationale: Avec la négation portée par « ne… pas », cette expression reproduit le parallélisme avec « tels que je le souhaite ».
- source_word: ἔρις
  choice: querelles
  rationale: Dans cette liste de vices communautaires, le pluriel français désigne clairement les conflits et dissensions concrètes.
- source_word: ζῆλος
  choice: jalousie
  rationale: Le contexte négatif commande le sens de jalousie plutôt que celui, parfois positif, de zèle.
- source_word: θυμοί
  choice: accès de colère
  rationale: Le pluriel grec évoque des manifestations répétées ou soudaines de colère, nuance bien rendue par « accès ».
- source_word: ἐριθεῖαι
  choice: rivalités égoïstes
  rationale: Le terme évoque la recherche partisane de son propre avantage; cette traduction garde à la fois la compétition et l’égoïsme.
- source_word: καταλαλιαί
  choice: médisances
  rationale: Le mot désigne des paroles prononcées contre autrui pour lui nuire; « médisances » est naturel et n’impose pas nécessairement l’idée juridique de calomnie.
- source_word: ψιθυρισμοί
  choice: murmures malveillants
  rationale: Le terme désigne des propos hostiles tenus à voix basse ou en secret; l’adjectif évite de confondre avec une simple plainte.
- source_word: φυσιώσεις
  choice: orgueil
  rationale: L’image littérale de l’enflure désigne la suffisance ou l’arrogance; « orgueil » est clair et courant, tout en gardant la portée morale.
- source_word: ἀκαταστασίαι
  choice: désordres
  rationale: Le pluriel peut désigner des situations d’agitation, de confusion ou d’instabilité; « désordres » préserve cette largeur de sens.
theological_decisions:
- issue: Tonalité de la rencontre redoutée par Paul
  choice: Conserver la crainte d’une déception réciproque et énumérer les fautes communautaires sans préciser la réaction de Paul.
  alternative: Expliciter que Paul craint de devoir exercer une autorité apostolique sévère, ou attribuer ces fautes à de faux enseignants.
  rationale: Le verset présente une insatisfaction réciproque et une liste de vices, mais n’énonce pas lui-même la cause doctrinale ni la forme exacte de l’intervention éventuelle de Paul.
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme réciproque est maintenu, tandis que les deux occurrences de μή πως sont rendues par la reprise de « je crains », plus fluide qu’une longue phrase coordonnée. Le ne employé après « craindre que » est explétif dans sa structure, mais la négation réelle de « pas tels » demeure explicite.
