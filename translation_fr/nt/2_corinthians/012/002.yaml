reference: 2 Corinthians 12:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οἶδα ἄνθρωπον ἐν Χριστῷ πρὸ ἐτῶν δεκατεσσάρων— εἴτε ἐν σώματι οὐκ οἶδα, εἴτε ἐκτὸς τοῦ σώματος οὐκ οἶδα, ὁ θεὸς οἶδεν— ἁρπαγέντα τὸν τοιοῦτον ἕως τρίτου οὐρανοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/002.yaml
  text: I know a man in Messiah who[a], fourteen years ago—whether in the body I do not know, or outside the body I do not know[c][b], God knows—was caught up to the third heaven.
translation:
  language: fr
  text: Je connais un homme dans le Messie[a] qui, il y a quatorze ans — si c’était dans son corps, je ne sais pas ; si c’était hors de son corps, je ne sais pas, Dieu le sait —, a été enlevé jusqu’au troisième ciel[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, selon la formulation traditionnelle : « dans le Christ ». Le grec est ἐν Χριστῷ ; « Messie » rend ici la valeur de titre.'
    reason: alternative_reading
  - marker: c
    text: « Le troisième ciel » relève du langage cosmologique juif ancien. L’expression est conservée plutôt que remplacée par une interprétation comme « le ciel le plus élevé » ou « le paradis ».
    reason: cultural_note
lexical_decisions:
- source_word: οἶδα
  choice: Je connais
  rationale: Le parfait οἶδα a ici un sens présent ; « je connais » est l’équivalent français naturel devant une personne.
- source_word: ἄνθρωπον
  choice: un homme
  rationale: Le nom masculin singulier désigne ici un homme précis ; le contexte indique que Paul parle indirectement de lui-même.
- source_word: ἐν Χριστῷ
  choice: dans le Messie
  rationale: Cette formulation conserve à la fois la valeur titulaire de Χριστός et l’expression paulinienne d’appartenance ou d’union, sans la développer en paraphrase.
- source_word: πρὸ ἐτῶν δεκατεσσάρων
  choice: il y a quatorze ans
  rationale: Expression temporelle idiomatique en français correspondant à πρό suivi du génitif de temps.
- source_word: εἴτε ἐν σώματι … εἴτε ἐκτὸς τοῦ σώματος
  choice: était-ce dans son corps ? … était-ce hors de son corps ?
  rationale: La reprise interrogative rend naturellement en français les deux possibilités opposées tout en maintenant l’incertitude répétée de Paul.
- source_word: ὁ θεὸς οἶδεν
  choice: Dieu le sait
  rationale: Traduction directe ; « le » reprend la question du mode de l’expérience sans ajouter l’idée non explicite que Dieu seul le sait.
- source_word: ἁρπαγέντα
  choice: a été enlevé
  rationale: Le passif exprime un transport subi, soudain, sans identifier explicitement l’agent ; une forme verbale finie donne une phrase française fluide.
- source_word: ἕως τρίτου οὐρανοῦ
  choice: jusqu’au troisième ciel
  rationale: « Jusqu’à » reflète directement ἕως et conserve l’expression cosmologique du texte sans l’interpréter.
theological_decisions:
- issue: Valeur de Χριστῷ dans ἐν Χριστῷ
  choice: dans le Messie
  alternative: dans le Christ
  rationale: La traduction retient la valeur de titre de Χριστός tout en signalant en note la formulation française traditionnelle.
- issue: Nature corporelle ou non corporelle de l’expérience
  choice: Conserver les deux possibilités et la double déclaration d’ignorance
  alternative: Interpréter l’événement comme une ascension corporelle ou comme une vision hors du corps
  rationale: Le grec refuse explicitement de trancher et répète οὐκ οἶδα ; la traduction préserve cette tension.
- issue: Sens du « troisième ciel »
  choice: Conserver l’expression telle quelle
  alternative: La remplacer dans le texte par « le ciel le plus élevé » ou « le paradis »
  rationale: L’expression appartient au langage cosmologique ancien et ne doit pas être silencieusement expliquée ou harmonisée.
translation_notes:
  register: Français international moderne, digne et accessible. La ponctuation transforme les propositions alternatives en questions naturelles en français, tout en maintenant la répétition et l’incertitude du grec. « Dans le Messie » est volontairement plus marqué que l’usage ecclésial traditionnel, afin de préserver le titre.
