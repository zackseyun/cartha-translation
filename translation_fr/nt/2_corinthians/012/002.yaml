  to: Je connais un homme dans le Messie[a] qui, il y a quatorze ans — si c’était dans son corps, je ne sais pas ; si c’était hors de son corps, je ne sais pas, Dieu le sait —, a été enlevé jusqu’au troisième ciel[c].
  rationale: La révision remplace les questions directes par la formulation alternative indirecte portée par εἴτε, tout en gardant la double confession d’ignorance et la réserve finale « Dieu le sait ». La note b est ajustée pour reprendre les termes du texte sans qualifier l’intention de l’auteur. Le marqueur b demeure une note de passage contextuelle mais n’est pas appelé dans le texte, car il porte sur l’ensemble de l’alternative ; pour une cohérence structurelle stricte des appels de note, il devrait être ajouté après « Dieu le sait » si le format exige que chaque note soit ancrée.
