    issue: Les deux εἴτε sont rendus par des questions directes.
    rationale: Le grec formule deux possibilités dont Paul dit ignorer laquelle s’applique ; « si c’était… je ne sais pas » reflète plus directement cette dépendance et la répétition de οὐκ οἶδα.
