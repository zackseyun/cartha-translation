source:
  edition: SBLGNT
  text: ὑπὲρ τοῦ τοιούτου καυχήσομαι, ὑπὲρ δὲ ἐμαυτοῦ οὐ καυχήσομαι εἰ μὴ ἐν ταῖς ⸀ἀσθενείαις.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/005.yaml
  text: On behalf of such a one I will boast[a], but on behalf of myself I will not boast[b], except in my weaknesses.
translation:
  language: fr
  text: C’est au sujet d’une telle personne que je me vanterai[a] ; mais, à mon propre sujet, je ne me vanterai pas, sinon de mes faiblesses[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour une telle personne » ou « au sujet d’une telle personne ». La préposition grecque peut avoir un sens plus général de référence ; la formulation conserve la désignation indirecte et la mise à distance rhétorique de Paul.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « dans les faiblesses ». Le mot grec peut désigner la fragilité humaine, les souffrances ou des situations dans lesquelles la puissance de Dieu se manifeste.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπὲρ τοῦ τοιούτου
  choice: pour un tel homme
  rationale: Avec le génitif, ὑπέρ indique ici la personne au sujet de laquelle ou en faveur de laquelle Paul se vante. « Pour » conserve la formulation relationnelle et la mise à distance rhétorique. « Un tel homme » est naturel en français et renvoie, dans le contexte, à la personne évoquée sans trancher la question autobiographique.
- source_word: καυχήσομαι
  choice: je me vanterai
  rationale: « Se vanter » rend clairement le verbe καυχάομαι et maintient son vocabulaire récurrent dans ce passage.
- source_word: ἐμαυτοῦ
  choice: pour moi-même
  rationale: Le pronom réfléchi établit un contraste marqué entre la personne ainsi mise à distance et Paul considéré directement.
- source_word: εἰ μὴ
  choice: sinon
  rationale: La locution introduit ici une exception, et non une condition. « Sinon » exprime cette exception de manière naturelle et digne.
- source_word: ἐν ταῖς ἀσθενείαις
  choice: de mes faiblesses
  rationale: Après « se vanter », le français idiomatique emploie « de ». Le possessif, implicite dans le contraste contextuel, indique qu’il s’agit des faiblesses de Paul. « Faiblesses » peut couvrir fragilité, souffrance et incapacité sans réduire d’avance la portée du terme.
theological_decisions:
- issue: Nature de la vantardise admise par Paul
  choice: Paul met en contraste le fait de se vanter pour la personne associée à l’expérience extraordinaire et celui de se vanter pour lui-même, qu’il limite à ses faiblesses.
  alternative: La personne évoquée pourrait être comprise comme littéralement distincte de Paul, ou la phrase comme l’énoncé général d’un principe de valorisation de la faiblesse.
  rationale: La formulation maintient la mise à distance rhétorique et le paradoxe de la faiblesse, sans décider explicitement si la personne de l’expérience est Paul lui-même.
translation_notes:
  register: Français international moderne, clair et soutenu sans archaïsme. La répétition de « je me vanterai » conserve l’insistance et le contraste de l’original. Le point-virgule rend l’opposition marquée par δέ.
