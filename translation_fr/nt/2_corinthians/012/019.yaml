source:
  edition: SBLGNT
  text: ⸀Πάλαι δοκεῖτε ὅτι ὑμῖν ἀπολογούμεθα; ⸀κατέναντι θεοῦ ἐν Χριστῷ λαλοῦμεν. τὰ δὲ πάντα, ἀγαπητοί, ὑπὲρ τῆς ὑμῶν οἰκοδομῆς,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/019.yaml
  text: Have you been thinking all along that we are defending ourselves to you? Before God[a], in Messiah, we are speaking. And everything, beloved[b], is for your building up.
translation:
  language: fr
  text: Pensez-vous depuis longtemps que nous nous défendons devant vous ? C’est devant Dieu, dans le Messie, que nous parlons. Et tout, bien-aimés, est destiné à vous faire grandir.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πάλαι
  choice: Depuis tout ce temps
  rationale: Dans cette question rhétorique, l’adverbe renvoie naturellement à une supposition entretenue jusqu’au moment présent, plutôt qu’à un passé lointain.
- source_word: δοκεῖτε
  choice: pensez-vous
  rationale: Le présent français convient à la question rhétorique et, avec « Depuis tout ce temps », exprime une supposition persistante.
- source_word: ἀπολογούμεθα
  choice: nous nous défendons
  rationale: Cette formulation courante conserve la nuance de défense ou de justification de soi portée par le verbe.
- source_word: ὑμῖν
  choice: devant vous
  rationale: Avec « nous nous défendons », cette formulation exprime que les Corinthiens seraient considérés comme ceux devant qui Paul présenterait sa défense.
- source_word: κατέναντι θεοῦ
  choice: devant Dieu
  rationale: La locution indique à la fois la présence de Dieu et la responsabilité du locuteur envers lui.
- source_word: ἐν Χριστῷ
  choice: dans le Messie
  rationale: « Messie » rend le titre Χριστός, tandis que « dans » conserve l’idée relationnelle et théologique de la formule paulinienne.
- source_word: λαλοῦμεν
  choice: nous parlons
  rationale: Le présent simple est naturel en français et conserve l’immédiateté du grec.
- source_word: τὰ δὲ πάντα
  choice: Et tout ce que nous faisons
  rationale: Dans ce contexte, l’expression englobe l’ensemble des paroles et des actes apostoliques évoqués. Cette explicitation évite que « toutes choses » soit compris comme une maxime universelle.
- source_word: ἀγαπητοί
  choice: bien-aimés
  rationale: Le vocatif affectueux est conservé dans un registre biblique digne mais encore intelligible.
- source_word: ὑπὲρ τῆς ὑμῶν οἰκοδομῆς
  choice: vise à vous faire grandir
  rationale: Cette formulation exprime clairement la croissance et l’affermissement communautaires visés par la métaphore de l’édification, sans recourir au terme ecclésiastique moins courant « édification ».
theological_decisions:
- issue: Traduction de Χριστῷ
  choice: le Messie
  alternative: Christ
  rationale: Dans cette formule, Χριστός garde sa valeur de titre. « Le Messie » rend ce sens explicitement, sans modifier l’idée paulinienne d’être et de parler « dans » celui-ci.
- issue: Portée de οἰκοδομή
  choice: croissance et affermissement de la communauté
  alternative: édification
  rationale: Le texte présente la finalité du ministère de Paul comme la construction métaphorique des destinataires. « Vous faire grandir » communique cette finalité sans la réduire à une doctrine particulière.
translation_notes:
  register: Français international moderne, naturel et digne. La question initiale reste directe et rhétorique. Les deux affirmations qui suivent sont séparées pour préserver leur force. « Dans le Messie » est volontairement plus marqué que « en Christ », afin de rendre le titre grec, tandis que « vous faire grandir » rend accessible la métaphore communautaire de l’édification.
