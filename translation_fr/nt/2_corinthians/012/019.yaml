revisions:
- from: Depuis tout ce temps, pensez-vous que nous nous défendons devant vous ? C’est devant Dieu, dans le Messie, que nous parlons. Et tout ce que nous faisons, bien-aimés, vise à vous faire grandir.
  to: Pensez-vous depuis longtemps que nous nous défendons devant vous ? C’est devant Dieu, dans le Messie, que nous parlons. Et tout, bien-aimés, est destiné à vous faire grandir.
  rationale: La révision rend la question initiale plus idiomatique et remplace l’explicitation restrictive « tout ce que nous faisons » par « tout », qui préserve l’ampleur de τὰ πάντα. « Est destiné à vous faire grandir » conserve une formulation française naturelle tout en exprimant la finalité indiquée par ὑπέρ.
  reviewer_model: gpt-5.6-terra
