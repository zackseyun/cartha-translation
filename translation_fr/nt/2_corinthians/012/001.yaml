reference: 2 Corinthians 12:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καυχᾶσθαι ⸀δεῖ· οὐ ⸂συμφέρον μέν⸃, ἐλεύσομαι ⸀δὲ εἰς ὀπτασίας καὶ ἀποκαλύψεις κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/001.yaml
  text: Boasting is necessary[a], though it is not beneficial[b]; but I will go on to visions and revelations of the Lord.
translation:
  language: fr
  text: Il faut se vanter ; ce n’est certes pas utile, mais j’en viendrai aux visions et aux révélations du Seigneur[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « venant du Seigneur ». Le génitif grec peut indiquer la provenance, mais « du Seigneur » en préserve mieux la formulation et l’ambiguïté.
    reason: alternative_reading
lexical_decisions:
- source_word: Καυχᾶσθαι
  choice: se vanter
  rationale: L’infinitif présent est employé comme sujet de δεῖ. « Se vanter » conserve l’idée verbale et le thème de la vantardise réticente de Paul sans ajouter d’explication.
- source_word: δεῖ
  choice: il faut
  rationale: Cette tournure française courante exprime directement la nécessité portée par δεῖ et convient naturellement à l’infinitif sujet.
- source_word: οὐ συμφέρον μέν
  choice: Certes, cela n’est pas avantageux
  rationale: συμφέρον désigne ce qui est avantageux ou bénéfique. « Certes » rend la fonction préparatoire de μέν, à laquelle répond δέ, tout en gardant une formulation claire et actuelle.
- source_word: ἐλεύσομαι δὲ
  choice: mais j’en viendrai
  rationale: Avec εἰς, le futur de ἔρχομαι marque ici le passage au sujet suivant. « J’en viendrai à » est idiomatique en français, tandis que « mais » rend le contraste introduit par δέ.
- source_word: εἰς ὀπτασίας
  choice: aux visions
  rationale: ὀπτασία désigne une vision ou une manifestation vue; « visions » est le terme français établi, accessible et conforme au pluriel.
- source_word: καὶ ἀποκαλύψεις
  choice: et aux révélations
  rationale: ἀποκάλυψις évoque un dévoilement ou une communication révélée. « Révélations » est ici l’équivalent français le plus naturel.
- source_word: κυρίου
  choice: du Seigneur
  rationale: Le génitif se rapporte naturellement aux visions et aux révélations. « Du Seigneur » en préserve la concision et une part d’ambiguïté, sans imposer explicitement une relation de provenance.
theological_decisions:
- issue: Relation de κυρίου aux « visions et révélations »
  choice: du Seigneur
  alternative: venant du Seigneur
  rationale: Le génitif grec peut notamment indiquer l’appartenance ou la source, sans préciser explicitement cette relation. « Du Seigneur » maintient cette réserve, tandis que « venant du Seigneur » tranche en faveur de la provenance.
translation_notes:
  register: Français international moderne, sobre et digne. La division en deux phrases évite une construction française lourde tout en conservant la progression concessive et contrastive de μέν…δέ. Le vocabulaire reste courant sans effacer la tension entre la nécessité de se vanter et l’absence d’avantage.
