source:
  edition: SBLGNT
  text: τί γάρ ἐστιν ὃ ⸀ἡσσώθητε ὑπὲρ τὰς λοιπὰς ἐκκλησίας, εἰ μὴ ὅτι αὐτὸς ἐγὼ οὐ κατενάρκησα ὑμῶν; χαρίσασθέ μοι τὴν ἀδικίαν ταύτην.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/013.yaml
  text: For in what were you treated as inferior to the rest of the churches[c][b][a], except that I myself did not become a burden to you? Forgive me this wrong.
translation:
  language: fr
  text: Car en quoi avez-vous été désavantagés par rapport aux autres Églises[a], sinon que moi-même je ne vous ai pas été à charge[b] ? Pardonnez-moi cette injustice[c] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « avez-vous été moins bien traités que les autres Églises ». Le verbe grec peut exprimer le fait d’être placé dans une situation moins favorable.'
    reason: lexical_alternative
  - marker: b
    text: Paul veut dire qu’il ne leur a pas imposé de charge financière en acceptant de leur part un soutien matériel.
    reason: cultural_note
  - marker: c
    text: 'Paul parle avec ironie : l’« injustice » en question est son refus de leur être à charge.'
    reason: rhetorical_note
lexical_decisions:
- source_word: τί γάρ ἐστιν ὃ
  choice: En quoi, en effet
  rationale: Cette tournure rend naturellement la question rhétorique et conserve le lien argumentatif marqué par γάρ.
- source_word: ἡσσώθητε
  choice: avez-vous été moins bien traités
  rationale: Le passif exprime ici une situation désavantageuse par comparaison, sans suggérer une infériorité intrinsèque des Corinthiens.
- source_word: ὑπὲρ τὰς λοιπὰς ἐκκλησίας
  choice: que les autres Églises
  rationale: Dans cette construction comparative, ὑπέρ introduit le terme de comparaison; « les autres Églises » rend clairement λοιπάς.
- source_word: αὐτὸς ἐγὼ
  choice: moi-même, je
  rationale: Le pronom intensif et le sujet exprimé donnent une forte insistance personnelle, conservée par cette tournure française.
- source_word: οὐ κατενάρκησα ὑμῶν
  choice: je ne vous ai pas été à charge
  rationale: Dans le contexte de 2 Corinthiens, le verbe désigne le fait d'imposer une charge matérielle ou financière; cette expression française est naturelle et suffisamment large.
- source_word: χαρίσασθέ μοι
  choice: Pardonnez-moi
  rationale: Le sens « pardonner » convient à l'impératif ironique par lequel Paul présente son refus de leur être à charge comme une faute.
- source_word: τὴν ἀδικίαν ταύτην
  choice: cette injustice
  rationale: « Injustice » correspond directement à ἀδικία et maintient la force ainsi que l'ironie de la formule.
theological_decisions:
- issue: L'ironie de Paul au sujet du soutien financier
  choice: Conserver une formulation littérale et laisser l'ironie ressortir de « Pardonnez-moi cette injustice ! »
  alternative: Expliciter le sarcasme dans le texte, par exemple « Pardonnez-moi donc cette prétendue injustice ! »
  rationale: Le contexte et le contraste portent déjà l'ironie; ajouter « prétendue » résoudrait explicitement un effet rhétorique que le grec laisse au lecteur.
translation_notes:
  register: Français international moderne, digne et accessible. « Églises » désigne ici les communautés chrétiennes locales. La syntaxe interrogative et l'exclamation finale préservent le ton vif et ironique du passage.
