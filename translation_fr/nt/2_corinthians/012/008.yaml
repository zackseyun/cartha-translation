  text: ὑπὲρ τούτου τρὶς τὸν κύριον παρεκάλεσα ἵνα ἀποστῇ ἀπ’ ἐμοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/008.yaml
  text: Concerning this[d][c][b][a], three times I pleaded with the Lord that it might depart from me.
translation:
  language: fr
  text: À ce sujet[a], j’ai supplié[b] trois fois le Seigneur[c] pour que cela s’éloigne de moi[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « À propos de cela » ou « Pour cela ».
    reason: lexical_alternative
  - marker: b
    text: Ou « j’ai adressé une demande pressante à » ou « j’ai imploré ».
    reason: lexical_alternative
  - marker: c
    text: Le grec dit seulement « le Seigneur »; Paul ne nomme pas explicitement Jésus ici.
    reason: alternative_reading
  - marker: d
    text: Ou « pour que cela me quitte » ou « s’en aille loin de moi ». En grec, le sujet reste implicite et renvoie à l’affliction mentionnée au verset précédent.
    reason: alternative_reading
lexical_decisions:
- source_word: ὑπὲρ τούτου
  choice: À ce sujet
  rationale: Avec le génitif, ὑπέρ introduit ici ce qui motive la demande. « À ce sujet » établit naturellement le lien avec l’épreuve évoquée au verset précédent sans donner à la préposition le sens de « en faveur de ».
- source_word: τρὶς
  choice: trois fois
  rationale: L’adverbe indique trois occasions. « Trois fois » est la formulation courante en français moderne.
- source_word: τὸν κύριον
  choice: le Seigneur
  rationale: Cette traduction traditionnelle et naturelle de κύριος conserve exactement le degré de précision du grec, qui ne nomme pas explicitement Jésus ici.
- source_word: παρεκάλεσα
  choice: j’ai supplié
  rationale: Dans le contexte d’une prière instante pour être délivré d’une affliction, « supplier » exprime la demande pressante portée par παρακαλέω, sans employer une tournure vieillie.
- source_word: ἵνα
  choice: pour que
  rationale: La conjonction introduit ici l’objet ou le but de la supplication. « Pour que » est idiomatique et conserve cette nuance sans trancher inutilement entre contenu et finalité.
- source_word: ἀποστῇ
  choice: cela s’éloigne
  rationale: Le verbe signifie partir, se retirer ou s’éloigner. Le sujet restant implicite en grec, « cela » renvoie globalement à ce qui vient d’être évoqué et évite de préciser s’il s’agit de l’écharde ou du messager.
- source_word: ἀπ’ ἐμοῦ
  choice: de moi
  rationale: La préposition exprime simplement l’éloignement par rapport à Paul; « de moi » est clair et naturel.
theological_decisions:
- issue: Référent du titre « le Seigneur »
  choice: Conserver « le Seigneur » sans ajouter de nom.
  alternative: « le Seigneur Jésus »
  rationale: Dans ce contexte paulinien, le titre désigne très probablement Jésus, mais le texte grec dit seulement κύριον. La traduction ne rend donc pas explicite ce que le verset laisse implicite.
- issue: Sujet implicite de ἀποστῇ
  choice: Employer « cela » comme sujet non spécifié.
  alternative: « qu’il s’éloigne », « que le messager s’éloigne » ou « que l’écharde s’éloigne »
  rationale: Le contexte précédent mentionne à la fois une écharde dans la chair et un messager de Satan. Comme le grec n’exprime pas le sujet du verbe, « cela » préserve le renvoi ouvert à l’affliction évoquée sans choisir entre ces images.
translation_notes:
  register: Français international moderne, digne et direct. La phrase suit l’ordre logique du grec tout en plaçant naturellement « trois fois » après le verbe. « Cela » évite les genres grammaticaux français qui pourraient donner l’impression de résoudre l’ambiguïté du sujet implicite.
