source:
  edition: SBLGNT
  text: εἰ δὲ καὶ ἰδιώτης τῷ λόγῳ, ἀλλ’ οὐ τῇ γνώσει, ἀλλ’ ἐν παντὶ ⸀φανερώσαντες ἐν πᾶσιν εἰς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/006.yaml
  text: But even if I am unskilled in speech[a], I am not in knowledge; indeed[c][b], in every way we have made this plain among all to you.
translation:
  language: fr
  text: Même si je ne suis pas habile dans l’art de parler[a], je ne manque pas de connaissance. Bien au contraire, nous vous l’avons clairement montré à tous égards et en toutes choses[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « sans formation en éloquence », c’est-à-dire sans l’aisance d’un orateur exercé.'
    reason: lexical_alternative
  - marker: b
    text: 'Le grec est très condensé. On peut aussi comprendre : « nous vous l’avons manifesté de toute manière, devant tous » ou « parmi tous ».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδιώτης τῷ λόγῳ
  choice: pas habile dans l’art de parler
  rationale: Dans ce contraste avec la connaissance, ἰδιώτης désigne le manque de formation ou d’aisance rhétorique, non une ignorance générale. Cette formulation française exprime ce sens sans réduire λόγος au simple fait de parler.
- source_word: οὐ τῇ γνώσει
  choice: je ne manque pas de connaissance
  rationale: 'Le grec sous-entend la qualification précédente : Paul n’est pas ἰδιώτης dans le domaine de la connaissance. La tournure négative française conserve le contraste tout en restant naturelle.'
- source_word: φανερώσαντες
  choice: nous vous l’avons clairement montré
  rationale: Le participe aoriste a ici une valeur assertive dans une construction comprimée. « Montré clairement » restitue l’idée de rendre manifeste sans calquer maladroitement la forme participiale.
- source_word: ἐν παντί
  choice: à tous égards
  rationale: 'La locution exprime une portée complète et peut avoir une valeur adverbiale : sous tout rapport, de toute manière.'
- source_word: ἐν πᾶσιν
  choice: en toutes choses
  rationale: Cette traduction conserve la portée générale du pluriel neutre possible, tandis que la note signale que la forme peut aussi être comprise comme désignant des personnes.
- source_word: εἰς ὑμᾶς
  choice: vous
  rationale: εἰς indique ici l’orientation vers les Corinthiens, destinataires de cette manifestation; le pronom complément intégré au verbe est idiomatique en français.
theological_decisions:
- issue: Portée de l’aveu de Paul au sujet de sa parole
  choice: Paul reconnaît un manque d’habileté ou de formation rhétorique, mais non un manque de connaissance.
  alternative: Paul se décrirait comme globalement ignorant, ou son propos serait entièrement ironique sans aucun aveu de faiblesse.
  rationale: Le contraste explicite entre λόγος et γνῶσις concerne le mode d’expression par opposition au contenu connu. La traduction évite d’étendre cet aveu à l’autorité ou à la vérité du message.
- issue: Référent de ce que Paul a clairement montré
  choice: Le pronom « l’ » reprend globalement son absence de déficience quant à la connaissance.
  alternative: Le verbe pourrait évoquer plus largement la personne, la conduite ou le ministère de Paul et de ses collaborateurs.
  rationale: Le contexte immédiat favorise le lien avec la connaissance, mais la formulation grecque reste elliptique; la note sur la dernière proposition préserve son caractère comprimé.
translation_notes:
  register: Français international moderne, digne et lisible. « L’art de parler » évoque la compétence rhétorique sans jargon technique. La reprise au pluriel (« nous ») est conservée. Les deux expressions générales ἐν παντί et ἐν πᾶσιν sont distinguées dans le texte, tandis que la note maintient l’ambiguïté entre choses, circonstances et personnes.
