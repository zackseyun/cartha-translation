  text: For you gladly put up with fools[b][a], being wise yourselves.
translation:
  language: fr
  text: Car vous supportez volontiers les insensés[a], vous qui êtes sages[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les gens déraisonnables ».'
    reason: lexical_alternative
  - marker: b
    text: 'Paul parle avec ironie : le contraste entre « insensés » et « sages » exprime une critique des Corinthiens.'
    reason: rhetorical_note
lexical_decisions:
- source_word: ἡδέως
  choice: volontiers
  rationale: Exprime une disposition empressée ou consentante et conserve naturellement la pointe ironique de Paul.
- source_word: γὰρ
  choice: Car
  rationale: Introduit l’explication de l’affirmation précédente tout en maintenant le lien argumentatif.
- source_word: ἀνέχεσθε
  choice: supportez
  rationale: Rend l’idée d’endurer ou de tolérer des personnes. En français courant, « supporter » conserve ici la nuance critique sans devenir trop familier.
- source_word: τῶν ἀφρόνων
  choice: les insensés
  rationale: Désigne des personnes dépourvues de bon sens. Le choix forme un contraste net avec « sages » et convient au registre digne du passage.
- source_word: φρόνιμοι
  choice: sages
  rationale: Préserve l’opposition lexicale et rhétorique avec « les insensés », sans expliciter indûment l’ironie.
- source_word: ὄντες
  choice: vous qui êtes
  rationale: Reproduit la valeur participiale sans trancher explicitement entre une nuance causale et concessive.
theological_decisions:
- issue: L’ironie de Paul envers les Corinthiens
  choice: Conserver une formulation littérale et faire ressortir l’ironie par l’opposition entre « les insensés » et « sages », avec un point d’exclamation.
  alternative: Expliciter l’ironie par une paraphrase telle que « puisque vous vous croyez si sages ».
  rationale: Le grec juxtapose directement les insensés et les sages, mais ne dit pas explicitement que les Corinthiens se croient sages. La traduction préserve donc la tension rhétorique sans introduire cette interprétation dans le texte.
translation_notes:
  register: Français international moderne, clair et digne. « Supportez volontiers » reste naturel tout en gardant la vigueur sarcastique. L’ordre français « vous qui êtes sages » préserve l’ambiguïté grammaticale du participe grec autant que possible.
