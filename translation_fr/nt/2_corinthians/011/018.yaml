  text: ἐπεὶ πολλοὶ καυχῶνται ⸀κατὰ σάρκα, κἀγὼ καυχήσομαι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/018.yaml
  text: Since many boast according to the flesh[a], I too will boast.
translation:
  language: fr
  text: Puisque beaucoup se vantent selon la chair[a], moi aussi, je me vanterai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « d’après des critères humains » ou « d’une manière purement humaine ».'
    reason: Précise le sens idiomatique probable de κατὰ σάρκα tout en maintenant « selon la chair » dans le texte principal.
lexical_decisions:
- source_word: ἐπεὶ
  choice: Puisque
  rationale: Introduit la raison de la résolution ironique de Paul et conserve clairement la valeur causale.
- source_word: πολλοὶ
  choice: beaucoup
  rationale: Rend naturellement l’adjectif quantitatif substantivé dans ce contexte.
- source_word: καυχῶνται
  choice: se vantent
  rationale: Correspond au sens polémique de καυχάομαι et permet de conserver la répétition avec καυχήσομαι.
- source_word: κατὰ σάρκα
  choice: selon la chair
  rationale: Préserve l’expression paulinienne et son ambiguïté théologique sans la réduire dans le texte principal à une seule interprétation.
- source_word: κἀγὼ
  choice: moi aussi
  rationale: Restitue l’association de καί et du pronom emphatique ἐγώ, ainsi que le parallèle rhétorique avec les adversaires.
- source_word: καυχήσομαι
  choice: je me vanterai
  rationale: Conserve le futur et la répétition exacte du même verbe, essentielle à la stratégie rhétorique du passage.
theological_decisions:
- issue: Sens de σάρξ dans l’expression κατὰ σάρκα
  choice: selon la chair
  alternative: d’après des critères humains ; d’une manière purement humaine
  rationale: 'La formulation littérale conserve la texture du vocabulaire paulinien et une ambiguïté réelle : il s’agit ici vraisemblablement de motifs ou de critères humains, mais le texte principal ne doit pas effacer la portée potentiellement plus large du terme « chair ».'
translation_notes:
  register: Français international moderne, digne et direct. La répétition « se vantent / me vanterai » est volontaire. La virgule après « moi aussi » marque légèrement l’emphase grecque sans alourdir la phrase.
