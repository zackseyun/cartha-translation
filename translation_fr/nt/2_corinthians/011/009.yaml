source:
  edition: SBLGNT
  text: καὶ παρὼν πρὸς ὑμᾶς καὶ ὑστερηθεὶς οὐ κατενάρκησα οὐθενός· τὸ γὰρ ὑστέρημά μου προσανεπλήρωσαν οἱ ἀδελφοὶ ἐλθόντες ἀπὸ Μακεδονίας· καὶ ἐν παντὶ ἀβαρῆ ⸂ἐμαυτὸν ὑμῖν⸃ ἐτήρησα καὶ τηρήσω.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/009.yaml
  text: And when I was present with you and was in need[a], I was not a burden to anyone; for the brothers who came from Macedonia supplied what I lacked. And in everything I kept myself from being a burden to you[b], and will keep doing so.
translation:
  language: fr
  text: Et lorsque j’étais parmi vous et que je me suis trouvé dans le besoin, je n’ai été à la charge de personne[a] ; car les frères[b] venus de Macédoine ont pourvu à ce qui me manquait. En toute chose, j’ai veillé à ne pas être à votre charge, et je continuerai à le faire.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « je n’ai pesé sur personne ». Le verbe grec peut évoquer le fait de peser sur quelqu’un ou d’être financièrement à sa charge.'
    reason: lexical_alternative
  - marker: b
    text: « Les frères » traduit une forme masculine plurielle. Selon le contexte, Paul peut employer ce terme plus largement pour des croyants, mais il désigne probablement ici des collaborateurs précis venus de Macédoine.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρὼν πρὸς ὑμᾶς
  choice: lorsque j’étais parmi vous
  rationale: Le participe a ici une valeur temporelle et circonstancielle. Cette formulation française exprime naturellement la présence personnelle de Paul auprès des Corinthiens.
- source_word: ὑστερηθεὶς
  choice: je me suis trouvé dans le besoin
  rationale: Le participe passif indique que Paul éprouvait un manque, vraisemblablement matériel dans ce contexte. La formulation choisie est actuelle et idiomatique.
- source_word: οὐ κατενάρκησα οὐθενός
  choice: je n’ai été à la charge de personne
  rationale: Le verbe καταναρκάω évoque le fait de peser sur quelqu’un, notamment sur le plan financier. « Être à la charge de » rend clairement cette nuance en français.
- source_word: τὸ ὑστέρημά μου
  choice: ce qui me manquait
  rationale: Le nom désigne le manque de Paul ou ce dont il avait besoin. La proposition relative évite une abstraction lourde et conserve le lien lexical avec le besoin mentionné plus haut.
- source_word: προσανεπλήρωσαν
  choice: ont pourvu à
  rationale: Le verbe composé signifie fournir ce qui est nécessaire pour combler un manque. « Pourvoir à ce qui me manquait » restitue ce sens sans exagérer la notion de totalité.
- source_word: οἱ ἀδελφοὶ
  choice: les frères
  rationale: La forme grecque est un masculin pluriel. Dans ce contexte, elle paraît désigner des collaborateurs précis venus de Macédoine ; le masculin est donc conservé, avec une note signalant l’emploi plus large possible chez Paul.
- source_word: ἐλθόντες ἀπὸ Μακεδονίας
  choice: venus de Macédoine
  rationale: Le participe aoriste est rendu par un participe passé français naturel, qui conserve l’origine géographique des personnes ayant apporté l’aide.
- source_word: ἐν παντί
  choice: en toute chose
  rationale: L’expression a une portée générale. Cette tournure française digne et courante préserve cette ampleur sans la limiter au seul domaine financier, même si celui-ci domine le contexte.
- source_word: ἀβαρῆ ἐμαυτὸν ὑμῖν
  choice: ne pas être à votre charge
  rationale: L’adjectif ἀβαρής signifie « qui ne pèse pas, qui n’est pas à charge », ici surtout financièrement. L’expansion verbale est nécessaire pour produire un français naturel.
- source_word: ἐτήρησα καὶ τηρήσω
  choice: j’ai veillé à … et je continuerai à le faire
  rationale: τηρέω exprime le maintien soigneux d’une conduite. Le futur français explicite naturellement que Paul entend poursuivre la même pratique.
theological_decisions:
- issue: Portée de οἱ ἀδελφοὶ
  choice: les frères
  alternative: les frères et sœurs / les croyants
  rationale: La forme source est masculine et, ici, renvoie probablement à des collaborateurs identifiables venus de Macédoine. La traduction ne neutralise donc pas le genre, tout en signalant en note que Paul peut employer ce terme plus largement selon le contexte.
- issue: Nature du fardeau évoqué
  choice: être à la charge de quelqu’un
  alternative: peser sur quelqu’un
  rationale: Le contexte immédiat concerne le manque matériel de Paul et l’aide reçue de Macédoine. La traduction rend donc la dimension financière probable sans transformer l’expression en affirmation doctrinale générale sur le soutien des ministres.
translation_notes:
  register: Français international moderne, naturel et digne. La répétition de « à la charge » maintient le fil lexical et rhétorique du verset. Le point-virgule conserve le rapport explicatif introduit par γάρ.
