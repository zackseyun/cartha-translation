source:
  edition: SBLGNT
  text: ὁ θεὸς καὶ πατὴρ τοῦ κυρίου ⸀Ἰησοῦ οἶδεν, ὁ ὢν εὐλογητὸς εἰς τοὺς αἰῶνας, ὅτι οὐ ψεύδομαι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/031.yaml
  text: The God and Father of the Lord Jesus[a], he who is blessed forever, knows that I am not lying.
translation:
  language: fr
  text: Dieu, le Père du Seigneur Jésus, lui qui est béni pour toujours[a], sait que je ne mens pas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « pour les siècles ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ θεὸς καὶ πατὴρ
  choice: Le Dieu et Père
  rationale: L’article unique régit les deux noms et forme l’expression « le Dieu et Père ». Le maintien des deux noms préserve la structure solennelle de l’appel de Paul.
- source_word: τοῦ κυρίου Ἰησοῦ
  choice: du Seigneur Jésus
  rationale: « Seigneur » rend le titre κύριος. Aucun possessif correspondant à « notre » ne figure dans le texte grec.
- source_word: οἶδεν
  choice: sait
  rationale: Le verbe signifie directement « sait ». Même si l’énoncé fonctionne comme un appel solennel à Dieu, il n’est pas nécessaire de l’expliciter par « m’est témoin ».
- source_word: ὁ ὢν εὐλογητὸς
  choice: lui qui est béni
  rationale: Cette formulation rend le participe substantivé accompagné de l’adjectif attribut et présente la proposition comme une description doxologique de Dieu.
- source_word: εἰς τοὺς αἰῶνας
  choice: pour toujours
  rationale: Cette expression française naturelle communique la durée sans fin portée ici par la formule doxologique, tandis qu’une note conserve sa formulation plus littérale.
- source_word: ὅτι
  choice: que
  rationale: ὅτι introduit ici le contenu de ce que Dieu sait, et non une proposition causale.
- source_word: οὐ ψεύδομαι
  choice: je ne mens pas
  rationale: Le présent français rend simplement et naturellement l’affirmation solennelle au présent.
theological_decisions:
- issue: Rapport entre « Dieu et Père » et « le Seigneur Jésus »
  choice: Rendre directement « Le Dieu et Père du Seigneur Jésus » en conservant la distinction relationnelle exprimée par le grec.
  alternative: Paraphraser afin d’atténuer la distinction entre Dieu le Père et le Seigneur Jésus.
  rationale: La traduction doit préserver la formulation et la tension théologique du texte sans les neutraliser ni leur imposer une explication confessionnelle.
- issue: Ponctuation et rattachement de la proposition doxologique
  choice: Traiter « lui qui est béni pour toujours » comme une description en apposition se rapportant à Dieu.
  alternative: En faire une proposition restrictive étroitement intégrée au groupe nominal.
  rationale: La proposition grecque fonctionne naturellement comme une parenthèse révérencieuse dans cette déclaration solennelle. Les virgules rendent cette apposition clairement en français.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation reste proche de la structure grecque tout en évitant un tour artificiel; l’apposition « lui qui est béni » conserve la solennité doxologique.
