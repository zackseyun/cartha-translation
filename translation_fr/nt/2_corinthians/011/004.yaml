reference: 2 Corinthians 11:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἰ μὲν γὰρ ὁ ἐρχόμενος ἄλλον Ἰησοῦν κηρύσσει ὃν οὐκ ἐκηρύξαμεν, ἢ πνεῦμα ἕτερον λαμβάνετε ὃ οὐκ ἐλάβετε, ἢ εὐαγγέλιον ἕτερον ὃ οὐκ ἐδέξασθε, καλῶς ⸀ἀνέχεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/004.yaml
  text: For if someone comes and proclaims another Jesus[a], whom we did not proclaim, or if you receive a different spirit, which you did not receive, or a different gospel, which you did not accept[c][b], you put up with it well enough.
translation:
  language: fr
  text: En effet, si quelqu’un vient proclamer un autre Jésus, que nous n’avons pas proclamé, ou si vous recevez un esprit différent, que vous n’avez pas reçu, ou un évangile différent, que vous n’avez pas accepté, vous le tolérez fort bien ![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’expression « vous le tolérez fort bien » est probablement ironique : Paul reproche aux Corinthiens d’être trop disposés à tolérer de telles prédications.'
    reason: clarification_du_ton
lexical_decisions:
- source_word: εἰ μὲν γὰρ
  choice: En effet, si
  rationale: Cette formulation française introduit naturellement l’explication conditionnelle de Paul sans reproduire lourdement chacune des particules grecques.
- source_word: ὁ ἐρχόμενος
  choice: quelqu’un vient
  rationale: Le participe présent substantivé désigne ici de façon générale une personne qui se présente parmi les Corinthiens. « Quelqu’un vient » est naturel et conserve cette valeur indéfinie.
- source_word: ἄλλον Ἰησοῦν
  choice: un autre Jésus
  rationale: '« Un autre Jésus » conserve la formulation frappante de Paul : le même nom est employé, mais la personne proclamée n’est pas celle que les apôtres ont annoncée.'
- source_word: κηρύσσει / ἐκηρύξαμεν
  choice: proclamer / avons proclamé
  rationale: « Proclamer » rend l’annonce publique exprimée par κηρύσσω et convient bien au registre paulinien.
- source_word: πνεῦμα ἕτερον
  choice: un esprit différent
  rationale: ἕτερος souligne ici le contraste avec l’esprit reçu auparavant. « Différent » préserve ce contraste sans préciser la nature de cet esprit.
- source_word: λαμβάνετε / ἐλάβετε
  choice: recevez / avez reçu
  rationale: « Recevoir » rend directement λαμβάνω et maintient une distinction lexicale avec δέχομαι dans la proposition suivante.
- source_word: εὐαγγέλιον ἕτερον
  choice: un évangile différent
  rationale: « Évangile » est le terme français courant dans ce contexte, tandis que « différent » exprime la force contrastive de ἕτερον.
- source_word: ἐδέξασθε
  choice: avez accepté
  rationale: « Accepter » rend la nuance d’accueil ou d’adhésion de δέχομαι et évite de répéter « recevoir ».
- source_word: καλῶς ἀνέχεσθε
  choice: vous le tolérez fort bien !
  rationale: ἀνέχομαι signifie supporter ou tolérer. Cette formulation française permet d’entendre l’ironie de καλῶς tout en restant proche de l’expression grecque; le pronom reprend globalement la situation décrite.
theological_decisions:
- issue: Référent de « un esprit différent »
  choice: La formulation reste générale et ne précise pas la nature de cet esprit.
  alternative: Identifier explicitement l’Esprit Saint déformé par les prédicateurs, un esprit démoniaque, ou une autre disposition spirituelle.
  rationale: Le grec ne tranche pas entre ces possibilités; expliciter l’une d’elles résoudrait indûment l’ambiguïté du texte.
- issue: Tonalité de καλῶς ἀνέχεσθε
  choice: La phrase est rendue comme un reproche ironique.
  alternative: La comprendre comme une approbation littérale ou une simple constatation neutre.
  rationale: Le contexte montre que Paul blâme les Corinthiens de tolérer trop facilement une proclamation rivale. Le point d’exclamation et la note rendent cette ironie perceptible sans modifier le contenu de la proposition.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe parallèle du grec est conservée, avec des formulations naturelles. Le contraste entre « recevoir » et « accepter » est maintenu, et l’ambiguïté concernant l’« esprit différent » n’est pas résolue.
