id: 2CO.11.3
reference: 2 Corinthians 11:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: φοβοῦμαι δὲ μή πως, ὡς ὁ ὄφις ⸂ἐξηπάτησεν Εὕαν⸃ ἐν τῇ πανουργίᾳ αὐτοῦ, ⸀φθαρῇ τὰ νοήματα ὑμῶν ἀπὸ τῆς ἁπλότητος ⸂καὶ τῆς ἁγνότητος⸃ τῆς εἰς τὸν Χριστόν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/003.yaml
  text: But I fear that somehow[a], just as the serpent deceived Eve by his cunning[d][c][b], your minds may be corrupted from the sincerity and purity that are toward Messiah.
translation:
  language: fr
  text: Mais je crains que vos pensées ne soient, d’une manière ou d’une autre, corrompues et détournées de la sincérité[a] et de la pureté[b] envers le Messie, comme le serpent a trompé Ève par sa ruse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « simplicité » ou « attachement sans partage ».
    reason: lexical_alternative
  - marker: b
    text: Certains manuscrits omettent « et de la pureté ».
    reason: textual_variant
lexical_decisions:
- source_word: φοβοῦμαι δὲ μή πως
  choice: Mais je crains que
  rationale: La tournure française avec « craindre que » et le ne explétif exprime naturellement l’appréhension introduite par μή πως, sans donner à « ne » une valeur négative.
- source_word: ὡς ὁ ὄφις ἐξηπάτησεν Εὕαν
  choice: de même que le serpent a trompé Ève
  rationale: « De même que » marque clairement la comparaison; « serpent » conserve l’allusion à la Genèse, et « a trompé » rend directement le verbe de la tromperie.
- source_word: ἐν τῇ πανουργίᾳ αὐτοῦ
  choice: par sa ruse
  rationale: La préposition est comprise comme indiquant le moyen; « ruse » exprime ici l’habileté trompeuse de façon naturelle et concise.
- source_word: φθαρῇ τὰ νοήματα ὑμῶν ἀπὸ
  choice: vos pensées ne soient corrompues et détournées de
  rationale: « Vos pensées » respecte le pluriel de νοήματα. L’ajout coordonné de « détournées » explicite en français la séparation indiquée par ἀπό, tout en conservant l’idée de corruption portée par φθαρῇ.
- source_word: τῆς ἁπλότητος
  choice: de la sincérité
  rationale: Dans ce contexte, ἁπλότης évoque une disposition sans duplicité et sans partage. « Sincérité » est idiomatique; la nuance de simplicité ou d’attachement sans partage est conservée en note.
- source_word: καὶ τῆς ἁγνότητος
  choice: et de la pureté
  rationale: « Pureté » garde la portée morale et relationnelle du terme sans la restreindre à la chasteté sexuelle.
- source_word: τῆς εἰς τὸν Χριστόν
  choice: envers le Messie
  rationale: « Envers » rattache naturellement cette orientation aux deux qualités précédentes. Χριστός est rendu comme un titre, « le Messie ».
theological_decisions:
- issue: Sens de ἁπλότης dans l’attachement au Messie
  choice: sincérité
  alternative: simplicité; attachement sans partage
  rationale: Le contexte met en jeu une fidélité droite et non divisée. Le texte principal retient le terme français le plus naturel, tandis que la note préserve l’étendue lexicale sans trancher davantage.
- issue: Rendu de Χριστόν
  choice: le Messie
  alternative: Christ
  rationale: Le mot grec est ici compris dans sa valeur de titre messianique; « le Messie » en transmet le sens plutôt que de le traiter simplement comme un nom propre.
- issue: Présence de καὶ τῆς ἁγνότητος
  choice: inclure « et de la pureté »
  alternative: omettre ces mots
  rationale: Ces mots figurent dans le texte de la SBLGNT fourni, mais leur omission dans certains manuscrits mérite d’être signalée.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la comparaison avec la Genèse et la tension entre corruption intérieure et éloignement d’une fidélité sincère et pure envers le Messie.
