  text: τρὶς ἐραβδίσθην, ἅπαξ ἐλιθάσθην, τρὶς ἐναυάγησα, νυχθήμερον ἐν τῷ βυθῷ πεποίηκα·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/025.yaml
  text: Three times I was beaten with rods[a], once I was stoned, three times I was shipwrecked; I have spent a night and a day in the deep.
translation:
  language: fr
  text: Trois fois, j’ai été battu à coups de bâton ; une fois, j’ai été lapidé ; trois fois, j’ai fait naufrage ; j’ai passé une nuit et un jour dans les profondeurs[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en pleine mer ».
    reason: Alternative lexicale et contextuelle pour βυθός, qui désigne les profondeurs ou les eaux profondes et peut aussi être compris comme la haute mer.
lexical_decisions:
- source_word: τρὶς
  choice: trois fois
  rationale: Rend directement l’adverbe de répétition et le traduit de manière identique dans ses deux occurrences.
- source_word: ἐραβδίσθην
  choice: j’ai été battu à coups de bâton
  rationale: Le passif de ῥαβδίζω désigne spécifiquement une bastonnade ; cette formulation moderne conserve l’instrument sans employer l’expression vieillie « battu de verges ».
- source_word: ἅπαξ
  choice: une fois
  rationale: Équivalent français naturel indiquant une occurrence unique.
- source_word: ἐλιθάσθην
  choice: j’ai été lapidé
  rationale: Rend avec concision le verbe λιθάζω, qui désigne l’action violente de lancer des pierres sur quelqu’un.
- source_word: ἐναυάγησα
  choice: j’ai fait naufrage
  rationale: Expression française idiomatique et directe pour l’expérience d’un naufrage.
- source_word: νυχθήμερον
  choice: une nuit et un jour
  rationale: Conserve l’ordre des deux éléments du terme grec et évite la précision modernisante de « vingt-quatre heures ».
- source_word: ἐν τῷ βυθῷ
  choice: en pleine mer
  rationale: Dans ce contexte maritime, βυθός renvoie aux eaux profondes ou au large ; « en pleine mer » est naturel en français tout en laissant une autre traduction littérale en note.
- source_word: πεποίηκα
  choice: j’ai passé
  rationale: Avec une expression de durée, ποιέω signifie idiomatiquement passer du temps ; le passé composé convient à la rétrospective de Paul.
