    issue: « en pleine mer » est une interprétation trop spécifique de ἐν τῷ βυθῷ.
    rationale: βυθός désigne d’abord la profondeur, les eaux profondes ou l’abîme marin. Il peut, selon l’interprétation, évoquer la haute mer, mais le grec ne précise pas suffisamment les circonstances pour faire de « en pleine mer » la seule lecture dans le texte principal.
