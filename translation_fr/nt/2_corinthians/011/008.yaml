  text: I robbed other churches by accepting support for serving you,[a]
translation:
  language: fr
  text: J’ai dépouillé d’autres Églises en recevant d’elles un soutien[a] pour vous servir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « une solde » ou « une rémunération ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλας ἐκκλησίας
  choice: d’autres Églises
  rationale: Dans l’usage paulinien, ἐκκλησία désigne normalement des communautés chrétiennes locales. « Églises » est naturel et reconnaissable en français moderne.
- source_word: ἐσύλησα
  choice: J’ai dépouillé
  rationale: 'Le verbe συλάω est volontairement fort : piller, dépouiller. « Dépouillé » conserve l’ironie provocatrice de Paul sans atténuer son propos en simple réception d’aide.'
- source_word: λαβὼν
  choice: en acceptant d’elles
  rationale: Le participe aoriste indique ici le moyen par lequel Paul dit avoir « dépouillé » les autres Églises. L’ajout explicite de « d’elles » rend le rapport syntaxique clair en français.
- source_word: ὀψώνιον
  choice: de quoi vivre
  rationale: ὀψώνιον désigne la solde, la rémunération ou les ressources matérielles reçues. Dans ce contexte missionnaire, « de quoi vivre » exprime naturellement le soutien matériel sans imposer l’idée moderne d’un contrat salarial; le sens plus littéral est signalé en note.
- source_word: πρὸς τὴν ὑμῶν διακονίαν
  choice: pour vous servir
  rationale: πρός avec l’accusatif exprime ici la finalité, et διακονία le service accompli. Cette formulation indique clairement que Paul recevait ces ressources afin d’exercer son service auprès des Corinthiens.
theological_decisions:
- issue: Force rhétorique de l’affirmation selon laquelle Paul a reçu des ressources d’autres Églises
  choice: Conserver la métaphore provocatrice avec « J’ai dépouillé d’autres Églises » comme formulation ironique et hyperbolique.
  alternative: Adoucir en « J’ai reçu l’aide d’autres Églises » ou « J’ai privé d’autres Églises de leurs ressources ».
  rationale: Le verbe grec est délibérément saisissant. Le contexte montre qu’il ne s’agit pas d’un aveu de vol, mais d’une défense ironique de la conduite apostolique de Paul. L’adoucir ferait perdre la tension rhétorique du texte.
translation_notes:
  register: Français international moderne, naturel et digne. « Dépouillé » maintient la vigueur rhétorique du grec; « de quoi vivre » évite une tournure commerciale trop marquée tout en rendant le soutien matériel concret.
