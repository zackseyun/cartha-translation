reference: 2 Corinthians 11:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἢ ἁμαρτίαν ἐποίησα ἐμαυτὸν ταπεινῶν ἵνα ὑμεῖς ὑψωθῆτε, ὅτι δωρεὰν τὸ τοῦ θεοῦ εὐαγγέλιον εὐηγγελισάμην ὑμῖν;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/007.yaml
  text: Or did I commit a sin by humbling myself so that you might be exalted[b][a], because I proclaimed the gospel of God to you free of charge?
translation:
  language: fr
  text: Ou bien ai-je commis un péché en m’abaissant moi-même pour que vous soyez élevés, puisque je vous ai annoncé gratuitement[a] l’Évangile de Dieu ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « sans vous faire payer ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἢ
  choice: Ou bien
  rationale: Introduit naturellement en français la nouvelle question rhétorique liée à l’argument précédent.
- source_word: ἁμαρτίαν ἐποίησα
  choice: ai-je commis un péché
  rationale: Rend idiomatiquement l’expression grecque littérale « faire un péché », tout en conservant sa catégorie morale et sa force rhétorique.
- source_word: ἐμαυτὸν ταπεινῶν
  choice: en m’abaissant moi-même
  rationale: Conserve le sens réfléchi et le contraste de statut avec l’élévation des Corinthiens; « moi-même » souligne l’opposition exprimée en grec.
- source_word: ἵνα ὑμεῖς ὑψωθῆτε
  choice: pour que vous soyez élevés
  rationale: Préserve la proposition de but ainsi que le passif, sans préciser au-delà du texte l’agent ou la nature exacte de cette élévation.
- source_word: ὅτι
  choice: puisque
  rationale: Présente l’annonce gratuite comme le motif concret de la question, avec un enchaînement naturel en français.
- source_word: δωρεὰν
  choice: gratuitement
  rationale: Exprime clairement l’absence de rémunération dans un registre courant et digne.
- source_word: τὸ τοῦ θεοῦ εὐαγγέλιον
  choice: l’Évangile de Dieu
  rationale: Reproduit la construction génitive et l’expression paulinienne consacrée, sans déterminer si le génitif désigne la source, l’objet ou l’appartenance.
- source_word: εὐηγγελισάμην ὑμῖν
  choice: je vous ai annoncé
  rationale: Rend naturellement l’acte de communiquer l’Évangile sans limiter le verbe au cadre formel d’une prédication.
theological_decisions:
- issue: Nature de la question rhétorique concernant l’humilité de Paul et l’absence de rémunération
  choice: Conserver la question directe et son ironie implicite, sans ajouter de jugement doctrinal sur la rémunération du ministère.
  alternative: Paraphraser en affirmant que Paul avait renoncé à un droit apostolique, ou atténuer la question en simple excuse.
  rationale: Le grec demande si l’abaissement volontaire de Paul et l’annonce gratuite de l’Évangile constituaient un péché; il ne développe pas ici une doctrine générale de la rémunération.
- issue: Sens du passif ὑψωθῆτε
  choice: « vous soyez élevés »
  alternative: « Dieu vous élève » ou « vous soyez honorés »
  rationale: Le passif grec ne nomme pas explicitement l’agent et peut évoquer une élévation de condition ou de statut. La formulation retenue maintient cette ouverture.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation conserve le contraste rhétorique entre l’abaissement de Paul et l’élévation des Corinthiens. Le marqueur de note [a] est placé après la question entière, la note précisant le sens financier de « gratuitement ».
