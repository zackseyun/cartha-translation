lexical_decisions:
- source_word: ὑπὸ Ἰουδαίων
  choice: de la part des Juifs
  rationale: Avec le génitif, ὑπό désigne ici les personnes à l’origine du châtiment. « De la part des Juifs » conserve cette idée sans préciser indûment qu’il s’agissait d’une instance officielle particulière.
- source_word: πεντάκις
  choice: Cinq fois
  rationale: Rend directement l’adverbe grec et souligne naturellement la répétition de l’épreuve.
- source_word: τεσσεράκοντα παρὰ μίαν
  choice: quarante coups moins un
  rationale: Conserve la forme expressive du grec, littéralement « quarante moins un ». Le nom « coups » explicite en français ce que le contexte du châtiment laisse sous-entendu en grec.
- source_word: ἔλαβον
  choice: j’ai reçu
  rationale: Reproduit l’image verbale de λαμβάνω, employé ici au sens de subir ou recevoir un châtiment, sans lui substituer un verbe plus interprétatif.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. La formulation conserve l’expression sémitique et grecque « quarante moins un » plutôt que de la remplacer dans le texte par « trente-neuf », tout en l’expliquant en note. « De la part des Juifs » reste proche de la construction source et évite d’ajouter la notion non exprimée d’« autorités juives ».
