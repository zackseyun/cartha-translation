source:
  edition: SBLGNT
  text: κατὰ ἀτιμίαν λέγω, ὡς ὅτι ἡμεῖς ⸀ἠσθενήκαμεν· ἐν ᾧ δ’ ἄν τις τολμᾷ, ἐν ἀφροσύνῃ λέγω, τολμῶ κἀγώ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/021.yaml
  text: I say this to our shame[a], as though we had been weak[d][c][b]. Yet in whatever anyone dares to boast—I am speaking foolishly—I also dare.
translation:
  language: fr
  text: Je le dis à notre honte[a], comme si nous avions été faibles[b]. Mais quel que soit le domaine où quelqu’un ose se vanter[c] — je parle en insensé[d] —, moi aussi, j’ose me vanter.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Je le dis sous le signe du déshonneur » ; l’expression grecque peut aussi présenter ces paroles comme quelque chose de déshonorant.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « comme si nous étions faibles ». Paul s’exprime ironiquement dans le cadre de son discours « insensé ».'
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « dans quelque domaine que quelqu’un ose ». L’idée de se vanter est sous-entendue par le contexte.'
    reason: contextual_expansion
  - marker: d
    text: 'Ou : « je parle comme un insensé ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ ἀτιμίαν
  choice: à notre honte
  rationale: Cette expression idiomatique difficile présente ce qui suit comme humiliant ou déshonorant pour Paul et ses collaborateurs. « À notre honte » est naturel en français et conserve la force rhétorique sans préciser à tort qui leur impose ce déshonneur.
- source_word: ὡς ὅτι
  choice: comme si
  rationale: La tournure introduit une concession fondée sur l’apparence et teintée d’ironie. « Comme si » restitue clairement cette nuance en français.
- source_word: ἠσθενήκαμεν
  choice: nous avions été faibles
  rationale: Le parfait renvoie ici à une faiblesse supposée, non principalement à une maladie. Le plus-que-parfait s’intègre naturellement après « comme si » et rend le regard rétrospectif de l’énoncé.
- source_word: ἐν ᾧ δ’ ἄν τις τολμᾷ
  choice: Mais quel que soit le domaine où quelqu’un ose se vanter
  rationale: L’expression désigne le domaine dans lequel quelqu’un fait preuve d’audace. « Se vanter » explicite sobrement l’objet sous-entendu par le contexte immédiat, consacré aux prétentions des adversaires.
- source_word: ἐν ἀφροσύνῃ λέγω
  choice: je parle en insensé
  rationale: Cette formulation concise et actuelle conserve l’aparté par lequel Paul qualifie lui-même son discours d’insensé, sans transformer nécessairement la phrase en affirmation sur son identité.
- source_word: τολμῶ κἀγώ
  choice: moi aussi, je l’ose
  rationale: La traduction reprend le verbe « oser » et son parallélisme avec τολμᾷ. Le pronom « l’ » renvoie naturellement à l’acte de se vanter déjà explicité.
theological_decisions:
- issue: L’ironie concernant la prétendue faiblesse de Paul
  choice: 'Présenter la faiblesse comme une concession ironique : « comme si nous avions été faibles »'
  alternative: Lire la proposition comme un aveu direct et non ironique de faiblesse
  rationale: Le contexte du « discours insensé » oppose Paul aux personnes qui se vantent. La traduction maintient son recul ironique sans nier pour autant le thème réel de sa faiblesse ailleurs dans la lettre.
- issue: Le caractère « insensé » de la prise de parole
  choice: « je parle en insensé »
  alternative: « je suis insensé »
  rationale: Le grec qualifie ici la manière de parler. La traduction évite d’en faire une déclaration générale sur la personne de Paul tout en conservant son avertissement rhétorique.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve les apartés rhétoriques de Paul au moyen de tirets, l’ironie de « comme si » et la répétition du verbe « oser ». Le vocabulaire évite aussi bien l’archaïsme que la paraphrase confessionnelle.
