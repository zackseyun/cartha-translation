    rationale: Le grec reprend τολμάω sans objet exprimé, mais le français « l’oser » exige un référent immédiatement identifiable. Après « domaine », il peut se comprendre comme renvoyant au domaine plutôt qu’à l’acte de se vanter. Répéter « me vanter » est une explicitation contextuelle sûre.
