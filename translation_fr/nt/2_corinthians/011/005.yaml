  yaml_path: translation/nt/2_corinthians/011/005.yaml
  text: For I consider that I am not in the least inferior to those super-apostles[a].
translation:
  language: fr
  text: Car j’estime n’être en rien inférieur à ces super-apôtres[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les apôtres les plus éminents ». L’expression grecque peut être comprise soit ironiquement (« super-apôtres »), soit comme une désignation non ironique d’apôtres tenus en très haute estime.'
    reason: alternative_reading
lexical_decisions:
- source_word: λογίζομαι
  choice: j’estime
  rationale: Le verbe exprime une appréciation réfléchie. « J’estime » est naturel en français actuel et conserve la nuance évaluative.
- source_word: γὰρ
  choice: En effet
  rationale: γάρ apporte ici une justification à ce qui précède. « En effet » rend clairement ce lien argumentatif en français.
- source_word: μηδὲν
  choice: en rien
  rationale: 'Employé avec l’infinitif ὑστερηκέναι, μηδέν a une valeur adverbiale : Paul affirme ne leur être inférieur sur aucun point.'
- source_word: ὑστερηκέναι
  choice: je ne suis … inférieur
  rationale: Le parfait infinitif de ὑστερέω désigne ici un état d’infériorité dans une comparaison. Cette tournure est idiomatique et précise en français.
- source_word: τῶν ὑπερλίαν ἀποστόλων
  choice: à ces « super-apôtres »
  rationale: L’expression peut être ironique et viser les adversaires de Paul. Les guillemets rendent cette distance rhétorique sans ajouter explicitement « soi-disant », tandis que la note conserve l’autre lecture possible.
theological_decisions:
- issue: L’expression τῶν ὑπερλίαν ἀποστόλων désigne-t-elle ironiquement les adversaires de Paul ou, sans ironie, des apôtres particulièrement éminents ?
  choice: « ces “super-apôtres” », qui préserve l’ironie probablement présente dans le contexte
  alternative: « les apôtres les plus éminents », comme référence directe à des apôtres hautement considérés
  rationale: Le contexte polémique de 2 Corinthiens 11 favorise la lecture ironique, mais le grec permet aussi une lecture non ironique. La traduction principale conserve la vigueur rhétorique et la note signale l’ambiguïté réelle.
translation_notes:
  register: Français international moderne, digne et accessible. « En effet » convient au raisonnement de Paul ; « super-apôtres » est intelligible aujourd’hui et les guillemets signalent sobrement l’ironie possible.
