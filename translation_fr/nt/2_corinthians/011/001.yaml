  text: Ὄφελον ἀνείχεσθέ μου μικρόν ⸀τι ⸀ἀφροσύνης· ἀλλὰ καὶ ἀνέχεσθέ μου.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/001.yaml
  text: I wish you would bear with me in a little foolishness[a]. But indeed[b], do bear with me.
translation:
  language: fr
  text: J’aimerais que vous supportiez un peu de ma folie[a]. Mais supportez-moi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « déraison » ou « sottise ».
    reason: lexical_alternative
  - marker: b
    text: 'La forme grecque peut aussi se comprendre comme un indicatif : « Mais vous me supportez. »'
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: Ὄφελον
  choice: J’aimerais que
  rationale: Cette tournure française actuelle exprime clairement le souhait introduit par ὄφελον, sans recourir à l’archaïsant « Puissiez-vous ».
- source_word: ἀνείχεσθέ / ἀνέχεσθέ
  choice: vous supportiez / supportez-moi
  rationale: Le verbe ἀνέχομαι exprime ici le fait de tolérer patiemment quelqu’un. La répétition française reflète la reprise insistante de Paul.
- source_word: μικρόν τι ἀφροσύνης
  choice: un peu de folie
  rationale: La formulation garde l’atténuation de μικρόν τι et la portée rhétorique de ἀφροσύνη, qui introduit les propos volontairement présentés comme insensés.
- source_word: μου
  choice: de ma part / moi
  rationale: Avec la première occurrence, « de ma part » relie naturellement la folie à Paul ; avec la seconde, « moi » est le complément idiomatique de « supporter ».
- source_word: ἀλλὰ καὶ
  choice: Mais … donc
  rationale: « Mais » maintient la reprise contrastive, tandis que « donc » renforce l’exhortation sans alourdir la phrase.
theological_decisions:
- issue: Paul qualifie son propre discours de « folie »
  choice: Conserver « folie » comme autodépréciation rhétorique
  alternative: Paraphraser par « propos peu raisonnables »
  rationale: Le contexte introduit le développement ironique où Paul va se livrer à la vantardise. Le terme direct préserve cette tension sans expliquer ni atténuer le texte.
- issue: Valeur de la seconde forme ἀνέχεσθέ
  choice: 'La comprendre comme un impératif : « supportez-moi »'
  alternative: 'La comprendre comme un indicatif : « vous me supportez »'
  rationale: La forme grecque peut être morphologiquement indicative ou impérative, mais la reprise de l’appel et l’usage de ἀλλὰ καί favorisent ici l’exhortation. La traduction suit ce sens tout en évitant d’y ajouter une interprétation doctrinale.
translation_notes:
  register: Français international moderne, simple et digne. « J’aimerais que » rend le souhait de manière naturelle ; l’exclamation finale restitue l’insistance de la reprise.
