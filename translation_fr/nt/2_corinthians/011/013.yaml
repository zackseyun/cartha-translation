id: 2CO.11.13
reference: 2 Corinthians 11:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οἱ γὰρ τοιοῦτοι ψευδαπόστολοι, ἐργάται δόλιοι, μετασχηματιζόμενοι εἰς ἀποστόλους Χριστοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/013.yaml
  text: For such men are false apostles[a], deceitful workers, disguising themselves as apostles of Messiah.
translation:
  language: fr
  text: Car de tels hommes sont de faux apôtres, des ouvriers trompeurs qui se déguisent en apôtres du Messie[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «du Christ». Le titre grec Χριστός signifie «Messie»; il peut aussi être rendu par «Christ» lorsqu’il fonctionne davantage comme un nom.
    reason: alternative_reading
lexical_decisions:
- source_word: γὰρ
  choice: Car
  rationale: Introduit l’explication de l’affirmation précédente et conserve clairement le lien argumentatif.
- source_word: οἱ τοιοῦτοι
  choice: de tels hommes
  rationale: Désigne la catégorie précise d’hommes que Paul vient d’évoquer; cette formulation française reste naturelle et explicite le pluriel masculin du grec.
- source_word: ψευδαπόστολοι
  choice: de faux apôtres
  rationale: Rend directement le composé grec désignant des personnes qui revendiquent faussement la qualité d’apôtre.
- source_word: ἐργάται δόλιοι
  choice: des ouvriers trompeurs
  rationale: Conserve l’image de personnes à l’œuvre tout en exprimant la tromperie qui caractérise leur activité.
- source_word: μετασχηματιζόμενοι
  choice: qui se déguisent
  rationale: Dans ce contexte, le participe décrit une modification trompeuse de l’apparence ou de la présentation de soi, non une transformation intérieure.
- source_word: εἰς ἀποστόλους Χριστοῦ
  choice: en apôtres du Messie
  rationale: Avec μετασχηματιζόμενοι, εἰς indique le rôle ou l’identité qu’ils prétendent revêtir. «Du Messie» conserve ici la valeur de titre de Χριστοῦ.
theological_decisions:
- issue: Traduction de Χριστοῦ
  choice: du Messie
  alternative: du Christ
  rationale: Dans l’expression «apôtres de Χριστός», le terme désigne celui qu’ils prétendent représenter et garde naturellement sa valeur de titre. «Du Messie» en explicite le sens sans modifier l’affirmation théologique; «du Christ» demeure une traduction traditionnelle possible.
translation_notes:
  register: Français international moderne, clair et digne. La structure accumulative du grec est préservée, tandis que le participe final est rendu par une proposition relative naturelle en français.
source_grounding:
  english_pob_role: consult_only
