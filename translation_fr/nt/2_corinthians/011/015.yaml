id: 2CO.11.15
reference: 2 Corinthians 11:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὐ μέγα οὖν εἰ καὶ οἱ διάκονοι αὐτοῦ μετασχηματίζονται ὡς διάκονοι δικαιοσύνης, ὧν τὸ τέλος ἔσται κατὰ τὰ ἔργα αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/015.yaml
  text: So it is no great thing if his servants also disguise themselves as servants of righteousness[a], whose end will be according to their works.
translation:
  language: fr
  text: Il n’est donc pas étonnant que ses serviteurs, eux aussi, se déguisent en serviteurs de la justice[a]. Leur fin sera conforme à leurs œuvres.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de la droiture ». Le mot grec peut désigner la justice ou la droiture; ici, il évoque l’apparence d’être au service de ce qui est juste.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ μέγα
  choice: il n’est pas étonnant
  rationale: Cette expression idiomatique indique que la chose n’a rien de remarquable ou de surprenant. Cette formulation est naturelle en français moderne.
- source_word: οὖν
  choice: donc
  rationale: Le mot introduit une conclusion tirée de l’affirmation du verset précédent.
- source_word: διάκονοι
  choice: serviteurs
  rationale: Dans ce contexte, il s’agit d’agents au service de Satan. « Serviteurs » évite la connotation ecclésiastique que pourrait avoir « ministres ».
- source_word: μετασχηματίζονται
  choice: se déguisent
  rationale: Le verbe désigne ici un changement d’apparence ou de présentation destiné à tromper, et non une transformation intérieure.
- source_word: ὡς
  choice: en
  rationale: Dans la tournure française « se déguiser en », cette préposition exprime naturellement le rôle ou l’apparence adoptés.
- source_word: δικαιοσύνης
  choice: justice
  rationale: Le nom peut évoquer ici la conformité à ce qui est droit, plutôt que la seule justice judiciaire. « Justice » reste le terme français biblique naturel, tandis que « droiture » est signalé en note pour expliciter la nuance morale.
- source_word: τὸ τέλος
  choice: leur fin
  rationale: L’expression désigne l’issue finale ou le sort qui les attend dans un contexte de jugement.
- source_word: κατὰ τὰ ἔργα αὐτῶν
  choice: conforme à leurs œuvres
  rationale: Cette formulation conserve l’idée de correspondance entre leur issue finale et leurs actes, tout en restant idiomatique en français.
theological_decisions:
- issue: Sens de δικαιοσύνη dans l’expression διάκονοι δικαιοσύνης
  choice: serviteurs de la justice
  alternative: serviteurs de la droiture
  rationale: « Justice » conserve le vocabulaire théologique courant et l’étendue sémantique du grec. Dans ce contexte, le terme vise l’apparence d’un service conforme à ce qui est juste et droit; la note préserve explicitement la nuance possible de « droiture » sans réduire le sens au domaine judiciaire.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe est légèrement restructurée en deux phrases pour éviter une relative lourde et ambiguë, tout en conservant le lien entre les actes des serviteurs et leur issue finale.
