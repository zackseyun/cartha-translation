  text: διάκονοι Χριστοῦ εἰσιν; παραφρονῶν λαλῶ, ὑπὲρ ἐγώ· ἐν κόποις περισσοτέρως, ἐν ⸂φυλακαῖς περισσοτέρως, ἐν πληγαῖς ὑπερβαλλόντως⸃, ἐν θανάτοις πολλάκις·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/023.yaml
  text: 'Are they servants of Messiah? I am speaking as if insane: I am more so—in labors more abundantly[a], in imprisonments more abundantly, in beatings beyond measure[b], in deaths often.'
translation:
  language: fr
  text: 'Sont-ils serviteurs du Messie[a] ? Je parle comme un fou : moi, davantage — dans les travaux, bien davantage ; dans les emprisonnements, bien davantage ; dans les coups, à l’excès ; souvent en danger de mort[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « du Christ » : « Sont-ils serviteurs du Christ ? »'
    reason: alternative_reading
  - marker: b
    text: 'Littéralement : « souvent dans les morts » ; l’expression évoque probablement des dangers de mort répétés ou des situations où Paul a frôlé la mort.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διάκονοι
  choice: serviteurs
  rationale: Le terme désigne ici ceux qui sont au service du Messie. « Serviteurs » est clair et évite la coloration ecclésiastique moderne de « ministres ».
- source_word: Χριστοῦ
  choice: du Messie
  rationale: Χριστός fonctionne ici comme un titre. « Messie » en rend explicitement le sens, tandis que la forme traditionnelle « Christ » est signalée en note.
- source_word: παραφρονῶν λαλῶ
  choice: Je parle comme un fou
  rationale: 'Cette formulation naturelle conserve l''aveu rhétorique de Paul : sa manière de se vanter paraît déraisonnable.'
- source_word: ὑπὲρ ἐγώ
  choice: moi, je le suis davantage
  rationale: La tournure explicite l'ellipse grecque tout en maintenant la comparaison provocatrice avec les autres serviteurs.
- source_word: ἐν κόποις περισσοτέρως
  choice: par des travaux bien plus nombreux
  rationale: κόπος évoque des travaux pénibles et περισσοτέρως marque une supériorité quantitative ou intensive. « Bien plus nombreux » convient au parallélisme de l'énumération.
- source_word: ἐν φυλακαῖς περισσοτέρως
  choice: par des emprisonnements bien plus nombreux
  rationale: Le pluriel désigne des épisodes répétés de détention; « emprisonnements » est plus précis que « prisons ».
- source_word: ἐν πληγαῖς ὑπερβαλλόντως
  choice: par des coups reçus sans mesure
  rationale: πληγαί désigne les coups ou sévices subis, et ὑπερβαλλόντως exprime un degré extrême. L'ajout « reçus » clarifie sans limiter le terme aux seules flagellations judiciaires.
- source_word: ἐν θανάτοις πολλάκις
  choice: souvent exposé à la mort
  rationale: Le pluriel grec très frappant évoque vraisemblablement des situations répétées de danger mortel. La traduction française restitue le sens probable, tandis que la note conserve la forme littérale.
theological_decisions:
- issue: Traduction de Χριστοῦ
  choice: du Messie
  alternative: du Christ
  rationale: Dans ce génitif titulaire, « Messie » traduit le sens du titre grec sans imposer une lecture confessionnelle particulière; « Christ », traditionnel et exact dans l'usage chrétien, demeure indiqué en note.
- issue: Interprétation de ἐν θανάτοις πολλάκις
  choice: souvent exposé à la mort
  alternative: souvent dans les morts
  rationale: Le français idiomatique exprime les dangers de mort répétés probablement visés, mais une note préserve l'image inhabituelle et l'ambiguïté du pluriel grec.
translation_notes:
  register: Français international moderne, digne et oralement fluide. L'énumération garde son rythme accumulatif et la comparaison audacieuse de Paul, sans reproduire des calques grecs peu naturels.
