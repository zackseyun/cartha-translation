  to: 'Sont-ils serviteurs du Messie[a] ? Je parle comme un fou : moi, davantage — dans les travaux, bien davantage ; dans les emprisonnements, bien davantage ; dans les coups, à l’excès ; souvent en danger de mort[b].'
  rationale: La révision maintient l'ellipse rhétorique et le rythme de l'énumération, tout en rendant ἐν comme un domaine de comparaison (« dans ») plutôt que comme un instrument (« par »). « Bien davantage » conserve l'amplitude du comparatif περισσοτέρως; « à l'excès » traduit l'intensif ὑπερβαλλόντως. La formulation française de la dernière proposition reste interprétative mais est encadrée par une note qui conserve l'ambiguïté et l'image inhabituelle du pluriel grec.
