  text: Εἰ καυχᾶσθαι δεῖ, τὰ τῆς ἀσθενείας μου καυχήσομαι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/030.yaml
  text: If I must boast[a], I will boast in the things of my weakness.
translation:
  language: fr
  text: S’il faut se vanter, je me vanterai de ce qui relève de ma faiblesse.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus simplement : « je me vanterai de mes faiblesses ». Le grec dit plus littéralement : « je me vanterai des choses qui concernent ma faiblesse ».'
    reason: Alternative lexicale et indication de la tournure grecque.
lexical_decisions:
- source_word: Εἰ
  choice: S’il
  rationale: Conserve la forme conditionnelle grecque sans la transformer en valeur causale (« puisque »).
- source_word: καυχᾶσθαι
  choice: se vanter
  rationale: Expression française actuelle qui rend le sens habituel de καυχάομαι et maintient la portée rhétorique, voire ironique, du propos.
- source_word: δεῖ
  choice: faut
  rationale: Rend de façon concise et naturelle l’idée de nécessité exprimée par le verbe impersonnel.
- source_word: τὰ τῆς ἀσθενείας μου
  choice: ce qui manifeste ma faiblesse
  rationale: Le neutre pluriel substantivé avec génitif désigne les réalités ou circonstances relevant de la faiblesse de Paul. Cette formulation reste naturelle en français tout en évitant de réduire l’expression au simple pluriel « mes faiblesses ».
- source_word: ἀσθενείας
  choice: faiblesse
  rationale: Terme clair et cohérent avec l’usage paulinien; il peut englober la fragilité et les circonstances humiliantes sans limiter le sens à une infirmité physique.
- source_word: καυχήσομαι
  choice: je me vanterai
  rationale: Rend le futur grec et reprend le même verbe que dans la première proposition afin de conserver le parallélisme rhétorique.
theological_decisions:
- issue: Nature de la vantardise de Paul
  choice: Présenter directement la vantardise paradoxale portant sur ce qui manifeste sa faiblesse.
  alternative: « Je me vanterai de mes faiblesses » ou, plus littéralement, « des choses de ma faiblesse ».
  rationale: Le texte oppose implicitement la vantardise ordinaire à une vantardise liée à la faiblesse. La traduction conserve cette tension sans lui ajouter une explication doctrinale.
translation_notes:
  register: Français international moderne, digne et accessible. « Se vanter » est naturel sans être familier. La tournure « ce qui manifeste ma faiblesse » explicite seulement ce que l’expression grecque elliptique désigne, tandis que la note préserve sa forme plus littérale et l’alternative idiomatique.
