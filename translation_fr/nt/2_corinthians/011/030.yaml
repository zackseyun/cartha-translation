  source_fidelity: 'La structure conditionnelle (« S’il faut »), la nécessité exprimée par δεῖ, la répétition de « se vanter » et le futur sont bien rendus. Toutefois, « ce qui manifeste ma faiblesse » introduit l’idée plus spécifique de manifestation : τὰ τῆς ἀσθενείας μου désigne plus largement les réalités qui concernent ou relèvent de la faiblesse de Paul, sans affirmer qu’elles la manifestent.'
