revisions:
- from: Mais ce que je fais, je continuerai à le faire, afin d’ôter toute occasion[a] à ceux qui cherchent une occasion, afin que, dans ce dont ils se vantent, ils soient trouvés tels que nous.
  to: Mais ce que je fais, je continuerai à le faire, afin d’ôter l’occasion[a] à ceux qui veulent une occasion, afin que, dans ce dont ils se vantent, ils soient trouvés semblables à nous.
  rationale: La révision retire l’intensif non attesté « toute », rend θελόντων de manière plus directe par « veulent », et remplace une formulation comparative calquée par une tournure française naturelle qui conserve la voix passive et l’indétermination du grec. La répétition intentionnelle d’« occasion » et l’alternative lexicale en note sont maintenues.
