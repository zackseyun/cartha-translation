review_pass:
  verdict: revise
  source_fidelity: La répétition de ἀφορμή est bien conservée et la note offre correctement « prétexte » comme possibilité. Toutefois, « toute occasion » ajoute une idée exhaustive absente du grec, qui porte simplement τὴν ἀφορμήν (« l’occasion »). θελόντων exprime plus directement le fait de vouloir ou désirer, plutôt que de « chercher ».
  naturalness: « Ils soient trouvés tels que nous » reste très calqué et peu naturel en français moderne. « Qu’ils soient trouvés semblables à nous » conserve la voix passive de εὑρεθῶσιν et rend la comparaison de façon idiomatique.
  terminology: « Occasion » est un choix neutre et défendable pour ἀφορμή; la répétition doit être maintenue. « Ôter l’occasion » rend adéquatement l’emploi figuré de ἐκκόψω sans surinterpréter l’image.
  issues:
  - severity: medium
    issue: Ajout de « toute »
    rationale: Le texte grec contient l’article défini τὴν, mais aucun terme équivalant à « toute ». Cet ajout élargit indûment l’affirmation.
  - severity: low
    issue: Rendu peu idiomatique de εὑρεθῶσιν καθὼς καὶ ἡμεῖς
    rationale: « Tels que nous » est compréhensible, mais sonne calqué dans cette construction; « semblables à nous » est plus naturel tout en préservant la comparaison et la passive.
  revised_text: Mais ce que je fais, je continuerai à le faire, afin d’ôter l’occasion[a] à ceux qui veulent une occasion, afin que, dans ce dont ils se vantent, ils soient trouvés semblables à nous.
  revised_footnotes:
