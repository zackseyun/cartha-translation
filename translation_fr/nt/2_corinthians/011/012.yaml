reference: 2 Corinthians 11:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ὃ δὲ ποιῶ καὶ ποιήσω, ἵνα ἐκκόψω τὴν ἀφορμὴν τῶν θελόντων ἀφορμήν, ἵνα ἐν ᾧ καυχῶνται εὑρεθῶσιν καθὼς καὶ ἡμεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/012.yaml
  text: But what I am doing[a], I will continue to do, in order to cut off the opportunity from those who want an opportunity, so that in what they boast about they may be found to be just as we are.
translation:
  language: fr
  text: Mais ce que je fais, je continuerai à le faire, afin d’ôter l’occasion[a] à ceux qui veulent une occasion, afin que, dans ce dont ils se vantent, ils soient trouvés semblables à nous.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « prétexte » dans les deux occurrences d’« occasion » (grec ἀφορμή).
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὃ δὲ ποιῶ καὶ ποιήσω
  choice: Mais ce que je fais, je continuerai à le faire
  rationale: Le présent suivi du futur exprime à la fois la pratique actuelle de Paul et sa résolution de la poursuivre. « Je continuerai à le faire » en restitue naturellement la force en français moderne.
- source_word: ἐκκόψω
  choice: ôter
  rationale: Le verbe signifie littéralement « couper, retrancher » et, ici, supprimer ou priver quelqu’un de quelque chose. « Ôter » rend clairement le sens métaphorique sans alourdir la phrase.
- source_word: ἀφορμή
  choice: occasion
  rationale: Le nom peut désigner une occasion, une possibilité d’agir ou un prétexte. « Occasion » conserve une portée assez neutre et permet au contexte polémique d’apporter sa propre nuance.
- source_word: τῶν θελόντων ἀφορμήν
  choice: à ceux qui cherchent une occasion
  rationale: 'Cette formulation garde la répétition insistante de ἀφορμή tout en rendant θελόντων de manière idiomatique : ces personnes veulent obtenir ou trouver une telle occasion.'
- source_word: ἐν ᾧ καυχῶνται
  choice: dans ce dont ils se vantent
  rationale: La tournure conserve l’indétermination du domaine ou du sujet de leur fierté sans préciser ce que le grec laisse implicite.
- source_word: εὑρεθῶσιν καθὼς καὶ ἡμεῖς
  choice: ils soient trouvés tels que nous
  rationale: « Soient trouvés » conserve la voix passive et la visée exprimée par le subjonctif, tandis que « tels que nous » maintient la comparaison avec Paul et ses collaborateurs sans l’expliciter davantage.
theological_decisions:
- issue: Nature de l’ἀφορμή recherchée par les adversaires de Paul
  choice: occasion
  alternative: prétexte
  rationale: Bien que le contexte polémique puisse suggérer un « prétexte », le nom grec ne l’impose pas. Le terme plus neutre « occasion » préserve l’ambiguïté lexicale et évite d’attribuer explicitement aux adversaires une intention que le verset laisse seulement entendre.
translation_notes:
  register: Français international moderne, digne et lisible. La répétition d’« occasion » et l’indétermination de « ce dont ils se vantent » sont conservées afin de respecter la formulation et la tension du grec.
