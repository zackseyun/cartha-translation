id: 2CO.11.20
reference: 2 Corinthians 11:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀνέχεσθε γὰρ εἴ τις ὑμᾶς καταδουλοῖ, εἴ τις κατεσθίει, εἴ τις λαμβάνει, εἴ τις ἐπαίρεται, εἴ τις ⸂εἰς πρόσωπον ὑμᾶς⸃ δέρει.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/020.yaml
  text: For you put up with it if someone enslaves you[a], if someone devours you, if someone takes from you, if someone exalts himself[b], if someone strikes you in the face.
translation:
  language: fr
  text: Car vous supportez que quelqu’un vous réduise en esclavage, que quelqu’un vous dévore, que quelqu’un prenne ce qui est à vous[a], que quelqu’un se donne de l’importance, que quelqu’un vous frappe au visage.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « prenne » ; le contexte évoque vraisemblablement le fait de dépouiller ou d’exploiter quelqu’un.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέχεσθε
  choice: vous supportez
  rationale: Le présent décrit ce que les Corinthiens tolèrent effectivement. « Supporter que » est naturel en français moderne et conserve la pointe ironique.
- source_word: γὰρ
  choice: Car
  rationale: Marque le lien explicatif avec l'ironie du verset précédent.
- source_word: καταδουλοῖ
  choice: vous réduise en esclavage
  rationale: Conserve sans l'atténuer l'idée forte d'asservissement exprimée par le verbe grec.
- source_word: κατεσθίει
  choice: vous dévore
  rationale: Préserve l'image vive et prédatrice d'une exploitation qui consume ses victimes.
- source_word: λαμβάνει
  choice: prenne ce qui est à vous
  rationale: Le verbe signifie simplement « prendre » et son objet n'est pas exprimé. Cette formulation rend en français le sens exploitant suggéré par le contexte sans le limiter à l'argent.
- source_word: ἐπαίρεται
  choice: se donne de l’importance
  rationale: Rend la valeur réfléchie de l'élévation de soi dans un français courant et digne, sans transformer l'action en simple trait de caractère.
- source_word: εἰς πρόσωπον ὑμᾶς δέρει
  choice: vous frappe au visage
  rationale: Reproduit concrètement l'agression et l'humiliation sans préciser indûment qu'il s'agit d'une gifle.
- source_word: εἴ τις
  choice: que quelqu’un
  rationale: Après « vous supportez », la répétition de « que quelqu'un » conserve l'anaphore et la force cumulative du grec dans une syntaxe française naturelle.
theological_decisions:
- issue: Tonalité rhétorique de la déclaration de Paul
  choice: Conserver la réprimande ironique par l'énumération des abus, sans nommer leurs auteurs dans le verset.
  alternative: Expliciter qu'il s'agit de faux apôtres ou de faux enseignants.
  rationale: Le contexte identifie les adversaires de Paul, mais ce verset se borne à énumérer leurs actes. Les nommer ici ajouterait une interprétation au texte.
translation_notes:
  register: Français international moderne, direct et digne. La structure répétitive est maintenue pour préserver l'accumulation rhétorique. « Se donne de l'importance » évite le tour plus ecclésiastique « s'élève lui-même », tandis que la note sur « prenne » conserve l'indétermination du grec.
