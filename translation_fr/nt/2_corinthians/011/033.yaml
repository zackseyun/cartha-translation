  text: καὶ διὰ θυρίδος ἐν σαργάνῃ ἐχαλάσθην διὰ τοῦ τείχους καὶ ἐξέφυγον τὰς χεῖρας αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/033.yaml
  text: and through a window in a basket I was lowered through the wall and escaped his hands[a].
translation:
  language: fr
  text: Par une fenêtre dans la muraille, on m’a fait descendre dans une corbeille[a], et j’ai échappé à ses mains.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans un panier de cordes » ; le terme grec désigne une corbeille tressée, éventuellement faite de corde ou d’osier.
    reason: lexical_alternative
lexical_decisions:
- source_word: θυρίδος
  choice: fenêtre
  rationale: Le terme désigne une fenêtre ou une petite ouverture. « Fenêtre » est ici l’équivalent français le plus naturel et le plus précis.
- source_word: σαργάνῃ
  choice: corbeille
  rationale: Le mot désigne un grand récipient tressé, probablement fait de corde ou d’osier. « Corbeille » convient au transport d’une personne et reste clair en français courant ; la nuance du matériau est signalée en note.
- source_word: ἐχαλάσθην
  choice: l’on m’a fait descendre
  rationale: Le passif de χαλάω exprime ici une descente effectuée par d’autres, vraisemblablement à l’aide de cordes. Cette tournure conserve l’agent indéterminé tout en évitant le peu naturel « j’ai été descendu ».
- source_word: διὰ τοῦ τείχους
  choice: à travers la muraille
  rationale: La préposition indique un passage à travers la muraille, grâce à la fenêtre qui y était ménagée. « Muraille » rend naturellement le mur défensif sans ajouter explicitement « de la ville ».
- source_word: ἐξέφυγον τὰς χεῖρας αὐτοῦ
  choice: j’ai échappé à ses mains
  rationale: Cette formulation garde l’image vive des « mains », qui évoquent l’emprise ou le pouvoir de l’homme mentionné dans le contexte, sans réduire l’expression au plus neutre « je lui ai échappé ».
theological_decisions: []
translation_notes:
  register: Français moderne, courant et digne. La formulation reste proche de l’ordre et des images du grec, tout en employant une tournure passive naturelle en français.
