id: 2CO.11.16
reference: 2 Corinthians 11:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Πάλιν λέγω, μή τίς με δόξῃ ἄφρονα εἶναι— εἰ δὲ μή γε, κἂν ὡς ἄφρονα δέξασθέ με, ἵνα κἀγὼ μικρόν τι καυχήσωμαι·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/016.yaml
  text: Again I say[a], let no one think me to be foolish—but if not, then receive me even as foolish, so that I too may boast a little.
translation:
  language: fr
  text: 'Je le répète : que personne ne me considère comme insensé[a]. Sinon, acceptez-moi au moins comme un insensé, afin que moi aussi, je puisse me vanter un peu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec peut aussi se traduire : « que personne ne pense que je suis un insensé ». Le mot ἄφρων peut être compris comme un adjectif (« insensé ») ou comme un nom (« un insensé »).'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάλιν λέγω
  choice: Je le répète
  rationale: Cette formulation française naturelle exprime de manière concise la répétition marquée par Πάλιν et l’acte de parole de λέγω.
- source_word: μή τίς με δόξῃ ἄφρονα εἶναι
  choice: que personne ne me considère comme insensé
  rationale: La tournure rend l’exhortation négative exprimée par μή avec le subjonctif et traduit naturellement δοκέω avec l’infinitif. « Insensé » conserve le jugement sévère et rhétorique porté sur Paul.
- source_word: εἰ δὲ μή γε
  choice: Sinon
  rationale: Dans ce contexte, la formule introduit la concession qui suit si les destinataires n’accèdent pas à la demande précédente. « Sinon » est direct et idiomatique.
- source_word: κἂν ὡς ἄφρονα δέξασθέ με
  choice: acceptez-moi au moins comme un insensé
  rationale: « Au moins » restitue la nuance concessive de κἂν, tandis qu’« acceptez-moi » rend δέξασθέ με sans préciser abusivement la nature de cet accueil.
- source_word: ἵνα κἀγὼ μικρόν τι καυχήσωμαι
  choice: afin que moi aussi, je puisse me vanter un peu
  rationale: « Afin que » exprime la visée introduite par ἵνα, « moi aussi » garde l’insistance de κἀγώ, et « me vanter » maintient le vocabulaire explicite et ironique de καυχάομαι.
theological_decisions:
- issue: L’autodésignation ironique de Paul au moyen de ἄφρων et son recours à la vantardise
  choice: Conserver les termes « insensé » et « me vanter » sans atténuer leur force
  alternative: Paraphraser par « déraisonnable » ou « parler imprudemment », et adoucir « se vanter »
  rationale: Paul adopte provisoirement, avec ironie, la posture que ses destinataires pourraient qualifier d’insensée. Le texte doit conserver la tension entre son refus d’être jugé insensé et sa demande d’être néanmoins accepté sous cette apparence afin de se vanter un peu.
translation_notes:
  register: Français international moderne, clair et digne. « Je le répète » évite une formulation inutilement calquée, tandis que « acceptez-moi au moins » conserve le mouvement concessif de l’argument. Le tiret grec est rendu par une nouvelle phrase pour assurer une ponctuation française fluide sans supprimer le contraste.
