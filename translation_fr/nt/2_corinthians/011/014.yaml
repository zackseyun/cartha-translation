source:
  edition: SBLGNT
  text: καὶ οὐ ⸀θαῦμα, αὐτὸς γὰρ ὁ Σατανᾶς μετασχηματίζεται εἰς ἄγγελον φωτός·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/014.yaml
  text: And no wonder[a], for Satan himself disguises himself as an angel of light.
translation:
  language: fr
  text: Et cela n’a rien d’étonnant[a], car Satan lui-même se déguise en ange de lumière.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Et ce n’est pas surprenant »; on peut aussi traduire la suite : « car Satan lui-même se transforme en ange de lumière ». Le verbe grec signifie littéralement « changer de forme » ou « changer d’apparence »; dans ce contexte, il évoque probablement une apparence trompeuse.'
    reason: Signaler l’équivalent idiomatique de οὐ θαῦμα et préserver l’autre traduction possible de μετασχηματίζεται.
lexical_decisions:
- source_word: καὶ
  choice: Et
  rationale: Conserve le lien avec le verset précédent et la progression de l’argument.
- source_word: οὐ θαῦμα
  choice: rien d’étonnant à cela
  rationale: Expression idiomatique en français moderne qui rend le sens de « ce n’est pas surprenant » tout en renvoyant naturellement à ce qui précède.
- source_word: γὰρ
  choice: puisque
  rationale: Introduit avec naturel la raison pour laquelle la situation évoquée n’a rien d’étonnant.
- source_word: αὐτὸς ... ὁ Σατανᾶς
  choice: Satan lui-même
  rationale: Rend la valeur intensive de αὐτός; l’article grec devant le nom propre ne demande pas d’article en français.
- source_word: μετασχηματίζεται εἰς
  choice: se déguise en
  rationale: Dans ce contexte de tromperie et d’apparences, cette formulation naturelle exprime un changement de présentation sans affirmer une transformation de nature.
- source_word: ἄγγελον φωτός
  choice: ange de lumière
  rationale: Conserve directement l’image grecque et son contraste implicite avec l’identité de Satan.
theological_decisions:
- issue: Nature du changement de Satan
  choice: Une apparence trompeuse exprimée par « se déguise en »
  alternative: Une transformation effective, rendue par « se transforme en »
  rationale: Le contexte immédiat porte sur de faux apôtres qui prennent une autre apparence. La traduction principale fait ressortir cette tromperie sans trancher par une affirmation métaphysique; la possibilité lexicale plus littérale est conservée en note.
translation_notes:
  register: Français international moderne, clair et digne. « Rien d’étonnant à cela » assure la continuité avec le contexte; « se déguise en » rend naturellement l’idée de tromperie, tandis que la note conserve la formulation plus littérale et l’ambiguïté lexicale.
