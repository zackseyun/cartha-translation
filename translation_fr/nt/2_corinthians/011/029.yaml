translation:
  language: fr
  text: Qui est faible sans que je le sois ? Qui est amené à tomber sans que, moi, je brûle[a] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec dit littéralement : « sans que, moi, je brûle ». Cette image peut exprimer une douleur intense, du zèle ou de l’indignation.'
    reason: alternative lexicale et préservation de l’ambiguïté métaphorique
lexical_decisions:
- source_word: ἀσθενεῖ / ἀσθενῶ
  choice: est faible / sois faible
  rationale: « Être faible » conserve l'étendue du grec, qui peut désigner une faiblesse physique, sociale ou spirituelle. L'ajout idiomatique « moi aussi » exprime la solidarité soulignée par le pronom ἐγώ.
- source_word: σκανδαλίζεται
  choice: vient à tomber
  rationale: Le passif grec évoque une personne que quelque chose fait trébucher ou entraîne vers une chute morale ou spirituelle. Cette formulation française garde l'image de la chute sans imposer qu'il s'agisse seulement d'offense ou d'un péché déjà consommé.
- source_word: πυροῦμαι
  choice: brûle intérieurement
  rationale: Le verbe signifie littéralement « brûler, être embrasé » et décrit ici une vive réaction intérieure. La traduction maintient la métaphore sans préciser indûment s'il s'agit surtout de douleur, de zèle ou d'indignation.
- source_word: τίς
  choice: Qui
  rationale: Le pronom introduit deux questions rhétoriques portant sur des personnes ; « qui » est son équivalent français naturel.
- source_word: καὶ οὐκ ἐγὼ
  choice: sans que je… moi aussi / sans que je…
  rationale: Cette structure française rend naturellement la participation emphatique de Paul exprimée par καί et par le pronom explicite ἐγώ.
theological_decisions:
- issue: Nature de la réaction de Paul exprimée par πυροῦμαι
  choice: Conserver la métaphore du feu sans nommer une émotion unique.
  alternative: « brûle d'indignation »
  rationale: Le grec exprime une agitation intérieure intense, mais ne détermine pas à lui seul si elle relève principalement de l'indignation, de la douleur ou du zèle. La traduction préserve cette tension pastorale et théologique.
- issue: Portée de σκανδαλίζεται
  choice: Garder l'image d'une chute provoquée sans définir précisément son résultat.
  alternative: « est entraîné dans le péché »
  rationale: Le verbe peut évoquer une occasion de chute, un égarement moral ou une ruine spirituelle. Une formulation plus précise fermerait prématurément cette pluralité de sens.
translation_notes:
  register: Français international moderne, naturel et digne. Les deux questions rhétoriques sont parallèles ; « moi aussi » explicite sans lourdeur l'emphase du premier ἐγώ. La métaphore du feu demeure dans le texte principal, tandis que la note en expose les nuances possibles.
