base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/028.yaml
  text: 'Apart from such external things[c][b][a], there is the daily pressure on me: concern for all the churches.'
translation:
  language: fr
  text: 'Sans compter tout le reste[a], il y a la pression qui s’exerce sur moi jour après jour[b] : le souci de toutes les Églises[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Sans parler des difficultés extérieures » ; ou : « Sans parler de ce que je n’ai pas mentionné ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « il y a mon fardeau quotidien » ; ou : « ce qui me presse chaque jour ».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « l’inquiétude pour toutes les Églises ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: χωρὶς τῶν παρεκτὸς
  choice: Sans compter tout le reste
  rationale: L’expression désigne ce qui s’ajoute à la liste précédente ou ce qui est laissé de côté. Cette formulation française conserve cette ouverture sans limiter nécessairement le sens aux seules épreuves extérieures.
- source_word: ἐπίστασίς μοι
  choice: la pression qui s’exerce sur moi
  rationale: ἐπίστασις peut évoquer une pression, un assaut ou quelque chose qui vient peser sur une personne. Le datif μοι est rendu par « sur moi », ce qui préserve la force vécue de l’expression.
- source_word: ἡ καθ’ ἡμέραν
  choice: jour après jour
  rationale: La locution indique une réalité récurrente, éprouvée quotidiennement. « Jour après jour » est naturel en français et souligne cette continuité.
- source_word: ἡ μέριμνα
  choice: le souci
  rationale: μέριμνα peut désigner le souci, la préoccupation ou l’anxiété. « Souci » garde à la fois le sens de la sollicitude pastorale et celui d’un poids intérieur, sans imposer un jugement moral.
- source_word: πασῶν τῶν ἐκκλησιῶν
  choice: de toutes les Églises
  rationale: Dans ce contexte paulinien, ἐκκλησίαι désigne les communautés chrétiennes. « Églises » est la formulation française usuelle, et le génitif est naturellement rendu par « de » après « souci ».
theological_decisions:
- issue: Nuance de la charge pastorale exprimée par μέριμνα
  choice: le souci de toutes les Églises
  alternative: l’inquiétude pour toutes les Églises
  rationale: « Souci » laisse entendre une sollicitude réelle et pesante sans présenter cette disposition comme une inquiétude moralement fautive. Il préserve ainsi la tension entre soin pastoral et fardeau intérieur.
translation_notes:
  register: Français international actuel, naturel et digne. La phrase conserve la structure cumulative du grec et explicite seulement ce qui est nécessaire à une lecture fluide. Les variantes en note maintiennent les ambiguïtés de χωρὶς τῶν παρεκτός, de ἐπίστασις et de μέριμνα.
