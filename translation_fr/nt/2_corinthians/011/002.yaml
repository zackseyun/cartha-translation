id: 2CO.11.2
reference: 2 Corinthians 11:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ζηλῶ γὰρ ὑμᾶς θεοῦ ζήλῳ, ἡρμοσάμην γὰρ ὑμᾶς ἑνὶ ἀνδρὶ παρθένον ἁγνὴν παραστῆσαι τῷ Χριστῷ·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/002.yaml
  text: For I am jealous for you with God's jealousy[a], because I betrothed you to one husband[b], to present you as a pure virgin to Messiah.
translation:
  language: fr
  text: 'Car j’éprouve à votre égard la jalousie de Dieu[a] : je vous ai en effet fiancés à un seul époux, afin de vous présenter au Messie[b] comme une vierge pure.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une jalousie selon Dieu » ou « une jalousie divine ». Le grec peut désigner la jalousie qui appartient à Dieu ou une jalousie caractérisée par lui.
    reason: lexical_alternative
  - marker: b
    text: Ou « au Christ ». Le grec emploie le titre Christ, c’est-à-dire Messie.
    reason: alternative_rendering
lexical_decisions:
- source_word: ζηλῶ
  choice: j’éprouve à votre égard la jalousie
  rationale: Le verbe peut exprimer le zèle ou une jalousie protectrice. La métaphore des fiançailles favorise ici « jalousie », sans connotation d’envie mesquine.
- source_word: θεοῦ ζήλῳ
  choice: la jalousie de Dieu
  rationale: Cette formulation suit le génitif grec et préserve l’ambiguïté entre une jalousie qui appartient à Dieu et une jalousie conforme à Dieu.
- source_word: ἡρμοσάμην
  choice: je vous ai fiancés
  rationale: Le verbe désigne l’action de promettre ou d’unir en mariage. « Fiancer » conserve clairement l’image nuptiale dans un français actuel.
- source_word: ἑνὶ ἀνδρὶ
  choice: à un seul époux
  rationale: ἀνήρ peut signifier « homme » ou « mari » ; dans cette métaphore nuptiale, « époux » exprime naturellement le sens contextuel tout en soulignant l’exclusivité de l’union.
- source_word: παρθένον ἁγνὴν
  choice: comme une vierge pure
  rationale: La traduction conserve à la fois l’image collective de la vierge et l’idée de pureté morale portée par ἁγνήν.
- source_word: παραστῆσαι
  choice: afin de vous présenter
  rationale: « Présenter » rend directement l’idée d’amener quelqu’un devant une autre personne, avec la solennité appropriée au contexte.
- source_word: τῷ Χριστῷ
  choice: au Messie
  rationale: Avec l’article et dans le rôle explicite de l’époux attendu, Χριστός garde ici sa valeur de titre ; « Messie » la rend de façon transparente.
theological_decisions:
- issue: Nature de la jalousie de Paul
  choice: Une jalousie protectrice rattachée à celle de Dieu
  alternative: Un simple zèle personnel qualifié de pieux
  rationale: Le génitif θεοῦ et l’image d’une union nuptiale exclusive évoquent la jalousie d’alliance de Dieu. La traduction maintient toutefois l’ambiguïté grammaticale au lieu d’en imposer une seule analyse.
- issue: Valeur de Χριστός
  choice: Messie
  alternative: Christ
  rationale: Dans cette construction, le terme désigne par son titre celui auquel la communauté est fiancée. « Christ » demeure possible dans l’usage chrétien français et est signalé en note.
translation_notes:
  register: Français international moderne, digne et accessible. « J’éprouve à votre égard » évite l’ambiguïté courante de « je suis jaloux de vous », qui pourrait suggérer que Paul envie les Corinthiens. La syntaxe conserve les deux articulations causales du grec par « car » et « en effet ».
