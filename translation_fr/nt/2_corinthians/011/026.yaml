id: 2CO.11.26
reference: 2 Corinthians 11:26
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁδοιπορίαις πολλάκις, κινδύνοις ποταμῶν, κινδύνοις λῃστῶν, κινδύνοις ἐκ γένους, κινδύνοις ἐξ ἐθνῶν, κινδύνοις ἐν πόλει, κινδύνοις ἐν ἐρημίᾳ, κινδύνοις ἐν θαλάσσῃ, κινδύνοις ἐν ψευδαδέλφοις,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/026.yaml
  text: often on journeys[a], in dangers from rivers, in dangers from robbers, in dangers from my own people, in dangers from Gentiles, in dangers in the city, in dangers in the wilderness, in dangers at sea, in dangers among false brothers[b],
translation:
  language: fr
  text: souvent en voyage, en danger à cause des cours d’eau, en danger à cause des brigands, en danger de la part de mon propre peuple[a], en danger de la part des non-Juifs, en danger en ville, en danger dans les régions désertes, en danger en mer, en danger parmi de faux frères[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « de ma parenté » ou « de mon peuple »; on peut aussi comprendre « de ma nation ».
    reason: lexical_alternative
  - marker: b
    text: Ou « parmi de faux croyants ». Le grec dit littéralement « parmi de faux frères ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁδοιπορίαις πολλάκις
  choice: souvent en voyage
  rationale: Cette formulation française naturelle rend le datif pluriel accompagné de l’adverbe πολλάκις et conserve l’idée de déplacements fréquents.
- source_word: κινδύνοις
  choice: en danger
  rationale: La répétition de « en danger » reproduit l’accumulation rhétorique du grec dans une langue actuelle et claire.
- source_word: ποταμῶν
  choice: à cause des cours d’eau
  rationale: « Cours d’eau » couvre sans précision excessive les fleuves et rivières que peut désigner ποταμοί, tout en laissant implicite la nature exacte du danger.
- source_word: λῃστῶν
  choice: à cause des brigands
  rationale: « Brigands » convient au contexte des voyages et rend λῃσταί, qui désigne des voleurs ou bandits.
- source_word: ἐκ γένους
  choice: de la part de mon propre peuple
  rationale: Dans l’opposition avec ἐξ ἐθνῶν, γένος désigne le groupe ethnique auquel Paul appartient. La formulation reste naturelle sans ajouter explicitement « Juifs » au texte grec.
- source_word: ἐξ ἐθνῶν
  choice: de la part des non-Juifs
  rationale: Le contraste avec le propre peuple de Paul donne ici à ἔθνη le sens des peuples autres que les Juifs. « Non-Juifs » est immédiatement compréhensible en français moderne.
- source_word: ἐν πόλει
  choice: en ville
  rationale: Le singulier grec a ici une valeur générique. « En ville » la restitue idiomatiquement sans imposer une ville précise.
- source_word: ἐν ἐρημίᾳ
  choice: dans les régions désertes
  rationale: Cette expression garde l’étendue de sens de ἐρημία, qui peut désigner le désert, la solitude ou une contrée inhabitée.
- source_word: ἐν θαλάσσῃ
  choice: en mer
  rationale: « En mer » est l’expression française idiomatique correspondant exactement à ce type de danger maritime.
- source_word: ἐν ψευδαδέλφοις
  choice: parmi de faux frères
  rationale: La traduction conserve le substantif masculin composé ψευδάδελφοι et son idée de personnes se présentant comme des frères sans l’être véritablement.
theological_decisions:
- issue: Sens et genre de ψευδαδέλφοις
  choice: parmi de faux frères
  alternative: parmi de faux croyants
  rationale: Le grec emploie explicitement le masculin pluriel « faux frères ». Le conserver évite de généraliser ou d’interpréter leur statut spirituel au-delà de la formulation source.
- issue: Opposition entre ἐκ γένους et ἐξ ἐθνῶν
  choice: de la part de mon propre peuple / de la part des non-Juifs
  alternative: de la part de ma nation / de la part des nations
  rationale: Le contexte établit une opposition ethnique entre le peuple auquel Paul appartient et les autres peuples. La formulation choisie rend cette opposition clairement sans insérer le mot « Juifs » dans la première expression.
translation_notes:
  register: Fragment de liste au registre digne mais courant. La répétition de « en danger » est volontaire afin de préserver la cadence insistante du grec. « Non-Juifs » a été préféré à « païens » ou « Gentils », termes susceptibles d’être moins transparents ou de porter des connotations étrangères au contraste immédiat.
