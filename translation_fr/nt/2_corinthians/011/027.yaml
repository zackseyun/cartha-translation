  text: ⸀κόπῳ καὶ μόχθῳ, ἐν ἀγρυπνίαις πολλάκις, ἐν λιμῷ καὶ δίψει, ἐν νηστείαις πολλάκις, ἐν ψύχει καὶ γυμνότητι·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/027.yaml
  text: in labor and hardship[a], in many sleepless nights, in hunger and thirst, in frequent fastings[b], in cold and exposure.
translation:
  language: fr
  text: dans le labeur et la peine, lors de fréquentes nuits sans sommeil, dans la faim et la soif, dans des jeûnes fréquents[a], dans le froid et le manque de vêtements[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec parle de jeûnes répétés, sans préciser s’ils étaient volontaires ou imposés par les circonstances.
    reason: lexical_alternative
  - marker: b
    text: Ou «la nudité». Ici, il peut s’agir d’un manque de vêtements adéquats et de l’exposition aux éléments.
    reason: lexical_alternative
lexical_decisions:
- source_word: κόπῳ καὶ μόχθῳ
  choice: dans le travail pénible et les épreuves
  rationale: Le premier terme évoque un effort épuisant, et le second la peine ou les difficultés qui l’accompagnent. Cette formulation naturelle conserve le caractère cumulatif du couple grec sans fondre les deux termes en un seul.
- source_word: ἐν ἀγρυπνίαις πολλάκις
  choice: souvent privé de sommeil
  rationale: ἀγρυπνία désigne l’état de veille ou la privation de sommeil. Cette tournure moderne exprime clairement des épisodes répétés sans supposer qu’il s’agissait de veilles volontaires.
- source_word: ἐν λιμῷ καὶ δίψει
  choice: dans la faim et la soif
  rationale: Les datifs désignent des conditions pénibles endurées. La formulation conserve le parallélisme sobre de l’énumération grecque.
- source_word: ἐν νηστείαις πολλάκις
  choice: souvent dans le jeûne
  rationale: νηστεία désigne le jeûne et reste distinct de λιμός, la faim, déjà mentionnée. Le français retenu préserve cette distinction tout en laissant ouverte la question de savoir si ces jeûnes étaient volontaires ou dus aux circonstances.
- source_word: ἐν ψύχει
  choice: dans le froid
  rationale: ψῦχος désigne le froid comme condition subie; «dans le froid» est idiomatique et fidèle au contexte.
- source_word: γυμνότητι
  choice: dénuement
  rationale: γυμνότης peut désigner la nudité, mais, associé au froid dans cette liste d’épreuves, il peut évoquer le manque de vêtements et l’exposition aux éléments. «Dénuement» rend cette portée sans imposer la nudité complète.
theological_decisions:
- issue: Sens de νηστείαις dans la liste des épreuves de Paul
  choice: jeûne
  alternative: privation involontaire de nourriture
  rationale: Le mot grec désigne explicitement le jeûne, tandis que la faim est mentionnée séparément. La traduction maintient donc la distinction lexicale, et la note préserve l’incertitude quant au caractère volontaire ou subi de ces jeûnes.
- issue: Portée de γυμνότητι
  choice: dénuement
  alternative: nudité
  rationale: Dans l’association «froid et γυμνότης», le terme peut renvoyer à l’insuffisance des vêtements et à l’exposition. Le choix principal reste naturel en français et l’autre sens possible est signalé en note.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition exacte de ἐν est légèrement assouplie devant «souvent privé de sommeil» pour éviter une tournure lourde, tout en maintenant le rythme de l’énumération. Les deux ambiguïtés principales, νηστεία et γυμνότης, sont conservées au moyen de notes.
