  text: Why? Because I do not love you? God knows I do.
translation:
  language: fr
  text: Pourquoi ? Parce que je ne vous aime pas ? Dieu le sait.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « Dieu sait. » Le grec n''énonce pas la réponse sous-entendue à la question rhétorique.'
    reason: alternative_lexicale
lexical_decisions:
- source_word: διὰ τί
  choice: Pourquoi ?
  rationale: Interrogation concise et naturelle qui conserve la force rhétorique du grec.
- source_word: ὅτι
  choice: Parce que
  rationale: Dans cet enchaînement, ὅτι introduit naturellement la raison envisagée sous forme de question.
- source_word: οὐκ ἀγαπῶ ὑμᾶς
  choice: je ne vous aime pas
  rationale: Rend directement la négation, le verbe ἀγαπάω et son objet, dans un registre courant et digne.
- source_word: ὁ θεὸς
  choice: Dieu
  rationale: Équivalent français usuel de θεός dans ce contexte.
- source_word: οἶδεν
  choice: le sait
  rationale: Le pronom « le » reprend en français le contenu de la question précédente tout en évitant d'expliciter comme fait lexical l'implication « que je vous aime ».
theological_decisions:
- issue: Faut-il expliciter la réponse positive sous-entendue après l'appel à la connaissance de Dieu ?
  choice: Dieu le sait.
  alternative: Dieu sait que je vous aime.
  rationale: Le grec dit seulement « Dieu sait » et laisse la réponse à la question rhétorique implicite. « Dieu le sait » est naturel en français et préserve cette retenue ainsi que la tension rhétorique.
translation_notes:
  register: Français international moderne, concis et digne. La formulation conserve les deux questions rhétoriques et évite de rendre explicite dans le texte principal ce que le grec laisse sous-entendu.
