source:
  edition: SBLGNT
  text: Ἑβραῖοί εἰσιν; κἀγώ. Ἰσραηλῖταί εἰσιν; κἀγώ. σπέρμα Ἀβραάμ εἰσιν; κἀγώ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/022.yaml
  text: Are they Hebrews? So am I[a]. Are they Israelites? So am I. Are they Abraham’s offspring? So am I.
translation:
  language: fr
  text: Sont-ils Hébreux ? Moi aussi. Sont-ils Israélites ? Moi aussi. Sont-ils de la descendance d’Abraham ? Moi aussi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἑβραῖοί
  choice: Hébreux
  rationale: Le terme français établi conserve la désignation ethnoculturelle et religieuse ainsi que le parallélisme rhétorique.
- source_word: κἀγώ
  choice: Moi aussi
  rationale: Cette formulation brève et emphatique rend naturellement la contraction de καί et ἐγώ, répétée trois fois.
- source_word: Ἰσραηλῖται
  choice: Israélites
  rationale: Ce terme précis exprime l’appartenance à Israël et maintient la distinction voulue avec « Hébreux » et la descendance d’Abraham.
- source_word: σπέρμα Ἀβραάμ
  choice: de la descendance d’Abraham
  rationale: « Descendance » est naturel en français et peut avoir une valeur collective, tout en reflétant le lien généalogique exprimé par σπέρμα.
- source_word: εἰσιν
  choice: Sont-ils
  rationale: L’inversion interrogative restitue clairement la succession de questions rhétoriques, tandis que la réponse elliptique française évite une répétition artificielle du verbe.
theological_decisions:
- issue: Distinction entre les trois désignations de l’identité juive
  choice: Conserver « Hébreux », « Israélites » et « descendance d’Abraham » comme trois expressions distinctes
  alternative: Les ramener à une seule désignation générale, telle que « Juifs »
  rationale: L’accumulation de termes qui se recoupent sans être identiques structure l’argument de Paul et ne doit pas être aplatie.
translation_notes:
  register: Français moderne, digne et direct. La triple construction interrogative et la réponse elliptique « Moi aussi » préservent le rythme bref, insistant et combatif du grec.
