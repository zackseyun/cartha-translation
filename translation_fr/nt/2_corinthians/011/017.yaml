reference: 2 Corinthians 11:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὃ λαλῶ οὐ ⸂κατὰ κύριον λαλῶ⸃, ἀλλ’ ὡς ἐν ἀφροσύνῃ, ἐν ταύτῃ τῇ ὑποστάσει τῆς καυχήσεως.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/017.yaml
  text: What I am saying[a], I am not saying according to the Lord, but as in foolishness[c][b], in this confidence of boasting.
translation:
  language: fr
  text: Ce que je dis, je ne le dis pas selon le Seigneur[a], mais comme dans la folie[b], dans cette assurance de me vanter[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « comme venant du Seigneur » ou « d’après la norme du Seigneur ».'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « comme si j’étais insensé »; plus idiomatiquement : « comme un insensé ».'
    reason: lexical_alternative
  - marker: c
    text: Le mot grec traduit par « assurance » peut aussi signifier ici « base », « matière » ou « entreprise ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃ λαλῶ
  choice: Ce que je dis
  rationale: Le pronom relatif neutre introduit le contenu des paroles présentes de Paul. Cette formulation naturelle conserve la valeur du présent.
- source_word: κατὰ κύριον
  choice: selon le Seigneur
  rationale: κατά avec l’accusatif peut exprimer une norme ou une référence. « Selon le Seigneur » préserve l’ambiguïté entre la manière, la norme et l’autorité du Seigneur.
- source_word: κύριον
  choice: Seigneur
  rationale: Dans ce contexte, κύριος renvoie très probablement au Seigneur Jésus; le titre traditionnel et naturel « Seigneur » convient sans explicitation supplémentaire.
- source_word: ἀλλ’ ὡς ἐν ἀφροσύνῃ
  choice: mais comme dans la déraison
  rationale: La tournure garde la comparaison introduite par ὡς et l’idée d’un discours situé dans le registre de l’ἀφροσύνη, sans faire dire directement à Paul qu’il est insensé.
- source_word: ἐν ταύτῃ τῇ ὑποστάσει
  choice: avec cette assurance
  rationale: ὑπόστασις est polysémique et peut désigner ici une assurance, une base ou une posture ferme. « Avec cette assurance » est intelligible en français et convient au contexte de la vantardise, tandis qu’une note conserve les autres possibilités.
- source_word: τῆς καυχήσεως
  choice: de me vanter
  rationale: L’infinitif français rend naturellement la force verbale de καύχησις et rattache clairement l’assurance à l’acte de se vanter.
theological_decisions:
- issue: Référent et portée de « selon le Seigneur »
  choice: La traduction laisse entendre que Paul ne parle pas ici selon la manière, la norme ou le modèle du Seigneur.
  alternative: Paul pourrait vouloir dire qu’il ne transmet pas une parole ou un ordre reçu directement du Seigneur.
  rationale: Le grec ne tranche pas explicitement entre la norme, la manière et la provenance. La formulation retenue préserve cette tension sans laisser entendre que Paul renie nécessairement la vérité ou l’autorité de ses propos.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche du mouvement de la phrase grecque, tandis que « avec cette assurance de me vanter » évite une construction nominale excessivement lourde. Les notes signalent les ambiguïtés réelles sans imposer une interprétation théologique.
