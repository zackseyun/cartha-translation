id: 2CO.11.10
reference: 2 Corinthians 11:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἔστιν ἀλήθεια Χριστοῦ ἐν ἐμοὶ ὅτι ἡ καύχησις αὕτη οὐ φραγήσεται εἰς ἐμὲ ἐν τοῖς κλίμασι τῆς Ἀχαΐας.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/010.yaml
  text: As the truth of Messiah is in me[c][b][a], this boasting of mine will not be silenced in the regions of Achaia.
translation:
  language: fr
  text: Aussi vrai que la vérité du Messie est en moi[a], ce sujet de fierté qui est le mien ne me sera pas ôté[b] dans les régions de l’Achaïe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « La vérité du Christ est en moi » ; plus littéralement, on peut aussi comprendre : « La vérité du Messie est en moi : … »'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « cette fierté ne sera pas réduite au silence », « ne sera pas arrêtée en ce qui me concerne » ou « ne me sera pas fermée ». L’expression grecque est imagée et difficile.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλήθεια Χριστοῦ
  choice: la vérité du Messie
  rationale: 'Le génitif est conservé sans en préciser excessivement la relation : il peut désigner la vérité qui appartient au Messie ou qui se rapporte à lui. « Messie » rend ici la valeur titulaire de Χριστός.'
- source_word: ἐν ἐμοὶ
  choice: est en moi
  rationale: La formulation directe préserve l’affirmation solennelle de Paul sans expliquer si cette vérité habite en lui ou caractérise sa parole.
- source_word: ὅτι
  choice: aussi vrai que
  rationale: Dans cette construction, ὅτι introduit le contenu d’une déclaration à valeur de serment. La tournure française restitue naturellement cette force solennelle.
- source_word: ἡ καύχησις αὕτη … εἰς ἐμὲ
  choice: cette fierté qui est la mienne
  rationale: Cette formulation idiomatique rattache à Paul la καύχησις tout en évitant le calque obscur « envers moi ». « Fierté » convient ici au fait ou au motif de se glorifier, sans imposer une connotation exclusivement négative.
- source_word: οὐ φραγήσεται
  choice: ne sera pas étouffée
  rationale: Le futur passif de φράσσω évoque littéralement ce qui est bouché, fermé ou arrêté. « Étouffée » conserve l’image d’une expression qu’on empêcherait de se faire entendre.
- source_word: ἐν τοῖς κλίμασι τῆς Ἀχαΐας
  choice: dans les régions de l’Achaïe
  rationale: Le pluriel κλίμασι désigne des régions ou des districts; la traduction en maintient la nuance géographique.
theological_decisions:
- issue: Valeur de Χριστοῦ
  choice: du Messie
  alternative: du Christ
  rationale: Χριστός garde ici sa valeur de titre. « Messie » la rend explicitement, tandis que « Christ » demeure une traduction traditionnelle possible.
- issue: Nature de la formule initiale
  choice: affirmation solennelle à valeur de serment
  alternative: 'simple affirmation : « La vérité du Messie est en moi : … »'
  rationale: Le lien entre ἔστιν ἀλήθεια Χριστοῦ ἐν ἐμοὶ et ὅτι donne naturellement à la phrase la force de « aussi vrai que », mais la syntaxe grecque peut être reproduite plus littéralement sans cette explicitation.
translation_notes:
  register: Français international actuel, digne et oralement fluide. « Aussi vrai que » rend la solennité de la formule, tandis que les notes conservent l’ambiguïté syntaxique. « Achaïe » est la forme française usuelle du nom de la province romaine.
