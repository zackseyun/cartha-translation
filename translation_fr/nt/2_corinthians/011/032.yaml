source:
  edition: SBLGNT
  text: ἐν Δαμασκῷ ὁ ἐθνάρχης Ἁρέτα τοῦ βασιλέως ἐφρούρει τὴν ⸂πόλιν Δαμασκηνῶν⸃ πιάσαι ⸀με,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/032.yaml
  text: In Damascus[a], the ethnarch of King Aretas was guarding the city of the Damascenes in order to seize me,
translation:
  language: fr
  text: À Damas[a], l’ethnarque du roi Arétas gardait la ville des Damascènes afin de se saisir de moi,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la ville de Damas ». Le grec dit plus littéralement « la ville des Damascènes ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν Δαμασκῷ
  choice: À Damas
  rationale: Le français emploie naturellement « à » devant un nom de ville pour rendre la localisation exprimée par ἐν avec le datif.
- source_word: ἐθνάρχης
  choice: l’ethnarque
  rationale: Ce titre historique précis désigne le dirigeant d’un peuple ou d’un territoire; le conserver évite de le réduire au terme générique « gouverneur ».
- source_word: Ἁρέτα τοῦ βασιλέως
  choice: du roi Arétas
  rationale: Le génitif rattache naturellement l’ethnarque au roi Arétas, vraisemblablement comme son représentant, sans préciser davantage la nature de cette relation.
- source_word: ἐφρούρει
  choice: faisait garder
  rationale: L’imparfait restitue l’action continue de ἐφρούρει. La tournure causative est naturelle puisque l’ethnarque exerçait cette surveillance par l’intermédiaire de ses agents.
- source_word: τὴν πόλιν Δαμασκηνῶν
  choice: la ville des Damascènes
  rationale: Cette formulation reproduit le génitif pluriel substantivé Δαμασκηνῶν et préserve la tournure particulière du grec.
- source_word: πιάσαι με
  choice: afin de se saisir de moi
  rationale: L’infinitif aoriste marque le but. « Se saisir de moi » conserve la portée assez large et hostile de πιάζω sans imposer le sens juridique plus précis d’« arrêter ».
theological_decisions: []
translation_notes:
  register: Français moderne, digne et lisible. « Ethnarque » est maintenu comme titre historique précis; la note explique la tournure inhabituelle « ville des Damascènes ». La virgule finale est conservée puisque le verset se poursuit en 2 Corinthiens 11.33.
