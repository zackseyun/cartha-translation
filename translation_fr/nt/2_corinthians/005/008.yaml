  text: θαρροῦμεν δὲ καὶ εὐδοκοῦμεν μᾶλλον ἐκδημῆσαι ἐκ τοῦ σώματος καὶ ἐνδημῆσαι πρὸς τὸν κύριον·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/008.yaml
  text: So we are confident and would rather be away from the body and at home with the Lord[a].
translation:
  language: fr
  text: Nous avons donc pleine confiance, et nous préférons être loin du corps et demeurer auprès du Seigneur.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « être absent du corps et être chez nous auprès du Seigneur ».'
    reason: Alternative lexicale qui rend plus explicitement le contraste métaphorique entre ἐκδημέω, être absent de chez soi, et ἐνδημέω, être chez soi.
lexical_decisions:
- source_word: θαρροῦμεν
  choice: nous avons pleine confiance
  rationale: Le présent exprime une assurance ou un courage durable. Cette formulation est naturelle en français moderne et convient au contexte.
- source_word: δὲ
  choice: donc
  rationale: La particule assure ici la continuité et tire une conséquence des versets précédents, plutôt qu’elle n’introduit une forte opposition.
- source_word: καὶ
  choice: et
  rationale: La conjonction relie simplement θαρροῦμεν et εὐδοκοῦμεν.
- source_word: εὐδοκοῦμεν μᾶλλον
  choice: nous préférerions
  rationale: Dans cette construction comparative, le verbe et l’adverbe expriment ensemble une préférence. Le conditionnel français rend idiomatiquement « nous aimerions mieux » sans suggérer une incertitude doctrinale.
- source_word: ἐκδημῆσαι ἐκ τοῦ σώματος
  choice: être loin du corps
  rationale: Le verbe signifie se trouver loin de chez soi. « Être loin » conserve la métaphore spatiale sans expliciter la mort, tandis que « du corps » traduit littéralement le complément.
- source_word: ἐνδημῆσαι πρὸς τὸν κύριον
  choice: demeurer auprès du Seigneur
  rationale: Le verbe opposé à ἐκδημέω évoque le fait d’être chez soi ou de résider. « Demeurer auprès du Seigneur » rend naturellement la présence personnelle exprimée par πρός, tout en conservant l’écho résidentiel de la métaphore.
theological_decisions:
- issue: Faut-il expliciter une doctrine de l’état intermédiaire au-delà des mots du verset ?
  choice: Conserver l’image d’être loin du corps et de demeurer auprès du Seigneur, sans ajouter « après la mort » ni « au ciel ».
  alternative: 'Paraphraser : « mourir et aller au ciel auprès du Seigneur ».'
  rationale: Le passage implique une présence auprès du Seigneur hors du corps, mais le grec ne nomme ici ni la mort ni le ciel. La traduction préserve donc la formulation et la tension théologique du texte.
translation_notes:
  register: Français international moderne, digne et accessible. « Pleine confiance » évite une tournure archaïque; « demeurer auprès du Seigneur » est fluide tout en maintenant la métaphore du lieu de résidence. Le marqueur [a] figure dans le texte principal.
