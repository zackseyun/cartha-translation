    text: Ou « Dieu a fait de lui une offrande pour le péché ». Le grec emploie le mot « péché » dans les deux occurrences ; certains comprennent la seconde dans un sens sacrificiel.
    reason: alternative_reading
  - marker: b
    text: Ou « la justice venant de Dieu ». Le terme peut aussi se traduire par « justice » ; l’expression peut désigner la justice de Dieu ou une justice qui vient de lui.
    reason: lexical_alternative
