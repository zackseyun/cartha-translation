revisions:
- from: Celui qui n’a pas connu le péché, il l’a fait devenir péché pour nous[a], afin qu’en lui nous devenions la justice de Dieu[b].
  to: Celui qui n’avait pas connu le péché, Dieu l’a fait péché[a] pour nous, afin qu’en lui nous devenions la justice de Dieu[b].
  rationale: La révision rend directement ἐποίησεν par « Dieu l’a fait péché », sans ajouter l’idée de devenir, et simplifie la syntaxe française. Elle déplace l’appel de note sacrificielle sur le second « péché », auquel il se rapporte, et ajuste la seconde note afin de préserver les possibilités lexicales et la portée ouverte du génitif grec.
