source:
  edition: SBLGNT
  text: ⸀τὸν μὴ γνόντα ἁμαρτίαν ὑπὲρ ἡμῶν ἁμαρτίαν ἐποίησεν, ἵνα ἡμεῖς γενώμεθα δικαιοσύνη θεοῦ ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/021.yaml
  text: He made the one who did not know sin to be sin for us[b][a], so that in him we might become the righteousness of God.
translation:
  language: fr
  text: Celui qui n’avait pas connu le péché, Dieu l’a fait péché[a] pour nous, afin qu’en lui nous devenions la justice de Dieu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Dieu a fait de lui une offrande pour le péché ». Le grec emploie le mot « péché » dans les deux occurrences ; certains comprennent la seconde dans un sens sacrificiel.
    reason: alternative_reading
  - marker: b
    text: Ou « la justice venant de Dieu ». Le terme peut aussi se traduire par « justice » ; l’expression peut désigner la justice de Dieu ou une justice qui vient de lui.
    reason: lexical_alternative
lexical_decisions:
- source_word: γνόντα
  choice: n’a pas connu
  rationale: Le verbe signifie normalement « connaître ». Cette formulation conserve l’expression ramassée du grec et indique que le Christ n’a eu aucune participation personnelle au péché, sans paraphraser par « n’a pas commis de péché ».
- source_word: ἁμαρτίαν (première occurrence)
  choice: le péché
  rationale: Le nom abstrait est l’objet direct de « connaître ». Le conserver évite de développer inutilement la formulation de Paul.
- source_word: ὑπὲρ ἡμῶν
  choice: pour nous
  rationale: Cette expression française naturelle garde la portée représentative et bénéficiaire de la préposition sans l’enfermer dans une théorie particulière de l’expiation.
- source_word: ἁμαρτίαν (deuxième occurrence)
  choice: péché
  rationale: La répétition du même nom grec est maintenue. Le sens sacrificiel possible, « offrande pour le péché », est signalé en note plutôt qu’introduit dans le texte.
- source_word: ἐποίησεν
  choice: il l’a fait devenir
  rationale: Le grec dit littéralement qu’il « l’a fait péché ». L’ajout idiomatique de « devenir » rend la construction compréhensible en français tout en conservant son caractère saisissant et sans préciser davantage la nature de cette action.
- source_word: γενώμεθα
  choice: nous devenions
  rationale: Le subjonctif de γίνομαι exprime ici le but et un devenir, rendu naturellement après « afin que ».
- source_word: δικαιοσύνη
  choice: la justice
  rationale: « Justice » est l’équivalent français naturel dans ce contexte paulinien et garde ensemble les dimensions judiciaire, relationnelle et éthique du terme.
- source_word: θεοῦ
  choice: de Dieu
  rationale: Le génitif est conservé sans décider s’il désigne la justice propre à Dieu, une justice qui vient de Dieu ou une relation juste devant lui.
- source_word: ἐν αὐτῷ
  choice: en lui
  rationale: Cette expression concise conserve l’idiome paulinien et sa portée théologique sans l’expliciter par « en union avec lui ».
theological_decisions:
- issue: Sens de « il l’a fait devenir péché »
  choice: Maintenir la formulation selon laquelle Dieu a fait du Christ sans péché « péché » pour nous, sans laisser entendre qu’il serait devenu moralement pécheur.
  alternative: Comprendre « péché » au sens sacrificiel d’« offrande pour le péché ».
  rationale: La première proposition affirme l’absence de toute participation du Christ au péché. Le texte principal préserve néanmoins la formulation forte et la tension de Paul, tandis que la lecture sacrificielle plausible figure en note.
- issue: Portée de δικαιοσύνη θεοῦ
  choice: Traduire « la justice de Dieu » sans préciser le rapport exprimé par le génitif.
  alternative: « Une justice venant de Dieu » ou la justice propre à Dieu.
  rationale: L’expression grecque est dense et peut recevoir plusieurs nuances. La traduction ne tranche pas entre source, appartenance et relation.
translation_notes:
  register: Français international moderne, digne et accessible. La dislocation « Celui qui…, il l’a… » reproduit la mise en relief initiale du grec. La formule volontairement saisissante « devenir péché » et l’expression théologiquement ouverte « la justice de Dieu » sont conservées plutôt que résolues par une paraphrase.
