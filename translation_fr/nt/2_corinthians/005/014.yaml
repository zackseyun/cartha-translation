reference: 2 Corinthians 5:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἡ γὰρ ἀγάπη τοῦ Χριστοῦ συνέχει ἡμᾶς, κρίναντας τοῦτο ⸀ὅτι εἷς ὑπὲρ πάντων ἀπέθανεν· ἄρα οἱ πάντες ἀπέθανον·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/014.yaml
  text: 'For the love of Messiah compels us[a], because we have concluded this: that one died on behalf of all; therefore all died.'
translation:
  language: fr
  text: 'En effet, l’amour du Messie nous presse[a], puisque nous sommes arrivés à cette conclusion : un seul est mort pour tous ; donc tous sont morts.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’amour que le Messie éprouve » ou « l’amour pour le Messie » ; le génitif grec peut se comprendre dans l’un ou l’autre sens.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγάπη
  choice: amour
  rationale: « Amour » est l’équivalent français moderne et naturel de ἀγάπη, sans la connotation vieillie ou spécialisée de « charité ».
- source_word: τοῦ Χριστοῦ
  choice: du Messie
  rationale: Χριστός est ici rendu comme un titre. La tournure « du Messie » conserve en français l’ambiguïté du génitif grec.
- source_word: συνέχει
  choice: nous presse
  rationale: Le verbe exprime une force qui saisit et pousse à agir. « Nous presse » garde cette intensité sans le caractère potentiellement mécanique de « nous contrôle » ni la dureté excessive de « nous contraint ».
- source_word: κρίναντας τοῦτο
  choice: puisque nous sommes arrivés à cette conclusion
  rationale: Cette formulation rend naturellement la valeur causale du participe et le sens délibératif de κρίνω dans ce contexte.
- source_word: εἷς
  choice: un seul
  rationale: « Un seul » restitue la concision et l’accent numérique du grec sans ajouter explicitement « homme » ou « personne ».
- source_word: ὑπὲρ πάντων
  choice: pour tous
  rationale: « Pour tous » exprime naturellement l’action accomplie en faveur de tous, tout en évitant d’imposer à ὑπέρ le sens plus étroit de « à la place de ».
- source_word: ἄρα
  choice: donc
  rationale: « Donc » marque clairement et sobrement la conclusion logique tirée par Paul.
- source_word: οἱ πάντες ἀπέθανον
  choice: tous sont morts
  rationale: Le passé composé est idiomatique en français pour cet événement passé aux conséquences présentes. La formulation reste aussi concise que le grec et n’explicite pas le mode de participation à cette mort.
theological_decisions:
- issue: Valeur du génitif dans ἡ ἀγάπη τοῦ Χριστοῦ
  choice: Le texte principal conserve « l’amour du Messie ».
  alternative: « l’amour que le Messie a pour nous » ou « notre amour pour le Messie »
  rationale: Le génitif grec peut être subjectif ou objectif. La tournure française permet de préserver cette ambiguïté réelle, tandis que la note en expose les deux lectures.
- issue: Sens de « tous sont morts »
  choice: La proposition est traduite sans développement interprétatif.
  alternative: « tous sont morts représentativement dans le Messie » ou « tous les croyants sont morts avec lui »
  rationale: Le raisonnement évoque probablement une participation représentative à la mort du Messie, mais le verset demeure condensé. La traduction ne tranche donc ni le mode de participation ni la portée exacte de « tous ».
translation_notes:
  register: Français international moderne, digne et accessible. « En effet » rend γάρ sans lourdeur ; le point-virgule fait ressortir l’inférence serrée de la dernière proposition.
