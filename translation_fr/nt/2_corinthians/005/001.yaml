source:
  edition: SBLGNT
  text: Οἴδαμεν γὰρ ὅτι ἐὰν ἡ ἐπίγειος ἡμῶν οἰκία τοῦ σκήνους καταλυθῇ, οἰκοδομὴν ἐκ θεοῦ ἔχομεν οἰκίαν ἀχειροποίητον αἰώνιον ἐν τοῖς οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/001.yaml
  text: For we know that if our earthly tent-house is torn down[a], we have a building from God, a house not made with hands[d][c][b], eternal in the heavens.
translation:
  language: fr
  text: Car nous savons que, si notre demeure terrestre, cette tente, est démontée[a], nous avons[c] un édifice qui vient de Dieu, une demeure qui n’est pas faite de mains humaines[b], éternelle dans les cieux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « détruite » ou « abattue ». Le verbe grec peut désigner le démontage d’une construction, ce qui convient particulièrement à l’image de la tente.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « qui n’est pas faite de mains ». Cette expression biblique souligne une origine divine plutôt qu’humaine.
    reason: lexical_alternative
  - marker: c
    text: 'Le grec dit « nous avons », et non « nous aurons » : il maintient ainsi une tension entre possession présente et réalisation future.'
    reason: alternative_reading
lexical_decisions:
- source_word: Οἴδαμεν
  choice: nous savons
  rationale: Rend naturellement l’idée d’un savoir assuré exprimée par οἴδαμεν.
- source_word: γὰρ
  choice: Car
  rationale: Conserve le lien explicatif avec l’argument qui précède.
- source_word: ἐὰν ... καταλυθῇ
  choice: si ... est démontée
  rationale: La construction exprime une éventualité future, et « démontée » évoque adéquatement le démontage d’une tente sans exclure l’idée de destruction.
- source_word: ἡ ἐπίγειος ἡμῶν οἰκία τοῦ σκήνους
  choice: notre demeure terrestre, cette tente
  rationale: Cette formulation française garde ensemble les images de la demeure et de la tente, sans remplacer leur référent par le mot interprétatif « corps ».
- source_word: οἰκοδομὴν ἐκ θεοῦ
  choice: un édifice qui vient de Dieu
  rationale: « Édifice » prend οἰκοδομή au sens concret, tandis que « qui vient de Dieu » préserve la valeur d’origine de ἐκ θεοῦ.
- source_word: ἔχομεν
  choice: nous avons
  rationale: Maintient le présent grec et la tension entre possession présente et accomplissement futur.
- source_word: οἰκίαν ἀχειροποίητον
  choice: une demeure qui n’est pas faite de main humaine
  rationale: Conserve la résonance biblique de ἀχειροποίητος tout en employant une expression claire en français moderne.
- source_word: αἰώνιον
  choice: éternelle
  rationale: Marque le contraste entre la demeure terrestre provisoire et la demeure céleste durable.
- source_word: ἐν τοῖς οὐρανοῖς
  choice: dans les cieux
  rationale: Reproduit le pluriel du texte grec et son expression spatiale.
theological_decisions:
- issue: Référent des images de demeure et de tente
  choice: Conserver dans le texte les images architecturales de la demeure, de la tente et de l’édifice.
  alternative: Traduire directement par « corps » ou « corps terrestre ».
  rationale: Le grec superpose volontairement plusieurs images. Les remplacer par « corps » résoudrait dans la traduction ce que le texte exprime métaphoriquement.
- issue: Valeur temporelle de ἔχομεν
  choice: Employer le présent « nous avons ».
  alternative: Employer le futur « nous aurons ».
  rationale: Le verbe grec est au présent. La traduction préserve ainsi la tension entre une possession déjà affirmée et sa réalisation future possible.
- issue: Sens de ἀχειροποίητον
  choice: « qui n’est pas faite de main humaine »
  alternative: « surnaturelle » ou « créée directement par Dieu »
  rationale: La formulation retenue exprime l’opposition entre origine divine et fabrication humaine sans ajouter une explication doctrinale au texte.
translation_notes:
  register: Français international moderne, clair et digne. « Demeure terrestre, cette tente » restitue naturellement le double registre métaphorique du grec. « Démontée » prolonge l’image de la tente, tandis qu’une note signale les autres nuances possibles. Le pluriel « les cieux » et le présent « nous avons » sont conservés.
