  text: διὸ καὶ φιλοτιμούμεθα, εἴτε ἐνδημοῦντες εἴτε ἐκδημοῦντες, εὐάρεστοι αὐτῷ εἶναι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/009.yaml
  text: Therefore we also make it our ambition[a], whether at home or away, to be pleasing to him.
translation:
  language: fr
  text: C’est pourquoi nous avons aussi à cœur que nous soyons chez nous ou loin de chez nous[a], de lui être agréables.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de manière plus explicite d’après le contexte : « que nous soyons chez nous dans le corps ou loin du corps ».'
    reason: Précision contextuelle d’un complément laissé implicite dans le grec.
lexical_decisions:
- source_word: διὸ
  choice: C’est pourquoi
  rationale: Introduit naturellement la conséquence tirée de la réflexion précédente sur la vie dans le corps et la présence auprès du Seigneur.
- source_word: καὶ
  choice: aussi
  rationale: Marque la continuité et l’ajout sans alourdir la phrase.
- source_word: φιλοτιμούμεθα
  choice: nous avons à cœur
  rationale: Rend l’aspiration résolue et l’engagement exprimés par le verbe, dans un français actuel et digne; «nous ambitionnons» serait moins naturel et pourrait suggérer une ambition personnelle.
- source_word: εἴτε ἐνδημοῦντες εἴτε ἐκδημοῦντες
  choice: que nous soyons chez nous ou loin de chez nous
  rationale: Conserve l’image antithétique de la résidence et de l’éloignement ainsi que l’absence, en grec, de compléments explicites.
- source_word: εὐάρεστοι
  choice: agréables
  rationale: Exprime le fait d’être approuvé et de plaire, sans recourir au tour vieilli «bien agréables».
- source_word: αὐτῷ
  choice: lui
  rationale: Maintient le pronom grec, dont le référent est le Seigneur dans le contexte.
- source_word: εἶναι
  choice: être
  rationale: Conserve l’infinitif qui énonce le but de cette aspiration.
theological_decisions:
- issue: Faut-il expliciter le complément sous-entendu de «chez nous» et «loin de chez nous»?
  choice: Conserver dans le texte la formulation concise «que nous soyons chez nous ou loin de chez nous».
  alternative: «que nous soyons chez nous dans le corps ou loin du corps»
  rationale: Les versets 6 à 8 indiquent clairement que Paul parle de la demeure dans le corps et de l’éloignement du corps, mais le grec du verset 9 ne répète pas ces compléments. Le texte principal en préserve donc la concision, tandis qu’une note en précise le sens contextuel.
translation_notes:
  register: Français international moderne, naturel et digne. «Avoir à cœur» communique une aspiration volontaire et soutenue sans la connotation parfois mondaine d’«ambitionner». L’image spatiale concise du grec est maintenue dans le texte, avec son explicitation en note.
