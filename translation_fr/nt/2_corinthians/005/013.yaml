  text: εἴτε γὰρ ἐξέστημεν, θεῷ· εἴτε σωφρονοῦμεν, ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/013.yaml
  text: For if we are out of our minds[a], it is for God; if we are of sound mind[b], it is for you.
translation:
  language: fr
  text: Car si nous sommes hors de nous-mêmes[a], c’est pour Dieu ; si nous sommes dans notre bon sens[b], c’est pour vous.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « avons perdu la raison ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « sommes raisonnables » ; « sommes sains d’esprit ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴτε ... εἴτε
  choice: si ... si
  rationale: La répétition de « si » restitue naturellement en français la construction rhétorique condensée et son contraste, sans effacer la valeur d’alternative.
- source_word: γὰρ
  choice: En effet
  rationale: « En effet » marque avec naturel que cette phrase explique ou justifie ce qui précède.
- source_word: ἐξέστημεν
  choice: nous avons perdu la raison
  rationale: Cette expression française courante rend l’idée d’être hors de soi ou de paraître déraisonnable. Le passé composé respecte la forme aoriste tout en pouvant décrire un état dont la portée demeure actuelle.
- source_word: θεῷ
  choice: pour Dieu
  rationale: Le datif elliptique peut indiquer la destination, la référence ou l’intérêt. « Pour Dieu » reste concis et conserve cette relative ouverture.
- source_word: σωφρονοῦμεν
  choice: nous sommes raisonnables
  rationale: Le verbe désigne ici le fait d’avoir un jugement sain et mesuré. « Raisonnables » forme en français un contraste clair avec « perdu la raison », sans imposer le sens plus étroit de maîtrise de soi.
- source_word: ὑμῖν
  choice: pour vous
  rationale: 'Comme θεῷ, ce datif elliptique exprime naturellement la référence ou le bénéfice : la conduite sensée de Paul est orientée vers les Corinthiens.'
theological_decisions:
- issue: Sens du contraste dans la description que Paul donne de lui-même
  choice: La traduction oppose le fait d’avoir perdu la raison, ou d’être perçu ainsi, à une conduite raisonnable, sans affirmer une folie littérale.
  alternative: Paul pourrait viser une expérience religieuse extatique réelle, ou reprendre de façon hyperbolique une accusation portée contre lui.
  rationale: La formulation grecque est brève et rhétorique. La traduction maintient son contraste et son ambiguïté sans introduire une doctrine particulière de l’extase ni réduire les mots à une simple accusation adverse.
translation_notes:
  register: Français international moderne, clair et digne. « Perdre la raison » et « être raisonnables » rendent le jeu de contraste du grec dans une formulation accessible ; les variantes en note préservent les autres nuances lexicales possibles.
