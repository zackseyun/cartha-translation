- from: En effet, si nous avons perdu la raison[a], c’est pour Dieu ; si nous sommes raisonnables[b], c’est pour vous.
  to: Car si nous sommes hors de nous-mêmes[a], c’est pour Dieu ; si nous sommes dans notre bon sens[b], c’est pour vous.
  rationale: La révision rend le parfait grec comme un état actuel et maintient l’ambiguïté voulue entre une apparence d’excès religieux et un jugement sobre. Elle conserve la structure, les datifs elliptiques et le registre concis de l’original.
