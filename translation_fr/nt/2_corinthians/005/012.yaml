  terminology: « Nous recommander », « occasion », « se vanter », « apparence » et « cœur » rendent adéquatement les termes grecs et préservent l’antithèse rhétorique. « À notre sujet » reste ouvert entre le thème de la vantardise et une nuance de soutien en faveur de Paul.
