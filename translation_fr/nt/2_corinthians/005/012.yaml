  to: Nous ne nous recommandons pas de nouveau auprès de vous, mais nous vous donnons l’occasion[a] de vous vanter à notre sujet, afin que vous ayez de quoi répondre à ceux qui se vantent de l’apparence et non de ce qui est dans le cœur[b].
  rationale: La révision supprime l’ajout interprétatif « cherchons ... à » et rend le présent grec de manière directe. Elle rétablit également la cohérence lexicale entre καυχήματος et καυχωμένους, tout en conservant une formulation française claire et l’ambiguïté appropriée de ὑπὲρ ἡμῶν. La note b explique sans trancher au-delà du contraste textuel entre extérieur et cœur.
