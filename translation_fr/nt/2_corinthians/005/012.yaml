source:
  edition: SBLGNT
  text: ⸀οὐ πάλιν ἑαυτοὺς συνιστάνομεν ὑμῖν, ἀλλὰ ἀφορμὴν διδόντες ὑμῖν καυχήματος ὑπὲρ ἡμῶν, ἵνα ἔχητε πρὸς τοὺς ἐν προσώπῳ καυχωμένους καὶ ⸂μὴ ἐν⸃ καρδίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/012.yaml
  text: We are not commending ourselves to you again[a], but giving you an opportunity to boast about us[b], so that you may have an answer for those who boast in outward appearance and not in heart.
translation:
  language: fr
  text: Nous ne nous recommandons pas de nouveau auprès de vous, mais nous vous donnons l’occasion[a] de vous vanter à notre sujet, afin que vous ayez de quoi répondre à ceux qui se vantent de l’apparence et non de ce qui est dans le cœur[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un motif de vous vanter à notre sujet » ou « une occasion de vous prévaloir de nous ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « ceux qui se vantent dans le visage et non dans le cœur » ; l’expression oppose ce qui est extérieur à ce qui relève du cœur.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνιστάνομεν
  choice: cherchons […] à nous recommander
  rationale: Dans ce contexte, le verbe désigne l’action de se présenter favorablement ou de faire valoir ses propres qualités. « Nous recommander » conserve le sens relationnel sans suggérer une simple présentation.
- source_word: ἀφορμὴν
  choice: l’occasion
  rationale: Le nom peut désigner un point de départ, un motif ou une occasion. « L’occasion » est naturel en français et exprime ce que Paul fournit aux Corinthiens.
- source_word: καυχήματος
  choice: d’être fiers
  rationale: Cette tournure française exprime ici une fierté assumée à l’égard de Paul et de ses collaborateurs, sans la connotation nécessairement négative de « se vanter ».
- source_word: ὑπὲρ ἡμῶν
  choice: de nous
  rationale: Dans cette construction, ὑπέρ peut indiquer le sujet ou l’objet de la fierté, avec une possible nuance de soutien. « De nous » reste naturel et suffisamment ouvert.
- source_word: ἵνα ἔχητε πρὸς
  choice: afin que vous ayez de quoi répondre à
  rationale: L’expression implique que les Corinthiens disposeront de quelque chose à opposer à certains adversaires. « Avoir de quoi répondre » rend clairement cet idiome sans préciser le contenu de la réponse.
- source_word: ἐν προσώπῳ
  choice: des apparences
  rationale: Littéralement lié au « visage », le groupe s’oppose ici au cœur et renvoie donc naturellement à ce qui est extérieur ou visible. « Des apparences » restitue ce contraste en français courant.
- source_word: καυχωμένους
  choice: ceux qui se vantent
  rationale: « Se vanter » conserve la force potentiellement critique du verbe et le lien sémantique avec la fierté mentionnée plus tôt.
- source_word: καρδίᾳ
  choice: ce qui est dans le cœur
  rationale: « Cœur » conserve l’image biblique et l’opposition avec l’apparence extérieure, tandis que la tournure française explicite seulement ce qu’exige la syntaxe.
- source_word: πάλιν
  choice: de nouveau
  rationale: Cette expression marque naturellement en français la répétition que Paul nie.
theological_decisions:
- issue: Sens du contraste ἐν προσώπῳ … καὶ μὴ ἐν καρδίᾳ
  choice: Contraste entre les apparences extérieures et ce qui est dans le cœur
  alternative: Contraste plus précis entre la réputation publique et la sincérité intérieure
  rationale: La formulation retenue maintient l’antithèse du texte grec entre l’extérieur et l’intérieur sans réduire le « cœur » à la seule sincérité ni imposer une lecture doctrinale plus étroite.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation conserve l’image biblique du cœur tout en rendant idiomatiquement le contraste avec le visage ou l’apparence. « Être fiers de nous » évite une répétition française maladroite de « se vanter » tout en maintenant le même champ sémantique.
