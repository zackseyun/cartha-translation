language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὡς ὅτι θεὸς ἦν ἐν Χριστῷ κόσμον καταλλάσσων ἑαυτῷ, μὴ λογιζόμενος αὐτοῖς τὰ παραπτώματα αὐτῶν, καὶ θέμενος ἐν ἡμῖν τὸν λόγον τῆς καταλλαγῆς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/019.yaml
  text: namely[a], that God was in Messiah reconciling the world to himself, not counting their trespasses against them[d][c][b], and entrusting to us the message of reconciliation.
translation:
  language: fr
  text: À savoir que Dieu était dans le Messie, réconciliant le monde avec lui-même[a], ne mettant pas leurs fautes à leur compte, et ayant placé en nous[b] le message de la réconciliation[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Dans le Messie, Dieu réconciliait le monde avec lui-même. »'
    reason: La syntaxe grecque permet de rattacher plus étroitement « dans le Messie » à l’action de réconcilier.
  - marker: b
    text: 'Ou : « parmi nous » ou « à nous » ; selon le sens, on peut aussi comprendre : « nous a confié ».'
    reason: ἐν ἡμῖν signifie littéralement « en nous », mais peut recevoir ici une compréhension collective ou exprimer idiomatiquement une mission confiée.
  - marker: c
    text: 'Littéralement : « la parole de la réconciliation ».'
    reason: λόγος peut désigner une parole ou, comme ici, le message qu’elle communique.
lexical_decisions:
- source_word: ὡς ὅτι
  choice: à savoir que
  rationale: Cette formule française introduit naturellement l’explication ou le contenu de l’affirmation précédente, sans la lourdeur de « c’est-à-dire que » dans ce contexte.
- source_word: θεὸς ἦν ἐν Χριστῷ
  choice: Dieu était dans le Messie
  rationale: La traduction conserve directement ἐν, « dans », et ne transforme pas la relation en une formulation instrumentale plus interprétative.
- source_word: Χριστῷ
  choice: Messie
  rationale: Χριστός fonctionne ici comme un titre; « Messie » en rend le sens dans un français actuel.
- source_word: κόσμον
  choice: le monde
  rationale: « Le monde » est l’équivalent français naturel et garde toute l’étendue du terme grec sans le limiter explicitement à l’humanité.
- source_word: καταλλάσσων
  choice: réconciliant
  rationale: Le participe présent exprime l’action divine et maintient le lien lexical avec καταλλαγή, « réconciliation », à la fin du verset.
- source_word: ἑαυτῷ
  choice: avec lui-même
  rationale: En français, on réconcilie normalement quelqu’un « avec » quelqu’un; cette formulation indique clairement que Dieu est le terme de la réconciliation.
- source_word: μὴ λογιζόμενος αὐτοῖς τὰ παραπτώματα αὐτῶν
  choice: sans porter leurs fautes à leur compte
  rationale: Cette expression française conserve l’image comptable de λογίζομαι et rend παράπτωμα par le terme accessible et relationnel « faute ».
- source_word: καὶ θέμενος
  choice: et qu’il a placé
  rationale: « Placer » reste proche du sens concret de τίθημι. La reprise de « que » rend la construction intelligible en français tout en distinguant l’acte de placer de l’action participiale précédente.
- source_word: ἐν ἡμῖν
  choice: en nous
  rationale: La traduction directe de ἐν préserve l’expression grecque et sa possible portée intérieure ou collective; d’autres compréhensions idiomatiques figurent en note.
- source_word: τὸν λόγον τῆς καταλλαγῆς
  choice: le message de la réconciliation
  rationale: Dans ce contexte, λόγος désigne le contenu communiqué ou proclamé. « Message » est clair en français moderne, tandis que la traduction plus littérale est signalée en note.
theological_decisions:
- issue: Relation exprimée par θεὸς ἦν ἐν Χριστῷ
  choice: Dieu était dans le Messie, réconciliant le monde avec lui-même
  alternative: Dans le Messie, Dieu réconciliait le monde avec lui-même
  rationale: Le choix principal suit de près l’ordre et la syntaxe du grec, conservant la tension entre la présence de Dieu dans le Messie et son action réconciliatrice sans réduire ἐν à « par l’intermédiaire de ».
- issue: Valeur de Χριστός
  choice: Messie
  alternative: Christ
  rationale: Le mot grec est un titre signifiant « oint ». « Messie » en communique la valeur titulaire plutôt que de le traiter comme un simple nom propre.
- issue: Portée de ἐν ἡμῖν
  choice: en nous
  alternative: parmi nous ou à nous
  rationale: Le texte principal garde la préposition grecque et ne tranche pas entre une présence intérieure ou collective et l’idée d’une mission confiée aux apôtres.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation garde les répétitions lexicales autour de la réconciliation, évite le jargon théologique pour λογίζομαι et conserve dans le texte principal les prépositions grecques porteuses d’ambiguïté.
