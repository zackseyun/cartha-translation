revisions:
- from: Car nous devons tous être mis en pleine lumière[a] devant le tribunal du Messie[b], afin que chacun reçoive ce qui lui revient pour ce qu’il aura fait par son corps[c], en bien ou en mal.
  to: Car nous devons tous être mis en pleine lumière[a] devant le tribunal du Messie[b], afin que chacun reçoive ce qui lui revient pour le bien ou le mal qu’il a fait par son corps[c].
  rationale: La révision corrige l’attache de « bon ou mauvais » afin que le français exprime clairement la rétribution correspondant au bien ou au mal accompli. Elle remplace aussi le futur antérieur par un passé composé plus fidèle à l’aoriste grec dans cette construction. Les termes principaux et l’ambiguïté relative au corps sont conservés.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T11:37:16Z'
review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est bien rendu : nécessité universelle, dévoilement devant le tribunal du Messie, rétribution individuelle et contraste entre bien et mal. Toutefois, « en bien ou en mal » ne rend pas exactement l’accusatif neutre « soit bon soit mauvais », qui qualifie ce que chacun reçoit en rapport avec ses actes. « pour le bien ou le mal qu’il a fait » restitue plus clairement la structure sans surinterprétation. « Il aura fait » est possible en français, mais le futur antérieur affaiblit inutilement l’aspect aoristique grec et peut suggérer une antériorité spécifique ; « il a fait » est plus direct dans ce cadre eschatologique.'
  naturalness: « Être mis en pleine lumière » est vivant et compréhensible, mais légèrement interprétatif ; il reste défendable pour φανερωθῆναι. « Tribunal du Messie » est naturel et solennel. La formulation révisée « pour le bien ou le mal qu’il a fait par son corps » est plus idiomatique et syntaxiquement nette que « en bien ou en mal ».
  terminology: « Messie » rend correctement Χριστός comme titre, conformément à la ligne éditoriale. « Tribunal » convient à βῆμα dans ce contexte judiciaire. La note sur « par son corps » préserve avec justesse l’ambiguïté de διά avec le génitif et ne doit pas imposer « dans son corps » au texte principal.
  issues:
  - severity: medium
    issue: Portée grammaticale de « en bien ou en mal »
    rationale: Dans εἴτε ἀγαθὸν εἴτε φαῦλον, les adjectifs neutres correspondent à l’objet reçu (τὰ ...), en fonction de ce que la personne a fait. La tournure française actuelle peut plutôt caractériser la manière de recevoir ou demeurer trop elliptique. « pour le bien ou le mal qu’il a fait » explicite la relation présente dans le grec.
  - severity: low
    issue: Futur antérieur « il aura fait »
    rationale: Le grec emploie l’aoriste ἔπραξεν, sans marquer le futur antérieur français. Dans une proposition de jugement futur, le passé composé français (« il a fait ») exprime naturellement les actes antérieurs sans ajout aspectuel inutile.
