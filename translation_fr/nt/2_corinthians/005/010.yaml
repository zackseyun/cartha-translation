source:
  edition: SBLGNT
  text: τοὺς γὰρ πάντας ἡμᾶς φανερωθῆναι δεῖ ἔμπροσθεν τοῦ βήματος τοῦ Χριστοῦ, ἵνα κομίσηται ἕκαστος τὰ διὰ τοῦ σώματος πρὸς ἃ ἔπραξεν, εἴτε ἀγαθὸν εἴτε ⸀φαῦλον.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/010.yaml
  text: For we all must be revealed before the judgment seat of Messiah[a], so that each one may receive what is due for what he has done in the body[d][c][b], whether good or bad.
translation:
  language: fr
  text: Car nous devons tous être mis en pleine lumière[a] devant le tribunal du Messie[b], afin que chacun reçoive ce qui lui revient pour le bien ou le mal qu’il a fait par son corps[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « comparaître ». Le verbe grec peut désigner une simple apparition, mais aussi le fait d’être rendu manifeste ou dévoilé ; le texte retient ici ce dernier sens, plus fort.
    reason: lexical_alternative
  - marker: b
    text: Le grec porte « Christ » (Χριστός), titre qui signifie « Messie ».
    reason: alternative_reading
  - marker: c
    text: Ou « dans son corps ». La tournure grecque peut évoquer les actes accomplis par le moyen du corps ou, plus largement, au cours de l’existence corporelle.
    reason: lexical_alternative
lexical_decisions:
- source_word: φανερωθῆναι
  choice: être mis en pleine lumière
  rationale: 'Le passif exprime ici davantage qu’une simple présence : il suggère que chacun sera rendu manifeste, ouvertement dévoilé. Cette formulation française conserve cette force tout en restant naturelle.'
- source_word: βήματος
  choice: tribunal
  rationale: Dans ce contexte, βῆμα désigne le siège ou l’estrade d’où une autorité rend son jugement. « Tribunal » communique clairement le cadre judiciaire en français moderne.
- source_word: Χριστοῦ
  choice: du Messie
  rationale: Χριστός garde ici sa valeur de titre. « Messie » en rend directement le sens sans le traiter comme un simple nom propre.
- source_word: κομίσηται
  choice: reçoive ce qui lui revient
  rationale: Le moyen κομίσηται exprime l’idée de recevoir en retour selon sa conduite. La formulation explicite sobrement cette rétribution.
- source_word: τὰ διὰ τοῦ σώματος πρὸς ἃ ἔπραξεν
  choice: pour ce qu’il aura fait par son corps
  rationale: La formule grecque est condensée. « Par son corps » conserve la valeur instrumentale probable de διά avec le génitif, tandis que « pour ce qu’il aura fait » exprime la correspondance introduite par πρός et maintient la responsabilité personnelle.
- source_word: ἕκαστος
  choice: chacun
  rationale: Le singulier distributif souligne la responsabilité individuelle ; « chacun » en restitue directement la portée.
- source_word: εἴτε ἀγαθὸν εἴτε φαῦλον
  choice: en bien ou en mal
  rationale: Cette opposition française naturelle conserve le contraste moral général sans durcir φαῦλον en un terme plus absolu comme « maléfique ».
theological_decisions:
- issue: Nature et portée de l’évaluation devant le Messie
  choice: Conserver le langage universel de comparution et de rétribution individuelle sans préciser davantage les personnes concernées ni l’issue du jugement.
  alternative: Présenter ce tribunal soit comme une évaluation des croyants concernant uniquement leurs récompenses, soit comme le jugement final de toute l’humanité.
  rationale: Le verset affirme que tous doivent être manifestés et que chacun recevra selon sa conduite, mais il ne tranche pas à lui seul les distinctions systématiques concernant l’étendue ou les conséquences de ce jugement.
translation_notes:
  register: Français international moderne, digne et accessible. « Être mis en pleine lumière » préserve la dimension de dévoilement tout en évitant le calque peu naturel « être manifestés ». « Tribunal » établit nettement le cadre judiciaire. La phrase conserve la solennité et la tension théologique du grec sans préciser indûment la portée du jugement.
