  text: καὶ γὰρ ἐν τούτῳ στενάζομεν, τὸ οἰκητήριον ἡμῶν τὸ ἐξ οὐρανοῦ ἐπενδύσασθαι ἐπιποθοῦντες,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/002.yaml
  text: For indeed in this we groan[a], longing to put on our dwelling from heaven[b],
translation:
  language: fr
  text: Car, en ceci[a], nous gémissons, désirant ardemment nous revêtir[b] de notre demeure venant du ciel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec dit littéralement « dans ceci ». Le démonstratif renvoie probablement à la demeure terrestre mentionnée au verset précédent, mais il ne répète pas le nom.
    reason: ambiguïté grammaticale
  - marker: b
    text: Le verbe grec peut évoquer le fait de mettre un vêtement par-dessus un autre.
    reason: nuance lexicale
lexical_decisions:
- source_word: καὶ γὰρ
  choice: Car
  rationale: La locution introduit une explication tout en lui donnant une légère insistance. En français, « Car » exprime naturellement ce lien avec l’affirmation précédente; la force emphatique ressort aussi de l’ensemble de la phrase.
- source_word: ἐν τούτῳ
  choice: dans cette demeure-ci
  rationale: Le démonstratif renvoie vraisemblablement à la demeure terrestre évoquée juste avant. Comme « dans ceci » serait obscur et peu naturel en français, le nom implicite est repris, tandis qu’une note signale l’ambiguïté du grec.
- source_word: στενάζομεν
  choice: nous gémissons
  rationale: « Gémir » rend la souffrance intérieure et l’aspiration exprimées par le verbe sans ajouter l’idée plus forte de plainte publique.
- source_word: τὸ οἰκητήριον ἡμῶν τὸ ἐξ οὐρανοῦ
  choice: notre demeure qui vient du ciel
  rationale: « Demeure » conserve la métaphore concrète de l’habitation, et « qui vient du ciel » rend explicitement l’origine marquée par ἐξ plutôt qu’une simple qualité céleste.
- source_word: ἐπενδύσασθαι
  choice: nous revêtir
  rationale: Le verbe appartient à l’image du vêtement et peut suggérer qu’on met un vêtement par-dessus un autre. « Nous revêtir de » est idiomatique en français; la nuance de superposition est conservée en note.
- source_word: ἐπιποθοῦντες
  choice: désirant ardemment
  rationale: Cette formulation exprime le désir intense et soutenu du participe grec tout en gardant son rapport circonstanciel avec « nous gémissons ».
theological_decisions:
- issue: Nature de la demeure venant du ciel
  choice: Conserver ensemble les images de la demeure et du vêtement sans préciser davantage leur référent.
  alternative: Traduire explicitement par « corps ressuscité » ou « demeure céleste ».
  rationale: Le verset superpose deux métaphores et ne tranche pas à lui seul entre les diverses compréhensions de l’existence ressuscitée, de l’état intermédiaire ou de l’habitation eschatologique. Une explicitation doctrinale réduirait cette tension.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « demeure » et le passage de l’image de l’habitation à celle du vêtement sont maintenus parce qu’ils appartiennent à la formulation grecque.
