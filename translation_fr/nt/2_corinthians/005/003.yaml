  text: if indeed[a], when we have been clothed, we will not be found naked.
translation:
  language: fr
  text: si du moins[a], une fois revêtus, nous ne serons pas trouvés nus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : «si vraiment, après nous être revêtus, nous ne serons pas trouvés dévêtus».'
    reason: La construction grecque peut rendre plus explicitement la valeur moyenne de «revêtir»; «dévêtus» constitue une alternative lexicale à «nus» tout en conservant la métaphore vestimentaire.
lexical_decisions:
- source_word: εἴ γε
  choice: si du moins
  rationale: Cette expression conserve à la fois la valeur conditionnelle de εἰ et la nuance de renforcement apportée par γε, sans transformer la condition en certitude.
- source_word: καὶ ἐνδυσάμενοι
  choice: une fois revêtus
  rationale: Cette tournure française naturelle rend le participe aoriste moyen comme une action antérieure à celle du verbe principal; «revêtus» maintient l’image du vêtement et peut se comprendre sans imposer artificiellement une voix strictement passive.
- source_word: οὐ γυμνοί
  choice: ne… pas… nus
  rationale: «Nus» est l’équivalent direct de γυμνοί et préserve la métaphore ainsi que son ambiguïté théologique.
- source_word: εὑρεθησόμεθα
  choice: nous ne sommes pas trouvés
  rationale: Le présent français après «si» exprime naturellement la perspective future du grec, tandis que «être trouvés» conserve la forme passive et l’idée d’être constatés dans un certain état.
theological_decisions:
- issue: Sens de la métaphore du vêtement et de la nudité
  choice: Conserver les images «revêtus» et «nus» sans en préciser le référent.
  alternative: Interpréter «nus» comme l’état désincarné, l’absence du corps céleste ou l’exposition honteuse devant Dieu.
  rationale: Le verset ne définit pas explicitement le référent complet de la métaphore; la traduction doit donc préserver cette tension plutôt que privilégier une interprétation doctrinale.
- issue: Portée de εἴ γε
  choice: Conserver une condition réelle avec «si du moins».
  alternative: Employer une formulation confirmative telle que «puisque réellement».
  rationale: La tournure grecque peut avoir une nuance confirmative selon le contexte, mais sa forme demeure conditionnelle; «si du moins» évite de supprimer cette ambiguïté.
translation_notes:
  register: Français international moderne, digne et lisible. «Une fois revêtus» est idiomatique tout en restant proche de la structure grecque; «nus» conserve la formulation frappante de Paul.
