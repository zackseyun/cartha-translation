reference: 2 Corinthians 5:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Εἰδότες οὖν τὸν φόβον τοῦ κυρίου ἀνθρώπους πείθομεν, θεῷ δὲ πεφανερώμεθα· ἐλπίζω δὲ καὶ ἐν ταῖς συνειδήσεσιν ὑμῶν πεφανερῶσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/011.yaml
  text: Therefore[a], knowing the fear of the Lord, we persuade people; but we have been made known to God[b], and I hope that we also have been made known in your consciences.
translation:
  language: fr
  text: Ainsi, connaissant la crainte du Seigneur[a], nous persuadons les gens. Mais nous sommes à découvert devant Dieu[b], et j’espère que nous sommes aussi mis en lumière dans vos consciences.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La « crainte du Seigneur » peut inclure ici le profond respect mêlé de saisissement que suscite le Seigneur, particulièrement dans le contexte du tribunal mentionné au verset précédent.
    reason: lexical_alternative
  - marker: b
    text: 'Plus littéralement : « Mais nous avons été manifestés à Dieu, et j’espère que nous avons aussi été manifestés dans vos consciences. »'
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰδότες οὖν
  choice: Ainsi, connaissant
  rationale: Le participe parfait de οἶδα a ici un sens présent, et οὖν relie cette affirmation à la comparution devant le tribunal du Christ au verset précédent. Cette formulation conserve le lien participial sans imposer une valeur causale explicite.
- source_word: φόβον τοῦ κυρίου
  choice: la crainte du Seigneur
  rationale: « Crainte » garde à la fois la révérence, la solennité et la conscience d’avoir à rendre compte; « respect » ou « révérence » seuls atténueraient la force du contexte judiciaire.
- source_word: ἀνθρώπους πείθομεν
  choice: nous cherchons à persuader les gens
  rationale: πείθω désigne l’action de persuader. En français actuel, « persuader les gens » sans complément est peu naturel; « cherchons à » exprime l’entreprise de persuasion sans prétendre que chacun est effectivement convaincu. « Les gens » rend le pluriel générique ἀνθρώπους sans restriction de genre.
- source_word: θεῷ δὲ πεφανερώμεθα
  choice: Mais Dieu nous connaît pleinement
  rationale: Le parfait passif de φανερόω présente Paul et ses collaborateurs comme entièrement dévoilés et donc connus de Dieu, avec un résultat présent. La tournure active est plus idiomatique en français, tandis que la note conserve la forme plus littérale.
- source_word: ἐν ταῖς συνειδήσεσιν ὑμῶν πεφανερῶσθαι
  choice: dans vos consciences, vous nous connaissez aussi tels que nous sommes
  rationale: La reformulation rend naturellement l’idée d’être dévoilés dans l’évaluation morale intérieure des destinataires, tout en conservant le pluriel « consciences » et le parallèle avec la connaissance de Dieu.
theological_decisions:
- issue: Sens de « la crainte du Seigneur »
  choice: Conserver « crainte »
  alternative: « profond respect pour le Seigneur » ou « révérence envers le Seigneur »
  rationale: Le contexte immédiat du tribunal du Christ (5.10) associe révérence et responsabilité devant le jugement. Une formulation adoucie résoudrait indûment cette tension.
- issue: Portée de φανερόω devant Dieu et dans les consciences
  choice: Exprimer le fait d’être pleinement connu tel que l’on est
  alternative: « nous avons été manifestés » ou « mis en lumière »
  rationale: Le texte affirme que la réalité du ministère et des motivations de Paul est à découvert devant Dieu et, il l’espère, reconnue intérieurement par les Corinthiens. La traduction évite d’ajouter une affirmation doctrinale sur la manière dont Dieu acquiert cette connaissance.
translation_notes:
  register: Français international moderne, digne et accessible. « Seigneur » conserve le titre traditionnel de κύριος. La syntaxe est légèrement reformulée pour rendre idiomatiquement les deux passifs de φανερόω, tandis que la note en préserve la forme et l’étrangeté expressive.
