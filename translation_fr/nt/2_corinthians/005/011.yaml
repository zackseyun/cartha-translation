revisions:
- from: Ainsi, connaissant la crainte du Seigneur[a], nous cherchons à persuader les gens. Mais Dieu nous connaît pleinement[b], et j’espère que, dans vos consciences, vous nous connaissez aussi tels que nous sommes.
  to: Ainsi, connaissant la crainte du Seigneur[a], nous persuadons les gens. Mais nous sommes à découvert devant Dieu[b], et j’espère que nous sommes aussi mis en lumière dans vos consciences.
  rationale: La révision rend le présent πείθομεν sans l’atténuer, évite l’ajout de « pleinement », et conserve, dans les deux membres parallèles, l’idée de personnes rendues manifestes. « À découvert devant Dieu » est idiomatique en français tout en exprimant l’exposition devant Dieu; la note fournit la formulation plus proche de la structure grecque. Les ancres de notes restent placées sur les expressions qu’elles expliquent.
