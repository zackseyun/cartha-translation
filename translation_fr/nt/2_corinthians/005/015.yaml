reference: 2 Corinthians 5:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ὑπὲρ πάντων ἀπέθανεν ἵνα οἱ ζῶντες μηκέτι ἑαυτοῖς ζῶσιν ἀλλὰ τῷ ὑπὲρ αὐτῶν ἀποθανόντι καὶ ἐγερθέντι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/015.yaml
  text: And he died for all[a], so that those who live might no longer live for themselves[b], but for the one who died and was raised for them.
translation:
  language: fr
  text: Et il est mort pour tous[a], afin que ceux qui vivent ne vivent plus pour eux-mêmes, mais pour celui qui est mort et a été ressuscité pour eux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en faveur de tous ». Le grec emploie la même préposition dans « pour eux » à la fin du verset; elle peut exprimer l’idée d’agir au bénéfice de quelqu’un ou en son nom.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπὲρ πάντων
  choice: pour tous
  rationale: Avec le génitif, ὑπέρ exprime ici l’avantage ou la représentation. « Pour tous » est naturel en français et n’impose pas une théorie particulière de l’expiation.
- source_word: ἀπέθανεν
  choice: il est mort
  rationale: L’aoriste indicatif présente simplement l’événement passé; le sujet masculin singulier est explicité d’après le contexte.
- source_word: ἵνα
  choice: afin que
  rationale: Cette tournure conserve clairement la valeur de but, avec une possible nuance de résultat, tout en restant courante et digne.
- source_word: οἱ ζῶντες
  choice: ceux qui vivent
  rationale: Le participe présent substantivé désigne les personnes qui vivent, dans le sens pertinent au contexte; cette formulation préserve l’expression sans la réduire à la seule vie physique.
- source_word: μηκέτι ἑαυτοῖς ζῶσιν
  choice: ne vivent plus pour eux-mêmes
  rationale: μηκέτι indique la cessation, et le datif réfléchi marque l’orientation de la vie vers soi-même. La formulation est idiomatique en français.
- source_word: ἀλλὰ τῷ ὑπὲρ αὐτῶν ἀποθανόντι καὶ ἐγερθέντι
  choice: mais pour celui qui est mort et a été ressuscité pour eux
  rationale: Le datif poursuit le contraste avec « pour eux-mêmes ». Les participes sont rendus naturellement, tandis que « a été ressuscité » conserve la voix passive de ἐγερθέντι.
- source_word: ὑπὲρ αὐτῶν
  choice: pour eux
  rationale: La même préposition ὑπέρ est rendue de la même manière qu’au début du verset, en préservant l’idée d’action en leur faveur.
theological_decisions:
- issue: Portée de πάντων et référent de αὐτῶν
  choice: « tous » et « eux », sans restriction ajoutée
  alternative: Préciser soit « tous les êtres humains », soit « tous les croyants »
  rationale: Le verset emploie une expression de portée large sans trancher explicitement les débats théologiques ultérieurs. La traduction conserve cette tension.
- issue: Voix de ἐγερθέντι
  choice: « a été ressuscité »
  alternative: « est ressuscité »
  rationale: La forme grecque est passive. La conserver laisse entendre l’action divine sans ajouter dans le texte le nom de l’agent.
- issue: Force de ὑπέρ
  choice: « pour »
  alternative: « au bénéfice de » ou « à la place de »
  rationale: « Pour » maintient la souplesse sémantique de ὑπέρ, qui exprime ici le bénéfice ou la représentation, sans imposer une formulation doctrinale plus étroite.
translation_notes:
  register: Français international moderne, naturel et digne. La structure antithétique « non plus… mais… » est conservée, ainsi que la répétition de « pour ». Le passif de la résurrection est maintenu.
