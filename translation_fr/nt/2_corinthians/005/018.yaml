  text: τὰ δὲ πάντα ἐκ τοῦ θεοῦ τοῦ καταλλάξαντος ἡμᾶς ἑαυτῷ ⸀διὰ Χριστοῦ καὶ δόντος ἡμῖν τὴν διακονίαν τῆς καταλλαγῆς,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/018.yaml
  text: All these things are from God[a], who reconciled us to himself through Messiah and gave us the ministry of reconciliation[c][b],
translation:
  language: fr
  text: Tout cela vient de Dieu[a], qui nous a réconciliés avec lui par le Messie[b] et nous a donné le ministère de la réconciliation[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « toutes choses ». L’expression peut désigner largement tout ce qui appartient à cette réalité nouvelle, ou plus précisément ce qui vient d’être mentionné dans le contexte.
    reason: lexical_alternative
  - marker: b
    text: 'Grec : « par Christ ». « Par le Messie » rend ici Χριστός comme un titre.'
    reason: alternative_reading
  - marker: c
    text: Le pronom « nous » peut désigner largement les croyants, bien que, dans le contexte, Paul mette particulièrement l’accent sur la mission apostolique confiée à lui-même et à ses collaborateurs.
    reason: alternative_reading
lexical_decisions:
- source_word: τὰ δὲ πάντα
  choice: Tout cela
  rationale: Le neutre pluriel substantivé renvoie naturellement à l’ensemble des réalités évoquées juste avant, sans exclure une portée plus générale. En français, « tout cela » rend ce renvoi contextuel avec naturel. La particule δέ marque ici une transition légère qu’il n’est pas nécessaire d’expliciter.
- source_word: ἐκ τοῦ θεοῦ
  choice: vient de Dieu
  rationale: ἐκ indique la source ou l’origine. Le singulier « vient » s’accorde avec le collectif français « tout cela ».
- source_word: τοῦ καταλλάξαντος ἡμᾶς ἑαυτῷ
  choice: qui nous a réconciliés avec lui
  rationale: Le participe aoriste est rendu par une proposition relative naturelle en français. « Réconcilier avec » exprime idiomatiquement le rétablissement de la relation, tandis que « lui » reprend clairement Dieu.
- source_word: διὰ Χριστοῦ
  choice: par le Messie
  rationale: διά avec le génitif exprime ici la médiation. Χριστός conserve sa valeur de titre et se traduit donc par « le Messie ».
- source_word: καὶ δόντος ἡμῖν
  choice: et nous a donné
  rationale: Le second participe aoriste coordonné est rendu par un verbe conjugué partageant le sujet « Dieu », ce qui reste fidèle et naturel.
- source_word: τὴν διακονίαν τῆς καταλλαγῆς
  choice: le ministère de la réconciliation
  rationale: διακονία désigne un service confié ou une mission; « ministère » convient au contexte paulinien. Le génitif définit ici le contenu ou le caractère de ce ministère.
theological_decisions:
- issue: Valeur de Χριστοῦ
  choice: le Messie
  alternative: Christ
  rationale: Dans ce passage, le terme désigne le rôle médiateur de Jésus et garde clairement sa valeur titulaire. « Le Messie » rend cette fonction sans traiter le titre comme un simple nom propre.
- issue: Portée de ἡμᾶς et ἡμῖν
  choice: nous
  alternative: les croyants en général, ou plus spécialement Paul et ses collaborateurs apostoliques
  rationale: Le grec ne tranche pas explicitement entre la communauté croyante au sens large et l’accent contextuel sur la mission apostolique. Le texte principal conserve donc l’ambiguïté du pronom.
translation_notes:
  register: Français international moderne, clair et digne. La formulation reste proche de la structure grecque tout en employant des tours idiomatiques français; elle conserve l’ambiguïté contextuelle de « nous » et la portée potentiellement large de τὰ πάντα.
