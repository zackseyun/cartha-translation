  text: διὰ πίστεως γὰρ περιπατοῦμεν, οὐ διὰ εἴδους—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/007.yaml
  text: For we walk by faith[a], not by sight—
translation:
  language: fr
  text: Car nous marchons par la foi, non par la vue[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’apparence » ou « ce qui est vu ». Le mot grec peut désigner la forme visible ou l’apparence ; « la vue » est retenu pour préserver le contraste avec « la foi ».
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ πίστεως
  choice: par la foi
  rationale: διά avec le génitif exprime ici le moyen ou la manière. « Par la foi » est naturel en français et conserve le contraste concis avec ce qui relève de la vue.
- source_word: γὰρ
  choice: Car
  rationale: γάρ introduit l’explication de l’affirmation précédente. « Car » en préserve clairement la valeur logique.
- source_word: περιπατοῦμεν
  choice: nous marchons
  rationale: Le verbe signifie littéralement « marcher » et, par extension, mener sa vie. Le français biblique courant comprend aisément cette métaphore, qu’il convient donc de conserver.
- source_word: οὐ διὰ εἴδους
  choice: non par la vue
  rationale: εἶδος peut désigner la forme visible, l’apparence ou ce qui est vu. « La vue » rend naturellement l’opposition avec « la foi », sans réduire le sens à une apparence superficielle.
theological_decisions:
- issue: Sens de πίστις dans l’antithèse paulinienne
  choice: la foi
  alternative: la confiance ou la fidélité
  rationale: Dans ce contexte, l’opposition à εἶδος oriente vers la foi comme confiance en ce qui n’est pas actuellement visible. « Fidélité » est possible dans d’autres contextes, mais convient moins à cette antithèse.
- issue: Portée de εἶδος
  choice: la vue
  alternative: l’apparence ou ce qui est vu
  rationale: Le grec permet plusieurs nuances liées au visible. Le texte principal retient l’expression française la plus naturelle tout en signalant dans la note les autres possibilités, sans trancher davantage que la source.
translation_notes:
  register: Français moderne, concis et digne. La métaphore de la marche et le tiret final du texte source sont conservés.
