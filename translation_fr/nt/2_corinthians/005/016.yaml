  terminology: « Selon la chair » et « le Messie » sont des choix appropriés. La note b doit toutefois distinguer clairement la forme grecque Χριστόν, sa translittération et la traduction traditionnelle « Christ »; la formulation actuelle (« Christon, c’est-à-dire le Christ ») les confond quelque peu.
