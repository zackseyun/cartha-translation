id: 2CO.5.16
reference: 2 Corinthians 5:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ὥστε ἡμεῖς ἀπὸ τοῦ νῦν οὐδένα οἴδαμεν κατὰ σάρκα· ⸀εἰ καὶ ἐγνώκαμεν κατὰ σάρκα Χριστόν, ἀλλὰ νῦν οὐκέτι γινώσκομεν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/016.yaml
  text: So from now on we regard no one according to the flesh[a]. Even if we have known Messiah according to the flesh[b], yet now we no longer know him that way.
translation:
  language: fr
  text: Ainsi, désormais, nous ne considérons personne selon la chair[a]. Même si nous avons connu le Messie[b] selon la chair, maintenant nous ne le connaissons plus ainsi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « d’un point de vue purement humain » ou « d’après les critères de ce monde ».
    reason: lexical_alternative
  - marker: b
    text: Grec Χριστόν (Christon), traditionnellement rendu par « Christ » ; ce titre signifie « Messie » ou « Oint ».
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὥστε
  choice: Ainsi
  rationale: Introduit la conséquence de l’argument précédent dans un français naturel, tout en conservant la valeur déductive de la conjonction.
- source_word: ἀπὸ τοῦ νῦν
  choice: désormais
  rationale: Exprime avec concision un changement décisif valable à partir du moment présent.
- source_word: οὐδένα οἴδαμεν
  choice: nous ne considérons personne
  rationale: Dans la construction avec κατὰ σάρκα, οἴδαμεν désigne ici moins la simple possession d’une connaissance que la manière d’appréhender ou d’évaluer quelqu’un. « Considérons » rend ce sens naturellement en français.
- source_word: κατὰ σάρκα
  choice: selon la chair
  rationale: Conserve le terme théologiquement significatif de Paul et l’ambiguïté féconde de l’expression, tandis que la note indique ses principales valeurs contextuelles.
- source_word: εἰ καὶ
  choice: Même si
  rationale: Préserve la forme concessive grecque sans décider entre une hypothèse rhétorique et la reconnaissance d’un fait passé.
- source_word: ἐγνώκαμεν
  choice: nous avons connu
  rationale: Le passé composé rend l’antériorité et la pertinence présente de la connaissance évoquée.
- source_word: Χριστόν
  choice: le Messie
  rationale: Rend le contenu du titre grec Χριστός plutôt que de le traiter comme un simple nom propre.
- source_word: ἀλλὰ νῦν οὐκέτι γινώσκομεν
  choice: maintenant nous ne le connaissons plus ainsi
  rationale: Marque nettement le contraste temporel et précise que c’est la manière de connaître qui a changé, non que le Messie serait désormais inconnu.
theological_decisions:
- issue: Sens de κατὰ σάρκα appliqué aux personnes et au Messie
  choice: selon la chair
  alternative: d’un point de vue purement humain ; d’après les critères de ce monde
  rationale: 'La formulation maintient le vocabulaire et la tension de Paul : une ancienne manière, inadéquate, d’appréhender les personnes et le Messie est abandonnée. Elle ne nie pas la véritable humanité du Messie et ne réduit pas non plus σάρξ à la seule idée de nature pécheresse.'
- issue: Valeur concessive de εἰ καὶ
  choice: Même si
  alternative: Même si nous avons effectivement connu ; Bien que nous ayons connu
  rationale: « Même si » conserve l’ambiguïté du grec quant à la portée exacte de l’affirmation autobiographique, au lieu de trancher implicitement la question de savoir si Paul affirme avoir connu Jésus durant sa vie terrestre.
- issue: Rendu de Χριστός
  choice: le Messie
  alternative: le Christ
  rationale: « Le Messie » rend explicitement la valeur titulaire de Χριστός sans ajouter de lecture confessionnelle particulière.
translation_notes:
  register: Français international moderne, sobre et digne. « Considérons » clarifie l’emploi contextuel du premier verbe de connaissance, tandis que « connu » et « connaissons » maintiennent dans la seconde phrase le langage relationnel du grec. La répétition de « selon la chair » est conservée comme dans la source.
