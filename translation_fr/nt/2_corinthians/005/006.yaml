reference: 2 Corinthians 5:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Θαρροῦντες οὖν πάντοτε καὶ εἰδότες ὅτι ἐνδημοῦντες ἐν τῷ σώματι ἐκδημοῦμεν ἀπὸ τοῦ κυρίου,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/006.yaml
  text: Therefore[a], we are always confident and know that while we are at home in the body, we are away from the Lord,
translation:
  language: fr
  text: Nous gardons donc toujours courage, sachant que, lorsque nous sommes chez nous dans le corps, nous sommes loin du Seigneur[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « absents du Seigneur ». Le verbe grec est l’opposé de « être chez soi » et peut exprimer le fait d’être loin ou absent.
    reason: lexical_alternative
lexical_decisions:
- source_word: Θαρροῦντες
  choice: nous gardons ... courage
  rationale: Le participe présent exprime une disposition continue. La tournure verbale française est naturelle et conserve l’idée de courage assuré.
- source_word: οὖν
  choice: donc
  rationale: Marque la conséquence tirée de l’argument précédent; « donc » rend clairement ce lien logique en français courant.
- source_word: πάντοτε
  choice: toujours
  rationale: Exprime la continuité de cette assurance ou de ce courage.
- source_word: εἰδότες
  choice: nous savons
  rationale: Le participe parfait de οἶδα a ici une valeur présente et désigne un savoir établi.
- source_word: ἐνδημοῦντες
  choice: tant que nous demeurons
  rationale: Le verbe évoque le fait de résider chez soi. « Demeurer » garde l’image résidentielle tout en s’intégrant naturellement à la phrase française.
- source_word: ἐν τῷ σώματι
  choice: dans le corps
  rationale: Rend directement la construction locative et désigne l’existence corporelle présente sans ajouter « ce » ni expliciter davantage.
- source_word: ἐκδημοῦμεν
  choice: nous sommes loin
  rationale: Rend le contraste avec le fait de demeurer chez soi et exprime la séparation spatiale métaphorique dans un français naturel. « Absents » reste une possibilité plus formelle.
- source_word: ἀπὸ τοῦ κυρίου
  choice: du Seigneur
  rationale: ἀπό exprime l’éloignement ou la séparation; « loin du Seigneur » forme en français une unité idiomatique. κύριος est rendu par « Seigneur ».
theological_decisions:
- issue: Contraste métaphorique entre l’existence corporelle présente et la présence auprès du Seigneur
  choice: Le texte présente le fait de demeurer dans le corps comme le fait d’être loin du Seigneur, sans définir cet éloignement comme une séparation totale d’avec lui.
  alternative: Importer ici la formulation du verset 8 (« quitter le corps » et « demeurer auprès du Seigneur ») ou comprendre une absence absolue de toute présence du Christ.
  rationale: La traduction maintient la tension propre au verset 6 et son contraste résidentiel, sans anticiper le verset suivant ni préciser davantage la nature théologique de l’éloignement.
translation_notes:
  register: Français international moderne, digne et accessible. « Garder courage » évite une formulation pesante tout en conservant la valeur continue du participe; « demeurer dans le corps » préserve l’image résidentielle qui structure le contraste.
