- from: 'Ainsi donc, si quelqu’un est dans le Messie, il y a une création nouvelle[a] : les choses anciennes sont passées ; voici que des choses nouvelles sont venues[b].'
  to: 'Ainsi donc, si quelqu’un est dans le Messie, il y a une création nouvelle[a] : les choses anciennes ont disparu ; voici : des réalités nouvelles sont apparues[b].'
  rationale: La révision améliore l’idiomaticité française et le rendu du parfait γέγονεν, sans modifier la structure elliptique ni résoudre les ambiguïtés interprétatives du grec. Les deux notes restent ancrées aux mêmes emplacements et signalent respectivement la lecture individualisante possible et la variante textuelle élargie.
