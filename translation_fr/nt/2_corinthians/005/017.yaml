source:
  edition: SBLGNT
  text: ὥστε εἴ τις ἐν Χριστῷ, καινὴ κτίσις· τὰ ἀρχαῖα παρῆλθεν, ἰδοὺ γέγονεν ⸀καινά·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/017.yaml
  text: So then[a], if anyone is in Messiah, there is a new creation; the old things have passed away; behold[b], new things have come.
translation:
  language: fr
  text: 'Ainsi donc, si quelqu’un est dans le Messie, il y a une création nouvelle[a] : les choses anciennes ont disparu ; voici : des réalités nouvelles sont apparues[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « cette personne est une création nouvelle ». Le grec est elliptique ; littéralement : « si quelqu’un est dans le Messie — création nouvelle ».'
    reason: alternative_reading
  - marker: b
    text: 'On lit aussi dans la tradition manuscrite : « voici, toutes choses sont devenues nouvelles ». Le texte du SBLGNT porte simplement « des réalités nouvelles sont apparues », sans mot correspondant à « toutes choses ».'
    reason: textual_variant
lexical_decisions:
- source_word: ὥστε
  choice: Ainsi donc
  rationale: Introduit la conséquence tirée de l’argument précédent, tout en conservant un lien logique clair et naturel en français.
- source_word: εἴ τις
  choice: si quelqu’un
  rationale: Rend la condition indéfinie et générale sans introduire de précision masculine absente du grec.
- source_word: ἐν Χριστῷ
  choice: dans le Messie
  rationale: Χριστός conserve ici sa valeur de titre, tandis que la tournure paulinienne d’union avec le Messie est maintenue par « dans ».
- source_word: καινὴ κτίσις
  choice: il y a une création nouvelle
  rationale: Le grec est une proposition nominale elliptique, sans verbe exprimé. Cette formulation française reste ouverte à la portée individuelle et cosmique de « création nouvelle » sans réduire explicitement celle-ci à la personne seule.
- source_word: τὰ ἀρχαῖα
  choice: les choses anciennes
  rationale: L’adjectif neutre pluriel substantivé désigne largement les réalités antérieures ; le pluriel et l’indétermination de leur portée sont conservés.
- source_word: παρῆλθεν
  choice: sont passées
  rationale: Exprime la disparition des réalités anciennes et le résultat qui demeure dans le présent, en accord avec le contraste du verset.
- source_word: ἰδοὺ
  choice: voici que
  rationale: Conserve la fonction déictique et l’appel à constater le résultat, dans un français actuel mais digne.
- source_word: γέγονεν καινά
  choice: des choses nouvelles sont venues
  rationale: Le parfait indique un changement accompli dont le résultat demeure. Le neutre pluriel καινά est rendu explicitement sans ajouter « toutes », absent du texte retenu.
theological_decisions:
- issue: 'Valeur de Χριστῷ : titre ou forme devenue nom propre'
  choice: dans le Messie
  alternative: en Christ
  rationale: Le terme grec est le titre « Messie/Oint ». Le traduire préserve sa portée messianique dans la formule paulinienne, sans nier que « Christ » soit la forme française traditionnelle.
- issue: Interprétation de la proposition elliptique καινὴ κτίσις
  choice: il y a une création nouvelle
  alternative: cette personne est une création nouvelle
  rationale: L’absence de verbe et de sujet explicitement repris permet une déclaration plus large sur la création nouvelle aussi bien qu’une prédication concernant la personne. Le texte principal ne tranche pas plus que le grec ; la lecture individualisée figure en note.
- issue: Portée de καινά dans la dernière proposition
  choice: des choses nouvelles sont venues
  alternative: toutes choses sont devenues nouvelles
  rationale: Le texte du SBLGNT ne comporte pas d’équivalent explicite de « toutes choses ». La traduction suit donc le texte retenu, tandis que la forme élargie connue dans la tradition manuscrite est signalée en note.
translation_notes:
  register: Français international moderne, lisible et digne. La ponctuation met en relief la déclaration elliptique et le contraste entre l’ancien et le nouveau. « Voici que » conserve la force rhétorique de ἰδοὺ sans recourir à un archaïsme marqué.
