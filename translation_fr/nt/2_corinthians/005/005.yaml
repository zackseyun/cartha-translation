id: 2CO.5.5
reference: 2 Corinthians 5:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ δὲ κατεργασάμενος ἡμᾶς εἰς αὐτὸ τοῦτο θεός, ⸀ὁ δοὺς ἡμῖν τὸν ἀρραβῶνα τοῦ πνεύματος.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/005.yaml
  text: The one who prepared us for this very thing is God[b][a], who gave us the down payment of the Spirit.
translation:
  language: fr
  text: Celui qui nous a préparés pour cela même, c’est Dieu, qui nous a donné l’acompte[a] de l’Esprit[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la garantie », « le dépôt » ou « le premier versement ».
    reason: lexical_alternative
  - marker: b
    text: L’expression peut signifier que l’Esprit est lui-même l’acompte, ou que Dieu a donné un acompte garantissant ce que l’Esprit mènera à son accomplissement.
    reason: alternative_reading
lexical_decisions:
- source_word: κατεργασάμενος
  choice: a préparés
  rationale: Dans le contexte, Dieu rend les croyants aptes à la condition future évoquée aux versets 1–4. « Préparés » exprime cette action orientée vers un but, dans un français naturel.
- source_word: εἰς αὐτὸ τοῦτο
  choice: à cela même
  rationale: Cette expression renvoie avec insistance à la réalité qui vient d’être décrite, sans préciser davantage ce que le grec laisse dépendre du contexte.
- source_word: θεός
  choice: c’est Dieu
  rationale: La tournure présentative française souligne naturellement que Dieu est celui qui accomplit cette préparation.
- source_word: δοὺς
  choice: qui nous a donné
  rationale: Le participe aoriste est rendu par une proposition relative fluide, qui rattache le don de l’Esprit à l’action préparatoire de Dieu.
- source_word: ἀρραβῶνα
  choice: l’acompte
  rationale: Le terme désigne un premier versement qui engage et garantit la suite. « Acompte » conserve à la fois la métaphore commerciale et l’idée d’un commencement présent annonçant un accomplissement futur.
- source_word: τοῦ πνεύματος
  choice: de l’Esprit
  rationale: Le génitif grec est conservé afin de ne pas trancher explicitement entre l’Esprit lui-même comme acompte et un acompte lié à ce que l’Esprit accomplira.
- source_word: δὲ
  choice: non exprimé séparément
  rationale: Ici, δέ marque une légère progression du discours. En français, l’enchaînement avec la phrase précédente peut porter cette fonction sans qu’un connecteur ajouté soit nécessaire.
theological_decisions:
- issue: Sens de « l’acompte de l’Esprit »
  choice: Conserver la formulation génitive, qui permet de comprendre que l’Esprit est lui-même l’acompte présent de la vie future promise.
  alternative: Comprendre qu’il s’agit d’un acompte donné en rapport avec l’Esprit, garantissant ce que celui-ci mènera à son accomplissement.
  rationale: L’usage paulinien parallèle favorise l’idée que l’Esprit donné est lui-même l’acompte, mais la syntaxe du verset ne doit pas être explicitée au point d’éliminer l’autre lecture possible.
translation_notes:
  register: Français international moderne, clair et digne. La phrase reste proche de la structure grecque tout en employant la tournure naturelle « c’est Dieu ». « Acompte » maintient l’image concrète sans imposer une interprétation confessionnelle.
