id: 2CO.5.4
reference: 2 Corinthians 5:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ γὰρ οἱ ὄντες ἐν τῷ σκήνει στενάζομεν βαρούμενοι ἐφ’ ᾧ οὐ θέλομεν ἐκδύσασθαι ἀλλ’ ἐπενδύσασθαι, ἵνα καταποθῇ τὸ θνητὸν ὑπὸ τῆς ζωῆς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/004.yaml
  text: For indeed[a], while we are in this tent, we groan, being burdened, because we do not want to be unclothed but to be further clothed[b], so that what is mortal may be swallowed up by life.
translation:
  language: fr
  text: Car, en effet, tant que nous sommes dans cette tente, nous gémissons, accablés, parce que nous ne voulons pas être dévêtus, mais être revêtus par-dessus[a], afin que ce qui est mortel[b] soit englouti par la vie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « être revêtus d’un vêtement par-dessus ». Le verbe grec évoque le fait de mettre un vêtement par-dessus celui que l’on porte déjà.
    reason: lexical_alternative
  - marker: b
    text: Ou « le mortel » ou « la mortalité ».
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: Car, en effet
  rationale: « Car » maintient le lien explicatif avec le contexte précédent, tandis que « en effet » rend l’insistance de la combinaison grecque.
- source_word: σκήνει
  choice: tente
  rationale: Le terme conserve l’image de l’existence corporelle présente comme demeure provisoire et maintient le lien avec les versets voisins.
- source_word: στενάζομεν
  choice: nous gémissons
  rationale: « Gémir » exprime plus nettement que « soupirer » le poids éprouvé et l’attente eschatologique.
- source_word: βαρούμενοι
  choice: accablés
  rationale: Ce participe rend de façon naturelle l’état qui accompagne et explique le gémissement, tout en gardant l’idée d’un poids subi.
- source_word: ἐφ’ ᾧ
  choice: parce que
  rationale: Dans cette construction, l’expression introduit naturellement le motif du gémissement; « parce que » est clair en français moderne sans éliminer la tension de la proposition qui suit.
- source_word: ἐκδύσασθαι
  choice: être dévêtus
  rationale: Ce choix préserve la métaphore vestimentaire sans préciser à quoi correspond doctrinalement cet état.
- source_word: ἐπενδύσασθαι
  choice: être revêtus par-dessus
  rationale: Le verbe composé évoque le fait de mettre un vêtement par-dessus un autre; cette formulation conserve cette nuance plutôt que de réduire le sens à « être vêtus ».
- source_word: καταποθῇ
  choice: soit englouti
  rationale: « Engloutir » conserve l’image vive d’une réalité entièrement absorbée et vaincue par une autre.
- source_word: τὸ θνητόν
  choice: ce qui est mortel
  rationale: L’adjectif grec substantivé au neutre désigne la réalité mortelle sans la limiter explicitement au corps ni la transformer en abstraction.
- source_word: ζωῆς
  choice: la vie
  rationale: « La vie » forme en français un contraste naturel et fort avec « ce qui est mortel ».
theological_decisions:
- issue: La métaphore vestimentaire et l’état intermédiaire
  choice: Conserver les images « être dévêtus » et « être revêtus par-dessus » sans définir l’état qu’elles représentent.
  alternative: Identifier explicitement le dévêtement à une existence désincarnée et le revêtement au seul corps de résurrection.
  rationale: Le grec exprime l’espérance d’une transformation future au moyen d’une métaphore, sans exposer ici un schéma doctrinal complet. La traduction garde donc l’image et sa tension théologique.
translation_notes:
  register: Français international moderne, digne et accessible. La structure imagée de Paul est conservée; « revêtus par-dessus », légèrement marquée en français, est maintenue pour transmettre la force particulière du verbe grec et est éclairée par une note.
