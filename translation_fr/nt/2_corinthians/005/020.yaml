id: 2CO.5.20
reference: 2 Corinthians 5:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὑπὲρ Χριστοῦ οὖν πρεσβεύομεν ὡς τοῦ θεοῦ παρακαλοῦντος δι’ ἡμῶν· δεόμεθα ὑπὲρ Χριστοῦ, καταλλάγητε τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/020.yaml
  text: 'Therefore[a], we are ambassadors for the Messiah, as though God were appealing through us[b]. We beg you on behalf of the Messiah: be reconciled to God.'
translation:
  language: fr
  text: 'Nous sommes donc ambassadeurs au nom du Messie[a], comme si Dieu lançait son appel par notre intermédiaire. Nous vous en supplions au nom du Messie : soyez réconciliés avec Dieu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Christ », dans les deux occurrences de ce verset. Le grec Χριστός est un titre qui signifie « Messie ».'
    reason: alternative_reading
lexical_decisions:
- source_word: ὑπὲρ Χριστοῦ
  choice: au nom du Messie
  rationale: 'Avec le génitif, ὑπέρ exprime ici la représentation : les envoyés agissent pour le Messie, en son nom. Cette formulation est naturelle en français dans le contexte d’une ambassade. « Messie » traduit le titre Χριστός au lieu de le traiter comme un simple nom propre.'
- source_word: οὖν
  choice: donc
  rationale: La particule introduit la conséquence de l’argument précédent sur le ministère de la réconciliation. « Donc » rend clairement ce lien logique sans alourdir la phrase.
- source_word: πρεσβεύομεν
  choice: nous sommes ambassadeurs
  rationale: Le verbe signifie exercer la fonction d’ambassadeur ou d’envoyé. La formulation retenue est directe, idiomatique et conserve la valeur durative du présent.
- source_word: ὡς
  choice: comme si
  rationale: La conjonction présente l’action de Dieu comme la réalité qui se manifeste à travers le ministère des envoyés, tout en conservant la forme comparative du grec.
- source_word: παρακαλοῦντος
  choice: lançait son appel
  rationale: Dans ce contexte de réconciliation, παρακαλέω désigne une démarche pressante d’exhortation ou d’appel. « Lançait son appel » garde un ton à la fois accessible et solennel.
- source_word: δι’ ἡμῶν
  choice: par notre intermédiaire
  rationale: 'διά avec le génitif marque ici le moyen ou l’agence : Dieu adresse son appel au moyen des envoyés.'
- source_word: δεόμεθα
  choice: nous vous en supplions
  rationale: Le verbe exprime une demande insistante et fervente. Cette tournure française restitue l’urgence affective de l’appel sans devenir archaïque.
- source_word: καταλλάγητε
  choice: soyez réconciliés
  rationale: L’impératif aoriste passif appelle les destinataires à recevoir la réconciliation. Le passif est conservé afin de ne pas transformer le texte en « réconciliez-vous » et de ne pas trancher la tension entre action divine et réponse humaine.
- source_word: τῷ θεῷ
  choice: avec Dieu
  rationale: Après le verbe français « réconcilier », « avec Dieu » est la construction idiomatique qui exprime la relation restaurée. Le datif grec peut porter cette valeur relationnelle.
theological_decisions:
- issue: Traduction de Χριστοῦ
  choice: Messie
  alternative: Christ
  rationale: Χριστός fonctionne ici comme un titre. « Messie » en communique le sens, tandis que la forme traditionnelle « Christ » est signalée en note afin de préserver cette lecture familière.
- issue: Voix et agent de la réconciliation
  choice: soyez réconciliés avec Dieu
  alternative: réconciliez-vous avec Dieu
  rationale: 'Le passif grec est maintenu. Ainsi, la traduction conserve la tension du passage : Dieu lance l’appel par l’intermédiaire de ses envoyés, tandis que les auditeurs reçoivent l’ordre d’entrer dans cette réconciliation, sans que le mécanisme de l’action divine et de la réponse humaine soit explicité davantage.'
translation_notes:
  register: Français international moderne, digne et accessible. « Au nom du Messie » rend naturellement la fonction représentative exprimée par ὑπέρ dans ce contexte diplomatique. La phrase évite les formulations archaïques, tout en maintenant l’intensité de l’appel et le passif théologiquement significatif de l’impératif final.
