source:
  edition: SBLGNT
  text: οἷς μὲν ὀσμὴ ⸀ἐκ θανάτου εἰς θάνατον, οἷς δὲ ὀσμὴ ⸁ἐκ ζωῆς εἰς ζωήν. καὶ πρὸς ταῦτα τίς ἱκανός;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/016.yaml
  text: To the one[a], a fragrance from death to death; to the other, a fragrance from life to life[c][b]. And who is sufficient for these things?
translation:
  language: fr
  text: Pour les uns, une odeur de mort à mort ; pour les autres, une odeur de vie à vie.[a] Et qui est capable de cela ?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les expressions « de mort à mort » et « de vie à vie » peuvent indiquer une origine et un aboutissement (« venant de la mort et allant vers la mort » / « venant de la vie et allant vers la vie »), ou renforcer l’idée de mort et de vie.
    reason: alternative_reading
  - marker: b
    text: 'Ou : « Qui est suffisant pour ces choses ? » ou « Qui est à la hauteur de cela ? »'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀσμή
  choice: odeur
  rationale: « Odeur » est le terme français le plus naturel et le plus neutre pour conserver l’image sensorielle. Contrairement à « parfum », il ne suppose pas en lui-même une impression agréable et convient donc aux deux effets opposés.
- source_word: ἐκ θανάτου εἰς θάνατον
  choice: de mort qui mène à la mort
  rationale: Cette formulation garde la répétition et le mouvement exprimé par ἐκ… εἰς, tout en étant plus intelligible en français courant que le calque « de mort à mort ». La note signale que le grec peut aussi avoir une valeur intensive.
- source_word: ἐκ ζωῆς εἰς ζωήν
  choice: de vie qui mène à la vie
  rationale: Le rendu parallèle préserve la symétrie délibérée avec la formule concernant la mort et traduit naturellement le mouvement de la source vers l’aboutissement, sans exclure l’autre nuance possible indiquée en note.
- source_word: πρὸς ταῦτα
  choice: à la hauteur d’une telle tâche
  rationale: Dans la question rhétorique, πρὸς ταῦτα désigne l’ensemble du ministère qui vient d’être évoqué. « Une telle tâche » rend cette référence de manière naturelle sans réduire sa gravité.
- source_word: ἱκανός
  choice: à la hauteur
  rationale: Cette expression française courante et digne exprime le fait d’être capable, qualifié ou suffisant face à une responsabilité exigeante.
theological_decisions:
- issue: Portée des expressions parallèles ἐκ θανάτου εἰς θάνατον et ἐκ ζωῆς εἰς ζωήν
  choice: Exprimer dans le texte principal le mouvement possible de la source vers l’aboutissement, tout en signalant en note la valeur intensive également possible.
  alternative: '« une odeur de mort à mort » / « une odeur de vie à vie », ou une caractérisation intensive : « une odeur mortelle » / « une odeur vivifiante »'
  rationale: Le grec condensé permet de comprendre soit une provenance conduisant à un résultat, soit une caractérisation renforcée. Le français exige ici davantage d’explicitation pour rester clair ; la note préserve l’ambiguïté réelle sans imposer une interprétation doctrinale.
- issue: Référent de l’aptitude demandée dans la question finale
  choice: « à la hauteur d’une telle tâche »
  alternative: « capable de cela » ou « suffisant pour ces choses »
  rationale: Le pluriel ταῦτα renvoie au ministère apostolique décrit dans le contexte. Le mot « tâche » explicite seulement cette référence discursive et ne tranche pas la réponse implicite que Paul développera ensuite.
translation_notes:
  register: Français international moderne, naturel et digne. La structure antithétique « pour les uns… pour les autres » et la répétition « mort… mort / vie… vie » maintiennent le rythme rhétorique. « Odeur » évite la connotation exclusivement agréable de « parfum », tandis que « à la hauteur d’une telle tâche » donne à ἱκανός une expression idiomatique sans lourdeur.
