- from: Pour les uns, une odeur de mort qui mène à la mort ; pour les autres, une odeur de vie qui mène à la vie.[a] Et qui est à la hauteur d’une telle tâche ?[b]
  to: Pour les uns, une odeur de mort à mort ; pour les autres, une odeur de vie à vie.[a] Et qui est capable de cela ?[b]
