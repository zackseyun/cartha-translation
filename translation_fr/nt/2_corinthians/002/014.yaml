source:
  edition: SBLGNT
  text: Τῷ δὲ θεῷ χάρις τῷ πάντοτε θριαμβεύοντι ἡμᾶς ἐν τῷ Χριστῷ καὶ τὴν ὀσμὴν τῆς γνώσεως αὐτοῦ φανεροῦντι δι’ ἡμῶν ἐν παντὶ τόπῳ·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/014.yaml
  text: But thanks be to God[b][a], who always leads us in triumphal procession in the Messiah and makes the fragrance of the knowledge of him known through us in every place.
translation:
  language: fr
  text: Mais grâce soit rendue à Dieu, qui nous conduit toujours dans son cortège triomphal dans le Messie[a] et qui, par nous, manifeste en tout lieu le parfum[b] de la connaissance qu’on a de lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « qui triomphe toujours de nous dans le Messie ».'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « l’arôme ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις
  choice: grâce soit rendue
  rationale: Dans la formule Τῷ δὲ θεῷ χάρις, cette tournure française exprime naturellement l’action de grâce adressée à Dieu et en conserve la force doxologique.
- source_word: θριαμβεύοντι
  choice: nous conduit toujours dans son cortège triomphal
  rationale: Le verbe évoque concrètement le triomphe antique et garde ἡμᾶς comme complément d’objet. Le sens possible « triomphe de nous » est maintenu en note.
- source_word: ἐν τῷ Χριστῷ
  choice: dans le Messie
  rationale: Χριστός garde ici sa valeur de titre; « dans » préserve l’expression paulinienne d’union ou de sphère sans la préciser davantage.
- source_word: ὀσμὴν
  choice: parfum
  rationale: Dans cette métaphore, « parfum » exprime le sens contextuellement favorable et convient à un français moderne et digne.
- source_word: γνώσεως αὐτοῦ
  choice: la connaissance qu’on a de lui
  rationale: Cette formulation rend naturellement le génitif objectif le plus probable tout en évitant de confondre cette connaissance avec celle que Dieu possède.
- source_word: φανεροῦντι
  choice: répand
  rationale: Avec l’image olfactive, « répand » fait comprendre que Dieu rend partout perceptible et manifeste le parfum, sans alourdir la phrase.
- source_word: δι’ ἡμῶν
  choice: par nous
  rationale: διά suivi du génitif indique ici l’intermédiaire ou l’instrument humain employé par Dieu.
- source_word: ἐν παντὶ τόπῳ
  choice: en tout lieu
  rationale: Cette expression reste proche du grec, naturelle en français soutenu courant, et conserve l’accent sur l’étendue géographique.
theological_decisions:
- issue: Sens de θριαμβεύω avec ἡμᾶς comme objet
  choice: Dieu conduit Paul et ses compagnons dans son cortège triomphal dans le Messie.
  alternative: Dieu triomphe de Paul et de ses compagnons dans le Messie, comme de captifs exhibés dans un triomphe.
  rationale: Le texte principal garde l’image vive du cortège et s’enchaîne bien avec celle du parfum. Puisque le verbe peut aussi présenter les apôtres comme ceux dont Dieu a triomphé, cette tension est explicitement conservée en note.
translation_notes:
  register: Français international moderne, naturel et digne. « Cortège triomphal » conserve l’arrière-plan antique sans exiger de connaissances spécialisées; « grâce soit rendue à Dieu » maintient le ton de louange de Paul.
