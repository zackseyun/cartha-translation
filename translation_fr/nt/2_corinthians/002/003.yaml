source:
  edition: SBLGNT
  text: καὶ ⸀ἔγραψα τοῦτο αὐτὸ ἵνα μὴ ἐλθὼν λύπην ⸀σχῶ ἀφ’ ὧν ἔδει με χαίρειν, πεποιθὼς ἐπὶ πάντας ὑμᾶς ὅτι ἡ ἐμὴ χαρὰ πάντων ὑμῶν ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/003.yaml
  text: And I wrote this very thing so that, when I came, I might not have grief from those who ought to make me rejoice, because I was confident about all of you that my joy is the joy of you all.
translation:
  language: fr
  text: 'J’ai écrit cela même afin que, à mon arrivée, je n’éprouve pas de tristesse de la part de ceux qui devraient faire ma joie[a], ayant confiance en vous tous : ma joie est celle de vous tous.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « de la part de ceux dont je devrais me réjouir ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγραψα
  choice: J’ai écrit
  rationale: Le passé composé exprime naturellement en français une action antérieure dont les effets restent pertinents dans le contexte.
- source_word: τοῦτο αὐτό
  choice: précisément cela
  rationale: Cette formulation rend l’insistance de l’expression grecque dans un français naturel et soutenu.
- source_word: ἵνα μὴ ἐλθὼν λύπην σχῶ
  choice: afin que, à mon arrivée, je n’éprouve pas de tristesse
  rationale: « Afin que » conserve la valeur finale de ἵνα, tandis que « à mon arrivée » rend idiomatiquement le participe circonstanciel ἐλθών.
- source_word: ἀφ’ ὧν ἔδει με χαίρειν
  choice: de la part de ceux qui devraient me donner de la joie
  rationale: Cette tournure explicite naturellement que ces personnes devraient être pour Paul une source de joie, tout en signalant en note la formulation grecque plus littérale.
- source_word: πεποιθὼς ἐπὶ πάντας ὑμᾶς
  choice: ayant confiance en vous tous
  rationale: Le participe français reflète la construction participiale grecque sans imposer une relation strictement causale; le parfait indique une confiance établie.
- source_word: ἡ ἐμὴ χαρὰ πάντων ὑμῶν ἐστιν
  choice: ma joie est celle de vous tous
  rationale: La formulation conserve la structure ramassée du grec et l’idée d’une joie commune à Paul et à l’ensemble des Corinthiens.
theological_decisions:
- issue: Relation logique du participe πεποιθώς avec la proposition principale
  choice: ayant confiance en vous tous
  alternative: car j’ai confiance en vous tous
  rationale: Le grec emploie un participe dont la nuance peut être circonstancielle ou causale. La traduction participiale préserve cette souplesse au lieu de renforcer explicitement la causalité.
- issue: Portée de πάντων ὑμῶν dans l’affirmation sur la joie
  choice: ma joie est celle de vous tous
  alternative: vous partagez tous ma joie
  rationale: La formulation retenue maintient l’ambiguïté condensée du génitif grec entre appartenance et partage, sans réduire la phrase à une seule interprétation.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase garde le mouvement argumentatif de Paul et sa construction participiale, tout en évitant un calque inutilement lourd.
