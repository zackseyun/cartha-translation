  text: οὐκ ἔσχηκα ἄνεσιν τῷ πνεύματί μου τῷ μὴ εὑρεῖν με Τίτον τὸν ἀδελφόν μου, ἀλλὰ ἀποταξάμενος αὐτοῖς ἐξῆλθον εἰς Μακεδονίαν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/013.yaml
  text: I had no rest in my spirit because I did not find Titus my brother[a], but after taking leave of them[c][b], I went on to Macedonia.
translation:
  language: fr
  text: Je n’ai eu aucun repos dans mon esprit, parce que je n’ai pas trouvé Tite, mon frère[a]. Mais après avoir pris congé d’eux[b], je suis parti pour la Macédoine.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Mon frère » désigne ici Tite comme frère dans la foi et collaborateur de Paul.
    reason: cultural_note
  - marker: b
    text: 'Ou : « après leur avoir dit adieu ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἔσχηκα
  choice: Je n’ai eu aucun
  rationale: Le parfait grec décrit ici, dans le fil narratif, l’absence de repos éprouvée par Paul avant son départ. Le passé composé est naturel en français et conserve la forme résultative sans alourdir la phrase.
- source_word: ἄνεσιν
  choice: repos
  rationale: « Repos » convient à l’état intérieur troublé de Paul et correspond directement au nom grec, tout en restant naturel et digne en français moderne.
- source_word: τῷ πνεύματί μου
  choice: dans mon esprit
  rationale: Le datif peut indiquer la sphère ou le rapport. « Dans mon esprit » préserve la dimension intérieure de l’expression sans décider s’il s’agit strictement de la psychologie humaine ou d’une nuance théologique.
- source_word: τῷ μὴ εὑρεῖν με Τίτον
  choice: parce que je n’ai pas trouvé Tite
  rationale: L’infinitif articulaire négatif donne la cause de l’absence de repos. Cette formulation française exprime clairement cette relation sans ajouter l’idée que Paul aurait été incapable de trouver Tite.
- source_word: Τίτον τὸν ἀδελφόν μου
  choice: Tite, mon frère
  rationale: La formulation conserve la métaphore familiale employée par Paul pour parler de Tite, croyant et collaborateur, ainsi que la chaleur du lien personnel.
- source_word: ἀποταξάμενος αὐτοῖς
  choice: après avoir pris congé d’eux
  rationale: Le participe aoriste marque une action antérieure au départ. « Prendre congé de » est idiomatique, actuel et adapté au registre du récit.
- source_word: ἐξῆλθον εἰς Μακεδονίαν
  choice: je suis parti pour la Macédoine
  rationale: Le verbe exprime le départ vers la Macédoine. Cette tournure est plus naturelle en français que le calque « je suis sorti vers », sans modifier le mouvement indiqué.
theological_decisions:
- issue: Sens de « mon esprit »
  choice: Conserver « dans mon esprit »
  alternative: « pour mon esprit » ou une paraphrase telle que « intérieurement »
  rationale: Le grec permet une nuance de sphère ou de rapport. La traduction retenue garde l’expression de Paul et son ambiguïté sans réduire πνεῦμα à un simple état psychologique ni lui imposer un sens pneumatologique.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proche du mouvement grec tout en évitant les calques. « Tite » et « Macédoine » suivent les formes françaises bibliques usuelles.
