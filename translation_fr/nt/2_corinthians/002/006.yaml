  text: This punishment by the majority is enough for such a man,[a]
translation:
  language: fr
  text: Pour un tel homme, cette sanction infligée par la majorité est suffisante.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « La sanction infligée par la plupart d’entre eux suffit pour un tel homme. »
    reason: 'Variante de formulation : « la plupart d’entre eux » rend également τῶν πλειόνων, et l’ordre des constituants suit plus directement la phrase grecque.'
lexical_decisions:
- source_word: ἱκανὸν
  choice: est suffisante
  rationale: Le terme forme le prédicat de la proposition et indique que la mesure disciplinaire a atteint un degré adéquat. « Est suffisante » convient au registre digne du passage sans être archaïque.
- source_word: τῷ τοιούτῳ
  choice: pour un tel homme
  rationale: L’expression désigne ici un individu précis, masculin singulier, déjà connu des destinataires. Cette formulation reste naturelle tout en conservant cette référence personnelle.
- source_word: ἐπιτιμία
  choice: la sanction
  rationale: Dans ce contexte, le mot désigne une mesure disciplinaire concrète imposée par la communauté. « Sanction » exprime mieux cela qu’un simple reproche verbal, tout en évitant les connotations parfois excessives de « châtiment ».
- source_word: ἡ ὑπὸ τῶν πλειόνων
  choice: infligée par la majorité
  rationale: Le participe français explicite naturellement la relation passive exprimée en grec par ὑπό. « La majorité » rend le sens probable du groupe le plus nombreux sans identifier davantage ceux qui le composent.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. L’ordre de la phrase met d’abord en relief la personne concernée, comme le datif grec, puis présente la mesure communautaire comme désormais suffisante.
