  text: so that we would not be outwitted by Satan[b][a], for we are not ignorant of his schemes.
translation:
  language: fr
  text: afin que Satan ne tire pas avantage de nous[a], car nous n’ignorons pas ses desseins[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ne nous exploite » ou « ne nous dupe ».
    reason: lexical_alternative
  - marker: b
    text: Ou « pensées », « intentions » ou « manœuvres ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα μὴ
  choice: afin que… ne… pas
  rationale: Exprime naturellement en français le but préventif de la proposition grecque, sans trancher excessivement entre but et résultat attendu.
- source_word: πλεονεκτηθῶμεν
  choice: ne prenne pas l’avantage sur nous
  rationale: La tournure active est plus naturelle en français que le passif grec et conserve l’idée d’être dominé, lésé ou exploité par quelqu’un de plus habile.
- source_word: Σατανᾶ
  choice: Satan
  rationale: Le nom personnel est conservé sous sa forme française traditionnelle.
- source_word: γὰρ
  choice: car
  rationale: Introduit avec concision la raison qui justifie la précaution exprimée dans la première proposition.
- source_word: νοήματα
  choice: desseins
  rationale: Dans ce contexte hostile, le terme désigne les pensées ou intentions calculées de Satan. « Desseins » garde le lien avec l’intention sans réduire le sens à une simple ruse.
- source_word: ἀγνοοῦμεν
  choice: nous n’ignorons pas
  rationale: Reproduit directement la négation grecque et son vocabulaire de connaissance dans un français clair et digne.
