  text: For if I grieve you[a], who is there to make me glad except the one who is grieved by me?
translation:
  language: fr
  text: Car si je vous attriste, qui donc peut me réjouir, sinon celui qui est attristé par moi[a] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « à cause de moi ». Littéralement : « de moi » ; l’expression peut indiquer la source ou la cause de la tristesse.'
    reason: Conserve l’ambiguïté de ἐξ ἐμοῦ entre l’agent/source (« par moi ») et la cause (« à cause de moi »).
lexical_decisions:
- source_word: λυπῶ
  choice: je vous attriste
  rationale: Le verbe exprime le fait de causer de la tristesse. « Attrister » est direct, naturel et conserve la valeur causative du grec.
- source_word: εὐφραίνων
  choice: peut me réjouir
  rationale: Le participe désigne celui qui apporte de la joie à Paul. Avec la question rhétorique, « peut me réjouir » est idiomatique en français et maintient le contraste avec « attrister ».
- source_word: τίς ὁ εὐφραίνων με
  choice: qui donc peut me réjouir
  rationale: Cette formulation rend naturellement la question rhétorique et la force du participe substantivé; « donc » traduit ici l’insistance contextuelle sans ajouter une conclusion doctrinale.
- source_word: ὁ λυπούμενος ἐξ ἐμοῦ
  choice: celui que j’ai attristé
  rationale: Le grec présente un participe passif et ἐξ ἐμοῦ indique la source ou la cause. La tournure active est plus naturelle en français tout en identifiant fidèlement Paul comme cause de la tristesse.
- source_word: γὰρ
  choice: Car
  rationale: « Car » marque clairement le lien explicatif avec le raisonnement précédent.
