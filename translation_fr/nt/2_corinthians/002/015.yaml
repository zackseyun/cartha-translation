  yaml_path: translation/nt/2_corinthians/002/015.yaml
  text: For we are the aroma of Messiah to God among those who are being saved and among those who are perishing[b][a],
translation:
  language: fr
  text: Car nous sommes pour Dieu le parfum du Messie[a], parmi ceux qui sont en train d’être sauvés et parmi ceux qui périssent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « du Christ ».
    reason: traduction alternative de Χριστοῦ
lexical_decisions:
- source_word: ὅτι
  choice: Car
  rationale: La conjonction introduit ici l’explication de l’affirmation précédente; « Car » en conserve la valeur explicative et causale.
- source_word: Χριστοῦ
  choice: du Messie
  rationale: Le génitif indique que le parfum appartient au Messie ou le manifeste. « Messie » fait entendre la valeur de titre de Χριστός; « Christ » reste une traduction traditionnelle possible et figure en note.
- source_word: εὐωδία
  choice: le parfum
  rationale: « Parfum » restitue naturellement la métaphore olfactive sans ajouter l’idée de douceur ou d’agrément, qui n’est pas explicitement exprimée ici.
- source_word: τῷ θεῷ
  choice: pour Dieu
  rationale: Le datif exprime la relation ou la destination du parfum envers Dieu. « Pour Dieu » est idiomatique en français et reste proche de la construction grecque.
- source_word: ἐν τοῖς σῳζομένοις
  choice: parmi ceux qui sont en train d’être sauvés
  rationale: Cette formulation rend la valeur progressive du participe présent passif et évite de réduire le groupe à l’étiquette statique « les sauvés ».
- source_word: ἐν τοῖς ἀπολλυμένοις
  choice: parmi ceux qui périssent
  rationale: « Périssent » conserve la valeur en cours du participe présent et son sens de perdition, sans préciser indûment la manière de cette destruction.
theological_decisions:
- issue: Valeur processuelle de σῳζομένοις et ἀπολλυμένοις
  choice: 'Présenter le salut et la perdition comme des réalités en cours : « sont en train d’être sauvés » et « périssent ».'
  alternative: « les sauvés » et « les perdus »
  rationale: Les participes présents grecs décrivent deux processus ou situations en cours. La traduction préserve cette tension plutôt que de les transformer en catégories purement achevées.
- issue: Valeur titulaire de Χριστοῦ
  choice: « du Messie » dans le texte
  alternative: « du Christ »
  rationale: Dans cette construction, Χριστός peut encore être entendu comme un titre. La traduction principale le rend explicite, tout en signalant en note la forme traditionnelle qui peut fonctionner comme une désignation quasi nominale.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « parmi » reflète les deux groupes parallèles introduits chacun par ἐν; « comme » rend leur mise en parallèle plus naturelle en français sans effacer cette structure.
