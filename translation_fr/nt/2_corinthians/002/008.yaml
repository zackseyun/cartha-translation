  text: C’est pourquoi je vous exhorte à confirmer votre amour à son égard.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διό
  choice: C’est pourquoi
  rationale: Exprime naturellement en français la conséquence tirée de l’exhortation précédente.
- source_word: παρακαλῶ
  choice: je vous encourage
  rationale: Rend ici l’appel pressant de Paul sans la dureté que pourrait suggérer « ordonner »; « exhorter » serait possible mais moins courant.
- source_word: κυρῶσαι
  choice: confirmer
  rationale: Conserve le sens de rendre valide, ratifier ou manifester officiellement; le contexte invite la communauté à donner une confirmation concrète de son amour.
- source_word: εἰς αὐτὸν ἀγάπην
  choice: votre amour envers lui
  rationale: « Envers lui » restitue la direction exprimée par εἰς; le possessif « votre » est explicité naturellement à partir du destinataire pluriel.
theological_decisions:
- issue: Nature de la confirmation de l’amour
  choice: confirmer votre amour
  alternative: réaffirmer votre amour
  rationale: « Confirmer » suit directement κυρῶσαι et ne présuppose pas nécessairement qu’une déclaration antérieure d’amour doive être répétée; le verset laisse ouverte la forme concrète de cette confirmation.
translation_notes:
  register: Français international moderne, simple et digne. La formulation reste proche de la structure grecque tout en étant naturelle à l’oral comme à l’écrit.
