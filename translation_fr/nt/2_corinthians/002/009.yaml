review_pass:
  verdict: revise
  source_fidelity: La proposition de but ἵνα γνῶ régit à la fois τὴν δοκιμὴν ὑμῶν et la question indirecte introduite par εἰ. Le grec ne coordonne pas deux buts distincts. « La preuve que vous donnez » rend δοκιμή de manière plus idiomatique et moins interprétative que « votre valeur éprouvée », tout en conservant, en note, l’ambiguïté entre l’épreuve et son résultat démontré.
  naturalness: « Votre valeur éprouvée » est compréhensible, mais peu naturel en français moderne dans ce contexte. La coordination « afin de connaître …, et de savoir si » suggère deux infinitifs de but là où le grec présente une seule démarche de constatation. Une apposition avec « à savoir si » rend la relation plus clairement.
  terminology: « Obéissants en tout » est fidèle à ὑπήκοοι εἰς πάντα et convient au registre. « La preuve que vous donnez » ne spécifie pas indûment la nature morale de la δοκιμή; la note maintient les autres sens lexicalement possibles.
  issues:
  - severity: medium
    issue: La coordination « et de savoir » dédouble la proposition de but.
    rationale: ἵνα γνῶ n’est exprimé qu’une fois et εἰ introduit ce que Paul veut constater au sujet de leur δοκιμή. Il est préférable de marquer en français le rapport explicatif plutôt que deux objectifs indépendants.
  - severity: low
    issue: « Votre valeur éprouvée » est une formulation française raide et légèrement abstraite.
    rationale: Elle peut évoquer une valeur intrinsèque plutôt que la preuve ou le résultat manifeste visé par δοκιμή. « La preuve que vous donnez » est plus courant sans trancher au-delà du texte.
  revised_text: 'C’est aussi dans ce but que j’ai écrit : afin de connaître la preuve que vous donnez[a], à savoir si vous êtes obéissants en tout.'
  revised_footnotes:
