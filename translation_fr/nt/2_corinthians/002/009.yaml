  text: εἰς τοῦτο γὰρ καὶ ἔγραψα ἵνα γνῶ τὴν δοκιμὴν ὑμῶν, εἰ εἰς πάντα ὑπήκοοί ἐστε.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/009.yaml
  text: 'For this is why I also wrote: so that I might know the proof of you[a], whether you are obedient in everything.'
translation:
  language: fr
  text: 'C’est aussi dans ce but que j’ai écrit : afin de connaître la preuve que vous donnez[a], à savoir si vous êtes obéissants en tout.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le résultat de votre mise à l’épreuve » ou « votre valeur éprouvée ». Le terme grec peut désigner l’épreuve elle-même ou la qualité qu’elle met en évidence.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς τοῦτο γὰρ καὶ
  choice: C’est aussi dans ce but que
  rationale: Cette formulation française naturelle conserve la valeur explicative de γάρ, la visée exprimée par εἰς τοῦτο et la nuance additive de καί.
- source_word: ἔγραψα
  choice: j’ai écrit
  rationale: Le passé composé convient ici au récit épistolaire en français moderne, sans préciser un complément absent du texte grec.
- source_word: ἵνα γνῶ
  choice: afin de connaître
  rationale: La traduction garde explicitement la proposition de but et le sens de parvenir à connaître ou à constater.
- source_word: τὴν δοκιμὴν ὑμῶν
  choice: votre valeur éprouvée[a]
  rationale: δοκιμή peut désigner l’épreuve, son résultat probant ou la qualité démontrée par elle. « Votre valeur éprouvée » reste concise et intelligible, tandis que la note préserve l’étendue sémantique du grec.
- source_word: εἰ εἰς πάντα ὑπήκοοί ἐστε
  choice: et de savoir si vous êtes obéissants en tout
  rationale: « Si » conserve ici la valeur d’interrogation indirecte de εἰ, et « en tout » rend la portée globale de εἰς πάντα. La coordination rend en français le lien explicatif entre la valeur éprouvée et l’obéissance, sans les identifier entièrement.
theological_decisions:
- issue: Nature de la δοκιμή des destinataires
  choice: votre valeur éprouvée
  alternative: votre mise à l’épreuve / la preuve que vous donnez
  rationale: Le texte peut viser soit l’épreuve elle-même, soit le résultat ou la qualité qu’elle manifeste. La traduction principale privilégie une expression française naturelle sans réduire δοκιμή à une simple procédure ni lui attribuer une qualité morale plus précise que le contexte.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve le ton explicatif de Paul et la portée exhaustive de l’obéissance, tout en signalant l’ambiguïté lexicale de δοκιμή.
