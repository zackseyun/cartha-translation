source:
  edition: SBLGNT
  text: οὐ γάρ ἐσμεν ὡς οἱ ⸀πολλοὶ καπηλεύοντες τὸν λόγον τοῦ θεοῦ, ἀλλ’ ὡς ἐξ εἰλικρινείας, ἀλλ’ ὡς ἐκ θεοῦ ⸀κατέναντι θεοῦ ἐν Χριστῷ λαλοῦμεν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/017.yaml
  text: For we are not like the many[a], peddling the word of God, but as from sincerity, but as from God[f][e][d][c][b], before God we speak in Messiah.
translation:
  language: fr
  text: Car nous ne sommes pas comme beaucoup de gens[a], qui font commerce de la parole de Dieu[b] ; mais c’est avec sincérité[c] et comme de la part de Dieu que, devant Dieu[d], nous parlons dans le Messie[e].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les nombreux » ; on peut aussi comprendre « la plupart » ou « beaucoup d’autres ».'
    reason: lexical_alternative
  - marker: b
    text: Le verbe grec évoque l’activité d’un marchand peu scrupuleux ; il peut suggérer la recherche du profit et, par extension, l’altération de ce qui est vendu.
    reason: lexical_alternative
  - marker: c
    text: 'Plus littéralement : « comme à partir de la sincérité ». On peut aussi traduire : « en toute sincérité ».'
    reason: source_form
  - marker: d
    text: 'Ou : « sous le regard de Dieu » ou « en présence de Dieu ».'
    reason: lexical_alternative
  - marker: e
    text: 'Formulation traditionnelle : « dans le Christ ».'
    reason: alternative_rendering
lexical_decisions:
- source_word: οἱ πολλοί
  choice: tant d’autres
  rationale: Cette expression française naturelle maintient le contraste entre Paul et un groupe nombreux sans affirmer statistiquement qu’il s’agit de la majorité. La formulation plus littérale « les nombreux » serait peu idiomatique ici.
- source_word: καπηλεύοντες
  choice: qui font commerce de
  rationale: Le verbe présente ces personnes comme des marchands peu scrupuleux qui exploitent la parole de Dieu à leur profit. « Faire commerce de » conserve l’image commerciale sans réduire le sens à la seule falsification.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: la parole de Dieu
  rationale: Rendu direct du groupe génitival, conforme à l’usage paulinien et au registre solennel du passage.
- source_word: ἐξ εἰλικρινείας
  choice: avec sincérité
  rationale: Cette tournure idiomatique exprime clairement la qualité et la motivation du discours. Le grec marque plus littéralement une provenance, nuance signalée en note.
- source_word: ἐκ θεοῦ
  choice: comme venant de Dieu
  rationale: « Venant de Dieu » rend la provenance marquée par ἐκ, tandis que « comme » conserve la force de ὡς sans ajouter explicitement l’idée d’un envoi.
- source_word: κατέναντι θεοῦ
  choice: devant Dieu
  rationale: Formulation concise qui exprime à la fois la présence de Dieu et la responsabilité du locuteur devant lui.
- source_word: ἐν Χριστῷ
  choice: dans le Messie
  rationale: La préposition est rendue directement, et Χριστός est traduit comme un titre. La formule situe la parole apostolique dans la relation et la sphère du Messie.
- source_word: λαλοῦμεν
  choice: nous parlons
  rationale: Rendu simple du présent grec, sans renforcer indûment le verbe en « proclamer ».
theological_decisions:
- issue: Valeur de Χριστῷ dans ἐν Χριστῷ
  choice: dans le Messie
  alternative: dans le Christ
  rationale: Le grec emploie le titre Χριστός, « Oint/Messie ». « Messie » en maintient le contenu titulaire, tandis que la formulation traditionnelle est indiquée en note.
- issue: Origine et intégrité du ministère apostolique
  choice: avec sincérité, comme venant de Dieu
  alternative: comme mus par la sincérité et comme envoyés par Dieu
  rationale: Le choix conserve la sincérité et l’origine divine affirmées dans le grec, sans préciser si ὡς décrit l’apparence, la qualité ou le statut des locuteurs, et sans introduire explicitement la notion d’envoi.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase grecque très compacte est répartie en deux phrases pour éviter une accumulation obscure. « Au contraire » porte le double contraste introduit par ἀλλά ; le parallélisme de provenance demeure perceptible dans « avec sincérité, comme venant de Dieu ». Toutes les notes sont appelées dans le texte.
