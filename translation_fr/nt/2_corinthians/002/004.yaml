base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/004.yaml
  text: For out of much affliction and anguish of heart I wrote to you through many tears[a], not so that you might be grieved[b], but so that you might know the love that I have especially for you.
translation:
  language: fr
  text: Car c’est dans une grande détresse et une profonde angoisse du cœur que je vous ai écrit, avec beaucoup de larmes, non pour vous attrister, mais pour que vous sachiez l’amour particulièrement grand que j’ai pour vous.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « l’amour que j’ai pour vous plus grand encore » ou « plus abondant » ; le comparatif grec peut souligner l’intensité de cet amour ou impliquer une comparaison dont le terme n’est pas exprimé.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ πολλῆς θλίψεως
  choice: dans une grande détresse
  rationale: ἐκ indique ici que l’écriture a jailli d’une profonde détresse. La tournure française « c’est dans… que » exprime naturellement cette situation intérieure sans limiter θλίψις à une persécution extérieure.
- source_word: συνοχῆς καρδίας
  choice: le cœur angoissé
  rationale: συνοχή évoque un resserrement ou une oppression intérieure. « Le cœur angoissé » conserve l’intensité affective dans un français actuel et digne.
- source_word: ἔγραψα ὑμῖν
  choice: je vous ai écrit
  rationale: Le passé composé rend naturellement l’aoriste français sans ajouter explicitement l’idée d’une lettre antérieure, qui relève du contexte.
- source_word: διὰ πολλῶν δακρύων
  choice: avec beaucoup de larmes
  rationale: La préposition διά décrit ici les larmes qui accompagnent et traversent l’acte d’écrire. Cette expression est naturelle en français et garde l’image concrète.
- source_word: λυπηθῆτε
  choice: vous attrister
  rationale: Le verbe français employé transitivement après « pour » exprime clairement que Paul ne cherchait pas à leur causer de la tristesse.
- source_word: γνῶτε
  choice: vous sachiez
  rationale: « Savoir quel amour » est idiomatique en français et exprime le but de la lettre sans surinterpréter le degré de connaissance visé.
- source_word: ἀγάπην
  choice: amour
  rationale: « Amour » est l’équivalent français direct et usuel de ἀγάπη dans ce contexte relationnel.
- source_word: περισσοτέρως εἰς ὑμᾶς
  choice: quel amour tout particulier j’ai pour vous
  rationale: περισσοτέρως marque un degré supérieur ou une intensité remarquable. « Tout particulier » reste naturel et laisse ouverte la question de savoir si la comparaison est explicite ou simplement intensive.
theological_decisions:
- issue: Portée comparative ou intensive de περισσοτέρως
  choice: tout particulier
  alternative: plus abondant envers vous / particulièrement grand pour vous
  rationale: Le comparatif grec peut signifier « davantage » ou fonctionner comme un intensif. Le texte principal adopte une formulation française naturelle qui ne précise pas l’objet implicite de la comparaison; la note conserve la valeur plus littérale.
translation_notes:
  register: Français international moderne, chaleureux et digne. La construction mise en relief (« c’est dans… que ») maintient le lien entre la détresse intérieure de Paul et son acte d’écrire. Aucun terme confessionnel particulier n’est introduit.
