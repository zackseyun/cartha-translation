source:
  edition: SBLGNT
  text: Εἰ δέ τις λελύπηκεν, οὐκ ἐμὲ λελύπηκεν, ἀλλὰ ἀπὸ μέρους ἵνα μὴ ἐπιβαρῶ πάντας ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/005.yaml
  text: But if anyone has caused grief[a], he has grieved not me, but in part all of you—to some extent[b], so that I may not overstate it.
translation:
  language: fr
  text: Mais si quelqu’un a causé de la tristesse, ce n’est pas moi qu’il a attristé, mais, dans une certaine mesure, vous tous — afin de ne pas exagérer.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « ce n’est pas moi qu’il a attristé, mais seulement en partie, afin de ne pas peser trop lourdement sur vous tous ».'
    reason: 'ambiguïté syntaxique et lexicale : « vous tous » peut se rattacher au verbe « attristé » ou à ἐπιβαρῶ, « peser lourdement sur ».'
lexical_decisions:
- source_word: λελύπηκεν
  choice: a causé de la tristesse / a attristé
  rationale: Le passé composé rend naturellement en français l’acte passé dont les effets demeurent, tandis que la répétition du même champ lexical conserve le lien entre les deux emplois de λυπέω.
- source_word: οὐκ ἐμὲ
  choice: ce n’est pas moi qu’il a attristé
  rationale: Cette tournure française exprime directement le contraste marqué par la place du pronom grec, sans ajouter « personnellement ».
- source_word: ἀπὸ μέρους
  choice: dans une certaine mesure
  rationale: Cette expression rend idiomatiquement la valeur adverbiale de la locution grecque et maintient la réserve avec laquelle Paul qualifie l’étendue de la tristesse.
- source_word: ἐπιβαρῶ
  choice: pour ne pas exagérer
  rationale: Dans cette lecture syntaxique, Paul atténue la portée de son affirmation afin de ne pas la formuler trop lourdement. L’autre lecture, plus littérale, « accabler », est signalée en note.
- source_word: πάντας ὑμᾶς
  choice: vous tous
  rationale: La formulation conserve explicitement la portée collective de πάντας.
theological_decisions:
- issue: Rattachement syntaxique de πάντας ὑμᾶς et sens de ἵνα μὴ ἐπιβαρῶ
  choice: « vous tous » complète l’idée d’« attrister », tandis que « pour ne pas exagérer » rend la réserve rhétorique
  alternative: « mais seulement en partie, afin que je ne vous accable pas tous »
  rationale: La syntaxe grecque permet de comprendre πάντας ὑμᾶς soit comme le groupe attristé, malgré sa position tardive, soit comme le complément de ἐπιβαρῶ. Le texte principal privilégie la lecture contextuellement fluide sans éliminer l’autre possibilité, conservée en note.
translation_notes:
  register: Français international moderne, sobre et digne. « Tristesse / attristé » garde l’écho lexical du grec; l’incise avec tiret reproduit l’atténuation rhétorique sans alourdir la phrase.
