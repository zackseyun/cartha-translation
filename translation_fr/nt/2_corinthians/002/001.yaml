source:
  edition: SBLGNT
  text: ἔκρινα ⸀γὰρ ἐμαυτῷ τοῦτο, τὸ μὴ πάλιν ἐν λύπῃ πρὸς ὑμᾶς ἐλθεῖν·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/001.yaml
  text: 'For I decided this for myself: not to come to you again in sorrow[a].'
translation:
  language: fr
  text: 'Car j’ai pris cette décision : ne pas retourner auprès de vous dans la tristesse[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avec tristesse ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκρινα
  choice: j’ai décidé
  rationale: Dans ce contexte, l’aoriste de κρίνω exprime une décision arrêtée. « J’ai décidé » est naturel en français moderne et conserve la dimension délibérative.
- source_word: γὰρ
  choice: car
  rationale: γάρ rattache cette décision à ce qui précède en donnant une explication. « Car » préserve clairement ce lien logique.
- source_word: ἐμαυτῷ
  choice: en moi-même
  rationale: Le datif réfléchi présente la décision comme prise intérieurement et personnellement. « En moi-même » rend cette nuance sans ajouter d’idée étrangère.
- source_word: τοῦτο
  choice: ceci
  rationale: Le démonstratif annonce le contenu précisé par l’infinitif qui suit. Les deux-points rendent cette structure claire en français.
- source_word: τὸ μὴ ... ἐλθεῖν
  choice: ne pas revenir
  rationale: L’infinitif substantivé indique le contenu de la décision. Avec πάλιν et le contexte d’une nouvelle visite, « ne pas revenir » est plus idiomatique que « ne pas venir de nouveau ».
- source_word: πάλιν
  choice: revenir
  rationale: La notion de répétition portée par πάλιν est naturellement intégrée au verbe français « revenir ».
- source_word: ἐν λύπῃ
  choice: dans la tristesse
  rationale: Cette traduction conserve la construction prépositionnelle et l’ambiguïté quant à savoir si la tristesse caractérise Paul, les destinataires ou la visite elle-même.
- source_word: πρὸς ὑμᾶς
  choice: chez vous
  rationale: Avec un verbe de déplacement vers des personnes, πρός désigne leur destination. « Chez vous » est naturel pour une visite adressée à une communauté.
theological_decisions:
- issue: Portée de ἐν λύπῃ
  choice: dans la tristesse
  alternative: en vous attristant
  rationale: Le grec ne dit pas explicitement que Paul causerait la tristesse aux Corinthiens. La formulation retenue maintient la portée ouverte de l’expression.
translation_notes:
  register: Français moderne, clair et digne. La tournure « en moi-même ceci » garde la structure prospective du grec, tandis que les deux-points en facilitent la lecture. « Dans la tristesse » préserve l’ambiguïté réelle de l’expression source.
