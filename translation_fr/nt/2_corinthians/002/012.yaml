id: 2CO.2.12
reference: 2 Corinthians 2:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἐλθὼν δὲ εἰς τὴν Τρῳάδα εἰς τὸ εὐαγγέλιον τοῦ Χριστοῦ καὶ θύρας μοι ἀνεῳγμένης ἐν κυρίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/012.yaml
  text: When I came to Troas for the gospel of Messiah[a], and a door had been opened for me in the Lord[b],
translation:
  language: fr
  text: Lorsque je suis arrivé à Troas pour l’Évangile du Messie[a] et qu’une porte m’avait été ouverte dans le Seigneur[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « l’Évangile du Christ ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « une porte se trouvait ouverte pour moi dans le Seigneur ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐλθὼν δὲ
  choice: Lorsque je suis arrivé
  rationale: Le participe aoriste est compris temporellement. « Lorsque je suis arrivé » est naturel en français et δέ, transition légère, n’exige pas ici un connecteur distinct.
- source_word: εἰς τὴν Τρῳάδα
  choice: à Troas
  rationale: Rendu directionnel idiomatique de εἰς devant un nom de lieu.
- source_word: εἰς τὸ εὐαγγέλιον τοῦ Χριστοῦ
  choice: pour l’Évangile du Messie
  rationale: Le second εἰς exprime le but. « Pour » évite d’ajouter explicitement « annoncer », tandis que « Évangile » garde le terme biblique dans un registre accessible et digne. Χριστός conserve ici sa valeur de titre.
- source_word: θύρας
  choice: une porte
  rationale: La métaphore grecque est conservée plutôt que remplacée par son interprétation, « une occasion ».
- source_word: ἀνεῳγμένης
  choice: m’avait été ouverte
  rationale: Le plus-que-parfait passif rend l’action antérieure et l’état qui en résulte, exprimés par le participe parfait passif.
- source_word: ἐν κυρίῳ
  choice: dans le Seigneur
  rationale: Cette formulation préserve l’expression paulinienne et son ambiguïté, sans imposer le sens instrumental « par le Seigneur ».
theological_decisions:
- issue: Valeur de Χριστοῦ
  choice: du Messie
  alternative: du Christ
  rationale: Dans cette expression, Χριστός peut encore être entendu comme le titre de l’Oint; « Messie » rend cette valeur sans transformer le génitif en une relation plus précise comme « au sujet du Messie ».
- issue: Rapport exprimé par ἐν κυρίῳ
  choice: dans le Seigneur
  alternative: par le Seigneur
  rationale: Le grec permet de comprendre que l’occasion existe dans la sphère du Seigneur, tout en pouvant suggérer son action. Le calque français naturel conserve cette tension.
translation_notes:
  register: Français international moderne, courant et digne. La phrase demeure suspendue par une virgule, comme le texte grec, puisque sa construction se poursuit au verset 13. Le pronom adverbial « y » rattache naturellement la porte ouverte à Troas sans modifier le sens.
