  text: ὥστε τοὐναντίον ⸀μᾶλλον ὑμᾶς χαρίσασθαι καὶ παρακαλέσαι, μή πως τῇ περισσοτέρᾳ λύπῃ καταποθῇ ὁ τοιοῦτος.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/007.yaml
  text: so that[a], on the contrary, you should rather forgive and comfort him[b], so that such a person may not be overwhelmed by excessive sorrow.
translation:
  language: fr
  text: Ainsi donc, au contraire, vous devriez plutôt lui pardonner[a] et le réconforter, de peur qu’une telle personne ne soit engloutie[b] par une tristesse excessive.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « lui faire grâce » ; le verbe grec est apparenté à l’idée de grâce ou de faveur accordée.
    reason: lexical_alternative
  - marker: b
    text: L’image grecque est celle d’une personne « avalée » ou « engloutie » par la tristesse.
    reason: lexical_metaphor
lexical_decisions:
- source_word: τοὐναντίον
  choice: au contraire
  rationale: Marque clairement le renversement de l’attitude à adopter après la sanction.
- source_word: μᾶλλον
  choice: plutôt
  rationale: Conserve la valeur comparative du terme sans ajouter une intensité absente du contexte.
- source_word: χαρίσασθαι
  choice: lui pardonner
  rationale: Dans ce contexte de discipline suivie d’une restauration, le verbe désigne naturellement l’octroi du pardon, tout en gardant une nuance de grâce signalée en note.
- source_word: παρακαλέσαι
  choice: le réconforter
  rationale: La tristesse mentionnée dans la suite favorise ici le sens de consolation plutôt que celui, également possible, d’encouragement.
- source_word: καταποθῇ
  choice: ne soit engloutie
  rationale: Préserve l’image forte du texte grec tout en restant intelligible en français moderne.
- source_word: ὁ τοιοῦτος
  choice: une telle personne
  rationale: Rend l’expression grecque sans identifier davantage l’individu ni employer une tournure vieillie.
- source_word: περισσοτέρᾳ λύπῃ
  choice: une tristesse trop grande
  rationale: Exprime naturellement en français l’idée contextuelle d’une tristesse qui devient démesurée et risque de submerger la personne.
theological_decisions:
- issue: Portée de χαρίσασθαι dans le rétablissement de la personne sanctionnée
  choice: pardonner
  alternative: faire grâce
  rationale: « Pardonner » convient directement au contexte, tandis que la note maintient la nuance de faveur gracieusement accordée sans imposer une lecture doctrinale particulière.
- issue: Valeur de περισσοτέρᾳ devant λύπῃ
  choice: une tristesse trop grande
  alternative: une tristesse plus grande
  rationale: Le comparatif peut être compris comme indiquant une tristesse excédant la mesure supportable; la formulation retenue suit le mouvement de la phrase sans préciser artificiellement un terme explicite de comparaison.
translation_notes:
  register: Français international moderne, naturel et digne. La structure contrastive « au contraire… plutôt » reflète les deux marqueurs grecs sans lourdeur excessive. Le subjonctif après « de peur que » restitue naturellement le risque exprimé par μή πως.
