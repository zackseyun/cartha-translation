  text: ᾧ δέ τι χαρίζεσθε, κἀγώ· καὶ γὰρ ἐγὼ ⸂ὃ κεχάρισμαι, εἴ τι⸃ κεχάρισμαι, δι’ ὑμᾶς ἐν προσώπῳ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/010.yaml
  text: To anyone whom you forgive anything[a], I do too. For what I have forgiven—if I have forgiven anything—I have forgiven for your sake in the presence of Messiah,
translation:
  language: fr
  text: Celui à qui vous pardonnez quelque chose, moi aussi, je lui pardonne. En effet, ce que j’ai pardonné — si tant est que j’aie pardonné quelque chose — je l’ai pardonné pour vous, en présence du Messie[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « dans la personne du Messie » ou « devant le Messie ».'
    reason: Le groupe ἐν προσώπῳ Χριστοῦ peut désigner la présence ou le regard du Messie, mais aussi la sphère de sa personne ou une action accomplie en son nom.
lexical_decisions:
- source_word: ᾧ δέ τι χαρίζεσθε
  choice: Celui à qui vous pardonnez quelque chose
  rationale: Le pronom relatif au datif désigne le bénéficiaire du pardon, tandis que τι garde une portée indéfinie. Cette formulation restitue clairement la construction grecque en français courant.
- source_word: κἀγώ
  choice: moi aussi, je lui pardonne
  rationale: La forme contractée signifie « moi aussi ». La reprise explicite du verbe et du pronom indirect est nécessaire à la clarté idiomatique en français.
- source_word: χαρίζεσθε / κεχάρισμαι
  choice: pardonnez / j’ai pardonné
  rationale: Dans ce contexte de discipline suivie d’un rétablissement, χαρίζομαι désigne la remise d’une offense plutôt qu’un don gracieux au sens général.
- source_word: ὃ κεχάρισμαι, εἴ τι κεχάρισμαι
  choice: ce que j’ai pardonné — si tant est que j’aie pardonné quelque chose —
  rationale: Cette formulation conserve la répétition, l’incise conditionnelle et la réserve rhétorique de Paul sans les aplanir.
- source_word: δι’ ὑμᾶς
  choice: pour vous
  rationale: διά avec l’accusatif exprime ici l’intérêt ou le bénéfice des Corinthiens. « Pour vous » est naturel et laisse ouvertes les nuances de « dans votre intérêt » et « à cause de vous ».
- source_word: ἐν προσώπῳ Χριστοῦ
  choice: en présence du Messie
  rationale: πρόσωπον peut évoquer le visage, la présence ou la personne. « En présence du Messie » exprime naturellement une action accomplie sous son regard, sans effacer l’autre interprétation possible signalée en note.
- source_word: Χριστοῦ
  choice: du Messie
  rationale: Χριστός conserve ici sa valeur de titre. « Messie » la rend explicitement plutôt que d’employer la forme traditionnelle plus proche d’un nom propre.
theological_decisions:
- issue: Sens de ἐν προσώπῳ Χριστοῦ
  choice: en présence du Messie
  alternative: dans la personne du Messie
  rationale: Le sens de présence ou de face convient bien à l’idée d’agir sous le regard du Messie, mais le grec peut aussi suggérer que Paul agit en sa personne ou comme son représentant; l’alternative est donc conservée en note.
- issue: Valeur de Χριστοῦ
  choice: du Messie
  alternative: du Christ
  rationale: Le terme grec est rendu comme un titre messianique, conformément à sa valeur lexicale, sans ajouter de précision doctrinale.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « pardonné » et l’incise conditionnelle sont maintenues afin de respecter la réserve rhétorique du grec. La virgule finale est conservée puisque la phrase se poursuit au verset suivant.
