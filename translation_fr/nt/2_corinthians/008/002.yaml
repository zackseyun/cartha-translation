  yaml_path: translation/nt/2_corinthians/008/002.yaml
  text: that in a severe test of affliction[b][a], the abundance of their joy and their deep poverty overflowed into the wealth of their generosity.
translation:
  language: fr
  text: Car, dans une grande épreuve de détresse, l’abondance de leur joie et leur profonde pauvreté[a] ont fait jaillir une riche générosité[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leur pauvreté jusque dans ses profondeurs » ou « leur extrême pauvreté ».
    reason: lexical_alternative
  - marker: b
    text: Ou « une richesse de leur générosité ». Le mot grec peut aussi signifier « simplicité », « sincérité » ou « disposition sans partage » ; ici, il désigne probablement une générosité qui se manifeste par le don.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν πολλῇ δοκιμῇ θλίψεως
  choice: au milieu d’une grande épreuve de détresse
  rationale: « Épreuve » exprime la mise à l’épreuve indiquée par δοκιμή, tandis que le complément « de détresse » conserve le rapport avec θλίψεως sans préciser excessivement sa nature.
- source_word: ἡ περισσεία τῆς χαρᾶς αὐτῶν
  choice: l’abondance de leur joie
  rationale: Cette formulation maintient la structure nominale de περισσεία et prépare la reprise de l’idée d’abondance dans le verbe ἐπερίσσευσεν.
- source_word: ἡ κατὰ βάθους πτωχεία αὐτῶν
  choice: leur profonde pauvreté
  rationale: L’expression κατὰ βάθους intensifie la pauvreté tout en évoquant sa profondeur ; « profonde pauvreté » restitue naturellement les deux aspects.
- source_word: ἐπερίσσευσεν
  choice: ont débordé
  rationale: Le verbe décrit une abondance qui se répand et aboutit au résultat introduit par εἰς. Le pluriel est requis en français par les deux sujets coordonnés.
- source_word: εἰς τὸ πλοῦτος
  choice: en une riche
  rationale: La préposition εἰς marque ici l’aboutissement. L’adjectif « riche » restitue idiomatiquement l’image de πλοῦτος dans l’expression française « une riche générosité ».
- source_word: τῆς ἁπλότητος αὐτῶν
  choice: générosité
  rationale: Dans ce contexte de collecte et de don matériel, ἁπλότης désigne vraisemblablement une disposition sans calcul qui se manifeste par la libéralité ; « générosité » communique clairement ce sens en français courant.
theological_decisions:
- issue: Sens de ἁπλότης dans le contexte des dons matériels
  choice: générosité
  alternative: simplicité, sincérité ou disposition sans partage
  rationale: Le contexte immédiat porte sur l’aide matérielle destinée aux croyants. « Générosité » rend donc le sens contextuel le plus probable, tandis qu’une note préserve les autres valeurs possibles du terme sans imposer une interprétation doctrinale.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve le contraste saisissant entre la joie abondante et la pauvreté profonde, ainsi que l’image du débordement, tout en rendant idiomatiquement l’expression finale.
