source:
  edition: SBLGNT
  text: τὴν οὖν ἔνδειξιν τῆς ἀγάπης ὑμῶν καὶ ἡμῶν καυχήσεως ὑπὲρ ὑμῶν εἰς αὐτοὺς ⸀ἐνδεικνύμενοι εἰς πρόσωπον τῶν ἐκκλησιῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/024.yaml
  text: Therefore[b][a], show them before the churches the proof of your love and of our boasting about you.
translation:
  language: fr
  text: Montrez-leur donc, devant les Églises[b], la preuve[a] de votre amour et de notre fierté à votre sujet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la manifestation » ou « le signe évident ».
    reason: lexical_alternative
  - marker: b
    text: L’expression peut désigner une démonstration publique en présence des représentants des Églises.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔνδειξιν
  choice: la preuve
  rationale: ἔνδειξις désigne ce qui manifeste concrètement ou rend évident quelque chose. « La preuve » est idiomatique ici et souligne que l’amour doit se traduire en actes.
- source_word: ἀγάπης
  choice: amour
  rationale: Rend directement ἀγάπη dans son sens relationnel et pratique dans ce contexte.
- source_word: καυχήσεως
  choice: la fierté que nous avons exprimée
  rationale: καύχησις évoque le fait de se glorifier ou de tirer fierté de quelqu’un. Cette formulation française conserve la force rhétorique sans suggérer nécessairement une vanité coupable.
- source_word: ὑπὲρ ὑμῶν
  choice: à votre sujet
  rationale: Avec καύχησις, ὑπέρ indique ici que les Corinthiens sont l’objet de la fierté exprimée par Paul.
- source_word: εἰς αὐτοὺς
  choice: leur
  rationale: Le pronom renvoie aux frères, représentants des Églises, mentionnés dans le contexte immédiat.
- source_word: ἐνδεικνύμενοι
  choice: Montrez
  rationale: Le participe a ici une valeur exhortative ou impérative. « Montrez » restitue clairement l’appel à rendre quelque chose manifeste.
- source_word: εἰς πρόσωπον τῶν ἐκκλησιῶν
  choice: devant les Églises
  rationale: L’expression indique une manifestation publique en présence des représentants des communautés.
- source_word: οὖν
  choice: donc
  rationale: Marque la conséquence pratique de ce qui précède, dans un français actuel et naturel.
theological_decisions:
- issue: Rapport entre la « preuve » et la fierté exprimée par Paul
  choice: « du bien-fondé de la fierté que nous avons exprimée »
  alternative: « de notre fierté à votre sujet »
  rationale: Le grec coordonne l’amour des Corinthiens et la καύχησις de Paul sous ἔνδειξις. En français, « preuve de notre fierté » serait ambigu ou peu naturel; « bien-fondé » explicite que leur conduite doit confirmer que la fierté exprimée par Paul était justifiée, sans introduire de distinction doctrinale.
translation_notes:
  register: Français moderne, international et digne. L’ordre des groupes suit un usage français naturel tout en conservant l’exhortation publique, l’amour concret des Corinthiens et la fierté exprimée par Paul à leur sujet.
