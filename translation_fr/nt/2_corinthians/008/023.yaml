source:
  edition: SBLGNT
  text: εἴτε ὑπὲρ Τίτου, κοινωνὸς ἐμὸς καὶ εἰς ὑμᾶς συνεργός· εἴτε ἀδελφοὶ ἡμῶν, ἀπόστολοι ἐκκλησιῶν, δόξα Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/023.yaml
  text: As for Titus[a], he is my partner and fellow worker for you; as for our brothers, they are messengers of the churches[b], the glory of Messiah.
translation:
  language: fr
  text: Quant à Tite, il est mon associé et mon collaborateur auprès de vous ; quant à nos frères, ils sont les envoyés des Églises[a], la gloire du Messie[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les apôtres des Églises ». Le mot grec peut désigner soit des envoyés ou délégués mandatés, soit des apôtres au sens plus large ; ici, le contexte favorise des représentants des Églises.
    reason: alternative_reading
  - marker: b
    text: Ou « la gloire du Christ ». « Messie » traduit ici le titre grec Χριστός.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴτε ὑπὲρ Τίτου
  choice: Quant à Tite
  rationale: La tournure grecque, elliptique, introduit deux cas parallèles. « Quant à » en restitue naturellement la fonction discursive en français.
- source_word: κοινωνὸς ἐμὸς
  choice: mon associé
  rationale: κοινωνός désigne quelqu’un qui partage une activité ou une responsabilité. « Associé » conserve ici l’idée de participation étroite sans ajouter une relation absente du texte.
- source_word: εἰς ὑμᾶς συνεργός
  choice: mon collaborateur auprès de vous
  rationale: συνεργός exprime la collaboration, tandis que εἰς ὑμᾶς indique que cette activité s’exerce en direction des Corinthiens. « Auprès de vous » reste proche du grec sans expliciter indûment « pour votre bien ».
- source_word: ἀδελφοὶ ἡμῶν
  choice: nos frères
  rationale: Le masculin pluriel renvoie ici aux hommes chargés d’accompagner la collecte ; « nos frères » est donc précis dans le contexte.
- source_word: ἀπόστολοι ἐκκλησιῶν
  choice: les envoyés des Églises
  rationale: ἀπόστολοι peut désigner des apôtres ou, plus largement, des personnes mandatées. Le contexte de représentants choisis par les assemblées favorise « envoyés », tout en signalant l’autre possibilité en note.
- source_word: δόξα Χριστοῦ
  choice: la gloire du Messie
  rationale: La proposition nominale présente les frères comme « la gloire » du Messie, sans ajouter de verbe explicatif. Χριστός est rendu comme le titre « Messie ».
theological_decisions:
- issue: Portée de ἀπόστολοι appliqué aux frères non nommés
  choice: envoyés des Églises
  alternative: apôtres des Églises
  rationale: Le génitif « des Églises » et le contexte de la collecte suggèrent des délégués mandatés par les assemblées. La note conserve néanmoins l’ambiguïté lexicale sans trancher une question de statut ecclésial au-delà du texte.
- issue: Traduction de Χριστοῦ
  choice: du Messie
  alternative: du Christ
  rationale: Χριστός conserve ici sa valeur de titre. « Messie » en traduit le sens, tandis que la forme traditionnelle « Christ » est indiquée en note.
- issue: Valeur de δόξα Χριστοῦ
  choice: la gloire du Messie
  alternative: un honneur pour le Messie
  rationale: La traduction principale garde la construction appositionnelle concise et sa tension théologique, sans la réduire à l’idée qu’ils feraient simplement honneur au Messie.
translation_notes:
  register: Français international moderne, sobre et digne. Le parallélisme « Quant à… quant à… » reproduit la structure du grec ; la phrase nominale finale est maintenue afin de préserver sa force et son ambiguïté.
