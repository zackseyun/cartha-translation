source:
  edition: SBLGNT
  text: εἰ γὰρ ἡ προθυμία πρόκειται, καθὸ ἐὰν ⸀ἔχῃ εὐπρόσδεκτος, οὐ καθὸ οὐκ ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/012.yaml
  text: For if the readiness is present[a], it is acceptable according to what one has[b], not according to what one does not have.
translation:
  language: fr
  text: Car, si la bonne volonté est présente[a], elle est agréée en fonction de ce que l’on a[b], et non de ce que l’on n’a pas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’empressement » ou « la volonté » au lieu de « la bonne volonté ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « selon ce que l’on a… et non selon ce que l’on n’a pas ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: προθυμία
  choice: bonne volonté
  rationale: Le nom désigne une disposition volontaire et empressée. « Bonne volonté » est naturel en français moderne et convient à la générosité envisagée dans le contexte, sans réduire le sens à une simple préparation matérielle.
- source_word: πρόκειται
  choice: est présente
  rationale: Dans cette construction, le verbe indique que la disposition existe ou est là, plutôt qu’elle serait littéralement placée devant quelqu’un.
- source_word: καθὸ ἐὰν ἔχῃ
  choice: en fonction de ce que l’on a
  rationale: La formule exprime la mesure fondée sur les moyens dont chacun dispose. Le pronom « on » conserve la portée générique du singulier grec.
- source_word: εὐπρόσδεκτος
  choice: est agréée
  rationale: Le terme signifie que la disposition ou l’offrande est favorablement accueillie. « Agréée » garde cette idée sans préciser qui l’agrée, puisque le texte ne le dit pas explicitement.
- source_word: οὐ καθὸ οὐκ ἔχει
  choice: et non de ce que l’on n’a pas
  rationale: Cette formulation conserve le parallélisme et le contraste explicites du grec entre les moyens réels et ceux dont on ne dispose pas.
- source_word: εἰ γὰρ
  choice: Car, si
  rationale: « Car » maintient le lien explicatif avec le contexte, tandis que « si » préserve la forme conditionnelle.
theological_decisions:
- issue: Référent implicite de l’agrément
  choice: La traduction laisse ouverte l’identité de celui qui agrée la bonne volonté ou le don.
  alternative: Préciser « agréée par Dieu » ou « bien accueillie par la communauté ».
  rationale: εὐπρόσδεκτος exprime l’agrément, mais aucun complément ne précise explicitement s’il s’agit de Dieu, de l’Église ou des deux. Ajouter un référent résoudrait une ambiguïté réelle du texte.
- issue: Objet grammatical de l’agrément
  choice: Le féminin « elle » rattache grammaticalement l’agrément à « la bonne volonté », comme dans la phrase grecque.
  alternative: Reformuler en faisant du don ou de la contribution ce qui est agréé.
  rationale: Le grec accorde εὐπρόσδεκτος avec προθυμία. Le contexte concerne certes la contribution, mais la traduction ne remplace pas silencieusement le sujet grammatical explicite.
translation_notes:
  register: Français international moderne, courant et digne. La phrase conserve le raisonnement explicatif et conditionnel de Paul, son parallélisme, ainsi que l’ambiguïté concernant celui qui agrée.
