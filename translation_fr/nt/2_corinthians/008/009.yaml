reference: 2 Corinthians 8:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: γινώσκετε γὰρ τὴν χάριν τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, ὅτι δι’ ὑμᾶς ἐπτώχευσεν πλούσιος ὤν, ἵνα ὑμεῖς τῇ ἐκείνου πτωχείᾳ πλουτήσητε.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/009.yaml
  text: For you know the grace of our Lord Jesus Christ[a], that though he was rich, yet for your sake he became poor[b], so that you by his poverty might become rich.
translation:
  language: fr
  text: 'Vous connaissez en effet la grâce de notre Seigneur Jésus-Christ[a] : lui qui était riche s’est fait pauvre pour vous[b], afin que, par sa pauvreté, vous deveniez riches.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Jésus le Messie ». Le grec Χριστός est un titre qui signifie « Messie » ou « Oint ».
    reason: alternative_reading
  - marker: b
    text: Les termes « riche » et « pauvre » sont probablement employés comme des images. Paul oppose la richesse antérieure du Christ à son abaissement en faveur des autres, sans définir ici précisément la nature de cette richesse et de cette pauvreté.
    reason: lexical_alternative
lexical_decisions:
- source_word: γινώσκετε
  choice: vous connaissez
  rationale: Le présent de l’indicatif renvoie à une connaissance déjà acquise par les Corinthiens. « Vous connaissez » est naturel en français et convient mieux à un complément nominal que « vous savez ».
- source_word: χάριν
  choice: la grâce
  rationale: Dans ce contexte, χάρις désigne à la fois la faveur et le don généreux manifestés par le Christ. « Grâce » conserve la profondeur théologique du terme sans effacer sa portée éthique dans l’appel à la générosité.
- source_word: κυρίου
  choice: Seigneur
  rationale: Titre français usuel pour κύριος, il préserve l’idée d’autorité ainsi que la portée christologique de l’expression.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jésus-Christ
  rationale: « Jésus-Christ » est la forme française courante et digne. Une note rappelle que Χριστός est un titre signifiant « Messie », afin qu’il ne soit pas seulement perçu comme un nom propre.
- source_word: δι’ ὑμᾶς
  choice: pour vous
  rationale: Avec l’accusatif, διά exprime ici le bénéfice ou le motif. « Pour vous » rend cette valeur de manière concise et naturelle, sans la nuance potentiellement accusatrice de « à cause de vous ».
- source_word: πλούσιος ὤν
  choice: lui qui était riche
  rationale: Cette tournure restitue le participe circonstanciel et met en relief le contraste avec l’appauvrissement, sans imposer une formulation française archaïque telle que « bien qu’il fût riche ».
- source_word: ἐπτώχευσεν
  choice: il s’est fait pauvre
  rationale: Le verbe actif indique l’entrée dans la pauvreté. « S’est fait pauvre » exprime naturellement l’abaissement volontaire suggéré par le contexte, tout en maintenant le contraste avec « riche ».
- source_word: τῇ ἐκείνου πτωχείᾳ
  choice: par sa pauvreté
  rationale: Le datif exprime ici le moyen. « Par sa pauvreté » est direct et conserve le lien lexical avec le fait qu’il s’est fait pauvre.
- source_word: πλουτήσητε
  choice: vous deveniez riches
  rationale: Le subjonctif après ἵνα exprime le but ou le résultat. « Deveniez riches » maintient le parallélisme délibéré entre l’appauvrissement du Christ et l’enrichissement des destinataires.
theological_decisions:
- issue: Nature de la richesse du Christ et de l’enrichissement des croyants
  choice: Conserver dans le texte l’image économique de la richesse et de la pauvreté sans en préciser le référent.
  alternative: Identifier explicitement la richesse du Christ à sa gloire divine préexistante, ou l’enrichissement des croyants aux seules bénédictions spirituelles du salut.
  rationale: Le grec ne définit pas directement ces richesses. Dans le contexte d’un appel à la générosité, l’image évoque largement le don de soi du Christ et ses effets pour les croyants. La traduction préserve donc l’ambiguïté et la tension théologique du texte.
- issue: Valeur de πλούσιος ὤν
  choice: Rendre le contraste par « lui qui était riche » sans préciser la nature ni le moment de cette richesse.
  alternative: Traduire explicitement « bien qu’il ait été riche » ou rattacher la richesse à la préexistence du Christ.
  rationale: Le participe prend vraisemblablement une valeur concessive dans le contexte, mais sa forme reste moins explicite. La formulation retenue fait ressortir le contraste sans transformer une inférence contextuelle en définition doctrinale.
translation_notes:
  register: Français international moderne, clair et digne. La phrase garde l’antithèse « riche / pauvre / riches » et le mouvement argumentatif du grec. Le deux-points rend naturellement l’explication introduite par ὅτι, tandis que « lui qui » évite un subjonctif imparfait devenu soutenu ou archaïsant.
