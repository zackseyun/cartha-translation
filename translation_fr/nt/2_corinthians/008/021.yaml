  text: ⸂προνοοῦμεν γὰρ⸃ καλὰ οὐ μόνον ἐνώπιον κυρίου ἀλλὰ καὶ ἐνώπιον ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/021.yaml
  text: For we take thought for what is good[a], not only before the Lord but also before people.
translation:
  language: fr
  text: En effet, nous veillons à faire ce qui est bien[a], non seulement devant le Seigneur, mais aussi devant les autres.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ce qui est honorable » ou « ce qui est juste ».
    reason: 'Alternative lexicale : καλὰ peut désigner ce qui est bon, honorable ou juste.'
lexical_decisions:
- source_word: προνοοῦμεν
  choice: nous veillons à faire
  rationale: Le verbe προνοέω exprime ici une attention réfléchie et prévoyante portée à une conduite irréprochable. « Nous veillons à faire » rend naturellement en français cette diligence intentionnelle dans le contexte de la gestion de la collecte.
- source_word: γὰρ
  choice: En effet
  rationale: γάρ introduit la justification de ce qui précède. « En effet » convient au mouvement explicatif de l'argument en français moderne.
- source_word: καλὰ
  choice: ce qui est bien
  rationale: Le neutre pluriel καλὰ désigne ce qui est moralement bon, honorable ou convenable. « Ce qui est bien » conserve la portée générale du grec, tandis que les nuances contextuelles sont signalées en note.
- source_word: οὐ μόνον ... ἀλλὰ καὶ
  choice: non seulement… mais aussi
  rationale: Cette tournure reproduit clairement la structure corrélative et l'équilibre du grec.
- source_word: ἐνώπιον
  choice: devant
  rationale: « Devant » rend de façon concise l'idée d'être sous le regard ou en présence de quelqu'un, et fonctionne naturellement dans les deux membres de la phrase.
- source_word: κυρίου
  choice: le Seigneur
  rationale: Le titre κύριος est rendu par « le Seigneur », formulation française usuelle et digne dans ce contexte.
- source_word: ἀνθρώπων
  choice: les hommes
  rationale: Ici, ἄνθρωποι désigne les êtres humains en général comme observateurs de la conduite de Paul et de ses collaborateurs. « Les hommes » s'oppose naturellement au « Seigneur » dans cette formule, sans limiter le référent aux personnes de sexe masculin.
theological_decisions:
- issue: Nuance éthique de καλὰ dans un contexte de responsabilité financière
  choice: « ce qui est bien » dans le texte principal
  alternative: « ce qui est honorable » ou « ce qui est juste »
  rationale: Le grec peut viser largement le bien moral ou, plus précisément, une conduite honorable et publiquement irréprochable. La formulation principale préserve cette amplitude, et la note conserve les nuances étroitement liées au contexte.
translation_notes:
  register: Français international moderne, clair et digne. La formulation maintient le parallélisme entre le regard du Seigneur et celui des êtres humains, ainsi que l'idée d'une diligence concrète et réfléchie.
