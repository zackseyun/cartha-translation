  text: ὅτι κατὰ δύναμιν, μαρτυρῶ, καὶ ⸀παρὰ δύναμιν, αὐθαίρετοι
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/003.yaml
  text: For[a], I testify, they gave according to their ability, and beyond their ability, of their own accord[b],
translation:
  language: fr
  text: Car, je l’atteste, ils ont donné dans la mesure de leurs moyens[a], et même au-delà de leurs moyens, de leur plein gré[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « selon leurs capacités » ou « selon leurs possibilités ».
    reason: lexical_alternative
  - marker: b
    text: Ou « volontairement » ou « de leur propre initiative ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Car
  rationale: La conjonction introduit ici l’explication qui appuie l’affirmation du verset précédent ; « Car » restitue naturellement cette fonction discursive.
- source_word: κατὰ δύναμιν
  choice: dans la mesure de leurs moyens
  rationale: κατά exprime ici la mesure ou la norme, et δύναμις la capacité effective. Dans le contexte d’une collecte, « moyens » évoque naturellement les ressources disponibles sans limiter le terme à la seule richesse.
- source_word: μαρτυρῶ
  choice: je l’atteste
  rationale: Le présent a une valeur personnelle et emphatique. « Je l’atteste » rend le témoignage direct de Paul dans un français actuel et digne.
- source_word: καὶ παρὰ δύναμιν
  choice: et même au-delà de leurs moyens
  rationale: παρά avec l’accusatif marque le dépassement d’une limite. « Même » fait ressortir le contraste rhétorique entre la mesure de leurs moyens et ce qui la dépasse.
- source_word: αὐθαίρετοι
  choice: de leur plein gré
  rationale: L’adjectif indique qu’ils ont agi volontairement, sans y être contraints, et de leur propre initiative. Cette locution française conserve la force prédicative du terme tout en s’intégrant à l’ellipse grecque.
theological_decisions:
- issue: Verbe sous-entendu avec αὐθαίρετοι
  choice: Expliciter « ils ont donné » à partir du contexte.
  alternative: 'Conserver une formulation plus elliptique : « étant volontaires » ou « spontanément ».'
  rationale: Le grec ne répète pas le verbe de l’action, mais les versets environnants montrent clairement qu’il s’agit du don des Macédoniens. L’explicitation produit une phrase française complète sans ajouter de contenu théologique.
- issue: Portée de δύναμις dans le contexte du don
  choice: Traduire par « moyens » tout en signalant « capacités » en note.
  alternative: Employer directement « capacités » ou « possibilités ».
  rationale: « Moyens » convient au contexte matériel de la collecte, mais le grec reste assez large pour désigner leur capacité effective ; la note préserve cette latitude lexicale.
translation_notes:
  register: Français international moderne, fluide et digne. La répétition de « leurs moyens » conserve le parallélisme antithétique du grec. Les virgules encadrent l’attestation personnelle de Paul, tandis que les notes maintiennent l’étendue sémantique de δύναμις et d’αὐθαίρετοι.
