revisions:
- from: Mais puisque vous excellez en tout — en foi, en parole, en connaissance, en empressement de toute sorte et dans l’amour qui vient de nous et qui est en vous[a] —, excellez aussi dans cette grâce[b].
  to: Mais, de même que vous excellez en tout — en foi, en parole, en connaissance, en un zèle sans réserve et dans l’amour qui vient de nous et qui est en vous[a] —, excellez aussi dans cette grâce[b].
  rationale: La révision remplace la conjonction causale par la comparaison exigée par ἀλλ’ ὥσπερ et affine le rendu de πάσῃ σπουδῇ. Elle maintient « exceller » aux deux occurrences, la formulation volontairement proche du grec pour l’amour, ainsi que les deux ancres de notes et leur contenu.
