  variant: modern international French
source:
  edition: SBLGNT
  text: ἀλλ’ ὥσπερ ἐν παντὶ περισσεύετε, πίστει καὶ λόγῳ καὶ γνώσει καὶ πάσῃ σπουδῇ καὶ τῇ ἐξ ⸂ἡμῶν ἐν ὑμῖν⸃ ἀγάπῃ, ἵνα καὶ ἐν ταύτῃ τῇ χάριτι περισσεύητε.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/007.yaml
  text: But just as you abound in everything—in faith and speech and knowledge and all diligence and in our love in you—see that you also abound in this grace[a][b].
translation:
  language: fr
  text: Mais, de même que vous excellez en tout — en foi, en parole, en connaissance, en un zèle sans réserve et dans l’amour qui vient de nous et qui est en vous[a] —, excellez aussi dans cette grâce[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou peut-être : « votre amour pour nous ». L’expression grecque est difficile, et certains manuscrits portent une leçon qui peut se traduire : « votre amour en nous ».'
    reason: alternative_reading
  - marker: b
    text: C’est-à-dire cette œuvre de grâce qu’est le don généreux.
    reason: lexical_alternative
lexical_decisions:
- source_word: περισσεύετε / περισσεύητε
  choice: excellez
  rationale: Dans cette énumération de qualités, « exceller » est naturel en français et peut s’employer aux deux occurrences, tout en exprimant l’idée d’abondance portée par le verbe grec.
- source_word: ἐν παντί
  choice: en tout
  rationale: Formulation concise qui conserve la portée générale de l’expression et introduit naturellement l’énumération.
- source_word: πίστει
  choice: foi
  rationale: Sens usuel de πίστις, bien adapté à la liste des qualités reconnues chez les Corinthiens.
- source_word: λόγῳ
  choice: parole
  rationale: Dans ce contexte, le terme désigne vraisemblablement la capacité de s’exprimer; « parole » reste suffisamment large sans imposer un don particulier.
- source_word: γνώσει
  choice: connaissance
  rationale: Équivalent français direct et naturel dans cette liste.
- source_word: πάσῃ σπουδῇ
  choice: empressement de toute sorte
  rationale: Cette expression rend l’ardeur, le zèle et le sérieux actif de σπουδή, tout en conservant la valeur extensive de πάσῃ.
- source_word: τῇ ἐξ ἡμῶν ἐν ὑμῖν ἀγάπῃ
  choice: l’amour qui vient de nous et qui est en vous
  rationale: Cette formulation conserve explicitement les deux rapports prépositionnels du texte retenu, malgré leur difficulté, sans les réduire silencieusement à une interprétation unique.
- source_word: χάριτι
  choice: grâce
  rationale: « Grâce » maintient la richesse théologique du mot, tandis qu’une note précise qu’il désigne ici l’œuvre généreuse de la collecte.
theological_decisions:
- issue: Sens de χάρις dans le contexte de la collecte pour les croyants de Jérusalem
  choice: grâce
  alternative: œuvre généreuse; don; acte de grâce
  rationale: Paul présente la générosité non comme une simple opération financière, mais comme une manifestation de la grâce. Le terme théologique est donc conservé et son référent concret est expliqué en note.
- issue: Interprétation de τῇ ἐξ ἡμῶν ἐν ὑμῖν ἀγάπῃ
  choice: l’amour qui vient de nous et qui est en vous
  alternative: votre amour pour nous
  rationale: La leçon retenue est syntaxiquement difficile et la tradition manuscrite comporte une variante. La traduction principale respecte les éléments du texte SBLGNT; la note présente l’autre interprétation sans trancher abusivement.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase garde le parallélisme des deux emplois de περισσεύω. « Exceller » est plus idiomatique que « abonder » avec la foi, la parole et la connaissance. La formulation difficile concernant l’amour demeure volontairement proche du grec et est éclairée par une note.
