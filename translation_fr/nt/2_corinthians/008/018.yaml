  text: συνεπέμψαμεν δὲ μετ’ αὐτοῦ τὸν ἀδελφὸν οὗ ὁ ἔπαινος ἐν τῷ εὐαγγελίῳ διὰ πασῶν τῶν ἐκκλησιῶν—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/018.yaml
  text: And we sent with him the brother whose praise in the gospel is throughout all the churches—[a]
translation:
  language: fr
  text: Nous avons envoyé avec lui le frère dont toutes les Églises font l’éloge en lien avec l’Évangile —
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνεπέμψαμεν
  choice: nous avons envoyé avec
  rationale: L’aoriste présente l’envoi comme un fait accompli, et le préverbe σύν exprime l’accompagnement. Le passé composé est naturel en français dans ce contexte épistolaire.
- source_word: δὲ
  choice: omis comme connecteur explicite
  rationale: δέ est ici une articulation légère du récit. En français, la continuité est naturellement portée par la phrase elle-même; ajouter « et » alourdirait légèrement l’enchaînement.
- source_word: μετ’ αὐτοῦ
  choice: avec lui
  rationale: μετά avec le génitif marque directement l’accompagnement.
- source_word: τὸν ἀδελφόν
  choice: le frère
  rationale: L’expression désigne un chrétien précis, connu dans le contexte. « Le frère » conserve l’article et le masculin singulier sans ajouter « notre ».
- source_word: οὗ ὁ ἔπαινος
  choice: dont on fait l’éloge
  rationale: Cette tournure française naturelle conserve l’idée d’ἔπαινος sans suggérer que l’éloge lui appartient; elle rend la construction relative nominale par une formulation idiomatique.
- source_word: ἐν τῷ εὐαγγελίῳ
  choice: à cause de l’Évangile
  rationale: Le lien exact entre l’éloge et l’Évangile reste assez ouvert. « À cause de l’Évangile » exprime que sa réputation favorable est liée à celui-ci sans préciser indûment une fonction de prédication ou un ministère particulier.
- source_word: διὰ πασῶν τῶν ἐκκλησιῶν
  choice: dans toutes les Églises
  rationale: διά avec le génitif indique ici une diffusion à travers l’ensemble des communautés. La formulation française exprime une reconnaissance largement répandue.
- source_word: ἐκκλησιῶν
  choice: Églises
  rationale: Dans ce contexte paulinien, le mot désigne les communautés chrétiennes locales; « Églises » est le terme français courant et clair.
theological_decisions:
- issue: Identité et statut de ἀδελφός
  choice: « le frère », désignant un collaborateur chrétien masculin précis
  alternative: « le croyant » ou « notre frère »
  rationale: Le masculin singulier avec article, dans ce contexte de déplacement, renvoie à un homme déterminé. La traduction garde cette précision sans ajouter le possessif absent du grec.
- issue: Nuance de ἐν τῷ εὐαγγελίῳ
  choice: « à cause de l’Évangile », sans préciser une fonction ministérielle
  alternative: « pour son travail au service de l’Évangile »; « dans la prédication de l’Évangile »; « en ce qui concerne l’Évangile »
  rationale: Le grec relie l’éloge du frère à l’Évangile sans nommer explicitement la prédication, une charge ou un travail particulier. La formulation retenue préserve cette amplitude; la note signale une autre analyse possible de la relation.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé composé convient à la narration épistolaire. La majuscule à « Évangile » et à « Églises » suit un usage biblique français courant. Le tiret final est conservé puisqu’il indique que la phrase se poursuit au verset suivant.
