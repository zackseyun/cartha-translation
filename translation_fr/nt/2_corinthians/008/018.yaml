revisions:
- from: Nous avons envoyé avec lui le frère dont on fait l’éloge, à cause de l’Évangile, dans toutes les Églises[a] —
  to: Nous avons envoyé avec lui le frère dont toutes les Églises font l’éloge en lien avec l’Évangile —
