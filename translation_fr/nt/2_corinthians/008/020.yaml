id: 2CO.8.20
reference: 2 Corinthians 8:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: στελλόμενοι τοῦτο μή τις ἡμᾶς μωμήσηται ἐν τῇ ἁδρότητι ταύτῃ τῇ διακονουμένῃ ὑφ’ ἡμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/020.yaml
  text: taking this precaution, so that no one may blame us in regard to this generous gift being administered by us,
translation:
  language: fr
  text: Nous prenons cette précaution afin que personne ne nous fasse de reproche au sujet de ce don généreux[a] dont nous assurons la gestion.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de cette abondante contribution » ou « de cette largesse ». Le terme grec peut évoquer l’abondance aussi bien que la générosité du don.
    reason: lexical_alternative
lexical_decisions:
- source_word: στελλόμενοι τοῦτο
  choice: Nous prenons cette précaution
  rationale: Le participe moyen exprime ici une mesure préventive destinée à éviter un motif de critique. La tournure française rend naturellement cette nuance tout en gardant le lien avec le contexte précédent.
- source_word: μή τις ἡμᾶς μωμήσηται
  choice: afin que personne ne puisse nous faire de reproche
  rationale: La construction μή avec le subjonctif exprime le résultat que Paul cherche à prévenir. « Faire un reproche » conserve le sens de blâmer ou de trouver à redire, sans l'affaiblir en simple désaccord.
- source_word: ἐν τῇ ἁδρότητι ταύτῃ
  choice: au sujet de ce don généreux
  rationale: Dans le contexte de la collecte, ἁδρότης désigne l'abondance ou la générosité concrétisée par une importante contribution. « Don généreux » est clair et idiomatique, tandis qu'une note conserve l'autre nuance possible.
- source_word: τῇ διακονουμένῃ ὑφ’ ἡμῶν
  choice: dont nous assurons la gestion
  rationale: Le participe passif de διακονέω renvoie ici au service consistant à administrer la collecte. La formulation active française est naturelle et préserve la responsabilité pratique du groupe.
theological_decisions:
- issue: Nature de la préoccupation de Paul dans la gestion de la collecte
  choice: Mettre en évidence la précaution prise pour éviter tout reproche dans l'administration du don.
  alternative: Présenter le propos comme une simple disposition pratique, sans accent explicite sur la responsabilité.
  rationale: Le texte grec relie directement la mesure préventive au risque que Paul et ses compagnons soient blâmés au sujet de la contribution. La traduction maintient cet enjeu de responsabilité sans lui ajouter une portée doctrinale étrangère au verset.
translation_notes:
  register: Français international moderne, digne et accessible. « Assurer la gestion » évite à la fois le calque ecclésiastique « servir » et une formulation bureaucratique trop lourde. Le marqueur [a] figure immédiatement après l’expression concernée.
