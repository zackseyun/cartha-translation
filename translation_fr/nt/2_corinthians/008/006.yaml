  text: εἰς τὸ παρακαλέσαι ἡμᾶς Τίτον ἵνα καθὼς προενήρξατο οὕτως καὶ ἐπιτελέσῃ εἰς ὑμᾶς καὶ τὴν χάριν ταύτην·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/006.yaml
  text: So we urged Titus that[a], just as he had previously begun, he should also complete among you this act of grace.
translation:
  language: fr
  text: C’est ainsi que nous avons encouragé Tite afin que, comme il avait commencé auparavant, il mène aussi à son terme parmi vous cette œuvre de grâce[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « cette action généreuse » ; plus littéralement, « cette grâce ».
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακαλέσαι
  choice: vivement encouragé
  rationale: Dans ce contexte, παρακαλέω désigne une invitation pressante à agir. « Vivement encouragé » rend cette force en français naturel sans la nuance autoritaire que pourrait suggérer « exhorté ».
- source_word: Τίτον
  choice: Tite
  rationale: Forme française traditionnelle et courante du nom propre grec Τίτος.
- source_word: καθὼς προενήρξατο
  choice: comme il l’avait commencée auparavant
  rationale: Le plus-que-parfait situe le commencement avant la demande adressée à Tite, tandis que « auparavant » conserve explicitement la nuance temporelle du préverbe προ-.
- source_word: ἐπιτελέσῃ
  choice: mener à son terme
  rationale: Cette expression naturelle indique l’achèvement effectif d’une entreprise déjà commencée et rend la force de ἐπιτελέω.
- source_word: εἰς ὑμᾶς
  choice: parmi vous
  rationale: L’expression désigne ici l’action de Tite menée au sein de la communauté corinthienne; « parmi vous » conserve cette orientation communautaire.
- source_word: καὶ τὴν χάριν ταύτην
  choice: cette œuvre de grâce
  rationale: Dans le contexte de la collecte, χάρις désigne une action concrète inspirée par la grâce. « Œuvre de grâce » conserve le vocabulaire théologique sans réduire le terme au seul sens de « don »; le français exprime naturellement la valeur adjonctive de καί par l’idée d’achever cette œuvre déjà commencée.
theological_decisions:
- issue: Sens de χάρις dans le contexte de la collecte
  choice: « œuvre de grâce », désignant la démarche concrète de générosité
  alternative: « grâce » au sens abstrait, ou « don » au sens de contribution matérielle
  rationale: Le contexte de 2 Corinthiens 8 concerne la collecte et l’intervention de Tite, mais Paul la présente théologiquement comme une manifestation de la grâce. La formulation retenue garde ensemble l’action concrète et sa qualité gracieuse.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase est réorganisée pour éviter une construction finale lourde et pour rattacher clairement « comme il l’avait commencée auparavant » à l’œuvre entreprise par Tite. Le féminin de « commencée » renvoie sans ambiguïté à « œuvre ».
