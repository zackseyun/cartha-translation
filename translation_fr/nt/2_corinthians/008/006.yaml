revisions:
- from: C’est pourquoi nous avons vivement encouragé Tite à mener à son terme parmi vous cette œuvre de grâce[a], comme il l’avait commencée auparavant.
  to: C’est ainsi que nous avons encouragé Tite afin que, comme il avait commencé auparavant, il mène aussi à son terme parmi vous cette œuvre de grâce[a].
  rationale: La révision supprime l’intensif non marqué « vivement », rend explicitement la finalité de ἵνα et ajoute « aussi » pour le second καί. Elle conserve le plus-que-parfait et « auparavant » pour προενήρξατο, ainsi que « parmi vous » et « œuvre de grâce » pour les choix contextuellement justifiés.
