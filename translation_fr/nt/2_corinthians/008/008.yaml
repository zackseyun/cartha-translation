id: 2CO.8.8
reference: 2 Corinthians 8:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Οὐ κατ’ ἐπιταγὴν λέγω ἀλλὰ διὰ τῆς ἑτέρων σπουδῆς καὶ τὸ τῆς ὑμετέρας ἀγάπης γνήσιον δοκιμάζων·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/008.yaml
  text: I am not saying this as a command[b][a], but through the earnestness of others I am also testing the genuineness of your love.
translation:
  language: fr
  text: Je ne dis pas cela comme un ordre, mais, par l’empressement des autres, je mets aussi à l’épreuve l’authenticité de votre amour.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « je vérifie aussi la sincérité de votre amour ». Le verbe grec peut désigner le fait de mettre à l’épreuve, d’examiner ou de vérifier afin de reconnaître ce qui est authentique.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιταγή
  choice: ordre
  rationale: Dans l’expression οὐ κατ’ ἐπιταγὴν λέγω, « comme un ordre » exprime naturellement en français l’idée que Paul ne parle pas sous la forme d’une injonction faisant autorité.
- source_word: διὰ τῆς ἑτέρων σπουδῆς
  choice: par l’empressement des autres
  rationale: διά avec le génitif indique ici vraisemblablement le moyen ou l’occasion. « Empressement » rend la disposition zélée et active exprimée par σπουδή, sans identifier explicitement les « autres ».
- source_word: ἀγάπη
  choice: amour
  rationale: « Amour » est l’équivalent français direct et naturel de ἀγάπη; dans le contexte, cet amour se manifeste par la générosité.
- source_word: γνήσιον
  choice: authenticité
  rationale: L’adjectif substantivé désigne le caractère véritable ou authentique de leur amour. « Authenticité » convient au registre moderne et à la construction française.
- source_word: δοκιμάζων
  choice: je mets aussi à l’épreuve
  rationale: Le participe présent décrit l’action ou la visée concomitante aux paroles de Paul. La formulation verbale est naturelle en français et conserve l’idée d’examiner afin de reconnaître ce qui est authentique.
- source_word: καί
  choice: aussi
  rationale: '« Aussi » conserve la valeur additive de καί: en évoquant l’empressement des autres, Paul éprouve également l’authenticité de l’amour des Corinthiens.'
theological_decisions:
- issue: La position rhétorique de Paul concernant le don
  choice: Paul nie explicitement parler sous la forme d’un ordre et présente ses paroles comme une mise à l’épreuve de l’authenticité de l’amour des Corinthiens.
  alternative: Comprendre que Paul atténue seulement, par procédé rhétorique, un ordre qui garderait toute sa force.
  rationale: La formulation οὐ κατ’ ἐπιταγὴν λέγω doit conserver son sens direct. La traduction maintient ainsi la tension entre l’autorité apostolique de Paul et une générosité volontaire, motivée par l’amour.
translation_notes:
  register: Français international moderne, clair et digne. « Empressement » garde la nuance de zèle actif sans la lourdeur de « diligence ». La phrase suit de près la structure grecque tout en restant idiomatique.
