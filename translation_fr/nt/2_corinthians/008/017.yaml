source:
  edition: SBLGNT
  text: ὅτι τὴν μὲν παράκλησιν ἐδέξατο, σπουδαιότερος δὲ ὑπάρχων αὐθαίρετος ἐξῆλθεν πρὸς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/017.yaml
  text: For he accepted the appeal[a], but being more earnest[d][c][b], he went to you of his own accord.
translation:
  language: fr
  text: Car il a accepté notre demande et, plus empressé encore, il est parti de sa propre initiative pour aller chez vous.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: Car
  rationale: La conjonction introduit ici l’explication de l’action de grâce exprimée au verset précédent; « Car » en conserve naturellement la valeur causale ou explicative.
- source_word: τὴν παράκλησιν ἐδέξατο
  choice: il a accueilli notre appel
  rationale: Dans ce contexte, παράκλησις désigne la demande pressante adressée à Tite plutôt que la consolation; « accueillir un appel » exprime une réception favorable. « Notre » explicite le référent contextuel sans modifier le sens.
- source_word: σπουδαιότερος ὑπάρχων
  choice: dans son grand empressement
  rationale: Le comparatif grec peut exprimer un degré accru ou particulièrement marqué. Cette tournure française naturelle rend le zèle qui anime Tite sans imposer une comparaison explicite dont le second terme n’est pas formulé.
- source_word: αὐθαίρετος
  choice: de sa propre initiative
  rationale: L’adjectif souligne que Tite agit volontairement et de lui-même, non sous la contrainte.
- source_word: ἐξῆλθεν πρὸς ὑμᾶς
  choice: il est parti pour aller chez vous
  rationale: Le verbe indique un départ depuis le lieu où se trouve Paul en direction des Corinthiens. Cette formulation conserve ce point de vue tout en restant idiomatique en français.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La coordination évite une traduction mécanique des participes grecs. Le contraste marqué par μέν…δέ est rendu par la progression entre l’accueil de l’appel et l’initiative personnelle de Tite plutôt que par « mais », qui serait peu naturel ici.
