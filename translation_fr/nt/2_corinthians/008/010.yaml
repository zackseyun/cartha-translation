reference: 2 Corinthians 8:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ γνώμην ἐν τούτῳ δίδωμι· τοῦτο γὰρ ὑμῖν συμφέρει, οἵτινες οὐ μόνον τὸ ποιῆσαι ἀλλὰ καὶ τὸ θέλειν προενήρξασθε ἀπὸ πέρυσι·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/010.yaml
  text: 'And in this matter I give my judgment: for this is beneficial for you[b][a], who began last year not only to do it but also to will it.'
translation:
  language: fr
  text: 'Et sur ce point, je donne mon avis : c’est en effet à votre avantage, à vous qui, dès l’année dernière, avez commencé non seulement à agir, mais aussi à le vouloir.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à être disposés à agir ». Le grec distingue la volonté intérieure de l’action elle-même.
    reason: lexical_alternative
lexical_decisions:
- source_word: γνώμην
  choice: mon avis
  rationale: Le nom désigne ici une appréciation réfléchie ou une recommandation, par contraste avec un ordre explicite dans le contexte. « Mon avis » est naturel en français et ne transforme pas le propos en simple préférence désinvolte.
- source_word: ἐν τούτῳ
  choice: sur ce point
  rationale: Cette expression renvoie à la question précise de la collecte et se rend naturellement ainsi sans ajouter le référent au texte.
- source_word: συμφέρει
  choice: c’est ce qui vous convient
  rationale: Le verbe indique ce qui est avantageux ou profitable pour les destinataires. « Vous convient » exprime ici leur intérêt sans connotation commerciale.
- source_word: τὸ ποιῆσαι
  choice: à agir
  rationale: L’infinitif vise la mise en œuvre concrète du projet. « Agir » préserve le contraste avec la volonté intérieure sans introduire un complément absent.
- source_word: τὸ θέλειν
  choice: à le vouloir
  rationale: Le verbe exprime la volonté ou la disposition intérieure. « Le vouloir » maintient nettement le parallèle entre vouloir et agir.
- source_word: προενήρξασθε
  choice: avez commencé
  rationale: Le composé marque un commencement antérieur; l’expression temporelle « dès l’année dernière » en explicite déjà l’antériorité, ce qui évite une formulation redondante.
- source_word: ἀπὸ πέρυσι
  choice: dès l’année dernière
  rationale: Cette tournure situe le commencement dans l’année précédente et rend perceptible l’idée d’antériorité portée par l’ensemble verbal.
theological_decisions:
- issue: Portée de la parole de Paul par rapport à son autorité apostolique
  choice: Paul donne un avis réfléchi plutôt qu’un ordre explicite.
  alternative: Paul formule ici une directive faisant directement autorité.
  rationale: Le contexte immédiat distingue le conseil ou l’avis du commandement. « Je donne mon avis » conserve à la fois le sérieux de sa recommandation et cette distinction.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve le contraste rhétorique « non seulement… mais aussi… » et l’ordre grec, où l’action est mentionnée avant la volonté.
