id: 2CO.8.5
reference: 2 Corinthians 8:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ οὐ καθὼς ἠλπίσαμεν ἀλλ’ ἑαυτοὺς ἔδωκαν πρῶτον τῷ κυρίῳ καὶ ἡμῖν διὰ θελήματος θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/005.yaml
  text: And not as we expected[a], but they gave themselves first to the Lord and to us through the will of God[b],
translation:
  language: fr
  text: Et non pas comme nous nous y attendions[a] ; au contraire, ils se sont eux-mêmes donnés, d’abord au Seigneur et aussi à nous, par la volonté de Dieu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « comme nous l’espérions ».
    reason: lexical_alternative
  - marker: b
    text: Ou « selon la volonté de Dieu ».
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς ἠλπίσαμεν
  choice: comme nous nous y attendions
  rationale: Dans ce contexte, ἐλπίζω désigne ce que Paul et ses compagnons anticipaient. Cette formulation est naturelle en français et conserve la comparaison sans préciser de quelle manière les Macédoniens ont dépassé cette attente. Le sens habituel « espérer » reste possible et figure en note.
- source_word: ἑαυτοὺς ἔδωκαν
  choice: ils se sont donnés eux-mêmes
  rationale: 'Le pronom réfléchi est maintenu afin de souligner que leur offrande ne se limitait pas à des biens : ils engageaient leur propre personne.'
- source_word: πρῶτον
  choice: d’abord
  rationale: « D’abord » exprime naturellement en français la priorité indiquée par πρῶτον, sans décider si elle est surtout temporelle ou logique.
- source_word: τῷ κυρίῳ
  choice: au Seigneur
  rationale: Cette traduction directe de κύριος conserve le titre employé par Paul et le datif marquant le destinataire de leur don de soi.
- source_word: καὶ ἡμῖν
  choice: et aussi à nous
  rationale: La construction parallèle est conservée. « Aussi » rend explicite la coordination française sans placer Paul et ses compagnons sur le même plan que le Seigneur, dont la priorité est marquée par « d’abord ».
- source_word: διὰ θελήματος θεοῦ
  choice: par la volonté de Dieu
  rationale: Avec le génitif, διά peut évoquer le moyen ou l’action déterminante. « Par » préserve une certaine ouverture entre l’action, l’autorisation et la volonté directrice de Dieu.
theological_decisions:
- issue: Rapport entre le don de soi au Seigneur et le don de soi aux envoyés apostoliques
  choice: La priorité du Seigneur est indiquée par « d’abord », tandis que l’engagement envers Paul et ses compagnons reste coordonné dans la phrase.
  alternative: On peut comprendre la formule comme une double consécration, sans hiérarchie plus précise que celle indiquée par « d’abord ».
  rationale: Le texte maintient l’ordre des compléments et la portée de πρῶτον, sans développer de conclusions ecclésiologiques absentes du verset.
- issue: Valeur de διὰ θελήματος θεοῦ
  choice: par la volonté de Dieu
  alternative: selon la volonté de Dieu
  rationale: La formulation principale laisse entendre l’action déterminante de la volonté divine, tandis que la note conserve la lecture possible d’une conformité à cette volonté.
translation_notes:
  register: Français international moderne, courant et digne. La tournure initiale conserve le caractère continuatif et légèrement elliptique du grec. Le point-virgule et « au contraire » rendent clairement l’opposition introduite par ἀλλά.
