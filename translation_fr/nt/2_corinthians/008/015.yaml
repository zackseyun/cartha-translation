  text: καθὼς γέγραπται· Ὁ τὸ πολὺ οὐκ ἐπλεόνασεν, καὶ ὁ τὸ ὀλίγον οὐκ ἠλαττόνησεν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/015.yaml
  text: 'as it is written: The one who had much did not have too much[a], and the one who had little did not have too little.'
translation:
  language: fr
  text: 'comme il est écrit : « Celui qui avait beaucoup n’avait rien de trop[a], et celui qui avait peu ne manquait de rien. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de manière plus littérale en accord avec Exode 16.18 : « Celui qui avait beaucoup ramassé n’avait aucun surplus, et celui qui avait peu ramassé ne manquait de rien. »'
    reason: alternative_reading
lexical_decisions:
- source_word: καθὼς γέγραπται
  choice: comme il est écrit
  rationale: Formule française courante pour introduire une citation de l’Écriture; le présent rend la valeur durable du parfait grec γέγραπται.
- source_word: Ὁ τὸ πολὺ
  choice: Celui qui avait beaucoup
  rationale: L’article suivi de l’adjectif neutre substantivé désigne celui qui a beaucoup. Cette formulation naturelle n’ajoute pas le verbe « ramasser », absent du texte grec cité par Paul.
- source_word: ἐπλεόνασεν
  choice: n’avait rien de trop
  rationale: Le verbe exprime ici l’absence d’excédent. Cette tournure idiomatique conserve le résultat distributif et forme un contraste net avec « ne manquait de rien ».
- source_word: ὁ τὸ ὀλίγον
  choice: celui qui avait peu
  rationale: Rendu parallèle à « celui qui avait beaucoup », sans importer explicitement l’action de ramasser mentionnée dans le contexte d’Exode 16.
- source_word: ἠλαττόνησεν
  choice: ne manquait de rien
  rationale: Dans ce contexte, le verbe signifie être en situation d’insuffisance ou de manque. La formulation indique qu’il n’y avait aucune carence, tout en restant naturelle en français.
theological_decisions:
- issue: Emploi d’Exode 16.18 par Paul dans un contexte de générosité et d’équité
  choice: Exprimer le résultat en matière de possession et de répartition, sans ajouter explicitement « ramasser ».
  alternative: « Celui qui avait beaucoup ramassé n’avait rien de trop, et celui qui avait peu ramassé ne manquait de rien. »
  rationale: La formulation retenue suit les mots de la citation grecque de Paul et laisse ressortir son application immédiate à une provision équitable. La note signale la formulation plus explicite du contexte de l’Exode sans imposer celle-ci au texte principal.
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme « beaucoup / peu » et « rien de trop / ne manquait de rien » rend clairement l’antithèse grecque. Le marqueur [a] figure dans le texte principal.
