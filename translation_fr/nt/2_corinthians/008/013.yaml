  text: οὐ γὰρ ἵνα ἄλλοις ἄνεσις, ⸀ὑμῖν θλῖψις· ἀλλ’ ἐξ ἰσότητος
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/013.yaml
  text: For I do not mean that there should be relief for others and hardship for you, but equality[a]—
translation:
  language: fr
  text: Car il ne s’agit pas que les autres soient soulagés et que vous soyez dans la détresse, mais pour qu’il y ait égalité[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’équité » ; le mot grec évoque un juste équilibre, pas nécessairement une stricte égalité des possessions.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ γὰρ ἵνα
  choice: En effet, il ne s’agit pas de
  rationale: γάρ introduit une explication, tandis que οὐ... ἵνα nie le but envisagé. Cette tournure française restitue naturellement l’intention implicite sans ajouter un sujet absent du grec.
- source_word: ἄλλοις ἄνεσις
  choice: soulager les autres
  rationale: ἄνεσις désigne ici l’allègement d’une pression ou d’un besoin matériel. La formulation verbale est idiomatique en français et conserve le bénéficiaire marqué par le datif ἄλλοις.
- source_word: ὑμῖν θλῖψις
  choice: en vous mettant, vous, dans la détresse
  rationale: θλῖψις évoque une pression pénible ou une situation difficile; dans le contexte de la collecte, «détresse» garde la force du terme sans le limiter à une simple gêne financière. Le pronom détaché souligne le contraste avec «les autres».
- source_word: ἀλλ’ ἐξ ἰσότητος
  choice: mais de parvenir à l’égalité
  rationale: ἰσότης peut désigner l’égalité ou l’équité. «Égalité» demeure l’équivalent lexical le plus direct; «parvenir à» rend idiomatiquement ἐξ dans cette proposition elliptique et prépare l’explication du verset suivant.
theological_decisions:
- issue: Sens de ἰσότης dans le contexte du partage matériel
  choice: égalité
  alternative: équité
  rationale: «Égalité» préserve le terme direct et la tension rhétorique du passage, sans imposer l’idée d’une stricte identité des possessions. La note signale le sens possible d’un juste équilibre.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve le contraste appuyé entre le soulagement des autres et la détresse des destinataires, ainsi que le tiret final indiquant que la pensée se poursuit au verset suivant.
