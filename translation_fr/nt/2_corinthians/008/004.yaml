  text: μετὰ πολλῆς παρακλήσεως δεόμενοι ἡμῶν, τὴν χάριν καὶ τὴν κοινωνίαν τῆς διακονίας τῆς εἰς τοὺς ἁγίους—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/004.yaml
  text: begging us with much urging for the grace and the fellowship of this ministry to the saints—[a]
translation:
  language: fr
  text: nous suppliant avec beaucoup d’insistance de leur accorder le privilège de participer au service en faveur des saints—[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : «de leur accorder la grâce et la participation au service en faveur des saints».'
    reason: Préserve la coordination explicite de χάρις et κοινωνία et la possibilité de rendre χάρις par «grâce».
lexical_decisions:
- source_word: μετὰ πολλῆς παρακλήσεως
  choice: avec beaucoup d’insistance
  rationale: Avec le génitif, μετά exprime ici la manière accompagnant la demande. Dans ce contexte, παράκλησις désigne une sollicitation pressante plutôt qu’un encouragement ou une consolation.
- source_word: δεόμενοι ἡμῶν
  choice: nous suppliant
  rationale: δέομαι exprime une demande humble et pressante; le génitif ἡμῶν désigne les personnes sollicitées. «Nous suppliant» restitue naturellement cette intensité.
- source_word: τὴν χάριν καὶ τὴν κοινωνίαν
  choice: de leur faire la grâce de participer
  rationale: χάρις peut désigner une grâce, une faveur ou un privilège, tandis que κοινωνία exprime ici la participation. La formulation française rend leur rapport contextuel sans effacer la valeur de χάρις; la structure plus littérale est conservée en note.
- source_word: τῆς διακονίας
  choice: au service
  rationale: Dans le contexte de la collecte, διακονία désigne un service concret d’assistance. «Service» est plus immédiatement clair en français que «ministère» pour cette aide matérielle.
- source_word: τῆς εἰς τοὺς ἁγίους
  choice: en faveur des saints
  rationale: La tournure indique la destination ou les bénéficiaires du service. «En faveur des saints» rend cette relation et conserve le terme paulinien traditionnel pour les croyants.
theological_decisions:
- issue: Rapport entre χάρις et κοινωνία
  choice: «faire la grâce de participer», avec la structure coordonnée signalée en note
  alternative: «la grâce et la participation au service»
  rationale: Le grec coordonne formellement les deux noms, mais le contexte permet de comprendre la grâce comme le privilège de participer. Le texte principal privilégie un français naturel, tandis que la note préserve la construction et l’ambiguïté lexicales.
- issue: Traduction de ἅγιοι
  choice: saints
  alternative: membres du peuple saint
  rationale: «Saints» maintient le vocabulaire paulinien et désigne ici l’ensemble des croyants concernés, sans suggérer une catégorie canonisée ultérieurement.
translation_notes:
  register: Français moderne, digne et courant. La phrase reste un fragment syntaxiquement rattaché au contexte précédent, conformément au tiret final du texte source.
