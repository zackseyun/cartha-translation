language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: συνεπέμψαμεν δὲ αὐτοῖς τὸν ἀδελφὸν ἡμῶν ὃν ἐδοκιμάσαμεν ἐν πολλοῖς πολλάκις σπουδαῖον ὄντα, νυνὶ δὲ πολὺ σπουδαιότερον πεποιθήσει πολλῇ τῇ εἰς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/022.yaml
  text: And we have sent with them our brother[a], whom we have often tested in many matters and found to be diligent, but who is now even more diligent because of his great confidence in you.
translation:
  language: fr
  text: Et nous avons envoyé avec eux notre frère, dont nous avons constaté, à maintes reprises et dans bien des situations, l’empressement. À présent, il manifeste encore beaucoup plus d’empressement, en raison de sa grande confiance en vous.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi comprendre : « en raison de la grande confiance que nous avons en vous ». Le grec ne précise pas explicitement à qui appartient cette confiance.'
    reason: ambiguïté grammaticale concernant le détenteur de la confiance
lexical_decisions:
- source_word: συνεπέμψαμεν
  choice: nous avons envoyé avec eux
  rationale: L’aoriste présente l’envoi comme accompli, avec une portée actuelle dans la lettre. « Avec eux » rend le préfixe συν- de façon naturelle.
- source_word: ἀδελφὸν ἡμῶν
  choice: notre frère
  rationale: Cette formulation conserve l’image familiale propre à la communauté croyante ainsi que la référence masculine singulière à ce collaborateur non nommé.
- source_word: ἐδοκιμάσαμεν
  choice: dont nous avons constaté
  rationale: Le verbe δοκιμάζω évoque une mise à l’épreuve qui a permis de reconnaître une qualité éprouvée. « Constaté » exprime ici le résultat positif sans suggérer un simple examen ponctuel.
- source_word: ἐν πολλοῖς πολλάκις
  choice: à maintes reprises et dans bien des situations
  rationale: La traduction conserve à la fois la répétition exprimée par πολλάκις et la diversité des circonstances exprimée par ἐν πολλοῖς.
- source_word: σπουδαῖον ὄντα
  choice: l’empressement
  rationale: Dans ce contexte, σπουδαῖος désigne une disposition active faite de zèle, de sérieux et de disponibilité. « Empressement » convient à la mission confiée sans réduire le terme à la seule application au travail.
- source_word: νυνὶ δὲ πολὺ σπουδαιότερον
  choice: À présent, il manifeste encore beaucoup plus d’empressement
  rationale: La formulation rend le comparatif fortement intensifié par πολὺ et établit clairement le lien avec l’empressement déjà attesté.
- source_word: πεποιθήσει πολλῇ τῇ εἰς ὑμᾶς
  choice: en raison de sa grande confiance en vous
  rationale: Le datif peut indiquer la cause ou le moyen de cet empressement accru. Le contexte immédiat rattache le plus naturellement cette confiance au frère envoyé et l’expression εἰς ὑμᾶς en indique l’orientation vers les Corinthiens.
theological_decisions:
- issue: Référent de πεποιθήσει πολλῇ τῇ εἰς ὑμᾶς
  choice: La confiance est comprise dans le texte principal comme celle du frère envoyé envers les Corinthiens.
  alternative: La confiance pourrait être celle de Paul et de ses collaborateurs envers les Corinthiens.
  rationale: Le sujet le plus proche est le frère dont l’empressement est décrit, ce qui favorise la première lecture. Toutefois, le grec n’exprime aucun possessif devant « confiance »; la seconde lecture reste donc signalée en note afin de ne pas supprimer une ambiguïté réelle.
translation_notes:
  register: Français international moderne, digne et accessible. « À maintes reprises » et « dans bien des situations » rendent sans lourdeur la double insistance du grec. La répétition d’« empressement » préserve le lien lexical et comparatif entre σπουδαῖον et σπουδαιότερον.
