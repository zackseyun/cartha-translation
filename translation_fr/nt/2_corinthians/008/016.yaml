  yaml_path: translation/nt/2_corinthians/008/016.yaml
  text: But thanks be to God[a], who puts the same earnestness for you into Titus's heart,
translation:
  language: fr
  text: Mais grâce soit rendue à Dieu, qui met dans le cœur de Tite le même empressement pour vous.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Χάρις δὲ τῷ θεῷ
  choice: Mais grâce soit rendue à Dieu
  rationale: Dans cette formule suivie du datif « à Dieu », χάρις exprime la reconnaissance. La tournure française consacrée et intelligible « grâce soit rendue à Dieu » restitue naturellement cette action de grâce, tandis que δέ marque ici une transition légèrement contrastive.
- source_word: τῷ διδόντι
  choice: qui met
  rationale: Le participe présent désigne Dieu comme celui qui suscite activement cette disposition. Avec le complément « dans le cœur », « met » est plus naturel en français que le calque « donne ».
- source_word: τὴν αὐτὴν σπουδήν
  choice: le même empressement
  rationale: σπουδή désigne ici une disposition ardente, zélée et sincère. « Empressement » convient au contexte de la sollicitude de Tite et conserve la comparaison exprimée par αὐτήν.
- source_word: ὑπὲρ ὑμῶν
  choice: pour vous
  rationale: La préposition exprime ici une sollicitude orientée vers les Corinthiens. « Pour vous » est concis, naturel et suffisamment ouvert quant à la nuance exacte.
- source_word: ἐν τῇ καρδίᾳ Τίτου
  choice: dans le cœur de Tite
  rationale: Cette traduction conserve directement la préposition ἐν et la métaphore biblique du cœur comme siège de la disposition intérieure, dans un français naturel.
theological_decisions: []
