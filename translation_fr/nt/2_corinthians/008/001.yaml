source:
  edition: SBLGNT
  text: Γνωρίζομεν δὲ ὑμῖν, ἀδελφοί, τὴν χάριν τοῦ θεοῦ τὴν δεδομένην ἐν ταῖς ἐκκλησίαις τῆς Μακεδονίας,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/001.yaml
  text: We make known to you[a], brothers, the grace of God that has been given among the churches of Macedonia[b],
translation:
  language: fr
  text: Nous vous faisons connaître, frères[a], la grâce de Dieu qui a été donnée dans les Églises de Macédoine[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec dit « frères »; au pluriel, ce mot peut s’adresser à l’ensemble de la communauté, hommes et femmes.
    reason: lexical_alternative
  - marker: b
    text: « La grâce de Dieu » peut désigner à la fois la faveur de Dieu et la générosité que cette faveur a produite dans les Églises de Macédoine.
    reason: lexical_alternative
lexical_decisions:
- source_word: Γνωρίζομεν
  choice: Nous vous faisons connaître
  rationale: Cette formulation rend directement le présent de γνωρίζω (« faire connaître ») et conserve le ton épistolaire, sans l’expansion interprétative « nous voulons que vous sachiez ».
- source_word: δὲ
  choice: non exprimé séparément
  rationale: δέ signale ici une transition légère. En français, l’enchaînement avec le contexte peut suffire; « mais » suggérerait un contraste trop marqué et « maintenant » introduirait à tort une valeur temporelle.
- source_word: ὑμῖν
  choice: vous
  rationale: Le pronom rend le datif du destinataire avec le verbe « faire connaître ».
- source_word: ἀδελφοί
  choice: frères et sœurs
  rationale: Le masculin pluriel grec sert fréquemment à interpeller l’ensemble de la communauté. Le français inclusif explicite le référent probable, tandis qu’une note conserve la forme littérale du grec.
- source_word: χάριν τοῦ θεοῦ
  choice: la grâce de Dieu
  rationale: « Grâce » préserve le vocabulaire paulinien et laisse ouvertes à la fois la faveur divine et son effet concret dans la générosité des communautés.
- source_word: τὴν δεδομένην
  choice: qui a été accordée
  rationale: Le parfait passif est rendu par une forme accomplie. « Accordée » est naturel avec « grâce » en français et conserve l’idée d’un don reçu.
- source_word: ἐν ταῖς ἐκκλησίαις
  choice: aux Églises
  rationale: Dans ce contexte, ἐν désigne les communautés au sein desquelles la grâce a été donnée et agit. Le français « accordée aux Églises » exprime naturellement ces communautés comme bénéficiaires sans réduire la grâce au seul don financier.
- source_word: τῆς Μακεδονίας
  choice: de Macédoine
  rationale: Le complément du nom est reproduit directement et identifie les communautés de cette région.
theological_decisions:
- issue: Sens de « la grâce de Dieu » dans le contexte
  choice: L’action bienveillante de Dieu accordée aux Églises de Macédoine et produisant notamment leur générosité
  alternative: Le don financier lui-même, ou plus généralement la faveur divine envers ces Églises
  rationale: Le texte principal garde l’expression large « la grâce de Dieu » et ne la remplace ni par « générosité » ni par « collecte », afin de préserver le lien et la tension entre la source divine et son effet concret.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe conserve le ton épistolaire de Paul tout en évitant un calque lourd. « Églises » désigne ici les communautés chrétiennes locales.
