  naturalness: 'La formulation révisée emploie des tournures modernes et naturelles : « achevez aussi de le faire », « vous avez eu l’empressement de le vouloir » et « selon ce que vous avez ». Elle conserve la répétition voulue entre l’ordre initial et l’achèvement dans la proposition de but.'
