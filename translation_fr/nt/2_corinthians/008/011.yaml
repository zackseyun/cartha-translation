reference: 2 Corinthians 8:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: νυνὶ δὲ καὶ τὸ ποιῆσαι ἐπιτελέσατε, ὅπως καθάπερ ἡ προθυμία τοῦ θέλειν οὕτως καὶ τὸ ἐπιτελέσαι ἐκ τοῦ ἔχειν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/011.yaml
  text: But now complete the doing of it also[a], so that just as there was the eagerness to will it[b], so also there may be the completion from what you have.
translation:
  language: fr
  text: Mais maintenant, achevez aussi de le faire[a], afin que, de même que vous avez eu l’empressement de le vouloir, vous l’acheviez aussi selon ce que vous avez[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « menez-en aussi l’exécution à son terme ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « à partir de ce que vous avez » ; c’est-à-dire selon vos moyens actuels.
    reason: lexical_alternative
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: Mais maintenant
  rationale: Cette expression marque à la fois une transition et le passage de l’intention antérieure à l’action présente.
- source_word: τὸ ποιῆσαι ἐπιτελέσατε
  choice: achevez aussi de le réaliser
  rationale: Cette formulation française naturelle exprime l’ordre de mener à son terme l’action déjà projetée, tout en conservant la force d’achèvement de ἐπιτελέω.
- source_word: ἡ προθυμία τοῦ θέλειν
  choice: vous avez été empressés de le vouloir
  rationale: La tournure verbale restitue naturellement l’empressement ou la disposition volontaire exprimée par προθυμία, sans réduire θέλειν à une simple émotion.
- source_word: τὸ ἐπιτελέσαι
  choice: vous l’acheviez aussi
  rationale: Le verbe reprend le même champ lexical que l’impératif ἐπιτελέσατε et maintient le parallèle entre volonté et accomplissement.
- source_word: ἐκ τοῦ ἔχειν
  choice: en fonction de ce que vous avez
  rationale: La formule conserve le lien avec les ressources effectivement disponibles et rend clairement la valeur de source ou de mesure de ἐκ.
theological_decisions:
- issue: Le don en rapport avec les ressources disponibles
  choice: L’exhortation demande d’achever la contribution projetée en fonction de ce que les destinataires possèdent effectivement.
  alternative: Comprendre le verset comme un appel général à accomplir toute bonne intention sans considération des moyens disponibles.
  rationale: Le contexte immédiat concerne la collecte, et ἐκ τοῦ ἔχειν rattache explicitement son achèvement à ce que les Corinthiens ont. La traduction n’implique donc pas qu’ils doivent donner au-delà de leurs moyens.
translation_notes:
  register: Français international moderne, clair et digne. La structure comparative entre l’empressement à vouloir et l’achèvement effectif est conservée, tandis que les infinitifs substantivés grecs sont rendus verbalement pour assurer une lecture naturelle.
