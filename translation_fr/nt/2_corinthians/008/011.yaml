    rationale: Cette périphrase est moins naturelle que « vous avez eu l’empressement de le vouloir » et rend moins clairement le nom grec ἡ προθυμία. La révision maintient le repère rétrospectif fourni par le contexte sans surinterpréter le temps grec.
