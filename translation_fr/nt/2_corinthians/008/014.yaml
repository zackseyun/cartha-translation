id: 2CO.8.14
reference: 2 Corinthians 8:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐν τῷ νῦν καιρῷ τὸ ὑμῶν περίσσευμα εἰς τὸ ἐκείνων ὑστέρημα, ἵνα καὶ τὸ ἐκείνων περίσσευμα γένηται εἰς τὸ ὑμῶν ὑστέρημα, ὅπως γένηται ἰσότης·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/014.yaml
  text: At the present time[a], your abundance is for their need, so that their abundance may also be for your need, in order that there may be equality.
translation:
  language: fr
  text: Dans les circonstances présentes, ce que vous avez en abondance répond à ce qui leur manque, afin que ce qu’ils ont en abondance réponde aussi à ce qui vous manque, et qu’ainsi il y ait égalité[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « équité » ou « juste équilibre ». Le terme grec désigne ici une prise en charge mutuelle et équilibrée des besoins, sans impliquer nécessairement que tous possèdent exactement la même chose.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ νῦν καιρῷ
  choice: Dans les circonstances présentes
  rationale: καιρός désigne ici le moment dans sa situation concrète, et non le temps chronologique en général. Cette formulation française garde cette nuance contextuelle.
- source_word: τὸ ὑμῶν περίσσευμα
  choice: ce que vous avez en abondance
  rationale: περίσσευμα désigne ce qui dépasse les besoins, ici vraisemblablement des ressources matérielles. La formulation est naturelle en français et évite de limiter explicitement le propos à l’argent.
- source_word: εἰς τὸ ἐκείνων ὑστέρημα
  choice: répond à ce qui leur manque
  rationale: ὑστέρημα évoque un manque ou une insuffisance. Avec εἰς, l’expression indique que l’abondance des uns est orientée vers le besoin des autres; « répond à » exprime ce rapport sans lourdeur.
- source_word: ἵνα καὶ
  choice: afin que … aussi
  rationale: « afin que » conserve la valeur de but de ἵνα, tandis que « aussi » rend καί et souligne la réciprocité.
- source_word: τὸ ἐκείνων περίσσευμα
  choice: ce qu’ils ont en abondance
  rationale: La même formulation que dans le premier membre préserve le parallélisme et la réciprocité du grec.
- source_word: γένηται εἰς τὸ ὑμῶν ὑστέρημα
  choice: réponde aussi à ce qui vous manque
  rationale: La tournure exprime naturellement la destination de leur abondance vers le manque éventuel des destinataires, tout en maintenant la structure réciproque du verset.
- source_word: ὅπως γένηται ἰσότης
  choice: et qu’ainsi il y ait égalité
  rationale: ἰσότης signifie directement « égalité », avec ici l’idée contextuelle d’un équilibre produit par le partage mutuel. « Ainsi » relie clairement ce résultat au mouvement réciproque décrit.
theological_decisions:
- issue: Sens de ἰσότης dans l’appel de Paul à la générosité
  choice: égalité résultant d’une prise en charge mutuelle des besoins
  alternative: équité ou juste équilibre
  rationale: Le contexte immédiat porte sur la réciprocité dans la réponse aux besoins, non sur l’identité absolue des possessions. Le texte retient le correspondant lexical direct « égalité », tandis que la note en précise la portée contextuelle.
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme du grec est conservé par la répétition de « ce que vous/ils ont en abondance » et « ce qui leur/vous manque ». Le marqueur de note est placé après « égalité », le terme auquel la note se rapporte.
