id: 2CO.8.19
reference: 2 Corinthians 8:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὐ μόνον δὲ ἀλλὰ καὶ χειροτονηθεὶς ὑπὸ τῶν ἐκκλησιῶν συνέκδημος ἡμῶν ⸀σὺν τῇ χάριτι ταύτῃ τῇ διακονουμένῃ ὑφ’ ἡμῶν πρὸς τὴν ⸀αὐτοῦ τοῦ κυρίου δόξαν καὶ προθυμίαν ἡμῶν—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/019.yaml
  text: And not only that[d][c][b][a], but he was also appointed by the churches as our traveling companion with this gracious gift that is being administered by us for the glory of the Lord himself and our eagerness—
translation:
  language: fr
  text: Et non seulement cela, mais il a aussi été désigné[a] par les Églises comme notre compagnon de voyage dans le cadre de ce don généreux[b] que nous administrons, en vue de la gloire du Seigneur lui-même[c] et de notre empressement—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «choisi»; le terme n’impose pas nécessairement l’idée d’un vote formel.
    reason: lexical_alternative
  - marker: b
    text: Littéralement «avec cette grâce»; dans ce contexte, il s’agit du don recueilli.
    reason: lexical_alternative
  - marker: c
    text: La tournure grecque peut aussi se comprendre comme «en vue de la gloire de son Seigneur» ou simplement «en vue de la gloire du Seigneur».
    reason: alternative_reading
lexical_decisions:
- source_word: χειροτονηθεὶς
  choice: désigné
  rationale: Le participe indique que les Églises l’ont choisi pour cette mission, sans imposer l’idée d’une procédure électorale moderne.
- source_word: ἐκκλησιῶν
  choice: Églises
  rationale: Dans ce contexte paulinien, le terme désigne les communautés chrétiennes locales.
- source_word: συνέκδημος
  choice: compagnon de voyage
  rationale: Cette expression française naturelle conserve explicitement l’idée d’un déplacement effectué ensemble.
- source_word: χάριτι
  choice: don généreux
  rationale: Dans le contexte de la collecte, χάρις désigne concrètement le don tout en gardant sa dimension de générosité et de grâce.
- source_word: διακονουμένῃ
  choice: dont nous assurons le service
  rationale: Le participe décrit la prise en charge de la collecte par Paul et ses collaborateurs; «service» conserve le champ sémantique de διακονέω sans suggérer prématurément sa distribution.
- source_word: πρὸς
  choice: pour
  rationale: La préposition exprime ici le but ou le résultat visé.
- source_word: αὐτοῦ τοῦ κυρίου
  choice: du Seigneur lui-même
  rationale: Cette formulation prend αὐτοῦ comme intensif et rend l’emphase de la construction grecque tout en signalant en note son ambiguïté réelle.
- source_word: δόξαν
  choice: gloire
  rationale: «Gloire» est l’équivalent naturel et théologiquement approprié de δόξα.
- source_word: προθυμίαν
  choice: empressement
  rationale: Le nom exprime une disposition volontaire, ardente et prête à agir, sans ajouter un objet absent du grec.
theological_decisions:
- issue: Valeur de αὐτοῦ dans πρὸς τὴν αὐτοῦ τοῦ κυρίου δόξαν
  choice: «pour la gloire du Seigneur lui-même», αὐτοῦ étant compris comme intensif
  alternative: «pour la gloire de son Seigneur» ou, plus simplement, «pour la gloire du Seigneur»
  rationale: La construction grecque est condensée et permet plusieurs analyses. Le texte principal retient l’analyse intensive, tandis que la note préserve les autres compréhensions possibles.
- issue: Rapport de προθυμίαν ἡμῶν avec le but du service
  choice: «et pour manifester notre empressement»
  alternative: «et notre empressement»
  rationale: Le grec coordonne «la gloire» et «notre empressement» après πρὸς. L’ajout de «manifester» explicite en français le résultat visé sans préciser indûment l’objet de cet empressement.
translation_notes:
  register: Français international moderne, digne et accessible. «Bien plus» évite la lourdeur de «et non seulement cela». La phrase garde le tiret final, puisque le verset se poursuit syntaxiquement au verset suivant.
