revisions:
- from: Bien plus, il a aussi été désigné[a] par les Églises pour être notre compagnon de voyage avec ce don généreux[b] dont nous assurons le service, pour la gloire du Seigneur lui-même[c] et pour manifester notre empressement—
  to: Et non seulement cela, mais il a aussi été désigné[a] par les Églises comme notre compagnon de voyage dans le cadre de ce don généreux[b] que nous administrons, en vue de la gloire du Seigneur lui-même[c] et de notre empressement—
  rationale: La révision rétablit la construction argumentative explicite de οὐ μόνον... ἀλλὰ καί, supprime l’ajout interprétatif «manifester», et rend plus directement le participe passif relatif à l’administration du don. Elle maintient la lecture intensive de αὐτοῦ dans le texte tout en conservant les analyses alternatives en note, sans les trancher.
