source:
  edition: SBLGNT
  text: ὃς ἐκ τηλικούτου θανάτου ἐρρύσατο ἡμᾶς καὶ ⸀ῥύσεται, εἰς ὃν ἠλπίκαμεν ὅτι καὶ ἔτι ῥύσεται,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/010.yaml
  text: who rescued us from so great a death and will rescue us[a], in whom we have hoped that he will indeed rescue us again,
translation:
  language: fr
  text: 'C’est lui qui nous a délivrés d’une mort si terrible et qui nous délivrera[a]. Nous avons placé notre espérance en lui : il nous délivrera encore.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « d’un si grand danger de mort ».'
    reason: θανάτου signifie littéralement « mort », mais l’expression peut désigner un péril mortel.
lexical_decisions:
- source_word: τηλικούτου
  choice: si grande
  rationale: L’adjectif démonstratif souligne l’ampleur extrême du danger; « si grande » conserve cette intensité avec le nom « mort ».
- source_word: θανάτου
  choice: mort
  rationale: Le nom signifie littéralement « mort ». L’image grecque est conservée dans le texte, tandis que le sens possible de danger mortel est signalé en note.
- source_word: ἐρρύσατο
  choice: a délivrés
  rationale: Le verbe désigne l’action de tirer quelqu’un d’un danger. « Délivrer » est naturel, digne et permet de conserver la répétition du même verbe dans tout le verset.
- source_word: ῥύσεται
  choice: délivrera
  rationale: Le futur est rendu explicitement, avec le même verbe français que pour l’aoriste apparenté afin de préserver la cohésion lexicale.
- source_word: εἰς ὃν
  choice: En lui
  rationale: Dans cette construction, la préposition introduit la personne sur laquelle porte l’espérance. « En lui » est idiomatique en français et garde la référence personnelle.
- source_word: ἠλπίκαμεν
  choice: nous avons placé notre espérance
  rationale: Le parfait exprime une confiance établie dont l’effet demeure; cette formulation française rend clairement cette posture durable.
- source_word: καὶ ἔτι
  choice: oui… encore
  rationale: « Oui » rend la valeur emphatique de καί, et « encore » celle de ἔτι, sans réduire l’expression à la seule répétition temporelle.
theological_decisions:
- issue: Faut-il comprendre « mort » littéralement ou expliciter un danger mortel ?
  choice: Conserver « mort » dans le texte principal
  alternative: Traduire « un si grand danger de mort » ou « un péril si mortel »
  rationale: Le grec emploie explicitement θάνατος, « mort ». Garder cette image respecte la formulation intense de Paul et préserve son ambiguïté, tandis qu’une note fournit le sens idiomatique possible.
translation_notes:
  register: Français international actuel, clair et digne. La répétition de « délivrer » reproduit celle du grec. Deux phrases évitent une période française trop lourde tout en maintenant le mouvement passé–avenir–espérance du texte.
