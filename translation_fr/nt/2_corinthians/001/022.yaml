  text: ὁ καὶ σφραγισάμενος ἡμᾶς καὶ δοὺς τὸν ἀρραβῶνα τοῦ πνεύματος ἐν ταῖς καρδίαις ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/022.yaml
  text: who also sealed us and gave the down payment of the Spirit in our hearts.
translation:
  language: fr
  text: lui qui nous a aussi marqués de son sceau et a donné, dans nos cœurs, l’acompte de l’Esprit[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le gage » ou « la garantie » de l’Esprit.
    reason: lexical_alternative
lexical_decisions:
- source_word: σφραγισάμενος
  choice: marqués de son sceau
  rationale: Cette formulation conserve l’image du sceau, avec ses connotations possibles d’appartenance, d’authentification et de protection, tout en étant naturelle en français moderne.
- source_word: δοὺς
  choice: a mis
  rationale: Le participe aoriste est coordonné de façon idiomatique au premier participe. Avec « dans nos cœurs », « a mis » exprime naturellement le don et son emplacement sans modifier le sens.
- source_word: ἀρραβῶνα
  choice: acompte
  rationale: Le terme désigne un premier versement qui engage et garantit la suite. « Acompte » préserve concrètement la métaphore commerciale mieux que le seul mot « garantie ».
- source_word: τοῦ πνεύματος
  choice: de l’Esprit
  rationale: Le génitif compact est conservé sans décider explicitement s’il indique que l’acompte consiste dans l’Esprit ou vient de lui.
- source_word: ἐν ταῖς καρδίαις ἡμῶν
  choice: dans nos cœurs
  rationale: Cette traduction directe conserve le lieu intérieur et personnel exprimé par ἐν avec le datif.
- source_word: ὁ καὶ ... καὶ
  choice: lui qui ... aussi ... et qui
  rationale: « Lui qui » rattache naturellement les participes à Dieu mentionné dans le contexte précédent, tandis que « aussi » et la coordination reproduisent la structure grecque.
theological_decisions:
- issue: Sens de l’Esprit comme ἀρραβών
  choice: l’acompte de l’Esprit
  alternative: le gage de l’Esprit ; la garantie de l’Esprit
  rationale: « Acompte » maintient l’image d’un premier versement qui annonce et garantit l’accomplissement futur. La formulation « de l’Esprit » laisse ouverte la relation précise du génitif au lieu de l’expliciter doctrinalement.
translation_notes:
  register: Français international moderne, digne et accessible. « Marqués de son sceau » rend la métaphore de façon plus transparente que le seul verbe « scellés » ; « acompte » conserve l’image commerciale paulinienne.
