id: 2CO.1.8
reference: 2 Corinthians 1:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Οὐ γὰρ θέλομεν ὑμᾶς ἀγνοεῖν, ἀδελφοί, ⸀ὑπὲρ τῆς θλίψεως ἡμῶν τῆς ⸀γενομένης ἐν τῇ Ἀσίᾳ, ὅτι καθ’ ὑπερβολὴν ⸂ὑπὲρ δύναμιν ἐβαρήθημεν⸃, ὥστε ἐξαπορηθῆναι ἡμᾶς καὶ τοῦ ζῆν·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/008.yaml
  text: For we do not want you to be unaware[a], brothers, about our affliction that happened in Asia, that we were burdened exceedingly, beyond our strength[c][b], so that we despaired even of life.
translation:
  language: fr
  text: 'En effet, nous ne voulons pas que vous ignoriez, frères[a], la détresse qui nous est survenue en Asie[b] : nous avons été accablés au-delà de toute mesure, au-delà de nos forces, au point de désespérer même de vivre[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec dit littéralement « frères »; dans cette adresse, le terme vise vraisemblablement toute la communauté croyante, femmes comprises.
    reason: cultural_note
  - marker: b
    text: Ici, « Asie » désigne la province romaine située dans l’ouest de l’Asie Mineure, et non le continent asiatique actuel.
    reason: cultural_note
  - marker: c
    text: 'Ou : « de continuer à vivre ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: θέλομεν … ἀγνοεῖν
  choice: nous ne voulons pas que vous ignoriez
  rationale: Cette tournure française naturelle conserve la déclaration de volonté au présent et le sens de ne pas laisser les destinataires sans information.
- source_word: ἀδελφοί
  choice: frères et sœurs
  rationale: Dans cette adresse épistolaire, le masculin pluriel grec désigne vraisemblablement l’ensemble de la communauté croyante; l’explicitation inclusive transmet cette portée en français moderne.
- source_word: ὑπὲρ τῆς θλίψεως ἡμῶν
  choice: l’épreuve que nous avons traversée
  rationale: θλῖψις évoque une détresse ou une oppression grave. « Épreuve » est digne et courant; la formulation avec « traversée » s’accorde naturellement avec le participe suivant.
- source_word: τῆς γενομένης ἐν τῇ Ἀσίᾳ
  choice: que nous avons traversée en Asie
  rationale: Le participe γενόμενης caractérise l’épreuve survenue en Asie. Cette formulation idiomatique n’ajoute pas de détail sur sa nature.
- source_word: καθ’ ὑπερβολὴν ὑπὲρ δύναμιν
  choice: à l’extrême, au-delà de nos forces
  rationale: La combinaison grecque exprime une intensité excessive dépassant les capacités des auteurs; les deux éléments sont maintenus.
- source_word: ἐβαρήθημεν
  choice: nous avons été accablés
  rationale: Le passif conserve l’idée d’un poids subi et rend avec force l’image du verbe grec.
- source_word: ὥστε ἐξαπορηθῆναι ἡμᾶς
  choice: au point de désespérer
  rationale: « Au point de » marque clairement le résultat, tandis que « désespérer » exprime l’impasse extrême portée par ἐξαπορέω.
- source_word: καὶ τοῦ ζῆν
  choice: même de rester en vie
  rationale: Cette expression explicite naturellement en français que le désespoir portait sur la possibilité de continuer à vivre.
theological_decisions:
- issue: Portée de l’adresse ἀδελφοί
  choice: frères et sœurs
  alternative: frères
  rationale: Le mot grec est morphologiquement masculin pluriel, mais, dans l’adresse à toute l’Église de Corinthe, il a vraisemblablement une portée collective incluant les femmes. La note préserve l’information formelle.
- issue: Nature de la détresse en Asie
  choice: ne pas préciser l’événement
  alternative: identifier une persécution, l’émeute d’Éphèse ou une maladie
  rationale: Le verset ne nomme pas la cause de l’épreuve; la traduction conserve cette indétermination plutôt que d’adopter une reconstruction particulière.
- issue: Force de ἐξαπορηθῆναι … τοῦ ζῆν
  choice: désespérer même de rester en vie
  alternative: perdre tout espoir de survivre
  rationale: Le choix conserve la force existentielle du propos sans décider si Paul parle d’un danger objectivement mortel ou de son état intérieur face à l’épreuve.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase conserve l’intensification progressive du grec, de l’accablement au désespoir de vivre, tout en évitant une syntaxe inutilement calquée.
