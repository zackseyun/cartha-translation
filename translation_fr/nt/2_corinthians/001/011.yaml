  to: Vous aussi, vous nous venez en aide par vos prières, afin que, par l’intermédiaire de beaucoup[b], on rende grâce, de la part de beaucoup[a], à notre sujet pour le don qui nous a été accordé.
  rationale: La révision retire l’explicitation non garantie selon laquelle le don serait accordé « en réponse aux prières ». Elle rend les deux occurrences de πολλῶν de manière visible et préserve, par « par l’intermédiaire de beaucoup » et par la note, l’ambiguïté syntaxique de διὰ πολλῶν. Elle conserve le caractère collectif de συνυπουργούντων et ne précise pas indûment le destinataire implicite de l’action de grâce.
