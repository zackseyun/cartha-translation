source:
  edition: SBLGNT
  text: συνυπουργούντων καὶ ὑμῶν ὑπὲρ ἡμῶν τῇ δεήσει, ἵνα ἐκ πολλῶν προσώπων τὸ εἰς ἡμᾶς χάρισμα διὰ πολλῶν εὐχαριστηθῇ ὑπὲρ ⸀ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/011.yaml
  text: as you also join in helping us by prayer[c][b][a], so that thanks may be given by many on our behalf for the gracious gift given to us.
translation:
  language: fr
  text: Vous aussi, vous nous venez en aide par vos prières, afin que, par l’intermédiaire de beaucoup[b], on rende grâce, de la part de beaucoup[a], à notre sujet pour le don qui nous a été accordé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « de beaucoup de visages » ; ici, « visages » désigne des personnes.'
    reason: lexical_alternative
  - marker: b
    text: La construction grecque est condensée et son rattachement est discuté. On peut aussi comprendre que les actions de grâce sont rendues « par l’intermédiaire de beaucoup », notamment en lien avec les nombreuses prières mentionnées au début du verset.
    reason: alternative_reading
lexical_decisions:
- source_word: συνυπουργούντων καὶ ὑμῶν
  choice: Vous aussi, vous contribuez à nous aider
  rationale: Le verbe composé exprime une aide apportée conjointement. « Contribuez à nous aider » restitue la valeur collaborative de συν- dans un français naturel.
- source_word: ὑπὲρ ἡμῶν τῇ δεήσει
  choice: en priant pour nous
  rationale: Le datif τῇ δεήσει indique ici le moyen, et δέησις désigne une prière de demande fervente. La tournure verbale est plus naturelle en français moderne.
- source_word: ἐκ πολλῶν προσώπων
  choice: beaucoup de personnes
  rationale: Πρόσωπον signifie littéralement « visage », mais désigne ici les personnes dont provient l’action de grâce.
- source_word: τὸ εἰς ἡμᾶς χάρισμα
  choice: le don qui nous a été accordé
  rationale: Χάρισμα désigne un don accordé par grâce; la formulation conserve l’idée de don et rend explicitement sa destination, εἰς ἡμᾶς.
- source_word: διὰ πολλῶν
  choice: en réponse aux prières de beaucoup
  rationale: La formule grecque très condensée renvoie vraisemblablement à la participation de nombreuses personnes par leurs prières. Le texte principal explicite ce lien contextuel, tandis que l’autre rattachement syntaxique est signalé en note.
- source_word: εὐχαριστηθῇ
  choice: rendent grâce
  rationale: Le passif grec s’exprime idiomatiquement en français par la locution active « rendre grâce », dont Dieu est le destinataire implicite dans le contexte.
- source_word: ὑπὲρ ἡμῶν
  choice: à notre sujet
  rationale: La préposition indique ici que l’action de grâce est offerte à propos de ce que Dieu a fait pour Paul et ses compagnons.
theological_decisions:
- issue: Destinataire implicite de l’action de grâce
  choice: Ne pas ajouter explicitement « à Dieu » dans le texte
  alternative: « rendent grâce à Dieu »
  rationale: Le contexte implique Dieu, mais le grec ne nomme pas ici le destinataire. « Rendre grâce » suffit en français biblique courant sans ajouter un élément absent.
- issue: Rapport entre le don, les nombreuses prières et les nombreuses actions de grâce
  choice: Rattacher dans le texte principal « par beaucoup » aux prières ayant précédé le don
  alternative: Rattacher la formule au moyen par lequel l’action de grâce est offerte
  rationale: La syntaxe grecque permet plusieurs analyses. Le choix principal suit la progression contextuelle entre l’aide par la prière et l’action de grâce, sans exclure l’autre lecture, conservée en note.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve la structure participative du passage, évite un vocabulaire confessionnel spécialisé et signale l’ambiguïté réelle de διὰ πολλῶν plutôt que de la résoudre sans indication.
