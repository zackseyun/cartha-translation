  naturalness: Le français est globalement naturel. La révision emploie « vous nous venez en aide par vos prières », formulation plus directe et idiomatique que « vous contribuez à nous aider en priant pour nous ».
  terminology: « Don qui nous a été accordé » convient pour χάρισμα dans ce contexte sans imposer une interprétation théologique. « Rendre grâce » est le rendu français usuel et digne de εὐχαριστηθῇ. « À notre sujet » conserve la portée référentielle de ὑπὲρ ἡμῶν sans ajouter un destinataire explicite à l’action de grâce.
