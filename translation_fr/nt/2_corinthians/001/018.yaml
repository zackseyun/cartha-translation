  text: πιστὸς δὲ ὁ θεὸς ὅτι ὁ λόγος ἡμῶν ὁ πρὸς ὑμᾶς οὐκ ⸀ἔστιν Ναὶ καὶ Οὔ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/018.yaml
  text: As surely as God is faithful[b][a], our message to you is not “Yes and No.”
translation:
  language: fr
  text: Aussi vrai que Dieu est fidèle[a], le message[b] que nous vous adressons n’est pas « oui et non ».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « Mais Dieu est fidèle : notre parole qui vous est adressée n’est pas oui et non. »'
    reason: La note conserve une forme plus directe de la construction grecque, dont la syntaxe peut être rendue de plusieurs manières en français.
  - marker: b
    text: « Message » peut aussi être traduit par « parole » ou « propos ».
    reason: Le nom grec λόγος possède ici plusieurs équivalents possibles selon que l’on souligne le contenu communiqué ou l’acte de parler.
lexical_decisions:
- source_word: πιστός
  choice: fidèle
  rationale: « Fidèle » exprime naturellement la constance et la fiabilité de Dieu, sur lesquelles Paul fonde son affirmation.
- source_word: δὲ
  choice: intégré à la tournure « Aussi vrai que »
  rationale: Dans cette construction, δέ ne marque pas nécessairement une opposition forte. La formulation française restitue la valeur solennelle de l’affirmation sans ajouter un « mais » artificiel.
- source_word: ὅτι
  choice: rendu par la construction qui introduit l’affirmation principale
  rationale: Ici, ὅτι relie la fidélité de Dieu à l’affirmation qui suit. La syntaxe française « Aussi vrai que…, … » en exprime clairement le rapport tout en évitant un calque maladroit.
- source_word: λόγος
  choice: message
  rationale: Dans ce contexte, λόγος désigne ce que Paul et ses collaborateurs communiquent aux Corinthiens. « Message » est plus idiomatique que « parole », sans exclure cette autre traduction possible.
- source_word: ἡμῶν
  choice: nous vous adressons
  rationale: La première personne du pluriel est conservée dans la proposition relative française, qui exprime naturellement le rapport possessif et la destination du λόγος.
- source_word: ὁ πρὸς ὑμᾶς
  choice: que nous vous adressons
  rationale: Cette formulation rend explicitement et naturellement l’idée d’une communication dirigée vers les destinataires.
- source_word: οὐκ ἔστιν
  choice: n’est pas
  rationale: Le présent français correspond au présent grec et maintient la portée actuelle de l’affirmation.
- source_word: Ναὶ καὶ Οὔ
  choice: « oui et non »
  rationale: Les deux termes opposés sont conservés tels quels afin de préserver la formule frappante qui évoque l’inconstance ou la contradiction.
theological_decisions:
- issue: Valeur de la construction solennelle πιστὸς δὲ ὁ θεὸς ὅτι
  choice: « Aussi vrai que Dieu est fidèle »
  alternative: '« Mais Dieu est fidèle : notre parole… » ou « Dieu est fidèle, car… »'
  rationale: Cette formulation fait de la fidélité de Dieu le fondement solennel de la véracité de l’affirmation de Paul, sans transformer explicitement ὅτι en lien causal ni imposer une opposition forte.
translation_notes:
  register: Français international moderne, clair et digne. La tournure « Aussi vrai que » restitue la force d’une affirmation solennelle; les guillemets mettent en relief la formule contrastée « oui et non ».
