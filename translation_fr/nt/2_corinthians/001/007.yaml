  text: καὶ ἡ ἐλπὶς ἡμῶν βεβαία ὑπὲρ ⸀ὑμῶν· εἰδότες ὅτι ⸀ὡς κοινωνοί ἐστε τῶν παθημάτων, οὕτως καὶ τῆς παρακλήσεως.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/007.yaml
  text: And our hope for you is firm[a], because we know that just as you share in the sufferings, so also you share in the comfort.
translation:
  language: fr
  text: Et notre espérance à votre égard est ferme, car nous savons que, tout comme vous avez part aux souffrances, vous avez aussi part à la consolation[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « encouragement ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλπίς
  choice: espérance
  rationale: « Espérance » est le terme français habituel dans ce contexte et conserve à la fois l’attente et la confiance exprimées par le grec.
- source_word: βεβαία
  choice: ferme
  rationale: « Ferme » rend naturellement le caractère assuré et stable de l’espérance de Paul.
- source_word: ὑπὲρ ὑμῶν
  choice: à votre égard
  rationale: Ici, ὑπέρ avec le génitif indique la personne concernée. « À votre égard » exprime clairement ce rapport sans suggérer principalement une action accomplie en leur faveur.
- source_word: εἰδότες
  choice: car nous savons
  rationale: Le participe donne le fondement de l’affirmation précédente ; la tournure causale explicite naturellement ce lien en français.
- source_word: ὡς ... οὕτως καί
  choice: tout comme ... aussi
  rationale: Cette formulation conserve la corrélation entre la participation aux souffrances et la participation à la consolation.
- source_word: κοινωνοί
  choice: avez part à
  rationale: Le nom grec exprime la participation. La locution verbale française est naturelle et peut être reprise dans le second membre elliptique.
- source_word: παθημάτων
  choice: souffrances
  rationale: « Souffrances » est un équivalent large et direct, bien adapté au contexte immédiat.
- source_word: παρακλήσεως
  choice: consolation
  rationale: Dans le contexte de 2 Corinthiens 1, « consolation » rend bien le secours reçu au sein de la souffrance et permet de maintenir la répétition thématique de παράκλησις.
- source_word: '[second membre elliptique]'
  choice: vous avez aussi part à
  rationale: Le grec ne répète pas explicitement le prédicat dans le second membre. Sa reprise en français clarifie la phrase sans ajouter de contenu.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La structure corrélative du grec est conservée, tandis que le participe causal et l’ellipse finale sont explicités pour produire une phrase naturelle.
