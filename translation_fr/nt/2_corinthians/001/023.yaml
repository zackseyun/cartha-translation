source:
  edition: SBLGNT
  text: Ἐγὼ δὲ μάρτυρα τὸν θεὸν ἐπικαλοῦμαι ἐπὶ τὴν ἐμὴν ψυχήν, ὅτι φειδόμενος ὑμῶν οὐκέτι ἦλθον εἰς Κόρινθον.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/023.yaml
  text: But I call God as witness upon my own life[b][a], that to spare you I did not come again to Corinth.
translation:
  language: fr
  text: 'Quant à moi, je prends Dieu à témoin sur ma propre vie[a] : c’est pour vous épargner que je ne suis pas retourné[b] à Corinthe.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « sur ma propre âme » ; on peut aussi comprendre : « contre moi-même ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « je ne suis plus venu ».'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐγὼ δὲ
  choice: Quant à moi
  rationale: Rend à la fois le léger contraste de δέ et l’insistance portée par le pronom explicite ἐγώ, dans un français naturel.
- source_word: μάρτυρα τὸν θεὸν ἐπικαλοῦμαι
  choice: j’en appelle à Dieu comme témoin
  rationale: Conserve le caractère solennel et quasi judiciaire de l’appel à Dieu pour attester la véracité des paroles de Paul.
- source_word: ἐπὶ τὴν ἐμὴν ψυχήν
  choice: sur ma propre vie
  rationale: Préserve l’image de l’expression grecque et sa portée personnelle dans cette formule de serment, tout en employant « vie », plus immédiatement compréhensible aujourd’hui que « âme » dans ce contexte.
- source_word: ὅτι
  choice: ':'
  rationale: Les deux-points introduisent naturellement en français le contenu de l’attestation solennelle, fonction remplie ici par ὅτι.
- source_word: φειδόμενος ὑμῶν
  choice: c’est pour vous épargner
  rationale: 'Exprime clairement la valeur circonstancielle et motivante du participe : Paul s’est abstenu de venir afin de leur éviter une intervention pénible ou sévère.'
- source_word: οὐκέτι ἦλθον
  choice: je ne suis pas retourné
  rationale: Dans le contexte d’une nouvelle visite projetée, cette formulation française rend naturellement l’idée qu’il n’est pas venu de nouveau, sans imposer à οὐκέτι une nuance temporelle trop précise.
- source_word: εἰς Κόρινθον
  choice: à Corinthe
  rationale: Expression française normale du mouvement vers une ville.
theological_decisions:
- issue: Portée de la formule « ἐπὶ τὴν ἐμὴν ψυχήν »
  choice: Maintien de l’image « sur ma propre vie »
  alternative: « contre moi-même » ou « au péril de ma vie »
  rationale: La formulation retenue conserve la tension de l’appel solennel sans expliciter davantage que le grec la sanction encourue si Paul ment.
translation_notes:
  register: Français international moderne, digne et direct. La construction emphatique « c’est pour vous épargner que » met en relief le motif exprimé par le participe grec. Les notes conservent l’ambiguïté de la formule de serment et celle de οὐκέτι.
