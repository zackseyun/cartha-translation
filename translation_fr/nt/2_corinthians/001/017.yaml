  text: τοῦτο οὖν ⸀βουλόμενος μήτι ἄρα τῇ ἐλαφρίᾳ ἐχρησάμην; ἢ ἃ βουλεύομαι κατὰ σάρκα βουλεύομαι, ἵνα ᾖ παρ’ ἐμοὶ τὸ Ναὶ ναὶ καὶ τὸ Οὒ οὔ;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/017.yaml
  text: So when I intended this[a], was I acting lightly? Or do I plan what I plan according to the flesh, so that with me there should be both “Yes, yes” and “No[d][c][b], no”?
translation:
  language: fr
  text: En formant donc ce projet, ai-je fait preuve de légèreté[a] ? Ou bien, les projets que je forme, est-ce que je les forme selon la chair[b], de sorte qu’il y ait chez moi à la fois le « oui, oui » et le « non, non »[c] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « d’inconstance ».
    reason: lexical_alternative
  - marker: b
    text: '« Selon la chair » peut signifier ici : selon des critères purement humains ou d’une manière mondaine.'
    reason: lexical_alternative
  - marker: c
    text: Autrement dit, comme si le « oui » et le « non » pouvaient être affirmés en même temps.
    reason: cultural_note
lexical_decisions:
- source_word: βουλόμενος
  choice: en formant ce projet
  rationale: Le participe renvoie au projet de voyage évoqué dans le contexte. Cette formulation française exprime une intention délibérée sans imposer l’idée d’un plan arrêté.
- source_word: τῇ ἐλαφρίᾳ ἐχρησάμην
  choice: ai-je fait preuve de légèreté
  rationale: L’expression grecque décrit une conduite marquée par la légèreté ou l’instabilité. « Faire preuve de légèreté » est naturel en français et conserve la forme de la question rhétorique.
- source_word: ἃ βουλεύομαι ... βουλεύομαι
  choice: est-ce ... que je forme mes projets
  rationale: La répétition verbale grecque est partiellement condensée afin d’obtenir une phrase française fluide, tout en gardant l’accent sur la manière dont Paul établit ses projets.
- source_word: κατὰ σάρκα
  choice: selon la chair
  rationale: Cette traduction conserve le vocabulaire paulinien et l’ambiguïté de l’expression, plutôt que de la réduire dans le texte principal à « selon des critères purement humains » ou « d’une manière mondaine ».
- source_word: παρ’ ἐμοὶ
  choice: chez moi
  rationale: « Chez moi » exprime naturellement en français ce qui se trouverait dans la conduite ou la parole de Paul.
- source_word: τὸ Ναὶ ναὶ καὶ τὸ Οὒ οὔ
  choice: à la fois le « oui, oui » et le « non, non »
  rationale: La répétition de chaque réponse est conservée, ainsi que leur juxtaposition, pour rendre l’accusation implicite d’inconstance ou de discours contradictoire.
theological_decisions:
- issue: Sens de κατὰ σάρκα dans l’usage paulinien
  choice: selon la chair
  alternative: selon des critères purement humains ; d’une manière mondaine
  rationale: Le contexte suggère une manière de décider humaine, intéressée ou changeante, mais l’expression demeure théologiquement chargée et peut porter plusieurs nuances. La traduction formelle préserve cette tension, tandis que la note en éclaire le sens probable.
- issue: Portée de « oui, oui » et « non, non »
  choice: conserver les deux formules ensemble
  alternative: dire tantôt oui, tantôt non ; faire coexister le oui et le non
  rationale: Le grec peut évoquer une parole versatile ou contradictoire. La formulation retenue ne tranche pas entre ces nuances et maintient l’étrangeté rhétorique du texte.
translation_notes:
  register: Français international moderne, digne et accessible. La structure interrogative et le vocabulaire paulinien sont préservés, avec des notes limitées aux ambiguïtés lexicales et rhétoriques importantes.
