source:
  edition: SBLGNT
  text: Εὐλογητὸς ὁ θεὸς καὶ πατὴρ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, ὁ πατὴρ τῶν οἰκτιρμῶν καὶ θεὸς πάσης παρακλήσεως,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/003.yaml
  text: Blessed be the God and Father of our Lord Jesus the Messiah[a], the Father of mercies and God of all comfort[d][c][b],
translation:
  language: fr
  text: Béni soit Dieu, le Père de notre Seigneur[b] Jésus le Messie[a], le Père des compassions[c] et le Dieu de toute consolation[d] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Jésus-Christ ».
    reason: alternative_reading
  - marker: b
    text: Ou « Maître ».
    reason: lexical_alternative
  - marker: c
    text: Ou « actes de compassion » ou « miséricordes ».
    reason: lexical_alternative
  - marker: d
    text: Ou « réconfort » ou « encouragement ».
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐλογητὸς
  choice: Béni soit
  rationale: La formule doxologique française naturelle restitue l’adjectif prédicatif grec et sa valeur déclarative.
- source_word: ὁ θεὸς καὶ πατὴρ
  choice: le Dieu et Père
  rationale: L’article grec porte sur les deux noms coordonnés, qui désignent un même référent; cette formulation conserve leur lien étroit.
- source_word: κυρίου
  choice: Seigneur
  rationale: « Seigneur » est l’équivalent usuel de κύριος dans cet emploi christologique, tout en laissant « Maître » comme possibilité lexicale.
- source_word: Χριστοῦ
  choice: le Messie
  rationale: Χριστός garde ici sa valeur de titre; en français idiomatique, « Jésus le Messie » rend explicitement ce sens plutôt que de traiter « Christ » comme un simple nom propre.
- source_word: οἰκτιρμῶν
  choice: compassions
  rationale: Le pluriel grec est conservé afin d’évoquer la plénitude et les multiples manifestations de la compassion divine, malgré le caractère soutenu de l’expression française.
- source_word: πάσης παρακλήσεως
  choice: toute consolation
  rationale: « Consolation » convient au contexte des détresses et préserve la portée globale de πάσης; le mot grec peut également exprimer le réconfort ou l’encouragement.
theological_decisions:
- issue: Valeur de Χριστός dans Ἰησοῦ Χριστοῦ
  choice: Jésus le Messie
  alternative: Jésus-Christ
  rationale: La traduction principale rend le titre grec de manière transparente, tandis que la note signale la forme française traditionnelle sans imposer que Χριστός soit ici un simple élément de nom.
- issue: Relation exprimée par « le Dieu et Père de notre Seigneur Jésus le Messie »
  choice: Conserver la coordination « Dieu et Père »
  alternative: Dieu, le Père de notre Seigneur Jésus le Messie
  rationale: La coordination grecque est maintenue sans expliciter davantage la relation, afin de ne pas atténuer ni résoudre la formulation théologique du texte.
translation_notes:
  register: Français international moderne, de registre digne et doxologique. « Père des compassions » est volontairement plus soutenu que la langue courante afin de préserver le génitif et le pluriel grecs. Le point d’exclamation rend naturellement la force de la bénédiction, bien que la ponctuation ne fasse pas partie du texte grec ancien.
