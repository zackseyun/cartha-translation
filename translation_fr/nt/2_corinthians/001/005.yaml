reference: 2 Corinthians 1:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὅτι καθὼς περισσεύει τὰ παθήματα τοῦ Χριστοῦ εἰς ἡμᾶς, οὕτως διὰ τοῦ Χριστοῦ περισσεύει καὶ ἡ παράκλησις ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/005.yaml
  text: For just as the sufferings of Christ overflow to us[b][a], so also through Christ our comfort overflows.
translation:
  language: fr
  text: Car, de même que les souffrances du Christ[a][b] abondent en nous, ainsi, par le Christ, notre réconfort abonde aussi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les souffrances pour le Christ ». Le grec peut désigner des souffrances qui appartiennent au Christ ou qui sont endurées à cause de lui.'
    reason: alternative_reading
  - marker: b
    text: Le terme « Christ » peut aussi être rendu par « Messie » lorsque son sens de titre est mis en avant.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Car
  rationale: Introduit l’explication de l’affirmation précédente tout en conservant la valeur causale du grec.
- source_word: καθὼς ... οὕτως
  choice: de même que ... de même aussi
  rationale: Reproduit clairement la structure comparative corrélative du grec dans un français naturel.
- source_word: περισσεύει
  choice: déborde
  rationale: Conserve l’image d’une abondance qui dépasse la mesure; la répétition du même verbe dans les deux membres maintient le parallélisme grec.
- source_word: τὰ παθήματα
  choice: les souffrances
  rationale: Équivalent direct, courant et digne, adapté au contexte des épreuves vécues par Paul et ses compagnons.
- source_word: τοῦ Χριστοῦ
  choice: du Christ
  rationale: Maintient le génitif grec sans en trancher toutes les nuances possibles; « Christ » convient ici à l’usage paulinien proche d’un nom propre.
- source_word: εἰς ἡμᾶς
  choice: jusqu’à nous
  rationale: Exprime naturellement la direction et l’extension des souffrances vers Paul et ses compagnons, tout en s’accordant avec l’image du débordement.
- source_word: διὰ τοῦ Χριστοῦ
  choice: par le Christ
  rationale: Rend διά avec le génitif comme médiation ou moyen, sans alourdir la phrase.
- source_word: ἡ παράκλησις ἡμῶν
  choice: notre réconfort
  rationale: « Réconfort » exprime ici le soutien et la consolation reçus au milieu de la souffrance; le possessif conserve la formulation concise du grec.
theological_decisions:
- issue: Sens de « les souffrances du Christ »
  choice: Conserver « du Christ », qui peut évoquer des souffrances liées au Christ et partagées en communion avec lui.
  alternative: « les souffrances endurées pour le Christ » ou les souffrances mêmes du Christ qui atteignent les siens
  rationale: Le génitif τοῦ Χριστοῦ permet plusieurs relations sémantiques. Le texte principal garde cette tension, et une note signale explicitement l’interprétation causale possible.
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme et la répétition de « déborde » reproduisent la forme rhétorique du grec. Les marqueurs [a] et [b] suivent immédiatement l’expression ambiguë concernée.
