  to: Car, de même que les souffrances du Christ[a][b] abondent en nous, ainsi, par le Christ, notre réconfort abonde aussi.
  rationale: La révision remplace l’image peu naturelle de souffrances qui « débordent jusqu’à nous » par « abondent en nous », qui rend plus directement l’expression grecque dans son contexte et maintient la répétition de περισσεύει. La corrélation est légèrement lissée pour un français moderne naturel. Les deux notes, leurs ancres et l’ambiguïté sémantique de « souffrances du Christ » sont conservées.
