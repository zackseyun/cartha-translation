  text: χάρις ὑμῖν καὶ εἰρήνη ἀπὸ θεοῦ πατρὸς ἡμῶν καὶ κυρίου Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/002.yaml
  text: Grace to you and peace from God our Father and the Lord Jesus the Messiah[a][b].
translation:
  language: fr
  text: Que la grâce et la paix vous soient données de la part de Dieu notre Père et du Seigneur[b] Jésus, le Messie[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, selon la formulation traditionnelle : « Jésus-Christ ».'
    reason: lexical_alternative
  - marker: b
    text: Dans certains contextes, « Seigneur » peut aussi se traduire par « Maître ».
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις
  choice: grâce
  rationale: « Grâce » conserve à la fois la forme de la salutation paulinienne et sa portée théologique.
- source_word: ὑμῖν
  choice: vous soient données
  rationale: Le datif signifie littéralement « à vous » ; la tournure optative française rend naturellement la bénédiction implicite de cette phrase nominale grecque.
- source_word: εἰρήνη
  choice: paix
  rationale: « Paix » est l’équivalent établi qui préserve les résonances bibliques du terme.
- source_word: ἀπὸ
  choice: de la part de
  rationale: La préposition indique ici la source ; « de la part de » est idiomatique dans une salutation tout en gardant ce rapport d’origine.
- source_word: θεοῦ πατρὸς ἡμῶν
  choice: Dieu notre Père
  rationale: Cette formulation compacte rend naturellement en français la relation appositionnelle du groupe grec.
- source_word: κυρίου
  choice: Seigneur
  rationale: « Seigneur » est le titre français normal de Jésus dans ce registre christologique ; il convient mieux ici que « Maître ».
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jésus, le Messie
  rationale: Χριστός garde ici sa valeur de titre ; « le Messie » en explicite le sens en français moderne, tandis que la virgule clarifie l’apposition.
theological_decisions:
- issue: Valeur de Χριστοῦ dans la salutation paulinienne
  choice: le Messie
  alternative: Christ
  rationale: La traduction du titre préserve son contenu messianique au lieu de le laisser sous une forme devenue proche d’un nom propre ; la variante traditionnelle est signalée en note.
- issue: Portée christologique de κυρίου
  choice: Seigneur
  alternative: Maître
  rationale: Dans cette formule de bénédiction où Jésus est associé à Dieu notre Père comme source de la grâce et de la paix, « Seigneur » respecte le titre néotestamentaire sans expliciter davantage la relation théologique.
translation_notes:
  register: Français international actuel, digne et accessible. La phrase nominale grecque est rendue par la formule française naturelle « Que… vous soient données ». « De la part de » maintient explicitement l’idée de source portée par ἀπό.
