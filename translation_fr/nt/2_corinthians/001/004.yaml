id: 2CO.1.4
reference: 2 Corinthians 1:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ παρακαλῶν ἡμᾶς ἐπὶ πάσῃ τῇ θλίψει ἡμῶν, εἰς τὸ δύνασθαι ἡμᾶς παρακαλεῖν τοὺς ἐν πάσῃ θλίψει διὰ τῆς παρακλήσεως ἧς παρακαλούμεθα αὐτοὶ ὑπὸ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/004.yaml
  text: who comforts us in all our affliction[a], so that we may be able to comfort those in any affliction through the comfort with which we ourselves are comforted by God.
translation:
  language: fr
  text: Il nous réconforte dans toutes nos détresses[a], afin que nous puissions réconforter ceux qui traversent quelque détresse que ce soit, par le réconfort que nous recevons nous-mêmes de Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « encourage […] encouragement »; le grec emploie la même famille de mots tout au long du verset.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ παρακαλῶν
  choice: Il nous réconforte
  rationale: Dans le contexte de la détresse, « réconforter » exprime une consolation qui soutient et fortifie. Le présent rend l’action caractéristique de Dieu.
- source_word: ἐπὶ πάσῃ τῇ θλίψει ἡμῶν
  choice: dans toutes nos détresses
  rationale: « Détresse » rend la pression et la souffrance évoquées par θλῖψις. Le pluriel français est naturel et πάσῃ garde sa portée globale.
- source_word: εἰς τὸ δύνασθαι ἡμᾶς
  choice: afin que nous puissions
  rationale: Cette formulation naturelle conserve la valeur de but, sans exclure la nuance de résultat de la construction grecque.
- source_word: παρακαλεῖν
  choice: réconforter
  rationale: Le même choix lexical maintient la répétition intentionnelle de la famille παρακαλέω / παράκλησις.
- source_word: τοὺς ἐν πάσῃ θλίψει
  choice: ceux qui traversent quelque détresse que ce soit
  rationale: 'La tournure exprime naturellement en français la portée distributive : toute personne se trouvant dans n’importe quelle forme de détresse.'
- source_word: διὰ τῆς παρακλήσεως
  choice: par le réconfort
  rationale: « Par » conserve la valeur instrumentale de διά, et « réconfort » maintient le lien avec le verbe répété.
- source_word: ἧς παρακαλούμεθα αὐτοὶ
  choice: que nous recevons nous-mêmes
  rationale: Le français idiomatique exprime ici le passif par « recevoir du réconfort »; « nous-mêmes » préserve l’emphase de αὐτοί.
- source_word: ὑπὸ τοῦ θεοῦ
  choice: de Dieu
  rationale: Avec « recevons », « de Dieu » indique naturellement Dieu comme source et agent du réconfort; une traduction passive permettrait « par Dieu ».
theological_decisions:
- issue: Étendue sémantique de παρακαλέω / παράκλησις
  choice: réconforter / réconfort
  alternative: encourager / encouragement; consoler / consolation
  rationale: Le contexte de θλῖψις favorise la consolation qui soutient. « Réconfort » garde la chaleur pastorale et permet de reproduire la même famille lexicale dans tout le verset, sans réduire l’action à un apaisement purement émotionnel.
- issue: Valeur de εἰς τό avec l’infinitif
  choice: afin que
  alternative: de sorte que
  rationale: La construction peut mêler but et résultat. « Afin que » rend clairement l’orientation de l’action divine, sans imposer une distinction théologique absente du texte.
translation_notes:
  register: Français international moderne, naturel et digne. « Traversent » évite la tournure statique peu idiomatique « dans une détresse », tandis que la répétition « réconforte / réconforter / réconfort » préserve l’effet rhétorique grec.
