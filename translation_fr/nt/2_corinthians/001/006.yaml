reference: 2 Corinthians 1:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἴτε δὲ θλιβόμεθα, ὑπὲρ τῆς ὑμῶν παρακλήσεως καὶ σωτηρίας· ⸂εἴτε παρακαλούμεθα, ὑπὲρ τῆς ὑμῶν παρακλήσεως⸃ τῆς ἐνεργουμένης ἐν ὑπομονῇ τῶν αὐτῶν παθημάτων ὧν καὶ ἡμεῖς πάσχομεν,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/006.yaml
  text: But if we are afflicted[a], it is for your comfort and salvation; or if we are comforted, it is for your comfort[b], which is at work in enduring the same sufferings that we also suffer.
translation:
  language: fr
  text: Si nous sommes affligés, c’est pour votre réconfort[b] et votre salut ; si nous sommes réconfortés, c’est pour votre réconfort[a], qui est à l’œuvre dans la persévérance avec laquelle vous endurez les mêmes souffrances que nous endurons nous aussi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Certains manuscrits omettent : « si nous sommes réconfortés, c’est pour votre réconfort ».'
    reason: textual_variant
  - marker: b
    text: Ou « encouragement » au lieu de « réconfort » dans tout ce verset.
    reason: lexical_alternative
lexical_decisions:
- source_word: θλιβόμεθα
  choice: nous sommes accablés
  rationale: Le présent passif exprime une pression ou une détresse subie de manière continue. « Accablés » est naturel en français et convient au contexte des souffrances.
- source_word: παρακλήσεως / παρακαλούμεθα
  choice: réconfort / sommes réconfortés
  rationale: Dans le contexte immédiat, cette famille de mots associe consolation et affermissement. La répétition de « réconfort » préserve la cohésion lexicale du passage.
- source_word: σωτηρίας
  choice: salut
  rationale: « Salut » rend directement σωτηρία et conserve sa portée salvatrice sans la réduire à une délivrance circonstancielle.
- source_word: τῆς ἐνεργουμένης
  choice: qui agit
  rationale: Cette formulation exprime l’efficacité opérante du réconfort tout en restant claire et actuelle.
- source_word: ἐν ὑπομονῇ
  choice: lorsque vous supportez avec persévérance
  rationale: Cette tournure naturelle rend l’idée d’une endurance ferme au sein des souffrances, sans figer la relation syntaxique dans une expression abstraite.
- source_word: τῶν αὐτῶν παθημάτων
  choice: les mêmes souffrances
  rationale: « Souffrances » rend directement les épreuves subies en commun par Paul et les Corinthiens.
- source_word: ὑπὲρ
  choice: pour
  rationale: Dans les deux propositions, la préposition indique le bénéfice destiné aux Corinthiens ; « pour » est concis et idiomatique.
theological_decisions:
- issue: Portée de σωτηρία
  choice: salut
  alternative: délivrance
  rationale: Le terme grec peut parfois désigner une délivrance concrète, mais ici « salut » préserve sa portée plus large sans exclure l’aide de Dieu au milieu de l’épreuve.
- issue: Rapport entre le réconfort et la persévérance
  choice: le réconfort agit lorsque les destinataires supportent les souffrances avec persévérance
  alternative: le réconfort produit directement la persévérance
  rationale: La formulation conserve la relation ouverte exprimée par ἐν ὑπομονῇ et évite d’imposer un lien causal plus précis que le grec.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « réconfort » reproduit la cohésion du vocabulaire grec ; « avec persévérance » explicite la force de ὑπομονή sans introduire une lecture confessionnelle.
