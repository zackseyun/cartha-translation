id: 2CO.1.13
reference: 2 Corinthians 1:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὐ γὰρ ἄλλα γράφομεν ὑμῖν ἀλλ’ ἢ ἃ ἀναγινώσκετε ἢ καὶ ἐπιγινώσκετε, ἐλπίζω δὲ ⸀ὅτι ἕως τέλους ἐπιγνώσεσθε,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/013.yaml
  text: For we are not writing anything else to you except what you read and indeed understand[a], and I hope that you will understand fully to the end,
translation:
  language: fr
  text: En effet, nous ne vous écrivons rien d’autre que ce que vous lisez et même comprenez. Et j’espère que vous comprendrez jusqu’à la fin[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « pleinement » ; littéralement : « jusqu’à la fin ».'
    reason: L’expression ἕως τέλους peut désigner une continuité jusqu’au terme ou, selon le contexte, une compréhension complète.
lexical_decisions:
- source_word: ἄλλα
  choice: rien d’autre
  rationale: Après la négation du verbe « écrire », cette tournure française naturelle exprime qu’il n’existe aucun autre contenu ni message caché.
- source_word: ἀναγινώσκετε
  choice: vous lisez
  rationale: Le présent simple rend naturellement l’action de lire la lettre, sans imposer une valeur progressive absente du contexte.
- source_word: ἐπιγινώσκετε
  choice: comprenez
  rationale: Dans ce contexte, le verbe désigne vraisemblablement la saisie du sens de ce qui est lu. « Comprenez » est plus naturel ici que « reconnaissez », tout en maintenant le rapport avec la lecture.
- source_word: ἐπιγνώσεσθε
  choice: vous comprendrez
  rationale: La reprise du même verbe grec est conservée en français afin de relier la compréhension actuelle des destinataires à l’espérance exprimée pour l’avenir.
- source_word: ἕως τέλους
  choice: jusqu’à la fin
  rationale: Cette traduction conserve directement la valeur temporelle ou persévérante de l’expression grecque sans la réduire silencieusement à la seule idée de plénitude.
- source_word: οὐ γὰρ … ἀλλ’ ἢ
  choice: En effet, nous ne … rien d’autre que
  rationale: Cette construction française idiomatique garde la négation et l’exclusivité de la structure grecque.
- source_word: ἢ καὶ
  choice: et même
  rationale: Dans l’enchaînement de la phrase, la particule peut renforcer le second verbe. « Et même » exprime cette progression de la lecture vers la compréhension sans alourdir la formulation.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La répétition de « comprendre » reflète celle du verbe grec, tandis que la note maintient l’ambiguïté entre durée jusqu’au terme et plénitude.
