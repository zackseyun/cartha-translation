  text: οὐχ ὅτι κυριεύομεν ὑμῶν τῆς πίστεως, ἀλλὰ συνεργοί ἐσμεν τῆς χαρᾶς ὑμῶν, τῇ γὰρ πίστει ἑστήκατε.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/024.yaml
  text: Not that we lord it over your faith[a], but we are fellow workers for your joy[c][b], for you stand firm by faith.
translation:
  language: fr
  text: Non que nous exercions notre autorité sur votre foi[a], mais nous sommes des collaborateurs pour votre joie[b], car c’est par la foi que vous tenez fermes[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « votre confiance ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « nous sommes collaborateurs de votre joie » ; ou « nous travaillons à votre joie ».
    reason: lexical_alternative
  - marker: c
    text: Ou « vous tenez fermes dans la foi ».
    reason: alternative_reading
lexical_decisions:
- source_word: κυριεύομεν
  choice: dominer sur
  rationale: Le verbe exprime l’exercice d’une autorité souveraine ou dominatrice. Dans cette négation, « dominer sur » est naturel en français et conserve la force critique du grec.
- source_word: ὑμῶν τῆς πίστεως
  choice: votre foi
  rationale: Le génitif se rend naturellement par « votre foi ». « Confiance » reste possible, mais « foi » convient au contexte et maintient la cohérence lexicale.
- source_word: συνεργοί
  choice: nous travaillons avec vous
  rationale: Cette formulation rend l’idée de collaboration et fait ressortir le contraste avec une autorité exercée sur les destinataires. Le complément implicite « avec vous » est une interprétation contextuelle plausible de συνεργοί.
- source_word: τῆς χαρᾶς ὑμῶν
  choice: à votre joie
  rationale: Le génitif peut indiquer ici ce à quoi contribue le travail commun. « À votre joie » est idiomatique et garde une certaine proximité avec la construction grecque.
- source_word: τῇ γὰρ πίστει
  choice: car c’est par la foi
  rationale: Le datif est compris comme exprimant le moyen ou le fondement. La tournure clivée donne en français une valeur naturelle à l’explication introduite par γάρ.
- source_word: ἑστήκατε
  choice: vous tenez ferme
  rationale: Le parfait décrit un état établi qui se prolonge. « Tenez ferme » rend cette stabilité plus clairement que le simple « êtes debout ».
theological_decisions:
- issue: Sens de πίστις dans ses deux occurrences
  choice: foi
  alternative: confiance
  rationale: Le contexte désigne la relation croyante des Corinthiens. « Foi » préserve le terme théologique ordinaire sans exclure sa dimension de confiance.
- issue: Référent de συνεργοί
  choice: nous travaillons avec vous à votre joie
  alternative: nous sommes collaborateurs de votre joie
  rationale: Le grec dit littéralement « collaborateurs de votre joie » sans préciser explicitement avec qui Paul collabore. Le texte principal adopte le sens contextuel naturel d’un travail aux côtés des Corinthiens, tandis que la note conserve la formulation plus proche de la structure grecque.
- issue: Valeur du datif τῇ πίστει
  choice: par la foi
  alternative: dans la foi
  rationale: Le datif peut exprimer le moyen ou la sphère. Le texte principal retient le moyen ou le fondement, sans éliminer la lecture locative signalée en note.
translation_notes:
  register: Français moderne, international et digne. Le contraste entre domination et collaboration est formulé clairement, tandis que les ambiguïtés du génitif avec συνεργοί et du datif τῇ πίστει sont conservées dans les notes.
