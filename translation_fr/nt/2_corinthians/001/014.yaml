  text: καθὼς καὶ ἐπέγνωτε ἡμᾶς ἀπὸ μέρους, ὅτι καύχημα ὑμῶν ἐσμεν καθάπερ καὶ ὑμεῖς ἡμῶν ἐν τῇ ἡμέρᾳ τοῦ κυρίου ⸀ἡμῶν Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/014.yaml
  text: just as you also came to understand us in part[a], that we are your boast, just as you also are ours[b], in the day of our Lord Jesus.
translation:
  language: fr
  text: 'comme vous nous avez aussi reconnus en partie[a] : nous sommes votre sujet de fierté, tout comme vous êtes aussi le nôtre[b], au jour de notre Seigneur Jésus.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans une certaine mesure » ou « partiellement ».
    reason: lexical_alternative
  - marker: b
    text: Ou « sujet de gloire » ou « motif de fierté ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέγνωτε
  choice: vous l’avez compris
  rationale: Le verbe exprime ici une compréhension ou une reconnaissance réelle, sans imposer l’idée d’une compréhension complète.
- source_word: ἀπὸ μέρους
  choice: en partie
  rationale: Cette expression idiomatique indique une compréhension partielle, tout en laissant son degré indéterminé.
- source_word: καύχημα
  choice: sujet de fierté
  rationale: Cette formulation française naturelle conserve l’idée paulinienne d’une fierté dont une personne est le motif, sans suggérer une vantardise mesquine.
- source_word: καθάπερ
  choice: tout comme
  rationale: Ce choix marque clairement la réciprocité entre Paul et les Corinthiens.
- source_word: ἡμέρᾳ τοῦ κυρίου ἡμῶν Ἰησοῦ
  choice: au jour de notre Seigneur Jésus
  rationale: Cette traduction préserve l’expression eschatologique établie et le titre christologique « Seigneur ».
- source_word: καθὼς καὶ
  choice: comme… d’ailleurs
  rationale: Cette tournure rattache naturellement la proposition au contexte précédent et rend la valeur additive de καί.
theological_decisions:
- issue: Le langage réciproque de καύχημα
  choice: nous sommes votre sujet de fierté, tout comme vous êtes aussi le nôtre
  alternative: nous sommes votre raison de vous glorifier, comme vous êtes la nôtre
  rationale: Le texte décrit une fierté ou une gloire réciproque entre l’apôtre et l’Église dans la perspective du jour du Seigneur. « Sujet de fierté » préserve cette réciprocité sans transformer le propos en exaltation personnelle.
translation_notes:
  register: Français international moderne, digne et accessible. Le deux-points explicite naturellement en français le contenu de ce que les Corinthiens ont compris, sans modifier la relation logique du grec. La répétition réciproque est maintenue.
