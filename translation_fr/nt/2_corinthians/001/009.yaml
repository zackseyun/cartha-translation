revisions:
- from: Mais nous avions nous-mêmes, au-dedans de nous, reçu la sentence de mort[a], afin que nous ne mettions pas notre confiance en nous-mêmes, mais en Dieu, qui ressuscite les morts.
  to: Mais nous-mêmes, nous avions en nous la sentence de mort[a], afin que nous ne mettions pas notre confiance en nous-mêmes, mais en Dieu, qui ressuscite les morts.
  rationale: La révision retire l’ajout interprétatif « reçu » et simplifie l’expression de l’intériorité, tout en préservant l’emphase de αὐτοὶ, l’ambiguïté de ἀπόκριμα τοῦ θανάτου, la finalité introduite par ἵνα et l’identification de Dieu comme celui qui relève les morts.
