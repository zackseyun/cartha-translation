review_pass:
  verdict: revise
  source_fidelity: Le grec dit littéralement que Paul et ses compagnons « avaient en eux-mêmes la sentence de mort ». Le parfait ἐσχήκαμεν exprime un état acquis, mais ne dit pas explicitement qu’ils l’avaient « reçue » ; cette nuance est donc retirée. La finalité et le contraste entre la confiance en soi et en Dieu sont conservés.
  naturalness: « Mais nous-mêmes, nous avions en nous la sentence de mort » est une formulation française sobre, intelligible et plus directe que « au-dedans de nous, reçu ». « Afin que nous ne mettions pas notre confiance » est naturel dans ce registre et respecte la construction finale.
  terminology: « Sentence de mort » rend de façon appropriée ἀπόκριμα τοῦ θανάτου sans prétendre identifier une condamnation judiciaire humaine. « Ressuscite les morts » rend fidèlement τῷ ἐγείροντι τοὺς νεκρούς et demeure usuel dans un registre biblique moderne.
  issues:
  - severity: medium
    issue: Ajout de « reçu »
    rationale: ἐσχήκαμεν signifie « nous avions / nous avons eu » et n’explicite pas l’idée de réception. « Avions reçu » est possible comme inférence contextuelle, mais ajoute une nuance non exprimée par le grec.
  - severity: low
    issue: « au-dedans de nous »
    rationale: Cette expression est compréhensible, mais elle est plus lourde et moins idiomatique ici que « en nous », qui rend suffisamment ἐν ἑαυτοῖς.
  revised_text: Mais nous-mêmes, nous avions en nous la sentence de mort[a], afin que nous ne mettions pas notre confiance en nous-mêmes, mais en Dieu, qui ressuscite les morts.
  revised_footnotes:
