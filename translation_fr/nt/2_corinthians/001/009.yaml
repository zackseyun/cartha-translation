reference: 2 Corinthians 1:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀλλὰ αὐτοὶ ἐν ἑαυτοῖς τὸ ἀπόκριμα τοῦ θανάτου ἐσχήκαμεν, ἵνα μὴ πεποιθότες ὦμεν ἐφ’ ἑαυτοῖς ἀλλ’ ἐπὶ τῷ θεῷ τῷ ἐγείροντι τοὺς νεκρούς·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/009.yaml
  text: Indeed[a], we ourselves had the sentence of death within ourselves, so that we would not rely on ourselves but on God, who raises the dead.
translation:
  language: fr
  text: Mais nous-mêmes, nous avions en nous la sentence de mort[a], afin que nous ne mettions pas notre confiance en nous-mêmes, mais en Dieu, qui ressuscite les morts.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le verdict de mort ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Mais
  rationale: La conjonction marque ici un contraste fort avec ce qui précède. « Mais » le rend directement et naturellement en français.
- source_word: αὐτοὶ
  choice: nous-mêmes
  rationale: Le pronom est emphatique ; « nous-mêmes » conserve cette insistance.
- source_word: ἐν ἑαυτοῖς
  choice: au-dedans de nous
  rationale: Cette formulation exprime l'intériorité de l'expérience tout en restant intelligible en français courant.
- source_word: τὸ ἀπόκριμα τοῦ θανάτου
  choice: la sentence de mort
  rationale: Dans ce contexte, ἀπόκριμα désigne vraisemblablement une décision ou une issue arrêtée. « Sentence de mort » conserve la coloration judiciaire sans affirmer qu'une condamnation humaine officielle avait été prononcée.
- source_word: ἐσχήκαμεν
  choice: avions reçu
  rationale: Le parfait décrit un état acquis et durable à la suite de l'épreuve. En français, « avions reçu » exprime naturellement ce résultat, sans développer davantage la manière dont cette conviction s'est imposée.
- source_word: ἵνα μὴ πεποιθότες ὦμεν
  choice: afin que nous ne mettions pas notre confiance
  rationale: « Afin que » rend la finalité, tandis que « mettre sa confiance » exprime la confiance établie portée par πεποιθότες.
- source_word: ἐφ’ ἑαυτοῖς ἀλλ’ ἐπὶ τῷ θεῷ
  choice: en nous-mêmes, mais en Dieu
  rationale: La répétition de « en » préserve nettement le contraste entre confiance en soi et confiance en Dieu.
- source_word: τῷ ἐγείροντι τοὺς νεκρούς
  choice: qui ressuscite les morts
  rationale: « Ressuscite » exprime précisément l'action de relever d'entre les morts ; « les morts » conserve la formulation collective et la résonance eschatologique du grec.
theological_decisions:
- issue: Portée de τοὺς νεκρούς
  choice: les morts
  alternative: les personnes mortes
  rationale: « Les morts » est exact, naturel et conserve la portée générale de la puissance de résurrection de Dieu sans ajout interprétatif.
- issue: Valeur de ἵνα dans le rapport entre l'épreuve et la confiance en Dieu
  choice: afin que
  alternative: de sorte que
  rationale: Le grec exprime une finalité, mais sans préciser explicitement si Dieu est l'agent direct de la sentence intérieure. La traduction conserve cette tension sans développer une doctrine de la causalité divine.
translation_notes:
  register: Français moderne, digne et accessible. La syntaxe conserve l'emphase de « nous-mêmes » et le contraste entre la confiance en soi et la confiance en Dieu. Le marqueur [a] figure immédiatement après l'expression concernée.
