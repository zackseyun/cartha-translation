id: 2CO.1.12
reference: 2 Corinthians 1:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἡ γὰρ καύχησις ἡμῶν αὕτη ἐστίν, τὸ μαρτύριον τῆς συνειδήσεως ἡμῶν, ὅτι ἐν ⸀ἁγιότητι καὶ εἰλικρινείᾳ ⸀τοῦ θεοῦ, ⸀οὐκ ἐν σοφίᾳ σαρκικῇ ἀλλ’ ἐν χάριτι θεοῦ, ἀνεστράφημεν ἐν τῷ κόσμῳ, περισσοτέρως δὲ πρὸς ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/012.yaml
  text: 'For this is our boast: the testimony of our conscience[a], that we conducted ourselves in the world in holiness and sincerity of God[c][b], not in fleshly wisdom but in the grace of God—and especially toward you.'
translation:
  language: fr
  text: 'Car c’est là notre sujet de fierté : le témoignage de notre conscience, à savoir que nous nous sommes conduits dans le monde avec sainteté[a] et avec une sincérité qui vient de Dieu[b], non pas avec une sagesse charnelle[c], mais avec la grâce de Dieu — et tout particulièrement envers vous.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Certains manuscrits portent « simplicité » au lieu de « sainteté ».
    reason: textual_variant
  - marker: b
    text: 'Ou : « avec une sincérité selon Dieu »; littéralement : « avec une sincérité de Dieu ».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « une sagesse humaine ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: καύχησις
  choice: sujet de fierté
  rationale: Cette expression rend la confiance positive exprimée par Paul sans suggérer nécessairement une vantardise condamnable.
- source_word: μαρτύριον τῆς συνειδήσεως
  choice: le témoignage de notre conscience
  rationale: La formulation conserve l’image d’une conscience qui atteste intérieurement la conduite des auteurs.
- source_word: ἁγιότητι
  choice: avec sainteté
  rationale: Ce choix traduit directement le texte du SBLGNT et maintient la portée morale et religieuse du terme.
- source_word: εἰλικρινείᾳ τοῦ θεοῦ
  choice: avec une sincérité qui vient de Dieu
  rationale: La formulation française naturelle comprend le génitif comme indiquant la source, tout en signalant en note l’autre analyse possible.
- source_word: σοφίᾳ σαρκικῇ
  choice: selon une sagesse charnelle
  rationale: « Charnelle » maintient le lien lexical avec le vocabulaire paulinien de la chair, plutôt que de l’aplanir en « humaine » ou « mondaine ».
- source_word: χάριτι θεοῦ
  choice: selon la grâce de Dieu
  rationale: Cette expression conserve le poids théologique de χάρις et forme un contraste français naturel avec la sagesse charnelle.
- source_word: ἀνεστράφημεν
  choice: nous nous sommes conduits
  rationale: Le verbe désigne ici la manière de vivre et d’agir; cette traduction est précise et digne.
- source_word: περισσοτέρως δὲ πρὸς ὑμᾶς
  choice: et tout particulièrement envers vous
  rationale: La formulation exprime la force comparative de περισσοτέρως et la relation visée par πρὸς ὑμᾶς.
theological_decisions:
- issue: Valeur de τοῦ θεοῦ dans εἰλικρινείᾳ τοῦ θεοῦ
  choice: une sincérité qui vient de Dieu
  alternative: une sincérité digne de Dieu / la sincérité de Dieu
  rationale: Le génitif peut marquer la source ou la qualité. Le texte principal retient une origine divine, lecture contextuellement naturelle, tandis que la note préserve l’ambiguïté.
- issue: Portée de σαρκικῇ
  choice: charnelle
  alternative: humaine
  rationale: « Charnelle » préserve la tension du vocabulaire paulinien et évite de réduire le contraste à une simple opposition entre sagesse humaine et divine.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe reste proche de l’argument grec sans être servile; « à savoir que » explicite l’apposition entre le sujet de fierté et le témoignage de la conscience. Tous les marqueurs de note figurent dans le texte.
