id: 2CO.1.21
reference: 2 Corinthians 1:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ δὲ βεβαιῶν ἡμᾶς σὺν ὑμῖν εἰς Χριστὸν καὶ χρίσας ἡμᾶς θεός,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/021.yaml
  text: But the one who establishes us with you in Messiah[a], and who anointed us, is God.
translation:
  language: fr
  text: Mais celui qui nous affermit avec vous dans le Messie[a] et qui nous a oints, c’est Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans le Christ ». Le titre grec est Christos, rendu ici par « Messie ».
    reason: alternative_reading
lexical_decisions:
- source_word: βεβαιῶν
  choice: affermit
  rationale: Le participe présent exprime l’action continue de rendre ferme ou stable. « Affermit » est naturel en français et conserve cette idée sans surinterprétation.
- source_word: σὺν ὑμῖν
  choice: avec vous
  rationale: La formule marque la participation commune de Paul et des Corinthiens; « avec vous » la restitue simplement.
- source_word: εἰς Χριστόν
  choice: dans le Messie
  rationale: Dans ce contexte paulinien, εἰς exprime vraisemblablement l’orientation relationnelle ou l’incorporation. « Dans » est idiomatique tout en laissant subsister la densité théologique de la formule.
- source_word: χρίσας
  choice: a donné l’onction
  rationale: Cette expression française conserve le lien lexical avec l’onction et l’écho au titre « Messie », sans réduire l’acte à un rite particulier.
- source_word: θεός
  choice: c’est Dieu
  rationale: La tournure détachée rend naturellement en français l’identification finale et emphatique du sujet placé à la fin en grec.
theological_decisions:
- issue: Valeur de εἰς dans εἰς Χριστόν
  choice: sens relationnel ou incorporatif rendu par « dans le Messie »
  alternative: « vers le Messie » ou, de façon plus littérale mais peu idiomatique, « en le Messie »
  rationale: Le grec peut conserver une nuance d’orientation vers le Messie, mais l’usage paulinien permet ici une relation d’union ou d’appartenance. « Dans » offre le meilleur équilibre sans détailler davantage cette relation.
- issue: Traduction du titre Χριστός
  choice: Messie
  alternative: Christ
  rationale: « Messie » fait entendre la valeur titulaire et l’arrière-plan de l’onction, particulièrement pertinent puisque χρίσας apparaît dans la même phrase. La note signale la forme traditionnelle « Christ ».
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve le contraste initial, la participation commune (« avec vous ») et l’emphase finale sur Dieu; la virgule avant « et » a été évitée selon l’usage français courant.
