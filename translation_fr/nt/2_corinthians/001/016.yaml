  text: καὶ δι’ ὑμῶν διελθεῖν εἰς Μακεδονίαν, καὶ πάλιν ἀπὸ Μακεδονίας ἐλθεῖν πρὸς ὑμᾶς καὶ ὑφ’ ὑμῶν προπεμφθῆναι εἰς τὴν Ἰουδαίαν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/016.yaml
  text: and through you to pass into Macedonia[a], and again from Macedonia to come to you and by you to be sent on to Judea.
translation:
  language: fr
  text: et passer chez vous en allant en Macédoine, puis revenir de Macédoine chez vous, et que vous m’aidiez à poursuivre mon voyage jusqu’en Judée.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « et être accompagné par vous jusqu’en Judée » ; litt. « être envoyé en avant par vous » (c’est-à-dire recevoir de l’aide pour le voyage).
    reason: lexical_alternative
lexical_decisions:
- source_word: δι’ ὑμῶν
  choice: passer chez vous
  rationale: Avec le génitif, διά décrit ici le passage par le lieu où se trouvent les Corinthiens. « Passer chez vous » rend naturellement l’itinéraire personnel envisagé par Paul.
- source_word: διελθεῖν εἰς Μακεδονίαν
  choice: pour aller en Macédoine
  rationale: διέρχομαι évoque un déplacement qui se poursuit à travers une étape. Cette formulation française associe naturellement le passage chez les Corinthiens à la destination suivante.
- source_word: πάλιν ἀπὸ Μακεδονίας ἐλθεῖν πρὸς ὑμᾶς
  choice: puis revenir de Macédoine chez vous
  rationale: πάλιν marque une nouvelle venue chez les Corinthiens après le séjour en Macédoine. « Revenir » explicite en français le mouvement de retour déjà impliqué par l’itinéraire, sans ajouter d’étape.
- source_word: ὑφ’ ὑμῶν προπεμφθῆναι
  choice: que vous m’aidiez à poursuivre mon voyage
  rationale: Dans le contexte d’un voyage, προπέμπω désigne le fait d’aider un voyageur à continuer sa route, éventuellement en lui fournissant accompagnement ou ressources. La tournure active est naturelle en français et conserve les Corinthiens comme agents.
- source_word: εἰς τὴν Ἰουδαίαν
  choice: vers la Judée
  rationale: « Vers » exprime clairement la destination du voyage et convient à la construction française « poursuivre mon voyage ».
theological_decisions: []
translation_notes:
  register: Français international moderne, fluide et digne. La phrase demeure un fragment syntaxiquement rattaché au verset précédent, comme dans le grec. Le vocabulaire de l’aide au voyage rend l’usage contextuel de προπέμπω sans préciser indûment la forme exacte du soutien.
