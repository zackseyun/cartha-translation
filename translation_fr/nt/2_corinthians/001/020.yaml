revisions:
- from: Car toutes les promesses de Dieu ont en lui leur « oui »[a]. C’est pourquoi aussi, par lui, l’« amen »[b] est adressé à Dieu pour sa gloire, par notre intermédiaire[c].
  to: Car toutes les promesses de Dieu ont en lui leur « oui »[a]. C’est pourquoi c’est aussi par lui que l’« Amen » est adressé à Dieu pour sa gloire, par notre intermédiaire[c].
  rationale: Révision limitée à la clarté syntaxique et à la convention typographique française. Elle ne résout pas davantage l’ellipse paulinienne ni l’ambiguïté de rattachement autour de « gloire », laquelle demeure signalée par la note.
  reviewer_model: gpt-5.6-terra
