source:
  edition: SBLGNT
  text: ὅσαι γὰρ ἐπαγγελίαι θεοῦ, ἐν αὐτῷ τὸ Ναί· ⸀διὸ καὶ ⸂δι’ αὐτοῦ⸃ τὸ Ἀμὴν τῷ θεῷ πρὸς δόξαν δι’ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/020.yaml
  text: For however many promises of God there are[a], in him is the Yes[c][b]. Therefore also through him is the Amen to God for glory through us.
translation:
  language: fr
  text: Car toutes les promesses de Dieu ont en lui leur « oui »[a]. C’est pourquoi c’est aussi par lui que l’« Amen » est adressé à Dieu pour sa gloire, par notre intermédiaire[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « Car, aussi nombreuses que soient les promesses de Dieu, en lui se trouve le “oui”. »'
    reason: La formulation grecque est elliptique; la traduction principale en rend le sens sans introduire l’expression plus interprétative « sont accomplies ».
  - marker: c
    text: 'On peut aussi comprendre : « à la gloire de Dieu, par notre intermédiaire ».'
    reason: La construction grecque est condensée et permet cette formulation plus étroitement rattachée à « Dieu ».
lexical_decisions:
- source_word: ὅσαι
  choice: toutes
  rationale: Dans cette construction, « toutes » exprime naturellement en français la totalité indéfinie des promesses visées, sans suggérer qu’on pourrait les dénombrer.
- source_word: ἐπαγγελίαι θεοῦ
  choice: les promesses de Dieu
  rationale: Formulation française usuelle qui présente ces promesses comme celles que Dieu a faites.
- source_word: ἐν αὐτῷ τὸ Ναί
  choice: ont en lui leur « oui »
  rationale: Conserve l’image rhétorique du « oui » et son ancrage en Christ, tout en rendant intelligible en français la proposition grecque elliptique.
- source_word: διὸ καὶ δι’ αὐτοῦ
  choice: C’est pourquoi aussi, par lui
  rationale: Marque l’inférence et maintient le rôle médiateur du Christ exprimé par διά avec le génitif.
- source_word: τὸ Ἀμὴν
  choice: l’« amen »
  rationale: Conserve le terme liturgique passé du grec au français et le parallélisme entre le « oui » et l’« amen ».
- source_word: τῷ θεῷ
  choice: est adressé à Dieu
  rationale: Explicite sobrement en français le destinataire indiqué par le datif, sans changer le contenu de l’affirmation.
- source_word: πρὸς δόξαν
  choice: pour sa gloire
  rationale: Exprime la finalité de manière naturelle; le possessif renvoie à Dieu dans le contexte immédiat.
- source_word: δι’ ἡμῶν
  choice: par notre intermédiaire
  rationale: Reproduit la médiation exprimée par διά sans ajouter la notion plus précise de ministère.
theological_decisions:
- issue: Faut-il expliciter l’accomplissement des promesses en Christ ?
  choice: Conserver l’image selon laquelle les promesses ont en lui leur « oui ».
  alternative: Traduire qu’en lui toutes les promesses sont accomplies.
  rationale: L’accomplissement est fortement impliqué, mais le grec emploie la formulation plus ramassée et rhétorique du « oui »; il convient de ne pas remplacer cette image par son interprétation.
- issue: Rapport de πρὸς δόξαν avec Dieu
  choice: « à Dieu pour sa gloire »
  alternative: « à la gloire de Dieu »
  rationale: Le texte permet d’entendre la gloire comme le but de l’« amen » adressé à Dieu; la formulation retenue reste concise tout en rendant ce lien naturel en français.
translation_notes:
  register: Français international moderne, digne et accessible. Les guillemets signalent que « oui » et « amen » sont employés comme des affirmations substantivées. La syntaxe reste proche de la densité rhétorique de Paul tout en évitant une tournure artificielle.
