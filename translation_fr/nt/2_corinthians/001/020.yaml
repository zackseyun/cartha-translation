review_pass:
  verdict: revise
  source_fidelity: La première proposition rend correctement la totalité des promesses de Dieu et conserve, de façon intelligible, l’image elliptique du « oui » en Christ. La seconde proposition représente bien les deux médiations exprimées par διά (« par lui », « par nous »). Toutefois, « C’est pourquoi aussi, par lui » place « aussi » dans une position française un peu ambiguë. Une syntaxe qui fait de « aussi par lui » le complément de l’amen reflète plus clairement διὸ καὶ δι’ αὐτοῦ. « Amen » prend normalement une majuscule en français dans cet emploi religieux.
  naturalness: Le français est globalement clair, digne et actuel. « ont en lui leur “oui” » est une explicitation sobre et naturelle de l’ellipse grecque. La reformulation proposée améliore l’enchaînement de la seconde phrase sans alourdir le verset.
  terminology: « promesses de Dieu », « oui » et « Amen » conviennent. La majuscule à « Amen » suit l’usage français habituel; les guillemets conservent le parallélisme rhétorique avec « oui ». « Pour sa gloire » est défendable, le référent le plus immédiat étant Dieu, tandis que la note maintient l’autre regroupement syntaxique possible.
  issues:
  - severity: low
    issue: Placement de « aussi » dans la seconde phrase
    rationale: Dans « C’est pourquoi aussi, par lui », l’adverbe peut sembler porter sur l’inférence plutôt que sur la médiation. « C’est pourquoi c’est aussi par lui que… » rend plus nettement διὸ καὶ δι’ αὐτοῦ.
  - severity: low
    issue: Capitalisation de « amen »
    rationale: En français biblique et liturgique moderne, « Amen » s’écrit normalement avec une majuscule lorsqu’il est employé comme affirmation substantivée.
  revised_text: Car toutes les promesses de Dieu ont en lui leur « oui »[a]. C’est pourquoi c’est aussi par lui que l’« Amen » est adressé à Dieu pour sa gloire, par notre intermédiaire[c].
