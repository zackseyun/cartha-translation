source:
  edition: SBLGNT
  text: ὁ ⸂τοῦ θεοῦ γὰρ⸃ υἱὸς ⸂Ἰησοῦς Χριστὸς⸃ ὁ ἐν ὑμῖν δι’ ἡμῶν κηρυχθείς, δι’ ἐμοῦ καὶ Σιλουανοῦ καὶ Τιμοθέου, οὐκ ἐγένετο Ναὶ καὶ Οὒ, ἀλλὰ Ναὶ ἐν αὐτῷ γέγονεν·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/019.yaml
  text: For the Son of God[a], Jesus the Messiah, who was proclaimed among you through us—through me and Silvanus and Timothy—did not become Yes and No; rather[d][c][b], in him it has become Yes.
translation:
  language: fr
  text: Car le Fils de Dieu, Jésus le Messie, qui a été proclamé parmi vous par notre intermédiaire — par moi, Silvain et Timothée — n’a pas été « oui » et « non » ; au contraire, en lui, il y a eu le « oui ».[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « n’a pas été “oui” et “non” ... mais, en lui, le “oui” s’est manifesté ». Le second verbe grec est au parfait et peut souligner un résultat durable.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ τοῦ θεοῦ υἱός
  choice: le Fils de Dieu
  rationale: Cette formulation française naturelle conserve la valeur titulaire et toute la portée christologique de l’expression grecque.
- source_word: Ἰησοῦς Χριστός
  choice: Jésus le Messie
  rationale: Χριστός désigne ici le Messie et se trouve en apposition à « le Fils de Dieu » ; l’article rend le titre idiomatique en français.
- source_word: κηρυχθείς
  choice: a été proclamé
  rationale: « Proclamé » garde la nuance d’annonce publique de κηρύσσω sans limiter le terme au cadre d’une prédication formelle.
- source_word: δι’ ἡμῶν
  choice: par notre intermédiaire
  rationale: Cette expression traduit l’idée d’agence ou d’instrumentalité portée par διά et prépare l’énumération des messagers.
- source_word: δι’ ἐμοῦ καὶ Σιλουανοῦ καὶ Τιμοθέου
  choice: par moi, Silvain et Timothée
  rationale: La tournure française reprend clairement Paul et ses deux collaborateurs comme agents de la proclamation, sans alourdir la phrase par une répétition mécanique.
- source_word: οὐκ ἐγένετο Ναὶ καὶ Οὔ
  choice: n’est pas devenu « oui » et « non »
  rationale: La traduction conserve le verbe γίνομαι et l’opposition rhétorique de Paul au lieu de l’expliquer par une paraphrase telle que « inconstant ».
- source_word: ἀλλὰ Ναὶ ἐν αὐτῷ γέγονεν
  choice: au contraire, en lui, il est devenu « oui »
  rationale: Le parfait γέγονεν est rendu par un passé composé à valeur résultative ; « en lui » et le langage énigmatique du « oui » sont maintenus sans explicitation doctrinale.
theological_decisions:
- issue: Valeur de Χριστός dans Ἰησοῦς Χριστός
  choice: Jésus le Messie
  alternative: Jésus-Christ
  rationale: L’apposition à « le Fils de Dieu » permet d’entendre Χριστός comme le titre messianique. « Jésus le Messie » rend ce titre transparent, tout en évitant d’introduire une interprétation confessionnelle supplémentaire.
- issue: Interprétation de l’opposition Ναί/Οὔ
  choice: « oui » et « non » ; en lui, il est devenu « oui »
  alternative: inconstant, mais parfaitement fiable
  rationale: Paul emploie une formulation théologiquement dense et quelque peu énigmatique. La traduction garde ses mots et leur tension plutôt que de les réduire à une explication sur la seule fiabilité.
- issue: Référent implicite dans γέγονεν
  choice: il est devenu « oui »
  alternative: le « oui » est devenu réalité en lui
  rationale: Le grec ne formule pas explicitement un sujet nominal dans la dernière proposition. Le pronom français maintient le lien possible avec le Fils de Dieu sans ajouter « réponse », « promesse » ou « réalité ».
translation_notes:
  register: Français international moderne, digne et lisible. Les guillemets signalent que « oui » et « non » sont employés comme des termes rhétoriques. Les tirets isolent l’explication de Paul tout en conservant le mouvement de la phrase grecque.
