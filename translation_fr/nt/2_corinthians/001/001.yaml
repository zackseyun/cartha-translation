source:
  edition: SBLGNT
  text: Παῦλος ἀπόστολος ⸂Χριστοῦ Ἰησοῦ⸃ διὰ θελήματος θεοῦ καὶ Τιμόθεος ὁ ἀδελφὸς τῇ ἐκκλησίᾳ τοῦ θεοῦ τῇ οὔσῃ ἐν Κορίνθῳ, σὺν τοῖς ἁγίοις πᾶσιν τοῖς οὖσιν ἐν ὅλῃ τῇ Ἀχαΐᾳ·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/001.yaml
  text: 'Paul[a], an apostle of Messiah Jesus by the will of God, and Timothy our brother, to the church of God that is in Corinth[b], together with all the saints who are in all Achaia:'
translation:
  language: fr
  text: 'Paul, apôtre de Jésus le Messie[a] par la volonté de Dieu, et Timothée, notre frère[b], à l’Église de Dieu qui est à Corinthe, avec tous les saints qui sont dans toute l’Achaïe :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « du Christ Jésus ».
    reason: alternative_reading
  - marker: b
    text: 'Littéralement : « le frère ».'
    reason: translation_clarity
lexical_decisions:
- source_word: ἀπόστολος
  choice: apôtre
  rationale: « Apôtre » est le terme français consacré et précis pour la mission reçue par Paul dans cette formule épistolaire.
- source_word: Χριστοῦ Ἰησοῦ
  choice: de Jésus le Messie
  rationale: Cette formulation française naturelle conserve la valeur titulaire de Χριστός tout en évitant l’expression peu idiomatique « du Messie Jésus » ; l’ordre des éléments est adapté à l’usage français.
- source_word: διὰ θελήματος θεοῦ
  choice: par la volonté de Dieu
  rationale: Avec le génitif, διά exprime ici ce par quoi l’apostolat de Paul est établi ; « par la volonté de Dieu » est à la fois exact et idiomatique.
- source_word: ὁ ἀδελφὸς
  choice: notre frère
  rationale: Le grec dit littéralement « le frère », mais « notre frère » exprime naturellement en français la relation communautaire implicite, sans modifier le référent.
- source_word: ἐκκλησίᾳ
  choice: Église
  rationale: « Église » est le terme français courant et contextuellement approprié dans l’adresse paulinienne ; la majuscule distingue ici la communauté croyante.
- source_word: ἁγίοις
  choice: saints
  rationale: « Saints » est le rendu bref et traditionnel du terme paulinien désignant ceux qui appartiennent au peuple consacré à Dieu.
- source_word: σὺν
  choice: avec
  rationale: « Avec » rend directement et naturellement l’inclusion marquée par σύν.
- source_word: ἐν ὅλῃ τῇ Ἀχαΐᾳ
  choice: dans toute l’Achaïe
  rationale: Ce rendu suit de près la portée régionale du grec et reste naturel en français.
theological_decisions:
- issue: Valeur de Χριστός dans Χριστοῦ Ἰησοῦ
  choice: Jésus le Messie
  alternative: Christ Jésus
  rationale: Le texte principal rend explicite la valeur de titre de Χριστός, tandis que la formulation traditionnelle est conservée en note afin de ne pas masquer l’autre manière légitime de comprendre et de rendre l’expression.
translation_notes:
  register: Français international moderne, digne et fluide. La phrase conserve la forme d’adresse épistolaire et les deux groupes destinataires. « Jésus le Messie » privilégie une formulation française naturelle tout en maintenant la force titulaire de Χριστός.
