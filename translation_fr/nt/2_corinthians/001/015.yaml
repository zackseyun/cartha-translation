reference: 2 Corinthians 1:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ ταύτῃ τῇ πεποιθήσει ἐβουλόμην ⸂πρότερον πρὸς ὑμᾶς ἐλθεῖν⸃, ἵνα δευτέραν ⸀χάριν ⸀σχῆτε,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/015.yaml
  text: And with this confidence I intended to come to you first[a], so that you might have a second benefit[b],
translation:
  language: fr
  text: Et c’est avec cette confiance que je voulais venir d’abord chez vous, afin que vous receviez un second bienfait[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « une seconde grâce » ou « une seconde faveur ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πεποιθήσει
  choice: confiance
  rationale: Le nom désigne ici l’assurance ou la confiance qui fondait le projet de voyage de Paul. « Confiance » est naturel et conserve la portée du grec.
- source_word: ἐβουλόμην
  choice: je voulais
  rationale: L’imparfait exprime une volonté ou une intention passée. « Je voulais » reste proche du grec sans donner au projet le caractère trop arrêté que pourrait suggérer « j’avais prévu ».
- source_word: πρότερον πρὸς ὑμᾶς ἐλθεῖν
  choice: venir d’abord chez vous
  rationale: Dans le contexte de l’itinéraire exposé au verset suivant, πρότερον indique naturellement la priorité dans l’ordre des visites. « Chez vous » convient à une visite auprès de la communauté.
- source_word: δευτέραν χάριν
  choice: un second bienfait
  rationale: Dans ce contexte de visite apostolique, χάρις désigne vraisemblablement le bienfait ou la faveur que les Corinthiens retireraient de la venue de Paul. La note conserve toutefois la traduction plus formelle « grâce » et l’ambiguïté lexicale.
- source_word: σχῆτε
  choice: vous receviez
  rationale: Bien que le verbe signifie littéralement « avoir », le français idiomatique dit plus naturellement « recevoir un bienfait ». Le subjonctif rend la proposition de but introduite par ἵνα.
theological_decisions:
- issue: Portée de χάρις dans δευτέραν χάριν
  choice: un second bienfait
  alternative: une seconde grâce ou une seconde faveur
  rationale: Le contexte immédiat est celui d’une visite dont les destinataires bénéficieraient. Le choix principal évite d’imposer ici le sens technique de la grâce salvatrice, tandis que la note maintient les autres valeurs possibles du terme.
translation_notes:
  register: Français international moderne, clair et digne. La phrase suit de près la syntaxe grecque tout en employant « receviez un bienfait », plus idiomatique que « ayez un bienfait ». La ponctuation finale conserve la continuité avec le verset suivant.
