id: 2CO.9.1
reference: 2 Corinthians 9:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Περὶ μὲν γὰρ τῆς διακονίας τῆς εἰς τοὺς ἁγίους περισσόν μοί ἐστιν τὸ γράφειν ὑμῖν,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/001.yaml
  text: For concerning the ministry to the saints[a], it is superfluous for me to write to you,
translation:
  language: fr
  text: En effet, pour ce qui est du service destiné aux saints[a], il est superflu de vous écrire à ce sujet,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en faveur des saints ». Dans ce contexte, la préposition grecque peut indiquer la direction ou les bénéficiaires du service.
    reason: lexical_alternative
lexical_decisions:
- source_word: Περὶ μὲν γὰρ
  choice: En effet, pour ce qui est de
  rationale: « Pour ce qui est de » introduit naturellement le thème en français. « En effet » rend la valeur explicative de γάρ et maintient le lien avec le contexte précédent, tandis que μὲν contribue ici à l’organisation du discours sans exiger un équivalent distinct.
- source_word: διακονίας
  choice: service
  rationale: Dans ce contexte, διακονία désigne le service concret que constitue la collecte. « Service » conserve l’idée d’une œuvre accomplie au bénéfice d’autrui sans réduire le terme à un simple soutien financier ni lui donner le sens institutionnel que « ministère » peut avoir en français.
- source_word: τῆς εἰς τοὺς ἁγίους
  choice: destiné aux saints
  rationale: Cette formulation exprime naturellement la direction ou la destination marquée par εἰς tout en laissant ouverte la nuance de bénéficiaire.
- source_word: ἁγίους
  choice: saints
  rationale: « Saints » rend de façon concise le terme paulinien habituel pour les croyants consacrés à Dieu, sans le paraphraser.
- source_word: περισσόν
  choice: superflu
  rationale: '« Superflu » restitue la force rhétorique de περισσόν : écrire à ce propos serait au-delà de ce qui est nécessaire. Le mot demeure intelligible et digne en français moderne.'
- source_word: μοί ἐστιν τὸ γράφειν ὑμῖν
  choice: il est superflu de vous écrire à ce sujet
  rationale: La tournure impersonnelle est naturelle en français. « À ce sujet » reprend explicitement le thème placé en tête, ce qui évite l’impression d’un verbe « écrire » laissé sans complément tout en restant fidèle au sens contextuel.
theological_decisions:
- issue: Portée de « saints »
  choice: Conserver « saints » comme désignation collective des croyants concernés
  alternative: « membres du peuple saint » ou « croyants »
  rationale: Le grec emploie le terme paulinien ἅγιοι sans autre précision. Le conserver respecte son contenu théologique et n’impose aucune définition confessionnelle supplémentaire.
translation_notes:
  register: Français international moderne, clair et digne. La phrase garde le mouvement argumentatif de Paul et son affirmation rhétorique, sans rendre la syntaxe grecque artificiellement mot à mot.
