- from: étant enrichis à tous égards pour toute générosité[a], laquelle produit par notre intermédiaire des actions de grâce envers Dieu—
  to: étant enrichis à tous égards afin de faire preuve de toute générosité, qui produit par notre intermédiaire une action de grâce à Dieu—
  rationale: La révision améliore l’idiomaticité de la finalité sans modifier le sens de la phrase, et elle aligne « une action de grâce à Dieu » sur le singulier grec tout en conservant le registre moderne et la structure ouverte du verset.
