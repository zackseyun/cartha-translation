source:
  edition: SBLGNT
  text: ἐν παντὶ πλουτιζόμενοι εἰς πᾶσαν ἁπλότητα, ἥτις κατεργάζεται δι’ ἡμῶν εὐχαριστίαν τῷ θεῷ—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/011.yaml
  text: being enriched in every way for all generosity[a], which through us produces thanksgiving to God—
translation:
  language: fr
  text: étant enrichis à tous égards afin de faire preuve de toute générosité, qui produit par notre intermédiaire une action de grâce à Dieu—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν παντὶ
  choice: à tous égards
  rationale: Cette expression rend naturellement la portée globale de la tournure grecque sans la limiter aux seuls biens matériels.
- source_word: πλουτιζόμενοι
  choice: étant enrichis
  rationale: Le participe présent passif conserve l’idée d’une action continue reçue, dont Dieu est l’agent implicite, sans suggérer une promesse absolue de prospérité.
- source_word: εἰς πᾶσαν ἁπλότητα
  choice: pour toute générosité
  rationale: Dans le contexte de la collecte, ἁπλότης désigne surtout une disposition généreuse et sans réserve; «pour» exprime ici le but ou le résultat.
- source_word: ἥτις
  choice: laquelle
  rationale: Le relatif reprend grammaticalement «générosité» et introduit l’effet qu’elle produit.
- source_word: κατεργάζεται
  choice: produit
  rationale: Le verbe exprime l’obtention effective d’un résultat; «produit» est concis et naturel.
- source_word: δι’ ἡμῶν
  choice: par notre intermédiaire
  rationale: Cette formulation conserve l’instrumentalité de διά avec le génitif et indique que Paul et ses collaborateurs servent d’intermédiaires dans l’administration du don.
- source_word: εὐχαριστίαν τῷ θεῷ
  choice: des actions de grâce envers Dieu
  rationale: Le pluriel idiomatique français «actions de grâce» rend le substantif grec, tandis que «envers Dieu» marque clairement le destinataire.
theological_decisions:
- issue: Sens de ἁπλότης dans le contexte de la collecte
  choice: générosité concrète et sans réserve
  alternative: simplicité, sincérité ou droiture d’intention
  rationale: Bien que le terme puisse ailleurs désigner la simplicité ou la sincérité, le contexte immédiat des ressources accordées en vue du don et des actions de grâce qui en résultent favorise nettement le sens de générosité, sans exclure sa nuance de franchise.
translation_notes:
  register: Français international moderne, digne et accessible. La structure participiale et le tiret final sont conservés parce que le verset s’insère dans une phrase plus longue. «À tous égards» évite une lecture exclusivement financière, et «par notre intermédiaire» explicite naturellement l’agence sans ajouter le mot «ministère» absent du grec.
