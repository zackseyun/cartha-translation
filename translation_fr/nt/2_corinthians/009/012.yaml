reference: 2 Corinthians 9:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὅτι ἡ διακονία τῆς λειτουργίας ταύτης οὐ μόνον ἐστὶν προσαναπληροῦσα τὰ ὑστερήματα τῶν ἁγίων, ἀλλὰ καὶ περισσεύουσα διὰ πολλῶν εὐχαριστιῶν τῷ θεῷ—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/012.yaml
  text: For the ministry of this service is not only supplying the needs of the saints[b][a], but is also overflowing in many thanksgivings to God—
translation:
  language: fr
  text: En effet, ce service ne se borne pas à combler les manques des saints[a] ; il fait aussi abonder de nombreuses actions de grâce envers Dieu[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les membres du peuple saint ». Dans les lettres de Paul, « les saints » désigne les croyants.'
    reason: clarification
  - marker: b
    text: 'Ou : « il abonde aussi par de nombreuses actions de grâce envers Dieu ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: En effet
  rationale: La conjonction introduit ici l’explication de l’affirmation précédente ; « En effet » exprime naturellement ce lien en français.
- source_word: ἡ διακονία τῆς λειτουργίας ταύτης
  choice: le ministère de ce service sacré
  rationale: « Ministère » et « service sacré » maintiennent la distinction entre διακονία et λειτουργία. Dans ce contexte, λειτουργία désigne un service rendu à Dieu et à son peuple, sans devoir être limité à un rite liturgique.
- source_word: προσαναπληροῦσα
  choice: pourvoit à
  rationale: Le participe exprime l’action de combler un manque. « Pourvoir à ce qui manque » est idiomatique et conserve cette idée.
- source_word: τὰ ὑστερήματα
  choice: ce qui manque
  rationale: Cette formulation garde plus directement le sens de déficits ou de ressources manquantes que le terme plus général « besoins ».
- source_word: τῶν ἁγίων
  choice: aux saints
  rationale: « Les saints » conserve le terme paulinien habituel pour les croyants, sans introduire la notion ultérieure de personnes canonisées.
- source_word: περισσεύουσα
  choice: il suscite aussi, avec abondance
  rationale: Le participe indique un effet surabondant. La reformulation avec « il suscite » rend clairement en français que ce service donne lieu à de nombreuses actions de grâce.
- source_word: διὰ πολλῶν εὐχαριστιῶν τῷ θεῷ
  choice: de nombreuses actions de grâce envers Dieu
  rationale: Les actions de grâce sont dirigées vers Dieu. La construction avec διά peut décrire le moyen ou l’effet produit ; le texte principal rend naturellement l’effet dans ce contexte.
theological_decisions:
- issue: Sens de λειτουργία dans le cadre de la collecte
  choice: service sacré
  alternative: service
  rationale: Le mot peut désigner un service public ou religieux. « Service sacré » préserve sa portée religieuse sans faire de la collecte un rite liturgique au sens technique.
- issue: Traduction du terme paulinien ἅγιοι
  choice: les saints
  alternative: le peuple de Dieu / les croyants
  rationale: « Les saints » maintient la terminologie ecclésiale de Paul et désigne ici les croyants bénéficiaires de la collecte, sans importer une doctrine de canonisation.
- issue: Rapport exprimé par διά avec les actions de grâce
  choice: 'effet produit : « suscite… de nombreuses actions de grâce »'
  alternative: 'moyen : « abonde par de nombreuses actions de grâce »'
  rationale: Dans le contexte, le service répond aux manques et produit en outre des remerciements adressés à Dieu. Le grec permet cependant de conserver une nuance de moyen, signalée en note.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve le parallélisme « non seulement… mais aussi » et le tiret final, qui indique que la pensée se poursuit au verset suivant.
