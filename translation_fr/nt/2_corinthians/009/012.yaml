revisions:
- from: En effet, le ministère de ce service sacré ne pourvoit pas seulement à ce qui manque aux saints[a] ; il suscite aussi, avec abondance, de nombreuses actions de grâce envers Dieu[b]—
  to: En effet, ce service ne se borne pas à combler les manques des saints[a] ; il fait aussi abonder de nombreuses actions de grâce envers Dieu[b]—
  rationale: La révision supprime l’ajout interprétatif « sacré », allège une construction française pesante et rend plus directement l’idée d’abondance de περισσεύουσα. Elle conserve l’explication introduite par ὅτι, le contraste « non seulement… mais aussi », l’ambiguïté fonctionnelle de διά par une note, ainsi que le tiret qui relie la phrase au verset suivant.
