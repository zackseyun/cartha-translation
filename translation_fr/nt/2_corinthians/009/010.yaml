  text: ὁ δὲ ἐπιχορηγῶν ⸀σπόρον τῷ σπείροντι καὶ ἄρτον εἰς βρῶσιν ⸀χορηγήσει καὶ ⸀πληθυνεῖ τὸν σπόρον ὑμῶν καὶ ⸀αὐξήσει τὰ γενήματα τῆς δικαιοσύνης ὑμῶν·)
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/010.yaml
  text: The one who supplies seed to the sower and bread for food will supply and multiply your seed and increase the harvest of your righteousness[a][b].
translation:
  language: fr
  text: Celui qui fournit de la semence au semeur et du pain pour se nourrir fournira et multipliera votre semence, et fera croître les fruits de votre justice[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les produits de votre justice » ou « la récolte de votre justice ».
    reason: lexical_alternative
  - marker: b
    text: Le mot grec traduit par « justice » peut aussi évoquer la droiture ou une conduite juste.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπιχορηγῶν
  choice: celui qui fournit
  rationale: Le participe substantivé désigne celui qui pourvoit. « Fournit » est naturel et conserve l’idée d’approvisionnement, sans rendre explicite la nuance possible d’abondance.
- source_word: σπόρον τῷ σπείροντι
  choice: de la semence au semeur
  rationale: Cette formulation conserve directement l’image agricole et la relation entre la semence et celui qui sème.
- source_word: ἄρτον εἰς βρῶσιν
  choice: du pain pour se nourrir
  rationale: Rend naturellement la destination du pain et maintient le contraste entre la semence destinée aux semailles et le pain destiné à la consommation.
- source_word: χορηγήσει καὶ πληθυνεῖ τὸν σπόρον ὑμῶν
  choice: vous fournira aussi de la semence, la multipliera
  rationale: Le complément indirect « vous » restitue la relation exprimée par « votre semence » dans un français plus naturel, tandis que les deux verbes distincts sont conservés.
- source_word: αὐξήσει
  choice: fera croître
  rationale: Ce choix garde la notion de croissance et s’accorde avec l’image agricole des fruits.
- source_word: τὰ γενήματα
  choice: les fruits
  rationale: Le pluriel désigne ce qui est produit ou récolté. « Fruits » est idiomatique en français et maintient à la fois l’image agricole et sa portée morale.
- source_word: δικαιοσύνης
  choice: justice
  rationale: « Justice » est l’équivalent français usuel et conserve une amplitude pouvant inclure la conduite juste, la droiture et la justice exercée envers autrui.
theological_decisions:
- issue: Sens de « les fruits de votre justice »
  choice: Métaphore des résultats produits par la conduite juste et généreuse des Corinthiens, sans préciser la nature exacte de ces résultats.
  alternative: Bénédiction matérielle issue de la générosité, manifestation de droiture ou fruit d’une fidélité juste.
  rationale: Le contexte concerne la générosité et emploie une image agricole. La formulation retenue ne réduit pas la promesse à un rendement matériel et ne limite pas non plus δικαιοσύνη à un seul sens théologique.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve l’image agricole et l’enchaînement des actions divines, tout en évitant une tournure possessive peu naturelle avec « votre semence ».
