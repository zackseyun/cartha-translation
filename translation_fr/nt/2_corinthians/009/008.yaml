reference: 2 Corinthians 9:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸀δυνατεῖ δὲ ὁ θεὸς πᾶσαν χάριν περισσεῦσαι εἰς ὑμᾶς, ἵνα ἐν παντὶ πάντοτε πᾶσαν αὐτάρκειαν ἔχοντες περισσεύητε εἰς πᾶν ἔργον ἀγαθόν·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/008.yaml
  text: And God is able to make all grace abound to you[a], so that in everything, at all times, having all sufficiency, you may abound in every good work.
translation:
  language: fr
  text: Et Dieu est capable de faire abonder toute grâce envers vous, afin que, en toute chose et en tout temps, ayant tout ce qu’il vous faut[a], vous abondiez dans toute bonne œuvre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « toute suffisance » ou « le contentement ». Le terme grec peut désigner la suffisance, le fait d’avoir ce qui est nécessaire ou le contentement ; ici, il s’agit de ce que Dieu fournit, et non d’une autosuffisance indépendante.
    reason: Alternative lexicale pour αὐτάρκεια et clarification de sa portée contextuelle.
lexical_decisions:
- source_word: δυνατεῖ
  choice: a le pouvoir
  rationale: Cette expression rend explicitement la capacité souveraine de Dieu exprimée par le présent δυνατεῖ, tout en restant naturelle en français.
- source_word: δὲ
  choice: Et
  rationale: La particule est ici légèrement connective plutôt que fortement adversative; « Et » assure naturellement le lien avec le contexte précédent.
- source_word: πᾶσαν χάριν
  choice: toute grâce
  rationale: « Grâce » conserve l’ampleur théologique de χάρις tout en englobant, dans ce contexte, la provision généreuse de Dieu. « Toute » maintient l’insistance répétée sur la totalité.
- source_word: περισσεῦσαι
  choice: faire abonder
  rationale: La tournure causative rend le fait que Dieu produit cette abondance et prépare la reprise du même verbe dans la proposition finale.
- source_word: εἰς ὑμᾶς
  choice: envers vous
  rationale: « Envers vous » conserve la nuance directionnelle de εἰς appliquée aux destinataires.
- source_word: ἵνα
  choice: afin que
  rationale: La locution exprime clairement la visée, sans exclure la nuance de résultat présente dans le contexte.
- source_word: ἐν παντὶ πάντοτε
  choice: en toute chose et en tout temps
  rationale: La traduction explicite les deux expressions et préserve l’accumulation rhétorique des termes en παν-.
- source_word: πᾶσαν αὐτάρκειαν
  choice: tout ce qu’il vous faut
  rationale: Dans ce contexte de générosité rendue possible par Dieu, l’expression désigne une provision adéquate plutôt qu’une autonomie. Cette formulation est claire et naturelle, tandis qu’une note conserve les autres nuances lexicales.
- source_word: ἔχοντες
  choice: ayant
  rationale: 'Le participe présent conserve la relation circonstancielle avec le verbe principal: ils abondent en œuvres bonnes tout en disposant du nécessaire.'
- source_word: περισσεύητε
  choice: vous abondiez
  rationale: 'La reprise d’« abonder » reproduit la symétrie avec περισσεῦσαι: Dieu fait abonder sa grâce afin que les destinataires abondent dans le bien.'
- source_word: εἰς πᾶν ἔργον ἀγαθόν
  choice: en toute œuvre bonne
  rationale: Après « abonder », « en » est idiomatique en français et exprime l’abondance dans toute action bonne, tout en gardant le singulier distributif du grec.
theological_decisions:
- issue: Sens de χάρις dans le contexte de la générosité
  choice: La grâce comme provision bienveillante de Dieu au sens large, y compris les moyens de se montrer généreux
  alternative: La seule faveur divine, ou un don matériel au sens étroit
  rationale: Le contexte concerne les ressources que Dieu accorde pour permettre la générosité, mais χάρις garde une portée plus large qu’une simple aide financière. « Toute grâce » préserve cette richesse.
- issue: Sens de αὐτάρκεια
  choice: Le fait d’avoir suffisamment, grâce à la provision de Dieu
  alternative: Le contentement, ou une autosuffisance indépendante
  rationale: Le passage présente Dieu comme la source de ce qui est nécessaire. La traduction évite donc de suggérer une autonomie philosophique, sans éliminer la nuance possible de contentement indiquée en note.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « toute/tout » et du verbe « abonder » conserve l’insistance rhétorique du grec, tandis que « tout ce qu’il vous faut » évite le caractère peu naturel de « toute suffisance » dans le corps du texte.
