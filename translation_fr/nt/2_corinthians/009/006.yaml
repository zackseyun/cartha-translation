source:
  edition: SBLGNT
  text: Τοῦτο δέ, ὁ σπείρων φειδομένως φειδομένως καὶ θερίσει, καὶ ὁ σπείρων ἐπ’ εὐλογίαις ἐπ’ εὐλογίαις καὶ θερίσει.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/006.yaml
  text: 'This: the one who sows sparingly will also reap sparingly[a], and the one who sows with blessings will also reap with blessings.'
translation:
  language: fr
  text: 'Voici le principe : celui qui sème avec parcimonie moissonnera aussi avec parcimonie, et celui qui sème généreusement[a] moissonnera aussi généreusement.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Litt. « avec des bénédictions ». Dans ce contexte, l’expression grecque peut désigner une manière généreuse ou abondante de semer et de moissonner.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῦτο δέ
  choice: 'Retenez ceci :'
  rationale: La formule introduit avec insistance un principe récapitulatif. « Retenez ceci » restitue naturellement cette fonction en français, sans donner à δέ une valeur temporelle absente du grec.
- source_word: ὁ σπείρων
  choice: celui qui sème
  rationale: Le participe substantivé a une portée générale et proverbiale. Cette formulation en conserve la structure représentative.
- source_word: φειδομένως
  choice: avec parcimonie
  rationale: L’adverbe indique une mesure retenue ou chiche. « Avec parcimonie » convient au contexte du don sans attribuer nécessairement au donateur une intention moralement condamnable.
- source_word: καὶ θερίσει
  choice: moissonnera aussi
  rationale: « Aussi » rend la correspondance exprimée par καί entre la manière de semer et celle de moissonner, tout en maintenant le parallélisme.
- source_word: ἐπ’ εὐλογίαις
  choice: en bénédictions
  rationale: Cette tournure volontairement marquée conserve le nom grec « bénédictions » et sa répétition. Dans le contexte, l’expression peut idiomatiquement désigner une manière généreuse ou abondante de semer et de moissonner; cette possibilité est signalée en note.
theological_decisions:
- issue: Sens de ἐπ’ εὐλογίαις dans la comparaison entre semailles et moisson
  choice: Conserver dans le texte le langage des « bénédictions ».
  alternative: Traduire « généreusement » ou « abondamment ».
  rationale: Le contexte du don autorise nettement le sens idiomatique de générosité ou d’abondance, mais le substantif εὐλογία garde une résonance de bénédiction. Le maintenir préserve le jeu de mots et la tension théologique du texte sans transformer le proverbe en promesse automatique d’enrichissement matériel.
translation_notes:
  register: Français international moderne, sobre et proverbial. « Avec parcimonie » est naturel et précis; « en bénédictions » est plus marqué, mais ce choix conscient préserve le vocabulaire et le parallélisme grecs, tandis que la note fournit le sens idiomatique.
