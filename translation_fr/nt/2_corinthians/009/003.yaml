  text: ἔπεμψα δὲ τοὺς ἀδελφούς, ἵνα μὴ τὸ καύχημα ἡμῶν τὸ ὑπὲρ ὑμῶν κενωθῇ ἐν τῷ μέρει τούτῳ, ἵνα καθὼς ἔλεγον παρεσκευασμένοι ἦτε,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/003.yaml
  text: But I sent the brothers[a], so that our boasting about you might not be emptied in this matter, so that, just as I was saying, you may be prepared[b],
translation:
  language: fr
  text: Mais j’ai envoyé les frères afin que ce que nous disons avec fierté à votre sujet ne soit pas réduit à rien sur ce point, afin que, comme je le disais, vous soyez prêts.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔπεμψα
  choice: j’ai envoyé
  rationale: L’aoriste renvoie ici à l’envoi concret des délégués; le passé composé est la forme narrative naturelle en français moderne.
- source_word: τοὺς ἀδελφούς
  choice: les frères
  rationale: Le groupe désigne les délégués masculins mentionnés dans le contexte; la traduction conserve donc le genre du référent.
- source_word: τὸ καύχημα ἡμῶν τὸ ὑπὲρ ὑμῶν
  choice: la fierté que nous exprimons à votre sujet
  rationale: καύχημα désigne ici ce dont Paul se prévaut ou parle avec fierté; cette formulation française rend le sens sans donner à «notre fierté» une nuance d’orgueil intérieur.
- source_word: κενωθῇ
  choice: ne se révèle pas sans fondement
  rationale: Le passif exprime l’idée que les propos fiers de Paul pourraient être vidés de leur substance ou démentis par les faits; «sans fondement» est idiomatique tout en conservant l’enjeu de validité.
- source_word: ἐν τῷ μέρει τούτῳ
  choice: sur ce point
  rationale: μέρος est employé idiomatiquement pour désigner l’aspect précis dont il est question, à savoir la préparation de la collecte.
- source_word: καθὼς ἔλεγον
  choice: comme je le disais
  rationale: L’imparfait grec suggère une affirmation antérieure en cours ou répétée; l’imparfait français en préserve naturellement la nuance.
- source_word: παρεσκευασμένοι ἦτε
  choice: vous soyez prêts
  rationale: La construction périphrastique exprime l’état de préparation visé; le subjonctif français convient après «afin que» et rend cet état attendu.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La phrase conserve les deux propositions finales grecques, mais coordonne la seconde avec «et que» afin d’éviter une répétition lourde de «afin que». Aucun marqueur de note n’est requis.
