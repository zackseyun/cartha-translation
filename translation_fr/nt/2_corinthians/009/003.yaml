review_pass:
  verdict: revise
  source_fidelity: 'La structure finale double est conservée, ainsi que l’imparfait de « comme je le disais » et l’état de préparation attendu. Toutefois, « ne se révèle pas sans fondement » explicite et déplace κενωθῇ : le grec emploie l’image d’un sujet de fierté rendu vide ou réduit à rien, sans affirmer directement qu’il était factuellement infondé.'
  naturalness: Le français du projet est fluide et de registre moderne. « Ce que nous disons avec fierté à votre sujet » permet une expression plus idiomatique et plus précise de καύχημα que « la fierté que nous exprimons ». « Réduit à rien » rend naturellement le passif grec sans calque lourd.
  terminology: « Les frères » respecte le référent masculin spécifique du contexte. La formulation révisée rend καύχημα comme un propos tenu avec fierté, sans transformer ce terme en simple sentiment intérieur ni atténuer indûment la notion de se vanter.
  issues:
  - severity: medium
    issue: κενωθῇ est rendu par « ne se révèle pas sans fondement ».
    rationale: Cette expression interprète le résultat comme une absence de fondement, alors que le passif de κενόω signifie plus directement « être vidé », « être rendu vain » ou « être réduit à rien ». Une formulation qui garde cette image évite une précision non exprimée par le grec.
  - severity: low
    issue: « la fierté que nous exprimons » rend καύχημα de manière quelque peu abstraite.
    rationale: Le terme désigne ici ce dont Paul se prévaut ou ce qu’il affirme fièrement au sujet des Corinthiens. Une formulation propositionnelle rend plus clairement cet objet du discours.
  revised_text: Mais j’ai envoyé les frères afin que ce que nous disons avec fierté à votre sujet ne soit pas réduit à rien sur ce point, afin que, comme je le disais, vous soyez prêts.
