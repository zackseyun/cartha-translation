review_pass:
  verdict: revise
  source_fidelity: La tournure « de peur que, si » rend bien μή πως ἐάν et « des Macédoniens » conserve l’indéfini. « Nous — pour ne pas dire vous — » rend correctement l’emphase de ἡμεῖς et l’incise ἵνα μὴ λέγωμεν ὑμεῖς. En revanche, ἐν τῇ ὑποστάσει ταύτῃ signifie littéralement et contextuellement « dans cette assurance / confiance » ; « à cause de » introduit une relation causale qui n’est pas exprimée par ἐν.
  naturalness: Le français est globalement naturel et de registre approprié. « Pris au dépourvu » évoque surtout le fait d’être surpris, alors que ἀπαρασκευάστους désigne plus précisément l’absence de préparation ; « pas prêts » est plus direct et exact dans le contexte de la collecte. « Soyons couverts de honte » conserve bien la portée publique et passive de καταισχυνθῶμεν.
  terminology: « Assurance » est un choix recevable pour ὑπόστασις dans ce contexte non technique, à condition de conserver la relation « dans ». La note présente honnêtement les sens contextuels alternatifs et n’importe aucun sens théologique ultérieur.
  issues:
  - severity: medium
    issue: Relation exprimée par « à cause de cette assurance »
    rationale: La préposition grecque ἐν situe la honte « dans » cette assurance/confiance, non « à cause de » celle-ci. La causalité ajoutée resserre indûment le sens.
  - severity: low
    issue: « pris au dépourvu » pour ἀπαρασκευάστους
    rationale: Cette expression peut suggérer qu’ils seraient surpris par l’arrivée des visiteurs, tandis que le grec vise leur manque de préparation. « pas prêts » restitue plus nettement le sens.
