  text: μή πως ἐὰν ἔλθωσιν σὺν ἐμοὶ Μακεδόνες καὶ εὕρωσιν ὑμᾶς ἀπαρασκευάστους καταισχυνθῶμεν ἡμεῖς, ἵνα μὴ ⸀λέγωμεν ὑμεῖς, ἐν τῇ ὑποστάσει ⸀ταύτῃ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/004.yaml
  text: lest if any Macedonians come with me and find you unprepared[b][a], we—not to say you—would be put to shame in this matter of confidence.
translation:
  language: fr
  text: de peur que, si des Macédoniens viennent avec moi et vous trouvent pas prêts, nous — pour ne pas dire vous — ne soyons couverts de honte dans cette assurance.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans cette confiance ». Le mot grec peut aussi désigner ici l’entreprise ou la situation, mais il renvoie très probablement à l’assurance de Paul à votre sujet.
    reason: lexical_alternative
lexical_decisions:
- source_word: μή πως ἐὰν
  choice: de peur que, si
  rationale: Cette tournure exprime naturellement en français la crainte d'une éventualité future tout en conservant la construction conditionnelle.
- source_word: ἔλθωσιν σὺν ἐμοὶ Μακεδόνες
  choice: des Macédoniens viennent avec moi
  rationale: L'absence d'article donne ici une valeur indéfinie; « des Macédoniens » n'implique pas un groupe précisément identifié.
- source_word: εὕρωσιν ὑμᾶς ἀπαρασκευάστους
  choice: vous trouvent pris au dépourvu
  rationale: Dans le contexte de la collecte, l'expression indique qu'ils ne seraient pas prêts. « Pris au dépourvu » est naturel et ne suggère pas nécessairement une imprévoyance durable.
- source_word: καταισχυνθῶμεν
  choice: ne soyons couverts de honte
  rationale: Le passif grec évoque une honte publique infligée par la situation, davantage qu'un simple sentiment intérieur.
- source_word: ἡμεῖς
  choice: nous
  rationale: Le pronom explicite est emphatique; les tirets mettent en relief « nous » et l'incise qui suit.
- source_word: ἵνα μὴ λέγωμεν ὑμεῖς
  choice: pour ne pas dire vous
  rationale: Cette incise reste proche du grec et laisse entendre avec tact que les Corinthiens partageraient eux aussi cette honte.
- source_word: ἐν τῇ ὑποστάσει ταύτῃ
  choice: à cause de cette assurance
  rationale: Dans ce contexte, ὑπόστασις désigne vraisemblablement l'assurance de Paul concernant les Corinthiens. La relation causale est rendue naturellement en français, tandis qu'une note conserve les autres possibilités lexicales.
theological_decisions:
- issue: Sens de ὑπόστασις dans ce contexte non technique
  choice: assurance
  alternative: entreprise, situation
  rationale: Le contexte immédiat porte sur l'assurance exprimée par Paul au sujet de la préparation des Corinthiens, sans faire intervenir le sens philosophique ou théologique ultérieur de « substance ». La note préserve l'ambiguïté lexicale réelle.
translation_notes:
  register: Français international moderne, digne et oralement fluide. L'incise entre tirets conserve la retenue rhétorique de Paul. Le marqueur [a] figure dans le texte principal et explicite l'ambiguïté de ὑπόστασις.
