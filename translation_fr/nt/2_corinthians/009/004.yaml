  to: de peur que, si des Macédoniens viennent avec moi et vous trouvent pas prêts, nous — pour ne pas dire vous — ne soyons couverts de honte dans cette assurance.[a]
  rationale: La révision remplace la relation causale non marquée « à cause de » par « dans », qui correspond à ἐν, et remplace une expression potentiellement ambiguë par « pas prêts », plus proche de ἀπαρασκευάστους. Le reste de la formulation est conservé, y compris l’incise rhétorique et l’ambiguïté lexicale signalée en note.
