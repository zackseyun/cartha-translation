  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: διὰ τῆς δοκιμῆς τῆς διακονίας ταύτης δοξάζοντες τὸν θεὸν ἐπὶ τῇ ὑποταγῇ τῆς ὁμολογίας ὑμῶν εἰς τὸ εὐαγγέλιον τοῦ Χριστοῦ καὶ ἁπλότητι τῆς κοινωνίας εἰς αὐτοὺς καὶ εἰς πάντας,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/013.yaml
  text: Because of the proof provided by this ministry[a], they glorify God for the obedience of your confession to the gospel of the Messiah and for the generosity of your sharing with them and with everyone[d][c][b],
translation:
  language: fr
  text: Par la preuve que fournit ce service, ils glorifient Dieu à cause de la soumission dont témoigne votre confession de l’Évangile du Messie[a][b], ainsi que de votre générosité dans le partage avec eux et avec tous[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’Évangile du Christ ». Le titre grec Χριστός signifie « Messie ».
    reason: alternative_reading
  - marker: b
    text: 'Plus littéralement : « la soumission de votre confession envers l’Évangile du Messie ». Le grec exprime de façon condensée le rapport entre leur soumission, leur confession et l’Évangile.'
    reason: lexical_alternative
  - marker: c
    text: Ici, le « partage » désigne vraisemblablement surtout leur participation matérielle généreuse à la collecte, et non seulement la communion au sens général.
    reason: lexical_alternative
lexical_decisions:
- source_word: δοκιμῆς
  choice: preuve
  rationale: Dans ce contexte, le service concret rendu par la collecte fournit la preuve visible de l’authenticité de l’engagement des Corinthiens. « Preuve » exprime ici le résultat d’une mise à l’épreuve.
- source_word: διακονίας
  choice: service
  rationale: Le terme désigne ici l’action concrète de secours organisée par Paul. En français moderne, « service » conserve à la fois l’idée d’assistance et celle d’un engagement au service de Dieu, sans suggérer une fonction ecclésiastique particulière.
- source_word: δοξάζοντες τὸν θεὸν
  choice: ils glorifient Dieu
  rationale: Le participe grec est rendu par une proposition verbale explicite, naturelle en français et cohérente avec le contexte de la phrase. « Glorifier » reste proche du verbe grec.
- source_word: ὑποταγῇ
  choice: obéissance
  rationale: Le mot exprime une soumission concrète. « Obéissance » convient au comportement qui correspond à la confession de l’Évangile, tandis qu’une note conserve la formulation plus littérale « soumission de votre confession ».
- source_word: ὁμολογίας ὑμῶν
  choice: votre confession
  rationale: Il s’agit de la profession publique de foi des destinataires. « Confession » préserve cette dimension déclarative et religieuse.
- source_word: εἰς τὸ εὐαγγέλιον τοῦ Χριστοῦ
  choice: dans votre confession de l’Évangile du Messie
  rationale: La formulation française relie naturellement l’obéissance à la confession orientée vers l’Évangile. Le rapport syntaxique exact demeure délicat et fait l’objet d’une note.
- source_word: ἁπλότητι
  choice: généreux
  rationale: Dans le contexte financier de la collecte, ἁπλότης désigne une générosité franche et sans réserve plutôt que la simple sincérité.
- source_word: κοινωνίας
  choice: partage
  rationale: Le terme évoque la participation commune, ici concrétisée par une contribution matérielle. « Partage » conserve cette largeur de sens tout en convenant au contexte.
- source_word: εἰς αὐτοὺς καὶ εἰς πάντας
  choice: avec eux et avec tous
  rationale: Avec « partage », la préposition « avec » exprime naturellement les bénéficiaires et partenaires visés par la générosité.
theological_decisions:
- issue: Traduction de Χριστοῦ dans εὐαγγέλιον τοῦ Χριστοῦ
  choice: l’Évangile du Messie
  alternative: l’Évangile du Christ
  rationale: Χριστός conserve ici sa valeur de titre. « Messie » en rend explicitement le sens sans ajouter de contenu doctrinal.
- issue: Rapport entre ὑποταγή, ὁμολογία et εὐαγγέλιον
  choice: l’obéissance manifestée dans votre confession de l’Évangile
  alternative: la soumission de votre confession à l’Évangile
  rationale: Le grec permet une formulation très compacte dont les rapports sont difficiles à reproduire sans raideur. Le texte principal exprime le lien entre confession et conduite obéissante, tandis que la note présente la construction plus formelle afin de ne pas masquer l’ambiguïté.
translation_notes:
  register: Français international moderne, digne et accessible. « Service » évite la connotation institutionnelle possible de « ministère »; « généreux partage » reste naturel tout en conservant la portée relationnelle de κοινωνία. La longue structure grecque est maintenue en une seule phrase, mais ses rapports sont clarifiés sans supprimer l’ambiguïté signalée en note.
