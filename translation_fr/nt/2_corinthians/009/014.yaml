id: 2CO.9.14
reference: 2 Corinthians 9:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ αὐτῶν δεήσει ὑπὲρ ὑμῶν ἐπιποθούντων ὑμᾶς διὰ τὴν ὑπερβάλλουσαν χάριν τοῦ θεοῦ ἐφ’ ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/014.yaml
  text: and in their prayer for you[a], they long for you because of the surpassing grace of God upon you.
translation:
  language: fr
  text: et, dans leurs prières pour vous, ils éprouvent pour vous un ardent désir, à cause de la grâce extraordinaire de Dieu qui repose sur vous.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δέησις
  choice: prières
  rationale: Le terme désigne ici une prière instante ou une supplication. « Prières » est naturel en français moderne et convient au contexte d’intercession marqué par ὑπὲρ ὑμῶν.
- source_word: αὐτῶν
  choice: leurs
  rationale: Le génitif pluriel renvoie aux bénéficiaires de la collecte et se rattache naturellement à « prières » en français.
- source_word: ὑπὲρ ὑμῶν
  choice: pour vous
  rationale: Avec le génitif, ὑπέρ signifie couramment « pour, en faveur de », surtout dans un contexte de prière.
- source_word: ἐπιποθούντων ὑμᾶς
  choice: ils aspirent à vous voir
  rationale: ἐπιποθέω exprime un vif désir dirigé vers des personnes. En français, « aspirer à vous voir » rend naturellement ce désir affectueux sans ajouter une rencontre explicitement affirmée par le grec au-delà de ce qu’implique le désir des personnes.
- source_word: διὰ
  choice: à cause de
  rationale: Avec l’accusatif, διά indique ici la cause de leur profond désir.
- source_word: ὑπερβάλλουσαν
  choice: extraordinaire
  rationale: Le participe qualifie la grâce comme dépassant la mesure ordinaire. « Extraordinaire » conserve cette idée dans un français courant et digne.
- source_word: χάριν
  choice: grâce
  rationale: « Grâce » préserve le sens paulinien de la faveur généreuse de Dieu et son action chez les destinataires.
- source_word: τοῦ θεοῦ
  choice: que Dieu vous a accordée
  rationale: Le génitif identifie Dieu comme la source de la grâce. La formulation verbale est idiomatique en français et conserve cette relation sans préciser davantage la manière dont la grâce agit.
- source_word: ἐφ’ ὑμῖν
  choice: vous a accordée
  rationale: ἐπί avec le datif peut décrire la grâce reposant sur eux ou s’exerçant à leur égard. « Accordée » communique naturellement la grâce divine dont ils sont les bénéficiaires.
- source_word: καὶ
  choice: et
  rationale: Le simple connecteur maintient le lien avec la proposition précédente.
theological_decisions:
- issue: Relation syntaxique entre la prière et le vif désir
  choice: La phrase présente les bénéficiaires de la collecte comme priant pour les Corinthiens et aspirant à les voir à cause de la grâce divine qui leur a été accordée.
  alternative: 'On pourrait conserver une construction plus serrée : « et par leur supplication pour vous, aspirant ardemment à vous… », où la prière serait davantage le cadre ou le moyen d’expression de leur désir.'
  rationale: 'Le grec est condensé : ἐπιποθούντων, au génitif pluriel, se rapporte à αὐτῶν, tandis que δεήσει peut indiquer le cadre ou le moyen. Le français exige de déployer la syntaxe; deux verbes coordonnés préservent les deux réalités sans faire de la prière la cause du désir.'
- issue: Sens de la grâce de Dieu « sur » les Corinthiens
  choice: La grâce que Dieu leur a accordée
  alternative: La grâce extraordinaire de Dieu qui repose sur eux
  rationale: ἐφ’ ὑμῖν permet l’image d’une grâce « sur » eux, mais peut aussi désigner la grâce exercée à leur égard. La formulation choisie est naturelle et garde Dieu comme source, sans définir plus précisément la manifestation de cette grâce.
translation_notes:
  register: Français international moderne, fluide et digne. « Ils aspirent à vous voir » explicite idiomatiquement le désir personnel exprimé par ἐπιποθέω; « grâce extraordinaire » évite l’expression plus lourde « grâce surabondante » tout en gardant l’idée de dépassement.
