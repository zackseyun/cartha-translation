  text: (καθὼς γέγραπται· Ἐσκόρπισεν, ἔδωκεν τοῖς πένησιν, ἡ δικαιοσύνη αὐτοῦ μένει εἰς τὸν αἰῶνα·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/009.yaml
  text: 'as it is written: “He scattered abroad[a], he gave to the poor; his righteousness remains forever.”'
translation:
  language: fr
  text: 'comme il est écrit : « Il a largement distribué, il a donné aux pauvres ; sa justice[a] subsiste pour toujours. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sa droiture ». Le mot grec peut désigner la justice, la conduite juste ou la droiture.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς γέγραπται
  choice: comme il est écrit
  rationale: Formule traditionnelle et naturelle qui introduit une citation de l’Écriture.
- source_word: Ἐσκόρπισεν
  choice: Il a répandu largement
  rationale: Le verbe évoque l’action de disperser avec largesse. Cette formulation conserve l’image poétique tout en rendant clair le contexte de générosité.
- source_word: ἔδωκεν
  choice: il a donné
  rationale: Le passé composé rend naturellement l’aoriste grec dans une citation poétique en français moderne.
- source_word: τοῖς πένησιν
  choice: aux pauvres
  rationale: πένης désigne les personnes aux ressources limitées ; « les pauvres » est ici direct, courant et précis.
- source_word: ἡ δικαιοσύνη αὐτοῦ
  choice: sa justice
  rationale: En français, « justice » peut désigner à la fois la qualité morale et la conduite juste, et conserve donc une part importante de l’étendue sémantique de δικαιοσύνη. Une note signale l’autre formulation possible.
- source_word: μένει
  choice: subsiste
  rationale: « Subsiste » exprime la permanence dans le temps et convient au registre poétique de la citation.
- source_word: εἰς τὸν αἰῶνα
  choice: pour toujours
  rationale: Expression française idiomatique qui rend clairement l’idée de durée sans fin.
theological_decisions:
- issue: Sens de δικαιοσύνη dans la citation appliquée à la personne généreuse
  choice: sa justice
  alternative: sa droiture
  rationale: Le grec peut viser la qualité d’une personne juste aussi bien que ses actes conformes à la justice. « Justice » maintient cette tension et le lien lexical biblique ; « droiture » explicite davantage le caractère moral sans être imposé au texte principal.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme bref de la citation est conservé, ainsi que son image de largesse.
