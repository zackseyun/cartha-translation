  text: ⸀χάρις τῷ θεῷ ἐπὶ τῇ ἀνεκδιηγήτῳ αὐτοῦ δωρεᾷ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/015.yaml
  text: Thanks be to God for his indescribable gift[a].
translation:
  language: fr
  text: Grâce soit rendue à Dieu pour son don inexprimable[a] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « don impossible à décrire ». L’adjectif grec désigne ce qui ne peut être pleinement raconté ou exprimé.
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις
  choice: Grâce soit rendue
  rationale: Dans cette formule exclamative avec le datif τῷ θεῷ, χάρις exprime la reconnaissance adressée à Dieu. « Grâce soit rendue » est une tournure française naturelle, digne et doxologique.
- source_word: τῷ θεῷ
  choice: à Dieu
  rationale: Le datif désigne ici le destinataire de la reconnaissance.
- source_word: ἐπὶ
  choice: pour
  rationale: 'Avec le datif, la préposition indique ici le motif de la reconnaissance : celle-ci est suscitée par le don de Dieu.'
- source_word: ἀνεκδιηγήτῳ
  choice: inexprimable
  rationale: L’adjectif qualifie ce qui ne peut être pleinement raconté ou exprimé. « Inexprimable » est clair en français moderne et conserve cette idée sans l’expliquer excessivement.
- source_word: αὐτοῦ
  choice: son
  rationale: Le pronom renvoie naturellement à Dieu et sa forme pronominale est conservée.
- source_word: δωρεᾷ
  choice: don
  rationale: δωρεά désigne ce qui est donné gratuitement. « Don » suffit en français ; ajouter « gratuit » serait redondant et surtraduirait légèrement.
theological_decisions:
- issue: Référent de « son don inexprimable »
  choice: 'Le référent demeure implicite : il s’agit du don de Dieu, sans préciser davantage.'
  alternative: Identifier explicitement le don au Christ, au salut en Christ, à la grâce divine ou à la générosité suscitée chez les Corinthiens.
  rationale: Le verset lui-même ne nomme que « son don inexprimable ». Le contexte permet plusieurs niveaux de référence ; la traduction préserve donc cette tension théologique sans imposer une interprétation plus étroite.
translation_notes:
  register: Français international moderne, concis et solennel. La formule « Grâce soit rendue à Dieu » garde la force exclamative et doxologique du grec. Le point d’exclamation, implicite dans le caractère exclamatif de la phrase nominale grecque, rend naturellement cette force en français.
