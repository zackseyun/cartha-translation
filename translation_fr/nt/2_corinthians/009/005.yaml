source:
  edition: SBLGNT
  text: ἀναγκαῖον οὖν ἡγησάμην παρακαλέσαι τοὺς ἀδελφοὺς ἵνα προέλθωσιν ⸀εἰς ὑμᾶς καὶ προκαταρτίσωσι τὴν ⸀προεπηγγελμένην εὐλογίαν ὑμῶν, ταύτην ἑτοίμην εἶναι οὕτως ὡς εὐλογίαν καὶ μὴ ὡς πλεονεξίαν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/005.yaml
  text: Therefore I considered it necessary to urge the brothers[a] to go to you ahead of us and arrange in advance the generous gift[b] you had promised, so that it would be ready as a generous gift and not as something extorted[c].
translation:
  language: fr
  text: J’ai donc jugé nécessaire d’encourager les frères[a] à se rendre chez vous avant nous et à préparer d’avance le don généreux[b] que vous aviez promis, afin qu’il soit prêt comme un don généreux et non comme une contribution arrachée[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « frères et sœurs », si le terme désigne ici le groupe des croyants de manière inclusive.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « bénédiction ». Ici, le mot désigne la contribution promise par les Corinthiens, envisagée comme un don généreux.
    reason: lexical_alternative
  - marker: c
    text: Le grec désigne habituellement l’avidité ou la cupidité; dans ce contexte, il présente la collecte comme une contribution arrachée par intérêt plutôt que comme un don généreux.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναγκαῖον οὖν ἡγησάμην
  choice: J’ai donc jugé nécessaire
  rationale: Rend le jugement délibéré exprimé par ἡγησάμην et la nécessité pratique indiquée par ἀναγκαῖον, dans un français naturel.
- source_word: παρακαλέσαι
  choice: d’encourager
  rationale: Dans ce contexte, le verbe désigne une sollicitation pressante à agir; « encourager » conserve cette force sans la solennité parfois excessive d’« exhorter ».
- source_word: τοὺς ἀδελφοὺς
  choice: les frères
  rationale: Le masculin pluriel grec est conservé dans le texte; la possibilité d’un emploi inclusif est signalée en note.
- source_word: προέλθωσιν εἰς ὑμᾶς
  choice: à partir chez vous avant nous
  rationale: Le verbe composé indique que la délégation précède Paul et ses compagnons; « avant nous » explicite naturellement le repère fourni par le contexte.
- source_word: προκαταρτίσωσι
  choice: à préparer d’avance
  rationale: Exprime l’organisation et la mise en état préalable de la collecte, tout en conservant le préfixe temporel προ-.
- source_word: τὴν προεπηγγελμένην εὐλογίαν ὑμῶν
  choice: le don généreux que vous aviez promis
  rationale: Dans le contexte de la collecte, εὐλογία désigne concrètement une contribution généreuse; le plus-que-parfait rend l’antériorité de la promesse.
- source_word: ταύτην ἑτοίμην εἶναι οὕτως
  choice: Ainsi, il sera prêt
  rationale: Rend le résultat visé et la valeur de οὕτως sans alourdir la phrase française.
- source_word: ὡς εὐλογίαν
  choice: comme un don généreux
  rationale: La répétition de la même expression préserve le contraste rhétorique avec πλεονεξία.
- source_word: καὶ μὴ ὡς πλεονεξίαν
  choice: et non comme quelque chose qui vous aurait été arraché
  rationale: πλεονεξία évoque normalement l’avidité ou le désir de s’emparer davantage; ici, par métonymie et en contraste avec le don généreux, le mot présente la collecte comme une contribution obtenue sous pression.
theological_decisions:
- issue: Portée de ἀδελφοὺς
  choice: les frères
  alternative: les frères et sœurs
  rationale: La forme grecque est masculine, et le contexte immédiat parle vraisemblablement de membres précis de la délégation. L’éventuelle portée inclusive reste ouverte dans une note.
- issue: Sens de εὐλογία dans le contexte de la collecte
  choice: don généreux
  alternative: bénédiction
  rationale: Le sens concret de contribution généreuse est prioritaire ici et rend clairement l’opposition avec πλεονεξία. La métaphore littérale de la « bénédiction » est conservée en note.
- issue: Force contextuelle de πλεονεξία
  choice: quelque chose qui vous aurait été arraché
  alternative: avidité
  rationale: Traduire simplement « comme de l’avidité » produirait une comparaison obscure en français. La formulation choisie conserve l’idée de saisie intéressée et la tension entre libéralité volontaire et prélèvement obtenu sous pression.
translation_notes:
  register: Français international moderne, clair et digne. La phrase est divisée en deux pour améliorer la lisibilité, sans supprimer les rapports logiques. La répétition de « don généreux » reproduit celle de εὐλογία, tandis que les notes préservent l’image littérale et les principales ambiguïtés lexicales.
