review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est bien rendu : Paul envoie une délégation en avance afin que la contribution promise soit prête et relève de la générosité plutôt que d’une exigence intéressée. Toutefois, « il sera prêt » affaiblit la dépendance finale du grec (ἵνα ... εἶναι), et « quelque chose qui vous aurait été arraché » est inutilement lourd et introduit une tournure passive personnelle que le grec n’explicite pas.'
  naturalness: Le français est globalement clair et de registre approprié. « Se rendre chez vous » est plus idiomatique que « partir chez vous », et une proposition finale avec « afin qu’il soit prêt » est plus fluide et plus exacte que la phrase autonome au futur.
  terminology: « Frères » avec note inclusive, ainsi que « don généreux » avec note sur εὐλογία, conviennent. Pour πλεονεξία, « contribution arrachée » rend dans le contexte l’idée d’une collecte exigée de façon intéressée, tandis que la note maintient le sens lexical premier d’avidité/cupidité.
  issues:
  - severity: medium
    issue: « Ainsi, il sera prêt » emploie un futur autonome.
    rationale: Le grec a une subordonnée de but, ἵνα ... εἶναι. En français, « afin qu’il soit prêt » conserve plus précisément le lien de finalité et évite un changement de perspective temporelle.
  - severity: low
    issue: « à partir chez vous » est moins idiomatique et « quelque chose qui vous aurait été arraché » est pesant.
    rationale: « Se rendre chez vous » est naturel en français international. La formulation passive avec « vous » n’est pas requise par πλεονεξία; « contribution arrachée » exprime le contraste contextuel sans surcharger le texte.
