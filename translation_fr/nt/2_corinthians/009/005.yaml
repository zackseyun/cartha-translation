revisions:
- from: J’ai donc jugé nécessaire d’encourager les frères[a] à partir chez vous avant nous et à préparer d’avance le don généreux[b] que vous aviez promis. Ainsi, il sera prêt comme un don généreux, et non comme quelque chose qui vous aurait été arraché[c].
  to: J’ai donc jugé nécessaire d’encourager les frères[a] à se rendre chez vous avant nous et à préparer d’avance le don généreux[b] que vous aviez promis, afin qu’il soit prêt comme un don généreux et non comme une contribution arrachée[c].
  rationale: La révision conserve les choix contextuels justifiés pour εὐλογία et πλεονεξία, mais rétablit la construction finale du grec et améliore l’idiomaticité française. Elle ne précise pas davantage l’identité des personnes qui auraient exercé une pression, puisque le grec ne l’explicite pas dans ce membre de phrase.
