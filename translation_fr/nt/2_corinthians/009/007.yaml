    rationale: Le grec μὴ ἐκ λύπης emploie ἐκ, indiquant la source ou le motif (« par tristesse », « à cause de la peine »), plutôt que la simple concomitance exprimée par « avec ». La note doit être corrigée pour ne pas induire le lecteur en erreur.
  revised_text: Que chacun donne comme il l’a décidé dans son cœur, non par tristesse[a] ni sous la contrainte, car Dieu aime celui qui donne avec joie.
