  terminology: « Sous la contrainte » rend bien ἐξ ἀνάγκης dans ce contexte. « Celui qui donne avec joie » restitue naturellement ἱλαρὸν δότην sans imposer d’interprétation doctrinale. « Cœur » préserve l’expression anthropologique du grec.
