  source_fidelity: 'Le sens global est fidèle : « chacun », la décision « dans son cœur », le contraste avec la contrainte et l’affirmation finale sont bien rendus. Toutefois, ἐκ λύπης signifie littéralement « par / à partir de tristesse, de peine », non « avec tristesse » ; la note actuelle présente donc comme littérale une formulation qui ne l’est pas exactement.'
