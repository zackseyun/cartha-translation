  rationale: La révision limitée de « avec tristesse » en « par tristesse » restitue plus précisément la valeur de ἐκ tout en conservant le sens lexical de λύπη. La note est ajustée afin de distinguer correctement le rendu littéral de l’alternative contextuelle « à regret ».
