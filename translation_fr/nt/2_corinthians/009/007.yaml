source:
  edition: SBLGNT
  text: ἕκαστος καθὼς ⸀προῄρηται τῇ καρδίᾳ, μὴ ἐκ λύπης ἢ ἐξ ἀνάγκης· ἱλαρὸν γὰρ δότην ἀγαπᾷ ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/007.yaml
  text: Each one should give as he has decided in his heart[a], not out of grief or compulsion[b], for God loves a cheerful giver.
translation:
  language: fr
  text: Que chacun donne comme il l’a décidé dans son cœur, non par tristesse[a] ni sous la contrainte, car Dieu aime celui qui donne avec joie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : à regret. Litt. : « non par tristesse » ou « par peine ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕκαστος
  choice: chacun
  rationale: Conserve le singulier distributif grec et désigne naturellement toute personne, sans limiter le propos aux hommes.
- source_word: καθὼς
  choice: comme
  rationale: Introduit simplement et naturellement la manière conforme à la décision intérieure de chacun.
- source_word: προῄρηται
  choice: l’a décidé
  rationale: Exprime une décision délibérée déjà prise; cette formulation est claire en français contemporain sans surinterpréter l’idée d’un choix fait longtemps à l’avance.
- source_word: τῇ καρδίᾳ
  choice: dans son cœur
  rationale: Conserve l’image anthropologique biblique du cœur comme siège de la résolution intérieure.
- source_word: μὴ ἐκ λύπης
  choice: non avec tristesse
  rationale: Préserve le sens lexical de λύπη, « tristesse, peine », tandis que le sens contextuel « à regret » est signalé en note.
- source_word: ἢ ἐξ ἀνάγκης
  choice: ni sous la contrainte
  rationale: Dans le contexte du don, ἀνάγκη évoque une nécessité imposée ou une pression; « sous la contrainte » est idiomatique et précis.
- source_word: ἱλαρὸν
  choice: avec joie
  rationale: Rend la disposition joyeuse et empressée qualifiant le donateur; la tournure adverbiale est naturelle en français.
- source_word: δότην
  choice: celui qui donne
  rationale: Restitue naturellement le nom d’agent grec sans employer le substantif français moins courant « donateur », qui peut sembler institutionnel.
- source_word: ἀγαπᾷ
  choice: aime
  rationale: Conserve le sens direct et théologiquement ouvert de ἀγαπάω plutôt que de le réduire à l’approbation ou au plaisir.
- source_word: ὁ θεός
  choice: Dieu
  rationale: Rendu français standard du sujet explicite grec.
theological_decisions:
- issue: Singulier représentatif et genre grammatical
  choice: Que chacun donne comme il l’a décidé dans son cœur
  alternative: Que chaque personne donne comme elle l’a décidé dans son cœur
  rationale: « Chacun » conserve le singulier distributif et reste générique en français. Les pronoms masculins qui s’y rapportent relèvent de l’accord grammatical et n’impliquent pas que l’exhortation vise exclusivement les hommes.
- issue: Sens de λύπη dans le contexte du don
  choice: non avec tristesse
  alternative: non à regret
  rationale: Le texte principal maintient le sens lexical de peine ou de tristesse, sans effacer l’idée d’un don ressenti comme douloureux; la formulation contextuelle courante est donnée en note.
- issue: Verbe de don sous-entendu
  choice: Que chacun donne
  alternative: Chacun, comme il l’a décidé dans son cœur
  rationale: Le grec omet ici le verbe principal, aisément fourni par le contexte immédiat. Le français exige une proposition complète; la tournure exhortative « Que chacun donne » préserve la force parénétique sans transformer la phrase en simple constat.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve le rythme antithétique du grec et son vocabulaire du cœur, de la tristesse, de la contrainte, de l’amour et de la joie.
