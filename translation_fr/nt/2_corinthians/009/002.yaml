id: 2CO.9.2
reference: 2 Corinthians 9:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οἶδα γὰρ τὴν προθυμίαν ὑμῶν ἣν ὑπὲρ ὑμῶν καυχῶμαι Μακεδόσιν ὅτι Ἀχαΐα παρεσκεύασται ἀπὸ πέρυσι, καὶ ⸀τὸ ὑμῶν ζῆλος ἠρέθισε τοὺς πλείονας.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/002.yaml
  text: 'For I know your eagerness[a], which I boast about to the Macedonians on your behalf: that Achaia has been ready since last year[c][b], and your zeal has stirred up most of them.'
translation:
  language: fr
  text: 'Je connais en effet votre empressement, dont je me vante à votre sujet auprès des Macédoniens : « L’Achaïe[a] est prête depuis l’année dernière. » Et votre zèle a stimulé la plupart d’entre eux.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’Achaïe était la province romaine dont Corinthe faisait partie ; le nom désigne ici les croyants de la région.
    reason: cultural_note
lexical_decisions:
- source_word: προθυμίαν
  choice: empressement
  rationale: Le terme exprime une disposition volontaire et ardente. « Empressement » restitue à la fois la volonté d’agir et l’enthousiasme, sans réduire le sens à une simple préparation matérielle.
- source_word: καυχῶμαι
  choice: je me vante
  rationale: Cette formulation conserve la force rhétorique de καυχάομαι, sans l’atténuer en une simple expression de satisfaction ou de fierté intérieure.
- source_word: ὑπὲρ ὑμῶν
  choice: à votre sujet
  rationale: Avec καυχῶμαι, la préposition indique que Paul parle favorablement des Corinthiens. « À votre sujet » est naturel en français dans cette construction et évite de suggérer qu’il se vante à leur place.
- source_word: Μακεδόσιν
  choice: auprès des Macédoniens
  rationale: Le datif désigne les personnes de Macédoine auxquelles Paul tient ces propos. Le contexte permet de comprendre qu’il s’agit des croyants macédoniens sans devoir l’ajouter au texte.
- source_word: Ἀχαΐα
  choice: l’Achaïe
  rationale: Le nom géographique est conservé comme dans le grec. Il désigne ici, par métonymie, les croyants de cette province, notamment ceux de Corinthe.
- source_word: παρεσκεύασται
  choice: est prête
  rationale: Le parfait décrit l’état présent qui résulte d’une préparation antérieure. Avec « depuis l’année dernière », « est prête » exprime naturellement cet état durable.
- source_word: ἀπὸ πέρυσι
  choice: depuis l’année dernière
  rationale: Cette expression indique une situation commencée l’année précédente et qui se prolonge jusqu’au moment où Paul écrit.
- source_word: τὸ ὑμῶν ζῆλος
  choice: votre zèle
  rationale: « Zèle » conserve l’intensité positive de ζῆλος et fait écho à l’empressement déjà mentionné.
- source_word: ἠρέθισε
  choice: a stimulé
  rationale: Dans ce contexte positif, le verbe signifie susciter ou renforcer l’élan d’autrui. « A stimulé » préserve cet effet moteur sans la nuance souvent négative de « provoquer ».
- source_word: τοὺς πλείονας
  choice: la plupart d’entre eux
  rationale: L’expression désigne la majorité du groupe précédemment mentionné, c’est-à-dire les Macédoniens. Le pronom explicite ce renvoi de façon naturelle.
theological_decisions:
- issue: Référent de « l’Achaïe »
  choice: Conserver le nom de la province, employé pour les croyants qui y vivent.
  alternative: Vous êtes prêts depuis l’année dernière ; les croyants de l’Achaïe sont prêts depuis l’année dernière.
  rationale: Le grec nomme explicitement l’Achaïe. Garder cette métonymie respecte la portée régionale du propos de Paul, tandis qu’une note en éclaire le sens.
- issue: Force de l’affirmation de Paul
  choice: Traduire καυχῶμαι par « je me vante » sans l’atténuer.
  alternative: Je parle avec fierté ; je fais votre éloge.
  rationale: Paul emploie délibérément un terme rhétorique fort. La traduction ne doit pas neutraliser cette tension par souci de bienséance.
- issue: Statut de la déclaration sur l’Achaïe
  choice: La présenter comme le contenu des propos tenus par Paul aux Macédoniens.
  alternative: L’intégrer sans guillemets à la phrase du narrateur.
  rationale: La conjonction ὅτι introduit le contenu dont Paul se vante. Les guillemets rendent cette relation claire en français sans changer le sens.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve le ton affirmé de Paul, le nom géographique et la métaphore du zèle qui met les autres en mouvement. Les guillemets clarifient naturellement le contenu de ce qu’il dit aux Macédoniens.
