source:
  edition: SBLGNT
  text: Αὐτὸς δὲ ἐγὼ Παῦλος παρακαλῶ ὑμᾶς διὰ τῆς πραΰτητος καὶ ἐπιεικείας τοῦ Χριστοῦ, ὃς κατὰ πρόσωπον μὲν ταπεινὸς ἐν ὑμῖν, ἀπὼν δὲ θαρρῶ εἰς ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/001.yaml
  text: I myself[a], Paul, appeal to you by the meekness and gentleness of Messiah—I who am humble face to face among you[c][b], but bold toward you when absent.
translation:
  language: fr
  text: Moi, Paul, je vous adresse un appel par la douceur et la bienveillance du Messie, moi qui, en personne parmi vous, suis humble[a], mais qui, absent, me montre hardi envers vous.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '« Humble » peut reprendre avec ironie ce que certains disaient de Paul lorsqu’il était présent. Autres traductions possibles : « modeste », ou, de manière plus interprétative, « timide ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Αὐτὸς δὲ ἐγὼ Παῦλος
  choice: Moi-même, Paul, je
  rationale: La tournure conserve l’insistance portée par αὐτός et ἐγώ ainsi que l’identification personnelle de Paul. δέ marque ici une transition légère, qu’il n’est pas nécessaire de rendre par un connecteur explicite en français.
- source_word: παρακαλῶ ὑμᾶς
  choice: je vous adresse un appel
  rationale: Dans ce contexte, παρακαλῶ exprime une supplication personnelle plutôt qu’un ordre. Cette formulation garde une tonalité pressante et relationnelle.
- source_word: διὰ τῆς πραΰτητος καὶ ἐπιεικείας
  choice: par la douceur et la bienveillance
  rationale: διά avec le génitif indique ici le fondement ou le moyen de l’appel. « Douceur » rend πραΰτης sans suggérer la faiblesse, et « bienveillance » exprime le caractère conciliant et plein d’égards de ἐπιείκεια.
- source_word: τοῦ Χριστοῦ
  choice: du Messie
  rationale: Χριστός fonctionne comme un titre. « Messie » en communique le sens plutôt que de simplement translittérer le grec.
- source_word: ὃς κατὰ πρόσωπον μὲν ταπεινὸς ἐν ὑμῖν
  choice: moi qui, face à face parmi vous, suis humble
  rationale: Le relatif renvoie à Paul. « Face à face » conserve l’image concrète de κατὰ πρόσωπον et s’oppose à son absence; « humble » garde l’ambiguïté de ταπεινός, qui peut reprendre ironiquement le jugement porté sur Paul.
- source_word: ἀπὼν δὲ θαρρῶ εἰς ὑμᾶς
  choice: mais qui, absent, fais preuve d’assurance envers vous
  rationale: Le participe ἀπών exprime la circonstance de l’absence. θαρρῶ désigne une attitude assurée ou hardie; « fais preuve d’assurance » restitue ce contraste sans transformer εἰς ὑμᾶς en hostilité explicite.
theological_decisions:
- issue: Traduction de Χριστοῦ
  choice: du Messie
  alternative: du Christ
  rationale: Le terme est employé comme titre et « Messie » en rend le contenu sémantique et la portée messianique.
- issue: Tonalité de la présentation de Paul comme ταπεινός
  choice: Préserver l’ambiguïté avec « humble »
  alternative: « timide » ou « sans en imposer »
  rationale: Le grec peut reprendre avec ironie l’opinion d’adversaires, mais ne signale pas explicitement une citation. Le texte principal ne tranche donc pas.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve l’insistance personnelle de Paul et le contraste rhétorique entre sa présence et son absence, tout en évitant un calque excessivement lourd.
