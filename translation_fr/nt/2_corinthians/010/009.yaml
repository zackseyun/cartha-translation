  yaml_path: translation/nt/2_corinthians/010/009.yaml
  text: so that I may not seem as though I were trying to frighten you by my letters[a].
translation:
  language: fr
  text: afin que je ne donne pas l’impression de vouloir vous effrayer par mes lettres[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « comme si je cherchais à vous intimider au moyen de mes lettres ».'
    reason: Variante lexicale qui conserve plus explicitement la tournure comparative ὡς ἂν et rend ἐκφοβεῖν par « intimider ».
lexical_decisions:
- source_word: ἵνα μὴ
  choice: afin que… ne… pas
  rationale: Introduit une proposition de but ou de résultat liée au contexte précédent; cette tournure conserve la subordination et reste naturelle en français.
- source_word: δόξω
  choice: je ne donne pas l’impression
  rationale: Le verbe δοκέω signifie ici « sembler, paraître ». « Donner l’impression » exprime naturellement cette idée dans la construction française.
- source_word: ὡς ἂν
  choice: de vouloir
  rationale: Avec l’infinitif qui suit, la combinaison présente l’action comme une intention apparente. « Donner l’impression de vouloir » rend cette nuance sans affirmer que Paul cherche réellement à effrayer.
- source_word: ἐκφοβεῖν
  choice: effrayer
  rationale: Le verbe désigne l’action de faire peur ou d’intimider. « Effrayer » en conserve la force directe sans aller jusqu’à « terrifier ».
- source_word: ὑμᾶς
  choice: vous
  rationale: Complément direct de ἐκφοβεῖν; le pluriel n’est pas marqué distinctement en français.
- source_word: διὰ τῶν ἐπιστολῶν
  choice: par mes lettres
  rationale: διά avec le génitif exprime ici le moyen. Bien que le grec dise littéralement « les lettres », le contexte montre qu’il s’agit des lettres de Paul; le possessif rend le référent explicite en français naturel.
