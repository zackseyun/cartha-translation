source:
  edition: SBLGNT
  text: καὶ πᾶν ὕψωμα ἐπαιρόμενον κατὰ τῆς γνώσεως τοῦ θεοῦ, καὶ αἰχμαλωτίζοντες πᾶν νόημα εἰς τὴν ὑπακοὴν τοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/005.yaml
  text: and every lofty thing raised up against the knowledge of God[a], and taking every thought captive into obedience to Messiah[b],
translation:
  language: fr
  text: et toute hauteur dressée contre la connaissance de Dieu[a], et nous faisons prisonnière toute pensée pour l’amener à l’obéissance au Messie[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tout ce qui est élevé », ou « toute prétention », pour « toute hauteur ».
    reason: lexical_alternative
  - marker: b
    text: 'Grec : « du Messie » ; le français exprime ici l’objet de l’obéissance par « au Messie ». Traditionnellement : « du Christ ».'
    reason: alternative_reading
lexical_decisions:
- source_word: πᾶν ὕψωμα
  choice: toute hauteur
  rationale: « Hauteur » conserve l’image concrète de ce qui est élevé, sans réduire la métaphore à une simple prétention intellectuelle. « Toute » rend la valeur distributive de πᾶν.
- source_word: ἐπαιρόμενον
  choice: qui s’élève
  rationale: Cette formulation naturelle en français garde l’idée d’élévation ou d’exaltation tout en évitant de préciser indûment si la chose est élevée par elle-même ou par une autre force.
- source_word: κατὰ τῆς γνώσεως τοῦ θεοῦ
  choice: contre la connaissance de Dieu
  rationale: La traduction reproduit la relation d’opposition et conserve la formulation compacte du génitif, qui peut évoquer aussi bien la connaissance concernant Dieu que le fait de le connaître.
- source_word: αἰχμαλωτίζοντες
  choice: nous faisons prisonnière
  rationale: Le verbe appartient au langage de la capture militaire. « Faire prisonnière » maintient cette image vive et s’accorde naturellement avec « toute pensée ».
- source_word: πᾶν νόημα
  choice: toute pensée
  rationale: νόημα peut désigner une pensée, une intention ou une disposition mentale. « Toute pensée » est ici le choix français le plus large et le plus naturel.
- source_word: εἰς τὴν ὑπακοὴν
  choice: pour l’amener à l’obéissance
  rationale: La formulation exprime le mouvement vers l’état visé par εἰς, plutôt qu’une simple relation statique.
- source_word: τοῦ Χριστοῦ
  choice: au Messie
  rationale: Χριστός fonctionne ici comme un titre. « Messie » en transmet le sens, tandis que la construction française « obéissance au Messie » rend le génitif comme l’objet de l’obéissance.
theological_decisions:
- issue: Sens de τοῦ Χριστοῦ avec ὑπακοή
  choice: l’obéissance au Messie
  alternative: l’obéissance du Messie
  rationale: Le contexte de la capture de toute pensée favorise nettement l’obéissance dirigée vers le Messie. La note signale néanmoins la forme grecque sans imposer une lecture confessionnelle.
- issue: Nature de πᾶν ὕψωμα ἐπαιρόμενον
  choice: une réalité élevée qui s’oppose à la connaissance de Dieu
  alternative: toute prétention arrogante
  rationale: Le grec emploie une métaphore large. « Toute hauteur » en préserve l’image et évite de limiter le référent aux seuls raisonnements orgueilleux.
translation_notes:
  register: Français international moderne, digne et lisible. La répétition de « et » respecte la coordination grecque et le caractère continu de la phrase. L’image militaire est conservée par « prisonnière », tandis que la métaphore de la hauteur demeure volontairement large.
