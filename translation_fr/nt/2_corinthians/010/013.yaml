  text: ἡμεῖς δὲ ⸀οὐκ εἰς τὰ ἄμετρα καυχησόμεθα, ἀλλὰ κατὰ τὸ μέτρον τοῦ κανόνος οὗ ἐμέρισεν ἡμῖν ὁ θεὸς μέτρου, ἐφικέσθαι ἄχρι καὶ ὑμῶν—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/013.yaml
  text: But we will not boast beyond measure[a], but according to the measure of the sphere that God assigned to us—a measure that reaches even to you—
translation:
  language: fr
  text: Mais nous, nous ne nous vanterons pas au-delà de toute mesure, mais selon la mesure du champ d’action[a] que Dieu nous a attribué, une mesure qui s’étend jusqu’à vous —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « limite », « règle » ou « norme » ; le terme grec peut désigner un instrument de mesure, une norme ou un domaine délimité.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄμετρα
  choice: au-delà des limites
  rationale: Dans cette tournure, le terme évoque le dépassement des bornes légitimes. Cette formulation française conserve l’image des limites et prépare le vocabulaire de la mesure.
- source_word: καυχησόμεθα
  choice: nous ne nous vanterons pas
  rationale: « Se vanter » rend directement le verbe dans le contexte polémique où Paul parle des prétentions et des motifs de fierté.
- source_word: κατὰ τὸ μέτρον
  choice: selon la mesure
  rationale: La traduction maintient la métaphore de la mesure ainsi que sa répétition dans le verset.
- source_word: κανόνος
  choice: champ d’action
  rationale: Dans ce contexte, le mot désigne vraisemblablement le domaine délimité confié à Paul plutôt qu’une règle morale. « Champ d’action » exprime naturellement en français l’étendue assignée de son ministère, tout en signalant les autres sens possibles en note.
- source_word: οὗ ἐμέρισεν ἡμῖν ὁ θεὸς
  choice: que Dieu nous a attribué
  rationale: Le verbe exprime ici une répartition ou une attribution divine; « attribué » est naturel et précis en français.
- source_word: μέτρου
  choice: mesure
  rationale: Le second emploi est rendu explicitement afin de conserver la répétition grecque et de préciser la portée du champ attribué.
- source_word: ἐφικέσθαι
  choice: qui s’étend
  rationale: L’infinitif indique l’extension du domaine assigné. « S’étend » conserve clairement l’image spatiale.
- source_word: ἄχρι καὶ ὑμῶν
  choice: jusqu’à vous
  rationale: La formulation exprime que les Corinthiens se trouvent eux aussi à l’intérieur du domaine confié à Paul.
theological_decisions:
- issue: Sens de κανών dans l’affirmation de Paul concernant son ministère
  choice: Un champ d’action délimité par Dieu et comprenant les Corinthiens
  alternative: Une règle ou une norme servant à mesurer la fierté de Paul
  rationale: Le contexte immédiat insiste sur la mesure, les limites et l’extension jusqu’aux Corinthiens. La traduction privilégie donc le sens spatial d’un domaine de ministère attribué par Dieu, sans exclure les autres valeurs lexicales, indiquées en note.
translation_notes:
  register: Français international moderne, clair et digne. La répétition de « mesure » reproduit l’insistance du grec. Le tiret final maintient le lien syntaxique avec la suite du passage.
