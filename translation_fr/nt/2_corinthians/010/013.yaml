  source_fidelity: 'Le sens d’ensemble est bien rendu : Paul refuse de se vanter hors de la mesure qui lui a été assignée par Dieu, et cette mesure comprend les Corinthiens. « Champ d’action » convient dans ce contexte pour κανών, tandis que la note préserve les sens lexicaux voisins. Cependant, la segmentation actuelle (« Nous le ferons plutôt ») introduit un pronom à antécédent peu naturel et affaiblit l’opposition syntaxique directe entre les deux compléments de « se vanter ».'
