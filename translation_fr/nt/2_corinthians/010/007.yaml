source:
  edition: SBLGNT
  text: Τὰ κατὰ πρόσωπον βλέπετε. εἴ τις πέποιθεν ἑαυτῷ Χριστοῦ εἶναι, τοῦτο λογιζέσθω πάλιν ⸀ἐφ’ ἑαυτοῦ ὅτι καθὼς αὐτὸς Χριστοῦ οὕτως καὶ ⸀ἡμεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/007.yaml
  text: 'You are looking at outward appearances[a]. If anyone is confident in himself that he belongs to Messiah, let him consider this again within himself: that just as he belongs to Messiah[b], so also do we.'
translation:
  language: fr
  text: 'Vous vous arrêtez aux apparences[a]. Si quelqu’un est convaincu en lui-même d’appartenir au Messie, qu’il y réfléchisse de nouveau en lui-même : tout comme lui appartient au Messie[b], nous aussi, nous appartenons au Messie.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « Vous regardez ce qui est selon l’apparence » ; on peut aussi comprendre : « Regardez ce qui est devant vos yeux. »'
    reason: Le grec permet de comprendre βλέπετε comme un indicatif ou un impératif, et l’expression κατὰ πρόσωπον admet plusieurs nuances.
  - marker: b
    text: 'Littéralement : « est au Messie » ou « est du Messie » ; cette tournure grecque exprime l’appartenance.'
    reason: La note rend visible la forme concise du grec derrière l’explicitation française « appartient au Messie ».
lexical_decisions:
- source_word: Τὰ κατὰ πρόσωπον
  choice: aux apparences
  rationale: L’expression désigne vraisemblablement ce qui est visible ou extérieur. « Aux apparences » restitue naturellement l’idée sans exclure les autres analyses signalées en note.
- source_word: βλέπετε
  choice: Vous vous arrêtez
  rationale: Le présent est compris comme un indicatif de reproche dans le contexte. « Vous vous arrêtez aux apparences » exprime une évaluation limitée à ce qui se voit.
- source_word: πέποιθεν ἑαυτῷ
  choice: est personnellement convaincu
  rationale: Le parfait exprime une assurance établie, et « personnellement » conserve la dimension réflexive de ἑαυτῷ sans produire la tournure française équivoque « a confiance en lui-même qu’il… ».
- source_word: Χριστοῦ εἶναι
  choice: appartenir au Messie
  rationale: Le génitif avec εἶναι exprime l’appartenance. « Messie » rend Χριστός comme titre.
- source_word: λογιζέσθω πάλιν ἐφ’ ἑαυτοῦ
  choice: qu’il considère encore une fois, en lui-même
  rationale: La formulation garde l’impératif de réflexion, la reprise marquée par πάλιν et le caractère intérieur de l’examen.
- source_word: καθὼς αὐτὸς Χριστοῦ οὕτως καὶ ἡμεῖς
  choice: tout comme lui appartient au Messie, nous lui appartenons, nous aussi
  rationale: La comparaison affirme la même appartenance au Messie de part et d’autre; le verbe sous-entendu dans le second membre est explicité en français.
theological_decisions:
- issue: Traduction de Χριστοῦ
  choice: au Messie
  alternative: au Christ
  rationale: Χριστός garde ici sa valeur de titre; « Messie » exprime cette fonction tout en préservant l’affirmation d’appartenance.
- issue: Portée de l’affirmation comparative
  choice: Paul reconnaît provisoirement l’appartenance revendiquée par l’interlocuteur et affirme la sienne au même titre
  alternative: Paul nie implicitement que l’interlocuteur appartienne réellement au Messie
  rationale: La construction « tout comme… nous aussi » formule explicitement une comparaison; la traduction ne transforme pas cette tension rhétorique en négation doctrinale.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve le ton de reproche suivi d’un appel à la réflexion. La répétition de « appartient au Messie » est maintenue pour la clarté et l’équilibre rhétorique.
