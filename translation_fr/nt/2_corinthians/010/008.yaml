id: 2CO.10.8
reference: 2 Corinthians 10:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐάν ⸀τε ⸀γὰρ περισσότερόν τι καυχήσωμαι περὶ τῆς ἐξουσίας ἡμῶν, ἧς ἔδωκεν ὁ ⸀κύριος εἰς οἰκοδομὴν καὶ οὐκ εἰς καθαίρεσιν ὑμῶν, οὐκ αἰσχυνθήσομαι,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/008.yaml
  text: For even if I should boast somewhat more about our authority[a], which the Lord gave for building you up and not for tearing you down[b], I will not be put to shame.
translation:
  language: fr
  text: Car, même si je devais me glorifier un peu plus au sujet de notre autorité, que le Seigneur nous a donnée pour vous édifier et non pour votre destruction[a], je ne serai pas couvert de honte[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour vous démolir ». Le grec oppose l’édification à la démolition ou à la destruction.
    reason: lexical_alternative
  - marker: b
    text: Ou « je n’aurai pas honte ». Le verbe grec est au passif et peut évoquer le fait d’être mis à honte ou de voir sa prétention démontrée sans fondement.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐάν τε γὰρ
  choice: Car même si
  rationale: « Car » conserve la valeur explicative de γάρ, tandis que « même si » rend naturellement la condition introduite par ἐάν et la nuance de τε.
- source_word: περισσότερόν τι καυχήσωμαι
  choice: je me glorifiais un peu plus
  rationale: La tournure conditionnelle à l’imparfait est naturelle en français; « un peu plus » maintient à la fois la comparaison de περισσότερον et l’atténuation indéfinie de τι.
- source_word: περὶ τῆς ἐξουσίας ἡμῶν
  choice: au sujet de l’autorité que […] nous a donnée
  rationale: ἐξουσία désigne ici une autorité reçue ou déléguée, et non une simple puissance. La formulation française rattache sans ambiguïté « nous » au don de cette autorité.
- source_word: ἧς ἔδωκεν ὁ κύριος
  choice: que le Seigneur nous a donnée
  rationale: Le passé composé convient au français actuel pour un don passé dont la portée demeure; « le Seigneur » conserve le titre κύριος.
- source_word: εἰς οἰκοδομὴν
  choice: pour vous faire grandir
  rationale: οἰκοδομή évoque littéralement la construction et, métaphoriquement, l’affermissement de la communauté. « Vous faire grandir » exprime clairement cette visée constructive en français courant.
- source_word: καὶ οὐκ εἰς καθαίρεσιν ὑμῶν
  choice: et non pour vous démolir
  rationale: « Démolir » rend la force de καθαίρεσις et maintient, avec l’idée constructive précédente, le contraste architectural du grec.
- source_word: οὐκ αἰσχυνθήσομαι
  choice: je n’en aurais pas honte
  rationale: Dans l’apodose d’une hypothèse formulée naturellement à l’imparfait en français, le conditionnel exprime correctement le futur grec. « Avoir honte » est idiomatique, tandis qu’une note signale la nuance passive possible.
theological_decisions:
- issue: Nature et finalité de l’autorité apostolique
  choice: L’autorité est donnée par le Seigneur afin de faire grandir les Corinthiens, non de les démolir.
  alternative: Comprendre cette autorité principalement comme un pouvoir de destruction ou de sanction.
  rationale: Le texte affirme une autorité réelle tout en définissant explicitement sa finalité constructive. La traduction conserve aussi la vigueur du terme opposé καθαίρεσις sans transformer cette opposition en doctrine particulière.
- issue: Portée de la honte finale
  choice: Paul affirme que cette glorification ne lui donnera pas sujet d’avoir honte.
  alternative: Paul affirme qu’il ne sera pas publiquement couvert de honte ou convaincu d’une prétention vide.
  rationale: Le passif grec permet une nuance externe (« être couvert de honte »), alors que le français idiomatique favorise « avoir honte ». La note conserve les deux possibilités sans trancher excessivement.
translation_notes:
  register: Français international actuel, digne et accessible. « Se glorifier » conserve le vocabulaire paulinien sans la connotation exclusivement positive de « être fier ». La phrase maintient l’autorité déléguée, sa finalité constructive et la dureté du contraste avec « démolir ».
