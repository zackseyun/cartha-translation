review_pass:
  verdict: revise
  source_fidelity: 'Le sens fondamental est bien rendu : Paul supplie de ne pas devoir, lors de sa venue, faire preuve d’une assurance hardie envers certains qui l’accusent, lui et ses collaborateurs, de se conduire « selon la chair ». « Selon la chair » conserve correctement l’ambiguïté de κατὰ σάρκα, et « contre certains » respecte la direction adversative de ἐπί τινας sans imposer l’idée plus précise d’une confrontation.'
  naturalness: La formulation actuelle est compréhensible, mais « une fois présent » est moins idiomatique et moins directement temporel que « lorsque je serai présent ». De plus, « l’assurance dont je compte user » a une tonalité administrative ou vieillie et atténue l’infinitif τολμῆσαι (« oser »). Une légère reformulation permet de conserver toutes les composantes du grec dans un français moderne plus fluide.
  terminology: « Assurance », « selon la chair » et « nous nous conduisons » conviennent au registre paulinien et au français international moderne. La note offre une alternative interprétative recevable sans remplacer indûment le terme théologique dans le texte.
  issues:
