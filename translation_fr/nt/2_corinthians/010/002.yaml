  rationale: 'La révision remplace deux tournures moins naturelles par un français moderne tout en préservant la structure argumentative : la demande de Paul, sa présence future, l’assurance envisagée, son intention d’oser agir contre certains adversaires, et leur accusation « selon la chair ». Elle ne tranche pas le sens théologique disputé de σάρξ.'
