    rationale: Cette expression peut suggérer « dès que je serai arrivé » plutôt que la simple circonstance « étant/lorsque je serai présent » exprimée par παρών.
  - severity: medium
    issue: « l’assurance dont je compte user »
    rationale: La tournure est peu naturelle en français moderne et ne rend pas explicitement l’idée d’oser (τολμῆσαι). « Avec laquelle j’envisage d’oser agir » rend mieux le lien entre l’assurance, la délibération de λογίζομαι et l’action hardie.
