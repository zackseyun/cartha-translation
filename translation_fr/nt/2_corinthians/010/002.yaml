source:
  edition: SBLGNT
  text: δέομαι δὲ τὸ μὴ παρὼν θαρρῆσαι τῇ πεποιθήσει ᾗ λογίζομαι τολμῆσαι ἐπί τινας τοὺς λογιζομένους ἡμᾶς ὡς κατὰ σάρκα περιπατοῦντας.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/002.yaml
  text: But I beg that when I am present I may not have to be bold with the confidence by which I consider daring to confront some who regard us as walking according to the flesh[a].
translation:
  language: fr
  text: 'Mais je vous en prie : lorsque je serai présent, que je n’aie pas à faire preuve de l’assurance avec laquelle j’envisage d’oser agir contre certains qui estiment que nous nous conduisons selon la chair[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « selon des critères humains ».'
    reason: Alternative lexicale et interprétative pour κατὰ σάρκα.
lexical_decisions:
- source_word: δέομαι
  choice: je vous en prie
  rationale: Exprime une supplication insistante tout en restant naturel et digne en français moderne.
- source_word: τὸ μὴ παρὼν θαρρῆσαι
  choice: que je n’aie pas, une fois présent, à faire preuve d’audace
  rationale: Rend le contenu de la demande et fait ressortir que Paul souhaite ne pas devoir agir avec hardiesse lorsqu’il sera présent.
- source_word: τῇ πεποιθήσει
  choice: avec l’assurance
  rationale: Le datif indique ici la disposition ou le moyen avec lequel Paul envisage d’agir.
- source_word: ᾗ λογίζομαι τολμῆσαι
  choice: dont je compte user
  rationale: Rend de façon idiomatique l’intention réfléchie exprimée par λογίζομαι et l’action hardie de τολμάω, sans alourdir la phrase.
- source_word: ἐπί τινας
  choice: contre certains
  rationale: Préserve la force adversative de ἐπί dirigée vers des personnes, sans préciser davantage la forme de l’intervention.
- source_word: τοὺς λογιζομένους
  choice: qui estiment
  rationale: Exprime le jugement porté par les opposants et fait écho, sans identité mécanique, au premier λογίζομαι.
- source_word: κατὰ σάρκα
  choice: selon la chair
  rationale: Conserve le vocabulaire paulinien ainsi que son ambiguïté anthropologique, morale et théologique.
- source_word: περιπατοῦντας
  choice: nous nous conduisons
  rationale: En français actuel, la métaphore de la marche appliquée au comportement serait moins immédiatement naturelle; « se conduire » transmet clairement son sens éthique.
theological_decisions:
- issue: Sens de σάρξ dans κατὰ σάρκα
  choice: selon la chair
  alternative: selon des critères humains
  rationale: La traduction principale maintient la densité et l’ambiguïté du terme paulinien. Une formulation comme « nature pécheresse » préciserait indûment l’accusation, tandis que l’autre lecture plausible est signalée en note.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La phrase conserve la tension rhétorique de Paul; « une fois présent » marque le contraste contextuel avec son absence, tandis que « contre certains » évite d’ajouter explicitement l’idée de confrontation.
