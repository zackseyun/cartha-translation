source:
  edition: SBLGNT
  text: τοῦτο λογιζέσθω ὁ τοιοῦτος, ὅτι οἷοί ἐσμεν τῷ λόγῳ δι’ ἐπιστολῶν ἀπόντες, τοιοῦτοι καὶ παρόντες τῷ ἔργῳ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/011.yaml
  text: 'Let such a person consider this: what we are in word by letters when absent[b][a], we are also in deed when present.'
translation:
  language: fr
  text: 'Qu’une telle personne tienne compte de ceci : tels que nous sommes, absents, dans nos paroles par nos lettres, tels nous le sommes aussi, présents, dans nos actes.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λογιζέσθω
  choice: qu’elle se dise bien ceci
  rationale: L’impératif invite la personne visée à prendre sérieusement en compte le fait qui suit. Cette tournure est naturelle en français et conserve la force délibérative et avertissante du grec.
- source_word: ὁ τοιοῦτος
  choice: une telle personne
  rationale: Désigne au singulier la personne du genre évoqué dans le contexte, sans la tonalité vieillie de « un tel » employé seul.
- source_word: οἷοί ἐσμεν … τοιοῦτοι
  choice: tels nous sommes … tels nous serons aussi
  rationale: La corrélation qualitative grecque est reproduite par « tels… tels ». Le futur français rend naturellement la portée prospective de l’avertissement concernant la prochaine présence de Paul, bien que le grec emploie une copule sous-entendue.
- source_word: τῷ λόγῳ
  choice: dans nos paroles
  rationale: Le datif indique le domaine ou le respect sous lequel Paul et ses collaborateurs sont considérés. « Paroles » convient ici aux propos communiqués par lettres et contraste clairement avec « actes ».
- source_word: δι’ ἐπιστολῶν
  choice: par nos lettres
  rationale: διά avec le génitif indique ici le moyen de communication. L’ajout naturel du possessif identifie les lettres de Paul et de ses collaborateurs sans modifier le référent.
- source_word: ἀπόντες
  choice: quand nous sommes absents
  rationale: Le participe circonstanciel est rendu par une proposition temporelle, en parallèle avec la présence finale.
- source_word: τῷ ἔργῳ
  choice: dans nos actes
  rationale: Le datif de domaine répond à τῷ λόγῳ. Le pluriel français « actes » exprime idiomatiquement la conduite effective tout en préservant l’antithèse paroles/actes.
- source_word: παρόντες
  choice: quand nous serons présents
  rationale: La formulation française explicite la portée future contextuelle de la présence envisagée et forme un contraste net avec l’absence actuelle.
theological_decisions:
- issue: Rapport entre les paroles écrites de Paul et son comportement lors de sa présence
  choice: Présenter le verset comme l’assurance que les actes de Paul et de ses collaborateurs, une fois présents, correspondront à la teneur de leurs lettres.
  alternative: Transformer la phrase en menace explicite d’une sanction future, ou réduire l’opposition à une différence de style et de puissance.
  rationale: Le grec affirme une correspondance qualitative entre ce qu’ils sont par leurs paroles écrites dans l’absence et ce qu’ils seront effectivement dans la présence. La traduction conserve la fermeté de l’avertissement sans préciser une action que le texte ne nomme pas.
translation_notes:
  register: Français international moderne, digne et direct. La structure corrélative « tels… tels » conserve la rhétorique du grec, tandis que « paroles… actes » donne une opposition claire et courante. Aucun marqueur de note n’est requis puisqu’aucune note n’est proposée.
