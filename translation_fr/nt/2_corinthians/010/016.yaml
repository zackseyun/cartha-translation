id: 2CO.10.16
reference: 2 Corinthians 10:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἰς τὰ ὑπερέκεινα ὑμῶν εὐαγγελίσασθαι, οὐκ ἐν ἀλλοτρίῳ κανόνι εἰς τὰ ἕτοιμα καυχήσασθαι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/016.yaml
  text: to proclaim the good news in the regions beyond you[c][b][a], not to boast in another's sphere about things already prepared.
translation:
  language: fr
  text: pour annoncer la bonne nouvelle dans les régions situées au-delà de chez vous[a], sans nous vanter, dans le champ d’action d’un autre, de ce qui est déjà préparé[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « pour annoncer l’Évangile dans les pays situés au-delà de chez vous ».'
    reason: lexical_alternative
  - marker: b
    text: 'L’expression grecque peut aussi se comprendre ainsi : « sans nous vanter, dans le domaine d’un autre, du travail déjà accompli ». Ici, « champ d’action » désigne un domaine de ministère attribué, et non une règle ou un canon.'
    reason: alternative_reading
lexical_decisions:
- source_word: εὐαγγελίσασθαι
  choice: annoncer la bonne nouvelle
  rationale: Rend clairement la valeur verbale missionnaire du terme, dans un français moderne, sans recourir nécessairement au vocabulaire ecclésiastique « prêcher l’Évangile ».
- source_word: τὰ ὑπερέκεινα ὑμῶν
  choice: les régions situées au-delà de chez vous
  rationale: L’article substantivant et le comparatif spatial désignent les territoires qui se trouvent au-delà du lieu des Corinthiens. « De chez vous » exprime naturellement en français la relation géographique portée par ὑμῶν.
- source_word: ἀλλοτρίῳ
  choice: d’un autre
  rationale: Conserve l’idée d’appartenance à une autre personne sans préciser son identité ni son sexe au-delà de ce qu’exige le grec.
- source_word: κανόνι
  choice: champ d’action
  rationale: Dans le contexte des versets 13 à 15, le mot désigne la sphère ou le domaine de travail attribué à quelqu’un, et non une règle morale ni un canon au sens ultérieur.
- source_word: τὰ ἕτοιμα
  choice: ce qui est déjà préparé
  rationale: Le neutre pluriel substantivé reste volontairement général. Cette formulation préserve l’ambiguïté entre des choses prêtes et une œuvre déjà préparée ou accomplie.
- source_word: καυχήσασθαι
  choice: nous vanter
  rationale: Préserve le motif récurrent de la vantardise dans ce passage. L’ajout du sujet « nous », fourni par le contexte syntaxique, est nécessaire au français naturel.
theological_decisions:
- issue: Sens de κανών dans le contexte du ministère de Paul
  choice: champ d’action attribué à quelqu’un
  alternative: règle, norme ou canon
  rationale: Le contexte immédiat traite des limites et du domaine de travail assignés. « Champ d’action » évite d’importer le sens postérieur de canon scripturaire.
- issue: Référence de τὰ ἕτοιμα
  choice: ce qui est déjà préparé
  alternative: le travail déjà accompli par d’autres
  rationale: Le contexte suggère l’œuvre préparée ou réalisée dans le domaine d’autrui, mais le grec demeure plus général. Le texte principal conserve cette indétermination et la note signale l’interprétation contextuelle.
translation_notes:
  register: Français international moderne, clair et digne. La tournure « au-delà de chez vous » conserve le point de repère corinthien sans ajouter explicitement « votre région ». « Champ d’action » est plus courant que « sphère » et rend la métaphore territoriale du contexte.
