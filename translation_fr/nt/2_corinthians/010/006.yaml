language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἐν ἑτοίμῳ ἔχοντες ἐκδικῆσαι πᾶσαν παρακοήν, ὅταν πληρωθῇ ὑμῶν ἡ ὑπακοή.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/006.yaml
  text: and being ready to punish every act of disobedience[b][a], when your obedience is complete.
translation:
  language: fr
  text: et nous sommes prêts à punir toute désobéissance[a], lorsque votre obéissance sera complète[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à faire justice de toute désobéissance » ou « à venger toute désobéissance ». Le verbe grec peut désigner l’action de faire justice ou de venger ; dans ce contexte, il renvoie probablement à une sanction disciplinaire.
    reason: lexical_alternative
  - marker: b
    text: Ou « aura été pleinement accomplie » ou « sera menée à son plein accomplissement ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἑτοίμῳ ἔχοντες
  choice: nous sommes prêts
  rationale: Cette tournure française naturelle restitue l’expression idiomatique grecque « avoir en état de préparation », tout en maintenant son lien avec le contexte précédent.
- source_word: ἐκδικῆσαι
  choice: à punir
  rationale: Dans ce contexte d’autorité apostolique et de correction de l’opposition, « punir » exprime l’exercice d’une sanction sans suggérer une vengeance personnelle.
- source_word: πᾶσαν παρακοήν
  choice: toute désobéissance
  rationale: Cette formulation concise conserve la portée globale de πᾶσαν et le nom abstrait παρακοήν, sans ajouter explicitement la notion d’« acte » absente du grec.
- source_word: ὅταν
  choice: dès que
  rationale: Avec le subjonctif, ὅταν présente ici une circonstance future dont l’accomplissement déclenchera l’action. « Dès que » rend clairement cette relation temporelle, sans lui donner un sens répétitif.
- source_word: πληρωθῇ
  choice: sera complète
  rationale: Le passif de πληρόω indique que l’obéissance parvient à sa pleine mesure. Le futur français convient à cette éventualité future et « complète » reste naturel.
- source_word: ὑμῶν ἡ ὑπακοή
  choice: votre obéissance
  rationale: Le possessif restitue directement le génitif et désigne l’obéissance des Corinthiens, sans préciser davantage son objet.
theological_decisions:
- issue: Nature de la réponse envisagée par Paul à l’opposition
  choice: une punition ou sanction de la désobéissance dans le cadre de l’exercice de son autorité apostolique
  alternative: venger toute désobéissance ou exercer un jugement eschatologique divin
  rationale: Le contexte immédiat porte sur l’autorité apostolique et la correction de l’opposition. « Punir » évite d’attribuer à Paul une vengeance personnelle, tout en ne définissant pas la forme précise de la sanction.
- issue: Rapport entre l’obéissance des destinataires et la sanction de la désobéissance
  choice: la sanction est tenue en réserve jusqu’à ce que leur obéissance soit complète
  alternative: une affirmation générale et répétée selon laquelle toute désobéissance sera punie chaque fois que l’obéissance sera complète
  rationale: ὅταν avec le subjonctif marque ici le moment futur attendu où l’obéissance des Corinthiens atteindra sa pleine mesure. La formulation conserve la tension entre l’obéissance du groupe et la désobéissance qui demeure.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase reste coordonnée au contexte précédent par « et ». « Dès que » exprime naturellement le seuil temporel futur; les notes préservent les possibilités lexicales réelles de ἐκδικέω et πληρόω.
