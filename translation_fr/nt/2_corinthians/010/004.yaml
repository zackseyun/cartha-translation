  verdict: revise
  source_fidelity: 'Le sens militaire et polémique est bien rendu : ὅπλα / στρατεία, σαρκικά, ὀχυρώματα et λογισμούς sont conservés sans spiritualisation indue. « Nous abattons des raisonnements » rend correctement le participe masculin pluriel καθαιροῦντες, qui se rapporte implicitement à « nous », plutôt qu’aux « armes ». En revanche, « puissantes devant Dieu » privilégie une lecture de τῷ θεῷ comme critère ou regard divin; dans ce contexte contrastant les moyens charnels avec la puissance divine, « grâce à Dieu » exprime plus naturellement en français la relation de puissance tout en laissant les autres analyses en note.'
  naturalness: Le français est globalement clair, actuel et digne. « Armes de notre combat », « charnelles », « forteresses » et « raisonnements » sont naturels dans ce registre. « Puissantes grâce à Dieu » est plus idiomatique que « puissantes devant Dieu » et évite de suggérer principalement que les armes seraient seulement puissantes à l’évaluation de Dieu.
  terminology: « Charnelles » préserve à juste titre le lien paulinien avec la chair sans le réduire à « pécheresses » ou « humaines ». « Raisonnements » conserve la largeur de λογισμοί; les alternatives « arguments » et « spéculations » sont utilement signalées. La note sur τῷ θεῷ doit inclure « devant Dieu » comme lecture possible plutôt que de la faire porter par le texte principal.
  issues:
  - severity: medium
    issue: Valeur de τῷ θεῷ dans « puissantes devant Dieu »
    rationale: Cette formulation française fait surtout entendre « puissantes aux yeux de Dieu ». Le datif grec est concis et discuté, mais le contraste immédiat avec des armes « charnelles » favorise la puissance reçue de Dieu. « Grâce à Dieu » est idiomatique et contextuellement plus fidèle; la note conserve « devant Dieu » et « d’une puissance divine ».
