- from: En effet, les armes de notre combat ne sont pas charnelles[a], mais puissantes devant Dieu[b] pour abattre des forteresses — nous abattons des raisonnements[c].
  to: En effet, les armes de notre combat ne sont pas charnelles[a], mais puissantes grâce à Dieu[b] pour abattre des forteresses — nous abattons des raisonnements[c].
  rationale: La seule révision porte sur δυνατὰ τῷ θεῷ. Elle remplace une formulation qui privilégiait le sens « devant Dieu » par « grâce à Dieu », plus naturelle et mieux accordée au contraste contextuel entre des moyens charnels et une puissance venant de Dieu. L’ambiguïté du datif demeure explicitement préservée en note. Les ancres de notes sont toutes placées après l’expression qu’elles éclairent.
