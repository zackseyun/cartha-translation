  text: τὰ γὰρ ὅπλα τῆς στρατείας ἡμῶν οὐ σαρκικὰ ἀλλὰ δυνατὰ τῷ θεῷ πρὸς καθαίρεσιν ὀχυρωμάτων— λογισμοὺς καθαιροῦντες
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/004.yaml
  text: For the weapons of our warfare are not fleshly[c][b][a], but powerful before God for the tearing down of strongholds—tearing down arguments
translation:
  language: fr
  text: En effet, les armes de notre combat ne sont pas charnelles[a], mais puissantes grâce à Dieu[b] pour abattre des forteresses — nous abattons des raisonnements[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ne relèvent pas de la chair »; le sens peut aussi être « ne sont pas simplement humaines ».
    reason: lexical_alternative
  - marker: b
    text: Ou « puissantes devant Dieu » ou « d’une puissance divine ».
    reason: alternative_reading
  - marker: c
    text: Ou « arguments » ou « spéculations ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπλα
  choice: armes
  rationale: Préserve l’image militaire concrète et constitue l’équivalent français courant.
- source_word: στρατείας
  choice: combat
  rationale: « Combat » exprime naturellement en français la lutte militaire métaphorique, sans suggérer nécessairement une guerre au sens littéral.
- source_word: σαρκικὰ
  choice: charnelles
  rationale: Conserve le lien explicite avec la « chair » et la tension paulinienne, sans réduire le terme à « pécheresses » ni l’aplatir en « humaines ».
- source_word: δυνατὰ τῷ θεῷ
  choice: puissantes devant Dieu
  rationale: Reflète sobrement le datif grec sans imposer comme certaine une valeur instrumentale; les autres compréhensions plausibles sont signalées en note.
- source_word: καθαίρεσιν
  choice: abattre
  rationale: Rend de façon vive et naturelle l’action de faire tomber des ouvrages fortifiés.
- source_word: ὀχυρωμάτων
  choice: forteresses
  rationale: Maintient l’image de positions militaires fortifiées.
- source_word: λογισμοὺς
  choice: raisonnements
  rationale: Préserve la portée intellectuelle du terme sans décider à l’avance que tous ces raisonnements prennent la forme d’arguments explicitement formulés.
- source_word: καθαιροῦντες
  choice: nous abattons
  rationale: La répétition de « abattons » maintient le lien lexical et rhétorique avec καθαίρεσιν, tandis que la proposition personnelle est naturelle en français.
theological_decisions:
- issue: Sens de σαρκικὰ dans le contraste entre les moyens humains et la puissance liée à Dieu
  choice: charnelles
  alternative: humaines; qui relèvent de la chair; mondaines
  rationale: « Charnelles » conserve le vocabulaire théologique de Paul et son ambiguïté, au lieu de limiter le sens à la faute morale ou aux seules méthodes du monde.
- issue: Valeur du datif τῷ θεῷ dans δυνατὰ τῷ θεῷ
  choice: puissantes devant Dieu
  alternative: puissantes par Dieu; d’une puissance divine
  rationale: Le datif est condensé et peut être compris de plusieurs manières. Le texte principal évite d’ajouter avec certitude une nuance instrumentale, tandis que la note rend compte des autres analyses plausibles.
- issue: Portée de λογισμοὺς
  choice: raisonnements
  alternative: arguments; spéculations
  rationale: Le terme vise des productions de la pensée opposées à la connaissance de Dieu dans la suite du passage; « raisonnements » garde une portée assez large sans neutraliser leur fonction polémique.
translation_notes:
  register: Français international moderne, digne et accessible. La métaphore militaire est conservée. La répétition « abattre / abattons » reproduit l’insistance du grec, et le tiret marque le passage du but général à son application aux raisonnements.
