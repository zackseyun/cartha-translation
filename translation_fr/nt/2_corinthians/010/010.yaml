  text: ὅτι Αἱ ⸂ἐπιστολαὶ μέν⸃, φησίν, βαρεῖαι καὶ ἰσχυραί, ἡ δὲ παρουσία τοῦ σώματος ἀσθενὴς καὶ ὁ λόγος ἐξουθενημένος.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/010.yaml
  text: For they say[a], “His letters are weighty and strong, but his bodily presence is weak[b], and his speech is despised.”
translation:
  language: fr
  text: 'Car on dit : « Ses lettres ont du poids et sont fortes, mais sa présence physique est faible et sa parole est méprisée[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « sa parole est tenue pour rien » ou « sa parole est jugée méprisable ». Le grec emploie un participe passif : il s’agit du jugement porté sur sa parole.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Car
  rationale: Introduit ici l’explication ou le contenu qui justifie l’affirmation précédente ; « Car » rend naturellement ce lien en français.
- source_word: ἐπιστολαὶ
  choice: lettres
  rationale: Désigne la correspondance écrite ; « lettres » est courant et n’impose pas le registre ecclésiastique de « épîtres ».
- source_word: μέν ... δὲ
  choice: … mais …
  rationale: La construction marque un contraste, rendu naturellement en français par « mais » sans reproduire lourdement la corrélation grecque.
- source_word: φησίν
  choice: dit-il
  rationale: Le verbe grec est formellement au singulier. « Dit-il » conserve cette donnée et fonctionne comme formule parenthétique introduisant la critique citée, sans identifier davantage son auteur.
- source_word: βαρεῖαι
  choice: imposantes
  rationale: Dans cette appréciation rhétorique, le terme évoque des lettres qui ont du poids et produisent une forte impression. « Imposantes » est naturel en français, tandis que « lourdes » risquerait d’évoquer un style pesant.
- source_word: ἰσχυραί
  choice: fortes
  rationale: Équivalent direct qui conserve l’idée de vigueur ou de puissance des lettres.
- source_word: παρουσία τοῦ σώματος
  choice: présence physique
  rationale: Le contexte oppose les lettres de Paul à l’impression qu’il produit en personne. « Présence physique » rend idiomatiquement le génitif grec sans réduire nécessairement la critique à son apparence.
- source_word: ἀσθενὴς
  choice: faible
  rationale: Équivalent direct qui laisse ouverte la nature exacte de la faiblesse alléguée.
- source_word: λόγος
  choice: parole
  rationale: Dans le contraste avec les lettres et la présence en personne, le mot désigne la prise de parole ou le discours oral de Paul. « Parole » conserve une certaine amplitude sémantique.
- source_word: ἐξουθενημένος
  choice: méprisée
  rationale: Le participe indique que sa parole est tenue pour rien ou traitée avec mépris ; « méprisée » exprime l’évaluation des critiques plutôt qu’une indignité intrinsèque.
theological_decisions:
- issue: Statut de la critique adressée à Paul
  choice: 'Présenter les propos comme une citation rapportée : « dit-il »'
  alternative: « disent-ils » ou « dit-on »
  rationale: Les guillemets et l’incise signalent qu’il s’agit du jugement d’un critique, non de l’approbation du narrateur. Le singulier français préserve en outre le nombre grammatical de φησίν.
- issue: Identité du locuteur de φησίν
  choice: Conserver le singulier indéterminé dans le texte
  alternative: Employer le pluriel contextuel « disent-ils »
  rationale: Le grec porte le singulier, mais celui-ci peut servir de formule de citation représentative ou parenthétique. La note maintient l’ambiguïté entre un critique représentatif et l’opinion collective des adversaires.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation garde le contraste rhétorique entre les lettres et la présence en personne, tout en évitant de présenter la critique comme un jugement du narrateur.
