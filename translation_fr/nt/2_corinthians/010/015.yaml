  text: οὐκ εἰς τὰ ἄμετρα καυχώμενοι ἐν ἀλλοτρίοις κόποις, ἐλπίδα δὲ ἔχοντες αὐξανομένης τῆς πίστεως ὑμῶν ἐν ὑμῖν μεγαλυνθῆναι κατὰ τὸν κανόνα ἡμῶν εἰς περισσείαν,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/015.yaml
  text: not boasting beyond measure in the labors of others, but having hope that, as your faith is growing among you, we will be enlarged according to our sphere of ministry, unto abundance,
translation:
  language: fr
  text: Nous ne nous vantons pas outre mesure du travail des autres. Mais nous espérons que, à mesure que votre foi grandira, notre action prendra une ampleur bien plus grande[c] parmi vous[a], conformément au champ qui nous est assigné[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi rattacher « parmi vous » à « votre foi grandira » : « à mesure que votre foi grandira parmi vous ». Le rattachement de l’expression grecque est ambigu.'
    reason: ambiguïté_syntaxique
  - marker: b
    text: 'Littéralement : « selon notre mesure » ou « selon notre règle ». Ici, le mot grec désigne vraisemblablement un champ d’activité délimité.'
    reason: alternative_lexicale
  - marker: c
    text: Littéralement, le grec dit « être agrandis » ou « être magnifiés », puis « vers l’abondance » ou « davantage ». Dans ce contexte, l’expression évoque vraisemblablement une extension plus grande du travail apostolique.
    reason: alternative_de_traduction
lexical_decisions:
- source_word: οὐκ εἰς τὰ ἄμετρα καυχώμενοι
  choice: Nous ne nous vantons pas sans mesure
  rationale: Cette formulation conserve le vocabulaire de la vantardise ainsi que l’image des limites, tout en restant idiomatique en français.
- source_word: ἐν ἀλλοτρίοις κόποις
  choice: du travail des autres
  rationale: κόποις désigne ici le travail pénible accompli, et ἀλλοτρίοις indique qu’il appartient à d’autres. La formulation exprime sobrement que Paul ne revendique pas leur labeur.
- source_word: ἐλπίδα δὲ ἔχοντες
  choice: Mais nous avons l’espoir que
  rationale: Le nom ἐλπίδα est conservé plutôt que entièrement transformé en verbe.
- source_word: αὐξανομένης τῆς πίστεως ὑμῶν
  choice: à mesure que votre foi grandira
  rationale: Le génitif absolu est rendu par une proposition temporelle naturelle. Le futur français convient à l’espérance exprimée dans la phrase.
- source_word: ἐν ὑμῖν
  choice: parmi vous
  rationale: La locution est rattachée à l’extension de l’action apostolique, conformément à l’ordre grec et au contexte, tout en signalant en note son rattachement possible à la croissance de la foi.
- source_word: μεγαλυνθῆναι
  choice: nous verrons notre action s’étendre
  rationale: Le passif grec signifie littéralement être agrandis ou magnifiés. Dans le contexte des champs de travail apostolique, le français explicite avec retenue l’expansion de l’action plutôt qu’une glorification personnelle.
- source_word: κατὰ τὸν κανόνα ἡμῶν
  choice: dans les limites du champ qui nous est assigné
  rationale: κανών désigne dans le contexte un domaine mesuré ou délimité. « Champ » communique cette sphère d’activité sans évoquer abusivement le canon biblique ou une simple règle morale.
- source_word: εἰς περισσείαν
  choice: considérablement
  rationale: L’adverbe rend naturellement l’idée d’une extension vers une mesure beaucoup plus grande, bien que la construction nominale et directionnelle du grec soit explicitée en note.
theological_decisions:
- issue: Portée de μεγαλυνθῆναι
  choice: L’expression désigne l’extension de l’action apostolique de Paul plutôt que son exaltation personnelle.
  alternative: Paul serait davantage honoré ou magnifié par les Corinthiens.
  rationale: Le contexte immédiat traite des limites assignées au travail apostolique et du refus de se glorifier du travail d’autrui. La traduction garde néanmoins en note la métaphore littérale.
- issue: Sens de κανών
  choice: Un champ d’activité délimité et assigné.
  alternative: Une règle, une norme ou un canon.
  rationale: Dans les versets 13 à 16, le terme s’inscrit dans une image de mesure et de territoire de travail. « Champ » évite l’anachronisme du sens ecclésiastique ultérieur de « canon ».
- issue: Rattachement de ἐν ὑμῖν
  choice: La locution est rattachée à l’extension de l’action de Paul parmi les Corinthiens.
  alternative: La locution qualifie la croissance de la foi parmi les Corinthiens.
  rationale: La position de ἐν ὑμῖν permet de le comprendre avec μεγαλυνθῆναι, mais son rattachement à αὐξανομένης reste grammaticalement possible; l’ambiguïté est donc conservée dans une note.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase reste proche des images de mesure, de champ et d’extension du grec, tout en évitant le tour peu naturel « être agrandis parmi vous ». Les notes préservent l’ambiguïté syntaxique et les principales possibilités lexicales.
