id: 2CO.10.12
reference: 2 Corinthians 10:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Οὐ γὰρ τολμῶμεν ἐγκρῖναι ἢ συγκρῖναι ἑαυτούς τισιν τῶν ἑαυτοὺς συνιστανόντων· ἀλλὰ αὐτοὶ ἐν ἑαυτοῖς ἑαυτοὺς μετροῦντες καὶ συγκρίνοντες ἑαυτοὺς ἑαυτοῖς οὐ συνιᾶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/012.yaml
  text: For we do not dare to classify or compare ourselves with some of those who commend themselves[a]. But when they measure themselves by themselves and compare themselves with themselves[b], they do not understand.
translation:
  language: fr
  text: Nous n’osons pas nous classer parmi certains de ceux qui se recommandent eux-mêmes, ni nous comparer à eux[a]. Mais eux, en se mesurant d’après eux-mêmes et en se comparant à eux-mêmes[b], ne comprennent pas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « nous ranger avec » ou « nous mettre au même rang que »; le premier verbe grec évoque le fait de se placer dans la même catégorie que d’autres.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « se mesurant en eux-mêmes et se comparant eux-mêmes à eux-mêmes ». Ils se prennent ainsi eux-mêmes pour référence.
    reason: lexical_alternative
lexical_decisions:
- source_word: τολμῶμεν
  choice: nous n’osons pas
  rationale: Cette formulation naturelle conserve l’idée de ne pas se permettre une telle démarche ainsi que la pointe ironique de Paul.
- source_word: ἐγκρῖναι
  choice: nous classer parmi
  rationale: Le verbe désigne ici le fait de se placer dans la même catégorie ou le même groupe que d’autres, plutôt qu’un simple jugement moral.
- source_word: συγκρῖναι / συγκρίνοντες
  choice: nous comparer / en se comparant
  rationale: « Comparer » rend le sens courant du verbe et maintient sa répétition rhétorique.
- source_word: ἑαυτούς τισιν τῶν ἑαυτοὺς συνιστανόντων
  choice: parmi certains de ceux qui se recommandent eux-mêmes … nous comparer à eux
  rationale: La construction réflexive exprime l’autorecommandation, thème central du passage; les compléments français rendent clairement les deux rapports syntaxiques.
- source_word: ἀλλὰ αὐτοὶ
  choice: Mais eux
  rationale: Le pronom disjoint restitue l’emphase de αὐτοὶ et le contraste avec Paul et ses collaborateurs.
- source_word: ἐν ἑαυτοῖς
  choice: d’après eux-mêmes
  rationale: Dans le contexte, ils se prennent eux-mêmes comme référence. Cette formulation française reste proche de la métaphore tout en étant intelligible.
- source_word: μετροῦντες
  choice: en se mesurant
  rationale: Le choix conserve la métaphore explicite de la mesure.
- source_word: ἑαυτοὺς ἑαυτοῖς
  choice: en se comparant à eux-mêmes
  rationale: La répétition des pronoms réfléchis souligne le caractère fermé et autoréférentiel de leur comparaison.
- source_word: οὐ συνιᾶσιν
  choice: ne comprennent pas
  rationale: Cette traduction directe laisse implicite, comme le grec, l’objet de leur incompréhension.
theological_decisions:
- issue: Objet implicite de οὐ συνιᾶσιν
  choice: ne comprennent pas
  alternative: ne font pas preuve de discernement
  rationale: Le texte grec ne précise pas explicitement ce qu’ils ne comprennent pas; la traduction conserve cette ouverture au lieu d’identifier leur faute de manière plus interprétative.
translation_notes:
  register: 'Français international moderne, clair et digne. La répétition insistante de « eux-mêmes » est volontaire: elle reproduit l’effet rhétorique du grec, tandis que « d’après eux-mêmes » explicite sobrement la référence utilisée sans supprimer la note littérale.'
