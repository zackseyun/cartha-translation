  text: οὐ γὰρ ὡς μὴ ἐφικνούμενοι εἰς ὑμᾶς ὑπερεκτείνομεν ἑαυτούς, ἄχρι γὰρ καὶ ὑμῶν ἐφθάσαμεν ἐν τῷ εὐαγγελίῳ τοῦ Χριστοῦ—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/014.yaml
  text: For we are not overextending ourselves[a], as though we had not reached you[c][b], for we came even as far as you with the gospel of Messiah—
translation:
  language: fr
  text: En effet, nous ne dépassons pas nos limites, comme si nous ne parvenions pas jusqu’à vous, car nous sommes bel et bien arrivés jusqu’à vous avec l’Évangile du Messie[a] —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « dans l’Évangile du Messie ».'
    reason: La préposition grecque peut désigner l’accompagnement ou le domaine de l’activité missionnaire.
lexical_decisions:
- source_word: ὑπερεκτείνομεν ἑαυτούς
  choice: nous ne dépassons pas nos limites
  rationale: Le verbe exprime l’idée de s’étendre au-delà de la juste mesure. Cette formulation française naturelle conserve la notion de dépassement, tandis que « nos limites » explicite sobrement la borne impliquée par le verbe.
- source_word: ὡς μὴ ἐφικνούμενοι εἰς ὑμᾶς
  choice: comme si nous n’étions pas parvenus jusqu’à vous
  rationale: La tournure rend la comparaison hypothétique et conserve l’idée d’une portée qui va jusqu’aux Corinthiens.
- source_word: ἄχρι γὰρ καὶ ὑμῶν ἐφθάσαμεν
  choice: car nous sommes bel et bien arrivés jusqu’à vous
  rationale: « Bel et bien » restitue l’insistance de καί sans produire un ordre des mots artificiel; l’aoriste est rendu comme une action accomplie.
- source_word: ἐν τῷ εὐαγγελίῳ
  choice: avec l’Évangile
  rationale: Dans ce contexte missionnaire, ἐν peut indiquer l’accompagnement ou le domaine dans lequel Paul est arrivé jusqu’à eux. « Avec l’Évangile » est idiomatique tout en laissant l’autre nuance en note.
- source_word: τοῦ Χριστοῦ
  choice: du Christ
  rationale: « Christ » est en français le titre traditionnel et direct correspondant à Χριστός; il convient naturellement dans l’expression paulinienne « l’Évangile du Christ ».
theological_decisions:
- issue: Rapport exprimé par « l’Évangile du Christ »
  choice: du Christ
  alternative: du Messie
  rationale: Le génitif peut évoquer l’Évangile qui concerne le Christ ou qui lui appartient. La formulation française garde cette latitude sans trancher entre ces rapports.
- issue: Valeur de ἐν devant « l’Évangile »
  choice: avec l’Évangile
  alternative: dans l’Évangile
  rationale: Le contexte permet une nuance associative ou sphérique. Le texte principal privilégie le français courant, et la note conserve l’autre possibilité.
translation_notes:
  register: Français international moderne, digne et accessible. « Bel et bien » transmet l’emphase sans lourdeur. Le tiret final est conservé, car la phrase se poursuit au verset suivant.
