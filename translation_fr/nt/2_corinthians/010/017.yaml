  variant: modern international French
source:
  edition: SBLGNT
  text: Ὁ δὲ καυχώμενος ἐν κυρίῳ καυχάσθω·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/017.yaml
  text: But the one who boasts must boast in the Lord[a].
translation:
  language: fr
  text: Mais que celui qui se vante se vante dans le Seigneur[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de manière plus formelle : « Que celui qui se vante se vante dans le Seigneur. » Paul fait probablement écho à Jérémie 9.24 (9.23 dans la Septante).'
    reason: Renvoi à l’allusion scripturaire probable et indication de la formulation formelle.
lexical_decisions:
- source_word: Ὁ ... καυχώμενος
  choice: celui qui se vante
  rationale: L’article accompagné du participe présent a une valeur substantive et désigne de façon générale la personne qui se vante. Cette formulation conserve le singulier représentatif dans un français actuel.
- source_word: δὲ
  choice: Mais
  rationale: 'La particule marque ici un léger contraste avec ce qui précède : Paul oppose la vantardise illégitime à la seule manière légitime de se vanter.'
- source_word: καυχώμενος / καυχάσθω
  choice: se vante / se vante
  rationale: La répétition du même verbe reproduit la force rhétorique du grec. « Se vanter » est clair et actuel, tandis que la tournure « que… se vante » rend directement la valeur impérative de καυχάσθω.
- source_word: ἐν
  choice: dans
  rationale: « Dans le Seigneur » conserve la construction grecque et son ambiguïté féconde entre sphère, fondement et objet de la fierté, tout en rappelant la formulation de Jérémie.
- source_word: κυρίῳ
  choice: le Seigneur
  rationale: Le grec ne précise pas davantage le référent. « Le Seigneur » respecte donc le texte sans imposer ici « Dieu » ou « le Seigneur Jésus ».
theological_decisions:
- issue: Référent de « le Seigneur » dans le contexte d’une allusion scripturaire
  choice: le Seigneur
  alternative: Dieu ; le Seigneur Jésus
  rationale: Paul fait écho à l’appel de Jérémie à placer sa fierté dans le Seigneur, mais κυρίῳ n’explicite pas ici davantage le référent. La traduction préserve cette résonance scripturaire ainsi que la tension possible dans l’usage paulinien.
translation_notes:
  register: Français international moderne, sobre et digne. « Se vanter » garde la pointe rhétorique du grec; la répétition et l’impératif à la troisième personne ont été conservés. La locution « dans le Seigneur », légèrement marquée en français courant, est maintenue pour préserver la formulation paulinienne et son écho scripturaire.
