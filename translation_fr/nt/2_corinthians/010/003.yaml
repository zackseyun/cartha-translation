  text: ἐν σαρκὶ γὰρ περιπατοῦντες οὐ κατὰ σάρκα στρατευόμεθα—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/003.yaml
  text: For though we walk in the flesh[a], we do not wage war according to the flesh—
translation:
  language: fr
  text: Car, bien que nous vivions dans la chair[a], nous ne combattons pas selon la chair —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Car, bien que nous vivions dans notre condition humaine, nous ne combattons pas selon des critères purement humains. »'
    reason: 'Cette autre formulation explicite les deux nuances contextuelles de σάρξ : l’existence corporelle dans la première proposition et les normes purement humaines dans la seconde.'
lexical_decisions:
- source_word: ἐν σαρκὶ
  choice: dans la chair
  rationale: Cette formulation conserve le terme répété σάρξ et désigne ici l’existence humaine incarnée, sans lui imposer le sens plus étroit de « nature pécheresse ».
- source_word: γὰρ
  choice: Car
  rationale: γάρ introduit l’explication de l’affirmation précédente ; « Car » maintient clairement le lien argumentatif.
- source_word: περιπατοῦντες
  choice: bien que nous vivions
  rationale: Le participe signifie littéralement « marchant », mais περιπατέω désigne couramment la manière de vivre. La tournure concessive rend le contraste avec la proposition principale dans un français naturel.
- source_word: οὐ κατὰ σάρκα
  choice: nous ne combattons pas selon la chair
  rationale: κατά exprime ici une norme ou un principe directeur. « Selon la chair » préserve à la fois la répétition rhétorique de σάρξ et l’ouverture entre les nuances humaine, charnelle et mondaine.
- source_word: στρατευόμεθα
  choice: nous ne combattons pas
  rationale: Le verbe relève de l’image militaire et évoque ici le combat apostolique. « Combattre » est idiomatique et maintient cette métaphore.
theological_decisions:
- issue: Sens de σάρξ dans ses deux occurrences
  choice: Conserver « chair » dans les deux propositions.
  alternative: « dans un corps … selon des critères purement humains » ou « dans la faiblesse humaine … d’une manière charnelle »
  rationale: La première occurrence renvoie principalement à la condition humaine incarnée, tandis que la seconde évoque des moyens ou des normes relevant de la chair. Répéter « chair » conserve le jeu rhétorique de Paul et la tension entre ces nuances sans introduire « nature pécheresse » ni réduire le second emploi aux seuls critères humains.
- issue: Valeur logique du participe περιπατοῦντες
  choice: Le rendre par la concession « bien que nous vivions ».
  alternative: « tandis que nous vivons »
  rationale: Le contraste avec οὐ κατὰ σάρκα στρατευόμεθα favorise une lecture concessive, tout en reconnaissant que la forme participiale grecque ne marque pas explicitement cette relation logique.
translation_notes:
  register: Français moderne, international et digne. « Vivions » évite l’étrangeté de « marchions dans la chair », tandis que « selon la chair » conserve volontairement la formulation paulinienne et son ambiguïté. Le tiret final maintient la continuité syntaxique avec le verset suivant.
