source:
  edition: SBLGNT
  text: οὐ γὰρ ὁ ἑαυτὸν ⸀συνιστάνων, ἐκεῖνός ἐστιν δόκιμος, ἀλλὰ ὃν ὁ κύριος συνίστησιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/018.yaml
  text: For it is not the one who commends himself who is approved[a], but the one whom the Lord commends.
translation:
  language: fr
  text: Car ce n’est pas celui qui se recommande lui-même qui est approuvé, mais celui que le Seigneur recommande.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνιστάνων / συνίστησιν
  choice: se recommande / recommande
  rationale: Dans ce contexte d’éloge et d’évaluation, « recommander » exprime l’action de présenter quelqu’un favorablement. La répétition du même verbe français préserve le lien lexical du grec.
- source_word: δόκιμος
  choice: reconnu comme ayant fait ses preuves
  rationale: δόκιμος désigne celui qui, après examen, est reconnu comme éprouvé ou approuvé. Cette formulation française fait ressortir l’idée d’évaluation et évite la possible ambiguïté de « celui qui est approuvé », qui pourrait paraître redoubler simplement « recommandé ».
- source_word: κύριος
  choice: le Seigneur
  rationale: Le titre grec est traduit de manière habituelle sans préciser dans le texte l’identité du référent.
- source_word: ἑαυτὸν
  choice: lui-même
  rationale: Le pronom réfléchi renvoie au sujet masculin singulier de la construction et souligne l’opposition entre l’auto-recommandation et la recommandation du Seigneur.
- source_word: ὃν
  choice: celui que
  rationale: Cette formulation rend explicite et naturelle en français l’opposition entre deux personnes évaluées.
- source_word: γὰρ
  choice: Car
  rationale: « Car » conserve la fonction explicative de γάρ et relie le verset au raisonnement précédent.
theological_decisions:
- issue: Référent de ὁ κύριος
  choice: le Seigneur
  alternative: le Seigneur Jésus ; Dieu
  rationale: Dans l’usage paulinien, le titre renvoie souvent à Jésus, mais le verset ne donne que κύριος. La traduction conserve cette formulation sans résoudre davantage le référent.
translation_notes:
  register: Français moderne, digne et accessible. La formulation conserve le parallélisme du verbe συνίστημι et distingue nettement la recommandation de la reconnaissance qui résulte d’une mise à l’épreuve.
