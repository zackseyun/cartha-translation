reference: 2 Corinthians 4:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τὰ γὰρ πάντα δι’ ὑμᾶς, ἵνα ἡ χάρις πλεονάσασα διὰ τῶν πλειόνων τὴν εὐχαριστίαν περισσεύσῃ εἰς τὴν δόξαν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/015.yaml
  text: For all things are for your sake[a], so that as grace increases through more and more people, thanksgiving may overflow to the glory of God.
translation:
  language: fr
  text: Car tout est pour vous, afin que, la grâce se multipliant par un nombre toujours plus grand de personnes[a], la reconnaissance abonde pour la gloire de Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « par le plus grand nombre » ou « par un plus grand nombre ». Le grec peut désigner soit un grand nombre de personnes, soit un nombre de personnes qui augmente.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ γὰρ πάντα
  choice: Car tout
  rationale: « Car » conserve la fonction explicative de γάρ, tandis que « tout » garde la portée globale de τὰ πάντα sans préciser indûment son contenu.
- source_word: δι’ ὑμᾶς
  choice: est pour vous
  rationale: Avec l’accusatif, διά exprime ici l’intérêt ou l’avantage des destinataires. « Pour vous » est naturel en français et transmet cette idée de bénéfice.
- source_word: ἵνα
  choice: afin que
  rationale: Cette tournure conserve clairement la valeur de but, avec une possible nuance de résultat.
- source_word: ἡ χάρις πλεονάσασα
  choice: à mesure que la grâce se répand
  rationale: La construction participiale indique l’accroissement de la grâce en lien avec le groupe qui s’élargit. Cette formulation française est fluide tout en conservant l’image d’une grâce qui gagne en extension.
- source_word: διὰ τῶν πλειόνων
  choice: parmi des personnes toujours plus nombreuses
  rationale: Le comparatif substantivé peut désigner « la multitude », « un plus grand nombre » ou un nombre croissant de personnes. Le texte retient le sens expansif suggéré par le contexte, tout en signalant les autres possibilités en note.
- source_word: τὴν εὐχαριστίαν
  choice: la reconnaissance
  rationale: Le nom désigne ici la gratitude qui s’exprime envers Dieu. « La reconnaissance » est clair, naturel et ne réduit pas le terme à une formule liturgique.
- source_word: περισσεύσῃ
  choice: déborde
  rationale: Le verbe exprime une abondance qui dépasse la mesure. « Déborde » en restitue l’image avec force et naturel.
- source_word: εἰς τὴν δόξαν τοῦ θεοῦ
  choice: à la gloire de Dieu
  rationale: 'La préposition εἰς marque ici l’aboutissement ou le résultat : cette reconnaissance contribue à la gloire de Dieu.'
theological_decisions:
- issue: Référent et portée de « la grâce » dans la proposition de but
  choice: Conserver « la grâce » comme faveur divine à l’œuvre et en expansion, sans en définir plus étroitement le mécanisme.
  alternative: Comprendre spécifiquement la grâce comme le salut reçu par un nombre croissant de personnes, ou comme l’action bienveillante de Dieu dans le ministère apostolique.
  rationale: Le verset ne tranche pas entre ces nuances. Une formulation ouverte préserve la richesse théologique du terme χάρις.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la progression entre l’expansion de la grâce, l’abondance de la reconnaissance et la gloire de Dieu, sans imposer une interprétation doctrinale plus précise que le grec.
