revisions:
- from: Au contraire, nous avons renoncé aux pratiques honteuses que l’on cache. Nous ne nous conduisons pas avec ruse et nous ne falsifions pas[a] la parole de Dieu. Mais, en manifestant ouvertement la vérité[b], nous nous recommandons à toute conscience humaine devant Dieu.
  to: Mais nous avons renoncé aux pratiques honteuses cachées, sans user de ruse ni falsifier[a] la parole de Dieu. Au contraire, en faisant connaître la vérité au grand jour[b], nous nous recommandons à la conscience de chacun devant Dieu.
  rationale: La révision emploie « Mais » pour le contraste initial et réserve « Au contraire » à l’opposition explicite introduite par le δεύτερο ἀλλά. Elle rend les participes négatifs par « sans user… ni falsifier » et τῇ φανερώσει τῆς ἀληθείας par une expression française naturelle qui maintient l’idée de divulgation publique. Les deux notes restent ancrées aux termes pertinents et proposent de véritables alternatives.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T11:37:18Z'
review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est bien rendu : renoncement aux réalités honteuses cachées, rejet de la ruse et de la falsification de la parole de Dieu, puis recommandation par la mise en lumière de la vérité. Toutefois, « Au contraire » force légèrement la valeur de ἀλλά, qui introduit ici plus simplement le contraste (« Mais »), et « en manifestant ouvertement » est redondant puisque manifester implique déjà de rendre manifeste.'
  naturalness: Le français est clair et de registre approprié. Une formulation plus resserrée conserve mieux l’enchaînement des participes grecs et évite l’explicitation un peu interprétative de « que l’on cache ». « À la conscience de chacun » est plus idiomatique que « à toute conscience humaine », tout en gardant la portée distributive.
  terminology: « Renoncé », « ruse », « falsifier la parole de Dieu » et « devant Dieu » sont exacts et naturels. « Les pratiques honteuses cachées » rend de manière sûre les « choses cachées de la honte » dans ce contexte, sans étendre indûment le sens. La note sur δολοῦντες est utile ; la note sur φανέρωσις doit correspondre à une véritable variante de la formulation retenue.
  issues:
  - severity: low
    issue: « Au contraire » est plus marqué que ἀλλά.
    rationale: Le grec oppose les conduites rejetées à la manifestation de la vérité, sans exiger nécessairement l’intensité argumentative de « au contraire ». « Mais » est plus direct et plus souple.
  - severity: low
    issue: « en manifestant ouvertement » est pléonastique.
    rationale: φανέρωσις signifie déjà manifestation, dévoilement ou mise en évidence. « Au grand jour » peut rendre l’aspect public sans redoubler inutilement le verbe « manifester ».
  - severity: low
    issue: La note b donne comme variante la formulation même qui serait retenue par une révision littérale.
    rationale: Une note d’alternative lexicale doit offrir une option réellement distincte et conserver l’ancrage sur l’expression concernée.
