reference: 2 Corinthians 4:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀλλὰ ἀπειπάμεθα τὰ κρυπτὰ τῆς αἰσχύνης, μὴ περιπατοῦντες ἐν πανουργίᾳ μηδὲ δολοῦντες τὸν λόγον τοῦ θεοῦ, ἀλλὰ τῇ φανερώσει τῆς ἀληθείας ⸀συνιστάνοντες ἑαυτοὺς πρὸς πᾶσαν συνείδησιν ἀνθρώπων ἐνώπιον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/002.yaml
  text: Instead[a], we have renounced the hidden things of shame, not walking in cunning nor falsifying the word of God[b], but by the open display of the truth commending ourselves to every human conscience before God.
translation:
  language: fr
  text: Mais nous avons renoncé aux pratiques honteuses cachées, sans user de ruse ni falsifier[a] la parole de Dieu. Au contraire, en faisant connaître la vérité au grand jour[b], nous nous recommandons à la conscience de chacun devant Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ni la frelater ». Le verbe grec peut évoquer l’altération frauduleuse d’un produit par mélange.
    reason: lexical_alternative
  - marker: b
    text: Ou « par la manifestation de la vérité ». Le grec emploie un nom et met l’accent sur le fait de rendre la vérité visible ou évidente, sans le limiter à la seule proclamation verbale.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπειπάμεθα
  choice: nous avons renoncé
  rationale: L’aoriste moyen exprime ici une répudiation nette; « renoncer à » est naturel et suffisamment fort en français moderne.
- source_word: τὰ κρυπτὰ τῆς αἰσχύνης
  choice: aux pratiques honteuses que l’on cache
  rationale: Cette formulation rend l’idée de réalités ou de conduites dissimulées parce qu’elles sont honteuses, sans reproduire servilement un génitif grec peu naturel en français.
- source_word: μὴ περιπατοῦντες ἐν πανουργίᾳ
  choice: Nous ne nous conduisons pas avec ruse
  rationale: Le sens métaphorique de περιπατέω porte sur la conduite; πανουργία désigne ici une habileté sans scrupules, rendue clairement par « ruse ».
- source_word: δολοῦντες
  choice: nous ne falsifions pas
  rationale: Le verbe évoque une altération trompeuse. « Falsifier » est clair, actuel et conserve l’idée d’une manipulation frauduleuse.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: la parole de Dieu
  rationale: Formulation française établie qui garde la portée de λόγος sans le réduire explicitement au seul discours oral ou au seul texte écrit.
- source_word: τῇ φανερώσει τῆς ἀληθείας
  choice: en manifestant ouvertement la vérité
  rationale: φανέρωσις désigne le fait de rendre manifeste. Cette traduction évite de limiter le terme à la proclamation verbale tout en soulignant la transparence opposée à la dissimulation.
- source_word: συνιστάνοντες ἑαυτούς
  choice: nous nous recommandons
  rationale: Dans ce contexte, συνίστημι signifie se présenter de manière à être reconnu ou approuvé; « se recommander à » est idiomatique et conserve la formulation paulinienne.
- source_word: πρὸς πᾶσαν συνείδησιν ἀνθρώπων
  choice: à toute conscience humaine
  rationale: La traduction garde la valeur distributive de πᾶσαν et la portée générique de ἀνθρώπων.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: devant Dieu
  rationale: Expression concise qui conserve l’idée de la présence et du jugement de Dieu comme témoin.
theological_decisions:
- issue: Portée de l’opposition entre ministère trompeur et manifestation de la vérité
  choice: Présenter le verset comme une affirmation de transparence éthique dans la conduite et la communication apostoliques.
  alternative: En faire exclusivement une condamnation de procédés rhétoriques, ou une formulation technique sur toute utilisation des Écritures.
  rationale: Le contexte immédiat concerne la manière dont Paul exerce son ministère. La traduction garde cette portée sans introduire une doctrine technique plus étroite ou plus large que le texte.
- issue: Sens de « parole de Dieu »
  choice: Conserver une expression large qui peut désigner le message venant de Dieu tel qu’il est communiqué.
  alternative: Préciser « les Écritures » ou, à l’inverse, « notre prédication » seulement.
  rationale: λόγος ne tranche pas ici entre ces précisions; conserver « parole de Dieu » respecte cette amplitude.
translation_notes:
  register: Français international moderne, digne et accessible. Les deux premières propositions participiales grecques sont rendues par une nouvelle phrase verbale pour éviter une construction lourde. « Pratiques » explicite légèrement le référent contextuel de « choses cachées », tandis que la note sur « manifestation » préserve la nuance lexicale de φανέρωσις.
