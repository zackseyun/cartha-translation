id: 2CO.4.11
reference: 2 Corinthians 4:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀεὶ γὰρ ἡμεῖς οἱ ζῶντες εἰς θάνατον παραδιδόμεθα διὰ Ἰησοῦν, ἵνα καὶ ἡ ζωὴ τοῦ Ἰησοῦ φανερωθῇ ἐν τῇ θνητῇ σαρκὶ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/011.yaml
  text: For we who are living are always being handed over to death for Jesus’ sake[b][a], so that the life of Jesus also may be revealed in our mortal flesh.
translation:
  language: fr
  text: Car nous qui vivons, nous sommes sans cesse livrés à la mort à cause de Jésus[a], afin que la vie de Jésus, elle aussi, soit manifestée dans notre chair mortelle[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour Jésus » ou « par attachement à Jésus ».
    reason: lexical_alternative
  - marker: b
    text: Ici, « chair » désigne l’existence corporelle mortelle, et non la « nature pécheresse ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀεὶ
  choice: sans cesse
  rationale: Exprime la situation constante ou répétée des apôtres dans un français naturel; « toujours » serait également possible.
- source_word: γάρ
  choice: Car
  rationale: Conserve le lien explicatif avec le verset précédent sans préciser davantage la relation logique.
- source_word: ἡμεῖς οἱ ζῶντες
  choice: nous qui vivons
  rationale: Rend le participe substantivé au présent et maintient le contraste direct entre la vie actuelle et la mort.
- source_word: εἰς θάνατον παραδιδόμεθα
  choice: nous sommes sans cesse livrés à la mort
  rationale: Le passif préserve l'absence d'agent explicite, tandis que « à la mort » rend la destination ou l'issue visée par εἰς.
- source_word: διὰ Ἰησοῦν
  choice: à cause de Jésus
  rationale: διά avec l'accusatif indique ici naturellement la cause; la note conserve les nuances possibles de motif ou d'engagement en faveur de Jésus.
- source_word: ἵνα
  choice: afin que
  rationale: Préserve la portée de but ou de résultat sans la trancher artificiellement.
- source_word: καὶ ἡ ζωὴ τοῦ Ἰησοῦ
  choice: la vie de Jésus, elle aussi
  rationale: La tournure met en relief καί et maintient le parallélisme avec l'exposition à la mort à cause de Jésus.
- source_word: φανερωθῇ
  choice: soit manifestée
  rationale: Rend le passif aoriste subjonctif sans ajouter d'agent et conserve l'idée d'une réalité rendue perceptible.
- source_word: ἐν τῇ θνητῇ σαρκὶ ἡμῶν
  choice: dans notre chair mortelle
  rationale: Conserve le terme concret σάρξ ainsi que le singulier collectif; « mortelle » montre qu'il s'agit ici de l'existence corporelle vulnérable.
theological_decisions:
- issue: Sens de διὰ Ἰησοῦν
  choice: à cause de Jésus
  alternative: pour Jésus / par attachement à Jésus
  rationale: La construction avec l'accusatif exprime d'abord la cause, mais le contexte permet aussi d'entendre que cette souffrance est assumée pour Jésus; la note préserve cette amplitude.
- issue: Sens de σάρξ dans un contexte paulinien
  choice: chair au sens de condition corporelle mortelle
  alternative: corps; nature pécheresse
  rationale: L'adjectif « mortelle » situe clairement σάρξ dans l'existence physique exposée à la mort. Traduire par « nature pécheresse » introduirait ici un sens moral absent du contexte; « corps » serait clair mais effacerait le terme choisi par Paul.
- issue: Rapport exprimé par ἵνα
  choice: afin que, en laissant ouverte la relation de but et de résultat
  alternative: de sorte que
  rationale: Le grec peut présenter la manifestation de la vie de Jésus comme finalité et, contextuellement, comme résultat; « afin que » conserve la force télique sans exclure la conséquence.
translation_notes:
  register: Français international moderne, digne et accessible. « Sans cesse » rend l'aspect continu de la situation sans suggérer un événement littéralement ininterrompu. La répétition « nous » est idiomatique en français et fait ressortir le groupe désigné par « ceux qui vivent ». Les marqueurs de notes sont placés immédiatement après les expressions concernées.
