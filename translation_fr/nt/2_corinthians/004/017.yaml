  text: τὸ γὰρ παραυτίκα ἐλαφρὸν τῆς θλίψεως ⸀ἡμῶν καθ’ ὑπερβολὴν εἰς ὑπερβολὴν αἰώνιον βάρος δόξης κατεργάζεται ἡμῖν,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/017.yaml
  text: For our momentary light affliction is producing for us an eternal weight of glory beyond all comparison,[a]
translation:
  language: fr
  text: Car la légère détresse du moment produit pour nous, au-delà de toute mesure,[a] un poids éternel de gloire.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de façon surabondante, au-delà de toute mesure » ; le grec dit littéralement « selon l’excès jusqu’à l’excès », une tournure qui exprime une mesure extraordinaire.
    reason: lexical_alternative
lexical_decisions:
- source_word: παραυτίκα
  choice: momentanée
  rationale: Le terme désigne ce qui ne dure que le moment présent. « Momentanée » exprime naturellement le contraste avec « éternel ».
- source_word: ἐλαφρὸν
  choice: légère
  rationale: « Légère » conserve l’antithèse métaphorique voulue avec le « poids » (βάρος), sans nier la réalité de la détresse.
- source_word: θλίψεως
  choice: détresse
  rationale: Le mot évoque pression, épreuve et souffrance. « Détresse » est actuel et grave, sans les connotations eschatologiques parfois attachées à « tribulation ».
- source_word: ἡμῶν
  choice: notre
  rationale: Le génitif rattache la détresse à Paul et à ses compagnons; la traduction conserve directement cette relation possessive.
- source_word: καθ’ ὑπερβολὴν εἰς ὑπερβολὴν
  choice: qui dépasse toute mesure
  rationale: Cette répétition idiomatique exprime une intensité extraordinaire. La formulation française rend sa force superlative tout en restant naturelle.
- source_word: αἰώνιον
  choice: éternel
  rationale: « Éternel » rend le contraste temporel explicite avec la détresse momentanée et convient à l’emploi eschatologique du passage.
- source_word: βάρος
  choice: poids
  rationale: « Poids » préserve l’image et son opposition délibérée à « légère »; « fardeau » aurait une nuance négative étrangère à la gloire.
- source_word: δόξης
  choice: de gloire
  rationale: Le complément de nom garde l’expression dense « poids de gloire » au lieu de l’aplanir en simple adjectif.
- source_word: κατεργάζεται
  choice: produit
  rationale: Le présent exprime une action efficace en cours. « Produit » rend la relation de résultat sans préciser davantage son mécanisme.
- source_word: ἡμῖν
  choice: pour nous
  rationale: Le datif indique vraisemblablement l’avantage ou le bénéficiaire. « Pour nous » évite de réduire le propos à une transformation morale intérieure.
- source_word: τὸ ... ἐλαφρὸν τῆς θλίψεως ἡμῶν
  choice: notre détresse légère et momentanée
  rationale: Cette formulation française naturelle réunit la possession, la légèreté relative et la brièveté de l’épreuve, tout en préparant les contrastes du verset.
theological_decisions:
- issue: Nature du rapport entre la détresse présente et la gloire
  choice: La détresse présente aboutit à une gloire éternelle pour les croyants, sans que la traduction affirme qu’elle mérite le salut.
  alternative: La détresse gagne la gloire par mérite humain, ou ne produit qu’une maturité spirituelle présente.
  rationale: L’opposition entre « momentanée » et « éternel » oriente vers un résultat eschatologique. « Produit pour nous » conserve la forte relation causale du texte sans introduire une théorie du mérite.
translation_notes:
  register: Français international moderne, digne et accessible. Les images corrélées « légère » et « poids » sont maintenues. « Détresse » évite à la fois un vocabulaire archaïque et une minimisation de la souffrance; sa légèreté est relative au poids éternel de gloire.
