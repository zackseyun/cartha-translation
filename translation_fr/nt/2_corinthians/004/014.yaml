id: 2CO.4.14
reference: 2 Corinthians 4:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἰδότες ὅτι ὁ ἐγείρας ⸀τὸν Ἰησοῦν καὶ ἡμᾶς ⸀σὺν Ἰησοῦ ἐγερεῖ καὶ παραστήσει σὺν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/014.yaml
  text: because we know that the one who raised Jesus will also raise us with Jesus and will present us with you[a].
translation:
  language: fr
  text: car nous savons que celui qui a ressuscité Jésus nous ressuscitera aussi avec Jésus et nous présentera avec vous.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Certains manuscrits portent « le Seigneur Jésus » au lieu de « Jésus ».
    reason: textual_variant
lexical_decisions:
- source_word: εἰδότες
  choice: car nous savons que
  rationale: Le participe parfait a ici une valeur causale dans le contexte; cette formulation naturelle en français exprime le fondement de l’espérance et de la persévérance de Paul.
- source_word: ὁ ἐγείρας τὸν Ἰησοῦν
  choice: celui qui a ressuscité Jésus
  rationale: Cette formulation rend naturellement le participe aoriste substantivé et suit le texte principal du SBLGNT, qui porte « Jésus ».
- source_word: καὶ ἡμᾶς … ἐγερεῖ
  choice: nous ressuscitera aussi
  rationale: « Aussi » conserve la force additive de καί et relie explicitement la résurrection future des croyants à celle de Jésus.
- source_word: σὺν Ἰησοῦ
  choice: avec Jésus
  rationale: σύν avec le datif exprime ici l’association; « avec Jésus » préserve cette simplicité sans introduire une nuance instrumentale.
- source_word: παραστήσει
  choice: nous fera paraître devant lui
  rationale: Le verbe signifie faire tenir ou présenter en présence de quelqu’un. Cette formulation française explicite idiomatiquement la comparution sans préciser au-delà du grec la nature exacte de la scène eschatologique.
- source_word: σὺν ὑμῖν
  choice: avec vous
  rationale: La formulation conserve l’association collective de Paul et des Corinthiens dans l’espérance eschatologique.
theological_decisions:
- issue: Variante textuelle après ἐγείρας
  choice: Jésus
  alternative: le Seigneur Jésus
  rationale: Le texte principal suit le SBLGNT. La leçon plus longue, bien attestée, est signalée en note sans faire d’une variante textuelle une décision doctrinale.
- issue: Portée eschatologique de παραστήσει
  choice: nous fera paraître avec vous devant lui
  alternative: nous présentera avec vous
  rationale: Le contexte de résurrection indique une présentation future devant Dieu. « Devant lui » rend explicite le complément implicite requis en français tout en laissant ouverte la nature précise de cette comparution.
translation_notes:
  register: Français international moderne, digne et accessible. La structure causale du verset est conservée, ainsi que le parallélisme entre la résurrection de Jésus et celle des croyants. Le pronom « lui » renvoie naturellement à « celui qui a ressuscité Jésus ».
