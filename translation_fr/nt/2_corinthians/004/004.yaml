  variant: modern international French
source:
  edition: SBLGNT
  text: ἐν οἷς ὁ θεὸς τοῦ αἰῶνος τούτου ἐτύφλωσεν τὰ νοήματα τῶν ἀπίστων εἰς τὸ μὴ ⸀αὐγάσαι τὸν φωτισμὸν τοῦ εὐαγγελίου τῆς δόξης τοῦ Χριστοῦ, ὅς ἐστιν εἰκὼν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/004.yaml
  text: In their case[a], the god of this age has blinded the minds of the unbelieving, so that the light of the gospel of the glory of Messiah, who is the image of God[c][b], might not shine on them.
translation:
  language: fr
  text: Chez eux, le dieu de cette époque a aveuglé l’intelligence des incrédules, afin que la lumière de l’Évangile de la gloire du Messie, qui est l’image de Dieu, ne brille pas sur eux.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « afin qu’ils ne voient pas la lumière de l’Évangile de la gloire du Messie ». Le verbe grec, rare, peut mettre l’accent soit sur le rayonnement de la lumière, soit sur le fait de la percevoir.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « le dieu de ce monde ». Le grec aiôn signifie normalement « époque » et souligne ici l’époque présente marquée par le mal.'
    reason: lexical_alternative
  - marker: c
    text: Grec Christos ; rendu ici par « Messie » parce que le mot fonctionne comme un titre.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν οἷς
  choice: Chez eux
  rationale: Renvoie aux personnes qui se perdent mentionnées dans le contexte précédent. Cette formulation française exprime naturellement « dans leur cas » sans suggérer une présence intérieure.
- source_word: ὁ θεὸς τοῦ αἰῶνος τούτου
  choice: le dieu de l’ère présente
  rationale: αἰών désigne ici l’ère actuelle plutôt que le monde créé. La minuscule à « dieu » distingue ce pouvoir usurpateur du vrai Dieu sans préciser davantage son identité.
- source_word: ἐτύφλωσεν
  choice: a aveuglé
  rationale: Le passé composé rend naturellement l’aoriste et laisse percevoir le résultat présent de l’action.
- source_word: τὰ νοήματα
  choice: l’intelligence
  rationale: Le terme vise la faculté de comprendre et de percevoir. Le singulier collectif est idiomatique en français dans la construction « l’intelligence des incroyants ».
- source_word: τῶν ἀπίστων
  choice: des incroyants
  rationale: Désigne ceux qui ne croient pas, sans ajouter la nuance morale plus forte d’« infidèles ».
- source_word: εἰς τὸ μὴ αὐγάσαι
  choice: afin que ne brille pas sur eux
  rationale: La construction exprime le but ou le résultat. Le verbe rare peut évoquer soit la lumière qui brille, soit sa perception; le texte principal retient la première analyse et la note conserve l’autre.
- source_word: τὸν φωτισμὸν
  choice: la lumière
  rationale: Dans cette métaphore, « lumière » est plus naturel que « illumination » tout en restituant fidèlement l’idée de clarté rayonnante.
- source_word: τοῦ εὐαγγελίου
  choice: de l’Évangile
  rationale: Terme établi, clair et digne pour la bonne nouvelle chrétienne.
- source_word: τῆς δόξης
  choice: de la gloire
  rationale: Conserve la chaîne de génitifs grecque et son ambiguïté relationnelle au lieu de réduire l’expression à « le glorieux Évangile ».
- source_word: τοῦ Χριστοῦ
  choice: du Messie
  rationale: Χριστός fonctionne ici comme un titre; « Messie » en rend explicitement la valeur.
- source_word: ὅς ἐστιν εἰκὼν τοῦ θεοῦ
  choice: lui qui est l’image de Dieu
  rationale: Préserve sans développement explicatif l’affirmation christologique directe et la résonance paulinienne d’« image de Dieu ».
theological_decisions:
- issue: Référent du « dieu de l’ère présente »
  choice: Conserver l’expression sans remplacer son référent par « Satan »
  alternative: Le dieu de ce monde; ou une désignation explicite de Satan
  rationale: Le grec évoque vraisemblablement une puissance mauvaise personnelle dominant l’ère actuelle, mais ne la nomme pas. La traduction évite donc aussi bien de l’identifier explicitement que de la réduire à un système impersonnel.
- issue: Fonction de αὐγάσαι avec φωτισμός
  choice: La lumière de l’Évangile ne brille pas sur les incroyants
  alternative: Les incroyants ne voient pas la lumière de l’Évangile
  rationale: Le verbe est rare et permet les deux analyses. La formulation principale privilégie le rayonnement de la lumière, tandis que la note signale loyalement la lecture perceptive.
- issue: Portée de « l’image de Dieu »
  choice: Maintenir l’identification directe du Messie comme image de Dieu
  alternative: Développer l’expression à l’aide d’une terminologie doctrinale postérieure
  rationale: Le texte affirme une relation christologique forte, mais la traduction n’ajoute aucune explication étrangère à la formulation grecque.
translation_notes:
  register: Français international moderne, digne et accessible. « Ère présente » évite l’ambiguïté cosmologique de « monde »; « chez eux » et « l’intelligence des incroyants » assurent une lecture naturelle. Les marqueurs sont regroupés en fin de verset, tout en correspondant chacun à une décision présente dans le texte.
