reference: 2 Corinthians 4:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: μὴ σκοπούντων ἡμῶν τὰ βλεπόμενα ἀλλὰ τὰ μὴ βλεπόμενα, τὰ γὰρ βλεπόμενα πρόσκαιρα, τὰ δὲ μὴ βλεπόμενα αἰώνια.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/018.yaml
  text: as we look not to the things that are seen but to the things that are not seen. For the things that are seen are temporary[a], but the things that are not seen are eternal.
translation:
  language: fr
  text: Nous portons notre attention non pas sur ce qui se voit, mais sur ce qui ne se voit pas. Car ce qui se voit est temporaire, mais ce qui ne se voit pas est éternel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σκοπούντων
  choice: portons notre attention sur
  rationale: Le participe présent exprime ici le fait de diriger son regard ou son attention vers quelque chose. Cette formulation française conserve l'idée d'une orientation délibérée sans réduire le verbe à la seule perception visuelle.
- source_word: μὴ
  choice: non
  rationale: La négation simple porte sur le premier objet de l'attention; aucune nuance temporelle telle que « ne… plus » n'est présente.
- source_word: τὰ βλεπόμενα
  choice: ce qui se voit
  rationale: Le participe présent substantivé neutre pluriel désigne les réalités perceptibles à la vue. Le singulier collectif français est naturel et permet de reproduire exactement le parallélisme avec « ce qui ne se voit pas ».
- source_word: ἀλλὰ
  choice: mais
  rationale: La conjonction marque nettement l'opposition entre les deux objets de l'attention.
- source_word: τὰ μὴ βλεπόμενα
  choice: ce qui ne se voit pas
  rationale: Cette formulation reste concrète et parallèle à « ce qui se voit », sans transformer l'opposition en distinction philosophique entre le matériel et le spirituel.
- source_word: γὰρ
  choice: En effet
  rationale: La conjonction introduit la raison explicative de l'affirmation précédente. « En effet » exprime clairement ce rapport argumentatif en français courant.
- source_word: πρόσκαιρα
  choice: temporaire
  rationale: L'adjectif désigne ce qui ne dure qu'un temps. « Temporaire » est clair et forme une opposition directe avec « éternel », sans reprendre indûment la nuance plus forte de « momentané » au verset 17.
- source_word: δέ
  choice: mais
  rationale: La particule introduit le second membre de l'antithèse et se rend naturellement par « mais ».
- source_word: αἰώνια
  choice: éternel
  rationale: Dans son opposition à πρόσκαιρα, le terme qualifie ce qui demeure et appartient à l'ordre éternel. « Éternel » est la formulation française naturelle et traditionnelle dans ce contexte.
- source_word: ἡμῶν
  choice: nous
  rationale: Le pronom au génitif est le sujet logique du participe. Une proposition verbale avec « nous » rend naturellement cette relation en français.
theological_decisions:
- issue: Opposition entre ce qui se voit et ce qui ne se voit pas
  choice: Conserver les expressions concrètes « ce qui se voit » et « ce qui ne se voit pas ».
  alternative: « les réalités visibles… les réalités invisibles » ou « les choses matérielles… les choses spirituelles »
  rationale: Paul oppose les réalités vues et non vues sans les identifier explicitement aux catégories philosophiques du matériel et du spirituel. La traduction maintient donc l'ambiguïté et la tension du texte.
translation_notes:
  register: Français international moderne, digne et accessible. Le début en « car » conserve le lien syntaxique du participe avec le verset précédent; « En effet » évite ensuite une répétition lourde de « car ». Le parallélisme « ce qui se voit / ce qui ne se voit pas » reproduit la structure rhétorique grecque.
