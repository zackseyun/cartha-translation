  text: ὥστε ⸀ὁ θάνατος ἐν ἡμῖν ἐνεργεῖται, ἡ δὲ ζωὴ ἐν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/012.yaml
  text: So then[a], death is at work in us, but life in you.
translation:
  language: fr
  text: Ainsi donc, la mort est à l’œuvre en nous, mais la vie en vous.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὥστε
  choice: Ainsi donc
  rationale: Dans ce contexte, ὥστε introduit la conséquence ou la conclusion de ce qui précède. « Ainsi donc » rend clairement cette valeur inférentielle en français naturel.
- source_word: ὁ θάνατος
  choice: la mort
  rationale: Le nom abstrait français prend naturellement l’article défini. Le choix conserve toute l’amplitude de l’image de la mort à l’œuvre dans les souffrances apostoliques.
- source_word: ἐν ἡμῖν
  choice: en nous
  rationale: Cette formulation directe respecte le parallélisme avec ἐν ὑμῖν et peut désigner à la fois l’expérience personnelle et collective des apôtres.
- source_word: ἐνεργεῖται
  choice: est à l’œuvre
  rationale: Cette expression idiomatique rend l’action effective et continue exprimée par le verbe, sans le ton technique de « opère ».
- source_word: ἡ δὲ ζωὴ
  choice: mais la vie
  rationale: « Mais » fait ressortir l’opposition marquée par δέ entre la mort et la vie. L’article défini convient aux noms abstraits en français.
- source_word: ἐν ὑμῖν
  choice: en vous
  rationale: Le choix maintient la construction concise et symétrique du grec, tout en laissant ouvertes les dimensions communautaire et personnelle.
theological_decisions:
- issue: Sens de l’opposition entre la mort et la vie
  choice: Conserver les termes littéraux « mort » et « vie », qui opposent les souffrances mortelles des apôtres à la vie communiquée aux Corinthiens par leur ministère.
  alternative: Préciser qu’il s’agit exclusivement de mort physique, de renoncement spirituel à soi-même ou de vie éternelle.
  rationale: Le contexte immédiat associe la mort et la vie de Jésus à l’existence corporelle des apôtres, tandis que l’argument plus large concerne un ministère qui apporte la vie. La formulation concise préserve cette richesse sans réduire la tension théologique.
translation_notes:
  register: Français international moderne, sobre et digne. La proposition finale conserve l’ellipse verbale du grec (« mais la vie en vous »), qui renforce l’antithèse et reste naturelle en français.
