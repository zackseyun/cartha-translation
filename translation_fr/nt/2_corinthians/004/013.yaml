  text: Ἔχοντες δὲ τὸ αὐτὸ πνεῦμα τῆς πίστεως, κατὰ τὸ γεγραμμένον· Ἐπίστευσα, διὸ ἐλάλησα, καὶ ἡμεῖς πιστεύομεν, διὸ καὶ λαλοῦμεν,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/013.yaml
  text: But having the same spirit of faith[a], according to what is written, “I believed; therefore I spoke,” we also believe; therefore we also speak[b],
translation:
  language: fr
  text: 'Mais, ayant le même esprit de foi[a], conformément à ce qui est écrit : « J’ai cru, c’est pourquoi j’ai parlé », nous aussi, nous croyons ; c’est pourquoi nous parlons[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le même Esprit de foi », si le mot grec désigne ici l’Esprit Saint plutôt qu’une disposition commune animée par la foi.'
    reason: alternative_reading
  - marker: b
    text: Paul cite le Psaume 116.10 (115.1 dans la Septante) et associe ainsi sa propre foi et sa parole au témoignage du psalmiste.
    reason: cross_reference
lexical_decisions:
- source_word: Ἔχοντες δὲ
  choice: Mais puisque nous avons
  rationale: Le participe présent est rendu par une proposition causale naturelle en français, son lien logique avec « nous parlons » étant implicite dans le grec et clair dans le contexte. δέ marque ici une légère opposition ou une progression argumentative.
- source_word: τὸ αὐτὸ πνεῦμα τῆς πίστεως
  choice: le même esprit de foi
  rationale: Cette formulation conserve le génitif et l’ambiguïté de πνεῦμα, qui peut désigner une disposition commune animée par la foi ou, éventuellement, l’Esprit Saint.
- source_word: κατὰ τὸ γεγραμμένον
  choice: conformément à ce qui est écrit
  rationale: Formule française actuelle et digne qui conserve l’idée de conformité au témoignage écrit des Écritures.
- source_word: Ἐπίστευσα, διὸ ἐλάλησα
  choice: J’ai cru, c’est pourquoi j’ai parlé
  rationale: Le passé composé rend naturellement les deux aoristes de la citation en français, tandis que « c’est pourquoi » exprime clairement la conséquence marquée par διό.
- source_word: καὶ ἡμεῖς πιστεύομεν
  choice: nous aussi, nous croyons
  rationale: Le pronom repris et « aussi » rendent l’insistance de ἡμεῖς et la correspondance établie avec le psalmiste.
- source_word: διὸ καὶ λαλοῦμεν
  choice: et c’est pourquoi nous parlons
  rationale: La coordination et la locution consécutive restituent le parallélisme logique sans produire une tournure française inutilement raide.
theological_decisions:
- issue: πνεῦμα désigne-t-il ici l’Esprit Saint ou un esprit, une disposition commune, caractérisé par la foi ?
  choice: « esprit de foi », avec une minuscule dans le texte principal
  alternative: « Esprit de foi », si πνεῦμα renvoie à l’Esprit Saint
  rationale: Le lien immédiat avec la déclaration du psalmiste favorise l’idée d’un même élan ou d’une même disposition de foi, mais le grec ne tranche pas explicitement. La note préserve donc l’autre lecture théologiquement possible.
- issue: Rendu du groupe lexical πιστ-
  choice: « foi », « j’ai cru », « nous croyons »
  alternative: « confiance », « j’ai fait confiance », « nous faisons confiance »
  rationale: « Foi » et « croire » maintiennent le lien lexical et le parallélisme entre la citation biblique et l’application que Paul en fait, tout en restant naturels en français.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe causale explicite le lien du participe grec avec la proposition principale, tandis que les répétitions « nous aussi, nous croyons » et « nous parlons » conservent la force rhétorique du verset.
