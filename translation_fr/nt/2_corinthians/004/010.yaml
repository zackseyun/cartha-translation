reference: 2 Corinthians 4:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: πάντοτε τὴν νέκρωσιν ⸀τοῦ Ἰησοῦ ἐν τῷ σώματι περιφέροντες, ἵνα καὶ ἡ ζωὴ τοῦ Ἰησοῦ ἐν τῷ σώματι ἡμῶν φανερωθῇ·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/010.yaml
  text: always carrying in the body the death of Jesus[a], so that the life of Jesus may also be revealed in our body.
translation:
  language: fr
  text: portant toujours dans le corps la mort de Jésus[a], afin que la vie de Jésus soit, elle aussi, manifestée dans notre corps.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la mise à mort de Jésus ». Le nom grec peut mettre l’accent sur l’état de mort ou sur l’expérience de la mort portée dans le corps.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντοτε
  choice: toujours
  rationale: Rend naturellement la circonstance constante exprimée par l’adverbe.
- source_word: νέκρωσιν
  choice: la mort
  rationale: Le nom peut désigner la mort ou l’état marqué par elle. « La mort » maintient le parallèle direct avec « la vie » sans réduire le sens à un simple processus.
- source_word: τοῦ Ἰησοῦ
  choice: de Jésus
  rationale: Conserve le génitif sans préciser excessivement s’il s’agit de la mort subie par Jésus ou de la mort qui lui est associée.
- source_word: ἐν τῷ σώματι
  choice: dans le corps
  rationale: Respecte l’absence de possessif explicite dans la première occurrence et le singulier grec.
- source_word: περιφέροντες
  choice: portant
  rationale: Le participe présent évoque le fait continuel de porter sur soi, dans l’existence corporelle, la mort de Jésus.
- source_word: ἵνα
  choice: afin que
  rationale: Exprime clairement le rapport de but ou de résultat, dans un registre digne et courant.
- source_word: καὶ
  choice: elle aussi
  rationale: Souligne la correspondance entre la mort de Jésus portée dans le corps et sa vie qui y est manifestée.
- source_word: ζωὴ
  choice: la vie
  rationale: Équivalent direct qui conserve le contraste théologique avec « la mort ».
- source_word: ἐν τῷ σώματι ἡμῶν
  choice: dans notre corps
  rationale: Préserve le singulier collectif du grec avec le possessif pluriel, ainsi que le parallélisme des deux occurrences de « corps ».
- source_word: φανερωθῇ
  choice: soit manifestée
  rationale: Rend le passif aoriste subjonctif et l’idée que la vie de Jésus devient perceptible ou évidente, sans expliciter l’agent.
theological_decisions:
- issue: Sens de νέκρωσις en rapport avec Jésus
  choice: « la mort de Jésus »
  alternative: « la mise à mort de Jésus » ou « le processus de mort de Jésus »
  rationale: « Mort » correspond au sens nominal et maintient le contraste rhétorique avec « la vie de Jésus ». Une note conserve toutefois la nuance possible d’une expérience ou d’un processus de mort.
- issue: Nombre de σώμα
  choice: Maintenir le singulier « corps » dans les deux propositions
  alternative: Employer « notre corps » dès la première occurrence ou pluraliser en « nos corps »
  rationale: Le grec emploie le singulier les deux fois et n’a un possessif explicite que dans la seconde. La traduction préserve cette forme et sa possible portée collective.
- issue: Valeur du passif φανερωθῇ
  choice: « soit manifestée » sans nommer l’agent
  alternative: « devienne visible » ou « soit révélée par Dieu »
  rationale: Le passif grec ne nomme pas l’agent. La formulation retenue préserve cette ouverture sans imposer une interprétation explicite du passif divin.
translation_notes:
  register: Français international moderne, digne et lisible. « Manifestée » est retenu pour préserver le vocabulaire de la mise en évidence tout en restant naturel dans un contexte biblique. Le participe initial garde la continuité syntaxique avec le verset précédent.
