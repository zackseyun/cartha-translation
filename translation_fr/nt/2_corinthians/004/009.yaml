base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/009.yaml
  text: persecuted[a], but not abandoned; struck down, but not destroyed[b],
translation:
  language: fr
  text: persécutés, mais non abandonnés ; jetés à terre, mais non anéantis,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διωκόμενοι
  choice: persécutés
  rationale: Dans ce contexte paulinien, le participe désigne l’hostilité et l’oppression subies de la part d’adversaires. « Persécutés » est naturel et conserve le parallélisme participial.
- source_word: ἐγκαταλειπόμενοι
  choice: abandonnés
  rationale: « Abandonnés » exprime clairement le fait d’être délaissés, sans archaïsme ni ajout d’une résonance intertextuelle que le verset n’impose pas.
- source_word: καταβαλλόμενοι
  choice: jetés à terre
  rationale: Le verbe signifie littéralement faire tomber ou jeter à terre. Cette formulation préserve l’image concrète et prépare nettement le contraste avec l’absence d’anéantissement.
- source_word: ἀπολλύμενοι
  choice: anéantis
  rationale: Dans l’antithèse avec « jetés à terre », « anéantis » exprime une destruction complète, tout en gardant la force du contraste grec.
- source_word: ἀλλ’ οὐκ
  choice: mais non
  rationale: La tournure concise reproduit les deux oppositions équilibrées du grec dans un registre français digne et naturel.
theological_decisions:
- issue: Faut-il rendre ἐγκαταλειπόμενοι par un terme à forte résonance religieuse comme « délaissés » ou par le terme courant « abandonnés » ?
  choice: abandonnés
  alternative: délaissés
  rationale: « Abandonnés » conserve l’affirmation que les apôtres, malgré la persécution, ne sont pas laissés seuls, sans imposer une allusion théologique particulière.
- issue: Faut-il interpréter ἀπολλύμενοι comme la mort, la perdition ou la destruction complète ?
  choice: anéantis
  alternative: détruits
  rationale: Le contexte immédiat oppose le fait d’être abattu à celui de subir une destruction définitive. « Anéantis » maintient cette tension sans préciser indûment s’il s’agit de mort physique ou de ruine ultime.
translation_notes:
  register: Français international moderne, sobre et rythmé. Les deux participes passifs et les deux contrastes sont conservés. « Jetés à terre » privilégie l’image concrète du grec plutôt qu’une paraphrase psychologique comme « abattus ».
