  source_fidelity: Le texte français suit fidèlement les quatre participes passifs grecs et les deux antithèses introduites par ἀλλ’ οὐκ. « Persécutés » rend bien διωκόμενοι dans son sens d’hostilité subie; « abandonnés » rend naturellement ἐγκαταλειπόμενοι; « jetés à terre » conserve l’image de καταβαλλόμενοι; et « anéantis » exprime adéquatement le contraste de ἀπολλύμενοι sans surinterpréter la nature de la destruction.
