  text: Διὸ οὐκ ⸀ἐγκακοῦμεν, ἀλλ’ εἰ καὶ ὁ ἔξω ἡμῶν ἄνθρωπος διαφθείρεται, ἀλλ’ ὁ ⸂ἔσω ἡμῶν⸃ ἀνακαινοῦται ἡμέρᾳ καὶ ἡμέρᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/016.yaml
  text: Therefore we do not lose heart. But even if our outer man is wasting away[a], yet our inner man is being renewed day by day.
translation:
  language: fr
  text: C’est pourquoi nous ne perdons pas courage. Mais même si notre être extérieur dépérit[a], notre être intérieur se renouvelle pourtant de jour en jour.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « notre homme extérieur » ; dans la seconde expression, « [notre homme] intérieur », le mot « homme » est sous-entendu. En grec, « homme » désigne ici la personne humaine et établit un contraste voulu entre l’extérieur et l’intérieur.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὸ
  choice: C’est pourquoi
  rationale: Introduit naturellement en français la conséquence tirée de l’argument qui précède.
- source_word: οὐκ ἐγκακοῦμεν
  choice: nous ne perdons pas courage
  rationale: Rend l’idée de ne pas céder au découragement ni se lasser, dans une formulation française courante et digne.
- source_word: ἀλλ’ εἰ καὶ
  choice: Même si
  rationale: Exprime clairement la concession; le contraste est ensuite porté par la juxtaposition des deux propositions.
- source_word: ὁ ἔξω ἡμῶν ἄνθρωπος
  choice: notre être extérieur
  rationale: Préserve le contraste anthropologique avec «notre être intérieur» tout en évitant que «homme extérieur» soit compris comme exclusivement masculin.
- source_word: διαφθείρεται
  choice: dépérit
  rationale: Traduit le processus continu de détérioration indiqué par le présent passif, sans suggérer nécessairement une destruction immédiate.
- source_word: ἀλλ’
  choice: '[contraste exprimé par la juxtaposition]'
  rationale: En français, après «Même si», la proposition principale peut porter naturellement le contraste sans second adversatif; ajouter «pourtant» serait possible, mais plus appuyé.
- source_word: ὁ ἔσω ἡμῶν
  choice: notre être intérieur
  rationale: Reproduit symétriquement l’opposition avec «être extérieur» et conserve la portée représentative de l’expression grecque elliptique.
- source_word: ἀνακαινοῦται
  choice: se renouvelle
  rationale: Exprime un renouvellement continu subi ou reçu; le pronominal français reste naturel sans préciser explicitement l’agent.
- source_word: ἡμέρᾳ καὶ ἡμέρᾳ
  choice: de jour en jour
  rationale: Équivalent idiomatique français de la tournure distributive, indiquant une progression ou une répétition quotidienne.
theological_decisions:
- issue: Contraste anthropologique entre ὁ ἔξω ἄνθρωπος et ὁ ἔσω
  choice: «notre être extérieur» / «notre être intérieur»
  alternative: «l’homme extérieur en nous» / «l’homme intérieur en nous»
  rationale: La traduction conserve l’opposition voulue sans imposer un dualisme technique entre corps et âme, ni limiter le référent aux hommes. La note signale la formulation littérale grecque.
- issue: Agent du renouvellement exprimé par le passif ἀνακαινοῦται
  choice: Ne pas identifier l’agent dans le texte
  alternative: «Dieu renouvelle notre être intérieur»
  rationale: Le passif grec ne nomme pas ici l’agent; l’expliciter résoudrait une donnée que le verset laisse implicite.
translation_notes:
  register: Français international moderne, naturel et digne. «Être extérieur / intérieur» maintient le parallélisme paulinien dans une forme immédiatement compréhensible; «dépérit» et «se renouvelle» rendent les processus continus des présents grecs.
