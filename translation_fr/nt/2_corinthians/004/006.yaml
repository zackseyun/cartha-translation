reference: 2 Corinthians 4:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὅτι ὁ θεὸς ὁ εἰπών· Ἐκ σκότους φῶς ⸀λάμψει, ὃς ἔλαμψεν ἐν ταῖς καρδίαις ἡμῶν πρὸς φωτισμὸν τῆς γνώσεως τῆς δόξης τοῦ θεοῦ ἐν προσώπῳ ⸀Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/006.yaml
  text: For God[a], who said[c][b], “Light will shine out of darkness,” has shone in our hearts for the illumination of the knowledge of the glory of God in the face of Messiah.
translation:
  language: fr
  text: 'Car Dieu, qui a dit : « Du sein des ténèbres brillera la lumière »[c], a brillé dans nos cœurs pour faire resplendir la connaissance de la gloire de Dieu sur le visage[a] du Messie[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « dans la personne du Christ ». Le grec peut désigner concrètement le visage, comme ici, ou plus largement la personne.'
    reason: alternative_reading
  - marker: b
    text: Grec Χριστοῦ (Christou), traditionnellement rendu par « Christ » ; « Messie » met ici en évidence la valeur de titre.
    reason: lexical_alternative
  - marker: c
    text: Cette parole fait écho à Genèse 1.3 et applique l’image de la lumière créatrice à l’œuvre par laquelle Dieu se révèle dans le cœur des croyants.
    reason: cross_reference
lexical_decisions:
- source_word: ὅτι
  choice: Car
  rationale: La conjonction introduit ici le fondement de l’affirmation précédente ; « Car » conserve clairement et sobrement ce lien argumentatif.
- source_word: ὁ θεὸς ὁ εἰπών
  choice: Dieu, qui a dit
  rationale: Le participe grec avec article se rend naturellement en français par une proposition relative.
- source_word: Ἐκ σκότους φῶς λάμψει
  choice: Du sein des ténèbres brillera la lumière
  rationale: Cette formulation conserve le futur, met en relief l’origine exprimée par ἐκ et garde l’image solennelle de la lumière surgissant des ténèbres.
- source_word: ὃς ἔλαμψεν
  choice: a lui-même brillé
  rationale: 'Le verbe est employé de manière intransitive : Dieu est celui qui brille. « Lui-même » rend explicite la reprise emphatique de l’antécédent sans transformer le verbe en causatif.'
- source_word: ἐν ταῖς καρδίαις ἡμῶν
  choice: dans nos cœurs
  rationale: « Cœurs » préserve la métaphore biblique transparente de l’être intérieur.
- source_word: πρὸς φωτισμὸν τῆς γνώσεως
  choice: pour faire resplendir la connaissance
  rationale: Cette verbalisation exprime naturellement en français la visée indiquée par πρὸς et l’idée d’illumination portée par φωτισμός, sans l’abstraction peu idiomatique de « pour l’illumination de la connaissance ».
- source_word: τῆς δόξης τοῦ θεοῦ
  choice: de la gloire de Dieu
  rationale: La chaîne de compléments est conservée, car elle demeure claire et naturelle en français.
- source_word: ἐν προσώπῳ Χριστοῦ
  choice: sur le visage du Messie
  rationale: « Visage » retient le sens concret de πρόσωπον et prolonge l’imagerie de lumière et de gloire. « Messie » traduit Χριστός comme titre.
theological_decisions:
- issue: Traduction de Χριστοῦ
  choice: du Messie
  alternative: du Christ
  rationale: Dans ce contexte de révélation de la gloire divine, Χριστός garde sa valeur de titre. « Messie » rend cette fonction sans nier la traduction française traditionnelle « Christ », signalée en note.
- issue: Sens de ἐν προσώπῳ Χριστοῦ
  choice: sur le visage du Messie
  alternative: dans la personne du Christ
  rationale: Le sens concret de πρόσωπον convient particulièrement au contexte de lumière et de gloire. La lecture plus idiomatique « dans la personne » reste possible et est préservée en note plutôt que d’être exclue.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. La phrase conserve la densité et l’imagerie lumineuse de Paul, tout en évitant une succession nominale artificielle. « Du sein des ténèbres » est légèrement solennel, mais reste intelligible et convient à l’écho du récit de la création.
