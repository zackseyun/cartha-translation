  text: εἰ δὲ καὶ ἔστιν κεκαλυμμένον τὸ εὐαγγέλιον ἡμῶν, ἐν τοῖς ἀπολλυμένοις ἐστὶν κεκαλυμμένον,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/003.yaml
  text: And even if our gospel is veiled[a], it is veiled among those who are perishing,
translation:
  language: fr
  text: Et même si notre Évangile est voilé, il est voilé pour ceux qui vont à leur perte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « parmi ceux qui vont à leur perte » ou « pour ceux qui sont perdus ».
    reason: Alternative lexicale et syntaxique pour ἐν τοῖς ἀπολλυμένοις.
lexical_decisions:
- source_word: εἰ δὲ καὶ
  choice: Et même si
  rationale: Rend naturellement la valeur concessive de la condition, tout en conservant δέ comme articulation du discours et καί comme élément intensif.
- source_word: κεκαλυμμένον
  choice: voilé
  rationale: Le parfait passif de καλύπτω reprend la métaphore du voile développée dans le contexte immédiat (3.14-16 ; 4.4), plus précisément que « caché ».
- source_word: τὸ εὐαγγέλιον ἡμῶν
  choice: notre Évangile
  rationale: Conserve le possessif ἡμῶν et l'expression paulinienne concise, sans l'expliciter en « l'Évangile que nous proclamons ».
- source_word: ἐν τοῖς ἀπολλυμένοις
  choice: parmi ceux qui vont à leur perte
  rationale: « Parmi » exprime la sphère ou le groupe concerné par ἐν avec le datif. « Vont à leur perte » restitue en français courant la valeur processive du participe présent ἀπολλυμένοις.
- source_word: ἐστὶν κεκαλυμμένον
  choice: il est voilé
  rationale: Maintient la répétition emphatique du prédicat grec ; « il » reprend clairement « notre Évangile ».
theological_decisions:
- issue: Portée de ἀπολλυμένοις dans le contexte sotériologique paulinien
  choice: ceux qui vont à leur perte
  alternative: ceux qui sont perdus
  rationale: La formulation retenue préserve l'idée d'un processus ou d'une condition en cours et la tension théologique du texte, sans réduire le participe à une catégorie statique.
- issue: Valeur de ἐν devant τοῖς ἀπολλυμένοις
  choice: parmi ceux qui vont à leur perte
  alternative: pour ceux qui vont à leur perte
  rationale: « Parmi » suit plus directement la valeur locale ou sphérique de ἐν, tandis que « pour » exprimerait une relation de point de vue possible mais plus interprétative.
translation_notes:
  register: Français international moderne, digne et accessible. La majuscule à « Évangile » suit un usage éditorial français courant pour désigner le message chrétien ; elle n'ajoute aucune précision absente du grec. La métaphore du voile et la répétition de « voilé » sont conservées.
