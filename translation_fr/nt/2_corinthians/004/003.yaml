review_pass:
  verdict: revise
  source_fidelity: Le conditionnel concessif εἰ δὲ καὶ, la métaphore répétée de κεκαλυμμένον, le possessif « notre » et la valeur processive de ἀπολλυμένοις sont bien rendus. En français, toutefois, « voilé parmi ceux qui vont à leur perte » suggère plus spontanément une localisation au sein d’un groupe qu’une référence aux personnes concernées. Avec ἐν dans cette construction, « pour ceux qui vont à leur perte » rend plus fidèlement et idiomatiquement le sens contextuel sans trancher davantage la nuance prépositionnelle.
  naturalness: « Et même si notre Évangile est voilé » est naturel dans un registre biblique moderne. « Il est voilé pour ceux qui vont à leur perte » est plus idiomatique et clair que « il est voilé parmi ceux qui vont à leur perte », tout en conservant la répétition emphatique du grec.
  terminology: « Évangile », « voilé » et « ceux qui vont à leur perte » conviennent au français international moderne et préservent respectivement la terminologie paulinienne, la métaphore contextuelle du voile et l’aspect non statique du participe. La majuscule éditoriale à « Évangile » est acceptable.
  issues:
  - severity: medium
    issue: La préposition « parmi » est maladroite dans la proposition principale.
    rationale: Dans « il est voilé parmi ceux qui vont à leur perte », « parmi » tend à décrire l’endroit où se trouve l’Évangile voilé. Le grec ἐν τοῖς ἀπολλυμένοις exprime ici plus naturellement, en français, le groupe pour lequel ou dans le cas duquel il est voilé. « Pour ceux qui vont à leur perte » est la formulation française usuelle et conserve l’ambiguïté pertinente.
  revised_text: Et même si notre Évangile est voilé, il est voilé pour ceux qui vont à leur perte.[a]
