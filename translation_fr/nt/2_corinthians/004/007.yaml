    issue: « nous portons » pour ἔχομεν
    rationale: Ἔχομεν signifie littéralement « nous avons ». « Porter » peut s’accorder avec l’image, mais ajoute l’idée de transport ou de support, qui n’est pas formulée dans le grec.
  - severity: high
    issue: « soit reconnue comme venant de Dieu » ajoute une notion de reconnaissance
    rationale: Le grec dit que l’excès de la puissance soit de Dieu et non de nous; il ne mentionne aucune reconnaissance, manifestation ou constatation par des personnes.
  - severity: low
    issue: « cette puissance extraordinaire » introduit un démonstratif et condense la structure
    rationale: Le grec ne comporte pas de démonstratif ici. La formulation proposée rend plus explicitement ἡ ὑπερβολὴ τῆς δυνάμεως comme une puissance qui dépasse la mesure.
  revised_text: Mais nous avons ce trésor dans des vases d’argile[a], afin que la puissance qui dépasse toute mesure[b] vienne de Dieu et non de nous.
