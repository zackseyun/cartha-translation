  to: Mais nous avons ce trésor dans des vases d’argile[a], afin que la puissance qui dépasse toute mesure[b] vienne de Dieu et non de nous.
  rationale: La révision restitue ἔχομεν par « nous avons », supprime l’ajout interprétatif « soit reconnue comme » et conserve le contraste d’origine divine et humaine dans une formulation française idiomatique. La métaphore demeure non expliquée, et la proposition finale introduite par ἵνα est préservée par « afin que ».
