source:
  edition: SBLGNT
  text: Ἔχομεν δὲ τὸν θησαυρὸν τοῦτον ἐν ὀστρακίνοις σκεύεσιν, ἵνα ἡ ὑπερβολὴ τῆς δυνάμεως ᾖ τοῦ θεοῦ καὶ μὴ ἐξ ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/007.yaml
  text: But we have this treasure in clay jars[b][a], so that the surpassing greatness of the power may be of God and not from us.
translation:
  language: fr
  text: Mais nous avons ce trésor dans des vases d’argile[a], afin que la puissance qui dépasse toute mesure[b] vienne de Dieu et non de nous.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans des récipients de terre cuite ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « l’excès de la puissance » ; ou « la puissance extraordinaire ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔχομεν
  choice: nous portons
  rationale: Dans l’image de contenants renfermant un trésor, « portons » exprime naturellement en français la possession et le fait de contenir, sans expliciter davantage la métaphore.
- source_word: δὲ
  choice: Mais
  rationale: Marque le contraste avec le contexte précédent.
- source_word: τὸν θησαυρὸν τοῦτον
  choice: ce trésor
  rationale: Conserve le nom et le démonstratif, qui renvoie au contexte sans identifier explicitement le trésor dans le verset.
- source_word: ἐν ὀστρακίνοις σκεύεσιν
  choice: dans des récipients d’argile
  rationale: ὀστράκινος désigne ce qui est fait de terre cuite, et σκεῦος un récipient ou ustensile. Cette formulation actuelle préserve l’image de fragilité et d’humble valeur.
- source_word: ἵνα
  choice: afin que
  rationale: Conserve la valeur de but de la proposition, tout en laissant possible sa nuance de résultat.
- source_word: ἡ ὑπερβολὴ τῆς δυνάμεως
  choice: cette puissance extraordinaire
  rationale: Rend idiomatiquement l’idée d’une puissance qui dépasse la mesure ordinaire. Le démonstratif français rattache naturellement la puissance au trésor et au contexte, sans ajouter un référent.
- source_word: ᾖ τοῦ θεοῦ καὶ μὴ ἐξ ἡμῶν
  choice: soit reconnue comme venant de Dieu et non de nous
  rationale: Le contraste asymétrique entre le génitif τοῦ θεοῦ et ἐξ ἡμῶν porte sur l’origine ou l’appartenance de la puissance. « soit reconnue comme » rend en français le sens prédicatif sans laisser entendre que la puissance deviendrait divine seulement à ce moment.
theological_decisions:
- issue: Nature du « trésor » et des récipients
  choice: Conserver la métaphore sans identifier le trésor à l’Évangile ni les récipients aux corps ou à la faiblesse humaine dans le texte principal.
  alternative: Développer en « le trésor de l’Évangile » ou « nos corps fragiles ».
  rationale: Le contexte éclaire la métaphore, mais le grec du verset ne l’explicite pas.
- issue: Valeur de la proposition introduite par ἵνα
  choice: La rendre comme une proposition de but avec « afin que ».
  alternative: 'La comprendre uniquement comme un résultat : « de sorte que ».'
  rationale: ἵνα peut parfois tendre vers le résultat, mais sa valeur finale demeure naturelle ici et doit rester perceptible.
- issue: Origine ou appartenance de la puissance
  choice: Exprimer que la puissance est reconnue comme venant de Dieu, et non des messagers humains.
  alternative: Traduire littéralement « soit de Dieu », au risque d’une formulation française ambiguë ou peu naturelle.
  rationale: Cette formulation respecte le contraste entre τοῦ θεοῦ et ἐξ ἡμῶν sans développer une doctrine de l’action divine au-delà du texte.
translation_notes:
  register: Français international moderne, digne et accessible. La métaphore est conservée, avec « récipients d’argile » plutôt que le traditionnel mais moins courant « vases de terre ». Les deux appels de note figurent dans le texte principal.
