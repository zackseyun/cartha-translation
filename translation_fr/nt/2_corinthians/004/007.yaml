  verdict: revise
  source_fidelity: La traduction actuelle conserve bien le trésor, les contenants d’argile et la finalité, mais « nous portons » interprète ἔχομεν (« nous avons »), tandis que « soit reconnue comme » ajoute l’idée d’une reconnaissance absente du grec. Le démonstratif « cette » devant « puissance » n’est pas non plus exprimé dans le texte source.
  naturalness: « Nous avons ce trésor dans des récipients d’argile » est à la fois direct et naturel en français international. « La puissance qui dépasse toute mesure » rend clairement l’intensif ὑπερβολή sans la tournure quelque peu abstraite « l’extraordinaire grandeur de la puissance ».
  terminology: « Vases d’argile » garde l’image concrète de σκεύη et convient au registre biblique moderne sans archaïsme excessif. « Vienne de Dieu et non de nous » exprime idiomatiquement le contraste entre τοῦ θεοῦ et ἐξ ἡμῶν, sans introduire l’idée que cette origine doit être reconnue.
  issues:
