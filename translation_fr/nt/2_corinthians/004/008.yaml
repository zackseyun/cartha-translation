source:
  edition: SBLGNT
  text: ἐν παντὶ θλιβόμενοι ἀλλ’ οὐ στενοχωρούμενοι, ἀπορούμενοι ἀλλ’ οὐκ ἐξαπορούμενοι,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/008.yaml
  text: We are afflicted in every way[a], but not crushed; perplexed[c][b], but not driven to despair.
translation:
  language: fr
  text: Nous sommes pressés de toute manière[a], mais pas acculés[b] ; perplexes, mais pas réduits au désespoir[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en toute chose ». L’expression indique une portée générale et ne décrit pas nécessairement une pression venant spatialement de tous côtés.
    reason: lexical_alternative
  - marker: b
    text: Le grec évoque littéralement le fait d’être resserré dans un espace étroit et, par extension, de se trouver dans une situation sans issue.
    reason: lexical_alternative
  - marker: c
    text: Ou « pas totalement désemparés » ou « pas entièrement sans issue ». Le verbe grec renforce celui qui est traduit par « perplexes ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν παντί
  choice: toutes sortes de
  rationale: Cette tournure française exprime la portée globale de l’épreuve sans donner à la préposition un sens spatial trop précis.
- source_word: θλιβόμενοι
  choice: nous subissons… des pressions
  rationale: Le verbe évoque une pression produisant détresse et souffrance. Cette formulation reste naturelle tout en préparant le contraste avec l’idée d’être acculé.
- source_word: στενοχωρούμενοι
  choice: nous ne sommes pas acculés
  rationale: Le verbe évoque l’enfermement dans un espace étroit et, par extension, une situation sans issue. « Acculés » conserve cette image et marque le résultat extrême que Paul nie.
- source_word: ἀπορούμενοι
  choice: nous sommes perplexes
  rationale: Le terme décrit ceux qui ne savent pas clairement quelle voie suivre. « Perplexes » rend cette incertitude sans lui donner une portée plus forte que celle du grec.
- source_word: ἐξαπορούμενοι
  choice: non réduits au désespoir
  rationale: Le composé intensifie le verbe précédent et désigne l’état de celui qui ne voit plus aucune issue. La traduction garde cette progression sans transformer le propos en affirmation doctrinale sur la foi.
- source_word: ἀλλ’ οὐ … ἀλλ’ οὐκ
  choice: mais… pas ; mais non
  rationale: La répétition de « mais » préserve les deux contrastes parallèles. La légère variation entre « pas » et « non » permet une syntaxe française fluide.
theological_decisions:
- issue: Degré d’intensification dans le second couple de participes
  choice: « perplexes, mais non réduits au désespoir »
  alternative: « ne sachant quelle voie prendre, mais jamais entièrement sans issue »
  rationale: Le choix retenu maintient la progression entre l’incertitude réelle et le désespoir total que Paul nie, sans prétendre qu’il formule ici une doctrine technique de l’état psychologique ou spirituel des croyants.
translation_notes:
  register: Français international actuel, clair et digne. La phrase explicite le sujet « nous », sous-entendu par les participes grecs, et conserve le rythme des deux oppositions. Le vocabulaire de la pression et de l’impasse maintient autant que possible les images liées du texte source.
