  terminology: « Jésus, le Messie » rend naturellement le titre Χριστός en français sans le traiter obligatoirement comme partie d’un nom propre. « Seigneur » et « vos esclaves » correspondent aux choix lexicaux justifiés par κύριον et δούλους. Les notes sont conservées, avec une légère correction de la note a afin que l’alternative française corresponde mieux à la construction grecque.
