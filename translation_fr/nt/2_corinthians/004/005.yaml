source:
  edition: SBLGNT
  text: οὐ γὰρ ἑαυτοὺς κηρύσσομεν ἀλλὰ ⸂Χριστὸν Ἰησοῦν⸃ κύριον, ἑαυτοὺς δὲ δούλους ὑμῶν διὰ Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/005.yaml
  text: For we do not proclaim ourselves[a], but Messiah Jesus as Lord[c][b], and ourselves as your servants for Jesus' sake.
translation:
  language: fr
  text: En effet, ce n’est pas nous-mêmes que nous proclamons, mais Jésus, le Messie, comme Seigneur ; et nous-mêmes comme vos esclaves à cause de Jésus[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « Christ Jésus comme Seigneur ». Le grec peut être compris comme proclamant Jésus en qualité de Seigneur ; Χριστός peut aussi être rendu par « Christ » lorsqu’il fonctionne davantage comme un nom.'
    reason: ambiguïté lexicale et syntaxique
  - marker: b
    text: Ou « vos serviteurs ». Le grec δοῦλοι peut désigner des serviteurs ou des esclaves ; « esclaves » conserve ici la force de la subordination mise en contraste avec Jésus comme Seigneur.
    reason: alternative lexicale
  - marker: c
    text: Ou « en raison de Jésus » ; littéralement, la construction exprime que Jésus est la cause ou le motif de leur position envers les Corinthiens.
    reason: précision sémantique
lexical_decisions:
- source_word: κηρύσσομεν
  choice: nous proclamons
  rationale: « Proclamer » conserve l’idée d’une annonce publique portée par κηρύσσω, sans limiter le terme à la prédication sous forme de sermon.
- source_word: ἑαυτοὺς
  choice: nous-mêmes
  rationale: Le pronom réfléchi, répété en grec, met en contraste le contenu de la proclamation et la position de Paul et de ses collaborateurs envers les Corinthiens.
- source_word: Χριστὸν Ἰησοῦν
  choice: Jésus, le Messie
  rationale: Cette formulation française naturelle maintient Χριστός comme titre et nomme clairement Jésus comme le Messie, même si l’ordre des mots grecs est inverse.
- source_word: κύριον
  choice: comme Seigneur
  rationale: 'Le terme a ici une valeur prédicative : Jésus est proclamé en qualité de Seigneur. « Comme Seigneur » préserve cette syntaxe sans ajouter un verbe conjugué à la proposition grecque.'
- source_word: δούλους
  choice: esclaves
  rationale: Dans le contraste délibéré avec « Seigneur », « esclaves » restitue la forte idée de dépendance et de subordination exprimée par δοῦλοι, que « serviteurs » pourrait atténuer.
- source_word: ὑμῶν
  choice: vos
  rationale: Le génitif marque la relation de dépendance et de service de Paul et de ses collaborateurs envers les destinataires.
- source_word: διὰ Ἰησοῦν
  choice: à cause de Jésus
  rationale: 'Avec l’accusatif, διά exprime ici naturellement la cause ou le motif : c’est en raison de Jésus qu’ils se placent au service des Corinthiens.'
theological_decisions:
- issue: 'Valeur de Χριστός : titre ou élément de nom'
  choice: 'Titre : « le Messie »'
  alternative: « Christ Jésus » ou « Jésus-Christ »
  rationale: Dans cette confession qui présente Jésus comme Seigneur, la valeur titulaire de Χριστός demeure perceptible. La traduction garde donc « Messie » tout en signalant la formulation traditionnelle possible.
- issue: Fonction de κύριον dans Χριστὸν Ἰησοῦν κύριον
  choice: « Jésus, le Messie, comme Seigneur »
  alternative: « Christ Jésus, le Seigneur » ou « Jésus Christ est Seigneur »
  rationale: « Comme Seigneur » rend la valeur prédicative de κύριον après le verbe « proclamer », sans transformer explicitement le groupe accusatif en proposition indépendante.
- issue: Force de δοῦλοι dans la relation aux Corinthiens
  choice: « vos esclaves »
  alternative: « vos serviteurs »
  rationale: 'Le choix conserve la tension forte du texte : Jésus est le Seigneur, tandis que les apôtres se présentent dans une position radicalement subordonnée envers les croyants à cause de lui.'
translation_notes:
  register: Français international moderne, digne et accessible. La reprise de « nous proclamons » explicite l’ellipse grecque pour assurer la clarté. Le point-virgule et « quant à nous » rendent lisible le second contraste sans affaiblir la répétition de ἑαυτούς.
