  text: Διὰ τοῦτο, ἔχοντες τὴν διακονίαν ταύτην καθὼς ἠλεήθημεν, οὐκ ⸀ἐγκακοῦμεν,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/001.yaml
  text: Therefore, since we have this ministry, just as we have received mercy, we do not lose heart.
translation:
  language: fr
  text: C’est pourquoi, puisque nous avons ce ministère, tout comme nous avons reçu miséricorde, nous ne perdons pas courage.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διακονίαν
  choice: ministère
  rationale: Dans ce contexte, le terme désigne la mission de service confiée aux apôtres; « ministère » est naturel et précis en français biblique moderne.
- source_word: ἠλεήθημεν
  choice: la miséricorde qui nous a été faite
  rationale: Cette tournure conserve le passif aoriste et présente le ministère comme reçu par un acte de miséricorde, sans expliciter l’agent divin absent de la formulation grecque.
- source_word: ἐγκακοῦμεν
  choice: nous ne perdons pas courage
  rationale: Le verbe exprime le fait de se décourager ou de renoncer sous l’épreuve; cette formulation idiomatique convient au contexte.
theological_decisions:
- issue: Rapport entre le ministère et la miséricorde reçue
  choice: selon la miséricorde qui nous a été faite
  alternative: tout comme nous avons reçu miséricorde
  rationale: καθὼς peut exprimer ici la conformité ou le fondement circonstanciel. « Selon la miséricorde qui nous a été faite » relie le ministère à la miséricorde reçue sans réduire celle-ci à une simple comparaison.
translation_notes:
  register: Français moderne, digne et accessible. La phrase conserve la progression causale du grec et évite d’ajouter explicitement Dieu comme agent du passif.
