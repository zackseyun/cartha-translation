id: 2CO.6.6
reference: 2 Corinthians 6:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐν ἁγνότητι, ἐν γνώσει, ἐν μακροθυμίᾳ, ἐν χρηστότητι, ἐν πνεύματι ἁγίῳ, ἐν ἀγάπῃ ἀνυποκρίτῳ,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/006.yaml
  text: in purity[a], in knowledge, in patience, in kindness, in the Holy Spirit, in sincere love,
translation:
  language: fr
  text: par la pureté, par la connaissance, par la patience, par la bonté, par l’Esprit Saint[a], par un amour sincère,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « par un esprit saint », si l’expression décrit une disposition sainte plutôt que l’Esprit Saint.
    reason: alternative_reading
lexical_decisions:
- source_word: ἁγνότητι
  choice: pureté
  rationale: ἁγνότης désigne ici la pureté ou l’intégrité morale au sens large. « Pureté » est naturel en français et n’enferme pas le terme dans la seule chasteté sexuelle.
- source_word: γνώσει
  choice: connaissance
  rationale: γνῶσις exprime la connaissance, avec probablement ici une dimension pratique et spirituelle liée au ministère. « Connaissance » conserve cette amplitude.
- source_word: μακροθυμίᾳ
  choice: patience
  rationale: μακροθυμία évoque une patience durable envers les personnes ou dans les difficultés. « Patience » est clair, courant et suffisamment large.
- source_word: χρηστότητι
  choice: bonté
  rationale: χρηστότης peut désigner la bonté bienveillante, l’amabilité ou la générosité dans les relations. « Bonté » rend naturellement cette qualité sans la réduire à la simple gentillesse.
- source_word: πνεύματι ἁγίῳ
  choice: l’Esprit Saint
  rationale: Dans l’usage paulinien, πνεῦμα ἅγιον renvoie très probablement ici à l’Esprit divin. L’article français et les majuscules rendent ce référent personnel, sans effacer l’autre compréhension possible.
- source_word: ἀγάπῃ ἀνυποκρίτῳ
  choice: un amour sincère
  rationale: ἀγάπη est rendu par « amour », et ἀνυπόκριτος signifie dépourvu d’hypocrisie ou de feinte. « Un amour sincère » est idiomatique et fidèle au sens.
- source_word: ἐν
  choice: par
  rationale: Dans cette série, ἐν peut exprimer le moyen, la manière ou la sphère dans lesquels Paul et ses collaborateurs se recommandent. « Par » s’intègre naturellement au contexte français et préserve la répétition rhétorique.
theological_decisions:
- issue: Référent de πνεύματι ἁγίῳ
  choice: « l’Esprit Saint » désigne l’Esprit divin
  alternative: « un esprit saint », compris comme une disposition humaine sainte
  rationale: L’usage paulinien et le contexte favorisent le référent divin. Toutefois, l’absence d’article en grec et la place de l’expression parmi des qualités permettent de signaler en note la compréhension anthropologique possible.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « par » maintient le rythme de l’énumération grecque. « Bonté » est retenu pour χρηστότης afin d’exprimer une bienveillance active et relationnelle.
