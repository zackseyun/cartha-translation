source:
  edition: SBLGNT
  text: καὶ ἔσομαι ὑμῖν εἰς πατέρα, καὶ ὑμεῖς ἔσεσθέ μοι εἰς υἱοὺς καὶ θυγατέρας, λέγει κύριος παντοκράτωρ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/018.yaml
  text: And I will be a Father to you[a], and you will be sons and daughters to me, says the Lord Almighty.
translation:
  language: fr
  text: Et je serai pour vous un père[a], et vous serez pour moi des fils et des filles, dit le Seigneur tout-puissant.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, dans une formulation plus courante : « je serai votre Père, et vous serez mes fils et mes filles ». Le grec emploie une tournure qui exprime une relation d’alliance ; littéralement, « je serai pour vous un père, et vous serez pour moi des fils et des filles ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔσομαι ὑμῖν εἰς πατέρα
  choice: je serai pour vous un père
  rationale: La tournure française conserve de près la formule relationnelle et d’alliance εἶναι + datif + εἰς, tout en restant naturelle. La minuscule à « père » convient au nom commun attributif, sans diminuer la référence divine.
- source_word: ὑμεῖς ἔσεσθέ μοι
  choice: vous serez pour moi
  rationale: Cette formulation maintient le futur, l’accent porté par le pronom explicite ὑμεῖς et le parallélisme réciproque avec la première proposition.
- source_word: υἱοὺς καὶ θυγατέρας
  choice: des fils et des filles
  rationale: Le grec nomme expressément les deux groupes; « enfants » effacerait cette inclusion marquée.
- source_word: λέγει
  choice: dit
  rationale: Le présent français « dit » correspond au présent grec de la formule de citation et garde son caractère actuel et solennel.
- source_word: κύριος παντοκράτωρ
  choice: le Seigneur tout-puissant
  rationale: « Seigneur » rend le titre divin κύριος, et « tout-puissant » est l’équivalent français établi et précis de παντοκράτωρ, sans importer le titre distinct « Seigneur des armées ».
theological_decisions:
- issue: Expression de la relation filiale
  choice: des fils et des filles
  alternative: des enfants
  rationale: Le texte mentionne explicitement υἱούς et θυγατέρας. La traduction retenue préserve l’inclusion explicite des filles ainsi que la réciprocité de la relation d’alliance.
- issue: Formule relationnelle εἶναι… εἰς
  choice: je serai pour vous un père… vous serez pour moi des fils et des filles
  alternative: je serai votre Père… vous serez mes fils et mes filles
  rationale: La formulation retenue respecte davantage la symétrie et l’étrangeté légère de l’idiome grec sans en imposer une interprétation possessive plus lisse.
- issue: Titre divin κύριος παντοκράτωρ
  choice: le Seigneur tout-puissant
  alternative: le Seigneur, le Tout-Puissant
  rationale: Cette lecture rend directement les deux termes grecs et demeure naturelle en français. Elle évite d’assimiler παντοκράτωρ à un autre titre vétérotestamentaire.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme de la formule d’alliance est conservé; aucune majuscule interprétative n’est ajoutée à « père ». Le trait d’union de « tout-puissant » suit l’usage français courant.
