  text: ἐν λόγῳ ἀληθείας, ἐν δυνάμει θεοῦ· διὰ τῶν ὅπλων τῆς δικαιοσύνης τῶν δεξιῶν καὶ ἀριστερῶν,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/007.yaml
  text: in the word of truth[a], in the power of God; through the weapons of righteousness in the right hand and in the left[c][b],
translation:
  language: fr
  text: par la parole de vérité, par la puissance de Dieu, au moyen des armes de la justice[a], dans la main droite et dans la gauche[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « armes de la droiture ».'
    reason: lexical_alternative
  - marker: b
    text: 'L’expression évoque probablement des armes employées des deux mains, image d’une préparation complète, tant pour l’attaque que pour la défense. On pourrait aussi traduire : « pour la droite et pour la gauche ».'
    reason: cultural_note_and_translation_alternative
lexical_decisions:
- source_word: λόγῳ ἀληθείας
  choice: la parole de vérité
  rationale: Cette formulation conserve l’expression grecque et son ambiguïté entre une parole véridique et le message de vérité proclamé.
- source_word: δυνάμει θεοῦ
  choice: la puissance de Dieu
  rationale: Le génitif est rendu directement, tandis que la répétition de « par » restitue la fonction instrumentale de ἐν dans cette série.
- source_word: διὰ
  choice: au moyen de
  rationale: Avec le génitif, διά marque ici le moyen ou l’instrument; « au moyen de » exprime clairement cette valeur.
- source_word: ὅπλων
  choice: armes
  rationale: ὅπλα peut désigner l’équipement de combat, offensif ou défensif. « Armes » demeure naturel et suffisamment large en français.
- source_word: δικαιοσύνης
  choice: justice
  rationale: En français biblique moderne, « justice » couvre naturellement la rectitude morale et la conformité à ce qui est juste, sans imposer ici une interprétation doctrinale plus étroite.
- source_word: τῶν δεξιῶν καὶ ἀριστερῶν
  choice: dans la main droite et dans la gauche
  rationale: Les adjectifs substantivés évoquent vraisemblablement les mains ou les côtés droit et gauche. Cette formulation rend explicite l’image tout en restant concise.
theological_decisions:
- issue: Portée de δικαιοσύνη dans l’image des armes
  choice: justice
  alternative: justesse morale; droiture
  rationale: Le contexte ne précise pas si la justice désigne la conduite droite, une qualité donnée par Dieu ou les moyens justes employés dans le ministère. Le terme français « justice » maintient cette amplitude.
- issue: Sens de la main droite et de la gauche
  choice: armes tenues dans les deux mains, image d’une préparation complète
  alternative: armes offensives et défensives; armes de tous côtés
  rationale: Le grec nomme la droite et la gauche sans expliquer leur fonction. La traduction conserve donc l’image corporelle, et la note ne présente l’interprétation militaire que comme probable.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La répétition « par… par… au moyen de… » rend les relations instrumentales du grec sans alourdir excessivement la phrase. La ponctuation finale signale que le verset appartient à une énumération continue.
