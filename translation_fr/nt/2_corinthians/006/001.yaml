id: 2CO.6.1
reference: 2 Corinthians 6:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Συνεργοῦντες δὲ καὶ παρακαλοῦμεν μὴ εἰς κενὸν τὴν χάριν τοῦ θεοῦ δέξασθαι ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/001.yaml
  text: Working together with him[a], we also urge you not to receive the grace of God in vain.
translation:
  language: fr
  text: À l’œuvre avec lui[a], nous vous exhortons aussi à ne pas recevoir en vain la grâce de Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « En tant que collaborateurs, nous vous exhortons aussi »; le participe grec n’indique pas explicitement avec qui Paul travaille, bien que le contexte suggère fortement qu’il s’agit de Dieu.'
    reason: alternative_reading
lexical_decisions:
- source_word: Συνεργοῦντες
  choice: À l’œuvre avec lui
  rationale: Le participe exprime une collaboration active. Dans le contexte de l’action réconciliatrice de Dieu et du ministère confié à Paul (5.18–20), « lui » renvoie très probablement à Dieu. La note conserve toutefois l’absence d’objet explicite dans le grec.
- source_word: δὲ
  choice: —
  rationale: Cette particule marque ici une transition légère plutôt qu’une opposition nette; elle est absorbée dans le mouvement naturel de la phrase française.
- source_word: καὶ
  choice: aussi
  rationale: Le terme ajoute l’exhortation à l’activité exprimée par le participe.
- source_word: παρακαλοῦμεν
  choice: nous vous exhortons
  rationale: Le verbe désigne ici un appel pressant. « Exhortons » garde la force de l’expression tout en convenant au registre apostolique.
- source_word: μὴ
  choice: ne pas
  rationale: Négation directe de l’infinitif δέξασθαι.
- source_word: εἰς κενὸν
  choice: en vain
  rationale: Cette locution signifie « sans effet » ou « sans résultat »; « en vain » en conserve la concision et la portée rhétorique.
- source_word: τὴν χάριν τοῦ θεοῦ
  choice: la grâce de Dieu
  rationale: « Grâce » rend le terme paulinien χάρις et le complément « de Dieu » suit directement le génitif grec sans préciser davantage sa relation sémantique.
- source_word: δέξασθαι
  choice: recevoir
  rationale: « Recevoir » rend naturellement l’idée d’accueillir ou d’accepter et conserve le vocabulaire théologique courant.
- source_word: ὑμᾶς
  choice: vous
  rationale: Le pronom accusatif devient en français le complément de « exhortons » et le sujet sous-entendu de l’infinitif « recevoir ».
theological_decisions:
- issue: Partenaire sous-entendu dans « à l’œuvre avec »
  choice: Le pronom « lui » est explicité et renvoie contextuellement à Dieu.
  alternative: « En tant que collaborateurs, nous vous exhortons aussi », sans identifier le partenaire de Paul.
  rationale: Le grec n’énonce pas le partenaire, mais le contexte immédiat présente Dieu comme celui qui réconcilie et Paul comme son ambassadeur. La traduction principale exprime cette référence probable, tandis que la note préserve l’ambiguïté grammaticale.
translation_notes:
  register: Français international moderne, clair et digne. « À l’œuvre avec lui » conserve la force verbale du participe sans employer le terme plus administratif « collaborant ». La formulation reste concise et suit la tension du grec sans transformer la réception « en vain » en une explication doctrinale.
