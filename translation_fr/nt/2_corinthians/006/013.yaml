  yaml_path: translation/nt/2_corinthians/006/013.yaml
  text: In the same return—I speak as to children—be open wide[b][a], you also.
translation:
  language: fr
  text: En retour, de la même manière[b] — je vous parle comme à des enfants —, ouvrez largement votre cœur, vous aussi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « soyez élargis » ; dans ce contexte, il s’agit d’ouvrir largement son cœur dans l’affection et l’accueil.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « en contrepartie », « comme réciproque » ou « par un échange équivalent ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντιμισθίαν
  choice: En retour
  rationale: Le nom exprime ce qui est donné en réponse, comme contrepartie ou échange réciproque. « En retour » restitue ici la réciprocité affective sans suggérer un paiement commercial.
- source_word: τὴν αὐτὴν
  choice: de la même manière
  rationale: Cette formulation française naturelle rend l’idée d’une réponse correspondante, de même nature que l’ouverture manifestée par Paul et ses collaborateurs.
- source_word: ὡς τέκνοις λέγω
  choice: je vous parle comme à des enfants
  rationale: « Enfants » traduit τέκνοις sans introduire le possessif « mes », absent du grec. Le pronom « vous » explicite seulement les destinataires déjà indiqués par le datif et par le contexte immédiat.
- source_word: πλατύνθητε
  choice: ouvrez-vous tout grands
  rationale: L’impératif signifie littéralement « soyez élargis ». Dans le contexte, il évoque une ouverture affective et relationnelle ; la tournure retenue conserve cette image sans ajouter explicitement « vos cœurs ».
- source_word: καὶ ὑμεῖς
  choice: vous aussi
  rationale: 'La formule garde l’insistance sur la réciprocité : les Corinthiens doivent répondre par la même ouverture.'
- source_word: δὲ
  choice: ponctuation et enchaînement
  rationale: La particule marque ici une légère transition. En français, l’enchaînement « En retour » et la ponctuation suffisent, sans ajouter un « maintenant » temporel absent du texte.
theological_decisions:
- issue: Faut-il rendre explicite le rapport parental de Paul par « mes enfants » ?
  choice: comme à des enfants
  alternative: comme à mes enfants
  rationale: Le ton est manifestement parental, mais aucun possessif ne figure dans le grec. La traduction préserve cette retenue tout en laissant le contexte communiquer l’affection pastorale.
- issue: Faut-il préciser que l’ouverture concerne le cœur ?
  choice: ouvrez-vous tout grands
  alternative: ouvrez tout grand votre cœur
  rationale: Le contexte précédent parle du cœur, mais πλατύνθητε ne comporte ici aucun complément explicite. La formulation choisie garde la métaphore et son ouverture interprétative sans insérer « cœur » dans le texte principal.
translation_notes:
  register: Français international moderne, digne et accessible. Les incises rendent le ton direct et affectueux de Paul. « Ouvrez-vous tout grands » est idiomatique tout en conservant l’image d’élargissement, et l’absence de « mes » ainsi que de « vos cœurs » respecte ce qui demeure implicite dans le grec.
