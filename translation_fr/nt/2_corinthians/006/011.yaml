  text: Τὸ στόμα ἡμῶν ἀνέῳγεν πρὸς ὑμᾶς, Κορίνθιοι, ἡ καρδία ἡμῶν πεπλάτυνται·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/011.yaml
  text: Our mouth has been opened to you[a], Corinthians[b]; our heart has been widened.
translation:
  language: fr
  text: Notre bouche s’est ouverte à vous[a], Corinthiens ; notre cœur s’est élargi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de manière plus idiomatique : « Nous vous avons parlé ouvertement. »'
    reason: lexical_alternative
  - marker: b
    text: Ou « notre cœur s’est ouvert tout grand » ou « notre cœur est grand ouvert ».
    reason: lexical_alternative
lexical_decisions:
- source_word: στόμα
  choice: bouche
  rationale: « Bouche » conserve l’image corporelle de Paul ainsi que son parallèle rhétorique avec « cœur », tout en évoquant naturellement la parole.
- source_word: ἀνέῳγεν
  choice: s’est ouverte
  rationale: Le passé composé rend l’état présent résultant exprimé par le parfait grec et préserve la métaphore de l’ouverture.
- source_word: πρὸς ὑμᾶς
  choice: pour vous
  rationale: Dans cette déclaration d’ouverture adressée aux Corinthiens, « pour vous » exprime l’orientation relationnelle de πρός sans alourdir la phrase.
- source_word: Κορίνθιοι
  choice: Corinthiens
  rationale: Le vocatif est rendu par l’appellation directe française habituelle, qui garde le caractère personnel et pressant de l’adresse.
- source_word: καρδία
  choice: cœur
  rationale: « Cœur » désigne naturellement le siège de l’affection et de la disposition intérieure, tout en conservant l’image corporelle du grec.
- source_word: πεπλάτυνται
  choice: s’est élargi
  rationale: Cette formulation garde l’image d’un cœur rendu vaste et reflète la valeur résultative du parfait grec. Elle évite de réduire explicitement la métaphore à l’affection ou à la franchise.
theological_decisions:
- issue: Images corporelles exprimant la franchise et l’affection de Paul
  choice: Conserver dans le texte les métaphores de la bouche ouverte et du cœur élargi.
  alternative: « Nous vous avons parlé en toute franchise, Corinthiens ; notre cœur vous est grand ouvert. »
  rationale: 'Le grec présente deux images parallèles plutôt qu’une interprétation explicite. Leur maintien préserve la rhétorique de Paul ainsi que l’étendue possible du sens : parole franche, disponibilité intérieure et affection généreuse.'
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe demeure volontairement imagée et légèrement marquée afin de préserver le parallélisme grec entre « bouche » et « cœur » ; les notes donnent les formulations françaises plus idiomatiques.
