lexical_decisions:
- source_word: διὰ
  choice: dans… comme dans / sous… comme sous
  rationale: Avec ces génitifs désignant des circonstances traversées dans le ministère, διά exprime le cadre dans lequel celui-ci se poursuit. La variation des prépositions donne un français naturel tout en conservant le parallélisme répété.
- source_word: δόξης
  choice: honneur
  rationale: En contraste avec ἀτιμία, δόξα a ici vraisemblablement le sens social d’honneur ou d’estime publique, plutôt que son sens théologique habituel de « gloire ».
- source_word: ἀτιμίας
  choice: déshonneur
  rationale: Ce terme forme avec « honneur » une opposition concise et garde la dimension sociale et publique de ἀτιμία.
- source_word: δυσφημίας
  choice: propos malveillants
  rationale: Le mot peut désigner une parole défavorable ou une mauvaise réputation. Cette formulation moderne évite de préciser indûment que les accusations sont nécessairement mensongères, nuance que « calomnies » imposerait.
- source_word: εὐφημίας
  choice: éloges
  rationale: Le terme désigne des paroles favorables ou une bonne réputation. « Éloges » fournit un pendant idiomatique à « propos malveillants ».
- source_word: ὡς
  choice: tenus pour
  rationale: Dans cette série de contrastes, ὡς introduit la manière dont les apôtres sont considérés. « Tenus pour » explicite naturellement cette perspective sans transformer l’accusation en réalité.
- source_word: πλάνοι
  choice: imposteurs
  rationale: Le substantif désigne ici des personnes accusées d’égarer ou de tromper. « Imposteurs » est naturel dans ce contexte et marque qu’on met en doute leur authenticité.
- source_word: ἀληθεῖς
  choice: véridiques
  rationale: L’adjectif s’oppose directement à πλάνοι. « Véridiques » exprime qu’ils disent vrai, tout en maintenant la forme paradoxale de l’énoncé.
theological_decisions:
- issue: Le contraste entre le jugement porté sur Paul et ses collaborateurs et ce qu’ils sont réellement
  choice: « tenus pour des imposteurs, et pourtant véridiques »
  alternative: « comme des imposteurs, tout en étant vrais »
  rationale: La traduction rend explicite la perception introduite par ὡς et présente ἀληθεῖς comme la réalité opposée à l’accusation. Elle préserve ainsi la tension rhétorique sans laisser entendre que Paul reconnaît être trompeur.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme antithétique est conservé par les deux constructions « dans… comme dans » et « sous… comme sous », puis par « et pourtant ». La virgule finale signale que le verset appartient à une énumération qui se poursuit.
