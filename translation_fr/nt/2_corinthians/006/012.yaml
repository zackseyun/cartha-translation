  yaml_path: translation/nt/2_corinthians/006/012.yaml
  text: You are not restricted by us[a], but you are restricted in your own affections.
translation:
  language: fr
  text: Vous n’êtes pas à l’étroit de notre côté[a] ; c’est dans vos propres affections que vous l’êtes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Vous n’êtes pas limités par nous, mais vous l’êtes dans vos propres cœurs. »'
    reason: Alternative lexicale et syntaxique pour στενοχωρεῖσθε, ἐν ἡμῖν et σπλάγχνα.
lexical_decisions:
- source_word: στενοχωρεῖσθε
  choice: êtes à l’étroit
  rationale: Le verbe évoque littéralement un espace resserré et, au figuré, une capacité relationnelle entravée. « Être à l’étroit » conserve cette image dans un français naturel. La même expression aux deux occurrences maintient le contraste rhétorique de Paul.
- source_word: ἐν ἡμῖν
  choice: en nous
  rationale: La traduction formelle « en nous » préserve la construction parallèle avec « dans vos propres affections » et l’ambiguïté relationnelle de ἐν, sans préciser indûment que Paul serait seulement la cause de la contrainte.
- source_word: δὲ
  choice: c’est… que
  rationale: Cette tournure française marque naturellement le contraste correctif entre le premier membre négatif et le lieu réel de l’étroitesse.
- source_word: ἐν τοῖς σπλάγχνοις ὑμῶν
  choice: dans vos propres affections
  rationale: σπλάγχνα désigne littéralement les entrailles et, figurativement ici, le siège des sentiments profonds. « Affections » rend la dimension émotionnelle et relationnelle, tandis que « propres » souligne que la limitation se trouve chez les Corinthiens.
- source_word: οὐ
  choice: ne… pas
  rationale: Négation directe du premier membre de la phrase.
theological_decisions:
- issue: Sens figuré de σπλάγχνα
  choice: Les affections profondes des Corinthiens
  alternative: Leurs entrailles ou leur cœur
  rationale: Le contexte porte sur leur relation avec Paul et sur leur capacité à lui répondre avec ouverture. Le sens figuré convient donc, sans réduire l’expression à la seule pensée ni effacer sa dimension affective.
- issue: Valeur de ἐν ἡμῖν
  choice: « en nous », en conservant l’ambiguïté relationnelle et le parallélisme
  alternative: « à cause de nous » ou « par nous »
  rationale: Le grec emploie ἐν dans les deux membres. Garder une construction locative proche du texte évite de résoudre silencieusement la question de savoir si Paul parle du lieu, de la sphère ou de la source de la contrainte.
translation_notes:
  register: Français international moderne, digne et accessible. L’image spatiale de l’étroitesse est conservée, ainsi que la répétition du verbe et le parallélisme des deux membres. « Affections » est légèrement soutenu, mais précis et compréhensible dans ce contexte.
