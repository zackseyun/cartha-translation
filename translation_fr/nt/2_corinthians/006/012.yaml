  source_fidelity: Le projet conserve correctement la répétition de στενοχωρεῖσθε, le contraste introduit par δέ et le sens figuré de σπλάγχνα. Toutefois, « en nous » est peu idiomatique en français dans cette construction et ne rend pas clairement la relation visée ; « de notre côté » exprime naturellement la portée relationnelle de ἐν ἡμῖν sans trancher excessivement en faveur d’une causalité forte (« par nous »).
  naturalness: « Vous n’êtes pas à l’étroit en nous » paraît calqué et difficile à comprendre en français moderne. « De notre côté » est plus fluide, tout en maintenant l’opposition avec la limitation qui réside chez les Corinthiens. La reprise elliptique « vous l’êtes » conserve la répétition rhétorique sans lourdeur.
