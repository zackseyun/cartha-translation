  text: as unknown and yet well known[a], as dying and behold, we live, as disciplined and not put to death[b],
translation:
  language: fr
  text: comme inconnus, et pourtant reconnus[a] ; comme mourants, et voici, nous vivons ; comme corrigés[b], et pourtant non mis à mort.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « bien connus » ou « pleinement reconnus » ; le grec peut souligner le fait d’être pleinement reconnu plutôt que simplement célèbre.
    reason: lexical_alternative
  - marker: b
    text: Ou « disciplinés » ou « formés » ; le grec peut désigner une correction disciplinaire ou une formation.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς
  choice: comme
  rationale: Conserve l’anaphore qui introduit chaque caractérisation paradoxale, dans un français naturel.
- source_word: ἀγνοούμενοι
  choice: des inconnus
  rationale: Exprime le fait d’être inconnus ou non reconnus par autrui et forme un contraste concis avec ἐπιγινωσκόμενοι.
- source_word: ἐπιγινωσκόμενοι
  choice: bien reconnus
  rationale: Rend l’idée d’une reconnaissance réelle ou pleine sans la réduire à la célébrité; la note conserve l’autre formulation possible.
- source_word: ἀποθνῄσκοντες
  choice: mourants
  rationale: Le participe présent évoque une condition continue ou l’apparence d’être au seuil de la mort, sans empiéter sur θανατούμενοι.
- source_word: ἰδοὺ
  choice: voici
  rationale: Garde la force vive de l’appel à l’attention dans un registre digne et courant.
- source_word: ζῶμεν
  choice: nous vivons
  rationale: Reproduit le présent simple et le contraste abrupt avec « mourants ».
- source_word: παιδευόμενοι
  choice: corrigés
  rationale: Dans ce contexte de souffrance, le terme peut évoquer une discipline corrective ou une formation; « corrigés » reste naturel, tandis que la note signale l’éventail sémantique.
- source_word: μὴ θανατούμενοι
  choice: non mis à mort
  rationale: Préserve la forme passive et distingue cette expression de l’état décrit par « mourants ».
theological_decisions:
- issue: Sens de παιδευόμενοι en rapport avec la souffrance
  choice: corrigés
  alternative: disciplinés / formés
  rationale: Le choix laisse ouverte l’idée d’une correction éprouvante sans affirmer qu’il s’agit nécessairement d’un châtiment divin; la note préserve également la nuance formative.
translation_notes:
  register: Français international moderne, concis et digne. La répétition de « comme » et les oppositions parallèles sont maintenues; « et pourtant » explicite naturellement la valeur adversative du καί dans les deux membres où elle est nécessaire à la fluidité.
