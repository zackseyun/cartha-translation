id: 2CO.6.10
reference: 2 Corinthians 6:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὡς λυπούμενοι ἀεὶ δὲ χαίροντες, ὡς πτωχοὶ πολλοὺς δὲ πλουτίζοντες, ὡς μηδὲν ἔχοντες καὶ πάντα κατέχοντες.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/010.yaml
  text: as sorrowful[a], yet always rejoicing; as poor, yet making many rich; as having nothing[b], and yet possessing everything.
translation:
  language: fr
  text: comme attristés, mais toujours joyeux ; comme pauvres, mais enrichissant beaucoup de gens ; comme n’ayant rien, et pourtant possédant tout.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡς
  choice: comme
  rationale: La répétition de « comme » conserve l’encadrement comparatif et rhétorique de cette série de paradoxes, sans décider s’il s’agit seulement du regard d’autrui ou de la condition apparente des apôtres.
- source_word: λυπούμενοι
  choice: attristés
  rationale: Ce participe exprime l’expérience réelle de la tristesse sans préciser sa cause. « Attristés » est concis et s’accorde naturellement avec la construction en série.
- source_word: ἀεὶ δὲ χαίροντες
  choice: mais toujours joyeux
  rationale: « Toujours » rend la continuité exprimée par ἀεί, tandis que « mais » marque clairement le contraste. « Joyeux » donne en français une formulation naturelle sans supprimer le paradoxe avec la tristesse.
- source_word: πτωχοὶ
  choice: pauvres
  rationale: Équivalent direct qui permet d’entendre la pauvreté matérielle et l’humble condition apostolique sans renforcer indûment le sens en « démunis » ou « misérables ».
- source_word: πολλοὺς δὲ πλουτίζοντες
  choice: mais enrichissant beaucoup de gens
  rationale: Le verbe signifie « rendre riche, enrichir ». « Beaucoup de gens » explicite naturellement en français que πολλούς désigne des personnes, sans préciser la nature de leur richesse.
- source_word: μηδὲν ἔχοντες
  choice: comme n’ayant rien
  rationale: La formulation garde le contraste direct entre l’absence de biens et la possession universelle affirmée ensuite.
- source_word: πάντα κατέχοντες
  choice: possédant tout
  rationale: Dans ce contexte, κατέχω exprime la possession ou la maîtrise effective. « Tout » est idiomatique et conserve la portée absolue de πάντα.
theological_decisions:
- issue: Nature de la richesse communiquée et de la possession de tout
  choice: Ne pas qualifier ces réalités de « spirituelles » dans le texte principal.
  alternative: Traduire explicitement par « enrichissant spirituellement beaucoup de gens » et « possédant tout en Christ ».
  rationale: Le contexte paulinien invite à comprendre une richesse plus profonde que les biens matériels, mais le grec ne l’explicite pas. La traduction préserve donc la tension entre le dénuement visible et la richesse ou la possession véritables.
- issue: Portée répétée de ὡς
  choice: Conserver « comme » dans les trois propositions.
  alternative: Supprimer « comme » ou traduire par « considérés comme » afin d’imposer une lecture sociale et extérieure.
  rationale: ὡς peut présenter la manière dont les apôtres apparaissent ou sont considérés, mais il peut aussi encadrer rhétoriquement leur condition paradoxale. « Comme » maintient cette ambiguïté.
translation_notes:
  register: Français international moderne, sobre et soutenu. Le parallélisme ternaire, les reprises de « comme » et les oppositions introduites par « mais » ou « et pourtant » reproduisent le rythme du grec. Aucun ajout interprétatif ne définit la richesse ou la possession comme exclusivement matérielle ou spirituelle.
