  text: ἀλλ’ ἐν παντὶ ⸀συνιστάνοντες ἑαυτοὺς ὡς θεοῦ διάκονοι· ἐν ὑπομονῇ πολλῇ, ἐν θλίψεσιν, ἐν ἀνάγκαις, ἐν στενοχωρίαις,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/004.yaml
  text: 'but in everything commending ourselves as God''s servants: in great endurance[a], in afflictions, in hardships, in distresses[c][b],'
translation:
  language: fr
  text: 'mais, en toute circonstance[a], nous nous recommandons comme serviteurs de Dieu[b] : avec une grande persévérance[c], dans les épreuves, dans les situations difficiles, dans les détresses,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à tous égards ». L’expression grecque peut viser toutes les circonstances ou tous les domaines dans lesquels ils font leurs preuves.
    reason: lexical_alternative
  - marker: b
    text: Ou « comme ministres de Dieu ». Le mot grec met l’accent sur le service et ne désigne pas nécessairement une fonction institutionnelle.
    reason: lexical_alternative
  - marker: c
    text: Littéralement « dans une grande persévérance ». La préposition grecque répétée structure toute la liste qui suit.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: mais
  rationale: Marque le contraste avec l’énoncé négatif qui précède et introduit la manière positive dont Paul et ses collaborateurs exercent leur service.
- source_word: ἐν παντί
  choice: en toute circonstance
  rationale: La formule grecque est large. Cette traduction française exprime naturellement l’ensemble des situations dans lesquelles ils se recommandent, sans exclure le sens possible « à tous égards ».
- source_word: συνιστάνοντες ἑαυτούς
  choice: nous nous recommandons
  rationale: Le verbe peut signifier recommander, faire valoir ou montrer la qualité de quelqu’un. La formulation retenue préserve l’idée que leur conduite atteste l’authenticité de leur service, ainsi que la tension du langage de l’auto-recommandation.
- source_word: ὡς θεοῦ διάκονοι
  choice: comme serviteurs de Dieu
  rationale: διάκονοι désigne ici ceux qui servent Dieu. « Serviteurs » reste accessible et n’impose pas l’idée d’une fonction ecclésiastique institutionnelle.
- source_word: ἐν ὑπομονῇ πολλῇ
  choice: avec une grande persévérance
  rationale: ὑπομονή évoque la constance qui tient bon sous l’épreuve, et non la simple attente patiente. « Avec » rend naturellement en français la manière exprimée ici par ἐν.
- source_word: θλίψεσιν
  choice: dans les épreuves
  rationale: Le terme désigne des afflictions ou pressions éprouvantes. « Épreuves » est clair, soutenu et adapté à cette liste de souffrances.
- source_word: ἀνάγκαις
  choice: dans les situations difficiles
  rationale: Dans ce contexte, le mot évoque des circonstances contraignantes ou pressantes plutôt que de simples besoins matériels.
- source_word: στενοχωρίαις
  choice: dans les angoisses
  rationale: Le terme évoque le fait d’être à l’étroit, acculé ou soumis à une pression extrême. « Angoisses » en conserve l’intensité tout en le distinguant des termes précédents.
theological_decisions:
- issue: Sens de διάκονοι dans un contexte de service apostolique
  choice: serviteurs de Dieu
  alternative: ministres de Dieu
  rationale: Le mot grec souligne le service accompli pour Dieu sans exiger la notion d’une charge ecclésiastique formelle. « Serviteurs » évite d’importer des connotations institutionnelles ultérieures.
- issue: Portée de l’auto-recommandation apostolique
  choice: nous nous recommandons
  alternative: nous montrons que nous sommes
  rationale: La traduction formelle conserve l’ambivalence du verbe entre recommandation et démonstration. Le contexte indique que les circonstances énumérées attestent leur service, sans qu’il soit nécessaire d’effacer la tension liée au fait de se recommander soi-même.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve la progression de la phrase grecque et la répétition de « dans » pour les trois formes de souffrance, tout en employant « avec » devant « une grande persévérance » afin d’éviter une tournure française artificielle.
