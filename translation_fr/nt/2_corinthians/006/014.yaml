source:
  edition: SBLGNT
  text: Μὴ γίνεσθε ἑτεροζυγοῦντες ἀπίστοις· τίς γὰρ μετοχὴ δικαιοσύνῃ καὶ ἀνομίᾳ, ⸂ἢ τίς⸃ κοινωνία φωτὶ πρὸς σκότος;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/014.yaml
  text: Do not become unequally yoked with unbelievers[b][a]. For what partnership has righteousness with lawlessness? Or what fellowship has light with darkness?
translation:
  language: fr
  text: Ne vous mettez pas avec des non-croyants sous un joug mal assorti[a]. En effet, quelle association peut-il y avoir entre la justice[b] et le mépris de la loi ? Ou quelle communion entre la lumière et les ténèbres ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression évoque des animaux de nature différente réunis sous un même joug ; comparer Deutéronome 22.10.
    reason: cross_reference
  - marker: b
    text: Ou « droiture ».
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ γίνεσθε
  choice: Ne formez pas
  rationale: La défense au présent est rendue naturellement en français. Avec l’image de l’attelage qui suit, « former » exprime l’entrée dans une telle association sans réduire le verbe à un simple état.
- source_word: ἑτεροζυγοῦντες
  choice: un attelage mal assorti
  rationale: Cette formulation conserve l’image concrète d’êtres de nature différente placés sous un même joug, tout en restant compréhensible en français moderne.
- source_word: ἀπίστοις
  choice: avec des non-croyants
  rationale: Le terme désigne ici ceux qui ne croient pas. « Non-croyants » est actuel, clair et moins marqué stylistiquement qu’« incroyants ».
- source_word: μετοχὴ
  choice: association
  rationale: Le mot exprime le fait d’avoir part ensemble. « Association » convient au contexte relationnel et se distingue utilement de κοινωνία dans la proposition parallèle.
- source_word: δικαιοσύνῃ
  choice: justice
  rationale: « Justice » est l’équivalent français normal de δικαιοσύνη et peut désigner ici la rectitude conforme à Dieu. « Droiture » est signalé en note pour expliciter cette nuance morale.
- source_word: ἀνομίᾳ
  choice: mépris de la loi
  rationale: ἀνομία désigne l’absence ou la transgression de la loi. « Mépris de la loi » en exprime la force morale plus clairement que le terme juridique moderne « illégalité ».
- source_word: κοινωνία
  choice: communion
  rationale: « Communion » conserve l’idée d’une participation étroite et partagée, ainsi que la portée relationnelle du terme.
- source_word: φωτὶ πρὸς σκότος
  choice: entre la lumière et les ténèbres
  rationale: La préposition πρός marque ici la relation mise en question. « Entre… et… » produit en français une opposition naturelle tout en conservant les deux images.
theological_decisions:
- issue: Portée de l’interdiction figurée par le joug
  choice: Conserver une formulation générale concernant une association mal assortie avec des non-croyants
  alternative: Limiter explicitement l’interdiction au mariage
  rationale: Le texte ne nomme pas le mariage. L’image du joug peut éclairer plusieurs formes d’engagement contraignant ; la traduction ne doit donc pas en restreindre silencieusement la portée.
- issue: Sens de δικαιοσύνη dans l’opposition paulinienne
  choice: justice
  alternative: droiture
  rationale: Le terme grec possède une gamme de sens comprenant la justice et la rectitude. Dans l’opposition à ἀνομία, « justice » convient au texte principal, tandis que « droiture » en précise une nuance possible en note.
translation_notes:
  register: Français international moderne, digne et accessible. La métaphore agricole du joug est conservée sous la forme explicite « attelage mal assorti ». Le parallélisme des deux questions rhétoriques est maintenu sans préciser une application que le verset lui-même ne nomme pas.
