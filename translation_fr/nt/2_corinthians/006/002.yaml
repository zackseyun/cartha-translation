source:
  edition: SBLGNT
  text: λέγει γάρ· Καιρῷ δεκτῷ ἐπήκουσά σου καὶ ἐν ἡμέρᾳ σωτηρίας ἐβοήθησά σοι· ἰδοὺ νῦν καιρὸς εὐπρόσδεκτος, ἰδοὺ νῦν ἡμέρα σωτηρίας·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/002.yaml
  text: For he says[a], “At an acceptable time I listened to you, and in a day of salvation I helped you.” Behold, now is the acceptable time; behold[b], now is the day of salvation.
translation:
  language: fr
  text: 'Car il dit[a] : « Au moment favorable, je t’ai écouté, et au jour du salut, je suis venu à ton secours. » Voici, c’est maintenant le moment particulièrement favorable ; voici[b], c’est maintenant le jour du salut.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Car il est dit ». Le sujet implicite peut être compris comme Dieu, qui parle dans l’Écriture.'
    reason: alternative_reading
  - marker: b
    text: 'On pourrait aussi traduire : « un moment particulièrement favorable… un jour de salut ». Le grec n’emploie pas d’article dans ces expressions.'
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει γάρ
  choice: Car il dit
  rationale: « Car » conserve le lien explicatif de γάρ, et « il dit » présente Dieu comme le locuteur de la citation sans ajouter d’explication étrangère au texte.
- source_word: Καιρῷ δεκτῷ
  choice: Au moment favorable
  rationale: καιρός désigne un moment approprié ou décisif plutôt que le temps chronologique en général ; δεκτός a ici le sens de favorable ou agréé. Cette formulation est naturelle en français et convient à la citation d’Ésaïe.
- source_word: ἐπήκουσά σου
  choice: je t’ai écouté
  rationale: Le verbe peut signifier entendre ou écouter favorablement, avec une nuance de réponse. « Je t’ai écouté » conserve cette nuance sans expliciter excessivement par « je t’ai exaucé ».
- source_word: ἐν ἡμέρᾳ σωτηρίας
  choice: au jour du salut
  rationale: Le français idiomatique emploie ici « au jour ». L’absence d’article en grec ne commande pas à elle seule l’indéfini en français, où « le jour du salut » peut caractériser le jour sans imposer une lecture eschatologique plus précise.
- source_word: ἐβοήθησά σοι
  choice: je suis venu à ton secours
  rationale: βοηθέω signifie aider ou venir au secours de quelqu’un. Cette expression française restitue clairement l’idée d’une aide apportée dans la détresse et garde un registre digne.
- source_word: ἰδοὺ
  choice: Voici
  rationale: « Voici » est un marqueur d’attention actuel et soutenu, qui conserve la force rhétorique de ἰδού sans l’archaïsme marqué de « voici que » ou « voyez ».
- source_word: καιρὸς εὐπρόσδεκτος
  choice: le moment pleinement favorable
  rationale: εὐπρόσδεκτος renforce l’idée d’accueil favorable par rapport à δεκτός. « Pleinement favorable » marque cette intensification tout en maintenant le lien lexical avec la première proposition.
- source_word: ἡμέρα σωτηρίας
  choice: le jour du salut
  rationale: Cette tournure est la plus naturelle en français dans l’application emphatique de Paul. Elle identifie le présent comme jour caractérisé par le salut sans préciser davantage la portée théologique du syntagme.
theological_decisions:
- issue: Le caractère défini ou indéfini du moment favorable et du jour du salut
  choice: 'Employer le défini idiomatique français : « le moment pleinement favorable » et « le jour du salut ».'
  alternative: « un moment pleinement favorable » et « un jour de salut »
  rationale: Les groupes grecs sont sans article, mais l’anarthrie ne suffit pas à imposer l’indéfini. Dans cette proclamation avec νῦν, le français défini est plus naturel et conserve l’identification emphatique du présent, sans exiger une construction eschatologique particulière.
- issue: L’identité du sujet de λέγει
  choice: Traduire personnellement par « il dit ».
  alternative: « l’Écriture dit » ou « il est dit »
  rationale: La citation donne directement la parole à Dieu. Le pronom personnel maintient cette texture théologique tout en préservant la concision du grec.
- issue: La portée de ἐπήκουσά σου
  choice: « je t’ai écouté »
  alternative: « je t’ai exaucé »
  rationale: « Exaucé » exprimerait plus explicitement une réponse favorable. Le choix retenu préserve l’ambiguïté lexicale entre écoute attentive, accueil favorable et réponse.
translation_notes:
  register: Français international moderne, clair et digne. « Voici » maintient l’urgence rhétorique de la double interjection. « Pleinement favorable » distingue εὐπρόσδεκτος de δεκτός sans recourir à une formulation lourde. Les marqueurs [a] et [b] figurent tous deux dans le texte principal.
