  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πληγαῖς
  choice: sous les coups
  rationale: Le nom désigne des coups ou blessures infligés; cette tournure française exprime naturellement l’épreuve subie.
- source_word: φυλακαῖς
  choice: dans les prisons
  rationale: Le pluriel grec renvoie aux emprisonnements ou aux séjours en prison; «dans les prisons» conserve la forme concrète de la liste.
- source_word: ἀκαταστασίαις
  choice: au milieu des émeutes
  rationale: Dans ce contexte, le terme évoque des troubles collectifs ou des soulèvements; «émeutes» rend cette dimension sans attribuer à Paul leur responsabilité.
- source_word: κόποις
  choice: dans les travaux pénibles
  rationale: κόπος désigne un labeur marqué par la fatigue, et non le travail en général.
- source_word: ἀγρυπνίαις
  choice: les nuits sans sommeil
  rationale: Cette expression moderne traduit les veilles et privations de sommeil sans préciser si elles étaient volontaires ou imposées.
- source_word: νηστείαις
  choice: les jeûnes
  rationale: Le terme désigne littéralement des périodes de jeûne; cette traduction préserve l’ambiguïté contextuelle quant à leur caractère volontaire ou contraint.
