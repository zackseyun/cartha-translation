  text: μηδεμίαν ἐν μηδενὶ διδόντες προσκοπήν, ἵνα μὴ μωμηθῇ ἡ διακονία,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/003.yaml
  text: giving no cause for stumbling in anything[a], so that the ministry may not be blamed[b],
translation:
  language: fr
  text: Nous ne donnons aucune occasion de trébucher, en quoi que ce soit[a], afin que le ministère ne soit pas blâmé[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la moindre occasion de scandale ».
    reason: lexical_alternative
  - marker: b
    text: Ou « ne soit pas discrédité ».
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδεμίαν … προσκοπήν
  choice: la moindre occasion de trébucher
  rationale: La tournure « ne… la moindre » rend naturellement en français la négation emphatique, tandis qu’« occasion de trébucher » conserve l’image de προσκοπή, qui peut désigner une cause de chute ou d’offense.
- source_word: ἐν μηδενί
  choice: en rien
  rationale: 'Cette expression concise conserve la portée globale du grec : dans aucun domaine ni aucune circonstance.'
- source_word: διδόντες
  choice: Nous ne donnons
  rationale: Le participe grec dépend du contexte précédent. Une proposition personnelle est plus naturelle dans un verset français autonome et reprend sans ambiguïté Paul et ses collaborateurs comme sujet.
- source_word: ἵνα μὴ
  choice: afin que… ne… pas
  rationale: Cette formulation exprime clairement la visée du comportement décrit, tout en laissant ouverte la nuance de conséquence possible.
- source_word: μωμηθῇ
  choice: ne soit pas blâmé
  rationale: Le passif est conservé. « Blâmer » rend directement l’idée de trouver à redire ou de porter un jugement défavorable.
- source_word: ἡ διακονία
  choice: le ministère
  rationale: Dans le contexte, le terme désigne le service apostolique de Paul et de ses collaborateurs. « Ministère » convient à cet emploi paulinien sans préciser une fonction ecclésiastique ultérieure.
theological_decisions:
- issue: Portée de διακονία dans l’autoprésentation de Paul
  choice: « le ministère », au sens du service apostolique accompli par Paul et ses collaborateurs
  alternative: « le service », dans un sens plus général
  rationale: Le contexte concerne leur conduite dans l’accomplissement de la mission reçue. « Ministère » rend ce sens contextuel, sans importer une structure ecclésiastique particulière.
- issue: Lien entre la conduite des serviteurs et le blâme porté sur le ministère
  choice: Conserver la formulation finale « afin que », sans expliquer davantage le rapport
  alternative: 'Reformuler explicitement comme une simple conséquence : « de sorte que »'
  rationale: ἵνα peut exprimer la visée avec une nuance de résultat. La traduction garde cette tension sans transformer le propos en affirmation doctrinale plus précise.
translation_notes:
  register: Français international moderne, clair et digne. « La moindre » donne à la double négation grecque une forme idiomatique et énergique. Le tutoiement ou le vouvoiement ne sont pas en jeu. La métaphore du trébuchement est maintenue dans le texte principal.
