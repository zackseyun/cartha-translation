  text: διὸ ἐξέλθατε ἐκ μέσου αὐτῶν, καὶ ἀφορίσθητε, λέγει κύριος, καὶ ἀκαθάρτου μὴ ἅπτεσθε· κἀγὼ εἰσδέξομαι ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/017.yaml
  text: Therefore[a], come out from among them and be separate, says the Lord, and do not touch what is unclean[c][b]; and I will receive you.
translation:
  language: fr
  text: C’est pourquoi, sortez du milieu d’eux et soyez mis à part[a], dit le Seigneur ; ne touchez pas à ce qui est impur[b][c], et moi, je vous accueillerai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tenez-vous à l’écart ».
    reason: lexical_alternative
  - marker: b
    text: Ou « ne touchez à rien d’impur ».
    reason: lexical_alternative
  - marker: c
    text: Paul reprend ici le langage des prophètes de l’Ancien Testament, notamment celui d’Ésaïe 52.11.
    reason: cross_reference
lexical_decisions:
- source_word: διὸ
  choice: C’est pourquoi
  rationale: Introduit naturellement en français la conclusion tirée de l’argument précédent, tout en conservant la force logique du grec.
- source_word: ἐξέλθατε
  choice: sortez
  rationale: L’impératif aoriste appelle à une rupture nette. « Sortez » conserve directement l’image spatiale et sociale de la citation.
- source_word: ἐκ μέσου αὐτῶν
  choice: du milieu d’eux
  rationale: Expression française claire qui préserve la formulation collective et l’image du grec.
- source_word: ἀφορίσθητε
  choice: séparez-vous
  rationale: Rend l’exhortation de manière naturelle et intelligible. Le passif grec permet aussi l’idée d’être mis à part, signalée en note afin de ne pas effacer cette nuance.
- source_word: λέγει κύριος
  choice: dit le Seigneur
  rationale: Formule prophétique consacrée et naturelle, qui suit l’ordre de la proposition grecque.
- source_word: ἀκαθάρτου
  choice: ce qui est impur
  rationale: Le neutre substantivé désigne l’impur sans préciser un objet particulier. Cette formulation conserve cette généralité.
- source_word: μὴ ἅπτεσθε
  choice: ne touchez pas
  rationale: Conserve l’image concrète de contact liée au langage de pureté et à l’arrière-plan prophétique.
- source_word: κἀγὼ
  choice: et moi
  rationale: Rend à la fois la coordination de καί et la présence emphatique du pronom ἐγώ sans exagérer l’insistance.
- source_word: εἰσδέξομαι ὑμᾶς
  choice: je vous accueillerai
  rationale: Exprime clairement la réception favorable promise. « Accueillir » est ici plus naturel en français courant que « recevoir », tout en gardant la portée relationnelle et solennelle.
theological_decisions:
- issue: Traduction de κύριος dans une parole prophétique à l’arrière-plan vétérotestamentaire
  choice: le Seigneur
  alternative: le SEIGNEUR ; le Maître
  rationale: Le texte grec du Nouveau Testament porte κύριος. « Le Seigneur » respecte ce texte sans substituer directement le nom divin de l’arrière-plan hébraïque.
- issue: Portée de l’ordre de séparation
  choice: séparez-vous
  alternative: soyez mis à part ; tenez-vous à l’écart
  rationale: La formulation conserve l’appel à une séparation réelle sans préciser une application sectaire, ascétique ou sociale que le verset lui-même n’énonce pas. La note préserve en outre la nuance passive possible.
translation_notes:
  register: Français international moderne, digne et direct. La syntaxe conserve le rythme d’une proclamation prophétique tout en restant naturelle à l’oral. « Impur » maintient le registre biblique de pureté sans ajouter une interprétation rituelle ou morale restrictive.
