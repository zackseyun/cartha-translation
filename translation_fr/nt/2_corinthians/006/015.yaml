source:
  edition: SBLGNT
  text: τίς δὲ συμφώνησις ⸀Χριστοῦ πρὸς Βελιάρ, ἢ τίς μερὶς πιστῷ μετὰ ἀπίστου;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/015.yaml
  text: And what harmony is there between Messiah and Beliar? Or what share does a believer have with an unbeliever?[a]
translation:
  language: fr
  text: Quel accord y a-t-il entre le Messie et Béliar[a] ? Ou quelle part un croyant peut-il avoir avec un non-croyant ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Béliar : grec Βελιάρ; ce nom est aussi connu sous la forme « Bélial ».'
    reason: Forme alternative du nom propre.
lexical_decisions:
- source_word: συμφώνησις
  choice: accord
  rationale: Le nom désigne la concorde ou la compatibilité. « Accord » est naturel en français et convient à l’opposition absolue exprimée par la question rhétorique.
- source_word: Χριστοῦ
  choice: le Messie
  rationale: Dans ce parallèle conceptuel avec Béliar, Χριστός garde une valeur de titre; « le Messie » la rend clairement sans traiter le terme comme un simple nom propre.
- source_word: Βελιάρ
  choice: Béliar
  rationale: Le nom propre est translittéré selon la forme grecque Βελιάρ, avec les accents nécessaires à une lecture française naturelle.
- source_word: μερίς
  choice: part
  rationale: Le terme évoque une part détenue ou reçue, et par extension ce que deux personnes auraient en commun. « Quelle part… avec » conserve cette image sans l’expliciter excessivement.
- source_word: πιστῷ
  choice: un croyant
  rationale: L’adjectif est substantivé et désigne ici une personne qui croit. « Un croyant » est clair, courant et maintient le contraste lexical.
- source_word: ἀπίστου
  choice: un incroyant
  rationale: Dans son opposition à πιστῷ, le terme désigne une personne qui ne croit pas. « Un incroyant » préserve directement ce contraste, sans introduire l’idée différente d’infidélité morale.
- source_word: πρὸς
  choice: entre… et…
  rationale: Avec συμφώνησις, cette construction française exprime naturellement la relation réciproque entre les deux termes.
- source_word: μετὰ
  choice: avec
  rationale: La préposition marque ici l’association; « avec » en est l’équivalent français direct et idiomatique.
- source_word: δὲ
  choice: Quel… ?
  rationale: La particule relie cette question à la série précédente. En français, l’enchaînement interrogatif suffit naturellement; ajouter « et » alourdirait la formulation isolée sans apporter de contraste nécessaire.
theological_decisions:
- issue: Valeur de Χριστός
  choice: le Messie
  alternative: Christ
  rationale: L’antithèse avec Béliar met en avant la fonction et l’identité titulaires de Χριστός. « Le Messie » préserve cette valeur tout en restant naturel en français.
- issue: Identification de Βελιάρ
  choice: Béliar, comme nom propre de la figure opposée au Messie
  alternative: Bélial
  rationale: Le texte principal conserve la forme du grec sans ajouter une identification interprétative. La forme biblique plus familière « Bélial » est signalée en note.
- issue: Nature de la « part » commune
  choice: Conserver l’image ouverte de μερίς
  alternative: Expliciter par « qu’ont-ils en commun ? »
  rationale: « Quelle part… avec » maintient la métaphore de la portion ou participation commune et ne précise pas indûment s’il s’agit d’héritage, de communion ou d’intérêt partagé.
translation_notes:
  register: Français international moderne, digne et accessible. Les deux questions rhétoriques sont conservées, ainsi que le parallélisme entre « le Messie et Béliar » et « un croyant… un incroyant ». La ponctuation suit l’usage typographique français.
