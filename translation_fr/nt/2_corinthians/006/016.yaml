id: 2CO.6.16
reference: 2 Corinthians 6:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τίς δὲ συγκατάθεσις ναῷ θεοῦ μετὰ εἰδώλων; ⸂ἡμεῖς γὰρ ναὸς θεοῦ ἐσμεν⸃ ζῶντος· καθὼς εἶπεν ὁ θεὸς ὅτι Ἐνοικήσω ἐν αὐτοῖς καὶ ἐμπεριπατήσω, καὶ ἔσομαι αὐτῶν θεός, καὶ αὐτοὶ ἔσονταί ⸀μου λαός.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/016.yaml
  text: 'And what agreement has the temple of God with idols? For we are the temple of the living God[a], just as God said: “I will dwell among them and walk among them, and I will be their God[b], and they will be my people.”'
translation:
  language: fr
  text: 'Quel accord[a] peut-il y avoir entre le temple de Dieu et les idoles ? En effet, nous sommes le temple du Dieu vivant. Comme Dieu l’a dit : « J’habiterai parmi eux[b] et je marcherai au milieu d’eux ; je serai leur Dieu, et eux seront mon peuple. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « entente » ou « consentement ».
    reason: lexical_alternative
  - marker: b
    text: Ou « en eux ». La préposition grecque peut signifier « en » ou « parmi » ; le contexte communautaire de l’alliance favorise ici « parmi eux ».
    reason: alternative_reading
lexical_decisions:
- source_word: συγκατάθεσις
  choice: accord
  rationale: Le nom désigne un accord, un consentement ou une entente. « Accord » est naturel en français moderne et convient à la série d’oppositions incompatibles du contexte.
- source_word: ναῷ / ναὸς
  choice: temple
  rationale: ναός désigne le temple ou sanctuaire proprement dit, plutôt que l’ensemble de son enceinte. « Temple » reste clair et conserve la portée cultuelle de la métaphore.
- source_word: εἰδώλων
  choice: idoles
  rationale: Dans ce contexte religieux polémique, il s’agit d’idoles païennes et non d’images au sens neutre.
- source_word: ζῶντος
  choice: vivant
  rationale: 'Le participe qualifie Dieu : « le Dieu vivant », expression biblique qui l’oppose implicitement aux idoles sans vie.'
- source_word: καθὼς εἶπεν ὁ θεὸς
  choice: Comme Dieu l’a dit
  rationale: Cette formulation française rend naturellement le renvoi de καθώς à l’Écriture et l’aoriste εἶπεν, sans alourdir la phrase.
- source_word: Ἐνοικήσω ἐν αὐτοῖς
  choice: J’habiterai parmi eux
  rationale: ἐν peut signifier « en » ou, avec un pluriel collectif, « parmi ». Le contexte communautaire de l’alliance et le verbe parallèle favorisent ici « parmi eux », tout en signalant l’autre possibilité en note.
- source_word: ἐμπεριπατήσω
  choice: je marcherai au milieu d’eux
  rationale: Cette expression préserve l’image concrète de Dieu se déplaçant au sein de son peuple et évite la répétition immédiate de « parmi eux ».
- source_word: ἔσομαι αὐτῶν θεός
  choice: je serai leur Dieu
  rationale: C’est la formulation française naturelle de la formule d’alliance, qui conserve la relation exprimée par le génitif.
- source_word: λαός
  choice: peuple
  rationale: Dans la formule d’alliance, λαός désigne collectivement le peuple qui appartient à Dieu.
theological_decisions:
- issue: Image collective du temple
  choice: nous sommes le temple du Dieu vivant
  alternative: nous sommes un temple du Dieu vivant
  rationale: 'Bien que ναός soit sans article dans l’attribut grec, la construction a ici une valeur qualitative et définie : la communauté est identifiée au temple de Dieu. L’article français est donc naturel sans transformer l’image collective en affirmation individualisée.'
- issue: Formulation de la présence divine
  choice: J’habiterai parmi eux
  alternative: J’habiterai en eux
  rationale: Le pluriel et la formule communautaire de l’alliance favorisent « parmi eux ». La variante « en eux », grammaticalement possible et théologiquement significative, est conservée en note afin de ne pas supprimer l’ambiguïté du grec.
translation_notes:
  register: Français international moderne, digne et accessible. La question rhétorique reste vive, la métaphore cultuelle est conservée et la citation adopte un rythme solennel sans archaïsmes.
