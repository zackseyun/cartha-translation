id: 2CO.3.5
reference: 2 Corinthians 3:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὐχ ὅτι ⸂ἀφ’ ἑαυτῶν ἱκανοί ἐσμεν⸃ λογίσασθαί τι ὡς ἐξ ⸀αὑτῶν, ἀλλ’ ἡ ἱκανότης ἡμῶν ἐκ τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/005.yaml
  text: Not that we are sufficient in ourselves to consider anything as coming from ourselves[a], but our sufficiency is from God[b],
translation:
  language: fr
  text: Ce n’est pas que nous soyons par nous-mêmes capables[a] de considérer[b] quoi que ce soit comme venant de nous-mêmes ; au contraire, notre capacité vient de Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « aptes ».
    reason: lexical_alternative
  - marker: b
    text: Ou « estimer » ou « tenir compte de ».
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχ ὅτι
  choice: Ce n’est pas que
  rationale: Cette tournure introduit une précision qui écarte un malentendu, plutôt qu’une proposition causale.
- source_word: ἀφ’ ἑαυτῶν
  choice: par nous-mêmes
  rationale: Avec « nous soyons capables », cette expression indique que la capacité ne réside pas en nous et ne provient pas de nous.
- source_word: ἱκανοί / ἱκανότης
  choice: capables / capacité
  rationale: Ce couple naturel en français conserve le lien lexical entre l’adjectif et le nom grecs, sans limiter le propos à une compétence technique ou ministérielle.
- source_word: λογίσασθαί
  choice: considérer
  rationale: Le verbe désigne ici une opération de réflexion ou d’évaluation ; « considérer » convient naturellement avec la construction « comme venant de ».
- source_word: τι
  choice: quoi que ce soit
  rationale: Dans cette phrase négative, cette formulation restitue la portée indéfinie et générale du grec.
- source_word: ὡς ἐξ αὑτῶν
  choice: comme venant de nous-mêmes
  rationale: La formulation exprime clairement l’origine supposée tout en gardant la nuance comparative de ὡς.
- source_word: ἐκ τοῦ θεοῦ
  choice: vient de Dieu
  rationale: Cette expression française directe présente Dieu comme la source de la capacité.
theological_decisions:
- issue: Portée de l’affirmation concernant la capacité humaine
  choice: Conserver l’affirmation générale selon laquelle cette capacité ne vient pas de soi.
  alternative: Préciser qu’il s’agit exclusivement de la compétence nécessaire au ministère apostolique.
  rationale: Le contexte concerne le ministère, mais la formulation grecque du verset demeure générale ; la traduction ne doit pas en réduire artificiellement la portée.
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme « capables / capacité » reproduit le lien lexical grec. Le point-virgule et « au contraire » rendent nettement l’opposition marquée par ἀλλά.
