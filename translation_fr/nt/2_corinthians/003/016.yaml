  text: ἡνίκα ⸂δὲ ἐὰν⸃ ἐπιστρέψῃ πρὸς κύριον, περιαιρεῖται τὸ κάλυμμα.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/016.yaml
  text: But whenever one turns to the Lord[b][a], the veil is removed.
translation:
  language: fr
  text: Mais chaque fois que quelqu’un se tourne vers le Seigneur, le voile est enlevé.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le voile est ôté ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡνίκα δὲ ἐὰν
  choice: Mais chaque fois que
  rationale: Cette tournure rend le lien marqué par δέ ainsi que la valeur temporelle indéfinie ou répétitive produite par ἡνίκα avec ἐὰν et le subjonctif.
- source_word: ἐπιστρέψῃ
  choice: se tourne
  rationale: Le verbe garde ici son image d’un mouvement d’orientation vers quelqu’un, sans préciser davantage qu’il s’agit d’un retour, d’une repentance ou d’une conversion.
- source_word: πρὸς κύριον
  choice: vers le Seigneur
  rationale: « Vers » conserve clairement la direction exprimée par πρός avec l’accusatif, tandis que « Seigneur » rend le titre κύριος sans trancher son identification dans ce contexte.
- source_word: περιαιρεῖται
  choice: est enlevé
  rationale: Le présent passif décrit ce qui arrive au voile, sans ajouter d’agent explicite. « Est enlevé » est naturel et fidèle à la métaphore.
- source_word: τὸ κάλυμμα
  choice: le voile
  rationale: Dans le contexte de l’allusion à Moïse, « voile » est plus précis que le terme général « couverture ».
theological_decisions:
- issue: Sujet non exprimé de ἐπιστρέψῃ
  choice: quelqu’un
  alternative: 'on'
  rationale: Le grec ne donne aucun nom comme sujet. « Quelqu’un » exprime naturellement en français la portée humaine indéfinie au singulier, sans limiter l’énoncé à un individu déterminé ni à un groupe précis.
- issue: Identité du « Seigneur »
  choice: Conserver simplement « le Seigneur »
  alternative: « le Christ » ou « le Seigneur, c’est-à-dire l’Esprit »
  rationale: Le verset dit seulement κύριον. Le contexte relie de manière complexe le Seigneur et l’Esprit, mais la traduction ne doit pas résoudre dans le texte une question que la formulation grecque laisse ouverte.
translation_notes:
  register: Français moderne, courant et digne. La phrase conserve la force temporelle indéfinie de l’original, la métaphore du mouvement vers le Seigneur et le passif sans agent explicite.
