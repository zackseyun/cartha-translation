id: 2CO.3.12
reference: 2 Corinthians 3:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἔχοντες οὖν τοιαύτην ἐλπίδα πολλῇ παρρησίᾳ χρώμεθα,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/012.yaml
  text: Since, then, we have such a hope, we act with great boldness,
translation:
  language: fr
  text: Ainsi donc, puisque nous avons une telle espérance, nous agissons avec une grande assurance[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « nous faisons preuve d’une grande hardiesse », « nous usons d’une grande franchise » ou « nous parlons très ouvertement ».
    reason: Alternative lexicale reflétant l’étendue de sens de παρρησία et la construction χρώμεθα avec le datif.
lexical_decisions:
- source_word: Ἔχοντες
  choice: puisque nous avons
  rationale: Le participe présent est compris dans son rapport causal avec la proposition principale. Cette formulation est naturelle en français et explicite le lien logique sans en modifier le sens.
- source_word: οὖν
  choice: Ainsi donc
  rationale: La locution marque l’inférence tirée de l’argument précédent. « Ainsi donc » conserve nettement cette articulation tout en s’accordant avec la valeur causale du participe.
- source_word: τοιαύτην
  choice: une telle
  rationale: Rend de manière concise la valeur qualitative et démonstrative du terme grec.
- source_word: ἐλπίδα
  choice: espérance
  rationale: Terme français courant dans ce registre pour l’attente confiante tournée vers l’avenir; il convient au contexte paulinien.
- source_word: πολλῇ
  choice: une grande
  rationale: L’adjectif intensifie παρρησίᾳ; « une grande assurance » est idiomatique et préserve cette emphase.
- source_word: παρρησίᾳ
  choice: assurance
  rationale: Le mot peut exprimer l’assurance, la hardiesse, la franchise ou la liberté de parole. « Assurance » convient au contexte sans limiter indûment le sens à la seule parole; les autres nuances sont signalées en note.
- source_word: χρώμεθα
  choice: nous agissons avec
  rationale: Le verbe moyen construit avec le datif signifie faire usage de quelque chose. « Nous agissons avec » donne une formulation française naturelle sans ajouter un objet comme « parole », absent du grec.
theological_decisions:
- issue: Portée de παρρησία
  choice: Ne pas réduire le terme à la prise de parole
  alternative: « nous parlons avec une grande franchise »
  rationale: Le contexte peut évoquer la franchise de la proclamation, mais le grec ne contient aucun verbe signifiant « parler ». La traduction principale conserve donc une portée plus large, tandis que la note présente les nuances possibles.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve le mouvement argumentatif du grec. « Espérance » correspond au registre biblique courant sans archaïsme, et « assurance » évite aussi bien une témérité excessive qu’une restriction injustifiée à la parole.
