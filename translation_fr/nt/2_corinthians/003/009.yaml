source:
  edition: SBLGNT
  text: εἰ γὰρ ⸂τῇ διακονίᾳ⸃ τῆς κατακρίσεως δόξα, πολλῷ μᾶλλον περισσεύει ἡ διακονία τῆς ⸀δικαιοσύνης δόξῃ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/009.yaml
  text: For if the ministry of condemnation came with glory[a], much more does the ministry of righteousness abound in glory.
translation:
  language: fr
  text: Car si le ministère de la condamnation a été accompagné de gloire, combien plus le ministère de la justice[a] abonde-t-il en gloire !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de la droiture » ; le terme grec peut aussi évoquer le fait d’être reconnu juste.
    reason: lexical_alternative
lexical_decisions:
- source_word: διακονία
  choice: ministère
  rationale: Dans ce contraste entre deux réalités liées aux alliances, « ministère » exprime une mission ou une administration confiée, et non un simple acte de service.
- source_word: κατάκρισις
  choice: condamnation
  rationale: Le terme conserve ici son sens judiciaire et forme un contraste net avec δικαιοσύνη.
- source_word: δόξα
  choice: gloire
  rationale: « Gloire » est le terme français naturel dans ce contexte biblique et maintient le fil de l’argument de Paul.
- source_word: πολλῷ μᾶλλον
  choice: combien plus
  rationale: Cette tournure française rend naturellement l’intensification comparative de l’expression grecque.
- source_word: περισσεύω
  choice: abonder
  rationale: « Abonder » préserve l’idée de surabondance et se construit naturellement avec « en gloire ».
- source_word: δικαιοσύνη
  choice: justice
  rationale: « Justice » rend le champ sémantique de δικαιοσύνη dans un français courant et digne, tout en laissant ouverte la nuance de rectitude ou de statut juste signalée en note.
theological_decisions:
- issue: Sens de δικαιοσύνη dans le contraste paulinien entre les deux ministères
  choice: justice
  alternative: justification ; état de ce qui est juste
  rationale: Le grec peut désigner la justice, la rectitude ou le fait d’être déclaré juste. Le texte principal retient le terme français le plus large sans trancher davantage le mécanisme théologique.
- issue: Verbe à suppléer dans la première proposition grecque, qui est nominale
  choice: s’est accompagné de gloire
  alternative: avait de la gloire
  rationale: Cette formulation indique que la gloire était attachée à ce ministère sans transformer la proposition en affirmation d’identité ni effacer le contraste avec la gloire qui abonde.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure exclamative « combien plus… ! » restitue la vigueur du raisonnement a fortiori de Paul. Le parallélisme « ministère de la condamnation / ministère de la justice » est conservé.
