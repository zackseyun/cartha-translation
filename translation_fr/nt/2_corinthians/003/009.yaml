revisions:
- from: Car si le ministère de la condamnation s’est accompagné de gloire, combien plus le ministère de la justice[a] abonde-t-il en gloire !
  to: Car si le ministère de la condamnation a été accompagné de gloire, combien plus le ministère de la justice[a] abonde-t-il en gloire !
  rationale: La révision remplace le réfléchi par une formulation française plus idiomatique qui maintient l’idée d’une gloire associée au ministère de la condamnation. Elle corrige aussi la note afin d’éviter l’équivalence lexicale inexacte avec « justification », tout en préservant l’éventail sémantique de δικαιοσύνη et sans trancher de question doctrinale.
