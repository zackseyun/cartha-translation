    issue: La note propose « justification » comme alternative de δικαιοσύνη.
    rationale: δικαιοσύνη peut, selon le contexte, renvoyer à la justice, à la droiture ou à un statut juste, mais « justification » n’est pas son équivalent lexical direct et risque de confondre ce terme avec δικαίωσις.
  - severity: low
    issue: « s’est accompagné de gloire » est moins naturel et légèrement imprécis.
    rationale: Le tour réfléchi suggère que le ministère s’accompagne lui-même. La voix passive conserve mieux l’idée que la gloire lui était associée.
