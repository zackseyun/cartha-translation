id: 2CO.3.6
reference: 2 Corinthians 3:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὃς καὶ ἱκάνωσεν ἡμᾶς διακόνους καινῆς διαθήκης, οὐ γράμματος ἀλλὰ πνεύματος, τὸ γὰρ γράμμα ἀποκτέννει, τὸ δὲ πνεῦμα ζῳοποιεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/006.yaml
  text: who also made us competent as servants of a new covenant[a], not of the letter but of the Spirit; for the letter kills[c][b], but the Spirit gives life.
translation:
  language: fr
  text: Il nous a aussi rendus capables d’être serviteurs d’une alliance nouvelle, non de la lettre, mais de l’Esprit[a] ; car la lettre tue[b], mais l’Esprit donne la vie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de l’esprit » et « l’esprit » dans les deux occurrences.
    reason: alternative_reading
  - marker: b
    text: La « lettre » peut aussi être comprise au sens de « code écrit ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἱκάνωσεν
  choice: a rendus capables
  rationale: Exprime l’action de Dieu qui donne l’aptitude nécessaire, sans suggérer une simple suffisance personnelle ni une qualification institutionnelle.
- source_word: διακόνους
  choice: serviteurs
  rationale: Conserve l’idée fondamentale de service et évite d’importer dans le verset le sens ecclésiastique plus spécialisé que peut prendre « ministres ».
- source_word: καινῆς διαθήκης
  choice: d’une alliance nouvelle
  rationale: Reproduit naturellement en français la construction grecque sans article et conserve la catégorie biblique de l’alliance.
- source_word: γράμματος / γράμμα
  choice: lettre
  rationale: Préserve la formulation concise et le contraste métaphorique de Paul ; « code écrit » serait une explicitation plus restrictive.
- source_word: πνεύματος / πνεῦμα
  choice: Esprit
  rationale: Dans le contexte de l’alliance nouvelle et de l’action qui donne la vie, le référent le plus probable est l’Esprit Saint ; l’ambiguïté graphique du grec est signalée en note.
- source_word: ἀποκτέννει
  choice: tue
  rationale: Rend directement la force du verbe grec et maintient le parallélisme frappant de la phrase.
- source_word: ζῳοποιεῖ
  choice: donne la vie
  rationale: Expression française naturelle qui restitue l’action vivifiante du verbe.
theological_decisions:
- issue: Faut-il comprendre πνεῦμα comme « Esprit » ou « esprit » ?
  choice: Esprit
  alternative: esprit
  rationale: Le contexte de l’alliance nouvelle favorise une référence à l’Esprit Saint, mais le grec ancien ne distingue pas les deux possibilités par la majuscule ; la variante est donc conservée en note.
- issue: Portée de l’opposition entre γράμμα et πνεῦμα
  choice: Conserver « lettre » sans identifier explicitement celle-ci à toute Écriture ni à un code précis
  alternative: code écrit
  rationale: Le grec formule une opposition dense dont le contexte développe la portée. Une explicitation dans le texte risquerait de résoudre abusivement la tension théologique.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve le contraste rhétorique de l’original. « Serviteurs » est préféré à « ministres » pour éviter une connotation d’office ecclésiastique, sans qu’une note soit nécessaire dans un verset isolé.
