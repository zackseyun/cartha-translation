  naturalness: « En cette même image » et « comme par le Seigneur » sont compréhensibles, mais moins idiomatiques en français international moderne. « En la même image » et « comme venant du Seigneur, l’Esprit » sont plus naturels tout en respectant la concision et l’ellipse grecques.
  terminology: « Seigneur », « Esprit », « gloire », « visage découvert » et « image » conviennent au registre biblique moderne. L’apposition « le Seigneur, l’Esprit » est conservée afin de ne pas imposer l’une des analyses doctrinales possibles.
