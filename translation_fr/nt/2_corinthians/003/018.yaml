reference: 2 Corinthians 3:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἡμεῖς δὲ πάντες ἀνακεκαλυμμένῳ προσώπῳ τὴν δόξαν κυρίου κατοπτριζόμενοι τὴν αὐτὴν εἰκόνα μεταμορφούμεθα ἀπὸ δόξης εἰς δόξαν, καθάπερ ἀπὸ κυρίου πνεύματος.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/018.yaml
  text: And we all[a], with unveiled face, beholding the glory of the Lord as in a mirror, are being transformed into the same image from glory to glory, just as from the Lord[b], the Spirit.
translation:
  language: fr
  text: Nous tous, le visage découvert, nous contemplons, comme dans un miroir[a], la gloire du Seigneur et sommes transformés en la même image, de gloire en gloire, comme venant du Seigneur, l’Esprit[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « nous reflétons, comme un miroir, la gloire du Seigneur ».'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « venant du Seigneur qui est l’Esprit »; autre traduction possible : « venant de l’Esprit du Seigneur ».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνακεκαλυμμένῳ προσώπῳ
  choice: le visage découvert
  rationale: Le participe parfait exprime l’état présent qui résulte du dévoilement. Cette formulation française naturelle conserve le singulier collectif du grec.
- source_word: δόξαν κυρίου
  choice: la gloire du Seigneur
  rationale: Le génitif est rendu directement, et « Seigneur » est l’équivalent usuel de κύριος dans ce contexte.
- source_word: κατοπτριζόμενοι
  choice: contemplons comme dans un miroir
  rationale: Le verbe peut désigner soit le fait de contempler au moyen d’un miroir, soit celui de refléter comme un miroir. Le premier sens s’accorde bien avec la transformation qui découle de la vision de la gloire, sans supprimer l’autre possibilité, signalée en note.
- source_word: τὴν αὐτὴν εἰκόνα
  choice: cette même image
  rationale: Cette traduction directe maintient le lien entre la gloire contemplée et l’image en laquelle les croyants sont transformés.
- source_word: μεταμορφούμεθα
  choice: sommes transformés
  rationale: Le présent passif décrit une transformation en cours. En français, le présent passif peut naturellement porter cette valeur progressive sans ajout explicatif.
- source_word: ἀπὸ δόξης εἰς δόξαν
  choice: de gloire en gloire
  rationale: La formule ramassée du grec est conservée, plutôt que développée en degrés successifs, ce qui serait plus interprétatif.
- source_word: καθάπερ
  choice: comme
  rationale: « Comme » rend simplement et naturellement la comparaison ou la correspondance introduite par καθάπερ.
- source_word: ἀπὸ κυρίου πνεύματος
  choice: par le Seigneur, l’Esprit
  rationale: La formule grecque est très concise et syntaxiquement ambiguë. Cette tournure conserve une lecture appositionnelle sans l’expliciter davantage; les autres analyses plausibles figurent en note.
- source_word: κύριος
  choice: Seigneur
  rationale: « Seigneur » est l’équivalent français courant et digne de κύριος dans les deux occurrences du verset.
theological_decisions:
- issue: Le sens de κατοπτριζόμενοι
  choice: contemplant la gloire du Seigneur comme dans un miroir
  alternative: reflétant comme un miroir la gloire du Seigneur
  rationale: Le contexte relie la perception de la gloire à la transformation, ce qui favorise « contempler ». Comme le sens de « refléter » est réellement possible, il est conservé en note.
- issue: La relation entre κυρίου et πνεύματος dans la proposition finale
  choice: par le Seigneur, l’Esprit
  alternative: par le Seigneur qui est l’Esprit; ou par l’Esprit du Seigneur
  rationale: Le grec permet une apposition, une proposition d’identification implicite ou éventuellement une relation génitive. Le texte principal garde la concision et la tension de l’expression, tandis que la note présente les autres lectures.
translation_notes:
  register: Français international moderne, clair et digne. La structure collective de la phrase est préservée, avec une coordination verbale naturelle en français. Les formulations volontairement compactes « de gloire en gloire » et « le Seigneur, l’Esprit » maintiennent l’ambiguïté et la densité théologique du grec.
