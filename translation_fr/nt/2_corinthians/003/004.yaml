source:
  edition: SBLGNT
  text: Πεποίθησιν δὲ τοιαύτην ἔχομεν διὰ τοῦ Χριστοῦ πρὸς τὸν θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/004.yaml
  text: Such confidence we have through Messiah toward God[a][b].
translation:
  language: fr
  text: Telle est l’assurance que nous avons, par le Messie[a], à l’égard de Dieu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « par le Christ ».'
    reason: alternative_reading
  - marker: b
    text: 'Littéralement : « vers Dieu »; on pourrait aussi traduire « devant Dieu » ou « envers Dieu ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πεποίθησιν
  choice: l’assurance
  rationale: « Assurance » exprime ici une confiance ferme et fondée, sans suggérer une simple impression subjective.
- source_word: δὲ τοιαύτην
  choice: Telle est
  rationale: Cette tournure française naturelle reprend le contexte précédent et conserve la valeur qualitative de τοιαύτην; δὲ reste léger dans l’enchaînement.
- source_word: ἔχομεν
  choice: que nous avons
  rationale: Équivalent direct et idiomatique du verbe grec.
- source_word: διὰ τοῦ Χριστοῦ
  choice: par le Messie
  rationale: διά suivi du génitif marque ici la médiation; « par » est naturel en français. Χριστός est rendu comme un titre.
- source_word: πρὸς τὸν θεόν
  choice: à l’égard de Dieu
  rationale: La formule conserve l’orientation relationnelle de πρός tout en étant plus idiomatique en français que le calque « vers Dieu ».
theological_decisions:
- issue: Rendu de Χριστοῦ
  choice: le Messie
  alternative: le Christ
  rationale: Le terme fonctionne comme un titre dans cette formulation; « le Messie » en rend explicitement le sens, tandis que la forme traditionnelle figure en note.
- issue: Portée de πρὸς τὸν θεόν
  choice: à l’égard de Dieu
  alternative: devant Dieu / envers Dieu
  rationale: Le grec indique une orientation vers Dieu sans préciser davantage si elle est surtout relationnelle, référentielle ou exprimée en sa présence; le rendu retenu évite de trancher excessivement.
translation_notes:
  register: Français international moderne, sobre et digne. « Telle est l’assurance » assure un lien naturel avec le contexte. Les notes préservent à la fois la forme traditionnelle « Christ » et l’ambiguïté de πρός.
