id: 2CO.3.14
reference: 2 Corinthians 3:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀλλὰ ἐπωρώθη τὰ νοήματα αὐτῶν. ἄχρι γὰρ τῆς σήμερον ⸀ἡμέρας τὸ αὐτὸ κάλυμμα ἐπὶ τῇ ἀναγνώσει τῆς παλαιᾶς διαθήκης μένει μὴ ἀνακαλυπτόμενον, ⸀ὅτι ἐν Χριστῷ καταργεῖται,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/014.yaml
  text: But their minds were hardened[a]. For until this very day, at the reading of the old covenant, the same veil remains, not being lifted[b], because in Messiah it is removed.
translation:
  language: fr
  text: Mais leur intelligence s’est endurcie. En effet, jusqu’à aujourd’hui, lors de la lecture de l’ancienne alliance[a], ce même voile demeure sans être levé, car c’est dans le Messie qu’il est ôté[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de l’Ancien Testament ». Le grec dit littéralement « de l’ancienne alliance ».
    reason: lexical_alternative
  - marker: b
    text: 'Autre compréhension possible : « car l’ancienne alliance est abolie — ou mise de côté — dans le Messie ». Le sujet implicite du verbe grec peut être compris comme le voile ou comme l’ancienne alliance.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπωρώθη
  choice: s’est endurcie
  rationale: Rend le passif grec par une tournure pronominale française naturelle et exprime l’insensibilité ou la résistance spirituelle sans affirmer explicitement qu’elle serait volontaire.
- source_word: τὰ νοήματα αὐτῶν
  choice: leur intelligence
  rationale: Dans ce contexte, le pluriel grec désigne leur faculté de comprendre et de percevoir. Le singulier collectif « leur intelligence » est idiomatique en français.
- source_word: ἄχρι γὰρ τῆς σήμερον ἡμέρας
  choice: En effet, jusqu’à aujourd’hui
  rationale: Conserve à la fois le lien explicatif introduit par γάρ et l’insistance temporelle de l’expression grecque.
- source_word: τὸ αὐτὸ κάλυμμα
  choice: ce même voile
  rationale: Préserve l’image du voile et son lien avec Moïse dans le contexte immédiat.
- source_word: ἐπὶ τῇ ἀναγνώσει
  choice: lors de la lecture
  rationale: Formulation française naturelle qui conserve la valeur circonstancielle de la construction grecque.
- source_word: τῆς παλαιᾶς διαθήκης
  choice: de l’ancienne alliance
  rationale: διαθήκη signifie ici « alliance »; ce choix privilégie le sens grec plutôt que l’appellation traditionnelle « Ancien Testament ».
- source_word: μένει μὴ ἀνακαλυπτόμενον
  choice: demeure sans être levé
  rationale: Conserve l’aspect continu de μένει et rend le participe passif en maintenant l’image concrète du voile que l’on lève.
- source_word: ἐν Χριστῷ
  choice: dans le Messie
  rationale: Χριστός fonctionne comme un titre; « le Messie » en communique directement le sens en français actuel.
- source_word: καταργεῖται
  choice: il est ôté
  rationale: Avec « voile » comme antécédent le plus proche, « être ôté » rend naturellement la suppression exprimée par le passif grec et reste cohérent avec l’image.
theological_decisions:
- issue: Référent implicite de καταργεῖται
  choice: 'Le sujet implicite est « le voile » : « dans le Messie, il est ôté ».'
  alternative: L’ancienne alliance est abolie ou mise de côté dans le Messie; la formulation grecque peut aussi être comprise comme maintenant une certaine ambiguïté entre le voile et l’alliance.
  rationale: « Le voile » est l’antécédent le plus proche et s’accorde avec l’image du participe précédent. Une note signale toutefois l’autre compréhension importante afin de ne pas effacer la tension syntaxique et théologique.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve la métaphore du voile, évite un vocabulaire confessionnel marqué et place les appels de note exactement auprès des expressions concernées.
