  text: You are our letter[a], written in our hearts, known and read by all people.
translation:
  language: fr
  text: 'Notre lettre, c’est vous : elle est écrite dans nos cœurs, connue[a] et lue par tous.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « reconnue ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡ ἐπιστολὴ ἡμῶν
  choice: Notre lettre
  rationale: '« Lettre » est l’équivalent moderne et naturel de ἐπιστολή. Le génitif ἡμῶν exprime ici l’appartenance métaphorique : les Corinthiens constituent la lettre de Paul et de ses collaborateurs.'
- source_word: ὑμεῖς ἐστε
  choice: c’est vous
  rationale: La tournure présentative française rend naturellement la proposition attributive et met en relief le pronom explicite ὑμεῖς.
- source_word: ἐγγεγραμμένη
  choice: elle est écrite
  rationale: Le participe parfait passif décrit une lettre qui demeure écrite. « Écrite » préserve clairement la métaphore sans la solennité plus marquée de « gravée » ou « inscrite ».
- source_word: ἐν ταῖς καρδίαις ἡμῶν
  choice: dans nos cœurs
  rationale: « Dans » correspond au sens ordinaire de ἐν et reste idiomatique en français tout en conservant l’image intérieure du texte source.
- source_word: γινωσκομένη
  choice: connue
  rationale: Le verbe peut signifier « être connue » ou « être reconnue ». « Connue » est direct et forme avec « lue » une paire naturelle, tandis que l’autre possibilité est signalée en note.
- source_word: ἀναγινωσκομένη
  choice: lue
  rationale: Le sens est proprement celui de lire; ce choix maintient explicitement la métaphore de la lettre.
- source_word: ὑπὸ πάντων ἀνθρώπων
  choice: par tous
  rationale: Dans ce contexte, πάντων ἀνθρώπων désigne toutes les personnes sans distinction. « Par tous » est inclusif, concis et naturel en français moderne.
