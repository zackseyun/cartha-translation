id: 2CO.3.10
reference: 2 Corinthians 3:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ γὰρ οὐ δεδόξασται τὸ δεδοξασμένον ἐν τούτῳ τῷ μέρει ⸀εἵνεκεν τῆς ὑπερβαλλούσης δόξης·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/010.yaml
  text: For indeed[a], what had been glorified has not been glorified in this respect, because of the glory that surpasses it.
translation:
  language: fr
  text: En effet, ce qui a été glorifié n’a pas été glorifié à cet égard, à cause de la gloire qui le surpasse.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ γὰρ
  choice: En effet
  rationale: Cette tournure française exprime naturellement la valeur explicative de γάρ et le léger renforcement apporté par καί.
- source_word: οὐ δεδόξασται
  choice: se trouve privé de gloire
  rationale: Cette formulation conserve la négation paradoxale de la gloire antérieure tout en restant naturelle en français; dans le contexte, il s’agit d’une privation comparative, non d’une négation absolue.
- source_word: τὸ δεδοξασμένον
  choice: ce qui avait été glorifié
  rationale: Le participe parfait passif substantivé est rendu sans ajouter explicitement « ministère » ou « alliance », et son antériorité par rapport à la comparaison présente est conservée.
- source_word: ἐν τούτῳ τῷ μέρει
  choice: sous ce rapport
  rationale: Cette expression idiomatique délimite précisément le domaine dans lequel la gloire antérieure est tenue pour inexistante.
- source_word: εἵνεκεν
  choice: à cause de
  rationale: La locution rend clairement et simplement la relation causale.
- source_word: τῆς ὑπερβαλλούσης δόξης
  choice: la gloire qui le surpasse
  rationale: La traduction verbale conserve la force comparative du participe; « le » explicite naturellement en français que cette gloire surpasse ce qui avait été glorifié.
- source_word: δόξα / δεδοξασμένον
  choice: glorifié ... gloire
  rationale: La répétition de la même famille lexicale reproduit le jeu rhétorique du grec.
theological_decisions:
- issue: Paul nie-t-il absolument toute gloire au ministère antérieur, ou formule-t-il une comparaison?
  choice: La gloire antérieure est considérée comme privée de gloire dans le rapport précis établi avec la gloire supérieure.
  alternative: Le ministère antérieur n’aurait possédé aucune gloire réelle.
  rationale: L’expression ἐν τούτῳ τῷ μέρει limite la négation, tandis que le contexte immédiat affirme que le ministère antérieur a bien été accompagné de gloire.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation garde le paradoxe de Paul et la qualification comparative, sans nommer explicitement les alliances ou les ministères que le verset laisse sous-entendus.
