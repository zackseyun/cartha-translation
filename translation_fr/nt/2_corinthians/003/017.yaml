  text: ὁ δὲ κύριος τὸ πνεῦμά ἐστιν· οὗ δὲ τὸ πνεῦμα ⸀κυρίου, ἐλευθερία.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/017.yaml
  text: The Lord is the Spirit[a], and where the Spirit of the Lord is, there is freedom.
translation:
  language: fr
  text: Or, le Seigneur est l’Esprit[a], et là où est l’Esprit du Seigneur, là est la liberté.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : l’affirmation « le Seigneur est l’Esprit » peut être comprise comme une identification étroite dans ce contexte, sans préciser comment cette relation doit être définie sur le plan théologique.'
    reason: alternative_reading
lexical_decisions:
- source_word: κύριος
  choice: Seigneur
  rationale: « Seigneur » est l’équivalent français usuel dans cet emploi paulinien et théologique, sans imposer dans la traduction l’identification précise du référent.
- source_word: πνεῦμα
  choice: Esprit
  rationale: La majuscule indique que, dans les deux occurrences, Paul parle de l’Esprit divin plutôt que de l’esprit humain ou d’une disposition impersonnelle.
- source_word: δὲ
  choice: Or / et
  rationale: Le premier δέ marque la progression de l’argument et se rend naturellement par « Or » ; le second est intégré par « et », conformément à la syntaxe française.
- source_word: οὗ
  choice: là où
  rationale: « Là où » exprime naturellement la valeur locative générale du relatif grec, sans élargir explicitement le sens jusqu’à « partout où ».
- source_word: ἐλευθερία
  choice: liberté
  rationale: « Liberté » est l’équivalent français contemporain direct, naturel et théologiquement non réducteur.
- source_word: ὁ δὲ κύριος τὸ πνεῦμά ἐστιν
  choice: Or, le Seigneur est l’Esprit
  rationale: La proposition équative est conservée sans atténuation ni explication doctrinale ajoutée ; « l’Esprit » rend naturellement l’article grec.
- source_word: τὸ πνεῦμα κυρίου
  choice: l’Esprit du Seigneur
  rationale: Cette formulation conserve explicitement la construction génitive et ses résonances bibliques.
theological_decisions:
- issue: La portée de l’affirmation « le Seigneur est l’Esprit » est discutée sur le plan théologique.
  choice: 'Conserver sans atténuation l’affirmation équative : « le Seigneur est l’Esprit ».'
  alternative: Comprendre cette phrase comme une identification étroite, fonctionnelle ou liée à la nouvelle alliance, sans en faire une équation exhaustive des personnes ; « le Seigneur » peut aussi être compris précisément comme le Christ ou plus largement comme une désignation divine.
  rationale: Le grec formule directement cette identification. La traduction doit en préserver la force et la tension, sans définir à la place du lecteur la relation théologique en jeu.
translation_notes:
  register: Français international moderne, digne et accessible. « Or » marque sobrement la progression argumentative ; la reprise « là où… là est… » reste idiomatique tout en reflétant la structure concise du grec.
