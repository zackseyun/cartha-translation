id: 2CO.3.15
reference: 2 Corinthians 3:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀλλ’ ἕως σήμερον ἡνίκα ⸂ἂν ἀναγινώσκηται⸃ Μωϋσῆς κάλυμμα ἐπὶ τὴν καρδίαν αὐτῶν κεῖται·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/015.yaml
  text: But to this day[a], whenever Moses is read[b], a veil lies over their heart.
translation:
  language: fr
  text: Mais jusqu’à aujourd’hui, chaque fois qu’on lit Moïse[a], un voile demeure sur leur cœur[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ici, « Moïse » désigne les écrits de Moïse, en particulier la Loi.
    reason: cultural_note
  - marker: b
    text: 'Le grec emploie le singulier « leur cœur », probablement dans un sens collectif. On pourrait aussi traduire : « leurs cœurs ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: Mais
  rationale: Marque le contraste avec l’affirmation précédente de manière concise et naturelle.
- source_word: ἕως σήμερον
  choice: jusqu’à aujourd’hui
  rationale: Expression temporelle naturelle qui indique que la situation se prolonge jusqu’au présent.
- source_word: ἡνίκα ἂν ἀναγινώσκηται
  choice: chaque fois qu’on lit
  rationale: La construction avec ἄν et le subjonctif exprime une circonstance indéfinie et répétée. La tournure impersonnelle française rend naturellement le passif grec.
- source_word: Μωϋσῆς
  choice: Moïse
  rationale: Conserve la métonymie du grec, où le nom de Moïse désigne ses écrits, sans expliciter cette interprétation dans le corps du texte.
- source_word: κάλυμμα
  choice: un voile
  rationale: Correspond à l’image développée dans le contexte immédiat du chapitre.
- source_word: ἐπὶ τὴν καρδίαν αὐτῶν
  choice: sur leur cœur
  rationale: Respecte le singulier collectif du grec tout en restant intelligible en français.
- source_word: κεῖται
  choice: demeure
  rationale: Exprime l’état durable du voile posé sur le cœur et s’accorde naturellement avec « jusqu’à aujourd’hui ».
theological_decisions:
- issue: Faut-il expliciter que « Moïse » désigne les écrits mosaïques ?
  choice: Conserver « Moïse » comme métonymie dans le texte principal.
  alternative: Traduire par « la Loi de Moïse » ou « les écrits de Moïse ».
  rationale: Le grec dit simplement « Moïse ». Le maintien de cette formulation préserve l’image et évite de préciser davantage que le texte source ; une note en éclaire le sens.
- issue: Faut-il transformer le singulier collectif « leur cœur » en pluriel ?
  choice: Maintenir « leur cœur » au singulier.
  alternative: Traduire par « leurs cœurs ».
  rationale: Le singulier grec peut avoir une valeur collective. Le conserver préserve cette nuance sans exclure une application à chacun.
translation_notes:
  register: Français international moderne, digne et accessible. « Chaque fois qu’on lit » est plus naturel que le passif littéral « chaque fois que Moïse est lu », tandis que « leur cœur » conserve délibérément le singulier collectif du texte grec.
