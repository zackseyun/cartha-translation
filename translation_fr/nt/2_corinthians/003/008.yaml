id: 2CO.3.8
reference: 2 Corinthians 3:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: πῶς οὐχὶ μᾶλλον ἡ διακονία τοῦ πνεύματος ἔσται ἐν δόξῃ;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/008.yaml
  text: how will the ministry of the Spirit not be even more in glory?[a]
translation:
  language: fr
  text: Comment le ministère de l’Esprit ne sera-t-il pas, à plus forte raison, revêtu de gloire ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « accompagné d’une gloire encore plus grande » ; autre traduction possible : « ne sera-t-il pas encore plus glorieux ? »'
    reason: La construction ἐν δόξῃ peut exprimer l’état, la manière ou l’accompagnement; plusieurs formulations françaises rendent légitimement cette nuance.
lexical_decisions:
- source_word: πῶς οὐχὶ
  choice: Comment… ne sera-t-il pas
  rationale: Cette tournure française naturelle conserve la forme de la question rhétorique, qui appelle une réponse affirmative.
- source_word: μᾶλλον
  choice: à plus forte raison
  rationale: L’expression fait ressortir le raisonnement comparatif du moindre au plus grand établi par le contexte.
- source_word: ἡ διακονία
  choice: le ministère
  rationale: Dans ce passage, le terme désigne une mission ou un service confié dans le cadre de l’alliance; « ministère » maintient aussi le parallèle avec le verset précédent.
- source_word: τοῦ πνεύματος
  choice: de l’Esprit
  rationale: Le contexte immédiat, notamment 2 Corinthiens 3.6, indique que Paul parle de l’Esprit Saint. La majuscule explicite ce référent sans ajouter de précision au texte.
- source_word: ἔσται
  choice: sera
  rationale: Le futur simple rend directement le futur de εἰμί.
- source_word: ἐν δόξῃ
  choice: revêtu de gloire
  rationale: Cette formulation française idiomatique conserve l’image de la gloire associée au ministère et le lien lexical avec les versets voisins, sans réduire la phrase à un simple adjectif.
theological_decisions:
- issue: Référent de πνεύματος
  choice: L’Esprit Saint
  alternative: l’esprit dans un sens abstrait ou impersonnel
  rationale: Le contraste entre la lettre et l’Esprit, ainsi que l’affirmation de 2 Corinthiens 3.6 selon laquelle l’Esprit fait vivre, favorisent clairement le référent personnel divin.
- issue: Valeur de ἐν δόξῃ
  choice: revêtu de gloire
  alternative: glorieux
  rationale: Le choix retenu préserve davantage la construction prépositionnelle et la répétition thématique de δόξα dans le passage, tout en restant naturel en français.
translation_notes:
  register: Français international moderne, digne et accessible. La question rhétorique grecque est maintenue; « à plus forte raison » rend clairement la progression argumentative. « Revêtu de gloire » évite le calque peu naturel « dans la gloire » tout en conservant l’imagerie et la tension lexicale du passage.
