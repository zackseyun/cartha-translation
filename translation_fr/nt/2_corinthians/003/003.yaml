revisions:
- from: Vous montrez clairement que vous êtes une lettre du Messie[a], préparée par notre ministère, écrite non avec de l’encre, mais avec l’Esprit du Dieu vivant, non sur des tablettes de pierre, mais sur des tablettes que sont des cœurs de chair[b].
  to: 'Il apparaît clairement que vous êtes une lettre du Messie[a], dont nous avons été les serviteurs, écrite non avec de l’encre, mais avec l’Esprit du Dieu vivant, non sur des tablettes de pierre, mais sur des tablettes : des cœurs de chair[b].'
  rationale: La révision corrige la voix du participe initial et évite l’ajout de sens dans « préparée ». Elle conserve l’ambiguïté du génitif Χριστοῦ, la référence contextuellement fondée à l’Esprit, ainsi que l’apposition entre les tablettes et les cœurs.
