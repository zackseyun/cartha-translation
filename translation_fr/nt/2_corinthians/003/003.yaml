    issue: Voix de φανερούμενοι
    rationale: « Vous montrez clairement » transforme un participe passif (« étant rendus manifestes ») en verbe actif. La formulation révisée maintient l’évidence publique sans changer les rôles.
  - severity: medium
    issue: Sens de διακονηθεῖσα
    rationale: « Préparée par notre ministère » introduit « préparer » et abstrait indûment le rôle de Paul et de ses collaborateurs. « Dont nous avons été les serviteurs » conserve le champ de διακονέω.
  - severity: low
    issue: Construction finale
    rationale: « Des tablettes que sont des cœurs de chair » est grammaticalement possible mais peu idiomatique. Les deux-points expriment naturellement l’apposition et conservent l’image.
  - severity: low
    issue: Note sur Χριστός
    rationale: La note gagne à distinguer la traduction du titre (« Messie ») de sa forme traditionnelle française (« Christ »).
