language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: φανερούμενοι ὅτι ἐστὲ ἐπιστολὴ Χριστοῦ διακονηθεῖσα ὑφ’ ἡμῶν, ἐγγεγραμμένη οὐ μέλανι ἀλλὰ πνεύματι θεοῦ ζῶντος, οὐκ ἐν πλαξὶν λιθίναις ἀλλ’ ἐν πλαξὶν καρδίαις σαρκίναις.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/003.yaml
  text: showing that you are a letter from the Messiah[a], ministered by us, written not with ink but with the Spirit of the living God[d][c][b], not on stone tablets but on tablets of hearts of flesh.
translation:
  language: fr
  text: 'Il apparaît clairement que vous êtes une lettre du Messie[a], dont nous avons été les serviteurs, écrite non avec de l’encre, mais avec l’Esprit du Dieu vivant, non sur des tablettes de pierre, mais sur des tablettes : des cœurs de chair[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une lettre du Christ ». « Christ » est la forme traditionnelle du titre grec Χριστός, rendu ici par « Messie »; le génitif peut exprimer l’origine, l’auteur ou l’appartenance.
    reason: alternative_reading
  - marker: b
    text: L’expression « cœurs de chair » fait écho à la promesse d’un cœur nouveau en Ézéchiel 11.19 et 36.26.
    reason: cross_reference
lexical_decisions:
- source_word: φανερούμενοι
  choice: Vous montrez clairement
  rationale: Le participe passif a le sens d’« être manifesté, apparaître clairement ». Cette formulation française exprime l’évidence publique tout en s’intégrant naturellement à la phrase.
- source_word: ἐπιστολὴ
  choice: lettre
  rationale: Équivalent français courant qui conserve pleinement la métaphore épistolaire.
- source_word: Χριστοῦ
  choice: du Messie
  rationale: Χριστός est ici un titre. Le génitif, volontairement conservé sous une forme compacte, peut évoquer l’origine ou l’appartenance de la lettre sans imposer une seule analyse.
- source_word: διακονηθεῖσα
  choice: préparée par notre ministère
  rationale: Le passif de διακονέω présente Paul et ses collaborateurs comme les agents au service de cette lettre. « Préparée par notre ministère » convient à la métaphore sans réduire leur rôle à une simple livraison.
- source_word: ἐγγεγραμμένη
  choice: écrite
  rationale: Terme naturel en français, adapté au contraste entre l’encre et l’Esprit.
- source_word: μέλανι
  choice: encre
  rationale: Équivalent direct dans la métaphore de l’écriture.
- source_word: πνεύματι θεοῦ ζῶντος
  choice: l’Esprit du Dieu vivant
  rationale: Le contexte de l’action divine et de la nouvelle alliance indique l’Esprit de Dieu; la majuscule rend cette référence personnelle explicite.
- source_word: πλαξὶν λιθίναις
  choice: tablettes de pierre
  rationale: Formulation française naturelle qui conserve l’allusion aux tables du Sinaï.
- source_word: πλαξὶν καρδίαις σαρκίναις
  choice: des tablettes que sont des cœurs de chair
  rationale: 'Cette formulation traite καρδίαις σαρκίναις comme une précision appositive de πλαξίν : les tablettes sont les cœurs. Elle préserve aussi l’expression biblique « cœurs de chair ».'
theological_decisions:
- issue: Valeur du génitif Χριστοῦ
  choice: du Messie
  alternative: venant du Messie; du Christ
  rationale: « Du Messie » préserve en français l’ambiguïté entre origine, auteur et appartenance, tandis que « venant du Messie » trancherait en faveur de l’origine. « Messie » traduit le titre Χριστός.
- issue: Référence de πνεύματι
  choice: l’Esprit du Dieu vivant
  alternative: l’esprit du Dieu vivant
  rationale: Le contraste avec l’encre et le cadre de l’écriture divine sur les cœurs favorisent nettement une référence à l’Esprit de Dieu.
- issue: Relation entre les tablettes et les cœurs
  choice: des tablettes que sont des cœurs de chair
  alternative: des tablettes de cœurs de chair
  rationale: La formulation retenue rend l’apposition probable et évite de faire des cœurs la matière dont seraient constituées les tablettes, tout en signalant en note l’écho biblique.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve la métaphore suivie de la lettre et les contrastes en parallèle. « Préparée par notre ministère » évite le calque peu naturel « administrée par nous » tout en maintenant la nuance de service de διακονηθεῖσα.
