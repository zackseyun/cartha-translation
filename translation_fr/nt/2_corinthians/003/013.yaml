id: 2CO.3.13
reference: 2 Corinthians 3:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ οὐ καθάπερ Μωϋσῆς ἐτίθει κάλυμμα ἐπὶ τὸ πρόσωπον ⸀αὐτοῦ, πρὸς τὸ μὴ ἀτενίσαι τοὺς υἱοὺς Ἰσραὴλ εἰς τὸ τέλος τοῦ καταργουμένου.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/013.yaml
  text: and not like Moses[b][a], who used to put a veil over his face so that the sons of Israel would not gaze at the end of what was fading away.
translation:
  language: fr
  text: et non pas comme Moïse, qui mettait un voile sur son visage afin que les Israélites[b] ne fixent pas du regard la fin de ce qui disparaissait[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le but — ou l’aboutissement — de ce qui était en train d’être supprimé ».'
    reason: alternative_reading
  - marker: b
    text: 'Littéralement : « les fils d’Israël ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθάπερ
  choice: comme
  rationale: Introduit naturellement la comparaison avec l’affirmation précédente tout en conservant sa force comparative.
- source_word: ἐτίθει
  choice: mettait
  rationale: L’imparfait français rend naturellement l’action répétée ou habituelle suggérée par l’imparfait grec.
- source_word: κάλυμμα
  choice: voile
  rationale: Terme précis et traditionnel pour ce qui couvrait le visage de Moïse; il convient aussi à la métaphore développée par Paul.
- source_word: πρόσωπον αὐτοῦ
  choice: son visage
  rationale: Rend directement et naturellement le sens de l’expression grecque.
- source_word: πρὸς τὸ μὴ ἀτενίσαι
  choice: afin que… ne fixent pas du regard
  rationale: « Afin que » exprime le but, tandis que « fixer du regard » conserve l’idée d’un regard soutenu portée par ἀτενίζω.
- source_word: τοὺς υἱοὺς Ἰσραήλ
  choice: les Israélites
  rationale: Expression idiomatique et inclusive en français moderne; une note signale la formulation littérale du grec.
- source_word: εἰς τὸ τέλος
  choice: la fin
  rationale: « Fin » convient au contraste contextuel entre ce qui est passager et ce qui demeure, sans exclure les nuances possibles de but ou d’aboutissement, signalées en note.
- source_word: τοῦ καταργουμένου
  choice: de ce qui disparaissait
  rationale: Cette formulation naturelle exprime la disparition progressive dans le contexte de la gloire passagère, tout en évitant de préciser excessivement ce que le participe substantivé désigne.
theological_decisions:
- issue: Sens de τέλος τοῦ καταργουμένου
  choice: la fin de ce qui disparaissait
  alternative: le but ou l’aboutissement de ce qui était en train d’être supprimé
  rationale: Le contexte immédiat oppose ce qui est passager à ce qui demeure. Le texte principal retient le sens probable de cessation, tandis que la note préserve la possibilité que τέλος désigne le but ou l’aboutissement et que καταργουμένου évoque une suppression ou une abolition.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase conserve son caractère syntaxiquement lié au verset précédent. « Mettait » exprime sans lourdeur l’aspect habituel, et « fixer du regard » maintient l’intensité du verbe grec.
