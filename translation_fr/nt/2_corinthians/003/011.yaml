id: 2CO.3.11
reference: 2 Corinthians 3:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἰ γὰρ τὸ καταργούμενον διὰ δόξης, πολλῷ μᾶλλον τὸ μένον ἐν δόξῃ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/011.yaml
  text: For if what was being brought to an end came with glory[c][b][a], much more what remains is in glory.
translation:
  language: fr
  text: Car si ce qui prend fin[a] s’est accompagné de gloire[b], à combien plus forte raison ce qui demeure[c] est-il dans la gloire !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ce qui est supprimé », « ce qui est rendu caduc » ou « ce qui est aboli ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « à travers la gloire ».'
    reason: lexical_alternative
  - marker: c
    text: Ou « ce qui subsiste » ou « ce qui reste ».
    reason: lexical_alternative
lexical_decisions:
- source_word: καταργούμενον
  choice: ce qui prend fin
  rationale: Le participe présent passif désigne ce qui est en voie d’être supprimé ou rendu inopérant. « Ce qui prend fin » exprime naturellement le caractère temporaire sans préciser dans le texte ce dont il s’agit.
- source_word: διὰ δόξης
  choice: s’est accompagné de gloire
  rationale: La tournure grecque signifie littéralement « à travers la gloire ». En français, « s’est accompagné de gloire » rend de façon idiomatique l’idée que la réalité passagère est venue avec gloire.
- source_word: μένον
  choice: ce qui demeure
  rationale: « Demeure » conserve le participe substantivé neutre et le contraste direct entre ce qui prend fin et ce qui reste durablement.
- source_word: ἐν δόξῃ
  choice: est dans la gloire
  rationale: Cette formulation proche du grec préserve le contraste rhétorique entre διὰ δόξης et ἐν δόξῃ, sans réduire la dernière expression à un simple adjectif.
- source_word: πολλῷ μᾶλλον
  choice: à combien plus forte raison
  rationale: Cette expression française naturelle marque avec force le raisonnement a fortiori de Paul.
theological_decisions:
- issue: Nature du contraste entre l’ancienne et la nouvelle alliance
  choice: Conserver les deux participes substantivés sans nommer explicitement les alliances ou leurs ministères.
  alternative: Identifier dans le verset même l’ancienne alliance comme abolie et la nouvelle comme permanente.
  rationale: Le grec ne nomme pas explicitement les alliances dans ce verset. La formulation retenue maintient la tension et laisse le contexte établir l’identité des deux réalités opposées.
- issue: Force de καταργούμενον
  choice: Employer « ce qui prend fin », formulation qui souligne le caractère passager sans imposer une interprétation doctrinale plus précise.
  alternative: Traduire par « ce qui est aboli », « ce qui est supprimé » ou « ce qui est rendu caduc ».
  rationale: Le verbe peut exprimer l’abolition ou la mise hors d’effet, mais le contexte insiste aussi sur l’opposition entre le temporaire et ce qui demeure. Une note conserve les lectures lexicalement plus fortes.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La structure conditionnelle et le raisonnement a fortiori sont conservés. L’exclamation rend l’intensité rhétorique de la comparaison sans ajouter de contenu doctrinal.
