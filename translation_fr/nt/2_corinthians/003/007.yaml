id: 2CO.3.7
reference: 2 Corinthians 3:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Εἰ δὲ ἡ διακονία τοῦ θανάτου ἐν ⸀γράμμασιν ⸀ἐντετυπωμένη λίθοις ἐγενήθη ἐν δόξῃ, ὥστε μὴ δύνασθαι ἀτενίσαι τοὺς υἱοὺς Ἰσραὴλ εἰς τὸ πρόσωπον Μωϋσέως διὰ τὴν δόξαν τοῦ προσώπου αὐτοῦ τὴν καταργουμένην,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/007.yaml
  text: But if the ministry of death[a], engraved in letters on stones, came with glory, so that the sons of Israel were not able to gaze at Moses’ face because of the glory of his face, which was fading away[b],
translation:
  language: fr
  text: Mais si le ministère de la mort, gravé en lettres sur des pierres, est venu avec gloire, au point que les fils d’Israël[a] ne pouvaient fixer les yeux sur le visage de Moïse à cause de la gloire de son visage — une gloire qui était en train de disparaître[b] —,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi traduire : « les Israélites ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « qui était en train d’être abolie » ou « qui passait ».'
    reason: alternative_reading
lexical_decisions:
- source_word: διακονία
  choice: ministère
  rationale: « Ministère » conserve l’idée d’un service confié et convient au contraste établi par Paul entre les deux alliances.
- source_word: τοῦ θανάτου
  choice: de la mort
  rationale: Le génitif grec est rendu sans explicitation afin de préserver la formulation frappante et la densité théologique du texte.
- source_word: ἐν γράμμασιν ἐντετυπωμένη λίθοις
  choice: gravé en lettres sur des pierres
  rationale: Cette formulation garde à la fois la référence explicite aux lettres, l’idée d’une inscription gravée et le pluriel littéral « pierres », sans ajouter « tables ».
- source_word: ἐγενήθη ἐν δόξῃ
  choice: est venu avec gloire
  rationale: La traduction rend la valeur événementielle du verbe et présente la gloire comme accompagnant ce ministère, sans ajouter l’idée plus interprétative d’une inauguration.
- source_word: ὥστε μὴ δύνασθαι ἀτενίσαι
  choice: au point que … ne pouvaient fixer les yeux
  rationale: « Au point que » exprime le résultat, et « fixer les yeux » restitue le regard soutenu indiqué par ἀτενίζω.
- source_word: τοὺς υἱοὺς Ἰσραήλ
  choice: les fils d’Israël
  rationale: La formulation masculine et concrète du grec est conservée; une note signale l’équivalent français plus courant.
- source_word: εἰς τὸ πρόσωπον Μωϋσέως
  choice: sur le visage de Moïse
  rationale: Cette tournure est idiomatique après « fixer les yeux » et maintient l’attention portée concrètement au visage de Moïse.
- source_word: καταργουμένην
  choice: qui était en train de disparaître
  rationale: Dans le contexte immédiat de la gloire visible du visage de Moïse, « disparaître » exprime naturellement son caractère transitoire, tandis qu’une note préserve les autres valeurs possibles du participe.
theological_decisions:
- issue: La valeur de καταργουμένην appliqué à la gloire du visage de Moïse
  choice: une gloire qui était en train de disparaître
  alternative: une gloire qui était en train d’être abolie / qui passait
  rationale: Le contexte immédiat concerne une gloire visible, ce qui favorise l’idée de disparition progressive. La note conserve toutefois la possibilité d’une cessation ou d’une abolition, afin de ne pas réduire la portée du terme dans l’argument de Paul.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase reste ouverte par une virgule, conformément à la syntaxe du verset grec, dont la proposition se poursuit au verset suivant. Les marqueurs de notes ont été placés auprès des expressions auxquelles leurs contenus se rapportent.
