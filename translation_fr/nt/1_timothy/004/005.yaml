  text: for it is sanctified through the word of God and prayer[a][b].
translation:
  language: fr
  text: car elle est rendue sainte par la parole de Dieu et par la prière[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « requête » ou « intercession ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἁγιάζεται
  choice: elle est rendue sainte
  rationale: Le présent passif renvoie à la nourriture mentionnée au verset précédent. Cette formulation française claire conserve le passif et le langage de sainteté sans imposer un sens technique.
- source_word: γὰρ
  choice: car
  rationale: La conjonction introduit l'explication de l'affirmation précédente; « car » en restitue naturellement la valeur explicative.
- source_word: διὰ
  choice: par
  rationale: Avec le génitif, διά exprime ici le moyen. La répétition de « par » devant les deux compléments rend clairement leur coordination.
- source_word: λόγου θεοῦ
  choice: la parole de Dieu
  rationale: Rendu direct du génitif, qui conserve une expression biblique familière et ne précise pas indûment s'il s'agit d'une déclaration scripturaire, créatrice ou plus largement divine.
- source_word: ἐντεύξεως
  choice: la prière
  rationale: Dans le contexte de la nourriture reçue avec reconnaissance, « prière » est naturel et suffisamment large. Les nuances possibles de requête ou d'intercession sont signalées en note.
theological_decisions:
- issue: Portée du langage de sanctification dans le contexte
  choice: Conserver « rendue sainte » en laissant le contexte indiquer qu'il s'agit de la nourriture reçue pour l'usage.
  alternative: « Elle est sanctifiée », formulation plus traditionnelle et potentiellement plus technique.
  rationale: Le contexte immédiat concerne les aliments reçus avec reconnaissance. La traduction préserve le langage de sainteté sans ajouter une affirmation sacramentelle, morale ou sotériologique absente du verset.
translation_notes:
  register: Français international moderne, sobre et digne. Le pronom féminin « elle » reprend naturellement « la nourriture » dans le contexte. La répétition de « par » évite toute ambiguïté syntaxique.
