id: 1TI.4.4
reference: 1 Timothy 4:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὅτι πᾶν κτίσμα θεοῦ καλόν, καὶ οὐδὲν ἀπόβλητον μετὰ εὐχαριστίας λαμβανόμενον,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/004.yaml
  text: For every creation of God is good[a], and nothing is to be rejected if it is received with thanksgiving[b],
translation:
  language: fr
  text: Car tout ce que Dieu a créé est bon[a], et rien n’est à rejeter si on le reçoit avec reconnaissance[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « toute créature de Dieu est bonne ». Le grec κτίσμα peut désigner une créature ou, plus largement, une chose créée.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « rien n’est à rejeter quand on le reçoit avec reconnaissance ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Car
  rationale: Introduit naturellement en français l’explication qui appuie l’affirmation précédente.
- source_word: πᾶν κτίσμα θεοῦ
  choice: tout ce que Dieu a créé
  rationale: Rend le singulier distributif et le sens large de κτίσμα de façon naturelle, sans limiter le propos aux animaux ni au seul cosmos.
- source_word: καλόν
  choice: bon
  rationale: Équivalent direct qui conserve l’écho du langage biblique de la création.
- source_word: οὐδὲν ἀπόβλητον
  choice: rien n’est à rejeter
  rationale: Formulation française idiomatique qui respecte la valeur adjectivale de ἀπόβλητον.
- source_word: μετὰ εὐχαριστίας
  choice: avec reconnaissance
  rationale: Exprime naturellement l’attitude de gratitude envers Dieu; « avec actions de grâce » demeure une possibilité plus traditionnelle.
- source_word: λαμβανόμενον
  choice: si on le reçoit
  rationale: Explicite de manière naturelle la circonstance conditionnelle portée par le participe présent passif, sans alourdir la phrase.
theological_decisions:
- issue: Portée de κτίσμα dans le contexte des aliments et des interdictions ascétiques
  choice: tout ce que Dieu a créé
  alternative: toute créature de Dieu; toute chose créée par Dieu; tout aliment créé par Dieu
  rationale: Le contexte immédiat concerne les aliments, mais le grec formule un principe plus large. La traduction conserve cette portée sans réduire κτίσμα aux animaux ou aux seuls aliments.
- issue: Valeur circonstancielle de λαμβανόμενον avec μετὰ εὐχαριστίας
  choice: si on le reçoit avec reconnaissance
  alternative: quand on le reçoit avec reconnaissance; étant reçu avec reconnaissance
  rationale: « Si » rend clairement le lien entre la non-exclusion et la réception reconnaissante, tout en laissant la note signaler la lecture temporelle possible du participe.
translation_notes:
  register: Français international moderne, naturel et digne. « Tout ce que Dieu a créé » évite l’ambiguïté française de « toute création », qui pourrait évoquer l’ensemble du cosmos. « Reconnaissance » est courant et clair; la tournure traditionnelle « actions de grâce » n’est pas nécessaire ici.
