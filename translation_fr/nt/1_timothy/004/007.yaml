source:
  edition: SBLGNT
  text: τοὺς δὲ βεβήλους καὶ γραώδεις μύθους παραιτοῦ. γύμναζε δὲ σεαυτὸν πρὸς εὐσέβειαν·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/007.yaml
  text: But reject profane and old-womanish myths[a], and train yourself for godliness.
translation:
  language: fr
  text: Mais rejette les mythes profanes et les histoires de vieilles femmes[a] ; entraîne-toi à la piété.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « des mythes caractéristiques de vieilles femmes ». L’expression grecque est péjorative.'
    reason: Précision lexicale et culturelle sur γραώδεις.
lexical_decisions:
- source_word: βεβήλους
  choice: profanes
  rationale: « Profanes » conserve l’opposition entre ce qui relève du domaine commun ou irrévérencieux et ce qui est sacré.
- source_word: γραώδεις
  choice: racontars de vieilles femmes
  rationale: Cette expression française garde l’image culturellement marquée et la force péjorative de l’adjectif grec, tout en restant intelligible. Une note en précise le sens littéral.
- source_word: μύθους
  choice: mythes
  rationale: « Mythes » rend directement μύθους et désigne ici des récits inventés ou spéculatifs, sans leur donner nécessairement la forme littéraire de fables.
- source_word: παραιτοῦ
  choice: rejette
  rationale: L’impératif demande de refuser ces récits et de ne pas leur accorder de place ; « rejette » en exprime clairement la vigueur.
- source_word: γύμναζε
  choice: entraîne-toi
  rationale: Le verbe évoque l’entraînement, notamment athlétique ; « entraîne-toi » restitue naturellement cette métaphore.
- source_word: σεαυτόν
  choice: -toi
  rationale: La forme pronominale de « entraîne-toi » rend directement le pronom réfléchi grec.
- source_word: πρὸς εὐσέβειαν
  choice: à vivre dans la piété
  rationale: πρός indique ici le but de l’entraînement. « Vivre dans la piété » explicite naturellement en français que εὐσέβεια désigne une manière de vivre marquée par le respect et l’attachement envers Dieu.
- source_word: δὲ … δὲ
  choice: Mais … plutôt
  rationale: « Mais » marque le contraste avec le contexte précédent ; « plutôt » fait ressortir l’opposition entre le refus des mythes et l’entraînement positif à la piété.
theological_decisions:
- issue: Rendu de l’expression péjorative γραώδεις μύθους
  choice: Conserver dans le texte l’image précise sous la forme « racontars de vieilles femmes » et signaler en note le sens littéral de l’adjectif.
  alternative: « mythes absurdes » ou « histoires de bonnes femmes »
  rationale: Le grec emploie une caractérisation culturellement marquée et dépréciative. « Absurdes » en effacerait l’image, tandis que « histoires de bonnes femmes » pourrait paraître plus méprisante ou vieillie en français actuel. Le choix retenu préserve la tension du texte sans la présenter comme une affirmation générale sur les femmes âgées.
- issue: Sens de εὐσέβεια
  choice: « vivre dans la piété »
  alternative: « l’attachement à Dieu » ou simplement « la piété »
  rationale: Dans les Pastorales, εὐσέβεια désigne une conduite respectueuse de Dieu et orientée vers lui. « Piété » conserve le terme théologique traditionnel, et l’ajout verbal « vivre dans » évite de suggérer une simple émotion ou une pratique formaliste.
translation_notes:
  register: Français international actuel, clair et digne. « Racontars » conserve la vigueur polémique sans recourir à l’expression vieillie « histoires de bonnes femmes ». Le point-virgule met en relief les deux impératifs opposés.
