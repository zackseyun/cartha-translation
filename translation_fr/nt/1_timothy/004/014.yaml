id: 1TI.4.14
reference: 1 Timothy 4:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: μὴ ἀμέλει τοῦ ἐν σοὶ χαρίσματος, ὃ ἐδόθη σοι διὰ προφητείας μετὰ ἐπιθέσεως τῶν χειρῶν τοῦ πρεσβυτερίου.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/014.yaml
  text: Do not neglect the gift that is in you[b][a], which was given to you through prophecy with the laying on of the hands of the eldership.
translation:
  language: fr
  text: Ne néglige pas le don qui est en toi, qui t’a été donné au moyen d’une prophétie[a], avec l’imposition des mains du collège des anciens[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « par une parole prophétique » ; l’expression peut indiquer que la prophétie accompagnait ou servait d’intermédiaire à l’octroi du don.
    reason: lexical_alternative
  - marker: b
    text: Ou « de l’assemblée des anciens » ; le terme grec désigne collectivement le groupe des anciens.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ ἀμέλει
  choice: Ne néglige pas
  rationale: Cette formulation naturelle exprime l’interdiction au présent et l’appel à ne pas laisser sans attention ce qui a été confié à Timothée.
- source_word: τοῦ ἐν σοὶ χαρίσματος
  choice: le don qui est en toi
  rationale: « Don » rend χάρισμα sans ajouter l’adjectif « spirituel », absent du grec, tandis que « qui est en toi » conserve la localisation explicite exprimée par ἐν σοὶ.
- source_word: ἐδόθη σοι
  choice: t’a été donné
  rationale: Le passif est conservé sans préciser l’auteur du don, que le grec laisse implicite.
- source_word: διὰ προφητείας
  choice: au moyen d’une prophétie
  rationale: διά suivi du génitif peut marquer le moyen ou l’intermédiaire. Cette traduction garde ce rapport tout en laissant ouverte la manière exacte dont la prophétie a participé à l’octroi du don.
- source_word: μετὰ ἐπιθέσεως τῶν χειρῶν
  choice: avec l’imposition des mains
  rationale: « Imposition des mains » est l’expression française courante et fidèle pour désigner ce geste.
- source_word: τοῦ πρεσβυτερίου
  choice: du collège des anciens
  rationale: Le terme désigne ici un corps collectif d’anciens. « Collège » communique cette dimension collective sans reprendre un terme lié à une organisation ecclésiastique ultérieure particulière.
theological_decisions:
- issue: Degré de précision à donner à χάρισμα
  choice: don
  alternative: don spirituel
  rationale: Le contexte suggère un don gracieux destiné au ministère, mais le grec n’emploie aucun adjectif correspondant à « spirituel » ; la traduction ne restreint donc pas davantage le sens.
- issue: Rôle de la prophétie dans l’octroi du don
  choice: au moyen d’une prophétie
  alternative: par une parole prophétique
  rationale: La préposition peut présenter la prophétie comme moyen ou intermédiaire, sans établir précisément si elle a accompagné, annoncé ou médiatisé l’octroi du don. Une note maintient cette latitude.
- issue: Nature du πρεσβυτέριον
  choice: collège des anciens
  alternative: assemblée des anciens
  rationale: Le grec indique un groupe d’anciens ayant participé à l’imposition des mains, sans imposer les structures ou le vocabulaire d’une confession ultérieure.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement convient à l’adresse personnelle de Paul à Timothée. La syntaxe demeure proche du grec sans devenir artificielle, et les notes préservent les ambiguïtés lexicales et ecclésiologiques pertinentes.
