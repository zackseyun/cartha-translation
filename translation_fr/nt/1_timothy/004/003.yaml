source:
  edition: SBLGNT
  text: κωλυόντων γαμεῖν, ἀπέχεσθαι βρωμάτων ἃ ὁ θεὸς ἔκτισεν εἰς μετάλημψιν μετὰ εὐχαριστίας τοῖς πιστοῖς καὶ ἐπεγνωκόσι τὴν ἀλήθειαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/003.yaml
  text: forbidding marriage and requiring abstinence from foods that God created to be received with thanksgiving by those who believe and have come to know the truth[a].
translation:
  language: fr
  text: ils interdiront de se marier et imposeront de s’abstenir d’aliments[a] que Dieu a créés pour qu’ils soient reçus avec action de grâce par ceux qui croient et qui ont connu la vérité.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « ils interdiront de se marier et de s’abstenir d’aliments ». Le texte principal explicite que ces personnes imposeront l’abstinence alimentaire.'
    reason: alternative lexicale et clarification de la construction elliptique
lexical_decisions:
- source_word: κωλυόντων
  choice: ils interdiront
  rationale: Le participe présent poursuit la description des personnes annoncées au verset précédent. Une proposition verbale au futur s’intègre naturellement à ce contexte en français.
- source_word: γαμεῖν
  choice: de se marier
  rationale: L’infinitif signifie directement « se marier »; cette formulation française est naturelle et conserve la construction verbale grecque.
- source_word: ἀπέχεσθαι βρωμάτων
  choice: imposeront de s’abstenir de certains aliments
  rationale: Le grec coordonne un second infinitif à « interdire », mais sa formulation est elliptique et pourrait sembler dire qu’ils interdisent l’abstinence. « Imposeront » explicite la force injonctive exigée par le contexte, tandis que « certains » indique naturellement qu’il s’agit des aliments visés par cette prescription, non de toute nourriture.
- source_word: ἔκτισεν
  choice: a créés
  rationale: « Créer » préserve la portée du vocabulaire de la création.
- source_word: εἰς μετάλημψιν
  choice: pour qu’ils soient reçus
  rationale: La tournure exprime la destination ou le but de ces aliments et reste idiomatique en français.
- source_word: μετὰ εὐχαριστίας
  choice: avec reconnaissance
  rationale: « Reconnaissance » exprime ici l’action de grâce envers Dieu dans un français courant et digne.
- source_word: τοῖς πιστοῖς
  choice: par ceux qui croient
  rationale: Ce choix rend le sens de « croyants » sans laisser entendre ici la seule qualité morale de fidélité.
- source_word: ἐπεγνωκόσι τὴν ἀλήθειαν
  choice: qui sont parvenus à connaître la vérité
  rationale: Le parfait exprime un état présent résultant de l’accès à la connaissance; cette formulation en conserve les deux dimensions.
theological_decisions:
- issue: τοῖς πιστοῖς καὶ ἐπεγνωκόσι τὴν ἀλήθειαν désigne-t-il un seul groupe ou deux groupes?
  choice: 'Un seul groupe décrit sous deux aspects : ceux qui croient et qui sont parvenus à connaître la vérité.'
  alternative: 'Deux groupes : les croyants, d’une part, et ceux qui ont connu la vérité, d’autre part.'
  rationale: L’article commun et la coordination favorisent l’identification d’un même groupe sans imposer deux catégories distinctes.
- issue: Comment rendre la coordination elliptique κωλυόντων γαμεῖν, ἀπέχεσθαι βρωμάτων?
  choice: Expliciter dans le texte que les faux enseignants imposent l’abstinence alimentaire.
  alternative: 'Traduire littéralement : « interdiront de se marier et de s’abstenir d’aliments ».'
  rationale: La traduction strictement formelle risquerait d’inverser le sens contextuel du second membre. L’explicitation conserve la portée injonctive tout en signalant la forme grecque en note.
translation_notes:
  register: Français international moderne, clair et digne. « Se marier », « certains aliments » et « avec reconnaissance » sont courants sans être familiers; la note préserve la forme plus littérale et l’ambiguïté syntaxique.
