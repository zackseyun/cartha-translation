  rationale: La révision retire l’ajout non marqué « certains », adopte « avec action de grâce » pour εὐχαριστία et simplifie la restitution du parfait ἐπεγνωκόσι. Elle conserve l’explicitation nécessaire de la seconde injonction et la note qui indique la forme plus littérale.
