  verdict: revise
  source_fidelity: 'La coordination de κωλυόντων avec les deux infinitifs est correctement comprise dans le contexte : les personnes visées interdisent le mariage et prescrivent l’abstinence alimentaire. Toutefois, « certains aliments » ajoute une restriction que βρωμάτων (« aliments », pluriel) n’exprime pas explicitement. Le reste rend fidèlement la création, la réception avec action de grâce et le groupe unique des croyants connaissant la vérité.'
  naturalness: Le texte est clair et d’un registre moderne international. « Imposeront de s’abstenir » lève à bon droit en français l’ambiguïté potentiellement inversante de la construction grecque elliptique. « Avec action de grâce » est plus directement idiomatique dans ce contexte scripturaire et rend plus précisément εὐχαριστία.
  terminology: « Se marier », « aliments », « créés », « action de grâce », « ceux qui croient » et « la vérité » sont appropriés. La formulation « ont connu la vérité » rend le parfait ἐπεγνωκόσι de manière plus sobre et naturelle que « sont parvenus à connaître », sans supprimer l’idée d’une connaissance acquise et actuelle.
  issues:
  - severity: medium
    issue: Ajout de « certains » devant « aliments »
    rationale: Le pluriel βρωμάτων désigne des aliments, mais ne spécifie pas que seule une partie des aliments est en cause. Le contexte peut le suggérer, mais la traduction ne devrait pas l’insérer dans le texte principal.
  - severity: low
    issue: « avec reconnaissance » atténue la terminologie d’action de grâce
    rationale: « Reconnaissance » est possible, mais « avec action de grâce » reflète plus directement μετὰ εὐχαριστίας et conserve la formulation théologique française établie sans être archaïque.
  - severity: low
    issue: « sont parvenus à connaître » est légèrement lourd et peut évoquer une réussite difficile
    rationale: Le parfait d’ἐπιγινώσκω peut être rendu naturellement par « ont connu », qui présente la connaissance comme acquise sans ajouter une nuance d’effort.
