id: 1TI.4.12
reference: 1 Timothy 4:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: μηδείς σου τῆς νεότητος καταφρονείτω, ἀλλὰ τύπος γίνου τῶν πιστῶν ἐν λόγῳ, ἐν ἀναστροφῇ, ἐν ⸀ἀγάπῃ, ἐν πίστει, ἐν ἁγνείᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/012.yaml
  text: Let no one look down on your youth[a], but be an example for the believers in speech, in conduct, in love, in faith, in purity.
translation:
  language: fr
  text: Que personne ne te méprise à cause de ta jeunesse, mais sois un exemple pour les croyants dans tes paroles, ta conduite, ton amour, ta foi[a] et ta pureté.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « fidélité ». Le mot grec peut désigner ici soit la foi, soit la fidélité.
    reason: alternative_reading
lexical_decisions:
- source_word: μηδείς … καταφρονείτω
  choice: Que personne ne te méprise
  rationale: La tournure avec « que personne ne… » rend naturellement en français l’exhortation négative à la troisième personne. « Mépriser » exprime le fait de regarder quelqu’un de haut ou de le traiter avec dédain.
- source_word: σου τῆς νεότητος
  choice: à cause de ta jeunesse
  rationale: Cette formulation française explicite la relation idiomatique entre le mépris visé et le jeune âge de Timothée, sans réduire νεότης à un âge précis.
- source_word: ἀλλὰ τύπος γίνου
  choice: mais sois un exemple
  rationale: Dans cette exhortation, γίνου se rend naturellement par « sois »; τύπος désigne ici un exemple vivant que d’autres peuvent imiter.
- source_word: τῶν πιστῶν
  choice: pour les croyants
  rationale: Le génitif désigne naturellement le groupe auquel Timothée doit servir d’exemple. « Croyants » identifie ici les personnes qui ont la foi.
- source_word: ἐν λόγῳ
  choice: dans tes paroles
  rationale: Dans cette liste de qualités visibles, λόγος renvoie vraisemblablement à la manière de parler. Le pluriel français évite l’ambiguïté de « ta parole », qui pourrait évoquer un message ou un enseignement particulier.
- source_word: ἐν ἀναστροφῇ
  choice: ta conduite
  rationale: ἀναστροφή désigne la conduite ou la manière de vivre; « conduite » est concis et naturel dans cette énumération.
- source_word: ἐν ἀγάπῃ
  choice: ton amour
  rationale: « Amour » est l’équivalent français direct et usuel de ἀγάπη dans ce contexte éthique.
- source_word: ἐν πίστει
  choice: ta foi
  rationale: πίστις peut désigner ici la foi ou la fidélité. « Foi » conserve le sens théologique courant, tandis que l’autre possibilité est signalée en note.
- source_word: ἐν ἁγνείᾳ
  choice: ta pureté
  rationale: ἁγνεία désigne la pureté morale, avec une possible dimension sexuelle, sans que le contexte impose de limiter le terme à la chasteté.
theological_decisions:
- issue: Sens de πίστις dans une liste de qualités
  choice: foi
  alternative: fidélité
  rationale: Le contexte permet de comprendre πίστις soit comme la foi et la confiance, soit comme la qualité d’une personne fidèle. Le texte principal garde « foi », terme plus large et traditionnel, sans effacer l’autre lecture, donnée en note.
translation_notes:
  register: Français international moderne, clair et digne. La structure exhortative et l’énumération du grec sont conservées, avec des possessifs qui rendent la liste naturelle en français. Le marqueur de note est placé après « foi », le terme auquel la note se rapporte.
