- from: par l’hypocrisie de menteurs dont la conscience est marquée au fer rouge,[a]
  to: par l’hypocrisie de menteurs qui ont leur propre conscience marquée au fer rouge,[a]
  rationale: La révision rend explicitement ἰδίαν par « leur propre » et améliore la syntaxe de la note. Elle conserve « marquée au fer rouge » comme rendu principal, sans imposer l’interprétation selon laquelle la métaphore désigne exclusivement une conscience insensibilisée ou une marque d’appartenance.
