    text: Ou « qui ont leur propre conscience cautérisée ». L’image grecque peut évoquer une conscience marquée au fer rouge ou rendue insensible par cautérisation.
    reason: lexical_alternative
  revision_rationale: La révision rend explicitement ἰδίαν par « leur propre » et améliore la syntaxe de la note. Elle conserve « marquée au fer rouge » comme rendu principal, sans imposer l’interprétation selon laquelle la métaphore désigne exclusivement une conscience insensibilisée ou une marque d’appartenance.
