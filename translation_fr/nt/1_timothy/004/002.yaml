review_pass:
  verdict: revise
  source_fidelity: Le rendu de ἐν ὑποκρίσει ψευδολόγων par « par l’hypocrisie de menteurs » est fidèle au sens instrumental et au génitif. « Marquée au fer rouge » rend correctement l’image de κεκαυστηριασμένων, mais le texte courant ne rend pas explicitement ἰδίαν (« leur propre »). La révision l’intègre sans trancher entre les nuances de marquage et de cautérisation.
  naturalness: La formulation révisée reste idiomatique en français moderne et conserve le caractère de fragment dépendant de la proposition précédente. La relative « qui ont leur propre conscience marquée au fer rouge » est plus naturelle que « dont leur propre conscience… » tout en exprimant le possessif emphatique grec.
  terminology: « Hypocrisie », « menteurs » et « conscience » sont justes et de registre approprié. « Marquée au fer rouge » maintient l’ambiguïté de l’image; la note propose « cautérisée » comme autre compréhension possible.
  issues:
  - severity: low
    issue: L’emphase possessive de ἰδίαν n’apparaît pas dans le texte courant.
    rationale: « Dont la conscience » indique bien une conscience qui leur appartient, mais ne rend pas explicitement « leur propre conscience ». Une formulation révisée peut le faire sans alourdir excessivement le français.
  - severity: low
    issue: La formulation de l’alternative dans la note est peu naturelle.
    rationale: « Cautérisée dans leur propre conscience » ne correspond pas bien à la syntaxe française. « Ayant leur propre conscience cautérisée » rend plus clairement l’alternative tout en laissant l’image ouverte.
  revised_text: par l’hypocrisie de menteurs qui ont leur propre conscience marquée au fer rouge,[a]
