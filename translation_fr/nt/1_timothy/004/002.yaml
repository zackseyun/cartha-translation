  text: ἐν ὑποκρίσει ψευδολόγων, κεκαυστηριασμένων τὴν ἰδίαν συνείδησιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/002.yaml
  text: through the hypocrisy of liars whose own conscience has been seared,[a]
translation:
  language: fr
  text: par l’hypocrisie de menteurs qui ont leur propre conscience marquée au fer rouge,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qui ont leur propre conscience cautérisée ». L’image grecque peut évoquer une conscience marquée au fer rouge ou rendue insensible par cautérisation.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν
  choice: par
  rationale: Dans le lien avec la proposition précédente, ἐν exprime ici vraisemblablement le moyen ou l’intermédiaire. « Par » est naturel en français et conserve ce rapport instrumental.
- source_word: ὑποκρίσει
  choice: l’hypocrisie
  rationale: Le terme désigne la dissimulation ou la fausse apparence morale. « Hypocrisie » en donne l’équivalent direct et courant.
- source_word: ψευδολόγων
  choice: de menteurs
  rationale: 'Le génitif dépend naturellement de ὑποκρίσει : il s’agit de « l’hypocrisie de menteurs ». Cette formulation concise décrit des personnes caractérisées par le mensonge.'
- source_word: κεκαυστηριασμένων
  choice: dont … est marquée au fer rouge
  rationale: Le participe parfait passif évoque l’action d’un fer brûlant et l’état durable qui en résulte. « Marquée au fer rouge » préserve cette image sans décider à elle seule s’il s’agit surtout d’une marque infamante ou d’une perte de sensibilité par cautérisation.
- source_word: τὴν ἰδίαν συνείδησιν
  choice: leur propre conscience
  rationale: 'Le singulier grec a une valeur distributive : chaque menteur est concerné dans sa propre conscience. La construction française « dont la conscience » rend naturellement le possessif dans le texte, tandis que la note explicite les variantes de l’image.'
theological_decisions:
- issue: Portée métaphorique de κεκαυστηριασμένων
  choice: Conserver l’image d’une conscience « marquée au fer rouge » sans en préciser dogmatiquement l’effet.
  alternative: « cautérisée » ou « devenue insensible »
  rationale: Le verbe peut évoquer une marque produite par un fer brûlant ou une cautérisation entraînant l’insensibilité. Le texte ne justifie pas d’en déduire explicitement une impossibilité irréversible de repentance ; la traduction maintient donc la tension de l’image.
translation_notes:
  register: Français moderne, clair et digne. Le syntagme reste lié à la phrase précédente, comme dans le grec. « Marquée au fer rouge » est une image immédiatement compréhensible, et la note conserve l’autre nuance lexicale importante.
