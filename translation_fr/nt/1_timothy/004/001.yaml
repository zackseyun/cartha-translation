id: 1TI.4.1
reference: 1 Timothy 4:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Τὸ δὲ πνεῦμα ῥητῶς λέγει ὅτι ἐν ὑστέροις καιροῖς ἀποστήσονταί τινες τῆς πίστεως, προσέχοντες πνεύμασι πλάνοις καὶ διδασκαλίαις δαιμονίων
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/001.yaml
  text: The Spirit explicitly says that in later times some will depart from the faith[a], paying attention to deceitful spirits and teachings of demons[c][b],
translation:
  language: fr
  text: Mais l’Esprit dit expressément que, dans des temps à venir[a], certains s’éloigneront de la foi[b], prêtant attention à des esprits trompeurs[c] et à des enseignements de démons.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans les derniers temps ».
    reason: lexical_alternative
  - marker: b
    text: Ou « abandonneront la foi » ou « feront défection de la foi ».
    reason: lexical_alternative
  - marker: c
    text: Ou « des esprits qui égarent ».
    reason: lexical_alternative
lexical_decisions:
- source_word: Τὸ ... πνεῦμα
  choice: l’Esprit
  rationale: Avec l’article et dans ce contexte prophétique paulinien, le référent le plus naturel est l’Esprit Saint. La majuscule explicite ce référent en français.
- source_word: δὲ
  choice: Mais
  rationale: La particule marque ici une transition avec une légère nuance de contraste. « Mais » conserve cette articulation sans ajouter une indication temporelle absente du grec.
- source_word: ῥητῶς
  choice: expressément
  rationale: L’adverbe indique que l’énoncé est formulé de manière explicite et nette; « expressément » convient au registre digne du passage.
- source_word: λέγει
  choice: dit
  rationale: Le présent grec est conservé et présente la parole prophétique comme actuelle.
- source_word: ἐν ὑστέροις καιροῖς
  choice: dans des temps à venir
  rationale: La formule désigne des périodes postérieures au moment de l’énonciation sans les limiter nécessairement à la toute dernière période eschatologique.
- source_word: ἀποστήσονταί
  choice: s’éloigneront
  rationale: Le verbe exprime l’éloignement ou la défection. Cette formulation conserve l’image sans imposer une systématisation théologique de l’apostasie.
- source_word: τινες
  choice: certains
  rationale: Rendu français naturel du pronom indéfini pluriel.
- source_word: τῆς πίστεως
  choice: de la foi
  rationale: Avec l’article et dans ce contexte d’enseignement, l’expression désigne très probablement la foi chrétienne considérée comme contenu cru, tout en laissant résonner la notion de foi.
- source_word: προσέχοντες
  choice: prêtant attention à
  rationale: Le participe indique ce à quoi ces personnes s’attachent ou donnent crédit, et peut expliquer la manière ou la cause de leur éloignement.
- source_word: πνεύμασι πλάνοις
  choice: des esprits trompeurs
  rationale: πλάνος décrit ce qui égare ou trompe. « Esprits trompeurs » rend naturellement la valeur adjectivale.
- source_word: διδασκαλίαις δαιμονίων
  choice: des enseignements de démons
  rationale: Le génitif peut indiquer la source ou l’association. Le tour français garde cette ouverture plutôt que de préciser « enseignements démoniaques » ou « venant des démons ».
theological_decisions:
- issue: Référent de « l’Esprit »
  choice: l’Esprit Saint
  alternative: un esprit prophétique ou l’esprit humain
  rationale: Le cadre épistolaire et prophétique favorise une référence à l’Esprit Saint, sans préciser le mode exact de la révélation.
- issue: Sens de « la foi »
  choice: la foi chrétienne comme contenu de croyance
  alternative: la confiance personnelle ou la fidélité
  rationale: L’article et le contexte d’abandon lié à de faux enseignements favorisent le sens objectif, sans tirer du verset une conclusion confessionnelle sur les mécanismes de l’apostasie.
- issue: Relation exprimée par « enseignements de démons »
  choice: génitif laissé ouvert entre source et association
  alternative: enseignements venant des démons ou enseignements démoniaques
  rationale: Le grec ne contraint pas à trancher nettement entre origine et caractérisation; le rendu préserve cette tension.
translation_notes:
  register: Français international actuel, clair et digne. La syntaxe suit étroitement la progression grecque tout en restant naturelle. « Expressément » maintient le relief prophétique; les notes préservent les principales possibilités lexicales sans surcharger le texte.
