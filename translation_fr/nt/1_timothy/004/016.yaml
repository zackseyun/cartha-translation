id: 1TI.4.16
reference: 1 Timothy 4:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἔπεχε σεαυτῷ καὶ τῇ διδασκαλίᾳ· ἐπίμενε αὐτοῖς· τοῦτο γὰρ ποιῶν καὶ σεαυτὸν σώσεις καὶ τοὺς ἀκούοντάς σου.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/016.yaml
  text: Pay close attention to yourself and to the teaching[a]; persist in these things[b]. For by doing this you will save both yourself and those who listen to you.
translation:
  language: fr
  text: Sois attentif à toi-même et à l’enseignement ; persévère dans ces choses[a]. En effet, en agissant ainsi, tu sauveras à la fois toi-même et ceux qui t’écoutent[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « continue en cela » ou « persévère en cela ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « tu préserveras ». Le verbe grec peut désigner le salut, la délivrance ou la préservation selon le contexte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔπεχε
  choice: Veille attentivement sur
  rationale: L’impératif appelle une attention soutenue et vigilante. Cette formulation est naturelle en français et convient aussi bien à la personne de Timothée qu’à son enseignement.
- source_word: σεαυτῷ
  choice: toi-même
  rationale: Le datif réflexif désigne ce sur quoi Timothée doit exercer une vigilance constante.
- source_word: τῇ διδασκαλίᾳ
  choice: ton enseignement
  rationale: Dans ce contexte, διδασκαλία désigne l’enseignement confié et dispensé par Timothée. « Ton enseignement » est clair et évite le caractère plus technique de « doctrine ».
- source_word: ἐπίμενε αὐτοῖς
  choice: persévère dans ces choses
  rationale: L’impératif exprime une continuité résolue. Le pronom pluriel renvoie naturellement aux responsabilités qui viennent d’être mentionnées, sans imposer un référent plus étroit.
- source_word: τοῦτο γὰρ ποιῶν
  choice: En effet, en agissant ainsi
  rationale: Le participe peut exprimer le moyen ou la circonstance accompagnante. Cette tournure française conserve le lien logique sans l’alourdir.
- source_word: σώσεις
  choice: tu sauveras
  rationale: Le verbe σῴζω porte ici le sens fort de « sauver ». Le conserver évite de réduire d’avance sa portée à une simple préservation, tout en laissant au contexte sa tension théologique.
- source_word: τοὺς ἀκούοντάς σου
  choice: ceux qui t’écoutent
  rationale: Le participe présent désigne les personnes qui écoutent de façon suivie l’enseignement de Timothée ; la formulation est courante et naturelle.
theological_decisions:
- issue: Portée du verbe « sauver » dans cette exhortation pastorale
  choice: Conserver « sauver » sans préciser dans le texte principal s’il s’agit exclusivement du salut eschatologique ou d’une préservation spirituelle.
  alternative: Employer « préserver » ou expliciter « conduire au salut ».
  rationale: Le grec σώσεις est théologiquement fort et relie la persévérance de Timothée à son propre salut et à celui de ses auditeurs. La formulation ne présente pas ce salut comme un mérite autonome ; elle laisse intacte la tension entre la fidélité humaine et l’action salvatrice de Dieu.
- issue: Relation causale exprimée par le participe
  choice: Traduire par « en agissant ainsi » plutôt que développer une causalité doctrinale.
  alternative: « Car c’est ainsi que » ou « par ce moyen ».
  rationale: Le texte associe réellement l’action persévérante au salut, mais ne détaille pas ici la nature métaphysique de ce rapport. Une formulation sobre préserve cette association sans la systématiser.
translation_notes:
  register: Français international moderne, digne et accessible. « Veille attentivement » rend la vigilance soutenue ; « enseignement » évite le jargon de « doctrine ». Les deux marqueurs de notes figurent dans le texte principal à l’endroit pertinent.
