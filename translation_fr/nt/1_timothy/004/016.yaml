  to: Sois attentif à toi-même et à l’enseignement ; persévère dans ces choses[a]. En effet, en agissant ainsi, tu sauveras à la fois toi-même et ceux qui t’écoutent[b].
  rationale: La révision rend plus directement l’appel grec à une attention vigilante, sans introduire la nuance de protection associée à « veiller sur ». Elle remplace aussi le possessif interprétatif par l’article défini. Le pluriel de αὐτοῖς demeure explicitement reflété par « ces choses », tandis que la note propose des alternatives françaises plus condensées. La portée théologique non précisée de σώσεις est conservée.
