id: 1TI.4.13
reference: 1 Timothy 4:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἕως ἔρχομαι πρόσεχε τῇ ἀναγνώσει, τῇ παρακλήσει, τῇ διδασκαλίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/013.yaml
  text: Until I come[a], devote yourself to the public reading, to exhortation, to teaching.
translation:
  language: fr
  text: Jusqu’à ce que je vienne, consacre-toi à la lecture[a], à l’exhortation et à l’enseignement.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec dit simplement « la lecture ». Dans ce contexte, il s’agit vraisemblablement de la lecture publique des Écritures dans l’assemblée.
    reason: Explicitation contextuelle probable, sans ajouter au texte principal les précisions absentes du grec.
lexical_decisions:
- source_word: ἕως ἔρχομαι
  choice: Jusqu’à ce que je vienne
  rationale: Cette formulation rend naturellement la limite temporelle et le présent grec à valeur future, sans ajouter l’idée d’arrivée.
- source_word: πρόσεχε
  choice: consacre-toi à
  rationale: L’impératif exprime ici une attention soutenue et une application constante, mieux rendues par « consacre-toi à » que par le simple « prête attention à ».
- source_word: τῇ ἀναγνώσει
  choice: à la lecture publique
  rationale: ἀνάγνωσις désigne la lecture; dans ce contexte communautaire, il s’agit vraisemblablement de la lecture publique. Le complément « des Écritures », absent du grec, n’est pas introduit dans le texte principal.
- source_word: τῇ παρακλήσει
  choice: à l’exhortation
  rationale: Dans cette série d’activités liées au ministère, « exhortation » conserve la dimension d’encouragement et d’appel pressant de παράκλησις.
- source_word: τῇ διδασκαλίᾳ
  choice: à l’enseignement
  rationale: « Enseignement » rend clairement l’activité ou le contenu de διδασκαλία, sans la connotation plus systématique que peut avoir « doctrine ».
theological_decisions:
- issue: Faut-il préciser dans le texte principal que la lecture porte sur les Écritures?
  choice: la lecture publique
  alternative: la lecture des Écritures; la lecture
  rationale: Le contexte du ministère dans l’assemblée suggère fortement une lecture publique des Écritures, mais le grec dit seulement « la lecture ». Le texte principal indique le cadre public probable sans ajouter l’objet non exprimé; la note conserve l’autre compréhension.
translation_notes:
  register: Français international moderne, clair et digne. La coordination finale avec « et » est idiomatique; les trois activités restent distinctes. Le tutoiement correspond à l’adresse personnelle de Paul à Timothée.
