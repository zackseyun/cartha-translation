id: 1TI.4.15
reference: 1 Timothy 4:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ταῦτα μελέτα, ἐν τούτοις ἴσθι, ἵνα σου ἡ προκοπὴ φανερὰ ⸀ᾖ πᾶσιν·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/015.yaml
  text: Practice these things; be in them[a], so that your progress may be evident to all.
translation:
  language: fr
  text: Applique-toi à ces choses ; consacre-toi pleinement à elles[a], afin que tes progrès soient évidents pour tous.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « sois dans ces choses », expression qui évoque une implication profonde et constante.'
    reason: La tournure grecque est métaphorique et plus littérale que l’expression idiomatique retenue dans le texte.
lexical_decisions:
- source_word: ταῦτα
  choice: ces choses
  rationale: Le démonstratif pluriel renvoie aux instructions précédentes. « Ces choses » reste proche du grec et demeure naturel en français.
- source_word: μελέτα
  choice: Applique-toi à
  rationale: Dans ce contexte, le verbe exprime une attention soutenue qui se traduit dans la pratique. « Applique-toi à » rend à la fois le soin, la persévérance et l’engagement actif, sans réduire le sens à la méditation intérieure.
- source_word: ἐν τούτοις ἴσθι
  choice: consacre-toi pleinement à elles
  rationale: Littéralement, « sois dans ces choses ». La formulation française retenue exprime l’implication profonde suggérée par cette tournure idiomatique, tandis que la note conserve la métaphore grecque.
- source_word: ἵνα
  choice: afin que
  rationale: Cette conjonction rend clairement la nuance de but, avec un registre digne et naturel.
- source_word: σου ἡ προκοπή
  choice: tes progrès
  rationale: προκοπή désigne une avancée observable. Le pluriel français « tes progrès » est idiomatique et ne limite pas cette avancée à la maturité spirituelle ou à l’efficacité du ministère.
- source_word: φανερὰ ᾖ
  choice: soient évidents
  rationale: L’expression indique que les progrès doivent être manifestes et reconnaissables publiquement.
- source_word: πᾶσιν
  choice: pour tous
  rationale: Le datif désigne toutes les personnes concernées. « Pour tous » signifie ici « aux yeux de tous » et s’intègre naturellement à la phrase.
theological_decisions:
- issue: Portée des progrès visibles de Timothée
  choice: Des progrès observables dans l’ensemble des devoirs évoqués
  alternative: Une croissance principalement spirituelle ou, à l’inverse, une efficacité principalement ministérielle
  rationale: Le contexte associe l’enseignement, la conduite et l’engagement. La traduction conserve donc le terme général « progrès » sans imposer une délimitation absente du grec.
translation_notes:
  register: Français international moderne, clair et digne. L’impératif « Applique-toi » évite le sens trop étroit de « pratique » en français, tandis que « consacre-toi pleinement » communique naturellement l’engagement total exprimé par la tournure grecque.
