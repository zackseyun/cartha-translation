  text: The saying is trustworthy and worthy of full acceptance,[a]
translation:
  language: fr
  text: Cette parole est digne de confiance et mérite d’être pleinement accueillie.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Cette affirmation est digne de confiance et mérite d’être pleinement acceptée. »
