lexical_decisions:
- source_word: πιστὸς
  choice: digne de confiance
  rationale: Dans la formule πιστὸς ὁ λόγος, l’adjectif qualifie la parole comme fiable et méritant qu’on lui fasse confiance. Cette tournure est naturelle en français moderne.
- source_word: ὁ λόγος
  choice: cette parole
  rationale: Ici, λόγος désigne une parole ou une affirmation précise. « Cette parole » conserve la formule reconnaissable tout en renvoyant naturellement au contenu concerné.
- source_word: πάσης
  choice: pleinement
  rationale: Dans πάσης ἀποδοχῆς, πάσης exprime la totalité. L’adverbe « pleinement » transmet cette force de manière idiomatique avec le verbe « accueillir ».
- source_word: ἀποδοχῆς
  choice: accueillie
  rationale: ἀποδοχή désigne l’accueil ou l’acceptation. « Accueillie » exprime ici une réception favorable et entière dans un français courant et digne.
- source_word: ἄξιος
  choice: mérite d’être
  rationale: ἄξιος suivi du génitif signifie « digne de » ou « méritant ». La formulation verbale « mérite d’être » évite une répétition lourde de « digne » et reste fidèle au sens.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve le caractère proverbial de la phrase grecque, tout en évitant la répétition « digne… digne ». Le démonstratif « cette » rend naturellement l’article grec dans cette formule contextuelle.
