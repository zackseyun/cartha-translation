id: 1TI.4.6
reference: 1 Timothy 4:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ταῦτα ὑποτιθέμενος τοῖς ἀδελφοῖς καλὸς ἔσῃ διάκονος ⸂Χριστοῦ Ἰησοῦ⸃, ἐντρεφόμενος τοῖς λόγοις τῆς πίστεως καὶ τῆς καλῆς διδασκαλίας ᾗ παρηκολούθηκας,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/006.yaml
  text: By putting these things before the brothers[a], you will be a good servant of Messiah Jesus[c][b], being nourished by the words of the faith and of the good teaching that you have followed.
translation:
  language: fr
  text: En présentant ces choses aux frères[a], tu seras un bon serviteur de Jésus le Messie[b], nourri des paroles de la foi[c] et du bon enseignement que tu as suivi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dans ce contexte, « frères » peut désigner l’ensemble des croyants, femmes comprises.
    reason: cultural_note
  - marker: b
    text: 'Ou « de Jésus-Christ ». Le grec Χριστός est ici rendu selon son sens de titre: « Messie ».'
    reason: lexical_alternative
  - marker: c
    text: Ou « des paroles de foi ». « La foi » désigne probablement ici le contenu reconnu de la croyance chrétienne.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτα ὑποτιθέμενος
  choice: En présentant ces choses
  rationale: Le participe exprime l’action de mettre ces éléments sous les yeux de la communauté, de les lui exposer. « Présenter » conserve ce sens sans alourdir la phrase.
- source_word: τοῖς ἀδελφοῖς
  choice: aux frères
  rationale: La forme grecque est un masculin pluriel; dans l’usage chrétien ancien, elle peut désigner collectivement les croyants. La traduction formelle est maintenue, avec une note sur sa portée possible.
- source_word: καλὸς ... διάκονος
  choice: un bon serviteur
  rationale: διάκονος décrit ici vraisemblablement une fonction de service plutôt que l’office précis de diacre; « serviteur » est clair et καλός se rend naturellement par « bon ».
- source_word: Χριστοῦ Ἰησοῦ
  choice: de Jésus le Messie
  rationale: Χριστός est un titre signifiant « Messie ». L’ordre français « Jésus le Messie » est naturel tout en préservant la valeur titulaire du grec.
- source_word: ἐντρεφόμενος
  choice: nourri
  rationale: Le participe évoque une formation continue reçue comme une nourriture. « Nourri » préserve l’image et s’accorde naturellement avec le sujet.
- source_word: τοῖς λόγοις τῆς πίστεως
  choice: des paroles de la foi
  rationale: λόγοις est conservé comme « paroles » et le génitif articulé τῆς πίστεως désigne probablement ici la foi comme contenu reconnu de la croyance chrétienne.
- source_word: τῆς καλῆς διδασκαλίας
  choice: du bon enseignement
  rationale: « Bon enseignement » traduit directement καλῆς διδασκαλίας sans substituer l’idée plus interprétative d’un enseignement « sain ».
- source_word: ᾗ παρηκολούθηκας
  choice: que tu as suivi
  rationale: Le relatif renvoie le plus naturellement à l’enseignement, et le verbe peut exprimer le fait de suivre attentivement et d’adhérer à celui-ci.
theological_decisions:
- issue: Valeur de Χριστός
  choice: Jésus le Messie
  alternative: Jésus-Christ
  rationale: Le titre grec garde ici sa valeur messianique. « Jésus le Messie » en rend explicitement le sens, tandis que la forme traditionnelle est signalée en note.
- issue: Portée de τοῖς ἀδελφοῖς
  choice: aux frères
  alternative: aux frères et sœurs / aux croyants
  rationale: Le masculin du texte source est conservé, sans exclure que le terme désigne selon le contexte l’ensemble de la communauté.
- issue: Sens de πίστις
  choice: la foi
  alternative: la fidélité / foi sans article
  rationale: 'L’article et le rapprochement avec « enseignement » favorisent le sens objectif: le contenu de la foi chrétienne. La formulation conserve néanmoins la concision du grec.'
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement singulier reflète l’adresse personnelle à Timothée. La phrase conserve les deux participes grecs sous une forme française fluide, ainsi que l’image de la nourriture spirituelle.
