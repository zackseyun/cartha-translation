  text: Παράγγελλε ταῦτα καὶ δίδασκε.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/011.yaml
  text: Command these things and teach them[a].
translation:
  language: fr
  text: Prescris ces choses et enseigne-les.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Donne ces instructions et enseigne-les. »'
    reason: Alternative lexicale et idiomatique pour παραγγέλλω ; « instructions » explicite le référent contextuel de ταῦτα.
lexical_decisions:
- source_word: Παράγγελλε
  choice: Ordonne
  rationale: L’impératif présent exprime ici une directive continue et revêt une force d’autorité. « Ordonne » conserve cette force, tandis que « donne ces instructions » en propose une formulation moins forte mais possible.
- source_word: ταῦτα
  choice: ces choses
  rationale: Le démonstratif neutre pluriel renvoie aux enseignements ou directives qui précèdent et garde explicitement sa valeur plurielle.
- source_word: καὶ
  choice: et
  rationale: La conjonction coordonne simplement les deux impératifs.
- source_word: δίδασκε
  choice: enseigne-les
  rationale: L’impératif présent appelle une action suivie. Le pronom « les » reprend naturellement « ces choses » en français, sans ajouter de nouvel objet au texte.
theological_decisions:
- issue: Force de l’autorité pastorale suggérée par παραγγέλλω
  choice: Rendre le verbe par « Ordonne » afin de préserver sa force directive.
  alternative: « Donne ces instructions et enseigne-les. »
  rationale: Le grec emploie deux impératifs présents, dont le premier peut désigner l’action de donner un ordre ou une directive. Cette traduction en conserve l’autorité sans en tirer de conclusions ecclésiologiques supplémentaires.
translation_notes:
  register: Français international moderne, concis et digne. La formulation conserve le parallélisme des deux impératifs et rend explicite, par le pronom « les », l’objet sous-entendu du second verbe.
