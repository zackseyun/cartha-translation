source:
  edition: SBLGNT
  text: εἰς τοῦτο ⸀γὰρ κοπιῶμεν καὶ ⸀ὀνειδιζόμεθα, ὅτι ἠλπίκαμεν ἐπὶ θεῷ ζῶντι, ὅς ἐστιν σωτὴρ πάντων ἀνθρώπων, μάλιστα πιστῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/010.yaml
  text: For to this end we labor and are reproached[a], because we have put our hope in the living God, who is the Savior of all people[c][b], especially of believers.
translation:
  language: fr
  text: C’est en effet dans ce but que nous nous donnons de la peine et que nous sommes insultés[a], parce que nous avons mis notre espérance dans le Dieu vivant[b], qui est le Sauveur de tous les êtres humains, surtout des croyants[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « nous peinons et sommes outragés ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « nous avons placé notre espérance dans le Dieu vivant ».'
    reason: lexical_alternative
  - marker: c
    text: 'L’expression « Sauveur de tous les êtres humains, surtout des croyants » est traduite telle quelle. Les interprétations divergent : elle peut mettre l’accent sur la protection que Dieu accorde à tous, sur le salut qu’il offre à tous, ou sur le salut dont les croyants bénéficient tout particulièrement.'
    reason: alternative_reading
lexical_decisions:
- source_word: εἰς τοῦτο
  choice: dans ce but
  rationale: La locution exprime le but visé et renvoie à ce qui précède. « Dans ce but » en conserve clairement la valeur finale.
- source_word: γὰρ
  choice: en effet
  rationale: La particule introduit ici l’explication de l’affirmation précédente. « En effet » assure un enchaînement naturel en français moderne.
- source_word: κοπιῶμεν
  choice: nous nous donnons de la peine
  rationale: Le verbe évoque un travail pénible et soutenu. Cette formulation française en exprime l’effort sans être excessivement technique ou soutenue.
- source_word: ὀνειδιζόμεθα
  choice: nous subissons les insultes
  rationale: Le passif désigne le fait d’être exposé à des paroles outrageantes ou au mépris. « Subissons les insultes » rend clairement cette atteinte verbale.
- source_word: ἠλπίκαμεν ἐπὶ
  choice: nous avons mis notre espérance dans
  rationale: Le parfait présente une espérance placée en Dieu et qui demeure. Cette tournure française exprime à la fois l’acte accompli et son résultat durable.
- source_word: θεῷ ζῶντι
  choice: le Dieu vivant
  rationale: Cette expression biblique consacrée demeure naturelle et fidèle à la construction grecque.
- source_word: σωτὴρ
  choice: Sauveur
  rationale: Le terme peut désigner celui qui sauve, délivre ou préserve. « Sauveur » conserve ici sa pleine portée théologique sans en préciser arbitrairement le mode.
- source_word: πάντων ἀνθρώπων
  choice: de tous les êtres humains
  rationale: ἄνθρωποι désigne ici l’humanité sans distinction de sexe. « Tous les êtres humains » explicite cette portée universelle avec précision.
- source_word: μάλιστα
  choice: surtout
  rationale: Le mot marque une relation particulièrement vraie ou accentuée à propos des croyants. « Surtout » préserve le rapport entre l’ensemble et le groupe distingué sans le réduire à « c’est-à-dire ».
- source_word: πιστῶν
  choice: des croyants
  rationale: Dans ce contexte, le terme désigne ceux qui croient. « Croyants » est clair, courant et ne tranche pas entre les autres nuances possibles de πιστός.
theological_decisions:
- issue: Sens de « Sauveur de tous les êtres humains, surtout des croyants »
  choice: Conserver conjointement l’affirmation universelle et la distinction introduite par « surtout », sans expliquer dans le texte la manière dont Dieu est Sauveur de tous.
  alternative: Comprendre « Sauveur » comme protecteur de tous mais Sauveur au sens rédempteur des croyants ; y voir l’affirmation du salut universel ; ou restreindre « tous les êtres humains » à toutes sortes de personnes.
  rationale: Le grec affirme à la fois que Dieu est Sauveur de tous et qu’il l’est surtout des croyants. La traduction doit maintenir cette tension et ne pas imposer une solution doctrinale particulière.
translation_notes:
  register: Français international moderne, clair et digne. La structure explicative de γάρ est rendue naturellement par « en effet ». Le vocabulaire reste accessible, tandis que « le Dieu vivant » et « Sauveur » conservent les formulations bibliques porteuses de sens. La phrase maintient volontairement la tension théologique de la proposition finale.
