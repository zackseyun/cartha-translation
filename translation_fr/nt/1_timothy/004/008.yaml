id: 1TI.4.8
reference: 1 Timothy 4:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἡ γὰρ σωματικὴ γυμνασία πρὸς ὀλίγον ἐστὶν ὠφέλιμος, ἡ δὲ εὐσέβεια πρὸς πάντα ὠφέλιμός ἐστιν, ἐπαγγελίαν ἔχουσα ζωῆς τῆς νῦν καὶ τῆς μελλούσης.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/008.yaml
  text: For bodily training is beneficial for a little while[a], but godliness is beneficial for all things[c][b], since it holds promise for the present life and the coming one.
translation:
  language: fr
  text: En effet, l’exercice physique est utile dans une certaine mesure[a], mais la piété est utile à tous égards, car elle porte en elle la promesse de la vie présente et de la vie à venir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour peu de temps ». Le grec peut indiquer une utilité limitée dans son étendue ou dans sa durée.
    reason: lexical_alternative
lexical_decisions:
- source_word: σωματικὴ γυμνασία
  choice: l’exercice physique
  rationale: Expression naturelle en français moderne qui rend l’idée d’entraînement ou d’exercice du corps sans la limiter au sport de compétition.
- source_word: πρὸς ὀλίγον
  choice: dans une certaine mesure
  rationale: Le grec peut désigner une portée limitée ou une durée limitée. Le contexte oppose surtout l’utilité restreinte de l’exercice physique à l’utilité globale de l’attachement à Dieu; une note conserve l’autre possibilité.
- source_word: ὠφέλιμος
  choice: utile
  rationale: Terme clair et courant, employé de façon parallèle dans les deux propositions; il évite la connotation économique que peut avoir « profitable ».
- source_word: εὐσέβεια
  choice: l’attachement à Dieu
  rationale: Rend de manière accessible une vie de respect, de fidélité et de dévouement orientée vers Dieu. « Piété » serait plus traditionnel, mais peut aujourd’hui évoquer une religiosité étroite ou extérieure.
- source_word: πρὸς πάντα
  choice: à tous égards
  rationale: Formulation idiomatique qui conserve la portée générale de πάντα sans suggérer que cette qualité serait un instrument permettant d’obtenir absolument toute chose.
- source_word: ἐπαγγελίαν ἔχουσα
  choice: car il porte en lui la promesse
  rationale: Le participe explique pourquoi l’attachement à Dieu est utile à tous égards. Le pronom reprend naturellement le groupe nominal masculin français.
- source_word: ζωῆς τῆς νῦν
  choice: de la vie présente
  rationale: Rend naturellement le génitif grec et prépare le contraste avec la vie future.
- source_word: τῆς μελλούσης
  choice: de la vie à venir
  rationale: Explicite le nom ζωή sous-entendu en grec tout en conservant l’orientation eschatologique de l’expression.
theological_decisions:
- issue: Portée de l’utilité de l’exercice physique
  choice: L’exercice physique possède une utilité limitée, mise en contraste avec l’utilité globale de l’attachement à Dieu.
  alternative: L’exercice physique n’est utile que pendant peu de temps.
  rationale: πρὸς ὀλίγον permet une limitation de degré ou de durée. Le texte principal retient la portée limitée, sans présenter l’exercice physique comme mauvais ou inutile; la note préserve le sens temporel possible.
- issue: Sens de εὐσέβεια
  choice: Une vie caractérisée par l’attachement respectueux et fidèle à Dieu.
  alternative: La piété, comprise comme qualité ou pratique religieuse.
  rationale: Le choix évite de réduire le terme à des pratiques extérieures tout en maintenant explicitement son orientation vers Dieu.
- issue: Promesse concernant la vie
  choice: La promesse concerne à la fois la vie présente et la vie à venir.
  alternative: La promesse porterait seulement sur une qualité de vie présente qui se prolongerait ensuite.
  rationale: La coordination grecque distingue explicitement la vie « maintenant » de celle « à venir »; la traduction maintient cette distinction sans préciser davantage la nature de la promesse.
translation_notes:
  register: Français international moderne, digne et accessible. La structure contrastive « certes utile de façon limitée / utile à tous égards » est conservée. « Attachement à Dieu » privilégie la compréhension immédiate tout en gardant l’orientation théologique de εὐσέβεια.
