  text: ἔστιν δὲ πορισμὸς μέγας ἡ εὐσέβεια μετὰ αὐταρκείας·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/006.yaml
  text: But godliness with contentment is great gain[a][b].
translation:
  language: fr
  text: Mais l’attachement à Dieu avec le contentement[b] est un grand gain[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «un grand profit» ou «un grand moyen de gain». Le terme grec appartient au vocabulaire du gain et du profit, en écho au verset précédent.
    reason: lexical_alternative
  - marker: b
    text: Ou «la suffisance» ou «l’autosuffisance». Ici, le contexte évoque probablement le contentement, plutôt qu’une indépendance fondée sur ses seules ressources.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Mais
  rationale: Marque le contraste avec l’idée du verset précédent, où certains considèrent l’attachement à Dieu comme une source de profit.
- source_word: πορισμὸς
  choice: gain
  rationale: Conserve le champ lexical du profit et l’écho au verset précédent, sans limiter le sens à la richesse matérielle.
- source_word: μέγας
  choice: grand
  rationale: Rend directement l’évaluation emphatique de l’expression grecque πορισμὸς μέγας.
- source_word: εὐσέβεια
  choice: attachement à Dieu
  rationale: Expression française actuelle qui désigne une vie de respect et de fidélité orientée vers Dieu; elle évite que «piété» soit compris comme une simple religiosité extérieure.
- source_word: μετὰ
  choice: accompagné du
  rationale: Exprime clairement l’association indiquée par μετά avec le génitif, tout en montrant que le contentement caractérise l’attachement à Dieu évoqué ici.
- source_word: αὐταρκείας
  choice: contentement
  rationale: Le contexte immédiat des versets 7-8 oriente vers le fait de se satisfaire de ce que l’on a, plutôt que vers une autonomie indépendante.
theological_decisions:
- issue: Sens de αὐτάρκεια dans ce contexte chrétien
  choice: contentement
  alternative: autosuffisance; suffisance
  rationale: Les versets suivants parlent de se contenter de la nourriture et du vêtement. «Contentement» exprime cette disposition sans suggérer une indépendance absolue à l’égard de Dieu.
- issue: Rapport entre l’attachement à Dieu et le gain
  choice: L’attachement à Dieu accompagné du contentement est lui-même un grand gain.
  alternative: L’attachement à Dieu, accompagné du contentement, est un important moyen de s’enrichir.
  rationale: La formulation retient la valeur prédicative probable de πορισμός et préserve le contraste avec le verset 5 sans faire de la foi un instrument utilitaire. Une note signale l’autre nuance lexicale possible.
translation_notes:
  register: Français international moderne, digne et accessible. «Attachement à Dieu» rend εὐσέβεια de façon naturelle et relationnelle; «grand gain» conserve la concision et le jeu lexical du grec.
