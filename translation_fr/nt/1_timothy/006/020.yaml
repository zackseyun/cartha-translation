id: 1TI.6.20
reference: 1 Timothy 6:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ὦ Τιμόθεε, τὴν παραθήκην φύλαξον, ἐκτρεπόμενος τὰς βεβήλους κενοφωνίας καὶ ἀντιθέσεις τῆς ψευδωνύμου γνώσεως,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/020.yaml
  text: O Timothy[a], guard the deposit entrusted to you[b], turning away from the profane empty talk and contradictions of what is falsely called knowledge.
translation:
  language: fr
  text: Ô Timothée, garde ce qui t’a été confié, en te détournant des discours profanes et creux, ainsi que des contradictions[a] de ce qu’on appelle faussement « connaissance »[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « oppositions ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « de la soi-disant connaissance ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὦ Τιμόθεε
  choice: Ô Timothée
  rationale: « Ô » conserve la solennité et l’intensité de l’interpellation grecque, tout en restant compréhensible dans un registre biblique digne.
- source_word: παραθήκην
  choice: ce qui t’a été confié
  rationale: Cette formulation naturelle exprime directement l’idée d’un bien remis à quelqu’un pour qu’il le garde, sans préciser abusivement la nature de ce dépôt.
- source_word: φύλαξον
  choice: garde
  rationale: L’impératif évoque la conservation vigilante de ce qui a été confié; « garde » est à la fois direct, courant et fidèle.
- source_word: ἐκτρεπόμενος
  choice: en te détournant
  rationale: Le participe exprime l’action de se détourner ou de se tenir à l’écart; cette traduction conserve l’image verbale et son lien avec l’impératif principal.
- source_word: βεβήλους κενοφωνίας
  choice: des discours profanes et creux
  rationale: « Profanes » maintient le contraste avec ce qui est saint, tandis que « creux » rend le caractère vide et sans valeur de ces paroles.
- source_word: ἀντιθέσεις
  choice: contradictions
  rationale: Le terme peut désigner des oppositions ou des affirmations contradictoires. « Contradictions » convient au contexte polémique, tandis que l’autre possibilité est signalée en note.
- source_word: τῆς ψευδωνύμου γνώσεως
  choice: de ce qu’on appelle faussement « connaissance »
  rationale: Cette formulation indique clairement que l’auteur conteste la légitimité même de cette appellation, tout en conservant le génitif qui rattache les contradictions à cette prétendue connaissance.
theological_decisions:
- issue: Nature de παραθήκη dans le contexte
  choice: « ce qui t’a été confié », sans en préciser davantage le contenu
  alternative: « le message de l’Évangile », « l’enseignement apostolique » ou « la mission confiée à Timothée »
  rationale: Le contexte suggère probablement le message ou l’enseignement confié à Timothée, mais le verset ne l’explicite pas. La traduction préserve donc l’étendue et la tension du terme grec.
- issue: Portée de ψευδώνυμος
  choice: L’expression nie que la « connaissance » mérite réellement ce nom
  alternative: « la soi-disant connaissance », formulation pouvant être entendue comme une simple prise de distance
  rationale: Le composé grec signifie « faussement nommé ». « Ce qu’on appelle faussement » conserve cette accusation explicite sans identifier le courant visé au-delà du texte.
translation_notes:
  register: Français international moderne, clair et digne. L’interjection « Ô » conserve la force solennelle de l’adresse; les autres choix évitent l’archaïsme. Les guillemets autour de « connaissance » rendent visible la contestation portée par ψευδώνυμος.
