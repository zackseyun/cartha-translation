  verdict: revise
  source_fidelity: 'Le sens principal est bien rendu : δοῦλοι désigne ici des esclaves, « sous le joug » exprime leur assujettissement, et la finale vise conjointement le nom de Dieu et l’enseignement. Toutefois, « qui sont esclaves sous le joug » n’est pas une formulation française naturelle, et « blasphémés » convient mal à « l’enseignement », bien que le grec βλασφημῆται porte sur les deux termes.'
  naturalness: La révision emploie une formulation idiomatique et sobre en français international moderne. « Vivent sous le joug de l’esclavage » rend explicitement la construction grecque sans l’alourdir, et « diffamés » peut se rapporter naturellement tant au nom de Dieu qu’à l’enseignement.
  terminology: « Esclavage », « maîtres », « honneur » et « enseignement » rendent adéquatement les termes grecs et maintiennent le registre du passage. « Diffamés » rend ici le sens contextuel de βλασφημέω sans limiter indûment le verbe à un usage religieux applicable seulement au nom de Dieu.
  issues:
  - severity: medium
    issue: Formulation française peu idiomatique de « sont esclaves sous le joug »
    rationale: Le grec qualifie les esclaves comme étant « sous un joug » ; en français, la juxtaposition « sont esclaves sous le joug » est raide. « Vivent sous le joug de l’esclavage » exprime clairement la condition décrite.
  - severity: medium
    issue: « Ne soient pas blasphémés » est maladroit avec le sujet coordonné « le nom de Dieu et l’enseignement »
    rationale: βλασφημῆται peut signifier être calomnié, injurié ou dénigré. En français, « blasphémer l’enseignement » n’est pas naturel ; « diffamer » garde l’idée d’atteinte publique aux deux référents.
