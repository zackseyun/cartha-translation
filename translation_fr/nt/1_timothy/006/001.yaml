id: 1TI.6.1
reference: 1 Timothy 6:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ὅσοι εἰσὶν ὑπὸ ζυγὸν δοῦλοι, τοὺς ἰδίους δεσπότας πάσης τιμῆς ἀξίους ἡγείσθωσαν, ἵνα μὴ τὸ ὄνομα τοῦ θεοῦ καὶ ἡ διδασκαλία βλασφημῆται.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/001.yaml
  text: All who are servants under a yoke should regard their own masters as worthy of all honor[c][b][a], so that the name of God and the teaching may not be slandered.
translation:
  language: fr
  text: Tous ceux qui vivent sous le joug de l’esclavage[a] doivent considérer leurs propres maîtres comme dignes de tout honneur, afin que le nom de Dieu et l’enseignement[b] ne soient pas diffamés[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « serviteurs sous le joug » ; litt. « esclaves sous un joug ». Le grec emploie δοῦλοι ; l’image du joug rend explicite la condition d’esclavage.
    reason: alternative_reading
  - marker: b
    text: Ou « la doctrine ».
    reason: lexical_alternative
  - marker: c
    text: Ou « ne soient pas blasphémés », « calomniés » ou « dénigrés ».
    reason: lexical_alternative
lexical_decisions:
- source_word: δοῦλοι
  choice: esclaves
  rationale: Le contexte explicite de sujétion (« sous le joug ») appelle le terme précis « esclaves » plutôt que le terme plus large « serviteurs ».
- source_word: ὑπὸ ζυγὸν
  choice: sous le joug
  rationale: Cette expression française naturelle conserve la métaphore grecque de l’assujettissement.
- source_word: δεσπότας
  choice: maîtres
  rationale: Dans ce cadre social, δεσπόται désigne ceux qui exercent leur autorité sur des esclaves ; « maîtres » est le terme contextuel le plus direct.
- source_word: ἰδίους
  choice: leurs propres
  rationale: Cette formulation maintient l’idée que chacun doit considérer ainsi le maître particulier dont il dépend.
- source_word: πάσης τιμῆς ἀξίους
  choice: dignes de tout honneur
  rationale: Le tour reste proche du grec tout en étant clair et idiomatique en français.
- source_word: ἡγείσθωσαν
  choice: doivent considérer
  rationale: Le présent impératif exprime une disposition continue ; « doivent considérer » en transmet clairement la force prescriptive.
- source_word: τὸ ὄνομα τοῦ θεοῦ
  choice: le nom de Dieu
  rationale: Cette traduction directe préserve la notion biblique du nom comme expression de l’identité et de la réputation de Dieu.
- source_word: ἡ διδασκαλία
  choice: l’enseignement
  rationale: « Enseignement » est actuel, accessible et moins chargé de connotations techniques que « doctrine ».
- source_word: βλασφημῆται
  choice: ne soient pas blasphémés
  rationale: « Blasphémer » rend la gravité de βλασφημέω et peut ici viser conjointement le nom de Dieu et l’enseignement, même si le français courant emploierait aussi « insulter » ou « dénigrer ».
- source_word: Ὅσοι εἰσὶν
  choice: Tous ceux qui sont
  rationale: Cette formulation française naturelle conserve la portée inclusive de ὅσοι.
theological_decisions:
- issue: Traduction de δοῦλοι dans un contexte social et moral sensible
  choice: esclaves
  alternative: serviteurs ; serviteurs asservis
  rationale: Le texte décrit une condition réelle de servitude, rendue explicite par l’image du joug. La traduction la reflète sans présenter cette institution comme moralement approuvée.
- issue: Traduction de διδασκαλία
  choice: l’enseignement
  alternative: la doctrine
  rationale: Le terme désigne ici l’enseignement chrétien sans exiger le sens plus technique que « doctrine » peut revêtir aujourd’hui.
- issue: Portée de βλασφημῆται sur deux sujets coordonnés
  choice: ne soient pas blasphémés
  alternative: ne soient pas insultés ; ne soient pas dénigrés
  rationale: Le même verbe grec porte sur le nom de Dieu et sur l’enseignement. Le choix retenu maintient sa force religieuse et la coordination du texte, sans répartir artificiellement deux verbes différents.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe conserve le mouvement de la phrase grecque, tandis que « sous le joug » emploie l’expression idiomatique française. Le vocabulaire explicite la réalité historique de l’esclavage sans l’atténuer ni l’approuver.
