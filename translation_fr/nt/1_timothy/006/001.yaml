revisions:
- from: Tous ceux qui sont esclaves sous le joug[a] doivent considérer leurs propres maîtres comme dignes de tout honneur, afin que le nom de Dieu et l’enseignement[b] ne soient pas blasphémés[c].
  to: Tous ceux qui vivent sous le joug de l’esclavage[a] doivent considérer leurs propres maîtres comme dignes de tout honneur, afin que le nom de Dieu et l’enseignement[b] ne soient pas diffamés[c].
  rationale: La révision améliore la syntaxe française tout en conservant la force du présent impératif (« doivent considérer »), la réalité historique de l’esclavage, le possessif explicite « leurs propres maîtres » et la coordination grecque de « le nom de Dieu et l’enseignement ». Les trois appels de note restent correctement ancrés et leurs alternatives sont alignées sur le texte révisé.
