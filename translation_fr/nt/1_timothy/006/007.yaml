  variant: modern international French
source:
  edition: SBLGNT
  text: οὐδὲν γὰρ εἰσηνέγκαμεν εἰς τὸν κόσμον, ⸀ὅτι οὐδὲ ἐξενεγκεῖν τι δυνάμεθα·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/007.yaml
  text: For we brought nothing into the world[a], and we are not able to carry anything out.
translation:
  language: fr
  text: Car nous n’avons rien apporté dans le monde[a], et nous ne pouvons rien en emporter.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « Car nous n’avons rien apporté dans le monde, parce que nous ne pouvons non plus rien en emporter. » La conjonction grecque peut exprimer la cause (« parce que ») ou introduire la seconde affirmation correspondante.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὐδὲν
  choice: rien
  rationale: Pronom négatif absolu, complément de « avons apporté » ; « rien » est naturel et exact en français.
- source_word: γὰρ
  choice: Car
  rationale: Introduit la raison ou l’explication de l’affirmation précédente tout en conservant explicitement le lien logique.
- source_word: εἰσηνέγκαμεν
  choice: avons apporté
  rationale: Rend l’aoriste de εἰσφέρω, « apporter dans » ; le passé composé convient au français actuel et à l’image de l’entrée dans le monde.
- source_word: εἰς τὸν κόσμον
  choice: dans le monde
  rationale: Désigne ici le monde humain dans lequel on entre par la naissance ; cette formulation est idiomatique en français.
- source_word: ὅτι
  choice: et
  rationale: Présente la seconde affirmation correspondante dans la formulation proverbiale. La possibilité d’un sens causal est conservée dans la note.
- source_word: οὐδὲ … τι
  choice: ne … rien
  rationale: La négation française « ne… rien » exprime naturellement le pronom indéfini sous la portée de la négation.
- source_word: ἐξενεγκεῖν
  choice: en emporter
  rationale: Rend l’idée de porter quelque chose hors du monde ; le pronom « en » reprend naturellement « le monde » et marque le mouvement de sortie.
- source_word: δυνάμεθα
  choice: nous ne pouvons
  rationale: Équivalent français direct et courant de l’expression grecque de capacité niée.
theological_decisions:
- issue: Valeur de ὅτι introduisant la seconde proposition
  choice: 'Coordination : « et nous ne pouvons rien en emporter »'
  alternative: 'Causalité : « parce que nous ne pouvons non plus rien en emporter »'
  rationale: Le verset forme deux affirmations parallèles — rien n’est apporté à l’entrée dans le monde, rien ne peut en être emporté à la sortie. La coordination restitue ce parallélisme sans exclure la lecture causale, signalée en note.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation brève conserve le parallélisme proverbial entre l’entrée dans le monde et la sortie du monde, sans expliciter davantage l’allusion à la naissance et à la mort.
