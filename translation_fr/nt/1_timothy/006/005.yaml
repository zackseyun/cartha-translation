  text: διαπαρατριβαὶ διεφθαρμένων ἀνθρώπων τὸν νοῦν καὶ ἀπεστερημένων τῆς ἀληθείας, νομιζόντων πορισμὸν εἶναι τὴν ⸀εὐσέβειαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/005.yaml
  text: constant friction among people whose minds are corrupted and who have been deprived of the truth[b][a], imagining that godliness is a means of gain.
translation:
  language: fr
  text: des conflits incessants[a] entre des personnes à l’intelligence corrompue, privées de la vérité et s’imaginant que la piété est une source de profit[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des frictions incessantes » ou « des querelles continuelles ». Le terme grec évoque des frottements répétés entre les personnes et, par image, des conflits persistants.
    reason: lexical_alternative
  - marker: b
    text: Ou « que la piété est un moyen de gain » ou « constitue un profit ». Le terme grec peut désigner le gain ou ce qui permet de l’obtenir.
    reason: lexical_alternative
lexical_decisions:
- source_word: διαπαρατριβαὶ
  choice: frictions incessantes
  rationale: Le nom évoque des frottements répétés et, au sens figuré, des conflits continuels. « Frictions incessantes » conserve cette image tout en restant naturel en français moderne.
- source_word: διεφθαρμένων … τὸν νοῦν
  choice: dont l’esprit est corrompu
  rationale: Le participe parfait décrit un état durable résultant d’une corruption. « Esprit » rend ici νοῦς dans sa dimension intellectuelle et morale sans renforcer indûment le jugement du texte.
- source_word: ἀπεστερημένων τῆς ἀληθείας
  choice: qui sont privés de la vérité
  rationale: Le participe parfait passif exprime la perte subie et l’état qui en résulte. La formulation française conserve le passif et la référence définie à « la vérité ».
- source_word: νομιζόντων
  choice: s’imaginant
  rationale: Le participe introduit leur conviction erronée. « S’imaginant » signale naturellement cette erreur sans ajouter d’explication au texte.
- source_word: πορισμὸν
  choice: un moyen de s’enrichir
  rationale: Le terme peut désigner le gain, le profit ou ce qui permet de l’obtenir. Cette expression fait ressortir l’usage intéressé de la piété dans un français courant.
- source_word: εὐσέβειαν
  choice: la piété
  rationale: Dans les Pastorales, le mot désigne une attitude et une conduite respectueuses de Dieu. « Piété » conserve le sens positif du terme grec; c’est leur manière de l’exploiter qui est condamnée.
theological_decisions:
- issue: La piété désigne-t-elle ici une authentique orientation vers Dieu ou une religion purement extérieure ?
  choice: Traduire εὐσέβεια par « la piété », terme positif dont le contexte montre l’exploitation intéressée.
  alternative: « la religion » ou « la dévotion envers Dieu »
  rationale: Le grec ne présente pas la piété elle-même comme fausse; il condamne ceux qui la considèrent comme un moyen de gain. La traduction préserve cette tension.
- issue: Quel degré de condamnation morale exprimer pour διεφθαρμένων ?
  choice: « dont l’esprit est corrompu »
  alternative: « à l’esprit dépravé » ou « dont l’intelligence est ruinée »
  rationale: « Corrompu » rend la forte appréciation morale et l’état résultant du parfait, sans importer une formulation doctrinale plus chargée.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe participiale est conservée sous une forme naturelle; « gens » évite un masculin générique pesant, tandis que « piété » maintient le vocabulaire théologique positif du grec.
