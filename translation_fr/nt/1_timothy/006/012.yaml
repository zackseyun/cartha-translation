source:
  edition: SBLGNT
  text: ἀγωνίζου τὸν καλὸν ἀγῶνα τῆς πίστεως, ἐπιλαβοῦ τῆς αἰωνίου ζωῆς, εἰς ἣν ἐκλήθης καὶ ὡμολόγησας τὴν καλὴν ὁμολογίαν ἐνώπιον πολλῶν μαρτύρων.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/012.yaml
  text: Fight the good fight of the faith[b][a]; take hold of the eternal life to which you were called and about which you made the good confession before many witnesses.
translation:
  language: fr
  text: Combats le bon combat de la foi[a]. Saisis la vie éternelle à laquelle tu as été appelé, et tu as fait la belle confession[b] devant de nombreux témoins.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression grecque peut désigner le combat caractérisé par la foi ou le combat en faveur de la foi chrétienne.
    reason: alternative_reading
  - marker: b
    text: 'Ou, en rattachant plus étroitement la confession à ce qui précède : « et au sujet de laquelle tu as fait la belle confession ». Le grec dit simplement « et » et ne précise pas explicitement le contenu de cette confession.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγωνίζου τὸν καλὸν ἀγῶνα
  choice: Combats le bon combat
  rationale: L’impératif présent exprime un engagement soutenu. La tournure française conserve la métaphore et, autant que possible, la force de la construction grecque fondée sur deux mots de même famille.
- source_word: τῆς πίστεως
  choice: de la foi
  rationale: La formulation garde ouverte la possibilité d’un combat caractérisé par la foi ou mené pour la foi chrétienne, sans préciser davantage dans le texte principal.
- source_word: ἐπιλαβοῦ
  choice: saisis
  rationale: L’impératif aoriste appelle à s’emparer résolument de ce qui est présenté. « Saisis » est direct, naturel et conserve l’image concrète du grec.
- source_word: τῆς αἰωνίου ζωῆς
  choice: la vie éternelle
  rationale: Cette expression française usuelle correspond précisément au syntagme grec défini.
- source_word: εἰς ἣν ἐκλήθης
  choice: à laquelle tu as été appelé
  rationale: La préposition εἰς exprime ici le but ou la destination de l’appel. Le passif est conservé sans expliciter l’auteur de l’appel.
- source_word: ὡμολόγησας τὴν καλὴν ὁμολογίαν
  choice: tu as fait la belle confession
  rationale: La traduction maintient le lien étymologique entre le verbe et le nom sous une expression française compréhensible. « Belle » rend καλὴν dans son sens qualitatif de noble ou excellente, tandis que « confession » garde la dimension d’une déclaration publique sans en imposer le contenu précis.
- source_word: ἐνώπιον πολλῶν μαρτύρων
  choice: devant de nombreux témoins
  rationale: 'Rendu direct et idiomatique : les μάρτυρες sont ici des personnes présentes qui peuvent attester la confession.'
theological_decisions:
- issue: Sens de πίστεως dans τὸν καλὸν ἀγῶνα τῆς πίστεως
  choice: « de la foi » dans le texte principal
  alternative: « par la foi » ou « pour la foi »
  rationale: Le génitif peut désigner un combat caractérisé par la foi ou un combat en faveur de la foi chrétienne. La traduction littérale préserve cette tension, et la note explicite les principales possibilités.
- issue: Rapport entre la confession et l’appel à la vie éternelle
  choice: 'Coordination simple : « et tu as fait la belle confession »'
  alternative: 'Expliciter : « au sujet de laquelle tu as fait la belle confession »'
  rationale: Le grec relie les propositions par καί sans dire expressément que la vie éternelle constitue le contenu de la confession. La proximité syntaxique permet ce rapprochement, mais le texte principal évite de le rendre obligatoire.
- issue: Nature de la confession publique
  choice: « la belle confession » sans contenu ajouté
  alternative: « la belle profession de foi »
  rationale: Ajouter « de foi » rendrait l’expression plus immédiatement ecclésiale, mais préciserait un contenu que ce membre de phrase ne formule pas explicitement.
translation_notes:
  register: Français international moderne, direct et digne. Les impératifs au singulier conservent l’adresse personnelle à Timothée. « Bon combat » est naturel et garde la métaphore, tandis que « belle confession » préserve le parallèle de καλός sans transformer la confession en formule doctrinale déterminée.
