  source_fidelity: 'Le texte rend fidèlement les principaux éléments du grec : l’exclusivité de μόνος (« lui qui seul »), la possession de l’immortalité, l’habitation dans une lumière ἀπρόσιτον (« inaccessible »), l’invisibilité et l’incapacité humaine à voir, puis la doxologie. « Aucun être humain » restitue naturellement la portée générique de οὐδεὶς ἀνθρώπων sans introduire de restriction de genre. « Puissance éternelle » est un équivalent recevable de κράτος αἰώνιον dans une formule doxologique.'
  naturalness: Le français est moderne, solennel et fluide. La reprise de « lui » avant la relative est emphatique mais naturelle dans ce contexte liturgique. « À lui soient l’honneur et la puissance éternelle » rend bien la construction doxologique grecque.
