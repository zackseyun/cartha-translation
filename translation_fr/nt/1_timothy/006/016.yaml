id: 1TI.6.16
reference: 1 Timothy 6:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ μόνος ἔχων ἀθανασίαν, φῶς οἰκῶν ἀπρόσιτον, ὃν εἶδεν οὐδεὶς ἀνθρώπων οὐδὲ ἰδεῖν δύναται· ᾧ τιμὴ καὶ κράτος αἰώνιον· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/016.yaml
  text: who alone has immortality[a], dwelling in unapproachable light, whom no one among men has seen nor is able to see. To him be honor and eternal dominion[b]. Amen.
translation:
  language: fr
  text: lui qui seul possède l’immortalité et habite une lumière inaccessible, lui qu’aucun être humain n’a vu ni ne peut voir. À lui soient l’honneur et la puissance éternelle.[a] Amen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dans le contexte plus large, certains comprennent que cette description et cette louange se rapportent plus directement au Seigneur Jésus Christ ; toutefois, le langage de l’invisibilité renvoie plus naturellement à Dieu.
    reason: alternative_reading
lexical_decisions:
- source_word: μόνος
  choice: seul
  rationale: 'Exprime naturellement l’exclusivité : lui seul possède intrinsèquement ce qui suit.'
- source_word: ἔχων ἀθανασίαν
  choice: possède l’immortalité
  rationale: « Possède » rend clairement ἔχων et souligne, sans ajout doctrinal, que l’immortalité lui appartient.
- source_word: φῶς οἰκῶν ἀπρόσιτον
  choice: habite une lumière inaccessible
  rationale: Reproduit la construction participiale et le sens d’une lumière dont on ne peut s’approcher.
- source_word: οὐδεὶς ἀνθρώπων
  choice: aucun être humain
  rationale: Le génitif partitif désigne personne parmi les humains ; cette formulation inclusive et idiomatique restitue exactement la portée de ἀνθρώπων.
- source_word: οὐδὲ ἰδεῖν δύναται
  choice: ni ne peut voir
  rationale: Rend explicitement l’incapacité exprimée par δύναται dans un français naturel.
- source_word: τιμὴ
  choice: l’honneur
  rationale: Équivalent doxologique courant ; le verbe sous-entendu en grec est explicité par « soient ».
- source_word: κράτος αἰώνιον
  choice: la puissance éternelle
  rationale: κράτος désigne ici une puissance souveraine et effective ; « puissance » demeure naturel et laisse au contexte sa dimension de domination.
- source_word: ἀμήν
  choice: Amen
  rationale: Translittération consacrée dans l’usage biblique français.
theological_decisions:
- issue: Référent des propositions relatives et de la doxologie
  choice: Le texte français conserve les pronoms du grec sans nommer explicitement le référent ; dans le contexte, la description vise le Souverain bienheureux et unique.
  alternative: Certains rattachent plus directement cette description au Seigneur Jésus Christ mentionné dans la phrase précédente.
  rationale: La syntaxe et surtout l’affirmation que nul humain ne l’a vu ni ne peut le voir orientent naturellement vers Dieu, mais la traduction ne tranche pas au-delà des pronoms grecs et une note préserve l’autre lecture contextuelle.
- issue: Portée de ἀνθρώπων
  choice: « aucun être humain »
  alternative: « personne parmi les hommes »
  rationale: ἀνθρώπων a ici une portée générique et désigne l’humanité ; le français moderne « être humain » transmet cette portée sans ambiguïté.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve le mouvement solennel de la doxologie grecque. « Lumière inaccessible » reprend une expression biblique claire ; « lui qu’aucun être humain » évite un masculin français potentiellement restrictif sans modifier la portée du grec.
