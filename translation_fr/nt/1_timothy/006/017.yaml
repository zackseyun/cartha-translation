id: 1TI.6.17
reference: 1 Timothy 6:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Τοῖς πλουσίοις ἐν τῷ νῦν αἰῶνι παράγγελλε μὴ ὑψηλοφρονεῖν μηδὲ ἠλπικέναι ἐπὶ πλούτου ἀδηλότητι, ἀλλ’ ⸀ἐπὶ ⸀θεῷ τῷ παρέχοντι ἡμῖν πάντα πλουσίως εἰς ἀπόλαυσιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/017.yaml
  text: Command those who are rich in the present age not to be arrogant[a], nor to set their hope on the uncertainty of riches, but on God[b], who richly provides us with everything for enjoyment.
translation:
  language: fr
  text: Ordonne à ceux qui sont riches à l’époque actuelle de ne pas être orgueilleux et de ne pas mettre leur espérance dans des richesses incertaines[a], mais en Dieu, qui nous donne tout avec abondance pour que nous en jouissions.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans l’incertitude des richesses ».
    reason: Alternative lexicale et syntaxique pour ἐπὶ πλούτου ἀδηλότητι.
lexical_decisions:
- source_word: Τοῖς πλουσίοις ἐν τῷ νῦν αἰῶνι
  choice: à ceux qui sont riches dans le temps présent
  rationale: La tournure désigne les personnes riches, tandis que αἰών renvoie ici à l’époque présente. « Dans le temps présent » reste naturel en français et conserve la portée temporelle et eschatologique.
- source_word: παράγγελλε
  choice: Ordonne
  rationale: L’impératif exprime une directive investie d’autorité; « ordonne » en garde la force sans archaïsme.
- source_word: μὴ ὑψηλοφρονεῖν
  choice: de ne pas être orgueilleux
  rationale: Le verbe dénonce une haute opinion de soi. « Être orgueilleux » est clair, actuel et moralement précis.
- source_word: μηδὲ ἠλπικέναι
  choice: et de ne pas mettre leur espérance
  rationale: Le parfait infinitif évoque une espérance placée de manière établie; « mettre leur espérance » rend cette orientation durable.
- source_word: ἐπὶ πλούτου ἀδηλότητι
  choice: dans des richesses incertaines
  rationale: La construction caractérise la richesse par son manque de fiabilité. Cette formulation française est idiomatique et conserve l’ambiguïté entre l’incertitude des biens et celle de leur permanence.
- source_word: ἀλλ’ ἐπὶ θεῷ
  choice: mais en Dieu
  rationale: La répétition de ἐπί oppose les deux objets de l’espérance. En français, on met naturellement son espérance « en Dieu ».
- source_word: τῷ παρέχοντι ἡμῖν πάντα πλουσίως
  choice: qui nous donne tout avec abondance
  rationale: « Donne » rend simplement l’action de fournir, πάντα conserve sa portée générale avec « tout », et « avec abondance » exprime πλουσίως sans une formulation française artificielle.
- source_word: εἰς ἀπόλαυσιν
  choice: pour que nous en jouissions
  rationale: Cette proposition finale explicite naturellement en français la destination ou le but exprimé par εἰς, sans ajouter de restriction au don divin.
theological_decisions:
- issue: Sens de αἰών dans le contexte éthique et eschatologique
  choice: le temps présent
  alternative: le monde présent
  rationale: Le choix temporel préserve le contraste entre l’époque actuelle et l’âge à venir, sans réduire l’expression au monde matériel.
- issue: Rapport entre l’espérance et la richesse incertaine
  choice: mettre leur espérance dans des richesses incertaines
  alternative: mettre leur espérance dans l’incertitude des richesses
  rationale: Le grec permet de souligner l’incertitude qui caractérise la richesse. Le texte principal retient la formulation française la plus naturelle, tandis que la note conserve l’autre analyse formelle.
- issue: Portée de πάντα dans la provision divine
  choice: tout
  alternative: tout ce qui est nécessaire
  rationale: Le grec ne limite pas explicitement le don aux seules nécessités. La traduction maintient cette ampleur sans en tirer une promesse de prospérité.
translation_notes:
  register: Français international moderne, digne et directement compréhensible. La phrase conserve la force pastorale de l’impératif, le contraste entre richesse et Dieu, ainsi que l’ampleur non restreinte de la provision divine.
