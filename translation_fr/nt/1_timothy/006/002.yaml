    rationale: οἱ τῆς εὐεργεσίας ἀντιλαμβανόμενοι est syntaxiquement condensé et son référent exact est discuté. La formulation proposée identifie directement les maîtres comme bénéficiaires du service, alors que le texte et l’audit anglais gardent cette conclusion dans une note. « Ceux qui reçoivent ce bienfait » est plus proche et préserve l’ambiguïté.
