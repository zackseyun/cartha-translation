source:
  edition: SBLGNT
  text: οἱ δὲ πιστοὺς ἔχοντες δεσπότας μὴ καταφρονείτωσαν, ὅτι ἀδελφοί εἰσιν· ἀλλὰ μᾶλλον δουλευέτωσαν, ὅτι πιστοί εἰσιν καὶ ἀγαπητοὶ οἱ τῆς εὐεργεσίας ἀντιλαμβανόμενοι. Ταῦτα δίδασκε καὶ παρακάλει.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/002.yaml
  text: And those who have believing masters must not despise them because they are brothers[a]; rather, they must serve them all the more, because those who partake of the benefit are believers and beloved[b]. Teach and urge these things.
translation:
  language: fr
  text: Quant à ceux qui ont des maîtres croyants, qu’ils ne les méprisent pas parce qu’ils sont frères[a]. Qu’ils les servent plutôt davantage, puisque ceux qui reçoivent ce bienfait sont croyants et bien-aimés[b]. Enseigne et recommande ces choses.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « frères et sœurs » ; le grec porte « frères ».
    reason: lexical_alternative
  - marker: b
    text: La proposition grecque est difficile. Elle désigne très probablement les maîtres croyants comme ceux qui reçoivent le bienfait du service des personnes qui leur sont soumises.
    reason: alternative_reading
lexical_decisions:
- source_word: πιστοὺς … πιστοί
  choice: croyants
  rationale: Dans les deux occurrences, le contexte désigne des personnes qui croient en Christ, plutôt que des personnes simplement fiables ou fidèles.
- source_word: δεσπότας
  choice: maîtres
  rationale: Dans ce contexte d’esclavage domestique, « maîtres » exprime l’autorité et la possession impliquées par le terme grec, sans la connotation religieuse moderne de « seigneurs ».
- source_word: καταφρονείτωσαν
  choice: qu’ils ne les méprisent pas
  rationale: « Mépriser » conserve la force du verbe, qui évoque le dédain et le fait de tenir quelqu’un pour peu de chose.
- source_word: ἀδελφοί
  choice: frères
  rationale: Le masculin pluriel du grec est conservé; ici, il présente les maîtres croyants comme membres de la même famille spirituelle.
- source_word: μᾶλλον δουλευέτωσαν
  choice: qu’ils les servent, au contraire, d’autant mieux
  rationale: « Servent » rend naturellement l’action accomplie dans la condition servile déjà indiquée par « maîtres ». « D’autant mieux » exprime ici l’intensification portée par μᾶλλον.
- source_word: ἀγαπητοί
  choice: bien-aimés
  rationale: Ce terme garde la dimension affective et communautaire du vocabulaire chrétien, dans un registre digne et courant.
- source_word: οἱ τῆς εὐεργεσίας ἀντιλαμβανόμενοι
  choice: ceux qui bénéficient de leur service
  rationale: Le tour français identifie naturellement les maîtres croyants comme bénéficiaires. « Service » explicite le bienfait visé par le contexte, tandis qu’une note signale la difficulté de la construction grecque.
- source_word: Ταῦτα δίδασκε καὶ παρακάλει
  choice: Enseigne et recommande ces choses
  rationale: Les deux présents impératifs sont rendus directement. « Recommande » exprime l’exhortation insistante sans adopter un registre inutilement technique.
theological_decisions:
- issue: Portée de ἀδελφοί
  choice: frères
  alternative: frères et sœurs; membres de la même famille de Dieu
  rationale: Dans la situation évoquée, les maîtres sont désignés au masculin pluriel. Une note précise que le mot peut aussi, selon le contexte, englober l’ensemble des croyants, sans neutraliser la forme du texte ici.
- issue: Terminologie du statut servile
  choice: maîtres … servent
  alternative: propriétaires … travaillent comme esclaves
  rationale: La traduction maintient la réalité sociale du passage sans introduire le nom « esclaves », absent de ce verset, ni affaiblir δεσπότας.
- issue: Référent de οἱ τῆς εὐεργεσίας ἀντιλαμβανόμενοι
  choice: les maîtres croyants reçoivent le bénéfice du service
  alternative: les personnes asservies sont attachées à faire le bien; les deux parties partagent le bénéfice
  rationale: La lecture la plus immédiate rattache le groupe substantivé aux maîtres croyants mentionnés juste avant. Comme la construction grecque est condensée et discutée, la note préserve cette tension interprétative.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe impérative reste ferme. « Sous prétexte que » rend clairement que la fraternité chrétienne ne doit pas devenir un motif de mépris, et « d’autant mieux » évite la tournure ambiguë « les servir davantage ».
