revisions:
- from: Quant à ceux qui ont des maîtres croyants, qu’ils ne les méprisent pas sous prétexte qu’ils sont frères[a]. Qu’ils les servent, au contraire, d’autant mieux, puisque ceux qui bénéficient de leur service sont croyants et bien-aimés[b]. Enseigne et recommande ces choses.
  to: Quant à ceux qui ont des maîtres croyants, qu’ils ne les méprisent pas parce qu’ils sont frères[a]. Qu’ils les servent plutôt davantage, puisque ceux qui reçoivent ce bienfait sont croyants et bien-aimés[b]. Enseigne et recommande ces choses.
  rationale: La révision remplace l’intensification qualitative par une comparaison quantitative plus fidèle à μᾶλλον et retire de la traduction principale l’explicitation interprétative de la proposition finale. La note conserve la lecture contextuellement la plus probable sans la présenter comme certaine dans le texte traduit.
