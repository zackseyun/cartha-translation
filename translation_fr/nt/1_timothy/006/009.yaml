id: 1TI.6.9
reference: 1 Timothy 6:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οἱ δὲ βουλόμενοι πλουτεῖν ἐμπίπτουσιν εἰς πειρασμὸν καὶ παγίδα καὶ ἐπιθυμίας πολλὰς ἀνοήτους καὶ βλαβεράς, αἵτινες βυθίζουσι τοὺς ἀνθρώπους εἰς ὄλεθρον καὶ ἀπώλειαν·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/009.yaml
  text: But those who want to be rich fall into temptation[a], a snare, and many foolish and harmful desires[c][b], which plunge people into ruin and destruction.
translation:
  language: fr
  text: Mais ceux qui veulent devenir riches tombent dans la tentation, dans un piège et dans de nombreux désirs insensés et nuisibles, qui plongent les êtres humains dans la ruine et la destruction.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ βουλόμενοι
  choice: Mais ceux qui veulent
  rationale: « Veulent » exprime naturellement en français le désir ou l’intention durable indiqués ici par βούλομαι, tandis que « mais » marque le contraste introduit par δέ.
- source_word: πλουτεῖν
  choice: devenir riches
  rationale: Dans ce contexte, l’infinitif vise l’aspiration à acquérir la richesse. « Devenir riches » rend ce mouvement plus clairement que « être riches », sans adopter le registre familier de « s’enrichir à tout prix ».
- source_word: ἐμπίπτουσιν εἰς
  choice: tombent dans
  rationale: Cette tournure conserve la métaphore grecque et constitue une expression française naturelle pour l’entrée dans une situation dangereuse.
- source_word: πειρασμόν
  choice: la tentation
  rationale: Dans cet avertissement moral, le mot désigne vraisemblablement une incitation au mal plutôt qu’une épreuve neutre.
- source_word: παγίδα
  choice: un piège
  rationale: « Piège » restitue clairement l’image de ce qui capture ou prend au dépourvu; « traquenard » serait plus marqué et moins général.
- source_word: ἐπιθυμίας πολλὰς ἀνοήτους καὶ βλαβεράς
  choice: de nombreux désirs insensés et nuisibles
  rationale: « Désirs » garde l’étendue de ἐπιθυμίαι; « insensés » traduit l’absence de jugement suggérée par ἀνοήτους, et « nuisibles » exprime directement le caractère dommageable de βλαβεράς.
- source_word: αἵτινες
  choice: qui
  rationale: Le relatif reprend les désirs et introduit leur effet caractéristique sans ajouter d’explication.
- source_word: βυθίζουσι
  choice: plongent
  rationale: « Plongent » préserve l’image vive d’un enfoncement ou d’une submersion causée.
- source_word: τοὺς ἀνθρώπους
  choice: les êtres humains
  rationale: Le grec est générique et ne vise pas seulement les hommes de sexe masculin. Cette formulation reste précise et digne dans le contexte.
- source_word: ὄλεθρον καὶ ἀπώλειαν
  choice: la ruine et la destruction
  rationale: Les deux noms sont distingués en français afin de conserver leur accumulation et l’intensification de l’avertissement.
theological_decisions:
- issue: La portée de ὄλεθρον καὶ ἀπώλειαν
  choice: « la ruine et la destruction », sans préciser qu’il s’agit nécessairement de la condamnation éternelle
  alternative: « la ruine et la perdition », qui pourrait suggérer plus directement le châtiment final
  rationale: Les termes grecs expriment des conséquences dévastatrices, mais ce verset ne définit pas à lui seul leur portée temporelle ou eschatologique. La traduction conserve donc la gravité et l’ambiguïté du texte.
translation_notes:
  register: Français international moderne, clair et digne. La répétition de « dans » clarifie la coordination des trois compléments après « tombent » et évite de laisser entendre que seule la tentation dépend de cette construction.
