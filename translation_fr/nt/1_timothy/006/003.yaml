id: 1TI.6.3
reference: 1 Timothy 6:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἴ τις ἑτεροδιδασκαλεῖ καὶ μὴ προσέρχεται ὑγιαίνουσι λόγοις, τοῖς τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, καὶ τῇ κατ’ εὐσέβειαν διδασκαλίᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/003.yaml
  text: If anyone teaches a different doctrine and does not agree with sound words[a], those of our Lord Jesus the Messiah, and with the teaching that accords with godliness[b],
translation:
  language: fr
  text: Si quelqu’un enseigne une doctrine différente et ne s’attache pas aux paroles saines, celles de notre Seigneur Jésus le Messie, ni à l’enseignement conforme à la piété,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἑτεροδιδασκαλεῖ
  choice: enseigne une doctrine différente
  rationale: Le verbe désigne l’enseignement d’une doctrine autre que celle reçue. Cette formulation garde l’idée doctrinale sans ajouter explicitement « fausse », jugement seulement implicite dans le contexte.
- source_word: προσέρχεται
  choice: s’attache à
  rationale: Avec le datif, le verbe exprime ici le fait d’adhérer à des paroles ou de les accepter, plutôt qu’un simple mouvement d’approche. « S’attacher à » reste naturel tout en conservant une nuance relationnelle.
- source_word: ὑγιαίνουσι λόγοις
  choice: paroles saines
  rationale: Cette expression conserve à la fois λόγοις, « paroles », et la métaphore de la santé portée par ὑγιαίνω.
- source_word: τοῖς τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: celles de notre Seigneur Jésus le Messie
  rationale: « Celles » reprend clairement « paroles ». Le génitif peut exprimer leur appartenance ou leur origine sans qu’il soit nécessaire de trancher davantage.
- source_word: Χριστοῦ
  choice: le Messie
  rationale: Χριστός conserve ici sa valeur de titre dans la désignation complète de Jésus; « le Messie » en traduit le sens en français idiomatique.
- source_word: κατ’ εὐσέβειαν
  choice: conforme à l’attachement à Dieu
  rationale: κατά indique la conformité. « Attachement à Dieu » rend la dimension de révérence et de vie orientée vers Dieu sans le ton parfois vieilli ou ambigu de « piété ».
- source_word: διδασκαλίᾳ
  choice: l’enseignement
  rationale: Le nom peut désigner l’activité d’enseigner ou son contenu. « L’enseignement » préserve cette latitude et convient au contraste du verset.
theological_decisions:
- issue: Valeur de Χριστοῦ dans Ἰησοῦ Χριστοῦ
  choice: Jésus le Messie
  alternative: Jésus-Christ
  rationale: Dans la désignation complète, le terme peut encore être entendu comme un titre messianique. La traduction principale en exprime donc le sens plutôt que de le traiter seulement comme une partie du nom.
- issue: Sens de κατ’ εὐσέβειαν
  choice: conforme à l’attachement à Dieu
  alternative: conforme à la piété; qui conduit à l’attachement à Dieu
  rationale: La formulation retenue exprime la correspondance entre l’enseignement et une vie tournée vers Dieu, sans transformer explicitement cette relation en causalité.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase garde la structure conditionnelle ouverte du grec et sa virgule finale implicite dans le contexte continu. « Paroles saines » conserve la métaphore biblique de la santé; « doctrine différente » évite d’introduire le qualificatif explicite « fausse ».
