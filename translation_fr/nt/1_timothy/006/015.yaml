id: 1TI.6.15
reference: 1 Timothy 6:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἣν καιροῖς ἰδίοις δείξει ὁ μακάριος καὶ μόνος δυνάστης, ὁ βασιλεὺς τῶν βασιλευόντων καὶ κύριος τῶν κυριευόντων,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/015.yaml
  text: which he will display in his own times—the blessed and only Sovereign[a], the King of those who reign and Lord of those who rule[b],
translation:
  language: fr
  text: qu’il manifestera aux temps qu’il a lui-même fixés[a] — le bienheureux et seul Souverain, le Roi de ceux qui règnent et le Seigneur de ceux qui exercent l’autorité[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « en ses temps propres » ; l’expression désigne les temps qui lui appartiennent et qu’il a déterminés.'
    reason: lexical_alternative
  - marker: b
    text: 'Traduction traditionnelle : « le Roi des rois et le Seigneur des seigneurs ». Le grec emploie des participes : littéralement, « le Roi de ceux qui règnent et le Seigneur de ceux qui dominent ».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἣν
  choice: qu’
  rationale: Le pronom relatif féminin singulier reprend ἐπιφάνειαν (« manifestation ») au verset 14. En français, il devient naturellement le complément élidé de « manifestera ».
- source_word: καιροῖς ἰδίοις
  choice: aux temps qu’il a lui-même fixés
  rationale: Le datif pluriel désigne les temps ou moments qui lui appartiennent en propre. Cette formulation française naturelle fait ressortir leur caractère déterminé par le sujet tout en conservant le pluriel.
- source_word: δείξει
  choice: manifestera
  rationale: Le futur de δείκνυμι signifie ici rendre visible ou faire paraître publiquement. « Manifestera » convient particulièrement à la manifestation mentionnée au verset précédent.
- source_word: ὁ μακάριος
  choice: le bienheureux
  rationale: L’adjectif substantivé sert de titre divin. « Bienheureux » garde la dignité et la portée traditionnelle de μακάριος sans le réduire au simple sentiment d’être heureux.
- source_word: μόνος δυνάστης
  choice: seul Souverain
  rationale: δυνάστης désigne celui qui détient le pouvoir de gouverner. « Souverain » exprime cette autorité suprême, tandis que μόνος est rendu directement par « seul ».
- source_word: βασιλεὺς τῶν βασιλευόντων
  choice: le Roi de ceux qui règnent
  rationale: Cette traduction conserve la valeur verbale du participe βασιλευόντων plutôt que de l’assimiler au nom « rois ».
- source_word: κύριος τῶν κυριευόντων
  choice: le Seigneur de ceux qui exercent l’autorité
  rationale: « Seigneur » rend le titre κύριος, et « ceux qui exercent l’autorité » préserve la force verbale de κυριευόντων dans un français naturel.
theological_decisions:
- issue: Identité de celui qui manifestera l’apparition
  choice: Ne pas ajouter de nom propre et laisser les titres grecs identifier le sujet dans son contexte
  alternative: Préciser qu’il s’agit du Père manifestant l’apparition de Jésus-Christ
  rationale: Le texte grec présente le sujet au moyen de titres élevés, sans le nommer explicitement dans ce verset. La traduction conserve cette manière de présenter les choses et n’impose pas une précision doctrinale absente de la formulation.
translation_notes:
  register: Français international actuel, digne et lisible. La structure appositive et les titres solennels sont conservés. La virgule finale signale que le verset se poursuit syntaxiquement au verset 16.
