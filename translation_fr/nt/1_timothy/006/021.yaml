id: 1TI.6.21
reference: 1 Timothy 6:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἥν τινες ἐπαγγελλόμενοι περὶ τὴν πίστιν ἠστόχησαν. Ἡ χάρις ⸂μεθ’ ὑμῶν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/021.yaml
  text: By professing it[a], some have missed the mark concerning the faith[c][b]. Grace be with you.
translation:
  language: fr
  text: Certains, en s’en réclamant, ont manqué le but en ce qui concerne la foi.[a][b] Que la grâce soit avec vous.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « Certains, qui prétendaient la posséder, se sont égarés en ce qui concerne la foi. » Le pronom grec renvoie explicitement à la « connaissance » mentionnée au verset précédent, et le verbe peut aussi se traduire par « se sont égarés » ou « ont dévié ».'
    reason: lexical_alternative
  - marker: b
    text: Ici, « la foi » désigne probablement la foi chrétienne dans son ensemble, mais l’expression peut aussi être comprise comme la foi personnelle.
    reason: alternative_reading
  - marker: c
    text: Dans le texte grec retenu, « vous » est au pluriel.
    reason: textual_detail
lexical_decisions:
- source_word: ἥν
  choice: en s’en
  rationale: Le pronom relatif féminin renvoie à la « connaissance » mentionnée au verset précédent. La reprise pronominale française « en » conserve ce lien sans alourdir la phrase.
- source_word: ἐπαγγελλόμενοι
  choice: réclamant
  rationale: Dans ce contexte, le participe moyen exprime le fait de se réclamer de cette prétendue connaissance ou de prétendre la posséder, et non celui de faire une promesse.
- source_word: ἠστόχησαν
  choice: ont manqué le but
  rationale: Cette formulation conserve l’image du verbe grec, celle d’une cible manquée, tout en restant claire en français moderne.
- source_word: περὶ τὴν πίστιν
  choice: en ce qui concerne la foi
  rationale: περί avec l’accusatif indique ici le domaine ou le point de référence. La formulation française respecte cette relation sans faire de la foi l’objet direct du verbe.
- source_word: Ἡ χάρις
  choice: la grâce
  rationale: Dans cette formule finale, le français naturel emploie l’article défini, contrairement à l’usage idiomatique anglais.
- source_word: μεθ’ ὑμῶν
  choice: avec vous
  rationale: Le pronom grec est pluriel. Le français « vous » étant ambigu en nombre, une note signale que la bénédiction vise plusieurs destinataires.
theological_decisions:
- issue: Sens de « la foi »
  choice: Référence probable à la foi chrétienne comme réalité confessée
  alternative: La foi personnelle, comprise comme confiance
  rationale: Dans les lettres pastorales et dans ce contexte de faux enseignement, l’expression désigne probablement la foi chrétienne dans son ensemble. La traduction littérale « la foi » maintient toutefois l’ouverture sémantique du grec.
- issue: Destinataires de la bénédiction finale
  choice: Maintien du pluriel grec
  alternative: Singulier visant uniquement Timothée
  rationale: Le texte retenu porte ὑμῶν, au pluriel, ce qui étend vraisemblablement la bénédiction au-delà de Timothée. Comme le français écrit ne marque pas ici le nombre, cette donnée est explicitée en note.
translation_notes:
  register: Français international moderne, clair et digne. La métaphore de la cible manquée est conservée. La phrase reste étroitement liée à la « connaissance » du verset précédent, tandis que les notes préservent les principales ambiguïtés lexicales et théologiques.
