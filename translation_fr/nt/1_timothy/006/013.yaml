reference: 1 Timothy 6:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: παραγγέλλω σοι ἐνώπιον τοῦ θεοῦ τοῦ ⸀ζῳογονοῦντος τὰ πάντα καὶ Χριστοῦ Ἰησοῦ τοῦ μαρτυρήσαντος ἐπὶ Ποντίου Πιλάτου τὴν καλὴν ὁμολογίαν,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/013.yaml
  text: I charge you before God[a], who gives life to all things, and Messiah Jesus, who testified to the good confession before Pontius Pilate[c][b],
translation:
  language: fr
  text: Je t’ordonne, devant Dieu qui donne la vie à toutes choses[a], et devant Jésus le Messie[b], qui a fait la belle confession devant Ponce Pilate[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qui maintient toutes choses en vie » ou « qui fait vivre toutes choses ». Le participe grec peut mettre l’accent soit sur la préservation de la vie, soit sur le fait de la donner.
    reason: lexical_alternative
  - marker: b
    text: Ou « Jésus-Christ ». Le grec Χριστός signifie « Messie » et fonctionne ici comme un titre.
    reason: alternative_reading
  - marker: c
    text: Le grec dit littéralement « qui a témoigné la belle confession ». « Sous Ponce Pilate », c’est-à-dire pendant qu’il exerçait son autorité, est aussi possible.
    reason: source_ambiguity
lexical_decisions:
- source_word: παραγγέλλω σοι
  choice: Je t’adresse cette solennelle instruction
  rationale: Le verbe exprime une directive ferme et solennelle. Cette formulation est naturelle en français et convient à l’adjuration introduite par « devant Dieu », sans réduire le propos à un simple conseil.
- source_word: ἐνώπιον
  choice: devant
  rationale: « Devant » exprime avec concision l’idée de présence et de comparution solennelle.
- source_word: ζῳογονοῦντος τὰ πάντα
  choice: qui donne la vie à toutes choses
  rationale: Le participe peut désigner l’action de donner la vie ou de maintenir en vie. Le texte principal conserve la portée générale de l’action vivifiante de Dieu, tandis que la note signale l’autre nuance possible.
- source_word: Χριστοῦ Ἰησοῦ
  choice: Jésus le Messie
  rationale: Χριστός garde ici sa valeur de titre. L’ordre est adapté à l’usage naturel du français, qui préfère « Jésus le Messie » à « le Messie Jésus ».
- source_word: μαρτυρήσαντος
  choice: qui a témoigné
  rationale: Le verbe évoque un témoignage public et conserve une tonalité judiciaire appropriée à la mention de Ponce Pilate.
- source_word: ἐπὶ Ποντίου Πιλάτου
  choice: devant Ponce Pilate
  rationale: Dans le contexte du témoignage de Jésus, « devant » exprime naturellement sa comparution en présence de Pilate, même si la construction peut aussi avoir un sens temporel.
- source_word: τὴν καλὴν ὁμολογίαν
  choice: par la belle confession
  rationale: ὁμολογία désigne une confession ou profession publique. « Belle confession » conserve καλὴν et le lien lexical avec la confession de Timothée dans le contexte. L’ajout de « par » produit une construction française naturelle avec « témoigner » sans effacer la relation étroite entre le témoignage et la confession.
theological_decisions:
- issue: Valeur du titre Χριστός
  choice: Jésus le Messie
  alternative: Jésus-Christ
  rationale: La traduction explicite le sens du titre grec sans en faire un simple élément de nom propre. La forme traditionnelle française est conservée en note.
- issue: Sens de ζῳογονοῦντος
  choice: qui donne la vie à toutes choses
  alternative: qui maintient toutes choses en vie
  rationale: Le participe grec permet les nuances de communication et de préservation de la vie. Le texte principal ne restreint pas l’action divine à la seule conservation, et la note préserve l’autre lecture.
- issue: Relation entre μαρτυρέω et ὁμολογία
  choice: qui a témoigné par la belle confession
  alternative: qui a témoigné la belle confession
  rationale: La construction grecque place « la belle confession » comme objet direct du verbe. Le français courant exige une légère explicitation; « par » maintient l’idée que la confession constitue le témoignage, tandis que la note donne la forme plus littérale.
- issue: Sens de ἐπί avec Ponce Pilate
  choice: devant Ponce Pilate
  alternative: sous Ponce Pilate
  rationale: La lecture locale et judiciaire correspond bien au procès, mais la possibilité d’un repère temporel ou administratif est réelle et reste signalée.
translation_notes:
  register: Français international moderne, soutenu sans être archaïque. « Solennelle instruction » restitue le poids de l’adjuration; « Jésus le Messie » rend explicitement le titre; « belle confession » conserve le vocabulaire confessionnel et le lien avec le contexte immédiat.
