  rationale: La révision rend la directive solennelle de παραγγέλλω par « Je t’ordonne » et conserve la syntaxe ouverte qui se poursuit au verset suivant. Elle supprime la préposition instrumentale « par », non justifiée par le grec, au profit de « a fait la belle confession », expression française claire et fidèle à l’objet direct du verbe ainsi qu’au vocabulaire de 1 Timothée 6. La note c conserve prudemment l’ambiguïté de ἐπί avec le génitif.
