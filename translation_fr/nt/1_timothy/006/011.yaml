id: 1TI.6.11
reference: 1 Timothy 6:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Σὺ δέ, ὦ ἄνθρωπε ⸀θεοῦ, ταῦτα φεῦγε· δίωκε δὲ δικαιοσύνην, εὐσέβειαν, πίστιν, ἀγάπην, ὑπομονήν, ⸀πραϋπαθίαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/011.yaml
  text: But you[a], man of God, flee these things; but pursue righteousness, godliness, faith, love, steadfastness[c][b], gentleness.
translation:
  language: fr
  text: Mais toi, homme de Dieu, fuis ces choses ; recherche plutôt la justice[a], la piété, la foi[b], l’amour, la persévérance et la douceur patiente[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « la droiture ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « la fidélité » ou « la confiance ».'
    reason: lexical_alternative
  - marker: c
    text: Le rare terme grec peut aussi être rendu par « douceur », « mansuétude » ou « patience indulgente ».
    reason: lexical_alternative
lexical_decisions:
- source_word: Σὺ δέ
  choice: Mais toi
  rationale: Rend le pronom emphatique et le contraste marqué avec ce qui précède, dans un français naturel.
- source_word: ὦ ἄνθρωπε θεοῦ
  choice: homme de Dieu
  rationale: Conserve l’adresse biblique reconnue ainsi que le masculin singulier visant directement Timothée.
- source_word: ταῦτα φεῦγε
  choice: fuis ces choses
  rationale: Préserve la force de l’impératif et son renvoi aux erreurs et aux vices mentionnés auparavant.
- source_word: δίωκε δὲ
  choice: recherche plutôt
  rationale: Exprime l’effort actif demandé par δίωκε et le contraste avec « fuis », sans répéter lourdement « mais ».
- source_word: δικαιοσύνην
  choice: la justice
  rationale: En français biblique moderne, « justice » couvre naturellement la rectitude morale et relationnelle de δικαιοσύνη ; une autre nuance est signalée en note.
- source_word: εὐσέβειαν
  choice: l’attachement à Dieu
  rationale: Rend de façon intelligible la vie de respect et de dévouement envers Dieu, sans l’archaïsme possible de « piété ».
- source_word: πίστιν
  choice: la foi
  rationale: Traduction première de πίστις, tout en maintenant en note les sens plausibles de confiance et de fidélité dans cette liste de vertus.
- source_word: ἀγάπην
  choice: l’amour
  rationale: Équivalent courant, clair et adéquat dans une liste de vertus.
- source_word: ὑπομονήν
  choice: la persévérance
  rationale: Évoque la constance durable dans l’épreuve et évite de réduire le terme à une patience passive.
- source_word: πραϋπαθίαν
  choice: la douceur patiente
  rationale: Ce terme grec rare associe douceur, maîtrise de soi et endurance ; cette expression conserve mieux cette combinaison que « douceur » seule.
theological_decisions:
- issue: Adresse genrée ὦ ἄνθρωπε θεοῦ
  choice: homme de Dieu
  alternative: personne de Dieu
  rationale: Le grec est masculin singulier et s’adresse à Timothée ; le neutraliser effacerait un trait réel du texte.
- issue: Portée de δικαιοσύνη
  choice: justice
  alternative: droiture
  rationale: « Justice » est l’équivalent français établi et peut inclure ici la conduite juste ; « droiture » explicite la nuance morale plausible sans l’imposer au texte principal.
- issue: Sens de πίστις dans une liste de vertus
  choice: foi
  alternative: fidélité ou confiance
  rationale: Le contexte permet la foi, la confiance ou la fidélité personnelle ; la note conserve cette ambiguïté au lieu de la trancher.
- issue: Nuance du rare πραϋπαθία
  choice: douceur patiente
  alternative: douceur, mansuétude ou patience indulgente
  rationale: Le composé rare semble unir douceur et retenue patiente ; aucune traduction française unique n’en épuise le sens.
translation_notes:
  register: Français international moderne, digne et directement compréhensible. La structure oppose nettement « fuis » à « recherche plutôt ». Les articles sont répétés pour donner à la liste une cadence française naturelle. « Attachement à Dieu » privilégie la clarté contemporaine, tandis que « douceur patiente » rend la nuance particulière du dernier terme grec.
