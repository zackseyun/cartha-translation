id: 1TI.6.4
reference: 1 Timothy 6:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τετύφωται, μηδὲν ἐπιστάμενος, ἀλλὰ νοσῶν περὶ ζητήσεις καὶ λογομαχίας, ἐξ ὧν γίνεται φθόνος, ἔρις, βλασφημίαι, ὑπόνοιαι πονηραί,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/004.yaml
  text: he is puffed up[a], understanding nothing, but sick with a craving for controversies and word-battles, from which come envy, strife, slanders, and evil suspicions[c][b],
translation:
  language: fr
  text: il est gonflé d’orgueil[a] et ne comprend rien. Il a une passion maladive pour les controverses et les querelles de mots[b], d’où naissent l’envie, les disputes, les paroles diffamatoires[c] et les mauvais soupçons.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «il est devenu prétentieux». Le grec évoque littéralement quelqu’un qui est gonflé, enflé d’orgueil.
    reason: lexical_alternative
  - marker: b
    text: Ou «les disputes à propos de mots».
    reason: lexical_alternative
  - marker: c
    text: Ici, le terme grec désigne probablement des propos injurieux ou diffamatoires envers des personnes; dans d’autres contextes, il peut signifier «blasphèmes».
    reason: lexical_alternative
lexical_decisions:
- source_word: τετύφωται
  choice: il est gonflé d’orgueil
  rationale: Le parfait exprime un état résultant, et cette formulation conserve l’image grecque de l’enflure tout en explicitant qu’il s’agit d’orgueil.
- source_word: μηδὲν ἐπιστάμενος
  choice: et ne comprend rien
  rationale: La tournure rend naturellement le participe grec et souligne l’absence réelle de compréhension.
- source_word: νοσῶν
  choice: Il a une passion maladive
  rationale: Cette expression française conserve la métaphore de la maladie tout en indiquant clairement son sens figuré.
- source_word: περὶ ζητήσεις
  choice: pour les controverses
  rationale: Dans les Pastorales, ζητήσεις désigne fréquemment des débats spéculatifs ou des controverses; «pour» convient naturellement avec «passion».
- source_word: λογομαχίας
  choice: les querelles de mots
  rationale: Le choix restitue les deux éléments du composé grec et sa dimension conflictuelle dans un français courant.
- source_word: ἐξ ὧν γίνεται
  choice: d’où naissent
  rationale: Cette formulation marque clairement que les vices énumérés résultent des controverses et des querelles de mots.
- source_word: φθόνος
  choice: l’envie
  rationale: Le terme désigne ici le ressentiment devant le bien d’autrui plutôt que la jalousie au sens large.
- source_word: ἔρις
  choice: les disputes
  rationale: Le pluriel naturel en français exprime les conflits et dissensions produits par ces débats.
- source_word: βλασφημίαι
  choice: les paroles diffamatoires
  rationale: Dans cette liste de fautes relationnelles, le mot vise vraisemblablement des propos injurieux ou attentatoires à la réputation, sans imposer le sens religieux de «blasphèmes».
- source_word: ὑπόνοιαι πονηραί
  choice: les mauvais soupçons
  rationale: Traduction directe, idiomatique et moralement marquée de l’expression grecque.
theological_decisions:
- issue: Référent de βλασφημίαι
  choice: paroles diffamatoires envers des personnes
  alternative: blasphèmes contre Dieu
  rationale: Le contexte immédiat décrit les effets interpersonnels de querelles; le sens plus large du terme est toutefois signalé en note afin de préserver l’ambiguïté lexicale.
translation_notes:
  register: Français international moderne, digne et accessible. La métaphore vive de l’enflure est conservée en l’explicitant par «d’orgueil»; celle de la maladie est rendue par «passion maladive». La phrase est divisée en deux pour une lecture naturelle sans modifier les rapports logiques du grec.
