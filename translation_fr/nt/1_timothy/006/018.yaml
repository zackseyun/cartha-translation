  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγαθοεργεῖν
  choice: fassent le bien
  rationale: L’expression rend directement la valeur verbale de l’infinitif et s’intègre naturellement à l’ordre introduit dans le verset précédent.
- source_word: πλουτεῖν
  choice: soient riches
  rationale: Cette formulation conserve l’image délibérée de la richesse et son contraste avec la richesse matérielle du contexte.
- source_word: ἐν ἔργοις καλοῖς
  choice: en belles œuvres
  rationale: « Belles œuvres » exprime ici des actes moralement bons et dignes d’approbation, tout en conservant la distinction lexicale entre ἀγαθός et καλός dans la même proposition.
- source_word: εὐμεταδότους
  choice: généreux
  rationale: L’adjectif désigne la disposition à donner volontiers; « généreux » est idiomatique et clair en français moderne.
- source_word: κοινωνικούς
  choice: prêts à partager
  rationale: La formule rend la disposition active au partage sans introduire les connotations modernes potentiellement trompeuses de « communautaires ».
- source_word: εὐμεταδότους εἶναι, κοινωνικούς
  choice: généreux et prêts à partager
  rationale: 'Les deux qualités voisines mais distinctes sont maintenues: la première souligne la générosité dans le don, la seconde la volonté de mettre ses biens en commun avec autrui.'
