id: 1TI.6.14
reference: 1 Timothy 6:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τηρῆσαί σε τὴν ἐντολὴν ἄσπιλον ἀνεπίλημπτον μέχρι τῆς ἐπιφανείας τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/014.yaml
  text: that you keep the commandment unstained and above reproach until the appearing of our Lord Jesus the Messiah[c][b][a],
translation:
  language: fr
  text: de garder le commandement sans tache et irréprochable[a] jusqu’à la manifestation de notre Seigneur Jésus le Messie[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La formulation grecque, très resserrée, peut faire porter « sans tache et irréprochable » soit sur le commandement, soit sur la manière dont Timothée doit le garder.
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « Jésus-Christ ». Le titre grec Χριστός peut être traduit selon son sens par « le Messie » ou rendu sous sa forme traditionnelle « Christ ».'
    reason: alternative_reading
lexical_decisions:
- source_word: τηρῆσαί
  choice: garder
  rationale: L’infinitif dépend de l’exhortation du verset précédent. « Garder » exprime ici l’obéissance fidèle et durable sans réduire le sens à la simple observation ni à la protection défensive.
- source_word: τὴν ἐντολήν
  choice: le commandement
  rationale: Le singulier défini renvoie vraisemblablement à l’ordre apostolique donné dans le contexte. « Commandement » en conserve le poids moral et solennel.
- source_word: ἄσπιλον
  choice: sans tache
  rationale: Cette expression française naturelle rend l’idée d’absence de souillure ou de défaut tout en permettant la construction compacte du grec.
- source_word: ἀνεπίλημπτον
  choice: irréprochable
  rationale: Le terme désigne ce qui ne donne prise à aucun reproche légitime. « Irréprochable » est précis, actuel et adapté au registre solennel.
- source_word: μέχρι
  choice: jusqu’à
  rationale: Marque la durée qui s’étend jusqu’à l’événement futur mentionné.
- source_word: τῆς ἐπιφανείας
  choice: la manifestation
  rationale: Le mot désigne ici la venue future et visible de Jésus. « Manifestation » évite les connotations modernes parfois trompeuses d’« apparition » et n’ajoute pas explicitement l’idée de retour.
- source_word: τοῦ κυρίου ἡμῶν
  choice: de notre Seigneur
  rationale: Rend directement le titre christologique κύριος et le possessif pluriel.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jésus le Messie
  rationale: Dans ce contexte eschatologique solennel, Χριστός conserve une force titulaire perceptible. « Le Messie » en communique le sens en français naturel, tandis que « Christ » reste une traduction traditionnelle possible.
theological_decisions:
- issue: Rapport de « sans tache et irréprochable » avec le commandement et avec la conduite de Timothée
  choice: 'Conserver la formulation grecque compacte : « garder le commandement sans tache et irréprochable »'
  alternative: Expliciter que Timothée doit lui-même demeurer sans tache et irréprochable en gardant le commandement
  rationale: Les adjectifs s’accordent grammaticalement avec « commandement », mais la formulation peut aussi caractériser la manière dont Timothée le garde. Le texte principal et la note préservent cette tension au lieu de la résoudre.
- issue: Valeur de Χριστοῦ dans Ἰησοῦ Χριστοῦ
  choice: le Messie
  alternative: Christ
  rationale: Le contexte de la manifestation future favorise l’audibilité du titre messianique, mais la forme traditionnelle plus proche d’un nom propre demeure possible.
translation_notes:
  register: Français international moderne, clair et digne. La phrase reste liée syntaxiquement au verset précédent par l’infinitif « de garder ». « Manifestation » appartient à un registre soutenu mais courant dans le discours biblique et évite de suggérer une apparition spectrale.
