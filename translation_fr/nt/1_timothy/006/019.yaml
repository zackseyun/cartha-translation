id: 1TI.6.19
reference: 1 Timothy 6:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀποθησαυρίζοντας ἑαυτοῖς θεμέλιον καλὸν εἰς τὸ μέλλον, ἵνα ἐπιλάβωνται τῆς ⸀ὄντως ζωῆς.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/019.yaml
  text: storing up for themselves a good foundation for the future[a], so that they may take hold of the life that is truly life.
translation:
  language: fr
  text: mettant ainsi en réserve pour eux-mêmes un bon fondement pour l’avenir, afin de saisir la vie véritable[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « la vie qui est réellement la vie » ou « la vie qui est vraiment vie ».'
    reason: La note conserve l’emphase inhabituelle de ὄντως appliqué à ζωή, que « la vie véritable » rend de façon plus idiomatique.
lexical_decisions:
- source_word: ἀποθησαυρίζοντας
  choice: mettant ainsi en réserve
  rationale: Le participe présent poursuit l’exhortation du verset précédent. « Mettre en réserve » conserve l’idée d’accumuler un trésor sans recourir à une tournure archaïque; « ainsi » explicite légèrement le lien avec les actes mentionnés auparavant.
- source_word: ἑαυτοῖς
  choice: pour eux-mêmes
  rationale: Le datif réfléchi indique que cette mise en réserve se fait à leur propre avantage.
- source_word: θεμέλιον καλὸν
  choice: un bon fondement
  rationale: Cette formulation conserve la métaphore architecturale de θεμέλιον et rend καλόν dans son sens de bon, solide et digne.
- source_word: εἰς τὸ μέλλον
  choice: pour l’avenir
  rationale: La formule reste ouverte à ce qui vient, y compris sa portée eschatologique contextuelle, sans introduire explicitement « le monde à venir » ou « l’âge à venir », absents du grec.
- source_word: ἵνα
  choice: afin de
  rationale: Rend clairement la relation de but exprimée par ἵνα dans un registre français courant et digne.
- source_word: ἐπιλάβωνται
  choice: saisir
  rationale: Le verbe conserve l’image vive de prendre fermement possession de quelque chose, plutôt que de l’affaiblir en « obtenir ».
- source_word: τῆς ὄντως ζωῆς
  choice: la vie véritable
  rationale: ὄντως signifie « réellement, véritablement ». « La vie véritable » est naturelle en français et maintient le contraste qualitatif; la formulation plus formelle est donnée en note.
theological_decisions:
- issue: Portée temporelle de εἰς τὸ μέλλον
  choice: pour l’avenir
  alternative: pour ce qui est à venir; pour l’âge à venir
  rationale: Le contexte autorise une résonance eschatologique, mais l’expression grecque ne nomme pas explicitement un « âge ». La traduction laisse donc cette portée ouverte.
- issue: Expression de τῆς ὄντως ζωῆς
  choice: la vie véritable
  alternative: la vie qui est réellement la vie
  rationale: Le texte distingue la vie authentique de la sécurité apparente procurée par les richesses. La traduction principale demeure naturelle sans définir davantage cette vie ni résoudre la tension théologique; la note préserve la forme emphatique du grec.
translation_notes:
  register: Français international moderne, clair et digne. La métaphore mixte du texte grec — mettre en réserve un fondement — est conservée plutôt que lissée. Le fragment participial reste syntaxiquement lié au contexte précédent, conformément au verset source.
