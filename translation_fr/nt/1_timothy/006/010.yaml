  source_fidelity: La première proposition rend fidèlement ῥίζα ... πάντων τῶν κακῶν par « une racine de toutes sortes de maux ». En revanche, « Pour l’avoir convoité » a pour antécédent grammatical « l’amour de l’argent » et signifie donc qu’ils auraient convoité cet amour, alors que ἧς renvoie grammaticalement à φιλαργυρία mais que ὀρεγόμενοι exprime l’aspiration avide vers l’argent/la richesse visée. « Dans leur désir d’argent » restitue le sens sans produire cette incohérence française.
  naturalness: Le français est globalement moderne et soutenu. « Certains, dans leur désir d’argent » est plus idiomatique et plus clair que « Pour l’avoir convoité ». « Se sont eux-mêmes transpercés de bien des douleurs » conserve l’image délibérément forte du grec dans une formulation recevable.
  terminology: « L’amour de l’argent », « une racine », « toutes sortes de maux » et « la foi » sont des choix précis et compatibles avec le registre. La note sur « la foi » préserve de façon appropriée la probabilité du sens objectif, sans l’imposer excessivement dans le texte.
