source:
  edition: SBLGNT
  text: ῥίζα γὰρ πάντων τῶν κακῶν ἐστιν ἡ φιλαργυρία, ἧς τινες ὀρεγόμενοι ἀπεπλανήθησαν ἀπὸ τῆς πίστεως καὶ ἑαυτοὺς περιέπειραν ὀδύναις πολλαῖς.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/010.yaml
  text: For the love of money is a root of all kinds of evils[a]; by craving it[c][b], some have wandered away from the faith and pierced themselves with many pains.
translation:
  language: fr
  text: Car l’amour de l’argent est une racine de toutes sortes de maux[a]. Certains, dans leur désir d’argent, se sont égarés loin de la foi[b] et se sont eux-mêmes transpercés de bien des douleurs[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, selon la traduction traditionnelle : « Car l’amour de l’argent est la racine de tous les maux. » Le grec se comprend plus naturellement comme désignant une source de toutes sortes de maux, sans nécessairement présenter l’amour de l’argent comme l’unique cause de tout mal.'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « se sont détournés de la foi ». Ici, « la foi » désigne probablement la foi chrétienne reconnue et confessée.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « de bien des tourments » ou « de bien des chagrins ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ῥίζα
  choice: une racine
  rationale: Le nom attribut ῥίζα est sans article et précède le verbe ; « une racine » exprime naturellement que l’amour de l’argent est une source de maux, sans en faire nécessairement l’unique source.
- source_word: πάντων τῶν κακῶν
  choice: de toutes sortes de maux
  rationale: Cette formulation française rend la portée large du pluriel grec tout en évitant de suggérer que chaque mal sans exception aurait une seule cause.
- source_word: φιλαργυρία
  choice: l’amour de l’argent
  rationale: Le terme désigne précisément l’attachement ou l’amour de l’argent ; cette traduction conserve l’image lexicale et reste plus précise que « cupidité ».
- source_word: ἧς τινες ὀρεγόμενοι
  choice: Pour l’avoir convoité, certains
  rationale: Le pronom relatif renvoie à φιλαργυρία, mais le désir porte naturellement sur l’argent impliqué dans cette expression. « Convoiter » restitue l’intensité de ὀρέγομαι et « pour l’avoir convoité » exprime le lien circonstanciel avec l’égarement.
- source_word: ἀπεπλανήθησαν ἀπὸ τῆς πίστεως
  choice: se sont égarés loin de la foi
  rationale: La tournure conserve l’image d’un éloignement par rapport à la foi et rend naturellement en français la valeur du passif grec sans imposer explicitement un agent extérieur.
- source_word: πίστεως
  choice: la foi
  rationale: L’article et l’usage des Pastorales permettent de comprendre ici la foi chrétienne comme réalité reconnue et partagée, tout en conservant en français la formulation « la foi », qui n’exclut pas entièrement la dimension de confiance personnelle.
- source_word: περιέπειραν
  choice: se sont transpercés eux-mêmes
  rationale: Le verbe est très imagé et signifie percer de part en part. « Se sont transpercés eux-mêmes » préserve à la fois la vigueur de l’image et le pronom réfléchi emphatique.
- source_word: ὀδύναις πολλαῖς
  choice: de bien des douleurs
  rationale: ὀδύνη couvre la douleur, la détresse et le tourment. « Bien des douleurs » conserve cette amplitude sans limiter le sens aux seuls chagrins émotionnels.
theological_decisions:
- issue: Portée de l’affirmation sur l’amour de l’argent et les maux
  choice: « une racine de toutes sortes de maux »
  alternative: « la racine de tous les maux »
  rationale: L’absence d’article devant ῥίζα favorise une formulation indéfinie, et le pluriel πάντων τῶν κακῶν se prête à une expression distributive. Le texte présente donc l’amour de l’argent comme une source produisant toutes sortes de maux, sans affirmer sans ambiguïté qu’il est l’unique origine de tout mal.
- issue: Sens de τῆς πίστεως
  choice: « la foi », probablement au sens de la foi chrétienne
  alternative: « la foi » au sens premier de confiance personnelle
  rationale: Dans les épîtres pastorales, l’expression articulée désigne souvent la foi chrétienne confessée. La traduction française conserve toutefois la formulation du grec et la note signale la nuance plutôt que de la développer dans le corps du verset.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme en deux phrases évite une période trop lourde. Les images fortes d’égarement et de transpercement sont maintenues, tandis que les notes préservent les principales possibilités lexicales et syntaxiques.
