id: 1TI.6.8
reference: 1 Timothy 6:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἔχοντες δὲ διατροφὰς καὶ σκεπάσματα, τούτοις ἀρκεσθησόμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/008.yaml
  text: But if we have food and covering[a], we will be content with these.
translation:
  language: fr
  text: Mais si nous avons de quoi nous nourrir et nous couvrir[a], nous nous en contenterons.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des vêtements » ; le terme grec peut désigner plus largement ce qui couvre une personne, peut-être aussi un abri.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔχοντες
  choice: si nous avons
  rationale: Le participe est circonstanciel. La tournure conditionnelle « si nous avons » est naturelle en français et préserve la nuance générale sans lui donner la valeur causale plus forte de « puisque nous avons ».
- source_word: δὲ
  choice: Mais
  rationale: La conjonction marque ici une légère opposition ou une progression par rapport à ce qui précède ; « Mais » rend clairement ce lien sans le renforcer excessivement.
- source_word: διατροφὰς
  choice: de quoi nous nourrir
  rationale: Le nom désigne les moyens de subsistance, particulièrement la nourriture. Cette expression est idiomatique en français et convient à l'idée des besoins essentiels.
- source_word: σκεπάσματα
  choice: de quoi nous couvrir
  rationale: Le terme désigne ce qui couvre. Cette formulation conserve une certaine largeur de sens, au lieu de limiter explicitement la référence aux seuls vêtements ou au seul logement.
- source_word: τούτοις
  choice: nous en
  rationale: Le pronom « en » renvoie naturellement en français aux nécessités qui viennent d'être mentionnées, tout en évitant la tournure plus lourde « de ces choses ».
- source_word: ἀρκεσθησόμεθα
  choice: nous nous en contenterons
  rationale: Le futur exprime ici le fait de trouver ces choses suffisantes. Le futur de l'indicatif est conservé, sans transformer la phrase en exhortation (« contentons-nous-en »).
theological_decisions:
- issue: Portée de σκεπάσματα
  choice: 'Formulation large : « de quoi nous couvrir »'
  alternative: « des vêtements » seulement, ou « un logement » seulement
  rationale: Le mot grec peut désigner ce qui couvre une personne et son contexte précis est discuté. La traduction maintient cette amplitude afin de ne pas restreindre artificiellement l'enseignement sur le contentement à une seule catégorie de nécessité.
translation_notes:
  register: Français international moderne, simple et digne. La construction « de quoi nous nourrir et nous couvrir » est naturelle pour un large lectorat, tandis que le futur « nous nous en contenterons » respecte la forme verbale grecque et maintient la tension entre constat et engagement.
