id: 1TI.5.7
reference: 1 Timothy 5:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ταῦτα παράγγελλε, ἵνα ἀνεπίλημπτοι ὦσιν·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/007.yaml
  text: And command these things[b][a], so that they may be above reproach.
translation:
  language: fr
  text: Et prescris ces directives[a], afin qu’on ne puisse rien leur reprocher[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « donne ces instructions » ou « ordonne » ; le verbe grec exprime une instruction donnée avec autorité.
    reason: lexical_alternative
  - marker: b
    text: Le référent pluriel de « leur » n’est pas exprimé en grec. Dans le contexte, il s’agit probablement des personnes concernées par les instructions précédentes, notamment les veuves et leurs familles.
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ
  choice: aussi
  rationale: Marque la continuité avec les consignes précédentes; « aussi » rend naturellement la coordination en français sans lui ajouter une forte emphase.
- source_word: ταῦτα
  choice: ces directives
  rationale: Le démonstratif neutre pluriel renvoie aux consignes qui précèdent. « Ces directives » est plus naturel ici que le calque « ces choses », tout en conservant la référence plurielle.
- source_word: παράγγελλε
  choice: donne … ces directives
  rationale: L’impératif présent exprime une instruction revêtue d’autorité et appelée à être maintenue. Cette tournure française garde cette force sans la durcir inutilement.
- source_word: ἵνα
  choice: afin que
  rationale: Introduit la visée des directives et rend clairement la valeur finale de la proposition.
- source_word: ἀνεπίλημπτοι
  choice: irréprochables
  rationale: Désigne des personnes qui ne donnent prise à aucun reproche légitime. « Irréprochables » est concis, digne et n’implique pas nécessairement une perfection absolue.
- source_word: ὦσιν
  choice: qu’ils soient
  rationale: Le subjonctif présent après ἵνα est naturellement rendu par le subjonctif français après « afin que ». Le masculin pluriel fonctionne comme forme non marquée sans préciser le référent implicite.
theological_decisions:
- issue: Référent du sujet pluriel implicite de ὦσιν
  choice: Le texte principal conserve le pronom générique « ils » sans nommer le groupe visé.
  alternative: Les veuves et leurs familles mentionnées dans le contexte immédiat; ou, plus largement, Timothée et la communauté.
  rationale: Le grec ne formule pas explicitement le sujet pluriel. Le contexte favorise les personnes concernées par les instructions précédentes, notamment les veuves et leurs familles, mais préciser ce référent dans le texte principal lèverait une ambiguïté réelle.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation évite le calque peu idiomatique « commande ces choses », tout en préservant l’autorité de l’impératif et l’ambiguïté du sujet pluriel.
