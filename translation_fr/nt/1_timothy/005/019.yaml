source:
  edition: SBLGNT
  text: κατὰ πρεσβυτέρου κατηγορίαν μὴ παραδέχου, ἐκτὸς εἰ μὴ ἐπὶ δύο ἢ τριῶν μαρτύρων·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/019.yaml
  text: Do not accept an accusation against an elder[b][a], except on the basis of two or three witnesses.
translation:
  language: fr
  text: N’accepte pas d’accusation contre un ancien[a], sauf si elle est étayée par le témoignage de deux ou trois témoins[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un homme âgé », si πρεσβυτέρου est compris comme une indication d’âge plutôt que comme la désignation d’un responsable de l’Église.
    reason: alternative_reading
  - marker: b
    text: Cette formulation reprend le principe juridique de l’Ancien Testament selon lequel une affaire est établie sur la déposition de « deux ou trois témoins » (voir Deutéronome 19.15).
    reason: cross_reference
lexical_decisions:
- source_word: κατὰ πρεσβυτέρου
  choice: contre un ancien
  rationale: Dans le contexte immédiat des instructions concernant les responsables de l’Église, πρεσβύτερος désigne très probablement un ancien. Le mot peut toutefois désigner un homme âgé, possibilité signalée en note.
- source_word: κατηγορίαν
  choice: d’accusation
  rationale: Le nom désigne une accusation, éventuellement formelle. « Accusation » conserve la portée judiciaire tout en restant naturel en français moderne.
- source_word: μὴ παραδέχου
  choice: N’accepte pas
  rationale: L’impératif interdit de recevoir ou de prendre en considération l’accusation. « N’accepte pas » exprime clairement cette consigne procédurale.
- source_word: ἐκτὸς εἰ μὴ
  choice: si elle ne
  rationale: Dans cette construction exceptive, la formulation française « si elle ne repose pas » rend naturellement le sens de « sauf si » sans alourdir la phrase.
- source_word: ἐπὶ δύο ἢ τριῶν μαρτύρων
  choice: repose sur deux ou trois témoins
  rationale: ἐπί marque ici le fondement probatoire. « Repose sur » préserve l’idée qu’une accusation ne peut être reçue que sur la base de deux ou trois témoins et fait écho au principe juridique de Deutéronome 19.15.
theological_decisions:
- issue: Sens de πρεσβυτέρου dans le contexte ecclésial
  choice: ancien, au sens de responsable de l’Église
  alternative: homme âgé
  rationale: Le contexte immédiat de 1 Timothée 5, consacré notamment aux anciens et à leur discipline, favorise le sens de responsable ecclésial. L’autre sens lexical réel est conservé en note afin de ne pas effacer l’ambiguïté.
translation_notes:
  register: Français international moderne, digne et direct. La syntaxe reste naturelle tout en conservant le ton procédural et judiciaire du grec. Les marqueurs de notes suivent l’élément précis qu’ils expliquent.
