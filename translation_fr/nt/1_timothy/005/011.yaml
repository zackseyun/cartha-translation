  text: νεωτέρας δὲ χήρας παραιτοῦ· ὅταν γὰρ καταστρηνιάσωσιν τοῦ Χριστοῦ, γαμεῖν θέλουσιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/011.yaml
  text: But refuse younger widows[a], for when they become sensual against the Messiah, they desire to marry[c][b],
translation:
  language: fr
  text: Mais refuse d’inscrire sur la liste les veuves plus jeunes[a], car, lorsqu’elles se laissent emporter par leurs désirs au détriment du Messie[b], elles veulent se marier.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « refuse les veuves plus jeunes ». Dans le contexte, il s’agit vraisemblablement de ne pas les inscrire sur la liste mentionnée au verset 9.'
    reason: contextual_clarification
  - marker: b
    text: Littéralement, le grec évoque le fait de « devenir sensuelles » ou « ardentes contre le Messie ». La relation exacte entre ces désirs et « le Messie » est difficile à préciser ; on peut aussi comprendre qu’elles se laissent emporter par leurs désirs en négligeant leur engagement envers lui.
    reason: lexical_alternative
lexical_decisions:
- source_word: νεωτέρας δὲ χήρας
  choice: Mais n’inscris pas les veuves plus jeunes sur la liste
  rationale: δέ marque le contraste avec les critères précédents. Dans ce contexte, παραιτοῦ concerne le refus d’admission sur la liste des veuves (v. 9), non un rejet personnel. « Plus jeunes » conserve la valeur comparative de νεωτέρας.
- source_word: ὅταν γὰρ
  choice: car lorsque
  rationale: Cette tournure garde à la fois la valeur explicative de γάρ et la valeur temporelle ou générale de ὅταν.
- source_word: καταστρηνιάσωσιν
  choice: leurs désirs les éloignent
  rationale: Le verbe rare évoque des impulsions sensuelles ou ardentes qui prennent le dessus. Cette formulation française actuelle en exprime la force sans employer un terme inutilement stigmatisant ni présenter le remariage lui-même comme le mal visé.
- source_word: τοῦ Χριστοῦ
  choice: du Messie
  rationale: Χριστός fonctionne ici comme un titre. La relation génitive avec le verbe est difficile; « les éloignent du Messie » rend naturellement l’idée d’un mouvement contraire à l’attachement envers lui, tout en signalant l’ambiguïté dans la note.
- source_word: γαμεῖν θέλουσιν
  choice: elles veulent se marier
  rationale: θέλω suivi de l’infinitif exprime simplement la volonté ou le désir. « Veulent se marier » est naturel, clair et fidèle.
theological_decisions:
- issue: Portée de παραιτοῦ envers les veuves plus jeunes
  choice: ne les inscris pas sur la liste
  alternative: refuse les veuves plus jeunes
  rationale: Le contexte immédiat traite de l’inscription des veuves. Expliciter la liste évite de laisser croire à une exclusion générale de la communauté.
- issue: Sens de καταστρηνιάσωσιν τοῦ Χριστοῦ
  choice: leurs désirs les éloignent du Messie
  alternative: elles se laissent emporter par leurs désirs au détriment du Messie
  rationale: La construction peut décrire des désirs sensuels entrant en conflit avec un engagement envers le Messie. Le texte principal reste concis et ne condamne pas en soi le désir de se remarier; la note préserve la difficulté de la construction grecque.
- issue: Rendu de Χριστοῦ
  choice: le Messie
  alternative: le Christ
  rationale: Le terme grec est ici compris comme un titre; « Messie » en conserve explicitement la portée.
translation_notes:
  register: Français international moderne, clair et digne. L’explicitation « sur la liste » s’appuie sur le contexte immédiat. La formulation évite l’archaïsme et la connotation fortement péjorative de « devenir débauchées », tout en conservant le conflit entre les désirs évoqués et l’attachement au Messie.
