  text: ἔχουσαι κρίμα ὅτι τὴν πρώτην πίστιν ἠθέτησαν·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/012.yaml
  text: incurring judgment because they have set aside their former faith[a].
translation:
  language: fr
  text: Elles encourent un jugement parce qu’elles ont rejeté leur première foi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leur premier engagement » ou « leur engagement antérieur ». Le mot grec peut signifier « foi », mais certains comprennent ici une promesse ou un engagement antérieur, probablement lié à l’inscription parmi les veuves.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔχουσαι
  choice: elles s’exposent ainsi à
  rationale: Le participe signifie littéralement « ayant », mais, avec κρίμα, cette formulation française exprime naturellement le fait d’encourir un jugement et rattache la proposition au contexte précédent.
- source_word: κρίμα
  choice: un jugement
  rationale: « Jugement » conserve la portée judiciaire et la gravité du terme sans préciser indûment qu’il s’agit de la condamnation éternelle ou d’une peine particulière.
- source_word: ὅτι
  choice: parce que
  rationale: La conjonction introduit ici la raison du jugement.
- source_word: τὴν πρώτην πίστιν
  choice: leur engagement premier
  rationale: Dans ce contexte, πίστις peut désigner la fidélité donnée ou un engagement antérieur, probablement lié à l’inscription parmi les veuves. « Engagement » s’accorde naturellement avec ἀθετέω, tandis que la traduction « leur foi première » est conservée en note afin de préserver l’ambiguïté réelle.
- source_word: ἠθέτησαν
  choice: ont rejeté
  rationale: ἀθετέω exprime l’action d’écarter, de répudier ou de rendre sans effet. « Rejeter un engagement » restitue clairement cette idée sans ajouter le vocabulaire technique d’un vœu rompu.
theological_decisions:
- issue: Sens de τὴν πρώτην πίστιν dans ce contexte
  choice: leur engagement premier
  alternative: leur foi première
  rationale: La proximité du passage sur l’inscription des veuves rend plausible le sens d’un engagement antérieur ou d’une fidélité promise. Toutefois, πίστις peut également désigner la foi; la note maintient donc explicitement cette autre lecture sans trancher la question de façon dogmatique.
translation_notes:
  register: Français international moderne, naturel et digne. « S’exposent ainsi à un jugement » rend idiomatiquement la construction participiale; « engagement premier » évite l’expression moins naturelle « premier engagement » tout en conservant la référence temporelle.
