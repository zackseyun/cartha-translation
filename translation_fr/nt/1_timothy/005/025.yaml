  source_fidelity: « De même » rend adéquatement ὡσαύτως καί dans un français fluide, sans qu’un « aussi » supplémentaire soit nécessaire. « Les bonnes œuvres sont manifestes » correspond précisément à τὰ ἔργα τὰ καλά πρόδηλα. « Celles pour lesquelles il en va autrement » maintient avec justesse l’indétermination de τὰ ἄλλως ἔχοντα, sans introduire « mauvaises » ni limiter le sens à des œuvres seulement non encore visibles. « Ne peuvent rester cachées » rend naturellement κρυβῆναι οὐ δύνανται et son implication contextuelle de dévoilement.
  naturalness: Le texte est clair, idiomatique et d’un registre moderne et digne. La reprise féminine « celles » a un antécédent immédiat et non ambigu, « les bonnes œuvres ». La formulation volontairement ouverte « pour lesquelles il en va autrement » est légèrement soutenue, mais naturelle et particulièrement appropriée pour préserver la concision ambiguë du grec.
  terminology: « Bonnes œuvres », « manifestes » et « cachées » sont établis, compréhensibles internationalement et cohérents avec le registre pastoral de l’épître. La note présente les possibilités sans transformer l’une d’elles en sens imposé.
