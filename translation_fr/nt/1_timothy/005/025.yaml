id: 1TI.5.25
reference: 1 Timothy 5:25
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὡσαύτως καὶ τὰ ⸂ἔργα τὰ καλὰ⸃ ⸀πρόδηλα, καὶ τὰ ἄλλως ἔχοντα κρυβῆναι οὐ δύνανται.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/025.yaml
  text: Likewise also[a], good works are evident, and those that are otherwise cannot remain hidden.
translation:
  language: fr
  text: De même, les bonnes œuvres sont manifestes, et celles pour lesquelles il en va autrement[a] ne peuvent rester cachées.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « celles qui sont différentes » ou « celles qui ne le sont pas » ; certains comprennent qu’il s’agit précisément des œuvres mauvaises, par analogie avec le verset précédent.
    reason: Signaler l’ambiguïté de τὰ ἄλλως ἔχοντα sans imposer une interprétation morale absente de la formulation grecque.
lexical_decisions:
- source_word: ὡσαύτως καί
  choice: De même
  rationale: Cette tournure française naturelle exprime le parallèle étroit avec le verset précédent. Le renforcement produit par καί est porté par l’ensemble de la construction plutôt que rendu par un « aussi » peu naturel ici.
- source_word: ἔργα τὰ καλά
  choice: les bonnes œuvres
  rationale: Rend directement la réalité concrète des ἔργα et leur qualité morale, tout en conservant une expression courante dans le vocabulaire paulinien.
- source_word: πρόδηλα
  choice: manifestes
  rationale: Exprime ce qui est patent ou clairement reconnaissable et prépare le contraste avec ce qui ne peut rester caché.
- source_word: τὰ ἄλλως ἔχοντα
  choice: celles pour lesquelles il en va autrement
  rationale: 'Cette formulation conserve l’indétermination de l’expression grecque : elle n’impose ni l’idée d’œuvres mauvaises ni celle, plus précise, d’œuvres bonnes qui ne seraient pas encore manifestes.'
- source_word: κρυβῆναι οὐ δύνανται
  choice: ne peuvent rester cachées
  rationale: Rend l’incapacité exprimée par δύνανται et fait ressortir l’idée contextuelle que ce qui est actuellement caché finira par être découvert.
theological_decisions:
- issue: 'La portée de τὰ ἄλλως ἔχοντα : œuvres mauvaises ou œuvres qui se présentent autrement'
  choice: Conserver une formulation générale et indéterminée
  alternative: Traduire explicitement par « les œuvres mauvaises » ou par « celles qui ne sont pas encore manifestes »
  rationale: Le grec ne contient pas d’adjectif signifiant « mauvais ». Le contexte peut suggérer cette lecture par analogie avec le verset précédent, mais il ne l’impose pas. La traduction maintient donc l’ambiguïté, et la note signale les principales compréhensions possibles.
translation_notes:
  register: Français international moderne, clair et digne. « Celles pour lesquelles il en va autrement » est volontairement plus ouvert que des formulations explicitant des œuvres mauvaises ou seulement des œuvres encore invisibles.
