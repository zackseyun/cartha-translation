  text: λέγει γὰρ ἡ γραφή· Βοῦν ἀλοῶντα οὐ φιμώσεις, καί· Ἄξιος ὁ ἐργάτης τοῦ μισθοῦ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/018.yaml
  text: For the Scripture says[a], “You shall not muzzle an ox while it is threshing,” and[b], “The laborer is worthy of his wages.”
translation:
  language: fr
  text: 'Car l’Écriture dit : « Tu ne muselleras pas le bœuf qui foule le grain », et : « L’ouvrier mérite son salaire. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει γὰρ ἡ γραφή
  choice: Car l’Écriture dit
  rationale: « Car » conserve le lien explicatif de γάρ avec le verset précédent. « L’Écriture » rend l’emploi déterminé de γραφή comme écrit sacré faisant autorité, et le présent « dit » exprime naturellement la permanence de son témoignage.
- source_word: Βοῦν
  choice: le bœuf
  rationale: Dans cette prescription générique, βοῦς désigne le bovin employé aux travaux agricoles. Le français idiomatique emploie l’article défini dans la formule proverbiale ou légale.
- source_word: ἀλοῶντα
  choice: qui foule le grain
  rationale: Le participe désigne le bœuf occupé à séparer le grain en le foulant. Cette formulation rend concrètement la pratique ancienne et évite l’impression qu’un animal effectuerait seul tout le processus exprimé par « battre ».
- source_word: οὐ φιμώσεις
  choice: Tu ne muselleras pas
  rationale: Le futur indicatif a ici une valeur prohibitive dans une citation légale. Le futur français conserve ce registre scripturaire avec naturel et précision.
- source_word: καί
  choice: et
  rationale: La conjonction coordonne simplement les deux citations; « et » en préserve la relation sans ajouter d’explication.
- source_word: Ἄξιος ὁ ἐργάτης
  choice: L’ouvrier mérite
  rationale: ἐργάτης désigne celui qui travaille. « L’ouvrier » est courant et digne; la tournure idiomatique « mérite » restitue ἄξιος sans le calque plus lourd « est digne de ».
- source_word: τοῦ μισθοῦ αὐτοῦ
  choice: son salaire
  rationale: μισθός désigne ici la rémunération due pour un travail, d’où « salaire » plutôt que le plus abstrait « récompense ». Le possessif singulier « son » correspond à αὐτοῦ et convient naturellement en français.
theological_decisions:
- issue: Portée de ἡ γραφή par rapport aux deux citations
  choice: Présenter les deux paroles à la suite de « l’Écriture dit » sans préciser davantage leur statut canonique respectif.
  alternative: Limiter explicitement l’appellation « Écriture » à la première citation et traiter la seconde comme un proverbe ou une parole de Jésus.
  rationale: La syntaxe place les deux citations sous une même formule introductive, mais la traduction ne doit pas en tirer une théorie détaillée du canon ni résoudre une question que le texte laisse ouverte.
- issue: Valeur générique du masculin singulier dans ὁ ἐργάτης et αὐτοῦ
  choice: Conserver le singulier sous la forme naturelle « l’ouvrier… son salaire ».
  alternative: Employer un pluriel épicène, par exemple « les personnes qui travaillent méritent leur salaire ».
  rationale: Le grec présente une maxime au masculin singulier générique. La formulation française retenue en conserve la forme et la concision sans élargissement interprétatif.
translation_notes:
  register: Français international moderne, clair et digne. La première citation garde une tonalité juridique scripturaire avec le futur prohibitif; la seconde est formulée comme une maxime concise. Aucune note n’est nécessaire, puisque « foule le grain » explicite suffisamment ἀλοῶντα et « salaire » rend directement μισθός.
