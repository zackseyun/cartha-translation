  text: Χήρα καταλεγέσθω μὴ ἔλαττον ἐτῶν ἑξήκοντα γεγονυῖα, ἑνὸς ἀνδρὸς γυνή,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/009.yaml
  text: Let a widow be enrolled only if she is not less than sixty years old[a], having been the wife of one husband,
translation:
  language: fr
  text: Qu’une veuve ne soit inscrite sur la liste que si elle a au moins soixante ans, ayant été la femme d’un seul mari[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « femme d’un seul homme ». L’expression peut désigner la fidélité conjugale ; certains la comprennent comme « n’ayant été mariée qu’une seule fois ».
    reason: alternative_reading
lexical_decisions:
- source_word: Χήρα
  choice: une veuve
  rationale: Sens courant du terme grec; le contexte concerne les veuves officiellement reconnues par la communauté.
- source_word: καταλεγέσθω
  choice: soit inscrite sur la liste
  rationale: Rend explicitement le sens administratif d’une inscription ou d’un enregistrement officiel.
- source_word: μὴ ἔλαττον ἐτῶν ἑξήκοντα γεγονυῖα
  choice: que si elle a au moins soixante ans
  rationale: Expression française naturelle du seuil d’âge minimal indiqué par le grec; γεγονυῖα marque ici l’âge atteint.
- source_word: ἑνὸς ἀνδρὸς γυνή
  choice: a été la femme d’un seul mari
  rationale: Rendu assez formel qui conserve l’idiome grec et son ambiguïté entre fidélité conjugale, réputation matrimoniale et fait de n’avoir été mariée qu’une fois.
theological_decisions:
- issue: Sens de ἑνὸς ἀνδρὸς γυνή
  choice: Conserver dans le texte l’expression « la femme d’un seul mari » sans trancher entièrement son sens.
  alternative: « fidèle à son mari » ou « n’ayant été mariée qu’une seule fois »
  rationale: La formule peut désigner la fidélité conjugale ou une conduite matrimoniale irréprochable, mais certains la comprennent comme une limitation à un seul mariage. Le grec ne tranche pas sans ambiguïté; la note maintient cette tension.
translation_notes:
  register: Français international moderne, clair et digne. « Inscrite sur la liste » explicite la portée administrative du verbe. La tournure principale reste formelle afin de préserver l’ambiguïté interprétative de l’idiome grec.
