  source_fidelity: Le sens administratif de καταλεγέσθω et le seuil minimal de soixante ans sont bien rendus. Toutefois, γεγονυῖα est un participe qui introduit la qualification finale ; « et a été » coordonne cette expression avec l’âge et affaiblit sa relation syntaxique avec le grec. « Ayant été » la restitue plus fidèlement sans lever l’ambiguïté de ἑνὸς ἀνδρὸς γυνή.
  naturalness: La formulation révisée demeure naturelle dans un français moderne de registre soutenu. « Ne soit inscrite sur la liste que si » rend clairement la restriction portée par l’impératif.
  terminology: « Veuve », « inscrite sur la liste » et « femme d’un seul mari » conviennent. La note est resserrée afin de ne pas étendre indûment l’expression à une « réputation irréprochable » générale, tout en conservant les principales interprétations.
