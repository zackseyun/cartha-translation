  text: Χήρας τίμα τὰς ὄντως χήρας.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/003.yaml
  text: Honor widows who are truly widows[a].
translation:
  language: fr
  text: Honore les veuves qui sont vraiment veuves[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Prends soin des veuves qui sont vraiment veuves. » Dans ce contexte, « honorer » comprend probablement une aide matérielle.'
    reason: Alternative lexicale et précision contextuelle sur la portée de τιμάω.
lexical_decisions:
- source_word: Χήρας
  choice: les veuves
  rationale: Le nom χήρα désigne directement des femmes dont le mari est mort. L’accusatif pluriel est le complément du verbe impératif.
- source_word: τίμα
  choice: Honore
  rationale: Le verbe τιμάω signifie « honorer, estimer, témoigner du respect ». Dans ce contexte, cet honneur comprend vraisemblablement une aide concrète, sans se réduire nécessairement au soutien matériel.
- source_word: τὰς ὄντως χήρας
  choice: qui sont réellement veuves
  rationale: La répétition de χήρας avec ὄντως établit une distinction entre les veuves en général et celles qui se trouvent véritablement dans la condition précisée par la suite. Cette formulation française conserve la qualification sans l’expliciter prématurément.
- source_word: ὄντως
  choice: réellement
  rationale: L’adverbe signifie « réellement, véritablement, effectivement » et marque ici une distinction concrète plutôt qu’une simple emphase.
theological_decisions:
- issue: Portée de τιμάω dans le contexte
  choice: Conserver « Honore », qui englobe le respect et peut inclure l’aide matérielle.
  alternative: « Prends soin des veuves » ou « Soutiens les veuves »
  rationale: Le contexte immédiat traite de la prise en charge concrète des veuves, mais le verbe grec a un sens plus large. La traduction principale évite donc de le réduire à l’assistance financière, tandis que la note signale cette dimension probable.
- issue: Sens de « réellement veuves »
  choice: Maintenir la formulation qualifiante du grec sans définir ici les critères.
  alternative: Expliciter « les veuves qui sont vraiment seules » ou « sans soutien »
  rationale: Les versets suivants précisent la situation visée. Introduire ces critères dans ce verset résoudrait une tension que la formulation grecque laisse encore ouverte.
translation_notes:
  register: Français international moderne, simple et digne. L’impératif singulier « Honore » correspond à l’adresse personnelle faite à Timothée. « Réellement veuves » conserve l’insistance et la distinction du grec, bien que la tournure soit volontairement marquée.
