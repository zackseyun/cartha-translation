source:
  edition: SBLGNT
  text: μηκέτι ὑδροπότει, ἀλλὰ οἴνῳ ὀλίγῳ χρῶ διὰ τὸν ⸀στόμαχον καὶ τὰς πυκνάς σου ἀσθενείας.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/023.yaml
  text: No longer drink only water[a], but use a little wine because of your stomach and your frequent illnesses.
translation:
  language: fr
  text: Ne bois plus seulement de l’eau[a], mais prends un peu de vin à cause de ton estomac et de tes fréquentes maladies.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « Ne sois plus un buveur d’eau. » Le sens est que Timothée ne doit pas continuer à boire exclusivement de l’eau.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μηκέτι
  choice: Ne continue pas à
  rationale: L’adverbe marque la cessation d’une pratique antérieure. Cette tournure exprime naturellement en français l’idée de ne plus poursuivre cette habitude.
- source_word: ὑδροπότει
  choice: boire seulement de l’eau
  rationale: Le verbe signifie littéralement « boire de l’eau » ou « être buveur d’eau ». Le contraste avec l’usage d’un peu de vin implique ici que Timothée buvait exclusivement de l’eau, non qu’il devait cesser d’en boire entièrement.
- source_word: ἀλλὰ
  choice: mais
  rationale: La conjonction introduit directement l’instruction opposée.
- source_word: οἴνῳ ὀλίγῳ
  choice: un peu de vin
  rationale: Le datif désigne ce dont Timothée doit faire usage, et ὀλίγῳ en limite explicitement la quantité.
- source_word: χρῶ
  choice: prends
  rationale: χράομαι signifie « se servir de, faire usage de ». Dans ce contexte de consommation à visée corporelle, « prends » est plus naturel en français que « utilise », sans ajouter l’idée d’un usage récréatif.
- source_word: διὰ
  choice: à cause de
  rationale: Avec l’accusatif, διά exprime ici la raison de la recommandation.
- source_word: στόμαχον
  choice: estomac
  rationale: Le terme anatomique courant rend directement le grec.
- source_word: πυκνάς
  choice: fréquents
  rationale: L’adjectif indique des occurrences répétées ou fréquentes.
- source_word: ἀσθενείας
  choice: malaises
  rationale: Le mot peut désigner des faiblesses, infirmités ou maladies. « Malaises » conserve une certaine amplitude et convient à des troubles corporels récurrents sans préciser un diagnostic absent du texte.
theological_decisions:
- issue: Faut-il expliciter que Timothée buvait exclusivement de l’eau ?
  choice: boire seulement de l’eau
  alternative: ne bois plus d’eau
  rationale: Le contraste avec « mais prends un peu de vin » indique qu’il ne s’agit pas d’interdire toute consommation d’eau, mais de mettre fin à une pratique exclusivement hydrique. L’explicitation évite un contresens en français.
- issue: Faut-il traduire οἶνος littéralement ou le généraliser en remède ?
  choice: vin
  alternative: boisson médicinale
  rationale: Le grec nomme explicitement le vin. Le traduire directement préserve le contenu du texte sans l’atténuer ni lui ajouter une qualification doctrinale ou culturelle.
- issue: Comment rendre ἀσθενείας sans surdéterminer la nature des troubles ?
  choice: malaises
  alternative: maladies
  rationale: Le terme grec possède une gamme allant de la faiblesse à la maladie. Dans ce contexte corporel, « malaises » reste naturel tout en évitant d’affirmer que des maladies précisément diagnostiquées sont visées.
translation_notes:
  register: Français international moderne, direct et digne. Le tutoiement correspond à l’adresse personnelle au singulier. La formulation conserve la modération exprimée par « un peu » et évite de présenter le vin autrement que comme la recommandation limitée du verset.
