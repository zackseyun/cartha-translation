source:
  edition: SBLGNT
  text: εἴ ⸀τις πιστὴ ἔχει χήρας, ⸀ἐπαρκείτω αὐταῖς, καὶ μὴ βαρείσθω ἡ ἐκκλησία, ἵνα ταῖς ὄντως χήραις ἐπαρκέσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/016.yaml
  text: If any believing woman has widows[a], let her provide for them, and let the church not be burdened, so that it may provide for those who are truly widows.
translation:
  language: fr
  text: Si une croyante[a] a des veuves, qu’elle les assiste ; que l’Église n’en soit pas chargée, afin qu’elle puisse assister celles qui sont vraiment veuves.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Certains manuscrits portent : « Si un croyant ou une croyante a des veuves », ou une formulation qui élargit l’instruction à tout croyant.'
    reason: textual_variant
lexical_decisions:
- source_word: τις πιστὴ
  choice: une croyante
  rationale: Dans le texte grec retenu, πιστή est au féminin singulier et désigne donc spécifiquement une femme chrétienne. « Croyante » exprime naturellement son appartenance à la foi chrétienne.
- source_word: ἔχει χήρας
  choice: a des veuves à sa charge
  rationale: Le verbe ἔχει signifie littéralement « a », mais le contexte porte sur des veuves liées à cette croyante et dont elle peut assurer le soutien. « À sa charge » rend cette relation pratique sans préciser indûment le lien familial.
- source_word: ἐπαρκείτω αὐταῖς
  choice: qu’elle leur vienne en aide
  rationale: ἐπαρκέω désigne ici une aide suffisante et concrète. « Venir en aide » est courant, digne et assez large pour inclure le soutien matériel sans le limiter à une seule forme.
- source_word: μὴ βαρείσθω ἡ ἐκκλησία
  choice: afin que l’Église n’ait pas à en porter le poids
  rationale: Le passif βαρείσθω évoque une charge pesant sur la communauté. Cette formulation française conserve l’image du poids tout en exprimant clairement l’obligation de soutien.
- source_word: ἡ ἐκκλησία
  choice: l’Église
  rationale: Dans ce contexte, ἐκκλησία désigne la communauté chrétienne locale. « Église » est le terme français usuel et immédiatement compréhensible.
- source_word: ταῖς ὄντως χήραις
  choice: celles qui sont réellement veuves
  rationale: 'ὄντως marque la catégorie déjà définie dans le chapitre : les veuves véritablement seules et dépourvues d’un soutien familial. La formulation préserve l’insistance grecque sans introduire explicitement cette explication dans le texte.'
- source_word: ἐπαρκέσῃ
  choice: puisse venir en aide
  rationale: La reprise de « venir en aide » conserve le lien lexical avec le premier emploi de ἐπαρκέω. Le subjonctif après ἵνα exprime le but ou le résultat recherché.
theological_decisions:
- issue: Genre du sujet dans la proposition initiale
  choice: 'Sujet féminin spécifique : « une croyante »'
  alternative: « un croyant ou une croyante » ou « une personne croyante », d’après d’autres traditions manuscrites
  rationale: Le texte SBLGNT fourni porte τις πιστή, avec l’adjectif au féminin singulier. Le texte principal respecte donc ce genre grammatical, tandis que la variante plus large est signalée en note.
- issue: Sens de « celles qui sont réellement veuves »
  choice: Conserver la formulation distinctive du grec
  alternative: 'Expliciter dans le texte : « les veuves qui n’ont vraiment personne pour les soutenir »'
  rationale: Le contexte du chapitre éclaire cette catégorie, mais le verset lui-même emploie une expression concise. La traduction préserve ainsi la tension et évite d’ajouter au texte une définition interprétative complète.
translation_notes:
  register: Français international moderne, clair et digne. « Croyante » respecte le féminin du texte retenu. La phrase a été légèrement restructurée avec « afin que » pour éviter une coordination lourde, tout en conservant le rapport de but exprimé par ἵνα. Le marqueur [a] figure dans le texte principal.
