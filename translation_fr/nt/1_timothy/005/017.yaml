source:
  edition: SBLGNT
  text: Οἱ καλῶς προεστῶτες πρεσβύτεροι διπλῆς τιμῆς ἀξιούσθωσαν, μάλιστα οἱ κοπιῶντες ἐν λόγῳ καὶ διδασκαλίᾳ·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/017.yaml
  text: Let the elders who lead well be considered worthy of double honor[c][b][a], especially those who labor in word and teaching.
translation:
  language: fr
  text: Que les anciens qui dirigent bien soient jugés dignes d’un double honneur[a], surtout[b] ceux qui se donnent beaucoup de peine dans la parole[c] et l’enseignement.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « jugés dignes d’un honneur double ». Cet honneur peut comprendre à la fois l’estime et un soutien matériel, notamment à la lumière du verset suivant.
    reason: lexical_alternative
  - marker: b
    text: « Surtout » peut aussi être compris, selon certains, au sens de « à savoir », désignant les anciens concernés comme ceux qui se donnent de la peine dans la parole et l’enseignement.
    reason: alternative_reading
  - marker: c
    text: « Dans la parole et l’enseignement » désigne vraisemblablement un ministère oral, tel que la prédication et l’instruction.
    reason: translation_explication
lexical_decisions:
- source_word: πρεσβύτεροι
  choice: anciens
  rationale: Dans les épîtres pastorales, le terme désigne des responsables reconnus de l’Église, et non simplement des hommes âgés. « Anciens » est courant en français biblique sans imposer une structure ecclésiastique ultérieure.
- source_word: καλῶς προεστῶτες
  choice: qui dirigent bien
  rationale: Le participe exprime ici l’exercice compétent d’une responsabilité ou d’une direction. « Dirigent bien » est naturel et conserve l’idée d’autorité sans la dureté possible de « gouvernent ».
- source_word: διπλῆς τιμῆς
  choice: d’un double honneur
  rationale: Cette formulation proche du grec préserve l’ambiguïté de τιμή, qui peut englober l’estime et, à la lumière du verset suivant, un soutien matériel.
- source_word: ἀξιούσθωσαν
  choice: soient jugés dignes
  rationale: Le passif impératif demande à la communauté de reconnaître leur valeur. « Soient jugés dignes » restitue clairement cette évaluation.
- source_word: μάλιστα
  choice: surtout
  rationale: « Surtout » marque naturellement en français la mise en relief d’un groupe particulier, sans imposer le sens appositionnel « à savoir ».
- source_word: κοπιῶντες
  choice: ceux qui se donnent beaucoup de peine
  rationale: κοπιάω souligne un effort intense et pénible. Cette expression française actuelle rend mieux cette intensité que le simple verbe « travailler ».
- source_word: ἐν λόγῳ
  choice: dans la prédication
  rationale: Dans ce contexte de ministère ecclésial, λόγος renvoie vraisemblablement à la parole communiquée oralement. « Prédication » offre un français clair et naturel, tout en étant signalé en note comme une explicitation contextuelle.
- source_word: διδασκαλίᾳ
  choice: l’enseignement
  rationale: « Enseignement » est l’équivalent français le plus naturel et accessible; il évite la technicité doctrinale que pourrait suggérer « doctrine ».
theological_decisions:
- issue: Sens du « double honneur » accordé aux responsables
  choice: Conserver « double honneur » sans le réduire soit au respect, soit à la rémunération.
  alternative: « doubles égards », « double rémunération » ou « honneur comprenant un soutien matériel »
  rationale: Le verset suivant oriente vers un soutien matériel, mais τιμή peut également exprimer l’estime. La formulation large maintient cette tension sémantique sans importer une conception confessionnelle de la rémunération des responsables.
- issue: Valeur de μάλιστα
  choice: Traduire par « surtout ».
  alternative: « à savoir », qui identifierait tous les anciens concernés comme ceux qui œuvrent dans la parole et l’enseignement
  rationale: « Surtout » conserve la mise en relief probable d’un sous-groupe sans trancher la question de savoir si tous les anciens enseignaient ou si certains se consacraient particulièrement à cette tâche.
- issue: Portée de ἐν λόγῳ
  choice: Employer « dans la prédication » comme explicitation contextuelle de la parole exercée dans le ministère.
  alternative: « dans la parole », plus formel mais moins naturel et potentiellement ambigu en français
  rationale: Le contexte associe λόγος à une activité verbale de ministère. La note maintient visible le caractère interprétatif de cette traduction et son champ possible plus large.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe garde la forme exhortative du grec. « Anciens » maintient le terme ecclésial reconnu; « se donnent beaucoup de peine » communique l’intensité de l’effort sans archaïsme. Les notes préservent l’ambiguïté de « double honneur » et rendent explicite l’interprétation contextuelle de λόγος.
