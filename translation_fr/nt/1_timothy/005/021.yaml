  text: διαμαρτύρομαι ἐνώπιον τοῦ θεοῦ καὶ ⸂Χριστοῦ Ἰησοῦ⸃ καὶ τῶν ἐκλεκτῶν ἀγγέλων, ἵνα ταῦτα φυλάξῃς χωρὶς προκρίματος, μηδὲν ποιῶν κατὰ πρόσκλισιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/021.yaml
  text: I solemnly charge you in the presence of God and Messiah Jesus and the chosen angels[a], that you keep these things without prejudice[c][b], doing nothing according to partiality.
translation:
  language: fr
  text: 'Je t’adjure solennellement devant Dieu, Jésus le Messie et les anges choisis[a] : observe ces instructions sans préjugé[b], sans rien faire par favoritisme[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les anges élus ».
    reason: lexical_alternative
  - marker: b
    text: Ou « sans jugement préalable ».
    reason: lexical_alternative
  - marker: c
    text: Ou « avec partialité » ou « par parti pris ».
    reason: lexical_alternative
lexical_decisions:
- source_word: διαμαρτύρομαι
  choice: Je t’adjure solennellement
  rationale: Dans cette exhortation, le verbe exprime une mise en demeure grave et solennelle, et non un simple témoignage. « Ad jurer solennellement » en conserve la force sans alourdir excessivement la phrase.
- source_word: ἐνώπιον
  choice: devant
  rationale: « Devant » exprime naturellement en français la présence de témoins solennels et conserve la portée judiciaire ou cultuelle de la formule.
- source_word: Χριστοῦ Ἰησοῦ
  choice: Jésus le Messie
  rationale: Χριστός garde ici son contenu titulaire. En français courant, « Jésus le Messie » est plus naturel que « Messie Jésus » tout en rendant explicitement le titre.
- source_word: ἐκλεκτῶν ἀγγέλων
  choice: les anges choisis
  rationale: « Choisis » rend le sens premier de ἐκλεκτός dans une langue accessible. « Élus » reste possible et figure en note en raison de son usage théologique traditionnel.
- source_word: ταῦτα
  choice: ces instructions
  rationale: Le démonstratif renvoie aux directives du contexte immédiat. « Ces instructions » explicite sobrement ce référent et sonne plus naturellement que « ces choses » en français.
- source_word: φυλάξῃς
  choice: observe
  rationale: Dans ce contexte, φυλάσσω signifie respecter ou mettre fidèlement en pratique des directives. « Observe » conserve cette idée d’obéissance attentive.
- source_word: χωρὶς προκρίματος
  choice: sans préjuger
  rationale: πρόκριμα désigne un jugement arrêté d’avance. « Sans préjuger » exprime clairement cette antériorité tout en évitant le sens juridique particulier que peut prendre « sans préjudice ».
- source_word: μηδὲν ποιῶν
  choice: sans rien faire
  rationale: Cette formulation française rattache naturellement le participe à l’exhortation principale et conserve la portée absolue de μηδέν.
- source_word: κατὰ πρόσκλισιν
  choice: par favoritisme
  rationale: πρόσκλισις évoque une inclination partiale en faveur d’un côté ou d’une personne. « Par favoritisme » en donne le sens dans un français courant et précis.
theological_decisions:
- issue: Traduction de Χριστός
  choice: Jésus le Messie
  alternative: Jésus-Christ
  rationale: Le terme fonctionne ici comme un titre porteur de sens. « Jésus le Messie » préserve ce contenu, tandis que « Jésus-Christ » pourrait être compris principalement comme un nom composé.
- issue: Identité des « anges choisis »
  choice: Conserver la désignation sans l’expliquer
  alternative: Préciser de quel groupe d’anges il s’agit
  rationale: Le texte ne précise ni le critère de leur choix ni leur rôle exact. La traduction maintient donc cette indétermination plutôt que d’introduire une interprétation théologique.
translation_notes:
  register: Français international moderne, digne et direct. La phrase conserve la solennité de l’adjuration tout en évitant les calques peu naturels. Le tutoiement suit l’adresse grecque au singulier et le contexte personnel de l’épître.
