  text: πρεσβυτέρας ὡς μητέρας, νεωτέρας ὡς ἀδελφὰς ἐν πάσῃ ἁγνείᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/002.yaml
  text: older women as mothers[a], younger women as sisters, in all purity.
translation:
  language: fr
  text: les femmes plus âgées comme des mères, les plus jeunes comme des sœurs, en toute pureté.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « avec une entière pureté ». Dans ce contexte, le mot traduit par « pureté » peut aussi évoquer fortement la chasteté ou une conduite sexuelle irréprochable.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πρεσβυτέρας
  choice: les femmes plus âgées
  rationale: L’adjectif féminin pluriel est employé comme un nom et s’oppose ici à νεωτέρας. Il désigne donc l’âge, non une fonction de responsable dans l’Église.
- source_word: ὡς μητέρας
  choice: comme des mères
  rationale: ὡς introduit une comparaison, et « comme des mères » conserve naturellement l’image familiale sans ajouter le possessif « tes », absent du grec.
- source_word: νεωτέρας
  choice: les plus jeunes
  rationale: L’adjectif féminin pluriel substantivé désigne les femmes plus jeunes. Dans la structure parallèle, « les plus jeunes » est naturel et évite une répétition inutile.
- source_word: ὡς ἀδελφὰς
  choice: comme des sœurs
  rationale: Cette formulation maintient le parallélisme et la métaphore familiale du texte grec, sans ajouter de possessif.
- source_word: ἐν πάσῃ ἁγνείᾳ
  choice: en toute pureté
  rationale: La tournure reflète étroitement la préposition ἐν et l’idée exhaustive de πάσῃ. « Pureté » préserve la portée morale générale de ἁγνεία tout en laissant entendre sa forte dimension de chasteté dans ce contexte.
theological_decisions:
- issue: Portée de ἁγνεία dans la conduite envers les femmes plus jeunes
  choice: en toute pureté
  alternative: en toute chasteté ; avec une pureté entière
  rationale: ἁγνεία peut désigner la pureté morale au sens large, tout en comportant ici une nette implication de chasteté et de conduite sexuelle irréprochable. Le texte principal conserve cette amplitude sans réduire le terme à sa seule dimension sexuelle.
translation_notes:
  register: Français international moderne, simple et digne. Le parallélisme concis de l’original est conservé. L’absence de verbe reflète le fait que ce verset poursuit l’instruction commencée au verset précédent.
