  text: ἡ δὲ σπαταλῶσα ζῶσα τέθνηκεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/006.yaml
  text: But she who lives for pleasure is dead even while she lives[a].
translation:
  language: fr
  text: Mais celle qui vit pour le plaisir est morte, bien qu’elle soit vivante[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « s’adonne au plaisir » ou « mène une vie de luxe » pour « vit pour le plaisir ».'
    reason: Alternatives lexicales pour σπαταλῶσα, qui désigne une vie marquée par l’auto-indulgence, le plaisir ou le luxe.
lexical_decisions:
- source_word: σπαταλῶσα
  choice: vit dans les plaisirs
  rationale: Le participe présent désigne un mode de vie tourné vers les plaisirs et la complaisance envers soi-même, et non le simple fait d’éprouver du plaisir. Cette formulation reste naturelle tout en conservant l’idée d’une conduite habituelle.
- source_word: ζῶσα
  choice: tout en étant vivante
  rationale: Le participe a ici une valeur concessive et forme avec le parfait qui suit un paradoxe intentionnel. La formulation française exprime clairement la simultanéité et l’opposition.
- source_word: τέθνηκεν
  choice: est morte
  rationale: Le parfait grec souligne l’état présent résultant de la mort. « Est morte » rend cet état sans réduire la métaphore à une explication doctrinale précise.
- source_word: ἡ ... σπαταλῶσα
  choice: celle qui vit dans les plaisirs
  rationale: L’article féminin singulier avec le participe est substantivé. « Celle qui… » conserve le genre et le lien contextuel avec la veuve sans ajouter un nom absent du verset.
- source_word: δὲ
  choice: Mais
  rationale: La conjonction marque le contraste avec la veuve véritable décrite au verset précédent, qui met son espérance en Dieu et persévère dans la prière.
theological_decisions:
- issue: Nature de la mort dans le contexte
  choice: Conserver la métaphore d’une femme morte tout en étant physiquement vivante
  alternative: Préciser qu’elle est spirituellement, moralement ou socialement morte
  rationale: Le grec crée délibérément un paradoxe entre le fait d’être vivante et celui d’être morte. La traduction maintient cette tension sans imposer une définition doctrinale plus étroite que le texte.
translation_notes:
  register: Français international moderne, naturel et digne. Le contraste est direct, et le paradoxe final reste frappant sans tournure archaïque.
