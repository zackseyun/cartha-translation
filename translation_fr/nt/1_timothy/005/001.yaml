id: 1TI.5.1
reference: 1 Timothy 5:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Πρεσβυτέρῳ μὴ ἐπιπλήξῃς, ἀλλὰ παρακάλει ὡς πατέρα, νεωτέρους ὡς ἀδελφούς,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/001.yaml
  text: Do not rebuke an older man[a], but appeal to him as a father, and to younger men as brothers,
translation:
  language: fr
  text: Ne réprimande pas un homme âgé[a], mais exhorte-le comme un père, et les hommes plus jeunes comme des frères,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Ne réprimande pas sévèrement un ancien » ; le terme grec peut désigner soit un homme âgé, soit un ancien, mais le contraste fondé sur l’âge dans ce contexte favorise « homme âgé ».
    reason: alternative_reading
lexical_decisions:
- source_word: Πρεσβυτέρῳ
  choice: un homme âgé
  rationale: Le terme est employé substantivement. Son opposition à νεωτέρους dans ce verset, puis le parallèle avec les femmes âgées et les jeunes femmes au verset suivant, favorisent le sens lié à l’âge plutôt que celui de responsable d’Église.
- source_word: μὴ ἐπιπλήξῃς
  choice: Ne réprimande pas
  rationale: Le verbe désigne une réprimande verbale vigoureuse. « Réprimander » restitue cette idée sans ajouter explicitement un adverbe d’intensité.
- source_word: ἀλλὰ παρακάλει
  choice: mais adresse-toi à lui
  rationale: Dans l’opposition avec la réprimande et avec la comparaison familiale qui suit, cette formulation exprime une démarche respectueuse. Le complément « à lui » explicite l’objet sous-entendu en grec.
- source_word: ὡς πατέρα
  choice: comme à un père
  rationale: Cette tournure française rend naturellement la comparaison introduite par ὡς et s’accorde avec « adresse-toi à lui ».
- source_word: νεωτέρους
  choice: les hommes plus jeunes
  rationale: Le masculin pluriel substantivé désigne ici les hommes plus jeunes, puisque la suite distingue aussi les femmes selon leur âge.
- source_word: ὡς ἀδελφούς
  choice: comme à des frères
  rationale: Le masculin « frères » est conservé, car le passage répartit explicitement les exhortations selon l’âge et le sexe. Aucun ajout tel que « dans la foi » n’est nécessaire.
theological_decisions:
- issue: Πρεσβυτέρῳ désigne-t-il un homme âgé ou un ancien exerçant une fonction dans l’Église ?
  choice: 'Sens lié à l’âge : « un homme âgé »'
  alternative: « un ancien »
  rationale: La structure contextuelle — homme âgé/père, hommes plus jeunes/frères, puis femmes âgées/mères et jeunes femmes/sœurs — favorise nettement des catégories d’âge et de sexe. La note conserve néanmoins l’autre sens lexical possible.
- issue: ἀδελφούς doit-il être rendu de manière inclusive ?
  choice: « frères »
  alternative: « frères et sœurs »
  rationale: Dans ce contexte, le masculin appartient à une série de groupes distingués selon le sexe et n’est pas générique.
translation_notes:
  register: Français moderne, clair et digne. « Homme âgé » est plus naturel ici que « vieillard » et moins ambigu que « ancien ». La formulation « adresse-toi à lui » privilégie la force relationnelle de παρακάλει sans en réduire la gamme sémantique à l’encouragement seul.
