source:
  edition: SBLGNT
  text: Τινῶν ἀνθρώπων αἱ ἁμαρτίαι πρόδηλοί εἰσιν, προάγουσαι εἰς κρίσιν, τισὶν δὲ καὶ ἐπακολουθοῦσιν·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/024.yaml
  text: The sins of some people are obvious[a], going before them to judgment[b], but for others they follow after.
translation:
  language: fr
  text: Les péchés de certaines personnes sont manifestes[a] et les précèdent vers le jugement[b] ; mais, chez d’autres, ils les suivent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « sont évidents » ou « sautent aux yeux ».'
    reason: lexical_alternative
  - marker: b
    text: Dans ce contexte, le « jugement » peut désigner l’évaluation présente d’une personne ; le terme peut aussi évoquer plus largement le jugement de Dieu.
    reason: alternative_reading
lexical_decisions:
- source_word: Τινῶν ἀνθρώπων αἱ ἁμαρτίαι
  choice: Les péchés de certaines personnes
  rationale: Le génitif indique à qui appartiennent les péchés. « Personnes » rend naturellement le sens générique de ἀνθρώπων sans imposer ici une restriction de genre.
- source_word: πρόδηλοί
  choice: manifestes
  rationale: « Manifestes » exprime que les péchés sont déjà clairement visibles, dans un registre courant et digne.
- source_word: προάγουσαι εἰς κρίσιν
  choice: les précèdent vers le jugement
  rationale: Le participe s’accorde avec « péchés » et conserve l’image de péchés qui passent devant les personnes concernées en direction du jugement. Le pronom « les » explicite l’objet sous-entendu sans effacer la métaphore.
- source_word: τισὶν δὲ καὶ ἐπακολουθοῦσιν
  choice: chez d’autres, en revanche, ils ne se révèlent qu’ensuite
  rationale: Le datif est rendu par « chez d’autres ». La formulation naturelle indique que leurs péchés viennent après et deviennent visibles plus tard, tout en maintenant le contraste temporel avec la première proposition.
theological_decisions:
- issue: Portée de κρίσις (« jugement »)
  choice: Conserver le terme général « jugement »
  alternative: Préciser soit une évaluation présente dans la communauté, soit le jugement divin final
  rationale: Le contexte immédiat peut viser l’examen présent des personnes, tandis que le vocabulaire permet aussi une portée plus large. La traduction ne tranche donc pas cette tension.
translation_notes:
  register: Français international moderne, naturel et digne. La personnification des péchés est préservée dans la première proposition, tandis que la seconde est formulée idiomatiquement pour éviter une tournure française obscure. Tous les marqueurs de notes figurent dans le texte.
