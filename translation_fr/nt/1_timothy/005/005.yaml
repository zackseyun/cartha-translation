source:
  edition: SBLGNT
  text: ἡ δὲ ὄντως χήρα καὶ μεμονωμένη ἤλπικεν ἐπὶ ⸀θεὸν καὶ προσμένει ταῖς δεήσεσιν καὶ ταῖς προσευχαῖς νυκτὸς καὶ ἡμέρας·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/005.yaml
  text: She who is truly a widow[a], and is left all alone[c][b], has set her hope on God and continues in petitions and prayers night and day.
translation:
  language: fr
  text: Mais celle qui est véritablement veuve[a] et qui est restée seule[b] a mis son espérance en Dieu et persévère dans les supplications et les prières, nuit et jour.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression grecque peut aussi se traduire par « réellement veuve » ou « vraiment veuve » ; dans le contexte, elle désigne une veuve qui correspond pleinement à la situation décrite.
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « qui a été laissée seule ». Le grec souligne son état durable de femme sans entourage immédiat, sans en préciser explicitement la cause.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Mais
  rationale: Marque ici le contraste avec le cas évoqué au verset précédent, tout en poursuivant l’argument.
- source_word: ὄντως χήρα
  choice: réellement veuve
  rationale: Désigne une veuve qui correspond véritablement à la situation définie par le contexte, sans réduire l’expression au simple statut civil.
- source_word: μεμονωμένη
  choice: qui est restée seule
  rationale: Le participe parfait exprime l’état durable d’une femme désormais seule; cette formulation reste naturelle sans préciser au-delà du grec la cause de cet isolement.
- source_word: ἤλπικεν ἐπὶ θεόν
  choice: a mis son espérance en Dieu
  rationale: Le parfait présente une espérance établie dont l’effet se poursuit.
- source_word: προσμένει
  choice: persévère
  rationale: Rend l’idée d’une pratique qui se poursuit avec constance.
- source_word: ταῖς δεήσεσιν καὶ ταῖς προσευχαῖς
  choice: dans les supplications et les prières
  rationale: 'Conserve les deux termes grecs: les demandes pressantes d’une part et la prière au sens plus général d’autre part.'
- source_word: νυκτὸς καὶ ἡμέρας
  choice: nuit et jour
  rationale: Expression française naturelle qui respecte l’ordre grec et évoque une pratique constante.
theological_decisions:
- issue: Sens de la veuve « réellement » veuve
  choice: 'Le texte décrit une veuve correspondant à la catégorie précisée par le contexte: elle est seule, espère en Dieu et persévère dans la prière.'
  alternative: Comprendre l’expression comme une simple affirmation de son veuvage légal, sans portée qualificative.
  rationale: ὄντως et le contexte immédiat distinguent un cas particulier de veuve, mais la traduction n’ajoute aucun critère ecclésiastique ou confessionnel absent de ce verset.
translation_notes:
  register: Français international moderne, digne et accessible. « Supplications » conserve la distinction lexicale grecque tout en restant compréhensible; la virgule avant « nuit et jour » clarifie que cette expression porte sur la persévérance dans la prière.
