source:
  edition: SBLGNT
  text: ⸀τοὺς ἁμαρτάνοντας ἐνώπιον πάντων ἔλεγχε, ἵνα καὶ οἱ λοιποὶ φόβον ἔχωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/020.yaml
  text: Rebuke those who are sinning before everyone[b][a], so that the rest also may have fear.
translation:
  language: fr
  text: Ceux qui pèchent, reprends-les devant tous[b][a], afin que les autres aussi éprouvent de la crainte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ceux qui persistent dans le péché » ; le participe présent peut suggérer une conduite pécheresse qui se poursuit.'
    reason: lexical_alternative
  - marker: b
    text: Le contexte immédiat peut viser plus particulièrement les anciens qui pèchent, bien que le verset lui-même dise seulement « ceux qui pèchent ».
    reason: cross_reference
lexical_decisions:
- source_word: τοὺς ἁμαρτάνοντας
  choice: ceux qui pèchent
  rationale: Le participe présent substantivé désigne naturellement « ceux qui pèchent ». Il peut suggérer une conduite qui se poursuit, sans exiger que cette nuance soit explicitée dans le texte principal.
- source_word: ἐνώπιον πάντων
  choice: devant tous
  rationale: Cette formulation rend directement la locution grecque et conserve le caractère public de la réprimande sans la paraphraser.
- source_word: ἔλεγχε
  choice: reprends-les
  rationale: Dans ce contexte disciplinaire, « reprendre » exprime une correction ouverte fondée sur la mise en évidence d'une faute. « Réprimander » serait possible, mais insiste davantage sur la désapprobation.
- source_word: οἱ λοιποὶ
  choice: les autres
  rationale: L'expression désigne les autres personnes, distinctes de celles qui pèchent. « Les autres » est naturel en français et évite l'éventuelle ambiguïté de « le reste ».
- source_word: φόβον ἔχωσιν
  choice: éprouvent de la crainte
  rationale: 'Cette formulation conserve le nom grec « crainte » et laisse ouverte la nature exacte de cette crainte : appréhension salutaire, respect sérieux ou peur.'
theological_decisions:
- issue: Portée de « ceux qui pèchent » dans le contexte
  choice: Le texte principal ne précise pas qu'il s'agit d'anciens.
  alternative: Le contexte immédiat, notamment le verset 19, peut indiquer que Paul parle plus particulièrement des anciens qui pèchent.
  rationale: Le verset grec dit simplement « ceux qui pèchent ». Ajouter « anciens » dans le texte principal résoudrait une question que la formulation elle-même laisse implicite.
- issue: Nature de la crainte
  choice: La traduction emploie le terme général « crainte ».
  alternative: On pourrait rendre l'expression par « aient peur » ou expliciter une crainte respectueuse et salutaire.
  rationale: Le grec ne définit pas ici précisément la qualité de cette crainte; la traduction préserve donc cette latitude théologique et psychologique.
translation_notes:
  register: Français international moderne, clair et digne. La dislocation « Ceux qui pèchent, reprends-les » conserve la mise en relief de l'objet placé en tête dans le grec tout en restant naturelle en français. Les marqueurs de notes suivent l'ordre fourni dans le texte anglais audité.
