id: 1TI.5.14
reference: 1 Timothy 5:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: βούλομαι οὖν νεωτέρας γαμεῖν, τεκνογονεῖν, οἰκοδεσποτεῖν, μηδεμίαν ἀφορμὴν διδόναι τῷ ἀντικειμένῳ λοιδορίας χάριν·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/014.yaml
  text: Therefore I want younger widows to marry[a], to bear children, to manage their households[b], and to give the opponent no opportunity for slander.
translation:
  language: fr
  text: Je veux donc que les jeunes veuves se marient[a], aient des enfants, gèrent leur foyer et ne donnent à l’opposant[b] aucune occasion de les injurier.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec dit simplement « se marier »; puisqu’il est question de jeunes veuves, le remariage est impliqué par le contexte.
    reason: lexical_alternative
  - marker: b
    text: Ou « l’adversaire »; il peut s’agir d’un opposant humain ou, selon une autre interprétation, de Satan.
    reason: alternative_reading
lexical_decisions:
- source_word: βούλομαι
  choice: Je veux
  rationale: Rend directement la volonté personnelle exprimée par Paul, dans un français actuel et naturel.
- source_word: οὖν
  choice: donc
  rationale: Marque l’inférence tirée de la discussion précédente sans alourdir la phrase.
- source_word: νεωτέρας
  choice: les jeunes veuves
  rationale: L’adjectif signifie littéralement « les plus jeunes » ou « les jeunes femmes », mais le contexte immédiat porte sur les veuves; le nom sous-entendu est donc explicité.
- source_word: γαμεῖν
  choice: se marient
  rationale: Le verbe signifie simplement « se marier ». Comme il s’agit de veuves, un remariage est impliqué par le contexte, sans être exprimé lexicalement.
- source_word: τεκνογονεῖν
  choice: aient des enfants
  rationale: Expression française naturelle qui rend l’idée de mettre au monde ou d’avoir des enfants, sans donner à la formulation un ton inutilement technique.
- source_word: οἰκοδεσποτεῖν
  choice: dirigent leur foyer
  rationale: Le verbe désigne la responsabilité et la gestion du foyer. « Diriger leur foyer » conserve cette idée d’autorité domestique sans suggérer une domination brutale.
- source_word: μηδεμίαν ἀφορμὴν διδόναι
  choice: ne donnent […] aucune occasion
  rationale: Reproduit clairement l’idée de ne fournir aucune ouverture ou possibilité à une attaque hostile.
- source_word: τῷ ἀντικειμένῳ
  choice: à l’opposant
  rationale: Conserve le singulier et le caractère indéterminé du participe substantivé, sans identifier d’office cet opposant à Satan.
- source_word: λοιδορίας χάριν
  choice: de calomnier
  rationale: Rend idiomatiquement le but hostile exprimé par la construction, à savoir disposer d’une occasion de tenir des propos diffamatoires ou injurieux.
theological_decisions:
- issue: Identité de τῷ ἀντικειμένῳ
  choice: « l’opposant », sans identification explicite
  alternative: « l’Adversaire », compris comme Satan
  rationale: Le grec désigne littéralement celui qui s’oppose, sans préciser son identité. Le texte principal préserve donc cette ambiguïté, tandis que la note signale l’interprétation possible comme référence à Satan.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe conserve la série d’actions voulues par Paul, tout en employant des formulations idiomatiques. Les deux notes sont placées à l’endroit exact auquel elles se rapportent.
