id: 1TI.5.8
reference: 1 Timothy 5:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἰ δέ τις τῶν ἰδίων καὶ ⸀μάλιστα οἰκείων οὐ ⸀προνοεῖ, τὴν πίστιν ἤρνηται καὶ ἔστιν ἀπίστου χείρων.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/008.yaml
  text: But if anyone does not provide for his own[a], and especially for members of his household[b], he has denied the faith and is worse than an unbeliever.
translation:
  language: fr
  text: Mais si quelqu’un ne prend pas soin des siens[a], et surtout des membres de son foyer, il a renié la foi[b] et il est pire qu’un non-croyant.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «de ses proches»; l’expression est plus large que les seules personnes vivant sous le même toit, tandis que «les membres de son foyer» désigne le groupe envers lequel l’obligation est particulièrement directe.
    reason: lexical_alternative
  - marker: b
    text: Ou «a rejeté la foi».
    reason: lexical_alternative
lexical_decisions:
- source_word: τις
  choice: quelqu’un
  rationale: Rend naturellement l’indéfini singulier à portée générale, sans limiter l’énoncé aux hommes.
- source_word: τῶν ἰδίων
  choice: des siens
  rationale: Expression française concise qui conserve la portée assez large du grec — les proches ou personnes dont on a la charge — avant la précision apportée par οἰκείων.
- source_word: μάλιστα
  choice: surtout
  rationale: Marque naturellement l’accent particulier placé sur un sous-groupe au sein d’un ensemble plus large.
- source_word: οἰκείων
  choice: des membres de son foyer
  rationale: Désigne plus précisément les personnes appartenant au même foyer; cette formulation maintient la distinction avec le plus large «des siens».
- source_word: προνοεῖ
  choice: prend soin de
  rationale: Dans ce contexte, le verbe implique une prévoyance concrète et la prise en charge des besoins. «Prendre soin de» garde cette amplitude sans réduire le sens au seul soutien financier.
- source_word: τὴν πίστιν
  choice: la foi
  rationale: L’article et le contexte renvoient vraisemblablement à la foi chrétienne professée, plutôt qu’à la seule confiance subjective ou à la fidélité.
- source_word: ἤρνηται
  choice: a renié
  rationale: Le passé composé exprime bien l’état présent résultant du parfait grec; «renier» conserve la gravité d’une répudiation manifestée par la conduite.
- source_word: ἀπίστου
  choice: un non-croyant
  rationale: Dans cette opposition, le terme désigne une personne qui ne croit pas, probablement extérieure à la foi professée.
- source_word: χείρων
  choice: pire
  rationale: Équivalent français direct et vigoureux de la comparaison morale exprimée par le grec.
theological_decisions:
- issue: Portée de la construction singulière générique
  choice: Employer «quelqu’un» puis des formulations françaises génériques naturelles.
  alternative: Employer une formulation explicitement masculine telle que «si un homme… les siens».
  rationale: Le masculin grammatical grec n’impose pas ici une restriction aux hommes. «Quelqu’un» communique la portée universelle sans ajouter une distinction absente du propos.
- issue: Sens de πίστις dans τὴν πίστιν ἤρνηται
  choice: «la foi», comprise comme la foi chrétienne professée
  alternative: «sa foi» comme confiance personnelle, ou «la fidélité»
  rationale: Dans les Pastorales et dans cette construction avec l’article, l’expression désigne le plus naturellement la foi professée, que la conduite de la personne vient contredire.
- issue: Nature de l’obligation exprimée par προνοεῖ
  choice: «prendre soin de», incluant prévoyance, soutien matériel et attention pratique
  alternative: «pourvoir aux besoins de», qui met davantage l’accent sur le soutien matériel
  rationale: Le contexte vise une prise en charge concrète, mais le verbe peut couvrir plus largement le souci prévoyant. La formulation choisie évite de limiter indûment l’obligation au seul domaine financier.
translation_notes:
  register: Français international moderne, clair et digne. «Des siens» maintient la progression du général au particulier; «membres de son foyer» est plus précis que «famille» et n’implique pas nécessairement le seul lien de parenté. Les deux marqueurs de note figurent dans le texte principal.
