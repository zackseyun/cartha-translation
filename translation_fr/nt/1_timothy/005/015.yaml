  text: ἤδη γάρ τινες ἐξετράπησαν ὀπίσω τοῦ Σατανᾶ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/015.yaml
  text: For some have already turned aside to follow Satan.
translation:
  language: fr
  text: Car quelques-unes se sont déjà détournées pour suivre Satan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « se sont détournées à la suite de Satan » ou « se sont détournées derrière Satan ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤδη
  choice: déjà
  rationale: Conserve la valeur temporelle de l’adverbe et indique que cette déviation s’est effectivement produite.
- source_word: γάρ
  choice: Car
  rationale: Introduit l’explication de l’instruction précédente tout en conservant explicitement le lien logique.
- source_word: τινες
  choice: quelques-unes
  rationale: Rend le pluriel indéfini et, conformément au contexte immédiat qui parle des jeunes veuves, emploie naturellement le féminin sans préciser davantage leur identité.
- source_word: ἐξετράπησαν
  choice: se sont détournées
  rationale: Préserve l’image d’un écart hors de la bonne voie, sans introduire l’idée plus causative qu’elles auraient été égarées par quelqu’un.
- source_word: ὀπίσω
  choice: pour suivre
  rationale: Dans cette construction avec une personne, le terme évoque le fait d’aller derrière elle ou à sa suite. « pour suivre » en exprime clairement la portée en français courant, tandis que la note conserve la formulation plus littérale.
- source_word: Σατανᾶ
  choice: Satan
  rationale: Suit la forme traditionnelle et largement reconnue de ce nom ou titre dans le Nouveau Testament.
theological_decisions:
- issue: Faut-il rendre ὀπίσω τοῦ Σατανᾶ littéralement ou en expliciter le sens relationnel ?
  choice: pour suivre Satan
  alternative: à la suite de Satan / derrière Satan
  rationale: « Pour suivre Satan » communique naturellement l’idée de se ranger à sa suite, sans atténuer la gravité théologique de l’énoncé. La note signale que le grec peut se rendre plus littéralement.
translation_notes:
  register: Français international moderne, clair et digne. Le féminin « quelques-unes » découle du contexte des jeunes veuves. La métaphore de la déviation est conservée dans « se sont détournées », et la tournure idiomatique « pour suivre » est accompagnée d’une note plus littérale.
