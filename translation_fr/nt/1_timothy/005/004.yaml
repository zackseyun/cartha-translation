id: 1TI.5.4
reference: 1 Timothy 5:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἰ δέ τις χήρα τέκνα ἢ ἔκγονα ἔχει, μανθανέτωσαν πρῶτον τὸν ἴδιον οἶκον εὐσεβεῖν καὶ ἀμοιβὰς ἀποδιδόναι τοῖς προγόνοις, τοῦτο γάρ ἐστιν ἀπόδεκτον ἐνώπιον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/004.yaml
  text: But if any widow has children or grandchildren[a], let them first learn to show godliness to their own household and to repay their forebears[c][b], for this is acceptable before God.
translation:
  language: fr
  text: Mais si une veuve a des enfants ou des petits-enfants[a], que ceux-ci apprennent d’abord à manifester leur piété envers leur propre famille[b] et à rendre à leurs ascendants ce qu’ils ont reçu d’eux[c], car cela est agréable devant Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « descendants ». Le grec peut avoir un sens plus large que « petits-enfants ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « à pratiquer la piété envers leur propre maisonnée ». Le grec présente les soins familiaux comme une expression de la piété.
    reason: lexical_alternative
  - marker: c
    text: Ou « à leurs parents » ou « à leurs ancêtres ». Ici, le terme désigne les générations précédentes de la famille auxquelles ils doivent rendre les soins reçus.
    reason: lexical_alternative
lexical_decisions:
- source_word: χήρα
  choice: veuve
  rationale: Sens courant dans ce passage, qui traite des femmes dont le mari est mort.
- source_word: τέκνα ἢ ἔκγονα
  choice: enfants ou petits-enfants
  rationale: τέκνα désigne les enfants; ἔκγονα peut désigner plus largement les descendants, mais, dans ce contexte de devoir familial immédiat, « petits-enfants » exprime naturellement la génération suivante tout en laissant l’alternative en note.
- source_word: μανθανέτωσαν
  choice: que ceux-ci apprennent
  rationale: Le présent impératif à la troisième personne du pluriel a pour antécédents naturels les enfants ou petits-enfants. « Ceux-ci » rend ce renvoi explicite et évite de faire de la veuve le sujet.
- source_word: πρῶτον
  choice: d’abord
  rationale: Marque la priorité du devoir exercé au sein de sa propre famille.
- source_word: τὸν ἴδιον οἶκον
  choice: leur propre famille
  rationale: οἶκος désigne ici la maisonnée ou la cellule familiale, et non principalement le bâtiment.
- source_word: εὐσεβεῖν
  choice: manifester leur piété envers
  rationale: Le verbe garde sa portée religieuse tout en décrivant ici une conduite concrète envers les membres de la famille.
- source_word: ἀμοιβὰς ἀποδιδόναι
  choice: rendre … ce qu’ils ont reçu d’eux
  rationale: La formulation exprime la réciprocité et le fait de rendre en retour les soins reçus, sans suggérer une dette strictement financière.
- source_word: τοῖς προγόνοις
  choice: à leurs ascendants
  rationale: « Ascendants » conserve le sens de générations antérieures de la famille sans limiter indûment le terme aux seuls parents.
- source_word: ἀπόδεκτον
  choice: agréable
  rationale: Dans la formule « devant Dieu », « agréable » exprime naturellement ce qui est favorablement accueilli ou approuvé.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: devant Dieu
  rationale: Rend de façon concise l’idée de la présence et de l’évaluation divines.
theological_decisions:
- issue: Référent du pluriel μανθανέτωσαν
  choice: Le commandement s’adresse aux enfants ou petits-enfants de la veuve.
  alternative: Le commandement s’adresserait aux veuves, malgré le passage du singulier au pluriel ou avec un sujet sous-entendu.
  rationale: Les noms pluriels τέκνα ἢ ἔκγονα sont les antécédents les plus proches et les plus naturels; le devoir de rendre aux ascendants les soins reçus confirme cette lecture.
- issue: Portée de εὐσεβεῖν dans les soins familiaux
  choice: Les soins apportés à la famille sont présentés comme une manifestation de piété.
  alternative: Le verbe désignerait seulement l’accomplissement d’un devoir familial, sans nuance religieuse marquée.
  rationale: εὐσεβεῖν porte une dimension explicite de piété, et la conclusion « agréable devant Dieu » confirme que le devoir familial est envisagé comme conduite religieuse.
- issue: Nature de la réciprocité exprimée par ἀμοιβὰς ἀποδιδόναι
  choice: Il s’agit de rendre en retour aux générations précédentes les soins reçus.
  alternative: Il s’agirait d’un remboursement matériel ou financier au sens strict.
  rationale: Le contexte familial favorise l’idée large de reconnaissance et de soins réciproques plutôt qu’une dette monétaire précisément calculée.
translation_notes:
  register: Français international moderne, digne et accessible. « Ceux-ci » clarifie le sujet pluriel sans effacer la structure grecque. « Manifester leur piété » préserve la dimension théologique de εὐσεβεῖν, tandis que « propre famille » est plus naturel que « propre maison » dans ce contexte. Les notes conservent l’étendue possible de ἔκγονα et πρόγονοι.
