id: 1TI.5.13
reference: 1 Timothy 5:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἅμα δὲ καὶ ἀργαὶ μανθάνουσιν, περιερχόμεναι τὰς οἰκίας, οὐ μόνον δὲ ἀργαὶ ἀλλὰ καὶ φλύαροι καὶ περίεργοι, λαλοῦσαι τὰ μὴ δέοντα.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/013.yaml
  text: At the same time[a], they also learn to be idle, going around from house to house; and not only idle, but also gossips and busybodies[b], saying what they ought not to say.
translation:
  language: fr
  text: En même temps, elles prennent aussi l’habitude d’être oisives et vont de maison en maison. Et non seulement elles sont oisives, mais encore bavardes[a] et se mêlent de ce qui ne les regarde pas[b], disant ce qu’elles ne devraient pas dire.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « faisant des commérages ». Le terme grec peut désigner plus largement des paroles creuses ou inconsidérées.
    reason: lexical_alternative
  - marker: b
    text: Ou « indiscrètes » ou « importunes ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἅμα δὲ καὶ
  choice: En même temps, elles… aussi
  rationale: Rend à la fois l’idée de simultanéité et celle d’ajout, tout en reliant naturellement la phrase au contexte précédent.
- source_word: ἀργαὶ
  choice: oisives
  rationale: « Oisives » désigne l’absence d’activité plutôt que la seule paresse morale et permet de conserver la répétition du grec.
- source_word: μανθάνουσιν
  choice: prennent l’habitude d’être
  rationale: Dans ce contexte, le verbe décrit l’acquisition d’une habitude. Cette formulation est plus naturelle en français que le calque « apprennent à être ».
- source_word: περιερχόμεναι τὰς οἰκίας
  choice: vont de maison en maison
  rationale: Exprime clairement et idiomatiquement le déplacement répété d’un foyer à l’autre.
- source_word: φλύαροι
  choice: bavardes
  rationale: Le terme peut évoquer des paroles creuses, inconsidérées ou indiscrètes. « Bavardes » préserve cette largeur de sens sans limiter d’emblée le mot aux commérages.
- source_word: περίεργοι
  choice: se mêlent de ce qui ne les regarde pas
  rationale: Cette tournure française courante rend précisément l’idée d’une ingérence indue dans les affaires d’autrui.
- source_word: λαλοῦσαι
  choice: disant
  rationale: Le participe français maintient le lien avec les comportements précédents et introduit naturellement son complément.
- source_word: τὰ μὴ δέοντα
  choice: ce qu’elles ne devraient pas dire
  rationale: Rend l’idée de paroles qui ne conviennent pas, tout en explicitant naturellement en français que l’interdit porte sur ce qui est dit.
theological_decisions:
- issue: Référence féminine des adjectifs et participes au pluriel
  choice: elles… oisives… bavardes
  alternative: ces femmes
  rationale: Les formes grecques sont féminines et renvoient aux jeunes veuves du contexte. Le pronom « elles » conserve cette référence sans répéter inutilement l’antécédent.
- issue: Nature des paroles désignées par φλύαροι
  choice: bavardes
  alternative: médisantes / faisant des commérages
  rationale: Le grec peut désigner plus largement des paroles creuses ou inconsidérées. Le texte principal conserve cette amplitude, tandis que la note signale l’interprétation plus précise possible dans ce contexte.
translation_notes:
  register: Français moderne, courant et digne. La répétition de « oisives » reproduit l’insistance du grec. « Se mêlent de ce qui ne les regarde pas » privilégie une expression immédiatement compréhensible plutôt qu’un substantif ou un adjectif moins naturel.
