id: 1TI.5.10
reference: 1 Timothy 5:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐν ἔργοις καλοῖς μαρτυρουμένη, εἰ ἐτεκνοτρόφησεν, εἰ ἐξενοδόχησεν, εἰ ἁγίων πόδας ἔνιψεν, εἰ θλιβομένοις ἐπήρκεσεν, εἰ παντὶ ἔργῳ ἀγαθῷ ἐπηκολούθησεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/010.yaml
  text: 'well attested for good works: if she has raised children[a], if she has shown hospitality, if she has washed the feet of the saints, if she has helped those under affliction[c][b], if she has followed every good work.'
translation:
  language: fr
  text: 'reconnue pour ses bonnes œuvres : si elle a élevé des enfants, si elle a accueilli des étrangers[a], si elle a lavé les pieds des saints[b], si elle a porté secours aux personnes dans la détresse, si elle s’est appliquée à toute bonne œuvre[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « fait preuve d’hospitalité ». Le verbe grec désigne précisément l’accueil d’étrangers ou de personnes de passage chez soi.
    reason: lexical_alternative
  - marker: b
    text: Ici, « les saints » désigne ceux qui appartiennent à Dieu, c’est-à-dire les autres croyants.
    reason: lexical_alternative
  - marker: c
    text: Ou « a poursuivi toute bonne œuvre ». L’expression grecque souligne une démarche active et persévérante.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἔργοις καλοῖς μαρτυρουμένη
  choice: connue pour ses belles œuvres
  rationale: Le participe passif exprime le témoignage favorable rendu par autrui; cette formulation française naturelle rattache sa réputation à ses actes observables.
- source_word: εἰ
  choice: si
  rationale: La répétition de « si » conserve la structure grecque de la série de critères.
- source_word: ἐτεκνοτρόφησεν
  choice: elle a élevé des enfants
  rationale: Le verbe désigne le fait de nourrir et d’élever des enfants, sans préciser qu’ils sont biologiques.
- source_word: ἐξενοδόχησεν
  choice: elle a accueilli des étrangers
  rationale: Le verbe évoque précisément l’accueil de personnes étrangères ou de passage chez soi; cette traduction conserve cette image concrète.
- source_word: ἁγίων πόδας ἔνιψεν
  choice: elle a lavé les pieds des saints
  rationale: La traduction maintient l’acte concret d’humble service ainsi que le terme paulinien désignant le peuple consacré à Dieu.
- source_word: θλιβομένοις ἐπήρκεσεν
  choice: elle a porté secours aux personnes dans la détresse
  rationale: « Porter secours » rend l’assistance effective, tandis que « dans la détresse » garde la portée large du participe sans la limiter à la persécution.
- source_word: παντὶ ἔργῳ ἀγαθῷ ἐπηκολούθησεν
  choice: elle s’est appliquée à toute œuvre bonne
  rationale: Cette tournure exprime l’idée de suivre assidûment et de poursuivre activement toute bonne œuvre, sans suggérer qu’elle imite une œuvre comme une personne.
theological_decisions:
- issue: Référent de ἁγίων
  choice: les saints
  alternative: les croyants / ceux qui appartiennent à Dieu
  rationale: Dans l’usage paulinien, le terme désigne normalement les membres du peuple consacré à Dieu. Le conserver dans le texte respecte ce vocabulaire théologique, et une note en explicite le sens.
translation_notes:
  register: Français international actuel, digne et accessible. La syntaxe répétitive de l’original est conservée, avec des formulations idiomatiques. « Belles œuvres » rend καλοῖς, tandis que « œuvre bonne » rend ἀγαθῷ, afin de laisser percevoir la variation lexicale grecque.
