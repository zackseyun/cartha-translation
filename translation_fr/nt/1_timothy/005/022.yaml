source:
  edition: SBLGNT
  text: χεῖρας ταχέως μηδενὶ ἐπιτίθει, μηδὲ κοινώνει ἁμαρτίαις ἀλλοτρίαις· σεαυτὸν ἁγνὸν τήρει.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/022.yaml
  text: Do not lay hands on anyone hastily[a], nor share in the sins of others; keep yourself pure.
translation:
  language: fr
  text: N’impose les mains à personne avec précipitation[a] et ne participe pas aux péchés d’autrui ; garde-toi pur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus précisément dans ce contexte : « Ne nomme personne trop vite » ou « N’ordonne personne trop vite ». Le grec dit littéralement « imposer les mains », expression souvent associée à la mise à part ou à la reconnaissance d’une personne pour un ministère.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χεῖρας ... ἐπιτίθει
  choice: impose les mains
  rationale: Cette formulation française naturelle conserve l’expression grecque littérale et son caractère ecclésial, sans la réduire explicitement à « nommer » ou « ordonner ».
- source_word: ταχέως
  choice: avec précipitation
  rationale: L’adverbe met ici en garde contre une action prématurée ou insuffisamment réfléchie, plutôt que contre la simple rapidité.
- source_word: μηδενὶ
  choice: à personne
  rationale: Avec l’impératif négatif, cette tournure française exprime clairement la portée universelle de l’interdiction.
- source_word: μηδὲ κοινώνει
  choice: et ne participe pas
  rationale: Le verbe désigne le fait d’avoir part à quelque chose ou d’en devenir complice. « Participer à » est clair et actuel.
- source_word: ἁμαρτίαις ἀλλοτρίαις
  choice: aux péchés d’autrui
  rationale: « D’autrui » rend avec concision l’idée de péchés appartenant à d’autres personnes, dans un registre digne et courant.
- source_word: σεαυτὸν ἁγνὸν τήρει
  choice: garde-toi pur
  rationale: Cette expression rend l’impératif de maintien continu et la pureté morale générale, sans limiter le sens à la chasteté sexuelle.
theological_decisions:
- issue: Sens de l’imposition des mains dans le contexte
  choice: Conserver l’expression « imposer les mains » sans préciser qu’il s’agit d’une nomination ou d’une ordination.
  alternative: « Ne nomme personne avec précipitation » ou « N’ordonne personne trop vite ».
  rationale: Le contexte des responsables d’Église rend probable une reconnaissance ou une mise à part pour un ministère. Toutefois, le grec emploie l’expression plus large de l’imposition des mains ; la traduction évite donc d’imposer une procédure ecclésiale plus précise que le texte.
- issue: Lien entre les deux interdictions
  choice: Présenter la seconde comme une mise en garde générale contre la participation aux péchés d’autrui, tout en laissant le contexte suggérer un lien avec une approbation prématurée.
  alternative: Expliciter que l’imposition précipitée des mains rend directement complice des péchés de la personne concernée.
  rationale: La juxtaposition des propositions suggère ce lien, mais le grec ne l’énonce pas explicitement. La formulation conserve donc cette tension interprétative.
translation_notes:
  register: Français international moderne, clair et digne. « Imposer les mains » conserve l’expression biblique courante ; « avec précipitation » communique l’idée d’une décision prématurée. La ponctuation garde les trois exhortations étroitement liées sans rendre leur rapport plus explicite que le grec.
