  text: τοῦ ἰδίου οἴκου καλῶς προϊστάμενον, τέκνα ἔχοντα ἐν ὑποταγῇ μετὰ πάσης σεμνότητος·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/004.yaml
  text: managing his own household well[a], having his children in submission with all dignity[c][b];
translation:
  language: fr
  text: qu’il dirige bien sa propre maisonnée[a] et ait des enfants soumis, en toute dignité[c][b] ;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qu’il conduise bien sa propre famille » ou « qu’il gouverne bien sa propre maison ».
    reason: lexical_alternative
  - marker: b
    text: Ou « et ait des enfants obéissants ».
    reason: lexical_alternative
  - marker: c
    text: L’expression « en toute dignité » peut décrire la manière dont les enfants sont soumis ou, plus largement, la manière dont l’homme dirige sa maisonnée.
    reason: alternative_reading
lexical_decisions:
- source_word: τοῦ ἰδίου οἴκου
  choice: sa propre maisonnée
  rationale: « Maisonnée » désigne ici l’ensemble familial et domestique placé sous sa responsabilité, plutôt que le bâtiment seul, tout en conservant la force de ἰδίου (« sa propre »).
- source_word: καλῶς
  choice: bien
  rationale: L’adverbe exprime directement la qualité de la conduite exercée et se rend naturellement par « bien ».
- source_word: προϊστάμενον
  choice: qu’il dirige
  rationale: Le verbe exprime une autorité responsable et une conduite effective. « Diriger » reste naturel en français moderne sans durcir le sens en « régner sur » ni l’affaiblir en simple soin.
- source_word: τέκνα ἔχοντα
  choice: tienne ses enfants
  rationale: Dans cette construction avec ἐν ὑποταγῇ, « tenir ses enfants dans… » rend idiomatiquement l’idée de les avoir dans cet état, sans réduire la relation à une simple possession.
- source_word: ἐν ὑποταγῇ
  choice: dans la soumission
  rationale: Cette formulation conserve le substantif grec et son idée d’ordre sous une autorité, sans le réduire à la seule obéissance ponctuelle ni insister exclusivement sur un contrôle extérieur.
- source_word: μετὰ πάσης σεμνότητος
  choice: en toute dignité
  rationale: « Dignité » rend la gravité respectable et la tenue morale exprimées par σεμνότης. La position finale maintient l’ambiguïté quant à son rattachement précis.
theological_decisions:
- issue: Portée du langage relatif à la direction de la maisonnée
  choice: Présenter l’autorité domestique responsable exigée du futur responsable d’Église, sans en tirer ici une doctrine générale de toute autorité familiale.
  alternative: Renforcer le texte en parlant de domination patriarcale, ou l’atténuer en le réduisant à une simple sollicitude.
  rationale: προΐστημι et ὑποταγή expriment une autorité réelle et un ordre domestique, mais ce verset énonce une qualification particulière plutôt qu’un traité complet sur la famille.
- issue: Rattachement de « en toute dignité »
  choice: Conserver une formulation finale qui n’impose pas un seul rattachement syntaxique.
  alternative: Rapporter exclusivement la dignité soit à la soumission des enfants, soit à la manière dont l’homme dirige sa maisonnée.
  rationale: Le grec permet de comprendre la dignité comme caractérisant la tenue des enfants ou, plus largement, la conduite de la maisonnée. La traduction préserve cette tension.
translation_notes:
  register: Français international moderne, digne et accessible. La structure exhortative s’accorde avec le contexte des qualités requises. « Maisonnée » conserve l’étendue domestique de οἶκος, tandis que « dirige » exprime une autorité responsable sans tonalité archaïque. Les trois appels de note figurent dans le texte principal.
