  text: ἔχοντας τὸ μυστήριον τῆς πίστεως ἐν καθαρᾷ συνειδήσει.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/009.yaml
  text: holding the mystery of the faith with a clear conscience[a].
translation:
  language: fr
  text: Ils doivent garder le mystère de la foi avec une conscience pure[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans une conscience pure ».
    reason: Cette formulation reproduit plus directement la préposition grecque ἐν ; « avec » est plus idiomatique en français dans ce contexte.
lexical_decisions:
- source_word: ἔχοντας
  choice: ils doivent garder
  rationale: Le participe présent dépend des exigences formulées dans le contexte précédent à propos des diacres. La tournure « ils doivent garder » restitue naturellement en français cette continuité et exprime une adhésion durable, plutôt qu’une simple possession.
- source_word: μυστήριον
  choice: mystère
  rationale: Dans l’usage paulinien, le terme désigne généralement une vérité divine autrefois cachée et désormais révélée. « Mystère » conserve le terme biblique sans ajouter explicitement cette explication au texte.
- source_word: τῆς πίστεως
  choice: de la foi
  rationale: 'L’article grec favorise ici le sens objectif : la foi chrétienne comme contenu auquel on adhère. La formulation française conserve toutefois la concision de l’original sans exclure toute résonance liée à l’acte de croire.'
- source_word: ἐν καθαρᾷ συνειδήσει
  choice: avec une conscience pure
  rationale: « Avec » rend idiomatiquement la relation exprimée par ἐν, tandis que « conscience pure » reste proche de καθαρᾷ συνειδήσει et convient au registre moral du passage.
theological_decisions:
- issue: Sens de « la foi » dans τῆς πίστεως
  choice: le contenu de la foi chrétienne
  alternative: la foi comme acte de croire ou confiance personnelle
  rationale: Dans ce contexte d’instructions concernant les responsables de l’Église, l’expression désigne très probablement la foi professée. La traduction littérale « de la foi » préserve néanmoins la densité du grec sans transformer le syntagme en terme doctrinal plus technique.
translation_notes:
  register: Français international moderne, clair et digne. La phrase explicite le sujet et la valeur prescriptive que le participe grec reçoit du contexte précédent. « Garder » exprime une adhésion continue sans donner à « mystère » le sens d’un secret ésotérique.
