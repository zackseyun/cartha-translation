  terminology: « Assemblée » est un équivalent défendable et non confessionnel de ἐκκλησία; la note conserve utilement « Église ». « Dieu vivant », « colonne », « soutien » et « vérité » sont précis et idiomatiques. Les notes sont ancrées de manière cohérente et signalent les alternatives sans imposer une interprétation doctrinale.
