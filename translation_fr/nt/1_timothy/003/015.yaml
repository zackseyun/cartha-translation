id: 1TI.3.15
reference: 1 Timothy 3:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐὰν δὲ βραδύνω, ἵνα εἰδῇς πῶς δεῖ ἐν οἴκῳ θεοῦ ἀναστρέφεσθαι, ἥτις ἐστὶν ἐκκλησία θεοῦ ζῶντος, στῦλος καὶ ἑδραίωμα τῆς ἀληθείας·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/015.yaml
  text: But if I am delayed[a], I write so that you may know how one ought to conduct oneself in the household of God, which is the assembly of the living God[b], the pillar and support of the truth.
translation:
  language: fr
  text: Mais si je tarde[a], je t’écris afin que tu saches comment il faut se conduire dans la maison de Dieu, qui est l’assemblée du Dieu vivant[b], la colonne et le soutien de la vérité[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « si je suis retardé »; le grec peut exprimer simplement le fait de tarder ou d’être en retard.
    reason: lexical_alternative
  - marker: b
    text: 'Traditionnellement : « l’Église du Dieu vivant »; on peut aussi traduire « la communauté du Dieu vivant ».'
    reason: lexical_alternative
  - marker: c
    text: Pour « soutien », on propose aussi « fondement », « rempart » ou « contrefort »; le mot grec est rare et désigne ce qui affermit ou soutient.
    reason: lexical_alternative
lexical_decisions:
- source_word: βραδύνω
  choice: je tarde
  rationale: Le verbe est ici intransitif et évoque le retard de Paul à venir. « Je tarde » est naturel et ne suppose pas nécessairement qu’une cause extérieure lui impose ce retard.
- source_word: ἵνα εἰδῇς
  choice: afin que tu saches
  rationale: Cette formulation conserve clairement la valeur de but de la proposition grecque. « Je t’écris » explicite sobrement le verbe sous-entendu par le contexte immédiat.
- source_word: δεῖ … ἀναστρέφεσθαι
  choice: il faut se conduire
  rationale: « Il faut » exprime la nécessité normative de δεῖ, tandis que « se conduire » rend le comportement ou la manière de vivre visés par ἀναστρέφεσθαι.
- source_word: ἐν οἴκῳ θεοῦ
  choice: dans la maison de Dieu
  rationale: « Maison » préserve l’image grecque et peut désigner aussi bien une maisonnée que son cadre; l’apposition qui suit montre qu’il s’agit ici du peuple de Dieu, non simplement d’un bâtiment.
- source_word: ἐκκλησία
  choice: assemblée
  rationale: « Assemblée » rend le sens fondamental du groupe appelé et réuni, sans imposer d’emblée les connotations institutionnelles que peut porter « Église ». La traduction traditionnelle est signalée en note.
- source_word: θεοῦ ζῶντος
  choice: du Dieu vivant
  rationale: Formulation française établie et naturelle, qui conserve l’accent théologique porté par « vivant ».
- source_word: στῦλος
  choice: colonne
  rationale: « Colonne » conserve directement la métaphore architecturale et convient au registre français courant et digne.
- source_word: ἑδραίωμα
  choice: soutien
  rationale: Le terme rare désigne ce qui affermit ou soutient. « Soutien » garde une certaine largeur sémantique sans déterminer excessivement la forme précise de l’image.
- source_word: τῆς ἀληθείας
  choice: de la vérité
  rationale: L’article grec est naturellement rendu; l’expression désigne ici la vérité considérée comme une réalité définie.
theological_decisions:
- issue: Sens ecclésiologique de ἐκκλησία
  choice: assemblée
  alternative: Église; communauté
  rationale: Le choix met au premier plan le peuple réuni par Dieu sans nier sa dimension ecclésiale. « Église » demeure une traduction traditionnelle légitime et figure donc en note.
- issue: Rapport entre la maison de Dieu et l’assemblée
  choice: conserver la proposition relative explicative « qui est »
  alternative: reformuler par « c’est-à-dire » ou séparer les deux expressions
  rationale: La syntaxe maintient l’identification forte opérée par le grec entre la maison de Dieu et l’assemblée du Dieu vivant, sans réduire « maison » à un édifice.
- issue: Portée de « colonne et soutien de la vérité »
  choice: attribuer sans atténuation cette fonction à l’assemblée
  alternative: traduire ἑδραίωμα par « fondement », « rempart » ou « contrefort »
  rationale: Le grec présente bien l’assemblée comme colonne et ἑδραίωμα de la vérité. « Soutien » préserve cette affirmation élevée sans préciser que l’assemblée serait l’origine de la vérité ni trancher l’image plus finement que ne le permet ce terme rare.
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve les métaphores architecturales et domestiques du grec. « Je t’écris » est une explicitation contextuelle nécessaire en français pour que la proposition de but soit autonome dans ce verset; elle reprend l’acte d’écrire mentionné au verset précédent.
