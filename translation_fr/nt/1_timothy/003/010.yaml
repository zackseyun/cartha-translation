  text: καὶ οὗτοι δὲ δοκιμαζέσθωσαν πρῶτον, εἶτα διακονείτωσαν ἀνέγκλητοι ὄντες.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/010.yaml
  text: And these also must first be tested[a]; then let them serve[b], being beyond reproach.
translation:
  language: fr
  text: Eux aussi doivent d’abord être mis à l’épreuve ; ensuite, qu’ils servent[a], s’ils sont irréprochables[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qu’ils servent en tant que diacres ». Le verbe grec signifie « servir » ; dans ce contexte, il peut se rapporter au service des diacres.
    reason: lexical_alternative
  - marker: b
    text: C’est-à-dire qu’aucune accusation fondée ne peut être retenue contre eux ; il ne s’agit pas d’affirmer qu’ils sont sans péché.
    reason: lexical_clarification
lexical_decisions:
- source_word: οὗτοι
  choice: Eux aussi
  rationale: Cette formulation naturelle conserve à la fois la valeur démonstrative et le lien additif avec les personnes dont il vient d’être question, sans ajouter un nom absent du grec.
- source_word: δοκιμαζέσθωσαν
  choice: doivent d’abord être mis à l’épreuve
  rationale: Le verbe désigne un examen destiné à établir l’aptitude ou la valeur d’une personne. « Doivent » rend naturellement en français la force de l’impératif passif.
- source_word: πρῶτον … εἶτα
  choice: d’abord … ensuite
  rationale: 'Ces adverbes rendent clairement l’ordre exigé : l’évaluation précède le service.'
- source_word: διακονείτωσαν
  choice: qu’ils servent
  rationale: Le verbe signifie fondamentalement « servir ». Le contexte concerne les diacres, mais le texte emploie ici un verbe sans répéter explicitement le titre ; la traduction conserve cette forme et signale en note sa portée contextuelle possible.
- source_word: ἀνέγκλητοι
  choice: irréprochables
  rationale: Le terme qualifie des personnes contre lesquelles aucune accusation fondée ne peut être retenue. « Irréprochables » convient au registre des critères de responsabilité sans impliquer une perfection sans péché.
- source_word: ὄντες
  choice: pourvu qu’ils soient
  rationale: Le participe exprime ici la qualité requise qui doit accompagner leur service. Cette tournure idiomatique en français explicite légèrement la valeur circonstancielle sans rattacher artificiellement l’adjectif au seul examen préalable.
theological_decisions:
- issue: Portée générique ou liée à la fonction de διακονείτωσαν
  choice: qu’ils servent
  alternative: qu’ils exercent le ministère de diacre
  rationale: Le contexte donne au service une portée diaconale, mais le grec conserve la forme verbale générale « servir ». Le texte principal préserve cette formulation, tandis que la note indique le sens rendu possible par le contexte.
- issue: Sens moral de ἀνέγκλητοι
  choice: irréprochables
  alternative: sans qu’aucune accusation puisse être retenue contre eux
  rationale: Le terme ne demande pas une perfection absolue ; il indique l’absence de reproche ou d’accusation fondée. La note empêche une lecture impliquant l’absence totale de péché.
translation_notes:
  register: Français international actuel, clair et digne. La phrase conserve la progression du grec et emploie « servir » plutôt qu’un terme ecclésiastique plus chargé. « Pourvu qu’ils soient » rend idiomatiquement la qualité requise exprimée par le participe.
