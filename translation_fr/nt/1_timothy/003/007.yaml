id: 1TI.3.7
reference: 1 Timothy 3:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: δεῖ ⸀δὲ καὶ μαρτυρίαν καλὴν ἔχειν ἀπὸ τῶν ἔξωθεν, ἵνα μὴ εἰς ὀνειδισμὸν ἐμπέσῃ καὶ παγίδα τοῦ διαβόλου.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/007.yaml
  text: And he must also have a good testimony from those outside, so that he may not fall into reproach and the devil’s snare.
translation:
  language: fr
  text: Il faut aussi qu’il ait une bonne réputation auprès des gens de l’extérieur[a], afin qu’il ne tombe pas dans le déshonneur[b] et dans le piège du diable[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « ceux de l’extérieur », c’est-à-dire les personnes qui ne font pas partie de la communauté chrétienne.
    reason: lexical_alternative
  - marker: b
    text: Ou « dans l’opprobre » ou « sous les reproches ».
    reason: lexical_alternative
  - marker: c
    text: Ou « dans le piège du calomniateur », si διάβολος est pris dans son sens générique; il est compris ici comme désignant le diable.
    reason: alternative_reading
lexical_decisions:
- source_word: δεῖ
  choice: Il faut
  rationale: Exprime clairement la nécessité qui régit cette qualification, dans un français naturel et ferme.
- source_word: δὲ καὶ
  choice: aussi
  rationale: Rattache cette exigence aux précédentes et en marque le caractère supplémentaire; le lien discursif est naturellement porté en français par « aussi ».
- source_word: μαρτυρίαν καλὴν ἔχειν
  choice: avoir une bonne réputation
  rationale: Dans ce contexte, μαρτυρία désigne l’appréciation favorable portée sur la personne. « Bonne réputation » est plus idiomatique en français actuel que « bon témoignage », tout en conservant le sens d’une attestation sociale positive.
- source_word: ἀπὸ τῶν ἔξωθεν
  choice: auprès des gens de l’extérieur
  rationale: Désigne ceux qui sont extérieurs à la communauté chrétienne sans ajouter explicitement « l’Église », absent du grec.
- source_word: ἵνα μὴ
  choice: afin qu’il ne
  rationale: Conserve la valeur finale, avec sa possible nuance de conséquence prévenue.
- source_word: εἰς ὀνειδισμὸν ἐμπέσῃ
  choice: tombe dans le déshonneur
  rationale: ὀνειδισμός peut évoquer l’opprobre, le reproche public ou la disgrâce. « Déshonneur » rend naturellement la dimension sociale de honte sans réduire le terme à une simple critique verbale.
- source_word: παγίδα
  choice: piège
  rationale: Rend directement et naturellement la métaphore d’un dispositif qui capture; « piège » est plus courant en français moderne que « filet » ou « lacet ».
- source_word: τοῦ διαβόλου
  choice: du diable
  rationale: L’usage néotestamentaire et le contexte favorisent le référent personnel, le diable, tout en laissant en note la possibilité lexicale de « calomniateur ».
theological_decisions:
- issue: Sens de τοῦ διαβόλου
  choice: le piège du diable, compris comme Satan
  alternative: le piège du calomniateur
  rationale: διάβολος peut lexicalement signifier « calomniateur », mais avec l’article et dans l’usage du Nouveau Testament, le mot désigne couramment le diable. La traduction principale retient ce référent personnel sans supprimer l’autre possibilité lexicale.
- issue: Rapport entre le déshonneur et le piège
  choice: deux dangers coordonnés
  alternative: un déshonneur qui constitue ou conduit au piège du diable
  rationale: Le καί coordonne ὀνειδισμός et παγίς. La traduction conserve cette coordination et n’explicite pas davantage leur rapport causal éventuel.
translation_notes:
  register: Français international moderne, digne et accessible. « Bonne réputation » privilégie l’expression idiomatique tout en reflétant la valeur contextuelle de μαρτυρία. Les formulations ecclésiastiques ajoutées au grec sont évitées, et l’ambiguïté lexicale de διάβολος est signalée en note.
