    rationale: En français courant, croire une personne tend à signifier la tenir pour véridique, plutôt que croire en elle. La tournure ne rend donc pas clairement le Christ comme objet de la foi, valeur de ἐπιστεύθη dans ce contexte.
  - severity: low
    issue: « Il » ne reflète pas explicitement la valeur relative de Ὃς.
    rationale: Le pronom personnel est possible dans une adaptation hymnique, mais « Celui qui » conserve plus directement le relatif du texte critique tout en restant naturel en français.
