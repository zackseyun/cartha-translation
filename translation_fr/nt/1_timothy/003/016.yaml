id: 1TI.3.16
reference: 1 Timothy 3:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ὁμολογουμένως μέγα ἐστὶν τὸ τῆς εὐσεβείας μυστήριον· ⸀Ὃς ἐφανερώθη ἐν σαρκί, ἐδικαιώθη ἐν πνεύματι, ὤφθη ἀγγέλοις, ἐκηρύχθη ἐν ἔθνεσιν, ἐπιστεύθη ἐν κόσμῳ, ἀνελήμφθη ἐν δόξῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/016.yaml
  text: 'And undeniably[a], great is the mystery of godliness:

    He was revealed in flesh,

    was vindicated in spirit,

    was seen by angels,

    was proclaimed among the nations,

    was believed on in the world[d][c][b],

    was taken up in glory.'
translation:
  language: fr
  text: 'Et, de l’aveu de tous, grand est le mystère de la piété :


    Celui qui[a] a été manifesté dans la chair,

    a été reconnu juste dans l’esprit[b],

    a été vu par des anges,

    a été proclamé parmi les nations[c],

    a été l’objet de la foi dans le monde,

    a été élevé dans la gloire[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Quelques manuscrits portent : « Dieu a été manifesté dans la chair. » Le texte grec critique porte « qui », rendu ici par « Celui qui ».'
    reason: textual_variant
  - marker: b
    text: 'Ou : « a été reconnu juste par l’Esprit » ou « dans l’Esprit ». La formule grecque peut désigner l’action du Saint-Esprit ou la sphère de l’existence spirituelle.'
    reason: alternative_reading
  - marker: c
    text: 'Ou : « parmi les non-Juifs ».'
    reason: lexical_alternative
  - marker: d
    text: 'Ou : « a été élevé vers la gloire » ou « a été élevé avec gloire ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁμολογουμένως
  choice: de l’aveu de tous
  rationale: L’adverbe désigne ce qui est reconnu ou confessé d’un commun accord. Cette tournure française actuelle conserve la dimension de reconnaissance commune, plutôt que d’exprimer seulement une certitude abstraite.
- source_word: μέγα ἐστὶν
  choice: grand est
  rationale: L’ordre marqué du grec met « grand » en relief. L’inversion reste naturelle dans cette introduction solennelle et poétique.
- source_word: τὸ τῆς εὐσεβείας μυστήριον
  choice: le mystère de la piété
  rationale: « Mystère » garde le sens paulinien d’une réalité divine autrefois cachée et désormais révélée. Dans les Pastorales, « piété » désigne une relation à Dieu qui se manifeste dans la vie, et non la religion comme simple institution.
- source_word: Ὃς
  choice: Il
  rationale: Le texte critique porte le pronom relatif masculin « qui ». En français, « Il » ouvre naturellement la strophe confessionnelle et signale son référent personnel, le Christ, sans adopter la variante « Dieu ».
- source_word: ἐφανερώθη ἐν σαρκί
  choice: a été manifesté dans la chair
  rationale: Le passif exprime la manifestation publique de celui dont parle la strophe. « Dans la chair » désigne ici son existence humaine corporelle et conserve la formulation concise du grec.
- source_word: ἐδικαιώθη
  choice: a été reconnu juste
  rationale: Ici, le verbe ne signifie pas qu’il serait devenu juste, mais qu’il a été déclaré ou démontré juste. « Reconnu juste » évite les connotations potentiellement trompeuses de « justifié ».
- source_word: ἐν πνεύματι
  choice: dans l’esprit
  rationale: La formule grecque sans article est concise et ambiguë. La minuscule et la préposition « dans » évitent de trancher dans le texte principal entre l’action du Saint-Esprit et la sphère ou le mode d’existence spirituel.
- source_word: ὤφθη ἀγγέλοις
  choice: a été vu par des anges
  rationale: Cette traduction conserve la forme passive et comprend ἀγγέλοις comme désignant les êtres célestes, sens le plus probable dans cette strophe christologique.
- source_word: ἐκηρύχθη ἐν ἔθνεσιν
  choice: a été proclamé parmi les nations
  rationale: « Proclamé » rend la dimension publique de κηρύσσω. « Nations » conserve l’étendue du terme ἔθνη tout en incluant son sens possible de non-Juifs.
- source_word: ἐπιστεύθη ἐν κόσμῳ
  choice: a été cru dans le monde
  rationale: Le passif inhabituel est conservé afin que le Christ demeure l’objet de la foi, comme dans le grec, et que le parallélisme de la strophe reste visible.
- source_word: ἀνελήμφθη ἐν δόξῃ
  choice: a été élevé dans la gloire
  rationale: « Élevé » rend la prise ou l’élévation vers le haut, tandis que « dans la gloire » conserve l’ambiguïté de ἐν entre manière, sphère et destination.
theological_decisions:
- issue: 'Variante textuelle au début de la strophe : Ὃς, θεός ou ὅ'
  choice: Traduire le texte critique Ὃς par le pronom personnel « Il »
  alternative: « Dieu a été manifesté dans la chair » ou « lequel a été manifesté dans la chair »
  rationale: Le SBLGNT porte Ὃς, « qui », et non θεός, « Dieu ». Le français « Il » permet une strophe autonome et personnelle sans introduire dans le texte principal une variante historiquement importante mais non retenue par l’édition source.
- issue: Référent ou valeur de ἐν πνεύματι
  choice: Employer la formulation neutre « dans l’esprit »
  alternative: « par l’Esprit » ou « dans l’Esprit »
  rationale: La syntaxe peut évoquer l’action du Saint-Esprit ou la sphère spirituelle, notamment en contraste avec « la chair ». Le texte principal ne tranche pas cette question théologique que le grec laisse ouverte.
- issue: Valeur de ἐν dans ἀνελήμφθη ἐν δόξῃ
  choice: Conserver « dans la gloire »
  alternative: « élevé vers la gloire » ou « enlevé avec gloire »
  rationale: La préposition peut décrire la sphère ou la manière glorieuse de l’élévation, voire sa destination. La formulation retenue maintient cette tension.
translation_notes:
  register: Français international moderne, digne et légèrement poétique. La structure en six lignes et la répétition de « a été » rendent le parallélisme confessionnel du grec. Les termes traditionnels « mystère », « piété », « chair » et « gloire » sont conservés parce qu’ils demeurent intelligibles et portent ici une densité théologique difficile à remplacer sans paraphrase.
