  text: Ταῦτά σοι γράφω, ἐλπίζων ἐλθεῖν πρὸς σὲ ⸂ἐν τάχει⸃,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/014.yaml
  text: I am writing these things to you[a], hoping to come to you soon,
translation:
  language: fr
  text: Je t’écris ces choses dans l’espoir de venir bientôt[a] auprès de toi,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « rapidement » ; l’expression grecque peut évoquer soit la proximité dans le temps, soit la rapidité de l’action.'
    reason: alternative lexicale
lexical_decisions:
- source_word: Ταῦτά
  choice: ces choses
  rationale: Le démonstratif neutre pluriel renvoie à l’ensemble des instructions données dans la lettre. « Ces choses » conserve le pluriel et la référence épistolaire sans préciser davantage le contenu.
- source_word: σοι
  choice: t’
  rationale: 'Le datif avec γράφω désigne naturellement le destinataire : « je t’écris ».'
- source_word: γράφω
  choice: Je t’écris
  rationale: Le présent convient naturellement à l’acte d’écrire la lettre en cours et donne en français une formulation directe et actuelle.
- source_word: ἐλπίζων
  choice: dans l’espoir de
  rationale: Le participe présent exprime l’espoir qui accompagne l’action d’écrire. Cette tournure est naturelle en français et ne transforme pas cet espoir en certitude.
- source_word: ἐλθεῖν
  choice: venir
  rationale: L’infinitif de ἔρχομαι, associé à πρὸς σέ, exprime le déplacement de l’auteur vers son destinataire.
- source_word: πρὸς σὲ
  choice: auprès de toi
  rationale: πρός avec l’accusatif après un verbe de mouvement indique la direction vers une personne. « Auprès de toi » évite la répétition de « te » tout en conservant l’idée de rejoindre Timothée.
- source_word: ἐν τάχει
  choice: bientôt
  rationale: L’expression peut indiquer soit qu’une chose arrivera sous peu, soit qu’elle se fera rapidement. « Bientôt » convient le mieux au contexte d’un projet de visite, tandis que l’autre nuance est signalée en note.
