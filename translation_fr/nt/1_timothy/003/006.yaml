id: 1TI.3.6
reference: 1 Timothy 3:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: μὴ νεόφυτον, ἵνα μὴ τυφωθεὶς εἰς κρίμα ἐμπέσῃ τοῦ διαβόλου.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/006.yaml
  text: He must not be a recent convert[a], so that he may not become puffed up and fall into the judgment of the devil.
translation:
  language: fr
  text: Il ne doit pas être un converti récent, de peur que, gonflé d’orgueil, il ne tombe sous le jugement du diable.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « qu’il ne tombe sous la même condamnation que le diable » ; autre possibilité : « qu’il ne tombe sous un jugement lié au diable ».'
    reason: alternative_reading
lexical_decisions:
- source_word: νεόφυτον
  choice: nouvellement converti
  rationale: Littéralement « nouvellement planté », le terme désigne ici une personne récemment venue à la foi. « Nouvellement converti » exprime clairement ce sens ecclésial en français moderne.
- source_word: τυφωθεὶς
  choice: gonflé d’orgueil
  rationale: Cette formulation conserve l’image de l’enflure tout en rendant explicite l’idée de suffisance orgueilleuse portée par le verbe.
- source_word: κρίμα
  choice: jugement
  rationale: « Jugement » garde une portée plus large que « condamnation » et préserve l’ambiguïté du grec.
- source_word: τοῦ διαβόλου
  choice: du diable
  rationale: Le génitif grec est ambigu. La formulation française ne précise pas indûment s’il s’agit du jugement subi par le diable ou d’un jugement lié à son action.
- source_word: ἐμπέσῃ
  choice: tombe sous
  rationale: « Tomber sous le jugement » est une tournure française naturelle qui conserve l’image d’une chute dans une situation dangereuse.
- source_word: ἵνα μὴ
  choice: de peur que… ne
  rationale: Cette tournure exprime naturellement en français moderne l’idée de prévention ou de conséquence redoutée.
theological_decisions:
- issue: Sens de l’expression εἰς κρίμα ἐμπέσῃ τοῦ διαβόλου
  choice: tombe sous le jugement du diable
  alternative: tombe sous la même condamnation que le diable ; tombe sous un jugement lié au diable
  rationale: Le génitif τοῦ διαβόλου peut désigner le jugement prononcé contre le diable ou, plus largement, un jugement associé à celui-ci. Le texte principal conserve cette tension, tandis que la note expose les principales compréhensions possibles.
translation_notes:
  register: Français international moderne, clair et digne. La tournure « gonflé d’orgueil » conserve la métaphore grecque sans archaïsme. Le marqueur de note est placé après la proposition ambiguë qu’il explique.
