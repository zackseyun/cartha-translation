lexical_decisions:
- source_word: πάροινον
  choice: adonné au vin
  rationale: L’adjectif désigne une personne portée sur le vin ou associée habituellement à ses excès. « Adonné au vin » exprime naturellement une disposition habituelle sans affirmer que toute consommation de vin est visée.
- source_word: πλήκτην
  choice: violent
  rationale: Le mot désigne littéralement quelqu’un qui frappe. Dans cette liste de qualités, « violent » rend clairement le trait de caractère tout en incluant l’agression physique.
- source_word: ἐπιεικῆ
  choice: doux
  rationale: Le terme évoque la douceur, la modération et une attitude conciliante. « Doux » est bref, naturel et convient au contraste introduit par « mais ».
- source_word: ἄμαχον
  choice: pacifique
  rationale: L’adjectif qualifie une personne qui ne cherche ni combat ni querelle. « Pacifique » conserve ici la forme positive et s’intègre bien à l’énumération.
- source_word: ἀφιλάργυρον
  choice: sans amour de l’argent
  rationale: Le composé grec nie explicitement l’amour de l’argent. Cette formulation conserve l’accent sur l’attachement intérieur plutôt que de le réduire au seul désir de gain.
