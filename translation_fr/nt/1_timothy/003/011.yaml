id: 1TI.3.11
reference: 1 Timothy 3:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: γυναῖκας ὡσαύτως σεμνάς, μὴ διαβόλους, νηφαλίους, πιστὰς ἐν πᾶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/011.yaml
  text: Women likewise must be dignified[a], not slanderers, sober-minded, faithful in all things.
translation:
  language: fr
  text: Les femmes, de même, doivent être dignes de respect[a], non médisantes, sobres et fidèles en toutes choses.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Les épouses, de même, doivent être dignes de respect… » Dans ce contexte, le grec γυναῖκας peut signifier « femmes » ou « épouses »; le texte ne dit pas explicitement « leurs épouses ».'
    reason: alternative_reading
lexical_decisions:
- source_word: γυναῖκας
  choice: Les femmes
  rationale: Le pluriel accusatif de γυνή peut désigner des femmes ou des épouses. En l’absence d’article et de possessif explicite, « les femmes » évite d’ajouter « leurs »; l’autre sens possible est signalé en note.
- source_word: ὡσαύτως
  choice: de même
  rationale: Cette expression marque naturellement en français le parallèle avec les qualifications qui précèdent.
- source_word: σεμνάς
  choice: dignes de respect
  rationale: Cette formulation exprime le sérieux honorable et la respectabilité morale de σεμνός dans un français actuel.
- source_word: μὴ διαβόλους
  choice: non médisantes
  rationale: Employé ici comme qualificatif, διάβολος désigne des personnes qui portent des accusations nuisibles ou calomnieuses; « médisantes » convient à la liste de qualités sans en faire un titre propre.
- source_word: νηφαλίους
  choice: sobres
  rationale: « Sobres » conserve la portée première de νηφάλιος tout en pouvant évoquer la vigilance et la maîtrise de soi.
- source_word: πιστὰς
  choice: fidèles
  rationale: « Fidèles » préserve la gamme de sens de πιστός, notamment la loyauté et le caractère digne de confiance.
- source_word: ἐν πᾶσιν
  choice: en toutes choses
  rationale: Cette traduction garde la portée générale et non limitée de l’expression grecque.
theological_decisions:
- issue: Référent de γυναῖκας dans la liste des qualifications
  choice: Les femmes
  alternative: Les épouses
  rationale: Le grec peut désigner soit des femmes exerçant un service reconnu, soit les épouses des diacres. Puisqu’aucun possessif correspondant à « leurs » n’est exprimé et que ὡσαύτως établit un parallèle, le texte principal reste large et la note conserve l’autre lecture sans trancher la question.
translation_notes:
  register: Français international moderne, clair et digne. La formulation suit étroitement la structure grecque tout en restant naturelle; elle préserve explicitement l’ambiguïté concernant l’identité des femmes.
