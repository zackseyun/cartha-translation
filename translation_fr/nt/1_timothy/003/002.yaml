id: 1TI.3.2
reference: 1 Timothy 3:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: δεῖ οὖν τὸν ἐπίσκοπον ἀνεπίλημπτον εἶναι, μιᾶς γυναικὸς ἄνδρα, νηφάλιον, σώφρονα, κόσμιον, φιλόξενον, διδακτικόν,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/002.yaml
  text: Therefore an overseer must be above reproach[a], the husband of one wife, sober-minded, self-controlled, respectable, hospitable, able to teach,
translation:
  language: fr
  text: Il faut donc que le responsable soit irréprochable, mari d’une seule femme[a], sobre, maître de lui-même, digne de respect, hospitalier et capable d’enseigner.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « homme d’une seule femme ». L’expression peut souligner la fidélité conjugale plutôt que le seul statut matrimonial.
    reason: alternative_reading
lexical_decisions:
- source_word: δεῖ
  choice: il faut
  rationale: Exprime clairement une nécessité, et non un simple conseil, tout en s’intégrant naturellement à la construction française « il faut que ».
- source_word: οὖν
  choice: donc
  rationale: Conserve le lien logique avec ce qui précède dans une formulation française naturelle.
- source_word: ἐπίσκοπον
  choice: responsable
  rationale: Rend la fonction de direction et de surveillance sans importer le titre ecclésiastique plus tardif « évêque » ni employer le peu naturel « surveillant ».
- source_word: ἀνεπίλημπτον
  choice: irréprochable
  rationale: Désigne une personne contre laquelle aucun reproche fondé ne peut être retenu, sans suggérer une perfection absolue.
- source_word: μιᾶς γυναικὸς ἄνδρα
  choice: mari d’une seule femme
  rationale: Suit de près la formulation grecque, explicitement masculine, et laisse ouvertes les différentes interprétations de cette qualification.
- source_word: νηφάλιον
  choice: sobre
  rationale: Préserve l’idée de lucidité et de retenue; dans cette liste de qualités, le terme ne se limite pas nécessairement à l’abstinence d’alcool.
- source_word: σώφρονα
  choice: maître de lui-même
  rationale: Exprime la maîtrise de soi et le jugement discipliné tout en distinguant cette qualité de la sobriété qui précède.
- source_word: κόσμιον
  choice: digne de respect
  rationale: Rend l’idée d’une conduite convenable et ordonnée dans un français courant et digne.
- source_word: φιλόξενον
  choice: hospitalier
  rationale: Terme français concis et usuel pour la disposition à accueillir les hôtes, y compris les étrangers.
- source_word: διδακτικόν
  choice: capable d’enseigner
  rationale: Communique l’aptitude effective à enseigner plutôt qu’une simple disposition à le faire.
theological_decisions:
- issue: Interprétation de μιᾶς γυναικὸς ἄνδρα parmi les qualités requises d’un responsable d’Église
  choice: Conserver dans le texte « mari d’une seule femme »
  alternative: « un homme fidèle à sa femme » ou, plus littéralement, « un homme d’une seule femme »
  rationale: La formule peut viser la fidélité conjugale, exclure la polygamie ou comporter une restriction relative au remariage. La traduction principale en conserve la forme concrète sans trancher entre ces lectures; la note signale l’ambiguïté.
translation_notes:
  register: Français international moderne, clair et digne. La phrase garde la structure d’une liste de qualités tout en évitant les titres confessionnels ou ecclésiastiques anachroniques.
