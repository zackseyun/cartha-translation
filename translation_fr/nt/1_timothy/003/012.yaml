id: 1TI.3.12
reference: 1 Timothy 3:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: διάκονοι ἔστωσαν μιᾶς γυναικὸς ἄνδρες, τέκνων καλῶς προϊστάμενοι καὶ τῶν ἰδίων οἴκων·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/012.yaml
  text: Deacons must be husbands of one wife[a], managing their children and their own households well.
translation:
  language: fr
  text: Les diacres doivent être maris d’une seule femme[a] et bien diriger leurs enfants ainsi que leur propre foyer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « hommes d’une seule femme ». L’expression peut souligner la fidélité conjugale; certains la comprennent plus précisément comme excluant la polygamie ou le remariage.
    reason: Signaler le caractère idiomatique et les principales interprétations possibles sans en imposer une.
lexical_decisions:
- source_word: διάκονοι
  choice: les diacres
  rationale: Dans cette liste de qualités requises pour un service reconnu dans l’Église, le terme désigne les diacres plutôt que des serviteurs au sens général.
- source_word: ἔστωσαν
  choice: doivent être
  rationale: L’impératif présent exprime ici une exigence normative; « doivent être » la rend clairement en français moderne.
- source_word: μιᾶς γυναικὸς ἄνδρες
  choice: maris d’une seule femme
  rationale: Cette formulation proche du grec conserve la référence masculine et l’ambiguïté de l’expression sans la réduire à une interprétation particulière.
- source_word: τέκνων
  choice: leurs enfants
  rationale: Le possessif, implicite dans la construction et éclairé par le membre parallèle, est nécessaire à l’expression naturelle en français.
- source_word: καλῶς
  choice: bien
  rationale: L’adverbe qualifie directement la manière de diriger et se traduit naturellement par « bien ».
- source_word: προϊστάμενοι
  choice: diriger
  rationale: Le participe évoque l’exercice responsable de la conduite et de la surveillance du foyer; « diriger » exprime cette responsabilité sans accent autoritaire excessif.
- source_word: τῶν ἰδίων οἴκων
  choice: leur propre foyer
  rationale: Le grec vise la maisonnée, non le bâtiment. Le singulier distributif français « leur propre foyer » indique le foyer de chacun et reste plus naturel que « leurs propres maisonnées ».
theological_decisions:
- issue: Sens de μιᾶς γυναικὸς ἄνδρες parmi les qualités requises des diacres
  choice: maris d’une seule femme
  alternative: hommes attachés à une seule femme; fidèles à leur femme; mariés une seule fois
  rationale: L’expression grecque est concise et discutée. La traduction principale en conserve la forme et ne tranche pas entre fidélité conjugale, monogamie ou exclusion de certains remariages.
translation_notes:
  register: Français international moderne, clair et digne. « Foyer » rend la dimension familiale et domestique de οἶκος; « ainsi que » clarifie que les enfants et le foyer relèvent tous deux de la responsabilité exprimée par προϊστάμενοι.
