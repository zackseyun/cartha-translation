id: 1TI.3.8
reference: 1 Timothy 3:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Διακόνους ὡσαύτως σεμνούς, μὴ διλόγους, μὴ οἴνῳ πολλῷ προσέχοντας, μὴ αἰσχροκερδεῖς,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/008.yaml
  text: Deacons likewise must be dignified[a], not double-tongued, not devoted to much wine, not greedy for shameful gain[c][b],
translation:
  language: fr
  text: Les diacres, de même, doivent être respectables, ne pas tenir un double langage[a], ne pas s’adonner à beaucoup de vin[b], ni être avides de gains honteux[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ne pas dire une chose à quelqu’un et autre chose à quelqu’un d’autre ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « ne pas être attachés à beaucoup de vin ».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « ne pas rechercher des profits déshonorants ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Διακόνους
  choice: les diacres
  rationale: Dans cette liste parallèle à celle des responsables d’Église, le terme désigne vraisemblablement une fonction reconnue. « Diacres » préserve cette valeur contextuelle sans préciser davantage la structure de cette fonction.
- source_word: ὡσαύτως
  choice: de même
  rationale: Cette expression relie les exigences concernant les diacres à celles qui viennent d’être données pour les responsables, tout en introduisant un nouveau groupe.
- source_word: σεμνούς
  choice: respectables
  rationale: Le mot évoque une conduite honorable qui inspire le respect, sans suggérer une gravité austère. « Respectables » est naturel et clair en français actuel.
- source_word: μὴ διλόγους
  choice: ne pas tenir un double langage
  rationale: 'Cette expression française restitue l’image d’une parole duplicite : dire des choses différentes selon les interlocuteurs.'
- source_word: μὴ οἴνῳ πολλῷ προσέχοντας
  choice: ne pas s’adonner à beaucoup de vin
  rationale: προσέχω exprime ici un attachement ou une application persistante. « S’adonner à » conserve cette idée sans introduire une catégorie clinique moderne, tandis que « beaucoup » rend πολλῷ.
- source_word: μὴ αἰσχροκερδεῖς
  choice: ni être avides de gains honteux
  rationale: Le terme associe le désir du gain à son caractère bas ou déshonorant. Cette formulation conserve à la fois l’avidité et le jugement moral présents dans le grec.
theological_decisions:
- issue: Valeur ecclésiale de διάκονος
  choice: Traduire par « diacres » comme désignation d’une fonction reconnue
  alternative: « serviteurs » ou « ministres »
  rationale: Le contexte présente une série de qualités requises, parallèle à celle des responsables mentionnés auparavant. « Diacres » rend cette spécificité contextuelle sans importer les structures détaillées de traditions ecclésiales ultérieures.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve la structure concise d’une liste de qualités requises, tout en ajoutant « doivent être » pour rendre explicite en français le verbe sous-entendu en grec. Les marqueurs de notes sont placés directement après les expressions concernées.
