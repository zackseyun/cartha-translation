id: 1TI.3.5
reference: 1 Timothy 3:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: (εἰ δέ τις τοῦ ἰδίου οἴκου προστῆναι οὐκ οἶδεν, πῶς ἐκκλησίας θεοῦ ἐπιμελήσεται;)
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/005.yaml
  text: But if someone does not know how to manage his own household[c][b][a], how will he care for God’s church?
translation:
  language: fr
  text: Mais si quelqu’un ne sait pas diriger son propre foyer[a], comment prendra-t-il soin de l’Église de Dieu[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « être à la tête de sa propre maison » ; ici, « maison » désigne le foyer ou la maisonnée.
    reason: lexical_alternative
  - marker: b
    text: Ou « l’assemblée de Dieu ».
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δέ
  choice: Mais si
  rationale: Cette formulation naturelle conserve à la fois la condition introduite par εἰ et le léger contraste marqué par δέ avec ce qui précède.
- source_word: τις
  choice: quelqu’un
  rationale: Le pronom indéfini désigne de manière générale une personne envisagée pour la charge de responsable, sans ajouter dans ce mot une précision absente du grec.
- source_word: τοῦ ἰδίου οἴκου
  choice: son propre foyer
  rationale: Dans ce contexte, οἶκος désigne les personnes et les affaires domestiques placées sous la responsabilité de quelqu’un, et non le seul bâtiment. « Foyer » est courant et plus large que la seule famille biologique.
- source_word: προστῆναι
  choice: diriger
  rationale: Le verbe προΐστημι exprime ici la conduite responsable du foyer. « Diriger » rend cette fonction sans la durcir en domination autoritaire.
- source_word: οὐκ οἶδεν
  choice: ne sait pas
  rationale: Avec l’infinitif « diriger », cette tournure française exprime naturellement le sens idiomatique de savoir accomplir une tâche.
- source_word: πῶς
  choice: comment prendra-t-il
  rationale: La question rhétorique tire une conséquence de la gestion du foyer pour la responsabilité envers l’Église, tout en conservant la valeur future du grec.
- source_word: ἐκκλησίας θεοῦ
  choice: l’Église de Dieu
  rationale: Cette expression française établie rend naturellement le génitif et le sens ecclésial de ἐκκλησία dans le contexte des Pastorales.
- source_word: ἐπιμελήσεται
  choice: prendra-t-il soin de
  rationale: ἐπιμελέομαι désigne une attention concrète et bienveillante. « Prendre soin de » préserve cette dimension pastorale et la distingue du verbe employé pour diriger le foyer.
theological_decisions:
- issue: Rapport entre la direction du foyer et la responsabilité envers l’Église
  choice: Employer « diriger » pour le foyer et « prendre soin de » pour l’Église.
  alternative: Employer le même verbe, par exemple « diriger », dans les deux propositions.
  rationale: Le grec emploie deux verbes distincts, προΐστημι et ἐπιμελέομαι. Maintenir cette différence préserve l’analogie sans réduire le service de l’Église à une simple administration ou à l’exercice du pouvoir.
- issue: Genre du sujet indéfini
  choice: Employer « quelqu’un », puis le masculin singulier grammatical dans « prendra-t-il ».
  alternative: Reformuler entièrement au pluriel ou employer explicitement « un homme ».
  rationale: τις est indéfini, tandis que la construction grecque et le contexte immédiat des critères applicables au responsable sont au masculin singulier. La formulation retenue évite à la fois d’ajouter « un homme » au texte et d’effacer la forme contextuelle.
translation_notes:
  register: Français international moderne, clair et digne. « Foyer » est préféré à « maisonnée », plus précis mais moins courant, et à « maison », qui pourrait être compris comme le bâtiment. La distinction entre « diriger » et « prendre soin de » suit les deux verbes grecs et conserve la tension entre conduite responsable et sollicitude pastorale.
