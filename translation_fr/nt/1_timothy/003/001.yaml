id: 1TI.3.1
reference: 1 Timothy 3:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Πιστὸς ὁ λόγος· εἴ τις ἐπισκοπῆς ὀρέγεται, καλοῦ ἔργου ἐπιθυμεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/001.yaml
  text: 'This saying is trustworthy: if anyone aspires to oversight[b][a], he desires a good work.'
translation:
  language: fr
  text: 'Cette parole est digne de confiance : si quelqu’un aspire à une fonction de supervision[a], il désire une belle tâche[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « à la charge de responsable » ; traditionnellement : « à l’épiscopat ».'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « une bonne œuvre » ou « une noble tâche ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πιστὸς ὁ λόγος
  choice: Cette parole est digne de confiance
  rationale: Cette tournure rend naturellement la formule des épîtres pastorales qui présente une affirmation comme fiable. « Parole » conserve ici le sens de λόγος sans le réduire à un simple mot.
- source_word: εἴ τις
  choice: si quelqu’un
  rationale: Le pronom indéfini τις a ici une portée générique. « Quelqu’un » traduit le grec sans introduire dans cette proposition une précision masculine qu’il n’exprime pas à lui seul.
- source_word: ἐπισκοπῆς
  choice: une fonction de supervision
  rationale: Le nom désigne la supervision ou la responsabilité exercée par un responsable. Cette formulation maintient le lien avec la fonction sans importer le sens institutionnel plus tardif d’« épiscopat ».
- source_word: ὀρέγεται
  choice: aspire à
  rationale: Le verbe évoque le fait de tendre vers quelque chose et, par extension, d’y aspirer. Cette expression est naturelle en français moderne.
- source_word: καλοῦ ἔργου
  choice: une belle œuvre
  rationale: καλός peut signifier bon, beau, noble ou honorable. « Belle œuvre » reste proche de la formulation grecque et présente cette responsabilité comme un travail de valeur, non comme un simple rang.
- source_word: ἐπιθυμεῖ
  choice: il désire
  rationale: Le verbe exprime ici positivement le désir. « Il désire » conserve le parallélisme avec « aspire à » sans en renforcer artificiellement l’intensité.
theological_decisions:
- issue: Faut-il traduire ἐπισκοπῆς au moyen d’un titre ecclésiastique fixé par la tradition ultérieure ?
  choice: une fonction de supervision
  alternative: la charge de responsable ; l’épiscopat
  rationale: Le terme grec peut désigner la supervision ou la fonction qui s’y rattache, sans définir à lui seul une structure ecclésiastique ultérieure. La traduction choisie préserve cette ouverture et évite d’imposer une conception confessionnelle du ministère.
- issue: Faut-il donner un sens explicitement masculin à εἴ τις ?
  choice: si quelqu’un
  alternative: si un homme
  rationale: Le pronom indéfini est générique dans cette proposition. La traduction ne tranche donc pas, à partir de ce seul pronom, les questions plus larges liées aux qualifications énoncées dans les versets suivants.
translation_notes:
  register: Français international moderne, clair et digne. « Fonction de supervision » évite à la fois le vocabulaire institutionnel tardif et le mot « surveillant », qui peut aujourd’hui évoquer surtout les milieux scolaire ou carcéral. La structure parallèle « aspire… désire » reflète les deux verbes grecs.
