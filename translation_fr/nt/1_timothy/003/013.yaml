id: 1TI.3.13
reference: 1 Timothy 3:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οἱ γὰρ καλῶς διακονήσαντες βαθμὸν ἑαυτοῖς καλὸν περιποιοῦνται καὶ πολλὴν παρρησίαν ἐν πίστει τῇ ἐν Χριστῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/013.yaml
  text: For those who have served well obtain for themselves a good standing and great boldness in the faith that is in Messiah Jesus[a][b][c].
translation:
  language: fr
  text: En effet, ceux qui ont bien servi s’acquièrent une position honorable et une grande assurance[a] dans la foi qui est en Jésus le Messie[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une grande hardiesse » ou « une grande confiance » ; le mot grec peut aussi évoquer la franchise et la liberté de parole.
    reason: lexical_alternative
  - marker: b
    text: Ou « dans la fidélité qui est en Jésus le Messie ». Le grec πίστις peut signifier « foi », « confiance » ou « fidélité ».
    reason: alternative_reading
  - marker: c
    text: Le terme grec Χριστός est rendu ici par « le Messie » parce qu’il fonctionne comme un titre.
    reason: lexical_alternative
lexical_decisions:
- source_word: διακονήσαντες
  choice: ont bien servi
  rationale: Le verbe signifie « servir » ou « exercer un service ». Cette formulation renvoie naturellement aux personnes chargées du service dans le contexte, sans transformer le verbe lui-même en titre de fonction.
- source_word: βαθμὸν ... καλὸν
  choice: une position honorable
  rationale: βαθμός peut désigner littéralement une marche, puis métaphoriquement une position ou un rang. « Une position honorable » exprime ici l'estime acquise par un bon service sans imposer l'idée d'une promotion ecclésiastique.
- source_word: περιποιοῦνται
  choice: acquièrent pour eux-mêmes
  rationale: Cette formulation conserve la valeur réfléchie de la voix moyenne et le sens d'acquérir ou de gagner.
- source_word: παρρησίαν
  choice: assurance
  rationale: Dans ce contexte, le terme évoque une liberté confiante et courageuse. « Assurance » est naturel en français moderne, tandis qu'une note préserve les nuances de hardiesse et de franchise.
- source_word: πίστει
  choice: foi
  rationale: « Foi » est le sens le plus naturel ici et conserve la formulation théologique du texte, sans exclure la nuance possible de fidélité signalée en note.
- source_word: τῇ ἐν Χριστῷ Ἰησοῦ
  choice: qui est en Jésus le Messie
  rationale: La proposition relative rend le lien grammatical entre l'article grec et « foi ». L'ordre français « Jésus le Messie » est naturel et conserve à Χριστός sa valeur de titre.
- source_word: Χριστῷ
  choice: le Messie
  rationale: Χριστός est ici rendu selon sa valeur titulaire, « le Messie », plutôt que simplement translittéré par « Christ ».
theological_decisions:
- issue: Sens de πίστις dans ἐν πίστει τῇ ἐν Χριστῷ Ἰησοῦ
  choice: foi
  alternative: fidélité
  rationale: Le contexte permet de comprendre soit la foi placée en Jésus le Messie, soit la fidélité vécue en lui. Le texte principal retient le sens le plus courant, « foi », et la note maintient l'autre possibilité sans trancher une ambiguïté réelle.
- issue: Portée de βαθμὸν καλὸν
  choice: position honorable
  alternative: bon rang
  rationale: Le verset affirme un bénéfice lié au service bien accompli, mais ne précise pas qu'il s'agit d'une promotion dans une hiérarchie ecclésiastique. Une formulation plus générale évite d'ajouter cette conclusion.
translation_notes:
  register: Français international moderne, naturel et digne. « En effet » rend γάρ sans exiger en français une proposition précédente introduite par « car ». La tournure « Jésus le Messie » évite l'expression peu idiomatique « Messie Jésus » tout en conservant le titre. Les notes maintiennent les ambiguïtés lexicales de παρρησία et πίστις.
