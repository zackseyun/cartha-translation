id: 1TI.2.4
reference: 1 Timothy 2:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὃς πάντας ἀνθρώπους θέλει σωθῆναι καὶ εἰς ἐπίγνωσιν ἀληθείας ἐλθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/004.yaml
  text: who desires all people to be saved and to come to the knowledge of the truth[a][b].
translation:
  language: fr
  text: lui qui désire que tous les êtres humains soient sauvés et parviennent à la connaissance de la vérité[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « veut que tous les êtres humains soient sauvés ». Le verbe grec peut aussi se traduire par « veut » ; « désire » évite de trancher au-delà du texte les débats théologiques concernant la volonté divine.
    reason: lexical_alternative
  - marker: b
    text: Ou « parviennent à la pleine connaissance de la vérité ». Le nom grec peut comporter la nuance d’une connaissance plus pleine ou plus complète.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς
  choice: lui qui
  rationale: Le pronom relatif renvoie à Dieu au verset précédent. « lui qui » maintient clairement ce lien tout en formant une proposition naturelle en français lorsqu’elle est lue avec son contexte.
- source_word: πάντας ἀνθρώπους
  choice: tous les êtres humains
  rationale: La tournure grecque désigne ici l’ensemble des humains, sans se limiter aux hommes de sexe masculin. Cette formulation moderne en conserve directement la portée universelle.
- source_word: θέλει
  choice: désire
  rationale: θέλω peut exprimer le fait de vouloir ou de désirer. « désire » rend cette volonté sans transformer le verbe en terme technique qui trancherait les débats sur la volonté divine.
- source_word: σωθῆναι
  choice: soient sauvés
  rationale: L’infinitif passif de σῴζω a ici son sens sotériologique usuel ; « être sauvés » est l’équivalent français direct et reconnu.
- source_word: εἰς ἐπίγνωσιν ἀληθείας
  choice: à la connaissance de la vérité
  rationale: ἐπίγνωσις peut désigner la connaissance, la reconnaissance ou une connaissance pleine. La formulation retenue est idiomatique et n’impose pas dans le texte principal la nuance plus forte de plénitude.
- source_word: ἐλθεῖν
  choice: parviennent
  rationale: Avec εἰς, ἔρχομαι exprime idiomatiquement l’accès à un état ou à une réalité. « parvenir à » est plus naturel en français que le calque « venir à ».
theological_decisions:
- issue: Portée de πάντας ἀνθρώπους et volonté salvatrice de Dieu
  choice: Traduire directement par « tous les êtres humains » et rendre θέλει par « désire » afin de conserver la portée universelle et la tension théologique du texte.
  alternative: « toutes sortes de personnes » ; « veut que tous les êtres humains soient sauvés »
  rationale: Le grec énonce naturellement une portée universelle. La traduction ne doit ni restreindre πάντας à des catégories humaines ni donner à θέλει un sens technique plus précis que celui qu’impose le contexte.
translation_notes:
  register: Français international moderne, naturel et digne. « Êtres humains » évite l’ambiguïté de genre de « hommes » ; « parviennent à » restitue idiomatiquement le mouvement figuré exprimé par ἐλθεῖν avec εἰς.
