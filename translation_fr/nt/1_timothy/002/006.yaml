  source_fidelity: Le texte rend fidèlement le participe relatif δοὺς (« qui s’est donné »), le réfléchi emphatique ἑαυτόν (« lui-même »), ἀντίλυτρον (« en rançon ») et ὑπὲρ πάντων (« pour tous »). La portée universelle demeure intacte. « Le témoignage rendu aux temps fixés » traite de façon défendable la construction elliptique τὸ μαρτύριον καιροῖς ἰδίοις, sans identifier indûment le témoin ni l’agent qui fixe les temps.
  naturalness: Le français est moderne, intelligible et d’un registre biblique sobre. « S’est donné lui-même en rançon » est idiomatique. Les deux-points aident le lecteur à percevoir le lien appositionnel condensé de la dernière expression grecque; « témoignage rendu » constitue une explicitation légère et naturelle en français.
  terminology: « Rançon » conserve le sens rédempteur du terme sans imposer une formulation doctrinale développée. « Pour tous » préserve volontairement l’ambiguïté de πάντων. « Temps fixés » rend convenablement la notion de temps appropriés ou désignés dans καιροῖς ἰδίοις.
