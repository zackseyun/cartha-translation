id: 1TI.2.6
reference: 1 Timothy 2:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ δοὺς ἑαυτὸν ἀντίλυτρον ὑπὲρ πάντων, τὸ μαρτύριον καιροῖς ἰδίοις·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/006.yaml
  text: who gave himself as a ransom for all[c][b][a], the testimony at the proper times.
translation:
  language: fr
  text: 'qui s’est donné lui-même en rançon pour tous[a] : le témoignage rendu aux temps fixés[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en faveur de tous ». « Pour tous » conserve la portée générale du grec sans préciser s’il s’agit de chaque personne ou de toutes les catégories de personnes.
    reason: alternative_reading
  - marker: b
    text: Littéralement, « le témoignage aux temps qui lui sont propres ». L’expression grecque est condensée; elle peut présenter le don de soi du Christ comme le témoignage rendu aux moments fixés.
    reason: lexical_alternative
lexical_decisions:
- source_word: δοὺς
  choice: qui s’est donné
  rationale: Le participe aoriste se rattache à « l’homme Christ Jésus » du verset précédent. Une proposition relative est naturelle en français et rend clairement l’acte volontaire.
- source_word: ἑαυτὸν
  choice: lui-même
  rationale: Le pronom réfléchi souligne que le Christ offre sa propre personne; « lui-même » conserve cette insistance.
- source_word: ἀντίλυτρον
  choice: en rançon
  rationale: Le terme désigne le prix versé pour libérer et comporte une nuance d’échange ou de substitution. « En rançon » en exprime le noyau sans transformer la traduction en explication doctrinale.
- source_word: ὑπὲρ πάντων
  choice: pour tous
  rationale: « Pour » peut exprimer l’action en faveur d’autrui, tandis que « tous » conserve la portée large de πάντων sans trancher les débats ultérieurs sur son extension précise.
- source_word: τὸ μαρτύριον
  choice: le témoignage rendu
  rationale: Le groupe nominal est condensé et probablement appositionnel ou récapitulatif. « Le témoignage rendu » explicite en français l’idée testimoniale sans préciser indûment qui le rend.
- source_word: καιροῖς ἰδίοις
  choice: aux temps fixés
  rationale: Le pluriel désigne les moments appropriés ou établis. « Aux temps fixés » est naturel et laisse implicite, comme le grec, l’agent qui les fixe.
theological_decisions:
- issue: Portée de πάντων concernant la rançon du Christ
  choice: pour tous
  alternative: pour tous les êtres humains; pour toutes sortes de personnes
  rationale: Le texte emploie une formulation universelle mais ne précise pas ici si « tous » doit être défini selon l’une ou l’autre construction doctrinale. La traduction en maintient l’ampleur et la tension.
- issue: Force substitutive de ἀντίλυτρον
  choice: en rançon
  alternative: comme rançon d’échange; en rançon à la place de tous
  rationale: Le composé comporte une nuance d’échange, mais la développer dans le corps du texte imposerait une interprétation plus explicite que la formulation grecque.
- issue: Rapport syntaxique de τὸ μαρτύριον avec ce qui précède
  choice: ponctuation appositionnelle par deux-points et « le témoignage rendu »
  alternative: « tel est le témoignage donné aux temps fixés »; « le témoignage aux temps qui lui sont propres »
  rationale: Le grec est fortement condensé. Les deux-points signalent que le témoignage se rapporte au don de soi du Christ, tout en évitant de définir plus précisément la nature exacte de l’apposition ou l’agent du témoignage.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation garde l’insistance de « lui-même », le pluriel de « temps » et la compression relative de la dernière proposition, tout en rendant son lien appositionnel intelligible.
