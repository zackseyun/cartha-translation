source:
  edition: SBLGNT
  text: ὡσαύτως ⸀καὶ γυναῖκας ἐν καταστολῇ κοσμίῳ μετὰ αἰδοῦς καὶ σωφροσύνης κοσμεῖν ἑαυτάς, μὴ ἐν πλέγμασιν ⸀καὶ ⸀χρυσίῳ ἢ μαργαρίταις ἢ ἱματισμῷ πολυτελεῖ,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/009.yaml
  text: Likewise also[a], women are to adorn themselves in respectable clothing, with modesty and self-control, not with braided hair and gold or pearls or expensive clothing[b],
translation:
  language: fr
  text: De même, les femmes doivent aussi se parer d’une tenue convenable[a], avec pudeur et maîtrise de soi, et non de coiffures tressées, d’or, de perles ou de vêtements coûteux[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « d’une tenue appropriée » ou « d’un habillement décent ».
    reason: lexical_alternative
  - marker: b
    text: L’expression « coiffures tressées, or, perles ou vêtements coûteux » vise probablement l’étalage ostentatoire plutôt qu’elle n’interdit tout usage de tresses ou de bijoux en toutes circonstances.
    reason: cultural_note
lexical_decisions:
- source_word: ὡσαύτως καὶ γυναῖκας
  choice: De même, les femmes aussi
  rationale: « De même » rend ὡσαύτως et relie l’instruction à l’exhortation précédente; la place de « aussi » auprès de « les femmes » restitue naturellement en français la valeur additive de καί. Γυναῖκας désigne ici les femmes en général, aucun indice matrimonial n’imposant « épouses ».
- source_word: ἐν καταστολῇ κοσμίῳ
  choice: d’une tenue convenable
  rationale: Καταστολή désigne ici la tenue ou l’habillement, tandis que κόσμιος exprime ce qui est ordonné, approprié et respectable. « Tenue convenable » est clair et digne en français contemporain.
- source_word: μετὰ αἰδοῦς
  choice: avec pudeur
  rationale: Αἰδώς évoque une réserve morale qui retient de ce qui serait déplacé. « Pudeur » conserve cette dimension de comportement et de présentation sans la réduire à un simple style vestimentaire.
- source_word: σωφροσύνης
  choice: maîtrise de soi
  rationale: Σωφροσύνη associe jugement sain, mesure et retenue. « Maîtrise de soi » en exprime clairement la dimension pratique.
- source_word: κοσμεῖν ἑαυτάς
  choice: doivent se parer
  rationale: Κοσμεῖν signifie orner, arranger ou parer. « Se parer » maintient le lien lexical avec l’apparence extérieure et le contraste qui suit; « doivent » explicite en français la portée exhortative de la construction.
- source_word: μὴ ἐν πλέγμασιν
  choice: non de coiffures tressées
  rationale: Πλέγματα désigne des arrangements tressés, vraisemblablement des coiffures élaborées. « Coiffures tressées » est plus explicite et naturel que le seul mot « tresses », tout en conservant l’image grecque.
- source_word: χρυσίῳ
  choice: d’or
  rationale: Le terme désigne l’or employé comme parure sans préciser la forme des ornements; la traduction reste donc volontairement générale.
- source_word: μαργαρίταις
  choice: de perles
  rationale: Il s’agit du sens lexical ordinaire, dans une liste de parures luxueuses.
- source_word: ἱματισμῷ πολυτελεῖ
  choice: de vêtements coûteux
  rationale: Ἱματισμός désigne les vêtements ou l’habillement et πολυτελής ce qui est de grand prix. « Vêtements coûteux » restitue directement la critique de l’étalage de richesse.
theological_decisions:
- issue: Le verset vise-t-il les femmes en général ou uniquement les épouses?
  choice: les femmes en général
  alternative: les épouses
  rationale: Le pluriel γυναῖκας figure dans des instructions générales et aucun marqueur contextuel ne limite explicitement le propos aux femmes mariées. « Femmes » préserve donc l’étendue naturelle du grec.
- issue: L’énumération constitue-t-elle une interdiction absolue de toute tresse, de tout or et de toute perle?
  choice: Le texte oppose une présentation convenable et maîtrisée à l’étalage ostentatoire, tout en conservant la forme négative de l’énumération.
  alternative: Une interdiction universelle et absolue de chaque élément mentionné, quelles que soient les circonstances.
  rationale: La syntaxe met en contraste la tenue convenable, la pudeur et la maîtrise de soi avec des signes culturellement associés au luxe et à l’ostentation. Le corps du texte ne rajoute cependant aucun qualificatif interprétatif à l’interdiction; la note expose seulement sa portée contextuelle probable.
translation_notes:
  register: Français international contemporain, naturel et digne. La formulation garde le contraste rhétorique du grec et sa liste concrète, sans transformer dans le corps du verset l’interdiction en simple conseil. La virgule finale est conservée parce que le verset se poursuit syntaxiquement au verset 10.
