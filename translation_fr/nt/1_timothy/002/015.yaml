id: 1TI.2.15
reference: 1 Timothy 2:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: σωθήσεται δὲ διὰ τῆς τεκνογονίας, ἐὰν μείνωσιν ἐν πίστει καὶ ἀγάπῃ καὶ ἁγιασμῷ μετὰ σωφροσύνης.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/015.yaml
  text: Yet she will be saved through childbearing[c][b][a], if they continue in faith and love and holiness with self-control.
translation:
  language: fr
  text: Pourtant, elle sera sauvée par la maternité[a][c], si elles persévèrent dans la foi[b], l’amour et la sainteté, avec maîtrise de soi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « par la naissance de l’enfant ». Certains comprennent cette expression comme l’évocation d’une naissance particulière, peut-être celle du Messie; elle peut aussi désigner la maternité en général.
    reason: alternative_reading
  - marker: b
    text: Le mot grec traduit par « foi » peut aussi signifier « fidélité » ici.
    reason: lexical_alternative
  - marker: c
    text: Le grec passe du singulier (« elle sera sauvée ») au pluriel (« si elles persévèrent »).
    reason: lexical_alternative
lexical_decisions:
- source_word: σωθήσεται
  choice: sera sauvée
  rationale: Le futur passif de σῴζω est rendu dans son sens paulinien habituel, sans le réduire à une protection physique pendant l’accouchement.
- source_word: δὲ
  choice: Pourtant
  rationale: Marque le contraste modéré avec ce qui précède, sans le durcir.
- source_word: διὰ τῆς τεκνογονίας
  choice: par la maternité
  rationale: τεκνογονία désigne le fait d’avoir ou de mettre au monde des enfants. « La maternité » est naturel en français et assez large pour ne pas limiter l’expression au seul moment de l’accouchement; la possibilité d’une naissance particulière est signalée en note.
- source_word: ἐὰν
  choice: si
  rationale: Rend directement la condition introduite par ἐάν.
- source_word: μείνωσιν
  choice: elles persévèrent
  rationale: Exprime le maintien durable dans les qualités énumérées; le féminin pluriel explicite le référent naturel en français tout en conservant le passage du singulier au pluriel.
- source_word: ἐν πίστει
  choice: dans la foi
  rationale: Rend le sens usuel de πίστις, tout en signalant en note la nuance possible de fidélité.
- source_word: ἀγάπῃ
  choice: l’amour
  rationale: Équivalent français courant et précis d’ἀγάπη.
- source_word: ἁγιασμῷ
  choice: la sainteté
  rationale: Expression naturelle dans une liste de qualités spirituelles, moins technique que « sanctification ».
- source_word: μετὰ σωφροσύνης
  choice: avec maîtrise de soi
  rationale: Rend clairement la retenue, le jugement équilibré et la maîtrise personnelle exprimés par σωφροσύνη.
theological_decisions:
- issue: Passage du singulier « elle sera sauvée » au pluriel « si elles persévèrent »
  choice: Conserver le changement grammatical du singulier au pluriel.
  alternative: Harmoniser les deux membres en parlant partout de « la femme » ou des « femmes ».
  rationale: Le grec passe réellement du singulier au pluriel. Maintenir ce décalage préserve la tension interprétative entre la femme évoquée auparavant, éventuellement Ève, et les femmes en général.
- issue: Sens de « sauvée par la maternité »
  choice: Conserver « sauvée » et une formulation non explicative de τεκνογονία.
  alternative: « protégée pendant l’accouchement », « sauvée en assumant son rôle de mère » ou « sauvée par la naissance du Messie ».
  rationale: Le texte ne précise ni une protection physique, ni une vocation maternelle comme moyen de salut, ni explicitement une naissance messianique. La traduction ne tranche donc pas cette difficulté théologique.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve le contraste, la condition et le changement de nombre du grec. « Maternité » évite le tour peu idiomatique « enfantement » et ne réduit pas τεκνογονία à la sécurité lors de l’accouchement.
