  to: C’est pour cela[a] que j’ai été établi héraut et apôtre — je dis la vérité, je ne mens pas —, enseignant des non-Juifs[b] dans la foi[c] et la vérité.
  rationale: 'La révision rétablit « enseignant » comme correspondant nominal de διδάσκαλος et préserve ainsi la triple apposition du grec : « héraut », « apôtre », « enseignant ». Les notes conservent les alternatives pertinentes sans surinterpréter le référent de εἰς ὃ ni le sens possible de πίστις.'
