  text: εἰς ὃ ἐτέθην ἐγὼ κῆρυξ καὶ ἀπόστολος— ἀλήθειαν ⸀λέγω, οὐ ψεύδομαι— διδάσκαλος ἐθνῶν ἐν πίστει καὶ ἀληθείᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/007.yaml
  text: For this I was appointed a herald and an apostle—I am telling the truth[c][b][a]; I am not lying—a teacher of the Gentiles in faith and truth.
translation:
  language: fr
  text: C’est pour cela[a] que j’ai été établi héraut et apôtre — je dis la vérité, je ne mens pas —, enseignant des non-Juifs[b] dans la foi[c] et la vérité.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « C’est à cette fin » ; le pronom peut renvoyer au message ou au but mentionné juste avant.
    reason: lexical_alternative
  - marker: b
    text: Ou « des nations ».
    reason: lexical_alternative
  - marker: c
    text: Ou « dans la fidélité et la vérité ».
    reason: alternative_reading
lexical_decisions:
- source_word: εἰς ὃ
  choice: C’est pour cela
  rationale: L’expression renvoie à la proclamation et au dessein de salut évoqués auparavant. « C’est pour cela » est naturel en français et conserve la valeur de but, sans préciser davantage que le grec.
- source_word: ἐτέθην
  choice: j’ai été établi
  rationale: Le passif de τίθημι exprime ici l’établissement ou la désignation à une mission, non un placement physique. « Établi » garde la forme passive et convient au registre apostolique.
- source_word: κῆρυξ
  choice: héraut
  rationale: κῆρυξ désigne celui qui fait publiquement une proclamation au nom d’un autre. « Héraut » conserve cette nuance de représentant mandaté mieux que « prédicateur ».
- source_word: ἀπόστολος
  choice: apôtre
  rationale: Dans cette déclaration de Paul sur sa mission, « apôtre » est le titre français reçu et le correspondant précis de ἀπόστολος.
- source_word: ἀλήθειαν λέγω, οὐ ψεύδομαι
  choice: je dis la vérité, je ne mens pas
  rationale: Cette formulation directe et actuelle reproduit la double affirmation emphatique du grec.
- source_word: διδάσκαλος ἐθνῶν
  choice: chargé d’enseigner les non-Juifs
  rationale: Le grec présente Paul comme enseignant des ἔθνη. Cette tournure française naturelle conserve la fonction d’enseignement, tandis que « non-Juifs » explicite le référent habituel de ἔθνη dans ce contexte paulinien.
- source_word: ἐν πίστει καὶ ἀληθείᾳ
  choice: dans la foi et la vérité
  rationale: La traduction formellement proche laisse ouverte la relation exacte de la formule avec la mission d’enseignement et rend πίστις par son équivalent français habituel, « foi ».
theological_decisions:
- issue: Sens de ἐθνῶν dans la mission de Paul
  choice: les non-Juifs
  alternative: les nations
  rationale: Dans ce contexte paulinien, ἔθνη désigne vraisemblablement les peuples autres qu’Israël. « Non-Juifs » communique clairement ce référent sans employer « païens », qui peut suggérer une appréciation religieuse absente du terme lui-même.
- issue: Sens de πίστις dans ἐν πίστει καὶ ἀληθείᾳ
  choice: foi
  alternative: fidélité
  rationale: « Foi » est le sens le plus naturel ici et préserve la possibilité que l’expression décrive le cadre ou le contenu de l’enseignement. Le sens de « fidélité » demeure lexicalement possible et est signalé en note.
translation_notes:
  register: Français international moderne, digne et direct. « Héraut » conserve la nuance officielle de κῆρυξ malgré son registre légèrement soutenu. « Chargé d’enseigner » évite les substantifs français soit archaïques (« docteur »), soit ambigus (« maître »), tout en maintenant l’apposition des trois fonctions.
