  verdict: revise
  source_fidelity: 'Le sens général est bien rendu : nomination, proclamation, apostolat, affirmation de véracité, mission auprès des non-Juifs et expression « dans la foi et la vérité ». Toutefois, « chargé d’enseigner » transforme le substantif appositionnel διδάσκαλος (« enseignant » / « maître ») en une périphrase de mandat et atténue la série grecque des trois fonctions.'
  naturalness: Le français est globalement naturel et de registre approprié. « Héraut » est soutenu mais juste pour κῆρυξ. « Enseignant des non-Juifs » est à la fois plus direct et plus proche de la structure appositionnelle du grec que « chargé d’enseigner les non-Juifs ».
  terminology: « Apôtre », « héraut », « non-Juifs », « foi » et « vérité » conviennent. « Non-Juifs » exprime bien le référent contextuel de ἐθνῶν sans la connotation potentiellement péjorative de « païens »; l’alternative « nations » doit être maintenue.
  issues:
