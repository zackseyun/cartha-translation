id: 1TI.2.5
reference: 1 Timothy 2:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἷς γὰρ θεός, εἷς καὶ μεσίτης θεοῦ καὶ ἀνθρώπων ἄνθρωπος Χριστὸς Ἰησοῦς,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/005.yaml
  text: For there is one God[a], and one mediator between God and men, the man Messiah Jesus[c][b],
translation:
  language: fr
  text: 'Car il y a un seul Dieu et un seul médiateur entre Dieu et les êtres humains : un homme, Jésus le Messie[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un homme, Christ Jésus ».
    reason: Signale la translittération traditionnelle de Χριστός et l’ordre des mots grecs.
lexical_decisions:
- source_word: εἷς … εἷς
  choice: un seul … un seul
  rationale: La répétition et le parallélisme emphatiques sont conservés; « seul » exprime naturellement en français l’unicité affirmée dans les deux membres.
- source_word: γὰρ
  choice: Car
  rationale: Introduit l’explication donnée par ce verset en lien avec le contexte précédent.
- source_word: μεσίτης
  choice: médiateur
  rationale: Équivalent français précis et usuel pour une personne qui se tient entre deux parties.
- source_word: θεοῦ καὶ ἀνθρώπων
  choice: entre Dieu et les êtres humains
  rationale: Les génitifs grecs désignent ici les parties entre lesquelles intervient le médiateur. « Les êtres humains » rend le pluriel générique ἀνθρώπων sans le limiter aux hommes de sexe masculin.
- source_word: ἄνθρωπος
  choice: un homme
  rationale: Le nom grec sans article met en relief la pleine humanité du médiateur. « Un homme » est plus naturel ici que « l’homme » et conserve la force personnelle du substantif.
- source_word: Χριστὸς Ἰησοῦς
  choice: Jésus le Messie
  rationale: Χριστός a ici valeur de titre et est donc traduit par « le Messie ». L’ordre est adapté à l’usage français naturel sans changer l’identification exprimée par le grec.
theological_decisions:
- issue: Lien entre ἀνθρώπων et ἄνθρωπος
  choice: 'les êtres humains : un homme'
  alternative: 'les hommes : l’homme'
  rationale: La traduction maintient le passage de l’humanité en général à l’humanité personnelle du médiateur, tout en évitant qu’un pluriel générique soit compris comme exclusivement masculin.
- issue: Valeur de Χριστός
  choice: Jésus le Messie
  alternative: Christ Jésus
  rationale: Le terme est rendu comme un titre messianique plutôt que simplement translittéré; une note fournit la formulation ecclésiale traditionnelle.
- issue: Portée christologique de ἄνθρωπος
  choice: Affirmer directement que le médiateur est un homme
  alternative: Reformuler par « de condition humaine » ou expliciter sa divinité
  rationale: Le texte souligne ici la véritable humanité de Jésus. La traduction conserve cette affirmation sans en déduire qu’il serait seulement humain et sans ajouter une affirmation que ce verset ne formule pas.
translation_notes:
  register: Français international moderne, clair et digne. Les deux occurrences de εἷς sont rendues symétriquement par « un seul ». Les deux-points rendent lisible l’apposition finale, et « Jésus le Messie » évite la tournure peu naturelle « le Messie Jésus ».
