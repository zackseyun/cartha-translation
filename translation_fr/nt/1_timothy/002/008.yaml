id: 1TI.2.8
reference: 1 Timothy 2:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Βούλομαι οὖν προσεύχεσθαι τοὺς ἄνδρας ἐν παντὶ τόπῳ, ἐπαίροντας ὁσίους χεῖρας χωρὶς ὀργῆς καὶ ⸀διαλογισμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/008.yaml
  text: Therefore I want the men in every place to pray[a], lifting up holy hands without anger or quarreling.
translation:
  language: fr
  text: Je veux donc que les hommes prient en tout lieu, en levant des mains saintes, sans colère ni querelle.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sans colère ni doute ». Le mot grec peut désigner un raisonnement intérieur ou un doute, mais il évoque probablement ici une contestation conflictuelle au sein de l’assemblée.
    reason: Alternative lexicale pour διαλογισμοῦ.
lexical_decisions:
- source_word: Βούλομαι
  choice: Je veux
  rationale: βούλομαι exprime ici une volonté ou un désir ayant valeur directive. « Je veux » est naturel en français moderne et conserve cette force.
- source_word: οὖν
  choice: donc
  rationale: οὖν relie cette instruction à ce qui précède en marquant une conséquence ou une reprise logique.
- source_word: προσεύχεσθαι
  choice: prient
  rationale: Le présent du subjonctif après « je veux que » rend naturellement en français l’infinitif grec dépendant de βούλομαι.
- source_word: τοὺς ἄνδρας
  choice: les hommes
  rationale: ἀνήρ désigne ici spécifiquement les hommes, conformément aux instructions différenciées du contexte immédiat, plutôt que les êtres humains en général ou les maris.
- source_word: ἐν παντὶ τόπῳ
  choice: en tout lieu
  rationale: Cette formulation conserve la portée distributive de l’expression grecque tout en restant claire et digne en français.
- source_word: ἐπαίροντας
  choice: en levant
  rationale: Le gérondif exprime naturellement la manière ou le geste accompagnant la prière.
- source_word: ὁσίους χεῖρας
  choice: des mains saintes
  rationale: ὅσιος évoque ce qui est saint, pieux et agréé par Dieu. « Mains saintes » conserve directement l’image grecque sans la réduire à la seule pureté rituelle ou morale.
- source_word: χωρὶς ὀργῆς
  choice: sans colère
  rationale: « Colère » est le sens courant de ὀργή dans ce contexte relationnel; χωρὶς marque l’absence.
- source_word: διαλογισμοῦ
  choice: querelle
  rationale: διαλογισμός peut évoquer le raisonnement intérieur, le doute ou la contestation. Associé à la colère dans le cadre de la prière communautaire, « querelle » rend probablement le mieux sa dimension conflictuelle, tandis que l’autre sens plausible est signalé en note.
theological_decisions:
- issue: Portée masculine de τοὺς ἄνδρας
  choice: les hommes
  alternative: les gens; tous; les maris
  rationale: Le nom grec est spécifiquement masculin et le contexte immédiat distingue les instructions adressées aux hommes de celles adressées aux femmes. Une formulation générique effacerait cette particularité, tandis que « maris » exigerait des indices contextuels plus nets.
- issue: Sens de διαλογισμοῦ dans le contexte de la prière
  choice: querelle
  alternative: doute; contestation; raisonnement
  rationale: L’association avec la colère favorise l’idée d’un conflit ou d’une contestation entre personnes. Toutefois, le sens intérieur de « doute » reste lexicalement possible et mérite d’être conservé en note afin de ne pas supprimer l’ambiguïté réelle.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase conserve la structure directive du grec, la référence explicite aux hommes et l’image traditionnelle des mains levées, tout en plaçant la principale ambiguïté lexicale en note.
