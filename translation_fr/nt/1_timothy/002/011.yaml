  text: γυνὴ ἐν ἡσυχίᾳ μανθανέτω ἐν πάσῃ ὑποταγῇ·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/011.yaml
  text: A woman must learn in quietness[b][a], in all submission.
translation:
  language: fr
  text: Qu’une femme[a] apprenne dans le calme[b], en toute soumission.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une épouse », selon le contexte ; le mot grec peut désigner soit une femme, soit une épouse.
    reason: alternative_reading
  - marker: b
    text: Ou « en silence » ; le terme grec peut aussi évoquer le calme ou la tranquillité, sans impliquer nécessairement un mutisme absolu.
    reason: lexical_alternative
lexical_decisions:
- source_word: γυνὴ
  choice: une femme
  rationale: γυνή peut désigner une femme ou une épouse selon le contexte. Ici, le singulier sans article se comprend naturellement de manière générique; « une femme » préserve cette portée sans supposer un statut matrimonial.
- source_word: ἐν ἡσυχίᾳ
  choice: dans le calme
  rationale: ἡσυχία peut exprimer le calme, la tranquillité ou le silence. « Dans le calme » rend une attitude paisible et non perturbatrice sans imposer nécessairement un mutisme absolu.
- source_word: μανθανέτω
  choice: qu’… apprenne
  rationale: L’impératif présent à la troisième personne est rendu naturellement en français par « qu’une femme apprenne », ce qui conserve à la fois la valeur directive et l’accent positif mis sur l’apprentissage.
- source_word: ἐν πάσῃ ὑποταγῇ
  choice: en toute soumission
  rationale: Cette formulation suit étroitement la construction grecque et conserve l’étendue de πάσῃ sans préciser un objet de la soumission que le texte grec ne nomme pas.
theological_decisions:
- issue: Faut-il comprendre ἡσυχία comme un silence absolu ou comme une attitude calme ?
  choice: dans le calme
  alternative: en silence
  rationale: Le mot peut désigner le silence, mais aussi le calme ou la tranquillité. Le choix retenu évite de rendre l’injonction plus absolue que ne l’exige le grec, tandis que la note conserve l’autre possibilité.
- issue: γυνή désigne-t-il une femme ou une épouse ?
  choice: une femme
  alternative: une épouse
  rationale: Le contexte immédiat ne marque pas explicitement une relation matrimoniale. « Une femme » évite donc de restreindre le référent, tout en signalant en note la possibilité contextuelle d’« épouse ».
translation_notes:
  register: Français international moderne, naturel et digne. La tournure exhortative « Qu’une femme apprenne » conserve clairement l’impératif grec. « Dans le calme » est idiomatique et préserve l’ambiguïté lexicale grâce à la note.
