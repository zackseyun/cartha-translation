  text: ἀλλ’ ὃ πρέπει γυναιξὶν ἐπαγγελλομέναις θεοσέβειαν, δι’ ἔργων ἀγαθῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/010.yaml
  text: 'but with what is proper for women professing godliness: good works[a][b][c].'
translation:
  language: fr
  text: mais, comme il convient à des femmes qui se déclarent attachées à Dieu[a], par de bonnes œuvres[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leur révérence envers Dieu » ou « leur piété ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « par de bonnes œuvres »; dans ce contexte, celles-ci sont présentées comme la parure qui convient.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: mais
  rationale: Marque le contraste avec la parure extérieure décrite au verset 9.
- source_word: ὃ πρέπει
  choice: ce qui convient
  rationale: Rend naturellement en français l’expression idiomatique désignant ce qui est approprié.
- source_word: γυναιξὶν
  choice: à des femmes
  rationale: Le pluriel est générique dans ce contexte et ne vise pas uniquement les femmes mariées.
- source_word: ἐπαγγελλομέναις
  choice: qui déclarent
  rationale: Exprime l’idée d’affirmer publiquement ou de professer, sans suggérer nécessairement un vœu.
- source_word: θεοσέβειαν
  choice: leur attachement à Dieu
  rationale: Rend de façon claire et actuelle la révérence ou la dévotion orientée vers Dieu.
- source_word: δι’ ἔργων ἀγαθῶν
  choice: de bonnes œuvres
  rationale: Dans le contraste avec la parure extérieure, les bonnes œuvres constituent ce qui convient; la note conserve la formulation plus littérale avec διά.
theological_decisions:
- issue: Rapport entre les bonnes œuvres et l’attachement déclaré à Dieu
  choice: Les bonnes œuvres sont présentées comme l’expression extérieure appropriée de cet attachement.
  alternative: Les bonnes œuvres seraient le fondement méritoire de l’acceptation par Dieu.
  rationale: La syntaxe porte sur la conduite qui convient à une profession de piété; elle ne formule pas ici une doctrine sur le mérite ou le salut.
translation_notes:
  register: Français international moderne, naturel et digne. « Attachement à Dieu » évite le caractère parfois opaque de « piété » tout en maintenant l’orientation explicite de θεοσέβεια vers Dieu; les variantes sont conservées en note.
