id: 1TI.2.12
reference: 1 Timothy 2:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸂διδάσκειν δὲ γυναικὶ⸃ οὐκ ἐπιτρέπω, οὐδὲ αὐθεντεῖν ἀνδρός, ἀλλ’ εἶναι ἐν ἡσυχίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/012.yaml
  text: But I do not permit a woman to teach or to exercise authority over a man[a]; instead[c][b], she is to be in quietness.
translation:
  language: fr
  text: Mais je ne permets pas à une femme d’enseigner ni d’exercer une autorité[b] sur un homme[a] ; au contraire, elle doit être dans le calme[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, dans un sens conjugal : « Mais je ne permets pas à une épouse d’enseigner ni d’exercer une autorité sur son mari. » Les mots grecs peuvent désigner soit une femme et un homme, soit une épouse et son mari.'
    reason: alternative_reading
  - marker: b
    text: Ou « avoir autorité sur » ; peut-être « dominer ». Le verbe grec est rare et sa nuance exacte est discutée.
    reason: lexical_alternative
  - marker: c
    text: Ou « dans le silence ». Le terme grec peut évoquer le calme, la tranquillité ou le silence selon le contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: διδάσκειν
  choice: enseigner
  rationale: L’infinitif complète naturellement « je ne permets pas » et garde le sens direct du verbe grec, sans préciser davantage la nature ou le cadre de l’enseignement.
- source_word: δὲ
  choice: Mais
  rationale: La particule marque ici une transition contrastive avec l’instruction précédente ; « mais » rend clairement cette nuance en français courant.
- source_word: γυναικὶ
  choice: à une femme
  rationale: γυνή peut désigner une femme ou une épouse. Le contexte plus large de 2.9-15 favorise le sens général dans le texte principal, tandis que le sens conjugal est signalé en note.
- source_word: οὐκ ἐπιτρέπω
  choice: je ne permets pas
  rationale: Cette formulation rend naturellement le présent grec comme l’énoncé direct d’une permission refusée, sans décider si la portée temporelle est circonstancielle ou générale.
- source_word: οὐδὲ
  choice: ni
  rationale: « Ni » coordonne naturellement en français les deux infinitifs placés sous la même négation.
- source_word: αὐθεντεῖν
  choice: exercer une autorité sur
  rationale: Le verbe est rare et sa nuance exacte est discutée. Cette traduction conserve un sens relatif à l’autorité sans lui imposer d’emblée la connotation abusive de « dominer ».
- source_word: ἀνδρός
  choice: un homme
  rationale: ἀνήρ peut signifier « homme » ou « mari ». Le sens général est retenu dans le texte, mais le sens conjugal demeure possible et figure en note.
- source_word: ἀλλ’
  choice: au contraire
  rationale: L’expression introduit nettement l’attitude positive opposée aux deux actions précédemment interdites.
- source_word: εἶναι
  choice: elle doit … être
  rationale: Le sujet féminin et la valeur attendue de l’infinitif sont explicités pour produire une phrase française naturelle, sans ajouter une idée de permanence absente du verbe.
- source_word: ἐν ἡσυχίᾳ
  choice: dans le calme
  rationale: ἡσυχία peut évoquer le calme, la tranquillité ou le silence. « Dans le calme » évite de transformer nécessairement l’expression en interdiction absolue de toute parole et reste cohérent avec 2.11.
theological_decisions:
- issue: Nuance du verbe rare αὐθεντεῖν dans un texte ecclésial controversé
  choice: exercer une autorité sur
  alternative: avoir autorité sur ; dominer
  rationale: Le rendu principal exprime le rapport d’autorité sans trancher en faveur d’une nuance nécessairement abusive. La note conserve les principales possibilités lexicales afin de ne pas résoudre par la traduction un débat que le mot rare laisse ouvert.
- issue: Sens général ou conjugal de γυνή et ἀνήρ
  choice: une femme … un homme
  alternative: une épouse … son mari
  rationale: Les deux noms grecs permettent les deux lectures. Le contexte traite plus largement des femmes et fait ensuite appel à Adam et Ève ; le sens général convient donc mieux au texte principal. La lecture conjugale est néanmoins authentiquement possible sur le plan lexical et est conservée en note.
- issue: Portée de ἡσυχία
  choice: dans le calme
  alternative: dans le silence
  rationale: Le terme peut désigner une attitude paisible et tranquille ou, selon le contexte, le silence. Le texte principal ne durcit pas cette nuance en mutisme absolu, tandis que la note préserve l’autre lecture possible.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe demeure proche de la structure grecque tout en étant idiomatique. Les notes rendent visibles les ambiguïtés lexicales importantes sans imposer une conclusion confessionnelle.
