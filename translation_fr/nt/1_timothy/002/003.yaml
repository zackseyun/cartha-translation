  text: This is good and acceptable before God our Savior,
translation:
  language: fr
  text: Cela est bon et agréable aux yeux de Dieu, notre Sauveur,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦτο
  choice: Cela
  rationale: Le démonstratif neutre renvoie à l’instruction précédente concernant la prière. « Cela » conserve ce renvoi sans explicitation excessive.
- source_word: καλὸν
  choice: bon
  rationale: Dans ce contexte éthique, le terme exprime ce qui est moralement bon et juste, non la beauté esthétique.
- source_word: ἀπόδεκτον
  choice: agréable
  rationale: Le terme désigne ce qui est favorablement accueilli. « Agréable » est naturel en français dans cette construction et exprime l’approbation divine.
- source_word: ἐνώπιον
  choice: aux yeux de
  rationale: Cette expression idiomatique rend l’idée d’une appréciation portée devant Dieu ou selon son regard.
- source_word: σωτῆρος
  choice: Sauveur
  rationale: « Sauveur » est l’équivalent français établi de ce titre divin et en conserve la portée théologique sans l’élargir.
- source_word: ἡμῶν
  choice: notre
  rationale: Le pronom génitif qualifie directement « Sauveur » et est rendu sans modification.
- source_word: θεοῦ
  choice: Dieu
  rationale: 'Le nom est en apposition avec « notre Sauveur » : Dieu est identifié comme notre Sauveur.'
theological_decisions:
- issue: Rapport d’apposition dans τοῦ σωτῆρος ἡμῶν θεοῦ
  choice: Dieu, notre Sauveur
  alternative: notre Dieu Sauveur
  rationale: La suite de génitifs identifie naturellement Dieu comme « notre Sauveur ». La virgule rend cette apposition clairement et idiomatiquement en français, sans ajouter de précision doctrinale étrangère au texte.
translation_notes:
  register: Français international moderne, simple et digne. La formulation conserve le lien anaphorique avec le verset précédent et la ponctuation finale indique que la phrase se poursuit au verset suivant.
