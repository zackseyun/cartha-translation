  yaml_path: translation/nt/1_timothy/002/013.yaml
  text: For Adam was formed first[a], then Eve.
translation:
  language: fr
  text: Car Adam a été façonné le premier[a], puis Ève.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « formé ». Le verbe fait écho au langage employé dans le récit de la création de la Genèse.
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: Car
  rationale: Introduit la raison qui fonde l’instruction précédente; « car » conserve cette valeur explicative avec concision.
- source_word: Ἀδὰμ
  choice: Adam
  rationale: Forme française traditionnelle et courante de ce nom propre.
- source_word: πρῶτος
  choice: le premier
  rationale: Exprime l’antériorité temporelle d’Adam par rapport à Ève; la tournure convient naturellement avec le passif français.
- source_word: ἐπλάσθη
  choice: a été façonné
  rationale: Le verbe πλάσσω désigne l’action de façonner ou de modeler. « A été façonné » garde l’écho concret du récit de la création dans la Genèse, contrairement au terme plus général « créé ».
- source_word: εἶτα
  choice: puis
  rationale: Marque simplement la succession temporelle et produit une phrase naturelle en français.
- source_word: Εὕα
  choice: Ève
  rationale: Forme française traditionnelle et courante de ce nom propre.
theological_decisions:
- issue: Rapport avec l’ordre de création dans la Genèse, au sein d’un contexte ecclésial débattu
  choice: 'Présenter le verset comme une simple affirmation de succession temporelle : Adam a été façonné le premier, puis Ève.'
  alternative: Inscrire dans la traduction une interprétation concernant l’autorité ou la distinction des rôles.
  rationale: Le grec énonce ici l’ordre dans lequel Adam et Ève ont été façonnés, sans formuler explicitement dans ce seul verset les conséquences théologiques de cet ordre. La traduction préserve cette limite et la tension interprétative.
translation_notes:
  register: Français international moderne, clair et digne. « Façonné » préserve l’image concrète du verbe grec; « formé » est signalé en note comme équivalent plus courant. La phrase reste concise et n’ajoute aucune conclusion doctrinale au simple ordre temporel.
