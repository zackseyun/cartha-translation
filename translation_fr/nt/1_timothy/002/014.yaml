reference: 1 Timothy 2:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ Ἀδὰμ οὐκ ἠπατήθη, ἡ δὲ γυνὴ ⸀ἐξαπατηθεῖσα ἐν παραβάσει γέγονεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/014.yaml
  text: And Adam was not deceived[a], but the woman, having been deceived[b], came to be in transgression.
translation:
  language: fr
  text: Et Adam n’a pas été trompé, mais la femme, après avoir été trompée[a], s’est retrouvée dans la transgression[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « après avoir été complètement trompée ». Le verbe grec est plus fort que celui employé auparavant pour Adam et peut suggérer une tromperie complète.
    reason: lexical_alternative
  - marker: b
    text: Ou « est entrée dans un état de transgression ». Le parfait grec peut souligner l’état qui résulte de cette entrée dans la transgression.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀδὰμ
  choice: Adam
  rationale: Le nom propre est conservé sous sa forme française traditionnelle.
- source_word: ἠπατήθη
  choice: n’a pas été trompé
  rationale: L’aoriste passif de ἀπατάω désigne directement le fait d’être trompé. Le passé composé est naturel en français moderne dans cet énoncé rétrospectif.
- source_word: ἡ γυνή
  choice: la femme
  rationale: γυνή peut signifier « femme » ou « épouse », mais l’allusion au récit de la Genèse et le contraste avec Adam favorisent ici « la femme », sans préciser davantage la relation.
- source_word: ἐξαπατηθεῖσα
  choice: après avoir été trompée
  rationale: Cette proposition participiale marque une action antérieure à celle du verbe principal. La traduction reste sobre et naturelle; une note signale la force éventuellement intensive du verbe composé ἐξαπατάω.
- source_word: ἐν παραβάσει
  choice: en état de transgression
  rationale: Cette formulation conserve le nom abstrait παράβασις et l’idée de situation exprimée par ἐν, sans transformer la femme en « transgresseuse » ni ajouter explicitement l’image d’une chute.
- source_word: γέγονεν
  choice: s’est trouvée
  rationale: Le parfait de γίνομαι associe l’entrée dans une situation à l’état qui en résulte. « S’est trouvée en état de » rend cette nuance de manière intelligible sans réduire le verbe à une simple copule.
- source_word: δέ
  choice: mais
  rationale: La conjonction marque ici le contraste entre Adam et la femme.
- source_word: καί
  choice: Et
  rationale: La conjonction relie simplement cette affirmation à l’argument qui précède, sans introduire une inférence plus forte que le grec.
theological_decisions:
- issue: Présenter le rapport entre la femme et la transgression sans élargir l’affirmation à une doctrine générale sur les femmes.
  choice: 'Conserver une formulation étroitement liée au récit évoqué : « la femme […] s’est trouvée en état de transgression ».'
  alternative: « la femme […] est devenue une transgresseuse » ou « est tombée dans le péché »
  rationale: Le grec emploie le nom abstrait « transgression » et ne formule ni désignation personnelle permanente ni conclusion générale sur la nature ou la culpabilité des femmes. La traduction préserve cette retenue et la tension propre au verset.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe garde le contraste serré du grec tout en évitant le calque peu naturel « est devenue dans la transgression ». Les notes rendent visibles l’intensité possible de ἐξαπατάω et la valeur résultative possible du parfait γέγονεν.
