source:
  edition: SBLGNT
  text: Παρακαλῶ οὖν πρῶτον πάντων ποιεῖσθαι δεήσεις, προσευχάς, ἐντεύξεις, εὐχαριστίας, ὑπὲρ πάντων ἀνθρώπων,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/001.yaml
  text: Therefore[a], first of all, I urge that petitions, prayers, intercessions, and thanksgivings be made for all people[c][b],
translation:
  language: fr
  text: J’exhorte donc, avant tout, à faire des demandes, des prières, des intercessions et des actions de grâce pour tous les êtres humains[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « en faveur de tous les êtres humains ».'
    reason: lexical_alternative
  - marker: b
    text: 'Certains comprennent ici : « toutes les catégories de personnes » ; le grec dit simplement : « tous les êtres humains ».'
    reason: alternative_reading
lexical_decisions:
- source_word: Παρακαλῶ
  choice: J’encourage
  rationale: Le verbe introduit une exhortation pressante. « J’encourage » est naturel en français moderne et garde une force pastorale sans la solennité plus marquée de « j’exhorte ».
- source_word: οὖν
  choice: donc
  rationale: « Donc » marque clairement le lien logique avec ce qui précède.
- source_word: πρῶτον πάντων
  choice: avant tout
  rationale: L’expression indique ici la priorité plutôt que nécessairement le premier élément d’une liste numérotée.
- source_word: ποιεῖσθαι
  choice: présenter
  rationale: Dans ce contexte de prière, « présenter » convient naturellement aux quatre compléments tout en évitant de préciser indûment un cadre liturgique.
- source_word: δεήσεις
  choice: demandes
  rationale: Le terme désigne des requêtes motivées par un besoin. « Demandes » est clair et courant, tandis que « supplications » serait plus soutenu et ajouterait une nuance d’intensité.
- source_word: προσευχάς
  choice: prières
  rationale: Il s’agit du terme général pour la prière; la traduction directe préserve cette portée.
- source_word: ἐντεύξεις
  choice: intercessions
  rationale: Dans cette énumération et devant ὑπὲρ πάντων ἀνθρώπων, « intercessions » exprime adéquatement la prière en faveur d’autrui, même si le mot grec peut plus largement désigner des requêtes ou des recours.
- source_word: εὐχαριστίας
  choice: actions de grâce
  rationale: Cette expression française établie traduit naturellement le pluriel et distingue ces prières de reconnaissance des autres formes mentionnées.
- source_word: ὑπὲρ
  choice: pour
  rationale: Avec le génitif, la préposition exprime ici l’intérêt ou la représentation. « Pour » est idiomatique; « en faveur de » explicite davantage la nuance.
- source_word: πάντων ἀνθρώπων
  choice: tous les êtres humains
  rationale: ἄνθρωπος est générique et ne désigne pas seulement les hommes de sexe masculin. Cette formulation rend explicitement la portée humaine universelle du grec.
theological_decisions:
- issue: Portée de πάντων ἀνθρώπων
  choice: tous les êtres humains
  alternative: toutes les catégories de personnes
  rationale: Le grec dit simplement « tous les êtres humains » et ne contient aucun terme signifiant « catégories » ou « sortes ». La traduction conserve donc le sens direct, tandis qu’une note signale l’interprétation plus restrictive sans l’introduire dans le texte.
translation_notes:
  register: Français international moderne, naturel et digne. L’ordre de la phrase maintient l’enchaînement grec, et l’énumération conserve quatre termes distincts. « Tous les êtres humains » évite toute lecture exclusivement masculine.
