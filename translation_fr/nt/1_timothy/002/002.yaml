id: 1TI.2.2
reference: 1 Timothy 2:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὑπὲρ βασιλέων καὶ πάντων τῶν ἐν ὑπεροχῇ ὄντων, ἵνα ἤρεμον καὶ ἡσύχιον βίον διάγωμεν ἐν πάσῃ εὐσεβείᾳ καὶ σεμνότητι.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/002.yaml
  text: for kings and all who are in high positions[a], so that we may lead a tranquil and quiet life in all godliness and dignity.
translation:
  language: fr
  text: pour les rois et pour tous ceux qui occupent une position élevée[a], afin que nous menions une vie paisible et tranquille, en toute piété et dignité.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tous ceux qui exercent l’autorité ». L’expression grecque signifie littéralement « tous ceux qui sont dans une position élevée » ou « en situation de prééminence ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπὲρ
  choice: pour
  rationale: Dans le contexte de l’appel précédent aux prières et aux intercessions, « pour » exprime naturellement les personnes en faveur desquelles on prie.
- source_word: βασιλέων
  choice: les rois
  rationale: Le nom désigne précisément des rois ou souverains; cette traduction conserve la forme lexicale sans la généraliser.
- source_word: πάντων τῶν ἐν ὑπεροχῇ ὄντων
  choice: tous ceux qui occupent une position élevée
  rationale: La formule évoque une situation de prééminence et ne se limite pas nécessairement à l’exercice formel d’une autorité.
- source_word: ἵνα
  choice: afin que
  rationale: Cette expression marque clairement et naturellement le but visé.
- source_word: ἤρεμον
  choice: paisible
  rationale: Le terme évoque une existence calme, à l’abri des troubles; « paisible » convient naturellement à la vie menée.
- source_word: ἡσύχιον
  choice: tranquille
  rationale: Le terme souligne le calme et l’absence d’agitation; « tranquille » maintient une nuance distincte de « paisible ».
- source_word: βίον διάγωμεν
  choice: nous menions une vie
  rationale: Cette tournure française naturelle rend l’idée de conduire ou de passer son existence.
- source_word: ἐν πάσῃ εὐσεβείᾳ
  choice: en toute piété
  rationale: « Piété » exprime ici l’attachement respectueux à Dieu manifesté dans la conduite, tandis que « toute » conserve la portée de πάσῃ.
- source_word: σεμνότητι
  choice: dignité
  rationale: Le nom désigne une gravité morale honorable et digne de respect; « dignité » est clair et actuel.
theological_decisions:
- issue: Portée et finalité de la prière pour les dirigeants civils
  choice: Le verset demande de prier pour les souverains et les personnes haut placées afin que les croyants puissent vivre paisiblement dans la piété et la dignité.
  alternative: Comprendre la formule comme une affirmation explicite de soumission aux autorités ou la restreindre aux seuls détenteurs d’une autorité juridiquement constituée.
  rationale: Le grec désigne les bénéficiaires de la prière et le but recherché, sans affirmer ici une approbation inconditionnelle des dirigeants ni développer une doctrine politique plus large.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation conserve la distinction entre les deux adjectifs grecs par « paisible et tranquille » et évite de réduire la position élevée à la seule autorité officielle.
