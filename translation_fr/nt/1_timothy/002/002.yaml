  source_fidelity: 'Le texte rend fidèlement les groupes syntaxiques grecs : « pour » conserve la portée de ὑπέρ dans le contexte des prières, « les rois » traduit βασιλέων sans généralisation, et « tous ceux qui occupent une position élevée » maintient l’extension plus large que la seule autorité institutionnelle. « Afin que » exprime correctement le but introduit par ἵνα. La paire « paisible et tranquille » préserve de façon naturelle la double caractérisation ἤρεμον καὶ ἡσύχιον.'
