  source_fidelity: 'Le texte rend fidèlement Οἴδαμεν…ὅτι (« Nous savons que »), καλὸς ὁ νόμος (« la loi est bonne »), ainsi que la condition générique ἐάν τις. « En faire un usage conforme à la loi » restitue naturellement χρῆται et préserve explicitement l’écho rhétorique entre νόμος et νομίμως. L’omission autonome de δέ est recevable en français : sa transition légère ne requiert pas un connecteur explicite et aucun contraste fort n’est introduit.'
  naturalness: La formulation est naturelle, claire et d’un registre moderne et digne. « Si on en fait un usage… » est idiomatique pour une condition générale. La ponctuation conserve la structure conditionnelle du grec sans alourdir la phrase.
