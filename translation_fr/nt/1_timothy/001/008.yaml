id: 1TI.1.8
reference: 1 Timothy 1:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Οἴδαμεν δὲ ὅτι καλὸς ὁ νόμος ἐάν τις αὐτῷ νομίμως χρῆται,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/008.yaml
  text: We know that the law is good[a], if one uses it lawfully,
translation:
  language: fr
  text: Nous savons que la loi est bonne, si on en fait un usage conforme à la loi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « si quelqu’un l’utilise comme il convient » ou « si on en fait un usage légitime ».'
    reason: Alternative lexicale pour νομίμως et pour la formulation de la condition générique.
lexical_decisions:
- source_word: Οἴδαμεν
  choice: Nous savons
  rationale: Le parfait οἶδα a ici un sens présent et exprime un savoir établi. « Nous savons » est direct et naturel.
- source_word: δὲ
  choice: non exprimé séparément
  rationale: δέ marque ici une transition légère. Le français n’exige pas de connecteur explicite, et ajouter « mais » accentuerait indûment l’opposition.
- source_word: καλὸς
  choice: bonne
  rationale: Dans ce contexte, καλός affirme la valeur positive de la loi sans préciser davantage la nature de cette bonté.
- source_word: ὁ νόμος
  choice: la loi
  rationale: Cette formulation conserve la portée du grec sans préciser dans le texte principal s’il s’agit exclusivement de la loi de Moïse.
- source_word: ἐάν τις
  choice: si on
  rationale: La construction exprime une condition générale. Le pronom « on » est la tournure générique la plus naturelle en français moderne.
- source_word: αὐτῷ … χρῆται
  choice: on en fait un usage
  rationale: Avec χράομαι, le datif αὐτῷ renvoie à la loi. « En faire un usage » restitue naturellement cette construction en français.
- source_word: νομίμως
  choice: conforme à la loi
  rationale: Cette expression conserve le lien lexical et le jeu de mots entre νόμος et νομίμως, tout en restant compréhensible en français.
theological_decisions:
- issue: Portée de « la loi »
  choice: Conserver simplement « la loi »
  alternative: « la loi de Moïse » ou la loi au sens général
  rationale: Le contexte peut viser particulièrement la loi mosaïque, mais le grec ne la qualifie pas explicitement. La traduction maintient donc l’ouverture du texte.
- issue: Sens de νομίμως
  choice: « conforme à la loi »
  alternative: « comme il convient » ou « de manière légitime »
  rationale: Le choix principal préserve l’écho lexical avec « la loi » sans décider si la norme visée est la loi elle-même, sa finalité ou son emploi approprié.
translation_notes:
  register: Français international moderne, simple et digne. « Si on en fait un usage » est plus idiomatique que « si quelqu’un l’utilise », tandis que « conforme à la loi » maintient le jeu lexical du grec.
