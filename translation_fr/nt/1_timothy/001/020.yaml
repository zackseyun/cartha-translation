  text: ὧν ἐστιν Ὑμέναιος καὶ Ἀλέξανδρος, οὓς παρέδωκα τῷ Σατανᾷ ἵνα παιδευθῶσι μὴ βλασφημεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/020.yaml
  text: among whom are Hymenaeus and Alexander[b][a], whom I have handed over to Satan so that they may be taught not to blaspheme.
translation:
  language: fr
  text: Parmi eux se trouvent Hyménée et Alexandre, que j’ai livrés à Satan[a] afin qu’ils apprennent[b] à ne pas blasphémer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « remis à Satan ». L’expression semble désigner une mesure disciplinaire sévère à visée corrective plutôt qu’une condamnation définitive.
    reason: lexical_alternative
  - marker: b
    text: Le verbe grec peut aussi se traduire par « soient instruits », « soient formés » ou « soient corrigés »; il désigne ici un apprentissage comportant une correction.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὧν ἐστιν
  choice: Parmi eux se trouvent
  rationale: Rend naturellement en français la valeur partitive du relatif grec, qui renvoie au groupe mentionné au verset précédent.
- source_word: Ὑμέναιος καὶ Ἀλέξανδρος
  choice: Hyménée et Alexandre
  rationale: Emploie les formes françaises traditionnelles et courantes de ces noms propres.
- source_word: οὓς παρέδωκα
  choice: Je les ai livrés
  rationale: Le passé composé exprime naturellement en français l’action passée et son lien avec la situation présente, tout en conservant la force de παραδίδωμι.
- source_word: τῷ Σατανᾷ
  choice: à Satan
  rationale: « Satan » est la désignation française habituelle et convient ici comme nom propre.
- source_word: ἵνα παιδευθῶσι
  choice: afin qu’ils apprennent, par la discipline
  rationale: Cette formulation conserve à la fois la visée pédagogique et la dimension corrective de παιδεύω, sans préciser indûment la forme de la discipline.
- source_word: μὴ βλασφημεῖν
  choice: à ne plus blasphémer
  rationale: « Blasphémer » préserve la gravité religieuse probable du verbe; « ne plus » exprime idiomatiquement que la conduite doit cesser, ce qu’implique le contexte correctif.
theological_decisions:
- issue: Sens de « livrés à Satan »
  choice: Conserver littéralement l’expression dans le texte et signaler seulement sa probable visée corrective en note.
  alternative: L’expliciter comme une exclusion de l’Église, une souffrance physique miraculeuse ou une condamnation définitive.
  rationale: Le but introduit par ἵνα indique une correction orientée vers un changement de conduite, mais le verset ne définit pas le mécanisme précis. La traduction préserve donc la tension théologique.
- issue: Portée de παιδευθῶσι
  choice: « apprennent, par la discipline »
  alternative: « soient instruits », « soient corrigés » ou « soient châtiés »
  rationale: Le grec peut englober instruction, formation et correction. La formulation choisie maintient ensemble l’apprentissage visé et le moyen disciplinaire sans réduire le terme à un simple enseignement ni à un châtiment.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase grecque est scindée en deux phrases pour éviter une relative lourde. Les deux marqueurs de note figurent dans le texte au point exact qu’ils éclairent.
