    rationale: Le grec porte simplement μὴ βλασφημεῖν, « ne pas blasphémer ». Bien que le contexte puisse supposer une conduite à corriger, « ne plus » affirme explicitement une cessation que le texte ne marque pas.
  - severity: medium
    issue: Ajout de « par la discipline » dans le texte
    rationale: παιδευθῶσι exprime le fait d’être formés, instruits ou corrigés, mais n’énonce pas séparément un moyen instrumental. La formulation française ajoute ce moyen et alourdit inutilement la phrase. La nuance corrective peut être indiquée en note.
