  text: ἔχων πίστιν καὶ ἀγαθὴν συνείδησιν, ἥν τινες ἀπωσάμενοι περὶ τὴν πίστιν ἐναυάγησαν·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/019.yaml
  text: holding faith and a good conscience[a], which some, having rejected[b], have suffered shipwreck concerning the faith.
translation:
  language: fr
  text: en gardant la foi et une bonne conscience, que certains ont rejetée et, à l’égard de la foi, ont fait naufrage.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔχων
  choice: en gardant
  rationale: Le participe présent exprime ici le maintien actif et continu de la foi et d’une bonne conscience, dans le prolongement de l’exhortation du verset précédent.
- source_word: πίστιν
  choice: la foi
  rationale: Dans la première occurrence, le terme désigne naturellement la foi chrétienne, avec sa dimension de confiance; «la foi» demeure la formulation française la plus transparente.
- source_word: ἀγαθὴν συνείδησιν
  choice: une bonne conscience
  rationale: Cette traduction rend directement l’adjectif ἀγαθή sans réduire le sens à une conscience seulement paisible ou sans remords.
- source_word: ἥν
  choice: que
  rationale: Le pronom relatif féminin singulier se rapporte le plus naturellement à «conscience», son antécédent féminin singulier le plus proche.
- source_word: ἀπωσάμενοι
  choice: ont rejetée
  rationale: Le verbe évoque un geste volontaire de repousser ou d’écarter; «rejeter» est naturel en français et garde cette intention délibérée.
- source_word: περὶ τὴν πίστιν
  choice: en ce qui concerne la foi
  rationale: La préposition indique le domaine dans lequel le naufrage s’est produit; l’article favorise ici la référence à la foi chrétienne.
- source_word: ἐναυάγησαν
  choice: ont fait naufrage
  rationale: L’expression française conserve clairement et naturellement la métaphore maritime du grec.
theological_decisions:
- issue: Référent de ἥν
  choice: Le pronom relatif renvoie précisément à «une bonne conscience».
  alternative: Le pronom pourrait reprendre ensemble «la foi et une bonne conscience».
  rationale: Le féminin singulier ἥν s’accorde le plus naturellement avec συνείδησιν, nom féminin singulier immédiatement antérieur. La note conserve cependant la possibilité d’une reprise plus large.
- issue: Sens de la seconde occurrence de πίστις
  choice: «la foi», comprise comme la foi chrétienne ou son contenu.
  alternative: «leur foi» ou «la confiance».
  rationale: L’article grec et le contexte soutiennent «la foi», sans imposer une distinction trop rigide entre acte de croire et contenu cru.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe reste proche du grec tout en évitant une tournure participiale lourde. «Ont ainsi fait naufrage» explicite légèrement le lien logique sans en préciser davantage la causalité.
