source:
  edition: SBLGNT
  text: Ταύτην τὴν παραγγελίαν παρατίθεμαί σοι, τέκνον Τιμόθεε, κατὰ τὰς προαγούσας ἐπὶ σὲ προφητείας, ἵνα ⸀στρατεύῃ ἐν αὐταῖς τὴν καλὴν στρατείαν,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/018.yaml
  text: This charge I entrust to you[a], child Timothy, in accordance with the prophecies previously made about you, so that by them you may wage the good warfare[c][b],
translation:
  language: fr
  text: Cette directive, je te la confie, Timothée, mon enfant, en accord avec les prophéties faites précédemment à ton sujet[a], afin que, par elles[b], tu mènes le bon combat[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sur toi », au sens possible de prophéties prononcées sur Timothée.
    reason: lexical_alternative
  - marker: b
    text: Ou « à travers elles » ou « en elles »; le grec peut indiquer le moyen ou la sphère dans laquelle Timothée mène ce combat.
    reason: lexical_alternative
  - marker: c
    text: 'Le grec emploie un verbe et un nom apparentés du domaine militaire, évoquant le fait de mener une campagne ou d''accomplir un service militaire. Traduction traditionnelle : « tu combattes le bon combat ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: παραγγελίαν
  choice: directive
  rationale: « Directive » exprime une instruction investie d’autorité, sans la dureté que pourrait suggérer « ordre » et avec plus de force que « enseignement ».
- source_word: παρατίθεμαί
  choice: je te la confie
  rationale: Le moyen grec présente l’acte de remettre cette directive à la responsabilité de Timothée; « confier » rend naturellement cette nuance personnelle.
- source_word: τέκνον
  choice: mon enfant
  rationale: L’expression conserve la métaphore familiale et affectueuse sans préciser « fils », que le grec n’emploie pas ici.
- source_word: κατὰ
  choice: conformément à
  rationale: Cette formulation rend le rapport de correspondance entre la directive présente et les prophéties antérieures.
- source_word: τὰς προαγούσας
  choice: faites précédemment
  rationale: Le participe signifie littéralement « allant auparavant »; dans ce contexte, il situe les prophéties dans le passé de manière idiomatique.
- source_word: ἐπὶ σὲ
  choice: à ton sujet
  rationale: Cette traduction exprime clairement que les prophéties concernaient Timothée, tout en signalant en note l’autre image possible de paroles prononcées « sur » lui.
- source_word: προφητείας
  choice: prophéties
  rationale: Le terme français courant correspond directement au pluriel grec et n’ajoute aucune théorie sur la forme ou la fonction de ces messages.
- source_word: στρατεύῃ
  choice: tu mènes
  rationale: Avec στρατείαν, le verbe appartient à l’image de la campagne militaire; « mener » permet de conserver cette image dans une expression française naturelle.
- source_word: ἐν αὐταῖς
  choice: par elles
  rationale: '« Par elles » comprend ἐν dans un sens instrumental: les prophéties servent de moyen ou d’appui. La note maintient aussi la possibilité d’un sens local ou sphérique.'
- source_word: τὴν καλὴν στρατείαν
  choice: le bon combat
  rationale: Cette expression française naturelle conserve l’image militaire et la valeur positive de καλός. Une note indique que στρατεία désigne plus précisément une campagne ou un service militaire.
theological_decisions:
- issue: Rapport entre les prophéties et la mission confiée à Timothée
  choice: Les prophéties antérieures concernant Timothée fondent ou orientent la directive que Paul lui confie et l’aident dans son combat.
  alternative: Les prophéties auraient constitué à elles seules une ordination formelle, ou n’auraient été que des encouragements privés.
  rationale: Le texte relie explicitement la directive, les prophéties et le combat de Timothée, mais ne définit ni un rite d’ordination ni la seule fonction privée de ces prophéties. La traduction ne tranche donc pas au-delà du grec.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve le ton solennel et affectueux de l’exhortation. « Tu mènes le bon combat » privilégie une expression française naturelle, tandis que la note rend visible l’image plus précise de la campagne militaire et la construction apparentée du grec.
