id: 1TI.1.3
reference: 1 Timothy 1:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καθὼς παρεκάλεσά σε προσμεῖναι ἐν Ἐφέσῳ, πορευόμενος εἰς Μακεδονίαν, ἵνα παραγγείλῃς τισὶν μὴ ἑτεροδιδασκαλεῖν
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/003.yaml
  text: Just as I urged you to remain in Ephesus when I was going into Macedonia[a], so that you might instruct certain people not to teach different doctrine,
translation:
  language: fr
  text: Comme je t’ai exhorté à rester à Éphèse lorsque je partais pour la Macédoine, afin que tu ordonnes[a] à certaines personnes de ne pas enseigner une doctrine différente,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « donnes des instructions » à certaines personnes.
    reason: Signale une autre manière possible de rendre παραγγέλλω, verbe qui peut exprimer aussi bien une instruction autorisée qu’un ordre explicite.
lexical_decisions:
- source_word: Καθὼς
  choice: Comme
  rationale: Introduit le rappel de l’exhortation antérieure. « Comme » rend naturellement la valeur comparative et récapitulative du grec, tout en conservant la construction ouverte du verset.
- source_word: παρεκάλεσά
  choice: j’ai exhorté
  rationale: παρακαλέω exprime ici une demande pressante. « Exhorter » garde sa force sans transformer l’appel adressé à Timothée en ordre formel.
- source_word: προσμεῖναι
  choice: à rester
  rationale: L’infinitif signifie demeurer ou continuer de séjourner dans un lieu. « Rester » est direct et courant.
- source_word: ἐν Ἐφέσῳ
  choice: à Éphèse
  rationale: En français, la préposition usuelle devant le nom de cette ville est « à ».
- source_word: πορευόμενος εἰς Μακεδονίαν
  choice: lorsque je partais pour la Macédoine
  rationale: Le participe décrit la circonstance temporelle du déplacement de Paul. « Partir pour » est naturel en français et n’impose pas qu’il ait déjà atteint la Macédoine.
- source_word: ἵνα
  choice: afin que
  rationale: Rend explicitement la valeur de but introduite par ἵνα.
- source_word: παραγγείλῃς
  choice: tu ordonnes
  rationale: παραγγέλλω désigne une directive donnée avec autorité. « Ordonner » en conserve mieux la force dans ce contexte de correction, tandis que la note signale une formulation française moins forte mais possible.
- source_word: τισὶν
  choice: à certaines personnes
  rationale: Le pronom indéfini désigne des personnes précises mais non nommées. Cette formulation reste naturelle et n’en précise ni le nombre ni l’identité.
- source_word: ἑτεροδιδασκαλεῖν
  choice: enseigner une doctrine différente
  rationale: Le composé désigne le fait de dispenser un enseignement doctrinal autre ou différent. Cette traduction préserve l’idée d’écart sans ajouter explicitement le qualificatif interprétatif « fausse ».
theological_decisions:
- issue: Force de παραγγείλῃς dans le cadre de la correction ecclésiale
  choice: « tu ordonnes », qui exprime une directive faisant autorité
  alternative: « tu donnes instruction » ou « tu prescrives »
  rationale: L’autorité déléguée à Timothée est présente dans le verbe grec. Le choix principal la conserve clairement, sans pour autant renforcer l’exhortation de Paul exprimée par le verbe distinct παρακαλέω.
- issue: Caractérisation de l’enseignement visé par ἑτεροδιδασκαλεῖν
  choice: « enseigner une doctrine différente »
  alternative: « enseigner une fausse doctrine » ou « enseigner une autre doctrine »
  rationale: « Fausse doctrine » explicite une évaluation que le composé n’énonce pas à lui seul, même si le contexte est nettement critique. « Doctrine différente » maintient l’écart par rapport à la norme apostolique sans résoudre davantage la tension lexicale.
- issue: Construction syntaxique inachevée du verset
  choice: 'conserver la proposition ouverte : « Comme… afin que… »'
  alternative: ajouter une proposition principale telle que « je te le demande encore » ou transformer « rester » en impératif
  rationale: Le grec présente une construction suspendue dont la principale est sous-entendue. L’ajout d’un nouvel impératif ou d’une demande répétée rendrait la phrase plus autonome, mais introduirait des mots absents du texte. La virgule finale signale que la pensée se poursuit.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve la syntaxe suspendue du grec et la continuité avec le verset suivant. « Doctrine » est retenu plutôt qu’« enseignement » pour faire entendre la dimension doctrinale du verbe composé, sans qualifier explicitement cette doctrine de fausse.
