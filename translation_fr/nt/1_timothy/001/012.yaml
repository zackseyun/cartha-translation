id: 1TI.1.12
reference: 1 Timothy 1:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸀Χάριν ἔχω τῷ ἐνδυναμώσαντί με Χριστῷ Ἰησοῦ τῷ κυρίῳ ἡμῶν, ὅτι πιστόν με ἡγήσατο θέμενος εἰς διακονίαν,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/012.yaml
  text: I give thanks to Messiah Jesus our Lord[a], who has strengthened me, because he considered me faithful, appointing me to ministry[b],
translation:
  language: fr
  text: Je rends grâce à Jésus le Messie, notre Seigneur[a], qui m’a fortifié, parce qu’il m’a estimé fidèle en me plaçant au service[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Christ Jésus, notre Seigneur ». Le titre grec Χριστός peut être traduit par « Messie » ou rendu sous sa forme traditionnelle « Christ ».
    reason: alternative_reading
  - marker: b
    text: Ou « dans le ministère » ou « dans le service ». Le grec διακονία désigne largement le service ou le ministère.
    reason: lexical_alternative
lexical_decisions:
- source_word: Χάριν ἔχω
  choice: Je rends grâce
  rationale: Cette expression idiomatique signifie « remercier » ou « être reconnaissant ». « Je rends grâce » est naturel dans le registre biblique français et conserve la force verbale de l’expression grecque.
- source_word: ἐνδυναμώσαντί με
  choice: qui m’a fortifié
  rationale: Le participe désigne Jésus comme celui qui a donné à Paul la force nécessaire. « Fortifié » préserve ce sens sans préciser indûment la nature de cette capacité.
- source_word: Χριστῷ Ἰησοῦ
  choice: Jésus le Messie
  rationale: Χριστός est rendu selon son sens de titre, « Messie ». La formulation française naturelle place le nom avant le titre, tout en conservant leur relation sémantique.
- source_word: τῷ κυρίῳ ἡμῶν
  choice: notre Seigneur
  rationale: « Seigneur » conserve le titre christologique établi et l’idée d’autorité exprimée par κύριος.
- source_word: πιστόν
  choice: fidèle
  rationale: πιστός peut signifier fidèle, digne de confiance ou fiable. « Fidèle » garde la portée personnelle et ministérielle du terme sans réduire celui-ci à une simple compétence.
- source_word: ἡγήσατο
  choice: m’a estimé
  rationale: Le verbe signifie considérer ou tenir pour. « Estimé » rend naturellement cette évaluation en français et évite les connotations judiciaires possibles de « jugé ».
- source_word: θέμενος
  choice: en m’établissant
  rationale: Le sens littéral est « placer ». Dans ce contexte d’affectation à un service, « établir » exprime la désignation sans imposer l’idée d’un office ecclésiastique ultérieur.
- source_word: εἰς διακονίαν
  choice: dans le service
  rationale: διακονία désigne largement le service et peut, selon le contexte, se traduire par « ministère ». « Dans le service » maintient ici cette ampleur lexicale.
theological_decisions:
- issue: Traduction de Χριστός
  choice: Jésus le Messie
  alternative: Christ Jésus
  rationale: Le titre est traduit afin de rendre son contenu messianique plutôt que de le traiter uniquement comme une forme traditionnelle assimilée à un nom. L’ordre est adapté à un français naturel.
- issue: Nature de la mission confiée à Paul
  choice: en m’établissant dans le service
  alternative: en me confiant un ministère
  rationale: Cette formulation exprime l’action de Jésus qui assigne Paul à la διακονία, tout en évitant de réduire le terme à une fonction cléricale définie par des structures postérieures.
- issue: Sens de πιστός appliqué à Paul
  choice: fidèle
  alternative: digne de confiance
  rationale: '« Fidèle » préserve la tension du passage : Jésus a tenu Paul pour fidèle et l’a placé dans le service, sans que la traduction précise si le terme décrit une fidélité constatée, accordée ou anticipée.'
translation_notes:
  register: Français international moderne, clair et digne. « Je rends grâce » conserve un registre biblique courant sans archaïsme marqué. « Jésus le Messie » rend le titre explicitement tout en restant plus naturel en français que « le Messie Jésus ». La ponctuation finale par une virgule suit le fait que le verset se poursuit dans la phrase grecque.
