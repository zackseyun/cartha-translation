source:
  edition: SBLGNT
  text: ⸀τὸ πρότερον ὄντα βλάσφημον καὶ διώκτην καὶ ὑβριστήν· ἀλλὰ ἠλεήθην, ὅτι ἀγνοῶν ἐποίησα ἐν ἀπιστίᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/013.yaml
  text: formerly a blasphemer and a persecutor and a violent man[a]; but I was shown mercy, because I acted ignorantly in unbelief[d][c][b],
translation:
  language: fr
  text: moi qui étais autrefois un blasphémateur, un persécuteur et un homme violent[a] ; mais j’ai reçu miséricorde[b], parce que j’ai agi par ignorance[c], dans l’incrédulité[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un homme insolent » ou « un homme brutal ». Le terme grec évoque une conduite outrageante, violente et injurieuse, et non le simple orgueil.
    reason: lexical_alternative
  - marker: b
    text: Ou « il m’a été fait miséricorde ».
    reason: lexical_alternative
  - marker: c
    text: Ou « en étant ignorant » ou « sans savoir ce que je faisais » .
    reason: lexical_alternative
  - marker: d
    text: Ou « dans l’infidélité ». Ici, le sens le plus probable est l’absence de foi plutôt que le manque de fidélité à une alliance.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ πρότερον ὄντα
  choice: moi qui étais autrefois
  rationale: La relative rend naturellement en français le participe substantivé à l’accusatif, qui renvoie à Paul dans le verset précédent, tout en conservant l’idée de son état passé.
- source_word: βλάσφημον
  choice: un blasphémateur
  rationale: Le terme est employé substantivement et désigne directement celui qui blasphème.
- source_word: διώκτην
  choice: un persécuteur
  rationale: Équivalent français direct et usuel du nom grec dans le contexte de l’hostilité passée de Paul envers l’Église.
- source_word: ὑβριστήν
  choice: un homme violent
  rationale: Cette formulation accessible exprime la violence outrageante et injurieuse impliquée par le grec, sans réduire le mot à la seule arrogance.
- source_word: ἠλεήθην
  choice: j’ai reçu miséricorde
  rationale: Cette tournure française naturelle conserve l’idée que Paul est le bénéficiaire de la miséricorde, même si elle rend le passif grec par une formulation idiomatique.
- source_word: ὅτι
  choice: parce que
  rationale: La conjonction introduit ici le motif ou l’explication de la miséricorde reçue; « parce que » en conserve clairement la valeur causale.
- source_word: ἀγνοῶν
  choice: par ignorance
  rationale: La locution exprime de façon naturelle que l’action de Paul a été accomplie dans l’ignorance, sans transformer celle-ci en mérite.
- source_word: ἐποίησα
  choice: j’ai agi
  rationale: En l’absence d’objet exprimé, « agir » rend idiomatiquement le sens large de ποιέω et se rattache clairement à la conduite décrite.
- source_word: ἐν ἀπιστίᾳ
  choice: dans l’incrédulité
  rationale: Dans ce contexte, ἀπιστία désigne très probablement l’absence de foi plutôt que l’infidélité à une alliance; la formulation conserve néanmoins la construction prépositionnelle grecque.
theological_decisions:
- issue: Portée causale de ὅτι
  choice: Paul dit avoir reçu miséricorde parce qu’il a agi par ignorance, dans l’incrédulité.
  alternative: Comprendre la proposition comme une simple circonstance explicative, sans valeur causale proprement dite.
  rationale: « Parce que » respecte la valeur naturelle de ὅτι et maintient la tension du texte. La traduction ne dit pas que l’ignorance méritait la miséricorde et n’ajoute aucune explication doctrinale destinée à résoudre cette tension.
translation_notes:
  register: Français international moderne, digne et accessible. La relative initiale permet de relier naturellement ce fragment au verset précédent. La répétition des articles souligne les trois qualifications personnelles, tandis que « j’ai reçu miséricorde » évite la tournure peu courante « il m’a été fait miséricorde » dans le corps du texte.
