reference: 1 Timothy 1:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὑπερεπλεόνασεν δὲ ἡ χάρις τοῦ κυρίου ἡμῶν μετὰ πίστεως καὶ ἀγάπης τῆς ἐν Χριστῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/014.yaml
  text: But the grace of our Lord overflowed all the more[a], with faith and love that are in Messiah Jesus.
translation:
  language: fr
  text: Mais la grâce de notre Seigneur a surabondé, avec la foi et l’amour qui sont dans le Messie Jésus[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Christ Jésus ».
    reason: Signale la traduction traditionnelle possible du titre Χριστός.
lexical_decisions:
- source_word: ὑπερεπλεόνασεν
  choice: a surabondé
  rationale: Le verbe composé exprime une abondance exceptionnelle. « A surabondé » conserve cette intensité dans une formulation française concise et digne.
- source_word: δὲ
  choice: Mais
  rationale: Dans le contexte, δέ marque le contraste avec l’état antérieur d’incrédulité décrit au verset précédent.
- source_word: χάρις
  choice: grâce
  rationale: « Grâce » est le terme français courant qui convient ici à la faveur divine agissante.
- source_word: τοῦ κυρίου ἡμῶν
  choice: de notre Seigneur
  rationale: Cette formulation rend directement le génitif grec et conserve le titre κύριος.
- source_word: μετὰ πίστεως καὶ ἀγάπης
  choice: avec la foi et l’amour
  rationale: μετά avec le génitif indique ici l’accompagnement; la traduction maintient le lien grammatical entre la grâce surabondante, la foi et l’amour sans préciser davantage leur rapport causal.
- source_word: τῆς ἐν Χριστῷ Ἰησοῦ
  choice: qui se trouvent dans le Messie Jésus
  rationale: La relative française rattache naturellement le groupe prépositionnel à la foi et à l’amour. « Se trouvent dans » exprime l’union ou la sphère indiquée par ἐν sans la développer théologiquement.
- source_word: Χριστῷ Ἰησοῦ
  choice: le Messie Jésus
  rationale: « Messie » traduit le sens titulaire de Χριστός; l’ordre des éléments suit le grec, tandis que l’article français rend l’expression intelligible.
theological_decisions:
- issue: Rapport entre la grâce et « avec la foi et l’amour »
  choice: La grâce du Seigneur surabonde avec la foi et l’amour qui se trouvent dans le Messie Jésus.
  alternative: La foi et l’amour sont explicitement présentés comme les effets produits par la grâce chez Paul.
  rationale: La syntaxe rattache naturellement μετὰ πίστεως καὶ ἀγάπης au verbe décrivant la grâce. La traduction préserve ce rapport sans imposer une causalité que le texte ne formule pas explicitement.
- issue: Traduction de Χριστός
  choice: Messie
  alternative: Christ
  rationale: Χριστός garde ici sa valeur de titre. « Messie » en exprime le sens, tandis que la variante traditionnelle est signalée en note.
translation_notes:
  register: Français international moderne, concis et digne. « Surabondé » est légèrement soutenu, mais il restitue avec précision l’intensification du verbe grec. La formulation conserve l’ambiguïté du rapport exact entre la grâce, la foi et l’amour.
