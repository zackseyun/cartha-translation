id: 1TI.1.15
reference: 1 Timothy 1:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: πιστὸς ὁ λόγος καὶ πάσης ἀποδοχῆς ἄξιος, ὅτι Χριστὸς Ἰησοῦς ἦλθεν εἰς τὸν κόσμον ἁμαρτωλοὺς σῶσαι· ὧν πρῶτός εἰμι ἐγώ,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/015.yaml
  text: 'The saying is trustworthy and worthy of full acceptance: that Messiah Jesus came into the world to save sinners[b][a], of whom I am the foremost.'
translation:
  language: fr
  text: 'Cette parole est digne de confiance et mérite d’être pleinement accueillie : le Messie Jésus[a] est venu dans le monde pour sauver les pécheurs, dont je suis le premier[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Christ Jésus ».'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « le pire » ou « le principal ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πιστὸς ὁ λόγος
  choice: Cette parole est digne de confiance
  rationale: Dans la formule propre aux épîtres pastorales, ὁ λόγος désigne une parole ou affirmation reconnue comme fiable. « Cette parole » restitue naturellement la valeur de la formule en français.
- source_word: πάσης ἀποδοχῆς ἄξιος
  choice: mérite d’être pleinement accueillie
  rationale: ἀποδοχή exprime l’accueil ou l’acceptation, et πάσης en renforce la portée. Cette formulation française demeure naturelle tout en conservant l’idée d’un accueil entier et sans réserve.
- source_word: ὅτι
  choice: ':'
  rationale: ὅτι introduit ici le contenu de la parole digne de confiance. En français, les deux-points présentent ce contenu plus naturellement qu’un « que » après la première proposition.
- source_word: Χριστὸς Ἰησοῦς
  choice: le Messie Jésus
  rationale: Χριστός garde ici sa valeur de titre. « Le Messie Jésus » rend ce sens tout en conservant l’ordre des mots grecs; « Christ Jésus » est signalé en note comme formulation traditionnelle possible.
- source_word: ἦλθεν εἰς τὸν κόσμον
  choice: est venu dans le monde
  rationale: Rend directement le mouvement exprimé par ἔρχομαι avec εἰς et conserve la résonance théologique de l’expression sans l’expliciter davantage.
- source_word: ἁμαρτωλοὺς σῶσαι
  choice: pour sauver les pécheurs
  rationale: L’infinitif de but σῶσαι est naturellement rendu par « pour sauver », et l’adjectif substantivé ἁμαρτωλούς par « les pécheurs ».
- source_word: ὧν πρῶτός εἰμι ἐγώ
  choice: dont je suis le premier
  rationale: « Le premier » préserve l’image de rang portée par πρῶτος ainsi que son ambiguïté, sans imposer l’interprétation « le pire ». La présence explicite de « je » restitue l’accent de ἐγώ.
theological_decisions:
- issue: Traduction de Χριστός
  choice: le Messie Jésus
  alternative: Christ Jésus
  rationale: Le terme grec peut fonctionner comme titre (« Messie ») tout en étant traditionnellement rendu par « Christ ». Le texte principal retient la valeur titulaire, et la note conserve l’autre lecture familière.
- issue: Portée de πρῶτος parmi les pécheurs
  choice: le premier
  alternative: le pire ou le principal
  rationale: Le grec exprime littéralement la première place et peut suggérer la prééminence sans préciser s’il s’agit du rang ou de la gravité morale. La traduction principale maintient cette tension.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la forme solennelle d’une affirmation reconnue, tout en évitant un calque maladroit de ὅτι. Les notes rendent visibles les deux principales possibilités lexicales sans trancher au-delà du grec.
