id: 1TI.1.9
reference: 1 Timothy 1:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἰδὼς τοῦτο, ὅτι δικαίῳ νόμος οὐ κεῖται, ἀνόμοις δὲ καὶ ἀνυποτάκτοις, ἀσεβέσι καὶ ἁμαρτωλοῖς, ἀνοσίοις καὶ βεβήλοις, πατρολῴαις καὶ μητρολῴαις, ἀνδροφόνοις,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/009.yaml
  text: 'understanding this: the law is not laid down for a righteous man, but for the lawless and rebellious, the ungodly and sinful, the unholy and profane, those who kill their fathers and those who kill their mothers, murderers,'
translation:
  language: fr
  text: 'sachant ceci : la loi n’est pas établie pour un juste, mais pour les gens sans loi et rebelles, les impies et les pécheurs, les sacrilèges et les profanes, ceux qui tuent leur père et ceux qui tuent leur mère[a], les meurtriers,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou peut-être : « ceux qui frappent leur père et ceux qui frappent leur mère ». Les termes grecs peuvent désigner une agression violente contre son père ou sa mère, bien que le sens « tuer » soit probable ici.'
    reason: Alternative lexicale concernant πατρολῴαις et μητρολῴαις; la note préserve l’incertitude sans modifier la coordination des deux termes grecs.
lexical_decisions:
- source_word: εἰδὼς τοῦτο
  choice: sachant ceci
  rationale: Le participe exprime la connaissance qui fonde l’affirmation; cette formulation conserve sa relation syntaxique avec le contexte précédent.
- source_word: δικαίῳ
  choice: pour un juste
  rationale: Le datif masculin singulier est conservé sous une forme française concise et représentative, sans préciser davantage l’identité de la personne.
- source_word: νόμος οὐ κεῖται
  choice: la loi n’est pas établie
  rationale: « Établie » restitue l’idée juridique de κεῖται sans adopter la paraphrase plus interprétative « ne s’applique pas ».
- source_word: ἀνόμοις
  choice: les gens sans loi
  rationale: La formulation rend directement le rapport négatif à la loi et reste compréhensible en français courant.
- source_word: ἀνυποτάκτοις
  choice: rebelles
  rationale: Le terme exprime le refus de se soumettre, dans une langue naturelle et actuelle.
- source_word: ἀσεβέσι
  choice: impies
  rationale: « Impies » exprime le manque de respect envers Dieu et demeure distinct des termes suivants.
- source_word: ἁμαρτωλοῖς
  choice: pécheurs
  rationale: Le substantif français naturel correspond aux personnes caractérisées par le péché.
- source_word: ἀνοσίοις
  choice: ceux qui ne respectent rien de sacré
  rationale: Cette formulation accessible exprime la violation de ce qui est saint tout en évitant de confondre le terme avec βεβήλοις.
- source_word: βεβήλοις
  choice: les profanateurs
  rationale: Le choix souligne le traitement profane de ce qui est sacré et préserve la distinction avec ἀσεβέσι et ἀνοσίοις.
- source_word: πατρολῴαις καὶ μητρολῴαις
  choice: ceux qui tuent leur père ou leur mère
  rationale: Le sens homicide est probable dans cette liste, mais les mots grecs peuvent aussi désigner ceux qui frappent violemment leurs parents; l’incertitude est signalée en note.
- source_word: ἀνδροφόνοις
  choice: les meurtriers
  rationale: Le terme français exprime clairement l’homicide criminel dans cette liste de vices.
theological_decisions:
- issue: Portée du masculin singulier δικαίῳ
  choice: un juste
  alternative: une personne juste / les justes
  rationale: « Un juste » conserve le singulier masculin grammatical du grec et sa portée représentative sans affirmer que l’énoncé ne concernerait que les hommes.
- issue: Sens de πατρολῴαις et μητρολῴαις
  choice: ceux qui tuent leur père ou leur mère
  alternative: ceux qui frappent leur père ou leur mère
  rationale: Le contexte d’une liste de fautes graves, immédiatement suivi de « meurtriers », favorise le sens homicide, mais les deux termes rares permettent aussi le sens d’agression violente; la note maintient cette ambiguïté lexicale.
translation_notes:
  register: Français international moderne, digne et accessible. La série conserve le rythme des paires grecques autant que le permet une formulation naturelle. « Un juste » maintient la forme singulière représentative; la note préserve l’incertitude réelle concernant la violence envers les parents.
