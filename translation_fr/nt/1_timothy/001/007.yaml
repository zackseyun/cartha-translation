  source_fidelity: 'Le premier membre rend fidèlement θέλοντες εἶναι νομοδιδάσκαλοι. La concessive « alors qu’ils ne comprennent » exprime bien μὴ νοοῦντες. En revanche, « ce qu’ils affirment » neutralise la préposition περί dans περὶ τίνων : le grec vise les sujets au sujet desquels ils formulent des affirmations catégoriques, plutôt que seulement le contenu de ces affirmations.'
  naturalness: La formulation est globalement naturelle et adaptée au français international moderne. « Les sujets sur lesquels ils se montrent si catégoriques » est idiomatique, garde la distinction syntaxique du grec et évite une lourde tournure littérale.
  terminology: « Enseignants de la Loi » convient dans le contexte et la note présente avec prudence l’identification probable à la Loi juive/Torah. La majuscule est cohérente avec cette référence contextuelle et n’ajoute pas « mosaïque » au texte.
  issues:
  - severity: medium
    issue: Le second complément de « ne comprennent » est rendu comme l’objet direct de l’affirmation.
    rationale: περὶ τίνων dépend de διαβεβαιοῦνται et signifie « au sujet de quelles choses/questions ils affirment avec assurance ». « Ce qu’ils affirment » peut être compris comme le contenu de l’affirmation et efface cette nuance. Une formulation portant sur les sujets préserve mieux le grec.
  revised_text: Ils veulent être des enseignants de la Loi[a], alors qu’ils ne comprennent ni ce qu’ils disent ni les sujets sur lesquels ils se montrent si catégoriques.[b]
