id: 1TI.1.7
reference: 1 Timothy 1:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: θέλοντες εἶναι νομοδιδάσκαλοι, μὴ νοοῦντες μήτε ἃ λέγουσιν μήτε περὶ τίνων διαβεβαιοῦνται.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/007.yaml
  text: wanting to be teachers of the law[b][a], though they understand neither what they are saying nor the things about which they speak so confidently.
translation:
  language: fr
  text: Ils veulent être des enseignants de la Loi[a], alors qu’ils ne comprennent ni ce qu’ils disent ni les sujets sur lesquels ils se montrent si catégoriques.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « enseignants de la Loi » désigne probablement ceux qui prétendaient enseigner avec autorité la Loi juive, la Torah.
    reason: cultural_note
  - marker: b
    text: 'Litt. : « ni [ce] au sujet de quoi ils affirment avec tant d’assurance ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: θέλοντες
  choice: Ils veulent
  rationale: Le participe présent exprime le désir continu des personnes évoquées au verset précédent; « veulent » est naturel et conserve cette valeur volitive.
- source_word: εἶναι
  choice: être
  rationale: Infinitif complémentaire de θέλοντες, rendu directement.
- source_word: νομοδιδάσκαλοι
  choice: des enseignants de la Loi
  rationale: Le nom composé désigne des personnes qui enseignent la loi. La majuscule signale ici la référence contextuellement probable à la Loi juive, sans ajouter « de Moïse » dans le texte.
- source_word: μὴ νοοῦντες
  choice: alors qu’ils ne comprennent
  rationale: 'La proposition participiale a une valeur concessive: ils aspirent à enseigner, mais manquent de compréhension.'
- source_word: μήτε ... μήτε
  choice: ni ... ni
  rationale: Correspondance française naturelle de la double négation corrélative grecque.
- source_word: ἃ λέγουσιν
  choice: ce qu’ils disent
  rationale: Cette formulation rend clairement le contenu de leurs paroles sans surinterpréter l’aspect du présent grec.
- source_word: περὶ τίνων
  choice: ce qu’ils ... affirment
  rationale: En lien avec διαβεβαιοῦνται, l’expression porte sur les sujets ou affirmations au sujet desquels ils se montrent catégoriques; la formulation française évite une tournure pesante.
- source_word: διαβεβαιοῦνται
  choice: affirment avec tant d’assurance
  rationale: Le verbe exprime une affirmation ferme ou insistante. Cette traduction garde la critique de leur assurance malgré leur incompréhension.
theological_decisions:
- issue: Référence de νομοδιδάσκαλοι à la Loi
  choice: « enseignants de la Loi » dans le texte, avec une note indiquant la référence probable à la Torah
  alternative: « enseignants de la loi » ou « enseignants de la loi de Moïse »
  rationale: Le contexte vise très probablement la Loi juive, mais le grec ne précise pas explicitement « de Moïse ». Le texte reste concis et la note expose l’identification probable sans la rendre plus certaine que la source.
- issue: Portée parallèle des deux compléments de compréhension
  choice: « ni ce qu’ils disent ni ce qu’ils affirment avec tant d’assurance »
  alternative: « ni ce qu’ils disent ni les sujets sur lesquels ils se prononcent avec tant d’assurance »
  rationale: Le grec permet de comprendre le second membre comme les choses qu’ils affirment ou comme les sujets sur lesquels ils insistent. Le texte retient la formulation la plus naturelle et une note préserve l’autre nuance.
translation_notes:
  register: Français international moderne, naturel et digne. « Enseignants » est accessible et non confessionnel; « avec tant d’assurance » restitue la force critique du verbe sans employer un vocabulaire inutilement technique.
