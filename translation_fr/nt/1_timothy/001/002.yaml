id: 1TI.1.2
reference: 1 Timothy 1:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Τιμοθέῳ γνησίῳ τέκνῳ ἐν πίστει· χάρις, ἔλεος, εἰρήνη ἀπὸ θεοῦ ⸀πατρὸς καὶ Χριστοῦ Ἰησοῦ τοῦ κυρίου ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/002.yaml
  text: 'To Timothy[a], my true child in the faith: grace, mercy[b], and peace from God the Father and Messiah Jesus our Lord.'
translation:
  language: fr
  text: 'À Timothée, mon véritable enfant dans la foi[a] : grâce, miséricorde et paix de la part de Dieu le Père et de Jésus le Messie[b], notre Seigneur.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « mon véritable enfant en foi » ; l’expression peut évoquer la foi partagée ou la foi comme cadre de cette relation spirituelle.
    reason: lexical_alternative
  - marker: b
    text: 'Traduction traditionnelle : « Jésus-Christ ». Le grec place le titre avant le nom : « Messie Jésus ».'
    reason: translation_alternative
lexical_decisions:
- source_word: γνησίῳ τέκνῳ
  choice: mon véritable enfant
  rationale: « Véritable » exprime l’authenticité de la relation spirituelle sans suggérer une filiation biologique. « Enfant » conserve la portée non spécifiquement masculine de τέκνον. Le possessif « mon », implicite dans la relation exprimée, rend la formule naturelle en français.
- source_word: ἐν πίστει
  choice: dans la foi
  rationale: Cette formulation peut désigner la foi comme sphère commune de la relation entre Paul et Timothée, tout en laissant ouverte une nuance plus personnelle.
- source_word: χάρις, ἔλεος, εἰρήνη
  choice: grâce, miséricorde et paix
  rationale: Ces équivalents français usuels préservent les trois éléments distincts de la salutation.
- source_word: ἀπὸ θεοῦ πατρὸς
  choice: de la part de Dieu le Père
  rationale: « De la part de » exprime naturellement la provenance indiquée par ἀπό, et « Dieu le Père » est la tournure française idiomatique.
- source_word: Χριστοῦ Ἰησοῦ
  choice: Jésus le Messie
  rationale: Χριστός garde ici sa valeur de titre. L’ordre français « Jésus le Messie » est plus naturel que « le Messie Jésus », même s’il inverse l’ordre grec.
- source_word: κυρίου ἡμῶν
  choice: notre Seigneur
  rationale: Rend directement la désignation christologique tout en conservant sa forme liturgique et relationnelle.
theological_decisions:
- issue: Portée de ἐν πίστει
  choice: dans la foi
  alternative: par la foi / dans la fidélité
  rationale: « Dans la foi » conserve le sens probable d’une foi partagée comme cadre de la filiation spirituelle, sans imposer exclusivement un sens instrumental ou subjectif.
- issue: Rendu de Χριστοῦ Ἰησοῦ
  choice: Jésus le Messie
  alternative: Jésus-Christ
  rationale: Le choix traduit Χριστός comme un titre plutôt que de le traiter comme un simple élément du nom, tout en employant un ordre naturel en français.
translation_notes:
  register: Français international moderne, digne et accessible. La ponctuation suit la forme d’une adresse épistolaire. Les termes théologiques courants sont conservés sans ajouter de précision confessionnelle.
