  text: τὸ δὲ τέλος τῆς παραγγελίας ἐστὶν ἀγάπη ἐκ καθαρᾶς καρδίας καὶ συνειδήσεως ἀγαθῆς καὶ πίστεως ἀνυποκρίτου,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/005.yaml
  text: The goal of the instruction is love from a pure heart and a good conscience and sincere faith[c][b][a],
translation:
  language: fr
  text: Le but[a] de l’instruction[b] est l’amour qui provient d’un cœur pur, d’une bonne conscience et d’une foi sincère[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la visée » ou « l’aboutissement » de l’instruction.
    reason: lexical_alternative
  - marker: b
    text: Ou « consigne » ou « ordre ».
    reason: lexical_alternative
  - marker: c
    text: Littéralement « d’une foi sans hypocrisie ». Le mot grec traduit par « foi » peut aussi, selon le contexte, désigner la confiance ou la fidélité.
    reason: alternative_reading
lexical_decisions:
- source_word: τέλος
  choice: but
  rationale: Dans ce contexte, le mot désigne la visée ou le résultat recherché de l’instruction, plutôt que sa cessation.
- source_word: παραγγελία
  choice: instruction
  rationale: Le terme peut désigner une consigne, un ordre ou une instruction. Ici, « instruction » convient au contexte pastoral et pédagogique des versets précédents.
- source_word: ἀγάπη
  choice: amour
  rationale: Équivalent français naturel et usuel, qui conserve la portée éthique du terme.
- source_word: ἐκ
  choice: qui vient de
  rationale: La préposition indique ici la source ou l’origine de l’amour; cette tournure est plus naturelle en français qu’une répétition littérale de « venant de ».
- source_word: καθαρᾶς καρδίας
  choice: un cœur pur
  rationale: Cette formulation conserve le sens moral et intérieur de l’expression grecque dans un français courant et digne.
- source_word: συνειδήσεως ἀγαθῆς
  choice: une bonne conscience
  rationale: « Bonne » correspond directement à ἀγαθῆς et évite l’interprétation plus étroite de « conscience tranquille ».
- source_word: πίστεως
  choice: foi
  rationale: « Foi » demeure le sens le plus probable ici, tout en laissant en note les nuances possibles de confiance et de fidélité.
- source_word: ἀνυποκρίτου
  choice: sincère
  rationale: Cette formulation idiomatique exprime naturellement une foi exempte d’hypocrisie.
- source_word: δέ
  choice: non rendu explicitement
  rationale: La particule marque une transition légère. En français, l’absence de connecteur en tête de phrase est naturelle ici et évite d’ajouter une valeur temporelle ou adversative trop appuyée.
theological_decisions:
- issue: Sens de πίστις dans πίστεως ἀνυποκρίτου
  choice: foi
  alternative: fidélité ou confiance
  rationale: Le contexte permet de comprendre une foi authentique comme source de l’amour. Comme πίστις peut aussi exprimer la confiance ou la fidélité, ces possibilités sont signalées sans trancher dogmatiquement.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe conserve les trois sources coordonnées de l’amour et ne renforce pas artificiellement la particule δέ. Les appels de notes sont placés auprès des expressions concernées.
