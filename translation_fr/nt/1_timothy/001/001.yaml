id: 1TI.1.1
reference: 1 Timothy 1:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Παῦλος ἀπόστολος ⸂Χριστοῦ Ἰησοῦ⸃ κατ’ ἐπιταγὴν θεοῦ σωτῆρος ἡμῶν καὶ ⸂Χριστοῦ Ἰησοῦ⸃ τῆς ἐλπίδος ἡμῶν
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/001.yaml
  text: Paul[a], an apostle of Messiah Jesus by the command of God our Savior and Messiah Jesus our hope[b],
translation:
  language: fr
  text: Paul, apôtre du Messie Jésus[a] par ordre de Dieu notre Sauveur et du Messie Jésus notre espérance,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Christ Jésus », ici et dans la seconde occurrence. Le titre grec Χριστός peut être traduit par « Messie » ou prendre la forme traditionnelle « Christ ».
    reason: alternative_reading
lexical_decisions:
- source_word: Παῦλος
  choice: Paul
  rationale: Forme française traditionnelle du nom propre grec.
- source_word: ἀπόστολος
  choice: apôtre
  rationale: Terme consacré qui désigne ici la fonction et l’autorité particulières revendiquées par Paul.
- source_word: Χριστοῦ Ἰησοῦ
  choice: du Messie Jésus
  rationale: Χριστός conserve ici sa valeur de titre et est donc traduit par « Messie »; le génitif marque l’appartenance ou la mission reçue.
- source_word: κατ’ ἐπιταγήν
  choice: par ordre de
  rationale: Expression française naturelle qui rend l’idée d’une directive faisant autorité et fondant la mission de Paul.
- source_word: θεοῦ σωτῆρος ἡμῶν
  choice: de Dieu notre Sauveur
  rationale: Cette formulation conserve l’apposition grecque et applique clairement le titre « Sauveur » à Dieu.
- source_word: καὶ Χριστοῦ Ἰησοῦ
  choice: et du Messie Jésus
  rationale: La préposition contractée « du » est répétée en français pour rendre sans lourdeur les deux génitifs coordonnés dépendant de « par ordre ».
- source_word: τῆς ἐλπίδος ἡμῶν
  choice: notre espérance
  rationale: « Espérance » est le correspondant français usuel du terme et désigne ici le Messie Jésus par apposition.
theological_decisions:
- issue: Valeur de Χριστός
  choice: Messie
  alternative: Christ
  rationale: Dans cette formule d’ouverture, le titre demeure sémantiquement actif. « Messie » traduit donc le titre, tandis qu’une note signale la formulation traditionnelle « Christ Jésus ».
- issue: Rapport entre « notre espérance » et le Messie Jésus
  choice: 'Apposition compacte : « le Messie Jésus notre espérance »'
  alternative: « le Messie Jésus, qui est notre espérance »
  rationale: Le grec identifie directement le Messie Jésus à « notre espérance ». La formulation retenue préserve la concision et la force de cette apposition sans l’expliciter par une proposition relative.
- issue: Portée de « par ordre de »
  choice: L’ordre vient de Dieu notre Sauveur et du Messie Jésus notre espérance
  alternative: Rattacher seulement Dieu à l’ordre et lire la seconde expression plus librement
  rationale: Les deux groupes au génitif sont coordonnés par καί et dépendent naturellement de ἐπιταγήν; la répétition française de « du » rend cette structure explicite sans ajouter d’idée.
translation_notes:
  register: Français international moderne, sobre et digne. La phrase conserve la forme épistolaire grecque et sa virgule finale, puisque le verset se poursuit. « Par ordre de » évite le calque plus raide « selon le commandement de »; l’apposition sans virgule « notre espérance » garde la densité de l’original.
