id: 1TI.1.11
reference: 1 Timothy 1:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: κατὰ τὸ εὐαγγέλιον τῆς δόξης τοῦ μακαρίου θεοῦ, ὃ ἐπιστεύθην ἐγώ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/011.yaml
  text: according to the gospel of the glory of the blessed God[a], which was entrusted to me.
translation:
  language: fr
  text: conformément à l’Évangile de la gloire du Dieu bienheureux[a], qui m’a été confié.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de manière plus idiomatique : « le glorieux Évangile du Dieu bienheureux ».'
    reason: La chaîne de génitifs grecque peut être rendue par une tournure adjectivale en français, mais le texte principal en conserve la forme afin de ne pas en restreindre le sens.
lexical_decisions:
- source_word: κατὰ
  choice: conformément à
  rationale: Avec l’accusatif, κατά exprime ici la norme ou la référence à laquelle ce qui précède doit correspondre. « Conformément à » est naturel en français et garde ce rapport normatif.
- source_word: εὐαγγέλιον
  choice: Évangile
  rationale: « Évangile » est le terme consacré et demeure clair dans ce contexte paulinien; il conserve mieux la portée théologique du grec que le plus général « bonne nouvelle ».
- source_word: τῆς δόξης
  choice: de la gloire
  rationale: Le génitif grec est conservé au lieu d’être transformé en adjectif. Cette formulation laisse ouverte la relation exacte entre l’Évangile et la gloire.
- source_word: μακαρίου
  choice: bienheureux
  rationale: Appliqué à Dieu, « bienheureux » exprime sa félicité parfaite sans suggérer qu’il aurait reçu une bénédiction d’un autre. « Heureux » serait moins digne et « béni » pourrait infléchir le sens.
- source_word: θεοῦ
  choice: du Dieu
  rationale: Traduction directe du génitif θεοῦ, rattaché à « gloire » dans la chaîne de génitifs.
- source_word: ὃ
  choice: qui
  rationale: Le pronom relatif neutre reprend « Évangile ». En français, « qui » devient le sujet grammatical de la tournure passive « m’a été confié ».
- source_word: ἐπιστεύθην
  choice: m’a été confié
  rationale: Le passif a ici le sens d’« être chargé de » ou de recevoir quelque chose en dépôt, et non celui de « croire ». La tournure française exprime clairement que l’Évangile a été confié à Paul.
- source_word: ἐγώ
  choice: m’
  rationale: Le pronom grec explicite souligne la personne de Paul. Le français l’exprime naturellement par le pronom personnel dans « m’a été confié », sans ajouter une emphase artificielle.
theological_decisions:
- issue: Relation des génitifs dans τὸ εὐαγγέλιον τῆς δόξης τοῦ μακαρίου θεοῦ
  choice: l’Évangile de la gloire du Dieu bienheureux
  alternative: le glorieux Évangile du Dieu bienheureux
  rationale: La traduction principale préserve la construction grecque et son ambiguïté possible plutôt que de réduire « de la gloire » à un simple adjectif. La formulation adjectivale, plus idiomatique, est donnée en note.
- issue: Sens de ἐπιστεύθην
  choice: qui m’a été confié
  alternative: que j’ai cru
  rationale: Dans cette construction passive, le verbe désigne le fait de recevoir une charge ou un dépôt. Le contexte paulinien de la mission confiée confirme ce sens.
translation_notes:
  register: Français international moderne, digne et accessible. La structure « Évangile de la gloire » est volontairement plus formelle afin de préserver le relief et l’ambiguïté du grec; la note propose la formulation française plus courante.
