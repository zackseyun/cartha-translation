  text: ὧν τινες ἀστοχήσαντες ἐξετράπησαν εἰς ματαιολογίαν,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/006.yaml
  text: Some[a], having missed these things, have turned aside to empty talk[b],
translation:
  language: fr
  text: Certains, s’étant écartés de ces choses[a], se sont détournés vers des discours creux[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ayant manqué le but à leur égard ». Le verbe peut évoquer le fait de manquer un but ou de dévier de celui-ci.
    reason: lexical_alternative
  - marker: b
    text: Ou « vers de vaines discussions » ou « vers des paroles sans valeur ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ὧν
  choice: de ces choses
  rationale: Le pronom relatif au génitif pluriel renvoie aux réalités mentionnées au verset 5. Cette formulation française rend clairement le renvoi anaphorique sans en préciser excessivement l’étendue.
- source_word: τινες
  choice: Certains
  rationale: Le pronom indéfini désigne un groupe non précisé; « Certains » est naturel et conserve cette indétermination.
- source_word: ἀστοχήσαντες
  choice: s’étant écartés
  rationale: Le verbe exprime l’idée de manquer un but ou de dévier. « S’étant écartés » convient naturellement avec « de ces choses » et préserve l’image d’une déviation sans la renforcer indûment.
- source_word: ἐξετράπησαν
  choice: se sont détournés
  rationale: La forme verbale décrit l’abandon d’une bonne direction. Le pronominal français restitue ici naturellement le sens moyen ou déponent.
- source_word: εἰς
  choice: vers
  rationale: La préposition indique la direction ou le résultat du détournement; « vers » maintient la métaphore directionnelle.
- source_word: ματαιολογίαν
  choice: des discours creux
  rationale: Le terme désigne une parole vaine, futile ou dépourvue de profit. « Des discours creux » est actuel, compréhensible et digne, tout en gardant la nuance polémique.
theological_decisions:
- issue: Référent du pronom relatif ὧν
  choice: Renvoi générique aux réalités éthiques et spirituelles qui précèdent, exprimé par « de ces choses »
  alternative: Renvoi plus étroit au cœur pur, à la bonne conscience et à la foi sincère, ou traduction plus formelle par « lesquelles »
  rationale: La syntaxe dépend du verset précédent. La formulation retenue rend le lien intelligible sans imposer une délimitation plus étroite que ne le fait le grec.
translation_notes:
  register: Français international moderne, naturel et digne. La double image de l’écart puis du détournement est conservée, ainsi que l’indétermination de « certains ».
