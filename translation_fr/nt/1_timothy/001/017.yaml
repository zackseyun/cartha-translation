id: 1TI.1.17
reference: 1 Timothy 1:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τῷ δὲ βασιλεῖ τῶν αἰώνων, ἀφθάρτῳ, ἀοράτῳ, ⸀μόνῳ θεῷ, τιμὴ καὶ δόξα εἰς τοὺς αἰῶνας τῶν αἰώνων· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/017.yaml
  text: To the King of the ages[a], immortal, invisible, the only God, be honor and glory forever and ever. Amen.
translation:
  language: fr
  text: Au Roi des siècles, immortel, invisible, au Dieu unique[a], soient l’honneur et la gloire pour toujours et à jamais. Amen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Certains manuscrits portent : « au seul Dieu sage ».'
    reason: textual_variant
lexical_decisions:
- source_word: βασιλεῖ τῶν αἰώνων
  choice: Roi des siècles
  rationale: Cette traduction conserve la construction grecque et le vocabulaire des αἰῶνες, tout en exprimant la souveraineté de Dieu à travers tous les âges. « Roi éternel » serait plus fluide, mais interpréterait le génitif plutôt que de le reproduire.
- source_word: ἀφθάρτῳ
  choice: immortel
  rationale: Appliqué à Dieu, « immortel » exprime naturellement son exemption de la corruption et de la mort; « incorruptible » serait plus formel mais moins courant.
- source_word: ἀοράτῳ
  choice: invisible
  rationale: Équivalent direct, clair et consacré de ἀόρατος dans ce contexte doxologique.
- source_word: μόνῳ θεῷ
  choice: au Dieu unique
  rationale: Cette formulation française naturelle rend la confession monothéiste explicite du grec sans ajouter l’adjectif variant « sage ».
- source_word: τιμὴ καὶ δόξα
  choice: l’honneur et la gloire
  rationale: Association française habituelle et précise pour τιμή et δόξα dans une doxologie.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: pour toujours et à jamais
  rationale: Formule idiomatique et solennelle exprimant la durée sans fin, plutôt qu’un calque peu naturel comme « pour les siècles des siècles ».
- source_word: ἀμήν
  choice: Amen
  rationale: Translittération conventionnelle conservée dans la Bible et le culte chrétiens.
- source_word: δὲ
  choice: non rendu séparément
  rationale: La particule marque ici la transition vers la doxologie. Un « Or » ou « Maintenant » initial alourdirait le français et risquerait d’introduire une nuance temporelle absente.
theological_decisions:
- issue: Préserver la force monothéiste de μόνῳ θεῷ sans ajouter de précision doctrinale
  choice: au Dieu unique
  alternative: à Dieu seul
  rationale: Le choix traduit directement l’affirmation du texte et laisse intacte sa portée théologique, sans tenter de résoudre ici son rapport avec les autres affirmations néotestamentaires concernant le Christ.
- issue: Variante textuelle comportant σοφῷ (« sage »)
  choice: omettre « sage » du texte principal
  alternative: au seul Dieu sage
  rationale: Le texte du SBLGNT fourni lit μόνῳ θεῷ sans σοφῷ. La leçon plus longue est néanmoins signalée en note en raison de son attestation manuscrite et de sa présence dans certaines traditions bibliques.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe appositionnelle de la doxologie est conservée, avec répétition de « au » devant « Dieu unique » pour assurer la clarté. Le marqueur de note est placé à l’endroit précis de la variante textuelle.
