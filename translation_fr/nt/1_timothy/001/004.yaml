    rationale: En français courant, « intendance » évoque volontiers une fonction ou une gestion matérielle. Οἰκονομία peut aussi désigner le plan ou l’administration divine; « plan de Dieu » est plus idiomatique ici, avec les autres possibilités maintenues en note.
