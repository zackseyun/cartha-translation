reference: 1 Timothy 1:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: μηδὲ προσέχειν μύθοις καὶ γενεαλογίαις ἀπεράντοις, αἵτινες ⸀ἐκζητήσεις παρέχουσι μᾶλλον ἢ οἰκονομίαν θεοῦ τὴν ἐν πίστει—
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/004.yaml
  text: nor to pay attention to myths and endless genealogies[c][b][a], which promote speculations rather than the stewardship from God that is by faith—
translation:
  language: fr
  text: ni de prêter attention à des mythes et à des généalogies interminables, qui suscitent des spéculations[a] plutôt que le plan de Dieu dans la foi[b][c]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « suscitent des controverses » ou « donnent lieu à des recherches ». Le terme grec peut désigner des investigations ou des disputes, ici avec le sens négatif de spéculations improductives.
    reason: lexical_alternative
  - marker: b
    text: Ou « l’administration de Dieu », « l’intendance de Dieu » ou « l’intendance venant de Dieu ». Le grec οἰκονομία peut désigner une administration, une intendance ou un plan ordonné; « de Dieu » peut aussi indiquer la provenance.
    reason: lexical_alternative
  - marker: c
    text: Ou « par la foi »; le mot rendu par « foi » peut aussi comporter une nuance de confiance ou de fidélité.
    reason: alternative_reading
lexical_decisions:
- source_word: προσέχειν
  choice: prêter attention à
  rationale: Cette expression française naturelle conserve l’idée d’accorder son attention ou de s’attacher à quelque chose, et l’infinitif poursuit la consigne du verset précédent.
- source_word: μύθοις
  choice: mythes
  rationale: « Mythes » est l’équivalent direct et actuel, sans la coloration vieillie ou enfantine que pourrait avoir « fables ».
- source_word: γενεαλογίαις ἀπεράντοις
  choice: généalogies interminables
  rationale: « Interminables » exprime à la fois l’absence de fin et la nuance péjorative d’une recherche qui se prolonge sans fruit.
- source_word: ἐκζητήσεις
  choice: spéculations
  rationale: Dans ce contexte, le terme désigne des recherches ou discussions improductives. « Spéculations » rend clairement cette valeur négative sans réduire le sens aux seules querelles.
- source_word: παρέχουσι
  choice: suscitent
  rationale: Le verbe signifie ici produire, occasionner ou donner lieu à; « suscitent » est idiomatique et convient à des spéculations.
- source_word: μᾶλλον ἢ
  choice: plutôt que
  rationale: Cette tournure rend naturellement le contraste entre deux résultats opposés.
- source_word: οἰκονομίαν θεοῦ
  choice: l’intendance de Dieu
  rationale: « Intendance » préserve l’idée concrète de gestion ou d’administration portée par οἰκονομία. Le complément « de Dieu » laisse ouverte, autant que le français le permet, la question de la possession ou de la provenance.
- source_word: τὴν ἐν πίστει
  choice: laquelle s’exerce dans la foi
  rationale: La relative rattache clairement l’expression à « intendance » et « dans la foi » conserve la valeur de sphère ou de moyen possible de ἐν sans la trancher.
- source_word: πίστει
  choice: foi
  rationale: « Foi » est le rendu normal de πίστις ici; les nuances possibles de confiance et de fidélité sont signalées en note.
theological_decisions:
- issue: Sens de οἰκονομίαν θεοῦ
  choice: l’intendance de Dieu
  alternative: l’administration de Dieu; le dessein de Dieu; l’intendance venant de Dieu
  rationale: La formule peut désigner l’ordre ou l’administration établis par Dieu, son dessein, ou une responsabilité confiée par lui. Le texte principal conserve le noyau concret du terme sans imposer un système doctrinal particulier, tandis que la note expose les principales possibilités.
- issue: Valeur de πίστει dans τὴν ἐν πίστει
  choice: dans la foi
  alternative: dans la confiance; dans la fidélité; par la foi
  rationale: « Foi » maintient le sens paulinien courant et la formulation avec « dans » respecte l’ambiguïté entre sphère et moyen. La note conserve les autres nuances lexicales possibles.
translation_notes:
  register: Français international moderne, clair et digne. La phrase reste syntaxiquement ouverte par le tiret, conformément au texte source et à son lien avec le contexte. « Intendance » est moins courant que « administration », mais il conserve mieux l’image lexicale tout en étant expliqué par une note.
