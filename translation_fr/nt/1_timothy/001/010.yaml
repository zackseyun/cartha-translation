source:
  edition: SBLGNT
  text: πόρνοις, ἀρσενοκοίταις, ἀνδραποδισταῖς, ψεύσταις, ἐπιόρκοις, καὶ εἴ τι ἕτερον τῇ ὑγιαινούσῃ διδασκαλίᾳ ἀντίκειται,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/010.yaml
  text: the sexually immoral, men who have sex with men,[a] servant traders, liars, perjurers, and whatever else is opposed to sound teaching,
translation:
  language: fr
  text: ceux qui vivent dans l’immoralité sexuelle, les hommes qui ont des relations sexuelles avec des hommes,[a] les trafiquants d’esclaves, les menteurs, ceux qui font de faux serments, et tout ce qui s’oppose à l’enseignement sain,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les hommes qui pratiquent des actes homosexuels ». Le terme grec ἀρσενοκοῖται est rare et sa portée exacte est discutée, mais il désigne des relations sexuelles entre hommes.'
    reason: alternative_reading
lexical_decisions:
- source_word: πόρνοις
  choice: ceux qui vivent dans l’immoralité sexuelle
  rationale: Le terme désigne largement les personnes qui se livrent à l’immoralité sexuelle. Cette formulation moderne évite de le limiter aux seules relations avant le mariage.
- source_word: ἀρσενοκοίταις
  choice: les hommes qui ont des relations sexuelles avec des hommes
  rationale: Le terme rare associe les notions de « mâle » et de « lit » au sens sexuel, probablement en écho au Lévitique grec. La formulation décrit un comportement sexuel entre hommes sans importer une catégorie moderne d’identité ou d’orientation.
- source_word: ἀνδραποδισταῖς
  choice: les trafiquants d’esclaves
  rationale: Le mot vise ceux qui réduisent des personnes en esclavage, les enlèvent à cette fin ou en font commerce; « trafiquants d’esclaves » exprime clairement cette réalité.
- source_word: ψεύσταις
  choice: les menteurs
  rationale: Équivalent français direct, naturel et précis du nom grec pluriel.
- source_word: ἐπιόρκοις
  choice: ceux qui font de faux serments
  rationale: Le terme désigne ceux qui jurent faussement ou violent un serment. Cette expression est plus immédiatement compréhensible en français courant que « parjures ».
- source_word: καὶ εἴ τι ἕτερον
  choice: et tout ce qui… encore
  rationale: La tournure grecque ouvre la liste à toute autre conduite comparable; cette formulation en restitue naturellement la portée non exhaustive.
- source_word: τῇ ὑγιαινούσῃ διδασκαλίᾳ
  choice: à l’enseignement sain
  rationale: Le participe grec emploie la métaphore de la santé. « Enseignement sain » la conserve tout en restant accessible et moins technique que « saine doctrine ».
- source_word: ἀντίκειται
  choice: s’oppose
  rationale: Le verbe exprime l’opposition ou la contrariété; « s’oppose à » est idiomatique et précis.
theological_decisions:
- issue: Rendu de ἀρσενοκοίταις dans un contexte lexicalement et doctrinalement contesté
  choice: les hommes qui ont des relations sexuelles avec des hommes
  alternative: les hommes qui pratiquent des actes homosexuels
  rationale: Le choix principal conserve les composantes masculine et sexuelle du terme tout en restant centré sur les actes plutôt que sur une identité moderne. La portée exacte de ce mot grec rare demeure discutée; la note signale donc une autre traduction possible sans prétendre lever toute ambiguïté.
translation_notes:
  register: Français international moderne, naturel et digne. Le verset étant un fragment de liste, la ponctuation finale conserve la virgule du contexte fourni. Les termes techniques ou ecclésiastiques ont été évités lorsqu’une formulation courante pouvait rendre le grec avec précision.
