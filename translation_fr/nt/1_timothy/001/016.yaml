reference: 1 Timothy 1:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀλλὰ διὰ τοῦτο ἠλεήθην, ἵνα ἐν ἐμοὶ πρώτῳ ἐνδείξηται ⸂Χριστὸς Ἰησοῦς⸃ τὴν ⸀ἅπασαν μακροθυμίαν, πρὸς ὑποτύπωσιν τῶν μελλόντων πιστεύειν ἐπ’ αὐτῷ εἰς ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/016.yaml
  text: But for this reason I received mercy[a], so that in me, as the foremost[d][c][b], Messiah Jesus might display all his patience as a pattern for those who were going to believe in him for eternal life.
translation:
  language: fr
  text: 'Mais c’est précisément pour cela que j’ai obtenu miséricorde : afin que Jésus le Messie manifeste en moi, le premier[a], toute sa patience, en faisant de moi un exemple pour ceux qui croiraient en lui pour la vie éternelle.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le principal ». Dans le contexte, Paul reprend vraisemblablement l’idée du verset 15, où il se dit le premier des pécheurs.
    reason: lexical_alternative
  - marker: c
    text: Ou « en vue de la vie éternelle ». L’expression grecque peut marquer le but ou l’aboutissement.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠλεήθην
  choice: j’ai reçu miséricorde
  rationale: Cette formulation naturelle conserve le passif implicite quant à l’auteur de la miséricorde, sans le préciser au-delà du texte.
- source_word: πρώτῳ
  choice: le premier
  rationale: « Le premier » reprend le langage du verset 15 tout en préservant l’ambiguïté entre rang, prééminence et gravité, sans introduire explicitement « le pire ».
- source_word: ἐνδείξηται
  choice: manifeste
  rationale: Le verbe exprime une démonstration rendue visible; « manifeste » convient au registre biblique moderne et à la proposition de but introduite par ἵνα.
- source_word: Χριστὸς Ἰησοῦς
  choice: Jésus le Messie
  rationale: En français naturel, l’ordre « Jésus le Messie » conserve clairement la valeur de titre de Χριστός, là où « Messie Jésus » serait peu idiomatique.
- source_word: ἅπασαν μακροθυμίαν
  choice: toute sa patience
  rationale: « Toute » rend l’intensité de ἅπασαν, tandis que « patience » exprime la retenue patiente de μακροθυμία dans une langue courante et digne.
- source_word: ὑποτύπωσιν
  choice: exemple
  rationale: Le terme désigne ici un cas servant de modèle ou de référence; « exemple » est clair et naturel sans suggérer nécessairement une copie exacte.
- source_word: τῶν μελλόντων πιστεύειν
  choice: ceux qui allaient croire
  rationale: Cette tournure garde la perspective future relative à l’expérience passée de Paul, plus explicitement que le simple conditionnel « ceux qui croiraient ».
- source_word: πιστεύειν ἐπ’ αὐτῷ
  choice: croire en lui
  rationale: Cette expression française correspond naturellement à πιστεύω avec ἐπί et désigne la foi placée en Jésus.
- source_word: εἰς ζωὴν αἰώνιον
  choice: en vue de la vie éternelle
  rationale: « En vue de » préserve la nuance de but ou d’aboutissement portée par εἰς sans préciser indûment le rapport exact entre la foi et la vie éternelle.
theological_decisions:
- issue: Valeur de Χριστός
  choice: Jésus le Messie
  alternative: Christ Jésus
  rationale: Le contexte permet de conserver le sens du titre messianique. L’ordre des mots est adapté à l’usage français sans transformer le titre en simple nom propre.
- issue: Agent de la miséricorde et manifestation de la patience
  choice: Ne pas nommer l’agent de « j’ai reçu miséricorde », tout en attribuant explicitement la manifestation de la patience à Jésus le Messie
  alternative: Expliciter que Dieu ou Jésus a fait miséricorde à Paul
  rationale: Le passif grec ne nomme pas l’agent de la miséricorde, alors que la proposition de but nomme Jésus le Messie comme celui qui manifeste la patience. La traduction maintient cette distinction.
- issue: Portée de πρώτῳ
  choice: le premier
  alternative: le pire des pécheurs / le principal
  rationale: Le grec peut renvoyer à la déclaration précédente de Paul tout en gardant une tension entre ordre et prééminence. « Le premier » évite de résoudre cette nuance de manière excessive.
translation_notes:
  register: Français international moderne, clair et digne. La ponctuation met en relief la relation de but sans alourdir la phrase. « J’ai reçu miséricorde » garde une légère solennité biblique, tandis que « manifeste », « exemple » et « ceux qui allaient croire » restent accessibles à un lectorat général.
