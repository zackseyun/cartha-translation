id: PHP.3.3
reference: Philippians 3:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἡμεῖς γάρ ἐσμεν ἡ περιτομή, οἱ πνεύματι θεοῦ λατρεύοντες καὶ καυχώμενοι ἐν Χριστῷ Ἰησοῦ καὶ οὐκ ἐν σαρκὶ πεποιθότες,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/003.yaml
  text: For we are the circumcision[a], who worship by the Spirit of God and boast in Messiah Jesus and put no confidence in the flesh[c][b],
translation:
  language: fr
  text: Car c’est nous qui sommes la circoncision, nous qui rendons un culte par l’Esprit de Dieu[a], qui tirons notre fierté de Jésus le Messie[b] et qui ne mettons pas notre confiance dans la chair[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Variante textuelle : « qui rendons un culte à Dieu en esprit ».'
    reason: textual_variant
  - marker: b
    text: « Messie » traduit ici le titre grec Christos.
    reason: lexical_alternative
  - marker: c
    text: Ici, la « chair » désigne les réalités corporelles ou les avantages humains sur lesquels on pourrait fonder sa confiance, comme la circoncision ou le statut religieux.
    reason: cultural_note
lexical_decisions:
- source_word: περιτομή
  choice: la circoncision
  rationale: Le terme concret est conservé, car l’argument de Paul repose sur l’affirmation paradoxale que la véritable « circoncision » désigne ici une communauté, et non seulement une marque corporelle.
- source_word: πνεύματι θεοῦ
  choice: par l’Esprit de Dieu
  rationale: Avec le texte du SBLGNT, l’expression désigne naturellement l’Esprit de Dieu comme celui par qui le culte est rendu; « par » exprime clairement cette fonction en français moderne.
- source_word: λατρεύοντες
  choice: rendons un culte
  rationale: Le verbe désigne un service religieux voué à Dieu. « Rendre un culte » garde cette dimension plus précisément que le simple verbe « adorer ».
- source_word: καυχώμενοι
  choice: plaçons notre fierté
  rationale: Cette formulation française naturelle conserve l’idée de tirer sa fierté ou son sujet de gloire du Messie, en opposition directe à la confiance placée dans la chair.
- source_word: Χριστῷ Ἰησοῦ
  choice: en Jésus le Messie
  rationale: « Messie » rend le titre Χριστός tout en employant l’ordre « Jésus le Messie », plus naturel en français actuel que « le Messie Jésus ».
- source_word: σαρκί
  choice: la chair
  rationale: Le terme conserve le chevauchement entre réalité corporelle et avantages humains. Le contexte immédiat l’applique notamment à la circoncision, à l’ascendance et au statut religieux.
- source_word: πεποιθότες
  choice: ne mettons pas notre confiance
  rationale: Cette expression rend la confiance établie ou l’assurance durable exprimée par le participe parfait et forme un contraste clair avec la fierté placée dans le Messie.
- source_word: γάρ
  choice: Car
  rationale: « Car » maintient le lien explicatif avec l’avertissement du verset précédent dans un registre français digne et courant.
theological_decisions:
- issue: Sens de σάρξ dans ce verset
  choice: « Chair » désigne principalement les réalités corporelles et les titres humains servant de motifs de confiance religieuse, notamment la circoncision et le statut.
  alternative: Une nature pécheresse comprise comme principe moral intérieur.
  rationale: La suite de Philippiens 3 énumère la circoncision, l’ascendance, l’observance de la Loi et d’autres titres humains. Le contexte favorise donc ce sens sans exclure la portée plus large du terme.
- issue: Valeur de πνεύματι θεοῦ
  choice: L’Esprit de Dieu est celui par qui le culte est rendu.
  alternative: L’esprit humain, ou le fait de rendre à Dieu un culte purement intérieur ou spirituel.
  rationale: La leçon θεοῦ du SBLGNT désigne naturellement l’Esprit divin et l’oppose aux marques seulement corporelles de l’identité religieuse.
- issue: Identité de « la circoncision »
  choice: Paul applique le terme à « nous », la communauté caractérisée par le culte rendu par l’Esprit, la fierté placée dans le Messie et l’absence de confiance dans la chair.
  alternative: Paraphraser explicitement par « les vrais circoncis » ou « le peuple véritablement circoncis de Dieu ».
  rationale: La traduction garde la formulation audacieuse et la tension théologique du grec sans ajouter une explication absente du texte.
translation_notes:
  register: Français international moderne, naturel et digne. La répétition de « nous qui » clarifie la structure participiale grecque. « Jésus le Messie » maintient la valeur titulaire de Χριστός tout en évitant la tournure peu idiomatique « le Messie Jésus ».
