revisions:
- from: Car beaucoup vivent en ennemis de la croix du Messie[a] — je vous ai souvent parlé d’eux, et maintenant encore, je vous le dis en pleurant.
  to: Car beaucoup se conduisent — je vous ai souvent parlé d’eux et, maintenant, je vous en parle même en pleurant — en ennemis de la croix du Messie[a].
  rationale: La révision conserve l’ambiguïté descriptive du grec quant à l’identité de ces personnes et son ordre rhétorique général, tout en corrigeant la nuance de καί et en clarifiant le référent du discours présent de Paul. Elle emploie une expression française plus naturelle pour la conduite figurée sans modifier le sens.
