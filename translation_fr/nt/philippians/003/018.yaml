id: PHP.3.18
reference: Philippians 3:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: πολλοὶ γὰρ περιπατοῦσιν οὓς πολλάκις ἔλεγον ὑμῖν, νῦν δὲ καὶ κλαίων λέγω, τοὺς ἐχθροὺς τοῦ σταυροῦ τοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/018.yaml
  text: For many walk[a], whom I often told you about, and now even weeping I say, are enemies of the cross of Messiah,
translation:
  language: fr
  text: Car beaucoup se conduisent — je vous ai souvent parlé d’eux et, maintenant, je vous en parle même en pleurant — en ennemis de la croix du Messie[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Christ ».'
    reason: Χριστός est un titre signifiant « Messie » ou « Oint » ; « Christ » est sa forme traditionnelle en français.
lexical_decisions:
- source_word: πολλοὶ
  choice: beaucoup
  rationale: L’adjectif employé comme substantif désigne simplement un grand nombre de personnes; « beaucoup » est naturel et n’ajoute aucune précision absente du grec.
- source_word: γὰρ
  choice: car
  rationale: La conjonction introduit le fondement de l’exhortation précédente; « car » en conserve clairement la valeur explicative.
- source_word: περιπατοῦσιν
  choice: vivent
  rationale: Le verbe « marcher » est ici une métaphore courante chez Paul pour la manière de vivre. En français moderne, « vivent » en communique naturellement le sens dans la construction « vivent en ennemis », sans suggérer un déplacement physique.
- source_word: πολλάκις ἔλεγον ὑμῖν
  choice: je vous ai souvent parlé d’eux
  rationale: L’imparfait grec accompagné de πολλάκις exprime une action répétée dans le passé. Cette formulation française restitue cette répétition et fournit naturellement le complément implicite de ἔλεγον.
- source_word: νῦν δὲ καὶ κλαίων λέγω
  choice: et maintenant encore, je vous le dis en pleurant
  rationale: Le participe présent κλαίων décrit Paul au moment où il parle. « En pleurant » en préserve l’action simultanée et la forte charge émotionnelle; « encore » rend la valeur additive de καί dans le contraste entre ses avertissements passés et sa déclaration présente.
- source_word: ἐχθροὺς
  choice: en ennemis
  rationale: Le terme désigne des personnes opposées à la croix. La tournure « vivre en ennemis de » exprime clairement la fonction prédicative de l’accusatif grec.
- source_word: σταυροῦ
  choice: croix
  rationale: « Croix » est l’équivalent direct et établi de σταυρός, avec ici sa portée historique et théologique.
- source_word: Χριστοῦ
  choice: Messie
  rationale: Χριστός garde ici sa valeur de titre dans le génitif « la croix du Messie »; « Messie » en rend le sens plutôt que de le traiter automatiquement comme un nom propre.
theological_decisions:
- issue: Traduction de Χριστοῦ dans l’expression τοῦ σταυροῦ τοῦ Χριστοῦ
  choice: du Messie
  alternative: du Christ
  rationale: Dans ce contexte, Χριστός peut naturellement être compris comme le titre du roi oint. « Messie » rend explicitement ce titre, tandis que la traduction traditionnelle « Christ » est signalée en note sans imposer une différence de référent.
- issue: Relation syntaxique entre περιπατοῦσιν et ἐχθροὺς
  choice: vivent en ennemis de la croix
  alternative: vivent; ce sont des ennemis de la croix
  rationale: L’accusatif ἐχθρούς caractérise les personnes désignées comme « beaucoup ». La formulation retenue préserve le lien entre leur manière de vivre et leur opposition à la croix, sans préciser davantage en quoi consiste cette opposition.
translation_notes:
  register: Français international moderne, digne et accessible. L’incise respecte l’ordre rhétorique du grec tout en évitant une relative lourde ou peu idiomatique. « Vivent » privilégie le sens métaphorique contextuel de περιπατοῦσιν; « en pleurant » conserve l’immédiateté du participe présent.
