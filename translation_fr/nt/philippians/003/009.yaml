id: PHP.3.9
reference: Philippians 3:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ εὑρεθῶ ἐν αὐτῷ, μὴ ἔχων ἐμὴν δικαιοσύνην τὴν ἐκ νόμου ἀλλὰ τὴν διὰ πίστεως Χριστοῦ, τὴν ἐκ θεοῦ δικαιοσύνην ἐπὶ τῇ πίστει,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/009.yaml
  text: and be found in him[a], not having my own righteousness from the law[b], but that which is through faith in Messiah—the righteousness from God based on faith.
translation:
  language: fr
  text: 'et être trouvé en lui, n’ayant pas ma propre justice, celle qui vient de la Loi, mais celle qui vient par la foi dans le Messie[a] : la justice qui vient de Dieu, fondée sur la foi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « par la fidélité du Messie ».'
    reason: alternative_reading
lexical_decisions:
- source_word: εὑρεθῶ ἐν αὐτῷ
  choice: être trouvé en lui
  rationale: Cette formulation conserve le passif de εὑρεθῶ et l’expression paulinienne ἐν αὐτῷ sans réduire celle-ci à une explication telle que « uni à lui ».
- source_word: μὴ ἔχων ἐμὴν δικαιοσύνην
  choice: n’ayant pas ma propre justice
  rationale: Le participe grec est rendu directement, et « justice » exprime ici δικαιοσύνη dans le registre paulinien usuel tout en gardant sa portée sémantique en français.
- source_word: τὴν ἐκ νόμου
  choice: celle qui vient de la Loi
  rationale: La tournure indique l’origine de cette justice. La majuscule à « Loi » rend claire la référence à la Loi dans l’argument de Paul.
- source_word: διὰ πίστεως Χριστοῦ
  choice: par la foi dans le Messie
  rationale: Le texte principal retient la lecture objective du génitif, courante et naturelle en français, tandis que l’autre analyse grammaticale authentiquement possible est signalée en note.
- source_word: Χριστοῦ
  choice: le Messie
  rationale: « Messie » conserve la valeur de titre de Χριστός dans ce contraste théologique.
- source_word: τὴν ἐκ θεοῦ δικαιοσύνην
  choice: la justice qui vient de Dieu
  rationale: Cette formulation française naturelle garde l’idée de provenance exprimée par ἐκ θεοῦ et la reprise explicative de δικαιοσύνην.
- source_word: ἐπὶ τῇ πίστει
  choice: fondée sur la foi
  rationale: La traduction exprime de manière concise la base ou le fondement indiqué par ἐπί avec le datif.
theological_decisions:
- issue: Sens de πίστεως Χριστοῦ
  choice: « la foi dans le Messie » dans le texte principal
  alternative: « la fidélité du Messie »
  rationale: Le génitif peut être compris objectivement ou subjectivement. La lecture objective figure dans le texte, mais la lecture subjective est conservée en note afin de ne pas effacer une ambiguïté réelle.
- issue: Portée de δικαιοσύνη
  choice: « justice »
  alternative: « rectitude » ou, selon l’interprétation du contexte, « statut de juste »
  rationale: Le français « justice » correspond directement à δικαιοσύνη et peut porter à la fois ses dimensions relationnelle, judiciaire et éthique sans imposer une seule construction doctrinale.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe reste proche du mouvement de la phrase grecque, mais les reprises par « celle qui vient » rendent l’opposition claire et naturelle. « Loi » prend une majuscule pour signaler la référence à la Loi dans le raisonnement paulinien.
