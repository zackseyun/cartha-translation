id: PHP.3.1
reference: Philippians 3:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Τὸ λοιπόν, ἀδελφοί μου, χαίρετε ἐν κυρίῳ. τὰ αὐτὰ γράφειν ὑμῖν ἐμοὶ μὲν οὐκ ὀκνηρόν, ὑμῖν δὲ ἀσφαλές.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/001.yaml
  text: Finally[a], my brothers, rejoice in the Lord. To write the same things to you is not troublesome for me[d][c][b], and is safe for you.
translation:
  language: fr
  text: Pour le reste[a], mes frères[b], réjouissez-vous dans le Seigneur. Vous écrire les mêmes choses ne m’est pas pénible[c], et c’est pour votre sécurité[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Enfin » ou « Désormais ».
    reason: lexical_alternative
  - marker: b
    text: Ici, « frères » s’adresse à toute l’assemblée, c’est-à-dire aux frères et aux sœurs.
    reason: cultural_note
  - marker: c
    text: Ou « ne me cause aucun ennui » ou « ne me rebute pas ».
    reason: lexical_alternative
  - marker: d
    text: Ou « cela vous met à l’abri » ou « c’est une protection pour vous ».
    reason: lexical_alternative
lexical_decisions:
- source_word: Τὸ λοιπόν
  choice: Pour le reste
  rationale: Cette expression sert ici de transition dans le discours. « Pour le reste » conserve mieux son ouverture sémantique que « Enfin », qui pourrait suggérer à tort une conclusion imminente, tout en restant naturel en français.
- source_word: ἀδελφοί μου
  choice: mes frères
  rationale: Le masculin pluriel grec est rendu directement. Dans cette adresse collective, il désigne l’ensemble de la communauté, femmes comprises, ce qui est précisé en note.
- source_word: χαίρετε
  choice: réjouissez-vous
  rationale: L’impératif pluriel garde la force exhortative du grec et le vocabulaire paulinien de la joie.
- source_word: ἐν κυρίῳ
  choice: dans le Seigneur
  rationale: Traduction directe qui préserve l’ancrage théologique de la joie dans la relation au Seigneur, sans préciser davantage la nature de cette relation.
- source_word: τὰ αὐτὰ
  choice: les mêmes choses
  rationale: La formulation maintient l’indétermination du référent grec, qui peut viser des exhortations répétées ou, plus largement, un enseignement déjà donné.
- source_word: γράφειν
  choice: écrire
  rationale: L’infinitif français s’intègre naturellement à la construction « Vous écrire… ne m’est pas… ».
- source_word: οὐκ ὀκνηρόν
  choice: ne m’est pas pénible
  rationale: Cette tournure exprime que le fait de se répéter ne rebute ni ne pèse à Paul, sans réduire le sens à l’ennui.
- source_word: ἀσφαλές
  choice: une sécurité pour vous
  rationale: Le nom prédicatif français rend naturellement l’idée de sûreté ou de protection portée par l’adjectif grec; la formulation « vous met à l’abri » reste une possibilité plus dynamique.
theological_decisions:
- issue: Portée de l’adresse genrée à la communauté
  choice: mes frères
  alternative: mes frères et sœurs
  rationale: Le texte principal conserve la forme masculine du grec, tandis qu’une note indique clairement que l’adresse vise toute l’assemblée et évite ainsi d’en exclure implicitement les femmes.
- issue: Sens protecteur de la répétition de Paul
  choice: une sécurité pour vous
  alternative: cela vous met à l’abri
  rationale: La traduction garde l’idée de sûreté sans préciser contre quel danger ni transformer explicitement l’adjectif en métaphore, préservant ainsi la sobriété et l’ouverture du grec.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve les deux propositions brèves et le contraste implicite μέν…δέ (« pour moi… pour vous… »), sans l’alourdir. « Pour le reste » évite le faux effet de clôture que pourrait produire « Enfin » à ce stade de la lettre.
