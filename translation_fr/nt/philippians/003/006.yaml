  source_fidelity: Le parallélisme de κατά est bien rendu par « quant à ». « Persécuteur de l’Église » transmet correctement le participe διώκων dans cette énumération elliptique. « Devenu irréprochable » conserve la valeur de γενόμενος et situe l’irréprochabilité dans la catégorie de la δικαιοσύνη liée à la Loi, non dans une perfection morale absolue. Toutefois, « la justice qui se trouve dans la loi » suggère trop littéralement une justice localisée dans le texte de la loi, alors que ἐν νόμῳ désigne le cadre ou la norme légale de cette justice.
  naturalness: La phrase est globalement concise et naturelle. « La justice selon la Loi » est plus idiomatique en français moderne que « la justice qui se trouve dans la loi », tout en gardant le sens contextuel.
  terminology: « Zèle », « Église », « justice » et « irréprochable » conviennent au registre biblique français moderne. La majuscule à « Loi » signale naturellement la Loi juive dans ce contexte paulinien, sans ajouter de conclusion doctrinale.
