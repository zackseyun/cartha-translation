source:
  edition: SBLGNT
  text: κατὰ ⸀ζῆλος διώκων τὴν ἐκκλησίαν, κατὰ δικαιοσύνην τὴν ἐν νόμῳ γενόμενος ἄμεμπτος.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/006.yaml
  text: as to zeal[a], persecuting the church; as to righteousness under the law[b], having become blameless.
translation:
  language: fr
  text: quant au zèle, persécuteur de l’Église ; quant à la justice selon la Loi, devenu irréprochable.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατὰ
  choice: quant à
  rationale: Introduit les catégories selon lesquelles Paul évalue son ancien statut et conserve la structure rhétorique répétée.
- source_word: ζῆλος
  choice: zèle
  rationale: Terme français courant qui rend l’ardeur intense de l’engagement religieux de Paul.
- source_word: διώκων
  choice: persécuteur
  rationale: Le participe décrit ici l’action hostile de Paul contre la communauté chrétienne. La tournure nominale s’intègre naturellement à cette liste elliptique.
- source_word: τὴν ἐκκλησίαν
  choice: de l’Église
  rationale: Dans ce contexte paulinien, il s’agit de la communauté chrétienne ; « l’Église » est clair et consacré par l’usage.
- source_word: δικαιοσύνην
  choice: justice
  rationale: « Justice » est le terme français naturel pour δικαιοσύνη dans cette affirmation de conformité évaluée selon la loi, tout en gardant sa portée morale et juridique.
- source_word: τὴν ἐν νόμῳ
  choice: qui se trouve dans la loi
  rationale: Rend explicitement la construction grecque « dans la loi » sans la transformer en « sous la loi », expression qui pourrait introduire une nuance théologique différente.
- source_word: γενόμενος
  choice: devenu
  rationale: Préserve la valeur verbale du participe aoriste plutôt que de réduire l’expression à un simple adjectif.
- source_word: ἄμεμπτος
  choice: irréprochable
  rationale: Exprime l’absence de motif de blâme dans le cadre précis de la justice définie par la loi, sans suggérer une perfection absolue.
theological_decisions:
- issue: Portée de l’affirmation d’irréprochabilité de Paul
  choice: L’irréprochabilité est qualifiée par la justice qui se trouve dans la loi.
  alternative: Paul affirme une absence absolue de péché, ou parle seulement avec ironie.
  rationale: La syntaxe lie « irréprochable » à la catégorie de la justice dans la loi. L’affirmation concerne donc le cadre d’évaluation indiqué, sans trancher ici la question plus large de la perfection morale devant Dieu.
translation_notes:
  register: Français moderne, digne et concis. Le parallélisme « quant à… quant à… » reproduit l’organisation rhétorique du grec. « Persécuteur de l’Église » rend naturellement le participe dans une liste autobiographique elliptique.
