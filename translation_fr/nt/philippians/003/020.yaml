id: PHP.3.20
reference: Philippians 3:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἡμῶν γὰρ τὸ πολίτευμα ἐν οὐρανοῖς ὑπάρχει, ἐξ οὗ καὶ σωτῆρα ἀπεκδεχόμεθα κύριον Ἰησοῦν Χριστόν,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/020.yaml
  text: For our citizenship is in heaven[a], from where we also eagerly await a Savior[d][c][b], the Lord Jesus the Messiah.
translation:
  language: fr
  text: Car notre citoyenneté[a] est au ciel[b], d’où nous attendons aussi ardemment un Sauveur, le Seigneur Jésus, le Messie[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « notre communauté civique » ; le terme grec peut désigner l’appartenance civique ou la communauté politique à laquelle on appartient.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « dans les cieux ».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « le Christ ».'
    reason: alternative_reading
lexical_decisions:
- source_word: πολίτευμα
  choice: citoyenneté
  rationale: Le nom exprime ici l’appartenance civique qui contraste avec l’orientation terrestre évoquée dans le contexte. « Citoyenneté » conserve cette dimension civique dans un français moderne et clair.
- source_word: ἐν οὐρανοῖς
  choice: au ciel
  rationale: Le grec emploie le pluriel « dans les cieux », mais le français courant désigne naturellement ce domaine par le singulier « au ciel ». Le pluriel littéral est signalé en note.
- source_word: ὑπάρχει
  choice: est
  rationale: Le verbe affirme une réalité présente. « Est » en donne ici l’équivalent français le plus naturel sans affaiblir cette affirmation.
- source_word: ἐξ οὗ
  choice: d’où
  rationale: Le relatif renvoie spatialement au ciel comme lieu d’où viendra le Sauveur. « D’où » restitue ce lien avec concision.
- source_word: ἀπεκδεχόμεθα
  choice: attendons ardemment
  rationale: Le verbe exprime une attente soutenue et pleine d’expectative. « Attendons ardemment » en conserve l’intensité sans l’ambiguïté négative que peut avoir « avec impatience ».
- source_word: σωτῆρα
  choice: un Sauveur
  rationale: « Sauveur » est l’équivalent christologique usuel et conserve à la fois le sens de délivrance et le poids du titre dans ce contexte.
- source_word: κύριον
  choice: Seigneur
  rationale: « Seigneur » est l’équivalent naturel et traditionnel dans cet emploi christologique du Nouveau Testament.
- source_word: Χριστόν
  choice: le Messie
  rationale: Après le nom Jésus, le terme garde ici sa valeur de titre, particulièrement dans l’annonce de celui qui est attendu comme Sauveur. « Le Messie » en communique le sens plutôt que de le traiter comme un simple nom propre.
theological_decisions:
- issue: Traduction de Χριστόν dans la suite κύριον Ἰησοῦν Χριστόν
  choice: « le Messie » dans le texte principal
  alternative: « le Christ »
  rationale: Dans ce contexte eschatologique, Χριστός conserve une force titulaire. « Le Messie » rend explicitement cette fonction, tandis que « le Christ » demeure une traduction française traditionnelle valable et est indiquée en note.
- issue: Rapport entre « un Sauveur » et « le Seigneur Jésus, le Messie »
  choice: Conserver l’apposition
  alternative: Reformuler par « comme Sauveur »
  rationale: La construction grecque présente « le Seigneur Jésus Christ » en apposition à « un Sauveur ». La ponctuation française maintient cette identification directe sans ajouter de relation absente du texte.
translation_notes:
  register: Français international moderne, digne et accessible. « Au ciel » privilégie l’idiome français, avec le pluriel grec conservé en note. « Ardemment » exprime l’attente intense sans suggérer l’irritation parfois associée à « avec impatience ».
