id: PHP.3.12
reference: Philippians 3:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Οὐχ ὅτι ἤδη ἔλαβον ἢ ἤδη τετελείωμαι, διώκω δὲ εἰ καὶ καταλάβω, ἐφ’ ᾧ καὶ κατελήμφθην ὑπὸ ⸀Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/012.yaml
  text: Not that I have already received it or have already been perfected[c][b][a], but I press on to see if I may also take hold of that for which I too was taken hold of by Christ.
translation:
  language: fr
  text: Ce n’est pas que j’aie déjà obtenu cela[a] ou que j’aie déjà été rendu parfait[b] ; mais je poursuis ma course afin de voir si je parviendrai à saisir ce pour quoi, moi aussi, j’ai été saisi par Christ[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « reçu cela » ; le grec laisse l’objet sous-entendu, à déterminer d’après le contexte.
    reason: lexical_alternative
  - marker: b
    text: Ou « déjà devenu parfait » ou « déjà parvenu à l’accomplissement ».
    reason: lexical_alternative
  - marker: c
    text: 'Grec Christos ; autre traduction possible : « le Messie ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλαβον
  choice: j’aie déjà obtenu cela
  rationale: Le verbe renvoie à un objet laissé implicite dans le grec et déterminé par le contexte. « Cela » le signale sans préciser davantage ce que Paul a en vue.
- source_word: τετελείωμαι
  choice: j’aie déjà été rendu parfait
  rationale: Cette formulation conserve le parfait passif et l’idée d’un état d’achèvement, sans y importer une définition doctrinale ultérieure de la perfection.
- source_word: διώκω
  choice: je poursuis ma course
  rationale: Cette expression française naturelle évoque un effort soutenu vers un but et convient à l’image développée dans le contexte immédiat.
- source_word: εἰ καὶ καταλάβω
  choice: pour tâcher de saisir
  rationale: « Tâcher de » rend ici la visée exprimée par εἰ καί, tandis que « saisir » garde la force concrète de καταλαμβάνω.
- source_word: ἐφ’ ᾧ
  choice: ce pour quoi
  rationale: La formule préserve l’interprétation finale ou téléologique la plus probable tout en évitant de définir explicitement l’objectif, que le texte laisse au contexte.
- source_word: κατελήμφθην
  choice: j’ai moi-même été saisi
  rationale: La répétition de « saisir/saisi » reproduit le jeu verbal entre καταλάβω et κατελήμφθην et maintient clairement la voix passive.
- source_word: Χριστοῦ
  choice: Christ
  rationale: Dans cet emploi paulinien, Χριστός fonctionne naturellement comme une désignation devenue quasi nominale ; « Christ » est l’équivalent français courant, avec « Messie » signalé en note.
theological_decisions:
- issue: La portée de τετελείωμαι et une éventuelle doctrine de perfection sans péché
  choice: j’aie déjà été rendu parfait
  alternative: j’aie déjà atteint la perfection ; je sois déjà parvenu à l’accomplissement
  rationale: Paul nie être déjà arrivé à un état accompli, sans définir cet état selon les catégories d’un système doctrinal postérieur. Le passif et la tension théologique du texte sont donc maintenus.
- issue: Le rapport exprimé par ἐφ’ ᾧ
  choice: ce pour quoi
  alternative: parce que ; en vue de quoi
  rationale: Le sens de but s’accorde au mouvement du passage, mais la formulation française demeure assez ouverte pour ne pas préciser au-delà du grec la finalité de l’appel du Christ.
translation_notes:
  register: Français international moderne, naturel et digne. « Poursuis ma course » rend l’élan continu de διώκω dans le contexte de la course, tandis que la reprise « saisir/saisi » conserve le jeu de mots grec. Les marqueurs de notes suivent immédiatement les termes concernés.
