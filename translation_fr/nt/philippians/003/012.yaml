revisions:
- from: Ce n’est pas que j’aie déjà obtenu cela[a] ou que j’aie déjà été rendu parfait[b] ; mais je poursuis ma course pour tâcher de saisir ce pour quoi j’ai moi-même été saisi par Christ[c].
  to: Ce n’est pas que j’aie déjà obtenu cela[a] ou que j’aie déjà été rendu parfait[b] ; mais je poursuis ma course afin de voir si je parviendrai à saisir ce pour quoi, moi aussi, j’ai été saisi par Christ[c].
  rationale: La révision conserve les choix solides du projet, mais rend εἰ καὶ καταλάβω par une formulation française qui maintient la visée conditionnelle (« afin de voir si je parviendrai »). Elle remplace aussi l’intensif « moi-même » par l’additif « moi aussi », sans modifier le sens du passage. La note b est ajustée pour proposer des alternatives françaises plus naturelles, tout en évitant d’imposer une lecture doctrinale.
