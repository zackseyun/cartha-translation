id: PHP.3.8
reference: Philippians 3:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀλλὰ ⸀μενοῦνγε καὶ ἡγοῦμαι πάντα ζημίαν εἶναι διὰ τὸ ὑπερέχον τῆς γνώσεως Χριστοῦ Ἰησοῦ τοῦ κυρίου μου δι’ ὃν τὰ πάντα ἐζημιώθην, καὶ ἡγοῦμαι ⸀σκύβαλα ἵνα Χριστὸν κερδήσω
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/008.yaml
  text: More than that[a], I consider all things to be loss because of the surpassing value of the knowledge of Messiah Jesus my Lord, for whose sake I have suffered the loss of all things and consider them rubbish[c][b], so that I may gain Messiah.
translation:
  language: fr
  text: Bien plus[a], je considère même tout comme une perte à cause de la valeur incomparable de la connaissance du Messie Jésus[b], mon Seigneur. Pour lui, j’ai subi la perte de tout et je considère tout cela comme des ordures[c], afin de gagner le Messie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Oui, vraiment, je considère même… »'
    reason: La suite de particules grecques est fortement intensive et admet plusieurs formulations en français.
  - marker: b
    text: « Le Messie Jésus » peut aussi être rendu par « Christ Jésus ».
    reason: Χριστός peut être traduit comme un titre (« Messie ») ou conservé sous sa forme traditionnelle (« Christ »).
  - marker: c
    text: Le terme grec est très fort et peut désigner des rebuts, des déchets, voire des excréments.
    reason: La note préserve l’étendue et la rudesse possibles de σκύβαλα.
lexical_decisions:
- source_word: ἀλλὰ μενοῦνγε καὶ
  choice: Bien plus
  rationale: Cette tournure française fait progresser l’argument avec la forte insistance exprimée par l’ensemble des particules grecques, sans les rendre de façon pesante.
- source_word: ἡγοῦμαι
  choice: je considère
  rationale: Le verbe exprime ici une appréciation réfléchie; « considérer » convient naturellement aux deux évaluations du verset.
- source_word: πάντα / τὰ πάντα
  choice: tout / tout cela
  rationale: « Tout » conserve la portée globale du grec; « tout cela » reprend naturellement en français l’ensemble des avantages évoqués.
- source_word: ζημίαν
  choice: une perte
  rationale: Ce terme maintient la métaphore comptable qui s’oppose au gain exprimé à la fin du verset.
- source_word: τὸ ὑπερέχον τῆς γνώσεως
  choice: la valeur incomparable de la connaissance
  rationale: La formulation respecte la construction nominale grecque et laisse à « connaissance » sa dimension à la fois relationnelle et cognitive.
- source_word: Χριστοῦ Ἰησοῦ
  choice: du Messie Jésus
  rationale: Χριστός est rendu comme un titre, tandis que l’ordre des mots du grec est conservé autant que le permet un français intelligible.
- source_word: τοῦ κυρίου μου
  choice: mon Seigneur
  rationale: Cette traduction garde le possessif et la portée christologique traditionnelle de κύριος.
- source_word: δι’ ὃν
  choice: Pour lui
  rationale: Cette expression française concise rend la motivation personnelle et l’orientation sacrificielle de la préposition grecque.
- source_word: ἐζημιώθην
  choice: j’ai subi la perte
  rationale: La tournure préserve la forme passive et l’idée d’une perte effectivement éprouvée, plutôt que celle d’un simple changement d’opinion.
- source_word: σκύβαλα
  choice: des ordures
  rationale: « Ordures » transmet le caractère fortement dépréciatif du mot sans choisir exclusivement entre les sens possibles de rebut et d’excréments.
- source_word: ἵνα Χριστὸν κερδήσω
  choice: afin de gagner le Messie
  rationale: « Afin de » marque clairement le but, et « gagner » poursuit l’image de la perte et du gain.
theological_decisions:
- issue: Valeur de Χριστός dans l’usage paulinien
  choice: Messie
  alternative: Christ
  rationale: Le terme peut encore être entendu comme un titre dans ce contexte. « Messie » en rend le sens, tandis que « Christ », forme traditionnelle devenue souvent quasi nominale, est signalé en note.
- issue: Nature de la « connaissance » de Jésus
  choice: connaissance du Messie Jésus
  alternative: fait de connaître le Messie Jésus
  rationale: La construction nominale française conserve l’ambiguïté féconde du grec entre connaissance relationnelle et connaissance considérée comme réalité ou contenu, sans la réduire à une seule nuance.
translation_notes:
  register: Français international moderne, clair et digne. La structure de perte et de gain est conservée, ainsi que la vigueur volontaire de « ordures ». La division en deux phrases allège la longue période grecque sans modifier son enchaînement logique.
