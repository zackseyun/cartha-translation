id: PHP.3.21
reference: Philippians 3:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὃς μετασχηματίσει τὸ σῶμα τῆς ταπεινώσεως ⸀ἡμῶν σύμμορφον τῷ σώματι τῆς δόξης αὐτοῦ κατὰ τὴν ἐνέργειαν τοῦ δύνασθαι αὐτὸν καὶ ὑποτάξαι ⸀αὑτῷ τὰ πάντα.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/021.yaml
  text: who will transform our lowly body to be like the body of his glory[c][b][a], by the power that enables him even to subject all things to himself.
translation:
  language: fr
  text: lui qui transformera notre corps humilié pour le rendre conforme à son corps glorieux[a], par la puissance à l’œuvre qui le rend capable même de soumettre toutes choses à lui-même[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « le corps de notre humiliation […] le corps de sa gloire ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « selon l’action par laquelle il peut même soumettre toutes choses à lui-même ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: μετασχηματίσει
  choice: transformera
  rationale: « Transformera » exprime un changement réel de forme ou de condition et conserve nettement la portée future du verbe.
- source_word: τὸ σῶμα τῆς ταπεινώσεως ἡμῶν
  choice: notre corps humilié
  rationale: Cette formulation française naturelle rend l’idée du « corps de notre humiliation » sans réduire le propos à une simple faiblesse physique.
- source_word: σύμμορφον
  choice: pour le rendre conforme à
  rationale: « Conforme à » préserve la forte correspondance de forme exprimée par l’adjectif grec, tandis que « pour le rendre » explicite naturellement le résultat de la transformation.
- source_word: τῷ σώματι τῆς δόξης αὐτοῦ
  choice: à son corps glorieux
  rationale: 'Le génitif sémitisant est rendu idiomatiquement par un adjectif : ce corps est caractérisé par la gloire.'
- source_word: κατὰ τὴν ἐνέργειαν
  choice: par la puissance à l’œuvre
  rationale: La formule communique à la fois l’efficacité active d’ἐνέργεια et sa force opérante, sans employer le peu naturel « selon l’opération ».
- source_word: τοῦ δύνασθαι αὐτὸν
  choice: qui le rend capable
  rationale: Cette proposition exprime clairement la capacité effective indiquée par la construction infinitive grecque.
- source_word: ὑποτάξαι αὑτῷ τὰ πάντα
  choice: de soumettre toutes choses à lui-même
  rationale: « Soumettre » conserve la force du verbe, « toutes choses » maintient la portée universelle, et « à lui-même » préserve le réfléchi.
theological_decisions:
- issue: Rapport entre l’abaissement corporel présent et la glorification future
  choice: Présenter une transformation future du corps présent des croyants en conformité avec le corps glorieux du Christ.
  alternative: Employer explicitement le vocabulaire de la résurrection ou préciser le mécanisme de cette transformation.
  rationale: Le grec affirme une transformation corporelle et une conformité au corps glorieux du Christ, mais n’en décrit pas ici le mécanisme. La traduction conserve cette portée sans ajouter de formulation doctrinale.
- issue: Nature de la puissance évoquée
  choice: Conserver l’idée d’une puissance effectivement à l’œuvre par laquelle le Christ peut tout soumettre à lui-même.
  alternative: Paraphraser comme une simple autorité juridique ou comme une puissance provenant explicitement d’un autre agent.
  rationale: ἐνέργεια souligne une force agissante et efficace, tandis que le texte attribue au Christ la capacité de soumettre toutes choses sans préciser ici davantage la source ou le mode de cette puissance.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation reste proche des images grecques tout en évitant les calques lourds ; « conforme à » conserve toutefois la précision du rapport entre les deux corps.
