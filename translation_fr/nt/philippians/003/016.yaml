  yaml_path: translation/nt/philippians/003/016.yaml
  text: Only[a], let us keep in step with what we have attained.
translation:
  language: fr
  text: Seulement, au point où nous sommes parvenus, suivons la même ligne.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « tenons-nous-en à la même règle » ; « marchons selon la même norme ». Le grec laisse implicite ce qui est qualifié de « même ».'
    reason: Le datif τῷ αὐτῷ est elliptique ; les rendus avec « règle » ou « norme » explicitent une référence que le texte grec ne nomme pas.
lexical_decisions:
- source_word: πλήν
  choice: Seulement
  rationale: Dans ce contexte, le terme introduit une restriction ou un recentrage de l’exhortation. « Seulement » conserve cette force concise sans en faire une simple opposition.
- source_word: εἰς ὃ ἐφθάσαμεν
  choice: au point où nous sommes parvenus
  rationale: L’expression désigne le degré ou l’étape déjà atteinte. « Au point où » rend naturellement εἰς ὃ, tandis que le passé composé exprime la portée présente du progrès accompli.
- source_word: τῷ αὐτῷ
  choice: dans la même direction
  rationale: Le datif indique ce qui règle ou oriente la marche, sans nom explicite dans le texte grec retenu. « Dans la même direction » rend cette idée sans introduire directement une « règle » absente du texte.
- source_word: στοιχεῖν
  choice: continuer à marcher
  rationale: Le verbe évoque le fait d’avancer en ligne, de marcher conformément à une direction ou à une norme. « Continuer à marcher » convient à l’exhortation et au progrès déjà atteint.
theological_decisions:
- issue: Faut-il expliciter une « règle » ou une « norme » avec τῷ αὐτῷ ?
  choice: Ne pas ajouter de nom explicite dans le texte principal, mais rendre l’idée par « marcher dans la même direction ».
  alternative: « suivons la même règle » ou « tenons-nous-en à la même norme »
  rationale: Le texte grec de la SBLGNT laisse implicite ce qui est qualifié de « même ». Une formulation sans nom ajouté respecte cette concision et évite de privilégier une expansion textuelle ou une interprétation traditionnelle.
translation_notes:
  register: Français moderne, clair et digne. La formulation conserve la métaphore de la marche et la concision exhortative, tout en évitant un calque peu naturel.
