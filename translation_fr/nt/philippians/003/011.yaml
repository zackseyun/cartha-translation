  text: εἴ πως καταντήσω εἰς τὴν ἐξανάστασιν ⸂τὴν ἐκ⸃ νεκρῶν.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/011.yaml
  text: if somehow I may attain to the resurrection from the dead[a].
translation:
  language: fr
  text: si, d’une manière ou d’une autre, je parviens à la résurrection d’entre les morts[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « la résurrection hors d’entre les morts ». Le grec emploie ici un terme inhabituel pour « résurrection ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴ πως
  choice: si, d’une manière ou d’une autre
  rationale: Cette tournure naturelle conserve la nuance éventuelle et l’incertitude quant à la manière d’atteindre le but, sans nécessairement exprimer un doute sur la promesse de Dieu.
- source_word: καταντήσω
  choice: je parviens
  rationale: Le subjonctif aoriste présente l’arrivée à un but; « parvenir à » exprime naturellement en français cette visée eschatologique.
- source_word: εἰς
  choice: à
  rationale: Avec « parvenir », la préposition française idiomatique « à » rend le mouvement vers le but.
- source_word: ἐξανάστασιν
  choice: la résurrection
  rationale: Le nom désigne la résurrection. Une création lexicale telle que « ex-résurrection » serait obscure; la forme grecque inhabituelle est signalée en note.
- source_word: τὴν ἐκ νεκρῶν
  choice: d’entre les morts
  rationale: Cette expression française naturelle conserve explicitement l’idée d’une résurrection hors du milieu des morts.
theological_decisions:
- issue: Faut-il rendre ἐξανάστασις d’une manière qui la distingue fortement du terme plus courant ἀνάστασις et suggère ainsi une résurrection particulière?
  choice: « la résurrection d’entre les morts » dans le texte principal
  alternative: « la résurrection hors d’entre les morts » ou, très littéralement, « l’ex-résurrection d’entre les morts »
  rationale: Le texte évoque clairement la résurrection d’entre les morts, mais la forme inhabituelle ἐξανάστασις ne suffit pas à imposer un néologisme ni une interprétation doctrinale particulière. La note préserve sa singularité lexicale sans la surinterpréter.
translation_notes:
  register: Français international moderne, naturel et digne. La tournure « d’une manière ou d’une autre » préserve la prudence de εἴ πως, tandis que « parvenir à » reste accessible sans perdre l’image d’un but atteint.
