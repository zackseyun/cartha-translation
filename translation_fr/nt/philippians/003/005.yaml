id: PHP.3.5
reference: Philippians 3:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: περιτομῇ ὀκταήμερος, ἐκ γένους Ἰσραήλ, φυλῆς Βενιαμίν, Ἑβραῖος ἐξ Ἑβραίων, κατὰ νόμον Φαρισαῖος,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/005.yaml
  text: circumcised on the eighth day, from the people of Israel, of the tribe of Benjamin, a Hebrew from Hebrews; according to the law, a Pharisee,
translation:
  language: fr
  text: circoncis le huitième jour, de la descendance d’Israël, de la tribu de Benjamin, Hébreu issu d’Hébreux[a] ; quant à la Loi, pharisien,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Hébreu né de parents hébreux », ce qui souligne l’ascendance et l’identité hébraïques de Paul.
    reason: lexical_alternative
lexical_decisions:
- source_word: περιτομῇ ὀκταήμερος
  choice: circoncis le huitième jour
  rationale: Cette formulation française naturelle restitue l’expression grecque condensée et conserve la référence au signe de l’alliance.
- source_word: ἐκ γένους Ἰσραήλ
  choice: de la descendance d’Israël
  rationale: Dans ce contexte, γένος désigne l’origine ou la lignée ethnique. « Descendance » exprime clairement l’ascendance israélite revendiquée par Paul.
- source_word: φυλῆς Βενιαμίν
  choice: de la tribu de Benjamin
  rationale: La formule rend directement l’appartenance tribale indiquée par le génitif grec.
- source_word: Ἑβραῖος ἐξ Ἑβραίων
  choice: Hébreu issu d’Hébreux
  rationale: « Issu de » restitue naturellement ἐξ en français et maintient la formulation emphatique concernant l’ascendance et l’identité hébraïques, sans en préciser excessivement la portée.
- source_word: κατὰ νόμον
  choice: quant à la Loi
  rationale: Ici, κατά introduit le domaine sous lequel Paul se définit. « Quant à » rend cette relation idiomatiquement, tandis que la majuscule signale la Loi mosaïque dans ce contexte.
- source_word: Φαρισαῖος
  choice: pharisien
  rationale: Il s’agit du terme français établi pour désigner un membre du courant juif des Pharisiens.
theological_decisions:
- issue: Portée de l’expression Ἑβραῖος ἐξ Ἑβραίων
  choice: Hébreu issu d’Hébreux
  alternative: Hébreu né de parents hébreux
  rationale: Le texte principal conserve la concision et l’ouverture de l’expression grecque, qui peut englober l’ascendance familiale et l’identité culturelle ou linguistique, sans la réduire explicitement à la seule filiation parentale.
translation_notes:
  register: Français international moderne, digne et concis. La structure en série nominale est maintenue pour respecter le mouvement rhétorique du passage ; « quant à la Loi » évite le calque moins naturel « selon la Loi » devant un nom d’appartenance.
