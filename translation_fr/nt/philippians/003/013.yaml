  text: ἀδελφοί, ἐγὼ ἐμαυτὸν ⸀οὐ λογίζομαι κατειληφέναι· ἓν δέ, τὰ μὲν ὀπίσω ἐπιλανθανόμενος τοῖς δὲ ἔμπροσθεν ἐπεκτεινόμενος,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/013.yaml
  text: 'Brothers[a], I do not consider myself to have taken hold of it. But one thing: forgetting the things behind and reaching forward to the things ahead,'
translation:
  language: fr
  text: 'Frères et sœurs[a], je ne considère pas moi-même avoir saisi. Mais une chose : oubliant ce qui est derrière et me tendant vers ce qui est devant,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec dit littéralement « Frères »; dans ce type d’adresse, ce terme désigne habituellement toute la communauté croyante, femmes comprises.
    reason: cultural_note
lexical_decisions:
- source_word: ἀδελφοί
  choice: Frères et sœurs
  rationale: Dans cette adresse à la communauté, le pluriel masculin grec peut inclure les femmes. La formulation française explicite naturellement l’ensemble des croyants, tandis que la note signale la forme littérale.
- source_word: ἐγὼ ἐμαυτόν
  choice: je ne considère pas avoir moi-même
  rationale: La reprise emphatique du pronom est rendue par « moi-même », dans une syntaxe française naturelle.
- source_word: λογίζομαι
  choice: je ne considère pas
  rationale: « Considérer » exprime ici une appréciation personnelle réfléchie, sans nuance comptable artificielle.
- source_word: κατειληφέναι
  choice: avoir déjà saisi le but
  rationale: « Saisir » conserve l’image de la prise présente au verset 12. Le complément n’est pas exprimé en grec; « le but » l’explicite sobrement d’après le contexte, et « déjà » rend l’aspect accompli dans ce contexte.
- source_word: ἓν δέ
  choice: Mais une seule chose compte
  rationale: Le grec présente une ellipse abrupte. L’ajout de « compte » produit une phrase française intelligible sans préciser une action particulière comme « je fais ».
- source_word: τὰ μὲν ὀπίσω
  choice: ce qui est derrière moi
  rationale: Cette expression naturelle conserve l’opposition spatiale entre l’arrière et l’avant; « moi » rend explicite le point de vue du coureur impliqué par les participes.
- source_word: ἐπιλανθανόμενος
  choice: oubliant
  rationale: Le participe présent traduit directement l’action continue, sans la réduire à un simple détachement volontaire.
- source_word: τοῖς δὲ ἔμπροσθεν
  choice: ce qui est devant
  rationale: La formulation maintient le parallélisme spatial avec « derrière moi » et reste ouverte quant aux réalités visées.
- source_word: ἐπεκτεινόμενος
  choice: tendant de tout mon être vers
  rationale: Le verbe composé évoque une extension intense vers l’avant. Cette tournure française restitue l’effort corporel de l’image sans employer un terme technique.
theological_decisions:
- issue: Objet implicite de κατειληφέναι
  choice: le but
  alternative: cela / l’avoir saisi
  rationale: Le grec ne nomme pas l’objet. Le contexte immédiat de la course et du but permet cette explicitation, mais elle ne doit pas être identifiée plus précisément à une doctrine particulière.
- issue: Portée de ἀδελφοί
  choice: Frères et sœurs
  alternative: Frères
  rationale: L’adresse vise vraisemblablement toute la communauté croyante. Le français explicite cette portée inclusive, tandis qu’une note préserve l’information sur la forme masculine grecque.
translation_notes:
  register: Français international moderne, digne et oralement fluide. La phrase conserve l’élan inachevé du verset grec, qui se poursuit au verset 14, ainsi que les participes de l’image de la course.
