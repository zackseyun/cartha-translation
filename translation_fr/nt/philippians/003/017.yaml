id: PHP.3.17
reference: Philippians 3:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Συμμιμηταί μου γίνεσθε, ἀδελφοί, καὶ σκοπεῖτε τοὺς οὕτω περιπατοῦντας καθὼς ἔχετε τύπον ἡμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/017.yaml
  text: Brothers[a], join in imitating me, and keep your eyes on those who walk this way[b], just as you have us as a pattern.
translation:
  language: fr
  text: Frères[a], devenez ensemble mes imitateurs et observez attentivement ceux qui se conduisent ainsi, comme vous nous avez pour modèle[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Frères et sœurs » ; la forme grecque est masculine plurielle, mais elle s’adresse vraisemblablement à toute l’assemblée.'
    reason: cultural_note
  - marker: b
    text: 'Ou : « exemple ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Συμμιμηταί μου γίνεσθε
  choice: imitez-moi tous ensemble
  rationale: Cette formulation naturelle réunit l’impératif γίνεσθε et le nom composé Συμμιμηταί, dont le préfixe συν- souligne que les destinataires doivent participer ensemble à cette imitation.
- source_word: ἀδελφοί
  choice: Frères
  rationale: Le vocatif grec est au masculin pluriel. Le texte principal en conserve la forme, tandis qu’une note indique qu’il s’adresse vraisemblablement à toute l’assemblée.
- source_word: σκοπεῖτε
  choice: portez attention à
  rationale: Le verbe appelle à observer attentivement et de façon suivie. Cette expression est claire en français moderne sans ajouter l’image des yeux, absente du grec.
- source_word: οὕτω περιπατοῦντας
  choice: ceux qui se conduisent ainsi
  rationale: περιπατέω désigne ici métaphoriquement la manière de vivre. « Se conduisent » restitue naturellement ce sens en français, tandis que « ainsi » conserve la référence contextuelle de οὕτω.
- source_word: τύπον
  choice: modèle
  rationale: Dans ce contexte, τύπος désigne un exemple normatif à reproduire. « Modèle » exprime bien cette fonction; « exemple » reste une possibilité signalée en note.
- source_word: ἡμᾶς
  choice: nous
  rationale: Le pluriel grec est maintenu et n’est pas réduit au seul Paul; il peut inclure ses collaborateurs avec lui.
theological_decisions:
- issue: Portée inclusive de ἀδελφοί
  choice: Conserver « Frères » dans le texte et préciser en note que l’ensemble de l’assemblée est probablement visé.
  alternative: Traduire directement « Frères et sœurs ».
  rationale: La forme grecque est grammaticalement masculine plurielle, mais, dans ce type d’adresse, elle peut englober tous les croyants de l’assemblée. La note conserve à la fois la forme source et sa portée contextuelle probable.
- issue: Singulier de l’imitation et pluriel du modèle
  choice: Conserver « imitez-moi » puis « nous […] pour modèle ».
  alternative: Harmoniser les deux expressions en employant partout soit le singulier, soit le pluriel.
  rationale: Le grec passe explicitement de μου, « moi », à ἡμᾶς, « nous ». Maintenir ce changement évite d’effacer la tension entre l’exemple personnel de Paul et le modèle collectif qu’il forme avec ses collaborateurs.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure « imitez-moi tous ensemble » préserve la dimension collective du grec sans recourir au calque peu naturel « devenez mes co-imitateurs ». « Se conduisent » rend clairement la métaphore grecque de la marche comme manière de vivre.
