  text: Βλέπετε τοὺς κύνας, βλέπετε τοὺς κακοὺς ἐργάτας, βλέπετε τὴν κατατομήν.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/002.yaml
  text: Watch out for the dogs[a]; watch out for the evil workers[c][b]; watch out for the mutilation.
translation:
  language: fr
  text: Prenez garde aux chiens ; prenez garde aux mauvais ouvriers ; prenez garde à la mutilation[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « la mutilation ». Paul emploie ce terme péjoratif en contraste saisissant avec « la circoncision » au verset suivant.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Βλέπετε
  choice: Prenez garde à
  rationale: L’impératif présent, répété trois fois, exprime une mise en garde pressante. « Prenez garde à » est naturel, digne et permet de conserver l’anaphore grecque.
- source_word: τοὺς κύνας
  choice: les chiens
  rationale: La métaphore injurieuse est conservée sans ajout explicatif qui en atténuerait ou en amplifierait la portée.
- source_word: τοὺς κακοὺς ἐργάτας
  choice: les mauvais ouvriers
  rationale: « Mauvais » garde ici une portée morale, tandis qu’« ouvriers » rend directement ἐργάτας et fait écho au vocabulaire courant de l’activité au service d’une cause.
- source_word: τὴν κατατομήν
  choice: ceux qui mutilent
  rationale: Le grec emploie littéralement le nom « mutilation », en jeu polémique avec « circoncision » au verset suivant. En français, « prenez garde à la mutilation » désignerait plus naturellement un acte qu’un groupe humain ; la formulation choisie conserve la cible personnelle et la violence du terme, avec une note signalant la forme littérale.
theological_decisions:
- issue: Rendre κατατομήν dans son opposition polémique à περιτομή au verset suivant
  choice: ceux qui mutilent
  alternative: la mutilation
  rationale: La traduction maintient le jugement sévère de Paul et vise clairement les personnes mises en garde, sans introduire l’expression interprétative « fausse circoncision ». La note préserve le nom abstrait grec et son jeu de mots avec « circoncision ».
translation_notes:
  register: Français international moderne, direct et solennel. La triple répétition de « prenez garde » reproduit l’insistance et le rythme de l’original. La ponctuation en trois membres conserve l’effet rhétorique.
