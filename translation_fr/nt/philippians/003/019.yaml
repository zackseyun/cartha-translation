id: PHP.3.19
reference: Philippians 3:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὧν τὸ τέλος ἀπώλεια, ὧν ὁ θεὸς ἡ κοιλία καὶ ἡ δόξα ἐν τῇ αἰσχύνῃ αὐτῶν, οἱ τὰ ἐπίγεια φρονοῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/019.yaml
  text: Their end is destruction[a], their god is the belly[b], and their glory is in their shame—their minds are set on earthly things.
translation:
  language: fr
  text: Leur fin, c’est la destruction ; leur dieu, c’est leur ventre[a] ; et leur gloire est dans leur honte, eux qui ont leurs pensées tournées vers les réalités terrestres.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leur dieu, c’est leur appétit ».
    reason: lexical_alternative
lexical_decisions:
- source_word: τέλος
  choice: fin
  rationale: « Fin » conserve la formulation brève du grec et peut désigner à la fois le terme et l’issue finale.
- source_word: ἀπώλεια
  choice: destruction
  rationale: « Destruction » exprime naturellement la gravité du terme grec et sa portée eschatologique, sans recourir au mot plus marqué et moins courant « perdition ».
- source_word: κοιλία
  choice: ventre
  rationale: « Ventre » préserve l’image corporelle concrète et frappante du grec, plutôt que de la réduire d’emblée à l’idée d’appétit.
- source_word: δόξα
  choice: gloire
  rationale: « Gloire » est l’équivalent direct et maintient l’ironie du contraste avec la honte.
- source_word: αἰσχύνη
  choice: honte
  rationale: « Honte » rend de façon concise le déshonneur et la réalité moralement honteuse évoqués par le grec.
- source_word: τὰ ἐπίγεια
  choice: les réalités terrestres
  rationale: Cette expression française naturelle rend le pluriel neutre grec sans limiter celui-ci aux seuls objets matériels.
- source_word: φρονοῦντες
  choice: ont leurs pensées tournées vers
  rationale: La formulation exprime une orientation mentale durable et reste naturelle en français, tout en évitant l’ajout restrictif de « ne… que ».
- source_word: ὧν … ὧν
  choice: leur … leur
  rationale: La reprise de « leur » renvoie naturellement en français aux personnes mentionnées au verset précédent et conserve la structure répétée de leur caractérisation.
theological_decisions:
- issue: Force métaphorique de « leur dieu, c’est leur ventre »
  choice: Conserver « ventre » dans le texte principal.
  alternative: « Leur dieu, c’est leur appétit » ou « leurs désirs »
  rationale: Le grec emploie une image corporelle vive susceptible d’englober l’asservissement aux appétits et aux désirs. La conserver évite de restreindre prématurément sa portée à une seule interprétation.
- issue: Rapport entre « gloire » et « honte »
  choice: Conserver littéralement le paradoxe « leur gloire est dans leur honte ».
  alternative: « Ils tirent fierté de ce qui devrait leur faire honte »
  rationale: La formulation directe préserve la tension rhétorique et théologique du grec sans expliciter ce qui demeure implicite.
translation_notes:
  register: Français international moderne, digne et accessible. Les reprises avec « c’est » donnent une syntaxe naturelle à la série nominale grecque. La dernière proposition conserve sa valeur descriptive et appositionnelle grâce à « eux qui », sans ajouter l’idée restrictive de « ne penser qu’à ».
