id: PHP.3.7
reference: Philippians 3:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἀλλὰ ἅτινα ἦν μοι κέρδη, ταῦτα ἥγημαι διὰ τὸν Χριστὸν ζημίαν.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/007.yaml
  text: But whatever things were gains to me[b][a], these I have considered loss because of Messiah.
translation:
  language: fr
  text: Mais toutes ces choses qui étaient pour moi des gains, je les ai considérées comme une perte à cause du Messie[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à cause du Christ ».
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀλλὰ
  choice: Mais
  rationale: Marque nettement le contraste avec les motifs de confiance énumérés auparavant, tout en restant naturel en français.
- source_word: ἅτινα
  choice: toutes ces choses qui
  rationale: Renvoie à l’ensemble des avantages précédemment énumérés et restitue la portée englobante du relatif indéfini.
- source_word: κέρδη
  choice: des gains
  rationale: Conserve la métaphore comptable qui s’oppose à « une perte ».
- source_word: ἥγημαι
  choice: je les ai considérées
  rationale: Le parfait exprime une réévaluation accomplie dont le résultat demeure; le passé composé français rend naturellement cette valeur dans le contexte.
- source_word: διὰ τὸν Χριστόν
  choice: à cause du Messie
  rationale: διά avec l’accusatif indique ici le motif ou la cause; « Messie » traduit le titre Χριστός.
- source_word: ζημίαν
  choice: une perte
  rationale: Le singulier rassemble les anciens gains en un bilan négatif global et maintient l’image comptable.
theological_decisions:
- issue: Traduction de Χριστόν
  choice: le Messie
  alternative: Christ
  rationale: Χριστός est rendu comme un titre porteur de sens. La variante signale l’expression française traditionnelle sans imposer une lecture doctrinale supplémentaire.
- issue: Valeur de διὰ avec l’accusatif
  choice: à cause du Messie
  alternative: pour le Messie / en raison du Messie
  rationale: La formulation retient la valeur causale la plus directe tout en évitant d’élargir silencieusement le texte vers une nuance finale telle que « pour l’amour de ».
translation_notes:
  register: Français international moderne, digne et accessible. La tournure conserve le contraste entre les gains pluriels et la perte singulière, ainsi que la valeur résultative du parfait grec.
