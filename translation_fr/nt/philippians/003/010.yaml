id: PHP.3.10
reference: Philippians 3:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τοῦ γνῶναι αὐτὸν καὶ τὴν δύναμιν τῆς ἀναστάσεως αὐτοῦ καὶ ⸀κοινωνίαν παθημάτων αὐτοῦ, ⸀συμμορφιζόμενος τῷ θανάτῳ αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/010.yaml
  text: to know him[a], and the power of his resurrection, and the fellowship of his sufferings, being conformed to his death[b],
translation:
  language: fr
  text: afin de le connaître, lui, ainsi que la puissance de sa résurrection et la participation à ses souffrances, en devenant conforme à sa mort[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en étant rendu conforme à sa mort ».
    reason: lexical_alternative
lexical_decisions:
- source_word: γνῶναι
  choice: connaître
  rationale: L’infinitif aoriste exprime ici le but de Paul. « Connaître » conserve la portée personnelle et vécue du verbe sans la paraphraser.
- source_word: δύναμιν
  choice: puissance
  rationale: « Puissance » est le correspondant français naturel et précis de δύναμις dans ce contexte.
- source_word: ἀναστάσεως
  choice: résurrection
  rationale: « Résurrection » désigne clairement et traditionnellement l’événement visé.
- source_word: κοινωνίαν
  choice: participation
  rationale: « Participation » garde la forme nominale du grec et exprime une part réelle prise aux souffrances du Christ, plutôt qu’une simple sympathie.
- source_word: παθημάτων
  choice: souffrances
  rationale: « Souffrances » rend directement πάθημα et convient au contexte christologique.
- source_word: συμμορφιζόμενος
  choice: en devenant conforme
  rationale: Le participe présent décrit un processus en cours. « En devenant conforme » en restitue naturellement la valeur progressive et évite de trancher inutilement entre action subie et transformation vécue.
- source_word: τῷ θανάτῳ αὐτοῦ
  choice: à sa mort
  rationale: Cette formulation rend simplement le datif régi par συμμορφιζόμενος et maintient l’accent sur la conformité à la mort du Christ.
theological_decisions:
- issue: Sens de κοινωνίαν παθημάτων αὐτοῦ
  choice: une participation réelle aux souffrances du Christ
  alternative: la communion de ses souffrances, comprise de manière plus abstraite
  rationale: κοινωνία désigne ici le fait d’avoir part aux souffrances du Christ. La traduction conserve cette force participative sans préciser selon quel système doctrinal cette participation doit être comprise.
- issue: Valeur de συμμορφιζόμενος
  choice: un processus par lequel Paul devient conforme à la mort du Christ
  alternative: un état où Paul est rendu conforme à sa mort
  rationale: Le participe présent favorise l’idée d’un processus en cours, mais sa forme moyenne ou passive permet une certaine ouverture quant à l’agent de cette transformation.
translation_notes:
  register: Français international moderne, digne et lisible. La reprise emphatique « le connaître, lui » rend l’objet antéposé αὐτόν sans lourdeur excessive. La série nominale du grec est largement conservée, tandis que « participation » évite le caractère potentiellement abstrait ou ecclésiastique de « communion ».
