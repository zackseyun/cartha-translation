  text: κατὰ σκοπὸν διώκω ⸀εἰς τὸ βραβεῖον τῆς ἄνω κλήσεως τοῦ θεοῦ ἐν Χριστῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/014.yaml
  text: I press on toward the goal for the prize of the upward call of God in Messiah Jesus[a][b].
translation:
  language: fr
  text: Je poursuis ma course vers le but, pour remporter le prix de l’appel d’en haut[a] que Dieu adresse en Jésus le Messie[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: On peut aussi traduire « l’appel vers le haut » ou « l’appel céleste ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « en Christ Jésus ». « Christ » est rendu ici par « le Messie », car il s’agit d’un titre.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ σκοπόν
  choice: vers le but
  rationale: Dans l’image de la course, l’expression indique la direction vers un objectif fixé. « Vers le but » est naturel en français et conserve cette image.
- source_word: διώκω
  choice: je poursuis ma course
  rationale: Le verbe exprime ici une progression résolue et soutenue. L’ajout idiomatique de « ma course » rend explicite en français l’image sportive portée par le contexte, sans modifier le sens.
- source_word: εἰς τὸ βραβεῖον
  choice: pour remporter le prix
  rationale: εἰς marque le but de l’effort. « Pour remporter le prix » exprime clairement cette finalité dans l’image de la compétition.
- source_word: τῆς ἄνω κλήσεως
  choice: de l’appel d’en haut
  rationale: « D’en haut » conserve la valeur spatiale de ἄνω ainsi que l’ambiguïté entre la provenance divine de l’appel et sa direction céleste.
- source_word: τοῦ θεοῦ
  choice: que Dieu adresse
  rationale: Le génitif peut désigner Dieu comme l’auteur de l’appel. La proposition relative est idiomatique en français et évite la lourdeur de « l’appel d’en haut de Dieu ».
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: en Jésus le Messie
  rationale: « En » préserve le langage paulinien d’union ou de sphère. La disposition « Jésus le Messie » est plus naturelle en français que « Messie Jésus » tout en rendant Χριστός comme un titre.
theological_decisions:
- issue: Sens de ἄνω κλήσεως
  choice: l’appel d’en haut
  alternative: l’appel vers le haut ; l’appel céleste
  rationale: « D’en haut » maintient la tension entre un appel provenant de Dieu et un appel orienté vers la réalité céleste, sans imposer une seule lecture.
- issue: Relation de τοῦ θεοῦ avec κλήσεως
  choice: Dieu est l’auteur de l’appel
  alternative: 'formulation nominale : « l’appel d’en haut de Dieu »'
  rationale: Le génitif se comprend naturellement comme un génitif subjectif ou de source. La formulation verbale française clarifie la syntaxe sans préciser davantage le contenu de l’appel.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La formulation conserve l’image de la course et l’ambiguïté de ἄνω, tout en évitant une chaîne de compléments peu naturelle en français.
