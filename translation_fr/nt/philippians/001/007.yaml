id: PHP.1.7
reference: Philippians 1:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καθώς ἐστιν δίκαιον ἐμοὶ τοῦτο φρονεῖν ὑπὲρ πάντων ὑμῶν, διὰ τὸ ἔχειν με ἐν τῇ καρδίᾳ ὑμᾶς, ἔν τε τοῖς δεσμοῖς μου καὶ ἐν τῇ ἀπολογίᾳ καὶ βεβαιώσει τοῦ εὐαγγελίου συγκοινωνούς μου τῆς χάριτος πάντας ὑμᾶς ὄντας·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/007.yaml
  text: For it is right for me to think this about all of you[a], because I have you in my heart, since both in my chains and in the defense and confirmation of the gospel[b], all of you are fellow partakers with me of grace.
translation:
  language: fr
  text: 'Il est juste que je pense ainsi de vous tous[a], puisque je vous porte dans mon cœur : vous êtes tous mes partenaires dans la grâce, aussi bien dans mes chaînes que dans la défense et l’affermissement de la bonne nouvelle.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « puisque vous me portez dans votre cœur ». La construction grecque permet les deux lectures.'
    reason: alternative_reading
lexical_decisions:
- source_word: δίκαιον
  choice: Il est juste
  rationale: Exprime ce qui est légitime et approprié dans l'attitude de Paul, en français naturel et digne.
- source_word: φρονεῖν
  choice: que je pense ainsi
  rationale: Conserve la dimension de pensée et de disposition intérieure sans réduire le verbe au seul sentiment.
- source_word: ὑπὲρ πάντων ὑμῶν
  choice: de vous tous
  rationale: Avec φρονεῖν, la préposition désigne ici les personnes auxquelles se rapporte la pensée de Paul.
- source_word: διὰ τὸ ἔχειν με ἐν τῇ καρδίᾳ ὑμᾶς
  choice: puisque je vous porte dans mon cœur
  rationale: Rend idiomatiquement la lecture selon laquelle Paul porte les Philippiens dans son cœur, tout en signalant en note l'autre analyse syntaxique possible.
- source_word: δεσμοῖς
  choice: mes chaînes
  rationale: Préserve l'image concrète de l'emprisonnement de Paul.
- source_word: ἀπολογίᾳ
  choice: je défends
  rationale: Le tour verbal est plus naturel en français et conserve l'idée de défense publique ou formelle de la bonne nouvelle.
- source_word: βεβαιώσει
  choice: confirme
  rationale: Exprime l'action d'affermir ou d'établir la validité de la bonne nouvelle.
- source_word: τοῦ εὐαγγελίου
  choice: la bonne nouvelle
  rationale: Rend le sens courant de εὐαγγέλιον dans une langue immédiatement compréhensible, sans perdre sa portée chrétienne contextuelle.
- source_word: συγκοινωνούς μου τῆς χάριτος
  choice: vous participez tous avec moi à la grâce
  rationale: Rend clairement la participation commune exprimée par συγκοινωνός et son complément au génitif, sans redondance en français.
- source_word: χάριτος
  choice: la grâce
  rationale: Conserve le terme théologique central et la possibilité qu'il englobe ici le don de Dieu, la mission et les souffrances qui l'accompagnent.
theological_decisions:
- issue: Ambiguïté syntaxique de la proposition concernant le cœur
  choice: je vous porte dans mon cœur
  alternative: vous me portez dans votre cœur
  rationale: Les deux pronoms sont à l'accusatif autour de l'infinitif grec, ce qui permet grammaticalement les deux analyses. La lecture retenue s'accorde bien avec l'affection exprimée par Paul, mais l'autre possibilité authentique est préservée en note.
- issue: Portée de la grâce partagée
  choice: vous participez tous avec moi à la grâce
  alternative: vous êtes tous mes partenaires dans la grâce
  rationale: La formulation retenue préserve la participation commune sans préciser au-delà du grec si la grâce désigne surtout le salut, la mission apostolique, les souffrances ou l'ensemble de ces réalités.
translation_notes:
  register: Français international moderne, naturel et digne. « Porter dans son cœur » restitue l'image affective sans lourdeur. La seconde phrase est restructurée verbalement pour éviter l'enchaînement nominal abstrait « défense et confirmation », tout en conservant les deux actions et leur lien avec l'emprisonnement.
