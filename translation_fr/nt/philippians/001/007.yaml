    text: 'Ou : « puisque vous me portez dans votre cœur ». La construction grecque permet les deux lectures.'
    reason: alternative_reading
  revision_rationale: La révision rétablit la structure parallèle des deux compléments introduits par « dans » et évite la nuance temporelle ajoutée par « lorsque ». Elle rend συγκοινωνούς μου τῆς χάριτος par une expression française directe et fidèle, sans préciser indûment la nature de la grâce partagée. La note conserve l’ambiguïté syntaxique réelle du grec.
