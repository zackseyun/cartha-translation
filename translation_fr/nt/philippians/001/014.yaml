id: PHP.1.14
reference: Philippians 1:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ τοὺς πλείονας τῶν ἀδελφῶν ἐν κυρίῳ πεποιθότας τοῖς δεσμοῖς μου περισσοτέρως τολμᾶν ἀφόβως τὸν ⸀λόγον λαλεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/014.yaml
  text: And most of the brothers[a], having become confident in the Lord because of my chains, dare all the more to speak the word fearlessly.
translation:
  language: fr
  text: Et la plupart des frères[a], ayant gagné en assurance dans le Seigneur à cause de mes chaînes, osent d’autant plus annoncer la parole sans crainte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « frères et sœurs » : ici, le terme désigne vraisemblablement les autres croyants dans leur ensemble.'
    reason: Alternative lexicale précisant la portée probablement inclusive du masculin pluriel grec.
lexical_decisions:
- source_word: πλείονας
  choice: la plupart
  rationale: Avec l’article et le génitif partitif, l’expression désigne la majorité des frères, et non simplement un nombre plus élevé.
- source_word: ἀδελφῶν
  choice: frères
  rationale: Le grec emploie un masculin pluriel. « Frères » en conserve la forme, tandis qu’une note indique que le groupe visé comprend vraisemblablement l’ensemble des croyants, femmes comprises.
- source_word: ἐν κυρίῳ
  choice: dans le Seigneur
  rationale: Cette formule paulinienne est conservée directement et se rattache ici naturellement à l’assurance acquise.
- source_word: πεποιθότας
  choice: ayant gagné en assurance
  rationale: Le participe parfait exprime un état d’assurance présent résultant d’un changement antérieur; cette tournure le rend en français naturel.
- source_word: τοῖς δεσμοῖς μου
  choice: grâce à mes chaînes
  rationale: « Chaînes » préserve l’image concrète de l’emprisonnement. « Grâce à » exprime la valeur causale probable du datif et le résultat paradoxalement positif dans ce contexte.
- source_word: περισσοτέρως
  choice: d’autant plus
  rationale: Cette expression française rend naturellement l’intensification comparative de l’adverbe.
- source_word: τολμᾶν
  choice: osent
  rationale: Le verbe conserve l’idée d’une résolution courageuse face au danger.
- source_word: ἀφόβως
  choice: sans crainte
  rationale: Cette formulation rend explicitement l’absence de peur, sans réduire le terme au sens plus général de hardiesse.
- source_word: τὸν λόγον
  choice: la parole
  rationale: La formule renvoie probablement au message de l’Évangile, mais « la parole » reste proche du texte sans ajouter « de Dieu », absent du grec.
- source_word: λαλεῖν
  choice: annoncer
  rationale: Avec « la parole » comme complément dans ce contexte missionnaire, « annoncer » est plus idiomatique en français que « dire la parole » tout en conservant l’idée de la communiquer oralement.
theological_decisions:
- issue: Portée de ἀδελφῶν
  choice: « frères » dans le texte, avec une note signalant le sens collectif probablement inclusif
  alternative: « frères et sœurs » ou « croyants » directement dans le texte
  rationale: La traduction garde le masculin grammatical du grec sans exclure silencieusement les femmes que le terme peut désigner collectivement dans ce contexte.
- issue: Fondement de l’assurance
  choice: « dans le Seigneur grâce à mes chaînes »
  alternative: Rattacher « dans le Seigneur » à « frères » ou rendre le datif par « à cause de mes chaînes »
  rationale: L’ordre des mots permet une certaine tension syntaxique, mais le rattachement de « dans le Seigneur » au participe est le plus naturel. Le contexte présente les chaînes de Paul comme la circonstance ayant accru l’assurance des croyants.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve les expressions pauliniennes « dans le Seigneur », « mes chaînes » et « la parole », tout en employant une syntaxe française naturelle.
