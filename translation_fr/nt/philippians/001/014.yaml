  naturalness: La phrase est naturelle et de registre moderne soutenu. « Annoncer la parole » est idiomatique dans ce contexte et constitue une explicitation limitée, acceptable, de l’acte de communiquer oralement le λόγος.
  terminology: « Frères », « dans le Seigneur », « chaînes » et « parole » préservent utilement la terminologie et les images du texte. La note sur la portée vraisemblablement inclusive de ἀδελφῶν est appropriée.
