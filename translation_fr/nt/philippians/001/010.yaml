id: PHP.1.10
reference: Philippians 1:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἰς τὸ δοκιμάζειν ὑμᾶς τὰ διαφέροντα, ἵνα ἦτε εἰλικρινεῖς καὶ ἀπρόσκοποι εἰς ἡμέραν Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/010.yaml
  text: so that you may approve the things that are excellent[a], in order that you may be pure and blameless for the day of Messiah[b],
translation:
  language: fr
  text: afin que vous discerniez ce qui est le meilleur[a], pour que vous soyez purs et irréprochables[b] en vue du jour du Messie[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ce qui est essentiel », « ce qui est excellent » ; plus littéralement : « les choses qui diffèrent ».'
    reason: lexical_alternative
  - marker: b
    text: Le terme grec peut aussi évoquer le fait de ne pas trébucher ou de ne faire trébucher personne.
    reason: lexical_ambiguity
  - marker: c
    text: 'Traduction traditionnelle : « le jour du Christ ».'
    reason: alternative_rendering
lexical_decisions:
- source_word: δοκιμάζειν
  choice: discerniez
  rationale: Le verbe exprime ici l’examen qui permet de reconnaître et d’approuver ce qui a de la valeur. « Discerner » rend naturellement cette démarche d’évaluation sans réduire le sens au simple fait de tester.
- source_word: τὰ διαφέροντα
  choice: ce qui est le meilleur
  rationale: L’expression signifie littéralement « les choses qui diffèrent », mais peut désigner, dans ce contexte, ce qui se distingue par sa valeur ou son importance. « Ce qui est le meilleur » conserve cette force comparative dans un français courant.
- source_word: εἰλικρινεῖς
  choice: purs
  rationale: L’adjectif peut évoquer la pureté, la sincérité ou l’intégrité. « Purs » convient au contexte éthique tout en laissant la note signaler l’autre nuance possible.
- source_word: ἀπρόσκοποι
  choice: irréprochables
  rationale: Le terme peut décrire ceux qui ne trébuchent pas ou ceux qui ne font pas trébucher autrui. « Irréprochables » exprime de manière concise une conduite qui ne donne pas prise au blâme.
- source_word: εἰς ἡμέραν Χριστοῦ
  choice: en vue du jour du Messie
  rationale: La préposition εἰς oriente vers ce jour comme but ou horizon. « En vue de » rend cette orientation sans imposer le sens temporel de « jusqu’à ». Χριστός est rendu par « Messie » puisqu’il fonctionne ici comme un titre.
theological_decisions:
- issue: Sens de ἀπρόσκοποι dans la description éthique
  choice: irréprochables
  alternative: sans trébucher / ne faisant trébucher personne
  rationale: Le grec permet une lecture passive ou active. Le texte principal emploie un terme français englobant, et la note conserve explicitement les deux possibilités.
- issue: Traduction de Χριστοῦ dans l’expression eschatologique εἰς ἡμέραν Χριστοῦ
  choice: Messie
  alternative: Christ
  rationale: Dans l’expression « jour du Messie », Χριστός conserve nettement sa valeur de titre. La traduction traditionnelle « jour du Christ » est indiquée en note.
translation_notes:
  register: Français international moderne, fluide et digne. La structure finale conserve les deux propositions de but du grec sans lourdeur excessive. « En vue du jour » garde l’orientation eschatologique de εἰς, tandis que les notes préservent les principales ambiguïtés lexicales.
