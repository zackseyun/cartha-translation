  text: τὸ δὲ ἐπιμένειν ⸀ἐν τῇ σαρκὶ ἀναγκαιότερον δι’ ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/024.yaml
  text: But to remain in the flesh is more necessary for your sake[a].
translation:
  language: fr
  text: Mais rester dans la chair est plus nécessaire pour vous[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « continuer à vivre dans le corps ».
    reason: Cette variante explicite le sens contextuel de « rester dans la chair » tout en signalant que l’expression grecque désigne ici la poursuite de la vie corporelle.
lexical_decisions:
- source_word: τὸ ἐπιμένειν
  choice: rester
  rationale: L’infinitif grec substantivé exprime ici le fait de continuer à vivre. « Rester » est naturel en français et conserve l’idée de prolonger la présence de Paul auprès des Philippiens.
- source_word: δὲ
  choice: Mais
  rationale: La conjonction marque le contraste avec la pensée précédente, où Paul évoque son départ pour être avec Christ.
- source_word: ἐν τῇ σαρκὶ
  choice: dans la chair
  rationale: Dans ce contexte, σάρξ désigne l’existence terrestre et corporelle, non une disposition morale pécheresse. La formulation conserve l’image grecque sans l’interpréter abusivement.
- source_word: ἀναγκαιότερον
  choice: plus nécessaire
  rationale: Le comparatif grec est conservé explicitement dans une expression française claire et directe.
- source_word: δι’ ὑμᾶς
  choice: à cause de vous
  rationale: Cette traduction préserve la portée causale ou circonstancielle de διά avec l’accusatif. Dans le contexte, elle signifie que les besoins des Philippiens rendent la présence de Paul plus nécessaire.
theological_decisions:
- issue: Sens de σάρξ dans ce verset
  choice: existence terrestre corporelle (« dans la chair »)
  alternative: sens moral (« nature pécheresse ») ou paraphrase explicative (« rester en vie dans ce monde »)
  rationale: Paul oppose son départ pour être avec Christ à la continuation de sa vie présente au service des Philippiens. Rien dans le contexte immédiat ne justifie un sens moral de σάρξ.
translation_notes:
  register: Français international moderne, sobre et digne. La structure infinitive du grec est conservée naturellement, et le comparatif « plus nécessaire » reste explicite.
