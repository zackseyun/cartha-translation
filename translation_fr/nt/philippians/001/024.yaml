  naturalness: « Mais rester dans la chair est plus nécessaire pour vous » est une formulation sobre, naturelle dans un registre biblique moderne et intelligible en français international. « À cause de vous » est grammaticalement possible, mais porte souvent une nuance défavorable ou accusatrice qui ne convient pas au bénéfice pastoral exprimé dans le contexte.
  terminology: « Dans la chair » préserve l’expression de Paul sans lui attribuer le sens moral de « nature pécheresse ». La note fournit de façon appropriée l’explicitation contextuelle « continuer à vivre dans le corps ».
