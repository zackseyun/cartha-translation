id: PHP.1.23
reference: Philippians 1:23
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: συνέχομαι δὲ ἐκ τῶν δύο, τὴν ἐπιθυμίαν ἔχων εἰς τὸ ἀναλῦσαι καὶ σὺν Χριστῷ εἶναι, πολλῷ ⸀γὰρ μᾶλλον κρεῖσσον,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/023.yaml
  text: But I am hard pressed between the two[a], having the desire to depart and be with Messiah[b], for that is far better.
translation:
  language: fr
  text: 'Mais je suis pris entre les deux : j’ai le désir de partir[a] et d’être avec le Messie[b], car c’est de loin préférable.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « mourir ». Littéralement : « partir ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou « le Christ ». En grec : « le Messie ».'
    reason: alternative_reading
lexical_decisions:
- source_word: συνέχομαι
  choice: je suis pris
  rationale: Le verbe exprime l’idée d’être pressé ou retenu par des forces opposées. « Je suis pris entre les deux » rend cette tension intérieure dans un français naturel sans suggérer nécessairement une déchirure émotionnelle.
- source_word: ἐκ τῶν δύο
  choice: entre les deux
  rationale: Dans ce contexte, l’expression désigne les deux possibilités qui exercent leur pression sur Paul ; « entre les deux » en restitue clairement la valeur idiomatique.
- source_word: τὴν ἐπιθυμίαν ἔχων
  choice: j’ai le désir
  rationale: Cette formulation conserve le nom explicite « désir » tout en transformant naturellement le participe grec en proposition française.
- source_word: ἀναλῦσαι
  choice: partir
  rationale: Le verbe évoque ici, par euphémisme, le départ de cette vie. « Partir » préserve l’image et n’explicite pas davantage que le grec.
- source_word: Χριστῷ
  choice: le Messie
  rationale: Χριστός conserve ici sa valeur de titre. « Le Messie » la rend explicitement, tandis qu’une note signale la forme traditionnelle « Christ ».
- source_word: πολλῷ γὰρ μᾶλλον κρεῖσσον
  choice: car c’est de loin préférable
  rationale: « De loin préférable » rend avec naturel la forte intensification du comparatif grec.
theological_decisions:
- issue: Portée de l’association entre le départ et la présence auprès du Messie
  choice: partir et être avec le Messie
  alternative: mourir et aller immédiatement au ciel
  rationale: La traduction conserve les deux éléments explicitement affirmés par le grec sans préciser un lieu, un mécanisme ni une chronologie doctrinale qui ne figurent pas dans le verset.
translation_notes:
  register: Français international moderne, simple et digne. Les deux-points rendent clairement le lien avec le désir de Paul sans alourdir la phrase. « Je suis pris entre les deux » privilégie la précision contextuelle et la lisibilité ; « de loin préférable » restitue l’intensité inhabituelle du comparatif grec.
