  text: ἐπὶ τῇ κοινωνίᾳ ὑμῶν εἰς τὸ εὐαγγέλιον ἀπὸ ⸀τῆς πρώτης ἡμέρας ἄχρι τοῦ νῦν,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/005.yaml
  text: because of your partnership in the gospel from the first day until now,[a]
translation:
  language: fr
  text: à cause de votre participation à l’Évangile depuis le premier jour jusqu’à maintenant.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en faveur de l’Évangile ». L’expression grecque peut désigner soit le domaine de leur participation commune, soit son orientation ou son but.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὶ τῇ κοινωνίᾳ
  choice: à cause de votre participation
  rationale: Avec le datif, ἐπί exprime ici le motif de l’action de grâce évoquée dans la phrase environnante. « Participation » rend κοινωνία comme un engagement partagé et actif, sans réduire le terme à une simple relation chaleureuse.
- source_word: ὑμῶν
  choice: votre
  rationale: Le génitif désigne directement les Philippiens comme ceux qui prennent part à cette participation.
- source_word: εἰς τὸ εὐαγγέλιον
  choice: à l’Évangile
  rationale: La préposition εἰς peut indiquer ici le domaine de la participation ou son orientation. « Participation à l’Évangile » est naturel en français et conserve cette formulation assez ouverte.
- source_word: εὐαγγέλιον
  choice: Évangile
  rationale: « Évangile » est le terme français établi dans le contexte paulinien et conserve la portée particulière du mot.
- source_word: ἀπὸ τῆς πρώτης ἡμέρας
  choice: depuis le premier jour
  rationale: « Depuis » exprime naturellement en français un point de départ dont les effets se prolongent dans le temps.
- source_word: ἄχρι τοῦ νῦν
  choice: jusqu’à maintenant
  rationale: Cette expression indique que la participation s’est poursuivie jusqu’au moment présent.
