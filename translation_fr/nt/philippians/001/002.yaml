  text: χάρις ὑμῖν καὶ εἰρήνη ἀπὸ θεοῦ πατρὸς ἡμῶν καὶ κυρίου Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/002.yaml
  text: Grace to you and peace from God our Father and the Lord Jesus the Messiah[a][b][c].
translation:
  language: fr
  text: Grâce et paix à vous, de la part de Dieu notre Père et du Seigneur Jésus le Messie[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Jésus-Christ ».
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις
  choice: grâce
  rationale: « Grâce » est le terme paulinien consacré en français et conserve à la fois la dimension relationnelle et la portée théologique de χάρις.
- source_word: ὑμῖν
  choice: à vous
  rationale: Le datif est rendu directement par « à vous », tournure appropriée à cette formule de salutation et de bénédiction.
- source_word: εἰρήνη
  choice: paix
  rationale: « Paix » est l’équivalent naturel qui préserve les résonances grecques et juives de la formule.
- source_word: ἀπό
  choice: de la part de
  rationale: Dans une salutation épistolaire française, « de la part de » exprime naturellement la provenance indiquée par ἀπό.
- source_word: θεοῦ πατρὸς ἡμῶν
  choice: Dieu notre Père
  rationale: Cette formulation comprend πατρὸς ἡμῶν comme une apposition à θεοῦ et restitue clairement « Dieu, notre Père » sans alourdir la phrase.
- source_word: κυρίου
  choice: Seigneur
  rationale: « Seigneur » est le rendu français établi de κύριος et en conserve la portée honorifique et christologique.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jésus le Messie
  rationale: Χριστός signifie « Messie » ou « Oint ». Avec l’article exigé par l’usage français, « Jésus le Messie » rend le titre de manière transparente, tout en signalant en note le traditionnel « Jésus-Christ ».
theological_decisions:
- issue: Valeur de Χριστοῦ dans la formule de salutation paulinienne
  choice: le Messie
  alternative: Christ, dans « Jésus-Christ »
  rationale: Dans cette formule, Χριστός peut déjà fonctionner presque comme un nom, ce qui justifie la traduction traditionnelle « Christ ». Néanmoins, « le Messie » conserve explicitement le sens du titre grec sans imposer une interprétation confessionnelle supplémentaire; l’autre lecture est maintenue en note.
translation_notes:
  register: Français international moderne, digne et concis. La structure nominale « Grâce et paix à vous » conserve la brièveté solennelle de la salutation grecque; « de la part de » rend la provenance avec naturel.
