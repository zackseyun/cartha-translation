id: PHP.1.19
reference: Philippians 1:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οἶδα γὰρ ὅτι τοῦτό μοι ἀποβήσεται εἰς σωτηρίαν διὰ τῆς ὑμῶν δεήσεως καὶ ἐπιχορηγίας τοῦ πνεύματος Ἰησοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/019.yaml
  text: For I know that this will turn out for my deliverance through your prayer and the provision of the Spirit of Jesus the Messiah[b][a],
translation:
  language: fr
  text: Car je sais que cela aboutira à mon salut[a], grâce à votre prière et à l’assistance de l’Esprit de Jésus le Messie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à ma délivrance » ou « à ma réhabilitation ».
    reason: alternative_reading
lexical_decisions:
- source_word: οἶδα
  choice: je sais
  rationale: Le parfait οἶδα a ici un sens présent et exprime avec naturel la certitude de Paul.
- source_word: τοῦτό
  choice: cela
  rationale: Le démonstratif singulier renvoie globalement à la situation présente de Paul sans la préciser davantage.
- source_word: ἀποβήσεται
  choice: aboutira
  rationale: Le verbe exprime l’issue ou le résultat; « aboutira » convient au futur et reste idiomatique en français.
- source_word: σωτηρίαν
  choice: salut
  rationale: « Salut » conserve l’étendue sémantique du grec, qui peut désigner ici la délivrance, la justification ou le salut au sens plus large; il fait aussi écho à la formulation de Job 13.16 dans la Septante.
- source_word: δεήσεως
  choice: prière
  rationale: « Prière » est le terme courant et naturel pour cette demande adressée à Dieu; le singulier collectif du grec est conservé.
- source_word: ἐπιχορηγίας
  choice: assistance
  rationale: Le nom désigne une aide ou une ressource fournie. « Assistance » rend cette idée sans décider si l’Esprit est lui-même le don fourni ou celui qui fournit l’aide.
- source_word: πνεύματος Ἰησοῦ Χριστοῦ
  choice: l’Esprit de Jésus le Messie
  rationale: La construction au génitif est rendue directement, et Χριστός est traduit comme le titre « Messie » dans une formulation française idiomatique.
theological_decisions:
- issue: Sens de σωτηρίαν dans le contexte de l’emprisonnement de Paul
  choice: salut
  alternative: délivrance; justification
  rationale: Le contexte permet une issue concrète liée à l’emprisonnement, mais le mot grec garde une portée théologique plus large. « Salut » préserve cette tension, tandis que les sens contextuels possibles figurent en note.
- issue: Rapport exprimé par ἐπιχορηγίας τοῦ πνεύματος
  choice: l’assistance de l’Esprit
  alternative: le don de l’Esprit; l’aide accordée par l’Esprit
  rationale: Le génitif peut laisser entendre soit que l’Esprit est accordé, soit qu’il fournit l’aide. La formulation retenue ne tranche pas explicitement cette ambiguïté.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la relation causale et instrumentale du grec tout en évitant une formulation excessivement technique.
