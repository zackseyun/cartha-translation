id: PHP.1.27
reference: Philippians 1:27
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Μόνον ἀξίως τοῦ εὐαγγελίου τοῦ Χριστοῦ πολιτεύεσθε, ἵνα εἴτε ἐλθὼν καὶ ἰδὼν ὑμᾶς εἴτε ἀπὼν ⸀ἀκούω τὰ περὶ ὑμῶν, ὅτι στήκετε ἐν ἑνὶ πνεύματι, μιᾷ ψυχῇ συναθλοῦντες τῇ πίστει τοῦ εὐαγγελίου,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/027.yaml
  text: Only conduct yourselves in a manner worthy of the gospel of Messiah[a], so that whether I come and see you or am absent, I may hear about you that you are standing firm in one spirit, with one soul striving together for the faith of the gospel[e][d][c][b],
translation:
  language: fr
  text: Seulement, conduisez-vous[a] d’une manière digne de la bonne nouvelle du Messie[b], afin que, soit que je vienne vous voir, soit que je sois absent, j’entende parler de vous que vous tenez ferme dans un même esprit[c], luttant ensemble d’une même âme pour la foi de la bonne nouvelle[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe traduit par « conduisez-vous » peut aussi évoquer la vie et les devoirs de citoyens.
    reason: Nuance civique de πολιτεύεσθε.
  - marker: b
    text: Ou « du Christ ».
    reason: Alternative lexicale pour Χριστοῦ.
  - marker: c
    text: Ou « dans un seul Esprit », s’il s’agit de l’Esprit saint.
    reason: Ambiguïté référentielle de πνεύματι.
  - marker: d
    text: Ou « luttant côte à côte pour la foi en la bonne nouvelle ».
    reason: La construction grecque permet de comprendre soit la foi liée à la bonne nouvelle, soit la foi placée en elle; cette formulation rend aussi plus explicitement la dimension collective de συναθλοῦντες.
lexical_decisions:
- source_word: Μόνον
  choice: Seulement
  rationale: Le terme placé en tête porte l’accent sur l’exhortation essentielle qui suit, sans ajouter d’élément absent du grec.
- source_word: ἀξίως
  choice: d’une manière digne de
  rationale: Cette tournure française naturelle conserve la valeur adverbiale et la portée éthique du terme.
- source_word: πολιτεύεσθε
  choice: conduisez-vous
  rationale: Cette traduction exprime naturellement la manière de vivre demandée dans le contexte; une note conserve la nuance civique du verbe grec.
- source_word: εὐαγγελίου
  choice: bonne nouvelle
  rationale: Traduction française claire et directe de εὐαγγέλιον, qui reste intelligible sans perdre son sens proclamatoire.
- source_word: Χριστοῦ
  choice: Messie
  rationale: Χριστός fonctionne ici comme un titre; « Messie » en restitue explicitement la valeur.
- source_word: ἀκούω τὰ περὶ ὑμῶν
  choice: j’entende dire à votre sujet
  rationale: Formulation idiomatique qui rend le sens de l’expression grecque concernant les nouvelles reçues à leur propos.
- source_word: στήκετε
  choice: vous tenez ferme
  rationale: Expression française courante qui conserve l’idée de stabilité et de persévérance.
- source_word: ἐν ἑνὶ πνεύματι
  choice: dans un même esprit
  rationale: La minuscule et « même » conviennent à l’unité communautaire mise en parallèle avec « une même âme », sans éliminer la possibilité d’une référence à l’Esprit saint.
- source_word: μιᾷ ψυχῇ
  choice: d’une même âme
  rationale: Cette traduction préserve l’image concrète de ψυχή et l’unité profonde des croyants, plutôt que de réduire le terme à la seule pensée.
- source_word: συναθλοῦντες
  choice: luttant ensemble
  rationale: La formulation maintient l’idée d’un effort combatif partagé et l’arrière-plan athlétique du verbe.
- source_word: τῇ πίστει τοῦ εὐαγγελίου
  choice: pour la foi de la bonne nouvelle
  rationale: Cette traduction proche de la construction grecque laisse ouverte la relation exacte du génitif, plutôt que de la résoudre silencieusement.
theological_decisions:
- issue: πνεύματι désigne-t-il l’Esprit saint ou l’esprit commun des croyants?
  choice: dans un même esprit
  alternative: dans un seul Esprit
  rationale: Le parallèle immédiat avec « d’une même âme » favorise l’idée d’une disposition et d’une unité partagées, mais la référence à l’Esprit saint demeure possible et est signalée en note.
- issue: Valeur de Χριστός dans τοῦ Χριστοῦ
  choice: du Messie
  alternative: du Christ
  rationale: Le mot grec garde ici sa valeur titulaire; « Messie » la rend explicitement, tandis que « Christ » est indiqué comme traduction traditionnelle possible.
- issue: Relation exprimée par τῇ πίστει τοῦ εὐαγγελίου
  choice: pour la foi de la bonne nouvelle
  alternative: pour la foi en la bonne nouvelle
  rationale: La construction grecque peut désigner la foi liée à la bonne nouvelle, son contenu de foi, ou la foi placée en elle; le texte principal conserve cette tension et la note donne l’autre lecture naturelle.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la structure exhortative de l’original tout en évitant les calques lourds. « D’une même âme » maintient l’image grecque; les notes préservent les nuances civique, christologique, pneumatologique et syntaxique.
