  variant: modern international French
source:
  edition: SBLGNT
  text: πεπληρωμένοι ⸂καρπὸν δικαιοσύνης τὸν⸃ διὰ Ἰησοῦ Χριστοῦ εἰς δόξαν καὶ ἔπαινον θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/011.yaml
  text: filled with the fruit of righteousness that comes through Jesus the Messiah[b][a], to the glory and praise of God.
translation:
  language: fr
  text: remplis du fruit de justice qui vient par Jésus le Messie[a], à la gloire et à la louange de Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Grec : « Jésus Christ » ; « Messie » traduit ici Christos comme un titre.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πεπληρωμένοι
  choice: remplis
  rationale: Le participe parfait exprime un état résultant et se rattache à la proposition précédente. « Remplis » conserve ce lien participial dans un français naturel.
- source_word: καρπὸν
  choice: fruit
  rationale: « Fruit » préserve l’image des effets visibles produits dans la vie des croyants.
- source_word: δικαιοσύνης
  choice: justice
  rationale: « Justice » est l’équivalent français courant de δικαιοσύνη et peut désigner ici la droiture morale sans exclure les autres nuances du terme.
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: qui vient par Jésus le Messie
  rationale: διά suivi du génitif indique l’intermédiaire ou le moyen. « Qui vient par » exprime naturellement que ce fruit dépend de l’action de Jésus, tout en évitant de préciser excessivement la relation syntaxique.
- source_word: Χριστοῦ
  choice: le Messie
  rationale: « Messie » rend le contenu du titre Χριστός. L’article est requis par l’usage français naturel devant ce titre en apposition à Jésus.
- source_word: εἰς δόξαν καὶ ἔπαινον θεοῦ
  choice: à la gloire et à la louange de Dieu
  rationale: La préposition εἰς marque ici le but ou le résultat. Cette formulation française en conserve la portée et la coordination.
theological_decisions:
- issue: Sens de « fruit de justice »
  choice: Conserver la construction ouverte « fruit de justice »
  alternative: « fruit qui consiste en la justice » ou « fruit produit par la justice »
  rationale: Le génitif δικαιοσύνης peut caractériser le fruit, en indiquer le contenu ou entretenir une autre relation étroite avec lui. La traduction ne tranche pas artificiellement entre ces lectures.
- issue: Médiation de Jésus dans la production du fruit
  choice: « qui vient par Jésus le Messie »
  alternative: « produit par Jésus le Messie »
  rationale: La formulation retenue affirme que le fruit vient par l’intermédiaire de Jésus sans imposer une analyse plus précise de l’agence que ne le fait διά avec le génitif.
translation_notes:
  register: Français international moderne, sobre et digne. La phrase reste participiale afin de conserver son rattachement au verset précédent. « Fruit de justice » maintient l’image et l’ambiguïté du génitif grec.
