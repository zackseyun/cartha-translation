id: PHP.1.12
reference: Philippians 1:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Γινώσκειν δὲ ὑμᾶς βούλομαι, ἀδελφοί, ὅτι τὰ κατ’ ἐμὲ μᾶλλον εἰς προκοπὴν τοῦ εὐαγγελίου ἐλήλυθεν,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/012.yaml
  text: I want you to know[a], brothers, that what has happened to me has actually advanced the good news[b],
translation:
  language: fr
  text: Je veux que vous sachiez, frères[a], que ce qui m’est arrivé a en fait contribué à faire progresser la bonne nouvelle[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : frères. En grec, ce terme peut désigner ici l’ensemble de la communauté croyante, hommes et femmes.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : l’Évangile.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Γινώσκειν ... βούλομαι
  choice: Je veux que vous sachiez
  rationale: Cette tournure épistolaire exprime naturellement le désir de Paul d’informer ses destinataires. La formulation française est claire et conserve son intention personnelle.
- source_word: δὲ
  choice: non exprimé séparément
  rationale: δέ marque ici une transition légère. En français, l’enchaînement se fait naturellement sans ajouter « maintenant » ni imposer un contraste fort.
- source_word: ἀδελφοί
  choice: frères et sœurs
  rationale: Le pluriel masculin grec signifie littéralement « frères », mais, dans cette adresse à l’assemblée, il peut englober les croyants des deux sexes. La formulation explicite ce sens collectif probable, tandis que la note conserve la forme grecque.
- source_word: τὰ κατ’ ἐμὲ
  choice: ce qui m’est arrivé
  rationale: L’expression désigne globalement les événements et la situation vécus par Paul. Cette traduction est naturelle et évite le calque « les choses me concernant ».
- source_word: μᾶλλον
  choice: en fait
  rationale: Dans le contexte, μᾶλλον souligne un résultat contraire à ce que les destinataires auraient pu attendre. « En fait » rend cette nuance sans introduire une comparaison artificielle.
- source_word: εἰς προκοπὴν τοῦ εὐαγγελίου
  choice: contribué à faire progresser la bonne nouvelle
  rationale: La construction exprime un résultat favorable à la progression de l’annonce. « Contribué à faire progresser » restitue le rapport exprimé par εἰς προκοπήν de manière idiomatique.
- source_word: ἐλήλυθεν
  choice: a ... contribué
  rationale: Le parfait présente les événements passés comme ayant abouti à un résultat qui demeure. Le passé composé français rend naturellement ce résultat actuel.
- source_word: τοῦ εὐαγγελίου
  choice: la bonne nouvelle
  rationale: εὐαγγέλιον désigne une bonne nouvelle, ici le message chrétien annoncé. « La bonne nouvelle » reste transparent pour le lecteur moderne; « l’Évangile » est signalé comme autre traduction possible.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La phrase conserve la virgule finale parce que la pensée se poursuit au verset suivant. L’expression « en fait » rend le renversement implicite sans surcharger le texte.
