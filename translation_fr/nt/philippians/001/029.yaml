  - severity: medium
    issue: La note d réduit trop la nuance de τὸ ὑπὲρ Χριστοῦ.
    rationale: « À cause du Messie » fixe la préposition ὑπέρ à une causalité subie. Dans cette construction, la relation au Messie encadre les deux infinitifs et ne doit pas être ainsi limitée.
  - severity: low
    issue: La note c ajoute « pour sa cause ».
    rationale: Cette expression peut suggérer une cause ou un programme particulier, absent du grec. « Pour lui » et « à cause de lui » suffisent à indiquer les principales nuances sans ajout interprétatif.
