revisions:
- from: Car, pour le Messie[a], il vous a été fait la grâce non seulement de croire en lui[b], mais aussi de souffrir pour lui[c][d].
  to: Car il vous a été accordé par grâce, pour le Messie[a], non seulement de croire en lui[b], mais aussi de souffrir pour lui[c].
  rationale: La révision remplace une tournure plus pesante par un passif français clair qui préserve le sens de don gracieux de ἐχαρίσθη. Elle maintient « pour le Messie » dans une position qui rattache naturellement l’ensemble du privilège — croire et souffrir — au Messie, sans trancher de manière excessive la nuance de ὑπέρ. La note syntaxique qui imposait « à cause du Messie » est supprimée, et la note sur le second ὑπέρ est resserrée.
