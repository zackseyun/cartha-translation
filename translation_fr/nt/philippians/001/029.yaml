id: PHP.1.29
reference: Philippians 1:29
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὅτι ὑμῖν ἐχαρίσθη τὸ ὑπὲρ Χριστοῦ, οὐ μόνον τὸ εἰς αὐτὸν πιστεύειν ἀλλὰ καὶ τὸ ὑπὲρ αὐτοῦ πάσχειν),
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/029.yaml
  text: For it has been graciously granted to you on behalf of Messiah not only to believe in him[a], but also to suffer for him[d][c][b],
translation:
  language: fr
  text: Car il vous a été accordé par grâce, pour le Messie[a], non seulement de croire en lui[b], mais aussi de souffrir pour lui[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le Christ ». Le grec Χριστός est ici un titre qui signifie « Messie ».
    reason: lexical_alternative
  - marker: b
    text: Ou « de mettre votre confiance en lui ».
    reason: lexical_alternative
  - marker: c
    text: Ou « à cause de lui » ou « pour son bien ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Car
  rationale: Dans le contexte, la conjonction introduit l’explication de l’attitude décrite au verset précédent. « Car » marque naturellement ce lien argumentatif.
- source_word: ἐχαρίσθη
  choice: il vous a été fait la grâce
  rationale: Cette tournure française exprime à la fois le don gratuit et la forme passive du grec, sans réduire le verbe au sens de simple permission.
- source_word: τὸ ὑπὲρ Χριστοῦ
  choice: pour le Messie
  rationale: Ὑπέρ rattache au Messie l’ensemble du don ensuite explicité par les deux infinitifs. « Messie » rend Χριστός comme titre, tandis que « pour » conserve la latitude sémantique de la relation exprimée.
- source_word: πιστεύειν εἰς αὐτόν
  choice: croire en lui
  rationale: « Croire en » est l’expression française naturelle pour la foi placée en une personne et correspond directement à la construction grecque.
- source_word: πάσχειν
  choice: souffrir
  rationale: Le verbe grec est direct et ne précise ni la forme ni la durée de la souffrance ; « souffrir » maintient cette sobriété.
- source_word: ὑπὲρ αὐτοῦ
  choice: pour lui
  rationale: La formule concise peut exprimer le fait de souffrir à cause de lui ou pour sa cause, sans préciser excessivement la valeur de ὑπέρ.
theological_decisions:
- issue: La foi et la souffrance sont-elles toutes deux comprises dans ce qui est accordé par grâce ?
  choice: Conserver explicitement les deux infinitifs sous la portée de « il vous a été fait la grâce »
  alternative: Affaiblir ἐχαρίσθη en « il vous a été permis » ou dissocier la souffrance du don accordé
  rationale: La syntaxe grecque coordonne « croire » et « souffrir » comme les deux éléments de ce qui a été accordé. La traduction maintient cette tension théologique sans l’atténuer.
- issue: Valeur de ὑπέρ dans τὸ ὑπὲρ Χριστοῦ
  choice: « pour le Messie », avec une note signalant « à cause du Messie »
  alternative: Fixer exclusivement le sens comme bénéfice rendu au Messie ou comme cause subie à cause de lui
  rationale: La formulation grecque permet une nuance relationnelle large. Le texte principal conserve cette concision et la note rend visible l’autre formulation possible.
translation_notes:
  register: Français international actuel, digne et accessible. « Il vous a été fait la grâce de » est idiomatique tout en gardant la force du don gratuit. La place initiale de « pour le Messie » reflète sa portée sur les deux infinitifs, malgré une légère solennité voulue.
