  naturalness: Le français est globalement fluide et de registre approprié. « Je m’en réjouis » est plus direct et plus proche de ἐν τούτῳ χαίρω que « Voilà ce dont je me réjouis ».
  terminology: « Le Messie » est un rendu recevable de Χριστός dans son emploi titulairе et correspond à la décision terminologique du projet. « Proclamé » rend bien καταγγέλλεται. La note sur « le Christ » est utile.
