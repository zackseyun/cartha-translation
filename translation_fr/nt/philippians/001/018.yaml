source:
  edition: SBLGNT
  text: τί γάρ; πλὴν ⸀ὅτι παντὶ τρόπῳ, εἴτε προφάσει εἴτε ἀληθείᾳ, Χριστὸς καταγγέλλεται, καὶ ἐν τούτῳ χαίρω· ἀλλὰ καὶ χαρήσομαι,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/018.yaml
  text: What then? Only that in every way[a], whether in pretense or in truth, Messiah is being proclaimed, and in this I rejoice. Yes[b], and I will rejoice.
translation:
  language: fr
  text: 'Qu’importe donc ? Seulement ceci : de toute manière, que ce soit sous un prétexte[a] ou avec sincérité, le Messie[b] est proclamé ; je m’en réjouis. Oui, et je m’en réjouirai aussi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « que ce soit comme prétexte ou en vérité ».
    reason: La formulation plus littérale conserve les noms grecs, mais elle est moins naturelle en français courant ; le contraste peut porter sur le prétexte et la sincérité des mobiles.
  - marker: b
    text: Ou « le Christ ».
    reason: « Christ » est la translittération traditionnelle du titre grec Χριστός ; « Messie » en exprime le sens.
lexical_decisions:
- source_word: τί γάρ
  choice: Qu’importe donc ?
  rationale: Rend naturellement la brève question rhétorique et elliptique de Paul dans son contexte, sans développer explicitement ce qui « importe ».
- source_word: πλὴν ὅτι
  choice: 'Seulement ceci :'
  rationale: Conserve la valeur restrictive de l’expression et introduit clairement en français le fait essentiel qui suit.
- source_word: παντὶ τρόπῳ
  choice: de toute manière
  rationale: Préserve le sens distributif de la formule grecque tout en restant idiomatique.
- source_word: εἴτε προφάσει εἴτε ἀληθείᾳ
  choice: que ce soit sous un prétexte ou avec sincérité
  rationale: Exprime le contraste entre une proclamation servant de prétexte et une proclamation sincère, sans préciser davantage les mobiles en cause.
- source_word: Χριστὸς
  choice: le Messie
  rationale: Rend ici Χριστός comme un titre, objet de la proclamation, plutôt que comme un simple nom propre.
- source_word: καταγγέλλεται
  choice: est proclamé
  rationale: Conserve la voix passive et l’idée d’une annonce publique ; le présent français convient à l’action en cours dans le contexte.
- source_word: ἐν τούτῳ χαίρω
  choice: Voilà ce dont je me réjouis
  rationale: Formulation française naturelle qui rattache sans ambiguïté la joie de Paul au fait que le Messie est proclamé.
- source_word: ἀλλὰ καὶ χαρήσομαι
  choice: Oui, et je m’en réjouirai encore
  rationale: Rend la confirmation marquée par ἀλλὰ καί et maintient l’orientation future de χαρήσομαι, sans transformer explicitement le futur en idée de durée continue.
theological_decisions:
- issue: Traduction de Χριστός
  choice: le Messie
  alternative: le Christ
  rationale: Dans cette phrase centrée sur ce qui est proclamé, le terme garde nettement sa valeur de titre. « Le Messie » rend ce contenu de manière transparente, tandis qu’une note conserve la traduction traditionnelle « le Christ ».
translation_notes:
  register: Français international moderne, digne et accessible. La tournure rhétorique demeure brève, le passif grec est conservé, et la différence entre présent et futur dans les deux expressions de joie reste visible.
