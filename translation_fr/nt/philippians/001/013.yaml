reference: Philippians 1:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὥστε τοὺς δεσμούς μου φανεροὺς ἐν Χριστῷ γενέσθαι ἐν ὅλῳ τῷ πραιτωρίῳ καὶ τοῖς λοιποῖς πᾶσιν,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/013.yaml
  text: so that my chains in Messiah have become known throughout the whole imperial guard and to all the rest[b][a],
translation:
  language: fr
  text: si bien que mes chaînes dans le Messie sont devenues connues au sein de toute la garde impériale[b] et auprès de tous les autres[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « mes chaînes à cause du Messie »; l’expression peut aussi souligner que Paul porte ses chaînes dans son union avec le Messie.
    reason: alternative_reading
  - marker: b
    text: Ou « dans tout le prétoire ». Le terme peut désigner la garde impériale ou le quartier général, voire la résidence, d’un gouverneur ou de l’empereur.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: si bien que
  rationale: Introduit le résultat de ce qui précède, avec une tournure française naturelle qui conserve la valeur consécutive.
- source_word: τοὺς δεσμούς μου
  choice: je suis enchaîné
  rationale: δεσμοί désigne littéralement les liens ou chaînes et, par métonymie, l'emprisonnement. La formulation verbale conserve l'image concrète tout en restant idiomatique.
- source_word: φανεροὺς ... γενέσθαι
  choice: il est devenu manifeste
  rationale: Rend la construction résultative et l'idée que la raison des chaînes de Paul est désormais publiquement reconnue.
- source_word: ἐν Χριστῷ
  choice: à cause du Messie
  rationale: Dans ce contexte, la phrase peut indiquer que l'emprisonnement de Paul est lié à son allégeance au Messie. Cette interprétation contextuelle est donnée dans le texte, tandis que la formulation plus littérale demeure en note.
- source_word: Χριστῷ
  choice: Messie
  rationale: Χριστός est ici un titre christologique; « Messie » en conserve le sens plutôt que de le traiter comme un simple nom propre.
- source_word: πραιτωρίῳ
  choice: garde impériale
  rationale: Le terme désigne probablement ici la garde prétorienne ou l'établissement impérial. « Garde impériale » exprime clairement le référent humain suggéré par le contexte.
- source_word: τοῖς λοιποῖς πᾶσιν
  choice: auprès de tous les autres
  rationale: Reproduit l'élargissement du cercle au-delà de la garde, sans préciser un groupe que le grec laisse implicite.
theological_decisions:
- issue: Sens de ἐν Χριστῷ par rapport aux chaînes de Paul
  choice: « à cause du Messie », indiquant la raison reconnue de son emprisonnement
  alternative: « mes chaînes dans le Messie », soulignant l'union avec le Messie comme sphère de cet emprisonnement
  rationale: Le contexte porte sur ce que les autres ont compris au sujet des chaînes de Paul. La lecture causale est naturelle, mais le grec conserve une ambiguïté réelle; l'autre lecture est donc explicitement préservée en note.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe place le cadre de diffusion avant le constat afin d'éviter l'ambiguïté peu naturelle de « mes chaînes sont devenues manifestes ». Les notes conservent les ambiguïtés de ἐν Χριστῷ et de πραιτώριον.
