language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἵνα τὸ καύχημα ὑμῶν περισσεύῃ ἐν Χριστῷ Ἰησοῦ ἐν ἐμοὶ διὰ τῆς ἐμῆς παρουσίας πάλιν πρὸς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/026.yaml
  text: so that your boasting in Messiah Jesus may abound because of me through my coming to you again[a][b][c][d].
translation:
  language: fr
  text: afin que votre sujet de fierté en Jésus le Messie abonde à mon sujet par mon retour auprès de vous.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « afin que votre fierté en Jésus le Messie abonde » ; le nom grec peut désigner soit la fierté exprimée, soit ce qui en donne sujet.
    reason: lexical_alternative
  - marker: b
    text: 'On peut aussi comprendre : « afin que votre sujet de fierté abonde en Jésus le Messie ».'
    reason: syntactic_ambiguity
  - marker: c
    text: Littéralement « en moi » ; ici, le sens paraît être « à mon sujet » ou « à cause de moi ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: afin que
  rationale: Introduit le but ou le résultat attendu de ce qui précède, tout en conservant le mouvement prospectif de la proposition grecque.
- source_word: τὸ καύχημα ὑμῶν
  choice: votre sujet de fierté
  rationale: καύχημα peut désigner aussi bien l’expression de la fierté que ce qui lui sert de motif. « Sujet de fierté » rend clairement ce second sens, bien adapté ici, sans lui donner une connotation nécessairement négative.
- source_word: περισσεύῃ
  choice: abonde
  rationale: Conserve l’image d’accroissement et de plénitude portée par le verbe grec ainsi que la valeur du subjonctif après ἵνα.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: en Jésus le Messie
  rationale: Rend Χριστός comme un titre et adopte un ordre naturel en français, tout en rattachant l’expression au « sujet de fierté ».
- source_word: ἐν ἐμοὶ
  choice: à cause de moi
  rationale: Le second ἐν indique vraisemblablement ici la personne de Paul comme occasion ou motif de cette fierté, plutôt qu’une localisation au sens strict.
- source_word: διὰ τῆς ἐμῆς παρουσίας πάλιν πρὸς ὑμᾶς
  choice: grâce à mon retour auprès de vous
  rationale: Dans ce contexte, παρουσία désigne la présence renouvelée de Paul auprès des Philippiens, donc son retour. « Grâce à » exprime naturellement le moyen indiqué par διά.
theological_decisions:
- issue: Traduction de Χριστός
  choice: Jésus le Messie
  alternative: Jésus-Christ
  rationale: Le terme grec conserve ici sa valeur de titre. « Le Messie » en traduit le sens, tandis que « Jésus-Christ » risquerait de le faire entendre principalement comme un nom composé.
- issue: Lien syntaxique de ἐν Χριστῷ Ἰησοῦ
  choice: Rattaché à « sujet de fierté »
  alternative: Rattaché à « abonde »
  rationale: L’expression paulinienne de la fierté « en » Jésus le Messie favorise ce rattachement, mais l’ordre grec permet formellement l’autre lecture; celle-ci est donc signalée en note.
translation_notes:
  register: Français international actuel, clair et digne. « Sujet de fierté » évite la nuance exclusivement négative de « vantardise » et préserve la possibilité que καύχημα désigne le motif de la fierté. « Abonde » maintient l’image grecque, légèrement soutenue mais intelligible. La formulation « Jésus le Messie » traduit explicitement le titre sans recourir au nom composé traditionnel.
