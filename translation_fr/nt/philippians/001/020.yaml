id: PHP.1.20
reference: Philippians 1:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: κατὰ τὴν ἀποκαραδοκίαν καὶ ἐλπίδα μου ὅτι ἐν οὐδενὶ αἰσχυνθήσομαι, ἀλλ’ ἐν πάσῃ παρρησίᾳ ὡς πάντοτε καὶ νῦν μεγαλυνθήσεται Χριστὸς ἐν τῷ σώματί μου, εἴτε διὰ ζωῆς εἴτε διὰ θανάτου.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/020.yaml
  text: in keeping with my eager expectation and hope that I will not be put to shame in anything[a], but that with all boldness, as always, even now Messiah will be magnified in my body[b], whether through life or through death.
translation:
  language: fr
  text: Selon ma vive attente et mon espérance, je ne serai en rien couvert de honte[a] ; au contraire, avec toute assurance, comme toujours, maintenant encore, le Messie[b] sera magnifié dans mon corps, que ce soit par la vie ou par la mort.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « je n’aurai honte de rien ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « le Christ ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ
  choice: conformément à
  rationale: La préposition exprime ici la conformité avec l’attente et l’espérance de Paul ; cette tournure française conserve ce rapport sans lui donner une valeur causale.
- source_word: ἀποκαραδοκίαν
  choice: vive attente
  rationale: Le nom rare évoque une attente intense et tendue vers l’avant. « Vive attente » en restitue la force dans un français naturel.
- source_word: ἐλπίδα
  choice: espérance
  rationale: « Espérance » correspond au sens paulinien d’une attente confiante et s’accorde au registre biblique moderne.
- source_word: ἐν οὐδενὶ
  choice: en rien
  rationale: Cette formulation concise conserve la négation totale du grec.
- source_word: αἰσχυνθήσομαι
  choice: je ne serai en rien couvert de honte
  rationale: Le passif français fait entendre la dimension publique d’une éventuelle humiliation, tout en laissant en note l’autre nuance possible, celle d’éprouver de la honte.
- source_word: ἐν πάσῃ παρρησίᾳ
  choice: avec une pleine assurance
  rationale: Dans ce contexte de témoignage public, παρρησία désigne une assurance ouverte et courageuse. Cette formulation est naturelle et évite le caractère parfois téméraire de « hardiesse ».
- source_word: μεγαλυνθήσεται
  choice: sera exalté
  rationale: Le verbe signifie faire apparaître ou reconnaître comme grand. « Sera exalté » exprime clairement cette mise en valeur tout en gardant un registre digne.
- source_word: Χριστὸς
  choice: le Messie
  rationale: Le titre reste porteur de sens dans ce passage ; « le Messie » rend donc sa valeur titulaire plutôt que de le traiter seulement comme un nom propre traditionnel.
- source_word: ἐν τῷ σώματί μου
  choice: dans mon corps
  rationale: La traduction directe préserve l’accent mis par Paul sur son témoignage incarné, dans la vie comme dans la mort.
- source_word: εἴτε διὰ ζωῆς εἴτε διὰ θανάτου
  choice: que ce soit par la vie ou par la mort
  rationale: διά avec le génitif présente la vie et la mort comme les moyens ou circonstances par lesquels le Messie sera exalté ; le parallélisme grec est conservé.
theological_decisions:
- issue: Valeur de Χριστός dans un contexte paulinien
  choice: le Messie
  alternative: le Christ
  rationale: Le contexte permet encore d’entendre la valeur du titre désignant l’oint attendu. Le choix ne tranche aucune question confessionnelle ; la forme traditionnelle « le Christ » est signalée en note.
- issue: Nuance de αἰσχυνθήσομαι
  choice: je ne serai pas couvert de honte
  alternative: je n’aurai pas honte
  rationale: La forme grecque peut évoquer soit l’humiliation publique, soit le sentiment de honte. Le texte principal retient la première nuance, bien adaptée au contexte de la comparution et du témoignage, sans supprimer l’autre possibilité.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la progression et les contrastes du grec, avec une ponctuation qui en facilite la lecture. « Pleine assurance » évite un archaïsme, tandis que « sera exalté » maintient la solennité de l’affirmation.
