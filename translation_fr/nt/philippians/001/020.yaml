  to: Selon ma vive attente et mon espérance, je ne serai en rien couvert de honte[a] ; au contraire, avec toute assurance, comme toujours, maintenant encore, le Messie[b] sera magnifié dans mon corps, que ce soit par la vie ou par la mort.
  rationale: 'Révision limitée à trois améliorations sûres : une syntaxe française plus directe pour le rapport introduit par ὅτι, « avec toute assurance » pour préserver πᾶς παρρησία, et « sera magnifié » pour refléter plus étroitement μεγαλυνθήσεται. Le choix « le Messie » et les deux alternatives lexicales en note sont maintenus.'
