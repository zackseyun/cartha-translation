    rationale: « Sera exalté » est interprétativement acceptable, mais « sera magnifié » est plus proche du verbe grec, qui exprime la manifestation de la grandeur, sans imposer une nuance supplémentaire.
  - severity: low
    issue: Rendu de ἐν πάσῃ παρρησίᾳ
    rationale: « Avec toute assurance » conserve la totalité de πᾶς et convient au courage public impliqué par παρρησία.
