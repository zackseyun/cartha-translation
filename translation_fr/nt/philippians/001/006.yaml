id: PHP.1.6
reference: Philippians 1:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: πεποιθὼς αὐτὸ τοῦτο ὅτι ὁ ἐναρξάμενος ἐν ὑμῖν ἔργον ἀγαθὸν ἐπιτελέσει ἄχρι ἡμέρας ⸂Χριστοῦ Ἰησοῦ⸃·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/006.yaml
  text: 'I am confident of this very thing: that he who began a good work among you will bring it to completion at the day of Messiah Jesus.'
translation:
  language: fr
  text: 'J’en suis convaincu : celui qui a commencé parmi vous[a] une bonne œuvre la mènera à son terme jusqu’au jour du Messie Jésus[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en vous ».
    reason: lexical_alternative
  - marker: b
    text: 'Traditionnellement : « du Christ Jésus ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πεποιθὼς αὐτὸ τοῦτο
  choice: J’en ai précisément la certitude
  rationale: Le participe exprime ici l’assurance de Paul dans le prolongement de la phrase précédente, et αὐτὸ τοῦτο renforce l’objet de cette assurance. Cette formulation est naturelle en français tout en conservant l’emphase.
- source_word: ὁ ἐναρξάμενος
  choice: celui qui a commencé
  rationale: La tournure garde le sujet personnel sans expliciter son identité, que le contexte permet de comprendre comme Dieu.
- source_word: ἐν ὑμῖν
  choice: parmi vous
  rationale: Le pronom est pluriel et désigne la communauté de Philippes. « Parmi vous » rend bien cette portée collective sans exclure l’action de Dieu dans chacun.
- source_word: ἔργον ἀγαθὸν
  choice: une œuvre bonne
  rationale: Rendu direct qui conserve l’ordre marqué de l’expression grecque et reste idiomatique dans un registre digne.
- source_word: ἐπιτελέσει
  choice: la mènera à son terme
  rationale: Cette expression indique l’achèvement effectif de l’œuvre et évite les connotations potentiellement trompeuses de « perfectionnera ».
- source_word: ἄχρι ἡμέρας
  choice: jusqu’au jour
  rationale: ἄχρι marque naturellement une limite temporelle. Le français « jusqu’au jour » préserve cette valeur sans décider si l’accent porte sur le processus continu ou sur son accomplissement final.
- source_word: Χριστοῦ Ἰησοῦ
  choice: du Messie Jésus
  rationale: Χριστός est rendu comme un titre messianique plutôt que par la translittération traditionnelle « Christ ».
theological_decisions:
- issue: Portée individuelle ou communautaire de l’œuvre commencée par Dieu
  choice: « parmi vous », avec la portée communautaire au premier plan
  alternative: « en vous », susceptible d’être compris collectivement ou individuellement
  rationale: Le pluriel ὑμῖν et l’adresse à l’Église de Philippes favorisent une lecture communautaire, sans exclure une application aux personnes qui la composent.
- issue: Rapport temporel entre l’achèvement de l’œuvre et le jour du Messie Jésus
  choice: « jusqu’au jour »
  alternative: « au jour » ou « d’ici au jour »
  rationale: La traduction conserve la valeur de limite temporelle de ἄχρι et évite d’imposer au texte l’idée plus précise que l’achèvement n’aurait lieu qu’au moment même de ce jour.
translation_notes:
  register: Français international moderne, clair et digne. La formulation garde l’assurance personnelle de Paul, la portée communautaire probable de l’adresse et l’ambiguïté temporelle de ἄχρι. Tous les appels de note figurent dans le texte.
