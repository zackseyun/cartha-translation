id: PHP.1.1
reference: Philippians 1:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Παῦλος καὶ Τιμόθεος δοῦλοι ⸂Χριστοῦ Ἰησοῦ⸃ πᾶσιν τοῖς ἁγίοις ἐν Χριστῷ Ἰησοῦ τοῖς οὖσιν ἐν Φιλίπποις σὺν ἐπισκόποις καὶ διακόνοις·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/001.yaml
  text: 'Paul and Timothy[a], servants of Messiah Jesus, to all the saints in Messiah Jesus who are in Philippi[c][b], together with the overseers and deacons:'
translation:
  language: fr
  text: 'Paul et Timothée, esclaves[a] du Messie Jésus[b], à tous les saints en Messie Jésus qui sont à Philippes, avec les responsables[c] et les diacres :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « serviteurs ». Le mot grec désigne des personnes placées sous l’autorité d’un maître ; dans ce contexte, « esclaves » en exprime la dépendance forte.
    reason: lexical_alternative
  - marker: b
    text: 'Traditionnellement : « Christ Jésus ». Le titre grec Christos signifie « Messie », c’est-à-dire « oint ».'
    reason: alternative_reading
  - marker: c
    text: Ou « surveillants »; traditionnellement, « évêques ».
    reason: lexical_alternative
lexical_decisions:
- source_word: δοῦλοι
  choice: esclaves
  rationale: « Esclaves » exprime directement le statut de dépendance et d’appartenance impliqué par δοῦλοι, sans l’atténuer en simple service volontaire.
- source_word: Χριστοῦ Ἰησοῦ / Χριστῷ Ἰησοῦ
  choice: du Messie Jésus / en Messie Jésus
  rationale: Χριστός conserve ici sa valeur de titre. « Messie » en rend le sens, tandis que « Jésus » demeure le nom propre.
- source_word: ἁγίοις
  choice: saints
  rationale: « Saints » est le terme français concis et établi pour désigner ceux qui sont mis à part pour Dieu dans les formules d’adresse pauliniennes.
- source_word: ἐν
  choice: en
  rationale: La répétition de « en » maintient aussi directement que possible l’expression paulinienne de l’union avec le Messie, tout en distinguant celle-ci de la localisation « à Philippes ».
- source_word: τοῖς οὖσιν ἐν Φιλίπποις
  choice: qui sont à Philippes
  rationale: La proposition relative rend naturellement le participe grec et conserve la localisation explicite des destinataires.
- source_word: σὺν
  choice: avec
  rationale: « Avec » exprime simplement l’association indiquée par σὺν, sans transformer les responsables et les diacres en un groupe séparé des saints.
- source_word: ἐπισκόποις
  choice: responsables
  rationale: Dans ce contexte ecclésial, « responsables » est naturel et compréhensible en français moderne, tout en évitant d’imposer d’emblée la structure plus tardive que peut évoquer « évêques ».
- source_word: διακόνοις
  choice: diacres
  rationale: Associé à ἐπισκόποις, le terme désigne vraisemblablement une fonction reconnue dans la communauté; « diacres » est donc plus précis que « serviteurs ».
theological_decisions:
- issue: Valeur titulaire de Χριστός dans la formule d’adresse
  choice: Messie Jésus
  alternative: Christ Jésus
  rationale: « Messie » rend la valeur du titre grec plutôt que de le traiter comme un second nom. La traduction traditionnelle « Christ Jésus » reste signalée, car elle est largement reçue et lexicalement légitime.
- issue: Portée de δοῦλοι
  choice: esclaves
  alternative: serviteurs
  rationale: Le choix principal conserve la dépendance forte et l’idée d’appartenance présentes dans le terme grec. « Serviteurs » est plus traditionnel et plus doux, mais peut masquer cette dimension.
- issue: Nature de la fonction désignée par ἐπισκόποις
  choice: responsables
  alternative: évêques ou surveillants
  rationale: Le verset atteste une responsabilité reconnue sans préciser toute la forme institutionnelle ultérieure de cette fonction; le texte principal emploie donc un terme non confessionnel, et la note préserve les autres équivalents.
translation_notes:
  register: Français international moderne, digne et lisible. La formulation conserve la structure de la salutation grecque, la répétition théologiquement chargée de « en Messie Jésus » et le deux-points final qui ouvre la suite de la lettre. « Responsables » privilégie la clarté actuelle sans projeter automatiquement une hiérarchie ecclésiastique postérieure.
