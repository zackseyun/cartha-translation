  variant: modern international French
source:
  edition: SBLGNT
  text: ἐμοὶ γὰρ τὸ ζῆν Χριστὸς καὶ τὸ ἀποθανεῖν κέρδος.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/021.yaml
  text: For to me[a], to live is Christ, and to die is gain.
translation:
  language: fr
  text: Car, pour moi, vivre, c’est Christ, et mourir est un gain.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμοὶ
  choice: pour moi
  rationale: Le datif exprime ici la perspective personnelle de Paul. « Pour moi » est naturel en français et conserve cette mise en relief.
- source_word: γὰρ
  choice: Car
  rationale: γάρ rattache cette affirmation à ce qui précède en donnant l’explication de l’attente et de l’espérance exprimées au verset 20.
- source_word: τὸ ζῆν
  choice: vivre
  rationale: L’infinitif substantivé désigne le fait de vivre. L’infinitif français maintient la formulation ramassée et le parallélisme avec « mourir ».
- source_word: Χριστὸς
  choice: Christ
  rationale: « Christ » rend directement Χριστός et convient à son emploi ici, proche d’un nom propre tout en conservant son arrière-plan de titre.
- source_word: τὸ ἀποθανεῖν
  choice: mourir
  rationale: Comme pour τὸ ζῆν, l’infinitif français restitue clairement l’infinitif substantivé et préserve l’équilibre de la phrase.
- source_word: κέρδος
  choice: un gain
  rationale: « Un gain » exprime l’avantage ou le bénéfice envisagé par Paul sans imposer une précision absente du texte grec.
theological_decisions:
- issue: La relation elliptique entre vivre et Christ
  choice: « vivre, c’est Christ »
  alternative: « ma vie, c’est Christ » ou « vivre, c’est servir Christ »
  rationale: Le grec ne comporte ni verbe copule explicite ni complément tel que « servir ». La traduction conserve donc la densité et l’ambiguïté théologique de l’énoncé sans l’expliciter.
translation_notes:
  register: Français moderne, sobre et digne. La ponctuation rend lisible la construction très condensée du grec tout en préservant son parallélisme et sa force aphoristique.
