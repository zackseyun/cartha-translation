  choice: dans chacune de mes prières
  rationale: Rend naturellement l’idée de toute occasion de supplication; « prière » est plus courant en français moderne, tandis que le contexte conserve la nuance de requête adressée à Dieu.
- source_word: ὑπὲρ πάντων ὑμῶν
  choice: pour vous tous
  rationale: Reproduit l’inclusion insistante de πάντων sans alourdir la phrase.
- source_word: μετὰ χαρᾶς
  choice: avec joie
  rationale: Équivalent direct, naturel et digne.
- source_word: τὴν δέησιν ποιούμενος
  choice: priant
  rationale: Le participe français transmet l’action concomitante et évite le calque peu naturel « faisant la prière ».
