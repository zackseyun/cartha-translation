  text: οἱ μὲν ἐξ ⸂ἀγάπης, εἰδότες ὅτι εἰς ἀπολογίαν τοῦ εὐαγγελίου κεῖμαι⸃,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/016.yaml
  text: The former do so out of love[a], knowing that I am appointed for the defense of the good news[b],
translation:
  language: fr
  text: Les uns le font par amour, sachant que je suis chargé de défendre la Bonne Nouvelle[a] ;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’Évangile ».
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ μὲν
  choice: Les uns le font
  rationale: La tournure grecque est elliptique et prépare le contraste avec οἱ δέ. Le verbe « le font » reprend naturellement l’action de proclamer le Christ mentionnée dans le contexte, sans l’insérer comme si elle était exprimée dans ce verset.
- source_word: ἐξ ἀγάπης
  choice: par amour
  rationale: Cette formulation française naturelle exprime le motif indiqué par ἐξ avec le nom abstrait ἀγάπη.
- source_word: εἰδότες
  choice: sachant
  rationale: Le participe présent conserve le lien étroit entre leur motivation et ce qu’ils savent de la situation de Paul.
- source_word: εἰς ἀπολογίαν
  choice: pour défendre
  rationale: ἀπολογία désigne ici une défense argumentée, avec une possible coloration judiciaire. La construction verbale est claire en français et rend la valeur de but de εἰς.
- source_word: τοῦ εὐαγγελίου
  choice: la bonne nouvelle
  rationale: Cette expression rend directement le sens de εὐαγγέλιον dans un français courant et digne.
- source_word: κεῖμαι
  choice: je suis établi
  rationale: Dans ce contexte, le verbe exprime une situation assignée ou destinée à un but. « Établi » conserve cette idée sans réduire le sens à la seule position physique de Paul en prison.
theological_decisions:
- issue: Portée de κεῖμαι dans le contexte de l’emprisonnement de Paul
  choice: je suis établi
  alternative: je suis placé ici
  rationale: « Je suis établi » laisse entendre que la situation de Paul répond à un dessein, comme le suggère l’emploi idiomatique de κεῖμαι, sans préciser explicitement l’agent ni développer une doctrine de la providence absente de la formulation grecque.
translation_notes:
  register: Français international moderne, naturel et digne. « Les uns le font » explicite sobrement l’ellipse grecque à partir du contexte immédiat. « Bonne nouvelle » privilégie la transparence du sens, tandis que la note conserve le terme chrétien traditionnel « Évangile ».
