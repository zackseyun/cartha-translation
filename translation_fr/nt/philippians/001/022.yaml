id: PHP.1.22
reference: Philippians 1:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἰ δὲ τὸ ζῆν ἐν σαρκί, τοῦτό μοι καρπὸς ἔργου— καὶ τί αἱρήσομαι οὐ γνωρίζω·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/022.yaml
  text: But if to go on living in the flesh means fruitful labor for me[b][a], yet which I will choose I do not know.
translation:
  language: fr
  text: Mais si continuer à vivre dans la chair[a] signifie pour moi un travail fructueux[b], je ne sais pourtant pas ce que je choisirai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans le corps ».
    reason: lexical_alternative
  - marker: b
    text: Ou « le fruit d’un travail » ou « une œuvre fructueuse ».
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ ζῆν
  choice: continuer à vivre
  rationale: L’infinitif substantivé désigne ici la poursuite de la vie présente. « Continuer à vivre » exprime naturellement cet aspect dans le contexte.
- source_word: ἐν σαρκί
  choice: dans la chair
  rationale: Dans ce contraste avec le départ pour être avec Christ, σάρξ désigne l’existence physique terrestre, et non une nature moralement pécheresse. « Dans la chair » conserve en outre le vocabulaire paulinien.
- source_word: καρπὸς ἔργου
  choice: un travail fructueux
  rationale: L’expression grecque est condensée. « Un travail fructueux » en rend naturellement les deux éléments tout en conservant l’idée d’une activité qui porte du fruit; une note signale des formulations plus formelles.
- source_word: αἱρήσομαι
  choice: je choisirai
  rationale: Le verbe exprime ici le choix entre continuer à vivre et partir pour être avec Christ.
- source_word: οὐ γνωρίζω
  choice: je ne sais pas
  rationale: Dans ce contexte, γνωρίζω exprime l’incertitude de Paul plutôt que l’action de faire connaître quelque chose.
theological_decisions:
- issue: Sens de σάρξ dans ce verset
  choice: l’existence physique terrestre (« dans la chair »)
  alternative: la nature pécheresse
  rationale: Le contexte oppose la poursuite de la vie présente au départ pour être avec Christ; il s’agit donc de la vie corporelle, sans connotation de corruption morale.
- issue: Rapport logique entre les deux propositions
  choice: « pourtant » marque la tension sans présenter la seconde proposition comme une simple conséquence
  alternative: « alors » introduisant explicitement une conséquence
  rationale: Le grec juxtapose une protase elliptique et l’incertitude de Paul. « Pourtant » respecte cette tension et évite d’ajouter une relation logique trop précise.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation explicite sobrement l’ellipse grecque par « signifie », tandis que « pourtant » maintient la tension de la phrase. Les termes pauliniens et les principales possibilités lexicales sont préservés dans le texte ou les notes.
