  text: having the same struggle that you saw in me and now hear that I still have.
translation:
  language: fr
  text: menant le même combat que celui que vous avez vu en moi et dont vous entendez maintenant parler à mon sujet.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγῶνα
  choice: combat
  rationale: Dans ce contexte, le terme désigne une lutte éprouvante liée à l’opposition et à la souffrance pour l’Évangile; « combat » est naturel et conserve sa force métaphorique.
- source_word: ἔχοντες
  choice: menant
  rationale: Avec « combat », le français idiomatique emploie « mener » plutôt qu’une traduction littérale par « avoir ».
- source_word: οἷον
  choice: le même… que celui que
  rationale: Cette formulation rend la comparaison entre le combat des Philippiens et celui de Paul sans alourdir la phrase.
- source_word: εἴδετε ἐν ἐμοὶ
  choice: vous m’avez vu mener
  rationale: Le grec dit littéralement « vous avez vu en moi »; l’explicitation du verbe sous-entendu produit un français naturel tout en conservant Paul comme exemple visible du combat.
- source_word: νῦν ἀκούετε ἐν ἐμοί
  choice: maintenant, vous apprenez que je mène encore
  rationale: « Apprendre » convient au sens de recevoir des nouvelles au sujet de Paul. « Encore » explicite la continuité naturellement impliquée entre le combat vu autrefois et celui dont ils entendent parler maintenant.
theological_decisions:
- issue: Nature et continuité du combat de Paul
  choice: « le même combat… que je mène encore »
  alternative: « le même combat… dont vous entendez maintenant parler à mon sujet »
  rationale: Le texte présente le combat des croyants comme comparable à celui de Paul et indique que les nouvelles présentes concernent la poursuite de ce combat. La traduction n’en précise pas davantage la nature et n’y importe aucune interprétation doctrinale particulière.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « mener » clarifie l’ellipse grecque et donne une phrase fluide; « encore » préserve l’idée de continuité retenue dans la révision anglaise.
