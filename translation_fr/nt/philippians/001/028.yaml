id: PHP.1.28
reference: Philippians 1:28
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ μὴ πτυρόμενοι ἐν μηδενὶ ὑπὸ τῶν ἀντικειμένων (ἥτις ⸂ἐστὶν αὐτοῖς⸃ ἔνδειξις ἀπωλείας, ⸀ὑμῶν δὲ σωτηρίας, καὶ τοῦτο ἀπὸ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/028.yaml
  text: and not being frightened in anything by those who oppose you[a]. This is a sign to them of destruction[c][b], but of your salvation—and this from God.
translation:
  language: fr
  text: sans vous laisser intimider en rien par ceux qui s’opposent à vous[a]. C’est pour eux un signe[b] de perdition, mais pour vous de salut — et cela vient de Dieu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sans être effrayés » ou « sans vous laisser alarmer ».
    reason: lexical_alternative
  - marker: b
    text: Ou « une preuve » ou « une indication ».
    reason: lexical_alternative
  - marker: c
    text: L’expression « cela vient de Dieu » peut se rapporter précisément au salut ou, plus largement, à tout le signe qui vient d’être décrit.
    reason: alternative_reading
lexical_decisions:
- source_word: πτυρόμενοι
  choice: vous laisser intimider
  rationale: Le verbe évoque le fait d’être effrayé, alarmé ou déstabilisé par une opposition. « Vous laisser intimider » est naturel en français et convient au contexte d’adversaires exerçant une pression.
- source_word: ἐν μηδενί
  choice: en rien
  rationale: 'Cette expression conserve de façon concise et idiomatique la portée absolue du grec : en aucune chose, à aucun égard.'
- source_word: ἀντικειμένων
  choice: ceux qui s’opposent à vous
  rationale: Le participe désigne les personnes qui s’opposent aux destinataires. Cette formulation explicite la relation sans réduire le terme à une catégorie abstraite.
- source_word: ἔνδειξις
  choice: signe
  rationale: Le mot désigne une manifestation probante ou une indication. « Signe » est clair et concis, tout en laissant la note signaler les nuances possibles de preuve et d’indication.
- source_word: ἀπωλείας
  choice: perdition
  rationale: Dans ce contraste eschatologique avec σωτηρία, « perdition » exprime la ruine définitive sans préciser au-delà du grec la nature du jugement.
- source_word: σωτηρίας
  choice: salut
  rationale: « Salut » est le terme français naturel qui préserve ici la portée théologique de l’action salvatrice de Dieu.
- source_word: τοῦτο ἀπὸ θεοῦ
  choice: et cela vient de Dieu
  rationale: La formulation garde le démonstratif neutre et ne fixe pas son antécédent, tout en donnant une phrase française naturelle.
theological_decisions:
- issue: Référent de τοῦτο (« cela »)
  choice: 'Le texte principal conserve un référent volontairement ouvert : « et cela vient de Dieu »'
  alternative: « Cela » peut viser précisément le salut des croyants ou, plus largement, le signe que constitue leur fermeté face aux adversaires.
  rationale: Le grec ne tranche pas clairement entre ces antécédents. La traduction préserve donc l’ambiguïté et la tension théologique au lieu de les résoudre.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement pluriel correspond à l’adresse communautaire. « En rien » maintient la totalité du grec; « perdition » conserve le contraste théologique avec « salut ». Les marqueurs de notes sont placés immédiatement après les éléments concernés.
