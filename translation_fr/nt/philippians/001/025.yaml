  source_fidelity: La reformulation « pour que vous progressiez et trouviez votre joie » transforme les deux substantifs grecs coordonnés (προκοπήν et χαράν) en deux actions attribuées aux Philippiens. En particulier, « trouviez votre joie » ajoute une nuance absente du texte. Une formulation nominale conserve mieux la structure et l’ouverture sémantique du grec.
