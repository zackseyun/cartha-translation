id: PHP.1.25
reference: Philippians 1:25
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ τοῦτο πεποιθὼς οἶδα ὅτι μενῶ καὶ ⸀παραμενῶ πᾶσιν ὑμῖν εἰς τὴν ὑμῶν προκοπὴν καὶ χαρὰν τῆς πίστεως,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/025.yaml
  text: And convinced of this[a], I know that I will remain and continue with all of you for your progress and joy in the faith,
translation:
  language: fr
  text: Et, convaincu de cela, je sais que je resterai et continuerai à être auprès de vous tous, pour votre progrès et votre joie dans la foi[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « la joie de la foi » ou « la joie qui vient de la foi ».'
    reason: Le rapport précis exprimé par le génitif τῆς πίστεως est ambigu.
lexical_decisions:
- source_word: πεποιθὼς
  choice: convaincu
  rationale: Le participe parfait exprime ici un état durable de conviction. « Convaincu » est naturel en français et conserve cette valeur résultative.
- source_word: μενῶ
  choice: je resterai
  rationale: Le futur de μένω signifie « rester » ou « demeurer ». « Je resterai » rend clairement la forme verbale et permet de le distinguer du composé qui suit.
- source_word: παραμενῶ
  choice: demeurerai auprès de
  rationale: Le composé ajoute l’idée de continuer à être présent aux côtés des Philippiens. « Demeurerai auprès de » conserve cette nuance relationnelle sans réduire le sens à la seule survie.
- source_word: πᾶσιν ὑμῖν
  choice: auprès de vous tous
  rationale: Cette formulation rend explicitement πᾶσιν et exprime naturellement la présence prolongée de Paul aux côtés de toute la communauté.
- source_word: προκοπὴν
  choice: progressiez
  rationale: προκοπή désigne une progression ou une avancée. La tournure verbale « pour que vous progressiez » est fluide en français moderne et exprime clairement le but introduit par εἰς.
- source_word: χαρὰν τῆς πίστεως
  choice: trouviez votre joie dans la foi
  rationale: Cette formulation française naturelle associe la joie à la foi sans imposer une lecture strictement causale du génitif.
- source_word: πίστεως
  choice: foi
  rationale: Dans ce contexte, πίστις désigne le croire et la vie croyante des Philippiens. « Foi » est le terme français le plus direct et le moins interprétatif.
theological_decisions:
- issue: Valeur du génitif dans χαρὰν τῆς πίστεως
  choice: votre joie dans la foi
  alternative: la joie de la foi ; la joie qui vient de la foi
  rationale: Le génitif grec peut exprimer une association, une caractérisation ou une origine. Le texte principal retient une formulation idiomatique qui ne tranche pas nettement entre ces rapports, tandis que la note signale les autres possibilités.
translation_notes:
  register: 'Français international moderne, digne et accessible. Le couple « resterai et demeurerai auprès de » conserve la répétition nuancée entre μένω et παραμένω. La construction finale a été verbalisée pour éviter une formulation nominale lourde, tout en gardant les deux objectifs coordonnés : progrès et joie.'
