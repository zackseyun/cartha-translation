id: PHP.1.15
reference: Philippians 1:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Τινὲς μὲν καὶ διὰ φθόνον καὶ ἔριν, τινὲς δὲ καὶ δι’ εὐδοκίαν τὸν Χριστὸν κηρύσσουσιν·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/015.yaml
  text: Some indeed proclaim the Messiah because of envy and rivalry[a], but others because of goodwill.
translation:
  language: fr
  text: Certains, il est vrai, proclament le Christ par jalousie et rivalité, mais d’autres le font par bienveillance.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τινὲς μὲν … τινὲς δὲ
  choice: Certains, il est vrai, … mais d’autres
  rationale: Cette formulation naturelle en français rend le contraste entre les deux groupes marqué par μέν…δέ, tout en donnant à μέν une nuance concessive légère.
- source_word: διὰ φθόνον
  choice: par jalousie
  rationale: Avec διά suivi de l’accusatif, l’expression indique ici le motif. « Par jalousie » est idiomatique et direct en français.
- source_word: ἔριν
  choice: rivalité
  rationale: Dans ce contexte de motivations concurrentielles, « rivalité » exprime mieux la dimension interpersonnelle et compétitive que « dispute » ou « querelle ».
- source_word: δι’ εὐδοκίαν
  choice: par bienveillance
  rationale: Le terme contraste avec la jalousie et la rivalité et désigne une disposition favorable. « Bienveillance » reste concise sans préciser indûment envers qui elle s’exerce.
- source_word: τὸν Χριστόν
  choice: le Christ
  rationale: En français courant biblique, « le Christ » conserve naturellement le titre grec Χριστός et l’article, sans imposer ici la forme moins habituelle « le Messie ».
- source_word: κηρύσσουσιν
  choice: proclament
  rationale: « Proclament » conserve la dimension d’annonce publique de κηρύσσω sans la coloration institutionnelle que peut prendre « prêchent ».
- source_word: καὶ … καὶ
  choice: non traduit séparément
  rationale: Les deux καί ont ici une valeur d’accompagnement ou d’insistance difficile à reproduire sans lourdeur. Le contraste et les motifs sont pleinement exprimés par une formulation française naturelle.
theological_decisions:
- issue: Valeur titulaire de Χριστός
  choice: le Christ
  alternative: le Messie
  rationale: Les deux rendent le titre « Oint ». « Le Christ » est la désignation titulaire établie et transparente pour le lectorat français, et l’article grec est conservé.
translation_notes:
  register: Français moderne, digne et accessible. La structure contrastive est conservée sans reproduire mécaniquement les particules grecques, ce qui alourdirait la phrase.
