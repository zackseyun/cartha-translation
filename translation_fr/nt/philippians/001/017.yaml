id: PHP.1.17
reference: Philippians 1:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οἱ δὲ ἐξ ⸂ἐριθείας τὸν Χριστὸν καταγγέλλουσιν, οὐχ ἁγνῶς, οἰόμενοι θλῖψιν ἐγείρειν τοῖς δεσμοῖς μου⸃.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/017.yaml
  text: But the others proclaim the Messiah out of selfish ambition[a], not sincerely[b], thinking to raise up affliction for me in my imprisonment.
translation:
  language: fr
  text: Mais les autres annoncent le Messie par ambition personnelle, sans intentions pures, pensant susciter pour moi de la détresse dans mes liens.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐριθείας
  choice: ambition personnelle
  rationale: Le terme désigne une ambition intéressée, souvent teintée de rivalité ou d’esprit de parti. « Ambition personnelle » exprime naturellement en français le motif égocentrique sans le réduire à une simple rivalité.
- source_word: Χριστόν
  choice: le Messie
  rationale: Dans ce contexte, le mot désigne celui qui est publiquement annoncé dans son identité messianique; la valeur de titre reste donc saillante.
- source_word: καταγγέλλουσιν
  choice: annoncent
  rationale: Le verbe évoque une proclamation publique. « Annoncent » est idiomatique et ne limite pas l’action à la prédication formelle.
- source_word: οὐχ ἁγνῶς
  choice: sans intentions pures
  rationale: L’adverbe porte ici sur la pureté des motivations. Cette formulation rend explicitement ce sens tout en conservant l’image morale de pureté présente dans le grec.
- source_word: οἰόμενοι
  choice: pensant ainsi
  rationale: Le participe exprime ce qu’ils pensent produire par leur conduite; « ainsi » explicite sobrement le lien avec leur manière intéressée d’annoncer.
- source_word: θλῖψιν ἐγείρειν
  choice: rendre … plus pénible
  rationale: L’expression signifie susciter ou accroître une détresse. Dans le contexte des liens de Paul, cette tournure française naturelle indique qu’ils cherchent à ajouter à son épreuve.
- source_word: τοῖς δεσμοῖς μου
  choice: ma détention
  rationale: Littéralement « mes liens », l’expression désigne par métonymie l’emprisonnement de Paul. « Ma détention » est clair, actuel et concis.
theological_decisions:
- issue: Traduction de Χριστός
  choice: le Messie
  alternative: le Christ
  rationale: Le contexte présente Χριστός comme le contenu de l’annonce publique et met ainsi en relief sa fonction de titre. « Le Christ » demeure une traduction traditionnelle possible, mais peut être perçu en français comme un nom propre.
- issue: Portée de θλῖψιν sur les liens de Paul
  choice: rendre ma détention plus pénible
  alternative: susciter de la détresse dans mes liens
  rationale: Le grec permet une formulation étroitement liée aux « liens » de Paul sans préciser exactement la forme de l’affliction ajoutée. La traduction retenue préserve l’idée d’aggravation de son épreuve sans définir le mécanisme.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve le contraste initial et la tension entre la justesse du message annoncé et l’impureté des motivations, sans alourdir le verset de calques grecs.
