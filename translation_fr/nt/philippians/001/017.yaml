- from: Mais les autres annoncent le Messie par ambition personnelle, sans intentions pures, pensant ainsi rendre ma détention plus pénible.
  to: Mais les autres annoncent le Messie par ambition personnelle, sans intentions pures, pensant susciter pour moi de la détresse dans mes liens.
  rationale: La révision maintient les choix terminologiques solides du projet tout en rendant plus directement θλῖψιν ἐγείρειν (« susciter de la détresse ») et τοῖς δεσμοῖς μου (« dans mes liens »). Elle évite d’imposer l’idée que la détention elle-même serait nécessairement aggravée, tout en restant claire et naturelle dans un registre moderne.
