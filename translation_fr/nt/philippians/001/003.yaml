  text: Je remercie mon Dieu chaque fois que je me souviens de vous.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Je remercie mon Dieu pour chaque souvenir que j’ai de vous. »'
    reason: La construction grecque peut exprimer l’occasion répétée de l’action de grâce (« chaque fois que ») ou présenter chaque souvenir comme son motif (« pour chaque souvenir »).
lexical_decisions:
- source_word: Εὐχαριστῶ
  choice: Je remercie
  rationale: Le présent actif à la première personne du singulier est rendu directement et naturellement en français.
- source_word: τῷ θεῷ μου
  choice: mon Dieu
  rationale: Avec « remercier », le datif grec se rend idiomatiquement par un complément d’objet direct en français; le possessif est conservé.
- source_word: ἐπὶ πάσῃ
  choice: chaque fois que
  rationale: Cette tournure exprime naturellement l’occasion répétée de l’action de grâce, correspondant à ἐπί avec le datif et à la valeur distributive de πάσῃ.
- source_word: τῇ μνείᾳ ὑμῶν
  choice: je me souviens de vous
  rationale: La locution verbale française rend avec naturel le nom μνεία au sens de souvenir, sans trancher en faveur du sens moins probable de « mention ».
