  naturalness: La phrase est fluide et de registre moderne soutenu. « Combien je désire ardemment vous voir tous » est idiomatique en français et rend naturellement l’intensité introduite par ὡς. L’ajout de « voir » est une explicitation française légère et usuelle du désir adressé à des personnes absentes, moins interprétative que « être auprès de ».
