  text: μάρτυς γάρ ⸀μου ὁ θεός, ὡς ἐπιποθῶ πάντας ὑμᾶς ἐν σπλάγχνοις ⸂Χριστοῦ Ἰησοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/008.yaml
  text: For God is my witness[b][a], how I long for all of you with the affections of Messiah Jesus.
translation:
  language: fr
  text: 'Car Dieu m’est témoin : combien je désire ardemment vous voir tous, avec la tendresse[b] du Messie Jésus[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Christ Jésus ».'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « la compassion ». Le mot grec désigne littéralement les entrailles, considérées comme le siège des sentiments profonds.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μάρτυς
  choice: témoin
  rationale: Dans la formule solennelle « Dieu m’est témoin », « témoin » rend directement le grec et présente Dieu comme garant de la sincérité de Paul.
- source_word: γάρ
  choice: Car
  rationale: « Car » conserve le lien explicatif avec ce qui précède, dans un registre digne et courant.
- source_word: ὡς
  choice: je désire ardemment
  rationale: La ponctuation française après « Dieu m’est témoin » permet d’exprimer naturellement le contenu et l’intensité introduits par ὡς, sans imposer le tour peu idiomatique « combien je vous désire ».
- source_word: ἐπιποθῶ
  choice: je désire ardemment être auprès de
  rationale: Le verbe exprime une aspiration personnelle intense dirigée vers des personnes. Cette formulation naturelle explicite en français la proximité désirée sans réduire le sentiment à la seule idée de les revoir.
- source_word: πάντας ὑμᾶς
  choice: vous tous
  rationale: Cette expression conserve l’insistance inclusive de πάντας tout en restant naturelle en français contemporain.
- source_word: σπλάγχνοις
  choice: tendresse
  rationale: Le terme désigne littéralement les entrailles considérées comme le siège des émotions profondes. « Tendresse » en restitue ici la valeur affective de manière naturelle; « compassion » reste possible et figure en note.
- source_word: Χριστοῦ Ἰησοῦ
  choice: du Messie Jésus
  rationale: « Messie » traduit le titre Χριστός, tandis que « Jésus » conserve le nom. Le génitif grec est maintenu par « du » sans préciser si cette tendresse vient du Messie, lui appartient ou s’exerce en communion avec lui.
theological_decisions:
- issue: Valeur de Χριστοῦ dans la construction paulinienne Χριστοῦ Ἰησοῦ
  choice: Messie Jésus
  alternative: Christ Jésus
  rationale: La traduction « Messie » rend le sens du titre grec et reste intelligible ici. La forme traditionnelle et plus lexicalisée « Christ Jésus » est signalée en note.
- issue: Rapport entre la tendresse de Paul et celle du Messie Jésus
  choice: avec la tendresse du Messie Jésus
  alternative: avec la compassion du Messie Jésus
  rationale: La formulation conserve le génitif et son ouverture sémantique, sans décider si Paul parle d’une tendresse reçue du Messie, partagée avec lui ou caractérisée par lui.
translation_notes:
  register: Français international moderne, naturel et digne. Les deux-points évitent une construction lourde après la formule solennelle « Dieu m’est témoin ». « Être auprès de » exprime clairement l’élan vers les destinataires sans employer le tour vieilli « languir après ».
