id: PHP.1.9
reference: Philippians 1:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ τοῦτο προσεύχομαι ἵνα ἡ ἀγάπη ὑμῶν ἔτι μᾶλλον καὶ μᾶλλον περισσεύῃ ἐν ἐπιγνώσει καὶ πάσῃ αἰσθήσει,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/009.yaml
  text: 'And this I pray: that your love may abound still more and more in knowledge and all discernment[b][a],'
translation:
  language: fr
  text: Et je prie pour que votre amour abonde de plus en plus en connaissance[a] et en tout discernement[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avec connaissance » ; la préposition grecque peut exprimer une association étroite.
    reason: lexical_alternative
  - marker: b
    text: Ou « toute perspicacité » ou « toute perception morale ».
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ τοῦτο
  choice: Et voici
  rationale: Conserve le lien exprimé par καί et la valeur démonstrative de τοῦτο, tout en introduisant naturellement en français le contenu de la prière.
- source_word: προσεύχομαι
  choice: ma prière
  rationale: La tournure nominale « voici ma prière » rend naturellement le présent grec et présente ce qui suit comme le contenu de la prière de Paul.
- source_word: ἵνα
  choice: que
  rationale: Introduit naturellement en français le contenu et la visée de la prière.
- source_word: ἡ ἀγάπη ὑμῶν
  choice: votre amour
  rationale: Rend directement ἀγάπη et préserve l'ambiguïté du grec quant à l'objet précis de cet amour.
- source_word: ἔτι μᾶλλον καὶ μᾶλλον
  choice: de plus en plus
  rationale: Expression française idiomatique qui restitue l'idée d'une croissance continue et répétée.
- source_word: περισσεύῃ
  choice: abonde
  rationale: Préserve l'image d'abondance du verbe grec, plus forte qu'un simple accroissement.
- source_word: ἐν ἐπιγνώσει
  choice: en connaissance
  rationale: Maintient la structure prépositionnelle du grec sans renforcer indûment ἐπίγνωσις en « pleine connaissance ».
- source_word: πάσῃ αἰσθήσει
  choice: en tout discernement
  rationale: Dans ce contexte, αἴσθησις désigne une perception pratique ou morale; « discernement » est clair et naturel, tandis que « tout » conserve la portée de πάσῃ.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La formulation conserve l'image d'abondance et ne précise pas l'objet de « votre amour », que le grec laisse implicite.
