  text: τῷ δὲ θεῷ καὶ πατρὶ ἡμῶν ἡ δόξα εἰς τοὺς αἰῶνας τῶν αἰώνων· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/020.yaml
  text: To our God and Father be the glory forever and ever[a]. Amen.
translation:
  language: fr
  text: À notre Dieu et Père soit la gloire pour toujours et à jamais[a]. Amen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « pour les siècles des siècles ».'
    reason: alternative lexicale
lexical_decisions:
- source_word: δὲ
  choice: non rendu explicitement
  rationale: Particule de liaison légère introduisant ici la doxologie finale; en français, la transition se comprend naturellement sans ajouter « maintenant », qui introduirait une valeur temporelle absente du grec.
- source_word: τῷ θεῷ καὶ πατρὶ ἡμῶν
  choice: à notre Dieu et Père
  rationale: L’expression coordonnée désigne une seule personne; « notre » porte naturellement sur les deux noms.
- source_word: ἡ δόξα
  choice: soit la gloire
  rationale: La proposition grecque est sans verbe. Le subjonctif « soit » restitue avec naturel la portée doxologique sans transformer explicitement la formule en simple constat.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: pour toujours et à jamais
  rationale: Cette tournure idiomatique exprime une durée sans fin; la formulation française conserve à la fois le sens et la solennité de la doxologie.
- source_word: ἀμήν
  choice: Amen
  rationale: La translittération consacrée demeure immédiatement compréhensible comme affirmation liturgique.
theological_decisions:
- issue: Verbe sous-entendu dans la doxologie
  choice: soit la gloire
  alternative: la gloire appartient; à lui la gloire
  rationale: Le grec ne comporte aucun verbe. « Soit la gloire » préserve la valeur de louange ou d’acclamation de la formule tout en laissant perceptible son caractère elliptique.
translation_notes:
  register: Français moderne, digne et accessible. La formulation conserve le rythme solennel d’une doxologie sans archaïsme excessif.
