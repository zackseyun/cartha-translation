  text: ἀσπάζονται ὑμᾶς πάντες οἱ ἅγιοι, μάλιστα δὲ οἱ ἐκ τῆς Καίσαρος οἰκίας.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/022.yaml
  text: All the saints greet you[a], especially those of Caesar’s household.
translation:
  language: fr
  text: Tous les saints vous saluent, surtout ceux de la maison de César[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La « maison de César » désigne les personnes rattachées à la maison impériale, et pas nécessairement les membres de la famille de l’empereur.
    reason: Précision lexicale et historique sur la portée de οἱ ἐκ τῆς Καίσαρος οἰκίας.
lexical_decisions:
- source_word: ἀσπάζονται
  choice: saluent
  rationale: Verbe courant des salutations épistolaires ; « vous saluent » rend directement et naturellement la relation exprimée par le grec.
- source_word: πάντες οἱ ἅγιοι
  choice: Tous les saints
  rationale: Dans l’usage paulinien, le terme désigne les croyants comme personnes consacrées à Dieu. « Saints » conserve le terme théologique sans le remplacer par une paraphrase plus générale.
- source_word: μάλιστα δὲ
  choice: surtout
  rationale: « Surtout » marque naturellement en français la mise en relief d’un groupe particulier au sein de l’ensemble ; le connecteur δέ est rendu implicitement.
- source_word: οἱ ἐκ τῆς Καίσαρος οἰκίας
  choice: ceux de la maison de César
  rationale: 'Cette formulation concise conserve la portée large de l’expression : il s’agit de personnes rattachées à la maison impériale, sans affirmer qu’elles appartenaient à la famille biologique de César.'
- source_word: Καίσαρος
  choice: César
  rationale: Le maintien du titre historique « César » correspond directement au grec et évite de le remplacer dans le texte par l’explicitation « empereur ».
theological_decisions:
- issue: Sens de « saints » dans l’usage paulinien
  choice: Maintenir « saints » comme désignation collective des croyants.
  alternative: « croyants » ou « peuple de Dieu »
  rationale: Le contexte ne réserve pas ce mot à une élite spirituelle ou à des personnes canonisées. Garder « saints » préserve néanmoins le vocabulaire et la portée théologique de Paul sans les résoudre par une paraphrase.
- issue: Identité des personnes de la maison de César
  choice: Conserver l’expression large « ceux de la maison de César ».
  alternative: « les membres de la famille de César » ou « les employés de l’empereur »
  rationale: Le grec indique une association avec la maison impériale, mais ne précise ni lien familial ni fonction particulière. La traduction préserve cette indétermination.
translation_notes:
  register: Français international actuel, sobre et digne. La syntaxe brève reproduit la forme d’une salutation épistolaire. « Saints » est conservé comme terme paulinien établi, tandis que la note prévient une lecture trop étroite de « maison de César ».
