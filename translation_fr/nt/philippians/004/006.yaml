id: PHP.4.6
reference: Philippians 4:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: μηδὲν μεριμνᾶτε, ἀλλ’ ἐν παντὶ τῇ προσευχῇ καὶ τῇ δεήσει μετ’ εὐχαριστίας τὰ αἰτήματα ὑμῶν γνωριζέσθω πρὸς τὸν θεόν·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/006.yaml
  text: Do not be anxious about anything[a], but in everything, by prayer and petition with thanksgiving[c][b], let your requests be made known to God.
translation:
  language: fr
  text: Ne vous inquiétez de rien[a], mais, en toute circonstance, par la prière et la supplication[b], avec reconnaissance, faites connaître vos demandes à Dieu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ne vous faites aucun souci. »'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « la demande pressante ».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « devant Dieu ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδὲν μεριμνᾶτε
  choice: Ne vous inquiétez de rien
  rationale: Cette formulation française naturelle rend la portée totale de μηδέν avec l’impératif négatif et le sens de souci anxieux de μεριμνάω, sans suggérer l’absence de toute préoccupation légitime.
- source_word: ἐν παντί
  choice: en toute circonstance
  rationale: Le grec a une portée générale. « En toute circonstance » exprime clairement qu’aucune situation n’est exclue et sonne plus naturellement ici que le littéral « en toute chose ».
- source_word: τῇ προσευχῇ
  choice: la prière
  rationale: Terme courant et ample pour la démarche de prière adressée à Dieu.
- source_word: τῇ δεήσει
  choice: la supplication
  rationale: « Supplication » distingue la demande pressante et précise de la prière au sens large, tout en restant un terme français biblique compréhensible.
- source_word: μετ’ εὐχαριστίας
  choice: avec reconnaissance
  rationale: « Reconnaissance » rend naturellement l’action de grâce ou la gratitude envers Dieu dans ce contexte, sans alourdir la phrase.
- source_word: τὰ αἰτήματα ὑμῶν
  choice: vos demandes
  rationale: Cette expression concrète et accessible désigne ce qui est demandé, sans répéter « supplication ».
- source_word: γνωριζέσθω
  choice: faites connaître
  rationale: L’impératif actif idiomatique en français restitue directement la force du passif impératif grec, qui serait lourdement rendu par « que vos demandes soient portées à la connaissance ».
- source_word: πρὸς τὸν θεόν
  choice: à Dieu
  rationale: « À Dieu » est l’équivalent le plus direct et naturel avec « faire connaître », tout en gardant en note la nuance relationnelle ou présentielle possible de πρός.
theological_decisions:
- issue: Portée de l’interdiction de s’inquiéter
  choice: 'Formuler une interdiction générale du souci anxieux : « Ne vous inquiétez de rien »'
  alternative: « Ne vous faites aucun souci »
  rationale: Le verset oppose le souci anxieux à une démarche de prière reconnaissante; la traduction ne transforme pas cette exhortation spirituelle en jugement sur toute préoccupation humaine.
- issue: Relation exprimée par πρὸς τὸν θεόν
  choice: « à Dieu » dans le texte
  alternative: « devant Dieu »
  rationale: Le mouvement de la prière vers Dieu est le sens le plus direct dans cette construction, mais la nuance de présentation en présence de Dieu demeure possible et est signalée en note.
translation_notes:
  register: Français international moderne, digne et directement compréhensible. La syntaxe est fluide sans effacer la structure contrastive du grec (« mais ») ni la distinction entre la prière générale et la demande précise. Les trois marqueurs de notes figurent dans le texte principal.
