  verdict: revise
  source_fidelity: 'Le sens général est fidèlement rendu : Paul atteste avoir reçu le don transmis par Épaphrodite, se dit dans l’abondance et décrit ce don au moyen d’images sacrificielles. La nuance commerciale possible de ἀπέχω est correctement signalée. Une légère révision rend plus nettement les trois qualifications grecques successives du don.'
