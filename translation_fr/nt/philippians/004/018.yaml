  variant: modern international French
source:
  edition: SBLGNT
  text: ἀπέχω δὲ πάντα καὶ περισσεύω· πεπλήρωμαι δεξάμενος παρὰ Ἐπαφροδίτου τὰ παρ’ ὑμῶν, ὀσμὴν εὐωδίας, θυσίαν δεκτήν, εὐάρεστον τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/018.yaml
  text: But I have received everything[a], and I abound. I am fully supplied, having received from Epaphroditus what came from you—a fragrant aroma, an acceptable sacrifice, pleasing to God.
translation:
  language: fr
  text: 'Mais j’ai tout reçu[a] et je suis dans l’abondance. Je suis comblé, ayant reçu d’Épaphrodite ce qui venait de vous : un parfum à l’odeur agréable, un sacrifice acceptable, agréable à Dieu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou peut-être : « j’ai tout en main » ou « j’ai reçu paiement intégral ».'
    reason: Alternative lexicale reflétant la possible nuance commerciale de ἀπέχω.
lexical_decisions:
- source_word: ἀπέχω
  choice: j’ai tout reçu
  rationale: Dans ce contexte de soutien matériel, le verbe peut signifier avoir reçu quelque chose intégralement, avec une possible nuance de reçu ou de paiement acquitté. La formulation principale reste naturelle sans imposer cette nuance commerciale.
- source_word: πάντα
  choice: tout
  rationale: Le neutre pluriel a une portée globale et désigne l’ensemble de ce que les Philippiens ont envoyé.
- source_word: περισσεύω
  choice: je suis dans l’abondance
  rationale: Le verbe exprime une abondance qui dépasse le simple nécessaire. Cette tournure française conserve le contraste rhétorique avec l’idée d’être comblé.
- source_word: πεπλήρωμαι
  choice: je suis comblé
  rationale: Le parfait décrit l’état présent de Paul résultant du don reçu. « Je suis comblé » est concis, idiomatique et peut évoquer à la fois la pleine provision et la satisfaction.
- source_word: δεξάμενος
  choice: maintenant que j’ai reçu
  rationale: Cette proposition rend naturellement en français la circonstance qui explique comment Paul se trouve désormais comblé, tout en respectant la valeur résultative du contexte.
- source_word: παρὰ Ἐπαφροδίτου
  choice: d’Épaphrodite
  rationale: Épaphrodite est la source humaine immédiate auprès de qui Paul a reçu le don; la proposition suivante en attribue clairement l’origine aux Philippiens.
- source_word: τὰ παρ’ ὑμῶν
  choice: ce qui venait de vous
  rationale: La tournure désigne naturellement le don provenant des Philippiens sans ajouter explicitement un verbe comme « envoyer », absent du grec.
- source_word: ὀσμὴν εὐωδίας
  choice: un parfum de bonne odeur
  rationale: Cette formulation conserve l’expression sacrificielle biblique et sa résonance cultuelle, tout en restant compréhensible en français moderne.
- source_word: θυσίαν δεκτήν
  choice: un sacrifice agréé
  rationale: « Agréé » exprime que le sacrifice est reçu favorablement, sans anticiper entièrement la proposition suivante sur ce qui plaît à Dieu.
- source_word: εὐάρεστον τῷ θεῷ
  choice: qui plaît à Dieu
  rationale: La relative rattache naturellement l’adjectif au sacrifice et rend clairement l’évaluation favorable de Dieu.
theological_decisions:
- issue: L’image sacrificielle appliquée au don matériel des Philippiens
  choice: 'Conserver la suite métaphorique cultuelle : « un parfum de bonne odeur, un sacrifice agréé et qui plaît à Dieu »'
  alternative: Réduire l’image à une déclaration générale de reconnaissance, ou paraphraser par « une offrande que Dieu accepte volontiers »
  rationale: Paul présente intentionnellement le don comme un acte de culte au moyen du langage sacrificiel. La traduction maintient l’image et sa tension théologique sans affirmer que le don est un sacrifice littéral ni ajouter une doctrine particulière.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase garde l’accumulation rhétorique de Paul et le registre biblique de l’image sacrificielle, sans archaïsme excessif. Le marqueur [a] figure dans le texte principal.
