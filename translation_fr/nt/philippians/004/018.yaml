  terminology: « Épaphrodite », « sacrifice » et « Dieu » sont correctement employés. « Acceptable, agréable à Dieu » distingue θυσίαν δεκτήν de εὐάρεστον τῷ θεῷ sans les fusionner dans une seule relative.
