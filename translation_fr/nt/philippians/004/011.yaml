source:
  edition: SBLGNT
  text: οὐχ ὅτι καθ’ ὑστέρησιν λέγω, ἐγὼ γὰρ ἔμαθον ἐν οἷς εἰμι αὐτάρκης εἶναι·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/011.yaml
  text: Not that I am speaking from need[a], for I have learned to be content in whatever circumstances I am in.
translation:
  language: fr
  text: Ce n’est pas que je parle par manque[a], car j’ai appris à être satisfait quelles que soient les circonstances dans lesquelles je me trouve.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « dans le besoin ». Le grec peut aussi exprimer le fait de parler en raison d’une privation.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθ’ ὑστέρησιν
  choice: par manque
  rationale: La locution exprime le manque ou la privation comme motif de la parole. « Par manque » est naturel en français et indique que Paul ne parle pas parce qu’il serait personnellement dans le besoin.
- source_word: λέγω
  choice: je parle
  rationale: Le présent français rend directement le présent grec et convient à la déclaration immédiate de Paul.
- source_word: ἔμαθον
  choice: j’ai appris
  rationale: Le passé composé exprime naturellement un apprentissage accompli dont le résultat demeure pertinent au moment où Paul écrit.
- source_word: ἐν οἷς εἰμι
  choice: quelles que soient les circonstances dans lesquelles je me trouve
  rationale: La tournure relative grecque est idiomatique et renvoie à toute situation vécue; cette formulation française en explicite le sens sans le réduire à une localisation.
- source_word: αὐτάρκης
  choice: satisfait
  rationale: Dans ce contexte, le mot désigne le fait de se suffire dans sa situation, sans dépendre de l’abondance. « Satisfait » rend cette disposition en français courant, tandis que la nuance de suffisance en soi est signalée en note.
theological_decisions:
- issue: Nuance philosophique possible de αὐτάρκης
  choice: Rendu par « satisfait »
  alternative: « se suffire à soi-même » ou « autonome »
  rationale: Le contexte décrit une disposition apprise au milieu de circonstances diverses. « Satisfait » évite de faire de l’autonomie personnelle une affirmation théologique explicite, tout en conservant en note la portée lexicale possible du terme.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase conserve le contraste initial et l’insistance de ἐγώ par la structure « car j’ai appris », sans ajouter de pronom disloqué qui alourdirait le français.
