revisions:
- from: Enfin, frères et sœurs[a], tout ce qui est vrai, tout ce qui est honorable, tout ce qui est juste, tout ce qui est pur, tout ce qui est digne d’être aimé, tout ce qui mérite l’approbation — s’il y a quelque vertu et quelque sujet de louange —, que tout cela occupe vos pensées.
  to: Enfin, frères et sœurs[a], tout ce qui est vrai, tout ce qui est honorable, tout ce qui est juste, tout ce qui est pur, tout ce qui est digne d’être aimé, tout ce qui est digne d’éloge — s’il y a quelque excellence, s’il y a quelque chose digne de louange —, pensez à tout cela.
  rationale: La révision conserve la structure répétitive et l’adresse inclusive du projet, tout en améliorant la correspondance avec ἀρετή, ἔπαινος et λογίζεσθε. Elle maintient la distinction, présente dans le grec, entre ce qui est digne d’éloge (εὔφημα) et la mention finale de la louange (ἔπαινος).
