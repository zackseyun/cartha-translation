id: PHP.4.8
reference: Philippians 4:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Τὸ λοιπόν, ἀδελφοί, ὅσα ἐστὶν ἀληθῆ, ὅσα σεμνά, ὅσα δίκαια, ὅσα ἁγνά, ὅσα προσφιλῆ, ὅσα εὔφημα, εἴ τις ἀρετὴ καὶ εἴ τις ἔπαινος, ταῦτα λογίζεσθε·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/008.yaml
  text: Finally[a], brothers, whatever is true, whatever is honorable, whatever is just, whatever is pure, whatever is lovely, whatever is commendable—if there is any virtue and if there is any praise—think about these things.
translation:
  language: fr
  text: Enfin, frères et sœurs[a], tout ce qui est vrai, tout ce qui est honorable, tout ce qui est juste, tout ce qui est pur, tout ce qui est digne d’être aimé, tout ce qui est digne d’éloge — s’il y a quelque excellence, s’il y a quelque chose digne de louange —, pensez à tout cela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « frères » ; en grec, ce terme peut désigner ici l’ensemble de la communauté croyante, hommes et femmes.
    reason: cultural_note
lexical_decisions:
- source_word: Τὸ λοιπόν
  choice: Enfin
  rationale: Marque naturellement en français la transition vers une exhortation récapitulative, sans exiger que ce soit la toute dernière phrase de la lettre.
- source_word: ἀδελφοί
  choice: frères et sœurs[a]
  rationale: Dans cette adresse communautaire, le pluriel grec masculin peut inclure les croyantes aussi bien que les croyants. La formulation française explicite cette portée, tandis que la note signale la forme littérale.
- source_word: ὅσα
  choice: tout ce qui
  rationale: La reprise de « tout ce qui » rend le pluriel distributif grec et conserve le rythme cumulatif de l’énumération.
- source_word: ἀληθῆ
  choice: vrai
  rationale: Équivalent large et direct, approprié à une catégorie à la fois intellectuelle et morale.
- source_word: σεμνά
  choice: honorable
  rationale: Exprime ce qui possède une dignité morale et mérite le respect, dans un français actuel.
- source_word: δίκαια
  choice: juste
  rationale: Rend l’idée de ce qui est droit et équitable sans donner au terme une coloration théologique plus étroite que ne l’impose la liste.
- source_word: ἁγνά
  choice: pur
  rationale: Préserve les dimensions morale et intérieure du terme grec dans une formulation concise.
- source_word: προσφιλῆ
  choice: digne d’être aimé
  rationale: Rend ce qui suscite l’affection ou l’amour, tout en évitant le sens moderne parfois limité de « aimable » au simple caractère agréable d’une personne.
- source_word: εὔφημα
  choice: qui mérite l’approbation
  rationale: Communique ce dont on parle favorablement ou qui jouit d’une bonne considération, avec une expression française claire.
- source_word: εἴ τις ἀρετὴ
  choice: s’il y a quelque vertu
  rationale: Conserve la forme nominale compacte et la portée récapitulative d’ἀρετή, qui désigne la valeur ou l’excellence morale.
- source_word: εἴ τις ἔπαινος
  choice: quelque sujet de louange
  rationale: Fait de la louange ce que les qualités énumérées peuvent légitimement susciter, tout en maintenant le parallélisme de la phrase grecque.
- source_word: ταῦτα λογίζεσθε
  choice: que tout cela occupe vos pensées
  rationale: Exprime une attention mentale volontaire et soutenue dans un français naturel, plutôt qu’une réflexion seulement ponctuelle.
theological_decisions:
- issue: Portée de l’adresse ἀδελφοί
  choice: « frères et sœurs » dans le texte, avec une note sur la forme grecque
  alternative: « frères » seul dans le texte
  rationale: Le masculin pluriel grec sert couramment d’adresse à l’ensemble de la communauté. Expliciter cette portée évite qu’en français moderne l’exhortation paraisse réservée aux hommes, sans dissimuler la forme source.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « tout ce qui » conserve le rythme rhétorique du grec. Les tirets mettent en relief la proposition récapitulative sans en modifier le lien syntaxique avec l’exhortation finale.
