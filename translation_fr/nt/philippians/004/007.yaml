id: PHP.4.7
reference: Philippians 4:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἡ εἰρήνη τοῦ θεοῦ ἡ ὑπερέχουσα πάντα νοῦν φρουρήσει τὰς καρδίας ὑμῶν καὶ τὰ νοήματα ὑμῶν ἐν Χριστῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/007.yaml
  text: And the peace of God[a], which surpasses all understanding, will guard your hearts and your minds in Messiah Jesus.
translation:
  language: fr
  text: Et la paix de Dieu, qui dépasse toute intelligence, gardera vos cœurs et vos pensées en Jésus le Messie.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en Christ Jésus ».
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰρήνη
  choice: paix
  rationale: « Paix » est l’équivalent français naturel et précis, capable d’évoquer à la fois l’apaisement intérieur et le bien-être relationnel sans explicitation excessive.
- source_word: τοῦ θεοῦ
  choice: de Dieu
  rationale: Le génitif est rendu directement afin de préserver sa portée, qui peut inclure l’appartenance et la source sans imposer exclusivement l’une ou l’autre.
- source_word: ὑπερέχουσα
  choice: qui dépasse
  rationale: Cette formulation française courante exprime clairement l’idée de supériorité et de dépassement portée par le participe grec.
- source_word: πάντα νοῦν
  choice: toute intelligence
  rationale: L’expression désigne ce que la faculté humaine de comprendre peut saisir. « Toute intelligence » conserve la concision et une certaine ambiguïté du grec entre intelligence et compréhension.
- source_word: φρουρήσει
  choice: gardera
  rationale: Le verbe grec évoque une garde protectrice, possiblement militaire. « Gardera » en conserve la vigueur et reste naturel dans ce contexte.
- source_word: τὰς καρδίας ὑμῶν
  choice: vos cœurs
  rationale: « Cœurs » maintient l’image biblique du centre de la vie intérieure et affective.
- source_word: τὰ νοήματα ὑμῶν
  choice: vos pensées
  rationale: νοήματα désigne ici les pensées, les perceptions ou l’activité mentale. « Pensées » est plus directement lexical que « esprits » et forme un couple naturel avec « cœurs ».
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: en Jésus le Messie
  rationale: Cette formulation traduit Χριστός comme un titre tout en adoptant un ordre idiomatique en français. La préposition « en » préserve la formule paulinienne d’union et de sphère de vie.
theological_decisions:
- issue: Traduction de Χριστῷ dans la formule paulinienne ἐν Χριστῷ Ἰησοῦ
  choice: en Jésus le Messie
  alternative: en Christ Jésus
  rationale: Le choix principal rend explicitement le titre messianique de Χριστός plutôt que de le traiter comme un simple nom propre. L’ordre français « Jésus le Messie » évite la tournure peu naturelle « le Messie Jésus », tandis que la note conserve la formulation ecclésiale traditionnelle.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la structure solennelle du grec sans devenir artificielle; « gardera » maintient l’image protectrice, et « pensées » rend précisément la dimension cognitive.
