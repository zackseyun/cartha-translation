  text: ὅτι καὶ ἐν Θεσσαλονίκῃ καὶ ἅπαξ καὶ δὶς εἰς τὴν χρείαν μοι ἐπέμψατε.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/016.yaml
  text: because even in Thessalonica you sent for my need both once and twice[a].
translation:
  language: fr
  text: car, même à Thessalonique, vous m’avez envoyé de quoi répondre à mon besoin, et cela plus d’une fois[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « une fois et deux fois ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: car
  rationale: Introduit naturellement en français l’explication donnée par ce verset dans son contexte.
- source_word: καὶ ἐν Θεσσαλονίκῃ
  choice: même à Thessalonique
  rationale: Le premier καί a ici une valeur intensive bien rendue par « même », tandis que ἐν avec le nom de ville se traduit naturellement par « à ».
- source_word: ἅπαξ καὶ δὶς
  choice: plus d’une fois
  rationale: Cette expression idiomatique française rend le sens répété de la formule grecque sans l’artificialité de « une fois et deux fois ».
- source_word: εἰς τὴν χρείαν μοι
  choice: de quoi répondre à mon besoin
  rationale: Conserve le singulier de χρεία et exprime naturellement la destination de ce qui a été envoyé.
- source_word: ἐπέμψατε
  choice: vous m’avez envoyé
  rationale: Le verbe signifie « envoyer »; le pronom « m’ » explicite le destinataire déjà indiqué par μοι, sans préciser indûment la nature du don.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La formulation reste proche du grec tout en évitant un calque peu naturel; elle ne précise pas si l’envoi consistait en argent, biens ou autre forme d’aide.
