- from: 'Oui, je te le demande à toi aussi, fidèle compagnon[a] : viens en aide à ces femmes. Elles ont lutté à mes côtés pour l’Évangile[b], avec Clément et mes autres collaborateurs, dont les noms sont dans le livre de vie.'
  to: 'Oui, je te le demande à toi aussi, véritable compagnon[a] : viens en aide à ces femmes. Elles ont lutté à mes côtés pour l’Évangile[b], avec Clément ainsi qu’avec le reste de mes collaborateurs, dont les noms sont dans le livre de vie.'
  rationale: 'La révision est limitée à deux ajustements de précision : « véritable » rend plus directement γνήσιε, et la formulation relative à Clément conserve mieux la valeur additive de καί et la distinction entre Clément et le reste des collaborateurs. Les ambiguïtés textuelles et interprétatives demeurent signalées dans les notes.'
