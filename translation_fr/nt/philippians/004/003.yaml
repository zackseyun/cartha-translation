id: PHP.4.3
reference: Philippians 4:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ναὶ ἐρωτῶ καὶ σέ, ⸂γνήσιε σύζυγε⸃, συλλαμβάνου αὐταῖς, αἵτινες ἐν τῷ εὐαγγελίῳ συνήθλησάν μοι μετὰ καὶ Κλήμεντος καὶ τῶν λοιπῶν συνεργῶν μου, ὧν τὰ ὀνόματα ἐν βίβλῳ ζωῆς.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/003.yaml
  text: Yes[a], I ask you also, true companion, help these women, who contended alongside me in the gospel[b], together with Clement and the rest of my fellow workers, whose names are in the book of life.
translation:
  language: fr
  text: 'Oui, je te le demande à toi aussi, véritable compagnon[a] : viens en aide à ces femmes. Elles ont lutté à mes côtés pour l’Évangile[b], avec Clément ainsi qu’avec le reste de mes collaborateurs, dont les noms sont dans le livre de vie.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement « véritable compagnon de joug » ; certains comprennent le mot grec comme un nom propre : « Syzygue ».'
    reason: alternative_reading
  - marker: b
    text: Littéralement « dans l’Évangile » ; on peut aussi comprendre « dans l’œuvre de l’Évangile ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ναί
  choice: Oui
  rationale: Conserve l’affirmation qui ouvre directement et vivement l’appel de Paul.
- source_word: ἐρωτῶ
  choice: je te le demande
  rationale: Rend le sens courant du verbe et son ton personnel sans renforcer indûment l’exhortation.
- source_word: γνήσιε σύζυγε
  choice: fidèle compagnon
  rationale: Comprend σύζυγος comme un nom commun désignant un partenaire éprouvé. « Compagnon » est naturel en français moderne, tandis que la métaphore littérale et l’interprétation comme nom propre sont signalées en note.
- source_word: συλλαμβάνου αὐταῖς
  choice: viens en aide à ces femmes
  rationale: Exprime clairement l’appel à un soutien actif et rend explicite le féminin pluriel de αὐταῖς, qui renvoie dans le contexte à Évodie et Syntyche.
- source_word: συνήθλησάν μοι
  choice: ont lutté à mes côtés
  rationale: Préserve l’image de l’effort mené ensemble, issue du domaine de la lutte ou de la compétition, tout en restant idiomatique.
- source_word: ἐν τῷ εὐαγγελίῳ
  choice: pour l’Évangile
  rationale: Formulation française naturelle qui situe leur lutte au service de l’Évangile; la tournure grecque plus condensée demeure signalée en note.
- source_word: συνεργῶν
  choice: collaborateurs
  rationale: Terme courant et digne pour les personnes qui travaillent avec Paul, sans suggérer une fonction ecclésiale plus précise que le grec.
- source_word: βίβλῳ ζωῆς
  choice: livre de vie
  rationale: Expression biblique française établie qui conserve fidèlement l’image du texte grec.
theological_decisions:
- issue: Interprétation de γνήσιε σύζυγε
  choice: Adresse descriptive à un compagnon fidèle non nommé
  alternative: Le nom propre « Syzygue » ou la métaphore plus littérale « véritable compagnon de joug »
  rationale: L’adjectif γνήσιε s’accorde naturellement avec un vocatif descriptif. Comme σύζυγος peut aussi être compris comme un nom propre et garde une image liée au joug, ces possibilités sont conservées en note plutôt que tranchées silencieusement.
- issue: Nuance de ἐν τῷ εὐαγγελίῳ
  choice: « pour l’Évangile », au sens d’un effort consacré à sa cause
  alternative: « dans l’Évangile » ou « dans l’œuvre de l’Évangile »
  rationale: La préposition ἐν permet ici une expression condensée dont le rapport exact à l’Évangile n’est pas entièrement explicité. Le texte principal privilégie une formulation française naturelle, et la note conserve les autres nuances possibles.
translation_notes:
  register: Français international moderne, clair et digne. La phrase grecque longue est divisée après « ces femmes » pour améliorer la lisibilité sans modifier les rapports logiques. « L’Évangile » prend une majuscule selon l’usage éditorial retenu pour le message proclamé.
