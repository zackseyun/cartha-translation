lexical_decisions:
- source_word: πλὴν
  choice: Pourtant
  rationale: Marque une transition légèrement contrastive avec ce qui précède, sans diminuer l’éloge adressé aux Philippiens.
- source_word: καλῶς ἐποιήσατε
  choice: vous avez bien fait
  rationale: Expression française naturelle qui rend directement l’évaluation positive portée par l’adverbe et le verbe à l’aoriste.
- source_word: συγκοινωνήσαντές
  choice: de prendre part avec moi
  rationale: Conserve à la fois l’idée de participation active et la dimension relationnelle exprimée par le préfixe συν- et le pronom μου.
- source_word: τῇ θλίψει
  choice: à ma détresse
  rationale: Rend la situation pénible ou éprouvante désignée par θλῖψις; le possessif français exprime naturellement le lien de Paul avec cette détresse.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. « Prendre part avec moi à ma détresse » garde la légère redondance relationnelle du grec et son ambiguïté entre partager l’épreuve de Paul et lui apporter un soutien concret dans cette épreuve.
