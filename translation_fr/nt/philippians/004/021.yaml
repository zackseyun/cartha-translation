  text: Ἀσπάσασθε πάντα ἅγιον ἐν Χριστῷ Ἰησοῦ. ἀσπάζονται ὑμᾶς οἱ σὺν ἐμοὶ ἀδελφοί.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/021.yaml
  text: Greet every saint in Messiah Jesus[b][a]. The brothers with me greet you.
translation:
  language: fr
  text: Saluez chaque saint dans le Messie Jésus. Les frères qui sont avec moi vous saluent.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dans ce contexte, « frères » peut désigner plus largement les croyants qui sont avec Paul, y compris les femmes.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀσπάσασθε
  choice: Saluez
  rationale: L’impératif épistolaire demande de transmettre une salutation; « Saluez » est direct, naturel et concis.
- source_word: πάντα ἅγιον
  choice: chacun des saints
  rationale: Le singulier avec πᾶς a ici une valeur distributive. « Chacun des saints » l’exprime clairement en français tout en conservant le terme biblique « saints ».
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: dans le Messie Jésus
  rationale: La préposition ἐν est rendue sans explicitation, et Χριστός est traduit comme le titre « Messie », conformément à sa valeur lexicale.
- source_word: ἀσπάζονται
  choice: saluent
  rationale: Dans la conclusion d’une lettre, le présent moyen grec se rend naturellement par l’actif français « saluent ».
- source_word: οἱ σὺν ἐμοὶ ἀδελφοί
  choice: Les frères qui sont avec moi
  rationale: Cette formulation naturelle conserve le masculin pluriel ἀδελφοί sans exclure par interprétation la possibilité d’un groupe plus large, signalée en note.
theological_decisions: []
translation_notes:
  register: Français international moderne, simple et digne. La formulation conserve la structure de la salutation épistolaire et l’expression relationnelle « dans le Messie Jésus » sans en résoudre davantage le sens.
