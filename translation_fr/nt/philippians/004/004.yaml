id: PHP.4.4
reference: Philippians 4:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Χαίρετε ἐν κυρίῳ πάντοτε· πάλιν ἐρῶ, χαίρετε.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/004.yaml
  text: Rejoice in the Lord always[a]; again I will say[b], rejoice.
translation:
  language: fr
  text: 'Réjouissez-vous toujours dans le Seigneur[a] ; je le dirai encore : réjouissez-vous !'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Soyez toujours dans la joie dans le Seigneur. »'
    reason: lexical_alternative
lexical_decisions:
- source_word: Χαίρετε
  choice: Réjouissez-vous
  rationale: L’impératif présent actif à la deuxième personne du pluriel appelle la communauté à se réjouir. « Réjouissez-vous » conserve naturellement en français la force exhortative et le sens de χαίρω.
- source_word: ἐν
  choice: dans
  rationale: 'La préposition exprime ici le plus naturellement la sphère ou la relation : la joie se vit dans la relation au Seigneur. « Dans » préserve cette ampleur sans imposer une nuance uniquement causale ou instrumentale.'
- source_word: κυρίῳ
  choice: le Seigneur
  rationale: Dans cet emploi paulinien, κύριος désigne le Christ. « Le Seigneur » est l’équivalent français établi, digne et théologiquement ouvert.
- source_word: πάντοτε
  choice: toujours
  rationale: « Toujours » rend directement et naturellement la portée continue de l’adverbe.
- source_word: πάλιν
  choice: encore
  rationale: « Encore » marque de façon idiomatique la répétition emphatique annoncée par Paul.
- source_word: ἐρῶ
  choice: je le dirai
  rationale: Le futur de λέγω est maintenu. Le pronom « le » rend la tournure naturelle en français en renvoyant à l’exhortation qui va être répétée.
- source_word: χαίρετε
  choice: réjouissez-vous
  rationale: La reprise conserve le même impératif afin de préserver l’insistance rhétorique du grec.
theological_decisions:
- issue: Sens de « dans le Seigneur »
  choice: 'Conserver une lecture de sphère et de relation : les croyants sont appelés à se réjouir dans leur relation au Seigneur.'
  alternative: Comprendre l’expression au sens instrumental (« par la force du Seigneur ») ou causal (« à cause du Seigneur »).
  rationale: L’expression ἐν κυρίῳ chez Paul indique couramment une sphère ou une situation relationnelle. La traduction « dans le Seigneur » maintient cette richesse et l’ambiguïté possible sans la résoudre artificiellement.
translation_notes:
  register: Français international moderne, naturel et digne. L’ordre des mots privilégie la fluidité française tout en conservant « dans le Seigneur » et le futur « je le dirai ». Le point d’exclamation final restitue la vigueur de l’impératif répété sans ajouter de contenu.
