reference: Philippians 4:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὐχ ὅτι ἐπιζητῶ τὸ δόμα, ἀλλὰ ἐπιζητῶ τὸν καρπὸν τὸν πλεονάζοντα εἰς λόγον ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/017.yaml
  text: Not that I seek the gift[a], but I seek the fruit that increases to your account.
translation:
  language: fr
  text: Ce n’est pas que je recherche le don, mais je recherche le fruit qui abonde à votre crédit[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le fruit qui abonde pour votre compte ».'
    reason: Variante de formulation pour εἰς λόγον ὑμῶν, qui conserve l’image comptable sans en préciser davantage la portée.
lexical_decisions:
- source_word: ἐπιζητῶ
  choice: je recherche
  rationale: Le verbe exprime une recherche ou un désir actif. « Je recherche » conserve sa répétition et le contraste rhétorique du grec.
- source_word: δόμα
  choice: le don
  rationale: Le terme désigne ici ce que les Philippiens ont donné à Paul. « Le don » est direct et ne précise pas davantage la nature de leur aide.
- source_word: καρπὸν
  choice: le fruit
  rationale: « Le fruit » préserve la métaphore du résultat produit, sans la réduire à un simple bénéfice financier.
- source_word: πλεονάζοντα
  choice: qui s’accroît
  rationale: Le participe décrit quelque chose qui augmente ou abonde. « Qui s’accroît » rend ce mouvement de croissance et s’intègre à l’image comptable qui suit.
- source_word: εἰς λόγον ὑμῶν
  choice: à votre compte
  rationale: Dans ce contexte, λόγος relève du langage des comptes. Cette formulation maintient la tension voulue entre l’image du fruit et celle d’un crédit porté au compte des Philippiens.
- source_word: οὐχ ὅτι ... ἀλλὰ
  choice: Ce n’est pas que… mais
  rationale: Cette construction française naturelle conserve la clarification et l’opposition formulées par Paul.
theological_decisions:
- issue: Nature du « fruit » porté au compte des Philippiens
  choice: Conserver les métaphores sans identifier explicitement le fruit à une récompense précise
  alternative: Traduire par « la récompense » ou « le bénéfice spirituel »
  rationale: Le grec ne définit pas explicitement ce fruit. Une explicitation trancherait une ambiguïté réelle et risquerait d’introduire une interprétation théologique particulière.
translation_notes:
  register: Français international actuel, clair et digne. La répétition de « je recherche » reproduit l’insistance du texte grec. L’association volontairement inhabituelle du fruit et du compte est maintenue afin de préserver le croisement des métaphores agricole et comptable.
