source:
  edition: SBLGNT
  text: Εὐοδίαν παρακαλῶ καὶ Συντύχην παρακαλῶ τὸ αὐτὸ φρονεῖν ἐν κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/002.yaml
  text: I urge Euodia[a], and I urge Syntyche, to think the same way in the Lord.
translation:
  language: fr
  text: J’exhorte Évodie, et j’exhorte Syntyche, à avoir une même pensée dans le Seigneur.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à être d’un même avis dans le Seigneur » ; peut-être aussi « à s’accorder dans le Seigneur ».
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐοδίαν
  choice: Évodie
  rationale: Forme française traditionnelle et reconnaissable du nom propre grec Εὐοδία, sans en traduire le sens étymologique.
- source_word: παρακαλῶ
  choice: j’exhorte
  rationale: Dans ce contexte, « j’exhorte » exprime l’appel personnel et pressant de Paul. La répétition du verbe grec est conservée pour adresser également et distinctement chacune des deux femmes.
- source_word: Συντύχην
  choice: Syntyche
  rationale: Translittération française usuelle du nom propre grec Συντύχη, sans traduction de son sens étymologique.
- source_word: τὸ αὐτὸ φρονεῖν
  choice: avoir une même pensée
  rationale: Cette formulation conserve à la fois l’idée de similitude portée par τὸ αὐτό et la dimension mentale et dispositionnelle de φρονεῖν. Elle évite de réduire l’expression au simple fait d’être d’accord sur un point.
- source_word: ἐν κυρίῳ
  choice: dans le Seigneur
  rationale: Rendu formel et idiomatique qui maintient l’ancrage de l’unité demandée dans la relation au Seigneur.
theological_decisions:
- issue: Portée de τὸ αὐτὸ φρονεῖν
  choice: avoir une même pensée
  alternative: être du même avis ; s’accorder
  rationale: Le grec peut viser une disposition commune aussi bien qu’un accord. Le texte principal préserve sa portée mentale et relationnelle plus large, tandis que la note signale les formulations plus directement centrées sur l’accord.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition rhétorique de « j’exhorte » est maintenue. « Une même pensée » reste naturel tout en préservant la nuance dispositionnelle et l’ambiguïté du grec.
