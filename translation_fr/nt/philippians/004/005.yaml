source:
  edition: SBLGNT
  text: τὸ ἐπιεικὲς ὑμῶν γνωσθήτω πᾶσιν ἀνθρώποις. ὁ κύριος ἐγγύς·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/005.yaml
  text: Let your graciousness be known to all people[b][a]. The Lord is near.
translation:
  language: fr
  text: Que votre bienveillance soit connue de tous[a]. Le Seigneur est proche[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « douceur », « indulgence » ou « esprit conciliant ».
    reason: lexical_alternative
  - marker: b
    text: « Le Seigneur est proche » peut signifier que le Seigneur est présent, tout près, que sa venue est proche, ou les deux.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπιεικές
  choice: bienveillance
  rationale: Dans ce contexte, le terme désigne une conduite prévenante, clémente et disposée à ne pas exiger tous ses droits. « Bienveillance » exprime naturellement en français cette qualité relationnelle plus large que la seule douceur de tempérament, tandis que la note conserve d’autres nuances possibles.
- source_word: γνωσθήτω
  choice: soit connue
  rationale: Le passif impératif est rendu directement par « soit connue », formulation claire qui invite à rendre cette qualité manifeste aux autres.
- source_word: πᾶσιν ἀνθρώποις
  choice: de tous
  rationale: Cette tournure française concise et inclusive rend la portée universelle de l’expression grecque sans introduire de désignation masculine.
- source_word: κύριος
  choice: Seigneur
  rationale: « Seigneur » est le titre français habituel et conserve ici toute sa portée théologique.
- source_word: ἐγγύς
  choice: proche
  rationale: « Proche » préserve l’ambiguïté féconde du grec entre la proximité présente du Seigneur et la proximité temporelle de sa venue.
theological_decisions:
- issue: Sens de ὁ κύριος ἐγγύς
  choice: Le Seigneur est proche
  alternative: Le Seigneur est tout près ; la venue du Seigneur est proche
  rationale: Le grec peut évoquer la présence immédiate du Seigneur, l’imminence de sa venue, ou les deux. Le texte principal maintient volontairement cette tension.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation reste concise et mémorisable, tout en évitant de réduire ἐπιεικές à une simple douceur de caractère ou ἐγγύς à un seul sens spatial ou temporel.
