reference: Philippians 4:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οἶδα καὶ ταπεινοῦσθαι, οἶδα καὶ περισσεύειν· ἐν παντὶ καὶ ἐν πᾶσιν μεμύημαι, καὶ χορτάζεσθαι καὶ πεινᾶν, καὶ περισσεύειν καὶ ὑστερεῖσθαι·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/012.yaml
  text: 'I know how to be brought low, and I know how to abound. In every circumstance and in all things I have learned the secret: both to be well fed and to be hungry, both to abound and to be in need.'
translation:
  language: fr
  text: 'Je sais vivre dans l’abaissement et je sais vivre dans l’abondance. En toute circonstance et en toute situation, j’ai appris le secret[a] : aussi bien à être rassasié qu’à avoir faim, aussi bien à vivre dans l’abondance qu’à être dans le besoin.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « j’ai été initié ». Paul emploie ici, de façon imagée, le langage de l’initiation pour parler d’un secret appris.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἶδα
  choice: je sais vivre
  rationale: Avec les infinitifs décrivant des conditions de vie, cette formulation exprime naturellement un savoir pratique acquis par l’expérience.
- source_word: ταπεινοῦσθαι
  choice: vivre dans l’abaissement
  rationale: Cette traduction conserve l’idée d’être placé dans une condition humble ou diminuée, sans réduire le terme à une attitude intérieure.
- source_word: περισσεύειν
  choice: vivre dans l’abondance
  rationale: Elle exprime le fait d’avoir plus qu’il ne faut et maintient le contraste avec le besoin, sans limiter le propos à la prospérité financière.
- source_word: ἐν παντὶ καὶ ἐν πᾶσιν
  choice: En toute circonstance et à tous égards
  rationale: La formulation garde les deux expressions distinctes et leur ampleur rhétorique tout en restant naturelle en français.
- source_word: μεμύημαι
  choice: j’ai appris le secret
  rationale: Le parfait indique un apprentissage acquis dont l’effet demeure. L’expression transmet la métaphore initiatique dans un français compréhensible, tandis que la note en précise la forme littérale.
- source_word: χορτάζεσθαι
  choice: être rassasié
  rationale: Face à « avoir faim », le terme désigne clairement le fait d’avoir mangé à satiété.
- source_word: πεινᾶν
  choice: avoir faim
  rationale: Expression française simple et directe qui maintient le contraste alimentaire.
- source_word: ὑστερεῖσθαι
  choice: être dans le besoin
  rationale: Cette formulation rend la privation de manière claire et assez large, sans la restreindre au manque d’argent.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme des trois couples grecs est conservé autant que le permet un français naturel; « comme » rend ici la coordination répétée des situations opposées sans suggérer une comparaison de degré.
