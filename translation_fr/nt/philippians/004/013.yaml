  text: I am able to do all things through the one who strengthens me[a][b].
translation:
  language: fr
  text: Je peux tout grâce à celui qui me fortifie[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Je suis capable de tout ». Dans le contexte, Paul parle de sa capacité à traverser toutes sortes de situations.'
    reason: lexical_alternative
  - marker: b
    text: Le grec dit « celui qui me fortifie » et ne nomme pas explicitement le Christ dans ce verset, bien que le contexte oriente vers lui.
    reason: alternative_reading
lexical_decisions:
- source_word: πάντα
  choice: à toute situation
  rationale: Le neutre pluriel peut désigner « toutes choses » de manière générale. Dans le contexte immédiat, Paul évoque des situations très diverses, notamment l’abondance et le manque ; cette formulation rend ce sens contextuel sans suggérer une capacité illimitée à accomplir n’importe quoi.
- source_word: ἰσχύω
  choice: je peux faire face
  rationale: Le verbe exprime la force ou la capacité. « Je peux faire face » restitue ici une capacité rendue possible par la force reçue et s’accorde naturellement avec les circonstances mentionnées au verset précédent.
- source_word: ἐν
  choice: grâce à
  rationale: Bien que la préposition signifie souvent « en », elle peut ici indiquer la sphère ou le moyen de cette capacité. « Grâce à » exprime naturellement en français que cette force dépend de la personne évoquée.
- source_word: τῷ ἐνδυναμοῦντί με
  choice: celui qui me donne de la force
  rationale: Le participe substantivé désigne littéralement « celui qui me fortifie » ou « celui qui me rend fort ». La formulation retenue conserve son caractère verbal et continu sans ajouter un nom absent du texte grec.
theological_decisions:
- issue: Identité implicite de « celui qui me donne de la force »
  choice: Ne pas ajouter « Christ » ou « Messie » dans le texte principal.
  alternative: « grâce au Christ qui me donne de la force »
  rationale: Le contexte permet d’identifier cette personne au Christ, mais le texte grec de ce verset ne le nomme pas explicitement. La traduction conserve donc l’expression implicite du grec, tandis qu’une note signale le référent contextuel probable.
- issue: Portée de la capacité affirmée
  choice: Rendre πάντα selon les diverses situations évoquées dans le contexte.
  alternative: « Je peux tout » ou « Je suis capable de toutes choses »
  rationale: La formulation absolue est lexicalement possible, mais le contexte porte sur la capacité à vivre dans l’abondance comme dans le besoin. « Faire face à toute situation » évite de transformer cette affirmation en promesse de pouvoir accomplir sans limite n’importe quelle action.
translation_notes:
  register: Français international moderne, naturel et digne. « Faire face à toute situation » privilégie le sens contextuel de πάντα ἰσχύω, tandis que la note conserve la formulation plus large du grec. « Celui qui me donne de la force » évite à la fois une tournure archaïque et l’ajout explicite de « Christ ».
