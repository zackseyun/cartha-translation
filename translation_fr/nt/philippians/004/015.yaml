revisions:
- from: 'Vous le savez vous-mêmes, vous aussi, Philippiens : au début de l’Évangile, lorsque j’ai quitté la Macédoine, aucune Église ne s’est associée à moi dans un compte de dons et de recettes[a], si ce n’est vous seuls.'
  to: 'Vous le savez aussi, vous-mêmes, Philippiens : au début de l’Évangile, lorsque j’ai quitté la Macédoine, aucune Église ne s’est associée à moi pour ce qui est de donner et de recevoir[a], si ce n’est vous seuls.'
  rationale: La révision remplace une image comptable rendue de manière trop concrète et maladroite en français par une expression idiomatique qui préserve le parallélisme et la portée relationnelle de δόσις καὶ λήμψις. La note maintient explicitement l’alternative comptable. Les autres choix, notamment « au début de l’Évangile », demeurent suffisamment ouverts pour ne pas surinterpréter le grec.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T11:44:30Z'
review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est fidèlement rendu : Paul rappelle aux Philippiens leur soutien exclusif après son départ de Macédoine. Cependant, « dans un compte de dons et de recettes » applique de façon trop littérale et peu idiomatique l’image comptable de εἰς λόγον δόσεως καὶ λήμψεως dans le texte principal. L’expression grecque peut garder une nuance de compte, mais désigne naturellement la sphère ou la relation du donner et du recevoir.'
  naturalness: La phrase est globalement claire et de registre approprié. « S’associer à moi dans un compte » n’est toutefois pas naturel en français moderne. « Pour ce qui est de donner et de recevoir » restitue clairement la relation de partenariat sans effacer la nuance comptable, qui peut être maintenue en note.
  terminology: '« Évangile », « Macédoine », « Église » et « Philippiens » conviennent. « Donner et recevoir » est préférable à « dons et recettes » dans le corps du texte : le premier préserve le parallélisme verbal/conceptuel grec et évite de réduire λῆμψις à des recettes comptables.'
  issues:
  - severity: medium
    issue: Formulation française peu idiomatique de l’expression comptable
    rationale: « Aucune Église ne s’est associée à moi dans un compte de dons et de recettes » est grammaticalement compréhensible, mais ne correspond pas à une collocation française naturelle et peut faire croire à un compte bancaire commun. Le grec conserve une image de compte tout en visant le donner et recevoir dans le partenariat de soutien.
  - severity: low
    issue: Rendu de l’emphase de καὶ ὑμεῖς
    rationale: « Vous le savez vous-mêmes, vous aussi » est possible mais lourd. Le déplacement en « Vous le savez aussi, vous-mêmes » est plus fluide tout en gardant l’addition et l’insistance.
  revised_text: 'Vous le savez aussi, vous-mêmes, Philippiens : au début de l’Évangile, lorsque j’ai quitté la Macédoine, aucune Église ne s’est associée à moi pour ce qui est de donner et de recevoir[a], si ce n’est vous seuls.'
  revised_footnotes:
