id: PHP.4.15
reference: Philippians 4:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Οἴδατε δὲ καὶ ὑμεῖς, Φιλιππήσιοι, ὅτι ἐν ἀρχῇ τοῦ εὐαγγελίου, ὅτε ἐξῆλθον ἀπὸ Μακεδονίας, οὐδεμία μοι ἐκκλησία ἐκοινώνησεν εἰς λόγον δόσεως καὶ λήμψεως εἰ μὴ ὑμεῖς μόνοι,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/015.yaml
  text: And you yourselves also know[a], Philippians, that at the beginning of the gospel, when I departed from Macedonia, no church shared with me in the matter of giving and receiving except you alone.
translation:
  language: fr
  text: 'Vous le savez aussi, vous-mêmes, Philippiens : au début de l’Évangile, lorsque j’ai quitté la Macédoine, aucune Église ne s’est associée à moi pour ce qui est de donner et de recevoir[a], si ce n’est vous seuls.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans un compte de dons et de recettes ».
    reason: Conserve la possible nuance comptable de λόγος, sans imposer dans le texte principal une formulation française peu naturelle.
lexical_decisions:
- source_word: Οἴδατε
  choice: vous le savez
  rationale: Le présent français rend naturellement la valeur stative de οἶδα dans ce contexte.
- source_word: δὲ καὶ ὑμεῖς
  choice: vous le savez vous-mêmes, vous aussi
  rationale: Cette formulation conserve à la fois la progression discrète marquée par δέ, la valeur additive de καί et l’insistance portée par le pronom ὑμεῖς.
- source_word: Φιλιππήσιοι
  choice: Philippiens
  rationale: Gentilé français traditionnel et intelligible, employé ici comme apostrophe directe.
- source_word: ἐν ἀρχῇ τοῦ εὐαγγελίου
  choice: au début de l’Évangile
  rationale: La formulation reste proche du grec et désigne vraisemblablement la première phase de l’œuvre évangélique de Paul auprès d’eux, sans expliciter cette interprétation dans le texte.
- source_word: ἐξῆλθον ἀπὸ Μακεδονίας
  choice: j’ai quitté la Macédoine
  rationale: Expression française naturelle qui rend clairement l’événement ponctuel exprimé par l’aoriste.
- source_word: οὐδεμία ... ἐκκλησία
  choice: aucune Église
  rationale: Rendu direct de la négation absolue appliquée à ἐκκλησία; la majuscule distingue ici la communauté chrétienne locale du bâtiment.
- source_word: ἐκοινώνησεν
  choice: ne s’est associée à moi
  rationale: Le verbe exprime une participation concrète ou un partenariat; la tournure française convient au contexte financier sans réduire le terme à une simple transaction.
- source_word: εἰς λόγον δόσεως καὶ λήμψεως
  choice: dans un compte de dons et de recettes
  rationale: λόγος peut désigner ici un compte, tandis que δόσις et λῆμψις évoquent les deux côtés d’une relation financière. Le choix conserve l’image comptable probable et la note signale une formulation plus générale.
- source_word: εἰ μὴ ὑμεῖς μόνοι
  choice: si ce n’est vous seuls
  rationale: Cette tournure française conserve l’exception et l’insistance exclusive de μόνοι.
theological_decisions:
- issue: Portée de « au début de l’Évangile »
  choice: Conserver la formulation sans préciser qu’il s’agit du début de la mission de Paul en Macédoine.
  alternative: « au début de mon annonce de l’Évangile »
  rationale: Le contexte favorise cette explication, mais le grec ne contient ni possessif ni terme explicite pour « annonce »; le texte principal préserve donc sa formulation ouverte.
- issue: Nature de la participation des Philippiens
  choice: Exprimer une association concrète dans un cadre financier sans la qualifier davantage.
  alternative: « aucune Église ne m’a soutenu financièrement »
  rationale: Le soutien matériel est clair dans le contexte, mais cette paraphrase effacerait l’image relationnelle de κοινωνέω et l’expression comptable qui suit.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe conserve l’apostrophe « Philippiens » et l’insistance du grec, tandis que « j’ai quitté » évite un registre inutilement archaïque. L’image comptable est maintenue dans le texte principal parce qu’elle est probablement intentionnelle dans le contexte du soutien matériel.
