  - severity: low
    issue: Référent et sens de « Vous l’aviez bien à cœur » insuffisamment explicites
    rationale: Le pronom « l’ » peut renvoyer de façon imprécise à la sollicitude ou à une situation. « Vous pensiez déjà à moi » rend explicitement la reprise de φρονέω et la précision bienveillante de Paul.
