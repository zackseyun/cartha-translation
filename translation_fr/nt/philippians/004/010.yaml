id: PHP.4.10
reference: Philippians 4:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἐχάρην δὲ ἐν κυρίῳ μεγάλως ὅτι ἤδη ποτὲ ἀνεθάλετε τὸ ὑπὲρ ἐμοῦ φρονεῖν, ἐφ’ ᾧ καὶ ἐφρονεῖτε ἠκαιρεῖσθε δέ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/010.yaml
  text: I rejoiced greatly in the Lord that now at last you have revived your concern for me[a]; indeed, you were concerned[b], but you lacked opportunity.
translation:
  language: fr
  text: Je me suis beaucoup réjoui dans le Seigneur parce qu’enfin vous avez renouvelé votre sollicitude pour moi[a] ; car vous pensiez déjà à moi[b], mais vous manquiez d’occasion.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « vous avez de nouveau fleuri quant au fait de penser à moi » ; le verbe évoque une plante qui fleurit de nouveau.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « vous aviez cela à cœur » ; le verbe grec peut signifier penser à quelqu’un, l’avoir à cœur ou se soucier de lui.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐχάρην
  choice: Je me suis réjoui
  rationale: Le passé composé rend naturellement en français l’aoriste de χαίρω et conserve l’idée personnelle d’une joie éprouvée par Paul.
- source_word: ἐν κυρίῳ
  choice: dans le Seigneur
  rationale: Cette expression paulinienne habituelle garde ouverte la nuance de sphère ou de fondement de la joie.
- source_word: μεγάλως
  choice: beaucoup
  rationale: « Beaucoup » est une formulation française naturelle qui maintient l’intensité de la joie.
- source_word: ἤδη ποτὲ
  choice: enfin
  rationale: « Enfin » exprime la reprise après un certain temps sans nécessairement faire entendre un reproche.
- source_word: ἀνεθάλετε
  choice: vous avez fait refleurir
  rationale: Ce choix conserve l’image végétale du verbe, qui évoque le fait de fleurir de nouveau, tout en restant intelligible dans le contexte.
- source_word: τὸ ὑπὲρ ἐμοῦ φρονεῖν
  choice: votre sollicitude pour moi
  rationale: « Sollicitude » exprime une pensée attentive et bienveillante qui peut se traduire concrètement en aide, plutôt qu’une simple activité intellectuelle.
- source_word: ἐφ’ ᾧ καὶ ἐφρονεῖτε
  choice: Vous l’aviez bien à cœur
  rationale: La formulation idiomatique affirme que leur disposition attentive existait déjà, tout en rendant la répétition de φρονέω de manière naturelle.
- source_word: ἠκαιρεῖσθε
  choice: l’occasion vous manquait
  rationale: Cette tournure indique l’absence d’une occasion favorable, et non un manque de volonté ou d’intérêt.
theological_decisions:
- issue: Nature de la joie « dans le Seigneur »
  choice: Conserver littéralement « dans le Seigneur »
  alternative: « grâce au Seigneur » ou « à cause du Seigneur »
  rationale: Le grec peut évoquer la sphère, l’union ou le fondement de la joie. La formulation retenue préserve cette densité sans trancher.
- issue: Attitude antérieure des Philippiens
  choice: Affirmer qu’ils avaient déjà Paul à cœur mais manquaient d’occasion
  alternative: Laisser entendre que leur intérêt avait cessé puis repris
  rationale: La dernière proposition explicite que l’obstacle concernait l’occasion disponible, non leur disposition intérieure; cela évite d’introduire un reproche absent du texte.
translation_notes:
  register: Français moderne, digne et accessible. « Faire refleurir » conserve l’image expressive du grec; « sollicitude » est légèrement soutenu, mais précis et courant dans un registre biblique contemporain. La seconde phrase emploie une tournure plus idiomatique afin d’éviter une répétition lourde tout en préservant le lien lexical signalé en note.
