  rationale: La révision supprime la légère causalité ajoutée par « faire refleurir », conserve la métaphore du grec dans la note, et clarifie la proposition explicative finale. Elle maintient l’affirmation que l’absence d’action antérieure résultait d’un manque d’occasion, non d’un manque de sollicitude.
