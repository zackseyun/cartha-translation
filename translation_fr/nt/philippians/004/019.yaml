id: PHP.4.19
reference: Philippians 4:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ δὲ θεός μου πληρώσει πᾶσαν χρείαν ὑμῶν κατὰ ⸂τὸ πλοῦτος⸃ αὐτοῦ ἐν δόξῃ ἐν Χριστῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/019.yaml
  text: And my God will supply every need of yours according to his riches in glory in Messiah Jesus[a][b][c][d].
translation:
  language: fr
  text: Et mon Dieu pourvoira à chacun de vos besoins selon sa richesse, dans la gloire, en Jésus le Messie[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « en Jésus-Christ ».'
    reason: lexical_alternative
  - marker: b
    text: « Selon sa richesse » indique la mesure de ce que Dieu donne, et non seulement la source d'où cela provient.
    reason: alternative_reading
  - marker: c
    text: '« Dans la gloire » peut aussi être compris comme « glorieusement »; la construction grecque permet également de rattacher plus étroitement les mots : « dans la gloire en Jésus le Messie ».'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ δὲ θεός μου
  choice: Et mon Dieu
  rationale: δέ assure ici une liaison légère avec le contexte; « Et » évite de créer un contraste trop marqué tout en conservant la note personnelle de « mon Dieu ».
- source_word: πληρώσει
  choice: pourvoira à
  rationale: Dans ce contexte, πληρόω exprime l'action de combler ce qui manque. « Pourvoir à » est idiomatique en français et convient naturellement avec « besoins ».
- source_word: πᾶσαν χρείαν ὑμῶν
  choice: chacun de vos besoins
  rationale: Cette formulation naturelle restitue la portée distributive de πᾶσαν et le sens de nécessité porté par χρεία.
- source_word: κατὰ τὸ πλοῦτος αὐτοῦ
  choice: selon sa richesse
  rationale: κατά avec l'accusatif indique ici la mesure ou la norme de la provision, et non simplement sa source. Le singulier « richesse » suit le nom grec singulier πλοῦτος.
- source_word: ἐν δόξῃ
  choice: dans la gloire
  rationale: La traduction formelle conserve l'ambiguïté du rapport syntaxique et sémantique de la locution grecque, plutôt que de la réduire à l'adverbe interprétatif « glorieusement ».
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: en Jésus le Messie
  rationale: Χριστός est ici un titre christologique. En français, « Jésus le Messie » exprime naturellement ce titre et évite la tournure peu idiomatique « en Messie Jésus ».
theological_decisions:
- issue: Traduction du titre Χριστός dans ἐν Χριστῷ Ἰησοῦ
  choice: en Jésus le Messie
  alternative: en Jésus-Christ
  rationale: Le texte principal traduit le sens du titre Χριστός, tandis que la forme française traditionnelle est conservée en note. Aucun contenu confessionnel supplémentaire n'est introduit.
- issue: Rapport de ἐν δόξῃ avec les expressions voisines
  choice: dans la gloire, en Jésus le Messie
  alternative: glorieusement, en Jésus le Messie; ou « dans la gloire en Jésus le Messie »
  rationale: La ponctuation rend la phrase lisible sans prétendre résoudre définitivement l'attachement syntaxique des deux groupes en ἐν. Les possibilités principales sont signalées en note.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation évite une promesse explicitement limitée aux seuls besoins matériels et conserve les ambiguïtés réelles des deux groupes prépositionnels grecs. Les marqueurs de notes figurent tous dans le texte principal.
