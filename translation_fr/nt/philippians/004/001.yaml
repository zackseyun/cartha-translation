id: PHP.4.1
reference: Philippians 4:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὥστε, ἀδελφοί μου ἀγαπητοὶ καὶ ἐπιπόθητοι, χαρὰ καὶ στέφανός μου, οὕτως στήκετε ἐν κυρίῳ, ἀγαπητοί.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/001.yaml
  text: So then[a], my beloved and longed-for brothers, my joy and crown, stand firm in the Lord in this way[b], beloved.
translation:
  language: fr
  text: Ainsi donc, mes frères[a] bien-aimés qui me manquez tant, vous qui êtes ma joie et ma couronne[b], restez ainsi fermes dans le Seigneur, bien-aimés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Frères » traduit la forme masculine grecque; dans ce contexte, Paul s’adresse aux croyants de l’assemblée, et non aux seuls hommes.
    reason: cultural_note
  - marker: b
    text: Ou « couronne du vainqueur »; le terme grec désigne une couronne de feuillage remise au gagnant.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: Ainsi donc
  rationale: Marque naturellement en français la conclusion tirée de l’exhortation précédente, tout en conservant la valeur inférentielle du grec.
- source_word: ἀδελφοί
  choice: frères
  rationale: Reproduit la forme masculine du vocatif grec. Dans le contexte, l’appel vise toutefois l’ensemble des croyants de l’assemblée, ce que précise la note.
- source_word: ἀγαπητοί
  choice: bien-aimés
  rationale: Conserve la forte affection exprimée par Paul ainsi que la répétition emphatique du terme au début et à la fin du verset.
- source_word: ἐπιπόθητοι
  choice: qui me manquez tant
  rationale: Expression française naturelle de l’attachement et du profond désir de revoir les destinataires, sans affaiblir l’intensité du grec.
- source_word: χαρά
  choice: joie
  rationale: Équivalent direct et idiomatique qui maintient l’affirmation selon laquelle les Philippiens eux-mêmes sont la joie de Paul.
- source_word: στέφανος
  choice: couronne
  rationale: Terme français courant qui préserve l’image honorifique; la note précise qu’il s’agit de la couronne remise au vainqueur plutôt que d’un diadème royal.
- source_word: οὕτως
  choice: ainsi
  rationale: Conserve la référence à la manière de tenir ferme, vraisemblablement en lien avec ce qui précède, sans expliciter davantage une relation que le texte laisse contextuelle.
- source_word: στήκετε
  choice: tenez ferme
  rationale: Rend clairement l’impératif de persévérance et de stabilité.
- source_word: ἐν κυρίῳ
  choice: dans le Seigneur
  rationale: Préserve la formulation relationnelle et théologique habituelle de Paul sans la réduire à une simple cause ni l’expliciter comme une union.
theological_decisions:
- issue: Portée représentative de ἀδελφοί
  choice: Le texte principal garde « frères », avec une note indiquant que Paul s’adresse ici à toute l’assemblée.
  alternative: « frères et sœurs »
  rationale: La traduction conserve la forme masculine présente dans le grec tout en signalant sa portée contextuellement inclusive, sans effacer la forme de l’adresse source.
- issue: Sens de ἐν κυρίῳ
  choice: « dans le Seigneur »
  alternative: « unis au Seigneur »
  rationale: La formulation littérale préserve l’ampleur relationnelle et théologique de l’expression paulinienne sans trancher en faveur d’une seule explicitation.
translation_notes:
  register: Français international actuel, digne et accessible. L’adresse affectueuse demeure appuyée par la répétition de « bien-aimés ». « Qui me manquez tant » privilégie une tournure idiomatique moderne pour exprimer ἐπιπόθητοι, tandis que « tenez ainsi ferme dans le Seigneur » conserve la force impérative et le lien anaphorique de οὕτως.
