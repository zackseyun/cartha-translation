id: PHP.4.9
reference: Philippians 4:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἃ καὶ ἐμάθετε καὶ παρελάβετε καὶ ἠκούσατε καὶ εἴδετε ἐν ἐμοί, ταῦτα πράσσετε· καὶ ὁ θεὸς τῆς εἰρήνης ἔσται μεθ’ ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/009.yaml
  text: What you also learned and received and heard and saw in me—practice these things[b][a], and the God of peace will be with you.
translation:
  language: fr
  text: Ce que vous avez aussi appris, reçu, entendu et vu en moi[a], mettez-le en pratique[b] ; et le Dieu de paix sera avec vous.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi comprendre : « vu dans mon exemple » ou « vu dans ma vie ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « faites ces choses ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἃ
  choice: ce que
  rationale: Le pronom relatif neutre pluriel introduit le contenu de l’exhortation. « Ce que » est naturel en français et son antécédent collectif est repris par « le » dans « mettez-le ».
- source_word: καὶ ἐμάθετε καὶ παρελάβετε καὶ ἠκούσατε καὶ εἴδετε
  choice: avez aussi appris, reçu, entendu et vu
  rationale: « Aussi » rend le premier καί, qui rattache probablement cette série à l’exhortation précédente. L’énumération française conserve les quatre verbes tout en évitant une répétition pesante de « et ».
- source_word: παρελάβετε
  choice: reçu
  rationale: Le verbe peut désigner la réception d’un enseignement transmis. « Reçu » en préserve l’ampleur sans préciser davantage « tradition » ou « enseignement ».
- source_word: εἴδετε ἐν ἐμοί
  choice: vu en moi
  rationale: Cette formulation reste proche du grec et laisse ouverte la manière dont ce qui était visible se manifestait dans la personne, la conduite ou l’exemple de Paul.
- source_word: ταῦτα πράσσετε
  choice: mettez-le en pratique
  rationale: L’impératif présent appelle une conduite effective et suivie. « Mettre en pratique » exprime naturellement cette portée en français, tandis que le pronom singulier reprend le collectif « ce que ».
- source_word: ὁ θεὸς τῆς εἰρήνης
  choice: le Dieu de paix
  rationale: Cette expression paulinienne traditionnelle conserve directement le génitif grec sans l’interpréter comme « le Dieu qui donne la paix ».
- source_word: ἔσται μεθ’ ὑμῶν
  choice: sera avec vous
  rationale: Rend directement l’assurance future de la présence de Dieu exprimée par μετά avec le génitif.
theological_decisions:
- issue: Rapport entre la mise en pratique et la présence divine
  choice: L’exhortation est suivie d’une promesse coordonnée par « et ».
  alternative: 'Transformer la phrase en condition explicite : « si vous le faites, alors le Dieu de paix sera avec vous ».'
  rationale: Le grec relie les deux propositions par καί sans formuler une condition. La traduction garde donc la force pastorale de l’enchaînement sans imposer un rapport mécanique de cause à effet.
translation_notes:
  register: Français international moderne, clair et digne. La formulation maintient le parallélisme de la série verbale, tout en adoptant une énumération naturelle en français. Le point-virgule marque la transition entre l’exhortation et la promesse sans en faire une condition explicite.
