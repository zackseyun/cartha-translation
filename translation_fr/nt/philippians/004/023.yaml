  text: ἡ χάρις τοῦ κυρίου Ἰησοῦ Χριστοῦ μετὰ ⸂τοῦ πνεύματος⸃ ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/023.yaml
  text: The grace of the Lord Jesus Christ be with your spirit[a].
translation:
  language: fr
  text: Que la grâce du Seigneur Jésus-Christ soit avec votre esprit[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Quelques manuscrits portent : « avec vous tous ».'
    reason: 'Variante textuelle : certains témoins omettent « votre esprit » et lisent une bénédiction adressée directement à l’ensemble des destinataires.'
lexical_decisions:
- source_word: χάρις
  choice: grâce
  rationale: « Grâce » est le terme français naturel dans cette bénédiction paulinienne et conserve la richesse théologique ainsi que l’idée de faveur accordée.
- source_word: κυρίου
  choice: Seigneur
  rationale: Le titre « Seigneur » correspond à l’usage christologique de κύριος dans cette formule.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jésus-Christ
  rationale: En français courant, « Jésus-Christ » est la forme consacrée et naturelle de ce nom accompagné de son titre; elle n’efface pas la portée messianique de Χριστός.
- source_word: μετά
  choice: avec
  rationale: Avec le génitif, μετά exprime ici l’accompagnement ou la présence.
- source_word: πνεύματος
  choice: esprit
  rationale: Le nom au singulier désigne vraisemblablement la dimension intérieure des destinataires considérés collectivement, sans référence explicite au Saint-Esprit.
- source_word: ὑμῶν
  choice: votre
  rationale: Le possessif grec est pluriel; en français, « votre » s’adresse naturellement à l’ensemble de la communauté tout en s’accordant avec « esprit » au singulier.
theological_decisions:
- issue: Valeur de Χριστός dans l’expression Ἰησοῦ Χριστοῦ
  choice: Jésus-Christ
  alternative: Jésus le Messie
  rationale: Χριστός conserve son arrière-plan de titre messianique, mais dans cette formule paulinienne il est étroitement associé au nom de Jésus. « Jésus-Christ » est ici idiomatique, digne et immédiatement compréhensible en français, sans imposer une séparation que le grec ne marque pas.
- issue: Référent de πνεῦμα
  choice: l’esprit humain ou la vie intérieure collective des destinataires
  alternative: le Saint-Esprit
  rationale: Le possessif « votre » favorise la compréhension anthropologique. La traduction garde toutefois le terme simple « esprit » et évite une paraphrase qui trancherait davantage que le texte.
- issue: Verbe sous-entendu dans la bénédiction nominale grecque
  choice: Que ... soit
  alternative: La grâce ... avec votre esprit
  rationale: Le grec omet le verbe dans une formule de bénédiction. Le français requiert normalement son explicitation; la tournure souhaitative « Que ... soit » en restitue naturellement la force.
translation_notes:
  register: Français international moderne, sobre et liturgiquement digne. La phrase reste concise comme la bénédiction grecque. « Votre » conserve l’adresse plurielle à la communauté, tandis que « esprit » respecte le singulier du texte source.
