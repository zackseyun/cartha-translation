id: PHP.2.3
reference: Philippians 2:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: μηδὲν κατ’ ἐριθείαν ⸂μηδὲ κατὰ⸃ κενοδοξίαν, ἀλλὰ τῇ ταπεινοφροσύνῃ ἀλλήλους ἡγούμενοι ὑπερέχοντας ἑαυτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/003.yaml
  text: Do nothing from selfish ambition or empty conceit[a], but in humility regard one another as more important than yourselves[b],
translation:
  language: fr
  text: Ne faites rien par ambition égoïste ni par vaine gloire[a], mais, avec humilité, considérez les autres comme supérieurs à vous-mêmes[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « par vanité » ; littéralement « par gloire vide ».
    reason: lexical_alternative
  - marker: b
    text: Ou « comme plus importants que vous-mêmes ».
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδὲν
  choice: Ne faites rien
  rationale: Le grec place « rien » en tête et exprime, dans le contexte exhortatif, une interdiction générale. Cette formulation est idiomatique en français.
- source_word: κατ’ ἐριθείαν
  choice: par ambition égoïste
  rationale: ἐριθεία désigne ici une ambition intéressée et susceptible d’engendrer rivalités et divisions. « Par » rend naturellement le motif exprimé par κατά.
- source_word: μηδὲ κατὰ κενοδοξίαν
  choice: ni par vaine gloire
  rationale: κενοδοξία évoque littéralement une gloire vide, c’est-à-dire la vanité qui pousse à se mettre en avant. « Vaine gloire » conserve cette image tout en restant concise et digne.
- source_word: τῇ ταπεινοφροσύνῃ
  choice: avec humilité
  rationale: Le datif indique la manière ou la disposition dans laquelle agir. « Avec humilité » est naturel en français moderne.
- source_word: ἀλλήλους ἡγούμενοι
  choice: considérez les autres
  rationale: ἡγέομαι a ici le sens d’évaluer ou de tenir pour. La tournure exhortative française explicite la force impérative que le participe reçoit du contexte.
- source_word: ὑπερέχοντας ἑαυτῶν
  choice: comme supérieurs à vous-mêmes
  rationale: ὑπερέχω exprime le fait de dépasser ou d’occuper une position supérieure. Cette traduction préserve directement la comparaison sans préciser de façon indue la nature de cette supériorité.
theological_decisions:
- issue: Nature de la supériorité attribuée aux autres
  choice: comme supérieurs à vous-mêmes
  alternative: comme plus importants que vous-mêmes
  rationale: Le grec ὑπερέχοντας peut exprimer la supériorité ou la prééminence, sans définir ici s’il s’agit de valeur, de rang ou d’importance. Le texte principal conserve cette ouverture; la note propose une formulation relationnelle possible sans réduire l’exhortation à une affirmation sur la valeur intrinsèque des personnes.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve la structure contrastive du grec (« rien… mais… »). « Vaine gloire » maintient l’image de κενοδοξία; une note en explicite le sens. La virgule finale de l’extrait source n’est pas reproduite, le verset étant présenté comme une phrase autonome.
