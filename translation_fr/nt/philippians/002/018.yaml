id: PHP.2.18
reference: Philippians 2:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τὸ δὲ αὐτὸ καὶ ὑμεῖς χαίρετε καὶ συγχαίρετέ μοι.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/018.yaml
  text: In the same way[a], you also rejoice and rejoice with me.
translation:
  language: fr
  text: De même[a], vous aussi, réjouissez-vous et réjouissez-vous avec moi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Vous aussi, éprouvez la même joie et partagez-la avec moi. »'
    reason: 'Alternative lexicale et syntaxique : τὸ αὐτό peut être compris comme « la même chose / la même joie », et les deux verbes de joie peuvent être rendus de façon moins répétitive en français.'
lexical_decisions:
- source_word: τὸ δὲ αὐτὸ
  choice: De même
  rationale: L’expression τὸ αὐτό a ici une valeur adverbiale et renvoie à la joie évoquée au verset précédent. « De même » est naturel en français et conserve ce lien, tandis que δέ assure une transition légère qui n’exige pas nécessairement un « mais » explicite.
- source_word: χαίρετε
  choice: réjouissez-vous
  rationale: Cet impératif présent, à la deuxième personne du pluriel, appelle les Philippiens à la joie. « Réjouissez-vous » préserve la force verbale et fait écho au vocabulaire récurrent de la joie dans la lettre.
- source_word: συγχαίρετέ
  choice: réjouissez-vous avec
  rationale: Le verbe composé exprime une joie partagée. « Réjouissez-vous avec » rend directement cette dimension commune tout en conservant le parallélisme avec χαίρετε.
- source_word: μοι
  choice: moi
  rationale: Le pronom au datif désigne Paul comme celui avec qui les Philippiens sont appelés à se réjouir; après « avec », le français exige la forme tonique « moi ».
theological_decisions: []
translation_notes:
  register: 'Français moderne, digne et accessible. La répétition « réjouissez-vous… réjouissez-vous avec moi » est volontaire : elle reflète le jeu entre χαίρετε et συγχαίρετέ plutôt que de lisser le parallélisme grec.'
