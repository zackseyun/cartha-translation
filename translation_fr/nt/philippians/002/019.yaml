id: PHP.2.19
reference: Philippians 2:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἐλπίζω δὲ ἐν κυρίῳ Ἰησοῦ Τιμόθεον ταχέως πέμψαι ὑμῖν, ἵνα κἀγὼ εὐψυχῶ γνοὺς τὰ περὶ ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/019.yaml
  text: But I hope in the Lord Jesus to send Timothy to you soon[a], so that I too may be encouraged when I learn the things concerning you.
translation:
  language: fr
  text: Mais j’espère, dans le Seigneur Jésus, vous envoyer bientôt Timothée, afin que moi aussi, je sois réconforté en apprenant de vos nouvelles.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐλπίζω
  choice: j’espère
  rationale: Le présent exprime l’espérance ou l’attente actuelle de Paul; « j’espère » est direct et naturel.
- source_word: δὲ
  choice: Mais
  rationale: δέ marque ici une transition légèrement contrastive avec ce qui précède; « Mais » la rend clairement.
- source_word: ἐν κυρίῳ Ἰησοῦ
  choice: dans le Seigneur Jésus
  rationale: Cette formulation conserve le cadre relationnel et la dépendance envers Jésus dans lesquels Paul situe son projet.
- source_word: Τιμόθεον
  choice: Timothée
  rationale: Forme française traditionnelle et courante du nom propre.
- source_word: ταχέως
  choice: bientôt
  rationale: Dans ce contexte d’envoi projeté, l’adverbe indique naturellement la proximité dans le temps plutôt que la vitesse d’exécution.
- source_word: πέμψαι ὑμῖν
  choice: vous envoyer
  rationale: Cette construction est la formulation française idiomatique correspondant à l’envoi de Timothée auprès des destinataires.
- source_word: ἵνα
  choice: afin que
  rationale: La locution marque explicitement le but tout en convenant au registre digne du passage.
- source_word: κἀγὼ
  choice: moi aussi
  rationale: La formulation préserve la valeur additive et l’accent porté sur Paul.
- source_word: εὐψυχῶ
  choice: je sois réconforté
  rationale: Le verbe signifie retrouver courage ou être de meilleure humeur; « réconforté » exprime naturellement cet effet en français.
- source_word: γνοὺς τὰ περὶ ὑμῶν
  choice: en apprenant de vos nouvelles
  rationale: L’expression grecque désigne ce qui concerne les Philippiens, c’est-à-dire leur situation ou leurs nouvelles; cette traduction reste concise, naturelle et moins interprétative que « comment vous allez ».
theological_decisions:
- issue: Traduction de κύριος dans ἐν κυρίῳ Ἰησοῦ
  choice: Seigneur
  alternative: Maître
  rationale: « Seigneur » est le titre christologique français usuel et correspond au sens de κύριος dans cette expression paulinienne.
- issue: Portée de ἐν κυρίῳ Ἰησοῦ sur l’espérance de Paul
  choice: dans le Seigneur Jésus
  alternative: avec l’aide du Seigneur Jésus
  rationale: La traduction conserve la formulation relationnelle et sa tension théologique sans la réduire à une simple demande d’assistance.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe reste proche du grec sans lourdeur; « de vos nouvelles » communique l’expression idiomatique τὰ περὶ ὑμῶν sans imposer une description précise de l’état des destinataires.
