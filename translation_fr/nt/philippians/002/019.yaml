  source_fidelity: 'Le texte rend fidèlement les principaux éléments grecs : l’espérance actuelle (« j’espère »), le cadre « dans le Seigneur Jésus », l’envoi prochain de Timothée, le but introduit par ἵνα, l’insistance de κἀγώ (« moi aussi »), et la réception d’informations concernant les Philippiens. « En apprenant de vos nouvelles » exprime naturellement γνοὺς τὰ περὶ ὑμῶν sans restreindre indûment ces nouvelles à leur seul état personnel.'
