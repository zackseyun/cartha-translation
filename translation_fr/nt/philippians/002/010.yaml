  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἵνα
  choice: afin que
  rationale: Introduit le but ou le résultat découlant de la proposition précédente, tout en conservant la valeur télique du grec.
- source_word: ἐν τῷ ὀνόματι Ἰησοῦ
  choice: au nom de Jésus
  rationale: Dans ce contexte d’hommage, « au nom de Jésus » exprime naturellement en français la réaction suscitée par son nom et son rang. La formulation peut aussi se comprendre comme « dans le nom », possibilité signalée en note.
- source_word: πᾶν γόνυ
  choice: tout genou
  rationale: Conserve l’image corporelle forte et traditionnelle d’un hommage universel, sans la réduire à une paraphrase comme « toute personne ».
- source_word: κάμψῃ
  choice: fléchisse
  rationale: Le subjonctif français convient après « afin que »; « fléchir le genou » est une expression naturelle et digne qui évoque la prosternation ou l’hommage.
- source_word: ἐπουρανίων
  choice: dans le ciel
  rationale: Rend naturellement le premier membre de la série cosmique tout en évitant de préciser l’identité des êtres concernés.
- source_word: ἐπιγείων
  choice: sur la terre
  rationale: Maintient le parallélisme spatial de la série et son ampleur universelle.
- source_word: καταχθονίων
  choice: sous la terre
  rationale: Préserve l’image spatiale du grec sans introduire un terme plus interprétatif comme « monde des morts » ou « enfers ».
theological_decisions:
- issue: Portée de l’expression tripartite ἐπουρανίων καὶ ἐπιγείων καὶ καταχθονίων
  choice: Présenter les trois domaines cosmiques sans identifier plus précisément leurs habitants.
  alternative: Nommer explicitement les êtres célestes, les humains et les morts, ou encore les anges, les humains et les démons.
  rationale: Le texte affirme un hommage de portée universelle, mais ne définit pas lui-même chaque catégorie. La traduction conserve cette ampleur et cette retenue.
- issue: Sens de ἐν dans ἐν τῷ ὀνόματι Ἰησοῦ
  choice: « au nom de Jésus » dans le texte, avec « dans le nom de Jésus » en note.
  alternative: Traduire directement « dans le nom de Jésus ».
  rationale: « Au nom de Jésus » est la formulation française la plus naturelle dans ce contexte, tandis que la note préserve l’ambiguïté lexicale sans imposer une lecture d’agence ou d’autorisation.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure « tout genou fléchisse » conserve l’image biblique et le rythme solennel. La série « dans le ciel, sur la terre et sous la terre » rend clairement la portée cosmique du grec.
