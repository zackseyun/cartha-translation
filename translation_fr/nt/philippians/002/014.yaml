id: PHP.2.14
reference: Philippians 2:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Πάντα ποιεῖτε χωρὶς γογγυσμῶν καὶ διαλογισμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/014.yaml
  text: Do everything without grumbling or arguing[b][a],
translation:
  language: fr
  text: Faites tout sans murmures ni contestations[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sans murmurer ni discuter ». Le dernier terme peut aussi désigner des raisonnements ou des remises en question; ici, il évoque probablement des contestations conflictuelles.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάντα
  choice: tout
  rationale: L’accusatif pluriel neutre de πᾶς a ici une portée globale. « Faites tout » est naturel en français moderne et conserve cette portée universelle.
- source_word: ποιεῖτε
  choice: Faites
  rationale: Le présent impératif exprime une consigne valable dans la durée. L’impératif français « Faites » rend naturellement cette force sans ajout explicatif.
- source_word: χωρὶς
  choice: sans
  rationale: Avec les génitifs qui suivent, χωρὶς indique que ces attitudes doivent être absentes de toute action; « sans » est la formulation française la plus directe.
- source_word: γογγυσμῶν
  choice: murmures
  rationale: γογγυσμός désigne des plaintes exprimées à voix basse. « Murmures » reste clair et digne, tout en préservant l’écho possible aux murmures d’Israël au désert.
- source_word: διαλογισμῶν
  choice: contestations
  rationale: Dans cette exhortation, διαλογισμός évoque probablement des disputes ou objections conflictuelles plutôt que la seule réflexion intérieure. « Contestations » garde cette dimension interpersonnelle sans surinterpréter le terme.
theological_decisions: []
translation_notes:
  register: Français international moderne, concis et digne. Le parallélisme nominal « sans murmures ni contestations » suit de près la structure grecque, tandis que la note conserve l’étendue sémantique de διαλογισμῶν.
