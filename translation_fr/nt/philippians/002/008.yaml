  source_fidelity: Le sens général est fidèle, mais la formulation finale est mieux rendue par l’intensification directe « même la mort sur une croix ». La note b actuelle qualifie à tort de littérale une formulation avec « une mort » qui ne correspond pas au grec, lequel répète « mort » puis ajoute « de croix ».
  naturalness: « Il s’est abaissé lui-même » est compréhensible, mais « il s’est humilié lui-même » est plus idiomatique pour l’expression grecque tout en conservant l’insistance du pronom explicite. « En se rendant obéissant » rend plus naturellement la relation participiale que « en devenant obéissant ».
  terminology: « S’humilier », « obéissant », « jusqu’à la mort » et « sur une croix » sont des équivalents modernes, clairs et théologiquement non surinterprétatifs. La formulation conserve l’escalade rhétorique de θανάτου δὲ σταυροῦ.
