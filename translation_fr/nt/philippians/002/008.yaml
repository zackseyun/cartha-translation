  variant: modern international French
source:
  edition: SBLGNT
  text: ἐταπείνωσεν ἑαυτὸν γενόμενος ὑπήκοος μέχρι θανάτου, θανάτου δὲ σταυροῦ·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/008.yaml
  text: he humbled himself[b][a], becoming obedient to the point of death—even death on a cross.
translation:
  language: fr
  text: il s’est humilié lui-même en se rendant obéissant jusqu’à la mort[a], même la mort sur une croix[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « jusqu’à mourir » ; son obéissance est allée jusqu’à la mort elle-même.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « mort, et même [mort] de croix » ; le sens est « même la mort sur une croix ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐταπείνωσεν
  choice: s’est abaissé
  rationale: Cette formulation française actuelle exprime l’abaissement volontaire sans recourir à un terme archaïque ni ajouter une interprétation doctrinale.
- source_word: ἑαυτὸν
  choice: lui-même
  rationale: Le pronom réfléchi explicite est conservé afin de maintenir l’accent mis sur le caractère volontaire de cet abaissement.
- source_word: γενόμενος
  choice: en devenant
  rationale: Le gérondif rend naturellement le participe et présente l’obéissance comme la manière dont il s’est abaissé, sans imposer une succession temporelle trop précise.
- source_word: ὑπήκοος
  choice: obéissant
  rationale: « Obéissant » est l’équivalent direct et naturel de l’adjectif grec et en préserve toute la force.
- source_word: μέχρι θανάτου
  choice: jusqu’à la mort
  rationale: La formulation conserve l’idée d’une obéissance menée jusqu’à son terme extrême, la mort elle-même, tout en préservant la concision et la légère ambiguïté de l’expression grecque.
- source_word: δὲ
  choice: et même
  rationale: 'Dans cette construction, δέ introduit une intensification : non seulement la mort, mais la mort infamante qui est précisée ensuite.'
- source_word: σταυροῦ
  choice: sur une croix
  rationale: Cette expression rend clairement en français le génitif grec condensé et maintient la réalité concrète de la crucifixion.
theological_decisions:
- issue: Portée de la formule finale θανάτου δὲ σταυροῦ
  choice: 'Une progression emphatique : « et même la mort sur une croix »'
  alternative: « oui, la mort sur une croix » ou, plus littéralement, « une mort de croix »
  rationale: La fin du verset amplifie l’affirmation précédente en précisant la forme particulièrement honteuse de la mort, sans développer cette portée par des ajouts interprétatifs.
translation_notes:
  register: 'Français international moderne, simple et digne. La syntaxe conserve le mouvement du grec : abaissement volontaire, obéissance menée jusqu’à la mort, puis intensification finale sur la croix.'
