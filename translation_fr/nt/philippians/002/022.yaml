id: PHP.2.22
reference: Philippians 2:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τὴν δὲ δοκιμὴν αὐτοῦ γινώσκετε, ὅτι ὡς πατρὶ τέκνον σὺν ἐμοὶ ἐδούλευσεν εἰς τὸ εὐαγγέλιον.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/022.yaml
  text: But you know his proven character[b][a], that as a child with his father he served with me for the gospel.
translation:
  language: fr
  text: 'Mais vous savez qu’il a fait ses preuves[a] : comme un enfant aux côtés de son père, il a servi avec moi pour l’Évangile.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « vous connaissez sa valeur éprouvée ». Le terme grec désigne une qualité reconnue à l’issue d’une mise à l’épreuve.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Mais
  rationale: Marque la légère transition contrastive avec le contexte précédent, dans un français naturel.
- source_word: τὴν δοκιμὴν αὐτοῦ γινώσκετε
  choice: vous savez qu’il a fait ses preuves
  rationale: Rend idiomatiquement l’idée d’une qualité personnelle reconnue parce qu’elle a été mise à l’épreuve, plutôt qu’une simple « preuve » abstraite.
- source_word: ὡς πατρὶ τέκνον
  choice: comme un enfant aux côtés de son père
  rationale: Conserve la comparaison familiale et le terme non genré τέκνον (« enfant »), sans le préciser indûment en « fils ».
- source_word: σὺν ἐμοὶ
  choice: avec moi
  rationale: Exprime directement l’association de Timothée à Paul dans leur service commun.
- source_word: ἐδούλευσεν
  choice: il a servi
  rationale: Restitue le sens verbal de service dévoué sans imposer ici la formulation plus littérale et moins naturelle « il a été esclave ».
- source_word: εἰς τὸ εὐαγγέλιον
  choice: pour l’Évangile
  rationale: Exprime naturellement l’orientation de leur service vers la cause et la proclamation de l’Évangile.
theological_decisions:
- issue: Relation figurée entre Paul et Timothée
  choice: comme un enfant aux côtés de son père
  alternative: comme un fils aux côtés de son père
  rationale: Le grec emploie τέκνον, « enfant », et non υἱός, « fils » ; la traduction préserve donc l’image familiale sans ajouter une précision masculine absente du terme source.
translation_notes:
  register: Français moderne, digne et accessible. « Il a fait ses preuves » communique clairement la portée de δοκιμή ; « aux côtés de » rend la proximité de l’image familiale sans confondre cette comparaison avec le complément distinct « avec moi ».
