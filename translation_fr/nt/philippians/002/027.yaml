id: PHP.2.27
reference: Philippians 2:27
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ γὰρ ἠσθένησεν παραπλήσιον ⸀θανάτῳ· ἀλλὰ ὁ θεὸς ⸂ἠλέησεν αὐτόν⸃, οὐκ αὐτὸν δὲ μόνον ἀλλὰ καὶ ἐμέ, ἵνα μὴ λύπην ἐπὶ λύπην σχῶ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/027.yaml
  text: For indeed he was sick[a], nearly to death; but God had mercy on him, and not on him only but also on me[b], so that I might not have sorrow upon sorrow.
translation:
  language: fr
  text: En effet, il a été malade, tout près de la mort[a]. Mais Dieu a eu compassion de lui — et non seulement de lui, mais aussi de moi — afin que je ne connaisse pas chagrin sur chagrin[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « près de mourir » ou « au seuil de la mort ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement, « chagrin sur chagrin » : une expression qui évoque un chagrin venant s’ajouter à un autre.'
    reason: cultural_note
lexical_decisions:
- source_word: ἠσθένησεν
  choice: il a été malade
  rationale: Dans ce contexte, ἀσθενέω désigne clairement une maladie physique. Cette formulation française est directe et naturelle, sans préciser inutilement s’il est « tombé » malade.
- source_word: παραπλήσιον θανάτῳ
  choice: tout près de la mort
  rationale: L’expression indique qu’Épaphrodite s’est approché de la mort sans affirmer qu’il est mort. Elle conserve simplement l’idée de proximité portée par l’adjectif et le datif.
- source_word: ἠλέησεν αὐτόν
  choice: a eu compassion de lui
  rationale: Cette expression rend l’action miséricordieuse de Dieu dans un français moderne et digne. Elle évite le possible ton condescendant de « a eu pitié de lui » tout en gardant la portée de ἐλεέω.
- source_word: οὐκ αὐτὸν δὲ μόνον ἀλλὰ καὶ ἐμέ
  choice: et non seulement de lui, mais aussi de moi
  rationale: La formulation reprend naturellement le complément de « avoir compassion » et conserve le contraste emphatique entre Épaphrodite et Paul.
- source_word: ἵνα μὴ … σχῶ
  choice: afin que je n’aie pas
  rationale: Le subjonctif après « afin que » restitue clairement la visée négative exprimée par ἵνα μή avec le subjonctif grec.
- source_word: λύπην ἐπὶ λύπην
  choice: chagrin sur chagrin
  rationale: 'La répétition et la préposition sont conservées afin de reproduire l’image cumulative du grec : au chagrin déjà présent se serait ajouté celui de la mort d’Épaphrodite.'
theological_decisions:
- issue: Nature de la compassion divine envers Épaphrodite
  choice: Conserver l’énoncé général « Dieu a eu compassion de lui »
  alternative: 'Expliciter : « Dieu l’a guéri » ou « Dieu lui a sauvé la vie »'
  rationale: Le contexte relie la compassion de Dieu à la survie d’Épaphrodite, mais le verset n’emploie pas explicitement le vocabulaire de la guérison et n’en décrit pas le mécanisme. La traduction ne doit donc pas préciser davantage que le grec.
- issue: Compassion de Dieu envers Paul
  choice: Faire porter le même verbe implicitement sur Paul
  alternative: 'Reformuler : « Dieu m’a aussi épargné cette peine »'
  rationale: Le grec affirme que Dieu a également eu compassion de Paul, puis en indique la conséquence. Garder cette structure préserve la portée théologique du terme sans réduire la compassion à une simple émotion humaine.
translation_notes:
  register: Français international moderne, clair et digne. Les tirets mettent en relief l’incise contrastive sans alourdir la syntaxe. « Chagrin sur chagrin » conserve la force rhétorique de la répétition grecque; la note en explicite le caractère cumulatif.
