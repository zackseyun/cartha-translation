  text: οὐδένα γὰρ ἔχω ἰσόψυχον ὅστις γνησίως τὰ περὶ ὑμῶν μεριμνήσει,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/020.yaml
  text: For I have no one like him who will genuinely care about your welfare[b][a],
translation:
  language: fr
  text: Car je n’ai personne qui partage mes sentiments[a] et qui se souciera sincèrement de ce qui vous concerne[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qui est animé du même esprit que moi »; littéralement, « qui a une âme égale ».
    reason: lexical_alternative
  - marker: b
    text: Ou « qui prendra sincèrement soin de vous ».
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: Car
  rationale: Conserve la valeur explicative qui relie cette affirmation à l’envoi de Timothée évoqué juste avant.
- source_word: οὐδένα
  choice: personne
  rationale: Rend directement le pronom négatif sans ajouter « d’autre », absent du grec.
- source_word: ἔχω
  choice: je n’ai
  rationale: La tournure française naturelle intègre la négation portée par οὐδένα.
- source_word: ἰσόψυχον
  choice: qui partage mes sentiments
  rationale: Exprime de façon claire l’idée rare d’une même disposition intérieure, littéralement d’une personne « égale quant à l’âme », sans réduire le terme à une simple identité d’opinion.
- source_word: ὅστις
  choice: et qui
  rationale: Introduit naturellement la caractéristique de la personne recherchée; la coordination évite une succession maladroite de relatives en français.
- source_word: γνησίως
  choice: sincèrement
  rationale: Rend l’authenticité et la loyauté de la sollicitude exprimées par l’adverbe.
- source_word: τὰ περὶ ὑμῶν
  choice: ce qui vous concerne
  rationale: Préserve l’étendue volontairement générale de l’expression grecque, qui peut viser la situation, les besoins et le bien des destinataires.
- source_word: μεριμνήσει
  choice: se souciera
  rationale: Dans ce contexte pastoral positif, le verbe désigne une sollicitude attentive plutôt qu’une anxiété répréhensible.
