  source_fidelity: 'La structure sacrificielle du grec est bien conservée : σπένδομαι, θυσία et λειτουργία reçoivent des équivalents cultuels, et « sur » rend de façon littérale ἐπί sans résoudre indûment la relation exacte entre la libation de Paul et l’offrande des Philippiens. « Votre foi » convient pour πίστεως, avec une note qui signale correctement l’alternative « fidélité ».'
