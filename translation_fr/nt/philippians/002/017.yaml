id: PHP.2.17
reference: Philippians 2:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀλλὰ εἰ καὶ σπένδομαι ἐπὶ τῇ θυσίᾳ καὶ λειτουργίᾳ τῆς πίστεως ὑμῶν, χαίρω καὶ συγχαίρω πᾶσιν ὑμῖν·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/017.yaml
  text: But even if I am being poured out as a drink offering upon the sacrifice and service of your faith[c][b][a], I rejoice and rejoice with all of you.
translation:
  language: fr
  text: Mais même si je suis versé comme une libation[a] sur le sacrifice et le service cultuel[b] de votre foi[c], je me réjouis et je me réjouis avec vous tous.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « je suis répandu comme une offrande de vin ».
    reason: lexical_alternative
  - marker: b
    text: Ou « service » ou « ministère » ; dans ce contexte, le grec appartient au vocabulaire du culte.
    reason: lexical_alternative
  - marker: c
    text: Ou « fidélité ».
    reason: alternative_reading
lexical_decisions:
- source_word: σπένδομαι
  choice: je suis versé en libation
  rationale: Le verbe évoque une libation répandue dans un cadre sacrificiel. Cette formulation conserve explicitement la métaphore cultuelle et la valeur passive du présent.
- source_word: ἐπὶ
  choice: sur
  rationale: Avec le datif, la préposition peut présenter la libation de Paul comme versée sur le sacrifice des Philippiens, tout en laissant ouverte la nuance d’ajout ou d’association.
- source_word: θυσίᾳ
  choice: sacrifice
  rationale: Le terme français correspond directement au vocabulaire sacrificiel grec et maintient l’image cultuelle du passage.
- source_word: λειτουργίᾳ
  choice: service cultuel
  rationale: Dans ce contexte sacrificiel, « service cultuel » préserve la dimension de service rendu à Dieu sans préciser indûment qu’il serait accompli par un prêtre.
- source_word: πίστεως
  choice: foi
  rationale: « Foi » est ici le sens le plus naturel et conserve l’expression condensée du grec, qui peut désigner la foi des Philippiens envisagée comme sacrifice et service.
- source_word: χαίρω
  choice: je me réjouis
  rationale: Cette traduction garde le vocabulaire de la joie, important dans l’épître, ainsi que la déclaration au présent.
- source_word: συγχαίρω
  choice: je partage cette joie avec
  rationale: La formulation exprime naturellement en français la joie éprouvée en commun, portée par le préfixe συν-, sans suggérer ici le sens de « féliciter ».
- source_word: πᾶσιν ὑμῖν
  choice: avec vous tous
  rationale: La traduction maintient l’insistance explicite sur l’ensemble de la communauté.
theological_decisions:
- issue: Image cultuelle appliquée à l’éventuelle mort de Paul
  choice: Paul se présente comme une libation versée sur le sacrifice et le service cultuel liés à la foi des Philippiens.
  alternative: Paul décrit simplement sa vie comme donnée en lien avec leur service, sans intensification sacrificielle explicite.
  rationale: L’accumulation de σπένδομαι, θυσία et λειτουργία impose de conserver l’imagerie du sacrifice et du culte, sans toutefois expliquer dans le texte ce que représente précisément la mort éventuelle de Paul.
- issue: Relation entre le sacrifice, le service cultuel et la foi
  choice: Conserver la construction condensée « le sacrifice et le service cultuel de votre foi ».
  alternative: Développer en « le sacrifice que constitue votre foi et le service qui en découle » ou rattacher la foi au seul service.
  rationale: Le génitif grec peut qualifier l’ensemble coordonné de façon dense. Le développer trancherait prématurément la nature exacte de cette relation.
translation_notes:
  register: Français international moderne, digne et accessible. « Libation » et « service cultuel » sont maintenus en raison de l’imagerie sacrificielle fortement marquée dans le grec ; les notes éclairent ces termes sans aplatir ni surinterpréter la métaphore.
