  text: ἀλλὰ ἑαυτὸν ἐκένωσεν μορφὴν δούλου λαβών, ἐν ὁμοιώματι ἀνθρώπων γενόμενος· καὶ σχήματι εὑρεθεὶς ὡς ἄνθρωπος
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/007.yaml
  text: but emptied himself[a], taking the form of a servant, becoming in the likeness of men[d][c][b]; and being found in appearance as a man
translation:
  language: fr
  text: mais il s’est dépouillé lui-même[a], prenant la forme d’un esclave, devenant semblable aux êtres humains[b] ; et, à son apparence, reconnu comme un être humain[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « s’est vidé lui-même » ; autre traduction possible : « s’est réduit à rien ». Les expressions qui suivent indiquent comment s’accomplit cet abaissement.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « devenant dans la ressemblance des êtres humains ». Le mot « semblable » ne signifie pas ici que son humanité n’aurait été qu’apparente.'
    reason: source_clarification
  - marker: c
    text: 'Ou : « trouvé, quant à son aspect, comme un être humain ». Le grec emploie ici le singulier générique ἄνθρωπος, qui désigne un être humain sans insister sur son sexe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: mais
  rationale: Marque le contraste fort avec la proposition précédente, de manière concise et naturelle.
- source_word: ἑαυτὸν ἐκένωσεν
  choice: il s’est dépouillé lui-même
  rationale: Cette tournure française conserve l’idée d’un abaissement volontaire et le pronom réfléchi, tout en restant naturelle. Une note signale la métaphore plus littérale de l’action de « vider ».
- source_word: μορφὴν δούλου
  choice: la forme d’un esclave
  rationale: « Forme » maintient la correspondance avec μορφή et son parallèle au verset précédent sans en fixer excessivement la portée métaphysique. « Esclave » rend la condition servile forte de δοῦλος.
- source_word: λαβών
  choice: prenant
  rationale: Le participe présent conserve le lien participial et indique naturellement la manière dont il s’est dépouillé.
- source_word: ἐν ὁμοιώματι ἀνθρώπων γενόμενος
  choice: devenant semblable aux êtres humains
  rationale: « Devenant » rend directement γενόμενος ; « semblable » transmet ὁμοίωμα dans un français naturel, et « êtres humains » restitue le pluriel générique sans restriction de genre.
- source_word: σχήματι εὑρεθεὶς ὡς ἄνθρωπος
  choice: reconnu à son apparence comme un être humain
  rationale: « Apparence » distingue σχῆμα de μορφή, tandis que « reconnu » exprime idiomatiquement εὑρεθείς dans le sens de ce qui est constaté. Le singulier ἄνθρωπος est ici générique.
theological_decisions:
- issue: Sens de ἑαυτὸν ἐκένωσεν dans le contexte christologique
  choice: Conserver l’image de l’abaissement volontaire sans préciser de quoi le Christ se serait dépouillé ; les participes suivants en indiquent la manière.
  alternative: Comprendre qu’il a abandonné ses attributs divins, ou traduire simplement qu’il s’est réduit à rien.
  rationale: Le texte ne nomme pas un contenu retiré. La traduction laisse donc les propositions « prenant… » et « devenant… » éclairer l’action, sans imposer une théorie christologique particulière.
- issue: Portée de ὁμοίωμα dans l’expression relative à l’humanité
  choice: Préserver la notion de ressemblance sans suggérer que l’humanité du Christ n’était qu’une illusion.
  alternative: Traduire comme une simple apparence humaine, ou remplacer la ressemblance par une affirmation plus explicite d’identité complète.
  rationale: « Semblable » respecte la formulation de Paul et sa tension propre. La note prévient une lecture docète sans renforcer le grec au-delà de ce qu’il dit.
- issue: Distinction entre μορφή et σχῆμα
  choice: Rendre μορφή par « forme » et σχῆμα par « apparence ».
  alternative: Employer « forme » dans les deux propositions.
  rationale: Cette distinction française reflète la variation lexicale grecque et évite d’effacer le mouvement du passage, sans transformer « apparence » en irréalité.
translation_notes:
  register: Français international actuel, digne et lisible. La syntaxe participiale et le contraste lexical entre « forme » et « apparence » sont maintenus. « Êtres humains » évite l’ambiguïté genrée de « hommes », tandis que « esclave » conserve la force sociale de δοῦλος.
