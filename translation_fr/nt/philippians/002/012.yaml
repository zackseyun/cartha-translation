id: PHP.2.12
reference: Philippians 2:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ὥστε, ἀγαπητοί μου, καθὼς πάντοτε ὑπηκούσατε, μὴ ὡς ἐν τῇ παρουσίᾳ μου μόνον ἀλλὰ νῦν πολλῷ μᾶλλον ἐν τῇ ἀπουσίᾳ μου, μετὰ φόβου καὶ τρόμου τὴν ἑαυτῶν σωτηρίαν κατεργάζεσθε,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/012.yaml
  text: So then[a], my beloved, just as you have always obeyed—not only in my presence, but now much more in my absence—work out your own salvation with fear and trembling[c][b],
translation:
  language: fr
  text: Ainsi donc, mes bien-aimés, de même que vous avez toujours obéi, non seulement en ma présence, mais bien davantage maintenant en mon absence, mettez en œuvre votre propre salut[a] avec crainte et tremblement[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Mettre en œuvre » signifie ici faire passer le salut dans votre conduite et le mener à son plein effet, non le gagner comme un salaire.
    reason: alternative_reading
  - marker: b
    text: L’expression « crainte et tremblement » évoque un profond respect, empreint de gravité et d’humilité devant Dieu.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὥστε
  choice: Ainsi donc
  rationale: Introduit naturellement la conséquence de ce qui précède tout en conservant le lien logique marqué par le grec.
- source_word: ἀγαπητοί μου
  choice: mes bien-aimés
  rationale: Conserve l’affection pastorale du vocatif dans un registre digne et courant.
- source_word: καθὼς πάντοτε ὑπηκούσατε
  choice: vous qui avez toujours obéi
  rationale: Le passé composé présente leur obéissance comme une conduite établie qui demeure pertinente pour l’exhortation présente.
- source_word: παρουσίᾳ / ἀπουσίᾳ
  choice: présence / absence
  rationale: Cette paire nominale claire reproduit directement le contraste rhétorique du grec.
- source_word: πολλῷ μᾶλλον
  choice: bien davantage
  rationale: Rend avec naturel l’intensification comparative, en la reliant à « maintenant » comme dans l’ordre grec.
- source_word: τὴν ἑαυτῶν σωτηρίαν
  choice: votre propre salut
  rationale: « Salut » conserve la portée théologique habituelle de σωτηρία, et « propre » rend l’insistance de ἑαυτῶν sans imposer une lecture individualiste.
- source_word: κατεργάζεσθε
  choice: mettez en œuvre
  rationale: Exprime l’idée de mener effectivement quelque chose à sa réalisation dans la conduite, sans suggérer explicitement qu’il faudrait mériter le salut.
- source_word: μετὰ φόβου καὶ τρόμου
  choice: avec crainte et tremblement
  rationale: Conserve la force et la solennité de la formule grecque sans l’atténuer par une paraphrase interprétative.
theological_decisions:
- issue: Sens de « mettez en œuvre votre propre salut »
  choice: Une exhortation à rendre le salut effectif dans la vie et à le mener jusqu’à son plein déploiement.
  alternative: Un commandement d’acquérir ou de mériter le salut par le seul effort humain.
  rationale: κατεργάζεσθε peut désigner le fait de produire un effet ou de mener une réalité à son accomplissement. La traduction garde l’exigence du commandement sans trancher au-delà du texte; le verset suivant évoque l’action de Dieu en eux.
- issue: Portée de « crainte et tremblement »
  choice: La formule forte et traditionnelle est conservée telle quelle.
  alternative: La réduire soit à une terreur servile, soit à un simple respect dépourvu de gravité.
  rationale: L’expression communique une attitude de profond sérieux et d’humilité devant Dieu, tout en gardant sa tension émotionnelle.
translation_notes:
  register: Français international moderne, clair et digne. La longue phrase et ses contrastes sont conservés, mais sa syntaxe est rendue naturelle. Les formulations théologiquement chargées restent visibles sans recevoir une résolution confessionnelle.
