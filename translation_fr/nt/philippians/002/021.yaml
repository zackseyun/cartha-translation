  variant: modern international French
source:
  edition: SBLGNT
  text: οἱ πάντες γὰρ τὰ ἑαυτῶν ζητοῦσιν, οὐ τὰ ⸂Ἰησοῦ Χριστοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/021.yaml
  text: For they all seek their own interests[a], not those of Jesus the Messiah.
translation:
  language: fr
  text: Car tous recherchent leurs propres intérêts, et non ceux de Jésus, le Messie[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Jésus-Christ ».'
    reason: Variante lexicale pour rendre le titre Χριστός dans l’expression Ἰησοῦ Χριστοῦ.
lexical_decisions:
- source_word: οἱ πάντες
  choice: tous
  rationale: L’expression grecque substantivée désigne collectivement toutes les personnes en vue et conserve ici son insistance sans ajouter un référent absent du texte.
- source_word: γὰρ
  choice: car
  rationale: La conjonction introduit la raison de l’affirmation précédente; « car » maintient clairement ce lien explicatif.
- source_word: τὰ ἑαυτῶν
  choice: leurs propres intérêts
  rationale: Le neutre pluriel désigne largement ce qui concerne chacun. « Leurs propres intérêts » exprime naturellement le contraste moral implicite sans réduire l’expression à des biens matériels.
- source_word: ζητοῦσιν
  choice: recherchent
  rationale: Le verbe indique ce que ces personnes cherchent ou poursuivent; « recherchent » convient aux deux pôles du contraste.
- source_word: τὰ Ἰησοῦ Χριστοῦ
  choice: ceux de Jésus le Messie
  rationale: « Ceux » reprend elliptiquement « intérêts », comme l’article neutre pluriel grec. « Le Messie » rend Χριστοῦ comme titre tout en donnant une formulation française idiomatique.
theological_decisions:
- issue: Traduction de Χριστοῦ dans Ἰησοῦ Χριστοῦ
  choice: Jésus le Messie
  alternative: Jésus-Christ
  rationale: « Le Messie » rend explicitement la valeur du titre Χριστός. La forme française traditionnelle « Jésus-Christ », qui peut être comprise comme une expression devenue quasi nominale, est signalée en note.
translation_notes:
  register: Français international moderne, clair et digne. La coordination « et non » rend le contraste plus naturel en français, tandis que « car » préserve le rapport explicatif avec le verset précédent.
