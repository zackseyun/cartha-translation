id: PHP.2.6
reference: Philippians 2:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὃς ἐν μορφῇ θεοῦ ὑπάρχων οὐχ ἁρπαγμὸν ἡγήσατο τὸ εἶναι ἴσα θεῷ,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/006.yaml
  text: who[a], though he was in the form of God, did not consider equality with God something to be grasped[c][b],
translation:
  language: fr
  text: lui qui, bien qu’il fût dans la forme de Dieu[a], n’a pas considéré le fait d’être égal à Dieu[b] comme une chose à saisir[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « lui qui existait dans la forme de Dieu ». Le participe grec peut être compris comme concessif (« bien qu’il fût ») ou simplement comme l’indication d’un état (« existant »).
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « être à égalité avec Dieu ».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou « comme un avantage à exploiter » ; autre possibilité : « comme quelque chose à retenir jalousement ». Le sens du mot grec est discuté.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὃς
  choice: lui qui
  rationale: Cette tournure reprend naturellement en français le sujet du contexte précédent tout en conservant la proposition relative grecque.
- source_word: ἐν μορφῇ θεοῦ
  choice: dans la forme de Dieu
  rationale: « Forme » rend directement μορφή et préserve l’expression de Paul sans la remplacer par une formulation métaphysique plus tardive. La tournure reste intelligible, quoique volontairement marquée.
- source_word: ὑπάρχων
  choice: bien qu’il fût
  rationale: Le participe est compris dans un sens concessif, en raison du contraste avec l’abaissement décrit au verset suivant. La valeur stative demeure possible et figure en note.
- source_word: ἡγήσατο
  choice: n’a pas considéré
  rationale: ἡγέομαι signifie ici tenir ou considérer quelque chose comme tel ; cette traduction est naturelle et proche du grec.
- source_word: τὸ εἶναι ἴσα θεῷ
  choice: le fait d’être égal à Dieu
  rationale: Cette formulation française rend clairement la construction infinitive et la valeur d’égalité exprimée par ἴσα, sans transformer celle-ci en vocabulaire doctrinal ajouté.
- source_word: ἁρπαγμὸν
  choice: une chose à saisir
  rationale: Cette traduction garde l’image liée à la saisie et évite de trancher dans le texte principal la question très débattue de savoir s’il s’agit d’acquérir, de retenir ou d’exploiter un avantage. Les autres compréhensions sont signalées en note.
theological_decisions:
- issue: Portée christologique de ἐν μορφῇ θεοῦ
  choice: Conserver « dans la forme de Dieu ».
  alternative: « de condition divine » ou « dans la nature de Dieu »
  rationale: La traduction maintient la forte portée christologique du texte tout en conservant la formulation propre à Paul, sans lui substituer une définition doctrinale ultérieure.
- issue: Sens de ἁρπαγμός par rapport à l’égalité avec Dieu
  choice: Employer « une chose à saisir » dans le texte et présenter en note les sens contextuels concurrents.
  alternative: « un avantage à exploiter » ou « quelque chose à retenir jalousement »
  rationale: Le mot grec constitue une difficulté réelle. Le contexte de l’abaissement volontaire favorise pour beaucoup l’idée d’un avantage non exploité, mais la valeur de saisie ou de possession ne doit pas être effacée. Le texte principal reste donc proche de l’image lexicale et la note préserve la tension.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve le mouvement hymnique de la phrase et sa continuité avec le verset suivant. « Dans la forme de Dieu » est plus marqué que le français courant, mais ce choix permet de préserver la formulation grecque et son ambiguïté sans la réduire à une paraphrase confessionnelle.
