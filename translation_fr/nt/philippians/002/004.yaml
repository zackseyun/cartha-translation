id: PHP.2.4
reference: Philippians 2:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: μὴ τὰ ἑαυτῶν ⸀ἕκαστοι ⸀σκοποῦντες, ἀλλὰ καὶ τὰ ἑτέρων ⸁ἕκαστοι.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/004.yaml
  text: Each of you should look not only to your own interests[a], but also to the interests of others.
translation:
  language: fr
  text: Que chacun veille non seulement à ses propres intérêts[a], mais aussi à ceux des autres.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « Que chacun regarde non pas à ce qui lui est propre, mais aussi à ce qui est propre aux autres. »'
    reason: lexical_alternative
lexical_decisions:
- source_word: σκοποῦντες
  choice: veille
  rationale: Le verbe exprime ici une attention active portée à quelque chose. « Veiller à » rend naturellement en français l’idée de considérer avec soin et de prendre en compte.
- source_word: τὰ ἑαυτῶν
  choice: ses propres intérêts
  rationale: Le neutre pluriel désigne largement ce qui concerne chacun, et non seulement ses biens. « Ses propres intérêts » explicite ce sens sans le limiter aux possessions.
- source_word: ἕκαστοι
  choice: chacun
  rationale: Le pluriel distributif individualise les membres du groupe. « Chacun » en restitue clairement la portée.
- source_word: ἀλλὰ καὶ
  choice: non seulement… mais aussi
  rationale: Cette tournure française exprime clairement que les intérêts personnels ne sont pas exclus, mais que ceux des autres doivent également être pris en compte.
- source_word: τὰ ἑτέρων
  choice: ceux des autres
  rationale: Le pronom « ceux » reprend naturellement « intérêts » et traduit la référence large à ce qui concerne les autres.
theological_decisions:
- issue: Portée de la négation μὴ avec ἀλλὰ καί
  choice: « non seulement… mais aussi »
  alternative: « ne veille pas à ses propres intérêts, mais aussi à ceux des autres »
  rationale: 'Dans ce contexte, la construction est naturellement comprise comme un contraste additif : elle ne condamne pas toute attention à ses propres affaires, mais exige de prendre aussi en compte celles des autres. Cette formulation préserve cet équilibre.'
translation_notes:
  register: Français international moderne, clair et digne. L’impératif « Que chacun veille » transpose naturellement le participe grec dépendant du contexte exhortatif, tandis que la note conserve la forme plus littérale et l’ampleur de l’expression grecque.
