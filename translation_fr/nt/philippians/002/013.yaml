  source_fidelity: « Car » rend bien γάρ. « C’est Dieu qui est à l’œuvre en vous » restitue naturellement le sujet emphatique et le participe présent ὁ ἐνεργῶν, tout en conservant l’ambiguïté individuelle/communautaire de ἐν ὑμῖν. « Le vouloir et l’agir » correspond de manière fidèle aux deux infinitifs substantivés τὸ θέλειν et τὸ ἐνεργεῖν. « Pour son bon plaisir » est une traduction recevable de ὑπὲρ τῆς εὐδοκίας et la note signale correctement l’alternative « conformément à ».
