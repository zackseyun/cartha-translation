id: PHP.2.13
reference: Philippians 2:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸀θεὸς γάρ ἐστιν ὁ ἐνεργῶν ἐν ὑμῖν καὶ τὸ θέλειν καὶ τὸ ἐνεργεῖν ὑπὲρ τῆς εὐδοκίας.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/013.yaml
  text: For God is the one working in you both to will and to work for his good pleasure[a][b].
translation:
  language: fr
  text: Car c’est Dieu qui est à l’œuvre en vous pour produire à la fois le vouloir et l’agir[a], pour son bon plaisir[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « aussi bien la volonté que l’action ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « conformément à son bon plaisir ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: γάρ
  choice: Car
  rationale: Introduit la raison qui fonde l’exhortation précédente et conserve clairement la valeur explicative du lien logique.
- source_word: ὁ ἐνεργῶν
  choice: qui est à l’œuvre
  rationale: Rend le participe présent substantivé et son aspect continu dans un français naturel, sans réduire l’expression à une action ponctuelle.
- source_word: ἐν ὑμῖν
  choice: en vous
  rationale: Conserve l’ambiguïté possible entre l’action de Dieu en chaque croyant et son action au sein de la communauté.
- source_word: τὸ θέλειν
  choice: le vouloir
  rationale: L’infinitif substantivé désigne la volition. « Le vouloir » préserve ce sens et le parallélisme avec « l’agir ».
- source_word: τὸ ἐνεργεῖν
  choice: l’agir
  rationale: Rend l’infinitif substantivé de façon concise et maintient le parallélisme avec « le vouloir » ainsi que le lien lexical avec l’action de Dieu.
- source_word: ὑπὲρ τῆς εὐδοκίας
  choice: pour son bon plaisir
  rationale: « Pour » rend ici naturellement la visée ou l’intérêt exprimé par ὑπέρ avec le génitif. Le possessif renvoie à Dieu, sujet de la phrase, tandis que « bon plaisir » conserve la portée de εὐδοκία sans la réduire à un simple projet.
theological_decisions:
- issue: Action divine et vouloir/agIr humains
  choice: Dieu est présenté comme agissant en eux jusque dans « le vouloir et l’agir », sans atténuer aucun des deux éléments.
  alternative: Dieu donne seulement le désir ou seulement la capacité d’agir.
  rationale: Le grec attribue explicitement à l’action de Dieu aussi bien la volition que l’action. La formulation conserve cette tension sans préciser par quel mécanisme l’action divine et l’action humaine s’articulent.
- issue: Valeur de ὑπὲρ τῆς εὐδοκίας
  choice: pour son bon plaisir
  alternative: selon son bon plaisir
  rationale: La traduction principale conserve la valeur probable de but ou d’intérêt de ὑπέρ, tandis que la note signale la lecture normative traditionnellement possible.
translation_notes:
  register: Français international moderne, digne et accessible. « Être à l’œuvre » exprime naturellement une action continue; « le vouloir et l’agir » garde la formulation dense et le parallélisme du grec. La tournure « pour produire » explicite en français la relation entre ἐνεργῶν et les deux infinitifs substantivés sans définir davantage la manière dont Dieu agit.
