id: PHP.2.30
reference: Philippians 2:30
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὅτι διὰ τὸ ἔργον ⸀Χριστοῦ μέχρι θανάτου ἤγγισεν, ⸀παραβολευσάμενος τῇ ψυχῇ ἵνα ἀναπληρώσῃ τὸ ὑμῶν ὑστέρημα τῆς πρός με λειτουργίας.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/030.yaml
  text: because for the work of Messiah he came near to death[c][b][a], risking his life to make up for what was lacking in your service to me.
translation:
  language: fr
  text: car c’est pour l’œuvre du Messie[a][c] qu’il a frôlé la mort, risquant sa vie afin de suppléer ce qui manquait à votre service envers moi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « Christ ». Grec : « l’œuvre du Christ/Messie ».'
    reason: alternative_reading
  - marker: b
    text: « Ce qui manquait » désigne le service que les Philippiens, étant absents, ne pouvaient pas rendre eux-mêmes, et non un manque de bonne volonté de leur part.
    reason: cultural_note
  - marker: c
    text: 'Ou : « car c’est à cause de l’œuvre du Messie ».'
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τὸ ἔργον Χριστοῦ
  choice: pour l’œuvre du Messie
  rationale: Avec l’accusatif, διά exprime ici la cause ou le motif, avec la nuance « pour la cause de ». La tournure française garde ce lien avec l’œuvre accomplie au service du Messie.
- source_word: Χριστοῦ
  choice: du Messie
  rationale: Χριστός conserve ici sa valeur de titre. « Messie » en rend le sens, tandis qu’une note signale l’équivalent traditionnel « Christ ».
- source_word: μέχρι θανάτου ἤγγισεν
  choice: il a frôlé la mort
  rationale: Cette expression française naturelle rend l’idée d’être arrivé tout près de la mort sans alourdir la phrase.
- source_word: παραβολευσάμενος τῇ ψυχῇ
  choice: risquant sa vie
  rationale: Le participe décrit une exposition volontaire au danger. Dans ce contexte, ψυχή désigne la vie terrestre, non l’âme comme composante immatérielle.
- source_word: ἵνα ἀναπληρώσῃ
  choice: afin de suppléer
  rationale: La proposition introduite par ἵνα exprime le but. « Suppléer » indique qu’Épaphrodite a fourni personnellement ce que l’éloignement empêchait les Philippiens d’apporter.
- source_word: τὸ ὑμῶν ὑστέρημα
  choice: ce qui manquait
  rationale: La formulation décrit une absence pratique sans imputer aux Philippiens une faute morale ou un manque de bonne volonté.
- source_word: τῆς πρός με λειτουργίας
  choice: à votre service envers moi
  rationale: λειτουργία désigne ici l’aide ou le service concret rendu à Paul. « Service » reste assez large pour inclure le soutien matériel et le ministère exercé par Épaphrodite.
theological_decisions:
- issue: Traduction de Χριστοῦ dans une expression paulinienne
  choice: du Messie
  alternative: du Christ
  rationale: Le terme grec est un titre signifiant « Messie ». Le traduire ainsi en maintient la valeur sémantique, tout en indiquant en note la forme traditionnelle.
- issue: Portée de « ce qui manquait »
  choice: une présence ou une aide que l’éloignement rendait impossible
  alternative: une défaillance morale des Philippiens
  rationale: Le contexte présente favorablement le soutien des Philippiens et l’envoi d’Épaphrodite. Le manque est donc circonstanciel, sans reproche implicite.
translation_notes:
  register: Français international moderne, digne et accessible. « Frôlé la mort » et « risquant sa vie » sont idiomatiques sans être familiers. « Suppléer ce qui manquait » préserve l’idée de compléter une aide rendue impossible par la distance.
