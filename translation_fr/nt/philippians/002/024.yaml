  text: πέποιθα δὲ ἐν κυρίῳ ὅτι καὶ αὐτὸς ταχέως ἐλεύσομαι.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/024.yaml
  text: I am confident in the Lord that I myself will also come soon.
translation:
  language: fr
  text: 'J’ai confiance dans le Seigneur : je viendrai moi aussi bientôt.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « J’ai confiance dans le Seigneur que je viendrai moi-même aussi bientôt. »'
    reason: Alternative lexicale pour πέποιθα et autre placement français possible de l’emphase d’αὐτός et de l’addition de καί.
lexical_decisions:
- source_word: πέποιθα
  choice: j’ai confiance
  rationale: Le parfait exprime un état de confiance bien établi; le présent français « j’ai confiance » en rend naturellement la force actuelle.
- source_word: δὲ
  choice: mais
  rationale: La particule marque ici une légère transition, avec une nuance de contraste par rapport au projet concernant Timothée; « mais » explicite sobrement ce lien discursif.
- source_word: ἐν κυρίῳ
  choice: dans le Seigneur
  rationale: Cette formulation conserve l’expression paulinienne et présente le Seigneur comme la sphère ou le fondement de la confiance de Paul.
- source_word: ὅτι
  choice: que
  rationale: La conjonction introduit le contenu de la confiance de Paul.
- source_word: καὶ αὐτὸς
  choice: moi aussi
  rationale: « Moi » porte l’emphase personnelle d’αὐτός, tandis que « aussi » rend la valeur additive de καί par rapport à la venue projetée de Timothée.
- source_word: ταχέως
  choice: bientôt
  rationale: Dans ce contexte, l’adverbe indique la proximité temporelle plutôt que la rapidité du déplacement.
- source_word: ἐλεύσομαι
  choice: je viendrai
  rationale: Le futur de ἔρχομαι est rendu selon la perspective déictique de Paul s’adressant aux Philippiens.
- source_word: κυρίῳ
  choice: Seigneur
  rationale: « Seigneur » est le titre français usuel et convient à l’emploi paulinien de κύριος dans ce passage.
theological_decisions:
- issue: Nature de la confiance de Paul en relation avec le Seigneur
  choice: « j’ai confiance dans le Seigneur »
  alternative: « je compte sur le Seigneur pour que »
  rationale: Le choix retenu préserve l’expression paulinienne et l’idée que l’attente de Paul est fondée dans le Seigneur, sans transformer cette confiance en promesse révélée ni préciser indûment le mode de l’action divine.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation conserve l’idiome paulinien « dans le Seigneur » ainsi que l’emphase et l’addition exprimées par καὶ αὐτός.
