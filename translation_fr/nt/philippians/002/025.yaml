id: PHP.2.25
reference: Philippians 2:25
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἀναγκαῖον δὲ ἡγησάμην Ἐπαφρόδιτον τὸν ἀδελφὸν καὶ συνεργὸν καὶ συστρατιώτην μου, ὑμῶν δὲ ἀπόστολον καὶ λειτουργὸν τῆς χρείας μου, πέμψαι πρὸς ὑμᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/025.yaml
  text: But I considered it necessary to send to you Epaphroditus—my brother and fellow worker and fellow soldier[b][a], and your messenger and minister to my need—
translation:
  language: fr
  text: Mais j’ai estimé nécessaire de vous envoyer Épaphrodite, mon frère, mon collaborateur et mon compagnon d’armes, mais aussi votre envoyé[a] et celui qui prend soin de mes besoins[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « apôtre », c’est-à-dire quelqu’un que vous avez envoyé.'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « serviteur pour mes besoins ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀναγκαῖον
  choice: nécessaire
  rationale: Rend directement ce que Paul juge devoir être fait et s’associe naturellement en français à « j’ai estimé ».
- source_word: ἡγησάμην
  choice: j’ai estimé
  rationale: Exprime une appréciation réfléchie plutôt qu’une simple impression.
- source_word: πέμψαι
  choice: envoyer
  rationale: Le grec dit « envoyer » sans préciser explicitement « renvoyer » ; l’expansion contextuelle est donc évitée.
- source_word: ἀδελφὸν
  choice: frère
  rationale: Conserve le terme familial employé pour un compagnon dans la foi sans ajouter une explication absente du texte.
- source_word: συνεργὸν
  choice: collaborateur
  rationale: Terme français courant et digne pour quelqu’un qui travaille aux côtés de Paul.
- source_word: συστρατιώτην
  choice: compagnon d’armes
  rationale: Préserve clairement la métaphore militaire tout en restant idiomatique en français.
- source_word: ἀπόστολον
  choice: envoyé
  rationale: Dans ce contexte, Épaphrodite est le représentant envoyé par les Philippiens ; « envoyé » garde cette idée sans lui attribuer nécessairement la fonction technique d’apôtre.
- source_word: λειτουργὸν
  choice: celui qui me sert
  rationale: Rend la fonction de service avec naturel, sans suggérer à tort une charge ecclésiastique ou gouvernementale moderne attachée au mot français « ministre ».
- source_word: τῆς χρείας μου
  choice: dans le besoin
  rationale: Exprime la situation concrète dans laquelle Épaphrodite sert Paul tout en conservant le singulier du grec.
theological_decisions:
- issue: Faut-il donner à ἀπόστολον le sens technique d’« apôtre » ou le sens plus large d’« envoyé » ?
  choice: envoyé
  alternative: apôtre
  rationale: Le possessif « votre » et le contexte présentent Épaphrodite comme le représentant dépêché par l’Église de Philippes. « Envoyé » préserve ce sens sans exclure la traduction lexicale « apôtre », signalée en note.
translation_notes:
  register: Français international moderne, clair et digne. La répétition de « mais » reflète les deux δέ et met en relief le passage des liens d’Épaphrodite avec Paul (« mon ») à sa mission reçue des Philippiens (« votre »).
