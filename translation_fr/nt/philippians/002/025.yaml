  terminology: « Envoyé » convient ici pour ἀπόστολος et la note « apôtre » préserve l’alternative lexicale sans imposer un titre technique. « Compagnon d’armes » restitue bien la métaphore de συστρατιώτης. La note b doit cependant correspondre à une véritable alternative de λειτουργός sans introduire « votre », qui ne qualifie pas explicitement ce terme dans le grec.
