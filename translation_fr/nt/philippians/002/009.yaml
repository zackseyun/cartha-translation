id: PHP.2.9
reference: Philippians 2:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: διὸ καὶ ὁ θεὸς αὐτὸν ὑπερύψωσεν, καὶ ἐχαρίσατο αὐτῷ ⸀τὸ ὄνομα τὸ ὑπὲρ πᾶν ὄνομα,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/009.yaml
  text: Therefore God also highly exalted him and graciously gave him the name that is above every name[b][a],
translation:
  language: fr
  text: C’est pourquoi Dieu, lui aussi, l’a élevé au plus haut et lui a accordé par grâce[a] le nom qui est au-dessus de tout nom[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « lui a conféré ». Le verbe grec évoque un don accordé par grâce.
    reason: lexical_alternative
  - marker: b
    text: « Le nom » peut désigner non seulement un nom prononcé, mais aussi un statut, un rang ou un titre ; ce verset ne précise pas encore de quel nom il s’agit.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ καὶ
  choice: C’est pourquoi Dieu, lui aussi
  rationale: « C’est pourquoi » conserve la relation logique avec ce qui précède, tandis que « lui aussi » rend la valeur additive de καί sans alourdir la phrase.
- source_word: ὁ θεὸς
  choice: Dieu
  rationale: Le sujet grec est explicite et défini ; en français, le nom divin s’emploie normalement sans article dans ce contexte.
- source_word: ὑπερύψωσεν
  choice: l’a élevé au plus haut
  rationale: Cette formulation exprime la force intensive du verbe composé ὑπερυψόω tout en restant claire et naturelle en français moderne.
- source_word: ἐχαρίσατο
  choice: lui a accordé par grâce
  rationale: « Accordé » rend l’idée de don, et « par grâce » maintient le lien lexical avec χάρις, perceptible dans le verbe grec.
- source_word: τὸ ὄνομα
  choice: le nom
  rationale: Le grec dit explicitement « le nom ». La traduction ne le remplace pas par « titre » ou « rang », afin de préserver l’ouverture du texte.
- source_word: τὸ ὑπὲρ πᾶν ὄνομα
  choice: qui est au-dessus de tout nom
  rationale: La formulation conserve la structure comparative du grec et demeure idiomatique en français.
theological_decisions:
- issue: Identité du « nom »
  choice: Conserver « le nom » sans préciser lequel dans le texte principal.
  alternative: L’identifier explicitement au nom « Jésus » ou au titre divin « Seigneur » mentionné dans les versets suivants.
  rationale: Le verset 9 ne précise pas lui-même de quel nom il s’agit. La traduction préserve donc cette ouverture plutôt que d’introduire dans ce verset une conclusion tirée des versets 10–11.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure « élevé au plus haut » restitue l’intensité du grec sans archaïsme ; « accordé par grâce » rend explicite sa nuance de faveur gratuite.
