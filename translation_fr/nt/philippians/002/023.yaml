- from: J’espère donc vous l’envoyer dès que je verrai clairement comment les choses tournent pour moi.[a]
  to: Dès que je verrai clairement ce qu’il en est pour moi, j’espère donc vous l’envoyer sans délai.[a]
  rationale: La révision maintient le lien déductif de μὲν οὖν, l’espoir de Paul et le futur contingent de ὡς ἂν ἀφίδω. Elle rend séparément ἐξαυτῆς par « sans délai », sans restreindre indûment « ce qu’il en est pour moi » à une issue judiciaire précise.
