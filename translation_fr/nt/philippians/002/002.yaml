  source_fidelity: 'Le sens général est fidèlement rendu : l’impératif de πληρόω, les quatre expressions d’unité et la reprise de φρονέω sont conservés. Toutefois, « en pensant à une seule et même chose » tend à présenter τὸ ἓν comme l’objet d’une pensée (« penser à »), alors que φρονέω exprime plus naturellement une pensée, une disposition ou une orientation commune. « Unis d’âme » est intelligible, mais peu idiomatique en français international moderne.'
  naturalness: Une légère révision améliore la fluidité et l’idiomaticité sans perdre la structure participiale ni l’intensité de l’appel à l’unité.
  terminology: « amour » convient pour ἀγάπη. « être d’un même cœur » est une expression française naturelle qui rend l’unité intérieure exprimée par σύμψυχοι, sans lui attribuer un sens doctrinal technique. Les deux occurrences de φρονέω restent rendues par « penser ».
