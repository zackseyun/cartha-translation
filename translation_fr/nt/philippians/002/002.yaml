  rationale: 'La révision remplace deux tournures moins idiomatiques par un français moderne et garde les éléments essentiels du grec : la construction en « en », la répétition de « même », l’unité intérieure de σύμψυχοι et la cohésion lexicale créée par les deux emplois de φρονέω. Les notes signalent les alternatives pertinentes sans résoudre indûment l’ambiguïté entre pensée commune et orientation commune.'
