id: PHP.2.2
reference: Philippians 2:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: πληρώσατέ μου τὴν χαρὰν ἵνα τὸ αὐτὸ φρονῆτε, τὴν αὐτὴν ἀγάπην ἔχοντες, σύμψυχοι, τὸ ἓν φρονοῦντες,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/002.yaml
  text: complete my joy[a], so that you may think the same way, having the same love, being united in soul[c][b], thinking one thing.
translation:
  language: fr
  text: Rendez ma joie complète en pensant de la même manière[a], en ayant le même amour, en étant d’un même cœur[b] et en pensant tous à la même chose[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en ayant une même disposition d’esprit ».
    reason: lexical_alternative
  - marker: b
    text: 'Ou « unis dans une même âme » ; autre traduction possible : « unis de cœur ».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou « en ayant une même pensée » ; autre traduction possible : « en tendant ensemble vers un seul but ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πληρώσατέ μου τὴν χαρὰν
  choice: Rendez ma joie complète
  rationale: Cette formulation naturelle conserve l’image d’une joie portée à sa pleine mesure ainsi que la force de l’impératif aoriste.
- source_word: ἵνα
  choice: en
  rationale: Dans ce contexte, ἵνα introduit ce qui rendra la joie de Paul complète. La tournure française avec « en » exprime clairement ce rapport sans imposer une distinction trop rigide entre but, résultat et contenu.
- source_word: τὸ αὐτὸ φρονῆτε
  choice: en pensant de la même manière
  rationale: φρονέω désigne ici une orientation de pensée ou une disposition commune, et non une simple activité intellectuelle. Cette traduction reste claire tout en permettant une autre formulation en note.
- source_word: τὴν αὐτὴν ἀγάπην ἔχοντες
  choice: en ayant le même amour
  rationale: La traduction garde le participe, la répétition de « même » et le sens courant de ἀγάπη, sans préciser indûment l’objet de cet amour.
- source_word: σύμψυχοι
  choice: en étant unis d’âme
  rationale: Cette expression conserve l’image forte de ψυχή et l’idée d’une profonde unité intérieure. La légère singularité de la tournure reflète le caractère compact et évocateur du mot grec.
- source_word: τὸ ἓν φρονοῦντες
  choice: en pensant à une seule et même chose
  rationale: La formulation maintient la répétition de φρονέω et le parallélisme avec le début du verset, sans réduire nécessairement l’expression à un objectif pratique unique.
theological_decisions:
- issue: Portée de l’appel à penser de la même manière
  choice: Conserver les deux emplois de φρονέω par des formes de « penser »
  alternative: Traduire par « avoir une même disposition d’esprit » puis « tendre vers un seul but »
  rationale: La répétition grecque relie les deux expressions et souligne l’unité recherchée. La traduction retenue préserve ce lien sans transformer l’exhortation en exigence explicite d’uniformité doctrinale ou institutionnelle.
- issue: Sens de σύμψυχοι
  choice: unis d’âme
  alternative: unis de cœur ; ne formant qu’une seule âme
  rationale: Le choix garde l’image de l’âme et l’intensité de l’unité intérieure, tout en évitant de définir cette unité par une catégorie théologique particulière.
- issue: Sens de τὸ ἓν φρονοῦντες
  choice: pensant à une seule et même chose
  alternative: tendant ensemble vers un seul but
  rationale: Le grec peut évoquer une pensée commune ou une orientation commune. Le texte principal reste proche de la forme grecque, tandis que la note signale l’interprétation plus téléologique.
translation_notes:
  register: Français international moderne, digne et accessible. La structure répétitive en « en » rend le lien entre l’impératif principal et les expressions d’unité, tout en maintenant la cohésion créée par les deux occurrences de φρονέω. « Unis d’âme » est volontairement plus imagé que le français conversationnel afin de préserver la force de σύμψυχοι.
