  variant: modern international French
source:
  edition: SBLGNT
  text: τοῦτο ⸀φρονεῖτε ἐν ὑμῖν ὃ καὶ ἐν Χριστῷ Ἰησοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/005.yaml
  text: Have this mindset among yourselves[a], which was also in Messiah Jesus[b],
translation:
  language: fr
  text: Ayez entre vous cette attitude[a], qui était aussi dans le Messie Jésus[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ayez entre vous cette attitude que vous avez aussi dans le Messie Jésus. »'
    reason: alternative_reading
  - marker: b
    text: 'Grec : « Christ » ; le terme est rendu ici par « Messie » parce que Χριστός a valeur de titre.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο
  choice: cette
  rationale: Le démonstratif annonce la disposition décrite dans les versets suivants; il est naturellement intégré à «cette manière de penser» en français.
- source_word: φρονεῖτε
  choice: ayez cette manière de penser
  rationale: Le verbe désigne ici une orientation intérieure ou une disposition, et non une simple activité intellectuelle; l’impératif présent garde la force de l’exhortation.
- source_word: ἐν ὑμῖν
  choice: entre vous
  rationale: Le pronom pluriel et le contexte communautaire de 2.1-4 favorisent une portée collective, tout en laissant entendre que cette disposition doit caractériser chacun.
- source_word: ὃ
  choice: qui
  rationale: Le relatif rattache la manière de penser demandée à celle associée à Jésus, sans développer davantage la formulation grecque concise.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: dans le Messie Jésus
  rationale: La préposition est conservée afin de ne pas trancher entièrement la relation exprimée; Χριστός est rendu par son sens de titre, «Messie».
theological_decisions:
- issue: La proposition peut évoquer soit la manière de penser manifestée par Jésus comme modèle, soit celle que les croyants ont dans leur relation participative avec lui.
  choice: 'Lecture exemplaire: «qui était aussi dans le Messie Jésus».'
  alternative: 'Lecture participative: «que vous avez aussi dans le Messie Jésus».'
  rationale: Le passage qui suit présente l’abaissement du Messie, ce qui favorise la lecture exemplaire. Toutefois, l’ellipse grecque permet aussi une lecture liée à la participation au Messie; la note conserve cette tension.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure «manière de penser» exprime naturellement la portée dispositionnelle de φρονέω; «entre vous» maintient l’accent communautaire. L’ellipse et l’ambiguïté théologique du grec sont signalées en note.
