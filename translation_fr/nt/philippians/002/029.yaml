  text: προσδέχεσθε οὖν αὐτὸν ἐν κυρίῳ μετὰ πάσης χαρᾶς, καὶ τοὺς τοιούτους ἐντίμους ἔχετε,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/029.yaml
  text: So welcome him in the Lord with all joy[a], and hold people like him in honor.
translation:
  language: fr
  text: Accueillez-le donc dans le Seigneur avec une joie entière, et tenez en haute estime ceux qui sont comme lui[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « de telles personnes ». Le grec emploie ici une expression au masculin pluriel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσδέχεσθε
  choice: Accueillez
  rationale: L’impératif exprime une réception positive et chaleureuse, au-delà d’une simple acceptation.
- source_word: οὖν
  choice: donc
  rationale: « Donc » conserve naturellement la valeur déductive qui relie cette exhortation aux versets précédents.
- source_word: ἐν κυρίῳ
  choice: dans le Seigneur
  rationale: Cette formulation garde l’expression paulinienne concise et son sens relationnel et spirituel sans l’expliciter excessivement.
- source_word: μετὰ πάσης χαρᾶς
  choice: avec une joie entière
  rationale: Cette expression préserve l’idée de plénitude portée par πάσης tout en restant claire et digne en français.
- source_word: τοὺς τοιούτους
  choice: les hommes comme lui
  rationale: Le masculin pluriel grec désigne des personnes du même genre qu’Épaphrodite; « les hommes comme lui » conserve cette forme et rend explicite sa valeur représentative.
- source_word: ἐντίμους ἔχετε
  choice: tenez en haute estime
  rationale: Cette tournure idiomatique rend l’idée de considérer ces personnes comme honorables et dignes d’honneur, plutôt qu’un simple sentiment d’estime.
theological_decisions: []
translation_notes:
  register: Français moderne, courant et digne. L’expression paulinienne « dans le Seigneur » est conservée, tandis que « tenez en haute estime » rend naturellement la construction grecque.
