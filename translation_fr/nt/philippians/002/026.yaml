  text: ἐπειδὴ ἐπιποθῶν ἦν πάντας ⸀ὑμᾶς, καὶ ἀδημονῶν διότι ἠκούσατε ὅτι ἠσθένησεν.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/026.yaml
  text: since he was longing for all of you and was deeply distressed because you heard that he was sick[a].
translation:
  language: fr
  text: car il désirait ardemment vous voir tous et il était profondément bouleversé parce que vous aviez appris qu’il était malade[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, selon une autre lecture textuelle : « parce qu’il avait appris que vous aviez entendu dire qu’il était malade ».'
    reason: Une variante textuelle lit un verbe au singulier (« il avait appris ») au lieu de la deuxième personne du pluriel (« vous aviez appris »).
lexical_decisions:
- source_word: ἐπειδὴ
  choice: car
  rationale: Introduit naturellement en français la raison explicative du renvoi d’Épaphrodite.
- source_word: ἐπιποθῶν ἦν
  choice: il avait un profond désir de vous revoir
  rationale: La tournure périphrastique exprime un désir continu dans le passé. « Vous revoir » explicite naturellement en français le désir dirigé vers des personnes, sans modifier son objet.
- source_word: πάντας ὑμᾶς
  choice: vous revoir tous
  rationale: Conserve l’insistance de πάντας sur l’ensemble des destinataires.
- source_word: ἀδημονῶν
  choice: il était très inquiet
  rationale: Rend un état de vive détresse émotionnelle dans un français courant et digne, plus fort qu’une simple préoccupation.
- source_word: διότι
  choice: parce que
  rationale: Exprime directement la cause de son inquiétude.
- source_word: ἠκούσατε
  choice: vous aviez appris
  rationale: Le plus-que-parfait situe naturellement en français cette nouvelle antérieurement à son inquiétude dans le récit.
- source_word: ὅτι ἠσθένησεν
  choice: qu’il était malade
  rationale: Dans ce contexte, ἀσθενέω désigne une maladie physique; l’imparfait français rend idiomatiquement l’état dont les Philippiens avaient eu connaissance.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La phrase conserve la progression causale et l’intensité affective du grec. Le marqueur [a] figure dans le texte principal.
