id: PHP.2.16
reference: Philippians 2:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: λόγον ζωῆς ἐπέχοντες, εἰς καύχημα ἐμοὶ εἰς ἡμέραν Χριστοῦ, ὅτι οὐκ εἰς κενὸν ἔδραμον οὐδὲ εἰς κενὸν ἐκοπίασα.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/016.yaml
  text: holding fast the word of life[a], for a boast to me in the day of Messiah[b], that I did not run in vain or labor in vain.
translation:
  language: fr
  text: en tenant fermement la parole de vie[a], afin qu’au jour du Messie[b], j’aie sujet de fierté de n’avoir pas couru en vain ni travaillé en vain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « en présentant » ou « en offrant la parole de vie ».'
    reason: lexical_alternative
  - marker: b
    text: 'Traduction traditionnelle : « au jour du Christ ».'
    reason: alternative_reading
lexical_decisions:
- source_word: λόγον ζωῆς
  choice: la parole de vie
  rationale: 'Cette formulation compacte conserve les deux nuances possibles de λόγος : la parole qui donne la vie et le message concernant la vie.'
- source_word: ἐπέχοντες
  choice: en tenant fermement
  rationale: Dans le contexte immédiat d’obéissance persévérante, ce sens s’intègre bien à l’exhortation. Le sens possible « présenter » ou « offrir » est signalé en note.
- source_word: καύχημα ἐμοὶ
  choice: je pourrai être fier
  rationale: Cette tournure française naturelle exprime l’idée d’un motif légitime de fierté pour Paul, sans donner à « se vanter » une connotation nécessairement négative.
- source_word: εἰς ἡμέραν Χριστοῦ
  choice: au jour du Messie
  rationale: « Au jour » est idiomatique en français pour le moment eschatologique visé, et « Messie » maintient ici la valeur titulaire de Χριστός.
- source_word: οὐκ εἰς κενὸν
  choice: ne pas… en vain
  rationale: « En vain » rend clairement l’idée d’un effort sans résultat et préserve la répétition rhétorique grecque.
- source_word: ἔδραμον
  choice: avoir couru
  rationale: Le choix conserve la métaphore de la course employée par Paul pour son ministère.
- source_word: ἐκοπίασα
  choice: travaillé
  rationale: « Travailler » est naturel et digne en français courant; dans ce contexte, il désigne un labeur exigeant, en parallèle avec la course.
theological_decisions:
- issue: Valeur de Χριστοῦ dans l’expression eschatologique ἡμέραν Χριστοῦ
  choice: du Messie
  alternative: du Christ
  rationale: Dans cette expression, Χριστός garde sa portée de titre messianique. La traduction traditionnelle est conservée en note afin de ne pas masquer l’autre usage français établi.
- issue: Relation syntaxique de εἰς καύχημα ἐμοὶ εἰς ἡμέραν Χριστοῦ
  choice: Ainsi, au jour du Messie, je pourrai être fier
  alternative: pour être pour moi un sujet de fierté au jour du Messie
  rationale: La formulation choisie explicite avec naturel que la fidélité des Philippiens constituera pour Paul un motif de fierté au jour eschatologique, sans modifier le fond du rapport syntaxique.
translation_notes:
  register: Français international moderne, clair et digne. La phrase est légèrement restructurée pour éviter le calque « pour moi un sujet de fierté » tout en conservant le parallélisme final « en vain… en vain » et l’ambiguïté lexicale de ἐπέχοντες en note.
