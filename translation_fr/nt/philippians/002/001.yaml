id: PHP.2.1
reference: Philippians 2:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Εἴ τις οὖν παράκλησις ἐν Χριστῷ, εἴ τι παραμύθιον ἀγάπης, εἴ τις κοινωνία πνεύματος, εἴ τις σπλάγχνα καὶ οἰκτιρμοί,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/001.yaml
  text: So if there is any encouragement in Messiah[a], if any comfort from love, if any fellowship of the Spirit, if any affection and compassion,
translation:
  language: fr
  text: Ainsi, s’il y a quelque encouragement dans le Messie, quelque réconfort venant de l’amour, quelque communion de l’Esprit[a], quelque profonde affection et quelque compassion,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « participation à l’Esprit » ; moins probablement : « communion en esprit ».'
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: Ainsi
  rationale: Marque naturellement en français le lien logique avec l’exhortation précédente.
- source_word: παράκλησις
  choice: encouragement
  rationale: Dans cette série de motifs favorisant l’unité, le mot évoque un soutien qui réconforte et fortifie, sans le limiter à une exhortation.
- source_word: ἐν Χριστῷ
  choice: dans le Messie
  rationale: Conserve la préposition ἐν et rend Χριστός comme un titre, conformément à son sens de Messie.
- source_word: παραμύθιον
  choice: réconfort
  rationale: Exprime la consolation bienveillante et maintient une distinction avec παράκλησις, rendu par « encouragement ».
- source_word: ἀγάπης
  choice: venant de l’amour
  rationale: 'Explicite avec naturel la valeur probable du génitif : le réconfort qui procède de l’amour.'
- source_word: κοινωνία
  choice: communion
  rationale: Terme français courant dans ce contexte biblique, qui exprime une réalité partagée et un lien relationnel sans trancher à lui seul la relation précise avec πνεύματος.
- source_word: πνεύματος
  choice: de l’Esprit
  rationale: La référence à l’Esprit saint est la plus probable dans ce contexte, bien que la construction génitive permette plusieurs nuances.
- source_word: σπλάγχνα
  choice: profonde affection
  rationale: Rend idiomatiquement l’image des entrailles comme siège des sentiments intimes et tendres, sans conserver une formulation anatomique opaque.
- source_word: οἰκτιρμοί
  choice: compassion
  rationale: Exprime clairement en français moderne la sensibilité à la détresse d’autrui et complète sans se confondre avec l’affection.
theological_decisions:
- issue: Référence de πνεύματος et relation du génitif avec κοινωνία
  choice: communion de l’Esprit
  alternative: participation à l’Esprit ; communion dans un même esprit
  rationale: L’Esprit saint est probablement visé, mais le grec condensé peut désigner une communion produite ou accordée par l’Esprit, ou une participation à l’Esprit. La note conserve cette ambiguïté sans la résoudre artificiellement.
translation_notes:
  register: Français international moderne, fluide et digne. La structure répétitive de la protase grecque est conservée, tout en évitant de répéter « s’il y a » devant chaque élément. La virgule finale reflète que la phrase se poursuit au verset 2.
