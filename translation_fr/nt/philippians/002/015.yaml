reference: Philippians 2:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἵνα γένησθε ἄμεμπτοι καὶ ἀκέραιοι, τέκνα θεοῦ ⸂ἄμωμα μέσον⸃ γενεᾶς σκολιᾶς καὶ διεστραμμένης, ἐν οἷς φαίνεσθε ὡς φωστῆρες ἐν κόσμῳ
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/015.yaml
  text: so that you may become blameless and pure[a], children of God without blemish in the midst of a crooked and twisted generation[c][b], among whom you shine as lights in the world
translation:
  language: fr
  text: afin que vous deveniez irréprochables et purs, enfants de Dieu sans défaut au milieu d’une génération tortueuse et dévoyée[a], parmi eux vous brillez comme des lumières dans le monde[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « génération tortueuse et dévoyée » fait probablement écho à Deutéronome 32.5, où une génération corrompue est mise en contraste avec les enfants de Dieu.
    reason: cross_reference
  - marker: b
    text: 'Ou : « vous apparaissez comme des astres dans le monde » ; le verbe grec peut signifier « briller » ou « apparaître », et φωστῆρες peut désigner des lumières ou des astres.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα γένησθε
  choice: afin que vous deveniez
  rationale: « Afin que » exprime le but ou le résultat visé, et « deveniez » conserve la valeur dynamique de γίνομαι ainsi que la portée exhortative du passage.
- source_word: ἄμεμπτοι καὶ ἀκέραιοι
  choice: irréprochables et purs
  rationale: « Irréprochables » exprime l’absence de motif de blâme; « purs » rend de façon claire et actuelle l’idée d’intégrité morale portée par ἀκέραιοι.
- source_word: τέκνα θεοῦ
  choice: enfants de Dieu
  rationale: τέκνα désigne les enfants sans distinction de sexe; cette formulation est exacte et naturelle en français.
- source_word: ἄμωμα
  choice: sans défaut
  rationale: Cette expression préserve l’image de l’absence de défaut ou de tare et évite de répéter « irréprochables ».
- source_word: μέσον γενεᾶς σκολιᾶς καὶ διεστραμμένης
  choice: au milieu d’une génération tortueuse et pervertie
  rationale: La formulation maintient la situation des croyants au sein de leur génération et conserve la force morale des deux adjectifs grecs, sans les fondre en une seule idée.
- source_word: ἐν οἷς
  choice: parmi ses membres
  rationale: Le relatif grec renvoie aux personnes qui composent la génération. Cette explicitation évite en français l’ambiguïté de « parmi lesquels » tout en gardant le référent humain.
- source_word: φαίνεσθε
  choice: vous brillez
  rationale: Avec φωστῆρες, le sens lumineux de φαίνω est contextuellement naturel. Le sens possible « vous apparaissez » est conservé en note.
- source_word: φωστῆρες
  choice: lumières
  rationale: « Lumières » est compréhensible et conserve le champ sémantique lumineux sans limiter nécessairement le terme aux étoiles; « astres » reste une possibilité.
- source_word: ἐν κόσμῳ
  choice: dans le monde
  rationale: « Monde » convient au cadre humain et moral du passage, tout en conservant l’ampleur du grec κόσμος.
theological_decisions:
- issue: Lien de « sans défaut » avec « enfants de Dieu » et écho possible à Deutéronome 32.5
  choice: Rattacher directement « sans défaut » à « enfants de Dieu » et signaler l’écho scripturaire en note.
  alternative: Rattacher plus largement « sans défaut » à l’ensemble de la proposition, ou expliciter davantage l’allusion dans le texte principal.
  rationale: L’ordre et la syntaxe grecs favorisent le lien avec « enfants de Dieu ». La formulation maintient le contraste entre ces enfants et la génération environnante sans transformer l’allusion probable en citation explicite.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve le mouvement de la longue proposition grecque, tout en employant « parmi ses membres » pour rendre clairement le référent humain de ἐν οἷς. Les ambiguïtés de φαίνεσθε et φωστῆρες sont préservées dans une note plutôt que tranchées silencieusement.
