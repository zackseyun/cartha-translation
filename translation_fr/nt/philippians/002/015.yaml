    rationale: Le grec renvoie au pluriel aux personnes comprises dans la génération, mais ne formule pas « ses membres ». « Parmi eux » est idiomatique, fidèle et moins interprétatif.
  - severity: low
    issue: « Pervertie » risque d’induire une connotation moderne trop spécifique.
    rationale: διεστραμμένης exprime ce qui est détourné ou dévié. « Dévoyée » conserve la force morale et le parallélisme avec « tortueuse » sans cette restriction connotative.
