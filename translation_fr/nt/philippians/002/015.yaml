  rationale: La révision remplace une explicitation interprétative par « parmi eux » et emploie « dévoyée » pour rendre διεστραμμένης avec une portée morale large et naturelle en français moderne. Elle conserve la syntaxe, le contraste éthique et l’ambiguïté lexicale pertinente dans les notes.
