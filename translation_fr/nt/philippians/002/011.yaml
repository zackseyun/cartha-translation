id: PHP.2.11
reference: Philippians 2:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ πᾶσα γλῶσσα ἐξομολογήσηται ὅτι κύριος Ἰησοῦς Χριστὸς εἰς δόξαν θεοῦ πατρός.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/011.yaml
  text: and every tongue should confess that Jesus the Messiah is Lord[b][a], to the glory of God the Father.
translation:
  language: fr
  text: et que toute langue confesse que Jésus, le Messie[a], est Seigneur, à la gloire de Dieu le Père.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « que Jésus-Christ est Seigneur ».'
    reason: La forme traditionnelle « Christ » peut rendre Χριστός, tandis que le texte principal en traduit explicitement le sens par « le Messie ».
lexical_decisions:
- source_word: πᾶσα γλῶσσα
  choice: toute langue
  rationale: Cette formulation naturelle en français conserve l’image corporelle de la langue et la portée universelle de la confession.
- source_word: ἐξομολογήσηται
  choice: reconnaisse
  rationale: « Reconnaître » exprime ici l’aveu déclaré et public. Le subjonctif « reconnaisse », introduit par « que », maintient le lien avec la construction de but commencée au verset précédent.
- source_word: κύριος
  choice: Seigneur
  rationale: « Seigneur » est l’équivalent français établi et conserve la force christologique ainsi que l’écho probable aux textes scripturaires sur l’hommage universel.
- source_word: Χριστός
  choice: le Messie
  rationale: Le terme fonctionne comme un titre. « Le Messie » en transmet le sens en français moderne, plutôt que de le laisser sous la forme traditionnelle « Christ ».
- source_word: εἰς δόξαν
  choice: à la gloire de
  rationale: 'Expression française idiomatique qui conserve l’orientation exprimée par εἰς : cette confession aboutit à la gloire de Dieu.'
- source_word: θεοῦ πατρός
  choice: Dieu le Père
  rationale: Formulation française naturelle et consacrée, qui rend clairement l’expression grecque sans ajouter de ponctuation interprétative.
theological_decisions:
- issue: Valeur de Χριστός dans la confession christologique
  choice: Jésus, le Messie
  alternative: Jésus-Christ
  rationale: Le choix principal traduit le titre Χριστός et garde sa portée messianique explicite. La forme traditionnelle est signalée en note sans imposer une lecture doctrinale supplémentaire.
- issue: Relation entre Jésus Christ et κύριος
  choice: que Jésus, le Messie, est Seigneur
  alternative: que le Seigneur, c’est Jésus-Christ
  rationale: La formulation retenue conserve sobrement la proposition grecque et sa confession centrale, sans renforcer artificiellement la mise en relief du prédicat κύριος.
translation_notes:
  register: Français international moderne, digne et accessible. Le verset étant la suite de la proposition de but du verset 10, « et que » permet une lecture grammaticale naturelle. La virgule autour de « le Messie » marque l’apposition et évite l’expression peu idiomatique « Jésus le Messie ».
