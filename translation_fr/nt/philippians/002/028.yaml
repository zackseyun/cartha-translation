id: PHP.2.28
reference: Philippians 2:28
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: σπουδαιοτέρως οὖν ἔπεμψα αὐτὸν ἵνα ἰδόντες αὐτὸν πάλιν χαρῆτε κἀγὼ ἀλυπότερος ὦ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/028.yaml
  text: Therefore I sent him all the more eagerly, so that when you see him again you may rejoice, and I may be less distressed.
translation:
  language: fr
  text: C’est donc avec d’autant plus d’empressement que je l’ai envoyé, afin que vous vous réjouissiez de le revoir et que j’aie, moi aussi, moins de tristesse.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σπουδαιοτέρως
  choice: avec d’autant plus d’empressement
  rationale: Le comparatif exprime un empressement accru; cette tournure française en conserve naturellement la force.
- source_word: οὖν
  choice: donc
  rationale: Marque la conséquence ou la reprise logique de ce qui précède.
- source_word: ἔπεμψα
  choice: je l’ai envoyé
  rationale: Le passé composé convient au français moderne pour cet envoi passé dont la situation demeure pertinente.
- source_word: ἵνα
  choice: afin que
  rationale: Introduit clairement le but visé, dans un registre digne et courant.
- source_word: ἰδόντες αὐτὸν πάλιν
  choice: vous vous réjouissiez de le revoir
  rationale: Le participe aoriste et πάλιν sont rendus idiomatiquement par «de le revoir», sans perdre l’idée d’une nouvelle rencontre.
- source_word: χαρῆτε
  choice: vous vous réjouissiez
  rationale: Conserve le verbe de joie et sa résonance dans l’épître, tout en exprimant le but après «afin que».
- source_word: κἀγὼ
  choice: et que j’aie, moi aussi
  rationale: La crase καὶ ἐγώ coordonne Paul aux destinataires; «moi aussi» rend ici naturellement l’association implicite.
- source_word: ἀλυπότερος
  choice: moins de tristesse
  rationale: Le comparatif indique une diminution du chagrin, non sa disparition; la formulation nominale est naturelle en français.
- source_word: ὦ
  choice: j’aie
  rationale: Le subjonctif présent d’εἰμί est rendu par le subjonctif requis après «afin que», avec la tournure française «avoir moins de tristesse».
theological_decisions: []
translation_notes:
  register: Français international moderne, fluide et digne. La phrase garde le lien logique, le double but de l’envoi et le comparatif de ἀλυπότερος, qui indique que la tristesse de Paul est atténuée plutôt qu’entièrement supprimée.
