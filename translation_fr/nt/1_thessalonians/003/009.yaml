source:
  edition: SBLGNT
  text: τίνα γὰρ εὐχαριστίαν δυνάμεθα τῷ θεῷ ἀνταποδοῦναι περὶ ὑμῶν ἐπὶ πάσῃ τῇ χαρᾷ ᾗ χαίρομεν δι’ ὑμᾶς ἔμπροσθεν τοῦ θεοῦ ἡμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/009.yaml
  text: For what thanksgiving can we repay to God concerning you[a], for all the joy with which we rejoice because of you before our God,
translation:
  language: fr
  text: Car quelle action de grâce pouvons-nous rendre à Dieu à votre sujet[a], pour toute la joie que nous éprouvons à cause de vous devant notre Dieu ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de manière plus idiomatique : « Comment pourrions-nous assez remercier Dieu pour vous… ? » Le grec dit plus littéralement : « Quelle action de grâce pouvons-nous rendre à Dieu à votre sujet… ? »'
    reason: lexical_alternative
lexical_decisions:
- source_word: τίνα … εὐχαριστίαν
  choice: quelles actions de grâce
  rationale: L’interrogatif porte sur εὐχαριστίαν. Cette formulation conserve la question rhétorique et souligne l’impossibilité de trouver une reconnaissance à la mesure de la joie éprouvée.
- source_word: δυνάμεθα
  choice: pouvons-nous
  rationale: Rend naturellement la capacité exprimée par le verbe tout en maintenant la force interrogative.
- source_word: ἀνταποδοῦναι
  choice: rendre
  rationale: Le verbe évoque ce que l’on donne en retour. « Rendre des actions de grâce » préserve cette réciprocité sans suggérer aussi fortement qu’« acquitter » ou « rembourser » une dette littérale envers Dieu.
- source_word: περὶ ὑμῶν
  choice: à votre sujet
  rationale: περί avec le génitif indique ici ce qui motive ou concerne l’action de grâce. Cette traduction le distingue de δι’ ὑμᾶς, rendu plus loin par « à cause de vous ».
- source_word: ἐπὶ πάσῃ τῇ χαρᾷ
  choice: pour toute la joie
  rationale: ἐπί avec le datif indique ici le fondement ou l’occasion de l’action de grâce.
- source_word: ᾗ χαίρομεν
  choice: dont nous nous réjouissons
  rationale: Conserve la reprise expressive entre χαρά, « joie », et χαίρομεν, « nous nous réjouissons », malgré la légère redondance voulue.
- source_word: δι’ ὑμᾶς
  choice: à cause de vous
  rationale: διά avec l’accusatif exprime ici la cause de la joie.
- source_word: ἔμπροσθεν τοῦ θεοῦ ἡμῶν
  choice: devant notre Dieu
  rationale: Préserve simplement la métaphore spatiale qui désigne la présence de Dieu.
theological_decisions:
- issue: Valeur de l’action de grâce « rendue en retour » à Dieu
  choice: « rendre à Dieu » conserve l’idée d’une réponse reconnaissante à Dieu, tandis que la question rhétorique met l’accent sur l’insuffisance de toute expression de gratitude.
  alternative: « Comment pourrions-nous assez remercier Dieu pour vous ? »
  rationale: ἀνταποδοῦναι comporte explicitement l’idée de donner en retour. La formulation retenue garde cette image sans en faire une transaction ni une dette que l’être humain pourrait réellement solder.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition « joie… nous nous réjouissons » est maintenue afin de refléter l’insistance du grec. La phrase est ponctuée comme une question rhétorique complète.
