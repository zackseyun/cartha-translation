  text: Διὸ μηκέτι στέγοντες εὐδοκήσαμεν καταλειφθῆναι ἐν Ἀθήναις μόνοι,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/001.yaml
  text: Therefore[a], when we could bear it no longer, we were pleased to be left alone in Athens[b],
translation:
  language: fr
  text: C’est pourquoi, ne pouvant plus le supporter, nous avons jugé bon d’être laissés seuls à Athènes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διὸ
  choice: C’est pourquoi
  rationale: Introduit une conséquence tirée du contexte précédent et conserve clairement le lien logique.
- source_word: μηκέτι στέγοντες
  choice: ne pouvant plus le supporter
  rationale: Rend naturellement la limite de l’endurance émotionnelle exprimée par μηκέτι et στέγω, sans préciser davantage l’objet implicite.
- source_word: εὐδοκήσαμεν
  choice: nous avons jugé bon
  rationale: Exprime la décision favorable et volontaire portée par le verbe, dans un français naturel, sans suggérer que la situation leur procurait du plaisir.
- source_word: καταλειφθῆναι
  choice: rester
  rationale: Dans ce contexte, l’infinitif passif signifie qu’ils acceptent d’être laissés sur place; « rester » est idiomatique en français, tandis que la note conserve la forme passive plus littérale.
- source_word: ἐν Ἀθήναις
  choice: à Athènes
  rationale: Formulation locative française usuelle avec un nom de ville.
- source_word: μόνοι
  choice: seuls
  rationale: Préserve le pluriel grec et l’idée d’être sans les compagnons envoyés ailleurs.
theological_decisions:
- issue: Référent de la première personne du pluriel et tension avec le contexte plus large
  choice: Conserver « nous » et « seuls », conformément aux formes plurielles grecques.
  alternative: Comprendre un pluriel épistolaire renvoyant surtout à Paul, ou reformuler au singulier selon une reconstruction historique.
  rationale: Le grec emploie εὐδοκήσαμεν et μόνοι au pluriel. La traduction ne doit pas trancher la question de savoir si Paul parle uniquement de lui-même ou de plusieurs membres de l’équipe missionnaire.
translation_notes:
  register: Français international moderne, clair et digne. « Jugé bon » rend la décision volontaire sans la connotation potentiellement trompeuse de plaisir; la note signale la voix passive de καταλειφθῆναι.
