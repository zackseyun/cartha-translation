source:
  edition: SBLGNT
  text: διὰ τοῦτο παρεκλήθημεν, ἀδελφοί, ἐφ’ ὑμῖν ἐπὶ πάσῃ τῇ ⸂ἀνάγκῃ καὶ θλίψει⸃ ἡμῶν διὰ τῆς ὑμῶν πίστεως,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/007.yaml
  text: For this reason[a], brothers, concerning you, in all our distress and affliction[b], we were comforted through your faith.
translation:
  language: fr
  text: C’est pourquoi, frères et sœurs[a], nous avons été réconfortés à votre sujet, au milieu de toute notre détresse et de toute notre affliction, grâce à votre foi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « frères ». Chez Paul, cette manière habituelle de s’adresser à une assemblée peut inclure toute la communauté croyante.'
    reason: cultural_note
  - marker: b
    text: 'Ou : « fidélité ». Le mot grec peut désigner la foi, la confiance ou la fidélité; ici, il comprend probablement la persévérance des Thessaloniciens dans la foi.'
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: C’est pourquoi
  rationale: Cette formule naturelle en français marque le lien logique avec les nouvelles rapportées dans le contexte précédent.
- source_word: παρεκλήθημεν
  choice: nous avons été réconfortés
  rationale: Dans ce contexte d’épreuve, le passif exprime la consolation et le soulagement reçus à la nouvelle de la persévérance des Thessaloniciens.
- source_word: ἀδελφοί
  choice: frères et sœurs
  rationale: Le masculin pluriel grec sert ici d’adresse à l’ensemble de la communauté croyante; la formulation française explicite cette portée collective sans restreindre artificiellement les destinataires aux hommes.
- source_word: ἐφ’ ὑμῖν
  choice: à votre sujet
  rationale: Cette expression indique que les Thessaloniciens sont l’objet du réconfort de Paul et de ses compagnons, sans suggérer qu’ils sont la cause de leur détresse.
- source_word: ἐπὶ πάσῃ τῇ ἀνάγκῃ καὶ θλίψει ἡμῶν
  choice: au milieu de toute notre détresse et de toute notre affliction
  rationale: La formulation conserve les deux noms de souffrance et exprime clairement les circonstances dans lesquelles le réconfort a été reçu.
- source_word: ἀνάγκῃ
  choice: détresse
  rationale: Dans cette association avec θλίψει, le terme évoque une situation éprouvante et pressante plutôt qu’une simple nécessité.
- source_word: θλίψει
  choice: affliction
  rationale: Le mot rend la gravité de l’oppression ou de l’épreuve exprimée par θλῖψις, dans un registre digne et intelligible.
- source_word: διὰ τῆς ὑμῶν πίστεως
  choice: grâce à votre foi
  rationale: διά avec le génitif indique ici le moyen ou le motif du réconfort. « Grâce à » est naturel en français et attribue ce réconfort à la foi des destinataires.
- source_word: πίστεως
  choice: foi
  rationale: « Foi » conserve le sens principal de πίστις dans ce contexte, tout en laissant en note la nuance possible de fidélité ou de persévérance.
theological_decisions:
- issue: Portée communautaire de ἀδελφοί
  choice: frères et sœurs
  alternative: frères
  rationale: Dans l’usage épistolaire de Paul, l’appellatif masculin pluriel peut désigner toute l’assemblée. Le français explicite naturellement cette portée inclusive, tandis qu’une note signale la forme grecque.
- issue: Sens de πίστις lorsque la persévérance est également en vue
  choice: foi
  alternative: fidélité
  rationale: Le contexte concerne la confiance persistante des Thessaloniciens, laquelle manifeste aussi leur fidélité. Le texte principal garde « foi » et la note préserve l’autre nuance sans trancher indûment.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe place « à votre sujet » près du verbe de réconfort afin d’éviter de le rattacher à la détresse. Les deux termes grecs de souffrance sont maintenus, et les ambiguïtés de ἀδελφοί et πίστις sont documentées en notes.
