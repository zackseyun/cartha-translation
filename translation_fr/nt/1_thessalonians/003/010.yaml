  text: νυκτὸς καὶ ἡμέρας ὑπερεκπερισσοῦ δεόμενοι εἰς τὸ ἰδεῖν ὑμῶν τὸ πρόσωπον καὶ καταρτίσαι τὰ ὑστερήματα τῆς πίστεως ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/010.yaml
  text: night and day praying most earnestly to see your face and to supply what is lacking in your faith,[a]
translation:
  language: fr
  text: nuit et jour, nous prions avec une insistance extrême pour vous revoir en personne et compléter ce qui manque à votre foi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « apporter ce qui manque à votre foi ». Le grec peut aussi désigner, plus largement, ce qui doit encore être affermi ou mené à maturité dans votre foi.
    reason: lexical_alternative
lexical_decisions:
- source_word: νυκτὸς καὶ ἡμέρας
  choice: nuit et jour
  rationale: Cette expression adverbiale indique une activité répétée ou continuelle. « Nuit et jour » est l’expression française naturelle correspondante.
- source_word: ὑπερεκπερισσοῦ
  choice: avec la plus grande insistance
  rationale: Cet adverbe fortement intensif qualifie ici la prière. La formulation retenue en exprime la ferveur sans reproduire lourdement l’accumulation grecque.
- source_word: δεόμενοι
  choice: nous prions
  rationale: Le participe désigne une demande instante adressée à Dieu. Une proposition avec verbe conjugué donne une phrase française naturelle, l’intensité étant portée par le complément adverbial.
- source_word: εἰς τὸ ἰδεῖν ὑμῶν τὸ πρόσωπον
  choice: pour vous revoir en personne
  rationale: La construction exprime le but. Littéralement « voir votre visage », l’expression grecque évoque une rencontre personnelle; « revoir » convient au contexte d’une relation déjà établie, et « en personne » en restitue naturellement la valeur idiomatique.
- source_word: καταρτίσαι
  choice: compléter
  rationale: Le verbe peut signifier remettre en état, équiper ou mener à l’achèvement. Avec ce qui « manque », « compléter » conserve l’idée d’apporter ce qui est nécessaire sans suggérer que la foi est absente.
- source_word: τὰ ὑστερήματα
  choice: ce qui manque
  rationale: Le pluriel grec désigne les manques ou insuffisances. Le collectif singulier est plus idiomatique en français.
- source_word: τῆς πίστεως ὑμῶν
  choice: à votre foi
  rationale: Après « ce qui manque », le complément introduit par « à » est naturel en français. πίστις désigne ici leur foi ou confiance, déjà réelle mais encore susceptible d’être affermie.
theological_decisions:
- issue: Sens de πίστις
  choice: foi
  alternative: confiance; fidélité
  rationale: Dans ce contexte, il s’agit principalement de la foi des Thessaloniciens, que Paul souhaite fortifier ou compléter. « Fidélité » orienterait davantage le sens vers leur conduite, ce que le contexte n’impose pas.
- issue: Portée de καταρτίσαι τὰ ὑστερήματα
  choice: compléter ce qui manque à votre foi
  alternative: fortifier ce qui reste faible dans votre foi
  rationale: La traduction principale conserve directement l’image d’un manque à combler. La note maintient la portée plus large possible du grec, qui peut évoquer la mise en ordre, l’affermissement ou l’achèvement.
translation_notes:
  register: Français international moderne, naturel et digne. « Vous revoir en personne » rend l’idiome concret « voir votre visage » sans archaïsme; « avec la plus grande insistance » maintient la force exceptionnelle de l’adverbe grec.
