reference: 1 Thessalonians 3:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἄρτι δὲ ἐλθόντος Τιμοθέου πρὸς ἡμᾶς ἀφ’ ὑμῶν καὶ εὐαγγελισαμένου ἡμῖν τὴν πίστιν καὶ τὴν ἀγάπην ὑμῶν, καὶ ὅτι ἔχετε μνείαν ἡμῶν ἀγαθὴν πάντοτε ἐπιποθοῦντες ἡμᾶς ἰδεῖν καθάπερ καὶ ἡμεῖς ὑμᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/006.yaml
  text: But now that Timothy has come to us from you and has brought us the good news of your faith and love[a], and that you always have a good remembrance of us, longing to see us just as we also long to see you,
translation:
  language: fr
  text: Mais maintenant, Timothée est arrivé chez nous après avoir été chez vous et nous a apporté la bonne nouvelle de votre foi et de votre amour[a]. Il nous a aussi rapporté que vous gardez toujours un bon souvenir de nous et que vous désirez vivement nous revoir, tout comme nous désirons vous revoir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de votre fidélité ». Le mot grec peut désigner la foi, la confiance ou la fidélité.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἄρτι δὲ
  choice: Mais maintenant
  rationale: Rend à la fois la transition légèrement contrastive de δέ et l’actualité immédiate exprimée par ἄρτι, en lien avec l’inquiétude précédente.
- source_word: ἐλθόντος Τιμοθέου πρὸς ἡμᾶς ἀφ’ ὑμῶν
  choice: Timothée vient de nous revenir de chez vous
  rationale: Le tour « vient de » exprime naturellement en français l’arrivée toute récente suggérée par ἄρτι; « revenir de chez vous » rend clairement le mouvement depuis les Thessaloniciens vers Paul et ses compagnons.
- source_word: εὐαγγελισαμένου ἡμῖν
  choice: nous a apporté la bonne nouvelle
  rationale: Dans ce contexte, le verbe désigne le rapport favorable de Timothée. « Apporté la bonne nouvelle » reste idiomatique tout en conservant l’écho du vocabulaire de l’Évangile.
- source_word: τὴν πίστιν καὶ τὴν ἀγάπην ὑμῶν
  choice: votre foi et de votre amour
  rationale: « Foi » et « amour » sont les équivalents naturels de πίστις et ἀγάπη. La possibilité contextuelle de comprendre πίστις comme « fidélité » est conservée en note.
- source_word: μνείαν ἡμῶν ἀγαθὴν
  choice: vous gardez toujours un bon souvenir de nous
  rationale: Cette formulation française naturelle exprime l’idée d’un souvenir favorable sans durcir μνεία en simple mention verbale.
- source_word: ἐπιποθοῦντες ἡμᾶς ἰδεῖν
  choice: vous désirez vivement nous revoir
  rationale: « Désirez vivement » préserve l’intensité affective de ἐπιποθέω; « revoir » convient à des personnes qui se sont déjà rencontrées.
- source_word: καθάπερ καὶ ἡμεῖς ὑμᾶς
  choice: tout comme nous désirons vous revoir
  rationale: Le verbe sous-entendu en grec est répété pour produire une phrase française claire et maintenir la réciprocité du désir.
theological_decisions:
- issue: Sens de πίστις dans un contexte où « foi » et « fidélité » sont toutes deux possibles
  choice: votre foi
  alternative: votre fidélité
  rationale: « Foi » conserve le sens habituel de la confiance envers Dieu et correspond bien à la persévérance des Thessaloniciens. « Fidélité » demeure toutefois une nuance lexicale possible, signalée en note afin de ne pas supprimer l’ambiguïté réelle.
translation_notes:
  register: Français international moderne, naturel et digne. La longue construction participiale grecque est répartie en deux phrases pour assurer la clarté sans perdre les rapports logiques. Le ton affectueux et le parallélisme réciproque sont préservés.
