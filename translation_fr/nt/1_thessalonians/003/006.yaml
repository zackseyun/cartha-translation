  to: Mais maintenant, Timothée est arrivé chez nous après avoir été chez vous et nous a apporté la bonne nouvelle de votre foi et de votre amour[a]. Il nous a aussi rapporté que vous gardez toujours un bon souvenir de nous et que vous désirez vivement nous revoir, tout comme nous désirons vous revoir.
  rationale: La seule correction remplace « nous revenir », qui ajoutait une idée de retour non explicitée par ἐλθόντος ... πρὸς ἡμᾶς ἀφ’ ὑμῶν, par une formulation française naturelle exprimant l’arrivée de Timothée auprès de Paul après son séjour chez les Thessaloniciens. Le reste conserve les choix fidèles du projet, y compris l’ambiguïté signalée en note pour πίστις.
