    text: Ou « de votre fidélité ». Le mot grec peut désigner la foi, la confiance ou la fidélité.
    reason: alternative_reading
  revision_rationale: La seule correction remplace « nous revenir », qui ajoutait une idée de retour non explicitée par ἐλθόντος ... πρὸς ἡμᾶς ἀφ’ ὑμῶν, par une formulation française naturelle exprimant l’arrivée de Timothée auprès de Paul après son séjour chez les Thessaloniciens. Le reste conserve les choix fidèles du projet, y compris l’ambiguïté signalée en note pour πίστις.
