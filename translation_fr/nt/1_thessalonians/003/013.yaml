reference: 1 Thessalonians 3:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἰς τὸ στηρίξαι ὑμῶν τὰς καρδίας ἀμέμπτους ἐν ἁγιωσύνῃ ἔμπροσθεν τοῦ θεοῦ καὶ πατρὸς ἡμῶν ἐν τῇ παρουσίᾳ τοῦ κυρίου ἡμῶν ⸀Ἰησοῦ μετὰ πάντων τῶν ἁγίων ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/013.yaml
  text: so that he may establish your hearts blameless in holiness before our God and Father at the coming of our Lord Jesus with all his holy ones[a].
translation:
  language: fr
  text: afin qu’il affermisse vos cœurs et qu’ils soient irréprochables dans la sainteté devant notre Dieu et Père, lors de la venue de notre Seigneur Jésus avec tous ses saints[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avec tous ceux qui lui appartiennent et qui sont saints ». Le grec peut désigner ici des personnes saintes, des anges, ou les deux.
    reason: alternative_reading
lexical_decisions:
- source_word: εἰς τὸ στηρίξαι
  choice: afin qu’il affermisse
  rationale: La construction εἰς τό suivie de l’infinitif exprime ici le but ou le résultat découlant du verset précédent. Une proposition personnelle au subjonctif est naturelle en français et en conserve la valeur finale.
- source_word: στηρίξαι
  choice: affermisse
  rationale: « Affermir » exprime l’idée de rendre ferme et stable, tout en convenant naturellement aux « cœurs » dans le registre paulinien.
- source_word: καρδίας
  choice: cœurs
  rationale: « Cœurs » conserve l’image biblique de l’être intérieur, sans la réduire aux émotions ou à l’intellect.
- source_word: ἀμέμπτους
  choice: irréprochables
  rationale: Le terme désigne ce qui ne donne prise à aucun reproche légitime. La proposition « pour qu’ils soient » explicite en français la relation prédicative avec « vos cœurs » sans en changer le sens.
- source_word: ἐν ἁγιωσύνῃ
  choice: dans la sainteté
  rationale: Le nom désigne la sainteté comme état ou qualité. Cette formulation est claire, digne et non technique.
- source_word: ἔμπροσθεν τοῦ θεοῦ καὶ πατρὸς ἡμῶν
  choice: devant notre Dieu et Père
  rationale: « Devant » rend la comparution sous le regard de Dieu, tandis que « notre Dieu et Père » respecte la coordination grecque.
- source_word: ἐν τῇ παρουσίᾳ
  choice: lors de la venue
  rationale: Dans ce contexte eschatologique, παρουσία désigne la venue ou l’arrivée future du Seigneur. « Lors de » exprime naturellement la valeur temporelle de ἐν.
- source_word: τοῦ κυρίου ἡμῶν Ἰησοῦ
  choice: de notre Seigneur Jésus
  rationale: La formulation française conserve le titre christologique κύριος et le nom propre sans ajout absent du texte grec.
- source_word: μετὰ πάντων τῶν ἁγίων αὐτοῦ
  choice: avec tous ses saints
  rationale: « Saints » est le terme biblique français le plus concis pour ἅγιοι et peut, avec la note, conserver l’indétermination du référent plutôt que de préciser qu’il s’agit d’humains ou d’anges.
theological_decisions:
- issue: Référent de « tous ses saints »
  choice: Maintien de « tous ses saints » sans identifier davantage le groupe
  alternative: « avec tous ses anges » ou « avec tous les croyants qui lui appartiennent »
  rationale: Dans ce cadre eschatologique, le grec ἁγίων peut désigner des êtres humains consacrés à Dieu, des anges, ou éventuellement les deux. Le verset ne tranche pas explicitement; la traduction maintient donc cette tension.
translation_notes:
  register: Français international moderne, naturel et digne. « Affermir les cœurs », « sainteté » et « Seigneur » maintiennent le registre biblique sans archaïsme excessif. La reprise « pour qu’ils soient » évite l’ambiguïté syntaxique qu’aurait en français une simple apposition après « vos cœurs ».
