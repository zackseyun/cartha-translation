source:
  edition: SBLGNT
  text: καὶ ἐπέμψαμεν Τιμόθεον, τὸν ἀδελφὸν ἡμῶν καὶ ⸀συνεργὸν τοῦ ⸀θεοῦ ἐν τῷ εὐαγγελίῳ τοῦ Χριστοῦ, εἰς τὸ στηρίξαι ὑμᾶς καὶ παρακαλέσαι ⸀ὑπὲρ τῆς πίστεως ὑμῶν
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/002.yaml
  text: and we sent Timothy[a], our brother and God's fellow worker in the gospel of the Messiah, to strengthen you and to encourage you concerning your faith[b],
translation:
  language: fr
  text: et nous avons envoyé Timothée, notre frère et collaborateur de Dieu[a] dans l’Évangile du Messie[b], pour vous affermir et vous encourager au sujet de votre foi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « collaborateur avec Dieu ». Certains manuscrits présentent ici une formulation différente, telle que « serviteur de Dieu ».'
    reason: alternative_reading
  - marker: b
    text: 'Grec : « Christ ». Ici, le terme est rendu par « Messie » parce qu’il garde nettement sa valeur de titre.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέμψαμεν
  choice: nous avons envoyé
  rationale: L’aoriste narratif de πέμπω se rend naturellement par le passé composé en français moderne.
- source_word: ἀδελφὸν ἡμῶν
  choice: notre frère
  rationale: Cette formulation conserve la métaphore familiale et la force relationnelle du grec sans l’expliciter inutilement.
- source_word: συνεργὸν τοῦ θεοῦ
  choice: collaborateur de Dieu
  rationale: Cette traduction reste proche du génitif grec et préserve l’expression forte du texte sans la remplacer par une formulation théologiquement atténuée.
- source_word: ἐν τῷ εὐαγγελίῳ τοῦ Χριστοῦ
  choice: dans la bonne nouvelle du Messie
  rationale: « Dans » exprime ici le domaine d’activité de Timothée. Le génitif est conservé sans décider si la bonne nouvelle vient du Messie ou porte sur lui.
- source_word: εἰς τὸ στηρίξαι
  choice: pour vous affermir
  rationale: La construction exprime le but. « Affermir » est naturel dans ce contexte pastoral et rend l’idée de rendre ferme ou stable.
- source_word: παρακαλέσαι
  choice: vous encourager
  rationale: Dans le contexte d’une foi éprouvée, « encourager » rend la portée pastorale de παρακαλέω sans la limiter à la consolation ou à l’exhortation.
- source_word: ὑπὲρ τῆς πίστεως ὑμῶν
  choice: au sujet de votre foi
  rationale: Cette formulation préserve le sens relationnel de ὑπέρ, « concernant », tout en laissant possible la nuance d’un soutien en faveur de leur foi.
- source_word: πίστεως
  choice: foi
  rationale: Ici, πίστις désigne principalement la foi des Thessaloniciens, leur confiance croyante, plutôt que leur fidélité comme qualité morale.
theological_decisions:
- issue: Sens et variante textuelle de συνεργὸν τοῦ θεοῦ
  choice: collaborateur de Dieu
  alternative: collaborateur avec Dieu ; serviteur de Dieu
  rationale: Le texte SBLGNT porte συνεργὸν τοῦ θεοῦ. La traduction conserve cette expression théologiquement forte. Une note signale à la fois une autre analyse possible du génitif et les formulations différentes attestées dans certains manuscrits.
- issue: Traduction de Χριστοῦ
  choice: du Messie
  alternative: du Christ
  rationale: Χριστός garde ici sa valeur de titre. « Messie » en communique directement le sens, tandis que la forme traditionnelle « Christ » est signalée en note.
translation_notes:
  register: Français international moderne, naturel et digne. « Bonne nouvelle » est retenu pour εὐαγγέλιον afin de rester immédiatement compréhensible, et « affermir » conserve la tonalité pastorale et soutenue du passage.
