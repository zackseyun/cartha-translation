  text: Αὐτὸς δὲ ὁ θεὸς καὶ πατὴρ ἡμῶν καὶ ὁ κύριος ἡμῶν ⸀Ἰησοῦς κατευθύναι τὴν ὁδὸν ἡμῶν πρὸς ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/011.yaml
  text: May our God and Father himself[a], and our Lord Jesus[b], direct our way to you.
translation:
  language: fr
  text: Que notre Dieu et Père lui-même, et notre Seigneur Jésus, nous conduisent jusqu’à vous[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: En grec, le verbe traduit par « nous conduisent » est au singulier, bien qu’il ait pour sujets coordonnés « notre Dieu et Père » et « notre Seigneur Jésus ». Littéralement, il est question de diriger ou de rendre droit « notre chemin vers vous ».
    reason: cross_reference
lexical_decisions:
- source_word: Αὐτὸς
  choice: lui-même
  rationale: L’emploi intensif d’αὐτός souligne que Dieu en personne est le sujet de cette demande. « Lui-même » conserve naturellement cette insistance en français.
- source_word: δὲ
  choice: non exprimé séparément
  rationale: δέ marque ici une transition légère vers une prière, sans opposition forte. En français, le passage à la tournure optative « Que… » suffit à signaler cette transition ; ajouter « maintenant » introduirait une nuance temporelle absente du grec.
- source_word: ὁ θεὸς καὶ πατὴρ ἡμῶν
  choice: notre Dieu et Père
  rationale: Les deux noms désignent un même référent. Cette formulation respecte l’ordre grec tout en restant naturelle et digne en français.
- source_word: ὁ κύριος ἡμῶν Ἰησοῦς
  choice: notre Seigneur Jésus
  rationale: La traduction conserve le possessif ἡμῶν, rend κύριος par « Seigneur » et n’ajoute pas « Christ », absent du texte grec.
- source_word: κατευθύναι
  choice: nous ouvrent
  rationale: Dans ce contexte de déplacement empêché, l’expression idiomatique « nous ouvrir le chemin » traduit l’idée de diriger ou de rendre praticable la route, tout en formulant naturellement la prière exprimée par l’optatif aoriste.
- source_word: τὴν ὁδὸν ἡμῶν
  choice: le chemin
  rationale: ὁδός peut désigner la route concrète ou le moyen d’accomplir le voyage. Avec « nous ouvrent », « le chemin » restitue naturellement l’idée de « notre voie » sans imposer une lecture uniquement figurée.
- source_word: πρὸς ὑμᾶς
  choice: jusqu’à vous
  rationale: πρός avec l’accusatif indique ici la destination du déplacement. « Jusqu’à vous » exprime clairement cette orientation dans le contexte du voyage projeté.
theological_decisions:
- issue: Verbe grec au singulier avec les deux sujets coordonnés « notre Dieu et Père » et « notre Seigneur Jésus »
  choice: Nommer clairement les deux sujets et employer le pluriel exigé par le français courant, avec une note signalant le singulier grec.
  alternative: Employer une construction telle que « notre Dieu et Père lui-même, avec notre Seigneur Jésus, nous ouvre », qui maintiendrait un verbe français au singulier mais affaiblirait la coordination égale des deux sujets.
  rationale: Le grec associe le Père et le Seigneur Jésus comme sujets d’un seul verbe au singulier. Un calque au singulier après deux sujets coordonnés serait fautif ou trompeur en français moderne. Le texte principal conserve donc les deux sujets sans les hiérarchiser, tandis que la note préserve cette particularité grammaticale et sa tension théologique.
translation_notes:
  register: Français international moderne, naturel et digne. La tournure de souhait « Que… » rend l’optatif grec. « Nous ouvrent le chemin » est plus idiomatique que le calque « dirigent notre chemin », tandis que la note conserve les nuances possibles de κατευθύναι et ὁδός.
