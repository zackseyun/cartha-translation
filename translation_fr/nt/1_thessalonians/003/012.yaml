id: 1TH.3.12
reference: 1 Thessalonians 3:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὑμᾶς δὲ ὁ κύριος πλεονάσαι καὶ περισσεύσαι τῇ ἀγάπῃ εἰς ἀλλήλους καὶ εἰς πάντας, καθάπερ καὶ ἡμεῖς εἰς ὑμᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/012.yaml
  text: And may the Lord cause you to increase and abound in love for one another and for all[a], just as we also do for you[b],
translation:
  language: fr
  text: Que le Seigneur vous fasse croître et abonder dans l’amour les uns pour les autres et pour tous[a], tout comme nous aussi en avons pour vous[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les uns envers les autres et envers tous ».
    reason: lexical_alternative
  - marker: b
    text: 'La dernière proposition est elliptique en grec, littéralement : « tout comme nous aussi envers vous »; le complément sous-entendu est repris de ce qui précède.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ κύριος
  choice: le Seigneur
  rationale: Le titre courant « Seigneur » préserve la formulation grecque sans préciser dans la traduction si le référent doit être explicitement identifié au Christ ou à Dieu de manière plus générale.
- source_word: πλεονάσαι
  choice: vous fasse croître
  rationale: L’optatif exprime ici un souhait ou une prière. Avec le Seigneur pour sujet et « vous » pour complément, « vous fasse croître » rend clairement la valeur causative.
- source_word: περισσεύσαι
  choice: abonder
  rationale: Le verbe renforce πλεονάσαι en exprimant la surabondance. « Croître et abonder » conserve les deux verbes et leur intensification rhétorique.
- source_word: τῇ ἀγάπῃ
  choice: dans l’amour
  rationale: Le datif indique le domaine dans lequel cette croissance doit s’accomplir. « Dans l’amour » est à la fois fidèle, naturel et théologiquement non restrictif.
- source_word: εἰς ἀλλήλους
  choice: les uns pour les autres
  rationale: Dans ce contexte relationnel, εἰς marque l’orientation de l’amour. « Pour » est idiomatique en français moderne, tandis que la note signale la possibilité plus littérale « envers ».
- source_word: καὶ εἰς πάντας
  choice: et pour tous
  rationale: « Tous » maintient l’étendue ouverte de πάντας sans la limiter explicitement à tous les croyants ni l’expliciter en « tous les êtres humains ».
- source_word: καθάπερ καὶ ἡμεῖς εἰς ὑμᾶς
  choice: tout comme nous aussi en avons pour vous
  rationale: La proposition grecque est elliptique. Le pronom « en » reprend naturellement « de l’amour » en français et complète l’ellipse sans répéter ni préciser excessivement les verbes précédents.
- source_word: δὲ
  choice: Que
  rationale: La particule δέ assure une transition souple dans la prière. En français, l’ouverture optative par « Que » porte naturellement la phrase; ajouter « et » hors contexte immédiat serait moins fluide dans un verset présenté isolément.
theological_decisions:
- issue: Référent de « Seigneur »
  choice: Conserver simplement « le Seigneur »
  alternative: Identifier explicitement le Seigneur au Christ, ou formuler une référence divine plus générale
  rationale: Le grec emploie le titre κύριος sans expansion. La traduction préserve cette formulation et laisse le contexte déterminer le référent.
- issue: Portée de πάντας
  choice: Conserver le terme général « tous »
  alternative: « tous les êtres humains » ou « tous les croyants »
  rationale: Même si le mouvement de la phrase semble élargir l’amour au-delà de la communauté, πάντας ne précise pas lui-même le groupe visé. « Tous » en conserve l’ampleur et l’ambiguïté.
translation_notes:
  register: Français international moderne, digne et accessible. « Croître et abonder » conserve le parallélisme soutenu du grec sans archaïsme excessif. La formulation de la dernière proposition reste naturelle en français tout en signalant l’ellipse grecque dans une note.
