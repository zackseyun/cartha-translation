id: 1TH.3.5
reference: 1 Thessalonians 3:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: διὰ τοῦτο κἀγὼ μηκέτι στέγων ἔπεμψα εἰς τὸ γνῶναι τὴν πίστιν ὑμῶν, μή πως ἐπείρασεν ὑμᾶς ὁ πειράζων καὶ εἰς κενὸν γένηται ὁ κόπος ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/005.yaml
  text: For this reason[a], when I could bear it no longer, I sent to learn about your faith[b], lest somehow the tempter had tempted you and our labor might be in vain.
translation:
  language: fr
  text: C’est pourquoi, moi aussi, ne pouvant plus y tenir, j’ai envoyé pour prendre des nouvelles de votre foi[a]. Je craignais que le tentateur ne vous ait tentés et que notre peine ne devienne vaine[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de votre fidélité » ou « de votre confiance ». Le mot grec peut réunir plusieurs de ces nuances selon le contexte.
    reason: alternative_reading
  - marker: b
    text: Ou « sans résultat » ou « inutile ». Littéralement, « ne devienne vide ».
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: C’est pourquoi
  rationale: Rend naturellement le lien causal et rétrospectif avec ce qui précède.
- source_word: κἀγὼ
  choice: moi aussi
  rationale: Exprime explicitement l’élément καί et l’accent porté sur Paul dans ce contexte.
- source_word: μηκέτι στέγων
  choice: ne pouvant plus attendre
  rationale: Formulation française idiomatique qui communique que Paul était arrivé à la limite de ce qu’il pouvait supporter, sans suggérer une simple attente passive.
- source_word: ἔπεμψα
  choice: j’ai envoyé quelqu’un
  rationale: Le complément d’objet est implicite dans le grec et renvoie contextuellement à Timothée; « quelqu’un » évite toutefois d’introduire ici son nom.
- source_word: εἰς τὸ γνῶναι
  choice: prendre des nouvelles de
  rationale: Rend idiomatiquement l’idée de chercher à savoir où en était leur foi.
- source_word: τὴν πίστιν ὑμῶν
  choice: votre foi
  rationale: « Foi » est le sens contextuel le plus naturel de πίστις, tout en laissant en note les nuances possibles de confiance et de fidélité.
- source_word: μή πως
  choice: Je craignais que
  rationale: Exprime en français naturel la crainte qui motive l’envoi, plutôt qu’un calque syntaxique lourd.
- source_word: ἐπείρασεν ὑμᾶς ὁ πειράζων
  choice: le tentateur ne vous ait tentés
  rationale: Conserve la répétition lexicale volontaire entre le participe substantivé et le verbe, ainsi que l’antériorité possible de l’action redoutée.
- source_word: εἰς κενὸν γένηται ὁ κόπος ἡμῶν
  choice: notre peine n’ait été inutile
  rationale: Rend naturellement en français l’idée d’un effort pénible qui aurait finalement été sans résultat.
- source_word: ὁ κόπος ἡμῶν
  choice: notre peine
  rationale: « Peine » communique ici le travail éprouvant et coûteux évoqué par κόπος.
theological_decisions:
- issue: Sens de πίστις dans l’expression τὴν πίστιν ὑμῶν
  choice: votre foi
  alternative: votre fidélité; votre confiance
  rationale: Dans ce contexte, Paul s’inquiète surtout de la persévérance des Thessaloniciens dans leur réponse croyante à l’Évangile. Les autres nuances lexicales restent possibles et sont signalées sans être imposées au texte.
- issue: Identité de ὁ πειράζων
  choice: le tentateur
  alternative: celui qui tente; celui qui met à l’épreuve
  rationale: Le grec emploie un titre descriptif plutôt que le nom « Satan ». « Le tentateur » conserve cette formulation et, dans le contexte, l’idée d’une incitation à abandonner la foi.
- issue: Portée de la crainte exprimée par μή πως avec les subjonctifs
  choice: Je craignais que le tentateur ne vous ait tentés et que notre peine n’ait été inutile
  alternative: de peur que le tentateur ne vous ait tentés et que notre peine ne devienne inutile
  rationale: La formulation choisie préserve l’incertitude de Paul quant à ce qui avait pu arriver avant le retour de Timothée, sans affirmer que la tentation avait effectivement réussi.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase grecque est scindée en deux pour la clarté. Le « ne » après « craignais que » est explétif et ne nie pas les verbes. Les marqueurs [a] et [b] figurent tous deux dans le texte principal.
