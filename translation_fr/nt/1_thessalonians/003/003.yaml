source:
  edition: SBLGNT
  text: τὸ μηδένα σαίνεσθαι ἐν ταῖς θλίψεσιν ταύταις. αὐτοὶ γὰρ οἴδατε ὅτι εἰς τοῦτο κείμεθα·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/003.yaml
  text: so that no one would be shaken by these afflictions[c][b][a]. For you yourselves know that we are appointed for this.
translation:
  language: fr
  text: afin que personne ne soit ébranlé[a] par ces détresses[b]. En effet, vous savez vous-mêmes que nous sommes destinés à cela[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « troublé » ou « déstabilisé » ; dans d’autres contextes, le verbe grec rare peut aussi signifier « trompé » ou « gagné par la flatterie ».
    reason: lexical_alternative
  - marker: b
    text: Ou « tribulations » ou « épreuves ».
    reason: lexical_alternative
  - marker: c
    text: Ou « établis pour cela » ou « placés là pour cela ».
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ μηδένα σαίνεσθαι
  choice: afin que personne ne soit ébranlé
  rationale: L’infinitif articulé exprime ici le but en lien avec le verset précédent. « Être ébranlé » rend naturellement l’idée contextuelle d’être déstabilisé par les épreuves, tout en laissant en note les autres sens possibles de ce verbe rare.
- source_word: ἐν ταῖς θλίψεσιν ταύταις
  choice: par ces détresses
  rationale: Avec « être ébranlé », la préposition ἐν se rend naturellement par « par », les détresses constituant la circonstance ou la cause de l’ébranlement. « Détresses » conserve la force de θλῖψις sans archaïsme.
- source_word: αὐτοὶ γὰρ οἴδατε
  choice: En effet, vous savez vous-mêmes
  rationale: « En effet » introduit l’explication portée par γάρ, tandis que « vous-mêmes » préserve l’insistance du pronom αὐτοί. οἴδατε a ici un sens présent.
- source_word: εἰς τοῦτο κείμεθα
  choice: nous sommes destinés à cela
  rationale: Dans cette construction, κεῖμαι dépasse son sens concret d’« être placé » et indique une situation assignée ou destinée. La formulation française est naturelle et renvoie sans ajout explicatif aux détresses qui viennent d’être mentionnées.
theological_decisions:
- issue: Rapport des croyants aux détresses dans εἰς τοῦτο κείμεθα
  choice: nous sommes destinés à cela
  alternative: nous sommes établis pour cela ; cela nous est assigné
  rationale: Le texte présente les détresses comme faisant partie de la condition attendue des croyants, mais il ne précise ni l’agent ni un système détaillé de prédestination. La traduction conserve donc le poids de l’énoncé passif sans développer une doctrine particulière.
translation_notes:
  register: Français international moderne, digne et accessible. La construction « afin que » maintient le lien syntaxique avec le verset précédent. « Détresses » garde l’intensité paulinienne du terme, et les notes préservent l’incertitude du verbe rare σαίνω ainsi que la nuance de κεῖμαι.
