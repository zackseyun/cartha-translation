lexical_decisions:
- source_word: ὅτι
  choice: Car
  rationale: Introduit naturellement en français l’explication causale de l’encouragement exprimé dans le contexte précédent.
- source_word: νῦν
  choice: maintenant
  rationale: Conserve directement la valeur temporelle et souligne le regain présent de vitalité de Paul et de ses compagnons.
- source_word: ζῶμεν
  choice: nous vivons
  rationale: Reproduit l’expression grecque sans en expliciter excessivement la portée rhétorique.
- source_word: ἐὰν
  choice: si
  rationale: Préserve la forme conditionnelle du grec, sans la renforcer en « pourvu que ».
- source_word: ὑμεῖς
  choice: vous
  rationale: Maintient le pronom explicite et place les Thessaloniciens au centre de la condition.
- source_word: στήκετε
  choice: tenez ferme
  rationale: Expression française naturelle pour la constance et la fermeté durables désignées par στήκω.
- source_word: ἐν κυρίῳ
  choice: dans le Seigneur
  rationale: Conserve la formulation paulinienne, riche sur le plan relationnel et théologique, sans la réduire à une seule interprétation.
theological_decisions:
- issue: Portée de « maintenant nous vivons »
  choice: Conserver l’expression littérale, comprise dans le contexte comme une image rhétorique de vitalité et d’encouragement renouvelés.
  alternative: Expliciter par « maintenant nous revivons » ou « nous reprenons vie ».
  rationale: L’expression française « nous vivons » préserve la force et la tension du grec sans imposer une paraphrase interprétative.
- issue: Sens de « dans le Seigneur »
  choice: Maintenir la formule « dans le Seigneur ».
  alternative: « unis au Seigneur » ou « fidèles au Seigneur ».
  rationale: La formulation retenue laisse intacte l’ampleur de l’expression paulinienne et n’enferme pas la persévérance dans une lecture doctrinale particulière.
translation_notes:
  register: Français international moderne, naturel et digne. « Car » rend explicitement le lien explicatif; « tenez ferme » est idiomatique et direct. Une seule note accompagne l’expression rhétorique sans alourdir le verset.
