translation:
  language: fr
  text: Car maintenant nous vivons[a], si vous tenez ferme dans le Seigneur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Nous vivons » exprime probablement ici un regain d’encouragement et de vitalité, et non la simple survie physique.
