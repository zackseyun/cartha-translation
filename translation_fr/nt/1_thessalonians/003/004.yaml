reference: 1 Thessalonians 3:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ γὰρ ὅτε πρὸς ὑμᾶς ἦμεν, προελέγομεν ὑμῖν ὅτι μέλλομεν θλίβεσθαι, καθὼς καὶ ἐγένετο καὶ οἴδατε.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/004.yaml
  text: For even when we were with you[a], we kept telling you beforehand that we were going to suffer affliction, just as it also happened, and you know it.
translation:
  language: fr
  text: En effet, lorsque nous étions auprès de vous, nous vous disions d’avance que nous allions être affligés[a], comme cela est arrivé, et vous le savez.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « subir des épreuves » ou « être persécutés ». Le verbe grec peut désigner le fait d’être soumis à la pression, à la détresse ou à la persécution.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: En effet
  rationale: La locution introduit une explication avec une légère insistance. « En effet » exprime naturellement ces deux valeurs en français sans lourdeur.
- source_word: ὅτε πρὸς ὑμᾶς ἦμεν
  choice: lorsque nous étions auprès de vous
  rationale: Avec εἰμί, πρὸς ὑμᾶς désigne la présence auprès des destinataires. « Auprès de vous » est naturel, relationnel et légèrement plus fidèle à la préposition que « avec vous ».
- source_word: προελέγομεν ὑμῖν
  choice: nous vous disions d’avance
  rationale: L’imparfait grec présente une action répétée ou continue pendant le séjour. L’imparfait français conserve cet aspect, tandis que « d’avance » rend le préverbe προ- sans transformer la déclaration en avertissement explicite.
- source_word: ὅτι μέλλομεν θλίβεσθαι
  choice: que nous allions subir la détresse
  rationale: « Nous allions » rend l’attente future exprimée par μέλλομεν. « Subir la détresse » communique l’expérience de pression, d’épreuve ou d’affliction sans la limiter à la seule persécution ni lui donner nécessairement un sens eschatologique technique.
- source_word: καθὼς καὶ ἐγένετο
  choice: C’est bien ce qui est arrivé
  rationale: Cette formulation idiomatique marque nettement la correspondance entre l’annonce et sa réalisation. « Bien » restitue légèrement la valeur confirmative de καί sans produire le tour pesant « comme cela est aussi arrivé ».
- source_word: καὶ οἴδατε
  choice: et vous le savez
  rationale: Le pronom « le » reprend naturellement en français le fait qui vient d’être évoqué, bien que l’objet demeure implicite en grec.
theological_decisions:
- issue: Nature de la souffrance exprimée par θλίβεσθαι
  choice: une détresse ou affliction générale, susceptible d’inclure la persécution
  alternative: la persécution au sens précis, ou la tribulation dans un sens eschatologique technique
  rationale: Le contexte évoque l’opposition et les épreuves, mais le verbe grec possède une portée plus large. La traduction ne précise donc ni la cause ni un cadre eschatologique que le verset ne formule pas.
translation_notes:
  register: Français international moderne, clair et digne. L’imparfait « disions » préserve l’aspect duratif ou répétitif. La phrase est divisée en deux pour une lecture naturelle, sans modifier le rapport entre l’annonce et son accomplissement.
