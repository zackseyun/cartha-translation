  yaml_path: translation/nt/1_thessalonians/005/020.yaml
  text: Do not despise prophecies[a].
translation:
  language: fr
  text: Ne méprisez pas les prophéties[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « paroles prophétiques ».
    reason: Alternative lexicale explicitant qu’il peut s’agir de prises de parole prophétiques.
lexical_decisions:
- source_word: προφητείας
  choice: les prophéties
  rationale: L’accusatif pluriel désigne des manifestations ou paroles prophétiques. « Les prophéties » conserve le pluriel grec et reste naturel en français moderne, sans préciser indûment leur nature.
- source_word: μὴ
  choice: Ne… pas
  rationale: Avec l’impératif présent, cette négation se rend naturellement par une défense simple en français, sans la renforcer par « jamais ».
- source_word: ἐξουθενεῖτε
  choice: méprisez
  rationale: Le verbe signifie tenir pour rien, dédaigner ou traiter avec mépris. « Mépriser » en restitue directement la force et ne le réduit pas au seul fait de rejeter.
theological_decisions:
- issue: Sens de « prophéties » dans le contexte d’une assemblée chrétienne primitive
  choice: Conserver le terme large « prophéties »
  alternative: « paroles prophétiques » ou « messages présentés comme venant de Dieu »
  rationale: Le grec évoque des expressions prophétiques sans définir ici leur mécanisme ni trancher les débats doctrinaux ultérieurs. La traduction directe préserve cette ouverture et la tension théologique du texte.
translation_notes:
  register: Formulation brève, digne et courante. L’impératif à la deuxième personne du pluriel convient à l’adresse collective. « Prophéties » maintient le pluriel de l’original et évite toute interprétation confessionnelle ajoutée.
