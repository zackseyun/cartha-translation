  text: Ἀδελφοί, ⸀προσεύχεσθε περὶ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/025.yaml
  text: Brothers[a], pray for us.
translation:
  language: fr
  text: Frères[a], priez pour nous.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Frères et sœurs », puisque l’interpellation vise probablement toute l’assemblée.
    reason: Alternative lexicale explicitant le référent vraisemblablement mixte de Ἀδελφοί.
lexical_decisions:
- source_word: Ἀδελφοί
  choice: Frères
  rationale: Vocatif pluriel de ἀδελφός. « Frères » reproduit directement la forme masculine grecque, tandis qu’une note signale que l’interpellation comprend probablement aussi les femmes de l’assemblée.
- source_word: προσεύχεσθε
  choice: priez
  rationale: Impératif présent, deuxième personne du pluriel, de προσεύχομαι. « Priez » est la formulation française naturelle de cette demande. L’aspect présent peut suggérer une action continue, mais le rendre par « continuez à prier » serait ici plus explicite que le grec ne l’exige.
- source_word: περὶ
  choice: pour
  rationale: Avec le génitif ἡμῶν, περί introduit ici les personnes en faveur desquelles la prière est demandée. « Pour » est l’équivalent idiomatique en français.
- source_word: ἡμῶν
  choice: nous
  rationale: Pronom personnel de la première personne du pluriel, renvoyant à Paul et à ses collaborateurs sans préciser davantage que le texte source.
theological_decisions:
- issue: Interpellation masculine Ἀδελφοί adressée vraisemblablement à une assemblée mixte
  choice: Frères
  alternative: Frères et sœurs
  rationale: Le texte principal conserve la forme masculine explicite du grec. La note préserve le sens inclusif vraisemblable dans ce contexte, sans l’imposer dans le corps du verset.
translation_notes:
  register: Français international moderne, bref et digne. L’impératif « priez » garde la simplicité et la force de l’appel grec.
