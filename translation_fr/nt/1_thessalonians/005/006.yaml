reference: 1 Thessalonians 5:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἄρα οὖν μὴ καθεύδωμεν ⸀ὡς οἱ λοιποί, ἀλλὰ γρηγορῶμεν καὶ νήφωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/006.yaml
  text: So then[a], let us not sleep as the rest do[b], but let us stay awake and be sober.
translation:
  language: fr
  text: Ainsi donc, ne dormons pas comme les autres, mais restons éveillés[a] et sobres[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vigilants ». Le verbe grec peut souligner le fait d’être éveillé ou celui de rester sur ses gardes.
    reason: lexical_alternative
  - marker: b
    text: Ou « maîtres de nous-mêmes » ou « lucides ». Le verbe grec évoque la sobriété et, par extension, la vigilance mentale et la retenue.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρα οὖν
  choice: Ainsi donc
  rationale: La combinaison des deux particules introduit avec insistance la conclusion tirée du contexte précédent. « Ainsi donc » conserve cette valeur déductive et exhortative dans un français naturel et digne.
- source_word: μὴ καθεύδωμεν
  choice: ne dormons pas
  rationale: Le subjonctif présent à valeur exhortative est rendu par la première personne du pluriel de l’impératif. Le verbe « dormir » préserve l’image métaphorique du texte sans la réduire à une simple paraphrase morale.
- source_word: ὡς οἱ λοιποί
  choice: comme les autres
  rationale: L’expression désigne les autres personnes, par contraste avec les croyants évoqués dans le contexte. « Comme les autres » est idiomatique et n’ajoute aucune précision absente du grec.
- source_word: ἀλλὰ
  choice: mais
  rationale: La conjonction marque directement l’opposition entre dormir et rester éveillé; « mais » en est l’équivalent français le plus simple.
- source_word: γρηγορῶμεν
  choice: restons éveillés
  rationale: Ce choix maintient l’antithèse explicite avec « dormir » tout en laissant entendre la vigilance. « Veillons » serait également possible, mais rendrait l’image de l’éveil de façon moins immédiate.
- source_word: νήφωμεν
  choice: sobres
  rationale: Le verbe désigne la sobriété et, par extension, la lucidité et la maîtrise de soi. « Sobres » conserve à la fois l’image concrète et sa portée morale, sans choisir exclusivement l’un de ces sens.
theological_decisions:
- issue: Portée métaphorique du sommeil et de l’éveil
  choice: Conserver dans le texte principal les images de dormir et de rester éveillé comme exhortation éthique et spirituelle.
  alternative: Paraphraser par l’insouciance morale opposée à la vigilance.
  rationale: Le contexte oppose les enfants de la lumière à ceux qui appartiennent à la nuit. Garder l’image respecte la pensée de Paul et évite d’en limiter prématurément la portée.
- issue: Sens de νήφω
  choice: Traduire par « sobres ».
  alternative: « maîtres de nous-mêmes » ou « lucides »
  rationale: Le terme peut évoquer la sobriété au sens propre ainsi que la lucidité et la retenue qui en découlent. Le choix principal préserve cette tension sémantique, tandis que la note présente les équivalents interprétatifs possibles.
translation_notes:
  register: Français international moderne, clair et soutenu sans archaïsme. L’impératif inclusif « ne dormons pas… restons… » reproduit l’exhortation collective. Les images concrètes du sommeil, de l’éveil et de la sobriété sont maintenues, avec des variantes explicatives en notes.
