  text: Abstain from every kind of evil[a].
translation:
  language: fr
  text: Tenez-vous à l’écart de toute forme de mal[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « toute sorte de mal »; traduction traditionnelle : « tout ce qui a l’apparence du mal ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέχεσθε
  choice: Tenez-vous à l’écart
  rationale: Impératif présent moyen, deuxième personne du pluriel, qui appelle à une conduite durable d’éloignement. Cette tournure française est naturelle et conserve l’idée de distance exprimée avec ἀπό.
- source_word: ἀπὸ
  choice: de
  rationale: Avec ἀπέχομαι, la préposition exprime la séparation ou l’éloignement.
- source_word: παντὸς
  choice: toute
  rationale: Avec le génitif singulier εἴδους, le mot signifie ici « toute » ou « chaque » forme; « toute » convient naturellement en français.
- source_word: εἴδους
  choice: forme
  rationale: Dans ce contexte, εἶδος désigne vraisemblablement une forme, une sorte ou une catégorie, plutôt qu’une simple apparence extérieure. « Forme » restitue bien le terme tout en restant idiomatique.
- source_word: πονηροῦ
  choice: mal
  rationale: Génitif singulier dépendant de εἴδους. « Mal » est une traduction directe, naturelle et suffisamment large.
theological_decisions:
- issue: Sens de εἴδους dans ἀπὸ παντὸς εἴδους πονηροῦ
  choice: toute forme de mal
  alternative: tout ce qui a l’apparence du mal
  rationale: La traduction traditionnelle par « apparence » peut laisser entendre qu’il faut éviter ce qui semble seulement mauvais. Ici, la locution désigne plus probablement toute forme ou toute sorte de mal. La note conserve néanmoins la transparence sur l’autre interprétation.
translation_notes:
  register: Français international moderne, concis et digne. L’impératif pluriel est rendu sans lourdeur, et la note signale l’interprétation traditionnelle sans l’imposer au texte principal.
