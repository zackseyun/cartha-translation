id: 1TH.5.24
reference: 1 Thessalonians 5:24
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: πιστὸς ὁ καλῶν ὑμᾶς, ὃς καὶ ποιήσει.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/024.yaml
  text: Faithful is the one who calls you[a], who also will do it.
translation:
  language: fr
  text: Celui qui vous appelle est fidèle, et c’est lui qui accomplira cela.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Celui qui vous appelle est digne de confiance; il le fera aussi. »
    reason: Alternative lexicale pour πιστός et rendu plus littéral de ποιήσει, tout en conservant l’insistance de καί.
lexical_decisions:
- source_word: πιστὸς
  choice: fidèle
  rationale: Adjectif attribut placé en tête pour l’emphase; « fidèle » exprime naturellement la fiabilité constante de Dieu dans ce contexte.
- source_word: ὁ καλῶν
  choice: celui qui appelle
  rationale: Le participe présent substantivé désigne Dieu comme celui qui appelle; cette formulation est naturelle en français et conserve la valeur participiale.
- source_word: ὑμᾶς
  choice: vous
  rationale: Pronom de la deuxième personne du pluriel, adressé à l’ensemble de la communauté.
- source_word: ὃς καὶ
  choice: et c’est lui qui
  rationale: Cette tournure française rend le lien relatif ainsi que l’insistance de καί sur l’identité entre celui qui appelle et celui qui agira.
- source_word: ποιήσει
  choice: accomplira cela
  rationale: Le futur de ποιέω signifie ici « fera, accomplira ». « Cela » reprend sans la préciser excessivement l’œuvre de sanctification et de préservation demandée au verset précédent.
theological_decisions:
- issue: Objet implicite de ποιήσει
  choice: accomplira cela
  alternative: le fera
  rationale: Le grec ne formule aucun objet. « Cela » renvoie naturellement à ce qui vient d’être demandé en 5.23, sans définir davantage la manière dont Dieu l’accomplira.
translation_notes:
  register: Français international moderne, clair et digne. La phrase est légèrement restructurée par rapport à l’ordre grec afin d’être idiomatique, tout en maintenant l’emphase sur la fidélité de celui qui appelle.
