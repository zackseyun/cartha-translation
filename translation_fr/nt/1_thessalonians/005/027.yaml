  text: ⸀ἐνορκίζω ὑμᾶς τὸν κύριον ἀναγνωσθῆναι τὴν ἐπιστολὴν πᾶσιν ⸀τοῖς ἀδελφοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/027.yaml
  text: I put you under oath before the Lord to have this letter read to all the brothers[a][b].
translation:
  language: fr
  text: Je vous mets sous serment devant le Seigneur[a] de faire lire cette lettre à tous les frères[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « par le Seigneur ». L’expression grecque peut présenter le Seigneur comme l’autorité invoquée dans cette mise sous serment.'
    reason: lexical_alternative
  - marker: b
    text: Ici, « frères » désigne vraisemblablement toute l’assemblée, y compris les femmes; le mot grec est au masculin pluriel.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνορκίζω
  choice: je vous mets sous serment
  rationale: Le verbe exprime l’idée de lier solennellement quelqu’un par un serment. Cette formulation conserve cette force plus précisément que « je vous demande solennellement » et reste plus accessible que « je vous adjure ».
- source_word: τὸν κύριον
  choice: devant le Seigneur
  rationale: Avec ἐνορκίζω, l’accusatif peut désigner celui qui est invoqué comme autorité du serment. « Devant le Seigneur » exprime naturellement en français sa présence comme témoin et autorité, tandis que l’autre analyse possible est signalée en note.
- source_word: ἀναγνωσθῆναι
  choice: de faire lire
  rationale: L’infinitif aoriste passif signifie que la lettre doit être lue. « Faire lire » respecte cette valeur passive dans un français naturel; le contexte suggère une lecture publique sans qu’il soit nécessaire d’ajouter explicitement « à haute voix ».
- source_word: τὴν ἐπιστολήν
  choice: cette lettre
  rationale: Il s’agit du document que les destinataires ont sous les yeux. « Cette lettre » est naturel en français moderne et convient mieux au registre courant que « cette épître ».
- source_word: πᾶσιν τοῖς ἀδελφοῖς
  choice: à tous les frères
  rationale: Le grec emploie le masculin pluriel ἀδελφοῖς. La traduction le conserve sans masquer sa forme, tandis qu’une note précise qu’en contexte communautaire le terme désigne vraisemblablement l’ensemble de l’assemblée, femmes comprises.
theological_decisions:
- issue: Portée de ἀδελφοῖς dans une assemblée vraisemblablement mixte
  choice: frères
  alternative: frères et sœurs
  rationale: Le texte grec porte le masculin pluriel « frères », qui peut fonctionner chez Paul comme une désignation collective de la communauté. Le texte principal préserve cette forme et la note en explicite la portée probable sans remplacer silencieusement le terme.
- issue: Rôle du Seigneur dans la formule de serment
  choice: devant le Seigneur
  alternative: par le Seigneur
  rationale: La construction peut présenter le Seigneur comme témoin devant qui le serment oblige ou comme autorité invoquée par laquelle Paul adjure ses destinataires. Le texte retient une formulation française naturelle et la note préserve l’autre analyse.
translation_notes:
  register: Français international moderne, clair et digne. « Mettre sous serment » conserve la solennité de la formule grecque sans recourir au terme plus littéraire « adjurer ». La syntaxe reste concise et adaptée à une lecture publique.
