id: 1TH.5.5
reference: 1 Thessalonians 5:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: πάντες ⸀γὰρ ὑμεῖς υἱοὶ φωτός ἐστε καὶ υἱοὶ ἡμέρας. οὐκ ἐσμὲν νυκτὸς οὐδὲ σκότους·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/005.yaml
  text: For you are all sons of light and sons of day[a]. We are not of night or of darkness.
translation:
  language: fr
  text: En effet, vous êtes tous fils de la lumière et fils du jour[a]. Nous ne sommes ni de la nuit ni des ténèbres.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « enfants de la lumière et enfants du jour ». Le grec dit littéralement « fils », expression qui désigne ici les personnes caractérisées par la lumière et le jour, ou qui leur appartiennent.
    reason: Alternative lexicale et clarification de la portée inclusive de l’expression grecque.
lexical_decisions:
- source_word: πάντες
  choice: tous
  rationale: 'Placée avec « vous », cette formulation conserve la portée inclusive et emphatique du grec : chacun des destinataires est concerné.'
- source_word: γάρ
  choice: En effet
  rationale: Ce connecteur introduit l’explication de l’affirmation précédente. « En effet » rend ce lien naturellement en français moderne.
- source_word: υἱοὶ
  choice: fils
  rationale: Le grec emploie littéralement le masculin pluriel « fils » dans une tournure qui exprime l’appartenance ou une caractéristique. Le terme est conservé dans le texte, avec une note précisant sa portée inclusive.
- source_word: φωτός
  choice: de la lumière
  rationale: Cette traduction directe préserve la métaphore de l’appartenance à la lumière et son opposition aux ténèbres.
- source_word: ἡμέρας
  choice: du jour
  rationale: « Jour » maintient le parallélisme avec « lumière » et le contraste avec « nuit ».
- source_word: οὐκ ἐσμὲν
  choice: Nous ne sommes ni
  rationale: Le passage de la deuxième personne (« vous êtes ») à la première personne du pluriel (« nous sommes ») est conservé. La tournure française « ni… ni… » exprime naturellement la double négation qui suit.
- source_word: νυκτός
  choice: de la nuit
  rationale: Le génitif exprime ici l’appartenance ou le domaine. « De la nuit » conserve la concision et le parallélisme métaphorique.
- source_word: σκότους
  choice: des ténèbres
  rationale: « Ténèbres » rend le contraste moral et spirituel avec la lumière, tout en respectant le registre biblique courant et intelligible.
theological_decisions:
- issue: Métaphore familiale genrée dans υἱοὶ φωτός / υἱοὶ ἡμέρας
  choice: fils de la lumière et fils du jour
  alternative: enfants de la lumière et enfants du jour
  rationale: Le grec dit explicitement « fils », mais cette expression idiomatique vise l’ensemble des croyants et décrit ceux qui appartiennent à la lumière et au jour ou qui en portent les caractéristiques. Le texte conserve la forme grecque, tandis que la note en explicite la portée inclusive.
- issue: Passage de la deuxième personne à la première personne du pluriel
  choice: vous êtes tous… Nous ne sommes…
  alternative: vous êtes tous… vous n’êtes pas…
  rationale: Le grec passe intentionnellement de l’adresse directe aux Thessaloniciens à un « nous » qui inclut Paul et ses compagnons. Conserver ce changement évite d’effacer une nuance rhétorique du texte.
translation_notes:
  register: Français international moderne, digne et accessible. « En effet » assure un enchaînement naturel avec le contexte. La construction « ni de la nuit ni des ténèbres » préserve le changement de personne et le parallélisme du grec sans lourdeur.
