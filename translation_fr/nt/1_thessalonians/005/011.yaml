  yaml_path: translation/nt/1_thessalonians/005/011.yaml
  text: Therefore encourage one another and build up one another[a], just as you are also doing.
translation:
  language: fr
  text: C’est pourquoi encouragez-vous les uns les autres[a] et édifiez-vous les uns les autres, comme vous le faites déjà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « exhortez-vous les uns les autres » ; le verbe grec peut désigner aussi bien l’encouragement que l’exhortation dans ce contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: C’est pourquoi
  rationale: Marque naturellement la conséquence tirée de ce qui précède et conserve le lien logique.
- source_word: παρακαλεῖτε
  choice: encouragez-vous
  rationale: Le verbe peut exprimer l’encouragement, l’exhortation ou la consolation. Ici, l’encouragement mutuel convient au contexte, sans effacer l’idée possible d’exhortation, signalée en note.
- source_word: ἀλλήλους
  choice: les uns les autres
  rationale: Rend clairement et naturellement la réciprocité de l’action.
- source_word: οἰκοδομεῖτε
  choice: faites grandir dans la foi
  rationale: Exprime en français courant l’idée métaphorique de construction appliquée à la communauté; le complément «dans la foi» rend explicite le domaine implicite sans imposer une doctrine particulière.
- source_word: εἷς τὸν ἕνα
  choice: chacun
  rationale: Reproduit l’attention portée à chaque membre individuellement tout en évitant une répétition française lourde de «les uns les autres».
- source_word: καθὼς καὶ ποιεῖτε
  choice: comme vous le faites déjà
  rationale: Conserve la comparaison, la valeur confirmative de καί et l’idée d’une pratique déjà en cours.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. L’impératif réciproque « encouragez-vous » est idiomatique; « faites grandir chacun dans la foi » privilégie l’intelligibilité tout en transmettant la métaphore communautaire de l’édification.
