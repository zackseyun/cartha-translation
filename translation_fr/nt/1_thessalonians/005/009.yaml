source:
  edition: SBLGNT
  text: ὅτι οὐκ ἔθετο ἡμᾶς ὁ θεὸς εἰς ὀργὴν ἀλλὰ εἰς περιποίησιν σωτηρίας διὰ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/009.yaml
  text: For God did not appoint us for wrath[a], but for obtaining salvation through our Lord Jesus the Messiah[b],
translation:
  language: fr
  text: Car Dieu ne nous a pas destinés à la colère, mais à obtenir le salut[a] par notre Seigneur Jésus, le Messie[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi traduire : « acquérir le salut », « entrer en possession du salut » ou, peut-être, « être préservés en vue du salut ». Le nom grec περιποίησις a un sens plus large que le seul fait d’« obtenir ».'
    reason: lexical_alternative
  - marker: b
    text: 'Traduction traditionnelle : « par notre Seigneur Jésus-Christ ». Le titre grec Χριστός est rendu ici par « Messie » afin d’en conserver le sens.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: Car
  rationale: La conjonction introduit ici le fondement de l’exhortation précédente; « Car » conserve naturellement cette valeur causale.
- source_word: οὐκ ἔθετο ἡμᾶς … εἰς
  choice: ne nous a pas destinés à
  rationale: Dans cette construction, τίθημι avec εἰς indique l’affectation à une issue ou à un but. « Destiner à » rend cette orientation sans développer une doctrine plus systématique que le texte.
- source_word: ὀργή
  choice: subir sa colère
  rationale: Dans ce contexte eschatologique, ὀργή désigne la colère divine. L’ajout idiomatique de « subir sa » explicite en français le rapport exprimé par εἰς sans remplacer la colère par le terme plus interprétatif « jugement ».
- source_word: περιποίησις σωτηρίας
  choice: obtenir le salut
  rationale: La tournure verbale est plus naturelle en français que « l’obtention du salut ». περιποίησις peut toutefois évoquer l’acquisition, la possession ou éventuellement la préservation; cette amplitude est signalée en note.
- source_word: διὰ τοῦ κυρίου ἡμῶν
  choice: par notre Seigneur
  rationale: διά avec le génitif marque ici le moyen ou l’agent; « par » est la formulation française naturelle.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jésus, le Messie
  rationale: Χριστός conserve ici sa valeur de titre après le nom personnel. L’apposition avec article est idiomatique en français et rend le sens de « Messie ».
theological_decisions:
- issue: Force de ἔθετο dans l’affirmation du dessein de Dieu
  choice: ne nous a pas destinés à subir sa colère
  alternative: ne nous a pas voués à la colère
  rationale: « Destinés » exprime le dessein et l’issue visée sans faire du verset une formulation technique d’un système particulier de prédestination.
- issue: Nature de la colère mentionnée
  choice: sa colère
  alternative: la colère
  rationale: Le contexte et l’usage paulinien indiquent la colère de Dieu. Le possessif rend ce référent naturel en français, sans l’atténuer en « jugement ».
- issue: Valeur de Χριστός
  choice: le Messie
  alternative: le Christ
  rationale: Le terme grec est un titre porteur de sens. « Messie » le traduit, tandis que la forme traditionnelle « Christ » est conservée en note.
translation_notes:
  register: Français international moderne, clair et digne. La formulation évite le tour nominal lourd « en vue de l’obtention du salut ». La virgule avant « le Messie » marque naturellement l’apposition du titre en français.
