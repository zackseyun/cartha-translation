  text: πάντα δὲ δοκιμάζετε, τὸ καλὸν κατέχετε,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/021.yaml
  text: But test everything[a]; hold fast to what is good.
translation:
  language: fr
  text: Mais examinez tout[a] ; retenez ce qui est bon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « toutes choses ». Dans le contexte, cela comprend notamment l’évaluation des paroles prophétiques.
    reason: Alternative lexicale et précision contextuelle sans restriction du sens dans le texte principal.
lexical_decisions:
- source_word: πάντα
  choice: tout
  rationale: Le neutre pluriel accusatif a ici une portée globale. « Tout » est naturel en français moderne et conserve cette ampleur sans ajouter un complément absent du grec.
- source_word: δὲ
  choice: Mais
  rationale: 'La particule marque une légère opposition avec les consignes précédentes : il ne faut pas mépriser les prophéties, mais les soumettre à l’examen.'
- source_word: δοκιμάζετε
  choice: examinez
  rationale: L’impératif présent appelle une évaluation suivie visant à reconnaître la valeur ou l’authenticité de ce qui est considéré. « Examinez » exprime mieux ici un discernement réfléchi que le possible mais plus technique « testez ».
- source_word: τὸ καλὸν
  choice: ce qui est bon
  rationale: L’adjectif neutre substantivé désigne ce qui est reconnu comme bon. Cette formulation est claire et idiomatique, sans la coloration philosophique que pourrait prendre « le bien ».
- source_word: κατέχετε
  choice: retenez
  rationale: Dans ce contexte, le verbe demande de garder fermement ce qui a résisté à l’examen. « Retenez » restitue l’idée de conservation et d’attachement sans alourdir la phrase.
theological_decisions:
- issue: Portée de πάντα dans le contexte du discernement des prophéties
  choice: Conserver la portée générale avec « tout », tout en signalant que le contexte immédiat vise notamment les paroles prophétiques.
  alternative: Traduire de manière restrictive par « toutes les prophéties » ou « tout ce qui est dit ».
  rationale: Le verset précédent mentionne les prophéties, mais le texte grec emploie le terme général πάντα sans nom qui en limiterait explicitement la portée. La traduction préserve donc cette largeur et laisse le contexte orienter l’application.
translation_notes:
  register: Français international moderne, sobre et digne. « Examinez » est courant et exprime une évaluation attentive ; « retenez » maintient le parallélisme concis des deux impératifs.
