  text: Περὶ δὲ τῶν χρόνων καὶ τῶν καιρῶν, ἀδελφοί, οὐ χρείαν ἔχετε ὑμῖν γράφεσθαι,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/001.yaml
  text: Concerning the times and the seasons[a], brothers, you have no need to have anything written to you[b],
translation:
  language: fr
  text: Quant aux temps et aux moments fixés[a], frères[b], vous n’avez pas besoin qu’on vous écrive à ce sujet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « temps et moments fixés » associe les périodes de temps aux moments déterminés ou opportuns, ici dans un contexte eschatologique.
    reason: cultural_note
  - marker: b
    text: 'Ou « frères et sœurs » : le grec dit littéralement « frères », mais ce terme désigne vraisemblablement ici toute la communauté croyante.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Περὶ δὲ
  choice: Quant aux
  rationale: Introduit naturellement en français un nouveau sujet tout en rendant la transition marquée par δέ, sans ajouter un « maintenant » temporel absent du grec.
- source_word: τῶν χρόνων καὶ τῶν καιρῶν
  choice: aux temps et aux moments fixés
  rationale: « Temps » rend χρόνοι, qui peut évoquer des périodes ou des durées; « moments fixés » rend καιροί, qui désigne souvent des occasions déterminées ou opportunes. Le binôme conserve la distinction sans recourir au peu naturel « temps et saisons ».
- source_word: ἀδελφοί
  choice: frères
  rationale: Reproduit la forme masculine du vocatif grec; dans ce contexte, l’appellation vise vraisemblablement l’ensemble de la communauté croyante, ce qui est précisé en note.
- source_word: οὐ χρείαν ἔχετε
  choice: vous n’avez pas besoin
  rationale: Expression française naturelle correspondant directement à l’idée d’absence de nécessité.
- source_word: ὑμῖν γράφεσθαι
  choice: qu’on vous écrive à ce sujet
  rationale: La tournure impersonnelle respecte le passif grec sans imposer Paul comme sujet explicite. « À ce sujet » explicite en français le complément thématique déjà donné par Περὶ.
theological_decisions:
- issue: Portée de l’adresse masculine ἀδελφοί
  choice: frères dans le texte, avec une note signalant la portée communautaire probable
  alternative: frères et sœurs
  rationale: Cette solution préserve la forme grammaticale du grec tout en informant le lecteur que l’adresse inclut vraisemblablement toute l’assemblée.
- issue: Sens eschatologique du binôme χρόνοι καὶ καιροί
  choice: temps et moments fixés
  alternative: temps et époques
  rationale: Le rendu conserve deux aspects temporels distincts et laisse le contexte eschatologique préciser leur référent, sans réduire l’expression à une date particulière.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe évite le calque lourd « avoir besoin que quelque chose vous soit écrit » tout en conservant le passif indéfini du grec.
