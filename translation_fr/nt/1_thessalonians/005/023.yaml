id: 1TH.5.23
reference: 1 Thessalonians 5:23
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Αὐτὸς δὲ ὁ θεὸς τῆς εἰρήνης ἁγιάσαι ὑμᾶς ὁλοτελεῖς, καὶ ὁλόκληρον ὑμῶν τὸ πνεῦμα καὶ ἡ ψυχὴ καὶ τὸ σῶμα ἀμέμπτως ἐν τῇ παρουσίᾳ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ τηρηθείη.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/023.yaml
  text: May the God of peace himself sanctify you completely[b][a], and may your whole spirit and soul and body be kept blameless at the coming of our Lord Jesus the Messiah.
translation:
  language: fr
  text: Que le Dieu de paix lui-même vous sanctifie entièrement, et que votre être tout entier — l’esprit, l’âme et le corps — soit gardé irréprochable[a] lors de la venue de notre Seigneur Jésus le Messie[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Paul nomme « l’esprit, l’âme et le corps ». Certains comprennent cette expression comme une distinction entre trois dimensions de l’être humain; d’autres y voient une manière d’insister sur la personne tout entière.
    reason: lexical_alternative
  - marker: b
    text: 'Ou, selon la formulation traditionnelle : « Jésus-Christ ».'
    reason: alternative_reading
lexical_decisions:
- source_word: Αὐτὸς δὲ ὁ θεὸς τῆς εἰρήνης
  choice: Que le Dieu de paix lui-même
  rationale: « Lui-même » conserve la valeur intensive de αὐτός. δέ marque ici une transition légère vers une prière de souhait; le français n’exige pas de connecteur explicite.
- source_word: ἁγιάσαι ὑμᾶς ὁλοτελεῖς
  choice: vous sanctifie entièrement
  rationale: L’optatif aoriste exprime un souhait ou une prière. « Sanctifier » maintient le lien lexical et théologique avec la sainteté, tandis que « entièrement » rend la totalité exprimée par ὁλοτελεῖς.
- source_word: ὁλόκληρον ὑμῶν
  choice: votre être tout entier
  rationale: La formulation française explicite idiomatiquement l’idée que l’ensemble constitué de l’esprit, de l’âme et du corps doit être conservé intact, sans effacer les trois termes grecs.
- source_word: τὸ πνεῦμα καὶ ἡ ψυχὴ καὶ τὸ σῶμα
  choice: l’esprit, l’âme et le corps
  rationale: Les trois substantifs sont conservés distinctement et dans leur ordre, sans transformer l’énumération en système anthropologique explicite.
- source_word: ἀμέμπτως
  choice: irréprochable
  rationale: L’adverbe grec caractérise la manière ou l’état dans lequel l’ensemble doit être gardé. Le singulier français s’accorde avec « votre être tout entier » et évite de distribuer artificiellement la qualité entre trois parties.
- source_word: ἐν τῇ παρουσίᾳ
  choice: lors de la venue
  rationale: Dans ce contexte eschatologique paulinien, παρουσία désigne la venue ou l’arrivée du Seigneur; « lors de » rend naturellement la valeur temporelle de ἐν.
- source_word: τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: de notre Seigneur Jésus le Messie
  rationale: Χριστός est rendu comme le titre « le Messie », dans une syntaxe française naturelle, plutôt que simplement translittéré par « Christ ».
theological_decisions:
- issue: 'Énumération anthropologique: esprit, âme et corps'
  choice: Conserver les trois termes tout en les rattachant à « votre être tout entier »
  alternative: Présenter ces mots comme trois parties techniques et distinctes de la nature humaine
  rationale: Le grec nomme explicitement l’esprit, l’âme et le corps, mais ne tranche pas à lui seul entre une anthropologie tripartite et une énumération rhétorique désignant la personne entière. La traduction préserve cette tension.
- issue: Portée de ἀμέμπτως
  choice: Faire porter « irréprochable » sur « votre être tout entier »
  alternative: Traduire de façon à qualifier séparément l’esprit, l’âme et le corps
  rationale: La construction grecque permet de comprendre l’ensemble comme ce qui doit être gardé sans reproche. Le singulier français respecte ὁλόκληρον et ne force pas une analyse distributive.
- issue: Rendu de Χριστοῦ
  choice: le Messie
  alternative: Christ
  rationale: Χριστός est historiquement et sémantiquement un titre. « Le Messie » le traduit directement; la forme traditionnelle « Christ » est signalée en note.
translation_notes:
  register: Français international moderne, digne et accessible. Le tiret met en apposition l’énumération grecque avec « votre être tout entier », ce qui rend la phrase naturelle sans supprimer les distinctions lexicales. Les deux optatifs sont rendus par la tournure de souhait « Que… ».
