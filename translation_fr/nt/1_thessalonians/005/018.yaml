  text: ἐν παντὶ εὐχαριστεῖτε· τοῦτο γὰρ θέλημα θεοῦ ἐν Χριστῷ Ἰησοῦ εἰς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/018.yaml
  text: Give thanks in everything[b][a], for this is God's will in Messiah Jesus for you.
translation:
  language: fr
  text: Rendez grâce en toute circonstance[a], car telle est la volonté de Dieu pour vous dans le Messie Jésus[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « en toute chose ». Il s’agit du cadre dans lequel rendre grâce, sans nécessairement signifier qu’il faut remercier Dieu pour le mal lui-même.'
    reason: lexical_alternative
  - marker: b
    text: 'Traduction traditionnelle : « en Jésus-Christ ».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν παντί
  choice: en toute circonstance
  rationale: Avec le datif, ἐν παντί désigne naturellement le cadre dans lequel l’action de grâce doit avoir lieu. Cette formulation française évite de suggérer qu’il faudrait remercier Dieu pour le mal lui-même.
- source_word: εὐχαριστεῖτε
  choice: Rendez grâce
  rationale: L’impératif présent appelle les destinataires à pratiquer l’action de grâce de manière suivie. « Rendez grâce » est direct, digne et courant dans le registre biblique français.
- source_word: τοῦτο
  choice: telle
  rationale: Le démonstratif renvoie immédiatement à l’exhortation précédente. La tournure « telle est » en restitue la concision naturelle en français.
- source_word: γὰρ
  choice: car
  rationale: γάρ introduit la raison qui fonde l’exhortation.
- source_word: θέλημα θεοῦ
  choice: la volonté de Dieu
  rationale: Cette formulation restitue directement le génitif et demeure idiomatique en français.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: dans le Messie Jésus
  rationale: « Messie » traduit le titre Χριστός et « dans » conserve sans l’expliciter davantage la formulation paulinienne d’union ou de relation au Messie.
- source_word: εἰς ὑμᾶς
  choice: pour vous
  rationale: Dans cette construction, εἰς ὑμᾶς indique que cette volonté de Dieu concerne les destinataires ou est orientée vers eux.
theological_decisions:
- issue: Portée de l’action de grâce au milieu du mal
  choice: en toute circonstance
  alternative: en toute chose
  rationale: La traduction indique le cadre de l’action de grâce sans imposer l’idée que le mal lui-même serait l’objet du remerciement.
- issue: Traduction de Χριστῷ comme titre ou terme traditionnel
  choice: le Messie Jésus
  alternative: Jésus-Christ
  rationale: Χριστός conserve ici sa valeur de titre messianique. L’alternative traditionnelle française est signalée sans effacer cette valeur.
- issue: Relation syntaxique de ἐν Χριστῷ Ἰησοῦ
  choice: dans le Messie Jésus
  alternative: en Jésus-Christ
  rationale: La préposition est conservée afin de ne pas résoudre la relation de façon plus précise que le grec, qu’elle qualifie la volonté divine ou la situation des croyants.
translation_notes:
  register: Français international moderne, naturel et digne. « Rendez grâce » maintient le registre biblique sans archaïsme marqué. Les marqueurs [a] et [b] figurent dans le texte principal.
