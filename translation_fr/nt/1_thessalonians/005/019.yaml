  text: Do not quench the Spirit,[a]
translation:
  language: fr
  text: N’éteignez pas l’Esprit[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « l’esprit ». Le terme grec peut désigner l’esprit de façon plus générale, mais il renvoie très probablement ici à l’Esprit Saint, notamment en raison de la mention des prophéties au verset suivant.'
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ πνεῦμα
  choice: l’Esprit
  rationale: Dans cette exhortation paulinienne, et compte tenu de la mention immédiate des prophéties (v. 20), le terme désigne très probablement l’Esprit Saint. La majuscule indique ce référent en français, sans prétendre qu’une distinction graphique équivalente figurait dans les manuscrits grecs.
- source_word: μὴ
  choice: N’… pas
  rationale: Avec l’impératif présent, μή exprime ici une défense, rendue naturellement en français par la négation impérative « N’… pas ».
- source_word: σβέννυτε
  choice: éteignez
  rationale: Le verbe σβέννυμι signifie littéralement éteindre, notamment un feu. « Éteindre » conserve en français courant et digne la métaphore sans l’expliciter ni la paraphraser.
theological_decisions:
- issue: Référent de πνεῦμα
  choice: l’Esprit Saint
  alternative: l’esprit humain, l’élan spirituel ou un don spirituel
  rationale: La proximité de l’interdiction de mépriser les prophéties favorise une référence à l’action de l’Esprit Saint dans l’assemblée. Comme πνεῦμα peut néanmoins avoir un sens plus général et que le grec ancien ne distingue pas ce référent par la majuscule, l’autre lecture est conservée en note.
translation_notes:
  register: Formulation brève, naturelle et solennelle. Le verbe « éteindre » préserve l’image grecque du feu et demeure immédiatement compréhensible en français international moderne.
