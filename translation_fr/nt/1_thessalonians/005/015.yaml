reference: 1 Thessalonians 5:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁρᾶτε μή τις κακὸν ἀντὶ κακοῦ τινι ἀποδῷ, ἀλλὰ πάντοτε τὸ ἀγαθὸν ⸀διώκετε εἰς ἀλλήλους καὶ εἰς πάντας.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/015.yaml
  text: See to it that no one repays evil for evil to anyone[b][a], but always pursue what is good toward one another and toward all people.
translation:
  language: fr
  text: Veillez à ce que personne ne rende à qui que ce soit le mal pour le mal[a], mais recherchez toujours ce qui est bon les uns pour les autres et pour tous[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Prenez garde que personne ne rende à qui que ce soit le mal pour le mal. »'
    reason: lexical_alternative
  - marker: b
    text: L’expression « les uns pour les autres […] pour tous » semble passer des membres de la communauté croyante à l’ensemble des personnes.
    reason: cross_reference
lexical_decisions:
- source_word: ὁρᾶτε
  choice: Veillez à ce que
  rationale: L’impératif pluriel a ici une valeur exhortative de vigilance et de responsabilité collective, plutôt que le sens littéral de « voir ».
- source_word: μή τις
  choice: personne ne
  rationale: Après ὁρᾶτε, cette tournure exprime ce qu’il faut empêcher; la construction française avec « Veillez à ce que » et le subjonctif en rend naturellement la force.
- source_word: κακὸν ἀντὶ κακοῦ
  choice: le mal pour le mal
  rationale: Cette formule de représailles conserve la répétition et la portée morale large du grec.
- source_word: τινι
  choice: à qui que ce soit
  rationale: Cette formulation désigne sans restriction le destinataire de la riposte et évite l’ambiguïté que pourrait créer « à personne » dans une phrase déjà négative.
- source_word: ἀποδῷ
  choice: rende
  rationale: Le verbe exprime ici le fait de rendre en retour ce que l’on a subi; « rendre le mal pour le mal » est idiomatique et fidèle au contexte.
- source_word: πάντοτε
  choice: toujours
  rationale: Équivalent temporel direct et naturel.
- source_word: τὸ ἀγαθὸν
  choice: ce qui est bon
  rationale: L’adjectif substantivé désigne ce qui relève du bien; cette expression française garde la catégorie morale sans devenir abstraite.
- source_word: διώκετε
  choice: recherchez
  rationale: Le verbe appelle à poursuivre activement un objectif; « recherchez » conserve cette orientation volontaire et soutenue.
- source_word: εἰς ἀλλήλους
  choice: les uns envers les autres
  rationale: « Envers » exprime l’orientation relationnelle de la conduite au sein du groupe.
- source_word: καὶ εἰς πάντας
  choice: et envers tous
  rationale: La formulation garde la portée universelle de πάντας sans ajouter explicitement un nom absent du grec.
theological_decisions:
- issue: Étendue de l’obligation éthique
  choice: La formulation distingue « les uns envers les autres » puis « envers tous », ce qui suggère un élargissement du cercle communautaire à l’ensemble des personnes.
  alternative: « Tous » pourrait être compris comme désignant tous les croyants.
  rationale: L’enchaînement εἰς ἀλλήλους καὶ εἰς πάντας passe naturellement du groupe réciproque à un ensemble plus large. Le texte traduit conserve cependant la brièveté du grec, tandis que la note signale la portée probable sans l’imposer dans le corps du verset.
translation_notes:
  register: Français international moderne, clair et digne. « Veillez à ce que » traduit l’exhortation collective; « à qui que ce soit » assure une lecture naturelle sous la négation. La structure coordonnée et la tension entre le cercle mutuel et la portée universelle sont conservées.
