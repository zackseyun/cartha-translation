source:
  edition: SBLGNT
  text: παρακαλοῦμεν δὲ ὑμᾶς, ἀδελφοί, νουθετεῖτε τοὺς ἀτάκτους, παραμυθεῖσθε τοὺς ὀλιγοψύχους, ἀντέχεσθε τῶν ἀσθενῶν, μακροθυμεῖτε πρὸς πάντας.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/014.yaml
  text: And we urge you[a], brothers, admonish the disorderly, encourage the fainthearted, help the weak[d][c][b], be patient with everyone.
translation:
  language: fr
  text: 'Nous vous exhortons, frères[a] : avertissez ceux qui vivent dans le désordre[b], encouragez ceux qui manquent de courage[c], soutenez les faibles[d] et soyez patients envers tous.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « frères et sœurs » ; dans ce contexte, Paul s’adresse à l’ensemble de l’assemblée.'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « les indisciplinés » ou, selon le contexte, « les oisifs ».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « réconfortez ceux qui sont découragés ».'
    reason: lexical_alternative
  - marker: d
    text: 'Ou : « venez en aide aux faibles » ; le verbe peut évoquer le fait de s’attacher à eux pour les soutenir.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακαλοῦμεν
  choice: nous vous y exhortons
  rationale: Dans ce contexte d'instructions pastorales, le verbe exprime une exhortation pressante. « Exhortons » en garde la force avec un registre digne et compréhensible.
- source_word: δέ
  choice: y
  rationale: La particule marque ici une transition ou une continuation plutôt qu'une opposition forte. Le pronom « y » relie naturellement cette exhortation à ce qui précède, sans introduire un contraste absent du grec.
- source_word: ἀδελφοί
  choice: frères et sœurs
  rationale: Le masculin pluriel grec sert ici d'adresse à l'ensemble de l'assemblée. En français moderne, « frères et sœurs » rend explicitement cette portée inclusive sans donner à entendre que seules les personnes de sexe masculin sont visées.
- source_word: νουθετεῖτε
  choice: avertissez
  rationale: Le verbe désigne un avertissement ou un rappel correctif visant le redressement. « Avertissez » est naturel et conserve sa dimension pastorale.
- source_word: ἀτάκτους
  choice: ceux qui vivent dans le désordre
  rationale: Le terme désigne ceux qui ne se tiennent pas à leur place ou ne suivent pas l'ordre attendu. Cette formulation en préserve l'étendue sans la réduire à l'oisiveté, possible dans le contexte de Thessalonique.
- source_word: παραμυθεῖσθε
  choice: encouragez
  rationale: Le verbe évoque une parole proche et bienveillante qui réconforte ou redonne courage.
- source_word: ὀλιγοψύχους
  choice: ceux qui manquent de courage
  rationale: Le terme qualifie les personnes découragées, timides ou abattues. Cette expression est actuelle et claire, tout en préservant l'idée centrale d'un courage défaillant.
- source_word: ἀντέχεσθε
  choice: soutenez
  rationale: Construit avec le génitif, le verbe signifie s'attacher à quelqu'un, lui apporter son appui ou le prendre en charge. « Soutenez » exprime bien cet engagement durable.
- source_word: τῶν ἀσθενῶν
  choice: les faibles
  rationale: Le mot peut viser diverses formes de faiblesse — physique, morale, spirituelle ou sociale. La traduction générale évite de préciser ce que le texte laisse ouvert.
- source_word: μακροθυμεῖτε
  choice: soyez patients
  rationale: Le verbe désigne une patience durable envers les personnes, sans réaction précipitée ni irritation.
- source_word: πρὸς πάντας
  choice: envers tous
  rationale: La préposition exprime ici l'attitude adoptée à l'égard de toutes les personnes. « Envers tous » conserve nettement cette orientation et cette portée universelle.
theological_decisions:
- issue: Portée inclusive de ἀδελφοί dans l'adresse à l'assemblée
  choice: « frères et sœurs » dans le texte principal
  alternative: « frères »
  rationale: Bien que la forme grecque soit un masculin pluriel, elle s'adresse dans ce contexte à toute l'assemblée. Le français moderne requiert souvent l'explicitation des deux sexes pour communiquer cette portée sans ambiguïté; la forme littérale est signalée en note.
- issue: Nature de la faiblesse des ἀσθενῶν
  choice: Ne pas préciser le type de faiblesse
  alternative: « les malades », « ceux dont la foi est faible » ou « les personnes vulnérables »
  rationale: Le contexte immédiat ne détermine pas si la faiblesse est physique, spirituelle, morale ou sociale. « Les faibles » maintient cette indétermination théologiquement pertinente.
translation_notes:
  register: 'Français international moderne, pastoral et digne. Les impératifs sont directs sans être abrupts. La formulation privilégie une équivalence optimale : elle explicite l''adresse inclusive conformément à sa fonction contextuelle, tout en documentant la forme grecque, et conserve l''ambiguïté concernant le désordre et la nature de la faiblesse.'
