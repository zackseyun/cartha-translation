  text: οἱ γὰρ καθεύδοντες νυκτὸς καθεύδουσιν, καὶ οἱ μεθυσκόμενοι νυκτὸς μεθύουσιν·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/007.yaml
  text: For those who sleep, sleep at night, and those who get drunk, get drunk at night.
translation:
  language: fr
  text: En effet, ceux qui dorment dorment la nuit, et ceux qui s’enivrent s’enivrent la nuit.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γὰρ
  choice: En effet
  rationale: Introduit l’explication de l’exhortation précédente. « En effet » exprime naturellement en français cette valeur justificative sans alourdir la phrase.
- source_word: οἱ καθεύδοντες ... καθεύδουσιν
  choice: ceux qui dorment dorment
  rationale: Le participe substantivé a une portée générale. La répétition de « dorment » conserve le parallélisme et l’image concrète du grec.
- source_word: νυκτός
  choice: la nuit
  rationale: Le génitif a une fonction adverbiale temporelle. « La nuit » est la tournure française actuelle la plus concise et naturelle.
- source_word: οἱ μεθυσκόμενοι ... μεθύουσιν
  choice: ceux qui s’enivrent s’enivrent
  rationale: « S’enivrer » rend l’action de devenir ivre et permet de reproduire la répétition ainsi que le parallélisme du texte grec.
- source_word: καί
  choice: et
  rationale: Conjonction de coordination simple reliant les deux propositions parallèles.
theological_decisions:
- issue: Sens littéral ou métaphorique du sommeil et de l’ivresse dans l’analogie
  choice: Conserver les images concrètes « dorment » et « s’enivrent »
  alternative: Expliciter l’insensibilité spirituelle et le dérèglement moral
  rationale: Dans le contexte immédiat, Paul s’appuie sur des comportements associés à la nuit pour soutenir son exhortation spirituelle. La traduction garde l’image sans intégrer son interprétation au texte.
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme rhétorique et les répétitions du grec sont volontairement préservés.
