id: 1TH.5.12
reference: 1 Thessalonians 5:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἐρωτῶμεν δὲ ὑμᾶς, ἀδελφοί, εἰδέναι τοὺς κοπιῶντας ἐν ὑμῖν καὶ προϊσταμένους ὑμῶν ἐν κυρίῳ καὶ νουθετοῦντας ὑμᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/012.yaml
  text: We ask you[a], brothers, to acknowledge those who labor among you and lead you in the Lord and admonish you[c][b],
translation:
  language: fr
  text: Nous vous demandons, frères et sœurs[a], de reconnaître[b] ceux qui travaillent dur parmi vous, qui vous dirigent dans le Seigneur[c] et qui vous avertissent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « frères »; dans ce contexte, cette adresse grecque désigne l’ensemble de l’assemblée, hommes et femmes.
    reason: lexical_alternative
  - marker: b
    text: Ou « d’avoir de la considération pour » ou « de respecter ».
    reason: lexical_alternative
  - marker: c
    text: Ou « qui sont à votre tête dans le Seigneur »; le verbe peut aussi évoquer la responsabilité et la sollicitude.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐρωτῶμεν
  choice: Nous vous demandons
  rationale: Le verbe exprime ici une demande pastorale plutôt qu’un ordre; « demandons » en conserve la douceur et reste naturel en français.
- source_word: δὲ
  choice: non exprimé séparément
  rationale: La particule marque une transition légère. En français, le passage à l’exhortation suffit à rendre cette fonction sans ajouter un « mais » trop adversatif ni un « maintenant » absent du sens temporel.
- source_word: ἀδελφοί
  choice: frères et sœurs
  rationale: Le pluriel masculin grec « frères » sert ici d’adresse à l’ensemble de l’assemblée. « Frères et sœurs » en communique naturellement la portée collective en français moderne, tandis qu’une note signale la forme grecque.
- source_word: εἰδέναι
  choice: reconnaître
  rationale: Dans ce contexte, le verbe ne signifie pas seulement connaître, mais reconnaître avec considération les personnes concernées. « Reconnaître » préserve cette nuance sans imposer l’idée plus forte d’obéissance.
- source_word: κοπιῶντας
  choice: ceux qui travaillent dur
  rationale: Le participe souligne un travail pénible ou soutenu. Cette formulation française en rend clairement l’intensité.
- source_word: ἐν ὑμῖν
  choice: parmi vous
  rationale: L’expression situe leur activité au sein de l’assemblée; « parmi vous » est direct et naturel.
- source_word: προϊσταμένους ὑμῶν
  choice: qui vous dirigent
  rationale: Le participe peut exprimer la direction, la responsabilité ou la sollicitude. « Dirigent » conserve la notion d’autorité reconnue sans préciser indûment une structure ecclésiale.
- source_word: ἐν κυρίῳ
  choice: dans le Seigneur
  rationale: La traduction traditionnelle et transparente maintient le lien de leur responsabilité avec le Seigneur sans en réduire la portée.
- source_word: νουθετοῦντας ὑμᾶς
  choice: qui vous avertissent
  rationale: Le verbe désigne une instruction corrective, une mise en garde ou une exhortation. « Avertissent » conserve sa dimension pastorale et corrective dans un français courant.
theological_decisions:
- issue: Portée de l’adresse ἀδελφοί
  choice: frères et sœurs
  alternative: frères
  rationale: L’adresse vise vraisemblablement toute l’assemblée. Le texte principal rend cette portée inclusive en français moderne, et la note conserve la forme masculine du grec.
- issue: Sens de εἰδέναι à l’égard des responsables
  choice: reconnaître
  alternative: respecter; avoir de la considération pour; connaître
  rationale: Le grec appelle à reconnaître et à estimer leur service, mais n’exprime pas explicitement l’obéissance ou la vénération. « Reconnaître » évite d’ajouter une exigence ecclésiologique plus forte.
- issue: Force de προϊσταμένους ὑμῶν ἐν κυρίῳ
  choice: qui vous dirigent dans le Seigneur
  alternative: qui sont à votre tête dans le Seigneur; qui prennent soin de vous dans le Seigneur
  rationale: Le participe peut associer direction, responsabilité et sollicitude. Le choix principal exprime l’autorité sans imposer un modèle hiérarchique particulier; la note maintient l’alternative plus littérale.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe répétée « qui… qui… et qui… » conserve le parallélisme des trois participes grecs. Le vocabulaire évite aussi bien le jargon ecclésiastique que les formulations excessivement familières.
