reference: 1 Thessalonians 5:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸀ὅταν λέγωσιν· Εἰρήνη καὶ ἀσφάλεια, τότε αἰφνίδιος αὐτοῖς ἐφίσταται ὄλεθρος ὥσπερ ἡ ὠδὶν τῇ ἐν γαστρὶ ἐχούσῃ, καὶ οὐ μὴ ἐκφύγωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/003.yaml
  text: When they say[a], “Peace and security,” then sudden destruction comes upon them, like labor pains upon a pregnant woman[c][b], and they will certainly not escape.
translation:
  language: fr
  text: 'Quand ils diront : « Paix et sécurité », alors la destruction fondra soudain sur eux, comme les douleurs de l’accouchement sur une femme enceinte[a], et ils n’y échapperont certainement pas[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « sur celle qui a [un enfant] dans le ventre ».'
    reason: Précision sur la tournure grecque sous-jacente à l’expression française naturelle.
  - marker: b
    text: 'Le grec emploie ici une négation renforcée : « ils n’échapperont absolument pas ».'
    reason: Signalement de la force emphatique de οὐ μή avec le subjonctif.
lexical_decisions:
- source_word: ὅταν λέγωσιν
  choice: Quand ils diront
  rationale: La construction ὅταν avec le subjonctif introduit ici un événement futur indéfini. Le futur français est naturel dans cette proposition temporelle à portée eschatologique, tout en conservant le sujet pluriel non précisé.
- source_word: Εἰρήνη καὶ ἀσφάλεια
  choice: Paix et sécurité
  rationale: « Paix » rend directement εἰρήνη, et « sécurité » exprime naturellement l’état stable et assuré désigné par ἀσφάλεια dans cette proclamation.
- source_word: τότε
  choice: alors
  rationale: Le terme marque clairement la conséquence immédiate de la proclamation précédente.
- source_word: αἰφνίδιος αὐτοῖς ἐφίσταται ὄλεθρος
  choice: la destruction fondra soudain sur eux
  rationale: Cette formulation française rend l’arrivée brusque et menaçante exprimée par αἰφνίδιος et ἐφίσταται. « Destruction » conserve la gravité de ὄλεθρος sans en préciser davantage la nature.
- source_word: ὥσπερ ἡ ὠδὶν
  choice: comme les douleurs de l’accouchement
  rationale: Le singulier collectif grec désigne les douleurs liées au travail de l’accouchement; le pluriel est idiomatique en français.
- source_word: τῇ ἐν γαστρὶ ἐχούσῃ
  choice: sur une femme enceinte
  rationale: Cette expression naturelle rend la périphrase grecque, littéralement « celle qui a [un enfant] dans le ventre », sans alourdir la phrase.
- source_word: οὐ μὴ ἐκφύγωσιν
  choice: ils n’y échapperont certainement pas
  rationale: « Certainement pas » restitue la négation grecque fortement emphatique οὐ μή. Le pronom « y » renvoie naturellement en français à la destruction qui fond sur eux.
theological_decisions:
- issue: Nature de ὄλεθρος dans l’avertissement eschatologique
  choice: destruction
  alternative: ruine; désastre
  rationale: Le mot annonce un jugement décisif, mais ne définit pas à lui seul son mode ni sa durée. « Destruction » maintient la force et l’ouverture sémantique du grec sans imposer une doctrine particulière.
translation_notes:
  register: 'Français international moderne, digne et accessible. La formulation conserve la progression rhétorique de l’original : proclamation rassurante, irruption soudaine de la destruction, comparaison avec l’accouchement, puis impossibilité catégorique d’échapper.'
