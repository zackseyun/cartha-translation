  text: and to regard them very highly in love because of their work[a]. Be at peace among yourselves.
translation:
  language: fr
  text: et de les tenir en très haute estime[a] dans l’amour, à cause de leur travail. Vivez en paix entre vous.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les estimer au plus haut point dans l’amour ». L’adverbe grec est particulièrement intensif.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡγεῖσθαι
  choice: tenir en estime
  rationale: Dans cette construction, le verbe exprime une appréciation portée sur les personnes mentionnées au verset précédent. « Tenir en estime » est naturel en français et conserve cette valeur évaluative.
- source_word: ὑπερεκπερισσοῦ
  choice: en très haute estime
  rationale: Cet adverbe rare et fortement intensif renforce exceptionnellement l’estime demandée. « Très haute » rend clairement cette intensité sans formulation artificielle.
- source_word: ἐν ἀγάπῃ
  choice: dans l’amour
  rationale: Cette formulation préserve le terme central ἀγάπη et la construction prépositionnelle, tout en indiquant la sphère ou la manière de cette estime.
- source_word: διὰ τὸ ἔργον αὐτῶν
  choice: à cause de leur travail
  rationale: διά suivi de l’accusatif exprime ici le motif. La traduction garde le nom concret ἔργον et ne précise pas davantage la nature du travail.
- source_word: εἰρηνεύετε
  choice: Vivez en paix
  rationale: L’impératif présent appelle à une conduite durable. « Vivez en paix » rend naturellement en français l’état et la pratique continus exprimés par le verbe.
- source_word: ἐν ἑαυτοῖς
  choice: entre vous
  rationale: Le pronom réfléchi pluriel désigne les relations internes à la communauté. « Entre vous » est la formulation française la plus naturelle.
- source_word: καὶ
  choice: et
  rationale: La conjonction relie cette exhortation à celles du verset précédent.
- source_word: αὐτούς
  choice: les
  rationale: Le pronom renvoie aux personnes qui travaillent parmi les croyants, les dirigent et les avertissent, mentionnées au verset précédent.
