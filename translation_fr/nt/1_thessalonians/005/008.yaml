source:
  edition: SBLGNT
  text: ἡμεῖς δὲ ἡμέρας ὄντες νήφωμεν, ἐνδυσάμενοι θώρακα πίστεως καὶ ἀγάπης καὶ περικεφαλαίαν ἐλπίδα σωτηρίας·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/008.yaml
  text: But since we are of the day[a], let us be sober, having put on the breastplate of faith and love[b], and the hope of salvation as a helmet.
translation:
  language: fr
  text: Mais nous, qui sommes du jour, soyons sobres, ayant revêtu la cuirasse de la foi et de l’amour[a], et, pour casque, l’espérance du salut[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de la fidélité et de l’amour ». Le mot grec peut signifier « foi », « confiance » ou « fidélité ».
    reason: lexical_alternative
  - marker: b
    text: 'On peut aussi traduire : « et l’espérance du salut comme casque ».'
    reason: rendering_alternative
lexical_decisions:
- source_word: ἡμεῖς δὲ
  choice: Mais nous
  rationale: δέ marque le contraste avec ceux qui appartiennent à la nuit dans le contexte précédent; « Mais nous » le rend naturellement sans ajouter un lien causal absent de la conjonction elle-même.
- source_word: ἡμέρας ὄντες
  choice: qui sommes du jour
  rationale: Cette formulation conserve la métaphore grecque et exprime l’appartenance ou la sphère, plutôt qu’un simple moment de la journée.
- source_word: νήφωμεν
  choice: restons sobres
  rationale: νήφω évoque à la fois la sobriété et la vigilance lucide. « Restons sobres » s’accorde avec l’exhortation du contexte et demeure naturel en français.
- source_word: ἐνδυσάμενοι
  choice: ayant revêtu
  rationale: Le participe aoriste accompagne l’exhortation et introduit l’image de l’armure; « ayant revêtu » en conserve la forme et la relation sans la préciser excessivement.
- source_word: θώρακα
  choice: cuirasse
  rationale: Terme français courant et précis pour la pièce d’armure protégeant le torse.
- source_word: πίστεως
  choice: foi
  rationale: Dans la triade foi, amour et espérance, « foi » est le sens le plus naturel, tout en laissant « fidélité » comme possibilité lexicale en note.
- source_word: ἀγάπης
  choice: amour
  rationale: Équivalent direct et usuel de ἀγάπη dans cette triade de vertus.
- source_word: περικεφαλαίαν
  choice: casque
  rationale: Équivalent français direct du terme militaire grec.
- source_word: ἐλπίδα σωτηρίας
  choice: l’espérance du salut
  rationale: La formulation reste proche du grec et peut exprimer une espérance orientée vers le salut sans réduire la relation du génitif à une seule analyse.
theological_decisions:
- issue: Sens de πίστις dans la métaphore de l’armure
  choice: foi
  alternative: fidélité
  rationale: L’association avec l’amour et l’espérance favorise ici « foi », mais πίστις peut aussi désigner la fidélité; cette possibilité est conservée en note.
- issue: Portée de ἡμέρας ὄντες
  choice: nous qui sommes du jour
  alternative: nous qui appartenons au jour
  rationale: Le choix principal préserve la tournure métaphorique et sa concision, tandis que l’alternative explicite davantage l’idée d’appartenance.
- issue: Relation entre l’espérance du salut et le casque
  choice: ainsi que, pour casque, l’espérance du salut
  alternative: et l’espérance du salut comme casque
  rationale: La formulation retenue reproduit clairement la fonction métaphorique de l’espérance sans transformer cette image en identité ontologique stricte.
translation_notes:
  register: Français international moderne, digne et accessible. La métaphore du jour, l’appel à la sobriété et l’image militaire sont conservés. Les virgules autour de « pour casque » facilitent la lecture sans supprimer l’ordre imagé de la phrase.
