id: 1TH.5.2
reference: 1 Thessalonians 5:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: αὐτοὶ γὰρ ἀκριβῶς οἴδατε ⸀ὅτι ἡμέρα κυρίου ὡς κλέπτης ἐν νυκτὶ οὕτως ἔρχεται.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/002.yaml
  text: For you yourselves know very well that the day of the Lord comes like a thief in the night.
translation:
  language: fr
  text: Car vous savez vous-mêmes très bien que le jour du Seigneur vient comme un voleur dans la nuit.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αὐτοὶ
  choice: vous-mêmes
  rationale: Le pronom intensif souligne que les destinataires possèdent eux-mêmes cette connaissance. « Vous-mêmes » conserve naturellement cette insistance en français.
- source_word: γὰρ
  choice: Car
  rationale: La conjonction introduit l’explication de l’affirmation précédente. « Car » en préserve clairement la valeur explicative dans un registre digne et courant.
- source_word: ἀκριβῶς
  choice: très bien
  rationale: Avec le verbe « savoir », « très bien » exprime idiomatiquement une connaissance exacte ou assurée, sans la raideur possible de « exactement ».
- source_word: οἴδατε
  choice: savez
  rationale: « Savoir » rend directement et naturellement le sens du verbe dans cette proposition complétive.
- source_word: ὅτι
  choice: que
  rationale: « Que » introduit normalement en français le contenu de ce que les destinataires savent.
- source_word: ἡμέρα κυρίου
  choice: le jour du Seigneur
  rationale: Cette expression biblique établie désigne ici le jour eschatologique de l’intervention divine, et non un jour hebdomadaire de culte.
- source_word: ὡς κλέπτης ἐν νυκτὶ
  choice: comme un voleur dans la nuit
  rationale: La formulation conserve l’image grecque et exprime naturellement le caractère inattendu de la venue, sans ajouter de précision doctrinale.
- source_word: οὕτως ἔρχεται
  choice: vient comme
  rationale: En français, la correspondance de manière marquée par οὕτως s’intègre naturellement à la comparaison introduite par « comme ». Le présent « vient » conserve la vivacité du grec tout en pouvant viser un événement futur.
theological_decisions:
- issue: Sens de l’expression eschatologique ἡμέρα κυρίου
  choice: le jour du Seigneur
  alternative: le jour qui appartient au Seigneur
  rationale: Le contexte concerne le moment et la soudaineté de l’intervention eschatologique divine. La formule biblique traditionnelle et transparente « le jour du Seigneur » respecte cet arrière-plan sans l’identifier à un jour liturgique.
- issue: Portée de la comparaison avec un voleur dans la nuit
  choice: Conserver la comparaison sans l’expliciter
  alternative: Ajouter que le jour vient soudainement ou secrètement
  rationale: L’image suggère une arrivée inattendue, mais le verset ne développe ni calendrier eschatologique ni doctrine de la discrétion de l’événement. La traduction maintient donc l’image et sa tension propres.
translation_notes:
  register: 'Français international moderne, clair et digne. La syntaxe reste proche du grec tout en étant naturelle : l’emphase de αὐτοὶ est conservée par « vous-mêmes », et « très bien » rend idiomatiquement ἀκριβῶς avec « savez ».'
