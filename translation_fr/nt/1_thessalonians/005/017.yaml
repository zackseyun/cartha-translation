lexical_decisions:
- source_word: ἀδιαλείπτως
  choice: sans cesse
  rationale: Cette locution naturelle et concise exprime la persévérance continue ou régulière indiquée par l’adverbe grec, sans imposer nécessairement l’idée d’une activité verbale ininterrompue à chaque seconde.
- source_word: προσεύχεσθε
  choice: Priez
  rationale: L’impératif présent à la deuxième personne du pluriel appelle la communauté à une pratique durable de la prière. « Priez » rend directement l’exhortation, tandis que « sans cesse » en exprime déjà l’aspect continu.
theological_decisions:
- issue: Portée pratique du commandement
  choice: Une exhortation générale à persévérer dans la prière
  alternative: L’obligation de formuler explicitement une prière sans aucune interruption
  rationale: L’impératif présent associé à ἀδιαλείπτως invite à une vie de prière constante et persévérante. La traduction conserve la force de l’expression sans trancher en faveur d’une interprétation ascétique ou littéraliste particulière.
translation_notes:
  register: Français international moderne, simple et digne. « Priez sans cesse » est idiomatique, mémorable et proche de la concision du grec.
