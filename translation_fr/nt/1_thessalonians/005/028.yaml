  text: The grace of our Lord Jesus Christ be with you[a].
translation:
  language: fr
  text: Que la grâce de notre Seigneur Jésus-Christ soit avec vous[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « La grâce de notre Seigneur Jésus-Christ avec vous »; le grec omet le verbe dans cette formule de bénédiction.'
    reason: Précision sur l’ellipse verbale du texte source.
lexical_decisions:
- source_word: χάρις
  choice: grâce
  rationale: Dans les bénédictions pauliniennes, χάρις désigne la faveur bienveillante de Dieu; « grâce » en est l’équivalent français consacré, précis et naturel.
- source_word: κυρίου
  choice: Seigneur
  rationale: Dans cette formule christologique, κύριος est un titre appliqué à Jésus; « Seigneur » en conserve la portée.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jésus-Christ
  rationale: « Jésus-Christ » est la forme française courante et digne de cette désignation dans une formule paulinienne fixe. Elle conserve le titre Χριστός sous sa forme traditionnellement reçue en français.
- source_word: μεθ’ ὑμῶν
  choice: soit avec vous
  rationale: Le grec dit littéralement « avec vous » sans verbe. Le subjonctif « soit » explicite naturellement en français la valeur de souhait ou de bénédiction de la formule.
theological_decisions:
- issue: Valeur de Χριστοῦ dans la formule « notre Seigneur Jésus-Christ »
  choice: Christ
  alternative: le Messie
  rationale: Χριστός signifie « Messie », mais dans cette formule de clôture établie il fonctionne étroitement avec le nom Jésus. « Jésus-Christ » est donc le rendu français le plus naturel, sans nier la valeur messianique du titre.
- issue: Force de la formule grecque sans verbe
  choice: Que… soit avec vous
  alternative: La grâce de notre Seigneur Jésus-Christ avec vous
  rationale: La phrase grecque est elliptique et exprime une bénédiction. L’ajout de « Que… soit » restitue cette force en français sans transformer le souhait en simple affirmation.
translation_notes:
  register: Français international moderne, sobre et liturgiquement digne. La tournure « Que… soit » reste immédiatement compréhensible tout en conservant le caractère de bénédiction finale.
