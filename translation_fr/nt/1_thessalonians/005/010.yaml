id: 1TH.5.10
reference: 1 Thessalonians 5:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τοῦ ἀποθανόντος ⸀περὶ ἡμῶν ἵνα εἴτε γρηγορῶμεν εἴτε καθεύδωμεν ἅμα σὺν αὐτῷ ζήσωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/010.yaml
  text: who died for us[a], so that whether we are awake or asleep, we may live together with him.
translation:
  language: fr
  text: lui qui est mort pour nous, afin que, éveillés ou endormis[a], nous vivions ensemble avec lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vigilants ou endormis ». L’expression peut faire écho à l’appel à la vigilance dans le contexte immédiat, bien qu’elle désigne probablement ici les croyants encore en vie ou déjà morts.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποθανόντος
  choice: qui est mort
  rationale: Le participe aoriste renvoie au Seigneur Jésus mentionné au verset précédent. Une proposition relative est naturelle en français et exprime clairement l’événement accompli.
- source_word: περὶ ἡμῶν
  choice: pour nous
  rationale: Dans ce contexte sotériologique, περί avec le génitif signifie que sa mort a eu lieu en notre faveur, sans préciser davantage le mécanisme théologique.
- source_word: ἵνα
  choice: afin que
  rationale: Cette formulation française courante et digne conserve la valeur de but ou de résultat visé.
- source_word: γρηγορῶμεν
  choice: éveillés
  rationale: Le terme peut évoquer la vigilance ou l’état des vivants. « Éveillés » maintient cette image et son contraste avec « endormis ».
- source_word: καθεύδωμεν
  choice: endormis
  rationale: Le mot peut désigner le sommeil et, métaphoriquement, la mort. « Endormis » conserve la métaphore sans trancher dans le texte principal.
- source_word: ἅμα σὺν αὐτῷ
  choice: ensemble avec lui
  rationale: Cette traduction rend à la fois l’idée de communauté exprimée par ἅμα et l’association au Christ marquée par σύν.
- source_word: ζήσωμεν
  choice: nous vivions
  rationale: Le subjonctif français après « afin que » rend naturellement le subjonctif grec exprimant le but ou le résultat visé.
theological_decisions:
- issue: Sens de « éveillés ou endormis »
  choice: Conserver la métaphore, qui renvoie probablement au fait d’être vivant ou mort.
  alternative: Comprendre les mots comme une opposition entre vigilance spirituelle et relâchement moral.
  rationale: Le contexte immédiat emploie ce vocabulaire pour exhorter à la vigilance, mais 1 Thessaloniciens 4.13-15 appelle « endormis » les croyants décédés. L’affirmation selon laquelle les uns comme les autres vivront avec le Christ favorise ici le contraste entre vivants et morts, sans supprimer l’écho possible à l’exhortation précédente.
translation_notes:
  register: Français international moderne, simple et digne. La construction conserve le lien syntaxique avec le verset précédent et maintient l’ambiguïté des images grecques.
