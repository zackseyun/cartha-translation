source:
  edition: SBLGNT
  text: ὑμεῖς δέ, ἀδελφοί, οὐκ ἐστὲ ἐν σκότει, ἵνα ἡ ἡμέρα ὑμᾶς ὡς ⸀κλέπτης καταλάβῃ,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/004.yaml
  text: But you[a], brothers, are not in darkness[b], so that the day would overtake you like a thief.
translation:
  language: fr
  text: Mais vous, frères[a], vous n’êtes pas dans les ténèbres, pour que ce jour[b] vous surprenne comme un voleur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ici, « frères » peut désigner les frères et les sœurs de l’assemblée.
    reason: lexical_alternative
  - marker: b
    text: Dans le contexte immédiat, il s’agit du jour du Seigneur.
    reason: cross_reference
lexical_decisions:
- source_word: ὑμεῖς δέ
  choice: Mais vous, … vous
  rationale: δέ marque le contraste avec ceux qui viennent d’être décrits, et le pronom explicite ὑμεῖς est emphatique. La reprise « vous… vous » rend cette mise en relief de façon naturelle en français.
- source_word: ἀδελφοί
  choice: frères
  rationale: Le vocatif masculin pluriel signifie littéralement « frères ». Le texte principal conserve cette forme, tandis qu’une note signale qu’elle peut inclure les femmes de l’assemblée.
- source_word: ἐν σκότει
  choice: dans les ténèbres
  rationale: Cette formulation conserve l’image métaphorique et sa portée morale et spirituelle, sans la réduire à la simple ignorance.
- source_word: ἵνα
  choice: pour que
  rationale: La tournure préserve le lien syntaxique grec et laisse ouverte la nuance exacte entre but et conséquence envisagée.
- source_word: ἡ ἡμέρα
  choice: ce jour
  rationale: L’article désigne le jour eschatologique déjà évoqué dans le contexte. « Ce jour » est naturel en français et identifie un jour déterminé sans développer le grec en « jour du Seigneur » dans le corps du texte.
- source_word: ὡς κλέπτης
  choice: comme un voleur
  rationale: Cette expression française courante conserve directement la comparaison introduite par ὡς.
- source_word: καταλάβῃ
  choice: surprenne
  rationale: Dans l’image d’un jour venant comme un voleur, καταλαμβάνω évoque le fait d’atteindre quelqu’un à l’improviste. « Surprendre » exprime naturellement cette arrivée inattendue, sans ajouter une idée de condamnation.
theological_decisions:
- issue: Portée de l’adresse masculine ἀδελφοί dans une assemblée mixte
  choice: frères
  alternative: frères et sœurs
  rationale: La forme masculine du grec est maintenue dans le texte, mais son emploi collectif probable pour l’ensemble de la communauté est indiqué en note.
- issue: Référent eschatologique de ἡ ἡμέρα
  choice: ce jour
  alternative: le jour du Seigneur
  rationale: Le contexte immédiat, notamment le verset 2, identifie ce jour comme le jour du Seigneur. Le texte principal ne développe toutefois pas l’expression grecque, qui dit seulement « le jour ».
- issue: Nuance de ἵνα après la négation
  choice: pour que
  alternative: de sorte que
  rationale: La construction peut être comprise en termes de résultat ou de conséquence envisagée plutôt que comme un but strict. « Pour que » garde la structure du grec, sans trancher explicitement cette nuance.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition « vous… vous » porte l’emphase du pronom grec. Les images des ténèbres et du voleur sont conservées. Les deux appels de note [a] et [b] figurent dans le texte principal.
