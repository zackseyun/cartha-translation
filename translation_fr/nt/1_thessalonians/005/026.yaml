  text: ἀσπάσασθε τοὺς ἀδελφοὺς πάντας ἐν φιλήματι ἁγίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/026.yaml
  text: Greet all the brothers with a holy kiss[a][b].
translation:
  language: fr
  text: Saluez tous les frères par un saint baiser[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tous les frères et sœurs », car « frères » peut désigner ici l’ensemble de la communauté croyante.
    reason: lexical_alternative
  - marker: b
    text: Le « saint baiser » était un signe culturellement reconnu d’affection et de communion fraternelle entre chrétiens.
    reason: cultural_note
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: Saluez
  rationale: Impératif aoriste moyen, deuxième personne du pluriel. « Saluez » rend directement et naturellement l’exhortation ainsi que le sens social de ἀσπάζομαι.
- source_word: ἀδελφοὺς
  choice: les frères
  rationale: Le grec emploie le masculin pluriel. « Les frères » en conserve la forme, tandis qu’une note indique que, dans ce contexte communautaire, le terme peut désigner l’ensemble des croyants, hommes et femmes.
- source_word: πάντας
  choice: tous
  rationale: πάντας souligne que personne dans le groupe ne doit être exclu. « Tous » en est l’équivalent français le plus direct.
- source_word: ἐν φιλήματι ἁγίῳ
  choice: par un saint baiser
  rationale: Ici, ἐν indique le moyen ou la manière. « Par » est idiomatique dans la tournure française « saluer par un baiser »; φίλημα désigne précisément un baiser et ἁγίῳ le qualifie de saint, c’est-à-dire propre à la communion consacrée des croyants.
theological_decisions:
- issue: Portée genrée de ἀδελφοί dans un contexte d’Église
  choice: les frères
  alternative: les frères et sœurs
  rationale: La formulation principale conserve le masculin pluriel du texte grec sans décider silencieusement que seules des personnes de sexe masculin sont visées. La note préserve la portée inclusive probable du terme dans l’adresse à toute la communauté.
translation_notes:
  register: Français international moderne, concis et digne. La tournure « saluer quelqu’un par un baiser » est naturelle; l’expression traditionnelle « saint baiser » conserve le caractère distinctif de l’original sans l’expliciter dans le corps du verset.
