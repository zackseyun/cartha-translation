  text: ἵνα περιπατῆτε εὐσχημόνως πρὸς τοὺς ἔξω καὶ μηδενὸς χρείαν ἔχητε.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/012.yaml
  text: so that you may walk properly before outsiders and have need of nothing[a].
translation:
  language: fr
  text: afin que vous vous conduisiez convenablement envers ceux du dehors et que vous n’ayez besoin de rien[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « que vous n’ayez besoin de personne ». L’expression peut souligner le fait de ne pas dépendre des autres.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἵνα
  choice: afin que
  rationale: Introduit le but ou le résultat des exhortations précédentes et en conserve clairement la valeur finale.
- source_word: περιπατῆτε
  choice: vous vous conduisiez
  rationale: Le verbe signifie littéralement « marcher », mais désigne ici la manière de vivre. En français courant, « vous vous conduisiez » restitue naturellement cet emploi métaphorique sans obscurité.
- source_word: εὐσχημόνως
  choice: convenablement
  rationale: Exprime une conduite correcte, digne et socialement respectable, sans renforcer indûment la nuance morale.
- source_word: πρὸς τοὺς ἔξω
  choice: envers ceux du dehors
  rationale: « Envers » rend la relation à ces personnes, tandis que « ceux du dehors » conserve l’expression propre aux premières communautés chrétiennes sans expliciter davantage que le grec.
- source_word: μηδενὸς χρείαν ἔχητε
  choice: vous n’ayez besoin de rien
  rationale: Rend étroitement la construction grecque et son idée générale d’absence de manque, tout en laissant le contexte évoquer l’indépendance matérielle.
theological_decisions:
- issue: Sens de la proposition finale μηδενὸς χρείαν ἔχητε
  choice: « vous n’ayez besoin de rien », qui met au premier plan l’absence de manque matériel
  alternative: « vous n’ayez besoin de personne », qui souligne la non-dépendance envers autrui
  rationale: Dans le contexte du travail manuel et d’une vie paisible, l’indépendance matérielle est vraisemblablement visée. Toutefois, la formulation grecque demeure assez large; le texte principal suit la lecture grammaticale la plus naturelle et la note conserve l’autre interprétation plausible.
translation_notes:
  register: Français international moderne, naturel et digne. « Ceux du dehors » conserve la distinction communautaire du grec; « vous vous conduisiez » évite le calque potentiellement opaque « marchiez ».
