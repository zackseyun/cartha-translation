id: 1TH.4.2
reference: 1 Thessalonians 4:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οἴδατε γὰρ τίνας παραγγελίας ἐδώκαμεν ὑμῖν διὰ τοῦ κυρίου Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/002.yaml
  text: For you know what instructions we gave you through the Lord Jesus[a].
translation:
  language: fr
  text: Vous savez, en effet, quelles instructions nous vous avons données par le Seigneur Jésus[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « par l’autorité du Seigneur Jésus » ou « de la part du Seigneur Jésus ».'
    reason: La préposition διά avec le génitif peut ici mettre l’accent sur l’intermédiaire, l’agence ou l’autorité du Seigneur Jésus.
lexical_decisions:
- source_word: οἴδατε
  choice: vous savez
  rationale: Le parfait οἶδα a un sens présent en grec koinè; « vous savez » est la formulation française naturelle.
- source_word: γὰρ
  choice: en effet
  rationale: La particule rattache cette affirmation à ce qui précède en donnant une explication; « en effet » préserve ce lien de manière idiomatique.
- source_word: τίνας παραγγελίας
  choice: quelles instructions
  rationale: παραγγελία désigne une instruction à caractère autoritatif. « Quelles instructions » rend naturellement le pluriel et le contenu connu des destinataires.
- source_word: ἐδώκαμεν ὑμῖν
  choice: nous vous avons données
  rationale: L’aoriste renvoie ici aux instructions communiquées antérieurement; le passé composé convient au français courant, avec le pronom indirect placé naturellement.
- source_word: διὰ τοῦ κυρίου Ἰησοῦ
  choice: par le Seigneur Jésus
  rationale: Avec le génitif, διά peut exprimer l’intermédiaire ou l’agent. « Par » conserve cette latitude en français sans réduire explicitement l’expression à la seule idée d’autorité.
- source_word: κυρίου
  choice: Seigneur
  rationale: « Seigneur » est l’équivalent français usuel de κύριος dans ce titre.
- source_word: Ἰησοῦ
  choice: Jésus
  rationale: Le nom propre est rendu selon sa forme française conventionnelle.
theological_decisions:
- issue: Valeur de διὰ τοῦ κυρίου Ἰησοῦ
  choice: par le Seigneur Jésus
  alternative: de la part du Seigneur Jésus / par l’autorité du Seigneur Jésus
  rationale: La construction peut évoquer la médiation ou l’agence du Seigneur Jésus, tout en impliquant son autorité. Le texte principal garde la formulation plus ouverte « par », tandis que la note explicite la nuance d’autorité possible sans l’imposer.
translation_notes:
  register: Français international moderne, clair et digne. L’ordre « Vous savez, en effet » conserve le lien explicatif de γὰρ sans raideur. « Instructions » reste accessible tout en laissant au contexte leur caractère autoritatif.
