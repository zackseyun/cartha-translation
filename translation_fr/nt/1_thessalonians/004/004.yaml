id: 1TH.4.4
reference: 1 Thessalonians 4:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἰδέναι ἕκαστον ὑμῶν τὸ ἑαυτοῦ σκεῦος κτᾶσθαι ἐν ἁγιασμῷ καὶ τιμῇ,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/004.yaml
  text: that each of you know how to acquire his own vessel in holiness and honor,
translation:
  language: fr
  text: que chacun de vous sache acquérir son propre vase[a] dans la sainteté et l’honneur,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « vase » ou « récipient ». Le terme grec peut désigner métaphoriquement le corps; certains comprennent ici l’épouse. Le verbe traduit par « acquérir » peut aussi être rendu, selon l’interprétation, par « prendre possession de ».
    reason: La note est nécessaire pour rendre intelligible la métaphore française tout en préservant l’ambiguïté lexicale et exégétique du grec.
lexical_decisions:
- source_word: εἰδέναι
  choice: sache
  rationale: L’infinitif exprime ici le fait de savoir comment agir; « sache » s’intègre naturellement à la construction française du contexte.
- source_word: ἕκαστον ὑμῶν
  choice: chacun de vous
  rationale: Correspondance directe, claire et idiomatique.
- source_word: τὸ ἑαυτοῦ σκεῦος
  choice: son propre vase
  rationale: « Vase » conserve la métaphore et, surtout, l’ambiguïté réelle de σκεῦος, que le contexte peut faire comprendre comme le corps ou comme l’épouse, sans imposer l’une des deux interprétations dans le texte.
- source_word: κτᾶσθαι
  choice: acquérir
  rationale: Le présent infinitif de κτάομαι signifie normalement « acquérir, obtenir ». Ce choix respecte la valeur lexicale sans la remplacer par « maîtriser » ou « posséder », qui orienteraient davantage l’interprétation.
- source_word: ἐν ἁγιασμῷ καὶ τιμῇ
  choice: dans la sainteté et l’honneur
  rationale: Rend directement les deux noms grecs et maintient leur portée morale et théologique sans explicitation excessive.
theological_decisions:
- issue: Référent de « vase » (σκεῦος)
  choice: Conserver « vase » dans le texte et signaler les deux principales compréhensions en note.
  alternative: Traduire explicitement par « corps » ou par « femme/épouse ».
  rationale: Le grec permet une discussion réelle entre une référence au propre corps et une référence à l’acquisition d’une épouse. Choisir l’une dans le texte supprimerait une ambiguïté ancienne ayant des conséquences exégétiques.
- issue: Valeur de κτᾶσθαι
  choice: « acquérir »
  alternative: « posséder », « garder la maîtrise de » ou « savoir se conduire avec ».
  rationale: « Acquérir » reflète le sens verbal le plus direct de κτάομαι et maintient la tension interprétative avec « son propre vase ».
translation_notes:
  register: Français international moderne, sobre et digne. La formulation volontairement proche de la métaphore grecque est moins courante en français actuel, mais la note empêche l’opacité tout en évitant de trancher une ambiguïté substantielle.
