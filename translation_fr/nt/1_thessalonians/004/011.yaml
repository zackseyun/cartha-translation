id: 1TH.4.11
reference: 1 Thessalonians 4:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ φιλοτιμεῖσθαι ἡσυχάζειν καὶ πράσσειν τὰ ἴδια καὶ ἐργάζεσθαι ⸀ταῖς χερσὶν ὑμῶν, καθὼς ὑμῖν παρηγγείλαμεν,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/011.yaml
  text: and to aspire to live quietly[a], to mind your own affairs, and to work with your own hands, just as we commanded you[b],
translation:
  language: fr
  text: et à avoir pour ambition de vivre tranquillement[a], de vous occuper de vos propres affaires et de travailler de vos propres mains, comme nous vous l’avons commandé,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « à vous faire un point d’honneur de vivre tranquillement ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: φιλοτιμεῖσθαι
  choice: mettre votre honneur à
  rationale: Le verbe exprime l’idée de tenir une conduite pour honorable et d’en faire l’objet de ses efforts. Cette formulation conserve la force singulière de l’ambition appliquée à une vie calme, tout en restant naturelle en français.
- source_word: ἡσυχάζειν
  choice: vivre dans le calme
  rationale: Dans cette exhortation, le verbe désigne une manière de vivre paisible et posée plutôt qu’un silence absolu.
- source_word: πράσσειν τὰ ἴδια
  choice: vous occuper de vos propres affaires
  rationale: L’expression renvoie au fait de veiller à ses propres responsabilités. Cette traduction restitue l’idiome sans la rudesse que peut avoir « vous mêler de vos affaires ».
- source_word: ἐργάζεσθαι
  choice: travailler
  rationale: Le terme désigne simplement l’action de travailler; ce choix courant convient au contexte du travail manuel.
- source_word: ταῖς χερσὶν ὑμῶν
  choice: de vos mains
  rationale: Le datif est instrumental et le possessif est explicitement rendu. En français, « travailler de vos mains » exprime naturellement le travail manuel personnel.
- source_word: καθὼς
  choice: comme
  rationale: Le terme introduit la conformité à l’instruction apostolique donnée auparavant. « Comme » est naturel et suffisamment précis ici.
- source_word: παρηγγείλαμεν
  choice: nous vous l’avons commandé
  rationale: Le verbe porte ici la force d’une directive autorisée; « commandé » en préserve le poids sans ajouter d’idée étrangère.
theological_decisions:
- issue: Force éthique de l’instruction apostolique
  choice: « nous vous l’avons commandé »
  alternative: « nous vous l’avons recommandé » ou « demandé »
  rationale: Le grec παραγγέλλω présente cette exhortation comme une directive faisant autorité. « Commandé » maintient cette force morale sans l’atténuer.
translation_notes:
  register: Français international moderne, digne et accessible. La coordination infinitive est maintenue pour respecter la structure de l’exhortation. « Vivre dans le calme » évite de réduire ἡσυχάζειν au seul silence verbal; la note conserve plus explicitement le paradoxe lexical entre ambition et tranquillité.
