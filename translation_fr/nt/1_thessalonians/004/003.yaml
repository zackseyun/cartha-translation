reference: 1 Thessalonians 4:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τοῦτο γάρ ἐστιν θέλημα τοῦ θεοῦ, ὁ ἁγιασμὸς ὑμῶν, ἀπέχεσθαι ὑμᾶς ἀπὸ τῆς πορνείας,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/003.yaml
  text: 'For this is the will of God: your sanctification—that you abstain from sexual immorality[a][b].'
translation:
  language: fr
  text: 'Car la volonté de Dieu, c’est votre sanctification : vous abstenir de l’immoralité sexuelle[a][b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « votre sainteté ».
    reason: lexical_alternative
  - marker: b
    text: 'Grec porneia, terme général désignant les conduites sexuelles illicites. Traduction traditionnelle : « fornication ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: θέλημα
  choice: volonté
  rationale: « Volonté » rend naturellement l’intention à la fois désirée et normative de Dieu ; « désir » serait trop faible et « dessein » pourrait suggérer un décret plus étroit que ne l’exige le contexte.
- source_word: ὁ ἁγιασμὸς ὑμῶν
  choice: votre sanctification
  rationale: Le terme désigne ici la consécration à Dieu manifestée dans une vie sainte. « Sanctification » conserve sa portée paulinienne, sans réduire le sens à un simple statut ni à un seul processus moral.
- source_word: ἀπέχεσθαι ὑμᾶς
  choice: que vous vous absteniez
  rationale: L’infinitif précise concrètement ce qu’implique ici la sanctification. La tournure française avec « que » exprime clairement ce rapport explicatif.
- source_word: πορνείας
  choice: l’immoralité sexuelle
  rationale: πορνεία est un terme large qui désigne les conduites sexuelles illicites. « Immoralité sexuelle » en préserve l’étendue, contrairement à « fornication », aujourd’hui vieilli et souvent compris dans un sens plus restreint.
- source_word: γάρ
  choice: Car
  rationale: « Car » conserve le lien logique avec l’exhortation précédente en introduisant son fondement.
theological_decisions:
- issue: Sens de ἁγιασμός dans l’exhortation éthique
  choice: « sanctification », dont le contenu éthique est précisé par la proposition suivante
  alternative: « sainteté », pour mettre davantage l’accent sur l’état ou la qualité résultante
  rationale: Le verset présente la volonté de Dieu comme la vie consacrée des croyants, notamment dans le domaine sexuel. Le choix retenu préserve la tension entre état consacré et cheminement pratique sans imposer une définition doctrinale plus étroite.
- issue: Étendue de πορνεία
  choice: Terme général rendu par « immoralité sexuelle »
  alternative: « fornication » ou « débauche sexuelle »
  rationale: Le grec ne se limite pas explicitement aux relations sexuelles avant le mariage ni à une forme particulière d’inconduite ; la traduction conserve donc sa portée générale.
translation_notes:
  register: Français international moderne, clair et digne. « C’est-à-dire » explicite la fonction explicative de l’infinitif grec sans ajouter de contenu doctrinal. Le vocabulaire théologique établi « sanctification » est conservé, avec une variante courante en note.
