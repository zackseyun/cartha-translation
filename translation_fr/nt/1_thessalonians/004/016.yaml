review_pass:
  verdict: revise
  source_fidelity: 'Le projet rend fidèlement les éléments essentiels du grec : l’insistance de « le Seigneur lui-même », les trois compléments introduits par ἐν, la descente « du ciel », ainsi que l’antériorité de la résurrection des morts en Christ/Messie. Cependant, « Alors » n’est pas exprimé dans le texte source : καί coordonne simplement la proposition suivante.'
  naturalness: Le français est globalement naturel et digne. « Au cri de commandement », « à la voix d’un archange » et « au son de la trompette de Dieu » forment une énumération idiomatique. « Dans le Messie » conserve volontairement la formulation théologique du grec, même si elle est moins usuelle que la formule traditionnelle « en Christ ».
  terminology: « Seigneur », « Messie » et « trompette de Dieu » sont appropriés. La note traditionnelle doit employer la tournure française établie « en Christ », plutôt que « dans le Christ ».
  issues:
  - severity: low
    issue: Ajout de « Alors »
    rationale: Le grec porte καί (« et »), non un adverbe temporel. Même si la séquence est implicite dans le contexte, « Alors » explicite plus que le texte.
  - severity: low
    issue: 'Note b : « dans le Christ »'
    rationale: La formulation traditionnelle française de ἐν Χριστῷ est « en Christ ». La note doit refléter cet usage sans modifier le choix principal « dans le Messie ».
  revised_text: Car le Seigneur lui-même descendra du ciel au cri de commandement[a], à la voix d’un archange et au son de la trompette de Dieu, et les morts dans le Messie ressusciteront d’abord[b].
