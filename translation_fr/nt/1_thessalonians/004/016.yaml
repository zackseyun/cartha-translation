revisions:
- from: Car le Seigneur lui-même descendra du ciel au cri de commandement[a], à la voix d’un archange et au son de la trompette de Dieu. Alors, les morts dans le Messie ressusciteront d’abord[b].
  to: Car le Seigneur lui-même descendra du ciel au cri de commandement[a], à la voix d’un archange et au son de la trompette de Dieu, et les morts dans le Messie ressusciteront d’abord[b].
  rationale: La révision supprime l’adverbe « Alors », absent du grec, et maintient la coordination par « et ». Elle corrige aussi la note traditionnelle en « en Christ », qui correspond à l’usage français établi. Le reste de la traduction conserve convenablement l’ambiguïté syntaxique concernant le cri et la voix, ainsi que le rendu de Χριστός par « Messie ».
