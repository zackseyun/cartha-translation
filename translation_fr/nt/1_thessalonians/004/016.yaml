id: 1TH.4.16
reference: 1 Thessalonians 4:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὅτι αὐτὸς ὁ κύριος ἐν κελεύσματι, ἐν φωνῇ ἀρχαγγέλου καὶ ἐν σάλπιγγι θεοῦ, καταβήσεται ἀπ’ οὐρανοῦ, καὶ οἱ νεκροὶ ἐν Χριστῷ ἀναστήσονται πρῶτον,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/016.yaml
  text: For the Lord himself will descend from heaven with a command[a], with the voice of an archangel, and with the trumpet of God, and the dead in Messiah will rise first[b],
translation:
  language: fr
  text: Car le Seigneur lui-même descendra du ciel au cri de commandement[a], à la voix d’un archange et au son de la trompette de Dieu, et les morts dans le Messie ressusciteront d’abord[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à l’appel impérieux » ou « à l’ordre crié ». Le grec κέλευσμα peut désigner un ordre, un appel ou un cri de commandement.
    reason: lexical_alternative
  - marker: b
    text: 'Formulation traditionnelle : « les morts en Christ ressusciteront d’abord ».'
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: Car
  rationale: La conjonction introduit ici l’explication de l’assurance donnée au verset précédent; « Car » en restitue naturellement la valeur explicative.
- source_word: αὐτὸς ὁ κύριος
  choice: le Seigneur lui-même
  rationale: Le pronom intensif αὐτός met le sujet en relief; « lui-même » conserve cette insistance.
- source_word: ἐν κελεύσματι
  choice: au cri de commandement
  rationale: κέλευσμα désigne un ordre ou un appel impérieux, souvent lancé à haute voix. Cette formulation exprime à la fois le cri et sa force de commandement sans préciser qui le pousse.
- source_word: ἐν φωνῇ ἀρχαγγέλου
  choice: à la voix d’un archange
  rationale: φωνή signifie « voix », et l’absence d’article devant ἀρχαγγέλου n’impose pas l’idée d’un archange déterminé.
- source_word: ἐν σάλπιγγι θεοῦ
  choice: au son de la trompette de Dieu
  rationale: σάλπιγξ désigne une trompette. L’ajout idiomatique de « son » rend l’image naturelle en français tout en conservant le complément « de Dieu ».
- source_word: καταβήσεται ἀπ’ οὐρανοῦ
  choice: descendra du ciel
  rationale: Cette formulation rend directement le mouvement exprimé par καταβαίνω et conserve le registre solennel du passage.
- source_word: οἱ νεκροὶ ἐν Χριστῷ
  choice: les morts dans le Messie
  rationale: L’adjectif substantivé désigne « les morts », tandis que ἐν Χριστῷ exprime leur relation au Messie. Χριστός est rendu comme un titre, conformément à son sens d’« oint ».
- source_word: ἀναστήσονται πρῶτον
  choice: ressusciteront d’abord
  rationale: Le futur moyen exprime ici la résurrection. « D’abord » marque l’antériorité par rapport aux croyants vivants mentionnés au verset suivant, sans suggérer un rang honorifique.
theological_decisions:
- issue: Traduction de Χριστῷ dans ἐν Χριστῷ
  choice: dans le Messie
  alternative: dans le Christ
  rationale: Le terme fonctionne comme un titre. « Messie » en communique le sens, tandis que la formulation traditionnelle « dans le Christ » est signalée en note afin de ne pas effacer cet usage familier.
- issue: Identification de la voix et du cri
  choice: ne pas identifier celui qui pousse le cri ni assimiler explicitement la voix de l’archange à celle du Seigneur
  alternative: comprendre tous les éléments comme la voix du Seigneur
  rationale: La syntaxe énumère les circonstances de la descente sans trancher explicitement l’identité de celui qui crie ou parle; la traduction conserve cette ambiguïté.
translation_notes:
  register: Français international moderne, naturel et digne. La triple construction « au cri… à la voix… au son… » rend l’accompagnement exprimé par les trois emplois de ἐν sans alourdir la phrase. Une nouvelle phrase avec « Alors » explicite sobrement la progression syntaxique portée par καί.
