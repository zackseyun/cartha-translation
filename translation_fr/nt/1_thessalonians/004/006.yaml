source:
  edition: SBLGNT
  text: τὸ μὴ ὑπερβαίνειν καὶ πλεονεκτεῖν ἐν τῷ πράγματι τὸν ἀδελφὸν αὐτοῦ, διότι ἔκδικος ⸀κύριος περὶ πάντων τούτων, καθὼς καὶ προείπαμεν ὑμῖν καὶ διεμαρτυράμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/006.yaml
  text: that no one should overstep and exploit his brother in this matter[a], because the Lord is an avenger concerning all these things[b], just as we also told you beforehand and solemnly warned you.
translation:
  language: fr
  text: que personne ne dépasse les limites ni n’exploite son frère dans cette affaire[a], car le Seigneur demande compte de tout cela, comme nous vous l’avons déjà dit et vous en avons solennellement avertis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ni ne fraude son frère dans cette affaire ». Le grec peut désigner le fait de profiter de quelqu’un à ses dépens; certains comprennent ici plus précisément une fraude. Dans le contexte, l’avertissement concerne très probablement une faute sexuelle.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ μὴ ὑπερβαίνειν
  choice: que personne ne dépasse les limites
  rationale: L’infinitif substantivé poursuit l’exhortation du verset précédent. L’expression française conserve l’image d’une limite morale franchie tout en rendant naturellement la portée générale.
- source_word: πλεονεκτεῖν
  choice: ni n’exploite
  rationale: Le verbe désigne le fait de tirer indûment profit de quelqu’un ou de prendre l’avantage à ses dépens. « Exploiter » garde cette portée large sans limiter le tort à une fraude financière.
- source_word: ἐν τῷ πράγματι
  choice: dans cette affaire
  rationale: Le nom reste assez général, mais renvoie dans le contexte immédiat aux questions de conduite sexuelle. « Cette affaire » maintient ce lien sans expliciter plus que le grec.
- source_word: τὸν ἀδελφὸν αὐτοῦ
  choice: son frère
  rationale: Cette traduction respecte la forme masculine singulière du grec et son probable sens communautaire de frère dans la foi.
- source_word: ἔκδικος κύριος
  choice: le Seigneur fait justice
  rationale: ἔκδικος présente le Seigneur comme celui qui châtie le tort et rétablit la justice. Cette formulation française actuelle conserve la force judiciaire sans suggérer une vengeance passionnelle.
- source_word: περὶ πάντων τούτων
  choice: pour toutes ces choses
  rationale: La formulation conserve l’étendue du grec et renvoie à l’ensemble des fautes évoquées dans le passage.
- source_word: προείπαμεν
  choice: nous vous l’avons déjà dit
  rationale: Le verbe indique une communication antérieure; « déjà dit » exprime naturellement cette antériorité en français.
- source_word: διεμαρτυράμεθα
  choice: vous en avons solennellement avertis
  rationale: Le verbe exprime une attestation insistante ou une mise en garde solennelle; la traduction restitue ici sa force exhortative.
theological_decisions:
- issue: Référent de « cette affaire » et nature du tort
  choice: Le verset poursuit l’enseignement des versets 3 à 5 sur la conduite sexuelle et interdit de franchir les limites et d’exploiter un autre croyant dans ce domaine.
  alternative: Le verset pourrait viser plus généralement la fraude commerciale ou interpersonnelle.
  rationale: Le contexte immédiat porte sur la sanctification et l’immoralité sexuelle. Toutefois, les mots grecs restent assez généraux; le texte principal évite donc de préciser une forme particulière d’exploitation, et la note préserve l’autre compréhension.
- issue: Traduction de ἀδελφός
  choice: son frère
  alternative: un frère ou une sœur dans la foi; un autre croyant
  rationale: Le grec emploie un masculin singulier. Le texte principal en conserve la forme, tandis que la portée éthique peut s’étendre plus largement aux membres de la communauté.
- issue: Portée judiciaire de ἔκδικος appliqué au Seigneur
  choice: le Seigneur fait justice
  alternative: le Seigneur est le vengeur; le Seigneur punit
  rationale: La formulation choisie exprime l’intervention judiciaire du Seigneur contre ces torts tout en évitant les connotations modernes d’une vengeance personnelle incontrôlée.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste étroitement liée au grec, mais « fait justice » est préférée à « est un vengeur », moins naturelle et potentiellement trompeuse en français contemporain.
