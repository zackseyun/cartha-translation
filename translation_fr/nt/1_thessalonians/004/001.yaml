reference: 1 Thessalonians 4:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Λοιπὸν ⸀οὖν, ἀδελφοί, ἐρωτῶμεν ὑμᾶς καὶ παρακαλοῦμεν ἐν κυρίῳ Ἰησοῦ, ⸀ἵνα καθὼς παρελάβετε παρ’ ἡμῶν τὸ πῶς δεῖ ὑμᾶς περιπατεῖν καὶ ἀρέσκειν θεῷ, ⸂καθὼς καὶ περιπατεῖτε⸃, ἵνα περισσεύητε μᾶλλον.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/001.yaml
  text: Finally then[a], brothers, we ask and urge you in the Lord Jesus that, just as you received from us how you ought to walk and to please God, just as you are also walking, you abound more and more.
translation:
  language: fr
  text: 'Pour le reste donc, frères[a], nous vous le demandons et vous y exhortons dans le Seigneur Jésus : de même que vous avez reçu de nous comment vous devez vivre et plaire à Dieu — comme vous le faites déjà —, progressez encore davantage.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « frères et sœurs » : le grec dit « frères » et emploie souvent le masculin pluriel pour s’adresser à un groupe mixte.'
    reason: Préciser la portée inclusive probable de l’adresse grecque sans modifier sa forme dans le texte principal.
lexical_decisions:
- source_word: Λοιπὸν οὖν
  choice: Pour le reste donc
  rationale: Cette formulation marque à la fois la transition vers une nouvelle série d’exhortations et le lien logique avec ce qui précède, sans laisser entendre que la lettre touche immédiatement à sa fin.
- source_word: ἀδελφοί
  choice: frères
  rationale: Le masculin pluriel grec est conservé dans le texte; une note précise qu’il peut désigner ici l’ensemble de la communauté, femmes comprises.
- source_word: ἐρωτῶμεν ὑμᾶς καὶ παρακαλοῦμεν
  choice: nous vous le demandons et vous y exhortons
  rationale: 'Le double appel est maintenu : ἐρωτάω exprime la demande, tandis que παρακαλέω prend ici la force d’une exhortation pressante.'
- source_word: ἐν κυρίῳ Ἰησοῦ
  choice: dans le Seigneur Jésus
  rationale: La préposition et le titre christologique sont conservés; l’expression situe la demande dans la relation au Seigneur et sous son autorité.
- source_word: τὸ πῶς δεῖ ὑμᾶς περιπατεῖν
  choice: comment vous devez vivre
  rationale: Le sens paulinien de περιπατεῖν concerne la conduite habituelle. « Vivre » transmet naturellement ce sens en français moderne, là où « marcher » risquerait d’être compris au sens physique.
- source_word: καὶ ἀρέσκειν θεῷ
  choice: et plaire à Dieu
  rationale: Traduction directe et idiomatique du second infinitif coordonné.
- source_word: καθὼς καὶ περιπατεῖτε
  choice: et c’est bien ainsi que vous vivez
  rationale: La proposition reconnaît explicitement la conduite déjà présente des destinataires; « bien » rend ici la valeur confirmative de καί plutôt qu’un jugement moral ajouté.
- source_word: ἵνα περισσεύητε μᾶλλον
  choice: progressez encore davantage
  rationale: L’impératif français rend naturellement le contenu exhortatif introduit par ἵνα. « Progresser » exprime ici l’idée de dépasser le niveau déjà atteint, et « encore davantage » reflète μᾶλλον.
theological_decisions:
- issue: Portée de l’adresse ἀδελφοί
  choice: Conserver « frères » avec une note inclusive
  alternative: « frères et sœurs » dans le texte principal
  rationale: La forme grecque est masculine, tout en pouvant désigner une assemblée mixte. Le texte conserve cette donnée formelle et la note évite d’exclure les femmes de l’adresse.
- issue: Valeur de κύριος appliqué à Jésus
  choice: « Seigneur »
  alternative: « Maître »
  rationale: Dans ce contexte, κύριος fonctionne comme un titre christologique établi. « Seigneur » en conserve la portée sans l’affaiblir.
- issue: Forme de la demande introduite par ἵνα
  choice: Employer l’impératif « progressez » après les verbes de demande et d’exhortation
  alternative: Construire littéralement « nous demandons… que vous progressiez »
  rationale: L’impératif évite une construction française lourde tout en conservant la force exhortative. Il ne tranche pas plus précisément entre contenu et finalité que ne l’exige le contexte.
translation_notes:
  register: Français international actuel, digne et accessible. La structure conserve la transition, le double appel, l’autorité du Seigneur Jésus, la reconnaissance des progrès déjà accomplis et l’appel à aller plus loin. Les tirets isolent la remarque confirmative afin de rendre lisible la longue phrase grecque.
