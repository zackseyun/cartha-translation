  text: οὐ γὰρ ἐκάλεσεν ἡμᾶς ὁ θεὸς ἐπὶ ἀκαθαρσίᾳ ἀλλ’ ἐν ἁγιασμῷ.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/007.yaml
  text: For God did not call us for uncleanness[b][a], but in holiness.
translation:
  language: fr
  text: Car Dieu ne nous a pas appelés en vue de l’impureté[a], mais à vivre dans la sainteté[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « souillure ». Le terme grec désigne l’impureté morale, particulièrement l’impureté sexuelle dans ce contexte.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « dans la sanctification ». Le terme grec peut désigner la sainteté comme état ou la sanctification comme processus par lequel on devient saint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: Car
  rationale: La conjonction introduit la raison qui fonde l’exhortation précédente. « Car » rend clairement ce lien logique dans un registre digne et courant.
- source_word: ἐκάλεσεν
  choice: nous a appelés
  rationale: Le passé composé est naturel en français pour évoquer l’appel de Dieu dont les effets demeurent présents. Le verbe « appeler » conserve le terme biblique sans préciser un mécanisme théologique que le verset n’explicite pas.
- source_word: ἐπὶ ἀκαθαρσίᾳ
  choice: en vue de l’impureté
  rationale: Avec ἐπί et le datif, l’expression indique ici l’orientation ou le but. « En vue de » préserve cette nuance et évite de confondre cette construction avec ἐν ἁγιασμῷ.
- source_word: ἀκαθαρσίᾳ
  choice: impureté
  rationale: En français moderne, « impureté » exprime naturellement l’impureté morale et, dans le contexte immédiat de 4.3-8, notamment sexuelle, tout en gardant une portée plus large.
- source_word: ἐν ἁγιασμῷ
  choice: à vivre dans la sainteté
  rationale: « Dans la sainteté » rend la sphère ou la manière de vivre indiquée par ἐν. L’ajout explicatif « à vivre » produit une opposition française naturelle avec « appelés en vue de » sans réduire ἁγιασμός à un simple état abstrait.
- source_word: ἁγιασμῷ
  choice: sainteté
  rationale: Le nom grec peut désigner la sainteté ou la sanctification. Dans son opposition à l’impureté, « sainteté » convient bien à la condition et à la conduite auxquelles Dieu appelle, tandis qu’une note conserve la nuance de processus.
theological_decisions:
- issue: Sens de l’appel de Dieu
  choice: Un véritable appel divin qui fonde l’exigence d’une vie sainte, sans définir davantage son mode d’action
  alternative: Une simple invitation générale, ou explicitement un appel efficace au sens technique d’un système théologique
  rationale: Le texte présente l’appel de Dieu comme le fondement de la conduite des croyants, mais ne précise pas ici comment cet appel opère. La traduction conserve donc « appeler » sans ajouter de définition confessionnelle.
- issue: État ou processus dans ἁγιασμός
  choice: « Sainteté » dans le texte, avec « sanctification » en note
  alternative: « Sanctification » directement dans le texte
  rationale: L’antithèse avec l’impureté favorise ici l’idée d’une vie caractérisée par la sainteté, mais le terme grec peut aussi évoquer le processus par lequel on devient saint. La note maintient cette tension sémantique.
translation_notes:
  register: Français international moderne, clair et digne. « Impureté » est plus idiomatique aujourd’hui que « malpropreté » ou « impureté rituelle », et le contexte en précise la dimension morale. La formulation conserve la différence entre ἐπί (« en vue de ») et ἐν (« dans »), tout en rendant la seconde proposition naturelle grâce à « à vivre ».
