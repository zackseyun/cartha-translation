revisions:
- from: Mais nous ne voulons pas, frères et sœurs,[a] que vous soyez dans l’ignorance au sujet de ceux qui se sont endormis[b], afin que vous ne soyez pas dans la tristesse comme les autres, qui n’ont pas d’espérance.
  to: Mais nous ne voulons pas, frères,[a] que vous soyez dans l’ignorance au sujet de ceux qui se sont endormis,[b] afin que vous ne vous attristiez pas comme les autres, qui n’ont pas d’espérance.
  rationale: La révision conserve le connecteur « Mais », la métaphore du sommeil et le terme théologique « espérance ». Elle rétablit « frères » comme traduction directe de ἀδελφοί, tout en maintenant dans une note son emploi probablement collectif, et rend λυπῆσθε par le verbe français direct « vous attristiez ».
