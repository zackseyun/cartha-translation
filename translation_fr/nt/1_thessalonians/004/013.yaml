review_pass:
  verdict: revise
  source_fidelity: La phrase rend bien la progression grecque, la métaphore de κοιμωμένων et le contraste avec « les autres ». Toutefois, « afin que vous ne soyez pas dans la tristesse » affaiblit le verbe λυπέω (« s’attrister / éprouver du chagrin ») et sonne moins directement. « Frères et sœurs » explicite une portée vraisemblablement inclusive, mais ajoute « sœurs » au texte là où le grec porte ἀδελφοί; il est préférable de conserver « frères » dans le texte et d’expliquer la portée dans la note.
  naturalness: « Nous ne voulons pas, frères, que vous soyez dans l’ignorance » et « afin que vous ne vous attristiez pas » sont naturels en français international moderne, tout en gardant un registre épistolaire digne. « Se sont endormis » conserve de façon idiomatique l’image voulue.
  terminology: « Espérance » est approprié pour ἐλπίς dans ce contexte. La note sur le sommeil doit expliquer l’image sans restreindre indûment le référent grammatical à « des croyants », qualification qui n’est pas exprimée dans ce seul syntagme grec.
  issues:
  - severity: medium
    issue: Ajout de « sœurs » dans le texte principal
    rationale: ἀδελφοί est formellement « frères ». Son emploi peut viser l’ensemble de l’assemblée, ce que la note peut préciser, mais « et sœurs » est une explicitation absente de la formulation source.
  - severity: medium
    issue: Rendu affaibli de λυπῆσθε
    rationale: « Ne soyez pas dans la tristesse » nominalise et affaiblit le verbe grec. « Ne vous attristiez pas » rend plus directement le procès exprimé, sans interdire par lui-même tout deuil.
  - severity: low
    issue: Note b trop restrictive
    rationale: Le grec dit seulement « ceux qui dorment » dans ce verset. La note peut identifier la métaphore comme une désignation de la mort, sans ajouter que ces personnes sont explicitement des croyants.
