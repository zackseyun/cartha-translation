source:
  edition: SBLGNT
  text: Οὐ θέλομεν δὲ ὑμᾶς ἀγνοεῖν, ἀδελφοί, περὶ τῶν ⸀κοιμωμένων, ἵνα μὴ λυπῆσθε καθὼς καὶ οἱ λοιποὶ οἱ μὴ ἔχοντες ἐλπίδα.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/013.yaml
  text: But we do not want you to be uninformed[a], brothers, about those who have fallen asleep, so that you may not grieve as the rest do[b], who have no hope.
translation:
  language: fr
  text: Mais nous ne voulons pas, frères,[a] que vous soyez dans l’ignorance au sujet de ceux qui se sont endormis,[b] afin que vous ne vous attristiez pas comme les autres, qui n’ont pas d’espérance.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « frères » ; dans cette adresse, le terme grec désigne vraisemblablement toute l’assemblée, hommes et femmes.
    reason: cultural_note
  - marker: b
    text: Ici, « s’endormir » est une image employée pour parler de la mort.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐ θέλομεν δὲ
  choice: Mais nous ne voulons pas
  rationale: δέ marque ici une transition légèrement contrastive; « Mais » la rend naturellement sans accentuer excessivement l’opposition.
- source_word: ὑμᾶς ἀγνοεῖν
  choice: que vous soyez dans l’ignorance
  rationale: ἀγνοεῖν signifie ne pas savoir ou manquer d’information. Cette tournure française est claire et idiomatique ici, sans suggérer une insulte.
- source_word: ἀδελφοί
  choice: frères et sœurs
  rationale: Bien que le nom grec soit au masculin pluriel, il sert ici d’adresse à l’ensemble de l’assemblée; le français moderne explicite naturellement cette portée inclusive.
- source_word: περὶ τῶν κοιμωμένων
  choice: au sujet de ceux qui se sont endormis
  rationale: La formulation conserve la métaphore du sommeil employée pour les personnes mortes et rend naturellement le participe grec.
- source_word: ἵνα μὴ λυπῆσθε
  choice: afin que vous ne soyez pas dans la tristesse
  rationale: Cette traduction exprime la visée pastorale sans faire de toute tristesse une faute ni imposer l’idée d’une interdiction absolue de pleurer.
- source_word: καθὼς καὶ οἱ λοιποὶ
  choice: comme les autres
  rationale: οἱ λοιποί désigne ici les autres personnes, par contraste avec la communauté croyante; la formulation française est concise et naturelle.
- source_word: οἱ μὴ ἔχοντες ἐλπίδα
  choice: qui n’ont pas d’espérance
  rationale: Traduction directe de la proposition participiale, qui conserve le contraste eschatologique portant sur l’espérance.
theological_decisions:
- issue: Sens de κοιμωμένων dans le contexte eschatologique
  choice: Conserver la métaphore « ceux qui se sont endormis » et en préciser le référent dans une note.
  alternative: « ceux qui sont morts » ou « ceux qui dorment »
  rationale: La métaphore fait partie de la texture théologique du passage et prépare le thème de la résurrection; la remplacer dans le texte principal réduirait cette dimension.
- issue: Portée de ἀδελφοί
  choice: « frères et sœurs » dans le texte, avec une note sur la forme grecque.
  alternative: « frères »
  rationale: Dans cette adresse paulinienne, le masculin pluriel grec vise vraisemblablement toute l’assemblée. Le français moderne « frères et sœurs » communique cette portée sans laisser croire que seules les personnes de sexe masculin sont interpellées.
- issue: Nature de la tristesse visée
  choice: Formuler « ne soyez pas dans la tristesse comme les autres » sans suggérer l’absence totale de deuil.
  alternative: « ne vous attristiez pas » compris comme une interdiction absolue de toute tristesse
  rationale: La comparaison avec ceux qui n’ont pas d’espérance qualifie la manière de vivre le deuil; elle ne nie pas nécessairement toute douleur chez les croyants.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe reste proche du mouvement grec, tout en explicitant la portée communautaire de l’adresse et en conservant la métaphore du sommeil.
