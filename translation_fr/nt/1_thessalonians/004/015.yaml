reference: 1 Thessalonians 4:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τοῦτο γὰρ ὑμῖν λέγομεν ἐν λόγῳ κυρίου, ὅτι ἡμεῖς οἱ ζῶντες οἱ περιλειπόμενοι εἰς τὴν παρουσίαν τοῦ κυρίου οὐ μὴ φθάσωμεν τοὺς κοιμηθέντας·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/015.yaml
  text: 'For this we say to you by a word from the Lord: that we who are living[a], who remain until the coming of the Lord[c][b], will certainly not precede those who have fallen asleep.'
translation:
  language: fr
  text: 'En effet, voici ce que nous vous disons par une parole du Seigneur[a] : nous, les vivants, qui resterons jusqu’à la venue du Seigneur[b], nous ne devancerons certainement pas ceux qui se sont endormis[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « d’après une parole du Seigneur » ou « par la parole du Seigneur ». Le grec peut désigner soit une parole venant du Seigneur Jésus, soit une révélation donnée avec son autorité.'
    reason: alternative_reading
  - marker: b
    text: Le mot grec παρουσία peut aussi être rendu par « présence » ou « arrivée ». Ici, il désigne la venue future du Seigneur.
    reason: lexical_alternative
  - marker: c
    text: « Ceux qui se sont endormis » est une image désignant ceux qui sont morts.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν λόγῳ κυρίου
  choice: d’après une parole du Seigneur
  rationale: Cette formulation exprime que la déclaration repose sur une parole investie de l’autorité du Seigneur, sans décider s’il s’agit d’une parole de Jésus transmise ou d’une révélation reçue par Paul.
- source_word: παρουσίαν
  choice: venue
  rationale: Dans ce contexte eschatologique, « venue » désigne naturellement l’arrivée future du Seigneur tout en restant proche du sens événementiel du grec.
- source_word: οἱ ζῶντες
  choice: nous, les vivants
  rationale: Cette tournure française naturelle conserve le substantivement du participe grec et l’inclusion de Paul dans le groupe envisagé.
- source_word: οἱ περιλειπόμενοι
  choice: qui resterons
  rationale: « Rester » exprime de façon neutre le fait d’être encore présent jusqu’au moment indiqué, sans ajouter l’idée interprétative de survivre.
- source_word: οὐ μὴ φθάσωμεν
  choice: nous ne devancerons certainement pas
  rationale: La tournure rend à la fois le sens contextuel de φθάνω, « devancer », et la négation grecque fortement emphatique οὐ μή.
- source_word: τοὺς κοιμηθέντας
  choice: ceux qui se sont endormis
  rationale: Le passé composé restitue le participe aoriste et conserve la métaphore du sommeil employée pour ceux qui sont morts.
- source_word: κύριος / κυρίου
  choice: Seigneur
  rationale: « Seigneur » est le titre français usuel et approprié pour κύριος, qui renvoie ici à Jésus.
theological_decisions:
- issue: Nature de l’appel de Paul à une « parole du Seigneur »
  choice: 'Formulation ouverte : « d’après une parole du Seigneur »'
  alternative: « par la parole du Seigneur », qui pourrait davantage suggérer une parole déterminée et connue
  rationale: Le grec affirme l’autorité de la parole sans préciser s’il s’agit d’une parole historique de Jésus ou d’une révélation communiquée à Paul.
- issue: Sens de κοιμηθέντας
  choice: 'Conserver la métaphore : « ceux qui se sont endormis »'
  alternative: 'Expliciter : « ceux qui sont morts »'
  rationale: La métaphore fait partie de la texture théologique du passage et évoque la mort à la lumière de l’espérance de la résurrection; elle ne doit pas être aplatie dans le texte principal.
- issue: Portée de « nous, les vivants »
  choice: Conserver la première personne inclusive sans conclure que Paul affirme avec certitude qu’il vivra jusqu’à la venue
  alternative: 'Reformuler de manière impersonnelle : « ceux qui seront encore en vie »'
  rationale: Le grec emploie explicitement ἡμεῖς. La traduction garde cette forme rhétorique sans trancher la question des attentes chronologiques personnelles de Paul.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe conserve l’insistance de ἡμεῖς au moyen de la reprise « nous, les vivants… nous ». « Voici… ce que » évite un calque lourd de τοῦτο λέγομεν, tandis que « en effet » rend γάρ dans son lien explicatif avec le contexte.
