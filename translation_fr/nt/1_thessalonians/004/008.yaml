id: 1TH.4.8
reference: 1 Thessalonians 4:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τοιγαροῦν ὁ ἀθετῶν οὐκ ἄνθρωπον ἀθετεῖ ἀλλὰ τὸν θεὸν τὸν ⸀καὶ ⸀διδόντα τὸ πνεῦμα αὐτοῦ τὸ ἅγιον εἰς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/008.yaml
  text: Therefore[a], whoever rejects this rejects not man but God[b], who also gives his Holy Spirit to you.
translation:
  language: fr
  text: Ainsi donc, celui qui rejette cela[a] ne rejette pas un être humain, mais Dieu, qui vous donne aussi son Esprit Saint[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « celui qui ne tient pas compte de cela ». Le verbe grec peut signifier « rejeter », « ne pas tenir compte de » ou « écarter ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « qui donne aussi son Esprit Saint en vous ». La préposition grecque signifie souvent « dans » ou « en », mais le français dit naturellement ici « vous donne ».
    reason: lexical_alternative
lexical_decisions:
- source_word: τοιγαροῦν
  choice: Ainsi donc
  rationale: Cette expression introduit la conséquence de l’exhortation précédente. « Ainsi donc » en conserve clairement la force déductive dans un français naturel.
- source_word: ὁ ἀθετῶν / ἀθετεῖ
  choice: celui qui rejette… ne rejette pas
  rationale: Le participe substantivé a une portée générale. Le verbe ἀθετέω peut signifier rejeter, tenir pour nul ou ne pas tenir compte de quelque chose ; « rejeter » convient particulièrement au contraste entre le rejet de l’instruction et celui de Dieu.
- source_word: οὐκ ἄνθρωπον … ἀλλὰ τὸν θεόν
  choice: ne rejette pas un être humain, mais Dieu
  rationale: ἄνθρωπον désigne ici un humain de manière générique. « Un être humain » rend cette portée sans employer un masculin susceptible d’être compris comme limité aux hommes.
- source_word: τὸν καὶ διδόντα
  choice: qui vous donne aussi
  rationale: Le participe présent précise l’identité et l’action de Dieu. Une proposition relative est naturelle en français, et « aussi » rend καί sans exagérer sa valeur.
- source_word: τὸ πνεῦμα αὐτοῦ τὸ ἅγιον
  choice: son Esprit Saint
  rationale: La construction désigne ici l’Esprit saint appartenant à Dieu. La majuscule signale ce référent personnel sans développer davantage la doctrine.
- source_word: εἰς ὑμᾶς
  choice: vous donne
  rationale: Avec le verbe « donner », le pronom indirect « vous » est la formulation française idiomatique. La préposition εἰς peut littéralement évoquer un mouvement « en vous », nuance conservée en note.
theological_decisions:
- issue: Référent de « son Esprit Saint »
  choice: L’expression désigne l’Esprit Saint que Dieu donne aux croyants.
  alternative: Comprendre « esprit saint » comme un don ou une disposition impersonnelle.
  rationale: Dans cette construction et dans le contexte paulinien, τὸ πνεῦμα αὐτοῦ τὸ ἅγιον désigne naturellement l’Esprit de Dieu. La traduction n’ajoute aucune précision doctrinale au-delà de cette identification.
- issue: Portée générique de ὁ ἀθετῶν
  choice: « celui qui rejette » est compris comme désignant toute personne qui agit ainsi.
  alternative: Employer une formulation explicitement masculine telle que « l’homme qui rejette ».
  rationale: Le masculin singulier grec est représentatif et ne limite pas l’énoncé aux personnes de sexe masculin.
- issue: Objet implicite du rejet
  choice: « cela » renvoie à l’enseignement ou à l’exhortation qui précède.
  alternative: Laisser le verbe sans complément explicite, comme le permet plus facilement le grec.
  rationale: Le français demande naturellement un complément dans ce contexte. Le pronom neutre « cela » renvoie au contenu précédent sans le définir plus étroitement.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve l’antithèse concise entre l’être humain et Dieu, tout en rendant explicitement générique le nom ἄνθρωπος. Les deux notes préservent l’étendue sémantique de ἀθετέω et la nuance spatiale possible de εἰς.
