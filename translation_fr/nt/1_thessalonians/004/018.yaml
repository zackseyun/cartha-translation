  text: ὥστε παρακαλεῖτε ἀλλήλους ἐν τοῖς λόγοις τούτοις.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/018.yaml
  text: Therefore encourage one another with these words[a].
translation:
  language: fr
  text: Ainsi donc, encouragez-vous les uns les autres par ces paroles[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « réconfortez-vous les uns les autres par ces paroles ». Le verbe grec peut exprimer l’encouragement, le réconfort ou l’exhortation ; ici, le contexte souligne particulièrement le réconfort pastoral.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: Ainsi donc
  rationale: La conjonction introduit la conséquence pratique de l’enseignement précédent sur la venue du Seigneur et la résurrection. « Ainsi donc » exprime naturellement cette conclusion en français.
- source_word: παρακαλεῖτε
  choice: encouragez-vous
  rationale: Le verbe peut signifier encourager, réconforter ou exhorter. Dans ce contexte de réassurance au sujet des croyants décédés, « encouragez-vous » conserve une portée assez large tout en incluant le réconfort.
- source_word: ἀλλήλους
  choice: les uns les autres
  rationale: Cette tournure française rend clairement la réciprocité du pronom grec.
- source_word: ἐν
  choice: par
  rationale: La préposition indique ici le moyen par lequel les croyants doivent s’encourager. « Par ces paroles » est idiomatique et garde cette valeur instrumentale.
- source_word: τοῖς λόγοις τούτοις
  choice: ces paroles
  rationale: L’expression renvoie aux affirmations précises qui précèdent. « Ces paroles » en donne une traduction directe et transparente.
theological_decisions:
- issue: Portée pastorale de παρακαλεῖτε
  choice: encouragez-vous
  alternative: réconfortez-vous
  rationale: Le contexte met fortement en avant la consolation, mais le verbe grec a une portée plus large. Le texte principal préserve cette amplitude, tandis que la note signale l’autre traduction naturelle.
translation_notes:
  register: Français international moderne, naturel et digne. L’impératif réciproque « encouragez-vous les uns les autres » convient à une exhortation communautaire, et « par ces paroles » exprime clairement le moyen sans lourdeur.
