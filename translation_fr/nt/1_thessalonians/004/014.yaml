  text: εἰ γὰρ πιστεύομεν ὅτι Ἰησοῦς ἀπέθανεν καὶ ἀνέστη, οὕτως καὶ ὁ θεὸς τοὺς κοιμηθέντας διὰ τοῦ Ἰησοῦ ἄξει σὺν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/014.yaml
  text: For if we believe that Jesus died and rose again[b][a], so also God will bring with him those who have fallen asleep through Jesus.
translation:
  language: fr
  text: En effet, si nous croyons que Jésus est mort et qu’il est ressuscité, ainsi aussi Dieu amènera avec Jésus ceux qui se sont endormis par Jésus.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ceux qui sont morts » ; dans ce contexte, Paul emploie le sommeil comme image de la mort des croyants.
    reason: lexical_alternative
  - marker: b
    text: 'La locution grecque traduite par « par Jésus » peut aussi être rattachée à l’action de Dieu : « Dieu, par Jésus, amènera avec lui ceux qui se sont endormis ». Elle est aussi comprise par certains au sens de « ceux qui se sont endormis en Jésus ».'
    reason: alternative_reading
lexical_decisions:
- source_word: εἰ γὰρ
  choice: En effet, si
  rationale: Rend naturellement la valeur explicative ou justificative de γάρ avec la condition introduite par εἰ, en reliant le verset à l’affirmation précédente.
- source_word: πιστεύομεν
  choice: nous croyons
  rationale: Exprime ici la conviction commune et confessée concernant la mort et la résurrection de Jésus.
- source_word: ἀπέθανεν καὶ ἀνέστη
  choice: est mort et qu’il est ressuscité
  rationale: Les passés composés sont naturels en français pour ces événements accomplis. « Il est ressuscité » respecte la forme intransitive de ἀνέστη sans introduire explicitement un agent.
- source_word: οὕτως καὶ
  choice: de même aussi
  rationale: Conserve le lien corrélatif entre la mort et la résurrection de Jésus et l’action future de Dieu, sans préciser davantage la nature exacte de la correspondance.
- source_word: τοὺς κοιμηθέντας
  choice: ceux qui se sont endormis
  rationale: Préserve la métaphore paulinienne du sommeil pour la mort, importante dans ce contexte d’espérance en la résurrection.
- source_word: διὰ τοῦ Ἰησοῦ
  choice: par Jésus
  rationale: διά avec le génitif peut exprimer l’intermédiaire ou l’agent. « Par Jésus » garde cette possibilité tout en laissant en note l’autre rattachement syntaxique courant, « endormis en Jésus ».
- source_word: ἄξει
  choice: ramènera
  rationale: Le futur de ἄγω signifie littéralement « conduira » ou « amènera ». Dans ce contexte, « ramènera » exprime naturellement l’idée que Dieu les fera venir avec Jésus, sans détailler le scénario.
- source_word: σὺν αὐτῷ
  choice: avec lui
  rationale: σύν exprime l’accompagnement; le pronom renvoie le plus naturellement à Jésus.
theological_decisions:
- issue: Métaphore de κοιμηθέντας
  choice: Conserver « ceux qui se sont endormis » dans le texte principal.
  alternative: « ceux qui sont morts »
  rationale: La métaphore ne nie pas la réalité de la mort, mais elle participe à l’espérance de résurrection développée dans le passage; la remplacer dans le texte principal en réduirait la portée.
- issue: Rattachement et sens de διὰ τοῦ Ἰησοῦ
  choice: « par Jésus », rattaché dans le texte français à « se sont endormis » tout en signalant l’ambiguïté.
  alternative: '« ceux qui se sont endormis en Jésus »; ou rattacher « par Jésus » à l’action de Dieu: « Dieu, par Jésus, ramènera… »'
  rationale: La place de la locution grecque permet plusieurs analyses. Le texte principal suit l’ordre grec et la valeur usuelle de διά avec le génitif, tandis que la note préserve les principales lectures sans trancher une question exégétique réelle.
- issue: Sens de ἄξει
  choice: « ramènera »
  alternative: « amènera » ou « conduira »
  rationale: « Ramènera avec lui » est idiomatique dans le contexte du retour de Jésus, mais ne doit pas être compris comme définissant à lui seul le lieu d’origine, la direction ou la chronologie de ce rassemblement.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche du raisonnement grec, avec une ponctuation fluide. Les deux notes conservent la métaphore de la mort et l’ambiguïté syntaxique de διὰ τοῦ Ἰησοῦ.
