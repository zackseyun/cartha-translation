source:
  edition: SBLGNT
  text: Περὶ δὲ τῆς φιλαδελφίας οὐ χρείαν ἔχετε γράφειν ὑμῖν, αὐτοὶ γὰρ ὑμεῖς θεοδίδακτοί ἐστε εἰς τὸ ἀγαπᾶν ἀλλήλους·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/009.yaml
  text: Concerning brotherly love, you have no need for anyone to write to you, for you yourselves are taught by God to love one another.
translation:
  language: fr
  text: Pour ce qui est de l’amour fraternel[a], vous n’avez pas besoin qu’on vous écrive[b], car vous avez vous-mêmes appris de Dieu à vous aimer les uns les autres.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, plus précisément, « de l’amour entre frères et sœurs dans la foi » ; le terme grec évoque les liens familiaux au sein de la communauté chrétienne.
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « vous n’avez pas besoin d’écrire à vous » ; le grec ne précise pas le sujet de « écrire ». Le français emploie ici le sujet indéfini « on ».
    reason: lexical_alternative
lexical_decisions:
- source_word: Περὶ δὲ
  choice: Pour ce qui est de
  rationale: Cette formule française marque naturellement le passage à un nouveau sujet, sans introduire une valeur temporelle absente du grec.
- source_word: τῆς φιλαδελφίας
  choice: de l’amour fraternel
  rationale: « Amour fraternel » conserve l’image familiale et distingue ce nom du verbe plus général ἀγαπᾶν employé ensuite. Dans ce contexte, il désigne l’amour entre croyants, hommes et femmes.
- source_word: οὐ χρείαν ἔχετε γράφειν ὑμῖν
  choice: vous n’avez pas besoin qu’on vous écrive
  rationale: Le sujet de l’infinitif γράφειν n’est pas exprimé. Le pronom indéfini « on » donne une phrase française idiomatique sans préciser indûment « nous » ni « quelqu’un ».
- source_word: αὐτοὶ γὰρ ὑμεῖς
  choice: car vous avez vous-mêmes
  rationale: La position de « vous-mêmes » préserve l’insistance produite par le double pronom grec.
- source_word: θεοδίδακτοί ἐστε
  choice: avez appris de Dieu
  rationale: Cette tournure française naturelle exprime que Dieu est la source de leur enseignement, tout en évitant le calque peu idiomatique « vous êtes enseignés par Dieu ».
- source_word: εἰς τὸ ἀγαπᾶν ἀλλήλους
  choice: à vous aimer les uns les autres
  rationale: La construction rend naturellement l’orientation de l’enseignement reçu et conserve la réciprocité de ἀλλήλους.
theological_decisions:
- issue: Distinction entre φιλαδελφία et ἀγαπᾶν dans le même verset
  choice: Traduire φιλαδελφία par « amour fraternel » et ἀγαπᾶν par le verbe « aimer ».
  alternative: Employer le même mot général « amour » pour les deux expressions.
  rationale: 'La traduction retenue préserve la variation lexicale de Paul : il part de l’affection familiale au sein de la communauté pour parler ensuite de l’acte de s’aimer mutuellement.'
- issue: Sujet implicite de γράφειν
  choice: Employer le sujet indéfini « on » dans « qu’on vous écrive ».
  alternative: Préciser « que nous vous écrivions ».
  rationale: Paul et ses collaborateurs sont vraisemblablement les auteurs implicites, mais le grec ne donne aucun sujet explicite à l’infinitif. La formulation indéfinie respecte cette absence tout en restant naturelle en français.
- issue: Valeur de θεοδίδακτοι
  choice: Dire qu’ils ont « appris de Dieu ».
  alternative: « Vous êtes enseignés par Dieu » ou « Dieu lui-même vous enseigne ».
  rationale: Le choix conserve l’action formatrice de Dieu sans transformer l’adjectif grec en une affirmation plus précise sur le mode ou le moment de cet enseignement.
translation_notes:
  register: Français international moderne, naturel et digne. « Pour ce qui est de » marque clairement le changement de sujet. La formulation évite les calques tout en préservant l’image familiale, l’insistance sur « vous-mêmes » et l’ambiguïté du sujet de γράφειν.
