id: 1TH.4.10
reference: 1 Thessalonians 4:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ γὰρ ποιεῖτε αὐτὸ εἰς πάντας τοὺς ἀδελφοὺς τοὺς ἐν ὅλῃ τῇ Μακεδονίᾳ. παρακαλοῦμεν δὲ ὑμᾶς, ἀδελφοί, περισσεύειν μᾶλλον,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/010.yaml
  text: For indeed you are doing this toward all the brothers throughout all Macedonia. But we urge you[a], brothers, to abound still more,
translation:
  language: fr
  text: En effet, c’est bien ce que vous faites envers tous les frères[a] dans toute la Macédoine. Mais nous vous encourageons, frères, à le faire encore davantage,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ici, le mot « frères » désigne les autres croyants et inclut vraisemblablement aussi bien les femmes que les hommes dans les Églises.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: En effet, c’est bien
  rationale: « En effet » rend la valeur explicative de γάρ, tandis que « c’est bien » restitue l’insistance apportée par καί dans un français naturel.
- source_word: ποιεῖτε αὐτὸ
  choice: c’est bien ce que vous faites
  rationale: La tournure renvoie clairement à l’amour fraternel mentionné juste avant et exprime une pratique déjà réelle et continue.
- source_word: εἰς πάντας τοὺς ἀδελφοὺς
  choice: envers tous les frères
  rationale: « Envers » exprime naturellement l’orientation relationnelle de l’action indiquée par εἰς; « frères » conserve la forme masculine du grec tout en étant expliqué par une note.
- source_word: τοὺς ἐν ὅλῃ τῇ Μακεδονίᾳ
  choice: dans toute la Macédoine
  rationale: Cette formulation française simple conserve l’étendue géographique exprimée par ἐν ὅλῃ.
- source_word: παρακαλοῦμεν δὲ ὑμᾶς
  choice: Mais nous vous encourageons
  rationale: « Encourageons » convient ici à l’exhortation pressante mais fraternelle de παρακαλοῦμεν; « mais » marque la transition de δέ entre l’éloge et l’appel à aller plus loin.
- source_word: περισσεύειν μᾶλλον
  choice: à le faire encore davantage
  rationale: La formulation exprime l’idée d’un progrès au-delà de la pratique actuelle sans employer l’inélégant « abonder davantage »; « le » renvoie à l’amour fraternel, comme αὐτό dans la proposition précédente.
theological_decisions:
- issue: Portée de ἀδελφούς / ἀδελφοί dans une assemblée comprenant vraisemblablement des hommes et des femmes
  choice: frères
  alternative: frères et sœurs; croyants
  rationale: Le texte principal conserve la forme masculine plurielle du grec et la métaphore familiale de Paul. Une note précise que, dans ce contexte communautaire, le terme inclut vraisemblablement les croyantes.
translation_notes:
  register: 'Français international moderne, digne et accessible. La phrase garde le mouvement du grec: constat élogieux, puis exhortation à progresser. La virgule finale est conservée parce que le verset se poursuit syntaxiquement au verset suivant.'
