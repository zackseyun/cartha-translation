id: 1TH.4.17
reference: 1 Thessalonians 4:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἔπειτα ἡμεῖς οἱ ζῶντες οἱ περιλειπόμενοι ἅμα σὺν αὐτοῖς ἁρπαγησόμεθα ἐν νεφέλαις εἰς ἀπάντησιν τοῦ κυρίου εἰς ἀέρα· καὶ οὕτως πάντοτε σὺν κυρίῳ ἐσόμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/017.yaml
  text: Then we who are alive[a], who remain, will be caught up together with them in the clouds to meet the Lord in the air[b]; and so we will always be with the Lord.
translation:
  language: fr
  text: Ensuite, nous, les vivants, qui serons restés, nous serons enlevés[a] en même temps qu’eux dans les nuées, à la rencontre du Seigneur dans les airs[b]. Et ainsi, nous serons toujours avec le Seigneur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « saisis et emportés ». Le verbe grec souligne une action soudaine et énergique.
    reason: lexical_alternative
  - marker: b
    text: Ou « pour une rencontre avec le Seigneur ». L’expression peut désigner le fait d’aller à la rencontre de quelqu’un, mais ce verset ne précise pas la suite des événements au-delà de cette rencontre.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔπειτα
  choice: Ensuite
  rationale: Marque naturellement l’étape qui suit la résurrection des morts mentionnée au verset précédent.
- source_word: οἱ ζῶντες οἱ περιλειπόμενοι
  choice: les vivants qui serons encore là
  rationale: Rend les deux participes en identifiant ceux qui seront toujours en vie à ce moment-là, sans suggérer nécessairement qu’ils auront survécu à un danger particulier.
- source_word: ἅμα σὺν αὐτοῖς
  choice: en même temps qu’eux
  rationale: Exprime à la fois la simultanéité et l’association avec les croyants ressuscités, dans un français naturel.
- source_word: ἁρπαγησόμεθα
  choice: nous serons enlevés
  rationale: Le futur passif exprime une action subie, soudaine et énergique. « Enlevés » reste direct sans intégrer un scénario eschatologique développé.
- source_word: ἐν νεφέλαις
  choice: dans les nuées
  rationale: Conserve l’image concrète des nuées et sa tonalité théophanique dans un registre français digne et largement compréhensible.
- source_word: εἰς ἀπάντησιν τοῦ κυρίου
  choice: à la rencontre du Seigneur
  rationale: Rend le mouvement orienté vers une rencontre sans préciser ce qui suit celle-ci.
- source_word: εἰς ἀέρα
  choice: dans les airs
  rationale: Formulation idiomatique française indiquant le lieu de la rencontre, tout en respectant le sens spatial de l’expression grecque.
- source_word: καὶ οὕτως
  choice: Et ainsi
  rationale: Peut exprimer la manière ou le résultat de la séquence décrite, sans trancher inutilement entre ces nuances.
- source_word: πάντοτε σὺν κυρίῳ ἐσόμεθα
  choice: nous serons toujours avec le Seigneur
  rationale: Préserve l’assurance future et l’accent final sur la communion durable avec le Seigneur.
theological_decisions:
- issue: Sens de ἁρπαγησόμεθα dans un passage associé aux débats sur l’enlèvement
  choice: nous serons enlevés
  alternative: nous serons saisis et emportés
  rationale: La formulation traduit l’action soudaine et subie sans adopter une doctrine particulière concernant le moment ou le déroulement plus large de l’événement.
- issue: Portée de εἰς ἀπάντησιν τοῦ κυρίου
  choice: à la rencontre du Seigneur
  alternative: pour rencontrer le Seigneur
  rationale: Le texte affirme la rencontre, mais ne précise pas à lui seul l’itinéraire ou la séquence ultérieure; la traduction laisse cette question ouverte.
translation_notes:
  register: Français international moderne, clair et digne. « Nuées » conserve l’imagerie biblique sans rendre la phrase archaïque. La reprise « nous… nous » est naturelle en français et maintient l’insistance du grec sur les croyants encore vivants.
