lexical_decisions:
- source_word: μὴ ἐν πάθει ἐπιθυμίας
  choice: sans se laisser dominer par des désirs passionnés
  rationale: Dans la continuité de l’exhortation du verset précédent, cette formulation française exprime naturellement une manière d’agir à éviter. Elle conserve l’idée d’une passion forte et d’un désir sexuel désordonné, sans réduire ἐπιθυμία à tout désir en général.
- source_word: καθάπερ καὶ
  choice: comme
  rationale: Le français « comme » rend clairement la comparaison; traduire καί séparément par « aussi » alourdirait ici la phrase sans ajouter de sens nécessaire.
- source_word: τὰ ἔθνη
  choice: les non-Juifs
  rationale: Dans l’usage paulinien, le terme désigne couramment les peuples autres qu’Israël. « Non-Juifs » est clair en français moderne et évite la connotation parfois péjorative de « païens ».
- source_word: τὰ μὴ εἰδότα τὸν θεόν
  choice: qui ne connaissent pas Dieu
  rationale: Le participe attributif décrit leur état présent; cette traduction directe conserve la portée relationnelle et religieuse de εἰδότα.
theological_decisions:
- issue: Portée de τὰ ἔθνη dans cette exhortation morale
  choice: les non-Juifs
  alternative: les nations ; les païens
  rationale: Le choix préserve la catégorie ethno-religieuse habituelle chez Paul sans faire de l’absence de connaissance de Dieu une définition méprisante de tous les peuples. La proposition relative porte explicitement la caractérisation théologique.
- issue: Force de πάθει ἐπιθυμίας
  choice: se laisser dominer par des désirs passionnés
  alternative: dans une passion de convoitise ; sous l’emprise de désirs déréglés
  rationale: Le contexte sexuel donne à ἐπιθυμία une valeur négative, tandis que πάθος évoque une forte passion. La formulation retenue rend leur combinaison idiomatiquement, sans préciser davantage que le grec la nature exacte ou le mécanisme de cette domination.
translation_notes:
  register: Français international moderne, naturel et digne. Le segment dépend syntaxiquement du verset précédent; la virgule finale signale cette continuité. « Désirs passionnés » reste compréhensible au grand public, tandis que la note conserve la structure et les possibilités lexicales du grec.
