source:
  edition: SBLGNT
  text: καὶ ἀναμένειν τὸν υἱὸν αὐτοῦ ἐκ τῶν οὐρανῶν, ὃν ἤγειρεν ἐκ τῶν νεκρῶν, Ἰησοῦν τὸν ῥυόμενον ἡμᾶς ⸀ἐκ τῆς ὀργῆς τῆς ἐρχομένης.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/010.yaml
  text: and to wait for his Son from heaven[a], whom he raised from the dead—Jesus, who rescues us from the coming wrath.
translation:
  language: fr
  text: 'et attendre que son Fils vienne du ciel, lui qu’il a ressuscité d’entre les morts : Jésus, qui nous délivre de la colère à venir.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναμένειν
  choice: attendre
  rationale: Le verbe exprime une attente confiante et soutenue. « Attendre » est naturel en français moderne et conserve ce sens sans ajouter une nuance étrangère.
- source_word: τὸν υἱὸν αὐτοῦ ἐκ τῶν οὐρανῶν
  choice: attendre que vienne des cieux son Fils
  rationale: Cette formulation française rend clairement l’attente du Fils venant des cieux. Le pluriel « des cieux » respecte la forme grecque tout en restant idiomatique dans ce registre.
- source_word: ὃν ἤγειρεν ἐκ τῶν νεκρῶν
  choice: qu’il a ressuscité d’entre les morts
  rationale: « Ressusciter » est le terme français naturel dans ce contexte, et « d’entre les morts » préserve la valeur de ἐκ τῶν νεκρῶν.
- source_word: Ἰησοῦν
  choice: Jésus
  rationale: Le nom propre est rendu selon sa forme française établie.
- source_word: τὸν ῥυόμενον ἡμᾶς
  choice: qui nous délivre
  rationale: La proposition relative rend naturellement le participe présent et présente Jésus comme celui qui délivre, sans imposer explicitement un temps futur.
- source_word: ἐκ τῆς ὀργῆς τῆς ἐρχομένης
  choice: de la colère qui vient
  rationale: « Colère » conserve le sens précis et théologiquement chargé de ὀργή. « Qui vient » reflète directement le participe présent ἐρχομένης et garde sa portée eschatologique sans la préciser davantage.
theological_decisions:
- issue: Nature de « la colère qui vient »
  choice: Conserver « la colère qui vient » sans en préciser la nature.
  alternative: « le jugement à venir », ou une identification explicite avec la tribulation finale ou la condamnation dernière
  rationale: Le verset ne définit pas plus étroitement cette colère. La traduction préserve donc la formulation et la tension théologique du grec sans lui imposer un cadre eschatologique particulier.
- issue: Valeur temporelle de ῥυόμενον
  choice: « qui nous délivre »
  alternative: « qui nous délivrera » ou « qui est en train de nous délivrer »
  rationale: Le participe présent caractérise Jésus comme le libérateur. Même si la colère est présentée comme venant, le grec n’emploie pas ici un futur explicite ; la traduction évite donc de trancher davantage.
translation_notes:
  register: Français international moderne, clair et digne. La tournure « attendre que vienne des cieux son Fils » conserve l’ordre conceptuel du grec tout en évitant le peu naturel « attendre son Fils des cieux ». Les deux-points identifient nettement le Fils à Jésus sans ajouter d’explication.
