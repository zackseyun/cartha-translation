id: 1TH.1.8
reference: 1 Thessalonians 1:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀφ’ ὑμῶν γὰρ ἐξήχηται ὁ λόγος τοῦ κυρίου οὐ μόνον ἐν τῇ Μακεδονίᾳ ⸀καὶ Ἀχαΐᾳ, ⸀ἀλλ’ ἐν παντὶ τόπῳ ἡ πίστις ὑμῶν ἡ πρὸς τὸν θεὸν ἐξελήλυθεν, ὥστε μὴ χρείαν ⸂ἔχειν ἡμᾶς⸃ λαλεῖν τι·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/008.yaml
  text: For from you the word of the Lord has sounded forth[a], not only in Macedonia and Achaia, but in every place your faith toward God has gone out, so that we have no need to say anything.
translation:
  language: fr
  text: En effet, c’est de chez vous que la parole du Seigneur a retenti, non seulement en Macédoine et en Achaïe, mais partout votre foi en Dieu[a] s’est fait connaître, si bien que nous n’avons pas besoin de dire quoi que ce soit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « votre foi envers Dieu ».'
    reason: La note préserve la valeur directionnelle de πρός, rendue de façon idiomatique par « en Dieu » dans le texte.
lexical_decisions:
- source_word: ἐξήχηται
  choice: a retenti
  rationale: Le parfait grec évoque une parole qui a résonné depuis les Thessaloniciens et dont l’écho demeure; « a retenti » conserve cette image sonore en français naturel.
- source_word: ὁ λόγος τοῦ κυρίου
  choice: la parole du Seigneur
  rationale: Cette formulation consacrée préserve l’expression paulinienne et laisse au génitif sa portée, qu’il désigne la parole venant du Seigneur ou celle qui le concerne.
- source_word: Μακεδονίᾳ καὶ Ἀχαΐᾳ
  choice: Macédoine et Achaïe
  rationale: Formes françaises usuelles de ces noms régionaux.
- source_word: ἀλλ’ ἐν παντὶ τόπῳ
  choice: mais partout
  rationale: « Partout » rend de manière idiomatique la portée distributive de « en tout lieu », sans suggérer que l’affirmation se limite à quelques régions déterminées.
- source_word: ἡ πίστις ὑμῶν ἡ πρὸς τὸν θεόν
  choice: votre foi en Dieu
  rationale: La tournure idiomatique française exprime l’orientation de la foi vers Dieu; une note conserve la formulation plus littérale de πρός, « envers Dieu ».
- source_word: ἐξελήλυθεν
  choice: s’est fait connaître
  rationale: Dans ce contexte, la foi est devenue largement connue. Cette expression française naturelle explicite la portée contextuelle du mouvement exprimé par ἐξέρχομαι sans la confondre avec la proclamation de la parole.
- source_word: ὥστε μὴ χρείαν ἔχειν ἡμᾶς
  choice: si bien que nous n’avons besoin
  rationale: « Si bien que » marque clairement le résultat introduit par ὥστε, et la suite rend naturellement la construction infinitive grecque.
- source_word: λαλεῖν τι
  choice: d’en rien dire
  rationale: Cette tournure concise et idiomatique signifie qu’ils n’ont pas à ajouter quoi que ce soit au sujet de la foi des Thessaloniciens.
theological_decisions:
- issue: Sens de πίστις
  choice: foi
  alternative: fidélité; confiance
  rationale: Le contexte décrit la réponse croyante des Thessaloniciens orientée vers Dieu. « Foi » conserve le terme théologique courant sans réduire le sens à la seule fiabilité ni à un état psychologique.
- issue: Relation exprimée par πρὸς τὸν θεόν
  choice: foi en Dieu
  alternative: foi envers Dieu
  rationale: « En Dieu » est la formulation française naturelle pour l’objet de la foi, tandis que la note signale que le grec exprime littéralement une orientation « envers » Dieu.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve le parallélisme entre la parole qui retentit et la foi qui devient connue, tout en évitant une formulation excessivement littérale ou peu naturelle.
