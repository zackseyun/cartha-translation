id: 1TH.1.5
reference: 1 Thessalonians 1:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὅτι τὸ εὐαγγέλιον ἡμῶν οὐκ ἐγενήθη εἰς ὑμᾶς ἐν λόγῳ μόνον ἀλλὰ καὶ ἐν δυνάμει καὶ ἐν πνεύματι ἁγίῳ ⸀καὶ πληροφορίᾳ πολλῇ, καθὼς οἴδατε οἷοι ἐγενήθημεν ⸀ἐν ὑμῖν δι’ ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/005.yaml
  text: because our gospel did not come to you in word only[a], but also in power and in the Holy Spirit and with great conviction[b], just as you know what kind of men we proved to be among you for your sake.
translation:
  language: fr
  text: car notre Évangile ne vous est pas parvenu seulement en paroles, mais aussi avec puissance, avec l’Esprit Saint et avec une grande assurance[a], comme vous savez quel genre d’hommes nous nous sommes montrés parmi vous, pour votre bien[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avec une profonde conviction » ou « avec une pleine certitude ».
    reason: lexical_alternative
  - marker: b
    text: Ou « quel genre de personnes nous nous sommes montrés parmi vous, à cause de vous ».
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐαγγέλιον
  choice: Évangile
  rationale: « Évangile » est le terme paulinien établi en français et désigne ici précisément le message apostolique, tout en gardant son sens de bonne nouvelle.
- source_word: ἐγενήθη εἰς ὑμᾶς
  choice: ne vous est pas parvenu
  rationale: Cette tournure française naturelle exprime l’arrivée effective de l’Évangile auprès des Thessaloniciens sans reproduire littéralement l’idiome grec.
- source_word: ἐν λόγῳ μόνον
  choice: seulement en paroles
  rationale: Le pluriel idiomatique français exprime une proclamation purement verbale et maintient le contraste avec la puissance et l’Esprit.
- source_word: ἐν δυνάμει
  choice: avec puissance
  rationale: « Avec puissance » est naturel en français et conserve l’idée d’efficacité accompagnant la proclamation.
- source_word: ἐν πνεύματι ἁγίῳ
  choice: avec l’Esprit Saint
  rationale: La formule désigne ici l’Esprit Saint; l’article défini et les majuscules suivent l’usage français courant.
- source_word: πληροφορίᾳ πολλῇ
  choice: avec une grande assurance
  rationale: « Grande assurance » rend la plénitude de certitude ou de conviction sans préciser si elle caractérise les messagers, les auditeurs ou la venue de l’Évangile elle-même.
- source_word: καθὼς οἴδατε
  choice: comme vous savez
  rationale: Cette formulation conserve la valeur confirmative et comparative de καθώς.
- source_word: οἷοι ἐγενήθημεν
  choice: quels hommes nous avons été
  rationale: La formulation garde la référence au caractère manifesté par Paul et ses compagnons, qui étaient des hommes identifiables, sans réduire le sens à leur seul comportement.
- source_word: ἐν ὑμῖν
  choice: parmi vous
  rationale: L’expression situe les missionnaires au milieu de la communauté et correspond naturellement au contexte.
- source_word: δι’ ὑμᾶς
  choice: pour vous
  rationale: Cette traduction concise conserve l’idée que leur manière d’être était orientée vers les Thessaloniciens, sans expliciter excessivement bénéfice ou causalité.
theological_decisions:
- issue: Référence de πνεύματι ἁγίῳ
  choice: l’Esprit Saint
  alternative: un esprit saint ou une puissance spirituelle
  rationale: Dans cet emploi paulinien, l’expression renvoie normalement à l’Esprit Saint et le contraste avec de simples paroles souligne l’action divine.
- issue: Portée de πληροφορίᾳ πολλῇ
  choice: avec une grande assurance
  alternative: avec une profonde conviction; avec une pleine certitude
  rationale: Le grec ne précise pas explicitement qui possède cette assurance. La traduction maintient cette ouverture plutôt que de l’attribuer uniquement aux prédicateurs ou aux auditeurs.
- issue: Référence de οἷοι ἐγενήθημεν
  choice: quels hommes nous avons été
  alternative: quel genre de personnes nous avons été; comment nous nous sommes comportés
  rationale: Le groupe visé est celui de Paul et de ses compagnons masculins; « hommes » est donc référentiellement exact, tandis que la formulation préserve la portée plus large du caractère manifesté.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « avec » restitue le rythme des expressions grecques en ἐν, tandis que « seulement en paroles » évite un calque peu naturel. La phrase reste volontairement proche de la structure argumentative de Paul.
