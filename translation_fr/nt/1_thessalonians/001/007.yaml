  text: ὥστε γενέσθαι ὑμᾶς ⸀τύπον πᾶσιν τοῖς πιστεύουσιν ἐν τῇ Μακεδονίᾳ καὶ ⸀ἐν τῇ Ἀχαΐᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/007.yaml
  text: so that you became an example to all the believers in Macedonia and in Achaia[a].
translation:
  language: fr
  text: si bien que vous êtes devenus un exemple pour tous ceux qui croient en Macédoine et en Achaïe[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un modèle ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: si bien que
  rationale: Introduit le résultat de l’accueil de la Parole et de l’imitation évoqués au verset précédent; « si bien que » exprime naturellement cette valeur consécutive.
- source_word: γενέσθαι
  choice: vous êtes devenus
  rationale: L’infinitif aoriste après ὥστε exprime ici le résultat; une forme verbale personnelle est idiomatique en français.
- source_word: ὑμᾶς
  choice: vous
  rationale: Désigne les Thessaloniciens comme sujet logique de l’infinitif dans la construction grecque.
- source_word: τύπον
  choice: un exemple
  rationale: Désigne ici une réalité exemplaire à imiter. « Exemple » est clair et naturel; « modèle » et « type » restent possibles.
- source_word: πᾶσιν τοῖς πιστεύουσιν
  choice: pour tous ceux qui croient
  rationale: Le participe substantivé désigne l’ensemble des personnes qui croient; cette formulation conserve l’aspect verbal sans imposer un nom de groupe.
- source_word: ἐν τῇ Μακεδονίᾳ
  choice: en Macédoine
  rationale: Rend directement l’expression locative désignant la région romaine.
- source_word: καὶ ἐν τῇ Ἀχαΐᾳ
  choice: et en Achaïe
  rationale: Préserve la coordination et la répétition de la préposition présentes dans le grec.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La tournure « si bien que » maintient le lien de résultat avec le contexte précédent. « Tous ceux qui croient » évite un substantif confessionnel tout en reproduisant la valeur du participe grec.
