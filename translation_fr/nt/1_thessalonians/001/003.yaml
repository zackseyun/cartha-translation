id: 1TH.1.3
reference: 1 Thessalonians 1:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: μνημονεύοντες ὑμῶν τοῦ ἔργου τῆς πίστεως καὶ τοῦ κόπου τῆς ἀγάπης καὶ τῆς ὑπομονῆς τῆς ἐλπίδος τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ ἔμπροσθεν τοῦ θεοῦ καὶ πατρὸς ἡμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/003.yaml
  text: remembering your work of faith and labor of love and steadfastness of hope in our Lord Jesus the Messiah before our God and Father[b][a],
translation:
  language: fr
  text: nous souvenant de l’œuvre de votre foi[a], du labeur de votre amour et de la persévérance de votre espérance en notre Seigneur Jésus le Messie[b], devant notre Dieu et Père,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « fidélité » ou « confiance ».
    reason: lexical_alternative
  - marker: b
    text: 'Grec : « Christ »; le terme signifie « Messie » et fonctionne ici comme un titre.'
    reason: alternative_reading
lexical_decisions:
- source_word: μνημονεύοντες
  choice: nous souvenant
  rationale: Le participe présent prolonge la construction du verset précédent et exprime une action continue sans ajouter d’élément absent du grec.
- source_word: ἔργου
  choice: œuvre
  rationale: « Œuvre » conserve le premier terme de la triade rhétorique et peut désigner l’activité concrète issue de la foi.
- source_word: πίστεως
  choice: foi
  rationale: « Foi » est le sens le plus probable ici; le génitif peut désigner la source ou la caractéristique de l’œuvre sans qu’il soit nécessaire d’expliciter ce rapport dans le texte.
- source_word: κόπου
  choice: labeur
  rationale: « Labeur » rend l’idée d’un effort pénible et soutenu et le distingue nettement de l’« œuvre ».
- source_word: ἀγάπης
  choice: amour
  rationale: Équivalent français direct et usuel de ἀγάπη dans ce contexte.
- source_word: ὑπομονῆς
  choice: persévérance
  rationale: Le mot exprime la capacité de tenir fermement sous l’épreuve; « persévérance » est naturel en français et préserve cette force.
- source_word: ἐλπίδος
  choice: espérance
  rationale: « Espérance » convient au registre paulinien et désigne une attente confiante plutôt qu’un simple souhait.
- source_word: τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: en notre Seigneur Jésus le Messie
  rationale: Le génitif se rattache naturellement à l’espérance comme son objet ou sa sphère. Χριστός est rendu comme le titre « le Messie », tandis que « Christ » est signalé en note.
- source_word: ἔμπροσθεν
  choice: devant
  rationale: « Devant » restitue de façon concise l’idée de présence et laisse ouverte la portée exacte du complément dans la phrase.
- source_word: τοῦ θεοῦ καὶ πατρὸς ἡμῶν
  choice: notre Dieu et Père
  rationale: Cette formulation suit étroitement la coordination grecque et présente les deux désignations comme se rapportant à la même personne.
theological_decisions:
- issue: Sens de πίστις dans τῆς πίστεως
  choice: foi
  alternative: fidélité ou confiance
  rationale: Dans ce contexte, « foi » est le sens le plus probable, mais πίστις peut aussi comporter les nuances de confiance ou de fidélité; la note préserve cette latitude.
- issue: Traduction de Χριστοῦ
  choice: Messie
  alternative: Christ
  rationale: Χριστός garde ici sa valeur de titre. « Messie » en communique le sens, tandis que la forme traditionnelle « Christ » demeure possible et est indiquée en note.
- issue: Rapport des génitifs dans la triade
  choice: de votre foi… de votre amour… de votre espérance
  alternative: produite par votre foi… inspiré par votre amour… issu de votre espérance
  rationale: La formulation nominale conserve la concision et l’ambiguïté du grec, qui peut exprimer la source, la qualité ou la caractérisation sans imposer une seule analyse.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La triade « œuvre… labeur… persévérance » et les génitifs répétés sont conservés afin de respecter la structure rhétorique et l’ambiguïté du grec. La virgule finale signale que ce fragment syntaxique se poursuit dans son contexte.
