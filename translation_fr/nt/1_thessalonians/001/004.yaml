  text: Car nous savons, frères et sœurs aimés de Dieu, que Dieu vous a choisis[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « votre élection ». Ou : « le fait que Dieu vous a choisis ». Le texte affirme ce choix divin sans en préciser ici davantage la portée théologique.'
