  verdict: revise
  source_fidelity: 'Le sens global est bien rendu : Paul affirme connaître le choix divin concernant les destinataires. Toutefois, le grec emploie le nom ἐκλογή (« élection », « choix » au sens de sélection), et non directement la proposition « qu’il vous a choisis ». Cette dernière est une reformulation recevable en français, mais elle rend moins précisément la forme nominale et l’annotation actuelle introduit « votre choix », qui peut suggérer à tort un choix effectué par les Thessaloniciens.'
  naturalness: « Car nous savons, frères et sœurs aimés de Dieu, que Dieu vous a choisis » est naturel, clair et d’un registre moderne et digne. L’explicitation de Dieu évite que le pronom « il » ait un antécédent seulement implicite.
  terminology: « Frères et sœurs » communique naturellement en français actuel l’adresse communautaire de ἀδελφοί. « Aimés de Dieu » rend bien le participe parfait passif. Pour ἐκλογή, la note doit employer « élection » ou expliquer « le fait que Dieu vous a choisis », sans présenter « votre choix » comme équivalent non qualifié.
  issues:
