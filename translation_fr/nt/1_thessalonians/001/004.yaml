    issue: La note donne « votre choix » comme rendu littéral de τὴν ἐκλογὴν ὑμῶν.
    rationale: En français, « votre choix » se comprend normalement comme le choix que les destinataires font. Ici, ἐκλογή désigne leur élection, c’est-à-dire le fait qu’ils sont choisis; cette formulation risque donc d’inverser ou de brouiller la relation sémantique.
  - severity: low
    issue: Le pronom « il » dans le texte courant n’a pas d’antécédent nominal explicite dans la proposition.
    rationale: Le référent est naturellement Dieu, mais le nommer rend la traduction autonome et immédiatement transparente sans ajouter de contenu théologique.
  revised_text: Car nous savons, frères et sœurs aimés de Dieu, que Dieu vous a choisis[a].
