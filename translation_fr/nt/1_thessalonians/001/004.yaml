lexical_decisions:
- source_word: εἰδότες
  choice: car nous savons
  rationale: Le participe, rattaché à la phrase précédente, introduit ici le fondement de l’action de grâce de Paul. Une proposition française avec un verbe conjugué restitue naturellement ce lien explicatif.
- source_word: ἀδελφοὶ
  choice: frères et sœurs
  rationale: Dans cette adresse paulinienne au pluriel, le masculin grec désigne les membres de toute l’assemblée. « Frères et sœurs » en communique clairement la portée dans le français actuel.
- source_word: ἠγαπημένοι ὑπὸ θεοῦ
  choice: aimés de Dieu
  rationale: Cette formulation concise préserve le passif et l’état durable exprimé par le participe parfait, sans archaïsme.
- source_word: τὴν ἐκλογὴν ὑμῶν
  choice: qu’il vous a choisis
  rationale: La tournure verbale est plus naturelle en français courant que « votre élection » et exprime l’acte divin de choisir sans préciser davantage son cadre doctrinal.
theological_decisions:
- issue: Rendu de ἐκλογή dans un contexte doctrinalement débattu
  choice: qu’il vous a choisis
  alternative: votre élection
  rationale: Le texte affirme que les Thessaloniciens ont été choisis, sans exposer ici les modalités ou la portée systématique de ce choix. Le rendu conserve cette affirmation tout en évitant d’imposer un système théologique particulier.
- issue: Portée de ἀδελφοί
  choice: frères et sœurs
  alternative: frères
  rationale: Dans l’usage épistolaire de Paul, cette adresse vise vraisemblablement l’ensemble de la communauté croyante. Le français explicite cette portée collective sans changer les personnes visées.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation reste liée à la phrase précédente et évite aussi bien le jargon doctrinal que l’aplanissement de l’affirmation théologique.
