id: 1TH.1.1
reference: 1 Thessalonians 1:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Παῦλος καὶ Σιλουανὸς καὶ Τιμόθεος τῇ ἐκκλησίᾳ Θεσσαλονικέων ἐν θεῷ πατρὶ καὶ κυρίῳ Ἰησοῦ Χριστῷ· χάρις ὑμῖν καὶ ⸀εἰρήνη.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/001.yaml
  text: 'Paul and Silvanus and Timothy[b][a], to the church of the Thessalonians in God the Father and the Lord Jesus the Messiah: grace to you and peace.'
translation:
  language: fr
  text: 'Paul, Silvain et Timothée, à l’Église des Thessaloniciens[a], en Dieu le Père et dans le Seigneur Jésus le Messie[b] : grâce à vous et paix.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à l’assemblée des Thessaloniciens ». Le grec ἐκκλησία désigne la communauté rassemblée.
    reason: lexical_alternative
  - marker: b
    text: Ou « Jésus Christ ». Le titre grec Χριστός est rendu ici par « Messie » afin d’en exprimer le sens; « Christ » en est la forme traditionnelle issue du grec.
    reason: alternative_reading
lexical_decisions:
- source_word: Παῦλος
  choice: Paul
  rationale: Forme française traditionnelle et courante du nom grec Παῦλος.
- source_word: Σιλουανὸς
  choice: Silvain
  rationale: Forme française traditionnelle correspondant directement à Σιλουανός; « Silas » reflète une autre forme grecque du nom.
- source_word: Τιμόθεος
  choice: Timothée
  rationale: Forme française traditionnelle et courante du nom grec Τιμόθεος.
- source_word: ἐκκλησίᾳ
  choice: Église
  rationale: Dans cette adresse épistolaire, « Église » désigne naturellement la communauté rassemblée; « assemblée » reste une possibilité lexicale.
- source_word: Θεσσαλονικέων
  choice: des Thessaloniciens
  rationale: Le génitif pluriel désigne les habitants de Thessalonique et se rend avec concision par « des Thessaloniciens ».
- source_word: ἐν
  choice: en … et dans
  rationale: « En » conserve la relation exprimée par ἐν. La reprise par « dans » devant le second terme rend la coordination intelligible en français sans transformer cette relation en appartenance.
- source_word: θεῷ πατρὶ
  choice: Dieu le Père
  rationale: Le grec ne porte aucun possessif; cette formulation évite donc d’ajouter « notre ».
- source_word: κυρίῳ
  choice: Seigneur
  rationale: Équivalent français établi de κύριος dans cet emploi néotestamentaire.
- source_word: Ἰησοῦ Χριστῷ
  choice: Jésus le Messie
  rationale: « Messie » traduit le sens du titre Χριστός au lieu de simplement le translittérer; l’article français est requis pour une expression titulaire idiomatique.
- source_word: χάρις
  choice: grâce
  rationale: Rendu établi qui conserve la portée du terme dans la salutation paulinienne.
- source_word: εἰρήνη
  choice: paix
  rationale: Rendu direct qui préserve les résonances grecques et juives de la salutation.
- source_word: χάρις ὑμῖν καὶ εἰρήνη
  choice: grâce à vous et paix
  rationale: Cette formulation conserve l’ordre grec, où « à vous » suit immédiatement « grâce », tout en restant compréhensible et digne en français.
theological_decisions:
- issue: Traduction de Χριστός dans la salutation
  choice: Messie
  alternative: Christ
  rationale: Ici, le sens titulaire demeure perceptible. « Messie » en exprime le contenu, tandis que « Christ » est la forme française traditionnelle issue de la translittération grecque.
- issue: Relation exprimée par ἐν θεῷ πατρὶ καὶ κυρίῳ Ἰησοῦ Χριστῷ
  choice: L’Église est décrite comme étant « en Dieu le Père et dans le Seigneur Jésus le Messie »
  alternative: L’Église appartient à Dieu le Père et au Seigneur Jésus le Messie
  rationale: Le maintien de ἐν sous la forme « en/dans » préserve l’ambiguïté relationnelle et la tension théologique du texte, sans la réduire à une simple appartenance.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation garde la structure solennelle d’une adresse épistolaire. La légère asymétrie « en Dieu … et dans le Seigneur » évite le peu naturel « en Dieu … et le Seigneur » tout en conservant une même relation prépositionnelle pour les deux termes.
