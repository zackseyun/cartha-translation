  text: Εὐχαριστοῦμεν τῷ θεῷ πάντοτε περὶ πάντων ὑμῶν ⸀μνείαν ποιούμενοι ἐπὶ τῶν προσευχῶν ἡμῶν, ἀδιαλείπτως
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/002.yaml
  text: We always give thanks to God for all of you[a], making mention of you in our prayers unceasingly,
translation:
  language: fr
  text: Nous rendons toujours grâce à Dieu pour vous tous, faisant mention de vous dans nos prières, sans relâche[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « continuellement ». L’expression « sans relâche » peut se rapporter spécialement au fait de faire mention des Thessaloniciens dans les prières, ou plus largement à l’ensemble de l’action de grâce.'
    reason: Ambiguïté syntaxique et variante lexicale de ἀδιαλείπτως.
lexical_decisions:
- source_word: Εὐχαριστοῦμεν
  choice: Nous rendons grâce
  rationale: Le présent de l’indicatif, à la première personne du pluriel, ouvre une formule paulinienne d’action de grâce. « Rendre grâce » est idiomatique, digne et conserve explicitement l’orientation de la reconnaissance vers Dieu.
- source_word: τῷ θεῷ
  choice: à Dieu
  rationale: Le datif désigne ici celui à qui l’action de grâce est adressée.
- source_word: πάντοτε
  choice: toujours
  rationale: Ce terme rend directement et naturellement la valeur temporelle de πάντοτε.
- source_word: περὶ πάντων ὑμῶν
  choice: pour vous tous
  rationale: La préposition περί avec le génitif exprime ici la référence ou l’intérêt. « Pour vous tous » convient au contexte de prière et maintient la portée inclusive de πάντων.
- source_word: μνείαν ποιούμενοι
  choice: faisant mention de vous
  rationale: Cette tournure participiale signifie littéralement « faisant mention ». L’ajout de « vous », fourni par le contexte, explicite naturellement en français les personnes mentionnées.
- source_word: ἐπὶ τῶν προσευχῶν ἡμῶν
  choice: dans nos prières
  rationale: Dans cette expression, ἐπί avec le génitif indique le cadre ou le moment de la prière. « Dans nos prières » est la formulation française la plus naturelle.
- source_word: ἀδιαλείπτως
  choice: sans relâche
  rationale: L’expression traduit la persistance régulière soulignée par l’adverbe, sans suggérer nécessairement une activité littéralement ininterrompue. Sa position finale respecte l’ordre grec et laisse subsister l’ambiguïté de son rattachement.
theological_decisions:
- issue: Rattachement syntaxique de ἀδιαλείπτως
  choice: Maintenir l’adverbe en position finale, où il peut se rapporter à la mention faite dans les prières ou, plus largement, à l’action de grâce.
  alternative: Le rattacher explicitement soit à « faisant mention », soit à « rendons grâce ».
  rationale: Le texte grec permet les deux lectures. La traduction évite de trancher une ambiguïté réelle qui touche à la portée de l’affirmation, sans imposer une interprétation théologique particulière.
translation_notes:
  register: Français international moderne, clair et soutenu. La virgule finale signale que la phrase se poursuit au verset suivant. Le participe « faisant mention » conserve la structure de la phrase grecque tout en restant intelligible.
