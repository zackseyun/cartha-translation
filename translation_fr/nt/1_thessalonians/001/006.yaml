    issue: Elliptique « ceux du Seigneur »
    rationale: 'Le grec sous-entend μιμηταί après καί : les destinataires sont imitateurs des missionnaires et du Seigneur. En français, « ceux du Seigneur » est ambigu et ne signifie pas naturellement « imitateurs du Seigneur ».'
  - severity: low
    issue: Participe transformé en proposition principale
    rationale: « Vous avez accueilli » avec deux-points est intelligible, mais « ayant accueilli » conserve plus exactement la relation participiale de δεξάμενοι.
  - severity: low
    issue: Note trop assertive sur le génitif
    rationale: Le génitif πνεύματος ἁγίου admet une lecture de source vraisemblable, mais « c’est-à-dire » impose cette analyse au lieu de préserver l’ambiguïté signalée.
  revised_text: Et vous, vous êtes devenus nos imitateurs et imitateurs du Seigneur, ayant accueilli la parole dans une grande détresse, avec la joie qui vient de l’Esprit Saint.[a]
