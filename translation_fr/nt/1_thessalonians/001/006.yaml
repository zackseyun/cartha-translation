id: 1TH.1.6
reference: 1 Thessalonians 1:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ὑμεῖς μιμηταὶ ἡμῶν ἐγενήθητε καὶ τοῦ κυρίου, δεξάμενοι τὸν λόγον ἐν θλίψει πολλῇ μετὰ χαρᾶς πνεύματος ἁγίου,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/006.yaml
  text: And you became imitators of us and of the Lord[a], having received the word in much affliction with joy of the Holy Spirit,
translation:
  language: fr
  text: Et vous, vous êtes devenus nos imitateurs et imitateurs du Seigneur, ayant accueilli la parole dans une grande détresse, avec la joie qui vient de l’Esprit Saint.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « avec la joie de l’Esprit Saint ». Le génitif grec peut indiquer que cette joie vient de l’Esprit Saint.'
    reason: La relation exprimée par le génitif grec peut être conservée littéralement ou comprise comme indiquant la source de la joie.
lexical_decisions:
- source_word: μιμηταὶ
  choice: imitateurs
  rationale: Le terme désigne ceux qui prennent quelqu’un pour modèle. « Imitateurs » conserve le langage explicite de l’imitation employé par Paul, contrairement à « disciples » ou « ceux qui nous ont suivis ».
- source_word: ἐγενήθητε
  choice: vous êtes devenus
  rationale: 'Le verbe exprime ici un changement d’état : les Thessaloniciens sont devenus des imitateurs.'
- source_word: τοῦ κυρίου
  choice: ceux du Seigneur
  rationale: Cette formulation complète naturellement « nos imitateurs » et conserve « Seigneur » comme titre de Jésus.
- source_word: δεξάμενοι
  choice: vous avez accueilli
  rationale: Le participe précise la manière ou la circonstance dans laquelle ils sont devenus imitateurs. « Accueilli » rend l’idée d’une réception favorable de la proclamation, tout en restant naturel en français.
- source_word: τὸν λόγον
  choice: la parole
  rationale: « La parole » conserve le vocabulaire paulinien et désigne ici le message proclamé, sans réduire explicitement le terme à une paraphrase.
- source_word: ἐν θλίψει πολλῇ
  choice: au milieu de grandes détresses
  rationale: θλῖψις évoque pression, oppression et souffrance. Le pluriel français est idiomatique et évite les connotations eschatologiques possibles de « tribulation ».
- source_word: μετὰ χαρᾶς πνεύματος ἁγίου
  choice: avec la joie qui vient de l’Esprit Saint
  rationale: Cette formulation naturelle comprend le génitif comme indiquant vraisemblablement la source de la joie, tout en signalant en note la formulation plus littérale.
theological_decisions:
- issue: Relation du génitif dans χαρᾶς πνεύματος ἁγίου
  choice: la joie qui vient de l’Esprit Saint
  alternative: la joie de l’Esprit Saint
  rationale: Dans le contexte des détresses, le génitif indique probablement que l’Esprit Saint est la source de cette joie. La note préserve toutefois la forme plus proche du grec et son ambiguïté relative.
- issue: Imitation des apôtres et du Seigneur
  choice: nos imitateurs et ceux du Seigneur
  alternative: vous nous avez imités, nous et le Seigneur
  rationale: Le substantif « imitateurs » est conservé afin de ne pas affaiblir le motif théologique paulinien de l’imitation. La coordination place les apôtres et le Seigneur comme modèles sans les identifier ni les mettre sur un même plan absolu.
translation_notes:
  register: Français international moderne, digne et accessible. La reprise « Et vous, vous » marque naturellement le contraste emphatique de καὶ ὑμεῖς. Les deux-points remplacent un participe lourd en français et rendent clairement son rapport explicatif avec la proposition principale.
