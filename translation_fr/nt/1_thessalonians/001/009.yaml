id: 1TH.1.9
reference: 1 Thessalonians 1:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: αὐτοὶ γὰρ περὶ ἡμῶν ἀπαγγέλλουσιν ὁποίαν εἴσοδον ἔσχομεν πρὸς ὑμᾶς, καὶ πῶς ἐπεστρέψατε πρὸς τὸν θεὸν ἀπὸ τῶν εἰδώλων δουλεύειν θεῷ ζῶντι καὶ ἀληθινῷ,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/009.yaml
  text: For they themselves report about us what kind of reception we had among you[a], and how you turned to God from idols to serve the living and true God[c][b],
translation:
  language: fr
  text: En effet, ils racontent eux-mêmes à notre sujet quel accueil nous avons reçu chez vous[a], et comment vous vous êtes tournés vers Dieu en abandonnant les idoles[b], afin de servir le Dieu vivant et vrai[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « quelle sorte d’entrée nous avons faite auprès de vous »; l’expression grecque évoque le caractère et l’effet de l’arrivée de Paul et de ses compagnons.
    reason: lexical_alternative
  - marker: b
    text: Ou « comment vous avez été convertis à Dieu en abandonnant les idoles ».
    reason: alternative_reading
  - marker: c
    text: L’expression « le Dieu vivant et vrai » oppose Dieu aux idoles sans vie; comparer Jérémie 10.10.
    reason: cross_reference
lexical_decisions:
- source_word: αὐτοὶ
  choice: ils racontent eux-mêmes
  rationale: Le pronom intensif souligne que ces personnes rapportent spontanément les faits; « eux-mêmes » conserve cette insistance en français naturel.
- source_word: ἀπαγγέλλουσιν
  choice: racontent
  rationale: Le présent décrit ce que ces personnes rapportent. « Racontent » convient à la transmission d'un récit et reste accessible; « rapportent » serait également possible, mais plus formel.
- source_word: ὁποίαν εἴσοδον ἔσχομεν πρὸς ὑμᾶς
  choice: quel accueil nous avons reçu chez vous
  rationale: Littéralement, l'expression évoque le genre d'« entrée » ou d'arrivée que les missionnaires ont eue auprès des Thessaloniciens. Dans ce contexte, « accueil » restitue naturellement en français le caractère et l'effet de cette arrivée, tandis que la note conserve l'image littérale.
- source_word: πῶς ἐπεστρέψατε
  choice: comment vous vous êtes tournés
  rationale: Le verbe exprime un changement d'orientation. Cette formulation préserve la métaphore du mouvement sans imposer dans le texte principal le terme doctrinal plus technique « convertis ».
- source_word: πρὸς τὸν θεὸν ἀπὸ τῶν εἰδώλων
  choice: vers Dieu en abandonnant les idoles
  rationale: 'La formulation française rend les deux directions du changement: l''orientation vers Dieu et l''éloignement des idoles. « En abandonnant » explicite naturellement la valeur de ἀπό sans réduire les idoles à de simples objets matériels.'
- source_word: δουλεύειν
  choice: servir
  rationale: Dans ce contexte d'allégeance religieuse, le verbe désigne un service entier et dévoué. « Servir » en rend le sens sans durcir inutilement la métaphore en « être esclave de » ni la réduire au seul acte cultuel de l'adoration.
- source_word: θεῷ ζῶντι καὶ ἀληθινῷ
  choice: le Dieu vivant et vrai
  rationale: Cette expression distingue Dieu des idoles inertes et mensongères. L'article défini est requis par l'usage français et exprime naturellement l'identité du Dieu que les Thessaloniciens servent.
theological_decisions:
- issue: Nature du changement exprimé par ἐπεστρέψατε
  choice: « vous vous êtes tournés vers Dieu »
  alternative: « vous avez été convertis à Dieu »
  rationale: La forme grecque présente les Thessaloniciens comme accomplissant ce changement d'orientation, sans nier l'action divine exposée ailleurs. La traduction conserve cette formulation et évite de trancher ici la relation théologique entre initiative divine et réponse humaine.
- issue: Portée de δουλεύειν dans le rapport à Dieu
  choice: « servir »
  alternative: « être esclaves de Dieu » ou « rendre un culte à Dieu »
  rationale: Le mot appartient au domaine du service et de l'esclavage, mais il désigne ici une allégeance religieuse vécue. « Servir » conserve une portée assez large pour inclure le culte et l'obéissance sans imposer une nuance plus étroite ou plus dure.
- issue: Contraste entre Dieu et les idoles
  choice: « le Dieu vivant et vrai »
  alternative: « un dieu vivant et vrai »
  rationale: Le contexte oppose le Dieu vers lequel les Thessaloniciens se sont tournés aux idoles qu'ils ont abandonnées. Le français idiomatique appelle ici le défini, sans transformer les adjectifs en une affirmation philosophique plus développée que le texte.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase conserve le lien explicatif de γάρ par « En effet », l'insistance de αὐτοί par « eux-mêmes » et la métaphore de la conversion comme changement d'orientation. Les notes signalent les traductions plus littérales ou théologiquement possibles sans surcharger le texte principal.
