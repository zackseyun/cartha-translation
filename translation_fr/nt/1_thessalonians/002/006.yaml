  text: οὔτε ζητοῦντες ἐξ ἀνθρώπων δόξαν, οὔτε ἀφ’ ὑμῶν οὔτε ἀπ’ ἄλλων,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/006.yaml
  text: nor seeking glory from people[a], neither from you nor from others,
translation:
  language: fr
  text: ni en recherchant la gloire[a] qui vient des êtres humains, ni de vous ni des autres,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’honneur » ou « les éloges » au lieu de « la gloire ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ζητοῦντες
  choice: rechercher
  rationale: Le participe présent se rattache au sujet implicite de la phrase environnante. « Rechercher » exprime une démarche suivie sans préciser davantage les motivations.
- source_word: ἐξ ἀνθρώπων
  choice: qui vient des êtres humains
  rationale: ἄνθρωποι désigne ici les humains en général, et non les hommes de sexe masculin. La tournure explicite naturellement la provenance indiquée par ἐξ.
- source_word: δόξαν
  choice: la gloire
  rationale: Dans ce contexte, δόξα désigne la considération ou l'approbation humaines. « Gloire » conserve néanmoins le lien lexical avec l'emploi courant du terme dans le Nouveau Testament.
- source_word: οὔτε ... οὔτε ... οὔτε
  choice: sans non plus ... ni ... ni
  rationale: La première négation relie ce membre à la phrase précédente, tandis que les deux suivantes coordonnent les sources humaines précisées.
- source_word: ἀφ’ ὑμῶν
  choice: de vous
  rationale: Rend directement la référence aux croyants de Thessalonique.
- source_word: ἀπ’ ἄλλων
  choice: des autres
  rationale: Désigne avec concision les autres personnes, par opposition aux destinataires.
theological_decisions:
- issue: Nature de la δόξα recherchée
  choice: la gloire provenant des êtres humains
  alternative: l’honneur ou les éloges provenant des êtres humains
  rationale: ἐξ ἀνθρώπων indique clairement que la source envisagée est humaine. La traduction ne suggère donc pas qu’il serait question de rechercher la gloire de Dieu.
translation_notes:
  register: Français international moderne, digne et accessible. Le début « sans non plus » marque que ce fragment dépend syntaxiquement du contexte précédent; la virgule finale préserve cette continuité.
