id: 1TH.2.10
reference: 1 Thessalonians 2:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὑμεῖς μάρτυρες καὶ ὁ θεός, ὡς ὁσίως καὶ δικαίως καὶ ἀμέμπτως ὑμῖν τοῖς πιστεύουσιν ἐγενήθημεν,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/010.yaml
  text: You are witnesses[a], and God also, how devoutly and righteously and blamelessly we behaved toward you who believe[b],
translation:
  language: fr
  text: Vous êtes témoins, et Dieu l’est aussi, de la conduite sainte, juste et irréprochable que nous avons eue envers vous qui croyez[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « parmi vous qui croyez ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς μάρτυρες καὶ ὁ θεός
  choice: Vous êtes témoins, et Dieu l’est aussi
  rationale: Cette formulation restitue l’appel solennel aux Thessaloniciens puis à Dieu, tout en suppléant naturellement le verbe sous-entendu en français.
- source_word: ὡς
  choice: de la conduite… que
  rationale: Dans cette construction, ὡς introduit la manière dont les missionnaires se sont comportés. La tournure nominale est plus naturelle en français que « comment saintement… nous avons été ».
- source_word: ὁσίως
  choice: sainte
  rationale: Le terme décrit une conduite conforme à la piété et orientée vers Dieu. « Sainte » conserve cette dimension religieuse sans recourir à l’adverbe peu naturel « saintement ».
- source_word: δικαίως
  choice: juste
  rationale: Le mot désigne ici une conduite moralement droite. « Juste » est courant, digne et suffisamment large en français.
- source_word: ἀμέμπτως
  choice: irréprochable
  rationale: Le terme indique une conduite qui ne donne prise à aucun reproche légitime, sans affirmer pour autant une perfection absolue.
- source_word: ὑμῖν
  choice: envers vous
  rationale: Le datif exprime vraisemblablement les personnes à l’égard desquelles cette conduite s’est manifestée. « Parmi vous » demeure possible et est signalé en note.
- source_word: τοῖς πιστεύουσιν
  choice: vous qui croyez
  rationale: Le participe présent substantivé qualifie directement les destinataires et garde la force verbale de « croire ».
- source_word: ἐγενήθημεν
  choice: la conduite… que nous avons eue
  rationale: Avec les trois adverbes de manière, ἐγενήθημεν décrit ici la manière d’être et d’agir des missionnaires. Cette tournure française en exprime naturellement le sens contextuel.
theological_decisions:
- issue: Portée des trois qualificatifs éthiques appliqués à la conduite apostolique
  choice: Ils témoignent de la conduite effectivement sainte, juste et irréprochable des missionnaires devant Dieu et les croyants.
  alternative: Y voir soit une simple formule rhétorique de défense, soit l’affirmation d’une perfection morale absolue.
  rationale: Le texte invoque solennellement des témoins humains et divin au sujet d’une conduite réelle. « Irréprochable » conserve la force de l’affirmation sans lui faire dire explicitement que les missionnaires étaient absolument sans péché.
translation_notes:
  register: Français international moderne, naturel et digne. La série grecque de trois adverbes est rendue par trois adjectifs coordonnés qualifiant « conduite », ce qui évite des adverbes français lourds ou peu idiomatiques tout en préservant leur parallélisme.
