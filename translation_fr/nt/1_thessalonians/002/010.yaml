  terminology: « Sainte » conserve la dimension de piété envers Dieu de ὁσίως; « juste » rend correctement δικαίως dans son sens éthique; « irréprochable » rend bien ἀμέμπτως sans imposer l’idée d’une perfection absolue. « Vous qui croyez » préserve utilement la valeur verbale du participe πιστεύουσιν.
