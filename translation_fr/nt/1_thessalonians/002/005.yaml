source:
  edition: SBLGNT
  text: οὔτε γάρ ποτε ἐν λόγῳ κολακείας ἐγενήθημεν, καθὼς οἴδατε, οὔτε ⸀ἐν προφάσει πλεονεξίας, θεὸς μάρτυς,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/005.yaml
  text: For we never came with flattering speech[a], as you know[b], nor with a pretext for greed—God is witness.
translation:
  language: fr
  text: En effet, jamais nous ne nous sommes présentés avec des paroles flatteuses[a], comme vous le savez, ni sous couvert d’avidité[b] — Dieu en est témoin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avec des flatteries » ; littéralement « dans une parole de flatterie ».
    reason: lexical_alternative
  - marker: b
    text: Ou « avec un prétexte d’avidité », « sous un faux-semblant d’avidité » ou « sous le couvert de la cupidité » ; littéralement « dans un prétexte d’avidité ».
    reason: lexical_alternative
lexical_decisions:
- source_word: οὔτε γάρ ποτε
  choice: En effet, jamais
  rationale: « En effet » rend la fonction explicative de γάρ, tandis que « jamais » exprime naturellement la négation temporelle appuyée de οὔτε…ποτε.
- source_word: ἐν λόγῳ κολακείας
  choice: avec des paroles flatteuses
  rationale: λόγος désigne ici le discours plutôt qu’un mot isolé, et κολακεία la flatterie. Cette formulation française conserve le moyen employé tout en restant naturelle.
- source_word: ἐγενήθημεν
  choice: nous ne nous sommes présentés
  rationale: Dans le contexte de la venue des missionnaires, γίνομαι décrit la manière dont ils se sont montrés ou présentés aux Thessaloniciens, et non un simple changement d’état.
- source_word: καθὼς οἴδατε
  choice: comme vous le savez
  rationale: Formulation directe qui conserve l’appel de Paul à la connaissance personnelle de ses destinataires.
- source_word: ἐν προφάσει πλεονεξίας
  choice: sous un prétexte dissimulant l’avidité
  rationale: πρόφασις peut désigner un prétexte ou une apparence servant de couverture, tandis que πλεονεξία exprime le désir avide d’obtenir davantage. La formulation rend l’idée probable d’une avidité cachée sans la limiter explicitement au seul argent.
- source_word: θεὸς μάρτυς
  choice: Dieu en est témoin
  rationale: Cette tournure française idiomatique conserve l’appel solennel à Dieu comme témoin sans ajouter de possessif absent du grec.
theological_decisions:
- issue: Portée du démenti concernant la méthode et les motivations des missionnaires
  choice: Le texte nie à la fois le recours à la flatterie et la dissimulation d’une motivation avide.
  alternative: Y voir soit une condamnation générale de toute rhétorique travaillée, soit uniquement un démenti d’exploitation financière.
  rationale: Le grec nomme précisément κολακεία et πλεονεξία. La traduction garde ces accusations concrètes sans condamner toute forme de rhétorique ni réduire nécessairement l’avidité au seul gain financier.
translation_notes:
  register: Français international moderne, naturel et digne. « Nous nous sommes présentés » convient au contexte de la venue des missionnaires ; « Dieu en est témoin » garde le caractère solennel de la conclusion. Les notes signalent les formulations plus littérales et l’ambiguïté de πρόφασις.
