source:
  edition: SBLGNT
  text: Μνημονεύετε γάρ, ἀδελφοί, τὸν κόπον ἡμῶν καὶ τὸν μόχθον· ⸀νυκτὸς καὶ ἡμέρας ἐργαζόμενοι πρὸς τὸ μὴ ἐπιβαρῆσαί τινα ὑμῶν ἐκηρύξαμεν εἰς ὑμᾶς τὸ εὐαγγέλιον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/009.yaml
  text: 'For you remember[a], brothers, our labor and hardship: working night and day so as not to burden any of you, we proclaimed to you the gospel of God.'
translation:
  language: fr
  text: 'En effet, vous vous souvenez[a], frères, de notre peine et de notre dur labeur : c’est en travaillant nuit et jour, afin de n’être à la charge d’aucun de vous, que nous vous avons proclamé l’Évangile de Dieu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « frères et sœurs ». Le grec dit « frères »; dans ce contexte, l’adresse peut inclure l’ensemble de l’assemblée.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μνημονεύετε
  choice: vous vous souvenez
  rationale: Le présent de l’indicatif rappelle aux destinataires un fait qu’ils connaissent, plutôt que de leur donner un ordre.
- source_word: ἀδελφοί
  choice: frères et sœurs
  rationale: Dans cette adresse communautaire, le masculin pluriel grec vise vraisemblablement l’ensemble de l’assemblée. Cette formulation française explicite naturellement cette portée inclusive.
- source_word: τὸν κόπον ἡμῶν καὶ τὸν μόχθον
  choice: notre peine et notre dur labeur
  rationale: Le couple de termes souligne à la fois l’effort épuisant et la pénibilité du travail; deux expressions distinctes en français en préservent le renforcement.
- source_word: νυκτὸς καὶ ἡμέρας ἐργαζόμενοι
  choice: nous avons travaillé nuit et jour
  rationale: La locution française rend naturellement l’effort soutenu, et le participe est intégré à une proposition verbale claire.
- source_word: πρὸς τὸ μὴ ἐπιβαρῆσαί τινα ὑμῶν
  choice: pour n’être à la charge d’aucun de vous
  rationale: La construction exprime le but; «être à la charge» rend ici l’idée d’imposer un poids matériel ou financier.
- source_word: ἐκηρύξαμεν εἰς ὑμᾶς
  choice: nous vous proclamions
  rationale: «Proclamer» conserve la force d’une annonce publique, et l’imparfait présente cette proclamation comme contemporaine du travail décrit.
- source_word: τὸ εὐαγγέλιον τοῦ θεοῦ
  choice: la bonne nouvelle de Dieu
  rationale: «Bonne nouvelle» est transparent en français moderne, tandis que «de Dieu» préserve l’ambiguïté du génitif quant à la source, l’appartenance ou le contenu.
theological_decisions:
- issue: Portée inclusive de ἀδελφοί
  choice: frères et sœurs
  alternative: frères
  rationale: Bien que la forme grecque soit grammaticalement masculine, l’apostrophe s’adresse vraisemblablement à toute l’assemblée. Le français moderne «frères et sœurs» rend cette portée sans modifier le groupe visé.
- issue: Relation exprimée par τοῦ θεοῦ
  choice: de Dieu
  alternative: venant de Dieu
  rationale: Le génitif peut évoquer notamment la source ou l’appartenance. La formulation non explicitée conserve cette tension au lieu de trancher.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve l’enchaînement argumentatif introduit par γάρ («En effet») tout en réorganisant légèrement les participes pour une lecture naturelle.
