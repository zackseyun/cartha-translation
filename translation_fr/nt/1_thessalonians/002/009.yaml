  terminology: « Frères » préserve la forme masculine de ἀδελφοί, avec une note signalant que l’adresse peut inclure toute l’assemblée. « Peine » et « dur labeur » rendent le renforcement κόπος/μόχθος. « Évangile » est le terme français établi pour εὐαγγέλιον et évite d’affaiblir la terminologie paulinienne.
