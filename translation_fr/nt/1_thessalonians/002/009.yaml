  source_fidelity: 'Révision nécessaire : ἐκηρύξαμεν est un aoriste (« nous avons proclamé »), non un imparfait (« nous proclamions »). La proposition participiale ἐργαζόμενοι exprime adéquatement la circonstance concomitante par « en travaillant ». « L’Évangile de Dieu » conserve le terme paulinien et le génitif non précisé.'
