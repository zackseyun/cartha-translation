reference: 1 Thessalonians 2:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸀διότι ἠθελήσαμεν ἐλθεῖν πρὸς ὑμᾶς, ἐγὼ μὲν Παῦλος καὶ ἅπαξ καὶ δίς, καὶ ἐνέκοψεν ἡμᾶς ὁ Σατανᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/018.yaml
  text: Because we wanted to come to you—I[a], Paul, again and again—but Satan hindered us.
translation:
  language: fr
  text: Car nous avons voulu venir jusqu’à vous — moi, Paul, plus d’une fois[a] —, mais Satan a fait obstacle à notre venue.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « une fois et deux fois », expression qui signifie « plus d’une fois ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: διότι
  choice: En effet
  rationale: Introduit l’explication de l’affirmation précédente. « En effet » marque naturellement ce lien explicatif en français sans durcir la nuance en causalité autonome.
- source_word: ἠθελήσαμεν
  choice: nous avons voulu
  rationale: Rend directement la volonté ou le désir exprimé par θέλω, avec un passé composé naturel dans un récit épistolaire moderne.
- source_word: ἐλθεῖν πρὸς ὑμᾶς
  choice: venir jusqu’à vous
  rationale: Conserve le mouvement orienté vers les destinataires sans ajouter explicitement l’idée de visite ou de retour.
- source_word: ἐγὼ μὲν Παῦλος
  choice: moi, Paul
  rationale: Fait ressortir Paul personnellement au sein du « nous », comme le font ἐγώ et μέν, sans chercher à fournir un pendant artificiel à μέν.
- source_word: καὶ ἅπαξ καὶ δίς
  choice: plus d’une fois
  rationale: Expression française claire qui transmet la valeur idiomatique de « une fois et deux fois », c’est-à-dire à plusieurs reprises, tout en évitant l’ambiguïté de « encore et encore », qui pourrait suggérer un très grand nombre de tentatives.
- source_word: ἐνέκοψεν
  choice: nous en a empêchés
  rationale: Exprime ici l’obstacle qui a effectivement empêché le déplacement projeté. Le pronom « en » reprend naturellement « venir jusqu’à vous ».
- source_word: ὁ Σατανᾶς
  choice: Satan
  rationale: Conserve la désignation personnelle traditionnelle et transparente dans l’usage français du Nouveau Testament.
theological_decisions:
- issue: Rôle de Satan dans l’obstacle au voyage de Paul
  choice: mais Satan nous en a empêchés
  alternative: mais l’Adversaire nous a fait obstacle
  rationale: Le texte attribue explicitement l’entrave à Satan comme agent personnel. La formulation conserve cette attribution sans expliquer par quel moyen il a agi ni résoudre la tension avec la providence divine.
translation_notes:
  register: Français international moderne, naturel et digne. La ponctuation met en relief l’intervention personnelle de Paul tout en conservant le passage du « nous » au « moi » puis au « nous ». Le marqueur [a] figure dans le texte principal.
