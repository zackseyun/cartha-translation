  verdict: revise
  source_fidelity: « En effet » rend de façon acceptable la valeur explicative de διότι, et « moi, Paul » restitue bien la mise en relief de ἐγὼ μὲν Παῦλος. En revanche, « nous en a empêchés » peut exprimer une prévention totale, alors que ἐνέκοψεν désigne plus précisément l’entrave ou l’obstruction. « A fait obstacle à notre venue » conserve l’attribution explicite à Satan sans renforcer indûment le verbe grec.
  naturalness: Le français est globalement moderne et naturel. « Car » établit plus nettement le lien avec l’énoncé précédent. La formulation révisée évite aussi un pronom « en » dont l’antécédent est compréhensible mais moins explicite que « notre venue ».
  terminology: « Satan » est la désignation française usuelle et appropriée. « Plus d’une fois » transmet correctement l’idiome καὶ ἅπαξ καὶ δίς sans lui attribuer un nombre excessif de tentatives.
  issues:
