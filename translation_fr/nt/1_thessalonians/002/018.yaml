    issue: « nous en a empêchés » risque de renforcer ἐνέκοψεν en empêchement absolu.
    rationale: Le verbe grec décrit le fait de barrer ou d’entraver le chemin; il n’impose pas à lui seul l’idée que toute venue était définitivement impossible. Une formulation d’obstacle préserve mieux cette nuance.
  - severity: low
    issue: « En effet » est moins explicitement causal que διότι.
    rationale: Bien qu’il soit recevable dans le contexte, « Car » rend plus directement la relation explicative introduite par le grec.
  revised_text: Car nous avons voulu venir jusqu’à vous — moi, Paul, plus d’une fois[a] —, mais Satan a fait obstacle à notre venue.
