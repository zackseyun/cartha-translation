  source_fidelity: 'La formulation « éprouvés et reconnus aptes à recevoir la charge de l’Évangile » explicite de façon excessive δεδοκιμάσμεθα et affaiblit le sens passif de πιστευθῆναι : ce n’est pas une charge que les auteurs reçoivent, mais l’Évangile que Dieu leur confie. « Approuvés pour nous confier l’Évangile » rend plus directement les deux éléments du grec. Le reste respecte le contraste elliptique et l’examen continu des cœurs.'
  naturalness: Le français révisé est naturel dans un registre biblique moderne et international. « Nous parlons ainsi » est plus direct que « nous parlons en conséquence » tout en conservant la relation marquée par οὕτως. « Non pour plaire aux êtres humains, mais à Dieu » est idiomatique et conserve l’ellipse du second membre.
  terminology: « Évangile », « Dieu » et « cœurs » sont appropriés. « Confier l’Évangile » restitue avec précision le vocabulaire de la confiance/dépôt, sans le réduire à une fonction ou à une responsabilité. La note est maintenue et son ancre demeure correctement placée après « Dieu ».
