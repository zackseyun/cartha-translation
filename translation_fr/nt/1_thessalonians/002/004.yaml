reference: 1 Thessalonians 2:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀλλὰ καθὼς δεδοκιμάσμεθα ὑπὸ τοῦ θεοῦ πιστευθῆναι τὸ εὐαγγέλιον οὕτως λαλοῦμεν, οὐχ ὡς ἀνθρώποις ἀρέσκοντες ἀλλὰ ⸀θεῷ τῷ δοκιμάζοντι τὰς καρδίας ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/004.yaml
  text: But just as we have been approved by God to be entrusted with the gospel[a], so we speak—not as pleasing people, but God, who tests our hearts.
translation:
  language: fr
  text: 'Mais, puisque Dieu nous a approuvés pour nous confier l’Évangile, nous parlons ainsi : non pour plaire aux êtres humains, mais à Dieu[a], qui met nos cœurs à l’épreuve.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement, le grec dit de manière resserrée : « non pas comme plaisant aux êtres humains, mais à Dieu » ; le verbe « plaire » est sous-entendu dans le second membre.'
    reason: La note signale l’ellipse du texte grec et sa formulation participiale, que le français courant rend plus naturellement par une expression de but.
lexical_decisions:
- source_word: δεδοκιμάσμεθα
  choice: nous a éprouvés et reconnus aptes
  rationale: Le parfait passif exprime une évaluation accomplie dont le résultat demeure. La formulation française rend à la fois l’épreuve et son issue favorable, sans introduire l’idée plus forte de mérite.
- source_word: πιστευθῆναι τὸ εὐαγγέλιον
  choice: à recevoir la charge de l’Évangile
  rationale: L’infinitif passif signifie ici que l’Évangile leur a été confié, et non qu’ils y ont cru. « Recevoir la charge de » exprime naturellement en français la responsabilité confiée.
- source_word: τὸ εὐαγγέλιον
  choice: l’Évangile
  rationale: « Évangile » est le terme français consacré dans le contexte paulinien et conserve la densité théologique du grec.
- source_word: οὕτως λαλοῦμεν
  choice: nous parlons en conséquence
  rationale: Cette formulation maintient le lien logique entre l’approbation et la mission reçues de Dieu, d’une part, et la manière de parler des apôtres, d’autre part.
- source_word: οὐχ ὡς ἀνθρώποις ἀρέσκοντες
  choice: non pas pour plaire aux êtres humains
  rationale: Cette tournure française actuelle rend clairement le but rejeté. « Êtres humains » est inclusif et correspond au pluriel générique ἀνθρώποις.
- source_word: ἀλλὰ θεῷ
  choice: mais à Dieu
  rationale: Le grec laisse le participe « plaire » sous-entendu dans le second membre. Le français permet de conserver cette ellipse sans obscurité.
- source_word: τῷ δοκιμάζοντι
  choice: qui met … à l’épreuve
  rationale: Le participe présent indique l’examen continu de Dieu. Cette expression maintient le lien lexical avec δεδοκιμάσμεθα au début du verset.
- source_word: τὰς καρδίας ἡμῶν
  choice: nos cœurs
  rationale: « Cœurs » préserve l’anthropologie biblique et ne réduit pas le sens à l’intelligence ou aux émotions seules.
theological_decisions:
- issue: Le contraste entre la recherche de l’approbation humaine et celle de Dieu
  choice: non pas pour plaire aux êtres humains, mais à Dieu
  alternative: non pas comme des gens qui cherchent à plaire aux êtres humains, mais comme des gens qui cherchent à plaire à Dieu
  rationale: La formulation retenue respecte l’ellipse grecque, où le verbe « plaire » n’est exprimé que dans le premier membre, tout en restant parfaitement naturelle en français. Elle ne transforme pas la phrase en commentaire théologique.
- issue: La portée de l’évaluation divine exprimée par δεδοκιμάσμεθα
  choice: éprouvés et reconnus aptes
  alternative: jugés dignes
  rationale: « Reconnus aptes » exprime une issue favorable à l’examen sans suggérer que la mission aurait été accordée en récompense d’un mérite intrinsèque.
translation_notes:
  register: Français international moderne, digne et accessible. « En conséquence » évite l’ambiguïté possible de « ainsi ». « Recevoir la charge de l’Évangile » rend l’idée de dépôt confié sans lourdeur passive. La répétition « éprouvés / met … à l’épreuve » conserve le jeu lexical du grec.
