source:
  edition: SBLGNT
  text: ὑμεῖς γὰρ μιμηταὶ ἐγενήθητε, ἀδελφοί, τῶν ἐκκλησιῶν τοῦ θεοῦ τῶν οὐσῶν ἐν τῇ Ἰουδαίᾳ ἐν Χριστῷ Ἰησοῦ, ὅτι τὰ αὐτὰ ἐπάθετε καὶ ὑμεῖς ὑπὸ τῶν ἰδίων συμφυλετῶν καθὼς καὶ αὐτοὶ ὑπὸ τῶν Ἰουδαίων
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/014.yaml
  text: For you became imitators[a], brothers, of the churches of God that are in Judea in Messiah Jesus, because you also suffered the same things from your own countrymen[c][b], just as they did from the Jews.
translation:
  language: fr
  text: 'En effet, frères et sœurs, vous êtes devenus les imitateurs des Églises de Dieu qui sont en Judée, en Jésus le Messie[a] : vous aussi, vous avez subi les mêmes souffrances de la part de vos propres compatriotes, tout comme les membres de ces Églises en ont subi de la part des Juifs[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « en Christ Jésus ». Le grec Χριστός est rendu ici par « Messie » afin d''en conserver le sens de titre.'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « des Judéens ». Le terme grec peut désigner les Juifs ou, selon le contexte, les habitants de la Judée. Il ne désigne pas nécessairement ici tous les Juifs sans exception.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μιμηταὶ ἐγενήθητε
  choice: vous êtes devenus les imitateurs
  rationale: Cette formulation conserve à la fois l’idée explicite d’imitation portée par μιμηταί et la notion de devenir exprimée par ἐγενήθητε.
- source_word: ἀδελφοί
  choice: frères et sœurs
  rationale: Le masculin pluriel grec s’adresse ici à l’ensemble de la communauté. En français contemporain, « frères et sœurs » rend clairement cette portée collective sans changer le référent.
- source_word: ἐκκλησιῶν τοῦ θεοῦ
  choice: Églises de Dieu
  rationale: « Églises » est le terme français courant et approprié dans le contexte des communautés chrétiennes pauliniennes.
- source_word: τῶν οὐσῶν ἐν τῇ Ἰουδαίᾳ
  choice: qui sont en Judée
  rationale: La proposition relative restitue naturellement le participe grec qui situe géographiquement ces Églises.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: en Jésus le Messie
  rationale: Cette formulation française naturelle conserve le sens titulaire de Χριστός. L’ordre des mots est adapté pour éviter l’expression peu idiomatique « le Messie Jésus ».
- source_word: τὰ αὐτὰ ἐπάθετε
  choice: vous avez subi […] les mêmes souffrances
  rationale: πάσχω exprime ici l’expérience de l’épreuve. « Les mêmes souffrances » explicite naturellement le neutre pluriel τὰ αὐτά sans préciser la nature des persécutions au-delà du texte.
- source_word: τῶν ἰδίων συμφυλετῶν
  choice: vos propres compatriotes
  rationale: συμφυλέται désigne les membres du même peuple ou groupe national. « Compatriotes » rend cette identité partagée, tandis que « propres » conserve l’insistance de ἰδίων.
- source_word: τῶν Ἰουδαίων
  choice: des Juifs
  rationale: « Juifs » rend le sens ethnoreligieux habituel du terme dans ce contexte. Une note conserve l’autre valeur possible, « Judéens », et le texte n’élargit pas le référent à tous les Juifs.
theological_decisions:
- issue: 'Valeur de Χριστός : titre ou élément d’un nom'
  choice: Jésus le Messie
  alternative: Christ Jésus
  rationale: Le contexte permet encore de percevoir la valeur titulaire de Χριστός. « Jésus le Messie » en préserve le contenu sémantique tout en restant idiomatique en français.
- issue: Portée de l’expression « des Juifs »
  choice: Conserver « des Juifs » sans universaliser le groupe visé
  alternative: des Judéens
  rationale: Le verset vise les personnes ayant fait souffrir les Églises de Judée, non l’ensemble du peuple juif. La traduction garde le terme direct, tandis que la note signale son autre valeur géographique possible.
- issue: Référent du pronom αὐτοὶ
  choice: elles, en référence aux Églises de Judée
  alternative: eux, en référence aux croyants de Judée
  rationale: Le grec emploie un masculin qui peut viser les membres des Églises. En français, le pronom féminin « elles » reprend naturellement « Églises » sans modifier la comparaison entre les deux communautés.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe conserve le raisonnement comparatif du grec tout en évitant le calque peu naturel « dans le Messie Jésus ». Le double « vous » souligne naturellement καὶ ὑμεῖς.
