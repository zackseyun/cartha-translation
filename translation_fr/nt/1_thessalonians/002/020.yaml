  text: ὑμεῖς γάρ ἐστε ἡ δόξα ἡμῶν καὶ ἡ χαρά.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/020.yaml
  text: For you are our glory and joy[a].
translation:
  language: fr
  text: Car c’est vous qui êtes notre gloire et notre joie[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « notre fierté » ou « notre honneur » pour « notre gloire ».
    reason: Alternative lexicale pour δόξα dans ce contexte relationnel.
lexical_decisions:
- source_word: ὑμεῖς
  choice: vous
  rationale: Le pronom de la deuxième personne du pluriel est exprimé en grec avec une valeur emphatique. La tournure française « c’est vous qui » rend naturellement cette insistance.
- source_word: γάρ
  choice: Car
  rationale: La conjonction introduit l’explication de l’affirmation précédente et en préserve clairement le lien logique.
- source_word: ἐστε
  choice: êtes
  rationale: Le présent de l’indicatif du verbe « être » appelle ici la copule française directe « êtes ».
- source_word: ἡ δόξα ἡμῶν
  choice: notre gloire
  rationale: « Gloire » conserve la portée et l’éventail sémantique de δόξα, tandis que le génitif ἡμῶν se rend naturellement par le possessif « notre ».
- source_word: ἡ χαρά
  choice: notre joie
  rationale: χαρά désigne directement la joie. La répétition de « notre », naturelle en français, fait clairement porter le possessif grec sur les deux noms.
theological_decisions:
- issue: Sens de δόξα dans cette déclaration relationnelle de Paul
  choice: gloire
  alternative: fierté, sujet de fierté ou honneur
  rationale: « Gloire » maintient le terme grec et sa force rhétorique sans réduire l’expression à de l’autosatisfaction. Une note signale les nuances contextuelles possibles.
translation_notes:
  register: Français international moderne, digne et accessible. La structure clivée « c’est vous qui » restitue l’emphase du pronom grec explicitement exprimé; « Car » maintient le rapport explicatif avec le contexte précédent.
