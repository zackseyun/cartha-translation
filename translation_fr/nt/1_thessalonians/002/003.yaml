  text: ἡ γὰρ παράκλησις ἡμῶν οὐκ ἐκ πλάνης οὐδὲ ἐξ ἀκαθαρσίας ⸀οὐδὲ ἐν δόλῳ,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/003.yaml
  text: For our appeal does not come from error or impurity or deceit[b][a],
translation:
  language: fr
  text: En effet, notre appel[a] ne vient ni de l’erreur[b] ni de l’impureté, et n’est empreint d’aucune ruse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « exhortation ». Le mot grec peut désigner un appel, une exhortation ou un encouragement selon le contexte.
    reason: lexical_alternative
  - marker: b
    text: Ou « tromperie » ou « égarement ». La « ruse » mentionnée ensuite exprime plus directement une manière délibérément trompeuse d’agir.
    reason: lexical_alternative
lexical_decisions:
- source_word: παράκλησις
  choice: appel
  rationale: Dans ce contexte, le terme désigne l’appel pressant adressé aux auditeurs dans la proclamation apostolique. « Appel » reste naturel en français et ne réduit pas le sens à la consolation.
- source_word: πλάνης
  choice: erreur
  rationale: 'Avec ἐκ, le mot indique ici l’origine de l’appel : celui-ci ne procède pas de l’erreur ou de l’égarement. « Erreur » permet aussi de le distinguer de δόλος, qui exprime plus directement la ruse délibérée.'
- source_word: ἀκαθαρσίας
  choice: impureté
  rationale: « Impureté » conserve la portée morale générale du terme sans la limiter à l’impureté sexuelle, que le contexte immédiat ne précise pas.
- source_word: δόλῳ
  choice: avec ruse
  rationale: Avec ἐν, le terme décrit la manière d’agir. « Avec ruse » exprime clairement l’idée de procédé trompeur sans employer un mot vieilli.
- source_word: ἐκ ... ἐξ ... ἐν
  choice: ne vient ni de ... ni de ..., et ne se fait pas avec ...
  rationale: La formulation distingue les deux indications d’origine introduites par ἐκ/ἐξ de l’indication de manière introduite par ἐν, tout en restant idiomatique en français.
- source_word: γὰρ
  choice: En effet
  rationale: « En effet » marque naturellement que cette affirmation explique et justifie ce qui précède.
theological_decisions:
- issue: Portée de ἀκαθαρσία dans la défense de Paul
  choice: Traduire largement par « impureté » sans préciser sa nature.
  alternative: « impureté sexuelle »
  rationale: Le terme peut avoir une connotation sexuelle dans certains contextes pauliniens, mais ce verset ne détermine pas la forme d’impureté envisagée. La traduction générale préserve cette ouverture.
- issue: Rapport entre πλάνη et δόλος
  choice: Distinguer « erreur » comme origine et « ruse » comme manière d’agir.
  alternative: Traduire les deux termes dans le champ de la tromperie.
  rationale: Cette distinction respecte à la fois les prépositions grecques et la tension possible entre fausseté ou égarement d’une part, procédé délibérément trompeur d’autre part, sans exclure entièrement le sens de tromperie pour πλάνη.
translation_notes:
  register: Français international moderne, clair et digne. La structure distingue explicitement l’origine de l’appel (« vient de ») de la manière dont il est présenté (« se fait avec »), tout en conservant le rythme de la triple négation grecque.
