reference: 1 Thessalonians 2:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: δυνάμενοι ἐν βάρει εἶναι ὡς Χριστοῦ ἀπόστολοι· ἀλλὰ ἐγενήθημεν ⸀ἤπιοι ἐν μέσῳ ὑμῶν, ὡς ⸀ἐὰν τροφὸς θάλπῃ τὰ ἑαυτῆς τέκνα·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/007.yaml
  text: though we could have been a burden as apostles of the Messiah[a], yet we became gentle among you[c][b], as a nursing mother cherishes her own children.
translation:
  language: fr
  text: Bien que, comme apôtres du Messie[b], nous ayons pu avoir du poids[a], nous nous sommes au contraire montrés doux parmi vous, comme une mère qui allaite[c] prend tendrement soin de ses propres enfants.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « être de poids ». Selon le contexte, on pourrait aussi traduire : « faire valoir notre autorité », « avoir des exigences » ou « être à votre charge ».'
    reason: La locution grecque conserve une certaine ambiguïté entre poids statutaire, exercice de l’autorité, exigences et éventuelle charge matérielle.
  - marker: b
    text: 'Traduction traditionnelle : « apôtres du Christ ».'
    reason: Elle préserve l’équivalent traditionnel de Χριστός, ici rendu par son sens titulaire « Messie ».
  - marker: c
    text: 'Ou : « une nourrice », voire « une mère nourricière »; l’image est celle de soins maternels pleins de tendresse.'
    reason: τροφός peut désigner une femme qui allaite et élève un enfant; « infirmière » serait trompeur en français moderne.
lexical_decisions:
- source_word: δυνάμενοι
  choice: bien que nous ayons pu
  rationale: Le participe prend ici une valeur concessive en raison du contraste introduit par ἀλλά. Cette tournure est naturelle en français et conserve l’idée d’une possibilité qui n’a pas été mise à profit.
- source_word: ἐν βάρει εἶναι
  choice: nous imposer
  rationale: L’expression signifie littéralement « être de poids » et évoque probablement le poids du statut apostolique, les exigences ou l’autorité que les envoyés auraient pu faire valoir. « Nous imposer » rend cette portée de façon naturelle sans la limiter à une charge financière; le sens littéral et les autres nuances figurent en note.
- source_word: ὡς Χριστοῦ ἀπόστολοι
  choice: en tant qu’apôtres du Messie
  rationale: Χριστοῦ fonctionne ici comme un titre. « Messie » en exprime le sens, tandis que la formulation traditionnelle « du Christ » est signalée en note.
- source_word: ἀλλὰ ἐγενήθημεν
  choice: nous nous sommes au contraire montrés
  rationale: Cette formulation conserve la valeur dynamique de γίνομαι et marque clairement le contraste, sans suggérer nécessairement un changement de caractère dans le temps.
- source_word: ἤπιοι
  choice: doux
  rationale: Le terme désigne une attitude douce, bienveillante et sans rudesse. « Doux » convient au registre et prépare naturellement l’image maternelle qui suit.
- source_word: ἐν μέσῳ ὑμῶν
  choice: parmi vous
  rationale: Équivalent français idiomatique de la locution signifiant littéralement « au milieu de vous ».
- source_word: ὡς ἐὰν τροφὸς
  choice: comme une mère qui allaite
  rationale: τροφός désigne une femme qui nourrit un enfant au sein et en prend soin. Le contexte de « ses propres enfants » soutient l’image maternelle, tout en laissant en note les traductions plus techniques possibles.
- source_word: θάλπῃ
  choice: prend tendrement soin
  rationale: Le verbe évoque au sens propre l’action de réchauffer, puis par extension les soins tendres et protecteurs. La traduction française exprime cette affection sans rendre le verbe de manière artificiellement littérale.
- source_word: τὰ ἑαυτῆς τέκνα
  choice: ses propres enfants
  rationale: « Enfants » rend τέκνα, tandis que « propres » maintient l’insistance du pronom réfléchi ἑαυτῆς.
theological_decisions:
- issue: Traduction de Χριστοῦ
  choice: du Messie
  alternative: du Christ
  rationale: Dans cette expression, Χριστός fonctionne comme le titre de l’Oint. « Messie » en communique directement la valeur titulaire; la traduction chrétienne traditionnelle reste indiquée en note.
- issue: Nature du « poids » apostolique
  choice: nous imposer
  alternative: être à votre charge; faire valoir notre autorité; avoir du poids
  rationale: Le grec ne précise pas si le poids est financier, social ou lié à l’autorité apostolique. Le texte principal privilégie une expression française large, et la note conserve explicitement les principales possibilités afin de ne pas résoudre indûment l’ambiguïté.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve le contraste rhétorique ainsi que l’image maternelle, tout en évitant un littéralisme obscur pour l’expression « être dans le poids ». Les notes maintiennent les ambiguïtés lexicales et la traduction traditionnelle de Χριστός.
