  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸀Καὶ διὰ τοῦτο καὶ ἡμεῖς εὐχαριστοῦμεν τῷ θεῷ ἀδιαλείπτως, ὅτι παραλαβόντες λόγον ἀκοῆς παρ’ ἡμῶν τοῦ θεοῦ ἐδέξασθε οὐ λόγον ἀνθρώπων ἀλλὰ καθὼς ⸂ἀληθῶς ἐστὶν⸃ λόγον θεοῦ, ὃς καὶ ἐνεργεῖται ἐν ὑμῖν τοῖς πιστεύουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/013.yaml
  text: And because of this we also thank God continually[a], that when you received the word of God that you heard from us, you accepted it not as the word of men but, as it truly is, the word of God[c][b], which is also at work in you who believe.
translation:
  language: fr
  text: 'C’est pourquoi, nous aussi, nous remercions Dieu sans cesse : lorsque vous avez reçu la parole de Dieu que vous avez entendue de notre part[a], vous l’avez accueillie non comme une parole humaine, mais comme ce qu’elle est véritablement : la parole de Dieu. Cette parole[b] est aussi à l’œuvre en vous qui croyez.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le message de Dieu que vous avez entendu de notre part ». L’expression grecque est condensée et peut être déployée de plusieurs manières naturelles en français.'
    reason: lexical_alternative
  - marker: b
    text: 'Le pronom grec peut aussi être compris comme renvoyant à Dieu : « Dieu, qui est aussi à l’œuvre en vous qui croyez. »'
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: C’est pourquoi
  rationale: Rend le lien causal explicite avec le contexte précédent dans un français naturel, sans réduire l’expression à une simple transition logique.
- source_word: καὶ ἡμεῖς
  choice: nous aussi
  rationale: Conserve l’accent porté par le pronom grec et la valeur additive de καί.
- source_word: εὐχαριστοῦμεν τῷ θεῷ ἀδιαλείπτως
  choice: nous remercions Dieu sans cesse
  rationale: Expression française courante et digne qui garde l’idée d’une action répétée et persistante.
- source_word: παραλαβόντες λόγον ἀκοῆς παρ’ ἡμῶν τοῦ θεοῦ
  choice: lorsque vous avez reçu la parole de Dieu que nous vous avons fait entendre
  rationale: Déplie la construction grecque très condensée tout en gardant distincts le fait de recevoir le message et son origine immédiate dans la prédication apostolique. Une autre façon naturelle de l’analyser est signalée en note.
- source_word: ἐδέξασθε
  choice: vous l’avez accueillie
  rationale: Marque une réception favorable et intérieure, en distinguant ce verbe de παραλαβόντες, déjà rendu par « reçu ».
- source_word: οὐ λόγον ἀνθρώπων
  choice: non comme une parole humaine
  rationale: Le pluriel générique ἀνθρώπων qualifie ici l’origine humaine de la parole. Cette formulation est actuelle, inclusive et préserve le contraste rhétorique.
- source_word: ἀλλὰ καθὼς ἀληθῶς ἐστὶν λόγον θεοῦ
  choice: 'mais comme ce qu’elle est véritablement : la parole de Dieu'
  rationale: Préserve l’affirmation incidente de réalité et le contraste avec « une parole humaine », dans une syntaxe française claire.
- source_word: ἐνεργεῖται
  choice: est aussi à l’œuvre
  rationale: Rend l’activité continue et efficace exprimée par le verbe sans trancher excessivement entre ses nuances moyenne et passive.
- source_word: τοῖς πιστεύουσιν
  choice: en vous qui croyez
  rationale: La proposition relative conserve la valeur caractérisante du participe présent et évite de transformer celui-ci en simple étiquette nominale.
theological_decisions:
- issue: Référent du pronom relatif ὃς
  choice: 'La proposition renvoie à « la parole de Dieu » : « Cette parole est aussi à l’œuvre »'
  alternative: 'Le pronom peut être rattaché à Dieu : « Dieu, qui est aussi à l’œuvre en vous qui croyez »'
  rationale: En grec, ὃς peut grammaticalement se rapporter à λόγος ou à θεός, tous deux masculins singuliers. La proximité syntaxique et le développement de la phrase favorisent « la parole », mais l’autre lecture demeure possible et est conservée en note.
- issue: Portée de l’expression λόγον θεοῦ
  choice: la parole de Dieu
  alternative: le message de Dieu
  rationale: « Parole » maintient le contraste explicite entre λόγον ἀνθρώπων et λόγον θεοῦ ainsi que son poids théologique, sans élargir l’affirmation du verset en une doctrine supplémentaire.
translation_notes:
  register: Français international moderne, clair et digne. « Parole humaine » évite le masculin générique vieilli tout en conservant le contraste du texte. La répétition de « parole de Dieu » est volontaire, car elle porte l’opposition rhétorique du verset.
