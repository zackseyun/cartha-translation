id: 1TH.2.8
reference: 1 Thessalonians 2:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὕτως ὁμειρόμενοι ὑμῶν εὐδοκοῦμεν μεταδοῦναι ὑμῖν οὐ μόνον τὸ εὐαγγέλιον τοῦ θεοῦ ἀλλὰ καὶ τὰς ἑαυτῶν ψυχάς, διότι ἀγαπητοὶ ἡμῖν ⸀ἐγενήθητε.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/008.yaml
  text: So[a], longing for you in this way, we were pleased to share with you not only the gospel of God but also our own lives[b], because you had become dear to us.
translation:
  language: fr
  text: Ainsi, dans notre profonde affection pour vous[a], nous étions heureux de partager avec vous non seulement la bonne nouvelle de Dieu, mais aussi nos propres vies[b], parce que vous nous étiez devenus chers.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans notre ardent désir de vous voir » ou « dans notre vive affection pour vous » ; le rare participe grec exprime une profonde affection ou un vif désir.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « nos propres âmes » ; ici, le terme grec peut désigner la vie ou la personne elle-même.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: Ainsi
  rationale: Relie naturellement cette phrase à l’image précédente de la nourrice et introduit la manière dont les apôtres ont pris soin des Thessaloniciens.
- source_word: ὁμειρόμενοι ὑμῶν
  choice: dans notre profonde affection pour vous
  rationale: Ce participe rare exprime un attachement intense, mêlant tendresse et désir d’être auprès des destinataires. La formulation française préserve cette force sans imposer une valeur causale certaine.
- source_word: εὐδοκοῦμεν
  choice: nous avons eu à cœur
  rationale: Rend à la fois la volonté et le plaisir impliqués par le verbe, dans un français naturel et chaleureux.
- source_word: μεταδοῦναι
  choice: de partager
  rationale: Le verbe désigne le fait de donner en partage quelque chose qui est à soi et convient aux deux compléments coordonnés.
- source_word: τὸ εὐαγγέλιον τοῦ θεοῦ
  choice: la bonne nouvelle de Dieu
  rationale: Expression immédiatement compréhensible qui conserve le génitif grec, lequel peut désigner la nouvelle venant de Dieu et ayant Dieu pour auteur.
- source_word: τὰς ἑαυτῶν ψυχάς
  choice: notre propre vie
  rationale: Dans ce contexte, ψυχή désigne la vie ou la personne elle-même plutôt qu’une composante immatérielle distincte. Le singulier distributif français est naturel après « notre » collectif.
- source_word: διότι
  choice: tant
  rationale: Exprime idiomatiquement en français la raison affective de ce don de soi, sans alourdir la phrase par une seconde proposition introduite par « parce que ».
- source_word: ἀγαπητοὶ ἡμῖν ἐγενήθητε
  choice: vous nous étiez devenus chers
  rationale: Préserve l’idée d’un état relationnel acquis ainsi que la chaleur affective de ἀγαπητοί, sans ajouter de résonance doctrinale particulière.
theological_decisions:
- issue: Sens de ψυχάς dans le don apostolique de soi
  choice: notre propre vie
  alternative: nos propres âmes ; nous-mêmes
  rationale: Le contexte porte sur l’engagement personnel et sacrificiel des apôtres, non sur une définition anthropologique du rapport entre l’âme et le corps.
- issue: Portée de ἀγαπητοί
  choice: chers
  alternative: bien-aimés
  rationale: « Chers » communique directement l’affection relationnelle exprimée ici et évite que « bien-aimés » soit entendu comme un titre théologique technique.
- issue: Relation du participe ὁμειρόμενοι avec le verbe principal
  choice: circonstance affective non explicitement causale
  alternative: parce que nous désirions ardemment être avec vous
  rationale: La syntaxe permet de percevoir un lien causal, mais ne le marque pas formellement. La traduction maintient cette nuance sans trancher au-delà du grec.
translation_notes:
  register: Français international moderne, digne et chaleureux. « Avoir à cœur » restitue la disposition volontaire et affectueuse sans archaïsme. Les deux notes conservent les principales possibilités lexicales du grec.
