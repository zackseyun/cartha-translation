id: 1TH.2.1
reference: 1 Thessalonians 2:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Αὐτοὶ γὰρ οἴδατε, ἀδελφοί, τὴν εἴσοδον ἡμῶν τὴν πρὸς ὑμᾶς ὅτι οὐ κενὴ γέγονεν,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/001.yaml
  text: For you yourselves know[a], brothers, that our coming to you was not in vain,
translation:
  language: fr
  text: Car vous savez vous-mêmes, frères[a], que notre venue chez vous n’a pas été vaine.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec dit « frères »; dans cette adresse, le terme peut désigner l’ensemble de la communauté croyante.
    reason: Portée possible de l’adresse grecque masculine ἀδελφοί, sans modifier le terme du texte principal.
lexical_decisions:
- source_word: Αὐτοὶ
  choice: vous-mêmes
  rationale: Le pronom intensif souligne que les Thessaloniciens le savent par leur propre expérience.
- source_word: γὰρ
  choice: omis comme connecteur explicite
  rationale: En français, la continuité argumentative peut rester naturelle sans traduire systématiquement γάρ par « car »; le lien avec ce qui précède demeure implicite.
- source_word: οἴδατε
  choice: savez
  rationale: Bien que la forme grecque soit historiquement un parfait, οἶδα a ici le sens présent courant de « savoir ».
- source_word: ἀδελφοί
  choice: frères et sœurs
  rationale: Dans cette apostrophe paulinienne, le masculin pluriel grec désigne vraisemblablement l’ensemble de la communauté croyante; « frères et sœurs » exprime naturellement ce référent inclusif en français moderne.
- source_word: τὴν εἴσοδον ἡμῶν τὴν πρὸς ὑμᾶς
  choice: notre venue chez vous
  rationale: εἴσοδος désigne ici l’arrivée ou la venue des missionnaires auprès des Thessaloniciens. « Chez vous » rend idiomatiquement πρὸς ὑμᾶς sans imposer davantage que le grec.
- source_word: ὅτι
  choice: que
  rationale: La conjonction introduit le contenu de ce que les destinataires savent.
- source_word: οὐ κενὴ γέγονεν
  choice: n’a pas été sans résultat
  rationale: κενός peut évoquer ce qui est vide, vain ou dépourvu d’effet. Cette formulation française rend le sens contextuel tout en conservant la portée durable du parfait γέγονεν.
theological_decisions:
- issue: Portée de ἀδελφοί dans l’adresse à la communauté
  choice: frères et sœurs
  alternative: frères
  rationale: Le grec emploie le masculin « frères », mais cet usage apostrophique inclut ici vraisemblablement les croyantes. Le français explicite naturellement cette portée sans introduire de distinction doctrinale.
- issue: Sens de κενή appliqué à la venue apostolique
  choice: sans résultat
  alternative: vaine
  rationale: Le contexte peut viser l’absence d’effet, de contenu ou de valeur. « Sans résultat » communique clairement l’idée principale sans préciser la nature théologique exacte du fruit produit.
translation_notes:
  register: Français international moderne, digne et direct. L’emphase de Αὐτοὶ est conservée par « vous-mêmes ». « Venue chez vous » évite le littéralisme peu naturel de « entrée vers vous ».
