id: 1TH.2.2
reference: 1 Thessalonians 2:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀλλὰ προπαθόντες καὶ ὑβρισθέντες καθὼς οἴδατε ἐν Φιλίπποις ἐπαρρησιασάμεθα ἐν τῷ θεῷ ἡμῶν λαλῆσαι πρὸς ὑμᾶς τὸ εὐαγγέλιον τοῦ θεοῦ ἐν πολλῷ ἀγῶνι.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/002.yaml
  text: But after we had already suffered and been shamefully mistreated[a], as you know, in Philippi[c][b], we were bold in our God to speak the gospel of God to you amid much conflict.
translation:
  language: fr
  text: Mais, après avoir déjà souffert et avoir été indignement maltraités[a] à Philippes, comme vous le savez, nous avons eu, en notre Dieu, l’assurance[b] de vous annoncer l’Évangile de Dieu au milieu d’un grand combat[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « été insultés », « subi des traitements honteux » ou « été maltraités avec arrogance ». Le verbe grec évoque un traitement insolent et déshonorant, éventuellement public.
    reason: lexical_alternative
  - marker: b
    text: Ou « nous avons parlé avec assurance en notre Dieu ». Le verbe grec peut lui-même désigner le fait de parler avec hardiesse; la traduction distingue l’assurance de l’acte d’annoncer exprimé ensuite.
    reason: lexical_alternative
  - marker: c
    text: Ou « au prix d’un grand combat » ou « malgré une forte opposition ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Mais
  rationale: Marque le contraste avec ce qui précède de manière naturelle en français.
- source_word: προπαθόντες
  choice: après avoir déjà souffert
  rationale: Le participe aoriste indique une souffrance antérieure à l’action principale; « déjà » rend la valeur d’antériorité portée par le préfixe προ-.
- source_word: ὑβρισθέντες
  choice: subi des outrages
  rationale: Le verbe évoque des mauvais traitements empreints d’insolence et de déshonneur public, et non de simples insultes verbales.
- source_word: καθὼς οἴδατε
  choice: comme vous le savez
  rationale: Rend simplement l’appel incident à ce que les destinataires savent.
- source_word: ἐν Φιλίπποις
  choice: à Philippes
  rationale: Forme française usuelle du nom de lieu avec la préposition idiomatique employée pour une ville.
- source_word: ἐπαρρησιασάμεθα
  choice: nous avons eu … l’assurance
  rationale: Exprime la liberté et la hardiesse de parole tout en laissant l’infinitif λαλῆσαι préciser l’acte d’annonce.
- source_word: ἐν τῷ θεῷ ἡμῶν
  choice: en notre Dieu
  rationale: Conserve la formulation relationnelle et sphérique du grec sans la réduire à une causalité instrumentale.
- source_word: λαλῆσαι πρὸς ὑμᾶς
  choice: de vous annoncer
  rationale: Dans ce contexte, « annoncer » rend naturellement l’acte de communiquer aux Thessaloniciens le contenu précisé par la proposition suivante.
- source_word: τὸ εὐαγγέλιον τοῦ θεοῦ
  choice: l’Évangile de Dieu
  rationale: Préserve l’expression paulinienne et l’ambiguïté du génitif, qui peut évoquer aussi bien l’origine divine que le contenu relatif à Dieu.
- source_word: ἐν πολλῷ ἀγῶνι
  choice: au milieu d’une lutte intense
  rationale: ἀγών désigne une lutte, un combat ou un conflit; cette formulation conserve l’image de l’effort éprouvant sans réduire le terme à la seule opposition extérieure.
theological_decisions:
- issue: Valeur de ἐν τῷ θεῷ ἡμῶν
  choice: en notre Dieu
  alternative: par notre Dieu; grâce à notre Dieu; avec confiance en notre Dieu
  rationale: La formulation retenue préserve le fait que Dieu est la sphère ou le fondement de l’assurance apostolique, sans imposer exclusivement une lecture instrumentale.
- issue: Valeur du génitif dans τὸ εὐαγγέλιον τοῦ θεοῦ
  choice: l’Évangile de Dieu
  alternative: la Bonne Nouvelle venant de Dieu; la Bonne Nouvelle au sujet de Dieu
  rationale: Le génitif grec n’est pas explicité afin de ne pas trancher entre origine, appartenance et contenu.
translation_notes:
  register: Français international moderne, digne et accessible. « Évangile » conserve le terme paulinien familier; « assurance » évite la nuance parfois téméraire d’« audace ». La syntaxe reste proche du mouvement grec tout en étant naturelle en français.
