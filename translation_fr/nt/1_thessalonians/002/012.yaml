id: 1TH.2.12
reference: 1 Thessalonians 2:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: παρακαλοῦντες ὑμᾶς καὶ παραμυθούμενοι καὶ μαρτυρόμενοι, εἰς τὸ ⸀περιπατεῖν ὑμᾶς ἀξίως τοῦ θεοῦ τοῦ καλοῦντος ὑμᾶς εἰς τὴν ἑαυτοῦ βασιλείαν καὶ δόξαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/012.yaml
  text: encouraging[a], comforting, and urging you to walk worthily of God[c][b], who calls you into his own kingdom and glory.
translation:
  language: fr
  text: vous encourageant, vous réconfortant et vous pressant[a] de marcher[b] d’une manière digne de Dieu, qui vous appelle à son propre royaume et à sa gloire.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vous exhortant, vous consolant et vous adressant un appel solennel » ; les trois participes ont des sens qui se recoupent et décrivent l’accompagnement paternel de Paul.
    reason: lexical_alternative
  - marker: b
    text: « Marcher » est une image biblique désignant la manière de vivre ou de se conduire.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακαλοῦντες
  choice: vous encourageant
  rationale: Le participe décrit une action pastorale continue. « Encourager » convient au ton paternel du contexte tout en pouvant inclure une nuance d’exhortation.
- source_word: παραμυθούμενοι
  choice: vous réconfortant
  rationale: Le verbe évoque des paroles de consolation et d’encouragement personnel. « Réconforter » le distingue naturellement du premier participe.
- source_word: μαρτυρόμενοι
  choice: vous pressant
  rationale: Dans ce contexte, le verbe exprime un appel insistant et solennel plutôt qu’un simple témoignage. « Presser » communique cette force sans employer le plus vieilli « adjurer ».
- source_word: εἰς τὸ περιπατεῖν
  choice: de marcher
  rationale: La construction indique le but ou le contenu des appels précédents. « Marcher » conserve la métaphore biblique de la conduite quotidienne, explicitée en note.
- source_word: ἀξίως τοῦ θεοῦ
  choice: d’une manière digne de Dieu
  rationale: Cette formulation française naturelle conserve le rapport exprimé par le génitif après ἀξίως sans suggérer que les croyants mériteraient Dieu.
- source_word: τοῦ καλοῦντος ὑμᾶς
  choice: qui vous appelle
  rationale: Le présent rend naturellement le participe présent grec et laisse ouverte la portée temporelle de l’appel divin.
- source_word: εἰς τὴν ἑαυτοῦ βασιλείαν καὶ δόξαν
  choice: à son propre royaume et à sa gloire
  rationale: « Son propre » restitue l’emphase de ἑαυτοῦ. Les deux noms restent coordonnés, sans préciser davantage la nature de leur relation.
theological_decisions:
- issue: Conserver ou expliciter la métaphore de περιπατεῖν
  choice: Conserver « marcher » dans le texte
  alternative: « vivre » ou « se conduire »
  rationale: La métaphore relie la conduite morale au cheminement de la vie et demeure intelligible en français biblique moderne; une note en donne le sens.
- issue: Portée temporelle de l’appel de Dieu
  choice: « qui vous appelle » au présent
  alternative: « qui vous a appelés » ou « qui est en train de vous appeler »
  rationale: Le présent français correspond au participe présent sans imposer une conception particulière du moment ou du mécanisme de l’appel.
- issue: Relation entre le royaume et la gloire
  choice: Maintenir deux compléments coordonnés
  alternative: Interpréter la gloire comme une qualité du royaume ou fusionner les deux réalités
  rationale: Le grec coordonne βασιλείαν et δόξαν sous une même préposition; la traduction préserve cette formulation sans résoudre la relation théologique entre les deux.
translation_notes:
  register: Français international moderne, naturel et digne. La structure participiale est conservée parce que le verset poursuit la phrase commencée auparavant. « Son propre royaume » maintient l’insistance du pronom réfléchi grec.
