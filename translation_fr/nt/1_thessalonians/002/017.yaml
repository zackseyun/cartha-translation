source:
  edition: SBLGNT
  text: Ἡμεῖς δέ, ἀδελφοί, ἀπορφανισθέντες ἀφ’ ὑμῶν πρὸς καιρὸν ὥρας, προσώπῳ οὐ καρδίᾳ, περισσοτέρως ἐσπουδάσαμεν τὸ πρόσωπον ὑμῶν ἰδεῖν ἐν πολλῇ ἐπιθυμίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/017.yaml
  text: But we[a], brothers, having been torn away from you for a short time—in person, not in heart—were all the more eager, with great longing[b], to see your face.
translation:
  language: fr
  text: Mais nous, frères[a], après avoir été arrachés à vous[b] pour peu de temps — physiquement, mais non dans notre cœur —, nous nous sommes d’autant plus empressés de voir votre visage, avec un grand désir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ici, « frères » est la forme d’adresse employée par Paul ; dans ce contexte, elle désigne vraisemblablement l’ensemble de la communauté croyante, femmes comprises.
    reason: cultural_note
  - marker: b
    text: 'Plus littéralement : « rendus orphelins de vous ». Le grec emploie une vive image de deuil et de privation pour décrire cette séparation.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἡμεῖς δέ
  choice: Mais nous
  rationale: Le pronom exprimé est emphatique, et δέ marque ici une légère opposition ou transition. « Mais nous » restitue les deux sans alourdir la phrase.
- source_word: ἀδελφοί
  choice: frères
  rationale: Le vocatif grec est grammaticalement masculin. « Frères » en conserve la forme, tandis qu’une note précise sa portée vraisemblablement communautaire.
- source_word: ἀπορφανισθέντες ἀφ’ ὑμῶν
  choice: après avoir été arrachés à vous
  rationale: Le verbe évoque littéralement le fait d’être rendu orphelin ou privé d’un proche. « Arrachés à vous » exprime la séparation douloureuse et subie sans employer en français une image potentiellement trompeuse.
- source_word: πρὸς καιρὸν ὥρας
  choice: pour un court moment
  rationale: Cette expression idiomatique désigne une brève période, et non nécessairement une heure au sens strict.
- source_word: προσώπῳ οὐ καρδίᾳ
  choice: en personne, non de cœur
  rationale: Le contraste porte sur l’absence physique opposée au maintien de l’attachement intérieur. Cette formulation est concise et naturelle en français.
- source_word: περισσοτέρως ἐσπουδάσαμεν
  choice: nous avons redoublé d’efforts
  rationale: Le verbe peut exprimer aussi bien l’empressement que l’effort diligent; avec l’adverbe comparatif, « redoublé d’efforts » rend clairement l’intensification.
- source_word: τὸ πρόσωπον ὑμῶν ἰδεῖν
  choice: revoir votre visage
  rationale: Le texte dit littéralement « voir votre visage ». « Revoir » convient à des personnes déjà connues et conserve l’image personnelle et concrète du visage.
- source_word: ἐν πολλῇ ἐπιθυμίᾳ
  choice: dans notre profond désir
  rationale: Dans ce contexte, ἐπιθυμία désigne un désir intense et affectueux, sans connotation négative.
theological_decisions:
- issue: Portée de l’adresse ἀδελφοί
  choice: frères dans le texte, avec une note inclusive
  alternative: frères et sœurs
  rationale: La traduction conserve la forme masculine du grec sans exclure implicitement les femmes de l’assemblée; la note explicite la portée communautaire probable.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve le contraste entre présence physique et attachement intérieur, ainsi que l’image concrète du visage, tout en rendant naturellement l’intensité affective et l’effort exprimés par le grec.
