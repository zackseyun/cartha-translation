id: 1TH.2.15
reference: 1 Thessalonians 2:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τῶν καὶ τὸν κύριον ἀποκτεινάντων Ἰησοῦν καὶ ⸀τοὺς προφήτας καὶ ἡμᾶς ἐκδιωξάντων, καὶ θεῷ μὴ ἀρεσκόντων, καὶ πᾶσιν ἀνθρώποις ἐναντίων,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/015.yaml
  text: who also killed the Lord Jesus and the prophets[a], and drove us out, and are not pleasing to God, and are hostile to all people[c][b],
translation:
  language: fr
  text: qui ont aussi tué le Seigneur Jésus et les prophètes[a], qui nous ont chassés[b], qui ne plaisent pas à Dieu et qui sont hostiles à tous les êtres humains[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « mis à mort le Seigneur Jésus et les prophètes ».'
    reason: lexical_alternative
  - marker: b
    text: Le verbe signifie plus précisément « chasser » ou « expulser » que, de manière générale, « persécuter ».
    reason: lexical_alternative
  - marker: c
    text: Cette description poursuit grammaticalement celle du groupe mentionné au verset précédent ; elle ne doit pas être comprise comme une affirmation globale au sujet de tous les Juifs, en tout temps et en tout lieu.
    reason: cultural_note
lexical_decisions:
- source_word: ἀποκτεινάντων
  choice: ont tué
  rationale: Le participe aoriste signifie « tuer » ou « mettre à mort ». « Ont tué » est naturel et n’ajoute pas la notion d’intention portée par « assassiner ».
- source_word: κύριον Ἰησοῦν
  choice: le Seigneur Jésus
  rationale: « Seigneur » rend le titre christologique κύριος, et « Jésus » suit la forme française usuelle du nom.
- source_word: τοὺς προφήτας
  choice: les prophètes
  rationale: Rendu courant qui conserve l’article et renvoie vraisemblablement à la lignée reconnue des prophètes.
- source_word: ἐκδιωξάντων
  choice: nous ont chassés
  rationale: Le verbe désigne l’action de chasser ou d’expulser et est plus précis que le sens général de « persécuter ».
- source_word: θεῷ μὴ ἀρεσκόντων
  choice: ne plaisent pas à Dieu
  rationale: Cette formulation française naturelle conserve la valeur présente et descriptive du participe.
- source_word: πᾶσιν ἀνθρώποις ἐναντίων
  choice: sont hostiles à tous les êtres humains
  rationale: « Hostiles à » exprime naturellement l’opposition marquée par ἐναντίος. « Êtres humains » rend le pluriel générique sans le limiter aux hommes de sexe masculin.
- source_word: τῶν ... ἀποκτεινάντων ... ἐκδιωξάντων ... ἀρεσκόντων ... ἐναντίων
  choice: qui ont aussi tué ... qui nous ont chassés ... qui ne plaisent pas ... et qui sont hostiles
  rationale: La série de relatives restitue clairement en français la chaîne de participes grecs au génitif et son lien avec l’antécédent du verset précédent.
- source_word: καὶ
  choice: aussi / et
  rationale: Le premier καί marque l’ajout (« aussi »), tandis que les suivants structurent l’accumulation des griefs.
theological_decisions:
- issue: Référence de la description participiale
  choice: La description continue grammaticalement celle du groupe mentionné au verset précédent.
  alternative: Une condamnation générale de tous les Juifs de toutes les époques.
  rationale: L’article grec au génitif et la chaîne de participes reprennent l’antécédent de 2.14. La traduction maintient ce lien sans universaliser l’énoncé.
translation_notes:
  register: Français international moderne, digne et direct. La répétition de « qui » clarifie la longue chaîne participiale, tandis que la ponctuation finale conserve le fait que le verset se poursuit en 2.16.
