source:
  edition: SBLGNT
  text: τίς γὰρ ἡμῶν ἐλπὶς ἢ χαρὰ ἢ στέφανος καυχήσεως— ἢ οὐχὶ καὶ ὑμεῖς— ἔμπροσθεν τοῦ κυρίου ἡμῶν Ἰησοῦ ἐν τῇ αὐτοῦ παρουσίᾳ;
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/019.yaml
  text: For what is our hope or joy or crown of boasting—is it not indeed you?—before our Lord Jesus at his coming[a].
translation:
  language: fr
  text: Car quelle est notre espérance, notre joie ou la couronne qui fait notre fierté devant notre Seigneur Jésus lors de sa venue, sinon vous aussi[a] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « lors de sa présence » ou « lors de son arrivée ». Le grec παρουσία peut désigner la présence ou l’arrivée ; dans ce contexte, il renvoie à la venue future du Seigneur Jésus.
    reason: Alternative lexicale
lexical_decisions:
- source_word: τίς
  choice: qui
  rationale: Le pronom peut signifier « qui » ou « quoi ». Comme la réponse explicite est « vous », le français emploie naturellement « qui », tout en conservant l’identification rhétorique des destinataires à l’espérance, à la joie et à la couronne de Paul.
- source_word: γὰρ
  choice: car
  rationale: « Car » maintient le lien explicatif avec le contexte précédent sans l’effacer.
- source_word: ἐλπὶς
  choice: espérance
  rationale: « Espérance » est le terme français courant dans le registre paulinien et exprime ici une attente confiante.
- source_word: χαρὰ
  choice: joie
  rationale: Traduction directe, naturelle et fidèle à la force affective du terme.
- source_word: στέφανος καυχήσεως
  choice: la couronne qui fait notre fierté
  rationale: Cette formulation conserve l’image de la couronne honorifique ou victorieuse et rend καύχησις dans un français naturel. Elle évite le tour raide « couronne de vantardise » sans transformer la couronne en simple joie.
- source_word: οὐχὶ καὶ ὑμεῖς
  choice: N’est-ce pas vous, vous aussi
  rationale: La question appelle une réponse affirmative. La reprise « vous, vous aussi » exprime à la fois l’insistance de οὐχί et la valeur additive possible de καί.
- source_word: ἔμπροσθεν
  choice: devant
  rationale: Rendu bref et idiomatique qui exprime la présence devant le Seigneur.
- source_word: κυρίου
  choice: Seigneur
  rationale: Titre français standard de κύριος dans la confession christologique du Nouveau Testament.
- source_word: παρουσίᾳ
  choice: lors de sa venue
  rationale: Dans ce contexte eschatologique, « venue » communique clairement l’arrivée future de Jésus, tandis que les sens lexicaux « présence » et « arrivée » sont signalés en note.
theological_decisions:
- issue: Sens eschatologique de παρουσίᾳ
  choice: lors de sa venue
  alternative: lors de sa présence ou de son arrivée
  rationale: Le contexte vise la venue future du Seigneur Jésus. Toutefois, παρουσία peut désigner la présence aussi bien que l’arrivée ; la note préserve cette amplitude sémantique sans imposer une précision doctrinale étrangère au texte.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve la question rhétorique et l’image de la couronne, tout en évitant des calques peu naturels comme « couronne de vantardise ».
