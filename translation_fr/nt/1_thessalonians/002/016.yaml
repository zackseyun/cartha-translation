source:
  edition: SBLGNT
  text: κωλυόντων ἡμᾶς τοῖς ἔθνεσιν λαλῆσαι ἵνα σωθῶσιν, εἰς τὸ ἀναπληρῶσαι αὐτῶν τὰς ἁμαρτίας πάντοτε. ἔφθασεν δὲ ἐπ’ αὐτοὺς ἡ ⸀ὀργὴ εἰς τέλος.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/016.yaml
  text: by hindering us from speaking to the Gentiles so that they may be saved[a], so as always to fill up the measure of their sins[b]. But wrath has come upon them at last.
translation:
  language: fr
  text: en nous empêchant de parler aux non-Juifs pour qu’ils soient sauvés, de sorte qu’ils ne cessent ainsi de combler la mesure de leurs péchés. Mais la colère les a finalement atteints.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « complètement », « pleinement » ou « jusqu’au bout ». L’expression grecque peut indiquer soit l’aboutissement, soit le degré complet. La « colère » renvoie vraisemblablement au jugement divin, sans que Paul précise ici s’il s’agit d’un jugement historique déjà présent, du jugement final, ou des deux.
    reason: lexical_alternative_and_alternative_reading
lexical_decisions:
- source_word: κωλυόντων
  choice: en nous empêchant
  rationale: Le participe présent poursuit la description précédente et exprime une entrave continue, sans suggérer nécessairement une interdiction juridique.
- source_word: τοῖς ἔθνεσιν
  choice: aux non-Juifs
  rationale: Dans ce contexte paulinien, le terme désigne les personnes qui ne sont pas juives plutôt que des nations au sens politique. « Non-Juifs » est clair en français international courant.
- source_word: λαλῆσαι
  choice: de parler
  rationale: L’infinitif dépend de « empêchant »; la formulation directe conserve le sens du grec, tandis que le contexte précise qu’il s’agit de l’annonce de l’Évangile.
- source_word: ἵνα σωθῶσιν
  choice: pour qu’ils soient sauvés
  rationale: La proposition de but et la voix passive sont conservées sans préciser davantage l’agent ni restreindre la portée du salut.
- source_word: εἰς τὸ ἀναπληρῶσαι
  choice: de sorte qu’ils… mettent le comble
  rationale: « De sorte que » rend ici la conséquence sans affirmer que compléter leurs péchés constituait leur intention consciente.
- source_word: ἀναπληρῶσαι … τὰς ἁμαρτίας
  choice: mettre le comble à leurs péchés
  rationale: Cette expression française naturelle traduit l’idée de porter les péchés à leur pleine mesure, sans devoir ajouter explicitement le mot « mesure », absent du grec.
- source_word: πάντοτε
  choice: ne cessent de
  rationale: La tournure idiomatique exprime la continuité ou la répétition persistante indiquée par l’adverbe.
- source_word: ἔφθασεν … ἐπ’ αὐτούς
  choice: les a atteints
  rationale: Le passé composé rend l’action accomplie avec sa pertinence présente; « atteindre » conserve l’idée d’une colère arrivée sur eux sans identifier un événement précis.
- source_word: ὀργή
  choice: la colère
  rationale: « Colère » est le correspondant français direct et théologiquement fort; le contexte suggère la colère divine, mais le texte ne nomme pas explicitement Dieu dans cette proposition.
- source_word: εἰς τέλος
  choice: finalement
  rationale: Ce choix rend naturellement la valeur temporelle ou culminative possible de l’expression; les autres sens plausibles sont signalés en note.
theological_decisions:
- issue: Référent et portée de « la colère »
  choice: Conserver « la colère » sans préciser dans le corps du texte la forme du jugement visé.
  alternative: Identifier explicitement un jugement historique, le jugement final, ou les deux.
  rationale: Le contexte laisse entendre la colère divine, mais ce verset ne précise ni l’événement ni l’horizon temporel exact; la traduction maintient cette tension.
- issue: Valeur de εἰς τὸ ἀναπληρῶσαι
  choice: Conséquence exprimée par « de sorte que ».
  alternative: 'But explicite: « afin de mettre le comble à leurs péchés ».'
  rationale: La lecture consécutive évite de présenter l’accumulation des péchés comme leur objectif conscient, tout en respectant la construction grecque.
- issue: Sens de εἰς τέλος
  choice: 'Valeur culminative ou temporelle: « finalement ».'
  alternative: 'Valeur intensive ou exhaustive: « complètement », « pleinement » ou « jusqu’au bout ».'
  rationale: L’expression grecque admet plusieurs nuances; le texte principal retient une formulation française naturelle et la note préserve l’ambiguïté lexicale.
translation_notes:
  register: Français moderne, international et digne. « Non-Juifs » privilégie la compréhension immédiate par rapport au terme plus spécialisé « païens ». « Mettre le comble à leurs péchés » restitue naturellement l’image de la plénitude. Le marqueur [a] figure dans le texte principal.
