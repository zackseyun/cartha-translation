  source_fidelity: Le texte rend correctement καθάπερ οἴδατε (« comme vous le savez »), la force distributive de ἕνα ἕκαστον ὑμῶν (« chacun de vous »), ainsi que l’image d’un père et de ses propres enfants. L’action verbale est bien absente de l’extrait grec et doit être fournie avec retenue à partir du contexte. « Nous avons agi auprès de » demeure suffisamment général sans réduire cette action aux exhortations, encouragements ou appels du verset suivant.
  naturalness: '« Agir envers » est possible, mais « agir auprès de » est plus idiomatique dans ce contexte pastoral et s’accorde mieux avec le parallèle « un père auprès de ses propres enfants ». La note actuelle n’est pas une citation française satisfaisante de l’ellipse : elle omet « le » dans « vous le savez » et « comment » donne une suite inutilement bancale. Une citation fragmentaire explicitement signalée rend mieux la syntaxe grecque.'
  terminology: « Père », « enfants » et « ses propres » sont exacts, naturels et conservent respectivement la comparaison, l’inclusivité de τέκνα et l’insistance réflexive de ἑαυτοῦ.
