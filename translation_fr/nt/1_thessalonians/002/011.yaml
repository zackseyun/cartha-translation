translation:
  language: fr
  text: Comme vous le savez, nous avons agi auprès de chacun de vous comme un père auprès de ses propres enfants[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « Comme vous le savez : chacun de vous, comme un père ses propres enfants. » La proposition grecque est elliptique et reçoit du contexte environnant son plein sens verbal.'
    reason: alternative lexicale et précision syntaxique
lexical_decisions:
- source_word: καθάπερ
  choice: Comme
  rationale: Introduit la comparaison en faisant appel à ce que les Thessaloniciens savent déjà; « Comme vous le savez » est naturel en français et conserve cette valeur comparative.
- source_word: οἴδατε
  choice: vous le savez
  rationale: 'Bien que la forme grecque soit historiquement un parfait, οἶδα a normalement un sens présent: « savoir ».'
- source_word: ὡς (première occurrence)
  choice: '[intégré à la tournure « Comme vous le savez »]'
  rationale: Ce premier ὡς introduit ce que les destinataires savent. La syntaxe française exprime naturellement ce rapport avec la proposition complétée par le verbe implicite.
- source_word: ἕνα ἕκαστον ὑμῶν
  choice: chacun de vous
  rationale: Cette formulation garde la force distributive de l’expression grecque et souligne l’attention accordée individuellement à chaque personne.
- source_word: ὡς (seconde occurrence)
  choice: comme
  rationale: Marque directement la comparaison entre la conduite apostolique et celle d’un père.
- source_word: πατὴρ
  choice: un père
  rationale: Le nom sans article a ici une valeur qualitative dans une comparaison; l’article indéfini convient en français.
- source_word: τέκνα
  choice: enfants
  rationale: Terme de parenté général qui n’est pas limité aux fils et qui préserve l’image familiale.
- source_word: ἑαυτοῦ
  choice: ses propres
  rationale: Le pronom réfléchi met l’accent sur le fait qu’il s’agit des enfants du père lui-même.
- source_word: '[idée verbale elliptique fournie par le contexte]'
  choice: nous avons agi envers
  rationale: Le grec est elliptique et dépend de la phrase environnante. Cette expression générale rend la relation pastorale sans la réduire à une seule des actions précisées dans le contexte.
theological_decisions:
- issue: Restitution de l’action verbale implicite dans une proposition elliptique
  choice: Employer le verbe général « nous avons agi envers chacun de vous »
  alternative: Conserver une formulation fragmentaire, ou préciser « nous avons exhorté chacun de vous »
  rationale: Le texte grec de ce segment ne constitue pas à lui seul une phrase complète. Une formulation générale produit un français intelligible tout en évitant de privilégier une seule action pastorale parmi celles que présente la phrase complète.
translation_notes:
  register: Français international moderne, naturel et digne. La répétition de « comme » reflète les deux comparaisons du grec sans alourdir excessivement la phrase. Le verbe fourni est volontairement général afin de préserver l’ellipse et la portée du contexte.
