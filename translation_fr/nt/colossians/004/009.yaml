  text: σὺν Ὀνησίμῳ τῷ πιστῷ καὶ ἀγαπητῷ ἀδελφῷ, ὅς ἐστιν ἐξ ὑμῶν· πάντα ὑμῖν γνωρίσουσιν τὰ ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/009.yaml
  text: together with Onesimus[a], the faithful and beloved brother, who is one of you[b]. They will make known to you everything here.
translation:
  language: fr
  text: avec Onésime, le frère fidèle et bien-aimé, qui est des vôtres[a]. Ils vous feront connaître tout ce qui se passe ici[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qui est de chez vous ».
    reason: lexical_alternative
  - marker: b
    text: Ou « tout ce qui est ici ».
    reason: lexical_alternative
lexical_decisions:
- source_word: σὺν Ὀνησίμῳ
  choice: avec Onésime
  rationale: 'σύν marque l’accompagnement : Onésime accompagne Tychique, mentionné au verset précédent. « Avec » est naturel en français et suffit à exprimer ce lien.'
- source_word: πιστῷ καὶ ἀγαπητῷ ἀδελφῷ
  choice: le frère fidèle et bien-aimé
  rationale: « Frère » conserve le langage familial de la communauté chrétienne. « Fidèle » rend le sens de loyauté ou de fiabilité de πιστός, tandis que « bien-aimé » préserve la chaleur de ἀγαπητός.
- source_word: ὅς ἐστιν ἐξ ὑμῶν
  choice: qui est des vôtres
  rationale: Cette formulation française naturelle exprime l’appartenance d’Onésime à la communauté destinataire, tout en laissant ouverte la nuance d’origine portée par ἐξ.
- source_word: γνωρίσουσιν
  choice: feront connaître
  rationale: Le futur « feront connaître » suit de près γνωρίσουσιν et garde l’idée de communiquer ou de révéler des informations.
- source_word: πάντα … τὰ ὧδε
  choice: tout ce qui se passe ici
  rationale: L’expression grecque désigne globalement les réalités ou les affaires du lieu où se trouve Paul. Cette tournure est claire et idiomatique en français moderne, sans préciser davantage la nature de la situation.
theological_decisions:
- issue: Sens ecclésial de ἀδελφῷ
  choice: frère
  alternative: frère dans la foi
  rationale: Le contexte indique un compagnon croyant, mais le grec dit simplement « frère ». La traduction conserve donc la métaphore familiale sans explicitation doctrinale.
- issue: Portée de ἐξ ὑμῶν
  choice: qui est des vôtres
  alternative: qui est de chez vous
  rationale: Le choix principal souligne l’appartenance d’Onésime à la communauté colossienne sans importer dans ce verset des précisions sociales tirées de la lettre à Philémon. La note préserve la possible nuance d’origine.
- issue: Nature de τὰ ὧδε
  choice: tout ce qui se passe ici
  alternative: toutes les choses d’ici
  rationale: Le grec reste général sur les réalités concernées. La traduction française rend naturellement la situation locale sans l’identifier plus précisément.
translation_notes:
  register: Français international moderne, clair et digne. La phrase commence par une minuscule parce qu’elle poursuit syntaxiquement le verset précédent. « Bien-aimé » maintient la chaleur du registre épistolaire chrétien sans archaïsme excessif.
