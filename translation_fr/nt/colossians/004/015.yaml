source:
  edition: SBLGNT
  text: ἀσπάσασθε τοὺς ἐν Λαοδικείᾳ ἀδελφοὺς καὶ ⸂Νύμφαν καὶ τὴν κατ’ οἶκον αὐτῆς⸃ ἐκκλησίαν.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/015.yaml
  text: Greet the brothers in Laodicea[a], and Nympha and the church in her house.
translation:
  language: fr
  text: Saluez les frères et sœurs qui sont à Laodicée, ainsi que Nympha et l’Église dans sa maison.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Certains manuscrits lisent « Nymphas » et emploient le pronom masculin : « l’Église dans sa maison » ; d’autres lisent : « dans leur maison ».'
    reason: textual_variant
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: Saluez
  rationale: L’impératif aoriste moyen, à la deuxième personne du pluriel, exprime ici une demande directe de transmettre des salutations. « Saluez » est naturel et fidèle.
- source_word: τοὺς ἐν Λαοδικείᾳ ἀδελφοὺς
  choice: les frères et sœurs qui sont à Laodicée
  rationale: Bien que ἀδελφοὺς soit grammaticalement masculin pluriel, le terme désigne couramment chez Paul l’ensemble des croyants, femmes et hommes. « Frères et sœurs » rend explicitement cette portée inclusive sans remplacer le lien familial par un terme plus abstrait.
- source_word: Νύμφαν
  choice: Nympha
  rationale: Le texte du SBLGNT porte Νύμφαν, compris le plus directement comme l’accusatif du nom féminin Nympha. La variante masculine est signalée en note.
- source_word: τὴν κατ’ οἶκον αὐτῆς ἐκκλησίαν
  choice: l’Église qui se réunit dans sa maison
  rationale: Dans cet idiome, κατ’ οἶκον désigne une communauté chrétienne rassemblée dans une maison. L’explicitation « qui se réunit » donne en français moderne le sens naturel de l’expression, tandis que αὐτῆς est rendu par « sa », renvoyant à Nympha.
- source_word: ἐκκλησίαν
  choice: l’Église
  rationale: Dans ce contexte paulinien, ἐκκλησία désigne la communauté chrétienne locale. « Église » est le terme français usuel et approprié.
theological_decisions:
- issue: Identité ou genre de Νύμφαν et pronom correspondant
  choice: Nympha… sa maison
  alternative: Nymphas… sa maison ; ou leur maison
  rationale: Le texte imprimé du SBLGNT soutient le nom féminin Nympha et le pronom féminin singulier αὐτῆς. Les variantes masculine et plurielle sont toutefois authentiquement attestées dans la tradition manuscrite et sont donc conservées en note plutôt que résolues silencieusement.
translation_notes:
  register: Français international moderne, naturel et digne. « Frères et sœurs » explicite la valeur inclusive habituelle de ἀδελφοί dans ce contexte. La majuscule à « Église » suit l’usage français lorsqu’il s’agit de la communauté chrétienne, sans suggérer ici une institution particulière.
