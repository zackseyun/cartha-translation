source:
  edition: SBLGNT
  text: ὃν ἔπεμψα πρὸς ὑμᾶς εἰς αὐτὸ τοῦτο ἵνα ⸀γνῶτε τὰ περὶ ⸀ἡμῶν καὶ παρακαλέσῃ τὰς καρδίας ὑμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/008.yaml
  text: 'I sent him to you for this very purpose: that you may know how we are[a], and that he may encourage your hearts.'
translation:
  language: fr
  text: 'Je vous l’ai envoyé dans ce but précis : que vous sachiez comment nous allons[a] et qu’il encourage vos cœurs.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Certains manuscrits portent : « que nous sachions comment vous allez ».'
    reason: textual_variant
lexical_decisions:
- source_word: ὃν ἔπεμψα πρὸς ὑμᾶς
  choice: Je vous l’ai envoyé
  rationale: Le pronom masculin renvoie à Tychique. Le passé composé rend naturellement l’aoriste dans une lettre, tandis que « vous » exprime avec fluidité la destination marquée par πρὸς ὑμᾶς.
- source_word: εἰς αὐτὸ τοῦτο
  choice: dans ce but précis
  rationale: Cette tournure exprime un but nettement déterminé et emphatique. « Précis » restitue la force de αὐτό sans lourdeur.
- source_word: ἵνα γνῶτε τὰ περὶ ἡμῶν
  choice: que vous sachiez comment nous allons
  rationale: La formulation française est naturelle et personnelle, tout en rendant l’idée de prendre connaissance de la situation de Paul et de ses compagnons.
- source_word: παρακαλέσῃ
  choice: qu’il encourage
  rationale: Dans ce contexte, παρακαλέω évoque le réconfort et l’affermissement apportés par Tychique. « Encourager » conserve cette amplitude mieux qu’un terme limité à l’exhortation ou à la consolation.
- source_word: τὰς καρδίας ὑμῶν
  choice: vos cœurs
  rationale: La traduction directe préserve l’image biblique du cœur comme siège de la vie intérieure, sans la réduire à une simple émotion.
theological_decisions:
- issue: Variante textuelle concernant les personnes qui doivent recevoir des nouvelles
  choice: 'Le texte principal suit γνῶτε τὰ περὶ ἡμῶν : « que vous sachiez comment nous allons ».'
  alternative: 'Certains manuscrits présentent une leçon signifiant : « que nous sachions comment vous allez ».'
  rationale: La leçon du SBLGNT est retenue dans le texte principal. Comme la variante inverse le sens de la circulation des nouvelles, elle est signalée en note sans chercher à harmoniser les deux lectures.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la structure de but du grec, avec un ordre pronominal idiomatique en français. Le pluriel « vos cœurs » maintient la forme et l’image du texte source.
