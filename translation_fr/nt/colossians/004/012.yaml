id: COL.4.12
reference: Colossians 4:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀσπάζεται ὑμᾶς Ἐπαφρᾶς ὁ ἐξ ὑμῶν, δοῦλος ⸀Χριστοῦ, πάντοτε ἀγωνιζόμενος ὑπὲρ ὑμῶν ἐν ταῖς προσευχαῖς, ἵνα ⸀σταθῆτε τέλειοι καὶ ⸀πεπληροφορημένοι ἐν παντὶ θελήματι τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/012.yaml
  text: Epaphras[a], who is one of you, greets you—a servant of Messiah, always striving for you in his prayers[b], so that you may stand mature and fully assured in all the will of God.
translation:
  language: fr
  text: Épaphras, qui est des vôtres et esclave du Messie[a], vous salue. Il lutte sans cesse pour vous dans ses prières, afin que vous demeuriez fermes, parvenus à maturité et pleinement convaincus[b] dans toute la volonté de Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot grec rendu par « Messie » est traditionnellement traduit par « Christ ».
    reason: alternative_reading
  - marker: b
    text: Ou « pleinement assurés », voire « pleinement affermis ». Le grec peut exprimer une pleine certitude ou un état pleinement établi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπάζεται
  choice: vous salue
  rationale: Formule épistolaire naturelle en français, qui conserve la valeur personnelle de la salutation.
- source_word: ὁ ἐξ ὑμῶν
  choice: qui est des vôtres
  rationale: Expression française idiomatique indiquant qu’Épaphras appartient à la communauté colossienne.
- source_word: δοῦλος
  choice: esclave
  rationale: Le terme exprime ici l’appartenance entière et l’allégeance au Messie; « esclave » en préserve la force plus nettement que « serviteur ».
- source_word: Χριστοῦ
  choice: du Messie
  rationale: Χριστός est rendu selon le sens de son titre, sans ajouter le nom « Jésus », absent de ce verset.
- source_word: πάντοτε ἀγωνιζόμενος
  choice: il lutte sans cesse
  rationale: Cette formulation restitue l’effort intense évoqué par le participe et la continuité exprimée par πάντοτε.
- source_word: ἐν ταῖς προσευχαῖς
  choice: dans ses prières
  rationale: Le possessif explicite naturellement en français qu’il s’agit des prières d’Épaphras, tandis que le pluriel est conservé.
- source_word: ἵνα σταθῆτε
  choice: afin que vous vous teniez debout
  rationale: La formulation conserve l’image verbale de la station debout sans ajouter explicitement l’idée de fermeté.
- source_word: τέλειοι
  choice: parvenus à maturité
  rationale: Dans ce contexte, le terme désigne l’accomplissement ou la maturité plutôt qu’une perfection sans défaut.
- source_word: πεπληροφορημένοι
  choice: pleinement convaincus
  rationale: Le participe décrit vraisemblablement un état de pleine conviction; une note maintient l’autre possibilité lexicale, celle d’un affermissement complet.
- source_word: ἐν παντὶ θελήματι τοῦ θεοῦ
  choice: dans toute la volonté de Dieu
  rationale: Le rendu relativement formel préserve l’ampleur et l’ambiguïté de la préposition ἐν sans réduire l’expression à la connaissance ou à l’accomplissement de la volonté divine.
theological_decisions:
- issue: Sens et rendu de Χριστοῦ
  choice: Messie
  alternative: Christ
  rationale: Le choix traduit le sens du titre grec plutôt que de le traiter uniquement comme un nom propre; la forme traditionnelle française est signalée en note.
- issue: Force de δοῦλος
  choice: esclave
  alternative: serviteur
  rationale: Dans cette formule d’appartenance religieuse, « esclave » maintient l’idée forte d’une dépendance et d’une allégeance totales, sans atténuer le terme grec.
- issue: Sens de πεπληροφορημένοι
  choice: pleinement convaincus
  alternative: pleinement affermis / pleinement assurés
  rationale: Le sens de pleine conviction est retenu dans le texte, mais la forme grecque peut aussi évoquer un état pleinement établi; cette tension est conservée dans la note.
translation_notes:
  register: Français international actuel, digne et accessible. La syntaxe est légèrement soutenue afin de conserver l’image de « se tenir debout » et l’expression ample « dans toute la volonté de Dieu ». « Esclave » est volontairement fort, conformément au terme grec.
