id: COL.4.3
reference: Colossians 4:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: προσευχόμενοι ἅμα καὶ περὶ ἡμῶν, ἵνα ὁ θεὸς ἀνοίξῃ ἡμῖν θύραν τοῦ λόγου, λαλῆσαι τὸ μυστήριον τοῦ Χριστοῦ, δι’ ὃ καὶ δέδεμαι,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/003.yaml
  text: while also praying for us[a], that God may open to us a door for the word, to speak the mystery of Messiah, because of which I am also bound[d][c][b],
translation:
  language: fr
  text: Priez aussi pour nous, afin que Dieu nous ouvre une porte pour la Parole[a], pour annoncer le mystère du Messie, à cause duquel je suis aussi enchaîné[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une porte pour le message », c’est-à-dire une occasion de l’annoncer.
    reason: La construction θύραν τοῦ λόγου est métaphorique ; λόγος peut ici être rendu par « Parole » ou « message ».
  - marker: b
    text: Ou « à cause duquel je suis aussi prisonnier » ; littéralement « je suis aussi lié ».
    reason: Le parfait passif δέδεμαι exprime l’état de captivité de Paul, avec l’image concrète du lien ou des chaînes.
lexical_decisions:
- source_word: προσευχόμενοι ἅμα καὶ περὶ ἡμῶν
  choice: priez en même temps aussi pour nous
  rationale: Le participe poursuit l’exhortation du verset précédent. L’impératif français explicite naturellement ce lien, tandis que « en même temps aussi » conserve les valeurs de simultanéité et d’ajout de ἅμα καὶ.
- source_word: ἵνα ὁ θεὸς ἀνοίξῃ ἡμῖν θύραν τοῦ λόγου
  choice: afin que Dieu nous ouvre une porte pour la Parole
  rationale: « Afin que » rend la visée de la prière; la métaphore de la porte est conservée. Dans ce contexte paulinien, λόγος désigne la Parole proclamée, d’où la majuscule éditoriale sans en faire une personne.
- source_word: λαλῆσαι
  choice: pour que nous annoncions
  rationale: L’infinitif exprime ici le but de l’ouverture demandée. « Annoncer » est plus idiomatique que « parler le mystère » en français et convient à la communication publique du message, sans imposer le terme technique « prêcher ».
- source_word: τὸ μυστήριον τοῦ Χριστοῦ
  choice: le mystère du Messie
  rationale: « Mystère » préserve le vocabulaire paulinien d’un dessein divin autrefois caché et désormais révélé. Χριστός garde ici sa valeur de titre, rendue par « Messie ».
- source_word: δι’ ὃ καὶ δέδεμαι
  choice: à cause duquel je suis aussi enchaîné
  rationale: διά avec l’accusatif exprime la cause. Le parfait passif décrit l’état présent résultant de l’arrestation; « enchaîné » communique clairement l’emprisonnement tout en gardant l’image du lien.
theological_decisions:
- issue: Valeur de Χριστοῦ
  choice: du Messie
  alternative: du Christ
  rationale: Dans « le mystère du Χριστός », le terme demeure porteur de sa valeur titulaire. « Messie » la rend explicitement sans ajouter une interprétation confessionnelle.
- issue: Référent de δι’ ὃ
  choice: à cause duquel
  alternative: à cause de quoi
  rationale: Le relatif neutre peut reprendre le « mystère » ou, plus largement, son annonce. Le relatif français accordé à « mystère » suit l’antécédent grammatical le plus proche tout en laissant entendre que Paul est emprisonné à cause de ce mystère proclamé.
- issue: Métaphore de θύραν τοῦ λόγου
  choice: une porte pour la Parole
  alternative: une occasion d’annoncer la Parole
  rationale: La traduction conserve l’image ouverte du texte grec plutôt que de la réduire à la seule notion d’occasion.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase reste rattachée à l’exhortation du verset précédent. La métaphore de la porte et le terme paulinien « mystère » sont préservés; les formulations françaises évitent toutefois les calques peu naturels comme « parler le mystère ».
