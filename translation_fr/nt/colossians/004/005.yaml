id: COL.4.5
reference: Colossians 4:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἐν σοφίᾳ περιπατεῖτε πρὸς τοὺς ἔξω, τὸν καιρὸν ἐξαγοραζόμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/005.yaml
  text: Walk in wisdom toward outsiders[b][a], making the most of the time.
translation:
  language: fr
  text: Conduisez-vous avec sagesse envers ceux du dehors[a], en mettant pleinement à profit le moment favorable[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les gens de l’extérieur », c’est-à-dire les personnes qui ne font pas partie de la communauté croyante.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « en rachetant le temps » ; le sens est de tirer pleinement parti de l’occasion.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν σοφίᾳ
  choice: avec sagesse
  rationale: Cette tournure exprime naturellement en français la manière de se conduire tout en conservant le nom « sagesse » et sa portée éthique.
- source_word: περιπατεῖτε
  choice: Conduisez-vous
  rationale: Le verbe grec emploie littéralement l’image de la marche, mais désigne ici la manière de vivre. « Conduisez-vous » restitue clairement cet emploi métaphorique dans un français actuel et digne.
- source_word: πρὸς τοὺς ἔξω
  choice: envers ceux du dehors
  rationale: πρός marque ici l’orientation de la conduite à l’égard d’autrui. « Ceux du dehors » conserve l’image spatiale du grec et désigne les personnes extérieures à la communauté croyante sans leur attribuer un jugement péjoratif.
- source_word: τὸν καιρόν
  choice: le moment favorable
  rationale: καιρός désigne moins le temps abstrait qu’un moment approprié ou une occasion propice. « Le moment favorable » conserve le singulier et rend cette nuance explicitement.
- source_word: ἐξαγοραζόμενοι
  choice: en mettant pleinement à profit
  rationale: Dans ce contexte, le participe invite à exploiter au mieux l’occasion. Cette formulation française naturelle communique le sens sans suggérer à tort le rachat théologique, tandis que l’image commerciale littérale est signalée en note.
theological_decisions:
- issue: Risque de donner à ἐξαγοραζόμενοι un sens théologique de rédemption
  choice: Une exhortation à tirer pleinement parti du moment favorable dans les rapports avec les non-croyants
  alternative: « en rachetant le temps », formulation plus littérale susceptible d’évoquer la rédemption
  rationale: Ici, le verbe a une valeur idiomatique liée à l’usage optimal d’une occasion, et non à l’œuvre rédemptrice. La traduction évite donc d’introduire une affirmation doctrinale absente du contexte.
- issue: Identification de τοὺς ἔξω
  choice: Les personnes extérieures à la communauté croyante
  alternative: Des personnes simplement situées à l’extérieur d’un lieu
  rationale: L’expression grecque fonctionne comme une désignation sociale courante de ceux qui ne font pas partie de la communauté, tout en conservant une formulation qui n’ajoute aucune caractérisation doctrinale de ces personnes.
translation_notes:
  register: Français international moderne, clair et digne. « Conduisez-vous » rend idiomatiquement la métaphore grecque de la marche ; « ceux du dehors » conserve l’image de la limite communautaire sans employer le terme potentiellement plus dur « étrangers ». Les deux appels de note figurent dans le texte principal.
