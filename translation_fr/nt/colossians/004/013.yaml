  text: μαρτυρῶ γὰρ αὐτῷ ὅτι ἔχει ⸂πολὺν πόνον⸃ ὑπὲρ ὑμῶν καὶ τῶν ἐν Λαοδικείᾳ καὶ τῶν ἐν Ἱεραπόλει.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/013.yaml
  text: For I testify for him that he has great labor for you and for those in Laodicea and those in Hierapolis[a].
translation:
  language: fr
  text: 'Car je lui rends ce témoignage : il se donne beaucoup de peine pour vous, pour ceux de Laodicée et pour ceux de Hiérapolis[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « déploie de grands efforts », « se préoccupe beaucoup » ou « éprouve une profonde angoisse ». Le terme grec peut désigner un labeur pénible et, par extension dans ce contexte, une vive préoccupation.
    reason: lexical_alternative
lexical_decisions:
- source_word: μαρτυρῶ γὰρ αὐτῷ
  choice: Car je lui rends ce témoignage
  rationale: Cette tournure française naturelle conserve le lien explicatif de γάρ et rend le datif αὐτῷ comme désignant la personne en faveur de laquelle Paul témoigne, sans ajouter de nuance modale.
- source_word: ὅτι ἔχει πολὺν πόνον
  choice: il se donne beaucoup de peine
  rationale: L’expression idiomatique évoque un effort soutenu et pénible tout en laissant ouverte, comme le grec πόνος, la possibilité d’une vive préoccupation dans le contexte de la prière.
- source_word: ὑπὲρ ὑμῶν
  choice: pour vous
  rationale: Ὑπέρ exprime ici l’action ou la sollicitude en faveur des destinataires ; « pour » est clair et naturel.
- source_word: τῶν ἐν Λαοδικείᾳ
  choice: ceux de Laodicée
  rationale: Formulation française concise désignant les croyants qui se trouvent à Laodicée.
- source_word: τῶν ἐν Ἱεραπόλει
  choice: ceux de Hiérapolis
  rationale: Rendu parallèle au membre précédent, avec la forme française usuelle du nom de la ville.
theological_decisions:
- issue: Sens de πόνος dans le ministère d’Épaphras
  choice: se donne beaucoup de peine
  alternative: éprouve une grande préoccupation / une profonde angoisse
  rationale: Le contexte immédiat évoque le combat d’Épaphras dans la prière, ce qui autorise une nuance affective. Toutefois, πόνος désigne d’abord la peine, le labeur ou l’effort pénible ; la traduction retenue préserve ce sens large sans réduire le propos à une émotion particulière.
translation_notes:
  register: Français international moderne, digne et accessible. « Je lui rends ce témoignage » est une formulation courante et naturelle ; la répétition allégée de « pour » maintient clairement les trois groupes concernés.
