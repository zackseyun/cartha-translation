lexical_decisions:
- source_word: Τῇ προσευχῇ
  choice: dans la prière
  rationale: L’article grec désigne ici la prière comme pratique habituelle, sans imposer en français l’idée d’une prière particulière.
- source_word: προσκαρτερεῖτε
  choice: Persévérez
  rationale: L’impératif présent appelle à une pratique continue et assidue. « Persévérez » exprime clairement cette constance dans un français naturel.
- source_word: γρηγοροῦντες
  choice: en y restant vigilants
  rationale: 'Le participe indique la manière d’obéir au commandement principal : prier avec une attention éveillée. « Vigilants » évite de réduire le sens au fait de ne pas dormir.'
- source_word: ἐν αὐτῇ
  choice: y
  rationale: Le pronom renvoie naturellement à la prière et « y » conserve ce lien de façon concise et idiomatique.
- source_word: ἐν εὐχαριστίᾳ
  choice: avec reconnaissance
  rationale: La locution décrit l’attitude qui accompagne cette vigilance dans la prière. « Avec reconnaissance » rend le sens d’action de grâce dans un français courant et digne.
