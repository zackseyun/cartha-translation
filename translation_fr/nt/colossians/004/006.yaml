  text: ὁ λόγος ὑμῶν πάντοτε ἐν χάριτι, ἅλατι ἠρτυμένος, εἰδέναι πῶς δεῖ ὑμᾶς ἑνὶ ἑκάστῳ ἀποκρίνεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/006.yaml
  text: Let your speech always be with grace[a], seasoned with salt[b], so that you may know how you ought to answer each person.
translation:
  language: fr
  text: Que votre parole soit toujours pleine de grâce[a], assaisonnée de sel[b], afin que vous sachiez comment vous devez répondre à chacun[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « bienveillante ». L’expression peut désigner une parole marquée par la bonté, l’amabilité ou la faveur.'
    reason: lexical_alternative
  - marker: b
    text: « Assaisonnée de sel » est une image pour une parole appropriée, vivante et sage, qui n’est ni fade ni malsaine.
    reason: cultural_note
  - marker: c
    text: 'L’infinitif grec peut exprimer ici le but ou le résultat : « pour savoir comment… ». Le verbe grec rendu par « devez » indique ce qui est nécessaire ou approprié.'
    reason: translation_note
lexical_decisions:
- source_word: λόγος
  choice: parole
  rationale: Au singulier, le terme désigne ici la manière de parler des croyants plutôt qu’un mot isolé ou un message officiel. « Votre parole » est naturel dans un registre biblique moderne et s’accorde avec l’instruction concernant la réponse à donner.
- source_word: ἐν χάριτι
  choice: pleine de grâce
  rationale: Cette formulation française naturelle présente la grâce comme une qualité constante de la parole. Elle évoque la bienveillance sans exclure la résonance paulinienne plus large de la grâce.
- source_word: ἅλατι ἠρτυμένος
  choice: assaisonnée de sel
  rationale: 'La traduction conserve la métaphore grecque et la valeur résultative du participe parfait : la parole doit avoir durablement la qualité d’un discours bien assaisonné, approprié et judicieux.'
- source_word: εἰδέναι
  choice: afin que vous sachiez
  rationale: L’infinitif grec entretient un lien syntaxique difficile avec l’exhortation précédente. « Afin que vous sachiez » exprime naturellement en français une relation de but ou de résultat sans détacher les deux idées.
- source_word: δεῖ
  choice: comment répondre
  rationale: En français, la tournure « savoir comment répondre » exprime naturellement la manière appropriée ou requise de répondre. Traduire δεῖ séparément par « devoir » alourdirait ici la phrase.
- source_word: ἑνὶ ἑκάστῳ
  choice: à chacun
  rationale: L’expression distributive insiste sur une réponse adaptée à chaque personne. « À chacun » en restitue clairement et sobrement la portée individuelle.
- source_word: ἀποκρίνεσθαι
  choice: répondre
  rationale: Le verbe désigne directement l’action de donner une réponse dans un échange.
- source_word: πάντοτε
  choice: toujours
  rationale: Cet adverbe courant conserve la portée temporelle générale du grec.
theological_decisions:
- issue: Portée de χάρις dans l’expression ἐν χάριτι
  choice: Conserver « grâce » dans le texte et signaler la nuance de bienveillance en note.
  alternative: Traduire directement par « bienveillante » ou « aimable ».
  rationale: Dans ce contexte, χάρις qualifie probablement une parole agréable et bienveillante, mais le mot peut aussi garder une résonance théologique paulinienne. La traduction retenue ne tranche pas inutilement entre ces dimensions.
- issue: Fonction de l’infinitif εἰδέναι
  choice: 'Le rendre par une proposition de but ou de résultat : « afin que vous sachiez ».'
  alternative: '« Pour savoir », ou une nouvelle exhortation : « sachez comment… »'
  rationale: La syntaxe grecque est concise et difficile à classer avec certitude. Le rendu choisi relie étroitement la qualité de la parole à la capacité de répondre, sans transformer explicitement l’infinitif en impératif.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve les images centrales de la grâce et du sel, avec une syntaxe fluide. « À chacun » évite une formulation genrée tout en gardant la force distributive du grec.
