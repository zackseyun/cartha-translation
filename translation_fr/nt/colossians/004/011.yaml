id: COL.4.11
reference: Colossians 4:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ Ἰησοῦς ὁ λεγόμενος Ἰοῦστος, οἱ ὄντες ἐκ περιτομῆς, οὗτοι μόνοι συνεργοὶ εἰς τὴν βασιλείαν τοῦ θεοῦ, οἵτινες ἐγενήθησάν μοι παρηγορία.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/011.yaml
  text: and Jesus who is called Justus[a]. These are the only ones from the circumcision who are fellow workers for the kingdom of God[c][b], and they became a comfort to me.
translation:
  language: fr
  text: ainsi que Jésus, appelé Justus. Parmi ceux qui sont de la circoncision[a], eux seuls sont des collaborateurs pour le royaume de Dieu[b], et ils sont devenus pour moi un réconfort[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Peut aussi désigner des personnes d’origine juive. Littéralement : « ceux qui sont de la circoncision ».'
    reason: lexical_alternative
  - marker: b
    text: 'Autre traduction possible : « Parmi les collaborateurs pour le royaume de Dieu, eux seuls sont de la circoncision. »'
    reason: syntactic_ambiguity
  - marker: c
    text: 'Ou : « une consolation » ou « un encouragement ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰησοῦς
  choice: Jésus
  rationale: Transcription française conventionnelle du nom grec dans le Nouveau Testament; « Josué » correspond à la forme hébraïque sous-jacente, mais ne convient pas ici à l'usage néotestamentaire français.
- source_word: ὁ λεγόμενος Ἰοῦστος
  choice: appelé Justus
  rationale: Formulation française naturelle qui présente l'autre nom, probablement latin, porté par cet homme.
- source_word: οἱ ὄντες ἐκ περιτομῆς
  choice: ceux qui sont de la circoncision
  rationale: Conserve l'expression identitaire du grec sans la réduire explicitement à « les Juifs » ni décider s'il s'agit d'un parti plus restreint.
- source_word: οὗτοι μόνοι
  choice: eux seuls
  rationale: Rend nettement l'exclusivité et rattache celle-ci au groupe qui vient d'être nommé.
- source_word: συνεργοὶ
  choice: travaillent avec moi
  rationale: Le nom signifie « collaborateurs » ou « compagnons de travail ». La tournure verbale est naturelle en français et explicite le lien avec Paul suggéré par le contexte et par μοι dans la proposition suivante.
- source_word: εἰς τὴν βασιλείαν τοῦ θεοῦ
  choice: pour le royaume de Dieu
  rationale: Rend la valeur de service ou de finalité de εἰς tout en conservant l'expression biblique établie.
- source_word: ἐγενήθησάν μοι παρηγορία
  choice: ils ont été pour moi un réconfort
  rationale: Le passé composé rend naturellement en français le constat rétrospectif exprimé par l'aoriste; παρηγορία peut désigner le réconfort, la consolation ou l'encouragement.
theological_decisions:
- issue: Sens de « ceux qui sont de la circoncision »
  choice: Maintenir l'expression littérale comme désignation de personnes d'origine ou d'identité juive parmi les collaborateurs chrétiens de Paul.
  alternative: Traduire « les croyants juifs », « les Juifs » ou « le parti de la circoncision ».
  rationale: Le contexte indique des collaborateurs pour le royaume de Dieu, mais l'expression elle-même ne précise pas s'il s'agit simplement de leur origine juive ou d'un groupe plus étroit. La traduction conserve cette tension.
- issue: Portée de « seuls »
  choice: Faire porter l'exclusivité sur les personnes issues de la circoncision qui collaborent avec Paul.
  alternative: Construire la phrase de manière à pouvoir suggérer qu'ils sont ses seuls collaborateurs en général.
  rationale: L'ordre et la structure grecs mettent d'abord en relief « ceux qui sont de la circoncision », puis déclarent que ceux-ci seuls sont collaborateurs; la portée restreinte est donc privilégiée sans surinterprétation.
translation_notes:
  register: Français international actuel, digne et accessible. La phrase conserve l'expression biblique « de la circoncision », accompagnée d'une note explicative. « Travaillent avec moi » évite le caractère administratif de « collègues » et la lourdeur possible de « compagnons d'œuvre ».
