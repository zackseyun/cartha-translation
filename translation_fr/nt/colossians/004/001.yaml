id: COL.4.1
reference: Colossians 4:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οἱ κύριοι, τὸ δίκαιον καὶ τὴν ἰσότητα τοῖς δούλοις παρέχεσθε, εἰδότες ὅτι καὶ ὑμεῖς ἔχετε κύριον ἐν ⸀οὐρανῷ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/001.yaml
  text: Masters[a], provide your servants with what is right and fair, knowing that you also have a Lord in heaven.
translation:
  language: fr
  text: Maîtres, accordez à vos esclaves ce qui est juste et ce qui est équitable[a], sachant que vous aussi, vous avez un Maître au ciel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ce qui est juste et l’égalité ». Le mot grec traduit par « équitable » peut aussi signifier « égalité » ou « équité ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ κύριοι
  choice: Maîtres
  rationale: Dans ce code domestique, le terme désigne les maîtres humains par rapport aux esclaves. « Maîtres » est direct et naturel en français.
- source_word: τὸ δίκαιον
  choice: ce qui est juste
  rationale: L’adjectif substantivé désigne ce qui est conforme à la justice; cette formulation en conserve clairement la portée morale.
- source_word: τὴν ἰσότητα
  choice: équitable
  rationale: Le nom peut exprimer l’égalité, l’équité ou un traitement impartial. « Équitable » s’accorde naturellement avec « juste » dans ce contexte, tandis que « égalité » est signalé en note comme possibilité significative.
- source_word: τοῖς δούλοις
  choice: à vos esclaves
  rationale: La relation avec des maîtres rend ici explicite la condition servile; « esclaves » évite de l’atténuer comme le ferait « serviteurs ».
- source_word: παρέχεσθε
  choice: accordez
  rationale: L’impératif demande aux maîtres de donner ou d’assurer ce traitement. « Accordez » est idiomatique et garde la force de l’ordre.
- source_word: εἰδότες
  choice: sachant
  rationale: Le participe exprime l’attitude consciente qui accompagne et motive le commandement, sans imposer une relation logique plus précise.
- source_word: καὶ ὑμεῖς
  choice: vous aussi
  rationale: 'Cette formulation conserve l’insistance: les maîtres humains sont eux-mêmes placés sous une autorité.'
- source_word: κύριον
  choice: un Maître
  rationale: La répétition de κύριος crée un contraste délibéré entre les maîtres terrestres et leur propre Maître céleste. La majuscule signale ici le référent divin sans effacer ce jeu lexical.
- source_word: ἐν οὐρανῷ
  choice: dans le ciel
  rationale: Traduction française courante et naturelle du singulier grec dans ce contexte.
theological_decisions:
- issue: Traduction de δοῦλοι dans le cadre domestique antique
  choice: esclaves
  alternative: serviteurs
  rationale: Le rapport explicite avec des maîtres rend la condition juridique et sociale saillante. « Serviteurs » risquerait d’adoucir anachroniquement cette réalité.
- issue: Sens de ἰσότητα
  choice: équitable
  alternative: égalité
  rationale: Dans l’exhortation, le mot peut désigner un traitement équitable, mais son sens littéral possible d’« égalité » porte une tension interprétative réelle; celle-ci est donc conservée en note.
- issue: Relation entre les deux emplois de κύριος
  choice: Maîtres … un Maître
  alternative: Maîtres … un Seigneur
  rationale: 'Employer « Maître » dans les deux cas préserve l’écho rhétorique grec: ceux qui exercent une maîtrise terrestre ont eux-mêmes un Maître céleste. « Seigneur » exprimerait davantage le titre théologique, mais affaiblirait ce parallèle.'
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche du grec tout en étant naturelle; le redoublement « vous aussi, vous avez » restitue l’emphase de καὶ ὑμεῖς.
