  naturalness: La formulation est globalement claire et idiomatique. « Au ciel » est toutefois la tournure française usuelle pour le référent céleste divin; « dans le ciel » évoque plus facilement le ciel physique. La légère explicitation coordonnée aide aussi à entendre les deux compléments grecs.
