  text: Ὁ ἀσπασμὸς τῇ ἐμῇ χειρὶ Παύλου. μνημονεύετέ μου τῶν δεσμῶν. ἡ χάρις μεθ’ ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/018.yaml
  text: The greeting is in my own hand—Paul's[a]. Remember my chains[b]. Grace be with you.
translation:
  language: fr
  text: Cette salutation est écrite de ma propre main, moi, Paul[a]. Souvenez-vous de mes chaînes[b]. Que la grâce soit avec vous.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec est elliptique : « La salutation, de ma propre main, Paul ». Paul indique qu’il a personnellement écrit cette formule finale.'
    reason: clarification
  - marker: b
    text: 'Ou « de mon emprisonnement » ou « de mes liens ». Littéralement : « de mes chaînes ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπασμός
  choice: salutation
  rationale: Dans ce contexte épistolaire, le terme désigne la salutation finale. « Salutation » est naturel en français et convient à une formule de clôture.
- source_word: τῇ ἐμῇ χειρὶ Παύλου
  choice: de ma propre main, celle de Paul
  rationale: Le datif exprime ici que Paul écrit personnellement cette salutation. Cette formulation rend l’ellipse grecque tout en conservant l’insistance sur sa propre écriture.
- source_word: μνημονεύετέ
  choice: Souvenez-vous
  rationale: L’impératif présent appelle les destinataires à garder en mémoire la situation de Paul; l’impératif français simple reste naturel sans surinterpréter l’aspect verbal.
- source_word: μου τῶν δεσμῶν
  choice: mes chaînes
  rationale: Le grec emploie l’image concrète des liens ou chaînes comme métonymie de l’emprisonnement. « Mes chaînes » préserve cette image.
- source_word: ἡ χάρις
  choice: la grâce
  rationale: La formule paulinienne conserve le nom avec son article en français. Aucun possesseur n’est ajouté, puisque le grec n’en explicite aucun.
- source_word: μεθ’ ὑμῶν
  choice: soit avec vous
  rationale: La copule absente du grec est naturellement suppléée en français pour former une bénédiction idiomatique; « vous » peut être collectif comme dans le texte source.
theological_decisions:
- issue: Bénédiction finale sans verbe explicite
  choice: Que la grâce soit avec vous
  alternative: La grâce avec vous
  rationale: Le grec est nominal, mais le français courant appelle une formulation optative complète. Ajouter « soit » explicite la force de bénédiction sans ajouter de contenu théologique.
- issue: Sens de « mes chaînes »
  choice: Conserver l’image concrète
  alternative: mon emprisonnement
  rationale: Le texte évoque littéralement les liens de Paul et peut aussi désigner sa captivité par métonymie. La traduction maintient cette tension au lieu de la réduire au seul sens abstrait.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe de la première phrase conserve l’insistance personnelle de la formule grecque sans archaïsme; la bénédiction finale adopte une tournure française naturelle.
