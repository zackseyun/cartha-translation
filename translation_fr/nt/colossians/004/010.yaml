  terminology: 'Les noms propres sont correctement rendus : Aristarque, Marc et Barnabé. « Instructions » conserve bien la portée de ἐντολάς sans imposer un ton excessivement autoritaire. La note proposée n’est pas nécessaire : « neveu » ne constitue pas ici une alternative française également défendable au sens du grec, et son attribution vague à une « traduction ancienne » risque d’induire le lecteur en erreur.'
