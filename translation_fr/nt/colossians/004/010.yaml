  text: Ἀσπάζεται ὑμᾶς Ἀρίσταρχος ὁ συναιχμάλωτός μου, καὶ Μᾶρκος ὁ ἀνεψιὸς Βαρναβᾶ (περὶ οὗ ἐλάβετε ἐντολάς, ἐὰν ἔλθῃ πρὸς ὑμᾶς δέξασθε αὐτόν),
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/010.yaml
  text: Aristarchus[a], my fellow prisoner, greets you, and Mark, the cousin of Barnabas (about whom you received instructions—if he comes to you, welcome him)[b],
translation:
  language: fr
  text: 'Aristarque, mon compagnon de captivité, vous salue, ainsi que Marc, le cousin de Barnabé (au sujet duquel vous avez reçu des instructions : s’il vient chez vous, accueillez-le).'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀσπάζεται ὑμᾶς
  choice: vous salue
  rationale: Formulation épistolaire directe, naturelle en français, qui conserve la force verbale du grec.
- source_word: συναιχμάλωτός μου
  choice: mon compagnon de captivité
  rationale: Rend le composé grec sans préciser si la captivité est littérale ou métaphorique. « Compagnon de captivité » est plus idiomatique ici que « codétenu » tout en restant proche du sens.
- source_word: ἀνεψιὸς
  choice: cousin
  rationale: En grec de la koinè, le terme désigne précisément un cousin ; « neveu » relève surtout d’une tradition ancienne et est moins exact lexicalement.
- source_word: ἐλάβετε ἐντολάς
  choice: vous avez reçu des instructions
  rationale: « Instructions » conserve l’idée de directives ayant autorité sans donner au contexte un ton inutilement militaire ou sévère.
- source_word: ἐὰν ἔλθῃ πρὸς ὑμᾶς
  choice: s’il vient chez vous
  rationale: Cette formulation française exprime naturellement la condition future et le mouvement vers la communauté destinataire.
- source_word: δέξασθε αὐτόν
  choice: accueillez-le
  rationale: Dans ce contexte de déplacement et d’hospitalité, le verbe grec signifie recevoir favorablement quelqu’un ; « accueillez-le » est clair et naturel en français moderne.
theological_decisions:
- issue: Nature de la relation entre Paul et Aristarque dans συναιχμάλωτός μου
  choice: mon compagnon de captivité
  alternative: mon compagnon de captivité dans le Seigneur ; mon compagnon d’épreuve
  rationale: Le texte ne précise ni la nature ni le cadre de cette captivité. La traduction conserve donc le sens lexical sans trancher entre une détention littérale et un emploi métaphorique.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve la longue phrase et la parenthèse explicative du grec, rendue par deux-points pour une lecture naturelle. Le marqueur [a] est placé immédiatement après le mot auquel la note se rapporte.
