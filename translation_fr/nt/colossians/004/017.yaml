reference: Colossians 4:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ εἴπατε Ἀρχίππῳ· Βλέπε τὴν διακονίαν ἣν παρέλαβες ἐν κυρίῳ, ἵνα αὐτὴν πληροῖς.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/017.yaml
  text: And tell Archippus[a], “See to the ministry that you received in the Lord, so that you may fulfill it.”
translation:
  language: fr
  text: 'Et dites à Archippe : « Veille à accomplir pleinement le ministère que tu as reçu dans le Seigneur[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou peut-être : « que tu as reçu de la part du Seigneur ». Autre interprétation possible de l’expression grecque.'
    reason: alternative_reading
lexical_decisions:
- source_word: εἴπατε
  choice: dites à
  rationale: L’impératif aoriste pluriel s’adresse à la communauté. « Dites à » rend directement et naturellement l’ordre collectif.
- source_word: Ἀρχίππῳ
  choice: Archippe
  rationale: Forme française traditionnelle et courante du nom grec Ἄρχιππος.
- source_word: Βλέπε
  choice: Veille à
  rationale: L’impératif présent singulier appelle une attention soutenue. « Veille à » exprime cette vigilance dans un français actuel et digne.
- source_word: διακονίαν
  choice: ministère
  rationale: Le terme désigne ici un service ou une responsabilité confiée dans le cadre de la vie chrétienne, sans préciser une fonction ecclésiale particulière.
- source_word: παρέλαβες
  choice: tu as reçu
  rationale: Le verbe présente cette responsabilité comme reçue ou confiée, et non comme une initiative personnelle.
- source_word: ἐν κυρίῳ
  choice: dans le Seigneur
  rationale: Cette formulation suit la préposition grecque ἐν et conserve l’ambiguïté entre sphère relationnelle, association au Seigneur et possible nuance de source.
- source_word: ἵνα
  choice: afin de
  rationale: La tournure exprime clairement la visée de l’exhortation en français naturel.
- source_word: πληροῖς
  choice: l’accomplir pleinement
  rationale: Le présent du subjonctif de πληρόω évoque la réalisation entière et fidèle du ministère. Cette formulation rend mieux cette plénitude que le seul verbe « accomplir ».
theological_decisions:
- issue: Nuance de ἐν κυρίῳ
  choice: « dans le Seigneur » dans le texte principal
  alternative: « de la part du Seigneur »
  rationale: Le grec emploie ἐν, non une préposition indiquant sans ambiguïté la provenance. Le texte principal conserve donc la formulation et son ouverture théologique, tandis que la note signale l’interprétation possible selon laquelle le Seigneur est la source du ministère.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement correspond à l’adresse directe au singulier. « Ministère » est conservé sans définir plus précisément la nature de la responsabilité d’Archippe.
