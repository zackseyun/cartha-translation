  text: ἀσπάζεται ὑμᾶς Λουκᾶς ὁ ἰατρὸς ὁ ἀγαπητὸς καὶ Δημᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/014.yaml
  text: Luke, the beloved physician, and Demas greet you.
translation:
  language: fr
  text: Luc, le médecin bien-aimé, et Démas vous saluent.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀσπάζεται
  choice: vous saluent
  rationale: La formule épistolaire exprime l’envoi de salutations. Bien que le grec emploie un verbe au singulier placé avant les deux noms, le français demande naturellement le pluriel avec le sujet composé « Luc… et Démas ».
- source_word: ὑμᾶς
  choice: vous
  rationale: Le pronom désigne collectivement les destinataires colossiens; « vous » en conserve directement la personne et le nombre.
- source_word: Λουκᾶς
  choice: Luc
  rationale: Forme française traditionnelle et courante du nom grec Λουκᾶς.
- source_word: ἰατρὸς
  choice: médecin
  rationale: « Médecin » rend précisément la profession indiquée par ἰατρός dans un français moderne et naturel.
- source_word: ἀγαπητὸς
  choice: bien-aimé
  rationale: « Bien-aimé » conserve l’affection et l’estime exprimées par ἀγαπητός, ainsi que le registre légèrement élevé de la formulation.
- source_word: καὶ
  choice: et
  rationale: Conjonction de coordination simple reliant Démas à Luc comme auteur d’une salutation.
- source_word: Δημᾶς
  choice: Démas
  rationale: Forme française traditionnelle du nom grec Δημᾶς.
theological_decisions:
- issue: Portée du qualificatif ὁ ἀγαπητός (« bien-aimé »)
  choice: « bien-aimé » qualifie Luc, comme « médecin ».
  alternative: Comprendre ou ponctuer la phrase de manière à laisser croire que le qualificatif pourrait aussi porter sur Démas.
  rationale: La construction grecque Λουκᾶς ὁ ἰατρὸς ὁ ἀγαπητός met les deux groupes en apposition à Luc. Les virgules françaises rendent cette relation claire sans étendre le qualificatif à Démas.
translation_notes:
  register: Français international moderne, digne et immédiatement compréhensible. La formulation concise respecte l’ordre grec et la structure de la salutation, tout en accordant naturellement le verbe au pluriel en français.
