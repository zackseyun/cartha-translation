id: COL.4.16
reference: Colossians 4:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ὅταν ἀναγνωσθῇ παρ’ ὑμῖν ἡ ἐπιστολή, ποιήσατε ἵνα καὶ ἐν τῇ ⸀Λαοδικέων ἐκκλησίᾳ ἀναγνωσθῇ, καὶ τὴν ἐκ Λαοδικείας ἵνα καὶ ὑμεῖς ἀναγνῶτε.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/016.yaml
  text: And when this letter has been read among you[a], see that it is also read in the church of the Laodiceans[b], and that you also read the one from Laodicea.
translation:
  language: fr
  text: Quand cette lettre aura été lue parmi vous, veillez à ce qu’elle soit aussi lue dans l’Église des Laodicéens, et lisez, vous aussi, celle qui vient de Laodicée[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’identité de cette lettre est incertaine. Le grec dit littéralement « celle de Laodicée » ou « celle venant de Laodicée » : il peut s’agir d’une lettre alors présente à Laodicée, sans que celle-ci lui ait nécessairement été adressée.'
    reason: cultural_note
lexical_decisions:
- source_word: ἀναγνωσθῇ / ἀναγνῶτε
  choice: aura été lue / lisez
  rationale: ἀναγινώσκω signifie « lire » et évoque probablement ici la lecture publique dans les assemblées chrétiennes. Le français « lire » reste naturel et ne rend pas explicite ce que le verbe laisse au contexte.
- source_word: παρ’ ὑμῖν
  choice: parmi vous
  rationale: Avec παρά et le datif, l’expression situe la lecture au sein de la communauté colossienne plutôt qu’elle ne désigne simplement ceux qui la font.
- source_word: ἡ ἐπιστολή
  choice: cette lettre
  rationale: L’article renvoie à la lettre présente. Le démonstratif français explicite naturellement cette référence déictique.
- source_word: ποιήσατε ἵνα
  choice: veillez à ce que
  rationale: Cette construction idiomatique exprime l’ordre de faire en sorte qu’un résultat se produise. « Veillez à ce que » conserve la force impérative dans un français digne et courant.
- source_word: ἐν τῇ Λαοδικέων ἐκκλησίᾳ
  choice: dans l’Église des Laodicéens
  rationale: La formulation conserve le rapport génitif du grec et désigne la communauté chrétienne composée des habitants ou croyants de Laodicée.
- source_word: τὴν ἐκ Λαοδικείας
  choice: celle qui vient de Laodicée
  rationale: Le nom ἐπιστολή est sous-entendu, et ἐκ indique normalement la provenance. Cette tournure préserve l’ellipse tout en étant claire en français.
theological_decisions:
- issue: Identité de « celle qui vient de Laodicée »
  choice: Ne pas identifier cette lettre et rendre ἐκ par une provenance neutre.
  alternative: La lettre adressée aux Laodicéens ; une lettre envoyée depuis Laodicée ; une lettre circulaire associée à Laodicée, parfois identifiée à Éphésiens.
  rationale: Le grec ne précise ni l’identité du document ni ses destinataires originels. La traduction conserve donc l’incertitude historique et n’impose aucune reconstruction canonique ou non canonique.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe impérative reste ferme sans être archaïque. La majuscule à « Église » désigne ici la communauté locale ; elle n’ajoute aucune précision confessionnelle.
