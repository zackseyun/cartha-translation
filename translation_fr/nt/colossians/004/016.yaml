  source_fidelity: 'Le texte rend fidèlement la structure de l’original : la lecture de « cette lettre » au sein de la communauté, l’injonction de faire en sorte qu’elle soit également lue dans l’Église des Laodicéens, puis l’ordre de lire l’écrit « venant de Laodicée ». Le futur antérieur après « quand » rend naturellement la valeur prospective de ὅταν avec subjonctif aoriste. L’ellipse de ἐπιστολή dans τὴν ἐκ Λαοδικείας est correctement conservée par « celle qui vient de Laodicée ».'
