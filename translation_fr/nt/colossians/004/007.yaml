id: COL.4.7
reference: Colossians 4:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Τὰ κατ’ ἐμὲ πάντα γνωρίσει ὑμῖν Τυχικὸς ὁ ἀγαπητὸς ἀδελφὸς καὶ πιστὸς διάκονος καὶ σύνδουλος ἐν κυρίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/007.yaml
  text: Tychicus[a], the beloved brother and faithful minister and fellow servant in the Lord[c][b], will make known to you everything about me.
translation:
  language: fr
  text: Tychique, le frère bien-aimé, fidèle serviteur[b] et compagnon d’esclavage[c] dans le Seigneur, vous fera connaître tout ce qui me concerne[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tout ce qui a trait à moi » ou « toute ma situation ».
    reason: lexical_alternative
  - marker: b
    text: Ou « fidèle ministre ». Le grec διάκονος peut désigner un serviteur, un ministre ou, dans certains contextes, un diacre.
    reason: lexical_alternative
  - marker: c
    text: Ou « compagnon de service » ou « co-esclave ». Le grec σύνδουλος est formé sur δοῦλος, qui désigne une personne en condition de servitude.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τὰ κατ’ ἐμὲ πάντα
  choice: tout ce qui me concerne
  rationale: L’expression désigne largement les affaires, la situation ou les circonstances de Paul. Cette formulation française est naturelle, conserve la portée de πάντα et évite de réduire le sens à ses seules circonstances matérielles.
- source_word: γνωρίσει ὑμῖν
  choice: vous fera connaître
  rationale: Cette tournure rend directement le futur de γνωρίζω et le datif ὑμῖν, dans un registre courant mais digne.
- source_word: Τυχικὸς
  choice: Tychique
  rationale: Forme française traditionnelle et largement reconnue du nom grec Τυχικός.
- source_word: ὁ ἀγαπητὸς ἀδελφὸς
  choice: le frère bien-aimé
  rationale: La formulation conserve à la fois la chaleur de ἀγαπητός et la référence masculine singulière de ἀδελφός.
- source_word: πιστὸς διάκονος
  choice: fidèle serviteur
  rationale: Dans ce contexte, διάκονος décrit le service digne de confiance de Tychique sans désigner clairement une fonction ecclésiale précise. « Serviteur » est naturel en français et laisse ouverte l’étendue de son ministère.
- source_word: σύνδουλος
  choice: compagnon de service
  rationale: Le composé indique que Tychique partage avec Paul une même condition de service sous l’autorité du Seigneur. Cette expression française rend la relation de compagnonnage sans imposer les connotations modernes de l’esclavage; la force de δοῦλος est signalée en note.
- source_word: ἐν κυρίῳ
  choice: dans le Seigneur
  rationale: Cette expression paulinienne habituelle conserve sans paraphrase sa nuance relationnelle et théologique.
theological_decisions:
- issue: Portée de διάκονος
  choice: fidèle serviteur
  alternative: fidèle ministre; fidèle diacre
  rationale: Le contexte recommande Tychique pour son service fidèle, mais ne permet pas d’établir avec certitude que διάκονος désigne ici la fonction ecclésiale de diacre. La traduction principale évite donc de trancher en faveur d’un office précis.
- issue: Force du vocabulaire σύνδουλος / δοῦλος
  choice: compagnon de service
  alternative: compagnon d’esclavage; co-esclave
  rationale: σύνδουλος exprime un statut partagé de dépendance et de service sous un même Seigneur. « Compagnon de service » est idiomatique et digne en français moderne, tandis qu’une note conserve la possibilité d’une traduction soulignant plus explicitement la condition servile.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe place Tychique en tête pour une lecture fluide. Les termes de service restent compréhensibles sans attribuer à Tychique un office ecclésial non explicitement établi par le contexte.
