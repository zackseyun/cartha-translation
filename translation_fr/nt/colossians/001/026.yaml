  text: τὸ μυστήριον τὸ ἀποκεκρυμμένον ἀπὸ τῶν αἰώνων καὶ ἀπὸ τῶν γενεῶν,— ⸀νῦν δὲ ἐφανερώθη τοῖς ἁγίοις αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/026.yaml
  text: the mystery hidden from the ages and from the generations—but now revealed to his saints[b][a],
translation:
  language: fr
  text: le mystère caché depuis les siècles et depuis les générations, mais maintenant révélé à ses saints[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « à ceux qui lui sont consacrés ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: μυστήριον
  choice: mystère
  rationale: '« Mystère » est le terme paulinien établi : il désigne ici un dessein divin autrefois caché et désormais dévoilé, non une énigme inaccessible.'
- source_word: ἀποκεκρυμμένον
  choice: caché
  rationale: Le participe parfait passif exprime l’état résultant d’une dissimulation antérieure. « Caché » le rend naturellement en français.
- source_word: ἀπὸ τῶν αἰώνων καὶ ἀπὸ τῶν γενεῶν
  choice: depuis les siècles et les générations
  rationale: La répétition grecque de ἀπό est condensée naturellement en français. « Depuis » rend la séparation temporelle d’avec les époques et générations passées, sans transformer αἰῶνες en éternité abstraite.
- source_word: νῦν δὲ
  choice: mais maintenant
  rationale: Cette formulation conserve clairement le contraste entre la dissimulation passée et la révélation présente.
- source_word: ἐφανερώθη
  choice: révélé
  rationale: « Révélé » rend de façon concise et idiomatique l’aoriste passif, tout en laissant Dieu comme agent implicite.
- source_word: τοῖς ἁγίοις αὐτοῦ
  choice: à ceux qui lui appartiennent et qui sont saints
  rationale: Cette formulation naturelle évite que « saints » soit compris comme une élite canonisée, tout en conservant à la fois l’appartenance exprimée par αὐτοῦ et la sainteté exprimée par ἁγίοις.
theological_decisions:
- issue: Sens et référent de τοῖς ἁγίοις αὐτοῦ
  choice: « ceux qui lui appartiennent et qui sont saints » désigne le peuple consacré à Dieu, sans le limiter à une catégorie spirituelle ou ecclésiastique d’élite.
  alternative: « à ses saints » ou « à ceux qui lui sont consacrés »
  rationale: Dans l’usage paulinien, ἅγιοι désigne couramment les croyants mis à part pour Dieu. La formulation retenue explicite ce sens communautaire sans effacer la notion de sainteté.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase demeure un fragment syntaxique afin de respecter son lien avec le verset précédent. Le contraste temporel et la tension paulinienne entre mystère caché et révélation présente sont conservés.
