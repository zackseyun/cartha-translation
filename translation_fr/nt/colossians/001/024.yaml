reference: Colossians 1:24
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Νῦν χαίρω ἐν τοῖς παθήμασιν ὑπὲρ ὑμῶν, καὶ ἀνταναπληρῶ τὰ ὑστερήματα τῶν θλίψεων τοῦ Χριστοῦ ἐν τῇ σαρκί μου ὑπὲρ τοῦ σώματος αὐτοῦ, ὅ ἐστιν ἡ ἐκκλησία,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/024.yaml
  text: Now I rejoice in my sufferings for your sake[a], and in my flesh I am filling up what is lacking in the afflictions of the Messiah for the sake of his body, which is the church[b],
translation:
  language: fr
  text: Maintenant, je me réjouis dans mes souffrances pour vous et, dans ma chair, je comble ce qui manque aux afflictions du Messie[a], pour le bien de son corps, qui est l’Église[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Litt. « je remplis ce qui manque aux afflictions du Messie ». L’expression est difficile et le texte ne précise pas en quel sens ces afflictions « manquent ».
    reason: Signaler littéralement la formulation forte de ἀνταναπληρῶ τὰ ὑστερήματα τῶν θλίψεων sans résoudre une question d’interprétation disputée.
  - marker: b
    text: Le grec porte « Christ », terme qui signifie « Messie » ; il est rendu ici comme un titre.
    reason: Expliquer le choix lexical pour Χριστός.
lexical_decisions:
- source_word: Νῦν
  choice: Maintenant
  rationale: Marque simplement la situation présente de Paul et l’enchaînement du discours.
- source_word: χαίρω ἐν τοῖς παθήμασιν ὑπὲρ ὑμῶν
  choice: je me réjouis dans mes souffrances pour vous
  rationale: La formulation conserve le paradoxe de la joie au sein des souffrances et la valeur bénéficiaire de ὑπέρ. Le possessif « mes » est fourni naturellement par le contexte à la première personne.
- source_word: ἀνταναπληρῶ τὰ ὑστερήματα
  choice: je complète ce qui manque
  rationale: Cette tournure naturelle maintient sans l’atténuer l’image forte d’un manque à compléter, tout en évitant le substantif abstrait et peu idiomatique « déficiences ».
- source_word: τῶν θλίψεων
  choice: aux afflictions
  rationale: « Afflictions » rend la détresse et l’épreuve exprimées par θλῖψις, tout en distinguant ce terme de παθήματα, rendu plus haut par « souffrances ».
- source_word: τοῦ Χριστοῦ
  choice: du Messie
  rationale: Χριστός garde ici sa portée de titre messianique; « Messie » la rend explicitement plutôt que de traiter le terme comme un simple nom propre.
- source_word: ἐν τῇ σαρκί μου
  choice: dans ma chair
  rationale: La traduction littérale renvoie à l’existence corporelle de Paul, sans introduire ici l’idée de « nature pécheresse ».
- source_word: ὑπὲρ τοῦ σώματος αὐτοῦ
  choice: pour son corps
  rationale: « Pour » exprime de manière concise la valeur bénéficiaire de ὑπέρ, tandis que « corps » préserve la métaphore ecclésiale.
- source_word: ὅ ἐστιν ἡ ἐκκλησία
  choice: qui est l’Église
  rationale: La proposition relative identifie directement le corps du Messie à l’Église. La majuscule française signale ici la communauté ecclésiale universelle, non un bâtiment.
theological_decisions:
- issue: Le sens de « ce qui manque aux afflictions du Messie »
  choice: Conserver dans le texte la formulation forte et ambiguë, en comprenant qu’elle concerne la participation corporelle de Paul aux afflictions liées au Messie et à son Église.
  alternative: Comprendre que les souffrances de Paul complètent une insuffisance de l’œuvre rédemptrice du Messie, ou qu’elles achèvent un quota déterminé de détresses messianiques.
  rationale: Le grec affirme réellement que Paul complète « ce qui manque », et cette tension ne doit pas être effacée. Cependant, le contexte immédiat rattache ses afflictions au service du corps, l’Église, sans déclarer déficiente la mort expiatoire du Messie.
- issue: Valeur de Χριστοῦ
  choice: Messie
  alternative: Christ
  rationale: Le génitif désigne ici Jésus sous son titre messianique; « Messie » rend cette valeur tout en laissant « Christ » comme équivalent lexical traditionnel dans la note.
translation_notes:
  register: Français international actuel, digne et lisible. La phrase conserve la densité et le paradoxe de l’original. « Dans ma chair » et « afflictions » restent volontairement proches du grec; la ponctuation clarifie que l’action de compléter s’accomplit dans l’existence corporelle de Paul.
