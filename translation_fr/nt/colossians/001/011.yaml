id: COL.1.11
reference: Colossians 1:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐν πάσῃ δυνάμει δυναμούμενοι κατὰ τὸ κράτος τῆς δόξης αὐτοῦ εἰς πᾶσαν ὑπομονὴν καὶ μακροθυμίαν μετὰ χαρᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/011.yaml
  text: being strengthened with all power[a], according to the might of his glory, for all endurance and patience with joy,
translation:
  language: fr
  text: fortifiés par toute la puissance, selon la force de sa gloire[a], afin de persévérer et de faire preuve de patience en toute circonstance, avec joie,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « selon sa glorieuse puissance ». Le grec dit plus littéralement « selon la force de sa gloire ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν πάσῃ δυνάμει δυναμούμενοι
  choice: fortifiés par toute puissance
  rationale: Le participe présent passif exprime une action continue dont Dieu est l’agent implicite. « Fortifiés » est naturel et digne; « par toute puissance » rend ici la valeur instrumentale de ἐν et conserve la répétition des termes liés à la puissance.
- source_word: κατὰ τὸ κράτος τῆς δόξης αὐτοῦ
  choice: à la mesure de la force de sa gloire
  rationale: κατά indique la norme ou la mesure de cette fortification. Cette formulation conserve le génitif inhabituel « de sa gloire » et distingue κράτος de δύναμις sans réduire l’expression à un simple adjectif.
- source_word: εἰς πᾶσαν ὑπομονὴν καὶ μακροθυμίαν
  choice: pour persévérer et patienter en toute circonstance
  rationale: εἰς exprime le but ou le résultat. Les verbes coordonnés donnent un français actuel et différencient ὑπομονή, fermeté dans l’épreuve, de μακροθυμία, patience prolongée, tandis que « en toute circonstance » rend la portée globale de πᾶσαν sans la formule peu naturelle « toute persévérance ».
- source_word: μετὰ χαρᾶς
  choice: avec joie
  rationale: La formulation garde le nom χαρά et préserve l’ambiguïté de rattachement de la locution dans la phrase.
theological_decisions:
- issue: Rapport entre la puissance accordée aux croyants et la gloire de Dieu
  choice: « à la mesure de la force de sa gloire »
  alternative: « selon sa glorieuse puissance »
  rationale: Le choix retenu préserve la construction dense du grec, où la force est mise en relation avec la gloire de Dieu, sans transformer silencieusement « gloire » en adjectif.
translation_notes:
  register: Français international moderne, accessible et digne. La formulation conserve l’enchaînement avec le contexte de la prière ainsi que la virgule finale du verset source. « Patienter » est employé au sens soutenu mais courant de faire preuve de patience.
