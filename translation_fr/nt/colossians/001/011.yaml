review_pass:
  verdict: revise
  source_fidelity: Le sens général est bien rendu et la distinction entre δύναμις (« puissance ») et κράτος (« force ») est utilement maintenue. Toutefois, « patienter » exprime surtout le fait d’attendre et ne rend pas aussi bien μακροθυμία, la patience/longanimité comme disposition. La paraphrase « en toute circonstance » est acceptable pour la portée de πᾶσαν, mais il convient de l’associer à une expression plus exacte pour μακροθυμία.
  naturalness: « Fortifiés par toute puissance » est compréhensible mais peu idiomatique et peut laisser entendre que toute puissance, indistinctement, est l’agent. « Fortifiés par toute la puissance » est plus naturel en français tout en gardant l’idée d’une puissance complète. « Faire preuve de patience » est plus naturel et plus précis que « patienter » dans ce contexte.
  terminology: « Selon la force de sa gloire » conserve la construction dense du grec sans la réduire à « sa glorieuse puissance ». « Persévérer » et « faire preuve de patience » distinguent suffisamment ὑπομονή et μακροθυμία dans un français moderne. La note conserve correctement l’alternative plus idiomatique.
  issues:
  - severity: medium
    issue: « patienter » pour μακροθυμία
    rationale: En français contemporain, « patienter » signifie habituellement attendre. μακροθυμία désigne ici la patience durable, souvent dans les relations avec autrui; « faire preuve de patience » est plus fidèle.
  - severity: low
    issue: « par toute puissance »
    rationale: La formulation sans article est moins idiomatique et peut être comprise comme « par n’importe quelle puissance ». « Par toute la puissance » exprime plus naturellement l’intensité exhaustive de πάσῃ δυνάμει.
  revised_text: fortifiés par toute la puissance, selon la force de sa gloire[a], afin de persévérer et de faire preuve de patience en toute circonstance, avec joie,
