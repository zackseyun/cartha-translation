review_pass:
  verdict: revise
  source_fidelity: Le texte rend correctement l’antécédent christologique, la triple insistance sur « κάθε personne », l’activité d’avertir et d’enseigner, ainsi que le but exprimé par ἵνα. « En toute sagesse » conserve de façon appropriée la portée non précisée de ἐν πάσῃ σοφίᾳ. Toutefois, le subjonctif de but παραστήσωμεν est mieux représenté explicitement par « afin que nous présentions » que par l’infinitif « afin de présenter ».
  naturalness: 'La formulation est claire et de registre moderne. « Chaque personne adulte » est toutefois moins naturel et quelque peu réducteur en français : il peut évoquer l’âge biologique plutôt que la maturité visée dans le contexte. « Chaque personne parvenue à maturité » est idiomatique et plus exact.'
  terminology: « Nous proclamons », « avertissant », « en toute sagesse » et « en Christ » sont des équivalents justes et cohérents. Pour τέλειον, « parvenue à maturité » rend la maturité/complétude sans imposer l’idée de perfection morale ni limiter le sens à l’âge adulte.
