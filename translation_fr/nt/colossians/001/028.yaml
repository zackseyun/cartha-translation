  - severity: low
    issue: But exprimé par « afin de présenter »
    rationale: L’infinitif est grammaticalement possible, mais « afin que nous présentions » reflète plus directement le subjonctif pluriel παραστήσωμεν et rend le sujet explicite.
  revised_text: C’est lui que nous proclamons, avertissant chaque personne et enseignant chaque personne en toute sagesse, afin que nous présentions chaque personne parvenue à maturité en Christ.
