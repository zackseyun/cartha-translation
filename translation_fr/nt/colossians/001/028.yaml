  text: ὃν ἡμεῖς καταγγέλλομεν νουθετοῦντες πάντα ἄνθρωπον καὶ διδάσκοντες πάντα ἄνθρωπον ἐν πάσῃ σοφίᾳ, ἵνα παραστήσωμεν πάντα ἄνθρωπον τέλειον ἐν ⸀Χριστῷ·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/028.yaml
  text: Him we proclaim, warning every person and teaching every person with all wisdom, so that we may present every person mature in Messiah.
translation:
  language: fr
  text: C’est lui que nous proclamons, avertissant chaque personne et enseignant chaque personne en toute sagesse, afin que nous présentions chaque personne parvenue à maturité en Christ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καταγγέλλομεν
  choice: nous proclamons
  rationale: Rend l’annonce publique et explicite portée par le verbe, dans un français naturel et soutenu.
- source_word: νουθετοῦντες
  choice: avertissant
  rationale: Le verbe implique une mise en garde ou une exhortation corrective; « avertissant » préserve ici la force retenue par les données de consultation sans surcharger le texte.
- source_word: πάντα ἄνθρωπον
  choice: chaque personne
  rationale: La triple répétition distributive est conservée. « Personne » exprime naturellement l’inclusion de tout être humain en français moderne.
- source_word: ἐν πάσῃ σοφίᾳ
  choice: en toute sagesse
  rationale: Reproduction concise de la tournure grecque, sans préciser artificiellement si la sagesse qualifie surtout l’enseignement ou l’ensemble de l’activité.
- source_word: τέλειον
  choice: adulte
  rationale: Dans ce contexte de formation, le terme évoque l’état d’une personne parvenue à maturité plutôt qu’une perfection absolue; « adulte » conserve aussi l’image de la croissance.
- source_word: ἐν Χριστῷ
  choice: en Christ
  rationale: Formule paulinienne idiomatique qui maintient la relation ou la sphère d’existence exprimée par ἐν.
theological_decisions:
- issue: Sens de τέλειον
  choice: adulte
  alternative: parvenu à la maturité
  rationale: « Adulte » est direct et restitue la métaphore de la maturité spirituelle sans suggérer une perfection morale absolue.
- issue: Référent du pronom ὃν
  choice: C’est lui que nous proclamons
  alternative: Nous le proclamons
  rationale: La construction détachée met en relief la personne du Christ, comme le fait l’antéposition du relatif grec.
- issue: Portée de ἐν πάσῃ σοφίᾳ
  choice: en toute sagesse
  alternative: avec toute la sagesse possible
  rationale: La formulation retenue préserve la concision et l’éventuelle ambiguïté syntaxique de l’original.
translation_notes:
  register: Français international moderne, digne et accessible. La triple répétition de « chaque personne » est volontairement maintenue pour reproduire l’insistance rhétorique du grec.
