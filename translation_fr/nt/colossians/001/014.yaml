id: COL.1.14
reference: Colossians 1:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐν ᾧ ἔχομεν τὴν ἀπολύτρωσιν, τὴν ἄφεσιν τῶν ἁμαρτιῶν·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/014.yaml
  text: in whom we have redemption[a], the forgiveness of sins.
translation:
  language: fr
  text: En qui nous avons la rédemption[a], le pardon des péchés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la libération » pour « rédemption » et « pardon » ; les deux mots grecs peuvent évoquer une remise en liberté. Ici, « le pardon des péchés » semble préciser en quoi consiste cette rédemption.
    reason: alternative lexicale et rapport appositionnel
lexical_decisions:
- source_word: ἐν ᾧ
  choice: en qui
  rationale: Le pronom relatif masculin singulier renvoie au Fils bien-aimé mentionné au verset précédent. « En qui » conserve la formulation relationnelle et l’idée d’union, sans introduire une valeur instrumentale.
- source_word: ἔχομεν
  choice: nous avons
  rationale: Le présent de l’indicatif exprime simplement la possession actuelle de ce bienfait.
- source_word: ἀπολύτρωσιν
  choice: la rédemption
  rationale: « Rédemption » est le terme français courant dans ce contexte paulinien et conserve l’idée forte de libération associée au mot grec, là où « délivrance » ou « libération » en exprimeraient moins nettement la portée.
- source_word: ἄφεσιν
  choice: le pardon
  rationale: Dans le contexte des péchés, « pardon » est l’équivalent français naturel. Le groupe est en apposition à « la rédemption » et en précise ici le contenu.
- source_word: τῶν ἁμαρτιῶν
  choice: des péchés
  rationale: Le génitif pluriel indique ce qui est pardonné. « Des péchés » est la tournure idiomatique et fidèle en français.
theological_decisions:
- issue: Rapport entre « la rédemption » et « le pardon des péchés »
  choice: 'Conserver l’apposition : « la rédemption, le pardon des péchés »'
  alternative: 'Expliciter : « la rédemption, c’est-à-dire le pardon des péchés »'
  rationale: Le grec juxtapose les deux groupes nominaux en apposition. La traduction maintient leur identification étroite sans ajouter une formule explicative absente du texte ni déterminer au-delà de la syntaxe si le pardon épuise ici toute la portée de la rédemption.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation concise conserve l’ordre et l’apposition du grec. « En qui » est maintenu malgré son caractère légèrement soutenu, car il rend précisément le lien personnel avec le Fils évoqué au verset précédent.
