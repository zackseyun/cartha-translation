id: COL.1.23
reference: Colossians 1:23
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἴ γε ἐπιμένετε τῇ πίστει τεθεμελιωμένοι καὶ ἑδραῖοι καὶ μὴ μετακινούμενοι ἀπὸ τῆς ἐλπίδος τοῦ εὐαγγελίου οὗ ἠκούσατε, τοῦ κηρυχθέντος ἐν ⸀πάσῃ κτίσει τῇ ὑπὸ τὸν οὐρανόν, οὗ ἐγενόμην ἐγὼ Παῦλος διάκονος.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/023.yaml
  text: if indeed you continue in the faith[a], grounded and steadfast, and not moved away from the hope of the gospel that you heard, which has been proclaimed in all creation under heaven, of which I, Paul[b], became a servant.
translation:
  language: fr
  text: si du moins vous demeurez dans la foi, solidement fondés et fermes, sans vous laisser détourner de l’espérance de l’Évangile que vous avez entendu. Cet Évangile a été proclamé dans toute la création sous le ciel[a], et moi, Paul, j’en suis devenu serviteur[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «à toute créature sous le ciel»; le grec κτίσις peut désigner la création ou une créature.
    reason: lexical_alternative
  - marker: b
    text: Ou «ministre»; le grec διάκονος peut désigner un serviteur ou une personne chargée d’un ministère.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴ γε
  choice: si du moins
  rationale: Conserve la valeur conditionnelle de εἰ et la nuance d’insistance apportée par γε, sans transformer la condition en certitude ni en simple éventualité.
- source_word: ἐπιμένετε τῇ πίστει
  choice: vous demeurez dans la foi
  rationale: Le présent exprime la continuité; «demeurer dans la foi» est naturel en français et conserve la foi comme domaine ou position dans laquelle les croyants persistent.
- source_word: τεθεμελιωμένοι καὶ ἑδραῖοι
  choice: solidement fondés et fermes
  rationale: «Fondés» maintient l’image des fondations et la forme passive résultative du parfait; «solidement» rend explicite la stabilité de cette fondation, tandis que «fermes» traduit naturellement ἑδραῖοι.
- source_word: μὴ μετακινούμενοι
  choice: sans vous laisser détourner
  rationale: Cette tournure française rend la non-dislocation exprimée par le participe tout en restant fluide; elle décrit le refus d’être déplacé loin de l’espérance.
- source_word: ἀπὸ τῆς ἐλπίδος τοῦ εὐαγγελίου
  choice: de l’espérance de l’Évangile
  rationale: 'Conserve la relation génitivale volontairement ouverte: l’espérance annoncée, suscitée ou offerte par l’Évangile.'
- source_word: τοῦ κηρυχθέντος
  choice: a été proclamé
  rationale: «Proclamé» garde l’idée d’une annonce publique sans ajouter une coloration ecclésiastique étroite.
- source_word: ἐν πάσῃ κτίσει τῇ ὑπὸ τὸν οὐρανόν
  choice: dans toute la création sous le ciel
  rationale: Rend directement la construction grecque et son ampleur universelle, tout en signalant en note l’autre sens possible de κτίσις.
- source_word: οὗ ἐγενόμην ἐγὼ Παῦλος διάκονος
  choice: et moi, Paul, j’en suis devenu serviteur
  rationale: «En» renvoie clairement à l’Évangile; «serviteur» évite d’imposer une fonction institutionnelle à διάκονος, tandis que «devenu» traduit ἐγενόμην.
theological_decisions:
- issue: Portée conditionnelle de εἴ γε et persévérance
  choice: si du moins vous demeurez
  alternative: puisque vous demeurez; à condition que vous demeuriez
  rationale: Le texte formule bien une condition, mais ne tranche pas à lui seul les débats sur l’apostasie ou la persévérance garantie. «Si du moins» maintient cette tension.
- issue: Sens de πίστις dans τῇ πίστει
  choice: la foi
  alternative: la fidélité; la confiance
  rationale: Dans cette construction et ce contexte, «la foi» est le sens le plus probable et laisse ouverte la nuance entre l’acte de croire et le contenu de la foi.
- issue: Portée universelle de la proclamation
  choice: dans toute la création sous le ciel
  alternative: à toute créature sous le ciel
  rationale: La traduction conserve la formulation cosmique et potentiellement rhétorique du grec sans expliquer dans le texte jusqu’où cette proclamation s’est historiquement étendue.
translation_notes:
  register: Français international moderne, digne et accessible. La période grecque est divisée en deux phrases pour améliorer la lisibilité, sans changer les liens logiques. «Évangile» reçoit une majuscule d’usage religieux modéré; «serviteur» reste non institutionnel.
