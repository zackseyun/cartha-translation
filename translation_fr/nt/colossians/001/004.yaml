id: COL.1.4
reference: Colossians 1:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀκούσαντες τὴν πίστιν ὑμῶν ἐν Χριστῷ Ἰησοῦ καὶ τὴν ἀγάπην ⸂ἣν ἔχετε⸃ εἰς πάντας τοὺς ἁγίους
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/004.yaml
  text: having heard of your faith in Messiah Jesus and the love that you have for all the saints,[a]
translation:
  language: fr
  text: ayant entendu parler de votre foi dans le Messie Jésus[a] et de l’amour que vous avez pour tous les saints,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de votre fidélité dans le Messie Jésus » ou « de votre confiance dans le Messie Jésus ». Le nom grec pistis peut exprimer ces sens apparentés selon le contexte.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀκούσαντες
  choice: ayant entendu parler de
  rationale: Le participe aoriste est conservé afin de maintenir son lien syntaxique avec l’action de grâce du verset précédent. « Entendre parler de » est l’expression française naturelle dans ce contexte.
- source_word: πίστιν
  choice: foi
  rationale: « Foi » est le rendu usuel de πίστις et convient ici à la relation des Colossiens avec le Messie Jésus. Les nuances possibles de confiance et de fidélité sont signalées en note.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: dans le Messie Jésus
  rationale: « Dans » préserve la formulation relationnelle et caractéristique de Paul avec ἐν. Χριστός est traduit comme un titre, « Messie », tandis que Ἰησοῦ est rendu par le nom « Jésus ».
- source_word: ἀγάπην
  choice: amour
  rationale: Rendu français direct, naturel et constant de ἀγάπη.
- source_word: ἣν ἔχετε
  choice: que vous avez
  rationale: La proposition relative présente dans le texte grec est explicitement conservée et s’exprime naturellement ainsi en français.
- source_word: εἰς πάντας τοὺς ἁγίους
  choice: pour tous les saints
  rationale: Avec ἀγάπη, εἰς exprime naturellement l’orientation de l’amour et se rend idiomatiquement par « pour ». « Les saints » conserve la désignation paulinienne des croyants.
theological_decisions:
- issue: Traduction de Χριστῷ comme titre ou comme forme devenue quasi nominale
  choice: le Messie Jésus
  alternative: le Christ Jésus
  rationale: Χριστός garde ici sa valeur de titre associé au nom personnel Jésus. « Messie » traduit ce titre plutôt que de le translittérer.
- issue: Nuance de πίστις dans l’usage paulinien
  choice: foi
  alternative: confiance ou fidélité
  rationale: Dans cette construction avec ἐν Χριστῷ Ἰησοῦ, « foi » rend au mieux la réponse des destinataires dans leur relation au Messie Jésus, sans exclure les nuances lexicales voisines, conservées en note.
translation_notes:
  register: Français international moderne, digne et accessible. Le participe initial et la virgule finale signalent que le verset poursuit la phrase commencée au verset précédent. La formulation conserve les termes pauliniens « foi », « Messie » et « saints ».
