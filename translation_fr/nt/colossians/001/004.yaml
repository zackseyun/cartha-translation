  source_fidelity: 'Le texte rend fidèlement les deux objets de ἀκούσαντες : « votre foi dans le Messie Jésus » et « l’amour que vous avez pour tous les saints ». Le participe initial « ayant entendu parler de » conserve de façon appropriée le lien avec l’action principale du verset précédent. « Dans le Messie Jésus » maintient la formulation ἐν sans la réduire à un simple « envers », et « pour tous les saints » rend naturellement εἰς dans cette construction.'
