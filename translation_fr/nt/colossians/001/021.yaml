reference: Colossians 1:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ὑμᾶς ποτε ὄντας ἀπηλλοτριωμένους καὶ ἐχθροὺς τῇ διανοίᾳ ἐν τοῖς ἔργοις τοῖς πονηροῖς—
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/021.yaml
  text: And you[a], who once were alienated and hostile in mind in evil deeds—
translation:
  language: fr
  text: Et vous, qui étiez autrefois éloignés et hostiles dans vos pensées, dans vos œuvres mauvaises[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « hostiles dans la pensée, dans les œuvres mauvaises ». Le grec est très condensé. Les œuvres mauvaises peuvent désigner le domaine ou la manifestation de cette hostilité, sans que le lien précis soit explicitement défini.'
    reason: ambiguïté syntaxique et solution plus littérale
lexical_decisions:
- source_word: καὶ ὑμᾶς
  choice: Et vous
  rationale: Maintient le lien avec la phrase précédente et met les destinataires au premier plan comme objet de l’œuvre de réconciliation évoquée ensuite.
- source_word: ποτε ὄντας
  choice: qui étiez autrefois
  rationale: La proposition relative rend naturellement en français le participe grec et marque clairement l’état passé des lecteurs.
- source_word: ἀπηλλοτριωμένους
  choice: éloignés de Dieu
  rationale: Le participe décrit un état durable de séparation. « Éloignés » est courant et relationnel; « de Dieu », implicite dans le contexte, évite une formulation française incomplète sans modifier le référent.
- source_word: ἐχθροὺς τῇ διανοίᾳ
  choice: hostiles dans vos pensées
  rationale: Le datif indique le domaine dans lequel se situe l’hostilité. Cette formulation naturelle conserve la dimension intérieure sans réduire ἐχθρούς au simple désaccord intellectuel.
- source_word: ἐν τοῖς ἔργοις τοῖς πονηροῖς
  choice: comme le montraient vos œuvres mauvaises
  rationale: La préposition ἐν peut ici indiquer le domaine ou la manifestation de l’hostilité. La formulation française relie naturellement la disposition intérieure à la conduite, tout en signalant en note la construction grecque plus compacte.
- source_word: ἔργοις
  choice: œuvres
  rationale: « Œuvres » garde l’idée d’actes accomplis et convient au registre biblique contemporain; le contexte négatif empêche ici toute confusion avec les débats pauliniens sur les œuvres de la Loi.
- source_word: πονηροῖς
  choice: mauvaises
  rationale: Rend directement la qualification morale du grec dans un français actuel et sobre.
theological_decisions:
- issue: Rapport entre l’hostilité intérieure et les œuvres mauvaises
  choice: Les œuvres mauvaises sont présentées comme la manifestation de l’hostilité intérieure.
  alternative: « hostiles dans vos pensées, au milieu de vos œuvres mauvaises » ou « hostiles dans vos pensées à cause de vos œuvres mauvaises »
  rationale: La construction grecque est concise et n’impose pas avec certitude un rapport causal. Le texte principal exprime une relation de manifestation, naturelle dans le contexte, tandis que la note préserve l’ambiguïté entre domaine, manifestation et moyen.
- issue: Référent de l’éloignement
  choice: Expliciter « de Dieu ».
  alternative: Laisser « éloignés » sans complément.
  rationale: Le complément est fourni par le contexte immédiat de la réconciliation avec Dieu. Son explicitation rend la phrase idiomatique en français sans introduire une distinction doctrinale étrangère au passage.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase demeure ouverte par un tiret, puisqu’elle se poursuit au verset suivant. « Hostiles dans vos pensées » conserve la tension entre disposition intérieure et conduite extérieure, tandis que la note rend compte de la concision du grec.
