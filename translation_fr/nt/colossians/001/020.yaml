id: COL.1.20
reference: Colossians 1:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ δι’ αὐτοῦ ἀποκαταλλάξαι τὰ πάντα εἰς αὐτόν, εἰρηνοποιήσας διὰ τοῦ αἵματος τοῦ σταυροῦ αὐτοῦ, ⸂[δι’ αὐτοῦ]⸃ εἴτε τὰ ἐπὶ τῆς γῆς εἴτε τὰ ⸀ἐν τοῖς οὐρανοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/020.yaml
  text: and through him to reconcile all things to himself[d][c][b][a], having made peace through the blood of his cross—through him—whether the things on the earth or the things in the heavens.
translation:
  language: fr
  text: et, par lui[a], réconcilier toutes choses[b] avec lui-même, ayant fait la paix par le sang de sa croix — par lui[d] —, aussi bien ce qui est sur la terre que ce qui est dans les cieux[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: On pourrait aussi traduire « au moyen de lui » aux deux endroits où figure « par lui ».
    reason: lexical_alternative
  - marker: b
    text: 'L’expression « toutes choses » reste volontairement générale, conformément au grec et à la suite : « aussi bien ce qui est sur la terre que ce qui est dans les cieux ». Le verset lui-même ne précise pas comment cette réconciliation se rapporte au salut final.'
    reason: alternative_reading
  - marker: c
    text: 'Le grec emploie ici le pluriel : « les cieux ».'
    reason: lexical_alternative
  - marker: d
    text: Certains manuscrits omettent le second « par lui ».
    reason: textual_variant
lexical_decisions:
- source_word: δι’ αὐτοῦ
  choice: par lui
  rationale: Avec le génitif, διά exprime ici le moyen ou l’agent. « Par lui » est naturel en français et maintient le rôle médiateur du Fils dans la création et la réconciliation.
- source_word: ἀποκαταλλάξαι
  choice: réconcilier
  rationale: Le verbe désigne le rétablissement d’une relation. Traduire par « réconcilier pleinement » surinterpréterait probablement la force du préfixe ἀπο-.
- source_word: τὰ πάντα
  choice: toutes choses
  rationale: Cette expression neutre plurielle a une portée globale et fait écho aux versets 16-17. « Toutes choses » en conserve l’ampleur sans la réduire aux personnes ni expliciter davantage la nature de cette réconciliation.
- source_word: εἰς αὐτόν
  choice: avec lui-même
  rationale: Après « réconcilier », le français idiomatique demande « avec ». Le pronom réfléchi rend la relation réflexive suggérée par le contexte, où Dieu réconcilie toutes choses avec lui-même par le Fils.
- source_word: εἰρηνοποιήσας
  choice: ayant fait la paix
  rationale: Le participe aoriste exprime une action liée à la réconciliation, avec une nuance de moyen ou de cause. La tournure conserve cette articulation sans en faire une proposition indépendante.
- source_word: διὰ τοῦ αἵματος
  choice: par le sang
  rationale: διά indique le moyen. Le terme concret « sang » est conservé, car le remplacer simplement par « mort » effacerait l’expression sacrificielle du grec.
- source_word: τοῦ σταυροῦ αὐτοῦ
  choice: de sa croix
  rationale: Le possessif est explicite dans le grec. « Sa croix » garde la référence personnelle à la crucifixion du Christ.
- source_word: ⸂[δι’ αὐτοῦ]⸃
  choice: par lui
  rationale: La répétition est retenue et mise entre tirets afin de préserver sa reprise emphatique, tout en signalant en note la variation manuscrite.
- source_word: εἴτε ... εἴτε
  choice: aussi bien ... que
  rationale: Cette corrélation française exprime naturellement le couple exhaustif formé dans le grec, sans suggérer une incertitude que pourrait introduire « soit… soit ».
- source_word: τὰ ἐπὶ τῆς γῆς
  choice: ce qui est sur la terre
  rationale: Le neutre collectif est rendu naturellement par « ce qui ». « Terre » convient au contraste cosmologique avec les cieux.
- source_word: τὰ ἐν τοῖς οὐρανοῖς
  choice: ce qui est dans les cieux
  rationale: Le pluriel « les cieux » reproduit le pluriel grec et maintient l’idiome cosmologique biblique.
theological_decisions:
- issue: Portée de la réconciliation dans τὰ πάντα
  choice: « toutes choses », sans restriction du référent ni définition du rapport entre cette réconciliation et le salut final
  alternative: « tous les êtres humains » ou « l’univers entier sauvé au sens final »
  rationale: Le contexte décrit une réconciliation cosmique, englobant ce qui est sur la terre et dans les cieux. La traduction en conserve l’étendue tout en laissant ouverte la nature précise de cette réconciliation pour les êtres personnels.
- issue: Référent de αὐτόν dans εἰς αὐτόν
  choice: Dieu réconcilie toutes choses avec lui-même par le Fils
  alternative: Le Messie réconcilie toutes choses avec lui-même
  rationale: La syntaxe prolonge la proposition de but du verset 19, où Dieu est le sujet implicite de son bon vouloir. « Lui-même » rend la relation réflexive la plus probable sans ajouter une explication dans le corps du texte.
- issue: Sens du « sang de sa croix »
  choice: Maintien du langage concret du sang et de la croix
  alternative: « sa mort sur la croix »
  rationale: Le grec nomme explicitement le sang et la croix. Les conserver préserve à la fois la réalité historique de la crucifixion et la portée sacrificielle de l’expression, sans imposer une théorie particulière de l’expiation.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve le lien avec la phrase commencée au verset précédent. La répétition « par lui » et l’expression concrète « le sang de sa croix » sont maintenues, tandis que « aussi bien… que » rend naturellement la corrélation grecque.
