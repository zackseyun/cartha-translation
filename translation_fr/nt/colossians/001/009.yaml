id: COL.1.9
reference: Colossians 1:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Διὰ τοῦτο καὶ ἡμεῖς, ἀφ’ ἧς ἡμέρας ἠκούσαμεν, οὐ παυόμεθα ὑπὲρ ὑμῶν προσευχόμενοι καὶ αἰτούμενοι ἵνα πληρωθῆτε τὴν ἐπίγνωσιν τοῦ θελήματος αὐτοῦ ἐν πάσῃ σοφίᾳ καὶ συνέσει πνευματικῇ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/009.yaml
  text: For this reason[a], we also, from the day we heard, have not ceased praying for you and asking that you may be filled with the knowledge of his will in all spiritual wisdom and understanding[b],
translation:
  language: fr
  text: C’est pourquoi, nous aussi, depuis le jour où nous en avons entendu parler, nous ne cessons de prier pour vous et de demander que vous soyez remplis de la connaissance[a] de sa volonté, avec toute la sagesse et l’intelligence spirituelles[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pleine connaissance ». Le mot grec peut désigner une connaissance plus complète ou plus profonde.
    reason: lexical_alternative
  - marker: b
    text: « Spirituelles » peut indiquer le caractère de cette sagesse et de cette intelligence, ou signifier qu’elles sont données par l’Esprit.
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: C’est pourquoi
  rationale: Cette expression rend naturellement la valeur causale et déductive de διά avec l’accusatif, qui renvoie à ce qui précède.
- source_word: καὶ ἡμεῖς
  choice: nous aussi
  rationale: Cette formulation conserve l’inclusion emphatique de Paul et de ses compagnons.
- source_word: ἀφ’ ἧς ἡμέρας ἠκούσαμεν
  choice: depuis le jour où nous en avons entendu parler
  rationale: « Depuis » marque clairement le point de départ de l’action continue. Le pronom « en » reprend sans la préciser la nouvelle évoquée dans le contexte.
- source_word: οὐ παυόμεθα
  choice: nous ne cessons
  rationale: Le présent français exprime ici une action continue depuis le jour mentionné jusqu’au moment où Paul écrit.
- source_word: ὑπὲρ ὑμῶν
  choice: pour vous
  rationale: Rendu idiomatique de ὑπέρ au sens de bénéficiaire de la prière.
- source_word: προσευχόμενοι καὶ αἰτούμενοι
  choice: de prier pour vous et de demander
  rationale: 'Les deux verbes sont maintenus : le premier désigne la prière en général, le second en précise la requête.'
- source_word: ἵνα πληρωθῆτε
  choice: que vous soyez remplis
  rationale: Le passif est conservé et laisse implicite l’agent, comme en grec.
- source_word: τὴν ἐπίγνωσιν
  choice: de la connaissance
  rationale: Le nom « connaissance » évite de rendre obligatoire l’idée d’une connaissance exhaustive, tout en permettant de signaler en note la possible nuance intensive.
- source_word: τοῦ θελήματος αὐτοῦ
  choice: de sa volonté
  rationale: Traduction directe et idiomatique du génitif grec.
- source_word: ἐν πάσῃ σοφίᾳ καὶ συνέσει πνευματικῇ
  choice: avec toute la sagesse et l’intelligence spirituelles
  rationale: « Avec » exprime naturellement l’accompagnement ou la manière. L’adjectif au pluriel porte sur les deux noms sans préciser s’il décrit leur caractère spirituel ou leur origine dans l’Esprit.
- source_word: σοφίᾳ
  choice: sagesse
  rationale: Équivalent français courant qui peut désigner une sagesse à la fois pratique et théologique.
- source_word: συνέσει
  choice: intelligence
  rationale: Le terme exprime la faculté de comprendre et forme en français un couple naturel avec « sagesse ».
theological_decisions:
- issue: Portée de ἐπίγνωσις dans la prière de Paul
  choice: connaissance
  alternative: pleine connaissance
  rationale: ἐπίγνωσις peut comporter une nuance de connaissance plus complète ou plus profonde, mais cette intensification n’est pas imposée sans ambiguïté par la syntaxe. La traduction principale reste sobre et la nuance est conservée en note.
- issue: Référence de πνευματικῇ
  choice: « spirituelles » qualifie à la fois la sagesse et l’intelligence sans nommer explicitement l’Esprit Saint
  alternative: sagesse et intelligence données par l’Esprit
  rationale: L’adjectif peut désigner leur caractère spirituel ou leur relation à l’Esprit. Le texte principal préserve cette ouverture, tandis que la note explicite les deux possibilités.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase conserve le mouvement continu de la longue proposition grecque tout en employant une syntaxe immédiatement compréhensible. Le pluriel « spirituelles » indique clairement que l’adjectif se rapporte aux deux noms.
