source:
  edition: SBLGNT
  text: ἧς ἐγενόμην ἐγὼ διάκονος κατὰ τὴν οἰκονομίαν τοῦ θεοῦ τὴν δοθεῖσάν μοι εἰς ὑμᾶς πληρῶσαι τὸν λόγον τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/025.yaml
  text: of which I became a servant according to the stewardship from God given to me for you[a], to fulfill the word of God[b],
translation:
  language: fr
  text: Je suis devenu le serviteur de cette Église, conformément à la charge que Dieu m’a confiée pour vous, afin d’accomplir la parole de Dieu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de faire pleinement connaître la parole de Dieu » ou « d’achever la parole de Dieu ».
    reason: 'La portée de πληρῶσαι est discutée : le verbe peut désigner l’accomplissement, l’achèvement ou la pleine proclamation de la parole.'
lexical_decisions:
- source_word: ἧς
  choice: de cette Église
  rationale: Le pronom relatif féminin singulier renvoie à ἐκκλησία au verset précédent. La reprise explicite par « cette Église » est naturelle en français et lève seulement une difficulté grammaticale, sans modifier le référent.
- source_word: ἐγενόμην ἐγὼ διάκονος
  choice: je suis devenu serviteur
  rationale: « Suis devenu » exprime l’entrée dans cette fonction. « Serviteur » rend le service exercé sans importer le sens ultérieur d’un office ecclésiastique précis que pourrait suggérer « diacre ».
- source_word: κατὰ τὴν οἰκονομίαν τοῦ θεοῦ τὴν δοθεῖσάν μοι
  choice: selon la charge que Dieu m’a confiée
  rationale: Dans ce contexte, οἰκονομία désigne une responsabilité ou mission confiée. « Charge » conserve l’idée d’une responsabilité reçue, tandis que « confiée » exprime idiomatiquement en français l’action divine indiquée par le participe passif.
- source_word: εἰς ὑμᾶς
  choice: pour vous
  rationale: La formule marque l’orientation et le bénéfice de la charge de Paul envers les destinataires.
- source_word: πληρῶσαι
  choice: accomplir
  rationale: Le verbe peut évoquer l’accomplissement, l’achèvement ou le fait de donner toute son ampleur à la proclamation. « Accomplir » maintient cette ouverture sémantique sans réduire le sens à la seule annonce.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: la parole de Dieu
  rationale: Cette formulation française établie conserve à la fois le sens de message divin proclamé et les résonances bibliques de λόγος.
theological_decisions:
- issue: Sens de πληρῶσαι τὸν λόγον τοῦ θεοῦ
  choice: accomplir la parole de Dieu
  alternative: faire pleinement connaître la parole de Dieu ; achever la parole de Dieu
  rationale: Le contexte suivant, qui parle du mystère désormais manifesté, favorise l’idée de porter la parole à sa pleine expression ou proclamation, mais la construction grecque n’exclut pas les nuances d’accomplissement ou d’achèvement. Le texte principal conserve donc la tension, et la note présente les principales possibilités.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure « C’est de cette Église que » assure un lien naturel avec le verset précédent. « Charge » est moins technique que « intendance » ou « administration » et évite le jargon ecclésiastique de « ministère », tout en conservant l’idée d’une responsabilité confiée.
