  text: Car il a plu à toute la plénitude d’habiter en lui[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Parce qu’il a plu à toute la plénitude d’habiter en lui. » Dans ce contexte, la conjonction grecque peut introduire l’explication de plusieurs manières.'
    reason: lexical_alternative
  - marker: b
    text: 'Beaucoup de traductions rendent explicite un sujet sous-entendu : « Car Dieu a trouvé bon de faire habiter en lui toute sa plénitude » ou « Car le Père a trouvé bon… » Le grec ne nomme pas directement ce sujet.'
    reason: alternative_reading
