source:
  edition: SBLGNT
  text: τοῦ παρόντος εἰς ὑμᾶς, καθὼς καὶ ἐν παντὶ τῷ ⸀κόσμῳ ἐστὶν καρποφορούμενον καὶ αὐξανόμενον καθὼς καὶ ἐν ὑμῖν, ἀφ’ ἧς ἡμέρας ἠκούσατε καὶ ἐπέγνωτε τὴν χάριν τοῦ θεοῦ ἐν ἀληθείᾳ·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/006.yaml
  text: which has come to you[a], just as also in all the world it is bearing fruit and growing, just as also among you[d][c][b], from the day you heard and came to know the grace of God in truth.
translation:
  language: fr
  text: qui vous est parvenue[a] et qui, dans le monde entier[b], porte du fruit et grandit, tout comme parmi vous[c], depuis le jour où vous l’avez entendue et où vous avez connu la grâce de Dieu en vérité[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qui est présente auprès de vous » ou « qui est arrivée parmi vous ».
    reason: lexical_alternative
  - marker: b
    text: Ou « partout dans le monde ».
    reason: lexical_alternative
  - marker: c
    text: Ou « en vous » ; le grec peut désigner la communauté dans son ensemble ou l’œuvre de la Bonne Nouvelle à l’intérieur des croyants.
    reason: lexical_alternative
  - marker: d
    text: Ou « véritablement » ou « dans la vérité ».
    reason: alternative_reading
lexical_decisions:
- source_word: τοῦ παρόντος εἰς ὑμᾶς
  choice: qui vous est parvenue
  rationale: Le participe substantivé poursuit la description de « la parole de vérité, la Bonne Nouvelle » du verset précédent. « Vous est parvenue » exprime naturellement en français son arrivée et sa présence auprès des Colossiens.
- source_word: καθὼς καὶ
  choice: tout comme
  rationale: Cette tournure française rend la comparaison et l’inclusion exprimées par καθὼς καὶ sans alourdir la phrase par un calque de « aussi ».
- source_word: ἐν παντὶ τῷ κόσμῳ
  choice: dans le monde entier
  rationale: La formule conserve la portée universelle et rhétorique du grec tout en restant naturelle en français.
- source_word: ἐστὶν καρποφορούμενον καὶ αὐξανόμενον
  choice: elle porte du fruit et grandit
  rationale: Les deux verbes gardent la métaphore organique et décrivent une action en cours. Le présent français suffit naturellement à exprimer cette continuité.
- source_word: καθὼς καὶ ἐν ὑμῖν
  choice: tout comme parmi vous
  rationale: « Parmi vous » convient à l’adresse communautaire et au parallèle avec l’activité de la Bonne Nouvelle dans le monde, sans exclure son œuvre intérieure chez les croyants.
- source_word: ἀφ’ ἧς ἡμέρας
  choice: depuis le jour où
  rationale: Cette formulation idiomatique marque le point de départ d’une action dont les effets se poursuivent.
- source_word: ἠκούσατε
  choice: vous l’avez entendue
  rationale: L’accord et le pronom reprennent naturellement la Bonne Nouvelle ou la parole mentionnée au verset précédent, sans ajouter l’idée de « première fois », absente du grec.
- source_word: ἐπέγνωτε
  choice: vous avez connu
  rationale: « Connu » laisse place à une connaissance véritable et reconnue, sans surtraduire le préverbe par « pleinement compris ».
- source_word: τὴν χάριν τοῦ θεοῦ
  choice: la grâce de Dieu
  rationale: Cette expression claire et consacrée conserve la construction génitive et le poids théologique de la formule paulinienne.
- source_word: ἐν ἀληθείᾳ
  choice: en vérité
  rationale: Cette formulation concise conserve l’ambiguïté entre la manière — « véritablement » — et le domaine ou contenu — « dans la vérité ».
theological_decisions:
- issue: Portée de « dans le monde entier »
  choice: Conserver l’expression universelle du grec comme description ample de la diffusion de la Bonne Nouvelle.
  alternative: Comprendre l’expression comme une affirmation géographique strictement exhaustive, selon laquelle chaque région et chaque personne avaient déjà été atteintes.
  rationale: Le texte emploie un langage universel pour souligner l’expansion de la Bonne Nouvelle. La traduction ne restreint ni n’explicite davantage cette portée.
- issue: Nuance de ἐν ἀληθείᾳ
  choice: Employer « en vérité » afin de maintenir l’ambiguïté entre manière et domaine ou contenu.
  alternative: Traduire exclusivement par « véritablement » ou par « dans la vérité ».
  rationale: La construction grecque permet ces nuances proches; le texte principal évite de trancher inutilement.
- issue: Lieu de l’action de la Bonne Nouvelle dans ἐν ὑμῖν
  choice: Employer « parmi vous » en privilégiant le cadre communautaire sans exclure une œuvre intérieure.
  alternative: Employer « en vous », qui pourrait souligner plus directement l’action intérieure chez les destinataires.
  rationale: Le pluriel et le parallèle avec le monde favorisent une lecture communautaire, mais le grec demeure susceptible d’une nuance intérieure, signalée en note.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase reste liée au verset précédent, conformément à la syntaxe grecque. Les métaphores de fécondité et de croissance sont conservées, de même que les ambiguïtés de ἐν ὑμῖν et ἐν ἀληθείᾳ.
