source:
  edition: SBLGNT
  text: τοῖς ἐν ⸀Κολοσσαῖς ἁγίοις καὶ πιστοῖς ἀδελφοῖς ἐν Χριστῷ· χάρις ὑμῖν καὶ εἰρήνη ἀπὸ θεοῦ πατρὸς ⸀ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/002.yaml
  text: 'To the holy and faithful brothers in Messiah at Colossae: grace to you and peace from God our Father[a][b][c].'
translation:
  language: fr
  text: 'Aux frères[b] saints et fidèles[a] en Messie[c] qui sont à Colosses : que la grâce et la paix vous soient données de la part de Dieu notre Père.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « croyants » : le grec πιστοῖς peut désigner ceux qui croient ou ceux qui sont fidèles.'
    reason: lexical_alternative
  - marker: b
    text: Le grec dit littéralement « frères » ; dans ce contexte, Paul s’adresse probablement à toute la communauté, y compris aux femmes.
    reason: lexical_alternative
  - marker: c
    text: 'Traduction traditionnelle : « en Christ ». Le titre grec Χριστός signifie « Messie ».'
    reason: alternative_reading
lexical_decisions:
- source_word: τοῖς ἐν Κολοσσαῖς
  choice: qui sont à Colosses
  rationale: La tournure identifie les destinataires par leur lieu. « À Colosses » est l’expression locative naturelle en français.
- source_word: ἁγίοις
  choice: saints
  rationale: L’adjectif conserve l’idée de personnes mises à part pour Dieu sans transformer le terme en désignation d’une catégorie ecclésiastique ultérieure.
- source_word: πιστοῖς
  choice: fidèles
  rationale: πιστός peut exprimer la fidélité aussi bien que la foi. « Fidèles » convient naturellement à l’adresse, tandis que l’autre nuance est signalée en note.
- source_word: ἀδελφοῖς
  choice: frères
  rationale: Le masculin pluriel du grec est reproduit directement. Une note précise que, dans ce contexte communautaire, il peut inclure les femmes.
- source_word: ἐν Χριστῷ
  choice: en Messie
  rationale: Χριστός garde ici sa valeur de titre. « En Messie » préserve aussi la formulation paulinienne de l’appartenance ou de l’union au Messie.
- source_word: χάρις ὑμῖν καὶ εἰρήνη
  choice: que la grâce et la paix vous soient données
  rationale: Cette formulation française naturelle rend la salutation grecque nominale sans en modifier le contenu.
- source_word: ἀπὸ θεοῦ πατρὸς ἡμῶν
  choice: de la part de Dieu notre Père
  rationale: 'La construction est comprise comme appositionnelle : Dieu est notre Père. Aucun « et » absent du grec n’est ajouté.'
theological_decisions:
- issue: Sens de πιστοῖς
  choice: fidèles
  alternative: croyants
  rationale: Le contexte ne tranche pas entièrement entre la fidélité et le fait de croire; le texte principal retient « fidèles » et la note maintient l’autre possibilité.
- issue: Portée de ἀδελφοῖς
  choice: frères
  alternative: frères et sœurs
  rationale: « Frères » reflète la forme masculine grecque, tandis qu’une note indique que l’ensemble de la communauté, femmes comprises, est probablement visé.
- issue: Rendu du titre Χριστός
  choice: Messie
  alternative: Christ
  rationale: Le terme grec est un titre signifiant « Messie ». La forme traditionnelle « Christ » est conservée en note.
translation_notes:
  register: Français international actuel, digne et accessible. La syntaxe de l’adresse reste proche du grec, tandis que la formule de salutation est légèrement explicitée pour être idiomatique. Les ambiguïtés de πιστοῖς et de la portée de ἀδελφοῖς sont conservées par des notes.
