id: COL.1.7
reference: Colossians 1:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸀καθὼς ἐμάθετε ἀπὸ Ἐπαφρᾶ τοῦ ἀγαπητοῦ συνδούλου ἡμῶν, ὅς ἐστιν πιστὸς ὑπὲρ ⸀ἡμῶν διάκονος τοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/007.yaml
  text: just as you learned from Epaphras[a], our beloved fellow servant, who is a faithful minister of the Messiah on our behalf[c][b],
translation:
  language: fr
  text: comme vous l’avez appris d’Épaphras, notre bien-aimé compagnon d’esclavage[a], qui est un fidèle serviteur du Messie[b] en notre faveur[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec σύνδουλος désigne littéralement quelqu’un qui est esclave avec un autre sous le même maître. On pourrait aussi traduire « notre bien-aimé compagnon de service ».
    reason: lexical_alternative
  - marker: b
    text: Grec Χριστοῦ (Christou), traditionnellement rendu par « du Christ » ; « du Messie » fait ressortir ici la valeur du titre.
    reason: lexical_alternative
  - marker: c
    text: Ou « pour nous ». Quelques manuscrits portent « en votre faveur » ou « pour vous ».
    reason: textual_and_translation_alternative
lexical_decisions:
- source_word: καθὼς
  choice: comme
  rationale: Introduit naturellement en français la correspondance avec l’affirmation précédente, sans alourdir la phrase par « tout comme ».
- source_word: ἐμάθετε ἀπὸ Ἐπαφρᾶ
  choice: vous l’avez appris d’Épaphras
  rationale: Le pronom « l’ » reprend naturellement en français le contenu de l’Évangile mentionné dans le contexte, bien qu’il soit implicite en grec; « d’Épaphras » conserve l’idée de source exprimée par ἀπό.
- source_word: τοῦ ἀγαπητοῦ συνδούλου ἡμῶν
  choice: notre compagnon d’esclavage bien-aimé
  rationale: « Compagnon d’esclavage » préserve l’appartenance commune à un même maître exprimée par σύνδουλος; « bien-aimé » garde la force affective de ἀγαπητός.
- source_word: πιστὸς
  choice: fidèle
  rationale: Exprime ici la fiabilité et la constance d’Épaphras dans son service.
- source_word: διάκονος
  choice: serviteur
  rationale: Désigne une personne qui accomplit un service sans imposer ici le sens technique ultérieur de « diacre » ni la coloration ecclésiastique moderne de « ministre ».
- source_word: τοῦ Χριστοῦ
  choice: du Messie
  rationale: Rend le contenu titulaire de Χριστός, « l’Oint », plutôt que de le traiter seulement comme un nom propre.
- source_word: ὑπὲρ ἡμῶν
  choice: en notre faveur
  rationale: Conserve la nuance de bénéfice ou de représentation de ὑπέρ avec le génitif, tout en évitant le français plus vague « pour nous » dans le texte principal.
theological_decisions:
- issue: Image de σύνδουλος et relation au même maître
  choice: compagnon d’esclavage
  alternative: compagnon de service
  rationale: Le choix principal maintient la condition servile impliquée par le grec et l’idée d’une appartenance commune, sans la réduire à une simple collaboration volontaire.
- issue: Valeur de Χριστός
  choice: Messie
  alternative: Christ
  rationale: Dans ce groupe nominal, le mot désigne celui que sert Épaphras et conserve sa valeur de titre; « Messie » en rend explicitement le sens.
- issue: Portée de ὑπὲρ ἡμῶν
  choice: en notre faveur
  alternative: pour nous
  rationale: La formulation retenue préserve à la fois le bénéfice et la possible représentation, sans préciser davantage que le grec.
translation_notes:
  register: Français international actuel, digne et lisible. « Compagnon d’esclavage » est volontairement marqué afin de préserver l’image grecque; la note offre une formulation française plus douce. La syntaxe suit le mouvement de la phrase grecque tout en ajoutant le pronom de reprise « l’ », nécessaire à un français naturel dans ce contexte.
