review_pass:
  verdict: revise
  source_fidelity: Le passif de ἀποκατηλλάγητε est correctement rendu, de même que « corps de chair », le moyen « par la mort » et les trois qualifications finales. En revanche, « afin qu’il vous présente » introduit un sujet explicite pour παραστῆσαι. Le grec emploie un infinitif actif dont l’agent est implicite; dans le contexte, l’identification précise des référents pronominaux ne doit pas être imposée.
  naturalness: La phrase est claire et de registre moderne soutenu. La reformulation du but par un subjonctif passif est naturelle en français et évite de faire référer sans nécessité « il » au possesseur de « son corps ».
  terminology: « saints », « sans défaut » et « irréprochables » constituent une série française lisible qui conserve, autant que possible, les nuances de consécration, d’intégrité et d’irréprochabilité. La note sur « sans tache » préserve utilement la résonance sacrificielle possible.
  issues:
  - severity: medium
    issue: Le sujet « il » est explicité dans « afin qu’il vous présente ».
    rationale: Le texte grec ne formule pas le sujet de l’infinitif παραστῆσαι. Dans cette phrase française, « il » risque en outre d’être lu comme renvoyant au même référent que « son » dans « son corps », alors que le verset grec ne résout pas explicitement cette question par la forme de l’infinitif. Un tour passif français conserve le but sans trancher ce référent.
  revised_text: Mais maintenant, vous avez été réconciliés[a] dans son corps de chair par la mort, afin que vous soyez présentés saints, sans défaut[b] et irréprochables devant lui.
