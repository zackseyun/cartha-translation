id: COL.1.22
reference: Colossians 1:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: νυνὶ δὲ ⸀ἀποκατηλλάγητε ἐν τῷ σώματι τῆς σαρκὸς αὐτοῦ διὰ τοῦ θανάτου— παραστῆσαι ὑμᾶς ἁγίους καὶ ἀμώμους καὶ ἀνεγκλήτους κατενώπιον αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/022.yaml
  text: But now he has reconciled you in his body of flesh through death[a], to present you holy and blameless and beyond reproach before him[b],
translation:
  language: fr
  text: Mais maintenant, vous avez été réconciliés[a] dans son corps de chair par la mort, afin que vous soyez présentés saints, sans défaut[b] et irréprochables devant lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le verbe grec est au passif : « vous avez été réconciliés ». D’après le contexte, on peut aussi expliciter l’agent : « il vous a réconciliés ».'
    reason: Précise la voix passive du verbe grec et signale une formulation française possible avec agent explicite, sans l’imposer dans le texte principal.
  - marker: b
    text: Ou « sans tache » ; le terme grec peut évoquer une offrande exempte de défaut.
    reason: Signale la nuance sacrificielle possible de ἀμώμους.
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: Mais maintenant
  rationale: Rend à la fois le contraste avec l’état antérieur décrit au verset précédent et la transition temporelle vers la situation présente.
- source_word: ἀποκατηλλάγητε
  choice: vous avez été réconciliés
  rationale: La forme grecque transmise ici est un aoriste passif à la deuxième personne du pluriel. Le passif français respecte cette forme sans expliciter silencieusement l’agent.
- source_word: ἐν τῷ σώματι τῆς σαρκὸς αὐτοῦ
  choice: dans son corps de chair
  rationale: Conserve l’insistance concrète sur le corps et la chair, celle-ci désignant ici la réalité physique et non une nature pécheresse.
- source_word: διὰ τοῦ θανάτου
  choice: par la mort
  rationale: Exprime le moyen indiqué par διά avec le génitif, sans ajouter un possessif absent de l’expression grecque.
- source_word: παραστῆσαι
  choice: afin qu’il vous présente
  rationale: Rend la valeur de but de l’infinitif et son sens transitif de faire comparaître ou de présenter quelqu’un.
- source_word: ἁγίους
  choice: saints
  rationale: Terme courant qui garde les notions de consécration et de pureté.
- source_word: ἀμώμους
  choice: sans défaut
  rationale: Préserve naturellement en français la possible résonance sacrificielle du terme, celle d’une victime sans défaut.
- source_word: ἀνεγκλήτους
  choice: irréprochables
  rationale: Exprime l’idée qu’aucune accusation fondée ne peut être retenue, tout en restant naturel et distinct de « sans défaut ».
- source_word: κατενώπιον αὐτοῦ
  choice: devant lui
  rationale: Maintient le cadre de présence et d’évaluation sans préciser au-delà du texte grec le référent du pronom.
theological_decisions:
- issue: Voix et agent de ἀποκατηλλάγητε
  choice: 'Conserver le passif : « vous avez été réconciliés »'
  alternative: « il vous a réconciliés »
  rationale: Le texte grec fourni porte une forme passive et ne nomme pas grammaticalement l’agent. Le passif français préserve cette donnée et l’initiative divine implicite sans imposer un sujet explicite.
- issue: Sens de σάρξ
  choice: 'Le sens physique : « chair »'
  alternative: « nature pécheresse »
  rationale: La mention du corps et de la mort souligne ici l’existence corporelle réelle; le sens moral ou métaphorique ne convient pas au contexte.
- issue: Rapport entre ἀμώμους et ἀνεγκλήτους
  choice: « sans défaut et irréprochables »
  alternative: « sans tache et au-dessus de toute accusation »
  rationale: Le choix retenu maintient la distinction entre la possible image sacrificielle et la dimension judiciaire ou morale, sans alourdir la phrase.
- issue: Référent de αὐτοῦ
  choice: Garder « lui » sans identification ajoutée
  alternative: Expliciter « Dieu » ou « Christ »
  rationale: Le pronom grec peut être compris à partir du contexte, mais le verset lui-même ne répète pas son référent; la traduction conserve cette ouverture.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe reste proche du mouvement de la phrase grecque, tandis que « afin qu’il vous présente » évite un infinitif français ambigu ou maladroit. Les trois qualificatifs finaux sont maintenus séparément.
