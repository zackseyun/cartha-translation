  text: Paul[a], an apostle of Messiah Jesus by the will of God, and Timothy our brother[b],
translation:
  language: fr
  text: Paul, apôtre de Jésus le Messie[a], par la volonté de Dieu, et Timothée, notre frère[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « du Christ Jésus ». Le mot grec Christos signifie « Messie ».'
