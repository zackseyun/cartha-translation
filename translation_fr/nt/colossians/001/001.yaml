  - marker: b
    text: 'Littéralement : « le frère ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Παῦλος
  choice: Paul
  rationale: Forme française traditionnelle et courante du nom grec Παῦλος.
- source_word: ἀπόστολος
  choice: apôtre
  rationale: Dans cette présentation de Paul, le terme désigne sa fonction d’envoyé mandaté; « apôtre » en conserve la portée reconnue.
- source_word: Χριστοῦ Ἰησοῦ
  choice: du Messie Jésus
  rationale: Le génitif dépend d’« apôtre ». « Messie » rend le sens titulaire de Χριστός tout en conservant l’ordre des éléments grecs.
- source_word: διὰ θελήματος θεοῦ
  choice: par la volonté de Dieu
  rationale: Avec le génitif, διά exprime ici ce par quoi l’apostolat de Paul est établi; cette tournure française est naturelle et fidèle.
- source_word: Τιμόθεος
  choice: Timothée
  rationale: Forme française traditionnelle et courante du nom grec Τιμόθεος.
- source_word: ὁ ἀδελφὸς
  choice: notre frère
  rationale: Le grec dit littéralement « le frère »; « notre frère » exprime naturellement en français la relation communautaire impliquée dans cette adresse.
theological_decisions:
- issue: Valeur de Χριστός
  choice: Messie
  alternative: Christ
  rationale: Χριστός garde ici sa valeur de titre. « Messie » en explicite le sens sans réduire le terme à un simple élément de nom; la forme ecclésiale traditionnelle « Christ » reste signalée en note.
- issue: Portée relationnelle de ὁ ἀδελφός
  choice: notre frère
  alternative: le frère
  rationale: L’ajout du possessif, implicite dans la relation communautaire, produit un français idiomatique sans transformer Timothée en frère biologique de Paul.
translation_notes:
  register: Français moderne, digne et accessible. La syntaxe brève d’une adresse épistolaire est conservée, ainsi que la virgule finale qui appelle la suite de la salutation.
