  text: ὅς ἐστιν εἰκὼν τοῦ θεοῦ τοῦ ἀοράτου, πρωτότοκος πάσης κτίσεως,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/015.yaml
  text: He is the image of the invisible God[a], the firstborn of all creation.
translation:
  language: fr
  text: Il est l’image du Dieu invisible, le premier-né de toute la création.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’expression « premier-né de toute la création » peut évoquer le rang suprême et les droits d’héritage, plutôt que signifier que le Fils fait partie de la création. Voir l’explication dans les versets suivants. On peut aussi traduire : « le premier-né au-dessus de toute la création ».'
    reason: Clarifier l’ambiguïté du génitif grec et la portée biblique de « premier-né », tout en signalant une autre traduction contextuelle possible.
lexical_decisions:
- source_word: ὅς ἐστιν
  choice: Il est
  rationale: Le pronom relatif renvoie au Fils mentionné au verset précédent. En français, une nouvelle proposition avec « Il est » est naturelle et claire.
- source_word: εἰκὼν
  choice: l’image
  rationale: « Image » conserve les dimensions de représentation et de révélation du terme grec sans les expliciter excessivement.
- source_word: τοῦ θεοῦ τοῦ ἀοράτου
  choice: du Dieu invisible
  rationale: Cette formulation rend naturellement la construction génitive et l’adjectif attributif grec.
- source_word: πρωτότοκος
  choice: le premier-né
  rationale: Le choix maintient la métaphore biblique et ses associations possibles de rang, de priorité et d’héritage, sans la réduire à une seule interprétation.
- source_word: πάσης κτίσεως
  choice: de toute la création
  rationale: Cette traduction reproduit directement le génitif grec et préserve sa tension interprétative; le contexte immédiat des versets 16-17 contribue à en préciser la portée.
theological_decisions:
- issue: Sens de πρωτότοκος πάσης κτίσεως concernant le rapport du Fils à la création
  choice: le premier-né de toute la création
  alternative: le premier-né au-dessus de toute la création
  rationale: Le génitif grec est rendu formellement plutôt que remplacé dans le texte par une interprétation de rang. La note indique que « premier-né » peut exprimer la prééminence et les droits d’héritage; les versets suivants présentent le Fils comme celui par qui et pour qui tout a été créé. Cela préserve la formulation et la tension du texte source sans suggérer comme conclusion imposée qu’il ferait partie des êtres créés.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation reste proche de la structure grecque tout en constituant une phrase française naturelle; la note conserve l’ambiguïté réelle sans imposer dans le corps du texte une paraphrase doctrinale.
