id: COL.1.12
reference: Colossians 1:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εὐχαριστοῦντες τῷ πατρὶ τῷ ἱκανώσαντι ⸀ὑμᾶς εἰς τὴν μερίδα τοῦ κλήρου τῶν ἁγίων ἐν τῷ φωτί,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/012.yaml
  text: giving thanks to the Father[a], who has qualified you for the share of the inheritance of the saints in the light[b],
translation:
  language: fr
  text: rendant grâce au Père, qui vous[a] a rendus aptes à recevoir une part de l’héritage des saints dans la lumière[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Certains manuscrits portent « nous » au lieu de « vous ».
    reason: textual_variant
  - marker: b
    text: 'Ou : « la part attribuée aux saints dans la lumière »; le grec évoque un héritage réparti ou attribué par lot.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐχαριστοῦντες
  choice: rendant grâce
  rationale: Le participe présent poursuit la phrase et exprime une action continue. « Rendant grâce » est naturel, digne et conserve la construction participiale.
- source_word: τῷ πατρὶ
  choice: au Père
  rationale: Le grec porte explicitement le titre relationnel défini « le Père »; l’ajout de « Dieu » n’est pas nécessaire.
- source_word: ἱκανώσαντι
  choice: qui a rendus aptes
  rationale: ἱκανόω signifie rendre suffisant, capable ou apte. Cette formulation française évite le calque administratif « qualifier » ainsi que « rendre dignes », qui pourrait suggérer un mérite moral absent du terme.
- source_word: ὑμᾶς
  choice: vous
  rationale: Le texte du SBLGNT lit ὑμᾶς, « vous ». La variante ἡμᾶς, « nous », est signalée en note.
- source_word: εἰς τὴν μερίδα τοῦ κλήρου
  choice: à recevoir une part de l’héritage
  rationale: La formulation rend l’idée de participation exprimée par μερίς et la valeur d’héritage ou de lot attribué de κλῆρος, dans un français naturel. « Recevoir » explicite sobrement la destination exprimée par εἰς.
- source_word: τῶν ἁγίων
  choice: des saints
  rationale: Le terme désigne le peuple consacré à Dieu. « Saints » conserve le vocabulaire paulinien et son lien lexical avec la sainteté sans ajouter une périphrase interprétative.
- source_word: ἐν τῷ φωτί
  choice: dans la lumière
  rationale: La traduction conserve l’image et l’ambiguïté d’attachement de la locution grecque, sans préciser au-delà du texte la nature de cette lumière.
theological_decisions:
- issue: Variante textuelle du pronom complément
  choice: vous
  alternative: nous
  rationale: Le texte source fourni porte ὑμᾶς (« vous »). La leçon ἡμᾶς (« nous »), attestée dans certains manuscrits, est conservée en note plutôt que passée sous silence.
- issue: Rapport entre la part, l’héritage et les saints
  choice: une part de l’héritage des saints dans la lumière
  alternative: la part attribuée aux saints dans la lumière
  rationale: Le texte principal garde à la fois les notions de part et d’héritage et laisse ouverte la relation exacte de « dans la lumière ». La note signale l’image du lot attribué sans imposer une lecture théologique plus précise.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La syntaxe participiale est maintenue afin de préserver le lien avec le contexte précédent. « Rendus aptes » communique l’action du Père sans suggérer que les destinataires se seraient eux-mêmes rendus dignes.
