id: COL.1.17
reference: Colossians 1:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ αὐτός ἐστιν πρὸ πάντων καὶ τὰ πάντα ἐν αὐτῷ συνέστηκεν,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/017.yaml
  text: And he is before all things[b][a], and in him all things hold together.
translation:
  language: fr
  text: Il est avant toutes choses[a], et toutes choses tiennent ensemble en lui[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Avant toutes choses » peut aussi suggérer sa suprématie sur toutes choses, mais le grec exprime principalement l’antériorité.
    reason: alternative_reading
  - marker: b
    text: 'Ou : « toutes choses subsistent en lui » ou « toutes choses trouvent leur cohésion en lui ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτός
  choice: il
  rationale: Le pronom grec est emphatique par sa position. Dans le contexte immédiat, le français peut rendre cette reprise avec « il » sans ajouter une tournure lourde comme « lui-même ».
- source_word: πρὸ πάντων
  choice: avant toutes choses
  rationale: Avec le génitif, πρό exprime ici principalement l’antériorité. « Avant toutes choses » conserve cette priorité sans réduire l’expression à une simple supériorité de rang.
- source_word: τὰ πάντα
  choice: toutes choses
  rationale: Cette formulation large conserve la répétition et l’ampleur de l’expression grecque dans le contexte, sans la limiter explicitement à « toute la création ».
- source_word: ἐν αὐτῷ
  choice: en lui
  rationale: La traduction directe « en lui » préserve la relation exprimée par ἐν sans la remplacer par les formulations plus interprétatives « par lui » ou « grâce à lui ».
- source_word: συνέστηκεν
  choice: subsistent
  rationale: Le parfait grec décrit un état présent résultant d’une action antérieure. « Subsistent » exprime que toutes choses demeurent constituées et maintenues ensemble, tout en restant naturel dans un registre biblique moderne et digne.
theological_decisions:
- issue: Rapport du Christ à toutes choses dans πρὸ πάντων
  choice: L’antériorité est exprimée par « avant toutes choses ».
  alternative: La suprématie de rang pourrait être explicitée par « au-dessus de toutes choses ».
  rationale: La construction grecque exprime d’abord la priorité. Dans Colossiens 1.15-20, elle contribue à la haute christologie du passage, mais la traduction ne doit pas transformer cette implication contextuelle en paraphrase doctrinale.
- issue: Portée de συνέστηκεν
  choice: « Toutes choses subsistent en lui » exprime leur cohésion et leur maintien durable en Christ.
  alternative: « Toutes choses tiennent ensemble en lui » mettrait plus directement en relief la cohésion cosmique.
  rationale: Le grec permet les nuances de consistance, de cohésion et de maintien. Le choix principal préserve cette densité et la note signale l’autre formulation naturelle sans résoudre excessivement la portée du verbe.
translation_notes:
  register: Français international moderne, concis et digne. « Subsistent » garde la densité théologique et la valeur résultative du parfait grec; la note fournit des équivalents plus explicites. Les marqueurs suivent immédiatement les expressions concernées.
