id: COL.1.13
reference: Colossians 1:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὃς ἐρρύσατο ἡμᾶς ἐκ τῆς ἐξουσίας τοῦ σκότους καὶ μετέστησεν εἰς τὴν βασιλείαν τοῦ υἱοῦ τῆς ἀγάπης αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/013.yaml
  text: who rescued us from the authority of darkness and transferred us into the kingdom of the Son of his love,[a]
translation:
  language: fr
  text: Il nous a arrachés à l’autorité des ténèbres et nous a transférés dans le royaume du Fils de son amour.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de son Fils bien-aimé » ou « du Fils qu’il aime »
    reason: Alternative lexicale et syntaxique pour la construction τοῦ υἱοῦ τῆς ἀγάπης αὐτοῦ.
lexical_decisions:
- source_word: ἐρρύσατο
  choice: a arrachés
  rationale: Le verbe ῥύομαι évoque une délivrance décisive face à un danger ou à une puissance hostile. « Arracher à » exprime naturellement cette intervention en français, sans ajouter de terminologie doctrinale.
- source_word: ἐξουσίας
  choice: l’autorité
  rationale: ἐξουσία désigne ici l’autorité ou le pouvoir souverain exercé. « Autorité » reste proche du grec et maintient le parallèle implicite entre deux régimes.
- source_word: σκότους
  choice: des ténèbres
  rationale: σκότος signifie « ténèbres ». Ses connotations morales et spirituelles restent implicites, comme dans le grec.
- source_word: μετέστησεν
  choice: a transférés
  rationale: μεθίστημι décrit le passage d’une situation ou d’un domaine à un autre. « Transférer » conserve nettement le mouvement entre deux sphères d’autorité.
- source_word: βασιλείαν
  choice: le royaume
  rationale: βασιλεία peut désigner le règne ou le royaume. Avec εἰς et l’image d’un transfert, « royaume » exprime naturellement l’entrée dans la sphère gouvernée par le Fils.
- source_word: υἱοῦ
  choice: Fils
  rationale: υἱός signifie « fils ». La majuscule indique que le mot désigne ici le Fils unique évoqué dans ce passage christologique, sans modifier le sens lexical.
- source_word: τοῦ υἱοῦ τῆς ἀγάπης αὐτοῦ
  choice: du Fils de son amour
  rationale: Cette formulation conserve la construction génitivale marquée du grec, littéralement « le Fils de son amour », tout en demeurant compréhensible en français. Une note donne les formulations idiomatiques possibles.
theological_decisions:
- issue: Interprétation de τοῦ υἱοῦ τῆς ἀγάπης αὐτοῦ
  choice: du Fils de son amour
  alternative: de son Fils bien-aimé ; du Fils qu’il aime
  rationale: Le texte principal préserve l’expression singulière du grec et sa densité théologique sans décider si le génitif doit être reformulé comme qualité (« bien-aimé ») ou comme relation verbale (« qu’il aime »). Les deux interprétations idiomatiques figurent en note.
translation_notes:
  register: Français international moderne, digne et accessible. « Arrachés à » est plus vivant que « délivrés de » tout en restant fidèle à l’idée de sauvetage. La tournure inhabituelle « le Fils de son amour » est volontairement conservée afin de refléter la texture du grec; la note en facilite l’interprétation.
