id: COL.1.3
reference: Colossians 1:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Εὐχαριστοῦμεν τῷ ⸀θεῷ πατρὶ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ πάντοτε ⸀περὶ ὑμῶν προσευχόμενοι,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/003.yaml
  text: We always give thanks to God[a], the Father of our Lord Jesus the Messiah, when we pray for you,
translation:
  language: fr
  text: Nous rendons toujours grâce à Dieu, le Père de notre Seigneur Jésus le Messie[a], lorsque nous prions pour vous,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, selon la formulation traditionnelle : « Jésus-Christ ».'
    reason: La note conserve la traduction ecclésiale traditionnelle de Χριστός tout en rendant son sens titulaire par « le Messie » dans le texte.
lexical_decisions:
- source_word: Εὐχαριστοῦμεν
  choice: Nous rendons grâce
  rationale: Cette expression traduit naturellement le verbe « remercier, exprimer sa reconnaissance » et convient au registre d’une action de grâce épistolaire.
- source_word: τῷ θεῷ πατρὶ
  choice: à Dieu, le Père
  rationale: 'Les deux datifs sont compris en apposition : Dieu est désigné comme le Père. La virgule rend cette relation claire en français.'
- source_word: τοῦ κυρίου ἡμῶν
  choice: de notre Seigneur
  rationale: « Seigneur » est le titre français courant de κύριος, et le possessif conserve exactement la relation exprimée par le grec.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jésus le Messie
  rationale: Χριστός garde ici sa valeur de titre, « Messie ». L’article, nécessaire à l’expression idiomatique française, explicite cette fonction sans prétendre reproduire un article grec.
- source_word: πάντοτε
  choice: toujours
  rationale: Le mot signifie « toujours, en tout temps ». Placé auprès du verbe principal, il indique que l’action de grâce est constante, tout en laissant la prière en préciser le cadre.
- source_word: περὶ ὑμῶν
  choice: pour vous
  rationale: Avec le vocabulaire de la prière, περί suivi du génitif désigne naturellement les personnes en faveur desquelles on prie.
- source_word: προσευχόμενοι
  choice: lorsque nous prions
  rationale: Le participe présent indique une circonstance concomitante à l’action de grâce. Cette proposition temporelle est naturelle en français et ne surcharge pas la phrase.
theological_decisions:
- issue: Traduction de Χριστός dans l’action de grâce paulinienne
  choice: Messie
  alternative: Christ
  rationale: Le terme demeure intelligible comme titre royal et messianique. « Messie » en communique le sens, tandis que la forme traditionnelle « Christ » est signalée en note sans imposer une différence théologique.
- issue: Portée de πάντοτε
  choice: « toujours » qualifie principalement l’action de grâce
  alternative: '« toujours » peut qualifier la prière : « priant toujours pour vous »'
  rationale: La construction permet une certaine hésitation quant au rattachement de l’adverbe. Sa place et le mouvement de la phrase autorisent son lien avec le verbe principal, mais l’autre rattachement reste grammaticalement possible.
translation_notes:
  register: Français international moderne, clair et digne. « Rendre grâce » conserve le registre biblique sans être archaïque. La ponctuation maintient la phrase ouverte, conformément au fait que le verset se poursuit.
