  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ καὶ δηλώσας ἡμῖν τὴν ὑμῶν ἀγάπην ἐν πνεύματι.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/008.yaml
  text: and who also made known to us your love in the Spirit[a].
translation:
  language: fr
  text: Il nous a aussi fait connaître l’amour que vous avez dans l’Esprit[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’amour que vous avez dans l’esprit », c’est-à-dire un amour spirituel.
    reason: Lecture alternative de ἐν πνεύματι, qui peut décrire la sphère ou la qualité spirituelle de l’amour plutôt que désigner explicitement l’Esprit Saint.
lexical_decisions:
- source_word: ὁ ... δηλώσας
  choice: Il ... a fait connaître
  rationale: Le participe aoriste substantivé renvoie à Épaphras, mentionné au verset précédent. En français, une proposition indépendante avec le pronom « Il » est plus naturelle à l’ouverture d’un verset tout en maintenant ce lien.
- source_word: καὶ
  choice: a aussi
  rationale: « Aussi » exprime naturellement la valeur additive de καί en reliant cette action d’Épaphras à ce qui précède.
- source_word: ἡμῖν
  choice: nous
  rationale: Le datif désigne les destinataires de l’information, Paul et ses compagnons ; le pronom indirect français convient.
- source_word: τὴν ὑμῶν ἀγάπην
  choice: l’amour que vous avez
  rationale: Cette formulation française naturelle conserve ἀγάπη comme « amour » et rend clairement le génitif possessif ὑμῶν sans suggérer que cet amour est dirigé vers Épaphras ou vers Paul.
- source_word: ἐν πνεύματι
  choice: dans l’Esprit
  rationale: La formule conserve la préposition et retient comme sens principal la référence probable à l’Esprit Saint dans l’usage paulinien, sans développer davantage le grec.
theological_decisions:
- issue: Référent de πνεύματι
  choice: « dans l’Esprit », compris principalement comme une référence à l’Esprit Saint
  alternative: « dans votre esprit », ou « votre amour spirituel »
  rationale: Le grec sans article peut désigner l’Esprit Saint ou, plus généralement, la sphère ou la qualité spirituelle de cet amour. Le texte principal retient le sens paulinien probable, tandis que la note préserve l’autre compréhension.
translation_notes:
  register: Français international moderne, clair et digne. « Il » assure le lien avec Épaphras au verset précédent ; « l’amour que vous avez » évite une tournure possessive française potentiellement ambiguë.
