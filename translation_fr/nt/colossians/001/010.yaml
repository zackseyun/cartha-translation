  text: ⸀περιπατῆσαι ἀξίως τοῦ κυρίου εἰς πᾶσαν ἀρεσκείαν ἐν παντὶ ἔργῳ ἀγαθῷ καρποφοροῦντες καὶ αὐξανόμενοι ⸂τῇ ἐπιγνώσει⸃ τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/010.yaml
  text: so as to walk worthily of the Lord[a], to all pleasing, bearing fruit in every good work and growing in the knowledge of God[b],
translation:
  language: fr
  text: afin de vivre d’une manière digne du Seigneur et de lui plaire à tous égards[a], en portant du fruit dans toute bonne œuvre et en grandissant dans la connaissance de Dieu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « en vue de tout ce qui plaît » ou « en vue de plaire à tous égards »; le Seigneur est le référent implicite dans le contexte.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « en grandissant grâce à la connaissance de Dieu ». Le mot traduit par « connaissance » peut aussi évoquer une connaissance plus pleine ou approfondie.'
    reason: lexical_and_syntactical_alternative
lexical_decisions:
- source_word: περιπατῆσαι
  choice: vivre
  rationale: Le verbe signifie littéralement « marcher », mais désigne ici, selon une métaphore paulinienne courante, la manière de vivre. « Vivre » restitue naturellement ce sens en français moderne.
- source_word: ἀξίως τοῦ κυρίου
  choice: d’une manière digne du Seigneur
  rationale: Cette formulation conserve le rapport au Seigneur exprimé par le génitif et indique une conduite qui lui corresponde.
- source_word: εἰς πᾶσαν ἀρεσκείαν
  choice: de lui plaire à tous égards
  rationale: Le grec parle littéralement de « toute satisfaction » sans objet exprimé. En français, la tournure explicite naturellement le Seigneur comme référent implicite du contexte, tout en maintenant l’étendue de πᾶσαν.
- source_word: ἐν παντὶ ἔργῳ ἀγαθῷ καρποφοροῦντες
  choice: en portant du fruit dans toute œuvre bonne
  rationale: « Porter du fruit » préserve la métaphore et son écho probable à Colossiens 1.6; « toute œuvre bonne » conserve la valeur distributive de παντί.
- source_word: αὐξανόμενοι
  choice: en grandissant
  rationale: Le participe présent est coordonné à « portant du fruit ». « Grandir » prolonge naturellement l’image organique.
- source_word: τῇ ἐπιγνώσει τοῦ θεοῦ
  choice: dans la connaissance de Dieu
  rationale: Le datif est compris comme sphère ou domaine de la croissance. « Connaissance » reste clair sans imposer systématiquement à ἐπίγνωσις le sens technique de connaissance complète.
theological_decisions:
- issue: Référent implicite de ἀρεσκείαν
  choice: Expliciter le Seigneur par « lui plaire à tous égards »
  alternative: en vue de tout ce qui plaît
  rationale: Le grec ne donne pas de complément explicite, mais le Seigneur est le référent contextuel immédiat. L’explicitation produit un français naturel; la note conserve la forme plus implicite de l’original.
- issue: Valeur du datif τῇ ἐπιγνώσει
  choice: dans la connaissance de Dieu
  alternative: par la connaissance de Dieu
  rationale: Le datif peut marquer le domaine de la croissance ou son moyen. La première lecture s’accorde bien avec αὐξανόμενοι, sans exclure l’autre, signalée en note.
- issue: Nuance de ἐπίγνωσις
  choice: connaissance
  alternative: connaissance approfondie
  rationale: Le terme peut suggérer une connaissance plus pleine ou plus profonde, mais cette nuance n’a pas à être transformée en distinction théologique technique. Elle est indiquée en note.
translation_notes:
  register: Français international moderne, naturel et digne. « Vivre » rend intelligible la métaphore de la marche, tandis que « porter du fruit » est conservé parce que cette image reste claire et structure le contexte. Les participes grecs sont rendus par deux constructions parallèles en « en ».
