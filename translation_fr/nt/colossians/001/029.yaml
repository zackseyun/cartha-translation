id: COL.1.29
reference: Colossians 1:29
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἰς ὃ καὶ κοπιῶ ἀγωνιζόμενος κατὰ τὴν ἐνέργειαν αὐτοῦ τὴν ἐνεργουμένην ἐν ἐμοὶ ἐν δυνάμει.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/029.yaml
  text: For this I also labor[a], striving according to his working[d][c][b], which is working in me in power.
translation:
  language: fr
  text: C’est aussi dans ce but que je me donne de la peine, luttant selon son action[a], qui agit en moi avec puissance.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec dit « son action » sans préciser ici explicitement s’il s’agit de celle de Dieu ou de celle du Christ.
    reason: alternative_reading
lexical_decisions:
- source_word: εἰς ὃ
  choice: dans ce but
  rationale: L’expression renvoie au but du ministère exposé au verset précédent. « Dans ce but » restitue naturellement en français sa valeur finale, sans préciser davantage ce que le grec laisse au contexte.
- source_word: καὶ
  choice: aussi
  rationale: L’adverbe rattache l’effort de Paul à l’objectif qu’il vient d’énoncer.
- source_word: κοπιῶ
  choice: je me donne de la peine
  rationale: Le verbe évoque un travail pénible et soutenu, jusqu’à la fatigue. Cette tournure française courante conserve cette intensité.
- source_word: ἀγωνιζόμενος
  choice: luttant
  rationale: Le participe exprime un effort intense, avec une nuance de combat ou de compétition, et renforce l’idée de peine.
- source_word: κατὰ τὴν ἐνέργειαν
  choice: selon son action
  rationale: « Selon » préserve le rapport de mesure ou de conformité exprimé par κατά, tandis qu’« action » désigne ici une puissance effectivement à l’œuvre.
- source_word: αὐτοῦ
  choice: son
  rationale: Le pronom grec ne nomme pas explicitement son référent. Le possessif français préserve cette absence de précision.
- source_word: τὴν ἐνεργουμένην
  choice: qui agit
  rationale: Le verbe reprend le nom apparenté ἐνέργεια. Le couple français « action / agit » rend cette répétition lexicale et l’activité continue.
- source_word: ἐν ἐμοὶ
  choice: en moi
  rationale: Cette traduction directe préserve l’idée d’une puissance opérant intérieurement, sans la transformer en « par moi ».
- source_word: ἐν δυνάμει
  choice: avec puissance
  rationale: La tournure exprime naturellement la manière puissante dont cette action s’exerce, tout en conservant la force nominale de δύναμις.
theological_decisions:
- issue: Référent de αὐτοῦ (« son »)
  choice: Conserver le possessif « son » sans identifier explicitement le référent.
  alternative: « l’action de Dieu » ou « l’action du Christ »
  rationale: Le verset ne nomme pas lui-même l’antécédent du pronom. Le contexte peut orienter l’interprétation, mais la traduction ne doit pas trancher ce que la formulation grecque laisse implicite.
translation_notes:
  register: Français international moderne, digne et accessible. « Je me donne de la peine » communique l’effort soutenu sans archaïsme; « action / agit » conserve l’écho étymologique du grec. La syntaxe reste volontairement proche de l’original afin de préserver le rapport entre l’effort de Paul et la puissance qui agit en lui.
