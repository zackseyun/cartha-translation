revisions:
- from: Et c’est lui qui est la tête du corps, de l’Église. Il est le commencement[a], le premier-né d’entre les morts, afin qu’il occupe lui-même la première place en tout[b].
  to: Et c’est lui qui est la tête du corps, qui est l’Église. Il est le commencement[a], le premier-né d’entre les morts, afin qu’il devienne lui-même le premier en tout[b].
  rationale: La révision restaure la nuance de devenir portée par γένηται, tout en gardant la formulation française accessible « le premier en tout » pour πρωτεύων. Elle clarifie aussi l’apposition « le corps, l’Église » sans imposer une compréhension particulière de la métaphore de la tête. Les notes conservent les possibilités lexicales sans les présenter comme des sens simultanément affirmés.
