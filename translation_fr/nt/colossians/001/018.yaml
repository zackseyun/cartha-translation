id: COL.1.18
reference: Colossians 1:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ αὐτός ἐστιν ἡ κεφαλὴ τοῦ σώματος τῆς ἐκκλησίας· ὅς ⸀ἐστιν ἀρχή, πρωτότοκος ἐκ τῶν νεκρῶν, ἵνα γένηται ἐν πᾶσιν αὐτὸς πρωτεύων,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/018.yaml
  text: And he is the head of the body[a], the church; he is the beginning, the firstborn from the dead, so that he himself might become preeminent in all things[b],
translation:
  language: fr
  text: Et c’est lui qui est la tête du corps, qui est l’Église. Il est le commencement[a], le premier-né d’entre les morts, afin qu’il devienne lui-même le premier en tout[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’origine » ou « l’autorité souveraine » pour « le commencement » (ἀρχή).
    reason: lexical_alternative
  - marker: b
    text: Ou « afin qu’il devienne lui-même prééminent en toutes choses ».
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτός
  choice: lui / lui-même
  rationale: La tournure « c’est lui qui » rend l’emphase du premier αὐτός en français naturel. Dans la dernière proposition, « lui-même » conserve explicitement l’insistance portée par le second αὐτός.
- source_word: κεφαλή
  choice: tête
  rationale: « Tête » est l’équivalent direct et préserve la métaphore sans la réduire soit à l’autorité, soit à l’origine.
- source_word: σῶμα
  choice: corps
  rationale: Ce terme maintient l’image collective du corps et son lien direct avec la « tête ».
- source_word: ἐκκλησία
  choice: Église
  rationale: « Église » est le terme français établi et convient ici au peuple constitué comme corps du Christ; « assemblée » serait possible, mais trop restrictif dans ce contexte christologique.
- source_word: ἀρχή
  choice: commencement
  rationale: Dans son association immédiate avec « le premier-né d’entre les morts », « commencement » présente le Christ comme celui qui inaugure l’ordre de la résurrection, tout en laissant en note les autres sens lexicaux possibles.
- source_word: πρωτότοκος
  choice: premier-né
  rationale: Cette traduction conserve la forme lexicale et ses résonances bibliques. Le rang éminent impliqué est rendu explicitement dans la proposition suivante plutôt que substitué au mot.
- source_word: ἐκ τῶν νεκρῶν
  choice: d’entre les morts
  rationale: Formulation française naturelle qui rend explicitement l’idée de sortir du milieu des morts dans le langage de la résurrection.
- source_word: ἵνα γένηται
  choice: afin qu’il occupe
  rationale: La construction exprime le but ou le résultat. « Occupe la première place » rend naturellement en français l’accès à la position décrite par γένηται avec le participe πρωτεύων, sans produire une formulation lourde.
- source_word: ἐν πᾶσιν
  choice: en tout
  rationale: Le neutre pluriel peut désigner toutes choses ou tout domaine. « En tout » est concis, naturel et conserve cette ampleur.
- source_word: πρωτεύων
  choice: occupe la première place
  rationale: Cette expression rend directement l’idée de tenir le premier rang et demeure plus accessible que « être prééminent ».
theological_decisions:
- issue: Sens de κεφαλή dans la métaphore du Christ et du corps
  choice: Conserver « tête » sans préciser s’il s’agit de l’autorité ou de l’origine.
  alternative: « chef » ou « source »
  rationale: La métaphore est riche et son interprétation fait débat. La conserver évite de trancher au-delà de ce que dit explicitement le grec.
- issue: Sens de ἀρχή dans son rapport avec la résurrection et la nouvelle création
  choice: « commencement »
  alternative: « origine » ou « souverain »
  rationale: La mention parallèle du « premier-né d’entre les morts » favorise l’idée du commencement de la vie de résurrection, sans exclure silencieusement les autres nuances lexicales.
- issue: Portée de πρωτότοκος ἐκ τῶν νεκρῶν
  choice: Conserver « premier-né d’entre les morts » comme langage de primauté dans la résurrection.
  alternative: « le premier à ressusciter d’entre les morts »
  rationale: La traduction retenue préserve la forme biblique et ne réduit pas πρωτότοκος à une simple priorité chronologique; la proposition finale explicite la primauté du Christ.
- issue: Force de γένηται avec πρωτεύων
  choice: « afin qu’il occupe lui-même la première place »
  alternative: « afin qu’il devienne lui-même prééminent »
  rationale: La formulation choisie communique naturellement le but ou résultat et la prise du premier rang, sans suggérer que le Christ aurait auparavant manqué de dignité intrinsèque ni effacer le mouvement exprimé par γένηται.
translation_notes:
  register: Français international moderne, digne et accessible. « C’est lui qui » restitue l’emphase initiale sans lourdeur; « d’entre les morts » suit l’usage biblique français naturel. La ponctuation en deux phrases clarifie l’enchaînement tout en conservant les rapports du grec.
