  verdict: revise
  source_fidelity: 'La traduction conserve adéquatement les termes et images déterminants : « tête », « corps », « Église », « commencement » et « premier-né d’entre les morts ». Toutefois, « afin qu’il occupe » atténue le mouvement de γένηται (« qu’il devienne / en vienne à être ») et doit être corrigé.'
  naturalness: Le français est globalement moderne et lisible. « La tête du corps, de l’Église » reste possible dans un registre biblique, mais « la tête du corps, qui est l’Église » exprime plus clairement l’apposition grecque pour un lectorat international contemporain.
  terminology: « Tête », « Église », « commencement » et « premier-né d’entre les morts » sont judicieux et ne tranchent pas indûment les débats interprétatifs. « Devenir lui-même le premier en tout » rend naturellement γένηται… πρωτεύων, avec l’insistance de αὐτός.
