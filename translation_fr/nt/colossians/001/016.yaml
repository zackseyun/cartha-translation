id: COL.1.16
reference: Colossians 1:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὅτι ἐν αὐτῷ ἐκτίσθη τὰ ⸀πάντα ἐν τοῖς οὐρανοῖς ⸀καὶ ἐπὶ τῆς γῆς, τὰ ὁρατὰ καὶ τὰ ἀόρατα, εἴτε θρόνοι εἴτε κυριότητες εἴτε ἀρχαὶ εἴτε ἐξουσίαι· τὰ πάντα δι’ αὐτοῦ καὶ εἰς αὐτὸν ἔκτισται·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/016.yaml
  text: For in him all things were created[a], in the heavens and on the earth, the visible and the invisible, whether thrones or dominions or rulers or authorities[d][c][b]; all things have been created through him and for him.
translation:
  language: fr
  text: Car c’est en lui[a] que tout a été créé, dans les cieux et sur la terre[b], le visible et l’invisible, qu’il s’agisse de trônes, de souverainetés, de principautés ou d’autorités[c] ; tout a été créé par lui et pour lui[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « par lui ». Le grec dit littéralement « en lui » et emploie ensuite une autre préposition dans « par lui ».'
    reason: lexical_alternative
  - marker: b
    text: 'On peut aussi traduire : « au ciel et sur la terre » ; le grec met « cieux » au pluriel.'
    reason: lexical_alternative
  - marker: c
    text: Ces termes semblent désigner diverses formes ou catégories d’autorité créées, sans préciser ici si elles sont célestes ou terrestres. « Souverainetés » peut aussi se traduire par « dominations ».
    reason: ambiguity_preservation
  - marker: d
    text: 'Littéralement : « en vue de lui » ; « pour lui » exprime le but vers lequel la création est orientée.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Car
  rationale: Introduit naturellement en français la raison qui fonde l’affirmation précédente, tout en conservant la valeur causale du grec.
- source_word: ἐν αὐτῷ
  choice: en lui
  rationale: Conserve la préposition ἐν et la distingue de δι’ αὐτοῦ (« par lui ») dans la seconde proposition, sans réduire les deux formulations à une même idée instrumentale.
- source_word: ἐκτίσθη / ἔκτισται
  choice: a été créé
  rationale: Le passif rend clairement Dieu comme agent implicite de la création. En français, cette forme convient au premier aoriste comme au parfait final, dont la portée durable ressort du contexte et de la reprise.
- source_word: τὰ πάντα
  choice: tout
  rationale: Formulation française naturelle et globale, équivalente à « toutes choses » mais moins archaïque.
- source_word: ἐν τοῖς οὐρανοῖς
  choice: dans les cieux
  rationale: Respecte le pluriel grec et évite de préciser indûment la nature des domaines célestes.
- source_word: ἐπὶ τῆς γῆς
  choice: sur la terre
  rationale: Rend directement la localisation et maintient le contraste cosmique avec « dans les cieux ».
- source_word: τὰ ὁρατὰ καὶ τὰ ἀόρατα
  choice: le visible et l’invisible
  rationale: Les adjectifs substantivés sont rendus par une paire concise et idiomatique qui conserve toute l’étendue du contraste.
- source_word: εἴτε … εἴτε … εἴτε … εἴτε
  choice: que ce soient … ou
  rationale: Tour français naturel qui conserve l’énumération ouverte de diverses catégories.
- source_word: θρόνοι
  choice: trônes
  rationale: Traduction directe qui laisse au contexte le soin de déterminer s’il s’agit de sièges d’autorité ou de puissances ainsi désignées.
- source_word: κυριότητες
  choice: souverainetés
  rationale: Exprime l’exercice d’une domination sans employer le calque peu naturel « seigneuries ».
- source_word: ἀρχαὶ
  choice: principautés
  rationale: Terme français traditionnel qui distingue cette catégorie des « autorités » ; la note prévient qu’il ne faut pas y lire nécessairement une définition ontologique précise.
- source_word: ἐξουσίαι
  choice: autorités
  rationale: Rend directement la notion de pouvoir légitime ou exercé et la distingue de ἀρχαί.
- source_word: δι’ αὐτοῦ καὶ εἰς αὐτόν
  choice: par lui et pour lui
  rationale: « Par lui » exprime la médiation ou l’agentivité ; « pour lui » exprime naturellement en français le but ou l’orientation indiqués par εἰς.
theological_decisions:
- issue: Rapport du Fils à la création dans ἐν αὐτῷ, δι’ αὐτοῦ et εἰς αὐτόν
  choice: Maintenir « en lui … par lui … pour lui »
  alternative: Uniformiser en « par lui … par lui … pour lui », ou expliciter « en union avec lui »
  rationale: 'La variation des prépositions grecques présente une formulation riche et potentiellement ouverte : le Fils est lié à la sphère ou au fondement, à la médiation et au but de la création. La traduction ne doit pas aplanir ces rapports.'
- issue: Nature des trônes, souverainetés, principautés et autorités
  choice: Conserver les catégories sans les définir davantage
  alternative: Les identifier explicitement à des ordres angéliques ou à des institutions politiques humaines
  rationale: Le texte les inclut dans l’ordre créé, visible ou invisible, mais ne précise pas ici qu’elles sont exclusivement spirituelles, angéliques ou terrestres.
translation_notes:
  register: Français international moderne, digne et accessible. « C’est en lui que » donne à la formule son relief naturel en français tout en conservant ἐν. L’énumération garde des termes distincts et solennels sans expliquer dans le corps du verset ce que le grec laisse indéterminé.
