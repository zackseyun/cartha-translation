  text: διὰ τὴν ἐλπίδα τὴν ἀποκειμένην ὑμῖν ἐν τοῖς οὐρανοῖς, ἣν προηκούσατε ἐν τῷ λόγῳ τῆς ἀληθείας τοῦ εὐαγγελίου
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/005.yaml
  text: because of the hope laid up for you in the heavens[a], which you heard before in the word of truth[d][c][b], the gospel
translation:
  language: fr
  text: à cause de l’espérance qui vous est réservée dans les cieux[a], dont vous avez déjà entendu parler[b] dans la parole de vérité[c], l’Évangile.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « dans le ciel ». Le grec emploie le pluriel : « dans les cieux ».'
    reason: lexical_alternative
  - marker: b
    text: Ou « dont vous avez entendu parler auparavant ». Le verbe grec marque une audition antérieure.
    reason: lexical_alternative
  - marker: c
    text: « La parole de vérité » peut aussi se traduire par « le message de vérité ». « L’Évangile » est placé en apposition et identifie cette parole ou ce message.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τὴν ἐλπίδα
  choice: à cause de l’espérance
  rationale: διά avec l’accusatif exprime ici naturellement la cause ou le fondement. « Espérance » conserve la portée paulinienne de ἐλπίς sans la réduire à un simple optimisme.
- source_word: τὴν ἀποκειμένην ὑμῖν
  choice: qui vous est réservée
  rationale: ἀπόκειμαι désigne ce qui est gardé en réserve. « Est réservée » est naturel en français et exprime clairement que cette espérance est tenue prête pour les destinataires.
- source_word: ἐν τοῖς οὐρανοῖς
  choice: dans les cieux
  rationale: Le pluriel français reproduit le pluriel grec et demeure idiomatique dans un registre biblique actuel.
- source_word: ἣν προηκούσατε
  choice: et dont vous aviez déjà entendu parler
  rationale: Le relatif féminin renvoie directement à « l’espérance ». Le plus-que-parfait et « déjà » rendent l’antériorité portée par προ-, tandis que « entendre parler de » est la construction française naturelle avec un objet tel que l’espérance.
- source_word: ἐν τῷ λόγῳ τῆς ἀληθείας
  choice: dans la parole de vérité
  rationale: « Parole » reste proche de λόγος; le complément « de vérité » conserve la formulation grecque et laisse l’apposition suivante en préciser le contenu.
- source_word: τοῦ εὐαγγελίου
  choice: l’Évangile
  rationale: Le génitif est compris comme une apposition qui identifie la parole de vérité à l’Évangile. Le terme est courant, concis et largement intelligible en français.
theological_decisions:
- issue: Référent de la proposition relative
  choice: La proposition « dont vous aviez déjà entendu parler » renvoie à « l’espérance ».
  alternative: La proposition pourrait être comprise plus largement comme renvoyant à l’ensemble du message évangélique.
  rationale: Le pronom relatif féminin singulier ἣν s’accorde directement avec ἐλπίδα. La traduction maintient ce lien syntaxique sans élargir implicitement le référent.
- issue: Nombre de οὐρανοῖς
  choice: Conserver le pluriel « les cieux ».
  alternative: Employer le singulier idiomatique « le ciel ».
  rationale: Le pluriel correspond à la forme du texte grec et ne force aucune harmonisation avec l’usage traditionnel au singulier.
- issue: Rapport entre « parole de vérité » et « Évangile »
  choice: Maintenir « l’Évangile » en apposition à « la parole de vérité ».
  alternative: Expliciter par « la parole de vérité qu’est l’Évangile » ou comprendre un génitif descriptif.
  rationale: L’apposition est la lecture syntaxique la plus vraisemblable, mais la formulation française conserve la juxtaposition du grec sans développer davantage la relation.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure « dont vous aviez déjà entendu parler » privilégie l’idiome français tout en gardant « l’espérance » comme antécédent explicite. « Dans les cieux » et « parole de vérité » maintiennent la texture du grec; les variantes plus idiomatiques sont signalées en notes.
