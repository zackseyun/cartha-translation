id: COL.1.27
reference: Colossians 1:27
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οἷς ἠθέλησεν ὁ θεὸς γνωρίσαι τί τὸ πλοῦτος τῆς δόξης τοῦ μυστηρίου τούτου ἐν τοῖς ἔθνεσιν, ⸀ὅ ἐστιν Χριστὸς ἐν ὑμῖν, ἡ ἐλπὶς τῆς δόξης·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/027.yaml
  text: To them God chose to make known what is the riches of the glory of this mystery among the Gentiles[a], which is Messiah in you[b], the hope of glory.
translation:
  language: fr
  text: Dieu a voulu leur faire connaître quelle est, parmi les non-Juifs, la richesse de la gloire de ce mystère, à savoir le Messie en vous[a], l’espérance de la gloire.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le Messie parmi vous ». Le grec peut évoquer sa présence au milieu de la communauté aussi bien que sa présence en ceux qui croient.'
    reason: alternative_reading
lexical_decisions:
- source_word: οἷς
  choice: leur
  rationale: Le pronom relatif datif reprend les « saints » du verset précédent et sert de complément indirect à « faire connaître ».
- source_word: ἠθέλησεν
  choice: a voulu
  rationale: Rend directement la volonté délibérée de Dieu sans imposer la nuance plus particulière de « choisir » ou de « prendre plaisir ».
- source_word: γνωρίσαι
  choice: faire connaître
  rationale: Correspond au sens courant de γνωρίζω et conserve l’idée de communication explicite du mystère.
- source_word: τί τὸ πλοῦτος τῆς δόξης
  choice: quelle est… la glorieuse richesse
  rationale: Le singulier « richesse » reflète πλοῦτος. L’adjectif « glorieuse » exprime naturellement en français le génitif τῆς δόξης sans produire l’enchaînement lourd « la richesse de la gloire ».
- source_word: μυστηρίου
  choice: mystère
  rationale: Dans ce contexte paulinien, il s’agit du dessein divin autrefois caché et désormais manifesté, non d’une énigme insoluble.
- source_word: ἐν τοῖς ἔθνεσιν
  choice: parmi les non-Juifs
  rationale: Dans le contexte, ἔθνη désigne les peuples autres qu’Israël. « Non-Juifs » rend cette opposition clairement en français international actuel.
- source_word: ὅ ἐστιν
  choice: ':'
  rationale: Les deux-points introduisent naturellement l’identification explicative en français et évitent un relatif dont l’antécédent grammatical pourrait paraître incertain.
- source_word: Χριστὸς
  choice: le Messie
  rationale: Χριστός garde ici sa force de titre en désignant le contenu du mystère.
- source_word: ἐν ὑμῖν
  choice: en vous
  rationale: Traduction directe qui laisse ouverte la portée collective du pluriel; l’autre lecture possible, « parmi vous », est signalée en note.
- source_word: ἡ ἐλπὶς τῆς δόξης
  choice: l’espérance de la gloire
  rationale: Cette formulation concise préserve le génitif dense du grec sans préciser indûment s’il désigne l’objet ou le fondement de l’espérance.
theological_decisions:
- issue: Valeur de Χριστός
  choice: le Messie
  alternative: le Christ
  rationale: Dans cette proposition d’identification, le mot conserve nettement sa valeur titulaire; « le Messie » la rend de façon transparente.
- issue: Portée de ἐν ὑμῖν
  choice: en vous
  alternative: parmi vous
  rationale: Le grec permet de comprendre soit la présence intérieure du Messie chez les croyants, soit sa présence au milieu de leur communauté. Le texte principal reste direct et la note préserve l’autre possibilité.
- issue: Rapport de ἡ ἐλπὶς τῆς δόξης
  choice: l’espérance de la gloire
  alternative: l’espérance d’avoir part à la gloire
  rationale: La formulation retenue conserve l’ambiguïté du génitif au lieu d’expliciter la gloire comme seul objet futur de l’espérance.
translation_notes:
  register: Français moderne, international et digne. La phrase suit le mouvement du grec tout en évitant les constructions artificielles; « non-Juifs » privilégie la compréhension immédiate, et les deux-points rendent clairement l’explication finale.
