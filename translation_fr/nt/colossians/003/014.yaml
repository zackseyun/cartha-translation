id: COL.3.14
reference: Colossians 3:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐπὶ πᾶσιν δὲ τούτοις τὴν ἀγάπην, ⸀ὅ ἐστιν σύνδεσμος τῆς τελειότητος.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/014.yaml
  text: And above all these[a], put on love, which is the bond of perfection.
translation:
  language: fr
  text: Mais par-dessus tout cela, revêtez-vous de l’amour, qui est le lien de la perfection[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le lien de l’accomplissement » ou « le lien de la maturité ».
    reason: alternative lexicale pour τελειότης
lexical_decisions:
- source_word: ἐπὶ πᾶσιν δὲ τούτοις
  choice: Mais par-dessus tout cela
  rationale: 'Avec ἐπί suivi du datif, l’expression prolonge ici l’image du vêtement commencée au verset 12 : l’amour se porte par-dessus les autres dispositions. « Par-dessus » conserve mieux cette image que le simple « en plus de ».'
- source_word: τὴν ἀγάπην
  choice: l’amour
  rationale: « Amour » est l’équivalent français naturel et usuel de ἀγάπη dans ce contexte éthique.
- source_word: '[verbe implicite repris du contexte : ἐνδύσασθε, v. 12]'
  choice: revêtez-vous de
  rationale: Le grec laisse le verbe sous-entendu, mais l’accusatif τὴν ἀγάπην dépend de l’impératif du verset 12. Le rétablir en français rend la phrase complète tout en maintenant l’image du vêtement.
- source_word: ὅ
  choice: qui
  rationale: Le relatif neutre présente une explication concernant l’amour ou l’idée précédente dans son ensemble. « Qui » permet une formulation française naturelle sans préciser davantage l’antécédent conceptuel.
- source_word: σύνδεσμος
  choice: lien
  rationale: Le mot désigne ce qui attache ou unit. « Lien » est concis, naturel et garde ouverte la manière exacte dont l’amour unit les vertus mentionnées.
- source_word: τῆς τελειότητος
  choice: de la perfection
  rationale: τελειότης peut exprimer la perfection, l’accomplissement ou la maturité. « Perfection » conserve la formulation dense du grec et évite de réduire le sens à la seule maturité.
theological_decisions:
- issue: Sens de σύνδεσμος τῆς τελειότητος
  choice: « le lien de la perfection »
  alternative: « le lien de l’accomplissement » ou « le lien de la maturité »
  rationale: Le génitif peut décrire le lien propre à la perfection, celui qui constitue un ensemble achevé, ou celui qui conduit à l’accomplissement. La traduction littéralement compacte préserve cette tension au lieu de trancher entre ces nuances.
translation_notes:
  register: Français international moderne, digne et accessible. « Revêtez-vous » maintient l’image vestimentaire du contexte; « par-dessus » en souligne la continuité.
