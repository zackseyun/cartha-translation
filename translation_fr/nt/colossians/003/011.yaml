id: COL.3.11
reference: Colossians 3:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὅπου οὐκ ἔνι Ἕλλην καὶ Ἰουδαῖος, περιτομὴ καὶ ἀκροβυστία, βάρβαρος, Σκύθης, δοῦλος, ἐλεύθερος, ἀλλὰ ⸀τὰ πάντα καὶ ἐν πᾶσιν Χριστός.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/011.yaml
  text: where there is no Greek and Jew[a], circumcision and uncircumcision, barbarian, Scythian, servant, free, but Messiah is all[c][b], and in all.
translation:
  language: fr
  text: où il n’y a ni Grec ni Juif, ni circoncision ni incirconcision, ni barbare ni Scythe, ni esclave ni homme libre, mais le Messie[b] est tout et en tous[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en chacun ». Le grec « en tous » est concis; il peut désigner personnellement tous les membres de la communauté renouvelée, tout en permettant une compréhension plus large.
    reason: alternative_reading
  - marker: b
    text: 'Grec Christos, c’est-à-dire « le Messie ». Traduction traditionnelle : « le Christ ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπου
  choice: où
  rationale: Introduit le domaine de l’être humain nouveau évoqué au verset précédent, tout en conservant la valeur locative concise du grec.
- source_word: οὐκ ἔνι
  choice: il n’y a
  rationale: Expression française naturelle qui rend l’absence catégorique sans ajouter « plus », absent du texte grec.
- source_word: Ἕλλην καὶ Ἰουδαῖος
  choice: ni Grec ni Juif
  rationale: Le grec nomme précisément le Grec, et non les non-Juifs en général. La construction française avec « ni… ni… » exprime naturellement la négation.
- source_word: περιτομὴ καὶ ἀκροβυστία
  choice: ni circoncision ni incirconcision
  rationale: Conserve les noms abstraits employés comme marqueurs d’identité religieuse et sociale, ainsi que le style ramassé de l’original.
- source_word: βάρβαρος
  choice: barbare
  rationale: Préserve le terme culturel antique désignant celui qui était considéré comme étranger au monde grec, sans en atténuer artificiellement la force historique.
- source_word: Σκύθης
  choice: Scythe
  rationale: Rend directement l’ethnonyme précis du texte grec.
- source_word: δοῦλος
  choice: esclave
  rationale: L’opposition explicite avec l’homme libre met au premier plan le statut d’asservissement; « esclave » est donc plus exact que « serviteur ».
- source_word: ἐλεύθερος
  choice: homme libre
  rationale: Exprime clairement en français le statut social opposé à celui de l’esclave.
- source_word: τὰ πάντα
  choice: est tout
  rationale: Formulation concise qui exprime la place englobante du Messie sans préciser davantage la portée théologique de l’expression.
- source_word: ἐν πᾶσιν
  choice: en tous
  rationale: Conserve la brièveté du grec. Dans le contexte, l’expression vise naturellement tous les membres de la communauté renouvelée, tout en gardant une certaine ouverture grammaticale.
- source_word: Χριστός
  choice: le Messie
  rationale: Rend le sens titulaire de Χριστός plutôt que de le traiter uniquement comme un nom propre traditionnel.
theological_decisions:
- issue: Portée de ἐν πᾶσιν
  choice: en tous
  alternative: en chacun; en toutes choses
  rationale: Le contexte favorise une référence personnelle aux membres de la communauté renouvelée, mais la formulation grecque reste concise et peut recevoir une portée plus large. Le texte principal conserve cette concision et la note signale l’ambiguïté.
- issue: Traduction de Χριστός
  choice: le Messie
  alternative: le Christ
  rationale: Ici, le terme porte sa valeur de titre. « Le Messie » en communique le sens, tandis que la traduction traditionnelle est indiquée en note.
- issue: Traduction de δοῦλος
  choice: esclave
  alternative: serviteur
  rationale: L’antithèse avec ἐλεύθερος rend le statut social et juridique déterminant; « esclave » préserve cette opposition sans l’adoucir.
translation_notes:
  register: Français international actuel, sobre et digne. Les couples sont rendus par « ni… ni… », tournure naturelle sous une négation en français. Les noms abstraits « circoncision » et « incirconcision » sont maintenus afin de respecter la structure et la tension sociale et religieuse du grec.
