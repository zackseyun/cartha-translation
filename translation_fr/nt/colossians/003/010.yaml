reference: Colossians 3:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἐνδυσάμενοι τὸν νέον τὸν ἀνακαινούμενον εἰς ἐπίγνωσιν κατ’ εἰκόνα τοῦ κτίσαντος αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/010.yaml
  text: and have put on the new self[a], which is being renewed in knowledge according to the image of the one who created it[b],
translation:
  language: fr
  text: et vous avez revêtu l’être nouveau[a], qui est en cours de renouvellement en vue de la connaissance[b], selon l’image de celui qui l’a créé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’homme nouveau ». L’expression grecque s’oppose à « l’être ancien » dans le contexte et peut désigner la personne ou l’humanité renouvelée.
    reason: lexical_alternative
  - marker: b
    text: Ou « de la pleine connaissance ». Le mot grec peut évoquer une connaissance plus complète ou plus profonde.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνδυσάμενοι
  choice: vous avez revêtu
  rationale: Le participe aoriste reprend la métaphore du vêtement dans le contexte. Le passé composé exprime naturellement en français l’action accomplie liée à l’exhortation précédente.
- source_word: τὸν νέον
  choice: l’être nouveau
  rationale: L’adjectif masculin substantivé désigne ici la personne dans son identité renouvelée. « L’être nouveau » reste naturel en français, maintient le contraste avec l’être ancien et évite de faire croire que le propos ne concerne que les hommes.
- source_word: ἀνακαινούμενον
  choice: qui est renouvelé
  rationale: Le passif est conservé afin de ne pas transformer le renouvellement reçu en action autonome de l’être nouveau. Le présent du relatif laisse entendre un processus en cours.
- source_word: εἰς ἐπίγνωσιν
  choice: en vue de la connaissance
  rationale: « En vue de » rend la direction ou le but exprimé par εἰς sans forcer la nuance intensive possible de ἐπίγνωσις, signalée en note.
- source_word: κατ’ εἰκόνα
  choice: conformément à l’image
  rationale: Cette formulation exprime l’idée de conformité à un modèle et conserve l’écho probable au langage de la création en Genèse.
- source_word: τοῦ κτίσαντος αὐτόν
  choice: de celui qui l’a créé
  rationale: La tournure personnelle et la structure du participe grec sont conservées. Le pronom renvoie à « l’être nouveau » sans préciser davantage l’identité du Créateur dans la traduction.
theological_decisions:
- issue: Valeur anthropologique de τὸν νέον
  choice: l’être nouveau
  alternative: l’homme nouveau
  rationale: Le texte oppose l’identité ancienne à l’identité nouvelle, avec une portée qui peut être à la fois personnelle et collective. « L’être nouveau » préserve cette ouverture sans introduire un référent exclusivement masculin; la traduction plus formelle figure en note.
- issue: Force de ἐπίγνωσις
  choice: la connaissance
  alternative: la pleine connaissance
  rationale: Le terme peut suggérer une connaissance plus complète ou plus profonde, mais cette intensification n’est pas certaine dans chaque emploi. La traduction principale conserve l’ambiguïté, et la nuance possible est indiquée en note.
- issue: Agent du renouvellement passif
  choice: 'maintien du passif : « est renouvelé »'
  alternative: « que Dieu renouvelle »
  rationale: L’agent divin est vraisemblable dans le contexte théologique, mais il n’est pas explicitement nommé dans cette proposition. Le passif évite de l’ajouter au texte.
translation_notes:
  register: Français international moderne, digne et accessible. La métaphore du vêtement est conservée avec « revêtu ». « En vue de » rend la progression orientée exprimée par εἰς, tandis que « conformément à l’image » maintient le rapport au modèle créateur sans explicitation doctrinale supplémentaire.
