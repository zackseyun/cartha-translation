id: COL.3.1
reference: Colossians 3:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Εἰ οὖν συνηγέρθητε τῷ Χριστῷ, τὰ ἄνω ζητεῖτε, οὗ ὁ Χριστός ἐστιν ἐν δεξιᾷ τοῦ θεοῦ καθήμενος·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/001.yaml
  text: If[a], then, you were raised with the Messiah, seek the things above[b], where the Messiah is, seated at the right hand of God.
translation:
  language: fr
  text: Si donc vous avez été ressuscités avec le Messie, recherchez les réalités d’en haut, là où se trouve le Messie, assis à la droite de Dieu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἰ οὖν
  choice: Si donc
  rationale: Conserve à la fois la forme conditionnelle de εἰ et la valeur déductive de οὖν, sans transformer explicitement la condition en affirmation causale.
- source_word: συνηγέρθητε τῷ Χριστῷ
  choice: vous avez été ressuscités avec le Messie
  rationale: Le passé composé exprime naturellement en français un événement passé dont les effets demeurent; la voix passive et l’association exprimée par le datif sont maintenues.
- source_word: τὰ ἄνω
  choice: les réalités d’en haut
  rationale: Rend le neutre pluriel substantivé de façon naturelle et digne, tout en conservant sa portée large sans préciser indûment qu’il s’agit seulement de choses matérielles.
- source_word: ζητεῖτε
  choice: recherchez
  rationale: Rend directement l’impératif présent et suggère une orientation active et suivie sans ajouter explicitement «continuellement».
- source_word: οὗ ὁ Χριστός ἐστιν
  choice: là où se trouve le Messie
  rationale: Le locatif οὗ est explicité naturellement par «là où»; «se trouve» évite une tournure française raide tout en conservant l’indication de lieu.
- source_word: ἐν δεξιᾷ τοῦ θεοῦ καθήμενος
  choice: assis à la droite de Dieu
  rationale: Conserve l’image biblique royale et la valeur descriptive du participe, sans développer implicitement «assis» en «intronisé».
theological_decisions:
- issue: Valeur de la proposition conditionnelle Εἰ
  choice: Maintenir la forme «Si donc»
  alternative: «Puisque vous avez été ressuscités»
  rationale: Dans le contexte, Paul tient vraisemblablement la condition pour vraie, mais le grec conserve une formulation conditionnelle; la traduction préserve cette tension sans la résoudre.
- issue: Traduction de Χριστός
  choice: le Messie
  alternative: le Christ
  rationale: Le terme grec porte encore ici sa valeur de titre appliqué à l’oint exalté; «Messie» rend ce sens sans introduire une particularité confessionnelle.
translation_notes:
  register: Français international moderne, fluide et digne. Le passé composé est plus naturel que le passé simple pour cette exhortation. «Réalités d’en haut» reste intelligible tout en évitant le caractère potentiellement concret ou vague de «choses d’en haut».
