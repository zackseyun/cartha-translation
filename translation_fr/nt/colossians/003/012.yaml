id: COL.3.12
reference: Colossians 3:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἐνδύσασθε οὖν ὡς ἐκλεκτοὶ τοῦ θεοῦ, ἅγιοι καὶ ἠγαπημένοι, σπλάγχνα οἰκτιρμοῦ, χρηστότητα, ταπεινοφροσύνην, πραΰτητα, μακροθυμίαν,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/012.yaml
  text: Put on[a], then, as God’s chosen ones, holy and beloved, compassion, kindness, humility, gentleness[b], and patience[c],
translation:
  language: fr
  text: Revêtez-vous donc, comme ceux que Dieu a choisis[a], saints et bien-aimés, d’une profonde compassion[b], de bonté, d’humilité, de douceur[c] et de patience[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les élus de Dieu ».
    reason: alternative_reading
  - marker: b
    text: 'Littéralement « des entrailles de compassion » : dans l’usage grec, les entrailles représentent le siège des sentiments profonds.'
    reason: lexical_alternative
  - marker: c
    text: Ou « mansuétude ».
    reason: lexical_alternative
  - marker: d
    text: Ou « longanimité », c’est-à-dire une patience durable, notamment envers autrui.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐνδύσασθε
  choice: Revêtez-vous
  rationale: 'L’impératif aoriste moyen est employé métaphoriquement : il invite à adopter des dispositions comme on revêt un vêtement. « Revêtez-vous » conserve cette image biblique dans un français digne et compréhensible.'
- source_word: οὖν
  choice: donc
  rationale: Le terme marque la conséquence pratique de ce qui précède ; « donc » rend clairement ce lien argumentatif.
- source_word: ὡς
  choice: en tant que
  rationale: 'Cette expression maintient la valeur identificatrice de ὡς : les destinataires doivent agir conformément à leur identité, sans réduire explicitement le mot à une simple relation causale.'
- source_word: ἐκλεκτοὶ τοῦ θεοῦ
  choice: personnes choisies par Dieu
  rationale: Cette formulation naturelle conserve l’initiative divine et évite les connotations systématiques que « les élus » peut recevoir, tout en signalant cette traduction plus littérale en note.
- source_word: ἅγιοι καὶ ἠγαπημένοι
  choice: saintes et bien-aimées
  rationale: Les adjectifs restent en apposition aux destinataires. « Bien-aimées » exprime la relation durable portée par le participe parfait passif ἠγαπημένοι.
- source_word: σπλάγχνα οἰκτιρμοῦ
  choice: une profonde compassion
  rationale: L’expression désigne littéralement les entrailles comme siège des sentiments de miséricorde. « Profonde compassion » transmet naturellement l’intensité intérieure de l’idiome sans imposer le mot « cœur ».
- source_word: χρηστότητα
  choice: bonté
  rationale: Dans cette liste de vertus, « bonté » exprime une disposition bienveillante active. « Bienveillance » serait également possible, mais un peu plus abstrait.
- source_word: ταπεινοφροσύνην
  choice: humilité
  rationale: Le terme désigne une manière humble de se considérer ; « humilité » en est l’équivalent français courant et direct.
- source_word: πραΰτητα
  choice: douceur
  rationale: « Douceur » rend la force maîtrisée et non agressive de πραΰτης sans suggérer la faiblesse. « Mansuétude » est possible mais moins courant.
- source_word: μακροθυμίαν
  choice: patience
  rationale: Le mot évoque la capacité de supporter longtemps, notamment dans les relations avec autrui. « Patience » est l’expression moderne la plus naturelle, tandis que « longanimité » est plus précise mais rare.
theological_decisions:
- issue: Préserver le langage du choix divin sans préciser un système doctrinal de l’élection
  choice: personnes choisies par Dieu
  alternative: les élus de Dieu
  rationale: Le verset affirme que Dieu a choisi les destinataires, mais n’explique ni le mode ni l’ordre de ce choix. La formulation retenue respecte cette affirmation tout en évitant d’ajouter une interprétation confessionnelle.
- issue: Valeur de ὡς devant l’identité des destinataires
  choice: en tant que
  alternative: puisque vous êtes
  rationale: '« En tant que » laisse subsister la nuance d’identité et de conformité : les croyants doivent vivre comme ceux qu’ils sont. « Puisque » rendrait le lien plus exclusivement causal.'
- issue: Sens éthique de πραΰτης
  choice: douceur
  alternative: mansuétude
  rationale: Le choix vise une qualité de comportement empreinte de maîtrise et de non-violence, sans réduire cette vertu à de la faiblesse.
translation_notes:
  register: Français international moderne, naturel et digne. La métaphore du vêtement est conservée par « Revêtez-vous ». L’accord au féminin pluriel après « personnes » est grammatical et inclusif, sans modifier l’adresse collective du texte grec.
