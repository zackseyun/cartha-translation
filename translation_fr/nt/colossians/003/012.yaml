revisions:
- from: Revêtez-vous donc, en tant que personnes choisies par Dieu[a], saintes et bien-aimées, d’une profonde compassion[b], de bonté, d’humilité, de douceur[c] et de patience[d].
  to: Revêtez-vous donc, comme ceux que Dieu a choisis[a], saints et bien-aimés, d’une profonde compassion[b], de bonté, d’humilité, de douceur[c] et de patience[d].
  rationale: La révision remplace la périphrase féminisée « en tant que personnes choisies par Dieu, saintes et bien-aimées » par « comme ceux que Dieu a choisis, saints et bien-aimés ». Elle préserve la valeur identificatrice de ὡς, l’initiative divine et le langage du choix sans charger « élus » d’implications doctrinales. La note d est affinée sans changer le sens du verset.
