  variant: modern international French
source:
  edition: SBLGNT
  text: οἱ δοῦλοι, ὑπακούετε κατὰ πάντα τοῖς κατὰ σάρκα κυρίοις, μὴ ἐν ⸀ὀφθαλμοδουλίαις, ὡς ἀνθρωπάρεσκοι, ἀλλ’ ἐν ἁπλότητι καρδίας, φοβούμενοι τὸν ⸀κύριον.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/022.yaml
  text: Servants[a], obey in everything those who are your masters according to the flesh, not with eye-service, as people-pleasers, but with sincerity of heart[b][c], fearing the Lord.
translation:
  language: fr
  text: Esclaves[a], obéissez en tout à vos maîtres selon la chair[b], non pas seulement quand ils vous regardent[c], comme des gens qui cherchent à plaire aux humains, mais avec un cœur sincère, dans la crainte du Seigneur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot grec peut aussi être rendu par « serviteurs », mais il désigne couramment ici des personnes réduites en esclavage et placées sous l’autorité d’un maître.
    reason: lexical_alternative
  - marker: b
    text: '« Selon la chair » peut aussi se traduire par « terrestres » ou « humains » : l’expression situe l’autorité de ces maîtres dans les relations humaines de ce monde.'
    reason: lexical_alternative
  - marker: c
    text: L’expression grecque désigne un service accompli pour être vu, uniquement sous le regard du maître.
    reason: cultural_note
lexical_decisions:
- source_word: οἱ δοῦλοι
  choice: Esclaves
  rationale: Dans ce code domestique, δοῦλοι désigne des personnes juridiquement placées sous l’autorité d’un maître. « Esclaves » rend sans l’atténuer la réalité sociale antique.
- source_word: ὑπακούετε κατὰ πάντα
  choice: obéissez en tout
  rationale: L’impératif ὑπακούετε exprime l’obéissance, et κατὰ πάντα en conserve la portée générale.
- source_word: τοῖς κατὰ σάρκα κυρίοις
  choice: à vos maîtres selon la chair
  rationale: « Maîtres » convient aux détenteurs humains d’autorité sur des esclaves, tandis que « selon la chair » préserve la formulation paulinienne et limite cette relation au plan humain.
- source_word: μὴ ἐν ὀφθαλμοδουλίαις
  choice: non pas seulement quand ils vous regardent
  rationale: 'Cette formulation française naturelle explicite le composé rare : un service accompli sous le regard du maître plutôt qu’avec une fidélité constante.'
- source_word: ὡς ἀνθρωπάρεσκοι
  choice: comme des gens qui cherchent à plaire aux humains
  rationale: La périphrase restitue clairement la nuance péjorative de ceux dont le but est d’obtenir l’approbation humaine.
- source_word: ἀλλ’ ἐν ἁπλότητι καρδίας
  choice: mais avec un cœur sincère
  rationale: Dans ce contexte, ἁπλότης exprime une disposition entière, sans duplicité, plutôt qu’une simplicité intellectuelle.
- source_word: φοβούμενοι τὸν κύριον
  choice: dans la crainte du Seigneur
  rationale: La tournure idiomatique française conserve le motif biblique de la crainte du Seigneur et présente celle-ci comme le mobile de l’obéissance.
theological_decisions:
- issue: L’instruction éthique dans le contexte de l’esclavage
  choice: Nommer explicitement les « esclaves » et les « maîtres » sans transformer cette relation en emploi moderne.
  alternative: Employer « serviteurs » et comprendre les maîtres comme des employeurs.
  rationale: Le vocabulaire et le cadre domestique renvoient à l’esclavage antique. Adoucir ces termes masquerait la réalité historique et la tension éthique du passage; la qualification « selon la chair » distingue en même temps l’autorité humaine du Seigneur.
- issue: La portée de « selon la chair »
  choice: Conserver l’expression dans le texte et en expliquer la portée en note.
  alternative: Traduire directement par « maîtres terrestres » ou « maîtres humains ».
  rationale: Le calque français reste intelligible, maintient le vocabulaire paulinien et ne tranche pas plus que le grec entre les nuances « humain », « terrestre » et « relevant de la condition présente ».
translation_notes:
  register: Français international moderne, digne et accessible. Le texte conserve « selon la chair » pour préserver la tension du grec, tout en traduisant idiomatiquement le rare composé ὀφθαλμοδουλία. « Aux humains » évite d’employer « aux hommes » dans un sens générique potentiellement ambigu.
