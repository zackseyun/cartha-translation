id: COL.3.8
reference: Colossians 3:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: νυνὶ δὲ ἀπόθεσθε καὶ ὑμεῖς τὰ πάντα, ὀργήν, θυμόν, κακίαν, βλασφημίαν, αἰσχρολογίαν ἐκ τοῦ στόματος ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/008.yaml
  text: 'But now you also must put away all these things: anger, rage, malice, slander, and filthy speech from your mouth.'
translation:
  language: fr
  text: 'Mais maintenant, vous aussi, débarrassez-vous de tout cela : la colère, la fureur, la méchanceté, les paroles injurieuses et les propos honteux qui sortent de votre bouche.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπόθεσθε
  choice: débarrassez-vous
  rationale: L’aoriste impératif moyen évoque l’action d’ôter et de rejeter, comme un vêtement; cette formulation naturelle en français conserve l’idée d’un abandon résolu.
- source_word: ὀργήν
  choice: colère
  rationale: Terme courant pour une colère durable ou établie, distinct ici de θυμός.
- source_word: θυμόν
  choice: fureur
  rationale: Rend l’emportement intense ou l’explosion de colère et maintient la distinction avec ὀργή.
- source_word: κακίαν
  choice: méchanceté
  rationale: Exprime la disposition mauvaise ou malveillante dans un français clair et courant.
- source_word: βλασφημίαν
  choice: paroles injurieuses
  rationale: Dans cette liste de comportements envers autrui, le mot peut désigner l’injure, la diffamation ou la parole outrageante; ce choix évite de le limiter au seul blasphème contre Dieu.
- source_word: αἰσχρολογίαν
  choice: propos honteux
  rationale: Rend largement un langage honteux, indécent ou grossier sans réduire le terme à une seule catégorie de vulgarité.
- source_word: ἐκ τοῦ στόματος ὑμῶν
  choice: sortant de votre bouche
  rationale: Conserve l’image concrète de la source orale des propos tout en formant une phrase idiomatique.
theological_decisions:
- issue: Portée de βλασφημία
  choice: paroles injurieuses
  alternative: blasphème
  rationale: Le contexte immédiat énumère des vices relationnels et des usages mauvais de la parole. Le sens visant l’injure ou l’outrage est donc retenu, sans nier que le terme puisse ailleurs désigner le blasphème.
- issue: Rapport entre ὀργή et θυμός
  choice: colère, fureur
  alternative: colère, rage
  rationale: 'Les deux termes restent distincts : « colère » peut évoquer un état durable, tandis que « fureur » suggère un emportement intense. Le texte n’impose toutefois pas une distinction technique absolue.'
translation_notes:
  register: Français international moderne, clair et digne. L’impératif direct conserve la force exhortative. La série nominale reste concise, et la formulation évite aussi bien le jargon théologique que le registre familier.
