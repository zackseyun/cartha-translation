id: COL.3.21
reference: Colossians 3:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οἱ πατέρες, μὴ ἐρεθίζετε τὰ τέκνα ὑμῶν, ἵνα μὴ ἀθυμῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/021.yaml
  text: Fathers[a], do not provoke your children, so that they may not become discouraged.
translation:
  language: fr
  text: Pères, n’irritez pas vos enfants, afin qu’ils ne se découragent pas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ne perdent pas courage ».
    reason: Variante lexicale qui fait ressortir l’idée de perdre son courage ou son élan intérieur.
lexical_decisions:
- source_word: οἱ πατέρες
  choice: Pères
  rationale: Le grec désigne explicitement les pères. Cette traduction conserve l’interlocuteur masculin précis du code domestique sans élargir silencieusement le terme à « parents ».
- source_word: μὴ ἐρεθίζετε
  choice: n’irritez pas
  rationale: Dans ce contexte, ἐρεθίζω évoque une conduite qui excite ou provoque une réaction négative. « Irriter » est naturel en français et exprime clairement l’effet nuisible d’un comportement répété envers les enfants.
- source_word: τὰ τέκνα ὑμῶν
  choice: vos enfants
  rationale: τέκνα est un terme inclusif courant pour la descendance; « vos enfants » en donne le sens avec naturel et exactitude.
- source_word: ἵνα μὴ
  choice: afin que… ne… pas
  rationale: Cette tournure conserve la valeur de but ou de résultat visé de ἵνα μή dans un français clair et digne.
- source_word: ἀθυμῶσιν
  choice: se découragent
  rationale: ἀθυμέω décrit la perte de courage ou d’élan intérieur. « Se décourager » rend précisément ce processus en français moderne.
theological_decisions:
- issue: Portée de πατέρες dans l’instruction domestique
  choice: Adresse spécifique aux pères
  alternative: Adresse générique aux parents
  rationale: Le texte grec nomme explicitement les pères. Même si le principe peut avoir une application plus large, la traduction préserve l’interlocuteur précis au lieu de généraliser.
translation_notes:
  register: Français international moderne, direct et digne. « N’irritez pas » est immédiatement compréhensible; la note conserve l’autre nuance naturelle de ἀθυμέω.
