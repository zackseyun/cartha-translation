  text: μὴ ψεύδεσθε εἰς ἀλλήλους· ἀπεκδυσάμενοι τὸν παλαιὸν ἄνθρωπον σὺν ταῖς πράξεσιν αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/009.yaml
  text: Do not lie to one another[a], since you have stripped off the old man with his practices[b],
translation:
  language: fr
  text: Ne mentez pas les uns aux autres, puisque vous vous êtes dépouillés[a] du vieil homme[b] et de ses pratiques,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi traduire : « vous étant dépouillés » ou « après vous être dépouillés ». Le participe grec peut indiquer le fondement de l’interdiction, mais sa relation exacte avec celle-ci reste ouverte.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « l’ancien moi ». « Le vieil homme » préserve le contraste avec « l’homme nouveau » au verset suivant.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ ψεύδεσθε
  choice: Ne vous mentez pas
  rationale: Le présent impératif avec μή exprime directement l’interdiction. La tournure pronominale est naturelle en français avec le complément réciproque.
- source_word: εἰς ἀλλήλους
  choice: les uns aux autres
  rationale: Cette expression rend clairement et idiomatiquement la réciprocité entre les destinataires.
- source_word: ἀπεκδυσάμενοι
  choice: puisque vous vous êtes dépouillés
  rationale: Le participe aoriste moyen présente vraisemblablement le dépouillement accompli comme le fondement de l’interdiction, tout en conservant la métaphore du vêtement.
- source_word: τὸν παλαιὸν ἄνθρωπον
  choice: du vieil homme
  rationale: La traduction formelle préserve le singulier masculin et le contraste paulinien avec « l’homme nouveau » au verset suivant; « ancien » risquerait ici d’évoquer un titulaire ou un membre d’autrefois.
- source_word: σὺν ταῖς πράξεσιν αὐτοῦ
  choice: et de ses pratiques
  rationale: Dans la construction française « se dépouiller de », la coordination avec « et de » exprime naturellement que les pratiques sont ôtées avec le vieil homme. « Pratiques » convient au comportement caractéristique et « ses » reprend fidèlement le référent masculin singulier.
theological_decisions:
- issue: Sens de τὸν παλαιὸν ἄνθρωπον
  choice: le vieil homme
  alternative: l’ancien moi; la vieille nature humaine
  rationale: « Le vieil homme » conserve l’image et le lien avec « l’homme nouveau », sans réduire d’emblée l’expression au seul moi individuel ni trancher toute sa portée anthropologique.
- issue: Relation logique du participe ἀπεκδυσάμενοι
  choice: valeur causale exprimée par « puisque »
  alternative: participe concomitant « vous étant dépouillés »; valeur temporelle « après vous être dépouillés »
  rationale: Dans le contexte, le changement déjà accompli fonde probablement l’exhortation. La note maintient toutefois l’ambiguïté syntaxique réelle du participe grec.
translation_notes:
  register: Français international moderne, digne et accessible. La métaphore vestimentaire et l’expression théologiquement chargée « vieil homme » sont conservées; une note signale les principales possibilités syntaxiques et lexicales.
