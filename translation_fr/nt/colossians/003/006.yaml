  text: δι’ ἃ ἔρχεται ἡ ὀργὴ τοῦ θεοῦ ⸂ἐπὶ τοὺς υἱοὺς τῆς ἀπειθείας⸃·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/006.yaml
  text: Because of these things the wrath of God is coming upon the sons of disobedience[a].
translation:
  language: fr
  text: C’est à cause de ces choses que la colère de Dieu vient sur les fils de la désobéissance[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les enfants de la désobéissance », c’est-à-dire les personnes caractérisées par la désobéissance.
    reason: Alternative lexicale et explication de l’expression idiomatique grecque.
lexical_decisions:
- source_word: δι’ ἃ
  choice: C’est à cause de ces choses que
  rationale: διά suivi de l’accusatif exprime ici la cause. Cette tournure française renvoie clairement aux comportements énumérés au verset précédent tout en conservant le pluriel.
- source_word: ἔρχεται
  choice: vient
  rationale: Le présent de ἔρχομαι est conservé. Dans ce contexte de jugement, « vient » peut porter une orientation imminente ou eschatologique sans ajouter explicitement une nuance absente du verbe.
- source_word: ἡ ὀργὴ τοῦ θεοῦ
  choice: la colère de Dieu
  rationale: ὀργή désigne ici la colère divine dans sa dimension judiciaire. La construction avec « de Dieu » restitue naturellement le génitif grec et garde toute sa portée théologique.
- source_word: ἐπὶ
  choice: sur
  rationale: Avec l’accusatif, ἐπί indique la cible vers laquelle se dirige la colère. « Sur » est naturel en français dans ce contexte et reste proche de la construction grecque.
- source_word: τοὺς υἱοὺς τῆς ἀπειθείας
  choice: les fils de la désobéissance
  rationale: La traduction conserve l’expression sémitisante et le masculin υἱούς. Une note en explique le sens caractérisant afin que l’image ne soit pas comprise comme une filiation littérale.
theological_decisions:
- issue: Conserver l’expression idiomatique « fils de la désobéissance » ou en expliciter directement le sens
  choice: Conserver « les fils de la désobéissance » dans le texte principal
  alternative: « ceux qui désobéissent » ou « les personnes caractérisées par la désobéissance »
  rationale: Le grec emploie une formule sémitisante qui caractérise des personnes par la désobéissance. La préserver maintient la texture et l’ambiguïté rhétorique du texte source; la note en donne le sens sans réduire l’expression dans le corps du verset.
translation_notes:
  register: Français international moderne, digne et accessible. La construction emphatique « C’est à cause de ces choses que » rend le lien causal explicite; l’expression biblique inhabituelle « fils de la désobéissance » est volontairement maintenue et expliquée en note.
