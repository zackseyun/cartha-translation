id: COL.3.18
reference: Colossians 3:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Αἱ γυναῖκες, ὑποτάσσεσθε ⸀τοῖς ἀνδράσιν, ὡς ἀνῆκεν ἐν κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/018.yaml
  text: Wives[a], submit yourselves to your husbands[b], as is fitting in the Lord.
translation:
  language: fr
  text: Femmes, soumettez-vous à vos maris, comme il convient dans le Seigneur.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « comme cela convenait dans le Seigneur » ; le verbe grec est à l’imparfait, mais il semble avoir ici un sens général au présent.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γυναῖκες
  choice: Femmes
  rationale: Dans ce code domestique, en parallèle avec ἀνδράσιν, le terme désigne les femmes mariées. En français, l’adresse « Femmes » est une manière naturelle et digne de s’adresser aux épouses, tandis que « vos maris » explicite la relation conjugale.
- source_word: ὑποτάσσεσθε
  choice: soumettez-vous
  rationale: Cet impératif présent moyen/passif exprime ici le fait de se placer soi-même sous l’autorité ou dans l’ordre relationnel indiqué. La forme pronominale française conserve mieux cette nuance que « soyez soumises ».
- source_word: τοῖς ἀνδράσιν
  choice: à vos maris
  rationale: Dans le contexte conjugal, ἀνήρ signifie « mari ». Le possessif « vos » rend explicitement et naturellement en français la relation exprimée par le contexte.
- source_word: ὡς
  choice: comme
  rationale: ὡς introduit ici la conformité à ce qui convient, plutôt qu’une cause. « Comme » respecte cette fonction syntaxique.
- source_word: ἀνῆκεν
  choice: il convient
  rationale: Bien que la forme grecque soit morphologiquement à l’imparfait, elle a ici une portée gnomique ou générale. « Il convient » rend naturellement le sens présent d’obligation appropriée sans surinterprétation.
- source_word: ἐν κυρίῳ
  choice: dans le Seigneur
  rationale: La formulation littérale et traditionnelle conserve le lien théologique entre ce qui convient et la relation au Seigneur, sans réduire l’expression à « devant le Seigneur » ni l’expliciter davantage.
theological_decisions:
- issue: Portée et fondement de l’exhortation
  choice: « comme il convient dans le Seigneur » qualifie l’exhortation par la relation au Seigneur.
  alternative: Comprendre l’instruction comme une norme sociale absolue et non qualifiée, ou rattacher « dans le Seigneur » uniquement aux femmes.
  rationale: L’ordre des mots grecs rattache naturellement ἐν κυρίῳ à l’idée de ce qui convient. La traduction préserve cette qualification et la tension du texte sans ajouter de limites ou de développements doctrinaux absents du verset.
translation_notes:
  register: Français international moderne, direct et digne. « Femmes » fonctionne comme une adresse aux épouses dans le contexte, tandis que « soumettez-vous » garde la forme pronominale du grec. La note signale sans l’imposer l’autre valeur temporelle possible de ἀνῆκεν.
