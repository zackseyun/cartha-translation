id: COL.3.4
reference: Colossians 3:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὅταν ὁ Χριστὸς φανερωθῇ, ἡ ζωὴ ⸀ὑμῶν, τότε καὶ ὑμεῖς σὺν αὐτῷ φανερωθήσεσθε ἐν δόξῃ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/004.yaml
  text: When Messiah[a], who is your life, is revealed[c][b], then you also will be revealed with him in glory.
translation:
  language: fr
  text: Quand le Messie[a], qui est votre vie[b], se manifestera, alors vous serez vous aussi manifestés avec lui dans la gloire[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le Christ ». Le titre grec Χριστός peut être rendu des deux manières ; « le Messie » en exprime ici le sens.'
    reason: alternative_reading
  - marker: b
    text: 'Littéralement : « le Messie, votre vie ».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « révélés avec lui dans la gloire ». Le même verbe grec est employé plus tôt dans le verset au sujet du Messie.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: Quand
  rationale: Avec le subjonctif aoriste φανερωθῇ, le terme introduit ici un événement futur attendu. « Quand » est naturel en français et ne suggère pas une répétition.
- source_word: ὁ Χριστός
  choice: le Messie
  rationale: Χριστός est un titre correspondant au Messie, et l’article grec en souligne ici la valeur titulaire.
- source_word: φανερωθῇ / φανερωθήσεσθε
  choice: se manifestera / vous serez manifestés
  rationale: Cette formulation exprime la venue au grand jour et conserve en français le même radical pour les deux occurrences, maintenant ainsi le parallèle entre le Messie et les croyants.
- source_word: ἡ ζωὴ ὑμῶν
  choice: qui est votre vie
  rationale: La proposition relative rend clairement l’apposition grecque littérale, « le Messie, votre vie », sans en modifier le contenu.
- source_word: τότε καὶ ὑμεῖς
  choice: alors vous aussi, vous
  rationale: « Alors » rend τότε, tandis que « aussi » et la reprise du pronom font entendre l’inclusion et l’accent portés par καί et par le pronom grec explicite ὑμεῖς.
- source_word: σὺν αὐτῷ
  choice: avec lui
  rationale: Rend simplement l’association étroite exprimée par σύν, sans alourdir la phrase.
- source_word: ἐν δόξῃ
  choice: dans la gloire
  rationale: Préserve la construction prépositionnelle et laisse ouverte la nuance de sphère, d’état ou de manière glorieuse.
theological_decisions:
- issue: Traduction de Χριστός comme titre ou comme désignation devenue quasi nominale
  choice: le Messie
  alternative: le Christ
  rationale: Le grec porte l’article et emploie le terme dans une affirmation christologique où sa valeur de titre demeure pertinente. « Le Messie » traduit le sens du titre plutôt que de le translittérer.
- issue: Identification appositionnelle du Messie à la vie des croyants
  choice: qui est votre vie
  alternative: le Messie, votre vie
  rationale: La relative explicite seulement le lien grammatical nécessaire en français courant; elle maintient l’identification forte du texte sans l’expliquer davantage.
- issue: Rapport entre les deux formes de φανερόω
  choice: Employer deux formes de « manifester »
  alternative: « sera révélé / serez révélés » ou « apparaîtra / apparaîtrez »
  rationale: 'La répétition lexicale conserve le parallèle théologique du grec : la manifestation des croyants est liée à celle du Messie. Le français alterne nécessairement une forme pronominale idiomatique pour le premier sujet et une forme passive pour le second.'
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « manifestera / manifestés » est volontaire afin de conserver le parallèle grec; la reprise « vous aussi, vous » restitue l’emphase sans recourir à la typographie.
