id: COL.3.20
reference: Colossians 3:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Τὰ τέκνα, ὑπακούετε τοῖς γονεῦσιν κατὰ πάντα, τοῦτο γὰρ ⸂εὐάρεστόν ἐστιν⸃ ἐν κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/020.yaml
  text: Children[a], obey your parents in everything[b], for this is pleasing in the Lord.
translation:
  language: fr
  text: Enfants, obéissez à vos parents en tout, car cela est agréable[a] dans le Seigneur[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « est acceptable » ou « est approuvé ».'
    reason: lexical_alternative
  - marker: b
    text: L’expression « dans le Seigneur » peut désigner ce qui est agréable dans le cadre de la relation au Seigneur, plutôt que signifier simplement « au Seigneur ».
    reason: alternative_reading
lexical_decisions:
- source_word: Τὰ τέκνα
  choice: Enfants
  rationale: τέκνα désigne les enfants ou descendants sans distinction de sexe. « Enfants » convient naturellement à cette adresse directe dans le cadre familial.
- source_word: ὑπακούετε
  choice: obéissez
  rationale: L’impératif de ὑπακούω exprime l’obéissance ou le fait de se conformer à une autorité. « Obéissez » rend clairement sa force dans la relation entre enfants et parents.
- source_word: τοῖς γονεῦσιν
  choice: à vos parents
  rationale: γονεῦσιν signifie « parents ». Le possessif « vos », implicite dans le contexte grec, est nécessaire à une formulation française naturelle.
- source_word: κατὰ πάντα
  choice: en tout
  rationale: 'La construction exprime l’étendue de l’obéissance : dans tous les domaines. « En tout » est concis, courant et ne lui donne pas à tort un sens seulement temporel.'
- source_word: τοῦτο
  choice: cela
  rationale: Le démonstratif renvoie à l’obéissance qui vient d’être demandée. « Cela » conserve ce renvoi sans explicitation interprétative.
- source_word: γὰρ
  choice: car
  rationale: γάρ introduit la raison du commandement. « Car » marque directement ce lien explicatif.
- source_word: εὐάρεστόν ἐστιν
  choice: est agréable
  rationale: εὐάρεστος qualifie ce qui plaît ou reçoit approbation. « Est agréable » préserve ce sens évaluatif dans un français naturel; « est approuvé » ou « est acceptable » demeure possible.
- source_word: ἐν κυρίῳ
  choice: dans le Seigneur
  rationale: La traduction littérale « dans le Seigneur » préserve une expression paulinienne relationnelle ou sphérique et évite de la réduire au seul sens de « au Seigneur ».
theological_decisions:
- issue: Portée de « en tout » par rapport à « dans le Seigneur »
  choice: Conserver les deux expressions sans ajouter de restriction explicite; « dans le Seigneur » se rattache dans la phrase à ce qui est agréable tout en situant l’exhortation dans la relation au Seigneur.
  alternative: Comprendre « dans le Seigneur » comme une restriction directe du commandement, ou traduire « car cela plaît au Seigneur ».
  rationale: Le grec ne formule pas ici de clause d’exception et ne rattache pas grammaticalement sans ambiguïté ἐν κυρίῳ à l’impératif. La formulation retenue conserve l’étendue affirmée par κατὰ πάντα ainsi que l’ambiguïté théologique et relationnelle de l’expression paulinienne.
translation_notes:
  register: Français international moderne, clair et digne. L’adresse directe « Enfants » et l’impératif « obéissez » gardent la netteté du grec. « En tout » est préféré à « en toutes choses », plus soutenu et moins naturel, tandis que « dans le Seigneur » est maintenu pour préserver l’expression paulinienne et son ouverture interprétative.
