  - severity: medium
    issue: « Vous conduisiez » omet le pronom réfléchi requis par le sens choisi de περιπατέω.
    rationale: 'En français, « se conduire » s’emploie ici sous la forme pronominale : « vous vous conduisiez ». Sans ce pronom, la formulation est grammaticalement défectueuse ou appelle un complément d’objet absent.'
