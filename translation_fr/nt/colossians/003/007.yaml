  source_fidelity: 'Le texte principal rend correctement la référence la plus probable de ἐν οἷς et de ἐν τούτοις aux pratiques énumérées. Toutefois, la note proposée élargit indûment cette référence aux « personnes désobéissantes » : le contexte immédiat et la reprise démonstrative τούτοις favorisent les réalités/pratiques évoquées, non des personnes. La formulation principale doit aussi employer le pronom réfléchi avec « se conduire ».'
  naturalness: '« Vous conduisiez » est fautif ou, au minimum, nettement non naturel ici en français : « se conduire » exige « vous vous conduisiez ». La phrase corrigée reste moderne, claire et conserve la différence entre la conduite (περιεπατήσατε) et la vie menée (ἐζῆτε).'
  terminology: « Ces pratiques », « vous vous conduisiez », « autrefois » et « vous viviez en elles » constituent un ensemble cohérent, digne et intelligible. « Pratiques » explicite avec justesse le renvoi aux comportements de la liste précédente sans introduire une interprétation doctrinale.
