  yaml_path: translation/nt/colossians/003/007.yaml
  text: In these things you too once walked[a], when you were living in them.
translation:
  language: fr
  text: C’est dans ces pratiques que vous aussi vous vous conduisiez autrefois, lorsque vous viviez en elles.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν οἷς
  choice: C’est dans ces choses que
  rationale: Le pronom relatif au datif pluriel renvoie aux pratiques mentionnées juste avant. Cette tournure française explicite naturellement ce renvoi tout en conservant la valeur de ἐν.
- source_word: καὶ ὑμεῖς
  choice: vous aussi
  rationale: 'Cette formulation préserve l’accent porté par καὶ sur le pronom explicite ὑμεῖς : les Colossiens avaient eux aussi participé à cette manière de vivre.'
- source_word: περιεπατήσατε
  choice: vous conduisiez
  rationale: Le verbe περιπατέω décrit métaphoriquement la manière de vivre. « Vous conduisiez » rend ce sens en français courant et digne, sans le confondre avec ζάω dans la proposition suivante.
- source_word: ποτε
  choice: autrefois
  rationale: « Autrefois » exprime clairement une période passée désormais révolue et convient au registre de l’épître.
- source_word: ὅτε
  choice: lorsque
  rationale: Conjonction temporelle naturelle qui relie la conduite passée à l’état de vie passé.
- source_word: ἐζῆτε
  choice: vous viviez
  rationale: L’imparfait français rend l’aspect continu de l’imparfait grec et maintient la distinction lexicale avec περιπατέω.
- source_word: ἐν τούτοις
  choice: en elles
  rationale: Le pronom reprend les « choses » précédentes et conserve l’idée d’une vie située dans la sphère de ces pratiques, sans répétition lourde.
theological_decisions:
- issue: Rapport entre « se conduire » et « vivre » dans la description éthique de Paul
  choice: Maintenir la distinction entre la conduite passée (« vous vous conduisiez ») et la sphère ou l’état de vie passé (« vous viviez en elles »).
  alternative: Rendre les deux verbes par « vivre ».
  rationale: La distinction reflète les deux verbes grecs περιπατέω et ζάω et conserve les deux niveaux de la description de Paul sans ajouter d’interprétation doctrinale.
translation_notes:
  register: Français international moderne, naturel et digne. « Se conduire » transmet la métaphore éthique de περιπατέω plus idiomatiquement que le calque « marcher », tout en conservant la distinction avec « vivre ». La note préserve l’ambiguïté réelle du masculin/neutre pluriel en grec.
