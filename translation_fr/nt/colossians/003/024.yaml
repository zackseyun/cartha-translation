id: COL.3.24
reference: Colossians 3:24
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἰδότες ὅτι ἀπὸ κυρίου ⸀ἀπολήμψεσθε τὴν ἀνταπόδοσιν τῆς κληρονομίας· ⸀τῷ κυρίῳ Χριστῷ δουλεύετε·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/024.yaml
  text: knowing that from the Lord you will receive the reward of the inheritance[b][a]. Serve the Lord Messiah.
translation:
  language: fr
  text: sachant que vous recevrez du Seigneur, en récompense, l’héritage. C’est le Seigneur, le Messie, que vous servez.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, selon la formulation traditionnelle : « le Seigneur Christ ».'
    reason: alternative_reading
lexical_decisions:
- source_word: εἰδότες
  choice: sachant
  rationale: Le participe présent maintient le lien syntaxique et exhortatif avec le verset précédent, sans imposer explicitement une valeur causale comme « puisque vous savez ».
- source_word: ἀπὸ κυρίου
  choice: du Seigneur
  rationale: 'La préposition ἀπό avec le génitif indique ici la source : c’est du Seigneur que vient la récompense.'
- source_word: ἀπολήμψεσθε
  choice: vous recevrez
  rationale: Ce futur moyen de l’indicatif exprime le fait de recevoir, éventuellement en retour. La notion de retour est rendue par « en récompense ».
- source_word: ἀνταπόδοσιν τῆς κληρονομίας
  choice: l’héritage en récompense
  rationale: Cette formulation française naturelle exprime le rapport étroit entre la récompense et l’héritage sans recourir au tour peu idiomatique « la récompense de l’héritage ».
- source_word: τῷ κυρίῳ Χριστῷ
  choice: le Seigneur, le Messie
  rationale: Le datif désigne celui qui est servi. « Messie » rend la valeur titulaire de Χριστός, tandis que l’apposition française évite de faire de « Seigneur-Messie » un titre composé artificiel.
- source_word: δουλεύετε
  choice: vous servez
  rationale: La forme grecque est un présent actif de l’indicatif, deuxième personne du pluriel. La traduction conserve l’affirmation qui motive l’exhortation, plutôt que de la transformer en impératif.
theological_decisions:
- issue: Valeur de Χριστῷ dans l’expression christologique
  choice: Messie
  alternative: Christ
  rationale: Χριστός garde ici sa valeur de titre. « Messie » la rend explicitement; « Christ » demeure l’équivalent traditionnel et familier, signalé en note.
- issue: Valeur modale de δουλεύετε
  choice: 'indicatif : « vous servez »'
  alternative: 'impératif : « servez »'
  rationale: La morphologie grecque est sans ambiguïté un indicatif présent. Le contexte est exhortatif, mais l’énoncé fonctionne comme un rappel motivant plutôt que comme un nouvel ordre explicite.
- issue: Relation entre la récompense et l’héritage
  choice: l’héritage reçu en récompense
  alternative: la récompense de l’héritage
  rationale: Le génitif grec est compact et peut décrire la récompense comme consistant dans l’héritage. La formulation retenue rend ce sens probable dans un français courant sans développer davantage l’idée.
translation_notes:
  register: Français international moderne, sobre et digne. Le participe initial conserve la continuité avec le verset précédent. L’indicatif « vous servez » respecte la morphologie grecque malgré la force exhortative du contexte.
