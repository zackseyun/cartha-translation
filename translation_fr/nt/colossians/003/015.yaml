id: COL.3.15
reference: Colossians 3:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἡ εἰρήνη τοῦ ⸀Χριστοῦ βραβευέτω ἐν ταῖς καρδίαις ὑμῶν, εἰς ἣν καὶ ἐκλήθητε ἐν ἑνὶ σώματι· καὶ εὐχάριστοι γίνεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/015.yaml
  text: And let the peace of Messiah rule in your hearts[a], to which indeed you were called in one body[c][b]. And be thankful.
translation:
  language: fr
  text: 'Que la paix du Messie règne dans vos cœurs[a] : c’est à elle que vous avez aussi été appelés dans un seul corps[b]. Et soyez reconnaissants.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe grec peut aussi signifier « arbitrer » ou « décider », évoquant la fonction d’un arbitre.
    reason: lexical_alternative
  - marker: b
    text: Ou « en un seul corps ». La préposition grecque peut présenter ce corps comme la sphère de l’appel; le contexte peut aussi suggérer l’incorporation à un corps unique.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰρήνη
  choice: paix
  rationale: Équivalent français naturel qui exprime ici la paix relationnelle et communautaire liée à l’œuvre salvatrice de Dieu.
- source_word: τοῦ Χριστοῦ
  choice: du Messie
  rationale: Χριστός garde ici sa valeur de titre, « l’Oint »; « Messie » en restitue le sens plutôt que de le translittérer.
- source_word: βραβευέτω
  choice: règne
  rationale: Le verbe évoque l’action de décider ou d’arbitrer. « Règne » exprime naturellement en français la fonction directrice de cette paix, tandis qu’une note préserve l’image plus précise.
- source_word: ἐν ταῖς καρδίαις ὑμῶν
  choice: dans vos cœurs
  rationale: Expression française biblique encore courante pour la vie intérieure, les dispositions et la volonté; le pluriel du grec est conservé.
- source_word: εἰς ἣν
  choice: c’est à cette paix que
  rationale: La reprise explicite de « paix » évite en français une relative lourde ou ambiguë et conserve l’idée de but attachée à l’appel.
- source_word: καὶ ἐκλήθητε
  choice: vous avez été appelés
  rationale: La voix passive et l’idée d’appel sont maintenues; la tournure clivée rend naturellement l’emphase portée par καί dans le contexte.
- source_word: ἐν ἑνὶ σώματι
  choice: en un seul corps
  rationale: Traduction directe qui préserve la métaphore collective sans l’expliciter comme désignant l’Église.
- source_word: εὐχάριστοι γίνεσθε
  choice: soyez reconnaissants
  rationale: « Soyez reconnaissants » est une exhortation française naturelle; elle rend l’état demandé sans imposer à γίνεσθε le sens plus marqué de « devenez ».
theological_decisions:
- issue: Valeur de Χριστοῦ
  choice: du Messie
  alternative: du Christ
  rationale: Le terme fonctionne comme un titre et « Messie » en rend la portée d’oint attendu; l’alternative traditionnelle reste possible mais n’est pas nécessaire dans le corps du texte.
- issue: Portée de ἐν ἑνὶ σώματι
  choice: en un seul corps
  alternative: dans un seul corps / pour former un seul corps
  rationale: La formulation retenue conserve l’image de l’unité collective et l’ambiguïté entre sphère et incorporation, sans ajouter explicitement « l’Église ».
- issue: Fonction de la paix dans βραβευέτω
  choice: qu’elle règne
  alternative: qu’elle arbitre / qu’elle décide
  rationale: Le texte attribue à la paix une fonction déterminante dans la vie intérieure et communautaire. « Règne » est idiomatique, tandis que la note signale l’image de l’arbitre.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe est légèrement explicitée par « c’est à cette paix que » afin d’éviter une relative française peu naturelle. La métaphore du corps et la tension sémantique du verbe βραβεύω sont préservées sans développement confessionnel.
