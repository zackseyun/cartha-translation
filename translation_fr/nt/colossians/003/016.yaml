  rationale: La révision homogénéise la syntaxe française en faisant dépendre les actions d’enseignement, d’avertissement et de chant de « Que ... demeure ». Elle clarifie ainsi la mutualité de ἑαυτούς sans imposer une lecture théologique supplémentaire. Les ambiguïtés textuelles signalées dans les notes sont conservées, de même que le choix de « Messie » pour Χριστός employé comme titre.
