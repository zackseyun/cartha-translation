  source_fidelity: 'Le projet rend fidèlement les éléments principaux : « parole du Messie » préserve le génitif ouvert de τοῦ Χριστοῦ, « en vous » conserve l’ambivalence individuelle et communautaire de ἐν ὑμῖν, et les notes rendent compte de deux ambiguïtés réelles (rattachement de ἐν πάσῃ σοφίᾳ ; sens de ἐν χάριτι). « Par des psaumes, des hymnes et des chants spirituels » reflète bien la valeur instrumentale des datifs.'
  naturalness: Une légère révision est nécessaire. La succession « enseignez-vous et avertissez-vous les uns les autres » est maladroite et crée une portée incertaine de « les uns les autres » ; de plus, l’enchaînement d’impératifs avec « chantant » est moins fluide en français. Une construction participiale homogène rend mieux la dépendance des participes grecs envers l’impératif initial.
  terminology: « Messie », « parole », « psaumes », « hymnes », « chants spirituels » et « grâce » sont appropriés, modernes et non confessionnellement surinterprétatifs. « Demeure ... abondamment » est plus idiomatique que « habite ... avec abondance » tout en gardant l’image et l’aspect continu du grec.
