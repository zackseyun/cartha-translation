id: COL.3.16
reference: Colossians 3:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ λόγος τοῦ Χριστοῦ ἐνοικείτω ἐν ὑμῖν πλουσίως ἐν πάσῃ σοφίᾳ· διδάσκοντες καὶ νουθετοῦντες ἑαυτοὺς ⸀ψαλμοῖς, ⸀ὕμνοις, ᾠδαῖς πνευματικαῖς ⸀ἐν χάριτι, ᾄδοντες ἐν ⸂ταῖς καρδίαις⸃ ὑμῶν τῷ ⸀θεῷ·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/016.yaml
  text: Let the word of Messiah dwell in you richly in all wisdom[a], teaching and admonishing one another with psalms, hymns, and spiritual songs[b], singing with grace in your hearts to God.
translation:
  language: fr
  text: Que la parole du Messie demeure en vous[a] abondamment, en toute sagesse[b], en vous enseignant et en vous avertissant les uns les autres par des psaumes, des hymnes et des chants spirituels, et en chantant à Dieu avec grâce[c] dans vos cœurs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « parmi vous ». Le pronom grec est pluriel : la parole peut être envisagée comme habitant dans les croyants ou au sein de la communauté dans son ensemble.'
    reason: alternative_reading
  - marker: b
    text: L’expression « en toute sagesse » peut se rattacher à ce qui précède ou aux actions d’enseigner et d’avertir qui suivent.
    reason: syntactic_ambiguity
  - marker: c
    text: Ou « avec reconnaissance ». Dans ce contexte, le grec peut évoquer la grâce, une disposition gracieuse ou la gratitude.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ λόγος τοῦ Χριστοῦ
  choice: la parole du Messie
  rationale: « Parole » conserve l’ampleur de λόγος, qui peut désigner le message lié au Messie. Le génitif « du Messie » préserve sans la trancher la relation de source ou de contenu, tandis que « Messie » rend Χριστός comme titre.
- source_word: ἐνοικείτω
  choice: habite
  rationale: Le verbe maintient l’image d’une présence intérieure et durable; le présent impératif grec appelle à un état continu.
- source_word: ἐν ὑμῖν
  choice: en vous
  rationale: Rend directement la préposition grecque et le pronom pluriel. En français, « vous » permet de conserver l’ouverture entre la présence dans chaque croyant et au sein de la communauté.
- source_word: πλουσίως
  choice: avec abondance
  rationale: Expression française naturelle qui communique la plénitude exprimée par l’adverbe grec.
- source_word: ἐν πάσῃ σοφίᾳ
  choice: en toute sagesse
  rationale: Rendu proche du grec qui évite d’imposer un rattachement syntaxique exclusif à « habite » ou aux actions d’enseigner et d’avertir.
- source_word: διδάσκοντες καὶ νουθετοῦντες ἑαυτούς
  choice: enseignez-vous et avertissez-vous les uns les autres
  rationale: « Enseigner » rend clairement διδάσκω; « avertir » garde la dimension corrective de νουθετέω. Le réfléchi pluriel exprime ici une action réciproque dans la communauté.
- source_word: ψαλμοῖς, ὕμνοις, ᾠδαῖς πνευματικαῖς
  choice: par des psaumes, des hymnes et des chants spirituels
  rationale: La préposition « par » exprime la valeur instrumentale du datif, tout en maintenant les trois catégories de chants et le lien grammatical de « spirituels » avec « chants ».
- source_word: ἐν χάριτι
  choice: avec grâce
  rationale: Ce rendu conserve la polysémie de χάρις — grâce, qualité gracieuse ou reconnaissance — sans réduire immédiatement l’expression à un seul sens.
- source_word: ἐν ταῖς καρδίαις ὑμῶν τῷ θεῷ
  choice: à Dieu avec grâce dans vos cœurs
  rationale: Conserve Dieu comme destinataire du chant et le cœur comme lieu intérieur de celui-ci, tout en gardant l’ordre français intelligible.
theological_decisions:
- issue: Valeur de Χριστοῦ
  choice: du Messie
  alternative: du Christ
  rationale: Χριστός fonctionne ici comme le titre messianique. « Messie » en exprime le sens et maintient l’arrière-plan juif du titre.
- issue: Portée individuelle ou communautaire de ἐν ὑμῖν
  choice: en vous
  alternative: parmi vous
  rationale: Le pronom est pluriel et le contexte décrit une pratique réciproque de l’assemblée. « En vous » suit directement le grec tout en laissant ouverte une lecture individuelle et collective; l’autre possibilité est signalée en note.
- issue: Rattachement de ἐν πάσῃ σοφίᾳ
  choice: ponctuation qui laisse le rattachement ouvert
  alternative: rattacher explicitement l’expression soit à l’habitation de la parole, soit à l’enseignement et à l’avertissement
  rationale: La syntaxe grecque permet plusieurs rattachements plausibles. La traduction évite de résoudre une ambiguïté réelle.
- issue: Sens de ἐν χάριτι
  choice: avec grâce
  alternative: avec reconnaissance
  rationale: χάρις peut ici évoquer la grâce, une disposition gracieuse ou la gratitude. Le texte principal garde le terme théologiquement et lexicalement large, tandis que la note présente la lecture courante liée à la reconnaissance.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve le vocabulaire imagé de l’habitation, la réciprocité communautaire et les ambiguïtés syntaxique et lexicale du grec. « Avec abondance » est préféré à l’adverbe plus soutenu « richement », et « chants spirituels » à « cantiques spirituels » pour rester largement compréhensible sans effacer la distinction entre psaumes, hymnes et chants.
