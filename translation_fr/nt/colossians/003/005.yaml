id: COL.3.5
reference: Colossians 3:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Νεκρώσατε οὖν τὰ ⸀μέλη τὰ ἐπὶ τῆς γῆς, πορνείαν, ἀκαθαρσίαν, πάθος, ἐπιθυμίαν κακήν, καὶ τὴν πλεονεξίαν ἥτις ἐστὶν εἰδωλολατρία,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/005.yaml
  text: 'Therefore[a], put to death the members that are on the earth: sexual immorality, impurity, passion, evil desire, and greed[b], which is idolatry.'
translation:
  language: fr
  text: 'Faites donc mourir les membres qui sont sur la terre[a] : l’immoralité sexuelle, l’impureté, la passion, le mauvais désir et l’avidité[b], qui est de l’idolâtrie.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ce qui, en vous, appartient à la terre ». Le grec dit plus littéralement « les membres qui sont sur la terre ».
    reason: lexical_alternative
  - marker: b
    text: Ou « la convoitise ».
    reason: lexical_alternative
lexical_decisions:
- source_word: Νεκρώσατε
  choice: Faites mourir
  rationale: L’impératif aoriste appelle une action résolue. « Faites mourir » conserve la force de la métaphore sans recourir à l’archaïsme « mortifiez ».
- source_word: οὖν
  choice: donc
  rationale: Marque la conséquence tirée du raisonnement précédent et s’intègre naturellement à l’impératif en français.
- source_word: μέλη τὰ ἐπὶ τῆς γῆς
  choice: les membres qui sont sur la terre
  rationale: Rendu volontairement proche du grec afin de préserver la métaphore corporelle et spatiale, sans lui substituer une abstraction telle que « votre nature terrestre ».
- source_word: πορνείαν
  choice: l’immoralité sexuelle
  rationale: Expression moderne et assez large pour rendre ce terme désignant les conduites sexuelles illicites.
- source_word: ἀκαθαρσίαν
  choice: l’impureté
  rationale: Équivalent courant du terme moral paulinien, sans en restreindre indûment la portée.
- source_word: πάθος
  choice: la passion
  rationale: Conserve le singulier et rend directement l’idée d’une passion désordonnée; « convoitise » serait plus interprétatif.
- source_word: ἐπιθυμίαν κακήν
  choice: le mauvais désir
  rationale: Rend explicitement la qualification morale apportée par κακήν tout en restant naturel en français.
- source_word: πλεονεξίαν
  choice: l’avidité
  rationale: Exprime clairement le désir insatiable d’avoir davantage. « Convoitise » demeure une possibilité et figure en note.
- source_word: ἥτις ἐστὶν εἰδωλολατρία
  choice: qui est une idolâtrie
  rationale: Préserve l’identification forte formulée par Paul, sans l’atténuer en « ressemble à » ou « revient à ».
theological_decisions:
- issue: Référent de « qui est une idolâtrie »
  choice: La proposition relative se rapporte spécifiquement à « l’avidité ».
  alternative: Elle pourrait récapituler toute la liste précédente.
  rationale: Le pronom relatif féminin singulier ἥτις s’accorde le plus naturellement avec le nom féminin singulier immédiatement précédent, πλεονεξίαν.
- issue: Sens de « les membres qui sont sur la terre »
  choice: Maintenir dans le texte la métaphore des membres et la formulation spatiale.
  alternative: « ce qui, en vous, appartient à la terre » ou « votre nature terrestre »
  rationale: Le grec nomme explicitement les « membres »; la liste qui suit peut préciser en apposition ce qui doit être mis à mort. Une reformulation abstraite résoudrait prématurément l’image.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation inhabituelle « les membres qui sont sur la terre » est conservée intentionnellement pour respecter l’image grecque; la note fournit une lecture plus idiomatique sans l’imposer au texte.
