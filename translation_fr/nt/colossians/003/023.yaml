  text: ⸀ὃ ἐὰν ποιῆτε, ἐκ ψυχῆς ἐργάζεσθε, ὡς τῷ κυρίῳ καὶ οὐκ ἀνθρώποις,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/023.yaml
  text: Whatever you do[a], work from the soul, as for the Lord and not for men[c][b],
translation:
  language: fr
  text: Quoi que vous fassiez, travaillez-y de tout cœur[a], comme pour le Seigneur[b] et non pour des êtres humains[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avec un engagement entier » ; littéralement « de l’âme ».
    reason: lexical_alternative
  - marker: b
    text: Dans ce contexte domestique, « Seigneur » peut aussi porter la nuance de « Maître ».
    reason: alternative_reading
  - marker: c
    text: Le grec désigne ici les humains en général, par contraste avec le Seigneur.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃ ἐὰν ποιῆτε
  choice: Quoi que vous fassiez
  rationale: Le relatif neutre avec ἐάν exprime une généralité indéfinie. Cette tournure française naturelle conserve le sens de « tout ce que vous pouvez faire ».
- source_word: ἐκ ψυχῆς
  choice: de toute votre âme
  rationale: Cette formulation conserve l’image de ψυχή tout en exprimant l’engagement intérieur, sincère et entier demandé par le texte.
- source_word: ἐργάζεσθε
  choice: travaillez-y
  rationale: L’impératif présent appelle à accomplir avec engagement toute tâche mentionnée dans la proposition précédente. Le pronom « y » relie naturellement l’exhortation à « quoi que vous fassiez ».
- source_word: ὡς τῷ κυρίῳ
  choice: comme pour le Seigneur
  rationale: ὡς indique la manière ou la perspective dans laquelle le travail doit être accompli; le datif se rend naturellement par « pour ». « Seigneur » préserve le titre κύριος.
- source_word: ἀνθρώποις
  choice: des êtres humains
  rationale: Le pluriel désigne ici les humains en général, par contraste avec le Seigneur, sans référence exclusivement masculine.
theological_decisions:
- issue: Sens de κύριος dans le cadre des instructions domestiques
  choice: Seigneur
  alternative: maître
  rationale: Dans ce contexte, κύριος renvoie très probablement au Seigneur exalté, tout en faisant écho à la relation sociale entre esclaves et maîtres. Le texte principal conserve le titre christologique usuel, et une note signale la nuance contextuelle possible.
translation_notes:
  register: Français international moderne, naturel et digne. La traduction conserve l’image anthropologique de l’âme sans employer le tour moins idiomatique « depuis l’âme ». « Êtres humains » rend explicitement la portée générique de ἀνθρώποις.
