source:
  edition: SBLGNT
  text: οἱ ἄνδρες, ἀγαπᾶτε τὰς γυναῖκας καὶ μὴ πικραίνεσθε πρὸς αὐτάς.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/019.yaml
  text: Husbands[a], love your wives, and do not be harsh toward them.
translation:
  language: fr
  text: Maris, aimez votre femme et ne vous aigrissez pas contre elle.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ne soyez pas durs envers elle ». Le verbe grec peut évoquer le fait de devenir amer ou aigri, et, dans ce contexte, une attitude dure ou pleine de ressentiment.'
    reason: Alternative lexicale conservant les nuances intérieure et comportementale du verbe πικραίνω.
lexical_decisions:
- source_word: οἱ ἄνδρες
  choice: Maris
  rationale: Dans le cadre des instructions données au foyer et en relation avec τὰς γυναῖκας, ἄνδρες désigne clairement les hommes en tant que maris.
- source_word: ἀγαπᾶτε
  choice: aimez
  rationale: Ce verbe rend directement l’impératif présent de ἀγαπάω et conserve son sens relationnel sans paraphrase.
- source_word: τὰς γυναῖκας
  choice: votre femme
  rationale: Dans ce contexte conjugal, γυναῖκας signifie « femmes » au sens d’épouses. Le français idiomatique emploie ici le singulier distributif après l’adresse collective « Maris ».
- source_word: μὴ πικραίνεσθε
  choice: ne vous aigrissez pas
  rationale: La forme médio-passive peut exprimer le fait de devenir amer ou aigri. Cette traduction conserve l’image grecque de l’amertume et sa portée relationnelle, sans la réduire uniquement à un comportement dur.
- source_word: πρὸς αὐτάς
  choice: contre elle
  rationale: πρός avec l’accusatif indique ici l’orientation de l’attitude envers les épouses. « Contre elle » s’accorde naturellement avec « s’aigrir » et reprend le singulier distributif français.
theological_decisions:
- issue: Adresse conjugale et genrée
  choice: Conserver l’adresse explicite aux maris et la référence à leur épouse.
  alternative: Employer les termes généraux « hommes » et « femmes ».
  rationale: Le contexte immédiat des instructions au foyer impose le sens conjugal de ἀνήρ et γυνή; élargir ces termes effacerait la relation spécifiquement visée.
- issue: Portée de πικραίνεσθε
  choice: Conserver l’idée de devenir aigri contre son épouse.
  alternative: Traduire uniquement par « ne la traitez pas durement ».
  rationale: Le grec peut viser une amertume intérieure qui se manifeste dans la relation. La formulation retenue préserve cette tension entre disposition et conduite, tandis que la note donne l’autre expression naturelle possible.
translation_notes:
  register: Français moderne, sobre et digne. Le singulier distributif « votre femme… elle » est plus naturel en français que le pluriel calqué « vos femmes… elles ». « Ne vous aigrissez pas » préserve l’image de l’amertume du texte grec; la note explicite la nuance de dureté relationnelle.
