  yaml_path: translation/nt/colossians/003/003.yaml
  text: For you died, and your life has been hidden with the Messiah in God.
translation:
  language: fr
  text: Car vous êtes morts, et votre vie est cachée[b] avec le Messie[a] en Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le Christ ». Le titre grec Χριστός peut être rendu par « Messie » ou « Christ ».'
    reason: alternative_reading
  - marker: b
    text: 'Le parfait grec peut être rendu plus explicitement : « a été cachée et demeure cachée ». Il souligne un état présent résultant d’une action accomplie.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεθάνετε
  choice: vous êtes morts
  rationale: L’aoriste indique ici la mort décisive des croyants évoquée dans le contexte. En français, le passé composé exprime naturellement ce fait passé et s’accorde avec l’adresse au pluriel.
- source_word: γάρ
  choice: Car
  rationale: La conjonction introduit le fondement de l’exhortation précédente; « Car » en conserve clairement la valeur explicative.
- source_word: ἡ ζωὴ ὑμῶν
  choice: votre vie
  rationale: Rendu direct et naturel, sans expliciter davantage la nature de cette vie.
- source_word: κέκρυπται
  choice: est cachée
  rationale: Le parfait passif décrit une action accomplie dont l’état résultant demeure. « Est cachée » exprime naturellement en français cet état présent, tandis qu’une note signale la nuance résultative.
- source_word: σὺν τῷ Χριστῷ
  choice: avec le Messie
  rationale: σύν exprime l’association ou l’union. Χριστός garde ici sa valeur de titre; « le Messie » en rend le sens tout en signalant « le Christ » comme traduction traditionnelle possible.
- source_word: ἐν τῷ θεῷ
  choice: en Dieu
  rationale: La préposition ἐν désigne ici la sphère ou le lieu; « en Dieu » préserve cette formulation et sa portée théologique sans paraphrase.
theological_decisions:
- issue: Rendre Χριστῷ comme titre ou sous sa forme traditionnelle devenue quasi nominale
  choice: le Messie
  alternative: le Christ
  rationale: Le grec Χριστός signifie « oint » et fonctionne ici comme un titre. « Messie » en préserve explicitement le sens, sans nier que « Christ » soit une traduction française établie.
- issue: Portée de l’union exprimée par σὺν ... ἐν
  choice: avec le Messie en Dieu
  alternative: auprès du Christ, avec Dieu
  rationale: La formulation retenue conserve les deux prépositions grecques distinctes et laisse intacte la tension théologique de la vie des croyants associée au Messie et située « en Dieu ».
translation_notes:
  register: Français international moderne, sobre et digne. « Car » maintient le lien argumentatif avec le verset précédent. Le passé composé « vous êtes morts » est idiomatique en français; « est cachée » rend naturellement l’état résultant du parfait grec.
