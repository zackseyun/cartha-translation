  text: ὁ ⸀γὰρ ἀδικῶν κομίσεται ὃ ἠδίκησεν, καὶ οὐκ ἔστιν προσωπολημψία.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/025.yaml
  text: For the wrongdoer will be repaid for what he has done wrong[b][a], and there is no partiality.
translation:
  language: fr
  text: Car celui qui fait le mal recevra en retour le mal qu’il a fait[a], et il n’y a pas de favoritisme[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « recevra ce qui correspond au mal qu’il a fait » ; littéralement : « recevra ce qu’il a commis injustement ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « il n’y a pas de traitement de faveur ». L’expression grecque désigne le fait de juger selon l’apparence ou le rang d’une personne.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ γὰρ ἀδικῶν
  choice: Car celui qui fait le mal
  rationale: Le participe présent substantivé désigne de façon générale toute personne qui agit mal. « Celui qui fait le mal » est naturel en français, conserve le singulier générique et rend γάρ par « car », qui introduit la justification donnée par le verset.
- source_word: κομίσεται
  choice: recevra en retour
  rationale: Dans ce contexte, le verbe exprime l’idée de recevoir ce qui correspond à ses actes. « Recevra en retour » préserve cette rétribution sans préciser son mécanisme ni son moment.
- source_word: ὃ ἠδίκησεν
  choice: le mal qu’il a fait
  rationale: Cette formulation reprend le même champ lexical que la première occurrence de ἀδικέω et exprime clairement que la personne recevra en retour ce qui correspond au mal commis.
- source_word: οὐκ ἔστιν προσωπολημψία
  choice: il n’y a pas de favoritisme
  rationale: προσωπολημψία désigne le fait de favoriser quelqu’un en fonction de sa personne, de son rang ou de son apparence. « Favoritisme » est moderne, clair et évite les tournures françaises archaïques.
- source_word: masculin singulier générique de ὁ … ἀδικῶν / ἠδίκησεν
  choice: celui … il
  rationale: Le grec emploie un masculin singulier à portée générique. Le français conserve cette forme grammaticale sans limiter le principe aux hommes.
theological_decisions:
- issue: Nature et portée de la rétribution impartiale
  choice: Le verset énonce un principe général de rétribution impartiale sans en préciser le mécanisme ni le moment.
  alternative: Limiter l’énoncé au jugement eschatologique ou uniquement aux rapports sociaux immédiats entre esclaves et maîtres.
  rationale: La formulation grecque est générale. La traduction garde donc l’avertissement dans toute son ampleur et ne résout pas ce que le texte laisse ouvert.
translation_notes:
  register: Français international moderne, clair et digne. La répétition de « mal » reproduit volontairement le lien entre les deux formes du verbe grec ἀδικέω. Le singulier générique est conservé, et la phrase reste solennelle sans employer de vocabulaire archaïque.
