  text: Set your minds on the things above[b][a], not on the things on the earth.
translation:
  language: fr
  text: Tournez vos pensées vers les réalités d’en haut[a], non vers les réalités terrestres.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Portez votre attention vers les réalités d’en haut. » Le verbe grec concerne non seulement la pensée, mais aussi l’orientation de l’esprit, de l’attitude et des préoccupations.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ἄνω
  choice: les réalités d’en haut
  rationale: L’article neutre pluriel accompagné de l’adverbe ἄνω fonctionne comme un substantif. « Les réalités d’en haut » conserve le pluriel et exprime naturellement en français les choses ou réalités appartenant à la sphère d’en haut.
- source_word: φρονεῖτε
  choice: Attachez vos pensées à
  rationale: 'Le verbe φρονέω désigne plus qu’une réflexion ponctuelle : il implique l’orientation durable de la pensée, de l’attitude et des préoccupations. Cette formulation rend la force de l’impératif présent sans réduire le sens à une activité purement intellectuelle.'
- source_word: μὴ
  choice: non à
  rationale: μή nie par contraste le second complément de l’impératif. « Non à » reprend naturellement en français la construction du premier membre et met en relief l’opposition.
- source_word: τὰ ἐπὶ τῆς γῆς
  choice: celles qui sont sur la terre
  rationale: Le pronom « celles » renvoie aux « réalités » et maintient la construction substantivée ainsi que le contraste spatial concret avec « d’en haut ».
- source_word: γῆς
  choice: terre
  rationale: Dans cette opposition cosmique avec ce qui est « d’en haut », γῆ désigne la terre, et non un pays ou un territoire particulier.
theological_decisions:
- issue: Portée de l’exhortation exprimée par φρονεῖτε
  choice: Une exhortation à orienter durablement ses pensées, ses dispositions et ses préoccupations vers les réalités d’en haut
  alternative: Un commandement plus étroit invitant seulement à penser intellectuellement au ciel
  rationale: Le champ sémantique de φρονέω inclut l’état d’esprit, l’attitude et l’orientation intérieure. La traduction retenue conserve cette ampleur éthique et spirituelle sans ajouter de précision doctrinale étrangère au texte.
translation_notes:
  register: Français international moderne, naturel et digne. « Réalités » évite le tour moins idiomatique « choses d’en haut », tandis que la reprise par « celles » conserve le parallélisme. L’impératif présent grec est rendu comme une orientation continue, sans ajout explicatif dans le corps du verset.
