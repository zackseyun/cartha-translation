reference: Colossians 3:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀνεχόμενοι ἀλλήλων καὶ χαριζόμενοι ἑαυτοῖς ἐάν τις πρός τινα ἔχῃ μομφήν· καθὼς καὶ ὁ ⸀κύριος ἐχαρίσατο ὑμῖν οὕτως καὶ ὑμεῖς·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/013.yaml
  text: bearing with one another and forgiving each other[a], if anyone has a complaint against anyone; just as the Lord also forgave you[b], so also you must do.
translation:
  language: fr
  text: Supportez-vous les uns les autres et pardonnez-vous mutuellement, si quelqu’un a un grief contre quelqu’un[a] ; de même que le Seigneur vous a pardonné, vous aussi, faites de même[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « si quelqu’un a un reproche contre un autre ».'
    reason: lexical_alternative
  - marker: b
    text: Littéralement, le grec s’achève par « ainsi, vous aussi » ; le verbe est sous-entendu d’après le contexte.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνεχόμενοι ἀλλήλων
  choice: Supportez-vous les uns les autres
  rationale: Le présent participial exprime une disposition continue au sein de la communauté. « Se supporter » est naturel en français moderne et conserve l’idée de patience relationnelle sans durcir le sens en « endurer ».
- source_word: χαριζόμενοι ἑαυτοῖς
  choice: pardonnez-vous mutuellement
  rationale: Dans ce contexte, χαρίζομαι désigne la remise d’une offense, avec une nuance de grâce. « Mutuellement » rend clairement la valeur réciproque de ἑαυτοῖς et évite une répétition lourde de « les uns les autres ».
- source_word: ἐάν τις πρός τινα ἔχῃ μομφήν
  choice: si l’un de vous a un reproche à faire à un autre
  rationale: La tournure conserve le caractère général de la condition et rend μομφή par une expression française courante, sans transformer le reproche en accusation formelle.
- source_word: καθὼς καὶ
  choice: Tout comme
  rationale: Cette locution exprime nettement la comparaison entre le pardon reçu du Seigneur et le pardon à accorder aux autres.
- source_word: ὁ κύριος
  choice: le Seigneur
  rationale: « Seigneur » est le rendu français établi du titre κύριος et ne précise pas davantage le référent que ne le fait le grec.
- source_word: ἐχαρίσατο ὑμῖν
  choice: vous a pardonné
  rationale: Le passé composé rend naturellement en français l’action antérieure qui fonde l’exhortation, tout en maintenant le lien sémantique avec « pardonnez-vous ».
- source_word: οὕτως καὶ ὑμεῖς
  choice: vous aussi, faites de même
  rationale: Le grec laisse le verbe sous-entendu. Cette formulation française explicite seulement l’action requise de manière idiomatique, sans ajouter un verbe modal absent du texte.
theological_decisions:
- issue: Référent de ὁ κύριος
  choice: Conserver le titre « le Seigneur » sans identifier explicitement le référent dans le texte
  alternative: Traduire ou expliciter « le Christ » ou « Dieu »
  rationale: Dans le contexte paulinien, le titre renvoie très probablement au Christ, mais la traduction maintient la formulation du grec et évite de résoudre dans le texte une identification qui reste implicite.
- issue: Ellipse de la proposition finale
  choice: Rendre l’ellipse par « faites de même »
  alternative: 'Écrire « vous aussi, pardonnez » ou conserver une ellipse stricte : « vous aussi »'
  rationale: Une ellipse stricte serait peu naturelle et potentiellement obscure en français. « Faites de même » restitue l’exhortation implicite sans introduire l’idée plus forte d’une obligation modale.
translation_notes:
  register: Français international moderne, clair et digne. L’impératif restitue la valeur exhortative des participes dans leur contexte. La répétition entre « pardonnez-vous » et « a pardonné » conserve le lien lexical du grec, tandis que « faites de même » rend naturellement l’ellipse finale.
