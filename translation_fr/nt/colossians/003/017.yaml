id: COL.3.17
reference: Colossians 3:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ πᾶν ⸂ὅ τι⸃ ⸀ἐὰν ποιῆτε ἐν λόγῳ ἢ ἐν ἔργῳ, πάντα ἐν ὀνόματι κυρίου Ἰησοῦ, εὐχαριστοῦντες τῷ ⸀θεῷ πατρὶ δι’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/017.yaml
  text: And whatever you do[a], in word or in deed, do everything in the name of the Lord Jesus[b], giving thanks to God the Father through him.
translation:
  language: fr
  text: Et quoi que vous fassiez, en parole ou en acte[a], faites tout au nom du Seigneur Jésus[b], en rendant grâce à Dieu le Père par lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans vos paroles ou vos actes ».
    reason: lexical_alternative
  - marker: b
    text: « Au nom du Seigneur Jésus » peut aussi signifier « sous son autorité » ou « en le représentant ».
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶν ὅ τι ἐὰν ποιῆτε
  choice: quoi que vous fassiez
  rationale: 'Cette tournure française naturelle rend l’indéfini à portée globale de l’expression grecque : aucune parole ni aucune action n’est exclue.'
- source_word: ἐν λόγῳ ἢ ἐν ἔργῳ
  choice: en parole ou en acte
  rationale: Ce binôme compact conserve le parallélisme grec et couvre respectivement ce qui est dit et ce qui est accompli.
- source_word: πάντα
  choice: faites tout
  rationale: Le grec reprend et totalise la proposition précédente sans répéter le verbe. La répétition de « faites » est nécessaire en français pour former une exhortation claire et naturelle.
- source_word: ἐν ὀνόματι κυρίου Ἰησοῦ
  choice: au nom du Seigneur Jésus
  rationale: La formulation conserve l’image biblique et son ampleur sémantique, qui peut évoquer l’autorité, la représentation et l’appartenance, sans la réduire à une seule explication.
- source_word: κυρίου
  choice: Seigneur
  rationale: Dans ce contexte christologique, κύριος est un titre et « Seigneur » en préserve la portée néotestamentaire.
- source_word: εὐχαριστοῦντες
  choice: en rendant grâce
  rationale: Le gérondif exprime une action simultanée à l’exhortation et rend la valeur continue du participe présent.
- source_word: τῷ θεῷ πατρὶ
  choice: à Dieu le Père
  rationale: Cette formulation française claire et consacrée rend naturellement l’apposition de πατρί à θεῷ.
- source_word: δι’ αὐτοῦ
  choice: par lui
  rationale: Le pronom renvoie naturellement au Seigneur Jésus, antécédent le plus proche, tout en préservant la concision et le langage de médiation du grec.
theological_decisions:
- issue: Portée de « au nom du Seigneur Jésus »
  choice: Conserver l’expression « au nom du Seigneur Jésus » dans le texte principal.
  alternative: « sous l’autorité du Seigneur Jésus » ou « comme ses représentants »
  rationale: L’expression grecque peut réunir les notions d’autorité, de représentation et d’identification. Maintenir l’expression biblique évite de trancher en faveur d’une seule nuance.
- issue: Référent de « par lui »
  choice: Le pronom renvoie au Seigneur Jésus, par l’intermédiaire de qui l’action de grâce est adressée à Dieu le Père.
  alternative: Comprendre le pronom comme une reprise moins précisément christologique de la proposition.
  rationale: « Le Seigneur Jésus » est l’antécédent immédiat, et cette lecture découle directement de la syntaxe sans développer une formulation doctrinale étrangère au verset.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme « en parole ou en acte » garde la concision rhétorique du grec; « en rendant grâce » relie naturellement l’action de grâce à l’ensemble de l’exhortation.
