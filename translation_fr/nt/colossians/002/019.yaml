id: COL.2.19
reference: Colossians 2:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ οὐ κρατῶν τὴν κεφαλήν, ἐξ οὗ πᾶν τὸ σῶμα διὰ τῶν ἁφῶν καὶ συνδέσμων ἐπιχορηγούμενον καὶ συμβιβαζόμενον αὔξει τὴν αὔξησιν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/019.yaml
  text: and not holding fast to the Head[a], from whom the whole body, being supplied and held together through the joints and ligaments[c][b], grows with the growth of God.
translation:
  language: fr
  text: sans rester attaché à la Tête[a]. C’est d’elle que le corps tout entier, alimenté et maintenu dans l’unité par les articulations et les ligaments[b], s’accroît de la croissance qui vient de Dieu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « sans s’agripper à la Tête »; littéralement : « ne tenant pas fermement la Tête ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « nourri et maintenu dans l’unité au moyen des articulations et des ligaments ».'
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « croît de la croissance de Dieu ». L’expression désigne probablement une croissance qui vient de Dieu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κρατῶν
  choice: rester attaché
  rationale: Exprime l’idée d’une adhésion ferme et durable à la Tête; le contexte exige davantage que le simple fait de toucher ou tenir.
- source_word: κεφαλήν
  choice: la Tête
  rationale: Conserve la métaphore anatomique et la majuscule indique naturellement en français que la Tête désigne ici le Christ.
- source_word: ἐξ οὗ
  choice: C’est d’elle que
  rationale: Le relatif masculin grec renvoie à κεφαλή; en français, le pronom s’accorde grammaticalement avec « Tête », tout en désignant le Christ.
- source_word: πᾶν τὸ σῶμα
  choice: le corps tout entier
  rationale: Formulation française naturelle qui souligne l’intégralité du corps collectif.
- source_word: ἁφῶν
  choice: articulations
  rationale: Dans la métaphore corporelle, le terme désigne vraisemblablement les points de jonction; « articulations » est précis et courant.
- source_word: συνδέσμων
  choice: ligaments
  rationale: Rend concrètement ce qui relie et maintient ensemble les parties du corps.
- source_word: ἐπιχορηγούμενον
  choice: soutenu
  rationale: Le participe exprime l’apport de ce qui est nécessaire au corps. « Soutenu » garde une portée assez large sans limiter le sens à la seule nourriture.
- source_word: συμβιβαζόμενον
  choice: uni
  rationale: Exprime la cohésion du corps produite au moyen de ses articulations et ligaments.
- source_word: αὔξει τὴν αὔξησιν
  choice: reçoit une croissance
  rationale: Évite en français la lourdeur de la répétition littérale « croît d’une croissance », tout en conservant l’idée que cette croissance est reçue de sa source.
- source_word: τοῦ θεοῦ
  choice: qui vient de Dieu
  rationale: Interprète naturellement le génitif comme indiquant la source, sans suggérer que Dieu lui-même grandit; une note conserve la forme plus littérale et son ambiguïté.
theological_decisions:
- issue: Référent de « la Tête »
  choice: Le Christ, signalé par la majuscule
  alternative: « la tête » sans majuscule
  rationale: Le contexte de l’épître identifie la Tête au Christ, mais la traduction maintient pleinement la métaphore corporelle.
- issue: Valeur du génitif dans τὴν αὔξησιν τοῦ θεοῦ
  choice: Une croissance qui vient de Dieu
  alternative: « la croissance de Dieu »
  rationale: Le génitif désigne probablement Dieu comme source de la croissance. La note donne néanmoins la formulation littérale afin de ne pas dissimuler la concision ni l’ambiguïté possibles du grec.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase est légèrement restructurée pour éviter une accumulation pesante de participes passifs, tout en conservant l’image du Christ comme Tête, celle du corps uni, et l’origine divine de sa croissance.
