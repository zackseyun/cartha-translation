  text: ἅ ἐστιν σκιὰ τῶν μελλόντων, τὸ δὲ σῶμα ⸀τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/017.yaml
  text: These are a shadow of the things to come[b][a], but the body is Messiah's.
translation:
  language: fr
  text: Tout cela est une ombre des choses à venir, mais le corps est celui du Messie.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, selon le sens métaphorique : « mais la réalité appartient au Messie ». Litt. : « mais le corps [est] du Messie ».'
    reason: La formulation principale conserve σῶμα (« corps »), tandis que le contraste avec « ombre » permet aussi de comprendre « réalité ».
lexical_decisions:
- source_word: ἅ
  choice: Tout cela
  rationale: Le pronom relatif neutre pluriel reprend les prescriptions mentionnées au verset précédent. « Tout cela » rend cette reprise de façon naturelle en français.
- source_word: σκιὰ
  choice: l’ombre
  rationale: Le nom singulier conserve l’image d’une ombre qui annonce ou dessine une réalité plus pleine.
- source_word: τῶν μελλόντων
  choice: des choses à venir
  rationale: Le participe substantivé garde une orientation future sans préciser s’il s’agit exclusivement de l’accomplissement messianique, des réalités eschatologiques ou des deux.
- source_word: δὲ
  choice: mais
  rationale: La conjonction marque ici le contraste entre l’ombre et le corps.
- source_word: σῶμα
  choice: le corps
  rationale: « Corps » traduit directement σῶμα et préserve la métaphore ainsi que son ouverture interprétative, même si, par contraste avec « ombre », le mot peut désigner la réalité substantielle.
- source_word: τοῦ Χριστοῦ
  choice: celui du Messie
  rationale: Le génitif exprime le rapport du corps au Messie. La tournure « est celui du Messie » conserve la copule sous-entendue et rend Χριστός comme un titre.
theological_decisions:
- issue: Sens de σῶμα par contraste avec σκιά
  choice: Traduction formelle par « corps », laissée ouverte à l’interprétation.
  alternative: « réalité » ou « réalité substantielle »
  rationale: Le contraste ombre-corps peut évoquer la réalité qui correspond à l’ombre, mais traduire directement « corps » évite de décider silencieusement entre cette valeur métaphorique et d’autres résonances possibles dans l’épître.
- issue: Valeur de Χριστοῦ
  choice: « du Messie »
  alternative: « du Christ »
  rationale: Χριστός fonctionne ici comme un titre; « Messie » en explicite le sens sans ajouter de précision doctrinale.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation conserve le parallélisme de la phrase grecque et l’ambiguïté de l’image « ombre-corps ».
