  text: ἐν ᾧ καὶ περιετμήθητε περιτομῇ ἀχειροποιήτῳ ἐν τῇ ἀπεκδύσει τοῦ ⸀σώματος τῆς σαρκός, ἐν τῇ περιτομῇ τοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/011.yaml
  text: In him you also were circumcised with a circumcision not made by hands[a], in the removal of the body of flesh, in the circumcision of Messiah[e][d][c][b],
translation:
  language: fr
  text: En lui, vous avez aussi été circoncis d’une circoncision non faite de main humaine[a], dans le dépouillement du corps de chair[b], dans la circoncision du Messie[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « faite sans intervention humaine ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « dans le fait de se dépouiller du corps de chair ». « Chair » peut recevoir ici un sens moral, mais le terme grec est conservé sans être explicité par « nature pécheresse ».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « par la circoncision du Messie ». Le grec peut désigner une circoncision accomplie par le Messie, lui appartenant ou associée à lui ; il peut aussi être compris comme évoquant la circoncision subie par le Messie.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν ᾧ
  choice: En lui
  rationale: Le pronom relatif renvoie au Messie dans le contexte précédent. « En lui » est naturel en français et conserve l’idée d’union avec lui.
- source_word: περιετμήθητε
  choice: vous avez été circoncis
  rationale: L’aoriste passif indique une action accomplie subie par les destinataires. Le vocabulaire de la circoncision est maintenu plutôt que paraphrasé.
- source_word: περιτομῇ ἀχειροποιήτῳ
  choice: d’une circoncision qui n’est pas faite par des mains humaines
  rationale: Cette formulation exprime clairement que la circoncision n’est pas l’œuvre d’êtres humains, tout en conservant l’image grecque des mains.
- source_word: ἐν τῇ ἀπεκδύσει
  choice: dans le dépouillement
  rationale: Le nom grec évoque l’action de dépouiller ou d’enlever. « Dépouillement » préserve cette métaphore et le parallélisme des deux groupes introduits par ἐν.
- source_word: τοῦ σώματος τῆς σαρκός
  choice: du corps de chair
  rationale: Cette expression volontairement proche du grec conserve la difficulté du groupe génitival sans l’interpréter comme « nature pécheresse » ni l’assimiler simplement au corps physique.
- source_word: ἐν τῇ περιτομῇ τοῦ Χριστοῦ
  choice: dans la circoncision du Messie
  rationale: « Dans » maintient la répétition de ἐν, tandis que « du Messie » laisse ouverte la fonction du génitif et rend Χριστός comme titre messianique.
theological_decisions:
- issue: Sens de « la circoncision du Messie »
  choice: 'Maintien du génitif ouvert : « la circoncision du Messie »'
  alternative: « la circoncision accomplie par le Messie », « la circoncision propre au Messie » ou « la circoncision subie par le Messie »
  rationale: Le génitif τοῦ Χριστοῦ peut désigner l’auteur, l’appartenance ou l’association, voire être compris comme renvoyant à ce que le Messie a lui-même subi. Le texte principal ne tranche pas cette tension.
- issue: Sens de « corps de chair »
  choice: Conservation de l’expression « corps de chair »
  alternative: « corps charnel », « corps dominé par la chair » ou, de façon plus interprétative, « nature pécheresse »
  rationale: Le grec est dense et susceptible de plusieurs analyses. Une traduction plus explicite imposerait une anthropologie particulière que le verset ne formule pas sans ambiguïté.
translation_notes:
  register: Français international moderne, digne et lisible. La formulation garde les images répétées de la circoncision et du dépouillement ainsi que les expressions théologiquement denses « corps de chair » et « circoncision du Messie », avec des notes pour les principales ambiguïtés.
