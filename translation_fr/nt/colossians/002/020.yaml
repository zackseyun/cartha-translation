  source_fidelity: Le texte rend fidèlement la condition εἰ, l’aoriste ἀπεθάνετε par un passé composé français naturel, l’union « avec le Messie », et la séparation d’avec les στοιχεῖα par l’idiome établi « mourir à ». « Principes élémentaires du monde » maintient de façon appropriée l’indétermination du terme grec. La question rhétorique, la valeur hypothétique de ὡς ζῶντες ἐν κόσμῳ et la nuance moyenne/passive possible de δογματίζεσθε sont toutes préservées.
  naturalness: Le français est moderne, clair et d’un registre convenant à une lettre apostolique. « Si vous êtes morts …, pourquoi … vous soumettez-vous … ? » est fluide, et les deux-points reflètent correctement l’enchaînement avec les interdictions du verset suivant.
