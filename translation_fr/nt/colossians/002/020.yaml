id: COL.2.20
reference: Colossians 2:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Εἰ ἀπεθάνετε σὺν Χριστῷ ἀπὸ τῶν στοιχείων τοῦ κόσμου, τί ὡς ζῶντες ἐν κόσμῳ δογματίζεσθε·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/020.yaml
  text: 'If you died with the Messiah from the elemental principles of the world[a], why, as if living in the world[b], are you submitting yourselves to decrees:'
translation:
  language: fr
  text: 'Si vous êtes morts avec le Messie aux principes élémentaires du monde[a], pourquoi, comme si vous viviez dans le monde, vous soumettez-vous à des prescriptions[b] :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « aux esprits élémentaires du monde » ; autre traduction possible : « aux éléments fondamentaux du monde ».'
    reason: alternative_reading
  - marker: b
    text: Ou « pourquoi vous impose-t-on des règles ? »
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰ
  choice: Si
  rationale: Conserve la forme conditionnelle grecque, même si, dans le contexte, Paul semble tenir la condition pour acquise chez ses lecteurs.
- source_word: ἀπεθάνετε σὺν Χριστῷ ἀπὸ
  choice: vous êtes morts avec le Messie à
  rationale: Le passé composé exprime naturellement en français l’événement passé dont les effets demeurent. La tournure « mourir à » rend idiomatiquement l’idée de séparation portée par ἀπό sans ajouter explicitement celle de libération. « Messie » conserve la valeur de titre de Χριστός.
- source_word: τῶν στοιχείων τοῦ κόσμου
  choice: aux principes élémentaires du monde
  rationale: στοιχεῖα peut désigner des éléments fondamentaux, des principes rudimentaires ou des puissances spirituelles. « principes élémentaires » maintient une part de cette ambiguïté, tandis que les autres possibilités figurent en note.
- source_word: τί
  choice: pourquoi
  rationale: Rend naturellement la question rhétorique introduite ici par τί.
- source_word: ὡς ζῶντες ἐν κόσμῳ
  choice: comme si vous viviez dans le monde
  rationale: Préserve la comparaison ou supposition exprimée par ὡς avec le participe, sans ajouter « encore », absent du grec.
- source_word: δογματίζεσθε
  choice: vous soumettez-vous à des prescriptions
  rationale: Cette formulation rend la nuance moyenne ou réflexive possible et le sens d’une conduite régie par des règles, tout en laissant en note la lecture passive.
theological_decisions:
- issue: Sens de στοιχεῖα dans l’usage paulinien
  choice: principes élémentaires du monde
  alternative: esprits élémentaires du monde ; éléments fondamentaux du monde
  rationale: Le terme peut évoquer à la fois les structures rudimentaires du monde et des puissances cosmiques. Le texte principal ne tranche pas en faveur d’une cosmologie précise, et la note conserve les principales lectures.
- issue: Voix et nuance de δογματίζεσθε
  choice: vous soumettez-vous à des prescriptions
  alternative: pourquoi vous impose-t-on des règles ?
  rationale: La forme peut être comprise avec une nuance moyenne/réflexive ou passive. Le choix principal souligne la participation des destinataires sans exclure la possibilité qu’ils subissent ces prescriptions.
translation_notes:
  register: Français international moderne, naturel et digne. La tournure idiomatique « mourir à » conserve l’idée de séparation. Les ambiguïtés de στοιχεῖα et de la voix de δογματίζεσθε sont maintenues dans les notes. Le deux-points préserve l’enchaînement syntaxique avec les prescriptions citées au verset suivant.
