id: COL.2.12
reference: Colossians 2:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: συνταφέντες αὐτῷ ἐν τῷ ⸀βαπτισμῷ, ἐν ᾧ καὶ συνηγέρθητε διὰ τῆς πίστεως τῆς ἐνεργείας τοῦ θεοῦ τοῦ ἐγείραντος αὐτὸν ⸀ἐκ νεκρῶν·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/012.yaml
  text: having been buried with him in baptism[a], in which you also were raised with him through faith in the working of God[b], who raised him from the dead.
translation:
  language: fr
  text: ensevelis avec lui dans le baptême[a], dans lequel vous avez aussi été ressuscités avec lui par la foi en l’action de Dieu[b], qui l’a ressuscité d’entre les morts.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou peut-être: «en qui», si le relatif est compris comme renvoyant au Christ plutôt qu’au baptême.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: «par la confiance en l’action de Dieu». Le mot grec peut aussi signifier «fidélité» dans certains contextes, mais «foi» est ici le sens le plus probable.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συνταφέντες αὐτῷ
  choice: ensevelis avec lui
  rationale: Le participe aoriste passif exprime une action accomplie liée au contexte précédent; «avec lui» rend le préfixe συν- et l’union avec le Christ.
- source_word: ἐν τῷ βαπτισμῷ
  choice: dans le baptême
  rationale: «Dans» conserve le recoupement locatif et instrumental de ἐν sans préciser indûment le mode d’efficacité du baptême.
- source_word: ἐν ᾧ
  choice: dans lequel
  rationale: Le relatif reprend le plus naturellement βαπτισμῷ, son antécédent immédiat, tout en laissant en note l’autre analyse grammaticale possible.
- source_word: συνηγέρθητε
  choice: vous avez aussi été ressuscités avec lui
  rationale: Le passif rend l’action divine subie, et «avec lui» explicite la valeur du préfixe συν- dans ce contexte.
- source_word: διὰ τῆς πίστεως
  choice: par la foi
  rationale: La foi est ici présentée comme le moyen; «foi» est le sens contextuel principal de πίστις, bien que «confiance» demeure possible.
- source_word: τῆς ἐνεργείας τοῦ θεοῦ
  choice: l’action de Dieu
  rationale: ἐνέργεια désigne l’activité efficace et opérante de Dieu; «action» est naturel en français et évite de réduire le terme à une puissance abstraite.
- source_word: τοῦ ἐγείραντος αὐτὸν ἐκ νεκρῶν
  choice: qui l’a ressuscité d’entre les morts
  rationale: La proposition relative rend naturellement le participe grec; «d’entre les morts» est une formulation française établie qui conserve la portée de ἐκ νεκρῶν.
theological_decisions:
- issue: Référent de ἐν ᾧ
  choice: 'Le texte principal rattache le relatif au baptême: «dans lequel».'
  alternative: 'Le relatif peut être compris comme renvoyant au Christ: «en qui».'
  rationale: βαπτισμῷ est l’antécédent grammatical immédiat et favorise la lecture principale; une note préserve toutefois l’ambiguïté possible.
- issue: Portée du langage baptismal
  choice: Conserver le lien étroit entre baptême, ensevelissement avec le Christ, résurrection avec lui et foi.
  alternative: Préciser soit une efficacité sacramentelle particulière, soit une fonction purement symbolique.
  rationale: Le grec affirme fortement ce lien, mais ne tranche pas à lui seul les formulations doctrinales postérieures; la traduction n’en impose donc aucune.
- issue: Valeur de πίστις
  choice: «foi» dans le texte principal.
  alternative: «confiance»; plus rarement ici, «fidélité».
  rationale: Dans cette construction, la foi ou confiance en l’action de Dieu est le sens le plus probable; la note signale l’alternative lexicale pertinente sans privilégier «fidélité», moins vraisemblable ici.
translation_notes:
  register: Français international moderne, digne et accessible. «Ensevelis» maintient le registre biblique sans être archaïque; «l’action de Dieu» exprime son activité opérante dans une tournure naturelle. La structure participiale initiale est conservée, puisque le verset dépend syntaxiquement du contexte précédent.
