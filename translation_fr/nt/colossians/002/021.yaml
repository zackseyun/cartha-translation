  text: « Ne manipule pas[a], ne goûte pas, ne touche pas ! »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le premier verbe (ἅψῃ) peut aussi se traduire par « ne touche pas » ou « ne saisis pas ». Il est rendu ici par « ne manipule pas » afin de le distinguer du dernier verbe, θίγῃς, traduit par « ne touche pas ».
