lexical_decisions:
- source_word: Μὴ
  choice: ne… pas
  rationale: μή avec les subjonctifs aoristes exprime ici l’interdiction; la négation française encadre naturellement chacun des trois verbes.
- source_word: ἅψῃ
  choice: prends
  rationale: Le moyen de ἅπτω peut signifier « toucher » ou « saisir/prendre ». « Prends » distingue ce premier verbe de θίγῃς tout en conservant une formulation brève et concrète.
- source_word: μηδὲ
  choice: ne… pas
  rationale: La coordination négative répétée est rendue idiomatiquement en français par la reprise de « ne… pas », qui conserve l’effet cumulatif de la série.
- source_word: γεύσῃ
  choice: goûte
  rationale: γεύομαι signifie directement « goûter »; ce choix préserve le sens lexical sans élargir en « manger » ou « consommer ».
- source_word: θίγῃς
  choice: touche
  rationale: θιγγάνω signifie couramment « toucher ». Ce rendu reste direct et le distingue de ἅψῃ traduit par « prends ».
theological_decisions:
- issue: Nature des interdictions dans le contexte
  choice: Conserver la série abrupte d’interdictions, sous forme de citation, sans complément explicatif.
  alternative: Ajouter des objets tels que « ceci » ou « cela », ou rattacher explicitement les interdictions aux prescriptions humaines.
  rationale: Le grec de ce verset ne contient que trois interdictions très brèves. Ajouter leurs objets ou leur provenance résoudrait une concision que le texte source laisse intacte.
translation_notes:
  register: Français international moderne, bref et digne. L’impératif présent français rend naturellement les prohibitions grecques. Les guillemets signalent leur caractère citationnel suggéré par le contexte, sans ajouter d’explication au contenu du verset.
