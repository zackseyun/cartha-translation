id: COL.2.10
reference: Colossians 2:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἐστὲ ἐν αὐτῷ πεπληρωμένοι, ὅς ἐστιν ἡ κεφαλὴ πάσης ἀρχῆς καὶ ἐξουσίας,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/010.yaml
  text: and in him you have been made full, who is the head of every ruler and authority.
translation:
  language: fr
  text: Et en lui, vous avez été remplis[a]. Il est la tête de toute domination et de toute autorité[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « comblés » ou « amenés à la plénitude ».
    reason: lexical_alternative
  - marker: b
    text: « Tête » conserve la métaphore grecque; ici, elle indique que le Christ est au-dessus de toute domination et de toute autorité.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Et
  rationale: Conserve le lien explicite avec l’argument du verset précédent.
- source_word: ἐστὲ … πεπληρωμένοι
  choice: vous avez été comblés
  rationale: Le parfait passif exprime un état présent résultant d’une action accomplie. « Comblés » est naturel en français et maintient le motif de la plénitude sans le réduire à l’idée de satisfaction subjective.
- source_word: ἐν αὐτῷ
  choice: en lui
  rationale: Préserve la formulation paulinienne concise qui exprime l’union ou l’incorporation au Christ.
- source_word: ὅς ἐστιν
  choice: Il est
  rationale: La proposition relative grecque est rendue par une nouvelle phrase, plus naturelle en français, sans modifier son référent, le Christ.
- source_word: ἡ κεφαλή
  choice: la tête
  rationale: Conserve la métaphore grecque au lieu de l’interpréter directement par « chef » ou « souverain ».
- source_word: πάσης ἀρχῆς καὶ ἐξουσίας
  choice: de toute domination et de toute autorité
  rationale: « Domination » et « autorité » rendent deux catégories de puissances gouvernantes tout en évitant le terme vieilli « principauté ». La répétition de « toute » explicite naturellement en français la portée distributive de πάσης sur les deux noms coordonnés.
theological_decisions:
- issue: La plénitude des croyants en Christ
  choice: Le texte affirme qu’ils ont été comblés en Christ, sans préciser davantage la nature de cette plénitude.
  alternative: « Vous avez été amenés à la plénitude en lui » ou « en lui, vous êtes pleinement accomplis »
  rationale: « Vous avez été comblés » maintient la voix passive, le lien avec la plénitude du verset précédent et l’ampleur théologique de l’expression, sans introduire une doctrine technique de perfection sans péché.
- issue: Le sens de κεφαλή par rapport aux puissances
  choice: La métaphore « tête » est conservée; dans ce contexte, elle présente le Christ comme suprême sur toutes les dominations et autorités.
  alternative: Traduire directement par « chef », « souverain » ou comprendre « source »
  rationale: Le contexte des puissances cosmiques favorise la suprématie, mais conserver la métaphore dans le texte évite de résoudre par la traduction toute la portée possible de κεφαλή.
translation_notes:
  register: Français international moderne, digne et accessible. La division en deux phrases évite une relative lourde ou ambiguë après « en lui ». « Domination » convient au contexte des puissances sans recourir au terme archaïsant « principauté ».
