    issue: « avec ses prescriptions » ajoute un possessif
    rationale: Le grec porte simplement τοῖς δόγμασιν, dont le rapport à χειρόγραφον est syntaxiquement débattu. Le possessif « ses » favorise l’analyse selon laquelle les prescriptions appartiennent au document, au lieu de préserver l’ambiguïté.
  - severity: low
    issue: « il l’a ôté du milieu » est un calque idiomatiquement lourd
    rationale: ἐκ τοῦ μέσου est une expression de retrait ou d’élimination. « Il l’a écarté » est plus naturel et garde l’idée de faire disparaître un obstacle.
