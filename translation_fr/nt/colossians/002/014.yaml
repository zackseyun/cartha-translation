source:
  edition: SBLGNT
  text: ἐξαλείψας τὸ καθ’ ἡμῶν χειρόγραφον τοῖς δόγμασιν ὃ ἦν ὑπεναντίον ἡμῖν, καὶ αὐτὸ ἦρκεν ἐκ τοῦ μέσου προσηλώσας αὐτὸ τῷ σταυρῷ·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/014.yaml
  text: having wiped out the record of debt against us in decrees[a], which was opposed to us, and he has taken it out of the way[b], having nailed it to the cross.
translation:
  language: fr
  text: Il a effacé l’acte de dette[a] qui, avec les prescriptions[b], était contre nous ; il l’a écarté en le clouant à la croix.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la reconnaissance de dette » ou « le document manuscrit ». Le mot grec peut désigner un écrit reconnaissant une dette ou une obligation juridique.
    reason: lexical_alternative
  - marker: b
    text: Ou « dans les prescriptions » ou « consistant en prescriptions ». Le rapport exact entre l’acte de dette et les prescriptions est incertain.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐξαλείψας
  choice: il a effacé
  rationale: Le verbe évoque l’effacement d’un écrit. Le participe aoriste est rendu par un verbe coordonné, plus naturel en français dans la continuité de la phrase, sans perdre le lien étroit avec l’action principale.
- source_word: χειρόγραφον
  choice: l’acte de dette
  rationale: Le terme désigne un document manuscrit reconnaissant une obligation, notamment une dette. « Acte de dette » conserve à la fois l’image documentaire et la notion d’obligation sans imposer une identification théologique précise.
- source_word: καθ’ ἡμῶν
  choice: contre nous
  rationale: Cette formulation directe conserve la portée défavorable ou accusatrice de la locution grecque.
- source_word: τοῖς δόγμασιν
  choice: avec ses prescriptions
  rationale: Le datif est syntaxiquement difficile. Cette formulation relie les prescriptions à l’acte de dette tout en évitant de les identifier explicitement à la seule loi mosaïque.
- source_word: ὑπεναντίον ἡμῖν
  choice: qui était contre nous
  rationale: « Contre nous » exprime clairement l’opposition du document, sans renforcer le texte par un terme plus affectif comme « hostile ».
- source_word: ἦρκεν ἐκ τοῦ μέσου
  choice: il l’a ôté du milieu
  rationale: Le parfait indique une action accomplie dont le résultat demeure. « Ôter du milieu » garde l’image grecque d’un obstacle retiré, tout en restant intelligible.
- source_word: προσηλώσας αὐτὸ τῷ σταυρῷ
  choice: en le clouant à la croix
  rationale: La tournure exprime naturellement en français le moyen ou la circonstance associés au participe aoriste, tout en conservant l’image concrète du texte.
theological_decisions:
- issue: Sens de χειρόγραφον τοῖς δόγμασιν
  choice: un acte de dette lié à des prescriptions et dressé contre nous
  alternative: la loi mosaïque elle-même ; une liste de péchés ; un acte d’accusation juridique
  rationale: La traduction maintient l’image d’un document d’obligation sans l’assimiler à une construction doctrinale particulière. La note signale l’incertitude du rapport syntaxique entre l’acte et les prescriptions.
- issue: Sujet de ἦρκεν
  choice: « il », renvoyant à Dieu dans le contexte
  alternative: laisser l’agent sous-entendu
  rationale: Le français exige ici un sujet explicite, et le contexte précédent désigne Dieu comme l’auteur de l’action.
translation_notes:
  register: Français international moderne, sobre et digne. La coordination verbale rend la phrase fluide, tandis que « ôté du milieu » conserve volontairement l’image du grec. Les notes maintiennent les ambiguïtés lexicale et syntaxique sans identifier les prescriptions à un système théologique particulier.
