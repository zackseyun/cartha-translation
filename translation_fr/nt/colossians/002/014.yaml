  source_fidelity: 'La traduction rend bien les actions principales : effacer un document d’obligation, le retirer et le clouer à la croix. Toutefois, « ses prescriptions » introduit un rapport de possession qui n’est pas exprimé par le datif τοῖς δόγμασιν. Le lien syntaxique demeure discuté et doit rester ouvert.'
  naturalness: « Ôter du milieu » est un calque peu naturel en français moderne dans ce contexte. « L’écarter » rend clairement l’idiome ἐκ τοῦ μέσου (« retirer de la voie / faire disparaître comme obstacle ») sans perdre le sens.
  terminology: « Acte de dette » conserve de manière recevable l’image d’un document constatant une obligation. « Prescriptions » convient pour δόγματα sans les réduire à la loi mosaïque. « Croix » est approprié pour σταυρός.
  issues:
