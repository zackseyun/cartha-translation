  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἵνα παρακληθῶσιν αἱ καρδίαι αὐτῶν, ⸀συμβιβασθέντες ἐν ἀγάπῃ καὶ εἰς ⸂πᾶν πλοῦτος⸃ τῆς πληροφορίας τῆς συνέσεως, εἰς ἐπίγνωσιν τοῦ μυστηρίου τοῦ ⸀θεοῦ, Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/002.yaml
  text: so that their hearts may be encouraged[a], having been knit together in love and unto all the riches of the full assurance of understanding, unto the knowledge of the mystery of God, Messiah[d][c][b],
translation:
  language: fr
  text: 'afin que leurs cœurs soient encouragés et qu’ils soient étroitement unis dans l’amour[a], afin d’accéder à toute la richesse d’une pleine certitude fondée sur la compréhension, à la connaissance[b] du mystère de Dieu : le Messie[c][d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « rassemblés dans l’amour ». Le verbe grec peut évoquer le fait d’être rapprochés ou étroitement liés.
    reason: lexical_alternative
  - marker: b
    text: Ou « pleine connaissance » ; le mot grec peut avoir un sens intensif.
    reason: lexical_alternative
  - marker: c
    text: 'Le grec est très concis : « le mystère de Dieu, Messie ». La traduction comprend « le Messie » comme une apposition : le mystère de Dieu est le Messie.'
    reason: alternative_reading
  - marker: d
    text: Certains manuscrits présentent une formulation plus longue, par exemple « le mystère de Dieu, le Père, et du Messie ». La traduction suit la leçon courte du texte grec fourni.
    reason: textual_variant
lexical_decisions:
- source_word: παρακληθῶσιν αἱ καρδίαι αὐτῶν
  choice: qu’ils soient encouragés dans leur cœur
  rationale: Cette formulation française naturelle conserve l’image biblique du cœur tout en exprimant l’encouragement intérieur visé par le passif grec. « Encouragés » garde une portée plus large que la seule consolation.
- source_word: συμβιβασθέντες ἐν ἀγάπῃ
  choice: étroitement unis dans l’amour
  rationale: Dans ce contexte, le participe décrit principalement des personnes rapprochées et liées les unes aux autres. « Étroitement unis » restitue cette force relationnelle sans employer une métaphore textile peu naturelle ici en français.
- source_word: εἰς πᾶν πλοῦτος
  choice: qu’ils accèdent à toute la richesse
  rationale: « Accéder à » rend le mouvement vers un but exprimé par εἰς, tandis que « toute la richesse » reproduit le sens de la formule grecque.
- source_word: τῆς πληροφορίας τῆς συνέσεως
  choice: d’une pleine certitude fondée sur la compréhension
  rationale: πληροφορία désigne ici une assurance entière ou une conviction ferme. La formulation indique le lien génitif avec σύνεσις sans réduire ce dernier à une simple accumulation d’informations.
- source_word: ἐπίγνωσιν
  choice: connaissance
  rationale: « Connaissance » est clair et naturel; la possibilité d’un sens intensif, « pleine connaissance », est signalée en note.
- source_word: μυστηρίου
  choice: mystère
  rationale: Terme paulinien consacré pour le dessein divin autrefois caché et désormais révélé; « secret » serait trop plat dans ce contexte.
- source_word: θεοῦ, Χριστοῦ
  choice: de Dieu, le Messie
  rationale: La formulation concise conserve l’apposition du texte grec sans ajouter dans le corps du verset un explicatif tel que « c’est-à-dire ». Χριστός est rendu comme le titre « le Messie ».
theological_decisions:
- issue: Rapport appositionnel dans τοῦ μυστηρίου τοῦ θεοῦ, Χριστοῦ
  choice: « du mystère de Dieu, le Messie »
  alternative: '« du mystère de Dieu, c’est-à-dire le Messie »; ou maintien encore plus abrupt: « du mystère de Dieu, Messie »'
  rationale: La virgule préserve la concision et la tension syntaxique du grec. La note expose l’interprétation appositionnelle probable sans rendre explicite dans le texte ce que le grec laisse sous une forme comprimée.
- issue: Variante textuelle après μυστηρίου
  choice: 'Suivre la leçon courte fournie: τοῦ θεοῦ, Χριστοῦ'
  alternative: Des témoins donnent une formulation plus longue, notamment « de Dieu, le Père, et du Christ »
  rationale: Le texte principal traduit exactement l’édition source indiquée; la variante est signalée sans l’introduire dans la traduction.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe grecque a été légèrement restructurée pour éviter en français un participe flottant après « leurs cœurs », tout en conservant les idées d’encouragement intérieur, d’union dans l’amour et de progression vers la certitude et la connaissance. La répétition de εἰς est reflétée par « accèdent à… à… ».
