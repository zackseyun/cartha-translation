    issue: Le sujet de παρακληθῶσιν / καρδίαι n’est pas rendu avec précision.
    rationale: « Qu’ils soient encouragés dans leur cœur » déplace l’encouragement des cœurs vers les personnes et emploie un singulier (« leur cœur ») là où le grec porte « leurs cœurs ». Il convient de conserver les cœurs comme sujet du passif.
  - severity: medium
    issue: L’apposition finale est ambiguë en français.
    rationale: Dans « du mystère de Dieu, le Messie », la virgule peut faire lire « Dieu, le Messie » comme une apposition, ce qui ne reflète pas la relation appositionnelle probable entre « mystère » et « Messie ». Une ponctuation forte clarifie la structure tout en restant concise.
  - severity: low
