source:
  edition: SBLGNT
  text: ἐρριζωμένοι καὶ ἐποικοδομούμενοι ἐν αὐτῷ καὶ ⸀βεβαιούμενοι τῇ πίστει καθὼς ἐδιδάχθητε, ⸀περισσεύοντες ἐν εὐχαριστίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/007.yaml
  text: having been rooted and being built up in him[a], and being established in the faith just as you were taught, overflowing with thanksgiving.
translation:
  language: fr
  text: Enracinés et édifiés en lui, affermis dans la foi[a], comme vous l’avez appris, débordant de reconnaissance.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « dans la confiance » ; autre possibilité : « dans la fidélité ». Le grec pistis peut désigner la foi, la confiance ou la fidélité. Ici, l’article défini et la mention de ce qu’ils ont appris favorisent probablement « la foi », au sens de la foi qui leur a été enseignée.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐρριζωμένοι
  choice: Enracinés
  rationale: Le participe parfait évoque un enracinement accompli dont l’effet demeure. La métaphore végétale est conservée sans alourdir le français par « ayant été enracinés ».
- source_word: ἐποικοδομούμενοι
  choice: édifiés
  rationale: Le terme conserve la métaphore de la construction. Dans cette série de participes, « édifiés » est plus naturel que « étant édifiés », même si le participe présent grec souligne un processus en cours.
- source_word: ἐν αὐτῷ
  choice: en lui
  rationale: Le pronom renvoie au Christ dans le contexte immédiat. La traduction garde le pronom grec plutôt que de le remplacer par son référent.
- source_word: βεβαιούμενοι
  choice: affermis
  rationale: « Affermis » exprime le fait d’être rendu ferme et stable, avec une tournure française naturelle et digne.
- source_word: τῇ πίστει
  choice: dans la foi
  rationale: L’article et la mention de l’enseignement reçu favorisent ici le sens défini de la foi comme contenu ou cadre de la foi chrétienne. Le terme « foi » préserve néanmoins l’éventail sémantique de πίστις, explicité en note.
- source_word: καθὼς ἐδιδάχθητε
  choice: conformément à l’enseignement que vous avez reçu
  rationale: Cette formulation rend la comparaison et le passif de manière idiomatique en français moderne, tout en reliant l’affermissement à l’enseignement antérieurement reçu.
- source_word: περισσεύοντες
  choice: débordant
  rationale: « Débordant » restitue vivement l’idée d’abondance portée par le participe présent.
- source_word: ἐν εὐχαριστίᾳ
  choice: d’actions de grâce
  rationale: « Actions de grâce » rend précisément εὐχαριστία dans son emploi paulinien et s’associe naturellement au verbe « déborder ».
theological_decisions:
- issue: Sens de τῇ πίστει
  choice: la foi, comprise probablement comme la foi ou le message chrétien enseigné aux Colossiens
  alternative: la confiance personnelle, ou la fidélité
  rationale: L’article défini et la proposition relative à l’enseignement reçu orientent vers le contenu de la foi. La traduction ne ferme toutefois pas entièrement la polysémie de πίστις et signale les autres possibilités en note.
translation_notes:
  register: Français international moderne, clair et digne. Les deux métaphores successives, végétale puis architecturale, sont maintenues. La répétition de « en lui » explicite naturellement en français le lien du Christ avec les deux images, sans remplacer le pronom grec.
