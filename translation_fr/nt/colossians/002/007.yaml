- from: Enracinés en lui et édifiés en lui, affermis dans la foi[a], conformément à l’enseignement que vous avez reçu, débordant d’actions de grâce.
  to: Enracinés et édifiés en lui, affermis dans la foi[a], comme vous l’avez appris, débordant de reconnaissance.
