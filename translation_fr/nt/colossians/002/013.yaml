id: COL.2.13
reference: Colossians 2:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ὑμᾶς νεκροὺς ὄντας ⸀ἐν τοῖς παραπτώμασιν καὶ τῇ ἀκροβυστίᾳ τῆς σαρκὸς ὑμῶν, συνεζωοποίησεν ὑμᾶς σὺν αὐτῷ· χαρισάμενος ἡμῖν πάντα τὰ παραπτώματα,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/013.yaml
  text: And you[a], being dead in your trespasses and the uncircumcision of your flesh, he made alive together with him, having forgiven us all our trespasses[c][b],
translation:
  language: fr
  text: Et vous, qui étiez morts dans vos fautes et dans l’incirconcision de votre chair[a], il vous a rendus à la vie avec lui, nous ayant pardonné toutes nos fautes[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « l’incirconcision de votre chair » désigne d’abord leur état corporel d’incirconcis, tout en pouvant revêtir ici une portée spirituelle.
    reason: cultural_note
  - marker: b
    text: 'Le grec passe ici de « vous » à « nous » : « nous ayant pardonné toutes nos fautes ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: νεκροὺς ὄντας
  choice: qui étiez morts
  rationale: La proposition relative est naturelle en français et exprime fidèlement l’état décrit par le participe grec.
- source_word: ἐν τοῖς παραπτώμασιν
  choice: dans vos fautes
  rationale: « Dans » conserve l’image de la condition dans laquelle ils se trouvaient; « fautes » rend παράπτωμα dans un français actuel et digne.
- source_word: ἀκροβυστίᾳ τῆς σαρκὸς ὑμῶν
  choice: dans l’incirconcision de votre chair
  rationale: Le second « dans » clarifie en français la coordination de deux datifs régis par ἐν; « chair » maintient la formulation concrète et sa possible portée spirituelle.
- source_word: συνεζωοποίησεν ὑμᾶς σὺν αὐτῷ
  choice: il vous a rendus à la vie avec lui
  rationale: Cette formulation idiomatique conserve l’action divine de vivifier ainsi que l’association avec le Christ, sans remplacer le pronom grec par son référent interprété.
- source_word: χαρισάμενος
  choice: nous ayant pardonné
  rationale: Le participe composé marque le lien étroit avec le verbe principal et rend ici le sens de pardon gracieux de χαρίζομαι.
- source_word: ἡμῖν
  choice: nous
  rationale: Le passage du « vous » au « nous » présent dans le grec est maintenu et n’est pas harmonisé.
- source_word: πάντα τὰ παραπτώματα
  choice: toutes nos fautes
  rationale: « Toutes » préserve l’insistance sur la totalité du pardon; la répétition de « fautes » maintient la cohérence lexicale.
theological_decisions:
- issue: Sens de σάρξ dans τῆς σαρκὸς ὑμῶν
  choice: « chair », au sens corporel immédiat, avec une possible résonance spirituelle
  alternative: « nature pécheresse »
  rationale: Le contexte de la circoncision en 2.11 favorise le sens corporel. Traduire par « nature pécheresse » résoudrait indûment la tension interprétative.
- issue: Référent de αὐτῷ dans σὺν αὐτῷ
  choice: conserver « lui »
  alternative: expliciter « le Christ »
  rationale: Le contexte désigne très probablement le Christ, mais le maintien du pronom respecte la forme grecque sans sur-explicitation.
- issue: Passage de ὑμᾶς à ἡμῖν
  choice: maintenir « vous » puis « nous »
  alternative: harmoniser tout le verset à « vous »
  rationale: Le changement de personne est textuellement réel et peut refléter un élargissement de la déclaration; il ne doit pas être effacé.
translation_notes:
  register: Français international moderne, clair et soutenu sans archaïsme. La syntaxe garde l’ouverture emphatique « Et vous » et le changement de personne du texte grec. Le redoublement de « dans » est retenu pour la clarté naturelle en français.
