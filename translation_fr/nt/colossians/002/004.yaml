id: COL.2.4
reference: Colossians 2:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸀τοῦτο λέγω ἵνα ⸀μηδεὶς ὑμᾶς παραλογίζηται ἐν πιθανολογίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/004.yaml
  text: I say this so that no one may deceive you with persuasive argument.
translation:
  language: fr
  text: Je dis cela afin que personne ne vous trompe par une argumentation persuasive[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « par une argumentation plausible » ou « par un discours plausible ».
    reason: La πιθανολογία peut désigner un discours ou une argumentation qui paraît convaincante ou vraisemblable, sans être nécessairement vraie.
lexical_decisions:
- source_word: τοῦτο
  choice: cela
  rationale: Le démonstratif neutre singulier renvoie naturellement à ce que Paul vient de dire, sans préciser davantage l’étendue de cette référence.
- source_word: λέγω
  choice: Je dis
  rationale: Le présent de l’indicatif est rendu directement et naturellement, en conservant le caractère personnel du propos.
- source_word: ἵνα
  choice: afin que
  rationale: Cette tournure exprime clairement la visée de l’énoncé grec tout en convenant au registre digne du passage.
- source_word: μηδεὶς
  choice: personne
  rationale: Avec la négation portée par la proposition, « personne » rend naturellement le sujet indéfini négatif.
- source_word: ὑμᾶς
  choice: vous
  rationale: Le pronom conserve l’adresse à l’ensemble des croyants de Colosses; le français « vous » marque naturellement le pluriel dans ce contexte.
- source_word: παραλογίζηται
  choice: vous trompe
  rationale: Le verbe désigne le fait d’induire en erreur au moyen d’un raisonnement fallacieux. « Trompe » est clair, courant et n’ajoute pas de cible doctrinale particulière.
- source_word: ἐν πιθανολογίᾳ
  choice: par des arguments persuasifs
  rationale: La préposition exprime ici le moyen, tandis que πιθανολογία évoque une argumentation persuasive ou plausible. Le pluriel idiomatique français rend naturellement cette idée sans affirmer que les arguments sont fondés.
theological_decisions:
- issue: Nature de l’avertissement exprimé par παραλογίζηται ἐν πιθανολογίᾳ
  choice: Un avertissement général contre la tromperie exercée par une argumentation persuasive.
  alternative: Un avertissement visant spécifiquement une philosophie fausse ou seulement l’éloquence du discours.
  rationale: Le verset ne nomme aucun système doctrinal précis. La traduction conserve donc la portée générale du grec et laisse au contexte le soin de préciser la menace.
translation_notes:
  register: Français international moderne, clair et digne. « Afin que » maintient la relation de visée; « arguments persuasifs » reste accessible tout en préservant l’ambiguïté entre force rhétorique et apparence de vraisemblance.
