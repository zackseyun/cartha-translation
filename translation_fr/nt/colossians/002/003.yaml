id: COL.2.3
reference: Colossians 2:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐν ᾧ εἰσιν πάντες οἱ θησαυροὶ τῆς σοφίας ⸀καὶ γνώσεως ἀπόκρυφοι.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/003.yaml
  text: in whom are hidden all the treasures of wisdom and knowledge[a][b].
translation:
  language: fr
  text: En qui sont cachés tous les trésors de la sagesse et de la connaissance[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans lequel », si l’antécédent désigne plus largement le mystère de Dieu plutôt que le Christ lui-même.
    reason: alternative_reading
  - marker: b
    text: Ou « gardés en réserve » ; l’adjectif grec peut désigner ce qui est caché ou mis en réserve.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ
  choice: en qui
  rationale: Le pronom relatif au datif singulier renvoie le plus naturellement au référent personnel immédiatement précédent, le Christ (2.2). « En qui » conserve aussi la valeur locative de ἐν.
- source_word: πάντες οἱ θησαυροὶ
  choice: tous les trésors
  rationale: L’article avec le nom pluriel exprime ici un ensemble défini et complet ; « tous les trésors » rend directement cette portée collective.
- source_word: τῆς σοφίας καὶ γνώσεως
  choice: de la sagesse et de la connaissance
  rationale: Cette formulation directe maintient la distinction entre σοφία et γνῶσις sans les fondre en une seule notion.
- source_word: ἀπόκρυφοι
  choice: cachés
  rationale: « Cachés » est le terme français le plus transparent et préserve l’ambiguïté entre ce qui est dissimulé et ce qui est gardé en réserve.
- source_word: εἰσιν ... ἀπόκρυφοι
  choice: sont cachés
  rationale: Le verbe copule accompagné de l’adjectif attribut se rend naturellement en français par « sont cachés ».
theological_decisions:
- issue: 'Le sens de ἀπόκρυφοι : secret ésotérique ou trésors gardés en réserve dans le Christ'
  choice: cachés
  alternative: gardés en réserve ; dissimulés
  rationale: 'La traduction reste neutre : elle n’affirme ni que ces trésors sont inaccessibles aux croyants ni qu’ils sont seulement mis en réserve à leur intention. Elle conserve ainsi la tension du grec.'
- issue: L’antécédent de ἐν ᾧ
  choice: Le Christ personnellement (« en qui »)
  alternative: Le mystère de Dieu pris plus largement (« dans lequel »)
  rationale: Le Christ est le référent personnel le plus proche en 2.2, mais la syntaxe permet de comprendre l’antécédent plus largement comme le mystère de Dieu ; cette possibilité est signalée en note.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase demeure concise et suit de près la structure grecque sans produire un tour artificiel.
