source:
  edition: SBLGNT
  text: Θέλω γὰρ ὑμᾶς εἰδέναι ἡλίκον ἀγῶνα ἔχω ⸀ὑπὲρ ὑμῶν καὶ τῶν ἐν Λαοδικείᾳ καὶ ὅσοι οὐχ ἑόρακαν τὸ πρόσωπόν μου ἐν σαρκί,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/001.yaml
  text: For I want you to know how great a struggle I have for you and for those in Laodicea[a], and for all who have not seen my face in the flesh,
translation:
  language: fr
  text: Car je veux que vous sachiez quel grand combat je mène pour vous, pour ceux qui sont à Laodicée et pour tous ceux qui n’ont pas vu mon visage dans la chair[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « en personne » ou « corporellement ». Littéralement : « dans la chair » ; l’expression désigne ici la présence physique.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Θέλω γὰρ
  choice: Je veux en effet
  rationale: « Je veux » rend directement θέλω, tandis que « en effet » exprime naturellement la fonction explicative de γάρ dans ce contexte.
- source_word: ὑμᾶς εἰδέναι
  choice: que vous sachiez
  rationale: Cette proposition complétive est la tournure française naturelle après « je veux » et conserve le sens cognitif de εἰδέναι.
- source_word: ἡλίκον ἀγῶνα
  choice: quel grand combat
  rationale: ἡλίκον souligne l’ampleur, et ἀγών évoque ici un effort intense ou une lutte, non une compétition sportive littérale. « Combat » préserve la vigueur de l’image.
- source_word: ἔχω ὑπὲρ ὑμῶν
  choice: je soutiens pour vous
  rationale: 'Avec ἀγών, « soutenir un combat » est idiomatique en français. « Pour vous » garde la valeur de ὑπέρ : en faveur des destinataires.'
- source_word: τῶν ἐν Λαοδικείᾳ
  choice: ceux de Laodicée
  rationale: L’article suivi du groupe prépositionnel désigne les personnes qui se trouvent à Laodicée. « Ceux de Laodicée » est concis et naturel en français.
- source_word: ὅσοι οὐχ ἑόρακαν
  choice: tous ceux qui n’ont pas vu
  rationale: « Tous ceux » restitue la portée inclusive de ὅσοι, et le passé composé convient au parfait grec dans ce contexte.
- source_word: τὸ πρόσωπόν μου
  choice: mon visage
  rationale: Le choix conserve l’image concrète du grec sans la remplacer par l’interprétation « ma présence » ou « moi en personne ».
- source_word: ἐν σαρκί
  choice: dans la chair
  rationale: La traduction littérale maintient le terme σάρξ. Ici, il renvoie à la présence physique et corporelle, non à une disposition morale pécheresse.
theological_decisions:
- issue: Sens de σάρξ dans un contexte non métaphorique
  choice: dans la chair
  alternative: en personne ; corporellement
  rationale: L’expression désigne ici la présence physique de Paul. La formulation littérale conserve le vocabulaire grec et sa dimension corporelle, tandis qu’une note indique les équivalents idiomatiques possibles.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste fluide tout en conservant les images fortes du texte grec, notamment « combat », « visage » et « chair ».
