    rationale: « En effet » est possible, mais « Car » rend plus nettement la valeur connective et explicative de γάρ par rapport à l’argument précédent.
  - severity: low
    issue: « je soutiens un combat »
    rationale: Cette collocation est moins idiomatique dans ce sens en français contemporain; « je mène un combat » exprime naturellement l’effort continu visé par ἀγῶνα ἔχω.
  - severity: low
    issue: « ceux de Laodicée »
    rationale: La formule est compréhensible, mais « ceux qui sont à Laodicée » reproduit plus exactement τῶν ἐν Λαοδικείᾳ, « ceux qui se trouvent à Laodicée ».
  revised_text: Car je veux que vous sachiez quel grand combat je mène pour vous, pour ceux qui sont à Laodicée et pour tous ceux qui n’ont pas vu mon visage dans la chair[a].
