id: COL.2.8
reference: Colossians 2:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Βλέπετε μή τις ὑμᾶς ἔσται ὁ συλαγωγῶν διὰ τῆς φιλοσοφίας καὶ κενῆς ἀπάτης κατὰ τὴν παράδοσιν τῶν ἀνθρώπων, κατὰ τὰ στοιχεῖα τοῦ κόσμου καὶ οὐ κατὰ Χριστόν·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/008.yaml
  text: See to it that no one takes you captive through philosophy and empty deceit[a], according to human tradition, according to the elemental principles of the world[b], and not according to Messiah.
translation:
  language: fr
  text: Veillez à ce que personne ne vous emmène en captivité au moyen de la philosophie et d’une vaine tromperie, selon la tradition humaine, selon les éléments du monde[a], et non selon le Messie[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression grecque peut aussi se comprendre comme « les principes élémentaires du monde » ou « les puissances spirituelles du monde ».
    reason: alternative_reading
  - marker: b
    text: 'Grec : « Christ » ; « Messie » explicite ici le sens du titre.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Βλέπετε μή τις
  choice: Veillez à ce que personne ne
  rationale: L’impératif présent introduit une mise en garde. Cette tournure transmet naturellement en français la vigilance demandée sans affaiblir la force exhortative.
- source_word: ἔσται ὁ συλαγωγῶν
  choice: ne vous emmène en captivité
  rationale: Le verbe évoque le fait d’emporter quelqu’un comme butin. Cette formulation conserve l’image de la capture tout en restant claire et idiomatique.
- source_word: διὰ τῆς φιλοσοφίας καὶ κενῆς ἀπάτης
  choice: au moyen de la philosophie et d’une vaine tromperie
  rationale: διά avec le génitif indique ici le moyen. La coordination des deux noms est maintenue, sans décider que « vaine tromperie » serait nécessairement une reformulation en apposition de « philosophie ».
- source_word: κατὰ τὴν παράδοσιν τῶν ἀνθρώπων
  choice: selon la tradition humaine
  rationale: κατά indique la norme ou le modèle. « Humaine » rend le pluriel générique ἀνθρώπων sans connotation exclusivement masculine.
- source_word: κατὰ τὰ στοιχεῖα τοῦ κόσμου
  choice: selon les éléments du monde
  rationale: στοιχεῖα peut désigner des éléments ou principes fondamentaux, mais aussi des puissances spirituelles cosmiques. Le terme français « éléments » reste proche du grec et évite de trancher dans le texte principal.
- source_word: οὐ κατὰ Χριστόν
  choice: et non selon le Messie
  rationale: Χριστός est ici le titre qui sert de norme opposée à la tradition humaine et aux éléments du monde. « Messie » rend explicitement ce sens titulaire.
theological_decisions:
- issue: Sens de στοιχεῖα τοῦ κόσμου
  choice: les éléments du monde
  alternative: les puissances élémentaires du monde / les principes élémentaires du monde
  rationale: L’expression paulinienne est débattue et peut renvoyer soit aux composantes ou principes fondamentaux de l’ordre du monde, soit à des puissances spirituelles. Le texte principal conserve une formulation ouverte et la note présente les deux grandes possibilités.
- issue: Valeur de Χριστός
  choice: le Messie
  alternative: Christ
  rationale: Le contexte met en avant la fonction titulaire de Χριστός comme norme opposée aux traditions humaines. Une note signale toutefois la forme française traditionnelle « Christ ».
translation_notes:
  register: Français international moderne, clair et digne. La répétition de « selon » reproduit la structure contrastive du grec. « Vaine tromperie » conserve l’idée d’une tromperie vide, sans substance, tandis que « emmène en captivité » maintient la métaphore du butin.
