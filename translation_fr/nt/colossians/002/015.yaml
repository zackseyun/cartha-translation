source:
  edition: SBLGNT
  text: ἀπεκδυσάμενος τὰς ἀρχὰς καὶ τὰς ἐξουσίας ἐδειγμάτισεν ἐν παρρησίᾳ, θριαμβεύσας αὐτοὺς ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/015.yaml
  text: Having disarmed the rulers and the authorities, he made a public spectacle of them, triumphing over them in him.
translation:
  language: fr
  text: Il a désarmé les principautés et les autorités, les a publiquement données en spectacle et les a entraînées dans son cortège triomphal en lui.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « par lui ». Le grec porte « en lui »; le pronom est masculin et ne renvoie donc pas directement à « la croix » dans le texte retenu. Son référent et la nuance exacte de l’expression sont discutés.'
    reason: Conserve la leçon masculine du SBLGNT et l'ambiguïté référentielle et sémantique, sans privilégier indûment une interprétation.
lexical_decisions:
- source_word: ἀπεκδυσάμενος
  choice: ayant dépouillé / il a dépouillé
  rationale: Le verbe évoque le fait de dépouiller, de désarmer ou d'ôter un vêtement. « Dépouillé » conserve l'image forte et laisse ouverte sa nuance exacte dans ce contexte.
- source_word: τὰς ἀρχὰς καὶ τὰς ἐξουσίας
  choice: les principautés et les autorités
  rationale: Ces termes désignent ici des puissances dirigeantes, probablement spirituelles. La formulation traditionnelle mais encore intelligible préserve leur portée cosmique sans ajouter explicitement « spirituelles ».
- source_word: ἐδειγμάτισεν ἐν παρρησίᾳ
  choice: les a données publiquement en spectacle
  rationale: Cette expression rend l'idée d'exposer ouvertement à la vue de tous, avec une connotation de honte publique.
- source_word: θριαμβεύσας αὐτοὺς
  choice: les a entraînées dans son cortège triomphal
  rationale: Le verbe renvoie au triomphe public d'un vainqueur et peut suggérer que les ennemis vaincus sont conduits dans son cortège. Cette traduction restitue mieux l'image qu'un simple « triompher de ».
- source_word: ἐν αὐτῷ
  choice: en lui
  rationale: Le pronom masculin peut renvoyer au Christ, antécédent masculin proche au verset 13. La traduction littérale conserve cependant une expression dont le référent reste discuté.
theological_decisions:
- issue: Identité du sujet des verbes
  choice: « Il » renvoie implicitement à Dieu, sujet repris du contexte immédiat.
  alternative: Le sujet pourrait être compris comme le Christ.
  rationale: Dans les versets 12-13, Dieu est le sujet de la résurrection du Christ et de l'action qui rend les croyants vivants; le grec permet néanmoins que le lecteur associe étroitement cette victoire à l'œuvre du Christ.
- issue: Référent de ἐν αὐτῷ
  choice: « en lui », probablement en Christ
  alternative: « en elle », c'est-à-dire en la croix, suivant une variante textuelle ou une interprétation contextuelle; ou « par lui »
  rationale: Le SBLGNT lit le pronom masculin αὐτῷ, non le féminin qui renverrait grammaticalement à la croix. Il convient donc de préserver « en lui » sans résoudre silencieusement le sens instrumental ou locatif.
translation_notes:
  register: Français moderne, digne et lisible. « Principautés » conserve le vocabulaire cosmique paulinien; « cortège triomphal » explicite l'image historique du verbe sans l'aplatir. Le marqueur [a] est placé immédiatement après l'expression concernée.
