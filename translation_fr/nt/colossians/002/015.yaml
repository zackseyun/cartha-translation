    rationale: Le masculin du pronom écarte grammaticalement un renvoi direct à σταυρός (« croix »), féminin, dans la leçon SBLGNT, mais il ne suffit pas à démontrer que son référent est le Christ plutôt que Dieu ou une autre compréhension contextuelle. La note doit préserver cette incertitude.
  - severity: low
    issue: Placement et formulation de « publiquement en spectacle ».
    rationale: Le déplacement de l'adverbe rend la locution française plus naturelle tout en conservant exactement l'idée d'une exposition publique.
