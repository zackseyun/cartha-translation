  verdict: revise
  source_fidelity: La structure participiale et les quatre actions du grec sont bien rendues. Toutefois, « dépouillé les principautés » est possible mais demeure plus ambigu en français que ἀπεκδυσάμενος dans ce contexte, où l'idée de désarmer ou de priver les puissances de leurs moyens est plus immédiatement accessible. Le complément ἐν αὐτῷ doit rester « en lui » dans le texte, conformément au SBLGNT.
  naturalness: « Les a données publiquement en spectacle » est compréhensible, mais « les a publiquement données en spectacle » est plus idiomatique et plus direct. « Les a entraînées dans son cortège triomphal » restitue bien l'image du triomphe sans transformer le texte en simple victoire abstraite.
  terminology: '« Principautés et autorités » est un couple paulinien établi et approprié. « Désarmé » rend ici clairement l''effet de ἀπεκδυσάμενος sans imposer une identification détaillée des puissances. La note doit éviter d''affirmer que le masculin désigne probablement le Christ : il exclut « la croix » dans le texte retenu, mais ne tranche pas à lui seul entre les référents masculins possibles dans le contexte.'
