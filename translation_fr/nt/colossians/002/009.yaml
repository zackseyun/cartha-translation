  text: ὅτι ἐν αὐτῷ κατοικεῖ πᾶν τὸ πλήρωμα τῆς θεότητος σωματικῶς,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/009.yaml
  text: For in him all the fullness of deity dwells bodily,[a]
translation:
  language: fr
  text: Car c’est en lui qu’habite corporellement toute la plénitude de la divinité,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « toute la plénitude de la nature divine habite en lui corporellement » .
    reason: Alternative lexicale pour « divinité » et variante d’ordre des mots, tout en conservant la force de θεότης et le caractère adverbial de σωματικῶς.
lexical_decisions:
- source_word: ὅτι
  choice: Car
  rationale: Dans le contexte, la conjonction introduit la raison qui fonde l’avertissement précédent; « Car » en conserve clairement la valeur causale.
- source_word: ἐν αὐτῷ
  choice: en lui
  rationale: Cette expression locative renvoie au Christ sans ajouter une idée d’exclusivité absente du grec.
- source_word: κατοικεῖ
  choice: habite
  rationale: « Habite » exprime une présence établie et durable, tout en gardant la force théologique du verbe grec.
- source_word: πᾶν τὸ πλήρωμα
  choice: toute la plénitude
  rationale: Cette formulation française naturelle rend à la fois la totalité exprimée par πᾶν et le substantif déterminé πλήρωμα.
- source_word: τῆς θεότητος
  choice: de la divinité
  rationale: Dans ce contexte, « divinité » désigne la réalité ou la condition d’être Dieu, et non simplement des qualités divines.
- source_word: σωματικῶς
  choice: corporellement
  rationale: L’adverbe traduit directement la forme adverbiale grecque et préserve sa portée christologique sans la réduire à une interprétation particulière.
theological_decisions:
- issue: Portée christologique de θεότης et σωματικῶς
  choice: Le verset affirme que toute la plénitude de la divinité habite corporellement dans le Christ.
  alternative: Comprendre le texte comme une simple présence de qualités divines en Christ, ou comme la présence de Dieu sans affirmation de la pleine divinité.
  rationale: θεότης est un terme fort qui désigne la divinité elle-même plutôt que de simples attributs divins; σωματικῶς affirme le caractère corporel de cette habitation. La traduction conserve cette affirmation sans en préciser davantage le mode.
translation_notes:
  register: Français international moderne, digne et accessible. « Habite corporellement » conserve la concision et la tension du grec; la note explicite une autre formulation possible sans affaiblir le sens de θεότης.
