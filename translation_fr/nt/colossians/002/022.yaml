    reason: cross_reference
  revision_rationale: La révision retire l’explicitation « ces règles », qui dépasse la formulation grecque et rendait la phrase moins naturelle. « Selon » conserve la connexion compacte de κατὰ avec les « commandements et enseignements humains », sans trancher davantage la portée syntaxique. « Vouées à la destruction par l’usage » rend εἰς φθοράν τῇ ἀποχρήσει avec une diction française moderne et une valeur de périssabilité plus proche de φθορά.
