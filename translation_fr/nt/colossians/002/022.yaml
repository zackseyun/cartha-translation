revisions:
- from: Toutes ces choses sont vouées à disparaître à l’usage[a] ; ces règles suivent des commandements et des enseignements humains[b].
  to: Toutes ces choses sont vouées à la destruction par l’usage, selon les commandements et les enseignements humains[a][b].
  rationale: La révision retire l’explicitation « ces règles », qui dépasse la formulation grecque et rendait la phrase moins naturelle. « Selon » conserve la connexion compacte de κατὰ avec les « commandements et enseignements humains », sans trancher davantage la portée syntaxique. « Vouées à la destruction par l’usage » rend εἰς φθοράν τῇ ἀποχρήσει avec une diction française moderne et une valeur de périssabilité plus proche de φθορά.
