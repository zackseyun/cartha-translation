  text: ἅ ἐστιν πάντα εἰς φθορὰν τῇ ἀποχρήσει, κατὰ τὰ ἐντάλματα καὶ διδασκαλίας τῶν ἀνθρώπων;
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/022.yaml
  text: These all perish with use[c][b][a], according to the commandments and teachings of men.
translation:
  language: fr
  text: Toutes ces choses sont vouées à la destruction par l’usage, selon les commandements et les enseignements humains[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « qui toutes périssent à l’usage ». Le grec peut exprimer la proposition de façon plus compacte et souligne que les choses concernées sont périssables et s’épuisent lorsqu’on les utilise.'
    reason: lexical_alternative
  - marker: b
    text: L’expression « commandements et enseignements humains » fait probablement écho à Ésaïe 29.13 et souligne l’origine humaine de ces prescriptions.
    reason: cross_reference
lexical_decisions:
- source_word: ἅ ἐστιν πάντα
  choice: Toutes ces choses sont
  rationale: Le pronom relatif neutre pluriel renvoie aux choses visées par les interdictions du verset précédent. Cette formulation française rend clairement ce renvoi sans alourdir la phrase.
- source_word: εἰς φθοράν
  choice: vouées à disparaître
  rationale: L’expression indique l’aboutissement à la destruction, à la décomposition ou à la disparition. Dans le contexte de choses consommables, « disparaître » est naturel, tandis que « vouées à » conserve la valeur orientée de εἰς.
- source_word: τῇ ἀποχρήσει
  choice: à l’usage
  rationale: ἀπόχρησις désigne l’utilisation jusqu’à épuisement ou la consommation. « À l’usage » exprime avec concision que ces choses disparaissent précisément lorsqu’on s’en sert.
- source_word: κατά
  choice: suivent
  rationale: κατά introduit ici la norme à laquelle correspondent les prescriptions. « Suivent » est idiomatique en français et évite l’ambiguïté peu naturelle de « selon » après la proposition sur les objets périssables.
- source_word: ἐντάλματα
  choice: commandements
  rationale: Le terme désigne des prescriptions ou préceptes et contribue probablement à l’écho d’Ésaïe 29.13.
- source_word: διδασκαλίας
  choice: enseignements
  rationale: « Enseignements » est actuel et non technique, tout en conservant le sens de contenus transmis comme instruction.
- source_word: τῶν ἀνθρώπων
  choice: humains
  rationale: Le génitif indique l’origine humaine de ces prescriptions, en contraste implicite avec l’autorité divine. L’adjectif inclusif « humains » restitue naturellement ἀνθρώπων en français moderne.
theological_decisions:
- issue: Rapport entre la proposition sur les choses périssables et la critique des prescriptions ascétiques
  choice: La première proposition décrit les choses réglementées comme périssables, puis la seconde caractérise les règles comme étant d’origine humaine.
  alternative: On peut rattacher plus étroitement « selon les commandements et les enseignements humains » à l’ensemble de la phrase, sans expliciter « ces règles ».
  rationale: Le grec passe des objets des interdictions à la norme humaine qui sous-tend celles-ci. L’ajout explicatif minimal « ces règles » rend ce mouvement compréhensible en français, sans préciser davantage la portée exacte de la critique.
translation_notes:
  register: Français international moderne, digne et accessible. « Vouées à disparaître à l’usage » garde à la fois l’idée de destination et celle de consommation. « Humains » évite que « des hommes » soit compris comme visant seulement le sexe masculin. Le point-virgule rend lisible le changement de référent implicite entre les objets réglementés et les règles elles-mêmes.
