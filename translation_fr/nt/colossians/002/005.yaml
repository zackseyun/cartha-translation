id: COL.2.5
reference: Colossians 2:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἰ γὰρ καὶ τῇ σαρκὶ ἄπειμι, ἀλλὰ τῷ πνεύματι σὺν ὑμῖν εἰμι, χαίρων καὶ βλέπων ὑμῶν τὴν τάξιν καὶ τὸ στερέωμα τῆς εἰς Χριστὸν πίστεως ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/005.yaml
  text: For even if I am absent in the flesh[a], yet I am with you in spirit[c][b], rejoicing and seeing your good order and the firmness of your faith in Messiah.
translation:
  language: fr
  text: 'Car même si je suis absent de corps, je suis pourtant avec vous en esprit[b] : je me réjouis de constater le bon ordre qui règne parmi vous et la fermeté de votre foi dans le Messie[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou peut-être : « la fermeté de votre fidélité envers le Messie ».'
    reason: alternative_reading
  - marker: b
    text: 'Ou peut-être : « dans l’Esprit », si Paul fait référence à l’Esprit saint.'
    reason: theological_ambiguity
lexical_decisions:
- source_word: τῇ σαρκί
  choice: de corps
  rationale: Dans ce contraste avec « en esprit », σάρξ désigne la présence physique de Paul, sans connotation morale. « Absent de corps » est naturel en français et évite l’ambiguïté indue de « absent dans la chair ».
- source_word: τῷ πνεύματι
  choice: en esprit
  rationale: L’expression fait pendant à l’absence corporelle et désigne très probablement la présence non physique de Paul. La minuscule et la note maintiennent néanmoins l’ambiguïté possible avec l’Esprit saint.
- source_word: χαίρων καὶ βλέπων
  choice: je me réjouis de constater
  rationale: Cette formulation française naturelle exprime la joie et l’observation simultanées des deux participes présents, sans suggérer une vision physique.
- source_word: τὴν τάξιν
  choice: le bon ordre qui règne parmi vous
  rationale: τάξις évoque ici un ordre communautaire digne d’éloge. L’ajout idiomatique de « bon » rend la valeur positive impliquée par le contexte.
- source_word: τὸ στερέωμα
  choice: la fermeté
  rationale: στερέωμα désigne la solidité ou la stabilité. « Fermeté » conserve cette image et s’associe naturellement à la foi.
- source_word: τῆς ... πίστεως ὑμῶν
  choice: de votre foi
  rationale: « Foi » est le sens le plus naturel de πίστις dans cette construction, tandis que la nuance possible de fidélité est signalée en note.
- source_word: εἰς Χριστόν
  choice: dans le Messie
  rationale: Avec πίστις, εἰς indique l’objet vers lequel la foi se porte; le français idiomatique dit « foi dans ». Χριστός garde ici sa valeur de titre et est donc rendu par « le Messie ».
theological_decisions:
- issue: Référent de πνεύματι
  choice: L’esprit de Paul, par contraste avec son absence corporelle
  alternative: L’Esprit saint comme moyen de sa présence auprès d’eux
  rationale: L’opposition immédiate entre corps et esprit favorise le sens personnel, mais la formulation et la note évitent d’exclure entièrement la lecture pneumatologique.
- issue: Sens de πίστις
  choice: La foi des Colossiens dans le Messie
  alternative: Leur fidélité envers le Messie
  rationale: Dans la construction avec εἰς Χριστόν, « foi dans le Messie » est la lecture la plus courante et la plus naturelle; la polysémie de πίστις justifie toutefois une note.
- issue: Valeur de Χριστός
  choice: Messie
  alternative: Christ
  rationale: Χριστός fonctionne ici comme le titre de celui en qui la foi est placée; « Messie » en rend explicitement le sens sans introduire de doctrine confessionnelle particulière.
translation_notes:
  register: Français international moderne, digne et accessible. « Absent de corps » et « en esprit » conservent le contraste de l’original; les deux participes grecs sont rendus par la tournure naturelle « je me réjouis de constater ». Les marqueurs de note sont placés immédiatement après les expressions concernées.
