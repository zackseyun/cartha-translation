  text: ἅτινά ἐστιν λόγον μὲν ἔχοντα σοφίας ἐν ἐθελοθρησκίᾳ καὶ ταπεινοφροσύνῃ καὶ ἀφειδίᾳ σώματος, οὐκ ἐν τιμῇ τινι πρὸς πλησμονὴν τῆς σαρκός.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/023.yaml
  text: These indeed have an appearance of wisdom in self-made religion and humility and harsh treatment of the body[d][c][b][a], but are of no value against the indulgence of the flesh.
translation:
  language: fr
  text: Ces règles ont, il est vrai, une apparence de sagesse[a], dans une religion que l’on s’impose soi-même[b], dans l’humilité et dans un traitement sévère du corps ; mais elles n’ont aucune valeur[c] contre l’assouvissement de la chair[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ont une réputation de sagesse ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « un culte auto-imposé » ; traditionnellement : « un culte volontaire ».'
    reason: lexical_alternative
  - marker: c
    text: 'La proposition finale est difficile. On pourrait aussi traduire : « sans aucun honneur, pour l’assouvissement de la chair », ou : « sans aucun honneur contre l’assouvissement de la chair ».'
    reason: alternative_reading
  - marker: d
    text: Ici, la « chair » peut désigner des désirs humains marqués par le péché ; comparer les autres emplois de ce terme chez Paul.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἅτινά
  choice: Ces règles
  rationale: Le relatif reprend les prescriptions citées aux versets 21–22. « Ces règles » explicite naturellement le référent sans modifier le sens.
- source_word: λόγον μὲν ἔχοντα σοφίας
  choice: ont, il est vrai, une apparence de sagesse
  rationale: L’expression évoque ici une apparence ou une réputation de sagesse, tandis que μέν introduit une concession que « il est vrai » rend en français.
- source_word: ἐθελοθρησκίᾳ
  choice: une religion qu’on s’impose soi-même
  rationale: Ce terme rare désigne une pratique cultuelle ou religieuse issue de la volonté propre. Cette formulation moderne conserve l’idée d’une observance auto-imposée sans suggérer nécessairement la création d’une religion entièrement nouvelle.
- source_word: ταπεινοφροσύνῃ
  choice: l’humilité
  rationale: Le sens lexical ordinaire est conservé ; le contexte laisse entendre que cette humilité peut être ostentatoire ou ascétique sans l’imposer dans la traduction.
- source_word: ἀφειδίᾳ σώματος
  choice: un traitement sévère du corps
  rationale: ἀφειδία exprime une rigueur sans ménagement. La formulation décrit clairement l’ascèse corporelle.
- source_word: οὐκ ἐν τιμῇ τινι
  choice: elles n’ont aucune valeur
  rationale: Dans cette construction difficile, τιμή est compris comme valeur ou efficacité réelle, en contraste avec l’apparence de sagesse.
- source_word: πρὸς πλησμονὴν
  choice: pour lutter contre les désirs
  rationale: Dans le contexte, la locution est comprise comme visant la satiété ou l’assouvissement de la chair ; le français exprime l’inefficacité de ces règles face à ces désirs.
- source_word: τῆς σαρκός
  choice: de la chair
  rationale: « Chair » maintient le terme paulinien et son ambiguïté entre la dimension corporelle et les désirs humains déchus, sans le réduire à une paraphrase doctrinale.
theological_decisions:
- issue: Sens de la proposition difficile οὐκ ἐν τιμῇ τινι πρὸς πλησμονὴν τῆς σαρκός
  choice: Les pratiques ascétiques n’ont aucune efficacité pour combattre les désirs de la chair.
  alternative: Elles n’accordent aucun honneur au corps et conduisent à la satisfaction de la chair ; ou elles sont sans honneur face à l’assouvissement de la chair.
  rationale: La syntaxe grecque est condensée et contestée. La lecture retenue correspond bien au contraste entre l’apparence de sagesse et l’absence d’efficacité, mais les autres analyses plausibles sont signalées en note.
- issue: Portée de σάρξ
  choice: Conserver « chair » dans le texte.
  alternative: Expliciter par « nature pécheresse » ou « désirs mauvais ».
  rationale: Le terme peut désigner ici les impulsions humaines déchues, mais la traduction littérale préserve la tension entre corps, désir et orientation morale sans imposer une interprétation systématique.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase conserve la concession de μέν, le vocabulaire paulinien de la « chair » et l’incertitude de la proposition finale au moyen d’une note. Les marqueurs sont placés dans l’ordre alphabétique après la dernière expression concernée.
