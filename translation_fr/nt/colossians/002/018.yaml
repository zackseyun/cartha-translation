id: COL.2.18
reference: Colossians 2:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: μηδεὶς ὑμᾶς καταβραβευέτω θέλων ἐν ταπεινοφροσύνῃ καὶ θρησκείᾳ τῶν ἀγγέλων, ⸀ἃ ἑόρακεν ἐμβατεύων, εἰκῇ φυσιούμενος ὑπὸ τοῦ νοὸς τῆς σαρκὸς αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/018.yaml
  text: Let no one disqualify you[a], delighting in humility and the worship of angels, dwelling on what he has seen, vainly puffed up by the mind of his flesh[c][b],
translation:
  language: fr
  text: Que personne ne vous disqualifie, en prenant plaisir à l’humilité et au culte des anges[a], s’attardant sur ce qu’il a vu[b][c], gonflé d’orgueil sans raison par l’intelligence de sa chair.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à la religion des anges » ou « au culte rendu avec les anges ». L’expression grecque peut être comprise de plusieurs manières.
    reason: alternative_reading
  - marker: b
    text: Certains manuscrits portent « ce qu’il n’a pas vu », ce qui donnerait un sens proche de « s’attardant sur ce qu’il n’a pas vu ».
    reason: textual_variant
  - marker: c
    text: Ou « pénétrant dans ce qu’il a vu ». Le verbe grec est rare et son sens est difficile à établir.
    reason: lexical_alternative
lexical_decisions:
- source_word: καταβραβευέτω
  choice: disqualifie
  rationale: Le verbe évoque une décision rendue contre quelqu’un, qui l’écarte ou le prive du prix. « Disqualifie » conserve cette image de jugement tout en restant concis en français.
- source_word: θέλων ἐν
  choice: en prenant plaisir à
  rationale: Dans cette construction difficile, le participe exprime vraisemblablement le goût ou la complaisance de la personne pour les pratiques mentionnées, plutôt qu’une simple volonté.
- source_word: ταπεινοφροσύνῃ
  choice: l’humilité
  rationale: Le terme signifie normalement « humilité ». Le contexte polémique peut suggérer une humilité affectée ou ascétique, mais la traduction évite d’imposer cette interprétation dans le texte principal.
- source_word: θρησκείᾳ τῶν ἀγγέλων
  choice: au culte des anges
  rationale: Le génitif est ambigu. La lecture la plus directe comprend un culte adressé aux anges; les autres possibilités sont signalées en note.
- source_word: ἃ ἑόρακεν ἐμβατεύων
  choice: s’attardant sur ce qu’il a vu
  rationale: ἐμβατεύω est rare et son sens est discuté. « S’attardant sur » exprime de manière naturelle l’idée de s’engager longuement dans le récit ou l’examen de visions, sans masquer l’incertitude lexicale.
- source_word: εἰκῇ
  choice: sans raison
  rationale: L’adverbe indique que cet orgueil est sans fondement, injustifié ou vain.
- source_word: φυσιούμενος
  choice: gonflé d’orgueil
  rationale: Cette expression conserve l’image paulinienne de l’enflure tout en en rendant clairement la valeur métaphorique.
- source_word: νοὸς τῆς σαρκὸς αὐτοῦ
  choice: par l’intelligence de sa chair
  rationale: La formulation conserve à la fois νοῦς, « intelligence », et σάρξ, « chair », malgré la tension inhabituelle de l’expression, afin de ne pas la remplacer par une interprétation doctrinale.
theological_decisions:
- issue: Sens de θρησκείᾳ τῶν ἀγγέλων
  choice: culte adressé aux anges
  alternative: religion des anges; culte rendu avec les anges
  rationale: Le génitif peut être objectif, subjectif ou associatif. Le texte principal retient la lecture objective, courante et plausible dans ce contexte d’avertissement, tandis que la note préserve les autres lectures.
- issue: Interprétation de σάρξ dans τῆς σαρκὸς αὐτοῦ
  choice: chair
  alternative: nature pécheresse; manière de penser charnelle
  rationale: « Chair » maintient le vocabulaire et la tension anthropologique de Paul sans introduire une formulation doctrinale plus systématique.
- issue: Nature des expériences évoquées par ἃ ἑόρακεν
  choice: ce qu’il a vu
  alternative: ce qu’il n’a pas vu
  rationale: Le texte de la SBLGNT porte la lecture affirmative, probablement à propos de visions revendiquées. Une variante manuscrite négative est signalée sans être intégrée au texte principal.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la densité argumentative de Paul ainsi que l’expression volontairement tendue « l’intelligence de sa chair ». « Gonflé d’orgueil » explicite naturellement la métaphore sans en perdre l’image.
