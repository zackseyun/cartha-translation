id: COL.2.16
reference: Colossians 2:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Μὴ οὖν τις ὑμᾶς κρινέτω ἐν βρώσει ⸀ἢ ἐν πόσει ἢ ἐν μέρει ἑορτῆς ἢ νουμηνίας ἢ σαββάτων,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/016.yaml
  text: Therefore[a], let no one judge you in food or in drink[c][b], or with regard to a festival or a new moon or Sabbaths.
translation:
  language: fr
  text: Que personne donc ne vous juge au sujet de ce que vous mangez ou buvez,[a] ni à propos d’une fête, d’une nouvelle lune ou de sabbats.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: C’est-à-dire au sujet de règles concernant la nourriture et la boisson.
    reason: cultural_note
  - marker: b
    text: 'La suite « fête, nouvelle lune, sabbats » évoque le calendrier sacré juif : observances annuelles, mensuelles et hebdomadaires.'
    reason: cross_reference
lexical_decisions:
- source_word: Μὴ οὖν τις ὑμᾶς κρινέτω
  choice: Que personne donc ne vous juge
  rationale: La tournure française rend naturellement l’interdiction formée par Μὴ et l’impératif présent, tandis que « donc » conserve le lien logique avec l’argument précédent. « Juger » maintient la portée ouverte de κρίνω sans ajouter explicitement l’idée de condamnation.
- source_word: ἐν βρώσει ἢ ἐν πόσει
  choice: au sujet de ce que vous mangez ou buvez
  rationale: βρῶσις et πόσις peuvent désigner la nourriture et la boisson ou l’acte de manger et de boire. Cette formulation idiomatique exprime les pratiques alimentaires visées, sans le calque peu naturel « en nourriture ou en boisson ».
- source_word: ἐν μέρει ἑορτῆς
  choice: à propos d’une fête
  rationale: ἐν μέρει est ici idiomatique et signifie « en ce qui concerne » ou « à propos de », non « dans une partie de ». ἑορτή désigne une fête religieuse.
- source_word: νουμηνίας
  choice: d’une nouvelle lune
  rationale: Le terme renvoie à l’observance mensuelle liée à la nouvelle lune. Le singulier représentatif du grec est conservé.
- source_word: σαββάτων
  choice: de sabbats
  rationale: Le pluriel grec est conservé et s’inscrit dans la séquence calendaire traditionnelle fête, nouvelle lune, sabbats.
theological_decisions:
- issue: Portée du jugement concernant les pratiques énumérées
  choice: Le verset interdit que l’on juge les croyants en matière de pratiques alimentaires et calendaires.
  alternative: Affirmer soit l’abolition absolue de toutes ces observances, soit que seules des règles ascétiques humaines sont visées.
  rationale: Le grec porte directement sur le fait de juger « au sujet de » ces matières. À lui seul, ce verset ne tranche pas entièrement les débats sur la validité ou la continuité de ces observances; la traduction n’ajoute donc aucune conclusion doctrinale.
translation_notes:
  register: Français international moderne, naturel et digne. La construction place « donc » après le sujet grammatical pour garder un enchaînement fluide. « Sabbats » conserve la forme plurielle et la coloration historique et religieuse du terme grec.
