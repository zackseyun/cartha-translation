reference: Colossians 2:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ὡς οὖν παρελάβετε τὸν Χριστὸν Ἰησοῦν τὸν κύριον, ἐν αὐτῷ περιπατεῖτε,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/006.yaml
  text: Therefore[a], just as you received Messiah Jesus the Lord, walk in him,
translation:
  language: fr
  text: Ainsi donc, de même que vous avez reçu Jésus, le Messie[a], le Seigneur, marchez en lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le Christ Jésus, le Seigneur ».'
    reason: Signale la formulation française traditionnelle de Χριστὸν Ἰησοῦν τὸν κύριον sans remplacer dans le texte principal la traduction du titre « Messie ».
lexical_decisions:
- source_word: Ὡς
  choice: de même que
  rationale: Introduit une correspondance entre la manière dont les Colossiens ont reçu Jésus et la conduite qui doit désormais être la leur. Cette tournure exprime clairement la valeur comparative.
- source_word: οὖν
  choice: ainsi donc
  rationale: Marque la conséquence pratique de l’argument précédent tout en s’intégrant naturellement à l’exhortation en français.
- source_word: παρελάβετε
  choice: vous avez reçu
  rationale: L’aoriste renvoie à leur réception passée de l’enseignement apostolique et de la personne annoncée. « Reçu » conserve cette amplitude sans préciser excessivement le sens.
- source_word: τὸν Χριστὸν Ἰησοῦν
  choice: le Messie Jésus
  rationale: Χριστός garde ici sa valeur de titre, rendue par « Messie », tandis que Ἰησοῦν est translittéré comme nom. L’ordre grec est conservé autant que le permet le français.
- source_word: τὸν κύριον
  choice: le Seigneur
  rationale: Rend le titre christologique κύριος de manière traditionnelle et exacte. La reprise de l’article et l’apposition sont préservées.
- source_word: ἐν αὐτῷ
  choice: en lui
  rationale: Conserve la formulation paulinienne concise et son amplitude théologique, sans l’expliciter par « en union avec lui ».
- source_word: περιπατεῖτε
  choice: marchez
  rationale: L’impératif présent est rendu directement. « Marchez » maintient la métaphore paulinienne de la conduite quotidienne plutôt que de l’aplatir en « vivez ».
theological_decisions:
- issue: Valeur de Χριστός dans la suite de titres
  choice: le Messie Jésus
  alternative: Christ Jésus
  rationale: Avec l’article et la structure appositionnelle, Χριστός peut être entendu comme un titre. « Messie » en traduit le sens, tandis que la formulation traditionnelle est signalée en note.
- issue: Langage paulinien de l’union dans ἐν αὐτῷ
  choice: en lui
  alternative: en union avec lui
  rationale: Le grec reste volontairement compact. « En lui » préserve l’ambiguïté féconde entre sphère de vie, relation et union, sans imposer une seule explication.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la métaphore biblique de la marche et la formulation paulinienne « en lui ». « Ainsi donc, de même que » est légèrement soutenu mais clair et restitue les deux connecteurs grecs.
