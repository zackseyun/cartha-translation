id: JUD.1.11
reference: Jude 1:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὐαὶ αὐτοῖς, ὅτι τῇ ὁδῷ τοῦ Κάϊν ἐπορεύθησαν, καὶ τῇ πλάνῃ τοῦ Βαλαὰμ μισθοῦ ἐξεχύθησαν, καὶ τῇ ἀντιλογίᾳ τοῦ Κόρε ἀπώλοντο.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/011.yaml
  text: Woe to them[a], because they have walked in the way of Cain, and have poured themselves out for pay into Balaam’s error, and have perished in Korah’s rebellion.
translation:
  language: fr
  text: Malheur à eux ! Car ils ont suivi le chemin de Caïn, ils se sont jetés, pour un salaire, dans l’égarement de Balaam[a], et ils ont péri dans la révolte de Coré.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « ils se sont répandus, pour un salaire, dans l’égarement de Balaam » ; ou : « ils se sont précipités par appât du gain dans l’égarement de Balaam ».'
    reason: 'Le verbe grec est une métaphore difficile : il signifie littéralement « se répandre, être déversé », mais peut exprimer ici un abandon impétueux.'
lexical_decisions:
- source_word: οὐαὶ
  choice: Malheur à eux !
  rationale: « Malheur » conserve la force prophétique de dénonciation et de jugement de l’interjection grecque.
- source_word: τῇ ὁδῷ τοῦ Κάϊν ἐπορεύθησαν
  choice: ils ont suivi le chemin de Caïn
  rationale: Cette formulation française naturelle conserve la métaphore du chemin comme conduite morale et l’allusion biblique à Caïn.
- source_word: τῇ πλάνῃ τοῦ Βαλαὰμ
  choice: dans l’égarement de Balaam
  rationale: « Égarement » garde à la fois l’idée d’erreur et celle d’une mauvaise voie, sans préciser indûment s’il s’agit surtout de tromperie ou de faute morale.
- source_word: μισθοῦ
  choice: pour un salaire
  rationale: Le terme désigne une rémunération ou un gain reçu en contrepartie ; cette traduction explicite le mobile intéressé sans le paraphraser par « appât du gain ».
- source_word: ἐξεχύθησαν
  choice: ils se sont jetés
  rationale: Le verbe évoque littéralement le fait de se répandre ou d’être déversé ; dans ce contexte, « se sont jetés » rend naturellement en français l’élan irréfléchi et l’abandon exprimés par l’image grecque.
- source_word: τῇ ἀντιλογίᾳ τοῦ Κόρε
  choice: dans la révolte de Coré
  rationale: Dans l’allusion à Nombres 16, ἀντιλογία désigne l’opposition rebelle de Coré ; « révolte » communique clairement cet événement tout en restant proche du champ lexical grec.
- source_word: ἀπώλοντο
  choice: ils ont péri
  rationale: « Périr » conserve le caractère solennel et résultatif du verbe sans préciser davantage le mode de destruction.
- source_word: Κάϊν, Βαλαὰμ, Κόρε
  choice: Caïn, Balaam, Coré
  rationale: Formes françaises traditionnelles et immédiatement reconnaissables de ces noms bibliques.
theological_decisions:
- issue: Rendre la formule métaphorique et syntaxiquement dense καὶ τῇ πλάνῃ τοῦ Βαλαὰμ μισθοῦ ἐξεχύθησαν
  choice: ils se sont jetés, pour un salaire, dans l’égarement de Balaam
  alternative: ils se sont répandus, pour un salaire, dans l’égarement de Balaam
  rationale: La traduction principale restitue l’abandon impétueux suggéré par le verbe tout en demeurant naturelle. La note conserve l’image plus littérale de l’écoulement, afin de ne pas masquer la difficulté réelle de la formulation grecque.
- issue: Valeur de ἀντιλογία dans l’allusion à Coré
  choice: révolte
  alternative: opposition
  rationale: « Révolte » correspond au contexte narratif de Nombres 16, tandis qu’« opposition » serait lexicalement possible mais moins précis dans cette allusion.
translation_notes:
  register: Français international actuel, digne et accessible. Le rythme ternaire de l’original est conservé par les trois propositions coordonnées. « Pour un salaire » maintient la formulation concrète du grec, et la note signale sans la résoudre la difficulté de l’image verbale.
