  variant: modern international French
source:
  edition: SBLGNT
  text: Τῷ δὲ δυναμένῳ φυλάξαι ⸀ὑμᾶς ἀπταίστους καὶ στῆσαι κατενώπιον τῆς δόξης αὐτοῦ ἀμώμους ἐν ἀγαλλιάσει
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/024.yaml
  text: To the one who is able to keep you from stumbling and to present you blameless before his glory with rejoicing[c][b][a],
translation:
  language: fr
  text: À celui qui peut vous garder de trébucher[a] et vous faire paraître irréprochables[c] devant sa gloire[b], dans l’allégresse,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « de tomber ». Le mot grec évoque le fait de ne pas trébucher ou de ne pas chuter.'
    reason: lexical_alternative
  - marker: b
    text: 'Autre traduction traditionnelle : « devant sa glorieuse présence ». Le grec dit littéralement : « devant sa gloire ».'
    reason: alternative_reading
  - marker: c
    text: 'Ou : « sans défaut ». Le mot grec peut aussi évoquer une victime sacrificielle sans défaut.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τῷ ... δυναμένῳ
  choice: À celui qui peut
  rationale: Le participe substantivé au datif introduit le destinataire de la doxologie qui se poursuit au verset 25. Cette formulation française est naturelle et conserve l’idée de capacité.
- source_word: δὲ
  choice: non exprimé séparément
  rationale: Ici, δέ marque une transition légère vers la doxologie finale. En français, l’enchaînement se fait naturellement sans ajouter « maintenant », qui pourrait être compris comme temporel.
- source_word: φυλάξαι ὑμᾶς ἀπταίστους
  choice: vous garder de trébucher
  rationale: « Garder » rend le sens de protection de φυλάσσω, tandis que « de trébucher » restitue naturellement en français l’image portée par l’adjectif ἀπταίστους.
- source_word: καὶ στῆσαι
  choice: et vous faire tenir
  rationale: Le causatif « faire tenir » reste proche de l’idée de faire se tenir debout, sans réduire d’emblée l’expression à une simple comparution ou présentation.
- source_word: κατενώπιον τῆς δόξης αὐτοῦ
  choice: devant sa gloire
  rationale: Cette traduction concise suit directement le grec et conserve « gloire » comme nom, sans l’expliciter par « glorieuse présence ».
- source_word: ἀμώμους
  choice: irréprochables
  rationale: Le terme exprime l’absence de défaut ou de reproche et peut garder une résonance sacrificielle. « Irréprochables » est clair, actuel et digne.
- source_word: ἐν ἀγαλλιάσει
  choice: dans l’allégresse
  rationale: ἀγαλλίασις désigne une joie exultante. « Allégresse » en préserve l’intensité et le registre élevé sans ajouter un adjectif absent du grec.
theological_decisions:
- issue: La relation entre la protection divine et le fait de ne pas trébucher
  choice: vous garder de trébucher
  alternative: vous préserver de tomber
  rationale: La formulation retenue conserve la métaphore fondamentale sans décider si elle vise surtout les fautes quotidiennes, l’égarement doctrinal ou la chute finale.
- issue: Le sens de τῆς δόξης αὐτοῦ
  choice: devant sa gloire
  alternative: devant sa glorieuse présence
  rationale: Le grec nomme explicitement la « gloire ». La traduction ne transforme donc pas ce nom en adjectif et laisse intacte la densité théologique de l’expression.
- issue: Le sens judiciaire, moral ou sacrificiel de ἀμώμους
  choice: irréprochables
  alternative: sans défaut
  rationale: « Irréprochables » est compréhensible dans un contexte moral et judiciaire, tandis que la note signale la résonance possible de l’absence de défaut sacrificiel sans imposer une seule lecture.
translation_notes:
  register: Français international moderne, clair et soutenu. La syntaxe garde la forme inachevée de la doxologie, qui se poursuit au verset 25. « Allégresse » maintient le ton solennel sans archaïsme marqué.
