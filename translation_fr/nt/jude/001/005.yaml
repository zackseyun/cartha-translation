id: JUD.1.5
reference: Jude 1:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ὑπομνῆσαι δὲ ὑμᾶς βούλομαι, εἰδότας ⸂ὑμᾶς ἅπαξ⸃ ⸀πάντα, ὅτι ⸀Ἰησοῦς λαὸν ἐκ γῆς Αἰγύπτου σώσας τὸ δεύτερον τοὺς μὴ πιστεύσαντας ἀπώλεσεν,
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/005.yaml
  text: I want to remind you[a], though you know all things once for all, that Jesus, having saved a people out of the land of Egypt, afterward destroyed those who did not believe.
translation:
  language: fr
  text: Je veux vous rappeler, bien que vous sachiez tout cela une fois pour toutes, que Jésus[a], après avoir sauvé un peuple en le faisant sortir du pays d’Égypte, a ensuite détruit ceux qui n’ont pas cru.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Certains manuscrits portent « le Seigneur » ou « Dieu » au lieu de « Jésus ».
    reason: textual_variant
lexical_decisions:
- source_word: Ὑπομνῆσαι … βούλομαι
  choice: Je veux vous rappeler
  rationale: La construction exprime clairement la volonté de remettre en mémoire une vérité déjà connue. Cette formulation est naturelle en français moderne et n’ajoute aucun marqueur temporel absent du grec.
- source_word: εἰδότας ὑμᾶς ἅπαξ πάντα
  choice: bien que vous sachiez tout cela une fois pour toutes
  rationale: Le participe est compris dans un sens concessif. « Tout cela » donne à πάντα sa portée contextuelle, tandis que « une fois pour toutes » rend la force de ἅπαξ sans la réduire à « autrefois ».
- source_word: Ἰησοῦς
  choice: Jésus
  rationale: Le texte grec fourni porte explicitement Ἰησοῦς. La traduction conserve cette lecture et sa portée christologique sans l’harmoniser avec les variantes.
- source_word: λαὸν
  choice: un peuple
  rationale: L’expression rend directement le nom anarthre et désigne collectivement le peuple délivré, sans ajouter une précision absente du texte.
- source_word: ἐκ γῆς Αἰγύπτου σώσας
  choice: après avoir sauvé un peuple en le faisant sortir du pays d’Égypte
  rationale: Cette formulation française explicite naturellement le rapport entre le salut du peuple et sa sortie d’Égypte, tout en conservant l’écho biblique de « pays d’Égypte » et l’antériorité du participe aoriste.
- source_word: τὸ δεύτερον
  choice: ensuite
  rationale: Dans ce contexte, l’expression marque l’action qui vient après la délivrance. « Ensuite » rend cette succession sans le littéralisme obscur de « la deuxième fois ».
- source_word: τοὺς μὴ πιστεύσαντας
  choice: ceux qui n’ont pas cru
  rationale: Cette traduction directe conserve le caractère verbal du participe et la formulation habituelle de l’incrédulité en français biblique courant.
- source_word: ἀπώλεσεν
  choice: a détruit
  rationale: Le verbe exprime ici avec force le jugement infligé à la génération incrédule. « Détruit » en conserve la gravité.
theological_decisions:
- issue: Sujet christologique de l’exode
  choice: Jésus dans le texte principal
  alternative: le Seigneur ou Dieu
  rationale: La source SBLGNT fournie lit Ἰησοῦς. La traduction doit préserver cette affirmation christologique marquée; les autres leçons manuscrites sont signalées en note plutôt que substituées au texte source.
- issue: Portée de πάντα
  choice: tout cela
  alternative: toutes choses / tout
  rationale: Dans le contexte, Jude renvoie à l’ensemble des faits de l’histoire du salut qu’il va rappeler. « Tout cela » conserve une portée large mais contextuelle, sans suggérer que les lecteurs possèdent une connaissance universelle.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve le contraste entre le salut initial et le jugement ultérieur, ainsi que la lecture christologique frappante du texte grec. Le gérondif lourd a été évité au profit de « après avoir sauvé », plus naturel en français.
