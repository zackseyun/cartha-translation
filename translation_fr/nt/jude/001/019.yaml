  variant: modern international French
source:
  edition: SBLGNT
  text: οὗτοί εἰσιν οἱ ἀποδιορίζοντες, ψυχικοί, πνεῦμα μὴ ἔχοντες.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/019.yaml
  text: These are the ones who cause divisions[a], worldly people[c][b], not having the Spirit.
translation:
  language: fr
  text: Ce sont eux qui provoquent des divisions[a], qui vivent selon leur seule nature humaine[b] et qui n’ont pas l’Esprit[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qui se séparent » ou « qui créent des divisions ».
    reason: lexical_alternative
  - marker: b
    text: Ou « dépourvus de spiritualité » ou « des êtres naturels ».
    reason: lexical_alternative
  - marker: c
    text: Ou « l’esprit » ; dans ce contexte, il s’agit très probablement de l’Esprit Saint.
    reason: alternative_reading
lexical_decisions:
- source_word: οὗτοί
  choice: Ce sont ceux
  rationale: Le démonstratif renvoie aux personnes dénoncées dans le contexte et garde ici sa force désignative dans une tournure française naturelle.
- source_word: οἱ ἀποδιορίζοντες
  choice: ceux qui provoquent des divisions
  rationale: Le participe caractérise ces personnes par leur action schismatique. Cette formulation exprime le sens actif le plus probable, tout en signalant en note la possibilité qu’elles se mettent elles-mêmes à part.
- source_word: ψυχικοί
  choice: des êtres livrés à leur nature humaine
  rationale: Le terme désigne ici des personnes limitées à la vie purement naturelle, par contraste avec l’Esprit. La formulation reste compréhensible sans réduire ψυχικοί à une simple mondanité morale.
- source_word: πνεῦμα
  choice: l’Esprit
  rationale: Dans le contraste immédiat avec ψυχικοί, le référent le plus probable est l’Esprit Saint. La majuscule rend cette lecture, tandis que l’autre possibilité est conservée en note.
- source_word: μὴ ἔχοντες
  choice: qui n’ont pas
  rationale: Cette proposition relative transpose naturellement le participe négatif grec et maintient son lien descriptif avec les personnes visées.
theological_decisions:
- issue: Référent de πνεῦμα
  choice: l’Esprit Saint
  alternative: l’esprit
  rationale: Le contraste entre ψυχικοί et πνεῦμα favorise fortement une référence à l’Esprit Saint, sans que la forme grecque exclue absolument le sens non défini « esprit »; cette ambiguïté est donc préservée en note.
- issue: Portée de ψυχικοί
  choice: personnes livrées à leur seule nature humaine
  alternative: personnes dépourvues de spiritualité / êtres naturels
  rationale: Le choix principal fait ressortir l’opposition entre la vie purement humaine et l’Esprit sans introduire une anthropologie confessionnelle précise; les équivalents plus littéraux sont indiqués en note.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la série descriptive du grec tout en employant des relatives idiomatiques. « Êtres livrés à leur nature humaine » évite l’ambiguïté moderne de « psychiques » et le caractère potentiellement réducteur de « mondains ».
