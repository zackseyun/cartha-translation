  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ οὓς μὲν ⸀ἐλεᾶτε ⸂διακρινομένους,
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/022.yaml
  text: And have mercy on those who are doubting,[a]
translation:
  language: fr
  text: Ayez aussi compassion de ceux qui doutent[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ceux qui hésitent »; peut-être « ceux qui contestent ». Le participe grec peut prendre plusieurs nuances dans ce contexte.
    reason: Alternative lexicale préservant l’ambiguïté de διακρινομένους.
lexical_decisions:
- source_word: καὶ
  choice: aussi
  rationale: Dans cette suite d’exhortations, καί relie la proposition à ce qui précède. « Aussi » rend naturellement cette continuité en français.
- source_word: οὓς μὲν
  choice: ceux
  rationale: Le pronom relatif accusatif avec μέν introduit un premier groupe dans une série. Le français n’a pas besoin d’expliciter « d’une part » ici; « ceux » conserve naturellement la relation avec les groupes suivants.
- source_word: ἐλεᾶτε
  choice: ayez compassion de
  rationale: L’impératif de ἐλεάω appelle à manifester miséricorde et compassion. « Ayez compassion de » est clair, actuel et approprié à une exhortation pastorale.
- source_word: διακρινομένους
  choice: qui doutent
  rationale: Le participe peut évoquer le doute, l’hésitation ou la contestation. Dans ce contexte, « qui doutent » présente ces personnes comme incertaines et explique naturellement l’appel à la compassion, sans masquer les autres nuances possibles, signalées en note.
theological_decisions:
- issue: Sens de διακρινομένους dans l’exhortation à secourir des personnes mises en danger
  choice: ceux qui doutent
  alternative: ceux qui hésitent; ceux qui contestent
  rationale: Le contexte distingue plusieurs groupes appelant des réponses différentes. « Ceux qui doutent » convient bien à un groupe spirituellement incertain plutôt qu’ouvertement hostile. La note préserve toutefois l’ambiguïté réelle du grec sans imposer cette lecture comme seule possibilité.
translation_notes:
  register: Français international moderne, simple et digne. L’impératif pluriel « Ayez » conserve l’adresse communautaire; « compassion » exprime ici la miséricorde active sans coloration confessionnelle particulière.
