id: JUD.1.15
reference: Jude 1:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ποιῆσαι κρίσιν κατὰ πάντων καὶ ἐλέγξαι ⸂πάντας τοὺς ἀσεβεῖς⸃ περὶ πάντων τῶν ἔργων ἀσεβείας αὐτῶν ὧν ἠσέβησαν καὶ περὶ πάντων τῶν σκληρῶν ὧν ἐλάλησαν κατ’ αὐτοῦ ἁμαρτωλοὶ ἀσεβεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/015.yaml
  text: to execute judgment against all and to convict all the ungodly concerning all their ungodly deeds that they committed in ungodliness[c][b][a], and concerning all the harsh things that ungodly sinners have spoken against him.
translation:
  language: fr
  text: pour exercer le jugement contre tous et établir la culpabilité[a] de tous les impies au sujet de tous les actes d’impiété qu’ils ont commis dans leur impiété, et au sujet de toutes les paroles dures[b] que ces pécheurs impies ont prononcées contre lui[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « confondre » ou « convaincre de culpabilité ». Le verbe grec peut désigner la mise en lumière d’une faute ; ici, il s’inscrit dans un contexte judiciaire avec « exercer le jugement ».
    reason: lexical_alternative
  - marker: b
    text: Ou « toutes les choses dures ». Dans ce contexte, le grec désigne probablement des paroles dures, provocantes ou insolentes.
    reason: lexical_alternative
  - marker: c
    text: Dans le contexte, « lui » renvoie au Seigneur mentionné au verset précédent.
    reason: cross_reference
lexical_decisions:
- source_word: ποιῆσαι κρίσιν
  choice: exercer le jugement
  rationale: L’expression désigne l’accomplissement effectif d’un jugement. « Exercer le jugement » est idiomatique en français, conserve le sens judiciaire et convient au contexte eschatologique.
- source_word: κατὰ πάντων
  choice: contre tous
  rationale: Avec le génitif, κατά prend ici un sens adversatif et judiciaire. « Contre tous » rend clairement la portée du jugement.
- source_word: ἐλέγξαι
  choice: établir la culpabilité
  rationale: 'Dans ce contexte judiciaire, le verbe ne désigne pas seulement une réprimande : il implique la mise en lumière de la faute et la démonstration de la culpabilité.'
- source_word: πάντας τοὺς ἀσεβεῖς
  choice: tous les impies
  rationale: Le groupe adjectival substantivé est rendu de manière concise, tout en maintenant le lien lexical avec « impiété » dans la suite du verset.
- source_word: περὶ πάντων τῶν ἔργων ἀσεβείας αὐτῶν
  choice: au sujet de tous les actes d’impiété
  rationale: Cette formulation française naturelle conserve le caractère moral et religieux du génitif ἀσεβείας sans l’aplatir en simple méchanceté.
- source_word: ὧν ἠσέβησαν
  choice: qu’ils ont commis dans leur impiété
  rationale: La tournure préserve autant que possible la répétition insistante de la famille ἀσεβ-, tout en restant compréhensible en français moderne.
- source_word: σκληρῶν
  choice: paroles dures
  rationale: Dans le contexte du verbe « prononcer », le substantif implicite peut naturellement être rendu par « paroles ». « Dures » conserve l’image de base et peut englober des propos sévères, hostiles ou insolents.
- source_word: ἐλάλησαν κατ’ αὐτοῦ
  choice: ont prononcées contre lui
  rationale: Le passé composé rend naturellement les actes accomplis dénoncés ici, tandis que « contre lui » reflète le sens adversatif de κατά avec le génitif.
- source_word: ἁμαρτωλοὶ ἀσεβεῖς
  choice: pécheurs impies
  rationale: Les deux qualificatifs sont conservés dans leur ordre grec afin de maintenir l’emphase finale et la répétition du thème de l’impiété.
theological_decisions:
- issue: Référent de αὐτοῦ dans « contre lui »
  choice: Conserver le pronom « lui » dans le texte principal.
  alternative: « contre le Seigneur » ou « contre Dieu »
  rationale: Le verset précédent fournit contextuellement le Seigneur comme référent, mais le grec emploie un pronom. Le conserver évite de préciser davantage que le texte source.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve l’accumulation judiciaire du grec ainsi que la répétition emphatique d’« impies » et d’« impiété », sans rendre la phrase artificiellement littérale.
