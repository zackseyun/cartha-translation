id: JUD.1.25
reference: Jude 1:25
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸀μόνῳ θεῷ σωτῆρι ἡμῶν ⸂διὰ Ἰησοῦ Χριστοῦ τοῦ κυρίου ἡμῶν⸃ ⸀δόξα μεγαλωσύνη κράτος καὶ ἐξουσία ⸂πρὸ παντὸς τοῦ αἰῶνος⸃ καὶ νῦν καὶ εἰς πάντας τοὺς αἰῶνας· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/025.yaml
  text: to the only God our Savior[a], through Jesus the Messiah our Lord, be glory, majesty, dominion, and authority, before all time and now and forever[b]. Amen.
translation:
  language: fr
  text: au Dieu unique, notre Sauveur, par Jésus le Messie, notre Seigneur, soient gloire, majesté, puissance et autorité, avant tous les temps, maintenant et pour tous les siècles[a] ! Amen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « avant tout siècle […] et pour tous les siècles ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: μόνῳ θεῷ σωτῆρι ἡμῶν
  choice: au Dieu unique, notre Sauveur
  rationale: Le datif s’inscrit dans la formule doxologique sous-entendue « soient à ». « Dieu unique » exprime naturellement en français l’exclusivité marquée par μόνῳ, tandis que « notre Sauveur » est le rendu usuel de σωτῆρι ἡμῶν.
- source_word: διὰ Ἰησοῦ Χριστοῦ τοῦ κυρίου ἡμῶν
  choice: par Jésus le Messie, notre Seigneur
  rationale: Avec le génitif, διά marque ici la médiation. « Par » convient à une doxologie française. Χριστός est conservé comme titre par « le Messie », et τοῦ κυρίου ἡμῶν est rendu en apposition.
- source_word: δόξα μεγαλωσύνη κράτος καὶ ἐξουσία
  choice: gloire, majesté, puissance et autorité
  rationale: « Gloire » et « majesté » correspondent au registre élevé de la doxologie. « Puissance » rend κράτος comme force souveraine effectivement exercée, tandis qu’« autorité » distingue ἐξουσία comme droit ou pouvoir légitime.
- source_word: πρὸ παντὸς τοῦ αἰῶνος
  choice: avant tous les temps
  rationale: Cette formulation française naturelle rend la portée antérieure à toute époque sans imposer une précision métaphysique que l’expression grecque ne développe pas.
- source_word: καὶ νῦν καὶ εἰς πάντας τοὺς αἰῶνας
  choice: maintenant et pour tous les siècles
  rationale: Le rendu conserve le déploiement temporel du grec et l’image répétée des αἰῶνες, tout en restant idiomatique dans une doxologie française.
theological_decisions:
- issue: Rattachement de la formule de médiation dans la doxologie
  choice: La louange est adressée au Dieu unique, notre Sauveur, par Jésus le Messie, notre Seigneur.
  alternative: Comprendre la formule comme plus lâchement rattachée à l’ensemble de la doxologie.
  rationale: La syntaxe rattache le plus naturellement διὰ Ἰησοῦ Χριστοῦ à l’attribution de la gloire à Dieu. La traduction préserve ainsi à la fois le destinataire de la doxologie et la médiation de Jésus, sans les confondre.
- issue: Valeur de Χριστός
  choice: le Messie
  alternative: le Christ
  rationale: Dans ce contexte, Χριστός demeure intelligible comme titre. « Le Messie » en explicite le sens plutôt que de le traiter comme un simple élément de nom.
- issue: Valeur temporelle de πρὸ παντὸς τοῦ αἰῶνος
  choice: avant tous les temps
  alternative: avant tout siècle
  rationale: Le choix communique l’antériorité absolue suggérée par la formule tout en conservant en note son expression plus littérale en termes de siècles ou d’âges.
translation_notes:
  register: Français international moderne, solennel sans archaïsme. La structure doxologique est conservée avec l’inversion « soient gloire… ». « Puissance » et « autorité » maintiennent la distinction entre κράτος et ἐξουσία.
