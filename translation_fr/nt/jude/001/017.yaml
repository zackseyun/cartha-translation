id: JUD.1.17
reference: Jude 1:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ὑμεῖς δέ, ἀγαπητοί, μνήσθητε τῶν ῥημάτων τῶν προειρημένων ὑπὸ τῶν ἀποστόλων τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/017.yaml
  text: But you[a], beloved, remember the words spoken beforehand by the apostles of our Lord Jesus the Messiah.
translation:
  language: fr
  text: Mais vous, bien-aimés, souvenez-vous des paroles prononcées auparavant par les apôtres de notre Seigneur Jésus, le Messie.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Jésus-Christ ».'
    reason: Alternative traditionnelle pour rendre Ἰησοῦ Χριστοῦ.
lexical_decisions:
- source_word: Ὑμεῖς δέ
  choice: Mais vous
  rationale: Conserve à la fois le contraste marqué par δέ et l’emphase du pronom Ὑμεῖς, tout en restant naturel en français.
- source_word: ἀγαπητοί
  choice: bien-aimés
  rationale: Rend l’apostrophe affectueuse dans un registre épistolaire digne et courant dans le texte biblique.
- source_word: μνήσθητε
  choice: souvenez-vous
  rationale: Traduit directement l’impératif aoriste invitant les destinataires à rappeler à leur mémoire un enseignement antérieur.
- source_word: τῶν ῥημάτων
  choice: des paroles
  rationale: « Paroles » désigne naturellement ici des propos énoncés et s’accorde avec le participe qui suit.
- source_word: τῶν προειρημένων
  choice: prononcées autrefois
  rationale: Exprime l’antériorité de ces paroles sans imposer le sens plus étroit de prédictions prophétiques que pourrait suggérer « annoncées d’avance ».
- source_word: ὑπὸ τῶν ἀποστόλων
  choice: par les apôtres
  rationale: Équivalent français établi, approprié aux témoins et envoyés autorisés de Jésus.
- source_word: τοῦ κυρίου ἡμῶν
  choice: de notre Seigneur
  rationale: Rend le génitif et le titre κύριος de façon classique, claire et théologiquement non réductrice.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jésus, le Messie
  rationale: Rend Χριστός comme le titre « Messie » et ajoute la ponctuation ainsi que l’article nécessaires à un français idiomatique.
theological_decisions:
- issue: Valeur de Χριστοῦ dans Ἰησοῦ Χριστοῦ
  choice: Jésus, le Messie
  alternative: Jésus-Christ
  rationale: Le grec peut être entendu comme un titre messianique ou comme une désignation devenue proche d’un nom composé. Le texte principal explicite le titre, tandis que la note conserve la formulation française traditionnelle.
- issue: Portée de προειρημένων
  choice: paroles prononcées autrefois
  alternative: paroles annoncées d’avance
  rationale: Le contexte vise les avertissements apostoliques déjà formulés; la traduction choisie préserve la priorité temporelle sans décider qu’il s’agit nécessairement de prédictions au sens strict.
translation_notes:
  register: Français international moderne, clair et digne. « Bien-aimés » maintient la chaleur de l’adresse apostolique; « prononcées autrefois » évite une tournure lourde tout en préservant l’antériorité indiquée par le grec.
