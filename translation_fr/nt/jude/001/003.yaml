id: JUD.1.3
reference: Jude 1:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἀγαπητοί, πᾶσαν σπουδὴν ποιούμενος γράφειν ὑμῖν περὶ τῆς κοινῆς ⸀ἡμῶν σωτηρίας ἀνάγκην ἔσχον γράψαι ὑμῖν παρακαλῶν ἐπαγωνίζεσθαι τῇ ἅπαξ παραδοθείσῃ τοῖς ἁγίοις πίστει.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/003.yaml
  text: Beloved[a], although I was making every effort to write to you about our common salvation, I found it necessary to write[d][c][b], urging you to contend earnestly for the faith once for all delivered to the saints.
translation:
  language: fr
  text: Bien-aimés, alors que je mettais tout mon empressement à vous écrire au sujet du salut que nous partageons, j’ai jugé nécessaire de vous écrire pour vous exhorter à lutter avec ardeur pour la foi[a] transmise[b] une fois pour toutes aux saints[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ici, « la foi » désigne vraisemblablement l’ensemble de la foi chrétienne confiée aux croyants, et non seulement l’acte personnel de croire.
    reason: alternative_reading
  - marker: b
    text: Ou « remise » ou « confiée ». Le verbe peut souligner le fait de transmettre un enseignement reçu.
    reason: lexical_alternative
  - marker: c
    text: Les « saints » sont ici ceux qui appartiennent à Dieu, c’est-à-dire son peuple croyant; il ne s’agit pas seulement de personnes ultérieurement canonisées.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀγαπητοί
  choice: Bien-aimés
  rationale: Cette apostrophe conserve la chaleur pastorale du terme et son lien explicite avec l’amour, dans un registre digne et courant dans le texte biblique.
- source_word: πᾶσαν σπουδὴν ποιούμενος
  choice: alors que je mettais tout mon empressement
  rationale: L’expression idiomatique indique un vif empressement. « Alors que » laisse percevoir le contraste contextuel avec la nécessité qui a ensuite déterminé le contenu de la lettre.
- source_word: περὶ τῆς κοινῆς ἡμῶν σωτηρίας
  choice: au sujet du salut que nous partageons
  rationale: Cette formulation naturelle rend κοινῆς et maintient l’accent communautaire sans préciser davantage la nature de ce partage.
- source_word: ἀνάγκην ἔσχον
  choice: j’ai jugé nécessaire
  rationale: Rend naturellement une nécessité imposée par la situation sans donner au verbe la force excessive de « j’ai été contraint ».
- source_word: παρακαλῶν
  choice: pour vous exhorter
  rationale: Dans ce contexte, le participe exprime le but ou le contenu pressant de la lettre. « Exhorter » convient au registre pastoral sérieux.
- source_word: ἐπαγωνίζεσθαι
  choice: lutter avec ardeur
  rationale: Le verbe composé a une valeur intensive. Cette expression conserve l’idée d’un engagement énergique sans imposer une image exclusivement militaire.
- source_word: τῇ ... πίστει
  choice: pour la foi
  rationale: Le contexte de quelque chose transmis aux croyants indique surtout ici le contenu de la foi chrétienne, tout en conservant le terme théologique traditionnel.
- source_word: ἅπαξ
  choice: une fois pour toutes
  rationale: Cette expression rend la valeur définitive et non répétée que l’adverbe porte naturellement dans ce contexte.
- source_word: παραδοθείσῃ
  choice: transmise
  rationale: Le participe passif désigne ici la remise ou la transmission de ce qui a été confié à la communauté. « Transmise » est naturel en français et met en évidence cette communication sans préciser indûment ses modalités.
- source_word: τοῖς ἁγίοις
  choice: aux saints
  rationale: Le terme établi conserve la désignation collective des croyants comme personnes mises à part pour Dieu; une note prévient le sens moderne plus restreint de personnes canonisées.
theological_decisions:
- issue: Sens de « la foi » (πίστις)
  choice: Le contenu de la foi chrétienne confié à la communauté
  alternative: La confiance ou l’acte personnel de croire
  rationale: La proposition « transmise une fois pour toutes aux saints » favorise nettement le sens objectif d’un enseignement ou d’une confession reçue, sans qu’il soit nécessaire d’y importer une formulation confessionnelle postérieure.
- issue: Portée de ἅπαξ παραδοθείσῃ
  choice: Une transmission définitive, effectuée une fois pour toutes
  alternative: Une transmission effectuée simplement « une fois »
  rationale: Dans cette construction, ἅπαξ souligne naturellement le caractère unique et décisif de la transmission; « une fois pour toutes » exprime cette force sans développer ce que le texte ne précise pas.
- issue: Référent de τοῖς ἁγίοις
  choice: L’ensemble du peuple croyant consacré à Dieu
  alternative: Un groupe restreint de personnes reconnues ultérieurement comme saintes
  rationale: Dans l’usage chrétien ancien, le pluriel désigne collectivement les croyants comme peuple saint, et non une catégorie canonisée.
translation_notes:
  register: Français international moderne, chaleureux et digne. La répétition de « vous écrire » est conservée parce qu’elle correspond à celle du grec et reste naturelle en français. Le mouvement de la phrase oppose avec mesure le projet initial de Jude à la nécessité qui a déterminé son exhortation.
