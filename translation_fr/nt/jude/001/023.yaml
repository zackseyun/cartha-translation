id: JUD.1.23
reference: Jude 1:23
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὓς δὲ σῴζετε ἐκ πυρὸς ἁρπάζοντες, οὓς δὲ ἐλεᾶτε ἐν φόβῳ⸃, μισοῦντες καὶ τὸν ἀπὸ τῆς σαρκὸς ἐσπιλωμένον χιτῶνα.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/023.yaml
  text: save others by snatching them out of the fire[a]; and have mercy on others with fear[d][c][b], hating even the tunic stained by the flesh.
translation:
  language: fr
  text: Quant aux autres, sauvez-les en les arrachant au feu[a] ; quant aux autres encore, ayez pitié d’eux avec crainte[b], tout en détestant même la tunique souillée par la chair[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’image peut évoquer le jugement imminent ou un grave danger spirituel, sans que le texte en précise le référent.
    reason: ambiguïté_interprétative
  - marker: b
    text: « Avec crainte » peut désigner la crainte révérencielle devant Dieu ou une prudence vigilante, de peur d’être soi-même entraîné dans la corruption.
    reason: alternative_lexicale
  - marker: c
    text: 'Ou : « la tunique souillée par la nature pécheresse ». Grec : « chair ».'
    reason: alternative_lexicale
lexical_decisions:
- source_word: σῴζετε
  choice: sauvez-les
  rationale: L’impératif « sauvez » conserve la portée forte de σῴζω, tandis que le pronom explicite son complément en français. L’image qui suit précise qu’il s’agit d’une intervention urgente.
- source_word: ἐκ πυρὸς ἁρπάζοντες
  choice: en les arrachant au feu
  rationale: Le participe indique la manière de sauver. « Arracher » restitue l’action énergique et urgente de ἁρπάζω ; « au feu » est l’expression française naturelle pour rendre l’éloignement d’un danger.
- source_word: ἐλεᾶτε
  choice: ayez pitié d’eux
  rationale: Cette formulation courante et digne rend directement l’impératif et garde l’accent sur une compassion active envers les personnes visées.
- source_word: ἐν φόβῳ
  choice: avec crainte
  rationale: La traduction littérale préserve l’ambiguïté entre la crainte révérencielle devant Dieu et la prudence face au risque d’être soi-même contaminé.
- source_word: μισοῦντες
  choice: tout en détestant
  rationale: Le participe exprime une attitude qui accompagne la compassion. « Tout en » fait ressortir la tension voulue entre la pitié envers les personnes et le rejet de ce qui souille.
- source_word: χιτῶνα
  choice: tunique
  rationale: χιτών désigne précisément un vêtement porté près du corps. « Tunique » conserve cette image concrète sans la moderniser abusivement.
- source_word: ἐσπιλωμένον
  choice: souillée
  rationale: Le participe parfait passif décrit le vêtement comme se trouvant dans un état de souillure. « Souillée » porte à la fois le sens matériel de la métaphore et sa portée morale.
- source_word: σάρξ
  choice: chair
  rationale: « Chair » reproduit le terme et l’image de la source, sans imposer l’interprétation plus systématique de « nature pécheresse ».
theological_decisions:
- issue: Sens du « feu » dans l’image du sauvetage
  choice: Conserver simplement l’image du feu dans le texte principal.
  alternative: Préciser qu’il s’agit du jugement à venir, de l’enfer ou d’un grave danger spirituel présent.
  rationale: Le référent du feu n’est pas explicité. La formulation garde donc ensemble l’urgence du salut et l’ouverture interprétative de l’image.
- issue: Sens de σάρξ dans la tunique souillée
  choice: Traduire par « chair ».
  alternative: Traduire par « nature pécheresse ».
  rationale: Le contexte évoque une contamination morale, mais « chair » préserve la métaphore corporelle et évite d’introduire dans le texte une explication théologique plus étroite.
- issue: Rapport entre la compassion et la haine
  choice: Présenter simultanément la pitié envers les personnes et la détestation de la souillure.
  alternative: Atténuer « détester » ou l’appliquer implicitement aux personnes.
  rationale: La syntaxe distingue l’objet de la compassion de la tunique souillée qui doit être détestée. La traduction maintient la vigueur et la tension éthique du grec.
translation_notes:
  register: Français international moderne, naturel et digne. La reprise « quant aux autres… quant aux autres encore » rend la structure distributive répétée de οὓς δέ. Le vocabulaire concret (« feu », « tunique », « chair ») conserve les images vigoureuses de la source, tandis que « tout en » clarifie en français la coexistence de la compassion et du rejet de la souillure.
