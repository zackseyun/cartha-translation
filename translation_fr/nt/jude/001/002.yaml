id: JUD.1.2
reference: Jude 1:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἔλεος ὑμῖν καὶ εἰρήνη καὶ ἀγάπη πληθυνθείη.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/002.yaml
  text: May mercy and peace and love be multiplied to you[a].
translation:
  language: fr
  text: Que la miséricorde, la paix et l’amour vous soient multipliés[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « soient augmentés pour vous » ou « abondent pour vous ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεος
  choice: compassion
  rationale: « Compassion » exprime naturellement en français moderne la bienveillance miséricordieuse désignée par ἔλεος, tandis que « miséricorde » serait plus traditionnel mais moins courant.
- source_word: ὑμῖν
  choice: vous soient accordés
  rationale: Le datif bénéficiaire est intégré à la tournure française de souhait; « vous » conserve la destination de la bénédiction.
- source_word: εἰρήνη
  choice: paix
  rationale: « Paix » est l’équivalent établi et conserve les résonances relationnelles, spirituelles et de bien-être du terme grec.
- source_word: ἀγάπη
  choice: amour
  rationale: « Amour » est le terme moderne normal et garde toute l’étendue de ἀγάπη sans recourir à l’archaïque « charité ».
- source_word: πληθυνθείη
  choice: soient accordés en abondance
  rationale: Cette formule française rend l’optatif passif de souhait et l’idée d’une abondante augmentation, sans l’expression peu idiomatique « vous soient multipliés ».
- source_word: καὶ ... καὶ ... καὶ
  choice: la compassion, la paix et l’amour
  rationale: L’énumération française naturelle omet la première conjonction; le rythme solennel demeure grâce aux trois noms coordonnés.
theological_decisions:
- issue: Rendu de la formule de bénédiction à l’optatif
  choice: Que la compassion, la paix et l’amour vous soient accordés en abondance.
  alternative: Que la miséricorde, la paix et l’amour se multiplient pour vous.
  rationale: La construction avec « Que » exprime directement le souhait porté par l’optatif grec. « Accordés en abondance » respecte la voix passive et l’idée d’accroissement, sans préciser qui les accorde ni résoudre une éventuelle implication théologique.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation privilégie une bénédiction idiomatique tout en conservant l’optatif, la voix passive et l’image d’abondance du grec.
