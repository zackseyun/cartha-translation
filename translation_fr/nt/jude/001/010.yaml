id: JUD.1.10
reference: Jude 1:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὗτοι δὲ ὅσα μὲν οὐκ οἴδασιν βλασφημοῦσιν, ὅσα δὲ φυσικῶς ὡς τὰ ἄλογα ζῷα ἐπίστανται, ἐν τούτοις φθείρονται.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/010.yaml
  text: But these people slander whatever they do not understand[a], and whatever they understand naturally, like irrational animals[c][b], by these things they are corrupted.
translation:
  language: fr
  text: Mais ces gens dénigrent tout ce qu’ils ne comprennent pas[a] ; quant à tout ce qu’ils connaissent instinctivement, comme des animaux sans raison, c’est en cela qu’ils se corrompent[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « tout ce qu’ils ne connaissent pas » ; le verbe peut désigner la connaissance aussi bien que la compréhension.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « c’est par ces choses qu’ils sont détruits ».'
    reason: lexical_and_grammatical_alternative
lexical_decisions:
- source_word: οὗτοι
  choice: ces gens
  rationale: Le démonstratif désigne les intrus dénoncés dans le contexte. « Ces gens » explicite naturellement le référent sans introduire une précision masculine absente du terme grec.
- source_word: βλασφημοῦσιν
  choice: insultent
  rationale: Le verbe exprime ici une parole outrageante contre ce que ces personnes ne comprennent pas. « Insultent » garde la gravité de l’accusation sans limiter le sens au blasphème directement dirigé contre Dieu.
- source_word: ὅσα μὲν οὐκ οἴδασιν
  choice: tout ce qu’ils ne comprennent pas
  rationale: Dans l’opposition avec une connaissance instinctive, οἴδασιν vise ici davantage la compréhension que la simple possession d’une information.
- source_word: φυσικῶς
  choice: instinctivement
  rationale: La comparaison immédiate avec les animaux montre qu’il s’agit d’une connaissance naturelle non raisonnée. « Instinctivement » rend cette nuance clairement en français courant.
- source_word: τὰ ἄλογα ζῷα
  choice: des animaux dépourvus de raison
  rationale: Cette formulation restitue le sens de ἄλογα, « sans raison », dans un français naturel et digne, sans recourir à l’expression péjorative et vieillie « bêtes brutes ».
- source_word: ἐπίστανται
  choice: connaissent
  rationale: Le verbe désigne ce dont ils ont une connaissance immédiate ou instinctive. « Connaissent » maintient une légère distinction avec « comprennent » dans la première proposition.
- source_word: ἐν τούτοις
  choice: par ces choses
  rationale: 'La préposition ἐν peut avoir ici une valeur instrumentale : les réalités qu’ils ne connaissent qu’instinctivement deviennent le moyen ou le domaine de leur ruine. La traduction conserve explicitement le pluriel du grec.'
- source_word: φθείρονται
  choice: courent à leur perte
  rationale: Le verbe peut exprimer à la fois la corruption et la destruction. Cette formulation française naturelle met en relief l’issue funeste sans exclure le processus de corruption morale.
theological_decisions:
- issue: Portée de βλασφημοῦσιν lorsque l’objet n’est pas explicitement divin
  choice: « insultent »
  alternative: « blasphèment » ou « dénigrent »
  rationale: Le texte condamne des paroles outrageantes au sujet de réalités incomprises, sans préciser qu’elles sont directement adressées à Dieu. « Insultent » évite donc de restreindre indûment la portée du verbe.
- issue: Nuance de φθείρονται
  choice: « courent à leur perte »
  alternative: « se corrompent » ou « sont détruits »
  rationale: La forme grecque et le contexte permettent d’entendre à la fois une corruption et une ruine résultante. La traduction principale préserve cette tension en exprimant l’issue sans définir précisément s’il s’agit d’un processus moral, d’un jugement destructeur, ou des deux.
translation_notes:
  register: Français international moderne, courant et digne. La phrase conserve le contraste rhétorique du grec entre ce qu’ils ne comprennent pas et ce qu’ils connaissent seulement par instinct. « Quant à » rend clairement l’opposition μὲν… δὲ, tandis que « précisément » souligne que les mêmes réalités deviennent le lieu ou le moyen de leur ruine.
