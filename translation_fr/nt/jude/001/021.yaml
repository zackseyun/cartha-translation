id: JUD.1.21
reference: Jude 1:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἑαυτοὺς ἐν ἀγάπῃ θεοῦ τηρήσατε προσδεχόμενοι τὸ ἔλεος τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ εἰς ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/021.yaml
  text: keep yourselves in the love of God[c][b][a], waiting for the mercy of our Lord Jesus the Messiah unto eternal life.
translation:
  language: fr
  text: maintenez-vous dans l’amour de Dieu[a], en attendant la miséricorde de notre Seigneur Jésus le Messie, en vue de la vie éternelle[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression grecque peut désigner l’amour de Dieu pour les croyants ou l’amour des croyants pour Dieu.
    reason: alternative_reading
  - marker: b
    text: Ou « jusqu’à la vie éternelle » ou « pour la vie éternelle ».
    reason: lexical_alternative
lexical_decisions:
- source_word: τηρήσατε
  choice: maintenez-vous
  rationale: L’impératif aoriste appelle directement les destinataires à demeurer dans une situation donnée. « Maintenez-vous » est naturel en français et évite l’ambiguïté de « gardez-vous », qui peut signifier « prenez garde ».
- source_word: ἐν ἀγάπῃ θεοῦ
  choice: dans l’amour de Dieu
  rationale: Cette formulation française conserve le génitif grec sans décider s’il désigne principalement l’amour venant de Dieu ou l’amour dirigé vers Dieu.
- source_word: προσδεχόμενοι
  choice: en attendant
  rationale: Le participe présent exprime une attitude continue qui accompagne l’exhortation principale. « En attendant » communique naturellement cette attente confiante sans ajouter une intensité absente du texte.
- source_word: ἔλεος
  choice: miséricorde
  rationale: Terme français courant dans le registre biblique, il exprime la compassion bienveillante accordée à celui qui est dans le besoin.
- source_word: κυρίου
  choice: Seigneur
  rationale: Rendu usuel de κύριος dans ce contexte christologique.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jésus le Messie
  rationale: Χριστός conserve ici sa valeur de titre. « Le Messie » en donne le sens en français actuel plutôt que de simplement translittérer le terme grec.
- source_word: εἰς ζωὴν αἰώνιον
  choice: en vue de la vie éternelle
  rationale: La préposition εἰς indique ici une orientation vers un but ou un aboutissement. « En vue de » préserve ce mouvement sans imposer une relation causale plus précise.
theological_decisions:
- issue: Sens du génitif dans ἀγάπῃ θεοῦ
  choice: Conserver l’expression « l’amour de Dieu »
  alternative: « l’amour que Dieu vous porte » ou « votre amour pour Dieu »
  rationale: Le génitif grec permet notamment une lecture subjective ou objective, et le contexte ne contraint pas à choisir entre elles. La traduction maintient donc cette tension.
- issue: Valeur de Χριστοῦ dans Ἰησοῦ Χριστοῦ
  choice: « Jésus le Messie »
  alternative: « Jésus-Christ »
  rationale: Traduire le titre rend explicite sa portée sémantique tout en évitant d’en faire un simple élément de nom propre.
- issue: Rapport exprimé par εἰς ζωὴν αἰώνιον
  choice: « en vue de la vie éternelle »
  alternative: « jusqu’à la vie éternelle » ou « pour la vie éternelle »
  rationale: La formule retenue exprime le but ou l’aboutissement tout en laissant ouverte la nuance exacte du lien entre la miséricorde attendue et la vie éternelle.
translation_notes:
  register: Français international moderne, sobre et digne. L’ordre et la structure participiale du grec sont conservés autant que le permet un français naturel. « Maintenez-vous » est préféré à « gardez-vous » afin d’éviter un contresens idiomatique.
