id: JUD.1.18
reference: Jude 1:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὅτι ἔλεγον ⸀ὑμῖν· ⸂Ἐπ’ ἐσχάτου χρόνου⸃ ἔσονται ἐμπαῖκται κατὰ τὰς ἑαυτῶν ἐπιθυμίας πορευόμενοι τῶν ἀσεβειῶν.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/018.yaml
  text: that they were saying to you[a], “In the last time there will be mockers[b], going according to their own ungodly desires.”
translation:
  language: fr
  text: 'Ils vous disaient : « Au temps de la fin[a], il y aura des moqueurs[b] qui vivront au gré de leurs propres désirs impies. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Dans le dernier temps » ou « À la fin des temps ». Le grec emploie « temps » au singulier, et non « jours ».
    reason: lexical_alternative
  - marker: b
    text: Ou « railleurs ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγον
  choice: ils vous disaient
  rationale: L’imparfait grec peut évoquer une parole répétée ou prolongée dans le passé ; l’imparfait français en conserve naturellement l’aspect.
- source_word: Ἐπ’ ἐσχάτου χρόνου
  choice: Dans le dernier temps
  rationale: Cette formulation conserve le singulier de χρόνος et la portée eschatologique de l’expression, sans l’harmoniser avec la formule plus courante « dans les derniers jours ».
- source_word: ἐμπαῖκται
  choice: des moqueurs
  rationale: « Moqueurs » est courant et rend clairement l’idée de personnes qui tournent en dérision ; « railleurs » reste une possibilité.
- source_word: κατὰ τὰς ἑαυτῶν ἐπιθυμίας
  choice: au gré de leurs propres désirs
  rationale: « Au gré de » exprime ici une conduite réglée par leurs désirs, dans un français naturel, tout en conservant l’insistance de ἑαυτῶν sur leurs désirs à eux.
- source_word: πορευόμενοι
  choice: qui vivront
  rationale: Le verbe de mouvement décrit métaphoriquement la manière de vivre. La proposition relative rend naturellement en français le participe grec rattaché aux moqueurs.
- source_word: τῶν ἀσεβειῶν
  choice: impies
  rationale: L’adjectif qualifie naturellement les désirs en français et conserve la condamnation religieuse et morale exprimée par ἀσέβεια, sans limiter ces désirs au domaine sexuel.
theological_decisions:
- issue: Expression eschatologique
  choice: Dans le dernier temps
  alternative: Au temps de la fin ; À la fin des temps ; Dans les derniers jours
  rationale: Le choix préserve le singulier « temps » propre au texte de Jude et sa tension eschatologique, sans l’assimiler à une formule biblique plus familière.
- issue: Caractérisation morale des désirs
  choice: leurs propres désirs impies
  alternative: leurs propres désirs marqués par l’impiété ; leurs propres convoitises impies
  rationale: La traduction maintient le jugement moral du texte sans réduire ἐπιθυμίαι à des convoitises sexuelles, puisque le terme grec a une portée plus large.
translation_notes:
  register: Français international moderne, digne et accessible. « Dans le dernier temps » est volontairement plus proche de la formulation grecque que l’expression française plus habituelle « dans les derniers temps » ; la note signale des rendus plus idiomatiques. « Vivre au gré de » restitue naturellement l’image grecque d’une conduite gouvernée par les désirs.
