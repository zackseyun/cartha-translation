id: JUD.1.1
reference: Jude 1:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἰούδας Ἰησοῦ Χριστοῦ δοῦλος, ἀδελφὸς δὲ Ἰακώβου, τοῖς ἐν θεῷ πατρὶ ⸀ἠγαπημένοις καὶ Ἰησοῦ Χριστῷ τετηρημένοις κλητοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/001.yaml
  text: 'Jude[a], a servant of Jesus the Messiah and brother of James, to those who are loved in God the Father and kept for Jesus the Messiah[c][b], called:'
translation:
  language: fr
  text: Jude, esclave de Jésus le Messie et frère de Jacques, à ceux qui sont aimés en Dieu le Père, gardés pour Jésus le Messie[a] et appelés[b] :[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « gardés par Jésus le Messie ». Le datif grec peut être compris comme indiquant l’agent (« par ») ou l’intérêt/la destination (« pour »).
    reason: alternative_reading
  - marker: b
    text: Ou « ceux qui sont appelés ».
    reason: alternative_rendering
  - marker: c
    text: Certains manuscrits portent « sanctifiés en Dieu le Père » au lieu de « aimés en Dieu le Père ».
    reason: textual_variant
lexical_decisions:
- source_word: Ἰούδας
  choice: Jude
  rationale: « Jude » est la forme française traditionnelle qui distingue l’auteur de Judas Iscariote, bien que le grec porte le même nom.
- source_word: δοῦλος
  choice: esclave
  rationale: Le terme désigne une personne appartenant à un maître et souligne ici l’entière dépendance et allégeance de Jude envers Jésus ; « serviteur » en atténuerait la force.
- source_word: Χριστοῦ / Χριστῷ
  choice: le Messie
  rationale: Χριστός est un titre signifiant « Messie » ou « Oint » ; la traduction en restitue le sens plutôt que de le traiter seulement comme un nom propre.
- source_word: ἀδελφὸς δὲ Ἰακώβου
  choice: et frère de Jacques
  rationale: δέ a ici une valeur de liaison légère, rendue naturellement par « et ». La tournure ne requiert pas l’article défini.
- source_word: ἐν θεῷ πατρὶ
  choice: en Dieu le Père
  rationale: Cette formulation conserve le sens de sphère ou de relation porté naturellement par ἐν, sans le convertir en indication d’agent.
- source_word: ἠγαπημένοις
  choice: aimés
  rationale: Le participe parfait passif décrit l’état durable résultant du fait d’avoir été aimés ; « aimés » est clair, actuel et fidèle.
- source_word: τετηρημένοις
  choice: gardés pour
  rationale: Le participe parfait passif exprime une préservation durable. Le datif suivant peut indiquer l’intérêt ou la destination (« pour »), mais aussi éventuellement l’agent (« par »), possibilité signalée en note.
- source_word: κλητοῖς
  choice: appelés
  rationale: L’adjectif substantivé qualifie les destinataires et s’insère naturellement en français dans la série « aimés, gardés et appelés ».
- source_word: Ἰακώβου
  choice: Jacques
  rationale: « Jacques » est la forme française conventionnelle du nom Ἰάκωβος dans ce contexte néotestamentaire.
theological_decisions:
- issue: Rapport entre τετηρημένοις et Ἰησοῦ Χριστῷ
  choice: gardés pour Jésus le Messie
  alternative: gardés par Jésus le Messie
  rationale: Le datif grec peut exprimer l’intérêt ou la destination, mais il est aussi susceptible d’être compris comme indiquant l’agent. Le texte principal retient « pour » et la note préserve l’autre analyse sans trancher dogmatiquement.
- issue: Leçon de ἠγαπημένοις
  choice: aimés
  alternative: sanctifiés
  rationale: Le texte SBLGNT fourni porte ἠγαπημένοις, « aimés ». Certains manuscrits ont ἡγιασμένοις, « sanctifiés » ; cette variante significative est conservée en note.
- issue: Valeur de κλητοῖς
  choice: appelés
  alternative: ceux qui sont appelés
  rationale: « Appelés » préserve la portée de l’appel divin tout en maintenant le parallélisme grammatical avec « aimés » et « gardés ».
translation_notes:
  register: Français international moderne, digne et accessible. « Esclave » conserve la force sociale et théologique de δοῦλος ; « le Messie » traduit le titre Χριστός. La syntaxe maintient autant que possible les trois qualifications parallèles des destinataires. Le marqueur de la variante textuelle est placé en fin de verset afin de ne pas interrompre artificiellement le groupe « aimés en Dieu le Père ».
