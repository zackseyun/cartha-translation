source:
  edition: SBLGNT
  text: οὗτοί εἰσιν γογγυσταί, μεμψίμοιροι, κατὰ τὰς ἐπιθυμίας ⸀αὐτῶν πορευόμενοι, καὶ τὸ στόμα αὐτῶν λαλεῖ ὑπέρογκα, θαυμάζοντες πρόσωπα ὠφελείας χάριν.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/016.yaml
  text: These are grumblers[a], malcontents, walking according to their own desires, and their mouth speaks arrogant things[c][b], showing favoritism for the sake of gain.
translation:
  language: fr
  text: Ce sont des gens qui murmurent, mécontents de leur sort, vivant selon leurs propres désirs[a] ; leur bouche profère des paroles arrogantes[b], et ils font preuve de favoritisme pour en tirer avantage[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « selon leurs propres convoitises » ou « au gré de leurs propres désirs ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « des paroles démesurées » ou « des propos grandiloquents ».'
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « admirant des visages en vue d’un avantage ». L’expression désigne le fait d’accorder une faveur ou de montrer de la partialité envers des personnes ; dans ce contexte, elle peut aussi évoquer une flatterie intéressée.'
    reason: idiom_explanation
lexical_decisions:
- source_word: γογγυσταί
  choice: des gens qui murmurent
  rationale: Le terme désigne des personnes portées à la plainte murmurée. Cette formulation naturelle conserve l’idée d’un mécontentement exprimé à voix basse ou de manière persistante.
- source_word: μεμψίμοιροι
  choice: toujours mécontents de leur sort
  rationale: Ce mot rare vise ceux qui se plaignent de la part qui leur échoit. La périphrase française rend ce sens plus précisément que le simple « mécontents » et évite le chevauchement avec γογγυσταί.
- source_word: κατὰ τὰς ἐπιθυμίας αὐτῶν πορευόμενοι
  choice: ils vivent au gré de leurs propres désirs
  rationale: πορεύομαι décrit ici la conduite de vie, tandis que ἐπιθυμίαι désigne des désirs dont le contexte indique le caractère désordonné. « Au gré de » souligne qu’ils se laissent diriger par eux.
- source_word: τὸ στόμα αὐτῶν λαλεῖ ὑπέρογκα
  choice: leur bouche profère des paroles arrogantes
  rationale: Le singulier collectif « leur bouche » reprend l’image grecque. ὑπέρογκα qualifie une parole démesurée, prétentieuse ou arrogante ; la formulation choisie est claire et digne.
- source_word: θαυμάζοντες πρόσωπα
  choice: ils flattent les gens
  rationale: L’expression idiomatique signifie littéralement « admirer des visages ». Avec le motif intéressé explicité par la suite, elle évoque ici les égards flatteurs accordés à certaines personnes plutôt qu’une impartialité abstraite.
- source_word: ὠφελείας χάριν
  choice: pour en tirer profit
  rationale: 'La locution exprime le motif intéressé : obtenir un avantage ou un bénéfice. « Tirer profit » n’impose pas nécessairement un gain financier.'
- source_word: οὗτοί εἰσιν
  choice: Ce sont des gens qui
  rationale: Cette tournure française identifie clairement les personnes visées tout en introduisant naturellement les deux qualifications nominales.
theological_decisions:
- issue: Portée morale de ἐπιθυμίαι
  choice: désirs dans le texte principal, avec le contexte qui leur donne une valeur négative
  alternative: convoitises ; passions
  rationale: Le mot peut désigner divers désirs forts et ne se limite pas à la sexualité. « Désirs » préserve cette largeur sémantique sans atténuer la dénonciation contextuelle.
- issue: Force idiomatique de θαυμάζοντες πρόσωπα
  choice: flattent les gens
  alternative: font preuve de favoritisme ; admirent les visages
  rationale: Dans ce contexte de recherche d’avantage, l’expression décrit des égards intéressés envers des personnes. « Flattent » rend cette dimension sans reproduire littéralement un idiome français obscur ; la note conserve l’image source.
translation_notes:
  register: Français international moderne, naturel et digne. La juxtaposition grecque est répartie en deux phrases pour la lisibilité, sans modifier la progression de l’accusation. « Murmurent » garde la nuance de plainte persistante ; « toujours mécontents de leur sort » explicite le terme rare μεμψίμοιροι. Les notes signalent les principales possibilités lexicales et l’idiome grec.
