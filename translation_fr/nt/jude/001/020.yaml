source:
  edition: SBLGNT
  text: ὑμεῖς δέ, ἀγαπητοί, ⸂ἐποικοδομοῦντες ἑαυτοὺς τῇ ἁγιωτάτῃ ὑμῶν πίστει⸃, ἐν πνεύματι ἁγίῳ προσευχόμενοι,
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/020.yaml
  text: But you[a], beloved, building yourselves up in your most holy faith and praying in the Holy Spirit[c][b],
translation:
  language: fr
  text: Mais vous, bien-aimés, en vous édifiant vous-mêmes sur votre très sainte foi[a] et en priant dans l’Esprit Saint[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi traduire : « en vous édifiant vous-mêmes dans votre très sainte foi ». Le datif grec peut présenter la foi comme le fondement de la construction ou comme le domaine dans lequel les croyants s’édifient. Ici, « foi » peut également évoquer la confiance ou la fidélité, mais, dans Jude, le terme désigne probablement la foi chrétienne partagée par la communauté.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « en priant par l’Esprit Saint ». L’expression grecque peut souligner soit la sphère dans laquelle on prie (« dans »), soit l’action de l’Esprit qui rend cette prière possible (« par »).'
    reason: alternative_reading
lexical_decisions:
- source_word: ὑμεῖς δέ
  choice: Mais vous
  rationale: « Mais » marque le contraste avec les personnes décrites auparavant, tandis que le pronom explicite souligne directement les destinataires.
- source_word: ἀγαπητοί
  choice: bien-aimés
  rationale: Ce vocatif pluriel exprime à la fois l’affection et la dignité théologique de personnes aimées; « bien-aimés » convient au registre biblique moderne.
- source_word: ἐποικοδομοῦντες ἑαυτοὺς
  choice: édifiez-vous
  rationale: Le verbe conserve l’image de la construction et le pronom réfléchi pluriel. En français, cette formulation peut naturellement viser la communauté dans son ensemble.
- source_word: τῇ ἁγιωτάτῃ ὑμῶν πίστει
  choice: sur le fondement de votre très sainte foi
  rationale: Avec ἐποικοδομέω, le datif peut désigner la base sur laquelle on construit. Cette formulation rend explicite en français l’image architecturale sans ajouter un autre fondement au texte; le superlatif ἁγιωτάτῃ est rendu par « très sainte ».
- source_word: πίστει
  choice: foi
  rationale: Dans Jude, le terme renvoie vraisemblablement à la foi chrétienne reçue et partagée par la communauté, tout en gardant en français la polysémie normale de « foi ».
- source_word: ἐν πνεύματι ἁγίῳ
  choice: dans l’Esprit Saint
  rationale: La tournure désigne le plus naturellement l’Esprit Saint. « Dans » préserve la valeur première de ἐν sans trancher entièrement entre sphère et action habilitante.
- source_word: προσευχόμενοι
  choice: priez
  rationale: L’impératif coordonné donne en français une exhortation naturelle et reflète la force exhortative des participes grecs, dont la construction se poursuit au verset suivant.
theological_decisions:
- issue: Référence de πνεύματι ἁγίῳ
  choice: l’Esprit Saint divin
  alternative: une disposition spirituelle sainte
  rationale: Dans l’usage chrétien ancien et le contexte de Jude, la formule renvoie le plus naturellement à l’Esprit Saint, même sans article en grec.
- issue: Sens de πίστις
  choice: la foi chrétienne reçue et partagée par les croyants
  alternative: l’acte personnel de faire confiance ou la fidélité
  rationale: L’emploi de « la foi » ailleurs dans Jude favorise le sens du contenu de foi transmis à la communauté, mais le mot français « foi » évite de fermer totalement les autres nuances lexicales.
- issue: Valeur de ἐν dans ἐν πνεύματι ἁγίῳ
  choice: sphère ou relation exprimée par « dans »
  alternative: agent ou moyen exprimé par « par l’Esprit Saint »
  rationale: Le grec peut mettre en avant soit le domaine dans lequel la prière a lieu, soit l’action habilitante de l’Esprit. Le texte principal conserve la préposition la moins interprétative et la note signale l’autre possibilité.
translation_notes:
  register: Français international moderne, digne et accessible. « Bien-aimés » garde la solennité affectueuse de l’adresse. « Édifiez-vous » conserve la métaphore architecturale et la valeur communautaire du pluriel. La virgule finale indique que la phrase grecque se poursuit au verset suivant.
