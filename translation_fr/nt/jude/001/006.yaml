id: JUD.1.6
reference: Jude 1:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀγγέλους τε τοὺς μὴ τηρήσαντας τὴν ἑαυτῶν ἀρχὴν ἀλλὰ ἀπολιπόντας τὸ ἴδιον οἰκητήριον εἰς κρίσιν μεγάλης ἡμέρας δεσμοῖς ἀϊδίοις ὑπὸ ζόφον τετήρηκεν·
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/006.yaml
  text: And the angels who did not keep their own domain[a], but abandoned their proper dwelling[c][b], he has kept in eternal chains under gloom for the judgment of the great day.
translation:
  language: fr
  text: Et les anges qui n’ont pas gardé le rang qui était le leur[a], mais ont abandonné leur propre demeure[b], il les a gardés dans des liens éternels, sous une profonde obscurité[c], en vue du jugement du grand jour.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leur propre domaine », « leur propre position » ou « leur propre autorité ».
    reason: lexical_alternative
  - marker: b
    text: Ou « leur propre lieu d’habitation » ou « leur demeure à eux ».
    reason: lexical_alternative
  - marker: c
    text: Ou « sous d’épaisses ténèbres » ; le terme grec désigne une obscurité profonde et lugubre.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγγέλους
  choice: les anges
  rationale: Dans ce contexte de jugement et de rébellion céleste, le terme désigne des êtres surnaturels plutôt que des messagers humains.
- source_word: τηρήσαντας / τετήρηκεν
  choice: n’ont pas gardé / il les garde
  rationale: 'La répétition de « garder » reproduit le contraste délibéré du grec : eux n’ont pas gardé leur rang, tandis que Dieu les garde en vue du jugement. Le présent français rend naturellement le parfait grec et son résultat durable.'
- source_word: τὴν ἑαυτῶν ἀρχὴν
  choice: le rang qui était le leur
  rationale: ἀρχή peut désigner une autorité, une position ou une sphère assignée. « Le rang qui était le leur » reste compréhensible sans préciser indûment la nature exacte de cette position.
- source_word: ἀπολιπόντας
  choice: ont abandonné
  rationale: « Abandonner » exprime une sortie volontaire et coupable, conformément à la tonalité judiciaire du passage.
- source_word: τὸ ἴδιον οἰκητήριον
  choice: leur propre demeure
  rationale: οἰκητήριον désigne un lieu d’habitation, et ἴδιον souligne qu’il était le leur. Cette formulation demeure naturelle et proche du grec.
- source_word: εἰς κρίσιν μεγάλης ἡμέρας
  choice: en vue du jugement du grand jour
  rationale: « En vue de » exprime l’orientation vers le jugement portée par εἰς, sans introduire le sens temporel plus interprétatif de « jusqu’à ».
- source_word: δεσμοῖς ἀϊδίοις
  choice: dans des liens éternels
  rationale: « Liens » rend δεσμοί sans imposer nécessairement des chaînes matérielles, tandis qu’« éternels » exprime la permanence de ἀΐδιος.
- source_word: ὑπὸ ζόφον
  choice: sous une profonde obscurité
  rationale: ζόφος évoque une obscurité épaisse et lugubre, plus forte que la simple absence de lumière. « Sous » conserve l’image spatiale de ὑπό.
- source_word: τε
  choice: Et
  rationale: La conjonction relie cet exemple de jugement à celui qui précède.
theological_decisions:
- issue: Nature de la transgression des anges
  choice: Le texte affirme qu’ils n’ont pas gardé le rang qui était le leur et qu’ils ont abandonné leur demeure, sans définir davantage ces réalités.
  alternative: Y voir explicitement soit la tradition associée à Genèse 6, soit une chute angélique primordiale plus générale.
  rationale: Jude évoque vraisemblablement une tradition connue de ses lecteurs, mais ce verset n’en expose pas les détails. La traduction conserve donc l’ambiguïté du texte grec.
- issue: Référent du sujet implicite de τετήρηκεν
  choice: Conserver le pronom « il », dont le contexte identifie Dieu comme l’auteur du jugement.
  alternative: Rendre explicitement « Dieu les garde ».
  rationale: Le grec n’énonce pas de nouveau le sujet. Le pronom respecte sa formulation tout en restant intelligible dans le contexte.
- issue: Portée de ἀΐδιος
  choice: éternels
  alternative: perpétuels, impérissables
  rationale: « Éternels » est le terme français courant qui exprime la permanence indiquée par le grec, sans développer davantage la nature métaphysique de ces liens.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve la mise en relief des anges puis le sujet implicite « il ». Les marqueurs de notes sont placés immédiatement après les expressions concernées.
