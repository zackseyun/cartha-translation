revisions:
- from: Et les anges qui n’ont pas gardé le rang qui était le leur[a], mais ont abandonné leur propre demeure[b], il les garde dans des liens éternels, sous une profonde obscurité[c], en vue du jugement du grand jour.
  to: Et les anges qui n’ont pas gardé le rang qui était le leur[a], mais ont abandonné leur propre demeure[b], il les a gardés dans des liens éternels, sous une profonde obscurité[c], en vue du jugement du grand jour.
  rationale: 'La révision limite les changements à deux points : le parfait « il les a gardés » rend mieux τετήρηκεν et maintient le jeu de répétition avec « n’ont pas gardé » ; la note b est rendue strictement lexicale afin de ne pas ajouter l''idée interprétative d''une demeure « réservée ». Les ambiguïtés concernant la nature de l’ἀρχή et de la demeure sont préservées.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T11:47:33Z'
review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est fidèle au grec : les anges n''ont pas conservé leur ἀρχή, ont abandonné leur demeure, et sont gardés sous le ζόφος pour le jugement. La reprise de « garder » rend utilement le contraste entre τηρήσαντας et τετήρηκεν. Toutefois, le parfait grec τετήρηκεν est mieux rendu en français par « les a gardés », qui exprime l''action accomplie et son effet présent, plutôt que par le seul présent « les garde ».'
  naturalness: Le français est naturel, digne et accessible. « Le rang qui était le leur » est une bonne solution non doctrinale pour ἀρχή, bien que « leur propre domaine » reste possible. La phrase révisée conserve une syntaxe française fluide tout en respectant la mise en relief grecque.
  terminology: « Anges », « demeure », « liens éternels », « profonde obscurité » et « jugement du grand jour » conviennent. La note b actuelle (« la demeure qui leur était réservée ») introduit l'idée d'une attribution explicite qui n'est pas formulée par ἴδιον ; elle doit être remplacée par une alternative strictement lexicale.
  issues:
  - severity: low
    issue: Aspect de τετήρηκεν
    rationale: « Il les garde » peut décrire un état présent, mais le parfait τετήρηκεν présente l'action de garder comme accomplie avec effet durable. « Il les a gardés » reproduit plus exactement cette nuance tout en gardant la répétition verbale.
  - severity: low
    issue: Note b interprétative
    rationale: « La demeure qui leur était réservée » ajoute l'idée de réservation ou d'assignation. Le grec dit seulement « leur propre demeure » ; une note devrait proposer « leur propre lieu d'habitation » ou « leur demeure à eux ».
  revised_text: Et les anges qui n’ont pas gardé le rang qui était le leur[a], mais ont abandonné leur propre demeure[b], il les a gardés dans des liens éternels, sous une profonde obscurité[c], en vue du jugement du grand jour.
