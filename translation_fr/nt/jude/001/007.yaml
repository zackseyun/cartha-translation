id: JUD.1.7
reference: Jude 1:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὡς Σόδομα καὶ Γόμορρα καὶ αἱ περὶ αὐτὰς πόλεις, τὸν ὅμοιον ⸂τρόπον τούτοις⸃ ἐκπορνεύσασαι καὶ ἀπελθοῦσαι ὀπίσω σαρκὸς ἑτέρας, πρόκεινται δεῖγμα πυρὸς αἰωνίου δίκην ὑπέχουσαι.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/007.yaml
  text: just as Sodom and Gomorrah and the cities around them[a], having in like manner committed sexual immorality and gone after other flesh, are set forth as an example[b], undergoing the punishment of eternal fire.
translation:
  language: fr
  text: Ainsi, Sodome et Gomorrhe, ainsi que les villes des environs, s’étant livrées à l’immoralité sexuelle de la même manière que ceux-ci[a] et s’étant tournées vers une autre chair[b], sont données en exemple, en subissant la peine d’un feu éternel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « de la même manière que ceux-ci ». Le pronom « ceux-ci » peut renvoyer aux anges mentionnés au verset précédent ou, plus généralement, aux exemples antérieurs de rébellion et de jugement.'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « une chair différente » ; traditionnellement : « une chair étrangère ». La traduction reste littérale afin de ne pas limiter cette expression à une seule interprétation.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς
  choice: De même
  rationale: Introduit le rapprochement avec les exemples précédents de rébellion et de jugement, dans un français naturel.
- source_word: Σόδομα καὶ Γόμορρα
  choice: Sodome et Gomorrhe
  rationale: Formes françaises usuelles des noms de lieux bibliques.
- source_word: αἱ περὶ αὐτὰς πόλεις
  choice: les villes des environs
  rationale: Rend clairement la proximité géographique exprimée par περὶ avec l’accusatif.
- source_word: τὸν ὅμοιον τρόπον τούτοις
  choice: de la même manière que ceux-ci
  rationale: Conserve explicitement la comparaison du grec ainsi que l’indétermination de l’antécédent de τούτοις.
- source_word: ἐκπορνεύσασαι
  choice: se sont livrées à l’immoralité sexuelle
  rationale: Expression française claire qui traduit sans euphémisme la conduite sexuelle illicite désignée par le verbe intensif.
- source_word: ἀπελθοῦσαι ὀπίσω
  choice: sont allées après
  rationale: Préserve l’image de la poursuite contenue dans l’expression grecque.
- source_word: σαρκὸς ἑτέρας
  choice: une autre chair
  rationale: Traduction littérale qui ne réduit pas la formule à une seule interprétation de la transgression.
- source_word: πρόκεινται δεῖγμα
  choice: sont données en exemple
  rationale: Exprime le fait d’être publiquement présentées comme exemple, avec la portée d’avertissement fournie par le contexte.
- source_word: πυρὸς αἰωνίου
  choice: d’un feu éternel
  rationale: Rend directement le groupe génitival sans l’atténuer ni le développer en système doctrinal.
- source_word: δίκην ὑπέχουσαι
  choice: en subissant la peine
  rationale: Conserve le sens judiciaire de l’expression et la valeur circonstancielle du participe.
theological_decisions:
- issue: Antécédent de τούτοις dans τὸν ὅμοιον τρόπον τούτοις
  choice: Conserver « ceux-ci » sans en préciser l’antécédent.
  alternative: Comprendre « ceux-ci » comme les anges du verset 6, ou plus largement comme les exemples précédents de rébellion et de jugement.
  rationale: Le grec établit une comparaison, mais l’antécédent exact du pronom reste discuté. La traduction ne tranche donc pas une ambiguïté réelle.
- issue: Sens de σαρκὸς ἑτέρας
  choice: Traduire littéralement par « une autre chair ».
  alternative: « une chair différente » ou une explicitation visant soit des rapports homosexuels, soit le franchissement de la frontière entre êtres angéliques et humains.
  rationale: La formulation grecque n’explicite pas précisément la nature de la transgression; une traduction littérale évite d’importer une interprétation plus étroite.
- issue: Portée de πυρὸς αἰωνίου
  choice: Maintenir « feu éternel ».
  alternative: « feu perpétuel » ou développement doctrinal sur la nature et la durée du châtiment.
  rationale: La traduction reprend l’expression du texte sans l’atténuer ni en tirer dans ce verset des conclusions systématiques supplémentaires.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche du grec tout en évitant les tournures archaïques. Les formulations « ceux-ci », « une autre chair » et « feu éternel » préservent les ambiguïtés et la tension théologique du texte source.
