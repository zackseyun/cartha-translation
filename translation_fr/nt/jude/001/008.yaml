id: JUD.1.8
reference: Jude 1:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ὁμοίως μέντοι καὶ οὗτοι ἐνυπνιαζόμενοι σάρκα μὲν μιαίνουσιν, κυριότητα δὲ ἀθετοῦσιν, δόξας δὲ βλασφημοῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/008.yaml
  text: Yet in the same way, these people also, relying on dreams, defile the flesh, reject authority, and slander glorious ones.
translation:
  language: fr
  text: De même, pourtant, ces gens-là aussi, se fondant sur des rêves[a], souillent la chair, rejettent l’autorité et insultent les êtres glorieux[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « rêvant ». Le participe grec peut être rendu plus littéralement ainsi ; dans le contexte, il peut signifier que ces gens invoquent des rêves pour justifier leur conduite.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « les gloires ». L’expression désigne probablement des êtres célestes élevés, peut-être des anges.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ὁμοίως μέντοι
  choice: Pourtant, de la même manière
  rationale: Cette formulation conserve à la fois le lien comparatif avec les exemples précédents et la légère opposition exprimée par μέντοι.
- source_word: οὗτοι
  choice: ces gens
  rationale: Le démonstratif désigne les intrus évoqués dans le contexte; « ces gens » est naturel et n’ajoute aucune précision de genre absente du grec.
- source_word: ἐνυπνιαζόμενοι
  choice: se fondant sur des rêves
  rationale: Le participe peut décrire le fondement ou le mode de leur conduite, comme s’ils invoquaient des rêves pour la justifier. La traduction plus formelle « rêvant » est signalée en note afin de préserver l’ambiguïté.
- source_word: σάρκα
  choice: la chair
  rationale: « La chair » reproduit le terme concret et théologiquement ouvert du grec sans le réduire au corps physique ni lui imposer le sens technique de « nature pécheresse ».
- source_word: μιαίνουσιν
  choice: souillent
  rationale: Ce verbe convient au registre moral et rituel de μιαίνω ainsi qu’au ton accusateur de Jude.
- source_word: κυριότητα
  choice: toute autorité
  rationale: « Autorité » maintient l’indétermination du grec entre souveraineté divine, autorité céleste ou autorité au sens plus large. Le déterminant « toute » rend idiomatiquement en français le rejet de l’autorité comme réalité, sans identifier son détenteur.
- source_word: ἀθετοῦσιν
  choice: rejettent
  rationale: « Rejettent » exprime clairement la répudiation de ce qui devrait être reconnu.
- source_word: δόξας
  choice: les êtres glorieux
  rationale: Le pluriel grec, littéralement « gloires », paraît désigner des êtres célestes élevés. « Les êtres glorieux » reste large et évite de préciser prématurément qu’il s’agit d’anges.
- source_word: βλασφημοῦσιν
  choice: insultent
  rationale: Avec des êtres glorieux pour objet, le verbe désigne ici des paroles outrageantes. « Insultent » est clair en français moderne et n’enferme pas βλασφημέω dans son seul emploi à propos de Dieu.
theological_decisions:
- issue: Référent de δόξας
  choice: expression large désignant des êtres glorieux ou élevés
  alternative: les anges; les majestés célestes; littéralement « les gloires »
  rationale: Le contexte immédiat, notamment le verset 9, oriente vers des êtres angéliques, mais le nom lui-même ne les identifie pas explicitement. Le texte principal préserve cette ouverture et la note indique le sens probable.
- issue: Valeur de ἐνυπνιαζόμενοι
  choice: leur conduite se fonde sur des rêves
  alternative: « rêvant » ou « rêveurs »
  rationale: Le participe peut indiquer le fondement de leurs actes, mais cette relation n’est pas grammaticalement certaine. La formulation retenue présente le sens contextuel probable, tandis que la note conserve la traduction plus formelle.
- issue: Référent de κυριότητα
  choice: l’autorité sans détenteur explicitement identifié
  alternative: la souveraineté du Seigneur; une domination céleste; l’autorité en général
  rationale: Le grec ne précise pas ici de qui relève cette autorité. La traduction n’impose donc ni une lecture exclusivement christologique ni une référence assurée aux anges.
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme des trois verbes est conservé. « Se fondant sur des rêves » est interprétatif mais naturel; la note maintient la forme plus littérale. « Les êtres glorieux » évite aussi bien l’obscurité de « les gloires » que la surinterprétation « les anges ».
