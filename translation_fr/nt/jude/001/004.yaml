id: JUD.1.4
reference: Jude 1:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: παρεισέδυσαν γάρ τινες ἄνθρωποι, οἱ πάλαι προγεγραμμένοι εἰς τοῦτο τὸ κρίμα, ἀσεβεῖς, τὴν τοῦ θεοῦ ἡμῶν χάριτα μετατιθέντες εἰς ἀσέλγειαν καὶ τὸν μόνον ⸀δεσπότην καὶ κύριον ἡμῶν Ἰησοῦν Χριστὸν ἀρνούμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/004.yaml
  text: For certain men have slipped in unnoticed[a], who long ago were designated for this judgment, ungodly men who turn the grace of our God into sensuality and deny our only Master and Lord[d][c][b], Jesus the Messiah.
translation:
  language: fr
  text: 'Car certains hommes se sont introduits sans se faire remarquer[a] : des impies désignés depuis longtemps pour ce jugement[b], qui transforment la grâce de notre Dieu en débauche[c] et renient notre seul Maître et Seigneur, Jésus le Messie.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « se sont glissés sans se faire remarquer » ou « se sont introduits furtivement ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « qui ont été inscrits d’avance pour ce jugement » ou « dont il a été écrit d’avance qu’ils seraient soumis à ce jugement ». Le grec peut évoquer soit une mention écrite antérieure, soit une désignation préalable.'
    reason: alternative_reading
  - marker: c
    text: 'Ou : « dérèglement » ou « licence ». Le terme grec désigne une conduite éhontée et sans retenue, souvent de nature sexuelle.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεισέδυσαν
  choice: se sont infiltrés parmi vous sans être remarqués
  rationale: Le verbe évoque une entrée clandestine. « S’infiltrer » restitue naturellement cette idée en français moderne; « parmi vous » explicite la destination impliquée par le contexte communautaire.
- source_word: πάλαι προγεγραμμένοι
  choice: Depuis longtemps, les Écritures les désignaient d’avance
  rationale: πάλαι marque l’ancienneté, tandis que προγεγραμμένοι peut évoquer une mention écrite antérieure ou une désignation préalable. La mention des Écritures rend explicite la nuance de l’écrit retenue ici, sans faire de la phrase une affirmation directe de prédestination individuelle.
- source_word: κρίμα
  choice: jugement
  rationale: « Jugement » conserve l’étendue judiciaire du terme sans imposer la nuance plus étroite de condamnation ou de sentence.
- source_word: ἀσεβεῖς
  choice: impies
  rationale: Le terme décrit des personnes irrévérencieuses envers Dieu. « Impies » est concis, digne et courant dans le registre biblique français.
- source_word: χάριτα
  choice: grâce
  rationale: « Grâce » est le terme français établi et exact dans ce contexte théologique.
- source_word: μετατιθέντες
  choice: changent ... en
  rationale: Cette formulation représente directement l’idée de transformation sans introduire dans le texte principal le jugement interprétatif plus appuyé de « pervertissent ».
- source_word: ἀσέλγειαν
  choice: débauche
  rationale: « Débauche » exprime le dérèglement éhonté et souvent sexuel du terme grec, avec davantage de netteté en français actuel que « sensualité ».
- source_word: μόνον δεσπότην καὶ κύριον
  choice: notre seul Maître et Seigneur
  rationale: Les deux titres sont conservés distinctement. « Maître » rend l’autorité personnelle de δεσπότης et « Seigneur » traduit κύριος.
- source_word: Ἰησοῦν Χριστόν
  choice: Jésus le Messie
  rationale: 'Χριστός est rendu comme un titre. L’article français permet une expression idiomatique : « Jésus le Messie ».'
- source_word: ἀρνούμενοι
  choice: renient
  rationale: « Renier » exprime une répudiation personnelle et pratique, et convient naturellement lorsqu’il s’agit de Jésus comme Maître et Seigneur.
theological_decisions:
- issue: Portée de προγεγραμμένοι εἰς τοῦτο τὸ κρίμα
  choice: une ancienne désignation écrite en vue de ce jugement
  alternative: une prédestination personnelle à cette condamnation
  rationale: Le participe peut renvoyer à ce qui a été écrit auparavant ou désigné d’avance. Le texte principal retient la première nuance tout en donnant en note l’autre analyse possible, afin de ne pas trancher silencieusement la tension théologique.
- issue: Référent de « notre seul Maître et Seigneur »
  choice: les deux titres se rapportent à Jésus le Messie
  alternative: « Maître » se rapporte à Dieu le Père et « Seigneur » à Jésus le Messie
  rationale: La construction grecque relie le plus naturellement les deux titres au nom qui suit, Ἰησοῦν Χριστόν, tout en reconnaissant que l’autre analyse a été proposée.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase est légèrement segmentée pour rester claire à l’oral. « Impies », « grâce », « Maître », « Seigneur » et « Messie » maintiennent le poids théologique du texte sans archaïsme excessif.
