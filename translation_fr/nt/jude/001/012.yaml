source:
  edition: SBLGNT
  text: οὗτοί εἰσιν ⸀οἱ ἐν ταῖς ἀγάπαις ὑμῶν σπιλάδες συνευωχούμενοι, ἀφόβως ἑαυτοὺς ποιμαίνοντες, νεφέλαι ἄνυδροι ὑπὸ ἀνέμων παραφερόμεναι, δένδρα φθινοπωρινὰ ἄκαρπα δὶς ἀποθανόντα ἐκριζωθέντα,
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/012.yaml
  text: These are hidden reefs at your love feasts[a], feasting together without fear, shepherding themselves; waterless clouds carried along by winds; autumn trees without fruit, twice dead[c][b], uprooted.
translation:
  language: fr
  text: 'Ce sont des récifs cachés au milieu de vos repas fraternels[a] : ils y festoient sans crainte, ne prenant soin que d’eux-mêmes[b] ; des nuages sans eau emportés par les vents ; des arbres d’automne sans fruit, deux fois morts[c], déracinés.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des taches » ou « des souillures dans vos repas fraternels ». Le mot grec peut être compris au sens moral, mais il peut aussi désigner des récifs dangereux ; ce dernier sens s’accorde bien avec la suite des images employées par Jude.
    reason: alternative_reading
  - marker: b
    text: Littéralement, « se faisant paître eux-mêmes » ; le verbe évoque l’action du berger. On peut aussi traduire « se nourrissant eux-mêmes ». Comparer Ézéchiel 34, où des bergers se nourrissent eux-mêmes au lieu de prendre soin du troupeau.
    reason: lexical_alternative_and_cross_reference
  - marker: c
    text: La formule grecque « deux fois morts » est rendue littéralement. Elle ne précise pas en quel sens ces arbres sont « deux fois » morts.
    reason: preserved_ambiguity
lexical_decisions:
- source_word: σπιλάδες
  choice: récifs cachés
  rationale: Le nom peut désigner des récifs dangereux, image qui s’accorde avec la série de métaphores saisissantes de Jude. Le sens moral de « taches » reste possible et est signalé en note.
- source_word: ἀγάπαις
  choice: repas fraternels
  rationale: Au pluriel, le terme désigne ici les repas communautaires des croyants, caractérisés par l’amour. « Repas fraternels » est clair en français courant sans imposer le terme ecclésiastique moins transparent « agapes ».
- source_word: συνευωχούμενοι
  choice: ils festoient avec vous
  rationale: Le participe exprime la participation commune à un repas de fête; la formulation française rend explicitement et naturellement le cadre communautaire.
- source_word: ἀφόβως
  choice: sans crainte
  rationale: Cette traduction directe conserve l’ambiguïté entre absence de retenue, insouciance et irrévérence.
- source_word: ἑαυτοὺς ποιμαίνοντες
  choice: ne prennent soin que d’eux-mêmes
  rationale: Le grec signifie littéralement « se conduisant eux-mêmes comme des bergers » et implique un comportement intéressé. La formulation naturelle rend le sens dans le texte, tandis que la métaphore pastorale et l’autre traduction possible sont conservées en note.
- source_word: νεφέλαι ἄνυδροι
  choice: nuages sans eau
  rationale: Rendu concret et fidèle de l’image d’une promesse qui ne fournit rien.
- source_word: ὑπὸ ἀνέμων παραφερόμεναι
  choice: emportés par les vents
  rationale: Le passif exprime des nuages entraînés par des forces extérieures; « emportés » est naturel et vivant.
- source_word: δένδρα φθινοπωρινὰ ἄκαρπα
  choice: arbres d’automne sans fruit
  rationale: La traduction garde l’image saisonnière et l’absence concrète de fruit, sans l’interpréter prématurément.
- source_word: δὶς ἀποθανόντα
  choice: deux fois morts
  rationale: La formule frappante du grec est conservée sans chercher à résoudre sa portée exacte.
- source_word: ἐκριζωθέντα
  choice: déracinés
  rationale: Ce terme bref et imagé exprime l’arrachement des racines et renforce l’état de mort des arbres.
theological_decisions:
- issue: Sens de σπιλάδες appliqué aux individus dénoncés
  choice: des récifs cachés et dangereux au milieu des repas communautaires
  alternative: des taches ou des souillures dans les repas fraternels
  rationale: Le sens « récifs » s’intègre bien à la chaîne de métaphores naturelles et à l’idée d’un danger dissimulé. L’autre compréhension, ancienne et lexicalement possible, est maintenue en note.
- issue: Portée de ἑαυτοὺς ποιμαίνοντες
  choice: comportement pastoral intéressé, rendu naturellement par « ne prennent soin que d’eux-mêmes »
  alternative: « ils se repaissent eux-mêmes » ou, littéralement, « ils se font eux-mêmes bergers »
  rationale: Le verbe porte normalement l’image du berger, avec un écho possible à Ézéchiel 34. Une traduction strictement littérale serait obscure en français; la note préserve la métaphore et l’alternative alimentaire sans limiter indûment le sens.
- issue: Sens de « deux fois morts »
  choice: conserver la formule sans explication dans le corps du texte
  alternative: l’interpréter comme « entièrement morts » ou préciser les deux morts envisagées
  rationale: Le grec est rhétoriquement fort mais ne précise pas lui-même de quelles deux morts il s’agit. La traduction ne doit pas trancher une ambiguïté théologique que le texte maintient.
translation_notes:
  register: Français international moderne, digne et imagé. « Repas fraternels » privilégie la compréhension immédiate plutôt que le terme spécialisé « agapes ». La ponctuation présente d’abord leur conduite au repas, puis la série des comparaisons. Les métaphores concrètes sont préservées autant que le permet un français naturel.
