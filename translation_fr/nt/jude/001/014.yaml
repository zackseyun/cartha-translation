id: JUD.1.14
reference: Jude 1:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Προεφήτευσεν δὲ καὶ τούτοις ἕβδομος ἀπὸ Ἀδὰμ Ἑνὼχ λέγων· Ἰδοὺ ἦλθεν κύριος ἐν ἁγίαις μυριάσιν αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/014.yaml
  text: And Enoch[a], the seventh from Adam, also prophesied to these, saying, “Behold[c][b], the Lord came with his holy myriads,”
translation:
  language: fr
  text: 'Hénoch, le septième depuis Adam, a lui aussi prophétisé à leur sujet[a] en disant : « Voici[b], le Seigneur est venu avec ses saintes myriades[c] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « contre eux ». Le datif grec peut désigner les personnes auxquelles la prophétie s’adresse ou celles qu’elle concerne; dans le contexte, il renvoie aux impies qui se sont introduits parmi les croyants.
    reason: lexical_alternative
  - marker: b
    text: Cette citation fait écho à 1 Hénoch 1.9.
    reason: cross_reference
  - marker: c
    text: Ou « avec les dizaines de milliers de ses saints ». Le terme grec peut désigner des myriades, c’est-à-dire une immense multitude sainte.
    reason: lexical_alternative
lexical_decisions:
- source_word: Προεφήτευσεν
  choice: a prophétisé
  rationale: Conserve l’acte de parole prophétique sans le réduire à une simple prédiction.
- source_word: δὲ καὶ
  choice: lui aussi
  rationale: Rend la progression discrète de δέ et la valeur additive de καί dans un français naturel.
- source_word: τούτοις
  choice: à leur sujet
  rationale: Le datif indique ici vraisemblablement les personnes visées par la prophétie. Cette formulation reste naturelle sans ajouter « hommes », absent du grec.
- source_word: ἕβδομος ἀπὸ Ἀδὰμ
  choice: le septième depuis Adam
  rationale: Reproduit sobrement la désignation généalogique et son point de départ.
- source_word: Ἑνὼχ
  choice: Hénok
  rationale: Forme française usuelle du nom biblique.
- source_word: λέγων
  choice: en disant
  rationale: Rend le participe qui introduit directement la citation.
- source_word: Ἰδοὺ
  choice: Voici
  rationale: Préserve la force solennelle de l’interjection prophétique dans un français actuel.
- source_word: ἦλθεν
  choice: est venu
  rationale: Rend l’aoriste comme un événement accompli, sans convertir explicitement le passé prophétique en futur.
- source_word: κύριος
  choice: le Seigneur
  rationale: Rend le titre avec son article sans préciser davantage son référent.
- source_word: ἐν ἁγίαις μυριάσιν αὐτοῦ
  choice: avec ses saintes myriades
  rationale: ἐν a ici une valeur associative; « myriades » conserve l’idée d’une multitude immense sans identifier explicitement ses membres comme des anges.
theological_decisions:
- issue: Identité du « Seigneur » dans la citation
  choice: Conserver simplement « le Seigneur ».
  alternative: Préciser qu’il s’agit de Dieu, ou identifier explicitement le Seigneur à Jésus.
  rationale: Le grec dit seulement κύριος. La traduction préserve donc l’ambiguïté possible entre le contexte hénochique et l’usage christologique éventuel chez Jude.
- issue: Statut de la parole attribuée à Hénok
  choice: La présenter comme une prophétie citée, conformément au texte de Jude.
  alternative: Qualifier dans le corps du verset son statut canonique ou la présenter seulement comme une tradition.
  rationale: Jude affirme qu’Hénok a prophétisé; la traduction n’ajoute aucun jugement sur le statut du Premier Livre d’Hénoch.
- issue: Valeur temporelle de ἦλθεν
  choice: « est venu »
  alternative: « viendra » ou « vient »
  rationale: La forme grecque est un aoriste. Même si elle peut fonctionner comme un passé prophétique décrivant un événement futur comme accompli, traduire au passé préserve la forme et la tension du texte.
translation_notes:
  register: Français international moderne, digne et lisible. La tournure « lui aussi » évite un « Et » initial peu nécessaire en français tout en conservant la valeur additive. « Myriades » maintient le ton solennel et l’imprécision référentielle du grec.
