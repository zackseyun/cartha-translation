  terminology: « Vagues sauvages de la mer », « astres errants », « obscurité des ténèbres » et « réservée pour toujours » conviennent au registre imagé et solennel. « Astres » ne force pas l’identification moderne à des planètes. La note a maintient l’ambiguïté de αἰσχύναι entre déshonneur et actes honteux, sans la trancher dans le texte.
