id: JUD.1.13
reference: Jude 1:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: κύματα ἄγρια θαλάσσης ἐπαφρίζοντα τὰς ἑαυτῶν αἰσχύνας, ἀστέρες πλανῆται οἷς ὁ ζόφος τοῦ σκότους εἰς αἰῶνα τετήρηται.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/013.yaml
  text: wild waves of the sea[a], foaming up their own shames; wandering stars[b], for whom the gloom of darkness has been reserved forever.
translation:
  language: fr
  text: vagues sauvages de la mer, faisant jaillir comme de l’écume leurs propres hontes[a] ; astres errants, auxquels l’obscurité des ténèbres[b] est réservée pour toujours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « rejetant leurs propres hontes » ou « faisant jaillir comme de l’écume leurs propres actes honteux ». Le pluriel grec rendu par « hontes » peut désigner soit le déshonneur lui-même, soit les actes honteux qui le révèlent.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « l’obscurité des ténèbres » ; l’expression peut aussi se rendre par « les ténèbres les plus profondes ».
    reason: lexical_alternative
lexical_decisions:
- source_word: κύματα ἄγρια θαλάσσης
  choice: vagues sauvages de la mer
  rationale: Cette formulation conserve l’image vive, l’adjectif ἄγρια et le génitif θαλάσσης, tout en restant naturelle en français.
- source_word: ἐπαφρίζοντα
  choice: qui font écumer
  rationale: Le participe présent décrit les vagues produisant de l’écume ; « font écumer » maintient l’action et permet de conserver le complément surprenant « leurs propres hontes ».
- source_word: τὰς ἑαυτῶν αἰσχύνας
  choice: leurs propres hontes
  rationale: Le pluriel frappant αἰσχύνας est conservé. Il peut désigner leur déshonneur ou leurs actes honteux, ambiguïté signalée en note.
- source_word: ἀστέρες πλανῆται
  choice: astres errants
  rationale: « Astres » évite d’imposer la notion astronomique moderne de planète, tandis que « errants » restitue directement πλανῆται et la métaphore.
- source_word: οἷς
  choice: auxquels
  rationale: Le relatif renvoie grammaticalement aux « astres », tout en visant les personnes décrites par cette métaphore.
- source_word: ὁ ζόφος τοῦ σκότους
  choice: l’obscurité des ténèbres
  rationale: Cette expression garde la construction intensive associant ζόφος et σκότος, sans la réduire à un simple superlatif.
- source_word: εἰς αἰῶνα
  choice: pour toujours
  rationale: Dans ce contexte de jugement, l’expression indique naturellement une durée sans fin, rendue en français courant et solennel.
- source_word: τετήρηται
  choice: est réservée
  rationale: Le parfait passif exprime un état établi résultant d’une action antérieure ; « est réservée » convient naturellement à un sort gardé en vue du jugement.
theological_decisions:
- issue: Durée et portée de l’image du jugement dans εἰς αἰῶνα
  choice: pour toujours
  alternative: pour l’éternité ; pour l’âge
  rationale: Dans ce contexte, « pour toujours » exprime le plus naturellement la force durable de l’avertissement sans ajouter de développement doctrinal.
- issue: Référent de τὰς ἑαυτῶν αἰσχύνας
  choice: conserver le pluriel concret « leurs propres hontes »
  alternative: leur propre déshonneur ; leurs actes honteux
  rationale: Le grec permet d’entendre soit la honte ou le déshonneur exposé, soit les conduites honteuses elles-mêmes ; le texte principal préserve cette tension et la note l’explicite.
translation_notes:
  register: Français international moderne, imagé et digne. Le parallélisme poétique est maintenu, ainsi que les pluriels et constructions volontairement saisissants du grec.
