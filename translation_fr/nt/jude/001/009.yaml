reference: Jude 1:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ δὲ Μιχαὴλ ὁ ἀρχάγγελος, ὅτε τῷ διαβόλῳ διακρινόμενος διελέγετο περὶ τοῦ Μωϋσέως σώματος, οὐκ ἐτόλμησεν κρίσιν ἐπενεγκεῖν βλασφημίας, ἀλλὰ εἶπεν· Ἐπιτιμήσαι σοι κύριος.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/009.yaml
  text: But Michael the archangel[a], when he was disputing with the devil and arguing about Moses' body, did not dare to bring a slanderous judgment against him, but said[b], “May the Lord rebuke you.”
translation:
  language: fr
  text: 'Mais l’archange Michel[a], lorsqu’il était en conflit avec le diable et discutait avec lui au sujet du corps de Moïse, n’osa pas porter contre lui un jugement injurieux, mais dit[b] : « Que le Seigneur te réprimande ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, selon une formulation plus traditionnelle : « n’osa pas prononcer contre lui une accusation outrageante ».'
    reason: lexical_alternative
  - marker: b
    text: Cette formulation fait écho à Zacharie 3.2, où le Seigneur réprimande Satan.
    reason: cross_reference
lexical_decisions:
- source_word: ἀρχάγγελος
  choice: archange
  rationale: Titre français traditionnel, transparent et courant, qui correspond directement au grec.
- source_word: διαβόλῳ
  choice: le diable
  rationale: Dans ce contexte, le terme désigne l’adversaire surnaturel personnel ; le titre établi est plus naturel que le sens étymologique « le calomniateur ».
- source_word: διακρινόμενος
  choice: contestait
  rationale: Le participe exprime ici une contestation ou un différend ; « contestait » conserve cette nuance sans surcharger le français.
- source_word: διελέγετο
  choice: discutait
  rationale: L’imparfait décrit un échange verbal en cours. Associé à « contestait », ce choix distingue les deux verbes grecs tout en restant naturel.
- source_word: περὶ τοῦ Μωϋσέως σώματος
  choice: au sujet du corps de Moïse
  rationale: Formulation française claire qui conserve la référence concrète et le rapport génitif du grec.
- source_word: οὐκ ἐτόλμησεν
  choice: n’osa pas
  rationale: Rend directement l’idée de ne pas oser ou se risquer à faire quelque chose.
- source_word: κρίσιν ἐπενεγκεῖν βλασφημίας
  choice: porter contre lui un jugement injurieux
  rationale: Conserve la tournure judiciaire de κρίσις et ἐπιφέρω, tout en rendant βλασφημία comme la nature injurieuse de la condamnation. La construction grecque demeure discutée, d’où l’alternative en note.
- source_word: Ἐπιτιμήσαι σοι κύριος
  choice: Que le Seigneur te réprimande !
  rationale: Le souhait exprimé par l’optatif aoriste se rend naturellement en français par « Que… », sans le transformer en simple affirmation.
- source_word: κύριος
  choice: le Seigneur
  rationale: Équivalent français établi de κύριος dans ce contexte biblique.
theological_decisions:
- issue: Nature de la retenue de Michel envers le diable
  choice: Michel s’abstient de porter lui-même un jugement injurieux et en appelle à la réprimande du Seigneur.
  alternative: Michel refuse soit un jugement blasphématoire, soit une accusation outrageante.
  rationale: La syntaxe de κρίσιν … βλασφημίας est difficile. La traduction maintient le contraste explicite entre la retenue de Michel et son appel à l’autorité du Seigneur, sans imposer une théorie particulière sur les anges ni trancher excessivement l’ambiguïté.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la structure contrastive du grec. « Contester » et « discuter » reflètent les deux verbes voisins sans produire une répétition artificielle ; « réprimander » garde le ton d’une réprobation autoritative.
