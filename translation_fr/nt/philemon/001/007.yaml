source:
  edition: SBLGNT
  text: ⸀χαρὰν γὰρ ⸂πολλὴν ἔσχον⸃ καὶ παράκλησιν ἐπὶ τῇ ἀγάπῃ σου, ὅτι τὰ σπλάγχνα τῶν ἁγίων ἀναπέπαυται διὰ σοῦ, ἀδελφέ.
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/007.yaml
  text: For I had much joy and encouragement because of your love[a], because the hearts of the saints have been refreshed through you, brother.
translation:
  language: fr
  text: Car j’ai ressenti une grande joie et un grand réconfort à cause de ton amour, parce que les cœurs des saints[a] ont été réconfortés grâce à toi, frère.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les entrailles des saints », expression qui désigne leurs affections profondes ou leur être intérieur.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χαρὰν
  choice: joie
  rationale: Équivalent français courant de χαρά, qui exprime ici la joie éprouvée par Paul.
- source_word: πολλὴν ἔσχον
  choice: j’ai éprouvé beaucoup de
  rationale: Le verbe ἔχω exprime ici l’expérience de la joie et de l’encouragement; « éprouver » est plus idiomatique en français que « avoir » avec ces deux compléments.
- source_word: παράκλησιν
  choice: encouragement
  rationale: Le terme peut signifier encouragement, réconfort ou consolation. « Encouragement » convient au soutien que l’amour de Philémon apporte à Paul.
- source_word: ἐπὶ τῇ ἀγάπῃ σου
  choice: à cause de ton amour
  rationale: ἐπί avec le datif indique ici le fondement ou la cause de la joie et de l’encouragement.
- source_word: σπλάγχνα
  choice: le cœur
  rationale: Littéralement les organes internes, le mot désigne par idiome le siège des affections profondes. Le singulier collectif « le cœur des saints » est naturel et conserve cette dimension intérieure.
- source_word: τῶν ἁγίων
  choice: des saints
  rationale: Le terme paulinien désigne les croyants consacrés à Dieu. « Saints » préserve le vocabulaire ecclésial du texte sans supposer une canonisation ultérieure.
- source_word: ἀναπέπαυται
  choice: a trouvé du repos
  rationale: Le parfait souligne un état présent résultant de l’action de Philémon. Cette traduction conserve l’image du repos et le lien lexical avec le verset 20.
- source_word: διὰ σοῦ
  choice: grâce à toi
  rationale: διά avec le génitif exprime l’intermédiaire ou l’agent. « Grâce à toi » est naturel en français et convient à la valeur positive du contexte.
- source_word: ἀδελφέ
  choice: frère
  rationale: Le vocatif direct est conservé sans ajouter un adjectif absent du grec.
theological_decisions:
- issue: Sens de ἅγιοι
  choice: saints
  alternative: ceux qui appartiennent à Dieu; croyants
  rationale: « Saints » conserve la manière paulinienne de désigner collectivement les personnes mises à part pour Dieu, sans restreindre le terme à une catégorie canonisée.
- issue: Image anthropologique de σπλάγχνα
  choice: le cœur
  alternative: les affections profondes; l’être intérieur
  rationale: « Le cœur » rend naturellement en français le siège de la vie affective profonde tout en évitant un littéralisme anatomique trompeur; la note signale l’image grecque.
- issue: Valeur de ἀναπέπαυται
  choice: a trouvé du repos
  alternative: a été réconforté; a été revigoré
  rationale: Le choix maintient l’image du repos et la valeur résultative du parfait sans réduire l’effet de l’action de Philémon à une émotion passagère.
translation_notes:
  register: Français moderne, digne et accessible. Le tutoiement correspond à l’adresse personnelle au singulier. La phrase conserve la répétition causale du grec (« car… puisque ») tout en restant naturelle.
