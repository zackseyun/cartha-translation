  yaml_path: translation/nt/philemon/001/018.yaml
  text: But if he has wronged you in any way or owes you anything[a], charge this to me.
translation:
  language: fr
  text: Mais s’il t’a fait du tort ou te doit quelque chose, porte cela à mon compte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « mets cela sur mon compte ». Le verbe relève du vocabulaire comptable et signifie inscrire ou imputer quelque chose au compte de quelqu’un.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δέ
  choice: Mais si
  rationale: La tournure introduit une condition avec une légère opposition ou transition par rapport à ce qui précède. « Mais si » est naturel et fidèle à cette nuance.
- source_word: τι ἠδίκησέν σε
  choice: il t’a fait du tort
  rationale: Le verbe ἀδικέω désigne le fait d’agir injustement envers quelqu’un ou de lui causer un tort. Cette formulation reste assez large pour inclure un préjudice personnel ou matériel.
- source_word: ἢ ὀφείλει
  choice: ou te doit quelque chose
  rationale: ὀφείλω exprime ici une dette ou une obligation. Le complément « te » est fourni par le contexte, tandis que « quelque chose » rend naturellement la portée indéfinie.
- source_word: τοῦτο ἐμοὶ ἐλλόγα
  choice: porte-le à mon compte
  rationale: ἐλλογέω appartient au vocabulaire comptable et signifie inscrire ou imputer une somme au compte de quelqu’un. Cette expression française conserve clairement la métaphore sans employer de jargon théologique.
theological_decisions: []
translation_notes:
  register: Français international moderne, simple et digne. Le tutoiement est conservé conformément au singulier grec et à la relation personnelle de la lettre. La formulation maintient la portée générale du tort possible et la métaphore comptable explicite.
