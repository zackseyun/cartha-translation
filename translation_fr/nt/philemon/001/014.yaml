  text: χωρὶς δὲ τῆς σῆς γνώμης οὐδὲν ἠθέλησα ποιῆσαι, ἵνα μὴ ὡς κατὰ ἀνάγκην τὸ ἀγαθόν σου ᾖ ἀλλὰ κατὰ ἑκούσιον·
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/014.yaml
  text: But without your consent I wanted to do nothing[a], so that your good deed might not be as if by compulsion[c][b], but voluntary.
translation:
  language: fr
  text: Mais je n’ai rien voulu faire sans ton accord[a], afin que ton bienfait[b] ne soit pas comme s’il était imposé, mais de ton plein gré[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sans ton approbation » ou « sans connaître ton avis ».
    reason: lexical_alternative
  - marker: b
    text: Ou « ta bonté » ou « le bien qui vient de toi » ; le grec peut désigner soit la bonne action de Philémon dans cette affaire, soit, de manière plus générale, sa bonté.
    reason: lexical_alternative
  - marker: c
    text: Littéralement « selon ce qui est volontaire » ; c’est-à-dire « librement » ou « de ton propre gré ».
    reason: lexical_alternative
lexical_decisions:
- source_word: χωρὶς ... τῆς σῆς γνώμης
  choice: sans ton accord
  rationale: γνώμη peut désigner l’avis, le jugement, l’intention ou l’approbation. Dans ce contexte, « accord » exprime naturellement le fait que Paul refuse d’agir sans l’assentiment de Philémon.
- source_word: οὐδὲν ἠθέλησα ποιῆσαι
  choice: je n’ai rien voulu faire
  rationale: Cette formulation rend directement la volonté exprimée par θέλω, sans transformer celle-ci en décision formelle.
- source_word: ἵνα μὴ
  choice: afin que ... ne ... pas
  rationale: La tournure conserve clairement la valeur de but de ἵνα tout en restant naturelle dans un registre français digne.
- source_word: τὸ ἀγαθόν σου
  choice: le bien que tu ferais
  rationale: Le grec peut évoquer soit une bonne action concrète de Philémon, soit plus largement sa bonté. La formulation retenue convient au contexte sans préciser la nature exacte de l’acte.
- source_word: ὡς κατὰ ἀνάγκην
  choice: comme sous la contrainte
  rationale: ἀνάγκη évoque ici une pression ou une contrainte. « Comme » rend ὡς et évite d’affirmer simplement que Philémon aurait effectivement été contraint.
- source_word: ἀλλὰ κατὰ ἑκούσιον
  choice: mais de ton plein gré
  rationale: Cette expression française idiomatique restitue le caractère volontaire désigné par ἑκούσιον et marque nettement l’opposition avec la contrainte.
theological_decisions:
- issue: Nature de la réponse de Philémon
  choice: Présenter le bien envisagé comme un acte libre plutôt que contraint, sans en préciser davantage la nature.
  alternative: Traduire plus abstraitement par « ta bonté » ou plus concrètement par « ton bienfait ».
  rationale: Le verset met l’accent sur le caractère volontaire de la réponse de Philémon. Le grec laisse toutefois le bien concerné implicite; la traduction ne doit donc pas imposer une interprétation doctrinale ou éthique plus précise.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement suit la relation personnelle exprimée par les formes grecques au singulier. La phrase conserve le contraste entre contrainte et libre volonté ainsi que l’ambiguïté relative de τὸ ἀγαθόν σου.
