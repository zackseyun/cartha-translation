  text: πεποιθὼς τῇ ὑπακοῇ σου ἔγραψά σοι, εἰδὼς ὅτι καὶ ὑπὲρ ⸀ἃ λέγω ποιήσεις.
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/021.yaml
  text: Confident of your obedience[a], I wrote to you, knowing that you will do even more than I say.
translation:
  language: fr
  text: Ayant confiance en ton obéissance, je t’écris, sachant que tu feras même plus que ce que je dis.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « au-delà de ce que je dis ». Paul peut laisser entendre que Philémon ira au-delà de ce qu’il lui demande, sans préciser de quelle manière.
    reason: lexical_alternative
lexical_decisions:
- source_word: πεποιθὼς
  choice: Confiant
  rationale: Le participe parfait exprime un état établi de confiance. « Confiant » restitue naturellement cette assurance tout en gardant le lien circonstanciel avec l’acte d’écrire.
- source_word: τῇ ὑπακοῇ σου
  choice: dans ton obéissance
  rationale: Ὑπακοή désigne l’obéissance ou la disposition à répondre à une instruction. « Obéissance » en conserve la portée relationnelle et morale; « dans » est idiomatique après « confiant ».
- source_word: ἔγραψά σοι
  choice: je t’écris
  rationale: L’aoriste épistolaire peut se rendre au présent du point de vue du destinataire lisant la lettre. En français, « je t’écris » est naturel dans une lettre et ne modifie pas le sens.
- source_word: εἰδὼς
  choice: sachant
  rationale: Le participe parfait exprime ici la connaissance assurée qui accompagne l’écriture. « Sachant » préserve la construction participiale et la confiance rhétorique de Paul.
- source_word: καὶ ὑπὲρ ἃ λέγω
  choice: même plus que ce que je dis
  rationale: Ὑπέρ avec l’accusatif signifie « au-delà de » ou « plus que ». Cette formulation garde l’idée que Philémon dépassera la demande formulée, sans préciser de quelle manière.
- source_word: ποιήσεις
  choice: tu feras
  rationale: Le futur de ποιέω reste volontairement général. « Tu feras » conserve cette ouverture sans introduire une action particulière.
theological_decisions:
- issue: Portée de ὑπακοή dans l’appel de Paul
  choice: « obéissance »
  alternative: « acquiescement » ou « empressement à répondre »
  rationale: Le terme grec porte explicitement l’idée d’obéissance. Le conserver maintient la dynamique d’autorité présente dans la lettre sans ajouter une notion de contrainte.
- issue: Implication de « plus que ce que je dis »
  choice: L’attente reste indéterminée.
  alternative: Y voir une demande implicite d’affranchir Onésime, ou seulement de l’accueillir généreusement.
  rationale: La formulation de Paul est suggestive, mais elle ne précise pas l’action supplémentaire attendue. La traduction préserve cette ambiguïté réelle.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement correspond à l’adresse grecque au singulier et au ton personnel de la lettre. La phrase conserve la structure rhétorique de l’original sans expliciter l’action supplémentaire envisagée.
