id: PHM.1.13
reference: Philemon 1:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὃν ἐγὼ ἐβουλόμην πρὸς ἐμαυτὸν κατέχειν, ἵνα ὑπὲρ σοῦ ⸂μοι διακονῇ⸃ ἐν τοῖς δεσμοῖς τοῦ εὐαγγελίου,
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/013.yaml
  text: I wanted to keep him with me[a], so that on your behalf he might serve me in the chains of the gospel,
translation:
  language: fr
  text: Je voulais le garder auprès de moi, afin qu’il me serve de ta part dans les chaînes de l’Évangile[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « dans les chaînes que je porte à cause de l’Évangile ».'
    reason: Le génitif τοῦ εὐαγγελίου peut indiquer que Paul porte ces chaînes en raison de l’Évangile.
lexical_decisions:
- source_word: ὃν
  choice: le
  rationale: Le pronom relatif accusatif masculin renvoie à Onésime. En français, la reprise par « le » dans la proposition principale est naturelle et claire.
- source_word: ἐβουλόμην
  choice: je voulais
  rationale: L’imparfait de βούλομαι exprime ici le désir ou l’intention de Paul dans le passé. « Je voulais » en rend naturellement la valeur sans surinterpréter l’aspect verbal.
- source_word: πρὸς ἐμαυτὸν
  choice: auprès de moi
  rationale: Avec κατέχειν, l’expression indique que Paul souhaitait garder Onésime en sa compagnie. « Auprès de moi » est naturel et légèrement plus précis que « avec moi ».
- source_word: κατέχειν
  choice: garder
  rationale: Dans ce contexte, le verbe signifie retenir quelqu’un auprès de soi. « Garder » est courant et ne suggère pas nécessairement une contrainte.
- source_word: ἵνα
  choice: afin que
  rationale: Cette tournure exprime clairement le but tout en convenant au registre digne de la lettre.
- source_word: ὑπὲρ σοῦ
  choice: de ta part
  rationale: La préposition avec le génitif indique que le service d’Onésime aurait été rendu au nom de Philémon ou pour son compte. « De ta part » préserve cette représentation sans imposer l’idée forte d’un remplacement.
- source_word: μοι διακονῇ
  choice: qu’il me serve
  rationale: διακονέω désigne ici un service ou une assistance apportée à Paul. « Servir » conserve l’étendue du terme sans lui donner un sens ecclésiastique trop spécialisé.
- source_word: ἐν τοῖς δεσμοῖς
  choice: dans les chaînes
  rationale: δεσμοί évoque concrètement les liens ou les chaînes et, par extension, l’emprisonnement. La formulation conserve l’image paulinienne.
- source_word: τοῦ εὐαγγελίου
  choice: de l’Évangile
  rationale: Le génitif grec associe étroitement les chaînes de Paul à l’Évangile sans préciser explicitement la nature exacte du rapport. La traduction compacte conserve cette ambiguïté, expliquée en note.
theological_decisions:
- issue: Valeur de τοῦ εὐαγγελίου en relation avec δεσμοῖς
  choice: les chaînes de l’Évangile
  alternative: les chaînes que je porte à cause de l’Évangile
  rationale: 'Le génitif peut notamment être compris dans un sens causal : Paul est enchaîné à cause de l’Évangile. Le texte principal conserve toutefois la formulation compacte et ambiguë du grec plutôt que de trancher explicitement.'
translation_notes:
  register: Français international actuel, naturel et digne. Le tutoiement respecte la deuxième personne du singulier adressée à Philémon. La phrase conserve l’image concrète des chaînes ainsi que la relation volontairement compacte entre l’emprisonnement de Paul et l’Évangile.
