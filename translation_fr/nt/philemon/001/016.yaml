  text: οὐκέτι ὡς δοῦλον ἀλλὰ ὑπὲρ δοῦλον, ἀδελφὸν ἀγαπητόν, μάλιστα ἐμοί, πόσῳ δὲ μᾶλλον σοὶ καὶ ἐν σαρκὶ καὶ ἐν κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/016.yaml
  text: no longer as a servant[a], but more than a servant, a beloved brother—especially to me, but how much more to you[b], both in the flesh and in the Lord.
translation:
  language: fr
  text: 'non plus comme un esclave[a], mais bien plus qu’un esclave : un frère bien-aimé, surtout pour moi, et combien plus encore pour toi, aussi bien dans la chair[b] que dans le Seigneur.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une personne en servitude ». Le mot grec désigne ici vraisemblablement la condition sociale servile d’Onésime.
    reason: alternative_reading
  - marker: b
    text: Ici, « dans la chair » renvoie vraisemblablement aux relations terrestres, sociales ou personnelles, et non à la nature pécheresse.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκέτι ὡς δοῦλον
  choice: non plus comme un esclave
  rationale: « Non plus » exprime naturellement le changement de situation indiqué par οὐκέτι, tandis que « comme » conserve ὡς. Dans ce contexte social, « esclave » rend sans l’atténuer la condition servile évoquée par δοῦλος.
- source_word: ὑπὲρ δοῦλον
  choice: bien plus qu’un esclave
  rationale: Ici, ὑπέρ marque le dépassement de statut ou de valeur. « Bien plus que » restitue à la fois la comparaison et son intensité.
- source_word: ἀδελφὸν ἀγαπητόν
  choice: un frère bien-aimé
  rationale: Cette formulation conserve directement la métaphore familiale chrétienne et rend ἀγαπητός dans un registre biblique actuel et digne.
- source_word: μάλιστα ἐμοί
  choice: tout particulièrement pour moi
  rationale: La tournure exprime clairement le degré particulier signalé par μάλιστα et s’accorde naturellement avec « frère bien-aimé ».
- source_word: πόσῳ δὲ μᾶλλον σοὶ
  choice: et combien plus encore pour toi
  rationale: « Combien plus encore » préserve la force rhétorique de πόσῳ μᾶλλον; « et » convient ici à la progression du raisonnement, le δέ étant légèrement contrastif ou continuatif.
- source_word: καὶ ἐν σαρκὶ καὶ ἐν κυρίῳ
  choice: aussi bien dans la chair que dans le Seigneur
  rationale: La construction corrélative rend les deux καί. Le maintien de « dans la chair » et « dans le Seigneur » conserve le parallélisme paulinien ainsi que l’étendue relationnelle et théologique de l’expression.
theological_decisions:
- issue: Traduction de δοῦλος dans la situation d’Onésime
  choice: esclave
  alternative: serviteur; personne en servitude
  rationale: Le contexte de la lettre met au premier plan la condition sociale servile d’Onésime. « Esclave » préserve cette réalité historique et donne toute sa force au contraste « bien plus qu’un esclave », sans déterminer à lui seul toutes les particularités juridiques de sa condition.
- issue: Sens de ἐν σαρκὶ καὶ ἐν κυρίῳ
  choice: aussi bien dans la chair que dans le Seigneur
  alternative: aussi bien dans les relations humaines que dans le Seigneur; aussi bien personnellement que dans le Seigneur
  rationale: L’expression semble embrasser à la fois la relation terrestre, corporelle ou sociale et la relation chrétienne. La formulation littérale préserve cette amplitude et évite d’identifier ici « chair » à la nature pécheresse.
translation_notes:
  register: Français international moderne, naturel et digne. Le verset conserve le contraste social marqué par « esclave », la métaphore familiale « frère bien-aimé » et le parallélisme théologique « dans la chair… dans le Seigneur ». La ponctuation met en relief l’apposition sans ajouter d’interprétation absente du grec.
