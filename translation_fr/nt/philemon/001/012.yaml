  text: I am sending him back to you—him[a], that is[b], my very heart.
translation:
  language: fr
  text: Je te le renvoie[a] — lui, c’est-à-dire mon propre cœur[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus formellement : « Je te l’ai renvoyé. » L’aoriste grec peut être rendu de plusieurs manières ; le présent adopte la perspective de la lettre au moment où Philémon la reçoit.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « mes propres entrailles » ; dans cet emploi, l’expression désigne le siège des sentiments profonds et de la tendre affection.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃν
  choice: le
  rationale: Pronom relatif masculin singulier à l’accusatif renvoyant à Onésime; en français, la reprise par « le » dans la proposition principale est naturelle et rend clairement l’objet de « renvoie ».
- source_word: ἀνέπεμψά
  choice: Je … renvoie
  rationale: L’aoriste de ἀναπέμπω signifie « renvoyer, faire retourner ». Le présent épistolaire français convient à l’action accomplie par l’envoi de la lettre, telle qu’elle se présente à Philémon lors de sa réception.
- source_word: σοι
  choice: te
  rationale: Le datif de la deuxième personne du singulier désigne le destinataire; le pronom « te » est la formulation française naturelle.
- source_word: αὐτόν
  choice: lui-même
  rationale: La reprise emphatique du pronom après σοι est conservée par « lui-même », sans éliminer l’insistance inhabituelle du grec.
- source_word: τοῦτ’ ἔστιν
  choice: c’est-à-dire
  rationale: Formule explicative standard qui introduit l’apposition et maintient le lien d’identification établi par Paul.
- source_word: τὰ ἐμὰ σπλάγχνα
  choice: mon propre cœur
  rationale: σπλάγχνα désigne littéralement les entrailles, mais, dans cet emploi affectif, le siège des sentiments profonds. « Mon propre cœur » transmet en français moderne l’intimité et l’intensité de l’expression, tout en laissant la note signaler l’image grecque.
theological_decisions:
- issue: Métaphore anthropologique de σπλάγχνα
  choice: mon propre cœur
  alternative: mes entrailles; ma profonde affection
  rationale: Il s’agit d’une métaphore affective plutôt que d’une affirmation doctrinale sur l’être humain. La traduction idiomatique communique la profonde affection de Paul et son identification personnelle à Onésime, sans surinterprétation théologique.
- issue: Valeur temporelle de l’aoriste ἀνέπεμψά
  choice: Je te le renvoie
  alternative: Je te l’ai renvoyé; je te le renvoyai
  rationale: 'Le présent adopte la perspective épistolaire: l’envoi devient effectif pour Philémon avec l’arrivée de la lettre et d’Onésime. Une note conserve les autres représentations possibles de l’aoriste.'
translation_notes:
  register: Français international moderne, naturel et digne. La construction détachée « lui-même » conserve l’emphase du grec, tandis que « mon propre cœur » rend l’image affective de façon immédiatement compréhensible. Tous les appels de note figurent dans le texte.
