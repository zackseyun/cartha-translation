id: PHM.1.1
reference: Philemon 1:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Παῦλος δέσμιος Χριστοῦ Ἰησοῦ καὶ Τιμόθεος ὁ ἀδελφὸς Φιλήμονι τῷ ἀγαπητῷ καὶ συνεργῷ ἡμῶν
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/001.yaml
  text: Paul[a], a prisoner of Messiah Jesus, and Timothy our brother, to Philemon our beloved fellow worker[b],
translation:
  language: fr
  text: Paul, prisonnier du Messie Jésus[a], et Timothée, notre frère, à Philémon, notre bien-aimé collaborateur,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi comprendre : « prisonnier à cause du Messie Jésus ». Le génitif grec peut indiquer soit une relation d’appartenance, soit la cause de l’emprisonnement.'
    reason: alternative_reading
lexical_decisions:
- source_word: δέσμιος
  choice: prisonnier
  rationale: Le nom désigne une personne détenue ou dans les chaînes. « Prisonnier » est l’équivalent français moderne le plus direct.
- source_word: Χριστοῦ
  choice: du Messie
  rationale: Χριστός garde ici sa valeur de titre. « Messie » en transmet le sens plutôt que de simplement transcrire « Christ ».
- source_word: Ἰησοῦ
  choice: Jésus
  rationale: Forme française usuelle du nom propre.
- source_word: ὁ ἀδελφός
  choice: notre frère
  rationale: Bien que le grec dise littéralement « le frère », « notre frère » exprime naturellement en français la relation fraternelle implicite au sein de la communauté.
- source_word: ἀγαπητῷ
  choice: bien-aimé
  rationale: Ce terme conserve la chaleur de l’affection exprimée, dans un registre digne et courant dans le contexte biblique.
- source_word: συνεργῷ
  choice: collaborateur
  rationale: Le mot désigne quelqu’un qui travaille avec d’autres. « Collaborateur » est naturel en français et conserve l’idée d’un travail accompli en commun.
- source_word: ἡμῶν
  choice: notre
  rationale: Le pluriel grec est conservé et correspond aux deux expéditeurs nommés, Paul et Timothée.
- source_word: Φιλήμονι
  choice: à Philémon
  rationale: Le datif indique ici le destinataire de la lettre et se rend naturellement par « à ».
- source_word: καὶ Τιμόθεος
  choice: et Timothée
  rationale: Timothée est associé à Paul dans la formule d’envoi.
theological_decisions:
- issue: Sens du génitif Χριστοῦ Ἰησοῦ après δέσμιος
  choice: prisonnier du Messie Jésus
  alternative: prisonnier à cause du Messie Jésus
  rationale: La formulation principale conserve la concision et l’ambiguïté relationnelle du génitif grec; la note signale explicitement la lecture causale possible.
- issue: Rendu de Χριστός dans la salutation
  choice: Messie
  alternative: Christ
  rationale: Dans cette identification, Χριστός demeure intelligible comme un titre et est donc traduit par son sens, « Messie ».
translation_notes:
  register: Français international moderne, naturel et digne. La formule épistolaire reste volontairement inachevée, puisque la phrase se poursuit dans les versets suivants. « Notre bien-aimé collaborateur » évite une tournure lourde tout en conservant l’affection et le travail partagé exprimés par le grec.
