lexical_decisions:
- source_word: Εὐχαριστῶ
  choice: Je remercie
  rationale: Le présent actif à la première personne est rendu directement et naturellement en français. « Je rends grâce » serait possible, mais plus soutenu.
- source_word: τῷ θεῷ μου
  choice: mon Dieu
  rationale: Le datif désigne la personne remerciée; la construction française « remercier mon Dieu » est naturelle et conserve le possessif personnel.
- source_word: πάντοτε
  choice: toujours
  rationale: Cet adverbe exprime la constance ou la régularité et se traduit directement par « toujours ».
- source_word: μνείαν σου ποιούμενος
  choice: lorsque je fais mention de toi
  rationale: Cette tournure conserve l'idée explicite de mentionner Philémon, plutôt que de la réduire silencieusement à « me souvenir de toi ». « Lorsque » exprime naturellement le rapport circonstanciel du participe avec le verbe principal sans imposer une ponctuation française maladroite.
- source_word: ἐπὶ τῶν προσευχῶν μου
  choice: dans mes prières
  rationale: Avec les prières, ἐπί suivi du génitif désigne ici le cadre ou l'occasion; « dans mes prières » est idiomatique et clair en français.
