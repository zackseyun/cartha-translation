source:
  edition: SBLGNT
  text: τόν ποτέ σοι ἄχρηστον νυνὶ ⸀δὲ σοὶ καὶ ἐμοὶ εὔχρηστον,
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/011.yaml
  text: who once was useless to you[a], but now is useful both to you and to me,
translation:
  language: fr
  text: lui qui autrefois t’était inutile[a], mais qui maintenant est utile tant pour toi que pour moi,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Paul fait probablement un jeu de mots sur le nom d’Onésime, qui évoque l’idée d’être utile ou avantageux.
    reason: lexical_alternative
lexical_decisions:
- source_word: τόν
  choice: lui qui
  rationale: L’article accusatif reprend Onésime, mentionné au verset précédent. « Lui qui » poursuit naturellement la phrase en français tout en gardant cette reprise anaphorique.
- source_word: ποτέ
  choice: autrefois
  rationale: Exprime clairement le temps passé et forme un contraste naturel avec νυνί, « maintenant ».
- source_word: σοι
  choice: te
  rationale: Le pronom datif avec l’expression « être d’aucune utilité » se rend idiomatiquement par « te » en français.
- source_word: ἄχρηστον
  choice: d’aucune utilité
  rationale: Rend le sens de « sans utilité » dans un français naturel et digne, tout en maintenant l’opposition lexicale avec εὔχρηστον.
- source_word: νυνὶ δὲ
  choice: mais qui maintenant
  rationale: « Mais » conserve la valeur adversative de δέ, tandis que « maintenant » répond directement à « autrefois ».
- source_word: σοὶ καὶ ἐμοὶ
  choice: à toi comme à moi
  rationale: Cette tournure française marque nettement que l’utilité vaut pour les deux personnes et reflète la construction coordonnée grecque.
- source_word: εὔχρηστον
  choice: utile
  rationale: Équivalent moderne et direct de « utile, avantageux »; il conserve le contraste intentionnel avec ἄχρηστον et l’écho probable au nom Onésime.
theological_decisions:
- issue: Jeu de mots possible sur le nom d’Onésime et changement de conduite ou de situation
  choice: Conserver dans le texte l’opposition simple entre « d’aucune utilité » et « utile »
  alternative: 'Expliciter le jeu de mots, par exemple : « autrefois inutile… maintenant vraiment utile »'
  rationale: Le grec établit lui-même le contraste sans expliquer le jeu de mots. Une traduction directe préserve l’effet littéraire et la tension sur la nature exacte du changement, sans ajouter une interprétation morale ou doctrinale.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation maintient le parallélisme temporel « autrefois… maintenant » ainsi que l’opposition lexicale du grec. La virgule finale signale que le verset poursuit la phrase commencée au verset précédent.
