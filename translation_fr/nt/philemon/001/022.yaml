reference: Philemon 1:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἅμα δὲ καὶ ἑτοίμαζέ μοι ξενίαν, ἐλπίζω γὰρ ὅτι διὰ τῶν προσευχῶν ὑμῶν χαρισθήσομαι ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/022.yaml
  text: At the same time also prepare a guest room for me[b][a], for I hope that through your prayers I will be granted to you.
translation:
  language: fr
  text: En même temps, prépare-moi aussi un logement[a], car j’espère que, grâce à vos prières, je vous serai accordé[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un hébergement » ou « l’hospitalité » ; le terme grec peut désigner soit l’accueil offert à un hôte, soit le lieu où il loge.
    reason: lexical_alternative
  - marker: b
    text: Ou « je vous serai donné » ; le verbe grec évoque ce qui est accordé librement ou par grâce et laisse probablement entendre que Dieu en est l’auteur.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἅμα δὲ καὶ
  choice: En même temps… aussi
  rationale: La tournure introduit une demande supplémentaire liée à ce qui précède; « en même temps » rend ἅμα, tandis que « aussi » préserve καί, δέ étant porté par l’enchaînement.
- source_word: ἑτοίμαζέ μοι
  choice: prépare-moi
  rationale: L’impératif présent appelle une mesure pratique; le pronom complément exprime naturellement le bénéficiaire en français.
- source_word: ξενίαν
  choice: un logement
  rationale: Le terme peut désigner l’hospitalité ou le lieu où loge un hôte. Avec « préparer », le sens concret d’un hébergement est le plus naturel, sans préciser indûment qu’il s’agit d’une chambre.
- source_word: ἐλπίζω γὰρ ὅτι
  choice: car j’espère que
  rationale: « Car » conserve la valeur explicative de γάρ et « j’espère que » introduit directement le contenu de l’attente.
- source_word: διὰ τῶν προσευχῶν ὑμῶν
  choice: grâce à vos prières
  rationale: διά avec le génitif exprime ici le moyen; cette formulation française est naturelle et garde l’idée que les prières contribuent au résultat.
- source_word: χαρισθήσομαι ὑμῖν
  choice: je vous serai accordé
  rationale: Le futur passif est conservé, ainsi que l’idée d’un don ou d’une faveur. Cette formulation évite d’ajouter explicitement la libération ou de nommer l’agent divin implicite.
theological_decisions:
- issue: Sens de χαρισθήσομαι et agent du passif
  choice: je vous serai accordé
  alternative: je vous serai rendu / je vous serai donné par grâce
  rationale: Paul se présente comme celui qui sera accordé aux destinataires, probablement par Dieu. Le texte garde le passif et son caractère inhabituel sans expliciter l’agent ni réduire le sens à une sortie de prison.
translation_notes:
  register: Français international moderne, naturel et digne. « Logement » évite le régionalisme possible de « chambre d’amis » et reste assez large pour refléter ξενία. La formulation passive inhabituelle « je vous serai accordé » préserve la tension du grec.
