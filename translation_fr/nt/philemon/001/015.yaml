id: PHM.1.15
reference: Philemon 1:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τάχα γὰρ διὰ τοῦτο ἐχωρίσθη πρὸς ὥραν ἵνα αἰώνιον αὐτὸν ἀπέχῃς,
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/015.yaml
  text: For perhaps he was separated from you for a time so that you might have him back forever,[a]
translation:
  language: fr
  text: C’est peut-être pour cela qu’il a été séparé de toi pour un temps, afin que tu le retrouves pour toujours.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « il s’est éloigné de toi pour quelque temps ». Le passif grec, « a été séparé », peut éviter avec délicatesse d’attribuer directement la faute et peut aussi laisser entendre un dessein divin.'
    reason: alternative_reading
lexical_decisions:
- source_word: τάχα
  choice: peut-être
  rationale: Exprime l'inférence prudente et modeste de Paul sans en faire une certitude.
- source_word: γὰρ
  choice: car
  rationale: Conserve le lien explicatif avec ce qui précède dans un français naturel et digne.
- source_word: διὰ τοῦτο
  choice: afin que
  rationale: La tournure française articule naturellement la raison possible de la séparation avec le but introduit ensuite; l'idée de « pour cette raison » est portée par l'ensemble « peut-être… afin que ».
- source_word: ἐχωρίσθη
  choice: a-t-il été séparé de toi
  rationale: 'Le passif préserve la retenue du grec: il n''attribue explicitement l''action ni à Onésime ni à Dieu, tout en laissant ouverte une lecture providentielle.'
- source_word: πρὸς ὥραν
  choice: pour un temps
  rationale: Rend l'expression idiomatique désignant une durée limitée et maintient son contraste avec « pour toujours ».
- source_word: ἵνα
  choice: afin que
  rationale: Marque clairement le but ou le résultat envisagé.
- source_word: αἰώνιον
  choice: pour toujours
  rationale: L'adjectif est employé adverbialement et s'oppose à la séparation temporaire, tout en gardant une possible profondeur spirituelle.
- source_word: αὐτὸν
  choice: le
  rationale: Pronom objet renvoyant à Onésime.
- source_word: ἀπέχῃς
  choice: tu le retrouves
  rationale: Exprime ici le fait de l'avoir de nouveau auprès de soi. « Retrouves » est relationnel et idiomatique, sans appuyer excessivement l'idée de possession.
theological_decisions:
- issue: Agent implicite du passif ἐχωρίσθη
  choice: Maintenir le passif « a-t-il été séparé » sans nommer l'agent.
  alternative: « il s'est éloigné » ou « Dieu l'a séparé »
  rationale: La formulation de Paul peut atténuer la responsabilité directe d'Onésime et laisser entrevoir la providence divine, sans l'affirmer explicitement.
translation_notes:
  register: Français international moderne, naturel et digne. L'inversion « peut-être a-t-il » convient au registre épistolaire sans être archaïque. Le passif et la note préservent l'ambiguïté théologique du texte source.
