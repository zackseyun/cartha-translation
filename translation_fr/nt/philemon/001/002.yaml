id: PHM.1.2
reference: Philemon 1:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ Ἀπφίᾳ τῇ ⸀ἀδελφῇ καὶ Ἀρχίππῳ τῷ συστρατιώτῃ ἡμῶν καὶ τῇ κατ’ οἶκόν σου ἐκκλησίᾳ·
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/002.yaml
  text: 'and to Apphia our sister[a], and to Archippus our fellow soldier, and to the church in your house:'
translation:
  language: fr
  text: 'et à Apphia, la sœur[a], à Archippe, notre compagnon d’armes, et à l’église qui est dans ta maison :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Certains manuscrits portent « notre sœur » au lieu de « la sœur ».
    reason: textual_variant
lexical_decisions:
- source_word: Ἀπφίᾳ
  choice: Apphia
  rationale: Le nom propre est translittéré selon sa forme française traditionnelle.
- source_word: ἀδελφῇ
  choice: la sœur
  rationale: Le texte du SBLGNT porte l’article défini sans possessif. Cette formulation conserve donc la leçon grecque, malgré son caractère légèrement inhabituel en français.
- source_word: Ἀρχίππῳ
  choice: Archippe
  rationale: La forme française traditionnelle du nom propre est retenue.
- source_word: συστρατιώτῃ
  choice: compagnon d’armes
  rationale: Cette expression française naturelle préserve l’image militaire du nom grec composé et l’idée d’un engagement partagé.
- source_word: ἐκκλησίᾳ
  choice: Église
  rationale: Dans ce contexte chrétien, « Église » désigne naturellement la communauté locale réunie; la majuscule éditoriale marque ici la communauté croyante.
- source_word: κατ’ οἶκόν σου
  choice: qui se réunit dans ta maison
  rationale: Cette formulation explicite idiomatiquement en français que la communauté se rassemble dans la maison, sens contextuel de l’expression grecque.
- source_word: καὶ
  choice: ainsi qu’à … à … et à
  rationale: La coordination additive de la salutation est conservée tout en évitant une succession lourde de « et » en français.
theological_decisions:
- issue: Faut-il ajouter le possessif « notre » à ἀδελφῇ ?
  choice: la sœur
  alternative: notre sœur
  rationale: Le texte principal du SBLGNT ne contient pas ἡμῶν (« notre »). La traduction suit cette leçon sans harmonisation avec la variante manuscrite, laquelle est signalée en note.
- issue: Faut-il rendre explicitement la réunion de l’Église dans la maison ?
  choice: l’Église qui se réunit dans ta maison
  alternative: l’Église dans ta maison
  rationale: La formulation explicite est plus naturelle et intelligible en français, sans décider au-delà de ce qu’implique normalement l’expression κατ’ οἶκόν dans ce contexte.
translation_notes:
  register: Français moderne, digne et accessible. Le tutoiement correspond au singulier σου adressé à Philémon. « Compagnon d’armes » maintient la métaphore paulinienne sans donner l’impression d’un service militaire littéral. La ponctuation finale conserve le caractère continu de l’adresse épistolaire.
