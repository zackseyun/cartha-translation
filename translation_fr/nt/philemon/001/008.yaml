revisions:
- from: C’est pourquoi, bien que j’aie, dans le Messie[a], une grande liberté pour t’ordonner ce qui convient[b],
  to: C’est pourquoi, bien que j’aie, dans le Messie[a], une grande assurance pour t’ordonner de faire ce qui convient[b],
  rationale: La révision remplace « liberté » par « assurance », qui correspond plus directement à la portée de παρρησία dans cette phrase, et explicite en français l’action sous-entendue dans « ce qui convient ». Elle maintient le titre « Messie », le tutoiement, l’ambiguïté relationnelle de ἐν Χριστῷ et la ponctuation suspendue du verset.
