id: PHM.1.3
reference: Philemon 1:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: χάρις ὑμῖν καὶ εἰρήνη ἀπὸ θεοῦ πατρὸς ἡμῶν καὶ κυρίου Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/003.yaml
  text: Grace to you and peace from God our Father and the Lord Jesus the Messiah[a].
translation:
  language: fr
  text: Que la grâce et la paix vous soient données de la part de Dieu notre Père et du Seigneur Jésus, le Messie[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Jésus-Christ ». Le grec Χριστός peut fonctionner comme un titre (« Messie ») ou, dans certains contextes, davantage comme un nom (« Christ »).'
    reason: alternative_reading
lexical_decisions:
- source_word: χάρις
  choice: la grâce
  rationale: Dans les salutations de Paul, χάρις est à la fois une formule épistolaire et un terme chargé de sens théologique. « Grâce » conserve ces deux dimensions.
- source_word: ὑμῖν
  choice: vous soient données
  rationale: Le datif « à vous » est rendu par une tournure optative naturelle en français, qui exprime le souhait implicite de la formule grecque.
- source_word: εἰρήνη
  choice: la paix
  rationale: Ce choix usuel préserve à la fois la valeur de salutation et l'écho probable du shalom hébreu.
- source_word: ἀπὸ
  choice: de la part de
  rationale: La préposition indique ici la source de la grâce et de la paix ; « de la part de » est idiomatique dans une salutation française.
- source_word: θεοῦ πατρὸς ἡμῶν
  choice: Dieu notre Père
  rationale: 'La suite de génitifs se comprend naturellement en apposition : Dieu est désigné comme notre Père.'
- source_word: κυρίου
  choice: Seigneur
  rationale: « Seigneur » conserve la portée honorifique et christologique de κύριος dans l'usage paulinien.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jésus, le Messie
  rationale: Χριστός désigne l'Oint attendu et garde ici une valeur de titre. La virgule et l'article rendent ce titre naturel et intelligible en français.
theological_decisions:
- issue: Traduction de Χριστοῦ dans le titre christologique Ἰησοῦ Χριστοῦ
  choice: Jésus, le Messie
  alternative: Jésus-Christ
  rationale: « Le Messie » explicite le sens du titre grec sans modifier l'affirmation christologique. Une note conserve la formulation traditionnelle « Jésus-Christ », puisque Χριστός peut aussi fonctionner de manière plus proche d'un nom dans certains contextes.
translation_notes:
  register: Français international moderne, naturel et digne. La tournure « Que… vous soient données » restitue idiomatiquement la formule nominale grecque, tandis que « de la part de » maintient l'idée de source exprimée par ἀπό.
