  text: ναί, ἀδελφέ, ἐγώ σου ὀναίμην ἐν κυρίῳ· ἀνάπαυσόν μου τὰ σπλάγχνα ἐν ⸀Χριστῷ.
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/020.yaml
  text: Yes[a], brother, let me have benefit from you in the Lord[c][b]; refresh my heart in Messiah.
translation:
  language: fr
  text: Oui, frère, que je reçoive de toi ce bienfait[a] dans le Seigneur ; réconforte mon cœur[b] dans le Messie[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « que je retire un avantage de toi ». On peut aussi comprendre : « que j’aie de la joie grâce à toi ». Paul fait peut-être un jeu de mots avec le nom d’Onésime, associé à l’idée d’utilité ou de profit.'
    reason: lexical_alternative
  - marker: b
    text: 'Grec : « mes entrailles », expression désignant les affections profondes ou l’être intérieur.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « dans le Christ ». Le grec Χριστός est rendu ici par « Messie » afin de préserver sa valeur de titre.'
    reason: alternative_reading
lexical_decisions:
- source_word: ναί
  choice: Oui
  rationale: Introduit avec chaleur et insistance la demande de Paul ; « Oui » est direct et naturel en français moderne.
- source_word: ἀδελφέ
  choice: frère
  rationale: Vocatif singulier adressé à Philémon comme frère dans la foi ; le masculin correspond au destinataire.
- source_word: ἐγώ σου ὀναίμην
  choice: rends-moi donc ce service
  rationale: 'L’optatif exprime une demande personnelle : Paul souhaite recevoir de Philémon un bienfait ou un avantage. Cette formulation française est naturelle dans le contexte, tandis qu’une note conserve le sens lexical et le probable jeu de mots avec Onésime.'
- source_word: ἐν κυρίῳ
  choice: dans le Seigneur
  rationale: Conserve la formule paulinienne indiquant la sphère et le fondement de la demande.
- source_word: ἀνάπαυσόν
  choice: réconforte
  rationale: L’impératif appelle Philémon à procurer concrètement repos et soulagement à Paul ; « réconforte » convient au contexte relationnel et rappelle le verset 7.
- source_word: μου τὰ σπλάγχνα
  choice: mon cœur
  rationale: Le pluriel grec désigne littéralement les entrailles, mais fonctionne ici comme une expression de l’être intérieur et des affections profondes ; « mon cœur » est l’équivalent idiomatique naturel.
- source_word: ἐν Χριστῷ
  choice: dans le Messie
  rationale: Χριστός garde ici sa valeur de titre et situe le réconfort demandé dans la communion messianique.
theological_decisions:
- issue: Traduction de Χριστῷ
  choice: Messie
  alternative: Christ
  rationale: Le terme grec est un titre signifiant « oint ». « Messie » en préserve explicitement la portée titulaire, tandis que « Christ » demeure une traduction traditionnelle possible.
- issue: Traduction de κυρίῳ
  choice: le Seigneur
  alternative: le Maître
  rationale: Dans cette formule paulinienne, « Seigneur » préserve le titre reconnu et évite d’introduire ici une nuance exclusivement liée au rapport maître-esclave.
translation_notes:
  register: Français international moderne, chaleureux et digne. « Rends-moi donc ce service » restitue naturellement la force de la demande sans donner à « profit » une connotation intéressée ; la note préserve l’ambiguïté lexicale et le probable jeu de mots. La ponctuation maintient les deux mouvements de l’appel de Paul.
