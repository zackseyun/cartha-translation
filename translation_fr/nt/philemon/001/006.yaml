source:
  edition: SBLGNT
  text: ὅπως ἡ κοινωνία τῆς πίστεώς σου ἐνεργὴς γένηται ἐν ἐπιγνώσει παντὸς ἀγαθοῦ ⸀τοῦ ἐν ἡμῖν εἰς ⸀Χριστόν·
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/006.yaml
  text: so that the fellowship of your faith may become effective in the knowledge of every good thing that is in us for the Messiah[a][b][c][d][e].
translation:
  language: fr
  text: afin que la communion de ta foi devienne agissante par la connaissance de tout le bien qui est en nous en vue du Messie[a][b][c][d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le partage de ta foi » ou « ta participation à la foi »; plus littéralement, « la communion de ta foi ».
    reason: lexical_alternative
  - marker: b
    text: Le mot grec traduit par « foi » peut aussi, selon le contexte, signifier « fidélité » ou « confiance ».
    reason: alternative_reading
  - marker: c
    text: Certains manuscrits portent « en toi » au lieu de « en nous ».
    reason: textual_variant
  - marker: d
    text: « Par la connaissance » peut aussi être rendu « dans la connaissance » ou « par la pleine connaissance »; la fin du verset peut aussi se traduire « pour le Christ » ou « envers le Christ ».
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: ὅπως
  choice: afin que
  rationale: Introduit le but ou l’objet de la prière de Paul, dans un français naturel et digne.
- source_word: κοινωνία τῆς πίστεώς σου
  choice: la communion qui découle de ta foi
  rationale: κοινωνία peut désigner la communion, la participation, le partage ou le partenariat. Cette formulation conserve le caractère relationnel du terme sans réduire le sens à la seule communication verbale de la foi; le génitif demeure toutefois ambigu.
- source_word: πίστεώς
  choice: foi
  rationale: Dans ce contexte, πίστις désigne probablement la foi de Philémon, tout en pouvant comporter la nuance de fidélité ou de confiance.
- source_word: ἐνεργὴς γένηται
  choice: devienne agissante
  rationale: Rend l’idée de devenir actif ou efficace. « Agissante » convient particulièrement à une communion qui se manifeste concrètement.
- source_word: ἐν ἐπιγνώσει
  choice: par la pleine connaissance
  rationale: ἐν peut ici être instrumental, et ἐπίγνωσις évoque une connaissance approfondie ou une juste reconnaissance. « Par » exprime le moyen sans exclure entièrement la sphère dans laquelle l’action devient effective.
- source_word: παντὸς ἀγαθοῦ
  choice: tout le bien
  rationale: Expression française naturelle pour le neutre substantivé, sans ajouter l’idée non exprimée de don.
- source_word: τοῦ ἐν ἡμῖν
  choice: qui est en nous
  rationale: Suit le texte SBLGNT et rattache explicitement la proposition à « tout le bien ». Le « nous » est probablement collectif.
- source_word: εἰς Χριστόν
  choice: en vue du Messie
  rationale: εἰς marque ici une orientation ou une finalité difficile à préciser. « En vue de » préserve cette orientation sans imposer un rapport syntaxique trop étroit; Χριστός est rendu comme titre par « Messie ».
theological_decisions:
- issue: Sens de κοινωνία τῆς πίστεώς σου
  choice: « la communion qui découle de ta foi », avec une dimension relationnelle et concrète
  alternative: « le partage de ta foi », « ta participation à la foi » ou « la communion de ta foi »
  rationale: La construction est notoirement ambiguë. La formulation retenue évite de limiter κοινωνία à l’évangélisation ou au partage verbal, tout en laissant entendre que la foi de Philémon produit une participation concrète à la vie commune.
- issue: Force de ἐν ἐπιγνώσει
  choice: 'sens instrumental : « par la pleine connaissance »'
  alternative: 'sens locatif ou sphérique : « dans la connaissance »'
  rationale: Le contexte permet de comprendre que cette connaissance rend la communion agissante, mais la valeur exacte de ἐν reste ouverte et est signalée en note.
- issue: Référent de « en nous »
  choice: le bien présent collectivement chez Paul, Philémon et les autres croyants
  alternative: variante textuelle « en toi », visant Philémon en particulier
  rationale: Le texte grec édité porte ἡμῖν, « nous ». La variante est conservée en note sans modifier le texte principal.
- issue: Portée de εἰς Χριστόν
  choice: 'orientation vers le Messie : « en vue du Messie »'
  alternative: « pour le Messie », « envers le Messie » ou rattachement à l’ensemble de la proposition
  rationale: La relation syntaxique et sémantique exacte est difficile. La traduction maintient l’idée d’orientation sans résoudre artificiellement l’ambiguïté.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le tutoiement suit l’adresse personnelle de Paul à Philémon. « Messie » rend Χριστός comme titre. Les principales ambiguïtés lexicales et syntaxiques sont conservées ou explicitées en notes.
