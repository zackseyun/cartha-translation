id: PHM.1.17
reference: Philemon 1:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Εἰ οὖν με ἔχεις κοινωνόν, προσλαβοῦ αὐτὸν ὡς ἐμέ.
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/017.yaml
  text: So if you consider me a partner[a], receive him as you would me.
translation:
  language: fr
  text: Si donc tu me considères comme ton partenaire, accueille-le comme tu m’accueillerais moi-même.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « reçois-le » ou « accepte-le ». Le verbe peut désigner le fait de recevoir quelqu’un favorablement ou de l’accepter dans la communion.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰ οὖν
  choice: Si donc
  rationale: Cette formulation naturelle conserve à la fois la condition exprimée par εἰ et le lien logique rétrospectif marqué par οὖν.
- source_word: ἔχεις κοινωνόν
  choice: tu me considères comme ton partenaire
  rationale: κοινωνός désigne une personne qui partage ou participe avec une autre. « Partenaire » rend ici la relation de participation commune, tandis que « considères comme » exprime naturellement en français la tournure avec ἔχεις.
- source_word: προσλαβοῦ
  choice: accueille-le
  rationale: Le moyen impératif de προσλαμβάνομαι peut signifier recevoir, accueillir ou accepter favorablement. « Accueille-le » convient à l'appel personnel de Paul tout en pouvant inclure l'acceptation relationnelle.
- source_word: αὐτὸν
  choice: -le
  rationale: Le pronom accusatif renvoie à Onésime dans le contexte.
- source_word: ὡς ἐμέ
  choice: comme tu m’accueillerais moi-même
  rationale: 'Cette expansion idiomatique rend clairement la comparaison : Philémon doit réserver à Onésime l''accueil qu''il réserverait à Paul. « moi-même » souligne sans lourdeur la personne de Paul.'
theological_decisions:
- issue: Portée relationnelle de κοινωνός dans l’appel de Paul
  choice: partenaire
  alternative: compagnon ; associé ; celui qui partage avec toi
  rationale: « Partenaire » exprime la participation et la relation mutuelles entre Paul et Philémon sans transformer le terme en notion doctrinale technique.
- issue: Portée de προσλαβοῦ
  choice: accueille-le
  alternative: reçois-le ; accepte-le
  rationale: « Accueille-le » restitue naturellement l'appel personnel et favorable de Paul. La note signale que le verbe peut également inclure l'idée plus large de recevoir ou d'accepter quelqu'un.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase conserve le raisonnement conditionnel de Paul et la force relationnelle de son appel, sans vocabulaire confessionnel technique.
