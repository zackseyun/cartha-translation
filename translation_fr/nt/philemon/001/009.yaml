source:
  edition: SBLGNT
  text: διὰ τὴν ἀγάπην μᾶλλον παρακαλῶ, τοιοῦτος ὢν ὡς Παῦλος πρεσβύτης νυνὶ δὲ καὶ δέσμιος ⸂Χριστοῦ Ἰησοῦ⸃—
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/009.yaml
  text: because of love I rather appeal[a], being such a one as Paul, an old man[c][b], and now also a prisoner of Messiah Jesus—
translation:
  language: fr
  text: c’est plutôt par amour que je t’adresse une demande, moi, Paul, un homme âgé[a], et maintenant aussi prisonnier du Messie Jésus[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Paul, un ambassadeur »; toutefois, le mot grec signifie plus naturellement « un homme âgé ».
    reason: alternative_reading
  - marker: b
    text: 'Grec : « Christ Jésus »; « Messie Jésus » traduit ici Χριστός comme un titre.'
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τὴν ἀγάπην
  choice: au nom de l’amour
  rationale: διά avec l’accusatif exprime ici le motif de la démarche. « Au nom de l’amour » est une formulation française naturelle qui signifie que l’amour fonde l’appel de Paul, sans préciser à tort de quel amour il s’agit.
- source_word: μᾶλλον παρακαλῶ
  choice: c’est plutôt… que je t’adresse une demande
  rationale: μᾶλλον marque le contraste avec la possibilité de donner un ordre au verset 8. Dans ce contexte, παρακαλῶ désigne une demande pressante et personnelle; cette formulation maintient le contraste sans donner à Paul un ton autoritaire.
- source_word: τοιοῦτος ὢν ὡς Παῦλος
  choice: moi qui suis Paul
  rationale: La tournure grecque est elliptique et présente Paul sous les traits précisés ensuite. Une reproduction littérale serait obscure en français; « moi qui suis Paul » conserve l’auto-présentation et s’enchaîne naturellement avec les deux qualifications.
- source_word: πρεσβύτης
  choice: un homme âgé
  rationale: Le sens ordinaire du mot est celui d’un homme avancé en âge. « Homme âgé » est actuel et digne; il évite aussi d’introduire la fonction ecclésiale d’« ancien », absente du contexte.
- source_word: νυνὶ δὲ καὶ
  choice: et maintenant aussi
  rationale: 'La formulation rend à la fois l’indication temporelle de νυνί et l’ajout marqué par καί: à son âge s’ajoute désormais son emprisonnement.'
- source_word: δέσμιος
  choice: prisonnier
  rationale: Le nom désigne directement une personne détenue. « Prisonnier » préserve cette forme nominale et reste plus précis que l’expression figurée « dans les chaînes ».
- source_word: Χριστοῦ Ἰησοῦ
  choice: du Messie Jésus
  rationale: Χριστός garde ici sa valeur de titre. Le génitif présente Paul comme prisonnier appartenant au Messie Jésus ou emprisonné à cause de lui; la traduction française conserve cette possible tension relationnelle.
theological_decisions:
- issue: Sens de πρεσβύτης
  choice: un homme âgé
  alternative: un ambassadeur; un ancien
  rationale: Le texte porte πρεσβύτης, dont le sens naturel se rapporte à l’âge, et non πρεσβευτής, « ambassadeur ». Traduire « ancien » pourrait faire croire à une fonction dans l’Église que le passage ne mentionne pas.
- issue: Valeur de Χριστός
  choice: Messie
  alternative: Christ
  rationale: Dans Χριστοῦ Ἰησοῦ, le titre demeure perceptible. « Messie Jésus » le traduit au lieu de le traiter comme une simple partie d’un nom propre.
- issue: Relation exprimée par δέσμιος Χριστοῦ Ἰησοῦ
  choice: prisonnier du Messie Jésus
  alternative: prisonnier à cause du Messie Jésus; prisonnier au service du Messie Jésus
  rationale: Le génitif grec peut évoquer l’appartenance au Messie et, par implication, la détention subie pour lui. La formulation retenue préserve cette densité sans trancher explicitement entre cause et appartenance.
translation_notes:
  register: Français international moderne, simple et digne. La structure a été légèrement réorganisée pour rendre en français l’opposition entre l’ordre possible du verset 8 et la demande choisie ici. Le tiret final maintient la continuité syntaxique avec le verset suivant.
