  text: ἀκούων σου τὴν ἀγάπην καὶ τὴν πίστιν ἣν ἔχεις ⸀πρὸς τὸν κύριον Ἰησοῦν καὶ εἰς πάντας τοὺς ἁγίους,
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/005.yaml
  text: because I hear of your love and faith that you have toward the Lord Jesus and for all the saints[c][b][a],
translation:
  language: fr
  text: parce que j’entends parler de ton amour et de ta foi envers le Seigneur Jésus et pour tous les saints[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, en explicitant le sens : « ta foi envers le Seigneur Jésus et ton amour pour tous les saints ».'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « ta fidélité ». Le mot grec peut désigner la foi, la confiance ou la fidélité.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούων
  choice: parce que j’entends parler
  rationale: Le participe dépend de l’action de grâce du verset précédent et a ici une valeur causale. « J’entends parler » est idiomatique en français et conserve l’aspect présent.
- source_word: ἀγάπην
  choice: amour
  rationale: Rend directement le sens usuel de ἀγάπη.
- source_word: πίστιν
  choice: foi
  rationale: « Foi » est le rendu principal de πίστις. Le sens possible de fidélité est signalé en note.
- source_word: πρὸς τὸν κύριον Ἰησοῦν
  choice: envers le Seigneur Jésus
  rationale: « Envers » exprime l’orientation vers une personne et maintient la distinction avec la préposition εἰς qui suit.
- source_word: κύριον
  choice: Seigneur
  rationale: Rendu usuel du titre christologique κύριος.
- source_word: εἰς πάντας τοὺς ἁγίους
  choice: pour tous les saints
  rationale: « Pour » est naturel en français pour exprimer l’amour à l’égard des autres croyants, tout en distinguant cette expression de « envers le Seigneur Jésus ».
- source_word: ἁγίους
  choice: saints
  rationale: « Saints » est le terme néotestamentaire concis et traditionnel désignant les membres du peuple de Dieu.
theological_decisions:
- issue: Rapport entre « amour » et « foi » et les deux compléments qui suivent
  choice: 'Conserver dans le texte principal l’ordre et la structure de surface du grec : « ton amour et de la foi que tu as envers le Seigneur Jésus et pour tous les saints »'
  alternative: 'Comprendre distributivement : « ta foi envers le Seigneur Jésus et ton amour pour tous les saints »'
  rationale: Le sens distributif est vraisemblable dans le contexte paulinien, mais le grec ne redistribue pas explicitement chaque nom à un complément. Le texte principal préserve donc l’ambiguïté grammaticale, tandis qu’une note donne la lecture explicite courante.
- issue: Sens de πίστις dans ce contexte
  choice: foi
  alternative: fidélité
  rationale: « Foi » demeure le rendu de base, sans exclure la nuance possible de fidélité, conservée en note.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement correspond à l’adresse personnelle singulière à Philémon. La formulation conserve volontairement la tension syntaxique du grec sans imposer dans le texte principal une redistribution interprétative des compléments.
