  text: ⸀Ἀσπάζεταί σε Ἐπαφρᾶς ὁ συναιχμάλωτός μου ἐν Χριστῷ Ἰησοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/023.yaml
  text: Epaphras[a], my fellow prisoner in Messiah Jesus, greets you.
translation:
  language: fr
  text: Épaphras, mon compagnon de captivité dans le Messie Jésus[a], te salue.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, selon la formulation traditionnelle : « dans le Christ Jésus ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀσπάζεταί
  choice: te salue
  rationale: Dans ce contexte, ἀσπάζομαι signifie adresser une salutation. « Te salue » est concis et naturel, et le pronom singulier rend explicitement σε.
- source_word: Ἐπαφρᾶς
  choice: Épaphras
  rationale: Translittération française usuelle du nom propre grec.
- source_word: ὁ συναιχμάλωτός μου
  choice: mon compagnon de captivité
  rationale: Le nom composé désigne quelqu’un qui partage la captivité d’un autre. Cette formulation française reste proche de l’image grecque sans préciser au-delà du texte la nature exacte de l’emprisonnement.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: dans le Messie Jésus
  rationale: « Dans » conserve la formulation paulinienne d’union et d’appartenance exprimée par ἐν. « Messie » rend la valeur titulaire de Χριστός, tandis que « Jésus » rend le nom propre.
theological_decisions:
- issue: Valeur de Χριστῷ dans la formule paulinienne ἐν Χριστῷ Ἰησοῦ
  choice: Messie
  alternative: Christ
  rationale: La traduction principale fait entendre le titre porté par Χριστός sans réduire ἐν à « pour » ou « à cause de ». La formulation traditionnelle « Christ Jésus » demeure indiquée en note.
- issue: Rapport exprimé par ἐν entre la captivité et le Messie Jésus
  choice: dans le Messie Jésus
  alternative: pour le Messie Jésus
  rationale: Le grec permet de rattacher la condition de compagnon de captivité à la sphère de l’union avec le Messie; traduire « pour » introduirait une causalité que la préposition n’énonce pas explicitement.
translation_notes:
  register: Français international moderne, sobre et digne. Le tutoiement singulier traduit directement σε, adressé à Philémon. « Compagnon de captivité » préserve l’image du grec tout en évitant le registre administratif de « codétenu ».
