source:
  edition: SBLGNT
  text: ἐγὼ Παῦλος ἔγραψα τῇ ἐμῇ χειρί, ἐγὼ ἀποτίσω· ἵνα μὴ λέγω σοι ὅτι καὶ σεαυτόν μοι προσοφείλεις.
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/019.yaml
  text: 'I[a], Paul, write this with my own hand: I will repay it—not to mention to you that you owe me even your very self.'
translation:
  language: fr
  text: 'Moi, Paul, je l’écris de ma propre main : je rembourserai — pour ne pas te dire que tu me dois même ta propre personne.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « Moi, Paul, je l’ai écrit de ma propre main ; je rembourserai, afin que je ne te dise pas que tu me dois en plus toi-même. »'
    reason: Alternative plus formelle pour l’aoriste épistolaire ἔγραψα, la construction rhétorique ἵνα μὴ λέγω et la nuance additive de προσοφείλεις.
lexical_decisions:
- source_word: ἔγραψα
  choice: je l’écris
  rationale: L’aoriste épistolaire peut se rendre naturellement au présent en français lorsque Paul attire l’attention sur la garantie qu’il écrit personnellement; une note conserve la forme passée plus littérale.
- source_word: τῇ ἐμῇ χειρί
  choice: de ma propre main
  rationale: Expression française naturelle qui souligne que Paul écrit personnellement cet engagement.
- source_word: ἀποτίσω
  choice: je rembourserai
  rationale: Le futur exprime la promesse de régler la dette ou le préjudice évoqué au verset précédent. Le complément implicite reste récupérable dans le contexte.
- source_word: ἵνα μὴ λέγω σοι
  choice: sans te rappeler
  rationale: Cette formulation rend la litote rhétorique et l’ironie courtoise de Paul sans traiter ἵνα comme une stricte proposition de but.
- source_word: καὶ σεαυτόν
  choice: toi aussi … ta propre personne
  rationale: Cette formulation préserve l’accent porté sur Philemon lui-même et laisse entendre que cette dette personnelle s’ajoute à celle dont il est question.
- source_word: μοι προσοφείλεις
  choice: tu as envers moi une dette
  rationale: Le vocabulaire de la dette maintient le jeu financier avec la promesse de remboursement et permet d’exprimer clairement le complément personnel sans définir la nature exacte de l’obligation.
theological_decisions:
- issue: Nature de la dette personnelle de Philémon envers Paul
  choice: 'Conserver une dette personnelle forte mais non définie : « ta propre personne »'
  alternative: Préciser que Philémon doit à Paul sa conversion, son salut ou sa vie
  rationale: Le grec affirme cette dette sans en indiquer explicitement l’origine. La traduction ne tranche donc pas entre les interprétations historiques ou théologiques possibles.
translation_notes:
  register: Français international moderne, digne et accessible. Le tour « sans te rappeler » restitue la retenue rhétorique de Paul; les deux-points rendent explicite l’apposition « ta propre personne » sans préciser la nature de la dette.
