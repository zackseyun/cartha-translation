  text: παρακαλῶ σε περὶ τοῦ ἐμοῦ τέκνου, ὃν ἐγέννησα ἐν τοῖς ⸀δεσμοῖς Ὀνήσιμον,
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/010.yaml
  text: I appeal to you concerning my child[a], Onesimus, whom I fathered in my chains[b],
translation:
  language: fr
  text: Je t’adresse une demande au sujet de mon enfant[a], Onésime, que j’ai engendré dans mes chaînes[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « mon fils ». Le grec emploie un terme qui signifie littéralement « enfant » et exprime ici une relation spirituelle affectueuse.
    reason: lexical_alternative
  - marker: b
    text: « Dans mes chaînes » peut aussi se comprendre comme « pendant mon emprisonnement » ; le grec conserve l’image concrète des liens.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακαλῶ
  choice: Je te prie
  rationale: Dans cette demande personnelle et pressante, παρακαλῶ exprime un appel respectueux plutôt qu’un ordre. « Je te prie » convient au ton relationnel de la lettre.
- source_word: περὶ τοῦ ἐμοῦ τέκνου
  choice: au sujet de mon enfant
  rationale: περί avec le génitif signifie ici « au sujet de ». « Mon enfant » rend le possessif et l’affection spirituelle sans renforcer indûment ἐμοῦ par « mon propre ».
- source_word: τέκνου
  choice: enfant
  rationale: τέκνον est plus large que « fils » et conserve l’image affectueuse de la parenté spirituelle, même si Onésime est un homme.
- source_word: ὃν ἐγέννησα
  choice: que j’ai engendré
  rationale: γεννάω appartient au champ de la naissance et de l’engendrement. « Engendré » préserve directement la métaphore de la paternité spirituelle sans expliciter une conversion que le grec ne nomme pas.
- source_word: ἐν τοῖς δεσμοῖς
  choice: dans mes chaînes
  rationale: δεσμοί désigne concrètement les liens ou chaînes et, par métonymie, l’emprisonnement. Cette formulation garde l’image concrète du grec.
- source_word: Ὀνήσιμον
  choice: Onésime
  rationale: Forme française traditionnelle et courante du nom grec Ὀνήσιμος.
theological_decisions:
- issue: Nature de la relation entre Paul et Onésime
  choice: Conserver la métaphore de l’engendrement spirituel
  alternative: « dont je suis devenu le père pendant mon emprisonnement » ou « qui est devenu mon fils dans mes chaînes »
  rationale: Le texte suggère fortement que Paul a joué un rôle décisif dans la venue d’Onésime à la foi, mais il l’exprime par une métaphore de naissance. La traduction ne transforme donc pas cette image en formule doctrinale explicite.
translation_notes:
  register: Français moderne, digne et accessible. « Je te prie » maintient la chaleur de l’appel personnel ; « engendré » est légèrement soutenu, mais nécessaire pour préserver clairement la métaphore du grec. La virgule finale respecte le fait que le verset se poursuit syntaxiquement au verset suivant.
