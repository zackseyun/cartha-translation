id: PHM.1.25
reference: Philemon 1:25
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἡ χάρις τοῦ ⸀κυρίου Ἰησοῦ Χριστοῦ μετὰ τοῦ πνεύματος ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/025.yaml
  text: The grace of the Lord Jesus Christ be with your spirit[a][b].
translation:
  language: fr
  text: Que la grâce du Seigneur Jésus-Christ soit avec votre esprit.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le mot traduit par « votre » est au pluriel : cette bénédiction s''adresse donc à l''ensemble des destinataires de la lettre, et non à Philémon seul.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις
  choice: grâce
  rationale: « Grâce » est le terme paulinien consacré et rend ici la faveur bienveillante accordée dans la bénédiction finale.
- source_word: κυρίου
  choice: Seigneur
  rationale: « Seigneur » conserve la valeur de titre et la portée christologique de κύριος.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jésus-Christ
  rationale: En français courant, « Jésus-Christ » est la forme naturelle et reconnue de ce nom-titre dans une formule de bénédiction; « Christ » continue d'évoquer le titre messianique sans lourdeur explicative.
- source_word: μετὰ
  choice: soit avec
  rationale: Le grec est une proposition sans verbe; l'ajout de « soit » donne en français une bénédiction naturelle tout en respectant son sens.
- source_word: πνεύματος
  choice: esprit
  rationale: Avec le possessif, le terme désigne naturellement l'esprit ou l'être intérieur des destinataires; la minuscule évite de l'identifier explicitement au Saint-Esprit.
- source_word: ὑμῶν
  choice: votre
  rationale: Le possessif français convient à la construction avec « esprit »; une note précise qu'il renvoie à plusieurs destinataires, distinction que la forme française ne marque pas.
theological_decisions:
- issue: Valeur de Χριστοῦ dans la bénédiction finale
  choice: Jésus-Christ
  alternative: Jésus le Messie
  rationale: Dans cette formule épistolaire, « Jésus-Christ » est le rendu français naturel du nom-titre. Il ne réduit pas nécessairement Χριστός à un patronyme, tandis que « Jésus le Messie » rendrait ici la formule moins idiomatique.
- issue: Référent de πνεύματος dans « votre esprit »
  choice: l'esprit ou l'être intérieur des destinataires
  alternative: le Saint-Esprit
  rationale: Le possessif ὑμῶν favorise l'esprit des destinataires. La traduction conserve simplement « esprit » et n'ajoute pas une identification théologique absente du texte.
translation_notes:
  register: Français moderne, sobre et digne. La tournure optative « Que… soit » explicite naturellement la bénédiction contenue dans la proposition grecque sans verbe. Le singulier collectif « votre esprit » est conservé, comme dans le texte source.
