  text: ὁ δὲ ἀκούσας ταῦτα περίλυπος ⸀ἐγενήθη, ἦν γὰρ πλούσιος σφόδρα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/023.yaml
  text: But when he heard these things[a], he became very sorrowful, for he was extremely rich.
translation:
  language: fr
  text: Mais quand il entendit cela, il devint profondément triste, car il était extrêmement riche.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀκούσας
  choice: quand il entendit
  rationale: Le participe aoriste a ici une valeur temporelle et introduit naturellement la réaction qui suit.
- source_word: ταῦτα
  choice: cela
  rationale: Bien que le grec emploie un pluriel, le français renvoie idiomatiquement par « cela » à l’ensemble des paroles précédentes de Jésus.
- source_word: περίλυπος
  choice: profondément triste
  rationale: L’adjectif exprime une tristesse ou une détresse intense; cette formulation en conserve la force dans un français naturel.
- source_word: ἐγενήθη
  choice: il devint
  rationale: Le verbe marque l’entrée dans un état plutôt qu’une simple situation statique.
- source_word: πλούσιος
  choice: riche
  rationale: Équivalent français direct, courant et précis.
- source_word: σφόδρα
  choice: extrêmement
  rationale: L’adverbe intensifie fortement la richesse et appelle davantage qu’un simple « très ».
- source_word: δὲ
  choice: Mais
  rationale: La conjonction marque ici le contraste entre les paroles de Jésus et la réaction de l’homme.
- source_word: γὰρ
  choice: car
  rationale: La conjonction introduit l’explication de sa profonde tristesse.
