id: LUK.18.22
reference: Luke 18:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀκούσας ⸀δὲ ὁ Ἰησοῦς εἶπεν αὐτῷ· Ἔτι ἕν σοι λείπει· πάντα ὅσα ἔχεις πώλησον καὶ διάδος πτωχοῖς, καὶ ἕξεις θησαυρὸν ἐν ⸀οὐρανοῖς, καὶ δεῦρο ἀκολούθει μοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/022.yaml
  text: 'When Jesus heard this, he said to him, “One thing still lacks for you: sell all that you have and distribute it to the poor, and you will have treasure in heaven; and come, follow me.”'
translation:
  language: fr
  text: 'Quand Jésus entendit cela, il lui dit : « Il te manque encore une chose[a] : vends tout ce que tu as et distribue-le aux pauvres, et tu auras un trésor dans les cieux[b]. Puis viens, suis-moi. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Une chose te fait encore défaut. »'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « dans le ciel ». Le grec emploie ici le pluriel « cieux ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας δὲ ὁ Ἰησοῦς
  choice: Quand Jésus entendit cela
  rationale: Le participe aoriste, avec δέ, indique naturellement la circonstance temporelle et la progression du récit. « Cela » reprend les paroles précédentes sans alourdir la phrase.
- source_word: Ἔτι ἕν σοι λείπει
  choice: Il te manque encore une chose
  rationale: Cette formulation française naturelle conserve le sens de λείπει, « manquer, faire défaut », ainsi que l’accent sur l’unique chose qui reste.
- source_word: πάντα ὅσα ἔχεις πώλησον
  choice: vends tout ce que tu as
  rationale: Rend directement la portée exhaustive de πάντα ὅσα et la force impérative de πώλησον.
- source_word: διάδος πτωχοῖς
  choice: distribue-le aux pauvres
  rationale: διαδίδωμι exprime la distribution ou le partage. Le pronom « le » reprend naturellement l’ensemble envisagé, notamment le produit des biens vendus.
- source_word: ἕξεις θησαυρὸν ἐν οὐρανοῖς
  choice: tu auras un trésor dans les cieux
  rationale: « Trésor » correspond à θησαυρός. Le pluriel « les cieux » maintient le nombre du grec tout en restant idiomatique en français biblique moderne.
- source_word: καὶ δεῦρο ἀκολούθει μοι
  choice: Puis viens, suis-moi
  rationale: δεῦρο invite à venir vers Jésus, tandis que le présent impératif ἀκολούθει porte naturellement l’idée d’une marche de disciple qui se prolonge. « Suis-moi » exprime cela sans tournure artificielle.
theological_decisions:
- issue: Portée du dépouillement et appel à devenir disciple
  choice: Conserver les ordres concrets adressés à cet homme et leur aboutissement dans « suis-moi », sans généraliser ni atténuer leur portée.
  alternative: Présenter soit la vente totale comme une règle universelle explicite pour tous, soit l’ordre comme purement symbolique.
  rationale: Le grec formule une exigence concrète adressée à l’interlocuteur dans ce contexte précis, puis l’appel à suivre Jésus. La traduction laisse subsister cette tension sans lui imposer une systématisation doctrinale.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple convient au registre narratif biblique écrit. La formulation évite à la fois le calque maladroit et la paraphrase doctrinale.
