  text: λέγων· Κριτής τις ἦν ἔν τινι πόλει τὸν θεὸν μὴ φοβούμενος καὶ ἄνθρωπον μὴ ἐντρεπόμενος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/002.yaml
  text: saying[a], “There was a certain judge in a certain city who did not fear God and did not respect people.
translation:
  language: fr
  text: 'Il dit : « Dans une certaine ville, il y avait un juge qui ne craignait pas Dieu et n’avait d’égards pour personne. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγων
  choice: Il dit
  rationale: Le participe présent introduit le contenu de la parabole et dépend grammaticalement du verset précédent. En français, une proposition introductive avec un verbe conjugué est plus naturelle.
- source_word: Κριτής τις ἦν ἔν τινι πόλει
  choice: Dans une certaine ville, il y avait un juge
  rationale: La tournure existentielle « il y avait » convient à l’introduction d’un personnage dans un récit. « Une certaine ville » conserve le caractère indéfini exprimé par τινι, tandis que l’article indéfini suffit naturellement à rendre τις devant « juge ».
- source_word: τὸν θεὸν μὴ φοβούμενος
  choice: qui ne craignait pas Dieu
  rationale: « Craindre Dieu » conserve la portée morale et religieuse de φοβέομαι. L’imparfait décrit ici une disposition habituelle du juge.
- source_word: ἄνθρωπον μὴ ἐντρεπόμενος
  choice: et n’avait d’égards pour personne
  rationale: Dans cette construction négative, le singulier générique ἄνθρωπον désigne toute personne humaine. « N’avoir d’égards pour personne » rend naturellement l’idée de ne témoigner ni considération ni respect à autrui.
theological_decisions:
- issue: Le singulier générique ἄνθρωπον mis en contraste avec Dieu
  choice: personne
  alternative: l’être humain
  rationale: Avec la négation, « personne » exprime idiomatiquement en français la portée générique du singulier grec sans le restreindre aux hommes de sexe masculin. Le contraste entre Dieu et les autres êtres humains demeure intact.
translation_notes:
  register: Français international moderne, simple et digne. La formulation garde le ton narratif de la parabole et évite aussi bien l’archaïsme que la paraphrase explicative.
