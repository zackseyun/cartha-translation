  yaml_path: translation/nt/luke/018/037.yaml
  text: And they told him[a], “Jesus the Nazarene is passing by.”
translation:
  language: fr
  text: 'On lui annonça alors : « Jésus le Nazaréen passe. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπήγγειλαν
  choice: on lui annonça
  rationale: Le verbe signifie rapporter, annoncer ou faire savoir. Le sujet pluriel indéfini se rend naturellement en français par « on », tandis que « annonça » exprime clairement la transmission de l’information.
- source_word: δὲ
  choice: alors
  rationale: Ici, δέ est un connecteur léger qui fait avancer le récit sans marquer une opposition forte ; « alors » convient au déroulement narratif.
- source_word: αὐτῷ
  choice: lui
  rationale: Le datif désigne l’homme à qui l’information est communiquée ; « lui » est la construction idiomatique avec « annoncer ».
- source_word: ὅτι
  choice: deux-points et discours direct
  rationale: ὅτι introduit le contenu communiqué. Le discours direct est naturel en français et conserve exactement l’information donnée.
- source_word: Ἰησοῦς
  choice: Jésus
  rationale: Forme française conventionnelle du nom propre grec Ἰησοῦς.
- source_word: ὁ Ναζωραῖος
  choice: le Nazaréen
  rationale: Le grec emploie une désignation substantivée. « Le Nazaréen » en conserve la forme et reste une appellation française reconnue, sans la convertir silencieusement en « de Nazareth ».
- source_word: παρέρχεται
  choice: passe par ici
  rationale: Le présent décrit l’action en cours de Jésus qui passe à proximité. « Passe par ici » est naturel en français et exprime clairement la situation immédiate.
theological_decisions:
- issue: Désignation de Jésus par Ναζωραῖος
  choice: le Nazaréen
  alternative: Jésus de Nazareth
  rationale: Il s’agit principalement d’une désignation géographique ou identificatrice. La traduction retenue préserve la forme substantivée du grec sans lui ajouter une portée doctrinale absente du texte.
translation_notes:
  register: Français international moderne, narratif et digne. La tournure « on lui annonça » rend naturellement le pluriel indéfini grec ; « le Nazaréen » conserve la désignation du texte source.
