id: LUK.18.15
reference: Luke 18:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Προσέφερον δὲ αὐτῷ καὶ τὰ βρέφη ἵνα αὐτῶν ἅπτηται· ἰδόντες δὲ οἱ μαθηταὶ ⸀ἐπετίμων αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/015.yaml
  text: They were even bringing infants to him so that he might touch them[a], but when the disciples saw it[c][b], they rebuked them.
translation:
  language: fr
  text: On lui amenait même des nourrissons pour qu’il les touche[a]. Mais, en voyant cela[c], les disciples leur faisaient des reproches[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les bébés ». Le terme grec désigne de très jeunes enfants, en particulier des nourrissons.'
    reason: lexical_alternative
  - marker: b
    text: C’est-à-dire aux personnes qui amenaient les nourrissons à Jésus.
    reason: referent_clarification
  - marker: c
    text: Dans les récits parallèles, le geste de Jésus est associé à la bénédiction et à l’imposition des mains aux enfants (voir Matthieu 19.13; Marc 10.13, 16).
    reason: cross_reference
lexical_decisions:
- source_word: Προσέφερον
  choice: On lui amenait
  rationale: L’imparfait grec décrit une action en cours ou répétée. Le pronom indéfini « on » rend naturellement en français le sujet pluriel non exprimé, sans identifier davantage les personnes concernées.
- source_word: δὲ
  choice: Mais
  rationale: La première occurrence, simple articulation narrative, reste implicite en français; la seconde marque naturellement le contraste entre l’action des gens et la réaction des disciples.
- source_word: καὶ
  choice: même
  rationale: 'Dans ce contexte, καὶ a une valeur d’insistance : on amenait jusqu’à de très jeunes enfants.'
- source_word: τὰ βρέφη
  choice: des nourrissons
  rationale: βρέφη désigne de très jeunes enfants, voire des bébés. « Nourrissons » est précis, actuel et digne.
- source_word: ἵνα αὐτῶν ἅπτηται
  choice: pour qu’il les touche
  rationale: La proposition exprime le but. « Toucher » conserve le sens explicite de ἅπτομαι sans introduire dans le texte principal l’idée, contextuellement probable mais non formulée ici, de bénédiction.
- source_word: ἰδόντες
  choice: en voyant cela
  rationale: Le participe aoriste est rendu par une construction temporelle naturelle. « Cela » reprend la scène que les disciples observent.
- source_word: οἱ μαθηταὶ
  choice: les disciples
  rationale: Traduction directe du groupe nominal grec, sans ajouter le possessif « ses », qui reste implicite dans le contexte.
- source_word: ἐπετίμων αὐτοῖς
  choice: leur faisaient des reproches
  rationale: L’imparfait conserve l’aspect duratif ou répété de ἐπετίμων. Cette expression française rend la réprobation adressée aux personnes qui amenaient les nourrissons, tout en conservant le pronom du grec.
theological_decisions:
- issue: Nature du geste demandé à Jésus envers les nourrissons
  choice: qu’il les touche
  alternative: qu’il les bénisse / qu’il leur impose les mains
  rationale: Luc emploie ici le verbe ἅπτομαι, « toucher ». Les récits parallèles associent ce geste à une bénédiction et à l’imposition des mains, mais ces précisions ne doivent pas remplacer le libellé plus sobre du texte de Luc.
translation_notes:
  register: Français international moderne, naturel et digne. « On lui amenait » évite un sujet artificiellement explicite; « nourrissons » garde la précision de βρέφη. Les imparfaits rendent la progression narrative et l’aspect des verbes grecs.
