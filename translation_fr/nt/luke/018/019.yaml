source:
  edition: SBLGNT
  text: εἶπεν δὲ αὐτῷ ὁ Ἰησοῦς· Τί με λέγεις ἀγαθόν; οὐδεὶς ἀγαθὸς εἰ μὴ εἷς ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/019.yaml
  text: But Jesus said to him, “Why do you call me good? No one is good except one—God.”
translation:
  language: fr
  text: 'Mais Jésus lui dit : « Pourquoi m’appelles-tu bon ? Personne n’est bon, sinon Dieu seul. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Mais
  rationale: Marque naturellement le léger contraste introduit par la réponse de Jésus dans le contexte.
- source_word: εἶπεν ... αὐτῷ ὁ Ἰησοῦς
  choice: Jésus lui dit
  rationale: Conserve le sens simple de λέγω et le pronom explicite αὐτῷ, sans renforcer le verbe en « répondit ».
- source_word: Τί με λέγεις ἀγαθόν
  choice: Pourquoi m’appelles-tu bon ?
  rationale: Rend idiomatiquement en français la valeur interrogative de τί dans cette tournure, tout en préservant la formulation directe.
- source_word: ἀγαθόν / ἀγαθὸς
  choice: bon
  rationale: Traduit les deux occurrences de façon cohérente sans ajouter une précision morale absente du terme grec lui-même.
- source_word: οὐδεὶς
  choice: Personne
  rationale: Expression française courante et claire de la négation universelle.
- source_word: εἰ μὴ εἷς
  choice: sinon un seul
  rationale: Préserve l’exception et l’accent porté sur l’unicité, dans une formulation française naturelle.
- source_word: ὁ θεός
  choice: Dieu
  rationale: Désigne directement le référent en français, sans explicitation interprétative.
theological_decisions:
- issue: Portée christologique de la question de Jésus
  choice: Conserver la question sans en faire ni un refus explicite de la bonté ni une affirmation explicite de la divinité de Jésus.
  alternative: Paraphraser le verset soit comme un déni de la bonté absolue de Jésus, soit comme une revendication directe de sa divinité.
  rationale: Le grec maintient une tension théologique que la traduction ne doit pas résoudre à la place du lecteur.
translation_notes:
  register: 'Français international moderne, naturel et digne. La ponctuation « sinon un seul : Dieu » maintient l’insistance du grec sur l’unicité tout en restant lisible.'
