revisions:
- from: 'Il dit aussi cette parabole à quelques personnes qui mettaient leur confiance en elles-mêmes, convaincues d’être justes, et qui méprisaient tous les autres[a] :'
  to: 'Il dit aussi cette parabole à certains qui avaient confiance en eux-mêmes, se croyant justes et méprisant les autres[a] :'
  rationale: 'La correction élimine l’inférence de genre créée par le nom féminin « personnes » et resserre « tous les autres » en « les autres », plus proche de τοὺς λοιπούς. Elle maintient l’ambiguïté et la tension du grec : ces personnes avaient confiance en elles-mêmes tout en se croyant justes.'
