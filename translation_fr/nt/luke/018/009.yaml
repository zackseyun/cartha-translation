review_pass:
  verdict: revise
  source_fidelity: Le sens est globalement fidèle. Toutefois, « tous les autres » explicite inutilement τοὺς λοιπούς (« les autres / le reste »), et l’accord au féminin imposé par « personnes » donne l’impression indue que les destinataires étaient des femmes. La formulation révisée conserve la confiance établie en soi, leur prétention à être justes et leur mépris des autres.
  naturalness: La révision emploie un masculin pluriel générique naturel, sans effet de genre non motivé par le grec. « Il dit aussi cette parabole » demeure une formulation française biblique moderne recevable.
  terminology: « Justes » rend δίκαιοι sans introduire « propre justice » ou une lecture confessionnelle. « Méprisaient » rend directement ἐξουθενοῦντας; la note conserve les nuances « tenir pour rien » et « regarder de haut ».
  issues:
  - severity: medium
    issue: Accord féminin déterminé par « quelques personnes »
    rationale: Le grec τινας ne précise pas le sexe des personnes visées. « elles-mêmes, convaincues » est grammaticalement défendable avec « personnes », mais peut suggérer à tort un groupe féminin. Un masculin générique avec « certains » évite cette implication.
  - severity: low
    issue: « tous les autres » est plus explicite que τοὺς λοιπούς
    rationale: Le défini grec signifie plus directement « les autres » ou « le reste ». L’ajout de « tous » n’est pas nécessaire pour rendre le référent collectif.
  revised_text: 'Il dit aussi cette parabole à certains qui avaient confiance en eux-mêmes, se croyant justes et méprisant les autres[a] :'
  revised_footnotes:
  - marker: a
    text: 'Ou : « tenaient les autres pour rien »; ou : « regardaient les autres de haut ».'
    reason: La traduction « méprisaient » rend ἐξουθενοῦντας, qui peut désigner le fait de tenir quelqu’un pour rien ou de le regarder avec dédain.
  revision_rationale: 'La correction élimine l’inférence de genre créée par le nom féminin « personnes » et resserre « tous les autres » en « les autres », plus proche de τοὺς λοιπούς. Elle maintient l’ambiguïté et la tension du grec : ces personnes avaient confiance en elles-mêmes tout en se croyant justes.'
