source:
  edition: SBLGNT
  text: Εἶπεν δὲ ⸀καὶ πρός τινας τοὺς πεποιθότας ἐφ’ ἑαυτοῖς ὅτι εἰσὶν δίκαιοι καὶ ἐξουθενοῦντας τοὺς λοιποὺς τὴν παραβολὴν ταύτην·
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/009.yaml
  text: And he also told this parable to some who trusted in themselves that they were righteous and treated the rest with contempt:[a]
translation:
  language: fr
  text: 'Il dit aussi cette parabole à certains qui avaient confiance en eux-mêmes, se croyant justes et méprisant les autres[a] :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « tenaient les autres pour rien »; ou : « regardaient les autres de haut ».'
    reason: La traduction « méprisaient » rend ἐξουθενοῦντας, qui peut désigner le fait de tenir quelqu’un pour rien ou de le regarder avec dédain.
lexical_decisions:
- source_word: Εἶπεν
  choice: Il dit ... cette parabole
  rationale: Avec « cette parabole » comme complément, « dire cette parabole » reste idiomatique en français biblique moderne et rend directement le verbe λέγω; « raconta » serait également possible, mais suggérerait davantage une narration développée.
- source_word: δὲ καὶ
  choice: aussi
  rationale: δέ assure ici une transition narrative légère, qu’il n’est pas nécessaire de rendre séparément en français, tandis que καί marque l’ajout d’un autre enseignement.
- source_word: πρός τινας
  choice: à quelques personnes
  rationale: Après un verbe de parole, πρός désigne les destinataires. « Quelques personnes » est plus naturel et plus explicite que le seul pronom « certains ».
- source_word: τοὺς πεποιθότας ἐφ’ ἑαυτοῖς
  choice: qui mettaient leur confiance en elles-mêmes
  rationale: Le parfait participial exprime un état établi de confiance, et ἐφ’ ἑαυτοῖς en indique l’objet réflexif. Cette formulation conserve clairement l’idée d’une confiance placée en soi.
- source_word: ὅτι εἰσὶν δίκαιοι
  choice: convaincues d’être justes
  rationale: La proposition ὅτι précise le contenu de leur confiance. « Convaincues » rend naturellement cette relation en français sans ajouter le terme interprétatif « suffisantes »; « justes » préserve le vocabulaire moral et théologique de δίκαιοι.
- source_word: ἐξουθενοῦντας
  choice: méprisaient
  rationale: ἐξουθενέω signifie tenir pour rien ou traiter avec mépris. « Mépriser » en donne une expression française directe et actuelle.
- source_word: τοὺς λοιπούς
  choice: tous les autres
  rationale: Avec ce groupe défini, λοιποί désigne le reste des personnes par opposition à celles qui se croient justes. « Tous les autres » explicite naturellement la portée collective sans changer le référent.
- source_word: τὴν παραβολὴν ταύτην
  choice: cette parabole
  rationale: « Parabole » est le terme français établi pour παραβολή dans ce genre d’enseignement synoptique.
theological_decisions:
- issue: Rendre δίκαιοι dans un contexte de propre justice
  choice: justes
  alternative: en règle avec Dieu
  rationale: Le grec emploie le terme positif δίκαιοι, bien que le contexte critique l’assurance de ces personnes. « Justes » conserve cette tension et laisse au récit le soin de dévoiler l’erreur de leur jugement, sans intégrer une interprétation péjorative à la traduction.
- issue: Nature de la confiance exprimée par πεποιθότας ἐφ’ ἑαυτοῖς
  choice: mettaient leur confiance en elles-mêmes
  alternative: étaient sûres d’elles-mêmes
  rationale: La formulation retenue garde l’objet de la confiance explicitement réflexif et évite de réduire le propos à un simple trait psychologique; le lien avec leur prétention à être justes demeure toutefois exprimé par la proposition suivante.
translation_notes:
  register: Français international moderne, digne et accessible. L’accord au féminin de « elles-mêmes, convaincues » reprend grammaticalement « personnes » sans indiquer que les destinataires étaient exclusivement des femmes. La phrase conserve les participes descriptifs du grec sous forme de relatives et place les deux attitudes critiquées en parallèle.
