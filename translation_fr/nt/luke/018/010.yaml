  source_fidelity: 'Le texte rend fidèlement les éléments grecs : « Deux hommes » correspond à Ἄνθρωποι δύο dans ce contexte masculin ; « montèrent » préserve ἀνέβησαν et son mouvement ascendant ; « au temple » est une formulation française idiomatique pour εἰς τὸ ἱερόν ; et « pour prier » rend correctement l’infinitif de but προσεύξασθαι. La construction « l’un était pharisien et l’autre collecteur d’impôts » exprime sans perte le contraste ὁ εἷς … καὶ ὁ ἕτερος.'
