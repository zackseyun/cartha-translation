id: LUK.18.10
reference: Luke 18:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἄνθρωποι δύο ἀνέβησαν εἰς τὸ ἱερὸν προσεύξασθαι, ⸀ὁ εἷς Φαρισαῖος καὶ ὁ ἕτερος τελώνης.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/010.yaml
  text: Two men went up into the temple to pray[a], one a Pharisee and the other a tax collector.
translation:
  language: fr
  text: 'Deux hommes montèrent au temple pour prier[a] : l’un était pharisien et l’autre collecteur d’impôts.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec ἱερόν désigne l’ensemble du temple et de ses cours, et non spécifiquement le sanctuaire intérieur.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄνθρωποι δύο
  choice: Deux hommes
  rationale: Bien que ἄνθρωποι puisse désigner des êtres humains en général, les deux personnes sont ensuite présentées au masculin comme un pharisien et un collecteur d’impôts.
- source_word: ἀνέβησαν
  choice: montèrent
  rationale: Le verbe ἀναβαίνω signifie « monter ». Cette formulation conserve le mouvement ascendant associé à la montée vers Jérusalem et vers le temple, tout en restant naturelle en français.
- source_word: εἰς τὸ ἱερὸν
  choice: au temple
  rationale: ἱερόν désigne ici l’ensemble du domaine du temple plutôt que le sanctuaire intérieur. En français idiomatique, « monter au temple » exprime naturellement la destination, tandis qu’une note précise l’étendue du terme grec.
- source_word: προσεύξασθαι
  choice: pour prier
  rationale: L’infinitif aoriste exprime le but de leur montée ; « pour prier » le rend directement et naturellement.
- source_word: ὁ εἷς ... καὶ ὁ ἕτερος
  choice: l’un ... et l’autre
  rationale: Cette tournure distributive française rend clairement le contraste entre les deux personnes.
- source_word: Φαρισαῖος
  choice: pharisien
  rationale: « Pharisien » est la désignation française courante et établie de ce groupe juif.
- source_word: τελώνης
  choice: collecteur d’impôts
  rationale: τελώνης désigne un percepteur de taxes ou de péages. « Collecteur d’impôts » est une expression moderne, claire et moins susceptible d’évoquer une fonction administrative contemporaine précise que « percepteur ».
theological_decisions:
- issue: Distinction entre ἱερόν et ναός
  choice: temple, avec précision en note
  alternative: enceinte du temple
  rationale: Le texte évoque le complexe ou domaine du temple, non spécifiquement le sanctuaire intérieur. « Temple » reste naturel dans le corps du texte, et la note préserve la précision lexicale.
- issue: Valeur genrée de ἄνθρωποι
  choice: hommes
  alternative: personnes
  rationale: Même si le nom peut être générique, le contexte immédiat présente deux individus masculins. « Hommes » rend donc ici le référent avec exactitude.
- issue: Forme nominale de Φαρισαῖος et τελώνης
  choice: l’un était pharisien et l’autre collecteur d’impôts
  alternative: l’un, un pharisien, et l’autre, un collecteur d’impôts
  rationale: L’ajout explicite de « était » produit une phrase française naturelle sans modifier l’identification contrastée des deux hommes ni introduire d’interprétation doctrinale.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple convient au registre narratif biblique écrit. « Montèrent au temple » est idiomatique et conserve l’idée d’ascension ; « collecteur d’impôts » évite l’archaïsme de « publicain ».
