source:
  edition: SBLGNT
  text: σταθεὶς δὲ ⸀ὁ Ἰησοῦς ἐκέλευσεν αὐτὸν ἀχθῆναι πρὸς αὐτόν. ἐγγίσαντος δὲ αὐτοῦ ἐπηρώτησεν αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/040.yaml
  text: So Jesus stood still and ordered that he be brought to him[a]. And when he came near, he asked him[b],
translation:
  language: fr
  text: 'Jésus s’arrêta et ordonna qu’on le lui amène[a]. Quand l’homme se fut approché, Jésus lui demanda :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qu’on le conduise jusqu’à lui ». Le verbe grec peut évoquer le fait de conduire quelqu’un aussi bien que de l’amener.
    reason: lexical_alternative
lexical_decisions:
- source_word: σταθεὶς
  choice: s’arrêta
  rationale: Le participe aoriste de ἵστημι est employé ici intransitivement et indique que Jésus interrompt sa marche. « S’arrêta » est naturel et précis en français moderne.
- source_word: δὲ
  choice: et
  rationale: δέ est un lien narratif léger. « Et » assure ici une progression naturelle sans introduire un contraste marqué.
- source_word: ἐκέλευσεν
  choice: ordonna
  rationale: κελεύω exprime un ordre donné avec autorité. « Ordonna » en conserve la force sans lourdeur.
- source_word: ἀχθῆναι
  choice: qu’on le lui amène
  rationale: L’infinitif passif de ἄγω indique que d’autres doivent conduire ou amener l’aveugle jusqu’à Jésus. La tournure active indéfinie « qu’on le lui amène » est plus idiomatique en français que le passif.
- source_word: πρὸς αὐτόν
  choice: lui
  rationale: πρός avec l’accusatif marque le mouvement vers Jésus. Dans « le lui amène », le pronom indirect rend naturellement cette destination.
- source_word: ἐγγίσαντος δὲ αὐτοῦ
  choice: Quand l’homme se fut approché
  rationale: Le génitif absolu avec participe aoriste exprime une circonstance temporelle antérieure à la demande. « L’homme » clarifie sans ambiguïté que le sujet est l’aveugle, tandis que « se fut approché » respecte la succession des actions.
- source_word: ἐπηρώτησεν αὐτόν
  choice: Jésus lui demanda
  rationale: ἐπερωτάω signifie couramment « demander » ou « interroger ». La répétition de « Jésus » lève l’ambiguïté que produirait en français une suite de pronoms masculins.
theological_decisions: []
translation_notes:
  register: 'Français moderne, international et digne. La syntaxe privilégie la clarté narrative : les noms « l’homme » et « Jésus » remplacent certains pronoms grecs afin d’éviter toute ambiguïté. Le deux-points final est conservé parce que la question de Jésus suit au verset suivant.'
