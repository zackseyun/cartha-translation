id: LUK.18.14
reference: Luke 18:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: λέγω ὑμῖν, κατέβη οὗτος δεδικαιωμένος εἰς τὸν οἶκον αὐτοῦ ⸂παρ’ ἐκεῖνον⸃· ὅτι πᾶς ὁ ὑψῶν ἑαυτὸν ταπεινωθήσεται, ὁ δὲ ταπεινῶν ἑαυτὸν ὑψωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/014.yaml
  text: I tell you[a], this man went down to his house justified rather than the other; because everyone who exalts himself will be humbled, but the one who humbles himself will be exalted.
translation:
  language: fr
  text: Je vous le dis, cet homme est redescendu chez lui justifié, plutôt que l’autre[a] ; car quiconque s’élève sera abaissé, mais celui qui s’abaisse sera élevé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « déclaré juste en comparaison de l’autre » ; l’expression met cet homme en contraste avec l’autre homme venu prier.'
    reason: Alternative lexicale pour « justifié » et indication de la nuance comparative de παρ’ ἐκεῖνον.
lexical_decisions:
- source_word: δεδικαιωμένος
  choice: déclaré juste
  rationale: Le participe parfait passif exprime ici le verdict favorable de Dieu et son résultat durable. « Déclaré juste » rend ce sens de façon plus transparente en français courant que le seul terme « justifié », sans développer une formulation doctrinale étrangère au verset.
- source_word: παρ’ ἐκεῖνον
  choice: plutôt que l’autre
  rationale: παρά avec l’accusatif marque ici la comparaison ou le contraste entre le collecteur d’impôts et le pharisien. Cette formulation française est naturelle tout en laissant en note l’autre analyse possible.
- source_word: κατέβη
  choice: est redescendu
  rationale: Le verbe conserve le mouvement concret de descente depuis le lieu du temple. Le passé composé convient au récit en français moderne.
- source_word: εἰς τὸν οἶκον αὐτοῦ
  choice: chez lui
  rationale: L’expression idiomatique française rend naturellement le retour à sa maison sans perdre l’idée de destination.
- source_word: πᾶς ὁ ὑψῶν ἑαυτόν
  choice: quiconque s’élève
  rationale: « Quiconque » exprime la portée générale du participe substantivé, tandis que la forme pronominale conserve l’action exercée sur soi-même.
- source_word: ταπεινωθήσεται
  choice: sera abaissé
  rationale: Le futur passif est conservé et laisse l’agent implicite, comme dans le grec.
- source_word: ὁ δὲ ταπεινῶν ἑαυτόν
  choice: mais celui qui s’abaisse
  rationale: La formulation maintient le contraste introduit par δέ ainsi que le parallélisme avec la proposition précédente.
- source_word: ὑψωθήσεται
  choice: sera élevé
  rationale: Le futur passif répond directement à « s’élève » et préserve le renversement exprimé dans la maxime.
- source_word: ὅτι
  choice: car
  rationale: « Car » introduit naturellement en français la raison qui fonde le verdict précédent.
- source_word: οὗτος
  choice: cet homme
  rationale: L’expression renvoie clairement au collecteur d’impôts et souligne son contraste avec l’autre homme de la parabole.
theological_decisions:
- issue: Sens de δικαιόω dans la conclusion de la parabole
  choice: Verdict divin favorable rendu par « déclaré juste »
  alternative: « justifié » ou « reconnu juste »
  rationale: Le contexte oppose les deux hommes devant Dieu. La traduction garde la portée judiciaire du terme et le verdict favorable de Dieu, sans y importer à elle seule un système doctrinal plus développé.
- issue: Agent des futurs passifs ταπεινωθήσεται et ὑψωθήσεται
  choice: Conserver les passifs « sera abaissé » et « sera élevé »
  alternative: Expliciter Dieu comme agent
  rationale: Le grec ne nomme pas l’agent. Les passifs français préservent cette réserve tout en permettant de comprendre, dans le contexte, que Dieu accomplit le renversement.
- issue: Forme masculine représentative de la maxime
  choice: « quiconque » puis « celui qui » au singulier
  alternative: Formulation plurielle ou entièrement épicène
  rationale: Cette formulation française exprime une vérité générale tout en conservant le singulier et le parallélisme du grec.
translation_notes:
  register: Français international moderne, digne et accessible. « Chez lui » et le passé composé donnent une expression naturelle, tandis que les passifs et le parallélisme conservent la force solennelle de la maxime.
