source:
  edition: SBLGNT
  text: καὶ ἐβόησεν λέγων· Ἰησοῦ υἱὲ Δαυίδ, ἐλέησόν με.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/038.yaml
  text: And he cried out[a], saying, “Jesus, Son of David, have mercy on me!”
translation:
  language: fr
  text: 'Alors il cria : « Jésus, Fils de David[a], aie pitié de moi ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Fils de David » est un titre messianique qui évoque le roi promis dans la lignée de David ; l’expression peut aussi, plus généralement, signifier « descendant de David ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐβόησεν
  choice: il cria
  rationale: Le verbe βοάω exprime un cri poussé à voix forte. « Il cria » restitue naturellement en français le volume et l’urgence de l’appel.
- source_word: λέγων
  choice: ':'
  rationale: Le participe introduit les paroles prononcées. En français narratif, les deux-points rendent cette fonction plus naturellement que le calque « en disant ».
- source_word: Ἰησοῦ
  choice: Jésus
  rationale: Il s’agit du vocatif du nom Ἰησοῦς, rendu selon sa forme française consacrée.
- source_word: υἱὲ Δαυίδ
  choice: Fils de David
  rationale: Cette formule fonctionne ici comme un titre royal et messianique. La traduction littérale préserve ses échos bibliques, sans la réduire à une simple indication généalogique.
- source_word: ἐλέησόν με
  choice: aie pitié de moi
  rationale: L’impératif exprime un appel direct et pressant à la compassion et à l’intervention miséricordieuse. « Aie pitié de moi » est idiomatique, digne et bien établi en français biblique.
theological_decisions:
- issue: Portée messianique de υἱὲ Δαυίδ
  choice: Conserver le titre « Fils de David ».
  alternative: Traduire de façon explicative par « descendant de David ».
  rationale: Dans le récit de Luc, l’expression porte une résonance royale et messianique. « Fils de David » conserve cette portée sans imposer une explication dans le corps du texte.
translation_notes:
  register: Français moderne, clair et digne. « Alors » rend la progression narrative de καί sans calque lourd. La ponctuation française remplace naturellement le participe λέγων, et le vouvoiement n’entre pas en jeu puisque l’impératif français marque ici seulement le singulier.
