id: LUK.18.7
reference: Luke 18:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ δὲ θεὸς οὐ μὴ ποιήσῃ τὴν ἐκδίκησιν τῶν ἐκλεκτῶν αὐτοῦ τῶν βοώντων ⸀αὐτῷ ἡμέρας καὶ νυκτός, καὶ ⸀μακροθυμεῖ ἐπ’ αὐτοῖς;
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/007.yaml
  text: And will not God bring justice for his chosen ones[a], who cry out to him day and night? Will he delay long over them?
translation:
  language: fr
  text: Et Dieu ne fera-t-il pas justice à ceux qu’il a choisis, qui crient vers lui jour et nuit ? Tardera-t-il longtemps à agir en leur faveur[a] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « bien qu’il use de patience envers eux » ou « et use-t-il de patience envers eux ? » L’expression grecque peut évoquer la patience plutôt qu’un délai.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκδίκησιν
  choice: fera-t-il justice
  rationale: Dans le cadre judiciaire de la parabole, le terme désigne le fait de rendre justice ou d’accorder réparation, plutôt qu’une vengeance personnelle.
- source_word: ἐκλεκτῶν
  choice: ceux qu’il a choisis
  rationale: L’adjectif grec est employé comme nom. Cette formulation est naturelle en français actuel et conserve l’idée du choix de Dieu sans introduire un vocabulaire confessionnel spécialisé.
- source_word: βοώντων
  choice: qui crient vers lui
  rationale: Le participe exprime un appel pressant et répété. « Crient vers lui » en restitue l’intensité dans un contexte de prière.
- source_word: ἡμέρας καὶ νυκτός
  choice: jour et nuit
  rationale: Cette expression française courante conserve l’insistance temporelle de l’idiome grec.
- source_word: μακροθυμεῖ ἐπ’ αὐτοῖς
  choice: Tardera-t-il longtemps à agir en leur faveur ?
  rationale: Dans le contexte, la question porte vraisemblablement sur un éventuel délai avant l’intervention de Dieu. « En leur faveur » explicite la relation exprimée par ἐπ’ αὐτοῖς sans suggérer que Dieu les rejette, tandis que la note préserve le sens possible de patience.
- source_word: οὐ μὴ ποιήσῃ
  choice: ne fera-t-il pas
  rationale: La forte négation grecque, dans une question rhétorique qui appelle une réponse affirmative, se rend naturellement en français par « ne… pas ? ».
- source_word: θεὸς
  choice: Dieu
  rationale: Traduction française standard du terme grec dans ce contexte.
theological_decisions:
- issue: Sens de μακροθυμεῖ ἐπ’ αὐτοῖς et rapport entre la patience de Dieu et la rapidité de son intervention
  choice: 'La proposition principale est comprise comme une question portant sur le délai éventuel de l’intervention divine : « Tardera-t-il longtemps à agir en leur faveur ? »'
  alternative: « Bien qu’il use de patience envers eux » ou « et use-t-il de patience envers eux ? »
  rationale: Le contexte immédiat, notamment l’annonce d’une justice rendue rapidement au verset suivant, favorise ici l’idée d’un délai. Toutefois, μακροθυμέω signifie normalement « être patient » ou « faire preuve de longanimité » ; la note conserve donc cette ambiguïté réelle sans trancher silencieusement la tension théologique.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation garde la force des questions rhétoriques et évite les termes spécialisés tels que « les élus », tout en maintenant le sens théologique du choix divin.
