id: LUK.18.20
reference: Luke 18:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τὰς ἐντολὰς οἶδας· Μὴ μοιχεύσῃς, Μὴ φονεύσῃς, Μὴ κλέψῃς, Μὴ ψευδομαρτυρήσῃς, Τίμα τὸν πατέρα σου καὶ τὴν ⸀μητέρα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/020.yaml
  text: 'You know the commandments: Do not commit adultery[a], do not murder, do not steal, do not bear false witness, honor your father and mother.'
translation:
  language: fr
  text: 'Tu connais les commandements : Ne commets pas d’adultère[a], ne commets pas de meurtre, ne vole pas, ne porte pas de faux témoignage, honore ton père et ta mère.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, selon la formulation traditionnelle : « Tu ne commettras pas d’adultère… Tu ne commettras pas de meurtre… Tu ne voleras pas… Tu ne porteras pas de faux témoignage. »'
    reason: Alternative stylistique conservant la tournure traditionnelle française du Décalogue.
lexical_decisions:
- source_word: τὰς ἐντολὰς
  choice: les commandements
  rationale: Dans ce contexte, ἐντολή désigne les commandements bien connus du Décalogue. « Les commandements » en conserve la portée biblique et normative.
- source_word: οἶδας
  choice: tu connais
  rationale: Bien que la forme grecque soit un parfait, οἶδα a ici un sens présent. « Tu connais » est naturel et précis.
- source_word: Μὴ μοιχεύσῃς
  choice: Ne commets pas d’adultère
  rationale: Cette formulation moderne exprime clairement l’interdiction précise portée par μοιχεύω.
- source_word: Μὴ φονεύσῃς
  choice: ne commets pas de meurtre
  rationale: φονεύω désigne le fait de tuer de manière criminelle, et non toute mise à mort sans distinction. Cette traduction évite l’ambiguïté plus large de « ne tue pas ».
- source_word: Μὴ κλέψῃς
  choice: ne vole pas
  rationale: Traduction directe, idiomatique et contemporaine de κλέπτω.
- source_word: Μὴ ψευδομαρτυρήσῃς
  choice: ne porte pas de faux témoignage
  rationale: Cette expression conserve à la fois le sens de témoigner faussement et l’écho reconnaissable du Décalogue.
- source_word: Τίμα
  choice: honore
  rationale: τιμάω appelle ici à accorder aux parents l’honneur qui leur est dû. « Honore » préserve cette portée éthique plus complète que le seul « respecte ».
- source_word: τὸν πατέρα σου καὶ τὴν μητέρα
  choice: ton père et ta mère
  rationale: Le possessif répété est naturel en français et rend explicitement la relation aux deux parents.
theological_decisions:
- issue: Forme des interdictions du Décalogue
  choice: Employer des impératifs négatifs modernes (« Ne commets pas… », « ne vole pas… »).
  alternative: Employer la formulation traditionnelle au futur (« Tu ne commettras pas… », « tu ne voleras pas… »).
  rationale: Le grec emploie des subjonctifs aoristes prohibitifs qui ont valeur d’interdiction. L’impératif négatif restitue clairement cette force en français actuel, sans modifier la portée théologique des commandements.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement correspond au singulier grec adressé à l’interlocuteur. Les formulations restent proches du Décalogue tout en évitant une syntaxe inutilement archaïque.
