id: LUK.18.32
reference: Luke 18:32
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: παραδοθήσεται γὰρ τοῖς ἔθνεσιν καὶ ἐμπαιχθήσεται καὶ ὑβρισθήσεται καὶ ἐμπτυσθήσεται,
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/032.yaml
  text: For he will be handed over to the Gentiles and will be mocked and insulted and spit on[b][a],
translation:
  language: fr
  text: Car il sera livré aux non-Juifs[a], tourné en dérision, outragé et on crachera sur lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « aux nations ». Ici, il s’agit plus précisément des peuples non juifs.
    reason: lexical_alternative
lexical_decisions:
- source_word: παραδοθήσεται
  choice: il sera livré
  rationale: Le futur passif est conservé sans préciser l’agent ni réduire le sens à une trahison; « livré » exprime naturellement la remise aux mains d’autrui.
- source_word: γὰρ
  choice: Car
  rationale: « Car » marque avec concision le lien explicatif avec l’annonce du verset précédent.
- source_word: τοῖς ἔθνεσιν
  choice: aux non-Juifs
  rationale: Dans ce contexte, le terme désigne les peuples autres qu’Israël, et plus précisément ceux entre les mains desquels Jésus sera livré; « non-Juifs » est clair en français moderne.
- source_word: ἐμπαιχθήσεται
  choice: tourné en dérision
  rationale: Cette expression rend la moquerie méprisante et publique évoquée par le verbe grec, dans un registre digne et naturel.
- source_word: ὑβρισθήσεται
  choice: outragé
  rationale: « Outragé » conserve la portée de l’affront déshonorant et du traitement humiliant, sans limiter le terme à de simples paroles insultantes.
- source_word: ἐμπτυσθήσεται
  choice: couvert de crachats
  rationale: Cette formulation idiomatique conserve l’acte concret et humiliant exprimé par le passif grec.
theological_decisions:
- issue: Référent du sujet sous-entendu des verbes passifs
  choice: Ajout de « il », qui renvoie au Fils de l’homme mentionné au verset précédent
  alternative: Reprendre explicitement « le Fils de l’homme »
  rationale: Le grec n’exprime pas le sujet dans ce verset, mais son antécédent est clair en Luc 18.31. Le pronom produit un français naturel sans ajouter de contenu théologique.
- issue: Sens de τοῖς ἔθνεσιν
  choice: « aux non-Juifs » dans le texte
  alternative: « aux nations »
  rationale: Le contexte historique vise les personnes étrangères au peuple juif plutôt que des États ou des nations considérés abstraitement; une note conserve néanmoins l’alternative formelle.
translation_notes:
  register: Français international moderne, digne et accessible. La coordination grecque répétée est légèrement allégée pour une lecture naturelle, tout en préservant la succession des humiliations et les quatre futurs passifs.
