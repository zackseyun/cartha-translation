  text: ὁ δὲ εἶπεν· Τὰ ἀδύνατα παρὰ ἀνθρώποις δυνατὰ ⸂παρὰ τῷ θεῷ ἐστιν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/027.yaml
  text: But he said[a], “What is impossible with men is possible with God.”
translation:
  language: fr
  text: 'Mais il dit : « Ce qui est impossible aux êtres humains est possible à Dieu. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀδύνατα
  choice: ce qui est impossible
  rationale: L’adjectif neutre pluriel est employé comme substantif. « Ce qui est impossible » est naturel en français et conserve la portée générale de l’expression.
- source_word: παρὰ ἀνθρώποις
  choice: aux êtres humains
  rationale: Avec le datif, παρά indique ici le domaine ou le point de référence. « Impossible aux êtres humains » exprime clairement l’incapacité humaine, sans limiter ἀνθρώποις aux personnes de sexe masculin.
- source_word: δυνατὰ
  choice: possible
  rationale: Ce terme répond directement à ἀδύνατα. Le singulier français s’accorde naturellement avec « ce qui » tout en rendant le pluriel substantivé grec de façon idiomatique.
- source_word: παρὰ τῷ θεῷ
  choice: à Dieu
  rationale: La tournure française « possible à Dieu » marque le même contraste de capacité ou de domaine que « impossible aux êtres humains » et reste proche de la construction grecque.
- source_word: ὁ δὲ εἶπεν
  choice: Mais il dit
  rationale: δέ a ici une valeur légèrement adversative dans la réponse de Jésus à ce qui précède. Le présent narratif « dit » est naturel et digne en français biblique moderne.
theological_decisions:
- issue: Portée de la possibilité divine
  choice: L’énoncé oppose ce qui dépasse la capacité humaine à ce qui est possible à Dieu, dans le contexte du salut.
  alternative: Lire la phrase comme une définition philosophique exhaustive de l’omnipotence divine.
  rationale: La formulation générale du grec est préservée, mais la traduction n’ajoute aucune précision abstraite qui dépasserait le propos du passage.
translation_notes:
  register: Français international moderne, simple et digne. « Êtres humains » rend explicitement la portée générique de ἀνθρώποις; le parallélisme « impossible aux êtres humains / possible à Dieu » conserve la tension et la concision de l’original.
