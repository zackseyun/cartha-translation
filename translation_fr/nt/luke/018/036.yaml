  text: And hearing a crowd passing by[a], he was asking what this meant.
translation:
  language: fr
  text: Entendant une foule passer, il demandait ce que c’était[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ce que cela pouvait bien être ». L’imparfait peut suggérer qu’il posait la question à plusieurs reprises, et l’optatif de la question indirecte peut recevoir une nuance légèrement plus incertaine.'
    reason: alternative lexicale et aspectuelle
lexical_decisions:
- source_word: ἀκούσας
  choice: Entendant
  rationale: Le participe aoriste exprime ici une circonstance, principalement temporelle. « Entendant » conserve la fluidité du récit sans imposer une succession trop rigide.
- source_word: δὲ
  choice: (non traduit séparément)
  rationale: Dans ce récit, δέ sert de liaison légère. En français, l’enchaînement naturel des propositions suffit à rendre cette continuité sans ajouter un contraste absent du grec.
- source_word: ὄχλου
  choice: une foule
  rationale: Le nom sans article désigne naturellement une foule non encore identifiée dans la scène immédiate.
- source_word: διαπορευομένου
  choice: passer
  rationale: Le participe présent décrit le mouvement en cours de la foule. L’infinitif après « entendre » constitue en français une tournure naturelle et concise.
- source_word: ἐπυνθάνετο
  choice: il demandait
  rationale: L’imparfait grec présente la demande comme une action en cours et peut aussi suggérer qu’elle a été répétée. L’imparfait français préserve cette ouverture aspectuelle.
- source_word: τί εἴη τοῦτο
  choice: ce que c’était
  rationale: Cette formulation rend directement la question indirecte. L’optatif peut avoir une nuance plus éventuelle, signalée en note, mais il peut aussi s’expliquer par le discours indirect après un verbe au passé.
