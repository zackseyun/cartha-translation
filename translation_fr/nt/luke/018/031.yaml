  source_fidelity: 'Le texte rend fidèlement les éléments grecs : Παραλαβών (« prit ... avec lui »), la désignation « les Douze », le marqueur d’attention ἰδού, la montée vers Jérusalem, l’accomplissement futur de l’ensemble de ce qui est écrit par l’intermédiaire des prophètes, et le titre « le Fils de l’homme ». « Au sujet du » exprime naturellement la référence que le contexte favorise pour le datif, sans prétendre éliminer son ambiguïté.'
