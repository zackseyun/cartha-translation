id: LUK.18.31
reference: Luke 18:31
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Παραλαβὼν δὲ τοὺς δώδεκα εἶπεν πρὸς αὐτούς· Ἰδοὺ ἀναβαίνομεν εἰς ⸀Ἰερουσαλήμ, καὶ τελεσθήσεται πάντα τὰ γεγραμμένα διὰ τῶν προφητῶν τῷ υἱῷ τοῦ ἀνθρώπου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/031.yaml
  text: Then taking the twelve aside[a], he said to them, “Look, we are going up to Jerusalem, and everything written through the prophets about the Son of Man will be fulfilled.”
translation:
  language: fr
  text: 'Puis il prit les Douze avec lui et leur dit : « Voici, nous montons à Jérusalem, et tout ce qui a été écrit par l’intermédiaire des prophètes au sujet du Fils de l’homme[a] s’accomplira. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour le Fils de l’homme » ; la construction grecque peut se traduire plus littéralement ainsi, mais elle désigne probablement ici ce que les prophètes ont écrit à son sujet.
    reason: alternative_reading
lexical_decisions:
- source_word: Παραλαβὼν
  choice: il prit … avec lui
  rationale: Le verbe παραλαμβάνω exprime ici le fait de prendre les Douze avec soi. Cette formulation reste proche du grec sans ajouter explicitement « à part », nuance plausible dans le contexte mais non exprimée par un terme distinct.
- source_word: τοὺς δώδεκα
  choice: les Douze
  rationale: Le grec emploie la désignation reconnue du groupe sans ajouter « disciples ».
- source_word: Ἰδοὺ
  choice: Voici
  rationale: Marqueur discursif qui attire l’attention sur l’annonce qui suit ; « Voici » convient à un registre moderne et digne.
- source_word: ἀναβαίνομεν
  choice: nous montons
  rationale: Conserve à la fois le déplacement vers Jérusalem et l’idée d’ascension géographique.
- source_word: τελεσθήσεται
  choice: s’accomplira
  rationale: Le futur passif indique que les paroles prophétiques parviendront à leur réalisation ; « s’accomplira » est naturel dans ce contexte.
- source_word: πάντα τὰ γεγραμμένα
  choice: tout ce qui a été écrit
  rationale: Rend la totalité exprimée par πάντα et la valeur résultative du participe parfait γεγραμμένα.
- source_word: διὰ τῶν προφητῶν
  choice: par l’intermédiaire des prophètes
  rationale: διά avec le génitif présente les prophètes comme les agents ou instruments par lesquels ces paroles ont été écrites.
- source_word: τῷ υἱῷ τοῦ ἀνθρώπου
  choice: au sujet du Fils de l’homme
  rationale: Dans cette construction, le datif est naturellement compris comme indiquant la personne concernée, tout en signalant en note sa formulation plus littérale et son ambiguïté.
theological_decisions:
- issue: Traduction du titre christologique ὁ υἱὸς τοῦ ἀνθρώπου
  choice: le Fils de l’homme
  alternative: l’Être humain
  rationale: La formulation traditionnelle demeure intelligible et préserve le titre grec ainsi que ses résonances possibles, notamment celles de Daniel, sans les expliciter ni les réduire.
- issue: Fonction du datif τῷ υἱῷ τοῦ ἀνθρώπου
  choice: ce qui a été écrit au sujet du Fils de l’homme
  alternative: ce qui a été écrit pour le Fils de l’homme
  rationale: Le contexte favorise une relation de contenu ou de référence, mais la construction grecque peut aussi être rendue plus littéralement par « pour » ; la note conserve cette tension.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase garde le mouvement narratif du grec, le titre « Fils de l’homme » et l’ambiguïté du datif grâce à une note placée sur l’expression concernée.
