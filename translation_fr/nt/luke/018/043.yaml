id: LUK.18.43
reference: Luke 18:43
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ παραχρῆμα ἀνέβλεψεν, καὶ ἠκολούθει αὐτῷ δοξάζων τὸν θεόν. καὶ πᾶς ὁ λαὸς ἰδὼν ἔδωκεν αἶνον τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/043.yaml
  text: And immediately he received his sight[a], and he followed him, glorifying God. And all the people, when they saw it[b], gave praise to God.
translation:
  language: fr
  text: Aussitôt, il se mit à voir[a] et il le suivait[b] en glorifiant Dieu. En voyant cela, tout le peuple adressa des louanges à Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « retrouva la vue » ou « recouvra la vue ». Le verbe grec peut désigner le retour à la vue ou, plus largement, le fait d’accéder à la vue.
    reason: lexical_alternative
  - marker: b
    text: 'Ou « le suivit ». L’imparfait grec peut mettre en relief une action qui se prolongeait : « il était en train de le suivre ».'
    reason: aspectual_alternative
lexical_decisions:
- source_word: παραχρῆμα
  choice: Aussitôt
  rationale: L’adverbe indique que la guérison se produit sans délai. « Aussitôt » est naturel en français narratif et conserve pleinement cette valeur temporelle.
- source_word: ἀνέβλεψεν
  choice: il retrouva la vue
  rationale: Dans un récit de guérison d’un aveugle, le verbe désigne naturellement l’accès ou le retour à la vue. « Retrouva la vue » est idiomatique, tandis que la note conserve les autres nuances possibles sans trancher la question de savoir s’il avait déjà vu auparavant.
- source_word: ἠκολούθει
  choice: il le suivait
  rationale: L’imparfait grec présente l’action comme en cours. L’imparfait français en rend directement l’aspect, même si « il le suivit » serait plus courant dans une simple succession narrative.
- source_word: δοξάζων
  choice: en glorifiant
  rationale: Le gérondif exprime une action concomitante à celle de suivre. « Glorifiant » préserve le vocabulaire de la gloire et le distingue des « louanges » de la proposition suivante.
- source_word: πᾶς ὁ λαός
  choice: tout le peuple
  rationale: Cette expression collective désigne l’ensemble des personnes présentes. « Tout le peuple » suit la forme grecque et convient au registre biblique moderne.
- source_word: ἰδών
  choice: En voyant cela
  rationale: 'Le participe grec, au singulier en accord avec le collectif « peuple », est rendu par une tournure naturelle en français. « Cela » explicite sobrement l’objet sous-entendu : la guérison et la réaction de l’homme.'
- source_word: ἔδωκεν αἶνον
  choice: adressa des louanges
  rationale: La construction signifie littéralement « donna une louange ». « Adressa des louanges » est une formulation française naturelle qui conserve l’idée d’un hommage dirigé vers Dieu.
- source_word: θεόν / θεῷ
  choice: Dieu / à Dieu
  rationale: 'La répétition de « Dieu » est maintenue afin de préserver l’insistance du texte : Dieu est glorifié par l’homme guéri et loué par tout le peuple.'
theological_decisions:
- issue: Aspect de l’action par laquelle l’homme suit Jésus après sa guérison
  choice: il le suivait
  alternative: il le suivit
  rationale: L’imparfait grec présente cette action comme continue. L’imparfait français garde cette valeur sans développer davantage la portée théologique de l’acte de suivre Jésus.
- issue: Sens de ἀναβλέπω et éventuelle vue antérieure
  choice: retrouva la vue, avec une note signalant l’ambiguïté
  alternative: se mit à voir / recouvra la vue
  rationale: Le contexte indique clairement l’acquisition de la vue, mais le verbe peut être compris comme un retour à la vue sans que le récit établisse nécessairement que l’homme avait vu auparavant. La note préserve cette nuance.
- issue: Accord collectif de πᾶς ὁ λαός
  choice: tout le peuple… adressa
  alternative: tous ceux qui étaient là… adressèrent
  rationale: Le singulier collectif du grec peut être conservé naturellement en français et évite de remplacer « peuple » par une interprétation plus étroite comme « foule ».
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proche du mouvement du grec tout en évitant les calques peu naturels. La répétition de « Dieu » et la distinction entre « glorifier » et « adresser des louanges » sont conservées.
