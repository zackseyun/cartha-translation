  text: χήρα δὲ ἦν ἐν τῇ πόλει ἐκείνῃ καὶ ἤρχετο πρὸς αὐτὸν λέγουσα· Ἐκδίκησόν με ἀπὸ τοῦ ἀντιδίκου μου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/003.yaml
  text: And there was a widow in that city[a], and she kept coming to him, saying, ‘Give me justice against my adversary.’
translation:
  language: fr
  text: 'Il y avait dans cette ville une veuve qui revenait sans cesse le voir et lui disait : « Rends-moi justice contre mon adversaire[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Fais valoir mon droit face à mon adversaire » ou « Accorde-moi justice contre ma partie adverse ». Le verbe grec peut désigner l’obtention de la justice ou la reconnaissance du bon droit dans un litige, sans impliquer nécessairement une vengeance personnelle.
    reason: lexical_alternative
lexical_decisions:
- source_word: χήρα
  choice: une veuve
  rationale: Équivalent français précis et courant, qui conserve la portée sociale du personnage dans le cadre de la parabole.
- source_word: δὲ
  choice: Il y avait
  rationale: La particule assure ici la continuité narrative; elle n’a pas besoin d’être rendue séparément par « et » en français, où l’introduction existentielle suffit naturellement.
- source_word: ἦν ἐν τῇ πόλει ἐκείνῃ
  choice: Il y avait dans cette ville
  rationale: Tournure existentielle française naturelle, fidèle au cadre spatial exprimé par le grec.
- source_word: ἤρχετο πρὸς αὐτόν
  choice: qui revenait sans cesse le voir
  rationale: L’imparfait grec prend en contexte une valeur itérative; cette formulation exprime clairement les démarches répétées et persistantes de la veuve.
- source_word: λέγουσα
  choice: et lui disait
  rationale: Le participe présent accompagne les visites répétées; l’imparfait français maintient cet aspect habituel de manière idiomatique.
- source_word: Ἐκδίκησόν με
  choice: Rends-moi justice
  rationale: Dans ce contexte judiciaire, le verbe demande l’obtention d’un juste recours ou d’une décision favorable, non une vengeance personnelle.
- source_word: ἀπὸ τοῦ ἀντιδίκου μου
  choice: contre mon adversaire
  rationale: ἀντίδικος désigne la partie adverse dans un litige; « adversaire » conserve la dimension juridique sans limiter indûment le rôle précis de cette personne.
