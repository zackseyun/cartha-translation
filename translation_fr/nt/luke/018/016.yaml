  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς ⸂προσεκαλέσατο αὐτὰ λέγων⸃· Ἄφετε τὰ παιδία ἔρχεσθαι πρός με καὶ μὴ κωλύετε αὐτά, τῶν γὰρ τοιούτων ἐστὶν ἡ βασιλεία τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/016.yaml
  text: But Jesus called them to him[a], saying, “Let the children come to me, and do not hinder them, for the kingdom of God belongs to such as these.”
translation:
  language: fr
  text: 'Mais Jésus les appela auprès de lui et dit : « Laissez les enfants venir à moi et ne les en empêchez pas, car le royaume de Dieu appartient à ceux qui sont comme eux[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « car c’est à de tels êtres qu’est le royaume de Dieu ».'
    reason: La note conserve la forme très concise de la construction grecque τῶν γὰρ τοιούτων ἐστὶν ἡ βασιλεία τοῦ θεοῦ, que le texte courant rend de façon plus idiomatique.
lexical_decisions:
- source_word: προσεκαλέσατο αὐτὰ
  choice: les appela auprès de lui
  rationale: Le moyen προσεκαλέσατο exprime ici l’idée d’appeler ou de faire venir auprès de soi. Cette formulation naturelle en français conserve cette orientation vers Jésus, et αὐτά reprend les enfants mentionnés dans le contexte.
- source_word: Ἄφετε τὰ παιδία ἔρχεσθαι πρός με
  choice: Laissez les enfants venir à moi
  rationale: Ἄφετε suivi de l’infinitif signifie permettre ou laisser faire. La tournure française restitue directement l’ordre et le mouvement vers Jésus.
- source_word: μὴ κωλύετε αὐτά
  choice: ne les en empêchez pas
  rationale: κωλύω signifie empêcher, entraver ou faire obstacle. Le pronom « en » rattache naturellement l’interdiction, en français, à l’action de venir à Jésus sans réduire le sens à une interdiction seulement verbale.
- source_word: τῶν τοιούτων
  choice: à ceux qui sont comme eux
  rationale: Le génitif pluriel désigne une catégorie représentée par les enfants présents, sans préciser quelle caractéristique est visée. « Ceux qui sont comme eux » garde cette portée représentative et cette indétermination.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: le royaume de Dieu
  rationale: Expression française établie et directe pour désigner le règne ou royaume de Dieu, sans trancher ici les différentes dimensions du concept.
theological_decisions:
- issue: Portée de τῶν τοιούτων
  choice: La parole vise ceux qui sont comme les enfants présents, sans définir dans ce verset en quoi consiste cette ressemblance.
  alternative: Limiter la référence aux seuls enfants présents, ou expliciter une qualité particulière telle que l’innocence, l’humilité ou la confiance.
  rationale: τοιούτων a une valeur qualitative et représentative. La traduction doit préserver l’ouverture du texte et ne pas introduire une définition théologique absente de ce verset.
- issue: Relation exprimée par le génitif dans τῶν τοιούτων ἐστὶν ἡ βασιλεία
  choice: « le royaume de Dieu appartient à ceux qui sont comme eux »
  alternative: « le royaume de Dieu est à ceux qui sont comme eux » ou, plus littéralement, « c’est à de tels êtres qu’est le royaume de Dieu »
  rationale: « Appartient à » rend idiomatiquement la relation d’appartenance ou de destination exprimée par la construction grecque, tout en signalant en note sa forme plus littérale.
translation_notes:
  register: Français international moderne, simple et digne. « Auprès de lui » restitue la nuance de l’appel vers soi; « ne les en empêchez pas » est idiomatique et conserve la force de l’impératif. La ponctuation suit l’usage français contemporain.
