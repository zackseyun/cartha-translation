source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτοῖς· Ἀμὴν λέγω ὑμῖν ὅτι οὐδείς ἐστιν ὃς ἀφῆκεν οἰκίαν ἢ ⸂γυναῖκα ἢ ἀδελφοὺς ἢ γονεῖς⸃ ἢ τέκνα ἕνεκεν τῆς βασιλείας τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/029.yaml
  text: And he said to them, “Truly I say to you, there is no one who has left a house or wife or brothers or parents or children for the sake of the kingdom of God,”
translation:
  language: fr
  text: 'Et il leur dit : « Vraiment, je vous le dis, personne n’a quitté sa maison, sa femme, ses frères, ses parents ou ses enfants à cause du royaume de Dieu, »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀμὴν
  choice: Vraiment
  rationale: Rend l’affirmation solennelle de Jésus en français moderne et naturel, sans translittération opaque.
- source_word: ἀφῆκεν
  choice: a quitté
  rationale: Exprime ici le fait de laisser derrière soi des relations ou un foyer; le passé composé convient au contexte et au français courant.
- source_word: οἰκίαν
  choice: maison
  rationale: Le nom sans article dans une énumération se rend naturellement par « maison » en français et peut désigner le foyer ou l’habitation.
- source_word: γυναῖκα
  choice: femme
  rationale: Dans cette liste de proches, le terme désigne l’épouse; « femme » conserve toutefois la forme simple du grec et reste idiomatique dans l’expression « quitter femme et enfants ».
- source_word: ἕνεκεν τῆς βασιλείας τοῦ θεοῦ
  choice: à cause du royaume de Dieu
  rationale: Préserve le rapport causal ou motivant indiqué par ἕνεκεν, sans développer l’interprétation.
theological_decisions:
- issue: Portée de « quitter » les proches pour le royaume
  choice: Conserver la formulation absolue « a quitté »
  alternative: « a renoncé à » ou « a laissé derrière lui »
  rationale: Le verset ne précise ni les circonstances ni la permanence de la séparation; une formulation directe préserve cette tension sans ajouter une règle sur les obligations familiales.
translation_notes:
  register: Français international moderne, digne et oralement fluide. La ponctuation finale conserve la virgule parce que la phrase de Jésus se poursuit au verset 30.
