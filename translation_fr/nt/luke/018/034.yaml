id: LUK.18.34
reference: Luke 18:34
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ αὐτοὶ οὐδὲν τούτων συνῆκαν, καὶ ἦν τὸ ῥῆμα τοῦτο κεκρυμμένον ἀπ’ αὐτῶν, καὶ οὐκ ἐγίνωσκον τὰ λεγόμενα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/034.yaml
  text: And they understood none of these things[a], and this saying was hidden from them[c][b], and they did not understand the things being said.
translation:
  language: fr
  text: Mais eux ne comprirent rien de tout cela. Cette parole leur était cachée[a][b], et ils ne saisissaient pas ce qui était dit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « cette déclaration » ou « ce message ».
    reason: lexical_alternative
  - marker: b
    text: Le texte ne précise pas qui ou quoi la leur cachait.
    reason: alternative_reading
lexical_decisions:
- source_word: συνῆκαν
  choice: ne comprirent
  rationale: Le verbe désigne ici la compréhension intellectuelle des annonces précédentes de Jésus. « Comprendre » est naturel et précis en français.
- source_word: οὐδὲν τούτων
  choice: rien à tout cela
  rationale: Cette tournure française idiomatique renvoie à l’ensemble des déclarations précédentes sans réduire leur portée à une seule.
- source_word: τὸ ῥῆμα τοῦτο
  choice: cette parole
  rationale: « Parole » conserve l’étendue sémantique de ῥῆμα, qui peut désigner une parole prononcée, une déclaration ou son contenu.
- source_word: κεκρυμμένον ἀπ’ αὐτῶν
  choice: leur était cachée
  rationale: La formulation exprime l’état résultant indiqué par la construction périphrastique au parfait, tout en maintenant le passif et en laissant l’agent implicite.
- source_word: ἐγίνωσκον
  choice: ne saisissaient pas
  rationale: Dans ce contexte, γινώσκω exprime l’absence de compréhension. « Saisir » rend ce sens tout en évitant de répéter « comprendre » et en préservant la variation lexicale de Luc.
- source_word: τὰ λεγόμενα
  choice: ce qui était dit
  rationale: Cette expression naturelle conserve la valeur passive et le contenu des paroles en cours d’énonciation.
theological_decisions:
- issue: Nature de l’incompréhension des disciples
  choice: Conserver la triple description de leur incompréhension sans préciser l’origine de la dissimulation.
  alternative: Attribuer explicitement la dissimulation à Dieu, ou la réduire à une confusion psychologique.
  rationale: Le passif grec ne nomme ni l’agent ni la cause. La traduction maintient donc cette tension théologique.
translation_notes:
  register: Français international moderne, digne et accessible. L’ouverture « Mais eux » rend le contraste contextuel et l’accent porté par αὐτοί. La variation « comprirent / saisissaient » préserve les deux verbes grecs sans rendre la dernière proposition artificielle.
