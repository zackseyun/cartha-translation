  text: Ἐγένετο δὲ ἐν τῷ ἐγγίζειν αὐτὸν εἰς Ἰεριχὼ τυφλός τις ἐκάθητο παρὰ τὴν ὁδὸν ⸀ἐπαιτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/035.yaml
  text: As he was approaching Jericho[a], a certain blind man was sitting beside the road[b], begging.
translation:
  language: fr
  text: Comme il approchait de Jéricho, un aveugle était assis au bord du chemin et mendiait.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: Comme il approchait
  rationale: L’expression sert ici surtout à introduire la scène. Le français naturel n’a pas besoin de rendre littéralement « il arriva que »; la transition narrative est portée par la proposition temporelle.
- source_word: ἐν τῷ ἐγγίζειν αὐτὸν εἰς Ἰεριχὼ
  choice: Comme il approchait de Jéricho
  rationale: La construction avec l’infinitif articulé exprime la simultanéité, et l’imparfait français rend bien l’action en cours. Avec « approcher », « de Jéricho » exprime naturellement le mouvement vers la ville.
- source_word: τυφλός τις
  choice: un aveugle
  rationale: τις introduit un individu indéfini. En français moderne, « un certain aveugle » aurait une nuance marquée ou artificielle absente du contexte; l’article indéfini transmet naturellement la valeur de l’expression grecque.
- source_word: ἐκάθητο
  choice: était assis
  rationale: L’imparfait grec plante le décor et présente une situation en cours; l’imparfait français conserve cet aspect.
- source_word: παρὰ τὴν ὁδὸν
  choice: au bord du chemin
  rationale: La préposition indique une position le long de la voie. « Au bord du chemin » est idiomatique, clair et adapté au cadre narratif.
- source_word: ἐπαιτῶν
  choice: et mendiait
  rationale: Le participe décrit l’activité simultanée de l’homme. Une proposition coordonnée à l’imparfait est plus naturelle en français que « mendiant » après « était assis » et conserve l’action en cours.
