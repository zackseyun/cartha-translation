id: LUK.18.39
reference: Luke 18:39
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ οἱ προάγοντες ἐπετίμων αὐτῷ ἵνα ⸀σιγήσῃ· αὐτὸς δὲ πολλῷ μᾶλλον ἔκραζεν· Υἱὲ Δαυίδ, ἐλέησόν με.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/039.yaml
  text: And those going ahead were rebuking him so that he would be silent; but he kept crying out all the more, “Son of David, have mercy on me!”
translation:
  language: fr
  text: 'Ceux qui marchaient devant lui faisaient des reproches pour qu’il se taise. Mais lui criait de plus belle : « Fils de David, aie pitié de moi ! »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ προάγοντες
  choice: ceux qui marchaient devant
  rationale: Le participe présent substantivé désigne les personnes qui avançaient en tête ou se trouvaient devant dans le cortège. Cette formulation conserve le sens spatial sans leur attribuer un rôle de direction.
- source_word: ἐπετίμων αὐτῷ
  choice: lui faisaient des reproches
  rationale: L’imparfait exprime une action en cours ou répétée, et ἐπιτιμάω indique ici une réprimande ferme. La tournure est naturelle en français tout en gardant cette force.
- source_word: ἵνα σιγήσῃ
  choice: pour qu’il se taise
  rationale: La proposition avec ἵνα et le subjonctif exprime le but recherché. « Se taire » rend directement σιγάω dans un français courant et ferme.
- source_word: αὐτὸς δὲ
  choice: mais lui
  rationale: 'Le pronom explicite est contrastif : malgré les reproches, l’homme poursuit son appel. La dislocation française « mais lui » fait ressortir ce contraste.'
- source_word: πολλῷ μᾶλλον
  choice: de plus belle
  rationale: Cette expression idiomatique rend l’intensification de πολλῷ μᾶλλον sans ajouter explicitement l’idée de volume sonore, absente des mots eux-mêmes.
- source_word: ἔκραζεν
  choice: criait
  rationale: L’imparfait français conserve l’aspect continu ou répété du verbe grec à l’imparfait. Combiné à « de plus belle », il exprime nettement la persistance.
- source_word: Υἱὲ Δαυίδ
  choice: Fils de David
  rationale: Le titre vocatif est traduit directement afin de préserver sa portée royale et messianique dans le récit de Luc.
- source_word: ἐλέησόν με
  choice: aie pitié de moi
  rationale: Cette formule française naturelle et consacrée rend l’impératif pressant ainsi que la portée religieuse de l’appel à la compassion.
theological_decisions:
- issue: Portée messianique de Υἱὲ Δαυίδ
  choice: Conserver dans le texte le titre « Fils de David ».
  alternative: Le traiter comme une simple formule honorifique ou l’expliciter par une paraphrase messianique.
  rationale: Dans le récit lucanien, ce titre porte une forte résonance davidique et messianique. Sa traduction littérale préserve cette portée sans imposer une explication absente du verset.
translation_notes:
  register: Français moderne, international et digne. La phrase reste accessible à la lecture publique. « Faisaient des reproches » traduit la réprimande répétée sans registre excessivement soutenu; « de plus belle » restitue naturellement l’intensification et la ténacité de l’homme.
