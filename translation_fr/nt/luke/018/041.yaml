  text: ⸀Τί σοι θέλεις ποιήσω; ὁ δὲ εἶπεν· Κύριε, ἵνα ἀναβλέψω.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/041.yaml
  text: “What do you want me to do for you?” And he said[a], “Lord[b], that I may see again.”
translation:
  language: fr
  text: '« Que veux-tu que je fasse pour toi ? » Il répondit : « Seigneur[a], que je retrouve la vue[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Monsieur »; le grec peut être une formule d’adresse respectueuse, même si « Seigneur » est le rendu habituel de κύριος.'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « que je voie de nouveau ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί σοι θέλεις ποιήσω
  choice: Que veux-tu que je fasse pour toi ?
  rationale: Cette formulation française naturelle conserve l’interrogation sur la demande précise, la volonté exprimée par θέλεις et la valeur bénéficiaire de σοι.
- source_word: ὁ δὲ εἶπεν
  choice: Il répondit
  rationale: Dans ce dialogue, εἶπεν introduit directement la réponse de l’homme; « répondit » rend le lien narratif porté par δέ plus naturellement qu’un « et » explicite.
- source_word: Κύριε
  choice: Seigneur
  rationale: « Seigneur » est le rendu de référence de κύριος et préserve à la fois la valeur d’adresse respectueuse et sa possible portée christologique.
- source_word: ἵνα ἀναβλέψω
  choice: que je retrouve la vue
  rationale: Après une demande, la proposition introduite par ἵνα en exprime ici le contenu. Dans un récit de guérison, ἀναβλέπω signifie couramment recouvrer la vue; cette tournure est claire et idiomatique en français.
theological_decisions:
- issue: Rendu de κύριος dans une adresse directe à Jésus
  choice: Seigneur
  alternative: Monsieur
  rationale: Le grec peut servir de formule de politesse, mais « Seigneur » maintient sans la trancher la tension entre respect ordinaire et reconnaissance plus profonde de l’identité de Jésus.
translation_notes:
  register: Français international moderne, direct et digne. Le tutoiement correspond au singulier grec et à l’usage narratif français habituel dans les dialogues évangéliques. La réponse elliptique conserve la forme concise du grec.
