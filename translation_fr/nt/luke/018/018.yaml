source:
  edition: SBLGNT
  text: Καὶ ἐπηρώτησέν τις αὐτὸν ἄρχων λέγων· Διδάσκαλε ἀγαθέ, τί ποιήσας ζωὴν αἰώνιον κληρονομήσω;
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/018.yaml
  text: And a ruler asked him[a], saying, “Good Teacher, what must I do to inherit eternal life?”
translation:
  language: fr
  text: 'Un chef lui demanda : « Bon maître, que dois-je faire[a] pour hériter de la vie éternelle ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « Qu’est-ce que, après l’avoir fait, j’hériterai de la vie éternelle ? »'
    reason: Reflète de façon plus explicite le participe aoriste (« après l’avoir fait ») et le futur du grec, tout en restant compréhensible en français.
lexical_decisions:
- source_word: ἐπηρώτησέν
  choice: demanda
  rationale: Le verbe signifie couramment « demander » ou « interroger ». « Demanda » convient naturellement au récit sans donner à la question un caractère excessivement formel.
- source_word: τις ἄρχων
  choice: un chef
  rationale: Le pronom indéfini introduit un homme non identifié, tandis que ἄρχων désigne une personne qui exerce une autorité. « Un chef » reste volontairement général et n’attribue pas à cet homme une fonction plus précise que le grec.
- source_word: λέγων
  choice: ':'
  rationale: En français, les deux-points introduisent naturellement les paroles qui suivent et rendent sans lourdeur le participe grec « disant ».
- source_word: Διδάσκαλε ἀγαθέ
  choice: Bon maître
  rationale: Διδάσκαλος désigne celui qui enseigne. Dans l’adresse directe, « maître » est idiomatique en français pour un enseignant reconnu, et « bon » préserve le qualificatif sur lequel Jésus réagira au verset suivant.
- source_word: τί ποιήσας
  choice: que dois-je faire
  rationale: Le participe aoriste associé au futur présente l’action comme la condition ou le moyen envisagé par l’interlocuteur. Cette formulation française naturelle conserve son idée d’une action requise; une note signale la construction plus littérale.
- source_word: ζωὴν αἰώνιον
  choice: la vie éternelle
  rationale: Expression française établie et fidèle dans ce contexte; elle conserve à la fois la dimension durable de la vie et sa portée eschatologique sans développer cette dernière dans le texte.
- source_word: κληρονομήσω
  choice: hériter de
  rationale: Le verbe appartient au langage de l’héritage. « Hériter de » en conserve l’image, importante dans le contexte biblique, plutôt que de la réduire à « obtenir » ou « recevoir ».
theological_decisions:
- issue: La question du salut formulée en fonction de l’action humaine
  choice: que dois-je faire pour hériter de la vie éternelle
  alternative: qu’ayant fait, hériterai-je de la vie éternelle ?
  rationale: La traduction conserve la manière dont le chef pose lui-même la question, en termes d’action requise, sans présenter implicitement cette formulation comme l’enseignement de Luc ni la corriger par une précision doctrinale ultérieure.
translation_notes:
  register: Français international moderne, clair et digne. La ponctuation remplace naturellement le participe de parole grec. « Bon maître » demeure compréhensible dans une adresse respectueuse et prépare directement la réponse du verset suivant.
