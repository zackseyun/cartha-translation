id: LUK.18.42
reference: Luke 18:42
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ὁ Ἰησοῦς εἶπεν αὐτῷ· Ἀνάβλεψον· ἡ πίστις σου σέσωκέν σε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/042.yaml
  text: And Jesus said to him[a], “Receive your sight[b]; your faith has saved you.”
translation:
  language: fr
  text: 'Alors Jésus lui dit : « Retrouve la vue[a] ; ta foi t’a sauvé[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Recouvre la vue ». Le verbe grec peut désigner le fait de voir de nouveau dans un contexte de guérison.
    reason: lexical_alternative
  - marker: b
    text: Ou « t’a guéri » ou « t’a rendu la santé ». Le verbe grec peut parler aussi bien de guérison que de salut.
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ
  choice: Alors
  rationale: Dans la continuité immédiate du récit, « Alors » exprime naturellement en français la progression narrative sans ajouter de lien causal.
- source_word: ὁ Ἰησοῦς εἶπεν αὐτῷ
  choice: Jésus lui dit
  rationale: Formulation française directe et naturelle, qui conserve le sujet explicite et le complément indirect du grec.
- source_word: Ἀνάβλεψον
  choice: Retrouve la vue
  rationale: Dans ce contexte de guérison d’un aveugle, le verbe désigne le recouvrement de la vue plutôt que le simple fait de regarder vers le haut. Cette formulation est claire, actuelle et idiomatique.
- source_word: πίστις
  choice: foi
  rationale: « Foi » rend le terme de manière traditionnelle et intelligible, en désignant ici la confiance croyante de l’homme envers Jésus.
- source_word: σέσωκέν
  choice: t’a sauvé
  rationale: Le parfait de σῴζω peut évoquer à la fois la guérison et le salut. « T’a sauvé » préserve cette amplitude et la tension théologique du récit au lieu de limiter le sens à la guérison physique.
theological_decisions:
- issue: Portée de σῴζω dans un récit de guérison
  choice: t’a sauvé
  alternative: t’a guéri / t’a rendu la santé
  rationale: Le contexte implique manifestement une guérison physique, mais le vocabulaire de Luc permet aussi une portée plus large liée au salut. La traduction principale conserve cette double résonance.
translation_notes:
  register: Français international moderne, simple et digne. Le tutoiement convient à l’adresse directe au singulier. Le point-virgule maintient le lien étroit entre l’ordre de guérison et la déclaration sur la foi.
