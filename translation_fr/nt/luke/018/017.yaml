reference: Luke 18:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν, ὃς ⸀ἂν μὴ δέξηται τὴν βασιλείαν τοῦ θεοῦ ὡς παιδίον, οὐ μὴ εἰσέλθῃ εἰς αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/017.yaml
  text: Truly I tell you[a], whoever does not receive the kingdom of God like a child will certainly not enter it.
translation:
  language: fr
  text: 'Vraiment, je vous le dis : celui qui ne reçoit pas le royaume de Dieu comme un enfant[a] n’y entrera certainement pas.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en tant qu’enfant ». L’expression peut évoquer la réceptivité, la confiance, l’humilité ou la dépendance d’un enfant ; le grec ne précise pas la qualité exacte.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: Vraiment
  rationale: Dans la formule solennelle employée par Jésus, « Vraiment » transmet clairement la force affirmative de ἀμήν en français moderne, sans recourir à la translittération plus liturgique « Amen ».
- source_word: λέγω ὑμῖν
  choice: je vous le dis
  rationale: Cette tournure française naturelle conserve l’adresse directe et la solennité de la formule grecque.
- source_word: ὃς ἂν
  choice: celui qui
  rationale: Le relatif accompagné de ἄν énonce une condition générale et indéfinie. « Celui qui » la rend de manière idiomatique dans cette construction négative.
- source_word: μὴ δέξηται
  choice: n’accueille pas
  rationale: δέχομαι peut signifier recevoir, accepter ou accueillir. « Accueillir » exprime ici une réception favorable et volontaire tout en restant compatible avec l’image du royaume donné ou présenté.
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: le royaume de Dieu
  rationale: C’est la formulation française traditionnelle, claire et largement comprise. Elle préserve l’expression grecque sans réduire βασιλεία à un territoire ni imposer exclusivement le sens abstrait de règne.
- source_word: ὡς παιδίον
  choice: comme un enfant
  rationale: 'La formulation conserve la comparaison et son ambiguïté : elle peut porter sur la manière de recevoir ou évoquer la condition d’un enfant, sans préciser s’il s’agit surtout de confiance, d’humilité, de dépendance ou de réceptivité.'
- source_word: οὐ μὴ εἰσέλθῃ
  choice: n’y entrera certainement pas
  rationale: La double négation οὐ μή avec le subjonctif aoriste est fortement emphatique. « certainement pas » en restitue la force sans transformer explicitement l’énoncé en « jamais ».
- source_word: εἰς αὐτήν
  choice: n’y entrera
  rationale: Le pronom adverbial « y » renvoie naturellement au royaume et exprime le mouvement vers celui-ci sans répétition lourde.
theological_decisions:
- issue: Sens de l’accueil du royaume « comme un enfant »
  choice: Conserver la comparaison sans identifier la qualité précise de l’enfant.
  alternative: Expliciter « avec la confiance », « avec l’humilité » ou « avec la dépendance d’un enfant » ; ou comprendre « en tant qu’enfant ».
  rationale: Le grec ne nomme aucune qualité particulière. La traduction et la note maintiennent donc l’ouverture de l’image et évitent d’imposer une interprétation doctrinale ou psychologique unique.
translation_notes:
  register: Français international moderne, digne et accessible. La formule introductive reste solennelle ; « n’y entrera certainement pas » conserve l’insistance de la négation grecque. La note signale l’ambiguïté réelle de ὡς παιδίον sans la résoudre.
