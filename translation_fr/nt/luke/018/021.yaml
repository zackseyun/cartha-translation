  text: And he said[a], “I have kept all these things from my youth.”
translation:
  language: fr
  text: 'Il répondit : « J’ai observé toutes ces choses depuis ma jeunesse. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ εἶπεν
  choice: Il répondit
  rationale: Dans ce dialogue, cette tournure rend naturellement la reprise de parole. δέ est un lien narratif léger et n’exige pas ici un contraste marqué comme « mais ».
- source_word: Ταῦτα πάντα
  choice: toutes ces choses
  rationale: Cette formulation suit le grec sans ajouter « commandements », terme clairement sous-entendu par le contexte mais absent de la proposition.
- source_word: ἐφύλαξα
  choice: j’ai observé
  rationale: φυλάσσω désigne ici le fait de respecter ou d’observer les commandements. Le passé composé exprime naturellement en français un comportement revendiqué jusqu’au moment présent.
- source_word: ἐκ νεότητος μου
  choice: depuis ma jeunesse
  rationale: ἐκ avec le génitif indique le point de départ temporel. « Depuis ma jeunesse » est l’expression française naturelle qui conserve cette valeur.
theological_decisions: []
translation_notes:
  register: Français moderne, courant et digne. « Observer » convient au contexte des commandements sans expliciter dans le texte ce que le grec laisse implicite.
