source:
  edition: SBLGNT
  text: διά γε τὸ παρέχειν μοι κόπον τὴν χήραν ταύτην ἐκδικήσω αὐτήν ἵνα μὴ εἰς τέλος ἐρχομένη ὑπωπιάζῃ με.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/005.yaml
  text: yet because this widow keeps causing me trouble[a], I will give her justice[b], so that by continually coming she may not wear me out.”
translation:
  language: fr
  text: Pourtant, puisque cette veuve me cause sans cesse des ennuis, je vais lui rendre justice[a], afin que, par ses visites répétées, elle ne finisse par m’épuiser[b]. »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi traduire : « faire valoir son droit » ou, dans certains contextes, « la venger ». Ici, le verbe grec désigne l’obtention d’une réparation judiciaire.'
    reason: alternative_reading
  - marker: b
    text: 'Le verbe grec signifie littéralement « frapper sous l’œil » et peut, au sens figuré, vouloir dire « épuiser » ou « accabler ». La tournure peut aussi se comprendre : « afin qu’elle ne vienne pas sans fin m’épuiser ».'
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: διά γε τὸ παρέχειν μοι κόπον
  choice: puisque cette veuve me cause sans cesse des ennuis
  rationale: διά avec l’infinitif articulé exprime ici la cause, tandis que γε souligne cette motivation. La tournure « causer des ennuis » rend naturellement l’expression παρέχειν ... κόπον, et « sans cesse » fait ressortir la valeur durative de l’infinitif présent.
- source_word: τὴν χήραν ταύτην
  choice: cette veuve
  rationale: Le nom et le démonstratif sont conservés directement; la mention explicite de son veuvage reste importante dans le cadre social et narratif de la parabole.
- source_word: ἐκδικήσω αὐτήν
  choice: je vais lui rendre justice
  rationale: Dans ce contexte judiciaire, ἐκδικέω désigne l’octroi d’une réparation ou d’un jugement juste plutôt qu’une vengeance personnelle. « Rendre justice » est idiomatique en français et maintient le lien avec les versets suivants.
- source_word: ἵνα μὴ
  choice: afin qu’elle ne
  rationale: Cette formulation rend clairement le but recherché par le juge sans recourir à la tournure plus littéraire « de peur que ».
- source_word: εἰς τέλος ἐρχομένη
  choice: ne finisse pas ... à force de venir
  rationale: La formulation française exprime la répétition des venues et leur effet poussé jusqu’au bout. Comme le rattachement précis de εἰς τέλος et sa nuance sont discutables, une note signale l’autre compréhension possible, « venir sans fin ».
- source_word: ὑπωπιάζῃ με
  choice: m’épuiser
  rationale: 'Le sens littéral évoque un coup porté sous l’œil, mais le contexte favorise l’emploi figuré: importuner ou accabler quelqu’un jusqu’à l’épuiser. « M’épuiser » conserve la vigueur de la plainte du juge sans transformer la veuve en menace physique certaine.'
theological_decisions:
- issue: Sens de ἐκδικήσω dans une parabole portant sur la prière et la justice
  choice: je vais lui rendre justice
  alternative: je vais la venger / faire valoir son droit
  rationale: La scène concerne le recours judiciaire accordé à la veuve. Cette traduction évite les connotations de vengeance personnelle tout en préservant le thème de la justice que Dieu accordera, développé dans le contexte immédiat.
- issue: Force de ὑπωπιάζῃ appliqué au juge
  choice: m’épuiser
  alternative: me frapper sous l’œil / me harceler
  rationale: Le contexte permet un emploi figuré énergique sans imposer l’idée que la veuve menace réellement le juge de violence. La note conserve toutefois l’image concrète du grec.
translation_notes:
  register: Français international moderne, naturel et digne. « Pourtant » maintient le contraste marqué par le grec; « rendre justice » appartient au registre juridique courant. La phrase garde le ton exaspéré du juge sans devenir familière. Les marqueurs [a] et [b] sont placés immédiatement après les expressions qu’ils expliquent.
