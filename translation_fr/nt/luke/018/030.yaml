  variant: modern international French
source:
  edition: SBLGNT
  text: ὃς ⸀οὐχὶ μὴ ⸀ἀπολάβῃ πολλαπλασίονα ἐν τῷ καιρῷ τούτῳ καὶ ἐν τῷ αἰῶνι τῷ ἐρχομένῳ ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/030.yaml
  text: who will certainly receive many times more in this time[a], and in the age to come, eternal life.
translation:
  language: fr
  text: qui recevra à coup sûr plusieurs fois plus au temps présent[a] et, dans l’âge à venir, la vie éternelle.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « en ce temps-ci ».'
    reason: La note signale la formulation démonstrative grecque (ἐν τῷ καιρῷ τούτῳ), tandis que « au temps présent » offre un français naturel et maintient le contraste avec l’âge à venir.
lexical_decisions:
- source_word: ὃς
  choice: qui
  rationale: Le pronom relatif reprend la personne décrite au verset précédent et maintient la continuité syntaxique de la phrase.
- source_word: οὐχὶ μὴ
  choice: à coup sûr
  rationale: Avec le subjonctif aoriste, cette négation renforcée exprime ici une assurance catégorique. Une double négation calquée serait trompeuse en français; « à coup sûr » en restitue naturellement la force positive dans cette construction relative dépendant du contexte précédent.
- source_word: ἀπολάβῃ
  choice: recevra
  rationale: Le verbe peut signifier « recevoir » ou « recevoir en retour ». « Recevra » convient au contexte de récompense sans imposer explicitement l’idée d’une restitution à l’identique.
- source_word: πολλαπλασίονα
  choice: plusieurs fois autant
  rationale: Cette formulation actuelle conserve l’idée précise d’une quantité multipliée, mieux que le simple « beaucoup plus ».
- source_word: ἐν τῷ καιρῷ τούτῳ
  choice: dans le temps présent
  rationale: καιρός désigne ici le temps ou la période présente, mis en contraste avec l’ère à venir. Cette formulation est plus naturelle en français que le calque « en ce temps ».
- source_word: ἐν τῷ αἰῶνι τῷ ἐρχομένῳ
  choice: dans l’ère à venir
  rationale: « Ère » préserve le contraste eschatologique entre l’ordre présent et celui qui vient, sans réduire αἰών à un simple moment futur.
- source_word: ζωὴν αἰώνιον
  choice: la vie éternelle
  rationale: C’est le rendu français établi et contextuellement approprié de l’expression évangélique; il communique sa portée eschatologique sans paraphrase.
theological_decisions:
- issue: Force de la négation renforcée οὐχὶ μὴ
  choice: à coup sûr
  alternative: ne manquera certainement pas de recevoir
  rationale: La formulation choisie exprime fermement la certitude de la promesse sans reproduire une double négation grecque qui pourrait inverser le sens en français. L’alternative est possible, mais plus lourde.
- issue: Expression eschatologique αἰῶνι τῷ ἐρχομένῳ
  choice: l’ère à venir
  alternative: le monde à venir
  rationale: « L’ère à venir » maintient explicitement la distinction néotestamentaire entre deux ères, tout en laissant intacte la portée théologique de cette réalité future. « Le monde à venir » est idiomatique, mais pourrait suggérer surtout un autre lieu.
translation_notes:
  register: Français international moderne, digne et accessible. Le verset demeure un fragment syntaxique commençant par « qui », puisqu’il poursuit directement la phrase du verset précédent. La ponctuation met en relief le contraste entre la récompense présente et la vie éternelle dans l’ère à venir.
