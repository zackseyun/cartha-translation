source:
  edition: SBLGNT
  text: Ἰδὼν δὲ αὐτὸν ὁ ⸀Ἰησοῦς εἶπεν· Πῶς δυσκόλως οἱ τὰ χρήματα ἔχοντες ⸂εἰς τὴν βασιλείαν τοῦ θεοῦ εἰσπορεύονται⸃·
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/024.yaml
  text: And Jesus[a], seeing him, said, “How difficult it is for those who have wealth to enter into the kingdom of God!”
translation:
  language: fr
  text: 'En le voyant, Jésus dit : « Qu’il est difficile à ceux qui possèdent des richesses d’entrer dans le royaume de Dieu ! »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰδὼν δὲ αὐτὸν
  choice: En le voyant
  rationale: Le participe aoriste est rendu par une tournure circonstancielle naturelle en français. Le pronom « le » renvoie au notable riche du contexte, et δέ, simple articulation narrative, n’exige pas ici de connecteur explicite.
- source_word: Πῶς δυσκόλως
  choice: Qu’il est difficile
  rationale: Cette construction restitue naturellement en français la valeur exclamative de l’expression grecque sans la renforcer jusqu’à l’impossibilité.
- source_word: οἱ τὰ χρήματα ἔχοντες
  choice: ceux qui possèdent des richesses
  rationale: La formulation conserve la construction participiale et rend χρήματα dans son sens contextuel large de biens ou de richesse, plutôt que de le limiter à l’argent liquide.
- source_word: εἰς τὴν βασιλείαν τοῦ θεοῦ εἰσπορεύονται
  choice: d’entrer dans le royaume de Dieu
  rationale: L’infinitif après « il est difficile à » donne une syntaxe française fluide tout en préservant le mouvement d’entrée et l’expression biblique « royaume de Dieu ».
theological_decisions:
- issue: Portée de la déclaration concernant les riches et le royaume de Dieu
  choice: Une déclaration générale sur la difficulté qu’éprouvent les personnes riches à entrer dans le royaume de Dieu
  alternative: Une impossibilité absolue pour toute personne riche
  rationale: Le grec exprime ici la difficulté, non l’impossibilité. La traduction maintient cette tension sans anticiper ni atténuer la suite du passage.
translation_notes:
  register: Français international actuel, digne et accessible. La tournure exclamative conserve la force de la parole de Jésus; « possèdent des richesses » reste proche du grec tout en étant idiomatique.
