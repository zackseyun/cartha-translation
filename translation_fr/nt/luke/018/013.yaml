id: LUK.18.13
reference: Luke 18:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸂ὁ δὲ⸃ τελώνης μακρόθεν ἑστὼς οὐκ ἤθελεν οὐδὲ τοὺς ὀφθαλμοὺς ⸂ἐπᾶραι εἰς τὸν οὐρανόν⸃, ἀλλ’ ⸀ἔτυπτε τὸ στῆθος ⸀αὐτοῦ λέγων· Ὁ θεός, ἱλάσθητί μοι τῷ ἁμαρτωλῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/013.yaml
  text: But the tax collector[a], standing far off, was not willing even to lift up his eyes to heaven, but kept beating his chest, saying, ‘God, be merciful to me, the sinner.’
translation:
  language: fr
  text: 'Mais le collecteur d’impôts, se tenant debout à distance, ne voulait même pas lever les yeux vers le ciel, mais se frappait la poitrine en disant : « Dieu, prends pitié de moi[a], le pécheur. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « sois propice envers moi ». Le verbe grec appartient au vocabulaire de l’expiation et de la propitiation.'
    reason: Préserver la portée cultuelle et théologique possible de ἱλάσκομαι sans alourdir le texte principal.
lexical_decisions:
- source_word: τελώνης
  choice: collecteur d’impôts
  rationale: Équivalent français moderne et clair, qui désigne précisément la fonction sans recourir au terme vieilli « publicain ».
- source_word: μακρόθεν
  choice: à distance
  rationale: Expression naturelle qui préserve l’éloignement physique et laisse au contexte le soin d’en suggérer la portée.
- source_word: ἑστὼς
  choice: se tenant
  rationale: Rend simplement la posture exprimée par le participe grec et s’intègre naturellement à la phrase.
- source_word: οὐκ ἤθελεν οὐδὲ
  choice: ne voulait même pas
  rationale: Préserve la valeur volitive de θέλω sans la transformer en incapacité; « n’osait même pas » serait plus idiomatique, mais expliciterait une motivation seulement suggérée.
- source_word: ἐπᾶραι εἰς τὸν οὐρανόν
  choice: lever les yeux vers le ciel
  rationale: Rend naturellement l’expression grecque et conserve son orientation révérencielle.
- source_word: ἔτυπτε
  choice: se frappait
  rationale: L’imparfait français exprime ici l’action répétée ou continue indiquée par l’imparfait grec.
- source_word: τὸ στῆθος αὐτοῦ
  choice: la poitrine
  rationale: Formulation française courante pour ce geste de douleur et de contrition.
- source_word: ἱλάσθητί μοι
  choice: prends pitié de moi
  rationale: Formulation claire et naturelle pour une prière adressée à Dieu; elle communique la demande de miséricorde tout en réservant à une note la dimension propitiatoire ou expiatoire du verbe.
- source_word: τῷ ἁμαρτωλῷ
  choice: le pécheur
  rationale: Conserve l’article grec et sa possible force emphatique dans cette confession personnelle, malgré le caractère plus marqué de la tournure en français.
theological_decisions:
- issue: Rendu de ἱλάσθητί μοι dans une prière sollicitant la faveur divine
  choice: prends pitié de moi
  alternative: sois-moi propice; accorde-moi l’expiation
  rationale: Le verbe appartient au champ lexical de l’expiation et de la propitiation, mais, dans cette prière directe, « prends pitié de moi » est accessible et naturel. La note conserve la profondeur cultuelle possible sans imposer dans le texte principal une formulation technique ni une construction doctrinale particulière.
- issue: Force de l’article dans τῷ ἁμαρτωλῷ
  choice: le pécheur
  alternative: un pécheur
  rationale: « Le pécheur » maintient la forme marquée du grec et peut exprimer l’abaissement personnel du personnage. « Un pécheur » serait plus courant en français, mais atténuerait cette emphase possible.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche du grec tout en étant naturelle. « Ô Dieu » marque l’interpellation solennelle sans archaïsme excessif; « le pécheur » est volontairement conservé comme tournure marquée.
