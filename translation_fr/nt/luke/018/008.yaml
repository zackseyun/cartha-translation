id: LUK.18.8
reference: Luke 18:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: λέγω ὑμῖν ὅτι ποιήσει τὴν ἐκδίκησιν αὐτῶν ἐν τάχει. πλὴν ὁ υἱὸς τοῦ ἀνθρώπου ἐλθὼν ἆρα εὑρήσει τὴν πίστιν ἐπὶ τῆς γῆς;
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/008.yaml
  text: I tell you that he will bring about justice for them quickly[a]. Nevertheless, when the Son of Man comes[b], will he really find faith on the earth?
translation:
  language: fr
  text: Je vous le dis, il leur fera justice rapidement[a]. Cependant, quand le Fils de l’homme viendra, trouvera-t-il vraiment la foi[b] sur la terre ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « il les réhabilitera » ou « il leur accordera justice ». L’expression grecque peut désigner une réhabilitation juridique ou la justice rendue en faveur de quelqu’un. « Rapidement » peut aussi se comprendre comme « sans tarder ».
    reason: lexical_alternative
  - marker: b
    text: Ou « la confiance » ou « la fidélité ». Le mot grec peut avoir ces différentes nuances ; le texte principal conserve le terme plus large « foi ».
    reason: alternative_reading
lexical_decisions:
- source_word: ποιήσει τὴν ἐκδίκησιν αὐτῶν
  choice: il leur fera justice
  rationale: Dans le contexte judiciaire de la veuve qui réclame réparation, cette formulation française naturelle exprime l’idée de justice rendue ou de réhabilitation, sans accentuer indûment la vengeance.
- source_word: ἐν τάχει
  choice: rapidement
  rationale: Cette traduction conserve l’idée de promptitude dans l’action sans transformer nécessairement l’expression en indication chronologique signifiant « bientôt ».
- source_word: πλὴν
  choice: Cependant
  rationale: Le mot introduit un contraste marqué entre l’assurance que justice sera faite et la question pénétrante qui suit.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: le Fils de l’homme
  rationale: Rendu traditionnel et précis du titre, qui en préserve les résonances bibliques, notamment avec Daniel 7.
- source_word: ἐλθὼν
  choice: quand … viendra
  rationale: Le participe aoriste a ici une valeur temporelle naturelle par rapport au verbe principal ; la proposition française rend clairement ce rapport.
- source_word: ἆρα
  choice: vraiment
  rationale: La particule donne à la question un caractère réfléchi et incisif ; « vraiment » en restitue naturellement la force en français.
- source_word: τὴν πίστιν
  choice: la foi
  rationale: « La foi » maintient l’étendue sémantique du grec, qui peut évoquer la foi, la confiance ou la fidélité, sans trancher excessivement selon une seule nuance.
- source_word: ἐπὶ τῆς γῆς
  choice: sur la terre
  rationale: Cette formulation directe convient à la portée eschatologique de la parole et conserve le sens global le plus probable de γῆ dans ce contexte.
theological_decisions:
- issue: Sens de πίστις dans un contexte pouvant évoquer la foi, la confiance persévérante ou la fidélité
  choice: la foi
  alternative: la confiance ; la fidélité
  rationale: Le texte principal garde le terme français le plus large et traditionnel. Les autres nuances possibles sont signalées en note afin de préserver la tension du contexte, centré sur une confiance persévérante exprimée dans la prière.
translation_notes:
  register: Français international moderne, naturel et digne. La tournure « il leur fera justice » maintient le cadre judiciaire de la parabole, tandis que la question finale conserve son caractère ouvert et saisissant.
