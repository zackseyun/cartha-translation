id: LUK.18.6
reference: Luke 18:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἶπεν δὲ ὁ κύριος· Ἀκούσατε τί ὁ κριτὴς τῆς ἀδικίας λέγει·
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/006.yaml
  text: And the Lord said[a], “Hear what the unrighteous judge says.”
translation:
  language: fr
  text: 'Et le Seigneur dit : « Écoutez ce que dit le juge injuste[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « le juge de l’injustice » ; on pourrait aussi traduire : « le juge inique ».'
    reason: La formulation grecque est un génitif qualitatif, littéralement « le juge de l’injustice », que le français rend naturellement par « le juge injuste ».
lexical_decisions:
- source_word: εἶπεν
  choice: dit
  rationale: L’aoriste de λέγω introduit simplement la parole dans le récit ; le passé simple convient au registre narratif français.
- source_word: δὲ
  choice: Et
  rationale: δέ marque ici la continuité du récit sans imposer une succession temporelle plus précise.
- source_word: ὁ κύριος
  choice: le Seigneur
  rationale: Dans le récit de Luc, le terme désigne Jésus et possède une portée titulaire que « le Seigneur » préserve naturellement.
- source_word: Ἀκούσατε
  choice: Écoutez
  rationale: L’impératif appelle à prêter attention. « Écoutez » est idiomatique en français moderne et conserve pleinement cette force.
- source_word: τί
  choice: ce que
  rationale: Le pronom introduit le contenu des paroles du juge ; « ce que » est la tournure française naturelle.
- source_word: ὁ κριτὴς
  choice: le juge
  rationale: Le groupe nominal renvoie au juge déjà présenté dans la parabole.
- source_word: τῆς ἀδικίας
  choice: injuste
  rationale: Le génitif qualitatif caractérise moralement le juge. « Injuste » est clair, naturel et conserve le lien avec l’injustice, sans restreindre nécessairement le sens à une erreur judiciaire.
- source_word: λέγει
  choice: dit
  rationale: Bien que le grec emploie le présent, le français dit naturellement « ce que dit le juge », formule qui garde l’immédiateté de l’énoncé.
theological_decisions:
- issue: Rendu de κύριος appliqué à Jésus
  choice: le Seigneur
  alternative: le maître
  rationale: « Le Seigneur » conserve la portée christologique du titre dans Luc sans ajouter d’explication doctrinale étrangère au texte.
- issue: Portée de τῆς ἀδικίας
  choice: le juge injuste
  alternative: le juge de l’injustice
  rationale: Le génitif peut être rendu comme une caractérisation qualitative. La traduction naturelle ne précise pas davantage la forme exacte de son injustice et la note conserve la formulation littérale.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple maintient le ton narratif biblique sans archaïsme marqué ; l’impératif « Écoutez » est direct et naturel.
