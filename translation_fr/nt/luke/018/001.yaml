id: LUK.18.1
reference: Luke 18:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἔλεγεν ⸀δὲ παραβολὴν αὐτοῖς πρὸς τὸ δεῖν πάντοτε προσεύχεσθαι ⸀αὐτοὺς καὶ μὴ ἐγκακεῖν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/001.yaml
  text: He was telling them a parable about their need to pray always and not lose heart,[a]
translation:
  language: fr
  text: Il leur disait une parabole pour montrer qu’ils devaient toujours prier sans se décourager.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Il leur disait une parabole au sujet de la nécessité pour eux de toujours prier et de ne pas perdre courage. »'
    reason: La construction πρὸς τὸ δεῖν peut être comprise comme indiquant la visée de la parabole ou le sujet qu’elle illustre; ἐγκακεῖν peut aussi se rendre par « perdre courage ».
lexical_decisions:
- source_word: Ἔλεγεν
  choice: Il leur disait
  rationale: L’imparfait grec présente une action passée en cours ou sert à installer la scène; l’imparfait français en conserve naturellement l’aspect.
- source_word: δὲ
  choice: non exprimé séparément
  rationale: Ici, δέ est une légère articulation du discours. Le français n’exige pas de connecteur explicite dans ce verset, et en ajouter un risquerait de surmarquer la transition.
- source_word: παραβολὴν
  choice: une parabole
  rationale: Équivalent usuel et précis dans le contexte synoptique, qui conserve le genre du propos.
- source_word: πρὸς τὸ δεῖν … αὐτοὺς
  choice: pour montrer qu’ils devaient
  rationale: La construction πρὸς τὸ avec l’infinitif peut exprimer le but ou la visée, tandis que δεῖν marque la nécessité. Cette formulation française rend les deux éléments avec naturel.
- source_word: πάντοτε προσεύχεσθαι
  choice: toujours prier
  rationale: Rend directement l’idée de persévérance constante dans la prière sans imposer la notion irréaliste d’une parole ininterrompue.
- source_word: μὴ ἐγκακεῖν
  choice: sans se décourager
  rationale: ἐγκακέω désigne le fait de perdre courage, de se lasser ou de renoncer. « Se décourager » est clair, courant et adapté au contexte.
theological_decisions:
- issue: Force de la nécessité attachée à la prière persévérante
  choice: « ils devaient toujours prier »
  alternative: « il leur fallait toujours prier » ou « ils avaient besoin de toujours prier »
  rationale: Le verbe δεῖ exprime une nécessité réelle. « Devaient » en garde la force exhortative sans développer une doctrine particulière sur l’efficacité de la prière.
- issue: Relation entre la parabole et son enseignement
  choice: « pour montrer que »
  alternative: « au sujet de la nécessité pour eux de »
  rationale: πρὸς τὸ peut ici indiquer la visée de la parabole ou le sujet auquel elle se rapporte. Le texte principal retient une formulation naturelle de but, et la note conserve l’autre nuance possible.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve l’imparfait narratif et la force de nécessité du grec, tout en évitant une tournure trop littérale ou confessionnellement chargée.
