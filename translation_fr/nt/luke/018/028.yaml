source:
  edition: SBLGNT
  text: Εἶπεν δὲ ⸀ὁ Πέτρος· Ἰδοὺ ἡμεῖς ⸂ἀφέντες τὰ ἴδια⸃ ἠκολουθήσαμέν σοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/028.yaml
  text: Then Peter said[a], “Look, we have left our own and followed you.”
translation:
  language: fr
  text: 'Alors Pierre dit[a] : « Voici, nous, nous avons laissé ce qui nous appartenait et nous t’avons suivi. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ce qui était à nous » ou « nos biens ». L’expression grecque est large et ne précise pas exactement ce que Pierre et les autres ont laissé.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἶπεν
  choice: dit
  rationale: L’aoriste de λέγω se rend naturellement par « dit » dans ce récit.
- source_word: δὲ
  choice: Alors
  rationale: δέ assure ici la transition narrative avec une légère nuance de contraste; « Alors » convient au fil du discours sans accentuer excessivement l’opposition.
- source_word: Ἰδοὺ
  choice: Regarde
  rationale: L’impératif attire vivement l’attention. « Regarde » est actuel et naturel, contrairement au plus archaïque « Voici » dans cet emploi interpellatif.
- source_word: ἡμεῖς
  choice: nous, nous
  rationale: La reprise pronominale idiomatique en français restitue l’insistance portée par le pronom grec explicite.
- source_word: ἀφέντες
  choice: avons laissé
  rationale: Le participe aoriste, antérieur au verbe principal, s’exprime naturellement en français par un verbe coordonné au passé composé.
- source_word: τὰ ἴδια
  choice: ce qui nous appartenait
  rationale: Cette formulation conserve l’extension ouverte du grec, qui ne précise ni des biens matériels seuls, ni la maison, ni la famille.
- source_word: ἠκολουθήσαμέν σοι
  choice: nous t’avons suivi
  rationale: « Suivre » restitue directement le verbe usuel du discipulat, avec le complément personnel requis en français.
theological_decisions:
- issue: Étendue de τὰ ἴδια
  choice: ce qui nous appartenait
  alternative: nos biens / tout ce que nous avions
  rationale: Le grec demeure général. La traduction évite de restreindre la parole de Pierre aux possessions matérielles ou d’ajouter l’idée explicite de totalité.
translation_notes:
  register: Français international moderne, naturel et digne. L’emphase de ἡμεῖς est rendue par « nous, nous ». « Ce qui nous appartenait » préserve l’indétermination du grec tout en restant idiomatique.
