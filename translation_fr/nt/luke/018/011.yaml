  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ Φαρισαῖος σταθεὶς ⸂πρὸς ἑαυτὸν ταῦτα⸃ προσηύχετο· Ὁ θεός, εὐχαριστῶ σοι ὅτι οὐκ εἰμὶ ⸀ὥσπερ οἱ λοιποὶ τῶν ἀνθρώπων, ἅρπαγες, ἄδικοι, μοιχοί, ἢ καὶ ὡς οὗτος ὁ τελώνης·
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/011.yaml
  text: 'The Pharisee[a], standing by himself, was praying these things: ‘God, I thank you that I am not like the rest of men—extortioners, unrighteous, adulterers—or even like this tax collector.’'
translation:
  language: fr
  text: 'Le pharisien[a], debout à l’écart, priait ainsi : « Ô Dieu, je te remercie de ne pas être comme le reste des hommes — voleurs, injustes, adultères — ni même comme ce collecteur d’impôts. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Le pharisien, debout, priait ainsi à lui-même. » L’expression grecque peut indiquer qu’il se tenait à l’écart ou, avec une nuance ironique, que sa prière était en quelque sorte adressée à lui-même.'
    reason: alternative_reading
lexical_decisions:
- source_word: σταθεὶς
  choice: debout
  rationale: Le participe aoriste de ἵστημι introduit ici la posture du pharisien. « Debout » est naturel en français et conserve clairement la scène.
- source_word: πρὸς ἑαυτὸν
  choice: à l’écart
  rationale: L’expression peut avoir un sens spatial (« à l’écart », « à part ») ou réflexif (« en lui-même », voire « à lui-même »). Le texte principal retient le sens spatial sans effacer l’autre possibilité, signalée en note.
- source_word: ταῦτα προσηύχετο
  choice: priait ainsi
  rationale: En français naturel, « priait ainsi » exprime que les paroles suivantes constituent le contenu de sa prière. L’imparfait rend l’aspect duratif de προσηύχετο.
- source_word: εὐχαριστῶ σοι
  choice: je te remercie
  rationale: Formulation française actuelle et directe qui rend exactement le verbe avec son complément au datif.
- source_word: ὥσπερ οἱ λοιποὶ τῶν ἀνθρώπων
  choice: comme le reste des hommes
  rationale: « Le reste » conserve λοιποί et « des hommes » rend ici le pluriel humain générique tout en reflétant la formulation méprisante et globalisante du personnage.
- source_word: ἅρπαγες
  choice: voleurs
  rationale: ἅρπαξ désigne ceux qui s’emparent avidement du bien d’autrui. « Voleurs » est clair et courant; « extorqueurs » serait possible, mais plus étroit.
- source_word: ἄδικοι
  choice: injustes
  rationale: « Injustes » rend directement ἄδικοι et garde sa portée morale sans introduire un vocabulaire confessionnel plus marqué.
- source_word: μοιχοί
  choice: adultères
  rationale: Le substantif pluriel désigne ceux qui commettent l’adultère; « adultères » est concis et idiomatique dans cette énumération.
- source_word: ἢ καὶ ὡς οὗτος ὁ τελώνης
  choice: ni même comme ce collecteur d’impôts
  rationale: Dans une phrase négative française, « ni même » restitue naturellement la gradation de ἢ καί. « Ce » conserve la désignation méprisante de l’homme présent, et « collecteur d’impôts » est le terme moderne usuel pour τελώνης.
theological_decisions:
- issue: Sens de πρὸς ἑαυτόν dans la description de la prière
  choice: 'Le texte principal le comprend spatialement : « à l’écart »'
  alternative: « Debout, il priait ainsi en lui-même » ou, plus littéralement et ironiquement, « il adressait cette prière à lui-même »
  rationale: Le grec permet soit une indication de position séparée, soit une qualification réflexive de la prière. Le choix spatial donne une phrase française fluide sans trancher implicitement la portée spirituelle; la note préserve l’ambiguïté et l’ironie possibles.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche du mouvement du grec, tandis que « priait ainsi » évite le tour lourd « priait ces choses ». « Ô Dieu » marque naturellement l’apostrophe solennelle sans archaïsme excessif.
