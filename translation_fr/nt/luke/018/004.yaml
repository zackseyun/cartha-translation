  text: And for a time he was unwilling[a], but afterward he said to himself, ‘Even though I do not fear God nor respect anyone,
translation:
  language: fr
  text: 'Pendant quelque temps, il ne voulait pas. Mais ensuite, il se dit : « Même si je ne crains pas Dieu et ne respecte personne[a],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « et ne respecte pas un être humain » ; le singulier grec a ici un sens général.'
    reason: Précision sur le singulier générique ἄνθρωπον et justification de la formulation idiomatique « personne ».
lexical_decisions:
- source_word: ἤθελεν
  choice: il refusa
  rationale: L’imparfait, avec la durée exprimée par ἐπὶ χρόνον, décrit un refus qui se prolonge. « Il refusa » est plus naturel ici que « il ne voulait pas », tout en conservant la dimension volontaire.
- source_word: ἐπὶ χρόνον
  choice: pendant un certain temps
  rationale: Cette expression indique une durée indéterminée sans en préciser la longueur.
- source_word: μετὰ ταῦτα δὲ
  choice: mais ensuite
  rationale: La formule marque à la fois la succession temporelle et un tournant dans le récit.
- source_word: εἶπεν ἐν ἑαυτῷ
  choice: il se dit
  rationale: Cette tournure française naturelle conserve l’idée d’un discours intérieur.
- source_word: Εἰ καὶ
  choice: même si
  rationale: 'Dans ce contexte, la construction a une valeur concessive : le juge reconnaît comme un fait son absence de crainte et de respect.'
- source_word: τὸν θεὸν οὐ φοβοῦμαι
  choice: je ne crains pas Dieu
  rationale: « Craindre Dieu » préserve l’expression biblique et le constat moral abrupt du juge, sans réduire le verbe à la seule révérence.
- source_word: οὐδὲ ἄνθρωπον ἐντρέπομαι
  choice: et ne respecte personne
  rationale: ἐντρέπομαι exprime ici l’égard ou le respect. Le singulier générique ἄνθρωπον se rend idiomatiquement en français par « personne », en parallèle avec l’absence de crainte de Dieu.
theological_decisions:
- issue: Valeur du singulier générique ἄνθρωπον
  choice: personne
  alternative: aucun être humain / l’homme
  rationale: Le nom singulier désigne ici tout être humain sans distinction. « Personne » restitue naturellement cette portée générale en français et évite de faire croire que seuls les hommes de sexe masculin sont visés.
- issue: Sens de φοβοῦμαι appliqué à Dieu
  choice: craindre Dieu
  alternative: révérer Dieu
  rationale: Le grec peut inclure la révérence, mais la formulation traditionnelle « craindre Dieu » conserve l’étendue sémantique et la force du contraste avec le respect dû aux humains.
translation_notes:
  register: Français international moderne, courant et digne. Les phrases brèves rendent le mouvement narratif et le discours intérieur du juge. Le guillemet ouvrant est conservé puisque la parole se poursuit au verset suivant.
