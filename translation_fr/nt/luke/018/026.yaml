source:
  edition: SBLGNT
  text: Εἶπαν δὲ οἱ ἀκούσαντες· Καὶ τίς δύναται σωθῆναι;
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/026.yaml
  text: Then those who heard it said, “And who can be saved?”
translation:
  language: fr
  text: 'Ceux qui avaient entendu cela dirent alors : « Et qui peut être sauvé ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἶπαν
  choice: dirent
  rationale: L’aoriste de l’indicatif exprime ici un événement narratif ponctuel ; le passé simple convient au registre biblique français tout en restant clair.
- source_word: δὲ
  choice: alors
  rationale: La particule marque la progression du récit ; « alors » rend naturellement cette transition.
- source_word: οἱ ἀκούσαντες
  choice: Ceux qui l’avaient entendu
  rationale: Le participe aoriste substantivé désigne les personnes ayant entendu la parole précédente de Jésus. Le pronom « l’ » reprend naturellement Jésus comme personne entendue, sans modifier le contenu.
- source_word: Καὶ
  choice: Mais
  rationale: Dans cette réaction frappée de stupeur, καί a une force contextuelle que le français idiomatique exprime par « mais » ; un « et » littéral serait ici moins naturel.
- source_word: τίς
  choice: qui
  rationale: L’interrogatif demande quelle personne pourrait parvenir au salut.
- source_word: δύναται
  choice: peut
  rationale: Le présent exprime la capacité ou la possibilité ; « peut » en est l’équivalent français direct et naturel.
- source_word: σωθῆναι
  choice: être sauvé
  rationale: Dans le contexte de l’entrée dans le royaume de Dieu, l’infinitif passif porte le sens sotériologique de recevoir le salut.
theological_decisions:
- issue: Sens de σωθῆναι dans le contexte
  choice: « être sauvé » au sens du salut
  alternative: « être délivré » ou « être secouru »
  rationale: Le contexte immédiat concerne l’entrée dans le royaume de Dieu et la difficulté évoquée à propos des riches ; le sens sotériologique est donc premier, sans préciser davantage la manière dont ce salut s’opère.
translation_notes:
  register: Français moderne, digne et oralement naturel. Le passé simple maintient un registre narratif biblique courant. « Mais qui » restitue la réaction étonnée avec plus de naturel que le calque « Et qui ».
