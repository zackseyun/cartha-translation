  text: καὶ μαστιγώσαντες ἀποκτενοῦσιν αὐτόν, καὶ τῇ ἡμέρᾳ τῇ τρίτῃ ἀναστήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/033.yaml
  text: And after flogging him[a], they will kill him, and on the third day he will rise.
translation:
  language: fr
  text: Après l’avoir fouetté, ils le tueront, et le troisième jour il ressuscitera.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « il sera ressuscité ». Le grec dit plus directement : « il ressuscitera ».'
    reason: alternative_reading
lexical_decisions:
- source_word: μαστιγώσαντες
  choice: Après l’avoir fouetté
  rationale: Le participe aoriste exprime ici une action antérieure à celle du verbe principal. « Fouetter » est courant, clair et rend la violence du geste sans employer le terme plus littéraire « flageller ».
- source_word: ἀποκτενοῦσιν
  choice: ils le tueront
  rationale: Le futur actif pluriel désigne les agents hostiles implicites dans le contexte. « Tuer » rend directement le sens, sans ajouter la nuance juridique de « mettre à mort » ni la qualification morale de « assassiner ».
- source_word: αὐτόν
  choice: le
  rationale: Le pronom objet renvoie au Fils de l’homme, Jésus, dans le contexte.
- source_word: τῇ ἡμέρᾳ τῇ τρίτῃ
  choice: le troisième jour
  rationale: Cette tournure française naturelle rend fidèlement le datif temporel grec.
- source_word: ἀναστήσεται
  choice: il ressuscitera
  rationale: Le futur moyen de ἀνίστημι est employé ici de manière intransitive. « Ressusciter » exprime naturellement en français le fait de revenir à la vie tout en évitant d’introduire une forme passive absente du grec.
theological_decisions:
- issue: Formulation de la résurrection
  choice: il ressuscitera
  alternative: il sera ressuscité
  rationale: La forme grecque est un futur moyen à valeur intransitive, et non un passif explicite. Le texte principal suit donc directement la formulation grecque, sans nier que d’autres passages présentent Dieu comme celui qui ressuscite Jésus.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste concise et suit la progression du grec. « Fouetter » a été préféré à « flageller », plus littéraire, et « il ressuscitera » préserve la voix du texte source.
