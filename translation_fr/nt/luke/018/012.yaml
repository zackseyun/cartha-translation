  text: νηστεύω δὶς τοῦ σαββάτου, ⸀ἀποδεκατῶ πάντα ὅσα κτῶμαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/012.yaml
  text: I fast twice a week[a]; I tithe everything I acquire.
translation:
  language: fr
  text: Je jeûne deux fois par semaine[a] et je donne la dîme de tout ce que j’acquiers.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « deux fois du sabbat », expression qui signifie « deux fois par semaine ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: νηστεύω
  choice: Je jeûne
  rationale: Le présent décrit ici une pratique habituelle revendiquée par le locuteur.
- source_word: δὶς τοῦ σαββάτου
  choice: deux fois par semaine
  rationale: L’expression grecque, littéralement « deux fois du sabbat », est un idiome temporel qui renvoie au cycle de la semaine.
- source_word: ἀποδεκατῶ
  choice: je donne la dîme
  rationale: Le verbe signifie donner le dixième; cette formulation est claire et naturelle en français moderne.
- source_word: πάντα ὅσα
  choice: de tout ce que
  rationale: Cette tournure restitue naturellement la portée globale de l’expression grecque.
- source_word: κτῶμαι
  choice: j’acquiers
  rationale: Le moyen κτῶμαι désigne ce que l’on obtient ou acquiert, plutôt que ce que l’on possède simplement.
theological_decisions:
- issue: Sens de τοῦ σαββάτου dans l’indication de fréquence
  choice: 'sens temporel idiomatique : « par semaine »'
  alternative: 'traduction littérale : « du sabbat »'
  rationale: Le syntagme indique la fréquence du jeûne et ne formule pas une affirmation théologique sur l’observance du sabbat. La traduction idiomatique évite de suggérer à tort deux jeûnes pendant le sabbat.
translation_notes:
  register: Français international moderne, digne et accessible. « Donner la dîme » conserve le terme biblique courant tout en exprimant clairement l’action; « acquiers » préserve la nuance d’obtention portée par κτῶμαι.
