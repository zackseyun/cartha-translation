id: LUK.18.25
reference: Luke 18:25
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εὐκοπώτερον γάρ ἐστιν κάμηλον διὰ ⸂τρήματος βελόνης⸃ εἰσελθεῖν ἢ πλούσιον εἰς τὴν βασιλείαν τοῦ θεοῦ εἰσελθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/025.yaml
  text: For it is easier for a camel to enter through the eye of a needle than for a rich man to enter the kingdom of God[a][b].
translation:
  language: fr
  text: En effet, il est plus facile à un chameau de passer par le trou d’une aiguille qu’à un riche d’entrer dans le royaume de Dieu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Certains ont proposé qu’il s’agisse d’une porte étroite appelée « le trou de l’aiguille », ou que « corde » soit compris à la place de « chameau » ; mais le texte grec porte bien « chameau ».
    reason: alternative_reading
lexical_decisions:
- source_word: εὐκοπώτερον
  choice: plus facile
  rationale: Le comparatif employé avec ἐστιν se rend naturellement en français par « il est plus facile ».
- source_word: γάρ
  choice: En effet
  rationale: Cette expression conserve la valeur explicative du lien avec ce qui précède et convient au français moderne.
- source_word: κάμηλον
  choice: un chameau
  rationale: κάμηλος signifie normalement « chameau » ; aucune donnée du texte grec ne justifie de le remplacer par « corde ».
- source_word: διὰ τρήματος βελόνης
  choice: par le trou d’une aiguille
  rationale: τρήμα désigne une ouverture ou un trou. Cette formulation française est claire et proche de la construction grecque, tout en évoquant sans ambiguïté l’ouverture de l’aiguille.
- source_word: εἰσελθεῖν
  choice: passer / entrer
  rationale: Le premier emploi est rendu idiomatiquement par « passer par » avec l’ouverture d’une aiguille ; le second par « entrer dans », qui exprime naturellement le mouvement vers le royaume.
- source_word: πλούσιον
  choice: un riche
  rationale: L’adjectif masculin singulier substantivé est fidèlement rendu par « un riche », formulation naturelle qui n’ajoute pas le nom « homme » absent du grec.
- source_word: εἰς τὴν βασιλείαν τοῦ θεοῦ
  choice: dans le royaume de Dieu
  rationale: « Entrer dans » rend idiomatiquement la direction exprimée par εἰς et conserve l’expression biblique transparente « royaume de Dieu ».
theological_decisions:
- issue: Interprétation de l’image du chameau et de l’aiguille
  choice: Conserver l’image littérale et hyperbolique du chameau passant par le trou d’une aiguille.
  alternative: Y voir une petite porte appelée « le trou de l’aiguille », ou comprendre « corde » au lieu de « chameau ».
  rationale: Le texte grec porte κάμηλον, « chameau », et ne mentionne aucune porte. L’image volontairement extrême doit être conservée sans lui substituer une explication interprétative ultérieure.
translation_notes:
  register: Français international moderne, digne et accessible. « En effet » assure une liaison explicative naturelle ; « un riche » évite d’ajouter inutilement « homme ». Le marqueur [a] figure bien dans le texte principal.
