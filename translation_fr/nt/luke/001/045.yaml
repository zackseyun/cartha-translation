revisions:
- from: Et heureuse celle qui a cru qu’il y aura un accomplissement de ce qui lui a été dit de la part du Seigneur[a][b].
  to: Et heureuse est celle qui a cru[a] qu’il y aurait un accomplissement[b] de ce qui lui avait été dit de la part du Seigneur.
  rationale: La révision améliore la concordance temporelle et la fluidité du français, tout en conservant l’analyse principale selon laquelle ὅτι introduit le contenu de la foi. Les appels de notes sont replacés auprès des termes concernés. Aucun changement de sens théologique n’est apporté.
