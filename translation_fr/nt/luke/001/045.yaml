    issue: Concordance temporelle dans la proposition complétive
    rationale: Après « a cru », « qu’il y aurait un accomplissement » est plus naturel que « qu’il y aura un accomplissement » pour rapporter une attente future au moment où Marie a cru.
  - severity: low
    issue: Construction elliptique de la déclaration de bonheur
    rationale: L’ajout de « est » dans « heureuse est celle » améliore la lisibilité moderne tout en préservant l’ordre emphatique du grec.
  - severity: low
    issue: Ancrage des notes
    rationale: La note sur ὅτι doit suivre « cru », et la note lexicale sur τελείωσις doit suivre « accomplissement », plutôt que les deux appels placés après « Seigneur ».
  revised_text: Et heureuse est celle qui a cru[a] qu’il y aurait un accomplissement[b] de ce qui lui avait été dit de la part du Seigneur.
