reference: Luke 1:45
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ μακαρία ἡ πιστεύσασα ὅτι ἔσται τελείωσις τοῖς λελαλημένοις αὐτῇ παρὰ κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/045.yaml
  text: And blessed is she who believed that there will be a fulfillment of what was spoken to her by the Lord[a][b].
translation:
  language: fr
  text: Et heureuse est celle qui a cru[a] qu’il y aurait un accomplissement[b] de ce qui lui avait été dit de la part du Seigneur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « parce qu’il y aurait un accomplissement de ce qui lui avait été dit de la part du Seigneur ». La conjonction grecque peut avoir un sens causal, bien qu’elle introduise plus probablement ici le contenu de ce qui a été cru.'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « un achèvement » ou « une réalisation » au lieu d’« un accomplissement ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: μακαρία
  choice: heureuse
  rationale: « Heureuse » est la formulation française naturelle et traditionnelle du langage de μακάριος; elle exprime une condition favorable reconnue par Dieu sans réduire le terme à une émotion subjective.
- source_word: ἡ πιστεύσασα
  choice: celle qui a cru
  rationale: Cette formulation rend naturellement le participe aoriste substantivé et conserve l’idée de l’acte de croire accompli.
- source_word: ὅτι
  choice: que
  rationale: 'La conjonction introduit très probablement ici le contenu de la foi de Marie : elle a cru qu’un accomplissement aurait lieu. La valeur causale demeure possible et est signalée en note.'
- source_word: τελείωσις
  choice: accomplissement
  rationale: Le mot désigne le fait de mener quelque chose à son terme. « Accomplissement » convient au contexte d’une parole divine promise, tout en conservant la forme nominale du grec.
- source_word: τοῖς λελαλημένοις αὐτῇ
  choice: de ce qui lui a été dit
  rationale: Cette tournure rend de façon naturelle le participe parfait passif substantivé et renvoie à la parole déjà adressée à Marie.
- source_word: παρὰ κυρίου
  choice: de la part du Seigneur
  rationale: Avec une parole communiquée, παρά suivi du génitif marque naturellement la source ou l’origine. « De la part du Seigneur » conserve cette nuance sans imposer l’idée d’une énonciation directe.
- source_word: κυρίου
  choice: Seigneur
  rationale: « Seigneur » est l’équivalent français normal de κύριος et désigne ici le Dieu d’Israël comme source de la parole.
theological_decisions:
- issue: Rapport entre le bonheur proclamé de Marie, sa foi et la parole promise
  choice: Marie est déclarée heureuse comme celle qui a cru que la parole venant du Seigneur connaîtrait son accomplissement.
  alternative: Marie est heureuse parce que ce qui lui a été dit de la part du Seigneur s’accomplira, la proposition introduite par ὅτι donnant alors la cause plutôt que le contenu de sa foi.
  rationale: La syntaxe favorise l’interprétation de ὅτι comme introduisant le contenu de πιστεύσασα. Cette lecture maintient l’accent lucanien sur la foi en la parole divine, tandis que la note préserve l’autre analyse possible.
translation_notes:
  register: Français international moderne, digne et accessible. La structure nominale « il y aura un accomplissement » est conservée afin de refléter τελείωσις et de préserver l’ambiguïté syntaxique. « Heureuse » est préféré à « bénie » pour distinguer μακαρία du vocabulaire grec habituellement rendu par « bénie ».
