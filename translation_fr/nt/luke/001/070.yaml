    reason: lexical_alternative
  revision_rationale: La révision remplace « annoncé » par « dit » afin de ne pas ajouter au grec un objet ni une nuance d’annonce explicite. Elle précise également la relation temporelle de ἀπ’ αἰῶνος par « depuis les temps anciens », tout en conservant dans la note l’alternative interprétative attestée.
