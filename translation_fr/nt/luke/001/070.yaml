  text: καθὼς ἐλάλησεν διὰ στόματος τῶν ⸀ἁγίων ἀπ’ αἰῶνος προφητῶν αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/070.yaml
  text: just as he spoke through the mouth of his holy prophets from of old,[a]
translation:
  language: fr
  text: comme il l’avait dit par la bouche de ses saints prophètes depuis les temps anciens,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « d’autrefois ». L’expression peut désigner une antiquité reculée. Certains la comprennent au sens plus fort de « depuis l’éternité », mais la mention des prophètes favorise ici le sens temporel de « depuis les temps anciens ».
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς
  choice: comme
  rationale: Introduit la correspondance avec ce qui précède. En français, « comme » exprime naturellement que l’action de Dieu s’accorde avec sa parole antérieure.
- source_word: ἐλάλησεν
  choice: il l’avait annoncé
  rationale: Le plus-que-parfait situe naturellement cette parole avant l’accomplissement évoqué dans le contexte. « Annoncé » convient à la parole prophétique, tandis que le pronom « l’ » reprend le contenu précédent sans effacer la médiation exprimée ensuite.
- source_word: διὰ στόματος
  choice: par la bouche
  rationale: Conserve l’image biblique concrète de la parole divine transmise par des porte-parole humains.
- source_word: τῶν ἁγίων ... προφητῶν
  choice: ses saints prophètes
  rationale: Rend l’adjectif attributif et le possessif de manière claire, en maintenant l’idée de prophètes consacrés à Dieu.
- source_word: ἀπ’ αἰῶνος
  choice: d’autrefois
  rationale: Désigne ici le passé ancien auquel appartiennent les prophètes. Cette formulation française est naturelle et n’impose pas le sens métaphysique « depuis l’éternité ».
- source_word: αὐτοῦ
  choice: ses
  rationale: 'Le pronom renvoie naturellement à Dieu : ce sont ses prophètes, par lesquels il a parlé.'
theological_decisions:
- issue: Portée temporelle de ἀπ’ αἰῶνος
  choice: le passé ancien (« d’autrefois »)
  alternative: l’éternité passée (« depuis l’éternité »)
  rationale: La mention immédiate des prophètes favorise une référence à l’ancienneté du témoignage prophétique dans l’histoire du salut, sans exclure la profondeur temporelle de l’expression.
translation_notes:
  register: Français moderne, digne et accessible. L’idiome « par la bouche » est conservé pour préserver l’image de la médiation prophétique; « d’autrefois » évite une tournure archaïque tout en gardant la profondeur temporelle.
