- from: comme il l’avait annoncé par la bouche de ses saints prophètes d’autrefois,[a]
  to: comme il l’avait dit par la bouche de ses saints prophètes depuis les temps anciens,[a]
  rationale: La révision remplace « annoncé » par « dit » afin de ne pas ajouter au grec un objet ni une nuance d’annonce explicite. Elle précise également la relation temporelle de ἀπ’ αἰῶνος par « depuis les temps anciens », tout en conservant dans la note l’alternative interprétative attestée.
