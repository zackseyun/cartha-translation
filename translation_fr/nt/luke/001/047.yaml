  text: καὶ ἠγαλλίασεν τὸ πνεῦμά μου ἐπὶ τῷ θεῷ τῷ σωτῆρί μου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/047.yaml
  text: and my spirit has rejoiced in God my Savior[a].
translation:
  language: fr
  text: et mon esprit a exulté en Dieu, mon Sauveur[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « s’est réjoui en Dieu, mon Sauveur ».'
    reason: Variante lexicale plus courante, mais exprimant un peu moins nettement l’intensité de ἠγαλλίασεν.
lexical_decisions:
- source_word: ἠγαλλίασεν
  choice: a exulté
  rationale: L’aoriste actif exprime ici une joie intense. « A exulté » conserve cette force ainsi que l’aspect accompli, dans un français actuel et digne.
- source_word: τὸ πνεῦμά μου
  choice: mon esprit
  rationale: Ce choix conserve le terme grec et le parallélisme poétique avec « mon âme » au verset précédent, sans imposer une distinction anthropologique technique.
- source_word: ἐπὶ τῷ θεῷ
  choice: en Dieu
  rationale: Avec le verbe ἀγαλλιάω, ἐπί suivi du datif indique le fondement ou l’objet de la joie. « En Dieu » est naturel en français et maintient l’orientation relationnelle de l’expression.
- source_word: σωτῆρί μου
  choice: mon Sauveur
  rationale: « Sauveur » rend directement σωτήρ et préserve toute la portée de l’affirmation sans la réduire au seul sens de libérateur.
- source_word: καὶ
  choice: et
  rationale: La conjonction relie simplement ce membre au verset précédent et conserve le parallélisme du cantique.
theological_decisions:
- issue: Désignation de Dieu comme le Sauveur de Marie
  choice: Dieu, mon Sauveur
  alternative: Dieu, mon libérateur
  rationale: Le grec désigne directement Dieu comme le Sauveur de Marie. La traduction conserve cette affirmation sans l’atténuer ni en tirer des conclusions doctrinales supplémentaires.
- issue: Rapport entre « mon esprit » et « mon âme » dans le parallélisme proche
  choice: Maintenir les deux termes distincts
  alternative: Les fondre en une même expression française
  rationale: Le parallélisme suggère un chevauchement de sens, mais le grec emploie deux mots différents. Les conserver respecte la forme poétique et ne tranche pas une question anthropologique que le texte laisse ouverte.
translation_notes:
  register: Français international moderne, poétique et digne. Le passé composé rend naturellement l’aoriste dans ce contexte, tandis que « exulter » préserve l’intensité de la joie exprimée.
