id: LUK.1.4
reference: Luke 1:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἵνα ἐπιγνῷς περὶ ὧν κατηχήθης λόγων τὴν ἀσφάλειαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/004.yaml
  text: so that you may know the certainty of the things about which you were instructed[a][b].
translation:
  language: fr
  text: afin que tu reconnaisses la certitude des enseignements qui t’ont été donnés[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la fiabilité » ; le nom grec peut désigner la certitude, la sûreté ou le caractère digne de confiance.
    reason: lexical_alternative
  - marker: b
    text: Ou « dont tu as été instruit » ; le verbe grec est à l’origine du mot « catéchiser ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: afin que
  rationale: Introduit la proposition de but de Luc et en conserve clairement la valeur finale dans un français naturel.
- source_word: ἐπιγνῷς
  choice: tu reconnaisses
  rationale: Le verbe ἐπιγινώσκω peut exprimer une connaissance établie ou pleinement reconnue. « Reconnaisses » convient au contexte où Théophile a déjà reçu un enseignement et doit en constater le caractère sûr.
- source_word: περὶ ὧν ... λόγων
  choice: des enseignements que
  rationale: La construction renvoie au contenu transmis à Théophile. « Enseignements » restitue ce sens global sans le calque peu naturel « paroles au sujet desquelles ».
- source_word: κατηχήθης
  choice: tu as reçus
  rationale: Avec « enseignements » comme antécédent, cette formulation française rend naturellement le passif de κατηχέω, qui désigne le fait d'avoir été instruit, souvent oralement.
- source_word: τὴν ἀσφάλειαν
  choice: la solidité
  rationale: ἀσφάλεια peut désigner la certitude, la sûreté ou la fiabilité. « Solidité » préserve à la fois l'idée d'un fondement fiable et celle d'une assurance qui en découle.
theological_decisions:
- issue: Nature du but déclaré de Luc
  choice: « la solidité » garde ensemble la fiabilité objective des enseignements et l'assurance qu'ils peuvent procurer à Théophile.
  alternative: « la certitude » mettrait davantage l'accent sur l'assurance épistémique; « la fiabilité » sur la qualité objective du contenu.
  rationale: Le nom ἀσφάλεια admet ces nuances. La traduction évite de réduire le propos soit à une conviction purement subjective, soit à une vérification uniquement historique.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement conserve le singulier adressé personnellement à Théophile. La phrase s'enchaîne syntaxiquement avec les versets précédents, comme dans le texte grec.
