  text: καὶ ἔσται χαρά σοι καὶ ἀγαλλίασις, καὶ πολλοὶ ἐπὶ τῇ ⸀γενέσει αὐτοῦ χαρήσονται·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/014.yaml
  text: And there will be joy and exultation for you[a], and many will rejoice at his birth.
translation:
  language: fr
  text: Tu éprouveras de la joie et de l’allégresse, et beaucoup se réjouiront à l’occasion de sa naissance.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de sa naissance ». La tournure grecque peut présenter la naissance comme l’occasion de la joie ou comme son motif.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔσται … σοι
  choice: Tu en éprouveras
  rationale: La construction grecque signifie littéralement que joie et allégresse « seront pour toi ». Cette formulation française naturelle exprime clairement l’expérience personnelle annoncée, sans en modifier le sens.
- source_word: χαρά
  choice: joie
  rationale: Équivalent courant, précis et digne de χαρά.
- source_word: ἀγαλλίασις
  choice: grande allégresse
  rationale: « Allégresse » conserve la force festive de ce terme et le distingue de χαρά ; « grande » rend cette intensité perceptible en français moderne.
- source_word: πολλοὶ
  choice: beaucoup
  rationale: L’adjectif substantivé désigne de nombreuses personnes ; le français permet naturellement l’emploi absolu de « beaucoup ».
- source_word: ἐπὶ τῇ γενέσει αὐτοῦ
  choice: de sa naissance
  rationale: Avec un verbe de réjouissance, « se réjouir de » est idiomatique et peut exprimer à la fois l’occasion et le motif, comme la construction grecque avec ἐπί et le datif.
- source_word: χαρήσονται
  choice: se réjouiront
  rationale: Rend directement le futur de χαίρω et maintient le lien lexical avec la joie mentionnée au début du verset.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La première proposition est restructurée pour éviter le calque peu idiomatique « il y aura pour toi », tandis que « grande allégresse » préserve la distinction et l’intensité des deux noms grecs.
