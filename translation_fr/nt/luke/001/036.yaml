  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ Ἐλισάβετ ἡ ⸀συγγενίς σου καὶ αὐτὴ ⸀συνείληφεν υἱὸν ἐν γήρει αὐτῆς, καὶ οὗτος μὴν ἕκτος ἐστὶν αὐτῇ τῇ καλουμένῃ στείρᾳ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/036.yaml
  text: And look, Elizabeth your relative has also conceived a son in her old age, and this is the sixth month for her who was called barren.
translation:
  language: fr
  text: Et voici qu’Élisabeth, ta parente, a elle aussi conçu un fils dans sa vieillesse, et elle en est à son sixième mois, elle qu’on appelait stérile.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: voici que
  rationale: Rend naturellement en français la particule qui attire l’attention, sans l’affaiblir en simple connecteur.
- source_word: συγγενίς
  choice: parente
  rationale: Le terme indique un lien de parenté sans en préciser le degré; « parente » préserve cette indétermination.
- source_word: συνείληφεν υἱὸν
  choice: a conçu un fils
  rationale: Traduction directe de l’expression grecque, naturelle dans ce contexte d’annonce.
- source_word: ἐν γήρει αὐτῆς
  choice: dans sa vieillesse
  rationale: Conserve la formulation et l’accent du grec sur l’âge avancé d’Élisabeth.
- source_word: οὗτος μὴν ἕκτος ἐστὶν αὐτῇ
  choice: elle en est à son sixième mois
  rationale: Expression française idiomatique qui communique clairement qu’il s’agit du sixième mois de sa grossesse.
- source_word: τῇ καλουμένῃ στείρᾳ
  choice: elle qu’on appelait stérile
  rationale: Préserve l’imparfait implicite de la réputation passée ainsi que la portée sociale de « appelée ».
theological_decisions: []
translation_notes:
  register: Français moderne, international et digne. La syntaxe reste proche du grec tout en évitant une tournure artificielle; « ta parente » ne précise pas abusivement le degré de parenté.
