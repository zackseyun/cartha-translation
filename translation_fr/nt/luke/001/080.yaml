  variant: modern international French
source:
  edition: SBLGNT
  text: Τὸ δὲ παιδίον ηὔξανε καὶ ἐκραταιοῦτο πνεύματι, καὶ ἦν ἐν ταῖς ἐρήμοις ἕως ἡμέρας ἀναδείξεως αὐτοῦ πρὸς τὸν Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/080.yaml
  text: And the child kept growing and becoming strong in spirit[c][b][a], and he was in the wilderness until the day of his public appearance to Israel.
translation:
  language: fr
  text: Quant à l’enfant, il grandissait et devenait fort en esprit[a]. Il vivait dans les régions désertes[b] jusqu’au jour de sa manifestation publique à Israël[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans l’Esprit ». Le grec peut évoquer plus généralement une force intérieure ou spirituelle, ou plus précisément une force liée à l’Esprit Saint.
    reason: alternative_reading
  - marker: b
    text: Littéralement « dans les lieux déserts » ; le grec emploie le pluriel.
    reason: lexical_alternative
  - marker: c
    text: Ou « jusqu’au jour de sa manifestation devant Israël ».
    reason: lexical_alternative
lexical_decisions:
- source_word: παιδίον
  choice: l’enfant
  rationale: Désigne Jean dans sa jeunesse sans imposer un âge plus précis; « l’enfant » est naturel et suffisamment large.
- source_word: ηὔξανε
  choice: grandissait
  rationale: L’imparfait exprime une croissance continue; l’imparfait français en rend naturellement l’aspect progressif.
- source_word: ἐκραταιοῦτο
  choice: se fortifiait
  rationale: Préserve le processus continu ainsi que la valeur moyenne/passive sans préciser excessivement l’agent de cette croissance en force.
- source_word: πνεύματι
  choice: en esprit
  rationale: Conserve l’indétermination du grec, qui peut désigner la force intérieure ou spirituelle sans identifier explicitement l’Esprit Saint.
- source_word: ἐν ταῖς ἐρήμοις
  choice: dans les régions désertes
  rationale: Rend le pluriel grec et le sens de lieux inhabités sans suggérer uniquement un désert de sable.
- source_word: ἀναδείξεως
  choice: se manifesta publiquement
  rationale: Exprime clairement l’idée d’une apparition ou présentation publique dans un français moderne.
- source_word: πρὸς τὸν Ἰσραήλ
  choice: à Israël
  rationale: Présente Israël comme le peuple devant lequel et auquel Jean est publiquement révélé.
theological_decisions:
- issue: Sens de πνεύματι dans le développement de Jean
  choice: en esprit
  alternative: dans l’Esprit
  rationale: L’absence d’article et la formulation grecque permettent un sens général de force intérieure ou spirituelle aussi bien qu’un rapport plus précis à l’Esprit Saint; le texte principal ne tranche pas.
- issue: Portée de ἀνάδειξις πρὸς τὸν Ἰσραήλ
  choice: se manifesta publiquement à Israël
  alternative: fut présenté devant Israël
  rationale: La formulation retenue conserve l’idée de révélation publique et l’orientation vers Israël, sans imposer un cadre cérémoniel.
translation_notes:
  register: Français international moderne, naturel et digne. Les deux imparfaits rendent le développement continu. « Régions désertes » garde le pluriel grec, tandis que les notes préservent les ambiguïtés lexicales et théologiques.
