  source_fidelity: La traduction rend correctement la croissance continue (ηὔξανε) et le renforcement continu (ἐκραταιοῦτο), le caractère non déterminé de πνεύματι, le pluriel de ἐρήμοις et l’idée d’une apparition publique envers Israël. Toutefois, « il vécut » tend à présenter un fait global et achevé, alors que ἦν est à l’imparfait et décrit son séjour habituel ou prolongé dans les lieux déserts.
  naturalness: « Il vivait dans les régions désertes » est plus naturel ici et correspond mieux à l’imparfait grec. « Devenait fort en esprit » évite la nuance potentiellement réflexive de « se fortifiait », tout en restant idiomatique dans un registre biblique moderne.
  terminology: « En esprit » préserve l’ambiguïté du datif anarthre sans identifier explicitement l’Esprit Saint. « Régions désertes » rend de façon recevable le pluriel grec sans réduire le sens à des déserts de sable. « Manifestation publique à Israël » exprime ἀνάδειξις πρὸς τὸν Ἰσραήλ sans imposer un cadre cérémoniel.
  issues:
