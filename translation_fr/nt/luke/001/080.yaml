  to: Quant à l’enfant, il grandissait et devenait fort en esprit[a]. Il vivait dans les régions désertes[b] jusqu’au jour de sa manifestation publique à Israël[c].
  rationale: La révision corrige l’aspect de « il vécut » en « il vivait » et emploie « devenait fort » pour rendre sans surinterprétation la forme moyenne/passive συνεχative. Les notes conservent les principales alternatives, avec une formulation de la note sur l’Esprit Saint qui n’affirme pas une réception ou une causalité absente du texte grec.
