    issue: « Il vécut dans les régions désertes » ne reflète pas suffisamment l’aspect imperfectif de ἦν.
    rationale: Le grec décrit Jean comme étant ou vivant dans ces lieux jusqu’au jour de son apparition; « il vivait » conserve cette durée descriptive, tandis que « il vécut » résume plus volontiers une période achevée.
  - severity: low
    issue: « Se fortifiait » peut suggérer une action réflexive de l’enfant.
    rationale: ἐκραταιοῦτο est une forme moyenne/passive dont l’agent n’est pas précisé. « Devenait fort » rend le processus sans introduire l’idée qu’il se donnait lui-même de la force.
