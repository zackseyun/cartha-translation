  text: εἶπεν δὲ Μαριὰμ πρὸς τὸν ἄγγελον· Πῶς ἔσται τοῦτο, ἐπεὶ ἄνδρα οὐ γινώσκω;
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/034.yaml
  text: But Mary said to the angel[a], “How will this be, since I have not known a man?”
translation:
  language: fr
  text: 'Mais Marie dit à l’ange : « Comment cela se fera-t-il, puisque je ne connais pas d’homme[a] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Connaître un homme » est ici une expression pudique qui signifie avoir des relations sexuelles avec un homme.
    reason: Préciser le sens idiomatique de « connaître un homme » dans ce contexte, sans ajouter une précision temporelle qui n’est pas explicitement formulée par le grec.
lexical_decisions:
- source_word: δὲ
  choice: Mais
  rationale: Marque le léger contraste entre l’annonce de l’ange et la question de Marie, sans en faire une opposition forte.
- source_word: Μαριὰμ
  choice: Marie
  rationale: Forme française traditionnelle et courante du nom propre.
- source_word: πρὸς τὸν ἄγγελον
  choice: à l’ange
  rationale: Dans le récit de l’enfance chez Luc, ἄγγελος désigne clairement un être céleste ; « ange » est donc plus précis ici que le terme général « messager ».
- source_word: Πῶς ἔσται τοῦτο
  choice: Comment cela se fera-t-il
  rationale: Formulation française naturelle qui exprime la question portant sur la manière dont la réalité annoncée viendra à l’existence, tout en restant proche de la simplicité du grec.
- source_word: ἐπεὶ
  choice: puisque
  rationale: Introduit la raison qui motive la question de Marie ; « puisque » rend naturellement cette valeur causale.
- source_word: ἄνδρα
  choice: d’homme
  rationale: ἀνήρ peut signifier « homme » ou « mari ». Dans cette expression à portée sexuelle, « homme » conserve l’étendue du terme grec sans restreindre explicitement le sens à un époux.
- source_word: οὐ γινώσκω
  choice: je ne connais pas
  rationale: Le présent grec signifie littéralement « je ne connais pas ». Dans ce contexte, il s’agit d’une expression pudique désignant les relations sexuelles ; le texte principal conserve l’image du grec et la note en explicite le sens.
theological_decisions:
- issue: La déclaration de Marie et la conception virginale de Jésus
  choice: Conserver dans le texte l’expression « je ne connais pas d’homme » et en expliquer le sens sexuel dans une note.
  alternative: « je n’ai pas de relations avec un homme » ou « je suis vierge »
  rationale: Le contexte indique l’absence de relations sexuelles, mais le grec emploie l’expression « connaître un homme » plutôt que le mot « vierge ». La traduction préserve donc la formulation du texte sans y substituer une explicitation doctrinale, tout en rendant son sens accessible par une note.
translation_notes:
  register: Français international moderne, naturel et digne. La tournure interrogative avec inversion convient au discours direct soigné. L’expression biblique « connaître un homme » est maintenue pour sa proximité avec le grec, mais accompagnée d’une note afin d’éviter toute ambiguïté pour le lecteur moderne.
