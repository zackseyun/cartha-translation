  text: καὶ ἀνεφώνησεν ⸀κραυγῇ μεγάλῃ καὶ εἶπεν· Εὐλογημένη σὺ ἐν γυναιξίν, καὶ εὐλογημένος ὁ καρπὸς τῆς κοιλίας σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/042.yaml
  text: And she cried out with a loud voice and said[a], “Blessed are you among women, and blessed is the fruit of your womb.”
translation:
  language: fr
  text: 'Elle s’écria d’une voix forte : « Tu es bénie parmi les femmes, et le fruit de ton ventre est béni. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνεφώνησεν
  choice: s’écria
  rationale: Le verbe exprime une prise de parole forte et expressive. « S’écria » rend cette intensité sans suggérer nécessairement la détresse.
- source_word: κραυγῇ μεγάλῃ
  choice: d’une voix forte
  rationale: Le datif indique la manière. Cette expression française naturelle conserve l’intensité et le caractère audible de la parole.
- source_word: Εὐλογημένη
  choice: Tu es bénie
  rationale: Le participe parfait passif employé comme prédicat exprime l’état de celle qui a reçu la bénédiction. Cette formulation garde la valeur de la déclaration de bénédiction.
- source_word: ἐν γυναιξίν
  choice: parmi les femmes
  rationale: La traduction suit précisément le grec sans ajouter « toutes », qui n’est pas exprimé.
- source_word: εὐλογημένος
  choice: est béni
  rationale: La même expression que pour Marie maintient le parallélisme de la phrase grecque.
- source_word: ὁ καρπὸς
  choice: le fruit
  rationale: « Fruit » conserve la métaphore corporelle et biblique du texte source sans la remplacer par l’interprétation plus explicite « enfant ».
- source_word: τῆς κοιλίας σου
  choice: de ton ventre
  rationale: Dans ce contexte de grossesse, κοιλία désigne le ventre maternel. « Ventre » est naturel, précis et digne en français contemporain.
theological_decisions:
- issue: Formulation de la bénédiction adressée à Marie
  choice: Tu es bénie parmi les femmes
  alternative: Bénie es-tu parmi les femmes
  rationale: La formulation retenue présente fidèlement la bénédiction prononcée sur Marie sans développer le texte dans un sens doctrinal particulier. Elle est plus naturelle en français moderne tout en préservant le parallélisme avec la bénédiction du fruit de son ventre.
translation_notes:
  register: Français moderne, international et digne. La ponctuation évite la répétition peu naturelle de « et dit » après « s’écria », puisque le verbe français introduit directement les paroles. Le tutoiement convient au dialogue familial et au registre biblique courant.
