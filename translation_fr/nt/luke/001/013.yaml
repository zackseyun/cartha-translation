id: LUK.1.13
reference: Luke 1:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἶπεν δὲ πρὸς αὐτὸν ὁ ἄγγελος· Μὴ φοβοῦ, Ζαχαρία, διότι εἰσηκούσθη ἡ δέησίς σου, καὶ ἡ γυνή σου Ἐλισάβετ γεννήσει υἱόν σοι, καὶ καλέσεις τὸ ὄνομα αὐτοῦ Ἰωάννην·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/013.yaml
  text: But the angel said to him[a], “Do not be afraid, Zechariah, because your prayer has been heard, and your wife Elizabeth will bear you a son[b], and you shall call his name John.”
translation:
  language: fr
  text: 'Mais l’ange lui dit : « N’aie pas peur, Zacharie, car ta prière[a] a été entendue. Ta femme Élisabeth te donnera un fils, et tu lui donneras le nom de Jean[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ta supplication » ou « ta demande pressante ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « tu appelleras son nom Jean ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν δὲ πρὸς αὐτὸν ὁ ἄγγελος
  choice: Mais l’ange lui dit
  rationale: δέ marque ici une légère transition liée à la peur de Zacharie. « Mais » rend ce mouvement sans introduire une opposition forte; « lui dit » exprime naturellement πρὸς αὐτόν.
- source_word: Μὴ φοβοῦ
  choice: N’aie pas peur
  rationale: Formulation courante et directe en français moderne pour cette défense, adaptée à l’état de Zacharie.
- source_word: Ζαχαρία
  choice: Zacharie
  rationale: Forme française traditionnelle et couramment reconnue du nom grec Ζαχαρίας.
- source_word: διότι
  choice: car
  rationale: Introduit clairement la raison pour laquelle Zacharie ne doit pas avoir peur, dans un registre narratif digne et naturel.
- source_word: εἰσηκούσθη
  choice: a été entendue
  rationale: Le passé composé français rend l’action accomplie dont les conséquences sont présentes. Le passif conserve l’absence de sujet explicite dans le grec.
- source_word: ἡ δέησίς σου
  choice: ta prière
  rationale: δέησις désigne une demande pressante adressée à Dieu. « Prière » est le terme le plus naturel dans ce contexte; la nuance plus précise de « supplication » est signalée en note.
- source_word: ἡ γυνή σου Ἐλισάβετ
  choice: ta femme Élisabeth
  rationale: Avec le possessif et dans ce contexte conjugal, γυνή signifie clairement « femme » au sens d’épouse.
- source_word: γεννήσει υἱόν σοι
  choice: te donnera un fils
  rationale: Avec un sujet féminin, γεννάω signifie mettre au monde. Cette tournure française naturelle conserve le bénéficiaire exprimé par σοι et la promesse personnelle, sans alourdir la phrase.
- source_word: καλέσεις τὸ ὄνομα αὐτοῦ Ἰωάννην
  choice: tu lui donneras le nom de Jean
  rationale: Rend naturellement en français l’idiome grec littéral « tu appelleras son nom Jean », tout en conservant la responsabilité donnée à Zacharie de nommer l’enfant.
- source_word: Ἰωάννην
  choice: Jean
  rationale: Forme française établie du nom grec Ἰωάννης.
theological_decisions:
- issue: Agent implicite du passif « a été entendue »
  choice: Conserver le passif sans nommer explicitement Dieu
  alternative: « Dieu a entendu ta prière »
  rationale: Dans ce contexte de prière juive, Dieu est naturellement l’agent implicite. Le texte grec ne le nomme toutefois pas; le passif français préserve donc à la fois cette implication et la retenue de l’original.
- issue: Nature de la prière entendue
  choice: Ne pas préciser dans le texte l’objet de la prière
  alternative: Préciser qu’il s’agissait d’une demande d’enfant
  rationale: L’annonce qui suit suggère fortement un lien avec la naissance promise, mais le verset ne formule pas explicitement l’objet de la prière. La traduction préserve cette ouverture.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement correspond à l’adresse directe au singulier. La syntaxe reste fluide tout en conservant le passif théologiquement significatif et en signalant en note l’idiome sémitisant de la nomination.
