id: LUK.1.11
reference: Luke 1:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὤφθη δὲ αὐτῷ ἄγγελος κυρίου ἑστὼς ἐκ δεξιῶν τοῦ θυσιαστηρίου τοῦ θυμιάματος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/011.yaml
  text: Then an angel of the Lord appeared to him, standing at the right side of the altar of incense.
translation:
  language: fr
  text: Alors, un ange du Seigneur lui apparut, debout à droite de l’autel de l’encens.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὤφθη
  choice: apparut
  rationale: L’aoriste passif de ὁράω a ici le sens intransitif courant d’« apparaître ». Ce choix rend naturellement en français la manifestation visible soudaine.
- source_word: δὲ
  choice: Alors
  rationale: δέ fait progresser le récit sans marquer une forte opposition. « Alors » exprime ici naturellement l’enchaînement narratif.
- source_word: αὐτῷ
  choice: lui
  rationale: Avec ὤφθη, le datif désigne la personne à qui l’apparition se manifeste ; « lui apparut » est la tournure française idiomatique.
- source_word: ἄγγελος
  choice: un ange
  rationale: Dans ce contexte de vision au Temple, il s’agit clairement d’un être céleste plutôt que d’un simple messager humain.
- source_word: κυρίου
  choice: du Seigneur
  rationale: La construction génitive ἄγγελος κυρίου se rend naturellement par « un ange du Seigneur », en conservant le titre biblique κύριος.
- source_word: ἑστὼς
  choice: debout
  rationale: Le participe parfait décrit la posture de l’ange au moment où il apparaît. « Debout » est précis et naturel en français.
- source_word: ἐκ δεξιῶν
  choice: à droite de
  rationale: Cette expression idiomatique indique la position du côté droit. « À droite de » restitue clairement le rapport spatial avec l’autel.
- source_word: θυσιαστηρίου
  choice: autel
  rationale: « Autel » est l’équivalent français usuel de θυσιαστήριον.
- source_word: τοῦ θυμιάματος
  choice: de l’encens
  rationale: Le génitif identifie l’autel concerné, celui où l’encens est offert. « L’autel de l’encens » conserve la formulation biblique usuelle et précise.
theological_decisions:
- issue: Traduction de κύριος dans ἄγγελος κυρίου
  choice: le Seigneur
  alternative: Seigneur
  rationale: « Un ange du Seigneur » est la tournure française naturelle et conserve le titre κύριος sans ajouter de précision doctrinale.
translation_notes:
  register: Français moderne, international et digne. La phrase reste concise et narrative. « Debout » évite le calque lourd « se tenant », tandis que « à droite de l’autel » conserve clairement la localisation.
