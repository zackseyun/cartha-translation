id: LUK.1.6
reference: Luke 1:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἦσαν δὲ δίκαιοι ἀμφότεροι ⸀ἐναντίον τοῦ θεοῦ, πορευόμενοι ἐν πάσαις ταῖς ἐντολαῖς καὶ δικαιώμασιν τοῦ κυρίου ἄμεμπτοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/006.yaml
  text: And both of them were righteous before God[b][a], walking blamelessly in all the commandments and ordinances of the Lord.
translation:
  language: fr
  text: Tous deux étaient justes devant Dieu et suivaient de manière irréprochable tous les commandements et toutes les prescriptions du Seigneur.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction : « Tous deux étaient justes devant Dieu, irréprochables dans leur manière de suivre tous les commandements et toutes les prescriptions du Seigneur. »'
    reason: ambiguïté_syntaxique
lexical_decisions:
- source_word: δίκαιοι
  choice: justes
  rationale: « Justes » conserve le sens moral et relationnel du terme dans le contexte biblique, sans le réduire à la seule équité juridique.
- source_word: ἀμφότεροι
  choice: tous deux
  rationale: Cette tournure naturelle souligne que la description s’applique également à Zacharie et à Élisabeth.
- source_word: ἐναντίον τοῦ θεοῦ
  choice: devant Dieu
  rationale: Cette expression concise préserve l’idée que leur justice est reconnue au regard de Dieu.
- source_word: πορευόμενοι
  choice: suivaient
  rationale: Dans ce contexte éthique, le verbe décrit leur conduite habituelle. « Suivaient » rend naturellement la métaphore de la marche en lien avec les commandements.
- source_word: ἐν πάσαις ταῖς ἐντολαῖς
  choice: tous les commandements
  rationale: La formulation garde la portée exhaustive de πάσαις tout en restant idiomatique en français.
- source_word: δικαιώμασιν
  choice: toutes les prescriptions
  rationale: « Prescriptions » désigne les dispositions établies et maintient une distinction compréhensible avec « commandements ».
- source_word: τοῦ κυρίου
  choice: du Seigneur
  rationale: Rendu français traditionnel et naturel de κύριος lorsqu’il désigne ici le Dieu d’Israël.
- source_word: ἄμεμπτοι
  choice: de manière irréprochable
  rationale: Cette expression rend la valeur prédicative du terme en décrivant leur conduite comme exempte de reproche, sans ajouter une affirmation explicite de perfection absolue.
- source_word: ἦσαν δὲ
  choice: étaient
  rationale: Le léger lien narratif de δέ n’a pas besoin d’être exprimé par une conjonction en français dans ce verset isolé; l’imparfait rend l’état décrit.
theological_decisions:
- issue: ἄμεμπτοι affirme-t-il une absence absolue de péché ?
  choice: Conserver l’affirmation forte d’une conduite irréprochable sans la définir comme une perfection absolue.
  alternative: Comprendre le terme comme affirmant explicitement une perfection morale sans aucun péché.
  rationale: Le texte qualifie leur manière de suivre les commandements et les prescriptions. La traduction garde cette force tout en évitant d’introduire une précision doctrinale que le verset ne formule pas.
translation_notes:
  register: Français international moderne, digne et accessible. « De manière irréprochable » est plus naturel aujourd’hui que « sans reproche » comme complément de « marcher », tandis que la note conserve l’autre rattachement syntaxique possible de ἄμεμπτοι.
