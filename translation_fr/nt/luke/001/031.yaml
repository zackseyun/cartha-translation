id: LUK.1.31
reference: Luke 1:31
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ συλλήμψῃ ἐν γαστρὶ καὶ τέξῃ υἱόν, καὶ καλέσεις τὸ ὄνομα αὐτοῦ Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/031.yaml
  text: And behold[a], you will conceive in your womb and bear a son, and you will call his name Jesus.
translation:
  language: fr
  text: Et voici, tu concevras dans ton sein et tu mettras au monde un fils, et tu lui donneras le nom de Jésus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus simplement : « tu l’appelleras Jésus »; littéralement : « tu appelleras son nom Jésus ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: voici
  rationale: Conserve la fonction de particule qui attire l’attention et le ton solennel de l’annonce, tout en restant naturel en français moderne.
- source_word: συλλήμψῃ
  choice: tu concevras
  rationale: Rend précisément la conception exprimée par le futur de συλλαμβάνω; la formulation demeure claire et digne.
- source_word: ἐν γαστρὶ
  choice: dans ton sein
  rationale: Reproduit l’expression corporelle du grec sans employer « ventre », moins approprié dans ce registre; « sein » est ici compris au sens de matrice.
- source_word: τέξῃ
  choice: tu mettras au monde
  rationale: Expression française naturelle et précise pour l’action d’enfanter, plus courante aujourd’hui que « tu enfanteras ».
- source_word: υἱόν
  choice: un fils
  rationale: Préserve la désignation masculine spécifique du grec.
- source_word: καλέσεις τὸ ὄνομα αὐτοῦ
  choice: tu lui donneras le nom de
  rationale: Rend naturellement en français la formule de nomination tout en conservant explicitement le motif du « nom » présent dans le grec.
- source_word: Ἰησοῦν
  choice: Jésus
  rationale: Suit la forme française conventionnelle du nom dans le Nouveau Testament.
theological_decisions:
- issue: Rendu de la formule de nomination καλέσεις τὸ ὄνομα αὐτοῦ
  choice: tu lui donneras le nom de Jésus
  alternative: tu l’appelleras Jésus
  rationale: La formulation retenue garde la mention explicite du nom et l’écho aux formules bibliques de nomination, tout en évitant le calque peu naturel « tu appelleras son nom ».
translation_notes:
  register: Français international moderne, digne et accessible. Le verset conserve la solennité de l’annonce grâce à « voici », sans archaïsmes syntaxiques. La note signale à la fois l’équivalent idiomatique et la forme littérale de la formule de nomination.
