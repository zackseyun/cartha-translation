id: LUK.1.25
reference: Luke 1:25
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὅτι Οὕτως μοι ⸀πεποίηκεν κύριος ἐν ἡμέραις αἷς ἐπεῖδεν ⸀ἀφελεῖν ὄνειδός μου ἐν ἀνθρώποις.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/025.yaml
  text: because this is how the Lord has dealt with me in the days when he looked on me[a], to take away my reproach among people.
translation:
  language: fr
  text: « Voilà comment le Seigneur a agi envers moi, au temps où il a porté son regard sur moi pour enlever mon déshonneur[a] parmi les gens. »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ma honte » ou « mon opprobre ». Le terme grec désigne surtout le discrédit ou le déshonneur subi aux yeux des autres.'
    reason: alternative lexicale
lexical_decisions:
- source_word: ὅτι
  choice: « … » (introduit directement les paroles)
  rationale: Après le verbe « dire » du verset précédent, ὅτι introduit le contenu des paroles d’Élisabeth. En français naturel, les deux-points et les guillemets remplissent cette fonction sans qu’il soit nécessaire d’ajouter « parce que ».
- source_word: Οὕτως
  choice: Voilà comment
  rationale: Cette tournure française actuelle exprime la manière avec une valeur démonstrative et emphatique.
- source_word: μοι πεποίηκεν
  choice: a agi envers moi
  rationale: Le parfait souligne une action accomplie dont l’effet demeure. « Agir envers moi » rend naturellement l’expression formée de ποιέω et du datif, sans préciser abusivement si l’action est faite « à » ou « pour » Élisabeth.
- source_word: κύριος
  choice: le Seigneur
  rationale: Le titre désigne ici Dieu, auteur de l’intervention qui met fin à la stérilité d’Élisabeth.
- source_word: ἐν ἡμέραις αἷς
  choice: au temps où
  rationale: Rend naturellement la construction temporelle grecque, sans conserver le calque plus lourd « dans les jours où ».
- source_word: ἐπεῖδεν
  choice: il a porté son regard sur moi
  rationale: Préserve l’image du regard tout en exprimant l’attention favorable impliquée par le verbe. Le complément « sur moi » est explicité par le contexte et correspond à l’usage français.
- source_word: ἀφελεῖν
  choice: pour enlever
  rationale: Conserve la relation de but ou de résultat de l’infinitif grec sans la trancher plus précisément.
- source_word: ὄνειδός μου
  choice: mon déshonneur
  rationale: « Déshonneur » exprime ici la perte d’estime et l’opprobre social liés à la stérilité, plutôt qu’un sentiment uniquement intérieur.
- source_word: ἐν ἀνθρώποις
  choice: parmi les gens
  rationale: Désigne la sphère sociale où ce déshonneur était éprouvé. « Les gens » est inclusif, courant et fidèle au pluriel générique ἀνθρώποις.
theological_decisions:
- issue: Référent de κύριος
  choice: « le Seigneur », en référence à Dieu
  alternative: Aucune autre lecture majeure dans le contexte immédiat
  rationale: Élisabeth parle de l’action divine qui a mis fin à sa stérilité. La traduction garde le titre théologique sans introduire ici une identification christologique plus précise.
- issue: Portée sociale de ὄνειδος
  choice: mon déshonneur
  alternative: ma honte ; mon opprobre
  rationale: Le contexte met en avant le discrédit subi au regard de la communauté. « Déshonneur » conserve cette dimension extérieure, tandis que « honte » pourrait être comprise surtout comme une émotion intérieure.
- issue: Rapport exprimé par ἀφελεῖν
  choice: pour enlever
  alternative: de sorte à enlever
  rationale: L’infinitif peut évoquer le but ou le résultat du regard favorable de Dieu. La formulation retenue reste naturelle tout en évitant une explication théologique supplémentaire.
translation_notes:
  register: Français international moderne, naturel et digne. « Voilà comment » évite une tournure archaïque, « porté son regard » garde l’image biblique sans raideur, et « parmi les gens » restitue clairement la dimension sociale du propos.
