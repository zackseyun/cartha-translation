  text: Καὶ εἶπεν Μαριάμ· Μεγαλύνει ἡ ψυχή μου τὸν κύριον,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/046.yaml
  text: And Mary said[a], “My soul magnifies the Lord,”
translation:
  language: fr
  text: 'Et Marie dit : « Mon âme exalte[a] le Seigneur, »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « proclame la grandeur du Seigneur ».
    reason: Alternative lexicale explicitant le sens de μεγαλύνει.
lexical_decisions:
- source_word: Καὶ
  choice: Et
  rationale: La conjonction simple conserve l’enchaînement narratif grec sans lui ajouter une nuance temporelle.
- source_word: εἶπεν
  choice: dit
  rationale: Dans cette introduction narrative, l’aoriste de λέγω se rend naturellement par « dit ».
- source_word: Μαριάμ
  choice: Marie
  rationale: La forme française traditionnelle et courante du nom est retenue.
- source_word: Μεγαλύνει
  choice: exalte
  rationale: « Exalte » exprime ici l’action de célébrer quelqu’un comme grand et garde la force poétique du présent grec. Le français littéral « magnifie » serait moins naturel pour de nombreux lecteurs actuels.
- source_word: ἡ ψυχή μου
  choice: Mon âme
  rationale: Cette formulation préserve l’expression poétique et anthropologique du grec au lieu de la réduire au simple pronom « je ».
- source_word: τὸν κύριον
  choice: le Seigneur
  rationale: Dans ce chant de louange adressé à Dieu, « Seigneur » rend naturellement le titre divin κύριος et conserve ses résonances scripturaires.
theological_decisions:
- issue: Traduction de κύριος
  choice: le Seigneur
  alternative: le Maître
  rationale: Le contexte de louange et les échos scripturaires indiquent un titre divin; « le Maître » serait lexicalement possible, mais trop étroit ici.
- issue: Portée anthropologique de ἡ ψυχή μου
  choice: Mon âme
  alternative: Je / tout mon être
  rationale: La formulation conserve la tension poétique du langage biblique sans imposer une définition particulière de l’âme ni effacer l’image par une simple reformulation idiomatique.
- issue: Valeur de μεγαλύνει
  choice: exalte
  alternative: proclame la grandeur de
  rationale: « Exalte » maintient une formulation concise et poétique, tandis que l’autre lecture explicite le sens de l’image sans en changer l’objet.
translation_notes:
  register: Français international moderne, digne et poétique. L’ordre « Mon âme exalte » conserve le parallélisme du cantique. La virgule finale signale que la phrase poétique se poursuit au verset suivant.
