id: LUK.1.52
reference: Luke 1:52
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καθεῖλεν δυνάστας ἀπὸ θρόνων καὶ ὕψωσεν ταπεινούς,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/052.yaml
  text: He has brought down rulers from thrones and exalted the humble[a][b].
translation:
  language: fr
  text: Il a renversé les puissants de leurs trônes[a] et élevé les humbles[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des dirigeants » pour « les puissants ». Le terme grec peut désigner plus largement des personnes puissantes, mais la mention des trônes met ici en avant le sens de dirigeants.
    reason: lexical_alternative
  - marker: b
    text: Ou « les gens de condition modeste ». Le grec peut évoquer l’humilité et/ou une position sociale peu élevée.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθεῖλεν
  choice: a renversé
  rationale: Le verbe exprime l’abaissement ou la destitution de personnes en position élevée. « A renversé » est naturel, vigoureux et convient à l’image des trônes sans préciser indûment les moyens employés.
- source_word: δυνάστας
  choice: les puissants
  rationale: Le nom désigne des personnes puissantes, notamment des dirigeants. « Les puissants » conserve l’étendue du terme grec, tandis que la mention des trônes en fait ressortir ici la dimension politique.
- source_word: ἀπὸ θρόνων
  choice: de leurs trônes
  rationale: « Trônes » préserve l’image concrète du grec. Le possessif, implicite dans la relation entre les puissants et les trônes dont ils sont renversés, rend la phrase idiomatique en français sans en modifier le sens.
- source_word: ὕψωσεν
  choice: élevé
  rationale: Le verbe signifie mettre en hauteur ou exalter. « Élevé » exprime clairement le mouvement inverse de l’abaissement et garde les résonances sociales et théologiques du texte.
- source_word: ταπεινούς
  choice: les humbles
  rationale: L’adjectif peut désigner ceux qui sont humbles ou ceux dont la condition est basse. « Les humbles » garde en français une part de cette ambiguïté, explicitée en note.
theological_decisions:
- issue: Valeur temporelle des aoristes dans le Magnificat
  choice: 'Passé composé : « a renversé… et élevé »'
  alternative: Passé simple (« renversa… et éleva ») ou présent à valeur générale
  rationale: Le passé composé présente les actions de Dieu comme décisives et accomplies, avec une portée actuelle, sans trancher entre récapitulation, proclamation prophétique et célébration générale de son agir.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme de renversement est conservé, ainsi que l’image concrète des trônes. Les notes signalent sans la résoudre l’ambiguïté sociale et morale des termes grecs.
