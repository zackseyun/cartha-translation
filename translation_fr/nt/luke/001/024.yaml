  - severity: low
    issue: '« Elle disait : » transforme le participe en proposition indépendante.'
    rationale: 'Cette solution est possible en français, mais « en disant : » conserve plus directement le lien participial de λέγουσα avec l’action précédente et introduit sans ambiguïté les paroles suivantes.'
