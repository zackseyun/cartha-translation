    issue: « Après cette période » remplace « jours » par une notion plus vague.
    rationale: Μετὰ δὲ ταύτας τὰς ἡμέρας signifie littéralement « après ces jours-là ». Bien que la période soit connue du contexte, « période » n’est pas exprimé par le grec et réduit la fidélité lexicale sans nécessité.
  - severity: medium
