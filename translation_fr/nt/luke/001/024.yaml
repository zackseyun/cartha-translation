  yaml_path: translation/nt/luke/001/024.yaml
  text: After these days Elizabeth his wife conceived[a], and she kept herself hidden for five months, saying[b],
translation:
  language: fr
  text: 'Après ces jours-là, sa femme Élisabeth devint enceinte et se tint cachée pendant cinq mois, en disant :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μετὰ δὲ ταύτας τὰς ἡμέρας
  choice: Après cette période
  rationale: μετά avec l’accusatif marque la succession temporelle. En français narratif, « après cette période » restitue naturellement l’expression sans donner à « jours » un sens artificiellement littéral; δέ est une liaison légère que la continuité du récit suffit à rendre.
- source_word: συνέλαβεν
  choice: devint enceinte
  rationale: Dans ce contexte, συλλαμβάνω désigne le fait de concevoir un enfant. « Devint enceinte » est clair, naturel et non technique en français moderne.
- source_word: Ἐλισάβετ
  choice: Élisabeth
  rationale: Forme française traditionnelle et courante du nom propre.
- source_word: ἡ γυνὴ αὐτοῦ
  choice: sa femme
  rationale: Avec le possessif et dans ce contexte conjugal, γυνή signifie sans ambiguïté « femme » au sens d’épouse.
- source_word: περιέκρυβεν ἑαυτὴν
  choice: se tint à l’écart
  rationale: Cette formulation rend l’action volontaire et prolongée exprimée par le réfléchi et l’imparfait grec, sans affirmer nécessairement qu’Élisabeth se cachait au sens matériel.
- source_word: μῆνας πέντε
  choice: pendant cinq mois
  rationale: L’accusatif indique une durée; « pendant » l’exprime idiomatiquement en français.
- source_word: λέγουσα
  choice: 'Elle disait :'
  rationale: Le participe présent introduit les paroles qui suivent. Une nouvelle proposition avec l’imparfait est plus naturelle en français et conserve la valeur durative liée au contexte.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. La phrase est structurée pour introduire naturellement la citation du verset suivant; l’imparfait « disait » préserve l’ouverture et la continuité du participe grec.
