  yaml_path: translation/nt/luke/001/054.yaml
  text: He has helped Israel his servant[a], in remembrance of mercy[b],
translation:
  language: fr
  text: Il est venu au secours d’Israël, son serviteur[a], en se souvenant de sa miséricorde[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « son enfant ». Le mot grec peut signifier « serviteur » ou « enfant » ; « serviteur » est retenu ici en raison de l’usage biblique qui présente Israël comme le serviteur de Dieu.
    reason: lexical_alternative
  - marker: b
    text: Le mot traduit par « miséricorde » peut aussi évoquer la compassion ou la bonté bienveillante et, dans ce contexte, la fidélité de Dieu envers son peuple.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντελάβετο
  choice: est venu au secours de
  rationale: Le verbe exprime le fait de prendre en charge quelqu’un pour l’aider ou le soutenir. Cette tournure française rend naturellement l’intervention salvatrice de Dieu sans réduire le sens à une aide vague.
- source_word: Ἰσραὴλ
  choice: Israël
  rationale: Le nom propre est conservé sous sa forme française habituelle et désigne ici collectivement le peuple d’Israël.
- source_word: παιδὸς
  choice: serviteur
  rationale: παῖς peut désigner un serviteur ou un enfant. « Serviteur » convient mieux ici à l’arrière-plan scripturaire où Israël est appelé le serviteur de Dieu, tout en signalant l’autre sens possible en note.
- source_word: αὐτοῦ
  choice: son
  rationale: 'Le possessif renvoie à Dieu : Israël est son serviteur.'
- source_word: μνησθῆναι
  choice: en se souvenant de
  rationale: L’infinitif aoriste précise l’action de secours en évoquant le souvenir divin. Le gérondif français conserve le lien étroit avec le verbe principal sans trancher fortement entre circonstance, intention et résultat.
- source_word: ἐλέους
  choice: sa bonté
  rationale: ἔλεος désigne la miséricorde ou la compassion agissante et peut, dans ce contexte, évoquer la fidélité bienveillante de Dieu. « Bonté » est naturel en français et s’accorde avec la portée relationnelle du terme; la note conserve ses autres nuances.
theological_decisions:
- issue: Sens de παῖς appliqué à Israël
  choice: Israël, son serviteur
  alternative: Israël, son enfant
  rationale: Le contexte de fidélité à l’alliance et l’écho du langage scripturaire relatif au serviteur favorisent « serviteur ». La note maintient toutefois l’ambiguïté lexicale réelle de παῖς.
- issue: Portée de μνησθῆναι ἐλέους
  choice: en se souvenant de sa bonté
  alternative: pour se souvenir de sa miséricorde; en souvenir de sa miséricorde
  rationale: La formulation présente le secours accordé à Israël en rapport avec le souvenir divin de la bonté, sans préciser excessivement si l’infinitif indique la circonstance, le but ou le résultat. Elle laisse également ouverte la nuance d’une bonté liée à l’alliance.
translation_notes:
  register: Français international actuel, digne et accessible. « Est venu au secours de » est idiomatique sans être familier; « bonté » évite une formulation trop technique, tandis que la note restitue les nuances de miséricorde et de fidélité liées au contexte.
