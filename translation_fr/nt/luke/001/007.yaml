source:
  edition: SBLGNT
  text: καὶ οὐκ ἦν αὐτοῖς τέκνον, καθότι ⸂ἦν ἡ Ἐλισάβετ⸃ στεῖρα, καὶ ἀμφότεροι προβεβηκότες ἐν ταῖς ἡμέραις αὐτῶν ἦσαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/007.yaml
  text: And they had no child[a], because Elizabeth was barren, and both of them were advanced in years.
translation:
  language: fr
  text: Ils n’avaient pas d’enfant, parce qu’Élisabeth était stérile, et ils étaient tous les deux avancés en âge.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « avancés dans leurs jours ».'
    reason: La note conserve l’image propre à l’expression grecque derrière la formulation idiomatique « avancés en âge ».
lexical_decisions:
- source_word: τέκνον
  choice: enfant
  rationale: Le singulier « enfant » correspond au grec et exprime naturellement en français l’absence de descendance du couple.
- source_word: καθότι
  choice: parce que
  rationale: Cette conjonction introduit ici la cause de leur absence d’enfant ; « parce que » est clair et direct.
- source_word: στεῖρα
  choice: stérile
  rationale: Le terme désigne précisément l’impossibilité d’avoir des enfants, sans confondre cette condition avec l’absence d’enfant déjà énoncée.
- source_word: ἀμφότεροι
  choice: tous les deux
  rationale: Cette expression naturelle souligne que Zacharie et Élisabeth étaient l’un et l’autre avancés en âge.
- source_word: προβεβηκότες ἐν ταῖς ἡμέραις αὐτῶν
  choice: avancés en âge
  rationale: Cette tournure française, respectueuse et idiomatique, rend le sens de l’expression grecque, qui indique qu’ils étaient âgés, tout en conservant son registre digne.
- source_word: οὐκ ἦν αὐτοῖς
  choice: ils n’avaient pas
  rationale: Le grec emploie une construction existentielle avec un datif de possession, que le français exprime naturellement par le verbe « avoir ».
