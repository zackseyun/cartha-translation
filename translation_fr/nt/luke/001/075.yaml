  text: ἐν ὁσιότητι καὶ δικαιοσύνῃ ἐνώπιον αὐτοῦ ⸂πάσαις ταῖς ἡμέραις⸃ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/075.yaml
  text: in holiness and righteousness before him all our days[a].
translation:
  language: fr
  text: dans la sainteté et la justice[a] devant lui, tous nos jours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « droiture ».
    reason: Alternative lexicale pour δικαιοσύνη.
lexical_decisions:
- source_word: ἐν
  choice: dans
  rationale: La préposition introduit la sphère ou la manière dans laquelle le service est rendu; « dans » conserve naturellement la structure grecque.
- source_word: ὁσιότητι
  choice: sainteté
  rationale: Le terme désigne une sainteté ou une piété orientée vers Dieu; « sainteté » est naturel, digne et reste distinct de δικαιοσύνη.
- source_word: καὶ
  choice: et
  rationale: Conjonction de coordination simple reliant les deux noms.
- source_word: δικαιοσύνῃ
  choice: justice
  rationale: Dans ce contexte éthique et relationnel devant Dieu, « justice » exprime la conduite conforme à ce qui est droit. « Droiture » reste une possibilité qui met davantage l’accent sur la rectitude personnelle.
- source_word: ἐνώπιον αὐτοῦ
  choice: devant lui
  rationale: Formulation française concise qui garde l’idée d’être en sa présence et sous son regard.
- source_word: πάσαις ταῖς ἡμέραις ἡμῶν
  choice: tous nos jours
  rationale: Cette expression conserve les éléments du grec et désigne naturellement toute la durée de la vie sans ajouter explicitement le mot « vie ».
theological_decisions:
- issue: Rendu de δικαιοσύνη dans un contexte éthique non paulinien
  choice: justice
  alternative: droiture
  rationale: Le français « justice » couvre ici la conformité à ce qui est droit devant Dieu et s’accorde bien avec « sainteté ». La note préserve « droiture », qui peut mieux faire ressortir la rectitude morale sans réduire le terme à la justice sociale ou judiciaire.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe demeure proche du grec tout en restant naturelle; « tous nos jours » conserve l’expression source et sa portée existentielle.
