  text: So they motioned to his father to find out what he wanted him to be called.
translation:
  language: fr
  text: Alors ils demandèrent par signes à son père comment il voulait que l’enfant soit appelé.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus près du grec : « quel nom il souhaiterait qu’on lui donne ».'
    reason: La note rend explicitement la question indirecte grecque portant sur le nom et reflète avec prudence la nuance éventuelle de l’optatif avec ἄν, sans produire une formulation française ambiguë.
lexical_decisions:
- source_word: ἐνένευον
  choice: demandèrent par signes
  rationale: Le verbe désigne une communication au moyen de signes ou de gestes. Cette formulation est naturelle en français et indique que les signes étaient adressés au père.
- source_word: δὲ
  choice: Alors
  rationale: Ici, δέ est un connecteur narratif léger qui fait progresser le récit.
- source_word: τῷ πατρὶ αὐτοῦ
  choice: à son père
  rationale: Le datif désigne la personne à laquelle les signes étaient adressés.
- source_word: τὸ τί ἂν θέλοι
  choice: comment il voulait
  rationale: La question indirecte porte sur le nom que le père souhaitait donner. L’optatif avec ἄν apporte une nuance de potentialité ou d’indétermination que le français idiomatique ne marque pas aisément sans lourdeur.
- source_word: καλεῖσθαι αὐτό
  choice: que l’enfant soit appelé
  rationale: Le passif de l’infinitif est conservé. « l’enfant » explicite naturellement le référent neutre αὐτό sans employer le pronom impersonnel français « cela ».
theological_decisions: []
translation_notes:
  register: Français international moderne, courant et digne. « Demandèrent par signes » rend explicitement la fonction communicative du geste; « comment » est idiomatique dans le contexte du choix d’un nom. Le texte évite d’ajouter « pour savoir », absent de la formulation grecque.
