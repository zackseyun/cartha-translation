source:
  edition: SBLGNT
  text: ἡ δὲ ⸂ἐπὶ τῷ λόγῳ διεταράχθη⸃ καὶ διελογίζετο ποταπὸς εἴη ὁ ἀσπασμὸς οὗτος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/029.yaml
  text: But she was greatly troubled at the message[b][a], and kept considering what kind of greeting this might be.
translation:
  language: fr
  text: Mais elle fut profondément troublée par ces paroles[a] et se demandait quelle sorte de salutation cela pouvait être[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « par cette parole » ou « à cause de ce qui avait été dit ». Le grec λόγος peut désigner une parole, une déclaration ou un message.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « quelle sorte de salutation cela pouvait être ». La formulation grecque porte sur la nature ou le caractère de cette salutation.'
    reason: translation_clarity
lexical_decisions:
- source_word: δὲ
  choice: Mais
  rationale: Marque un léger contraste et fait passer le récit de la salutation de l’ange à la réaction de Marie.
- source_word: ἐπὶ τῷ λόγῳ
  choice: par ces paroles
  rationale: Renvoie à ce que l’ange vient de dire. Le pluriel français est idiomatique pour désigner les propos entendus, tandis que la note conserve les autres valeurs possibles de λόγος.
- source_word: διεταράχθη
  choice: fut profondément troublée
  rationale: Rend la vive agitation exprimée par le verbe intensif, dans un français naturel et digne.
- source_word: διελογίζετο
  choice: se demandait
  rationale: Exprime la réflexion intérieure en cours suggérée par l’imparfait grec, sans lui attribuer de l’incrédulité.
- source_word: ποταπὸς εἴη ὁ ἀσπασμὸς οὗτος
  choice: quel pouvait être le sens d’une telle salutation
  rationale: Formulation française naturelle qui exprime l’interrogation sur la nature ou la portée de cette salutation; « pouvait être » garde la nuance de réserve de l’optatif.
theological_decisions:
- issue: Nature de la réaction de Marie
  choice: Marie est troublée par les paroles entendues et réfléchit à la nature ou à la portée de la salutation.
  alternative: Marie aurait été effrayée par l’apparition de l’ange, ou sa réaction manifesterait de l’incrédulité.
  rationale: Le grec rattache explicitement son trouble à λόγος et décrit une délibération intérieure, sans porter de jugement moral ou théologique sur sa réaction.
translation_notes:
  register: Français international moderne, fluide et digne. « Profondément troublée » conserve l’intensité du grec; « se demandait » restitue une réflexion prolongée. Les marqueurs [a] et [b] figurent dans le texte.
