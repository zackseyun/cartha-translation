id: LUK.1.33
reference: Luke 1:33
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ βασιλεύσει ἐπὶ τὸν οἶκον Ἰακὼβ εἰς τοὺς αἰῶνας, καὶ τῆς βασιλείας αὐτοῦ οὐκ ἔσται τέλος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/033.yaml
  text: And he will reign over the house of Jacob forever[a], and of his kingdom there will be no end.
translation:
  language: fr
  text: Il régnera sur la maison de Jacob pour toujours[a], et son règne n’aura pas de fin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « pour les siècles ». Cette expression grecque indique ici une durée sans fin. On peut aussi traduire la fin du verset : « et son royaume n’aura pas de fin ».'
    reason: Alternative lexicale et préservation de l’étendue sémantique de βασιλεία.
lexical_decisions:
- source_word: βασιλεύσει
  choice: Il régnera
  rationale: Le futur actif de βασιλεύω désigne l’exercice de la royauté. « Régnera » est naturel en français moderne et conserve explicitement le sens royal.
- source_word: ἐπὶ τὸν οἶκον Ἰακώβ
  choice: sur la maison de Jacob
  rationale: Après βασιλεύω, ἐπί avec l’accusatif indique l’objet sur lequel s’exerce la souveraineté. « Maison de Jacob » préserve l’expression biblique traditionnelle et sa portée collective sans l’interpréter.
- source_word: εἰς τοὺς αἰῶνας
  choice: pour toujours
  rationale: Cette tournure idiomatique exprime ici une durée sans fin. « Pour toujours » en restitue clairement la force en français courant.
- source_word: βασιλείας
  choice: règne
  rationale: βασιλεία peut désigner le règne, la royauté ou le royaume. « Son règne n’aura pas de fin » forme en français un parallèle naturel avec « il régnera » et met en valeur l’exercice durable de la souveraineté, sans nier la possibilité du sens « royaume ».
- source_word: οὐκ ἔσται τέλος
  choice: n’aura pas de fin
  rationale: Cette formulation française naturelle conserve la négation absolue et la valeur future de la construction grecque.
theological_decisions:
- issue: Portée de « la maison de Jacob »
  choice: Conserver « la maison de Jacob » sans explicitation.
  alternative: « le peuple d’Israël » ou « le peuple de Dieu »
  rationale: La désignation d’alliance doit rester intacte afin de ne pas élargir ou restreindre silencieusement sa portée théologique.
- issue: Durée de la royauté
  choice: « pour toujours » et « n’aura pas de fin »
  alternative: « pour les siècles »
  rationale: Le verset présente la souveraineté messianique comme interminable. Le français retenu en communique directement la force tout en signalant en note la forme plus littérale de l’idiome.
- issue: Sens de βασιλεία
  choice: « règne »
  alternative: « royaume »
  rationale: Le mot grec permet les deux nuances. Dans cette phrase, « règne » est idiomatique et souligne la souveraineté royale annoncée, tandis que la variante « royaume » est conservée en note pour préserver l’ambiguïté lexicale.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche du grec sans devenir artificielle; l’expression biblique « maison de Jacob » est conservée.
