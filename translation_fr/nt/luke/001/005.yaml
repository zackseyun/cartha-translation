id: LUK.1.5
reference: Luke 1:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἐγένετο ἐν ταῖς ἡμέραις ⸀Ἡρῴδου βασιλέως τῆς Ἰουδαίας ἱερεύς τις ὀνόματι Ζαχαρίας ἐξ ἐφημερίας Ἀβιά, ⸀καὶ γυνὴ ⸀αὐτῷ ἐκ τῶν θυγατέρων Ἀαρών, καὶ τὸ ὄνομα αὐτῆς Ἐλισάβετ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/005.yaml
  text: In the days of Herod[a], king of Judea, there was a priest named Zechariah, from the division of Abijah; and he had a wife from the daughters of Aaron[b], and her name was Elizabeth.
translation:
  language: fr
  text: Au temps d’Hérode, roi de Judée, il y avait un prêtre nommé Zacharie, de la classe d’Abia[a] ; son épouse était issue des filles d’Aaron[b] et s’appelait Élisabeth.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La « classe d’Abia » était l’un des groupes de prêtres qui assuraient à tour de rôle le service du Temple.
    reason: cultural_note
  - marker: b
    text: Ou « descendante d’Aaron ». Le grec dit littéralement « issue des filles d’Aaron », expression qui indique une ascendance sacerdotale.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο ἐν ταῖς ἡμέραις
  choice: Au temps de … il y avait
  rationale: Cette formulation française naturelle rend à la fois le cadre temporel et la formule narrative d’introduction du grec.
- source_word: Ἡρῴδου βασιλέως τῆς Ἰουδαίας
  choice: Hérode, roi de Judée
  rationale: Le génitif grec précise la fonction et le territoire d’Hérode ; « Judée » convient au cadre historique.
- source_word: ἱερεύς τις ὀνόματι Ζαχαρίας
  choice: un prêtre nommé Zacharie
  rationale: L’article indéfini introduit naturellement le personnage, tandis que « nommé » rend l’expression grecque sans lourdeur.
- source_word: ἐξ ἐφημερίας Ἀβιά
  choice: de la classe d’Abia
  rationale: ἐφημερία désigne l’une des classes organisées de prêtres assurant à tour de rôle le service du Temple. « Classe » est le terme français biblique et historique usuel.
- source_word: γυνὴ αὐτῷ
  choice: son épouse
  rationale: Le datif a ici une valeur possessive. « Son épouse » exprime naturellement en français la relation indiquée par le grec.
- source_word: ἐκ τῶν θυγατέρων Ἀαρών
  choice: issue des filles d’Aaron
  rationale: La traduction conserve l’image familiale concrète du grec tout en signalant clairement une ascendance.
- source_word: τὸ ὄνομα αὐτῆς Ἐλισάβετ
  choice: s’appelait Élisabeth
  rationale: Cette tournure idiomatique française rend fidèlement la formule grecque de désignation.
- source_word: Ζαχαρίας / Ἐλισάβετ / Ἀβιά / Ἀαρών
  choice: Zacharie / Élisabeth / Abia / Aaron
  rationale: Ces formes correspondent aux usages français modernes établis pour les noms bibliques.
theological_decisions:
- issue: Formulation de l’ascendance sacerdotale d’Élisabeth
  choice: issue des filles d’Aaron
  alternative: descendante d’Aaron
  rationale: Le choix principal maintient l’expression concrète « filles d’Aaron » employée par le grec, sans lui ajouter de précision doctrinale ; une note explicite sa valeur généalogique.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve l’unité de la longue introduction grecque au moyen d’un point-virgule, sans reproduire mécaniquement sa syntaxe.
