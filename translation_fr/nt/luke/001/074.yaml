  variant: modern international French
source:
  edition: SBLGNT
  text: ἀφόβως ἐκ χειρὸς ⸀ἐχθρῶν ῥυσθέντας λατρεύειν αὐτῷ
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/074.yaml
  text: that[a], having been rescued from the hand of our enemies[c][b], we might serve him without fear
translation:
  language: fr
  text: afin que, délivrés de la main de nos ennemis[a], nous le servions[b] sans crainte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « délivrés du pouvoir de nos ennemis ».
    reason: lexical_alternative
  - marker: b
    text: Le verbe grec peut aussi se traduire par « lui rendre un culte »; il désigne ici le service consacré à Dieu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφόβως
  choice: sans crainte
  rationale: Cette locution adverbiale naturelle rend l’idée d’agir sans peur et se rattache ici au service rendu à Dieu.
- source_word: ἐκ χειρός
  choice: de la main de
  rationale: L’expression conserve l’image biblique de la main comme puissance ou emprise, tout en restant claire en français moderne.
- source_word: ἐχθρῶν
  choice: nos ennemis
  rationale: Le grec dit littéralement « ennemis » sans possessif, mais le contexte immédiat désigne les ennemis du peuple auquel Zacharie s’identifie; « nos » explicite naturellement cette référence.
- source_word: ῥυσθέντας
  choice: délivrés
  rationale: Le participe aoriste passif présente la délivrance comme préalable au service rendu à Dieu. « Délivrés » exprime avec dignité le fait d’être arrachés à une puissance hostile.
- source_word: λατρεύειν
  choice: servions
  rationale: Le verbe désigne un service religieux rendu à Dieu et peut inclure l’adoration. « Servir » conserve la portée large de la fidélité et de l’obéissance sans réduire le sens au seul culte.
- source_word: αὐτῷ
  choice: le
  rationale: Le pronom renvoie à Dieu; après « servir », le français emploie naturellement un complément d’objet direct.
theological_decisions:
- issue: Portée de λατρεύειν lorsqu’il a Dieu pour objet
  choice: nous le servions
  alternative: nous lui rendions un culte
  rationale: « Servir » préserve à la fois la dimension cultuelle et celle d’une vie consacrée à Dieu, sans limiter le terme aux actes liturgiques.
- issue: Rattachement syntaxique de ἀφόβως
  choice: sans crainte qualifie « servions »
  alternative: sans crainte qualifie la délivrance
  rationale: La lecture adoptée correspond au rattachement le plus naturel de l’adverbe à l’infinitif λατρεύειν dans la phrase, tout en signalant en note que l’ordre grec permet d’envisager l’autre rattachement.
translation_notes:
  register: Français international moderne, naturel et digne. « De la main de » maintient l’image biblique sans obscurité; la syntaxe avec « afin que » relie ce fragment au but exprimé dans la phrase commencée au verset précédent.
