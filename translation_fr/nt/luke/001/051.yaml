  text: Ἐποίησεν κράτος ἐν βραχίονι αὐτοῦ, διεσκόρπισεν ὑπερηφάνους διανοίᾳ καρδίας αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/051.yaml
  text: He has shown strength with his arm[b][a]; he has scattered the proud in the thoughts of their hearts.
translation:
  language: fr
  text: Il a déployé la force de son bras[a] ; il a dispersé les orgueilleux dans les pensées de leur cœur[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Il a manifesté sa puissance par son bras. » Le grec dit littéralement « il a fait la puissance », expression qui évoque une démonstration de force.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « il a dispersé les orgueilleux à cause des intentions de leur cœur » ou « dans l’imagination de leur cœur ».'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐποίησεν κράτος
  choice: Il a déployé sa puissance
  rationale: L’expression grecque signifie littéralement « il a fait la puissance » et constitue un idiome décrivant une manifestation effective de force. « Déployer sa puissance » est naturel en français et conserve l’idée d’une puissance mise en œuvre.
- source_word: ἐν βραχίονι αὐτοῦ
  choice: par son bras
  rationale: La préposition ἐν peut ici avoir une valeur instrumentale. Cette formulation conserve l’image biblique concrète du bras de Dieu sans la réduire à une simple abstraction.
- source_word: διεσκόρπισεν
  choice: il a dispersé
  rationale: Le verbe désigne l’action de disperser ou d’éparpiller. Le passé composé s’accorde avec la présentation poétique d’une action décisive de Dieu dont la portée demeure actuelle.
- source_word: ὑπερηφάνους
  choice: les orgueilleux
  rationale: L’adjectif substantivé désigne des personnes caractérisées par l’orgueil. « Les orgueilleux » est concis, courant et fidèle.
- source_word: διανοίᾳ καρδίας αὐτῶν
  choice: dans les pensées de leur cœur
  rationale: Cette traduction maintient l’expression biblique dans laquelle le cœur est le siège de la pensée, de l’intention et de la volonté. Elle préserve aussi l’ambiguïté de la valeur de διανοίᾳ, qui peut indiquer la sphère ou le moyen.
theological_decisions:
- issue: Valeur des aoristes dans le Magnificat
  choice: Employer le passé composé (« a déployé », « a dispersé »)
  alternative: Employer le passé simple (« déploya », « dispersa ») ou le présent
  rationale: Les aoristes présentent les actes de Dieu comme décisifs et accomplis, tout en pouvant avoir une portée récapitulative ou prophétique. Le passé composé exprime naturellement en français une action accomplie dont la pertinence demeure, sans trancher entièrement entre ces nuances.
- issue: Rapport entre les orgueilleux et les pensées de leur cœur
  choice: Conserver la formulation « les orgueilleux dans les pensées de leur cœur »
  alternative: 'Expliciter : « ceux dont le cœur nourrit des pensées orgueilleuses » ou comprendre une valeur instrumentale : « à cause des intentions de leur cœur »'
  rationale: La construction grecque permet de comprendre διανοίᾳ comme sphère, disposition intérieure ou moyen. Une formulation proche de la structure source évite de fixer une seule relation interprétative.
translation_notes:
  register: Français international moderne, poétique et digne. Le parallélisme des deux propositions et l’image traditionnelle du bras divin sont conservés. La tournure volontairement biblique « les pensées de leur cœur » reste intelligible tout en maintenant la tension du grec.
