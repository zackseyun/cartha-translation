id: LUK.1.76
reference: Luke 1:76
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ σὺ ⸀δέ, παιδίον, προφήτης Ὑψίστου κληθήσῃ, προπορεύσῃ γὰρ ⸀ἐνώπιον κυρίου ἑτοιμάσαι ὁδοὺς αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/076.yaml
  text: And you also[a], child, will be called a prophet of the Most High, for you will go before the Lord to prepare his ways[b],
translation:
  language: fr
  text: Et toi aussi, petit enfant, tu seras appelé prophète du Très-Haut, car tu iras devant le Seigneur[a] pour préparer ses chemins[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en présence du Seigneur ». L’expression peut désigner le fait d’aller devant quelqu’un ou de se tenir et de servir en sa présence.
    reason: lexical_alternative
  - marker: b
    text: Cette formulation fait écho aux promesses prophétiques concernant la préparation du chemin devant le Seigneur (voir És 40.3 ; Ml 3.1). Dans le récit de Luc, elles s’accomplissent dans le ministère de Jean avant celui de Jésus.
    reason: cross_reference
lexical_decisions:
- source_word: καὶ σὺ δέ
  choice: Et toi aussi
  rationale: La tournure marque une transition en mettant l’interlocuteur en relief; « aussi » conserve la nuance additive dans un français naturel.
- source_word: παιδίον
  choice: petit enfant
  rationale: Le vocatif s’adresse ici à Jean encore nourrisson. « Petit enfant » exprime naturellement cette nuance sans employer le terme plus spécialisé « nourrisson ».
- source_word: προφήτης
  choice: prophète
  rationale: Équivalent français courant et direct du nom grec.
- source_word: Ὑψίστου
  choice: du Très-Haut
  rationale: Titre divin consacré en français, qui conserve le rapport génitif avec « prophète ».
- source_word: κληθήσῃ
  choice: tu seras appelé
  rationale: Le futur passif désigne l’appellation ou la reconnaissance; cette formulation reste proche du grec et idiomatique.
- source_word: προπορεύσῃ
  choice: tu marcheras devant
  rationale: Le verbe signifie aller en avant de quelqu’un. « Marcher devant » convient au rôle de précurseur et garde une tonalité biblique naturelle.
- source_word: ἐνώπιον κυρίου
  choice: devant le Seigneur
  rationale: ἐνώπιον peut exprimer l’antériorité spatiale ou la présence. Dans ce contexte, « devant le Seigneur » préserve les deux possibilités sans les trancher.
- source_word: ἑτοιμάσαι
  choice: pour préparer
  rationale: L’infinitif aoriste exprime ici le but; « pour préparer » le rend clairement en français.
- source_word: ὁδοὺς αὐτοῦ
  choice: ses chemins
  rationale: Le pluriel du grec est conservé. « Chemins » transmet naturellement l’image prophétique sans la réduire au singulier.
theological_decisions:
- issue: Référent du titre « le Seigneur » dans la prophétie sur le précurseur
  choice: Conserver « le Seigneur » sans préciser davantage le référent dans le verset.
  alternative: Comprendre explicitement soit le Seigneur Dieu selon l’arrière-plan d’Ésaïe et de Malachie, soit Jésus selon l’accomplissement narratif chez Luc.
  rationale: La formulation évoque les promesses prophétiques où le chemin est préparé devant le Seigneur, tandis que le récit de Luc présente Jean comme le précurseur de Jésus. Le titre non explicité maintient cette tension théologique authentique.
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve le parallélisme prophétique, le pluriel « chemins » et l’ambiguïté de « devant le Seigneur ».
