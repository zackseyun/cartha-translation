id: LUK.1.66
reference: Luke 1:66
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἔθεντο πάντες οἱ ἀκούσαντες ἐν τῇ καρδίᾳ αὐτῶν, λέγοντες· Τί ἄρα τὸ παιδίον τοῦτο ἔσται; καὶ ⸀γὰρ χεὶρ κυρίου ἦν μετ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/066.yaml
  text: And all who heard it laid it up in their hearts[a], saying[b], “What then will this child become?” For the hand of the Lord was with him.
translation:
  language: fr
  text: 'Tous ceux qui entendirent gardèrent cela dans leur cœur et disaient : « Que deviendra donc cet enfant[a] ? » En effet, la main du Seigneur était avec lui[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Que sera donc cet enfant ? » Le verbe grec signifie simplement « sera », mais, dans ce contexte, la question porte sur l’avenir, l’identité ou le rôle futur de l’enfant.'
    reason: lexical_alternative
  - marker: b
    text: « La main du Seigneur » est une expression biblique qui évoque la puissance agissante, la faveur ou la direction de Dieu.
    reason: cultural_note
lexical_decisions:
- source_word: ἔθεντο ... ἐν τῇ καρδίᾳ αὐτῶν
  choice: gardèrent cela dans leur cœur
  rationale: Cette formulation conserve l’image biblique du cœur comme lieu de la réflexion et de la mémoire, tout en exprimant naturellement l’idée d’accueillir durablement les événements dans son for intérieur.
- source_word: πάντες οἱ ἀκούσαντες
  choice: tous ceux qui en entendirent parler
  rationale: Le participe désigne tous ceux qui apprirent les événements rapportés. « En entendirent parler » explicite naturellement en français l’objet sous-entendu.
- source_word: Τί ἄρα
  choice: Que… donc
  rationale: '« Donc » rend la nuance déductive de ἄρα : la question naît des signes qui viennent de se produire.'
- source_word: τὸ παιδίον τοῦτο
  choice: cet enfant
  rationale: Traduction simple et non surdéterminée de παιδίον, adaptée au contexte.
- source_word: ἔσται
  choice: deviendra
  rationale: Le verbe signifie littéralement « sera », mais la question porte ici sur l’avenir, l’identité ou le rôle futur de l’enfant. « Deviendra » en restitue naturellement la portée contextuelle.
- source_word: λέγοντες
  choice: se disaient
  rationale: Cette tournure française naturelle présente la question comme la réflexion exprimée par ceux qui avaient entendu parler des événements, sans ajouter de contenu.
- source_word: καὶ γὰρ
  choice: En effet
  rationale: La combinaison introduit l’explication de l’étonnement et de la question des gens. « En effet » en rend ici la fonction avec fluidité.
- source_word: χεὶρ κυρίου
  choice: la main du Seigneur
  rationale: Le maintien de la métaphore préserve l’expression biblique et ses résonances, sans la réduire à une seule idée telle que l’aide, la puissance ou la faveur.
- source_word: μετ’ αὐτοῦ
  choice: avec lui
  rationale: La traduction directe conserve la retenue de l’énoncé grec et renvoie naturellement à l’enfant.
theological_decisions:
- issue: Sens de l’expression « la main du Seigneur était avec lui »
  choice: Conserver la métaphore comme affirmation de l’action et de la présence favorables de Dieu, sans les définir plus étroitement.
  alternative: « Le Seigneur l’aidait » ou « la puissance de Dieu reposait sur lui ».
  rationale: Le texte indique l’intervention active de Dieu dans la vie de l’enfant, mais ne précise pas s’il s’agit surtout de protection, de faveur, de direction ou de puissance. La métaphore maintient cette richesse et cette tension.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe est fluide sans effacer les métaphores bibliques du cœur et de la main du Seigneur. Les marqueurs de notes sont placés sur les expressions qu’ils expliquent.
