source:
  edition: SBLGNT
  text: καὶ αἰτήσας πινακίδιον ἔγραψεν λέγων· Ἰωάννης ⸀ἐστὶν ὄνομα αὐτοῦ. καὶ ἐθαύμασαν πάντες.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/063.yaml
  text: And after asking for a writing tablet[a], he wrote, saying, “John is his name.” And they all marveled.
translation:
  language: fr
  text: 'Il demanda une tablette pour écrire et y inscrivit : « Jean est son nom. » Tous furent étonnés.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αἰτήσας
  choice: Il demanda
  rationale: Le participe aoriste exprime une action antérieure à l’écriture. Deux verbes coordonnés donnent en français un récit naturel tout en conservant la succession des actions.
- source_word: πινακίδιον
  choice: une tablette pour écrire
  rationale: Le diminutif désigne une petite tablette ou plaquette destinée à l’écriture. Cette formulation moderne évite de faire penser à un appareil électronique.
- source_word: ἔγραψεν λέγων
  choice: 'y inscrivit :'
  rationale: Puisque les paroles sont écrites et non prononcées, « inscrivit » suivi de deux-points restitue naturellement la fonction introductive de λέγων sans la tournure française maladroite « écrivit en disant ».
- source_word: Ἰωάννης
  choice: Jean
  rationale: Forme française traditionnelle et courante du nom biblique Ἰωάννης.
- source_word: ἐστὶν ὄνομα αὐτοῦ
  choice: est son nom
  rationale: La formulation conserve l’ordre marqué du grec, qui place « Jean » en tête et souligne l’affirmation catégorique du nom déjà donné, sans transformer le présent en futur.
- source_word: ἐθαύμασαν πάντες
  choice: Tous furent étonnés
  rationale: θαυμάζω exprime ici l’étonnement suscité par l’accord de Zacharie avec Élisabeth. « Furent étonnés » est naturel en français moderne et πάντες garde sa portée collective.
theological_decisions:
- issue: Valeur de la déclaration sur le nom
  choice: « Jean est son nom » au présent
  alternative: « Jean sera son nom »
  rationale: Le texte grec emploie explicitement le présent ἐστίν. La traduction ne transforme donc pas la déclaration en attribution future et préserve l’idée d’une affirmation du nom.
translation_notes:
  register: Français moderne, narratif et digne. La syntaxe évite le calque « ayant demandé… écrivit en disant », mais conserve la progression du grec et l’ordre emphatique de la déclaration.
