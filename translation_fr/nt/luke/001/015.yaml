id: LUK.1.15
reference: Luke 1:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἔσται γὰρ μέγας ἐνώπιον ⸀τοῦ κυρίου, καὶ οἶνον καὶ σίκερα οὐ μὴ πίῃ, καὶ πνεύματος ἁγίου πλησθήσεται ἔτι ἐκ κοιλίας μητρὸς αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/015.yaml
  text: For he will be great before the Lord[a], and he will drink neither wine nor strong drink[c][b], and he will be filled with the Holy Spirit even from his mother’s womb.
translation:
  language: fr
  text: Car il sera grand devant le Seigneur ; il ne boira ni vin ni boisson enivrante[a], et il sera rempli de l’Esprit Saint dès le ventre de sa mère[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La négation grecque est très forte : « il ne boira certainement jamais de vin ni de boisson enivrante ». Une « boisson enivrante » désigne ici une boisson alcoolisée autre que le vin.'
    reason: Précision lexicale et culturelle sur οὐ μή et σίκερα.
  - marker: b
    text: 'Ou : « alors qu’il sera encore dans le ventre de sa mère » ; l’expression peut aussi souligner que cela sera vrai dès cette période.'
    reason: La tournure grecque permet plusieurs nuances temporelles proches qu’il convient de ne pas réduire silencieusement.
lexical_decisions:
- source_word: μέγας
  choice: grand
  rationale: « Grand » est l’équivalent direct et naturel, qui conserve l’idée de stature ou d’importance sans en préciser indûment la nature.
- source_word: ἐνώπιον τοῦ κυρίου
  choice: devant le Seigneur
  rationale: Cette formulation concise conserve le sens relationnel de ce qui compte aux yeux du Seigneur, tout en restant idiomatique en français.
- source_word: οἶνον καὶ σίκερα
  choice: vin ni boisson enivrante
  rationale: « Vin » traduit directement οἶνος ; σίκερα désigne une boisson alcoolisée autre que le vin, d’où le choix générique et compréhensible « boisson enivrante ».
- source_word: οὐ μὴ πίῃ
  choice: il ne boira ni… ni…
  rationale: Le futur français rend directement l’annonce prophétique ; la tournure « ni… ni… » exprime nettement l’exclusion des deux catégories. Une note signale la force emphatique de la négation grecque.
- source_word: πνεύματος ἁγίου
  choice: l’Esprit Saint
  rationale: Dans l’usage lucanien, l’expression renvoie à l’Esprit divin ; l’article et les majuscules correspondent à l’usage français courant.
- source_word: πλησθήσεται
  choice: il sera rempli
  rationale: Le futur passif conserve l’idée d’une action reçue, implicitement accomplie par Dieu.
- source_word: ἔτι ἐκ κοιλίας μητρὸς αὐτοῦ
  choice: dès le ventre de sa mère
  rationale: « Dès » exprime le point de départ exceptionnellement précoce indiqué par ἔτι ἐκ, sans trancher plus précisément entre une action prénatale et une condition présente depuis la naissance.
theological_decisions:
- issue: Force de la négation emphatique οὐ μὴ πίῃ dans une annonce prophétique
  choice: 'Annonce au futur : « il ne boira ni vin ni boisson enivrante »'
  alternative: 'Obligation ou interdiction : « il ne devra jamais boire de vin ni de boisson enivrante »'
  rationale: La construction grecque affirme fortement que l’action n’aura pas lieu, mais sa forme est celle d’une annonce. Le texte principal conserve cette forme sans transformer explicitement la déclaration en commandement ; la note rend compte de l’emphase.
- issue: Référent de πνεύματος ἁγίου
  choice: 'Référent divin personnel : « l’Esprit Saint »'
  alternative: « un esprit saint » ou une force impersonnelle
  rationale: Le contexte immédiat et l’usage de Luc soutiennent la référence à l’Esprit de Dieu. La formulation française habituelle l’exprime sans ajouter de précision doctrinale étrangère au verset.
- issue: Moment visé par ἔτι ἐκ κοιλίας μητρὸς αὐτοῦ
  choice: « dès le ventre de sa mère »
  alternative: « alors qu’il sera encore dans le ventre de sa mère »
  rationale: La formulation retenue préserve l’ambiguïté entre le ventre maternel comme point de départ et une action se produisant pendant la grossesse ; la note explicite les deux nuances possibles.
translation_notes:
  register: Français international moderne, digne et accessible. La ponctuation allège la longue coordination grecque. « Boisson enivrante » est plus transparent aujourd’hui que « boisson forte », susceptible d’être compris comme une simple indication de degré alcoolique.
