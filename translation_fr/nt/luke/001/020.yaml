  terminology: « Paroles », « s’accompliront » et « muet » dans la note sont appropriés. La note a conserve utilement la distinction entre le fait d’être silencieux et l’incapacité de parler. La note b préserve correctement la nuance de καιρός comme moment approprié ou fixé, sans expliciter indûment un agent divin.
