reference: Luke 1:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ἔσῃ σιωπῶν καὶ μὴ δυνάμενος λαλῆσαι ἄχρι ἧς ἡμέρας γένηται ταῦτα, ἀνθ’ ὧν οὐκ ἐπίστευσας τοῖς λόγοις μου, οἵτινες πληρωθήσονται εἰς τὸν καιρὸν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/020.yaml
  text: And behold[a], you will be silent and unable to speak until the day these things happen, because you did not believe my words[b], which will be fulfilled in their appointed time.
translation:
  language: fr
  text: 'Et voici : tu seras silencieux et tu ne pourras pas parler[a] jusqu’au jour où ces choses arriveront, parce que tu n’as pas cru à mes paroles, qui s’accompliront au moment fixé pour elles[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec associe « être silencieux » à « ne pas pouvoir parler », ce qui souligne qu’il s’agit d’un silence imposé. On pourrait aussi traduire : « tu seras muet ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « au moment qui leur convient » ou « en leur temps ». Le terme grec désigne le moment approprié ou fixé pour l’accomplissement de ces paroles.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: Et voici
  rationale: Conserve le signal d’attention soudain et solennel de l’annonce angélique, dans une tournure française biblique encore claire et actuelle.
- source_word: ἔσῃ σιωπῶν
  choice: tu resteras silencieux
  rationale: Rend la construction périphrastique comme un état à venir. « Restera silencieux » s’enchaîne naturellement avec la précision suivante, qui montre qu’il ne s’agit pas d’un silence volontaire.
- source_word: μὴ δυνάμενος λαλῆσαι
  choice: tu ne pourras pas parler
  rationale: Exprime directement l’incapacité indiquée par le participe grec et souligne que le silence sera imposé.
- source_word: ἄχρι ἧς ἡμέρας
  choice: jusqu’au jour où
  rationale: Restitue simplement et naturellement la limite temporelle de la condition annoncée.
- source_word: γένηται ταῦτα
  choice: ces choses arriveront
  rationale: Rend γίνομαι dans un français moderne, sans recourir à une formule vieillie comme « s’accompliront ces choses ».
- source_word: ἀνθ’ ὧν
  choice: parce que
  rationale: 'Communique clairement la valeur causale de l’expression dans ce contexte : l’incrédulité de Zacharie motive le signe-jugement annoncé.'
- source_word: οὐκ ἐπίστευσας τοῖς λόγοις μου
  choice: tu n’as pas cru à mes paroles
  rationale: Préserve le sens précis de πιστεύω avec les paroles comme complément, ainsi que la référence explicite aux paroles de l’ange.
- source_word: πληρωθήσονται
  choice: s’accompliront
  rationale: Conserve le passif et le registre de la réalisation certaine de paroles annoncées, sans préciser explicitement l’agent.
- source_word: εἰς τὸν καιρὸν αὐτῶν
  choice: au moment qui leur est fixé
  rationale: καιρός désigne ici le moment approprié ou déterminé. Cette formulation conserve le possessif pluriel et l’idée d’un temps assigné sans nommer l’agent qui l’a fixé.
theological_decisions:
- issue: Nature du silence imposé à Zacharie
  choice: Le texte présente un état de silence accompagné d’une incapacité réelle de parler jusqu’à l’accomplissement de l’annonce.
  alternative: Comprendre le silence comme une simple consigne volontaire de ne pas parler.
  rationale: La combinaison de σιωπῶν et de μὴ δυνάμενος λαλῆσαι exclut un simple choix de garder le silence. La traduction conserve les deux éléments sans développer davantage la nature du signe-jugement.
- issue: Agent de l’accomplissement et du moment fixé
  choice: 'Conserver les formulations passives ou non explicites : « s’accompliront » et « qui leur est fixé ».'
  alternative: 'Expliciter : « que Dieu accomplira au moment qu’il a fixé ».'
  rationale: Le contexte peut naturellement laisser entendre l’action divine, mais le grec de ce verset ne nomme pas directement l’agent. La traduction évite donc de résoudre ce qui demeure grammaticalement implicite.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement correspond à l’adresse directe de l’ange à Zacharie. La formulation conserve la solennité de « Et voici » tout en évitant les tournures archaïques.
