id: LUK.1.3
reference: Luke 1:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἔδοξε κἀμοὶ παρηκολουθηκότι ἄνωθεν πᾶσιν ἀκριβῶς καθεξῆς σοι γράψαι, κράτιστε Θεόφιλε,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/003.yaml
  text: it seemed good to me also[a], having followed all things closely from the beginning, to write them to you in orderly sequence, most excellent Theophilus[b],
translation:
  language: fr
  text: J’ai jugé bon, moi aussi, après avoir suivi tout cela avec précision depuis le début[a], de te l’exposer par écrit dans une suite ordonnée[b], très honorable Théophile,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « après avoir tout examiné avec soin depuis le début ».
    reason: lexical_alternative
  - marker: b
    text: Ou « dans l’ordre » ; l’expression peut désigner une présentation bien organisée plutôt qu’une succession strictement chronologique.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔδοξε
  choice: j’ai jugé bon
  rationale: Cette tournure française naturelle exprime la décision réfléchie portée par l’idiome grec, sans la réduire à une simple impression.
- source_word: κἀμοὶ
  choice: moi aussi
  rationale: L’expression relie explicitement l’auteur aux narrateurs mentionnés auparavant et conserve l’insistance de καί.
- source_word: παρηκολουθηκότι
  choice: après avoir suivi
  rationale: Le verbe peut évoquer le fait de suivre de près, de se renseigner ou d’examiner. « Suivi » maintient cette amplitude, tandis que « avec précision » en fait ressortir le sérieux méthodique.
- source_word: ἄνωθεν
  choice: depuis le début
  rationale: Dans ce contexte historiographique, le sens temporel « depuis l’origine » est nettement préférable au sens spatial « d’en haut ».
- source_word: πᾶσιν
  choice: tout cela
  rationale: Le neutre pluriel renvoie à l’ensemble des faits et traditions évoqués dans le contexte. « Tout cela » est plus idiomatique en français que « toutes choses » sans préciser davantage le référent.
- source_word: ἀκριβῶς
  choice: avec précision
  rationale: Le terme exprime un soin exact et rigoureux. Cette formulation rend clairement cette nuance en français moderne.
- source_word: καθεξῆς
  choice: dans une suite ordonnée
  rationale: La formule indique un enchaînement ou une organisation cohérente sans affirmer nécessairement une chronologie strictement exhaustive.
- source_word: σοι γράψαι
  choice: de te l’exposer par écrit
  rationale: Cette formulation rend le verbe « écrire » avec son destinataire au datif et explicite naturellement en français que le contenu précédent doit être mis par écrit pour Théophile.
- source_word: κράτιστε
  choice: très honorable
  rationale: Il s’agit d’un titre d’adresse respectueux employé dans Luc–Actes pour des personnages de rang élevé. « Très honorable » garde le registre formel sans paraître artificiellement archaïque.
- source_word: Θεόφιλε
  choice: Théophile
  rationale: Il s’agit de la forme française traditionnelle et transparente du nom propre grec Θεόφιλος.
theological_decisions:
- issue: Portée de καθεξῆς quant à l’ordre historique
  choice: dans une suite ordonnée
  alternative: dans l’ordre chronologique
  rationale: Le grec peut désigner une succession ou une présentation bien organisée, mais n’impose pas l’idée moderne d’une chronologie strictement exhaustive. La traduction conserve cette latitude.
translation_notes:
  register: Français international moderne, soutenu mais accessible, adapté au ton formel d’une préface historiographique. La syntaxe conserve la longue période grecque et l’adresse honorifique finale sans calquer lourdement l’ordre des mots.
