id: LUK.1.39
reference: Luke 1:39
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἀναστᾶσα δὲ Μαριὰμ ἐν ταῖς ἡμέραις ταύταις ἐπορεύθη εἰς τὴν ὀρεινὴν μετὰ σπουδῆς εἰς πόλιν Ἰούδα,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/039.yaml
  text: In those days Mary arose and went with haste into the hill country[a], to a town of Judah,
translation:
  language: fr
  text: En ces jours-là, Marie se leva et se rendit en toute hâte dans la région montagneuse, dans une ville de Juda[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans une ville de Judée » ou « dans une localité judéenne ». Le grec πόλις peut désigner une ville ou une localité, et Ἰούδα peut renvoyer à la région de Juda ou de Judée.
    reason: alternative lexicale et géographique
lexical_decisions:
- source_word: Ἀναστᾶσα
  choice: se leva
  rationale: Le participe aoriste de ἀνίστημι exprime ici une action qui accompagne et précède le verbe principal. « Se leva » conserve la progression narrative sans l’interpréter directement comme « partit ».
- source_word: δὲ
  choice: non exprimé séparément
  rationale: δὲ assure une transition narrative légère. En français moderne, l’enchaînement est suffisamment rendu par l’expression temporelle initiale, sans ajouter un « or » ou un « alors » artificiel.
- source_word: ἐν ταῖς ἡμέραις ταύταις
  choice: En ces jours-là
  rationale: Formulation française naturelle qui conserve la valeur temporelle et déictique de l’expression grecque.
- source_word: ἐπορεύθη
  choice: se rendit
  rationale: πορεύομαι signifie ici aller ou voyager. « Se rendit » convient au déplacement vers une destination précise et garde un registre narratif digne.
- source_word: εἰς τὴν ὀρεινὴν
  choice: dans la région montagneuse
  rationale: L’adjectif ὀρεινή est substantivé et désigne la région de montagnes ou de collines. « Région montagneuse » est clair et naturel en français international.
- source_word: μετὰ σπουδῆς
  choice: en toute hâte
  rationale: σπουδή peut exprimer l’empressement, le zèle ou la hâte. Dans ce contexte de déplacement, « en toute hâte » rend bien l’idée de promptitude sans exclure entièrement l’empressement.
- source_word: εἰς πόλιν Ἰούδα
  choice: dans une ville de Juda
  rationale: πόλις peut désigner une ville ou une localité. Ἰούδα est compris ici comme une désignation régionale ou tribale, plutôt que comme le nom d’une personne; la note conserve les autres formulations possibles.
theological_decisions:
- issue: Identification de Ἰούδα
  choice: Juda comme désignation régionale ou tribale
  alternative: Judée comme désignation régionale; ou une ville nommée Juda
  rationale: Dans ce contexte, Ἰούδα désigne le plus naturellement la région associée à Juda. Garder « Juda » reste proche de la forme grecque, tandis que la note signale la possibilité d’une formulation géographique plus explicite.
translation_notes:
  register: Français moderne, clair et digne. La syntaxe suit le mouvement du récit grec tout en évitant un calque lourd. La répétition de « dans » reflète les deux compléments introduits par εἰς et maintient la relation entre la région montagneuse et la ville non nommée.
