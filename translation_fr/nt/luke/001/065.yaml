id: LUK.1.65
reference: Luke 1:65
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἐγένετο ἐπὶ πάντας φόβος τοὺς περιοικοῦντας αὐτούς, καὶ ἐν ὅλῃ τῇ ὀρεινῇ τῆς Ἰουδαίας διελαλεῖτο πάντα τὰ ῥήματα ταῦτα,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/065.yaml
  text: And fear came upon all those living around them[b][a], and throughout all the hill country of Judea all these things were being talked about.
translation:
  language: fr
  text: La crainte[a] s’empara de tous ceux qui habitaient autour d’eux, et, dans toute la région montagneuse de Judée, on parlait de tous ces événements[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ici, la « crainte » peut aussi comporter l’idée d’un profond respect devant l’action manifeste de Dieu.
    reason: lexical_alternative
  - marker: b
    text: Ou « toutes ces paroles » ou « toutes ces choses ». Le terme grec peut désigner aussi bien des paroles que les événements dont on parle.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ἐπὶ πάντας φόβος
  choice: La crainte s’empara de tous
  rationale: Cette tournure française naturelle exprime la survenue de la crainte et conserve la portée de ἐπί sur l’ensemble des personnes concernées.
- source_word: φόβος
  choice: la crainte
  rationale: « Crainte » rend directement φόβος tout en pouvant inclure, dans ce contexte d’action divine manifeste, une nuance de saisissement respectueux.
- source_word: τοὺς περιοικοῦντας αὐτούς
  choice: ceux qui habitaient autour d’eux
  rationale: La formulation suit précisément l’idée de personnes habitant dans les environs, sans réduire nécessairement le groupe aux seuls « voisins » immédiats.
- source_word: ἐν ὅλῃ τῇ ὀρεινῇ τῆς Ἰουδαίας
  choice: dans toute la région montagneuse de Judée
  rationale: « Région montagneuse » désigne naturellement en français la zone de hautes terres évoquée par ἡ ὀρεινή, tandis que « toute » garde la portée géographique de ὅλῃ.
- source_word: διελαλεῖτο
  choice: on parlait
  rationale: L’imparfait rend l’action continue ou répétée, et la construction impersonnelle française traduit naturellement le passif grec indiquant que ces faits circulaient dans les conversations.
- source_word: πάντα τὰ ῥήματα ταῦτα
  choice: tous ces événements
  rationale: Dans ce résumé narratif, ῥήματα peut désigner les faits ou événements dont on parle, et non seulement des paroles. Une note conserve l’autre possibilité lexicale.
theological_decisions:
- issue: Nuance de φόβος face à l’action manifeste de Dieu
  choice: crainte
  alternative: effroi ; crainte respectueuse
  rationale: « Crainte » préserve la force du terme grec sans décider si la réaction relève surtout de la peur ou d’un profond respect religieux; le contexte permet aux deux nuances de demeurer présentes.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase conserve la progression du grec tout en employant des tournures idiomatiques françaises; les notes maintiennent les ambiguïtés de φόβος et de ῥήματα.
