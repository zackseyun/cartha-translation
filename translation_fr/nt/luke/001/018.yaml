id: LUK.1.18
reference: Luke 1:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ εἶπεν Ζαχαρίας πρὸς τὸν ἄγγελον· Κατὰ τί γνώσομαι τοῦτο; ἐγὼ γάρ εἰμι πρεσβύτης καὶ ἡ γυνή μου προβεβηκυῖα ἐν ταῖς ἡμέραις αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/018.yaml
  text: And Zechariah said to the angel[a], “How will I know this? For I am an old man, and my wife is advanced in her days.”
translation:
  language: fr
  text: 'Zacharie dit à l’ange : « Comment saurai-je cela ? Car je suis un vieil homme, et ma femme est avancée en âge. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπεν
  choice: dit
  rationale: Verbe narratif courant introduisant une parole ; « dit » est naturel et fidèle en français.
- source_word: πρὸς τὸν ἄγγελον
  choice: à l’ange
  rationale: Avec un verbe de parole, πρός indique ici le destinataire ; « à l’ange » est la tournure française idiomatique.
- source_word: Κατὰ τί
  choice: Comment
  rationale: L’expression demande sur quelle base ou par quel moyen Zacharie pourra savoir que l’annonce se réalisera ; « Comment » conserve cette portée sans l’expliciter excessivement.
- source_word: γνώσομαι
  choice: saurai-je
  rationale: Le futur de γινώσκω exprime ici le fait de parvenir à savoir ou d’avoir une assurance ; « saurai-je » maintient le futur plutôt que de déplacer la question vers la simple capacité.
- source_word: τοῦτο
  choice: cela
  rationale: Le démonstratif renvoie à l’annonce de l’ange ; « cela » est naturel dans cette question en français.
- source_word: πρεσβύτης
  choice: un vieil homme
  rationale: Le nom désigne un homme âgé, non un titulaire de fonction ; cette traduction directe conserve aussi l’insistance de Zacharie sur son grand âge.
- source_word: γυνή
  choice: ma femme
  rationale: Avec le possessif et dans ce contexte conjugal, γυνή signifie clairement « femme » au sens d’épouse.
- source_word: προβεβηκυῖα ἐν ταῖς ἡμέραις αὐτῆς
  choice: est avancée en âge
  rationale: L’expression grecque signifie littéralement qu’elle est « avancée dans ses jours », idiome désignant le grand âge. « Avancée en âge » en transmet naturellement le sens en français tout en restant proche de l’image source.
theological_decisions:
- issue: Sens de ἄγγελος
  choice: ange
  alternative: messager
  rationale: Bien que ἄγγελος puisse désigner un messager, le contexte immédiat identifie l’interlocuteur comme Gabriel et présente une apparition céleste ; « ange » est donc le sens contextuel sans ajout doctrinal.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe directe conserve la forme de la question et la justification introduite par γάρ (« car »). « Un vieil homme » est volontairement plus formel et biblique que « vieux », sans être archaïque ; « avancée en âge » rend l’idiome grec de manière naturelle.
