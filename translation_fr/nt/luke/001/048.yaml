id: LUK.1.48
reference: Luke 1:48
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὅτι ἐπέβλεψεν ἐπὶ τὴν ταπείνωσιν τῆς δούλης αὐτοῦ, ἰδοὺ γὰρ ἀπὸ τοῦ νῦν μακαριοῦσίν με πᾶσαι αἱ γενεαί·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/048.yaml
  text: because he has looked upon the humble state of his servant[a]. For behold[b], from now on all generations will call me blessed.
translation:
  language: fr
  text: parce qu’il a porté son regard sur l’humble condition de son esclave[a]. Car voici, désormais, toutes les générations me diront bienheureuse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « servante ». Le terme grec désigne une femme esclave.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπέβλεψεν ἐπὶ
  choice: a porté son regard sur
  rationale: Cette tournure exprime l’attention personnelle, ici favorable, que Dieu dirige vers Marie, tout en rendant naturellement l’aoriste dans le contexte présent de sa louange.
- source_word: ταπείνωσιν
  choice: l’humble condition
  rationale: Le nom désigne ici la condition sociale modeste et abaissée de Marie plutôt que la seule vertu intérieure d’humilité; la formulation conserve aussi la possibilité d’une situation d’abaissement.
- source_word: δούλης
  choice: esclave
  rationale: Le terme féminin exprime fortement l’appartenance et la soumission à Dieu. « Esclave » évite d’atténuer cette relation, tandis que « servante » est signalé comme autre traduction possible.
- source_word: ἰδοὺ γὰρ
  choice: Oui
  rationale: Dans ce chant, γάρ introduit l’explication de l’affirmation précédente et ἰδού attire l’attention. « Oui » en restitue naturellement la force emphatique sans l’archaïsme de « voici » dans cet emploi.
- source_word: ἀπὸ τοῦ νῦν
  choice: désormais
  rationale: Ce terme français courant et digne conserve exactement la portée temporelle prospective de l’expression.
- source_word: μακαριοῦσίν με
  choice: me diront bienheureuse
  rationale: Le verbe signifie déclarer ou reconnaître quelqu’un comme bénéficiaire de la faveur divine. Cette formulation conserve l’acte public de proclamation et s’accorde avec le féminin du sujet parlant.
- source_word: πᾶσαι αἱ γενεαί
  choice: toutes les générations
  rationale: La traduction directe désigne la succession entière des générations sans ajouter explicitement « futures », déjà impliqué par « désormais ».
theological_decisions:
- issue: Désignation de Marie par δούλη
  choice: son esclave
  alternative: sa servante
  rationale: Le choix maintient la force de l’appartenance totale à Dieu exprimée par δούλη et le possessif, sans introduire de développement doctrinal marial ultérieur. La variante plus traditionnelle est donnée en note.
- issue: Sens de ταπείνωσις dans le cantique de Marie
  choice: l’humble condition
  alternative: l’abaissement
  rationale: Le texte vise principalement la condition modeste et socialement basse de Marie, sans réduire le mot à une disposition intérieure ni exclure sa nuance d’abaissement.
- issue: Portée de μακαριοῦσίν με
  choice: me diront bienheureuse
  alternative: me déclareront heureuse
  rationale: « Bienheureuse » garde la dimension de faveur divine du terme sans faire de l’énoncé une béatification technique ou une affirmation doctrinale postérieure.
translation_notes:
  register: Français international moderne, digne et poétique, adapté au Magnificat. « Oui » rend l’emphase de ἰδού γὰρ sans recourir à une formule artificielle; « bienheureuse » conserve la tonalité biblique tout en restant intelligible.
