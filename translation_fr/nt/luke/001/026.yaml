id: LUK.1.26
reference: Luke 1:26
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἐν δὲ τῷ μηνὶ τῷ ἕκτῳ ἀπεστάλη ὁ ἄγγελος Γαβριὴλ ⸀ἀπὸ τοῦ θεοῦ εἰς πόλιν τῆς Γαλιλαίας ᾗ ὄνομα Ναζαρὲθ
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/026.yaml
  text: In the sixth month[a], the angel Gabriel was sent from God to a city of Galilee named Nazareth[b],
translation:
  language: fr
  text: Au sixième mois[a], l’ange Gabriel fut envoyé de la part de Dieu dans une ville de Galilée appelée Nazareth[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: C’est-à-dire le sixième mois de la grossesse d’Élisabeth; voir Luc 1.24, 36.
    reason: cross_reference
  - marker: b
    text: Ou «dans une ville située en Galilée, appelée Nazareth».
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν δὲ τῷ μηνὶ τῷ ἕκτῳ
  choice: Au sixième mois
  rationale: La construction ἐν avec le datif exprime ici le moment. δέ est un lien narratif léger qui n’exige pas l’ajout d’un connecteur explicite en français.
- source_word: ἀπεστάλη
  choice: fut envoyé
  rationale: L’aoriste passif de ἀποστέλλω est rendu par un passé simple passif, naturel dans ce récit et fidèle à la forme du grec.
- source_word: ὁ ἄγγελος
  choice: l’ange
  rationale: Dans ce contexte, ἄγγελος désigne clairement un être céleste plutôt qu’un simple messager humain.
- source_word: Γαβριὴλ
  choice: Gabriel
  rationale: Le nom propre est rendu selon sa forme française traditionnelle et courante.
- source_word: ἀπὸ τοῦ θεοῦ
  choice: de la part de Dieu
  rationale: Cette tournure conserve l’idée de provenance ou de mandat exprimée par ἀπό, sans remplacer explicitement celle-ci par la seule idée d’agent.
- source_word: εἰς πόλιν τῆς Γαλιλαίας
  choice: dans une ville de Galilée
  rationale: εἰς indique la destination; en français, «envoyé dans une ville» est idiomatique. Le génitif permet la formulation concise «de Galilée», tandis que «située en Galilée» reste possible.
- source_word: ᾗ ὄνομα Ναζαρὲθ
  choice: appelée Nazareth
  rationale: Cette formulation naturelle restitue la construction relative, littéralement «dont le nom [était] Nazareth», sans lourdeur.
theological_decisions:
- issue: Référent du «sixième mois»
  choice: Conserver simplement «Au sixième mois» dans le texte principal.
  alternative: Préciser «Au sixième mois de la grossesse d’Élisabeth».
  rationale: Le contexte immédiat renvoie à la grossesse d’Élisabeth, mais le verset ne répète pas ce complément. Une note l’explicite sans l’insérer dans le texte.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple convient au registre narratif biblique sans être archaïque; «de la part de Dieu» préserve la nuance de provenance et de mission.
