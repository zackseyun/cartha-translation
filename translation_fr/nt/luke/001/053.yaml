    issue: Temps de « ceux qui avaient faim »
    rationale: Le grec πεινῶντας est un participe présent substantivé. L’imparfait français peut suggérer que leur faim appartenait au passé; « ceux qui ont faim » maintient la caractérisation générale et actuelle du groupe.
  - severity: low
    issue: Explicitation « les mains vides »
    rationale: κενούς signifie « vides »; l’image des mains est idiomatique mais n’est pas exprimée dans le grec. « Sans rien » préserve mieux l’ampleur de l’adjectif.
  - severity: low
    issue: « De biens » pour ἀγαθῶν
    rationale: En français actuel, « biens » évoque aisément des possessions ou des richesses. « Bonnes choses » conserve le sens général de « bonnes choses » sans créer cette coloration matérielle plus étroite.
