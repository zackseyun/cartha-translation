source:
  edition: SBLGNT
  text: πεινῶντας ἐνέπλησεν ἀγαθῶν καὶ πλουτοῦντας ἐξαπέστειλεν κενούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/053.yaml
  text: He has filled the hungry with good things[a], and sent the rich away empty.
translation:
  language: fr
  text: Il a comblé de bonnes choses ceux qui ont faim, et il a renvoyé les riches sans rien.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πεινῶντας
  choice: ceux qui avaient faim
  rationale: Le participe présent substantivé désigne concrètement les personnes qui ont faim. Cette formulation est naturelle en français et n'accentue pas indûment l'intensité comme le ferait « ceux qui mouraient de faim ».
- source_word: ἐνέπλησεν
  choice: a comblé
  rationale: Le verbe signifie remplir pleinement. « A comblé de biens » est une tournure française naturelle qui conserve l'idée d'abondance et convient au style d'actions décisives du Magnificat.
- source_word: ἀγαθῶν
  choice: de biens
  rationale: Le génitif indique ce dont les affamés sont remplis. « De biens » reste général, sans ajouter explicitement l'idée de cadeaux.
- source_word: πλουτοῦντας
  choice: les riches
  rationale: Le participe présent substantivé décrit une catégorie sociale et forme un contraste direct avec ceux qui avaient faim.
- source_word: ἐξαπέστειλεν
  choice: a renvoyé
  rationale: Le composé exprime l'action de faire partir. « Renvoyer » est concis et idiomatique, sans suggérer nécessairement une audience officielle.
- source_word: κενούς
  choice: les mains vides
  rationale: L'adjectif prédicatif décrit l'état dans lequel les riches repartent. En français, « renvoyer les mains vides » exprime naturellement cette idée; l'image des mains est une explicitation idiomatique du sens contextuel.
theological_decisions:
- issue: Renversement social et théologique dans le chant de Marie
  choice: Conserver le contraste concret entre ceux qui ont faim et les riches.
  alternative: Interpréter les premiers comme les personnes spirituellement nécessiteuses et les seconds comme les orgueilleux ou les satisfaits d'eux-mêmes.
  rationale: Le grec emploie des termes sociaux concrets. La traduction préserve donc la tension du renversement divin sans réduire le verset à une lecture exclusivement spirituelle.
translation_notes:
  register: Français moderne, international et digne. Le parallélisme est conservé. L'imparfait « avaient faim » rend naturellement en français l'état décrit par le participe grec au moment de l'action; les passés composés rendent les aoristes dans le mouvement rétrospectif du Magnificat.
