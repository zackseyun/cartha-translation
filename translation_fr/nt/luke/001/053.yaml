review_pass:
  verdict: revise
  source_fidelity: Le contraste concret entre πεινῶντας (« ceux qui ont faim ») et πλουτοῦντας (« les riches ») est bien préservé. Toutefois, l’imparfait « avaient faim » tend à situer la faim dans un état passé, tandis que le participe présent grec caractérise les personnes concernées. « Les mains vides » est une explicitation idiomatique possible, mais ajoute l’image des mains, absente de κενούς (« vides »).
  naturalness: La formulation révisée demeure naturelle en français moderne international et conserve le parallélisme du verset. « Ceux qui ont faim » est plus directement fidèle que « ceux qui avaient faim »; « sans rien » rend naturellement l’état de vide sans ajouter une image corporelle.
  terminology: « De bonnes choses » rend ἀγαθῶν de façon générale, sans réduire le terme à des possessions matérielles (« biens ») ni introduire l’idée de dons. Aucun terme théologique spécialisé ni nom propre ne pose problème.
  issues:
