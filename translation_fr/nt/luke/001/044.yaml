id: LUK.1.44
reference: Luke 1:44
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἰδοὺ γὰρ ὡς ἐγένετο ἡ φωνὴ τοῦ ἀσπασμοῦ σου εἰς τὰ ὦτά μου, ἐσκίρτησεν ⸂ἐν ἀγαλλιάσει τὸ βρέφος⸃ ἐν τῇ κοιλίᾳ μου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/044.yaml
  text: For behold[a], when the sound of your greeting came into my ears, the baby leaped for joy in my womb.
translation:
  language: fr
  text: 'Car voici : lorsque le son de ta salutation est parvenu à mes oreilles, le bébé a tressailli d’allégresse dans mon ventre.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: vois-tu
  rationale: Conserve la fonction vive d’appel à l’attention dans un français moderne et naturel, sans l’archaïsme de « voici » employé absolument.
- source_word: γὰρ
  choice: car
  rationale: Marque le lien explicatif avec la déclaration précédente.
- source_word: ὡς ἐγένετο
  choice: dès que … est parvenu
  rationale: Exprime naturellement la relation temporelle immédiate suggérée par la construction, sans rendre littéralement le verbe générique ἐγένετο.
- source_word: ἡ φωνὴ τοῦ ἀσπασμοῦ σου
  choice: le son de ta salutation
  rationale: Préserve l’accent concret sur ce qui est entendu, tandis que « salutation » convient au registre digne du récit.
- source_word: εἰς τὰ ὦτά μου
  choice: à mes oreilles
  rationale: Expression française idiomatique qui conserve l’idée du son parvenant aux oreilles.
- source_word: ἐσκίρτησεν
  choice: a tressailli
  rationale: Décrit avec naturel le mouvement soudain de l’enfant dans le ventre; « bondir » serait moins idiomatique dans ce contexte prénatal.
- source_word: ἐν ἀγαλλιάσει
  choice: d’allégresse
  rationale: Rend la joie intense et exultante du terme grec avec concision et dignité.
- source_word: τὸ βρέφος
  choice: le bébé
  rationale: Désigne naturellement un très jeune enfant, ici encore dans le ventre, sans ajouter d’affirmation étrangère au texte.
- source_word: ἐν τῇ κοιλίᾳ μου
  choice: dans mon ventre
  rationale: « Ventre » est le sens contextuel naturel de κοιλία et correspond à l’expression française courante pour la grossesse.
theological_decisions:
- issue: Désignation de Jean avant sa naissance par βρέφος
  choice: le bébé
  alternative: l’enfant / le nourrisson
  rationale: « Bébé » conserve la désignation concrète d’un très jeune enfant et s’applique naturellement ici à l’enfant à naître, sans développer une conclusion doctrinale au-delà du texte.
- issue: Rapport entre le mouvement du bébé et l’allégresse
  choice: a tressailli d’allégresse
  alternative: a tressailli avec joie
  rationale: La formulation maintient l’association explicite du mouvement avec ἀγαλλίασις, sans préciser si l’émotion est attribuée subjectivement au bébé ou si l’expression caractérise simplement le mouvement.
translation_notes:
  register: Français international moderne, narratif et digne. Le tutoiement correspond à l’adresse personnelle entre Élisabeth et Marie. La formulation reste concrète et conserve la tension du grec concernant l’allégresse liée au tressaillement.
