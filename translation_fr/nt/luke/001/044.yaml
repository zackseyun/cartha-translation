  naturalness: '« Car, vois-tu » donne à l’adresse un ton conversationnel qui cadre moins bien avec le registre narratif solennel du passage. « Car voici : » restitue de manière naturelle et digne la valeur d’appel à l’attention de ἰδού, sans archaïsme excessif.'
  terminology: « Salutation », « bébé », « allégresse » et « ventre » sont appropriés au français international moderne et ne surinterprètent pas le texte. Aucun enjeu théologique supplémentaire n’est introduit.
