  text: pour faire preuve de miséricorde envers nos pères[a][c] et se souvenir de son alliance sainte[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à nos pères ». Littéralement, le grec emploie « avec nos pères » et décrit la miséricorde exercée en relation avec les pères d’Israël.
    reason: lexical_alternative
  - marker: b
    text: Dans le langage biblique de l’alliance, lorsque Dieu « se souvient », cela implique souvent qu’il agit fidèlement selon une promesse antérieure, et non un simple rappel mental.
    reason: cultural_note
  - marker: c
    text: « Nos pères » désigne les pères ou patriarches d’Israël ; on pourrait aussi traduire « nos ancêtres ».
    reason: alternative_reading
lexical_decisions:
- source_word: ποιῆσαι ἔλεος
  choice: faire miséricorde
  rationale: Cette expression française naturelle et digne rend directement l’idiome grec « faire miséricorde », sans réduire ἔλεος à la seule compassion.
- source_word: μετὰ τῶν πατέρων ἡμῶν
  choice: à nos pères
  rationale: Même si μετά avec le génitif signifie littéralement « avec », la relation exprimée par l’idiome appelle naturellement « faire miséricorde à ». « Pères » conserve la formulation masculine et la résonance patriarcale du grec.
- source_word: μνησθῆναι
  choice: se souvenir
  rationale: Le verbe garde la formulation biblique de la mémoire divine. Dans le langage de l’alliance, ce souvenir implique souvent une action fidèle, mais cette implication n’est pas explicitée dans le texte principal.
- source_word: διαθήκης ἁγίας αὐτοῦ
  choice: de son alliance sainte
  rationale: « Alliance » est le terme approprié dans ce contexte historique et théologique; « sainte » traduit directement ἁγίας, et le possessif conserve αὐτοῦ.
theological_decisions:
- issue: Le souvenir divin comme action liée à l’alliance
  choice: se souvenir de son alliance sainte
  alternative: agir conformément à son alliance sainte
  rationale: Le grec dit littéralement « se souvenir ». La traduction préserve cette expression et sa tension théologique, tandis qu’une note explique que, dans le langage biblique, le souvenir de Dieu comporte souvent une action fidèle.
- issue: Sens de πατέρων ἡμῶν
  choice: nos pères
  alternative: nos ancêtres
  rationale: Le terme grec est masculin et désigne ici les pères d’Israël. « Nos pères » conserve cette forme et sa résonance biblique; la note donne « nos ancêtres » comme formulation explicative possible.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure « faire miséricorde » conserve la résonance biblique sans être obscure. Les marqueurs sont placés immédiatement après les expressions qu’ils éclairent.
