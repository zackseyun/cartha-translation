  text: καὶ ἤγειρεν κέρας σωτηρίας ἡμῖν ⸀ἐν οἴκῳ ⸀Δαυὶδ παιδὸς αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/069.yaml
  text: and has raised up a horn of salvation for us in the house of David his servant,[a]
translation:
  language: fr
  text: et il a suscité pour nous une corne de salut[a] dans la maison de David, son serviteur,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « un puissant Sauveur ». Littéralement : « une corne de salut », image biblique évoquant une puissante délivrance.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤγειρεν
  choice: a suscité
  rationale: L’aoriste célèbre ici l’action salvatrice de Dieu comme accomplie. « A suscité » rend naturellement l’idée que Dieu fait paraître ou établit un libérateur, tout en conservant l’idiome biblique.
- source_word: κέρας σωτηρίας
  choice: une corne de salut
  rationale: Cette expression conserve la métaphore biblique de la corne, symbole de force et de délivrance victorieuse, ainsi que la construction avec le génitif σωτηρίας. Une note en explicite le sens sans aplatir l’image dans le texte.
- source_word: ἡμῖν
  choice: pour nous
  rationale: 'Le datif exprime ici l’avantage ou le bénéfice : Dieu suscite cette puissance salvatrice en faveur de son peuple.'
- source_word: ἐν οἴκῳ Δαυὶδ
  choice: dans la maison de David
  rationale: « Maison » désigne la lignée ou la dynastie de David. L’expression littérale reste intelligible en français et préserve sa portée davidique et intertextuelle.
- source_word: παιδὸς αὐτοῦ
  choice: son serviteur
  rationale: Appliqué à David dans le langage biblique, παῖς désigne son statut de serviteur choisi de Dieu, et non celui d’un enfant.
theological_decisions:
- issue: Conserver la métaphore « corne de salut » ou l’interpréter comme un titre personnel
  choice: Conserver « une corne de salut » dans le texte principal.
  alternative: un puissant Sauveur
  rationale: Le grec emploie une image concrète enracinée dans le langage royal et salvateur de l’Ancien Testament. La conserver maintient les résonances scripturaires et l’ambiguïté entre puissance de délivrance et personne qui l’incarne; la note fournit l’interprétation idiomatique courante.
translation_notes:
  register: Français international moderne, digne et accessible. « A suscité » et « maison de David » conservent le registre biblique sans archaïsme excessif. La virgule finale reflète la continuité syntaxique du cantique.
