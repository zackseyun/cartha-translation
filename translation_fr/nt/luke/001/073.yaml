  text: ὅρκον ὃν ὤμοσεν πρὸς Ἀβραὰμ τὸν πατέρα ἡμῶν, τοῦ δοῦναι ἡμῖν
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/073.yaml
  text: the oath that he swore to Abraham our father[a], to grant to us
translation:
  language: fr
  text: le serment qu’il a fait à Abraham, notre père[a], de nous accorder
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « notre ancêtre ». Le grec dit littéralement « notre père », selon le langage biblique de l’alliance au sujet d’Abraham.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅρκον
  choice: le serment
  rationale: Complément d’objet dans la syntaxe prolongée du verset précédent; l’article défini désigne le serment précis fait à Abraham.
- source_word: ὃν ὤμοσεν
  choice: qu’il a prêté
  rationale: En français, « prêter serment » est l’expression idiomatique naturelle; le passé composé rend clairement l’action passée de l’aoriste dans ce contexte poétique.
- source_word: πρὸς Ἀβραὰμ
  choice: à Abraham
  rationale: Avec le verbe de serment, πρός désigne ici la personne envers qui le serment est prononcé.
- source_word: τὸν πατέρα ἡμῶν
  choice: notre père
  rationale: Conserve l’expression familiale et fédératrice du grec ainsi que sa résonance biblique liée à Abraham; « notre ancêtre » reste une possibilité explicative.
- source_word: τοῦ δοῦναι ἡμῖν
  choice: de nous accorder
  rationale: L’infinitif articulaire explicite le contenu ou la visée du serment, dont la suite apparaît au verset suivant. « Accorder » convient au registre solennel sans ajouter de contenu.
theological_decisions:
- issue: Langage de l’alliance lié à Abraham
  choice: notre père
  alternative: notre ancêtre
  rationale: « Notre père » préserve l’idiome biblique et la voix collective de la prophétie de Zacharie, sans transformer la filiation d’alliance en simple indication généalogique.
- issue: Rapport de l’infinitif τοῦ δοῦναι au serment
  choice: de nous accorder
  alternative: afin de nous accorder
  rationale: La formulation retenue laisse ouverte la nuance de contenu, de visée ou de résultat portée par l’infinitif grec, au lieu de la réduire explicitement à la seule finalité.
translation_notes:
  register: Français international moderne, digne et naturel. Le fragment conserve sa dépendance syntaxique envers le verset précédent et reste ouvert sur le verset suivant.
