id: LUK.1.2
reference: Luke 1:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καθὼς παρέδοσαν ἡμῖν οἱ ἀπ’ ἀρχῆς αὐτόπται καὶ ὑπηρέται γενόμενοι τοῦ λόγου,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/002.yaml
  text: just as those who from the beginning were eyewitnesses and became servants of the word handed them down to us,[a]
translation:
  language: fr
  text: comme nous les ont transmis ceux qui, dès le commencement, ont été témoins oculaires et sont devenus serviteurs de la parole[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «du message». Le grec λόγος peut signifier «parole», «message» ou «récit»; ici, il désigne probablement le message proclamé au sujet de Jésus.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς
  choice: comme
  rationale: Introduit naturellement en français la correspondance avec ce qui précède, sans alourdir la phrase.
- source_word: παρέδοσαν
  choice: ont transmis
  rationale: Exprime la communication fidèle d’informations ou d’une tradition reçue; «transmettre» convient mieux ici que le littéral mais ambigu «livrer».
- source_word: ἡμῖν
  choice: nous
  rationale: Rend le datif destinataire dans la construction française naturelle «nous ont transmis».
- source_word: οἱ ἀπ’ ἀρχῆς
  choice: ceux qui, dès le commencement
  rationale: Conserve l’identification du groupe et la portée temporelle de l’expression grecque.
- source_word: αὐτόπται
  choice: témoins oculaires
  rationale: Rend précisément l’idée de personnes ayant vu elles-mêmes les faits rapportés.
- source_word: ὑπηρέται
  choice: serviteurs
  rationale: Exprime le service rendu à la parole sans suggérer indûment une fonction ecclésiastique officielle.
- source_word: γενόμενοι
  choice: sont devenus
  rationale: Préserve la valeur dynamique du participe grec, plutôt que de la réduire au simple état exprimé par «étaient».
- source_word: τοῦ λόγου
  choice: de la parole
  rationale: Conserve l’étendue sémantique de λόγος et sa formulation traditionnelle, tout en signalant en note le sens contextuel probable de message proclamé.
theological_decisions:
- issue: Référent de τοῦ λόγου
  choice: la parole
  alternative: le message; le récit
  rationale: Dans ce contexte, l’expression désigne vraisemblablement le message proclamé au sujet de Jésus plutôt que le Logos comme titre christologique. La traduction principale garde toutefois l’ambiguïté lexicale du grec.
- issue: Portée et valeur de γενόμενοι
  choice: ont été témoins oculaires et sont devenus serviteurs
  alternative: furent dès le commencement témoins oculaires et serviteurs
  rationale: Cette formulation laisse entendre une progression de témoins directs à serviteurs de la parole et rend explicitement la valeur de «devenir», sans transformer «serviteurs» en titre institutionnel.
translation_notes:
  register: Français international moderne, digne et accessible. «Dès le commencement» maintient le lien temporel avec le début des événements, tandis que «témoins oculaires» conserve la précision historique. La minuscule à «parole» évite d’imposer une lecture christologique comme titre personnel.
