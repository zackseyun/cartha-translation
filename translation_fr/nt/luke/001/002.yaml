  source_fidelity: 'Le texte rend fidèlement la structure essentielle de καθὼς παρέδοσαν ἡμῖν : « comme nous les ont transmis ». « Ceux qui, dès le commencement » représente correctement οἱ ἀπ’ ἀρχῆς, « témoins oculaires » αὐτόπται, et « sont devenus serviteurs de la parole » conserve explicitement la nuance dynamique de γενόμενοι sans lui attribuer un sens institutionnel. Le pronom « les » dépend naturellement des faits/récits évoqués au verset précédent et correspond à l’objet implicite de παρέδοσαν.'
