id: LUK.1.79
reference: Luke 1:79
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐπιφᾶναι τοῖς ἐν σκότει καὶ σκιᾷ θανάτου καθημένοις, τοῦ κατευθῦναι τοὺς πόδας ἡμῶν εἰς ὁδὸν εἰρήνης.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/079.yaml
  text: to shine on those sitting in darkness and the shadow of death[a], to guide our feet into the way of peace.
translation:
  language: fr
  text: pour éclairer ceux qui sont assis dans les ténèbres et dans l’ombre de la mort[a], pour guider nos pas sur le chemin de la paix.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’ombre mortelle »; certains comprennent l’expression plus largement au sens de « profondes ténèbres », mais le grec mentionne explicitement la mort.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιφᾶναι
  choice: éclairer
  rationale: L’infinitif exprime ici le but ou le résultat de la venue annoncée. « Éclairer » conserve l’image d’une lumière qui atteint ceux qui sont dans les ténèbres et s’emploie naturellement avec un complément de personne.
- source_word: τοῖς ἐν σκότει ... καθημένοις
  choice: ceux qui sont assis dans les ténèbres
  rationale: Cette formulation garde le sens concret de καθημένοις et la force poétique de l’image, sans l’aplanir en « ceux qui vivent ».
- source_word: σκότει
  choice: les ténèbres
  rationale: Rendu français courant dans le registre biblique et poétique; il préserve sans l’expliciter la portée littérale et métaphorique du grec.
- source_word: σκιᾷ θανάτου
  choice: l’ombre de la mort
  rationale: Ce choix maintient la mention explicite de la mort, l’image du texte grec et son écho aux formulations bibliques antérieures.
- source_word: τοῦ κατευθῦναι
  choice: pour guider
  rationale: L’infinitif articulé indique le but. « Guider » rend naturellement l’idée de donner une direction aux pas, sans surtraduire par « rendre droit ».
- source_word: τοὺς πόδας ἡμῶν
  choice: nos pas
  rationale: En français, « guider nos pas » est plus idiomatique que « guider nos pieds » tout en conservant l’image corporelle de la marche.
- source_word: εἰς ὁδὸν εἰρήνης
  choice: sur le chemin de la paix
  rationale: « Chemin » conserve la métaphore de ὁδός. La préposition « sur » est idiomatique en français avec « guider les pas » et rend le mouvement vers la voie évoquée.
theological_decisions:
- issue: Rendu métaphorique des ténèbres, de la mort, des pas et du chemin
  choice: Conserver les images sans les expliquer dans le corps du texte.
  alternative: Expliciter les ténèbres comme ignorance spirituelle, la mort comme danger, ou le chemin comme conduite qui procure la paix.
  rationale: Le verset est poétique et allusif. Une explicitation imposerait une interprétation unique et réduirait la tension théologique des images.
translation_notes:
  register: Français international moderne, digne et accessible. Le balancement des deux infinitifs est rendu par la répétition de « pour ». « Nos pas » privilégie l’idiome français tout en préservant l’image de la marche.
