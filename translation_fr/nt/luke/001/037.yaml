id: LUK.1.37
reference: Luke 1:37
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὅτι οὐκ ἀδυνατήσει παρὰ ⸂τοῦ θεοῦ⸃ πᾶν ῥῆμα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/037.yaml
  text: For no word from God will be impossible[a].
translation:
  language: fr
  text: Car aucune parole venant de Dieu ne sera impossible[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Car rien ne sera impossible à Dieu. »'
    reason: Lecture alternative grammaticalement possible de παρὰ τοῦ θεοῦ πᾶν ῥῆμα.
lexical_decisions:
- source_word: ὅτι
  choice: Car
  rationale: La proposition explique et fonde l’affirmation précédente de Gabriel; « car » restitue naturellement cette valeur explicative en français.
- source_word: οὐκ ἀδυνατήσει
  choice: ne sera impossible
  rationale: Le futur de ἀδυνατέω exprime ici l’impossibilité. Cette formulation est idiomatique et conserve la portée future du grec.
- source_word: παρὰ τοῦ θεοῦ
  choice: venant de Dieu
  rationale: Avec le génitif, παρά peut marquer la provenance. Associé à ῥῆμα, « venant de Dieu » présente la parole comme ayant Dieu pour source, sans exclure l’autre compréhension traditionnelle.
- source_word: πᾶν
  choice: aucune
  rationale: Dans cette phrase négative, « aucune » exprime naturellement en français la portée universelle de πᾶν sans produire une tournure ambiguë comme « toute parole ne sera pas impossible ».
- source_word: ῥῆμα
  choice: parole
  rationale: « Parole » conserve la référence explicite à ce qui est dit et convient au contexte de l’annonce divine. « Chose » effacerait ce lien, tandis que « promesse » serait plus interprétatif.
theological_decisions:
- issue: Sens de παρὰ τοῦ θεοῦ πᾶν ῥῆμα
  choice: Aucune parole venant de Dieu ne sera impossible.
  alternative: Rien ne sera impossible à Dieu.
  rationale: Les deux compréhensions sont grammaticalement défendables. Le texte principal conserve toutefois ῥῆμα, « parole », et la provenance que peut exprimer παρά avec le génitif; la note maintient la lecture traditionnelle centrée sur la puissance de Dieu.
translation_notes:
  register: Français international moderne, naturel et digne. « Car » convient au registre biblique courant sans être archaïque; « venant de Dieu » est plus fluide que « de la part de Dieu » dans cette structure.
