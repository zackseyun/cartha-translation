  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ πολλοὺς τῶν υἱῶν Ἰσραὴλ ἐπιστρέψει ἐπὶ κύριον τὸν θεὸν αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/016.yaml
  text: And he will turn many of the sons of Israel to the Lord their God[a].
translation:
  language: fr
  text: Il ramènera beaucoup de fils d’Israël au Seigneur, leur Dieu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « enfants d’Israël » ou « Israélites ». Le grec dit littéralement « fils d’Israël », une expression traditionnelle liée à l’alliance.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Il
  rationale: En français, la coordination avec le contexte précédent peut être rendue sans « et » en tête de phrase afin d’éviter une tournure lourde; la continuité narrative demeure claire.
- source_word: πολλοὺς
  choice: beaucoup
  rationale: L’adjectif substantivé est naturellement rendu par « beaucoup » devant le complément partitif « de fils d’Israël ».
- source_word: τῶν υἱῶν Ἰσραὴλ
  choice: de fils d’Israël
  rationale: Cette formulation conserve l’expression grecque traditionnelle et sa résonance biblique, tout en restant compréhensible en français moderne.
- source_word: ἐπιστρέψει
  choice: ramènera
  rationale: 'Le futur actif a ici un emploi transitif et causatif : Jean amènera de nombreuses personnes à revenir vers Dieu. « Ramènera » exprime naturellement ce retour sans recourir au terme plus interprétatif « convertira ».'
- source_word: ἐπὶ
  choice: au
  rationale: Avec ἐπιστρέφω et l’accusatif, la préposition indique la personne vers laquelle on se tourne ou revient; « ramener à » est l’équivalent français idiomatique.
- source_word: κύριον
  choice: Seigneur
  rationale: Dans ce contexte, κύριος désigne le Dieu d’Israël et porte une valeur divine et covenantale, non le simple sens de « maître ».
- source_word: τὸν θεὸν αὐτῶν
  choice: leur Dieu
  rationale: L’expression est en apposition à « Seigneur »; « le Seigneur, leur Dieu » en conserve clairement la structure et la portée d’alliance.
theological_decisions:
- issue: Traduction de l’expression d’alliance τῶν υἱῶν Ἰσραὴλ
  choice: fils d’Israël
  alternative: enfants d’Israël; Israélites
  rationale: Le grec porte explicitement « fils d’Israël », expression biblique traditionnelle qui évoque l’identité collective du peuple de l’alliance. Les formulations plus inclusives ou idiomatiques restent possibles et sont signalées en note.
- issue: Référent de κύριον τὸν θεὸν αὐτῶν
  choice: le Seigneur, leur Dieu
  alternative: leur maître, leur Dieu
  rationale: L’apposition identifie clairement κύριος au Dieu d’Israël; « Seigneur » préserve cette portée théologique sans réduire le terme à un titre humain.
- issue: Portée de ἐπιστρέψει
  choice: ramènera
  alternative: tournera; convertira
  rationale: Le verbe présente Jean comme l’agent par lequel beaucoup reviennent vers Dieu. « Ramènera » garde la force causative et l’idée de retour, tout en évitant de préciser indûment le mécanisme de la conversion.
translation_notes:
  register: Français international moderne, digne et accessible. « Ramènera » est plus naturel que le calque « tournera » et conserve l’idée de retour impliquée par ἐπιστρέφω. L’expression « fils d’Israël » maintient volontairement le registre biblique, avec des équivalents idiomatiques proposés en note.
