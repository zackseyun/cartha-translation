id: LUK.1.41
reference: Luke 1:41
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἐγένετο ὡς ἤκουσεν ⸂τὸν ἀσπασμὸν τῆς Μαρίας ἡ Ἐλισάβετ⸃, ἐσκίρτησεν τὸ βρέφος ἐν τῇ κοιλίᾳ αὐτῆς, καὶ ἐπλήσθη πνεύματος ἁγίου ἡ Ἐλισάβετ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/041.yaml
  text: And it happened that[a], when Elizabeth heard Mary’s greeting, the baby leaped in her womb, and Elizabeth was filled with the Holy Spirit,
translation:
  language: fr
  text: Or, lorsque Élisabeth entendit la salutation de Marie, l’enfant bondit dans son ventre, et Élisabeth fut remplie de l’Esprit Saint.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ ἐγένετο ὡς
  choice: Or, lorsque
  rationale: La formule narrative introduit ici l’événement qui suit. « Or, lorsque » en restitue naturellement la fonction et la relation temporelle, sans recourir à l’archaïsme « il advint que ».
- source_word: ἀσπασμός
  choice: salutation
  rationale: Le nom désigne les paroles par lesquelles Marie salue Élisabeth. « Salutation » est clair, naturel et adapté au registre du récit.
- source_word: ἐσκίρτησεν
  choice: bondit
  rationale: Le verbe exprime un mouvement soudain et vif. « Bondit » en conserve la force, contrairement à « remua », qui serait plus faible.
- source_word: βρέφος
  choice: l’enfant
  rationale: Le terme désigne ici Jean avant sa naissance. En français narratif, « l’enfant » est naturel et digne dans ce contexte, tandis que « le bébé » serait plus familier.
- source_word: κοιλία
  choice: ventre
  rationale: Dans ce contexte de grossesse, le mot désigne le ventre maternel. Cette formulation est courante et immédiatement compréhensible en français moderne.
- source_word: ἐπλήσθη
  choice: fut remplie
  rationale: Le passé simple convient au récit et conserve la forme passive grecque, sans expliciter davantage l’agent de l’action.
- source_word: πνεύματος ἁγίου
  choice: de l’Esprit saint
  rationale: Dans Luc-Actes, l’expression renvoie régulièrement à l’Esprit divin. L’article est requis par l’usage français naturel avec ce référent personnel.
theological_decisions:
- issue: Référent de πνεύματος ἁγίου
  choice: l’Esprit saint, c’est-à-dire l’Esprit divin
  alternative: un esprit saint
  rationale: Le contexte lucanien de parole inspirée et l’usage récurrent de l’expression dans Luc-Actes indiquent l’Esprit de Dieu. La traduction ne précise pas davantage la manière dont Élisabeth est remplie.
- issue: Désignation de Jean avant sa naissance par βρέφος
  choice: l’enfant
  alternative: le bébé
  rationale: « L’enfant » rend correctement le très jeune être humain dont parle le texte et demeure idiomatique en français dans le contexte du ventre maternel, sans ajouter de commentaire théologique.
translation_notes:
  register: Français international moderne, narratif et digne. Le tour « Or, lorsque » restitue avec concision la formule lucanienne; « bondit » maintient l’image vive du grec.
