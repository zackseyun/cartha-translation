id: LUK.1.38
reference: Luke 1:38
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἶπεν δὲ Μαριάμ· Ἰδοὺ ἡ δούλη κυρίου· γένοιτό μοι κατὰ τὸ ῥῆμά σου. καὶ ἀπῆλθεν ἀπ’ αὐτῆς ὁ ἄγγελος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/038.yaml
  text: And Mary said[a], “Behold, I am the Lord’s servant[b]. May it happen to me according to your word.” And the angel departed from her.
translation:
  language: fr
  text: 'Marie dit : « Voici la servante du Seigneur[a]. Que cela m’arrive selon ta parole[b]. » Et l’ange la quitta.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « esclave du Seigneur ». Le grec δούλη peut désigner une esclave ou une servante ; ici, « servante » met en avant l’humble soumission de Marie à Dieu.'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « Qu’il me soit fait selon ta parole. »'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Et
  rationale: Connecteur narratif léger, qui poursuit le récit sans imposer une nuance temporelle plus précise.
- source_word: Ἰδοὺ ἡ δούλη κυρίου
  choice: Me voici, servante du Seigneur
  rationale: « Me voici » rend naturellement en français la présentation solennelle introduite par ἰδού, tandis que « servante du Seigneur » conserve l’humilité et la soumission exprimées par Marie.
- source_word: δούλη
  choice: servante
  rationale: Le terme féminin peut désigner une esclave ou une servante. Ici, « servante » exprime clairement la disponibilité humble de Marie envers Dieu; la nuance sociale plus forte est signalée en note.
- source_word: κυρίου
  choice: du Seigneur
  rationale: Rend le titre divin κύριος selon son emploi dans le contexte et exprime directement l’appartenance ou la relation de service.
- source_word: γένοιτό μοι
  choice: Que cela m’arrive
  rationale: L’optatif aoriste exprime ici un souhait qui manifeste l’assentiment. « Que cela m’arrive » est naturel en français et renvoie à l’annonce qui vient d’être faite.
- source_word: κατὰ τὸ ῥῆμά σου
  choice: selon ta parole
  rationale: Conserve l’idée de conformité à la déclaration de l’ange. « Parole » reste précis, digne et intelligible dans ce contexte.
- source_word: ἀπῆλθεν ἀπ’ αὐτῆς
  choice: la quitta
  rationale: Formulation française concise et naturelle pour indiquer que l’ange s’éloigne de Marie, sans ajouter de détail spatial.
- source_word: ὁ ἄγγελος
  choice: l’ange
  rationale: Dans ce récit, le mot désigne clairement un être angélique et non un simple messager humain.
theological_decisions:
- issue: Désignation de Marie par δούλη
  choice: servante du Seigneur
  alternative: esclave du Seigneur
  rationale: Le grec comporte la notion de dépendance propre à l’esclavage, mais le contexte met surtout en avant l’humble soumission de Marie à la volonté de Dieu. La note préserve la force possible du terme sans la réduire silencieusement.
- issue: Valeur de l’optatif γένοιτό μοι
  choice: Que cela m’arrive selon ta parole
  alternative: Qu’il me soit fait selon ta parole
  rationale: La formulation retenue exprime un assentiment volontaire sous forme de souhait, plutôt qu’une simple prédiction. L’alternative, plus traditionnelle et plus passive en français, est conservée en note.
translation_notes:
  register: Français international moderne, naturel et digne. « Me voici » conserve la solennité de ἰδού sans l’archaïsme de « voici que », et le tutoiement correspond au singulier σου dans l’adresse à l’ange.
