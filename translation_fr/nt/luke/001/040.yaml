  text: καὶ εἰσῆλθεν εἰς τὸν οἶκον Ζαχαρίου καὶ ἠσπάσατο τὴν Ἐλισάβετ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/040.yaml
  text: and entered the house of Zechariah and greeted Elizabeth[a][b].
translation:
  language: fr
  text: Elle entra dans la maison de Zacharie et salua Élisabeth.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰσῆλθεν
  choice: entra
  rationale: L’aoriste de εἰσέρχομαι exprime simplement l’entrée dans un lieu. « Entra » est direct, naturel et fidèle au déroulement narratif.
- source_word: οἶκον
  choice: maison
  rationale: Avec εἰς, οἶκος désigne ici le lieu physique où elle entre. « Maison » correspond au sens premier sans introduire la nuance affective de « chez-soi ».
- source_word: Ζαχαρίου
  choice: Zacharie
  rationale: « Zacharie » est la forme française traditionnelle et courante de ce nom biblique.
- source_word: ἠσπάσατο
  choice: salua
  rationale: ἀσπάζομαι désigne l’action d’adresser une salutation. « Salua » est idiomatique et n’ajoute ni accueil particulier ni cérémonial absent du grec.
- source_word: Ἐλισάβετ
  choice: Élisabeth
  rationale: « Élisabeth » est la forme française courante du nom.
- source_word: καὶ
  choice: et
  rationale: La seconde occurrence de καί coordonne les deux actions successives et se rend naturellement par « et ». La première relie ce verset au contexte précédent; en français, elle peut être omise au début d’une phrase autonome pour une narration plus naturelle.
theological_decisions: []
translation_notes:
  register: Français moderne, simple et digne. Le pronom « Elle » explicite le sujet sous-entendu par le verbe grec à partir du contexte immédiat (Marie), comme l’exige naturellement le français. La coordination demeure sobre et narrative.
