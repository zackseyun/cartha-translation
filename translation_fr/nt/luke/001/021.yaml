id: LUK.1.21
reference: Luke 1:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ ἦν ὁ λαὸς προσδοκῶν τὸν Ζαχαρίαν, καὶ ἐθαύμαζον ἐν τῷ χρονίζειν ⸂ἐν τῷ ναῷ αὐτόν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/021.yaml
  text: And the people were waiting for Zechariah[a], and they were marveling at his delay in the temple.
translation:
  language: fr
  text: Le peuple attendait Zacharie et s’étonnait qu’il reste si longtemps dans le sanctuaire.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ λαὸς
  choice: le peuple
  rationale: Le collectif désigne les personnes rassemblées au-dehors; « le peuple » est naturel et conserve la formulation grecque.
- source_word: προσδοκῶν
  choice: attendait
  rationale: Avec ἦν, le participe forme une construction périphrastique à l’imparfait exprimant une attente qui se prolonge.
- source_word: Ζαχαρίαν
  choice: Zacharie
  rationale: Forme française traditionnelle et courante du nom biblique.
- source_word: ἐθαύμαζον
  choice: s’étonnait
  rationale: L’imparfait marque une réaction continue; « s’étonnait » rend l’étonnement sans amplifier indûment le sens.
- source_word: ἐν τῷ χρονίζειν
  choice: qu’il reste si longtemps
  rationale: Cette tournure idiomatique exprime clairement la durée inhabituelle qui provoque l’étonnement, tout en respectant la valeur circonstancielle de l’infinitif articulé.
- source_word: ἐν τῷ ναῷ
  choice: dans le sanctuaire
  rationale: ναός désigne ici le bâtiment sacré proprement dit, où Zacharie accomplissait son service, plutôt que l’ensemble des cours du Temple.
- source_word: αὐτόν
  choice: il
  rationale: Le pronom à l’accusatif est le sujet logique de l’infinitif χρονίζειν; la proposition française exige le nominatif « il ».
theological_decisions: []
translation_notes:
  register: Français international moderne, simple et digne. « Sanctuaire » maintient la distinction contextuelle entre le ναός et l’ensemble plus vaste du Temple; la phrase évite ainsi une note lexicale devenue inutile.
