  to: à cause de la tendre miséricorde de notre Dieu, grâce à laquelle l’aurore qui vient d’en haut nous visitera[a],
  rationale: La révision rétablit « miséricorde » pour rendre ἔλεος tout en gardant la nuance affective de σπλάγχνα par « tendre ». Elle clarifie légèrement la syntaxe de l’image céleste. La note conserve l’alternative liée à ἀνατολή et l’écho possible au « Germe », sans trancher cette résonance dans le texte principal.
