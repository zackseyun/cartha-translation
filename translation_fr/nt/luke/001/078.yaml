reference: Luke 1:78
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: διὰ σπλάγχνα ἐλέους θεοῦ ἡμῶν, ἐν οἷς ⸀ἐπισκέψεται ἡμᾶς ἀνατολὴ ἐξ ὕψους,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/078.yaml
  text: because of the tender mercy of our God[a], by which the sunrise from on high will visit us,
translation:
  language: fr
  text: à cause de la tendre miséricorde de notre Dieu, grâce à laquelle l’aurore qui vient d’en haut nous visitera[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le levant » ; le mot grec peut aussi faire écho au titre messianique « le Germe » dans l’Ancien Testament grec.
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ
  choice: à cause de
  rationale: Avec l’accusatif, διά exprime ici la cause ou le fondement; « à cause de » en conserve clairement la valeur.
- source_word: σπλάγχνα ἐλέους
  choice: la profonde compassion
  rationale: L’expression désigne littéralement les entrailles de la miséricorde, idiome sémitique et grec biblique évoquant une compassion profondément ressentie. Cette formulation naturelle en français en garde l’intensité sans littéralisme anatomique.
- source_word: θεοῦ ἡμῶν
  choice: de notre Dieu
  rationale: Rend directement le génitif possessif dans l’ordre naturel du français.
- source_word: ἐν οἷς
  choice: par laquelle
  rationale: Le relatif renvoie à la compassion exprimée par le groupe idiomatique précédent et présente celle-ci comme le moyen ou le cadre de la visitation divine.
- source_word: ἐπισκέψεται
  choice: nous visitera
  rationale: Le futur « visitera » préserve le sens lexical et la valeur biblique d’une intervention divine bienveillante, sans expliciter à l’excès cette dernière.
- source_word: ἀνατολὴ
  choice: l’aurore
  rationale: Dans le contexte immédiat de la lumière qui éclaire ceux qui sont dans les ténèbres, le sens d’aurore ou de lever est premier. « L’aurore » est naturel, poétique sans archaïsme, et laisse subsister la portée métaphorique.
- source_word: ἐξ ὕψους
  choice: venue d’en haut
  rationale: « D’en haut » reste proche du grec et évoque le domaine céleste sans le remplacer explicitement par « du ciel »; « venue » permet une syntaxe française fluide avec « l’aurore ».
theological_decisions:
- issue: Sens messianique de ἀνατολή
  choice: « l’aurore » dans le texte principal
  alternative: « le Germe » ou « celui qui se lève »
  rationale: La lumière du verset suivant favorise l’image de l’aurore. Toutefois, l’emploi de ἀνατολή dans la Septante peut faire écho au titre messianique « Germe »; la note conserve cette résonance sans l’imposer au texte principal.
translation_notes:
  register: Français international moderne, digne et accessible. La métaphore lumineuse et le verbe biblique « visiter » sont conservés; la tournure littérale « entrailles de miséricorde » est rendue idiomatiquement.
