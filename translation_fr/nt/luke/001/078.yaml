    text: Ou « le levant » ; le mot grec peut aussi faire écho au titre messianique « le Germe » dans l’Ancien Testament grec.
    reason: alternative_reading
  revision_rationale: La révision rétablit « miséricorde » pour rendre ἔλεος tout en gardant la nuance affective de σπλάγχνα par « tendre ». Elle clarifie légèrement la syntaxe de l’image céleste. La note conserve l’alternative liée à ἀνατολή et l’écho possible au « Germe », sans trancher cette résonance dans le texte principal.
