id: LUK.1.49
reference: Luke 1:49
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὅτι ἐποίησέν μοι ⸀μεγάλα ὁ δυνατός, καὶ ἅγιον τὸ ὄνομα αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/049.yaml
  text: because the Mighty One has done great things for me[a], and holy is his name.
translation:
  language: fr
  text: car le Tout-Puissant a fait pour moi de grandes choses, et son nom est saint[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « et saint est son nom ». En grec, « saint » précède « son nom » et reçoit ainsi une mise en relief.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: car
  rationale: Introduit la raison de la louange exprimée au verset précédent; « car » conserve clairement la valeur causale dans un registre poétique digne.
- source_word: ἐποίησέν
  choice: a fait
  rationale: Le passé composé exprime naturellement en français une action accomplie dont les effets demeurent présents.
- source_word: μοι
  choice: pour moi
  rationale: 'Le datif a ici une valeur bénéficiaire: l''action de Dieu s''exerce en faveur de Marie.'
- source_word: μεγάλα
  choice: de grandes choses
  rationale: L'adjectif neutre pluriel est substantivé; cette tournure naturelle reste assez large pour désigner les actes remarquables de Dieu sans les préciser davantage.
- source_word: ὁ δυνατός
  choice: le Tout-Puissant
  rationale: L'adjectif substantivé avec article fonctionne comme une désignation divine. « Le Tout-Puissant » est une appellation française consacrée et intelligible, exprimant la puissance sans alourdir la phrase.
- source_word: ἅγιον
  choice: saint
  rationale: Terme biblique courant qui rend la sainteté et la mise à part propres à Dieu.
- source_word: τὸ ὄνομα αὐτοῦ
  choice: son nom
  rationale: Rend directement l'expression grecque et conserve la portée biblique du nom comme manifestation de la personne et de son caractère.
theological_decisions:
- issue: Valeur titulaire de ὁ δυνατός
  choice: le Tout-Puissant
  alternative: celui qui est puissant
  rationale: L'article grec substantive l'adjectif et en fait une désignation révérencieuse de Dieu. La majuscule française signale cet emploi comme titre sans ajouter d'explication doctrinale.
- issue: Ordre des mots dans καὶ ἅγιον τὸ ὄνομα αὐτοῦ
  choice: et son nom est saint
  alternative: et saint est son nom
  rationale: L'alternative reproduit davantage l'antéposition emphatique de ἅγιον, mais paraît recherchée en français moderne. Le texte principal privilégie une formulation naturelle, tandis que la note préserve l'information sur l'emphase grecque.
translation_notes:
  register: Français international moderne, simple et digne, avec une légère élévation poétique adaptée au cantique de Marie. La syntaxe reste naturelle tout en signalant en note l'ordre emphatique du grec.
