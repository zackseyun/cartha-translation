id: LUK.1.68
reference: Luke 1:68
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Εὐλογητὸς κύριος ὁ θεὸς τοῦ Ἰσραήλ, ὅτι ἐπεσκέψατο καὶ ἐποίησεν λύτρωσιν τῷ λαῷ αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/068.yaml
  text: Blessed is the Lord, the God of Israel, because he has visited and brought redemption to his people,
translation:
  language: fr
  text: Béni soit le Seigneur, le Dieu d’Israël, car il a visité[a] son peuple et lui a apporté la rédemption.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « est venu au secours de » ; dans la Bible, le verbe grec traduit par « visiter » désigne ici l’intervention attentive de Dieu.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐλογητὸς
  choice: Béni soit
  rationale: Formule française naturelle et digne de bénédiction, qui conserve la force doxologique de l’adjectif grec employé comme prédicat.
- source_word: κύριος
  choice: le Seigneur
  rationale: Titre divin usuel, qui préserve la résonance scripturaire de la formule appliquée au Dieu d’Israël.
- source_word: ὁ θεὸς τοῦ Ἰσραήλ
  choice: le Dieu d’Israël
  rationale: Rend directement l’apposition et conserve la désignation biblique traditionnelle du Dieu d’Israël.
- source_word: ὅτι
  choice: car
  rationale: Introduit naturellement en français le motif de la bénédiction, dans un registre à la fois actuel et solennel.
- source_word: ἐπεσκέψατο
  choice: a visité
  rationale: Conserve l’image biblique de la visite divine, qui évoque une attention active et une intervention secourable, sans la réduire à une seule explication.
- source_word: ἐποίησεν λύτρωσιν
  choice: a apporté la rédemption
  rationale: Évite le calque peu idiomatique « a fait une rédemption » tout en exprimant l’action divine et son résultat salvateur.
- source_word: λύτρωσιν
  choice: la rédemption
  rationale: Préserve la portée théologique ainsi que l’idée de libération associée au terme grec, là où « délivrance » serait plus général.
- source_word: τῷ λαῷ αὐτοῦ
  choice: à son peuple / lui
  rationale: Le pronom « lui » rattache naturellement en français le bénéficiaire à l’action d’apporter la rédemption, tandis que « son peuple » est explicité avec le premier verbe.
theological_decisions:
- issue: Langage de la visite divine
  choice: a visité
  alternative: est venu au secours de
  rationale: La formulation retenue préserve la métaphore scripturaire de la visite de Dieu et sa richesse théologique; la note explicite son sens interventionnel sans l’imposer dans le corps du texte.
translation_notes:
  register: Français international moderne, clair et digne. « Béni soit » maintient le ton liturgique de la bénédiction; « a visité » conserve l’écho biblique, accompagné d’une note qui en facilite la compréhension.
