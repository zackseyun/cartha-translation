id: LUK.1.22
reference: Luke 1:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐξελθὼν δὲ οὐκ ⸀ἐδύνατο λαλῆσαι αὐτοῖς, καὶ ἐπέγνωσαν ὅτι ὀπτασίαν ἑώρακεν ἐν τῷ ναῷ· καὶ αὐτὸς ἦν διανεύων αὐτοῖς, καὶ διέμενεν κωφός.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/022.yaml
  text: But when he came out[a], he was not able to speak to them, and they realized that he had seen a vision in the sanctuary[b]. And he kept making signs to them and remained mute.
translation:
  language: fr
  text: Mais lorsqu’il sortit, il ne pouvait pas leur parler. Ils comprirent alors qu’il avait eu une vision dans le sanctuaire[a]. Il continuait à leur faire des signes et restait muet[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans le Temple ». Le mot grec désigne ici plus précisément le sanctuaire proprement dit plutôt que l’ensemble du complexe du Temple.
    reason: lexical_alternative
  - marker: b
    text: Le mot grec traduit par « muet » peut aussi désigner une personne sourde et, dans certains contextes, sourde et muette.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθὼν
  choice: lorsqu’il sortit
  rationale: Le participe aoriste marque ici une circonstance temporelle antérieure ou concomitante au verbe principal. Cette formulation restitue naturellement la succession des faits.
- source_word: οὐκ ἐδύνατο λαλῆσαι αὐτοῖς
  choice: il ne pouvait pas leur parler
  rationale: Cette tournure française naturelle conserve explicitement l’idée d’incapacité exprimée par δύναμαι avec l’infinitif.
- source_word: ἐπέγνωσαν
  choice: ils comprirent alors
  rationale: Dans ce contexte, le verbe indique qu’ils parviennent à une conclusion à partir de l’état et des gestes de Zacharie. « Alors » rend clairement la progression narrative sans ajouter de contenu étranger.
- source_word: ὀπτασίαν ἑώρακεν
  choice: il avait eu une vision
  rationale: ὀπτασία désigne ici une expérience visuelle surnaturelle. Le plus-que-parfait français rend l’antériorité de la vision, et « avoir une vision » est plus idiomatique que « voir une vision ».
- source_word: ἐν τῷ ναῷ
  choice: dans le sanctuaire
  rationale: ναός désigne plus précisément le sanctuaire proprement dit, par opposition à l’ensemble plus vaste du complexe du Temple.
- source_word: ἦν διανεύων αὐτοῖς
  choice: il continuait à leur faire des signes
  rationale: La construction périphrastique à l’imparfait exprime une action prolongée. « Continuait à » en conserve l’aspect duratif.
- source_word: διέμενεν κωφός
  choice: restait muet
  rationale: L’imparfait de διαμένω exprime la persistance de l’état. Dans le contexte immédiat, κωφός souligne surtout l’incapacité à parler, tout en pouvant avoir ailleurs une portée liée à la surdité.
theological_decisions:
- issue: Portée de κωφός dans le jugement subi par Zacharie
  choice: Traduire par « muet » dans le texte principal.
  alternative: « sourd et muet » ou « incapable de parler »
  rationale: Le verset met explicitement l’accent sur l’impossibilité de parler et sur les signes faits à la foule. « Muet » préserve cet accent sans exclure silencieusement la possibilité lexicale d’une surdité, signalée en note.
translation_notes:
  register: Français international moderne, naturel et digne. La coordination grecque a été répartie en trois phrases courtes pour assurer une lecture fluide sans modifier la progression du récit. Les marqueurs de note sont placés immédiatement après les termes concernés.
