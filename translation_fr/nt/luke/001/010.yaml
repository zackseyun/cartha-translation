id: LUK.1.10
reference: Luke 1:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ πᾶν τὸ πλῆθος ἦν τοῦ λαοῦ προσευχόμενον ἔξω τῇ ὥρᾳ τοῦ θυμιάματος·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/010.yaml
  text: And the whole multitude of the people was praying outside at the hour of the incense offering[a].
translation:
  language: fr
  text: Et toute la foule du peuple priait dehors à l’heure de l’offrande de l’encens[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « au moment où l’on brûlait l’encens ».
    reason: Alternative lexicale explicitant le sens rituel possible de θυμίαμα.
lexical_decisions:
- source_word: πᾶν τὸ πλῆθος
  choice: toute la foule
  rationale: L’expression souligne la totalité du groupe assemblé. « Toute la foule » est naturelle en français et conserve à la fois l’idée collective et l’ampleur du rassemblement.
- source_word: τοῦ λαοῦ
  choice: du peuple
  rationale: Le contexte du temple renvoie vraisemblablement au peuple d’Israël, mais le grec dit simplement « du peuple » ; la traduction n’ajoute donc pas « d’Israël ».
- source_word: ἦν … προσευχόμενον
  choice: priait
  rationale: La construction périphrastique exprime une action en cours. L’imparfait français « priait » en rend naturellement la durée sans ajouter explicitement « ensemble ».
- source_word: ἔξω
  choice: dehors
  rationale: Le terme signifie simplement « dehors » ou « à l’extérieur ». « Dehors » maintient le contraste contextuel avec Zacharie à l’intérieur sans préciser plus que le texte.
- source_word: τῇ ὥρᾳ
  choice: à l’heure
  rationale: « À l’heure » conserve l’idée d’un moment fixé du culte, tout en restant idiomatique en français.
- source_word: τοῦ θυμιάματος
  choice: de l’offrande de l’encens
  rationale: θυμίαμα désigne l’encens et, dans ce contexte cultuel, l’acte rituel où il est offert. Cette formulation explicite sobrement le contexte sans développer une interprétation doctrinale.
theological_decisions:
- issue: Terminologie cultuelle du temple dans θυμίαμα
  choice: l’offrande de l’encens
  alternative: l’encens ; le moment où l’on brûlait l’encens
  rationale: Le verset situe la prière du peuple au moment du rite sacerdotal de l’encens. « L’offrande de l’encens » préserve cette dimension liturgique sans importer d’affirmation doctrinale ultérieure.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proche du grec tout en étant naturelle ; « foule » évite le tour plus lourd « multitude », et l’imparfait rend l’action continue.
