id: LUK.1.32
reference: Luke 1:32
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὗτος ἔσται μέγας καὶ υἱὸς Ὑψίστου κληθήσεται, καὶ δώσει αὐτῷ κύριος ὁ θεὸς τὸν θρόνον Δαυὶδ τοῦ πατρὸς αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/032.yaml
  text: He will be great and will be called the Son of the Most High[a], and the Lord God will give him the throne of David his father[c][b],
translation:
  language: fr
  text: Il[a] sera grand et sera appelé Fils du Très-Haut[b]. Le Seigneur Dieu lui donnera le trône de David, son père[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Celui-ci sera grand ». Le grec commence par le pronom démonstratif « celui-ci ».
    reason: lexical_alternative
  - marker: b
    text: Ou « sera nommé Fils du Très-Haut ».
    reason: lexical_alternative
  - marker: c
    text: Ici, « son père » désigne David comme ancêtre royal de Jésus dans la lignée davidique.
    reason: cultural_note
lexical_decisions:
- source_word: οὗτος
  choice: Il
  rationale: Le démonstratif désigne l’enfant qui vient d’être annoncé. En français courant, « Il » est plus naturel, tandis qu’une note signale la forme plus littérale.
- source_word: ἔσται μέγας
  choice: sera grand
  rationale: Cette formulation conserve la portée large de μέγας — grandeur, importance et dignité — sans la réduire à la puissance.
- source_word: υἱὸς Ὑψίστου
  choice: Fils du Très-Haut
  rationale: La tournure fonctionne comme un titre. « Le Très-Haut » est l’équivalent biblique français naturel du titre divin Ὕψιστος.
- source_word: κληθήσεται
  choice: sera appelé
  rationale: Le futur passif exprime ici l’attribution d’un nom ou d’un titre; « sera appelé » reste transparent et proche du grec.
- source_word: κύριος ὁ θεὸς
  choice: le Seigneur Dieu
  rationale: Cette expression rend directement le titre divin grec sans introduire le tétragramme absent du texte.
- source_word: δώσει αὐτῷ
  choice: lui donnera
  rationale: Le futur de δίδωμι avec le pronom au datif se rend naturellement ainsi en français.
- source_word: τὸν θρόνον Δαυὶδ
  choice: le trône de David
  rationale: La construction génitive est conservée et maintient l’écho de la promesse royale davidique.
- source_word: τοῦ πατρὸς αὐτοῦ
  choice: son père
  rationale: La traduction directe préserve le langage dynastique du texte; dans ce contexte, « père » peut désigner un ancêtre.
theological_decisions:
- issue: Titre christologique υἱὸς Ὑψίστου
  choice: Fils du Très-Haut
  alternative: un fils du Très-Haut
  rationale: La construction est titulaire et concerne l’enfant annoncé. La traduction conserve la force filiale et royale de l’expression sans lui ajouter une formulation doctrinale postérieure.
- issue: Traduction de κύριος
  choice: Seigneur dans « le Seigneur Dieu »
  alternative: l’Éternel Dieu
  rationale: Le grec porte κύριος et non le tétragramme hébreu; « Seigneur » évite donc de préciser au-delà du texte.
- issue: Lien de Jésus avec David
  choice: David, son père
  alternative: David, son ancêtre
  rationale: « Père » traduit directement πατήρ et conserve la tension entre filiation généalogique et héritage royal davidique; la note explicite le sens ancestral.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe suit étroitement le grec tout en évitant une tournure inutilement lourde. La ponctuation répartit les deux propositions principales en deux phrases pour une lecture naturelle.
