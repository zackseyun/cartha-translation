reference: Luke 1:35
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ὁ ἄγγελος εἶπεν αὐτῇ· Πνεῦμα ἅγιον ἐπελεύσεται ἐπὶ σέ, καὶ δύναμις Ὑψίστου ἐπισκιάσει σοι· διὸ καὶ τὸ γεννώμενον ἅγιον κληθήσεται, υἱὸς θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/035.yaml
  text: And the angel answered and said to her[a], “The Holy Spirit will come upon you, and the power of the Most High will overshadow you[b]; therefore also the holy one being born will be called the Son of God.”
translation:
  language: fr
  text: 'L’ange lui répondit : « L’Esprit saint viendra sur toi, et la puissance du Très-Haut te couvrira de son ombre. C’est pourquoi l’enfant qui naîtra sera saint[a] et sera appelé Fils de Dieu[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « le saint enfant qui naîtra ». Littéralement, le grec dit « ce qui est en train de naître » ou « l’être qui naît »; l’adjectif « saint » peut être compris comme un qualificatif de l’enfant ou comme ce qui est affirmé de lui.'
    reason: ambiguïté syntaxique et lexicale
  - marker: b
    text: Le grec ne met pas d’article devant « Fils », mais l’expression a ici valeur de titre et ne signifie pas « un fils de Dieu » parmi d’autres.
    reason: précision grammaticale et titulaire
lexical_decisions:
- source_word: ἀποκριθεὶς ὁ ἄγγελος εἶπεν αὐτῇ
  choice: L’ange lui répondit
  rationale: La tournure grecque, littéralement « ayant répondu, l’ange lui dit », est une formule idiomatique. « Lui répondit » en exprime naturellement la valeur en français sans alourdir la phrase.
- source_word: Πνεῦμα ἅγιον
  choice: L’Esprit saint
  rationale: Dans ce contexte, l’expression désigne l’Esprit divin. L’article est requis par l’usage français; la majuscule à « Esprit » marque le référent personnel divin, tandis que « saint » garde la graphie française courante.
- source_word: ἐπελεύσεται ἐπὶ σέ
  choice: viendra sur toi
  rationale: Cette formulation conserve le mouvement et l’action exprimés par le verbe avec ἐπί, sans préciser au-delà du texte la manière dont l’Esprit agit.
- source_word: δύναμις Ὑψίστου
  choice: la puissance du Très-Haut
  rationale: Le génitif est rendu directement, et « le Très-Haut » conserve la valeur de titre divin de Ὑψίστου.
- source_word: ἐπισκιάσει σοι
  choice: te couvrira de son ombre
  rationale: Cette expression française naturelle préserve l’image de l’ombre et de la présence divine portée par le verbe, sans introduire d’explication biologique ou sexuelle absente du grec.
- source_word: διὸ καὶ
  choice: C’est pourquoi
  rationale: La locution exprime clairement la conséquence. La nuance additive de καί est portée par l’enchaînement des deux prédications concernant l’enfant plutôt que par un « aussi » peu naturel ici.
- source_word: τὸ γεννώμενον
  choice: l’enfant qui naîtra
  rationale: Le participe présent passif neutre désigne ici l’être qui vient à la naissance. « L’enfant qui naîtra » est clair et naturel, tandis qu’une note signale la forme plus littérale et son ambiguïté temporelle.
- source_word: ἅγιον
  choice: sera saint
  rationale: Le neutre ἅγιον se rapporte à τὸ γεννώμενον. La formulation prédicative « sera saint » garde le lien direct entre la sainteté et l’enfant sans transformer nécessairement l’adjectif en titre autonome.
- source_word: κληθήσεται
  choice: sera appelé
  rationale: Le futur passif de καλέω peut exprimer l’appellation et l’identité reconnue. « Sera appelé » préserve cette amplitude.
- source_word: υἱὸς θεοῦ
  choice: Fils de Dieu
  rationale: L’expression sans article en grec a ici une valeur qualitative et titulaire, non indéfinie. Après « appelé », le français emploie naturellement le titre sans article et avec une majuscule à « Fils ».
theological_decisions:
- issue: Référence personnelle et divine de Πνεῦμα ἅγιον
  choice: L’Esprit saint
  alternative: un esprit saint / un souffle saint
  rationale: Le contexte présente l’Esprit comme l’agent divin de la conception annoncée. La traduction conserve ce sens sans réduire l’expression à une force impersonnelle ni développer une formulation doctrinale absente du verset.
- issue: Rapport syntaxique de ἅγιον avec τὸ γεννώμενον et κληθήσεται
  choice: l’enfant qui naîtra sera saint et sera appelé Fils de Dieu
  alternative: le saint enfant qui naîtra sera appelé Fils de Dieu
  rationale: Le grec permet de comprendre ἅγιον comme prédicat de l’enfant ou comme qualificatif substantivé. La formulation retenue rend explicitement sa sainteté tout en évitant d’en faire sans nécessité un titre distinct; la note conserve l’autre construction possible.
- issue: Valeur de υἱὸς θεοῦ sans article grec
  choice: Fils de Dieu
  alternative: un fils de Dieu
  rationale: L’absence d’article ne rend pas l’expression indéfinie. Dans l’annonce, elle fonctionne comme une désignation qualitative et titulaire. La syntaxe française après « appelé » n’exige pas d’article.
- issue: Image de l’action divine exprimée par ἐπισκιάσει
  choice: te couvrira de son ombre
  alternative: t’enveloppera / te couvrira
  rationale: La traduction maintient l’image révérencieuse du grec et son indétermination, sans importer de mécanisme physique ou sexuel que le texte ne formule pas.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement est maintenu parce que l’ange s’adresse personnellement à Marie et que le singulier est explicite en grec. La phrase évite les archaïsmes, conserve les titres divins traditionnels « Esprit saint », « Très-Haut » et « Fils de Dieu », et place chaque appel de note immédiatement après le segment concerné.
