id: LUK.1.58
reference: Luke 1:58
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἤκουσαν οἱ περίοικοι καὶ οἱ συγγενεῖς αὐτῆς ὅτι ἐμεγάλυνεν κύριος τὸ ἔλεος αὐτοῦ μετ’ αὐτῆς, καὶ συνέχαιρον αὐτῇ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/058.yaml
  text: And her neighbors and relatives heard that the Lord had shown great mercy to her[a], and they rejoiced with her.
translation:
  language: fr
  text: Ses voisins et les membres de sa famille apprirent que le Seigneur avait fait preuve d’une grande miséricorde envers elle, et ils se réjouirent avec elle.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: περίοικοι
  choice: voisins
  rationale: Le terme désigne les personnes qui habitent aux alentours. « Voisins » est l’équivalent français moderne le plus naturel.
- source_word: συγγενεῖς
  choice: membres de sa famille
  rationale: Le mot désigne les personnes apparentées. Cette formulation évite l’ambiguïté moderne de « parents », qui peut désigner uniquement le père et la mère.
- source_word: ἐμεγάλυνεν
  choice: avait manifesté… toute la grandeur de
  rationale: Cette tournure française naturelle conserve l’idée propre au verbe μεγαλύνω, qui consiste ici à rendre manifeste la grandeur de la miséricorde divine.
- source_word: κύριος
  choice: le Seigneur
  rationale: Bien que dépourvu d’article en grec, κύριος fonctionne ici comme un titre divin défini.
- source_word: ἔλεος
  choice: miséricorde
  rationale: « Miséricorde » exprime la bonté compatissante de Dieu et maintient le vocabulaire théologique récurrent du récit de l’enfance chez Luc.
- source_word: μετ’ αὐτῆς
  choice: envers elle
  rationale: Dans cette expression idiomatique, μετά avec le génitif indique la personne en faveur de laquelle la miséricorde s’est exercée. Le français « envers elle » restitue naturellement ce rapport.
- source_word: συνέχαιρον αὐτῇ
  choice: ils se réjouirent avec elle
  rationale: Le verbe signifie partager la joie de quelqu’un. La formulation retenue est directe et conserve l’idée de joie commune.
theological_decisions:
- issue: Expression ἐμεγάλυνεν κύριος τὸ ἔλεος αὐτοῦ μετ’ αὐτῆς
  choice: le Seigneur avait manifesté envers elle toute la grandeur de sa miséricorde
  alternative: le Seigneur lui avait témoigné une grande miséricorde
  rationale: Le choix retenu demeure naturel en français tout en préservant la force de μεγαλύνω et l’accent mis sur la grandeur de la miséricorde divine, sans donner à entendre que la miséricorde elle-même aurait augmenté.
translation_notes:
  register: Français international moderne, clair et digne. « Membres de sa famille » est préféré à « parents » pour éviter une ambiguïté courante; « miséricorde » conserve la cohérence lexicale et théologique du passage.
