  text: le salut qui nous délivre de nos ennemis et de la main de tous ceux qui nous haïssent,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « la délivrance de nos ennemis et du pouvoir de tous ceux qui nous haïssent ». Littéralement : « de la main de tous ceux qui nous haïssent ».'
    reason: Alternative lexicale pour « salut » et explicitation possible de l’expression idiomatique « de la main de »; correction de la fausse indication de littéralité.
lexical_decisions:
- source_word: σωτηρίαν
  choice: le salut qui nous délivre
  rationale: « Salut » conserve la portée théologique du terme dans le cantique, tandis que la relative rend clairement son sens concret de délivrance face aux ennemis sans réduire le mot à une seule dimension.
- source_word: ἐξ ἐχθρῶν ἡμῶν
  choice: de nos ennemis
  rationale: La préposition ἐξ marque ici la séparation ou la délivrance. Avec « délivre », le français naturel emploie « de nos ennemis ».
- source_word: ἐκ χειρὸς
  choice: de la main de
  rationale: Cette traduction conserve l’image biblique de la main comme puissance ou domination, tout en restant intelligible en français moderne.
- source_word: πάντων τῶν μισούντων ἡμᾶς
  choice: de tous ceux qui nous haïssent
  rationale: Le participe substantivé désigne l’ensemble de ceux dont la haine envers « nous » est caractéristique ou persistante.
- source_word: καὶ
  choice: et
  rationale: La conjonction coordonne simplement les deux expressions de délivrance, sans qu’il soit nécessaire de lui donner une valeur explicative.
theological_decisions:
- issue: Nature du salut promis dans la prophétie de Zacharie
  choice: Conserver le terme « salut » tout en explicitant ici sa dimension concrète de délivrance face aux ennemis.
  alternative: Employer seulement « délivrance », ou interpréter le verset comme parlant exclusivement d’un salut politique ou exclusivement d’un salut spirituel.
  rationale: Le contexte immédiat évoque des ennemis réels et ceux qui haïssent le peuple, tandis que le vocabulaire du salut dans Luc porte aussi une portée rédemptrice plus large. La formulation maintient cette tension sans la trancher.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation s’insère comme la suite syntaxique du verset précédent. L’image biblique de la « main » est maintenue dans le texte, avec son sens de puissance précisé en note.
