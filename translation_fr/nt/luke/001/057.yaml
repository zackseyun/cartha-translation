  text: Τῇ δὲ Ἐλισάβετ ἐπλήσθη ὁ χρόνος τοῦ τεκεῖν αὐτήν, καὶ ἐγέννησεν υἱόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/057.yaml
  text: The time was fulfilled for Elizabeth to give birth[a], and she bore a son.
translation:
  language: fr
  text: Le temps où Élisabeth devait accoucher arriva à son terme[a], et elle mit au monde un fils.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de façon plus idiomatique : « Le moment arriva où Élisabeth devait accoucher. »'
    reason: alternative lexicale
lexical_decisions:
- source_word: δὲ
  choice: absence de connecteur explicite
  rationale: La particule marque ici une légère progression narrative. En français, le passage au nouvel énoncé suffit naturellement à porter cette transition; ajouter « Or » ou « Alors » alourdirait ou préciserait indûment le rapport.
- source_word: ἐπλήσθη ὁ χρόνος
  choice: Le temps … arriva à son terme
  rationale: Cette formulation conserve l’idée d’un temps parvenu à son accomplissement tout en restant naturelle en français moderne.
- source_word: τοῦ τεκεῖν αὐτήν
  choice: où Élisabeth devait accoucher
  rationale: L’infinitif articulé se rapporte au terme de la grossesse et à l’accouchement d’Élisabeth. La répétition du nom évite une construction pronominale lourde ou ambiguë.
- source_word: ἐγέννησεν
  choice: elle mit au monde
  rationale: L’expression française décrit clairement l’acte achevé de donner naissance et s’associe naturellement à « un fils ».
- source_word: υἱόν
  choice: un fils
  rationale: Le nom désigne spécifiquement un fils; cette précision de sexe est donc conservée.
- source_word: Ἐλισάβετ
  choice: Élisabeth
  rationale: Forme française traditionnelle et courante du nom propre biblique.
