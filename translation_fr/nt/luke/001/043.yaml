id: LUK.1.43
reference: Luke 1:43
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ πόθεν μοι τοῦτο ἵνα ἔλθῃ ἡ μήτηρ τοῦ κυρίου μου πρὸς ⸀ἐμέ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/043.yaml
  text: And why is this granted to me[a], that the mother of my Lord should come to me?
translation:
  language: fr
  text: Et comment m’est-il accordé[a] que la mère de mon Seigneur vienne auprès de moi ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « Et d’où me vient ceci : que la mère de mon Seigneur vienne auprès de moi ? » Cette tournure exprime l’étonnement devant un tel honneur.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πόθεν μοι τοῦτο
  choice: comment m’est-il accordé
  rationale: L’expression grecque, littéralement « d’où cela m’arrive-t-il ? », exprime l’étonnement devant un honneur reçu. Cette formulation est naturelle en français moderne tout en gardant l’idée d’un privilège accordé.
- source_word: ἵνα ἔλθῃ
  choice: que … vienne
  rationale: Après cette tournure exclamative, ἵνα introduit le contenu de la circonstance étonnante. Le subjonctif français convient naturellement.
- source_word: ἡ μήτηρ
  choice: la mère
  rationale: Équivalent direct et naturel du grec.
- source_word: τοῦ κυρίου μου
  choice: de mon Seigneur
  rationale: Conserve le titre κύριος et la confession personnelle exprimée par μου, sans préciser davantage sa portée théologique.
- source_word: πρὸς ἐμέ
  choice: jusqu’à moi
  rationale: Rend le mouvement en direction d’Élisabeth. « Jusqu’à moi » évite la répétition maladroite de « m’est-il… à moi » et souligne naturellement sa venue auprès d’elle sans ajouter « chez moi », absent du grec.
theological_decisions:
- issue: Sens du titre κύριος dans « la mère de mon Seigneur »
  choice: mon Seigneur
  alternative: mon maître
  rationale: « Seigneur » préserve la force révérencielle et christologique possible du titre dans le récit, sans importer dans le verset une formulation doctrinale postérieure.
- issue: Degré d’explicitation de l’expression πόθεν μοι τοῦτο
  choice: comment m’est-il accordé
  alternative: d’où me vient ceci
  rationale: Le grec conserve une image de provenance, mais emploie ici une tournure idiomatique d’étonnement. Le texte principal exprime clairement l’honneur reçu; la note maintient accessible la forme plus littérale et son ambiguïté.
translation_notes:
  register: Français international moderne, digne et accessible. La question conserve l’émerveillement et l’humilité d’Élisabeth; la note signale la formulation littérale sans alourdir le texte principal.
