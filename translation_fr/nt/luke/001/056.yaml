  text: Ἔμεινεν δὲ Μαριὰμ σὺν αὐτῇ ⸀ὡς μῆνας τρεῖς, καὶ ὑπέστρεψεν εἰς τὸν οἶκον αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/056.yaml
  text: And Mary stayed with her about three months[a], and returned to her home.
translation:
  language: fr
  text: Marie resta avec Élisabeth environ trois mois, puis elle retourna chez elle.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔμεινεν
  choice: resta
  rationale: L’aoriste de μένω indique ici que Marie demeure en un lieu pendant une certaine durée. « Resta » est naturel et précis en français narratif.
- source_word: δὲ
  choice: puis
  rationale: δέ est un connecteur narratif léger. Dans ce contexte, « puis » assure une transition fluide sans introduire de contraste marqué.
- source_word: Μαριὰμ
  choice: Marie
  rationale: Forme française traditionnelle et courante du nom Μαριάμ.
- source_word: σὺν αὐτῇ
  choice: avec Élisabeth
  rationale: σύν avec le datif exprime l’accompagnement. Le pronom renvoie à Élisabeth dans le contexte; expliciter son nom évite en français une ambiguïté inutile.
- source_word: ὡς μῆνας τρεῖς
  choice: environ trois mois
  rationale: ὡς devant une indication de durée exprime ici l’approximation. « Environ trois mois » restitue directement cette nuance.
- source_word: ὑπέστρεψεν
  choice: retourna
  rationale: Le verbe désigne le retour vers un lieu antérieur. « Retourna » convient au registre narratif courant.
- source_word: εἰς τὸν οἶκον αὐτῆς
  choice: chez elle
  rationale: οἶκος désigne ici le domicile comme destination. « Chez elle » est la formulation française la plus naturelle tout en conservant le sens spatial et personnel.
theological_decisions: []
translation_notes:
  register: Français international moderne, simple et digne. La structure narrative reste concise. Le référent d’αὐτῇ est explicité par « Élisabeth » pour la clarté; l’approximation portée par ὡς est conservée dans le texte avec « environ », sans nécessiter de note.
