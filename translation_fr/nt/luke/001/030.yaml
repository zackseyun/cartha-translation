  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ εἶπεν ὁ ἄγγελος αὐτῇ· Μὴ φοβοῦ, Μαριάμ, εὗρες γὰρ χάριν παρὰ τῷ θεῷ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/030.yaml
  text: And the angel said to her[a], “Do not be afraid, Mary, for you have found favor with God.”
translation:
  language: fr
  text: 'L’ange lui dit : « N’aie pas peur, Marie, car tu as trouvé faveur auprès de Dieu.[a] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « grâce ». Le nom grec χάρις peut signifier « grâce » ou « faveur » ; dans l’expression « trouver faveur auprès de Dieu », « faveur » correspond le mieux à l’expression idiomatique employée ici.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν
  choice: dit
  rationale: Aoriste narratif courant de λέγω ; « dit » est la formulation naturelle en français dans l’introduction d’un discours direct.
- source_word: ἄγγελος
  choice: l’ange
  rationale: Dans le récit de l’enfance chez Luc, il s’agit d’un être céleste ; « ange » est donc plus précis que le terme général « messager ».
- source_word: Μὴ φοβοῦ
  choice: N’aie pas peur
  rationale: L’impératif précédé de μή exprime une interdiction ; cette tournure est naturelle en français moderne et convient à une adresse personnelle.
- source_word: Μαριάμ
  choice: Marie
  rationale: Forme française traditionnelle et courante du nom propre Μαριάμ.
- source_word: εὗρες
  choice: tu as trouvé
  rationale: Le passé composé rend naturellement l’aoriste et laisse entendre la portée présente de cette faveur dans l’annonce.
- source_word: χάριν
  choice: faveur
  rationale: Dans l’expression idiomatique εὑρίσκω χάριν παρά, « faveur » exprime le mieux l’accueil favorable accordé par Dieu, sans imposer ici un sens doctrinal plus technique de « grâce ».
- source_word: παρὰ τῷ θεῷ
  choice: auprès de Dieu
  rationale: Avec παρά suivi du datif après « trouver faveur », « auprès de Dieu » rend de manière concise l’idée de faveur aux yeux de Dieu.
theological_decisions:
- issue: Traduction de χάριν dans un contexte marial
  choice: faveur
  alternative: grâce
  rationale: L’expression grecque signifie conventionnellement « trouver faveur auprès de quelqu’un ». « Faveur » préserve ce sens relationnel sans importer dans le verset des formulations doctrinales ultérieures ; la possibilité lexicale « grâce » est signalée en note.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement correspond au singulier grec et à l’usage narratif français. « N’aie pas peur » est plus courant que « Ne crains pas », tandis que « auprès de Dieu » conserve une tonalité biblique claire sans archaïsme.
