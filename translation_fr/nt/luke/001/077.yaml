  yaml_path: translation/nt/luke/001/077.yaml
  text: to give knowledge of salvation to his people in the forgiveness of their sins,[a]
translation:
  language: fr
  text: pour donner à son peuple la connaissance du salut dans le pardon de ses péchés,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « par le pardon de ses péchés » ou « grâce au pardon de ses péchés ».
    reason: alternative lexicale et syntaxique pour ἐν avec le datif
lexical_decisions:
- source_word: τοῦ δοῦναι
  choice: pour donner
  rationale: L’infinitif substantivé exprime ici le but en dépendance du verset précédent. « Pour donner » rend naturellement cette relation en français.
- source_word: γνῶσιν σωτηρίας
  choice: la connaissance du salut
  rationale: Cette formulation conserve le nom γνῶσις et le génitif σωτηρίας sans préciser excessivement s’il s’agit d’une connaissance du salut ou à son sujet.
- source_word: τῷ λαῷ αὐτοῦ
  choice: à son peuple
  rationale: Le datif désigne les bénéficiaires; « à son peuple » préserve aussi la portée collective et l’expression d’appartenance.
- source_word: ἐν ἀφέσει
  choice: dans le pardon
  rationale: « Dans » maintient la souplesse de ἐν, qui peut indiquer la sphère ou la manière, sans imposer une lecture exclusivement instrumentale.
- source_word: ἁμαρτιῶν αὐτῶν
  choice: de ses péchés
  rationale: Le pluriel de ἁμαρτιῶν est conservé. En français, « son peuple » est repris naturellement par le possessif singulier collectif « ses ».
theological_decisions:
- issue: Rapport entre le salut et le pardon
  choice: Le salut est connu dans le pardon des péchés, sans définir plus étroitement la nature de ce rapport.
  alternative: « par le pardon de ses péchés » ou « grâce au pardon de ses péchés »
  rationale: La construction ἐν ἀφέσει permet une nuance de sphère ou de moyen. Le texte principal garde « dans », tandis que la note signale les lectures instrumentales possibles.
translation_notes:
  register: Français moderne, clair et digne. La formulation conserve la structure poétique du cantique et l’ambiguïté réelle de la préposition grecque.
