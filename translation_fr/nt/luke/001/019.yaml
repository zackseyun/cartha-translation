id: LUK.1.19
reference: Luke 1:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ὁ ἄγγελος εἶπεν αὐτῷ· Ἐγώ εἰμι Γαβριὴλ ὁ παρεστηκὼς ἐνώπιον τοῦ θεοῦ, καὶ ἀπεστάλην λαλῆσαι πρὸς σὲ καὶ εὐαγγελίσασθαί σοι ταῦτα·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/019.yaml
  text: And the angel answered him[a], “I am Gabriel, who stands in the presence of God, and I was sent to speak to you and to bring you this good news.”
translation:
  language: fr
  text: 'L’ange lui répondit : « Moi, je suis Gabriel, celui qui se tient en présence de Dieu. J’ai été envoyé pour te parler et t’annoncer cette bonne nouvelle[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « t’annoncer comme bonne nouvelle ces choses »; « ces choses » désigne le message annoncé par Gabriel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: lui répondit
  rationale: Le participe aoriste introduit la parole directe; une forme verbale finie est naturelle en français moderne.
- source_word: ἄγγελος
  choice: l’ange
  rationale: Dans ce contexte, le messager est explicitement Gabriel, un être céleste; « ange » est donc le terme précis et naturel.
- source_word: Ἐγώ εἰμι Γαβριὴλ
  choice: Moi, je suis Gabriel
  rationale: Le pronom grec explicite est emphatique; « Moi, je » conserve cette insistance dans la réponse solennelle de Gabriel.
- source_word: ὁ παρεστηκὼς
  choice: celui qui se tient
  rationale: Le participe parfait exprime une position établie et continue; cette formulation rend à la fois la posture et le statut durable.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: en présence de Dieu
  rationale: Cette expression conserve l’idée de proximité devant Dieu et la nuance de service dans la cour céleste.
- source_word: ἀπεστάλην
  choice: J’ai été envoyé
  rationale: Le passif préserve clairement l’idée d’une mission reçue, sans préciser explicitement l’agent que le contexte permet d’identifier.
- source_word: λαλῆσαι πρὸς σὲ
  choice: pour te parler
  rationale: L’infinitif exprime le but de l’envoi; « parler » correspond directement au verbe grec et reste naturel.
- source_word: εὐαγγελίσασθαί σοι
  choice: t’annoncer cette bonne nouvelle
  rationale: Le verbe signifie annoncer une bonne nouvelle; « annoncer » est idiomatique et évite de donner ici à « Évangile » un sens technique ultérieur.
- source_word: ταῦτα
  choice: cette bonne nouvelle
  rationale: Littéralement « ces choses »; le démonstratif renvoie au message annoncé, intégré naturellement en français au complément du verbe.
theological_decisions:
- issue: Rendu de εὐαγγελίζω dans l’annonce de l’ange
  choice: annoncer cette bonne nouvelle
  alternative: annoncer l’Évangile; apporter une heureuse nouvelle
  rationale: Le choix garde la portée positive du verbe sans imposer au récit un terme théologique devenu plus technique par la suite.
- issue: Agent implicite de ἀπεστάλην
  choice: maintien du passif « J’ai été envoyé »
  alternative: « Dieu m’a envoyé »
  rationale: Même si Dieu est clairement l’agent attendu dans le contexte, le grec ne le nomme pas dans cette proposition; le passif préserve cette forme.
translation_notes:
  register: Français international moderne, digne et accessible. L’emphase de Ἐγώ est conservée par « Moi, je », et les pronoms de deuxième personne du singulier maintiennent l’adresse directe à Zacharie.
