id: LUK.1.8
reference: Luke 1:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἐγένετο δὲ ἐν τῷ ἱερατεύειν αὐτὸν ἐν τῇ τάξει τῆς ἐφημερίας αὐτοῦ ἔναντι τοῦ θεοῦ
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/008.yaml
  text: It happened[a], while he was serving as priest before God in the order of his division,
translation:
  language: fr
  text: Or, pendant qu’il accomplissait son service de prêtre devant Dieu, selon l’ordre de sa division,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: Or
  rationale: La formule narrative introduit un nouvel épisode. En français, « Or » marque naturellement cette progression sans recourir à l’archaïque « Il arriva que ».
- source_word: ἐν τῷ ἱερατεύειν αὐτὸν
  choice: pendant qu’il exerçait le sacerdoce
  rationale: La construction ἐν avec l’infinitif substantivé a ici une valeur temporelle, et ἱερατεύω désigne spécifiquement l’exercice du service sacerdotal.
- source_word: τάξει
  choice: selon le tour de service
  rationale: Dans ce contexte cultuel, τάξις renvoie à l’ordre établi ou au tour fixé pour le service; cette formulation est claire en français moderne.
- source_word: ἐφημερίας
  choice: de son groupe
  rationale: Le terme désigne ici la classe sacerdotale à laquelle Zacharie appartenait et qui assurait le service à tour de rôle.
- source_word: ἔναντι τοῦ θεοῦ
  choice: devant Dieu
  rationale: Cette expression concise conserve l’idée d’un service accompli en présence de Dieu.
theological_decisions:
- issue: Terminologie cultuelle relative au service de Zacharie
  choice: exerçait le sacerdoce devant Dieu selon le tour de service de son groupe
  alternative: accomplissait son service de prêtre devant Dieu selon l’ordre de sa classe sacerdotale
  rationale: Le choix retenu préserve le cadre historique du service au Temple tout en évitant d’importer des notions ecclésiastiques ultérieures. « Groupe » reste accessible, tandis que « tour de service » exprime la rotation organisée.
translation_notes:
  register: Français international moderne, digne et naturel. La phrase reste syntaxiquement ouverte, comme le grec, puisqu’elle se poursuit au verset suivant.
