    issue: « son groupe » pour ἐφημερίας
    rationale: Le mot grec désigne la division/classe sacerdotale assignée au service. « Groupe » est trop général et masque cette réalité institutionnelle.
  - severity: low
    issue: « exerçait le sacerdoce » pour ἱερατεύειν
    rationale: La formule est intelligible, mais elle peut mettre l’accent sur l’exercice d’un état ou d’une charge. Le contexte décrit l’accomplissement concret du service sacerdotal.
