id: LUK.1.17
reference: Luke 1:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ αὐτὸς προελεύσεται ἐνώπιον αὐτοῦ ἐν πνεύματι καὶ δυνάμει Ἠλίου, ἐπιστρέψαι καρδίας πατέρων ἐπὶ τέκνα καὶ ἀπειθεῖς ἐν φρονήσει δικαίων, ἑτοιμάσαι κυρίῳ λαὸν κατεσκευασμένον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/017.yaml
  text: And he will go before him in the spirit and power of Elijah[a], to turn the hearts of fathers to children, and the disobedient to the wisdom of the righteous[c][b], to prepare for the Lord a people made ready.
translation:
  language: fr
  text: Et lui-même ira devant lui avec l’esprit et la puissance d’Élie[a], pour ramener les cœurs des pères vers les enfants[b], et les désobéissants à la sagesse des justes[c], afin de préparer pour le Seigneur un peuple prêt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « avec l’esprit et la puissance d’Élie » évoque un ministère prophétique semblable à celui d’Élie et exercé avec une puissance comparable; elle n’affirme pas nécessairement le retour personnel d’Élie.
    reason: cross_reference
  - marker: b
    text: Cette expression fait écho à Malachie 3.24 (4.6 dans certaines numérotations) et peut évoquer le rétablissement des relations familiales.
    reason: cross_reference
  - marker: c
    text: 'Ou : « à la manière de penser des justes »; autre possibilité : « à la prudence des justes ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: προελεύσεται ἐνώπιον αὐτοῦ
  choice: marchera devant lui
  rationale: Cette formulation conserve à la fois l’idée de précéder quelqu’un et la tournure compacte du grec, sans préciser dans le texte l’identité du référent de « lui ».
- source_word: ἐν πνεύματι καὶ δυνάμει Ἠλίου
  choice: avec l’esprit et la puissance d’Élie
  rationale: « Avec » exprime naturellement en français la manière et les moyens de cette mission prophétique, tout en maintenant les termes « esprit » et « puissance » du grec.
- source_word: ἐπιστρέψαι
  choice: pour ramener
  rationale: L’infinitif exprime ici le but. « Ramener » convient aux deux compléments coordonnés et rend l’idée d’un changement d’orientation.
- source_word: καρδίας πατέρων ἐπὶ τέκνα
  choice: le cœur des pères vers les enfants
  rationale: La formulation reste proche du grec et préserve l’écho à Malachie, sans ajouter le possessif « leurs », absent du texte source.
- source_word: ἀπειθεῖς
  choice: les désobéissants
  rationale: Le terme désigne ceux qui refusent de se laisser persuader et, par conséquent, n’obéissent pas. « Désobéissants » conserve cette ampleur sans accentuer indûment la notion de rébellion.
- source_word: ἐν φρονήσει δικαίων
  choice: à la sagesse des justes
  rationale: Après « ramener », la préposition est rendue selon sa valeur directionnelle dans la construction. « Sagesse » exprime ici une intelligence pratique et morale; d’autres nuances restent possibles et sont signalées en note.
- source_word: ἑτοιμάσαι κυρίῳ
  choice: afin de préparer pour le Seigneur
  rationale: Le second infinitif de but est distingué avec « afin de ». Le datif κυρίῳ indique celui pour qui le peuple est préparé, et κύριος est rendu par « Seigneur ».
- source_word: λαὸν κατεσκευασμένον
  choice: un peuple prêt
  rationale: Le participe parfait passif décrit l’état résultant de la préparation. « Un peuple prêt » est naturel, concis et évite la répétition maladroite de « préparer un peuple préparé ».
theological_decisions:
- issue: Identité et rôle exprimés par la référence à Élie
  choice: Conserver « avec l’esprit et la puissance d’Élie »
  alternative: Présenter Jean comme Élie revenu personnellement
  rationale: Le grec décrit la manière et la puissance de son ministère par rapport à Élie; il ne dit pas que Jean est littéralement Élie. La traduction maintient cependant l’allusion sans développer une interprétation doctrinale dans le texte.
- issue: Référent de αὐτοῦ et rapport avec κυρίῳ
  choice: Garder « devant lui » et « pour le Seigneur »
  alternative: Expliciter « devant Jésus » ou « devant le Messie »
  rationale: Le contexte permet d’identifier le référent, mais le verset emploie un pronom puis le titre « Seigneur ». Les conserver respecte la formulation et la tension christologique du texte grec sans l’expliciter davantage.
- issue: Sens de ἐν φρονήσει δικαίων
  choice: « à la sagesse des justes »
  alternative: « dans la manière de penser des justes » ou « à la prudence des justes »
  rationale: La construction peut décrire l’orientation vers la compréhension pratique propre aux justes. La traduction principale est idiomatique, tandis que la note préserve les principales nuances lexicales.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la structure prophétique et les deux infinitifs de but, tout en utilisant « afin de » pour alléger l’enchaînement. Les pronoms et le titre « Seigneur » restent non explicités, comme dans le grec.
