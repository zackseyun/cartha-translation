source:
  edition: SBLGNT
  text: Καὶ Ζαχαρίας ὁ πατὴρ αὐτοῦ ἐπλήσθη πνεύματος ἁγίου καὶ ⸀ἐπροφήτευσεν λέγων·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/067.yaml
  text: 'And Zechariah his father was filled with the Holy Spirit and prophesied, saying:'
translation:
  language: fr
  text: 'Et Zacharie, son père, fut rempli de l’Esprit Saint et prophétisa en disant :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ζαχαρίας
  choice: Zacharie
  rationale: Forme française traditionnelle et courante du nom biblique grec Ζαχαρίας.
- source_word: ὁ πατὴρ αὐτοῦ
  choice: son père
  rationale: Rendu idiomatique du groupe nominal grec avec pronom au génitif; le pronom renvoie à l’enfant mentionné dans le contexte.
- source_word: ἐπλήσθη
  choice: fut rempli
  rationale: L’aoriste passif exprime ici un événement ponctuel; le passé simple convient au registre narratif biblique soutenu et conserve la voix passive.
- source_word: πνεύματος ἁγίου
  choice: de l’Esprit Saint
  rationale: Après «remplir», le français emploie naturellement «de». Dans le contexte lucanien d’inspiration divine, l’expression désigne l’Esprit Saint.
- source_word: ἐπροφήτευσεν
  choice: prophétisa
  rationale: Équivalent direct qui conserve la portée prophétique de l’énoncé inspiré.
- source_word: λέγων
  choice: en disant
  rationale: Le participe introduit le contenu de la prophétie; «en disant» préserve cette fonction et mène naturellement au discours qui suit.
- source_word: Καὶ
  choice: Et
  rationale: Conserve la continuité narrative marquée par la conjonction grecque et reste naturel dans ce contexte.
theological_decisions:
- issue: Référent de πνεύματος ἁγίου
  choice: l’Esprit Saint
  alternative: un esprit saint
  rationale: Dans Luc–Actes, cette expression, notamment dans un contexte d’inspiration prophétique, renvoie régulièrement à l’Esprit de Dieu. L’article français est nécessaire pour désigner ce référent personnel sans ajouter de précision doctrinale absente du texte.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple maintient le ton narratif solennel sans archaïsme lexical. La formulation suit étroitement l’ordre et les relations du grec tout en restant idiomatique.
