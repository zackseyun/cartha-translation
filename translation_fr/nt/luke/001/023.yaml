id: LUK.1.23
reference: Luke 1:23
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἐγένετο ὡς ἐπλήσθησαν αἱ ἡμέραι τῆς λειτουργίας αὐτοῦ, ἀπῆλθεν εἰς τὸν οἶκον αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/023.yaml
  text: And it happened that when the days of his service were completed[b][a], he went to his home.
translation:
  language: fr
  text: Quand les jours de son service[a] furent achevés, il rentra chez lui[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Il s’agit de la période de service sacerdotal que Zacharie devait accomplir au temple.
    reason: cultural_note
  - marker: b
    text: Ou « dans sa maison ». Le grec peut désigner la maison elle-même ou, plus largement, le domicile ou le foyer.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: non traduit séparément
  rationale: Cette formule narrative fréquente chez Luc sert ici à introduire l’événement. En français moderne, la rendre littéralement par « il arriva que » alourdirait la phrase sans ajouter de contenu.
- source_word: ὡς
  choice: quand
  rationale: La conjonction introduit ici une proposition temporelle; « quand » est naturel et fidèle au contexte.
- source_word: ἐπλήσθησαν
  choice: furent achevés
  rationale: Le passif indique que les jours assignés sont arrivés à leur terme. « Furent achevés » conserve cette idée sans employer le plus théologique « accomplis ».
- source_word: λειτουργίας
  choice: service
  rationale: Dans le contexte, le terme désigne la période de service sacerdotal de Zacharie au temple. Le texte reste concis, tandis qu’une note explicite le cadre cultuel.
- source_word: ἀπῆλθεν
  choice: rentra
  rationale: Puisque Zacharie quitte son lieu de service pour aller chez lui, « rentra » exprime naturellement le mouvement de retour impliqué par le contexte, bien que le verbe grec signifie plus généralement « s’en alla ».
- source_word: εἰς τὸν οἶκον αὐτοῦ
  choice: chez lui
  rationale: Cette expression française désigne naturellement le domicile sans limiter οἶκος au seul bâtiment; elle préserve ainsi sa portée possible de maison ou de foyer.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La formule narrative grecque n’est pas reproduite mécaniquement; la phrase française conserve clairement la succession temporelle. Les marqueurs de notes figurent immédiatement après les expressions concernées.
