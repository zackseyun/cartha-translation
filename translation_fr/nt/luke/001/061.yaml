id: LUK.1.61
reference: Luke 1:61
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ εἶπαν πρὸς αὐτὴν ὅτι Οὐδείς ἐστιν ⸂ἐκ τῆς συγγενείας⸃ σου ὃς καλεῖται τῷ ὀνόματι τούτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/061.yaml
  text: And they said to her[a], “None of your relatives is called by this name.”
translation:
  language: fr
  text: 'Ils lui dirent : « Il n’y a personne dans ta parenté qui porte ce nom. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ εἶπαν πρὸς αὐτὴν
  choice: Ils lui dirent
  rationale: Dans ce récit au passé, l’aoriste εἶπαν se rend naturellement par le passé simple « dirent ». Avec un verbe de parole, πρός + accusatif désigne la personne à qui l’on s’adresse, d’où le pronom indirect idiomatique « lui ».
- source_word: Οὐδείς ἐστιν ἐκ τῆς συγγενείας σου
  choice: Il n’y a personne dans ta parenté
  rationale: Cette formulation française exprime naturellement l’absence de toute personne appartenant au groupe familial. « Parenté » conserve le sens collectif de συγγένεια sans le limiter au foyer immédiat.
- source_word: ὃς καλεῖται
  choice: qui porte
  rationale: Avec un nom comme complément, le passif de καλέω signifie être appelé ou nommé. En français, « porter un nom » est naturel et évite la tournure moins fluide « qui est appelé ».
- source_word: τῷ ὀνόματι τούτῳ
  choice: ce nom
  rationale: « Ce » traduit le démonstratif τούτῳ et renvoie au nom Jean qui vient d’être proposé.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. Le tutoiement correspond à l’adresse singulière à Élisabeth. La coordination initiale καί n’est pas rendue séparément, car l’enchaînement narratif français reste naturel sans « et ».
