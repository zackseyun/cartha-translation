  text: καὶ ἐταράχθη Ζαχαρίας ἰδών, καὶ φόβος ἐπέπεσεν ἐπ’ αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/012.yaml
  text: And Zechariah was troubled when he saw him[a], and fear fell upon him.
translation:
  language: fr
  text: En le voyant, Zacharie fut troublé, et la peur s’empara de lui.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐταράχθη
  choice: fut bouleversé
  rationale: L’aoriste passif de ταράσσω exprime ici un profond trouble intérieur. « Fut bouleversé » est naturel en français et reste distinct de la peur explicitement nommée ensuite.
- source_word: Ζαχαρίας
  choice: Zacharie
  rationale: Forme française traditionnelle et courante du nom biblique.
- source_word: ἰδών
  choice: À cette vue
  rationale: Le participe aoriste a une valeur temporelle et causale légère dans ce contexte. Cette formulation idiomatique renvoie clairement à l’apparition de l’ange au verset précédent sans ajouter un objet absent du grec.
- source_word: φόβος
  choice: la peur
  rationale: Rend directement le sens général de φόβος sans l’intensifier en « terreur » ou en « effroi ».
- source_word: ἐπέπεσεν ἐπ’ αὐτόν
  choice: s’empara de lui
  rationale: L’expression grecque signifie littéralement que la peur « tomba sur lui ». L’idiome français choisi conserve l’idée d’une peur soudaine et envahissante tout en restant naturel.
theological_decisions: []
translation_notes:
  register: Français moderne, courant et digne. La phrase conserve la progression entre le bouleversement intérieur de Zacharie et la peur qui le saisit, sans surcharger le verset d’un registre archaïque.
