id: LUK.1.27
reference: Luke 1:27
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: πρὸς παρθένον ⸀ἐμνηστευμένην ἀνδρὶ ᾧ ὄνομα Ἰωσὴφ ἐξ οἴκου Δαυίδ, καὶ τὸ ὄνομα τῆς παρθένου Μαριάμ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/027.yaml
  text: to a virgin pledged in marriage to a man whose name was Joseph, from the house of David; and the virgin’s name was Mary.
translation:
  language: fr
  text: à une vierge fiancée[a] à un homme du nom de Joseph, de la maison de David. Le nom de la vierge était Marie[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « promise en mariage ». Il s’agissait d’un engagement formel ayant une portée juridique et sociale plus forte que celle des fiançailles modernes.
    reason: lexical_alternative
  - marker: b
    text: Ou « Mariam », transcription plus proche de la forme grecque du nom.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρθένον / παρθένου
  choice: vierge
  rationale: Le sens normal du terme dans ce contexte est « vierge »; sa répétition dans le verset doit être conservée.
- source_word: ἐμνηστευμένην
  choice: fiancée
  rationale: Le participe parfait désigne un état établi de fiançailles formelles. « Fiancée » est naturel en français moderne; la note précise que cet engagement avait une portée juridique et sociale plus forte que les fiançailles modernes.
- source_word: ἀνδρὶ
  choice: à un homme
  rationale: ἀνήρ peut signifier « homme » ou « mari », mais ici la construction liée aux fiançailles favorise « homme » et évite de suggérer que la vie conjugale avait déjà commencé.
- source_word: ᾧ ὄνομα Ἰωσὴφ
  choice: du nom de Joseph
  rationale: Cette tournure rend naturellement en français la formule grecque de dénomination.
- source_word: ἐξ οἴκου Δαυίδ
  choice: de la maison de David
  rationale: Cette expression conserve le langage biblique dynastique et généalogique sans le réduire au seul concept de lignée.
- source_word: Μαριάμ
  choice: Marie
  rationale: « Marie » est la forme française traditionnelle et courante de ce nom; « Mariam » transcrit plus directement la forme grecque.
theological_decisions:
- issue: Rendre παρθένος de manière à préserver son sens virginal dans le récit de l'enfance chez Luc
  choice: vierge
  alternative: jeune femme
  rationale: Le lexique grec, la répétition du mot et le contexte immédiat appuient clairement « vierge », sans qu'il soit nécessaire d'ajouter une interprétation au texte.
translation_notes:
  register: Français international moderne, naturel et digne. « Fiancée » assure la lisibilité, tandis que la note conserve la force institutionnelle du terme grec. La répétition de « vierge » et l’expression « maison de David » sont maintenues.
