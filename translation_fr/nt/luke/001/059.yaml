id: LUK.1.59
reference: Luke 1:59
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ἐν τῇ ⸂ἡμέρᾳ τῇ ὀγδόῃ⸃ ἦλθον περιτεμεῖν τὸ παιδίον, καὶ ἐκάλουν αὐτὸ ἐπὶ τῷ ὀνόματι τοῦ πατρὸς αὐτοῦ Ζαχαρίαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/059.yaml
  text: And it happened that on the eighth day they came to circumcise the child[a], and they were calling him Zechariah[b], after the name of his father.
translation:
  language: fr
  text: Le huitième jour, ils vinrent pour circoncire l’enfant et allaient l’appeler[a] Zacharie, du nom de son père[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ils l’appelaient Zacharie ». L’imparfait grec peut décrire une désignation en cours ou envisagée, ce qui s’accorde avec l’objection formulée au verset suivant.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « ils l’appelaient du nom de son père, Zacharie » ; il s’agit de donner à l’enfant le nom d’un membre de sa famille.'
    reason: cultural_note
lexical_decisions:
- source_word: Καὶ ἐγένετο
  choice: Le huitième jour
  rationale: La formule narrative sémitisante introduit ici la circonstance temporelle. En français moderne, son effet est rendu naturellement sans calquer « et il arriva ».
- source_word: ἐν τῇ ἡμέρᾳ τῇ ὀγδόῃ
  choice: Le huitième jour
  rationale: Rend directement et idiomatiquement l’indication temporelle précise.
- source_word: ἦλθον
  choice: ils vinrent
  rationale: Conserve le sujet pluriel implicite et indéfini du grec, sans préciser l’identité des personnes.
- source_word: περιτεμεῖν
  choice: pour circoncire
  rationale: L’infinitif exprime le but de leur venue.
- source_word: τὸ παιδίον
  choice: l’enfant
  rationale: Traduction directe, naturelle et digne de παιδίον dans ce contexte.
- source_word: ἐκάλουν
  choice: voulaient l’appeler
  rationale: L’imparfait grec présente une désignation en cours ou envisagée, ensuite contestée au verset suivant. Cette formulation française préserve cette tension sans présenter le nom comme définitivement attribué.
- source_word: ἐπὶ τῷ ὀνόματι τοῦ πατρὸς αὐτοῦ
  choice: du nom de son père
  rationale: Expression française naturelle indiquant que l’enfant devait recevoir le même nom que son père.
- source_word: Ζαχαρίαν
  choice: Zacharie
  rationale: Forme française traditionnelle et courante du nom biblique.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Le tour archaïsant « Et il arriva que » est évité, tandis que l’aspect non achevé de ἐκάλουν et le sujet pluriel indéfini sont préservés.
