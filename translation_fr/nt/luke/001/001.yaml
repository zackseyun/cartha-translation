id: LUK.1.1
reference: Luke 1:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἐπειδήπερ πολλοὶ ἐπεχείρησαν ἀνατάξασθαι διήγησιν περὶ τῶν πεπληροφορημένων ἐν ἡμῖν πραγμάτων,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/001.yaml
  text: Since many have undertaken to compile an account concerning the matters that have been fulfilled among us,[a]
translation:
  language: fr
  text: Puisque beaucoup ont entrepris de composer un récit des événements qui se sont accomplis parmi nous,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qui ont été accomplis parmi nous » ou « qui ont été pleinement confirmés parmi nous ».
    reason: Alternative lexicale pour πεπληροφορημένων, dont le sens peut relever de l’accomplissement ou, selon l’analyse, de la pleine confirmation.
lexical_decisions:
- source_word: Ἐπειδήπερ
  choice: Puisque
  rationale: Introduit avec naturel le motif qui ouvre la préface formelle de Luc. « Puisque » rend la valeur causale sans archaïsme.
- source_word: πολλοὶ
  choice: beaucoup
  rationale: Rend simplement l’adjectif quantitatif sans ajouter « d’autres », absent du grec.
- source_word: ἐπεχείρησαν
  choice: ont entrepris
  rationale: Exprime l’engagement dans un projet littéraire sans laisser entendre que celui-ci aurait échoué.
- source_word: ἀνατάξασθαι
  choice: de composer
  rationale: Dans ce contexte littéraire, le verbe désigne la mise en forme organisée d’un récit. « Composer » est actuel, naturel et soutenu.
- source_word: διήγησιν
  choice: un récit
  rationale: Rend le caractère narratif et historiographique du substantif avec un terme courant en français.
- source_word: περὶ
  choice: des
  rationale: La construction idiomatique « un récit des événements » exprime naturellement en français le rapport thématique marqué par περί.
- source_word: τῶν πεπληροφορημένων
  choice: qui se sont accomplis
  rationale: Le parfait passif évoque vraisemblablement des événements menés à leur accomplissement. La formulation conserve la portée possible d’accomplissement théologique sans la préciser davantage.
- source_word: ἐν ἡμῖν
  choice: parmi nous
  rationale: Préserve la référence collective sans identifier plus précisément le groupe visé.
- source_word: πραγμάτων
  choice: les événements
  rationale: Dans une introduction narrative, « événements » est plus idiomatique que « choses » ou « faits » et convient à ce qui s’est produit parmi les témoins.
theological_decisions:
- issue: Sens de πεπληροφορημένων dans la préface de Luc
  choice: qui se sont accomplis
  alternative: qui ont été menés à leur accomplissement ; qui ont été pleinement confirmés parmi nous
  rationale: Avec πραγμάτων, le sens d’événements accomplis paraît le plus probable et correspond au motif lucanien de l’accomplissement. Le verbe peut toutefois recevoir une nuance de pleine confirmation ou de certitude ; cette possibilité est conservée en note plutôt que supprimée.
translation_notes:
  register: Français international moderne, digne et fluide. La tournure garde le ton formel de la préface tout en évitant des formulations vieillies telles que « attendu que » ou excessivement techniques telles que « compiler une narration ».
