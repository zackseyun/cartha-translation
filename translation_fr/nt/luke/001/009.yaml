id: LUK.1.9
reference: Luke 1:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: κατὰ τὸ ἔθος τῆς ἱερατείας ἔλαχε τοῦ θυμιᾶσαι εἰσελθὼν εἰς τὸν ναὸν τοῦ κυρίου,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/009.yaml
  text: according to the custom of the priesthood[a], he was chosen by lot to burn incense when he entered into the temple of the Lord,
translation:
  language: fr
  text: Conformément à la coutume du service sacerdotal, le sort le désigna pour brûler l’encens une fois entré dans le Temple du Seigneur[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans le sanctuaire du Seigneur ». Le mot grec ναός désigne souvent le bâtiment du Temple proprement dit, en particulier le sanctuaire, plutôt que l’ensemble de son enceinte et de ses cours.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ τὸ ἔθος
  choice: conformément à la coutume
  rationale: La préposition κατά avec l’accusatif et ἔθος exprime la conformité à une pratique établie. Cette formulation est naturelle en français et conserve ce rapport normatif.
- source_word: τῆς ἱερατείας
  choice: du service sacerdotal
  rationale: ἱερατεία désigne ici la fonction ou le service des prêtres et, dans le contexte, les usages qui régissent ce service. « Service sacerdotal » rend cette dimension plus précisément que le seul collectif « prêtres ».
- source_word: ἔλαχε
  choice: le sort le désigna
  rationale: Le verbe λαγχάνω indique qu’une tâche ou une part est obtenue par tirage au sort. La tournure française explicite clairement ce procédé sans suggérer un simple choix humain.
- source_word: τοῦ θυμιᾶσαι
  choice: pour brûler l’encens
  rationale: L’infinitif articularisé précise la tâche attribuée par le sort. θυμιάω désigne ici l’action cultuelle de faire brûler de l’encens.
- source_word: εἰσελθὼν
  choice: une fois entré
  rationale: Le participe aoriste situe l’entrée dans le sanctuaire par rapport à l’offrande de l’encens. « Une fois entré » exprime cette relation temporelle sans transformer l’entrée elle-même en objet du tirage au sort.
- source_word: εἰς τὸν ναὸν
  choice: dans le temple
  rationale: ναός désigne le bâtiment sacré et, souvent plus précisément, le sanctuaire intérieur, par opposition à l’ensemble de l’enceinte. « Temple » reste immédiatement compréhensible dans le texte principal; la précision « sanctuaire » est signalée en note.
- source_word: τοῦ κυρίου
  choice: du Seigneur
  rationale: κύριος désigne Dieu dans ce contexte cultuel. « Seigneur » rend directement le terme grec sans introduire explicitement le nom divin.
theological_decisions:
- issue: Portée de ναός dans le contexte du culte au Temple
  choice: temple
  alternative: sanctuaire
  rationale: Dans ce contexte, ναός vise vraisemblablement le sanctuaire intérieur où l’encens était offert, et non toute l’enceinte du Temple. Le texte principal emploie le terme courant « temple », tandis que la note conserve la précision lexicale possible.
translation_notes:
  register: Français international moderne, naturel et digne. L’ordre de la phrase met clairement en relation le tirage au sort avec l’offrande de l’encens, tout en conservant la valeur temporelle du participe εἰσελθών.
