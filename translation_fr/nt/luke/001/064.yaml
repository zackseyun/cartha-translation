  source_fidelity: Le texte conserve correctement l’ouverture immédiate de la bouche, la mention distincte de la langue, puis l’imparfait ἐλάλει avec le participe εὐλογῶν. La construction grecque coordonnant « sa langue » sans exprimer un second verbe est inhabituelle; il convient de ne pas la résoudre par « sa langue se délia », expression interprétative absente du texte édité.
