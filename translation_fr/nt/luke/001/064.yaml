source:
  edition: SBLGNT
  text: ἀνεῴχθη δὲ τὸ στόμα αὐτοῦ παραχρῆμα καὶ ἡ γλῶσσα αὐτοῦ, καὶ ἐλάλει εὐλογῶν τὸν θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/064.yaml
  text: And immediately his mouth was opened[a], and his tongue also, and he began speaking[b], blessing God.
translation:
  language: fr
  text: Aussitôt, sa bouche s’ouvrit, et sa langue aussi ; il se mit à parler[a] en bénissant Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « il parlait en bénissant Dieu ». L’imparfait grec peut souligner la continuité de l’action de parler plutôt que son commencement.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνεῴχθη
  choice: s’ouvrit
  rationale: L’aoriste passif exprime ici l’ouverture soudaine de la bouche. Le pronominal français est naturel et n’impose pas d’agent explicite.
- source_word: δὲ
  choice: non rendu séparément
  rationale: Cette particule assure une transition narrative légère; en français, l’enchaînement avec « Aussitôt » suffit sans alourdir la phrase.
- source_word: στόμα
  choice: bouche
  rationale: Équivalent anatomique direct, approprié au rétablissement de la parole.
- source_word: παραχρῆμα
  choice: Aussitôt
  rationale: Rend la soudaineté et la succession immédiate des événements.
- source_word: καὶ ἡ γλῶσσα αὐτοῦ
  choice: ainsi que sa langue
  rationale: Conserve la mention explicite de la langue et la coordonne à la bouche sans ajouter « fut déliée », absent du grec.
- source_word: ἐλάλει
  choice: il se mit à parler
  rationale: Dans le contexte de la fin du mutisme, cette formulation rend naturellement la valeur inchoative possible de l’imparfait, tout en signalant en note que l’aspect peut aussi évoquer une action continue.
- source_word: εὐλογῶν
  choice: en bénissant
  rationale: Le participe présent précise ce qui caractérise sa parole; « bénir » est l’équivalent lexical direct et conserve la formulation théologique du grec.
- source_word: τὸν θεόν
  choice: Dieu
  rationale: Objet direct de « bénissant »; l’usage français omet naturellement l’article devant le nom divin.
theological_decisions: []
translation_notes:
  register: Français moderne, fluide et digne. La formulation évite le traditionnel « sa langue se délia », qui ajoute une idée absente du texte grec, tout en conservant la mention inhabituelle de la bouche et de la langue.
