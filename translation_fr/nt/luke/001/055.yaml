id: LUK.1.55
reference: Luke 1:55
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καθὼς ἐλάλησεν πρὸς τοὺς πατέρας ἡμῶν, τῷ Ἀβραὰμ καὶ τῷ σπέρματι αὐτοῦ εἰς τὸν αἰῶνα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/055.yaml
  text: just as he spoke to our fathers[b][a], to Abraham and to his offspring forever.
translation:
  language: fr
  text: comme il l’avait dit à nos pères[a], à Abraham et à sa descendance[b] pour toujours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à nos ancêtres ». Le grec dit littéralement « à nos pères ».
    reason: lexical_alternative
  - marker: b
    text: Ou « à sa semence ». Le grec emploie un nom collectif singulier pouvant désigner la semence, la descendance ou les descendants.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς
  choice: comme
  rationale: Introduit la conformité entre l’intervention de Dieu évoquée juste avant et sa parole antérieure; « comme » est naturel et fidèle.
- source_word: ἐλάλησεν
  choice: il l’avait dit
  rationale: Le verbe signifie ici « parler, dire ». Le plus-que-parfait exprime naturellement en français l’antériorité de cette parole adressée aux ancêtres, sans ajouter explicitement la notion de promesse.
- source_word: πρὸς τοὺς πατέρας ἡμῶν
  choice: à nos pères
  rationale: Conserve la formulation masculine explicite du grec et sa résonance patriarcale et historique; « nos ancêtres » reste une possibilité idiomatique signalée en note.
- source_word: τῷ Ἀβραὰμ
  choice: à Abraham
  rationale: Le datif prolonge les destinataires de la parole et présente Abraham en apposition à « nos pères ».
- source_word: τῷ σπέρματι αὐτοῦ
  choice: à sa descendance
  rationale: « Descendance » est un collectif singulier naturel en français qui conserve la forme collective de σπέρμα sans imposer un pluriel explicatif.
- source_word: εἰς τὸν αἰῶνα
  choice: pour toujours
  rationale: Rend de façon idiomatique l’expression de durée indéfinie ou perpétuelle.
theological_decisions:
- issue: Formulation masculine de πατέρας ἡμῶν dans le cadre de l’histoire de l’alliance
  choice: nos pères
  alternative: nos ancêtres
  rationale: Le grec emploie explicitement le masculin pluriel et évoque les pères d’Israël. La traduction le conserve, tout en donnant en note l’équivalent collectif courant.
- issue: Valeur collective singulière de σπέρμα dans la parole adressée à Abraham
  choice: sa descendance
  alternative: sa semence; ses descendants
  rationale: « Descendance » préserve à la fois le caractère collectif et le singulier grammatical. La note maintient visible l’image littérale de la semence et évite de trancher les résonances intertextuelles du terme.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe suit l’apposition grecque sans l’alourdir; le plus-que-parfait est idiomatique dans ce rappel d’une parole divine antérieure.
