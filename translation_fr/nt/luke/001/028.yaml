source:
  edition: SBLGNT
  text: καὶ ⸀εἰσελθὼν πρὸς αὐτὴν εἶπεν· Χαῖρε, κεχαριτωμένη, ὁ κύριος μετὰ ⸀σοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/028.yaml
  text: And coming in to her[a], he said, “Greetings, favored one[b]; the Lord is with you.”
translation:
  language: fr
  text: 'Il entra et lui dit : « Je te salue[a], toi qui as été favorisée[b] ! Le Seigneur est avec toi. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Réjouis-toi »; traditionnellement, « Salut » ou « Je vous salue ». Le mot grec sert couramment de salutation, bien qu’il signifie formellement « réjouis-toi ».
    reason: lexical_alternative
  - marker: b
    text: Ou « toi qui as été grandement favorisée », « toi qui as reçu grâce »; traditionnellement, « comblée de grâce ». Le grec désigne une personne qui a reçu grâce ou faveur.
    reason: alternative_reading
lexical_decisions:
- source_word: εἰσελθὼν πρὸς αὐτὴν
  choice: Il entra et lui dit
  rationale: Le participe aoriste indique l’entrée qui précède la parole, tandis que πρὸς αὐτήν marque que l’action est dirigée vers Marie. Cette formulation française reste naturelle sans préciser, comme le ferait « chez elle », qu’il s’agit nécessairement de son domicile.
- source_word: Χαῖρε
  choice: Je te salue
  rationale: Dans ce contexte, l’impératif de χαίρω fonctionne comme une salutation. « Je te salue » en rend naturellement la fonction en français moderne, tandis que le sens formel « Réjouis-toi » est conservé en note.
- source_word: κεχαριτωμένη
  choice: toi qui as reçu la faveur de Dieu
  rationale: Le participe parfait passif de χαριτόω présente Marie comme bénéficiaire d’une faveur ou grâce accordée. La tournure française exprime clairement ce sens passif et l’effet durable de l’action, sans faire de la grâce une qualité intrinsèque. La mention de Dieu explicite l’agent implicite dans ce contexte théologique.
- source_word: ὁ κύριος
  choice: Le Seigneur
  rationale: « Seigneur » est le titre français biblique courant pour κύριος lorsqu’il désigne Dieu.
- source_word: μετὰ σοῦ
  choice: est avec toi
  rationale: Le grec signifie littéralement « avec toi »; le français exige ici le verbe « être », sous-entendu dans la proposition grecque.
theological_decisions:
- issue: Traduction de κεχαριτωμένη dans un passage marial sensible
  choice: toi qui as reçu la faveur de Dieu
  alternative: comblée de grâce
  rationale: 'Le choix principal préserve la valeur passive du participe : Marie est bénéficiaire de la faveur divine. Il évite de trancher en faveur d’élaborations doctrinales ultérieures, tout en affirmant pleinement la grâce qui lui a été accordée. La formulation traditionnelle est signalée en note.'
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement correspond au singulier grec σοῦ et à l’usage narratif biblique actuel. La formulation évite à la fois l’archaïsme et une terminologie confessionnelle chargée.
