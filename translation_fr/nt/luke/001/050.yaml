  text: καὶ τὸ ἔλεος αὐτοῦ εἰς γενεὰς ⸂καὶ γενεὰς⸃ τοῖς φοβουμένοις αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/050.yaml
  text: And his mercy is for those who fear him from generation to generation[a][b][c].
translation:
  language: fr
  text: Et sa miséricorde s’étend de génération en génération à ceux qui le craignent.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec dit littéralement « pour des générations et des générations ». « Ceux qui le craignent » désigne ceux qui vivent dans une crainte révérencielle de Dieu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεος
  choice: bonté
  rationale: Dans le Magnificat, ἔλεος désigne la bonté compatissante et miséricordieuse de Dieu. « Bonté » est ici naturel en français et peut porter cette nuance relationnelle sans alourdir le vers.
- source_word: εἰς γενεὰς καὶ γενεὰς
  choice: de génération en génération
  rationale: Cette expression française idiomatique rend la continuité de la faveur divine à travers les générations successives, même si le grec dit plus littéralement « pour des générations et des générations ».
- source_word: τοῖς φοβουμένοις αὐτόν
  choice: pour ceux qui le craignent
  rationale: 'Le datif désigne les bénéficiaires. « Craindre Dieu » conserve l’expression biblique et sa tension sémantique : il s’agit ici d’une crainte empreinte de respect, sans réduire le terme à la seule idée de vénération.'
- source_word: καὶ
  choice: Et
  rationale: La conjonction relie ce vers aux affirmations précédentes et maintient le mouvement cumulatif du cantique.
- source_word: αὐτοῦ / αὐτόν
  choice: sa / le
  rationale: Les pronoms renvoient à Dieu dans le contexte immédiat. Les formes françaises ordinaires suffisent sans ajout interprétatif.
theological_decisions:
- issue: Sens de la crainte de Dieu
  choice: ceux qui le craignent
  alternative: ceux qui le révèrent
  rationale: φοβέομαι, lorsque Dieu en est l’objet, peut exprimer une crainte révérencielle et une attitude de piété. Garder « craignent » préserve le langage biblique et sa profondeur, plutôt que d’en résoudre entièrement la nuance dans le texte principal.
- issue: Nuance de ἔλεος
  choice: bonté
  alternative: miséricorde
  rationale: « Miséricorde » est une traduction directe et traditionnelle, tandis que « bonté » est plus immédiatement accessible et convient au contexte de la fidélité bienveillante de Dieu. La note conserve l’autre possibilité importante.
translation_notes:
  register: Français international moderne, simple et digne. Le rythme du cantique est conservé par « Et » et par la tournure traditionnelle mais encore naturelle « de génération en génération ». Le marqueur de note suit la ponctuation conformément au format fourni.
