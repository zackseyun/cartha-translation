  text: καὶ ἀποκριθεῖσα ἡ μήτηρ αὐτοῦ εἶπεν· Οὐχί, ἀλλὰ κληθήσεται Ἰωάννης.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/060.yaml
  text: And his mother answered[a], “No; rather, he shall be called John.”
translation:
  language: fr
  text: 'Sa mère répondit : « Non, mais il s’appellera Jean. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεῖσα
  choice: répondit
  rationale: Le participe aoriste introduit ici la prise de parole en réponse à la proposition précédente ; une forme verbale conjuguée est naturelle en français.
- source_word: μήτηρ αὐτοῦ
  choice: sa mère
  rationale: Le possessif français rend naturellement la relation exprimée par le génitif αὐτοῦ.
- source_word: Οὐχί
  choice: Non !
  rationale: La négation renforcée exprime un refus net de donner à l’enfant le nom proposé au verset précédent.
- source_word: ἀλλὰ
  choice: Mais
  rationale: La conjonction marque une correction contrastive. En français, « mais » après un refus direct restitue naturellement cette opposition.
- source_word: κληθήσεται
  choice: Il s’appellera
  rationale: Le futur passif grec de καλέω a ici le sens d’attribution d’un nom ; la tournure pronominale est l’expression française courante et exacte.
- source_word: Ἰωάννης
  choice: Jean
  rationale: Forme française traditionnelle et largement reconnue du nom grec Ἰωάννης.
theological_decisions: []
translation_notes:
  register: Français moderne, direct et digne. La formulation conserve la fermeté de la réponse maternelle sans employer le futur littéraire « sera appelé », moins naturel dans ce contexte.
