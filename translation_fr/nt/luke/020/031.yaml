  text: καὶ ὁ τρίτος ἔλαβεν ⸀αὐτήν, ὡσαύτως δὲ καὶ οἱ ἑπτὰ οὐ κατέλιπον τέκνα καὶ ἀπέθανον·
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/031.yaml
  text: And the third took her[a], and likewise all seven left no children and died.
translation:
  language: fr
  text: Puis le troisième la prit pour femme. De même, tous les sept ne laissèrent pas d’enfants et moururent.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ τρίτος
  choice: le troisième
  rationale: Le grec conserve l’ellipse et ne répète pas « frère » ; le français la comprend naturellement grâce au contexte.
- source_word: ἔλαβεν αὐτήν
  choice: la prit pour femme
  rationale: Dans ce contexte de lévirat, l’expression signifie qu’il la prit comme épouse. Cette formulation française rend l’idiome clairement sans réduire le sens à la seule cérémonie du mariage.
- source_word: ὡσαύτως δὲ καὶ
  choice: De même
  rationale: Cette expression marque que le même scénario s’applique à la suite de la série ; « De même » est naturel et suffisamment explicite.
- source_word: οἱ ἑπτὰ
  choice: tous les sept
  rationale: La tournure désigne l’ensemble complet des sept frères ; « tous les sept » en exprime naturellement la portée globale.
- source_word: οὐ κατέλιπον τέκνα
  choice: sans laisser d’enfants
  rationale: καταλείπω évoque les enfants laissés après la mort. La construction française relie clairement l’absence de descendance au décès.
- source_word: τέκνα
  choice: enfants
  rationale: « Enfants » est le sens direct et courant de τέκνα et convient ici pour la descendance.
- source_word: ἀπέθανον
  choice: moururent
  rationale: Le verbe grec signifie directement « mourir » ; le passé simple convient au registre narratif biblique, tout en restant courant et digne.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La traduction explicite l’idiome matrimonial grec dans le texte principal afin d’éviter l’ambiguïté peu naturelle de « la prit », tout en conservant l’ellipse « le troisième ». La seconde phrase regroupe naturellement l’absence d’enfants et la mort des sept.
