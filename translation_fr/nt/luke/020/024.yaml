  variant: modern international French
source:
  edition: SBLGNT
  text: ⸀Δείξατέ μοι δηνάριον· τίνος ἔχει εἰκόνα καὶ ἐπιγραφήν; ⸀ἀποκριθέντες δὲ εἶπαν· Καίσαρος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/024.yaml
  text: Show me a denarius. Whose image and inscription does it have? And they answered[a], 'Caesar's.'
translation:
  language: fr
  text: '« Montrez-moi un denier[a]. De qui sont l’image et l’inscription qu’il porte ? » Ils répondirent : « De César. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le denier était une monnaie romaine couramment utilisée à cette époque ; son nom historique est conservé pour préserver le cadre du récit.
    reason: cultural_note
lexical_decisions:
- source_word: Δείξατέ μοι
  choice: Montrez-moi
  rationale: L’impératif aoriste exprime un ordre direct; « Montrez-moi » est naturel, précis et conserve cette force.
- source_word: δηνάριον
  choice: un denier
  rationale: Le nom historique de la monnaie est conservé afin de préserver le cadre culturel; en français biblique et historique, « denier » est la désignation usuelle du denarius romain.
- source_word: τίνος ἔχει
  choice: De qui porte-t-il
  rationale: La tournure française naturelle « De qui porte-t-il… ? » rend l’interrogatif génitif τίνος et le verbe ἔχει sans suggérer que la pièce elle-même appartient nécessairement à César.
- source_word: εἰκόνα
  choice: l’image
  rationale: « Image » conserve l’étendue sémantique de εἰκών tout en désignant clairement l’effigie figurant sur la monnaie.
- source_word: ἐπιγραφήν
  choice: l’inscription
  rationale: Dans le contexte monétaire, « inscription » désigne précisément le texte gravé sur la pièce et reste immédiatement compréhensible.
- source_word: ἀποκριθέντες δὲ εἶπαν
  choice: Ils répondirent
  rationale: Cette formulation française fluide rend la construction participiale suivie du verbe de parole, sans reproduire lourdement « répondant, ils dirent ».
- source_word: Καίσαρος
  choice: De César
  rationale: Le grec répond elliptiquement par le seul génitif. « De César » conserve cette brièveté et répond directement à la question formulée avec « De qui ».
theological_decisions: []
