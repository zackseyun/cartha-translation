  text: until I make your enemies a footstool for your feet[a].
translation:
  language: fr
  text: jusqu’à ce que je fasse de tes ennemis ton marchepied[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Litt. : « jusqu’à ce que je place tes ennemis comme marchepied de tes pieds ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕως ἂν
  choice: jusqu’à ce que
  rationale: Cette locution rend naturellement en français le terme futur introduit par ἕως avec ἄν, sans alourdir la formulation.
- source_word: θῶ
  choice: je fasse de
  rationale: τίθημι signifie littéralement « mettre, placer », mais avec « marchepied », la tournure résultative « faire de… un marchepied » est naturelle et fidèle à l’image du psaume.
- source_word: τοὺς ἐχθρούς σου
  choice: tes ennemis
  rationale: Traduction directe de l’objet à l’accusatif accompagné du possessif, sans atténuer l’hostilité exprimée.
- source_word: ὑποπόδιον
  choice: un marchepied
  rationale: Le nom désigne un marchepied ou repose-pieds. « Marchepied » conserve en français courant l’image royale de soumission et convient à la forme sans article du grec.
- source_word: τῶν ποδῶν σου
  choice: pour tes pieds
  rationale: Le grec dit littéralement « de tes pieds ». La formulation « pour tes pieds » est idiomatique en français avec « marchepied » et préserve la métaphore sans l’expliciter par « sous tes pieds ».
theological_decisions:
- issue: Image de soumission dans la citation du Psaume 110.1
  choice: Conserver la métaphore « faire de tes ennemis un marchepied pour tes pieds »
  alternative: jusqu’à ce que je mette tes ennemis sous tes pieds
  rationale: La formulation maintient l’image royale et messianique de la citation sans la paraphraser en défaite totale ni préciser davantage la nature de la soumission.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement reflète les pronoms singuliers du texte grec et la citation adressée au Seigneur du psaume.
