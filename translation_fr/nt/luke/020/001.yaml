id: LUK.20.1
reference: Luke 20:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ἐν μιᾷ τῶν ⸀ἡμερῶν διδάσκοντος αὐτοῦ τὸν λαὸν ἐν τῷ ἱερῷ καὶ εὐαγγελιζομένου ἐπέστησαν οἱ ⸀ἀρχιερεῖς καὶ οἱ γραμματεῖς σὺν τοῖς πρεσβυτέροις,
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/001.yaml
  text: And it happened[a], on one of those days, while he was teaching the people in the temple and proclaiming the good news, that the chief priests and the scribes, together with the elders, came up to him[b],
translation:
  language: fr
  text: Un de ces jours-là, pendant qu’il enseignait le peuple dans le temple[b] et lui annonçait la bonne nouvelle[a], les chefs des prêtres et les scribes, avec les anciens, vinrent à lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « prêchait l’Évangile ».'
    reason: lexical_alternative
  - marker: b
    text: Le mot grec désigne ici l’ensemble du complexe du temple, et non seulement le sanctuaire intérieur.
    reason: cultural_note
lexical_decisions:
- source_word: Καὶ ἐγένετο
  choice: Or
  rationale: Cette transition narrative courante chez Luc introduit naturellement la scène en français moderne. Une traduction littérale comme « Et il arriva que » serait plus lourde et artificielle.
- source_word: ἐν μιᾷ τῶν ἡμερῶν
  choice: l’un de ces jours
  rationale: La formulation conserve l’idée d’un jour non précisé appartenant à la période évoquée par le contexte.
- source_word: διδάσκοντος αὐτοῦ
  choice: pendant qu’il enseignait
  rationale: Le génitif absolu exprime ici une action en cours, contemporaine de l’arrivée des responsables.
- source_word: τὸν λαὸν
  choice: le peuple
  rationale: λαός désigne le peuple de manière générale, et non simplement une foule présente sur place.
- source_word: ἐν τῷ ἱερῷ
  choice: dans le temple
  rationale: Formulation française naturelle, accompagnée d’une note précisant que ἱερόν désigne l’ensemble du complexe du temple.
- source_word: εὐαγγελιζομένου
  choice: lui annonçait la bonne nouvelle
  rationale: Cette expression rend le sens verbal d’annonce d’une bonne nouvelle dans une langue accessible, sans employer d’emblée une terminologie ecclésiastique plus technique.
- source_word: ἐπέστησαν
  choice: vinrent à lui
  rationale: La formulation indique leur arrivée directe auprès de Jésus sans accentuer indûment l’hostilité; le contexte immédiat exprimera leur contestation.
- source_word: ἀρχιερεῖς
  choice: les chefs des prêtres
  rationale: Au pluriel, le terme désigne les principaux responsables de l’aristocratie sacerdotale, et non plusieurs titulaires simultanés de la fonction unique de grand prêtre.
- source_word: γραμματεῖς
  choice: les scribes
  rationale: Ce terme conserve la désignation historique du groupe sans la réduire à une seule de ses fonctions.
- source_word: σὺν τοῖς πρεσβυτέροις
  choice: avec les anciens
  rationale: La préposition σύν marque explicitement l’accompagnement et l’action conjointe des différents groupes dirigeants.
theological_decisions:
- issue: Rendu de εὐαγγελιζομένου dans le récit du ministère public de Jésus
  choice: annonçait la bonne nouvelle
  alternative: prêchait l’Évangile
  rationale: Le choix retenu exprime directement le contenu lexical du verbe et évite de lui imposer une nuance ecclésiastique ultérieure, tout en laissant ouverte la portée théologique de cette bonne nouvelle.
translation_notes:
  register: Français international moderne, clair et digne. La phrase garde la progression du grec tout en remplaçant l’idiome narratif littéral par une transition française naturelle. « Chefs des prêtres » évite l’ambiguïté possible de « grands prêtres », tandis que « scribes » préserve la désignation historique.
