  text: καὶ προσέθετο ⸂τρίτον πέμψαι⸃· οἱ δὲ καὶ τοῦτον τραυματίσαντες ἐξέβαλον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/012.yaml
  text: And he sent a third[a]; but they wounded this one also and threw him out.
translation:
  language: fr
  text: Puis il envoya un troisième serviteur[a]. Mais ils blessèrent aussi ce troisième serviteur et le jetèrent dehors.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « il ajouta d’envoyer un troisième »; cette tournure signifie qu’il poursuivit son action en envoyant un troisième serviteur.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσέθετο … πέμψαι
  choice: il envoya
  rationale: La construction idiomatique signifie qu’il poursuivit son action en envoyant encore quelqu’un. En français, « il envoya » est naturel, et « un troisième » exprime déjà la répétition.
- source_word: τρίτον
  choice: un troisième serviteur
  rationale: Le nom est sous-entendu en grec d’après le contexte. Le rétablir en français clarifie immédiatement le référent sans modifier le sens.
- source_word: οἱ δὲ
  choice: Mais eux
  rationale: δέ marque ici le passage contrasté de l’action du propriétaire à la réaction des vignerons; le pronom conserve le sujet implicite fourni par le contexte.
- source_word: καὶ τοῦτον
  choice: eux aussi le
  rationale: καί indique que le troisième serviteur subit à son tour le même type de mauvais traitement. La tournure française « eux aussi le blessèrent » met naturellement en relief la répétition de leur conduite.
- source_word: τραυματίσαντες
  choice: le blessèrent
  rationale: τραυματίζω désigne directement le fait de causer une blessure; « blesser » en conserve la force précise.
- source_word: ἐξέβαλον
  choice: le jetèrent dehors
  rationale: ἐκβάλλω exprime une expulsion énergique, voire violente. « Jeter dehors » est actuel, clair et adapté à la scène.
theological_decisions: []
translation_notes:
  register: Français moderne, courant et digne. « Serviteur » est explicité d’après le contexte afin d’éviter une ellipse moins naturelle en français; la note conserve la forme idiomatique grecque.
