  text: who devour widows’ houses and for a pretense pray at length[b][a]. These will receive greater condemnation.
translation:
  language: fr
  text: eux qui dévorent les maisons[a] des veuves et qui, pour l’apparence, font de longues prières[b]. Ceux-là recevront un jugement plus sévère[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot peut désigner ici les biens ou les ressources du foyer.
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « sous un prétexte » ; le terme peut aussi évoquer une prière faite pour l’apparence.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « une condamnation plus lourde ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατεσθίουσιν
  choice: dévorent
  rationale: Le verbe est métaphorique et dénonce avec force l’exploitation rapace des veuves.
- source_word: τὰς οἰκίας
  choice: les biens
  rationale: Littéralement « les maisons » ; dans ce contexte, le terme désigne probablement par métonymie les possessions ou les ressources des veuves. « Les biens » rend clairement cette idée en français courant.
- source_word: τῶν χηρῶν
  choice: des veuves
  rationale: Rend directement le génitif pluriel et identifie les personnes vulnérables dépouillées.
- source_word: προφάσει
  choice: pour sauver les apparences
  rationale: Cette expression française naturelle traduit l’idée d’un motif affiché qui dissimule la réalité, tout en gardant la dimension d’hypocrisie.
- source_word: μακρὰ προσεύχονται
  choice: font de longues prières
  rationale: μακρά est employé adverbialement pour indiquer la longueur des prières ; cette formulation est naturelle et fidèle en français.
- source_word: λήμψονται
  choice: subiront
  rationale: Bien que le grec signifie littéralement « recevront », « subir un jugement » est l’expression française idiomatique pour un verdict défavorable.
- source_word: περισσότερον κρίμα
  choice: un jugement plus sévère
  rationale: Le comparatif indique une sanction judiciaire accrue. Cette formulation conserve la largeur sémantique de κρίμα tout en exprimant clairement son caractère défavorable dans le contexte.
theological_decisions:
- issue: Sens de κρίμα dans ce contexte
  choice: jugement
  alternative: condamnation
  rationale: Le contexte indique un jugement divin défavorable, mais « jugement » préserve mieux l’étendue lexicale de κρίμα sans expliciter davantage que le grec la nature exacte de la sentence.
- issue: Nature des « maisons » dévorées
  choice: biens
  alternative: maisons
  rationale: Le contexte évoque vraisemblablement l’exploitation des possessions des veuves. La note conserve toutefois le sens littéral afin de ne pas masquer la métonymie possible.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve l’image vigoureuse de « dévorer », explicite naturellement la valeur métonymique probable de « maisons » et maintient « jugement » afin de préserver la portée de κρίμα.
