id: LUK.20.16
reference: Luke 20:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐλεύσεται καὶ ἀπολέσει τοὺς γεωργοὺς τούτους, καὶ δώσει τὸν ἀμπελῶνα ἄλλοις. ἀκούσαντες δὲ εἶπαν· Μὴ γένοιτο.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/016.yaml
  text: He will come and destroy these tenant farmers[a], and will give the vineyard to others.” But when they heard this, they said[b], “May it never be!”
translation:
  language: fr
  text: 'Il viendra, fera périr ces vignerons[a] et donnera la vigne à d’autres. » Quand ils entendirent cela, ils dirent[b] : « Que cela n’arrive jamais ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « cultivateurs » ou « fermiers » ; le terme grec désigne ici ceux qui exploitaient une terre appartenant à quelqu’un d’autre.
    reason: lexical_alternative
  - marker: b
    text: 'Ou « Certainement pas ! » ou « Loin de là ! » L’expression grecque marque un rejet très fort ; littéralement : « Que cela n’arrive pas ! »'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐλεύσεται
  choice: Il viendra
  rationale: Le futur de ἔρχομαι est rendu simplement, sans ajouter l’idée explicite d’un retour, absente du verbe grec.
- source_word: ἀπολέσει
  choice: fera périr
  rationale: Cette formulation exprime la destruction mortelle annoncée tout en conservant l’étendue sémantique de ἀπόλλυμι, qui peut signifier détruire, faire mourir ou mener à la ruine.
- source_word: τοὺς γεωργοὺς τούτους
  choice: ces vignerons
  rationale: Dans le cadre précis d’une vigne, « vignerons » est naturel et désigne ceux qui la cultivent. La note précise qu’ils exploitent ici le bien d’un autre; « ces » conserve la valeur proximale de τούτους.
- source_word: δώσει τὸν ἀμπελῶνα ἄλλοις
  choice: donnera la vigne à d’autres
  rationale: La traduction suit la simplicité de δίδωμι et laisse, comme le grec, les nouveaux bénéficiaires indéterminés.
- source_word: ἀκούσαντες δὲ εἶπαν
  choice: En entendant cela, ils dirent
  rationale: Le participe aoriste reçoit une valeur temporelle naturelle en français; « cela » reprend explicitement les paroles entendues sans en modifier le sens.
- source_word: Μὴ γένοιτο
  choice: Que cela n’arrive jamais !
  rationale: Le tour optatif exprime un rejet énergique, sous la forme d’un souhait que l’événement annoncé ne se produise pas.
theological_decisions:
- issue: Portée de Μὴ γένοιτο dans la réaction des auditeurs
  choice: Que cela n’arrive jamais !
  alternative: Certainement pas ! / Loin de là !
  rationale: La formulation retenue préserve la forme volitive et la réaction horrifiée des auditeurs, sans réduire leurs paroles à une simple négation logique ni préciser ce qu’ils ont compris de la parabole.
- issue: Identité des « autres » qui recevront la vigne
  choice: La laisser indéterminée
  alternative: Expliciter un groupe théologique ou historique particulier
  rationale: Le verset dit seulement ἄλλοις, « à d’autres ». Toute identification plus précise dépasserait le texte de ce verset et résoudrait une tension interprétative que la traduction doit préserver.
translation_notes:
  register: Français international moderne, clair et digne. « Vignerons » maintient l’image concrète de la parabole; la note évite de laisser croire qu’ils sont propriétaires. « Fera périr » garde la gravité du jugement sans imposer une précision plus étroite que le verbe grec.
