  text: κατανοήσας δὲ αὐτῶν τὴν πανουργίαν εἶπεν πρὸς ⸀αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/023.yaml
  text: But perceiving their cunning[a], he said to them,
translation:
  language: fr
  text: 'Mais, ayant discerné leur ruse[a], il leur dit :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leur habileté trompeuse », « leur fourberie » ou « leur tromperie ». Le terme grec évoque une manœuvre astucieuse et sans scrupules.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατανοήσας
  choice: discernant
  rationale: Le participe aoriste exprime ici la perception lucide de ce qui animait ses interlocuteurs. « Discernant » rend à la fois l’observation et la compréhension sans ajouter l’idée plus forte de dévoilement.
- source_word: δὲ
  choice: Mais
  rationale: La particule marque une légère opposition narrative entre leur tentative et la réaction de Jésus.
- source_word: αὐτῶν
  choice: leur
  rationale: Le possessif français est la manière naturelle de rendre le génitif lié à πανουργίαν.
- source_word: πανουργίαν
  choice: ruse
  rationale: Dans ce contexte, le terme désigne une habileté calculée et moralement répréhensible. « Ruse » est courant, concis et conserve l’idée de manœuvre trompeuse.
- source_word: εἶπεν
  choice: il dit
  rationale: Rendu narratif simple et naturel de l’aoriste de λέγω.
- source_word: πρὸς αὐτούς
  choice: leur
  rationale: Après un verbe de parole, le pronom complément indirect rend naturellement en français les destinataires désignés par πρός avec l’accusatif.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La phrase conserve la transition contrastive, le participe circonstanciel et la portée négative de πανουργία sans expliciter davantage les intentions des interlocuteurs.
