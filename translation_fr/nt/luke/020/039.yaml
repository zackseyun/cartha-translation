  text: ἀποκριθέντες δέ τινες τῶν γραμματέων εἶπαν· Διδάσκαλε, καλῶς εἶπας·
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/039.yaml
  text: Then some of the scribes answered[a], “Teacher, you have spoken well.”
translation:
  language: fr
  text: 'Alors quelques-uns des scribes lui répondirent : « Maître, tu as bien parlé. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθέντες
  choice: lui répondirent
  rationale: Le participe aoriste introduit ici une réaction verbale. Une forme verbale conjuguée est plus naturelle en français; « lui » explicite sans ambiguïté que la réponse s’adresse à Jésus.
- source_word: δέ
  choice: Alors
  rationale: La particule marque une légère transition dans le récit. « Alors » relie naturellement cette réaction à l’argument qui précède sans créer une forte opposition.
- source_word: τινες τῶν γραμματέων
  choice: quelques-uns des spécialistes de la Loi
  rationale: La tournure partitive est conservée par « quelques-uns des », indiquant qu’il ne s’agit que d’une partie du groupe.
- source_word: γραμματέων
  choice: spécialistes de la Loi
  rationale: Dans ce contexte évangélique, γραμματεῖς désigne des spécialistes des Écritures et de la Loi. Cette formulation actuelle communique mieux leur fonction que le terme français « scribes », qui peut aujourd’hui évoquer surtout des copistes.
- source_word: Διδάσκαλε
  choice: Maître
  rationale: Dans l’adresse directe à Jésus, « Maître » est la désignation française traditionnelle et naturelle d’un enseignant reconnu; le contexte exclut ici le sens de propriétaire ou de dominateur.
- source_word: καλῶς
  choice: bien
  rationale: « Bien » conserve la portée largement élogieuse de l’adverbe, qui peut viser à la fois la qualité et la justesse des paroles.
- source_word: εἶπας
  choice: tu as parlé
  rationale: Le passé composé rend naturellement l’aoriste dans cette appréciation immédiate et s’associe idiomatiquement à « bien ».
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proche du grec tout en étant idiomatique. « Spécialistes de la Loi » privilégie la compréhension fonctionnelle; « Maître » convient à l’apostrophe respectueuse.
