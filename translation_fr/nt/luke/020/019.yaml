  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἐζήτησαν οἱ ⸂γραμματεῖς καὶ οἱ ἀρχιερεῖς⸃ ἐπιβαλεῖν ἐπ’ αὐτὸν τὰς χεῖρας ἐν αὐτῇ τῇ ὥρᾳ, καὶ ἐφοβήθησαν ⸂τὸν λαόν⸃, ἔγνωσαν γὰρ ὅτι πρὸς αὐτοὺς ⸂εἶπεν τὴν παραβολὴν ταύτην⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/019.yaml
  text: And the scribes and the chief priests sought to lay hands on him in that very hour[a], but they feared the people[b], for they knew that he had told this parable against them.
translation:
  language: fr
  text: Les spécialistes de la Loi et les chefs des prêtres cherchèrent à mettre la main sur lui à cette heure même[a], mais ils eurent peur du peuple. En effet, ils savaient que c’était contre eux[b] qu’il avait raconté cette parabole.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « cherchèrent à le saisir » ou « à l’arrêter » ; littéralement, « à mettre les mains sur lui ».
    reason: lexical_alternative
  - marker: b
    text: Ou « qu’il leur avait raconté cette parabole » ou « qu’il avait raconté cette parabole à leur sujet » ; dans ce contexte, elle les mettait en cause.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐζήτησαν
  choice: cherchèrent
  rationale: L’aoriste résume leur volonté et leur tentative sans affirmer qu’ils réussirent.
- source_word: γραμματεῖς
  choice: spécialistes de la Loi
  rationale: Cette formulation moderne désigne clairement la fonction de ces experts des Écritures et de la Loi, là où « scribes » risque d’évoquer de simples copistes.
- source_word: ἀρχιερεῖς
  choice: chefs des prêtres
  rationale: Le pluriel désigne les membres dirigeants de l’aristocratie sacerdotale, et non plusieurs grands prêtres exerçant simultanément la charge suprême.
- source_word: ἐπιβαλεῖν ἐπ’ αὐτὸν τὰς χεῖρας
  choice: mettre la main sur lui
  rationale: L’expression française conserve l’image grecque tout en exprimant naturellement une saisie hostile; le contexte peut impliquer une arrestation sans que le grec la nomme précisément.
- source_word: ἐν αὐτῇ τῇ ὥρᾳ
  choice: à cette heure même
  rationale: Rendu proche du grec, qui souligne l’immédiateté à l’intérieur de cette occasion précise.
- source_word: ἐφοβήθησαν τὸν λαόν
  choice: ils eurent peur du peuple
  rationale: « Peuple » rend λαός comme la population présente ou favorable à Jésus, sans le réduire nécessairement à une simple foule.
- source_word: ἔγνωσαν
  choice: ils savaient
  rationale: Le verbe exprime ici leur compréhension certaine de la cible de la parabole; « savaient » reste direct et sobre.
- source_word: πρὸς αὐτοὺς
  choice: contre eux
  rationale: Dans ce contexte conflictuel, la préposition indique que la parabole les visait et les mettait en cause; une note préserve les rendus plus littéraux possibles.
- source_word: παραβολὴν
  choice: parabole
  rationale: Terme français établi et exact dans le contexte des Évangiles.
theological_decisions:
- issue: Force de πρὸς αὐτοὺς concernant la parabole
  choice: La parabole avait été racontée contre les dirigeants religieux.
  alternative: La parabole leur avait été adressée ou parlait d’eux.
  rationale: Leur réaction montre qu’ils se sont reconnus dans les vignerons condamnés. « Contre eux » rend la portée accusatrice du contexte, tandis que la note conserve l’ambiguïté lexicale de la préposition.
translation_notes:
  register: Français international moderne, digne et accessible. « Spécialistes de la Loi » privilégie la compréhension immédiate; « chefs des prêtres » évite l’idée historiquement trompeuse de plusieurs grands prêtres en fonction. La structure en deux phrases allège une longue coordination grecque sans en changer la logique.
