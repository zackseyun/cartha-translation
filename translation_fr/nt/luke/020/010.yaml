id: LUK.20.10
reference: Luke 20:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸀καὶ καιρῷ ἀπέστειλεν πρὸς τοὺς γεωργοὺς δοῦλον, ἵνα ἀπὸ τοῦ καρποῦ τοῦ ἀμπελῶνος ⸀δώσουσιν αὐτῷ· οἱ δὲ γεωργοὶ ⸂ἐξαπέστειλαν αὐτὸν δείραντες⸃ κενόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/010.yaml
  text: And at the proper time he sent a servant to the vine-growers[a], so that they would give him some of the fruit of the vineyard[b]. But the vine-growers sent him away empty after beating him.
translation:
  language: fr
  text: Au moment voulu, il envoya un esclave[a] auprès des vignerons pour qu’ils lui donnent une part du fruit de la vigne. Mais les vignerons le battirent et le renvoyèrent les mains vides.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « serviteur ». Le terme grec désigne ici une personne asservie, mais peut être traduit par « serviteur » selon le contexte.
    reason: alternative_reading
lexical_decisions:
- source_word: καιρῷ
  choice: au moment voulu
  rationale: Le datif temporel de καιρός désigne le moment approprié ou fixé, sans préciser explicitement qu’il s’agit du temps des vendanges.
- source_word: γεωργούς
  choice: vignerons
  rationale: Dans le contexte d’une vigne, « vignerons » rend naturellement les cultivateurs concernés sans imposer explicitement un statut juridique de fermiers.
- source_word: δοῦλον
  choice: esclave
  rationale: δοῦλος désigne ici une personne asservie appartenant au maître; « esclave » conserve clairement ce statut social, là où « serviteur » pourrait l’atténuer.
- source_word: ἵνα ... δώσουσιν αὐτῷ
  choice: pour qu’ils lui donnent
  rationale: Cette tournure française exprime naturellement le but introduit par ἵνα avec le futur de l’indicatif.
- source_word: ἀπὸ τοῦ καρποῦ τοῦ ἀμπελῶνος
  choice: une part du fruit de la vigne
  rationale: ἀπό avec le génitif a ici une valeur partitive; « une part » l’explicite sans définir davantage la quantité ou le fondement juridique de la demande.
- source_word: ἐξαπέστειλαν
  choice: le renvoyèrent
  rationale: Le verbe composé exprime l’idée de faire repartir ou de renvoyer, et non simplement celle d’envoyer.
- source_word: δείραντες
  choice: le battirent
  rationale: δέρω désigne le fait de frapper ou battre; la coordination française rend clairement l’action antérieure au renvoi sans suggérer une forme précise de châtiment.
- source_word: κενόν
  choice: les mains vides
  rationale: Littéralement « vide », l’adjectif signifie en contexte qu’il repart sans avoir rien reçu; l’expression idiomatique française en conserve nettement le sens.
theological_decisions: []
translation_notes:
  register: Français moderne, courant et digne. La formulation reste proche de la structure narrative grecque tout en employant des expressions françaises naturelles; elle évite de préciser que les vignerons sont juridiquement des fermiers et ne transforme pas le moment voulu en temps explicite des vendanges.
