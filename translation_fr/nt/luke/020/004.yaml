  yaml_path: translation/nt/luke/020/004.yaml
  text: Was John's baptism from heaven or from men?[a]
translation:
  language: fr
  text: Le baptême de Jean venait-il du ciel ou des hommes ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de Dieu » ; littéralement, « du ciel », expression révérencielle indiquant une origine ou une autorité divine.
    reason: lexical_alternative
lexical_decisions:
- source_word: βάπτισμα
  choice: baptême
  rationale: Le nom désigne le rite ou la pratique associés à Jean. « Baptême » est l’équivalent français courant et précis dans ce contexte.
- source_word: Ἰωάννου
  choice: de Jean
  rationale: Le génitif exprime ici l’association avec Jean et se rend naturellement en français par « de Jean ».
- source_word: ἐξ οὐρανοῦ
  choice: venait du ciel
  rationale: Littéralement « du ciel ». La formulation française avec « venait » exprime naturellement l’origine ou l’autorité tout en conservant l’expression révérencielle du grec.
- source_word: ἐξ ἀνθρώπων
  choice: des hommes
  rationale: Le pluriel générique désigne les êtres humains, par opposition à l’origine céleste ou divine. « Des hommes » conserve cette formulation traditionnelle et demeure naturel dans cette question.
- source_word: ἦν
  choice: venait-il
  rationale: Bien que le grec emploie littéralement la copule (« était »), le français exprime plus naturellement la provenance par « venait-il », sans changer le sens.
- source_word: ἢ
  choice: ou
  rationale: Conjonction disjonctive ordinaire qui présente les deux possibilités.
theological_decisions:
- issue: Sens de « du ciel » concernant le baptême de Jean
  choice: Conserver « du ciel » dans le texte principal.
  alternative: de Dieu
  rationale: L’expression désigne vraisemblablement une origine ou une autorité divine, mais le grec dit explicitement « du ciel ». La conserver respecte l’euphémisme révérenciel et évite d’expliciter silencieusement le sens.
translation_notes:
  register: Français moderne, clair et digne. La tournure interrogative avec inversion convient au registre du récit biblique. L’espace fine insécable avant le point d’interrogation suit la typographie française.
