  text: καὶ εἶπαν ⸂λέγοντες πρὸς αὐτόν⸃· Εἰπὸν ἡμῖν ἐν ποίᾳ ἐξουσίᾳ ταῦτα ποιεῖς, ἢ τίς ἐστιν ὁ δούς σοι τὴν ἐξουσίαν ταύτην;
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/002.yaml
  text: And they said to him, “Tell us, by what authority are you doing these things? Or who is the one who gave you this authority?”
translation:
  language: fr
  text: 'Et ils lui dirent : « Dis-nous : par quelle autorité fais-tu ces choses ? Ou qui est celui qui t’a donné cette autorité ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: Et
  rationale: Conjonction narrative simple qui relie directement cette question à la scène précédente, sans ajouter une nuance temporelle.
- source_word: εἶπαν ⸂λέγοντες πρὸς αὐτόν⸃
  choice: ils lui dirent
  rationale: Cette formulation française naturelle rend l’ensemble de la construction grecque sans reproduire la redondance peu idiomatique « dirent en lui disant ».
- source_word: Εἰπὸν ἡμῖν
  choice: Dis-nous
  rationale: L’impératif aoriste est rendu de manière directe et idiomatique en français contemporain.
- source_word: ἐν ποίᾳ ἐξουσίᾳ
  choice: par quelle autorité
  rationale: Dans ce contexte, ἐν indique le fondement autorisant l’action. « Par quelle autorité » est la tournure française naturelle pour une telle contestation.
- source_word: ταῦτα ποιεῖς
  choice: fais-tu ces choses
  rationale: Le pluriel de ταῦτα est conservé, tandis que le présent français rend l’action actuelle visée par les interlocuteurs.
- source_word: ἢ
  choice: Ou
  rationale: 'La conjonction introduit une seconde formulation étroitement liée de la contestation : l’identité de celui qui a conféré l’autorité.'
- source_word: τίς ἐστιν ὁ δούς σοι
  choice: qui est celui qui t’a donné
  rationale: « Celui qui » conserve la force substantive du participe grec ὁ δούς plutôt que de réduire la phrase à « qui t’a donné ».
- source_word: τὴν ἐξουσίαν ταύτην
  choice: cette autorité
  rationale: « Autorité » exprime ici le droit reconnu ou conféré d’agir, et non la seule capacité ou puissance.
theological_decisions:
- issue: Sens de ἐξουσία dans la confrontation au Temple
  choice: autorité
  alternative: pouvoir ; droit
  rationale: Les responsables interrogent Jésus sur la légitimité et la source de ses actes. « Autorité » préserve cette portée institutionnelle et théologique sans réduire le terme à une simple puissance.
translation_notes:
  register: Français international moderne, digne et direct. L’inversion « fais-tu » convient à une interrogation formelle et confrontante. La répétition d’« autorité » est maintenue comme dans le grec afin de préserver l’insistance du dialogue.
