  text: καὶ ἀπεκρίθησαν μὴ εἰδέναι πόθεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/007.yaml
  text: So they answered that they did not know where it was from[a].
translation:
  language: fr
  text: Ils répondirent donc qu’ils ne savaient pas d’où il venait.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: donc
  rationale: Dans ce prolongement narratif, καί relie leur réponse à la délibération précédente. « Donc » exprime naturellement en français cette légère valeur consécutive.
- source_word: ἀπεκρίθησαν
  choice: ils répondirent
  rationale: L’aoriste de ἀποκρίνομαι désigne simplement l’acte de répondre; le passé simple convient au registre narratif biblique actuel et soutenu.
- source_word: μὴ εἰδέναι
  choice: qu’ils ne savaient pas
  rationale: Après le verbe « répondre », l’infinitif avec μή relève du discours indirect. Une proposition introduite par « que » est la formulation française naturelle.
- source_word: πόθεν
  choice: d’où il venait
  rationale: πόθεν interroge l’origine ou la source. Le pronom « il » reprend naturellement, dans le contexte immédiat, le baptême de Jean sans expliciter davantage que le grec.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple maintient une narration écrite soutenue sans archaïsme lexical; la formulation conserve l’idée d’origine portée par πόθεν.
