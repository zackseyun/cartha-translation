source:
  edition: SBLGNT
  text: καὶ προσέθετο ⸂ἕτερον πέμψαι⸃ δοῦλον· οἱ δὲ κἀκεῖνον δείραντες καὶ ἀτιμάσαντες ἐξαπέστειλαν κενόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/011.yaml
  text: And he proceeded to send another servant; but they also beat and dishonored that one[a], and sent him away empty-handed.
translation:
  language: fr
  text: Il envoya encore un autre esclave[a] ; mais ils battirent aussi celui-là, le traitèrent avec mépris et le renvoyèrent les mains vides.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « serviteur » (grec : δοῦλος). « Esclave » rend ici le statut d’esclave du personnage dans la parabole.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσέθετο … πέμψαι
  choice: il envoya encore
  rationale: Cette construction idiomatique signifie qu’il poursuivit son action en envoyant quelqu’un d’autre. « Encore » restitue naturellement en français l’idée de répétition.
- source_word: ἕτερον
  choice: un autre
  rationale: Le mot désigne ici un individu supplémentaire, distinct du premier.
- source_word: δοῦλον
  choice: esclave
  rationale: Dans cette parabole, le personnage est un agent placé sous l’autorité du propriétaire. « Esclave » préserve plus précisément le statut social exprimé par δοῦλος, tandis que « serviteur » reste une traduction possible.
- source_word: κἀκεῖνον
  choice: aussi celui-là
  rationale: Cette formulation souligne explicitement le parallèle avec le premier esclave et conserve l’insistance du grec.
- source_word: δείραντες
  choice: battirent
  rationale: Le verbe désigne des coups portés sans préciser ici une méthode particulière comme la flagellation.
- source_word: ἀτιμάσαντες
  choice: le traitèrent avec mépris
  rationale: Cette expression française naturelle rend l’idée de déshonneur et de traitement humiliant portée par le verbe grec.
- source_word: ἐξαπέστειλαν
  choice: le renvoyèrent
  rationale: Le verbe exprime le fait de faire repartir ou de chasser quelqu’un ; « renvoyèrent » convient au mouvement de retour implicite dans la scène.
- source_word: κενόν
  choice: les mains vides
  rationale: Employé comme attribut, le terme indique que l’esclave repart sans avoir rien reçu. L’expression idiomatique française en restitue clairement le sens.
theological_decisions:
- issue: Traduction de δοῦλος dans la parabole
  choice: esclave
  alternative: serviteur
  rationale: « Esclave » rend explicitement la condition de dépendance juridique et sociale suggérée par le terme grec, sans ajouter d’interprétation doctrinale. Une note signale « serviteur », formulation française traditionnelle et possible.
translation_notes:
  register: Français moderne, clair et digne. La phrase conserve la progression narrative et l’insistance de κἀκεῖνον, tout en employant des tournures idiomatiques telles que « envoya encore » et « les mains vides ».
