  text: ⸀Καὶ εἶπεν αὐτοῖς ὁ Ἰησοῦς· Οἱ υἱοὶ τοῦ αἰῶνος τούτου γαμοῦσιν καὶ ⸀γαμίσκονται,
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/034.yaml
  text: And Jesus said to them[a], “The sons of this age marry and are given in marriage,”
translation:
  language: fr
  text: 'Et Jésus leur dit : « Les gens de ce temps-ci[a] se marient et sont donnés en mariage. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Litt. « Les fils de ce temps-ci ». Expression masculine représentative désignant les personnes qui appartiennent à l’époque présente, par opposition à l’âge à venir.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: Alors
  rationale: Le connecteur introduit ici la réponse de Jésus. « Alors » rend naturellement l’enchaînement narratif en français sans le surcharger.
- source_word: εἶπεν αὐτοῖς
  choice: leur dit
  rationale: Expression française directe correspondant au verbe λέγω à l’aoriste et au datif αὐτοῖς, sans préciser davantage que le grec qu’il s’agit d’une réponse.
- source_word: Οἱ υἱοὶ τοῦ αἰῶνος τούτου
  choice: Les fils de ce temps-ci
  rationale: Conserve l’image masculine représentative « fils de » ainsi que l’idée d’appartenance au temps présent. « Temps » exprime ici αἰών comme époque ou ordre, et non comme monde physique.
- source_word: γαμοῦσιν
  choice: se marient
  rationale: Équivalent français courant du verbe actif, convenant à l’énoncé général.
- source_word: γαμίσκονται
  choice: sont donnés en mariage
  rationale: Préserve la voix passive et la distinction avec le verbe actif précédent, même si la tournure est moins courante en français moderne.
theological_decisions:
- issue: Expression masculine employée de manière représentative
  choice: Les fils de ce temps-ci
  alternative: Les gens de ce temps-ci
  rationale: Le grec dit littéralement « les fils ». Le maintien de cette formulation préserve l’image d’appartenance, tandis qu’une note indique qu’elle englobe les personnes appartenant au temps présent.
- issue: αἰών comme catégorie eschatologique
  choice: ce temps-ci
  alternative: ce monde
  rationale: « Ce temps-ci » maintient le contraste contextuel avec le temps à venir sans faire croire que le texte désigne d’abord l’univers physique.
translation_notes:
  register: Français international moderne et digne. « Les fils de ce temps-ci » est volontairement plus formel afin de conserver l’idiome grec; la note en explicite la portée représentative. La tournure passive « sont donnés en mariage » maintient la tension formelle du couple verbal grec.
