source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν ⸂πρὸς αὐτούς· Τοίνυν ἀπόδοτε⸃ τὰ Καίσαρος Καίσαρι καὶ τὰ τοῦ θεοῦ τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/025.yaml
  text: But he said to them[a], “Then give back to Caesar the things that are Caesar’s, and to God the things that are God’s.”
translation:
  language: fr
  text: 'Mais il leur dit : « Rendez[a] donc à César ce qui est à César, et à Dieu ce qui est à Dieu. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Donnez donc à César… et à Dieu… ». Le verbe peut signifier donner, payer ou rendre ce qui est dû.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ εἶπεν πρὸς αὐτούς
  choice: Mais il leur dit
  rationale: δέ peut être légèrement adversatif ou simplement continuatif. « Mais » convient à l’échange, tandis que « il leur dit » rend naturellement πρὸς αὐτούς avec λέγω.
- source_word: Τοίνυν
  choice: donc
  rationale: « Donc » exprime naturellement en français la conclusion ou la reprise déductive marquée par τοίνυν, sans la solennité plus forte de « par conséquent ».
- source_word: ἀπόδοτε
  choice: Rendez
  rationale: « Rendez » conserve l’idée de remettre à quelqu’un ce qui lui revient ou lui est dû. Selon le contexte, le verbe peut aussi se traduire par « donnez » ou « acquittez ».
- source_word: τὰ Καίσαρος Καίσαρι
  choice: à César ce qui est à César
  rationale: Cette formulation française naturelle préserve la portée générale du neutre pluriel substantivé sans la réduire au seul impôt.
- source_word: Καίσαρος / Καίσαρι
  choice: César
  rationale: Le titre impérial est conservé sous sa forme française traditionnelle plutôt que remplacé par l’interprétation « l’empereur ».
- source_word: τὰ τοῦ θεοῦ τῷ θεῷ
  choice: à Dieu ce qui est à Dieu
  rationale: La formulation reproduit le parallélisme avec César et maintient la portée ouverte de ce qui revient à Dieu.
- source_word: θεοῦ / θεῷ
  choice: Dieu
  rationale: Dans ce contexte, θεός désigne le Dieu d’Israël; la majuscule suit l’usage français.
theological_decisions:
- issue: Portée politique et théologique de la parole de Jésus
  choice: Maintenir en parallèle ce qui revient à l’autorité impériale et ce qui revient à Dieu, sans définir précisément les limites de l’un ou de l’autre domaine.
  alternative: Lire le verset comme une séparation stricte de la religion et de l’État, comme une approbation illimitée du pouvoir civil, ou comme une déclaration portant uniquement sur l’impôt.
  rationale: Le grec énonce le principe de remettre à chacun ce qui lui revient, mais n’élabore pas une théorie politique complète. La traduction doit préserver cette ampleur et cette tension.
translation_notes:
  register: Français international moderne, digne et immédiatement compréhensible. La tournure traditionnelle « à César ce qui est à César » reste naturelle en français et reflète étroitement le parallélisme grec. Le marqueur de note est placé après la citation entière.
