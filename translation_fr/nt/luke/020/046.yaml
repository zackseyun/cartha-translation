id: LUK.20.46
reference: Luke 20:46
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Προσέχετε ἀπὸ τῶν γραμματέων τῶν θελόντων περιπατεῖν ἐν στολαῖς καὶ φιλούντων ἀσπασμοὺς ἐν ταῖς ἀγοραῖς καὶ πρωτοκαθεδρίας ἐν ταῖς συναγωγαῖς καὶ πρωτοκλισίας ἐν τοῖς δείπνοις,
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/046.yaml
  text: Beware of the scribes[a], who want to walk around in long robes, and who love greetings in the marketplaces and the best seats in the synagogues and places of honor at banquets[d][c][b],
translation:
  language: fr
  text: « Méfiez-vous des scribes[a], qui veulent se promener en longues robes[b] et qui aiment être salués sur les places publiques, occuper les sièges d’honneur dans les synagogues et les places d’honneur dans les banquets. »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Prenez garde aux scribes. »'
    reason: lexical_alternative
  - marker: b
    text: Les « longues robes » étaient des vêtements voyants pouvant signaler le rang et le prestige.
    reason: cultural_note
lexical_decisions:
- source_word: Προσέχετε ἀπὸ
  choice: Méfiez-vous de
  rationale: Cette tournure idiomatique française restitue l’impératif pluriel et la force d’avertissement de la construction προσέχω ἀπό.
- source_word: γραμματέων
  choice: scribes
  rationale: « Scribes » demeure le terme historique précis et usuel dans le contexte évangélique; « spécialistes de la Loi » serait plus explicatif et légèrement plus large.
- source_word: τῶν θελόντων περιπατεῖν
  choice: qui veulent se promener
  rationale: La formulation conserve la nuance volontaire de θέλω et évoque leur désir de paraître en public, sans ajouter explicitement un motif absent du texte.
- source_word: ἐν στολαῖς
  choice: en longues robes
  rationale: στολή désigne ici une robe longue ou un vêtement solennel; cette expression naturelle conserve l’image concrète.
- source_word: φιλούντων ἀσπασμοὺς
  choice: qui aiment être salués
  rationale: Dans ce contexte, les ἀσπασμοί sont les salutations honorifiques que les scribes recherchent. La tournure passive naturelle en français rend clairement qu’ils aiment les recevoir.
- source_word: ἐν ταῖς ἀγοραῖς
  choice: sur les places publiques
  rationale: L’agora était à la fois place de marché et espace public. « Places publiques » met en relief le cadre de reconnaissance sociale sans archaïsme.
- source_word: πρωτοκαθεδρίας
  choice: les sièges d’honneur
  rationale: Le terme désigne les sièges les plus prestigieux dans les synagogues. « Sièges d’honneur » communique leur rang social plus exactement que leur emplacement matériel.
- source_word: πρωτοκλισίας
  choice: les places d’honneur
  rationale: Le terme renvoie aux places les plus honorifiques lors des repas. Cette traduction rend leur fonction culturelle sans imposer l’image moderne d’une table d’honneur.
theological_decisions:
- issue: Portée de la critique adressée aux scribes
  choice: La traduction avertit contre les scribes caractérisés dans la suite de la phrase par leur goût de l’apparat et des honneurs publics.
  alternative: Comprendre le verset comme une condamnation indistincte de chaque scribe, ou comme une critique limitée à leur habillement.
  rationale: Les participes grecs caractérisent les scribes visés par des comportements précis. La traduction conserve la force générale de l’avertissement sans étendre ni réduire arbitrairement sa portée.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve le contraste entre « veulent » (θέλοντων) et « aiment » (φιλούντων), tout en coordonnant naturellement les marques d’honneur recherchées.
