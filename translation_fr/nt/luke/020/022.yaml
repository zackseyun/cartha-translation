  text: ἔξεστιν ⸀ἡμᾶς Καίσαρι φόρον δοῦναι ἢ οὔ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/022.yaml
  text: Is it lawful for us to pay taxes to Caesar[a], or not?
translation:
  language: fr
  text: Nous est-il permis de payer l’impôt à César[a], ou non ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le tribut ». Le terme grec désigne ici une taxe versée au pouvoir dominant.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔξεστιν
  choice: Nous est-il permis
  rationale: Exprime une question de permission ou de légitimité sans préciser si la norme en cause est civile ou religieuse.
- source_word: ἡμᾶς
  choice: nous
  rationale: Reproduit naturellement le sujet de la construction infinitive sans ajouter l’explicitation « nous, Juifs », absente du grec.
- source_word: Καίσαρι
  choice: à César
  rationale: Conserve la désignation historique et politique précise du souverain romain.
- source_word: φόρον
  choice: l’impôt
  rationale: Dans ce contexte, le terme désigne l’impôt versé au pouvoir dominant; le singulier français convient à cette taxe déterminée.
- source_word: δοῦναι
  choice: payer
  rationale: Avec « impôt », « payer » est l’expression idiomatique française correspondant au sens contextuel de « donner ».
- source_word: ἢ οὔ
  choice: ou non
  rationale: Rend directement et dignement la clôture disjonctive de la question.
theological_decisions:
- issue: Nature de la permission en question
  choice: Ne pas préciser la norme selon laquelle le paiement serait permis ou interdit.
  alternative: « Est-ce légal selon la loi romaine… » ou « La loi de Dieu nous permet-elle… »
  rationale: Le grec laisse cette norme implicite. La formulation doit donc préserver la tension entre les dimensions religieuse et politique du piège tendu à Jésus.
translation_notes:
  register: Français international actuel, naturel et digne. La tournure « Nous est-il permis » conserve la portée normative de la question, tandis que « payer l’impôt » est plus idiomatique que le calque « donner le tribut ».
