id: LUK.20.27
reference: Luke 20:27
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Προσελθόντες δέ τινες τῶν Σαδδουκαίων, οἱ ⸀ἀντιλέγοντες ἀνάστασιν μὴ εἶναι, ἐπηρώτησαν αὐτὸν
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/027.yaml
  text: Then some of the Sadducees[a], who deny that there is a resurrection, came up and questioned him,
translation:
  language: fr
  text: Alors quelques sadducéens, qui soutiennent qu’il n’y a pas de résurrection, s’approchèrent de lui et l’interrogèrent.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Προσελθόντες
  choice: s’approchèrent
  rationale: Le participe aoriste exprime le mouvement vers Jésus avant l’interrogation. La coordination en français produit une phrase naturelle tout en conservant l’ordre des actions.
- source_word: δέ
  choice: Alors
  rationale: La particule marque ici la progression du récit plutôt qu’une opposition forte.
- source_word: τινες τῶν Σαδδουκαίων
  choice: quelques sadducéens
  rationale: Cette formulation française rend naturellement l’expression partitive grecque sans la lourdeur de « quelques-uns des sadducéens ».
- source_word: οἱ ἀντιλέγοντες
  choice: qui soutiennent… qu’il n’y a pas
  rationale: Dans cette construction, le participe introduit la position doctrinale professée par ce groupe. « Soutiennent qu’il n’y a pas » rend clairement cette prise de position sans suggérer seulement une contradiction verbale.
- source_word: ἀνάστασιν μὴ εἶναι
  choice: qu’il n’y a pas de résurrection
  rationale: Cette tournure idiomatique rend la proposition infinitive grecque et maintient la négation de l’existence d’une résurrection.
- source_word: ἐπηρώτησαν αὐτόν
  choice: lui posèrent cette question
  rationale: Le verbe signifie demander ou interroger. La formulation annonce naturellement en français la question directe qui suit au verset suivant, sans ajouter le contenu de celle-ci.
theological_decisions:
- issue: Présentation de la position des sadducéens concernant la résurrection
  choice: qui soutiennent qu’il n’y a pas de résurrection
  alternative: qui nient qu’il y ait une résurrection
  rationale: Le choix exprime leur affirmation doctrinale négative sans préciser davantage la nature ou l’étendue de la résurrection, que ce verset ne développe pas.
translation_notes:
  register: Français international moderne, clair et digne. « Sadducéens » prend la minuscule selon l’usage français pour les membres d’un groupe religieux. Le deux-points relie ce verset à la question rapportée dans la suite immédiate.
