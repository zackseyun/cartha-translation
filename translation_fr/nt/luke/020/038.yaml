- from: Or il n’est pas le Dieu des morts, mais des vivants, car tous vivent pour lui.[a]
  to: Il n’est pas le Dieu des morts, mais des vivants, car, pour lui, tous vivent.[a]
  rationale: La révision supprime le connecteur initial devenu superflu et déplace « pour lui » afin d’éviter en français le sens de finalité de « vivre pour Dieu ». Elle maintient la concision, le présent et l’ambiguïté relationnelle du datif grec; la note conserve explicitement un rendu alternatif plausible.
