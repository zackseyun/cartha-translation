  variant: modern international French
source:
  edition: SBLGNT
  text: θεὸς δὲ οὐκ ἔστιν νεκρῶν ἀλλὰ ζώντων, πάντες γὰρ αὐτῷ ζῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/038.yaml
  text: He is not God of the dead[a], but of the living, for all live to him.
translation:
  language: fr
  text: Il n’est pas le Dieu des morts, mais des vivants, car, pour lui, tous vivent.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « car tous sont vivants devant lui ».'
    reason: Le datif αὐτῷ peut aussi être compris comme exprimant que tous sont vivants devant Dieu.
lexical_decisions:
- source_word: θεὸς
  choice: Dieu
  rationale: Dans ce contexte monothéiste juif, le nom sans article est défini; « Dieu » est le rendu naturel.
- source_word: δὲ
  choice: Or
  rationale: Marque une transition légère; « Or » maintient le mouvement du discours sans renforcer excessivement l’opposition déjà exprimée par οὐκ… ἀλλά.
- source_word: νεκρῶν
  choice: des morts
  rationale: Le génitif pluriel substantivé se rend naturellement par « le Dieu des morts ».
- source_word: ζώντων
  choice: des vivants
  rationale: Le participe substantivé forme avec « des morts » un contraste concis et fidèle.
- source_word: πάντες
  choice: tous
  rationale: Conserve la formulation générale et compacte du grec sans limiter explicitement la portée aux patriarches évoqués dans le contexte.
- source_word: αὐτῷ
  choice: pour lui
  rationale: Le datif est sémantiquement dense. « Pour lui » est idiomatique en français et garde l’idée d’une vie en relation avec Dieu, sans préciser davantage la nature de cette relation.
- source_word: ζῶσιν
  choice: vivent
  rationale: Rend directement le présent actif grec et préserve le parallélisme avec « vivants ».
theological_decisions:
- issue: Sens de αὐτῷ dans πάντες γὰρ αὐτῷ ζῶσιν
  choice: car tous vivent pour lui
  alternative: car tous sont vivants devant lui
  rationale: Le datif peut exprimer la relation à Dieu de plusieurs façons. Le texte principal reste proche et naturel, tandis que la note conserve une autre compréhension ancienne et plausible sans résoudre silencieusement la tension.
translation_notes:
  register: Français international moderne, sobre et digne. « Or » convient au registre biblique courant tout en restant compréhensible; la construction concise conserve l’opposition rhétorique de l’original.
