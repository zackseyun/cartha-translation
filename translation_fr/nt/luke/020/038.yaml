review_pass:
  verdict: revise
  source_fidelity: Le contraste « non ... mais ... » est bien rendu, ainsi que le présent de ζῶσιν et la portée non explicitée de πάντες. Toutefois, « tous vivent pour lui » tend en français à exprimer le but ou le dévouement (« vivre pour Dieu »), alors que le datif αὐτῷ indique ici plus naturellement la vie considérée en relation à Dieu. La place de « pour lui » avant le verbe permet de conserver cette concision relationnelle sans trancher davantage.
  naturalness: « Or » est grammatical, mais il paraît livresque et n’est pas nécessaire en français moderne dans cette phrase, où l’opposition est déjà portée par « mais ». « Car, pour lui, tous vivent » est idiomatique dans un registre biblique sobre et évite le sens final involontaire de « vivent pour lui ».
  terminology: « Dieu », « le Dieu des morts » et « des vivants » sont exacts et naturels. La note proposée conserve de manière utile l’alternative « devant lui », sans imposer une interprétation doctrinale.
  issues:
  - severity: medium
    issue: « tous vivent pour lui »
    rationale: Après « vivre », « pour lui » se comprend normalement comme une finalité ou un engagement au service de Dieu. Pour le datif αὐτῷ, le français « pour lui, tous vivent » rend plus adéquatement la relation ou l’évaluation divine, tout en laissant ouverte la nuance du grec.
  - severity: low
    issue: « Or » en tête de phrase
    rationale: Bien que δέ puisse parfois être rendu par « or », ce connecteur est inutilement marqué en français international moderne ici. Le grec n’exige pas un équivalent français explicite, et « mais » porte déjà le contraste principal.
  revised_text: Il n’est pas le Dieu des morts, mais des vivants, car, pour lui, tous vivent.[a]
  revised_footnotes:
  - marker: a
    text: 'Ou : « car tous sont vivants devant lui ».'
    reason: Le datif αὐτῷ peut aussi être compris comme exprimant que tous sont vivants devant Dieu.
  revision_rationale: La révision supprime le connecteur initial devenu superflu et déplace « pour lui » afin d’éviter en français le sens de finalité de « vivre pour Dieu ». Elle maintient la concision, le présent et l’ambiguïté relationnelle du datif grec; la note conserve explicitement un rendu alternatif plausible.
