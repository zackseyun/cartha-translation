  variant: modern international French
source:
  edition: SBLGNT
  text: ἐὰν δὲ εἴπωμεν· Ἐξ ἀνθρώπων, ⸂ὁ λαὸς ἅπας⸃ καταλιθάσει ἡμᾶς, πεπεισμένος γάρ ἐστιν Ἰωάννην προφήτην εἶναι·
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/006.yaml
  text: But if we say, ‘From men,’ all the people will stone us, for they are convinced that John was a prophet.
translation:
  language: fr
  text: 'Mais si nous disons : « Des hommes », tout le peuple nous lapidera, car il est convaincu que Jean est un prophète.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐὰν δὲ εἴπωμεν
  choice: Mais si nous disons
  rationale: La tournure rend naturellement la condition éventuelle introduite par ἐὰν avec le subjonctif aoriste, tandis que « mais » conserve la valeur adversative de δέ dans le contexte.
- source_word: Ἐξ ἀνθρώπων
  choice: Des hommes
  rationale: Cette formule elliptique reprend la question sur l'origine du baptême de Jean. « Des hommes » reste concise, proche du grec et parallèle à « du ciel » dans le contexte.
- source_word: ὁ λαὸς ἅπας
  choice: tout le peuple
  rationale: Cette expression restitue le sens collectif de λαός et la totalité soulignée par ἅπας, dans un français idiomatique.
- source_word: καταλιθάσει
  choice: nous lapidera
  rationale: « Lapider » est l'équivalent français précis et courant du verbe grec, sans expliciter davantage que le texte la conséquence mortelle possible.
- source_word: πεπεισμένος γάρ ἐστιν
  choice: car il est convaincu
  rationale: Le singulier français s'accorde naturellement avec le collectif « tout le peuple » et conserve l'état présent exprimé par le parfait grec.
- source_word: Ἰωάννην προφήτην εἶναι
  choice: que Jean était un prophète
  rationale: La proposition infinitive grecque est rendue par une complétive française. L'imparfait situe naturellement la qualité prophétique de Jean dans son ministère antérieur, sans nier la conviction présente du peuple.
theological_decisions:
- issue: Temps employé pour exprimer le jugement du peuple sur Jean
  choice: que Jean était un prophète
  alternative: que Jean est un prophète
  rationale: L'infinitif εἶναι ne fixe pas à lui seul un temps absolu. « Était » convient au cadre narratif et au ministère passé de Jean, tandis que « est » peut souligner plus directement la conviction encore actuelle du peuple. Une note conserve cette ambiguïté sans trancher une question théologique au-delà du grec.
translation_notes:
  register: Français moderne, international et digne. La phrase conserve la formulation elliptique de la réponse ainsi que le caractère collectif de « tout le peuple » ; la ponctuation française et le verbe précis « lapider » assurent une lecture naturelle.
