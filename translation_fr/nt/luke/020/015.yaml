id: LUK.20.15
reference: Luke 20:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἐκβαλόντες αὐτὸν ἔξω τοῦ ἀμπελῶνος ἀπέκτειναν. τί οὖν ποιήσει αὐτοῖς ὁ κύριος τοῦ ἀμπελῶνος;
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/015.yaml
  text: And after throwing him out of the vineyard[a], they killed him. What then will the owner of the vineyard do to them?
translation:
  language: fr
  text: Après l’avoir jeté hors de la vigne, ils le tuèrent. Que leur fera donc le propriétaire[a] de la vigne ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « maître ». Le mot grec peut aussi signifier « Seigneur », mais il désigne ici le propriétaire de la vigne dans la parabole.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκβαλόντες αὐτὸν ἔξω τοῦ ἀμπελῶνος
  choice: Après l’avoir jeté hors de la vigne
  rationale: Le participe aoriste exprime ici une action antérieure au verbe principal. « Après l’avoir jeté hors de » restitue clairement la succession et la force d’expulsion.
- source_word: ἀπέκτειναν
  choice: ils le tuèrent
  rationale: Le verbe signifie simplement « tuer ». Cette formulation reste directe sans ajouter la nuance juridique de « mettre à mort » ni celle, plus interprétative, d’« assassiner ».
- source_word: τί οὖν ποιήσει αὐτοῖς
  choice: Que leur fera donc
  rationale: La formulation française naturelle conserve la valeur déductive de οὖν et rend le datif αὐτοῖς par « leur ».
- source_word: ὁ κύριος τοῦ ἀμπελῶνος
  choice: le propriétaire de la vigne
  rationale: Dans le cadre narratif de la parabole, κύριος désigne celui à qui appartient la vigne. « Propriétaire » communique ce sens sans faire entendre artificiellement un titre divin.
theological_decisions:
- issue: Traduction de κύριος lorsque le référent immédiat est humain dans une parabole
  choice: propriétaire
  alternative: maître
  rationale: Le contexte immédiat présente le possesseur humain de la vigne. Traduire le sens contextuel évite d’imposer « Seigneur » comme titre divin, tout en signalant en note la traduction lexicale possible « maître ».
translation_notes:
  register: Français moderne, clair et digne. Le passé simple convient au récit écrit et maintient la concision du grec. La question finale suit un ordre idiomatique sans atténuer sa force.
