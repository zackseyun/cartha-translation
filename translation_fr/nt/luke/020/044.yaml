id: LUK.20.44
reference: Luke 20:44
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Δαυὶδ οὖν ⸂αὐτὸν κύριον⸃ καλεῖ, καὶ πῶς ⸂αὐτοῦ υἱός⸃ ἐστιν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/044.yaml
  text: David therefore calls him Lord[a], so how is he his son?
translation:
  language: fr
  text: David l’appelle donc Seigneur. Alors, comment peut-il être son fils[a] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « son descendant ». Le grec dit « son fils » ; ce terme peut aussi désigner un descendant dans une lignée dynastique, mais le texte principal conserve le mot explicite sur lequel repose l’argument.
    reason: lexical_alternative
lexical_decisions:
- source_word: Δαυὶδ
  choice: David
  rationale: Forme française traditionnelle et courante du nom propre grec Δαυίδ.
- source_word: οὖν
  choice: donc
  rationale: Marque la déduction tirée de la citation précédente ; « donc » en conserve clairement la force logique.
- source_word: αὐτὸν κύριον
  choice: l’appelle Seigneur
  rationale: Le pronom objet est naturellement intégré à « l’appelle ». « Seigneur » rend κύριος et maintient la portée honorifique du titre dans cet argument messianique.
- source_word: καλεῖ
  choice: appelle
  rationale: Le présent simple rend directement καλεῖ et convient à l’acte de désigner quelqu’un par un titre.
- source_word: καὶ πῶς
  choice: Alors, comment
  rationale: Dans cette question rhétorique, « alors » relie naturellement la seconde proposition à la déduction précédente, tandis que « comment » rend πῶς.
- source_word: αὐτοῦ υἱός
  choice: son fils
  rationale: Le grec emploie explicitement υἱός, « fils ». Même si le terme peut avoir une portée dynastique et désigner un descendant, conserver « fils » maintient la formulation et la tension de l’argument.
- source_word: ἐστιν
  choice: peut-il être
  rationale: La tournure française « comment peut-il être » exprime naturellement la force rhétorique de « comment est-il » sans résoudre la question ni en modifier le fond.
theological_decisions:
- issue: Traduction de κύριος dans un argument messianique
  choice: Seigneur
  alternative: maître
  rationale: « Seigneur » conserve à la fois la valeur lexicale, le rang supérieur exprimé par le titre et l’écho de la citation du Psaume 110, sans ajouter d’explication doctrinale au texte.
- issue: Portée filiale ou dynastique de υἱός
  choice: son fils
  alternative: son descendant
  rationale: L’argument repose sur le mot explicite « fils ». Le remplacer dans le texte principal par « descendant » atténuerait la tension voulue ; l’autre sens possible est donc signalé en note.
translation_notes:
  register: Français international moderne, naturel et digne. Deux phrases courtes rendent clairement la progression logique et la question rhétorique. La majuscule à « Seigneur » signale ici le titre attribué au Messie sans développer l’interprétation.
