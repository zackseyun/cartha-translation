id: LUK.20.36
reference: Luke 20:36
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸀οὐδὲ γὰρ ἀποθανεῖν ἔτι δύνανται, ἰσάγγελοι γάρ εἰσιν καὶ υἱοί ⸀εἰσιν θεοῦ τῆς ἀναστάσεως υἱοὶ ὄντες.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/036.yaml
  text: For they cannot die anymore[a], because they are like the angels and are sons of God[b], being sons of the resurrection.
translation:
  language: fr
  text: En effet, ils ne peuvent plus mourir, car ils sont semblables aux anges[a] et ils sont fils de Dieu[b], étant fils de la résurrection.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « égaux aux anges ».
    reason: lexical_alternative
  - marker: b
    text: Le grec dit « fils de Dieu » et « fils de la résurrection »; la forme masculine exprime ici un statut et une identité, sans limiter l’inclusion aux hommes.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποθανεῖν ἔτι δύνανται
  choice: ils ne peuvent plus mourir
  rationale: La construction avec δύνανται exprime la capacité, tandis que ἔτι, sous la négation, signifie « plus » ou « désormais plus ». Cette formulation naturelle indique la fin de la mortalité.
- source_word: ἰσάγγελοι
  choice: semblables aux anges
  rationale: L’adjectif signifie « égaux aux anges » ou « semblables aux anges ». « Semblables aux anges » exprime clairement la comparaison sans suggérer qu’ils deviennent des anges; l’autre nuance est signalée en note.
- source_word: υἱοί ... θεοῦ
  choice: fils de Dieu
  rationale: Le grec emploie explicitement le pluriel masculin υἱοί. « Fils de Dieu » conserve l’image filiale et son parallèle rhétorique avec « fils de la résurrection ».
- source_word: τῆς ἀναστάσεως υἱοὶ ὄντες
  choice: étant fils de la résurrection
  rationale: Cette formulation préserve la métaphore et la valeur participiale de ὄντες sans imposer une relation exclusivement causale, même si une nuance explicative est présente.
- source_word: γάρ ... γάρ
  choice: En effet ... car
  rationale: Le premier γάρ rattache le verset à l’affirmation précédente; « En effet » convient naturellement en français. Le second introduit l’explication et se rend avec fluidité par « car ».
theological_decisions:
- issue: Langage filial dans le contexte de la résurrection
  choice: Conserver « fils de Dieu » et « fils de la résurrection » dans le texte principal
  alternative: « enfants de Dieu » et « enfants de la résurrection »
  rationale: La répétition de υἱοί est significative et décrit un statut et une identité liés à la vie de résurrection. La forme masculine ne limite pas ici la promesse aux hommes; une note l’explicite sans neutraliser l’expression source.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe conserve le double mouvement explicatif du grec ainsi que le parallélisme des deux expressions filiales.
