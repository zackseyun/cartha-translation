id: LUK.20.33
reference: Luke 20:33
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸂ἡ γυνὴ οὖν ἐν τῇ⸃ ἀναστάσει τίνος αὐτῶν γίνεται γυνή; οἱ γὰρ ἑπτὰ ἔσχον αὐτὴν γυναῖκα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/033.yaml
  text: In the resurrection[a], then[c][b], whose wife does the woman become? For the seven had her as wife.
translation:
  language: fr
  text: À la résurrection donc, duquel d’entre eux cette femme deviendra-t-elle l’épouse ? En effet, les sept l’ont eue pour épouse[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « l’ont épousée ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡ γυνή
  choice: cette femme
  rationale: Le premier emploi désigne la femme dont il vient d’être question. Le démonstratif rend naturellement en français la reprise assurée par l’article grec.
- source_word: οὖν
  choice: donc
  rationale: Le terme marque la conclusion que les sadducéens tirent de leur scénario.
- source_word: ἐν τῇ ἀναστάσει
  choice: à la résurrection
  rationale: Cette formulation française naturelle conserve la référence simple à la résurrection sans ajouter «des morts».
- source_word: τίνος αὐτῶν
  choice: de qui parmi eux
  rationale: Cette tournure exprime à la fois la relation indiquée par le génitif interrogatif et le groupe de référence, les sept frères.
- source_word: γίνεται γυνή
  choice: deviendra-t-elle […] l’épouse
  rationale: «Deviendra» conserve la nuance de γίνομαι, tandis que «épouse» exprime ici sans ambiguïté le sens matrimonial de γυνή.
- source_word: οἱ γὰρ ἑπτὰ
  choice: En effet, les sept
  rationale: «En effet» introduit l’explication donnée par γάρ, et «les sept» suit précisément l’article et le numéral grecs sans ajouter explicitement «tous».
- source_word: ἔσχον αὐτὴν γυναῖκα
  choice: l’ont eue pour épouse
  rationale: La traduction conserve l’expression relationnelle ἔχω + complément + γυναῖκα plutôt que de la réduire à l’acte de se marier.
theological_decisions:
- issue: Portée de ἀνάστασις dans la question des sadducéens
  choice: résurrection
  alternative: résurrection des morts
  rationale: Le verset dit seulement ἀνάστασις. La traduction n’ajoute donc aucune précision doctrinale tirée du contexte.
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve le caractère argumentatif de la question, la nuance de devenir portée par γίνομαι et la répétition matrimoniale du grec, tout en évitant une syntaxe artificielle.
