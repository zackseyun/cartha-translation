review_pass:
  verdict: revise
  source_fidelity: La citation est bien rendue dans son ensemble et l’ambiguïté de κεφαλὴ γωνίας est préservée. Toutefois, « Que signifie donc » interprète la question grecque, qui demande plus littéralement ce qu’est « ceci qui est écrit »; l’explicitation de « Jésus » n’est pas présente dans le texte source.
  naturalness: Le français est globalement clair et digne. « Il les regarda » est plus naturel et moins intensif que « fixa les yeux sur eux », tout en rendant le regard délibéré. « Qu’est donc ceci qui est écrit » conserve la forme rhétorique sans lourdeur excessive.
  terminology: « Les bâtisseurs », « rejetée » et « la tête de l’angle » sont appropriés. Cette dernière expression, inhabituelle mais intelligible dans une citation solennelle, est justement éclairée par une note qui ne tranche pas le sens architectural disputé.
