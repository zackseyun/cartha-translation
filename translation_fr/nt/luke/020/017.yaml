    rationale: « Que signifie donc ce qui est écrit » transforme Τί οὖν ἐστιν τὸ γεγραμμένον τοῦτο en une demande explicite de sens. « Qu’est donc ceci qui est écrit » suit plus directement la syntaxe et la rhétorique grecques.
  - severity: low
    issue: Le nom « Jésus » est ajouté au sujet.
    rationale: Le grec emploie simplement « il ». Le contexte peut identifier le référent, mais l’ajout n’est pas nécessaire ici et réduit la fidélité formelle.
  - severity: low
    issue: « Fixa les yeux sur eux » peut suraccentuer le verbe.
    rationale: ἐμβλέψας indique un regard dirigé ou attentif; « il les regarda » le rend naturellement sans suggérer nécessairement un regard fixe.
