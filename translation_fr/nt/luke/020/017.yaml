source:
  edition: SBLGNT
  text: ὁ δὲ ἐμβλέψας αὐτοῖς εἶπεν· Τί οὖν ἐστιν τὸ γεγραμμένον τοῦτο· Λίθον ὃν ἀπεδοκίμασαν οἱ οἰκοδομοῦντες, οὗτος ἐγενήθη εἰς κεφαλὴν γωνίας;
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/017.yaml
  text: 'But he looked at them and said[a], “What then is this that has been written: ‘The stone that the builders rejected, this one has become the head of the corner’?”'
translation:
  language: fr
  text: 'Mais il les regarda et dit : « Qu’est donc ceci qui est écrit : “La pierre que les bâtisseurs ont rejetée, c’est elle qui est devenue la tête de l’angle[a]” ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « la pierre angulaire » ; autre possibilité : « la pierre de faîte ». Le grec dit littéralement « la tête de l’angle ».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐμβλέψας
  choice: fixa les yeux sur eux
  rationale: Le participe aoriste exprime un regard délibérément dirigé vers eux. Cette tournure française naturelle rend davantage cette intention que le simple « regarda », sans exagérer l’intensité.
- source_word: Τί οὖν ἐστιν τὸ γεγραμμένον τοῦτο
  choice: Que signifie donc ce qui est écrit
  rationale: En français, la question grecque demande naturellement la portée du texte cité. « Ce qui est écrit » restitue la formule scripturaire et la valeur résultative de γεγραμμένον, tandis que « Que signifie » rend explicitement mais sans ajout substantiel la force idiomatique de Τί ... ἐστιν.
- source_word: Λίθον
  choice: La pierre
  rationale: Malgré l'absence d'article dans la citation grecque, il s'agit de la pierre déterminée par la relative qui suit; l'article défini est naturel en français.
- source_word: ἀπεδοκίμασαν
  choice: ont rejetée
  rationale: « Rejeter » exprime clairement le fait d'avoir évalué la pierre et de l'avoir déclarée impropre, tout en restant idiomatique.
- source_word: οἱ οἰκοδομοῦντες
  choice: les bâtisseurs
  rationale: Le participe substantivé désigne ceux qui construisent. « Les bâtisseurs » conserve la métaphore architecturale dans un registre courant et digne.
- source_word: οὗτος
  choice: c’est elle
  rationale: La construction disloquée reprend explicitement « la pierre » et préserve l'insistance du démonstratif grec, sans personnaliser christologiquement la formulation de la citation.
- source_word: ἐγενήθη εἰς
  choice: est devenue
  rationale: Le passé composé convient naturellement en français pour le devenir accompli dont le résultat demeure pertinent.
- source_word: κεφαλὴν γωνίας
  choice: la tête de l’angle
  rationale: Ce calque intelligible conserve l'image grecque sans trancher entre pierre angulaire, pierre de faîte et pierre principale de l'angle. Une note fournit les équivalents interprétatifs usuels.
theological_decisions:
- issue: Métaphore architecturale dans la citation du Psaume 118.22
  choice: la tête de l’angle
  alternative: la pierre angulaire ; la pierre de faîte
  rationale: L'identité architecturale précise de κεφαλὴ γωνίας reste discutée. Le texte principal préserve donc la formulation métaphorique de la source plutôt que de choisir silencieusement entre une pierre de fondation et une pierre sommitale; la note présente les principales interprétations.
translation_notes:
  register: Français international moderne, naturel et digne. Le nom « Jésus », implicite dans le pronom grec, est explicité pour la clarté référentielle. La citation conserve une légère solennité biblique, et la note maintient l'ambiguïté de l'image architecturale.
