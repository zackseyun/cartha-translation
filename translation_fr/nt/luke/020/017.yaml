  to: 'Mais il les regarda et dit : « Qu’est donc ceci qui est écrit : “La pierre que les bâtisseurs ont rejetée, c’est elle qui est devenue la tête de l’angle[a]” ? »'
  rationale: La révision restitue la question grecque sans en expliciter l’interprétation, évite l’ajout du nom propre absent de la source et adopte un verbe de regard naturel et proportionné. Elle maintient la métaphore architecturale non résolue et son ancre de note.
