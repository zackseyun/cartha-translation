  text: ὕστερον ⸂καὶ ἡ γυνὴ ἀπέθανεν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/032.yaml
  text: Later[a], the woman also died.
translation:
  language: fr
  text: Plus tard[a], la femme mourut elle aussi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ensuite, la femme mourut elle aussi. »'
    reason: Alternative lexicale pour ὕστερον, qui marque simplement la postériorité dans le récit.
lexical_decisions:
- source_word: ὕστερον
  choice: Plus tard
  rationale: Adverbe temporel indiquant un moment postérieur dans la succession du récit. « Plus tard » est naturel en français moderne et n'ajoute pas l'idée que cet événement serait nécessairement le dernier.
- source_word: καὶ
  choice: elle aussi
  rationale: Ici, καί souligne que la femme meurt à son tour, comme les frères mentionnés auparavant. La tournure « elle aussi » rend clairement cette valeur additive en français.
- source_word: ἡ γυνή
  choice: la femme
  rationale: γυνή peut désigner une femme ou une épouse. Dans ce scénario où elle a été successivement mariée à plusieurs frères, « la femme » identifie le personnage sans la rattacher exclusivement à un seul mari.
- source_word: ἀπέθανεν
  choice: mourut
  rationale: L'aoriste rapporte simplement le décès comme un fait passé. « Mourut » conserve la sobriété du grec et convient au registre narratif biblique sans euphémisme.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple maintient le registre narratif écrit; la reprise pronominale « elle aussi » exprime naturellement la valeur additive de καί.
