reference: Luke 20:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἤρξατο δὲ πρὸς τὸν λαὸν λέγειν τὴν παραβολὴν ταύτην· ⸀Ἄνθρωπος ἐφύτευσεν ἀμπελῶνα, καὶ ἐξέδετο αὐτὸν γεωργοῖς, καὶ ἀπεδήμησεν χρόνους ἱκανούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/009.yaml
  text: 'Then he began to tell the people this parable: “A man planted a vineyard[a], and leased it to farmers, and went away for a considerable time.”'
translation:
  language: fr
  text: 'Puis il se mit à raconter au peuple cette parabole : « Un homme planta une vigne, la loua à des vignerons et partit pour longtemps[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « partit dans un autre pays pour longtemps ». Le verbe peut évoquer un séjour loin de sa région d’origine, voire à l’étranger.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἤρξατο δὲ
  choice: Puis il se mit
  rationale: Le tour « se mit à dire » rend naturellement en français le commencement de la prise de parole, tandis que « puis » marque la progression du récit portée par δέ.
- source_word: πρὸς τὸν λαὸν λέγειν
  choice: à dire au peuple
  rationale: πρός avec l’accusatif désigne ici les destinataires de la parole. « Le peuple » conserve le sens collectif de λαός sans le réduire à une simple foule.
- source_word: τὴν παραβολὴν ταύτην
  choice: cette parabole
  rationale: « Parabole » est le terme français courant et traditionnel pour ce genre de récit, et préserve ses résonances dans les Évangiles.
- source_word: Ἄνθρωπος
  choice: Un homme
  rationale: Le nom masculin singulier introduit un personnage masculin précis dans le récit ; « un homme » est exact et naturel.
- source_word: ἐφύτευσεν ἀμπελῶνα
  choice: planta une vigne
  rationale: Cette formulation directe conserve le verbe concret « planter » et rend ἀμπελών par le terme français idiomatique « vigne » au sens de vignoble.
- source_word: ἐξέδετο αὐτὸν γεωργοῖς
  choice: la loua à des vignerons
  rationale: ἐκδίδωμι exprime ici la mise en location, et γεωργοί désigne les cultivateurs chargés de la vigne. « Vignerons » est précis et naturel dans ce contexte.
- source_word: ἀπεδήμησεν
  choice: partit
  rationale: Le verbe indique un départ et une absence hors de chez soi, parfois dans un autre pays. « Partit » conserve le sens essentiel sans préciser une destination absente du texte.
- source_word: χρόνους ἱκανούς
  choice: pour longtemps
  rationale: Le pluriel idiomatique avec ἱκανούς exprime une durée importante. « Pour longtemps » est clair, actuel et naturel en français.
theological_decisions:
- issue: Genre du personnage introduit par Ἄνθρωπος
  choice: Un homme
  alternative: Une personne
  rationale: Le texte présente un personnage masculin singulier, propriétaire de la vigne. La traduction garde cette donnée narrative sans la neutraliser.
translation_notes:
  register: Français international moderne, simple et digne. Le passé simple convient au récit bref de la parabole ; « se mit à dire » reste naturel tout en reflétant l’aspect inchoatif de ἤρξατο. Le marqueur de note est placé après l’expression qu’il précise.
