  source_fidelity: 'Le sens du grec est globalement bien rendu : Jésus commence à s’adresser au peuple, puis la parabole présente un homme qui plante une vigne, la donne à bail à des cultivateurs et s’absente longtemps. « Vigne », « vignerons », « loua » et « partit pour longtemps » sont recevables dans ce contexte.'
  naturalness: « Se mit à dire au peuple cette parabole » est compréhensible, mais l’enchaînement de « dire » avec « une parabole » est moins idiomatique en français moderne. « Se mit à raconter au peuple cette parabole » est naturel tout en restant fidèle à λέγειν avec παραβολή comme objet.
  terminology: « Parabole », « vigne » et « vignerons » conviennent au registre évangélique moderne. La note conserve avec justesse la possibilité que ἀπεδήμησεν implique un départ dans un autre pays, sans en faire le sens obligatoire.
