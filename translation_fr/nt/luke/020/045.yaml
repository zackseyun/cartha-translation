  yaml_path: translation/nt/luke/020/045.yaml
  text: 'And while all the people were listening[a], he said to the disciples:'
translation:
  language: fr
  text: 'Alors que tout le peuple écoutait[a], il dit aux disciples :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Comme tout le peuple écoutait, il dit aux disciples. » Le grec emploie ici un génitif absolu pour indiquer la circonstance dans laquelle Jésus prend la parole.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀκούοντος
  choice: Alors que … écoutait
  rationale: Le génitif absolu avec le participe présent de ἀκούω présente une action simultanée qui sert de cadre à la parole de Jésus. « Alors que » restitue naturellement cette circonstance et l’aspect duratif sans ajouter d’objet absent du grec.
- source_word: δὲ
  choice: Alors que
  rationale: La particule δέ assure ici une transition narrative légère. En français, la subordination circonstancielle suffit à marquer l’enchaînement ; ajouter « et » alourdirait la phrase.
- source_word: παντὸς τοῦ λαοῦ
  choice: tout le peuple
  rationale: L’expression désigne collectivement le peuple dans son ensemble. « Tout le peuple » est direct et conserve mieux la portée de λαός que « toute la foule ».
- source_word: εἶπεν
  choice: il dit
  rationale: L’aoriste de λέγω reçoit ici son équivalent narratif français usuel.
- source_word: τοῖς μαθηταῖς
  choice: aux disciples
  rationale: « Disciples » est le terme consacré et exact dans ce contexte. Aucun possessif n’est ajouté, puisque le grec ne dit pas explicitement « ses disciples ».
theological_decisions:
- issue: Distinction entre les auditeurs présents et les destinataires directs
  choice: Jésus parle aux disciples pendant que tout le peuple écoute.
  alternative: Jésus s’adresse directement à tout le peuple, ou parle aux disciples en privé.
  rationale: Le génitif absolu situe la scène devant le peuple qui écoute, tandis que le datif τοῖς μαθηταῖς désigne les destinataires directs. La traduction maintient cette distinction sans identifier les deux groupes ni rendre la scène privée.
translation_notes:
  register: Français international moderne, sobre et digne. La tournure « tout le peuple écoutait » demeure volontairement sans complément exprimé, comme le grec, tout en restant intelligible dans le contexte.
