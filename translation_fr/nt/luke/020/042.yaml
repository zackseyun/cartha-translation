source:
  edition: SBLGNT
  text: ⸂αὐτὸς γὰρ⸃ Δαυὶδ λέγει ἐν βίβλῳ ψαλμῶν· ⸀Εἶπεν κύριος τῷ κυρίῳ μου· Κάθου ἐκ δεξιῶν μου
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/042.yaml
  text: For David himself says in the Book of Psalms[a], ‘The Lord said to my Lord, “Sit at my right hand”’
translation:
  language: fr
  text: 'Car David lui-même dit dans le livre des Psaumes[a] : « Le Seigneur a dit à mon Seigneur : “Assieds-toi à ma droite” »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, d’après l’hébreu du Psaume 110.1 : « L’ÉTERNEL a dit à mon Seigneur. »'
    reason: alternative_reading
lexical_decisions:
- source_word: αὐτὸς γὰρ
  choice: Car David lui-même
  rationale: « Car » introduit l’explication, tandis que « lui-même » rend l’emphase portée par αὐτός sur David.
- source_word: Δαυὶδ
  choice: David
  rationale: Forme française traditionnelle et courante du nom propre.
- source_word: λέγει
  choice: dit
  rationale: Le présent de la formule de citation est naturellement conservé en français.
- source_word: ἐν βίβλῳ ψαλμῶν
  choice: dans le livre des Psaumes
  rationale: Rend explicitement βίβλος et le génitif pluriel ψαλμῶν dans une formulation française naturelle.
- source_word: Εἶπεν
  choice: a dit
  rationale: Le passé composé rend naturellement l’aoriste dans cette citation en français moderne.
- source_word: κύριος
  choice: Le Seigneur
  rationale: Suit directement le grec κύριος; la forme correspondant au nom divin dans l’hébreu du Psaume 110.1 est signalée en note.
- source_word: τῷ κυρίῳ μου
  choice: à mon Seigneur
  rationale: Préserve la répétition de κύριος et la portée théologique de la citation sans identifier explicitement le référent.
- source_word: Κάθου
  choice: Assieds-toi
  rationale: Impératif idiomatique et direct de κάθημαι en français moderne.
- source_word: ἐκ δεξιῶν μου
  choice: à ma droite
  rationale: Expression française naturelle correspondant à l’idiome désignant la place d’honneur à la droite du locuteur.
theological_decisions:
- issue: Premier κύριος dans une citation dont le texte hébreu porte le nom divin
  choice: Le Seigneur
  alternative: L’ÉTERNEL
  rationale: Le texte grec source porte κύριος, rendu dans le texte principal par « le Seigneur ». La note conserve l’information intertextuelle selon laquelle le Psaume 110.1 hébreu emploie le nom divin.
- issue: Second κύριος dans une citation à portée christologique
  choice: mon Seigneur
  alternative: mon maître
  rationale: « Mon Seigneur » conserve la répétition grecque et la tension de l’argument de Jésus, sans résoudre l’identité du référent ni affaiblir la portée du titre.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche du grec tout en étant naturelle; la répétition de « Seigneur » et l’ambiguïté du référent sont volontairement préservées.
