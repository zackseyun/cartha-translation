lexical_decisions:
- source_word: οὐκέτι
  choice: ne… plus
  rationale: Cette tournure française naturelle exprime la cessation à partir de ce moment et conserve la valeur temporelle de l’adverbe.
- source_word: γάρ
  choice: Car
  rationale: La conjonction introduit une explication liée au contexte précédent; « Car » maintient clairement ce rapport.
- source_word: ἐτόλμων
  choice: osaient
  rationale: L’imparfait rend naturellement l’imparfait grec et exprime ici l’absence persistante de hardiesse, en combinaison avec « ne… plus ».
- source_word: ἐπερωτᾶν
  choice: poser… question
  rationale: Dans ce contexte d’interrogations publiques, « poser une question » est une formulation française courante et précise.
- source_word: αὐτόν
  choice: lui
  rationale: Le pronom renvoie à Jésus et prend naturellement la forme indirecte avec l’expression française « poser une question à quelqu’un ».
- source_word: οὐδέν
  choice: aucune
  rationale: Avec la négation « ne… plus », « aucune question » exprime de façon idiomatique et complète la portée totale de οὐδέν.
