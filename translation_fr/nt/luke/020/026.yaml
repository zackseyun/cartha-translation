source:
  edition: SBLGNT
  text: καὶ οὐκ ἴσχυσαν ἐπιλαβέσθαι ⸀τοῦ ῥήματος ἐναντίον τοῦ λαοῦ, καὶ θαυμάσαντες ἐπὶ τῇ ἀποκρίσει αὐτοῦ ἐσίγησαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/026.yaml
  text: And they were not able to seize on his statement before the people[a], and marveling at his answer, they became silent.
translation:
  language: fr
  text: Ils ne réussirent pas à le prendre au piège par ses paroles devant le peuple[a] et, étonnés de sa réponse, ils se turent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « à se saisir de la parole devant le peuple ».'
    reason: La formulation littérale conserve l’image de ἐπιλαμβάνομαι et le singulier ῥῆμα, tandis que le texte principal explicite le sens contextuel de prendre Jésus au piège par ce qu’il disait.
lexical_decisions:
- source_word: οὐκ ἴσχυσαν
  choice: ils ne réussirent pas
  rationale: Cette formulation française exprime naturellement l’incapacité effective indiquée par ἰσχύω dans ce contexte, sans suggérer un simple manque de force physique.
- source_word: ἐπιλαβέσθαι τοῦ ῥήματος
  choice: le prendre au piège par ses paroles
  rationale: L’expression rend le geste figuré de saisir une parole afin de compromettre Jésus. Le pluriel français « ses paroles » est idiomatique et renvoie à ce qu’il vient de dire, tandis que la note conserve une formulation plus proche de l’image grecque.
- source_word: ἐναντίον τοῦ λαοῦ
  choice: devant le peuple
  rationale: « Devant » exprime la présence publique indiquée par ἐναντίον, et « le peuple » correspond à λαός sans le réduire à une simple foule.
- source_word: θαυμάσαντες
  choice: étonnés
  rationale: Dans ce contexte conflictuel, « étonnés » rend l’étonnement suscité par la réponse sans introduire la nuance positive que pourrait suggérer « émerveillés » en français moderne.
- source_word: ἐπὶ τῇ ἀποκρίσει αὐτοῦ
  choice: de sa réponse
  rationale: Cette tournure française naturelle rend la cause de leur étonnement ; « réponse » correspond directement à ἀπόκρισις.
- source_word: ἐσίγησαν
  choice: ils se turent
  rationale: Le passé simple exprime clairement l’entrée dans le silence marquée par l’aoriste et convient au registre narratif.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve l’enchaînement du grec tout en évitant « émerveillés », qui pourrait suggérer une admiration favorable absente du contexte.
