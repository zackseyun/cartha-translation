lexical_decisions:
- source_word: ἑπτὰ οὖν ἀδελφοὶ ἦσαν
  choice: Il y avait donc sept frères
  rationale: « donc » rend la valeur de liaison ou de conséquence de οὖν sans en faire un marqueur temporel; « sept frères » désigne ici des hommes appartenant à la même fratrie.
- source_word: ὁ πρῶτος
  choice: le premier
  rationale: L’ordinal indique le premier dans la suite du récit, sans préciser qu’il était nécessairement l’aîné.
- source_word: λαβὼν γυναῖκα
  choice: prit femme
  rationale: Cette expression française naturelle et digne conserve l’image de l’idiome grec qui signifie se marier.
- source_word: ἀπέθανεν
  choice: mourut
  rationale: Rendu direct de l’aoriste dans un récit au passé.
- source_word: ἄτεκνος
  choice: sans enfant
  rationale: Expression française courante indiquant qu’il mourut sans descendance, élément essentiel du cas exposé.
