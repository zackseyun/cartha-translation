id: LUK.20.20
reference: Luke 20:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ παρατηρήσαντες ἀπέστειλαν ἐγκαθέτους ὑποκρινομένους ἑαυτοὺς δικαίους εἶναι, ἵνα ἐπιλάβωνται αὐτοῦ λόγου, ⸀ὥστε παραδοῦναι αὐτὸν τῇ ἀρχῇ καὶ τῇ ἐξουσίᾳ τοῦ ἡγεμόνος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/020.yaml
  text: And after watching him closely[a], they sent spies who pretended to be righteous, so that they might catch him in something he said[b], and thus hand him over to the rule and authority of the governor.
translation:
  language: fr
  text: Après l’avoir surveillé de près, ils envoyèrent des espions qui faisaient semblant d’être justes, afin de le prendre au piège à cause de ses paroles et de pouvoir ensuite le livrer au pouvoir et à l’autorité du gouverneur[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « saisir sa parole » ou « s’emparer de sa parole ». Ou : « au pouvoir dirigeant et à l’autorité du gouverneur ». Les deux termes associés soulignent probablement l’autorité officielle et le pouvoir de l’exercer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρατηρήσαντες
  choice: Après l’avoir surveillé de près
  rationale: Le participe aoriste indique une action antérieure à l’envoi. « Surveillé de près » rend la vigilance hostile et calculée du contexte.
- source_word: ἐγκαθέτους
  choice: des espions
  rationale: Le terme désigne des personnes secrètement placées pour tendre un piège. « Espions » est clair, actuel et exprime leur mission clandestine.
- source_word: ὑποκρινομένους ἑαυτοὺς δικαίους εἶναι
  choice: qui faisaient semblant d’être justes
  rationale: Cette formulation naturelle conserve l’idée d’une apparence morale et religieuse délibérément trompeuse.
- source_word: ἵνα ἐπιλάβωνται αὐτοῦ λόγου
  choice: afin de le prendre au piège par une de ses paroles
  rationale: L’expression grecque évoque le fait de saisir une parole de Jésus pour l’utiliser contre lui. La traduction explicite cet usage idiomatique sans supprimer l’image, signalée en note.
- source_word: ὥστε
  choice: et de pouvoir ainsi
  rationale: 'La tournure exprime ici le résultat recherché : le piège verbal doit leur permettre de remettre Jésus aux autorités.'
- source_word: παραδοῦναι
  choice: le livrer
  rationale: « Livrer » est une formulation française naturelle et traditionnelle dans un contexte d’arrestation ou de procédure judiciaire hostile.
- source_word: τῇ ἀρχῇ
  choice: au pouvoir
  rationale: Dans ce contexte, ἀρχή renvoie au pouvoir gouvernemental ou à l’administration en place, non à un commencement.
- source_word: τῇ ἐξουσίᾳ
  choice: à l’autorité
  rationale: « Autorité » rend le droit reconnu d’exercer le pouvoir et permet de conserver les deux termes grecs coordonnés.
- source_word: τοῦ ἡγεμόνος
  choice: du gouverneur
  rationale: « Gouverneur » est le terme courant et accessible pour ce responsable de l’administration provinciale romaine.
theological_decisions:
- issue: Rendu de δίκαιος dans le cadre d’une respectabilité morale et religieuse feinte
  choice: justes
  alternative: droits
  rationale: « Justes » conserve la portée morale et religieuse de δίκαιος, tandis que « droits » risquerait de réduire le sens à la seule honnêteté apparente.
- issue: Rapport entre le piège verbal et la remise au gouverneur
  choice: et de pouvoir ainsi le livrer
  alternative: de sorte qu’ils le livrent
  rationale: Le contexte présente la remise aux autorités comme le résultat visé par le piège. La traduction garde cette orientation intentionnelle sans transformer le résultat en fait déjà accompli.
translation_notes:
  register: 'Français international moderne, naturel et digne. Le passé simple convient au registre narratif biblique sans être archaïque. La phrase conserve la progression du grec : surveillance, envoi d’agents, feinte, piège verbal, puis remise au pouvoir romain.'
