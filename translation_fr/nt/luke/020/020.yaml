    text: 'Plus littéralement : « saisir sa parole » ou « s’emparer de sa parole ». Ou : « au pouvoir dirigeant et à l’autorité du gouverneur ». Les deux termes associés soulignent probablement l’autorité officielle et le pouvoir de l’exercer.'
    reason: lexical_alternative
