revisions:
- from: Après l’avoir surveillé de près, ils envoyèrent des espions qui faisaient semblant d’être justes, afin de le prendre au piège par une de ses paroles[a] et de pouvoir ainsi le livrer au pouvoir et à l’autorité du gouverneur[b].
  to: Après l’avoir surveillé de près, ils envoyèrent des espions qui faisaient semblant d’être justes, afin de le prendre au piège à cause de ses paroles et de pouvoir ensuite le livrer au pouvoir et à l’autorité du gouverneur[a].
  rationale: La révision évite de réduire « sa parole » à une parole particulière et simplifie la construction finale. Les deux termes grecs coordonnés sont maintenus dans le texte, tandis que la note propose une alternative moins institutionnellement précise que « administration ». L'ancre de note est déplacée en fin de phrase, car elle porte sur le groupe « pouvoir et autorité du gouverneur ».
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T10:55:24Z'
review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est fidèle : surveillance hostile, envoi d''agents infiltrés, feinte de justice, piège fondé sur les paroles de Jésus et remise au gouverneur. Toutefois, « par une de ses paroles » restreint indûment λόγου à une parole particulière, tandis que le grec vise sa parole / ses propos comme base d''accusation. « À l''administration » dans la note ne rend pas bien ἀρχή et introduit une précision institutionnelle non nécessaire.'
  naturalness: Le français est naturel et le registre narratif est approprié. « Afin de ... et de pouvoir ainsi ... » est grammatical mais un peu pesant ; « pour pouvoir ensuite » est plus fluide tout en conservant le but visé.
  terminology: « Espions », « justes », « livrer », « autorité » et « gouverneur » conviennent. « Pouvoir et autorité » conserve utilement la paire ἀρχή / ἐξουσία, sans prétendre en définir exactement la distinction. La note doit conserver cette prudence.
  issues:
  - severity: medium
    issue: « par une de ses paroles »
    rationale: λόγου est singulier mais ne désigne pas nécessairement « une » parole isolée. Cette formulation ajoute une limitation absente du grec. « À cause de ses paroles » ou « sur la base de ses propos » rend mieux l'idiome d'entrapment sans surinterpréter.
  - severity: low
    issue: 'Note b : « administration » pour ἀρχή'
    rationale: « Administration » est plus spécifique que le grec et ne correspond pas naturellement à la paire abstraite « pouvoir et autorité ». Une note doit proposer une alternative qui conserve l'ambiguïté institutionnelle.
  revised_text: Après l’avoir surveillé de près, ils envoyèrent des espions qui faisaient semblant d’être justes, afin de le prendre au piège à cause de ses paroles et de pouvoir ensuite le livrer au pouvoir et à l’autorité du gouverneur[a].
  revised_footnotes:
