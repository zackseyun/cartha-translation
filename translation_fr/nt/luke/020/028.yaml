source:
  edition: SBLGNT
  text: λέγοντες· Διδάσκαλε, Μωϋσῆς ἔγραψεν ἡμῖν, ἐάν τινος ἀδελφὸς ἀποθάνῃ ἔχων γυναῖκα, καὶ οὗτος ἄτεκνος ⸀ᾖ, ἵνα λάβῃ ὁ ἀδελφὸς αὐτοῦ τὴν γυναῖκα καὶ ἐξαναστήσῃ σπέρμα τῷ ἀδελφῷ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/028.yaml
  text: saying[a], “Teacher, Moses wrote for us that if someone's brother dies having a wife, and he is childless[b], his brother should take the wife and raise up offspring for his brother.”
translation:
  language: fr
  text: 'Ils dirent : « Maître, Moïse nous a écrit : si le frère de quelqu’un meurt en laissant une femme et sans enfant, son frère doit prendre sa femme et susciter une descendance pour son frère[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « susciter une semence pour son frère ». Cette expression reprend le langage juridique de Deutéronome 25.5-6 : la descendance est comptée au nom du frère décédé.'
    reason: cross_reference
lexical_decisions:
- source_word: Διδάσκαλε
  choice: Maître
  rationale: Vocatif courant et digne pour s’adresser à Jésus comme enseignant; en français biblique moderne, « Maître » est plus naturel que « Enseignant ».
- source_word: Μωϋσῆς ἔγραψεν ἡμῖν
  choice: Moïse nous a prescrit ceci
  rationale: Dans la citation d’une loi mosaïque, « a prescrit » rend naturellement la portée normative de « a écrit pour nous », sans suggérer une lettre directement adressée aux interlocuteurs.
- source_word: ἐάν τινος ἀδελφὸς ἀποθάνῃ
  choice: si le frère de quelqu’un meurt
  rationale: Conserve la formulation indéfinie et générique du grec dans un français actuel.
- source_word: ἔχων γυναῖκα
  choice: en laissant une femme
  rationale: Le grec dit littéralement « ayant une femme »; dans le contexte d’un décès et du lévirat, « en laissant une femme » exprime naturellement que l’épouse survit au défunt.
- source_word: οὗτος ἄτεκνος ᾖ
  choice: sans avoir d’enfant
  rationale: Rend clairement ἄτεκνος et rattache sans ambiguïté l’absence d’enfant au frère décédé.
- source_word: ἵνα λάβῃ ὁ ἀδελφὸς αὐτοῦ τὴν γυναῖκα
  choice: son frère doit prendre cette femme pour épouse
  rationale: « Doit » restitue la prescription légale, tandis que « pour épouse » explicite en français le sens matrimonial de « prendre la femme » sans développer indûment le texte.
- source_word: ἐξαναστήσῃ σπέρμα τῷ ἀδελφῷ αὐτοῦ
  choice: donner une descendance au défunt
  rationale: Rend l’idiome légal « susciter une semence pour son frère » en français intelligible; « au défunt » évite l’ambiguïté entre les deux frères.
theological_decisions:
- issue: Formulation de la loi du lévirat
  choice: son frère doit prendre cette femme pour épouse et donner une descendance au défunt
  alternative: son frère prendra la femme et suscitera une descendance à son frère
  rationale: La formulation choisie garde la force prescriptive et la finalité de la loi sans introduire d’explication doctrinale ou culturelle étrangère au verset.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure légale reste perceptible, mais les idiomes grecs sont rendus naturellement. Le marqueur [a] figure dans le texte principal.
