  source_fidelity: La traduction rend correctement le scénario légal et l’absence d’enfants. Toutefois, « nous a prescrit ceci » interprète et renforce ἔγραψεν (« a écrit »), tandis que « donner une descendance au défunt » affaiblit l’idiome précis de « susciter une descendance pour son frère ».
  naturalness: Le français est fluide et d’un registre biblique moderne. « Maître » convient naturellement comme vocatif. La formulation révisée conserve une syntaxe claire tout en restant plus proche de l’original.
  terminology: « Prendre sa femme » et « susciter une descendance » préservent le langage juridique traditionnel sans imposer d’explication confessionnelle. « Pour son frère » est maintenu, avec la note qui explicite que le frère visé est le défunt dans ce contexte.
