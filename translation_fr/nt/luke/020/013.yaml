id: LUK.20.13
reference: Luke 20:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἶπεν δὲ ὁ κύριος τοῦ ἀμπελῶνος· Τί ποιήσω; πέμψω τὸν υἱόν μου τὸν ἀγαπητόν· ἴσως ⸀τοῦτον ἐντραπήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/013.yaml
  text: Then the owner of the vineyard said[a], ‘What shall I do? I will send my beloved son[b]; perhaps they will respect him.’
translation:
  language: fr
  text: 'Alors le propriétaire de la vigne[a] dit : « Que vais-je faire ? J’enverrai mon fils bien-aimé ; peut-être le respecteront-ils[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le maître de la vigne ».'
    reason: lexical_alternative
  - marker: b
    text: Le verbe grec peut aussi signifier « éprouver de la honte devant lui » ou « lui témoigner de la déférence ».
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος τοῦ ἀμπελῶνος
  choice: le propriétaire de la vigne
  rationale: Dans le cadre immédiat de la parabole, l’expression désigne celui à qui appartient la vigne. « Propriétaire » est naturel en français et évite d’introduire artificiellement un titre théologique dans le récit.
- source_word: Τί ποιήσω;
  choice: Que vais-je faire ?
  rationale: Cette formulation française rend naturellement la question délibérative que le personnage se pose avant de décider de son action.
- source_word: πέμψω
  choice: J’enverrai
  rationale: Le futur exprime la décision prise par le propriétaire après sa délibération.
- source_word: τὸν υἱόν μου τὸν ἀγαπητόν
  choice: mon fils bien-aimé
  rationale: « Fils » respecte le sens précis de υἱός, tandis que « bien-aimé » conserve la force de ἀγαπητός et sa possible résonance christologique dans Luc.
- source_word: ἴσως
  choice: peut-être
  rationale: Équivalent français courant qui maintient l’attente sans exprimer de certitude.
- source_word: τοῦτον ἐντραπήσονται
  choice: le respecteront-ils
  rationale: Dans ce contexte, le verbe exprime le respect ou la déférence manifestés envers quelqu’un. La reprise par « le » est idiomatique en français, tout en gardant le fils comme référent explicite.
theological_decisions:
- issue: Traduction de κύριος dans une parabole où le personnage peut représenter Dieu
  choice: le propriétaire de la vigne
  alternative: le maître de la vigne
  rationale: La traduction retient d’abord le sens narratif concret de possesseur de la vigne, sans empêcher le lecteur de percevoir la portée théologique de la parabole.
- issue: Résonance christologique de l’expression « le fils bien-aimé »
  choice: mon fils bien-aimé
  alternative: mon fils, celui que j’aime
  rationale: La formulation conserve la proximité avec les paroles entendues lors du baptême et de la transfiguration dans Luc, sans expliciter cette relation dans le corps du texte.
- issue: Portée de ἐντραπήσονται
  choice: le respecteront-ils
  alternative: auront-ils honte devant lui
  rationale: Le contexte favorise l’idée de respect ou de déférence, mais la note conserve la nuance possible de honte ou de retenue devant la personne.
translation_notes:
  register: Français international moderne, naturel et digne. Le futur « J’enverrai » exprime une décision ferme, tandis que « peut-être » maintient l’incertitude présente dans le grec. L’inversion « le respecteront-ils » convient au registre narratif soutenu sans être archaïque.
