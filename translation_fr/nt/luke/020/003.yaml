source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ εἶπεν πρὸς αὐτούς· Ἐρωτήσω ὑμᾶς ⸀κἀγὼ λόγον, καὶ εἴπατέ μοι·
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/003.yaml
  text: But in reply he said to them[a], “I also will ask you a question, and you tell me:”
translation:
  language: fr
  text: 'Mais il leur répondit : « Moi aussi, je vais vous poser une question[a]. Dites-moi : »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « une parole » ou « une chose ». Le grec emploie λόγον, qui désigne ici, dans cette tournure, ce qui est demandé, donc une question.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ εἶπεν πρὸς αὐτούς
  choice: Mais il leur répondit
  rationale: Cette formulation française naturelle réunit le participe de réponse et le verbe principal sans la lourdeur de « ayant répondu, il leur dit ». « Mais » rend la transition légèrement contrastive de δέ dans cet échange conflictuel.
- source_word: Ἐρωτήσω ὑμᾶς
  choice: je vais vous poser une question
  rationale: Le futur proche convient au français courant pour une action immédiatement annoncée. « Poser une question à quelqu’un » rend naturellement ἐρωτάω avec son complément de personne.
- source_word: κἀγὼ
  choice: Moi aussi
  rationale: 'Le pronom disjoint placé en tête conserve l’accent réciproque et emphatique de καὶ ἐγώ : eux l’ont interrogé, et lui aussi va les interroger.'
- source_word: λόγον
  choice: une question
  rationale: Même si λόγος signifie littéralement « parole », « propos » ou « affaire », son association avec ἐρωτάω désigne ici idiomatiquement ce qui est demandé, donc une question.
- source_word: καὶ εἴπατέ μοι
  choice: Dites-moi
  rationale: L’impératif pluriel est rendu directement. Une nouvelle phrase évite une coordination française maladroite tout en conservant la force du commandement.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et oralement naturel. Le tutoiement pluriel est marqué par « vous ». La ponctuation finale avec deux-points maintient l’introduction de la question formulée au verset suivant.
