language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὅτι δὲ ἐγείρονται οἱ νεκροὶ καὶ Μωϋσῆς ἐμήνυσεν ἐπὶ τῆς βάτου, ὡς λέγει κύριον τὸν θεὸν Ἀβραὰμ ⸀καὶ θεὸν Ἰσαὰκ ⸁καὶ θεὸν Ἰακώβ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/037.yaml
  text: But that the dead are raised[a], even Moses made known in the passage about the bush[b], where he calls the Lord the God of Abraham and the God of Isaac and the God of Jacob.
translation:
  language: fr
  text: Mais que les morts ressuscitent, Moïse lui-même l’a fait connaître dans le passage sur le buisson[a], lorsqu’il appelle le Seigneur[b] « le Dieu d’Abraham, le Dieu d’Isaac et le Dieu de Jacob ».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « près du buisson » : l’expression grecque peut désigner soit la scène elle-même, soit, par un usage idiomatique, le passage des Écritures concernant le buisson ardent (Exode 3).'
    reason: lexical_alternative
  - marker: b
    text: 'Grec : « le Seigneur ». Cette formulation reflète la manière habituelle dont la Septante rend le nom divin en Exode 3.'
    reason: cross_reference
lexical_decisions:
- source_word: ἐγείρονται
  choice: sont ressuscités
  rationale: Le présent passif est conservé afin de laisser entendre l’action de Dieu, tout en employant le terme français courant dans ce contexte de résurrection.
- source_word: οἱ νεκροὶ
  choice: les morts
  rationale: Équivalent français naturel de l’adjectif substantivé, qui en préserve le sens collectif.
- source_word: ἐμήνυσεν
  choice: a fait connaître
  rationale: Cette expression rend l’idée de révéler ou de signaler clairement, sans transformer le témoignage de Moïse en proclamation formelle.
- source_word: ἐπὶ τῆς βάτου
  choice: dans le passage du buisson
  rationale: Dans ce contexte, l’expression désigne naturellement le passage scripturaire relatif au buisson, tout en laissant l’autre lecture possible en note.
- source_word: ὡς λέγει
  choice: quand il appelle
  rationale: Le verbe introduit ici la désignation du Seigneur comme Dieu d’Abraham, d’Isaac et de Jacob; « appelle » rend naturellement la construction grecque.
- source_word: κύριον
  choice: le Seigneur
  rationale: Rend le titre divin κύριος conformément à l’usage français courant et au texte grec de la citation.
- source_word: θεὸν Ἀβραὰμ καὶ θεὸν Ἰσαὰκ καὶ θεὸν Ἰακώβ
  choice: le Dieu d’Abraham, le Dieu d’Isaac et le Dieu de Jacob
  rationale: La répétition de « le Dieu » conserve l’insistance et le rythme du grec, importants pour l’argument de Jésus.
theological_decisions:
- issue: Formulation de la résurrection dans l’argument de Jésus contre les sadducéens
  choice: les morts sont ressuscités
  alternative: les morts ressuscitent
  rationale: La formulation retenue préserve le passif grec et suggère l’action divine sans l’expliciter davantage que le texte.
- issue: Traduction de κύριος dans une citation concernant le Dieu d’Israël
  choice: le Seigneur
  alternative: l’Éternel
  rationale: Le texte grec porte κύριος; « le Seigneur » le traduit directement, tandis qu’une note signale son rapport avec la manière dont la Septante rend le nom divin.
translation_notes:
  register: Français international actuel, clair et digne. La cadence solennelle de la formule d’Exode est conservée par la répétition de « le Dieu », tandis que « Moïse lui-même » rend l’insistance de καὶ Μωϋσῆς.
