  source_fidelity: La forme « sont ressuscités » est un parfait français (« have risen / have been raised ») et ne rend pas correctement le présent grec ἐγείρονται. « Ressuscitent » rend le présent dans l’usage français courant de ce contexte, même si le passif grec ne peut être reproduit idiomatiquement sans lourdeur. Le sens de ἐπὶ τῆς βάτου est celui du passage scripturaire concernant le buisson; « passage sur le buisson » est plus naturel que « passage du buisson ».
  naturalness: 'La phrase est claire et de registre approprié. La révision allège deux calques potentiels : « passage sur le buisson » est idiomatique, et « lorsqu’il appelle » s’enchaîne naturellement avec la citation.'
  terminology: '« Moïse », « les morts », « le Seigneur » et la triple répétition de « le Dieu de » sont justes. Les ancres françaises sont correctement placées : la note a explicite le syntagme sur le buisson, et la note b explicite « le Seigneur ».'
