  - severity: low
    issue: « dans le passage du buisson » est peu idiomatique
    rationale: Pour une référence à une péricope ou à un récit, « dans le passage sur le buisson » exprime plus naturellement le sens littéraire de l’idiome grec, sans exclure l’alternative locative signalée en note.
