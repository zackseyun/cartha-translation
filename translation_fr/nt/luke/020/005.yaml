id: LUK.20.5
reference: Luke 20:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οἱ δὲ συνελογίσαντο πρὸς ἑαυτοὺς λέγοντες ὅτι Ἐὰν εἴπωμεν· Ἐξ οὐρανοῦ, ἐρεῖ· Διὰ τί οὐκ ἐπιστεύσατε αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/005.yaml
  text: But they reasoned among themselves[a], saying, “If we say, ‘From heaven,’ he will say[b], ‘Why did you not believe him?’”
translation:
  language: fr
  text: 'Mais ils délibérèrent entre eux : « Si nous répondons : “Du ciel”, il dira : “Pourquoi ne l’avez-vous pas cru[a] ?” »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Pourquoi ne lui avez-vous pas fait confiance ? »'
    reason: Le verbe grec peut exprimer le fait de croire les paroles d’une personne ou de lui faire confiance.
lexical_decisions:
- source_word: συνελογίσαντο πρὸς ἑαυτοὺς
  choice: ils raisonnèrent entre eux
  rationale: Le verbe exprime une délibération réfléchie, voire calculée, menée au sein du groupe. « Raisonnèrent entre eux » conserve cette dimension cognitive sans réduire l’action à une simple discussion.
- source_word: λέγοντες
  choice: ':'
  rationale: Les deux-points introduisent naturellement en français le contenu de leur délibération et rendent sans lourdeur le participe « disant ».
- source_word: Ἐὰν εἴπωμεν
  choice: Si nous répondons
  rationale: Dans le contexte d’une question posée par Jésus, εἴπωμεν signifie concrètement donner une réponse. « Répondons » est naturel en français tout en conservant la valeur conditionnelle.
- source_word: Ἐξ οὐρανοῦ
  choice: Du ciel
  rationale: Cette formulation garde l’expression grecque, qui évoque l’origine et l’autorité divines, sans l’expliciter par « de Dieu ».
- source_word: ἐρεῖ
  choice: il dira
  rationale: Le grec emploie le verbe général « dire »; la question citée porte elle-même la force interrogative.
- source_word: ἐπιστεύσατε αὐτῷ
  choice: ne l’avez-vous pas cru
  rationale: Avec le datif de personne, πιστεύω peut signifier croire ce qu’une personne affirme ou lui faire confiance. « Le croire » convient ici au témoignage de Jean sans introduire la nuance plus forte de « croire en lui ».
theological_decisions:
- issue: Origine divine impliquée par « Du ciel »
  choice: Conserver « Du ciel »
  alternative: « De Dieu »
  rationale: « Du ciel » préserve la formulation révérencielle et l’implication d’une autorité divine sans transformer cette implication en explicitation.
- issue: Portée de la foi envers Jean
  choice: « ne l’avez-vous pas cru »
  alternative: « ne lui avez-vous pas fait confiance »
  rationale: Le contexte porte d’abord sur l’acceptation du témoignage et de l’autorité de Jean. La traduction retenue évite de suggérer nécessairement une foi personnelle « en » Jean, tout en signalant l’autre nuance possible en note.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple convient au registre narratif biblique écrit. Les deux-points évitent le calque pesant « en disant » tout en conservant clairement le contenu de la délibération.
