id: LUK.20.41
reference: Luke 20:41
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Εἶπεν δὲ πρὸς αὐτούς· Πῶς λέγουσιν τὸν χριστὸν ⸂εἶναι Δαυὶδ υἱόν⸃;
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/041.yaml
  text: But he said to them[b][a], “How do they say that the Messiah is David’s son?”
translation:
  language: fr
  text: 'Mais il leur dit : « Comment peut-on dire que le Messie[a] est fils de David[b] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le Christ ».
    reason: alternative_reading
  - marker: b
    text: 'On pourrait aussi traduire : « un fils de David » ou « le Fils de David ». Le grec dit littéralement : « fils de David ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Mais
  rationale: 'La particule marque ici une légère transition contrastive : Jésus reprend la parole en posant une question qui met en difficulté l''affirmation courante.'
- source_word: πρὸς αὐτούς
  choice: il leur dit
  rationale: Cette formulation française rend naturellement la construction grecque de parole adressée à un groupe.
- source_word: Πῶς λέγουσιν
  choice: Comment peut-on dire
  rationale: Le pluriel sans sujet exprimé a une valeur indéfinie. Le pronom « on » est naturel en français et préserve l'absence d'identification des personnes visées.
- source_word: τὸν χριστόν
  choice: le Messie
  rationale: Dans ce contexte explicitement davidique, Χριστός désigne le roi libérateur attendu; « Messie » rend clairement ce titre.
- source_word: εἶναι
  choice: est
  rationale: Après « dire que », le français emploie naturellement une proposition finie plutôt qu'un infinitif calqué sur le grec.
- source_word: Δαυὶδ υἱόν
  choice: fils de David
  rationale: La tournure française sans article après « être » est idiomatique et maintient la relation filiale davidique sans imposer « un fils » ni transformer l'expression en titre figé.
theological_decisions:
- issue: Rendu de Χριστός
  choice: le Messie
  alternative: le Christ
  rationale: Le contexte met au premier plan l'attente du descendant royal de David. « Messie » exprime ce sens titulaire sans effacer la possibilité traditionnelle « Christ », signalée en note.
- issue: Filiation davidique
  choice: fils de David
  alternative: un fils de David / le Fils de David
  rationale: Ce rendu reste proche de l'expression grecque anarthre et conserve la tension que Jésus développera dans les versets suivants, sans déterminer plus que le texte s'il s'agit d'une simple descendance ou d'un titre consacré.
translation_notes:
  register: Français international moderne, naturel et digne. « Comment peut-on dire » restitue le sujet pluriel indéfini de λέγουσιν; « fils de David » préserve la formulation et la tension théologique du grec.
