source:
  edition: SBLGNT
  text: καὶ ἐπηρώτησαν αὐτὸν λέγοντες· Διδάσκαλε, οἴδαμεν ὅτι ὀρθῶς λέγεις καὶ διδάσκεις καὶ οὐ λαμβάνεις πρόσωπον, ἀλλ’ ἐπ’ ἀληθείας τὴν ὁδὸν τοῦ θεοῦ διδάσκεις·
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/021.yaml
  text: And they questioned him[a], saying, “Teacher, we know that you speak and teach rightly, and you do not show partiality[b], but truly teach the way of God.”
translation:
  language: fr
  text: 'Ils lui demandèrent : « Maître, nous savons que tu parles et enseignes avec justesse, que tu ne fais pas preuve de favoritisme[a], mais que tu enseignes en vérité[b] la voie de Dieu. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « tu ne reçois pas de visage » ; idiome signifiant « tu ne fais pas de favoritisme » ou « tu ne te laisses pas influencer par l’apparence ou le rang des personnes ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « mais qu’en vérité, tu enseignes la voie de Dieu ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπηρώτησαν
  choice: ils l’interrogèrent
  rationale: Le verbe désigne ici une question délibérée dans un contexte de mise à l’épreuve. « Interrogèrent » rend cette nuance sans imposer une hostilité excessive.
- source_word: Διδάσκαλε
  choice: Maître
  rationale: En français biblique moderne, « Maître » est une adresse naturelle pour un enseignant reconnu; le contexte immédiat met précisément en avant son activité d’enseignement.
- source_word: ὀρθῶς λέγεις καὶ διδάσκεις
  choice: tu parles et enseignes avec justesse
  rationale: Cette formulation conserve les deux verbes grecs et fait porter ὀρθῶς naturellement sur l’un et l’autre, avec l’idée de correction et de droiture.
- source_word: οὐ λαμβάνεις πρόσωπον
  choice: sans faire de favoritisme
  rationale: L’expression littérale « recevoir un visage » est un idiome signifiant ne pas se laisser influencer par le rang, l’apparence ou l’identité des personnes.
- source_word: ἐπ’ ἀληθείας
  choice: en vérité
  rationale: La locution indique que l’enseignement est donné conformément à la vérité. « En vérité » conserve sa portée et l’ambiguïté possible de son rattachement syntaxique.
- source_word: τὴν ὁδὸν τοῦ θεοῦ
  choice: la voie de Dieu
  rationale: « La voie de Dieu » respecte la structure grecque et préserve la résonance théologique de la conduite, de la volonté ou du chemin établis par Dieu.
theological_decisions:
- issue: Impartialité exprimée par l’idiome οὐ λαμβάνεις πρόσωπον
  choice: sans faire de favoritisme
  alternative: sans te laisser influencer par l’apparence des gens
  rationale: Le rendu idiomatique communique clairement que Jésus ne règle pas son enseignement selon le statut des personnes, sans réduire le sens à leur seule apparence physique.
- issue: Rattachement de ἐπ’ ἀληθείας
  choice: que tu enseignes en vérité la voie de Dieu
  alternative: mais qu’en vérité, tu enseignes la voie de Dieu
  rationale: La place de « en vérité » près de « enseignes » reflète l’ordre grec tout en laissant entendre soit la manière véridique d’enseigner, soit l’affirmation que Jésus enseigne réellement la voie de Dieu.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe conserve le parallélisme de la flatterie et les deux verbes « parler » et « enseigner ». « Maître » est retenu comme appellation française usuelle d’un enseignant, tandis que les notes rendent visibles l’idiome grec et l’ambiguïté de ἐπ’ ἀληθείας.
