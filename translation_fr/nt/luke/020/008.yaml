  source_fidelity: 'Le texte rend fidèlement la réponse de Jésus : οὐδέ est bien relié au refus précédent par « Moi non plus », le futur « je ne vous dirai pas » exprime naturellement la réponse en contexte, et « ces choses » conserve le pluriel de ταῦτα. « En vertu de quelle autorité » rend de manière exacte la question du fondement ou du droit d’agir exprimée par ἐν ποίᾳ ἐξουσίᾳ.'
  naturalness: Le français est moderne, clair et d’un registre narratif digne. « Moi non plus » est idiomatique dans cette réplique. « En vertu de quelle autorité » est un peu soutenu, mais reste naturel et précis dans ce contexte public et polémique.
  terminology: « Autorité » est le terme approprié pour ἐξουσία ici, sans réduire le mot à la puissance ni imposer une interprétation sur l’origine de cette autorité. La note « avec quelle autorité » fournit une alternative française recevable sans modifier le sens.
