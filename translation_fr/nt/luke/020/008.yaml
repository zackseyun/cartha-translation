reference: Luke 20:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ὁ Ἰησοῦς εἶπεν αὐτοῖς· Οὐδὲ ἐγὼ λέγω ὑμῖν ἐν ποίᾳ ἐξουσίᾳ ταῦτα ποιῶ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/008.yaml
  text: And Jesus said to them[a], “Neither will I tell you by what authority I do these things.”
translation:
  language: fr
  text: 'Et Jésus leur dit : « Moi non plus, je ne vous dirai pas en vertu de quelle autorité[a] je fais ces choses. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « avec quelle autorité ».'
    reason: Variante lexicale possible pour ἐν ποίᾳ ἐξουσίᾳ.
lexical_decisions:
- source_word: Οὐδὲ ἐγὼ λέγω ὑμῖν
  choice: Moi non plus, je ne vous dirai pas
  rationale: Οὐδέ rattache la réponse de Jésus au refus exprimé au verset précédent. En français, le futur rend naturellement ce refus de communiquer la réponse, tandis que « moi non plus » conserve la réciprocité marquée par οὐδέ et ἐγώ.
- source_word: ἐν ποίᾳ ἐξουσίᾳ
  choice: en vertu de quelle autorité
  rationale: Cette formulation française exprime naturellement le fondement ou le droit au titre duquel Jésus agit. « Avec quelle autorité » reste également possible.
- source_word: ἐξουσίᾳ
  choice: autorité
  rationale: Dans ce contexte, ἐξουσία désigne l'autorité légitime ou le droit d'agir, plutôt qu'une simple puissance.
- source_word: ταῦτα
  choice: ces choses
  rationale: Cette expression conserve explicitement le pluriel grec et renvoie aux actes de Jésus qui sont contestés.
- source_word: ποιῶ
  choice: je fais
  rationale: Le présent français correspond au présent grec et décrit les actes accomplis par Jésus.
- source_word: καὶ ὁ Ἰησοῦς εἶπεν αὐτοῖς
  choice: Et Jésus leur dit
  rationale: La formulation suit sobrement la coordination narrative καί et rend le datif αὐτοῖς par « leur ».
theological_decisions:
- issue: Le refus de Jésus de répondre aux responsables
  choice: Présenter directement son refus de révéler l'origine de son autorité, sans en préciser le motif.
  alternative: Faire entendre explicitement qu'il esquive la question ou qu'il prononce ici un jugement sur leur incrédulité.
  rationale: Le verset affirme seulement que Jésus ne leur indiquera pas en vertu de quelle autorité il agit. Ajouter un motif moral ou doctrinal résoudrait une tension que le texte laisse implicite.
translation_notes:
  register: Français international moderne, digne et accessible. « En vertu de » exprime clairement l'idée de fondement légitime; « ces choses » conserve le pluriel du grec malgré son tour légèrement plus formel.
