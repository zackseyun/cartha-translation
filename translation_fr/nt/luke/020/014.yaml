id: LUK.20.14
reference: Luke 20:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἰδόντες δὲ αὐτὸν οἱ γεωργοὶ διελογίζοντο πρὸς ⸀ἀλλήλους λέγοντες· Οὗτός ἐστιν ὁ κληρονόμος· ⸀ἀποκτείνωμεν αὐτόν, ἵνα ἡμῶν γένηται ἡ κληρονομία·
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/014.yaml
  text: But when the vine-growers saw him[a], they reasoned with one another, saying, ‘This is the heir. Let us kill him, so that the inheritance may become ours.’
translation:
  language: fr
  text: 'Mais quand les vignerons[a] le virent, ils se concertèrent et dirent : « Voici l’héritier. Tuons-le, afin que l’héritage devienne nôtre. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « cultivateurs » ou « fermiers ». Le mot grec désigne des travailleurs agricoles ; dans cette parabole, ils cultivent une vigne.
    reason: lexical_alternative
lexical_decisions:
- source_word: γεωργοὶ
  choice: vignerons
  rationale: Dans le contexte immédiat d’une vigne, « vignerons » désigne naturellement ceux qui la cultivent. Le mot grec est agricole et ne signifie pas à lui seul « locataires », même si le contexte plus large leur attribue ce rôle.
- source_word: διελογίζοντο πρὸς ἀλλήλους
  choice: ils se concertèrent
  rationale: Cette formulation française naturelle exprime la délibération réciproque et calculée des cultivateurs, sans suggérer qu’ils se disputaient.
- source_word: κληρονόμος
  choice: héritier
  rationale: « Héritier » est l’équivalent juridique et narratif direct du terme grec.
- source_word: ἀποκτείνωμεν
  choice: Tuons-le
  rationale: Le subjonctif aoriste à la première personne du pluriel a une valeur exhortative. « Tuons-le » la rend directement sans ajouter au verbe une qualification morale comme « assassinons-le ».
- source_word: ἵνα ἡμῶν γένηται ἡ κληρονομία
  choice: afin que l’héritage devienne nôtre
  rationale: Cette traduction conserve à la fois la finalité introduite par ἵνα et l’idée de devenir exprimée par γένηται.
- source_word: ἰδόντες
  choice: quand ... le virent
  rationale: Le participe aoriste est rendu par une proposition temporelle idiomatique en français.
- source_word: δὲ
  choice: Mais
  rationale: « Mais » marque la légère opposition et le tournant narratif lié à l’arrivée du fils.
theological_decisions:
- issue: Désignation des γεωργοί dans la parabole de la vigne
  choice: vignerons
  alternative: fermiers ou cultivateurs
  rationale: « Vignerons » rend le sens agricole dans le cadre précis de la vigne. Traduire par « locataires » expliciterait leur statut suggéré par le contexte, mais non contenu à lui seul dans ce nom grec.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple convient au récit écrit. « Se concertèrent » évite le calque peu idiomatique « raisonnèrent entre eux » tout en conservant l’idée d’une délibération commune et calculée.
