id: LUK.20.35
reference: Luke 20:35
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οἱ δὲ καταξιωθέντες τοῦ αἰῶνος ἐκείνου τυχεῖν καὶ τῆς ἀναστάσεως τῆς ἐκ νεκρῶν οὔτε γαμοῦσιν οὔτε ⸀γαμίζονται·
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/035.yaml
  text: But those who are considered worthy to attain that age and the resurrection from the dead neither marry nor are given in marriage[a][b].
translation:
  language: fr
  text: Mais ceux qui ont été jugés dignes[a] d’avoir part à cet âge-là[b] et à la résurrection d’entre les morts ne se marient pas et ne sont pas donnés en mariage.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « qui sont considérés dignes » ou « qui sont estimés dignes ». Le grec emploie un participe passif.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « à l’âge à venir ». Littéralement : « à cet âge-là ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: καταξιωθέντες
  choice: ont été jugés dignes
  rationale: Le participe passif exprime une évaluation reçue plutôt qu’une dignité intrinsèque; cette formulation française préserve clairement le passif.
- source_word: τοῦ αἰῶνος ἐκείνου
  choice: ce monde-là
  rationale: Dans ce contraste eschatologique, αἰών désigne l’ordre d’existence futur. « Ce monde-là » est naturel en français et garde le démonstratif grec; « le monde à venir » reste indiqué en note.
- source_word: τυχεῖν
  choice: d’avoir part à
  rationale: Avec le génitif, le verbe signifie obtenir ou parvenir à recevoir quelque chose. « Avoir part à » s’applique naturellement aux deux compléments coordonnés sans suggérer que cette participation serait méritée.
- source_word: ἀναστάσεως τῆς ἐκ νεκρῶν
  choice: la résurrection d’entre les morts
  rationale: Cette expression française rend distinctement ἐκ νεκρῶν et demeure claire et traditionnelle.
- source_word: γαμοῦσιν
  choice: se marient
  rationale: Le verbe signifie contracter mariage; la tournure pronominale est la formulation française moderne la plus naturelle.
- source_word: γαμίζονται
  choice: sont donnés en mariage
  rationale: Le passif est conservé afin de maintenir la distinction du grec entre se marier et être donné en mariage, malgré le caractère ancien de l’usage social évoqué.
theological_decisions:
- issue: La question de savoir si καταξιωθέντες implique que l’accès à la résurrection est mérité
  choice: « ont été jugés dignes » maintient l’idée d’une évaluation sans affirmer une dignité intrinsèque ni préciser explicitement qui juge.
  alternative: « ceux qui sont dignes » pourrait laisser entendre une qualité propre ou un mérite acquis.
  rationale: Le passif grec laisse l’agent sous-entendu. La traduction préserve cette tension théologique sans transformer le jugement en mérite personnel.
translation_notes:
  register: Français international moderne, digne et accessible. « Ce monde-là » exprime naturellement le contraste avec le monde présent, tandis que la note conserve le sens plus formel d’« âge ». Les marqueurs [a] et [b] figurent tous deux dans le texte principal.
