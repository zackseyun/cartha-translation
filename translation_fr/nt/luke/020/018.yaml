  text: πᾶς ὁ πεσὼν ἐπ’ ἐκεῖνον τὸν λίθον συνθλασθήσεται· ἐφ’ ὃν δ’ ἂν πέσῃ, λικμήσει αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/018.yaml
  text: Everyone who falls on that stone will be broken to pieces[a], but the one on whom it falls[b], it will crush him.
translation:
  language: fr
  text: Quiconque tombera sur cette pierre sera brisé en morceaux[a] ; mais celui sur qui elle tombera, elle l’écrasera[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « sera fracassé ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « le réduira en poussière » ou « le dispersera comme la balle » ; le verbe grec exprime une action plus forte qu’un simple choc.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς ὁ πεσὼν
  choice: Quiconque tombera
  rationale: Le participe substantivé avec πᾶς a une portée générale. « Quiconque » exprime naturellement cette universalité en français.
- source_word: ἐπ’ ἐκεῖνον τὸν λίθον
  choice: sur cette pierre
  rationale: ἐπί avec l’accusatif après πίπτω indique ici un mouvement vers ou sur la pierre ; « cette » conserve la valeur démonstrative.
- source_word: συνθλασθήσεται
  choice: sera brisé en morceaux
  rationale: Le futur passif désigne le fait d’être fracassé ou brisé. Cette formulation rend la gravité du résultat sans préciser indûment le mécanisme.
- source_word: ἐφ’ ὃν δ’ ἂν πέσῃ
  choice: mais celui sur qui elle tombera
  rationale: La relative avec ἄν et le subjonctif exprime un cas indéfini. Cette formulation conserve le parallélisme avec la première proposition.
- source_word: λικμήσει
  choice: écrasera
  rationale: Le verbe peut évoquer le broyage ou le vannage qui disperse. « Écrasera » est clair dans le texte principal, tandis que la note conserve les nuances plus fortes.
- source_word: αὐτόν
  choice: l’
  rationale: Le pronom masculin singulier renvoie à l’antécédent générique « celui » ; le pronom objet français en maintient la référence sans lourdeur.
theological_decisions:
- issue: Image de la pierre comme instrument de jugement
  choice: Conserver la pierre comme agent d’un jugement destructeur, sans atténuer la métaphore.
  alternative: Rendre l’image plus faiblement comme un simple faux pas ou une blessure.
  rationale: Dans le contexte, les deux verbes expriment une destruction grave. La traduction en maintient la force tout en évitant d’ajouter une interprétation absente du verset.
- issue: Référence générique au masculin singulier
  choice: Employer « celui » puis « l’ » dans la seconde proposition.
  alternative: Employer une reformulation épicène telle que « la personne sur qui… ».
  rationale: Le grec présente un antécédent et un pronom masculins singuliers à portée générique. La formulation française conserve cette structure représentative de façon naturelle.
translation_notes:
  register: Français international moderne, digne et accessible. Le futur français rend naturellement les deux éventualités générales. Le parallélisme et la sévérité croissante des deux propositions sont conservés.
