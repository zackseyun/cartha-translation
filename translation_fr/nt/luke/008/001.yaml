id: LUK.8.1
reference: Luke 8:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ἐν τῷ καθεξῆς καὶ αὐτὸς διώδευεν κατὰ πόλιν καὶ κώμην κηρύσσων καὶ εὐαγγελιζόμενος τὴν βασιλείαν τοῦ θεοῦ, καὶ οἱ δώδεκα σὺν αὐτῷ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/001.yaml
  text: And it happened soon afterward that he was traveling through city after city and village after village[a], proclaiming and bringing the good news of the kingdom of God[c][b], and the Twelve were with him.
translation:
  language: fr
  text: Par la suite, il allait de ville en ville et de village en village, proclamant et annonçant la bonne nouvelle du royaume de Dieu[a]. Les Douze étaient avec lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « du règne de Dieu ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ἐν τῷ καθεξῆς
  choice: Peu après
  rationale: Cette formule narrative de Luc marque le passage à l’événement suivant. « Peu après » en restitue naturellement la valeur temporelle en français moderne, sans conserver la tournure grecque peu idiomatique « il arriva que ».
- source_word: αὐτὸς διώδευεν
  choice: il allait
  rationale: L’imparfait grec présente une activité en cours ou répétée. Avec les compléments distributifs qui suivent, « il allait de ville en ville » exprime naturellement ce déplacement continu.
- source_word: κατὰ πόλιν καὶ κώμην
  choice: de ville en ville et de village en village
  rationale: κατά suivi de noms au singulier a ici une valeur distributive. Cette formulation française rend clairement le passage successif par différentes localités sans introduire l’idée de totalité.
- source_word: κηρύσσων
  choice: proclamant
  rationale: Le terme évoque une annonce publique faite avec autorité. « Proclamant » conserve ce sens sans le limiter à la prédication sous forme de sermon.
- source_word: εὐαγγελιζόμενος
  choice: annonçant la bonne nouvelle
  rationale: Cette expression rend le sens proprement évangélique du verbe tout en le distinguant de κηρύσσων, traduit par « proclamant ».
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: le royaume de Dieu
  rationale: « Royaume de Dieu » est une expression française établie et suffisamment large pour laisser à βασιλεία ses dimensions de souveraineté et de domaine, tandis qu’une note signale l’autre nuance possible.
- source_word: οἱ δώδεκα
  choice: les Douze
  rationale: Le grec emploie la désignation reconnue du groupe sans ajouter « disciples » ni « apôtres » ; la majuscule indique cette valeur de titre collectif.
- source_word: σὺν αὐτῷ
  choice: étaient avec lui
  rationale: L’ajout du verbe requis en français exprime simplement l’accompagnement indiqué par le grec.
theological_decisions:
- issue: Sens de βασιλεία τοῦ θεοῦ
  choice: le royaume de Dieu
  alternative: le règne de Dieu
  rationale: βασιλεία peut désigner aussi bien l’exercice de la souveraineté divine que le domaine où elle s’exerce. Le texte principal retient la formule française traditionnelle et englobante, tandis que la note préserve explicitement la nuance dynamique possible.
translation_notes:
  register: Français international moderne, naturel et digne. La répétition « de ville en ville et de village en village » conserve la force distributive du grec. Les deux participes sont rendus séparément afin de ne pas confondre la proclamation publique et l’annonce de la bonne nouvelle.
