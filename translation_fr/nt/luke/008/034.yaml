id: LUK.8.34
reference: Luke 8:34
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἰδόντες δὲ οἱ βόσκοντες τὸ ⸀γεγονὸς ἔφυγον καὶ ἀπήγγειλαν εἰς τὴν πόλιν καὶ εἰς τοὺς ἀγρούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/034.yaml
  text: When the herdsmen saw what had happened[b][a], they fled and reported it in the city and in the countryside.
translation:
  language: fr
  text: Quand ceux qui gardaient le troupeau virent ce qui s’était passé[a], ils s’enfuirent et rapportèrent la nouvelle dans la ville et dans la campagne[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ce qui était arrivé ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « dans les champs »; il s’agit ici de la région rurale environnante.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδόντες
  choice: Quand … virent
  rationale: Le participe aoriste est rendu par une proposition temporelle naturelle en français, qui conserve son rapport avec les verbes principaux.
- source_word: οἱ βόσκοντες
  choice: ceux qui gardaient le troupeau
  rationale: Le participe substantivé désigne les personnes qui faisaient paître et surveillaient le troupeau. Cette formulation reste naturelle sans employer « bergers », terme qui évoquerait surtout des moutons.
- source_word: τὸ γεγονός
  choice: ce qui s’était passé
  rationale: Le participe parfait substantivé désigne l’événement accompli qu’ils viennent de constater. « Ce qui s’était passé » exprime naturellement cette antériorité.
- source_word: ἔφυγον
  choice: ils s’enfuirent
  rationale: Le verbe φεύγω indique qu’ils prirent la fuite; le passé simple convient au registre narratif.
- source_word: ἀπήγγειλαν
  choice: rapportèrent la nouvelle
  rationale: Le verbe signifie transmettre ou annoncer une information. « La nouvelle » explicite sobrement l’objet sous-entendu par le contexte.
- source_word: εἰς τὴν πόλιν
  choice: dans la ville
  rationale: Avec le verbe de communication, la préposition directionnelle indique ici le lieu où la nouvelle fut rapportée; « dans la ville » est idiomatique en français.
- source_word: καὶ εἰς τοὺς ἀγρούς
  choice: et dans la campagne
  rationale: Dans son opposition à « la ville », le pluriel ἀγρούς désigne les environs ruraux, et non seulement des champs particuliers.
