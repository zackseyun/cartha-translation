  source_fidelity: 'Le texte rend fidèlement la structure et le sens du grec : le participe aoriste Ἰδόντες est naturellement exprimé par « Quand ... virent »; οἱ βόσκοντες désigne bien les personnes chargées du troupeau; τὸ γεγονός est correctement rendu par « ce qui s’était passé »; et les deux actions principales, la fuite et le rapport, sont conservées. « Dans la ville et dans la campagne » reflète adéquatement l’opposition entre τὴν πόλιν et τοὺς ἀγρούς dans ce contexte.'
  naturalness: La formulation est fluide, claire et adaptée au français international moderne. Le passé simple (« virent », « s’enfuirent », « rapportèrent ») convient à un récit biblique soutenu sans être excessivement archaïque. « Ceux qui gardaient le troupeau » est naturel et évite à juste titre « bergers », qui pourrait suggérer des moutons.
