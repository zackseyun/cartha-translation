source:
  edition: SBLGNT
  text: ὅτι θυγάτηρ μονογενὴς ἦν αὐτῷ ὡς ἐτῶν δώδεκα καὶ αὐτὴ ἀπέθνῃσκεν. Ἐν δὲ τῷ ὑπάγειν αὐτὸν οἱ ὄχλοι συνέπνιγον αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/042.yaml
  text: because he had an only daughter[a], about twelve years old, and she was dying. And as he went[c][b], the crowds were pressing in on him.
translation:
  language: fr
  text: car il avait une fille unique[a], âgée d’environ douze ans, et elle était mourante. Pendant que Jésus s’y rendait, les foules le serraient de tous côtés[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sa seule fille ».
    reason: lexical_alternative
  - marker: b
    text: Le verbe grec peut évoquer une foule qui serre quelqu’un au point de presque l’étouffer ou l’écraser.
    reason: lexical_alternative
lexical_decisions:
- source_word: μονογενὴς
  choice: unique
  rationale: Avec « fille », le terme désigne l’unique enfant de ce type dans la famille, sans nuance métaphysique liée à l’engendrement. « Une fille unique » est l’expression française naturelle.
- source_word: ὡς ἐτῶν δώδεκα
  choice: âgée d’environ douze ans
  rationale: ὡς devant un nombre marque l’approximation; cette formulation l’exprime clairement en français courant.
- source_word: ἀπέθνῃσκεν
  choice: était mourante
  rationale: L’imparfait grec décrit un processus en cours. « Était mourante » conserve cet aspect sans annoncer prématurément une mort accomplie.
- source_word: Ἐν δὲ τῷ ὑπάγειν αὐτὸν
  choice: Pendant que Jésus s’y rendait
  rationale: La construction exprime la simultanéité. Le pronom est explicité par « Jésus » pour éviter une ambiguïté naturelle en français, et « s’y rendait » indique le déplacement vers la destination déjà donnée par le contexte.
- source_word: οἱ ὄχλοι
  choice: les foules
  rationale: Le pluriel grec est conservé, même si le singulier collectif « la foule » serait plus idiomatique dans certains contextes français.
- source_word: συνέπνιγον
  choice: se pressaient autour de
  rationale: Le verbe évoque une forte compression due à la foule. Cette formulation rend la scène naturellement tout en laissant à une note le soin de signaler la vigueur de l’image grecque.
- source_word: ὅτι
  choice: car
  rationale: La conjonction explique l’urgence de la demande formulée au verset précédent. « Car » convient à un récit suivi commençant au milieu d’une phrase ou d’une unité syntaxique.
- source_word: αὐτῷ
  choice: il avait
  rationale: Le datif associé à ἦν exprime ici la possession; le français la rend naturellement par le verbe « avoir ».
theological_decisions: []
translation_notes:
  register: 'Français international moderne, narratif et digne. La phrase conserve le lien causal avec le verset précédent. « Jésus » explicite le référent du pronom grec afin d’éviter que le lecteur français ne l’attribue au père. Deux notes seulement sont retenues: l’âge approximatif est déjà pleinement exprimé dans le texte et ne nécessite pas de note.'
