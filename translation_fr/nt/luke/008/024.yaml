id: LUK.8.24
reference: Luke 8:24
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: προσελθόντες δὲ διήγειραν αὐτὸν λέγοντες· Ἐπιστάτα ἐπιστάτα, ἀπολλύμεθα· ὁ δὲ ⸀διεγερθεὶς ἐπετίμησεν τῷ ἀνέμῳ καὶ τῷ κλύδωνι τοῦ ὕδατος, καὶ ἐπαύσαντο, καὶ ἐγένετο γαλήνη.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/024.yaml
  text: Then they came and woke him[a], saying, “Master, Master, we are perishing!” And he, having awakened, rebuked the wind and the surging of the water, and they ceased, and there was a calm.
translation:
  language: fr
  text: 'Ils s’approchèrent alors et le réveillèrent en disant : « Maître, Maître, nous périssons ! » Une fois réveillé, il réprimanda le vent et les flots déchaînés ; ils s’apaisèrent, et le calme se fit.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσελθόντες
  choice: Ils s’approchèrent alors
  rationale: Le participe aoriste indique qu’ils se dirigent vers Jésus avant de le réveiller ; « s’approchèrent » conserve ce mouvement sans le surinterpréter.
- source_word: διήγειραν
  choice: le réveillèrent
  rationale: Le verbe transitif désigne naturellement l’action de tirer Jésus de son sommeil.
- source_word: Ἐπιστάτα
  choice: Maître
  rationale: Ce titre d’adresse propre à Luc reconnaît l’autorité de Jésus ; « Maître » en restitue la force sans le réduire au seul rôle d’enseignant.
- source_word: ἀπολλύμεθα
  choice: nous périssons
  rationale: Le présent exprime un péril mortel en cours ; cette formulation garde à la fois l’aspect et la gravité de l’expression grecque.
- source_word: διεγερθεὶς
  choice: Une fois réveillé
  rationale: Cette tournure française naturelle conserve la séquence du participe aoriste passif sans préciser davantage comment le réveil s’est produit.
- source_word: ἐπετίμησεν
  choice: réprimanda
  rationale: Le terme exprime une parole autoritaire adressée au vent et aux eaux ; « réprimanda » conserve cette personnification et correspond à l’usage évangélique.
- source_word: κλύδωνι τοῦ ὕδατος
  choice: les flots déchaînés
  rationale: κλύδων désigne l’agitation, la houle ou le déferlement de l’eau. « Les flots déchaînés » rend l’image avec naturel en français, sans se limiter à de simples « vagues ».
- source_word: ἐπαύσαντο
  choice: ils s’apaisèrent
  rationale: Le pluriel renvoie au vent et aux flots ; « s’apaisèrent » conserve ce pluriel tout en étant idiomatique dans ce contexte.
- source_word: ἐγένετο γαλήνη
  choice: le calme se fit
  rationale: Cette expression française naturelle rend le résultat soudain exprimé par γίνομαι avec γαλήνη.
theological_decisions:
- issue: Titre d’adresse Ἐπιστάτα appliqué à Jésus
  choice: Maître
  alternative: Enseignant ; Chef
  rationale: « Maître » exprime le respect et l’autorité reconnus à Jésus dans le récit sans ajouter un titre ecclésiastique ni limiter son rôle à l’enseignement.
- issue: Autorité de Jésus sur les éléments dans ἐπετίμησεν
  choice: réprimanda
  alternative: commanda sévèrement ; donna un ordre à
  rationale: Le choix maintient la force personnelle et autoritaire du verbe grec ainsi que la tension narrative de Jésus s’adressant aux forces naturelles, sans explicitation doctrinale.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La phrase garde la progression rapide du grec et son enchaînement entre ordre, apaisement et calme. Aucun marqueur de note n’est requis, puisque la solution retenue peut intégrer naturellement le sens de κλύδωνι τοῦ ὕδατος dans le corps du texte.
