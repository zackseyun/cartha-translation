id: LUK.8.27
reference: Luke 8:27
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐξελθόντι δὲ αὐτῷ ἐπὶ τὴν γῆν ⸀ὑπήντησεν ἀνήρ τις ἐκ τῆς πόλεως ⸀ἔχων δαιμόνια· ⸂καὶ χρόνῳ ἱκανῷ οὐκ ἐνεδύσατο ἱμάτιον⸃, καὶ ἐν οἰκίᾳ οὐκ ἔμενεν ἀλλ’ ἐν τοῖς μνήμασιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/027.yaml
  text: And when he came out onto the land[a], a certain man from the city met him, who had demons. And for a considerable time he had not put on clothing[b], and he did not stay in a house but among the tombs.
translation:
  language: fr
  text: 'Lorsqu’il mit pied à terre[a], un homme de la ville vint à sa rencontre : il avait des démons[b]. Et depuis longtemps, il ne portait aucun vêtement et ne demeurait pas dans une maison, mais parmi les tombeaux.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « lorsqu’il débarqua ».
    reason: lexical_alternative
  - marker: b
    text: Ou, de manière plus idiomatique, « il était possédé par des démons ». Le grec dit littéralement qu’il « avait des démons ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθόντι δὲ αὐτῷ ἐπὶ τὴν γῆν
  choice: Lorsqu’il mit pied à terre
  rationale: La construction participiale au datif exprime ici la circonstance temporelle. « Mettre pied à terre » rend naturellement l’arrivée de Jésus sur la terre ferme après la traversée, sans préciser davantage le type de rivage.
- source_word: ὑπήντησεν
  choice: vint à sa rencontre
  rationale: Cette formulation narrative exprime clairement le mouvement du personnage vers Jésus et correspond au sens de rencontre porté par le verbe.
- source_word: ἀνήρ τις
  choice: un homme
  rationale: L’article indéfini français rend naturellement la valeur indéfinie de τις; « un certain homme » serait inutilement lourd en français moderne.
- source_word: ἐκ τῆς πόλεως
  choice: de la ville
  rationale: La préposition indique l’origine ou le rattachement de l’homme à la ville. La formulation reste volontairement simple.
- source_word: ἔχων δαιμόνια
  choice: il avait des démons
  rationale: Cette traduction suit de près l’expression grecque, littéralement « ayant des démons », sans introduire dans le texte principal la notion plus interprétative de possession.
- source_word: χρόνῳ ἱκανῷ
  choice: depuis longtemps
  rationale: L’expression indique une durée importante. « Depuis longtemps » est idiomatique et s’accorde naturellement avec la description de son état prolongé.
- source_word: οὐκ ἐνεδύσατο ἱμάτιον
  choice: il ne portait aucun vêtement
  rationale: La formulation française décrit clairement l’absence durable de vêtements. Elle restitue le sens contextuel du verbe « revêtir » sans produire la tournure artificielle « ne revêtait pas un vêtement ».
- source_word: ἐν οἰκίᾳ οὐκ ἔμενεν
  choice: ne demeurait pas dans une maison
  rationale: « Demeurer » conserve l’idée de séjour ou d’habitation habituelle exprimée par μένω, tout en gardant un registre narratif digne.
- source_word: ἀλλ’ ἐν τοῖς μνήμασιν
  choice: mais parmi les tombeaux
  rationale: « Tombeaux » convient aux lieux funéraires désignés par μνήματα; « parmi » rend naturellement l’idée qu’il séjournait dans cette zone funéraire.
theological_decisions:
- issue: Traduction de δαιμόνια dans le contexte de l’oppression démoniaque
  choice: des démons
  alternative: des esprits impurs
  rationale: Le grec emploie précisément δαιμόνια et non πνεύματα ἀκάθαρτα. « Démons » en est l’équivalent lexical direct et maintient la distinction entre les expressions du texte source.
- issue: Degré d’interprétation de ἔχων δαιμόνια
  choice: il avait des démons
  alternative: il était possédé par des démons
  rationale: Le grec affirme littéralement que l’homme « avait des démons ». Le texte principal conserve cette formulation moins interprétative, tandis que l’expression française courante est signalée en note.
translation_notes:
  register: Français international moderne, narratif et digne. La phrase reste accessible, avec « vint à sa rencontre » et « mit pied à terre » comme tournures courantes. Les deux notes conservent les variantes idiomatiques sans surinterpréter le grec.
