  text: καὶ ἕτερον ⸀κατέπεσεν ἐπὶ τὴν πέτραν, καὶ φυὲν ἐξηράνθη διὰ τὸ μὴ ἔχειν ἰκμάδα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/006.yaml
  text: And another fell on the rock[a], and after it sprang up, it withered because it had no moisture.
translation:
  language: fr
  text: Une autre graine tomba sur la roche[a] ; après avoir germé, elle se dessécha parce qu’elle manquait d’humidité.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sur le rocher ». Le grec emploie le singulier « roche » plutôt que l’expression plus générale « sol pierreux ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕτερον
  choice: une autre graine
  rationale: L’adjectif neutre singulier est employé substantivement. Le nom « graine », sous-entendu dans la parabole, est explicité pour obtenir un français naturel et éviter l’ambiguïté de « une autre » isolé.
- source_word: κατέπεσεν
  choice: tomba
  rationale: L’aoriste de καταπίπτω décrit simplement la chute de la graine ; « tomba » est précis et idiomatique.
- source_word: ἐπὶ τὴν πέτραν
  choice: sur la roche
  rationale: Le singulier πέτρα désigne ici une surface rocheuse concrète. « La roche » préserve mieux ce singulier que « un sol pierreux ».
- source_word: φυὲν
  choice: après avoir germé
  rationale: Le participe aoriste exprime une action antérieure à celle du verbe principal. « Germer » convient naturellement à une graine et rend clairement la succession.
- source_word: ἐξηράνθη
  choice: elle se dessécha
  rationale: 'Dans ce contexte végétal, le passif a un sens résultatif ou intransitif : la pousse s’est desséchée. Cette formulation conserve plus directement l’idée de perte d’humidité que « se flétrit ».'
- source_word: διὰ τὸ μὴ ἔχειν
  choice: parce qu’elle manquait de
  rationale: διά suivi de l’infinitif substantivé exprime la cause. « Parce qu’elle manquait de » est naturel en français et restitue l’absence de la ressource nécessaire.
- source_word: ἰκμάδα
  choice: humidité
  rationale: ἰκμάς désigne l’humidité nécessaire à la croissance ; « humidité » est clair, courant et suffisamment précis.
theological_decisions: []
translation_notes:
  register: Français international moderne, simple et digne. L’explicitation de « graine » facilite la compréhension sans modifier l’image de la parabole ; le point-virgule conserve le lien étroit entre la chute, la germination et le dessèchement.
