id: LUK.8.31
reference: Luke 8:31
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ⸀παρεκάλουν αὐτὸν ἵνα μὴ ἐπιτάξῃ αὐτοῖς εἰς τὴν ἄβυσσον ἀπελθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/031.yaml
  text: And they were begging him not to command them to go into the abyss[a].
translation:
  language: fr
  text: Et ils le suppliaient de ne pas leur ordonner d’aller dans l’abîme[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les profondeurs ». Le mot grec peut désigner une profondeur immense; ici, il évoque probablement l’abîme comme lieu de détention des esprits mauvais.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεκάλουν
  choice: ils le suppliaient
  rationale: L’imparfait exprime une supplication qui se prolonge ou se répète. « Suppliaient » restitue naturellement l’intensité de leur demande dans ce contexte.
- source_word: ἐπιτάξῃ
  choice: ordonner
  rationale: Le verbe désigne un ordre donné avec autorité. « Ordonner » convient ici à la construction française avec un complément d’objet et un infinitif.
- source_word: ἄβυσσον
  choice: l’abîme
  rationale: Dans ce contexte où des démons s’adressent à Jésus, « l’abîme » conserve la portée surnaturelle du terme sans lui ajouter les images plus interprétatives d’un gouffre sans fond.
- source_word: ἀπελθεῖν
  choice: d’aller
  rationale: L’infinitif de mouvement est rendu simplement par « aller »; la destination exprimée ensuite rend inutile l’ajout de « s’en » ou « partir ».
- source_word: ἵνα μὴ
  choice: de ne pas
  rationale: Après « supplier », cette construction infinitive est idiomatique en français et exprime fidèlement le contenu négatif de la demande.
- source_word: αὐτοῖς
  choice: leur
  rationale: Le pronom datif désigne ceux auxquels l’ordre serait adressé. En français, « leur ordonner d’aller » rend directement cette relation.
theological_decisions:
- issue: Sens de ἄβυσσος dans un contexte démoniaque
  choice: « l’abîme », avec sa dimension de lieu surnaturel associé à la détention ou au jugement des esprits mauvais
  alternative: « les profondeurs », dans un sens spatial plus général
  rationale: Le contexte présente des démons qui redoutent un ordre souverain de Jésus. « L’abîme » préserve cette dimension cosmique tout en évitant de préciser davantage que Luc la nature exacte de ce lieu.
translation_notes:
  register: Français international moderne, naturel et digne. « Suppliaient » garde la force de l’imparfait grec; « l’abîme » conserve l’ambiguïté relative du terme tout en restant clair dans le contexte.
