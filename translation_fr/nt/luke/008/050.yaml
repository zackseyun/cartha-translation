  text: ὁ δὲ Ἰησοῦς ἀκούσας ἀπεκρίθη ⸀αὐτῷ· Μὴ φοβοῦ, μόνον ⸀πίστευσον, καὶ σωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/050.yaml
  text: But Jesus[a], hearing this, answered him, “Do not fear; only believe[b], and she will be saved.”
translation:
  language: fr
  text: 'Mais Jésus, ayant entendu cela, lui répondit : « N’aie pas peur ; crois seulement[a], et elle sera sauvée[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « aie seulement foi » ou « fais seulement confiance ».
    reason: lexical_alternative
  - marker: b
    text: Ou « elle sera guérie » ou « elle sera rétablie ». Le verbe grec peut signifier « sauver », « délivrer » ou « guérir » ; dans ce contexte, il peut aussi désigner le rétablissement de la jeune fille.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας
  choice: ayant entendu cela
  rationale: Le participe aoriste exprime une action antérieure à la réponse de Jésus. « Cela » explicite naturellement en français ce qu’il vient d’entendre dans le contexte.
- source_word: ἀπεκρίθη αὐτῷ
  choice: lui répondit
  rationale: Cette formulation rend directement et naturellement le verbe ἀποκρίνομαι accompagné du datif αὐτῷ.
- source_word: Μὴ φοβοῦ
  choice: N’aie pas peur
  rationale: Formulation française actuelle et naturelle de l’interdiction exprimée par μή avec l’impératif présent, sans atténuer la force de l’ordre.
- source_word: μόνον πίστευσον
  choice: crois seulement
  rationale: « Seulement » conserve la restriction portée par μόνον, tandis que « crois » rend directement l’impératif aoriste de πιστεύω. Une note préserve les nuances relationnelles de confiance et de foi.
- source_word: σωθήσεται
  choice: elle sera sauvée
  rationale: Le futur passif de σῴζω peut évoquer le salut, la délivrance ou la guérison. « Sera sauvée » conserve l’étendue du terme grec et sa résonance plus large, tandis que la note indique les sens physiques particulièrement pertinents ici.
theological_decisions:
- issue: Traduction de πιστεύω dans l’ordre de Jésus
  choice: crois
  alternative: aie foi ; mets seulement ta confiance en moi
  rationale: « Crois » est l’équivalent verbal le plus direct, mais il pourrait être compris comme une simple adhésion intellectuelle. La note préserve donc les nuances de foi et de confiance sans imposer dans le texte une interprétation plus étroite.
- issue: Traduction de σωθήσεται dans un contexte de guérison et de retour à la vie
  choice: elle sera sauvée
  alternative: elle sera guérie ; elle sera rétablie
  rationale: Le choix principal maintient le lien lexical avec σῴζω et sa portée potentiellement plus large. Les autres traductions rendent explicitement le rétablissement physique suggéré par le récit, sans réduire silencieusement l’ambiguïté du grec.
translation_notes:
  register: Français international moderne, naturel et digne. « N’aie pas peur » est plus courant aujourd’hui que « Ne crains pas ». La syntaxe reste concise et conserve la progression ainsi que la tension lexicale du grec.
