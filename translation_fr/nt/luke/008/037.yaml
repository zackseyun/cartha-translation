revisions:
- from: Alors toute la foule de la région des Géraséniens lui demanda de s’éloigner d’eux, car ils étaient saisis d’une grande peur. Il monta donc dans un bateau et repartit.
  to: Alors toute la foule de la région environnante des Géraséniens lui demanda de s’éloigner d’eux, car ils étaient saisis d’une grande peur[a]. Il monta dans un bateau et retourna.
  rationale: La révision rétablit la valeur de « région environnante » pour τῆς περιχώρου et traduit ὑπέστρεψεν par « retourna ». Elle conserve l’ambiguïté du texte quant à la nature de la peur et ajoute une note lexicale correspondant à l’audit anglais.
