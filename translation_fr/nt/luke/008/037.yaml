reference: Luke 8:37
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ⸀ἠρώτησεν αὐτὸν ἅπαν τὸ πλῆθος τῆς περιχώρου τῶν ⸀Γερασηνῶν ἀπελθεῖν ἀπ’ αὐτῶν, ὅτι φόβῳ μεγάλῳ συνείχοντο· αὐτὸς δὲ ἐμβὰς ⸀εἰς πλοῖον ὑπέστρεψεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/037.yaml
  text: And the whole crowd from the surrounding region of the Gerasenes asked him to depart from them[a], because they were gripped by great fear. So he got into a boat and returned.
translation:
  language: fr
  text: Alors toute la foule de la région environnante des Géraséniens lui demanda de s’éloigner d’eux, car ils étaient saisis d’une grande peur[a]. Il monta dans un bateau et retourna.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ils étaient pris d’une grande peur ».'
    reason: Alternative lexicale pour συνέχoμαι, qui peut exprimer le fait d’être saisi ou pris par la peur.
lexical_decisions:
- source_word: ἠρώτησεν
  choice: demanda
  rationale: Dans cette construction avec un infinitif, ἐρωτάω signifie demander à quelqu’un de faire quelque chose. « Demanda » reste naturel sans renforcer indûment l’intensité par « supplia ».
- source_word: ἅπαν τὸ πλῆθος
  choice: toute la foule
  rationale: Cette formulation française restitue la valeur collective et totalisante de ἅπαν.
- source_word: τῆς περιχώρου
  choice: de la région
  rationale: περίχωρος désigne le territoire ou la région environnante. Dans ce contexte, « de la région » est idiomatique et évite une lourdeur inutile.
- source_word: τῶν Γερασηνῶν
  choice: des Géraséniens
  rationale: L’adjectif substantivé désigne les habitants ou la population associée à Gérasa; « Géraséniens » est la forme française traditionnelle correspondant au texte grec fourni.
- source_word: ἀπελθεῖν ἀπ’ αὐτῶν
  choice: de s’éloigner d’eux
  rationale: L’infinitif indique ce que la foule demande à Jésus. « S’éloigner d’eux » conserve la force directionnelle de ἀπό dans une expression française naturelle.
- source_word: φόβῳ μεγάλῳ συνείχοντο
  choice: ils étaient saisis d’une grande peur
  rationale: συνέχω au passif exprime ici l’idée d’être fortement tenu ou saisi par un état. Cette tournure conserve l’image et rend directement φόβῳ μεγάλῳ.
- source_word: ἐμβὰς εἰς πλοῖον
  choice: Il monta dans un bateau
  rationale: Le participe aoriste décrit l’embarquement préalable au retour. « Monter dans un bateau » est naturel en français, et l’article indéfini respecte l’absence d’article grec.
- source_word: ὑπέστρεψεν
  choice: repartit
  rationale: ὑποστρέφω signifie retourner ou repartir. « Repartit » convient au contexte immédiat du départ en bateau sans préciser une destination que le verset ne nomme pas.
theological_decisions:
- issue: Nature de la peur éprouvée par la population gérasénienne
  choice: La peur est rapportée comme la raison de la demande, sans en préciser la nature.
  alternative: Interpréter cette peur comme une crainte révérencielle devant la puissance divine, ou comme une réaction hostile liée à une perte économique ou à un bouleversement social.
  rationale: Le grec affirme seulement qu’ils étaient saisis d’une grande peur. Il ne permet pas de déterminer explicitement si celle-ci relève de l’effroi, de la révérence, de l’hostilité ou d’un mélange de réactions.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe narrative demeure fluide; aucune explication psychologique ou doctrinale étrangère au verset n’est ajoutée.
