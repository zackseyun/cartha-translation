source:
  edition: SBLGNT
  text: ⸂Ἐγένετο δὲ⸃ ἐν μιᾷ τῶν ἡμερῶν καὶ αὐτὸς ἐνέβη εἰς πλοῖον καὶ οἱ μαθηταὶ αὐτοῦ, καὶ εἶπεν πρὸς αὐτούς· Διέλθωμεν εἰς τὸ πέραν τῆς λίμνης, καὶ ἀνήχθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/022.yaml
  text: It happened on one of those days that he got into a boat[a], and his disciples with him, and he said to them[b], “Let us go across to the other side of the lake.” And they set out.
translation:
  language: fr
  text: 'Un de ces jours-là, il monta dans une barque avec ses disciples et leur dit : « Passons sur l’autre rive du lac.[a] » Alors ils prirent le large.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Allons de l’autre côté du lac. »'
    reason: lexical_alternative
  - marker: b
    text: Le verbe grec est un terme nautique qui peut aussi se traduire par « ils quittèrent le rivage » ou « ils appareillèrent ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ⸂Ἐγένετο δὲ⸃ ἐν μιᾷ τῶν ἡμερῶν
  choice: Un de ces jours-là
  rationale: Cette formulation française naturelle conserve la valeur temporelle indéfinie et partitive de l’expression grecque. La tournure narrative Ἐγένετο δὲ est intégrée sans recourir à l’archaïsme « il arriva que ».
- source_word: αὐτὸς ἐνέβη εἰς πλοῖον καὶ οἱ μαθηταὶ αὐτοῦ
  choice: il monta dans une barque avec ses disciples
  rationale: « Monter dans une barque » rend naturellement l’action d’ἐμβαίνω, tandis que « avec ses disciples » exprime clairement que ceux-ci embarquent avec lui.
- source_word: εἶπεν πρὸς αὐτούς
  choice: leur dit
  rationale: Rendu français direct et fidèle de λέγω avec πρός, sans alourdir la phrase par « dit à eux ».
- source_word: Διέλθωμεν
  choice: Passons
  rationale: Le subjonctif grec à la première personne du pluriel a une valeur d’exhortation ou de proposition commune, bien rendue par « Passons ».
- source_word: εἰς τὸ πέραν τῆς λίμνης
  choice: sur l’autre rive du lac
  rationale: « L’autre rive » est l’expression française idiomatique correspondant à τὸ πέραν dans ce contexte; λίμνη désigne précisément un lac.
- source_word: ἀνήχθησαν
  choice: ils prirent le large
  rationale: Le verbe a ici son sens nautique de quitter le rivage et de se mettre en route sur l’eau. « Prendre le large » reste naturel en français et convient aussi à un lac.
