  terminology: « Pleuraient », « se lamentaient », « n’est pas morte » et « dort » conviennent au registre narratif biblique moderne. La note proposée allait au-delà de la valeur lexicale en affirmant un « prochain retour à la vie » ; elle est resserrée afin de signaler l’image du sommeil sans interpréter ou résoudre la tension narrative.
