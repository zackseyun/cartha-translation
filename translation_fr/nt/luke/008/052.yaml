source:
  edition: SBLGNT
  text: ἔκλαιον δὲ πάντες καὶ ἐκόπτοντο αὐτήν. ὁ δὲ εἶπεν· Μὴ κλαίετε, ⸂οὐ γὰρ⸃ ἀπέθανεν ἀλλὰ καθεύδει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/052.yaml
  text: And they were all weeping and mourning for her. But he said[a], “Do not weep, for she has not died, but is sleeping.”
translation:
  language: fr
  text: 'Tous pleuraient et se lamentaient pour elle. Mais il dit : « Ne pleurez pas, car elle n’est pas morte, mais elle dort[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « elle est endormie ». Jésus emploie ici l’image du sommeil.'
    reason: Alternative lexicale de καθεύδει et clarification limitée de l’image, sans expliquer la condition de la jeune fille ni anticiper son rétablissement.
lexical_decisions:
- source_word: ἔκλαιον
  choice: pleuraient
  rationale: L’imparfait français rend naturellement l’action continue exprimée par l’imparfait grec.
- source_word: πάντες
  choice: Tous
  rationale: Conserve explicitement la portée universelle du grec dans une formulation française naturelle.
- source_word: ἐκόπτοντο αὐτήν
  choice: se lamentaient sur elle
  rationale: Dans un contexte de deuil, le verbe désigne les lamentations, qui pouvaient comporter des gestes rituels. Cette formulation en communique le sens sans imposer un geste précis.
- source_word: Μὴ κλαίετε
  choice: Ne pleurez pas
  rationale: Rend simplement l’interdiction au présent; le contexte permet de comprendre qu’elle vise des pleurs déjà en cours sans qu’il soit nécessaire de préciser « cessez ».
- source_word: οὐ γὰρ
  choice: car… ne… pas
  rationale: « Car » conserve la valeur explicative de γάρ et introduit la raison donnée par Jésus.
- source_word: ἀπέθανεν
  choice: n’est pas morte
  rationale: Cette tournure française idiomatique met en relief l’état présent nié, en contraste direct avec « elle dort », tout en rendant le verbe grec de manière naturelle.
- source_word: καθεύδει
  choice: elle dort
  rationale: Le présent verbal conserve l’image du sommeil plutôt que de la réduire à une simple qualification.
theological_decisions:
- issue: La déclaration de Jésus selon laquelle la jeune fille n’est pas morte, mais dort
  choice: 'Conserver littéralement le contraste « elle n’est pas morte : elle dort » et l’image du sommeil.'
  alternative: Expliciter qu’elle n’est pas définitivement morte, ou comprendre qu’elle est seulement endormie au sens ordinaire.
  rationale: Le récit maintient une tension entre la mort constatée et la manière dont Jésus présente son état à la lumière de son rétablissement imminent. La traduction ne doit pas trancher cette tension dans le texte principal.
translation_notes:
  register: Français international moderne, clair et digne. « Se lamentaient sur elle » garde la tonalité funèbre sans surtraduire les gestes possibles du deuil; les deux imparfaits restituent la scène en cours. Le deux-points fait ressortir le contraste introduit par ἀλλά.
