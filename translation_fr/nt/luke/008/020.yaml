id: LUK.8.20
reference: Luke 8:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸂ἀπηγγέλη δὲ⸃ ⸀αὐτῷ· Ἡ μήτηρ σου καὶ οἱ ἀδελφοί σου ἑστήκασιν ἔξω ἰδεῖν ⸂σε θέλοντες⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/020.yaml
  text: And it was reported to him[a], “Your mother and your brothers are standing outside, wanting to see you.”
translation:
  language: fr
  text: 'On lui annonça alors : « Ta mère et tes frères[a] se tiennent dehors et veulent te voir. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « proches », si le terme grec est compris ici dans un sens plus large ; il signifie ordinairement « frères ».'
    reason: Alternative lexicale préservant l’ambiguïté possible sans remplacer le sens le plus courant.
lexical_decisions:
- source_word: ἀπηγγέλη δὲ αὐτῷ
  choice: On lui annonça alors
  rationale: La tournure impersonnelle française rend naturellement l’aoriste passif « il lui fut annoncé », tandis qu’« alors » marque sobrement la progression narrative exprimée par δέ.
- source_word: Ἡ μήτηρ σου
  choice: Ta mère
  rationale: Traduction directe, courante et digne du syntagme grec.
- source_word: οἱ ἀδελφοί σου
  choice: tes frères
  rationale: ἀδελφοί est un pluriel masculin qui signifie ordinairement « frères » ; la traduction conserve ce sens sans trancher les débats concernant la parenté de Jésus.
- source_word: ἑστήκασιν ἔξω
  choice: se tiennent dehors
  rationale: 'Le parfait ἑστήκασιν décrit l’état présent résultant : ils sont là, debout ; « se tiennent » le rend avec naturel sans ajouter de lieu non précisé.'
- source_word: ἰδεῖν σε θέλοντες
  choice: et veulent te voir
  rationale: Cette proposition coordonnée rend idiomatiquement le participe présent θέλοντες et l’infinitif ἰδεῖν, tout en conservant leur sens direct.
theological_decisions:
- issue: Nature du lien familial désigné par ἀδελφοί
  choice: frères
  alternative: proches / membres de la parenté
  rationale: Le sens ordinaire du terme grec est conservé dans le texte principal. Une note signale la possibilité d’un emploi plus large sans imposer une interprétation doctrinale de la parenté de Jésus.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement correspond à la deuxième personne du singulier. La formulation évite aussi bien l’archaïsme de « il lui fut annoncé » que les précisions interprétatives absentes du grec.
