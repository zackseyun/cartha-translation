review_pass:
  verdict: approve
  source_fidelity: Le texte rend avec fidélité ἀπηγγέλη δὲ αὐτῷ par une tournure française impersonnelle naturelle (« On lui annonça alors »), sans attribuer le message à un locuteur non nommé. « Ta mère et tes frères » correspond directement à Ἡ μήτηρ σου καὶ οἱ ἀδελφοί σου. « Se tiennent dehors » conserve à la fois la position debout et la localisation exprimées par ἑστήκασιν ἔξω. « Veulent te voir » rend correctement θέλοντες ἰδεῖν σε sans ajouter l’idée de parler avec lui ou de le rencontrer.
  naturalness: La formulation est naturelle en français international moderne et garde un registre narratif sobre. « On lui annonça alors » est idiomatique; « se tiennent dehors » est un peu plus soutenu que « sont dehors », mais il est précis et demeure fluide dans ce contexte.
  terminology: « Frères » est le rendu lexical ordinaire et non interprétatif de ἀδελφοί. La note indique de façon équilibrée la possibilité contextuelle d’un sens plus large, sans substituer cette possibilité au sens principal ni imposer une conclusion doctrinale.
