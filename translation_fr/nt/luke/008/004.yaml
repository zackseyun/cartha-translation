id: LUK.8.4
reference: Luke 8:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Συνιόντος δὲ ὄχλου πολλοῦ καὶ τῶν κατὰ πόλιν ἐπιπορευομένων πρὸς αὐτὸν εἶπεν διὰ παραβολῆς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/004.yaml
  text: 'And when a large crowd was gathering[a], and people from town after town were coming to him, he spoke by a parable:'
translation:
  language: fr
  text: 'Alors qu’une grande foule se rassemblait et que des gens de chaque ville venaient à lui, il parla au moyen d’une parabole[a] :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « il parla en parabole ». L’expression grecque peut indiquer le moyen ou la manière.
    reason: alternative_lexicale
lexical_decisions:
- source_word: Συνιόντος
  choice: se rassemblait
  rationale: Le génitif absolu décrit une action en cours à l’arrière-plan. L’imparfait français en restitue naturellement l’aspect progressif.
- source_word: δὲ
  choice: Alors que
  rationale: La particule assure ici la continuité du récit sans marquer de contraste fort. La construction circonstancielle française intègre naturellement les deux génitifs absolus.
- source_word: ὄχλου πολλοῦ
  choice: une grande foule
  rationale: Cette expression rend directement la taille importante de la foule dans un français courant et digne.
- source_word: τῶν κατὰ πόλιν ἐπιπορευομένων
  choice: des gens de chaque ville venaient
  rationale: κατὰ πόλιν a une valeur distributive. « De chaque ville » exprime clairement que des personnes venaient de différentes localités, sans suggérer qu’elles passaient successivement d’une ville à l’autre.
- source_word: πρὸς αὐτόν
  choice: à lui
  rationale: Avec le verbe de mouvement, cette formulation rend simplement le déplacement en direction de Jésus.
- source_word: εἶπεν
  choice: il parla
  rationale: « Parla » s’accorde naturellement avec l’indication de moyen ou de manière qui suit, tout en restant fidèle au verbe grec.
- source_word: διὰ παραβολῆς
  choice: au moyen d’une parabole
  rationale: διά avec le génitif peut indiquer le moyen ou la manière. Cette traduction explicite le moyen tout en conservant en note l’autre lecture naturelle.
theological_decisions: []
translation_notes:
  register: Français international moderne, fluide et digne. La phrase conserve les actions simultanées à l’arrière-plan et place correctement l’appel de note après l’expression ambiguë διὰ παραβολῆς.
