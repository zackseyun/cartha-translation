source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ἦλθεν ἀνὴρ ᾧ ὄνομα Ἰάϊρος, καὶ ⸀οὗτος ἄρχων τῆς συναγωγῆς ὑπῆρχεν, καὶ πεσὼν παρὰ τοὺς πόδας ⸀τοῦ Ἰησοῦ παρεκάλει αὐτὸν εἰσελθεῖν εἰς τὸν οἶκον αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/041.yaml
  text: And behold, a man named Jairus came, and he was a ruler of the synagogue; and falling at Jesus's feet, he begged him to come into his house,
translation:
  language: fr
  text: Et voici qu’un homme nommé Jaïrus arriva. C’était un chef de la synagogue. Il se jeta aux pieds de Jésus et le suppliait d’entrer dans sa maison,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ ἰδοὺ
  choice: Et voici que
  rationale: Conserve le marqueur narratif qui attire l’attention, dans une tournure française naturelle et digne.
- source_word: ἄρχων τῆς συναγωγῆς
  choice: chef de la synagogue
  rationale: Désigne naturellement un responsable dirigeant de la synagogue sans préciser davantage une fonction que le grec laisse générale.
- source_word: παρεκάλει
  choice: le suppliait
  rationale: L’imparfait rend la valeur imperfective du verbe grec et « suppliait » exprime l’intensité de la demande dans ce contexte.
- source_word: εἰσελθεῖν εἰς τὸν οἶκον αὐτοῦ
  choice: d’entrer dans sa maison
  rationale: Rend directement le mouvement exprimé par εἰσελθεῖν εἰς et le sens domestique de οἶκος.
theological_decisions: []
