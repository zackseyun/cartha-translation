id: LUK.8.43
reference: Luke 8:43
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ γυνὴ οὖσα ἐν ῥύσει αἵματος ἀπὸ ἐτῶν δώδεκα, ἥτις ⸂ἰατροῖς προσαναλώσασα ὅλον τὸν βίον⸃ οὐκ ἴσχυσεν ⸀ἀπ’ οὐδενὸς θεραπευθῆναι,
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/043.yaml
  text: And a woman who had been in a flow of blood for twelve years[a], and who had spent her whole livelihood on physicians, was not able to be healed by anyone[c][b],
translation:
  language: fr
  text: Or une femme, qui souffrait de pertes de sang depuis douze ans[a] et avait dépensé chez les médecins toutes ses ressources[b][c], n’avait pu être guérie par personne.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « avait des écoulements de sang depuis douze ans » ou, plus littéralement, « était sujette à un flux de sang depuis douze ans ».'
    reason: lexical_alternative
  - marker: b
    text: Le mot grec traduit par « ressources » désigne ici ses moyens de subsistance ou tout ce qu’elle possédait, et non sa vie biologique.
    reason: lexical_alternative
  - marker: c
    text: Certains manuscrits omettent les mots « et avait dépensé chez les médecins toutes ses ressources ».
    reason: textual_variant
lexical_decisions:
- source_word: γυνὴ οὖσα ἐν ῥύσει αἵματος
  choice: une femme, qui souffrait de pertes de sang
  rationale: La tournure française exprime naturellement l’état durable décrit par le participe et rend concrètement ῥύσις αἵματος sans employer une formulation inutilement clinique.
- source_word: ἀπὸ ἐτῶν δώδεκα
  choice: depuis douze ans
  rationale: Dans ce contexte, ἀπό indique le point de départ d’un état qui se prolonge ; « depuis douze ans » est l’équivalent français idiomatique.
- source_word: ἰατροῖς προσαναλώσασα
  choice: avait dépensé chez les médecins
  rationale: Le plus-que-parfait marque l’antériorité du participe aoriste par rapport à l’incapacité constatée ; « chez les médecins » exprime naturellement les destinataires de ces dépenses.
- source_word: ὅλον τὸν βίον
  choice: toutes ses ressources
  rationale: Ici, βίος désigne les moyens de subsistance ou les biens, et non la vie biologique. Cette formulation évite l’ambiguïté de « toute sa vie ».
- source_word: οὐκ ἴσχυσεν ἀπ’ οὐδενὸς θεραπευθῆναι
  choice: n’avait pu être guérie par personne
  rationale: La traduction conserve l’incapacité exprimée par ἰσχύω, le passif de θεραπεύω et l’agent indéfini ἀπ’ οὐδενός.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. « Pertes de sang » est courant et compréhensible sans être cru ; « médecins » maintient un registre narratif soutenu. Le passif « être guérie » préserve la formulation grecque et évite de préciser la cause de l’échec des soins.
