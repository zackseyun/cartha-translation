id: LUK.8.36
reference: Luke 8:36
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀπήγγειλαν δὲ ⸀αὐτοῖς οἱ ἰδόντες πῶς ἐσώθη ὁ δαιμονισθείς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/036.yaml
  text: And those who had seen it reported to them how the demon-possessed man had been saved[a].
translation:
  language: fr
  text: Ceux qui avaient vu ce qui s’était passé leur racontèrent comment l’homme qui avait été sous l’emprise des démons avait été sauvé[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « avait été guéri » ou « avait été délivré ». Le verbe grec peut signifier sauver, guérir ou délivrer selon le contexte.'
    reason: 'Alternative lexicale : ἐσώθη possède ici une amplitude sémantique que le seul mot « sauvé » ne restitue pas entièrement.'
lexical_decisions:
- source_word: ἀπήγγειλαν
  choice: racontèrent
  rationale: L’aoriste de ἀπαγγέλλω indique qu’ils firent le récit de ce dont ils avaient été témoins. « Racontèrent » est naturel en français narratif et exprime ici l’idée de rapporter les faits.
- source_word: δὲ
  choice: absence de connecteur explicite
  rationale: δέ est un connecteur narratif léger. En français moderne, l’enchaînement est naturel sans « et » ni « alors » ; son omission n’introduit aucun contraste absent du grec.
- source_word: αὐτοῖς
  choice: leur
  rationale: Le pronom datif désigne les destinataires du récit ; le pronom français « leur » en donne un équivalent direct et idiomatique.
- source_word: οἱ ἰδόντες
  choice: Ceux qui avaient vu ce qui s’était passé
  rationale: Le participe substantivé désigne les témoins de l’événement. Le plus-que-parfait marque son antériorité, et « ce qui s’était passé » explicite naturellement en français le complément implicite de « voir » sans préciser davantage l’événement.
- source_word: πῶς
  choice: comment
  rationale: « Comment » conserve la portée de πῶς, qui peut introduire le déroulement ou le fait rapporté sans réduire l’énoncé à une simple proposition en « que ».
- source_word: ἐσώθη
  choice: avait été sauvé
  rationale: Le passif de σῴζω peut exprimer le salut, la délivrance ou la guérison. « Avait été sauvé » préserve sa largeur lexicale et son écho théologique ; une note signale les rendus contextuels possibles.
- source_word: ὁ δαιμονισθείς
  choice: l’homme qui avait été sous l’emprise des démons
  rationale: Le participe substantivé désigne l’homme précédemment soumis à une influence démoniaque. Cette formulation actuelle et digne rend l’état antérieur suggéré par la forme participiale sans réduire la personne à cet état.
theological_decisions:
- issue: Sens de ἐσώθη dans un récit d’exorcisme et de restauration
  choice: avait été sauvé
  alternative: avait été guéri ; avait été délivré
  rationale: 'σῴζω couvre plusieurs notions qui se recoupent : sauver, délivrer et guérir. Le texte principal conserve « sauvé » afin de ne pas limiter le sens à la guérison physique ni d’effacer sa portée plus large, tandis que la note maintient les autres lectures plausibles dans ce contexte.'
translation_notes:
  register: Français international moderne, clair et digne. La phrase suit naturellement le récit, évite le terme substantivé et stigmatisant « démoniaque », et conserve par une note l’ambiguïté réelle de σῴζω.
