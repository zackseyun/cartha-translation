source:
  edition: SBLGNT
  text: ⸂Ἐν δὲ⸃ τῷ ⸀ὑποστρέφειν τὸν Ἰησοῦν ἀπεδέξατο αὐτὸν ὁ ὄχλος, ἦσαν γὰρ πάντες προσδοκῶντες αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/040.yaml
  text: When Jesus returned[a], the crowd welcomed him[b], for they were all waiting for him.
translation:
  language: fr
  text: Quand Jésus revint, la foule l’accueillit[a], car tous l’attendaient[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la foule le reçut » ; le verbe grec peut désigner le fait de recevoir ou d’accueillir quelqu’un, avec ici une nuance favorable.
    reason: lexical_alternative
  - marker: b
    text: Ou « car tous s’attendaient à sa venue ».
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν δὲ τῷ ὑποστρέφειν τὸν Ἰησοῦν
  choice: Quand Jésus revint
  rationale: La construction ἐν + infinitif articulé exprime ici le temps. « Quand » est naturel en français, et le passé simple situe clairement le retour de Jésus dans la progression du récit. Le léger mouvement narratif de δέ n’exige pas nécessairement un connecteur distinct en français.
- source_word: ἀπεδέξατο
  choice: l’accueillit
  rationale: Le verbe désigne ici une réception favorable. « Accueillit » rend ce sens positif sans ajouter l’idée, non exprimée, d’un accueil enthousiaste.
- source_word: ὁ ὄχλος
  choice: la foule
  rationale: « La foule » est l’équivalent français courant du nom collectif ὄχλος dans ce contexte.
- source_word: ἦσαν γὰρ πάντες προσδοκῶντες αὐτόν
  choice: car tous l’attendaient
  rationale: γάρ introduit la raison de l’accueil. L’imparfait « attendaient » restitue la valeur durative du participe, tandis que « tous » conserve l’insistance de πάντες.
- source_word: Ἰησοῦν
  choice: Jésus
  rationale: Le nom propre est rendu selon sa forme française traditionnelle et universellement reconnue.
theological_decisions: []
translation_notes:
  register: Français international moderne, simple et digne. La phrase conserve la concision du grec, le lien causal introduit par γάρ et l’accent mis sur l’attente de toute la foule.
