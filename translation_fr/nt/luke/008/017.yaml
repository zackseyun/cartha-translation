id: LUK.8.17
reference: Luke 8:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὐ γάρ ἐστιν κρυπτὸν ὃ οὐ φανερὸν γενήσεται, οὐδὲ ἀπόκρυφον ὃ οὐ ⸂μὴ γνωσθῇ⸃ καὶ εἰς φανερὸν ἔλθῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/017.yaml
  text: For nothing is hidden that will not become evident[c][b][a], nor is anything secret that will not be known and come to light.
translation:
  language: fr
  text: Car il n’y a rien de caché qui ne devienne manifeste, ni rien de secret qui ne soit connu et ne vienne au grand jour.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κρυπτόν
  choice: caché
  rationale: « Caché » rend naturellement ce qui est dissimulé et maintient le contraste avec φανερόν.
- source_word: φανερόν
  choice: manifeste
  rationale: Dans la première proposition, « manifeste » exprime clairement le passage d’un état caché à un état ouvertement perceptible, tout en conservant le parallélisme lexical avec la fin du verset.
- source_word: γενήσεται
  choice: devienne
  rationale: Le verbe marque ici un changement d’état; « devienne » préserve cette nuance.
- source_word: ἀπόκρυφον
  choice: secret
  rationale: « Secret » distingue légèrement ce terme de κρυπτόν tout en respectant le parallélisme étroit des deux propositions.
- source_word: οὐ μὴ γνωσθῇ
  choice: ne soit connu
  rationale: Dans la construction relative négative, cette formulation française transmet le sens qu’aucune chose secrète ne restera inconnue, sans alourdir la phrase.
- source_word: εἰς φανερὸν ἔλθῃ
  choice: ne vienne au grand jour
  rationale: « Venir au grand jour » est une expression française courante et digne pour une chose auparavant secrète qui devient publique ou visible.
- source_word: γάρ
  choice: Car
  rationale: « Car » conserve le lien explicatif avec la parole précédente.
theological_decisions:
- issue: Portée de la déclaration sur la révélation de ce qui est caché
  choice: Formulation générale selon laquelle ce qui est caché ou secret finira par être révélé.
  alternative: Y voir exclusivement la révélation eschatologique au jugement final, ou seulement la manifestation de l’enseignement de Jésus et des réactions qu’il suscite dans le contexte immédiat.
  rationale: Le verset ne précise ni le moment ni le cadre exact de cette révélation. La traduction garde donc sa portée générale et son ambiguïté contextuelle.
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme grec est conservé sans rigidité; « manifeste » et « au grand jour » rendent les deux emplois apparentés de φανερός sans produire une répétition peu naturelle.
