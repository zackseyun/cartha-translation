  text: ὁ δὲ εἶπεν αὐτῇ· ⸀Θυγάτηρ, ἡ πίστις σου σέσωκέν σε· πορεύου εἰς εἰρήνην.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/048.yaml
  text: But he said to her[a], “Daughter, your faith has saved you; go in peace.”
translation:
  language: fr
  text: 'Mais il lui dit : « Ma fille, ta foi t’a sauvée[a] ; va en paix. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « t’a guérie » ou « t’a rétablie ». Le verbe grec peut désigner aussi bien la guérison que le salut.'
    reason: alternative_reading
lexical_decisions:
- source_word: Θυγάτηρ
  choice: Ma fille
  rationale: Le vocatif littéral « fille » exprime une adresse tendre et relationnelle. En français, « ma fille » est la formulation naturelle dans cette adresse directe, sans ajouter de précision doctrinale.
- source_word: πίστις
  choice: foi
  rationale: « Foi » conserve le terme théologiquement significatif tout en désignant ici la confiance de la femme en Jésus.
- source_word: σέσωκέν
  choice: t’a sauvée
  rationale: Le parfait de σῴζω peut désigner le salut, la délivrance ou la guérison. « T’a sauvée » maintient cette ampleur sémantique et la résonance théologique, tandis que le contexte de guérison est explicité en note.
- source_word: πορεύου
  choice: va
  rationale: Impératif français simple, naturel et fidèle au mouvement exprimé par le verbe grec.
- source_word: εἰς εἰρήνην
  choice: en paix
  rationale: « En paix » est l’équivalent idiomatique français de cette formule de départ et de bénédiction.
- source_word: δὲ
  choice: Mais
  rationale: δέ marque ici une transition légèrement contrastive entre la confession craintive de la femme et la réponse rassurante de Jésus.
theological_decisions:
- issue: Portée de σῴζω dans un récit de guérison
  choice: « t’a sauvée » dans le texte principal
  alternative: « t’a guérie » ou « t’a rendue bien portante »
  rationale: Le contexte inclut clairement la guérison physique, mais σῴζω possède une portée plus large. La traduction principale préserve cette tension entre guérison et salut, et la note signale le sens médical possible.
translation_notes:
  register: Français international moderne, naturel et digne. La ponctuation et l’adresse « Ma fille » rendent le dialogue fluide, tandis que la note préserve l’ambiguïté sémantique du grec.
