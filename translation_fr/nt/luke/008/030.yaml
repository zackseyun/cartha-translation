id: LUK.8.30
reference: Luke 8:30
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐπηρώτησεν δὲ αὐτὸν ὁ ⸀Ἰησοῦς· Τί σοι ⸂ὄνομά ἐστιν⸃; ὁ δὲ εἶπεν· Λεγιών, ὅτι ⸂εἰσῆλθεν δαιμόνια πολλὰ⸃ εἰς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/030.yaml
  text: Then Jesus asked him[a], “What is your name?” And he said[b], “Legion,” because many demons had entered into him.
translation:
  language: fr
  text: 'Jésus lui demanda alors : « Quel est ton nom ? » Il répondit : « Légion[a] », car beaucoup de démons étaient entrés en lui.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Légion » est un mot d’origine latine désignant une grande unité de l’armée romaine ; ici, ce nom indique qu’un grand nombre de démons étaient entrés dans cet homme.
    reason: cultural_note
lexical_decisions:
- source_word: ἐπηρώτησεν
  choice: demanda
  rationale: Dans ce récit, le verbe introduit une question directe. « Demanda » est la formulation française naturelle et précise.
- source_word: δὲ
  choice: alors
  rationale: La particule marque ici une légère progression narrative. « Alors » rend ce lien sans lui donner trop de poids.
- source_word: Τί σοι ὄνομά ἐστιν
  choice: Quel est ton nom ?
  rationale: Cette tournure idiomatique grecque correspond naturellement à la question française « Quel est ton nom ? »
- source_word: Λεγιών
  choice: Légion
  rationale: Le terme est conservé comme désignation donnée par l'interlocuteur, avec sa résonance militaire romaine expliquée en note.
- source_word: ὅτι
  choice: car
  rationale: La conjonction introduit la raison pour laquelle le nom « Légion » est employé. « Car » s'intègre naturellement à l'explication narrative.
- source_word: εἰσῆλθεν
  choice: étaient entrés
  rationale: Bien que le grec emploie l'aoriste, le plus-que-parfait français exprime clairement que l'entrée des démons précède l'explication donnée par le narrateur. Le pluriel suit le sujet neutre pluriel δαιμόνια πολλά, malgré le verbe grec au singulier.
- source_word: δαιμόνια πολλὰ
  choice: beaucoup de démons
  rationale: « Démons » rend directement δαιμόνια, tandis que « beaucoup de » restitue clairement leur grand nombre.
- source_word: εἰς αὐτόν
  choice: en lui
  rationale: Dans ce contexte, « entrer en lui » exprime en français naturel le mouvement vers l'intérieur indiqué par εἰς, sans réduire la formule à un simple état statique.
theological_decisions:
- issue: Désignation des δαιμόνια dans un contexte de possession
  choice: démons
  alternative: esprits mauvais
  rationale: « Démons » est l'équivalent le plus direct et conserve sans l'atténuer l'affirmation du texte concernant des êtres spirituels malveillants.
- issue: Relation temporelle entre εἰσῆλθεν et l'explication du nom
  choice: étaient entrés
  alternative: entrèrent / sont entrés
  rationale: Le plus-que-parfait précise naturellement en français que leur entrée était antérieure à la réponse « Légion », sans ajouter de conclusion doctrinale.
translation_notes:
  register: Français international moderne, sobre et narratif. Le tutoiement convient à l'adresse directe au singulier dans ce contexte. La note est placée immédiatement après « Légion », le terme qu'elle explique.
