revisions:
- from: 'L’homme dont les démons étaient sortis le suppliait de le laisser rester avec lui, mais Jésus le renvoya en disant :'
  to: 'L’homme dont les démons étaient sortis suppliait Jésus de le laisser être avec lui, mais Jésus le renvoya en disant :'
  rationale: 'La révision remplace « rester » par « être » afin de reproduire la portée non précisée de εἶναι σὺν αὐτῷ. La tournure « le laisser être avec lui » conserve une syntaxe française claire : l’homme est celui qui souhaite être avec Jésus, sans trancher entre rester auprès de lui et l’accompagner. Aucun changement théologique ni ajout de note n’est nécessaire.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T10:53:01Z'
review_pass:
  verdict: revise
  source_fidelity: 'Le sens central est bien rendu : l’homme précédemment délivré implore Jésus et celui-ci le renvoie. Toutefois, « rester » restreint εἶναι σὺν αὐτῷ (« être avec lui ») à l’idée de demeurer sur place, alors que le contexte peut également évoquer le fait de l’accompagner. « Étaient sortis » est bien un plus-que-parfait français et rend correctement ἐξεληλύθει.'
  naturalness: La phrase est fluide et de registre narratif approprié. La construction « le suppliait de le laisser rester » est naturelle, mais elle introduit à la fois l’idée explicite de permission et celle de « rester ». Une formulation plus neutre conserve mieux l’ouverture du grec tout en restant idiomatique.
  terminology: « L’homme », « les démons », « suppliait », « renvoya » et « en disant » conviennent au français international moderne et au registre du passage. L’explicitation de Jésus est justifiée pour éviter l’ambiguïté des pronoms.
  issues:
  - severity: medium
    issue: « de le laisser rester avec lui » rend εἶναι σὺν αὐτῷ de manière trop spécifique.
    rationale: Le grec exprime simplement le désir « d’être avec lui ». « Rester » peut indûment suggérer que l’homme souhaite demeurer dans un lieu précis, plutôt que d’être avec Jésus au sens plus large. La permission est naturellement impliquée par la requête, mais ne doit pas conduire à resserrer davantage le sens par « rester ».
  revised_text: 'L’homme dont les démons étaient sortis suppliait Jésus de le laisser être avec lui, mais Jésus le renvoya en disant :'
  revised_footnotes: []
  revision_rationale: 'La révision remplace « rester » par « être » afin de reproduire la portée non précisée de εἶναι σὺν αὐτῷ. La tournure « le laisser être avec lui » conserve une syntaxe française claire : l’homme est celui qui souhaite être avec Jésus, sans trancher entre rester auprès de lui et l’accompagner. Aucun changement théologique ni ajout de note n’est nécessaire.'
