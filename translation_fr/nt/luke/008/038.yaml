id: LUK.8.38
reference: Luke 8:38
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐδεῖτο δὲ αὐτοῦ ὁ ἀνὴρ ἀφ’ οὗ ἐξεληλύθει τὰ δαιμόνια εἶναι σὺν αὐτῷ· ἀπέλυσεν δὲ ⸀αὐτὸν λέγων·
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/038.yaml
  text: The man from whom the demons had gone out was begging him to be with him, but he sent him away, saying,
translation:
  language: fr
  text: 'L’homme dont les démons étaient sortis suppliait Jésus de le laisser être avec lui, mais Jésus le renvoya en disant :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐδεῖτο
  choice: le suppliait
  rationale: L’imparfait exprime une demande insistante ou répétée; « suppliait » en restitue naturellement l’intensité.
- source_word: ὁ ἀνὴρ
  choice: L’homme
  rationale: Le terme désigne l’homme précédemment délivré; cette formulation est précise et naturelle.
- source_word: ἀφ’ οὗ ἐξεληλύθει τὰ δαιμόνια
  choice: dont les démons étaient sortis
  rationale: Le plus-que-parfait grec situe la sortie des démons avant la supplication; le français conserve cet ordre temporel.
- source_word: τὰ δαιμόνια
  choice: les démons
  rationale: C’est l’équivalent direct et usuel de δαιμόνια dans ce récit d’exorcisme.
- source_word: εἶναι σὺν αὐτῷ
  choice: de le laisser rester avec lui
  rationale: Dans le contexte d’une requête adressée à Jésus, cette tournure française exprime naturellement le désir d’être avec lui sans réduire nécessairement celui-ci à un simple accompagnement ponctuel.
- source_word: ἀπέλυσεν δὲ αὐτὸν
  choice: mais Jésus le renvoya
  rationale: « Renvoya » rend ici le refus de la demande et l’ordre de repartir. Le nom « Jésus » clarifie le référent du pronom grec sans changer le sens.
- source_word: λέγων
  choice: en disant
  rationale: La tournure introduit naturellement en français les paroles directes du verset suivant.
theological_decisions:
- issue: Nature des δαιμόνια dans le récit
  choice: les démons
  alternative: les esprits mauvais
  rationale: « Démons » conserve la désignation explicite et la réalité personnelle des êtres présentés comme étant sortis de l’homme, sans atténuer l’affirmation du texte.
- issue: Objet de la demande de l’homme
  choice: de le laisser rester avec lui
  alternative: de pouvoir l’accompagner
  rationale: Le grec dit littéralement « être avec lui ». La formulation retenue préserve cette portée relationnelle et évite de préciser davantage que le texte s’il s’agit d’un accompagnement ou d’une appartenance durable au groupe.
translation_notes:
  register: Français international moderne, fluide et digne. L’imparfait « suppliait » rend l’insistance, tandis que le passé simple « renvoya » fait avancer le récit. Aucun marqueur temporel tel que « alors » ou « or » n’est ajouté; δέ est rendu par le contraste naturel de « mais » dans la seconde proposition.
