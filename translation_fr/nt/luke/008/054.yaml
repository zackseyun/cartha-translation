  text: αὐτὸς ⸀δὲ κρατήσας τῆς χειρὸς αὐτῆς ἐφώνησεν λέγων· Ἡ παῖς, ⸀ἔγειρε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/054.yaml
  text: But he took her by the hand and called out[a], saying, “Child, arise.”
translation:
  language: fr
  text: 'Mais il la prit par la main et l’appela : « Enfant[a], lève-toi. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Jeune fille ». Le grec παῖς peut signifier « enfant » ou, dans ce contexte, « jeune fille ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸς δὲ
  choice: Mais lui, il
  rationale: δέ marque ici un léger contraste avec la réaction précédente, tandis que αὐτός reçoit une discrète valeur emphatique. La dislocation « lui, il » est naturelle en français et conserve cette mise en relief.
- source_word: κρατήσας τῆς χειρὸς αὐτῆς
  choice: il la prit par la main
  rationale: Cette tournure française idiomatique exprime concrètement le geste de saisir ou tenir la main, sans la rudesse que pourrait suggérer « agrippa ».
- source_word: ἐφώνησεν
  choice: l’appela d’une voix forte
  rationale: φωνέω désigne ici un appel vocal nettement audible. Cette formulation restitue davantage l’intensité du verbe que le simple « appela », sans suggérer un cri de détresse.
- source_word: λέγων
  choice: deux-points introduisant les paroles
  rationale: En français moderne, après un verbe d’appel, les deux-points introduisent naturellement le discours direct et évitent le lourd « en disant » sans perte de sens.
- source_word: Ἡ παῖς
  choice: Mon enfant
  rationale: παῖς désigne ici la fille de Jaïros, mais peut lexicalement signifier « enfant » ou « jeune fille ». Dans une adresse directe, « Mon enfant » est naturel, tendre et digne, sans importer le diminutif des récits parallèles.
- source_word: ἔγειρε
  choice: lève-toi
  rationale: L’impératif présent de ἐγείρω commande directement de se lever. « Lève-toi » est clair, actuel et convient à la fois au sens immédiat et au contexte de retour à la vie.
theological_decisions:
- issue: Forme de l’adresse de Jésus à la fille
  choice: Mon enfant
  alternative: Jeune fille
  rationale: Le contexte identifie une fille, mais παῖς conserve une certaine amplitude lexicale. « Mon enfant » rend l’adresse personnelle et affectueuse sans harmoniser avec les formulations plus explicites des récits parallèles.
- issue: Traduction de l’ordre lié au retour à la vie
  choice: lève-toi
  alternative: relève-toi
  rationale: « Lève-toi » reste un impératif direct et ordinaire, comme le grec. « Relève-toi » pourrait ajouter une nuance de rétablissement qui n’est pas explicitement marquée par la forme verbale.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase garde le contraste narratif et la légère emphase de αὐτός, tout en privilégiant une syntaxe française fluide. Aucun marqueur de note n’est nécessaire.
