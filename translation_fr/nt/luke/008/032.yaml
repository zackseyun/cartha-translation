revisions:
- from: Il y avait là un grand troupeau de porcs[a] qui paissait sur la montagne[b]. Ils[c] le supplièrent de leur permettre d’entrer dans ces porcs, et il le leur permit.
  to: Il y avait là, sur la montagne[b], un grand troupeau de porcs[a] qui se nourrissaient. Les démons le supplièrent de leur permettre d’entrer dans ces porcs, et il le leur permit.
  rationale: La révision remplace le pronom français dont l’antécédent apparent serait « porcs » par « Les démons », référent établi par le contexte immédiat (v. 30–31). Elle remplace aussi « paissait » par « se nourrissaient », qui rend sans restriction indue le participe grec βοσκομένη. La note de référent devient inutile après l’explicitation dans le texte.
  reviewer_model: gpt-5.6-terra
