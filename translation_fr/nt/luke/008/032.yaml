source:
  edition: SBLGNT
  text: Ἦν δὲ ἐκεῖ ἀγέλη χοίρων ἱκανῶν ⸀βοσκομένη ἐν τῷ ὄρει· καὶ ⸀παρεκάλεσαν αὐτὸν ἵνα ἐπιτρέψῃ αὐτοῖς εἰς ἐκείνους εἰσελθεῖν· καὶ ἐπέτρεψεν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/032.yaml
  text: There was a large herd of pigs feeding there on the mountain[a], and they begged him to permit them to enter those pigs[c][b], and he permitted them.
translation:
  language: fr
  text: Il y avait là, sur la montagne[b], un grand troupeau de porcs[a] qui se nourrissaient. Les démons le supplièrent de leur permettre d’entrer dans ces porcs, et il le leur permit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « un troupeau de nombreux porcs » ou « un troupeau considérable de porcs ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « sur le versant de la montagne ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγέλη χοίρων ἱκανῶν
  choice: un grand troupeau de porcs
  rationale: « Troupeau » est le collectif français naturel ici, et « grand » exprime idiomatiquement le nombre considérable indiqué par ἱκανῶν.
- source_word: βοσκομένη
  choice: qui paissait
  rationale: Le participe féminin singulier se rapporte à ἀγέλη, « troupeau ». « Paître » décrit avec concision le fait que les porcs se nourrissaient.
- source_word: ἐν τῷ ὄρει
  choice: sur la montagne
  rationale: Cette formulation suit directement le sens courant de ὄρος, tout en laissant « sur le versant » comme possibilité contextuelle.
- source_word: παρεκάλεσαν
  choice: le supplièrent
  rationale: Le verbe exprime ici une demande pressante ; « supplièrent » convient au registre narratif et en conserve la force.
- source_word: ἐπιτρέψῃ / ἐπέτρεψεν
  choice: permettre / permit
  rationale: La répétition de la même racine française reproduit la correspondance entre la demande et la réponse dans le grec.
- source_word: εἰς ἐκείνους εἰσελθεῖν
  choice: entrer dans ces porcs
  rationale: La traduction conserve le mouvement d’entrée exprimé par εἰς et εἰσελθεῖν ainsi que la valeur démonstrative de ἐκείνους.
- source_word: δὲ
  choice: absence de connecteur explicite
  rationale: Dans ce développement narratif, le français n’a pas besoin d’un « or » ou d’un « alors » initial ; l’enchaînement demeure clair sans surtraduire la particule.
theological_decisions:
- issue: Référent du sujet pluriel de παρεκάλεσαν
  choice: Conserver le pronom « Ils », avec une note indiquant son référent contextuel
  alternative: 'Expliciter dans le texte : « Les démons le supplièrent »'
  rationale: Le contexte identifie les démons ou esprits impurs, mais le verset grec lui-même ne répète pas le nom. Le pronom préserve cette formulation implicite sans masquer le référent au lecteur.
translation_notes:
  register: Français international moderne, narratif et digne. « Porcs » convient mieux que le plus familier « cochons » au registre biblique courant. La syntaxe reste naturelle tout en conservant le pronom pluriel implicite et la répétition de « permettre » présentes dans la source.
