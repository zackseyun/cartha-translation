review_pass:
  verdict: revise
  source_fidelity: 'Le sens central est bien rendu : présence d’un important groupe de porcs, activité alimentaire, localisation sur la montagne, demande pressante d’entrer dans les porcs et permission accordée. « Paissait » restreint toutefois βοσκομένη à l’idée de pâturage, alors que le participe signifie plus largement « se nourrissant / en train de manger ».'
  naturalness: La phrase est globalement fluide et de registre moderne soutenu. En revanche, « Ils » après « un grand troupeau de porcs » sera spontanément compris en français comme renvoyant aux porcs. La note ne supprime pas efficacement cette ambiguïté de lecture dans le texte courant.
  terminology: « Porcs », « troupeau », « supplièrent » et la répétition de « permettre » conviennent au registre biblique moderne. L’explicitation de « les démons » est ici justifiée par la syntaxe française et le contexte immédiat ; elle ne détermine pas une question doctrinale disputée.
  issues:
  - severity: medium
    issue: Référent de « Ils » ambigu et grammaticalement orienté vers les porcs
    rationale: En français, le seul antécédent pluriel immédiatement disponible est « porcs » ; le lecteur peut donc comprendre que les porcs supplient Jésus. Le grec emploie un sujet implicite dont le référent est fourni par le contexte, mais la conservation mécanique du pronom produit une ambiguïté plus forte et trompeuse en français.
  - severity: low
    issue: « qui paissait » est trop spécifique pour βοσκομένη
    rationale: Le grec décrit les porcs comme se nourrissant ; il ne précise pas nécessairement qu’ils broutent. « qui se nourrissaient » conserve une portée plus large et reste naturel.
  revised_text: Il y avait là, sur la montagne[b], un grand troupeau de porcs[a] qui se nourrissaient. Les démons le supplièrent de leur permettre d’entrer dans ces porcs, et il le leur permit.
  revised_footnotes:
