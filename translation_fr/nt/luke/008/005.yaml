  source_fidelity: 'Le texte rend fidèlement les principales relations du grec : sortie du semeur dans le but de semer, simultanéité de l’action, portion de semence tombée à côté du chemin, piétinement passif et consommation par les oiseaux. « Au bord du chemin » exprime correctement παρά τὴν ὁδόν dans un français naturel.'
  naturalness: La formulation est fluide, claire et de registre narratif moderne. « Le semeur », « sa semence » et « les oiseaux du ciel » sont idiomatiques et conviennent au genre parabolique. La reprise féminine (« elle », « la ») est grammaticalement cohérente avec « une partie ».
  terminology: Les termes agricoles sont exacts. « Semence » préserve bien le sens collectif de σπόρος, tandis que « dévorèrent » rend de façon recevable la force de κατέφαγεν sans ajout interprétatif. « Oiseaux du ciel » conserve l’image grecque et demeure naturel en français biblique moderne.
