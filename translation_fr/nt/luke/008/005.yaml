id: LUK.8.5
reference: Luke 8:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἐξῆλθεν ὁ σπείρων τοῦ σπεῖραι τὸν σπόρον αὐτοῦ. καὶ ἐν τῷ σπείρειν αὐτὸν ὃ μὲν ἔπεσεν παρὰ τὴν ὁδόν, καὶ κατεπατήθη καὶ τὰ πετεινὰ τοῦ οὐρανοῦ κατέφαγεν αὐτό.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/005.yaml
  text: The sower went out to sow his seed. And as he was sowing[a], some fell beside the path and was trampled, and the birds of the sky devoured it.
translation:
  language: fr
  text: Le semeur sortit pour semer sa semence. Pendant qu’il semait, une partie tomba au bord du chemin ; elle fut piétinée, et les oiseaux du ciel la dévorèrent.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐξῆλθεν
  choice: sortit
  rationale: L’aoriste de ἐξέρχομαι se rend naturellement par « sortit » en français moderne.
- source_word: ὁ σπείρων
  choice: le semeur
  rationale: Le participe substantivé désigne celui qui sème ; « le semeur » est idiomatique et convient au cadre parabolique.
- source_word: τοῦ σπεῖραι
  choice: pour semer
  rationale: L’infinitif articulé au génitif après un verbe de mouvement exprime ici le but.
- source_word: τὸν σπόρον αὐτοῦ
  choice: sa semence
  rationale: σπόρος désigne la semence ou le grain destiné à être semé. « Sa semence » est clair et préserve le singulier collectif.
- source_word: ἐν τῷ σπείρειν αὐτόν
  choice: Pendant qu’il semait
  rationale: La construction avec ἐν et l’infinitif articulé marque la simultanéité ; cette formulation est naturelle en français.
- source_word: ὃ μὲν
  choice: une partie
  rationale: Le relatif neutre singulier avec μέν désigne distributivement une portion de la semence, en anticipation des autres terrains.
- source_word: ἔπεσεν παρὰ τὴν ὁδόν
  choice: tomba au bord du chemin
  rationale: παρά avec l’accusatif situe ici la semence à côté du chemin ; « au bord du chemin » est une expression française naturelle.
- source_word: κατεπατήθη
  choice: fut piétinée
  rationale: Le passif de καταπατέω signifie être foulé ou piétiné. « Fut piétinée » est précis et concis.
- source_word: τὰ πετεινὰ τοῦ οὐρανοῦ
  choice: les oiseaux du ciel
  rationale: La traduction conserve directement l’image de πετεινά et de οὐρανός, tout en étant idiomatique en français.
- source_word: κατέφαγεν αὐτό
  choice: la dévorèrent
  rationale: κατεσθίω exprime l’action de manger entièrement ; « dévorèrent » en restitue la force.
theological_decisions: []
translation_notes:
  register: Français moderne, international et digne. Le rythme narratif reste simple et oral. L’accord féminin des pronoms renvoie clairement à « une partie » de la semence, sans expliciter davantage que le grec.
