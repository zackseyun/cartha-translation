    issue: « Il leur répondit » ajoute l’idée de réponse.
    rationale: Le grec dit seulement « il dit » (ὁ δὲ εἶπεν). Même si le contexte comporte un échange, la traduction ne devrait pas introduire ce verbe plus spécifique.
  - severity: low
    issue: « cela est donné en paraboles » est une explicitation lourde de l’ellipse.
    rationale: Le grec juxtapose « aux autres » et « en paraboles ». « C’est en paraboles » est plus fluide en français tout en préservant l’ellipse et sans déterminer davantage ce qui est implicitement donné ou communiqué.
