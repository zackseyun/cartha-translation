  verdict: revise
  source_fidelity: 'Le texte rend fidèlement les termes essentiels : le parfait passif δέδοται (« il a été donné »), γνῶναι (« connaître »), μυστήρια, « royaume de Dieu », et la répétition voir/entendre face à voir/comprendre. « Il leur répondit » introduisait toutefois une nuance de réponse absente de ὁ δὲ εἶπεν, qui dit simplement « Il dit ».'
  naturalness: La formulation est globalement claire et de registre moderne. « Mais aux autres, c’est en paraboles » rend de façon naturelle l’ellipse de τοῖς δὲ λοιποῖς ἐν παραβολαῖς sans alourdir la phrase par « cela est donné », formulation française moins idiomatique et interprétativement plus explicite.
  terminology: « Mystères » est le terme biblique approprié, avec une note utile pour « secrets ». « Royaume de Dieu » est établi et fidèle. « Afin que » maintient sans la résoudre la tension de finalité et de résultat liée à ἵνα.
