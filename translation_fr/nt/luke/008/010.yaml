reference: Luke 8:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν· Ὑμῖν δέδοται γνῶναι τὰ μυστήρια τῆς βασιλείας τοῦ θεοῦ, τοῖς δὲ λοιποῖς ἐν παραβολαῖς, ἵνα βλέποντες μὴ βλέπωσιν καὶ ἀκούοντες μὴ συνιῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/010.yaml
  text: And he said[a], “To you it has been given to know the mysteries of the kingdom of God, but to the rest in parables, so that seeing they may not see[c][b], and hearing they may not understand.”
translation:
  language: fr
  text: 'Il dit : « À vous, il a été donné de connaître les mystères[a] du royaume de Dieu ; mais aux autres, c’est en paraboles, afin qu’en regardant ils ne voient pas et qu’en entendant ils ne comprennent pas[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les secrets ». Le grec désigne des réalités du royaume de Dieu cachées à certains et révélées à d’autres.'
    reason: lexical_alternative
  - marker: b
    text: Les mots « afin qu’en regardant ils ne voient pas et qu’en entendant ils ne comprennent pas » font écho à Ésaïe 6.9-10. Ils peuvent exprimer une intention divine, un résultat judiciaire, ou les deux.
    reason: cross_reference
lexical_decisions:
- source_word: δέδοται
  choice: il a été donné
  rationale: Le parfait passif conserve l’idée d’un don accordé dont l’effet demeure, tout en laissant le donateur implicite comme en grec.
- source_word: γνῶναι
  choice: de connaître
  rationale: Rend directement γινώσκω et maintient la distinction avec συνιῶσιν, traduit plus loin par « comprennent ».
- source_word: μυστήρια
  choice: les mystères
  rationale: Le terme biblique désigne ici des réalités du dessein de Dieu cachées puis révélées, et non de simples informations secrètes.
- source_word: βασιλείας τοῦ θεοῦ
  choice: du royaume de Dieu
  rationale: Formulation naturelle et reconnue, assez large pour évoquer à la fois le règne et le domaine royal de Dieu.
- source_word: τοῖς δὲ λοιποῖς ἐν παραβολαῖς
  choice: mais aux autres, cela est donné en paraboles
  rationale: La légère explicitation de l’ellipse grecque produit une phrase française intelligible sans importer « ceux du dehors » du parallèle de Marc.
- source_word: ἵνα
  choice: afin que
  rationale: Préserve nettement la force de finalité ou de résultat de ἵνα ainsi que la tension théologique du passage.
- source_word: βλέποντες μὴ βλέπωσιν
  choice: qu’en regardant ils ne voient pas
  rationale: Conserve la répétition du verbe grec et l’écho scripturaire, sans substituer l’interprétation « percevoir » à « voir ».
- source_word: ἀκούοντες μὴ συνιῶσιν
  choice: qu’en entendant ils ne comprennent pas
  rationale: Distingue l’acte d’entendre de la compréhension exprimée par συνίημι.
theological_decisions:
- issue: Force de la proposition introduite par ἵνα dans l’écho à Ésaïe 6
  choice: afin que
  alternative: de sorte que
  rationale: « Afin que » conserve la possibilité d’une finalité judiciaire, tandis que le contexte peut aussi laisser entendre un résultat ; la traduction ne tranche pas artificiellement cette tension.
translation_notes:
  register: Français international moderne, digne et accessible. L’ellipse grecque est légèrement explicitée par « cela est donné » pour assurer la fluidité ; la structure répétitive de la citation est conservée.
