revisions:
- from: 'Il leur répondit : « À vous, il a été donné de connaître les mystères[a] du royaume de Dieu ; mais aux autres, cela est donné en paraboles, afin qu’en regardant ils ne voient pas, et qu’en entendant ils ne comprennent pas[b]. »'
  to: 'Il dit : « À vous, il a été donné de connaître les mystères[a] du royaume de Dieu ; mais aux autres, c’est en paraboles, afin qu’en regardant ils ne voient pas et qu’en entendant ils ne comprennent pas[b]. »'
  rationale: La révision retire l’inférence non exprimée de « répondit » et allège l’explicitation de l’ellipse grecque. Elle conserve le passif implicite, la terminologie biblique, la distinction entre connaître et comprendre, ainsi que l’ambiguïté théologique de la proposition introduite par ἵνα. Les ancres de notes restent correctement placées.
