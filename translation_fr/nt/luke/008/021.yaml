source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν πρὸς αὐτούς· Μήτηρ μου καὶ ἀδελφοί μου οὗτοί εἰσιν οἱ τὸν λόγον τοῦ θεοῦ ἀκούοντες καὶ ⸀ποιοῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/021.yaml
  text: But he answered and said to them[b][a], “My mother and my brothers are those who hear the word of God and do it.”
translation:
  language: fr
  text: 'Mais il leur répondit : « Ma mère et mes frères[a], ce sont ceux qui écoutent la parole de Dieu et la mettent en pratique. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « mes frères et sœurs ». Le grec porte « frères », mais l’affirmation peut s’appliquer aussi bien aux femmes qu’aux hommes.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ ἀποκριθεὶς εἶπεν πρὸς αὐτούς
  choice: Mais il leur répondit
  rationale: Cette formulation française naturelle rend la transition δέ, les destinataires exprimés par πρὸς αὐτούς et la tournure narrative ἀποκριθεὶς εἶπεν, sans reproduire le lourd pléonasme « répondit et dit ».
- source_word: Μήτηρ μου καὶ ἀδελφοί μου
  choice: Ma mère et mes frères
  rationale: Traduction directe des termes de parenté. « Frères » conserve la forme masculine du grec et l’écho aux frères biologiques de Jésus; une note signale la portée possiblement inclusive de l’affirmation.
- source_word: οὗτοί εἰσιν οἱ
  choice: ce sont ceux qui
  rationale: La tournure disloquée, idiomatique en français, conserve la mise en relief du démonstratif οὗτοι tout en introduisant naturellement les participes substantivés.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: la parole de Dieu
  rationale: Expression française traditionnelle et exacte, qui garde la structure génitive et la résonance théologique de λόγος tout en désignant ici le message ou l’enseignement venant de Dieu.
- source_word: ἀκούοντες καὶ ποιοῦντες
  choice: qui écoutent … et la mettent en pratique
  rationale: « Écoutent » convient à une parole reçue avec attention; « mettent en pratique » exprime idiomatiquement le fait d’accomplir ce qui est entendu sans imposer le terme plus interprétatif « obéissent ».
theological_decisions:
- issue: Portée de la famille redéfinie par Jésus
  choice: Jésus désigne comme sa famille ceux qui écoutent la parole de Dieu et la mettent en pratique.
  alternative: Comprendre ses paroles comme un rejet explicite de sa famille biologique.
  rationale: Le verset élargit la notion de parenté autour de l’accueil actif de la parole de Dieu, mais ne déclare pas que Jésus renie sa mère ou ses frères biologiques.
- issue: Portée de ἀδελφοί
  choice: Conserver « frères » dans le texte et signaler en note l’application possiblement inclusive.
  alternative: Traduire directement par « frères et sœurs ».
  rationale: Le masculin pluriel grec fait écho aux frères biologiques mentionnés dans le contexte, tandis que le groupe défini par l’écoute et la pratique de la parole peut inclure des femmes. La note préserve ces deux dimensions sans trancher silencieusement.
translation_notes:
  register: Français international moderne, digne et oralement fluide. La construction « ce sont ceux qui » maintient l’insistance du grec sans raideur; « mettre en pratique » est plus naturel en français que le calque « faire la parole ».
