  source_fidelity: 'Le texte rend fidèlement les éléments essentiels du grec : la réponse adressée au groupe (« il leur répondit »), l’identification emphatique de la mère et des frères, « la parole de Dieu », ainsi que les deux participes présents caractérisant ceux qui écoutent et mettent cette parole en pratique. La réduction idiomatique de ἀποκριθεὶς εἶπεν à « répondit » est naturelle en français et ne modifie pas le sens.'
  naturalness: '« Mais il leur répondit : “Ma mère et mes frères, ce sont ceux qui écoutent la parole de Dieu et la mettent en pratique.” » est un français moderne, fluide et suffisamment solennel. La dislocation « ce sont ceux qui » restitue bien l’insistance démonstrative sans calquer lourdement le grec.'
