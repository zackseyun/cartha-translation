id: LUK.8.45
reference: Luke 8:45
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ εἶπεν ὁ Ἰησοῦς· Τίς ὁ ἁψάμενός μου; ἀρνουμένων δὲ πάντων εἶπεν ὁ ⸀Πέτρος· Ἐπιστάτα, οἱ ὄχλοι συνέχουσίν σε καὶ ⸀ἀποθλίβουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/045.yaml
  text: And Jesus said[a], “Who is the one who touched me?” And while everyone was denying it, Peter said, “Master, the crowds are hemming you in and pressing against you.”
translation:
  language: fr
  text: 'Jésus demanda : « Qui est-ce qui m’a touché ? » Alors que tous le niaient, Pierre dit : « Maître, les foules t’enserrent et te pressent[a] ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « se massent autour de toi et se serrent contre toi ».'
    reason: Alternative lexicale naturelle pour la combinaison συνέχουσίν… ἀποθλίβουσιν, qui peut mettre davantage l’accent sur le mouvement de la foule.
lexical_decisions:
- source_word: ἁψάμενός
  choice: m’a touché
  rationale: Dans ce contexte, le moyen de ἅπτω désigne un contact physique. « Toucher » est le terme français naturel et correspond au geste de la femme dans le récit.
- source_word: ἀρνουμένων δὲ πάντων
  choice: Alors que tous le niaient
  rationale: La tournure conserve l’action en cours exprimée par le participe présent et rend explicitement, par le pronom « le », le contenu sous-entendu du déni.
- source_word: Ἐπιστάτα
  choice: Maître
  rationale: Ce titre lucanien reconnaît l’autorité de Jésus sans introduire le titre plus fort « Seigneur », qui traduirait normalement κύριος.
- source_word: οἱ ὄχλοι
  choice: les foules
  rationale: Le pluriel français maintient le nombre du grec et évoque les nombreux groupes de personnes qui entourent Jésus.
- source_word: συνέχουσίν
  choice: t’enserrent
  rationale: Le verbe exprime ici l’idée d’être entouré et contenu de près; « enserrer » conserve cette image tout en restant clair.
- source_word: ἀποθλίβουσιν
  choice: te pressent
  rationale: Le verbe décrit la forte pression physique exercée contre Jésus. « Presser » évite de surtraduire par « écraser » tout en distinguant cette action du fait de l’enserrer.
theological_decisions:
- issue: Traduction du titre Ἐπιστάτα adressé à Jésus
  choice: Maître
  alternative: Seigneur
  rationale: Le texte porte Ἐπιστάτα et non κύριος. « Maître » exprime le respect et l’autorité reconnus à Jésus sans renforcer indûment le titre sur le plan christologique.
translation_notes:
  register: Français international moderne, naturel et digne. « Qui est-ce qui » rend clairement la construction grecque τίς ὁ ἁψάμενός sans la lourdeur de « Qui est celui qui ». Le tutoiement correspond à l’usage narratif biblique courant et au singulier grec.
