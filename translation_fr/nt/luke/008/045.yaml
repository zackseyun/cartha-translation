  verdict: approve
  source_fidelity: 'Le texte rend fidèlement les éléments grecs essentiels : la question de Jésus, le contact physique (ἁψάμενος), le déni simultané de tous (ἀρνουμένων ... πάντων), l’adresse Ἐπιστάτα et les deux verbes distincts décrivant la pression des foules. « Jésus demanda » est une formulation française idiomatique et légitime pour εἶπεν introduisant une interrogation.'
  naturalness: Le français est moderne, fluide et d’un registre biblique sobre. « Qui est-ce qui m’a touché ? », « Alors que tous le niaient » et le tutoiement de Pierre à Jésus sont naturels. « Les foules t’enserrent et te pressent » conserve une expression énergique sans lourdeur.
  terminology: « Maître » traduit adéquatement Ἐπιστάτα sans substituer indûment « Seigneur ». « Les foules » respecte le pluriel de οἱ ὄχλοι. « Enserrent » et « pressent » rendent de façon différenciée συνέχουσιν et ἀποθλίβουσιν. La note propose une alternative française naturelle et reste liée à la paire verbale concernée.
