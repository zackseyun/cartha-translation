source:
  edition: SBLGNT
  text: ἰδὼν δὲ τὸν ⸀Ἰησοῦν ἀνακράξας προσέπεσεν αὐτῷ καὶ φωνῇ μεγάλῃ εἶπεν· Τί ἐμοὶ καὶ σοί, Ἰησοῦ υἱὲ τοῦ θεοῦ τοῦ ὑψίστου; δέομαί σου, μή με βασανίσῃς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/028.yaml
  text: But when he saw Jesus[a], he cried out, fell down before him, and said with a loud voice, “What do you have to do with me, Jesus, Son of the Most High God? I beg you, do not torment me.”
translation:
  language: fr
  text: 'Mais quand il vit Jésus, il poussa un cri, tomba devant lui et dit d’une voix forte : « Que me veux-tu ? »[a] Jésus, Fils du Dieu Très-Haut, je t’en supplie, ne me tourmente pas !'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « Qu’y a-t-il entre moi et toi ? »'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν
  choice: quand il vit
  rationale: Le participe aoriste indique la circonstance qui précède les verbes principaux. Cette tournure française est naturelle et en conserve la valeur temporelle.
- source_word: ἀνακράξας
  choice: il poussa un cri
  rationale: Le verbe désigne un éclat de voix soudain et puissant. Cette formulation demeure distincte de φωνῇ μεγάλῃ, rendu ensuite par « d’une voix forte ».
- source_word: προσέπεσεν αὐτῷ
  choice: se jeta à ses pieds
  rationale: Le verbe exprime le fait de tomber devant quelqu’un, ici dans une attitude de détresse ou de soumission. « À ses pieds » rend naturellement cette posture en français.
- source_word: φωνῇ μεγάλῃ
  choice: d’une voix forte
  rationale: Le datif exprime la manière. Cette formulation conserve la vivacité de l’expression grecque dans un français courant et digne.
- source_word: Τί ἐμοὶ καὶ σοί
  choice: Que me veux-tu ?
  rationale: Cette locution d’influence sémitique exprime une protestation et une volonté de dissociation. « Que me veux-tu ? » en restitue idiomatiquement la force, tandis que la formulation plus littérale est donnée en note.
- source_word: υἱὲ τοῦ θεοῦ τοῦ ὑψίστου
  choice: Fils du Dieu Très-Haut
  rationale: Cette traduction française naturelle conserve intégralement le titre et la reconnaissance de l’identité de Jésus, sans ajout interprétatif.
- source_word: δέομαί σου
  choice: Je t’en supplie
  rationale: Le verbe exprime une demande pressante. « Je t’en supplie » communique clairement l’urgence et l’intensité de l’appel.
- source_word: μή με βασανίσῃς
  choice: ne me tourmente pas
  rationale: βασανίζω peut évoquer un tourment sévère ou la torture. « Tourmenter » convient au contexte d’exorcisme sans limiter le sens à une souffrance physique.
theological_decisions:
- issue: La confession par le démon de l’identité de Jésus
  choice: Jésus, Fils du Dieu Très-Haut
  alternative: Jésus, Fils de Dieu, le Très-Haut
  rationale: La formulation retenue préserve toute la portée christologique de l’adresse telle qu’elle apparaît dans le récit, sans l’atténuer ni la développer en une formule doctrinale ultérieure.
translation_notes:
  register: Français international moderne, narratif et digne. Le discours direct reste intense et oral sans devenir familier. La locution grecque est rendue idiomatiquement dans le texte, avec sa forme plus littérale conservée en note.
