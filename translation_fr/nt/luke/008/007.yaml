id: LUK.8.7
reference: Luke 8:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἕτερον ἔπεσεν ἐν μέσῳ τῶν ἀκανθῶν, καὶ συμφυεῖσαι αἱ ἄκανθαι ἀπέπνιξαν αὐτό.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/007.yaml
  text: And other seed fell among the thorns[b][a], and the thorns grew up with it and choked it.
translation:
  language: fr
  text: Une autre semence tomba au milieu des plantes épineuses[a] ; celles-ci poussèrent avec elle et l’étouffèrent[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « parmi les plantes épineuses ».
    reason: lexical_alternative
  - marker: b
    text: Ou « les plantes épineuses, poussant avec elle, l’étouffèrent ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕτερον
  choice: une autre semence
  rationale: L’adjectif neutre substantivé renvoie implicitement à la semence dans le contexte de la parabole ; expliciter « semence » rend la phrase naturelle et claire en français.
- source_word: ἔπεσεν
  choice: tomba
  rationale: L’aoriste de πίπτω exprime simplement l’action ponctuelle de tomber.
- source_word: ἐν μέσῳ τῶν ἀκανθῶν
  choice: au milieu des plantes épineuses
  rationale: La formulation conserve explicitement la valeur spatiale de ἐν μέσῳ, tout en précisant que ἄκανθαι désigne ici des végétaux épineux plutôt que de simples épines détachées.
- source_word: ἀκανθῶν / αἱ ἄκανθαι
  choice: les plantes épineuses / celles-ci
  rationale: ἄκανθα peut désigner des plantes épineuses. Cette traduction convient à l’image agricole et permet de rendre naturellement leur croissance ; « celles-ci » évite une répétition lourde sans perdre le référent.
- source_word: συμφυεῖσαι
  choice: poussèrent avec elle
  rationale: Le participe indique que les plantes épineuses grandissent en même temps que la semence et à ses côtés ; la coordination française restitue naturellement cette action concomitante.
- source_word: ἀπέπνιξαν
  choice: l’étouffèrent
  rationale: Le verbe signifie étouffer ou suffoquer ; « étouffer » conserve l’image végétale usuelle sans expliquer davantage le mécanisme.
- source_word: αὐτό
  choice: l’
  rationale: Le pronom reprend la semence implicitement visée par ἕτερον et explicitée au début de la traduction.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. « Plantes épineuses » est préféré à « épines », car les végétaux poussent et étouffent la semence. Le passé simple convient au récit bref et soutenu de la parabole.
