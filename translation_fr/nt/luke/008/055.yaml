id: LUK.8.55
reference: Luke 8:55
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἐπέστρεψεν τὸ πνεῦμα αὐτῆς, καὶ ἀνέστη παραχρῆμα, καὶ διέταξεν αὐτῇ δοθῆναι φαγεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/055.yaml
  text: And her spirit returned[a], and she rose immediately[b], and he directed that food be given to her.
translation:
  language: fr
  text: Son esprit revint[a], et elle se leva aussitôt. Puis il ordonna qu’on lui donne à manger.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « son souffle revint ».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπέστρεψεν
  choice: revint
  rationale: Le verbe exprime ici le retour de ce qui animait la jeune fille. « Revint » est direct, naturel et n’ajoute aucune explication au récit.
- source_word: τὸ πνεῦμα αὐτῆς
  choice: son esprit
  rationale: Dans ce contexte de retour à la vie, « son esprit » conserve la portée habituelle de πνεῦμα ainsi que l’enjeu théologique du passage. « Son souffle » demeure lexicalement possible et figure en note.
- source_word: ἀνέστη
  choice: elle se leva
  rationale: « Se leva » rend naturellement le mouvement physique exprimé par ἀνίστημι, sans employer un terme plus technique ou explicitement doctrinal comme « ressuscita ».
- source_word: παραχρῆμα
  choice: aussitôt
  rationale: « Aussitôt » marque clairement l’immédiateté tout en convenant à un registre narratif digne et courant.
- source_word: διέταξεν
  choice: il ordonna
  rationale: διατάσσω désigne une instruction donnée avec autorité. « Ordonna » en préserve la force, tandis que le contexte pratique évite toute dureté indue.
- source_word: αὐτῇ δοθῆναι φαγεῖν
  choice: qu’on lui donne à manger
  rationale: Cette tournure française idiomatique rend à la fois l’idée de donner et l’infinitif explicite « manger », sans devoir ajouter le nom « nourriture » absent du grec.
theological_decisions:
- issue: Sens de πνεῦμα dans un récit de retour à la vie
  choice: son esprit revint
  alternative: son souffle revint
  rationale: « Esprit » préserve la portée personnelle et théologique possible de πνεῦμα sans réduire le phénomène à la seule respiration. La note maintient néanmoins l’autre sens lexical possible.
translation_notes:
  register: Français international moderne, simple et digne. La coordination grecque est légèrement adaptée en deux phrases pour une narration française naturelle, sans modifier la succession des actions. La note du texte anglais relative à la nourriture n’est pas reprise, car « qu’on lui donne à manger » rend déjà explicitement et idiomatiquement δοθῆναι φαγεῖν.
