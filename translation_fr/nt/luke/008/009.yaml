  text: Ἐπηρώτων δὲ αὐτὸν οἱ μαθηταὶ ⸀αὐτοῦ τίς ⸂αὕτη εἴη ἡ παραβολή⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/009.yaml
  text: Then his disciples asked him what this parable meant[a].
translation:
  language: fr
  text: Ses disciples lui demandaient ce que signifiait cette parabole[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « ce que pouvait être cette parabole ».'
    reason: Conserver la formulation plus littérale de la question indirecte grecque et la nuance de l’optatif, sans alourdir le texte principal.
lexical_decisions:
- source_word: Ἐπηρώτων
  choice: demandaient
  rationale: L’imparfait grec exprime une action passée en cours ou répétée; l’imparfait français la rend naturellement sans imposer une seule demande ponctuelle.
- source_word: δὲ
  choice: non traduit explicitement
  rationale: Particule de liaison légère; en français, l’enchaînement narratif reste naturel sans « alors » ou « mais », qui risqueraient de préciser excessivement la relation logique.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: ses disciples
  rationale: Formulation française idiomatique qui conserve le terme traditionnel et relationnel « disciples ».
- source_word: τίς αὕτη εἴη ἡ παραβολή
  choice: ce que signifiait cette parabole
  rationale: Dans le contexte, la question porte sur la signification de la parabole. Cette formulation naturelle rend le sens de la question indirecte, tandis que la note conserve la tournure plus littérale.
- source_word: παραβολή
  choice: parabole
  rationale: Terme français établi et précis dans le contexte des Évangiles.
- source_word: εἴη
  choice: signifiait
  rationale: L’optatif dans la question indirecte dépendant d’un verbe au passé peut être rendu idiomatiquement par l’imparfait français; « signifiait » explicite la portée interprétative indiquée par le contexte.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. L’imparfait « demandaient » suit l’aspect du verbe grec; la formulation principale privilégie la clarté contextuelle, avec l’ambiguïté littérale signalée en note.
