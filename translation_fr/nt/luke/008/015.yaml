reference: Luke 8:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τὸ δὲ ἐν τῇ καλῇ γῇ, οὗτοί εἰσιν οἵτινες ἐν καρδίᾳ καλῇ καὶ ἀγαθῇ ἀκούσαντες τὸν λόγον κατέχουσιν καὶ καρποφοροῦσιν ἐν ὑπομονῇ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/015.yaml
  text: But the seed in the good soil—these are the ones who[a], having heard the word with a good and noble heart, hold fast to it and bear fruit with perseverance.
translation:
  language: fr
  text: Quant à la semence dans la bonne terre, ce sont ceux qui, après avoir entendu la parole avec un cœur noble et bon, la retiennent et portent du fruit avec persévérance.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « avec un cœur honnête et bon ».'
    reason: Alternative lexicale pour les deux adjectifs grecs qualifiant le cœur.
lexical_decisions:
- source_word: τὸ δὲ ἐν τῇ καλῇ γῇ
  choice: Mais ce qui est dans la bonne terre
  rationale: La tournure grecque est elliptique et renvoie à la semence dans le contexte de la parabole. Le français peut conserver cette ellipse de façon intelligible sans imposer explicitement « la semence » ou « ce qui a été semé ».
- source_word: ἐν καρδίᾳ καλῇ καὶ ἀγαθῇ
  choice: avec un cœur noble et bon
  rationale: « Cœur » garde le sens biblique de la personne intérieure. Les deux adjectifs proches sont distingués naturellement en français, et « noble » exprime ici la qualité morale sans réduire καλός à la seule honnêteté.
- source_word: ἀκούσαντες τὸν λόγον
  choice: après avoir entendu la parole
  rationale: 'Cette formulation rend la valeur antérieure du participe aoriste : ils entendent d’abord, puis retiennent la parole et portent du fruit.'
- source_word: κατέχουσιν
  choice: la retiennent
  rationale: Le verbe exprime ici une conservation ferme et durable. Le pronom reprend clairement « la parole ».
- source_word: καρποφοροῦσιν
  choice: portent du fruit
  rationale: Cette expression française courante préserve directement l’image agricole et sa portée métaphorique.
- source_word: ἐν ὑπομονῇ
  choice: avec persévérance
  rationale: ὑπομονή désigne l’endurance constante; « avec persévérance » exprime naturellement la manière dont le fruit est porté.
theological_decisions:
- issue: Description morale du cœur réceptif
  choice: avec un cœur noble et bon
  alternative: avec un cœur honnête et bon
  rationale: Le texte qualifie positivement la disposition intérieure des auditeurs sans expliquer l’origine doctrinale de cette disposition. La traduction conserve cette tension et n’introduit aucune affirmation sur le mérite, la régénération ou l’ordre du salut.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe conserve la structure explicative du grec, tandis que « après avoir entendu » et « la retiennent » assurent une lecture naturelle.
