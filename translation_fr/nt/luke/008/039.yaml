reference: Luke 8:39
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ὑπόστρεφε εἰς τὸν οἶκόν σου, καὶ διηγοῦ ὅσα ⸂σοι ἐποίησεν⸃ ὁ θεός. καὶ ἀπῆλθεν καθ’ ὅλην τὴν πόλιν κηρύσσων ὅσα ἐποίησεν αὐτῷ ὁ Ἰησοῦς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/039.yaml
  text: Return to your house, and tell what great things God has done for you. And he went away, proclaiming throughout the whole city what Jesus had done for him.
translation:
  language: fr
  text: « Retourne chez toi et raconte tout ce que Dieu a fait pour toi. » Il s’en alla, proclamant dans toute la ville tout ce que Jésus avait fait pour lui.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὑπόστρεφε
  choice: Retourne
  rationale: L’impératif présent exprime directement le retour vers le lieu d’où l’homme était venu.
- source_word: εἰς τὸν οἶκόν σου
  choice: chez toi
  rationale: Dans ce contexte, οἶκος désigne le lieu de vie de l’homme; « chez toi » est plus naturel en français moderne que « dans ta maison » tout en conservant le sens spatial.
- source_word: διηγοῦ
  choice: raconte
  rationale: Le verbe signifie rapporter ou raconter de manière suivie; « raconte » est naturel et plus précis que le simple « dis ».
- source_word: ὅσα σοι ἐποίησεν ὁ θεός
  choice: tout ce que Dieu a fait pour toi
  rationale: ὅσα peut désigner l’ensemble de ce qui a été accompli. « Tout ce que » reste fidèle sans ajouter l’adjectif absent « grandes »; le passé composé convient au résultat encore pertinent.
- source_word: ἀπῆλθεν
  choice: il s’en alla
  rationale: Cette formulation marque le départ de la scène et s’accorde avec le ton narratif digne du passage.
- source_word: καθ’ ὅλην τὴν πόλιν
  choice: dans toute la ville
  rationale: La construction exprime une diffusion à travers l’ensemble de la ville; cette tournure est idiomatique en français.
- source_word: κηρύσσων
  choice: proclamant
  rationale: Le participe décrit une annonce publique; « proclamant » conserve davantage cette force que « racontant » ou « annonçant ».
- source_word: ὅσα ἐποίησεν αὐτῷ ὁ Ἰησοῦς
  choice: tout ce que Jésus avait fait pour lui
  rationale: La formulation reprend délibérément celle concernant Dieu. Le plus-que-parfait situe naturellement l’action de Jésus avant le départ et la proclamation de l’homme.
theological_decisions:
- issue: Parallèle entre « Dieu » dans l’ordre de Jésus et « Jésus » dans la proclamation de l’homme
  choice: Conserver distinctement « Dieu a fait pour toi » puis « Jésus avait fait pour lui »
  alternative: Harmoniser les deux propositions en employant soit « Dieu », soit « Jésus », ou expliciter leur rapport
  rationale: Le texte grec établit ce parallèle sans l’expliquer. Le conserver préserve sa portée théologique et son ambiguïté féconde sans ajouter de glose interprétative.
translation_notes:
  register: Français international moderne, naturel et digne. « Chez toi » évite une littéralité maladroite, tandis que « proclamant » maintient la force publique de κηρύσσων. Aucun marqueur de note n’est requis puisqu’aucune note n’est fournie.
