id: LUK.8.33
reference: Luke 8:33
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐξελθόντα δὲ τὰ δαιμόνια ἀπὸ τοῦ ἀνθρώπου εἰσῆλθον εἰς τοὺς χοίρους, καὶ ὥρμησεν ἡ ἀγέλη κατὰ τοῦ κρημνοῦ εἰς τὴν λίμνην καὶ ἀπεπνίγη.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/033.yaml
  text: Then the demons came out of the man and entered the pigs[a], and the herd rushed down the steep bank into the lake and drowned.
translation:
  language: fr
  text: Alors les démons sortirent de l’homme et entrèrent dans les porcs, puis le troupeau se précipita le long de la pente escarpée jusque dans le lac et se noya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξελθόντα
  choice: sortirent
  rationale: Le participe aoriste exprime une action antérieure à l’entrée dans les porcs. Une coordination de verbes conjugués restitue naturellement en français la succession des actions.
- source_word: τὰ δαιμόνια
  choice: les démons
  rationale: Le nom grec désigne précisément des démons; ce choix conserve la distinction lexicale avec l’expression « esprits impurs » employée ailleurs.
- source_word: ἀπὸ τοῦ ἀνθρώπου
  choice: de l’homme
  rationale: Avec « sortir », la préposition « de » est naturelle en français et renvoie à l’homme mentionné dans le contexte.
- source_word: εἰσῆλθον εἰς τοὺς χοίρους
  choice: entrèrent dans les porcs
  rationale: Cette formulation rend directement le mouvement vers l’intérieur exprimé par le verbe et la préposition grecs.
- source_word: χοίρους
  choice: porcs
  rationale: « Porcs » est précis, courant et digne dans un récit biblique moderne; « cochons » serait plus familier.
- source_word: ὥρμησεν
  choice: s’élança
  rationale: Le verbe grec décrit un mouvement soudain et impétueux. « S’élança » en conserve la force sans attribuer un motif au troupeau.
- source_word: ἡ ἀγέλη
  choice: le troupeau
  rationale: C’est le terme collectif français usuel et clair pour les animaux concernés.
- source_word: κατὰ τοῦ κρημνοῦ
  choice: du haut de la pente escarpée
  rationale: La préposition avec κρημνός indique un mouvement descendant sur une forte déclivité. La formulation évite d’imposer l’image plus précise d’une falaise verticale tout en rendant clairement la descente.
- source_word: τὴν λίμνην
  choice: le lac
  rationale: λίμνη signifie normalement « lac » et doit rester distinct de θάλασσα, « mer ».
- source_word: ἀπεπνίγη
  choice: se noya
  rationale: Dans ce contexte aquatique, le verbe signifie mourir par noyade. Le singulier grec s’accorde collectivement avec « le troupeau », comme en français.
theological_decisions:
- issue: Désignation des êtres qui quittent l’homme
  choice: les démons
  alternative: les esprits impurs
  rationale: Le texte porte δαιμόνια. Traduire par « démons » respecte sa terminologie propre sans lui substituer une expression apparentée employée ailleurs.
- issue: Degré de précision topographique de κρημνός
  choice: la pente escarpée
  alternative: la falaise / le précipice
  rationale: Le mot évoque une forte déclivité, sans exiger nécessairement une paroi verticale. Le choix retenu préserve cette latitude descriptive.
- issue: Valeur de ἀπεπνίγη
  choice: se noya
  alternative: fut noyé
  rationale: Le contexte indique la noyade du troupeau. Le pronominal français exprime naturellement l’événement sans introduire un agent extérieur, que le grec ne nomme pas.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe demeure fluide tout en conservant l’ordre des événements, le collectif singulier « troupeau » et la sobriété topographique du grec.
