  text: ὁ δὲ Ἰησοῦς εἶπεν· Ἥψατό μού τις, ἐγὼ γὰρ ἔγνων δύναμιν ⸀ἐξεληλυθυῖαν ἀπ’ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/046.yaml
  text: But Jesus said, “Someone touched me, for I knew that power had gone out from me.”
translation:
  language: fr
  text: 'Mais Jésus dit : « Quelqu’un m’a touché, car j’ai reconnu qu’une puissance était sortie de moi. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἥψατό μού
  choice: m’a touché
  rationale: Rend directement le verbe ἅπτομαι avec son complément au génitif, dans un français naturel.
- source_word: ἔγνων
  choice: j’ai su
  rationale: Conserve la valeur cognitive forte de γινώσκω à l’aoriste sans l’atténuer en simple perception.
- source_word: δύναμιν
  choice: une puissance
  rationale: « Puissance » garde la portée active et surnaturelle de δύναμις dans ce contexte.
- source_word: ἐξεληλυθυῖαν ἀπ’ ἐμοῦ
  choice: était sortie de moi
  rationale: Le plus-que-parfait français exprime naturellement l’action antérieure contenue dans le participe parfait grec.
theological_decisions:
- issue: Connaissance de Jésus concernant la puissance sortie de lui
  choice: j’ai su
  alternative: j’ai senti / je me suis rendu compte
  rationale: Le grec ἔγνων indique qu’il l’a connue ou reconnue ; la traduction évite de réduire l’énoncé à une sensation physique tout en ne précisant pas le mode de cette connaissance.
translation_notes:
  register: Français moderne, international et dignifié. La syntaxe reste proche du grec tout en étant idiomatique ; aucune note n’est nécessaire.
