  text: Ἔτι αὐτοῦ λαλοῦντος ἔρχεταί τις παρὰ τοῦ ἀρχισυναγώγου ⸀λέγων ὅτι Τέθνηκεν ἡ θυγάτηρ σου, ⸀μηκέτι σκύλλε τὸν διδάσκαλον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/049.yaml
  text: While he was still speaking[a], someone came from the synagogue leader, saying, “Your daughter has died[b]; do not trouble the teacher any longer.”
translation:
  language: fr
  text: 'Alors qu’il parlait encore, quelqu’un arriva de la part du chef de la synagogue et dit : « Ta fille est morte ; ne dérange plus l’enseignant. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔτι αὐτοῦ λαλοῦντος
  choice: Pendant qu’il parlait encore
  rationale: Le génitif absolu exprime une action simultanée, et ἔτι marque sa continuation. Cette formulation est naturelle en français moderne.
- source_word: ἔρχεταί τις
  choice: quelqu’un arriva
  rationale: Le présent historique grec est rendu au passé simple dans ce récit au passé, tandis que τις reste indéfini.
- source_word: παρὰ τοῦ ἀρχισυναγώγου
  choice: de chez le chef de la synagogue
  rationale: παρά avec le génitif indique ici la provenance. « De chez » exprime naturellement qu’on vient du lieu ou de l’entourage du chef, sans affirmer explicitement que celui-ci a envoyé le messager.
- source_word: λέγων
  choice: et dit
  rationale: La coordination française rend naturellement le participe qui introduit les paroles du messager.
- source_word: Τέθνηκεν ἡ θυγάτηρ σου
  choice: Ta fille est morte
  rationale: 'Le passé composé à valeur résultative rend le parfait grec : la mort a eu lieu et l’état qui en résulte demeure.'
- source_word: μηκέτι σκύλλε
  choice: ne dérange plus
  rationale: Cette tournure rend l’ordre de cesser d’importuner ou de causer du souci, avec la valeur temporelle de μηκέτι.
- source_word: τὸν διδάσκαλον
  choice: le maître
  rationale: Dans ce contexte, « le maître » est une désignation française naturelle d’un enseignant reconnu. Elle évite le terme moderne et institutionnel « professeur ».
theological_decisions:
- issue: Titre ἀρχισυνάγωγος appliqué à Jaïrus
  choice: le chef de la synagogue
  alternative: le responsable de la synagogue
  rationale: Le terme désigne une fonction institutionnelle. « Chef de la synagogue » reste clair, concis et dépourvu de connotations ecclésiastiques ultérieures.
- issue: Désignation de Jésus par διδάσκαλος
  choice: le maître
  alternative: l’enseignant
  rationale: « Le maître » exprime en français le rôle d’enseignant dans une adresse respectueuse, sans transformer le mot grec ordinaire en titre christologique plus appuyé.
translation_notes:
  register: Français international moderne, sobre et digne. Le dialogue demeure direct et pressant. Aucun appel de note n’est nécessaire, car les nuances lexicales peuvent être rendues sans alourdir le verset.
