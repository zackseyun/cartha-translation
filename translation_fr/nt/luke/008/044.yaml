id: LUK.8.44
reference: Luke 8:44
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: προσελθοῦσα ὄπισθεν ἥψατο τοῦ κρασπέδου τοῦ ἱματίου αὐτοῦ, καὶ παραχρῆμα ἔστη ἡ ῥύσις τοῦ αἵματος αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/044.yaml
  text: Coming up behind him[a], she touched the fringe of his garment, and immediately her flow of blood stopped.
translation:
  language: fr
  text: Elle s’approcha par-derrière et toucha la frange[a] de son vêtement. Aussitôt, son écoulement de sang s’arrêta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le bord », « l’ourlet » ou « le gland » de son vêtement.
    reason: 'Alternative lexicale : κράσπεδον possède une gamme de sens et peut éventuellement désigner une frange ou un gland rituel.'
lexical_decisions:
- source_word: προσελθοῦσα ὄπισθεν
  choice: Elle s’approcha par-derrière
  rationale: Le participe aoriste exprime une action qui accompagne et précède le verbe principal, tandis que ὄπισθεν situe l’approche à l’arrière. Cette formulation est naturelle en français et n’ajoute aucun objet absent du grec.
- source_word: ἥψατο
  choice: toucha
  rationale: Dans cette construction, le moyen de ἅπτω signifie couramment « toucher », sans nécessairement impliquer qu’elle saisit le vêtement.
- source_word: τοῦ κρασπέδου
  choice: la frange
  rationale: κράσπεδον peut désigner le bord, l’ourlet ou la frange, éventuellement le gland rituel d’un vêtement juif. « Frange » conserve cette amplitude sans imposer une identification rituelle certaine.
- source_word: τοῦ ἱματίου αὐτοῦ
  choice: de son vêtement
  rationale: ἱμάτιον désigne ici un vêtement, souvent extérieur. Le terme général « vêtement » évite de préciser sans nécessité « manteau » ou « tunique ».
- source_word: παραχρῆμα
  choice: Aussitôt
  rationale: L’adverbe souligne que l’effet se produisit sans délai. « Aussitôt » est direct, actuel et narrativement fluide.
- source_word: ἔστη
  choice: s’arrêta
  rationale: L’aoriste de ἵστημι indique ici que l’écoulement cessa. La tournure pronominale est idiomatique en français.
- source_word: ἡ ῥύσις τοῦ αἵματος αὐτῆς
  choice: son écoulement de sang
  rationale: La formulation garde l’image physiologique explicite du grec et demeure compréhensible, sans réduire la phrase au terme plus interprétatif « hémorragie ».
theological_decisions:
- issue: Possible évocation des franges prescrites aux vêtements juifs dans κράσπεδον
  choice: « la frange » dans le texte principal
  alternative: « le bord », « l’ourlet » ou « le gland »
  rationale: Le mot peut désigner de façon générale l’extrémité du vêtement ou, plus précisément, une frange ou un gland associé à l’habillement juif. Le verset ne rend pas l’allusion rituelle certaine; la note préserve donc les possibilités lexicales sans trancher théologiquement.
translation_notes:
  register: Français international moderne, sobre et digne. Deux phrases rendent clairement la succession des actions et l’immédiateté de la guérison. Le vocabulaire reste proche du grec tout en étant naturel pour un lectorat général.
