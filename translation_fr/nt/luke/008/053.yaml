  text: καὶ κατεγέλων αὐτοῦ, εἰδότες ὅτι ἀπέθανεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/053.yaml
  text: And they were laughing at him, because they knew that she had died.
translation:
  language: fr
  text: Et ils se moquaient de lui, car ils savaient qu’elle était morte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατεγέλων
  choice: se moquaient de
  rationale: L’imparfait exprime une action en cours, tandis que « se moquer de » rend naturellement en français la portée méprisante du verbe.
- source_word: αὐτοῦ
  choice: lui
  rationale: Le génitif désigne la personne tournée en dérision; avec « se moquer de », le français emploie naturellement « lui ».
- source_word: εἰδότες
  choice: car ils savaient
  rationale: Le participe exprime ici la raison de leur réaction. Une proposition introduite par « car » rend clairement ce rapport causal dans un français naturel.
- source_word: ὅτι
  choice: que
  rationale: 'La conjonction introduit le contenu de leur savoir : « qu’elle était morte ».'
- source_word: ἀπέθανεν
  choice: était morte
  rationale: L’aoriste présente la mort comme accomplie. Dans ce contexte, le plus-que-parfait d’état « était morte » exprime naturellement en français le constat qui fonde leur certitude, sans ajouter de nom absent du grec.
theological_decisions:
- issue: Faut-il expliciter l’identité de la personne morte alors que le grec n’emploie aucun nom dans cette proposition?
  choice: Conserver le pronom « elle »
  alternative: « l’enfant était morte » ou « la jeune fille était morte »
  rationale: Le référent féminin ressort clairement du contexte. Le pronom préserve la concision du texte source sans introduire une désignation supplémentaire.
translation_notes:
  register: Français moderne, courant et digne. « Se moquaient de lui » restitue plus nettement la dérision que le simple « riaient de lui ». Aucun marqueur de note n’est nécessaire.
