id: LUK.8.16
reference: Luke 8:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Οὐδεὶς δὲ λύχνον ἅψας καλύπτει αὐτὸν σκεύει ἢ ὑποκάτω κλίνης τίθησιν, ἀλλ’ ἐπὶ λυχνίας ⸀τίθησιν, ἵνα οἱ εἰσπορευόμενοι βλέπωσιν τὸ φῶς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/016.yaml
  text: No one, after lighting a lamp, covers it with a container or puts it under a bed, but puts it on a lampstand, so that those who come in may see the light.
translation:
  language: fr
  text: Personne, après avoir allumé une lampe, ne la couvre d’un récipient ni ne la met sous un lit. Au contraire, il la place sur un porte-lampe, afin que ceux qui entrent voient la lumière.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λύχνον
  choice: une lampe
  rationale: Désigne ici la petite lampe domestique de l’époque; « lampe » est naturel et exact en français moderne.
- source_word: σκεύει
  choice: d’un récipient
  rationale: Le terme est général (« objet, ustensile, récipient »); « récipient » préserve cette généralité sans préciser indûment sa forme.
- source_word: κλίνης
  choice: un lit
  rationale: Équivalent courant et contextuellement clair pour le meuble sous lequel la lampe serait cachée.
- source_word: λυχνίας
  choice: un porte-lampe
  rationale: Désigne le support sur lequel on pose la lampe; « porte-lampe » évite le sens moderne électrique que peut suggérer « lampadaire ».
- source_word: οἱ εἰσπορευόμενοι
  choice: ceux qui entrent
  rationale: Rend directement le participe présent et conserve l’idée des personnes entrant dans le lieu.
theological_decisions:
- issue: Portée proverbiale de l’énoncé
  choice: Conserver l’image concrète sans expliciter son application spirituelle
  alternative: Ajouter une interprétation telle que « la vérité doit être manifestée »
  rationale: Le verset formule l’image de la lampe; son application ressort du contexte et ne doit pas être introduite dans la traduction.
- issue: Sujet des verbes après « personne »
  choice: Employer « on » dans la seconde phrase
  alternative: Répéter « personne » ou utiliser une construction impersonnelle plus littérale
  rationale: 'Cette tournure française naturelle conserve le contraste logique: on ne cache pas une lampe allumée, on la met en évidence.'
translation_notes:
  register: Français international moderne, simple et digne. La coordination grecque est répartie en deux phrases pour une lecture naturelle, sans perte du contraste marqué par ἀλλά. Aucun « maintenant » n’est ajouté pour δέ, qui assure ici une transition légère.
