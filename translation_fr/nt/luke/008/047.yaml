id: LUK.8.47
reference: Luke 8:47
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἰδοῦσα δὲ ἡ γυνὴ ὅτι οὐκ ἔλαθεν τρέμουσα ἦλθεν καὶ προσπεσοῦσα αὐτῷ δι’ ἣν αἰτίαν ἥψατο αὐτοῦ ⸀ἀπήγγειλεν ἐνώπιον παντὸς τοῦ λαοῦ καὶ ὡς ἰάθη παραχρῆμα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/047.yaml
  text: And when the woman saw that she had not escaped notice[a], she came trembling, and falling down before him[b], declared before all the people why she had touched him and how she had been healed immediately.
translation:
  language: fr
  text: Quand la femme vit qu’elle n’était pas passée inaperçue[a], elle vint toute tremblante et, se jetant devant lui[b], déclara devant tout le peuple pourquoi elle l’avait touché et comment elle avait été guérie sur-le-champ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «qu’elle n’avait pas échappé à l’attention» ou «qu’elle n’était pas restée cachée».
    reason: lexical_alternative
  - marker: b
    text: Ou «tombant à ses pieds». Le grec dit littéralement «tombant devant lui», sans mentionner explicitement les pieds.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοῦσα
  choice: Quand ... vit
  rationale: Le participe aoriste introduit la circonstance temporelle de l’action principale; cette tournure est naturelle en français.
- source_word: οὐκ ἔλαθεν
  choice: elle n’était pas passée inaperçue
  rationale: L’expression indique qu’elle comprit que son geste n’était pas resté caché ou n’avait pas échappé à l’attention.
- source_word: τρέμουσα
  choice: toute tremblante
  rationale: Cette formulation conserve l’état physique et émotionnel vivement exprimé par le participe présent.
- source_word: προσπεσοῦσα αὐτῷ
  choice: se jetant devant lui
  rationale: La traduction rend la posture de supplication ou de révérence sans ajouter explicitement les pieds, absents du grec.
- source_word: δι’ ἣν αἰτίαν
  choice: pourquoi
  rationale: Équivalent français direct, concis et actuel de «pour quelle raison».
- source_word: ἥψατο αὐτοῦ
  choice: elle l’avait touché
  rationale: ἅπτομαι avec le génitif signifie ici toucher; le plus-que-parfait situe ce geste avant sa déclaration.
- source_word: ἀπήγγειλεν
  choice: déclara
  rationale: Le verbe désigne le fait de rapporter publiquement; «déclara» convient au contexte solennel sans excès d’interprétation.
- source_word: ἐνώπιον παντὸς τοῦ λαοῦ
  choice: devant tout le peuple
  rationale: Rendu proche du grec, clair et digne; «peuple» préserve λαός plutôt que de le réduire à une simple foule.
- source_word: ὡς ἰάθη
  choice: comment elle avait été guérie
  rationale: «Comment» maintient la valeur de ὡς, tandis que le plus-que-parfait exprime naturellement en français l’antériorité de la guérison par rapport au récit public.
- source_word: παραχρῆμα
  choice: sur-le-champ
  rationale: Cette expression française actuelle et soutenue transmet l’immédiateté soulignée par Luc.
theological_decisions:
- issue: Nature de la déclaration publique de la femme
  choice: Description de sa posture et de sa déclaration sans qualifier explicitement son geste de repentance ou d’adoration
  alternative: Traduire sa démarche comme une confession repentante ou un acte explicite d’adoration
  rationale: Le grec dit qu’elle tremble, se jette devant Jésus et expose publiquement la raison de son geste ainsi que sa guérison. La posture peut suggérer révérence ou supplication, mais le texte ne nomme ni repentance ni adoration.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe narrative reste fluide, les deux repères temporels antérieurs sont explicités par le plus-que-parfait, et les notes conservent les nuances lexicales du grec sans ajout doctrinal.
