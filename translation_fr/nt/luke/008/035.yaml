id: LUK.8.35
reference: Luke 8:35
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐξῆλθον δὲ ἰδεῖν τὸ γεγονὸς καὶ ἦλθον πρὸς τὸν Ἰησοῦν, καὶ εὗρον καθήμενον τὸν ἄνθρωπον ἀφ’ οὗ τὰ δαιμόνια ⸀ἐξῆλθεν ἱματισμένον καὶ σωφρονοῦντα παρὰ τοὺς πόδας τοῦ Ἰησοῦ, καὶ ἐφοβήθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/035.yaml
  text: Then they went out to see what had happened[a], and they came to Jesus and found the man from whom the demons had gone out sitting, clothed, and in his right mind at Jesus's feet[b], and they were afraid.
translation:
  language: fr
  text: Ils sortirent pour voir ce qui s’était passé. Ils vinrent vers Jésus et trouvèrent l’homme dont les démons étaient sortis[a], assis aux pieds de Jésus, vêtu et ayant toute sa raison[b], et ils eurent peur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Certains manuscrits portent un verbe au pluriel (« les démons étaient sortis ») ; le texte imprimé emploie un verbe au singulier avec un sujet pluriel, sans changement de sens.
    reason: textual_variant
  - marker: b
    text: Ou « dans son bon sens ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθον
  choice: ils sortirent
  rationale: L’aoriste décrit le déplacement des gens hors de la ville ou des environs pour constater l’événement; « sortirent » conserve naturellement cette orientation.
- source_word: ἰδεῖν τὸ γεγονός
  choice: pour voir ce qui s’était passé
  rationale: L’infinitif exprime le but, et le participe parfait substantivé désigne l’événement déjà accompli.
- source_word: ἦλθον πρὸς τὸν Ἰησοῦν
  choice: ils vinrent auprès de Jésus
  rationale: πρός avec un verbe de mouvement indique qu’ils se dirigent vers Jésus; cette formulation est naturelle et précise.
- source_word: τὸν ἄνθρωπον
  choice: l’homme
  rationale: Le contexte désigne un individu masculin précis.
- source_word: ἀφ’ οὗ τὰ δαιμόνια ἐξῆλθεν
  choice: dont les démons étaient sortis
  rationale: Le plus-que-parfait situe la sortie des démons avant la découverte de l’homme; le pluriel français rend naturellement le sens malgré le verbe singulier du texte imprimé.
- source_word: δαιμόνια
  choice: démons
  rationale: Équivalent lexical direct qui préserve la dimension personnelle et surnaturelle du récit.
- source_word: καθήμενον … παρὰ τοὺς πόδας τοῦ Ἰησοῦ
  choice: assis aux pieds de Jésus
  rationale: La formulation rend à la fois la posture de l’homme et sa position auprès de Jésus sans expliciter davantage la portée symbolique possible.
- source_word: ἱματισμένον
  choice: vêtu
  rationale: Le participe décrit son état restauré et maintient le contraste contextuel avec sa nudité antérieure.
- source_word: σωφρονοῦντα
  choice: ayant toute sa raison
  rationale: Expression française courante qui communique le retour à un jugement sain et à la maîtrise de soi sans recourir à une catégorie clinique moderne.
- source_word: ἐφοβήθησαν
  choice: ils eurent peur
  rationale: Rendu direct et idiomatique de la réaction de crainte.
theological_decisions:
- issue: Nature des δαιμόνια dans le récit d’exorcisme
  choice: démons
  alternative: esprits mauvais
  rationale: Le récit présente leur expulsion comme un événement réel; « démons » conserve directement cette affirmation sans la réduire à une maladie ou à une métaphore.
- issue: Portée de σωφρονοῦντα après l’exorcisme
  choice: ayant toute sa raison
  alternative: dans son bon sens
  rationale: Ce choix exprime le rétablissement du discernement et de la maîtrise de soi tout en évitant une terminologie psychiatrique anachronique.
- issue: Position aux pieds de Jésus
  choice: assis aux pieds de Jésus
  alternative: assis près des pieds de Jésus
  rationale: La tournure française naturelle préserve la posture, ainsi que son éventuelle connotation de soumission ou de disciple, sans imposer cette interprétation.
translation_notes:
  register: Français international moderne, clair et digne. La longue phrase grecque est divisée pour assurer une lecture naturelle, sans supprimer ses liens narratifs. Les marqueurs de notes sont placés immédiatement après les expressions auxquelles ils se rapportent.
