  - severity: low
    issue: Formulation « vinrent auprès de Jésus »
    rationale: Elle est possible, mais « vinrent vers Jésus » rend plus naturellement le mouvement exprimé par ἦλθον πρὸς τὸν Ἰησοῦν.
