id: LUK.8.3
reference: Luke 8:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ Ἰωάννα γυνὴ Χουζᾶ ἐπιτρόπου Ἡρῴδου καὶ Σουσάννα καὶ ἕτεραι πολλαί, αἵτινες διηκόνουν αὐτοῖς ⸀ἐκ τῶν ὑπαρχόντων αὐταῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/003.yaml
  text: and Joanna[a], the wife of Chuza, Herod’s steward, and Susanna, and many others[b], who were serving them out of their possessions.
translation:
  language: fr
  text: ainsi que Jeanne, femme de Chuza, l’intendant d’Hérode, Suzanne et beaucoup d’autres femmes, qui les servaient[a] en puisant dans leurs biens[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Certains manuscrits portent « le servaient » au lieu de « les servaient ».
    reason: textual_variant
  - marker: b
    text: Ou « au moyen de leurs ressources » ; littéralement « à partir de ce qui leur appartenait ».
    reason: lexical_alternative
lexical_decisions:
- source_word: γυνὴ Χουζᾶ
  choice: femme de Chouza
  rationale: Dans cette apposition suivie du nom d’un homme au génitif, γυνή désigne naturellement l’épouse de Chouza. « Femme de » est idiomatique en français et conserve la sobriété du grec.
- source_word: ἐπιτρόπου
  choice: intendant
  rationale: Le terme désigne une personne chargée d’administrer des affaires ou des biens. « Intendant » convient au contexte de la maison ou de la cour d’Hérode sans coloration ecclésiale.
- source_word: ἕτεραι πολλαί
  choice: beaucoup d’autres femmes
  rationale: Le féminin pluriel renvoie explicitement aux femmes nommées dans le contexte. Répéter « femmes » évite en français toute ambiguïté sur le référent.
- source_word: διηκόνουν
  choice: servaient
  rationale: Le verbe exprime un service concret et suivi. « Servaient » préserve son sens large, tandis que la proposition suivante précise que leurs biens étaient mis à contribution.
- source_word: ἐκ τῶν ὑπαρχόντων αὐταῖς
  choice: en prenant sur leurs propres biens
  rationale: Cette tournure française naturelle rend l’idée d’un service financé au moyen de ce qui leur appartenait personnellement, tout en maintenant la référence concrète aux biens.
- source_word: Ἰωάννα / Χουζᾶ / Σουσάννα
  choice: Jeanne / Chouza / Suzanne
  rationale: Ces formes françaises établies restent immédiatement reconnaissables et conviennent au registre biblique moderne.
theological_decisions:
- issue: Référent et variante textuelle de αὐτοῖς
  choice: 'pluriel : « les servaient », visant Jésus et ceux qui l’accompagnaient'
  alternative: 'singulier : « le servaient », visant Jésus'
  rationale: Le texte grec fourni porte le pluriel αὐτοῖς. La traduction le suit sans écarter la variante singulière, signalée en note.
- issue: Nature du service accompli par les femmes
  choice: conserver le terme général « servaient » et préciser seulement la source matérielle
  alternative: expliciter par « pourvoyaient à leurs besoins » ou employer « exerçaient un ministère »
  rationale: Le grec associe un verbe large de service à une indication sur les ressources employées. La traduction évite aussi bien de réduire tout le service à un financement que d’y importer un sens ecclésial technique.
translation_notes:
  register: Français international moderne, clair et digne. La phrase est rattachée au verset précédent par « ainsi que ». Une nouvelle phrase avant « Elles » allège l’énumération et rend sans ambiguïté le sujet féminin pluriel.
