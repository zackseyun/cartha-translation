  text: καὶ ἐξέστησαν οἱ γονεῖς αὐτῆς· ὁ δὲ παρήγγειλεν αὐτοῖς μηδενὶ εἰπεῖν τὸ γεγονός.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/056.yaml
  text: And her parents were astonished[c][b][a], but he instructed them to tell no one what had happened.
translation:
  language: fr
  text: Ses parents furent bouleversés d’étonnement, mais il leur ordonna de ne dire à personne ce qui était arrivé.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξέστησαν
  choice: furent bouleversés d’étonnement
  rationale: Le verbe exprime ici une réaction d’étonnement intense. Cette formulation française en préserve la force sans suggérer une perte de raison au sens clinique.
- source_word: γονεῖς
  choice: parents
  rationale: Terme français direct et naturel pour désigner le père et la mère.
- source_word: παρήγγειλεν
  choice: ordonna
  rationale: Le verbe marque une directive ayant force d’ordre. « Ordonna » rend clairement cette autorité sans ajouter l’idée d’une réprimande.
- source_word: μηδενὶ
  choice: à personne
  rationale: Avec l’infinitif εἰπεῖν, cette tournure rend naturellement l’interdiction absolue en français.
- source_word: εἰπεῖν
  choice: dire
  rationale: « Ne dire à personne » est une construction française naturelle qui correspond au verbe de parole accompagné de son destinataire.
- source_word: τὸ γεγονός
  choice: ce qui était arrivé
  rationale: Le participe parfait substantivé désigne l’événement accompli; cette formulation est claire et idiomatique.
- source_word: δὲ
  choice: mais
  rationale: La conjonction introduit un léger contraste entre la réaction des parents et la directive de Jésus.
theological_decisions:
- issue: Secret messianique et portée de la directive de Jésus
  choice: Rendre simplement l’ordre de ne dire à personne ce qui était arrivé.
  alternative: Présenter cet ordre comme une consigne de silence strictement publique, temporaire ou explicitement liée au thème du secret messianique.
  rationale: Le verset ne précise ni le motif ni la durée de cette directive. La traduction conserve donc cette indétermination sans y intégrer une interprétation théologique.
translation_notes:
  register: Français international moderne, digne et accessible. « Furent bouleversés d’étonnement » conserve l’intensité de ἐξέστησαν; « ordonna » maintient la force directive de παρήγγειλεν.
