id: LUK.8.19
reference: Luke 8:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸀Παρεγένετο δὲ πρὸς αὐτὸν ἡ μήτηρ καὶ οἱ ἀδελφοὶ αὐτοῦ, καὶ οὐκ ἠδύναντο συντυχεῖν αὐτῷ διὰ τὸν ὄχλον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/019.yaml
  text: Then his mother and his brothers came to him[b][a], but they were not able to reach him because of the crowd.
translation:
  language: fr
  text: Sa mère et ses frères[b] vinrent vers lui, mais ils ne pouvaient pas le rejoindre[a] à cause de la foule.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le rencontrer » ou « parvenir jusqu’à lui ».'
    reason: lexical_alternative
  - marker: b
    text: 'Grec : « frères ». Certains comprennent ce terme au sens plus large de « proches » ou de « membres de la parenté », mais le texte lui-même dit « frères ».'
    reason: alternative_reading
lexical_decisions:
- source_word: Παρεγένετο δὲ
  choice: vinrent alors
  rationale: Le verbe signale l’arrivée de la famille de Jésus, tandis que δέ fait progresser le récit. Le pluriel français s’accorde naturellement avec le sujet composé.
- source_word: πρὸς αὐτὸν
  choice: auprès de lui
  rationale: πρός avec l’accusatif exprime ici le mouvement vers Jésus, sans ajouter le but non explicité de le voir.
- source_word: ἡ μήτηρ καὶ οἱ ἀδελφοὶ αὐτοῦ
  choice: sa mère et ses frères
  rationale: Cette formulation française rend clairement les liens de parenté et conserve le masculin pluriel ἀδελφοί.
- source_word: οὐκ ἠδύναντο
  choice: ils ne pouvaient pas
  rationale: L’imparfait exprime leur incapacité dans la situation décrite.
- source_word: συντυχεῖν αὐτῷ
  choice: le rejoindre
  rationale: Dans le contexte d’une foule faisant obstacle, « le rejoindre » exprime naturellement l’idée d’arriver jusqu’à lui ou d’entrer en contact avec lui, sans suggérer une rencontre formelle.
- source_word: διὰ τὸν ὄχλον
  choice: à cause de la foule
  rationale: διά avec l’accusatif indique ici la cause de leur incapacité.
theological_decisions:
- issue: Identité des « frères » de Jésus
  choice: Traduire littéralement par « ses frères » sans préciser davantage leur lien familial.
  alternative: ses proches / des membres de sa parenté
  rationale: Le grec porte ἀδελφοί, dont le sens ordinaire est « frères ». Le verset ne tranche pas les débats concernant des frères biologiques, des demi-frères, des frères par alliance ou des parents plus éloignés; la traduction ne doit donc pas les résoudre.
translation_notes:
  register: Français international moderne, naturel et digne. « Vinrent » maintient un registre narratif biblique sans archaïsme marqué; « le rejoindre » rend clairement l’obstacle concret que constitue la foule. Les marqueurs suivent immédiatement les expressions concernées.
