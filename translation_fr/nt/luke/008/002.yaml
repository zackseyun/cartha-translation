id: LUK.8.2
reference: Luke 8:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ γυναῖκές τινες αἳ ἦσαν τεθεραπευμέναι ἀπὸ πνευμάτων πονηρῶν καὶ ἀσθενειῶν, Μαρία ἡ καλουμένη Μαγδαληνή, ἀφ’ ἧς δαιμόνια ἑπτὰ ἐξεληλύθει,
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/002.yaml
  text: 'and some women who had been healed from evil spirits and sicknesses: Mary[a], called Magdalene, from whom seven demons had gone out[b],'
translation:
  language: fr
  text: 'Et quelques femmes qui avaient été guéries d’esprits mauvais et de maladies : Marie, appelée Madeleine, dont sept démons étaient sortis,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γυναῖκές τινες
  choice: quelques femmes
  rationale: τινες désigne ici un groupe indéfini. « Quelques femmes » est naturel en français moderne et ne surinterprète pas leur identité.
- source_word: ἦσαν τεθεραπευμέναι
  choice: avaient été guéries
  rationale: La construction périphrastique associe l’imparfait de εἰμί au participe parfait passif et exprime une guérison antérieure dont le résultat demeure.
- source_word: ἀπὸ πνευμάτων πονηρῶν
  choice: d’esprits mauvais
  rationale: Cette formulation rend directement πονηρῶν sans introduire l’idée d’impureté, puisque le grec n’emploie pas ἀκάθαρτος.
- source_word: καὶ ἀσθενειῶν
  choice: et de maladies
  rationale: Dans ce contexte, ἀσθένεια désigne des affections ou maladies corporelles. « Maladies » est clair, courant et distinct des esprits mauvais.
- source_word: ἡ καλουμένη Μαγδαληνή
  choice: appelée Madeleine
  rationale: Le participe καλουμένη introduit le nom distinctif sous lequel Marie était connue. « Madeleine » est la forme française traditionnelle et courante de Μαγδαληνή.
- source_word: ἀφ’ ἧς
  choice: de qui
  rationale: ἀπό marque ici la séparation ou la provenance. « De qui » convient après « étaient sortis » et conserve la relation exprimée par le grec.
- source_word: δαιμόνια ἑπτὰ
  choice: sept démons
  rationale: δαιμόνια désigne précisément des démons, à distinguer du terme plus général πνεύματα employé auparavant.
- source_word: ἐξεληλύθει
  choice: étaient sortis
  rationale: Le plus-que-parfait de ἐξέρχομαι situe leur sortie avant le moment raconté. L’accord pluriel français suit le sujet « sept démons ».
theological_decisions:
- issue: Langage relatif à l’affliction démoniaque
  choice: Conserver les catégories personnelles « esprits mauvais » et « démons »
  alternative: Interpréter ces expressions comme de simples métaphores de troubles psychologiques ou physiques
  rationale: Le grec distingue les esprits mauvais et les démons des maladies. La traduction maintient cette distinction textuelle sans ajouter d’explication doctrinale.
translation_notes:
  register: Français moderne, international et digne. La syntaxe reste liée au verset précédent, comme l’indique le καί initial, rendu par « ainsi que ». La formulation préserve la distinction entre afflictions spirituelles et maladies physiques.
