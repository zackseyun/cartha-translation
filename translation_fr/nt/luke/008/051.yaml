id: LUK.8.51
reference: Luke 8:51
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐλθὼν δὲ εἰς τὴν οἰκίαν οὐκ ἀφῆκεν εἰσελθεῖν ⸂τινα σὺν αὐτῷ⸃ εἰ μὴ Πέτρον καὶ Ἰωάννην καὶ Ἰάκωβον καὶ τὸν πατέρα τῆς παιδὸς καὶ τὴν μητέρα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/051.yaml
  text: When he came into the house[a], he did not allow anyone to enter with him except Peter and John and James, and the girl's father and mother.
translation:
  language: fr
  text: Quand il fut arrivé à la maison, il ne permit à personne d’entrer avec lui, sauf à Pierre, à Jean et à Jacques, ainsi qu’au père et à la mère de la jeune fille.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλθὼν δὲ εἰς τὴν οἰκίαν
  choice: Quand il fut arrivé à la maison
  rationale: Le participe aoriste exprime ici l’antériorité immédiate ou la circonstance temporelle. Cette formulation est naturelle dans un récit soutenu et rend aussi la valeur de δέ sans imposer un « mais » contrastif.
- source_word: οὐκ ἀφῆκεν εἰσελθεῖν
  choice: il ne permit à personne d’entrer
  rationale: ἀφίημι signifie ici permettre. « Ne permit… d’entrer » restitue clairement la construction avec l’infinitif dans un français actuel et digne.
- source_word: τινα σὺν αὐτῷ
  choice: à personne d’entrer avec lui
  rationale: Sous la négation, τινα a une portée indéfinie générale et se traduit naturellement par « personne ». σὺν αὐτῷ se rattache à l’action d’entrer.
- source_word: εἰ μὴ
  choice: sauf à
  rationale: Après une proposition négative, l’expression introduit les personnes exceptées, et non une condition.
- source_word: Πέτρον καὶ Ἰωάννην καὶ Ἰάκωβον
  choice: Pierre, Jean et Jacques
  rationale: Les formes françaises traditionnelles et largement comprises des noms sont retenues. La coordination française naturelle évite de reproduire mécaniquement chaque καί.
- source_word: τῆς παιδὸς
  choice: de la jeune fille
  rationale: παῖς peut désigner un enfant sans préciser le sexe, mais le contexte identifie clairement l’enfant comme la fille de Jaïrus. « Jeune fille » est idiomatique et contextuellement précis.
- source_word: τὸν πατέρα ... καὶ τὴν μητέρα
  choice: au père et à la mère
  rationale: La traduction conserve la mention distincte des deux parents et les articles définis du grec, sans les condenser en « parents ».
theological_decisions:
- issue: Degré de précision de παῖς
  choice: la jeune fille
  alternative: l’enfant
  rationale: Le terme grec peut être générique, mais son référent féminin est explicite dans le contexte immédiat. La traduction précise le sexe sans ajouter d’interprétation doctrinale.
translation_notes:
  register: Français international moderne, narratif et digne. « Permit » maintient un niveau légèrement soutenu sans archaïsme; « sauf à… ainsi qu’à… » clarifie que les cinq personnes constituent les seules exceptions.
