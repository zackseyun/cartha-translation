id: LUK.8.26
reference: Luke 8:26
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ κατέπλευσαν εἰς τὴν χώραν τῶν ⸀Γερασηνῶν, ἥτις ἐστὶν ἀντιπέρα τῆς Γαλιλαίας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/026.yaml
  text: And they sailed down to the region of the Gerasenes, which is opposite Galilee.
translation:
  language: fr
  text: Ils arrivèrent en bateau dans la région des Géraséniens[a], qui se trouve en face de la Galilée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Certains manuscrits et les passages parallèles des Évangiles portent « Gadaréniens » ou « Gergéséniens ».
    reason: textual_variant
lexical_decisions:
- source_word: κατέπλευσαν
  choice: gagnèrent en bateau
  rationale: Le verbe désigne le fait de se rendre par voie d’eau jusqu’à un lieu, avec une possible nuance d’arrivée. « Gagnèrent en bateau » exprime naturellement le déplacement et son moyen sans imposer une direction géographique incertaine.
- source_word: χώραν
  choice: région
  rationale: Le terme désigne ici un territoire ou un district, non un État au sens moderne. « Région » est précis et courant.
- source_word: Γερασηνῶν
  choice: Géraséniens
  rationale: Forme française usuelle de l’ethnique désignant les habitants de Gérasa; le génitif grec dépend de « région ».
- source_word: ἥτις
  choice: qui
  rationale: Le pronom introduit une proposition descriptive dont l’antécédent est « la région ». Le français « qui » restitue ce lien sans lourdeur.
- source_word: ἀντιπέρα
  choice: en face de
  rationale: L’expression situe cette région de l’autre côté, vis-à-vis de la Galilée. « En face de » conserve cette relation spatiale sans explicitation ajoutée.
- source_word: Γαλιλαίας
  choice: la Galilée
  rationale: Forme française consacrée du nom de lieu, employée avec l’article conformément à l’usage.
theological_decisions:
- issue: Variation textuelle et géographique du nom de la région dans la tradition synoptique
  choice: Géraséniens
  alternative: Gadaréniens ou Gergéséniens
  rationale: Le texte principal suit Γερασηνῶν dans le SBLGNT. Les autres noms attestés dans certains manuscrits et dans les passages parallèles sont signalés en note plutôt que d’harmoniser silencieusement les traditions.
translation_notes:
  register: Français international moderne, simple et digne. « Gagnèrent en bateau » est plus idiomatique que le calque « naviguèrent vers » et conserve explicitement le déplacement par voie d’eau. La formulation géographique reste volontairement concise.
