id: LUK.8.18
reference: Luke 8:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: βλέπετε οὖν πῶς ἀκούετε· ὃς ⸂ἂν γὰρ⸃ ἔχῃ, δοθήσεται αὐτῷ, καὶ ὃς ⸀ἂν μὴ ἔχῃ, καὶ ὃ δοκεῖ ἔχειν ἀρθήσεται ἀπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/018.yaml
  text: Therefore[a], pay attention to how you listen. For whoever has, more will be given to him, and whoever does not have, even what he thinks he has will be taken away from him.
translation:
  language: fr
  text: Faites donc attention à la manière dont vous écoutez. Car à celui qui a, il sera donné davantage ; et à celui qui n’a pas, même ce qu’il pense avoir[a] lui sera enlevé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « même ce qu’il semble avoir lui sera enlevé ».'
    reason: δοκέω peut signifier « penser » ou « sembler » ; les deux lectures sont lexicalement possibles.
lexical_decisions:
- source_word: βλέπετε
  choice: Faites attention
  rationale: L’impératif appelle ici à la vigilance et au discernement, non à l’action littérale de voir. Cette expression rend naturellement la force de l’avertissement en français moderne.
- source_word: οὖν
  choice: donc
  rationale: Le terme marque la conséquence à tirer de l’enseignement précédent sur l’écoute et la réceptivité.
- source_word: πῶς ἀκούετε
  choice: à la manière dont vous écoutez
  rationale: πῶς porte sur la qualité ou la manière d’écouter. « Écoutez » exprime mieux qu’« entendez » l’attention active attendue dans ce contexte.
- source_word: ὃς ἂν ... ἔχῃ
  choice: celui qui a
  rationale: La construction relative indéfinie formule un principe général. « Celui qui a » conserve le singulier générique et la portée proverbiale.
- source_word: δοθήσεται αὐτῷ
  choice: il sera donné davantage
  rationale: Le grec ne précise pas l’objet donné, mais le parallélisme implique un accroissement. « Davantage » explicite sobrement cette idée nécessaire en français.
- source_word: ὃς ἂν μὴ ἔχῃ
  choice: celui qui n’a pas
  rationale: Ce choix reproduit la construction générale de la première proposition et maintient nettement l’antithèse.
- source_word: ὃ δοκεῖ ἔχειν
  choice: ce qu’il pense avoir
  rationale: δοκέω peut exprimer soit l’impression extérieure (« sembler »), soit l’opinion du sujet (« penser »). Le texte principal retient la seconde nuance, claire en français, tout en signalant l’autre en note.
- source_word: ἀρθήσεται ἀπ’ αὐτοῦ
  choice: lui sera enlevé
  rationale: Le futur passif exprime ici la privation. Cette tournure est concise et conserve la voix passive du grec.
- source_word: αὐτῷ / αὐτοῦ
  choice: à celui-ci implicitement / lui
  rationale: Les référents masculins singuliers ont une fonction générique. La formulation française les conserve sans ajouter de référent collectif absent du grec.
theological_decisions:
- issue: Portée du paradoxe concernant celui qui a et celui qui n’a pas
  choice: Maintenir le principe proverbial dans son contexte immédiat, celui de la manière d’écouter la parole de Jésus.
  alternative: L’expliciter comme une doctrine de la prédestination, du mérite, de la prospérité matérielle ou comme un principe général de gestion.
  rationale: Le verset relie explicitement ce paradoxe à l’écoute, mais ne définit pas davantage ce qui est possédé ou donné. La traduction préserve cette tension sans imposer un système théologique.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe garde le rythme antithétique et proverbial du grec. Le point-virgule distingue clairement les deux membres parallèles sans alourdir la phrase.
