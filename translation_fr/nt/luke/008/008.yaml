  terminology: Les choix agricoles sont cohérents et précis. « Terre » convient à γῆ dans cette image de semailles, tandis que la note offre utilement « sol ». La répétition d’« entendre » préserve volontairement le jeu verbal du grec et l’effet proverbial de l’exhortation. La note c explique la portée pragmatique de l’expression sans imposer d’interprétation confessionnelle.
