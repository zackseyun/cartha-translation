source:
  edition: SBLGNT
  text: καὶ ἕτερον ἔπεσεν εἰς τὴν γῆν τὴν ἀγαθήν, καὶ φυὲν ἐποίησεν καρπὸν ἑκατονταπλασίονα. ταῦτα λέγων ἐφώνει· Ὁ ἔχων ὦτα ἀκούειν ἀκουέτω.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/008.yaml
  text: And another fell into the good soil[a], and when it grew, it produced fruit a hundredfold. As he said these things, he called out, “He who has ears to hear[c][b], let him hear.”
translation:
  language: fr
  text: 'Une autre graine tomba dans la bonne terre[a] ; après avoir poussé, elle porta du fruit au centuple[b]. En disant cela, il s’écria : « Que celui qui a des oreilles pour entendre entende[c] ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « dans le bon sol ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « elle produisit une récolte cent fois plus abondante ».'
    reason: lexical_alternative
  - marker: c
    text: « Entendre » implique ici d’accueillir attentivement le message, et non seulement de percevoir des sons.
    reason: clarification
lexical_decisions:
- source_word: ἕτερον
  choice: une autre graine
  rationale: Le neutre singulier renvoie implicitement à un autre élément de la semence répandue. L’ajout de « graine » rend ce référent naturel et clair en français sans changer l’image.
- source_word: γῆν τὴν ἀγαθήν
  choice: la bonne terre
  rationale: Dans ce contexte agricole, « terre » désigne le sol cultivable et conserve l’expression française courante « bonne terre ».
- source_word: φυὲν
  choice: après avoir poussé
  rationale: Le participe aoriste indique que la croissance précède la production du fruit ; cette tournure en restitue naturellement la succession.
- source_word: ἐποίησεν καρπὸν ἑκατονταπλασίονα
  choice: elle porta du fruit au centuple
  rationale: « Porter du fruit » est idiomatique en français, tandis que « au centuple » exprime précisément le rendement multiplié par cent sans l’aplatir en simple abondance.
- source_word: ἐφώνει
  choice: il s’écria
  rationale: Le verbe signale une proclamation à voix forte ou insistante. « Il s’écria » garde cette emphase sans imposer l’idée d’un cri de détresse.
- source_word: Ὁ ἔχων ὦτα ἀκούειν ἀκουέτω
  choice: Que celui qui a des oreilles pour entendre entende !
  rationale: La construction française conserve le singulier représentatif, la finalité exprimée par l’infinitif et la force exhortative de l’impératif grec.
theological_decisions:
- issue: Portée représentative de Ὁ ἔχων
  choice: celui qui a des oreilles
  alternative: quiconque a des oreilles
  rationale: Le masculin grammatical français ne limite pas l’appel aux hommes ; « celui qui » conserve plus directement la construction singulière et solennelle du grec.
- issue: Force de ἀκουέτω
  choice: Que … entende !
  alternative: doit écouter
  rationale: Le subjonctif exhortatif français rend l’impératif grec sans le réduire à une simple affirmation d’obligation ; « entendre » maintient aussi le lien verbal avec « oreilles pour entendre ».
translation_notes:
  register: Français international actuel, digne et accessible. La phrase conserve le mouvement narratif, puis l’intensification de la proclamation de Jésus. « Au centuple » appartient au registre courant soigné et préserve la précision de l’image agricole.
