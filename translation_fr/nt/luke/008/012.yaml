id: LUK.8.12
reference: Luke 8:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οἱ δὲ παρὰ τὴν ὁδόν εἰσιν οἱ ⸀ἀκούσαντες, εἶτα ἔρχεται ὁ διάβολος καὶ αἴρει τὸν λόγον ἀπὸ τῆς καρδίας αὐτῶν, ἵνα μὴ πιστεύσαντες σωθῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/012.yaml
  text: And those beside the road are the ones who have heard[a]; then the devil comes and takes away the word from their hearts[b], so that they may not believe and be saved.
translation:
  language: fr
  text: Ceux qui sont au bord du chemin, ce sont ceux qui ont entendu. Ensuite, le diable vient et enlève la parole de leur cœur, afin qu’ils ne croient pas et ne soient pas sauvés.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « de peur qu’ils ne croient et ne soient sauvés ».'
    reason: Variante française possible pour rendre la construction grecque ἵνα μή, qui exprime ici le but négatif.
lexical_decisions:
- source_word: παρὰ τὴν ὁδόν
  choice: au bord du chemin
  rationale: Cette formulation spatiale naturelle conserve l’image des graines tombées le long de la voie, sans archaïsme.
- source_word: ἀκούσαντες
  choice: ont entendu
  rationale: Le participe aoriste désigne ceux qui ont entendu le message; le passé composé convient naturellement à l’explication de la parabole.
- source_word: εἶτα
  choice: ensuite
  rationale: Le terme marque simplement l’action qui suit.
- source_word: ὁ διάβολος
  choice: le diable
  rationale: Dans ce contexte, il s’agit de l’être personnel mauvais; « le diable » est l’équivalent français usuel et clair.
- source_word: αἴρει
  choice: enlève
  rationale: Le verbe signifie ici retirer ou emporter; « enlève » exprime cette action sans préciser abusivement sa manière.
- source_word: τὸν λόγον
  choice: la parole
  rationale: Dans l’interprétation de la parabole, il s’agit de la parole de Dieu proclamée. « La parole » conserve l’expression biblique et le contexte en précise le sens.
- source_word: ἀπὸ τῆς καρδίας αὐτῶν
  choice: de leur cœur
  rationale: Le grec emploie « cœur » au singulier avec un possesseur pluriel. Le français distributif « leur cœur » est naturel et désigne le centre intérieur de chaque personne.
- source_word: ἵνα μὴ πιστεύσαντες σωθῶσιν
  choice: afin qu’ils ne croient pas et ne soient pas sauvés
  rationale: La construction exprime le but visé par l’action du diable. La coordination française rend naturellement le participe suivi du verbe conjugué, sans imposer une relation théologique plus précise que le grec.
- source_word: πιστεύσαντες
  choice: croient
  rationale: « Croire » est l’équivalent direct et courant de πιστεύω dans ce contexte.
- source_word: σωθῶσιν
  choice: soient sauvés
  rationale: Dans ce contexte lucanien, le passif renvoie au salut au sens rédempteur; « être sauvés » en est la formulation française établie.
theological_decisions:
- issue: Rapport entre la foi et le salut
  choice: « afin qu’ils ne croient pas et ne soient pas sauvés »
  alternative: Des formulations interprétatives précisant une causalité doctrinale, la persévérance, l’appel efficace ou une simple adhésion intellectuelle
  rationale: 'Le texte présente le but du retrait de la parole: empêcher la foi et le salut. La traduction maintient ce rapport sans trancher les débats confessionnels plus larges.'
- issue: Valeur de ἵνα μή
  choice: But exprimé par « afin que… ne… pas »
  alternative: Résultat rendu par « de sorte qu’ils ne… »
  rationale: Le contexte attribue au diable une action orientée vers l’empêchement de la foi et du salut; « afin que » restitue cette orientation tout en laissant intacte la tension du texte.
translation_notes:
  register: Français international moderne, clair et digne. « Au bord du chemin » est idiomatique; « la parole » conserve le vocabulaire biblique sans obscurcir le sens; la syntaxe reste accessible tout en suivant étroitement le grec.
