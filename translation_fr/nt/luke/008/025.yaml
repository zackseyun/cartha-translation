source:
  edition: SBLGNT
  text: εἶπεν δὲ αὐτοῖς· ⸀Ποῦ ἡ πίστις ὑμῶν; φοβηθέντες δὲ ἐθαύμασαν, λέγοντες πρὸς ἀλλήλους· Τίς ἄρα οὗτός ἐστιν ὅτι καὶ τοῖς ἀνέμοις ἐπιτάσσει καὶ τῷ ὕδατι, καὶ ὑπακούουσιν αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/025.yaml
  text: Then he said to them[a], “Where is your faith?” And being afraid, they marveled, saying to one another, “Who then is this, that he commands even the winds and the water, and they obey him?”
translation:
  language: fr
  text: 'Puis il leur dit : « Où est votre foi[a] ? » Saisis de crainte, ils s’étonnèrent et se dirent les uns aux autres : « Qui est donc celui-ci, qui donne des ordres même aux vents et à l’eau, et ils lui obéissent ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « confiance ». La question de Jésus peut aussi se comprendre ainsi : « Où est votre confiance ? »'
    reason: Alternative lexicale contextuelle pour πίστις.
lexical_decisions:
- source_word: Ποῦ
  choice: Où
  rationale: L’adverbe interroge directement sur la présence ou la manifestation de leur foi, sans développer la question en « Pourquoi n’avez-vous pas de foi ? ».
- source_word: πίστις
  choice: foi
  rationale: « Foi » est le correspondant français usuel et conserve l’étendue du terme grec; dans ce contexte, il comporte la nuance concrète de confiance.
- source_word: φοβηθέντες
  choice: Saisis de crainte
  rationale: Cette tournure rend naturellement le participe circonstanciel et la réaction de peur, sans préciser une intensité absente du texte.
- source_word: ἐθαύμασαν
  choice: ils furent dans l’émerveillement
  rationale: La formulation exprime leur profond étonnement tout en restant distincte de leur crainte.
- source_word: Τίς ἄρα οὗτός ἐστιν
  choice: Qui est donc celui-ci ?
  rationale: « Donc » restitue la valeur inférentielle de ἄρα, tandis que « celui-ci » garde la désignation directe de οὗτός.
- source_word: ἐπιτάσσει
  choice: Il donne des ordres
  rationale: Cette expression actuelle et directe rend l’idée d’ordonner avec autorité, sans importer le verbe « réprimander » du verset précédent.
- source_word: τοῖς ἀνέμοις ... καὶ τῷ ὕδατι
  choice: aux vents et à l’eau
  rationale: La traduction suit précisément les pluriel et singulier grecs, sans substituer « vagues » ou « mer » à « eau ».
- source_word: ὑπακούουσιν αὐτῷ
  choice: ils lui obéissent
  rationale: « Obéir » rend clairement la soumission des éléments personnifiés à l’ordre donné.
theological_decisions:
- issue: Sens de πίστις dans la question adressée aux disciples
  choice: foi
  alternative: confiance
  rationale: « Foi » préserve le terme théologique large et traditionnel sans exclure la nuance contextuelle de confiance en Jésus; cette nuance est signalée en note plutôt qu’imposée dans le texte.
translation_notes:
  register: Français international moderne, digne et accessible. La ponctuation française est respectée. La coordination grecque finale est rendue en deux phrases dans la parole citée afin d’éviter une construction française lourde, tout en conservant le lien logique entre le commandement et l’obéissance.
