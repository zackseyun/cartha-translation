  text: Ἔστιν δὲ αὕτη ἡ παραβολή· Ὁ σπόρος ἐστὶν ὁ λόγος τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/011.yaml
  text: 'This is the parable: the seed is the word of God[a].'
translation:
  language: fr
  text: 'Voici la parabole : la semence, c’est la parole de Dieu.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Voici ce que signifie la parabole. »'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔστιν δὲ αὕτη ἡ παραβολή
  choice: Voici ce que signifie la parabole
  rationale: Dans ce contexte explicatif, cette tournure française rend naturellement la fonction de la copule et la légère transition marquée par δέ. Une note conserve la formulation grecque plus littérale.
- source_word: Ὁ σπόρος
  choice: la semence
  rationale: « Semence » garde le singulier collectif et l’image agricole, dans un registre biblique actuel et compréhensible.
- source_word: ὁ λόγος
  choice: la parole
  rationale: « Parole » exprime ici la communication divine tout en préservant les résonances bibliques de λόγος; « message » serait plus explicatif.
- source_word: τοῦ θεοῦ
  choice: de Dieu
  rationale: Le génitif est rendu directement par « de Dieu », sans préciser de manière interprétative « venant de Dieu ».
theological_decisions:
- issue: Faut-il traduire littéralement « telle est la parabole » ou expliciter qu’il s’agit de son sens?
  choice: Voici ce que signifie la parabole
  alternative: Voici la parabole
  rationale: Le contexte montre que Jésus commence l’interprétation. La traduction principale privilégie un français naturel, tandis que la note préserve la formulation littérale et l’ambiguïté formelle du grec.
translation_notes:
  register: Français international moderne, naturel et digne. La dislocation « la semence, c’est… » rend clairement l’identification emphatique du grec sans alourdir la phrase.
