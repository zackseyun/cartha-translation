- from: Pendant qu’ils naviguaient, il s’endormit. Une violente bourrasque descendit sur le lac. La barque se remplissait d’eau[a], et ils étaient en danger.
  to: Pendant qu’ils naviguaient, il s’endormit. Une violente tempête de vent descendit sur le lac, et ils étaient envahis par l’eau[a] et en danger.
  rationale: La révision maintient les aspectsifs (action de fond, entrée dans le sommeil et danger en cours), rend plus précisément la tempête de vent, et préserve dans le texte comme dans la note l’expression plurielle et l’ambiguïté de συνεπληροῦντο, sans imposer grammaticalement la barque comme sujet.
