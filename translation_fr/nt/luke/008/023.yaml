  text: πλεόντων δὲ αὐτῶν ἀφύπνωσεν. καὶ κατέβη λαῖλαψ ἀνέμου εἰς τὴν λίμνην, καὶ συνεπληροῦντο καὶ ἐκινδύνευον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/023.yaml
  text: And as they were sailing[a], he fell asleep. And a windstorm came down on the lake, and they were being swamped and were in danger.
translation:
  language: fr
  text: Pendant qu’ils naviguaient, il s’endormit. Une violente tempête de vent descendit sur le lac, et ils étaient envahis par l’eau[a] et en danger.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ils se remplissaient »; le grec emploie un verbe au pluriel et peut évoquer les personnes à bord submergées ou, implicitement, leur barque qui se remplissait d’eau.'
    reason: Le verbe grec συνεπληροῦντο est au pluriel et son objet ou complément n’est pas exprimé; la note conserve l’ambiguïté tout en indiquant le sens contextuel probable.
lexical_decisions:
- source_word: πλεόντων δὲ αὐτῶν
  choice: Pendant qu’ils naviguaient
  rationale: Le génitif absolu avec participe présent décrit une action en cours servant d’arrière-plan; cette formulation en rend naturellement la simultanéité.
- source_word: ἀφύπνωσεν
  choice: il s’endormit
  rationale: L’aoriste présente ici l’entrée dans le sommeil. Le sujet, Jésus, ressort clairement du contexte.
- source_word: κατέβη
  choice: descendit
  rationale: Le verbe conserve l’image d’un vent qui descend soudainement sur le lac.
- source_word: λαῖλαψ ἀνέμου
  choice: une violente bourrasque
  rationale: λαῖλαψ désigne une tempête soudaine et violente, tandis que ἀνέμου précise qu’elle est causée par le vent. « Bourrasque » est naturel dans ce contexte nautique.
- source_word: εἰς τὴν λίμνην
  choice: sur le lac
  rationale: Avec un phénomène météorologique qui « descend », le français idiomatique emploie « sur », sans perdre l’image spatiale du grec.
- source_word: συνεπληροῦντο
  choice: La barque se remplissait d’eau
  rationale: Le pluriel grec renvoie aux personnes embarquées comme collectivement atteintes par l’envahissement de leur embarcation. La formulation explicite le sens implicite et décrit l’action progressive de l’imparfait.
- source_word: ἐκινδύνευον
  choice: ils étaient en danger
  rationale: Cette expression claire et courante restitue l’état de danger continu exprimé par l’imparfait.
