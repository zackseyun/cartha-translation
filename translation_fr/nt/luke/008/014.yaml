id: LUK.8.14
reference: Luke 8:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τὸ δὲ εἰς τὰς ἀκάνθας πεσόν, οὗτοί εἰσιν οἱ ἀκούσαντες, καὶ ὑπὸ μεριμνῶν καὶ πλούτου καὶ ἡδονῶν τοῦ βίου πορευόμενοι συμπνίγονται καὶ οὐ τελεσφοροῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/014.yaml
  text: And the one that fell among the thorns—these are those who have heard[a], but as they go on their way they are choked by the cares and riches and pleasures of life[b], and they do not bear fruit to maturity.
translation:
  language: fr
  text: Ce qui est tombé parmi les épines, ce sont ceux qui ont entendu ; mais, chemin faisant, ils sont étouffés par les préoccupations[a], les richesses et les plaisirs de la vie, et ils ne portent pas de fruit qui parvienne à maturité[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les soucis » ou « les inquiétudes ».
    reason: lexical_alternative
  - marker: b
    text: Ou « ils ne produisent pas de fruit mûr » ou « ils ne mènent pas leur fruit à maturité ».
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ ... πεσόν
  choice: Ce qui est tombé
  rationale: Le participe substantivé neutre renvoie à ce qui a été semé sans ajouter explicitement le nom « semence », absent de cette proposition.
- source_word: εἰς τὰς ἀκάνθας
  choice: parmi les épines
  rationale: Cette formulation naturelle conserve l’image végétale de la parabole et la valeur contextuelle de la préposition.
- source_word: οὗτοί εἰσιν οἱ ἀκούσαντες
  choice: ce sont ceux qui ont entendu
  rationale: Le passé composé rend naturellement en français l’aoriste participial désignant ceux qui ont effectivement entendu.
- source_word: ὑπὸ μεριμνῶν
  choice: par les préoccupations
  rationale: « Préoccupations » exprime la gamme de μέριμνα — soucis, inquiétudes, préoccupations — dans un registre actuel et digne.
- source_word: πλούτου
  choice: les richesses
  rationale: Le pluriel français est idiomatique et rend ici l’abondance matérielle évoquée par le singulier collectif grec.
- source_word: ἡδονῶν τοῦ βίου
  choice: les plaisirs de la vie
  rationale: La traduction garde le rapport génitival et comprend βίος comme la vie humaine ordinaire, sans lui donner le sens théologique de vie éternelle.
- source_word: πορευόμενοι
  choice: chemin faisant
  rationale: Cette expression concise restitue le processus continu de πορεύομαι et son image de progression, sans expliciter davantage qu’il ne le faut une métaphore de toute l’existence.
- source_word: συμπνίγονται
  choice: ils sont étouffés
  rationale: Le passif et l’image agricole forte sont conservés.
- source_word: οὐ τελεσφοροῦσιν
  choice: ils ne portent pas de fruit jusqu’à maturité
  rationale: Cette formulation maintient à la fois la métaphore du fruit et l’idée d’un développement qui n’arrive pas à son plein terme.
theological_decisions:
- issue: Nature de l’échec des auditeurs comparés au sol épineux
  choice: Conserver l’image de personnes étouffées qui ne portent pas de fruit jusqu’à maturité.
  alternative: Préciser qu’il s’agit soit de personnes jamais véritablement converties, soit de croyants devenus stériles, soit de personnes ayant abandonné la foi.
  rationale: Le verset décrit leur écoute et leur absence de fruit mûr, mais ne tranche pas explicitement les débats ultérieurs sur la conversion, l’apostasie ou la persévérance.
translation_notes:
  register: Français international moderne, naturel et digne. « Chemin faisant » conserve le mouvement continu du grec tout en évitant une paraphrase lourde; le vocabulaire agricole reste perceptible dans « étouffés » et « fruit jusqu’à maturité ».
