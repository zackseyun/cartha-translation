id: LUK.8.13
reference: Luke 8:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οἱ δὲ ἐπὶ τῆς πέτρας οἳ ὅταν ἀκούσωσιν μετὰ χαρᾶς δέχονται τὸν λόγον, καὶ οὗτοι ῥίζαν οὐκ ἔχουσιν, οἳ πρὸς καιρὸν πιστεύουσιν καὶ ἐν καιρῷ πειρασμοῦ ἀφίστανται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/013.yaml
  text: And the ones on the rock are those who[a], when they hear, receive the word with joy. But these have no root; they believe for a time, and in a time of testing they fall away.
translation:
  language: fr
  text: 'Ceux qui sont sur le rocher, ce sont ceux qui, lorsqu’ils entendent, accueillent la parole avec joie. Mais ils n’ont pas de racine : ils croient pour un temps et, au temps de l’épreuve[a], ils se détournent.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de la mise à l’épreuve » ou « de la tentation ». Le terme grec peut désigner une épreuve, une mise à l’épreuve ou une tentation selon le contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὶ τῆς πέτρας
  choice: sur le rocher
  rationale: Rend directement l’image concrète et singulière de πέτρα sans expliciter « terrain rocheux », que le grec n’énonce pas ici.
- source_word: ὅταν ἀκούσωσιν
  choice: après avoir entendu
  rationale: Exprime naturellement en français l’antériorité immédiate de l’écoute par rapport à l’accueil, dans cette description générale.
- source_word: μετὰ χαρᾶς
  choice: avec joie
  rationale: Équivalent direct, naturel et digne de la locution grecque.
- source_word: δέχονται τὸν λόγον
  choice: accueillent la parole
  rationale: « Accueillir » communique ici une réception favorable, tandis que « la parole » conserve l’idiome biblique et le lien avec le message proclamé.
- source_word: ῥίζαν οὐκ ἔχουσιν
  choice: ils n’ont pas de racine
  rationale: Conserve le singulier grec et la métaphore végétale sous une forme française naturelle.
- source_word: πρὸς καιρὸν
  choice: pour un temps
  rationale: Rend la durée limitée sans préciser davantage sa longueur.
- source_word: πιστεύουσιν
  choice: ils croient
  rationale: Équivalent direct qui ne tranche pas la question théologique de la nature de cette foi temporaire.
- source_word: ἐν καιρῷ πειρασμοῦ
  choice: au temps de l’épreuve
  rationale: Conserve la construction temporelle et traduit πειρασμός par un terme assez large pour inclure mise à l’épreuve, difficulté et pression, avec les autres possibilités signalées en note.
- source_word: ἀφίστανται
  choice: ils se détournent
  rationale: Exprime l’abandon de la position antérieure sans recourir au terme technique « apostasient » ni ajouter l’image absente du grec que pourrait suggérer « tombent ».
theological_decisions:
- issue: Nature de la foi exprimée par πιστεύουσιν
  choice: « ils croient »
  alternative: « ils semblent croire », « leur foi est superficielle » ou une formulation affirmant explicitement une foi salvatrice
  rationale: Le verset affirme une croyance temporaire suivie d’un éloignement, mais ne définit pas lui-même cette foi selon les catégories des débats ultérieurs sur le salut et la persévérance.
- issue: Portée de πειρασμός
  choice: « épreuve » dans le texte, avec variantes en note
  alternative: « tentation » ou « mise à l’épreuve »
  rationale: Le mot grec peut désigner l’épreuve, la mise à l’épreuve ou la tentation. « Épreuve » convient au contexte sans limiter le référent à une sollicitation intérieure au mal.
- issue: Force de ἀφίστανται
  choice: « ils se détournent »
  alternative: « ils s’éloignent », « ils abandonnent » ou « ils apostasient »
  rationale: La traduction retenue préserve la gravité d’un abandon de la croyance antérieure sans imposer un vocabulaire doctrinal technique.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe conserve le mouvement explicatif de la parabole, le contraste introduit par « mais » et l’ambiguïté théologique du texte grec.
