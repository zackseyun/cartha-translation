revisions:
- from: Car il avait ordonné à l’esprit impur de sortir de cet homme. En effet, à maintes reprises[a], l’esprit s’était emparé de lui. On l’attachait avec des chaînes et des entraves, et on le gardait sous surveillance, mais il rompait ses liens et le démon le poussait vers des lieux déserts[b].
  to: Car il avait ordonné à l’esprit impur de sortir de cet homme. Depuis longtemps[a], en effet, l’esprit s’était emparé de lui. On l’attachait avec des chaînes et des entraves, et on le gardait sous surveillance ; rompant ses liens, il était entraîné par le démon vers des lieux déserts[b].
  rationale: La révision remet au premier plan la valeur durative de πολλοῖς χρόνοις, tout en préservant en note l’autre compréhension possible. Elle supprime l’opposition interprétative introduite par « mais » et rend plus directement la relation participiale et passive de διαρρήσσων… ἠλαύνετο ὑπὸ τοῦ δαιμονίου.
