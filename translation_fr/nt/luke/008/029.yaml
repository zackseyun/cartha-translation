id: LUK.8.29
reference: Luke 8:29
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸀παρήγγελλεν γὰρ τῷ πνεύματι τῷ ἀκαθάρτῳ ἐξελθεῖν ἀπὸ τοῦ ἀνθρώπου. πολλοῖς γὰρ χρόνοις συνηρπάκει αὐτόν, καὶ ⸀ἐδεσμεύετο ἁλύσεσιν καὶ πέδαις φυλασσόμενος, καὶ διαρρήσσων τὰ δεσμὰ ἠλαύνετο ⸀ὑπὸ τοῦ ⸀δαιμονίου εἰς τὰς ἐρήμους.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/029.yaml
  text: For he had commanded the unclean spirit to come out of the man[a]. For many times it had seized him, and he was kept bound with chains and shackles, being guarded, and breaking the bonds[c][b], he was driven by the demon into the desolate places.
translation:
  language: fr
  text: Car il avait ordonné à l’esprit impur de sortir de cet homme. Depuis longtemps[a], en effet, l’esprit s’était emparé de lui. On l’attachait avec des chaînes et des entraves, et on le gardait sous surveillance ; rompant ses liens, il était entraîné par le démon vers des lieux déserts[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à maintes reprises ». L’expression grecque peut évoquer des épisodes répétés, mais elle désigne plus naturellement une longue durée dans ce contexte.
    reason: lexical_alternative
  - marker: b
    text: Ou « vers les régions désertiques ». Le grec emploie le pluriel et désigne des endroits inhabités.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρήγγελλεν
  choice: il avait ordonné
  rationale: 'Le plus-que-parfait rend naturellement en français la valeur d’arrière-plan de l’imparfait grec dans cette explication introduite par γάρ : l’ordre de Jésus précède la réaction racontée au verset précédent.'
- source_word: πνεύματι τῷ ἀκαθάρτῳ
  choice: à l’esprit impur
  rationale: « Esprit impur » est l’expression française courante et conserve le lien lexical avec l’impureté exprimée par ἀκάθαρτος.
- source_word: ἐξελθεῖν ἀπὸ τοῦ ἀνθρώπου
  choice: de sortir de cet homme
  rationale: Formulation française naturelle qui préserve le mouvement de sortie exprimé par ἐκ et ἀπό ; « cet homme » identifie naturellement le personnage déjà présent dans le récit.
- source_word: πολλοῖς χρόνοις
  choice: à maintes reprises
  rationale: Le pluriel et le contexte des saisies et des entraves répétées favorisent une lecture itérative, tout en signalant en note la lecture durative possible.
- source_word: συνηρπάκει αὐτόν
  choice: l’esprit s’était emparé de lui
  rationale: « S’emparer de » exprime la prise de contrôle violente de συναρπάζω. La répétition explicite de « l’esprit » évite en français une ambiguïté de pronom.
- source_word: ἐδεσμεύετο ἁλύσεσιν καὶ πέδαις
  choice: on l’attachait avec des chaînes et des entraves
  rationale: L’imparfait et le passif suggèrent une action humaine répétée. « Chaînes » et « entraves » distinguent les deux moyens de contention sans employer un vocabulaire archaïque.
- source_word: φυλασσόμενος
  choice: on le gardait sous surveillance
  rationale: Cette tournure explicite clairement la circonstance exprimée par le participe et reste naturelle en français moderne.
- source_word: διαρρήσσων τὰ δεσμὰ
  choice: il rompait ses liens
  rationale: L’imparfait restitue la répétition implicite ; « liens » garde la portée générale de δεσμά après la mention plus précise des chaînes et des entraves.
- source_word: ἠλαύνετο ὑπὸ τοῦ δαιμονίου
  choice: le démon le poussait
  rationale: La tournure active est plus fluide en français tout en conservant le démon comme agent et l’homme comme objet d’une contrainte répétée.
- source_word: εἰς τὰς ἐρήμους
  choice: vers des lieux déserts
  rationale: « Vers » rend le mouvement de εἰς, tandis que le pluriel « des lieux déserts » respecte le pluriel grec sans imposer un type précis de terrain.
theological_decisions:
- issue: Terminologie relative aux êtres démoniaques
  choice: Rendre directement πνεῦμα ἀκάθαρτον par « esprit impur » et δαιμόνιον par « démon ».
  alternative: « esprit mauvais » ou une reformulation psychologique
  rationale: Le récit présente une puissance spirituelle personnelle qui saisit et pousse l’homme. La traduction conserve cette représentation sans l’atténuer ni ajouter une interprétation doctrinale.
- issue: Agent de l’ordre initial
  choice: Conserver le pronom « il », dont le référent est Jésus dans le contexte.
  alternative: Ajouter explicitement « Jésus »
  rationale: Le grec n’énonce pas ici le nom de Jésus. Le pronom préserve la cohésion avec le contexte immédiat sans ajouter un élément absent du verset.
translation_notes:
  register: Français international moderne, narratif et digne. Les imparfaits rendent les actions habituelles ou répétées ; le plus-que-parfait situe l’ordre de Jésus en arrière-plan. « Mais » explicite le contraste naturel entre la surveillance et la rupture des liens, bien que le grec emploie une simple coordination.
