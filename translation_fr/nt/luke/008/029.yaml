review_pass:
  verdict: revise
  source_fidelity: Révision nécessaire. πολλοῖς χρόνοις exprime le plus naturellement une durée étendue (« depuis longtemps ») dans ce contexte; la lecture itérative demeure possible et peut être signalée en note. La coordination finale doit aussi éviter d’ajouter une opposition absente de καί, tout en maintenant l’homme comme sujet de « rompant ses liens » et le démon comme agent de son entraînement.
  naturalness: Le texte révisé reste idiomatique en français international moderne. « Depuis longtemps, en effet » rend naturellement la proposition explicative, et « rompant ses liens, il était entraîné » restitue avec fluidité le participe grec et la voix passive.
  terminology: « Esprit impur » et « démon » sont des rendus directs, cohérents et non interprétatifs de πνεῦμα ἀκάθαρτον et δαιμόνιον. « Chaînes et entraves » ainsi que « lieux déserts » sont précis et de registre courant.
  issues:
  - severity: medium
    issue: « à maintes reprises » est placé comme sens principal de πολλοῖς χρόνοις.
    rationale: Le datif pluriel avec χρόνοις désigne naturellement une durée (« depuis longtemps »). Une nuance itérative peut être envisagée contextuellement, mais ne devrait pas remplacer le sens duratif comme rendu principal.
  - severity: low
    issue: « mais » ajoute une opposition à la coordination finale.
    rationale: Le grec porte καί (« et »), sans particule adversative. La rupture des liens est présentée par un participe, en lien avec le fait qu’il était entraîné par le démon.
  revised_text: Car il avait ordonné à l’esprit impur de sortir de cet homme. Depuis longtemps[a], en effet, l’esprit s’était emparé de lui. On l’attachait avec des chaînes et des entraves, et on le gardait sous surveillance ; rompant ses liens, il était entraîné par le démon vers des lieux déserts[b].
