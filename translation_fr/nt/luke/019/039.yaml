id: LUK.19.39
reference: Luke 19:39
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καί τινες τῶν Φαρισαίων ἀπὸ τοῦ ὄχλου εἶπαν πρὸς αὐτόν· Διδάσκαλε, ἐπιτίμησον τοῖς μαθηταῖς σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/039.yaml
  text: And some of the Pharisees from the crowd said to him[a], “Teacher[b], rebuke your disciples.”
translation:
  language: fr
  text: 'Quelques pharisiens qui se trouvaient dans la foule lui dirent : « Maître, reprends tes disciples. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τινες τῶν Φαρισαίων
  choice: Quelques pharisiens
  rationale: Le pronom indéfini avec le génitif partitif désigne un sous-ensemble non précisé des pharisiens. Cette formulation est naturelle en français et conserve la portée partitive.
- source_word: ἀπὸ τοῦ ὄχλου
  choice: qui se trouvaient dans la foule
  rationale: ἀπό indique ici la provenance ou la position des pharisiens au sein de la foule. Une proposition relative évite l'ambiguïté de « de la foule », qui pourrait laisser croire qu'ils s'en éloignaient ou qu'ils appartenaient eux-mêmes au peuple indistinctement.
- source_word: εἶπαν πρὸς αὐτόν
  choice: lui dirent
  rationale: Formule narrative française simple et directe correspondant naturellement à λέγω avec πρός et l'accusatif.
- source_word: Διδάσκαλε
  choice: Maître
  rationale: Dans l'usage français courant des Évangiles, « Maître » désigne naturellement celui qui enseigne et fonctionne bien comme terme d'adresse respectueux, sans imposer ici une affirmation christologique supplémentaire.
- source_word: ἐπιτίμησον
  choice: reprends
  rationale: L'impératif demande une réprimande verbale énergique. « Reprends » conserve cette idée sans ajouter explicitement le résultat interprétatif « fais taire ».
- source_word: τοῖς μαθηταῖς σου
  choice: tes disciples
  rationale: « Disciples » préserve la relation d'apprentissage exprimée par μαθητής et son usage établi dans le contexte évangélique.
theological_decisions:
- issue: Portée du titre Διδάσκαλε adressé à Jésus
  choice: Maître
  alternative: Enseignant
  rationale: « Maître » est en français un titre d'adresse pédagogique naturel dans ce contexte. Il ne faut pas lui faire porter à lui seul un sens christologique plus fort que celui qu'impose le grec.
translation_notes:
  register: Français international moderne, narratif et digne. La proposition « qui se trouvaient dans la foule » explicite uniquement la relation syntaxique probable de ἀπὸ τοῦ ὄχλου sans modifier l'action rapportée.
