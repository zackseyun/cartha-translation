  text: καὶ προδραμὼν ⸂εἰς τὸ⸃ ἔμπροσθεν ἀνέβη ἐπὶ συκομορέαν ἵνα ἴδῃ αὐτόν, ὅτι ἐκείνης ἤμελλεν διέρχεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/004.yaml
  text: So he ran on ahead and climbed up into a sycamore tree so that he might see him[a], because he was about to pass that way.
translation:
  language: fr
  text: Il courut en avant et grimpa dans un sycomore[a] afin de voir Jésus, car celui-ci allait passer par là.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Plus précisément, un figuier-sycomore.
    reason: lexical_alternative
lexical_decisions:
- source_word: προδραμὼν εἰς τὸ ἔμπροσθεν
  choice: courut donc en avant
  rationale: Le participe aoriste et l’expression directionnelle indiquent qu’il devance la foule en courant. « Courut en avant » restitue les deux éléments sans lourdeur.
- source_word: ἀνέβη ἐπὶ
  choice: monta dans
  rationale: Avec un arbre, « monter dans » est l’expression française naturelle et traduit clairement le mouvement ascendant.
- source_word: συκομορέαν
  choice: un sycomore
  rationale: Le terme désigne le Ficus sycomorus. « Sycomore » est la désignation française courante; une note apporte la précision botanique.
- source_word: ἵνα ἴδῃ αὐτόν
  choice: afin de voir Jésus
  rationale: « Afin de » exprime nettement la finalité portée par ἵνα avec le subjonctif. Le nom « Jésus » clarifie le référent du pronom grec dans un français naturel.
- source_word: ὅτι
  choice: car
  rationale: La conjonction introduit la raison de son geste; « car » convient au registre narratif digne et courant.
- source_word: ἐκείνης
  choice: par là
  rationale: Le féminin génitif renvoie probablement de manière elliptique à une voie ou une route. « Par là » préserve cette imprécision sans ajouter un nom absent du grec.
- source_word: ἤμελλεν διέρχεσθαι
  choice: devait passer
  rationale: μέλλω avec l’infinitif présente ici le passage prochain ou attendu. « Devait passer » est naturel dans ce contexte et conserve cette nuance prospective.
