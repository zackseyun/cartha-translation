    issue: « Un autre » au lieu de « l’autre »
    rationale: Le grec porte ὁ ἕτερος (« l’autre », celui qui reste dans le contraste narratif). « Un autre » est possible en français, mais affaiblit la détermination présente dans la source.
  - severity: medium
    issue: « enveloppée » surinterprète ἀποκειμένην
    rationale: Le participe signifie « mise de côté », « déposée », « rangée ». Le contexte permet qu’elle soit dans un linge, mais ne dit pas explicitement qu’elle était enveloppée.
  - severity: low
    issue: Formulation de la note concernant l’usage du linge
    rationale: « Servir à s’essuyer le visage ou la sueur » est légèrement imprécis et peu idiomatique ; « essuyer le visage ou la transpiration » est plus naturel.
