  text: καὶ ⸀ὁ ἕτερος ἦλθεν λέγων· Κύριε, ἰδοὺ ἡ μνᾶ σου ἣν εἶχον ἀποκειμένην ἐν σουδαρίῳ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/020.yaml
  text: And the other came[a], saying, ‘Lord, look, here is your mina, which I kept laid away in a cloth.’
translation:
  language: fr
  text: 'L’autre vint et dit : « Seigneur, voici ta mine, que je gardais rangée dans un linge[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « dans un mouchoir ». Le mot grec désigne un linge qui pouvait notamment servir à essuyer le visage ou la transpiration.'
    reason: Précision lexicale sur σουδάριον et conservation d’une traduction plus spécifique possible.
lexical_decisions:
- source_word: ὁ ἕτερος
  choice: un autre
  rationale: Dans la succession des serviteurs, l’expression désigne un autre serviteur, avec une nuance de contraste, sans exiger en français qu’il soit le dernier.
- source_word: ἦλθεν λέγων
  choice: vint et dit
  rationale: Cette coordination naturelle en français restitue la venue suivie de la prise de parole.
- source_word: Κύριε
  choice: Seigneur
  rationale: « Seigneur » rend κύριε de manière cohérente et digne, tout en restant possible comme adresse respectueuse au maître de la parabole.
- source_word: ἰδοὺ ἡ μνᾶ σου
  choice: voici ta mine
  rationale: « Voici » exprime naturellement la présentation signalée par ἰδού; « mine » conserve le nom de l’unité monétaire antique.
- source_word: ἣν εἶχον ἀποκειμένην
  choice: Je l’ai gardée enveloppée
  rationale: La formulation rend l’état durable exprimé par εἶχον avec le participe, tandis que le contexte du linge permet une expression française naturelle sans réduire le sens à un simple acte ponctuel.
- source_word: ἐν σουδαρίῳ
  choice: dans un linge
  rationale: σουδάριον désigne un morceau de tissu servant notamment à s’essuyer le visage ou la sueur; « linge » évite une image moderne trop précise.
theological_decisions:
- issue: Traduction de κύριος comme terme d’adresse dans une parabole
  choice: Seigneur
  alternative: Maître
  rationale: Le personnage s’adresse au noble devenu roi et maître des serviteurs. « Seigneur » préserve la portée du terme grec et ses résonances possibles sans imposer une identification théologique explicite.
translation_notes:
  register: Français international moderne, sobre et narratif. Le tutoiement correspond à l’adresse directe d’un serviteur à son seigneur dans le cadre antique. « Mine » est maintenu comme unité monétaire ancienne; la note porte uniquement sur la nature du linge.
