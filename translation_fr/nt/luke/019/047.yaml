id: LUK.19.47
reference: Luke 19:47
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ ἦν διδάσκων τὸ καθ’ ἡμέραν ἐν τῷ ἱερῷ· οἱ δὲ ἀρχιερεῖς καὶ οἱ γραμματεῖς ἐζήτουν αὐτὸν ἀπολέσαι καὶ οἱ πρῶτοι τοῦ λαοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/047.yaml
  text: And he was teaching day by day in the temple. But the chief priests and the scribes[a], and the leading men of the people, were seeking to destroy him,
translation:
  language: fr
  text: Chaque jour, il enseignait dans le temple. Mais les grands prêtres, les spécialistes de la Loi et les notables du peuple cherchaient à le faire périr.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἦν διδάσκων
  choice: il enseignait
  rationale: La périphrase à l’imparfait exprime une activité habituelle ou répétée dans le passé; l’imparfait français la rend naturellement.
- source_word: τὸ καθ’ ἡμέραν
  choice: Chaque jour
  rationale: Cette expression distributive signifie « jour après jour » ou « tous les jours »; « Chaque jour » est clair et idiomatique.
- source_word: ἐν τῷ ἱερῷ
  choice: dans le temple
  rationale: ἱερόν désigne ici l’ensemble du domaine du temple, non le sanctuaire intérieur; le français biblique courant emploie naturellement « temple ».
- source_word: οἱ ἀρχιερεῖς
  choice: les grands prêtres
  rationale: Expression française consacrée pour le groupe des principaux responsables sacerdotaux.
- source_word: οἱ γραμματεῖς
  choice: les spécialistes de la Loi
  rationale: Dans ce contexte, γραμματεῖς désigne des experts et interprètes des Écritures et de la Loi; « spécialistes de la Loi » communique leur fonction plus clairement que le terme historique peu transparent « scribes ».
- source_word: ἐζήτουν
  choice: cherchaient
  rationale: L’imparfait grec présente une démarche persistante; l’imparfait français conserve cet aspect sans ajouter explicitement la notion de tentative.
- source_word: αὐτὸν ἀπολέσαι
  choice: à le faire périr
  rationale: ἀπόλλυμι peut signifier détruire ou tuer. Dans ce contexte hostile, « faire périr » garde la portée létale tout en restant plus proche de l’amplitude du verbe que « tuer ».
- source_word: οἱ πρῶτοι τοῦ λαοῦ
  choice: les notables du peuple
  rationale: Littéralement « les premiers du peuple », la formule désigne des personnes éminentes ou influentes. « Notables » rend leur rang social sans les identifier nécessairement à des dirigeants officiels.
theological_decisions:
- issue: Portée de αὐτὸν ἀπολέσαι
  choice: à le faire périr
  alternative: à le tuer
  rationale: Le contexte indique une intention mortelle, mais le choix retenu préserve quelque peu la largeur sémantique de ἀπόλλυμι sans atténuer la menace.
- issue: Référence masculine dans οἱ πρῶτοι τοῦ λαοῦ
  choice: les notables du peuple
  alternative: les hommes influents du peuple
  rationale: Le masculin grammatical grec s’inscrit vraisemblablement dans un cadre historique dominé par des hommes, mais le texte ne souligne pas leur sexe. « Notables » désigne fidèlement ce groupe de personnes éminentes sans introduire une insistance absente de la formulation source.
translation_notes:
  register: Français international moderne, digne et accessible. La structure en deux phrases conserve le contraste marqué par δέ. « Spécialistes de la Loi » privilégie la compréhension immédiate; « notables » évite le calque obscur « les premiers du peuple ». Aucun appel de note n’est nécessaire.
