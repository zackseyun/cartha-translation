  text: Καὶ εἰσελθὼν διήρχετο τὴν Ἰεριχώ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/001.yaml
  text: And he entered and was passing through Jericho[a].
translation:
  language: fr
  text: Il entra dans Jéricho et traversait la ville[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus formellement : « Après être entré, il traversait Jéricho. »'
    reason: Cette formulation reflète plus directement le participe grec et la construction avec « Jéricho » comme complément de « traversait ».
lexical_decisions:
- source_word: Καὶ
  choice: et
  rationale: La conjonction relie simplement cet épisode au récit précédent et coordonne naturellement les actions en français.
- source_word: εἰσελθὼν
  choice: il entra dans
  rationale: Le participe aoriste exprime une entrée antérieure à l’action principale. Une proposition conjuguée rend cette succession avec naturel, sans alourdir la phrase française.
- source_word: διήρχετο
  choice: traversait
  rationale: L’imparfait grec présente l’action comme en cours. L’imparfait français en conserve ici l’aspect progressif.
- source_word: τὴν Ἰεριχώ
  choice: Jéricho / la ville
  rationale: Le nom propre est conservé après le verbe d’entrée; la reprise par « la ville » évite en français la répétition peu naturelle de « Jéricho » tout en rendant clairement le lieu traversé.
theological_decisions: []
translation_notes:
  register: Français moderne, narratif et digne. La coordination est fluide, tandis que l’imparfait « traversait » préserve l’action en cours exprimée par le grec.
