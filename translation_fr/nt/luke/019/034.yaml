  text: οἱ δὲ εἶπαν ⸀ὅτι Ὁ κύριος αὐτοῦ χρείαν ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/034.yaml
  text: And they said[a], “The Lord has need of it.”
translation:
  language: fr
  text: 'Et ils dirent : « Le Seigneur[a] en a besoin. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Le maître en a besoin », si κύριος désigne ici un maître plutôt que Jésus sous le titre de « Seigneur ».'
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ δὲ
  choice: Et ils
  rationale: δέ est ici un connecteur narratif léger, rendu naturellement par « Et » ; l’article substantivé οἱ désigne les personnes déjà mentionnées.
- source_word: εἶπαν
  choice: dirent
  rationale: L’aoriste de λέγω signifie simplement « dire ». « Répondirent » conviendrait au contexte, mais ajouterait une nuance qui n’est pas explicitement portée par le verbe.
- source_word: ὅτι
  choice: rendu par les deux-points et les guillemets
  rationale: ὅτι introduit ici le discours direct ; en français courant, cette fonction est naturellement exprimée par la ponctuation.
- source_word: Ὁ κύριος
  choice: Le Seigneur
  rationale: « Seigneur » conserve le titre habituellement appliqué à Jésus dans Luc, tout en signalant en note que κύριος peut aussi désigner un maître.
- source_word: αὐτοῦ
  choice: en
  rationale: Le pronom renvoie le plus naturellement à l’ânon mentionné auparavant. Dans « en avoir besoin », le pronom français « en » exprime idiomatiquement le complément introduit par « de ».
- source_word: χρείαν ἔχει
  choice: a besoin
  rationale: L’expression grecque signifie littéralement « a besoin ». Cette tournure est à la fois fidèle et parfaitement naturelle en français moderne.
theological_decisions:
- issue: Référent de κύριος dans la réponse des disciples
  choice: « Le Seigneur », compris dans le contexte comme une désignation de Jésus
  alternative: « Le maître », en référence au maître ou propriétaire de l’ânon
  rationale: Dans le contexte immédiat, les disciples répètent la formule que Jésus leur a donnée, et Luc emploie fréquemment κύριος pour Jésus. Toutefois, le nom peut aussi signifier « maître » ; cette ambiguïté réelle est donc conservée en note.
translation_notes:
  register: Français moderne, sobre et digne. La formulation concise respecte le rythme du récit et conserve l’ambiguïté lexicale de κύριος au moyen d’une note.
