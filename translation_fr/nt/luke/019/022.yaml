review_pass:
  verdict: revise
  source_fidelity: 'La traduction rend correctement le futur κρίνω, l’apostrophe péjorative πονηρὲ δοῦλε, et la structure rhétorique de la réplique. Toutefois, dans les deux relatives finales, le grec porte explicitement la première personne singulière (ὃ οὐκ ἔθηκα ; ὃ οὐκ ἔσπειρα : « ce que je n’ai pas déposé / semé »). Le passage au pronom « il » attribue à tort ces actions à un tiers.'
  naturalness: Le français est moderne, clair et de registre approprié. « D’après tes propres paroles » est une restitution idiomatique satisfaisante de l’idiome grec. La correction des pronoms rend aussi la référence au locuteur immédiatement naturelle.
  terminology: « Esclave » conserve à juste titre la force sociale de δοῦλος dans le cadre de la parabole. « Mauvais » est recevable pour πονηρός dans cette apostrophe. « Homme dur », « déposer », « moissonner » et « semer » sont naturels et restent proches du grec, sans surinterpréter le propos rhétorique du maître.
  issues:
  - severity: high
    issue: Les pronoms des deux propositions relatives sont à la troisième personne (« qu’il n’a pas déposé », « qu’il n’a pas semé »).
    rationale: 'Les verbes grecs ἔθηκα et ἔσπειρα sont tous deux à la première personne du singulier. Ils renvoient au maître qui parle : « ce que je n’ai pas déposé » et « ce que je n’ai pas semé ». Le texte actuel modifie donc les référents et le sens de la déclaration.'
