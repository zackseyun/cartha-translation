  to: 'Il lui dit : « Je te jugerai d’après tes propres paroles[a], mauvais esclave. Tu savais que je suis un homme dur, qui prend ce que je n’ai pas déposé et moissonne ce que je n’ai pas semé ? »'
  rationale: 'Correction nécessaire des deux pronoms personnels afin de reproduire les deux formes grecques à la première personne et de préserver le parallélisme : le maître prend ce qu’il n’a pas lui-même déposé et moissonne ce qu’il n’a pas lui-même semé. Aucune autre modification n’est requise.'
