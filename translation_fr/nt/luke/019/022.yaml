  text: ⸀λέγει αὐτῷ· Ἐκ τοῦ στόματός σου κρίνω σε, πονηρὲ δοῦλε· ᾔδεις ὅτι ἐγὼ ἄνθρωπος αὐστηρός εἰμι, αἴρων ὃ οὐκ ἔθηκα καὶ θερίζων ὃ οὐκ ἔσπειρα;
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/022.yaml
  text: He said to him[a], ‘Out of your own mouth I will judge you, wicked servant. You knew that I am a harsh man[d][c][b], taking up what I did not lay down and reaping what I did not sow?’
translation:
  language: fr
  text: 'Il lui dit : « Je te jugerai d’après tes propres paroles[a], mauvais esclave. Tu savais que je suis un homme dur, qui prend ce que je n’ai pas déposé et moissonne ce que je n’ai pas semé ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Je te jugerai d’après ta propre bouche. »'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐκ τοῦ στόματός σου
  choice: d’après tes propres paroles
  rationale: Cette formulation française naturelle restitue l’idiome grec, selon lequel le jugement se fonde sur ce que l’esclave a lui-même déclaré. La note conserve l’image littérale de la bouche.
- source_word: κρίνω
  choice: je te jugerai
  rationale: Le futur français correspond au futur de l’indicatif grec et préserve le sens général de « juger » sans le restreindre à « condamner ».
- source_word: πονηρὲ δοῦλε
  choice: mauvais esclave
  rationale: « Mauvais » exprime ici le blâme moral, tandis qu’« esclave » conserve le statut de dépendance marqué par δοῦλος dans cette relation parabolique entre maître et esclave.
- source_word: αὐστηρός
  choice: dur
  rationale: « Dur » rend la sévérité exigeante et négative attribuée au maître, dans un français actuel et direct.
- source_word: αἴρων ὃ οὐκ ἔθηκα
  choice: qui prend ce qu’il n’a pas déposé
  rationale: « Prend » conserve la portée assez large de αἴρω, et « déposé » rend ici naturellement τίθημι dans le contexte d’une somme confiée, sans transformer l’expression en terme financier trop technique.
- source_word: θερίζων ὃ οὐκ ἔσπειρα
  choice: moissonne ce qu’il n’a pas semé
  rationale: La traduction maintient la métaphore agricole et l’objet direct « ce que », qui correspond au pronom relatif grec, plutôt que le traditionnel « là où ».
theological_decisions:
- issue: Statut exprimé par δοῦλος dans la parabole
  choice: esclave
  alternative: serviteur
  rationale: Le cadre maître-esclave met au premier plan la dépendance sociale et juridique du personnage. « Esclave » préserve cette force sans l’atténuer.
- issue: Caractère dur du maître présenté dans sa propre réplique
  choice: conserver directement « Tu savais que je suis un homme dur »
  alternative: « Tu prétendais que je suis un homme dur »
  rationale: Le grec reprend directement l’affirmation de l’esclave sous une forme rhétorique. La traduction n’ajoute donc aucun commentaire qui confirmerait ou récuserait théologiquement cette caractérisation.
translation_notes:
  register: Français international moderne, direct et digne. La syntaxe reste naturelle à l’oral tout en conservant la question rhétorique finale, le parallélisme entre prendre et moissonner, ainsi que la tension du discours rapporté.
