  text: εἶπεν δὲ καὶ τούτῳ· Καὶ σὺ ⸂ἐπάνω γίνου⸃ πέντε πόλεων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/019.yaml
  text: And he said to this one also[a], ‘And you, be over five cities.’
translation:
  language: fr
  text: 'Il dit aussi à celui-ci : « Et toi, sois à la tête de cinq villes[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « exerce ton autorité sur cinq villes » ou « sois nommé responsable de cinq villes ».
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν δὲ καὶ τούτῳ
  choice: Il dit aussi à celui-ci
  rationale: Cette formulation garde le démonstratif τούτῳ et la valeur additive de καί, tandis que δέ reste un lien narratif léger qu’il n’est pas nécessaire de rendre séparément en français.
- source_word: Καὶ σὺ
  choice: Et toi
  rationale: Le pronom disjoint « toi » restitue l’adresse personnelle mise en relief et maintient le parallélisme avec le serviteur précédent.
- source_word: ἐπάνω γίνου
  choice: sois établi sur
  rationale: L’impératif γίνου avec ἐπάνω exprime ici l’accès à une position d’autorité. « Sois établi sur » est naturel, digne et plus explicite en français que le calque « sois sur ».
- source_word: πέντε πόλεων
  choice: cinq villes
  rationale: πόλις désigne normalement une ville, et le génitif dépend de ἐπάνω pour indiquer l’étendue de l’autorité confiée.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et narratif. La syntaxe conserve l’adresse directe et la portée d’autorité de l’expression grecque sans préciser davantage la nature de cette autorité.
