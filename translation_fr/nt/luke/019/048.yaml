source:
  edition: SBLGNT
  text: καὶ οὐχ ⸀εὕρισκον τὸ τί ποιήσωσιν, ὁ λαὸς γὰρ ἅπας ἐξεκρέματο αὐτοῦ ἀκούων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/048.yaml
  text: And they could not find what they might do[a], because all the people were hanging on his words as they listened.
translation:
  language: fr
  text: Et ils ne trouvaient pas ce qu’ils pourraient faire, car tout le peuple était suspendu à ses paroles[a] en l’écoutant.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « tout le peuple était suspendu à lui en l’écoutant ». L’expression grecque décrit l’attention intense et avide que le peuple accordait à Jésus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχ εὕρισκον
  choice: ils ne trouvaient pas
  rationale: L’imparfait rend la recherche prolongée et infructueuse d’un moyen d’agir, sans transformer explicitement cette difficulté en incapacité absolue.
- source_word: τὸ τί ποιήσωσιν
  choice: ce qu’ils pourraient faire
  rationale: 'Cette formulation conserve la nuance délibérative du subjonctif grec : ils cherchaient quelle action entreprendre.'
- source_word: ὁ λαὸς γὰρ ἅπας
  choice: car tout le peuple
  rationale: « Car » exprime la valeur explicative de γάρ, tandis que « tout le peuple » respecte λαός et la portée intensive de ἅπας.
- source_word: ἐξεκρέματο αὐτοῦ
  choice: était suspendu à ses paroles
  rationale: Cette expression française naturelle communique l’attention intense et avide de l’idiome grec. « Ses paroles » est explicité à partir du contexte d’écoute, tandis qu’une note conserve la formulation plus littérale avec le pronom personnel.
- source_word: ἀκούων
  choice: en l’écoutant
  rationale: 'Le participe présent indique la manière et la simultanéité : le peuple manifestait cette attention soutenue en écoutant Jésus.'
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. « Être suspendu à ses paroles » maintient l’image expressive du grec tout en restant idiomatique; la note signale que le texte source dit littéralement « à lui ».
