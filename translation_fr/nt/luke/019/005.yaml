source:
  edition: SBLGNT
  text: καὶ ὡς ἦλθεν ἐπὶ τὸν τόπον, ἀναβλέψας ὁ ⸀Ἰησοῦς εἶπεν πρὸς αὐτόν· Ζακχαῖε, σπεύσας κατάβηθι, σήμερον γὰρ ἐν τῷ οἴκῳ σου δεῖ με μεῖναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/005.yaml
  text: And when Jesus came to the place[a], he looked up and said to him, “Zacchaeus, hurry and come down[b], because today I must stay at your house.”
translation:
  language: fr
  text: 'Quand Jésus arriva à cet endroit, il leva les yeux et lui dit : « Zachée, dépêche-toi de descendre, car aujourd’hui, il faut[a] que je reste chez toi. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression grecque traduite par « il faut » peut évoquer une nécessité liée à la mission de Jésus ou au dessein de Dieu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς
  choice: quand
  rationale: Dans ce récit, ὡς introduit naturellement une proposition temporelle.
- source_word: ἐπὶ τὸν τόπον
  choice: à cet endroit
  rationale: Cette expression locative désigne l’endroit précis où se trouvait Zachée ; « cet endroit » est naturel en français narratif.
- source_word: ἀναβλέψας
  choice: il leva les yeux
  rationale: Le participe décrit Jésus dirigeant son regard vers le haut, là où Zachée se trouvait.
- source_word: εἶπεν πρὸς αὐτόν
  choice: lui dit
  rationale: Formule française courante et fidèle pour introduire des paroles adressées directement à quelqu’un.
- source_word: Ζακχαῖε
  choice: Zachée
  rationale: Forme française traditionnelle et largement reconnue du nom propre.
- source_word: σπεύσας κατάβηθι
  choice: dépêche-toi de descendre
  rationale: Cette formulation idiomatique conserve l’urgence exprimée par le participe associé à l’impératif.
- source_word: σήμερον γὰρ
  choice: car aujourd’hui
  rationale: « Car » préserve la valeur explicative de γάρ, tandis qu’« aujourd’hui » garde la place importante de σήμερον.
- source_word: ἐν τῷ οἴκῳ σου
  choice: chez toi
  rationale: En français moderne, « chez toi » exprime naturellement le fait de séjourner dans la maison ou le foyer de Zachée.
- source_word: δεῖ με
  choice: il faut que je
  rationale: Cette tournure conserve la forte idée de nécessité sans préciser abusivement si elle relève explicitement d’un ordre divin.
- source_word: μεῖναι
  choice: reste
  rationale: Dans ce contexte, μένω signifie demeurer ou séjourner chez Zachée ; « rester » est clair, naturel et suffisamment large.
theological_decisions:
- issue: Portée de δεῖ dans la théologie narrative de Luc
  choice: il faut que je reste
  alternative: je dois rester
  rationale: La tournure retenue exprime une nécessité forte, potentiellement liée à la mission de Jésus et au dessein de Dieu, sans rendre cette implication théologique explicite au-delà de ce que dit le verset.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe narrative reste fluide, et les paroles de Jésus conservent leur urgence ainsi que la force non résolue de la nécessité exprimée par δεῖ.
