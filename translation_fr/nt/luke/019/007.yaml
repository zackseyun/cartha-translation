id: LUK.19.7
reference: Luke 19:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἰδόντες πάντες διεγόγγυζον λέγοντες ὅτι Παρὰ ἁμαρτωλῷ ἀνδρὶ εἰσῆλθεν καταλῦσαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/007.yaml
  text: And when they all saw it[a], they began to grumble, saying, “He has gone in to stay with a sinful man.”
translation:
  language: fr
  text: 'En voyant cela, tous se mirent à murmurer : « Il est entré chez un homme pécheur pour y loger.[a] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour être l’hôte d’un pécheur ».
    reason: Alternative lexicale pour καταλῦσαι et formulation plus condensée de ἁμαρτωλῷ ἀνδρί.
lexical_decisions:
- source_word: ἰδόντες
  choice: En voyant cela
  rationale: Le participe aoriste exprime ici la circonstance qui déclenche la réaction. « Cela » explicite naturellement en français ce que la foule voit dans le contexte.
- source_word: πάντες
  choice: tous
  rationale: Conserve l'étendue générale de la réaction de la foule et la mise en relief du grec.
- source_word: διεγόγγυζον
  choice: se mirent à murmurer
  rationale: L'imparfait grec peut présenter une action en cours ou à son commencement. Cette formulation rend naturellement la réaction qui s'élève alors, avec la nuance de mécontentement.
- source_word: λέγοντες
  choice: ':'
  rationale: En français, les deux-points introduisent avec naturel les paroles qui donnent le contenu des murmures, sans devoir calquer le participe grec « disant ».
- source_word: παρὰ ἁμαρτωλῷ ἀνδρὶ
  choice: chez un homme pécheur
  rationale: « Chez » exprime le fait d'entrer et de séjourner au domicile de quelqu'un; « un homme pécheur » conserve à la fois l'adjectif ἁμαρτωλῷ et le nom masculin ἀνδρί.
- source_word: εἰσῆλθεν
  choice: Il est entré
  rationale: Le passé composé convient à une plainte rapportée en français et présente l'action accomplie avec sa pertinence immédiate.
- source_word: καταλῦσαι
  choice: pour y loger
  rationale: Le verbe désigne ici le fait de séjourner ou de loger chez quelqu'un. « Y loger » est clair et conserve la finalité exprimée par l'infinitif.
theological_decisions:
- issue: Caractérisation de Zachée par la foule
  choice: un homme pécheur
  alternative: un pécheur
  rationale: Le grec emploie un adjectif accompagné du nom ἀνήρ, et non le seul adjectif substantivé. La traduction retenue préserve la formulation masculine et le jugement dépréciatif de la foule sans l'accentuer.
translation_notes:
  register: Français international moderne, naturel et digne. « Murmurer » maintient la tonalité biblique tout en restant courant; « homme pécheur » est volontairement plus formel afin de préserver la structure grecque.
