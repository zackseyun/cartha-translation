id: LUK.19.30
reference: Luke 19:30
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸀λέγων· Ὑπάγετε εἰς τὴν κατέναντι κώμην, ἐν ᾗ εἰσπορευόμενοι εὑρήσετε πῶλον δεδεμένον, ἐφ’ ὃν οὐδεὶς πώποτε ἀνθρώπων ἐκάθισεν, ⸀καὶ λύσαντες αὐτὸν ἀγάγετε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/030.yaml
  text: saying, “Go into the village opposite you, in which, as you enter, you will find a colt tied up, on which no one among men has ever sat. Untie it and bring it.”
translation:
  language: fr
  text: 'en disant : « Allez au village d’en face. En y entrant, vous trouverez un ânon attaché, sur lequel personne ne s’est jamais assis. Détachez-le et amenez-le. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὴν κατέναντι κώμην
  choice: le village qui est en face
  rationale: Rend naturellement l’idée spatiale de κατέναντι sans ajouter le complément « de vous », implicite dans le contexte.
- source_word: πῶλον
  choice: ânon
  rationale: Dans le contexte de l’entrée à Jérusalem, le jeune animal est un jeune âne ; « ânon » est précis et courant en français biblique moderne.
- source_word: δεδεμένον
  choice: attaché
  rationale: Le participe parfait indique que l’animal se trouve attaché ; cette formulation française est simple et fidèle.
- source_word: οὐδεὶς πώποτε ἀνθρώπων ἐκάθισεν
  choice: personne ne s’est jamais assis
  rationale: « Personne » exprime naturellement οὐδεὶς ἀνθρώπων en français ; « jamais » conserve l’insistance de πώποτε.
- source_word: λύσαντες αὐτὸν ἀγάγετε
  choice: Détachez-le et amenez-le
  rationale: Conserve la succession concise des deux actions ordonnées.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe reste proche du grec tout en évitant la lourdeur de « dans lequel, en entrant ». Le participe introductif λέγων est conservé par « en disant », puisque le verset dépend grammaticalement du précédent.
