source:
  edition: SBLGNT
  text: καὶ ἐζήτει ἰδεῖν τὸν Ἰησοῦν τίς ἐστιν, καὶ οὐκ ἠδύνατο ἀπὸ τοῦ ὄχλου ὅτι τῇ ἡλικίᾳ μικρὸς ἦν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/003.yaml
  text: And he was trying to see who Jesus was[a], but he could not because of the crowd, because he was small in stature.
translation:
  language: fr
  text: Il cherchait à voir qui était Jésus, mais il n’y arrivait pas à cause de la foule, car il était de petite taille.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐζήτει
  choice: cherchait à
  rationale: L’imparfait exprime un effort en cours. « Cherchait à » rend naturellement cette tentative prolongée sans la réduire à un simple désir.
- source_word: ἰδεῖν
  choice: voir
  rationale: L’infinitif exprime le but de son effort; « voir » est ici la formulation française la plus simple et directe.
- source_word: τίς ἐστιν
  choice: qui était Jésus
  rationale: Cette tournure conserve l’ambiguïté possible entre l’identité de Jésus et la découverte de sa personne, sans préciser indûment « quel genre d’homme » il était.
- source_word: οὐκ ἠδύνατο
  choice: il n’y arrivait pas
  rationale: Dans le contexte d’une tentative concrète déjà exprimée, cette formulation idiomatique rend l’incapacité persistante indiquée par l’imparfait.
- source_word: ἀπὸ τοῦ ὄχλου
  choice: à cause de la foule
  rationale: La préposition indique ici la cause faisant obstacle; cette expression est claire et naturelle en français moderne.
- source_word: ὅτι
  choice: car
  rationale: La conjonction introduit la raison pour laquelle la foule l’empêchait de voir. « Car » évite la répétition immédiate de « à cause de ».
- source_word: τῇ ἡλικίᾳ μικρὸς ἦν
  choice: il était de petite taille
  rationale: Même si ἡλικία peut concerner l’âge ou la stature, le fait que la foule bloque sa vue indique ici sa taille physique. « De petite taille » est précis, naturel et digne.
theological_decisions: []
translation_notes:
  register: Français international moderne, fluide et digne. La formulation garde l’effort continu du récit et rend explicitement la petite taille physique sans ajouter d’interprétation théologique.
