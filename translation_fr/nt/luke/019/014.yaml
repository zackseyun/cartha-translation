id: LUK.19.14
reference: Luke 19:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οἱ δὲ πολῖται αὐτοῦ ἐμίσουν αὐτόν, καὶ ἀπέστειλαν πρεσβείαν ὀπίσω αὐτοῦ λέγοντες· Οὐ θέλομεν τοῦτον βασιλεῦσαι ἐφ’ ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/014.yaml
  text: But his citizens hated him[a], and sent a delegation after him, saying, ‘We do not want this man to reign over us.’
translation:
  language: fr
  text: 'Mais ses concitoyens le haïssaient et envoyèrent à sa suite une délégation[a] chargée de dire : « Nous ne voulons pas que cet homme règne sur nous. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « une ambassade ». Le mot grec désigne un groupe de représentants envoyé en mission officielle.'
    reason: Alternative lexicale précisant le sens politique de πρεσβεία.
lexical_decisions:
- source_word: πολῖται
  choice: concitoyens
  rationale: Le terme désigne les membres d’une communauté politique. « Concitoyens » conserve cette dimension civique sans les présenter d’avance comme ses « sujets », alors qu’ils refusent précisément sa royauté.
- source_word: ἐμίσουν
  choice: le haïssaient
  rationale: L’imparfait exprime une hostilité durable ou caractéristique. L’imparfait français rend naturellement cet aspect, tandis que « haïr » correspond directement à la force du verbe grec.
- source_word: ἀπέστειλαν
  choice: envoyèrent
  rationale: L’aoriste fait avancer le récit par une action ponctuelle ; le passé simple convient au registre narratif soutenu et reste clair.
- source_word: πρεσβείαν
  choice: une délégation
  rationale: Le mot peut désigner une ambassade ou le groupe de représentants qui la compose. « Une délégation » est l’expression moderne la plus naturelle dans ce contexte politique.
- source_word: ὀπίσω αὐτοῦ
  choice: à sa suite
  rationale: L’expression indique que la délégation est envoyée après lui, à la suite de son départ. Cette formulation préserve le rapport spatial et temporel sans expliquer davantage que le grec.
- source_word: λέγοντες
  choice: chargée de dire
  rationale: Le participe introduit le message porté par la délégation. Cette tournure française rattache naturellement la parole au groupe envoyé.
- source_word: Οὐ θέλομεν
  choice: Nous ne voulons pas
  rationale: Cette formulation courante exprime clairement la volonté et le refus marqués par θέλω.
- source_word: τοῦτον
  choice: cet homme
  rationale: Le démonstratif a ici une nuance de mise à distance. « Cet homme » la conserve sans ajouter un mépris plus prononcé que celui du texte.
- source_word: βασιλεῦσαι ἐφ’ ἡμᾶς
  choice: que cet homme règne sur nous
  rationale: « Régner » conserve explicitement l’idée royale de βασιλεύω, contrairement au verbe plus général « gouverner ». La subordonnée au subjonctif est idiomatique après « vouloir que ».
theological_decisions:
- issue: Dimension politique et royale de la parabole
  choice: Conserver le vocabulaire explicite de la royauté avec « règne sur nous ».
  alternative: « nous gouverne » ou « exerce son autorité sur nous »
  rationale: L’image de la parabole repose sur l’accession à la royauté et sur son rejet. La traduction maintient cette tension sans imposer une identification allégorique ni une conclusion doctrinale extérieure au verset.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple soutient le récit écrit ; l’imparfait marque l’hostilité durable. « À sa suite » évite le calque peu naturel « derrière lui », et la citation directe conserve la fermeté du refus.
