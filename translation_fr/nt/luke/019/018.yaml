  text: 'Le deuxième vint et dit : « Ta mine, Seigneur, en a rapporté cinq. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δεύτερος
  choice: le deuxième
  rationale: Désigne naturellement le deuxième serviteur dans la suite du récit.
- source_word: Ἡ μνᾶ σου
  choice: Ta mine
  rationale: « Mine » est le terme français usuel pour cette ancienne unité monétaire et conserve la précision historique.
- source_word: κύριε
  choice: Seigneur
  rationale: Forme d’adresse respectueuse au maître de la parabole ; la majuscule suit l’usage éditorial retenu sans identifier explicitement le personnage à Dieu.
- source_word: ἐποίησεν πέντε μνᾶς
  choice: en a rapporté cinq
  rationale: Exprime idiomatiquement le rendement produit par la mine, tout en gardant la mine initiale comme sujet logique.
theological_decisions:
- issue: Portée de κύριε dans la parabole
  choice: Seigneur
  alternative: seigneur / maître
  rationale: Le terme est conservé conformément à sa valeur d’adresse respectueuse et au choix éditorial fourni, sans ajouter d’interprétation christologique explicite.
translation_notes:
  register: Français moderne, naturel et digne. La formulation « en a rapporté cinq » évite l’expression peu idiomatique « a fait cinq mines » tout en préservant le sens économique du grec.
