id: LUK.19.26
reference: Luke 19:26
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸀λέγω ὑμῖν ὅτι παντὶ τῷ ἔχοντι δοθήσεται, ἀπὸ δὲ τοῦ μὴ ἔχοντος καὶ ὃ ἔχει ⸀ἀρθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/026.yaml
  text: I tell you that to everyone who has[a], more will be given; but from the one who does not have, even what he has will be taken away.
translation:
  language: fr
  text: 'Je vous le dis : à toute personne qui a, il sera donné ; mais à celle qui n’a pas, même ce qu’elle a lui sera enlevé.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγω ὑμῖν
  choice: Je vous le dis
  rationale: Cette tournure française naturelle conserve le présent, l’adresse directe au pluriel et la force solennelle de l’introduction.
- source_word: παντὶ τῷ ἔχοντι
  choice: à toute personne qui a
  rationale: Le participe substantivé désigne de façon générale toute personne qui possède quelque chose. Cette formulation inclusive et naturelle garde volontairement le complément de « a » implicite, comme en grec.
- source_word: δοθήσεται
  choice: il sera donné
  rationale: Le futur passif grec ne précise ni l’objet donné ni l’agent. La traduction conserve cette concision et n’ajoute pas « davantage », bien que l’idée d’un accroissement puisse être comprise dans le contexte.
- source_word: ἀπὸ δὲ τοῦ μὴ ἔχοντος
  choice: mais à celle qui n’a pas
  rationale: Le grec exprime le retrait à partir de la personne qui n’a pas. En français, la construction de « enlever quelque chose à quelqu’un » permet une formulation idiomatique, tandis que « mais » rend la valeur adversative de δέ.
- source_word: καὶ ὃ ἔχει
  choice: même ce qu’elle a
  rationale: Dans ce contraste, καί a une valeur intensive bien rendue par « même ». Le pronom féminin reprend grammaticalement « personne » sans restreindre la portée générale du propos.
- source_word: ἀρθήσεται
  choice: lui sera enlevé
  rationale: Le futur passif de αἴρω exprime ici la privation ou le retrait. « Sera enlevé » est clair et conserve la voix passive.
theological_decisions:
- issue: Portée interprétative de la maxime sur le don et la privation
  choice: Traduire la maxime telle quelle, sans préciser ce qui est possédé ou donné ni le mécanisme théologique en jeu.
  alternative: L’expliciter comme un principe portant précisément sur la gestion fidèle, le salut, le mérite ou le règne de Dieu.
  rationale: Le verset énonce un principe dans le cadre de la parabole, mais sa formulation ne donne pas d’explication doctrinale systématique. La traduction préserve donc sa concision et sa tension interprétative.
- issue: Complément implicite de δοθήσεται
  choice: Conserver « il sera donné » sans ajouter « davantage ».
  alternative: Traduire « il sera donné davantage » pour expliciter l’idée d’accroissement suggérée par le contexte.
  rationale: Le grec ne comporte aucun équivalent explicite de « davantage ». La formulation retenue privilégie les données du texte source tout en laissant le contexte faire comprendre l’accroissement éventuel.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase garde la forme proverbiale et le parallélisme du grec. « Toute personne » évite de donner au masculin grammatical une portée exclusivement masculine, et les passifs préservent l’absence d’agent explicite dans le texte source.
