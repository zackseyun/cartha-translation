id: LUK.19.16
reference: Luke 19:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: παρεγένετο δὲ ὁ πρῶτος λέγων· Κύριε, ἡ μνᾶ σου ⸂δέκα προσηργάσατο⸃ μνᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/016.yaml
  text: Then the first came, saying, ‘Lord, your mina has earned ten minas.’
translation:
  language: fr
  text: 'Le premier se présenta alors et dit : « Seigneur[a], ta mine a rapporté dix mines de plus. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Maître ». Le titre grec κύριε peut être une manière respectueuse de s’adresser à un supérieur aussi bien que signifier « Seigneur ».
    reason: alternative_reading
lexical_decisions:
- source_word: παρεγένετο
  choice: se présenta
  rationale: Dans cette scène de reddition de comptes, le verbe décrit naturellement l’arrivée du premier serviteur devant son maître; « se présenta » exprime cette démarche en français courant.
- source_word: δὲ
  choice: alors
  rationale: La particule marque ici la progression du récit; « alors » rend clairement la succession des événements.
- source_word: ὁ πρῶτος
  choice: le premier
  rationale: L’expression désigne le premier serviteur dans l’ordre de comparution, sans qu’il soit nécessaire de répéter « serviteur ».
- source_word: λέγων
  choice: et dit
  rationale: La coordination avec un verbe conjugué est plus naturelle en narration française que le calque participial « disant ».
- source_word: Κύριε
  choice: Seigneur
  rationale: « Seigneur » conserve la valeur traditionnelle et la portée possible de κύριε, tout en pouvant servir d’adresse respectueuse à un supérieur; l’autre traduction contextuelle est signalée en note.
- source_word: ἡ μνᾶ σου
  choice: ta mine
  rationale: La mine est une unité monétaire antique. Le possessif maintient l’idée que la somme confiée appartient au maître.
- source_word: δέκα προσηργάσατο μνᾶς
  choice: a rapporté dix mines
  rationale: προσεργάζομαι exprime le gain produit en plus par une activité. « A rapporté » convient idiomatiquement à un capital et indique que la mine confiée a généré dix mines supplémentaires, sans ajouter « de plus » au texte principal.
theological_decisions:
- issue: Traduction de κύριε dans l’adresse au personnage de la parabole
  choice: Seigneur
  alternative: Maître
  rationale: Le contexte permet une adresse respectueuse à un supérieur plutôt qu’un titre explicitement christologique. « Seigneur » préserve néanmoins l’ambivalence du grec et la cohérence terminologique; « Maître » est donné en note comme possibilité contextuelle.
translation_notes:
  register: Français international moderne, narratif et digne. « Mine » conserve la réalité monétaire antique; le contexte immédiat permet de comprendre qu’il s’agit d’une somme d’argent.
