id: LUK.19.44
reference: Luke 19:44
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἐδαφιοῦσίν σε καὶ τὰ τέκνα σου ἐν σοί, καὶ οὐκ ἀφήσουσιν ⸂λίθον ἐπὶ λίθον ἐν σοί⸃, ἀνθ’ ὧν οὐκ ἔγνως τὸν καιρὸν τῆς ἐπισκοπῆς σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/044.yaml
  text: and they will level you to the ground[a], and your children within you, and they will not leave one stone upon another within you, because you did not recognize the time of your visitation.
translation:
  language: fr
  text: Ils te raseront jusqu’au sol, toi et tes enfants qui sont au milieu de toi. Ils ne laisseront pas en toi pierre sur pierre, parce que tu n’as pas reconnu le temps où tu as été visitée[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le temps de ton inspection ». Le terme grec peut désigner une visite ou une inspection, en particulier une intervention divine pouvant apporter soit la grâce, soit le jugement.
    reason: Alternative lexicale destinée à préserver l’étendue de sens de ἐπισκοπή.
lexical_decisions:
- source_word: ἐδαφιοῦσίν
  choice: te raseront jusqu’au sol
  rationale: Le verbe exprime l’action d’abattre ou de dévaster jusqu’au sol. Cette formulation française naturelle conserve la violence et l’ampleur de la destruction.
- source_word: σε
  choice: te
  rationale: Le singulier maintient l’adresse directe à Jérusalem personnifiée, sans expliciter « ta ville ».
- source_word: τὰ τέκνα σου ἐν σοί
  choice: tes enfants qui sont au milieu de toi
  rationale: « Enfants » préserve l’image maternelle liée à Jérusalem personnifiée; « au milieu de toi » indique naturellement les personnes présentes dans la ville.
- source_word: οὐκ ἀφήσουσιν λίθον ἐπὶ λίθον ἐν σοί
  choice: Ils ne laisseront pas en toi pierre sur pierre
  rationale: Cette tournure idiomatique française exprime la destruction totale tout en conservant la répétition de « pierre » et la mention explicite de l’intérieur de Jérusalem.
- source_word: ἀνθ’ ὧν
  choice: parce que
  rationale: Dans ce contexte, la locution introduit la cause du jugement; « parce que » en rend clairement la valeur causale.
- source_word: ἔγνως
  choice: tu n’as pas reconnu
  rationale: Le verbe désigne ici le fait de discerner et de reconnaître une intervention décisive, plutôt que la simple acquisition d’une connaissance.
- source_word: καιρὸν
  choice: le temps
  rationale: καιρός désigne un moment significatif ou déterminé; « le temps » reste sobre et laisse la proposition suivante en préciser la portée.
- source_word: τῆς ἐπισκοπῆς σου
  choice: où tu as été visitée
  rationale: Cette formulation conserve l’idée de visitation et le rapport à Jérusalem, grammaticalement féminine en français, sans nommer explicitement l’auteur de la visite ni décider si celle-ci apporte grâce ou jugement.
theological_decisions:
- issue: Sens de ἐπισκοπή dans un contexte de jugement
  choice: où tu as été visitée
  alternative: le temps de ton inspection; le temps où Dieu est venu vers toi
  rationale: Le terme peut évoquer une visitation divine susceptible d’apporter la grâce ou le jugement. Le passif conserve l’agent divin implicite et la tension du grec, sans transformer cette visitation en simple inspection ni l’expliciter par une paraphrase théologique.
translation_notes:
  register: Français international moderne, digne et direct. La personnification de Jérusalem est maintenue par le tutoiement singulier et par « tes enfants ». Le marqueur de note [a] est placé après l’expression qu’il explique.
