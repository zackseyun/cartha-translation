id: LUK.19.28
reference: Luke 19:28
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ εἰπὼν ταῦτα ἐπορεύετο ἔμπροσθεν ἀναβαίνων εἰς Ἱεροσόλυμα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/028.yaml
  text: And after saying these things, he went on ahead, going up to Jerusalem.
translation:
  language: fr
  text: Après avoir dit cela, il poursuivit son chemin en tête, montant vers Jérusalem.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: Après
  rationale: Le καί assure la continuité narrative; en français, la construction « Après avoir dit » exprime naturellement l’enchaînement sans nécessiter un « Et » peu idiomatique.
- source_word: εἰπὼν ταῦτα
  choice: avoir dit cela
  rationale: Le participe aoriste marque une action antérieure au verbe principal. « Cela » reprend naturellement l’ensemble du discours précédent sans le réduire aux seules paroles.
- source_word: ἐπορεύετο
  choice: il poursuivit son chemin
  rationale: L’imparfait grec décrit la progression de Jésus dans le récit. Le passé simple convient à la narration française, tandis que « poursuivit son chemin » rend l’idée de mouvement continu.
- source_word: ἔμπροσθεν
  choice: en tête
  rationale: L’adverbe indique que Jésus avance devant les autres. « En tête » est naturel et concis, tout en laissant le groupe implicite comme dans le grec.
- source_word: ἀναβαίνων
  choice: montant
  rationale: Le participe présent exprime une action simultanée et conserve explicitement le mouvement d’ascension vers Jérusalem.
- source_word: εἰς Ἱεροσόλυμα
  choice: vers Jérusalem
  rationale: La préposition indique ici la direction ou la destination, sans imposer l’idée que Jésus entre déjà dans la ville.
theological_decisions:
- issue: Conservation du langage d’ascension vers Jérusalem
  choice: « montant vers Jérusalem »
  alternative: « se rendant à Jérusalem » ou « en route pour Jérusalem »
  rationale: Le grec nomme expressément la montée. Cette formulation convient à la géographie et préserve aussi la résonance narrative de l’approche de Jérusalem, sans en préciser davantage la portée théologique.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple maintient un registre biblique lisible sans archaïsme; « en tête » évite l’ajout explicite de « ses disciples », absent du texte grec.
