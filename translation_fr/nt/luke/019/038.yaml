  text: λέγοντες· Εὐλογημένος ὁ ἐρχόμενος ⸀βασιλεὺς ἐν ὀνόματι κυρίου· ⸂ἐν οὐρανῷ εἰρήνη⸃ καὶ δόξα ἐν ὑψίστοις.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/038.yaml
  text: saying[b][a], “Blessed is the King who comes in the name of the Lord! Peace in heaven and glory in the highest!”
translation:
  language: fr
  text: 'Ils disaient : « Béni soit le roi[a] qui vient au nom du Seigneur ! Paix dans le ciel[b] et gloire au plus haut des cieux ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Certaines traductions reprennent la formule plus familière : « Béni soit celui qui vient au nom du Seigneur. » Cependant, Luc mentionne explicitement « le roi ».'
    reason: alternative_reading
  - marker: b
    text: 'Cette parole fait écho à Luc 2.14, mais le lieu est inversé : là, la paix est « sur la terre » ; ici, elle est « dans le ciel ».'
    reason: cross_reference
lexical_decisions:
- source_word: λέγοντες
  choice: Ils disaient
  rationale: Le participe présent rattache l’acclamation à l’action du verset précédent. Une proposition avec sujet exprimé est plus naturelle en français courant tout en conservant l’idée d’une parole collective en cours.
- source_word: Εὐλογημένος
  choice: Béni soit
  rationale: Cette formule française naturelle convient à une acclamation de bénédiction et conserve l’écho du langage des Psaumes.
- source_word: ὁ ἐρχόμενος
  choice: qui vient
  rationale: La proposition relative s’accorde naturellement avec « le Roi » et préserve la valeur présente du participe grec.
- source_word: βασιλεὺς
  choice: le Roi
  rationale: Le titre royal est explicitement présent dans le texte de Luc et ne doit pas être omis. La majuscule signale ici l’emploi titulaire dans l’acclamation sans ajouter une interprétation au texte.
- source_word: ἐν ὀνόματι κυρίου
  choice: au nom du Seigneur
  rationale: Cette tournure française consacrée conserve l’arrière-plan sémitique ainsi que la notion de venue sous l’autorité du Seigneur.
- source_word: ἐν οὐρανῷ εἰρήνη
  choice: Paix dans le ciel
  rationale: La formulation nominale et concise reproduit l’acclamation grecque et maintient expressément « dans le ciel », sans harmonisation avec Luc 2.14.
- source_word: δόξα ἐν ὑψίστοις
  choice: gloire au plus haut des cieux
  rationale: Cette expression idiomatique, claire en français moderne, rend les régions célestes les plus élevées et conserve la résonance avec Luc 2.14.
theological_decisions:
- issue: Acclamation royale et messianique lors de l’entrée à Jérusalem
  choice: Conserver explicitement « le Roi »
  alternative: « Béni soit celui qui vient au nom du Seigneur »
  rationale: Le texte grec de Luc contient βασιλεὺς. Le maintien du titre préserve l’accent royal explicite sans développer davantage son interprétation théologique.
- issue: Rapport avec Luc 2.14
  choice: Traduire « Paix dans le ciel »
  alternative: « Paix sur la terre »
  rationale: Le texte source dit distinctement « dans le ciel ». Cette formulation doit être conservée afin de respecter le contraste ou la tension intertextuelle avec le cantique de Luc 2.14.
translation_notes:
  register: Français international moderne, digne et accessible. La structure exclamative reste concise. « Au plus haut des cieux » est préféré à la formulation plus littérale mais moins naturelle « dans les lieux très hauts ».
