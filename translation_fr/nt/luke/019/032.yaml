  variant: modern international French
source:
  edition: SBLGNT
  text: ἀπελθόντες δὲ οἱ ἀπεσταλμένοι εὗρον καθὼς εἶπεν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/032.yaml
  text: So those who were sent went away and found it just as he had told them[a].
translation:
  language: fr
  text: Ceux qui avaient été envoyés partirent donc et trouvèrent les choses comme il le leur avait dit[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou simplement : « trouvèrent », le complément étant sous-entendu d’après le contexte : l’ânon décrit par Jésus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπελθόντες
  choice: partirent
  rationale: Le participe aoriste de ἀπέρχομαι exprime ici le départ préalable; la coordination par un verbe conjugué est naturelle en français narratif.
- source_word: δὲ
  choice: donc
  rationale: Dans ce contexte, δέ assure la progression du récit à la suite de l’ordre donné; « donc » marque sobrement cet enchaînement.
- source_word: οἱ ἀπεσταλμένοι
  choice: ceux qui avaient été envoyés
  rationale: Le participe parfait passif substantivé est rendu explicitement, en conservant le passif et l’antériorité de l’envoi sans introduire le terme interprétatif « messagers ».
- source_word: εὗρον
  choice: trouvèrent les choses
  rationale: Le grec n’exprime aucun complément. « Les choses » permet une phrase française naturelle et renvoie à la situation décrite par Jésus, tout en évitant de limiter explicitement l’objet au seul ânon.
- source_word: καθὼς
  choice: comme
  rationale: καθώς exprime la conformité entre ce qu’ils constatent et les paroles de Jésus; « comme » la rend naturellement sans ajouter l’intensité de « exactement ».
- source_word: εἶπεν αὐτοῖς
  choice: il le leur avait dit
  rationale: « Dire » reste proche de λέγω, tandis que le plus-que-parfait exprime naturellement en français l’antériorité de ces paroles par rapport à leur constat.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La formulation conserve le passif de l’envoi et laisse au contexte l’identification précise de ce qui fut trouvé.
