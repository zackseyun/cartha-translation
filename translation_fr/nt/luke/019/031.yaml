id: LUK.19.31
reference: Luke 19:31
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἐάν τις ὑμᾶς ἐρωτᾷ· Διὰ τί λύετε; οὕτως ⸀ἐρεῖτε ὅτι Ὁ κύριος αὐτοῦ χρείαν ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/031.yaml
  text: 'And if anyone asks you[a], ‘Why are you untying it?’ you shall say this: ‘The Lord has need of it.’'
translation:
  language: fr
  text: 'Et si quelqu’un vous demande : « Pourquoi le détachez-vous ? », vous répondrez ainsi : « Le Seigneur[a] en a besoin. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Le maître ».'
    reason: Le grec κύριος peut désigner le Seigneur ou, dans ce contexte pratique, un maître ou propriétaire.
lexical_decisions:
- source_word: ἐρωτᾷ
  choice: demande
  rationale: Dans ce contexte de question directe, « demander » est le verbe français le plus naturel.
- source_word: Διὰ τί
  choice: Pourquoi
  rationale: Cette tournure interrogative exprime simplement la raison et se rend naturellement par « Pourquoi ».
- source_word: λύετε
  choice: le détachez-vous
  rationale: Le verbe désigne ici l’action de défaire le lien qui retient l’ânon. Le pronom objet, implicite en grec, est nécessaire en français.
- source_word: οὕτως ἐρεῖτε
  choice: vous répondrez ainsi
  rationale: Le futur a ici une valeur directive. « Répondrez » convient au contexte d’une question suivie de la réponse prescrite, tandis que « ainsi » reprend οὕτως.
- source_word: κύριος
  choice: Seigneur
  rationale: « Seigneur » préserve le titre appliqué à Jésus ainsi que sa possible portée théologique, sans exclure entièrement le sens courant de personne ayant autorité.
- source_word: αὐτοῦ
  choice: en
  rationale: Le pronom renvoie le plus naturellement à l’ânon. Dans l’expression française « en avoir besoin », « en » rend idiomatiquement le complément grec.
- source_word: χρείαν ἔχει
  choice: a besoin
  rationale: L’expression grecque signifie littéralement « avoir besoin ». La formulation française est à la fois fidèle, claire et naturelle.
theological_decisions:
- issue: Sens et référent de Ὁ κύριος
  choice: « Le Seigneur », compris comme un titre de Jésus
  alternative: « Le maître », au sens plus général de propriétaire ou de supérieur
  rationale: Dans le récit de Luc, κύριος peut désigner Jésus et porter une résonance théologique. « Seigneur » conserve cette possibilité, tandis qu’une note signale honnêtement le sens courant également possible.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve le futur directif du grec sans employer le plus raide « vous direz », et la ponctuation rend lisible l’enchaînement de la question et de la réponse.
