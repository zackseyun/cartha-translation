id: LUK.19.27
reference: Luke 19:27
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: πλὴν τοὺς ἐχθρούς μου ⸀τούτους τοὺς μὴ θελήσαντάς με βασιλεῦσαι ἐπ’ αὐτοὺς ἀγάγετε ὧδε καὶ κατασφάξατε ⸀αὐτοὺς ἔμπροσθέν μου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/027.yaml
  text: But as for these enemies of mine[a], who did not want me to reign over them[b], bring them here and slaughter them in front of me.
translation:
  language: fr
  text: Mais quant à ceux-là, mes ennemis, qui n’ont pas voulu que je règne sur eux[a], amenez-les ici et massacrez-les devant moi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « que je sois leur roi ».'
    reason: Alternative lexicale pour βασιλεῦσαι ἐπ’ αὐτούς, qui peut s’exprimer soit par l’action de régner, soit par la condition de roi.
  - marker: b
    text: 'Ou : « égorgez-les devant moi ».'
    reason: « Égorgez » rend de façon plus concrète et traditionnelle la violence de κατασφάξατε, mais peut suggérer en français une manière de tuer plus précise que ne l’exige nécessairement le contexte.
lexical_decisions:
- source_word: πλὴν
  choice: Mais quant à
  rationale: Cette tournure rend à la fois la transition adversative et la mise en relief du dernier groupe visé dans le discours du noble.
- source_word: τοὺς ἐχθρούς μου τούτους
  choice: ceux-là, mes ennemis
  rationale: L’apposition française conserve le possessif et la valeur emphatique du démonstratif τούτους sans produire la formulation lourde « ces ennemis à moi ».
- source_word: τοὺς μὴ θελήσαντάς με βασιλεῦσαι ἐπ’ αὐτοὺς
  choice: qui n’ont pas voulu que je règne sur eux
  rationale: La proposition relative rend naturellement le participe substantivé. « Règne sur eux » conserve le sens verbal et royal de βασιλεύω sans le réduire à une simple autorité générale.
- source_word: ἀγάγετε ὧδε
  choice: amenez-les ici
  rationale: « Amener » exprime naturellement le déplacement de personnes vers le locuteur demandé par ἄγω et ὧδε.
- source_word: κατασφάξατε
  choice: massacrez-les
  rationale: Le verbe grec est plus violent qu’un simple « tuer ». « Massacrez » en garde la force graphique sans préciser artificiellement la manière de donner la mort.
- source_word: ἔμπροσθέν μου
  choice: devant moi
  rationale: Cette expression naturelle conserve la dimension spatiale et personnelle de la scène.
theological_decisions:
- issue: Référence au locuteur dans la parabole
  choice: Conserver directement l’ordre violent prononcé par le noble, sans l’atténuer ni l’identifier explicitement à un commandement direct de Jésus hors de la parabole.
  alternative: Ajouter une formulation qui prendrait explicitement ses distances avec l’ordre en le présentant comme une simple image parabolique.
  rationale: Le grec rapporte sans commentaire les paroles du noble à l’intérieur de la parabole. La traduction doit préserver cette force narrative et la tension théologique sans ajouter une conclusion interprétative.
translation_notes:
  register: Français international moderne, direct et digne. La syntaxe met en relief « ceux-là » tout en restant lisible. Le vocabulaire ne dissimule pas la violence du passage et n’ajoute aucune qualification judiciaire ou doctrinale.
