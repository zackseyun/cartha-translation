source:
  edition: SBLGNT
  text: καὶ τοῖς παρεστῶσιν εἶπεν· Ἄρατε ἀπ’ αὐτοῦ τὴν μνᾶν καὶ δότε τῷ τὰς δέκα μνᾶς ἔχοντι—
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/024.yaml
  text: And he said to those standing by[a], ‘Take the mina from him and give it to the one who has the ten minas.’
translation:
  language: fr
  text: 'Puis il dit à ceux qui se tenaient là : « Prenez-lui la mine[a] et donnez-la à celui qui a les dix mines. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La mine était une unité monétaire antique.
    reason: Clarification d’un terme historique peu courant.
lexical_decisions:
- source_word: παρεστῶσιν
  choice: ceux qui se tenaient là
  rationale: Le participe parfait actif substantivé désigne les personnes présentes à proximité. Cette formulation conserve la dimension concrète de la scène dans un français naturel.
- source_word: Ἄρατε ἀπ’ αὐτοῦ
  choice: Prenez-lui
  rationale: Dans ce contexte, αἴρω avec ἀπό exprime le retrait. La construction française « prendre quelque chose à quelqu’un » rend avec concision l’ordre de lui enlever la somme.
- source_word: μνᾶν
  choice: mine
  rationale: La mine est une unité monétaire antique. Le terme historique évite l’anachronisme et l’imprécision de traductions comme « livre ».
- source_word: δότε
  choice: donnez-la
  rationale: L’impératif de δίδωμι exprime un simple transfert; le pronom reprend naturellement « la mine » en français.
- source_word: τῷ ... ἔχοντι
  choice: à celui qui a
  rationale: Le participe articulé au datif est substantivé. « Celui qui a » n’ajoute aucune précision de genre ou de statut absente du grec.
- source_word: τὰς δέκα μνᾶς
  choice: les dix mines
  rationale: L’article grec désigne la somme déjà mentionnée; l’article défini français la reprend naturellement.
theological_decisions:
- issue: Rendu de μνᾶ comme unité monétaire
  choice: mine
  alternative: livre
  rationale: « Mine » préserve l’unité antique du texte grec, tandis que « livre » peut évoquer à tort une monnaie moderne ou une équivalence exacte.
translation_notes:
  register: Français moderne, clair et digne. « Ceux qui se tenaient là » restitue concrètement la présence des personnes proches; « Prenez-lui » est idiomatique tout en exprimant nettement la séparation marquée par ἀπό.
