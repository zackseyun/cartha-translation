revisions:
- from: Et il arriva que, comme il approchait de Bethphagé et de Béthanie, vers le mont appelé « des Oliviers »[a], il envoya deux des disciples.
  to: Et il arriva que, lorsqu’il approcha de Bethphagé et de Béthanie, vers le mont des Oliviers, il envoya deux des disciples.
  rationale: La révision emploie le passé simple narratif pour l’aoriste et le nom français usuel « le mont des Oliviers », qui exprime naturellement l’appellation grecque sans introduire de contenu supplémentaire. La note est supprimée, car elle ne signale plus une alternative textuellement nécessaire.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T10:55:03Z'
review_pass:
  verdict: revise
  source_fidelity: Le sens est globalement bien rendu, mais l’imparfait « il approchait » ne correspond pas au parfait narratif/aoriste ἤγγισεν aussi exactement qu’un passé simple. La désignation ὄρος ... Ἐλαιῶν est le nom usuel du lieu et peut être rendue sans perte par « le mont des Oliviers ».
  naturalness: « Le mont appelé “des Oliviers” » est artificiel en français moderne et les guillemets donnent à tort l’impression d’un titre elliptique à conserver. « Lorsqu’il approcha ... du mont des Oliviers » est naturel, clair et garde les relations spatiales du grec.
  terminology: Bethphagé, Béthanie, « mont des Oliviers » et « disciples » sont des formes françaises établies. Aucun enjeu théologique n’est en cause.
  issues:
  - severity: medium
    issue: Aspect verbal de ἤγγισεν
    rationale: Le grec emploie l’aoriste ἤγγισεν, tandis que « il approchait » impose un déroulement imperfectif. « Lorsqu’il approcha » rend plus directement la narration aoristique.
  - severity: medium
    issue: Rendu artificiel du nom du mont et note redondante
    rationale: Le grec désigne le mont par son appellation elliptique « [des] Oliviers », mais le français possède le nom géographique idiomatique « le mont des Oliviers ». Le développement français ne constitue pas une interprétation doctrinale; la note proposée ne fournit donc pas une alternative utile.
  revised_text: Et il arriva que, lorsqu’il approcha de Bethphagé et de Béthanie, vers le mont des Oliviers, il envoya deux des disciples.
  revised_footnotes: []
  revision_rationale: La révision emploie le passé simple narratif pour l’aoriste et le nom français usuel « le mont des Oliviers », qui exprime naturellement l’appellation grecque sans introduire de contenu supplémentaire. La note est supprimée, car elle ne signale plus une alternative textuellement nécessaire.
