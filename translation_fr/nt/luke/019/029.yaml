id: LUK.19.29
reference: Luke 19:29
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ὡς ἤγγισεν εἰς Βηθφαγὴ καὶ Βηθανίαν πρὸς τὸ ὄρος τὸ καλούμενον Ἐλαιῶν, ἀπέστειλεν δύο τῶν ⸀μαθητῶν
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/029.yaml
  text: And it happened that[a], as he came near to Bethphage and Bethany, toward the mount called Olives, he sent two of the disciples
translation:
  language: fr
  text: Et il arriva que, lorsqu’il approcha de Bethphagé et de Béthanie, vers le mont des Oliviers, il envoya deux des disciples.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ ἐγένετο
  choice: Et il arriva que
  rationale: Cette formule narrative fréquente chez Luc est conservée sous une forme française actuelle et digne, sans recourir à l’archaïque « il advint ».
- source_word: ὡς
  choice: comme
  rationale: Dans ce contexte, ὡς introduit une proposition temporelle et présente l’approche comme étant en cours. « Comme » en maintient la nuance, tandis que « lorsqu’il fut arrivé près de » serait trop ponctuel.
- source_word: ἤγγισεν
  choice: il approchait
  rationale: Le verbe ἐγγίζω indique qu’il se rapprochait des lieux mentionnés. L’imparfait français convient naturellement après « comme » et exprime ce mouvement en cours.
- source_word: εἰς Βηθφαγὴ καὶ Βηθανίαν
  choice: de Bethphagé et de Béthanie
  rationale: Avec le verbe français « approcher », la tournure idiomatique est « approcher de ». Les noms propres suivent leur forme française traditionnelle et largement reconnue.
- source_word: πρὸς τὸ ὄρος
  choice: vers le mont
  rationale: πρός exprime ici l’orientation ou la situation par rapport au relief. « Mont » convient au nom géographique qui suit et reste naturel en français biblique moderne.
- source_word: τὸ καλούμενον Ἐλαιῶν
  choice: appelé « des Oliviers »
  rationale: La formulation resserrée du grec, où Ἐλαιῶν est un génitif pluriel signifiant « des oliviers », est conservée dans le texte. Une note donne la formulation française développée et familière sans l’introduire silencieusement dans le texte principal.
- source_word: ἀπέστειλεν
  choice: il envoya
  rationale: Ce passé simple rend clairement l’action narrative ponctuelle de l’aoriste grec.
- source_word: δύο τῶν μαθητῶν
  choice: deux des disciples
  rationale: Cette traduction reproduit la construction partitive du grec. Le contexte indique qu’il s’agit des disciples de Jésus, mais le possessif « ses » n’est pas exprimé ici.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe narrative de Luc demeure perceptible, tandis que les temps verbaux et les prépositions suivent l’usage naturel du français. La désignation inhabituelle du mont est conservée dans le texte et explicitée en note.
