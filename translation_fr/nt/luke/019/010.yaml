id: LUK.19.10
reference: Luke 19:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἦλθεν γὰρ ὁ υἱὸς τοῦ ἀνθρώπου ζητῆσαι καὶ σῶσαι τὸ ἀπολωλός.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/010.yaml
  text: For the Son of Man came to seek and to save the lost[a].
translation:
  language: fr
  text: Car le Fils de l’homme est venu chercher et sauver ce qui était perdu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ceux qui étaient perdus ». L’expression grecque est au singulier neutre et peut être comprise dans un sens générique.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθεν
  choice: est venu
  rationale: L’aoriste de ἔρχομαι est rendu naturellement en français par le passé composé dans cette déclaration qui résume la mission de Jésus. Cette formulation conserve l’idée de venue sans ajouter une nuance étrangère au texte.
- source_word: γὰρ
  choice: Car
  rationale: γάρ introduit l’explication de l’affirmation précédente. « Car » exprime ce lien de manière concise et digne.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: le Fils de l’homme
  rationale: Cette désignation que Jésus emploie pour lui-même est conservée sous sa forme française reconnue afin de préserver ses résonances bibliques et théologiques.
- source_word: ζητῆσαι
  choice: chercher
  rationale: L’infinitif aoriste exprime ici le but de la venue. « Chercher » rend directement l’idée d’une recherche intentionnelle.
- source_word: σῶσαι
  choice: sauver
  rationale: Dans Luc, σῴζω possède ici une portée qui dépasse le simple secours physique, notamment en lien avec le salut mentionné au verset précédent. « Sauver » en préserve toute l’ampleur.
- source_word: τὸ ἀπολωλός
  choice: ce qui était perdu
  rationale: Le participe parfait substantivé est neutre singulier et peut avoir une valeur générique. « Ce qui était perdu » respecte sa forme et son amplitude sans le limiter explicitement à un seul individu.
theological_decisions:
- issue: Portée et nuance de τὸ ἀπολωλός
  choice: ce qui était perdu
  alternative: ceux qui étaient perdus / la personne qui était perdue
  rationale: Le neutre singulier grec peut désigner de façon générique ce qui se trouve dans l’état d’être perdu. Dans le contexte, il concerne immédiatement Zachée tout en formulant plus largement la mission de Jésus. La traduction retenue préserve cette tension et évite de préciser indûment le nombre ou le genre des personnes visées.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé composé est plus idiomatique que le passé simple dans une déclaration actuelle, tandis que « Car » et « le Fils de l’homme » maintiennent le registre biblique sans archaïsme excessif.
