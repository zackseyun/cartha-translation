  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ διὰ τί οὐκ ἔδωκάς ⸂μου τὸ ἀργύριον⸃ ἐπὶ τράπεζαν; κἀγὼ ἐλθὼν σὺν τόκῳ ἂν ⸂αὐτὸ ἔπραξα⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/023.yaml
  text: And why did you not put my money in the bank? Then when I came[a], I would have collected it with interest.
translation:
  language: fr
  text: Alors, pourquoi n’as-tu pas déposé mon argent à la banque ? À mon retour, je l’aurais récupéré avec des intérêts.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ τί
  choice: pourquoi
  rationale: Interrogation idiomatique qui demande la raison et conserve la force du reproche.
- source_word: ἔδωκάς ... ἐπὶ τράπεζαν
  choice: déposé ... à la banque
  rationale: L’expression évoque littéralement le fait de mettre l’argent sur une table de changeur; dans ce contexte financier, « déposer à la banque » en exprime naturellement le sens.
- source_word: μου τὸ ἀργύριον
  choice: mon argent
  rationale: ἀργύριον peut désigner l’argent-métal ou la monnaie; ici, « argent » convient naturellement au cadre commercial.
- source_word: κἀγὼ ἐλθὼν
  choice: À mon retour
  rationale: La construction participiale exprime le moment où le maître revient; cette formulation française est concise et idiomatique.
- source_word: σὺν τόκῳ
  choice: avec des intérêts
  rationale: τόκος désigne ici le rendement financier d’un dépôt; « intérêts » est le terme français moderne usuel.
- source_word: αὐτὸ ἔπραξα
  choice: je l’aurais récupéré
  rationale: πράσσω a ici le sens commercial de recouvrer ou percevoir une somme; le conditionnel passé rend la potentialité irréalisée marquée par ἄν.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La métaphore bancaire ancienne est rendue par un vocabulaire financier immédiatement compréhensible, sans expliciter davantage que le grec.
