id: LUK.19.17
reference: Luke 19:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτῷ· ⸀Εὖγε, ἀγαθὲ δοῦλε, ὅτι ἐν ἐλαχίστῳ πιστὸς ἐγένου, ἴσθι ἐξουσίαν ἔχων ἐπάνω δέκα πόλεων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/017.yaml
  text: And he said to him[a], “Well done, good servant; because you were faithful in a very small matter, have authority over ten cities.”
translation:
  language: fr
  text: 'Il lui dit : « Très bien, bon serviteur[a] ! Puisque tu as été fidèle dans une toute petite affaire, aie autorité sur dix villes. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « esclave ». Le mot grec doulos peut désigner un serviteur ou un esclave selon le contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὖγε
  choice: Très bien
  rationale: Exclamation française naturelle exprimant l’approbation, sans ajouter au sens du grec.
- source_word: ἀγαθὲ
  choice: bon
  rationale: Équivalent direct de l’adjectif dans cette apostrophe.
- source_word: δοῦλε
  choice: serviteur
  rationale: Dans le cadre de cette parabole, « serviteur » exprime naturellement la relation de subordination au maître; « esclave », également possible lexicalement, est signalé en note.
- source_word: ἐν ἐλαχίστῳ
  choice: dans une toute petite affaire
  rationale: Rend l’idée d’un domaine ou d’une responsabilité minime dans un français contemporain et clair.
- source_word: πιστὸς ἐγένου
  choice: tu as été fidèle
  rationale: Reproduit sobrement l’évaluation formulée par le maître sans renforcer le grec par « tu as fait tes preuves ».
- source_word: ἴσθι ἐξουσίαν ἔχων
  choice: reçois autorité
  rationale: Exprime naturellement la valeur impérative et l’attribution effective d’une autorité, tout en évitant la tournure française peu idiomatique « sois ayant autorité ».
- source_word: ἐπάνω δέκα πόλεων
  choice: sur dix villes
  rationale: Conserve l’image d’une autorité administrative exercée sur dix villes.
theological_decisions:
- issue: Traduction de δοῦλος dans une parabole mettant en scène un maître et son subordonné
  choice: serviteur
  alternative: esclave
  rationale: « Serviteur » convient au registre parabolique et reste naturel en français, tandis que la note préserve la portée sociale plus forte que peut avoir le terme grec.
- issue: Force de l’impératif ἴσθι ἐξουσίαν ἔχων
  choice: reçois autorité
  alternative: aie autorité
  rationale: Le contexte présente l’autorité comme une récompense désormais accordée. « Reçois autorité » rend cette attribution sans transformer la phrase en promesse future.
translation_notes:
  register: Français international moderne, digne et oralement naturel. La ponctuation conserve le mouvement de l’adresse directe et de la récompense prononcée par le maître.
