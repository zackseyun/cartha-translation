  text: Καὶ ὡς ἤγγισεν, ἰδὼν τὴν πόλιν ἔκλαυσεν ἐπ’ ⸀αὐτήν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/041.yaml
  text: And as he drew near[a], seeing the city, he wept over it,
translation:
  language: fr
  text: Alors qu’il approchait, il vit la ville et pleura sur elle.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡς ἤγγισεν
  choice: Alors qu’il approchait
  rationale: Cette tournure rend le rapport temporel exprimé par ὡς et le mouvement d’approche indiqué par ἐγγίζω, sans préciser un complément que le grec laisse implicite.
- source_word: ἰδὼν τὴν πόλιν
  choice: il vit la ville
  rationale: Le participe aoriste indique ici une perception liée de près à l’action principale. Une proposition verbale est plus naturelle en français tout en conservant l’ordre des événements.
- source_word: ἔκλαυσεν
  choice: il pleura
  rationale: Le verbe κλαίω exprime le fait de pleurer. « Pleura » garde la force émotionnelle et la dignité du texte sans ajouter une intensité non explicitée.
- source_word: ἐπ’ αὐτήν
  choice: sur elle
  rationale: Avec κλαίω, ἐπί suivi de l’accusatif désigne l’objet de la lamentation. « Sur elle » est idiomatique en français et s’accorde naturellement avec le nom féminin « ville ».
theological_decisions:
- issue: Préserver le féminin grammatical de πόλις et une possible personnification de Jérusalem
  choice: sur elle
  alternative: à son sujet / sur la ville
  rationale: En français, « ville » est grammaticalement féminin; « elle » est donc naturel et fidèle à αὐτήν. Cette formulation laisse aussi ouverte la possible personnification de Jérusalem sans l’imposer.
translation_notes:
  register: Français moderne, sobre et digne. La coordination transforme naturellement le participe grec en proposition personnelle sans expliciter « Jérusalem », déjà identifiable par le contexte.
