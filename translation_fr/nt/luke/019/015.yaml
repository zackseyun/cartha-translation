id: LUK.19.15
reference: Luke 19:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἐγένετο ἐν τῷ ἐπανελθεῖν αὐτὸν λαβόντα τὴν βασιλείαν καὶ εἶπεν φωνηθῆναι αὐτῷ τοὺς δούλους τούτους οἷς ⸀δεδώκει τὸ ἀργύριον, ἵνα ⸀γνοῖ τί ⸀διεπραγματεύσαντο.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/015.yaml
  text: And it happened[a], when he returned after receiving the kingdom, that he ordered these servants to whom he had given the money to be called to him[b], so that he might know what they had gained by trading.
translation:
  language: fr
  text: À son retour, après avoir reçu le pouvoir royal, il ordonna qu’on appelle auprès de lui les esclaves[a] auxquels il avait donné l’argent, afin de savoir ce qu’ils avaient gagné en faisant du commerce[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « serviteurs ». Le mot grec peut désigner des esclaves ou, selon le contexte, des serviteurs.
    reason: lexical_alternative
  - marker: b
    text: Ou « quelles affaires ils avaient faites » ou « quel profit ils avaient réalisé ». Le verbe grec évoque l’activité commerciale et son résultat.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ἐν τῷ ἐπανελθεῖν αὐτὸν
  choice: À son retour
  rationale: La tournure grecque introduit temporellement l’action. En français actuel, « À son retour » rend naturellement l’ensemble sans reproduire lourdement la formule narrative « il arriva que ».
- source_word: λαβόντα τὴν βασιλείαν
  choice: après avoir reçu le pouvoir royal
  rationale: Le participe exprime une action antérieure. Dans le cadre politique de la parabole, βασιλεία désigne ici la dignité ou l’autorité royale reçue, plutôt qu’un territoire.
- source_word: φωνηθῆναι αὐτῷ
  choice: qu’on appelle auprès de lui
  rationale: Le passif de φωνέω a ici le sens de faire appeler ou convoquer quelqu’un. Cette formulation reste proche du grec et naturelle en français.
- source_word: δούλους
  choice: esclaves
  rationale: Le terme désigne des personnes juridiquement soumises à leur maître. « Esclaves » préserve cette réalité sociale, tandis que « serviteurs » demeure une possibilité contextuelle signalée en note.
- source_word: δεδώκει τὸ ἀργύριον
  choice: avait donné l’argent
  rationale: Le plus-que-parfait rend l’action antérieure, et ἀργύριον désigne ici les fonds confiés auparavant, sans répéter l’unité monétaire nommée dans le contexte.
- source_word: ἵνα γνοῖ
  choice: afin de savoir
  rationale: Cette formulation rend clairement la valeur finale de la proposition introduite par ἵνα.
- source_word: τί διεπραγματεύσαντο
  choice: ce qu’ils avaient gagné en faisant du commerce
  rationale: Le verbe évoque à la fois l’activité commerciale et son résultat. La traduction explicite ces deux dimensions sans réduire le sens au seul profit.
theological_decisions:
- issue: Sens de βασιλεία dans le cadre de la parabole
  choice: pouvoir royal
  alternative: royaume
  rationale: Le noble reçoit ici l’autorité de régner. « Pouvoir royal » rend ce sens politique sans suggérer nécessairement qu’il reçoit un territoire matériel.
- issue: Traduction de δοῦλος dans une relation socio-économique antique
  choice: esclaves
  alternative: serviteurs
  rationale: L’autorité exercée par le noble et la condition liée des personnages rendent leur statut servile saillant. La traduction ne tire de ce choix aucune conclusion doctrinale supplémentaire.
- issue: Portée de διεπραγματεύσαντο
  choice: ce qu’ils avaient gagné en faisant du commerce
  alternative: quelles affaires ils avaient faites
  rationale: Le contexte porte sur le résultat obtenu avec l’argent remis, mais le verbe désigne aussi l’activité commerciale. La formulation retenue conserve les deux aspects.
translation_notes:
  register: Français international moderne, clair et digne. La phrase grecque a été légèrement restructurée pour éviter une formule narrative pesante, tout en conservant l’ordre temporel et la finalité de la convocation.
