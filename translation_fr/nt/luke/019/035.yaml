  text: καὶ ἤγαγον αὐτὸν πρὸς τὸν Ἰησοῦν, καὶ ἐπιρίψαντες ⸀αὐτῶν τὰ ἱμάτια ἐπὶ τὸν πῶλον ἐπεβίβασαν τὸν Ἰησοῦν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/035.yaml
  text: And they brought it to Jesus[a], and after throwing their cloaks on the colt[b], they put Jesus on it.
translation:
  language: fr
  text: Ils l’amenèrent à Jésus et, après avoir jeté leurs manteaux sur l’ânon[a], ils y firent monter Jésus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot grec désigne un jeune animal ; dans le contexte du récit, il s’agit vraisemblablement d’un jeune âne.
    reason: lexical_clarification
lexical_decisions:
- source_word: ἤγαγον αὐτὸν
  choice: Ils l’amenèrent
  rationale: Le verbe ἄγω exprime ici le fait de conduire ou d’amener l’animal auprès de Jésus. Le pronom français masculin « l’ » reprend naturellement « l’ânon », sans qu’il soit nécessaire d’expliciter le genre grammatical du grec.
- source_word: πρὸς τὸν Ἰησοῦν
  choice: à Jésus
  rationale: Avec l’accusatif, πρός indique ici un mouvement en direction d’une personne ; « à Jésus » est la formulation française la plus naturelle.
- source_word: ἐπιρίψαντες
  choice: après avoir jeté
  rationale: Le participe aoriste présente cette action comme antérieure au fait de faire monter Jésus. Cette formulation rend clairement la succession des gestes.
- source_word: αὐτῶν τὰ ἱμάτια
  choice: leurs manteaux
  rationale: Ἱμάτια désigne ici les vêtements extérieurs utilisés comme couverture improvisée sur l’animal ; « manteaux » est précis et courant.
- source_word: πῶλον
  choice: ânon
  rationale: Πῶλος désigne un jeune animal. Le contexte immédiat précise qu’il s’agit du petit d’une ânesse ; « ânon » communique donc clairement le référent en français.
- source_word: ἐπεβίβασαν τὸν Ἰησοῦν
  choice: ils y firent monter Jésus
  rationale: 'Le verbe est causatif : les disciples font monter Jésus sur l’animal. « Y firent monter » conserve ce sens tout en évitant une tournure lourde ou ambiguë.'
theological_decisions: []
translation_notes:
  register: Français moderne, international et narratif. La structure conserve la succession des actions du grec tout en évitant le calque. « Ânon » est plus immédiatement clair en français que le terme générique « petit ».
