  text: καλέσας δὲ δέκα δούλους ἑαυτοῦ ἔδωκεν αὐτοῖς δέκα μνᾶς καὶ εἶπεν πρὸς αὐτούς· ⸀Πραγματεύσασθε ⸂ἐν ᾧ⸃ ἔρχομαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/013.yaml
  text: After calling ten of his own servants[a], he gave them ten minas and said to them[c][b], “Do business until I come.”
translation:
  language: fr
  text: 'Après avoir appelé dix de ses esclaves[a], il leur donna dix mines[b] et leur dit : « Faites des affaires jusqu’à mon retour[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « serviteurs ». Le mot grec peut désigner un serviteur ou un esclave selon le contexte.
    reason: alternative_reading
  - marker: b
    text: La mine était une unité monétaire de l’Antiquité.
    reason: cultural_note
  - marker: c
    text: Ou « Faites du commerce jusqu’à ce que je revienne ».
    reason: lexical_alternative
lexical_decisions:
- source_word: καλέσας
  choice: Après avoir appelé
  rationale: Le participe aoriste exprime une action antérieure au verbe principal ; cette tournure rend naturellement la succession.
- source_word: δούλους ἑαυτοῦ
  choice: ses esclaves
  rationale: Dans le cadre social de la parabole, ces hommes appartiennent au maître. « Esclaves » préserve cette réalité, tandis que le possessif français suffit à rendre ἑαυτοῦ.
- source_word: μνᾶς
  choice: mines
  rationale: La translittération du nom de cette unité monétaire ancienne évite une équivalence trompeuse avec une monnaie moderne.
- source_word: Πραγματεύσασθε
  choice: Faites-les fructifier
  rationale: Dans ce contexte, l’impératif demande d’employer les sommes confiées dans une activité commerciale rentable. La reprise pronominale explicite naturellement en français l’objet sous-entendu.
- source_word: ἐν ᾧ ἔρχομαι
  choice: jusqu’à mon retour
  rationale: La locution temporelle signifie ici « jusqu’à ce que je revienne ». La formulation nominale est idiomatique et rend explicite le retour impliqué par le contexte.
theological_decisions:
- issue: Traduction de δοῦλος dans une parabole fondée sur le rapport maître-esclave
  choice: esclaves
  alternative: serviteurs
  rationale: Le rapport d’appartenance est pertinent dans le récit. « Esclaves » conserve la réalité sociale du texte sans lui ajouter une portée doctrinale étrangère.
- issue: Portée de l’ordre Πραγματεύσασθε
  choice: Faites-les fructifier
  alternative: Faites du commerce
  rationale: Le choix retenu exprime l’usage productif de l’argent confié sans limiter arbitrairement l’activité à une forme précise de commerce.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe reste accessible ; le terme historique « esclaves » et l’unité « mines » préservent le cadre antique, avec des notes pour les lecteurs.
