review_pass:
  verdict: revise
  source_fidelity: Le début du verset rend fidèlement le participe aoriste καλέσας, le possessif réfléchi ἑαυτοῦ, les dix esclaves et les dix mines. En revanche, « Faites-les fructifier » ajoute un objet explicite (« les [mines] ») et, surtout, l’idée de rendement/profit, alors que πραγματεύσασθε désigne plus largement l’activité commerciale. L’ordre est mieux rendu par « Faites des affaires ». « Jusqu’à mon retour » rend correctement l’idiome temporel ἐν ᾧ ἔρχομαι dans ce contexte.
  naturalness: « Après avoir appelé dix de ses esclaves » et « il leur donna dix mines » sont naturels en français international moderne. « Faites des affaires jusqu’à mon retour » est idiomatique, direct et conserve le registre narratif de la parabole.
  terminology: « Esclaves » rend justement δοῦλοι dans ce cadre social et la note alternative « serviteurs » est appropriée. « Mines » avec une note culturelle est exact. La note c doit éviter de présenter comme littérale une formulation qui ne l’est pas strictement et doit refléter le sens commercial large du verbe.
