    rationale: La formulation introduit le pronom renvoyant aux mines et accentue l’obtention d’un profit. Le grec commande une activité commerciale sans préciser l’objet grammatical ni garantir un résultat profitable.
  - severity: low
    issue: La note c qualifie abusivement de « Littéralement » une traduction interprétative.
    rationale: ἐν ᾧ ἔρχομαι est littéralement plus proche de « pendant que je viens », bien que son sens idiomatique dans le contexte soit « jusqu’à ce que je vienne/revienne ». La note devrait proposer des équivalents sans cette étiquette.
