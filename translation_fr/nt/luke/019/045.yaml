  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ εἰσελθὼν εἰς τὸ ἱερὸν ἤρξατο ἐκβάλλειν τοὺς ⸀πωλοῦντας,
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/045.yaml
  text: And entering the temple[a], he began to drive out those who were selling,
translation:
  language: fr
  text: Puis il entra dans le temple[a] et se mit à chasser ceux qui vendaient,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’enceinte du temple » ou « les cours du temple »; le grec ἱερόν désigne l’ensemble du complexe du temple, et non spécifiquement le sanctuaire intérieur.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσελθὼν
  choice: il entra
  rationale: Le participe aoriste exprime ici une action qui précède le début de l’action principale. Une proposition coordonnée est naturelle en français narratif et préserve clairement la succession.
- source_word: ἱερὸν
  choice: temple
  rationale: Ἱερόν désigne l’ensemble du complexe du temple, et non spécifiquement le sanctuaire intérieur. « Temple » reste la formulation concise et courante; la note précise la portée spatiale.
- source_word: ἤρξατο
  choice: se mit à
  rationale: Avec l’infinitif, ἤρξατο marque le commencement de l’action. « Se mit à » est idiomatique en français et conserve cet aspect ingressif.
- source_word: ἐκβάλλειν
  choice: chasser
  rationale: Le verbe exprime une expulsion énergique. « Chasser » rend cette force de façon naturelle, sans archaïsme ni précision excessive sur les moyens employés.
- source_word: πωλοῦντας
  choice: ceux qui vendaient
  rationale: Le participe présent substantivé désigne les personnes occupées à vendre. La formulation garde l’activité en cours sans préciser ce qu’elles vendaient, puisque le verset ne le dit pas.
theological_decisions:
- issue: Portée de ἱερόν dans le récit de l’intervention de Jésus au temple
  choice: « temple » dans le texte, au sens de l’ensemble du complexe du temple
  alternative: « cours du temple », « enceinte du temple » ou « sanctuaire »
  rationale: Le grec ἱερόν renvoie normalement au complexe du temple plutôt qu’au sanctuaire intérieur. Le texte principal conserve la désignation courante, tandis que la note empêche une lecture spatialement trop étroite.
translation_notes:
  register: Français international moderne, narratif et digne. « Puis il entra… et se mit à… » évite le calque peu naturel « étant entré » tout en maintenant l’ordre des actions et le commencement marqué par ἤρξατο.
