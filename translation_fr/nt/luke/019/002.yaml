  text: καὶ ἰδοὺ ἀνὴρ ὀνόματι ⸀καλούμενος Ζακχαῖος, καὶ αὐτὸς ἦν ἀρχιτελώνης καὶ ⸀αὐτὸς πλούσιος·
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/002.yaml
  text: And behold[a], a man named Zacchaeus; he was a chief tax collector and was rich.
translation:
  language: fr
  text: Et voici un homme appelé Zachée ; il était chef des collecteurs d’impôts et il était riche.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: voici
  rationale: « Voici » conserve le marqueur qui attire l’attention et donne de la vivacité au récit, tout en restant naturel en français biblique moderne.
- source_word: ἀνὴρ
  choice: un homme
  rationale: Le nom grec désigne ici explicitement un individu de sexe masculin.
- source_word: ὀνόματι καλούμενος
  choice: appelé
  rationale: La tournure grecque signifie naturellement « appelé » ou « nommé ». « Appelé Zachée » est clair et idiomatique sans reproduire lourdement la mention littérale du nom.
- source_word: Ζακχαῖος
  choice: Zachée
  rationale: Forme française traditionnelle et largement reconnue de ce nom propre.
- source_word: αὐτὸς ἦν
  choice: c’était
  rationale: Le pronom reprend et met légèrement en relief le personnage. La tournure présentative française assure naturellement cette reprise sans accentuation réflexive excessive.
- source_word: ἀρχιτελώνης
  choice: chef des collecteurs d’impôts
  rationale: Le composé désigne un collecteur d’impôts de rang supérieur ou dirigeant; cette formulation en conserve clairement le sens hiérarchique.
- source_word: αὐτὸς πλούσιος
  choice: il était riche
  rationale: « Riche » rend directement πλούσιος. Le second αὐτός apporte tout au plus une légère insistance, que le français n’a pas besoin d’exprimer par « lui-même ».
theological_decisions: []
translation_notes:
  register: Français moderne, courant et digne. « Voici » maintient la vivacité narrative de Luc; la seconde phrase évite un calque lourd tout en conservant séparément le rang professionnel et la richesse de Zachée.
