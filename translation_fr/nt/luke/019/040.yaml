id: LUK.19.40
reference: Luke 19:40
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ⸀εἶπεν· Λέγω ὑμῖν, ⸀ὅτι ἐὰν οὗτοι ⸀σιωπήσουσιν, οἱ λίθοι ⸀κράξουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/040.yaml
  text: And answering[a], he said, “I tell you, if these become silent, the stones will cry out.”
translation:
  language: fr
  text: 'Il leur répondit : « Je vous le dis, si eux se taisent[a], les pierres crieront. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « gardent le silence » ou « cessent de parler ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς … εἶπεν
  choice: Il leur répondit
  rationale: Le participe ἀποκριθείς exprime la réponse et le verbe εἶπεν l'acte de parler. En français moderne, « Il leur répondit » rend naturellement l'ensemble sans la lourdeur de « Répondant, il dit ». Le pronom « leur » explicite le complément déjà fourni par le contexte immédiat.
- source_word: Λέγω ὑμῖν
  choice: Je vous le dis
  rationale: Cette formule française courante conserve la force directe et solennelle de la formule emphatique grecque.
- source_word: ὅτι ἐὰν
  choice: si
  rationale: ὅτι introduit le contenu de la déclaration, immédiatement formulé comme une condition avec ἐάν. En français, un « que » explicite avant « si » serait inutile et peu naturel.
- source_word: οὗτοι
  choice: eux
  rationale: Le démonstratif désigne les personnes qui acclament Jésus dans le contexte. « Eux » garde la référence personnelle et l'emphase sans ajouter « disciples » ou « gens » au texte.
- source_word: σιωπήσουσιν
  choice: se taisent
  rationale: Le futur grec placé après ἐάν formule l'éventualité de cesser de parler. Le présent français après « si » est la construction idiomatique normale et « se taisent » convient au passage de l'acclamation au silence.
- source_word: οἱ λίθοι
  choice: les pierres
  rationale: Traduction directe qui conserve l'article et l'image concrète du grec.
- source_word: κράξουσιν
  choice: crieront
  rationale: Le verbe κράζω indique un cri puissant. « Crieront » restitue cette vigueur et forme un contraste net avec « se taisent ».
theological_decisions:
- issue: Faut-il expliquer l'image des pierres qui crient comme métaphorique ou miraculeuse ?
  choice: 'Conserver sans explication dans le texte l''image littérale : « les pierres crieront »'
  alternative: Expliciter que les pierres témoigneraient symboliquement ou que la création louerait Dieu
  rationale: Le grec ne précise pas la nature de l'image. La formulation retenue préserve sa force rhétorique ainsi que l'ambiguïté entre hyperbole, image prophétique et possibilité miraculeuse.
translation_notes:
  register: Français international moderne, direct et digne. La syntaxe évite un calque participial peu naturel tout en gardant le caractère de réponse. L'image finale demeure brève, frappante et non interprétée.
