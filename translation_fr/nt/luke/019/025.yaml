  text: καὶ εἶπαν αὐτῷ· Κύριε, ἔχει δέκα μνᾶς—
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/025.yaml
  text: And they said to him[a], ‘Lord[b], he has ten minas—’
translation:
  language: fr
  text: 'Et ils lui dirent : « Seigneur[a], il a dix mines[b]… »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Maître » ou « Monsieur ».
    reason: lexical_alternative
  - marker: b
    text: La mine était une ancienne unité monétaire équivalant approximativement au salaire de cent journées de travail.
    reason: cultural_note
lexical_decisions:
- source_word: καὶ
  choice: Et
  rationale: Conserve la coordination narrative simple sans ajouter une nuance temporelle ou adversative.
- source_word: εἶπαν αὐτῷ
  choice: ils lui dirent
  rationale: L’aoriste est rendu naturellement par le passé simple dans ce registre narratif, et le datif αὐτῷ par le pronom indirect « lui ».
- source_word: Κύριε
  choice: Seigneur
  rationale: Le vocatif κύριε exprime ici l’adresse respectueuse à l’homme investi d’autorité dans la parabole. « Seigneur » en conserve la portée tout en laissant ouverte la possibilité contextuelle de « Maître » ou « Monsieur ».
- source_word: ἔχει
  choice: il a
  rationale: Rend directement le présent de possession, sans ajouter l’idée de « déjà », absente du grec.
- source_word: δέκα μνᾶς
  choice: dix mines
  rationale: Le terme historique μνᾶ est translittéré sous sa forme française usuelle plutôt que remplacé par une monnaie moderne potentiellement trompeuse.
theological_decisions:
- issue: Valeur de κύριος dans l’adresse directe au sein de la parabole
  choice: Seigneur
  alternative: Maître ou Monsieur
  rationale: « Seigneur » préserve le sens d’autorité et la résonance du terme κύριος sans transformer nécessairement cette réplique des personnages en confession christologique.
translation_notes:
  register: Français moderne, naturel et digne. Les points de suspension rendent la suspension marquée par le tiret final de l’édition grecque et laissent la protestation ouverte sur la réponse du verset suivant.
