id: LUK.19.46
reference: Luke 19:46
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: λέγων αὐτοῖς· Γέγραπται· ⸂Καὶ ἔσται⸃ ὁ οἶκός μου οἶκος ⸀προσευχῆς, ὑμεῖς δὲ αὐτὸν ἐποιήσατε σπήλαιον λῃστῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/046.yaml
  text: saying to them[a], “It is written[b], ‘And my house shall be a house of prayer,’ but you have made it a den of robbers.”
translation:
  language: fr
  text: 'Il leur disait : « Il est écrit : “Et ma maison[a] sera une maison de prière”, mais vous, vous en avez fait un repaire de brigands[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « mon temple sera une maison de prière ». Le grec dit « ma maison », en écho à Ésaïe 56.7.'
    reason: lexical_alternative
  - marker: b
    text: « Repaire de brigands » fait écho à Jérémie 7.11. Le mot traduit par « brigands » peut aussi être rendu par « voleurs » ou « bandits ».
    reason: cross_reference
lexical_decisions:
- source_word: λέγων αὐτοῖς
  choice: Il leur disait
  rationale: Cette formulation française naturelle conserve l’idée du participe présent rattaché au récit précédent, sans produire ici une phrase fragmentaire.
- source_word: Γέγραπται
  choice: Il est écrit
  rationale: Formule française consacrée qui rend le parfait passif introduisant une citation faisant autorité.
- source_word: Καὶ ἔσται
  choice: Et … sera
  rationale: Conserve la conjonction initiale et le futur de la citation d’Ésaïe.
- source_word: ὁ οἶκός μου
  choice: ma maison
  rationale: Rend directement οἶκος et préserve l’écho scripturaire ainsi que l’image de la maison de Dieu, même si le temple est le référent contextuel.
- source_word: οἶκος προσευχῆς
  choice: une maison de prière
  rationale: Rend naturellement le génitif grec tout en conservant la formulation reconnaissable de la citation.
- source_word: ὑμεῖς δὲ
  choice: mais vous, vous
  rationale: Le redoublement idiomatique en français met en relief le pronom sujet emphatique et marque fortement le contraste.
- source_word: αὐτὸν ἐποιήσατε
  choice: vous en avez fait
  rationale: Le passé composé exprime naturellement l’action accomplie et son résultat présent; « en » renvoie à la maison sans difficulté de genre grammatical.
- source_word: σπήλαιον
  choice: repaire
  rationale: Dans l’écho à Jérémie 7.11, il s’agit d’un refuge ou d’un lieu de rassemblement de malfaiteurs plutôt que d’une simple grotte.
- source_word: λῃστῶν
  choice: brigands
  rationale: Le terme peut désigner des voleurs violents ou des bandits; « brigands » convient à l’expression prophétique sans imposer une lecture politique précise.
theological_decisions:
- issue: Rendre la citation concernant le temple par « maison » plutôt que par « temple »
  choice: ma maison … une maison de prière
  alternative: mon temple … une maison de prière
  rationale: Le grec emploie οἶκος dans la citation. « Maison » maintient le lien avec Ésaïe 56.7 et la tension entre l’image de la demeure de Dieu et son référent concret, le temple.
- issue: Portée de λῃσταί
  choice: brigands
  alternative: voleurs
  rationale: Le grec peut évoquer des voleurs, des bandits ou des brigands. « Brigands » conserve cette largeur de sens et l’écho à Jérémie 7.11 sans réduire l’accusation à un simple vol discret.
translation_notes:
  register: Français international moderne, digne et oralement fluide. Les citations emboîtées distinguent la parole de Jésus de la citation scripturaire. Le redoublement « mais vous, vous » restitue l’emphase grecque sans archaïsme.
