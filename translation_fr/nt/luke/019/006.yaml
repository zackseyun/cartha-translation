  text: And he hurried down and welcomed him joyfully[a].
translation:
  language: fr
  text: Il se dépêcha de descendre et l’accueillit avec joie.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Il se dépêcha, descendit et le reçut avec joie. »'
    reason: Variante de traduction qui restitue plus distinctement le participe σπεύσας, le verbe principal κατέβη et le sens plus littéral de ὑπεδέξατο.
lexical_decisions:
- source_word: σπεύσας
  choice: se dépêcha de
  rationale: Le participe aoriste exprime l’empressement et la promptitude; cette tournure est naturelle en français moderne et s’articule clairement avec « descendre ».
- source_word: κατέβη
  choice: descendre
  rationale: Le verbe indique un mouvement vers le bas, ici depuis l’arbre; l’infinitif dépend naturellement de « se dépêcha de » tout en conservant l’action exprimée en grec.
- source_word: ὑπεδέξατο
  choice: accueillit
  rationale: Le verbe désigne le fait de recevoir quelqu’un, souvent avec une nuance d’hospitalité; « accueillit » rend cette nuance sans ajout explicatif.
- source_word: αὐτόν
  choice: l’
  rationale: Le pronom masculin singulier renvoie à Jésus; l’élision devant « accueillit » est idiomatique.
- source_word: χαίρων
  choice: avec joie
  rationale: Le participe présent décrit l’état affectif qui accompagne l’accueil. « Avec joie » conserve ce rapport de manière et reste digne et naturel.
- source_word: καὶ ... καὶ
  choice: et
  rationale: La coordination simple relie les actions successives. En français, une seule conjonction entre les deux verbes suffit, sans qu’il soit nécessaire de reproduire mécaniquement le καί initial.
