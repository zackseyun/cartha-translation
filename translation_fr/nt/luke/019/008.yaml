id: LUK.19.8
reference: Luke 19:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: σταθεὶς δὲ Ζακχαῖος εἶπεν πρὸς τὸν κύριον· Ἰδοὺ τὰ ⸀ἡμίσιά ⸂μου τῶν ὑπαρχόντων⸃, κύριε, ⸂τοῖς πτωχοῖς δίδωμι⸃, καὶ εἴ τινός τι ἐσυκοφάντησα ἀποδίδωμι τετραπλοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/008.yaml
  text: But Zacchaeus stood and said to the Lord[a], “Look, Lord, I give half of my possessions to the poor, and if I have extorted anything from anyone[b], I repay it fourfold.”
translation:
  language: fr
  text: 'Mais Zachée, debout, dit au Seigneur : « Voici, Seigneur, je donne la moitié de mes biens aux pauvres et, si j’ai extorqué quoi que ce soit à quelqu’un[a], je lui rends quatre fois autant[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « si j’ai fraudé quelqu’un de quoi que ce soit ». Le verbe grec peut désigner l’extorsion, l’exploitation ou la fraude, parfois au moyen d’une fausse accusation.
    reason: lexical_alternative
  - marker: b
    text: 'Les verbes grecs au présent peuvent aussi être compris comme exprimant une résolution immédiate : « je donnerai » et « je rendrai ».'
    reason: alternative_reading
lexical_decisions:
- source_word: σταθεὶς
  choice: debout
  rationale: Le participe aoriste de ἵστημι est employé ici de manière intransitive. « Debout » restitue sobrement la posture narrative sans préciser inutilement si Zachée vient de se lever ou s’est arrêté.
- source_word: κύριον / κύριε
  choice: Seigneur
  rationale: « Seigneur » préserve le titre adressé à Jésus, qui peut associer respect et portée christologique dans Luc, sans le réduire à « monsieur ».
- source_word: Ἰδοὺ
  choice: Écoute
  rationale: Dans cette prise de parole, ἰδού attire fortement l’attention sur la déclaration qui suit. « Écoute » est naturel en français oral moderne et garde cette fonction, là où « voici » serait moins idiomatique devant une proposition à la première personne.
- source_word: τὰ ἡμίσιά μου τῶν ὑπαρχόντων
  choice: la moitié de mes biens
  rationale: Le groupe désigne la moitié de ce que Zachée possède. « Mes biens » est concis, naturel et convient à des possessions matérielles.
- source_word: τοῖς πτωχοῖς
  choice: aux pauvres
  rationale: Cette substantivation de πτωχός désigne les personnes pauvres; « aux pauvres » en est l’équivalent français courant.
- source_word: δίδωμι
  choice: je donne
  rationale: Le présent français correspond directement au présent indicatif grec et laisse ouverte la question de savoir s’il décrit une pratique ou une résolution immédiate.
- source_word: εἴ τινός τι
  choice: si j’ai extorqué quoi que ce soit à quelqu’un
  rationale: La formulation rend les deux indéfinis grecs, la syntaxe étant réorganisée selon l’usage naturel du français.
- source_word: ἐσυκοφάντησα
  choice: j’ai extorqué
  rationale: Le verbe peut désigner une extorsion, une exploitation ou une fraude, parfois fondée sur une fausse accusation. « Extorqué » convient au contexte d’un chef des collecteurs d’impôts, tandis que la note conserve l’étendue sémantique.
- source_word: ἀποδίδωμι
  choice: je lui rends
  rationale: Le verbe signifie rendre ou restituer. Le pronom « lui » indique naturellement en français que la restitution revient à la personne lésée.
- source_word: τετραπλοῦν
  choice: quatre fois autant
  rationale: Cette expression française claire rend la restitution au quadruple indiquée par l’accusatif adverbial grec.
theological_decisions:
- issue: Valeur des présents δίδωμι et ἀποδίδωμι
  choice: 'Présent simple : « je donne… je lui rends »'
  alternative: 'Futur exprimant une résolution immédiate : « je donnerai… je lui rendrai »'
  rationale: Le grec emploie des présents de l’indicatif. Les conserver en français maintient l’ambiguïté entre pratique déclarée et engagement pris sur-le-champ, sans trancher une question théologique sur la chronologie de la repentance de Zachée.
- issue: Portée du titre κύριος
  choice: « Seigneur »
  alternative: « maître » ou « monsieur »
  rationale: « Seigneur » conserve à la fois la forme respectueuse de l’adresse et la possible portée christologique du titre dans le récit lucanien.
translation_notes:
  register: Français international moderne, digne et accessible. La ponctuation et la syntaxe privilégient une lecture orale fluide. Les deux présents sont volontairement maintenus afin de préserver l’ambiguïté du grec.
