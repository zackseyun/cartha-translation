  text: Pendant qu’il avançait, ils étendaient leurs manteaux sur le chemin.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πορευομένου δὲ αὐτοῦ
  choice: Pendant qu’il avançait
  rationale: Le génitif absolu avec le participe présent de πορεύομαι exprime une action simultanée. Cette formulation naturelle en français conserve la progression de la scène.
- source_word: δέ
  choice: non rendu séparément
  rationale: Ici, δέ est une articulation narrative légère. La continuité est naturellement exprimée en français par la proposition temporelle, sans qu’un « et » soit nécessaire.
- source_word: ὑπεστρώννυον
  choice: étendaient
  rationale: L’imparfait grec présente l’action comme en cours ou répétée; l’imparfait français en rend directement l’aspect.
- source_word: τὰ ἱμάτια ἑαυτῶν
  choice: leurs manteaux
  rationale: Ἱμάτια désigne des vêtements, souvent les vêtements de dessus. « Manteaux » est concret, idiomatique et adapté au geste décrit dans ce contexte.
- source_word: ἐν τῇ ὁδῷ
  choice: sur le chemin
  rationale: La préposition ἐν avec le datif indique ici le lieu. « Sur le chemin » rend naturellement l’endroit où les manteaux sont étendus, dans le passage de Jésus.
theological_decisions: []
translation_notes:
  register: Français international moderne, simple et digne. « Les gens » explicite le sujet pluriel implicite de ὑπεστρώννυον sans identifier plus précisément le groupe que ne le fait ce verset.
