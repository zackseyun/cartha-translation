id: LUK.19.9
reference: Luke 19:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἶπεν δὲ πρὸς αὐτὸν ὁ Ἰησοῦς ὅτι Σήμερον σωτηρία τῷ οἴκῳ τούτῳ ἐγένετο, καθότι καὶ αὐτὸς υἱὸς Ἀβραάμ ἐστιν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/009.yaml
  text: And Jesus said to him[a], “Today salvation has come to this house, because he too is a son of Abraham.”
translation:
  language: fr
  text: 'Jésus lui dit : « Aujourd’hui, le salut est venu pour cette maison[a], parce que lui aussi est un fils d’Abraham. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « pour les membres de cette maison ». Le mot grec peut désigner la maison elle-même ou les personnes qui y sont rattachées.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν δὲ πρὸς αὐτὸν ὁ Ἰησοῦς
  choice: Jésus lui dit
  rationale: Le pronom explicite est conservé par « lui ». Dans ce contexte narratif, le français n’a pas besoin de rendre δέ par une conjonction distincte.
- source_word: Σήμερον
  choice: Aujourd’hui
  rationale: Équivalent français naturel, placé en tête de la parole pour préserver l’accent temporel.
- source_word: σωτηρία
  choice: le salut
  rationale: « Salut » conserve la portée théologique habituelle du terme dans Luc, au-delà d’une simple délivrance ponctuelle.
- source_word: τῷ οἴκῳ τούτῳ
  choice: pour cette maison
  rationale: Le datif désigne ici le bénéficiaire ou le destinataire. « Maison » préserve le terme concret tout en pouvant évoquer les personnes qui y sont rattachées.
- source_word: ἐγένετο
  choice: est venu
  rationale: Dans cette construction, « est venu » exprime naturellement l’irruption présente du salut sans réduire γίνομαι à un simple déplacement spatial.
- source_word: καθότι
  choice: parce que
  rationale: Cette formulation moderne et claire introduit la raison donnée par Jésus.
- source_word: καὶ αὐτὸς
  choice: lui aussi
  rationale: La tournure souligne l’inclusion de cet homme parmi ceux auxquels s’applique l’identité mentionnée.
- source_word: υἱὸς Ἀβραάμ
  choice: un fils d’Abraham
  rationale: L’expression idiomatique est conservée avec sa force identitaire et son éventuelle résonance d’alliance, sans la réduire à la seule ascendance biologique.
theological_decisions:
- issue: Sens de « fils d’Abraham »
  choice: Conserver l’expression comme affirmation d’identité et d’appartenance, sans en préciser davantage la nature.
  alternative: Traduire explicitement par « descendant d’Abraham » ou « véritable membre de la famille croyante d’Abraham ».
  rationale: Le verset ne tranche pas à lui seul entre l’ascendance ethnique, l’appartenance fidèle au peuple d’Abraham, ou une combinaison des deux. L’expression biblique préserve cette tension.
translation_notes:
  register: Français international actuel, digne et accessible. La phrase reste proche de la structure grecque tout en évitant une syntaxe artificielle. « Pour cette maison » rend le datif bénéficiaire et permet de conserver l’ambiguïté entre le lieu et le foyer.
