id: LUK.19.43
reference: Luke 19:43
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὅτι ἥξουσιν ἡμέραι ἐπὶ σὲ καὶ ⸀παρεμβαλοῦσιν οἱ ἐχθροί σου χάρακά σοι καὶ περικυκλώσουσίν σε καὶ συνέξουσίν σε πάντοθεν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/043.yaml
  text: For days will come upon you when your enemies will build an embankment against you and surround you and hem you in on every side,[a]
translation:
  language: fr
  text: Car des jours viendront où tes ennemis établiront contre toi un ouvrage de siège[a], t’encercleront et te serreront de toutes parts.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un remblai de siège »; le terme peut aussi désigner une palissade de siège.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Car
  rationale: Introduit la raison ou l’explication de la lamentation précédente, avec une force causale naturelle en français.
- source_word: ἥξουσιν ἡμέραι ἐπὶ σὲ
  choice: des jours viendront sur toi
  rationale: Conserve l’idiome prophétique et solennel selon lequel les événements annoncés fondront sur Jérusalem.
- source_word: παρεμβαλοῦσιν
  choice: dresseront
  rationale: Avec χάρακα, désigne la mise en place ou la construction d’un dispositif de siège; « dresseront » convient naturellement à un ouvrage militaire.
- source_word: οἱ ἐχθροί σου
  choice: tes ennemis
  rationale: Restitution directe du groupe nominal possessif désignant les forces hostiles à Jérusalem.
- source_word: χάρακά σοι
  choice: contre toi un ouvrage de siège
  rationale: χάραξ peut désigner une levée, une palissade ou plus largement un ouvrage servant au siège. La formulation principale reste claire sans imposer une forme matérielle trop précise.
- source_word: περικυκλώσουσίν σε
  choice: t’encercleront
  rationale: Rend directement l’action militaire d’entourer complètement la ville.
- source_word: συνέξουσίν σε πάντοθεν
  choice: te serreront de toutes parts
  rationale: Exprime la contrainte et la pression exercées depuis toutes les directions, sans atténuer l’image du siège.
theological_decisions:
- issue: Référent des pronoms de deuxième personne dans la lamentation sur Jérusalem
  choice: Maintien du singulier « toi », qui s’adresse à Jérusalem personnifiée.
  alternative: Expliciter collectivement les habitants de Jérusalem.
  rationale: Les pronoms grecs sont au singulier et prolongent l’apostrophe à la ville. Les conserver préserve la force prophétique et poétique sans préciser davantage le référent.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La répétition des futurs et la progression des trois actions militaires sont conservées. « Ouvrage de siège » maintient l’ambiguïté concrète de χάραξ, tandis que la note signale les principales possibilités.
