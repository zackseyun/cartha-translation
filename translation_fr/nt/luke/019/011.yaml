id: LUK.19.11
reference: Luke 19:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἀκουόντων δὲ αὐτῶν ταῦτα προσθεὶς εἶπεν παραβολὴν διὰ τὸ ἐγγὺς ⸂εἶναι Ἰερουσαλὴμ αὐτὸν⸃ καὶ δοκεῖν αὐτοὺς ὅτι παραχρῆμα μέλλει ἡ βασιλεία τοῦ θεοῦ ἀναφαίνεσθαι·
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/011.yaml
  text: As they were hearing these things[a], he went on and told a parable, because he was near Jerusalem and because they supposed that the kingdom of God was about to appear immediately.
translation:
  language: fr
  text: Comme ils écoutaient cela, Jésus poursuivit en racontant une parabole, parce qu’il était près de Jérusalem et qu’ils pensaient que le royaume de Dieu allait se manifester immédiatement.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « allait apparaître immédiatement ». Le verbe peut désigner le fait de devenir visible ou manifeste.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀκουόντων δὲ αὐτῶν ταῦτα
  choice: Comme ils écoutaient cela
  rationale: Le génitif absolu avec participe présent exprime une action en cours et contemporaine; cette formulation est naturelle en français et conserve cette nuance.
- source_word: προσθεὶς εἶπεν
  choice: Jésus poursuivit en racontant
  rationale: La construction idiomatique marque la continuation du discours. Le nom « Jésus » clarifie naturellement le sujet en français, et « racontant » convient à l’introduction d’une parabole.
- source_word: παραβολὴν
  choice: une parabole
  rationale: Terme consacré dans les Évangiles, précis quant au genre et cohérent avec le reste du récit.
- source_word: διὰ τὸ ἐγγὺς εἶναι Ἰερουσαλὴμ αὐτὸν
  choice: parce qu’il était près de Jérusalem
  rationale: διά suivi de l’infinitif articulé a ici une valeur causale; αὐτόν est le sujet de l’infinitif et renvoie à Jésus.
- source_word: δοκεῖν αὐτοὺς
  choice: qu’ils pensaient
  rationale: Rend simplement l’opinion ou l’attente des auditeurs, sans lui attribuer une certitude.
- source_word: παραχρῆμα
  choice: immédiatement
  rationale: L’adverbe souligne que la manifestation était attendue sans délai.
- source_word: μέλλει ... ἀναφαίνεσθαι
  choice: allait se manifester
  rationale: « Allait » exprime l’imminence portée par μέλλω, tandis que « se manifester » conserve l’idée de devenir visible ou manifeste dans ἀναφαίνεσθαι.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: le royaume de Dieu
  rationale: Formulation française établie qui préserve la continuité lexicale et théologique de Luc.
theological_decisions:
- issue: Nature de la manifestation attendue du royaume
  choice: « le royaume de Dieu allait se manifester immédiatement »
  alternative: « le royaume de Dieu allait apparaître immédiatement »
  rationale: Le texte rapporte une attente de manifestation imminente sans préciser si elle est politique, apocalyptique ou spirituelle. La traduction ne tranche pas cette question.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase reste fluide tout en conservant les deux motifs introduits par « parce que » et « et que ». Le marqueur de note est placé après l’expression qu’il éclaire.
