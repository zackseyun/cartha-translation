id: LUK.19.33
reference: Luke 19:33
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: λυόντων δὲ αὐτῶν τὸν πῶλον εἶπαν οἱ κύριοι αὐτοῦ πρὸς αὐτούς· Τί λύετε τὸν πῶλον;
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/033.yaml
  text: And as they were untying the colt[a], its owners said to them, “Why are you untying the colt?”
translation:
  language: fr
  text: 'Pendant qu’ils détachaient l’ânon, ses propriétaires leur dirent : « Pourquoi détachez-vous l’ânon ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λυόντων
  choice: Pendant qu’ils détachaient
  rationale: Le participe présent dans une construction au génitif absolu exprime une action simultanée à celle du verbe principal. « Détacher » convient concrètement à un animal attaché et permet de reprendre le même verbe pour λύετε.
- source_word: δὲ
  choice: Pendant que
  rationale: δέ est ici un connecteur narratif léger. En français, la construction temporelle suffit à assurer naturellement l’enchaînement sans ajouter « et », qui alourdirait la phrase.
- source_word: αὐτῶν
  choice: ils
  rationale: Le pronom renvoie aux deux disciples mentionnés dans le contexte immédiat. Le français exige ici un sujet explicite, sans qu’il soit nécessaire de répéter « les disciples ».
- source_word: πῶλον
  choice: l’ânon
  rationale: πῶλος désigne un jeune animal; le contexte précédent précise qu’il s’agit d’un ânon. Ce terme est exact, courant et plus précis ici que le générique « petit ».
- source_word: εἶπαν
  choice: dirent
  rationale: Le verbe λέγω signifie directement « dire ». Le passé simple convient au registre narratif biblique moderne et reste naturel dans un texte écrit soutenu.
- source_word: οἱ κύριοι αὐτοῦ
  choice: ses propriétaires
  rationale: Le pluriel de κύριος désigne ici les personnes auxquelles appartient l’ânon, non des « seigneurs » au sens théologique. « Propriétaires » exprime clairement ce rapport concret de possession.
- source_word: πρὸς αὐτούς
  choice: leur
  rationale: Le pronom indirect français rend naturellement πρός avec l’accusatif après un verbe de parole.
- source_word: Τί
  choice: Pourquoi
  rationale: Dans cette question, τί demande la raison de l’action. « Pourquoi » en restitue idiomatiquement la force en français.
- source_word: λύετε
  choice: détachez-vous
  rationale: Le présent grec désigne l’action en cours. Le présent français dans la question a naturellement ce sens, et la répétition de « détacher » conserve le lien lexical avec λυόντων.
theological_decisions:
- issue: Sens de κύριοι dans un contexte humain de propriété
  choice: propriétaires
  alternative: maîtres
  rationale: Bien que κύριος puisse signifier « Seigneur » ou « maître », le contexte désigne ici les détenteurs humains de l’animal. « Propriétaires » évite une résonance théologique trompeuse tout en exprimant précisément le sens contextuel.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve la simultanéité des actions et la répétition du verbe grec λύω, tout en évitant un connecteur initial superflu en français.
