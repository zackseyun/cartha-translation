source:
  edition: SBLGNT
  text: λέγων ὅτι Εἰ ἔγνως ⸂ἐν τῇ ἡμέρᾳ ταύτῃ καὶ σὺ⸃ τὰ πρὸς ⸀εἰρήνην— νῦν δὲ ἐκρύβη ἀπὸ ὀφθαλμῶν σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/042.yaml
  text: saying[a], “If you had known on this day, even you[c][b], the things that make for peace—but now they have been hidden from your eyes.”
translation:
  language: fr
  text: 'en disant : « Si, en ce jour, toi aussi, tu avais reconnu[a] ce qui mène à la paix[b]… Mais maintenant, cela est caché à tes yeux. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Si seulement, en ce jour, toi aussi, tu avais reconnu… »'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « les choses qui vont vers la paix », c’est-à-dire ce qui concerne la paix ou y conduit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγων
  choice: en disant
  rationale: Le participe présent se rattache à la proposition narrative précédente. « En disant » en préserve la forme et le mouvement sans introduire un nouveau verbe conjugué.
- source_word: Εἰ ἔγνως
  choice: si… tu avais reconnu
  rationale: Dans cette lamentation, l’aoriste de l’indicatif introduit une condition demeurée irréalisée. « Reconnu » exprime ici une connaissance qui implique discernement et accueil, tout en restant naturel en français.
- source_word: ἐν τῇ ἡμέρᾳ ταύτῃ
  choice: en ce jour
  rationale: Cette formulation temporelle est naturelle et soutenue en français, sans ajouter l’emphase de « en ce jour même ».
- source_word: καὶ σὺ
  choice: toi aussi
  rationale: Le pronom exprimé est emphatique. Placé en détachement, « toi aussi » fait entendre la force affective de l’adresse à Jérusalem.
- source_word: τὰ πρὸς εἰρήνην
  choice: ce qui mène à la paix
  rationale: L’expression désigne ce qui concerne la paix ou y conduit. Le singulier collectif « ce qui » est idiomatique en français, tandis qu’une note conserve la forme plurielle concrète du grec.
- source_word: εἰρήνην
  choice: paix
  rationale: « Paix » conserve la richesse du terme, qui peut englober la sécurité, le bien-être et la réconciliation, sans réduire ici sa portée.
- source_word: νῦν δὲ
  choice: mais maintenant
  rationale: Cette tournure marque nettement le contraste entre la possibilité évoquée dans la lamentation et la situation présente.
- source_word: ἐκρύβη
  choice: cela a été caché
  rationale: Le passif est conservé sans préciser son agent. « Cela » reprend conceptuellement ce qui mène à la paix et correspond bien au verbe grec au singulier.
- source_word: ἀπὸ ὀφθαλμῶν σου
  choice: à tes yeux
  rationale: Cette expression française naturelle préserve l’image biblique des yeux comme siège de la perception et du discernement.
theological_decisions:
- issue: Force de la lamentation conditionnelle
  choice: « Si… tu avais reconnu… » avec une phrase laissée en suspens
  alternative: « Si seulement tu avais reconnu… ! »
  rationale: Le contexte donne à la condition une forte valeur de regret, mais le grec ne comporte pas de mot correspondant explicitement à « seulement ». Les points de suspension rendent l’aposiopèse sans compléter la conséquence sous-entendue.
- issue: Référent et nombre de ἐκρύβη
  choice: « cela a été caché », reprenant conceptuellement « ce qui mène à la paix »
  alternative: 'Reprendre explicitement un pluriel : « ces choses ont été cachées »'
  rationale: Le grec présente une expression neutre plurielle suivie d’un verbe passif singulier, traitement possible lorsque l’ensemble est envisagé collectivement. Le français singulier conserve cette unité conceptuelle et évite de corriger artificiellement le nombre du verbe grec.
- issue: Agent du passif
  choice: Maintenir le passif sans nommer celui qui cache
  alternative: Expliciter un agent divin ou humain
  rationale: Le texte ne nomme pas l’agent de ἐκρύβη. Le laisser implicite préserve l’ambiguïté théologique du passage.
translation_notes:
  register: Français international moderne, digne et accessible. L’ordre détaché de « en ce jour, toi aussi » conserve l’emphase de l’adresse. Les points de suspension rendent la lamentation inachevée du grec, tandis que le passif laisse volontairement son agent indéterminé.
