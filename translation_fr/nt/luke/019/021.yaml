source:
  edition: SBLGNT
  text: ἐφοβούμην γάρ σε ὅτι ἄνθρωπος αὐστηρὸς εἶ, αἴρεις ὃ οὐκ ἔθηκας καὶ θερίζεις ὃ οὐκ ἔσπειρας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/021.yaml
  text: 'for I was afraid of you[a], because you are a severe man: you take what you did not put down[b], and you reap what you did not sow.'
translation:
  language: fr
  text: 'car j’avais peur de toi, parce que tu es un homme dur[a] : tu prends ce que tu n’as pas placé[b] et tu moissonnes ce que tu n’as pas semé.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sévère », « strict » ou « intraitable ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « ce que tu n’as pas placé ». Dans ce contexte, on peut aussi traduire « déposé ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐφοβούμην
  choice: j’avais peur
  rationale: L’imparfait exprime naturellement en français un état de peur qui durait dans le passé.
- source_word: γάρ
  choice: car
  rationale: « Car » marque avec concision que le serviteur justifie son affirmation précédente.
- source_word: ἄνθρωπος αὐστηρός
  choice: un homme dur
  rationale: Dans ce contexte, αὐστηρός décrit un homme rigoureux et intraitable. « Dur » conserve la portée négative de l’accusation sans statuer sur sa vérité objective.
- source_word: αἴρεις
  choice: tu prends
  rationale: Le verbe signifie ici prendre ou enlever; « prends » reste direct et laisse au contexte économique sa part d’ambiguïté.
- source_word: ὃ οὐκ ἔθηκας
  choice: ce que tu n’as pas déposé
  rationale: τίθημι signifie littéralement mettre ou placer. Dans le cadre monétaire de la parabole, « déposer » rend l’image intelligible sans la développer excessivement.
- source_word: θερίζεις
  choice: tu moissonnes
  rationale: « Moissonner » rend l’image agricole et maintient le parallélisme proverbial avec « semer ».
- source_word: ὃ οὐκ ἔσπειρας
  choice: ce que tu n’as pas semé
  rationale: « Semer » est l’équivalent direct et naturel de σπείρω, en corrélation avec « moissonner ».
theological_decisions:
- issue: Faut-il atténuer le portrait du maître afin de protéger l’image du personnage noble dans la parabole ?
  choice: Conserver sans l’atténuer l’accusation formulée par le serviteur.
  alternative: Employer systématiquement une formulation plus douce, telle que « exigeant » ou « strict ».
  rationale: Le verset rapporte le point de vue accusateur du serviteur. La traduction en préserve la force sans décider si cette description du maître est objectivement juste.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe conserve la justification introduite par « car », puis le parallélisme entre l’activité économique et l’image agricole. Les notes signalent l’étendue lexicale sans résoudre l’accusation du serviteur.
