id: LUK.19.37
reference: Luke 19:37
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐγγίζοντος δὲ αὐτοῦ ἤδη πρὸς τῇ καταβάσει τοῦ Ὄρους τῶν Ἐλαιῶν ἤρξαντο ἅπαν τὸ πλῆθος τῶν μαθητῶν χαίροντες αἰνεῖν τὸν θεὸν φωνῇ μεγάλῃ περὶ ⸀πασῶν ὧν εἶδον δυνάμεων,
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/037.yaml
  text: And as he was already drawing near[a], at the descent of the Mount of Olives, the whole multitude of the disciples began rejoicing and praising God with a loud voice for all the mighty works that they had seen,
translation:
  language: fr
  text: Alors qu’il approchait déjà de la descente du mont des Oliviers, toute la foule des disciples se mit, dans la joie, à louer Dieu d’une voix forte pour tous les actes de puissance[a] qu’ils avaient vus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « miracles » ou « œuvres puissantes » ; le grec désigne des actes manifestant une puissance.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγγίζοντος δὲ αὐτοῦ ἤδη
  choice: Alors qu’il approchait déjà
  rationale: Le génitif absolu fournit l’arrière-plan temporel. Cette formulation conserve l’idée d’un mouvement en cours ainsi que la valeur de ἤδη.
- source_word: πρὸς τῇ καταβάσει
  choice: de la descente
  rationale: Avec « approchait », « de la descente » situe naturellement Jésus près de l’endroit où commence la pente descendante, sans préciser davantage la topographie.
- source_word: τοῦ Ὄρους τῶν Ἐλαιῶν
  choice: du mont des Oliviers
  rationale: Forme française traditionnelle et immédiatement reconnaissable de ce nom de lieu.
- source_word: ἤρξαντο
  choice: se mit … à
  rationale: Le tour français rend clairement le commencement de l’action exprimé par le verbe grec suivi de l’infinitif.
- source_word: ἅπαν τὸ πλῆθος τῶν μαθητῶν
  choice: toute la foule des disciples
  rationale: « Foule » rend naturellement πλῆθος, tandis que « des disciples » identifie explicitement le groupe.
- source_word: χαίροντες
  choice: dans la joie
  rationale: Cette locution exprime la circonstance et la manière de la louange tout en restant fluide avec le sujet collectif « foule ».
- source_word: αἰνεῖν τὸν θεὸν
  choice: à louer Dieu
  rationale: Rendu direct, courant et fidèle de l’infinitif grec.
- source_word: φωνῇ μεγάλῃ
  choice: d’une voix forte
  rationale: Expression française naturelle qui conserve l’image concrète du grec.
- source_word: περὶ πασῶν … δυνάμεων
  choice: pour tous les actes de puissance[a]
  rationale: Cette traduction maintient le lien lexical avec la puissance manifestée dans ces actes, sans réduire d’emblée le terme à une catégorie technique de miracles.
- source_word: ὧν εἶδον
  choice: qu’ils avaient vus
  rationale: Le plus-que-parfait situe naturellement ces actes avant la louange rapportée dans le récit.
theological_decisions:
- issue: Sens de δύναμις dans le contexte des actes extraordinaires de Jésus
  choice: actes de puissance
  alternative: miracles ; œuvres puissantes
  rationale: Le terme grec peut désigner des manifestations de puissance, des actes puissants ou des miracles. « Actes de puissance » préserve cette amplitude et l’accent mis sur la puissance à l’œuvre sans imposer un sens plus étroit.
translation_notes:
  register: Français international moderne, narratif et digne. La phrase conserve la progression du récit tout en évitant une structure trop calquée sur le grec. Le marqueur [a] est placé après l’expression qu’il explique.
