id: LUK.19.12
reference: Luke 19:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἶπεν οὖν· Ἄνθρωπός τις εὐγενὴς ἐπορεύθη εἰς χώραν μακρὰν λαβεῖν ἑαυτῷ βασιλείαν καὶ ὑποστρέψαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/012.yaml
  text: So he said[a], “A certain nobleman went to a distant country to receive a kingdom for himself and return.”
translation:
  language: fr
  text: 'Il dit donc : « Un homme de noble naissance partit pour un pays lointain afin de recevoir pour lui-même la royauté[a] et de revenir. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un royaume » ou « le pouvoir royal ». Le mot grec peut désigner aussi bien le royaume que la dignité ou l’autorité royale.
    reason: 'Alternative lexicale : βασιλεία possède ici une portée sémantique réelle entre domaine, royauté et pouvoir royal.'
lexical_decisions:
- source_word: οὖν
  choice: donc
  rationale: Marque la continuité logique et narrative avec ce qui précède, sans surcharger la transition.
- source_word: Ἄνθρωπός τις εὐγενὴς
  choice: un homme de noble naissance
  rationale: τις introduit un personnage indéfini, tandis que εὐγενής indique ici une naissance ou un rang élevé. Cette formulation est naturelle et évite de réduire le terme à un simple trait moral.
- source_word: ἐπορεύθη
  choice: partit
  rationale: Dans ce contexte de déplacement vers un pays éloigné, « partit » rend naturellement l’aoriste de πορεύομαι.
- source_word: εἰς χώραν μακρὰν
  choice: pour un pays lointain
  rationale: Exprime clairement la destination et l’éloignement géographique en français courant.
- source_word: λαβεῖν ἑαυτῷ
  choice: afin d’y recevoir
  rationale: « Recevoir » conserve l’idée d’une autorité accordée plutôt que conquise. Le fait que cette royauté lui revienne personnellement est déjà porté en français par le sujet et par le complément « la royauté », sans le calque lourd « pour lui-même ».
- source_word: βασιλείαν
  choice: la royauté
  rationale: Dans ce scénario politique, le personnage voyage pour se voir reconnaître la dignité et l’autorité royales. « La royauté » est idiomatique en français et maintient la possibilité que βασιλεία désigne le règne plutôt qu’un territoire.
- source_word: καὶ ὑποστρέψαι
  choice: et de revenir
  rationale: Conserve la coordination simple des deux infinitifs sans ajouter un connecteur temporel absent du grec.
theological_decisions:
- issue: Sens de βασιλείαν dans une parabole à forte coloration politique
  choice: la royauté
  alternative: un royaume ; le pouvoir royal
  rationale: βασιλεία peut désigner le royaume comme domaine, mais aussi la condition de roi ou l’exercice de l’autorité royale. Le contexte évoque surtout l’obtention d’une investiture avant le retour du personnage. La note maintient l’ambiguïté lexicale qui peut influer sur la lecture de l’image politique.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe reste simple et accessible. « Homme de noble naissance » explicite le statut social sans archaïsme, et « la royauté » rend naturellement le contexte d’investiture tout en laissant les autres nuances dans la note.
