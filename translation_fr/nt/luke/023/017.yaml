  text: Ἀνάγκην δὲ εἶχεν ἀπολύειν αὐτοῖς κατὰ ἑορτὴν ἕνα.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/017.yaml
  text: He had an obligation[a] to release one man to them at the festival.
translation:
  language: fr
  text: Il était tenu[a] de leur relâcher un homme lors de la fête.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ce verset entier est absent de plusieurs des plus anciens manuscrits grecs, notamment le papyrus 75 (IIIe siècle) et le Vaticanus (IVe siècle), ainsi que d’anciennes traductions coptes. Il figure dans d’autres manuscrits anciens importants, comme le Sinaiticus (IVe siècle), dans la tradition latine et dans la majorité des manuscrits byzantins plus tardifs. Il a probablement été ajouté par des copistes pour harmoniser le récit de Luc avec la coutume de relâcher un prisonnier mentionnée en Matthieu 27.15 et Marc 15.6. Certains manuscrits placent cette phrase après le verset 18.
    reason: textual_critical
lexical_decisions:
- source_word: ἀνάγκην … εἶχεν
  choice: était tenu
  rationale: Cette tournure idiomatique exprime une obligation ou une nécessité imposée. « Était tenu » rend naturellement en français la contrainte liée à la coutume, sans suggérer explicitement une obligation légale.
- source_word: ἀπολύειν
  choice: relâcher
  rationale: Dans ce contexte judiciaire, le verbe désigne la remise en liberté d’une personne détenue.
- source_word: ἕνα
  choice: un prisonnier
  rationale: Le grec dit littéralement « un » au masculin. « Un prisonnier » explicite le référent sous-entendu par le contexte pénal sans introduire l’idée plus précise de grâce ou de pardon.
- source_word: κατὰ ἑορτήν
  choice: à l’occasion de la fête
  rationale: La préposition κατά exprime ici ce qui se faisait à chaque fête ou conformément à la coutume de la fête. Cette formulation française reste naturelle et renvoie, dans le contexte, à la Pâque.
- source_word: αὐτοῖς
  choice: leur
  rationale: Le pronom désigne la foule ou les interlocuteurs de Pilate et conserve simplement cette référence contextuelle.
theological_decisions: []
translation_notes:
  register: Français international moderne, simple et digne. « Était tenu » préserve la force de l’obligation sans lourdeur; « à l’occasion de la fête » est plus idiomatique que « selon la fête ». Le marqueur de note est placé immédiatement après l’expression concernée, et aucun connecteur temporel absent du grec n’a été ajouté.
