source:
  edition: SBLGNT
  text: ὁ δὲ Ἡρῴδης ἰδὼν τὸν Ἰησοῦν ἐχάρη λίαν, ἦν γὰρ ⸂ἐξ ἱκανῶν χρόνων θέλων⸃ ἰδεῖν αὐτὸν διὰ τὸ ⸀ἀκούειν περὶ αὐτοῦ, καὶ ἤλπιζέν τι σημεῖον ἰδεῖν ὑπ’ αὐτοῦ γινόμενον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/008.yaml
  text: When Herod saw Jesus[a], he rejoiced greatly, for he had for a long time wanted to see him because he had heard about him[b], and he was hoping to see some sign done by him.
translation:
  language: fr
  text: Quand Hérode vit Jésus, il se réjouit beaucoup, car il désirait depuis longtemps le voir parce qu’il entendait parler de lui[a], et il espérait voir un signe[b] accompli par lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « parce qu’il avait entendu parler de lui ». Le présent grec peut suggérer qu’Hérode recevait régulièrement ou continuellement des nouvelles de Jésus.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « un miracle ». Le grec dit « un signe » (σημεῖον), terme qui peut désigner un acte miraculeux considéré comme porteur de sens.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ Ἡρῴδης ἰδὼν τὸν Ἰησοῦν
  choice: Quand Hérode vit Jésus
  rationale: Le participe aoriste ἰδών exprime naturellement ici une circonstance temporelle antérieure au verbe principal. Le léger développement narratif porté par δέ n’exige pas l’ajout d’un adverbe comme « alors » ou « or ».
- source_word: ἐχάρη λίαν
  choice: il en éprouva une très grande joie
  rationale: Cette formulation restitue le sens de χαίρω et l’intensité de λίαν dans un français naturel et digne ; « en » rattache explicitement la joie à la vue de Jésus.
- source_word: ἐξ ἱκανῶν χρόνων θέλων ἰδεῖν αὐτόν
  choice: depuis longtemps il désirait le voir
  rationale: L’expression indique une durée prolongée sans préciser un nombre d’années. L’imparfait « désirait » rend l’état continu exprimé par ἦν avec le participe θέλων.
- source_word: διὰ τὸ ἀκούειν περὶ αὐτοῦ
  choice: parce qu’il entendait parler de lui
  rationale: διά avec l’infinitif substantivé exprime la cause. L’imparfait rend de façon idiomatique la valeur durative ou répétée du présent ἀκούειν.
- source_word: ἤλπιζέν τι σημεῖον ἰδεῖν ὑπ’ αὐτοῦ γινόμενον
  choice: il espérait le voir accomplir quelque signe
  rationale: « Espérait » conserve la nuance d’attente de ἐλπίζω. « Quelque signe » maintient le terme σημεῖον sans le réduire à « miracle », tandis que la construction factitive naturelle en français conserve Jésus comme auteur de l’acte.
theological_decisions:
- issue: Sens de σημεῖον
  choice: signe
  alternative: miracle
  rationale: Le contexte suppose une œuvre extraordinaire, mais σημεῖον présente celle-ci comme un acte porteur de signification. « Signe » préserve cette portée théologique et lexicale sans exclure le caractère miraculeux.
translation_notes:
  register: Français international moderne, fluide et digne. La phrase conserve la progression causale du grec ainsi que l’attente intéressée d’Hérode. Le point-virgule évite une phrase trop chargée tout en maintenant le lien étroit entre son désir ancien et son espoir de voir un signe.
