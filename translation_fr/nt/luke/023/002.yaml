id: LUK.23.2
reference: Luke 23:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἤρξαντο δὲ κατηγορεῖν αὐτοῦ λέγοντες· Τοῦτον εὕραμεν διαστρέφοντα τὸ ἔθνος ⸀ἡμῶν καὶ κωλύοντα ⸂φόρους Καίσαρι⸃ διδόναι ⸀καὶ λέγοντα ⸀αὑτὸν χριστὸν βασιλέα εἶναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/002.yaml
  text: And they began to accuse him[a], saying, “We found this man misleading our nation and forbidding us to pay taxes to Caesar, and saying that he himself is Messiah[c][b], a king.”
translation:
  language: fr
  text: 'Alors ils se mirent à l’accuser en disant : « Nous avons constaté que cet homme égarait notre nation[a], qu’il interdisait de payer le tribut[b] à César et qu’il affirmait être lui-même le Messie, un roi[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « subvertissait notre nation » ou « détournait notre nation ».
    reason: lexical_alternative
  - marker: b
    text: Le mot grec désigne l’impôt ou le tribut versé au pouvoir romain.
    reason: cultural_note
  - marker: c
    text: Ou « affirmait être lui-même le Christ, un roi ». Le terme grec Christos signifie « oint » et correspond ici au titre « Messie ».
    reason: alternative_reading
lexical_decisions:
- source_word: ἤρξαντο δὲ κατηγορεῖν αὐτοῦ
  choice: Alors ils se mirent à l’accuser
  rationale: « Se mirent à » restitue l’aspect ingressif de ἤρξαντο avec l’infinitif, tandis que « accuser » convient au contexte judiciaire. « Alors » rend δέ comme marque de progression narrative sans opposition appuyée.
- source_word: Τοῦτον εὕραμεν
  choice: Nous avons constaté que cet homme
  rationale: Dans cette accusation officielle, εὕραμεν exprime le résultat allégué de leur examen. « Constaté » est naturel en français judiciaire, et « cet homme » rend le démonstratif déictique Τοῦτον.
- source_word: διαστρέφοντα τὸ ἔθνος ἡμῶν
  choice: égarait notre nation
  rationale: διαστρέφω peut évoquer le fait de détourner, d’égarer ou de subvertir. « Égarait » reste lisible et ne réduit pas d’emblée l’accusation à une rébellion politique, tandis que « nation » convient au cadre public devant Pilate.
- source_word: κωλύοντα φόρους Καίσαρι διδόναι
  choice: interdisait de payer le tribut à César
  rationale: κωλύω désigne ici une interdiction alléguée. φόρος est le prélèvement ou tribut dû au pouvoir romain ; « tribut » conserve cette nuance politique mieux que le terme très général « impôts ».
- source_word: λέγοντα αὑτὸν χριστὸν βασιλέα εἶναι
  choice: affirmait être lui-même le Messie, un roi
  rationale: « Affirmait » convient à une déclaration d’identité rapportée comme chef d’accusation ; « lui-même » préserve l’emphase de αὑτόν. « Le Messie » rend χριστός comme titre royal, et « un roi » maintient βασιλέα comme second attribut sans fusionner les deux termes.
theological_decisions:
- issue: Valeur de χριστόν dans une accusation à portée politique
  choice: le Messie
  alternative: le Christ
  rationale: Le mot fonctionne ici comme un titre d’oint royal plutôt que comme un nom propre. « Le Messie » rend ce contexte juif et politique sans introduire une formulation confessionnelle plus développée.
- issue: Relation entre χριστόν et βασιλέα
  choice: le Messie, un roi
  alternative: le Messie-Roi ; le Messie, le roi
  rationale: Le grec juxtapose deux attributs accusatifs. La formulation retenue préserve cette juxtaposition et son ambiguïté, sans en faire obligatoirement un titre composé ni identifier ce roi à une désignation théologique plus définie.
- issue: Nature de l’accusation exprimée par διαστρέφοντα
  choice: égarait notre nation
  alternative: subvertissait notre nation ; détournait notre nation
  rationale: « Égarait » laisse ouverte la portée morale, sociale ou politique du verbe. La variante « subvertissait » explicite la lecture politique possible sans l’imposer dans le texte principal.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La phrase conserve la progression formelle des trois accusations tout en évitant une syntaxe artificiellement calquée sur les participes grecs. Les termes politiques restent compréhensibles et les ambiguïtés lexicales ou théologiques importantes sont signalées en notes.
