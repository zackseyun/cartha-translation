  yaml_path: translation/nt/luke/023/013.yaml
  text: But Pilate, having called together the chief priests and the rulers and the people,
translation:
  language: fr
  text: Pilate convoqua alors les chefs des prêtres, les dirigeants et le peuple.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πιλᾶτος
  choice: Pilate
  rationale: Forme française traditionnelle et courante du nom propre.
- source_word: δὲ
  choice: alors
  rationale: La particule marque ici une transition narrative légère. « Alors » relie naturellement le retour à l’action de Pilate sans imposer une opposition forte.
- source_word: συγκαλεσάμενος
  choice: convoqua
  rationale: Le participe aoriste indique que Pilate réunit officiellement les groupes mentionnés avant de leur parler. En français, un verbe principal rend la phrase naturelle, le verset suivant portant le contenu de son discours.
- source_word: ἀρχιερεῖς
  choice: chefs des prêtres
  rationale: Au pluriel, le terme désigne les principales autorités sacerdotales, et non plusieurs titulaires simultanés de la fonction de grand prêtre.
- source_word: ἄρχοντας
  choice: dirigeants
  rationale: Le mot désigne les responsables ou autorités du peuple. « Dirigeants » est actuel, clair et conserve la dimension officielle du terme.
- source_word: λαὸν
  choice: peuple
  rationale: Le terme collectif désigne le peuple, sans le réduire nécessairement à une simple foule.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. La construction participiale grecque est transformée en verbe conjugué pour éviter une tournure française pesante, tout en conservant l’ordre narratif. Le verset reste volontairement ouvert sur le discours introduit au verset suivant.
