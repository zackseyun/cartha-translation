  text: παιδεύσας οὖν αὐτὸν ⸀ἀπολύσω.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/016.yaml
  text: Therefore[a], after disciplining him, I will release him.
translation:
  language: fr
  text: Je le ferai donc punir[a], puis je le relâcherai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le faire châtier » ou « le faire corriger ». Le verbe grec désigne ici une sanction, sans en préciser la forme; certains y voient plus précisément une flagellation.
    reason: lexical_alternative
lexical_decisions:
- source_word: παιδεύσας
  choice: le faire châtier
  rationale: Dans le contexte judiciaire, le participe aoriste exprime une mesure punitive préalable. « Faire châtier » rend ce sens sans préciser indûment la forme exacte du châtiment; la tournure causative convient à l’ordre donné par Pilate.
- source_word: οὖν
  choice: donc
  rationale: « Donc » conserve la valeur inférentielle ou conclusive naturelle de la particule dans la déclaration de Pilate.
- source_word: αὐτόν
  choice: le
  rationale: Le pronom objet renvoie directement à Jésus.
- source_word: ἀπολύσω
  choice: je le relâcherai
  rationale: Dans ce cadre judiciaire et carcéral, « relâcher » exprime naturellement la remise en liberté d’un détenu.
theological_decisions:
- issue: Portée de παιδεύω dans la proposition de Pilate
  choice: Sens judiciaire et punitif rendu par « faire châtier »
  alternative: « corriger », « punir » ou, de façon plus spécifique, « faire fouetter »
  rationale: Le contexte impose une sanction plutôt qu’une instruction éducative. La traduction préserve toutefois l’étendue du verbe grec et n’identifie pas sans nécessité le châtiment à la flagellation.
translation_notes:
  register: Français moderne, clair et digne. La construction « le faire châtier, puis » rend explicitement l’antériorité du participe grec tout en restant idiomatique.
