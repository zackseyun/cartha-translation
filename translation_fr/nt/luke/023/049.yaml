  text: εἱστήκεισαν δὲ πάντες οἱ γνωστοὶ ⸀αὐτῷ ⸀μακρόθεν, καὶ γυναῖκες αἱ ⸀συνακολουθοῦσαι αὐτῷ ἀπὸ τῆς Γαλιλαίας, ὁρῶσαι ταῦτα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/049.yaml
  text: But all those who knew him[a], and the women who had followed him from Galilee, were standing at a distance, watching these things.
translation:
  language: fr
  text: Mais tous ceux qui le connaissaient[a] se tenaient à distance, de même que les femmes qui l’avaient suivi depuis la Galilée et qui observaient ces choses.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « toutes les personnes de sa connaissance ». Le grec γνωστοί peut désigner des personnes connues de quelqu’un, c’est-à-dire ses connaissances ou ses relations.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἱστήκεισαν
  choice: se tenaient
  rationale: Le plus-que-parfait grec à valeur imperfective décrit une posture qui se prolonge dans la scène; « se tenaient » est naturel en français et conserve cet aspect continu.
- source_word: δὲ
  choice: Mais
  rationale: La particule marque ici une transition légèrement contrastive avec la scène précédente.
- source_word: πάντες οἱ γνωστοὶ αὐτῷ
  choice: tous ceux qui le connaissaient
  rationale: Cette formulation claire conserve l’extension possible de γνωστοί sans limiter le groupe à des amis intimes.
- source_word: μακρόθεν
  choice: à distance
  rationale: Expression idiomatique moderne qui rend directement l’éloignement spatial.
- source_word: γυναῖκες αἱ συνακολουθοῦσαι αὐτῷ
  choice: les femmes qui l’avaient accompagné
  rationale: L’article désigne un groupe déterminé; συνακολουθέω évoque le fait d’aller avec quelqu’un et de le suivre, rendu naturellement ici par « accompagner ».
- source_word: ἀπὸ τῆς Γαλιλαίας
  choice: depuis la Galilée
  rationale: « Depuis » exprime le point de départ géographique et la continuité de leur accompagnement jusqu’à cette scène.
- source_word: ὁρῶσαι ταῦτα
  choice: regardaient tout cela
  rationale: La tournure rend l’observation continue exprimée par le participe présent et reprend naturellement le pluriel ταῦτα par le collectif français « tout cela ».
