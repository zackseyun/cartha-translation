  naturalness: Le français révisé est naturel et clair. La reprise par « de même que » coordonne les deux groupes soumis à « se tenaient », et la relative « qui observaient ces choses » évite d’attribuer grammaticalement l’observation à tous les témoins.
  terminology: « Ceux qui le connaissaient » est une restitution ouverte de γνωστοί, sans réduire le groupe à des amis intimes. La note propose une alternative française idiomatique et explique la portée lexicale sans surinterprétation.
