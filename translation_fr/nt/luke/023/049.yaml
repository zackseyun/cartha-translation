  rationale: La correction distingue la fonction du verbe principal pluriel, qui inclut les connaissances et les femmes, de celle du participe féminin, qui caractérise les femmes seules. Elle conserve la distance spatiale, l’origine galiléenne et l’aspect d’observation du texte grec.
