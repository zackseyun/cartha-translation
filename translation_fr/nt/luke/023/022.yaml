id: LUK.23.22
reference: Luke 23:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ δὲ τρίτον εἶπεν πρὸς αὐτούς· Τί γὰρ κακὸν ἐποίησεν οὗτος; οὐδὲν αἴτιον θανάτου εὗρον ἐν αὐτῷ· παιδεύσας οὖν αὐτὸν ἀπολύσω.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/022.yaml
  text: And he said to them a third time[a], “Why? What evil has this man done? I have found in him no grounds for death. Therefore, after disciplining him[c][b], I will release him.”
translation:
  language: fr
  text: 'Pour la troisième fois, il leur dit : « Pourquoi donc ? Quel mal cet homme a-t-il fait ? Je n’ai rien trouvé en lui qui mérite la mort.[a] Je vais donc le faire châtier[b], puis le relâcher. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Je n’ai trouvé en lui aucun motif de condamnation à mort. »'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « le faire punir »; peut-être, plus précisément : « le faire fouetter ». Le verbe grec désigne ici un châtiment disciplinaire, sans en préciser à lui seul la forme.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τρίτον
  choice: Pour la troisième fois
  rationale: L’accusatif adverbial marque la répétition; cette tournure française est naturelle et maintient l’insistance narrative.
- source_word: Τί γὰρ κακὸν ἐποίησεν οὗτος;
  choice: Pourquoi donc ? Quel mal cet homme a-t-il fait ?
  rationale: La brève interrogation elliptique Τί, renforcée par γάρ, exprime ici une protestation avant la question développée. « Quel mal » conserve la portée morale de κακόν.
- source_word: οὐδὲν αἴτιον θανάτου
  choice: rien ... qui mérite la mort
  rationale: Dans ce contexte judiciaire, αἴτιον désigne ce qui constitue un motif ou une raison justifiant la mort. Cette formulation française transmet clairement le sens sans ajouter explicitement « condamnation ».
- source_word: εὗρον ἐν αὐτῷ
  choice: Je n’ai rien trouvé en lui
  rationale: Le passé composé convient à une constatation antérieure qui fonde le verdict présent de Pilate; « en lui » suit sobrement le grec.
- source_word: παιδεύσας
  choice: le faire châtier
  rationale: Dans ce contexte, le participe désigne un traitement punitif, sans que le mot précise à lui seul sa forme exacte. « Faire châtier » rend aussi plausible que Pilate ordonne l’action plutôt qu’il ne l’exécute personnellement.
- source_word: ἀπολύσω
  choice: puis le relâcher
  rationale: ἀπολύω signifie libérer ou relâcher dans un cadre judiciaire. L’infinitif dépend naturellement en français de « Je vais » et οὖν est rendu par « donc ».
theological_decisions:
- issue: Nature du traitement proposé par Pilate dans παιδεύσας
  choice: Employer le terme général « faire châtier » sans préciser la peine.
  alternative: « le faire punir » ou, de façon plus spécifique, « le faire fouetter »
  rationale: Pilate affirme que Jésus ne mérite pas la mort tout en proposant une peine moindre. Le verbe grec exprime ici une correction punitive, mais ne désigne pas explicitement à lui seul une flagellation; la traduction conserve donc cette tension sans imposer une reconstruction plus précise.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation garde le ton judiciaire de la scène tout en évitant un juridisme excessif. « Châtier » est légèrement soutenu, mais exprime mieux qu’« discipliner » le caractère punitif du geste dans ce contexte.
