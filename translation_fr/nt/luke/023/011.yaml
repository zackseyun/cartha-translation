id: LUK.23.11
reference: Luke 23:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐξουθενήσας δὲ αὐτὸν ⸀καὶ ὁ Ἡρῴδης σὺν τοῖς στρατεύμασιν αὐτοῦ καὶ ἐμπαίξας ⸀περιβαλὼν ἐσθῆτα λαμπρὰν ἀνέπεμψεν αὐτὸν τῷ Πιλάτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/011.yaml
  text: But Herod also[a], together with his soldiers, treated him with contempt and mocked him. Dressing him in splendid clothing, he sent him back to Pilate.
translation:
  language: fr
  text: Mais Hérode aussi, avec ses soldats, le traita avec mépris et se moqua de lui. Après l’avoir revêtu d’un vêtement somptueux[a], il le renvoya à Pilate.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « d’un vêtement éclatant ». Le terme grec peut désigner ce qui est brillant ou ce qui est somptueux; le vêtement semble participer à la mise en scène d’un honneur moqueur.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξουθενήσας
  choice: le traita avec mépris
  rationale: Le participe exprime le fait de considérer quelqu’un comme ne valant rien et de lui témoigner du mépris. Cette formulation française rend à la fois l’attitude et l’humiliation publique.
- source_word: σὺν τοῖς στρατεύμασιν αὐτοῦ
  choice: avec ses soldats
  rationale: Dans ce cadre narratif, « soldats » est plus direct et naturel que « troupes » ou « forces armées ».
- source_word: ἐμπαίξας
  choice: se moqua de lui
  rationale: Le verbe signifie se moquer de quelqu’un ou le tourner en ridicule. Cette expression est courante, claire et digne.
- source_word: περιβαλὼν
  choice: Après l’avoir revêtu de
  rationale: Le participe indique qu’on met un vêtement sur quelqu’un. La tournure marque naturellement l’action antérieure à son renvoi chez Pilate.
- source_word: ἐσθῆτα λαμπρὰν
  choice: un vêtement somptueux
  rationale: ἐσθής désigne un vêtement, tandis que λαμπρός peut évoquer ce qui est éclatant, brillant ou somptueux. « Vêtement somptueux » convient à la mise en scène d’un honneur moqueur sans préciser qu’il s’agissait nécessairement d’une robe royale.
- source_word: ἀνέπεμψεν
  choice: le renvoya
  rationale: Dans ce contexte judiciaire, le verbe désigne le renvoi de Jésus à l’autorité précédente.
- source_word: τῷ Πιλάτῳ
  choice: à Pilate
  rationale: Forme française traditionnelle et courante du nom propre.
theological_decisions:
- issue: Sens symbolique du vêtement dans la moquerie d’Hérode
  choice: Conserver l’idée d’un vêtement somptueux participant à une mise en scène moqueuse, sans en préciser la nature exacte.
  alternative: Parler explicitement d’une robe royale ou interpréter le vêtement comme un signe de folie ou de frivolité.
  rationale: Le contexte indique clairement le mépris et la moquerie, mais le grec ne qualifie pas précisément le vêtement de royal et n’explicite pas davantage son symbolisme.
translation_notes:
  register: Français international moderne, naturel et digne. La coordination « Mais Hérode aussi » rend δὲ…καὶ, tandis que les participes grecs sont répartis en deux phrases pour préserver la clarté sans perdre l’enchaînement des actions.
