  yaml_path: translation/nt/luke/023/042.yaml
  text: And he said[a], “Jesus, remember me when you come in your kingdom.”
translation:
  language: fr
  text: 'Et il dit[a] : « Jésus, souviens-toi de moi quand tu viendras dans ton royaume. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Certains manuscrits lisent εἰς (« vers/dans ») au lieu de ἐν (« dans ») : « quand tu viendras vers ton royaume ».'
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ
  choice: Puis
  rationale: Dans la continuité narrative, « Puis » rend naturellement la coordination grecque sans lui donner une valeur argumentative.
- source_word: ἔλεγεν
  choice: il dit
  rationale: L’imparfait grec peut littéralement évoquer une parole en cours, mais sert couramment à introduire un propos dans le récit ; le passé simple français est ici naturel.
- source_word: Ἰησοῦ
  choice: Jésus
  rationale: Forme vocative du nom propre, rendue par sa forme française usuelle.
- source_word: μνήσθητί μου
  choice: souviens-toi de moi
  rationale: Cette tournure française directe conserve la requête sans expliciter dans le texte principal l’idée implicite d’une intervention favorable.
- source_word: ὅταν ἔλθῃς
  choice: quand tu viendras
  rationale: Le futur français exprime naturellement l’événement futur introduit en grec par ὅταν avec le subjonctif.
- source_word: ἐν τῇ βασιλείᾳ σου
  choice: dans ton royaume
  rationale: « Dans » correspond directement à ἐν dans le texte SBLGNT et préserve l’ambiguïté entre l’entrée dans le royaume et la venue investie de la royauté.
- source_word: βασιλείᾳ
  choice: royaume
  rationale: « Royaume » est clair, digne et traditionnel, tout en pouvant désigner le règne ou l’autorité royale selon le contexte.
theological_decisions:
- issue: Nuance eschatologique de la demande adressée à Jésus
  choice: La demande concerne la venue future de Jésus dans son royaume, sans en préciser la chronologie ni le cadre doctrinal.
  alternative: Comprendre la phrase comme la venue de Jésus avec son règne ou dans sa puissance royale.
  rationale: Le verset attribue à Jésus un royaume futur, mais ne définit pas davantage la manière ou le moment de sa venue.
- issue: Valeur de ἐν avec le verbe venir
  choice: Conserver la formulation « dans ton royaume ».
  alternative: « quand tu entreras dans ton royaume » ou « quand tu viendras avec ton royaume »
  rationale: La formulation retenue suit la préposition du texte SBLGNT et évite de trancher une ambiguïté réelle en faveur d’une direction ou d’un accompagnement.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple convient au registre narratif biblique courant sans être archaïque ; la parole directe reste immédiatement compréhensible.
