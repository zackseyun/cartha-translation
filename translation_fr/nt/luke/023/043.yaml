id: LUK.23.43
reference: Luke 23:43
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ εἶπεν ⸀αὐτῷ· Ἀμήν ⸂σοι λέγω⸃ σήμερον μετ’ ἐμοῦ ἔσῃ ἐν τῷ παραδείσῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/043.yaml
  text: And he said to him[a], “Truly I tell you, today you will be with me in paradise.”
translation:
  language: fr
  text: 'Et il lui dit : « Vraiment, je te le dis, aujourd’hui tu seras avec moi dans le paradis. »[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre ponctuation, moins probable : « Vraiment, je te le dis aujourd’hui : tu seras avec moi dans le paradis. » Le texte grec ancien ne comportait pas la ponctuation moderne ; cette lecture rattache « aujourd’hui » à « je te le dis » plutôt qu’à « tu seras ».'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀμήν
  choice: Vraiment
  rationale: Dans les paroles de Jésus, ἀμήν introduit solennellement une déclaration certaine et faisant autorité. « Vraiment » en restitue naturellement la force en français moderne.
- source_word: σοι λέγω
  choice: je te le dis
  rationale: Cette formule courante des Évangiles se rend de façon idiomatique et digne par « je te le dis » ; le pronom « le » est naturel en français et renvoie à la déclaration qui suit.
- source_word: σήμερον
  choice: aujourd’hui
  rationale: L’adverbe se rattache le plus naturellement à « tu seras », de sorte que la promesse concerne ce jour même. Comme le grec ancien ne comportait pas la ponctuation moderne et qu’un autre rattachement est possible, celui-ci est signalé en note.
- source_word: μετ’ ἐμοῦ
  choice: avec moi
  rationale: Traduction directe qui conserve l’accent personnel de la communion avec Jésus.
- source_word: ἔσῃ
  choice: tu seras
  rationale: Le futur de εἰμί se rend directement et naturellement par le futur simple français.
- source_word: ἐν τῷ παραδείσῳ
  choice: dans le paradis
  rationale: « Le paradis » est la désignation française établie et exacte de παράδεισος dans ce contexte eschatologique, sans préciser davantage la nature de ce lieu.
theological_decisions:
- issue: Rattachement de σήμερον (« aujourd’hui ») dans une parole dont la ponctuation influe sur son interprétation théologique
  choice: Rattacher « aujourd’hui » à « tu seras avec moi dans le paradis »
  alternative: 'Rattacher « aujourd’hui » à « je te le dis » : « Vraiment, je te le dis aujourd’hui : tu seras avec moi dans le paradis. »'
  rationale: Les témoins grecs anciens ne comportaient pas la ponctuation moderne. Dans l’ordre et l’usage de la phrase, σήμερον qualifie le plus naturellement la réalisation de la promesse. L’autre analyse, historiquement défendue et théologiquement significative, reste toutefois possible sur le plan de la ponctuation et doit donc être conservée en note.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement reflète le singulier σοι et la parole adressée personnellement au criminel. La formulation reste proche de la structure grecque tout en évitant un calque peu idiomatique.
