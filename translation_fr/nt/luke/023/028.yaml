source:
  edition: SBLGNT
  text: στραφεὶς δὲ πρὸς αὐτὰς ⸀ὁ Ἰησοῦς εἶπεν· Θυγατέρες Ἰερουσαλήμ, μὴ κλαίετε ἐπ’ ἐμέ· πλὴν ἐφ’ ἑαυτὰς κλαίετε καὶ ἐπὶ τὰ τέκνα ὑμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/028.yaml
  text: But turning toward them[a], Jesus said, “Daughters of Jerusalem, do not weep for me; instead, weep for yourselves and for your children,”
translation:
  language: fr
  text: 'Mais Jésus se tourna vers elles et dit : « Filles de Jérusalem[a], ne pleurez pas sur moi ; pleurez plutôt sur vous-mêmes et sur vos enfants, »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Femmes de Jérusalem ». Le grec dit littéralement « Filles de Jérusalem », formule d’adresse rappelant le langage des prophètes.
    reason: lexical_alternative
lexical_decisions:
- source_word: στραφεὶς δὲ πρὸς αὐτὰς
  choice: Mais Jésus se tourna vers elles
  rationale: Le participe aoriste décrit le mouvement de Jésus vers les femmes avant sa prise de parole. Une proposition conjuguée est plus naturelle en français et conserve la légère transition marquée par δέ.
- source_word: Θυγατέρες Ἰερουσαλήμ
  choice: Filles de Jérusalem
  rationale: Cette traduction conserve l’image familiale et la résonance prophétique de la formule grecque, tout en restant intelligible en français moderne.
- source_word: μὴ κλαίετε ἐπ’ ἐμέ
  choice: ne pleurez pas sur moi
  rationale: « Pleurer sur quelqu’un » exprime naturellement en français le deuil ou la lamentation dont cette personne est l’objet. La formulation ne tranche pas entre une interdiction générale et la cessation d’une action en cours.
- source_word: πλὴν ἐφ’ ἑαυτὰς κλαίετε
  choice: pleurez plutôt sur vous-mêmes
  rationale: πλήν introduit ici une correction contrastive. « Plutôt » rend clairement le déplacement demandé, de Jésus vers les femmes elles-mêmes.
- source_word: τὰ τέκνα ὑμῶν
  choice: vos enfants
  rationale: « Enfants » est l’équivalent courant et familial de τέκνα dans ce contexte.
theological_decisions:
- issue: Portée de l’appellation Θυγατέρες Ἰερουσαλήμ
  choice: Filles de Jérusalem
  alternative: Femmes de Jérusalem
  rationale: La formulation littérale préserve l’écho au langage prophétique et collectif des Écritures sans lui ajouter une interprétation doctrinale. Une note fournit l’équivalent fonctionnel moderne.
translation_notes:
  register: Français international moderne, digne et direct. La syntaxe est légèrement restructurée pour être naturelle, tandis que le parallélisme « sur moi / sur vous-mêmes / sur vos enfants » et la formule prophétique sont conservés.
