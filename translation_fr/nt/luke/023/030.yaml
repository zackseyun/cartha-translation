id: LUK.23.30
reference: Luke 23:30
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τότε ἄρξονται λέγειν τοῖς ὄρεσιν· Πέσετε ἐφ’ ἡμᾶς, καὶ τοῖς βουνοῖς· Καλύψατε ἡμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/030.yaml
  text: Then they will begin to say to the mountains[a], ‘Fall on us,’ and to the hills[b], ‘Cover us.’
translation:
  language: fr
  text: 'Alors ils commenceront à dire aux montagnes[a] : « Tombez sur nous ! » et aux collines[b] : « Couvrez-nous ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cette formulation fait écho au langage prophétique du jugement, notamment à Osée 10.8.
    reason: cross_reference
  - marker: b
    text: 'Ou : « Cachez-nous ! » Le verbe signifie littéralement « couvrir », mais il exprime ici l’idée d’être dissimulé devant le jugement qui vient.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Alors
  rationale: Adverbe temporel qui marque la suite de ce que Jésus vient d’annoncer ; « Alors » est naturel et conserve la progression vers l’avenir.
- source_word: ἄρξονται λέγειν
  choice: ils commenceront à dire
  rationale: Cette formulation garde la valeur ingressive du futur ἄρξονται et rend directement l’infinitif complémentaire λέγειν.
- source_word: τοῖς ὄρεσιν
  choice: aux montagnes
  rationale: « Montagnes » rend ὄρεσιν tout en maintenant la distinction avec βουνοῖς, traduit par « collines ».
- source_word: Πέσετε ἐφ’ ἡμᾶς
  choice: Tombez sur nous !
  rationale: L’impératif aoriste est rendu par un impératif direct ; « sur nous » exprime naturellement le mouvement indiqué par ἐπί avec l’accusatif.
- source_word: τοῖς βουνοῖς
  choice: aux collines
  rationale: βουνός désigne ordinairement une colline ; ce choix préserve le contraste lexical avec ὄρεσιν.
- source_word: Καλύψατε ἡμᾶς
  choice: Couvrez-nous !
  rationale: « Couvrir » est le sens concret et direct du verbe ; il préserve aussi l’image prophétique, tandis que le sens contextuel « cachez-nous » est signalé en note.
theological_decisions:
- issue: Langage prophétique de jugement
  choice: Conserver l’appel concret adressé aux montagnes et aux collines, sans expliciter le jugement dans le texte principal.
  alternative: Paraphraser la demande comme un appel à être cachés du jugement à venir.
  rationale: Le texte fait écho au langage prophétique, notamment à Osée 10.8. La traduction maintient l’image et sa tension théologique sans imposer une interprétation explicative.
translation_notes:
  register: Français international moderne, naturel et digne. La ponctuation donne à chaque impératif la force du cri sans ajouter d’élément absent du grec.
