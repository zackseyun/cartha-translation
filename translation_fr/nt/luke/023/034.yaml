  text: ⸂ὁ δὲ Ἰησοῦς ἔλεγεν· Πάτερ, ἄφες αὐτοῖς, οὐ γὰρ οἴδασιν τί ποιοῦσιν.⸃ διαμεριζόμενοι δὲ τὰ ἱμάτια αὐτοῦ ἔβαλον ⸀κλήρους.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/034.yaml
  text: But Jesus was saying[a], “Father, forgive them, for they do not know what they are doing.” And dividing his garments, they cast lots.
translation:
  language: fr
  text: 'Mais Jésus disait[a] : « Père, pardonne-leur, car ils ne savent pas ce qu’ils font. » Et ils se partagèrent ses vêtements en tirant au sort.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Certains manuscrits omettent : « Père, pardonne-leur, car ils ne savent pas ce qu’ils font. »'
    reason: textual_variant
lexical_decisions:
- source_word: ἔλεγεν
  choice: disait
  rationale: L’imparfait grec présente la parole comme en cours ou répétée; l’imparfait français « disait » en conserve naturellement l’aspect.
- source_word: Πάτερ
  choice: Père
  rationale: Le vocatif est rendu directement, sans ajouter le possessif « mon », absent du grec.
- source_word: ἄφες
  choice: pardonne
  rationale: Dans une prière adressée à Dieu au sujet de personnes qui offensent, « pardonner » exprime naturellement le sens contextuel de ἀφίημι.
- source_word: αὐτοῖς
  choice: leur
  rationale: Le pronom conserve l’absence de précision du grec quant à l’identité exacte des personnes visées.
- source_word: οὐ γὰρ οἴδασιν τί ποιοῦσιν
  choice: car ils ne savent pas ce qu’ils font
  rationale: Cette formulation directe conserve le sens de connaissance de οἶδα sans introduire l’interprétation plus explicative « ils ne comprennent pas ».
- source_word: διαμεριζόμενοι
  choice: se partagèrent
  rationale: Dans ce contexte, le participe décrit le partage des vêtements entre plusieurs personnes; la tournure française est naturelle tout en conservant l’action.
- source_word: τὰ ἱμάτια αὐτοῦ
  choice: ses vêtements
  rationale: « Vêtements » est courant, digne et précis; le possessif français rend naturellement le génitif grec.
- source_word: ἔβαλον κλήρους
  choice: en tirant au sort
  rationale: « Tirer au sort » est l’expression idiomatique française correspondant à la pratique ancienne; la construction indique le moyen par lequel les vêtements furent répartis.
- source_word: δὲ
  choice: Mais / Puis
  rationale: Le premier δέ marque une légère transition ou opposition, rendue par « Mais ». Le second fait progresser le récit; « Puis » est naturel en français sans surcharger la coordination.
theological_decisions:
- issue: Authenticité de la parole « Père, pardonne-leur, car ils ne savent pas ce qu’ils font »
  choice: Parole incluse dans le texte principal
  alternative: Certains manuscrits omettent toute cette parole.
  rationale: Le SBLGNT imprime la proposition dans le texte tout en signalant une importante variation textuelle. La traduction suit donc le texte fourni et documente l’omission dans une note, sans trancher silencieusement la question.
translation_notes:
  register: Français international moderne, clair et digne. L’imparfait « disait » préserve l’aspect verbal grec. « Pardonne-leur » et « tirer au sort » sont des formulations idiomatiques courantes. La ponctuation distingue nettement la prière de la reprise du récit.
