- from: Alors Pilate décida d’accéder à leur demande[a].
  to: Et Pilate décida d’accéder à leur demande[a].
  rationale: La révision remplace le connecteur interprétatif « Alors » par « Et », qui préserve la valeur narrative non marquée de καί. Elle corrige aussi la formulation de la note afin d’exprimer idiomatiquement la décision judiciaire portée par ἐπέκρινεν. Le sens de la demande acceptée et réalisée, exprimé par γενέσθαι et αἴτημα, demeure inchangé.
