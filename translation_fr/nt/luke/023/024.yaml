  yaml_path: translation/nt/luke/023/024.yaml
  text: And Pilate decided that their demand should be granted[a].
translation:
  language: fr
  text: Et Pilate décida d’accéder à leur demande[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de manière plus formelle : « Pilate rendit jugement que leur requête soit exécutée. »'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Alors
  rationale: Dans ce contexte narratif, le connecteur marque la suite et l’aboutissement de la scène. « Alors » rend naturellement cette progression sans alourdir la phrase.
- source_word: Πιλᾶτος
  choice: Pilate
  rationale: Forme française traditionnelle et standard du nom propre.
- source_word: ἐπέκρινεν
  choice: décida
  rationale: Le verbe désigne ici une décision de caractère judiciaire. « Décida » est clair en français courant, tandis que la note conserve la formulation juridique plus explicite.
- source_word: γενέσθαι
  choice: d’accéder à
  rationale: Avec le verbe de décision et le complément « demande », cette tournure idiomatique exprime que Pilate autorise la réalisation de ce qui est demandé, sans préciser davantage le moyen d’exécution.
- source_word: τὸ αἴτημα
  choice: leur demande
  rationale: « Demande » correspond directement au sens de αἴτημα. Le contexte fait sentir la pression exercée sans qu’il soit nécessaire de renforcer lexicalement le terme en « exigence ».
- source_word: αὐτῶν
  choice: leur
  rationale: Le possessif pluriel renvoie aux personnes qui viennent de réclamer la crucifixion de Jésus.
theological_decisions:
- issue: Portée judiciaire de la décision de Pilate
  choice: Pilate décida d’accéder à leur demande
  alternative: Pilate prononça que leur requête devait être exécutée
  rationale: Le texte présente une décision officielle de Pilate donnant suite à la demande. La formulation principale reste naturelle et intelligible, tandis que la note signale la nuance judiciaire plus formelle sans ajouter de conclusion doctrinale ou historique.
translation_notes:
  register: Français international moderne, sobre et digne. La phrase privilégie une formulation courante tout en conservant en note la nuance judiciaire et plus formelle du grec.
