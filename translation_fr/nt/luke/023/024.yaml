  source_fidelity: 'Le sens central est bien rendu : ἐπέκρινεν exprime la décision judiciaire de Pilate et τὸ αἴτημα αὐτῶν désigne leur demande. Toutefois, « Alors » explicite une progression temporelle ou consécutive que καί n’impose pas ; « Et » conserve plus exactement le simple enchaînement narratif.'
  naturalness: '« Pilate décida d’accéder à leur demande » est naturel et clair en français moderne. La note actuelle, en revanche, est peu idiomatique : « prononça que » ne rend pas naturellement l’idée de rendre une décision judiciaire en français.'
  terminology: « Demande » convient à αἴτημα et « accéder à » en exprime correctement l’acceptation. « Rendit jugement » préserve dans la note la coloration judiciaire de ἐπέκρινεν sans surtraduire en « condamna » ou « passa sentence ».
