source:
  edition: SBLGNT
  text: Ἠκολούθει δὲ αὐτῷ πολὺ πλῆθος τοῦ λαοῦ καὶ γυναικῶν ⸀αἳ ἐκόπτοντο καὶ ἐθρήνουν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/027.yaml
  text: A large crowd of people followed him, including women who were beating their breasts and mourning for him.
translation:
  language: fr
  text: Une grande foule de gens le suivait, y compris des femmes qui se frappaient la poitrine et le pleuraient.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἠκολούθει
  choice: le suivait
  rationale: L’imparfait grec présente une action en cours dans le récit; l’imparfait français la rend naturellement.
- source_word: δὲ
  choice: non rendu séparément
  rationale: La particule assure ici la continuité narrative sans exiger un connecteur explicite en français.
- source_word: πολὺ πλῆθος τοῦ λαοῦ
  choice: une grande foule
  rationale: Cette formulation française naturelle exprime le grand nombre de personnes sans reproduire mécaniquement le génitif grec.
- source_word: καὶ γυναικῶν αἳ
  choice: avec des femmes qui
  rationale: La tournure présente les femmes au sein du groupe et rattache clairement le pronom relatif féminin à celles-ci.
- source_word: ἐκόπτοντο
  choice: se frappaient la poitrine
  rationale: Dans un contexte de deuil, le verbe désigne le geste rituel par lequel on manifeste sa douleur; l’explicitation est idiomatique et claire.
- source_word: ἐθρήνουν αὐτόν
  choice: se lamentaient sur lui
  rationale: La formulation conserve l’idée d’une lamentation, probablement audible, dont Jésus est l’objet.
theological_decisions: []
translation_notes:
  register: Français moderne, courant et digne. Les imparfaits maintiennent l’aspect duratif des trois verbes grecs. La construction évite que la proposition relative puisse désigner toute la foule plutôt que les femmes seules.
