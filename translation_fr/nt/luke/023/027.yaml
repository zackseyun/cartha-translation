  verdict: revise
  source_fidelity: 'Le sens général est bien rendu : une grande foule suit Jésus, et les femmes sont spécifiquement celles qui accomplissent les gestes de deuil. Toutefois, « avec des femmes » relâche légèrement la relation partitive exprimée par le grec, où les femmes font partie de la foule. « Se lamentaient sur lui » est possible, mais moins idiomatique et peut suggérer un commentaire plaintif plutôt qu’une lamentation dirigée vers Jésus.'
  naturalness: La phrase est fluide, mais « y compris des femmes » rend plus clairement et naturellement en français moderne que « avec des femmes » que celles-ci sont incluses dans la foule. « Le pleuraient » est une expression française directe et naturelle dans ce contexte de lamentation funèbre anticipée.
  terminology: « Se frappaient la poitrine » rend adéquatement κόπτοντο dans son contexte rituel de deuil. « Le pleuraient » rend θρηνέω avec son objet direct sans introduire une nuance interprétative supplémentaire.
