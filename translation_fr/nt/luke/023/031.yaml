  source_fidelity: « Car » rend adéquatement la valeur causale de ὅτι dans le contexte. « Si l’on fait cela au bois vert … qu’arrivera-t-il au bois sec ? » conserve le parallélisme de ἐν τῷ ὑγρῷ ξύλῳ / ἐν τῷ ξηρῷ, le démonstratif global ταῦτα et le sujet indéfini de ποιοῦσιν. La question finale restitue bien la portée prospective et rhétorique de τί γένηται.
  naturalness: La formulation est concise, idiomatique et d’un registre moderne et soutenu. « Bois vert » et « bois sec » constituent en français une opposition immédiatement compréhensible dans l’image du combustible. L’emploi de « l’on » convient au sujet non exprimé et indéfini.
  terminology: Le choix de « bois », plutôt que « arbre », respecte l’image sans en imposer les référents. « Vert » est le terme français usuel pour du bois frais/non sec dans ce contraste. La note maintient avec justesse l’ambiguïté métaphorique et ne transforme pas une interprétation possible en sens explicite du verset.
