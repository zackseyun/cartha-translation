id: LUK.23.31
reference: Luke 23:31
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὅτι εἰ ἐν ⸀τῷ ὑγρῷ ξύλῳ ταῦτα ποιοῦσιν, ἐν τῷ ξηρῷ τί γένηται;
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/031.yaml
  text: For if they do these things when the wood is green[b][a], what will happen when it is dry?
translation:
  language: fr
  text: Car si l’on fait cela au bois vert[a], qu’arrivera-t-il au bois sec ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’image oppose le bois vert, encore humide et difficile à brûler, au bois sec. Elle semble aller du moindre au plus grand, mais ses référents précis ne sont pas explicités.
    reason: cultural_note
lexical_decisions:
- source_word: ὅτι
  choice: Car
  rationale: Introduit la raison qui fonde l’avertissement précédent et conserve naturellement la valeur causale du grec.
- source_word: ἐν τῷ ὑγρῷ ξύλῳ
  choice: au bois vert
  rationale: Conserve l’image proverbiale et le parallélisme du grec dans une formulation française naturelle.
- source_word: ὑγρῷ
  choice: vert
  rationale: Dans son opposition à ξηρός, désigne naturellement du bois encore frais et humide, difficile à brûler.
- source_word: ξύλῳ
  choice: bois
  rationale: Le contexte oppose deux états d’un matériau combustible; « bois » convient mieux que « arbre » sans préciser abusivement le référent métaphorique.
- source_word: ταῦτα
  choice: cela
  rationale: Le démonstratif pluriel grec renvoie globalement aux actes en cours; le singulier collectif « cela » est idiomatique en français.
- source_word: ποιοῦσιν
  choice: l’on fait
  rationale: Le sujet grec n’est pas exprimé et reste ouvert; « l’on » rend cette indétermination sans identifier des acteurs précis.
- source_word: ἐν τῷ ξηρῷ
  choice: au bois sec
  rationale: Rétablit elliptiquement « bois » pour préserver en français le contraste explicite avec le bois vert.
- source_word: τί γένηται
  choice: qu’arrivera-t-il
  rationale: Rend la question rhétorique orientée vers une conséquence attendue, dans un français actuel et digne.
theological_decisions:
- issue: Référents du bois vert et du bois sec
  choice: Maintenir l’image sans identifier ses référents dans le texte principal.
  alternative: Identifier Jésus au bois vert et Jérusalem ou ses habitants au bois sec, ou expliciter directement un raisonnement allant du moindre au plus grand.
  rationale: La parole suggère une aggravation à venir, mais le texte ne nomme pas explicitement les référents. La traduction préserve donc l’ambiguïté et la tension théologique.
translation_notes:
  register: Français international moderne, concis et digne. Le parallélisme proverbial est conservé; « l’on » maintient le sujet indéfini du grec.
