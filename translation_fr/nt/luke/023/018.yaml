  text: ⸀Ἀνέκραγον δὲ παμπληθεὶ λέγοντες· Αἶρε τοῦτον, ἀπόλυσον δὲ ἡμῖν ⸀τὸν Βαραββᾶν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/018.yaml
  text: But they all cried out together[a], saying, “Take this man away, and release Barabbas to us!”
translation:
  language: fr
  text: 'Mais ils crièrent tous ensemble : « Enlève cet homme[a] ! Relâche-nous Barabbas ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Emmène cet homme ! » Le grec demande de l’écarter; dans ce contexte, cette demande conduit à son exécution, sans que le verbe lui-même ne dise explicitement « mettre à mort ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀνέκραγον
  choice: crièrent
  rationale: Le verbe exprime un cri collectif et intense ; « crièrent » est naturel et digne en français moderne.
- source_word: δὲ
  choice: Mais
  rationale: La conjonction marque ici le contraste avec la démarche précédente de Pilate.
- source_word: παμπληθεὶ
  choice: tous ensemble
  rationale: L’expression souligne que la foule agit collectivement ; cette formulation conserve ce sens sans ajouter l’idée plus interprétative d’une voix unanime.
- source_word: λέγοντες
  choice: — contenu introduit directement après les deux-points
  rationale: En français, après « crièrent », la citation directe rend naturellement le participe sans qu’il soit nécessaire d’ajouter « en disant ».
- source_word: Αἶρε τοῦτον
  choice: À mort cet homme !
  rationale: Dans ce contexte judiciaire, l’impératif demande que Jésus soit éliminé ; cette tournure française idiomatique conserve la violence de l’exclamation, tout en explicitant davantage que le grec littéral « Enlève celui-ci ».
- source_word: ἀπόλυσον
  choice: Relâche
  rationale: L’impératif désigne la libération d’une personne détenue et convient au contexte judiciaire.
- source_word: ἡμῖν
  choice: -nous
  rationale: Le pronom datif indique les bénéficiaires de la libération demandée et se rend idiomatiquement par le pronom conjoint français.
- source_word: τὸν Βαραββᾶν
  choice: Barabbas
  rationale: Le nom propre suit sa forme française traditionnelle et largement reconnue.
theological_decisions:
- issue: Portée de l’ordre Αἶρε τοῦτον
  choice: « À mort cet homme ! »
  alternative: « Enlève cet homme ! » ou « Emmène cet homme ! »
  rationale: Le contexte conduit vers l’exécution de Jésus, et l’exclamation française exprime clairement la demande hostile. Toutefois, cette traduction précise l’implication contextuelle plus que le sens lexical immédiat de αἴρω.
translation_notes:
  register: Français international moderne, oral et vigoureux dans la citation, avec une narration sobre. La structure brève restitue l’intensité de la scène.
