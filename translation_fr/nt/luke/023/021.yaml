  yaml_path: translation/nt/luke/023/021.yaml
  text: But they kept shouting, saying, “Crucify, crucify him!”
translation:
  language: fr
  text: 'Mais eux criaient avec insistance : « Crucifie-le ! Crucifie-le ! »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ
  choice: Mais eux
  rationale: Le pronom substantivé renvoie aux personnes déjà présentes dans le contexte, tandis que δέ marque ici le contraste avec les paroles précédentes.
- source_word: ἐπεφώνουν
  choice: criaient avec insistance
  rationale: L’imparfait présente une clameur prolongée ou répétée, et ἐπιφωνέω exprime un appel lancé à haute voix.
- source_word: λέγοντες
  choice: introduit directement par les deux-points
  rationale: Le participe introduit le contenu de leur cri. En français actuel, les deux-points rendent naturellement cette fonction sans l’expression plus lourde « en disant ».
- source_word: Σταύρου σταύρου
  choice: Crucifie-le ! Crucifie-le !
  rationale: L’impératif répété exprime l’urgence et l’insistance. Répéter la proposition complète est naturel en français et conserve la force de la répétition grecque.
- source_word: αὐτόν
  choice: le
  rationale: Le pronom accusatif est rendu directement comme complément de chacun des impératifs répétés en français.
theological_decisions:
- issue: Sens de σταύρωσον dans la demande d’exécution
  choice: Crucifie-le
  alternative: Mets-le à mort sur une croix
  rationale: Le verbe désigne spécifiquement la mise en croix. « Crucifier » en donne le sens précis sans ajouter d’interprétation théologique.
translation_notes:
  register: Français international moderne, direct et digne. La construction participiale grecque est transformée en discours direct après deux-points pour éviter un calque peu naturel, tandis que l’aspect duratif de l’imparfait est explicité par « avec insistance ».
