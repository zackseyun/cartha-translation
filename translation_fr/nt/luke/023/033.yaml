id: LUK.23.33
reference: Luke 23:33
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ὅτε ⸀ἦλθον ἐπὶ τὸν τόπον τὸν καλούμενον Κρανίον, ἐκεῖ ἐσταύρωσαν αὐτὸν καὶ τοὺς κακούργους, ὃν μὲν ἐκ δεξιῶν ὃν δὲ ἐξ ἀριστερῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/033.yaml
  text: And when they came to the place called Skull[a], there they crucified him and the criminals[b], one on the right and one on the left.
translation:
  language: fr
  text: Quand ils arrivèrent au lieu appelé le Crâne[a], ils l’y crucifièrent, ainsi que les malfaiteurs, l’un à droite et l’autre à gauche.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le nom grec signifie littéralement « crâne ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθον ἐπὶ τὸν τόπον
  choice: ils arrivèrent au lieu
  rationale: Avec un verbe de mouvement, ἐπί suivi de l’accusatif indique ici l’arrivée à destination. « Arrivèrent au lieu » est naturel en français narratif et précis.
- source_word: τὸν καλούμενον Κρανίον
  choice: appelé le Crâne
  rationale: Κρανίον signifie littéralement « crâne ». La traduction du nom commun conserve sa valeur descriptive sans importer la forme traditionnelle « Calvaire », issue du latin.
- source_word: ἐσταύρωσαν
  choice: ils crucifièrent
  rationale: « Crucifier » est le terme français standard et précis pour σταυρόω, sans ajouter de détails matériels que le verbe n’explicite pas.
- source_word: κακούργους
  choice: malfaiteurs
  rationale: κακοῦργος désigne une personne ayant commis des actes criminels. « Malfaiteurs » reste courant, digne et suffisamment large, sans harmoniser avec les termes employés dans d’autres récits.
- source_word: ὃν μὲν ἐκ δεξιῶν ὃν δὲ ἐξ ἀριστερῶν
  choice: l’un à droite et l’autre à gauche
  rationale: Cette tournure française rend naturellement la construction distributive grecque. Le possessif « de lui » n’est pas ajouté, puisqu’il demeure implicite dans le texte source.
theological_decisions:
- issue: Traduction de Κρανίον
  choice: le Crâne
  alternative: Calvaire ; Crâne sans article
  rationale: Le mot grec est une désignation de lieu formée sur un nom commun signifiant « crâne ». « Le Crâne » en préserve le sens et correspond à l’usage naturel du français, sans recourir à la forme latine traditionnelle.
- issue: Désignation des deux hommes crucifiés avec Jésus
  choice: malfaiteurs
  alternative: criminels ; brigands
  rationale: Le terme lucanien κακοῦργοι est général. « Malfaiteurs » conserve cette largeur de sens, tandis que « brigands » préciserait indûment la nature de leurs actes et risquerait d’harmoniser Luc avec d’autres formulations évangéliques.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe conserve la progression narrative grecque tout en évitant les calques lourds. « Ils l’y crucifièrent » restitue avec concision l’emphase spatiale de ἐκεῖ.
