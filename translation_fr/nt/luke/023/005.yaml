id: LUK.23.5
reference: Luke 23:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οἱ δὲ ἐπίσχυον λέγοντες ὅτι Ἀνασείει τὸν λαὸν διδάσκων καθ’ ὅλης τῆς Ἰουδαίας, ⸀καὶ ἀρξάμενος ἀπὸ τῆς Γαλιλαίας ἕως ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/005.yaml
  text: But they kept insisting[a], saying, “He stirs up the people, teaching throughout all Judea[c][b], beginning from Galilee even to here.”
translation:
  language: fr
  text: 'Mais ils insistaient avec force : « Il agite le peuple[a] en enseignant dans toute la Judée[b], depuis la Galilée jusqu’ici[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « il excite le peuple ». Le verbe grec évoque le fait d’agiter ou de pousser la population au trouble.
    reason: lexical_alternative
  - marker: b
    text: « Judée » peut désigner ici soit la région de Judée proprement dite, soit, dans un sens plus large, le territoire juif concerné. L’expression souligne surtout l’étendue de son activité.
    reason: cultural_note
  - marker: c
    text: Ou « jusque dans ce lieu ». L’expression désigne l’endroit où ils se trouvent alors devant Pilate.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπίσχυον
  choice: insistaient avec force
  rationale: L’imparfait exprime une pression soutenue ou répétée; cette formulation rend à la fois la durée et l’intensité de leur insistance.
- source_word: Ἀνασείει
  choice: soulève
  rationale: Le verbe décrit l’action de remuer ou d’exciter la population dans un sens perturbateur. « Soulève » conserve la force de l’accusation sans préciser indûment un crime technique d’insurrection.
- source_word: τὸν λαὸν
  choice: le peuple
  rationale: λαός désigne ici la population en général, et non une foule particulière réunie en un lieu.
- source_word: διδάσκων
  choice: en enseignant
  rationale: Le participe présent indique le moyen ou la manière dont Jésus serait censé soulever le peuple.
- source_word: καθ’ ὅλης τῆς Ἰουδαίας
  choice: dans toute la Judée
  rationale: κατά avec le génitif exprime ici l’étendue géographique de l’activité alléguée; la tournure française est naturelle et conserve cette portée globale.
- source_word: ἀρξάμενος ἀπὸ τῆς Γαλιλαίας
  choice: depuis la Galilée
  rationale: La formulation marque la Galilée comme point de départ. En français, « depuis » s’accorde naturellement avec le point d’arrivée « jusqu’ici ».
- source_word: ἕως ὧδε
  choice: jusqu’ici
  rationale: Cette expression conserve la valeur déictique du grec et présente le lieu où se trouve Pilate comme l’aboutissement actuel de l’activité alléguée.
theological_decisions:
- issue: Nature de l’accusation portée contre Jésus
  choice: Il soulève le peuple
  alternative: Il incite le peuple à la révolte
  rationale: L’accusation évoque une agitation dangereuse, mais le verbe grec ne requiert pas à lui seul l’idée explicite d’une révolte politique. La traduction conserve la gravité et l’ambiguïté de l’accusation.
- issue: Portée géographique de « Judée »
  choice: Conserver le nom propre « Judée »
  alternative: Comprendre le terme au sens large de territoire juif
  rationale: Le grec peut employer Ἰουδαία avec une portée régionale stricte ou plus large selon le contexte. Le texte principal garde le nom géographique sans trancher silencieusement, et la note signale l’ambiguïté.
translation_notes:
  register: Français international moderne, clair et digne. « Insistaient avec force » restitue la pression continue des accusateurs; « soulève le peuple » reste idiomatique tout en préservant la portée accusatrice et non technique du grec. Les marqueurs de notes suivent l’ordre de leur apparition dans le texte.
