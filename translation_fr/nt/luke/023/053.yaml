  text: καὶ ⸀καθελὼν ἐνετύλιξεν αὐτὸ σινδόνι, καὶ ἔθηκεν ⸀αὐτὸν ἐν μνήματι λαξευτῷ οὗ οὐκ ἦν ⸂οὐδεὶς οὔπω⸃ κείμενος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/053.yaml
  text: And after taking him down[a], he wrapped him in a linen cloth and placed him in a tomb cut in stone[b], where no one had yet been laid.
translation:
  language: fr
  text: Après l’avoir descendu, il l’enveloppa d’un linge de lin et le déposa dans un tombeau taillé dans la roche[a], où personne n’avait encore été déposé[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un tombeau creusé dans le roc ».
    reason: lexical_alternative
  - marker: b
    text: Ou « où personne n’avait encore été couché ».
    reason: lexical_alternative
lexical_decisions:
- source_word: καθελὼν
  choice: Puis il le descendit
  rationale: Le participe aoriste de καθαιρέω désigne ici l’action de retirer le corps de Jésus de la croix. La coordination française exprime naturellement la succession des actions sans ajouter explicitement « de la croix », déjà évident dans le contexte.
- source_word: ἐνετύλιξεν
  choice: l’enveloppa
  rationale: ἐντυλίσσω signifie envelopper dans une étoffe. « Enveloppa » est courant, précis et adapté au contexte funéraire.
- source_word: σινδόνι
  choice: dans une toile de lin
  rationale: Le datif indique le moyen; σινδών désigne une pièce d’étoffe en lin. « Toile de lin » reste concret et évite le terme plus interprétatif « linceul ».
- source_word: ἔθηκεν
  choice: le déposa
  rationale: τίθημι signifie ici mettre ou déposer le corps dans le tombeau. « Déposa » convient au registre digne du récit funéraire.
- source_word: μνήματι
  choice: dans un tombeau
  rationale: μνῆμα désigne un lieu de sépulture. « Tombeau » correspond bien au contexte d’une cavité funéraire taillée.
- source_word: λαξευτῷ
  choice: taillé dans la roche
  rationale: λαξευτός signifie taillé ou creusé dans une matière dure. « Taillé dans la roche » rend clairement le type de tombeau sans archaïsme.
- source_word: οὗ
  choice: où
  rationale: L’adverbe relatif renvoie au tombeau; « où » est l’équivalent français le plus naturel.
- source_word: οὐδεὶς οὔπω κείμενος
  choice: où personne n’avait encore été déposé
  rationale: La construction indique qu’aucune personne n’y avait jusque-là été couchée ou placée. Dans ce contexte funéraire, « n’avait encore été déposé » exprime naturellement que le tombeau n’avait pas encore servi, tout en maintenant le lien avec le corps déposé.
theological_decisions:
- issue: Description de l’ensevelissement et du tombeau
  choice: Joseph dépose Jésus dans un tombeau taillé dans la roche où personne n’avait encore été déposé.
  alternative: Joseph dépose Jésus dans un tombeau taillé où personne n’avait encore reposé.
  rationale: Le verset fournit des précisions historiques sans développer une affirmation doctrinale distincte. La traduction conserve ces détails sans importer ceux des récits parallèles ni préciser davantage l’état antérieur du tombeau.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au registre biblique littéraire sans être archaïque. La formulation reste accessible et évite d’ajouter « de la croix », implicite dans le contexte immédiat.
