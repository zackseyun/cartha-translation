review_pass:
  verdict: revise
  source_fidelity: La succession du participe aoriste καθελών et des verbes principaux est mieux rendue par « Après l’avoir descendu » que par « Puis il le descendit ». Le reste rend fidèlement l’enveloppement dans une étoffe de lin, le dépôt dans un tombeau taillé dans la roche et le fait que nul n’y avait encore été placé.
  naturalness: « Puis il le descendit » est grammaticalement possible, mais moins naturel et moins net en français moderne que la tournure participiale « Après l’avoir descendu ». « L’enveloppa d’un linge de lin » est également plus idiomatique que « l’enveloppa dans une toile de lin ».
  terminology: « Tombeau », « taillé dans la roche » et « déposé » conviennent au registre narratif et funéraire. « Linge de lin » rend σινδών sans imposer l’interprétation plus spécifique de « linceul ».
  issues:
