- from: Puis il le descendit, l’enveloppa dans une toile de lin et le déposa dans un tombeau taillé dans la roche[a], où personne n’avait encore été déposé[b].
  to: Après l’avoir descendu, il l’enveloppa d’un linge de lin et le déposa dans un tombeau taillé dans la roche[a], où personne n’avait encore été déposé[b].
  rationale: La révision restitue plus clairement la valeur antérieure du participe καθελών et améliore l’idiome français sans ajouter « de la croix », absent du verset. Elle maintient la description sobre du tombeau non encore utilisé et conserve des notes lexicales correctement ancrées.
