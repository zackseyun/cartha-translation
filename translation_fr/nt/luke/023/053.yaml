    issue: Rendu de καθελών par « Puis il le descendit »
    rationale: La coordination avec « Puis » affaiblit le rapport participial de priorité. « Après l’avoir descendu » rend naturellement l’action accomplie avant l’enveloppement et le dépôt.
  - severity: low
    issue: Construction « enveloppa dans une toile de lin »
    rationale: Elle est compréhensible, mais « enveloppa d’un linge de lin » est plus idiomatique en français et exprime bien le datif instrumental σινδόνι.
  - severity: low
    issue: 'Note b : « reposé »'
    rationale: « Reposé » peut évoquer le repos plutôt que la position ou le dépôt du corps. « couché » conserve plus directement la valeur de κείμενος tout en restant une alternative naturelle.
  revised_text: Après l’avoir descendu, il l’enveloppa d’un linge de lin et le déposa dans un tombeau taillé dans la roche[a], où personne n’avait encore été déposé[b].
