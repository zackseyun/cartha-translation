  text: ⸂Καὶ ἦν⸃ ⸀ἤδη ὡσεὶ ὥρα ἕκτη καὶ σκότος ἐγένετο ἐφ’ ὅλην τὴν γῆν ἕως ὥρας ἐνάτης
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/044.yaml
  text: And it was already about the sixth hour[b][a], and darkness came over the whole land until the ninth hour.
translation:
  language: fr
  text: Il était déjà environ la sixième heure[a], et l’obscurité se fit sur tout le pays[b] jusqu’à la neuvième heure.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: C’est-à-dire environ midi; la neuvième heure correspond à environ trois heures de l’après-midi.
    reason: cultural_note
  - marker: b
    text: Ou « sur toute la terre ». Le mot grec peut désigner soit un pays, soit la terre.
    reason: alternative_reading
lexical_decisions:
- source_word: ἤδη
  choice: déjà
  rationale: Marque que ce moment du récit était déjà arrivé et correspond directement au sens du grec.
- source_word: ὡσεὶ
  choice: environ
  rationale: Exprime l’approximation de l’heure sans suggérer une précision moderne.
- source_word: ὥρα ἕκτη
  choice: la sixième heure
  rationale: Conserve la manière antique de compter les heures et la texture du texte source; l’équivalent moderne est donné en note.
- source_word: σκότος
  choice: l’obscurité
  rationale: Rend simplement et naturellement le nom grec dans ce contexte.
- source_word: ἐγένετο
  choice: se fit
  rationale: Expression française naturelle et digne qui garde la valeur événementielle de γίνομαι.
- source_word: ἐφ’ ὅλην τὴν γῆν
  choice: sur tout le pays
  rationale: γῆ peut désigner le pays ou la terre entière. « pays » évite d’imposer une portée mondiale, tandis que l’autre possibilité est conservée en note.
- source_word: ἕως ὥρας ἐνάτης
  choice: jusqu’à la neuvième heure
  rationale: Conserve l’expression temporelle du grec en parallèle avec « la sixième heure »; l’équivalent moderne figure en note.
theological_decisions:
- issue: Portée de γῆ dans le récit de l’obscurité
  choice: pays
  alternative: terre entière
  rationale: Le grec permet une portée régionale ou universelle. Le texte principal retient le sens contextuellement plus prudent, sans exclure l’interprétation cosmique, signalée en note.
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve le système horaire antique dans le texte tout en l’expliquant en note, et maintient l’ambiguïté réelle de γῆ.
