id: LUK.23.38
reference: Luke 23:38
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἦν δὲ καὶ ⸀ἐπιγραφὴ ἐπ’ ⸀αὐτῷ· Ὁ βασιλεὺς τῶν Ἰουδαίων ⸀οὗτος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/038.yaml
  text: 'And there was also an inscription over him: “This is the King of the Jews.”[a][b][c][d]'
translation:
  language: fr
  text: 'Il y avait aussi au-dessus de lui une inscription[a] : « Celui-ci est le roi des Juifs. »[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un écriteau », « un panneau » ou « l’accusation écrite ».
    reason: lexical_alternative
  - marker: b
    text: 'Le grec dit littéralement : « Le roi des Juifs, celui-ci. »'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ καὶ
  choice: aussi
  rationale: Le tour ajoute un détail au récit. « Il y avait aussi » est naturel en français et conserve la valeur additive.
- source_word: ἐπιγραφή
  choice: inscription
  rationale: Le terme désigne un texte écrit affiché sur la croix ou au-dessus du crucifié. « Inscription » en garde le caractère formel sans préciser indûment qu’il s’agit d’un chef d’accusation.
- source_word: ἐπ’ αὐτῷ
  choice: au-dessus de lui
  rationale: Dans le contexte de la crucifixion, cette formulation exprime naturellement la position de l’inscription par rapport à Jésus. Le grec peut aussi se comprendre plus littéralement comme « sur lui ».
- source_word: Ὁ βασιλεὺς τῶν Ἰουδαίων οὗτος
  choice: Celui-ci est le roi des Juifs
  rationale: Le grec, sans verbe exprimé, place οὗτος à la fin avec une force démonstrative. Le français supplée naturellement « est » tout en conservant cette désignation appuyée.
- source_word: Ἰουδαίων
  choice: Juifs
  rationale: Dans le titre traditionnel et politico-ethnique de la crucifixion, « roi des Juifs » est la formulation française établie et contextuellement juste; « Judéens » est possible dans d’autres contextes.
theological_decisions:
- issue: Nature et portée de l’inscription de la crucifixion
  choice: Rapporter simplement l’existence et le texte de l’inscription, sans expliciter une accusation juridique, une ironie ou une confession messianique.
  alternative: Traduire « inscription » par « chef d’accusation » ou développer explicitement sa portée ironique ou politique.
  rationale: Le verset donne le texte affiché mais n’en explique pas ici la fonction ni la portée. La traduction préserve cette tension sans imposer une interprétation.
translation_notes:
  register: Français international moderne, clair et digne. « Celui-ci » conserve mieux que « Cet homme » la force démonstrative du grec sans ajouter le nom « homme ». Deux notes suffisent à signaler les principales nuances lexicales et syntaxiques; « Juifs » ne nécessite pas ici une note distincte, car il s’agit de la traduction contextuellement normale du titre.
