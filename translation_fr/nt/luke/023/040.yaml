  text: ἀποκριθεὶς δὲ ὁ ἕτερος ⸂ἐπιτιμῶν αὐτῷ ἔφη⸃· Οὐδὲ φοβῇ σὺ τὸν θεόν, ὅτι ἐν τῷ αὐτῷ κρίματι εἶ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/040.yaml
  text: But the other answered[a], rebuking him, “Do you not even fear God, since you are under the same sentence?”
translation:
  language: fr
  text: 'Mais l’autre lui répondit en le reprenant : « Tu ne crains même pas Dieu, toi, puisque tu subis la même sentence[a] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la même condamnation » ou « le même jugement ». Le grec κρίμα peut désigner un jugement, un verdict, une condamnation ou une sentence ; dans ce contexte, il renvoie à la sanction pénale commune aux deux hommes.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ ἕτερος
  choice: Mais l’autre lui répondit
  rationale: δὲ marque ici le contraste avec le premier criminel, tandis que ἀποκριθείς introduit naturellement la réplique. Le pronom indirect anticipe sans ambiguïté αὐτῷ.
- source_word: ἐπιτιμῶν αὐτῷ
  choice: en le reprenant
  rationale: Le participe présent exprime la manière dont l’autre répond. « Reprendre » conserve l’idée d’une réprimande ferme dans un français biblique actuel et naturel.
- source_word: Οὐδὲ φοβῇ σὺ τὸν θεόν
  choice: Toi non plus, tu ne crains pas Dieu
  rationale: « Toi non plus » rend l’emphase de οὐδὲ et du pronom explicite σὺ dans le contexte immédiat. « Craindre Dieu » préserve directement l’idiome moral et religieux grec.
- source_word: ὅτι
  choice: alors que
  rationale: Dans cette question de reproche, la circonstance partagée rend l’absence de crainte particulièrement choquante. « Alors que » exprime naturellement cette relation circonstancielle à nuance argumentative, sans modifier le fond causal.
- source_word: ἐν τῷ αὐτῷ κρίματι εἶ
  choice: tu subis la même condamnation
  rationale: κρίμα peut désigner le jugement, le verdict ou la condamnation. Dans la scène de crucifixion, la formulation française indique clairement la sanction pénale commune, tout en signalant les autres possibilités en note.
theological_decisions:
- issue: Sens de la crainte de Dieu
  choice: « tu ne crains pas Dieu »
  alternative: « tu ne révères pas Dieu » ou « tu n’as aucun respect pour Dieu »
  rationale: La traduction garde l’expression biblique et sa force théologique sans la réduire au simple respect ni développer une interprétation doctrinale.
- issue: Portée de κρίμα
  choice: « la même condamnation »
  alternative: « le même jugement » ou « la même sentence »
  rationale: Le contexte pénal favorise « condamnation », mais le terme grec demeure assez large pour inclure jugement, verdict ou sentence; cette latitude est conservée dans la note.
translation_notes:
  register: Français international moderne, digne et oralement naturel. La syntaxe de la question fait ressortir la réprimande et l’emphase portée par σὺ, sans lourdeur ni ajout confessionnel.
