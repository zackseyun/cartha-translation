  text: οἱ δὲ ἐπέκειντο φωναῖς μεγάλαις αἰτούμενοι αὐτὸν σταυρωθῆναι, καὶ κατίσχυον αἱ φωναὶ ⸀αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/023.yaml
  text: But they kept pressing with loud voices[a], asking that he be crucified, and their voices prevailed.
translation:
  language: fr
  text: Mais eux insistaient à grands cris, demandant qu’il soit crucifié, et leurs cris l’emportaient.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπέκειντο
  choice: insistaient
  rationale: L’imparfait exprime une pression persistante. « Insistaient » rend naturellement cette action continue sans ajouter un destinataire absent de la proposition grecque.
- source_word: φωναῖς μεγάλαις
  choice: à grands cris
  rationale: φωνή peut désigner la voix ou le cri. Dans cette scène de forte pression collective, « à grands cris » est idiomatique en français et rend l’intensité de μεγάλαις.
- source_word: αἰτούμενοι
  choice: demandant
  rationale: Le sens lexical de base est « demander », mais le contexte et ἐπέκειντο indiquent ici une requête pressante. « Demandant » conserve en français les deux nuances sans surtraduire par « exigeant ».
- source_word: αὐτὸν σταυρωθῆναι
  choice: qu’il soit crucifié
  rationale: Cette proposition rend clairement l’accusatif avec infinitif et préserve la voix passive de σταυρωθῆναι.
- source_word: κατίσχυον
  choice: finissaient par l’emporter
  rationale: L’imparfait décrit des cris qui prenaient le dessus dans le déroulement de la scène. « Finissaient par l’emporter » exprime idiomatiquement ce processus qui aboutit, sans préciser sur qui ils l’emportaient.
- source_word: αἱ φωναὶ αὐτῶν
  choice: leurs cris
  rationale: La reprise de « cris » conserve en français la répétition de φωνή entre les deux propositions et souligne que leur clameur elle-même prend le dessus.
theological_decisions: []
translation_notes:
  register: Français moderne, international et digne. La phrase garde la progression narrative de l’imparfait grec et la répétition de φωνή au moyen de « cris », tout en évitant une tournure littérale peu naturelle comme « avec de grandes voix ».
