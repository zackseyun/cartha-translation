  source_fidelity: 'La traduction rend fidèlement la pression continue de ἐπέκειντο, la force de φωναῖς μεγάλαις, la demande au passif (« qu’il soit crucifié ») et la répétition de φωνή par « cris ». Toutefois, « finissaient par l’emporter » introduit plus nettement l’idée d’une issue finalement atteinte, tandis que l’imparfait κατίσχυον décrit l’action en cours : leurs voix/cris prenaient le dessus.'
