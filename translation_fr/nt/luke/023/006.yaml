  text: Πιλᾶτος δὲ ⸀ἀκούσας ἐπηρώτησεν εἰ ὁ ἄνθρωπος Γαλιλαῖός ἐστιν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/006.yaml
  text: But Pilate[a], hearing this, asked whether the man was a Galilean,
translation:
  language: fr
  text: Mais Pilate, après avoir entendu cela, demanda si l’homme était galiléen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « Mais Pilate, ayant entendu, demanda si l’homme est galiléen. »'
    reason: La note signale le participe aoriste grec avec son objet implicite et le présent grec conservé sans transposition temporelle.
lexical_decisions:
- source_word: δὲ
  choice: Mais
  rationale: La particule marque ici une légère transition, avec une nuance de contraste par rapport à ce qui précède.
- source_word: ἀκούσας
  choice: en entendant cela
  rationale: Le participe aoriste se rapporte à Pilate. « Cela » explicite naturellement en français l’objet sous-entendu par le grec et renvoie aux paroles qui viennent d’être prononcées.
- source_word: ἐπηρώτησεν
  choice: demanda
  rationale: Rend directement et naturellement le verbe grec signifiant poser une question ou s’informer.
- source_word: εἰ
  choice: si
  rationale: Introduit naturellement une interrogation indirecte en français.
- source_word: ὁ ἄνθρωπος
  choice: cet homme
  rationale: Dans ce contexte, l’article grec renvoie à l’homme dont il vient d’être question; le démonstratif français assure une référence claire sans nommer explicitement Jésus.
- source_word: Γαλιλαῖός
  choice: Galiléen
  rationale: L’adjectif prédicatif exprime l’appartenance régionale. Le nom de gentilé français en donne l’équivalent direct.
- source_word: ἐστιν
  choice: était
  rationale: Le français transpose naturellement le présent grec au passé dans une interrogation indirecte dépendant du verbe passé « demanda ».
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La phrase conserve la progression narrative et l’interrogation indirecte, tout en évitant une formulation inutilement littérale.
