reference: Luke 23:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐγένοντο δὲ φίλοι ὅ τε ⸂Ἡρῴδης καὶ ὁ Πιλᾶτος⸃ ἐν αὐτῇ τῇ ἡμέρᾳ μετ’ ἀλλήλων· προϋπῆρχον γὰρ ἐν ἔχθρᾳ ὄντες πρὸς ⸀αὑτούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/012.yaml
  text: And Herod and Pilate became friends with each other on that very day[b][a], for previously they had been in hostility toward one another.
translation:
  language: fr
  text: Ce jour-là même, Hérode et Pilate devinrent amis[a], car auparavant ils étaient ennemis l’un de l’autre[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « se lièrent d’amitié ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « ils étaient auparavant dans l’hostilité l’un envers l’autre ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένοντο
  choice: devinrent
  rationale: L’aoriste de γίνομαι marque ici un changement de relation; « devinrent » l’exprime directement et naturellement.
- source_word: φίλοι
  choice: amis
  rationale: Le nom attribut φίλοι désigne des amis ou alliés; « amis » conserve la formulation directe sans préciser la nature politique ou personnelle de la relation.
- source_word: ὅ τε Ἡρῴδης καὶ ὁ Πιλᾶτος
  choice: Hérode et Pilate
  rationale: La construction corrélative réunit les deux personnages; en français, la coordination simple suffit naturellement.
- source_word: ἐν αὐτῇ τῇ ἡμέρᾳ
  choice: Ce jour-là même
  rationale: « Même » rend l’insistance portée par αὐτῇ et la structure articulée.
- source_word: μετ’ ἀλλήλων
  choice: l’un de l’autre
  rationale: La tournure réciproque française complète naturellement « devinrent amis ».
- source_word: προϋπῆρχον
  choice: auparavant ils étaient
  rationale: L’imparfait indique une situation déjà existante et durable avant le changement survenu ce jour-là.
- source_word: ἐν ἔχθρᾳ ὄντες πρὸς αὑτούς
  choice: ils étaient ennemis l’un de l’autre
  rationale: Cette formulation française naturelle conserve l’idée d’une hostilité réciproque, sans ajouter de motif ni de degré.
theological_decisions:
- issue: Nature du changement de relation entre Hérode et Pilate
  choice: Ils « devinrent amis », sans préciser s’il s’agissait d’une amitié personnelle ou d’une alliance de circonstance.
  alternative: « Ils se rapprochèrent » ou « devinrent amis l’un avec l’autre » pourrait exprimer plus faiblement le changement.
  rationale: φίλοι soutient directement « amis », mais le verset ne définit ni la profondeur ni les motifs de cette nouvelle relation.
translation_notes:
  register: Français international moderne, clair et digne. L’ordre initial « Ce jour-là même » met naturellement en relief l’indication temporelle. Les notes préservent la possibilité d’une relation moins forte et la formulation nominale du grec pour l’hostilité.
