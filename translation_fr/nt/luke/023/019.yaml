source:
  edition: SBLGNT
  text: ὅστις ἦν διὰ στάσιν τινὰ γενομένην ἐν τῇ πόλει καὶ φόνον ⸂βληθεὶς ἐν τῇ φυλακῇ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/019.yaml
  text: who had been thrown into prison for a certain uprising that had taken place in the city[a], and for murder.
translation:
  language: fr
  text: Celui-ci avait été jeté en prison pour une certaine révolte survenue dans la ville[a], et pour meurtre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « insurrection ». Le grec στάσις peut désigner une révolte, un soulèvement ou une insurrection.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅστις
  choice: Celui-ci
  rationale: Le pronom renvoie précisément à Barabbas. « Celui-ci » forme naturellement une proposition autonome en français tout en maintenant le lien avec le verset précédent.
- source_word: διὰ
  choice: à cause de
  rationale: Avec l’accusatif, la préposition exprime ici la cause de l’emprisonnement.
- source_word: στάσιν
  choice: révolte
  rationale: Le terme désigne un soulèvement ou une insurrection dans la cité. « Révolte » est courant, clair et conserve la portée politique du grec.
- source_word: τινὰ
  choice: une certaine
  rationale: Cette expression garde l’indétermination apportée par τις, sans préciser davantage l’événement.
- source_word: γενομένην ἐν τῇ πόλει
  choice: survenue dans la ville
  rationale: Le participe est rendu par une tournure française concise et naturelle; « la ville » respecte l’implicite du grec sans ajouter « Jérusalem ».
- source_word: φόνον
  choice: meurtre
  rationale: Dans ce contexte judiciaire, φόνος désigne un homicide criminel plutôt qu’une mise à mort indifférenciée.
- source_word: βληθεὶς ἐν τῇ φυλακῇ
  choice: avait été jeté en prison
  rationale: La tournure conserve la vigueur du passif de βάλλω et situe naturellement l’emprisonnement avant la scène narrative présente.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve l’indétermination de « une certaine » et n’explicite pas le nom de la ville. « Ainsi que pour meurtre » évite une coordination maladroite entre « à cause de » et « pour », tout en rattachant les deux motifs à l’emprisonnement.
