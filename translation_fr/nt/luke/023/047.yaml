id: LUK.23.47
reference: Luke 23:47
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἰδὼν δὲ ὁ ἑκατοντάρχης τὸ γενόμενον ⸀ἐδόξαζεν τὸν θεὸν λέγων· Ὄντως ὁ ἄνθρωπος οὗτος δίκαιος ἦν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/047.yaml
  text: When the centurion saw what had happened[a], he glorified God, saying, “Certainly this man was righteous.”
translation:
  language: fr
  text: 'Quand le centurion vit ce qui s’était passé, il rendit gloire à Dieu en disant : « Cet homme était vraiment juste[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « innocent ». Le mot grec peut désigner une personne juste sur le plan moral ou innocente sur le plan juridique, selon le contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδὼν
  choice: Quand … vit
  rationale: Le participe aoriste exprime naturellement ici une relation temporelle avec le verbe principal.
- source_word: δὲ
  choice: non rendu explicitement
  rationale: Cette particule assure une légère transition narrative que l’enchaînement français transmet sans qu’il soit nécessaire d’ajouter « alors » ou « mais ».
- source_word: ἑκατοντάρχης
  choice: centurion
  rationale: Terme français précis et courant pour ce grade de l’armée romaine.
- source_word: τὸ γενόμενον
  choice: ce qui s’était passé
  rationale: Cette formulation idiomatique rend le participe substantivé et l’antériorité de l’événement observé.
- source_word: ἐδόξαζεν τὸν θεὸν
  choice: il rendit gloire à Dieu
  rationale: Expression française naturelle qui conserve le sens religieux fort de δοξάζω ; le passé simple convient au récit sans surinterpréter la valeur imperfective.
- source_word: λέγων
  choice: en disant
  rationale: Le gérondif relie naturellement la parole à l’action de rendre gloire à Dieu.
- source_word: Ὄντως
  choice: vraiment
  rationale: Adverbe idiomatique exprimant l’affirmation appuyée du centurion.
- source_word: ὁ ἄνθρωπος οὗτος
  choice: cet homme
  rationale: Rendu direct et naturel de l’expression grecque appliquée à Jésus.
- source_word: δίκαιος
  choice: juste
  rationale: « Juste » conserve la portée morale et théologique du grec tout en permettant, dans ce contexte judiciaire, la nuance d’innocence.
- source_word: ἦν
  choice: était
  rationale: L’imparfait français correspond naturellement à l’imparfait grec de εἰμί.
theological_decisions:
- issue: Sens de δίκαιος dans la déclaration du centurion
  choice: juste
  alternative: innocent
  rationale: « Juste » préserve la portée morale et théologique du terme sans transformer la déclaration en confession christologique plus développée. La traduction « innocent », plausible dans le contexte de la condamnation injuste de Jésus, est signalée en note afin de conserver l’ambiguïté.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple maintient le registre narratif biblique sans archaïsme marqué. Le marqueur de note est placé après « juste », le mot auquel porte l’alternative lexicale.
