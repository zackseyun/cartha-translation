id: LUK.23.10
reference: Luke 23:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἱστήκεισαν δὲ οἱ ἀρχιερεῖς καὶ οἱ γραμματεῖς εὐτόνως κατηγοροῦντες αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/010.yaml
  text: And the chief priests and the scribes stood there[a], vehemently accusing him.
translation:
  language: fr
  text: Les chefs des prêtres et les spécialistes de la Loi se tenaient là et l’accusaient avec véhémence.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἱστήκεισαν
  choice: se tenaient là
  rationale: Le plus-que-parfait à valeur stative décrit leur présence debout sur les lieux; « se tenaient là » rend naturellement cette fonction de mise en scène.
- source_word: δὲ
  choice: et
  rationale: La particule assure ici une transition narrative légère, sans opposition marquée.
- source_word: ἀρχιερεῖς
  choice: chefs des prêtres
  rationale: Cette expression désigne les principales autorités sacerdotales et évite de laisser entendre que plusieurs personnes exerçaient simultanément la fonction unique de grand prêtre.
- source_word: γραμματεῖς
  choice: spécialistes de la Loi
  rationale: Dans ce contexte, le terme désigne des spécialistes reconnus des Écritures et de la Loi; cette formulation actuelle communique leur rôle plus clairement que le terme historique « scribes ».
- source_word: εὐτόνως
  choice: avec véhémence
  rationale: L’adverbe exprime la force et l’intensité soutenues de leurs accusations.
- source_word: κατηγοροῦντες
  choice: l’accusaient
  rationale: Le participe présent indique une action continue accompagnant leur présence; une proposition coordonnée est plus naturelle en français tout en conservant cet aspect.
- source_word: αὐτοῦ
  choice: l’
  rationale: Le génitif régi par κατηγορέω désigne la personne contre laquelle l’accusation est portée; le pronom objet direct est idiomatique en français.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. « Avec véhémence » conserve l’intensité du grec sans ajouter de qualification théologique ou juridique absente du texte.
