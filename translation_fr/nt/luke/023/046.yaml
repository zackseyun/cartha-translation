  text: καὶ φωνήσας φωνῇ μεγάλῃ ὁ Ἰησοῦς εἶπεν· Πάτερ, εἰς χεῖράς σου ⸀παρατίθεμαι τὸ πνεῦμά μου. ⸂τοῦτο δὲ⸃ εἰπὼν ἐξέπνευσεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/046.yaml
  text: And Jesus[a], crying out with a loud voice, said, “Father, into your hands I commit my spirit.” Having said this[c][b], he breathed his last.
translation:
  language: fr
  text: 'Et Jésus cria d’une voix forte : « Père, entre tes mains je remets mon esprit. » Après avoir dit cela, il rendit son dernier souffle.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « il expira » ; le verbe grec évoque littéralement le fait d’exhaler son souffle.
    reason: lexical_alternative
  - marker: b
    text: 'Cette parole fait écho au Psaume 31.6 : « Entre tes mains je remets mon esprit. »'
    reason: cross_reference
lexical_decisions:
- source_word: φωνήσας φωνῇ μεγάλῃ
  choice: cria d’une voix forte
  rationale: Cette formulation française naturelle restitue à la fois l’acte de lancer un cri et la force de la voix, sans lourde répétition.
- source_word: Πάτερ
  choice: Père
  rationale: Le vocatif est rendu directement, sans ajouter le possessif « mon », absent du grec.
- source_word: εἰς χεῖράς σου
  choice: entre tes mains
  rationale: L’expression idiomatique française conserve le pluriel du grec et l’écho au Psaume 31.6 selon la numérotation française courante.
- source_word: παρατίθεμαι
  choice: je remets
  rationale: Le présent moyen exprime ici l’acte volontaire de placer son esprit sous la garde du Père. « Je remets » est naturel, solennel et préserve l’écho scripturaire; « je confie » reste une autre traduction possible.
- source_word: τὸ πνεῦμά μου
  choice: mon esprit
  rationale: Dans cette prière adressée consciemment au Père, « esprit » conserve mieux que « souffle » l’étendue sémantique et la portée du propos, sans imposer une élaboration doctrinale ultérieure.
- source_word: τοῦτο δὲ εἰπών
  choice: Après avoir dit cela
  rationale: Cette tournure rend clairement l’antériorité du participe aoriste par rapport au verbe principal.
- source_word: ἐξέπνευσεν
  choice: il rendit son dernier souffle
  rationale: Cette expression française claire et digne indique la mort tout en conservant l’image du souffle portée par le verbe grec.
theological_decisions:
- issue: Sens de τὸ πνεῦμά μου dans la dernière parole de Jésus
  choice: mon esprit
  alternative: mon souffle
  rationale: Le contexte d’une remise volontaire au Père favorise « esprit », tout en laissant intacte la relation lexicale de πνεῦμα avec le souffle.
- issue: Portée de παρατίθεμαι
  choice: je remets
  alternative: je confie
  rationale: « Je remets » rend la déclaration performative au présent et maintient l’écho du psaume; « je confie » expliciterait davantage l’idée de placer sous la garde de quelqu’un.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple convient au registre narratif biblique soutenu sans être archaïque. La traduction conserve la solennité de la parole, l’image finale du souffle et l’écho au psaume.
