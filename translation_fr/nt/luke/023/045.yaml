id: LUK.23.45
reference: Luke 23:45
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸂τοῦ ἡλίου ἐκλιπόντος⸃, ἐσχίσθη ⸀δὲ τὸ καταπέτασμα τοῦ ναοῦ μέσον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/045.yaml
  text: the sun having been darkened[c][b][a], and the curtain of the temple was torn in the middle.
translation:
  language: fr
  text: le soleil s’étant obscurci[a], et le rideau du sanctuaire se déchira par le milieu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le soleil ayant perdu sa lumière ». Certains traduisent plus précisément : « le soleil s’étant éclipsé », mais le grec n’impose pas un mécanisme astronomique particulier.'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « se déchira en son milieu », « se déchira en deux ». On peut aussi traduire « le voile du Temple ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦ ἡλίου ἐκλιπόντος
  choice: le soleil s’étant obscurci
  rationale: Le génitif absolu est conservé sous forme de proposition participiale. Dans ce contexte, ἐκλείπω décrit la défaillance de la lumière solaire; « s’étant obscurci » est naturel en français sans imposer le mécanisme astronomique précis d’une éclipse.
- source_word: ἐσχίσθη
  choice: se déchira
  rationale: Le passif grec se rend naturellement en français par le pronominal à valeur passive « se déchira », idiomatique pour une étoffe.
- source_word: δὲ
  choice: et
  rationale: δέ est ici un connecteur léger; « et » relie naturellement les deux événements sans introduire un contraste marqué.
- source_word: τὸ καταπέτασμα
  choice: le rideau
  rationale: « Rideau » désigne clairement et dans un français moderne la tenture séparatrice; « voile » reste une traduction traditionnelle possible.
- source_word: τοῦ ναοῦ
  choice: du sanctuaire
  rationale: ναός désigne ici plus précisément le sanctuaire, c’est-à-dire l’édifice sacré proprement dit, et non tout le complexe du Temple.
- source_word: μέσον
  choice: par le milieu
  rationale: Cette tournure exprime directement l’endroit ou la ligne de la déchirure sans ajouter explicitement le résultat « en deux ».
theological_decisions:
- issue: Sens de ἐκλιπόντος appliqué au soleil
  choice: « le soleil s’étant obscurci » sans préciser la cause physique
  alternative: « le soleil ayant perdu sa lumière »; « le soleil s’étant éclipsé »
  rationale: Le texte évoque l’obscurcissement cosmique entourant la mort de Jésus, mais le verbe ne contraint pas à comprendre une éclipse au sens astronomique technique.
- issue: Identification de καταπέτασμα τοῦ ναοῦ
  choice: « le rideau du sanctuaire »
  alternative: « le voile du Temple »; « le rideau du Temple »
  rationale: La formulation retenue reste accessible tout en rendant la portée plus précise de ναός. Elle ne précise pas lequel des rideaux du sanctuaire est visé, puisque le grec ne le fait pas ici.
translation_notes:
  register: Français international moderne, sobre et digne. La construction participiale conserve la concision du grec; « sanctuaire » rend avec précision ναός, tandis que « rideau » évite une formulation inutilement archaïque.
