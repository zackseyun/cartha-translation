  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Εἷς δὲ τῶν κρεμασθέντων κακούργων ἐβλασφήμει αὐτόν ⸀λέγων· ⸀Οὐχὶ σὺ εἶ ὁ χριστός; σῶσον σεαυτὸν καὶ ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/039.yaml
  text: One of the criminals who were hanging there was reviling him[a], saying, “Are you not the Messiah? Save yourself and us.”
translation:
  language: fr
  text: 'L’un des malfaiteurs suspendus l’insultait en disant : « N’es-tu pas le Messie[a] ? Sauve-toi toi-même et sauve-nous ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le Christ ». Grec : ho christos.'
    reason: Signaler l’autre traduction traditionnelle du titre grec sans effacer sa valeur messianique.
lexical_decisions:
- source_word: Εἷς δὲ
  choice: L’un
  rationale: Le français peut laisser la légère progression ou opposition marquée par δέ au contexte, sans ajouter un connecteur plus appuyé que le grec.
- source_word: τῶν κρεμασθέντων κακούργων
  choice: des malfaiteurs suspendus
  rationale: « Malfaiteurs » rend κακούργων dans un registre narratif digne et courant; « suspendus » conserve le verbe général κρεμάννυμι sans introduire ici un verbe plus précis.
- source_word: ἐβλασφήμει αὐτόν
  choice: l’insultait
  rationale: Dans ce contexte, le verbe désigne des paroles outrageantes dirigées contre Jésus. L’imparfait français restitue l’aspect duratif de l’imparfait grec.
- source_word: λέγων
  choice: en disant
  rationale: Tour français naturel pour introduire les paroles associées à l’action principale.
- source_word: Οὐχὶ σὺ εἶ ὁ χριστός;
  choice: N’es-tu pas le Messie ?
  rationale: La question négative conserve l’attente rhétorique et la raillerie; « Messie » rend Χριστός comme titre.
- source_word: σῶσον σεαυτὸν καὶ ἡμᾶς
  choice: Sauve-toi toi-même, et nous aussi !
  rationale: « Sauve » préserve à la fois la délivrance immédiate et l’écho plus large du salut. « Nous aussi » exprime naturellement la coordination et fait ressortir l’intérêt du malfaiteur sans l’expliciter indûment.
theological_decisions:
- issue: Traduction de Χριστός employé comme titre
  choice: Messie
  alternative: Christ
  rationale: Dans cette raillerie, Χριστός est un titre messianique. « Messie » en communique le sens et le contexte juif, tandis que « Christ » reste une traduction traditionnelle possible.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation conserve la question sarcastique, l’action verbale continue et le caractère général de « suspendus ». Le marqueur de note [a] figure immédiatement après « Messie ».
