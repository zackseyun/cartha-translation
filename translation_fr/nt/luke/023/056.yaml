id: LUK.23.56
reference: Luke 23:56
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὑποστρέψασαι δὲ ἡτοίμασαν ἀρώματα καὶ μύρα. Καὶ τὸ μὲν σάββατον ἡσύχασαν κατὰ τὴν ἐντολήν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/056.yaml
  text: Then after returning[a], they prepared spices and ointments. And on the Sabbath they rested according to the commandment[b],
translation:
  language: fr
  text: De retour, elles préparèrent des aromates et des huiles parfumées[a]. Puis, le jour du sabbat, elles se reposèrent conformément au commandement.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des parfums » ou « des onguents parfumés ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑποστρέψασαι
  choice: De retour
  rationale: Le participe aoriste féminin pluriel exprime une action antérieure à « préparèrent ». « De retour » restitue naturellement cette antériorité en français sans alourdir la phrase.
- source_word: δὲ
  choice: non exprimé séparément
  rationale: La particule marque ici une légère progression narrative déjà portée en français par l’enchaînement de la phrase.
- source_word: ἡτοίμασαν
  choice: elles préparèrent
  rationale: Rendu direct et naturel du verbe dans ce récit au passé.
- source_word: ἀρώματα
  choice: des aromates
  rationale: Dans le contexte funéraire, le terme désigne des substances aromatiques destinées au corps. « Aromates » est précis et courant dans ce registre.
- source_word: μύρα
  choice: des huiles parfumées
  rationale: Le nom désigne des huiles ou onguents parfumés. « Huiles parfumées » est clair en français moderne et maintient la distinction avec les aromates.
- source_word: τὸ μὲν σάββατον
  choice: le jour du sabbat
  rationale: Cette expression temporelle est naturelle et précise; μέν a une faible valeur de transition que « Puis » rend dans la proposition.
- source_word: ἡσύχασαν
  choice: elles se reposèrent
  rationale: Dans le contexte du sabbat, le verbe signifie qu’elles cessèrent leur activité et observèrent le repos.
- source_word: κατὰ τὴν ἐντολήν
  choice: conformément au commandement
  rationale: Ce rendu conserve le singulier défini et exprime fidèlement la conformité à l’ordre prescrit, sans explicitation doctrinale dans le texte.
theological_decisions:
- issue: Référence du « commandement »
  choice: Conserver « au commandement » sans explicitation
  alternative: Préciser « au commandement concernant le sabbat »
  rationale: Le contexte renvoie au commandement de la Torah relatif au sabbat, mais le grec se limite à « le commandement ». Le texte principal préserve cette formulation concise.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple convient au registre narratif biblique sans être archaïque. « De retour » évite une subordonnée lourde, et « huiles parfumées » communique clairement le sens de μύρα.
