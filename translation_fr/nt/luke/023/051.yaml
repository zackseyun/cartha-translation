id: LUK.23.51
reference: Luke 23:51
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὗτος οὐκ ἦν συγκατατεθειμένος τῇ βουλῇ καὶ τῇ πράξει αὐτῶν— ἀπὸ Ἁριμαθαίας πόλεως τῶν Ἰουδαίων, ὃς ⸀προσεδέχετο τὴν βασιλείαν τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/051.yaml
  text: This man had not agreed with their plan and action—he was from Arimathea[a], a city of the Jews, and he was waiting for the kingdom of God.
translation:
  language: fr
  text: Cet homme n’avait donné son accord ni à leur décision ni à leur action[a]. Il était d’Arimathée, une ville des Juifs, et il attendait le royaume de Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : n’avait approuvé ni leur projet ni leur acte.'
    reason: Alternative lexicale reflétant les sens possibles de βουλή et πρᾶξις ainsi qu’une autre formulation naturelle de συγκατατίθεμαι.
lexical_decisions:
- source_word: συγκατατεθειμένος
  choice: avait donné son accord
  rationale: 'Avec οὐκ et l’auxiliaire à l’imparfait, le participe parfait exprime une prise de position antérieure et durable : Joseph n’avait pas consenti. « Donner son accord » est naturel en français moderne et évite de préciser un vote que le grec ne mentionne pas.'
- source_word: βουλῇ
  choice: décision
  rationale: Dans ce contexte, βουλή désigne le dessein arrêté ou la résolution des dirigeants, non le conseil en tant qu’institution. « Décision » convient à la délibération sans imposer une procédure particulière.
- source_word: πράξει
  choice: action
  rationale: Associé à βουλή, le terme désigne la mise en œuvre concrète de leur résolution. « Action » maintient la distinction entre ce qui a été décidé et ce qui a été fait.
- source_word: ἀπὸ Ἁριμαθαίας πόλεως τῶν Ἰουδαίων
  choice: originaire d’Arimathée, une ville des Juifs
  rationale: Cette formulation restitue l’origine géographique et conserve l’apposition grecque ainsi que l’expression τῶν Ἰουδαίων, sans la réduire à une précision ethnique ou régionale plus étroite.
- source_word: προσεδέχετο
  choice: attendait
  rationale: L’imparfait exprime une attente continue et pleine d’espérance. « Attendait » est idiomatique et ne suggère pas une recherche active.
- source_word: βασιλείαν τοῦ θεοῦ
  choice: le royaume de Dieu
  rationale: Formulation claire et consacrée dans Luc, qui conserve la portée royale et théologique de βασιλεία sans imposer ici la paraphrase « règne de Dieu ».
- source_word: οὗτος
  choice: Cet homme
  rationale: Le démonstratif reprend Joseph avec une certaine emphase. « Cet homme » rend mieux ce relief qu’un simple pronom.
theological_decisions:
- issue: Nature de la dissociation de Joseph à l’égard du rôle du Sanhédrin dans la mort de Jésus
  choice: Dire qu’il n’avait donné son accord ni à leur décision ni à leur action
  alternative: Dire qu’il n’avait pas voté en faveur de leur décision
  rationale: Le grec affirme son absence de consentement à la résolution et à l’acte des autres, mais ne décrit pas explicitement une procédure de vote. La traduction préserve cette limite tout en rendant sa dissociation nette.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase grecque est répartie en deux phrases pour éviter une construction appositive lourde, sans modifier les relations de sens. Le parallélisme « ni… ni… » met clairement en rapport la décision et son exécution.
