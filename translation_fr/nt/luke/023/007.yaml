id: LUK.23.7
reference: Luke 23:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἐπιγνοὺς ὅτι ἐκ τῆς ἐξουσίας Ἡρῴδου ἐστὶν ἀνέπεμψεν αὐτὸν πρὸς Ἡρῴδην, ὄντα καὶ αὐτὸν ἐν Ἱεροσολύμοις ἐν ταύταις ταῖς ἡμέραις.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/007.yaml
  text: And when he learned that he was under Herod’s jurisdiction[a], he sent him to Herod, who himself was also in Jerusalem in those days.
translation:
  language: fr
  text: Quand il apprit que Jésus relevait de la juridiction d’Hérode[a], il l’envoya à Hérode, qui se trouvait lui aussi à Jérusalem ces jours-là.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « relevait de l’autorité d’Hérode ». L’expression grecque peut désigner le territoire gouverné par Hérode ou son autorité légale.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιγνοὺς
  choice: Quand il apprit
  rationale: Le participe aoriste exprime une action antérieure à l’envoi; cette tournure temporelle est naturelle en français et conserve cette relation.
- source_word: ἐκ τῆς ἐξουσίας Ἡρῴδου ἐστὶν
  choice: Jésus relevait de la juridiction d’Hérode
  rationale: L’expression désigne ici le ressort administratif et judiciaire d’Hérode. Le nom « Jésus » explicite sans ambiguïté le référent du pronom grec dans un verset isolé.
- source_word: ἀνέπεμψεν αὐτὸν πρὸς Ἡρῴδην
  choice: il l’envoya à Hérode
  rationale: « Envoyer à » rend simplement le mouvement vers Hérode; le contexte et la mention de la juridiction laissent percevoir la dimension judiciaire sans la surtraduire.
- source_word: ὄντα καὶ αὐτὸν
  choice: qui se trouvait lui aussi
  rationale: Cette formulation rattache clairement le participe à Hérode et préserve l’insistance de καὶ αὐτόν sur le fait qu’il était lui aussi présent.
- source_word: ἐν Ἱεροσολύμοις
  choice: à Jérusalem
  rationale: En français idiomatique, on emploie « à » devant le nom d’une ville.
- source_word: ἐν ταύταις ταῖς ἡμέραις
  choice: ces jours-là
  rationale: Cette expression narrative naturelle conserve la référence démonstrative et temporelle du grec.
theological_decisions:
- issue: Sens politique et judiciaire de ἐξουσία concernant Hérode
  choice: juridiction
  alternative: autorité; territoire relevant de son pouvoir
  rationale: Le contexte porte sur la compétence gouvernementale d’Hérode à l’égard de Jésus en raison de son origine géographique. « Juridiction » exprime ce cadre légal et administratif sans donner ici à ἐξουσία un sens théologique.
translation_notes:
  register: Français international moderne, digne et accessible. « Relever de la juridiction » convient au contexte judiciaire tout en restant compréhensible; « se trouvait lui aussi » est plus naturel que le calque « étant lui aussi ».
