id: LUK.23.26
reference: Luke 23:26
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ ὡς ἀπήγαγον αὐτόν, ἐπιλαβόμενοι ⸂Σίμωνά τινα Κυρηναῖον ἐρχόμενον⸃ ἀπ’ ἀγροῦ ἐπέθηκαν αὐτῷ τὸν σταυρὸν φέρειν ὄπισθεν τοῦ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/026.yaml
  text: And as they led him away[a], they seized a certain Simon of Cyrene, coming in from the countryside[b], and laid the cross on him to carry behind Jesus.
translation:
  language: fr
  text: Comme ils emmenaient Jésus, ils se saisirent d’un certain Simon de Cyrène, qui venait de la campagne[a], et le chargèrent de la croix[b] pour qu’il la porte derrière Jésus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « du champ ». Le mot grec peut désigner soit un champ particulier, soit plus généralement la campagne située hors de la ville.
    reason: lexical_alternative
  - marker: b
    text: Certains comprennent ici plus précisément « la traverse de la croix », mais le texte grec dit simplement « la croix ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπήγαγον αὐτόν
  choice: ils emmenaient Jésus
  rationale: ἀπάγω exprime ici le fait de conduire Jésus sous garde vers un autre lieu. La répétition du nom « Jésus » est naturelle en français et évite une suite de pronoms ambigus.
- source_word: ἐπιλαβόμενοι
  choice: ils se saisirent de
  rationale: Le participe de ἐπιλαμβάνομαι indique une prise physique et vraisemblablement contraignante. « Se saisirent de » restitue cette force sans exagération.
- source_word: Σίμωνά τινα Κυρηναῖον
  choice: un certain Simon de Cyrène
  rationale: τινα présente Simon comme un homme jusque-là non identifié, et Κυρηναῖον marque son association avec Cyrène. La formulation retenue reste proche du grec tout en étant compréhensible.
- source_word: ἐρχόμενον ἀπ’ ἀγροῦ
  choice: qui revenait de la campagne
  rationale: ἀγρός peut désigner un champ précis ou, plus largement, la campagne hors de la ville. « Revenait de la campagne » convient au mouvement vers la ville, tout en laissant l’autre possibilité en note.
- source_word: ἐπέθηκαν αὐτῷ τὸν σταυρὸν
  choice: le chargèrent de la croix
  rationale: ἐπιτίθημι signifie poser ou placer sur quelqu’un. « Charger quelqu’un de » exprime naturellement en français l’imposition physique de ce fardeau.
- source_word: τὸν σταυρὸν
  choice: la croix
  rationale: σταυρός signifie directement « croix ». Le texte ne précise pas qu’il s’agit seulement de la traverse.
- source_word: φέρειν
  choice: pour qu’il la porte
  rationale: L’infinitif exprime ici le but de l’action imposée à Simon. Cette tournure est naturelle et conserve le sens physique de « porter ».
- source_word: ὄπισθεν τοῦ Ἰησοῦ
  choice: derrière Jésus
  rationale: ὄπισθεν indique d’abord une position spatiale. « Derrière Jésus » préserve cette image de la procession sans lui ajouter une interprétation.
theological_decisions:
- issue: Faut-il préciser que σταυρός désigne seulement la traverse de la croix ?
  choice: la croix
  alternative: la traverse de la croix
  rationale: Le grec emploie le terme général σταυρός et ne nomme pas une pièce particulière. Traduire « la croix » respecte donc le degré de précision du texte et évite d’imposer une reconstruction historique.
translation_notes:
  register: Français international moderne, sobre et digne. La phrase conserve la progression narrative du grec tout en évitant une structure participiale lourde. Les marqueurs [a] et [b] sont placés aux mots auxquels leurs notes se rapportent.
