id: LUK.23.48
reference: Luke 23:48
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ πάντες οἱ συμπαραγενόμενοι ὄχλοι ἐπὶ τὴν θεωρίαν ταύτην, ⸀θεωρήσαντες τὰ γενόμενα, ⸀τύπτοντες τὰ στήθη ὑπέστρεφον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/048.yaml
  text: And all the crowds that had gathered for this spectacle[a], after seeing what had happened, were returning[b], beating their chests.
translation:
  language: fr
  text: Et toutes les foules qui s’étaient rassemblées pour assister à ce spectacle[a], après avoir vu ce qui s’était passé, repartaient en se frappant la poitrine[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « pour voir cette scène ».'
    reason: lexical_alternative
  - marker: b
    text: Se frapper la poitrine était un geste pouvant exprimer le chagrin, le deuil, le remords ou le bouleversement.
    reason: cultural_note
lexical_decisions:
- source_word: συμπαραγενόμενοι
  choice: s’étaient rassemblées
  rationale: Le participe décrit les foules venues se réunir sur les lieux. Cette formulation française est naturelle et conserve la valeur collective ainsi que l’antériorité par rapport à la scène décrite.
- source_word: ὄχλοι
  choice: les foules
  rationale: Le pluriel grec est conservé. « Les foules » est clair et courant en français moderne.
- source_word: ἐπὶ τὴν θεωρίαν ταύτην
  choice: pour assister à ce spectacle
  rationale: θεωρία désigne ici ce qui s’offre publiquement aux regards ou le fait de le regarder. « Assister à ce spectacle » exprime idiomatiquement le but de leur venue sans réduire l’expression au seul acte visuel.
- source_word: θεωρήσαντες
  choice: après avoir vu
  rationale: 'Le participe aoriste marque une action antérieure au verbe principal : les foules repartent après avoir constaté les événements.'
- source_word: τὰ γενόμενα
  choice: ce qui s’était passé
  rationale: Cette tournure rend naturellement en français la construction substantivée et sa valeur événementielle.
- source_word: τύπτοντες τὰ στήθη
  choice: en se frappant la poitrine
  rationale: La formulation conserve le geste physique exprimé par le grec et reste naturelle en français, sans en imposer une interprétation psychologique ou spirituelle précise.
- source_word: ὑπέστρεφον
  choice: repartaient
  rationale: L’imparfait rend l’aspect imperfectif du verbe grec et présente les membres des foules en train de quitter les lieux. « Repartaient » convient mieux au contexte que « retournaient », qui appellerait souvent un complément.
theological_decisions:
- issue: Portée émotionnelle et spirituelle du geste des foules
  choice: 'Décrire simplement le geste : « en se frappant la poitrine »'
  alternative: Préciser qu’elles se repentaient, exprimaient leur culpabilité, leur deuil ou leur effroi
  rationale: Le grec rapporte un geste de lamentation sans définir explicitement l’état intérieur des personnes. La traduction préserve donc l’ambiguïté entre chagrin, deuil, choc, remords ou repentance.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase suit clairement la progression du grec tout en évitant une syntaxe artificielle. « Spectacle » garde ici son sens de scène offerte aux regards, éclairé par la note afin d’éviter la connotation moderne de divertissement.
