  source_fidelity: 'La traduction rend avec fidélité la structure et les principaux éléments grecs : « toutes les foules » conserve le pluriel de ὄχλοι ; « s’étaient rassemblées » exprime adéquatement le participe συμπαραγενόμενοι ; « après avoir vu ce qui s’était passé » rend l’antériorité de θεωρήσαντες et τὰ γενόμενα ; et « repartaient » préserve bien l’aspect imperfectif de ὑπέστρεφον. « En se frappant la poitrine » traduit le geste sans lui attribuer un sens spirituel déterminé.'
  naturalness: Le français est moderne, fluide et d’un registre approprié. « Pour assister à ce spectacle » est idiomatique dans ce contexte, et la note offre une alternative plus neutre (« pour voir cette scène ») pour les lecteurs sensibles à la connotation contemporaine de « spectacle ».
  terminology: Les choix lexicaux sont cohérents avec le contexte lucanien et le français international. « La poitrine » est une expression naturelle pour τὰ στήθη. La note culturelle décrit des valeurs possibles du geste sans prétendre trancher l’état intérieur des foules.
