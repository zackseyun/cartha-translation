id: LUK.23.50
reference: Luke 23:50
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ ἰδοὺ ἀνὴρ ὀνόματι Ἰωσὴφ βουλευτὴς ὑπάρχων, ⸀ἀνὴρ ἀγαθὸς καὶ δίκαιος—
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/050.yaml
  text: And behold[a], a man named Joseph, who was a council member, a good and righteous man—
translation:
  language: fr
  text: Et voici qu’il y avait un homme nommé Joseph, qui était membre du conseil, un homme bon et juste[a] —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un homme bon et droit ».
    reason: Alternative lexicale pour δίκαιος, qui peut souligner la droiture morale.
lexical_decisions:
- source_word: Καὶ ἰδοὺ
  choice: Et voici que
  rationale: Conserve le marqueur narratif qui attire l’attention, dans une tournure française naturelle et digne.
- source_word: ἀνὴρ
  choice: un homme
  rationale: Désigne ici un homme adulte précis; le terme n’est pas générique.
- source_word: ὀνόματι Ἰωσὴφ
  choice: nommé Joseph
  rationale: Rend naturellement en français la formule d’introduction au datif.
- source_word: βουλευτὴς ὑπάρχων
  choice: qui était membre du Conseil
  rationale: Rend explicitement le participe et désigne clairement l’appartenance à l’organe dirigeant évoqué dans le récit de la Passion, sans préciser davantage que le grec.
- source_word: ἀνὴρ ἀγαθὸς καὶ δίκαιος
  choice: un homme bon et juste
  rationale: Maintient la répétition de ἀνήρ, qui met en relief la qualité de Joseph. « Juste » conserve en français les résonances morales, religieuses et éventuellement judiciaires de δίκαιος.
theological_decisions:
- issue: Sens de δίκαιος dans la description de Joseph
  choice: juste
  alternative: droit
  rationale: « Juste » préserve la portée biblique du terme ainsi que sa tension entre droiture morale et conformité à la justice, sans en faire ici une affirmation doctrinale technique.
translation_notes:
  register: Français international moderne, narratif et digne. La formule « Et voici que » garde la force d’introduction de ἰδού sans archaïsme excessif. La phrase reste ouverte par un tiret, conformément à la syntaxe qui se poursuit au verset suivant.
