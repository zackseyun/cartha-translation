- from: Et voici qu’un homme nommé Joseph, qui était membre du Conseil, un homme bon et juste[a] —
  to: Et voici qu’il y avait un homme nommé Joseph, qui était membre du conseil, un homme bon et juste[a] —
  rationale: La révision corrige la syntaxe de l’introduction française et retire une majuscule qui risquait d’ajouter une identification institutionnelle non explicitée par le grec. Elle conserve la structure ouverte du verset, la répétition emphatique de « homme » et l’ambivalence morale et religieuse de δίκαιος.
