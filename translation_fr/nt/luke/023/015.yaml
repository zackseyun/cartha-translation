reference: Luke 23:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀλλ’ οὐδὲ Ἡρῴδης, ⸂ἀνέπεμψεν γὰρ αὐτὸν πρὸς ἡμᾶς⸃· καὶ ἰδοὺ οὐδὲν ἄξιον θανάτου ἐστὶν πεπραγμένον αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/015.yaml
  text: But neither did Herod, for he sent him back to us. And look, nothing deserving of death has been done by him.
translation:
  language: fr
  text: 'Hérode non plus, car il nous l’a renvoyé. Et voici : il n’a rien fait qui mérite la mort.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction : « Hérode non plus, car il nous l’a renvoyé. Et voici : rien qui mérite la mort n’a été fait par lui. »'
    reason: La construction grecque est elliptique. Le datif αὐτῷ peut être rendu en français par une tournure active (« il n’a rien fait ») ou par une tournure passive avec complément d’agent, sans changer l’attribution des actes examinés à Jésus.
lexical_decisions:
- source_word: ἀλλ’ οὐδὲ Ἡρῴδης
  choice: Hérode non plus
  rationale: 'La tournure française restitue naturellement l’ajout contrastif : Pilate affirme que, pas davantage que lui, Hérode n’a retenu de faute capitale. L’ellipse du grec est conservée sans ajouter un verdict explicite.'
- source_word: ἀνέπεμψεν γὰρ αὐτὸν πρὸς ἡμᾶς
  choice: puisqu’il nous l’a renvoyé
  rationale: Dans ce contexte narratif et judiciaire, ἀναπέμπω indique le renvoi de Jésus auprès de Pilate. « Puisque » introduit naturellement la justification apportée par γάρ.
- source_word: καὶ ἰδοὺ
  choice: 'Et voici :'
  rationale: « Voici » est un marqueur d’attention courant et digne, moins archaïque que « voici que » dans cette construction; les deux-points annoncent la conclusion mise en relief.
- source_word: οὐδὲν ἄξιον θανάτου
  choice: rien fait qui mérite la mort
  rationale: Cette formulation française exprime clairement qu’aucun acte de Jésus ne justifie la peine capitale.
- source_word: ἐστὶν πεπραγμένον αὐτῷ
  choice: cet homme n’a rien fait
  rationale: Le parfait périphrastique est rendu par le passé composé, avec pertinence présente. Le datif αὐτῷ est compris comme désignant l’auteur de l’acte; « cet homme » explicite sobrement le référent en français.
theological_decisions:
- issue: Valeur de αὐτῷ avec πεπραγμένον
  choice: 'agent : « cet homme n’a rien fait »'
  alternative: 'référence : « on n’a rien trouvé en lui »'
  rationale: Dans la scène judiciaire, Pilate nie que Jésus ait commis un acte passible de mort. La formulation retenue communique ce verdict sans suggérer que rien n’aurait été fait à Jésus.
- issue: Ellipse après « Hérode non plus »
  choice: conserver l’ellipse
  alternative: 'expliciter : « Hérode non plus ne l’a pas trouvé coupable »'
  rationale: Le grec laisse le jugement précis sous-entendu à partir du contexte. Le français permet la même ellipse, ce qui évite d’introduire une affirmation plus explicite que le texte source.
translation_notes:
  register: Français international moderne, oral mais digne, adapté à la déclaration publique de Pilate. « Hérode non plus » préserve l’ellipse grecque; « Et voici » maintient la mise en relief de ἰδού sans archaïsme marqué.
