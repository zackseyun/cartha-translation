revisions:
- from: 'Il leur dit : « Vous m’avez amené cet homme comme quelqu’un qui détourne le peuple[a]. Or, après l’avoir interrogé devant vous, je n’ai trouvé en cet homme aucun motif pour les accusations que vous portez contre lui[b]. »'
  to: 'Il leur dit : « Vous m’avez amené cet homme comme quelqu’un qui égare le peuple[a]. Et voici : après l’avoir interrogé devant vous, je n’ai trouvé en cet homme aucun fondement aux accusations que vous portez contre lui[b]. »'
  rationale: La révision privilégie une expression française naturelle de l’accusation (« égare le peuple »), tout en conservant l’alternative lexicale en note. « Et voici » restitue la valeur d’appel à l’attention de ἰδού, et « aucun fondement aux accusations » préserve le caractère judiciaire de la conclusion de Pilate sans la transformer en affirmation théologique générale.
