id: LUK.23.14
reference: Luke 23:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἶπεν πρὸς αὐτούς· Προσηνέγκατέ μοι τὸν ἄνθρωπον τοῦτον ὡς ἀποστρέφοντα τὸν λαόν, καὶ ἰδοὺ ἐγὼ ἐνώπιον ὑμῶν ἀνακρίνας ⸀οὐθὲν εὗρον ἐν τῷ ἀνθρώπῳ τούτῳ αἴτιον ὧν κατηγορεῖτε κατ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/014.yaml
  text: He said to them[a], “You brought this man to me as one who was misleading the people, and behold, after examining him before you[b], I found no basis in this man for the charges you bring against him.”
translation:
  language: fr
  text: 'Il leur dit : « Vous m’avez amené cet homme comme quelqu’un qui égare le peuple[a]. Et voici : après l’avoir interrogé devant vous, je n’ai trouvé en cet homme aucun fondement aux accusations que vous portez contre lui[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « qui détourne le peuple ». Le verbe grec peut signifier détourner ou égarer.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « je n’ai trouvé chez cet homme aucune culpabilité au sujet des faits dont vous l’accusez ».'
    reason: alternative_rendering
lexical_decisions:
- source_word: Προσηνέγκατέ μοι
  choice: Vous m’avez amené
  rationale: Exprime naturellement l’acte accompli par lequel les accusateurs ont conduit Jésus devant Pilate, tout en conservant le complément « à moi » dans la forme française « m’avez ».
- source_word: τὸν ἄνθρωπον τοῦτον
  choice: cet homme
  rationale: Désigne ici un individu masculin précis et correspond au registre judiciaire de la scène.
- source_word: ὡς ἀποστρέφοντα τὸν λαόν
  choice: comme quelqu’un qui détourne le peuple
  rationale: Conserve la construction accusatoire introduite par ὡς et le sens premier de ἀποστρέφω, sans renforcer indûment l’accusation en parlant d’incitation à la révolte.
- source_word: καὶ ἰδοὺ
  choice: Or
  rationale: Dans ce contexte argumentatif, ἰδού attire l’attention sur le résultat de l’interrogatoire. « Or » rend naturellement cette transition solennelle en français moderne, sans l’archaïsme de « voici » employé comme interjection.
- source_word: ἐνώπιον ὑμῶν ἀνακρίνας
  choice: après l’avoir interrogé devant vous
  rationale: ἀνακρίνω possède ici une valeur judiciaire d’examen ou d’interrogatoire. La formulation française indique clairement que celui-ci a eu lieu en présence des interlocuteurs.
- source_word: οὐθὲν εὗρον ἐν τῷ ἀνθρώπῳ τούτῳ αἴτιον
  choice: je n’ai trouvé en cet homme aucun motif
  rationale: Préserve la formulation judiciaire et la localisation emphatique « en cet homme », tout en laissant αἴτιον désigner le fondement ou motif d’une accusation.
- source_word: ὧν κατηγορεῖτε κατ’ αὐτοῦ
  choice: pour les accusations que vous portez contre lui
  rationale: Rend explicitement la valeur judiciaire de κατηγορέω et conserve le lien entre le motif recherché et les accusations formulées.
theological_decisions:
- issue: Portée de la déclaration de Pilate
  choice: Une constatation judiciaire selon laquelle les accusations portées ne reposent sur aucun motif établi
  alternative: Une affirmation générale et absolue de l’innocence morale de Jésus
  rationale: Le vocabulaire d’ἀνακρίνω, αἴτιον et κατηγορέω situe la déclaration dans le cadre précis de l’interrogatoire et des accusations. La traduction ne transforme donc pas cette conclusion juridique en proposition théologique plus large, sans toutefois nier cette possible implication dans le récit.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve le ton officiel de Pilate et le cadre judiciaire, tout en évitant les tournures archaïques. Les marqueurs de notes sont placés sur les expressions auxquelles leurs variantes se rapportent.
