  text: πάλιν ⸀δὲ ὁ Πιλᾶτος ⸀προσεφώνησεν, θέλων ἀπολῦσαι τὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/020.yaml
  text: But Pilate called out again[a], wanting to release Jesus.
translation:
  language: fr
  text: Mais Pilate leur adressa de nouveau la parole[a], voulant relâcher Jésus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les interpella de nouveau ».
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: de nouveau
  rationale: Rend naturellement en français l’idée de répétition exprimée par l’adverbe.
- source_word: δὲ
  choice: Mais
  rationale: Marque ici une légère opposition narrative entre la réaction de la foule et la nouvelle intervention de Pilate.
- source_word: ὁ Πιλᾶτος
  choice: Pilate
  rationale: Forme française traditionnelle du nom propre, sans reproduction de l’article grec.
- source_word: προσεφώνησεν
  choice: s’adressa à eux
  rationale: Le verbe peut désigner le fait d’interpeller ou de prendre la parole pour s’adresser à des personnes. L’ajout de « à eux » explicite en français le destinataire implicite fourni par le contexte.
- source_word: θέλων
  choice: car il voulait
  rationale: La proposition causale naturelle en français exprime le désir ou l’intention qui accompagne et motive l’intervention de Pilate.
- source_word: ἀπολῦσαι
  choice: relâcher
  rationale: Terme courant et précis dans un contexte de détention judiciaire.
- source_word: τὸν Ἰησοῦν
  choice: Jésus
  rationale: Forme française usuelle du nom, sans article devant le nom propre.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. « S’adressa de nouveau à eux » conserve le sens large de προσφωνέω, tandis que la note signale sa nuance possible d’interpellation publique. La coordination participiale grecque est rendue par une proposition causale fluide sans modifier l’intention de Pilate.
