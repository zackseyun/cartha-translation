id: LUK.23.32
reference: Luke 23:32
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἤγοντο δὲ καὶ ἕτεροι ⸂κακοῦργοι δύο⸃ σὺν αὐτῷ ἀναιρεθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/032.yaml
  text: And two others[a], who were criminals[b], were being led with him to be put to death.
translation:
  language: fr
  text: Deux autres hommes, qui étaient des criminels[a], étaient eux aussi emmenés avec lui pour être mis à mort[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des malfaiteurs ». Le terme grec désigne des personnes coupables de méfaits graves et qui sont ici sous le coup d’une condamnation pénale.
    reason: lexical_alternative
  - marker: b
    text: Ou « pour être exécutés ». Le grec dit « être mis à mort » sans préciser ici la méthode, même si le contexte montre qu’il s’agit de la crucifixion.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἤγοντο
  choice: étaient emmenés
  rationale: L’imparfait passif présente une action en cours dans le passé. « Étaient emmenés » conserve cette valeur progressive et convient au déplacement vers le lieu d’exécution.
- source_word: δὲ καὶ
  choice: aussi
  rationale: Dans ce contexte narratif, δέ assure une transition légère et καί ajoute les deux hommes à Jésus. En français, « aussi » exprime naturellement cette inclusion sans alourdir la phrase par un connecteur initial.
- source_word: ἕτεροι
  choice: deux autres hommes
  rationale: Le masculin pluriel substantivé désigne d’autres personnes en plus de Jésus. L’ajout explicatif de « hommes » est naturel en français et ne change pas le référent.
- source_word: κακοῦργοι
  choice: des criminels
  rationale: Le terme désigne des personnes coupables de méfaits graves et, ici, condamnées. « Criminels » est clair en français moderne; la mise en apposition rattache sans ambiguïté cette désignation aux deux hommes.
- source_word: δύο
  choice: deux
  rationale: Le nombre cardinal est rendu directement.
- source_word: σὺν αὐτῷ
  choice: avec lui
  rationale: La préposition σύν avec le datif exprime l’accompagnement; « avec lui » en donne une traduction concise et naturelle.
- source_word: ἀναιρεθῆναι
  choice: pour être mis à mort
  rationale: L’infinitif aoriste passif désigne ici la mise à mort dans un cadre judiciaire. Cette formulation garde la portée générale du verbe sans préciser dans ce verset le mode d’exécution.
theological_decisions:
- issue: Faut-il préciser la crucifixion dans la traduction de ἀναιρεθῆναι ?
  choice: « être mis à mort »
  alternative: « être crucifiés » ou « être exécutés »
  rationale: Le contexte indique la crucifixion, mais le verbe lui-même signifie mettre à mort sans nommer ce supplice. La traduction conserve donc la portée lexicale du grec.
- issue: Comment rattacher κακοῦργοι aux deux autres hommes sans présenter implicitement Jésus comme un criminel ?
  choice: Employer l’apposition « deux autres hommes, des criminels »
  alternative: « deux autres criminels »
  rationale: Le grec identifie les deux autres comme des malfaiteurs. En français, « deux autres criminels » peut laisser entendre que Jésus appartient lui aussi à cette catégorie; l’apposition préserve l’information sans ajouter cette implication.
translation_notes:
  register: Français international moderne, clair et digne. La construction passive conserve l’aspect du récit grec; l’apposition évite une ambiguïté française indésirable tout en restant proche de la syntaxe source.
