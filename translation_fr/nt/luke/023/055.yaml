source:
  edition: SBLGNT
  text: κατακολουθήσασαι δὲ ⸀αἱ γυναῖκες, αἵτινες ἦσαν συνεληλυθυῖαι ⸂ἐκ τῆς Γαλιλαίας αὐτῷ⸃, ἐθεάσαντο τὸ μνημεῖον καὶ ὡς ἐτέθη τὸ σῶμα αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/055.yaml
  text: The women who had come with him from Galilee followed and saw the tomb and how his body was laid[a].
translation:
  language: fr
  text: Les femmes, qui étaient venues de Galilée avec Jésus, suivirent Joseph. Elles observèrent le tombeau et la manière dont le corps de Jésus avait été déposé.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατακολουθήσασαι
  choice: suivirent Joseph
  rationale: Le participe aoriste indique que les femmes suivirent la personne venant d’agir dans le contexte immédiat, Joseph (v. 50-54). Expliciter son nom rend le référent naturel en français sans modifier le déroulement narratif.
- source_word: δὲ
  choice: non rendu séparément
  rationale: La particule marque ici une légère transition narrative; l’enchaînement des phrases suffit à la rendre en français moderne.
- source_word: αἱ γυναῖκες, αἵτινες ἦσαν συνεληλυθυῖαι ἐκ τῆς Γαλιλαίας αὐτῷ
  choice: Les femmes qui étaient venues de Galilée avec Jésus
  rationale: La tournure périphrastique exprime une action antérieure. «Étaient venues ... avec» conserve à la fois l’origine galiléenne et l’accompagnement; le nom de Jésus clarifie le pronom grec αὐτῷ.
- source_word: ἐθεάσαντο
  choice: regardèrent ... et virent
  rationale: 'Le verbe évoque une observation attentive. La formulation française répartit naturellement ses deux compléments: le tombeau et la manière dont le corps y fut déposé.'
- source_word: τὸ μνημεῖον
  choice: le tombeau
  rationale: «Tombeau» est précis et usuel dans ce contexte funéraire.
- source_word: ὡς ἐτέθη
  choice: comment ... avait été déposé
  rationale: ὡς indique la manière, et le passif de τίθημι décrit le placement du corps. Le plus-que-parfait situe naturellement ce placement par rapport à leur observation, sans changer le sens du passif grec.
- source_word: τὸ σῶμα αὐτοῦ
  choice: le corps de Jésus
  rationale: La répétition du nom évite en français toute ambiguïté entre Jésus et Joseph.
theological_decisions:
- issue: Rapport narratif entre κατακολουθήσασαι et ἐθεάσαντο
  choice: 'Deux actions successives exprimées par des verbes conjugués: «suivirent ... Elles regardèrent»'
  alternative: «Ayant suivi ..., elles regardèrent»
  rationale: 'Il s’agit d’un choix syntaxique, non doctrinal. Deux propositions rendent plus naturellement en français la progression: elles suivent, puis observent.'
- issue: Référents des pronoms implicites ou explicites
  choice: Nommer Joseph comme personne suivie et Jésus comme compagnon antérieur et possesseur du corps
  alternative: 'Conserver partout des pronoms: «le suivirent ... avec lui ... son corps»'
  rationale: Le contexte identifie ces référents, mais une accumulation de pronoms masculins serait ambiguë en français. Les noms explicitent la référence sans résoudre une tension théologique.
translation_notes:
  register: Français international moderne, narratif et digne. La division en deux phrases évite une coordination lourde et permet de conserver la nuance d’observation attentive de ἐθεάσαντο. Aucun marqueur de note n’est requis puisqu’aucune variante substantielle n’appelle ici de note.
