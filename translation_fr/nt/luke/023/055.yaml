review_pass:
  verdict: revise
  source_fidelity: La formulation actuelle dédouble indûment ἐθεάσαντο (« regardèrent … et virent »), alors que ce verbe unique régit à la fois « le tombeau » et la proposition introduite par ὡς. Le référent de « suivirent » est implicite dans le grec, mais Joseph est le référent narratif immédiat ; son explicitation est acceptable en français pourvu qu’elle ne soit pas présentée comme un élément lexicalement exprimé dans ce verset.
  naturalness: Le français est globalement naturel, mais « regardèrent le tombeau et virent comment… » est redondant et affaiblit la construction. « Observèrent le tombeau et la manière dont… » est plus fluide, précis et correspond à l’observation attentive suggérée par ἐθεάσαντο.
  terminology: « Galilée », « Jésus », « Joseph », « tombeau » et « corps » sont justes et de registre narratif soutenu mais moderne. « Déposé » convient au passif de τίθημι dans un contexte funéraire.
  issues:
  - severity: medium
    issue: Dédoublement de ἐθεάσαντο
    rationale: 'Le texte grec comporte un seul verbe principal, ἐθεάσαντο, avec deux compléments coordonnés : τὸ μνημεῖον et ὡς ἐτέθη τὸ σῶμα αὐτοῦ. « Regardèrent … et virent » introduit deux actes d’observation là où le grec en exprime un seul.'
  - severity: low
    issue: Rationale lexicale présentant Joseph comme explicite
    rationale: Joseph est bien le référent contextuel probable de l’action de suivre, mais son nom n’apparaît pas dans le grec de ce verset. La traduction peut l’expliciter pour la lisibilité française ; la justification doit toutefois reconnaître qu’il s’agit d’une explicitation contextuelle.
