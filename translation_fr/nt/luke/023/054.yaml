  text: καὶ ἡμέρα ἦν ⸂παρασκευῆς, καὶ⸃ σάββατον ἐπέφωσκεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/054.yaml
  text: And it was the day of Preparation[a], and the Sabbath was dawning.
translation:
  language: fr
  text: C’était le jour de la Préparation, et le sabbat commençait[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement, « se levait » ou « commençait à poindre ». Le verbe grec peut évoquer le point du jour, mais il désigne ici le commencement du sabbat, au soir.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρασκευῆς
  choice: la Préparation
  rationale: Dans l’usage juif grec, παρασκευή désigne le jour où l’on prépare ce qui est nécessaire avant le sabbat. La majuscule en fait une désignation calendaire reconnue sans remplacer le terme grec par l’équivalent interprétatif « vendredi ».
- source_word: σάββατον
  choice: le sabbat
  rationale: Même sans article en grec, le contexte désigne clairement le sabbat hebdomadaire précis qui allait commencer; l’article défini est naturel en français.
- source_word: ἐπέφωσκεν
  choice: commençait
  rationale: Le verbe évoque littéralement le point du jour, mais il indique ici l’entrée dans le sabbat, qui commence le soir selon le calendrier juif. « Commençait » restitue clairement la valeur temporelle sans laisser croire qu’il s’agit du matin; l’image grecque est signalée en note.
- source_word: ἡμέρα ἦν παρασκευῆς
  choice: C’était le jour de la Préparation
  rationale: Cette formulation française naturelle conserve le sens de la construction génitive grecque et la désignation particulière du jour.
- source_word: καὶ
  choice: et
  rationale: La coordination entre les deux propositions est conservée, tandis que le premier καί est rendu implicitement par l’enchaînement narratif naturel en français.
theological_decisions:
- issue: Sens de ἐπέφωσκεν au moment où débute le sabbat
  choice: Le sabbat commençait le soir.
  alternative: Le sabbat se levait ou commençait à poindre.
  rationale: Le contexte de l’ensevelissement avant le repos sabbatique suppose le commencement du sabbat au soir. La traduction principale communique cette donnée temporelle sans effacer la formulation imagée du grec, conservée dans la note.
translation_notes:
  register: Français international moderne, sobre et digne. « Préparation » est conservé comme terme calendaire biblique; « commençait » évite une fausse impression de matin tout en maintenant l’ambiguïté lexicale en note.
