id: LUK.23.3
reference: Luke 23:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ δὲ Πιλᾶτος ⸀ἠρώτησεν αὐτὸν λέγων· Σὺ εἶ ὁ βασιλεὺς τῶν Ἰουδαίων; ὁ δὲ ἀποκριθεὶς αὐτῷ ἔφη· Σὺ λέγεις.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/003.yaml
  text: Then Pilate asked him[a], saying, “Are you the king of the Jews?” And answering him, he said[b], “You say so.”
translation:
  language: fr
  text: 'Pilate lui demanda alors : « Es-tu le roi des Juifs[a] ? » Jésus lui répondit : « C’est toi qui le dis[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des Judéens ». Le terme grec peut désigner les Juifs ou les habitants de la Judée, selon le contexte.
    reason: lexical_alternative
  - marker: b
    text: Ou « Tu le dis »; le sens peut aussi être rendu par « Oui, c’est comme tu le dis ». La réponse grecque, très concise, peut s’entendre comme une affirmation nuancée.
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: alors
  rationale: Connecteur narratif léger qui fait avancer le récit sans marquer une forte opposition.
- source_word: ἠρώτησεν
  choice: demanda
  rationale: Rend naturellement l’aoriste de ἐρωτάω introduisant la question directe de Pilate.
- source_word: λέγων
  choice: omis comme redondance idiomatique
  rationale: 'En français courant, « demanda : » exprime déjà l’acte de parole; ajouter « en disant » serait inutilement lourd sans apporter de contenu.'
- source_word: Σὺ εἶ
  choice: Es-tu
  rationale: La syntaxe et le contexte indiquent clairement une interrogation directe.
- source_word: βασιλεὺς
  choice: roi
  rationale: Restitue directement le titre royal en cause dans l’interrogatoire.
- source_word: τῶν Ἰουδαίων
  choice: des Juifs
  rationale: Titre politique et religieux conventionnel dans le récit de la Passion; l’autre sens possible, « Judéens », est signalé en note.
- source_word: ἀποκριθεὶς αὐτῷ ἔφη
  choice: Jésus lui répondit
  rationale: Formulation française naturelle qui conserve la valeur responsive du participe et le destinataire exprimé par αὐτῷ. Le nom de Jésus explicite sans ambiguïté le sujet déjà déterminé par le contexte.
- source_word: Σὺ λέγεις
  choice: C’est toi qui le dis
  rationale: 'Conserve la concision et le caractère indirect de la réponse : elle ne nie pas le titre, mais le présente comme la formulation de Pilate.'
theological_decisions:
- issue: Portée de la réponse Σὺ λέγεις
  choice: 'Affirmation volontairement qualifiée : « C’est toi qui le dis. »'
  alternative: « Tu le dis » ou, de façon plus explicitement affirmative, « Oui, c’est comme tu le dis. »
  rationale: Le grec est bref et peut exprimer un assentiment nuancé plutôt qu’un simple « oui ». La traduction préserve la tension rhétorique et christologique sans renforcer ni atténuer artificiellement l’affirmation.
translation_notes:
  register: Français international moderne, naturel et digne. La tournure grecque redondante « demanda… disant » est idiomatiquement simplifiée. « C’est toi qui le dis » garde l’accent porté sur le pronom Σὺ et l’ambiguïté calculée de la réponse.
