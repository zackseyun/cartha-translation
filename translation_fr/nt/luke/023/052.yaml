  text: οὗτος προσελθὼν τῷ Πιλάτῳ ᾐτήσατο τὸ σῶμα τοῦ Ἰησοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/052.yaml
  text: This man went to Pilate and asked for the body of Jesus.
translation:
  language: fr
  text: Cet homme alla trouver Pilate et lui demanda le corps de Jésus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὗτος
  choice: Cet homme
  rationale: Le démonstratif renvoie à Joseph d’Arimathée, mentionné au verset précédent. « Cet homme » en conserve la valeur anaphorique de manière naturelle.
- source_word: προσελθὼν τῷ Πιλάτῳ
  choice: alla trouver Pilate
  rationale: Le participe aoriste exprime une action précédant et accompagnant la demande. « Alla trouver » rend naturellement en français l’idée de se présenter auprès de Pilate.
- source_word: ᾐτήσατο
  choice: lui demanda
  rationale: Le verbe signifie ici demander à recevoir quelque chose. Le pronom « lui » explicite naturellement en français que la demande est adressée à Pilate, sans ajouter de contenu.
- source_word: τὸ σῶμα
  choice: le corps
  rationale: « Corps » traduit directement σῶμα et respecte la sobriété du grec; « cadavre » serait plus dur et plus interprétatif.
- source_word: τοῦ Ἰησοῦ
  choice: de Jésus
  rationale: Le génitif relationnel ou possessif se rend simplement et naturellement par « de Jésus ».
theological_decisions: []
translation_notes:
  register: Français moderne, international et digne. La phrase reste concise et narrative; « alla trouver » évite la raideur de « s’approcha de » tout en conservant la succession des actions du grec.
