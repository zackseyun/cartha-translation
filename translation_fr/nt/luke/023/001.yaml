id: LUK.23.1
reference: Luke 23:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ ἀναστὰν ἅπαν τὸ πλῆθος αὐτῶν ἤγαγον αὐτὸν ἐπὶ τὸν Πιλᾶτον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/001.yaml
  text: And the whole assembly of them rose and led him to Pilate[a].
translation:
  language: fr
  text: Alors toute leur assemblée se leva et le conduisit devant Pilate.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « toute leur foule ».
    reason: Alternative lexicale possible pour πλῆθος ; « assemblée » convient mieux au groupe réuni dans le contexte narratif.
lexical_decisions:
- source_word: Καὶ
  choice: Alors
  rationale: Le connecteur introduit l’étape suivante du récit. « Alors » exprime naturellement la succession en français sans ajouter de lien causal.
- source_word: ἀναστὰν
  choice: se leva
  rationale: Le participe aoriste indique une action qui précède celle du verbe principal. La coordination française « se leva et conduisit » restitue clairement et naturellement cette succession.
- source_word: ἅπαν τὸ πλῆθος αὐτῶν
  choice: toute leur assemblée
  rationale: πλῆθος désigne ici l’ensemble du groupe réuni dans le contexte judiciaire précédent. « Assemblée » évite l’idée d’une foule fortuite, sans identifier plus précisément le groupe que ne le fait le grec; ἅπαν et αὐτῶν sont rendus par « toute leur ».
- source_word: ἤγαγον
  choice: conduisit
  rationale: Le verbe ἄγω exprime le fait de mener quelqu’un vers une destination. « Conduisit » convient à l’escorte de Jésus et s’accorde avec le sujet collectif singulier « assemblée ».
- source_word: αὐτὸν
  choice: Jésus
  rationale: Le grec emploie le pronom « lui ». La reprise du nom « Jésus » évite en français une suite momentanément ambiguë après « leur assemblée » et ne modifie pas le référent.
- source_word: ἐπὶ τὸν Πιλᾶτον
  choice: devant Pilate
  rationale: Avec l’accusatif après un verbe de mouvement, ἐπί marque le déplacement vers Pilate. Dans cette scène judiciaire, « devant Pilate » rend naturellement à la fois la destination personnelle et la comparution implicite.
- source_word: Πιλᾶτον
  choice: Pilate
  rationale: Forme française traditionnelle et courante du nom propre.
theological_decisions:
- issue: Désignation du groupe dans le contexte judiciaire
  choice: toute leur assemblée
  alternative: toute leur foule; tout leur groupe
  rationale: « Assemblée » reflète un corps réuni sans imposer au texte le nom d’une institution précise. Le choix maintient la portée collective de πλῆθος et la totalité exprimée par ἅπαν.
- issue: Destination auprès de Pilate
  choice: devant Pilate
  alternative: auprès de Pilate; chez Pilate
  rationale: « Devant Pilate » convient au mouvement vers une autorité judiciaire, mais ne précise pas davantage la nature juridique de la comparution.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase conserve l’enchaînement narratif et la totalité du groupe, avec un sujet collectif au singulier selon l’usage français.
