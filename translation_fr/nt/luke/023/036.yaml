  text: ⸀ἐνέπαιξαν δὲ αὐτῷ καὶ οἱ στρατιῶται προσερχόμενοι, ⸀ὄξος προσφέροντες αὐτῷ
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/036.yaml
  text: The soldiers also mocked him[a], coming up and offering him sour wine,
translation:
  language: fr
  text: Les soldats aussi se moquèrent de lui, s’approchant et lui offrant du vin aigre[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vinaigre ». Le mot grec désigne un vin aigre, boisson courante et bon marché.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνέπαιξαν
  choice: se moquèrent
  rationale: Le verbe ἐμπαίζω exprime ici une moquerie hostile. « Se moquèrent » est naturel en français moderne et conserve la force méprisante du geste.
- source_word: δὲ … καὶ
  choice: aussi
  rationale: Dans le contexte, δέ poursuit le récit tandis que καί ajoute les soldats aux autres personnes qui se moquent de Jésus. « Aussi » rend clairement cet effet conjoint.
- source_word: οἱ στρατιῶται
  choice: les soldats
  rationale: Traduction directe et usuelle de στρατιῶται, adaptée au contexte de l’exécution romaine.
- source_word: προσερχόμενοι
  choice: ils s’approchaient
  rationale: Le participe décrit le mouvement des soldats vers Jésus pendant qu’ils se moquent de lui. La tournure française coordonnée garde l’action distincte et rend la scène naturellement.
- source_word: ὄξος
  choice: vin aigre
  rationale: ὄξος désigne un vin devenu aigre, boisson courante et bon marché. « Vin aigre » évite que le lecteur moderne pense uniquement au vinaigre utilisé comme condiment.
- source_word: προσφέροντες
  choice: lui offraient
  rationale: Le participe indique qu’ils présentaient la boisson à Jésus. « Offraient » rend l’action sans préciser un motif que le verset n’explicite pas.
theological_decisions:
- issue: Nature du geste des soldats lorsqu’ils offrent le ὄξος
  choice: Le geste est rapporté sans être défini explicitement comme compassion ou comme cruauté supplémentaire.
  alternative: Comprendre l’offre soit comme un léger geste de pitié, soit exclusivement comme une provocation.
  rationale: Le contexte immédiat place l’action dans une scène de moquerie, mais le verset ne formule pas davantage le motif psychologique des soldats. La traduction laisse donc le contexte produire sa tonalité sans résoudre cette tension.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple convient au premier plan narratif; l’imparfait des deux actions coordonnées restitue de façon naturelle les participes grecs qui développent la scène. Le marqueur de note est placé après « vin aigre », terme auquel la note se rapporte.
