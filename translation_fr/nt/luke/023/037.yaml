source:
  edition: SBLGNT
  text: καὶ λέγοντες· Εἰ σὺ εἶ ὁ βασιλεὺς τῶν Ἰουδαίων, σῶσον σεαυτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/037.yaml
  text: and saying[a], “If you are the King of the Jews, save yourself.”
translation:
  language: fr
  text: 'et disaient : « Si tu es le roi des Juifs[a], sauve-toi toi-même ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le roi des Judéens ». Le grec Ἰουδαίων peut désigner les Juifs ou les habitants de la Judée, selon le contexte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ λέγοντες
  choice: et disaient
  rationale: Le participe présent, rattaché au sujet pluriel du verset précédent, se rend naturellement en français par une proposition coordonnée à l’imparfait, sans ajouter explicitement l’idée de moquerie déjà donnée par le contexte.
- source_word: Εἰ σὺ εἶ
  choice: Si tu es
  rationale: « Si » conserve la forme du défi sarcastique sans faire croire que les locuteurs reconnaissent réellement le titre; le pronom « tu » porte naturellement l’accent en français.
- source_word: ὁ βασιλεὺς τῶν Ἰουδαίων
  choice: le roi des Juifs
  rationale: Cette formulation naturelle conserve le titre politique et messianique employé dans le récit de la Passion. « Judéens » reste une possibilité lexicale, signalée en note.
- source_word: σῶσον σεαυτόν
  choice: sauve-toi toi-même
  rationale: L’impératif rend directement le défi et préserve le lien lexical avec les autres emplois de σῴζω chez Luc; « toi-même » restitue la valeur réfléchie et emphatique de σεαυτόν.
theological_decisions:
- issue: Sens du titre βασιλεὺς τῶν Ἰουδαίων
  choice: le roi des Juifs
  alternative: le roi des Judéens
  rationale: Dans le contexte de la crucifixion, l’expression fonctionne comme un titre royal chargé d’ironie et lié à l’accusation portée contre Jésus. « Juifs » est le rendu français établi et contextuellement approprié, tandis que « Judéens » préserve une nuance régionale ou ethnogéographique possible.
- issue: Force de la condition Εἰ
  choice: Si tu es
  alternative: Puisque tu es
  rationale: Le défi met en doute, ou tourne en dérision, la royauté de Jésus. Traduire par « puisque » résoudrait indûment cette tension en présentant le titre comme admis par les locuteurs.
translation_notes:
  register: Français international moderne, naturel et digne. L’imparfait « disaient » intègre idiomatiquement le participe grec au récit. L’exclamation finale rend la vigueur de l’impératif provocateur sans ajouter de terme interprétatif tel que « se moquant ».
