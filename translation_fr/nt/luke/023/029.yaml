id: LUK.23.29
reference: Luke 23:29
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὅτι ἰδοὺ ἔρχονται ἡμέραι ἐν αἷς ἐροῦσιν Μακάριαι αἱ στεῖραι καὶ ⸀αἱ κοιλίαι αἳ οὐκ ἐγέννησαν καὶ μαστοὶ οἳ οὐκ ⸀ἔθρεψαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/029.yaml
  text: For look, days are coming in which they will say, ‘Blessed are the barren women, and the wombs that never bore, and the breasts that never nursed.’
translation:
  language: fr
  text: 'Car voici que des jours viennent où l’on dira : « Heureuses les femmes stériles, les ventres qui n’ont pas enfanté et les seins qui n’ont pas allaité ! »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: voici que
  rationale: Cette tournure française naturelle conserve la fonction d’appel à l’attention et l’annonce solennelle du grec.
- source_word: Μακάριαι
  choice: Heureuses
  rationale: « Heureuses » rend directement la déclaration de bonheur ou de condition enviable, ici avec une force tragiquement paradoxale.
- source_word: αἱ στεῖραι
  choice: les femmes stériles
  rationale: Le substantif adjectival féminin désigne les femmes qui ne peuvent avoir d’enfants ; expliciter « femmes » est nécessaire en français courant.
- source_word: αἱ κοιλίαι αἳ οὐκ ἐγέννησαν
  choice: les ventres qui n’ont pas enfanté
  rationale: Le choix garde l’image corporelle concrète de κοιλίαι et le parallélisme avec les seins, sans la réduire à une abstraction.
- source_word: μαστοὶ οἳ οὐκ ἔθρεψαν
  choice: les seins qui n’ont pas allaité
  rationale: Dans ce contexte maternel, ἔθρεψαν évoque le fait de nourrir au sein ; « allaité » est idiomatique et préserve l’image.
theological_decisions:
- issue: Le caractère paradoxal de la béatitude prononcée sur les femmes sans enfants
  choice: Conserver sans atténuation « Heureuses les femmes stériles »
  alternative: Expliciter qu’elles seront dites heureuses uniquement parce qu’elles échapperont aux souffrances à venir
  rationale: Le verset laisse le motif implicite dans son contexte immédiat. L’expliciter dans le texte résoudrait une tension rhétorique que le grec maintient.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme ternaire et les images corporelles du grec sont conservés. « Car voici que » relie explicitement l’annonce à l’exhortation précédente tout en gardant sa solennité.
