source:
  edition: SBLGNT
  text: καὶ εἱστήκει ὁ λαὸς θεωρῶν. ἐξεμυκτήριζον δὲ καὶ οἱ ⸀ἄρχοντες λέγοντες· Ἄλλους ἔσωσεν, σωσάτω ἑαυτόν, εἰ οὗτός ἐστιν ὁ χριστὸς ⸂τοῦ θεοῦ, ὁ⸃ ἐκλεκτός.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/035.yaml
  text: And the people stood watching. But even the rulers were mocking him[a], saying, “He saved others; let him save himself, if this is God’s Messiah, the Chosen One.”
translation:
  language: fr
  text: 'Le peuple se tenait là et regardait. Les dirigeants aussi se moquaient de lui en disant : « Il en a sauvé d’autres ; qu’il se sauve lui-même, s’il est le Messie de Dieu, l’Élu ! »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἱστήκει
  choice: se tenait là
  rationale: La forme verbale présente une situation qui dure et plante le décor. « Se tenait là » exprime naturellement en français la posture et la continuité.
- source_word: θεωρῶν
  choice: regardait
  rationale: Le participe indique que le peuple observe la scène de façon continue. La coordination avec « se tenait là » donne un français courant et clair.
- source_word: ἐξεμυκτήριζον
  choice: se moquaient de lui
  rationale: Le verbe exprime une moquerie méprisante. Cette formulation est naturelle et suffisamment forte, tandis que le pronom « lui » est fourni par le contexte.
- source_word: ἄρχοντες
  choice: les chefs
  rationale: Dans ce contexte, le terme désigne les dirigeants du peuple. « Les chefs » est idiomatique en français biblique moderne sans préciser davantage leur identité que le texte.
- source_word: Ἄλλους ἔσωσεν
  choice: Il en a sauvé d’autres
  rationale: « Sauver » conserve le sens de σῴζω ainsi que la répétition ironique avec l’impératif suivant. Le pronom « en » rend la phrase naturelle en français.
- source_word: σωσάτω ἑαυτόν
  choice: qu’il se sauve lui-même
  rationale: Cette tournure rend directement l’impératif à la troisième personne et préserve la répétition du verbe « sauver ».
- source_word: εἰ οὗτός ἐστιν
  choice: s’il est
  rationale: En français, « si celui-ci est » serait lourd dans cette phrase. Le pronom « il » conserve le référent sans ajouter l’expression potentiellement plus méprisante « cet homme ».
- source_word: ὁ χριστὸς τοῦ θεοῦ
  choice: le Messie de Dieu
  rationale: Χριστός est ici un titre et « Messie » en transmet le sens. Le complément « de Dieu » suit de près le grec et reste naturel.
- source_word: ὁ ἐκλεκτός
  choice: celui qu’il a choisi
  rationale: Cette formulation explicite naturellement en français la valeur passive de ἐκλεκτός et identifie Dieu comme agent à partir du complément immédiatement précédent, sans employer le terme plus technique « l’Élu ».
theological_decisions:
- issue: Traduction du titre Χριστός
  choice: le Messie
  alternative: le Christ
  rationale: Le mot fonctionne clairement comme un titre messianique dans la raillerie. « Messie » en communique le sens au lecteur moderne plutôt que de le traiter comme un nom propre.
- issue: Portée de ὁ ἐκλεκτός
  choice: celui qu’il a choisi
  alternative: l’Élu
  rationale: Le titre christologique est conservé, mais exprimé dans une langue accessible. La formulation ne précise ni la nature ni le but de ce choix, maintenant ainsi la tension du texte.
- issue: Relation entre « le Messie de Dieu » et « celui qu’il a choisi »
  choice: deux désignations apposées de la même personne
  alternative: une seule expression composée rendue « le Messie choisi de Dieu »
  rationale: La reprise de l’article grec devant ἐκλεκτός favorise une désignation apposée distincte. La traduction garde donc les deux titres sans les fusionner.
translation_notes:
  register: Français international moderne, digne et oralement fluide. La raillerie reste directe, sans vocabulaire confessionnel spécialisé. Aucun appel de note n’est nécessaire, puisqu’aucune note n’est fournie.
