    issue: Ambiguïté syntaxique dans « ce que méritent nos actes »
    rationale: La construction peut suggérer que « nos actes » méritent quelque chose, plutôt que d’exprimer que les locuteurs reçoivent le juste retour de leurs propres actes. Une formulation explicite préserve mieux le rapport entre ἄξια, ὧν ἐπράξαμεν et ἀπολαμβάνομεν.
  - severity: low
    issue: Note a peu adaptée à son ancrage
    rationale: La note donnée comme littérale cite aussi « et nous, certes », alors que son ancre est placée sur « c’est justice ». Une alternative directement liée à δικαίως est plus nette.
  revised_text: Quant à nous, c’est justice[a], car nous recevons ce que nous méritons pour ce que nous avons fait ; mais cet homme n’a rien fait de mal[b].
