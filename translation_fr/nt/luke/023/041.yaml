id: LUK.23.41
reference: Luke 23:41
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἡμεῖς μὲν δικαίως, ἄξια γὰρ ὧν ἐπράξαμεν ἀπολαμβάνομεν· οὗτος δὲ οὐδὲν ἄτοπον ἔπραξεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/041.yaml
  text: And we indeed justly[a], for we are receiving what our deeds deserve[b]; but this man has done nothing wrong.
translation:
  language: fr
  text: Quant à nous, c’est justice[a], car nous recevons ce que nous méritons pour ce que nous avons fait ; mais cet homme n’a rien fait de mal[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « c’est juste ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « n’a rien fait de répréhensible » ou « d’inconvenant ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: δικαίως
  choice: c’est justice
  rationale: L’adverbe affirme que le châtiment subi est juste et mérité. La tournure française « c’est justice » conserve nettement la portée judiciaire tout en restant naturelle.
- source_word: ἄξια
  choice: ce que méritent
  rationale: Avec ἀπολαμβάνομεν, le terme exprime des conséquences proportionnées aux actes accomplis. « Ce que méritent » rend ce rapport sans lourdeur.
- source_word: ὧν ἐπράξαμεν
  choice: nos actes
  rationale: Cette formulation française concise restitue la relative grecque désignant ce qu’ils ont fait, sans ajouter de précision morale absente du texte.
- source_word: ἀπολαμβάνομεν
  choice: nous recevons
  rationale: Le présent français exprime naturellement la peine qu’ils subissent maintenant. Une forme progressive plus explicite serait peu idiomatique ici.
- source_word: οὗτος
  choice: cet homme
  rationale: Le démonstratif établit le contraste avec les deux condamnés et désigne clairement Jésus dans le contexte.
- source_word: οὐδὲν ἄτοπον
  choice: rien fait de mal
  rationale: Dans ce contexte judiciaire, ἄτοπον désigne quelque chose de mauvais, inconvenant ou répréhensible. « Rien fait de mal » affirme clairement l’innocence sans réduire le sens au seul domaine pénal.
- source_word: ἔπραξεν
  choice: a fait
  rationale: Le passé composé est la tournure française naturelle pour évoquer les actes de Jésus jusqu’au moment présent.
theological_decisions:
- issue: Portée de la déclaration d’innocence concernant Jésus
  choice: mais cet homme n’a rien fait de mal
  alternative: mais cet homme n’a rien fait de répréhensible
  rationale: La formulation conserve le témoignage direct du condamné à l’innocence de Jésus dans la situation présente, sans lui faire énoncer une conclusion doctrinale plus large que les mots grecs.
translation_notes:
  register: Français international moderne, digne et accessible. La structure contrastive μὲν…δέ est rendue par « pour nous… mais cet homme ». Les notes signalent la forme plus littérale de δικαίως et l’étendue sémantique de ἄτοπον.
