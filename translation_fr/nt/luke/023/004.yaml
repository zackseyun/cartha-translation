id: LUK.23.4
reference: Luke 23:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ δὲ Πιλᾶτος εἶπεν πρὸς τοὺς ἀρχιερεῖς καὶ τοὺς ὄχλους· Οὐδὲν εὑρίσκω αἴτιον ἐν τῷ ἀνθρώπῳ τούτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/004.yaml
  text: Then Pilate said to the chief priests and the crowds[a], “I find no basis for a charge against this man.”
translation:
  language: fr
  text: 'Pilate dit alors aux grands prêtres et aux foules : « Je ne trouve aucun motif d’accusation contre cet homme[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Je ne trouve aucune faute chez cet homme. » Le grec αἴτιον peut désigner une « faute », mais il a ici un sens judiciaire : aucun motif valable d’accusation.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: alors
  rationale: Connecteur narratif léger ; « alors » exprime naturellement la progression du récit sans lui donner une opposition trop marquée.
- source_word: Πιλᾶτος
  choice: Pilate
  rationale: Forme française traditionnelle et courante du nom propre.
- source_word: εἶπεν πρὸς
  choice: dit … aux
  rationale: Rend naturellement la construction signifiant qu’il s’adresse à des destinataires précis.
- source_word: ἀρχιερεῖς
  choice: grands prêtres
  rationale: Désignation française usuelle des principaux responsables du sacerdoce ; le pluriel ne signifie pas que plusieurs personnes exerçaient simultanément la fonction unique de grand prêtre.
- source_word: ὄχλους
  choice: foules
  rationale: Conserve le pluriel du grec, qui envisage plusieurs groupes de personnes présents.
- source_word: Οὐδὲν εὑρίσκω
  choice: Je ne trouve aucun
  rationale: Formulation française idiomatique qui conserve le présent de l’évaluation judiciaire de Pilate et la négation absolue.
- source_word: αἴτιον
  choice: motif d’accusation
  rationale: Dans ce contexte judiciaire, le terme désigne une raison valable de porter une accusation ; cette formulation est plus précise en français moderne que le seul mot « faute ».
- source_word: ἐν τῷ ἀνθρώπῳ τούτῳ
  choice: contre cet homme
  rationale: Dans une déclaration judiciaire, « contre cet homme » rend idiomatiquement le grec, littéralement « en cet homme », tout en conservant le démonstratif.
theological_decisions:
- issue: Portée de la déclaration de Pilate
  choice: 'Formuler un constat judiciaire : « aucun motif d’accusation »'
  alternative: 'Formuler un jugement moral général : « aucune faute »'
  rationale: Le cadre du procès favorise le sens judiciaire sans exclure l’autre nuance, laquelle est signalée en note afin de préserver l’étendue sémantique du grec.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proche du grec tout en étant naturelle ; le pluriel « foules » est maintenu malgré la possibilité idiomatique de dire « foule » au singulier.
