source:
  edition: SBLGNT
  text: ἀπέλυσεν δὲ τὸν διὰ στάσιν καὶ φόνον βεβλημένον ⸀εἰς φυλακὴν ὃν ᾐτοῦντο, τὸν δὲ Ἰησοῦν παρέδωκεν τῷ θελήματι αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/025.yaml
  text: So he released the man who had been thrown into prison for insurrection and murder[a], whom they were asking for[b]; but he handed Jesus over to their will.
translation:
  language: fr
  text: Il relâcha donc l’homme qui avait été jeté en prison[a] pour insurrection et meurtre, celui qu’ils réclamaient ; mais il livra Jésus à leur volonté[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « avait été mis en prison ». Le grec emploie une expression plus vive : « avait été jeté en prison ».'
    reason: lexical_alternative
  - marker: b
    text: Ou « à ce qu’ils voulaient ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέλυσεν
  choice: relâcha
  rationale: Dans ce contexte judiciaire, ἀπολύω désigne la mise en liberté d’un prisonnier. « Relâcha » est précis, naturel et n’ajoute aucune nuance étrangère au texte.
- source_word: διὰ στάσιν καὶ φόνον
  choice: pour insurrection et meurtre
  rationale: διά suivi de l’accusatif exprime ici la cause. Dans le cadre politique du récit, στάσις désigne une insurrection ou révolte, et non une simple querelle.
- source_word: βεβλημένον εἰς φυλακήν
  choice: avait été jeté en prison
  rationale: 'Le participe parfait passif de βάλλω conserve une expression vive : l’homme avait été « jeté » en prison. Le plus-que-parfait français rend l’état résultant d’une action antérieure.'
- source_word: ὃν ᾐτοῦντο
  choice: celui qu’ils réclamaient
  rationale: L’imparfait ᾐτοῦντο présente leur requête comme persistante. « Réclamaient » convient au contexte de pression collective sans aller jusqu’à expliciter une menace.
- source_word: παρέδωκεν
  choice: livra
  rationale: παραδίδωμι exprime ici le fait de remettre Jésus au pouvoir d’autrui. « Livra » est idiomatique dans un contexte judiciaire et conserve la force du verbe de la Passion.
- source_word: τῷ θελήματι αὐτῶν
  choice: à leur volonté
  rationale: Cette formulation formelle mais claire préserve la dimension volitive de θέλημα ainsi que l’expression concise du grec, sans préciser un destinataire que le texte ne nomme pas.
- source_word: δὲ ... δὲ
  choice: donc ... mais
  rationale: Le premier δέ fait progresser le récit et le second marque le contraste entre la libération du prisonnier et la remise de Jésus.
theological_decisions:
- issue: Contraste entre l’insurgé libéré et Jésus livré
  choice: Maintenir le contraste narratif sans ajouter une interprétation substitutive explicite
  alternative: Ajouter « à sa place » ou « à la place de Jésus »
  rationale: Le récit juxtapose clairement les deux décisions de Pilate, mais ce verset ne formule pas lui-même une doctrine de substitution. La traduction ne doit pas rendre explicite une déduction théologique possible.
- issue: Sens de « à leur volonté »
  choice: Conserver l’expression abstraite et ouverte du grec
  alternative: Expliciter « pour qu’ils fassent de lui ce qu’ils voulaient »
  rationale: Le grec dit que Pilate livre Jésus à leur volonté, sans détailler ici l’exécution de cette volonté. Une paraphrase plus développée réduirait cette concision et pourrait surinterpréter l’action.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la forte opposition entre l’homme coupable d’insurrection et de meurtre, d’une part, et Jésus, d’autre part. « Insurrection » garde la portée politique de στάσις ; « réclamaient » rend la demande persistante de la foule ; « livra » maintient le vocabulaire judiciaire et passionnel sans ajout doctrinal.
