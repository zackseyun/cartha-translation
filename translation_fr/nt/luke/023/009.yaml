  text: ἐπηρώτα δὲ αὐτὸν ἐν λόγοις ἱκανοῖς· αὐτὸς δὲ οὐδὲν ἀπεκρίνατο αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/009.yaml
  text: So he questioned him at considerable length[a], but he answered him nothing.
translation:
  language: fr
  text: Il l’interrogea longuement[a], mais Jésus ne lui répondit rien.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « avec beaucoup de paroles » ; on peut aussi comprendre : « par de nombreuses questions ». L’expression grecque souligne le caractère prolongé de l’interrogation.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπηρώτα
  choice: l’interrogea
  rationale: Le verbe désigne ici un interrogatoire ou des questions pressantes. L’imparfait grec présente une action prolongée ou répétée, nuance exprimée en français par « longuement » dans la locution qui suit.
- source_word: δὲ
  choice: donc / mais
  rationale: Le premier δέ assure une transition narrative légère, rendue naturellement par « donc »; le second marque le contraste entre les questions d’Hérode et le silence de Jésus, d’où « mais ».
- source_word: ἐν λόγοις ἱκανοῖς
  choice: longuement[a]
  rationale: Littéralement, l’expression évoque des paroles nombreuses ou abondantes. « Longuement » rend avec naturel la durée et l’ampleur de l’interrogatoire sans réduire explicitement λόγοις au seul sens de « questions ».
- source_word: αὐτὸς
  choice: Jésus
  rationale: Le pronom grec est légèrement emphatique et oppose le répondant à celui qui interroge. Répéter « Jésus » évite en français l’ambiguïté créée par deux pronoms masculins successifs.
- source_word: οὐδὲν
  choice: rien
  rationale: Le terme indique qu’aucune réponse, aucun contenu verbal, ne fut donné.
- source_word: ἀπεκρίνατο αὐτῷ
  choice: ne lui répondit
  rationale: Cette formulation française rend naturellement le verbe « répondre » et le complément indirect αὐτῷ.
theological_decisions: []
translation_notes:
  register: Français moderne, naturel et digne. Le nom « Jésus », explicité à partir du contexte, lève une ambiguïté pronominale que le français tolère moins bien que le grec. Le passé simple convient au registre narratif biblique soutenu tout en restant largement compréhensible.
