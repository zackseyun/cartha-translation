id: LUK.14.26
reference: Luke 14:26
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Εἴ τις ἔρχεται πρός με καὶ οὐ μισεῖ τὸν πατέρα ⸀ἑαυτοῦ καὶ τὴν μητέρα καὶ τὴν γυναῖκα καὶ τὰ τέκνα καὶ τοὺς ἀδελφοὺς καὶ τὰς ἀδελφάς, ἔτι ⸀τε καὶ τὴν ⸂ψυχὴν ἑαυτοῦ⸃, οὐ δύναται ⸂εἶναί μου μαθητής⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/026.yaml
  text: If anyone comes to me and does not hate his own father and mother and wife and children and brothers and sisters—and even his own life—he cannot be my disciple[a][b].
translation:
  language: fr
  text: Si quelqu’un vient à moi et ne hait pas son propre père, sa mère, sa femme, ses enfants, ses frères et ses sœurs, et même sa propre vie, il ne peut pas être mon disciple[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe signifie littéralement « haïr ». Dans ce contexte, il peut exprimer l’exigence d’aimer Jésus plus que les liens familiaux les plus étroits ; comparer Matthieu 10.37.
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « sa propre âme ». Ici, « vie » traduit le sens probable de ψυχή dans le contexte du prix à payer pour être disciple.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μισεῖ
  choice: hait
  rationale: Le sens lexical direct est « haïr ». Malgré la valeur comparative possible dans ce contexte marqué par une tournure sémitique, conserver le terme fort respecte la formulation grecque et sa tension; la note indique le sens possible « aimer moins ».
- source_word: ἔρχεται πρός με
  choice: vient à moi
  rationale: Rend directement le mouvement relationnel exprimé par ἔρχεται πρός sans importer la formule différente « vient après moi ».
- source_word: πατέρα ἑαυτοῦ
  choice: son propre père
  rationale: « Propre » représente la valeur personnelle du réfléchi ἑαυτοῦ.
- source_word: γυναῖκα
  choice: sa femme
  rationale: Dans cette énumération familiale, γυνή désigne naturellement l’épouse.
- source_word: ἀδελφοὺς καὶ ἀδελφάς
  choice: ses frères et ses sœurs
  rationale: Le grec nomme explicitement les frères et les sœurs; les deux termes sont donc conservés.
- source_word: ἔτι τε καὶ
  choice: et même
  rationale: Cette expression met en relief le dernier élément de l’énumération et lui donne une valeur culminante.
- source_word: ψυχὴν ἑαυτοῦ
  choice: sa propre vie
  rationale: Dans le contexte du prix à payer pour devenir disciple, ψυχή désigne probablement la vie ou la personne elle-même plutôt que l’âme au sens étroit.
- source_word: οὐ δύναται εἶναί μου μαθητής
  choice: il ne peut pas être mon disciple
  rationale: Formulation française naturelle qui conserve la force de l’impossibilité ou de l’incompatibilité, et non celle d’une simple interdiction.
theological_decisions:
- issue: Faut-il atténuer l’exigence de Jésus en traduisant μισεῖ par une comparaison dans le texte principal?
  choice: Conserver « hait » dans le texte principal et expliquer en note la valeur comparative ou prioritaire possible.
  alternative: Traduire dans le texte principal par « aime moins » ou « ne préfère pas à moi ».
  rationale: La parole grecque est volontairement abrupte. La remplacer directement par une formulation comparative résoudrait la tension au lieu de la préserver; la note permet toutefois de communiquer le sens contextuel probable.
- issue: Sens de ψυχή dans ce verset
  choice: Traduire par « vie ».
  alternative: « âme » ou « personne »
  rationale: Le contexte porte sur le coût de l’engagement comme disciple et sur la priorité accordée à Jésus jusque sur sa propre existence. « Vie » communique ce sens sans imposer une anthropologie particulière.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe reste proche du grec tout en évitant une lourdeur excessive. Le masculin indéfini « quelqu’un » est repris par « il » selon l’usage grammatical français; l’énumération familiale explicite est intégralement conservée.
