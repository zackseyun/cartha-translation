id: LUK.14.27
reference: Luke 14:27
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸀ὅστις οὐ βαστάζει τὸν σταυρὸν ⸀ἑαυτοῦ καὶ ἔρχεται ὀπίσω μου, οὐ δύναται εἶναί μου μαθητής.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/027.yaml
  text: Whoever does not carry his own cross and come after me cannot be my disciple[a][b].
translation:
  language: fr
  text: Celui qui ne porte pas sa propre croix[a] et qui vient derrière moi[b] ne peut pas être mon disciple.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ne supporte pas sa propre croix ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « vient derrière moi » ; cette expression évoque le fait de suivre Jésus comme disciple.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅστις
  choice: Celui qui
  rationale: Le pronom relatif indéfini introduit une condition générale. « Celui qui » est naturel en français et conserve le singulier générique du grec.
- source_word: βαστάζει
  choice: porte
  rationale: Le verbe signifie « porter » ou « supporter ». « Porte » maintient ici l’image concrète de la croix tout en laissant percevoir sa portée métaphorique.
- source_word: τὸν σταυρὸν ἑαυτοῦ
  choice: sa propre croix
  rationale: « Croix » est l’équivalent établi de σταυρός, instrument d’exécution évoquant ici le coût et la honte liés à la condition de disciple. « Sa propre » rend l’insistance du réfléchi singulier ἑαυτοῦ.
- source_word: ἔρχεται ὀπίσω μου
  choice: vient derrière moi
  rationale: Cette formulation conserve l’image spatiale du grec et son lien avec la marche à la suite d’un maître, sans la réduire d’emblée au seul verbe interprétatif « suivre ».
- source_word: οὐ δύναται εἶναί μου μαθητής
  choice: ne peut pas être mon disciple
  rationale: La construction exprime une impossibilité ou incompatibilité, et non une simple interdiction. La formulation française est idiomatique et en garde la force.
- source_word: μαθητής
  choice: disciple
  rationale: « Disciple » est le terme consacré dans le contexte des Évangiles et désigne une personne engagée à la suite d’un maître.
theological_decisions:
- issue: Valeur générique du réfléchi masculin singulier
  choice: 'Conserver le singulier : « Celui qui… sa propre croix »'
  alternative: Employer une formulation plurielle ou épicène
  rationale: Le grec présente un sujet générique au singulier et un réfléchi singulier. Le français « celui qui » conserve cette structure sans limiter le propos aux seuls hommes.
- issue: Image de la marche à la suite de Jésus
  choice: « vient derrière moi »
  alternative: « me suit »
  rationale: La traduction retenue préserve l’image concrète et la tension de l’expression grecque; la note indique son sens courant dans le langage de la condition de disciple.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe reste proche du grec tout en étant naturelle. Les deux négations coordonnées rendent clairement que les deux conditions relèvent du même sujet.
