revisions:
- from: 'Puis il leur dit[a] : « Si l’un de vous a un fils ou un bœuf qui tombe dans un puits, ne l’en retirera-t-il pas aussitôt, même le jour du sabbat ? »'
  to: 'Puis il leur dit[a] : « Lequel d’entre vous, si son fils ou son bœuf tombe dans un puits, ne l’en retirera pas aussitôt le jour du sabbat ? »'
  rationale: La révision clarifie que « son fils ou son bœuf » constitue l’alternative entière susceptible de tomber dans le puits, conformément à la syntaxe et au sens du grec. Elle supprime aussi l’explicitation « même », tout en conservant la question rhétorique, l’urgence (« aussitôt ») et la mention explicite du jour du sabbat. La variante « âne » demeure signalée en note sans affecter le texte principal fondé sur SBLGNT.
