source:
  edition: SBLGNT
  text: ⸀καὶ πρὸς αὐτοὺς εἶπεν· Τίνος ὑμῶν υἱὸς ἢ βοῦς εἰς φρέαρ ⸀πεσεῖται, καὶ οὐκ εὐθέως ἀνασπάσει αὐτὸν ⸀ἐν ἡμέρᾳ τοῦ σαββάτου;
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/005.yaml
  text: And he said to them[a], “Which of you, if a son or an ox falls into a well, will not immediately pull him out on the Sabbath day?”
translation:
  language: fr
  text: 'Puis il leur dit[a] : « Lequel d’entre vous, si son fils ou son bœuf tombe dans un puits, ne l’en retirera pas aussitôt le jour du sabbat ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Certains manuscrits portent « un âne » au lieu de « un fils ».
    reason: textual_variant
lexical_decisions:
- source_word: Τίνος ὑμῶν
  choice: Si l’un de vous
  rationale: Cette tournure introduit naturellement en français la situation hypothétique qui sous-tend la question rhétorique grecque.
- source_word: υἱὸς
  choice: un fils
  rationale: Le grec désigne précisément un fils au masculin singulier, plutôt qu’un enfant en général.
- source_word: βοῦς
  choice: un bœuf
  rationale: « Bœuf » est l’équivalent courant de βοῦς et conserve l’image d’un bovin utilisé comme animal de travail.
- source_word: φρέαρ
  choice: un puits
  rationale: φρέαρ désigne ici le plus naturellement un puits; ce choix évite d’harmoniser le verset avec des passages parallèles parlant d’une fosse.
- source_word: πεσεῖται
  choice: tombe
  rationale: Dans cette hypothèse rhétorique, le futur grec se rend naturellement en français par le présent après « si ».
- source_word: εὐθέως
  choice: aussitôt
  rationale: « Aussitôt » exprime clairement l’urgence temporelle du grec dans un registre naturel et digne.
- source_word: ἀνασπάσει αὐτόν
  choice: ne l’en retirera-t-il pas
  rationale: Le verbe évoque l’action de tirer vers le haut pour faire sortir du puits; le pronom singulier reprend aussi bien « fils » que « bœuf ».
- source_word: ἐν ἡμέρᾳ τοῦ σαββάτου
  choice: même le jour du sabbat
  rationale: « Le jour du sabbat » reflète explicitement ἡμέρᾳ; « même » rend naturellement la portée argumentative de la question sans modifier sa substance.
theological_decisions:
- issue: Variation textuelle concernant le premier être tombé dans le puits
  choice: un fils ou un bœuf
  alternative: un âne ou un bœuf
  rationale: Le texte SBLGNT fourni porte υἱός (« fils »). La leçon « âne », attestée dans certains manuscrits, est signalée en note plutôt qu’introduite dans le texte principal.
translation_notes:
  register: Français international moderne, fluide et digne. La question grecque est reformulée selon la syntaxe hypothétique idiomatique du français, tout en conservant son caractère rhétorique et l’image concrète du puits.
