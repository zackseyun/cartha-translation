    issue: Portée ambiguë de « qui tombe »
    rationale: Dans « un fils ou un bœuf qui tombe », la relative se rapporte normalement au seul nom immédiatement précédent, « bœuf ». Le grec présente au contraire « fils ou bœuf » comme les deux sujets possibles de « tombe ».
  - severity: low
    issue: Ajout de « même »
    rationale: Le mot souligne à juste titre l’argument rhétorique, mais il n’a pas de correspondant lexical direct dans ἐν ἡμέρᾳ τοῦ σαββάτου. Le retirer préserve plus strictement la formulation source.
  revised_text: 'Puis il leur dit[a] : « Lequel d’entre vous, si son fils ou son bœuf tombe dans un puits, ne l’en retirera pas aussitôt le jour du sabbat ? »'
