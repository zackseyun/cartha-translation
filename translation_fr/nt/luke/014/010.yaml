id: LUK.14.10
reference: Luke 14:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀλλ’ ὅταν κληθῇς πορευθεὶς ἀνάπεσε εἰς τὸν ἔσχατον τόπον, ἵνα ὅταν ἔλθῃ ὁ κεκληκώς σε ⸀ἐρεῖ σοι· Φίλε, προσανάβηθι ἀνώτερον· τότε ἔσται σοι δόξα ἐνώπιον ⸀πάντων τῶν συνανακειμένων σοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/010.yaml
  text: But when you are invited[a], go and recline in the lowest place, so that when the one who invited you comes, he will say to you, ‘Friend[b], move up higher.’ Then there will be honor for you in the presence of all who are reclining with you.
translation:
  language: fr
  text: 'Mais quand tu es invité, va prendre la dernière place[a]. Ainsi, lorsque celui qui t’a invité viendra, il te dira : « Mon ami, monte plus haut. » Alors tu seras honoré devant tous ceux qui seront à table avec toi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « va t’étendre à la dernière place ». À l’époque, on prenait généralement les repas de fête allongé à table.'
    reason: Précision lexicale et culturelle sur ἀνάπεσε.
lexical_decisions:
- source_word: κληθῇς
  choice: tu es invité
  rationale: Dans le contexte d’un repas, καλέω désigne l’invitation plutôt qu’un simple appel.
- source_word: πορευθεὶς ἀνάπεσε
  choice: va prendre… place
  rationale: Le participe accompagne l’impératif. En français naturel, l’ensemble se rend comme une seule consigne; « prendre place » évoque le repas sans imposer l’explication culturelle de la posture allongée.
- source_word: εἰς τὸν ἔσχατον τόπον
  choice: la dernière place
  rationale: L’expression désigne la position la moins prestigieuse dans l’ordre des convives. « La dernière place » est idiomatique et conserve l’image spatiale du grec.
- source_word: ὁ κεκληκώς σε
  choice: celui qui t’a invité
  rationale: Cette formulation transparente conserve le participe grec et évite d’introduire le terme plus interprétatif « maître de maison ».
- source_word: Φίλε
  choice: Mon ami
  rationale: Le vocatif exprime ici une adresse courtoise. « Mon ami » est la tournure française naturelle, sans modifier la portée de la parole.
- source_word: προσανάβηθι ἀνώτερον
  choice: monte plus haut
  rationale: La formulation préserve l’image ascendante et le passage à une place plus honorable.
- source_word: δόξα
  choice: tu seras honoré
  rationale: Dans cette scène sociale, δόξα désigne l’honneur ou l’estime publics plutôt que la gloire divine.
- source_word: ἐνώπιον πάντων τῶν συνανακειμένων σοι
  choice: devant tous ceux qui seront à table avec toi
  rationale: La traduction conserve le caractère public de l’honneur et rend naturellement en français le participe qui désigne les autres convives étendus à table.
theological_decisions:
- issue: Portée de l’enseignement
  choice: Conserver une instruction concrète formulée dans le cadre d’un repas, ouverte à une portée plus large sur l’humilité et l’honneur.
  alternative: Réduire le verset à une règle de savoir-vivre, ou le présenter comme une annonce exclusivement eschatologique.
  rationale: Le texte emploie une situation sociale réelle au sein d’un enseignement parabolique, sans préciser ici que l’honneur est uniquement mondain ou uniquement eschatologique.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement singulier reproduit les formes grecques de deuxième personne. « Prendre la dernière place » privilégie l’intelligibilité immédiate, tandis que la note conserve le détail historique de la posture à table.
