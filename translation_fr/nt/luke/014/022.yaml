  text: καὶ εἶπεν ὁ δοῦλος· Κύριε, γέγονεν ⸀ὃ ἐπέταξας, καὶ ἔτι τόπος ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/022.yaml
  text: And the servant said[a], ‘Lord, what you commanded has been done[b], and there is still room.’
translation:
  language: fr
  text: 'Le serviteur dit : « Seigneur[a], ce que tu as ordonné a été fait, et il reste encore de la place. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Maître ».
    reason: lexical_alternative
lexical_decisions:
- source_word: δοῦλος
  choice: serviteur
  rationale: Dans cette parabole, « serviteur » exprime naturellement la relation d’autorité au sein de la maison. Le grec peut aussi désigner un esclave, mais le statut servile n’est pas ici le point principal.
- source_word: Κύριε
  choice: Seigneur
  rationale: Le vocatif s’adresse au maître de maison. « Seigneur » conserve la valeur respectueuse et autoritaire du terme grec, tout en restant naturel dans le dialogue parabolique; « maître » demeure possible selon le contexte.
- source_word: γέγονεν
  choice: a été fait
  rationale: Le parfait présente l’exécution comme accomplie, avec un résultat qui demeure au moment où le serviteur rend compte.
- source_word: ὃ ἐπέταξας
  choice: ce que tu as ordonné
  rationale: Cette formulation rend clairement le contenu de l’ordre précédent et conserve la force autoritaire de ἐπιτάσσω.
- source_word: ἔτι
  choice: encore
  rationale: « Encore » indique qu’après l’exécution de l’ordre, une capacité disponible subsiste.
- source_word: τόπος
  choice: de la place
  rationale: Dans le cadre du repas, « de la place » désigne naturellement la capacité encore disponible pour accueillir des convives.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe suit de près le grec sans raideur. Le choix de « serviteur » évite une lourdeur dans le texte principal; aucune note n’est ajoutée à ce sujet, car « esclave » serait lexicalement possible mais moins naturel dans ce contexte précis.
