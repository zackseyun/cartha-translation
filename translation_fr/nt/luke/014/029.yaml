id: LUK.14.29
reference: Luke 14:29
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἵνα μήποτε θέντος αὐτοῦ θεμέλιον καὶ μὴ ἰσχύοντος ἐκτελέσαι πάντες οἱ θεωροῦντες ἄρξωνται ⸂αὐτῷ ἐμπαίζειν⸃
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/029.yaml
  text: otherwise[a], after he has laid a foundation and is not able to finish, all who see it may begin to mock him,
translation:
  language: fr
  text: Sinon[a], après avoir posé les fondations sans pouvoir achever l’ouvrage, tous ceux qui le voient pourraient se mettre à se moquer de lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus formellement : « de peur qu’après avoir posé les fondations sans pouvoir achever l’ouvrage, tous ceux qui le voient ne se mettent à se moquer de lui ».'
    reason: Cette formulation rend plus explicitement la valeur préventive de ἵνα μήποτε; le « ne » est explétif après « de peur que ».
lexical_decisions:
- source_word: ἵνα μήποτε
  choice: Autrement
  rationale: Dans cet avertissement parabolique, l’expression introduit l’issue indésirable à éviter. « Autrement » est naturel en français et conserve cette force de mise en garde.
- source_word: θέντος αὐτοῦ
  choice: après avoir posé
  rationale: Le génitif absolu indique une action antérieure à celle du verbe principal ; cette formulation rend clairement la succession temporelle.
- source_word: θεμέλιον
  choice: les fondations
  rationale: Dans le contexte d’une construction, le pluriel idiomatique français « les fondations » exprime naturellement le travail initial désigné par le singulier grec.
- source_word: μὴ ἰσχύοντος ἐκτελέσαι
  choice: sans pouvoir achever la construction
  rationale: ἰσχύω exprime ici la capacité, et ἐκτελέσαι l’action de mener l’ouvrage à son terme. « la construction » explicite sobrement l’objet sous-entendu par le contexte.
- source_word: πάντες οἱ θεωροῦντες
  choice: tous ceux qui l’observent
  rationale: θεωρέω signifie regarder ou observer attentivement. Le pronom « l’ » renvoie naturellement au constructeur dans cette formulation, sans ajouter un objet absent du grec.
- source_word: ἄρξωνται
  choice: se mettre à
  rationale: Cette tournure française rend naturellement l’idée de commencer contenue dans le verbe grec, dans la portée de l’issue redoutée.
- source_word: αὐτῷ ἐμπαίζειν
  choice: se moquer de lui
  rationale: ἐμπαίζω désigne la moquerie ou la dérision ; « se moquer de lui » est courant, clair et digne.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La phrase conserve la dépendance syntaxique envers le verset précédent et la nuance d’une conséquence redoutée.
