  terminology: « Les fondations » est idiomatique pour θεμέλιον dans un contexte de bâtiment. « Achever l’ouvrage » rend ἐκτελέσαι sans imposer un objet absent du grec; « se moquer de lui » convient à ἐμπαίζειν.
