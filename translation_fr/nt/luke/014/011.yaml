id: LUK.14.11
reference: Luke 14:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὅτι πᾶς ὁ ὑψῶν ἑαυτὸν ταπεινωθήσεται καὶ ὁ ταπεινῶν ἑαυτὸν ὑψωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/011.yaml
  text: For everyone who exalts himself will be humbled[b][a], and the one who humbles himself will be exalted.
translation:
  language: fr
  text: Car toute personne qui s’élève sera abaissée, et celle qui s’abaisse sera élevée.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: Car
  rationale: Dans le contexte, la conjonction introduit la raison de l’enseignement précédent. « Car » en conserve clairement la valeur explicative.
- source_word: πᾶς ὁ ὑψῶν ἑαυτὸν
  choice: toute personne qui s’élève elle-même
  rationale: Le participe présent substantivé a une portée générale. « Toute personne » exprime naturellement l’universalité sans restreindre le propos aux hommes, tandis que « s’élève elle-même » maintient le sens métaphorique et la valeur réfléchie.
- source_word: ταπεινωθήσεται
  choice: sera abaissée
  rationale: Le futur passif indique que la personne subira un abaissement. Ce choix préserve le passif et forme un contraste lexical net avec « sera élevée ».
- source_word: καὶ
  choice: et
  rationale: « Et » conserve la coordination grecque; l’antithèse ressort déjà du parallélisme des deux propositions.
- source_word: ὁ ταπεινῶν ἑαυτὸν
  choice: celle qui s’abaisse elle-même
  rationale: Le participe substantivé est générique et reprend la personne mentionnée dans la première proposition. La formulation conserve l’action volontaire et réfléchie.
- source_word: ὑψωθήσεται
  choice: sera élevée
  rationale: Le futur passif répond exactement à « sera abaissée » et laisse implicite l’auteur de l’élévation, comme en grec.
theological_decisions:
- issue: Agent implicite des futurs passifs
  choice: Conserver les passifs sans ajouter « par Dieu »
  alternative: « sera abaissée par Dieu » et « sera élevée par Dieu »
  rationale: Même si le contexte biblique peut suggérer l’action de Dieu, le grec ne nomme pas l’agent. La traduction ne rend donc pas explicite ce que le texte laisse implicite.
- issue: Masculin grammatical grec employé génériquement
  choice: Employer « toute personne », puis les reprises féminines grammaticales exigées par « personne »
  alternative: « quiconque s’élève lui-même »
  rationale: Les formes masculines singulières du grec ont ici une portée générique. En français moderne international, « toute personne » transmet cette portée universelle sans suggérer que le principe ne concernerait que les hommes.
translation_notes:
  register: Formulation proverbiale, équilibrée et digne. Le parallélisme « s’élève / sera abaissée » et « s’abaisse / sera élevée » reproduit l’antithèse du grec dans un français naturel et accessible.
