id: LUK.14.28
reference: Luke 14:28
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τίς γὰρ ἐξ ⸀ὑμῶν θέλων πύργον οἰκοδομῆσαι οὐχὶ πρῶτον καθίσας ψηφίζει τὴν δαπάνην, εἰ ⸀ἔχει εἰς ἀπαρτισμόν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/028.yaml
  text: For which of you[a], wanting to build a tower, does not first sit down and calculate the cost[b], whether he has enough to complete it?
translation:
  language: fr
  text: En effet, lequel d’entre vous, s’il veut construire une tour, ne s’assied pas d’abord pour calculer la dépense, afin de voir s’il a de quoi achever l’ouvrage ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τίς γὰρ ἐξ ὑμῶν
  choice: En effet, lequel d’entre vous
  rationale: La formule introduit une question rhétorique adressée directement à l’auditoire. « En effet » exprime naturellement le lien argumentatif marqué par γάρ.
- source_word: θέλων
  choice: s’il veut
  rationale: Cette tournure française naturelle rend l’intention exprimée par le participe présent sans alourdir la phrase.
- source_word: πύργον οἰκοδομῆσαι
  choice: construire une tour
  rationale: La traduction conserve directement l’image de la tour et le sens courant du verbe οἰκοδομέω.
- source_word: οὐχὶ πρῶτον καθίσας
  choice: ne commence par s’asseoir
  rationale: La question attend une réponse affirmative. La formulation rend aussi l’antériorité de l’action exprimée par le participe aoriste καθίσας.
- source_word: ψηφίζει τὴν δαπάνην
  choice: calculer la dépense
  rationale: ψηφίζω désigne ici l’action d’évaluer par calcul, tandis que δαπάνη désigne la dépense nécessaire au projet. « Calculer la dépense » reste proche du grec et naturel en français.
- source_word: εἰ ἔχει εἰς ἀπαρτισμόν
  choice: et voir s’il a de quoi l’achever
  rationale: Le grec dit littéralement qu’il vérifie s’il « a pour l’achèvement ». « Avoir de quoi » exprime sans précision excessive la suffisance des ressources impliquée par le contexte, et « l’achever » reprend naturellement la construction de la tour.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La question rhétorique et son lien avec l’enseignement précédent sont préservés. La formulation évite un calque maladroit tout en restant proche de la structure et des données lexicales grecques.
