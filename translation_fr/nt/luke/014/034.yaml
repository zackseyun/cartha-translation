id: LUK.14.34
reference: Luke 14:34
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καλὸν ⸀οὖν τὸ ἅλας· ἐὰν δὲ ⸀καὶ τὸ ἅλας μωρανθῇ, ἐν τίνι ἀρτυθήσεται;
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/034.yaml
  text: Salt[a], then, is good; but if even the salt becomes tasteless, with what will it be seasoned?
translation:
  language: fr
  text: Le sel est donc bon. Mais si même le sel s’affadit[a], avec quoi sera-t-il assaisonné ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe grec peut aussi signifier littéralement « devenir fou » ; à propos du sel, il signifie devenir fade ou perdre sa saveur.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καλὸν
  choice: bon
  rationale: « Bon » rend naturellement l’évaluation positive générale de καλός sans la limiter à l’utilité ni à la beauté.
- source_word: οὖν
  choice: donc
  rationale: « Donc » conserve le lien d’inférence avec l’enseignement qui précède.
- source_word: ἅλας
  choice: sel
  rationale: Le terme désigne littéralement le sel dans une formulation proverbiale ; la métaphore reste intacte.
- source_word: ἐὰν δὲ καὶ
  choice: mais si même
  rationale: 'Cette formulation garde à la fois le contraste de δέ et l’insistance de καί : même le sel, malgré sa propriété caractéristique, peut s’affadir.'
- source_word: μωρανθῇ
  choice: s’affadit
  rationale: Dans ce contexte, le verbe évoque le sel qui devient fade ou insipide. « S’affadit » est idiomatique en français et respecte la valeur inchoative de la forme verbale.
- source_word: ἐν τίνι
  choice: avec quoi
  rationale: Cette expression rend naturellement le moyen demandé dans la question rhétorique.
- source_word: ἀρτυθήσεται
  choice: sera-t-il assaisonné
  rationale: Le passif de ἀρτύω signifie ici « assaisonner ». Cette traduction préserve le langage culinaire et l’étrangeté voulue de l’image sans l’interpréter comme une restauration spirituelle.
theological_decisions:
- issue: Portée métaphorique de la parole sur le sel
  choice: Conserver littéralement le proverbe sans expliciter son application aux disciples.
  alternative: Développer le sens en parlant de disciples qui perdraient leur caractère distinctif ou leur utilité.
  rationale: Le contexte fournit l’application de l’image. La traduction doit préserver sa tension et ne pas imposer une interprétation doctrinale dans le texte.
translation_notes:
  register: Français international moderne, simple et digne. « S’affadit » est courant dans ce contexte, tandis que le passif « sera-t-il assaisonné » maintient au plus près la question paradoxale du grec.
