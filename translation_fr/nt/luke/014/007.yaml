review_pass:
  verdict: revise
  source_fidelity: 'Le sens essentiel est bien rendu : Jésus s’adresse aux personnes invitées, après/ tout en remarquant leur recherche des places les plus honorées. Toutefois, la séparation en deux phrases et la reprise de l’imparfait (« Il adressait… Il leur disait : ») ne rendent pas clairement la relation entre l’introduction de la parabole et les paroles qui suivent. Une formulation française unifiée rend mieux le participial λέγων et l’ouverture du discours direct.'
  naturalness: '« Il adressait une parabole… Il leur disait : » est peu idiomatique en français moderne : le second imparfait avant deux-points paraît suspendu, et la répétition crée une rupture artificielle. Une seule phrase avec un verbe narratif au passé simple est plus naturelle dans ce registre biblique.'
  terminology: « parabole », « invités » et « places d’honneur » sont appropriés. La note alternative est correctement ancrée sur le terme concerné. « Les places les plus prestigieuses lors d’un repas » explicite plus naturellement la réalité sociale de πρωτοκλισίας que « les places les plus honorifiques ».
  issues:
  - severity: medium
    issue: Construction française en deux phrases avec deux imparfaits
    rationale: 'La construction « Il adressait… . Il leur disait : » est maladroite et affaiblit le lien syntaxique entre ἔλεγεν, ἐπέχων et λέγων. Le grec introduit d’un seul mouvement la parabole et le discours qui suit.'
  - severity: low
    issue: Rendu de ἐπέχων par « voyant »
    rationale: « Voyant » est possible, mais « remarquant » rend plus précisément l’attention portée à leur comportement, sans surinterpréter.
  revised_text: 'Il adressa aux invités cette parabole, remarquant comment ils choisissaient les places d’honneur[a] :'
  revised_footnotes:
  - marker: a
    text: Ou « les premières places ». Le grec désigne les places les plus prestigieuses lors d’un repas.
    reason: lexical_alternative
  revision_rationale: La révision réunit l’introduction et l’annonce des paroles directes en une phrase française fluide. « Remarquant » rend l’observation attentive exprimée par ἐπέχων. Le passé simple narratif est idiomatique ici et évite l’effet inachevé produit par les deux imparfaits du projet, sans modifier le sens de la scène.
