revisions:
- from: 'Il adressait une parabole aux invités, voyant comment ils choisissaient les places d’honneur[a]. Il leur disait :'
  to: 'Il adressa aux invités cette parabole, remarquant comment ils choisissaient les places d’honneur[a] :'
  rationale: La révision réunit l’introduction et l’annonce des paroles directes en une phrase française fluide. « Remarquant » rend l’observation attentive exprimée par ἐπέχων. Le passé simple narratif est idiomatique ici et évite l’effet inachevé produit par les deux imparfaits du projet, sans modifier le sens de la scène.
  reviewer_model: gpt-5.6-terra
