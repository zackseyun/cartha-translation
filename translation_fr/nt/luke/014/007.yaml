id: LUK.14.7
reference: Luke 14:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἔλεγεν δὲ πρὸς τοὺς κεκλημένους παραβολήν, ἐπέχων πῶς τὰς πρωτοκλισίας ἐξελέγοντο, λέγων πρὸς αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/007.yaml
  text: 'He was telling a parable to those who had been invited[a], noticing how they were choosing the places of honor, saying to them:'
translation:
  language: fr
  text: 'Il adressa aux invités cette parabole, remarquant comment ils choisissaient les places d’honneur[a] :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les premières places ». Le grec désigne les places les plus prestigieuses lors d’un repas.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔλεγεν
  choice: Il adressait
  rationale: L’imparfait grec présente une action en cours ou sert de mise en scène. Avec « une parabole », « adressait » est naturel en français et évite le moins idiomatique « racontait à l’intention de ».
- source_word: δὲ
  choice: non exprimé séparément
  rationale: Cette particule assure ici une transition légère. Le français enchaîne naturellement sans ajouter un « maintenant » temporel ou un contraste absent du contexte.
- source_word: τοὺς κεκλημένους
  choice: aux invités
  rationale: Le participe parfait désigne ceux qui se trouvent dans la situation d’avoir été invités. En contexte de repas, « les invités » exprime ce sens avec concision et naturel.
- source_word: παραβολήν
  choice: une parabole
  rationale: « Parabole » conserve le terme caractéristique des Évangiles et la manière dont Luc classe l’enseignement qui suit.
- source_word: ἐπέχων
  choice: voyant
  rationale: Le participe indique l’observation attentive qui motive la parabole. « Voyant » reste fluide tout en préservant le lien circonstanciel avec le verbe principal.
- source_word: πῶς
  choice: comment
  rationale: Le mot introduit la manière dont les invités agissaient; « comment » en est l’équivalent direct.
- source_word: πρωτοκλισίας
  choice: les places d’honneur
  rationale: Le terme désigne les emplacements les plus prestigieux lors d’un repas. « Places d’honneur » rend clairement leur importance sociale pour le lectorat actuel.
- source_word: ἐξελέγοντο
  choice: ils choisissaient
  rationale: L’imparfait moyen évoque une action en cours ou répétée, avec une nuance d’intérêt personnel que le contexte français laisse comprendre sans ajouter lourdement « pour eux-mêmes ».
- source_word: λέγων πρὸς αὐτούς
  choice: Il leur disait
  rationale: La reprise en une phrase française distincte introduit clairement les paroles directes à venir, tandis que l’imparfait maintient la valeur narrative du passage.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. La construction grecque à participes est légèrement réorganisée en deux phrases pour éviter une phrase française pesante, sans modifier les relations de sens. Le marqueur de note est placé après « places d’honneur », expression à laquelle la variante se rapporte.
