id: LUK.14.33
reference: Luke 14:33
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὕτως οὖν πᾶς ἐξ ὑμῶν ὃς οὐκ ἀποτάσσεται πᾶσιν τοῖς ἑαυτοῦ ὑπάρχουσιν οὐ δύναται ⸂εἶναί μου⸃ μαθητής.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/033.yaml
  text: So then[b][a], every one of you who does not renounce all his own possessions cannot be my disciple.
translation:
  language: fr
  text: Ainsi donc, quiconque parmi vous ne renonce pas à tous ses biens[a] ne peut pas être mon disciple.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « ne dit pas adieu à tout ce qui lui appartient » ou « n’abandonne pas tout ce qu’il possède ». Le verbe grec exprime l’idée de prendre congé ou de renoncer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως οὖν
  choice: Ainsi donc
  rationale: Cette expression conserve à la fois la manière indiquée par οὕτως et la valeur conclusive de οὖν, en reliant cette parole aux exemples précédents.
- source_word: πᾶς ἐξ ὑμῶν
  choice: quiconque parmi vous
  rationale: 'Cette formulation française naturelle garde la portée distributive et personnelle de l’expression grecque : l’exigence concerne chaque auditeur.'
- source_word: ὃς οὐκ ἀποτάσσεται
  choice: ne renonce pas à
  rationale: Dans ce contexte, ἀποτάσσομαι évoque le fait de prendre congé, de dire adieu ou de renoncer. « Renoncer à » exprime une rupture décisive sans préciser à tort toutes ses modalités concrètes.
- source_word: πᾶσιν τοῖς ἑαυτοῦ ὑπάρχουσιν
  choice: à tous ses biens
  rationale: L’expression désigne ce qui appartient à une personne, notamment ses biens ou possessions. « Tous ses biens » est précis, naturel et conserve la totalité exprimée par πᾶσιν.
- source_word: οὐ δύναται εἶναί μου μαθητής
  choice: ne peut pas être mon disciple
  rationale: La traduction garde la force d’impossibilité de οὐ δύναται et emploie la formulation française directe et habituelle.
- source_word: μαθητής
  choice: disciple
  rationale: « Disciple » conserve les dimensions d’apprentissage, d’attachement et de suite personnelle propres au terme dans les Évangiles.
theological_decisions:
- issue: Nature de l’exigence concernant les biens
  choice: Traduire par « renonce à tous ses biens » sans préciser si cela exige dans chaque cas une cession matérielle totale.
  alternative: « abandonne tout ce qu’il possède » ou « se défait de tous ses biens »
  rationale: Le verbe peut évoquer le fait de dire adieu et, dans ce contexte, une renonciation radicale à ses droits ou à son attachement. La formulation retenue préserve la sévérité de la parole et son ambiguïté quant aux modalités concrètes, sans imposer une interprétation économique particulière.
translation_notes:
  register: Français international moderne, sobre et digne. « Quiconque parmi vous » évite une lourdeur genrée tout en conservant la portée individuelle du grec. La phrase reste concise et radicale, conformément au ton de l’enseignement.
