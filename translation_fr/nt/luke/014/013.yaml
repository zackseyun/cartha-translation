id: LUK.14.13
reference: Luke 14:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀλλ’ ὅταν ⸂δοχὴν ποιῇς⸃, κάλει πτωχούς, ἀναπείρους, χωλούς, τυφλούς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/013.yaml
  text: But whenever you give a banquet[a], invite the poor, the crippled, the lame[b], the blind.
translation:
  language: fr
  text: Mais, chaque fois que tu donnes un banquet[a], invite des pauvres, des personnes handicapées[b], des boiteux et des aveugles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un festin » ou « une réception ».
    reason: lexical_alternative
  - marker: b
    text: Le terme grec désigne des personnes atteintes d’un handicap physique; on peut aussi traduire, plus traditionnellement, « des estropiés ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: Mais
  rationale: Marque naturellement le contraste avec l’instruction précédente concernant les personnes à ne pas inviter.
- source_word: ὅταν
  choice: chaque fois que
  rationale: Rend la valeur temporelle indéfinie et répétitive de ὅταν avec le subjonctif, plutôt qu’une occasion unique.
- source_word: δοχὴν ποιῇς
  choice: tu donnes un banquet
  rationale: Expression française idiomatique pour l’action d’organiser et d’offrir un repas de réception; elle conserve la portée plus large qu’un simple dîner.
- source_word: κάλει
  choice: invite
  rationale: Dans le contexte d’un repas, καλέω désigne clairement l’action d’inviter.
- source_word: πτωχούς
  choice: des pauvres
  rationale: Rend de manière concise l’adjectif substantivé désignant les personnes pauvres.
- source_word: ἀναπείρους
  choice: des personnes handicapées
  rationale: Formulation moderne et respectueuse pour des personnes atteintes d’un handicap physique, sans imposer l’idée plus étroite d’une mutilation.
- source_word: χωλούς
  choice: des boiteux
  rationale: Désigne spécifiquement les personnes dont la marche est déficiente et maintient la distinction lexicale avec ἀναπείρους.
- source_word: τυφλούς
  choice: des aveugles
  rationale: Équivalent français direct, concis et courant de l’adjectif substantivé.
theological_decisions:
- issue: Formulation moderne des catégories liées au handicap
  choice: Conserver les quatre groupes de la liste grecque tout en employant « personnes handicapées » pour ἀναπείρους.
  alternative: Employer « estropiés » ou reformuler toute la liste avec des expressions centrées sur la personne.
  rationale: La parole porte sur l’accueil de personnes socialement marginalisées. La traduction maintient la structure et les distinctions du texte sans recourir, dans le corps du verset, à un terme aujourd’hui souvent perçu comme dépréciatif. Le caractère général de ἀναπείρους et la catégorie plus précise de χωλούς restent distincts.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement suit l’adresse grecque au singulier. « Chaque fois que » explicite la valeur indéfinie de la construction grecque; la liste demeure concise tout en évitant un vocabulaire inutilement stigmatisant.
