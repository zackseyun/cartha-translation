  text: καὶ ἕτερος εἶπεν· Ζεύγη βοῶν ἠγόρασα πέντε καὶ πορεύομαι δοκιμάσαι αὐτά· ἐρωτῶ σε, ἔχε με παρῃτημένον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/019.yaml
  text: And another said[a], ‘I have bought five yoke of oxen, and I am going to test them. I ask you[b], consider me excused.’
translation:
  language: fr
  text: 'Un autre dit : « J’ai acheté cinq paires de bœufs et je vais les essayer. Je t’en prie, tiens-moi pour excusé. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἕτερος
  choice: un autre
  rationale: Dans la succession des invités qui présentent leurs excuses, cette expression désigne naturellement une autre personne.
- source_word: Ζεύγη βοῶν ... πέντε
  choice: cinq paires de bœufs
  rationale: ζεῦγος désigne ici une paire de bœufs attelés ensemble. « Cinq paires de bœufs » restitue clairement l’image agricole en français courant.
- source_word: ἠγόρασα
  choice: j’ai acheté
  rationale: Le passé composé exprime naturellement en français un achat accompli dont les conséquences sont immédiates.
- source_word: πορεύομαι
  choice: je vais
  rationale: Dans ce contexte, le présent indique un déplacement ou un projet immédiat.
- source_word: δοκιμάσαι
  choice: les essayer
  rationale: Il s’agit de mettre à l’épreuve les bœufs nouvellement achetés pour apprécier leur aptitude au travail ; « essayer » est naturel en français.
- source_word: ἐρωτῶ σε
  choice: je t’en prie
  rationale: La formule introduit une demande polie et pressante ; « je t’en prie » convient mieux à cet emploi que le littéral « je te demande ».
- source_word: ἔχε με παρῃτημένον
  choice: tiens-moi pour excusé
  rationale: Cette formulation conserve l’idée de considérer la personne comme étant déjà excusée, tout en restant idiomatique et digne.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement correspond au singulier σε et au dialogue direct. La formulation conserve le caractère abrupt et peu convaincant de l’excuse sans l’expliciter.
