  yaml_path: translation/nt/luke/014/006.yaml
  text: And they were not able to reply to these things[a].
translation:
  language: fr
  text: Et ils ne purent répondre à cela[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Litt. « à ces choses » ; ou « en réponse à ces choses ». Le grec emploie une expression au pluriel.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Et
  rationale: Conjonction simple qui maintient le lien avec l’échange précédent sans ajouter une nuance temporelle ou logique absente du grec.
- source_word: οὐκ ἴσχυσαν
  choice: ils ne purent
  rationale: Dans ce contexte, ἰσχύω exprime la capacité plutôt que la force physique. Le passé simple rend naturellement l’aoriste dans ce récit.
- source_word: ἀνταποκριθῆναι
  choice: répondre
  rationale: Le verbe désigne ici le fait de donner une réponse en retour. « Répondre » conserve ce sens sans suggérer à tort une réplique insolente.
- source_word: πρὸς ταῦτα
  choice: à cela
  rationale: Cette formulation est idiomatique en français moderne. Une note signale que le grec emploie littéralement un démonstratif pluriel, afin de préserver cette donnée sans produire un français artificiel.
