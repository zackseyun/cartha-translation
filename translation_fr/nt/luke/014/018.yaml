id: LUK.14.18
reference: Luke 14:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἤρξαντο ἀπὸ μιᾶς ⸂πάντες παραιτεῖσθαι⸃. ὁ πρῶτος εἶπεν αὐτῷ· Ἀγρὸν ἠγόρασα καὶ ἔχω ἀνάγκην ⸀ἐξελθὼν ἰδεῖν αὐτόν· ἐρωτῶ σε, ἔχε με παρῃτημένον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/018.yaml
  text: But they all alike began to excuse themselves[a]. The first said to him, ‘I have bought a field, and I need to go out and see it. I ask you[b], consider me excused.’
translation:
  language: fr
  text: 'Mais tous, d’un commun accord[a], se mirent à décliner l’invitation[b]. Le premier lui dit : « J’ai acheté un champ et il faut que j’aille le voir. Je t’en prie, tiens-moi pour excusé. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « à partir d’un seul » ; expression idiomatique pouvant signifier « tous ensemble » ou « d’un même mouvement ».
    reason: lexical_alternative
  - marker: b
    text: Ou « à présenter des excuses ». Le verbe grec peut désigner le fait de décliner une invitation en donnant une excuse.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Mais
  rationale: La conjonction relie ce verset à l’invitation précédente tout en marquant ici le contraste entre l’invitation et le refus général.
- source_word: ἤρξαντο ... παραιτεῖσθαι
  choice: se mirent à décliner l’invitation
  rationale: La construction exprime le commencement d’un refus. « Décliner l’invitation » rend clairement le sens contextuel du moyen παραιτεῖσθαι, tandis que la note conserve l’autre nuance possible, celle de présenter des excuses.
- source_word: ἀπὸ μιᾶς
  choice: d’un commun accord
  rationale: Cette locution idiomatique souligne que tous adoptent la même attitude. La note signale sa forme grecque inhabituelle sans la traduire littéralement dans le corps du texte.
- source_word: πάντες
  choice: tous
  rationale: Rend explicitement l’universalité de la réaction.
- source_word: Ἀγρόν
  choice: un champ
  rationale: Rendu direct de ἀγρός, sans ajouter l’idée plus précise d’une ferme ou d’une exploitation.
- source_word: ἠγόρασα
  choice: J’ai acheté
  rationale: Le passé composé est naturel en français et présente l’achat accompli comme pertinent pour la situation actuelle.
- source_word: ἔχω ἀνάγκην
  choice: il faut que
  rationale: Cette tournure française exprime naturellement la nécessité affirmée par l’invité.
- source_word: ἐξελθὼν ἰδεῖν αὐτόν
  choice: j’aille le voir
  rationale: Rend naturellement le déplacement suivi de la visite du terrain. Le verbe « inspecter » préciserait davantage que ne le fait nécessairement ἰδεῖν.
- source_word: ἐρωτῶ σε
  choice: Je t’en prie
  rationale: Formule française courante qui conserve la demande explicite et polie adressée à l’hôte.
- source_word: ἔχε με παρῃτημένον
  choice: tiens-moi pour excusé
  rationale: 'Cette expression garde l’idée du résultat exprimé par le participe parfait : le locuteur demande à être considéré comme ayant valablement décliné l’invitation.'
- source_word: ὁ πρῶτος
  choice: Le premier
  rationale: Rendu direct de l’ordinal substantivé, qui introduit la première excuse de la série.
theological_decisions: []
