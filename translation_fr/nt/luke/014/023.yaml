reference: Luke 14:23
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ εἶπεν ὁ κύριος πρὸς τὸν δοῦλον· Ἔξελθε εἰς τὰς ὁδοὺς καὶ φραγμοὺς καὶ ἀνάγκασον εἰσελθεῖν, ἵνα γεμισθῇ ⸂μου ὁ οἶκος⸃·
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/023.yaml
  text: And the master said to the servant[a], ‘Go out into the roads and hedges, and compel them to come in, so that my house may be filled.’
translation:
  language: fr
  text: 'Le maître dit à l’esclave : « Sors et va sur les chemins et le long des haies ; contrains les gens à entrer[a], afin que ma maison soit remplie. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « presse-les vivement d’entrer ». Le verbe grec est fort (« contraindre, presser »), mais, dans cette parabole, il n’implique pas nécessairement l’emploi de la force physique.
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος
  choice: le maître
  rationale: Dans le cadre de la parabole, le mot désigne le maître de maison, sans fonctionner nécessairement ici comme un titre divin.
- source_word: δοῦλον
  choice: l’esclave
  rationale: Ce choix conserve le statut de dépendance exprimé par δοῦλος, que « serviteur » pourrait atténuer.
- source_word: Ἔξελθε
  choice: Sors et va
  rationale: Cette formulation française naturelle conserve explicitement le mouvement vers l’extérieur et introduit correctement les lieux qui suivent.
- source_word: ὁδοὺς
  choice: les chemins
  rationale: « Chemins » évoque naturellement les voies situées hors du lieu du banquet et s’accorde bien avec l’image des haies.
- source_word: φραγμοὺς
  choice: le long des haies
  rationale: φραγμός peut désigner une haie ou une clôture. La tournure locative « le long des haies » rend en français le lieu où chercher les invités.
- source_word: ἀνάγκασον
  choice: contrains
  rationale: Le verbe grec est fort et peut signifier contraindre ou presser fortement. Le texte principal en conserve la vigueur, tandis que la note prévient une lecture automatiquement violente.
- source_word: εἰσελθεῖν
  choice: à entrer
  rationale: Traduction directe et idiomatique de l’infinitif après « contrains ».
- source_word: ἵνα γεμισθῇ
  choice: afin que … soit remplie
  rationale: La tournure exprime clairement le but de l’ordre tout en conservant la voix passive du grec.
- source_word: μου ὁ οἶκος
  choice: ma maison
  rationale: Dans le contexte du banquet, οἶκος désigne la maison comme lieu à remplir, plutôt que la maisonnée.
theological_decisions:
- issue: Traduction de κύριος dans une parabole
  choice: le maître
  alternative: le Seigneur
  rationale: Dans le monde narratif de la parabole, κύριος désigne le maître de l’esclave et de la maison. « Maître » respecte ce rôle sans imposer dans ce verset un titre christologique explicite.
- issue: Force de ἀνάγκασον
  choice: contrains les gens à entrer
  alternative: presse-les vivement d’entrer
  rationale: « Contrains » préserve la force et la tension du grec. La note signale toutefois que, dans cette parabole, le terme ne suppose pas nécessairement l’emploi de la force physique.
translation_notes:
  register: Français international moderne, naturel et digne. « L’esclave » conserve sans euphémisme la réalité sociale du terme grec. L’expression « les gens » explicite en français l’objet sous-entendu de ἀνάγκασον sans préciser leur identité.
