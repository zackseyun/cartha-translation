source:
  edition: SBLGNT
  text: καὶ παραγενόμενος ὁ ⸀δοῦλος ἀπήγγειλεν τῷ κυρίῳ αὐτοῦ ταῦτα. τότε ὀργισθεὶς ὁ οἰκοδεσπότης εἶπεν τῷ δούλῳ αὐτοῦ· Ἔξελθε ταχέως εἰς τὰς πλατείας καὶ ῥύμας τῆς πόλεως, καὶ τοὺς πτωχοὺς καὶ ἀναπείρους καὶ ⸂τυφλοὺς καὶ χωλοὺς⸃ εἰσάγαγε ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/021.yaml
  text: And when the servant came back[a], he reported these things to his lord. Then the master of the house, becoming angry, said to his servant, ‘Go out quickly into the broad streets and lanes of the city[b], and bring in here the poor and disabled and blind and lame.’
translation:
  language: fr
  text: 'À son retour, le serviteur[a] rapporta tout cela à son maître. Alors, en colère, le maître de maison dit à son serviteur : « Va vite dans les grandes rues et les ruelles de la ville, et fais entrer ici les pauvres, les personnes handicapées[b], les aveugles et les boiteux. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec peut aussi se traduire par « esclave ».
    reason: lexical_alternative
  - marker: b
    text: Ou « estropiés » ; le terme peut aussi évoquer des personnes mutilées.
    reason: lexical_alternative
lexical_decisions:
- source_word: παραγενόμενος
  choice: À son retour
  rationale: Dans la suite du récit, le serviteur revient rendre compte de sa mission. Cette formulation naturelle explicite sobrement le mouvement de retour impliqué par le contexte.
- source_word: δοῦλος
  choice: serviteur
  rationale: Dans cette parabole, le rôle domestique et la relation au maître sont au premier plan. « Serviteur » est naturel en français moderne, tout en laissant « esclave » comme possibilité lexicale générale.
- source_word: ἀπήγγειλεν
  choice: rapporta
  rationale: Le verbe désigne ici le fait de transmettre à son supérieur les réponses précédemment reçues.
- source_word: κύριος
  choice: maître
  rationale: Le référent est le supérieur humain du serviteur, non un titre divin. « Maître » exprime clairement cette relation en français.
- source_word: ὀργισθεὶς
  choice: en colère
  rationale: La tournure indique la réaction du maître avant sa prise de parole, sans amplifier sa colère au-delà du grec.
- source_word: οἰκοδεσπότης
  choice: maître de maison
  rationale: Cette expression rend la fonction de chef ou maître du foyer et demeure distincte, dans sa forme complète, du simple « maître » employé pour κύριος.
- source_word: ταχέως
  choice: vite
  rationale: Formulation directe et idiomatique qui conserve l'urgence de l'ordre.
- source_word: πλατείας
  choice: grandes rues
  rationale: Le terme désigne des voies larges ou des espaces publics ouverts; « grandes rues » marque le contraste avec les ruelles.
- source_word: ῥύμας
  choice: ruelles
  rationale: Le mot désigne des voies plus étroites; « ruelles » restitue clairement le contraste urbain.
- source_word: ἀναπείρους
  choice: infirmes
  rationale: Le terme désigne des personnes atteintes dans leur intégrité physique, possiblement estropiées ou mutilées. « Infirmes » reste compréhensible, digne et suffisamment large.
- source_word: εἰσάγαγε
  choice: fais entrer
  rationale: Le causatif naturel en français exprime l'ordre de conduire ces personnes à l'intérieur, sans suggérer nécessairement la contrainte.
theological_decisions:
- issue: Statut social exprimé par δοῦλος
  choice: serviteur
  alternative: esclave
  rationale: Le grec peut indiquer un esclave, mais la fonction d'émissaire domestique domine ici. « Serviteur » évite de surcharger la parabole d'une précision sociale que le contexte ne développe pas, tout en conservant le rapport d'autorité.
- issue: κύριος appliqué à un supérieur humain
  choice: maître
  alternative: seigneur
  rationale: Le personnage est le supérieur humain du serviteur dans la parabole. « Maître » évite une lecture directement divine du titre et convient au contexte domestique.
- issue: Portée de ἀνάπηρος
  choice: infirmes
  alternative: estropiés / mutilés
  rationale: Le mot peut évoquer une déficience physique grave ou une mutilation. La traduction retient un terme collectif digne et lisible, tandis qu'une note conserve la nuance plus concrète possible.
translation_notes:
  register: Français international moderne, narratif et digne. Les phrases restent directes et orales dans la citation. « Grandes rues » et « ruelles » préservent le contraste spatial; les désignations des groupes suivent la structure coordonnée du grec.
