source:
  edition: SBLGNT
  text: εἰ δὲ μήγε, ἔτι ⸂αὐτοῦ πόρρω⸃ ὄντος πρεσβείαν ἀποστείλας ἐρωτᾷ ⸀τὰ πρὸς εἰρήνην.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/032.yaml
  text: But if not[a], while the other is still far away[b], he sends a delegation and asks for terms of peace.
translation:
  language: fr
  text: Sinon, tandis que l’autre est encore loin, il envoie une délégation et demande les conditions de paix.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les choses qui concernent la paix » ; c’est-à-dire ce qui permettrait d’établir la paix.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ μήγε
  choice: Sinon
  rationale: Cette tournure adversative et conditionnelle renvoie à l’impossibilité envisagée au verset précédent. « Sinon » est naturel en français et conserve le lien logique.
- source_word: ἔτι αὐτοῦ πόρρω ὄντος
  choice: tandis que l’autre est encore loin
  rationale: Le génitif absolu exprime une circonstance simultanée. « L’autre » identifie sans ambiguïté excessive le roi adverse, et « encore loin » rend directement πόρρω.
- source_word: πρεσβείαν
  choice: une délégation
  rationale: Le terme désigne ici un groupe d’émissaires chargé d’une mission diplomatique. « Délégation » est actuel, clair et adapté au contexte.
- source_word: ἀποστείλας
  choice: il envoie
  rationale: Le participe aoriste est rendu par un verbe coordonné, formulation française naturelle qui préserve la succession entre l’envoi et la demande.
- source_word: ἐρωτᾷ
  choice: demande
  rationale: Dans ce contexte diplomatique, le verbe signifie demander ou solliciter, plutôt que simplement interroger.
- source_word: τὰ πρὸς εἰρήνην
  choice: les conditions de paix
  rationale: L’expression signifie littéralement « les choses qui concernent ou conduisent à la paix ». « Les conditions de paix » en exprime clairement le sens dans ce cadre politico-militaire.
