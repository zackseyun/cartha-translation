  text: καὶ ἀπέστειλεν τὸν δοῦλον αὐτοῦ τῇ ὥρᾳ τοῦ δείπνου εἰπεῖν τοῖς κεκλημένοις· Ἔρχεσθε, ὅτι ἤδη ἕτοιμά ⸀ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/017.yaml
  text: And at the hour of the dinner he sent his servant to say to those who had been invited[a], ‘Come, because it is already ready.’
translation:
  language: fr
  text: 'À l’heure du repas, il envoya son serviteur dire à ceux qui avaient été invités : « Venez, car tout est déjà prêt. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: il envoya
  rationale: L’aoriste de ἀποστέλλω désigne simplement l’envoi du serviteur; « envoya » est naturel et précis.
- source_word: δοῦλον
  choice: son serviteur
  rationale: Dans cette scène domestique, le personnage remplit la fonction de serviteur et de messager. « Esclave » exprimerait plus explicitement son statut social, mais risquerait de mettre ici l’accent sur un élément qui n’est pas central dans le récit.
- source_word: τῇ ὥρᾳ τοῦ δείπνου
  choice: À l’heure du repas
  rationale: Cette formulation conserve l’idée grecque du moment fixé pour le δείπνον, tout en employant « repas », terme courant et suffisamment large en français moderne.
- source_word: εἰπεῖν τοῖς κεκλημένοις
  choice: dire aux invités
  rationale: Le parfait passif κεκλημένοις désigne ceux qui ont déjà reçu l’invitation. En français, « les invités » rend naturellement ce fait dans le contexte, sans alourdir la phrase.
- source_word: Ἔρχεσθε
  choice: Venez
  rationale: L’impératif présent constitue ici un appel direct; « Venez » en restitue simplement la force.
- source_word: ὅτι
  choice: car
  rationale: ὅτι introduit la raison de l’appel. « Car » convient naturellement après un impératif dans ce registre narratif digne.
- source_word: ἤδη ἕτοιμά ἐστιν
  choice: tout est maintenant prêt
  rationale: Le neutre pluriel ἕτοιμά avec le verbe au singulier a une valeur collective et laisse son référent implicite. « Tout est maintenant prêt » reproduit cette portée collective de façon idiomatique; « maintenant » exprime qu’au moment annoncé les préparatifs sont achevés.
theological_decisions: []
translation_notes:
  register: 'Français international moderne, fluide et digne. La formulation privilégie une équivalence optimale : elle conserve « à l’heure » et la portée collective de ἕτοιμά, tout en évitant le calque peu naturel « cela est déjà prêt ».'
