id: LUK.14.3
reference: Luke 14:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν πρὸς τοὺς νομικοὺς καὶ Φαρισαίους λέγων· ⸀Ἔξεστιν τῷ σαββάτῳ ⸂θεραπεῦσαι ἢ οὔ⸃;
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/003.yaml
  text: And Jesus answered and said to the lawyers and Pharisees[a], “Is it lawful to heal on the Sabbath, or not?”
translation:
  language: fr
  text: 'Jésus répondit aux spécialistes de la Loi[a] et aux pharisiens : « Est-il permis de guérir le jour du sabbat, ou non ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « docteurs de la Loi ». Le terme grec désigne des spécialistes de la Loi juive.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς … εἶπεν
  choice: prit la parole et dit
  rationale: La double formule grecque introduit la réponse de Jésus à la situation, même si aucune question explicite ne précède. « Prit la parole et dit » est une tournure française naturelle qui conserve les deux éléments sans suggérer nécessairement une réponse verbale.
- source_word: νομικοὺς
  choice: spécialistes de la Loi
  rationale: Le terme désigne ici des spécialistes de la Loi juive, et non des juristes au sens civil moderne. La majuscule à « Loi » signale la Torah dans ce contexte.
- source_word: Φαρισαίους
  choice: pharisiens
  rationale: Désignation française courante de ce groupe religieux juif.
- source_word: Ἔξεστιν
  choice: Est-il permis
  rationale: Cette formulation exprime clairement ce qui est autorisé au regard de la Loi, tout en restant naturelle en français moderne.
- source_word: τῷ σαββάτῳ
  choice: le jour du sabbat
  rationale: Le datif a une valeur temporelle. « Le jour du sabbat » est idiomatique et explicite en français.
- source_word: θεραπεῦσαι
  choice: de guérir
  rationale: Dans les récits évangéliques, le verbe désigne normalement l'action de rendre la santé.
- source_word: ἢ οὔ
  choice: ou non ?
  rationale: Rendu direct et naturel de la fin alternative de la question.
theological_decisions:
- issue: Formulation de la question relative à la Loi du sabbat
  choice: Est-il permis de guérir le jour du sabbat, ou non ?
  alternative: Est-il conforme à la Loi de guérir le jour du sabbat, ou non ?
  rationale: « Est-il permis » préserve la portée juridique et religieuse de la question sans anticiper la réponse de Jésus ni introduire d'explication sur la miséricorde, la nécessité ou son autorité.
translation_notes:
  register: Français international moderne, clair et digne. « Spécialistes de la Loi » évite le contresens moderne de « avocats »; la variante traditionnelle « docteurs de la Loi » est conservée en note.
