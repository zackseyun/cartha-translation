  text: οἱ δὲ ἡσύχασαν. καὶ ἐπιλαβόμενος ἰάσατο αὐτὸν καὶ ἀπέλυσεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/004.yaml
  text: But they kept silent[a]. And taking hold of him[b], he healed him and sent him away.
translation:
  language: fr
  text: Mais ils gardèrent le silence[a]. Alors Jésus saisit cet homme[b], le guérit et le laissa partir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « restèrent silencieux » ou « ne répondirent rien ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « l’ayant saisi » ou « l’ayant pris ».
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: Mais ils
  rationale: Le pronom substantivé renvoie aux interlocuteurs mentionnés auparavant, et δέ marque ici un léger contraste avec la question de Jésus.
- source_word: ἡσύχασαν
  choice: gardèrent le silence
  rationale: Dans ce contexte, le verbe indique qu’ils s’abstinrent de répondre. Cette formulation française naturelle rend leur absence de réponse.
- source_word: ἐπιλαβόμενος
  choice: saisit cet homme
  rationale: Le participe exprime une prise physique. « Saisit » en conserve la force sans préciser indûment le geste; « cet homme » clarifie le référent naturel du pronom grec.
- source_word: ἰάσατο
  choice: le guérit
  rationale: ἰάομαι désigne ici sans ambiguïté la guérison physique de l’homme malade.
- source_word: αὐτὸν
  choice: cet homme / le
  rationale: Le pronom masculin singulier renvoie à l’homme malade mentionné dans le contexte; le français emploie d’abord un groupe nominal clarifiant, puis le pronom objet.
- source_word: ἀπέλυσεν
  choice: le laissa partir
  rationale: ἀπολύω peut signifier relâcher, congédier ou laisser partir. Ici, « le laissa partir » est idiomatique et n’évoque pas à tort une détention préalable.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. « Alors » rend naturellement la progression du second καί sans alourdir la coordination. La reprise explicite « Jésus » évite une succession de pronoms potentiellement confuse en français.
