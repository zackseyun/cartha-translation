  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ἄνθρωπός τις ἦν ὑδρωπικὸς ἔμπροσθεν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/002.yaml
  text: And behold[a], a certain man with dropsy was before him.
translation:
  language: fr
  text: Et voici qu’un homme atteint d’œdème[a] se trouvait devant lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec désigne une personne atteinte d’une accumulation anormale de liquide dans les tissus; « hydropisie » est le terme traditionnel pour cette affection.
    reason: lexical_clarification
lexical_decisions:
- source_word: καὶ
  choice: Et
  rationale: Conjonction narrative simple qui maintient le lien avec le contexte sans ajouter une nuance temporelle.
- source_word: ἰδοὺ
  choice: voici que
  rationale: Formule française naturelle qui conserve la fonction d’attirer l’attention et la vivacité narrative de ἰδοὺ.
- source_word: ἄνθρωπός τις
  choice: un homme
  rationale: En français actuel, « un homme » introduit naturellement un individu précis mais non nommé; « un certain homme » serait plus lourd et pourrait suggérer une nuance absente du contexte.
- source_word: ἦν
  choice: se trouvait
  rationale: Avec le complément de lieu « devant lui », cette formulation rend naturellement l’imparfait de εἰμί sans transformer la proposition en simple constat d’existence.
- source_word: ὑδρωπικὸς
  choice: atteint d’hydropisie
  rationale: Le terme désigne une personne souffrant d’une accumulation pathologique de liquide. « Hydropisie » est le terme français précis correspondant, tandis que la note en donne une explication moderne.
- source_word: ἔμπροσθεν αὐτοῦ
  choice: devant lui
  rationale: Conserve d’abord le sens spatial de la locution tout en permettant, selon le contexte, l’idée plus générale d’être en sa présence.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et narratif. « Voici que » préserve l’effet d’attention sans l’archaïsme de « voici ». Le terme médical ancien « hydropisie » est maintenu dans le texte pour sa correspondance précise avec le grec, puis éclairé en note par « œdème ».
