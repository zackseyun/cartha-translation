  text: ὁ δὲ εἶπεν αὐτῷ· Ἄνθρωπός τις ⸀ἐποίει δεῖπνον μέγα, καὶ ἐκάλεσεν πολλούς,
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/016.yaml
  text: But he said to him[a], “A certain man was making a great dinner and invited many,”
translation:
  language: fr
  text: 'Mais il lui dit : « Un homme préparait un grand repas[a] et invita beaucoup de monde. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un grand banquet ». Le mot grec désigne le repas principal, souvent pris le soir ; le contexte évoque un repas solennel offert à de nombreux invités.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ εἶπεν αὐτῷ
  choice: Mais il lui répondit
  rationale: δέ marque ici une transition légèrement contrastive avec la parole précédente. Dans ce contexte dialogué, « répondit » rend naturellement εἶπεν sans modifier le sens.
- source_word: Ἄνθρωπός τις
  choice: Un homme
  rationale: En français narratif, « un homme » exprime naturellement l’indéfini τις ; « un certain homme » serait plus lourd et pourrait suggérer qu’il s’agit d’une personne connue.
- source_word: ἐποίει
  choice: préparait
  rationale: L’imparfait grec présente l’action en cours. Pour un repas, « préparait » est idiomatique et conserve l’aspect imperfectif sans le calque peu naturel « faisait ».
- source_word: δεῖπνον μέγα
  choice: un grand repas
  rationale: δεῖπνον désigne le repas principal, souvent celui du soir, tandis que μέγα en souligne l’importance ou l’ampleur. « Grand repas » reste proche du grec et convient au contexte d’une réception.
- source_word: καὶ ἐκάλεσεν πολλούς
  choice: et invita beaucoup de monde
  rationale: Dans le contexte d’un repas offert, καλέω signifie « inviter ». « Beaucoup de monde » rend naturellement le pluriel substantivé πολλούς en français.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Le récit parabolique reste sobre ; l’imparfait « préparait » conserve l’action en cours, suivi du passé simple « invita » pour l’action ponctuelle.
