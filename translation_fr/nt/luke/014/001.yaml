review_pass:
  verdict: revise
  source_fidelity: La traduction rend bien le cadre sabbatique, l’entrée dans la maison d’un dirigeant pharisien, le repas et l’observation soutenue. Toutefois, « Un jour » absorbe trop complètement la formule narrative Καὶ ἐγένετο, et la relation temporelle de ἐν τῷ ἐλθεῖν (« quand/lorsqu’il entra ») mérite d’être exprimée plus nettement dans une traduction d’équivalence optimale.
  naturalness: Le français est globalement naturel, clair et de registre approprié. « Il arriva que…, lorsque… » reste idiomatique dans une narration biblique moderne et restitue la structure sans calque pesant. « Ils l’observaient attentivement » est plus fluide que le démonstratif « Ceux-ci », dont l’antécédent peut paraître légèrement forcé après un groupe génitif.
  terminology: « chefs des pharisiens », « jour de sabbat » et « prendre un repas » conviennent. La note sur « manger du pain » préserve correctement l’expression grecque. « Observer attentivement » maintient la nuance de παρατηρούμενοι sans imposer une intention hostile.
  issues:
  - severity: low
    issue: La formule narrative et la subordonnée temporelle sont simplifiées.
    rationale: Καὶ ἐγένετο ἐν τῷ ἐλθεῖν introduit explicitement un événement au moment où Jésus entre. « Un jour de sabbat, Jésus entra » est intelligible, mais ne rend pas aussi pleinement cette articulation narrative et temporelle.
  - severity: low
    issue: « Ceux-ci » est un peu moins naturel et précise inutilement la reprise du sujet.
    rationale: Le grec emploie simplement αὐτοί (« ils/eux »), avec une légère emphase. « Ils » conserve une reprise sobre et ne surcharge pas l’identification des observateurs.
  revised_text: Il arriva que, un jour de sabbat, lorsque Jésus entra dans la maison de l’un des chefs des pharisiens pour prendre un repas[a], ils l’observaient attentivement[b].
