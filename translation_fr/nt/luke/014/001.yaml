source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ἐν τῷ ἐλθεῖν αὐτὸν εἰς οἶκόν τινος τῶν ἀρχόντων τῶν Φαρισαίων σαββάτῳ φαγεῖν ἄρτον καὶ αὐτοὶ ἦσαν παρατηρούμενοι αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/001.yaml
  text: And it happened that when he went into the house of one of the rulers of the Pharisees on the Sabbath to eat bread[b][a], they were watching him closely.
translation:
  language: fr
  text: Il arriva que, un jour de sabbat, lorsque Jésus entra dans la maison de l’un des chefs des pharisiens pour prendre un repas[a], ils l’observaient attentivement[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « manger du pain ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « le surveillaient de près » ; le terme grec peut évoquer une observation soupçonneuse ou hostile.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ἐγένετο
  choice: Un jour
  rationale: La formule narrative lucanienne introduit la scène. En français moderne, « Un jour » assure naturellement cette fonction sans conserver un calque lourd comme « Et il arriva que ».
- source_word: ἐν τῷ ἐλθεῖν αὐτὸν
  choice: Jésus entra
  rationale: La construction avec infinitif articulaire est temporelle. Le nom « Jésus », fourni par le contexte, évite une ouverture pronominale ambiguë dans un verset isolé.
- source_word: οἶκόν
  choice: la maison
  rationale: Équivalent direct et naturel de οἶκος dans le cadre d’un repas offert chez quelqu’un.
- source_word: τινος τῶν ἀρχόντων τῶν Φαρισαίων
  choice: de l’un des chefs des pharisiens
  rationale: « L’un des chefs » préserve la valeur partitive de τινος τῶν ἀρχόντων et rend ἀρχόντων comme désignant des dirigeants ou notables du groupe.
- source_word: σαββάτῳ
  choice: Un jour de sabbat
  rationale: Le datif est temporel et le grec est sans article. Cette formulation française naturelle conserve l’indétermination possible de l’expression.
- source_word: φαγεῖν ἄρτον
  choice: pour prendre un repas
  rationale: Littéralement « manger du pain », expression idiomatique signifiant prendre un repas. Le sens est rendu naturellement, tandis que la forme littérale est signalée en note.
- source_word: αὐτοὶ
  choice: Ceux-ci
  rationale: Le démonstratif reprend les personnes présentes dans la maison et reflète mieux que le simple « ils » la légère mise en relief du pronom grec.
- source_word: παρατηρούμενοι αὐτόν
  choice: l’observaient attentivement
  rationale: Le verbe exprime une observation soutenue qui peut être soupçonneuse ou hostile, sans que ce motif soit explicitement affirmé ici.
theological_decisions:
- issue: Hostilité implicite dans l’observation de Jésus
  choice: l’observaient attentivement
  alternative: le surveillaient de près
  rationale: « Observer attentivement » maintient la tension narrative sans transformer en certitude l’intention hostile que le verbe peut seulement suggérer dans ce verset.
translation_notes:
  register: Français international moderne, clair et digne. La phrase grecque longue est divisée en deux phrases pour une lecture naturelle. « Pharisiens » prend la minuscule conformément à l’usage français pour le nom des membres d’un groupe religieux.
