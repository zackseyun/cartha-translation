  rationale: La révision restitue explicitement la formule narrative lucanienne et la valeur temporelle de la construction à l’infinitif, tout en conservant un français moderne. Elle garde l’ambiguïté mesurée de l’observation, signalée en note, et maintient les deux ancres de note sur les expressions concernées.
