revisions:
- from: 'celui qui vous a invités tous les deux viendra te dire : « Cède-lui ta place. » Alors, couvert de honte, tu te mettras à occuper la dernière place[a].'
  to: 'celui qui t’a invité, toi et lui, viendra te dire : « Cède-lui ta place. » Alors, avec honte, tu commenceras à occuper la dernière place[a].'
  rationale: La correction résout l’incohérence entre le pluriel « vous » et le singulier « te » en conservant le singulier grec pour le destinataire tout en exprimant explicitement que l’hôte avait invité les deux personnes. « Avec honte » suit plus étroitement la formulation grecque sans modifier le sens.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T10:54:20Z'
review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est bien rendu : l’hôte demande à l’invité de céder sa place, puis celui-ci doit prendre la dernière place avec honte. Toutefois, l’alternance entre « vous » (« vous a invités tous les deux ») et « te » ne correspond pas de façon cohérente au σέ singulier grec et crée une rupture d’adresse en français.'
  naturalness: La révision emploie une formulation française moderne, claire et idiomatique. « Toi et lui » explicite naturellement que l’hôte a invité les deux personnes sans basculer artificiellement au pluriel.
  terminology: « Cède-lui ta place », « avec honte » et « la dernière place » rendent fidèlement Δὸς τούτῳ τόπον, μετὰ αἰσχύνης et τὸν ἔσχατον τόπον. La note préserve correctement l’alternative contextuelle « la place la moins honorable ».
  issues:
  - severity: medium
    issue: Incohérence de personne entre « vous a invités tous les deux » et « te dire ».
    rationale: Le grec oppose un destinataire singulier (σέ, σοι) à un autre invité (αὐτόν). En français, « vous » dans « vous a invités tous les deux » se comprend comme pluriel, tandis que « te » est singulier. « Celui qui t’a invité, toi et lui » conserve la focalisation sur le destinataire singulier et inclut explicitement l’autre invité.
  - severity: low
    issue: « Couvert de honte » est plus imagé que la préposition grecque μετὰ αἰσχύνης.
    rationale: La formule n’est pas infidèle, mais « avec honte » est plus directement équivalent et évite d’ajouter l’image de quelqu’un “couvert” de honte.
  revised_text: 'celui qui t’a invité, toi et lui, viendra te dire : « Cède-lui ta place. » Alors, avec honte, tu commenceras à occuper la dernière place[a].'
  revised_footnotes:
  - marker: a
    text: Ou « la place la moins honorable ». L’expression grecque peut désigner la dernière position dans un ordre et, dans ce repas, la place correspondant au rang le plus bas.
    reason: lexical_alternative
  revision_rationale: La correction résout l’incohérence entre le pluriel « vous » et le singulier « te » en conservant le singulier grec pour le destinataire tout en exprimant explicitement que l’hôte avait invité les deux personnes. « Avec honte » suit plus étroitement la formulation grecque sans modifier le sens.
