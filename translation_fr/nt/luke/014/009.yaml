source:
  edition: SBLGNT
  text: καὶ ἐλθὼν ὁ σὲ καὶ αὐτὸν καλέσας ἐρεῖ σοι· Δὸς τούτῳ τόπον, καὶ τότε ἄρξῃ μετὰ αἰσχύνης τὸν ἔσχατον τόπον κατέχειν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/009.yaml
  text: and the one who invited both you and him will come and say to you[a], ‘Give this man your place,’ and then you will begin with shame to take the last place.
translation:
  language: fr
  text: 'celui qui t’a invité, toi et lui, viendra te dire : « Cède-lui ta place. » Alors, avec honte, tu commenceras à occuper la dernière place[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la place la moins honorable ». L’expression grecque peut désigner la dernière position dans un ordre et, dans ce repas, la place correspondant au rang le plus bas.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ σὲ καὶ αὐτὸν καλέσας
  choice: celui qui vous a invités tous les deux
  rationale: La construction participiale substantivée désigne l’hôte. Cette formulation naturelle maintient explicitement la distinction entre les deux invités tout en conservant le tutoiement singulier du contexte.
- source_word: ἐλθὼν … ἐρεῖ σοι
  choice: viendra te dire
  rationale: Le participe aoriste suivi du futur exprime ici une action antérieure ou coordonnée à la parole future. « Viendra te dire » restitue naturellement cette séquence en français.
- source_word: Δὸς τούτῳ τόπον
  choice: Cède-lui ta place
  rationale: Dans le cadre du repas, l’ordre exige de laisser à l’autre invité la place d’honneur occupée. « Céder sa place » exprime idiomatiquement ce sens sans lourdeur.
- source_word: μετὰ αἰσχύνης
  choice: couvert de honte
  rationale: αἰσχύνη évoque la honte sociale et le déshonneur, davantage qu’un simple embarras. La tournure choisie est naturelle et conserve cette force.
- source_word: ἄρξῃ … κατέχειν
  choice: tu te mettras à occuper
  rationale: Cette tournure rend naturellement l’idée de commencement portée par ἄρξῃ et le sens d’« occuper » de κατέχειν, sans ajouter explicitement une obligation.
- source_word: τὸν ἔσχατον τόπον
  choice: la dernière place
  rationale: « La dernière place » conserve le sens premier de ἔσχατος tout en évoquant naturellement, dans l’ordre des places à table, le rang le moins honorable.
theological_decisions: []
translation_notes:
  register: Français moderne, direct et digne. Le tutoiement rend les pronoms grecs singuliers adressés à l’invité, tandis que « vous … tous les deux » désigne sans ambiguïté les deux personnes invitées par le même hôte.
