  yaml_path: translation/nt/luke/014/020.yaml
  text: And another said[a], ‘I have married a wife, and for this reason I cannot come.’
translation:
  language: fr
  text: 'Un autre dit : « J’ai épousé une femme et, pour cette raison, je ne peux pas venir. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἕτερος
  choice: un autre
  rationale: Dans la suite du récit, ἕτερος introduit une personne supplémentaire qui présente son excuse. « Un autre » est naturel et fidèle au contraste séquentiel.
- source_word: Γυναῖκα ἔγημα
  choice: je me suis marié
  rationale: Γυναῖκα désigne ici nécessairement une épouse, puisqu’il est complément de ἔγημα. En français courant, « je me suis marié » exprime naturellement l’action, tandis que la formulation plus littérale « j’ai épousé une femme » est conservée en note.
- source_word: διὰ τοῦτο
  choice: pour cette raison
  rationale: Cette expression indique explicitement le motif invoqué par l’homme et conserve clairement le lien causal.
- source_word: οὐ δύναμαι ἐλθεῖν
  choice: je ne peux pas venir
  rationale: Cette tournure française naturelle rend directement l’idée d’incapacité exprimée par δύναμαι suivi de l’infinitif.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. Le passé composé rend naturellement l’aoriste dans ce récit sans préciser au-delà du grec à quel point le mariage est récent.
