review_pass:
  verdict: revise
  source_fidelity: Le sens général est bien rendu. Toutefois, « ne va pas t’allonger » évoque en français moderne l’action de se coucher plutôt que celle de prendre place à un repas. Une formulation idiomatique peut rendre l’acte de prendre place, tandis qu’une note explique la posture de table antique. « Cette personne » rend explicitement et sans ambiguïté le renvoi de ὑπ’ αὐτοῦ à l’invitant.
  naturalness: « Ne t’installe pas à la première place » est plus naturel en français international moderne dans ce contexte de repas formel. « De peur que cette personne n’ait invité » conserve le subjonctif après « de peur que » et évite un pronom « il » dont l’antécédent est moins net.
  terminology: « Repas de noces » et « première place » conviennent au registre et au contexte. La note culturelle conserve l’information spécifique portée par κατακλιθῇς, sans forcer dans le texte français l’image d’une personne qui s’allonge.
  issues:
  - severity: medium
    issue: « ne va pas t’allonger » est peu idiomatique pour prendre place à table.
    rationale: En français actuel, cette expression suggère principalement que l’on se couche. Le grec vise la prise de place selon la coutume des repas où l’on s’étendait; cette donnée peut être conservée en note culturelle.
  - severity: low
    issue: L’antécédent de « il » dans « de peur qu’il n’ait invité » est moins explicite que dans le grec.
    rationale: Le grec renvoie clairement à la personne qui a invité. « Cette personne » maintient ce renvoi sans ajouter l’interprétation « l’hôte ».
  revised_text: Quand quelqu’un t’invite à un repas de noces[a], ne t’installe pas à la première place[b][c], de peur que cette personne n’ait invité quelqu’un de plus honoré que toi.
