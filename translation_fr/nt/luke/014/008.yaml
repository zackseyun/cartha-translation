  text: Ὅταν κληθῇς ὑπό τινος εἰς γάμους, μὴ κατακλιθῇς εἰς τὴν πρωτοκλισίαν, μήποτε ἐντιμότερός σου ᾖ κεκλημένος ὑπ’ αὐτοῦ
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/008.yaml
  text: When you are invited by someone to a wedding feast, do not recline in the place of honor, lest someone more honored than you has been invited by him.
translation:
  language: fr
  text: Quand quelqu’un t’invite à un repas de noces[a], ne t’installe pas à la première place[b][c], de peur que cette personne n’ait invité quelqu’un de plus honoré que toi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « à des noces ». Le pluriel grec peut désigner l’ensemble des festivités du mariage, en particulier le banquet.'
    reason: lexical_alternative
  - marker: b
    text: C’est-à-dire la place la plus honorifique à table.
    reason: cultural_note
  - marker: c
    text: 'Le verbe grec évoque le fait de prendre place en s’allongeant : lors des repas officiels de l’Antiquité, les convives mangeaient généralement allongés plutôt qu’assis bien droit.'
    reason: cultural_note
lexical_decisions:
- source_word: Ὅταν κληθῇς ὑπό τινος
  choice: Quand quelqu’un t’invite
  rationale: Le tour exprime une situation générale. La formulation active est naturelle en français et conserve le caractère indéfini de τινος.
- source_word: εἰς γάμους
  choice: à un repas de noces
  rationale: Le pluriel γάμοι peut désigner les festivités nuptiales, particulièrement le banquet; le contexte porte sur les places à table.
- source_word: μὴ κατακλιθῇς
  choice: ne va pas t’allonger
  rationale: κατακλίνω évoque le fait de s’allonger pour prendre place à table selon l’usage antique; cette formulation conserve l’image sans donner au français un tour trop littéral.
- source_word: εἰς τὴν πρωτοκλισίαν
  choice: à la place d’honneur
  rationale: πρωτοκλισία désigne la place la plus honorifique lors d’un repas. « Place d’honneur » est idiomatique et précis.
- source_word: μήποτε
  choice: de peur que… ne
  rationale: Ce tour français exprime naturellement la mise en garde et la possibilité redoutée introduite par μήποτε.
- source_word: ἐντιμότερός σου
  choice: quelqu’un de plus honoré que toi
  rationale: Le comparatif marque un rang ou une considération sociale supérieure, sans préciser sur quel critère.
- source_word: ᾖ κεκλημένος ὑπ’ αὐτοῦ
  choice: il n’ait invité
  rationale: Le subjonctif parfait périphrastique décrit la possibilité qu’une invitation ait déjà été donnée. L’actif français évite le passif lourd tout en maintenant l’hôte comme agent.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement singulier reflète les formes grecques de deuxième personne du singulier. Les notes maintiennent l’arrière-plan nuptial et la coutume antique de manger allongé.
