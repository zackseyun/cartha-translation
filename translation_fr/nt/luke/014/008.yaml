revisions:
- from: Quand quelqu’un t’invite à un repas de noces[a], ne va pas t’allonger à la place d’honneur[b][c], de peur qu’il n’ait invité quelqu’un de plus honoré que toi.
  to: Quand quelqu’un t’invite à un repas de noces[a], ne t’installe pas à la première place[b][c], de peur que cette personne n’ait invité quelqu’un de plus honoré que toi.
  rationale: 'La révision améliore l’idiomaticité sans modifier le sens : l’interdiction concerne la première place, et la posture de table antique est préservée par une note explicitement rattachée au verbe grec. Le renvoi final à l’invitant est aussi clarifié.'
