revisions:
- from: Ou quel roi, partant faire la guerre à un autre roi, ne s’assiéra d’abord pour examiner s’il peut, avec dix mille hommes, faire face[a] à celui qui marche contre lui avec vingt mille ?
  to: Ou quel roi, partant en guerre contre un autre roi, ne s’assiéra-t-il pas d’abord pour examiner s’il peut, avec dix mille hommes, faire face[a] à celui qui marche contre lui avec vingt mille ?
  rationale: La révision corrige la syntaxe de la question rhétorique française sans modifier le sens, rend plus naturellement le mouvement vers le conflit, et complète l’alternative de la note afin qu’elle soit grammaticalement autonome. L’opposition entre le contingent de dix mille et l’adversaire arrivant avec vingt mille est préservée.
