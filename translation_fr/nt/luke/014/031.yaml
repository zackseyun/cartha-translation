source:
  edition: SBLGNT
  text: ἢ τίς βασιλεὺς πορευόμενος ⸂ἑτέρῳ βασιλεῖ συμβαλεῖν⸃ εἰς πόλεμον οὐχὶ καθίσας πρῶτον ⸀βουλεύσεται εἰ δυνατός ἐστιν ἐν δέκα χιλιάσιν ⸀ὑπαντῆσαι τῷ μετὰ εἴκοσι χιλιάδων ἐρχομένῳ ἐπ’ αὐτόν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/031.yaml
  text: Or what king[a], going to meet another king in war, will not first sit down and consider whether he is able with ten thousand to oppose the one coming against him with twenty thousand?
translation:
  language: fr
  text: Ou quel roi, partant en guerre contre un autre roi, ne s’assiéra-t-il pas d’abord pour examiner s’il peut, avec dix mille hommes, faire face[a] à celui qui marche contre lui avec vingt mille ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « aller à la rencontre de celui qui marche contre lui » ; dans ce contexte, le verbe grec désigne la rencontre d’une armée qui avance pour livrer bataille.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ
  choice: Ou
  rationale: Introduit simplement la seconde comparaison de Jésus et conserve l’enchaînement rhétorique.
- source_word: τίς βασιλεὺς
  choice: quel roi
  rationale: Formulation française naturelle pour une question rhétorique de portée générale.
- source_word: πορευόμενος
  choice: partant
  rationale: Rend le mouvement intentionnel exprimé par le participe, tandis que le contexte qui suit précise le but militaire.
- source_word: ἑτέρῳ βασιλεῖ συμβαλεῖν εἰς πόλεμον
  choice: faire la guerre à un autre roi
  rationale: Expression française claire et naturelle qui rend l’idée d’aller rencontrer un autre roi dans un conflit armé sans ajouter de détail tactique.
- source_word: οὐχὶ καθίσας πρῶτον
  choice: ne s’assiéra d’abord
  rationale: La question attend une réponse affirmative; le futur correspond à βουλεύσεται, et « d’abord » marque l’antériorité de la réflexion.
- source_word: βουλεύσεται
  choice: pour examiner
  rationale: Le verbe désigne une délibération réfléchie. « Examiner » exprime ici l’évaluation préalable des moyens disponibles.
- source_word: εἰ δυνατός ἐστιν
  choice: s’il peut
  rationale: Rend directement la capacité en français moderne, sans suggérer une simple permission.
- source_word: ἐν δέκα χιλιάσιν
  choice: avec dix mille hommes
  rationale: La préposition a ici une valeur associative ou instrumentale; « hommes » explicite naturellement qu’il s’agit de soldats, implication nette du contexte militaire.
- source_word: ὑπαντῆσαι
  choice: faire face
  rationale: Le verbe signifie littéralement aller à la rencontre; dans ce contexte militaire, « faire face » conserve l’idée de rencontre tout en indiquant l’opposition.
- source_word: τῷ μετὰ εἴκοσι χιλιάδων ἐρχομένῳ ἐπ’ αὐτόν
  choice: à celui qui marche contre lui avec vingt mille
  rationale: « Marche contre lui » exprime l’avancée hostile du roi adverse; « celui » évite une répétition inutile tout en gardant le référent clair.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La question rhétorique et la progression de l’image militaire sont conservées. L’ajout de « hommes » après les nombres explicite une donnée implicitement militaire en grec sans modifier le sens.
