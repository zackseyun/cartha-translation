review_pass:
  verdict: revise
  source_fidelity: Le sens militaire et la progression argumentative du grec sont bien rendus. « Avec dix mille hommes » explicite de manière recevable le contingent militaire sous-entendu par les nombres dans ce contexte. « Partant en guerre contre » rend plus directement συμβαλεῖν εἰς πόλεμον.
  naturalness: 'La formulation actuelle « ne s’assiéra d’abord pour examiner » est grammaticalement et idiomatiquement incomplète en français : la question rhétorique négative appelle ici l’inversion et « pas ». La révision rétablit une question française naturelle et conserve le futur rhétorique du grec.'
  terminology: « Faire face à » est un bon rendu contextuel de ὑπαντῆσαι. La note conserve à juste titre l’alternative plus littérale « aller à la rencontre de » et doit l’intégrer dans une construction française complète.
  issues:
