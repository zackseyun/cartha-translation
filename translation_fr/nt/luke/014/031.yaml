    issue: Question rhétorique négative incomplète
    rationale: « Ne s’assiéra d’abord pour examiner » omet « pas » et ne marque pas clairement l’interrogation. Le grec οὐχὶ introduit une question attendant une réponse affirmative; « ne s’assiéra-t-il pas d’abord… ? » la rend correctement.
  - severity: low
    issue: Formulation du départ au combat
    rationale: « Partant faire la guerre à » se comprend, mais « partant en guerre contre » est plus idiomatique et reflète clairement l’engagement dans un conflit contre l’autre roi.
  - severity: low
    issue: Alternative de note grammaticalement suspendue
    rationale: « Aller à la rencontre de » devrait reprendre son complément dans la note afin que l’alternative soit directement substituable à « faire face à celui ».
