  text: λέγοντες ὅτι Οὗτος ὁ ἄνθρωπος ἤρξατο οἰκοδομεῖν καὶ οὐκ ἴσχυσεν ἐκτελέσαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/030.yaml
  text: saying[a], ‘This man began to build and was not able to finish.’
translation:
  language: fr
  text: 'en disant : « Cet homme a commencé à construire et n’a pas pu achever[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « n’a pas eu la force d’achever ».
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες ὅτι
  choice: 'en disant : «'
  rationale: Le participe présent se rattache naturellement au sujet implicite du verset précédent, tandis que ὅτι introduit ici les paroles citées; les deux-points et les guillemets sont idiomatiques en français.
- source_word: Οὗτος ὁ ἄνθρωπος
  choice: Cet homme
  rationale: Rend directement le démonstratif et le nom masculin, en conservant le ton public et quelque peu accusateur sans ajouter la nuance péjorative de « ce type ».
- source_word: ἤρξατο οἰκοδομεῖν
  choice: a commencé à construire
  rationale: Expression française naturelle qui reproduit la construction grecque « commencer à bâtir/construire »; « construire » convient au projet évoqué sans ajouter un complément absent.
- source_word: οὐκ ἴσχυσεν
  choice: n’a pas été capable
  rationale: ἰσχύω exprime ici la capacité d’aller jusqu’au bout, sans nécessairement désigner la seule force physique. Cette formulation conserve cette portée plus large.
- source_word: ἐκτελέσαι
  choice: d’achever
  rationale: Dans ce contexte de construction, le verbe signifie mener l’entreprise à son terme. « Achever » est naturel, digne et permet de ne pas ajouter un objet qui n’est pas exprimé en grec.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La formulation conserve le lien participial avec le verset précédent et la nuance de capacité de ἰσχύω, tout en évitant de préciser à tort si l’incapacité était financière, physique ou autre.
