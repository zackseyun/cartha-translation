id: LUK.14.24
reference: Luke 14:24
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: λέγω γὰρ ὑμῖν ὅτι οὐδεὶς τῶν ἀνδρῶν ἐκείνων τῶν κεκλημένων γεύσεταί μου τοῦ ⸀δείπνου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/024.yaml
  text: For I tell you that none of those men who were invited will taste my dinner[a].
translation:
  language: fr
  text: Car je vous le dis, aucun de ces hommes qui avaient été invités ne goûtera à mon repas[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « mon banquet » ; traditionnellement, « mon souper ».
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω γὰρ ὑμῖν
  choice: Car, je vous le dis
  rationale: Cette formulation conserve la valeur explicative de γάρ et l’adresse directe de λέγω ὑμῖν, dans un français naturel et soutenu.
- source_word: οὐδεὶς τῶν ἀνδρῶν ἐκείνων
  choice: aucun de ces hommes
  rationale: « Aucun » rend la négation catégorique de οὐδείς, tandis que « ces hommes » conserve la référence masculine explicite de ἀνδρῶν et la valeur démonstrative de ἐκείνων.
- source_word: τῶν κεκλημένων
  choice: qui avaient été invités
  rationale: Dans le contexte d’un repas, καλέω désigne l’invitation. Le plus-que-parfait rend naturellement l’antériorité impliquée par le participe parfait passif.
- source_word: γεύσεταί
  choice: ne goûtera à
  rationale: « Goûter à » préserve l’image concrète du verbe γεύομαι tout en exprimant idiomatiquement l’idée d’avoir part au repas.
- source_word: μου τοῦ δείπνου
  choice: mon repas
  rationale: δεῖπνον désigne le repas principal, souvent pris le soir, et peut selon le contexte évoquer un festin. « Repas » est naturel, actuel et moins interprétatif que « banquet ».
theological_decisions:
- issue: Rapport entre la parole de l’hôte et la portée théologique de la parabole
  choice: Conserver la première personne dans « mon repas » sans expliciter l’interprétation allégorique.
  alternative: mon banquet
  rationale: Le grec maintient la voix narrative de l’hôte et son possessif. La traduction préserve cette tension sans identifier explicitement le repas à une réalité théologique particulière.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve la solennité de l’affirmation et la négation catégorique, sans surinterpréter l’image du repas.
