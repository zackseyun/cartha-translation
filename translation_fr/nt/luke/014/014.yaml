id: LUK.14.14
reference: Luke 14:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ μακάριος ἔσῃ, ὅτι οὐκ ἔχουσιν ἀνταποδοῦναί σοι, ἀνταποδοθήσεται γάρ σοι ἐν τῇ ἀναστάσει τῶν δικαίων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/014.yaml
  text: And you will be blessed[a], because they cannot repay you[b]; for you will be repaid at the resurrection of the righteous.
translation:
  language: fr
  text: Et tu seras heureux, puisqu’ils n’ont pas de quoi te rendre la pareille ; car tu seras récompensé lors de la résurrection des justes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μακάριος
  choice: heureux
  rationale: Dans une béatitude prononcée par Jésus, « heureux » exprime naturellement en français l’état favorable accordé par Dieu, sans le réduire à une émotion passagère.
- source_word: ὅτι
  choice: puisque
  rationale: Le terme introduit la raison de cet état heureux ; « puisque » rend clairement ce lien causal.
- source_word: οὐκ ἔχουσιν ἀνταποδοῦναί σοι
  choice: ils n’ont pas de quoi te rendre la pareille
  rationale: Cette formulation conserve l’image grecque de ne pas « avoir » de quoi rendre en retour et indique le manque de moyens, sans suggérer une absence d’obligation.
- source_word: ἀνταποδοθήσεται γάρ σοι
  choice: en effet, cela te sera rendu
  rationale: La tournure passive maintient la réciprocité lexicale avec « rendre la pareille » et laisse implicite, comme le grec, l’auteur de la récompense.
- source_word: ἐν τῇ ἀναστάσει
  choice: lors de la résurrection
  rationale: « Lors de » rend idiomatiquement la valeur temporelle de ἐν dans ce contexte.
- source_word: τῶν δικαίων
  choice: des justes
  rationale: « Les justes » est une expression française concise et traditionnelle qui conserve la portée morale et théologique de δίκαιος.
theological_decisions:
- issue: Sens de « la résurrection des justes »
  choice: Conserver la formulation « lors de la résurrection des justes » sans préciser son rapport à une résurrection générale ou distincte.
  alternative: « lors de la résurrection, celle des justes » ou une formulation explicitant un calendrier eschatologique
  rationale: Le texte associe la rétribution future à la résurrection des justes, mais ne tranche pas à lui seul les débats sur le nombre ou l’ordre des résurrections.
- issue: Agent de la rétribution
  choice: Employer le passif « cela te sera rendu ».
  alternative: « Dieu te le rendra »
  rationale: Dieu est naturellement compris comme l’agent, mais le grec emploie un passif et ne le nomme pas explicitement ; la traduction préserve cette retenue.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation garde le parallélisme entre l’incapacité des invités à rendre la pareille et la rétribution future. Aucun appel de note n’est nécessaire.
