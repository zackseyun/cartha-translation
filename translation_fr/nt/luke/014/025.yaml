  text: Συνεπορεύοντο δὲ αὐτῷ ὄχλοι πολλοί, καὶ στραφεὶς εἶπεν πρὸς αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/025.yaml
  text: 'Large crowds were traveling with him[a], and turning, he said to them:'
translation:
  language: fr
  text: 'De grandes foules faisaient route avec lui[a]. Il se tourna et leur dit :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de nombreuses foules l’accompagnaient en chemin ». Le grec souligne que des foules nombreuses accompagnaient Jésus pendant son déplacement.
    reason: lexical_alternative
lexical_decisions:
- source_word: Συνεπορεύοντο
  choice: faisaient route avec
  rationale: L’imparfait exprime une action en cours dans le passé, et le verbe indique que les foules accompagnaient Jésus pendant son déplacement. « Faisaient route avec » est naturel et conserve l’idée du voyage partagé.
- source_word: δὲ
  choice: non rendu explicitement
  rationale: Ici, δέ assure une transition narrative légère. En français, la progression entre les phrases suffit à exprimer ce lien sans ajouter artificiellement « Or » ou « alors ».
- source_word: αὐτῷ
  choice: avec lui
  rationale: Le datif marque l’accompagnement. Le pronom maintient la formulation grecque sans répéter inutilement le nom de Jésus.
- source_word: ὄχλοι πολλοί
  choice: de grandes foules
  rationale: Cette expression désigne des foules nombreuses ou considérables. « De grandes foules » est idiomatique en français et préserve le pluriel du grec.
- source_word: καὶ
  choice: Il
  rationale: Le lien narratif est rendu par l’enchaînement de deux phrases françaises. Répéter « et » produirait ici une syntaxe moins naturelle.
- source_word: στραφεὶς
  choice: se retourna
  rationale: Le participe aoriste décrit le geste qui précède immédiatement la parole. Un verbe conjugué dans une nouvelle phrase donne en français une narration claire et naturelle.
- source_word: εἶπεν
  choice: dit
  rationale: Équivalent narratif courant et précis de l’aoriste de λέγω.
- source_word: πρὸς αὐτούς
  choice: leur
  rationale: Le pronom indirect français exprime naturellement les destinataires de la parole et renvoie sans ambiguïté aux foules.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La division en deux phrases évite une coordination lourde tout en conservant la séquence narrative et l’action continue de l’imparfait.
