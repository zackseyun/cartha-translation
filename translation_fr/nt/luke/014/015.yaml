source:
  edition: SBLGNT
  text: Ἀκούσας δέ τις τῶν συνανακειμένων ταῦτα εἶπεν αὐτῷ· Μακάριος ⸀ὅστις φάγεται ⸀ἄρτον ἐν τῇ βασιλείᾳ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/015.yaml
  text: But one of those reclining at the table with him[a], when he heard these things, said to him[b], “Blessed is whoever will eat bread in the kingdom of God.”
translation:
  language: fr
  text: 'Mais l’un de ceux qui étaient à table avec lui, après avoir entendu cela, lui dit : « Heureux celui qui mangera du pain dans le royaume de Dieu. »[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « mangera du pain ». En grec, cette expression peut désigner le fait de prendre ou de partager un repas.'
    reason: cultural_note
lexical_decisions:
- source_word: Ἀκούσας
  choice: après avoir entendu
  rationale: Le participe aoriste indique ici naturellement une circonstance temporelle antérieure à la prise de parole.
- source_word: δέ
  choice: Mais
  rationale: Marque une transition légère et la réaction d’un convive aux paroles précédentes de Jésus.
- source_word: τις τῶν συνανακειμένων
  choice: l’un de ceux qui étaient à table avec lui
  rationale: Désigne un convive non nommé. La formulation française exprime naturellement le repas partagé sans insister artificiellement sur la posture antique allongée.
- source_word: ταῦτα
  choice: cela
  rationale: En français courant, le singulier collectif « cela » renvoie naturellement à l’ensemble des propos précédents.
- source_word: εἶπεν αὐτῷ
  choice: lui dit
  rationale: Formule narrative française concise qui conserve explicitement le destinataire.
- source_word: Μακάριος
  choice: Heureux
  rationale: Formule consacrée et naturelle des béatitudes en français biblique moderne; elle désigne une condition enviable accordée par Dieu plutôt qu’une simple émotion passagère.
- source_word: ὅστις
  choice: celui qui
  rationale: L’indéfini relatif a une portée générale; « celui qui » est idiomatique et inclusif dans ce contexte proverbial.
- source_word: φάγεται ἄρτον
  choice: prendra un repas
  rationale: L’expression grecque littéralement « mangera du pain » peut idiomatiquement signifier partager ou prendre un repas. Le français exprime ici le sens naturel, tandis qu’une note conserve l’image littérale.
- source_word: ἐν τῇ βασιλείᾳ τοῦ θεοῦ
  choice: dans le royaume de Dieu
  rationale: Rendu direct qui préserve le cadre eschatologique sans ajouter explicitement un banquet absent des mots grecs.
theological_decisions:
- issue: Portée de Μακάριος dans une déclaration eschatologique
  choice: Heureux celui qui prendra un repas dans le royaume de Dieu !
  alternative: Béni soit celui qui mangera du pain dans le royaume de Dieu !
  rationale: « Heureux » correspond à l’usage français traditionnel et moderne des béatitudes et conserve l’idée d’une condition privilégiée devant Dieu. « Béni soit » risquerait d’être compris comme un souhait ou une formule de bénédiction plutôt que comme une déclaration.
- issue: Valeur future de φάγεται
  choice: prendra
  alternative: prend
  rationale: Le futur grec est maintenu afin de préserver l’attente eschatologique exprimée par le convive, sans préciser davantage le calendrier ou la nature de l’accomplissement.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe évite le calque de la posture antique à table, peu pertinent en français, et rend idiomatiquement l’expression grecque « manger du pain ». Le point d’exclamation restitue le caractère sentencieux et enthousiaste de la déclaration sans en modifier le contenu.
