id: LUK.14.35
reference: Luke 14:35
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὔτε εἰς γῆν οὔτε εἰς κοπρίαν εὔθετόν ἐστιν· ἔξω βάλλουσιν αὐτό. ὁ ἔχων ὦτα ἀκούειν ἀκουέτω.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/035.yaml
  text: It is fit neither for the soil nor for the manure pile[a]; they throw it outside. The one who has ears to hear[b], let him hear.
translation:
  language: fr
  text: Il ne convient ni à la terre ni au tas de fumier[a] ; on le jette dehors. Que celui qui a des oreilles pour entendre[b] entende.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « au fumier » ou « au tas d’excréments ».
    reason: lexical_alternative
  - marker: b
    text: Ou « Si quelqu’un a des oreilles pour entendre, qu’il entende ».
    reason: lexical_alternative
lexical_decisions:
- source_word: γῆν
  choice: la terre
  rationale: Dans cette image agricole, γῆ désigne la terre ou le sol cultivable, non la planète. « La terre » est naturel en français et s’accorde bien avec « tas de fumier ».
- source_word: κοπρίαν
  choice: le tas de fumier
  rationale: κοπρία désigne ici le fumier ou l’endroit où il est entassé. « Tas de fumier » conserve le caractère concret et agricole de l’image dans un français courant.
- source_word: εὔθετόν
  choice: il ne convient ni à… ni à…
  rationale: εὔθετος exprime ce qui est approprié ou utilisable pour un emploi. La tournure « convenir à » préserve cette idée sans réduire le sens à la seule utilité.
- source_word: ἔξω βάλλουσιν αὐτό
  choice: on le jette dehors
  rationale: Le pluriel grec a un sujet indéfini. Le pronom « on » rend naturellement cette valeur en français tout en conservant la forme active et l’image concrète de l’objet jeté dehors.
- source_word: ὁ ἔχων ὦτα ἀκούειν ἀκουέτω
  choice: Que celui qui a des oreilles pour entendre entende
  rationale: Cette formulation suit de près le participe substantivé et conserve la force impérative de ἀκουέτω. Le masculin singulier a ici une portée représentative.
theological_decisions:
- issue: Masculin singulier représentatif dans l’exhortation finale
  choice: Que celui qui a des oreilles pour entendre entende
  alternative: Si quelqu’un a des oreilles pour entendre, qu’il entende
  rationale: Le grec est au masculin singulier tout en ayant une portée générale. La traduction conserve cette forme et la tension entre précision grammaticale et application universelle, sans la neutraliser.
translation_notes:
  register: Français international moderne, sobre et digne. L’image agricole reste concrète. « On le jette dehors » rend idiomatiquement le sujet pluriel indéfini du grec, tandis que la formule finale garde son caractère solennel et proverbial.
