  to: 'Il dit aussi à celui qui l’avait invité : « Quand tu offres un repas de midi[a] ou un dîner, n’invite ni tes amis, ni tes frères, ni tes proches parents, ni de riches voisins, de peur qu’eux aussi ne t’invitent à leur tour[b] et que cela ne devienne pour toi une contrepartie[c]. »'
  rationale: La révision rend explicitement la valeur de mise en garde de μήποτε au moyen de « de peur que », conserve l’enchaînement de la proposition grecque, et emploie « contrepartie » pour ἀνταπόδομα. « Proches parents » est un équivalent naturel et suffisamment précis de συγγενεῖς.
