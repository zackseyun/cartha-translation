id: LUK.14.12
reference: Luke 14:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἔλεγεν δὲ καὶ τῷ κεκληκότι αὐτόν· Ὅταν ποιῇς ἄριστον ἢ δεῖπνον, μὴ φώνει τοὺς φίλους σου μηδὲ τοὺς ἀδελφούς σου μηδὲ τοὺς συγγενεῖς σου μηδὲ γείτονας πλουσίους, μήποτε καὶ αὐτοὶ ⸂ἀντικαλέσωσίν σε⸃ καὶ γένηται ⸂ἀνταπόδομά σοι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/012.yaml
  text: And he was also saying to the one who had invited him[a], “When you give a luncheon or a dinner, do not invite your friends or your brothers or your relatives or rich neighbors[c][b], lest they also invite you in return and it become repayment to you.”
translation:
  language: fr
  text: 'Il dit aussi à celui qui l’avait invité : « Quand tu offres un repas de midi[a] ou un dîner, n’invite ni tes amis, ni tes frères, ni tes proches parents, ni de riches voisins, de peur qu’eux aussi ne t’invitent à leur tour[b] et que cela ne devienne pour toi une contrepartie[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un petit déjeuner ». Le grec désigne un repas pris plus tôt dans la journée, souvent vers midi, plutôt que nécessairement le petit déjeuner moderne.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « t’inviter en retour ».'
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « et que cela devienne pour toi une contrepartie ». Autre traduction : « et que tu reçoives ainsi un retour ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔλεγεν δὲ καὶ
  choice: Il dit aussi
  rationale: L’imparfait grec peut présenter une parole dans son déroulement, mais le passé simple est ici plus naturel dans un récit français et n’altère pas la progression narrative; καί est rendu par « aussi ».
- source_word: τῷ κεκληκότι αὐτόν
  choice: à celui qui l’avait invité
  rationale: Cette formulation transparente rend le participe parfait et évite l’interprétation légèrement plus condensée « à son hôte ».
- source_word: Ὅταν ποιῇς
  choice: Quand tu offres
  rationale: Avec des termes désignant un repas, ποιέω signifie idiomatiquement donner ou organiser celui-ci; « offrir » convient naturellement au contexte d’hospitalité.
- source_word: ἄριστον
  choice: un repas de midi
  rationale: ἄριστον désigne le repas pris tôt dans la journée, souvent vers midi; cette expression moderne évite que « petit déjeuner » évoque à tort le repas matinal contemporain.
- source_word: δεῖπνον
  choice: un dîner
  rationale: δεῖπνον désigne le principal repas, généralement pris plus tard dans la journée; « dîner » maintient le contraste avec le repas de midi.
- source_word: μὴ φώνει
  choice: n’invite
  rationale: Bien que φωνέω signifie littéralement « appeler », le contexte d’un repas appelle naturellement le sens « inviter ».
- source_word: τοὺς ἀδελφούς σου
  choice: tes frères
  rationale: Le masculin pluriel explicite du grec est conservé plutôt que neutralisé.
- source_word: τοὺς συγγενεῖς σου
  choice: les membres de ta famille
  rationale: Cette formulation courante rend clairement συγγενεῖς, qui désigne les proches parents ou la parenté.
- source_word: γείτονας πλουσίους
  choice: de riches voisins
  rationale: L’adjectif πλουσίους qualifie directement les voisins; la formulation est concise et naturelle.
- source_word: μήποτε
  choice: Ils pourraient
  rationale: La mise en garde négative introduite par μήποτε est rendue en français courant par une phrase exprimant le risque, plus naturelle ici que « de peur que ».
- source_word: ἀντικαλέσωσίν σε
  choice: t’inviter à leur tour
  rationale: Le préverbe ἀντι- exprime la réciprocité; « à leur tour » communique clairement l’idée d’une invitation rendue.
- source_word: καὶ γένηται ἀνταπόδομά σοι
  choice: et tu serais ainsi payé de retour
  rationale: La tournure conserve l’idée d’une contrepartie ou rétribution résultant de l’invitation réciproque, sans la réduire à un simple remboursement matériel.
theological_decisions:
- issue: Portée de l’interdiction d’inviter les proches et les riches
  choice: Conserver l’impératif sans l’atténuer ni préciser s’il s’agit d’une interdiction absolue ou d’une exhortation rhétorique.
  alternative: Paraphraser comme une simple préférence donnée aux pauvres ou comme une interdiction absolue universelle.
  rationale: Le verset formule directement l’interdiction, tandis que son contexte développe le contraste; la traduction ne doit pas résoudre à elle seule la portée pragmatique de l’enseignement.
- issue: Nature de la rétribution
  choice: Employer « payé de retour », qui laisse ouverte la nature sociale ou plus large de la contrepartie.
  alternative: Traduire exclusivement par « récompensé » ou « remboursé ».
  rationale: ἀνταπόδομα désigne ce qui est rendu en retour; le contexte immédiat est celui de la réciprocité sociale, sans exiger un vocabulaire économique strict.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement suit le singulier grec adressé directement à l’hôte. La phrase a été légèrement segmentée pour éviter une construction lourde tout en conservant l’enchaînement logique et la réciprocité exprimée par le texte source.
