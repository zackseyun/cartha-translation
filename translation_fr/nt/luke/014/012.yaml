  naturalness: Le français révisé reste moderne et fluide. « De peur qu’eux aussi ne… » est une tournure soutenue mais courante et appropriée au registre scripturaire; elle rend précisément la valeur d’avertissement du grec.
  terminology: « Repas de midi », « dîner », « frères », « proches parents » et « riches voisins » rendent correctement les termes grecs. « Contrepartie » maintient le sens de ἀνταπόδομα sans imposer le sens plus étroit de remboursement matériel ni une interprétation théologique.
