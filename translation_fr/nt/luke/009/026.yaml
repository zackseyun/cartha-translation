reference: Luke 9:26
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὃς γὰρ ἂν ἐπαισχυνθῇ με καὶ τοὺς ἐμοὺς λόγους, τοῦτον ὁ υἱὸς τοῦ ἀνθρώπου ἐπαισχυνθήσεται, ὅταν ἔλθῃ ἐν τῇ δόξῃ αὐτοῦ καὶ τοῦ πατρὸς καὶ τῶν ἁγίων ἀγγέλων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/026.yaml
  text: For whoever is ashamed of me and of my words[b][a], the Son of Man will be ashamed of him when he comes in his glory and the glory of the Father and of the holy angels.
translation:
  language: fr
  text: Car celui qui a honte de moi et de mes paroles, le Fils de l’homme aura honte de lui[a] quand il viendra dans sa gloire et dans la gloire du Père et des saints anges[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « le Fils de l’homme aura honte de celui-ci » ou « de celui-là ».'
    reason: lexical_alternative
  - marker: b
    text: 'Le grec n’emploie qu’une seule préposition et un seul nom (« gloire »), suivis des expressions « de lui », « du Père » et « des saints anges ». On peut aussi rendre : « quand il viendra dans sa gloire, celle du Père et celle des saints anges ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς γὰρ ἂν
  choice: Car celui qui
  rationale: « Car » rend la valeur explicative de γάρ, tandis que « celui qui » exprime naturellement la portée générale de la relative indéfinie ὃς…ἄν.
- source_word: ἐπαισχυνθῇ / ἐπαισχυνθήσεται
  choice: a honte de / aura honte de
  rationale: La répétition du même verbe français préserve la réciprocité délibérée du grec sans renforcer le sens en « renier » ou « rejeter ».
- source_word: με καὶ τοὺς ἐμοὺς λόγους
  choice: de moi et de mes paroles
  rationale: « Paroles » rend directement λόγους et conserve la distinction entre la personne de Jésus et ce qu’il dit.
- source_word: τοῦτον
  choice: celui-là
  rationale: Le démonstratif reprend explicitement « celui qui » et conserve la force singulière et représentative du grec.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: le Fils de l’homme
  rationale: Formulation française consacrée qui préserve le titre et ses résonances scripturaires.
- source_word: ὅταν ἔλθῃ
  choice: quand il viendra
  rationale: ὅταν avec le subjonctif aoriste exprime ici un événement futur; le futur français est naturel dans cette proposition temporelle.
- source_word: ἐν τῇ δόξῃ αὐτοῦ καὶ τοῦ πατρὸς καὶ τῶν ἁγίων ἀγγέλων
  choice: dans sa gloire, celle du Père et celle des saints anges
  rationale: La formulation rattache les trois génitifs au seul nom δόξῃ, tout en restant claire et solennelle en français.
- source_word: τῶν ἁγίων ἀγγέλων
  choice: des saints anges
  rationale: Rendu adjectival direct et naturel de l’expression grecque.
theological_decisions:
- issue: Reprise du masculin singulier à portée générale
  choice: le Fils de l’homme aura honte de celui-là
  alternative: le Fils de l’homme aura honte de cette personne
  rationale: « Celui-là » conserve les formes masculines singulières ὃς et τοῦτον ainsi que leur lien syntaxique, sans limiter la portée générale de l’avertissement aux hommes.
- issue: La gloire du Fils de l’homme, du Père et des saints anges
  choice: dans sa gloire, celle du Père et celle des saints anges
  alternative: dans sa gloire et dans la gloire du Père et des saints anges
  rationale: Le texte coordonne une gloire attribuée au Fils de l’homme, au Père et aux saints anges. La traduction conserve cette grandeur eschatologique sans préciser au-delà du grec la nature exacte de leur relation à cette gloire.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « honte » maintient le parallélisme du texte source; « celui-là » est volontairement plus marqué afin de refléter le démonstratif τοῦτον. Les notes signalent les deux principales possibilités de formulation sans résoudre artificiellement l’ambiguïté syntaxique.
