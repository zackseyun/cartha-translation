id: LUK.9.23
reference: Luke 9:23
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἔλεγεν δὲ πρὸς πάντας· Εἴ τις θέλει ὀπίσω μου ⸂ἔρχεσθαι, ἀρνησάσθω⸃ ἑαυτὸν καὶ ἀράτω τὸν σταυρὸν αὐτοῦ ⸂καθ’ ἡμέραν⸃, καὶ ἀκολουθείτω μοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/023.yaml
  text: And he was saying to all[a], “If anyone wants to come after me, let him deny himself and take up his cross daily, and follow me.”
translation:
  language: fr
  text: 'Il disait à tous : « Si quelqu’un veut venir à ma suite, qu’il renonce à lui-même, qu’il prenne chaque jour sa croix et qu’il me suive. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔλεγεν
  choice: Il disait
  rationale: L’imparfait grec présente la parole dans son déroulement ou comme répétée; l’imparfait français en conserve naturellement l’aspect.
- source_word: πρὸς πάντας
  choice: à tous
  rationale: Rend directement la portée collective de l’adresse, sans restriction.
- source_word: Εἴ τις θέλει
  choice: Si quelqu’un veut
  rationale: « Quelqu’un » exprime ici l’indéfini générique, et « veut » rend simplement la volonté indiquée par θέλει.
- source_word: ὀπίσω μου ἔρχεσθαι
  choice: venir à ma suite
  rationale: Cette formulation française naturelle conserve l’image du déplacement derrière Jésus sans la confondre avec le verbe explicite « suivre » qui clôt la phrase.
- source_word: ἀρνησάσθω ἑαυτὸν
  choice: qu’il renonce à lui-même
  rationale: Le subjonctif introduit par « qu’il » rend l’impératif grec de troisième personne. « Renoncer à lui-même » exprime ici le refus de se prendre soi-même pour référence, tout en maintenant la tension de la formule.
- source_word: ἀράτω τὸν σταυρὸν αὐτοῦ
  choice: qu’il prenne sa croix
  rationale: « Prendre sa croix » conserve le geste exprimé par αἴρω et le terme concret σταυρός, sans réduire l’image à une souffrance ou à un fardeau.
- source_word: καθ’ ἡμέραν
  choice: chaque jour
  rationale: Rend clairement et idiomatiquement l’insistance lucanienne sur une action quotidienne.
- source_word: ἀκολουθείτω μοι
  choice: qu’il me suive
  rationale: Rend explicitement le second impératif de troisième personne et conserve le sens concret et disciple de ἀκολουθέω.
theological_decisions:
- issue: Portée de l’image de la croix dans la condition de disciple
  choice: Conserver le mot concret « croix »
  alternative: Paraphraser par « fardeau », « souffrance » ou « sacrifice »
  rationale: Le grec emploie σταυρός. L’image évoque la mort et le renoncement radical, mais la traduction ne doit pas en limiter d’avance la portée théologique par une paraphrase.
- issue: Singulier générique et formes masculines
  choice: « Si quelqu’un… qu’il… lui-même… sa croix »
  alternative: 'Employer un pluriel inclusif : « ceux qui… qu’ils renoncent à eux-mêmes… »'
  rationale: Le grec emploie un indéfini singulier générique suivi de formes singulières. Le français peut reproduire cette structure naturellement; le masculin grammatical n’exclut pas les femmes dans cet emploi générique.
- issue: Sens de ἀρνέομαι appliqué à soi-même
  choice: « renonce à lui-même »
  alternative: « se renie lui-même » ou « dise non à lui-même »
  rationale: « Renoncer à soi-même » est naturel en français et conserve la force radicale de l’expression sans suggérer uniquement un désaveu verbal ni imposer une explication doctrinale précise.
translation_notes:
  register: Français international moderne, digne et oralement fluide. La structure ternaire des injonctions est conservée. Aucun marqueur de note n’est requis, puisqu’aucune note n’est proposée.
