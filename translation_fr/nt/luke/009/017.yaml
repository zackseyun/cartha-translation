  text: καὶ ἔφαγον καὶ ἐχορτάσθησαν πάντες, καὶ ἤρθη τὸ περισσεῦσαν αὐτοῖς κλασμάτων κόφινοι δώδεκα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/017.yaml
  text: 'And they all ate and were satisfied[b][a], and what was left over of the broken pieces was picked up for them: twelve baskets.'
translation:
  language: fr
  text: Tous mangèrent et furent rassasiés, et l’on ramassa douze paniers de morceaux qui leur restaient[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « emporta » ou « recueillit ». Le verbe grec peut aussi être rendu par « fut enlevé » ou « fut emporté » ; dans ce contexte, il désigne le ramassage des morceaux.
    reason: Alternative lexicale pour ἤρθη (αἴρω), dont le passif grec est rendu idiomatiquement par le sujet indéfini français « l’on ».
lexical_decisions:
- source_word: ἔφαγον
  choice: mangèrent
  rationale: L’aoriste raconte simplement l’événement ; le passé simple convient au registre narratif biblique tout en restant clair.
- source_word: ἐχορτάσθησαν
  choice: furent rassasiés
  rationale: Le verbe exprime le fait de manger jusqu’à satiété ; « furent rassasiés » conserve la forme passive et demeure naturel en français.
- source_word: πάντες
  choice: Tous
  rationale: Le placement initial rend explicitement l’insistance grecque sur le fait que chacun a mangé.
- source_word: ἤρθη
  choice: fut ramassé
  rationale: Dans ce contexte, le passif de αἴρω désigne l’action de recueillir les restes. « Fut ramassé » est concret et idiomatique, tout en gardant le passif grec.
- source_word: τὸ περισσεῦσαν
  choice: ce qui leur restait
  rationale: L’expression rend naturellement le participe substantivé et rattache prudemment le datif αὐτοῖς à ce qui restait pour eux.
- source_word: κλασμάτων
  choice: des morceaux
  rationale: « Morceaux » exprime clairement les portions rompues sans recourir au terme plus soutenu « fragments ».
- source_word: κόφινοι δώδεκα
  choice: douze paniers
  rationale: Cette formulation simple et usuelle transmet le type général de récipient sans ajouter une précision matérielle absente du contexte immédiat.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. Le passé simple maintient un registre narratif soutenu mais courant dans une traduction biblique. La structure passive et la mention de ce qui « leur restait » préservent au mieux la formulation grecque sans surinterpréter le datif αὐτοῖς.
