source:
  edition: SBLGNT
  text: οἱ δὲ ἀποκριθέντες εἶπαν· Ἰωάννην τὸν βαπτιστήν, ἄλλοι δὲ Ἠλίαν, ἄλλοι δὲ ὅτι προφήτης τις τῶν ἀρχαίων ἀνέστη.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/019.yaml
  text: And they answered[a], “John the Baptist; but others, Elijah; and others, that some prophet of the ancients has risen.”
translation:
  language: fr
  text: 'Ils répondirent : « Jean le Baptiste ; d’autres : Élie ; d’autres encore : un prophète d’autrefois s’est levé[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « est ressuscité ». Le verbe grec peut signifier « se lever » et peut aussi, dans ce contexte, évoquer un retour à la vie.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθέντες εἶπαν
  choice: Ils répondirent
  rationale: La construction participiale suivie d’un verbe de parole forme ici un idiome que le français rend naturellement par un seul verbe.
- source_word: Ἰωάννην τὸν βαπτιστήν
  choice: Jean le Baptiste
  rationale: Désignation française traditionnelle, claire et exacte de Jean dans ce contexte.
- source_word: ἄλλοι δὲ ... ἄλλοι δὲ
  choice: pour d’autres ... pour d’autres encore
  rationale: Cette formulation conserve les groupes successifs et leur contraste tout en restant fluide en français.
- source_word: Ἠλίαν
  choice: Élie
  rationale: Forme française habituelle du nom du prophète.
- source_word: προφήτης τις τῶν ἀρχαίων
  choice: un prophète d’autrefois
  rationale: « Un prophète » préserve l’indétermination de τις, tandis que « d’autrefois » exprime naturellement l’ancienneté indiquée par τῶν ἀρχαίων sans suggérer l’Antiquité gréco-romaine.
- source_word: ἀνέστη
  choice: s’est relevé
  rationale: Ce choix conserve l’image de se lever et laisse ouverte sa résonance possible avec la résurrection, sans l’expliciter davantage que le grec.
theological_decisions:
- issue: Faut-il rendre ἀνέστη par un terme désignant explicitement la résurrection ?
  choice: s’est relevé
  alternative: est ressuscité
  rationale: Dans ce contexte, le verbe peut évoquer le retour à la vie d’un prophète ancien, mais il signifie fondamentalement se lever ou se relever. La traduction retenue préserve cette tension au lieu d’imposer une interprétation doctrinale explicite.
translation_notes:
  register: Français moderne, international et digne. Les reprises « pour d’autres » restituent la structure de l’énumération grecque sans alourdir la phrase ; « d’autrefois » est plus naturel que « des anciens » en français courant.
