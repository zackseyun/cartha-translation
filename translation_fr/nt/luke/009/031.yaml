id: LUK.9.31
reference: Luke 9:31
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οἳ ὀφθέντες ἐν δόξῃ ἔλεγον τὴν ἔξοδον αὐτοῦ ἣν ἤμελλεν πληροῦν ἐν Ἰερουσαλήμ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/031.yaml
  text: who, appearing in glory, were speaking about his departure, which he was about to fulfill in Jerusalem.
translation:
  language: fr
  text: Apparus dans la gloire, ils parlaient de son départ, qu’il allait mener à son accomplissement à Jérusalem.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὀφθέντες ἐν δόξῃ
  choice: Apparus dans la gloire
  rationale: Rend naturellement le participe passif « ayant été vus / étant apparus » et conserve l’idée de leur manifestation dans la gloire.
- source_word: ἔξοδος
  choice: départ
  rationale: « Départ » respecte le sens immédiat tout en préservant les possibles résonances de l’Exode sans les expliciter dans le corps du texte.
- source_word: πληροῦν
  choice: accomplir
  rationale: Le verbe peut signifier mener à son accomplissement. « Accomplir » convient mieux en français à ce que Jésus va réaliser à Jérusalem que le calque « remplir son départ ».
- source_word: ἤμελλεν
  choice: allait
  rationale: Exprime l’imminence ou la destinée indiquée par la construction grecque, sans préciser davantage la modalité.
theological_decisions:
- issue: Portée théologique de ἔξοδος
  choice: départ
  alternative: exode
  rationale: Le terme grec peut évoquer l’Exode et englober la mort, la résurrection et l’ascension de Jésus, mais « départ » maintient cette ouverture sans imposer l’allusion au lecteur.
- issue: Sens de πληροῦν
  choice: accomplir
  alternative: mener à son accomplissement
  rationale: « Accomplir » conserve l’idée que les événements de Jérusalem constituent une œuvre ou un dessein mené à terme, sans développer l’interprétation dans la traduction.
translation_notes:
  register: Français moderne, digne et fluide. L’ordre initial met en relief l’apparition dans la gloire tout en maintenant clairement Moïse et Élie comme sujets repris du verset précédent.
