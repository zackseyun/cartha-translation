source:
  edition: SBLGNT
  text: λαβὼν δὲ τοὺς πέντε ἄρτους καὶ τοὺς δύο ἰχθύας ἀναβλέψας εἰς τὸν οὐρανὸν εὐλόγησεν αὐτοὺς καὶ κατέκλασεν καὶ ἐδίδου τοῖς μαθηταῖς ⸀παραθεῖναι τῷ ὄχλῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/016.yaml
  text: Then[a], taking the five loaves and the two fish, and looking up to heaven, he blessed them and broke them and kept giving them to the disciples to set before the crowd.
translation:
  language: fr
  text: Puis il prit les cinq pains et les deux poissons, leva les yeux vers le ciel, les bénit[a], les rompit et les donnait aux disciples afin qu’ils les distribuent à la foule.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible, par interprétation du contexte : « rendit grâce ». Le verbe grec signifie littéralement « bénit », tandis que certains récits parallèles emploient « rendit grâce ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβὼν δὲ
  choice: Puis il prit
  rationale: Le participe aoriste introduit une action préalable, tandis que δέ fait progresser le récit. Une proposition coordonnée est plus naturelle en français moderne que « ayant pris ».
- source_word: τοὺς πέντε ἄρτους
  choice: les cinq pains
  rationale: Dans ce contexte, ἄρτος désigne des pains individuels; le pluriel concret « pains » est idiomatique en français.
- source_word: τοὺς δύο ἰχθύας
  choice: les deux poissons
  rationale: Traduction directe et naturelle du pluriel grec.
- source_word: ἀναβλέψας εἰς τὸν οὐρανὸν
  choice: leva les yeux vers le ciel
  rationale: Cette formulation française naturelle restitue le regard dirigé vers le haut et conserve « ciel », approprié au contexte de prière.
- source_word: εὐλόγησεν αὐτοὺς
  choice: les bénit
  rationale: Le verbe grec signifie explicitement « bénir » et le pronom masculin pluriel renvoie naturellement aux pains et aux poissons ensemble.
- source_word: κατέκλασεν
  choice: les rompit
  rationale: « Rompre » convient au partage du pain et maintient le registre digne du récit; le pronom reprend les aliments mentionnés.
- source_word: ἐδίδου
  choice: continua à les donner
  rationale: L’imparfait grec présente la distribution comme une action prolongée ou répétée; « continua à » rend clairement cet aspect.
- source_word: τοῖς μαθηταῖς
  choice: aux disciples
  rationale: L’article grec est rendu naturellement par l’article défini, sans ajouter le possessif « ses ».
- source_word: παραθεῖναι τῷ ὄχλῳ
  choice: pour qu’ils les présentent à la foule
  rationale: L’infinitif exprime le but. « Présenter à » conserve l’idée concrète de placer la nourriture devant les gens, sans réduire le sens au seul verbe « servir ».
theological_decisions:
- issue: Sens de οὐρανός dans ce contexte de bénédiction
  choice: le ciel
  alternative: le firmament
  rationale: « Le ciel » est l’expression française normale et conserve la portée religieuse du geste sans imposer une précision doctrinale étrangère au texte.
- issue: Sens de εὐλόγησεν
  choice: les bénit
  alternative: rendit grâce pour eux
  rationale: Luc emploie εὐλογέω, « bénir », et non εὐχαριστέω, « rendre grâce ». La traduction conserve donc la formulation propre à ce passage plutôt que de l’harmoniser avec des récits parallèles.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe évite la lourdeur de participes successifs tout en respectant l’ordre des actions. « Rompit » maintient une tonalité biblique encore naturelle; « continua à les donner » rend la valeur durative ou itérative de l’imparfait grec.
