id: LUK.9.43
reference: Luke 9:43
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐξεπλήσσοντο δὲ πάντες ἐπὶ τῇ μεγαλειότητι τοῦ θεοῦ. Πάντων δὲ θαυμαζόντων ἐπὶ πᾶσιν οἷς ⸀ἐποίει εἶπεν πρὸς τοὺς μαθητὰς αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/043.yaml
  text: 'And they were all astonished at the majesty of God. But while everyone was marveling at all that he was doing[a], he said to his disciples:'
translation:
  language: fr
  text: 'Tous étaient stupéfaits devant la grandeur de Dieu[a]. Mais, tandis que tous s’émerveillaient de tout ce qu’il faisait, il dit à ses disciples :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « la majesté de Dieu ». Le mot grec peut désigner la grandeur, la majesté ou la magnificence.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξεπλήσσοντο
  choice: étaient stupéfaits
  rationale: L’imparfait décrit une réaction qui se prolonge, et « stupéfaits » rend la vive surprise exprimée par le verbe sans alourdir la phrase.
- source_word: πάντες
  choice: Tous
  rationale: Ce choix conserve l’insistance du texte sur l’universalité de la réaction.
- source_word: ἐπὶ τῇ μεγαλειότητι τοῦ θεοῦ
  choice: devant la grandeur de Dieu
  rationale: « Devant » introduit naturellement en français ce qui provoque la stupéfaction. « Grandeur » rend directement μεγαλειότης et convient au registre courant et digne.
- source_word: Πάντων δὲ θαυμαζόντων
  choice: Mais, tandis que tous s’émerveillaient
  rationale: La proposition temporelle restitue le génitif absolu et l’imparfait. « S’émerveillaient » distingue θαυμάζω du verbe plus fort rendu auparavant par « étaient stupéfaits ».
- source_word: ἐπὶ πᾶσιν οἷς ἐποίει
  choice: de tout ce qu’il faisait
  rationale: Cette formulation idiomatique conserve l’étendue de πᾶσιν et la valeur durative de l’imparfait ἐποίει.
- source_word: εἶπεν πρὸς τοὺς μαθητὰς αὐτοῦ
  choice: il dit à ses disciples
  rationale: Formulation française naturelle et fidèle pour introduire les paroles adressées aux disciples.
theological_decisions:
- issue: Référent de « il » dans οἷς ἐποίει et εἶπεν
  choice: Le pronom « il » renvoie à Jésus, acteur immédiat et locuteur dans le contexte.
  alternative: Comprendre l’action comme mettant surtout en relief l’intervention implicite de Dieu, en raison de la mention précédente de « la grandeur de Dieu ».
  rationale: Le récit présente Jésus comme celui qui agit puis parle, tout en attribuant à Dieu la grandeur manifestée. La traduction conserve ainsi cette articulation sans identifier ni opposer artificiellement les deux.
translation_notes:
  register: Français international moderne, naturel et digne. La répétition de « tous » est maintenue parce qu’elle correspond à la reprise emphatique du grec. « Grandeur » est plus immédiatement accessible que « majesté », cette dernière étant signalée en note.
