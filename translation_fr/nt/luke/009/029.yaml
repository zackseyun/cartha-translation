id: LUK.9.29
reference: Luke 9:29
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἐγένετο ἐν τῷ προσεύχεσθαι αὐτὸν τὸ εἶδος τοῦ προσώπου αὐτοῦ ἕτερον καὶ ὁ ἱματισμὸς αὐτοῦ λευκὸς ἐξαστράπτων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/029.yaml
  text: And as he was praying[a], the appearance of his face became different, and his clothing became white[b], flashing like lightning.
translation:
  language: fr
  text: Pendant qu’il priait, l’aspect de son visage devint différent[a], et son vêtement devint blanc, étincelant comme l’éclair[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « l’aspect de son visage fut changé ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « son vêtement devint blanc et éblouissant » ; le participe grec évoque l’éclat de l’éclair.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ἐν τῷ προσεύχεσθαι αὐτὸν
  choice: Pendant qu’il priait
  rationale: La construction lucanienne introduit un événement survenu au cours de la prière. Cette formulation restitue naturellement la simultanéité sans conserver le tour lourd « il arriva que ».
- source_word: τὸ εἶδος τοῦ προσώπου αὐτοῦ
  choice: l’aspect de son visage
  rationale: εἶδος désigne ici l’apparence visible, et πρόσωπον le visage. « L’aspect de son visage » est précis et naturel en français moderne.
- source_word: ἕτερον
  choice: devint différent
  rationale: ἕτερον signifie littéralement « autre, différent ». Le verbe « devint », fourni par la construction avec ἐγένετο, exprime le changement sans emprunter aux récits parallèles une formulation plus explicite.
- source_word: ὁ ἱματισμὸς αὐτοῦ
  choice: son vêtement
  rationale: ἱματισμός est un collectif désignant l’habillement. Le singulier « vêtement » convient au registre narratif et demeure fidèle à la forme grecque.
- source_word: λευκὸς ἐξαστράπτων
  choice: blanc, étincelant comme l’éclair
  rationale: λευκός signifie « blanc », tandis que ἐξαστράπτων évoque vivement l’éclat ou le jaillissement de l’éclair. La formulation conserve les deux éléments sans réduire le participe à la seule idée d’éblouissement.
theological_decisions:
- issue: Description de la transfiguration de Jésus
  choice: Décrire un changement visible de l’aspect de son visage sans préciser qu’il rayonnait.
  alternative: « son visage fut transformé » ou « son visage se mit à resplendir »
  rationale: Luc parle sobrement d’un aspect devenu « autre/différent ». La traduction préserve cette retenue et n’harmonise pas le verset avec les formulations des autres Évangiles.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe reste fluide tout en conservant la formulation propre à Luc et l’image vive de l’éclair.
