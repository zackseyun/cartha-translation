id: LUK.9.21
reference: Luke 9:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ὁ δὲ ἐπιτιμήσας αὐτοῖς παρήγγειλεν μηδενὶ ⸀λέγειν τοῦτο,
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/021.yaml
  text: But he rebuked them and commanded them to tell this to no one,[a]
translation:
  language: fr
  text: Mais il les reprit sévèrement et leur ordonna de ne dire cela à personne[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « il les avertit fermement et leur ordonna de ne dire cela à personne ».
    reason: ἐπιτιμάω peut, selon le contexte, exprimer soit une réprimande, soit un avertissement formulé avec sévérité.
lexical_decisions:
- source_word: δὲ
  choice: Mais
  rationale: La conjonction marque ici un léger contraste entre la confession qui précède et la réaction de Jésus.
- source_word: ἐπιτιμήσας
  choice: les reprit sévèrement
  rationale: Le participe aoriste exprime une parole ferme pouvant aller du reproche à l’avertissement sévère. « Les reprit sévèrement » conserve cette force sans rendre la phrase artificielle en français.
- source_word: αὐτοῖς
  choice: les / leur
  rationale: Le pronom renvoie aux disciples. Sa relation avec ἐπιτιμήσας est rendue idiomatiquement par « les », puis avec παρήγγειλεν par « leur ».
- source_word: παρήγγειλεν
  choice: leur ordonna
  rationale: Le verbe désigne une directive donnée avec autorité; « ordonna » en restitue clairement la force.
- source_word: μηδενὶ
  choice: à personne
  rationale: Le datif de μηδείς désigne ici le destinataire de la parole, sous la portée de la négation.
- source_word: λέγειν
  choice: de dire
  rationale: Avec τοῦτο comme contenu et μηδενί comme destinataire, « dire cela à personne » est naturel et reste proche de la formulation grecque.
- source_word: τοῦτο
  choice: cela
  rationale: Le démonstratif renvoie à la confession de Pierre dans le contexte immédiat, sans que la traduction explicite davantage son contenu.
theological_decisions:
- issue: Force de l’interdiction prononcée après la confession de Pierre
  choice: Une interdiction ferme de divulguer cette confession à ce moment du récit
  alternative: Un simple avertissement de ne pas en parler
  rationale: L’association de ἐπιτιμήσας et de παρήγγειλεν indique davantage qu’une demande légère. La formulation conserve la tension narrative sans proposer d’explication doctrinale du silence imposé.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure « reprit sévèrement » maintient la vigueur du grec tout en restant naturelle; « cela » préserve le renvoi démonstratif sans surinterprétation.
