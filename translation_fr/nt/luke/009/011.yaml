id: LUK.9.11
reference: Luke 9:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οἱ δὲ ὄχλοι γνόντες ἠκολούθησαν αὐτῷ. καὶ ⸀ἀποδεξάμενος αὐτοὺς ἐλάλει αὐτοῖς περὶ τῆς βασιλείας τοῦ θεοῦ, καὶ τοὺς χρείαν ἔχοντας θεραπείας ἰᾶτο.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/011.yaml
  text: But the crowds[a], learning of it, followed him. And welcoming them, he was speaking to them about the kingdom of God and healing those who had need of healing.
translation:
  language: fr
  text: Mais les foules, quand elles l’apprirent, le suivirent. Après leur avoir fait bon accueil, Jésus leur parlait du royaume de Dieu et guérissait ceux qui avaient besoin de soins[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ceux qui avaient besoin de guérison ». Le nom grec θεραπεία peut désigner la guérison, le traitement ou les soins.
    reason: Alternative lexicale reflétant l’étendue sémantique de θεραπεία.
lexical_decisions:
- source_word: οἱ δὲ ὄχλοι
  choice: Mais les foules
  rationale: « Mais » rend la transition légèrement contrastive de δέ, tandis que le pluriel « les foules » respecte ὄχλοι.
- source_word: γνόντες
  choice: quand elles l’apprirent
  rationale: La proposition temporelle exprime naturellement en français la valeur circonstancielle du participe aoriste, sans préciser au-delà du contexte ce que les foules apprirent.
- source_word: ἠκολούθησαν αὐτῷ
  choice: le suivirent
  rationale: Traduction directe et idiomatique, qui conserve à la fois le déplacement concret et la résonance narrative possible du verbe « suivre ».
- source_word: ἀποδεξάμενος αὐτούς
  choice: leur fit bon accueil
  rationale: Cette expression rend la réception favorable et chaleureuse portée par ἀποδέχομαι.
- source_word: ἐλάλει αὐτοῖς
  choice: leur parlait
  rationale: L’imparfait français restitue l’aspect duratif de l’imparfait grec ἐλάλει.
- source_word: περὶ τῆς βασιλείας τοῦ θεοῦ
  choice: du royaume de Dieu
  rationale: Formulation biblique établie, claire et cohérente pour βασιλεία τοῦ θεοῦ.
- source_word: τοὺς χρείαν ἔχοντας θεραπείας
  choice: ceux qui avaient besoin de soins
  rationale: « Soins » préserve la construction nominale et l’étendue sémantique de θεραπεία, qui peut désigner les soins, le traitement ou la guérison, tout en évitant une répétition maladroite avec « guérissait ».
- source_word: ἰᾶτο
  choice: guérissait
  rationale: L’imparfait rend l’activité continue ou répétée exprimée par ἰᾶτο.
theological_decisions:
- issue: Traduction de βασιλεία τοῦ θεοῦ
  choice: le royaume de Dieu
  alternative: le règne de Dieu
  rationale: « Royaume de Dieu » demeure l’expression française biblique la plus reconnue et conserve la continuité terminologique des Évangiles, sans exclure l’idée du règne actif de Dieu.
translation_notes:
  register: Français international moderne, naturel et digne. Le nom « Jésus » est repris dans la seconde phrase pour éviter une succession de pronoms potentiellement moins fluide, sans ajouter d’information au référent. Les imparfaits « parlait » et « guérissait » préservent la durée des actions grecques.
