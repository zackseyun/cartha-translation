id: LUK.9.59
reference: Luke 9:59
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἶπεν δὲ πρὸς ἕτερον· Ἀκολούθει μοι. ὁ δὲ εἶπεν· ⸀Κύριε, ἐπίτρεψόν μοι ⸂ἀπελθόντι πρῶτον⸃ θάψαι τὸν πατέρα μου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/059.yaml
  text: Then he said to another[a], “Follow me.” But he said, “Lord, permit me first to go and bury my father.”
translation:
  language: fr
  text: 'Alors il dit à un autre : « Suis-moi. » Mais celui-ci dit : « Seigneur, permets-moi d’aller d’abord enterrer mon père. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἕτερον
  choice: un autre
  rationale: Rend naturellement l’idée d’une autre personne, distincte de celle qui précède, sans ajouter de précision absente du grec.
- source_word: Ἀκολούθει μοι
  choice: Suis-moi
  rationale: Formulation française directe et idiomatique de l’impératif présent avec le pronom au datif; elle n’explicite pas excessivement l’aspect verbal.
- source_word: Κύριε
  choice: Seigneur
  rationale: Conserve à la fois la valeur d’adresse respectueuse et la possible portée christologique du titre dans le récit de Luc.
- source_word: ἐπίτρεψόν μοι
  choice: permets-moi
  rationale: Exprime clairement et dignement la demande de permission, tout en restant proche de la forme grecque.
- source_word: ἀπελθόντι πρῶτον θάψαι
  choice: d’aller d’abord enterrer
  rationale: 'Restitue naturellement la séquence demandée : partir d’abord afin d’enterrer son père.'
- source_word: τὸν πατέρα μου
  choice: mon père
  rationale: Traduction directe du groupe nominal grec.
theological_decisions:
- issue: Sens de κύριος dans l’adresse à Jésus
  choice: Seigneur
  alternative: Maître; Monsieur
  rationale: « Seigneur » préserve la tension entre une marque de respect et un titre susceptible d’avoir une portée théologique, sans imposer une seule de ces nuances.
- issue: Situation du père
  choice: Ne pas préciser s’il vient de mourir ou si le fils évoque une obligation familiale future
  alternative: Ajouter une explication dans le texte ou en note
  rationale: Le grec dit seulement « enterrer mon père ». La traduction conserve cette ambiguïté au lieu de choisir une reconstruction culturelle ou chronologique.
translation_notes:
  register: Français moderne, international et digne. « Puis » assure la continuité narrative; « celui-ci répondit » évite la répétition lourde de « il » tout en identifiant clairement l’autre homme. Aucun ajout n’explicite la situation du père.
