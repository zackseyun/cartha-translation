id: LUK.9.30
reference: Luke 9:30
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ἄνδρες δύο συνελάλουν αὐτῷ, οἵτινες ἦσαν Μωϋσῆς καὶ Ἠλίας,
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/030.yaml
  text: And behold, two men were talking with him, who were Moses and Elijah,
translation:
  language: fr
  text: 'Et voici que deux hommes parlaient avec lui : c’étaient Moïse et Élie.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: voici que
  rationale: Conserve le marqueur discursif qui attire soudainement l’attention, dans une tournure naturelle et digne en français moderne.
- source_word: ἄνδρες δύο
  choice: deux hommes
  rationale: ἀνήρ désigne ici deux figures masculines identifiables, Moïse et Élie ; « deux hommes » est précis et idiomatique.
- source_word: συνελάλουν
  choice: parlaient
  rationale: L’imparfait grec présente une conversation en cours. L’imparfait français en garde l’aspect duratif, tandis que le complément « avec lui » exprime la réciprocité.
- source_word: αὐτῷ
  choice: avec lui
  rationale: Avec συλλαλέω, le datif désigne la personne avec laquelle on parle ; « avec lui » rend clairement cette conversation réciproque.
- source_word: οἵτινες ἦσαν
  choice: c’étaient
  rationale: Cette tournure française identifie directement et naturellement les deux hommes, sans donner à οἵτινες une emphase absente du contexte.
- source_word: Μωϋσῆς
  choice: Moïse
  rationale: Forme française courante et traditionnelle du nom.
- source_word: Ἠλίας
  choice: Élie
  rationale: Forme française courante et traditionnelle du nom du prophète.
theological_decisions:
- issue: Identification des deux figures lors de la transfiguration
  choice: Le texte identifie directement les deux hommes comme Moïse et Élie.
  alternative: Ajouter une explication sur leur valeur symbolique ou eschatologique.
  rationale: Le grec donne une identification simple, sans en expliciter ici la portée théologique. La traduction n’ajoute donc aucune interprétation.
translation_notes:
  register: Français international moderne, clair et digne. « Et voici que » préserve l’enchaînement narratif καί et la mise en relief de ἰδού ; les deux-points rendent naturellement l’identification introduite par οἵτινες ἦσαν.
