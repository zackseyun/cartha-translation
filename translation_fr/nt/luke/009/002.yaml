id: LUK.9.2
reference: Luke 9:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἀπέστειλεν αὐτοὺς κηρύσσειν τὴν βασιλείαν τοῦ θεοῦ καὶ ἰᾶσθαι ⸂τοὺς ἀσθενεῖς⸃,
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/002.yaml
  text: And he sent them out to proclaim the kingdom of God and to heal the sick,[a]
translation:
  language: fr
  text: Il les envoya proclamer le royaume de Dieu[a] et guérir les malades.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le règne de Dieu ».
    reason: Alternative lexicale reflétant la portée de βασιλεία, qui peut mettre l’accent sur la souveraineté ou le règne exercé par Dieu.
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: envoya
  rationale: Le verbe ἀποστέλλω exprime ici l’envoi dans le cadre d’une mission. En français, « envoya » rend naturellement cette idée sans qu’il soit nécessaire d’ajouter « au-dehors ».
- source_word: κηρύσσειν
  choice: proclamer
  rationale: κηρύσσω désigne une annonce publique. « Proclamer » conserve cette force et évite la connotation plus spécifiquement ecclésiale de « prêcher ».
- source_word: βασιλείαν τοῦ θεοῦ
  choice: le royaume de Dieu
  rationale: Cette formulation biblique établie demeure naturelle et préserve l’étendue du concept, qui peut désigner aussi bien la royauté exercée par Dieu que son domaine royal.
- source_word: ἰᾶσθαι
  choice: guérir
  rationale: Dans ce contexte, ἰάομαι désigne la restauration de la santé. « Guérir » est l’équivalent français direct et idiomatique.
- source_word: τοὺς ἀσθενεῖς
  choice: les malades
  rationale: Bien que ἀσθενής puisse signifier plus largement « faible », le verbe « guérir » indique ici qu’il s’agit de personnes malades.
theological_decisions:
- issue: Sens de βασιλεία τοῦ θεοῦ
  choice: le royaume de Dieu
  alternative: le règne de Dieu
  rationale: « Royaume de Dieu » préserve la formulation biblique traditionnelle et la largeur sémantique du grec. « Règne de Dieu » met davantage l’accent sur l’exercice de la souveraineté divine et reste une traduction possible, signalée en note.
translation_notes:
  register: Français international moderne, sobre et digne. La coordination simple de l’original est conservée; l’infinitif « guérir » dépend naturellement de « envoya », comme « proclamer ».
