  naturalness: Le français est globalement naturel et de registre biblique moderne. « Du milieu de la foule » est à la fois idiomatique et plus précis que « dans la foule ».
  terminology: « Maître » convient ici comme forme d’adresse pour Διδάσκαλε. « Mon enfant unique » rend bien μονογενής tout en évitant une redondance après « mon fils »; l’alternative « mon fils unique » doit être conservée en note.
