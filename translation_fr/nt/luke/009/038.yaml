  text: καὶ ἰδοὺ ἀνὴρ ἀπὸ τοῦ ὄχλου ⸀ἐβόησεν λέγων· Διδάσκαλε, δέομαί σου ἐπιβλέψαι ἐπὶ τὸν υἱόν μου, ὅτι μονογενής ⸂μοί ἐστιν⸃,
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/038.yaml
  text: And behold[a], a man from the crowd cried out, saying, “Teacher, I beg you to look upon my son, because he is my only child.”
translation:
  language: fr
  text: 'Et voici qu’un homme, du milieu de la foule, s’écria : « Maître, je t’en supplie, porte ton regard sur mon fils, car c’est mon enfant unique[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « mon fils unique ». Le grec dit littéralement qu’il est pour lui « l’unique » ; puisque l’enfant vient déjà d’être désigné comme son fils, les deux traductions sont possibles.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: voici que
  rationale: Conserve la fonction de mise en relief et d’appel à l’attention de ἰδού, tout en employant une tournure narrative naturelle en français moderne.
- source_word: ἀνὴρ ἀπὸ τοῦ ὄχλου
  choice: un homme dans la foule
  rationale: ἀνήρ désigne explicitement un homme. Dans ce contexte, ἀπό indique qu’il prend la parole depuis le milieu de la foule; « dans la foule » est plus naturel en français que le calque « de la foule ».
- source_word: ἐβόησεν λέγων
  choice: s’écria
  rationale: Le verbe exprime un appel prononcé à haute voix et avec urgence. En français, « s’écria » intègre naturellement le participe λέγων sans l’alourdir par « en disant ».
- source_word: Διδάσκαλε
  choice: Maître
  rationale: Dans une adresse directe, « Maître » est l’équivalent français courant de διδάσκαλος au sens d’enseignant reconnu; le contexte n’exige pas de nuance doctrinale supplémentaire.
- source_word: δέομαί σου
  choice: je t’en supplie
  rationale: Rend la demande pressante et insistante exprimée par δέομαι, plus forte qu’une simple requête.
- source_word: ἐπιβλέψαι ἐπὶ
  choice: porte ton regard sur
  rationale: Préserve l’idée d’un regard attentif et bienveillant, et non celle d’un simple coup d’œil. La formulation reste digne et compréhensible.
- source_word: τὸν υἱόν μου
  choice: mon fils
  rationale: Traduction directe et non ambiguë de l’expression grecque.
- source_word: μονογενής μοί ἐστιν
  choice: c’est mon enfant unique
  rationale: Le grec souligne qu’il est l’unique enfant de cet homme. Comme le sexe de l’enfant vient déjà d’être indiqué par « mon fils », cette formulation restitue clairement la portée de μονογενής sans redondance.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement correspond à l’adresse directe normale en français biblique actuel. « Voici que » conserve la mise en relief narrative de Luc, tandis que « porte ton regard sur » maintient la nuance d’attention implorée par le père.
