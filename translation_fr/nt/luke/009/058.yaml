id: LUK.9.58
reference: Luke 9:58
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτῷ ὁ Ἰησοῦς· Αἱ ἀλώπεκες φωλεοὺς ἔχουσιν καὶ τὰ πετεινὰ τοῦ οὐρανοῦ κατασκηνώσεις, ὁ δὲ υἱὸς τοῦ ἀνθρώπου οὐκ ἔχει ποῦ τὴν κεφαλὴν κλίνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/058.yaml
  text: And Jesus said to him[a], “Foxes have dens, and the birds of the sky have nests[c][b], but the Son of Man has nowhere to lay his head.”
translation:
  language: fr
  text: 'Jésus lui dit : « Les renards ont des terriers[a] et les oiseaux du ciel ont des nids[b], mais le Fils de l’homme[c] n’a nulle part où poser la tête. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des repaires ».
    reason: lexical_alternative
  - marker: b
    text: Le mot grec désigne plus largement des lieux où se poser ou séjourner.
    reason: lexical_alternative
  - marker: c
    text: « Fils de l’homme » est une auto-désignation de Jésus qui peut faire écho à Daniel 7.13-14.
    reason: cross_reference
lexical_decisions:
- source_word: ἀλώπεκες
  choice: les renards
  rationale: Terme animalier direct et naturel en français, sans raison contextuelle de le généraliser.
- source_word: φωλεούς
  choice: des terriers
  rationale: Le mot désigne des repaires ou abris d’animaux. « Terriers » est idiomatique pour les renards et conserve l’image concrète.
- source_word: πετεινὰ τοῦ οὐρανοῦ
  choice: les oiseaux du ciel
  rationale: Rendu proche du grec et naturel en français moderne ; « ciel » conserve directement le sens de οὐρανός.
- source_word: κατασκηνώσεις
  choice: des nids
  rationale: Le nom désigne des lieux où l’on s’établit ou séjourne. Dans le contexte des oiseaux, « nids » est le terme français le plus naturel, tout en étant légèrement plus précis que le grec.
- source_word: υἱὸς τοῦ ἀνθρώπου
  choice: le Fils de l’homme
  rationale: Formulation française consacrée qui traduit le titre sans le paraphraser et en préserve les résonances possibles.
- source_word: οὐκ ἔχει ποῦ
  choice: n’a nulle part où
  rationale: Rend naturellement en français l’expression grecque négative signifiant qu’il n’existe aucun endroit disponible.
- source_word: τὴν κεφαλὴν κλίνῃ
  choice: poser la tête
  rationale: Expression française naturelle qui garde l’image concrète du grec et suggère le repos sans l’expliciter davantage.
- source_word: δὲ
  choice: mais
  rationale: Marque clairement le contraste entre les animaux qui disposent d’un abri et le Fils de l’homme qui n’en a pas.
- source_word: εἶπεν αὐτῷ ὁ Ἰησοῦς
  choice: Jésus lui dit
  rationale: Rendu direct, courant et fidèle de l’introduction narrative grecque.
theological_decisions:
- issue: Traduction de l’auto-désignation de Jésus υἱὸς τοῦ ἀνθρώπου
  choice: le Fils de l’homme
  alternative: l’Humain
  rationale: La formulation reconnue maintient à la fois le sens littéral, le caractère d’auto-désignation et l’éventuel écho à Daniel 7.13-14, sans imposer une interprétation dans le texte.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase reste concise et conserve le contraste ainsi que l’image du dénuement, sans transformer celle-ci en explication théologique.
