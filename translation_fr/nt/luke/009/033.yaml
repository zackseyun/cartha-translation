id: LUK.9.33
reference: Luke 9:33
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἐγένετο ἐν τῷ διαχωρίζεσθαι αὐτοὺς ἀπ’ αὐτοῦ εἶπεν ⸀ὁ Πέτρος πρὸς τὸν Ἰησοῦν· Ἐπιστάτα, καλόν ἐστιν ἡμᾶς ὧδε εἶναι, καὶ ποιήσωμεν σκηνὰς τρεῖς, μίαν σοὶ καὶ μίαν Μωϋσεῖ καὶ μίαν Ἠλίᾳ, μὴ εἰδὼς ὃ λέγει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/033.yaml
  text: 'And as they were departing from him[a], Peter said to Jesus, “Master, it is good for us to be here. Let us make three shelters: one for you, one for Moses, and one for Elijah” — not knowing what he was saying.'
translation:
  language: fr
  text: 'Au moment où ils se séparaient de lui, Pierre dit à Jésus : « Maître, il est bon que nous soyons ici. Dressons trois abris[a] : un pour toi, un pour Moïse et un pour Élie. » Il ne savait pas ce qu’il disait.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tentes », « huttes » ou, selon la traduction traditionnelle, « tabernacles ». Le grec désigne des abris temporaires et peut évoquer les images bibliques associées à la fête des Tentes.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ἐν τῷ διαχωρίζεσθαι αὐτοὺς ἀπ’ αὐτοῦ
  choice: Au moment où ils se séparaient de lui
  rationale: La tournure narrative ἐγένετο ἐν τῷ avec infinitif situe une action simultanée. « Au moment où » est naturel en français, tandis que « se séparaient de lui » conserve explicitement l’idée de séparation de Moïse et d’Élie d’avec Jésus.
- source_word: Ἐπιστάτα
  choice: Maître
  rationale: Ce titre propre à Luc dans le Nouveau Testament exprime une adresse respectueuse reconnaissant l’autorité de Jésus, sans le confondre simplement avec διδάσκαλος, « enseignant ».
- source_word: καλόν ἐστιν ἡμᾶς ὧδε εἶναι
  choice: il est bon que nous soyons ici
  rationale: Cette formulation rend directement l’évaluation exprimée par καλόν et transpose naturellement en français la construction infinitive grecque.
- source_word: ποιήσωμεν
  choice: Dressons
  rationale: Le subjonctif exhortatif propose une action commune. Avec des abris ou des tentes, « dresser » est idiomatique et évite de supposer des constructions durables.
- source_word: σκηνὰς
  choice: abris
  rationale: Le terme désigne des abris temporaires ou des tentes. « Abris » est clair et contemporain, sans imposer dans le texte principal une identification précise avec la fête des Tentes ou le tabernacle.
- source_word: μὴ εἰδὼς ὃ λέγει
  choice: Il ne savait pas ce qu’il disait
  rationale: Cette proposition rend l’explication apportée par le participe et conserve l’idée que Pierre ne saisissait pas la portée de ses paroles, sans substituer explicitement « comprendre » au verbe « savoir ».
theological_decisions:
- issue: Portée possible de σκηνάς dans le récit de la transfiguration
  choice: abris
  alternative: tentes ; huttes ; traditionnellement, tabernacles
  rationale: Le contexte peut évoquer des images bibliques liées aux tentes ou à la fête des Tentes, mais le verset ne formule pas explicitement ce lien. Le texte principal reste donc neutre, et la note préserve les autres possibilités ainsi que leur résonance.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe narrative est fluide, les noms propres suivent les formes françaises usuelles, et la formulation conserve l’ambiguïté du type exact d’abri.
