source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς ⸀εἰδὼς τὸν διαλογισμὸν τῆς καρδίας αὐτῶν ἐπιλαβόμενος ⸀παιδίον ἔστησεν αὐτὸ παρ’ ἑαυτῷ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/047.yaml
  text: But Jesus[a], knowing the reasoning of their hearts, took a child and set him beside himself[b],
translation:
  language: fr
  text: Mais Jésus, sachant quel raisonnement habitait leur cœur[a], prit un enfant et le fit se tenir à côté de lui[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « sachant ce qu’ils pensaient au fond d’eux-mêmes ». Le grec dit littéralement « le raisonnement de leur cœur », avec « cœur » au singulier et un possesseur au pluriel.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « le plaça près de lui ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδὼς
  choice: connaissant
  rationale: Le participe exprime ici une connaissance ou une perception intérieure. « Connaissant » affirme que Jésus savait ce qui se passait en eux sans préciser par quel moyen.
- source_word: διαλογισμὸν
  choice: le raisonnement
  rationale: Le singulier grec peut désigner le raisonnement intérieur ou la réflexion qui animait les disciples. « Raisonnement » conserve mieux cette nuance délibérative que le terme plus général « pensée ».
- source_word: τῆς καρδίας αὐτῶν
  choice: de leur cœur
  rationale: Cette formulation reproduit le singulier grec καρδίας associé au possesseur pluriel αὐτῶν. En français biblique courant, le cœur désigne naturellement le siège intérieur des pensées et des dispositions.
- source_word: ἐπιλαβόμενος
  choice: prit
  rationale: Le verbe indique que Jésus se saisit de l’enfant ou le prit avec lui. « Prit » reste concret et naturel sans ajouter qu’il l’aurait pris par la main ou dans ses bras.
- source_word: παιδίον
  choice: un enfant
  rationale: « Enfant » est le correspondant français direct et n’ajoute pas une précision d’âge absente du contexte immédiat.
- source_word: ἔστησεν
  choice: le fit se tenir
  rationale: La forme causative signifie que Jésus fit tenir ou plaça l’enfant debout. Cette traduction préserve l’image du verbe grec tout en restant idiomatique.
- source_word: παρ’ ἑαυτῷ
  choice: à côté de lui
  rationale: L’expression situe l’enfant auprès de Jésus. « À côté de lui » est clair en français et évite toute ambiguïté sur le référent.
theological_decisions:
- issue: La connaissance par Jésus du raisonnement intérieur des disciples
  choice: Le texte affirme simplement que Jésus connaissait leur raisonnement intérieur.
  alternative: Préciser qu’il le connaissait soit par omniscience surnaturelle, soit par une fine perception humaine.
  rationale: Luc ne précise pas ici le mode de cette connaissance. La traduction conserve donc l’affirmation du texte sans trancher la question théologique.
translation_notes:
  register: Français international moderne, digne et accessible. La construction participiale conserve le mouvement de la phrase grecque. « Leur cœur » garde le singulier collectif de la source, tandis que « le fit se tenir » restitue sans raideur la valeur causative de ἔστησεν.
