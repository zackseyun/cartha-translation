reference: Luke 9:60
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἶπεν δὲ ⸀αὐτῷ· Ἄφες τοὺς νεκροὺς θάψαι τοὺς ἑαυτῶν νεκρούς, σὺ δὲ ἀπελθὼν διάγγελλε τὴν βασιλείαν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/060.yaml
  text: But he said to him[a], “Leave the dead to bury their own dead, but you, go and proclaim the kingdom of God.”
translation:
  language: fr
  text: 'Mais il lui dit : « Laisse les morts[a] enterrer leurs propres morts ; mais toi, va proclamer le royaume de Dieu. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La première occurrence de « morts » est probablement employée au sens figuré pour parler de personnes spirituellement insensibles, tandis que la seconde désigne ceux qui sont physiquement morts. Le grec emploie le même mot dans les deux cas, effet que la traduction conserve.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἄφες
  choice: Laisse
  rationale: L’impératif aoriste commande ici de renoncer à la tâche demandée. « Laisse » est direct, naturel et conserve la force concise du grec.
- source_word: τοὺς νεκροὺς ... τοὺς ἑαυτῶν νεκρούς
  choice: les morts ... leurs propres morts
  rationale: La répétition du même terme est conservée afin de maintenir le paradoxe frappant du grec, sans expliciter dans le texte le sens probablement figuré de la première occurrence.
- source_word: θάψαι
  choice: enterrer
  rationale: Ce verbe courant exprime clairement l’action funéraire et convient comme complément de « laisse ».
- source_word: ἑαυτῶν
  choice: leurs propres
  rationale: « Propres » restitue la valeur réfléchie et emphatique du pronom grec.
- source_word: ἀπελθὼν
  choice: va
  rationale: Bien que le grec emploie un participe aoriste, la séquence française naturelle « va proclamer » rend clairement le déplacement préalable sans la lourdeur de « après être parti ».
- source_word: διάγγελλε
  choice: proclamer
  rationale: Le présent impératif désigne une annonce publique et suivie. « Proclamer » restitue bien cette dimension.
- source_word: βασιλείαν τοῦ θεοῦ
  choice: le royaume de Dieu
  rationale: Cette formulation française consacrée conserve à la fois l’idée du règne souverain de Dieu et l’expression biblique reconnaissable.
theological_decisions:
- issue: Sens des deux occurrences de « morts »
  choice: Conserver « les morts » dans les deux occurrences sans préciser les deux sens dans le texte principal.
  alternative: « Laisse ceux qui sont spirituellement morts enterrer leurs propres morts. »
  rationale: La première occurrence est probablement figurée et la seconde littérale, mais le grec emploie exactement le même mot. La traduction préserve donc le paradoxe et la tension interprétative de la parole de Jésus.
translation_notes:
  register: Français international moderne, naturel et digne. Le contraste marqué par σὺ δὲ est rendu par « mais toi ». Le point-virgule clarifie l’opposition entre les deux injonctions sans atténuer la vigueur de la parole.
