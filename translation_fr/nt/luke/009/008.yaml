revisions:
- from: d’autres, qu’Élie était apparu, et d’autres encore, qu’un prophète d’autrefois était ressuscité.[a]
  to: par certains, qu’Élie était apparu ; par d’autres, qu’un prophète d’autrefois était ressuscité.[a]
  rationale: La correction remplace le premier « d’autres » par « par certains » et rétablit « par » dans les deux membres, conformément à ὑπό τινων ... ἄλλων. Elle préserve le caractère elliptique du verset, lié à l’énumération du contexte précédent, ainsi que l’ambiguïté non identifiée de « un prophète d’autrefois ».
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T10:53:33Z'
review_pass:
  verdict: revise
  source_fidelity: La répétition grecque ὑπό τινων ... ἄλλων δὲ distingue « certains » puis « d’autres ». Le projet traduit les deux groupes par « d’autres », ce qui efface le premier référent. La révision restitue l’ellipse et la distinction des sources de l’opinion. « était apparu » pour ἐφάνη et « était ressuscité » pour ἀνέστη sont fidèles au contraste verbal du grec.
  naturalness: « Par certains ... ; par d’autres ... » est une ellipse naturelle en français dans la continuité syntaxique du verset précédent. Le point-virgule rend clairement les deux membres sans alourdir le texte. « Un prophète d’autrefois » est idiomatique et ne présume pas l’identité du prophète.
  terminology: « Élie » est la forme française usuelle. « Ressuscité » exprime adéquatement la portée de ἀνέστη dans ce contexte sans ajouter d’agent ni cautionner l’affirmation rapportée. La note conserve une possibilité explicative sans imposer une identification particulière.
  issues:
  - severity: medium
    issue: Le premier groupe de personnes est rendu par « d’autres » au lieu de « certains ».
    rationale: ὑπό τινων δὲ signifie « par certains », tandis que ἄλλων δὲ introduit ensuite « par d’autres ». « D’autres ... d’autres encore » ne reproduit pas cette opposition binaire et laisse entendre, à tort, que les deux groupes sont seulement des groupes additionnels.
  revised_text: par certains, qu’Élie était apparu ; par d’autres, qu’un prophète d’autrefois était ressuscité.[a]
