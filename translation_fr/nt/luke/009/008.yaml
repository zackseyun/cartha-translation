source:
  edition: SBLGNT
  text: ὑπό τινων δὲ ὅτι Ἠλίας ἐφάνη, ἄλλων δὲ ὅτι προφήτης ⸀τις τῶν ἀρχαίων ἀνέστη.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/008.yaml
  text: and by some[a], that Elijah had appeared, and by others, that a prophet of the ancients had risen.
translation:
  language: fr
  text: par certains, qu’Élie était apparu ; par d’autres, qu’un prophète d’autrefois était ressuscité.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « qu’un des anciens prophètes était ressuscité ».'
    reason: Alternative plus explicite pour la relation exprimée par προφήτης τις τῶν ἀρχαίων.
lexical_decisions:
- source_word: ὑπό τινων … ἄλλων
  choice: d’autres … d’autres encore
  rationale: La tournure reprend elliptiquement la liste d’opinions commencée au verset précédent. « D’autres … d’autres encore » exprime naturellement en français les différentes sources de ces propos.
- source_word: δὲ
  choice: rendu par l’enchaînement « d’autres »
  rationale: Ici, δέ relie un nouvel élément à une énumération sans marquer une forte opposition; l’ajout d’une conjonction serait lourd en français.
- source_word: Ἠλίας
  choice: Élie
  rationale: Forme française traditionnelle et courante du nom du prophète.
- source_word: ἐφάνη
  choice: était apparu
  rationale: Le verbe signifie ici « devenir visible, apparaître ». Le plus-que-parfait convient au discours indirect et le distingue du verbe de résurrection qui suit.
- source_word: προφήτης τις τῶν ἀρχαίων
  choice: un prophète d’autrefois
  rationale: Cette formulation française naturelle conserve l’indétermination de τις et la référence à un prophète appartenant aux temps anciens, sans suggérer qu’il serait le prophète des personnes âgées.
- source_word: ἀνέστη
  choice: était ressuscité
  rationale: Dans ce contexte, ἀνίστημι évoque le retour à la vie d’un prophète mort. « Était ressuscité » transmet clairement cette portée sans préciser explicitement un agent.
theological_decisions:
- issue: Nature de l’affirmation concernant le prophète ancien
  choice: était ressuscité
  alternative: s’était relevé; était revenu
  rationale: Le contexte porte sur l’idée qu’un prophète des temps passés serait revenu d’entre les morts. La traduction garde cette affirmation rapportée sans l’approuver ni identifier le prophète.
- issue: Différence entre Élie et le prophète d’autrefois
  choice: était apparu / était ressuscité
  alternative: était revenu dans les deux propositions
  rationale: Le grec emploie deux verbes distincts. La traduction maintient la différence entre l’apparition attribuée à Élie et la résurrection attribuée à un prophète ancien.
translation_notes:
  register: Français international moderne, clair et digne. Le verset demeure une proposition elliptique rattachée au contexte précédent; la répétition « d’autres … d’autres encore » rend cette continuité intelligible. Le marqueur de note est placé après la proposition qu’il concerne.
