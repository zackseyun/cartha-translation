    text: 'Ou : « qu’un des anciens prophètes était ressuscité ».'
    reason: Alternative plus explicite pour la relation exprimée par προφήτης τις τῶν ἀρχαίων.
  revision_rationale: La correction remplace le premier « d’autres » par « par certains » et rétablit « par » dans les deux membres, conformément à ὑπό τινων ... ἄλλων. Elle préserve le caractère elliptique du verset, lié à l’énumération du contexte précédent, ainsi que l’ambiguïté non identifiée de « un prophète d’autrefois ».
