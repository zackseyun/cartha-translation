id: LUK.9.42
reference: Luke 9:42
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἔτι δὲ προσερχομένου αὐτοῦ ἔρρηξεν αὐτὸν τὸ δαιμόνιον καὶ συνεσπάραξεν· ἐπετίμησεν δὲ ὁ Ἰησοῦς τῷ πνεύματι τῷ ἀκαθάρτῳ, καὶ ἰάσατο τὸν παῖδα καὶ ἀπέδωκεν αὐτὸν τῷ πατρὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/042.yaml
  text: But while he was still coming near[a], the demon threw him down and convulsed him. But Jesus rebuked the unclean spirit, healed the boy, and gave him back to his father.
translation:
  language: fr
  text: Mais tandis qu’il s’approchait encore, le démon le jeta à terre et le fit entrer en convulsions. Jésus réprimanda alors l’esprit impur, guérit le garçon et le rendit à son père[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le remit à son père ».'
    reason: Alternative lexicale pour ἀπέδωκεν, qui peut exprimer le fait de rendre ou de remettre quelqu’un.
lexical_decisions:
- source_word: ἔτι δὲ προσερχομένου αὐτοῦ
  choice: Mais tandis qu’il s’approchait encore
  rationale: Le génitif absolu exprime une action simultanée, et « encore » rend ἔτι. Le pronom « il » conserve sans la préciser davantage la référence de αὐτοῦ, comprise naturellement dans le contexte comme le garçon.
- source_word: ἔρρηξεν αὐτὸν
  choice: le jeta à terre
  rationale: Dans ce contexte, ῥήγνυμι décrit une projection violente au sol ; cette formulation est claire et naturelle en français.
- source_word: τὸ δαιμόνιον
  choice: le démon
  rationale: C’est l’équivalent direct de δαιμόνιον et il maintient la distinction lexicale avec « l’esprit impur » dans la suite du verset.
- source_word: συνεσπάραξεν
  choice: le fit entrer en convulsions
  rationale: Le verbe décrit de violents spasmes provoqués chez le garçon. La tournure française exprime clairement le caractère causatif de l’action.
- source_word: ἐπετίμησεν
  choice: réprimanda
  rationale: Le verbe désigne ici une parole de réprobation et d’autorité adressée à l’esprit ; « réprimanda » reste fidèle sans ajouter un ordre non formulé dans le texte.
- source_word: τῷ πνεύματι τῷ ἀκαθάρτῳ
  choice: l’esprit impur
  rationale: « Impur » rend le champ moral et rituel de ἀκάθαρτος dans un français actuel, tout en conservant la désignation personnelle du texte.
- source_word: ἰάσατο τὸν παῖδα
  choice: guérit le garçon
  rationale: ἰάομαι signifie guérir, tandis que παῖς désigne ici un jeune garçon. Ce choix est précis sans remplacer le terme par « fils », que le grec n’emploie pas à cet endroit.
- source_word: ἀπέδωκεν αὐτὸν τῷ πατρὶ αὐτοῦ
  choice: le rendit à son père
  rationale: ἀποδίδωμι exprime ici l’idée de rendre ou de remettre quelqu’un à celui auquel il est lié ; « rendit » souligne sobrement la restauration.
theological_decisions:
- issue: Présentation de l’affliction démoniaque
  choice: Conserver les désignations personnelles « démon » et « esprit impur »
  alternative: Employer des formulations impersonnelles telles que « force mauvaise » ou réduire la scène à une affection physique
  rationale: Le grec présente explicitement un agent démoniaque personnel auquel Jésus s’adresse avec autorité. Il affirme aussi que Jésus guérit le garçon ; la traduction maintient donc ensemble les dimensions d’exorcisme et de guérison sans les confondre ni les réduire l’une à l’autre.
translation_notes:
  register: Français international moderne, narratif et digne. Les phrases restent accessibles, avec un vocabulaire biblique courant mais non archaïque. La variation « démon » / « esprit impur » reproduit celle du grec.
