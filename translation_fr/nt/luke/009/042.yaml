  source_fidelity: 'Le texte français rend fidèlement la succession des actions du grec : pendant que le garçon s’approche encore, le démon le jette à terre et provoque des convulsions ; Jésus réprimande l’esprit impur, guérit le garçon et le rend à son père. La distinction grecque entre « démon » (δαιμόνιον) et « esprit impur » (πνεῦμα ἀκάθαρτον) est préservée sans suggérer qu’il s’agirait de deux agents distincts.'
