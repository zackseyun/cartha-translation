id: LUK.9.41
reference: Luke 9:41
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν· Ὦ γενεὰ ἄπιστος καὶ διεστραμμένη, ἕως πότε ἔσομαι πρὸς ὑμᾶς καὶ ἀνέξομαι ὑμῶν; προσάγαγε ⸂ὧδε τὸν υἱόν σου⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/041.yaml
  text: But Jesus answered, “O unbelieving and twisted generation, how long will I be with you and bear with you? Bring your son here.”
translation:
  language: fr
  text: 'Mais Jésus répondit : « Génération incrédule et pervertie, jusqu’à quand serai-je avec vous et vous supporterai-je ? Amène ton fils ici. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄπιστος
  choice: incrédule
  rationale: Rend directement l’idée d’absence de foi ou de confiance, dans un français courant et digne.
- source_word: διεστραμμένη
  choice: pervertie
  rationale: Le participe exprime ce qui a été déformé ou détourné; « pervertie » conserve la portée morale du reproche sans l’atténuer.
- source_word: ἀνέξομαι ὑμῶν
  choice: vous supporterai-je
  rationale: Reproduit le sens de tolérer ou endurer des personnes, ainsi que le parallélisme avec « serai-je avec vous ».
- source_word: προσάγαγε ὧδε
  choice: Amène… ici
  rationale: Impératif naturel en français qui conserve explicitement l’indication de lieu.
theological_decisions:
- issue: Portée de « génération » et du pluriel « vous »
  choice: Maintenir l’adresse collective sans préciser davantage ses destinataires
  alternative: Interpréter explicitement le reproche comme visant seulement les disciples, la foule ou le père
  rationale: Le texte grec laisse ouverte la portée exacte du reproche; la traduction ne doit pas résoudre cette tension.
translation_notes:
  register: Français international moderne, direct et solennel. L’interjection grecque Ὦ n’est pas rendue par « Ô », jugé inutilement archaïsant; la force du reproche demeure dans l’apostrophe « Génération incrédule et pervertie ».
