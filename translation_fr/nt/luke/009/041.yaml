  source_fidelity: 'Le texte rend fidèlement les éléments essentiels du grec : l’apostrophe collective (« Génération »), ἄπιστος (« incrédule »), διεστραμμένη (« pervertie »), les deux futurs rhétoriques, le pluriel « vous », et l’impératif singulier adressé au père (« Amène ton fils ici »). « Pervertie » est une traduction défendable de διεστραμμένη et ne dépend pas du choix anglais « twisted ».'
