source:
  edition: SBLGNT
  text: τί γὰρ ὠφελεῖται ἄνθρωπος κερδήσας τὸν κόσμον ὅλον ἑαυτὸν δὲ ἀπολέσας ἢ ζημιωθείς;
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/025.yaml
  text: For what does a man profit if he gains the whole world[a], but loses or forfeits himself?
translation:
  language: fr
  text: En effet, quel avantage quelqu’un retire-t-il s’il gagne le monde entier, mais se perd lui-même[a] ou se voit privé de lui-même ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « sa vie » ou « son âme ». Le grec dit littéralement « lui-même » : il emploie le pronom réfléchi plutôt que les mots habituels pour « âme » ou « vie ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τί γὰρ ὠφελεῖται
  choice: En effet, quel avantage … retire-t-il
  rationale: Cette formulation naturelle conserve la valeur explicative de γάρ et présente la question rhétorique en termes de bénéfice ou d’avantage.
- source_word: ἄνθρωπος
  choice: quelqu’un
  rationale: Dans ce contexte, le nom grec désigne de façon générique toute personne; « quelqu’un » rend cette portée générale en français courant sans suggérer que seuls les hommes sont visés.
- source_word: κερδήσας τὸν κόσμον ὅλον
  choice: s’il gagne le monde entier
  rationale: La proposition conditionnelle exprime clairement la circonstance hypothétique portée par le participe aoriste, tandis que « le monde entier » conserve l’ampleur de l’expression grecque.
- source_word: ἑαυτὸν … ἀπολέσας
  choice: se perd lui-même
  rationale: Le pronom réfléchi signifie littéralement « lui-même », et ἀπόλλυμι exprime ici la perte ou la ruine de sa propre personne.
- source_word: ἢ ζημιωθείς
  choice: ou subit une perte
  rationale: Cette formulation garde la valeur passive du participe et sa nuance distincte de préjudice ou de perte subie, sans l’assimiler entièrement au verbe précédent.
theological_decisions:
- issue: Portée anthropologique de ἑαυτόν
  choice: lui-même
  alternative: sa vie / son âme
  rationale: Le texte grec emploie le pronom réfléchi et non ψυχή. « Lui-même » préserve donc la référence à la personne tout entière sans réduire le propos à la vie physique ni à une âme immatérielle.
- issue: Rapport entre ἀπολέσας et ζημιωθείς
  choice: se perd lui-même ou subit une perte
  alternative: perd ou sacrifie son âme
  rationale: Le « ou » et les deux verbes sont maintenus afin de ne pas effacer leur tension ni de préciser au-delà du grec la nature exacte de la seconde perte.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. La tournure « quelqu’un » exprime naturellement la portée générique de ἄνθρωπος; « subit une perte » conserve volontairement une légère indétermination présente dans le grec.
