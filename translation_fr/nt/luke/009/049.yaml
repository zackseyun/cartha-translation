id: LUK.9.49
reference: Luke 9:49
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἀποκριθεὶς ⸀δὲ Ἰωάννης εἶπεν· Ἐπιστάτα, εἴδομέν τινα ⸀ἐν τῷ ὀνόματί σου ἐκβάλλοντα δαιμόνια, καὶ ⸀ἐκωλύομεν αὐτὸν ὅτι οὐκ ἀκολουθεῖ μεθ’ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/049.yaml
  text: Then John answered[a], “Master, we saw someone casting out demons in your name, and we tried to stop him because he does not follow with us.”
translation:
  language: fr
  text: 'Jean répondit alors : « Maître, nous avons vu quelqu’un chasser des démons en ton nom, et nous avons essayé de l’en empêcher, parce qu’il ne te suit pas avec nous[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « parce qu’il ne suit pas avec nous ». Autre traduction possible : « parce qu’il ne nous suit pas » ; le grec peut souligner qu’il ne faisait pas partie du groupe des disciples.'
    reason: La formulation grecque avec « avec nous » est inhabituelle en français et laisse une certaine tension entre le fait de suivre Jésus et celui de se joindre au groupe des disciples.
lexical_decisions:
- source_word: Ἀποκριθεὶς δὲ
  choice: Jean répondit alors
  rationale: Cette tournure rend la transition narrative et le caractère réactif du propos. « Alors » exprime naturellement δέ dans ce contexte sans lui donner une opposition trop forte.
- source_word: Ἐπιστάτα
  choice: Maître
  rationale: Chez Luc, ἐπιστάτης est une adresse caractéristique des disciples à Jésus qui souligne son autorité et sa direction, et non seulement son rôle d’enseignant.
- source_word: εἴδομέν τινα
  choice: nous avons vu quelqu’un
  rationale: τινα est indéfini. « Quelqu’un » est l’équivalent français courant et n’ajoute aucune précision inutile.
- source_word: ἐν τῷ ὀνόματί σου
  choice: en ton nom
  rationale: L’expression indique que l’action est accomplie en invoquant le nom de Jésus ou sous son autorité. La formulation française conserve à la fois l’idiome et sa portée théologique.
- source_word: ἐκβάλλοντα δαιμόνια
  choice: chasser des démons
  rationale: Dans un contexte d’exorcisme, ἐκβάλλω signifie expulser ou chasser. « Chasser des démons » est exact, naturel et bien établi dans le registre biblique français.
- source_word: ἐκωλύομεν
  choice: nous avons essayé de l’en empêcher
  rationale: L’imparfait grec peut présenter une action tentée ou en cours. Cette formulation conserve la nuance d’effort sans affirmer que les disciples ont effectivement réussi à l’arrêter.
- source_word: ὅτι οὐκ ἀκολουθεῖ μεθ’ ἡμῶν
  choice: parce qu’il ne te suit pas avec nous
  rationale: Le complément « te » explicite en français la personne suivie, naturellement comprise comme Jésus, tandis que « avec nous » rend μεθ’ ἡμῶν et maintient l’accent sur la non-appartenance de cet homme au groupe des disciples.
theological_decisions:
- issue: Ambiguïté concernant l’allégeance de l’homme et son appartenance au groupe des disciples
  choice: parce qu’il ne te suit pas avec nous
  alternative: parce qu’il ne nous suit pas
  rationale: 'Le grec dit expressément « avec nous », et non simplement « nous ». Le texte principal évite donc de laisser entendre que l’homme devait suivre les disciples eux-mêmes comme maîtres, tout en conservant leur plainte : il ne se joint pas à leur groupe pour suivre Jésus.'
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement correspond à l’adresse directe à Jésus et à l’usage biblique français courant. La formulation reste proche du grec tout en évitant une syntaxe artificielle.
