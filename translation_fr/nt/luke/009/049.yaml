  verdict: approve
  source_fidelity: 'Le texte rend fidèlement les éléments essentiels du grec : la réponse de Jean, l’adresse « Maître », l’homme indéfini, l’action « en ton nom », l’expulsion des démons, la nuance imperfective de l’effort pour l’empêcher, et surtout μεθ’ ἡμῶν (« avec nous »). L’ajout de « te » dans « il ne te suit pas avec nous » explicite naturellement en français le référent implicite de ἀκολουθεῖ sans altérer la tension du texte.'
  naturalness: Le français est moderne, clair et d’un registre biblique sobre. « Nous avons essayé de l’en empêcher » est idiomatique et rend bien une action en cours ou tentée. « Il ne te suit pas avec nous » est légèrement plus explicite que le grec, mais reste naturel et compréhensible.
  terminology: « Maître », « en ton nom » et « chasser des démons » sont des choix stables et appropriés. Le tutoiement est cohérent avec le registre retenu. La note signale utilement la possibilité de comprendre la plainte en rapport avec le groupe des disciples plutôt qu’avec un refus de suivre Jésus.
