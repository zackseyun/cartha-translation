id: LUK.9.52
reference: Luke 9:52
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἀπέστειλεν ἀγγέλους πρὸ προσώπου αὐτοῦ. καὶ πορευθέντες εἰσῆλθον εἰς κώμην Σαμαριτῶν, ⸀ὡς ἑτοιμάσαι αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/052.yaml
  text: And he sent messengers ahead of him[b][a]. And they went and entered a village of the Samaritans to prepare for him.
translation:
  language: fr
  text: Il envoya devant lui des messagers. Ceux-ci partirent et entrèrent dans un village samaritain[a] afin de faire des préparatifs pour lui[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « un village de Samaritains ».'
    reason: lexical_alternative
  - marker: b
    text: Le grec ne précise pas ce qui devait être préparé.
    reason: source_ambiguity
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: envoya
  rationale: L’aoriste de ἀποστέλλω exprime simplement l’envoi; « envoya » est direct et naturel.
- source_word: ἀγγέλους
  choice: des messagers
  rationale: Dans ce contexte, il s’agit d’envoyés humains et non d’êtres célestes.
- source_word: πρὸ προσώπου αὐτοῦ
  choice: devant lui
  rationale: Cette tournure française naturelle rend l’idée d’envoyer des personnes en avant de soi, sans reproduire littéralement l’idiome grec « devant sa face ».
- source_word: πορευθέντες εἰσῆλθον
  choice: partirent et entrèrent
  rationale: La coordination française restitue naturellement le déplacement préalable exprimé par le participe aoriste, puis l’entrée dans le village.
- source_word: κώμην Σαμαριτῶν
  choice: un village samaritain
  rationale: Cette formulation idiomatique rend le génitif pluriel grec, littéralement « un village de Samaritains ».
- source_word: ὡς ἑτοιμάσαι αὐτῷ
  choice: afin de tout préparer pour lui
  rationale: « afin de » exprime clairement le but; « tout » explicite avec retenue l’objet sous-entendu de la préparation sans préciser sa nature.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La reprise par « Ceux-ci » évite une succession lourde de phrases commençant par « Et ». « Village samaritain » est plus naturel en français que le calque du génitif grec; la forme littérale est conservée en note.
