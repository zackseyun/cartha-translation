  yaml_path: translation/nt/luke/009/004.yaml
  text: And whatever house you enter, stay there, and leave from there.
translation:
  language: fr
  text: Dans toute maison où vous entrez, restez-y et partez de là.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰς ἣν ἂν οἰκίαν
  choice: dans quelque maison que
  rationale: La tournure rend naturellement en français la construction indéfinie avec ἄν, sans donner à « maison » le sens abstrait de maisonnée.
- source_word: ἐκεῖ μένετε
  choice: restez-y
  rationale: Le pronom adverbial « y » reprend clairement la maison et restitue avec concision l’idée de demeurer à cet endroit.
- source_word: ἐκεῖθεν ἐξέρχεσθε
  choice: repartez de là
  rationale: « Repartez » exprime ici le départ depuis le lieu d’hébergement; « de là » conserve explicitement la valeur de provenance de ἐκεῖθεν.
