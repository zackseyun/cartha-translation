id: LUK.9.56
reference: Luke 9:56
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸀καὶ ἐπορεύθησαν εἰς ἑτέραν κώμην.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/056.yaml
  text: And they went on to another village[a].
translation:
  language: fr
  text: Et ils partirent pour un autre village[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un village différent ». L’adjectif grec peut souligner la différence aussi bien que désigner simplement un autre lieu.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Et
  rationale: Conserve la coordination narrative simple du grec sans ajouter une nuance temporelle explicite.
- source_word: ἐπορεύθησαν
  choice: ils partirent
  rationale: Le verbe πορεύομαι exprime ici le déplacement vers une nouvelle destination. « Partirent » est naturel dans le contexte immédiat tout en conservant l'idée fondamentale de mouvement.
- source_word: εἰς
  choice: pour
  rationale: Avec un verbe de déplacement, εἰς indique la destination. En français, « partir pour » exprime naturellement ce mouvement vers un lieu.
- source_word: ἑτέραν
  choice: un autre
  rationale: ἕτερος peut désigner ce qui est autre ou différent. « Un autre » convient au récit et laisse en note la nuance possible de différence.
- source_word: κώμην
  choice: village
  rationale: κώμη désigne une localité de taille modeste plutôt qu'une ville; « village » est le terme français précis et courant.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La formulation concise respecte la simplicité narrative du grec; le passé simple convient au registre d’un récit biblique écrit sans être archaïque.
