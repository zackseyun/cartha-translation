id: LUK.9.28
reference: Luke 9:28
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἐγένετο δὲ μετὰ τοὺς λόγους τούτους ὡσεὶ ἡμέραι ὀκτὼ ⸀καὶ παραλαβὼν Πέτρον καὶ Ἰωάννην καὶ Ἰάκωβον ἀνέβη εἰς τὸ ὄρος προσεύξασθαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/028.yaml
  text: About eight days after these sayings[b][a], he took Peter and John and James and went up on the mountain to pray.
translation:
  language: fr
  text: Environ huit jours après ces paroles[a], Jésus prit avec lui Pierre, Jean et Jacques, puis monta sur la montagne pour prier.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « après ces propos ». Le mot grec peut désigner ici les paroles ou propos qui viennent d’être prononcés.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: construction narrative non rendue séparément
  rationale: Cette formule sert ici de transition narrative. Le français moderne n’a pas besoin d’ajouter « Or » ou « Il arriva que », qui alourdiraient la phrase sans apporter de contenu explicite supplémentaire.
- source_word: μετὰ τοὺς λόγους τούτους
  choice: après ces paroles
  rationale: λόγους renvoie aux propos qui précèdent. « Paroles » est naturel, digne et suffisamment précis; « enseignements » préciserait plus que le grec.
- source_word: ὡσεὶ ἡμέραι ὀκτὼ
  choice: Environ huit jours
  rationale: ὡσεὶ marque explicitement l’approximation; « environ » la préserve sans harmoniser la chronologie avec les récits parallèles.
- source_word: παραλαβὼν
  choice: Jésus prit avec lui
  rationale: Le participe exprime l’accompagnement associé à l’action principale. « Prit avec lui » le rend naturellement. Le nom « Jésus », fourni par le contexte, évite en français une ouverture ambiguë avec un simple pronom.
- source_word: Πέτρον καὶ Ἰωάννην καὶ Ἰάκωβον
  choice: Pierre, Jean et Jacques
  rationale: La coordination française courante rend clairement la liste sans reproduire mécaniquement chaque καί.
- source_word: ἀνέβη εἰς τὸ ὄρος
  choice: monta sur la montagne
  rationale: ἀνέβη exprime la montée, et εἰς indique le mouvement vers ou sur la montagne. L’article grec est conservé, sans supposer nécessairement une montagne déjà identifiée.
- source_word: προσεύξασθαι
  choice: pour prier
  rationale: L’infinitif exprime le but de la montée; « pour prier » est direct et idiomatique.
theological_decisions:
- issue: Approximation chronologique par rapport aux récits parallèles
  choice: Environ huit jours
  alternative: Huit jours; quelque huit jours
  rationale: La traduction maintient la valeur approximative de ὡσεὶ et ne cherche ni à rendre le nombre exact ni à l’harmoniser avec les autres Évangiles.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase suit l’ordre narratif du grec tout en évitant le calque « Il arriva que ». « Puis » explicite légèrement la progression portée par le participe et le verbe principal. Le référent implicite du pronom grec est nommé « Jésus » pour assurer une lecture autonome et claire du verset.
