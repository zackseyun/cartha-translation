    issue: La question « Qui suis-je, d’après les foules ? » ne rend pas explicitement le verbe λέγουσιν (« disent »).
    rationale: Le grec demande littéralement qui les foules disent que Jésus est. La reformulation proposée est idiomatique mais moins précise quant à l’acte de dire et à la structure de la question indirecte.
  - severity: low
    issue: « Un jour » ajoute une précision temporelle (« jour ») qui n’est pas exprimée par ἐγένετο.
    rationale: La formule grecque est une transition narrative générale (« il arriva / or »), non une indication explicite de date. « Or » évite cet ajout tout en restant fluide.
