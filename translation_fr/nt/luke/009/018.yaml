source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ἐν τῷ εἶναι αὐτὸν προσευχόμενον κατὰ μόνας συνῆσαν αὐτῷ οἱ μαθηταί, καὶ ἐπηρώτησεν αὐτοὺς λέγων· Τίνα με ⸂οἱ ὄχλοι λέγουσιν⸃ εἶναι;
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/018.yaml
  text: And it happened that while he was praying alone[a], the disciples were with him, and he asked them, saying, “Who do the crowds say that I am?”
translation:
  language: fr
  text: 'Or, tandis qu’il priait seul[a], les disciples étaient avec lui. Il leur demanda : « Qui les foules disent-elles que je suis ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « à l’écart ». L’expression grecque peut désigner le retrait plutôt qu’une solitude physique absolue.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: Un jour
  rationale: La formule narrative lucanienne introduit ici un nouvel épisode. « Un jour » en restitue naturellement la fonction en français moderne sans employer le calque vieilli « il arriva que ».
- source_word: ἐν τῷ εἶναι αὐτὸν προσευχόμενον
  choice: tandis qu’il priait
  rationale: La construction avec infinitif articulé exprime la simultanéité; « tandis que » rend clairement cette circonstance temporelle.
- source_word: κατὰ μόνας
  choice: seul
  rationale: L’expression peut signifier « seul » ou « à l’écart ». Le choix concis « seul » préserve la tension avec la présence des disciples, tandis qu’une note signale l’autre nuance possible.
- source_word: συνῆσαν αὐτῷ οἱ μαθηταί
  choice: les disciples étaient avec lui
  rationale: Cette traduction conserve le sens relationnel simple du grec sans préciser que les disciples l’auraient rejoint ni supposer qu’ils se tenaient seulement à proximité.
- source_word: ἐπηρώτησεν αὐτοὺς λέγων
  choice: Il leur demanda
  rationale: Le français introduit naturellement la parole directe avec « demanda »; traduire séparément λέγων par « en disant » serait ici lourd et redondant.
- source_word: Τίνα με οἱ ὄχλοι λέγουσιν εἶναι
  choice: Qui suis-je, d’après les foules ?
  rationale: 'Cette tournure française naturelle conserve le contenu de la question indirecte grecque: l’identité attribuée à Jésus par les foules.'
- source_word: οἱ ὄχλοι
  choice: les foules
  rationale: « Les foules » garde la référence aux groupes nombreux qui apparaissent dans le récit, plutôt que de l’aplanir en « les gens ».
theological_decisions:
- issue: Tension apparente entre la prière de Jésus « seul » et la présence des disciples avec lui
  choice: 'Conserver directement les deux affirmations : il priait seul, et les disciples étaient avec lui.'
  alternative: Traduire κατὰ μόνας par « à l’écart » ou préciser que les disciples étaient à proximité afin de résoudre la tension.
  rationale: Le grec juxtapose ces deux éléments sans les expliquer. La traduction ne détermine donc pas si la solitude concerne la prière, l’éloignement relatif ou l’absence d’autres personnes que les disciples.
translation_notes:
  register: Français international moderne, naturel et digne. La formule narrative est rendue idiomatiquement, et le dialogue demeure direct et accessible. La ponctuation sépare les deux propositions afin d’éviter une phrase artificiellement lourde sans effacer leur tension.
