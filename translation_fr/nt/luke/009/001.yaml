id: LUK.9.1
reference: Luke 9:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Συγκαλεσάμενος δὲ τοὺς δώδεκα ἔδωκεν αὐτοῖς δύναμιν καὶ ἐξουσίαν ἐπὶ πάντα τὰ δαιμόνια καὶ νόσους θεραπεύειν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/001.yaml
  text: And calling the twelve together[a], he gave them power and authority over all the demons and to heal diseases[b],
translation:
  language: fr
  text: Ayant convoqué les douze, il leur donna puissance et autorité sur tous les démons et pour guérir les maladies.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Συγκαλεσάμενος
  choice: Ayant réuni
  rationale: Le participe aoriste exprime l’action qui accompagne et précède le verbe principal. « Réuni » rend naturellement l’idée de convoquer ensemble portée par le préfixe συν-.
- source_word: δὲ
  choice: non rendu explicitement
  rationale: Ici, δέ est un léger connecteur narratif. En français, l’enchaînement reste naturel sans conjonction, et l’ajout de « mais » introduirait un contraste absent.
- source_word: τοὺς δώδεκα
  choice: les douze
  rationale: La formulation conserve exactement la désignation grecque sans ajouter « disciples » ni « apôtres ».
- source_word: δύναμιν καὶ ἐξουσίαν
  choice: puissance et autorité
  rationale: 'Les deux noms sont maintenus distincts : le premier évoque la capacité d’agir, le second l’autorité permettant de l’exercer.'
- source_word: ἐπὶ πάντα τὰ δαιμόνια
  choice: sur tous les démons
  rationale: Avec l’accusatif, ἐπί marque ici l’exercice d’une autorité sur eux. « Tous les démons » rend directement le pluriel avec πᾶς.
- source_word: νόσους θεραπεύειν
  choice: pour guérir les maladies
  rationale: L’infinitif est rendu comme le domaine ou le but de l’autorité accordée. « Guérir les maladies » reste direct et idiomatique.
theological_decisions:
- issue: Distinction entre δύναμις et ἐξουσία
  choice: « puissance et autorité »
  alternative: « pouvoir » seul
  rationale: Conserver les deux termes évite de réduire la distinction entre capacité effective et autorité conférée.
- issue: Désignation du groupe
  choice: « les douze »
  alternative: « les douze disciples » ou « les douze apôtres »
  rationale: Le texte grec ne précise ici ni « disciples » ni « apôtres » ; aucune désignation supplémentaire n’est donc importée.
translation_notes:
  register: Français moderne, sobre et digne. La tournure participiale « Ayant réuni » suit de près la structure grecque sans être obscure. L’expression « puissance et autorité » conserve la tension lexicale du texte source ; la coordination avec « pour guérir » préserve sa structure sans ajouter un verbe comme « chasser ».
