source:
  edition: SBLGNT
  text: Ἤκουσεν δὲ Ἡρῴδης ὁ τετραάρχης τὰ ⸀γινόμενα πάντα, καὶ διηπόρει διὰ τὸ λέγεσθαι ὑπό τινων ὅτι Ἰωάννης ⸀ἠγέρθη ἐκ νεκρῶν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/007.yaml
  text: Herod the tetrarch heard about all that was happening[a], and he was perplexed because it was being said by some that John had been raised from the dead,
translation:
  language: fr
  text: Hérode le tétrarque apprit tout ce qui se passait, et il était perplexe, car certains disaient que Jean avait été ressuscité d’entre les morts[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Jean était ressuscité d’entre les morts ». Le verbe grec est au passif, littéralement : « avait été relevé ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἤκουσεν
  choice: apprit
  rationale: Avec pour objet des événements rapportés, ἀκούω signifie ici qu’Hérode en eut connaissance; « apprit » est naturel en français.
- source_word: δὲ
  choice: non exprimé séparément
  rationale: δέ marque ici une transition narrative légère que l’enchaînement français suffit à rendre, sans imposer un contraste.
- source_word: ὁ τετραάρχης
  choice: le tétrarque
  rationale: Ce terme conserve le titre politique historique précis d’Hérode.
- source_word: τὰ γινόμενα πάντα
  choice: tout ce qui se passait
  rationale: Cette formulation idiomatique rend l’ensemble des événements en cours.
- source_word: διηπόρει
  choice: était perplexe
  rationale: Le verbe exprime un état marqué de perplexité et d’incertitude.
- source_word: διὰ τὸ λέγεσθαι ὑπό τινων
  choice: car certains disaient
  rationale: La tournure active française exprime naturellement la cause tout en conservant l’agent indéfini « certains ».
- source_word: ἠγέρθη
  choice: avait été relevé
  rationale: Le passif est maintenu et le plus-que-parfait situe l’événement allégué avant la perplexité d’Hérode.
- source_word: ἐκ νεκρῶν
  choice: d’entre les morts
  rationale: Cette expression française naturelle conserve l’idée d’un relèvement hors du nombre des morts.
theological_decisions:
- issue: Formulation de la résurrection dans le propos rapporté au sujet de Jean
  choice: avait été relevé d’entre les morts
  alternative: était ressuscité
  rationale: Le grec emploie un passif; « avait été relevé » en préserve la forme sans préciser explicitement l’agent ni transformer la proposition en tournure intransitive.
translation_notes:
  register: Français international moderne, clair et digne. Deux phrases évitent une coordination lourde. Le titre historique « tétrarque » est conservé; la note explicite une formulation plus courante sans effacer le passif grec.
