reference: Luke 9:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἰπὼν ὅτι Δεῖ τὸν υἱὸν τοῦ ἀνθρώπου πολλὰ παθεῖν καὶ ἀποδοκιμασθῆναι ἀπὸ τῶν πρεσβυτέρων καὶ ἀρχιερέων καὶ γραμματέων καὶ ἀποκτανθῆναι καὶ τῇ τρίτῃ ἡμέρᾳ ⸀ἐγερθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/022.yaml
  text: saying[a], “It is necessary for the Son of Man to suffer many things and to be rejected by the elders, chief priests, and scribes, and to be killed[b], and on the third day to be raised.”
translation:
  language: fr
  text: 'En disant : « Il faut que le Fils de l’homme souffre beaucoup, qu’il soit rejeté par les anciens, les grands prêtres et les scribes, qu’il soit mis à mort et qu’il soit ressuscité le troisième jour. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰπὼν
  choice: Il disait
  rationale: Le participe aoriste introduit ici les paroles de Jésus et se rattache au contexte narratif précédent. En français, « Il disait » assure naturellement cette transition sans reproduire lourdement la construction participiale.
- source_word: Δεῖ
  choice: Il faut que
  rationale: Cette tournure impersonnelle française conserve la construction et la forte nécessité exprimée par le grec, vraisemblablement liée au dessein de Dieu, sans en expliciter davantage la cause.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: le Fils de l’homme
  rationale: Traduction consacrée de cette autodésignation, qui préserve sa forme ainsi que ses résonances bibliques et apocalyptiques.
- source_word: πολλὰ παθεῖν
  choice: souffre beaucoup
  rationale: « Souffrir beaucoup » est idiomatique en français et transmet l’étendue des souffrances exprimée par le neutre pluriel πολλὰ, sans la formulation peu naturelle « souffrir beaucoup de choses ».
- source_word: ἀποδοκιμασθῆναι
  choice: soit rejeté
  rationale: Le passif indique un rejet après examen ou jugement; « être rejeté » est clair et convient au rejet officiel par les autorités.
- source_word: ἀπὸ τῶν πρεσβυτέρων καὶ ἀρχιερέων καὶ γραμματέων
  choice: par les anciens, les grands prêtres et les spécialistes de la Loi
  rationale: Avec le passif, ἀπό désigne ici les agents du rejet. « Par » est donc la formulation française naturelle.
- source_word: πρεσβυτέρων
  choice: anciens
  rationale: Le terme conserve la désignation institutionnelle de ce groupe de responsables juifs.
- source_word: ἀρχιερέων
  choice: grands prêtres
  rationale: Au pluriel, le terme désigne les membres de l’aristocratie sacerdotale, et non plusieurs titulaires simultanés de la seule fonction suprême.
- source_word: γραμματέων
  choice: spécialistes de la Loi
  rationale: Dans ce contexte, les γραμματεῖς sont des experts des Écritures et de la Loi. Cette expression moderne communique leur fonction plus clairement que « scribes », devenu moins transparent pour beaucoup de lecteurs.
- source_word: ἀποκτανθῆναι
  choice: soit mis à mort
  rationale: Cette formulation directe conserve le passif et exprime clairement une mort infligée, dans un registre digne et naturel.
- source_word: τῇ τρίτῃ ἡμέρᾳ
  choice: le troisième jour
  rationale: Le complément temporel sans préposition est idiomatique en français et conserve la formule grecque.
- source_word: ἐγερθῆναι
  choice: soit relevé
  rationale: « Être relevé » conserve le passif de ἐγείρω ainsi que l’image fondamentale du relèvement, sans rendre explicite l’agent divin sous-entendu ni remplacer le verbe par le terme théologique plus interprétatif « ressusciter ».
theological_decisions:
- issue: Valeur passive du verbe de relèvement
  choice: qu’il soit relevé
  alternative: qu’il ressuscite / qu’il soit ressuscité
  rationale: Le grec emploie un infinitif passif. La traduction retenue préserve cette voix et laisse implicite l’agent du relèvement, comme le texte source, tout en gardant l’image lexicale de ἐγείρω.
- issue: Force de Δεῖ
  choice: Il faut que
  alternative: Le Fils de l’homme doit
  rationale: « Il faut que » maintient la construction impersonnelle grecque et la nécessité inscrite dans le dessein divin, sans préciser un mécanisme que le verset ne formule pas.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve l’enchaînement solennel des quatre événements au moyen de propositions coordonnées. « Spécialistes de la Loi » privilégie la compréhension immédiate; « soit relevé » maintient intentionnellement le passif et l’image du grec.
