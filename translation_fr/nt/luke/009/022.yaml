revisions:
- from: 'Il disait : « Il faut que le Fils de l’homme souffre beaucoup, qu’il soit rejeté par les anciens, les grands prêtres et les spécialistes de la Loi, qu’il soit mis à mort et qu’il soit relevé le troisième jour. »'
  to: 'En disant : « Il faut que le Fils de l’homme souffre beaucoup, qu’il soit rejeté par les anciens, les grands prêtres et les scribes, qu’il soit mis à mort et qu’il soit ressuscité le troisième jour. »'
  rationale: La révision corrige l'aspect de l'introduction narrative, emploie les désignations de groupes les plus directes et remplace une formulation de résurrection peu idiomatique par un passif français clair. Elle conserve la nécessité impersonnelle, l'enchaînement des événements, les agents du rejet et l'agent implicite de la résurrection.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T10:53:24Z'
review_pass:
  verdict: revise
  source_fidelity: La chaîne des infinitifs dépendant de δεῖ est globalement bien rendue, de même que les groupes dirigeants et les passifs. Toutefois, « Il disait » est un imparfait duratif qui ne correspond pas au participe aoriste εἰπών, lequel introduit ponctuellement la déclaration. « Soit relevé », bien que littéral dans son image, n'est pas une expression française suffisamment naturelle et explicite pour la résurrection dans ce contexte; « soit ressuscité » conserve la voix passive de ἐγερθῆναι sans nommer l'agent.
  naturalness: La formulation révisée garde un français moderne, clair et solennel. « En disant » restitue naturellement le lien participial avec le contexte précédent, et « soit ressuscité » est l'expression française usuelle et intelligible.
  terminology: « Fils de l’homme », « anciens », « grands prêtres » et « scribes » préservent les désignations institutionnelles du texte. « Scribes » est préférable à « spécialistes de la Loi », qui explique et élargit quelque peu la désignation grecque γραμματεῖς. « Ressuscité » traduit ici naturellement le passif sans imposer d'interprétation confessionnelle supplémentaire.
  issues:
  - severity: medium
    issue: « Il disait » rend εἰπών
    rationale: L'imparfait français suggère une parole habituelle ou en cours. Le participe aoriste introduit plutôt la parole rapportée dans la séquence narrative; « en disant » maintient ce lien.
  - severity: medium
    issue: « soit relevé » pour ἐγερθῆναι
    rationale: La conservation formelle du passif est bienvenue, mais « être relevé » ne désigne pas idiomatiquement la résurrection en français moderne sans complément. « Être ressuscité » demeure passif et communique clairement le sens.
  - severity: low
    issue: « spécialistes de la Loi » pour γραμματέων
    rationale: Cette expression est explicative et peut recouvrir un champ plus large que le titre de groupe. « Scribes » est direct, établi et conserve la désignation évangélique.
  revised_text: 'En disant : « Il faut que le Fils de l’homme souffre beaucoup, qu’il soit rejeté par les anciens, les grands prêtres et les scribes, qu’il soit mis à mort et qu’il soit ressuscité le troisième jour. »'
  revised_footnotes: []
