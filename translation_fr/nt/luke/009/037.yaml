id: LUK.9.37
reference: Luke 9:37
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἐγένετο ⸀δὲ τῇ ἑξῆς ἡμέρᾳ κατελθόντων αὐτῶν ἀπὸ τοῦ ὄρους συνήντησεν αὐτῷ ὄχλος πολύς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/037.yaml
  text: On the next day[a], when they had come down from the mountain, a large crowd met him.
translation:
  language: fr
  text: Le lendemain[a], lorsqu’ils descendirent de la montagne, une grande foule vint à la rencontre de Jésus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le jour suivant ».
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: transition narrative non explicitée
  rationale: La tournure introduit la suite du récit. En français moderne, « Le lendemain » suffit à assurer naturellement la transition, sans ajouter un « Or » ou un « Il arriva que » lourd et sans équivalent temporel explicite.
- source_word: τῇ ἑξῆς ἡμέρᾳ
  choice: Le lendemain
  rationale: Cette expression temporelle désigne le jour suivant. « Le lendemain » est naturel, précis et idiomatique en français.
- source_word: κατελθόντων αὐτῶν
  choice: lorsqu’ils furent descendus
  rationale: Le génitif absolu fournit l’arrière-plan circonstanciel; l’aoriste présente la descente comme accomplie par rapport à la rencontre.
- source_word: ἀπὸ τοῦ ὄρους
  choice: de la montagne
  rationale: « Montagne » est ici le sens contextuel normal de ὄρος.
- source_word: συνήντησεν αὐτῷ
  choice: vint à la rencontre de Jésus
  rationale: Le verbe exprime une rencontre et peut impliquer le mouvement vers quelqu’un. Cette formulation est naturelle en français et rend clairement le singulier αὐτῷ.
- source_word: ὄχλος πολύς
  choice: une grande foule
  rationale: Cette expression rend directement la taille importante de la foule dans un registre courant et digne.
theological_decisions:
- issue: Référent du pronom αὐτῷ
  choice: Jésus
  alternative: lui
  rationale: Bien que le grec emploie un pronom, « lui » serait momentanément ambigu en français après le pluriel « ils ». Le contexte identifie Jésus comme référent; expliciter son nom clarifie sans introduire d’interprétation théologique.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe conserve la circonstance temporelle et l’action accomplie de la descente, tout en évitant un calque pesant de Ἐγένετο δὲ.
