revisions:
- from: Il arriva que, tandis que les jours où il devait être enlevé[a] arrivaient à leur accomplissement, lui-même prit résolument le chemin de Jérusalem[b].
  to: Il arriva que, lorsque s’accomplissaient les jours où il allait être élevé[a], il se mit résolument en route vers Jérusalem[b].
  rationale: La révision rétablit une expression temporelle française fluide pour le processus d’accomplissement des jours, remplace « enlevé » et l’auxiliaire interprétatif « devait » par « être élevé », et conserve la détermination de Jésus ainsi que l’orientation effective de son voyage. La note b maintient l’ancrage de l’idiome grec.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T10:53:56Z'
review_pass:
  verdict: revise
  source_fidelity: La formulation « où il devait être enlevé » transforme de façon peu justifiée le génitif « de son élévation / de son être enlevé » en une relative avec « devait », et « enlevé » évoque spontanément en français un rapt. « Élevé » rend plus naturellement l’idée de ἀνάλημψις sans la réduire à la seule ascension. « S’accomplissaient » conserve l’aspect progressif de συμπληροῦσθαι.
  naturalness: « Les jours … arrivaient à leur accomplissement » est lourd et peu idiomatique. « Lorsque s’accomplissaient les jours… » est un français moderne et soutenu. « Se mit résolument en route vers Jérusalem » rend clairement l’action orientée vers un but, tandis que la note préserve l’image du texte grec.
  terminology: « Élévation » / « être élevé » évite le faux sens usuel de « enlèvement » et maintient l’ouverture du terme grec. La note propose « ascension » comme possibilité traditionnelle, sans l’imposer. Le nom propre « Jérusalem » et le registre sont appropriés.
  issues:
  - severity: medium
    issue: « devait être enlevé »
    rationale: « Devait » n’est pas exprimé par le grec, et « enlevé » suggère couramment un kidnapping en français moderne. La formulation modifie en outre la construction « les jours de son être élevé ».
  - severity: medium
    issue: « arrivaient à leur accomplissement »
    rationale: Cette expression est lourde en français et rend moins directement le processus exprimé par συμπληροῦσθαι.
  - severity: low
    issue: 'Note a : « au sens d’être pris ou élevé »'
    rationale: La note explicative est acceptable, mais le texte principal et la note peuvent employer plus nettement « être élevé », qui est naturel et évite l’ambiguïté moderne de « enlèvement ».
  revised_text: Il arriva que, lorsque s’accomplissaient les jours où il allait être élevé[a], il se mit résolument en route vers Jérusalem[b].
  revised_footnotes:
