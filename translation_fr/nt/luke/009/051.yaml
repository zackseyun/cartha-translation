id: LUK.9.51
reference: Luke 9:51
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἐγένετο δὲ ἐν τῷ συμπληροῦσθαι τὰς ἡμέρας τῆς ἀναλήμψεως αὐτοῦ καὶ αὐτὸς τὸ ⸀πρόσωπον ⸀ἐστήρισεν τοῦ πορεύεσθαι εἰς Ἰερουσαλήμ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/051.yaml
  text: It happened[a], when the days of his being taken up were being fulfilled[b], that he set his face to go to Jerusalem.
translation:
  language: fr
  text: Il arriva que, lorsque s’accomplissaient les jours où il allait être élevé[a], il se mit résolument en route vers Jérusalem[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les jours de son ascension ». Le grec dit littéralement « de son être élevé » ou « de son élévation ».
    reason: alternative_reading
  - marker: b
    text: 'Littéralement « il affermit son visage pour aller à Jérusalem » : cet idiome exprime une ferme résolution.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: Il arriva que
  rationale: Cette formule marque une transition narrative. « Il arriva que » en conserve la fonction sans ajouter un adverbe temporel absent du grec.
- source_word: ἐν τῷ συμπληροῦσθαι τὰς ἡμέρας
  choice: tandis que les jours … arrivaient à leur accomplissement
  rationale: La tournure temporelle et l’infinitif présent évoquent un processus en cours. La formulation conserve aussi l’image des « jours » qui atteignent leur terme.
- source_word: τῆς ἀναλήμψεως αὐτοῦ
  choice: où il devait être enlevé
  rationale: Le passif « être enlevé » reste proche de l’idée grecque d’une prise vers le haut, tout en évitant de limiter d’emblée la référence à la seule ascension.
- source_word: καὶ αὐτὸς
  choice: lui-même
  rationale: Le pronom explicite rend l’emphase portée par αὐτός.
- source_word: τὸ πρόσωπον ἐστήρισεν
  choice: prit résolument le chemin
  rationale: Cette expression française transmet naturellement la ferme détermination exprimée par l’idiome sémitisant, dont l’image littérale est signalée en note.
- source_word: τοῦ πορεύεσθαι εἰς Ἰερουσαλήμ
  choice: le chemin de Jérusalem
  rationale: La formulation exprime à la fois la mise en route et sa destination, dans un français courant et digne.
theological_decisions:
- issue: Portée de ἀνάλημψις
  choice: où il devait être enlevé
  alternative: les jours de son ascension
  rationale: Le grec désigne littéralement le fait d’être pris ou élevé. La traduction retenue préserve la possibilité que Luc envisage l’ensemble du mouvement vers la mort, la résurrection et l’élévation de Jésus, sans imposer cette interprétation.
- issue: Force de l’idiome τὸ πρόσωπον ἐστήρισεν
  choice: prit résolument le chemin
  alternative: affermit son visage pour se rendre
  rationale: La traduction principale communique clairement la détermination ferme de Jésus; la note conserve l’image source et sa résonance biblique.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. La phrase garde la solennité de la transition lucanienne, explicite l’emphase de « lui-même » et rend l’idiome de manière naturelle tout en le documentant en note.
