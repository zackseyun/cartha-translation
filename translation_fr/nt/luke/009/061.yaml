id: LUK.9.61
reference: Luke 9:61
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἶπεν δὲ καὶ ἕτερος· Ἀκολουθήσω σοι, κύριε· πρῶτον δὲ ἐπίτρεψόν μοι ἀποτάξασθαι τοῖς εἰς τὸν οἶκόν μου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/061.yaml
  text: And another also said[a], “I will follow you, Lord[c][b], but first permit me to say farewell to those in my house.”
translation:
  language: fr
  text: 'Un autre encore lui dit : « Je te suivrai, Seigneur, mais permets-moi d’abord de faire mes adieux à ceux de chez moi. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ καὶ ἕτερος
  choice: Un autre encore lui dit
  rationale: « Un autre encore » rend à la fois le lien avec les échanges précédents et l’ajout d’un nouvel interlocuteur. Le pronom « lui » explicite naturellement en français le destinataire déjà clair dans le contexte.
- source_word: Ἀκολουθήσω σοι
  choice: Je te suivrai
  rationale: Le futur exprime l’intention déclarée du locuteur; « je te suivrai » est direct et naturel.
- source_word: κύριε
  choice: Seigneur
  rationale: « Seigneur » conserve la portée respectueuse et la possible profondeur théologique de l’adresse à Jésus, sans la réduire à « monsieur » ou à « maître ».
- source_word: πρῶτον δὲ
  choice: mais… d’abord
  rationale: « Mais » fait ressortir la réserve qui tempère l’engagement annoncé, tandis que « d’abord » en marque clairement la priorité.
- source_word: ἐπίτρεψόν μοι
  choice: permets-moi
  rationale: L’impératif aoriste formule ici une demande de permission. « Permets-moi » convient au ton respectueux sans être archaïque.
- source_word: ἀποτάξασθαι
  choice: faire mes adieux
  rationale: Dans ce contexte, le moyen infinitif signifie prendre congé ou dire adieu. « Faire mes adieux » est une tournure française naturelle et précise.
- source_word: τοῖς εἰς τὸν οἶκόν μου
  choice: à ceux de chez moi
  rationale: L’expression désigne les personnes qui se trouvent chez le locuteur ou appartiennent à son foyer. « Ceux de chez moi » préserve cette souplesse relationnelle sans imposer le sens institutionnel de « maisonnée ».
theological_decisions:
- issue: Valeur de κύριε dans l’adresse à Jésus
  choice: Seigneur
  alternative: Maître; monsieur
  rationale: « Seigneur » maintient l’ambiguïté entre une adresse respectueuse et une reconnaissance théologiquement plus forte, au lieu de trancher en faveur d’un sens seulement social ou fonctionnel.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation reste proche de la structure grecque tout en évitant les tours peu naturels; aucune note n’est nécessaire pour cette traduction.
