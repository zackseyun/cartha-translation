id: LUK.9.3
reference: Luke 9:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ εἶπεν πρὸς αὐτούς· Μηδὲν αἴρετε εἰς τὴν ὁδόν, μήτε ⸀ῥάβδον μήτε πήραν μήτε ἄρτον μήτε ἀργύριον, μήτε ⸀ἀνὰ δύο χιτῶνας ἔχειν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/003.yaml
  text: And he said to them[a], “Take nothing for the journey—neither a staff, nor a bag, nor bread, nor money[c][b]; and do not have two tunics each.”
translation:
  language: fr
  text: 'Il leur dit : « Ne prenez rien pour la route : ni bâton, ni sac[a], ni pain, ni argent[b] ; et n’ayez pas deux tuniques chacun[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sac de voyage », c’est-à-dire un sac destiné notamment aux provisions.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « argent » au sens du métal ; ici, le terme désigne de l’argent servant aux dépenses.
    reason: lexical_alternative
  - marker: c
    text: L’expression grecque signifie « deux tuniques par personne ».
    reason: lexical_alternative
lexical_decisions:
- source_word: Μηδὲν αἴρετε εἰς τὴν ὁδόν
  choice: Ne prenez rien pour la route
  rationale: La tournure exprime ce qu’il ne faut pas emporter en voyage. « Pour la route » est naturel en français et conserve l’idée de préparation au déplacement.
- source_word: ῥάβδον
  choice: bâton
  rationale: Dans ce contexte de voyage, il s’agit vraisemblablement d’un bâton de marche ; « bâton » reste concis et historiquement approprié.
- source_word: πήραν
  choice: sac
  rationale: Le terme désigne un sac servant à transporter des provisions. « Sac » est clair et courant ; la nuance fonctionnelle est signalée en note.
- source_word: ἄρτον
  choice: pain
  rationale: Le grec nomme précisément le pain, sans qu’il soit nécessaire de généraliser en « nourriture ».
- source_word: ἀργύριον
  choice: argent
  rationale: Le mot signifie littéralement « argent » au sens du métal, mais désigne ici de l’argent servant aux dépenses. Le français « argent » rend naturellement les deux aspects.
- source_word: ἀνὰ δύο χιτῶνας ἔχειν
  choice: n’ayez pas chacun deux tuniques
  rationale: 'ἀνά avec le nombre deux a une valeur distributive : deux par personne. La formulation française explicite cette valeur sans ajouter d’interprétation.'
- source_word: χιτῶνας
  choice: tuniques
  rationale: « Tuniques » préserve la référence au vêtement antique et évite l’anachronisme de « chemises ».
theological_decisions: []
translation_notes:
  register: Français international moderne, simple et digne. La ponctuation met en relief l’énumération, tandis que « chacun » conserve explicitement la valeur distributive du grec.
