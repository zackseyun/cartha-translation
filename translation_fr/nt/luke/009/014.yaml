id: LUK.9.14
reference: Luke 9:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἦσαν γὰρ ὡσεὶ ἄνδρες πεντακισχίλιοι. εἶπεν δὲ πρὸς τοὺς μαθητὰς αὐτοῦ· Κατακλίνατε αὐτοὺς κλισίας ⸀ὡσεὶ ἀνὰ πεντήκοντα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/014.yaml
  text: For there were about five thousand men[a]. And he said to his disciples[b], “Have them recline in groups of about fifty each.”
translation:
  language: fr
  text: 'Ils étaient en effet environ cinq mille hommes[a]. Jésus dit à ses disciples : « Faites-les s’allonger[b] par groupes d’environ cinquante. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec dit précisément « hommes », c’est-à-dire des hommes adultes ; les femmes et les enfants ne sont pas compris dans ce nombre.
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « Faites-les s’installer ». Le verbe grec suggère plus précisément une position allongée pour le repas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡσεὶ
  choice: environ
  rationale: Marque une approximation dans ses deux emplois et se rend naturellement par « environ ».
- source_word: ἄνδρες
  choice: hommes
  rationale: Le terme désigne ici spécifiquement des hommes adultes, et non l’ensemble des personnes présentes.
- source_word: πεντακισχίλιοι
  choice: cinq mille
  rationale: Rendu direct du nombre cardinal qualifiant « hommes ».
- source_word: Κατακλίνατε
  choice: Faites-les s’installer
  rationale: Le verbe signifie faire prendre place, plus précisément faire s’allonger pour manger. « S’installer » est idiomatique en français et conserve le contexte du repas sans évoquer maladroitement l’action de se coucher.
- source_word: κλισίας
  choice: par groupes
  rationale: Le pluriel désigne des groupes organisés; « par groupes » exprime clairement cette répartition.
- source_word: ἀνὰ πεντήκοντα
  choice: d’environ cinquante
  rationale: ἀνά avec un nombre exprime une distribution; la formulation indique naturellement l’effectif approximatif de chaque groupe.
- source_word: γὰρ ... δὲ
  choice: en effet ... [enchaînement sans conjonction]
  rationale: « En effet » garde la valeur explicative de γάρ. Pour δέ, une nouvelle phrase sans conjonction constitue un enchaînement narratif naturel en français.
- source_word: πρὸς τοὺς μαθητὰς αὐτοῦ
  choice: à ses disciples
  rationale: Conserve explicitement le possessif du texte grec.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le nom « Jésus » explicite le sujet implicite du verbe selon le contexte immédiat. « Faites-les s’installer » évite le peu naturel « faites-les s’allonger », tout en laissant le contexte du repas porter la nuance de la posture antique.
