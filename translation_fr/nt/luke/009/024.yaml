reference: Luke 9:24
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὃς γὰρ ⸀ἂν θέλῃ τὴν ψυχὴν αὐτοῦ σῶσαι, ἀπολέσει αὐτήν· ὃς δ’ ἂν ἀπολέσῃ τὴν ψυχὴν αὐτοῦ ἕνεκεν ἐμοῦ, οὗτος σώσει αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/024.yaml
  text: For whoever wants to save his life will lose it[a], but whoever loses his life for my sake will save it.
translation:
  language: fr
  text: Car celui qui veut sauver sa vie la perdra[a] ; mais celui qui perdra sa vie à cause de moi, celui-là la sauvera.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « son âme » ou « sa personne » ; selon le contexte, le mot grec peut désigner la vie, l’âme ou la personne elle-même.
    reason: Alternative lexicale signalant l’étendue sémantique réelle de ψυχή.
lexical_decisions:
- source_word: ὃς γὰρ ἂν θέλῃ
  choice: Car celui qui veut
  rationale: La construction indéfinie avec ἄν et le subjonctif désigne toute personne répondant à la condition. « Car » maintient le lien explicatif avec la parole précédente, et « veut » rend naturellement θέλῃ.
- source_word: τὴν ψυχὴν αὐτοῦ
  choice: sa vie
  rationale: Dans ce paradoxe sur la sauvegarde et la perte de l’existence en lien avec la condition de disciple, « vie » exprime le mieux le sens contextuel de ψυχή sans le réduire à l’âme immatérielle.
- source_word: σῶσαι / σώσει
  choice: sauver / sauvera
  rationale: La répétition du même verbe préserve le parallélisme et le paradoxe grecs. En français, « sauver sa vie » est naturel tout en laissant percevoir la portée plus large du propos.
- source_word: ἀπολέσει / ἀπολέσῃ
  choice: perdra / perdra
  rationale: « Perdre » convient au sens contextuel de ἀπόλλυμι et maintient la symétrie rhétorique sans suggérer que la personne se détruit activement.
- source_word: ἕνεκεν ἐμοῦ
  choice: à cause de moi
  rationale: Cette expression rend directement la cause ou le motif indiqué par ἕνεκεν avec le génitif. Elle est naturelle en français moderne et conserve la référence personnelle à Jésus.
- source_word: οὗτος
  choice: celui-là
  rationale: Le démonstratif reprend avec insistance la personne qui vient d’être décrite. « Celui-là » conserve cette mise en relief sans alourdir excessivement la phrase.
theological_decisions:
- issue: Sens de ψυχή dans le paradoxe
  choice: vie
  alternative: âme ; personne elle-même
  rationale: Le contexte immédiat porte sur le renoncement à soi et sur la perte ou la sauvegarde de la vie à cause de Jésus. « Vie » convient au premier plan du sens, tandis qu’une note conserve l’étendue sémantique du grec.
- issue: Portée de la promesse finale
  choice: Conserver « sauver » plutôt que préciser « obtenir la vie éternelle »
  alternative: préserver ; retrouver ; obtenir la vie éternelle
  rationale: Le grec répète σῴζω sans expliciter ici la nature ou le moment du salut. La traduction garde donc la tension du paradoxe au lieu d’en imposer une interprétation doctrinale.
- issue: Force emphatique de οὗτος
  choice: celui-là
  alternative: il
  rationale: Le maintien du démonstratif respecte l’accent porté par le texte grec sur la personne qui perd sa vie à cause de Jésus.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve le parallélisme « sauver/perdre/sauver », le lien explicatif de γάρ et l’emphase de οὗτος. Le point-virgule rend clairement l’opposition des deux membres.
