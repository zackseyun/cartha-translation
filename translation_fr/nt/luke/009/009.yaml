source:
  edition: SBLGNT
  text: ⸂εἶπεν δὲ⸃ ⸀ὁ Ἡρῴδης· Ἰωάννην ἐγὼ ἀπεκεφάλισα· τίς δέ ἐστιν οὗτος περὶ ⸀οὗ ἀκούω τοιαῦτα; καὶ ἐζήτει ἰδεῖν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/009.yaml
  text: But Herod said[a], “John I beheaded; but who is this about whom I hear such things?” And he kept seeking to see him.
translation:
  language: fr
  text: 'Mais Hérode dit : « Jean, moi, je l’ai fait décapiter. Mais qui est donc celui-ci, au sujet duquel j’entends dire de telles choses ? » Et il cherchait à le voir.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’imparfait grec peut indiquer une démarche continue ou répétée : « il cherchait constamment à le voir » ou « il essayait à plusieurs reprises de le voir ».'
    reason: Préciser la portée aspectuelle possible de ἐζήτει sans imposer une seule nuance dans le texte principal.
lexical_decisions:
- source_word: δὲ
  choice: Mais
  rationale: Marque la reprise du récit avec une légère opposition à ce qui précède ; « Mais » est naturel en français dans ce contexte.
- source_word: Ἡρῴδης
  choice: Hérode
  rationale: Forme française traditionnelle et courante de ce nom propre.
- source_word: Ἰωάννην ἐγὼ ἀπεκεφάλισα
  choice: Jean, moi, je l’ai fait décapiter
  rationale: La dislocation et « moi » conservent l’insistance portée par le pronom grec explicite ἐγώ. « Faire décapiter » exprime naturellement en français qu’Hérode a ordonné l’exécution, sans perdre le sens précis du verbe.
- source_word: τίς δέ ἐστιν οὗτος
  choice: Mais qui est donc celui-ci
  rationale: Conserve la question directe et le démonstratif distanciant. « donc » rend naturellement la perplexité et l’articulation de la question en français, sans ajouter une identification.
- source_word: περὶ οὗ ἀκούω τοιαῦτα
  choice: au sujet duquel j’entends dire de telles choses
  rationale: Reste proche de la formulation générale du grec. « De telles choses » évite de préciser qu’il s’agit de rapports ou de rumeurs.
- source_word: ἐζήτει ἰδεῖν αὐτόν
  choice: il cherchait à le voir
  rationale: L’imparfait français rend naturellement l’aspect non ponctuel de l’imparfait grec, tout en laissant ouverte la nuance continue ou répétée. « Voir » traduit directement ἰδεῖν sans imposer le sens plus interprétatif de « rencontrer ».
theological_decisions:
- issue: La déclaration d’Hérode sur Jean et sa curiosité envers Jésus
  choice: Présenter simplement la déclaration, la question et le désir de voir Jésus
  alternative: Préciser qu’Hérode soupçonne ou craint explicitement que Jean soit ressuscité
  rationale: Le contexte précédent rapporte les hypothèses en circulation, mais ce verset ne formule pas lui-même une conclusion d’Hérode sur l’identité de Jésus. La traduction préserve cette retenue et la tension narrative.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve l’emphase de la parole d’Hérode tout en restant naturelle. Le texte n’explicite aucune théorie sur l’identité de Jésus au-delà de ce que dit le verset.
