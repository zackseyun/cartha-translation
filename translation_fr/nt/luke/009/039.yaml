id: LUK.9.39
reference: Luke 9:39
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ πνεῦμα λαμβάνει αὐτόν, καὶ ἐξαίφνης κράζει, καὶ σπαράσσει αὐτὸν μετὰ ἀφροῦ καὶ ⸀μόγις ἀποχωρεῖ ἀπ’ αὐτοῦ συντρῖβον αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/039.yaml
  text: and look[a], a spirit seizes him, and suddenly he cries out, and it convulses him with foaming, and it scarcely departs from him, crushing him.
translation:
  language: fr
  text: 'Et voici[a] : un esprit le saisit et, soudain, il pousse un cri ; il le fait entrer en convulsions, avec de l’écume, et le quitte difficilement, tout en le maltraitant.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un esprit mauvais » ou « un démon » ; ici, le grec dit simplement « un esprit ».
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδοὺ
  choice: voici
  rationale: « Voici » conserve la vivacité du marqueur discursif grec dans un français actuel et digne, sans recourir à l’archaïque « voici que » comme tournure obligatoire.
- source_word: πνεῦμα
  choice: un esprit
  rationale: Le grec dit simplement « esprit ». Le contexte indique une puissance hostile, mais le texte principal ne précise ni « mauvais » ni « démon ».
- source_word: λαμβάνει
  choice: le saisit
  rationale: « Saisit » exprime naturellement la prise soudaine et violente exercée sur le garçon.
- source_word: ἐξαίφνης
  choice: soudain
  rationale: Rend directement l’irruption brusque de la crise.
- source_word: κράζει
  choice: il pousse un cri
  rationale: Le sujet implicite le plus naturel est le garçon. Cette formulation préserve la syntaxe sans expliciter que l’esprit le fait crier.
- source_word: σπαράσσει αὐτόν
  choice: le secoue de convulsions
  rationale: Dans ce contexte, le verbe décrit des spasmes violents. Cette expression est plus claire en français moderne que le littéral « le déchire ».
- source_word: μετὰ ἀφροῦ
  choice: en le faisant écumer
  rationale: Exprime clairement que les convulsions s’accompagnent d’écume, sans donner l’impression que l’esprit lui-même écume.
- source_word: μόγις ἀποχωρεῖ ἀπ’ αὐτοῦ
  choice: ne le quitte qu’à grand-peine
  rationale: Préserve l’idée d’un départ difficile ou réticent. La formulation n’impose pas le sens possible mais moins certain de « rarement ».
- source_word: συντρῖβον αὐτόν
  choice: après l’avoir meurtri
  rationale: Le participe indique que l’esprit inflige de graves dommages en se retirant. « Meurtri » conserve la violence sans suggérer nécessairement un écrasement littéral.
theological_decisions:
- issue: Faut-il identifier explicitement πνεῦμα comme démoniaque dans le texte principal ?
  choice: un esprit
  alternative: un esprit mauvais ; un démon
  rationale: Même si le contexte narratif montre qu’il s’agit d’un être spirituel hostile, ce verset emploie le terme moins précis πνεῦμα. La traduction conserve ce degré de précision.
- issue: Sujet de κράζει
  choice: le garçon pousse un cri
  alternative: l’esprit crie ; l’esprit le fait crier
  rationale: Après « l’esprit le saisit », le changement de sujet implicite vers le garçon est naturel dans la description des effets physiques. Rendre « l’esprit le fait crier » expliciterait une causalité seulement implicite.
- issue: Relation temporelle de συντρῖβον avec le départ de l’esprit
  choice: après l’avoir meurtri
  alternative: tout en le meurtrissant ; en le brisant
  rationale: Le participe présent accompagne l’action de quitter sans définir avec précision sa relation temporelle. La formulation française présente le dommage comme laissé par l’attaque et le retrait, tout en évitant « briser », potentiellement trop absolu.
translation_notes:
  register: Français international moderne, naturel et digne. La ponctuation segmente la longue coordination grecque pour assurer la clarté à l’oral. « Voici » garde la vivacité du témoignage du père ; « à grand-peine » maintient un registre soutenu mais courant.
