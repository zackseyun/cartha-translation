source:
  edition: SBLGNT
  text: Θέσθε ὑμεῖς εἰς τὰ ὦτα ὑμῶν τοὺς λόγους τούτους, ὁ γὰρ υἱὸς τοῦ ἀνθρώπου μέλλει παραδίδοσθαι εἰς χεῖρας ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/044.yaml
  text: Put these words into your ears[b][a], for the Son of Man is about to be handed over into the hands of men.
translation:
  language: fr
  text: Écoutez bien ces paroles, car le Fils de l’homme va être livré[a] aux mains des hommes.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « trahi ». Le verbe grec peut aussi signifier « livrer » ou « remettre »; ici, il désigne plus largement le fait d’être livré au pouvoir d’autrui.
    reason: lexical_alternative
  - marker: b
    text: Ou « aux mains des êtres humains ». Ici, le mot grec traduit par « hommes » peut désigner les humains en général.
    reason: lexical_alternative
lexical_decisions:
- source_word: Θέσθε ὑμεῖς εἰς τὰ ὦτα ὑμῶν
  choice: Mettez-vous bien ces paroles dans les oreilles
  rationale: La formulation conserve l’image concrète de l’expression grecque tout en rendant l’insistance du pronom explicite ὑμεῖς par « vous… bien », de manière naturelle en français.
- source_word: τοὺς λόγους τούτους
  choice: ces paroles
  rationale: « Paroles » désigne naturellement en français les propos précis que Jésus demande à ses auditeurs de retenir.
- source_word: ὁ γὰρ
  choice: ':'
  rationale: En français courant, les deux-points expriment clairement le lien explicatif introduit par γάρ, sans alourdir la phrase par « car » après l’impératif.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: le Fils de l’homme
  rationale: La traduction traditionnelle et littérale préserve le caractère de titre, son ambiguïté et sa résonance avec Daniel 7.
- source_word: μέλλει
  choice: va
  rationale: Dans ce contexte, « va » exprime naturellement l’événement imminent annoncé par μέλλει, sans ajouter l’idée plus forte d’une fatalité.
- source_word: παραδίδοσθαι
  choice: être livré
  rationale: '« Être livré » conserve la portée assez large du passif grec : remise au pouvoir d’autrui, avec la possibilité contextuelle d’une trahison, sans réduire le terme à celle-ci.'
- source_word: εἰς χεῖρας ἀνθρώπων
  choice: aux mains des hommes
  rationale: Cette expression française idiomatique préserve l’image de la remise au pouvoir d’autrui ainsi que le contraste verbal entre « Fils de l’homme » et « hommes ».
theological_decisions:
- issue: Traduction du titre ὁ υἱὸς τοῦ ἀνθρώπου
  choice: le Fils de l’homme
  alternative: l’Humain
  rationale: La formulation reçue maintient le titre, son ambiguïté christologique et son arrière-plan scripturaire sans interprétation supplémentaire.
- issue: Portée de παραδίδοσθαι
  choice: être livré
  alternative: être trahi
  rationale: Le grec peut inclure l’idée de trahison, mais décrit ici plus largement la remise de Jésus au pouvoir des humains. La traduction principale ne restreint donc pas prématurément le sens.
- issue: Portée de ἀνθρώπων
  choice: des hommes
  alternative: des êtres humains
  rationale: Dans ce contexte, « hommes » peut désigner les humains en général et conserve le contraste rhétorique immédiat avec « le Fils de l’homme ». Une note explicite cette portée.
translation_notes:
  register: Français international moderne, digne et oralement intelligible. L’image volontairement frappante « dans les oreilles » est conservée. « Mettez-vous bien » rend l’emphase du pronom grec sans recourir à une tournure lourde. Le texte principal comporte l’unique appel de note [a].
