id: LUK.9.35
reference: Luke 9:35
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ φωνὴ ἐγένετο ἐκ τῆς νεφέλης λέγουσα· Οὗτός ἐστιν ὁ υἱός μου ὁ ⸀ἐκλελεγμένος, αὐτοῦ ἀκούετε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/035.yaml
  text: And a voice came from the cloud[a], saying, “This is my Son, the Chosen One; listen to him.”
translation:
  language: fr
  text: 'Et une voix se fit entendre de la nuée[a] : « Celui-ci est mon Fils, l’Élu ; écoutez-le. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Certains manuscrits portent « mon Fils bien-aimé » au lieu de « mon Fils, l’Élu ».
    reason: textual_variant
lexical_decisions:
- source_word: φωνὴ ἐγένετο
  choice: une voix vint
  rationale: Avec φωνή, ἐγένετο exprime ici la survenue d’une voix. « Une voix vint » conserve cette valeur événementielle dans un français narratif digne et naturel.
- source_word: ἐκ τῆς νεφέλης
  choice: de la nuée
  rationale: ἐκ indique la provenance. « De la nuée » rend clairement cette origine et conserve le registre biblique de νεφέλη sans devenir obscur.
- source_word: λέγουσα
  choice: disant
  rationale: Le participe présent introduit directement les paroles prononcées par la voix ; « disant » en garde la forme et la fonction.
- source_word: Οὗτός ἐστιν
  choice: Celui-ci est
  rationale: « Celui-ci » maintient la force désignative du démonstratif grec, plus explicitement que le simple « C’est ».
- source_word: ὁ υἱός μου
  choice: mon Fils
  rationale: Cette formulation rend directement le nom articulé accompagné du possessif. La majuscule signale le titre christologique dans ce contexte.
- source_word: ὁ ἐκλελεγμένος
  choice: l’Élu
  rationale: Le participe parfait passif de ἐκλέγομαι désigne celui qui a été choisi, avec l’idée d’un choix établi. « L’Élu » est concis, naturel et respecte l’article grec sans ajouter un second possessif absent du texte.
- source_word: αὐτοῦ ἀκούετε
  choice: écoutez-le
  rationale: L’impératif présent appelle les disciples à prêter attention à Jésus et à tenir compte de ses paroles. « Écoutez-le » conserve naturellement cette force en français.
theological_decisions:
- issue: Descripteur christologique dans la voix céleste
  choice: ἐκλελεγμένος rendu par « l’Élu »
  alternative: ἀγαπητός rendu par « bien-aimé » ou « mon Fils bien-aimé »
  rationale: Le texte du SBLGNT porte ἐκλελεγμένος. La traduction suit cette leçon distinctement lucanienne sans l’harmoniser avec la formulation plus familière des parallèles synoptiques. La variante est signalée en note.
- issue: Rapport entre « mon Fils » et « l’Élu »
  choice: 'Deux désignations en apposition : « mon Fils, l’Élu »'
  alternative: « mon Fils, mon Élu »
  rationale: Le possessif μου accompagne explicitement « Fils », mais n’est pas répété avec ὁ ἐκλελεγμένος. « L’Élu » respecte cette structure tout en laissant les deux titres étroitement liés.
translation_notes:
  register: Français international moderne, clair et digne. « Nuée » conserve la tonalité théophanique traditionnelle de νεφέλη, tandis que la syntaxe reste immédiatement compréhensible. La ponctuation française et les guillemets français sont employés.
