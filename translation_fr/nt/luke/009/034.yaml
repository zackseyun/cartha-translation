  text: ταῦτα δὲ αὐτοῦ λέγοντος ἐγένετο νεφέλη καὶ ⸀ἐπεσκίαζεν αὐτούς· ἐφοβήθησαν δὲ ἐν τῷ ⸂εἰσελθεῖν αὐτοὺς⸃ εἰς τὴν νεφέλην.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/034.yaml
  text: While he was saying these things, a cloud appeared and began to overshadow them; and they were afraid as they entered into the cloud.
translation:
  language: fr
  text: Pendant qu’il disait cela, un nuage apparut et les enveloppait de son ombre[a]. Ils eurent peur au moment où ils entraient dans le nuage[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « un nuage survint et les couvrait de son ombre ». L’imparfait grec présente l’action dans son déroulement.'
    reason: lexical_alternative
  - marker: b
    text: Le nuage peut rappeler les récits de l’Ancien Testament où Dieu manifeste sa présence, sans que ce verset l’affirme explicitement. Le pronom « ils » demeure également ambigu dans le grec.
    reason: cross_reference_and_ambiguity
lexical_decisions:
- source_word: ταῦτα δὲ αὐτοῦ λέγοντος
  choice: Pendant qu’il disait cela
  rationale: Le génitif absolu avec participe présent exprime une action en cours et simultanée. En français, « cela » reprend naturellement l’ensemble des paroles précédentes sans devoir reproduire littéralement le pluriel grec.
- source_word: ἐγένετο νεφέλη
  choice: un nuage apparut
  rationale: Avec un sujet au nominatif, ἐγένετο peut signaler l’apparition ou la venue de quelque chose. « Apparut » est naturel et ne précise pas indûment l’origine du nuage.
- source_word: ἐπεσκίαζεν αὐτούς
  choice: les couvrit de son ombre
  rationale: Cette expression française rend clairement l’action de la nuée. L’imparfait grec peut décrire une action en cours ou envisagée dans son déroulement, mais il n’impose pas explicitement « commença à ».
- source_word: ἐφοβήθησαν
  choice: Ils eurent peur
  rationale: L’aoriste marque ici naturellement la survenue de la peur; « eurent peur » est idiomatique et narrativement précis.
- source_word: ἐν τῷ εἰσελθεῖν αὐτοὺς
  choice: au moment où ils entraient
  rationale: La construction ἐν + infinitif articulé exprime la simultanéité temporelle. L’imparfait français maintient l’aspect d’entrée en cours sans trancher artificiellement la question du référent du pronom.
- source_word: εἰς τὴν νεφέλην
  choice: dans le nuage
  rationale: εἰς indique un mouvement vers l’intérieur; « entrer dans le nuage » conserve ce sens spatial.
theological_decisions:
- issue: Nature du nuage
  choice: Décrire simplement son apparition et son action sans l’identifier explicitement à la présence divine.
  alternative: Parler de la nuée de la gloire ou de la présence de Dieu.
  rationale: Le contexte peut évoquer les manifestations divines de l’Ancien Testament, mais le verset lui-même ne donne pas cette identification de manière explicite.
- issue: Référent de αὐτούς dans « ils entraient »
  choice: Conserver le pronom ambigu « ils ».
  alternative: Préciser que les disciples, ou que Jésus, Moïse et Élie, entraient dans le nuage.
  rationale: Le grec autorise une ambiguïté contextuelle; la traduction ne doit pas imposer une identification que le texte ne formule pas explicitement.
translation_notes:
  register: Français international moderne, narratif et digne. « Nuage » est préféré à « nuée », plus traditionnel mais moins courant; la note préserve la portée possible de l’image. La ponctuation en deux phrases évite un enchaînement lourd.
