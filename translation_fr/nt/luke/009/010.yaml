id: LUK.9.10
reference: Luke 9:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ ὑποστρέψαντες οἱ ἀπόστολοι διηγήσαντο αὐτῷ ὅσα ἐποίησαν. καὶ παραλαβὼν αὐτοὺς ὑπεχώρησεν κατ’ ἰδίαν εἰς ⸂πόλιν καλουμένην Βηθσαϊδά⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/010.yaml
  text: And when the apostles returned[a], they reported to him what they had done. And taking them with him, he withdrew privately to a town called Bethsaida.
translation:
  language: fr
  text: À leur retour, les apôtres lui racontèrent tout ce qu’ils avaient fait. Jésus les prit avec lui et se retira à l’écart[a] dans une ville appelée Bethsaïda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en privé » ou « à part ». L’expression désigne un retrait loin des autres, sans nécessairement impliquer une solitude complète.
    reason: Alternative lexicale pour κατ’ ἰδίαν et clarification rendue nécessaire par la présence des apôtres avec Jésus.
lexical_decisions:
- source_word: ὑποστρέψαντες
  choice: À leur retour
  rationale: Le participe aoriste marque une action antérieure au récit fait à Jésus ; cette tournure temporelle rend naturellement la succession des événements.
- source_word: οἱ ἀπόστολοι
  choice: les apôtres
  rationale: Dans ce contexte missionnaire chez Luc, le terme désigne les envoyés revenus auprès de Jésus ; « apôtres » est la désignation française consacrée et précise.
- source_word: διηγήσαντο αὐτῷ
  choice: lui racontèrent
  rationale: Le verbe évoque le fait de relater ce qui s’est passé. « Racontèrent » conserve cette nuance sans donner au compte rendu un caractère excessivement officiel.
- source_word: ὅσα ἐποίησαν
  choice: tout ce qu’ils avaient fait
  rationale: ὅσα englobe l’ensemble de leurs actions ; le plus-que-parfait situe celles-ci avant leur récit.
- source_word: παραλαβὼν αὐτούς
  choice: les prit avec lui
  rationale: La formulation exprime clairement que Jésus les emmène comme compagnons.
- source_word: ὑπεχώρησεν κατ’ ἰδίαν
  choice: se retira à l’écart
  rationale: « Se retira » rend le mouvement de retrait, tandis que « à l’écart » indique l’éloignement du public sans laisser entendre que Jésus était seul, puisque les apôtres l’accompagnaient.
- source_word: πόλιν καλουμένην Βηθσαϊδά
  choice: dans une ville appelée Bethsaïda
  rationale: πόλις désigne une localité urbaine sans imposer ici une distinction moderne stricte entre ville et bourg ; « appelée » rend naturellement le participe καλουμένην, et Bethsaïda suit la forme française usuelle.
theological_decisions:
- issue: Sens de κατ’ ἰδίαν alors que les apôtres accompagnent Jésus
  choice: à l’écart
  alternative: en privé ; à part
  rationale: L’expression marque une séparation d’avec les autres, notamment la foule, et non une solitude absolue. La traduction préserve cette tension avec la mention explicite des compagnons de Jésus.
- issue: Référent de αὐτῷ et sujet sous-entendu de ὑπεχώρησεν
  choice: Conserver « lui » dans la première phrase, puis expliciter « Jésus » dans la seconde
  alternative: Employer « il » dans la seconde phrase
  rationale: Le référent est Jésus dans le contexte. Son nom est explicité une fois pour éviter une ambiguïté momentanée en français entre Jésus et le groupe des apôtres, sans ajouter d’interprétation doctrinale.
translation_notes:
  register: Français international moderne, fluide et digne. La syntaxe reste simple et narrative. « À l’écart » est idiomatique et évite l’incohérence qu’introduirait « seul », puisque Jésus emmène les apôtres avec lui.
