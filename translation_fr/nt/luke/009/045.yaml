id: LUK.9.45
reference: Luke 9:45
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οἱ δὲ ἠγνόουν τὸ ῥῆμα τοῦτο, καὶ ἦν παρακεκαλυμμένον ἀπ’ αὐτῶν ἵνα μὴ αἴσθωνται αὐτό, καὶ ἐφοβοῦντο ἐρωτῆσαι αὐτὸν περὶ τοῦ ῥήματος τούτου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/045.yaml
  text: But they did not understand this saying[a], and it was concealed from them so that they might not perceive it[b], and they were afraid to ask him about this saying.
translation:
  language: fr
  text: Mais eux ne comprenaient pas cette parole[a]. Elle leur était cachée, afin qu’ils ne la saisissent pas[b], et ils avaient peur de l’interroger au sujet de cette parole.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « déclaration », « propos » ou « chose dite » pour « parole » (ῥῆμα).
    reason: lexical_alternative
  - marker: b
    text: Le grec dit « elle leur était cachée » sans préciser qui la leur cachait.
    reason: alternative_reading
lexical_decisions:
- source_word: ἠγνόουν
  choice: ne comprenaient pas
  rationale: Dans ce contexte, le verbe exprime l’incapacité des disciples à saisir le sens des paroles de Jésus. Cette tournure est naturelle en français moderne.
- source_word: ῥῆμα
  choice: parole
  rationale: Le nom désigne ici ce que Jésus vient de dire. « Parole » convient au registre biblique courant tout en restant compréhensible; une note signale les autres nuances possibles.
- source_word: ἦν παρακεκαλυμμένον ἀπ’ αὐτῶν
  choice: elle leur était cachée
  rationale: Cette formulation rend l’état résultant exprimé par la périphrase grecque et conserve le passif sans nommer l’agent du fait de cacher.
- source_word: ἵνα μὴ αἴσθωνται αὐτό
  choice: afin qu’ils ne la saisissent pas
  rationale: « Saisir » exprime ici la perception mentale et permet de distinguer αἰσθάνομαι du précédent ἀγνοέω rendu par « comprendre ».
- source_word: ἐφοβοῦντο
  choice: ils avaient peur
  rationale: L’imparfait français restitue naturellement la disposition continue exprimée par l’imparfait grec.
- source_word: ἐρωτῆσαι
  choice: l’interroger
  rationale: Dans ce contexte, il s’agit de demander à Jésus une explication. « L’interroger » s’accorde naturellement avec « au sujet de » et explicite correctement le pronom objet.
theological_decisions:
- issue: Agent de la dissimulation
  choice: Conserver le passif « elle leur était cachée » sans identifier l’agent.
  alternative: Préciser que Dieu la leur cachait, ou dire seulement qu’elle leur restait obscure.
  rationale: Le grec ne nomme pas l’agent. Le passif préserve donc l’ambiguïté et la tension théologique du texte.
- issue: Valeur de ἵνα μή
  choice: « afin qu’ils ne la saisissent pas »
  alternative: « de sorte qu’ils ne pouvaient pas la saisir »
  rationale: La formulation retenue conserve la valeur finale ou résultative potentiellement forte de ἵνα sans la réduire à une simple conséquence explicative.
translation_notes:
  register: Français international moderne, naturel et digne. La répétition de « cette parole » est conservée parce qu’elle structure le verset grec. Les pronoms féminins renvoient clairement à « parole ».
