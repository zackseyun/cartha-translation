  source_fidelity: 'Le texte rend fidèlement les trois propositions grecques : l’incompréhension (ἠγνόουν), l’état de dissimulation passive sans agent exprimé (ἦν παρακεκαλυμμένον ἀπ’ αὐτῶν), puis la crainte de demander à Jésus une explication. « Afin qu’ils ne la saisissent pas » conserve de façon acceptable la portée finale, possiblement résultative, de ἵνα μή sans résoudre l’ambiguïté.'
  naturalness: Le français est moderne, clair et d’un registre biblique sobre. « Mais eux » rend l’opposition emphatique sans lourdeur; la reprise de « cette parole » est naturelle dans ce contexte et reflète la répétition du grec. « Ils avaient peur de l’interroger au sujet de cette parole » est idiomatique et explicite correctement le référent masculin αὐτόν.
  terminology: « Parole » convient bien à ῥῆμα pour une parole précise de Jésus; la note fournit utilement les nuances lexicales. « Cachée » maintient le passif et n’attribue pas indûment l’action à Dieu ou à un autre agent. « Saisir » rend adéquatement αἰσθάνομαι tout en évitant de répéter « comprendre ».
