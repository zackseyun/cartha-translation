  text: καὶ οὐκ ἐδέξαντο αὐτόν, ὅτι τὸ πρόσωπον αὐτοῦ ἦν πορευόμενον εἰς Ἰερουσαλήμ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/053.yaml
  text: And they did not receive him[b][a], because his face was going toward Jerusalem.
translation:
  language: fr
  text: Mais ils ne l’accueillirent pas[a], parce qu’il se dirigeait vers Jérusalem[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ne le reçurent pas ». Le verbe peut exprimer le fait de recevoir, d’accepter ou d’accueillir quelqu’un; ici, il s’agit probablement d’un refus d’hospitalité.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « son visage allait vers Jérusalem », expression indiquant son orientation vers cette destination.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδέξαντο
  choice: ne l’accueillirent pas
  rationale: Dans ce contexte de voyage et d’hospitalité, δέχομαι désigne naturellement le fait d’accueillir ou de recevoir quelqu’un. « Accueillir » exprime clairement le refus d’hospitalité sans ajouter le logement explicitement.
- source_word: τὸ πρόσωπον αὐτοῦ ἦν πορευόμενον
  choice: il se dirigeait résolument
  rationale: L’expression littérale, « son visage allait », est un sémitisme difficilement naturel en français. La formulation retenue rend à la fois le mouvement indiqué par πορευόμενον et l’orientation déterminée portée par l’image du visage, sans préciser davantage la motivation.
- source_word: εἰς Ἰερουσαλήμ
  choice: vers Jérusalem
  rationale: « Vers » restitue ici la direction du déplacement exprimée par εἰς dans une formulation française naturelle.
- source_word: ὅτι
  choice: parce que
  rationale: La conjonction introduit explicitement la raison du refus et se rend clairement par « parce que ».
theological_decisions:
- issue: Portée de l’expression « son visage allait vers Jérusalem »
  choice: Rendre l’orientation déterminée par « il se dirigeait résolument vers Jérusalem »
  alternative: « son visage était tourné vers Jérusalem » ou, plus littéralement, « son visage allait vers Jérusalem »
  rationale: Le texte associe déplacement et orientation personnelle dans une tournure sémitique. La traduction conserve cette tension sans transformer le verset en explication théologique de la résolution de Jésus.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au registre biblique écrit; « accueillir » demeure immédiatement compréhensible. L’idiome grec est rendu naturellement dans le texte et conservé littéralement en note.
