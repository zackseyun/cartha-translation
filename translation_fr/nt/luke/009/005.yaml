id: LUK.9.5
reference: Luke 9:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ὅσοι ⸀ἂν μὴ ⸀δέχωνται ὑμᾶς, ἐξερχόμενοι ἀπὸ τῆς πόλεως ⸀ἐκείνης τὸν κονιορτὸν ἀπὸ τῶν ποδῶν ὑμῶν ⸀ἀποτινάσσετε εἰς μαρτύριον ἐπ’ αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/005.yaml
  text: And as for all who do not receive you[a], as you leave that town[b], shake off the dust from your feet as a testimony against them.
translation:
  language: fr
  text: Et, quant à tous ceux qui ne vous accueillent pas[a], en quittant cette ville[b], secouez la poussière de vos pieds en témoignage contre eux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ne vous reçoivent pas ». Le verbe grec peut exprimer à la fois l’accueil des messagers et leur acceptation.
    reason: lexical_alternative
  - marker: b
    text: Ou « cette localité ». Le mot grec peut désigner une ville ou une agglomération de moindre importance.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅσοι ἂν μὴ δέχωνται ὑμᾶς
  choice: si des gens ne vous accueillent pas
  rationale: ὅσοι avec ἄν généralise sans fixer le nombre des personnes concernées. « Accueillir » rend naturellement δέχομαι dans le contexte de messagers reçus ou refusés, tout en gardant l'idée d'acceptation.
- source_word: ἐξερχόμενοι
  choice: en quittant
  rationale: Le participe exprime une action contemporaine de l'impératif. « En quittant » restitue avec concision cette valeur temporelle.
- source_word: ἀπὸ τῆς πόλεως ἐκείνης
  choice: cette ville
  rationale: πόλις peut désigner une ville ou une localité de taille variable. « Cette ville » est le terme français courant le moins marqué, tandis que le démonstratif reprend ἐκείνης.
- source_word: τὸν κονιορτὸν ἀπὸ τῶν ποδῶν ὑμῶν
  choice: la poussière de vos pieds
  rationale: « Poussière » correspond directement à κονιορτός. La construction française permet de comprendre qu'elle se trouve sur les pieds et doit en être ôtée.
- source_word: ἀποτινάσσετε
  choice: secouez
  rationale: L'impératif décrit le geste énergique par lequel on fait tomber la poussière. Avec son complément, « secouez la poussière de vos pieds » est naturel et conserve l'image concrète.
- source_word: εἰς μαρτύριον ἐπ’ αὐτούς
  choice: ce sera un témoignage contre eux
  rationale: La formulation explicite en français la fonction du geste. « Contre eux » conserve la portée défavorable ou judiciaire de ἐπί avec l'accusatif dans ce contexte, sans développer davantage le jugement évoqué.
theological_decisions:
- issue: Portée du geste consistant à secouer la poussière
  choice: Le geste constitue un témoignage contre ceux qui refusent les messagers.
  alternative: Un simple signe qui leur est adressé, ou une déclaration explicite de condamnation divine définitive.
  rationale: εἰς μαρτύριον ἐπ’ αὐτούς donne au geste une portée solennelle et défavorable, mais le verset n'explicite pas l'étendue ni l'issue finale du jugement. La traduction préserve cette tension.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe reste accessible, avec une ponctuation qui relie clairement le geste à sa fonction de témoignage.
