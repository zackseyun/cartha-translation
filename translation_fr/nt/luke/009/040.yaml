  text: καὶ ἐδεήθην τῶν μαθητῶν σου ἵνα ἐκβάλωσιν αὐτό, καὶ οὐκ ἠδυνήθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/040.yaml
  text: And I begged your disciples to cast it out[a], but they were not able.
translation:
  language: fr
  text: J’ai supplié tes disciples de le chasser, mais ils n’ont pas pu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐδεήθην
  choice: J’ai supplié
  rationale: Le verbe δέομαι exprime ici une demande pressante. « J’ai supplié » restitue l’urgence du père dans un français naturel.
- source_word: τῶν μαθητῶν σου
  choice: tes disciples
  rationale: « Disciples » conserve la relation maître-disciple propre au contexte des Évangiles et correspond à l’usage français établi.
- source_word: ἵνα ἐκβάλωσιν
  choice: de le chasser
  rationale: La construction avec ἵνα exprime le contenu ou le but de la demande. « Chasser » est l’expression française naturelle pour l’expulsion d’un esprit dans ce contexte.
- source_word: αὐτό
  choice: le
  rationale: Le pronom français « le » peut renvoyer aussi bien à l’esprit qu’au garçon, ce qui préserve naturellement l’ambiguïté réelle du pronom grec sans alourdir le texte.
- source_word: οὐκ ἠδυνήθησαν
  choice: ils n’ont pas pu
  rationale: Cette formulation courante rend directement l’incapacité exprimée par δύναμαι, avec davantage de naturel que « ils n’en ont pas été capables ».
theological_decisions:
- issue: Référent de αὐτό dans le contexte de l’exorcisme
  choice: Employer le pronom « le » sans préciser son référent.
  alternative: Expliciter « chasser cet esprit » ou comprendre « le garçon » comme référent.
  rationale: Dans le contexte, l’esprit est probablement l’objet de ἐκβάλλω, mais la forme grecque αὐτό peut grammaticalement renvoyer soit à πνεῦμα, soit à παιδίον, tous deux neutres. Le français « le » maintient cette ambiguïté sans suggérer que le garçon lui-même devait être expulsé.
translation_notes:
  register: Français international moderne, simple et digne. Le tutoiement correspond à l’adresse directe du père à Jésus. La formulation concise conserve le rythme et la tension de l’énoncé grec.
