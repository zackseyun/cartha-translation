source:
  edition: SBLGNT
  text: ἐξερχόμενοι δὲ διήρχοντο κατὰ τὰς κώμας εὐαγγελιζόμενοι καὶ θεραπεύοντες πανταχοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/006.yaml
  text: So they went out and traveled through the villages[b][a], proclaiming the good news and healing everywhere.
translation:
  language: fr
  text: Ils partirent donc et allaient de village en village, annonçant la bonne nouvelle et guérissant partout.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξερχόμενοι
  choice: Ils partirent
  rationale: Le participe aoriste introduit l’action qui suit l’envoi des disciples. « Ils partirent » exprime naturellement leur mise en route.
- source_word: δὲ
  choice: donc
  rationale: La particule marque ici la continuité narrative avec une légère valeur de conséquence après les instructions de Jésus.
- source_word: διήρχοντο κατὰ τὰς κώμας
  choice: allaient de village en village
  rationale: L’imparfait exprime une progression continue, tandis que κατά avec l’accusatif peut avoir un sens distributif. Cette formulation française rend clairement le déplacement successif parmi les villages.
- source_word: εὐαγγελιζόμενοι
  choice: annonçant la bonne nouvelle
  rationale: Cette expression actuelle et accessible conserve l’idée d’une proclamation publique porteuse d’une bonne nouvelle, sans imposer un vocabulaire ecclésiastique plus technique.
- source_word: θεραπεύοντες
  choice: guérissant
  rationale: Dans ce contexte de mission, le verbe désigne les guérisons accomplies par les disciples.
- source_word: πανταχοῦ
  choice: partout
  rationale: L’adverbe souligne l’étendue de leur activité et se rend directement et naturellement par « partout ».
theological_decisions:
- issue: Portée de εὐαγγελιζόμενοι dans la mission des disciples
  choice: annonçant la bonne nouvelle
  alternative: prêchant l’Évangile
  rationale: Le choix retenu exprime pleinement l’annonce évangélique tout en évitant de donner au terme grec un sens technique plus tardif que le contexte n’exige pas.
translation_notes:
  register: Français international moderne, simple et digne. La tournure « de village en village » restitue naturellement la valeur distributive du grec; aucune note n’est nécessaire puisque cette nuance figure directement dans le texte.
