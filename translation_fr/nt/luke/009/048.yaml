id: LUK.9.48
reference: Luke 9:48
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς· Ὃς ⸀ἂν δέξηται τοῦτο τὸ παιδίον ἐπὶ τῷ ὀνόματί μου ἐμὲ δέχεται, καὶ ὃς ⸁ἂν ἐμὲ δέξηται δέχεται τὸν ἀποστείλαντά με· ὁ γὰρ μικρότερος ἐν πᾶσιν ὑμῖν ὑπάρχων οὗτός ⸀ἐστιν μέγας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/048.yaml
  text: And he said to them[a], “Whoever receives this child in my name receives me, and whoever receives me receives the one who sent me[b]. For the one who is least among all of you—this one is great.”
translation:
  language: fr
  text: 'Et il leur dit : « Celui qui accueille cet enfant en mon nom, c’est moi qu’il accueille ; et celui qui m’accueille accueille celui qui m’a envoyé. Car celui qui est le plus petit parmi vous tous, c’est lui qui est grand. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δέξηται / δέχεται
  choice: accueille
  rationale: Le verbe δέχομαι peut exprimer l’accueil, la réception ou l’acceptation. « Accueille » est naturel en français dans le contexte d’un enfant et conserve la répétition qui relie l’enfant, Jésus et celui qui l’a envoyé.
- source_word: παιδίον
  choice: enfant
  rationale: « Enfant » rend directement παιδίον sans imposer une nuance diminutive qui n’est pas nécessaire ici.
- source_word: ἐπὶ τῷ ὀνόματί μου
  choice: en mon nom
  rationale: Cette formulation française préserve le rapport au nom, à l’autorité et à la représentation de Jésus sans réduire la phrase à une seule explication causale.
- source_word: τὸν ἀποστείλαντά με
  choice: celui qui m’a envoyé
  rationale: Le participe substantivé désigne personnellement l’envoyeur sans le nommer. Cette traduction claire conserve cette retenue du grec.
- source_word: μικρότερος
  choice: le plus petit
  rationale: Dans ce contexte de rang au sein du groupe, « le plus petit » évoque naturellement la condition humble ou le moindre statut, plutôt que la taille ou l’âge seulement.
- source_word: ἐν πᾶσιν ὑμῖν
  choice: parmi vous tous
  rationale: La formule exprime la position d’une personne à l’intérieur du groupe ; « parmi vous tous » est idiomatique et précis.
- source_word: ὑπάρχων
  choice: qui est
  rationale: Le participe est rendu naturellement par une proposition relative, sans lourdeur littérale.
- source_word: οὗτός ἐστιν μέγας
  choice: c’est lui qui est grand
  rationale: La tournure disloquée conserve l’emphase démonstrative de οὗτος et fait ressortir le paradoxe de la grandeur.
- source_word: Ὃς ἂν ... καὶ ὃς ἂν
  choice: Celui qui… et celui qui
  rationale: Cette tournure française exprime clairement la portée générale des relatives indéfinies avec ἄν et maintient leur parallélisme.
- source_word: καὶ εἶπεν αὐτοῖς
  choice: Et il leur dit
  rationale: La traduction reproduit simplement la coordination narrative de καί sans ajouter une nuance temporelle absente du texte.
theological_decisions:
- issue: Référent de « celui qui m’a envoyé »
  choice: Conserver la désignation implicite sans ajouter « le Père » ni « Dieu ».
  alternative: « le Père qui m’a envoyé » ou « Dieu qui m’a envoyé »
  rationale: Le grec emploie un participe substantivé et ne nomme pas explicitement l’envoyeur. La traduction garde ainsi la relation d’envoi tout en respectant la formulation du texte.
- issue: Sens de l’accueil de l’enfant « en mon nom »
  choice: Maintenir « en mon nom », qui rattache l’accueil à l’identité, à l’autorité ou à la représentation de Jésus.
  alternative: « à cause de mon nom », « pour l’amour de moi » ou « parce qu’il m’appartient »
  rationale: La formulation retenue préserve l’étendue sémantique de l’expression grecque et ne réduit pas l’acte à une bienveillance générale.
- issue: Paradoxe de la grandeur
  choice: Rendre μικρότερος par « le plus petit » en laissant la phrase renverser les critères ordinaires de rang.
  alternative: « le plus jeune » ou « le moindre »
  rationale: Le contexte porte surtout sur le statut et l’humilité. « Le plus petit » garde l’image et la tension du propos sans l’enfermer dans une question d’âge.
translation_notes:
  register: Français international moderne, naturel et digne. La répétition d’« accueille » est volontaire afin de préserver la chaîne rhétorique du grec. « C’est moi qu’il accueille » et « c’est lui qui est grand » rendent l’emphase sans donner au verset un ton archaïque.
