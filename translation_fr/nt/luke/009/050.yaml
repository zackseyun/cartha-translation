  text: ⸂εἶπεν δὲ⸃ πρὸς αὐτὸν ⸀ὁ Ἰησοῦς· Μὴ κωλύετε, ὃς γὰρ οὐκ ἔστιν καθ’ ⸂ὑμῶν ὑπὲρ ὑμῶν⸃ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/050.yaml
  text: But Jesus said to him[a], “Do not stop him, for whoever is not against you is for you.”
translation:
  language: fr
  text: 'Mais Jésus lui dit : « Ne l’en empêchez pas[a], car quiconque n’est pas contre vous est pour vous. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Ne l’arrêtez pas » ; le verbe grec peut aussi exprimer l’idée d’interdire ou de faire obstacle.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν δὲ πρὸς αὐτὸν ὁ Ἰησοῦς
  choice: Mais Jésus lui dit
  rationale: δέ marque ici une légère opposition à l’objection précédente ; « Mais » la rend naturellement sans la renforcer. Le pronom « lui » conserve πρὸς αὐτόν sans remplacer celui-ci par le nom de Jean.
- source_word: Μὴ κωλύετε
  choice: Ne l’en empêchez pas
  rationale: L’impératif grec est au pluriel et s’adresse aux disciples. En français, « l’ » reprend l’homme mentionné dans le contexte et « en » reprend l’action qu’ils voulaient lui interdire ; la formulation exprime clairement l’idée de faire obstacle sans préciser davantage le moyen.
- source_word: ὃς γὰρ
  choice: car quiconque
  rationale: γάρ introduit la raison donnée par Jésus. « Quiconque » restitue la portée générale possible du relatif ὃς tout en restant applicable au cas immédiat.
- source_word: οὐκ ἔστιν καθ’ ὑμῶν
  choice: n’est pas contre vous
  rationale: κατά avec le génitif exprime ici l’opposition. Le pluriel de ὑμῶν est conservé par « vous », même si le français n’en marque pas formellement le nombre.
- source_word: ὑπὲρ ὑμῶν ἐστιν
  choice: est pour vous
  rationale: ὑπέρ exprime ici le soutien ou l’alignement. « Pour vous » maintient le parallélisme concis avec « contre vous ».
theological_decisions:
- issue: Portée de la maxime de Jésus
  choice: Employer « quiconque » pour présenter l’énoncé comme un principe général applicable au cas présent.
  alternative: Employer « celui qui », formulation pouvant sembler davantage limitée à l’exorciste mentionné juste avant.
  rationale: Le relatif grec peut viser l’homme du contexte tout en formulant une maxime plus large. « Quiconque » préserve cette portée sans tirer de conclusion doctrinale supplémentaire.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement collectif est rendu par « vous ». La tournure antithétique « contre vous… pour vous » conserve la concision et la tension de l’original.
