source:
  edition: SBLGNT
  text: εἶπεν δὲ ⸂ὁ Ἰησοῦς⸃· Οὐδεὶς ἐπιβαλὼν τὴν ⸀χεῖρα ἐπ’ ἄροτρον καὶ βλέπων εἰς τὰ ὀπίσω εὔθετός ἐστιν ⸂τῇ βασιλείᾳ⸃ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/062.yaml
  text: But Jesus said[b][a], “No one who has put his hand to the plow and looks back is fit for the kingdom of God.”
translation:
  language: fr
  text: 'Mais Jésus lui dit : « Personne qui a mis la main à la charrue et regarde en arrière n’est apte pour le royaume de Dieu.[a] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « n’est pas approprié pour le royaume de Dieu » ou « n’est pas propre au royaume de Dieu ». Le terme grec exprime l’aptitude ou la convenance sans préciser s’il est question d’entrer dans le royaume ou de le servir.
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: Mais
  rationale: La particule marque ici une légère opposition avec la demande formulée juste avant et introduit la réponse corrective de Jésus.
- source_word: Οὐδεὶς
  choice: Celui qui… n’est pas
  rationale: Cette tournure française naturelle conserve la portée universelle de la négation grecque sans marquage de genre superflu.
- source_word: ἐπιβαλὼν τὴν χεῖρα ἐπ’ ἄροτρον
  choice: met la main à la charrue
  rationale: Cette formulation garde l’image agricole et présente clairement le commencement du labour. Le présent français s’accorde naturellement avec la maxime générale, même si le participe aoriste grec envisage d’abord la prise en main de la charrue.
- source_word: βλέπων εἰς τὰ ὀπίσω
  choice: regarde en arrière
  rationale: Le participe présent évoque une action simultanée ou caractéristique. « Regarder en arrière » préserve à la fois le geste concret du laboureur et la portée figurée d’un engagement partagé.
- source_word: εὔθετός
  choice: apte
  rationale: « Apte » exprime la convenance ou l’adéquation à une tâche ou à un but, sans transformer le propos en jugement explicite sur la dignité morale ou le salut final.
- source_word: τῇ βασιλείᾳ τοῦ θεοῦ
  choice: au royaume de Dieu
  rationale: Avec « apte », le complément introduit par « à » rend naturellement le datif grec. « Royaume de Dieu » demeure l’expression française biblique courante tout en laissant ouverte la dimension de règne et de domaine royal.
theological_decisions:
- issue: Portée de εὔθετός ἐστιν τῇ βασιλείᾳ τοῦ θεοῦ
  choice: Présenter une absence d’aptitude au royaume de Dieu sans préciser davantage s’il s’agit d’y entrer ou d’y servir.
  alternative: « n’est pas digne d’entrer dans le royaume » ou « n’est pas utile au service du royaume »
  rationale: Le grec affirme l’adéquation ou l’aptitude dans le cadre de la métaphore du labour, mais ne définit pas explicitement la conséquence en termes de salut final ni de service seulement. La traduction conserve cette tension.
translation_notes:
  register: Français international moderne, simple et digne. La structure proverbiale est fluide; l’image concrète de la charrue et l’ambiguïté théologique de « apte au royaume » sont maintenues.
