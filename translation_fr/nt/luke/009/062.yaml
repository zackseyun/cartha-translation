revisions:
- from: 'Mais Jésus lui dit : « Celui qui met la main à la charrue et regarde en arrière n’est pas apte au royaume de Dieu.[a] »'
  to: 'Mais Jésus lui dit : « Personne qui a mis la main à la charrue et regarde en arrière n’est apte pour le royaume de Dieu.[a] »'
  rationale: La révision conserve l’image agricole, la portée universelle et l’ambiguïté théologique du grec. « A mis » reflète mieux l’acte initial exprimé par le participe aoriste, opposé à « regarde », qui reproduit le participe présent. La note est resserrée et ses alternatives sont lexicalement plus proches de εὔθετος.
