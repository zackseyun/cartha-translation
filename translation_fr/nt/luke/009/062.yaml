review_pass:
  verdict: revise
  source_fidelity: Le sens de la maxime est globalement préservé, mais « Celui qui met la main à la charrue » neutralise la valeur antérieure de l’aoriste participial ἐπιβαλών (« ayant mis / après avoir mis »), tandis que βλέπων reste présent. Une formulation française avec « a mis » rend mieux cette succession/aspect sans lourdeur.
  naturalness: Le français est clair et digne. « Apte au royaume de Dieu » est compréhensible, mais légèrement moins idiomatique que « apte pour le royaume de Dieu » dans cette construction; cette dernière conserve aussi l’ambiguïté fonctionnelle du datif grec.
  terminology: « Jésus », « charrue » et « royaume de Dieu » sont exacts et usuels. La note explique utilement εὔθετος sans importer de conclusion doctrinale. Le mot « disposé » dans l’alternative est toutefois plus interprétatif et moins exact que « approprié » ou « propre ».
  issues:
  - severity: low
    issue: Aspect de ἐπιβαλών
    rationale: L’aoriste participial désigne la prise en main comme acte préalable au regard en arrière. « a mis la main à la charrue » le rend plus précisément que le présent générique « met ».
  - severity: low
    issue: Construction avec « apte »
    rationale: « Apte pour le royaume de Dieu » est plus naturel en français moderne pour exprimer la convenance à l’égard d’un but ou d’un domaine, sans préciser entrée ou service.
  - severity: low
    issue: Alternative de note « bien disposé »
    rationale: Cette expression peut évoquer une disposition intérieure favorable plutôt que la convenance/fonctionnalité de εὔθετος. Il vaut mieux proposer « approprié » ou « propre ».
