id: LUK.9.20
reference: Luke 9:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἶπεν δὲ αὐτοῖς· Ὑμεῖς δὲ τίνα με λέγετε εἶναι; ⸂Πέτρος δὲ ἀποκριθεὶς⸃ εἶπεν· Τὸν χριστὸν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/020.yaml
  text: And he said to them[a], “But who do you say that I am?” Peter answered, “The Messiah of God.”
translation:
  language: fr
  text: 'Il leur dit : « Et vous, qui dites-vous que je suis ? » Pierre répondit : « Le Messie de Dieu[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le Christ de Dieu ».'
    reason: Alternative lexicale traditionnelle pour χριστός.
lexical_decisions:
- source_word: Ὑμεῖς δὲ
  choice: Et vous
  rationale: Le pronom grec est explicite et emphatique. « Et vous » exprime naturellement en français le contraste avec les réponses précédentes, sans alourdir par « vous-mêmes ».
- source_word: τίνα με λέγετε εἶναι
  choice: qui dites-vous que je suis
  rationale: Cette formulation française naturelle rend la construction de discours indirect avec λέγετε et l’infinitif εἶναι, tout en conservant la question sur l’identité de Jésus.
- source_word: ἀποκριθεὶς εἶπεν
  choice: répondit
  rationale: Le participe aoriste suivi du verbe « dire » forme ici une tournure que le français rend idiomatiquement par un seul verbe introducteur.
- source_word: χριστόν
  choice: Messie
  rationale: Dans la confession de Pierre, χριστός fonctionne comme un titre. « Messie » en traduit le sens dans le cadre de l’attente d’Israël, tandis que la forme traditionnelle « Christ » est signalée en note.
- source_word: τοῦ θεοῦ
  choice: de Dieu
  rationale: Cette traduction conserve directement le rapport génitif sans préciser davantage une relation que le grec laisse concise.
- source_word: εἶπεν δὲ αὐτοῖς
  choice: Il leur dit
  rationale: Le premier δέ sert surtout de liaison dans le récit et n’exige pas ici de mot français distinct; « leur » rend αὐτοῖς.
theological_decisions:
- issue: Traduction du titre χριστός dans la confession de Pierre
  choice: Messie
  alternative: Christ
  rationale: Le terme désigne ici le roi oint attendu plutôt qu’un nom propre. Traduire le titre par « Messie » en communique le sens, sans ajouter de précision doctrinale; « Christ » demeure une équivalence traditionnelle légitime et figure donc en note.
- issue: Portée du génitif τοῦ θεοῦ
  choice: de Dieu
  alternative: envoyé par Dieu / appartenant à Dieu
  rationale: Le génitif grec est théologiquement dense et ne spécifie pas à lui seul la nature exacte de la relation. La formulation concise « de Dieu » préserve cette ouverture au lieu de l’interpréter.
translation_notes:
  register: Français international moderne, simple et digne. « Et vous » porte le contraste emphatique de la question. La réponse brève de Pierre et l’expression inhabituelle mais fidèle « le Messie de Dieu » sont conservées.
