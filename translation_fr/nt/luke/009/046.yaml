source:
  edition: SBLGNT
  text: Εἰσῆλθεν δὲ διαλογισμὸς ἐν αὐτοῖς, τὸ τίς ἂν εἴη μείζων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/046.yaml
  text: Then a dispute arose among them as to which of them might be the greatest[a].
translation:
  language: fr
  text: Alors, une discussion surgit parmi eux pour savoir lequel d’entre eux serait le plus grand[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « réflexion ». Littéralement, « un raisonnement entra en eux » ; le terme grec peut désigner une réflexion intérieure, un débat ou une dispute.
    reason: Alternative lexicale préservant l’ambiguïté de διαλογισμός et signalant l’expression littérale Εἰσῆλθεν … ἐν αὐτοῖς.
lexical_decisions:
- source_word: Εἰσῆλθεν
  choice: s’éleva
  rationale: Littéralement « entra » ; avec διαλογισμός, le français idiomatique exprime naturellement l’apparition d’une discussion par « s’éleva ».
- source_word: δὲ
  choice: Alors
  rationale: Connecteur léger de progression narrative, naturel dans le récit.
- source_word: διαλογισμὸς
  choice: discussion
  rationale: Le terme peut désigner un raisonnement intérieur, une réflexion ou un échange de pensées. « Discussion » convient au cadre collectif sans imposer avec certitude l’idée d’une querelle.
- source_word: ἐν αὐτοῖς
  choice: parmi eux
  rationale: Bien que la formulation soit littéralement « en eux », le contexte pluriel permet naturellement « parmi eux », pour ce qui surgit au sein du groupe.
- source_word: τὸ τίς ἂν εἴη
  choice: lequel … pouvait bien être
  rationale: La tournure introduit le contenu de la discussion ; « pouvait bien être » conserve la nuance potentielle et délibérative de ἄν avec l’optatif.
- source_word: μείζων
  choice: le plus grand
  rationale: Le comparatif grec signifie littéralement « plus grand », mais, dans une comparaison portant sur tout un groupe, le superlatif français exprime idiomatiquement le sens visé.
- source_word: αὐτῶν
  choice: d’entre eux
  rationale: Le génitif délimite le groupe au sein duquel s’effectue la comparaison.
theological_decisions:
- issue: Nature de l’échange entre les disciples
  choice: discussion
  alternative: raisonnement, débat ou dispute
  rationale: Le grec n’établit pas sans ambiguïté s’il s’agit d’une réflexion intérieure partagée, d’un débat ou d’une querelle. « Discussion » garde la dimension collective et compétitive du contexte sans accentuer indûment le conflit.
translation_notes:
  register: Français international moderne, fluide et digne. « Pouvait bien être » restitue une interrogation délibérative naturelle ; le point d’interrogation explicite la question indirecte sans en changer le contenu.
