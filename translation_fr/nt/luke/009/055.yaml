base_translation:
  language: en
  yaml_path: translation/nt/luke/009/055.yaml
  text: But he turned and rebuked them[a].
translation:
  language: fr
  text: Mais Jésus se retourna et les réprimanda[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Certains manuscrits tardifs ajoutent : « et dit : “Vous ne savez pas quel esprit vous anime ; car le Fils de l’homme n’est pas venu pour faire périr des vies humaines, mais pour les sauver.” »'
    reason: textual_variant
lexical_decisions:
- source_word: στραφεὶς
  choice: se retourna
  rationale: Le participe aoriste de στρέφω décrit ici le mouvement de Jésus vers les disciples. « Se retourna » est naturel en français et restitue cette réorientation physique.
- source_word: δὲ
  choice: Mais
  rationale: δέ marque ici une légère opposition avec la proposition des disciples au verset précédent. « Mais » rend clairement ce contraste dans le récit.
- source_word: ἐπετίμησεν
  choice: adressa de vifs reproches
  rationale: ἐπιτιμάω exprime une réprimande ferme. Cette tournure française actuelle conserve la force du verbe sans suggérer une nuance étrangère au contexte.
- source_word: αὐτοῖς
  choice: leur
  rationale: Le pronom au datif pluriel renvoie aux disciples, en particulier à Jacques et Jean. La construction « adresser des reproches à quelqu’un » appelle naturellement « leur ».
theological_decisions:
- issue: Développement textuel plus long présent dans certains manuscrits tardifs
  choice: 'Traduire uniquement le texte court du SBLGNT : « Mais Jésus se retourna et leur adressa de vifs reproches. »'
  alternative: '« Mais Jésus se retourna, leur adressa de vifs reproches et dit : “Vous ne savez pas de quel esprit vous êtes animés ; car le Fils de l’homme n’est pas venu pour détruire la vie des êtres humains, mais pour la sauver.” »'
  rationale: Le texte grec fourni ne contient que la leçon courte. L’ajout, bien connu dans la tradition manuscrite tardive, ne doit pas être introduit dans le texte principal, mais son importance dans l’histoire de la transmission justifie une note.
translation_notes:
  register: Français international moderne, naturel et digne. Le sujet explicite « Jésus », repris du contexte, évite une ambiguïté peu naturelle en français. La formulation conserve la brièveté du texte grec tout en rendant nettement la fermeté de la réprimande.
