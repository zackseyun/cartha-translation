id: LUK.9.32
reference: Luke 9:32
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ δὲ Πέτρος καὶ οἱ σὺν αὐτῷ ἦσαν βεβαρημένοι ὕπνῳ· διαγρηγορήσαντες δὲ εἶδον τὴν δόξαν αὐτοῦ καὶ τοὺς δύο ἄνδρας τοὺς συνεστῶτας αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/032.yaml
  text: Peter and those with him were weighed down with sleep; but when they became fully awake[a], they saw his glory and the two men standing with him.
translation:
  language: fr
  text: Pierre et ceux qui étaient avec lui étaient accablés de sommeil. Mais, une fois pleinement réveillés[a], ils virent sa gloire et les deux hommes qui se tenaient avec lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « après s’être réveillés » ou « lorsqu’ils furent tout à fait éveillés ». Le verbe grec est rare et peut souligner qu’ils devinrent pleinement vigilants plutôt qu’ils ne restèrent éveillés tout le temps.
    reason: lexical_alternative
lexical_decisions:
- source_word: βεβαρημένοι ὕπνῳ
  choice: accablés de sommeil
  rationale: L’expression conserve l’image d’un sommeil pesant sur eux, avec une force supérieure à « avaient sommeil », tout en restant naturelle en français moderne.
- source_word: διαγρηγορήσαντες
  choice: une fois pleinement réveillés
  rationale: Dans ce contexte, le participe aoriste rare désigne vraisemblablement l’accès à un état de pleine vigilance, en contraste avec le sommeil qui les accablait. La note maintient l’incertitude lexicale.
- source_word: δόξαν
  choice: gloire
  rationale: « Gloire » conserve à la fois la manifestation visible et la portée biblique et théologique de δόξα dans le récit de la transfiguration.
- source_word: τοὺς δύο ἄνδρας
  choice: les deux hommes
  rationale: Rendu courant et précis de ἀνήρ pour les deux hommes adultes identifiés dans le contexte comme Moïse et Élie.
- source_word: τοὺς συνεστῶτας αὐτῷ
  choice: qui se tenaient avec lui
  rationale: Le participe parfait décrit leur présence debout auprès de Jésus. Cette formulation préserve l’aspect visuel sans réduire le sens à une simple présence.
- source_word: δὲ … δὲ
  choice: '[non rendu explicitement] … Mais'
  rationale: Le premier δέ assure une transition discursive qui n’exige pas de mot introductif en français; le second marque naturellement le contraste entre l’accablement de sommeil et la vision.
theological_decisions:
- issue: Rendu de δόξα dans le contexte de la transfiguration
  choice: sa gloire
  alternative: sa splendeur / sa majesté
  rationale: « Sa gloire » préserve les résonances canoniques et théologiques sans expliciter davantage que le texte la nature de cette manifestation.
- issue: Interprétation de διαγρηγορήσαντες
  choice: une fois pleinement réveillés
  alternative: étant restés éveillés
  rationale: Le choix principal correspond mieux au contraste avec le sommeil qui les accablait, tout en évitant d’affirmer qu’ils avaient veillé sans interruption. L’ambiguïté réelle du verbe rare est signalée en note.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe suit clairement le mouvement du grec, tandis que « accablés de sommeil » et « une fois pleinement réveillés » restent idiomatiques. Le point sépare les deux propositions pour une lecture plus naturelle en français sans affaiblir le contraste exprimé par « Mais ».
