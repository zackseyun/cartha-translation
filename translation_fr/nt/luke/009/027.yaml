id: LUK.9.27
reference: Luke 9:27
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: λέγω δὲ ὑμῖν ἀληθῶς, εἰσίν τινες τῶν ⸀αὐτοῦ ⸀ἑστηκότων οἳ οὐ μὴ γεύσωνται θανάτου ἕως ἂν ἴδωσιν τὴν βασιλείαν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/027.yaml
  text: But I tell you truly[b][a], there are some standing here who will certainly not taste death until they see the kingdom of God.
translation:
  language: fr
  text: 'Mais je vous le dis en vérité : quelques-uns de ceux qui se tiennent ici ne goûteront certainement pas la mort[a] avant d’avoir vu le royaume de Dieu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Goûter la mort » signifie ici « faire l’expérience de la mort », c’est-à-dire « mourir ».
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν ἀληθῶς
  choice: Mais je vous le dis en vérité
  rationale: « Mais » rend le marqueur discursif δέ, tandis que « en vérité » exprime naturellement l’adverbe ἀληθῶς et conserve le caractère solennel de l’affirmation.
- source_word: εἰσίν τινες τῶν αὐτοῦ ἑστηκότων
  choice: quelques-uns de ceux qui se tiennent ici
  rationale: Cette formulation rend la construction partitive et comprend αὐτοῦ dans son emploi adverbial déictique, « ici », en désignant certaines des personnes présentes.
- source_word: οἳ οὐ μὴ γεύσωνται θανάτου
  choice: ne goûteront certainement pas la mort
  rationale: « Certainement pas » restitue la négation grecque fortement emphatique οὐ μή. L’image de « goûter la mort » est conservée, car elle reste compréhensible en français et évite d’aplanir la métaphore en simple « mourir ».
- source_word: ἕως ἂν ἴδωσιν
  choice: avant d’avoir vu
  rationale: Cette tournure française exprime naturellement la limite temporelle future marquée par ἕως ἄν avec le subjonctif aoriste, tout en gardant l’idée qu’ils verront d’abord ce qui est annoncé.
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: le royaume de Dieu
  rationale: « Royaume de Dieu » est l’expression française établie et conserve l’étendue sémantique de βασιλεία sans la réduire au seul exercice du règne.
theological_decisions:
- issue: Référent de « voir le royaume de Dieu »
  choice: Conserver l’expression sans précision interprétative
  alternative: L’identifier explicitement à la transfiguration, à la résurrection et à l’ascension, à la destruction de Jérusalem ou à l’expansion de l’Église
  rationale: Le texte ne précise pas ici la manifestation visée. La traduction préserve donc l’ambiguïté et la tension eschatologique au lieu d’imposer une lecture particulière.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe solennelle de la déclaration est conservée sans archaïsme; la métaphore grecque demeure dans le texte et reçoit une brève explication en note.
