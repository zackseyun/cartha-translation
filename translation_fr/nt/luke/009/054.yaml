id: LUK.9.54
reference: Luke 9:54
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἰδόντες δὲ οἱ ⸀μαθηταὶ Ἰάκωβος καὶ Ἰωάννης εἶπαν· Κύριε, θέλεις εἴπωμεν πῦρ καταβῆναι ἀπὸ τοῦ οὐρανοῦ καὶ ἀναλῶσαι ⸀αὐτούς;
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/054.yaml
  text: When the disciples James and John saw this[a], they said, “Lord, do you want us to command fire to come down from heaven and consume them?”
translation:
  language: fr
  text: 'Quand les disciples Jacques et Jean virent cela, ils dirent : « Seigneur, veux-tu que nous ordonnions au feu de descendre du ciel et de les consumer[a] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « que nous appelions le feu du ciel pour les détruire ». Littéralement, le grec dit : « que nous disions au feu de descendre du ciel et de les consumer ».'
    reason: Alternative lexicale et indication de la formulation grecque littérale.
lexical_decisions:
- source_word: ἰδόντες
  choice: Quand … virent cela
  rationale: Le participe aoriste est rendu par une proposition temporelle naturelle en français. « Cela » explicite sans ajout conceptuel l’objet implicite, à savoir le refus rapporté au verset précédent.
- source_word: οἱ μαθηταὶ Ἰάκωβος καὶ Ἰωάννης
  choice: les disciples Jacques et Jean
  rationale: Cette formulation conserve l’apposition grecque et identifie clairement les deux disciples concernés.
- source_word: Κύριε
  choice: Seigneur
  rationale: Titre usuel et contextuellement approprié dans cette adresse directe à Jésus.
- source_word: θέλεις
  choice: veux-tu
  rationale: Rend directement et naturellement le désir ou l’intention exprimé par θέλω.
- source_word: εἴπωμεν
  choice: que nous ordonnions
  rationale: Bien que le verbe soit littéralement « dire », la construction avec le feu comme sujet de l’infinitif a ici une force injonctive. « Ordonner au feu » est naturel en français sans effacer la tournure grecque, signalée en note.
- source_word: πῦρ καταβῆναι ἀπὸ τοῦ οὐρανοῦ
  choice: au feu de descendre du ciel
  rationale: Préserve l’image vive du feu venant du ciel et l’écho au langage prophétique du jugement.
- source_word: ἀναλῶσαι
  choice: consumer
  rationale: Le verbe peut signifier « consumer » ou « détruire » ; « consumer » maintient ici le lien concret avec le feu.
- source_word: αὐτούς
  choice: les
  rationale: Le pronom renvoie naturellement aux habitants samaritains qui ont refusé de recevoir Jésus.
theological_decisions:
- issue: Objet implicite du participe « ayant vu »
  choice: Ajout de « cela », renvoyant au refus du verset précédent.
  alternative: « À cette vue » ou « Voyant » sans objet exprimé.
  rationale: Le grec ne précise pas l’objet, mais le français courant bénéficie de cette reprise contextuelle. Elle clarifie le lien narratif sans imposer une interprétation théologique supplémentaire.
- issue: Force de la proposition des disciples
  choice: « que nous ordonnions au feu de descendre »
  alternative: « que nous appelions le feu du ciel » ou, littéralement, « que nous disions au feu de descendre »
  rationale: La formulation choisie exprime la valeur injonctive de εἴπωμεν suivi de l’infinitif, tout en conservant en note la littéralité et l’autre rendu possible.
- issue: Portée de ἀναλῶσαι
  choice: « les consumer »
  alternative: « les détruire »
  rationale: « Consumer » conserve l’imagerie du feu sans atténuer la gravité du jugement proposé par les disciples.
translation_notes:
  register: Français international moderne, fluide et digne. Le passé simple convient au registre narratif biblique sans être archaïque ; la question directe reste claire pour un lectorat général.
