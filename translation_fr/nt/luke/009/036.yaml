  verdict: revise
  source_fidelity: La phrase rend fidèlement la temporalité de ἐν τῷ γενέσθαι, la « voix », le silence des disciples et l’absence de tout récit. Toutefois, « Jésus se trouva seul » se comprend normalement en français comme « Jésus constata qu’il était seul » (valeur réfléchie), plutôt que comme le constat narratif exprimé par le passif εὑρέθη. « Jésus se retrouva seul » restitue naturellement le résultat de la scène sans imposer une interprétation théologique.
  naturalness: Le français est globalement clair, actuel et d’un registre narratif approprié. « Jésus se retrouva seul » est plus idiomatique et moins ambigu que « Jésus se trouva seul » dans ce contexte.
  terminology: Les termes « voix », « gardèrent le silence », « racontèrent à personne » et « ce qu’ils avaient vu » sont appropriés. La note conserve utilement le littéral grec et les principales nuances possibles, sans les transformer en interprétation doctrinale.
