  text: καὶ ἐν τῷ γενέσθαι τὴν φωνὴν ⸀εὑρέθη Ἰησοῦς μόνος. καὶ αὐτοὶ ἐσίγησαν καὶ οὐδενὶ ἀπήγγειλαν ἐν ἐκείναις ταῖς ἡμέραις οὐδὲν ὧν ἑώρακαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/036.yaml
  text: And when the voice had come[a], Jesus was found alone. And they kept silent and told no one in those days anything of what they had seen.
translation:
  language: fr
  text: Quand la voix se fit entendre, Jésus se retrouva seul[a]. Quant à eux, ils gardèrent le silence et, en ces jours-là, ne racontèrent à personne rien de ce qu’ils avaient vu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Jésus fut trouvé seul ». On peut aussi comprendre : « il ne resta plus que Jésus » ou « on ne vit plus que Jésus ».'
    reason: La tournure passive grecque admet plusieurs formulations françaises proches ; la note préserve sa forme et l’ambiguïté de sa nuance narrative.
lexical_decisions:
- source_word: ἐν τῷ γενέσθαι τὴν φωνήν
  choice: Quand la voix se fit entendre
  rationale: La construction temporelle avec ἐν et l’infinitif articulaire signifie « quand » ou « au moment où ». « Se fit entendre » exprime naturellement en français la survenue de la voix sans la réduire à un simple bruit.
- source_word: εὑρέθη Ἰησοῦς μόνος
  choice: Jésus se trouva seul
  rationale: Cette formulation française conserve le constat narratif sobre du passif grec tout en évitant l’idée, peu naturelle ici, que Jésus aurait fait l’objet d’une recherche.
- source_word: ἐσίγησαν
  choice: ils gardèrent le silence
  rationale: Cette expression rend directement l’idée de demeurer silencieux dans un registre narratif naturel et digne.
- source_word: οὐδενὶ ἀπήγγειλαν
  choice: ne racontèrent à personne
  rationale: ἀπαγγέλλω signifie rapporter ou raconter. « Raconter à personne » convient au fait de ne pas communiquer ce qu’ils avaient vu.
- source_word: ἐν ἐκείναις ταῖς ἡμέραις
  choice: en ces jours-là
  rationale: Rendu temporel direct qui préserve la portée limitée de leur silence à la période évoquée.
- source_word: οὐδὲν ὧν ἑώρακαν
  choice: rien de ce qu’ils avaient vu
  rationale: La formulation conserve la négation emphatique et la relation partitive du grec, tandis que le plus-que-parfait situe correctement la vision avant leur silence.
theological_decisions:
- issue: Portée narrative de la présence solitaire de Jésus après la voix céleste
  choice: Décrire sobrement le résultat par « Jésus se trouva seul »
  alternative: « Il ne resta plus que Jésus » ou « ils ne virent plus que Jésus »
  rationale: Le grec constate qu’après la voix Jésus était seul, sans préciser si l’accent porte sur le départ des autres figures ou sur ce que les disciples voyaient. La traduction retenue préserve cette retenue et n’ajoute aucune interprétation doctrinale.
translation_notes:
  register: Français international actuel, clair et digne. Le passé simple maintient le registre narratif biblique sans archaïsme marqué ; « Quant à eux » rend le changement de sujet exprimé en grec.
