  text: καὶ ἐποίησαν οὕτως καὶ ⸀κατέκλιναν ἅπαντας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/015.yaml
  text: And they did so[a], and had them all sit down.
translation:
  language: fr
  text: Ils firent ainsi et les installèrent tous pour le repas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « les firent tous s’allonger ». Dans ce contexte, le verbe grec désigne le fait d’installer des personnes pour un repas, souvent en position allongée.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Ils firent ainsi et
  rationale: Le premier καί assure la continuité du récit; en français, l’enchaînement est rendu naturellement sans qu’il soit nécessaire de commencer la phrase par « Et ».
- source_word: ἐποίησαν οὕτως
  choice: Ils firent ainsi
  rationale: Cette formulation reprend sobrement l’ordre donné au verset précédent et conserve le sens adverbial de οὕτως.
- source_word: καὶ
  choice: et
  rationale: La coordination simple préserve la succession narrative des deux actions sans lui ajouter une nuance temporelle explicite.
- source_word: κατέκλιναν
  choice: les installèrent … pour le repas
  rationale: Le verbe causatif désigne ici le fait de faire prendre aux gens la position requise pour manger, normalement allongée dans ce contexte ancien. « Installer pour le repas » est clair en français moderne tout en conservant la dimension de disposition collective.
- source_word: ἅπαντας
  choice: tous
  rationale: Rend explicitement la totalité du groupe comme objet de κατέκλιναν.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La traduction évite l’anachronisme possible de « asseoir » dans le texte principal, tout en explicitant par la note la posture antique évoquée par le grec.
