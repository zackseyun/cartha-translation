source:
  edition: SBLGNT
  text: Ἡ δὲ ἡμέρα ἤρξατο κλίνειν· προσελθόντες δὲ οἱ δώδεκα εἶπαν αὐτῷ· Ἀπόλυσον τὸν ὄχλον, ἵνα ⸀πορευθέντες εἰς τὰς κύκλῳ κώμας ⸀καὶ ἀγροὺς καταλύσωσιν καὶ εὕρωσιν ἐπισιτισμόν, ὅτι ὧδε ἐν ἐρήμῳ τόπῳ ἐσμέν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/012.yaml
  text: The day began to decline[a], and the twelve came and said to him, “Send the crowd away, so that they may go into the surrounding villages and countryside, find lodging, and get provisions[b], because we are here in a desolate place.”
translation:
  language: fr
  text: 'Le jour commençait à baisser. Les Douze s’approchèrent de Jésus et lui dirent : « Renvoie la foule, afin que les gens aillent dans les villages et les campagnes des environs pour trouver où loger et se procurer des provisions[a], car nous sommes ici dans un lieu désert[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de quoi manger ». Le terme grec désigne des vivres ou des réserves alimentaires.
    reason: lexical_alternative
  - marker: b
    text: Ou « un endroit isolé ». Le mot grec peut désigner un lieu inhabité ou peu habité.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἡ δὲ ἡμέρα ἤρξατο κλίνειν
  choice: Le jour commençait à baisser
  rationale: En parlant du jour, κλίνειν évoque son déclin vers le soir. « Le jour commençait à baisser » conserve cette image dans une expression française naturelle.
- source_word: προσελθόντες δὲ οἱ δώδεκα
  choice: Les Douze s’approchèrent de Jésus
  rationale: προσέρχομαι signifie « s’approcher, venir auprès de ». Le nom de Jésus, référent de αὐτῷ, est explicité pour assurer la clarté en français, et « les Douze » conserve la valeur de titre du groupe.
- source_word: Ἀπόλυσον τὸν ὄχλον
  choice: Renvoie la foule
  rationale: Dans ce contexte, ἀπολύω signifie congédier ou renvoyer. Cette formulation est directe et idiomatique.
- source_word: ἵνα πορευθέντες
  choice: afin que les gens aillent
  rationale: La construction exprime le but du renvoi. « Les gens » reprend naturellement les membres de la foule et évite un pronom potentiellement ambigu.
- source_word: εἰς τὰς κύκλῳ κώμας καὶ ἀγρούς
  choice: dans les villages et les campagnes des environs
  rationale: κώμαι désigne des villages et ἀγροί peut désigner les zones rurales ou la campagne. « Des environs » rend κύκλῳ sans réduire ἀγροί aux seuls champs cultivés.
- source_word: καταλύσωσιν
  choice: trouver où loger
  rationale: καταλύω désigne ici le fait de prendre logement ou de trouver un lieu où passer la nuit. La formulation française rend explicite l’objet sous-entendu.
- source_word: εὕρωσιν ἐπισιτισμόν
  choice: se procurer des provisions
  rationale: ἐπισιτισμός désigne des vivres ou des réserves alimentaires. « Se procurer des provisions » conserve l’idée d’obtenir les ressources nécessaires.
- source_word: ὅτι ὧδε ἐν ἐρήμῳ τόπῳ ἐσμέν
  choice: car nous sommes ici dans un endroit isolé
  rationale: ἔρημος décrit ici un lieu écarté, peu ou pas habité. « Isolé » exprime le manque d’habitations et de ressources sans suggérer nécessairement un désert de sable; ὧδε est rendu par « ici ».
