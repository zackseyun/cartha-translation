source:
  edition: SBLGNT
  text: ⸀Καὶ πορευομένων αὐτῶν ἐν τῇ ὁδῷ εἶπέν τις πρὸς αὐτόν· Ἀκολουθήσω σοι ὅπου ⸀ἐὰν ⸀ἀπέρχῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/057.yaml
  text: And as they were going along the road[a], someone said to him, “I will follow you wherever you go.”
translation:
  language: fr
  text: 'Pendant qu’ils avançaient sur la route, quelqu’un lui dit : « Je te suivrai partout où tu iras. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πορευομένων αὐτῶν
  choice: Pendant qu’ils avançaient
  rationale: Le génitif absolu avec participe présent exprime une action en cours, contemporaine de la parole rapportée. Cette formulation est naturelle en français et conserve cette valeur temporelle.
- source_word: ἐν τῇ ὁδῷ
  choice: sur la route
  rationale: La formule désigne concrètement le cadre du déplacement, tout en laissant subsister le motif lucanien du chemin sans l’expliciter.
- source_word: εἶπέν τις
  choice: quelqu’un lui dit
  rationale: Le pronom indéfini τις ne précise ni l’identité ni le sexe de la personne; « quelqu’un » évite donc tout ajout.
- source_word: Ἀκολουθήσω σοι
  choice: Je te suivrai
  rationale: Le futur exprime ici une intention ou un engagement. « Suivre » préserve à la fois le déplacement concret et la résonance de l’engagement comme disciple.
- source_word: ὅπου ἐὰν ἀπέρχῃ
  choice: partout où tu iras
  rationale: ὅπου avec ἐάν et le subjonctif a une portée indéfinie. En français, « partout où tu iras » rend naturellement l’idée d’un engagement sans restriction; ἀπέρχομαι peut signifier plus littéralement « partir », mais « aller » convient au contexte.
theological_decisions:
- issue: Portée de ἀκολουθέω dans le contexte de l’appel à devenir disciple
  choice: Je te suivrai
  alternative: Je deviendrai ton disciple
  rationale: « Suivre » conserve simultanément le sens concret et la portée liée à la condition de disciple, sans transformer cette résonance en paraphrase explicative.
translation_notes:
  register: Français international moderne, clair et digne. La phrase garde le mouvement narratif et l’engagement catégorique de la personne sans préciser son identité ni développer explicitement la notion de disciple.
