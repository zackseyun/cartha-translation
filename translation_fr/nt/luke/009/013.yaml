id: LUK.9.13
reference: Luke 9:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἶπεν δὲ πρὸς αὐτούς· Δότε αὐτοῖς ⸂ὑμεῖς φαγεῖν⸃. οἱ δὲ εἶπαν· Οὐκ εἰσὶν ἡμῖν πλεῖον ἢ ⸂ἄρτοι πέντε⸃ καὶ ἰχθύες δύο, εἰ μήτι πορευθέντες ἡμεῖς ἀγοράσωμεν εἰς πάντα τὸν λαὸν τοῦτον βρώματα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/013.yaml
  text: But he said to them[a], “You give them something to eat.” But they said[b], “We have no more than five loaves and two fish—unless we go and buy food for all this people.”
translation:
  language: fr
  text: 'Mais il leur dit : « Donnez-leur vous-mêmes à manger. » Ils répondirent : « Nous n’avons pas plus de cinq pains et deux poissons — à moins d’aller nous-mêmes acheter de quoi manger pour tout ce peuple[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour toute cette foule ».
    reason: lexical_alternative
lexical_decisions:
- source_word: Δότε αὐτοῖς ὑμεῖς φαγεῖν
  choice: Donnez-leur vous-mêmes à manger
  rationale: Cette tournure française naturelle conserve l’impératif, l’idiome « donner à manger » et l’accent porté par le pronom explicite ὑμεῖς.
- source_word: πλεῖον ἢ ἄρτοι πέντε καὶ ἰχθύες δύο
  choice: pas plus de cinq pains et deux poissons
  rationale: La formulation exprime directement la limitation marquée par la négation avec πλεῖον ἢ; « pains » désigne ici des pains individuels.
- source_word: εἰ μήτι
  choice: à moins de
  rationale: Rend l’exception envisagée, avec sa légère nuance de réserve, sans alourdir la phrase.
- source_word: πορευθέντες ἡμεῖς ἀγοράσωμεν
  choice: d’aller nous-mêmes acheter
  rationale: Le participe est naturellement subordonné en français à l’action d’acheter; le pronom explicite ἡμεῖς justifie « nous-mêmes ».
- source_word: βρώματα
  choice: de quoi manger
  rationale: Expression courante et précise dans ce contexte, qui rend le pluriel concret sans employer un terme administratif comme « provisions ».
- source_word: πάντα τὸν λαὸν τοῦτον
  choice: tout ce peuple
  rationale: Conserve le sens collectif de λαός et la force du démonstratif τοῦτον; « toute cette foule » reste possible selon le contexte.
theological_decisions:
- issue: Ton de l’ordre de Jésus et de la réponse des disciples
  choice: Présenter un ordre direct, avec l’accent explicite sur « vous-mêmes », puis une objection pratique sans ajouter d’ironie ni d’exaspération.
  alternative: Atténuer l’emphase en traduisant simplement « Donnez-leur à manger », ou accentuer le ton de reproche.
  rationale: Le grec marque l’emphase par ὑμεῖς, mais ne précise pas une émotion plus forte. La traduction conserve donc l’accent grammatical sans imposer un ton théologique ou psychologique.
translation_notes:
  register: Français international moderne, naturel et digne. « Vous-mêmes » préserve l’emphase du pronom grec; « de quoi manger » évite une répétition lourde de « nourriture » tout en restant accessible.
