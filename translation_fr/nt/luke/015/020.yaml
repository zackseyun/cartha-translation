  naturalness: Le français est moderne, fluide et d’un registre narratif approprié. « Se jeter à son cou » et « l’embrassa avec effusion » sont naturels et conservent la vivacité du récit. L’emploi de « alors que » évite l’ambiguïté possible de « comme ».
  terminology: « Fut saisi de compassion » rend bien ἐσπλαγχνίσθη sans théologiser le texte. « Avec effusion » est une restitution recevable de l’intensité de καταφιλέω; la note préserve à juste titre la possibilité de baisers répétés sans l’imposer.
