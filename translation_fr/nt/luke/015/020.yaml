  text: καὶ ἀναστὰς ἦλθεν πρὸς τὸν πατέρα ⸀ἑαυτοῦ. ἔτι δὲ αὐτοῦ μακρὰν ἀπέχοντος εἶδεν αὐτὸν ὁ πατὴρ αὐτοῦ καὶ ἐσπλαγχνίσθη καὶ δραμὼν ἐπέπεσεν ἐπὶ τὸν τράχηλον αὐτοῦ καὶ κατεφίλησεν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/020.yaml
  text: And he arose and came to his father[a]. But while he was still far away, his father saw him and was moved with compassion[b], and ran and fell on his neck and kissed him fervently.
translation:
  language: fr
  text: Alors il se leva et alla vers son père. Mais, alors qu’il était encore loin[a], son père le vit et fut saisi de compassion. Il courut se jeter à son cou et l’embrassa avec effusion[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « alors qu’il était encore à une grande distance ».'
    reason: lexical_alternative
  - marker: b
    text: Le verbe grec exprime un baiser affectueux et intense et peut évoquer des baisers répétés.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστὰς
  choice: il se leva
  rationale: Le participe aoriste marque l’action résolue qui précède le départ du fils. « Il se leva » conserve clairement cette succession narrative sans fondre les deux verbes en un seul.
- source_word: ἦλθεν πρὸς τὸν πατέρα ἑαυτοῦ
  choice: alla vers son père
  rationale: ἔρχομαι peut se rendre par « venir » ou « aller » selon le point de vue. En français narratif, « alla vers son père » est naturel et maintient l’orientation exprimée par πρὸς.
- source_word: ἔτι δὲ αὐτοῦ μακρὰν ἀπέχοντος
  choice: comme il était encore loin
  rationale: Le génitif absolu exprime une circonstance simultanée. Cette formulation moderne et concise préserve à la fois la distance et l’idée qu’elle subsistait encore.
- source_word: ἐσπλαγχνίσθη
  choice: fut saisi de compassion
  rationale: Le verbe désigne une compassion profonde et viscérale. « Fut saisi de compassion » en restitue la force affective sans ajouter d’interprétation théologique.
- source_word: δραμὼν
  choice: il courut
  rationale: Traduction directe du participe aoriste de τρέχω, intégrée naturellement à la suite d’actions en français.
- source_word: ἐπέπεσεν ἐπὶ τὸν τράχηλον αὐτοῦ
  choice: se jeter à son cou
  rationale: Cette expression française idiomatique conserve l’image vive du grec, littéralement « tomber sur son cou », sans expliciter des gestes que le texte ne nomme pas.
- source_word: κατεφίλησεν
  choice: l’embrassa avec effusion
  rationale: Le composé καταφιλέω peut communiquer une affection intense et éventuellement des baisers répétés. « Avec effusion » préserve l’intensité sans imposer la répétition comme seule analyse possible.
theological_decisions:
- issue: La représentation de la compassion du père dans la parabole
  choice: Conserver la vive initiative affective du père sans l’identifier explicitement à Dieu dans la traduction.
  alternative: Atténuer l’émotion du père, ou développer le texte afin d’en expliciter une interprétation théologique.
  rationale: Les verbes du récit présentent eux-mêmes une réaction profondément compatissante et une initiative immédiate. La traduction en garde la force tout en laissant au lecteur l’interprétation symbolique de la parabole.
translation_notes:
  register: Français international moderne, digne et narratif. Les phrases restent simples et accessibles, tandis que « fut saisi de compassion », « se jeter à son cou » et « avec effusion » conservent la chaleur et la vivacité de la scène. Les marqueurs de notes sont placés précisément après les expressions qu’ils éclairent.
