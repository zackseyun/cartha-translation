  text: ἀναστὰς πορεύσομαι πρὸς τὸν πατέρα μου καὶ ἐρῶ αὐτῷ· Πάτερ, ἥμαρτον εἰς τὸν οὐρανὸν καὶ ἐνώπιόν σου,
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/018.yaml
  text: I will get up and go to my father[a], and I will say to him, ‘Father[b], I have sinned against heaven and before you,’
translation:
  language: fr
  text: 'Je me lèverai, j’irai vers mon père et je lui dirai : « Père, j’ai péché contre le ciel[a] et devant toi[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ici, « le ciel » désigne probablement Dieu de manière révérencieuse. Autre traduction : « contre Dieu ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « à tes yeux ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστὰς
  choice: Je vais me lever
  rationale: Le participe aoriste exprime la première action du projet arrêté par le fils. En français naturel, la périphrase « je vais » peut régir la série des infinitifs « me lever, aller… et dire », tout en conservant l’enchaînement des actions.
- source_word: πορεύσομαι
  choice: aller
  rationale: Le futur de πορεύομαι indique ici un déplacement vers le père. « Aller » est courant et précis, sans ajouter l’idée plus marquée d’un départ en voyage.
- source_word: πρὸς τὸν πατέρα μου
  choice: vers mon père
  rationale: πρός avec l’accusatif marque le mouvement en direction d’une personne. « Vers mon père » conserve explicitement cette orientation et convient au contexte du retour.
- source_word: ἐρῶ αὐτῷ
  choice: lui dire
  rationale: Le futur de λέγω avec le datif désigne les paroles que le fils adressera à son père. « Lui dire » rend directement et naturellement la construction grecque.
- source_word: Πάτερ
  choice: Père
  rationale: Le vocatif est rendu par une adresse directe, sans ajouter le possessif absent du grec.
- source_word: ἥμαρτον
  choice: j’ai péché
  rationale: Le passé composé exprime naturellement en français une faute commise dont les conséquences demeurent présentes dans cette confession.
- source_word: εἰς τὸν οὐρανὸν
  choice: contre le ciel
  rationale: La formulation conserve « le ciel », probablement employé comme manière révérencieuse de parler de Dieu, plutôt que de remplacer l’expression par son interprétation.
- source_word: ἐνώπιόν σου
  choice: devant toi
  rationale: ἐνώπιον avec le génitif signifie « devant, en présence de, aux yeux de ». « Devant toi » préserve cette formulation distincte sans la fondre dans le précédent « contre ».
theological_decisions:
- issue: Faut-il remplacer « le ciel » par une mention explicite de Dieu ?
  choice: Conserver « contre le ciel » dans le texte principal.
  alternative: « contre Dieu »
  rationale: Le grec dit littéralement « le ciel », vraisemblablement comme désignation révérencieuse de Dieu. Garder cette expression préserve l’idiome et son relief théologique sans imposer son interprétation dans le texte.
- issue: Faut-il rendre ἐνώπιόν σου par une seconde expression signifiant « contre toi » ?
  choice: Conserver « devant toi ».
  alternative: « contre toi »
  rationale: La seconde expression grecque n’emploie pas la même préposition que la première. « Devant toi » maintient la distinction et laisse ouverte la nuance de faute commise en présence du père ou à ses yeux.
translation_notes:
  register: Français international moderne, naturel et digne. La tournure « Je vais me lever, aller… et lui dire » rend avec fluidité la résolution du fils et l’enchaînement grec du participe avec les futurs. Les marqueurs de notes sont placés immédiatement après les expressions qu’ils expliquent.
