source:
  edition: SBLGNT
  text: Ἦν δὲ ὁ υἱὸς αὐτοῦ ὁ πρεσβύτερος ἐν ἀγρῷ· καὶ ὡς ἐρχόμενος ἤγγισεν τῇ οἰκίᾳ, ἤκουσεν συμφωνίας καὶ χορῶν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/025.yaml
  text: His older son was in the field; and as he came and drew near to the house[a], he heard music and dancing,
translation:
  language: fr
  text: Son fils aîné était aux champs ; comme il arrivait et s’approchait de la maison, il entendit de la musique et des danses[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de la musique instrumentale et des groupes de danseurs ». Les termes grecs peuvent désigner plus précisément une exécution musicale et des groupes qui dansent.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἦν δὲ
  choice: était
  rationale: δέ marque ici une transition narrative légère; le passage à une nouvelle phrase suffit en français, sans imposer un contraste par « mais » ni ajouter un « maintenant » temporel.
- source_word: ὁ υἱὸς αὐτοῦ ὁ πρεσβύτερος
  choice: son fils aîné
  rationale: Dans une opposition entre deux fils, le français idiomatique emploie « fils aîné ». Ici, cela désigne le plus âgé des deux sans importer une idée étrangère au récit.
- source_word: ἐν ἀγρῷ
  choice: aux champs
  rationale: L’expression française courante « aux champs » rend naturellement le lieu agricole désigné par ἀγρός.
- source_word: ὡς ἐρχόμενος
  choice: comme il revenait
  rationale: Le participe décrit le mouvement en cours vers la maison. « Revenait » est naturel dans le contexte où le fils rentre des champs, sans modifier la direction indiquée par la suite.
- source_word: ἤγγισεν τῇ οἰκίᾳ
  choice: approchait de la maison
  rationale: Rend directement l’idée de s’approcher, avec une formulation française fluide coordonnée au verbe précédent.
- source_word: ἤκουσεν
  choice: il entendit
  rationale: Le passé simple convient au récit écrit et rend sobrement l’aoriste narratif.
- source_word: συμφωνίας
  choice: de la musique
  rationale: συμφωνία désigne ici une exécution ou des sons musicaux, probablement instrumentaux. « Musique » est clair et évite l’anachronisme de « symphonie ».
- source_word: χορῶν
  choice: des danses
  rationale: χορός peut désigner la danse ou un groupe de danseurs. « Des danses » préserve le sens événementiel naturel dans l’association avec la musique.
