  naturalness: « Je ne suis plus digne d’être appelé ton fils » est naturel et d’un registre approprié. « Fais de moi l’un de tes ouvriers salariés » est une formulation française claire et naturelle dans le contexte de la parabole.
  terminology: « Fils » conserve le masculin précis de υἱός. « Ouvriers salariés » communique utilement que μίσθιοι désigne des travailleurs engagés contre rémunération, par opposition aux esclaves domestiques. La note est ajustée afin que ses variantes restent cohérentes avec cette distinction.
  issues:
