source:
  edition: SBLGNT
  text: ⸀οὐκέτι εἰμὶ ἄξιος κληθῆναι υἱός σου· ποίησόν με ὡς ἕνα τῶν μισθίων σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/019.yaml
  text: I am no longer worthy to be called your son[a]. Make me like one of your hired workers.
translation:
  language: fr
  text: Je ne suis plus digne d’être appelé ton fils. Fais de moi l’un de tes ouvriers salariés[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’un de tes travailleurs rémunérés » ou « l’un de tes journaliers ». Le terme grec désigne des travailleurs engagés contre salaire, et non des esclaves de la maison.
    reason: alternative lexicale
lexical_decisions:
- source_word: οὐκέτι
  choice: ne… plus
  rationale: Rend naturellement en français la négation temporelle qui marque un changement de situation.
- source_word: ἄξιος
  choice: digne
  rationale: Conserve la dimension morale et sociale de l’aptitude à porter le statut de fils.
- source_word: κληθῆναι
  choice: être appelé
  rationale: Préserve à la fois la formulation passive et l’idée d’être désigné ou reconnu comme tel.
- source_word: υἱός
  choice: fils
  rationale: Le grec est masculin singulier et désigne précisément la relation filiale dans la parabole.
- source_word: ποίησόν με
  choice: Traite-moi
  rationale: Dans ce contexte, la demande porte sur la place que le père accordera au fils parmi ses salariés. « Fais de moi » serait plus littéral, mais moins idiomatique avec la comparaison introduite par ὡς.
- source_word: ὡς ἕνα τῶν μισθίων σου
  choice: comme l’un de tes ouvriers salariés
  rationale: ὡς exprime ici la comparaison, et μίσθιος désigne une personne employée contre salaire, à distinguer d’un esclave domestique.
theological_decisions:
- issue: Le statut exprimé dans la confession du fils
  choice: Conserver « digne » et « fils »
  alternative: « Je ne mérite plus d’être appelé ton enfant »
  rationale: La formulation retenue maintient la force relationnelle et sociale du grec sans réduire la parole à un simple sentiment de honte ni en tirer une conclusion doctrinale.
- issue: La portée comparative de ὡς
  choice: « Traite-moi comme l’un de… »
  alternative: « Fais de moi l’un de… »
  rationale: Le grec comporte ὡς, qui peut préserver une nuance comparative. La traduction évite donc d’effacer cette tension en affirmant sans nuance une intégration formelle au groupe des salariés.
translation_notes:
  register: Français international moderne, naturel et digne. « Ouvriers salariés » explicite la rémunération tout en restant accessible; la note conserve des équivalents possibles et la distinction sociale du terme grec.
