id: LUK.15.23
reference: Luke 15:23
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ⸀φέρετε τὸν μόσχον τὸν σιτευτόν, θύσατε, καὶ φαγόντες εὐφρανθῶμεν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/023.yaml
  text: And bring the fattened calf[a], slaughter it, and let us eat and celebrate,
translation:
  language: fr
  text: Amenez le veau engraissé, abattez-le[a], puis mangeons et faisons la fête.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sacrifiez-le » ; le verbe grec peut désigner l’abattage d’un animal et, dans certains contextes, comporter une nuance sacrificielle.
    reason: Alternative lexicale préservant la possible connotation sacrificielle de θύω.
lexical_decisions:
- source_word: φέρετε
  choice: Amenez
  rationale: L’impératif pluriel appelle à faire venir l’animal auprès du père et de ses serviteurs. « Amenez » est naturel en français et n’ajoute ni « ici » ni « dehors », absents du grec.
- source_word: μόσχον τὸν σιτευτόν
  choice: le veau engraissé
  rationale: μόσχος désigne un jeune bovin et σιτευτός un animal spécialement nourri et engraissé, notamment en vue d’une occasion festive. L’expression française est claire et idiomatique.
- source_word: θύσατε
  choice: abattez-le
  rationale: Le verbe peut désigner l’abattage d’un animal et, selon le contexte, sa mise à mort sacrificielle. Ici, « abattez-le » exprime directement la préparation du banquet sans imposer une lecture cultuelle.
- source_word: φαγόντες
  choice: mangeons
  rationale: Le participe aoriste signifie littéralement « ayant mangé », mais il participe ici à l’invitation collective. La coordination française « mangeons et faisons la fête » rend naturellement le mouvement de la phrase sans transformer le verbe en « festoyons ».
- source_word: εὐφρανθῶμεν
  choice: faisons la fête
  rationale: Ce subjonctif d’exhortation à la première personne du pluriel exprime une réjouissance collective. « Faisons la fête » convient au banquet et reste courant, clair et digne.
- source_word: καὶ ... καὶ
  choice: puis ... et
  rationale: Le français exprime naturellement la progression des ordres par « puis » et coordonne les deux actions collectives par « et », tout en conservant l’enchaînement cumulatif du grec.
theological_decisions:
- issue: Nuance sacrificielle possible de θύσατε
  choice: Traduire dans le texte principal par « abattez-le »
  alternative: « sacrifiez-le » ou « immolez-le »
  rationale: Dans le contexte narratif, l’action vise immédiatement la préparation d’un repas de fête. Une formulation explicitement sacrificielle pourrait introduire une dimension cultuelle que la parabole n’affirme pas clairement. La note conserve toutefois l’étendue sémantique du verbe grec et l’ambiguïté possible.
translation_notes:
  register: Français international moderne, naturel et accessible. L’impératif « Amenez » garde l’adresse plurielle, tandis que « mangeons et faisons la fête » restitue l’exhortation collective. La formulation demeure festive sans devenir familière.
