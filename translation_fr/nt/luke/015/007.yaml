id: LUK.15.7
reference: Luke 15:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: λέγω ὑμῖν ὅτι οὕτως χαρὰ ⸂ἐν τῷ οὐρανῷ ἔσται⸃ ἐπὶ ἑνὶ ἁμαρτωλῷ μετανοοῦντι ἢ ἐπὶ ἐνενήκοντα ἐννέα δικαίοις οἵτινες οὐ χρείαν ἔχουσιν μετανοίας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/007.yaml
  text: I tell you[b][a], in the same way there will be joy in heaven over one sinner who has a change of mind than over ninety-nine righteous people who have no need of one.
translation:
  language: fr
  text: 'Je vous le dis : de la même manière[a], il y aura plus de joie dans le ciel pour un seul pécheur qui se repent que pour quatre-vingt-dix-neuf justes[b] qui n’ont pas besoin de repentance.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ainsi » ou « de cette façon ». L’expression relie la joie céleste à la pointe de la parabole précédente.
    reason: lexical_alternative
  - marker: b
    text: Le texte dit « justes ». Dans le contexte, ce terme peut être compris au sens direct ou avec une nuance ironique ; la traduction ne tranche pas.
    reason: alternative_reading
lexical_decisions:
- source_word: λέγω ὑμῖν
  choice: Je vous le dis
  rationale: Formule française naturelle et solennelle qui conserve l’adresse directe.
- source_word: οὕτως
  choice: de la même manière
  rationale: Relie explicitement l’affirmation à la pointe de la parabole précédente, tout en conservant la possibilité de traduire par « ainsi ».
- source_word: χαρὰ ἐν τῷ οὐρανῷ ἔσται
  choice: il y aura dans le ciel plus de joie
  rationale: Tour français naturel; « plus » explicite la comparaison portée par ἤ et évite une construction française fautive ou obscure.
- source_word: ἐπὶ ἑνὶ ἁμαρτωλῷ
  choice: pour un seul pécheur
  rationale: Avec χαρά, ἐπί indique ici ce qui motive ou occasionne la joie; « pour » convient naturellement en français.
- source_word: μετανοοῦντι
  choice: qui change de disposition
  rationale: Rend le participe présent comme une caractérisation active du pécheur et exprime un changement intérieur d’orientation sans réduire le terme à une simple émotion de regret.
- source_word: ἢ
  choice: plus… que
  rationale: Dans cette comparaison, ἤ introduit le second terme; la structure corrélative « plus… que » est idiomatique en français.
- source_word: ἐνενήκοντα ἐννέα δικαίοις
  choice: quatre-vingt-dix-neuf justes
  rationale: L’adjectif substantivé se rend naturellement par « justes » en français, sans préciser s’ils le sont réellement ou à leurs propres yeux.
- source_word: οἵτινες οὐ χρείαν ἔχουσιν μετανοίας
  choice: qui n’ont pas besoin de changer de disposition
  rationale: Rend clairement la proposition descriptive et répète l’idée de μετάνοια afin d’éviter un pronom anaphorique ambigu.
theological_decisions:
- issue: Les « justes » sont-ils réellement justes, ou l’expression est-elle ironique ?
  choice: Conserver simplement « justes » et signaler l’ambiguïté en note.
  alternative: Paraphraser « ceux qui se croient justes » ou marquer le mot par des guillemets.
  rationale: Le grec dit δικαίοις sans marque explicite d’ironie. La traduction doit préserver la tension interprétative au lieu de la résoudre.
- issue: Qui éprouve la joie dans le ciel ?
  choice: Conserver la formulation impersonnelle et locative « il y aura dans le ciel… de la joie ».
  alternative: Préciser que Dieu ou les anges se réjouissent.
  rationale: Le verset indique le lieu de la joie sans en nommer explicitement les sujets; les ajouter dépasserait le texte grec.
- issue: Nature de la comparaison entre un pécheur et quatre-vingt-dix-neuf justes
  choice: Employer « plus de joie… que », sans nier qu’il puisse aussi y avoir de la joie pour les justes.
  alternative: Employer « de la joie… plutôt que », formulation susceptible de suggérer une opposition exclusive.
  rationale: La construction compare le degré ou l’occasion de la joie; « plus… que » rend clairement cette valeur en français.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation évite les archaïsmes et conserve les ambiguïtés du grec. « Changer de disposition » est retenu pour μετάνοια afin d’exprimer une réorientation intérieure, bien que « se repentir » soit l’équivalent français traditionnel et plus immédiatement idiomatique.
