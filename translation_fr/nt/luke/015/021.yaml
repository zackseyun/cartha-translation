  variant: modern international French
source:
  edition: SBLGNT
  text: εἶπεν δὲ ⸂ὁ υἱὸς αὐτῷ⸃· Πάτερ, ἥμαρτον εἰς τὸν οὐρανὸν καὶ ἐνώπιόν σου, ⸀οὐκέτι εἰμὶ ἄξιος κληθῆναι υἱός ⸀σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/021.yaml
  text: But the son said to him[a], ‘Father, I have sinned against heaven and before you[b]. I am no longer worthy to be called your son.’
translation:
  language: fr
  text: 'Mais le fils lui dit : « Père, j’ai péché contre le ciel[a] et devant toi. Je ne suis plus digne d’être appelé ton fils. »[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression grecque « contre le ciel » emploie « le ciel » comme une manière respectueuse de désigner Dieu ; certaines traductions rendent donc le sens explicitement par « contre Dieu ».
    reason: lexical_alternative
  - marker: b
    text: 'Certains manuscrits prolongent les paroles du fils par l’équivalent de : « Traite-moi comme l’un de tes ouvriers », en accord avec le verset 19. Le texte du SBLGNT termine ici la phrase par « ton fils ».'
    reason: textual_variant
lexical_decisions:
- source_word: εἶπεν δὲ
  choice: Mais ... dit
  rationale: δέ est un connecteur léger. « Mais » marque ici naturellement le contraste entre l’accueil empressé du père et la confession que le fils commence néanmoins à prononcer.
- source_word: ὁ υἱὸς αὐτῷ
  choice: le fils lui dit
  rationale: Cette formulation suit de près le grec tout en restant naturelle et claire en français.
- source_word: Πάτερ
  choice: Père
  rationale: Le vocatif est rendu directement, sans ajouter le possessif « mon », absent du grec.
- source_word: ἥμαρτον
  choice: j’ai péché
  rationale: Le passé composé convient naturellement en français à cet aveu d’une faute passée dont les conséquences demeurent présentes.
- source_word: εἰς τὸν οὐρανὸν
  choice: contre le ciel
  rationale: La formulation grecque est conservée afin de préserver la périphrase révérencielle qui désigne Dieu sans rendre explicitement ce que le texte laisse implicite.
- source_word: καὶ ἐνώπιόν σου
  choice: et devant toi
  rationale: « Devant toi » préserve le sens premier de présence ou de regard porté par ἐνώπιον, plutôt que de l’interpréter directement comme « contre toi ».
- source_word: οὐκέτι εἰμὶ ἄξιος
  choice: je ne suis plus digne
  rationale: Rendu idiomatique qui conserve le jugement moral et relationnel exprimé par le fils.
- source_word: κληθῆναι υἱός σου
  choice: d’être appelé ton fils
  rationale: Le passif et la relation filiale sont rendus directement et naturellement.
theological_decisions:
- issue: Sens de « ciel » dans la confession
  choice: Conserver « contre le ciel » dans le texte et expliquer qu’il s’agit d’une manière respectueuse de parler de Dieu.
  alternative: Traduire explicitement « contre Dieu ».
  rationale: Le grec dit « ciel ». Garder cette expression préserve à la fois l’image et son caractère implicite, sans imposer l’interprétation dans le corps du texte.
- issue: Étendue des paroles du fils dans ce verset
  choice: Achever les paroles par « ton fils », conformément au texte du SBLGNT fourni.
  alternative: Ajouter « Traite-moi comme l’un de tes ouvriers », selon certains manuscrits et en accord avec le verset 19.
  rationale: La traduction suit le texte source retenu, tandis qu’une note signale avec transparence la variante manuscrite.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe demeure accessible, tout en conservant la périphrase « contre le ciel » et la nuance littérale de « devant toi ».
