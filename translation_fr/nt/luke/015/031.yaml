  text: ὁ δὲ εἶπεν αὐτῷ· Τέκνον, σὺ πάντοτε μετ’ ἐμοῦ εἶ, καὶ πάντα τὰ ἐμὰ σά ἐστιν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/031.yaml
  text: And he said to him[a], ‘Child, you are always with me, and all that is mine is yours.’
translation:
  language: fr
  text: 'Mais il lui dit : « Mon enfant, tu es toujours avec moi, et tout ce qui est à moi est à toi. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τέκνον
  choice: Mon enfant
  rationale: En apostrophe, « mon enfant » est une formule familiale affectueuse et naturelle en français. Elle conserve la tendresse de τέκνον sans employer explicitement « fils » ; le possessif, idiomatique dans cette adresse française, n'indique pas ici une nuance de possession absente du grec.
- source_word: πάντοτε
  choice: toujours
  rationale: « Toujours » rend directement la continuité exprimée par πάντοτε et convient au français courant.
- source_word: μετ’ ἐμοῦ
  choice: avec moi
  rationale: La préposition μετά avec le génitif exprime ici l'association ; « avec moi » en est l'équivalent direct et naturel.
- source_word: πάντα τὰ ἐμὰ
  choice: tout ce qui est à moi
  rationale: Cette tournure française rend la totalité des biens ou possessions visés par le neutre pluriel, sans les réduire explicitement au seul patrimoine.
- source_word: σά ἐστιν
  choice: est à toi
  rationale: « Est à toi » suit la structure grecque et préserve l'ampleur de la relation exprimée, sans préciser davantage sa portée juridique.
- source_word: ὁ δὲ εἶπεν αὐτῷ
  choice: Mais il lui dit
  rationale: Dans ce contexte, δέ introduit la réponse du père en contraste doux avec la plainte de l'aîné. « Mais » rend ce mouvement discursif sans le durcir.
theological_decisions:
- issue: Formule familiale employée par le père
  choice: Traduire τέκνον par « Mon enfant »
  alternative: « Fils » ou « Mon fils »
  rationale: τέκνον met l'accent sur le lien familial et la tendresse sans employer le terme grec spécifique pour « fils ». « Mon enfant » constitue en français une apostrophe affectueuse naturelle et ne renforce pas indûment la formulation.
translation_notes:
  register: Français moderne, digne et accessible. La phrase conserve le contraste introduisant la réponse du père ainsi que la portée large de « tout ce qui est à moi est à toi ». Aucune note n'est nécessaire, car « mon enfant » transmet naturellement en français la valeur affectueuse de τέκνον.
