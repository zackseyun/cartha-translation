  text: Εἶπεν δέ· Ἄνθρωπός τις εἶχεν δύο υἱούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/011.yaml
  text: Then he said[a], “A certain man had two sons.”
translation:
  language: fr
  text: 'Puis il dit : « Un homme[a] avait deux fils. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi traduire : « un certain homme ». Le grec emploie un pronom indéfini qui individualise légèrement cet homme sans l’identifier.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἶπεν δέ
  choice: Puis il dit
  rationale: L’aoriste de λέγω introduit la suite du discours, tandis que δέ marque ici une transition légère. « Puis il dit » rend naturellement cette progression sans créer un contraste absent du grec.
- source_word: Ἄνθρωπός τις
  choice: Un homme
  rationale: ἄνθρωπος désigne ici un homme, père de deux fils. L’indéfini τις individualise légèrement le personnage sans l’identifier. En français courant, « un homme » exprime naturellement cette indétermination; la nuance de « un certain homme » est signalée en note.
- source_word: εἶχεν
  choice: avait
  rationale: L’imparfait de ἔχω présente la situation initiale du récit; l’imparfait français « avait » lui correspond naturellement.
- source_word: δύο
  choice: deux
  rationale: Traduction directe du nombre cardinal.
- source_word: υἱούς
  choice: fils
  rationale: υἱούς désigne spécifiquement des fils, détail familial essentiel à la parabole.
theological_decisions:
- issue: Portée indéfinie de Ἄνθρωπός τις
  choice: Un homme
  alternative: Un certain homme
  rationale: « Un homme » est idiomatique en français moderne et conserve le caractère indéfini du personnage. « Un certain homme » reproduit plus explicitement τις, mais risque en français de suggérer un individu particulier déjà connu. La note préserve cette nuance sans imposer une lecture allégorique.
translation_notes:
  register: Français international moderne, simple et digne. La ponctuation française du discours direct est employée. Le lien discursif est rendu par « Puis », et la formulation reste naturelle à l’oral comme à l’écrit.
