id: LUK.15.24
reference: Luke 15:24
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὅτι οὗτος ὁ υἱός μου νεκρὸς ἦν καὶ ἀνέζησεν, ⸂ἦν ἀπολωλὼς⸃ καὶ εὑρέθη. καὶ ἤρξαντο εὐφραίνεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/024.yaml
  text: because this son of mine was dead and has come to life again[a]; he was lost and has been found[b]. And they began to celebrate.
translation:
  language: fr
  text: car mon fils que voici était mort et il est revenu à la vie ; il était perdu et il a été retrouvé. Et ils commencèrent à faire la fête.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: car
  rationale: Introduit naturellement en français l’explication donnée par le père, avec une valeur causale claire.
- source_word: οὗτος ὁ υἱός μου
  choice: mon fils que voici
  rationale: Conserve l’insistance du démonstratif οὗτος tout en restant idiomatique et digne en français moderne.
- source_word: νεκρὸς ἦν
  choice: était mort
  rationale: Reproduit sans l’atténuer l’image forte de la mort, malgré sa portée métaphorique dans la parabole.
- source_word: ἀνέζησεν
  choice: est revenu à la vie
  rationale: Exprime naturellement l’idée de vivre de nouveau et maintient l’opposition directe avec « était mort ».
- source_word: ἦν ἀπολωλὼς
  choice: était perdu
  rationale: Préserve le motif perdu-retrouvé qui structure Luc 15 et rend simplement l’état antérieur décrit par la construction grecque.
- source_word: εὑρέθη
  choice: a été retrouvé
  rationale: Maintient le passif et ne précise pas l’agent ; « retrouvé » correspond naturellement à l’état de ce qui était perdu.
- source_word: ἤρξαντο εὐφραίνεσθαι
  choice: ils commencèrent à faire la fête
  rationale: Conserve l’aspect initial de ἤρξαντο et rend le réjouissement festif dans le contexte du banquet en français courant.
theological_decisions:
- issue: Portée métaphorique de « mort » et « revenu à la vie »
  choice: Conserver sans paraphrase le langage de mort et de retour à la vie.
  alternative: 'Expliciter : « était comme mort » ou interpréter la restauration comme uniquement spirituelle ou sociale.'
  rationale: Le récit emploie délibérément ce langage saisissant. La traduction doit préserver sa force et son ouverture théologique sans imposer une explication.
- issue: Agent implicite de εὑρέθη
  choice: Employer le passif « a été retrouvé » sans nommer l’agent.
  alternative: Préciser qui l’a retrouvé, par exemple le père ou Dieu.
  rationale: Le grec laisse l’agent inexprimé ; le français peut conserver cette ouverture.
translation_notes:
  register: Français international moderne, naturel et digne. « Mon fils que voici » garde l’emphase démonstrative sans lourdeur ; « faire la fête » convient au contexte concret du repas festif et demeure accessible.
