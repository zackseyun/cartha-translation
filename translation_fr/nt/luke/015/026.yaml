  yaml_path: translation/nt/luke/015/026.yaml
  text: And calling one of the servants[a], he asked what these things might be.
translation:
  language: fr
  text: Il appela l’un des serviteurs et lui demanda ce que cela pouvait être.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ce que tout cela voulait dire ». Le grec dit plus littéralement : « ce que ces choses pouvaient être ».'
    reason: alternative de sens
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: Il appela
  rationale: Le participe aoriste moyen indique qu’il fait venir quelqu’un auprès de lui avant de l’interroger. La coordination avec « et » rend naturellement cette succession en français.
- source_word: παίδων
  choice: serviteurs
  rationale: παῖς peut désigner un enfant ou un serviteur. Dans cette maisonnée, la personne appelée pour expliquer la fête est manifestement un serviteur ; « enfants » induirait ici en erreur.
- source_word: ἐπυνθάνετο
  choice: lui demanda
  rationale: L’imparfait grec exprime l’action de s’informer. « Lui demanda » est idiomatique en français et explicite naturellement le destinataire sans surcharger la nuance aspectuelle.
- source_word: τί ἂν εἴη ταῦτα
  choice: ce que tout cela pouvait bien vouloir dire
  rationale: Cette formulation française naturelle conserve la nuance d’interrogation et d’incertitude portée par ἄν avec l’optatif. « Tout cela » rassemble les faits observés, tandis que « vouloir dire » exprime leur portée dans ce contexte.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La phrase reste simple et narrative ; « pouvait bien vouloir dire » exprime une demande d’explication sans effacer l’incertitude de l’original.
