  text: καὶ διεγόγγυζον οἵ ⸀τε Φαρισαῖοι καὶ οἱ γραμματεῖς λέγοντες ὅτι Οὗτος ἁμαρτωλοὺς προσδέχεται καὶ συνεσθίει αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/002.yaml
  text: And both the Pharisees and the scribes were grumbling[a], saying, “This man welcomes sinners and eats with them.”
translation:
  language: fr
  text: 'Les pharisiens et les scribes murmuraient : « Cet homme accueille des pécheurs et mange avec eux. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διεγόγγυζον
  choice: ne cessaient de murmurer
  rationale: L’imparfait présente une plainte continue ou répétée, tandis que « murmurer » conserve l’idée de récrimination exprimée à mi-voix.
- source_word: οἵ τε Φαρισαῖοι καὶ οἱ γραμματεῖς
  choice: Les pharisiens et les spécialistes de la Loi
  rationale: La coordination associe explicitement les deux groupes. « Spécialistes de la Loi » rend naturellement la fonction des γραμματεῖς dans ce contexte et demeure compréhensible en français moderne.
- source_word: λέγοντες
  choice: ':'
  rationale: En français, les deux-points introduisent naturellement le contenu de leur murmure sans alourdir la phrase par « en disant ».
- source_word: Οὗτος
  choice: Cet homme
  rationale: Le démonstratif désigne Jésus avec une nuance possible de distance ou de mépris, que « cet homme » préserve mieux que le simple pronom « il ».
- source_word: ἁμαρτωλοὺς
  choice: des pécheurs
  rationale: Le substantif « pécheurs » conserve la catégorie morale et religieuse formulée par les accusateurs, sans l’atténuer.
- source_word: προσδέχεται
  choice: accueille
  rationale: « Accueille » exprime la réception favorable impliquée par le verbe et convient au français courant, contrairement à « reçoit », qui pourrait être compris de manière plus neutre.
- source_word: συνεσθίει αὐτοῖς
  choice: mange avec eux
  rationale: Cette formulation directe conserve l’idée de repas partagé et sa portée sociale sans ajouter d’explication au texte.
theological_decisions:
- issue: Portée sociale et théologique de l’association de Jésus avec les pécheurs
  choice: 'Formuler directement l’accusation : Jésus accueille des pécheurs et partage leur table.'
  alternative: « Cet homme reçoit des pécheurs et mange avec eux. »
  rationale: La traduction maintient le scandale que représente, aux yeux des accusateurs, l’accueil favorable et la communion de table, sans préciser davantage l’identité ou la condition de ces « pécheurs ».
translation_notes:
  register: Français international moderne, courant et digne. Le tour « ne cessaient de murmurer » rend explicitement la valeur durative de l’imparfait grec. « Spécialistes de la Loi » privilégie la clarté fonctionnelle plutôt que le terme traditionnel « scribes ».
