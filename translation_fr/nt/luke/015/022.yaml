id: LUK.15.22
reference: Luke 15:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἶπεν δὲ ὁ πατὴρ πρὸς τοὺς δούλους αὐτοῦ· ⸀Ταχὺ ⸀ἐξενέγκατε στολὴν τὴν πρώτην καὶ ἐνδύσατε αὐτόν, καὶ δότε δακτύλιον εἰς τὴν χεῖρα αὐτοῦ καὶ ὑποδήματα εἰς τοὺς πόδας,
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/022.yaml
  text: But the father said to his servants[a], ‘Quickly, bring out the best robe and put it on him[c][b], and put a ring on his hand and sandals on his feet.’
translation:
  language: fr
  text: 'Mais le père dit à ses esclaves[a] : « Vite ! Apportez la plus belle robe[b] et mettez-la-lui ; mettez-lui aussi un anneau[c] à la main et des sandales aux pieds. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « serviteurs ». Le grec désigne ici des personnes de condition servile attachées à la maisonnée.
    reason: alternative_reading
  - marker: b
    text: Littéralement « la première robe », c’est-à-dire vraisemblablement la robe de premier rang ou la meilleure.
    reason: lexical_alternative
  - marker: c
    text: Le grec dit simplement « un anneau » ; certains y voient une bague à cachet marquant le rétablissement de son statut.
    reason: lexical_alternative
lexical_decisions:
- source_word: δούλους
  choice: esclaves
  rationale: Le terme désigne ici les personnes de condition servile attachées à la maisonnée. « Esclaves » préserve cette réalité sociale, que « serviteurs » risquerait d’atténuer.
- source_word: Ταχὺ
  choice: Vite !
  rationale: L’adverbe exprime une action urgente. Employé comme injonction, « Vite ! » est naturel et énergique en français moderne.
- source_word: ἐξενέγκατε
  choice: Apportez
  rationale: Dans ce contexte, le verbe demande de sortir la robe de l’endroit où elle est gardée et de l’apporter. « Apportez » rend naturellement l’action en français.
- source_word: στολὴν τὴν πρώτην
  choice: la plus belle robe
  rationale: Littéralement « la première robe », l’expression désigne vraisemblablement la robe de premier rang, donc la meilleure ou la plus belle. « La plus belle robe » est idiomatique et convient à un vêtement sans ajouter de symbolisme.
- source_word: ἐνδύσατε αὐτόν
  choice: mettez-la-lui
  rationale: Le pronom « la » reprend explicitement « robe » et rend de façon concise l’action de l’en revêtir.
- source_word: δακτύλιον
  choice: un anneau
  rationale: Le grec indique simplement un anneau ou une bague, sans préciser qu’il s’agit d’un sceau. « Anneau » garde cette indétermination et convient au registre narratif.
- source_word: εἰς τὴν χεῖρα αὐτοῦ
  choice: au doigt
  rationale: Le grec dit littéralement « à la main », mais en français un anneau se met normalement au doigt. Cette formulation idiomatique transmet l’action visée sans préciser lequel.
- source_word: ὑποδήματα
  choice: des sandales
  rationale: Le terme désigne des chaussures attachées sous le pied ; « sandales » correspond au contexte matériel du monde méditerranéen ancien.
- source_word: εἰς τοὺς πόδας
  choice: aux pieds
  rationale: Cette tournure française naturelle rend l’application des sandales sur les pieds.
- source_word: δὲ
  choice: Mais
  rationale: La conjonction marque ici le tournant entre les paroles du fils et la réponse active du père ; « Mais » fait ressortir ce contraste narratif.
theological_decisions:
- issue: Rendre δούλους par « esclaves » ou « serviteurs »
  choice: esclaves
  alternative: serviteurs
  rationale: Dans le cadre de cette maisonnée, le texte renvoie à une condition servile réelle. Le choix retenu conserve cette donnée historique sans lui attribuer une portée théologique supplémentaire.
- issue: Comprendre πρώτην dans στολὴν τὴν πρώτην
  choice: la plus belle robe
  alternative: la première robe
  rationale: « Première » peut indiquer ici le rang ou la qualité plutôt qu’un ordre chronologique. Le texte principal adopte le sens contextuellement probable, tandis que la note conserve la formulation littérale.
- issue: Préciser ou non que δακτύλιον est un anneau sigillaire
  choice: un anneau
  alternative: une bague à cachet
  rationale: Le nom grec ne précise pas la fonction de l’anneau. Une éventuelle valeur de sceau et son symbolisme relèvent de l’interprétation et ne doivent pas être introduits dans le texte.
translation_notes:
  register: Français international moderne, naturel et digne. L’injonction brève « Vite ! » conserve l’urgence du père. Les formulations idiomatiques « mettez-la-lui », « au doigt » et « aux pieds » évitent un calque maladroit tout en préservant les actions concrètes du grec.
