  variant: modern international French
source:
  edition: SBLGNT
  text: δαπανήσαντος δὲ αὐτοῦ πάντα ἐγένετο λιμὸς ⸀ἰσχυρὰ κατὰ τὴν χώραν ἐκείνην, καὶ αὐτὸς ἤρξατο ὑστερεῖσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/014.yaml
  text: But after he had spent everything[a], a severe famine came upon that country[b], and he began to be in need.
translation:
  language: fr
  text: Mais après qu’il eut tout dépensé, une famine sévère survint dans tout ce pays[a], et il commença à être dans le besoin[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans toute cette région ».
    reason: lexical_alternative
  - marker: b
    text: Ou « commença à manquer du nécessaire ».
    reason: lexical_alternative
lexical_decisions:
- source_word: δαπανήσαντος δὲ αὐτοῦ πάντα
  choice: Mais après qu’il eut tout dépensé
  rationale: Le génitif absolu avec participe aoriste exprime naturellement l’antériorité. « Dépensé » rend δαπανάω sans ajouter la nuance morale de « dilapidé », qui vient plutôt du contexte général.
- source_word: ἐγένετο λιμὸς ἰσχυρά
  choice: une grande famine survint
  rationale: Avec λιμός, ἐγένετο marque le déclenchement de la famine. « Survint » est idiomatique en français, et « grande famine » exprime naturellement l’intensité de ἰσχυρά.
- source_word: κατὰ τὴν χώραν ἐκείνην
  choice: dans tout ce pays
  rationale: κατά avec l’accusatif peut indiquer l’étendue à travers un territoire. « Dans tout ce pays » conserve cette portée, tandis que χώρα peut aussi désigner une région.
- source_word: καὶ αὐτὸς ἤρξατο ὑστερεῖσθαι
  choice: et lui-même commença à être dans le besoin
  rationale: « Commença à » rend la valeur inchoative de ἤρξατο. « Être dans le besoin » exprime ici la privation indiquée par ὑστερεῖσθαι. « Lui-même » garde l’accent porté par le pronom explicite αὐτός.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple « survint » convient au récit écrit, tandis que les autres formulations restent immédiatement compréhensibles.
