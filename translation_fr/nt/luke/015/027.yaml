id: LUK.15.27
reference: Luke 15:27
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτῷ ὅτι Ὁ ἀδελφός σου ἥκει, καὶ ἔθυσεν ὁ πατήρ σου τὸν μόσχον τὸν σιτευτόν, ὅτι ὑγιαίνοντα αὐτὸν ἀπέλαβεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/027.yaml
  text: He said to him[a], “Your brother has come, and your father slaughtered the fattened calf, because he received him back safe and sound.”
translation:
  language: fr
  text: 'Il lui répondit : « Ton frère est revenu, et ton père a abattu le veau engraissé parce qu’il l’a retrouvé en bonne santé[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sain et sauf ». Le participe grec ὑγιαίνοντα peut signifier « en bonne santé » ou, plus largement dans ce contexte, « sain et sauf ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἥκει
  choice: est revenu
  rationale: 'Dans ce contexte, ἥκει exprime une arrivée dont le résultat demeure : le frère est maintenant présent. « Est revenu » rend naturellement le retour évoqué par la scène.'
- source_word: ἔθυσεν
  choice: a abattu
  rationale: θύω désigne ici l’abattage de l’animal destiné au repas de fête. « A abattu » est précis sans suggérer nécessairement un sacrifice cultuel.
- source_word: μόσχον τὸν σιτευτόν
  choice: le veau engraissé
  rationale: Cette expression désigne l’animal spécialement engraissé en vue d’une grande occasion; « le veau engraissé » est idiomatique et exact.
- source_word: ὑγιαίνοντα
  choice: en bonne santé
  rationale: Le participe signifie littéralement « étant sain, en bonne santé ». Ce choix conserve le sens lexical direct tout en laissant la note signaler la portée contextuelle plus large.
- source_word: ἀπέλαβεν
  choice: l’a retrouvé
  rationale: ἀπολαμβάνω comporte ici l’idée de récupérer ou de recevoir de nouveau quelqu’un. « L’a retrouvé » exprime naturellement la joie du père d’avoir son fils de nouveau auprès de lui.
- source_word: ὁ δὲ εἶπεν αὐτῷ ὅτι
  choice: 'Il lui répondit :'
  rationale: δέ assure une transition légère, et ὅτι introduit le discours direct. « Répondit » convient à l’échange en cours et les deux-points introduisent naturellement la citation.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La formulation conserve l’image concrète du veau engraissé et la nuance du retour, tout en signalant l’étendue possible de ὑγιαίνοντα dans une note.
