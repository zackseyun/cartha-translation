id: LUK.15.9
reference: Luke 15:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ εὑροῦσα ⸀συγκαλεῖ τὰς φίλας ⸀καὶ γείτονας λέγουσα· Συγχάρητέ μοι ὅτι εὗρον τὴν δραχμὴν ἣν ἀπώλεσα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/009.yaml
  text: And when she has found it[a], she calls together her women friends and neighbors, saying, ‘Rejoice with me, because I found the drachma that I had lost.’
translation:
  language: fr
  text: 'Quand elle l’a retrouvée, elle appelle ses amies et ses voisines et leur dit : « Réjouissez-vous avec moi, car j’ai retrouvé la drachme[a] que j’avais perdue. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La drachme était une pièce grecque en argent, correspondant approximativement, dans bien des contextes, au salaire journalier d’un ouvrier.
    reason: cultural_note
lexical_decisions:
- source_word: εὑροῦσα
  choice: Quand elle l’a retrouvée
  rationale: Le participe aoriste féminin exprime ici une action antérieure à l’appel. Le passé composé est naturel en français, et « retrouvée » convient à un objet qui avait été perdu; le pronom féminin renvoie à la drachme.
- source_word: συγκαλεῖ
  choice: elle appelle
  rationale: Le présent historique grec donne de la vivacité au récit. Le présent français la conserve; le groupe appelé est ensuite explicitement nommé, de sorte que « appelle » rend naturellement l’idée de convocation sans lourdeur.
- source_word: φίλας καὶ γείτονας
  choice: ses amies et ses voisines
  rationale: φίλας est explicitement féminin. Dans cette coordination et ce contexte, « voisines » rend naturellement le cercle féminin évoqué, sans recourir à une formulation artificielle.
- source_word: λέγουσα
  choice: et leur dit
  rationale: La coordination avec un verbe fini est plus naturelle en français que « disant », tout en conservant l’introduction du discours direct.
- source_word: Συγχάρητέ μοι
  choice: Réjouissez-vous avec moi
  rationale: Cette formulation rend directement l’impératif pluriel et l’idée de partager la joie de la femme.
- source_word: ὅτι
  choice: car
  rationale: La conjonction introduit la raison de se réjouir. « Car » est clair et digne dans le discours direct.
- source_word: εὗρον
  choice: j’ai retrouvé
  rationale: Le passé composé convient au discours direct en français actuel. « Retrouvé » exprime avec précision la découverte d’un bien précédemment perdu.
- source_word: τὴν δραχμὴν
  choice: la drachme
  rationale: Le nom précis de la monnaie est conservé afin de respecter la particularité historique du texte; une note en explique la valeur approximative.
- source_word: ἣν ἀπώλεσα
  choice: que j’avais perdue
  rationale: Le plus-que-parfait explicite naturellement en français que la perte précède la découverte, sans modifier le rapport temporel du grec.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Le présent historique de συγκαλεῖ est conservé. « Retrouver » est préféré à « trouver » parce que la pièce avait été perdue. Le féminin est rendu explicitement pour les amies et les voisines.
