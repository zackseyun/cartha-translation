source:
  edition: SBLGNT
  text: καὶ πορευθεὶς ἐκολλήθη ἑνὶ τῶν πολιτῶν τῆς χώρας ἐκείνης, καὶ ἔπεμψεν αὐτὸν εἰς τοὺς ἀγροὺς αὐτοῦ βόσκειν χοίρους·
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/015.yaml
  text: So he went and joined himself to one of the citizens of that country[a], and he sent him into his fields to feed pigs.
translation:
  language: fr
  text: Il alla donc s’attacher à l’un des citoyens de ce pays[a], et celui-ci l’envoya dans ses champs garder les porcs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « se joindre à »; le verbe grec évoque le fait de s’attacher étroitement à quelqu’un, éventuellement dans une relation de dépendance.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πορευθεὶς
  choice: il partit
  rationale: Le participe aoriste indique le déplacement qui précède l’action principale. « Il partit donc » s’insère naturellement dans le récit.
- source_word: ἐκολλήθη
  choice: se mit au service de
  rationale: Le verbe évoque littéralement le fait de s’attacher étroitement à quelqu’un et, dans ce contexte de détresse, une relation de dépendance. Cette tournure française exprime idiomatiquement la démarche sans effacer l’image grecque, signalée en note.
- source_word: ἑνὶ τῶν πολιτῶν
  choice: de l’un des habitants
  rationale: πολίτης peut désigner un citoyen ou un membre de la population locale. « Habitant » est ici plus naturel en français narratif et n’introduit pas une notion moderne de statut juridique.
- source_word: τῆς χώρας ἐκείνης
  choice: de ce pays
  rationale: χώρα désigne ici le pays où le fils s’est rendu; « ce pays » assure une reprise naturelle du cadre narratif.
- source_word: ἔπεμψεν αὐτὸν
  choice: qui l’envoya
  rationale: La proposition relative évite l’ambiguïté de deux pronoms masculins successifs en français tout en identifiant fidèlement l’habitant comme sujet.
- source_word: εἰς τοὺς ἀγροὺς αὐτοῦ
  choice: dans ses champs
  rationale: La formulation conserve le pluriel de ἀγρούς et le possessif αὐτοῦ dans un français courant.
- source_word: βόσκειν χοίρους
  choice: garder les porcs
  rationale: βόσκω signifie nourrir, faire paître ou s’occuper d’animaux. « Garder les porcs » est la tournure française idiomatique pour cette tâche pastorale; « porcs » convient au registre digne du récit.
theological_decisions: []
