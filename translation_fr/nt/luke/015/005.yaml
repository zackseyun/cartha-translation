  yaml_path: translation/nt/luke/015/005.yaml
  text: And when he has found it[a], he lays it on his shoulders, rejoicing.
translation:
  language: fr
  text: Et quand il l’a retrouvée[a], il la met sur ses épaules, tout joyeux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: C’est-à-dire la brebis perdue mentionnée dans le verset précédent.
    reason: cross_reference
lexical_decisions:
- source_word: εὑρὼν
  choice: quand il l’a retrouvée
  rationale: Le participe aoriste exprime ici une action antérieure à l’action principale. « Retrouvée » est naturel dans le contexte d’une brebis perdue et le pronom féminin « l’ » reprend explicitement celle-ci.
- source_word: ἐπιτίθησιν
  choice: il la met
  rationale: Le présent de narration conserve la vivacité du récit. « Met » exprime simplement et naturellement le placement de la brebis sur les épaules.
- source_word: ἐπὶ τοὺς ὤμους
  choice: sur ses épaules
  rationale: ἐπί avec l’accusatif indique le mouvement ou le placement sur quelque chose; le pluriel « épaules » correspond au grec.
- source_word: αὐτοῦ
  choice: ses
  rationale: Le possessif renvoie au berger. En français, « ses épaules » est la formulation directe et idiomatique.
- source_word: χαίρων
  choice: tout joyeux
  rationale: Le participe présent indique l’état ou la manière accompagnant l’action. « Tout joyeux » est naturel en français moderne et maintient l’accent sur la joie du berger.
theological_decisions:
- issue: Explicitation de l’objet sous-entendu de εὑρὼν et ἐπιτίθησιν
  choice: Les pronoms « l’ » et « la » renvoient à la brebis perdue.
  alternative: « quand il a trouvé, il met sur ses épaules »
  rationale: Le grec omet l’objet parce que le contexte l’identifie sans difficulté. Le français exige normalement sa reprise; le féminin grammatical précise qu’il s’agit de la brebis sans ajouter d’interprétation théologique.
translation_notes:
  register: Français international moderne, naturel et digne. Le présent de narration de ἐπιτίθησιν est conservé; « tout joyeux » restitue sans lourdeur la circonstance exprimée par χαίρων.
