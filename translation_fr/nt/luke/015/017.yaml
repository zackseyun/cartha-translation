id: LUK.15.17
reference: Luke 15:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἰς ἑαυτὸν δὲ ἐλθὼν ⸀ἔφη· Πόσοι μίσθιοι τοῦ πατρός μου ⸀περισσεύονται ἄρτων, ἐγὼ δὲ ⸂λιμῷ ὧδε⸃ ἀπόλλυμαι·
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/017.yaml
  text: But when he came to himself[a], he said, ‘How many of my father’s hired workers have more than enough bread[c][b], but here I am perishing from hunger!’
translation:
  language: fr
  text: 'Mais, revenu à lui-même[a], il dit : « Combien d’ouvriers salariés de mon père ont du pain en abondance[b], tandis que moi, ici, je meurs de faim[c] ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « revenu à la raison ». Le grec dit littéralement « revenu à lui-même ».
    reason: lexical_alternative
  - marker: b
    text: Ou « ont du pain plus qu’il ne leur en faut ».
    reason: lexical_alternative
  - marker: c
    text: Ou « je péris de faim ». Le verbe grec peut exprimer le fait de périr ou d’aller à sa perte.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ἑαυτὸν ... ἐλθὼν
  choice: revenu à lui-même
  rationale: Cette expression conserve l’image grecque d’un retour à soi et laisse entendre la reprise d’une conscience lucide, sans la réduire à une simple décision raisonnable.
- source_word: ἔφη
  choice: il dit
  rationale: L’aoriste narratif appelle ici un passé simple naturel dans un récit littéraire français.
- source_word: μίσθιοι
  choice: ouvriers salariés
  rationale: Le terme désigne des travailleurs rémunérés, non des esclaves ou des membres permanents de la maisonnée.
- source_word: περισσεύονται ἄρτων
  choice: ont du pain en abondance
  rationale: La formulation garde le terme concret « pain » et exprime l’idée de surplus portée par le verbe.
- source_word: λιμῷ
  choice: de faim
  rationale: Dans ce contexte, le nom désigne la faim qui accable le fils plutôt que la famine considérée comme situation générale.
- source_word: ὧδε
  choice: ici
  rationale: L’adverbe souligne le contraste entre la situation présente du fils et celle des ouvriers chez son père.
- source_word: ἀπόλλυμαι
  choice: je meurs
  rationale: Dans l’expression française « mourir de faim », ce choix rend naturellement le processus de destruction en cours, tout en maintenant la gravité de la situation.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple convient au cadre narratif, tandis que le discours direct reste immédiat. La tournure « revenu à lui-même » préserve volontairement l’image et la légère ambiguïté de l’expression grecque.
