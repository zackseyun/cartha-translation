id: LUK.15.12
reference: Luke 15:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ εἶπεν ὁ νεώτερος αὐτῶν τῷ πατρί· Πάτερ, δός μοι τὸ ἐπιβάλλον μέρος τῆς οὐσίας· ⸂ὁ δὲ⸃ διεῖλεν αὐτοῖς τὸν βίον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/012.yaml
  text: And the younger of them said to his father[a], ‘Father[b], give me the share of the estate that falls to me.’ So he divided his livelihood between them.
translation:
  language: fr
  text: 'Le plus jeune d’entre eux dit à son père : « Père, donne-moi la part du patrimoine[a] qui me revient. » Alors celui-ci partagea entre eux ses moyens de subsistance[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la part des biens qui me revient » ou « la part qui doit me revenir ».
    reason: lexical_alternative
  - marker: b
    text: Le grec emploie ici βίος, littéralement « vie », au sens de ressources, biens ou moyens permettant de vivre.
    reason: lexical_alternative
lexical_decisions:
- source_word: νεώτερος
  choice: le plus jeune d’entre eux
  rationale: L’adjectif comparatif est employé comme nom. Cette formulation naturelle conserve l’implicite du grec, sans ajouter ici le mot « fils ».
- source_word: δός μοι
  choice: donne-moi
  rationale: L’impératif aoriste de δίδωμι suivi du pronom au datif appelle cette formulation directe et idiomatique.
- source_word: τὸ ἐπιβάλλον μέρος
  choice: la part ... qui me revient
  rationale: Le participe ἐπιβάλλον désigne la part qui échoit ou revient à quelqu’un. La proposition relative exprime clairement ce droit sans le surinterpréter.
- source_word: οὐσία
  choice: patrimoine
  rationale: Dans ce contexte familial et successoral, οὐσία désigne les biens ou la propriété. « Patrimoine » rend naturellement l’ensemble concerné.
- source_word: διεῖλεν
  choice: partagea
  rationale: Le verbe διαιρέω signifie diviser ou répartir. « Partagea » convient particulièrement à la répartition de biens entre des personnes.
- source_word: αὐτοῖς
  choice: entre eux
  rationale: Le datif pluriel signifie formellement « à eux », mais le verbe de partage implique une répartition entre les deux personnes concernées.
- source_word: βίον
  choice: ses moyens de subsistance
  rationale: βίος peut désigner ce qui permet de vivre, donc les ressources ou les biens. Cette traduction garde la nuance concrète du grec plutôt que de répéter simplement « patrimoine ».
theological_decisions: []
translation_notes:
  register: Français international actuel, narratif et digne. « Celui-ci » évite une répétition lourde de « le père » tout en gardant le référent clair. La formulation conserve la distinction lexicale entre οὐσία et βίος.
