  text: καὶ μετ’ οὐ πολλὰς ἡμέρας συναγαγὼν ⸀πάντα ὁ νεώτερος υἱὸς ἀπεδήμησεν εἰς χώραν μακράν, καὶ ἐκεῖ διεσκόρπισεν τὴν οὐσίαν αὐτοῦ ζῶν ἀσώτως.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/013.yaml
  text: And after not many days[a], the younger son gathered everything together and went away to a distant country, and there he squandered his property[c][b], living recklessly.
translation:
  language: fr
  text: Peu de jours après[a], le fils cadet rassembla tout ce qu’il avait et partit pour un pays lointain. Là, il dilapida ses biens[b] en menant une vie sans retenue[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « après pas beaucoup de jours » ; on peut aussi traduire : « après quelques jours ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « sa fortune », « son patrimoine » ou « ce qu’il possédait ».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « en vivant dans le gaspillage » ou « en menant une vie dissipée ». Le texte ne précise pas ici quels comportements sont en cause, mais décrit une manière de vivre dissipée et irresponsable.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μετ’ οὐ πολλὰς ἡμέρας
  choice: Peu de jours après
  rationale: Rend naturellement en français l’expression grecque négative « après peu de jours », tout en conservant l’idée d’un bref délai.
- source_word: συναγαγὼν πάντα
  choice: rassembla tout ce qu’il avait
  rationale: Exprime l’action préalable au départ et la force de συνάγω, sans préciser si le fils a vendu, converti ou simplement réuni ses avoirs.
- source_word: ὁ νεώτερος υἱός
  choice: le fils cadet
  rationale: « Cadet » est la désignation française naturelle du plus jeune des deux fils dans ce contexte.
- source_word: ἀπεδήμησεν εἰς χώραν μακράν
  choice: partit pour un pays lointain
  rationale: Formulation française courante qui rend à la fois le départ vers l’étranger ou au loin et la destination éloignée.
- source_word: διεσκόρπισεν
  choice: dilapida
  rationale: Dans le contexte des biens, le sens figuré de « disperser » est celui de gaspiller ou dissiper son avoir; « dilapida » le rend avec précision.
- source_word: τὴν οὐσίαν αὐτοῦ
  choice: ses biens
  rationale: Terme large et naturel pour ce qui lui appartenait, sans imposer la nuance plus technique de « patrimoine » ou de « fortune ».
- source_word: ζῶν ἀσώτως
  choice: en menant une vie sans retenue
  rationale: Décrit une manière de vivre dissipée et irresponsable sans ajouter des péchés particuliers, notamment sexuels, que le verset ne nomme pas.
theological_decisions:
- issue: Nature de la conduite exprimée par ἀσώτως
  choice: vie sans retenue
  alternative: vie de débauche
  rationale: Le grec caractérise une conduite prodigue, dissipée ou irresponsable sans en préciser les actes; « débauche » pourrait être compris dans un sens sexuel plus étroit que le texte.
translation_notes:
  register: Français international moderne, narratif et digne. « Fils cadet », « pays lointain » et « ses biens » sont immédiatement compréhensibles. La division en deux phrases allège la longue coordination grecque sans modifier la progression des événements.
