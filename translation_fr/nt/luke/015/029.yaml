source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν τῷ πατρὶ ⸀αὐτοῦ· Ἰδοὺ τοσαῦτα ἔτη δουλεύω σοι καὶ οὐδέποτε ἐντολήν σου παρῆλθον, καὶ ἐμοὶ οὐδέποτε ἔδωκας ἔριφον ἵνα μετὰ τῶν φίλων μου εὐφρανθῶ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/029.yaml
  text: But he answered his father[a], ‘Look, for so many years I have been serving you, and I never disobeyed your command; yet you never gave me even a young goat so that I might celebrate with my friends.’
translation:
  language: fr
  text: 'Mais il répondit à son père : « Regarde ! Voilà tant d’années que je te sers[a] sans avoir jamais désobéi à un seul de tes ordres ; pourtant, tu ne m’as jamais donné ne serait-ce qu’un chevreau pour que je fasse la fête avec mes amis. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe grec peut aussi évoquer le fait de servir en esclave ; il souligne ici la manière amère dont le fils aîné considère son service.
    reason: alternative lexicale et nuance rhétorique de δουλεύω
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν τῷ πατρὶ αὐτοῦ
  choice: il répondit à son père
  rationale: Rend naturellement l’idiome grec « ayant répondu, il dit » et conserve le destinataire explicite.
- source_word: Ἰδοὺ
  choice: Regarde !
  rationale: Marqueur d’interpellation emphatique, actuel en français et adapté au ton de reproche.
- source_word: τοσαῦτα ἔτη
  choice: Voilà tant d’années
  rationale: Expression française naturelle qui met en relief la longue durée invoquée par le fils.
- source_word: δουλεύω σοι
  choice: je te sers
  rationale: Le verbe désigne un service subordonné et peut évoquer l’esclavage. « Je te sers » reste naturel dans le texte, tandis que la note conserve la nuance plus forte.
- source_word: οὐδέποτε ἐντολήν σου παρῆλθον
  choice: sans avoir jamais désobéi à un seul de tes ordres
  rationale: παρέρχομαι avec ἐντολή signifie ici enfreindre ou ne pas respecter. Le singulier grec a une portée générique, rendue naturellement par « un seul de tes ordres ».
- source_word: ἐμοὶ οὐδέποτε ἔδωκας ἔριφον
  choice: tu ne m’as jamais donné ne serait-ce qu’un chevreau
  rationale: « Chevreau » désigne précisément le jeune bouc ; « ne serait-ce qu’un » explicite la valeur minimisante du reproche.
- source_word: ἵνα μετὰ τῶν φίλων μου εὐφρανθῶ
  choice: pour que je fasse la fête avec mes amis
  rationale: Rend clairement le but et le sens festif de εὐφραίνομαι dans le contexte du repas célébré.
theological_decisions:
- issue: Force de δουλεύω dans la plainte du fils aîné
  choice: je te sers, avec une note signalant la nuance d’esclavage
  alternative: je travaille pour toi comme un esclave
  rationale: Le propos exprime la perception amère du fils sans affirmer qu’il est littéralement esclave. Le texte principal reste idiomatique et la note préserve la force du terme grec ainsi que la tension narrative.
translation_notes:
  register: Français international moderne, digne et oralement naturel. La ponctuation fait entendre le reproche appuyé du fils sans rendre son discours artificiellement soutenu.
