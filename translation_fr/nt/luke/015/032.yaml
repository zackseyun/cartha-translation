id: LUK.15.32
reference: Luke 15:32
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εὐφρανθῆναι δὲ καὶ χαρῆναι ἔδει, ὅτι ὁ ἀδελφός σου οὗτος νεκρὸς ἦν καὶ ⸀ἔζησεν, καὶ ⸀ἀπολωλὼς καὶ εὑρέθη.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/032.yaml
  text: But it was necessary to celebrate and rejoice[a], because this brother of yours was dead and has come to life again[c][b]; he was lost and has been found.
translation:
  language: fr
  text: Mais il fallait faire la fête et se réjouir[a], car ton frère que voici était mort et il est revenu à la vie[b] ; il était perdu et il a été retrouvé[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « il convenait de faire la fête et de se réjouir ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « il a vécu » ; dans la parabole, cette expression évoque vraisemblablement son retour et sa restauration.
    reason: lexical_alternative
  - marker: c
    text: Ou « il a été trouvé ».
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐφρανθῆναι
  choice: faire la fête
  rationale: Dans le contexte du banquet, cette expression française naturelle rend la joie festive du verbe sans recourir à une tournure vieillie.
- source_word: χαρῆναι
  choice: se réjouir
  rationale: Le choix conserve le second terme, proche mais distinct, et respecte ainsi le redoublement expressif grec.
- source_word: ἔδει
  choice: il fallait
  rationale: L’imparfait impersonnel exprime une nécessité morale ou liée à la situation. « Il fallait » est naturel en français et n’ajoute aucun sujet absent du grec.
- source_word: ὁ ἀδελφός σου οὗτος
  choice: ton frère que voici
  rationale: Cette formulation conserve à la fois le lien fraternel marqué par σου et la valeur démonstrative appuyée de οὗτος.
- source_word: νεκρὸς ἦν
  choice: était mort
  rationale: La formulation littérale préserve l’image forte de la parabole sans en expliciter prématurément la portée métaphorique.
- source_word: ἔζησεν
  choice: il est revenu à la vie
  rationale: En opposition à « était mort », cette tournure idiomatique exprime le passage à la vie et la restauration suggérée par le contexte, tout en laissant intacte l’image de mort et de vie.
- source_word: ἀπολωλὼς
  choice: il était perdu
  rationale: Le participe parfait décrit l’état résultant de celui qui s’était perdu. La formulation française s’accorde avec le refrain de la parabole.
- source_word: εὑρέθη
  choice: il a été retrouvé
  rationale: Le passif est conservé, et « retrouvé » exprime naturellement en français le fait de retrouver une personne qui était perdue.
theological_decisions:
- issue: Portée métaphorique ou littérale de νεκρὸς ἦν καὶ ἔζησεν
  choice: 'Conserver l’image : « était mort et il est revenu à la vie »'
  alternative: 'Expliciter la restauration : « était comme mort et nous est revenu »'
  rationale: Dans la parabole, la formule évoque la restauration du fils, mais le texte emploie réellement le contraste mort-vie. La traduction maintient cette tension sans transformer l’image en explication doctrinale ni la réduire à une paraphrase.
- issue: Force de nécessité de ἔδει
  choice: « il fallait »
  alternative: « il convenait de »
  rationale: « Il fallait » garde la force de nécessité morale ou circonstancielle de ἔδει, tandis que « il convenait » pourrait l’atténuer en simple bienséance.
translation_notes:
  register: Français international moderne, naturel et digne. « Faire la fête » convient au contexte du banquet sans être familier ici ; « se réjouir » maintient une tonalité légèrement élevée. La ponctuation met en parallèle les deux oppositions, mort-vie et perdu-retrouvé.
