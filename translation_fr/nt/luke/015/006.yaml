  - severity: low
    issue: Enchaînement « Puis, quand » un peu redondant
    rationale: Le grec coordonne l’arrivée et l’action suivante, mais « Puis, quand » alourdit légèrement la phrase française. « Quand il rentre chez lui » conserve la séquence de manière plus fluide.
