reference: Luke 15:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἐλθὼν εἰς τὸν οἶκον συγκαλεῖ τοὺς φίλους καὶ τοὺς γείτονας, λέγων αὐτοῖς· Συγχάρητέ μοι ὅτι εὗρον τὸ πρόβατόν μου τὸ ἀπολωλός.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/006.yaml
  text: And when he comes into the house[a], he calls together his friends and neighbors, saying to them, ‘Rejoice with me[c][b], because I have found my sheep that was lost.’
translation:
  language: fr
  text: 'Quand il rentre chez lui[a], il réunit ses amis et ses voisins et leur dit : « Réjouissez-vous avec moi[b], car j’ai retrouvé ma brebis, celle qui était perdue[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « quand il entre dans la maison ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « Partagez ma joie ». Le verbe grec invite les autres à se réjouir avec lui.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou, plus simplement : « ma brebis perdue ». Le grec dit littéralement : « ma brebis, celle qui était perdue ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὼν εἰς τὸν οἶκον
  choice: quand il rentre chez lui
  rationale: Le participe aoriste exprime ici une action antérieure à l’appel des proches. Cette formulation française rend naturellement le mouvement vers la maison; la note signale le grec plus littéral.
- source_word: συγκαλεῖ τοὺς φίλους καὶ τοὺς γείτονας
  choice: il appelle ses amis et ses voisins
  rationale: En français, « appeler ses amis et ses voisins » exprime naturellement le fait de les convoquer pour les réunir, sans la dureté possible de « convoquer ».
- source_word: Συγχάρητέ μοι
  choice: Réjouissez-vous avec moi
  rationale: Cette traduction directe conserve l’idée de joie partagée portée par le verbe συγχαίρω.
- source_word: εὗρον
  choice: j’ai retrouvé
  rationale: Dans le contexte d’un animal auparavant perdu, « retrouver » est plus idiomatique que « trouver » et exprime le résultat présent de la recherche achevée.
- source_word: τὸ πρόβατόν μου τὸ ἀπολωλός
  choice: ma brebis, celle qui était perdue
  rationale: « Brebis » convient naturellement au singulier dans cette image pastorale. La reprise « celle qui était perdue » reflète la construction grecque avec article et participe, plutôt que de la réduire à un simple adjectif.
theological_decisions:
- issue: Image parabolique du recouvrement de ce qui était perdu
  choice: Conserver l’image concrète de la brebis perdue puis retrouvée
  alternative: Introduire explicitement dans le verset le pécheur, la repentance ou le salut
  rationale: Le verset appartient au récit imagé; son application théologique est donnée par le contexte. La traduction ne doit pas remplacer prématurément l’image par son interprétation.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe suit clairement la succession des actions et le discours direct reste vivant. Les trois marqueurs de notes figurent dans le texte dans leur ordre d’apparition.
