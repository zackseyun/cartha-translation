id: LUK.15.30
reference: Luke 15:30
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὅτε δὲ ὁ υἱός σου οὗτος ὁ καταφαγών σου τὸν βίον ⸀μετὰ πορνῶν ἦλθεν, ἔθυσας αὐτῷ τὸν ⸂σιτευτὸν μόσχον⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/030.yaml
  text: But when this son of yours came[a], the one who devoured your livelihood with prostitutes, you slaughtered the fattened calf for him.
translation:
  language: fr
  text: Mais quand ton fils que voilà est arrivé, lui qui a dévoré tes biens[a] avec des prostituées, tu as abattu pour lui le veau engraissé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tout ce que tu avais pour vivre ». Le verbe grec est très expressif et signifie littéralement « dévorer » ; le nom peut désigner les ressources nécessaires à la vie, les biens ou le patrimoine.
    reason: Préciser l’image du verbe et l’étendue de sens de βίος.
lexical_decisions:
- source_word: ὅτε δὲ
  choice: Mais quand
  rationale: La conjonction temporelle ὅτε et le δέ légèrement adversatif introduisent naturellement, en français, le contraste indigné exprimé par le fils aîné.
- source_word: ὁ υἱός σου οὗτος
  choice: ton fils que voilà
  rationale: 'Cette formulation conserve la valeur démonstrative et la prise de distance méprisante de οὗτος : le fils aîné évite de dire « mon frère ».'
- source_word: ὁ καταφαγών
  choice: lui qui a dévoré
  rationale: « Dévoré » garde l’image vive et accusatrice du verbe κατεσθίω, plus forte que les formulations interprétatives « gaspillé » ou « dilapidé ».
- source_word: σου τὸν βίον
  choice: tes biens
  rationale: Dans ce contexte, βίος désigne les ressources ou les possessions servant à vivre, et non la vie biologique. « Tes biens » est clair et idiomatique, tout en laissant une note signaler l’étendue du terme.
- source_word: μετὰ πορνῶν
  choice: avec des prostituées
  rationale: Traduction directe, actuelle et non euphémisée de πόρναι, qui maintient l’accusation du fils aîné.
- source_word: ἦλθεν
  choice: est arrivé
  rationale: Le grec dit simplement qu’il est venu ou arrivé. « Est arrivé » convient au point de vue de la maison sans expliciter davantage l’idée de retour.
- source_word: ἔθυσας
  choice: tu as abattu
  rationale: Ici, θύω désigne l’abattage de l’animal destiné au repas de fête. « Abattu » est précis et évite la connotation cultuelle possible de « sacrifié ».
- source_word: τὸν σιτευτὸν μόσχον
  choice: le veau engraissé
  rationale: Expression française naturelle pour le jeune bovin spécialement nourri en vue d’un repas exceptionnel.
- source_word: αὐτῷ
  choice: pour lui
  rationale: 'Le datif indique ici le bénéficiaire : le veau est abattu en son honneur.'
theological_decisions:
- issue: Statut de l’accusation concernant les prostituées
  choice: Rapporter directement les paroles accusatrices du fils aîné, sans les qualifier
  alternative: Ajouter « prétendument » ou reformuler comme un fait confirmé par le narrateur
  rationale: Le verset présente cette affirmation dans le discours du fils aîné, non comme une précision indépendante du narrateur. La traduction conserve donc la tension narrative sans confirmer ni atténuer explicitement l’accusation.
translation_notes:
  register: Français international actuel, direct et digne. « Ton fils que voilà » exprime la distance méprisante sans archaïsme ; « dévoré tes biens » préserve la vigueur de l’accusation.
