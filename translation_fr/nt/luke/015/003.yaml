  text: 'Alors il leur raconta cette parabole :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπεν
  choice: raconta
  rationale: Avec « cette parabole » comme complément, « raconta » est naturel en français et rend l’acte de présenter un récit, sans changer sa fonction de parole.
- source_word: δὲ
  choice: Alors
  rationale: δὲ marque ici une transition narrative légère reliant cette réponse de Jésus aux murmures précédents ; « Alors » exprime ce lien sans introduire une opposition trop forte.
- source_word: πρὸς αὐτοὺς
  choice: leur
  rationale: Le pronom indirect « leur » indique naturellement en français les destinataires de la parole.
- source_word: τὴν παραβολὴν ταύτην
  choice: cette parabole
  rationale: « Parabole » est le terme français établi dans les Évangiles synoptiques, et « cette » rend explicitement ταύτην.
- source_word: λέγων
  choice: ':'
  rationale: Le deux-points introduit idiomatiquement en français les paroles qui suivent. Traduire littéralement par « en disant » serait possible, mais lourd après « raconta ».
