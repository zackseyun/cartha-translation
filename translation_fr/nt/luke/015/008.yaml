id: LUK.15.8
reference: Luke 15:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἢ τίς γυνὴ δραχμὰς ἔχουσα δέκα, ἐὰν ἀπολέσῃ δραχμὴν μίαν, οὐχὶ ἅπτει λύχνον καὶ σαροῖ τὴν οἰκίαν καὶ ζητεῖ ἐπιμελῶς ἕως ⸀οὗ εὕρῃ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/008.yaml
  text: Or what woman[a], having ten drachmas, if she loses one drachma[b], does not light a lamp and sweep the house and search carefully until she finds it?
translation:
  language: fr
  text: Ou encore, quelle femme, ayant dix drachmes[a], si elle en perd une, n’allume pas une lampe, ne balaie pas la maison et ne cherche pas avec soin[b] jusqu’à ce qu’elle la retrouve ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La drachme était une monnaie grecque en argent.
    reason: cultural_note
  - marker: b
    text: 'Ou : « avec diligence ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἢ
  choice: Ou encore
  rationale: Introduit une illustration parallèle à la précédente tout en marquant naturellement la continuité du discours.
- source_word: τίς γυνὴ
  choice: quelle femme
  rationale: Rend la tournure interrogative rhétorique sans ajouter « parmi vous », absent du texte grec.
- source_word: δραχμὰς
  choice: drachmes
  rationale: Conserve le nom précis de la monnaie antique plutôt que de le réduire au terme générique « pièces ».
- source_word: ἔχουσα δέκα
  choice: ayant dix
  rationale: Reproduit simplement la valeur du participe grec dans un registre français digne et naturel.
- source_word: ἐὰν ἀπολέσῃ δραχμὴν μίαν
  choice: si elle en perd une
  rationale: Exprime la condition générale et évite une répétition lourde de « drachme », tout en maintenant l’accent sur l’unique pièce perdue.
- source_word: οὐχὶ
  choice: n’allume pas… ne balaie pas… et ne cherche pas
  rationale: La négation introduit une question rhétorique qui attend une réponse affirmative; sa répétition devant les trois verbes rend clairement sa portée en français.
- source_word: ἅπτει λύχνον
  choice: allume une lampe
  rationale: ἅπτω signifie ici allumer; l’article indéfini convient au nom grec sans article.
- source_word: σαροῖ τὴν οἰκίαν
  choice: balaie la maison
  rationale: Traduction concrète et directe de la scène domestique.
- source_word: ζητεῖ ἐπιμελῶς
  choice: cherche avec soin
  rationale: Rend l’idée d’une recherche attentive et appliquée dans un français courant.
- source_word: ἕως οὗ εὕρῃ
  choice: jusqu’à ce qu’elle la retrouve
  rationale: Indique l’aboutissement de la recherche; « la » reprend naturellement la drachme, et « retrouve » convient à un objet perdu que l’on cherche.
theological_decisions: []
