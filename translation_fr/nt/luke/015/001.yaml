  text: Ἦσαν δὲ ⸂αὐτῷ ἐγγίζοντες⸃ πάντες οἱ τελῶναι καὶ οἱ ἁμαρτωλοὶ ἀκούειν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/001.yaml
  text: All the tax collectors and sinners were drawing near to him to hear him[a].
translation:
  language: fr
  text: Tous les collecteurs d’impôts et les pécheurs s’approchaient de lui pour l’écouter[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour l’entendre ». Le grec peut exprimer ici le fait d’entendre ou celui d’écouter attentivement.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἦσαν δὲ
  choice: s’approchaient
  rationale: La construction périphrastique à l’imparfait installe une action en cours ou répétée dans le passé. Le français la rend naturellement par l’imparfait, sans ajouter de marqueur temporel absent du grec.
- source_word: αὐτῷ ἐγγίζοντες
  choice: s’approchaient de lui
  rationale: Cette formulation naturelle conserve l’idée d’un mouvement vers Jésus ainsi que la valeur durative ou répétée de la construction grecque.
- source_word: πάντες
  choice: Tous
  rationale: Le mot porte sur les deux groupes coordonnés et souligne l’ampleur de ceux qui venaient.
- source_word: οἱ τελῶναι
  choice: les collecteurs d’impôts
  rationale: Désignation claire et moderne des personnes chargées de percevoir taxes et revenus publics sous l’administration romaine.
- source_word: οἱ ἁμαρτωλοὶ
  choice: les pécheurs
  rationale: Le terme substantivé désigne ici les personnes considérées comme pécheresses; la traduction directe préserve la catégorie narrative sans l’expliciter.
- source_word: ἀκούειν αὐτοῦ
  choice: pour l’écouter
  rationale: L’infinitif exprime le but. « Écouter » rend ici plus naturellement que « entendre » l’attention portée à l’enseignement de Jésus.
theological_decisions:
- issue: Portée sociale et religieuse de « collecteurs d’impôts et pécheurs »
  choice: Maintien des deux catégories telles qu’elles sont nommées
  alternative: « collecteurs d’impôts et autres exclus » ou « collecteurs d’impôts et pécheurs notoires »
  rationale: Le grec nomme deux groupes reconnaissables dans le contexte de l’Évangile. Une expansion introduirait une interprétation sociale ou morale que le verset n’énonce pas et atténuerait sa tension narrative.
translation_notes:
  register: Français international moderne, courant et digne. L’imparfait restitue l’action continue ou répétée; « collecteurs d’impôts » évite le terme plus ancien « publicains ».
