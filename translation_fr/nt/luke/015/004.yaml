id: LUK.15.4
reference: Luke 15:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Τίς ἄνθρωπος ἐξ ὑμῶν ἔχων ἑκατὸν πρόβατα καὶ ⸀ἀπολέσας ⸂ἐξ αὐτῶν ἓν⸃ οὐ καταλείπει τὰ ἐνενήκοντα ἐννέα ἐν τῇ ἐρήμῳ καὶ πορεύεται ἐπὶ τὸ ἀπολωλὸς ἕως εὕρῃ αὐτό;
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/004.yaml
  text: What man among you, having a hundred sheep and losing one of them, does not leave the ninety-nine in the open country and go after the lost one until he finds it?
translation:
  language: fr
  text: Quel homme parmi vous, s’il a cent brebis et en perd une, ne laisse pas les quatre-vingt-dix-neuf autres en pleine campagne[a] pour aller chercher celle qui est perdue jusqu’à ce qu’il la retrouve ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans un lieu désert ». Le terme grec peut désigner la campagne ouverte, une terre de pâturage ou un endroit désert.
    reason: Alternative lexicale pour ἐν τῇ ἐρήμῳ, dont le sens exact dépend du contexte.
lexical_decisions:
- source_word: Τίς ἄνθρωπος ἐξ ὑμῶν
  choice: Quel homme parmi vous
  rationale: Rend directement la question rhétorique et conserve le singulier masculin représentatif du grec dans un français naturel.
- source_word: ἔχων ἑκατὸν πρόβατα
  choice: s’il a cent brebis
  rationale: La tournure conditionnelle française exprime naturellement le cadre hypothétique de la question, sans modifier son sens.
- source_word: ἀπολέσας ἐξ αὐτῶν ἓν
  choice: et en perd une
  rationale: « En » reprend les cent brebis, tandis que le féminin « une » correspond clairement à « brebis »; le verbe décrit ici le fait qu’une brebis se soit égarée ou soit devenue perdue, non une destruction volontaire.
- source_word: οὐ καταλείπει τὰ ἐνενήκοντα ἐννέα
  choice: ne laisse pas les quatre-vingt-dix-neuf autres
  rationale: Conserve la forme négative de la question rhétorique, qui appelle une réponse affirmative; « autres » clarifie idiomatiquement que les quatre-vingt-dix-neuf restantes sont visées.
- source_word: ἐν τῇ ἐρήμῳ
  choice: en pleine campagne
  rationale: Dans ce contexte pastoral, ἔρημος peut désigner un espace ouvert, non cultivé ou peu habité. « En pleine campagne » est naturel en français et évite de suggérer nécessairement un désert aride.
- source_word: πορεύεται ἐπὶ τὸ ἀπολωλός
  choice: pour aller chercher celle qui est perdue
  rationale: Exprime le déplacement orienté vers la brebis perdue et sa recherche; « celle qui est perdue » conserve l’état résultant exprimé par le participe parfait.
- source_word: ἕως εὕρῃ αὐτό
  choice: jusqu’à ce qu’il la retrouve
  rationale: « Retrouve » est idiomatique lorsqu’on retrouve ce qu’on avait perdu et rend clairement le terme de la recherche.
theological_decisions:
- issue: Masculin représentatif dans la question parabolique
  choice: Conserver « Quel homme parmi vous »
  alternative: « Qui parmi vous » ou « Quelle personne parmi vous »
  rationale: Le texte grec emploie ἄνθρωπος au masculin singulier dans un exemple représentatif. La traduction conserve cette forme sans laisser entendre que l’application de la parabole serait limitée aux hommes.
- issue: Situation des quatre-vingt-dix-neuf brebis
  choice: « en pleine campagne » avec note
  alternative: « dans le désert » ou « dans un lieu désert »
  rationale: Le champ sémantique de ἔρημος demeure ouvert. Le contexte pastoral favorise ici un espace ouvert ou peu habité, mais la possibilité de « désert » est signalée plutôt que supprimée.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la force de la question rhétorique tout en adoptant une syntaxe française fluide. Le marqueur [a] est placé immédiatement après l’expression concernée.
