  terminology: « Quel homme parmi vous » préserve de manière naturelle le masculin singulier représentatif de ἄνθρωπος. « Brebis », « celle qui est perdue » et « retrouve » conviennent au contexte pastoral et au participe parfait substantivé τὸ ἀπολωλός. L’ajout de « autres » explicite sans altérer le référent des quatre-vingt-dix-neuf.
