  text: ὠργίσθη δὲ καὶ οὐκ ἤθελεν εἰσελθεῖν. ὁ ⸀δὲ πατὴρ αὐτοῦ ἐξελθὼν παρεκάλει αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/028.yaml
  text: But he became angry and was unwilling to go in[b][a]. So his father came out and pleaded with him.
translation:
  language: fr
  text: Mais il se mit en colère et ne voulait pas entrer[a]. Alors son père sortit pour le supplier[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ne consentait pas à entrer »; selon le contexte, on peut aussi comprendre « refusait d’entrer ».
    reason: lexical_alternative
  - marker: b
    text: Le verbe grec peut aussi se traduire par « insistait auprès de lui » ou « l’exhortait ». Son temps verbal suggère un appel qui se prolonge.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὠργίσθη
  choice: se mit en colère
  rationale: L’aoriste de ὀργίζομαι peut ici présenter l’entrée dans l’état de colère. « Se mit en colère » rend cette valeur ingressive sans renforcer le terme jusqu’à « devint furieux ».
- source_word: δὲ
  choice: Mais
  rationale: La première occurrence de δέ marque le contraste entre la joie de la fête et la réaction du fils aîné.
- source_word: οὐκ ἤθελεν εἰσελθεῖν
  choice: ne voulait pas entrer
  rationale: θέλω avec l’infinitif exprime ici la volonté. Cette formulation française naturelle préserve la dimension volitive sans transformer nécessairement son attitude en refus explicitement déclaré.
- source_word: ὁ δὲ πατὴρ αὐτοῦ
  choice: Alors son père
  rationale: La seconde occurrence de δέ introduit la réaction du père. « Alors » exprime naturellement la progression narrative sans imposer une opposition forte.
- source_word: ἐξελθὼν
  choice: sortit
  rationale: Le participe indique que le père quitte l’endroit où se déroule la fête pour aller vers son fils. En français, deux verbes coordonnés rendent naturellement la succession des actions.
- source_word: παρεκάλει
  choice: le suppliait
  rationale: Dans ce contexte, παρακαλέω décrit un appel personnel et pressant. L’imparfait grec suggère que le père poursuivait sa démarche; l’imparfait français en conserve l’aspect duratif.
- source_word: αὐτόν
  choice: le
  rationale: Le pronom renvoie sans ambiguïté au fils aîné; le pronom objet français « le » est la traduction naturelle.
theological_decisions:
- issue: Tonalité de l’appel du père dans la parabole
  choice: « le suppliait », pour conserver l’initiative bienveillante et insistante du père
  alternative: « insistait auprès de lui » ou « l’exhortait »
  rationale: Le texte présente le père allant lui-même vers son fils et lui adressant un appel prolongé. La traduction en garde la force relationnelle sans préciser ce qu’il lui demandait ni ajouter une interprétation doctrinale.
translation_notes:
  register: Français international moderne, simple et digne. « Se mit en colère » distingue l’apparition de la colère d’un simple état. La coordination « sortit et le suppliait » reste idiomatique tout en conservant le contraste aspectuel entre l’action de sortir et l’appel prolongé.
