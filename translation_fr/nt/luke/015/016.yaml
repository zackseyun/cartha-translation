base_translation:
  language: en
  yaml_path: translation/nt/luke/015/016.yaml
  text: And he longed to fill his stomach with the carob pods that the pigs were eating[a], and no one was giving him anything.
translation:
  language: fr
  text: Il désirait remplir son ventre de gousses de caroubier[a] que mangeaient les cochons, et personne ne lui donnait rien.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou simplement : « gousses ». Le terme grec désigne précisément les gousses du caroubier, couramment utilisées comme nourriture pour les animaux.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεθύμει
  choice: désirait
  rationale: L’imparfait exprime un désir persistant; « désirait » est naturel et digne, sans accentuer indûment l’intensité.
- source_word: γεμίσαι τὴν κοιλίαν αὐτοῦ
  choice: remplir son ventre
  rationale: Cette formulation conserve l’image physique et concrète de la faim; « ventre » rend ici κοιλία plus directement que « estomac ».
- source_word: ἀπὸ τῶν κερατίων
  choice: des gousses de caroubier
  rationale: Avec « remplir », « de » rend naturellement en français la matière ou la nourriture recherchée, tandis que κεράτια désigne précisément des gousses de caroubier.
- source_word: οἱ χοῖροι
  choice: les cochons
  rationale: « Cochons » est le terme courant en français moderne et convient au récit sans archaïsme.
- source_word: ἤσθιον
  choice: mangeaient
  rationale: L’imparfait restitue l’action en cours ou habituelle décrite par l’imparfait grec.
- source_word: οὐδεὶς ἐδίδου αὐτῷ
  choice: personne ne lui donnait rien
  rationale: L’imparfait garde l’idée d’une absence persistante de secours; « rien » explicite naturellement en français l’objet sous-entendu.
