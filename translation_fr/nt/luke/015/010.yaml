id: LUK.15.10
reference: Luke 15:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὕτως, λέγω ὑμῖν, ⸂γίνεται χαρὰ⸃ ἐνώπιον τῶν ἀγγέλων τοῦ θεοῦ ἐπὶ ἑνὶ ἁμαρτωλῷ μετανοοῦντι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/010.yaml
  text: In the same way[a], I tell you[b], there is joy before the angels of God over one sinner who repents.
translation:
  language: fr
  text: De même[a], je vous le dis, il y a de la joie devant les anges de Dieu pour un seul pécheur qui se repent[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Ainsi » ou « C’est ainsi que ».
    reason: lexical_alternative
  - marker: b
    text: Le grec dit littéralement que la joie a lieu « devant les anges de Dieu »; il ne précise pas explicitement que les anges eux-mêmes sont ceux qui se réjouissent.
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως
  choice: De même
  rationale: Dans le contexte, le mot applique au cas présent l’image de la parabole précédente. « De même » rend naturellement cette valeur comparative; « Ainsi » reste possible.
- source_word: λέγω ὑμῖν
  choice: je vous le dis
  rationale: Formule directe et idiomatique qui conserve l’adresse aux auditeurs et donne à l’affirmation son relief.
- source_word: γίνεται χαρά
  choice: il y a de la joie
  rationale: γίνομαι exprime ici la survenue ou l’existence de la joie. Cette tournure est naturelle en français sans être interprétativement plus précise que le grec.
- source_word: ἐνώπιον
  choice: devant
  rationale: « Devant » conserve sobrement l’idée de présence et évite d’identifier explicitement les anges comme les sujets de la joie.
- source_word: τῶν ἀγγέλων τοῦ θεοῦ
  choice: les anges de Dieu
  rationale: Rendu direct du groupe génitival, clair et digne en français contemporain.
- source_word: ἐπὶ ἑνὶ ἁμαρτωλῷ
  choice: pour un seul pécheur
  rationale: ἐπί avec le datif indique ici ce qui occasionne la joie. « Pour » est idiomatique en français et « un seul » met en valeur ἑνί.
- source_word: μετανοοῦντι
  choice: qui se repent
  rationale: Le participe présent qualifie le pécheur par l’acte de repentance. « Qui se repent » est naturel et maintient la portée théologique du terme sans la réduire à un simple changement d’avis.
theological_decisions:
- issue: Agent ou lieu de la joie
  choice: « de la joie devant les anges de Dieu »
  alternative: « les anges de Dieu se réjouissent » ou « de la joie parmi les anges de Dieu »
  rationale: Le grec situe la joie « devant » les anges sans dire explicitement qu’ils en sont eux-mêmes les sujets. Le texte conserve cette ambiguïté réelle.
- issue: Sens du langage de la repentance
  choice: « qui se repent »
  alternative: « qui change d’avis » ou « qui revient à Dieu »
  rationale: Le verset ne développe pas ici la nature de la repentance. Le terme reçu « se repent » en préserve l’étendue sans ajouter une définition doctrinale.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe reste proche du grec là où cela préserve une nuance théologique, notamment avec « devant les anges de Dieu ». Tous les marqueurs de notes figurent dans le texte.
