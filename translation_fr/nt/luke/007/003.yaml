source:
  edition: SBLGNT
  text: ἀκούσας δὲ περὶ τοῦ Ἰησοῦ ἀπέστειλεν πρὸς αὐτὸν πρεσβυτέρους τῶν Ἰουδαίων, ἐρωτῶν αὐτὸν ὅπως ἐλθὼν διασώσῃ τὸν δοῦλον αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/003.yaml
  text: When he heard about Jesus[a], he sent to him elders of the Jews, asking him to come and save his servant.
translation:
  language: fr
  text: Quand il entendit parler de Jésus, il envoya auprès de lui des anciens des Juifs pour lui demander de venir sauver son esclave[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « serviteur ». Le mot grec doulos peut désigner un serviteur ou un esclave selon le contexte ; ici, « esclave » met en évidence le statut de personne non libre impliqué par le terme.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀκούσας
  choice: Quand il entendit
  rationale: Le participe aoriste présente la circonstance antérieure à l’envoi. Cette tournure française naturelle en conserve clairement la valeur temporelle.
- source_word: δὲ
  choice: —
  rationale: Ici, δέ est un léger connecteur discursif. L’enchaînement de la phrase suffit en français moderne, sans qu’il soit nécessaire de le rendre explicitement.
- source_word: περὶ τοῦ Ἰησοῦ
  choice: parler de Jésus
  rationale: Avec ἀκούω, περί suivi du génitif signifie entendre parler de quelqu’un. La tournure idiomatique française « entendre parler de Jésus » rend naturellement l’ensemble.
- source_word: ἀπέστειλεν πρὸς αὐτὸν
  choice: il lui envoya
  rationale: La construction française avec le pronom indirect indique clairement que les anciens furent envoyés auprès de Jésus, sans ajouter le terme interprétatif « messagers ».
- source_word: πρεσβυτέρους τῶν Ἰουδαίων
  choice: des anciens parmi les Juifs
  rationale: « Anciens » conserve le titre de responsables communautaires exprimé par πρεσβύτεροι. « Parmi les Juifs » rend le génitif avec naturel et évite de suggérer qu’il s’agit simplement d’hommes âgés.
- source_word: ἐρωτῶν αὐτὸν
  choice: pour lui demander
  rationale: Le participe décrit la demande motivant l’envoi. L’infinitif de but est naturel en français et maintient le centurion comme auteur de la requête transmise par les anciens.
- source_word: ὅπως ἐλθὼν
  choice: de venir
  rationale: La tournure grecque exprime le contenu et le but de la demande. L’infinitif français restitue cela clairement sans lourdeur.
- source_word: διασώσῃ
  choice: sauver
  rationale: διασῴζω peut signifier sauver, préserver, secourir ou guérir selon le contexte. « Sauver » maintient ici l’étendue du terme grec sans le réduire explicitement à la guérison physique.
- source_word: τὸν δοῦλον αὐτοῦ
  choice: son esclave
  rationale: Dans la maison d’un centurion, δοῦλος désigne une personne placée sous l’autorité de son maître et juridiquement non libre. « Esclave » rend cette réalité sociale, tandis que l’autre traduction possible est signalée en note.
theological_decisions:
- issue: Traduction de δοῦλος dans un contexte domestique antique
  choice: esclave
  alternative: serviteur
  rationale: Le mot désigne ici un membre non libre de la maison du centurion. « Esclave » préserve ce statut social au lieu de l’atténuer. « Serviteur », fréquent dans la tradition et possible lorsque l’accent porte sur la fonction, est conservé en note.
- issue: Portée de διασώσῃ dans le contexte de la maladie
  choice: sauver
  alternative: guérir
  rationale: Le contexte concerne bien une maladie grave, mais le verbe grec possède une portée plus large que la seule guérison. « Sauver » conserve cette amplitude sans nier le sens physique immédiat.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe reste accessible, tandis que « anciens » conserve le vocabulaire communautaire du texte source. Le marqueur de note est placé après « esclave », le mot auquel la variante se rapporte.
