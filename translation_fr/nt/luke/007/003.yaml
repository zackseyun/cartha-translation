  source_fidelity: 'La traduction rend correctement la succession des actions, la demande adressée à Jésus et le sens volontairement large de διασώσῃ par « sauver ». Cependant, « des anciens parmi les Juifs » affaiblit et modifie légèrement le génitif τῶν Ἰουδαίων : il s’agit d’anciens représentant les Juifs, non simplement d’anciens choisis au sein d’un ensemble indéterminé. « Des anciens des Juifs » est plus fidèle.'
