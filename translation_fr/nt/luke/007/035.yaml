  text: καὶ ἐδικαιώθη ἡ σοφία ἀπὸ ⸂πάντων τῶν τέκνων αὐτῆς⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/035.yaml
  text: Yet wisdom was vindicated by all her children[a][b][c].
translation:
  language: fr
  text: Et pourtant, la sagesse a été reconnue juste par tous ses enfants[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « a été justifiée » ou « s’est révélée juste ».
    reason: lexical_alternative
  - marker: b
    text: Le mot « enfants » est une métaphore pour ceux qui manifestent la justesse de la sagesse par leur réponse ou leur manière de vivre.
    reason: lexical_alternative
  - marker: c
    text: 'En Matthieu 11.19, on lit : « la sagesse a été reconnue juste par ses œuvres ».'
    reason: cross_reference
lexical_decisions:
- source_word: καὶ
  choice: Et pourtant
  rationale: Dans ce contexte, καί introduit une conclusion contrastive après le reproche adressé à cette génération. « Et pourtant » rend ce contraste tout en gardant le lien avec ce qui précède.
- source_word: ἐδικαιώθη
  choice: a été reconnue juste
  rationale: Le passif aoriste de δικαιόω signifie ici que la sagesse est publiquement reconnue ou attestée comme juste, et non qu’elle reçoit la justification au sens paulinien. Cette formulation conserve le passif et reste naturelle en français.
- source_word: ἡ σοφία
  choice: la sagesse
  rationale: Équivalent français direct qui permet de conserver la personnification présente dans la parole.
- source_word: ἀπὸ πάντων
  choice: par tous
  rationale: Avec le verbe passif, ἀπό peut indiquer l’agent ou la source de l’attestation. « Par tous » exprime naturellement cette relation en français.
- source_word: τῶν τέκνων αὐτῆς
  choice: ses enfants
  rationale: La traduction littérale préserve l’image des enfants de la sagesse sans l’interpréter dans le texte principal. « Ses » est idiomatique en français et maintient le lien avec la sagesse personnifiée.
theological_decisions:
- issue: Sens des « enfants » de la sagesse
  choice: Conserver la métaphore « ses enfants » dans le texte principal.
  alternative: Expliciter qu’il s’agit de ceux qui répondent à la sagesse, de ses fruits, ou harmoniser avec les « œuvres » de Matthieu 11.19.
  rationale: 'Le texte grec de Luc porte τέκνων, « enfants ». Garder cette image respecte le texte et préserve son ouverture : les enfants peuvent désigner ceux dont la réponse ou la conduite manifeste que la sagesse est juste.'
- issue: Portée de ἐδικαιώθη
  choice: « a été reconnue juste »
  alternative: « a été justifiée » ou « s’est révélée juste »
  rationale: Le choix évite de suggérer automatiquement la doctrine paulinienne de la justification et conserve l’idée d’une reconnaissance ou confirmation publique, ainsi que la voix passive.
translation_notes:
  register: Français international moderne, naturel et digne. La personnification de la sagesse et la métaphore de ses enfants sont conservées. La tournure « reconnue juste » cherche à être claire pour un large public sans effacer l’ambiguïté de δικαιόω.
