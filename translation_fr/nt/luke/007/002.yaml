id: LUK.7.2
reference: Luke 7:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἑκατοντάρχου δέ τινος δοῦλος κακῶς ἔχων ἤμελλεν τελευτᾶν, ὃς ἦν αὐτῷ ἔντιμος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/002.yaml
  text: A certain centurion’s servant[a], who was sick and about to die, was highly valued by him.
translation:
  language: fr
  text: Un centurion avait un esclave[a] qui était malade et sur le point de mourir, et qu’il estimait beaucoup.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « serviteur ». Le mot grec doulos peut désigner un esclave ou, selon le contexte, un serviteur; « esclave » rend ici explicitement la condition de dépendance impliquée par le terme.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἑκατοντάρχου ... τινος
  choice: Un centurion avait
  rationale: Cette tournure française naturelle conserve l’indétermination de τινος et exprime clairement le lien de possession indiqué par le génitif.
- source_word: δέ
  choice: non rendu explicitement
  rationale: La particule marque ici une transition narrative légère; en français, l’enchaînement suffit sans ajouter artificiellement « Or » ou « alors ».
- source_word: δοῦλος
  choice: esclave
  rationale: Dans ce cadre domestique du Ier siècle, le mot désigne une personne en condition servile; « esclave » préserve cette réalité sociale mieux que « serviteur ».
- source_word: κακῶς ἔχων
  choice: était malade
  rationale: L’expression idiomatique signifie être mal en point; le contexte et la proximité de la mort rendent « était malade » clair et naturel.
- source_word: ἤμελλεν τελευτᾶν
  choice: sur le point de mourir
  rationale: Cette formulation rend directement l’imminence exprimée par μέλλω suivi de l’infinitif.
- source_word: ὃς ἦν αὐτῷ ἔντιμος
  choice: il lui était très cher
  rationale: ἔντιμος indique ici que l’esclave comptait beaucoup pour le centurion. « Très cher » restitue cette haute estime sans préciser davantage la nature de leur attachement.
theological_decisions:
- issue: Rendu de δοῦλος dans un contexte d’esclavage domestique
  choice: esclave
  alternative: serviteur
  rationale: Le terme grec implique ici une condition de dépendance et d’appartenance qu’« esclave » ne doit pas atténuer. Une note signale « serviteur » comme autre traduction possible selon la portée contextuelle du mot.
- issue: Nature de l’estime exprimée par ἔντιμος
  choice: il lui était très cher
  alternative: il avait beaucoup de valeur à ses yeux
  rationale: Le grec affirme la grande valeur ou l’estime accordée à l’esclave sans définir si elle est surtout affective, sociale ou pratique. La formulation choisie reste concise tout en conservant une certaine ouverture.
translation_notes:
  register: Français international moderne, fluide et digne. La phrase est restructurée avec « avait » pour éviter un génitif possessif lourd, tout en conservant tous les éléments du grec.
