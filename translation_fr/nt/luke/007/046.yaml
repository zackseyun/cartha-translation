  text: ἐλαίῳ τὴν κεφαλήν μου οὐκ ἤλειψας· αὕτη δὲ μύρῳ ἤλειψεν ⸂τοὺς πόδας μου⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/046.yaml
  text: You did not anoint my head with oil[a], but she has anointed my feet with perfume.
translation:
  language: fr
  text: Tu n’as pas oint ma tête d’huile, mais cette femme a oint mes pieds de parfum[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Certains manuscrits omettent « mes pieds ».
    reason: variante_textuelle
lexical_decisions:
- source_word: ἐλαίῳ
  choice: d’huile
  rationale: Le datif exprime le moyen. « Huile » est naturel et suffisamment précis sans expliciter inutilement qu’il s’agit d’huile d’olive.
- source_word: ἤλειψας / ἤλειψεν
  choice: as versé / a répandu
  rationale: Dans ce contexte d’hospitalité, ἀλείφω désigne l’application d’huile ou de parfum. La variation naturelle en français avec « verser » et « répandre » exprime clairement le geste sans lui donner une portée cérémonielle excessive.
- source_word: κεφαλήν μου
  choice: ma tête
  rationale: Traduction directe de l’objet accusatif accompagné du possessif.
- source_word: αὕτη δὲ
  choice: mais elle, elle
  rationale: La dislocation emphatique rend le contraste marqué entre l’hôte interpellé et la femme présente, tout en restant naturelle en français moderne.
- source_word: μύρῳ
  choice: du parfum
  rationale: μύρον désigne une huile parfumée ou un onguent. « Parfum » est idiomatique et maintient le contraste avec l’huile ordinaire de la première proposition.
- source_word: τοὺς πόδας μου
  choice: mes pieds
  rationale: Traduction directe de l’objet pluriel avec le possessif.
theological_decisions:
- issue: Contraste d’honneur social dans le reproche de Jésus
  choice: Exprimer simplement le contraste entre l’huile non offerte pour la tête et le parfum répandu sur les pieds.
  alternative: Employer « oindre », terme susceptible d’évoquer plus fortement une consécration cérémonielle.
  rationale: Le contexte immédiat porte sur l’accueil et l’honneur accordés à Jésus. La formulation retenue évite d’introduire dans le verset une interprétation sacramentelle ou christologique qui n’est pas explicitée ici.
translation_notes:
  register: Français international moderne, clair et digne. La reprise « elle, elle » marque naturellement l’opposition emphatique de αὕτη δὲ. Aucun marqueur de note n’est nécessaire, puisque la traduction principale exprime directement les deux substances et qu’aucune ambiguïté déterminante n’exige une note.
