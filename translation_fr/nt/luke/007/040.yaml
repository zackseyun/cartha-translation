    issue: Ambiguïté du sujet de « Il dit ».
    rationale: Après « Jésus lui répondit », le pronom « Il » peut en français être lu comme renvoyant à Jésus. Le grec ὁ δέ introduit l’autre interlocuteur; expliciter « Simon répondit » rend ce changement clair.
  - severity: low
    issue: La note lexicale ne formule pas précisément l’alternative française.
    rationale: « Enseignant, dis-le » ajoute « le », tandis que la note affirme « dis »; il est préférable de présenter les valeurs lexicales sans proposer une apostrophe française peu naturelle comme traduction principale.
