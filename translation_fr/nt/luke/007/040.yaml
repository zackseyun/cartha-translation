  text: καὶ ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν πρὸς αὐτόν· Σίμων, ἔχω σοί τι εἰπεῖν. ὁ δέ· ⸂Διδάσκαλε, εἰπέ, φησίν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/040.yaml
  text: And Jesus answered and said to him[a], “Simon, I have something to say to you.” And he said, “Teacher, say it.”
translation:
  language: fr
  text: 'Jésus lui répondit : « Simon, j’ai quelque chose à te dire. » Simon répondit : « Maître, parle[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec διδάσκαλε signifie littéralement « enseignant »; εἰπέ peut se rendre par « dis » ou « parle ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς … εἶπεν πρὸς αὐτόν
  choice: lui répondit
  rationale: Le participe suivi du verbe « dire » forme une tournure narrative grecque que le français exprime naturellement par le seul verbe « répondre ».
- source_word: Σίμων
  choice: Simon
  rationale: Translittération française traditionnelle du nom propre.
- source_word: ἔχω σοί τι εἰπεῖν
  choice: j’ai quelque chose à te dire
  rationale: Rend directement l’idiome grec et exprime explicitement le pronom σοί.
- source_word: Διδάσκαλε
  choice: Maître
  rationale: En français, « Maître » est une adresse naturelle et digne pour un enseignant reconnu ; la note signale le sens lexical plus explicite « enseignant ».
- source_word: εἰπέ
  choice: parle
  rationale: L’impératif autorise Jésus à poursuivre son propos ; « parle » est naturel en français et n’ajoute pas d’objet absent du grec.
- source_word: φησίν
  choice: Il dit
  rationale: Le présent historique grec est rendu au passé simple pour s’accorder avec la narration française.
theological_decisions: []
translation_notes:
  register: Français moderne, courant et digne. Le tutoiement correspond au singulier σοί et à l’usage narratif français habituel dans les dialogues bibliques. La coordination grecque initiale n’est pas reproduite, afin d’éviter un « et » lourd en français.
