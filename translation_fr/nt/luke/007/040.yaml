review_pass:
  verdict: revise
  source_fidelity: 'Le sens du grec est bien rendu : Jésus s’adresse à Simon et lui annonce qu’il a quelque chose à lui dire; Simon l’invite ensuite à parler. « Maître » est une adresse française recevable pour διδάσκαλε, et « parle » rend naturellement l’impératif εἰπέ. Toutefois, « Il dit » rend le locuteur potentiellement ambigu après la parole de Jésus, alors que le grec marque un changement de locuteur (ὁ δέ).'
  naturalness: 'La formulation est moderne, sobre et naturelle. Nommer Simon dans la seconde réplique améliore nettement la clarté discursive en français sans modifier le sens. La note actuelle est à ajuster : « Enseignant, dis-le » ne correspond pas exactement à l’alternative annoncée et « enseignant » comme apostrophe reste peu idiomatique.'
  terminology: « Maître » convient ici comme forme d’adresse traditionnelle et naturelle; la note peut préciser que le sens lexical de διδάσκαλε est « enseignant ». Le tutoiement est cohérent avec le singulier σοί et le dialogue direct.
  issues:
