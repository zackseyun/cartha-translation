- from: 'Et ceux qui étaient à table avec lui se mirent à dire entre eux[a] : « Qui est-il, celui-ci, pour aller jusqu’à pardonner les péchés ? »'
  to: 'Et ceux qui étaient à table avec lui se mirent à dire entre eux[a] : « Qui est celui-ci, qui pardonne même les péchés ? »'
