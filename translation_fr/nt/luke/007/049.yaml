id: LUK.7.49
reference: Luke 7:49
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἤρξαντο οἱ συνανακείμενοι λέγειν ἐν ἑαυτοῖς· Τίς οὗτός ἐστιν ὃς καὶ ἁμαρτίας ἀφίησιν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/049.yaml
  text: And those reclining at the table with him began to say among themselves[a], “Who is this, who even forgives sins?”
translation:
  language: fr
  text: 'Et ceux qui étaient à table avec lui se mirent à dire entre eux[a] : « Qui est celui-ci, qui pardonne même les péchés ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en eux-mêmes ». L’expression grecque peut désigner soit une réflexion intérieure, soit un échange entre les convives.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤρξαντο
  choice: se mirent à
  rationale: Cette tournure française naturelle exprime le commencement de l’action marqué par ἤρξαντο suivi de l’infinitif.
- source_word: οἱ συνανακείμενοι
  choice: ceux qui étaient à table avec lui
  rationale: Le participe désigne les autres convives partageant le repas avec Jésus. La formulation conserve le cadre du repas et la valeur relationnelle du préfixe συν-, sans imposer en français moderne l’ancienne posture allongée.
- source_word: λέγειν ἐν ἑαυτοῖς
  choice: dire entre eux
  rationale: L’expression peut évoquer soit un échange discret entre les convives, soit une réflexion intérieure. « Entre eux » convient au sujet pluriel tout en laissant une note signaler l’autre possibilité.
- source_word: Τίς οὗτός ἐστιν
  choice: Qui est-il, celui-ci
  rationale: Cette formulation garde l’insistance quelque peu abrupte de οὗτός sans ajouter « homme », absent du grec.
- source_word: καὶ
  choice: pour aller jusqu’à
  rationale: Dans cette question étonnée, καί a une valeur ascendante. « Aller jusqu’à » rend naturellement en français la surprise devant l’étendue de l’action attribuée à Jésus.
- source_word: ἁμαρτίας ἀφίησιν
  choice: pardonner les péchés
  rationale: Dans ce contexte, ἀφίημι désigne le pardon des péchés. « Pardonner » est l’équivalent français courant, clair et théologiquement non expansif.
theological_decisions:
- issue: Portée de l’autorité de Jésus pour pardonner les péchés
  choice: Conserver la question étonnée des convives sans expliquer qui est Jésus ni sur quel fondement il pardonne.
  alternative: Ajouter une précision telle que « cet homme » ou expliciter une conclusion christologique.
  rationale: Le verset soulève implicitement la question de l’identité et de l’autorité de Jésus, mais n’y répond pas ici. La traduction maintient cette tension théologique sans introduire d’interprétation doctrinale.
translation_notes:
  register: Français international moderne, naturel et digne. « Étaient à table » privilégie l’intelligibilité courante plutôt qu’une reproduction littérale de la posture antique; la note préserve l’ambiguïté de ἐν ἑαυτοῖς.
