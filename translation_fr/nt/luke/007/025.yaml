id: LUK.7.25
reference: Luke 7:25
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀλλὰ τί ⸀ἐξήλθατε ἰδεῖν; ἄνθρωπον ἐν μαλακοῖς ἱματίοις ἠμφιεσμένον; ἰδοὺ οἱ ἐν ἱματισμῷ ἐνδόξῳ καὶ τρυφῇ ὑπάρχοντες ἐν τοῖς βασιλείοις εἰσίν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/025.yaml
  text: But what did you go out to see? A man dressed in soft clothing? Look[b][a], those who are in splendid clothing and luxury are in royal palaces.
translation:
  language: fr
  text: 'Mais qu’êtes-vous allés voir ? Un homme vêtu d’habits délicats[a] ? Voyez : ceux qui portent des vêtements somptueux et vivent dans le luxe se trouvent dans les palais royaux[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « d’habits doux ». Il s’agit de vêtements fins et luxueux, non d’une faiblesse morale.
    reason: lexical_alternative
  - marker: b
    text: Ou « dans les cours des rois ». Le grec peut désigner les résidences royales ou le milieu de la cour.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Mais
  rationale: Marque la transition adversative dans la suite des questions rhétoriques de Jésus.
- source_word: ἐξήλθατε ἰδεῖν
  choice: qu’êtes-vous allés voir
  rationale: Rend naturellement en français l’aoriste de ἐξέρχομαι suivi de l’infinitif de but.
- source_word: ἄνθρωπον ἐν μαλακοῖς ἱματίοις ἠμφιεσμένον
  choice: un homme vêtu d’habits délicats
  rationale: Préserve l’image concrète d’étoffes fines et douces, associées au luxe, sans suggérer une faiblesse morale.
- source_word: ἰδοὺ
  choice: Voyez
  rationale: Interpellation actuelle et digne qui attire l’attention sur l’explication qui suit.
- source_word: ἐν ἱματισμῷ ἐνδόξῳ
  choice: portent des vêtements somptueux
  rationale: ἐνδόξῳ évoque ici la magnificence et l’éclat social de la tenue.
- source_word: τρυφῇ ὑπάρχοντες
  choice: vivent dans le luxe
  rationale: Expression française naturelle pour la condition d’aisance raffinée ou de vie luxueuse désignée par τρυφή.
- source_word: ἐν τοῖς βασιλείοις
  choice: dans les palais royaux
  rationale: Le substantif pluriel désigne les résidences ou les milieux de cour des souverains; cette formulation conserve le pluriel et le cadre royal.
theological_decisions:
- issue: Sens de μαλακοῖς dans le contexte
  choice: Référence à des habits fins et délicats associés au luxe.
  alternative: Vêtements efféminés ou caractérisation morale de celui qui les porte.
  rationale: Le contraste entre le désert, les vêtements somptueux, le luxe et les palais royaux est social et matériel; rien dans le contexte n’impose un jugement sur l’efféminement.
- issue: Portée de βασιλείοις
  choice: Palais royaux.
  alternative: Cours des rois.
  rationale: Le terme peut viser les résidences royales ou, par extension, le cadre de la cour. Le texte principal retient le sens spatial direct tout en signalant l’autre possibilité.
translation_notes:
  register: Français international moderne, naturel et digne. Les questions rhétoriques restent directes; « habits délicats » garde l’image tactile tout en étant immédiatement compréhensible, et les notes préservent les principales nuances lexicales.
