id: LUK.7.20
reference: Luke 7:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: παραγενόμενοι δὲ πρὸς αὐτὸν οἱ ἄνδρες εἶπαν· Ἰωάννης ὁ βαπτιστὴς ⸀ἀπέστειλεν ἡμᾶς πρὸς σὲ λέγων· Σὺ εἶ ὁ ἐρχόμενος ἢ ἄλλον προσδοκῶμεν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/020.yaml
  text: When the men came to him[a], they said, “John the Baptist has sent us to you, saying, ‘Are you the one who is to come, or should we expect another?’”
translation:
  language: fr
  text: 'Quand les hommes arrivèrent auprès de lui, ils dirent : « Jean le Baptiste nous a envoyés te demander : “Es-tu celui qui vient[a], ou devons-nous en attendre un autre ?” »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « celui qui doit venir ».'
    reason: Variante idiomatique qui explicite la valeur attendue ou annoncée de l’expression grecque ὁ ἐρχόμενος.
lexical_decisions:
- source_word: παραγενόμενοι δὲ πρὸς αὐτὸν
  choice: Quand les hommes arrivèrent auprès de lui
  rationale: Le participe aoriste fournit la circonstance préalable à la parole. « Arrivèrent auprès de lui » exprime naturellement l’approche indiquée par πρός avec l’accusatif.
- source_word: οἱ ἄνδρες
  choice: les hommes
  rationale: ἀνήρ désigne ici les messagers masculins de Jean; la traduction conserve cette précision sans ajout explicatif.
- source_word: Ἰωάννης ὁ βαπτιστής
  choice: Jean le Baptiste
  rationale: Titre traditionnel, courant et immédiatement compréhensible en français moderne.
- source_word: ἀπέστειλεν ἡμᾶς πρὸς σὲ λέγων
  choice: nous a envoyés te demander
  rationale: Cette formulation française restitue idiomatiquement l’envoi vers Jésus et le contenu interrogatif introduit par λέγων, sans conserver un lourd « en disant ».
- source_word: ὁ ἐρχόμενος
  choice: celui qui vient
  rationale: Traduction directe du participe substantivé, qui conserve à la fois son caractère désignatif et son évocation de la figure attendue, sans expliciter davantage son identité.
- source_word: ἄλλον προσδοκῶμεν
  choice: devons-nous en attendre un autre
  rationale: προσδοκάω exprime ici l’attente anticipée d’une personne. Le pronom « en » est idiomatique en français et renvoie à quelqu’un remplissant ce rôle.
theological_decisions:
- issue: Portée messianique de ὁ ἐρχόμενος
  choice: celui qui vient
  alternative: celui qui doit venir
  rationale: « Celui qui vient » suit de près le grec et peut fonctionner comme une désignation chargée d’attente messianique, tout en préservant l’ambiguïté entre titre reconnu et description. « Celui qui doit venir » rendrait l’attente plus explicite, mais ajouterait une nuance d’obligation ou de destination absente de la forme grecque.
translation_notes:
  register: Français international moderne, narratif et digne. Le discours indirect de mission est rendu par « te demander » pour éviter une construction artificielle, tandis que la question de Jean demeure au discours direct. Le vouvoiement n’est pas employé, conformément au tutoiement biblique français courant dans l’adresse individuelle.
