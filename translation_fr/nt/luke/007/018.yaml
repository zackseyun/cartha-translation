id: LUK.7.18
reference: Luke 7:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ ἀπήγγειλαν Ἰωάννῃ οἱ μαθηταὶ αὐτοῦ περὶ πάντων τούτων. καὶ προσκαλεσάμενος δύο τινὰς τῶν μαθητῶν αὐτοῦ ὁ Ἰωάννης
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/018.yaml
  text: And his disciples reported all these things to John[a]. And John, calling two certain ones of his disciples[b],
translation:
  language: fr
  text: Les disciples de Jean lui rapportèrent tout cela. Jean fit alors venir deux de ses disciples[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La phrase grecque se poursuit au verset suivant; la virgule signale que le sens reste en suspens.
    reason: cross_reference
lexical_decisions:
- source_word: ἀπήγγειλαν
  choice: rapportèrent
  rationale: Le verbe désigne l’action de transmettre une information ou de faire un rapport. « Rapportèrent » convient au registre narratif sans donner à l’annonce un caractère excessivement officiel.
- source_word: Ἰωάννῃ
  choice: à Jean / lui
  rationale: Le datif marque le destinataire. En français, la reprise pronominale « lui » après « les disciples de Jean » évite une ambiguïté tout en restant naturelle.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: les disciples de Jean
  rationale: Le pronom grec renvoie à Jean. L’explicitation du nom en français prévient une référence flottante en début de verset.
- source_word: περὶ πάντων τούτων
  choice: tout cela
  rationale: Après « rapporter », le français peut exprimer naturellement l’objet du rapport sans préposition. « Tout cela » conserve l’idée globale de πάντων τούτων.
- source_word: προσκαλεσάμενος
  choice: fit alors venir
  rationale: Le participe moyen indique que Jean prend l’initiative d’appeler les disciples auprès de lui. « Fit venir » exprime naturellement ce mouvement en français, tandis que « alors » articule la succession narrative portée par καί.
- source_word: δύο τινὰς τῶν μαθητῶν αὐτοῦ
  choice: deux de ses disciples
  rationale: Le génitif est partitif et τινάς donne une nuance indéfinie. En français courant, « deux de ses disciples » exprime naturellement la sélection de deux membres du groupe; « deux certains de ses disciples » serait artificiel.
- source_word: ὁ Ἰωάννης
  choice: Jean
  rationale: Le nom explicite le sujet principal après le participe grec. Il est maintenu comme sujet de la seconde phrase française.
theological_decisions: []
translation_notes:
  register: Français moderne, international et digne. La formulation reste narrative et accessible. La division en deux phrases clarifie les sujets sans modifier la progression du grec; la virgule finale préserve la continuité syntaxique avec le verset suivant.
