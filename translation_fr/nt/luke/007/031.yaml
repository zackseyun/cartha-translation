source:
  edition: SBLGNT
  text: Τίνι οὖν ὁμοιώσω τοὺς ἀνθρώπους τῆς γενεᾶς ταύτης, καὶ τίνι εἰσὶν ὅμοιοι;
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/031.yaml
  text: To what, then, shall I compare the men of this generation, and what are they like?
translation:
  language: fr
  text: À quoi donc comparerai-je les gens de cette génération ? À quoi ressemblent-ils ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοὺς ἀνθρώπους
  choice: les gens
  rationale: Dans ce contexte, ἄνθρωποι désigne collectivement les êtres humains ou les personnes de la génération en question, sans limiter le propos aux hommes de sexe masculin.
- source_word: τῆς γενεᾶς ταύτης
  choice: de cette génération
  rationale: Rend directement le génitif grec et conserve la portée potentiellement chronologique et morale de γενεά.
- source_word: Τίνι ... ὁμοιώσω / τίνι εἰσὶν ὅμοιοι
  choice: À quoi ... comparerai-je / À quoi ressemblent-ils
  rationale: Reproduit les deux questions parallèles tout en employant des tournures françaises naturelles.
- source_word: οὖν
  choice: donc
  rationale: Conserve le lien inférentiel avec le contexte précédent.
theological_decisions:
- issue: Portée de ἀνθρώπους
  choice: les gens
  alternative: les hommes
  rationale: Le grec emploie le terme humain générique ἄνθρωποι, non ἄνδρες, et le contexte vise les contemporains en général. « Les gens » préserve cette portée sans introduire une restriction masculine.
translation_notes:
  register: Français moderne, international et digne. La structure en deux questions conserve le parallélisme rhétorique du grec sans lourdeur.
