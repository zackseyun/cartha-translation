    rationale: ἤγγισεν est un aoriste, indiquant l’arrivée ou l’approche comme événement. « Il arriva près de » conserve plus nettement cette valeur que l’imparfait « il approchait ».
  - severity: low
    issue: Reprise de la mère par « celle-ci »
    rationale: Cette reprise est compréhensible, mais « sa mère était veuve » est plus naturel en français moderne et explicite le référent, sans perdre la mise en relief contextuelle.
