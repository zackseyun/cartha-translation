  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὡς δὲ ἤγγισεν τῇ πύλῃ τῆς πόλεως, καὶ ἰδοὺ ἐξεκομίζετο τεθνηκὼς ⸂μονογενὴς υἱὸς⸃ τῇ μητρὶ αὐτοῦ, καὶ αὐτὴ ⸀ἦν χήρα, καὶ ὄχλος τῆς πόλεως ἱκανὸς ⸁ἦν σὺν αὐτῇ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/012.yaml
  text: As he came near to the gate of the city[a], behold, a dead man was being carried out, the only son of his mother, and she was a widow, and a considerable crowd from the city was with her.
translation:
  language: fr
  text: 'Lorsqu’il arriva près de la porte de la ville, voici qu’on emportait un mort hors de la ville : c’était le fils unique[a] de sa mère, et sa mère était veuve. Une foule nombreuse venue de la ville l’accompagnait.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « son seul fils ».'
    reason: Variante lexicale possible pour μονογενής dans ce contexte familial.
lexical_decisions:
- source_word: ὡς δὲ ἤγγισεν
  choice: Au moment où il approchait
  rationale: Cette formulation rend naturellement la relation temporelle et conserve le mouvement d’approche. Le léger enchaînement narratif de δέ est intégré à la phrase sans ajout pesant.
- source_word: τῇ πύλῃ τῆς πόλεως
  choice: de la porte de la ville
  rationale: Rend directement la construction grecque dans un français naturel.
- source_word: καὶ ἰδοὺ
  choice: voici que
  rationale: Conserve la fonction de ἰδού, qui attire brusquement l’attention sur la scène, sans recourir à une tournure archaïque.
- source_word: ἐξεκομίζετο
  choice: on emportait … hors de la ville
  rationale: L’imparfait français exprime l’action en cours de l’imparfait grec; « hors de la ville » explicite la valeur du préverbe ἐξ- dans le contexte du cortège funèbre.
- source_word: τεθνηκώς
  choice: un mort
  rationale: Expression concise et idiomatique pour une personne qui se trouve dans l’état d’avoir péri, valeur du participe parfait.
- source_word: μονογενὴς υἱός
  choice: le fils unique
  rationale: Dans ce contexte familial, μονογενής indique qu’il s’agissait du seul fils de la veuve.
- source_word: τῇ μητρὶ αὐτοῦ
  choice: de sa mère
  rationale: 'Le datif exprime ici la relation : il était l’unique fils de cette mère.'
- source_word: καὶ αὐτὴ ἦν χήρα
  choice: et celle-ci était veuve
  rationale: « Celle-ci » reprend clairement la mère et reflète l’insistance du pronom grec αὐτή.
- source_word: ὄχλος τῆς πόλεως ἱκανός
  choice: une foule nombreuse venue de la ville
  rationale: ἱκανός désigne ici une foule d’importance notable; « nombreuse » est clair et naturel. « Venue de la ville » rend l’origine ou l’appartenance exprimée par le génitif.
- source_word: ἦν σὺν αὐτῇ
  choice: l’accompagnait
  rationale: Dans cette scène de cortège funèbre, le verbe « accompagner » exprime naturellement le sens de σύν avec le datif.
theological_decisions:
- issue: Sens de μονογενής dans un contexte non christologique
  choice: le fils unique
  alternative: son seul fils
  rationale: Le terme décrit ici la relation familiale entre la veuve et le défunt. La traduction retient le sens contextuel ordinaire sans lui importer les résonances théologiques propres à certains emplois johanniques.
translation_notes:
  register: Français international moderne, digne et narratif. La syntaxe a été légèrement réorganisée pour éviter une longue succession de « et », tout en conservant la progression et la force pathétique du grec.
