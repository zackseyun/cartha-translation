review_pass:
  verdict: revise
  source_fidelity: 'Le sens essentiel est bien rendu : l’approche de Jésus, la sortie du défunt, son statut de fils unique, le veuvage de sa mère et la présence d’une foule sont tous conservés. Toutefois, « Au moment où il approchait » emploie un imparfait qui affaiblit légèrement l’aoriste ἤγγισεν ; une formulation perfective française est préférable. « Hors de la ville » rend utilement le préfixe ἐξ- de ἐξεκομίζετο.'
  naturalness: Le français est globalement naturel et digne. « Sa mère était veuve » est cependant plus direct et plus idiomatique que « celle-ci était veuve », tout en conservant l’information mise en relief par αὐτή.
  terminology: « Fils unique » rend exactement μονογενὴς υἱός dans ce contexte familial non christologique. « Un mort » convient à τεθνηκώς, et « une foule nombreuse » rend adéquatement ὄχλος … ἱκανός. Le marqueur de note est correctement placé.
  issues:
