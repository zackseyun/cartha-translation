  text: καὶ ἀνεκάθισεν ὁ νεκρὸς καὶ ἤρξατο λαλεῖν, καὶ ἔδωκεν αὐτὸν τῇ μητρὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/015.yaml
  text: And the dead man sat up and began to speak[a], and he gave him to his mother.
translation:
  language: fr
  text: Alors le mort se redressa et se mit à parler, et Jésus le remit à sa mère.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « Jésus le donna à sa mère ». Ou : « Jésus le rendit à sa mère » ou « Jésus le redonna à sa mère ». Le grec dit simplement : « il le donna à sa mère » ; l’idée de restitution est suggérée par le contexte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνεκάθισεν
  choice: se redressa
  rationale: Le verbe décrit le passage d’une position allongée à une position assise. « Se redressa » est naturel en français et n’implique pas qu’il se soit levé sur ses pieds.
- source_word: ὁ νεκρός
  choice: le mort
  rationale: Cette expression française concise et personnelle correspond à l’adjectif substantivé grec. « Le cadavre » serait plus clinique et conviendrait moins une fois l’homme revenu à la vie.
- source_word: ἤρξατο λαλεῖν
  choice: se mit à parler
  rationale: Cette tournure rend naturellement la valeur ingressive de ἤρξατο suivi de l’infinitif et convient au registre narratif.
- source_word: ἔδωκεν αὐτὸν τῇ μητρὶ αὐτοῦ
  choice: Jésus le donna à sa mère
  rationale: Le grec dit littéralement « il le donna à sa mère ». Le nom « Jésus » explicite seulement le sujet déjà établi par le contexte et évite en français une succession momentanément ambiguë de pronoms masculins.
theological_decisions:
- issue: Faut-il expliciter que Jésus rend le fils à sa mère en ajoutant « de nouveau » ou en employant « rendre » ?
  choice: Conserver « le donna à sa mère »
  alternative: « le rendit à sa mère » ou « le redonna à sa mère »
  rationale: Le contexte implique clairement une restitution, mais δίδωμι signifie simplement « donner » et ne comporte aucun élément exprimant explicitement le retour. La formulation retenue préserve cette sobriété tout en signalant l’interprétation contextuelle en note.
translation_notes:
  register: Français international moderne, naturel et digne. La coordination répétée du grec est légèrement lissée par « Alors », tandis que l’enchaînement narratif demeure intact. Le marqueur [a] est placé après la proposition à laquelle se rapporte la variante.
