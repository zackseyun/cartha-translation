source:
  edition: SBLGNT
  text: ⸀ἀποκριθεὶς Σίμων εἶπεν· Ὑπολαμβάνω ὅτι ᾧ τὸ πλεῖον ἐχαρίσατο. ὁ δὲ εἶπεν αὐτῷ· Ὀρθῶς ἔκρινας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/043.yaml
  text: Simon answered[a], “I suppose the one to whom he forgave more.” And he said to him[b], “You have judged rightly.”
translation:
  language: fr
  text: 'Simon répondit : « Je suppose que c’est celui à qui il a remis la dette la plus importante[a]. » Jésus lui dit : « Tu as bien jugé. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « celui à qui il a le plus pardonné » ; le verbe grec peut désigner le fait d’accorder gracieusement une remise ou un pardon.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς … εἶπεν
  choice: répondit
  rationale: La construction participiale suivie de « dit » introduit idiomatiquement une réponse ; le français naturel la rend par un seul verbe.
- source_word: Ὑπολαμβάνω
  choice: Je suppose
  rationale: L’expression marque une déduction prudente plutôt qu’une certitude ferme.
- source_word: ᾧ τὸ πλεῖον ἐχαρίσατο
  choice: celui à qui il a remis la plus grosse dette
  rationale: Dans la parabole immédiate des deux débiteurs, χαρίζομαι désigne la remise gracieuse d’une dette ; τὸ πλεῖον indique le montant le plus élevé.
- source_word: Ὀρθῶς ἔκρινας
  choice: Tu as bien jugé
  rationale: Cette formulation française naturelle conserve le verbe « juger » et l’approbation exprimée par ὀρθῶς.
theological_decisions:
- issue: Rapport entre la remise de dette dans la parabole et le pardon dans son application
  choice: Conserver ici l’image concrète de la dette remise
  alternative: « celui à qui il a le plus pardonné »
  rationale: Le contexte immédiat parle de créances annulées, tandis que la suite applique cette image au pardon des péchés. La traduction maintient cette progression et la note signale l’autre rendu possible sans effacer le lien théologique.
- issue: Identification du sujet de « il lui dit »
  choice: Nommer Jésus
  alternative: « Il lui dit »
  rationale: Le référent est clair dans le contexte ; le nom explicite évite une tournure française ambiguë sans ajouter d’interprétation doctrinale.
translation_notes:
  register: Français international moderne, simple et digne. « Je suppose » préserve l’hésitation de Simon ; « la plus grosse dette » rend naturellement la comparaison implicite entre les deux montants.
