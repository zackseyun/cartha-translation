  source_fidelity: 'Le sens est globalement juste : Simon formule une déduction prudente, et Jésus confirme que son jugement est correct. Toutefois, « la plus grosse dette » est un peu familier et présente τὸ πλεῖον comme une dette distincte plutôt que comme le montant comparativement plus élevé remis. « La dette la plus importante » rend plus précisément l’image de la parabole tout en restant naturel.'
