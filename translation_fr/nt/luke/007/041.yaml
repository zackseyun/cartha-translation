  text: δύο χρεοφειλέται ἦσαν δανιστῇ τινι· ὁ εἷς ὤφειλεν δηνάρια πεντακόσια, ὁ δὲ ἕτερος πεντήκοντα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/041.yaml
  text: 'Two debtors owed a certain moneylender: one owed five hundred denarii[a], and the other fifty.'
translation:
  language: fr
  text: '« Un prêteur avait deux débiteurs : l’un lui devait cinq cents deniers[a], et l’autre cinquante. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le denier était une monnaie romaine en argent, couramment associée au salaire d’une journée de travail d’un ouvrier.
    reason: cultural_note
lexical_decisions:
- source_word: χρεοφειλέται
  choice: débiteurs
  rationale: Le nom désigne des personnes qui ont une dette ; « débiteurs » est direct, naturel et convient au cadre de la parabole.
- source_word: δανιστῇ τινι
  choice: un prêteur
  rationale: δανιστής désigne celui qui prête de l’argent. En français, l’article indéfini rend naturellement τινι sans alourdir la phrase par « un certain ».
- source_word: ὤφειλεν
  choice: devait
  rationale: L’imparfait français correspond naturellement à l’imparfait grec qui décrit la dette existante dans le récit.
- source_word: δηνάρια
  choice: deniers
  rationale: « Denier » est le nom français traditionnel et historiquement précis de cette monnaie romaine ; une note en explique la valeur approximative.
- source_word: πεντακόσια
  choice: cinq cents
  rationale: Rendu direct du nombre cardinal.
- source_word: ἕτερος
  choice: l’autre
  rationale: Cette formulation reprend naturellement en français l’opposition entre ὁ εἷς et ὁ δὲ ἕτερος.
- source_word: πεντήκοντα
  choice: cinquante
  rationale: Rendu direct du nombre cardinal ; « deniers » reste sous-entendu comme en grec.
