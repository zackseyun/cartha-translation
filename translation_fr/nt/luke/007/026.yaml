id: LUK.7.26
reference: Luke 7:26
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀλλὰ τί ⸀ἐξήλθατε ἰδεῖν; προφήτην; ναί, λέγω ὑμῖν, καὶ περισσότερον προφήτου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/026.yaml
  text: But what did you go out to see? A prophet? Yes[a], I tell you, and more than a prophet.
translation:
  language: fr
  text: 'Mais qu’êtes-vous allés voir ? Un prophète ? Oui, je vous le dis : plus qu’un prophète[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « quelqu’un de plus grand qu’un prophète ». La tournure comparative grecque peut se rendre plus littéralement ainsi, mais « plus qu’un prophète » est plus naturel en français.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Mais
  rationale: La particule adversative introduit un contraste avec la question rhétorique précédente ; « Mais » assure une transition naturelle en français.
- source_word: τί
  choice: qu’
  rationale: Le pronom interrogatif est l’objet de « voir » et signifie ici « quoi », élidé naturellement devant la forme verbale.
- source_word: ἐξήλθατε
  choice: êtes-vous allés
  rationale: L’aoriste actif, deuxième personne du pluriel, désigne la sortie passée des auditeurs ; le passé composé interrogatif est idiomatique en français moderne.
- source_word: ἰδεῖν
  choice: voir
  rationale: L’infinitif aoriste exprime le but du déplacement ; « voir » est direct et naturel.
- source_word: προφήτην
  choice: Un prophète
  rationale: L’accusatif singulier est employé elliptiquement dans la question rhétorique ; le nom commun ne requiert pas de majuscule particulière.
- source_word: ναί
  choice: Oui
  rationale: Cette affirmation répond directement et avec force à la question rhétorique.
- source_word: λέγω ὑμῖν
  choice: je vous le dis
  rationale: Cette formule rend naturellement en français moderne l’adresse solennelle de Jésus ; le pronom « le » est idiomatique sans ajouter de contenu.
- source_word: καὶ περισσότερον προφήτου
  choice: plus qu’un prophète
  rationale: La tournure comparative avec le génitif signifie idiomatiquement que Jean dépasse la simple condition de prophète. Les deux-points rendent en français l’ellipse grecque sans expliciter la nature de cette supériorité.
theological_decisions:
- issue: L’identité et le statut de Jean le Baptiste dans la description de Jésus
  choice: Jésus reconnaît Jean comme prophète tout en déclarant qu’il est plus qu’un prophète, sans préciser dans ce verset en quoi consiste cette supériorité.
  alternative: Expliciter que Jean est le plus grand des prophètes ou le messager eschatologique annoncé.
  rationale: La formulation concise du grec doit conserver sa tension théologique ; le contexte immédiat apporte l’explication, mais celle-ci ne doit pas être incorporée au verset.
translation_notes:
  register: Français international moderne, clair et digne. La question conserve son caractère rhétorique. Les deux-points évitent une coordination maladroite en français tout en préservant l’affirmation elliptique et emphatique du grec.
