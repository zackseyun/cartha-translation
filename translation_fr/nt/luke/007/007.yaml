  text: διὸ οὐδὲ ἐμαυτὸν ἠξίωσα πρὸς σὲ ἐλθεῖν· ἀλλὰ εἰπὲ λόγῳ, καὶ ⸀ἰαθήτω ὁ παῖς μου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/007.yaml
  text: Therefore I did not even consider myself worthy to come to you. But say the word[a], and let my servant be healed.
translation:
  language: fr
  text: C’est pourquoi je ne me suis même pas jugé digne de venir jusqu’à toi. Mais dis un mot, et que mon serviteur[a] soit guéri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « mon garçon » ou « mon enfant » ; le mot grec peut désigner un enfant, un jeune garçon ou un serviteur, selon le contexte.
    reason: alternative lexicale
lexical_decisions:
- source_word: διὸ
  choice: C’est pourquoi
  rationale: Exprime naturellement en français la déduction qui découle de la déclaration précédente.
- source_word: οὐδὲ
  choice: ne… même pas
  rationale: 'Renforce la négation : le centurion ne s’est pas même estimé digne de venir en personne.'
- source_word: ἐμαυτὸν ἠξίωσα
  choice: je ne me suis… pas jugé digne
  rationale: Rend le sens de « considérer comme digne » tout en conservant la construction réfléchie.
- source_word: πρὸς σὲ ἐλθεῖν
  choice: venir jusqu’à toi
  rationale: Exprime l’idée de se rendre personnellement auprès de Jésus dans un français naturel.
- source_word: ἀλλὰ
  choice: Mais
  rationale: Introduit directement la demande qui contraste avec le refus de venir en personne.
- source_word: εἰπὲ λόγῳ
  choice: dis un mot
  rationale: Formulation française naturelle qui conserve l’idée d’une parole prononcée avec autorité, sans ajouter explicitement « donne un ordre ».
- source_word: ἰαθήτω
  choice: que… soit guéri
  rationale: Préserve la valeur impérative de l’aoriste passif à la troisième personne, plutôt que de la transformer en simple futur.
- source_word: ὁ παῖς μου
  choice: mon serviteur
  rationale: Dans le cadre du récit du centurion, « serviteur » correspond le mieux à la relation d’autorité décrite, tandis qu’une note conserve l’étendue sémantique du terme.
theological_decisions:
- issue: Sens de παῖς dans le récit du centurion
  choice: mon serviteur
  alternative: mon garçon ; mon enfant
  rationale: Le terme grec peut désigner un enfant, un jeune garçon ou un serviteur. Le contexte d’une personne placée sous l’autorité du centurion favorise « serviteur », sans exclure une nuance affective ou familiale, signalée en note.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement correspond à l’adresse directe au singulier. La formulation « que… soit guéri » maintient la force impérative et la tension grammaticale du grec.
