  verdict: revise
  source_fidelity: 'La traduction rend avec précision l’impératif de mission, les observations rapportées et l’énumération. Deux ajustements améliorent la fidélité : « Puis » ajoute une nuance temporelle absente de καί, et « les morts ressuscitent » transforme le passif grec ἐγείρονται en actif français.'
  naturalness: Le français demeure moderne, fluide et digne. « Les aveugles reçoivent la vue » est naturel dans ce registre et évite d’impliquer que tous avaient auparavant la vue. « Les morts sont relevés » conserve le passif sans être inutilement lourd.
  terminology: « Sont purifiés » maintient justement la portée de καθαρίζονται, au-delà d’une simple guérison. « La bonne nouvelle est annoncée aux pauvres » rend bien le passif de εὐαγγελίζονται. Les notes sont reformulées afin que l’ancre a explique réellement l’ambiguïté lexicale et que l’ancre b ne qualifie pas improprement une paraphrase de « littérale ».
  issues:
  - severity: low
    issue: « Puis » introduit une succession temporelle.
    rationale: Le καί initial coordonne simplement la réponse ; « Il leur répondit » est plus neutre et fidèle.
  - severity: medium
    issue: « Les morts ressuscitent » ne conserve pas la voix passive de ἐγείρονται.
    rationale: Même si l’expression est idiomatique, sa forme active peut présenter les morts comme sujets de leur propre retour à la vie. « Sont relevés » conserve l’agent implicite du grec.
  - severity: medium
    issue: « Retrouvent la vue » présuppose un recouvrement de la vue.
    rationale: ἀναβλέπω peut désigner le recouvrement ou l’acquisition de la vue. Le texte principal ne doit pas imposer la première possibilité ; elle est conservée en note.
  - severity: low
    issue: La note b emploie « Littéralement » pour une explication interprétative.
    rationale: « Les pauvres sont évangélisés » représente un calque technique possible, non une formulation littérale française nécessaire. La note doit simplement signaler la voix passive.
