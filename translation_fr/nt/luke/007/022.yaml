  to: 'Il leur répondit : « Allez rapporter à Jean ce que vous avez vu et entendu : les aveugles reçoivent la vue[a], les boiteux marchent, les lépreux sont purifiés, les sourds entendent, les morts sont relevés, et la bonne nouvelle est annoncée aux pauvres[b]. »'
