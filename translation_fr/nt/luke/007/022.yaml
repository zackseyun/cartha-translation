source:
  edition: SBLGNT
  text: καὶ ⸀ἀποκριθεὶς εἶπεν αὐτοῖς· Πορευθέντες ἀπαγγείλατε Ἰωάννῃ ἃ εἴδετε καὶ ἠκούσατε· ⸀τυφλοὶ ἀναβλέπουσιν, χωλοὶ περιπατοῦσιν, λεπροὶ καθαρίζονται, ⸀κωφοὶ ἀκούουσιν, νεκροὶ ἐγείρονται, πτωχοὶ εὐαγγελίζονται·
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/022.yaml
  text: 'And answering[a], he said to them, “Go and report to John what you have seen and heard: the blind receive sight, the lame walk, lepers are cleansed, the deaf hear, the dead are raised[b], the poor have good news proclaimed to them.”'
translation:
  language: fr
  text: 'Il leur répondit : « Allez rapporter à Jean ce que vous avez vu et entendu : les aveugles reçoivent la vue[a], les boiteux marchent, les lépreux sont purifiés, les sourds entendent, les morts sont relevés, et la bonne nouvelle est annoncée aux pauvres[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les aveugles retrouvent la vue ». Le verbe grec peut désigner le fait de recevoir la vue ou de la recouvrer.'
    reason: lexical_alternative
  - marker: b
    text: 'Le grec emploie une forme passive : « les pauvres sont évangélisés », c’est-à-dire qu’on leur annonce la bonne nouvelle.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν αὐτοῖς
  choice: Puis il leur répondit
  rationale: Cette tournure française naturelle exprime la valeur responsive du participe suivi du verbe « dire », sans reproduire lourdement la construction grecque.
- source_word: Πορευθέντες ἀπαγγείλατε
  choice: Allez rapporter
  rationale: Le participe de mouvement accompagne idiomatiquement l’impératif. « Rapporter » convient à la transmission à Jean de faits observés.
- source_word: ἃ εἴδετε καὶ ἠκούσατε
  choice: ce que vous avez vu et entendu
  rationale: Le passé composé rend naturellement en français les observations accomplies qui doivent maintenant être rapportées.
- source_word: τυφλοὶ ἀναβλέπουσιν
  choice: les aveugles retrouvent la vue
  rationale: Dans ce contexte, ἀναβλέπω désigne l’accès ou le retour à la vue. La formulation française est claire et conserve l’idée de restauration.
- source_word: χωλοὶ περιπατοῦσιν
  choice: les boiteux marchent
  rationale: Traduction directe, concise et courante de l’adjectif substantivé et du verbe.
- source_word: λεπροὶ καθαρίζονται
  choice: les lépreux sont purifiés
  rationale: « Sont purifiés » préserve la dimension de pureté portée par καθαρίζονται, plutôt que de réduire l’expression à une guérison médicale.
- source_word: κωφοὶ ἀκούουσιν
  choice: les sourds entendent
  rationale: Avec le verbe « entendre », κωφοί désigne ici sans ambiguïté les sourds.
- source_word: νεκροὶ ἐγείρονται
  choice: les morts ressuscitent
  rationale: Cette expression française idiomatique rend le relèvement des morts sans préciser l’agent, que le grec passif laisse implicite.
- source_word: πτωχοὶ εὐαγγελίζονται
  choice: la bonne nouvelle est annoncée aux pauvres
  rationale: Cette formulation conserve le sens passif et le contenu d’annonce de εὐαγγελίζονται, sans employer le jargon potentiellement ambigu « évangéliser ».
theological_decisions:
- issue: La liste des miracles comme témoignage sur l’identité et la mission de Jésus
  choice: Présenter simplement les actes observables de restauration, tout en conservant le vocabulaire qui fait écho aux prophètes.
  alternative: Expliciter dans le texte qu’il s’agit de l’accomplissement de prophéties messianiques.
  rationale: Le verset demande de rapporter les faits à Jean mais n’explicite pas lui-même leur interprétation. La traduction ne doit donc pas ajouter cette conclusion.
- issue: L’agent des actions exprimées au passif
  choice: Ne pas nommer explicitement l’agent de la purification, du relèvement des morts ou de l’annonce.
  alternative: Ajouter « Dieu » ou « Jésus » comme sujet explicite.
  rationale: Les formes grecques laissent l’agent implicite. Le rendre explicite résoudrait une donnée que le texte maintient en retrait.
- issue: Rendu de νεκροὶ ἐγείρονται
  choice: les morts ressuscitent
  alternative: les morts sont relevés
  rationale: « Ressuscitent » est le français biblique moderne le plus naturel ici. Bien que sa forme soit active, il n’attribue pas l’action aux morts eux-mêmes dans l’usage courant et laisse l’agent non exprimé.
translation_notes:
  register: Français international moderne, naturel et digne. La coordination reste rythmée comme dans l’énumération grecque. Les passifs théologiquement significatifs sont conservés lorsque le français le permet, et aucune interprétation messianique explicite n’est ajoutée.
