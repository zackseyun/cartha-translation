id: LUK.7.27
reference: Luke 7:27
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὗτός ἐστιν περὶ οὗ γέγραπται· ⸀Ἰδοὺ ἀποστέλλω τὸν ἄγγελόν μου πρὸ προσώπου σου, ὃς κατασκευάσει τὴν ὁδόν σου ἔμπροσθέν σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/027.yaml
  text: 'This is he about whom it is written: ‘Behold[a], I am sending my messenger before your face[b], who will prepare your way before you.’'
translation:
  language: fr
  text: 'C’est de lui qu’il est écrit : « Voici, j’envoie mon messager[a] devant toi[b] ; il préparera ton chemin devant toi. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot grec peut aussi signifier « ange » ; ici, il désigne un envoyé humain, Jean.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « devant ta face ».'
    reason: literal_rendering
lexical_decisions:
- source_word: οὗτός ἐστιν περὶ οὗ γέγραπται
  choice: C’est de lui qu’il est écrit
  rationale: Cette tournure française naturelle conserve l’accent démonstratif sur Jean ainsi que la formule d’introduction d’une citation scripturaire.
- source_word: Ἰδοὺ
  choice: Voici
  rationale: « Voici » garde la force solennelle et déictique de la citation prophétique tout en restant courant en français moderne.
- source_word: ἀποστέλλω
  choice: j’envoie
  rationale: Le présent français rend directement le présent grec et son caractère vivant dans l’oracle cité.
- source_word: ἄγγελόν
  choice: messager
  rationale: Le terme grec peut désigner un ange ou un envoyé humain ; ici, il renvoie à Jean. « Messager » exprime donc le sens contextuel sans suggérer à tort un être céleste.
- source_word: πρὸ προσώπου σου
  choice: devant toi
  rationale: Cette expression idiomatique rend naturellement en français la locution grecque, littéralement « devant ta face », dont l’image concrète est signalée en note.
- source_word: κατασκευάσει
  choice: préparera
  rationale: Le futur indique l’action de rendre le chemin prêt ; « préparera » est précis, clair et naturel.
- source_word: τὴν ὁδόν σου
  choice: ton chemin
  rationale: « Chemin » convient au sens à la fois concret et prophétique de ὁδός.
- source_word: ἔμπροσθέν σου
  choice: devant toi
  rationale: La traduction conserve la seconde indication spatiale et la répétition présente dans le grec.
theological_decisions:
- issue: Application à Jean d’une citation prophétique concernant le messager qui prépare le chemin
  choice: Conserver tous les pronoms de la deuxième personne sans préciser leur référent dans la citation
  alternative: Ajouter explicitement que Jean prépare le chemin du Seigneur ou du Messie
  rationale: Le texte grec applique la citation sans développer ici l’identité du destinataire. Le maintien de « toi » et « ton » préserve la portée théologique ainsi que la tension du texte sans y ajouter une interprétation.
translation_notes:
  register: Français international moderne, clair et digne. La formule « C’est de lui qu’il est écrit » est idiomatique sans affaiblir la solennité de la citation. La répétition finale de « devant toi » est maintenue parce qu’elle appartient au texte source.
