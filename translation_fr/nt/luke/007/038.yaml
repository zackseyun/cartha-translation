id: LUK.7.38
reference: Luke 7:38
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ στᾶσα ⸂ὀπίσω παρὰ τοὺς πόδας αὐτοῦ⸃ κλαίουσα, ⸂τοῖς δάκρυσιν ἤρξατο βρέχειν τοὺς πόδας αὐτοῦ⸃ καὶ ταῖς θριξὶν τῆς κεφαλῆς αὐτῆς ἐξέμασσεν, καὶ κατεφίλει τοὺς πόδας αὐτοῦ καὶ ἤλειφεν τῷ μύρῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/038.yaml
  text: and standing behind him at his feet[a], weeping, she began to wet his feet with her tears, and was wiping them with the hair of her head[b], and was kissing his feet and anointing them with the perfume.
translation:
  language: fr
  text: et, se tenant derrière lui, à ses pieds, elle pleurait. Elle se mit à mouiller ses pieds de ses larmes et les essuyait avec ses cheveux ; elle embrassait ses pieds[a] et les oignait de parfum[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ne cessait d’embrasser ses pieds » ; le verbe grec est intensif, et l’imparfait peut évoquer une action répétée ou prolongée.
    reason: lexical_alternative
  - marker: b
    text: Ou « d’onguent parfumé » ou « d’huile parfumée » ; le mot grec désigne une huile ou un onguent odorant.
    reason: lexical_alternative
lexical_decisions:
- source_word: στᾶσα
  choice: se tenant
  rationale: Le participe aoriste plante le décor. « Se tenant » est naturel en français et décrit sa position sans alourdir la phrase.
- source_word: ὀπίσω παρὰ τοὺς πόδας αὐτοῦ
  choice: derrière lui, à ses pieds
  rationale: Cette formulation conserve à la fois l’idée de se trouver derrière Jésus et celle d’être près de ses pieds, conformément à la posture adoptée à table.
- source_word: κλαίουσα
  choice: elle pleurait
  rationale: L’imparfait exprime naturellement en français les pleurs qui accompagnent et prolongent ses gestes.
- source_word: τοῖς δάκρυσιν ἤρξατο βρέχειν
  choice: elle se mit à mouiller ... de ses larmes
  rationale: « Se mit à » rend le commencement marqué par ἤρξατο, tandis que « mouiller » traduit βρέχειν sans exagérer la quantité de larmes.
- source_word: ἐξέμασσεν
  choice: les essuyait
  rationale: L’imparfait français restitue l’action en cours ; « essuyer » exprime le geste sans imposer qu’elle ait entièrement séché les pieds.
- source_word: ταῖς θριξὶν τῆς κεφαλῆς αὐτῆς
  choice: avec ses cheveux
  rationale: En français courant, « ses cheveux » exprime naturellement la totalité de la formule grecque « les cheveux de sa tête ».
- source_word: κατεφίλει
  choice: elle embrassait
  rationale: L’imparfait préserve l’aspect continu ou répété. Le caractère intensif du verbe composé est signalé en note afin de ne pas surinterpréter le texte principal.
- source_word: ἤλειφεν
  choice: les oignait
  rationale: « Oindre » garde le geste concret et sa portée culturelle, et l’imparfait rend son déroulement.
- source_word: τῷ μύρῳ
  choice: de parfum
  rationale: μύρον désigne une huile ou un onguent parfumé. « Parfum » est ici clair, naturel et accessible, les autres possibilités étant données en note.
theological_decisions:
- issue: Présentation des gestes de la femme envers les pieds de Jésus
  choice: Conserver les gestes corporels concrets et leur intensité émotionnelle, sans leur ajouter une interprétation dévotionnelle.
  alternative: Employer une formulation abstraite telle que « elle lui témoignait sa dévotion », ou atténuer les baisers répétés.
  rationale: Le récit met en scène des gestes humbles, physiques et chargés d’émotion. La traduction les laisse parler sans introduire une explication théologique absente du grec.
translation_notes:
  register: Français international moderne, naturel et digne. La ponctuation clarifie la succession des gestes tout en conservant leur caractère continu. Les marqueurs de note sont placés immédiatement après les termes auxquels leurs variantes se rapportent.
