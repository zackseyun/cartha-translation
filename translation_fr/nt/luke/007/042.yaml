id: LUK.7.42
reference: Luke 7:42
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: μὴ ⸀ἐχόντων αὐτῶν ἀποδοῦναι ἀμφοτέροις ἐχαρίσατο. τίς οὖν ⸀αὐτῶν πλεῖον ⸂ἀγαπήσει αὐτόν⸃;
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/042.yaml
  text: Since they did not have the means to repay[a], he graciously forgave both. So which of them will love him more?
translation:
  language: fr
  text: Comme ils n’avaient pas de quoi rembourser, il fit grâce à tous les deux[a]. Lequel des deux l’aimera donc le plus ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « il remit leur dette à tous les deux ». Le verbe grec peut désigner le fait d’accorder gratuitement une faveur ou de remettre ce qui est dû.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ ἐχόντων αὐτῶν ἀποδοῦναι
  choice: Comme ils n’avaient pas de quoi rembourser
  rationale: Le génitif absolu exprime ici la circonstance, avec une nuance causale naturelle dans le contexte. « Ne pas avoir de quoi » rend clairement l’absence de moyens, et « rembourser » convient à une dette.
- source_word: ἀμφοτέροις ἐχαρίσατο
  choice: il fit grâce à tous les deux
  rationale: Dans ce contexte financier, χαρίζομαι désigne la remise gratuite de ce qui est dû. « Faire grâce » conserve à la fois l’idée d’annulation de la dette et celle d’une faveur librement accordée.
- source_word: τίς οὖν αὐτῶν
  choice: Lequel des deux… donc
  rationale: « Lequel des deux » identifie naturellement les deux débiteurs, tandis que « donc » préserve la valeur déductive de οὖν.
- source_word: πλεῖον ἀγαπήσει αὐτόν
  choice: l’aimera le plus
  rationale: Cette formulation française rend naturellement la comparaison entre les deux débiteurs et conserve le futur de ἀγαπήσει.
theological_decisions:
- issue: Sens de χαρίζομαι dans la parabole des deux débiteurs
  choice: il fit grâce à tous les deux
  alternative: il remit leur dette à tous les deux
  rationale: Le cadre immédiat est celui d’une dette, mais le verbe évoque aussi une faveur accordée gratuitement. « Faire grâce » maintient ces deux dimensions sans réduire le propos à une simple opération comptable ni expliciter prématurément son application théologique.
translation_notes:
  register: Français international moderne, naturel et digne. « N’avaient pas de quoi rembourser » est courant sans être familier; « fit grâce » garde la densité du verbe grec et convient au registre parabolique.
