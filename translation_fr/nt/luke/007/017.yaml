id: LUK.7.17
reference: Luke 7:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἐξῆλθεν ὁ λόγος οὗτος ἐν ὅλῃ τῇ Ἰουδαίᾳ περὶ αὐτοῦ ⸀καὶ πάσῃ τῇ περιχώρῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/017.yaml
  text: And this report about him went out through all Judea and all the surrounding region[a].
translation:
  language: fr
  text: Et cette nouvelle à son sujet se répandit dans toute la Judée et dans toute la région environnante[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ce récit à son sujet » ou « cette parole à son sujet ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: se répandit
  rationale: Dans le contexte de la diffusion d’une information, le mouvement exprimé littéralement par « sortit » correspond naturellement en français à « se répandit ».
- source_word: ὁ λόγος οὗτος
  choice: cette nouvelle
  rationale: λόγος désigne ici l’information qui circule au sujet de Jésus et de son action. « Cette nouvelle » est idiomatique et conserve le caractère narratif du propos.
- source_word: ἐν ὅλῃ τῇ Ἰουδαίᾳ
  choice: dans toute la Judée
  rationale: Cette formulation française exprime clairement l’étendue géographique de la diffusion sans alourdir la phrase.
- source_word: περὶ αὐτοῦ
  choice: à son sujet
  rationale: Rend naturellement περί avec le génitif tout en gardant pour référent Jésus, sans ajouter d’interprétation.
- source_word: πάσῃ τῇ περιχώρῳ
  choice: dans toute la région environnante
  rationale: περίχωρος désigne le territoire qui entoure la Judée ou le lieu évoqué; « région environnante » reste général et fidèle.
- source_word: καὶ ... καὶ
  choice: Et ... et
  rationale: La répétition de « et » préserve la coordination cumulative des deux sphères géographiques.
theological_decisions: []
translation_notes:
  register: Français international moderne, simple et digne. « Se répandit » rend l’idiome de diffusion plus naturellement que le calque « sortit », tandis que la note conserve l’éventail lexical de λόγος.
