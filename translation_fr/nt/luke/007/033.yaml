  text: ἐλήλυθεν γὰρ Ἰωάννης ὁ βαπτιστὴς ⸀μὴ ⸂ἐσθίων ἄρτον μήτε πίνων οἶνον⸃, καὶ λέγετε· Δαιμόνιον ἔχει·
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/033.yaml
  text: For John the Baptist has come eating no bread and drinking no wine[a], and you say, ‘He has a demon.’
translation:
  language: fr
  text: 'Car Jean le Baptiste est venu sans manger de pain ni boire de vin, et vous dites : « Il a un démon[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus idiomatiquement : « Il est possédé par un démon. »'
    reason: Alternative lexicale idiomatique pour Δαιμόνιον ἔχει ; le texte principal conserve la formulation directe du grec.
lexical_decisions:
- source_word: ἐλήλυθεν
  choice: est venu
  rationale: Le passé composé rend naturellement en français le parfait grec et conserve la pertinence présente de la venue de Jean dans l’argument.
- source_word: γὰρ
  choice: Car
  rationale: Introduit l’explication de l’affirmation précédente dans un registre français digne et courant.
- source_word: Ἰωάννης ὁ βαπτιστὴς
  choice: Jean le Baptiste
  rationale: Désignation française traditionnelle, claire et largement reconnue du personnage historique.
- source_word: μὴ ἐσθίων ἄρτον μήτε πίνων οἶνον
  choice: sans manger de pain ni boire de vin
  rationale: Rend la manière de vivre ascétique de Jean, conserve les termes concrets « pain » et « vin », et reproduit naturellement la coordination négative grecque.
- source_word: λέγετε
  choice: vous dites
  rationale: Le présent simple exprime naturellement la réaction caractéristique des interlocuteurs.
- source_word: Δαιμόνιον ἔχει
  choice: Il a un démon
  rationale: Traduction directe qui préserve la formulation et la force accusatrice du grec sans la transformer en une formulation interprétative.
theological_decisions:
- issue: Traduction de δαιμόνιον dans l’accusation portée contre Jean
  choice: démon
  alternative: esprit impur
  rationale: Le texte emploie δαιμόνιον, non l’expression distincte « esprit impur » ; « démon » évite donc une harmonisation terminologique.
- issue: Degré d’interprétation de Δαιμόνιον ἔχει
  choice: Il a un démon
  alternative: Il est possédé par un démon
  rationale: La traduction retenue suit directement la construction grecque et ne précise pas davantage la nature de l’emprise alléguée.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase reste proche de la structure grecque sans lourdeur ; « Jean le Baptiste » suit l’usage biblique français établi.
