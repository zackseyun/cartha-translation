id: LUK.7.45
reference: Luke 7:45
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: φίλημά μοι οὐκ ἔδωκας· αὕτη δὲ ἀφ’ ἧς εἰσῆλθον οὐ διέλιπεν καταφιλοῦσά μου τοὺς πόδας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/045.yaml
  text: You gave me no kiss[a], but from the time I came in[b], she has not stopped kissing my feet.
translation:
  language: fr
  text: Tu ne m’as donné aucun baiser[a] ; mais elle, depuis que je suis entré, n’a pas cessé de couvrir mes pieds de baisers[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « baiser d’accueil » ; le baiser était une marque habituelle d’hospitalité.
    reason: cultural_note
  - marker: b
    text: Le verbe grec peut évoquer des baisers affectueux ou répétés.
    reason: lexical_alternative
lexical_decisions:
- source_word: φίλημά
  choice: baiser
  rationale: Le nom désigne ici un baiser donné en signe d’accueil. « Baiser » reste concis et naturel, sans intégrer l’explication culturelle au corps du texte.
- source_word: μοι
  choice: m’
  rationale: Le datif marque le bénéficiaire de l’action ; « tu ne m’as pas donné » est la tournure française naturelle.
- source_word: ἔδωκας
  choice: as donné
  rationale: δίδωμι signifie directement « donner » et le français emploie naturellement l’expression « donner un baiser ».
- source_word: αὕτη δὲ
  choice: mais elle
  rationale: La formule établit un contraste marqué entre l’hôte et la femme, sans qu’il soit nécessaire de répéter « cette femme ».
- source_word: ἀφ’ ἧς
  choice: depuis que
  rationale: 'Cette locution rend clairement la valeur temporelle : l’action a commencé à l’entrée de Jésus et se poursuit jusqu’au moment où il parle.'
- source_word: εἰσῆλθον
  choice: je suis entré
  rationale: Rend directement le sens de εἰσέρχομαι dans un français courant et digne.
- source_word: οὐ διέλιπεν
  choice: n’a pas cessé
  rationale: Le passé composé français exprime naturellement une action commencée auparavant et toujours pertinente au moment de la parole.
- source_word: καταφιλοῦσά
  choice: de couvrir … de baisers
  rationale: Le verbe intensif καταφιλέω peut évoquer des baisers affectueux et répétés. Cette formulation française restitue plus nettement cette nuance que le simple « embrasser ».
- source_word: μου τοὺς πόδας
  choice: mes pieds
  rationale: Le pluriel explicite du grec est conservé dans une formulation française directe.
theological_decisions:
- issue: Portée culturelle du baiser d’accueil
  choice: Traduire simplement « baiser » dans le texte et expliquer la coutume en note.
  alternative: « baiser d’accueil » dans le corps du texte
  rationale: Le contraste concerne l’hospitalité de l’hôte et le dévouement de la femme, mais le grec nomme seulement le geste. La note permet d’en éclairer la portée sans ajouter une précision interprétative au texte.
- issue: Intensité et répétition exprimées par καταφιλέω
  choice: « couvrir mes pieds de baisers »
  alternative: « embrasser mes pieds »
  rationale: La formulation retenue conserve la nuance intensive ou répétée du verbe sans déterminer davantage la motivation intérieure de la femme.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe conserve le contraste rhétorique du grec. « Couvrir de baisers » rend l’intensité de καταφιλέω tout en restant accessible.
