  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς ἐπορεύετο σὺν αὐτοῖς. ἤδη δὲ αὐτοῦ οὐ μακρὰν ἀπέχοντος ἀπὸ τῆς οἰκίας ἔπεμψεν ⸂φίλους ὁ ἑκατοντάρχης⸃ λέγων αὐτῷ· Κύριε, μὴ σκύλλου, οὐ γὰρ ⸂ἱκανός εἰμι⸃ ἵνα ὑπὸ τὴν στέγην μου εἰσέλθῃς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/006.yaml
  text: So Jesus went with them[a]. But when he was already not far from the house, the centurion sent friends, saying to him, “Lord, do not trouble yourself[b], for I am not worthy that you should come under my roof.”
translation:
  language: fr
  text: 'Jésus faisait route avec eux. Mais alors qu’il se trouvait déjà non loin de la maison, le centurion envoya des amis lui dire : « Seigneur[a], ne te donne pas cette peine, car je ne suis pas digne[b] que tu entres sous mon toit. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Monsieur ». Le grec κύριε (« Seigneur ») peut servir de formule respectueuse et peut aussi exprimer ici la reconnaissance de l’autorité de Jésus.
    reason: alternative_reading
  - marker: b
    text: Ou « apte » ou « qualifié ». Le terme grec peut désigner l’aptitude, la capacité ou la dignité ; ici, il exprime l’humilité du centurion devant Jésus.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπορεύετο σὺν αὐτοῖς
  choice: faisait route avec eux
  rationale: L’imparfait décrit le déplacement en cours de Jésus, tandis que « avec eux » conserve explicitement l’idée d’accompagnement.
- source_word: ἤδη ... οὐ μακρὰν ἀπέχοντος ἀπὸ τῆς οἰκίας
  choice: alors qu’il n’était déjà plus très loin de la maison
  rationale: Cette formulation naturelle rend la circonstance temporelle du génitif absolu et préserve la tournure négative « pas loin » du grec.
- source_word: ἔπεμψεν φίλους ὁ ἑκατοντάρχης
  choice: le centurion envoya des amis
  rationale: « Centurion » est le terme français précis et usuel pour ce grade romain; « des amis » rend le pluriel indéfini φίλους sans ajout interprétatif.
- source_word: μὴ σκύλλου
  choice: ne te donne pas cette peine
  rationale: Expression française courante et respectueuse qui restitue l’idée de ne pas s’imposer un dérangement ou une peine.
- source_word: ἱκανός εἰμι
  choice: je ne suis pas digne
  rationale: Dans ce contexte, ἱκανός exprime l’inadéquation personnelle ou l’indignité du centurion devant Jésus; « digne » rend naturellement cette humilité tout en signalant en note la nuance d’aptitude.
- source_word: ὑπὸ τὴν στέγην μου
  choice: sous mon toit
  rationale: La formulation conserve l’image concrète et idiomatique du grec plutôt que de la réduire à « dans ma maison ».
theological_decisions:
- issue: Sens de Κύριε dans l’adresse faite à Jésus
  choice: Seigneur
  alternative: Monsieur / Maître
  rationale: « Seigneur » préserve la portée possible du titre et la reconnaissance de l’autorité de Jésus, sans imposer au centurion une confession christologique pleinement développée; la note maintient la possibilité d’une simple adresse respectueuse.
translation_notes:
  register: Français international moderne, naturel et digne. Le récit reste fluide, tandis que « sous mon toit » conserve l’image du texte source. Le tutoiement correspond à l’adresse directe au singulier et à l’usage biblique français courant.
