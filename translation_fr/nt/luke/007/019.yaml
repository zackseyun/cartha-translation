    rationale: Le grec porte simplement ἄλλον προσδοκῶμεν, « devons-nous attendre un autre ? ». Le pronom « en » suggère en français un ensemble ou une catégorie sous-entendue et n’a pas de correspondant nécessaire dans le texte source.
