  source_fidelity: Le texte rend correctement l’envoi de deux messagers implicites dans le contexte immédiat, la destination (« auprès du Seigneur »), la question directe, ainsi que la désignation volontairement ouverte ὁ ἐρχόμενος par « celui qui vient ». « Seigneur » est fidèle à κύριον. En revanche, le pronom « en » dans « en attendre un autre » introduit une reprise catégorielle qui n’est pas exprimée par le grec et alourdit inutilement la question.
  naturalness: Le français est globalement fluide et de registre approprié. « Devons-nous attendre un autre ? » est plus idiomatique et plus direct que « devons-nous en attendre un autre ? ». « Pour lui demander » rend naturellement la fonction du participe λέγων dans le cadre de l’envoi des messagers.
  terminology: « Seigneur » respecte la valeur de κύριος dans le récit. « Celui qui vient » conserve la forme participiale et n’impose pas dans le texte une interprétation messianique plus explicite que le grec; la note peut signaler sa possible valeur titulaire.
  issues:
