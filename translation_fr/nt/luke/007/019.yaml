id: LUK.7.19
reference: Luke 7:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἔπεμψεν πρὸς τὸν ⸀κύριον λέγων· Σὺ εἶ ὁ ἐρχόμενος ἢ ⸀ἄλλον προσδοκῶμεν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/019.yaml
  text: He sent to the Lord, saying, “Are you the Coming One, or should we expect another?”
translation:
  language: fr
  text: 'Il les envoya auprès du Seigneur pour lui demander : « Es-tu celui qui vient[a], ou devons-nous attendre un autre ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’expression grecque peut aussi se comprendre comme un titre : « Celui qui vient », c’est-à-dire la personne attendue.'
    reason: Signaler que le participe substantivé peut avoir une valeur messianique titulaire tout en conservant sa formulation descriptive.
lexical_decisions:
- source_word: ἔπεμψεν
  choice: Il les envoya
  rationale: L’aoriste exprime une action narrative passée. Le pronom « les », repris du contexte immédiat où Jean appelle deux de ses disciples, est nécessaire à la fluidité du français sans modifier le référent.
- source_word: πρὸς τὸν κύριον
  choice: auprès du Seigneur
  rationale: πρός avec l’accusatif indique ici le mouvement vers une personne. « Seigneur » conserve le titre respectueux et la portée christologique de κύριος dans le récit de Luc.
- source_word: λέγων
  choice: pour lui dire
  rationale: Le participe introduit le contenu du message transmis. Cette formulation française évite de laisser entendre maladroitement que Jean s’est lui-même rendu auprès de Jésus.
- source_word: Σὺ εἶ
  choice: Es-tu
  rationale: La forme déclarative grecque prend naturellement la syntaxe interrogative en français dans cette question directe.
- source_word: ὁ ἐρχόμενος
  choice: celui qui vient
  rationale: Cette traduction suit de près le participe présent substantivé et reste naturelle. Le contexte permet d’y reconnaître une désignation messianique sans que la traduction impose à elle seule cette lecture.
- source_word: ἄλλον
  choice: un autre
  rationale: Rend directement l’adjectif substantivé masculin, dont le référent humain est clair.
- source_word: προσδοκῶμεν
  choice: devons-nous en attendre
  rationale: Le présent exprime une attente en cours; la tournure délibérative « devons-nous » convient à la question. Le pronom « en » reprend naturellement la catégorie de personne attendue.
theological_decisions:
- issue: Traduction de κύριος comme titre de Jésus
  choice: Seigneur
  alternative: maître
  rationale: « Seigneur » conserve à la fois la valeur honorifique du terme et son poids christologique possible dans Luc, sans réduire le titre à une simple relation maître-disciple.
- issue: Valeur de ὁ ἐρχόμενος
  choice: celui qui vient
  alternative: Celui qui doit venir
  rationale: Le grec est un participe présent substantivé pouvant être descriptif ou fonctionner comme un titre messianique reconnu. « Celui qui vient » préserve cette tension; la note signale la portée titulaire possible sans l’imposer par une explicitation dans le texte.
translation_notes:
  register: Français international moderne, digne et oralement fluide. La formulation évite le calque lourd « disant » et garde la question directe, concise et solennelle.
