id: LUK.7.47
reference: Luke 7:47
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὗ χάριν, λέγω σοι, ἀφέωνται αἱ ἁμαρτίαι αὐτῆς αἱ πολλαί, ὅτι ἠγάπησεν πολύ· ᾧ δὲ ὀλίγον ἀφίεται, ὀλίγον ἀγαπᾷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/047.yaml
  text: For this reason I tell you[a], her many sins have been forgiven, because she loved much. But the one who is forgiven little loves little.
translation:
  language: fr
  text: C’est pourquoi, je te le dis, ses nombreux péchés ont été pardonnés, parce qu’elle a beaucoup aimé.[a] Mais celui à qui l’on pardonne peu aime peu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « c’est pourquoi elle a beaucoup aimé ». La conjonction grecque peut être comprise de façon à présenter son grand amour comme la preuve qu’elle a été pardonnée, plutôt que comme la cause de son pardon.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὗ χάριν
  choice: C’est pourquoi
  rationale: Expression idiomatique qui conserve la valeur causale ou déductive du lien avec ce qui précède.
- source_word: ἀφέωνται
  choice: ont été pardonnés
  rationale: Le parfait passif exprime un acte accompli dont le résultat demeure; le passé composé français le rend naturellement.
- source_word: ἁμαρτίαι αὐτῆς αἱ πολλαί
  choice: ses nombreux péchés
  rationale: Formulation française naturelle qui garde l’idée du grand nombre de ses péchés.
- source_word: ὅτι
  choice: parce que
  rationale: Rend directement la valeur causale possible de la conjonction sans effacer la tension créée par la parabole précédente.
- source_word: ἠγάπησεν πολύ
  choice: elle a beaucoup aimé
  rationale: Le passé composé convient naturellement au récit français et préserve le verbe « aimer » ainsi que l’intensité de πολύ.
- source_word: ᾧ δὲ ὀλίγον ἀφίεται
  choice: Mais celui à qui l’on pardonne peu
  rationale: La tournure impersonnelle française exprime clairement le passif et le relatif singulier générique.
- source_word: ὀλίγον ἀγαπᾷ
  choice: aime peu
  rationale: Maintient le parallélisme concis entre le peu de pardon et le peu d’amour.
theological_decisions:
- issue: Le rapport entre l’amour de la femme et le pardon de ses péchés
  choice: Conserver « parce qu’elle a beaucoup aimé » dans le texte principal.
  alternative: Comprendre la proposition au sens de « c’est pourquoi elle a beaucoup aimé », son amour manifestant qu’elle est pardonnée.
  rationale: Le grec ὅτι permet la lecture causale directe, tandis que la parabole et le contexte peuvent présenter l’amour comme le signe ou le fruit du pardon. La traduction et la note préservent cette tension sans faire de l’amour un mérite qui gagnerait le pardon.
translation_notes:
  register: Français international moderne, digne et accessible. « C’est pourquoi » et « je te le dis » gardent la force du raisonnement et de l’adresse personnelle; le parallélisme final reste bref et proverbial.
