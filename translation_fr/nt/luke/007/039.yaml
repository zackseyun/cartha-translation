source:
  edition: SBLGNT
  text: ἰδὼν δὲ ὁ Φαρισαῖος ὁ καλέσας αὐτὸν εἶπεν ἐν ἑαυτῷ λέγων· Οὗτος εἰ ⸀ἦν προφήτης, ἐγίνωσκεν ἂν τίς καὶ ποταπὴ ἡ γυνὴ ἥτις ἅπτεται αὐτοῦ, ὅτι ἁμαρτωλός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/039.yaml
  text: When the Pharisee who had invited him saw this[a], he said to himself, “If this man were a prophet, he would know who and what sort of woman this is who is touching him[b], because she is a sinner.”
translation:
  language: fr
  text: 'Quand le pharisien qui l’avait invité vit cela, il se dit : « Si cet homme était prophète, il saurait qui est cette femme qui le touche, et de quel genre de femme il s’agit[a], car c’est une pécheresse[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression grecque souligne à la fois l’identité de cette femme et le genre de personne qu’elle est, notamment sa conduite ou sa réputation.
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « il saurait… qu’elle est une pécheresse ». Le grec peut présenter cette proposition soit comme ce qu’il saurait, soit comme la raison du jugement porté sur elle.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν δὲ
  choice: Quand … vit cela
  rationale: Le participe aoriste exprime ici la circonstance temporelle de la parole qui suit. « Cela » reprend naturellement, en français, l’action décrite juste avant. δέ assure la progression du récit sans exiger un connecteur explicite.
- source_word: ὁ Φαρισαῖος ὁ καλέσας αὐτόν
  choice: le pharisien qui l’avait invité
  rationale: Dans le contexte d’un repas, καλέω signifie « inviter ». Le plus-que-parfait marque clairement l’antériorité de l’invitation.
- source_word: εἶπεν ἐν ἑαυτῷ λέγων
  choice: il se dit
  rationale: Cette formulation française naturelle rend le discours intérieur sans reproduire lourdement le doublet « dit… disant ».
- source_word: Οὗτος
  choice: cet homme
  rationale: Le démonstratif désigne Jésus avec une certaine distance; « cet homme » restitue ce ton mieux que le simple pronom « celui-ci ».
- source_word: εἰ ἦν προφήτης, ἐγίνωσκεν ἂν
  choice: Si cet homme était prophète, il saurait
  rationale: L’imparfait avec εἰ, suivi de l’imparfait avec ἄν, forme une condition irréelle reflétant le scepticisme du pharisien.
- source_word: τίς καὶ ποταπὴ
  choice: qui est … et quel genre de femme elle est
  rationale: Les deux interrogatifs portent respectivement sur l’identité de la femme et sur sa nature, sa conduite ou sa réputation. La formulation est réorganisée pour être claire et naturelle en français tout en conservant les deux éléments.
- source_word: ἥτις ἅπτεται αὐτοῦ
  choice: la femme qui le touche
  rationale: Le présent ἅπτεται présente le contact comme en cours dans la scène. « Touche » est plus naturel ici que « est en train de toucher ».
- source_word: ὅτι ἁμαρτωλός ἐστιν
  choice: car c’est une pécheresse
  rationale: ὅτι peut introduire ici la raison du jugement formulé par le pharisien. « Pécheresse » conserve le caractère catégorisant de ἁμαρτωλός.
theological_decisions:
- issue: Valeur de la condition concernant le statut prophétique de Jésus
  choice: 'Condition irréelle : « Si cet homme était prophète, il saurait… »'
  alternative: 'Condition plus ouverte : « Si cet homme est prophète, il doit savoir… »'
  rationale: La construction grecque εἰ ἦν … ἐγίνωσκεν ἂν présente naturellement l’hypothèse comme contraire à ce que le pharisien croit. La traduction transmet son jugement sans le valider.
- issue: Rapport de ὅτι ἁμαρτωλός ἐστιν avec la proposition précédente
  choice: 'Valeur causale : « car c’est une pécheresse »'
  alternative: 'Valeur complétive : « il saurait… qu’elle est une pécheresse »'
  rationale: Les deux analyses sont possibles. Le texte principal retient la valeur causale, tandis que la note préserve explicitement l’autre lecture.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. « Pharisien », « prophète » et « pécheresse » conservent le vocabulaire religieux nécessaire. La syntaxe grecque est légèrement réorganisée afin de rendre clairement le double accent sur l’identité et la réputation de la femme.
