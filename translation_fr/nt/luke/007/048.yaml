  text: εἶπεν δὲ αὐτῇ· Ἀφέωνταί σου αἱ ἁμαρτίαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/048.yaml
  text: Then he said to her[a], “Your sins are forgiven.”
translation:
  language: fr
  text: 'Puis il lui dit : « Tes péchés sont pardonnés[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de manière plus formelle : « Tes péchés ont été pardonnés. » Le parfait passif grec peut souligner l’acte accompli et le résultat qui demeure.'
    reason: alternative lexicale et valeur aspectuelle du parfait grec
lexical_decisions:
- source_word: εἶπεν
  choice: il dit
  rationale: L’aoriste de λέγω se rend naturellement par le passé simple dans ce récit écrit et dans cette brève formule introductive.
- source_word: δὲ
  choice: Puis
  rationale: Ici, δέ est un connecteur léger qui fait progresser le récit, sans marquer une opposition forte.
- source_word: αὐτῇ
  choice: lui
  rationale: Le datif féminin singulier désigne la femme comme destinataire des paroles ; le pronom indirect « lui » est naturel en français.
- source_word: Ἀφέωνταί
  choice: sont pardonnés
  rationale: Le parfait passif de ἀφίημι présente un pardon accompli dont le résultat demeure. « Sont pardonnés » exprime naturellement l’état présent sans exclure l’acte antérieur.
- source_word: σου
  choice: tes
  rationale: Le génitif de la deuxième personne du singulier se rend normalement par le déterminant possessif « tes ».
- source_word: αἱ ἁμαρτίαι
  choice: péchés
  rationale: Dans ce contexte, ἁμαρτίαι désigne les fautes morales devant Dieu. L’article grec n’est pas reproduit séparément puisque le français emploie le possessif « tes ».
theological_decisions:
- issue: Valeur du parfait passif Ἀφέωνταί dans la déclaration de pardon
  choice: « Tes péchés sont pardonnés »
  alternative: « Tes péchés ont été pardonnés »
  rationale: Le parfait grec peut mettre en relief soit l’acte accompli, soit l’état qui en résulte. La formulation retenue exprime clairement l’état présent de pardon tout en laissant entendre qu’un acte de pardon a eu lieu, sans préciser davantage son moment ou son agent.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple convient à la narration biblique écrite sans rendre la phrase archaïque ; la parole directe reste simple et immédiatement compréhensible.
