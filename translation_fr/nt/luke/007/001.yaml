source:
  edition: SBLGNT
  text: ⸀Ἐπειδὴ ἐπλήρωσεν πάντα τὰ ῥήματα αὐτοῦ εἰς τὰς ἀκοὰς τοῦ λαοῦ, εἰσῆλθεν εἰς Καφαρναούμ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/001.yaml
  text: When he had finished all his words in the hearing of the people[a], he entered Capernaum.
translation:
  language: fr
  text: Quand il eut achevé d’adresser toutes ses paroles au peuple, il entra dans Capharnaüm.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐπειδὴ
  choice: Quand
  rationale: La conjonction introduit ici une proposition temporelle liée à la suite du récit, et non une cause.
- source_word: ἐπλήρωσεν
  choice: eut achevé de prononcer
  rationale: Avec « paroles », le verbe signifie ici mener à son terme l'acte de parler. Le passé antérieur marque naturellement en français l'action achevée avant l'entrée dans Capharnaüm.
- source_word: πάντα τὰ ῥήματα αὐτοῦ
  choice: toutes ces paroles
  rationale: « Paroles » rend directement ῥήματα, tandis que « ces » renvoie naturellement au discours qui précède; le possessif grec a une valeur référentielle que le français exprime ici plus idiomatiquement par le démonstratif.
- source_word: εἰς τὰς ἀκοὰς τοῦ λαοῦ
  choice: devant le peuple
  rationale: L'expression grecque signifie littéralement que ses paroles sont parvenues aux oreilles du peuple. « Devant le peuple » conserve l'idée d'une proclamation publique dans un français naturel.
- source_word: λαοῦ
  choice: le peuple
  rationale: « Peuple » garde la portée collective de λαός sans la réduire à une simple foule.
- source_word: εἰσῆλθεν
  choice: il entra
  rationale: Traduction directe et naturelle de l'aoriste narratif.
- source_word: Καφαρναούμ
  choice: Capharnaüm
  rationale: Forme française biblique usuelle du nom de lieu.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. La formulation reste proche de la structure grecque tout en évitant le calque peu naturel « aux oreilles du peuple ».
