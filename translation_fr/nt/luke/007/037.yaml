revisions:
- from: Et voici qu’une femme de la ville, qui était pécheresse[a], apprit qu’il était à table dans la maison du pharisien[b]. Elle apporta un flacon d’albâtre rempli de parfum[c].
  to: Et voici qu’une femme qui se trouvait dans la ville, une pécheresse[a], ayant appris qu’il était à table[b] dans la maison du pharisien, apporta un flacon d’albâtre contenant du parfum[c].
  rationale: La révision préserve la localisation non interprétée de la femme (« dans la ville »), rétablit une articulation française qui reflète l’antériorité de ἐπιγνοῦσα, et rattache chaque note au mot ou à l’expression qu’elle éclaire. Elle ne spécifie ni le péché de la femme ni son identité sociale.
