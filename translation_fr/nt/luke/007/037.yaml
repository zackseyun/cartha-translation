id: LUK.7.37
reference: Luke 7:37
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ γυνὴ ⸂ἥτις ἦν ἐν τῇ πόλει⸃ ἁμαρτωλός, ⸀καὶ ἐπιγνοῦσα ὅτι ⸀κατάκειται ἐν τῇ οἰκίᾳ τοῦ Φαρισαίου, κομίσασα ἀλάβαστρον μύρου
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/037.yaml
  text: And behold[a], a woman in the city, who was a sinner, having learned that he was reclining at table in the Pharisee’s house[c][b], brought an alabaster jar of perfume.
translation:
  language: fr
  text: Et voici qu’une femme qui se trouvait dans la ville, une pécheresse[a], ayant appris qu’il était à table[b] dans la maison du pharisien, apporta un flacon d’albâtre contenant du parfum[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec dit simplement « pécheresse » et ne précise pas la nature de son péché.
    reason: lexical_alternative
  - marker: b
    text: Lors d’un repas formel, les convives prenaient habituellement place allongés autour de la table.
    reason: cultural_note
  - marker: c
    text: 'Ou : « un flacon d’albâtre contenant une huile parfumée ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: voici que
  rationale: Conserve la fonction narrative de ἰδοὺ, qui attire vivement l’attention sur l’entrée inattendue de la femme, dans un français naturel et digne.
- source_word: ἥτις ἦν ἐν τῇ πόλει
  choice: de la ville
  rationale: Dans ce contexte, la tournure idiomatique désigne une femme appartenant au cadre urbain déjà évoqué. « De la ville » reste sobre sans préciser qu’elle y habitait ni qu’elle y était connue.
- source_word: ἁμαρτωλός
  choice: qui était pécheresse
  rationale: Reproduit la caractérisation explicite de la femme sans préciser la nature de son péché ni reprendre l’identification traditionnelle, mais non exprimée, à une prostituée.
- source_word: ἐπιγνοῦσα
  choice: apprit
  rationale: Exprime l’acquisition préalable de l’information. La coordination en deux phrases est naturelle en français tout en maintenant l’antériorité par rapport à son geste.
- source_word: κατάκειται
  choice: était à table
  rationale: Rend idiomatiquement le contexte de repas. Une note conserve l’information culturelle selon laquelle les convives mangeaient en position allongée.
- source_word: οἰκίᾳ τοῦ Φαρισαίου
  choice: la maison du pharisien
  rationale: Traduction directe et naturelle du génitif, avec la désignation du membre du groupe religieux en minuscule selon l’usage français.
- source_word: κομίσασα
  choice: elle apporta
  rationale: Rend clairement le mouvement consistant à apporter l’objet; le participe grec est transformé en verbe principal dans une seconde phrase pour éviter une construction française lourde.
- source_word: ἀλάβαστρον μύρου
  choice: un flacon d’albâtre rempli de parfum
  rationale: ἀλάβαστρον désigne un petit récipient, traditionnellement en albâtre, et μύρον une substance aromatique. « Flacon » convient mieux à un parfum que « jarre », tandis que « rempli de » explicite naturellement la relation de contenu.
theological_decisions:
- issue: Caractérisation morale de la femme
  choice: qui était pécheresse
  alternative: une prostituée / une femme de mauvaise vie
  rationale: Le grec ἁμαρτωλός la qualifie de pécheresse sans identifier son péché. La traduction ne reprend donc pas une identification traditionnelle non énoncée dans le texte.
- issue: Lien de la femme avec la ville
  choice: une femme de la ville
  alternative: une femme qui se trouvait dans la ville / une femme qui habitait la ville
  rationale: L’expression grecque permet une formulation générale. La traduction évite d’affirmer plus précisément qu’elle y résidait ou qu’elle y était notoirement connue.
translation_notes:
  register: Français international moderne, fluide et digne. « Voici que » conserve la vivacité narrative sans archaïsme excessif. La division en deux phrases évite l’empilement de participes et clarifie l’action, sans modifier sa succession. Les notes signalent le sens non spécifié de « pécheresse », la posture antique au repas et l’étendue sémantique de μύρον.
