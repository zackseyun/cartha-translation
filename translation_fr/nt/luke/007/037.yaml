  naturalness: La phrase révisée demeure fluide en français international moderne. « Une pécheresse » rend de façon directe le substantif grec ἁμαρτωλός, sans présumer de la nature du péché. « Contenant du parfum » explicite sobrement le rapport du récipient à son contenu, inhérent à ἀλάβαστρον μύρου.
  terminology: « Pharisien » et « pécheresse » sont appropriés. « Flacon d’albâtre » est un rendu accessible de ἀλάβαστρον; « parfum » convient à μύρον dans ce contexte. Les ancres sont replacées sur les expressions qu’elles expliquent.
