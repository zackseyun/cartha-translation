source:
  edition: SBLGNT
  text: ἀκούσας δὲ ταῦτα ὁ Ἰησοῦς ἐθαύμασεν αὐτόν, καὶ στραφεὶς τῷ ἀκολουθοῦντι αὐτῷ ὄχλῳ εἶπεν· Λέγω ὑμῖν, ⸀οὐδὲ ἐν τῷ Ἰσραὴλ τοσαύτην πίστιν εὗρον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/009.yaml
  text: When Jesus heard these things[a], he marveled at him, and turning to the crowd following him, he said, “I tell you[b], not even in Israel have I found such faith.”
translation:
  language: fr
  text: 'En entendant cela, Jésus fut étonné de lui. Puis il se tourna vers la foule qui le suivait et dit : « Je vous le dis : je n’ai trouvé une telle foi[a] pas même en Israël. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « une foi aussi grande ». Le mot grec peut aussi être traduit par « confiance ».'
    reason: La note préserve à la fois la nuance intensive possible de τοσαύτην et la portée concrète de πίστις dans le contexte.
lexical_decisions:
- source_word: ἀκούσας δὲ ταῦτα
  choice: En entendant cela
  rationale: Le participe aoriste situe l’écoute avant la réaction de Jésus. « Cela » reprend naturellement en français l’ensemble des paroles rapportées, tandis que δέ sert ici de transition narrative légère et n’exige pas de connecteur distinct.
- source_word: ἐθαύμασεν αὐτόν
  choice: s’étonna de lui
  rationale: θαυμάζω exprime l’étonnement ou l’admiration. Cette formulation française rend sobrement la réaction de Jésus, et le pronom renvoie au centurion.
- source_word: στραφεὶς
  choice: Puis il se tourna
  rationale: Le participe aoriste marque l’action suivante. Une proposition coordonnée avec « Puis » est plus naturelle en français qu’une construction participiale lourde.
- source_word: τῷ ἀκολουθοῦντι αὐτῷ ὄχλῳ
  choice: vers la foule qui le suivait
  rationale: Le participe présent indique une action en cours; l’imparfait français restitue naturellement cette continuité.
- source_word: Λέγω ὑμῖν
  choice: Je vous le dis
  rationale: Formule directe et idiomatique en français moderne, qui conserve la solennité de l’affirmation.
- source_word: οὐδὲ ἐν τῷ Ἰσραὴλ
  choice: même en Israël, je n’ai pas
  rationale: 'Avec la négation verbale, « même en Israël » exprime naturellement la valeur intensive de οὐδέ : « pas même en Israël ».'
- source_word: τοσαύτην πίστιν
  choice: une telle foi
  rationale: τοσαύτην souligne le degré remarquable de la πίστις. « Une telle foi » reste proche du grec et naturel en français; « une foi aussi grande » est signalé en note.
- source_word: εὗρον
  choice: je n’ai pas trouvé
  rationale: Le passé composé rend idiomatiquement l’aoriste dans ce constat portant sur l’expérience de Jésus jusqu’à ce moment.
theological_decisions:
- issue: Traduction de πίστις
  choice: foi
  alternative: confiance
  rationale: Dans ce contexte, le mot désigne la confiance du centurion dans l’autorité de Jésus. « Foi » conserve toutefois le terme théologique courant sans exclure cette dimension de confiance; l’alternative est indiquée en note.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe narrative a été légèrement dépliée pour éviter une succession pesante de participes, sans modifier l’ordre des actions ni atténuer l’étonnement attribué à Jésus.
