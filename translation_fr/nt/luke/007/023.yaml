    issue: La formulation principale affaiblit la valeur passive/causative de σκανδαλισθῇ.
    rationale: « Qui ne trébuche pas » décrit avant tout l’action ou l’état de la personne. Le grec désigne la personne qui n’est pas amenée à trébucher, c’est-à-dire qui ne fait pas de Jésus une occasion de chute.
  - severity: low
    issue: « À cause de moi » est moins précis que l’idiome grec ἐν ἐμοί.
    rationale: Dans ce contexte, Jésus est l’objet ou l’occasion par rapport auquel survient le scandale; « pour qui je ne suis pas une occasion de chute » rend cette relation sans suggérer indûment une causalité directe.
