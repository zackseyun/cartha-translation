id: LUK.7.23
reference: Luke 7:23
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ μακάριός ἐστιν ὃς ἐὰν μὴ σκανδαλισθῇ ἐν ἐμοί.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/023.yaml
  text: And blessed is the one who is not caused to stumble by me[a].
translation:
  language: fr
  text: Et heureux est celui pour qui je ne suis pas une occasion de chute[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qui ne prend pas ombrage de moi » ou « qui ne se détourne pas à cause de moi ».
    reason: 'Alternative lexicale : le verbe grec peut désigner le fait de se scandaliser, de trébucher ou d’en venir à abandonner.'
lexical_decisions:
- source_word: μακάριος
  choice: heureux
  rationale: Dans une béatitude, « heureux » est la formulation française naturelle et consacrée ; elle exprime la faveur de Dieu sans réduire le terme à une émotion passagère.
- source_word: ὃς ἐὰν μή
  choice: celui qui ne
  rationale: Cette tournure rend naturellement en français la relative substantive et la condition générale, tout en conservant la valeur représentative du singulier.
- source_word: σκανδαλισθῇ
  choice: trébuche
  rationale: Le verbe grec évoque le fait de rencontrer une occasion de chute. « Trébuche » conserve cette image, tandis que « s’offense » risquerait aujourd’hui de suggérer une simple susceptibilité.
- source_word: ἐν ἐμοί
  choice: à cause de moi
  rationale: Dans cet emploi idiomatique, la préposition désigne Jésus comme l’occasion possible de la chute. « À cause de moi » est clair et naturel en français, sans l’obscurité de « en moi ».
theological_decisions:
- issue: Portée de la réaction négative envers Jésus
  choice: Conserver l’image de la chute avec « ne trébuche pas à cause de moi »
  alternative: « ne s’offense pas de moi » ou « ne se détourne pas à cause de moi »
  rationale: Le texte peut englober le fait de prendre ombrage de Jésus et celui d’en venir à abandonner la foi. L’image de la chute maintient cette tension sans la réduire à une offense émotionnelle ni l’identifier explicitement à l’apostasie.
- issue: Valeur du passif σκανδαλισθῇ
  choice: Employer en français une tournure intransitive naturelle
  alternative: « n’est pas amené à trébucher par moi »
  rationale: La tournure passive littérale serait lourde et pourrait faire de Jésus l’agent direct de la chute. « À cause de moi » conserve l’idée que Jésus en est l’occasion, tout en restant idiomatique.
translation_notes:
  register: Français international moderne, simple et digne. La formule « Et heureux celui… » garde le lien exprimé par καί avec la déclaration précédente. Le point d’exclamation convient au caractère solennel de la béatitude sans en modifier le sens.
