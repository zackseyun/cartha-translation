  source_fidelity: Le sens général est bien visé, mais « ne trébuche pas à cause de moi » rend σκανδαλισθῇ comme un simple intransitif et « à cause de moi » peut présenter Jésus comme une cause directe plutôt que comme l’occasion de la chute. Une formulation centrée sur « occasion de chute » conserve mieux l’image et la valeur occasionnelle de ἐν ἐμοί.
  naturalness: « Et heureux est celui pour qui je ne suis pas une occasion de chute » est une formulation française moderne, claire et digne. Elle évite une construction passive lourde tout en exprimant naturellement l’effet potentiel de Jésus sur la personne.
  terminology: « Heureux » est idiomatique dans une béatitude et peut être conservé. « Occasion de chute » maintient le champ sémantique de σκανδαλίζω sans le réduire à la susceptibilité (« s’offenser ») ni à l’apostasie (« se détourner »).
  issues:
