source:
  edition: SBLGNT
  text: Ἀπελθόντων δὲ τῶν ἀγγέλων Ἰωάννου ἤρξατο λέγειν ⸂πρὸς τοὺς ὄχλους⸃ περὶ Ἰωάννου· Τί ⸀ἐξήλθατε εἰς τὴν ἔρημον θεάσασθαι; κάλαμον ὑπὸ ἀνέμου σαλευόμενον;
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/024.yaml
  text: 'After John''s messengers had gone away[a], he began to speak to the crowds about John: “What did you go out into the wilderness to look at? A reed shaken by the wind?”'
translation:
  language: fr
  text: 'Après le départ des messagers de Jean, Jésus se mit à parler aux foules de Jean : « Qu’êtes-vous allés voir dans le désert ? Un roseau agité par le vent ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀπελθόντων
  choice: Après le départ
  rationale: Le participe aoriste dans le génitif absolu exprime ici une circonstance temporelle antérieure au début du discours.
- source_word: ἀγγέλων
  choice: messagers
  rationale: Dans ce contexte, il s’agit des envoyés humains de Jean, et non d’anges.
- source_word: ἤρξατο λέγειν
  choice: Jésus se mit à parler
  rationale: « Se mit à parler » conserve la valeur inchoative de la construction. Le nom « Jésus » explicite naturellement le sujet implicite en français sans modifier le référent.
- source_word: πρὸς τοὺς ὄχλους
  choice: aux foules
  rationale: Le pluriel grec est conservé, et « aux » rend naturellement πρός avec un verbe de parole.
- source_word: περὶ Ἰωάννου
  choice: de Jean
  rationale: Avec « parler », la tournure française naturelle « parler de Jean » rend περί suivi du génitif.
- source_word: Τί ἐξήλθατε
  choice: Qu’êtes-vous allés
  rationale: τί interroge l’objet que les auditeurs sont allés voir plutôt que la cause de leur déplacement.
- source_word: εἰς τὴν ἔρημον
  choice: dans le désert
  rationale: « Désert » désigne naturellement en français la région inhabitée ou peu habitée liée au ministère de Jean.
- source_word: θεάσασθαι
  choice: contempler
  rationale: Le verbe évoque le fait de regarder ou d’observer attentivement; « contempler » restitue cette nuance sans lourdeur.
- source_word: κάλαμον
  choice: un roseau
  rationale: Le référent concret est un roseau, image qui suggère la fragilité ou l’instabilité sans les expliciter.
- source_word: ὑπὸ ἀνέμου σαλευόμενον
  choice: agité par le vent
  rationale: Cette formulation française vive et idiomatique conserve l’image d’un roseau mis en mouvement par le vent.
theological_decisions:
- issue: Portée métaphorique de la question rhétorique au sujet de Jean
  choice: 'Conserver l’image littérale : « Un roseau agité par le vent ? »'
  alternative: Expliciter par « Un homme faible ou changeant ? »
  rationale: Le texte laisse les auditeurs déduire la portée de l’image. La traduction ne doit pas résoudre cette tension par une paraphrase interprétative.
translation_notes:
  register: Français international moderne, naturel et digne. La structure interrogative reste concise et rhétorique. Aucun archaïsme ni vocabulaire confessionnel particulier.
