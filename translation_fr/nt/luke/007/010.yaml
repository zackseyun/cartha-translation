id: LUK.7.10
reference: Luke 7:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ὑποστρέψαντες ⸂εἰς τὸν οἶκον οἱ πεμφθέντες⸃ εὗρον ⸀τὸν δοῦλον ὑγιαίνοντα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/010.yaml
  text: And when those who had been sent returned to the house[a], they found the servant healthy.
translation:
  language: fr
  text: Quand ceux qui avaient été envoyés revinrent à la maison, ils trouvèrent l’esclave[a] en bonne santé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « serviteur ». Le mot grec doulos peut désigner un esclave ou, selon le contexte, un serviteur.
    reason: Signaler l’étendue sémantique de δοῦλος et conserver une autre traduction courante.
lexical_decisions:
- source_word: ὑποστρέψαντες
  choice: quand … revinrent
  rationale: Le participe aoriste exprime ici une circonstance temporelle antérieure au verbe principal. Cette tournure restitue naturellement la succession des actions.
- source_word: εἰς τὸν οἶκον
  choice: à la maison
  rationale: εἰς suivi de l’accusatif indique un mouvement vers un lieu. « À la maison » garde le lieu concret sans imposer l’idée que c’était le domicile des envoyés.
- source_word: οἱ πεμφθέντες
  choice: ceux qui avaient été envoyés
  rationale: Cette formulation conserve la voix passive du participe aoriste substantivé sans ajouter le nom interprétatif « messagers ».
- source_word: εὗρον
  choice: ils trouvèrent
  rationale: Rendu narratif direct et courant de εὑρίσκω.
- source_word: τὸν δοῦλον
  choice: l’esclave
  rationale: Dans le cadre social d’un centurion exerçant son autorité sur cet homme, « esclave » exprime plus précisément le statut impliqué par δοῦλος que le terme plus large « serviteur ».
- source_word: ὑγιαίνοντα
  choice: en bonne santé
  rationale: Le participe présent de ὑγιαίνω décrit l’état de quelqu’un qui se porte bien. « En bonne santé » évite d’introduire explicitement « guéri », même si la guérison ressort du contexte.
theological_decisions:
- issue: Rendu de δοῦλος dans le récit de guérison
  choice: esclave
  alternative: serviteur
  rationale: Le texte grec désigne un statut de dépendance qui peut être atténué par « serviteur ». « Esclave » préserve cette réalité sociale, tandis qu’une note signale le rendu traditionnel possible sans trancher au-delà du contexte.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au récit écrit; la phrase reste claire pour un lectorat général. Le marqueur de note est placé après « l’esclave », le mot auquel la note se rapporte.
