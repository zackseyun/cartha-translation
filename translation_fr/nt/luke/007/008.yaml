id: LUK.7.8
reference: Luke 7:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ γὰρ ἐγὼ ἄνθρωπός εἰμι ὑπὸ ἐξουσίαν τασσόμενος, ἔχων ὑπ’ ἐμαυτὸν στρατιώτας, καὶ λέγω τούτῳ· Πορεύθητι, καὶ πορεύεται, καὶ ἄλλῳ· Ἔρχου, καὶ ἔρχεται, καὶ τῷ δούλῳ μου· Ποίησον τοῦτο, καὶ ποιεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/008.yaml
  text: For I too am a man placed under authority[a], with soldiers under me; and I say to this one, ‘Go,’ and he goes; and to another, ‘Come,’ and he comes; and to my servant, ‘Do this,’ and he does it.
translation:
  language: fr
  text: 'Car moi aussi, je suis un homme placé sous une autorité, avec des soldats sous mes ordres. Je dis à l’un : « Va ! » et il va ; à un autre : « Viens ! » et il vient ; et à mon esclave[a] : « Fais ceci ! » et il le fait.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « serviteur ». Le grec doulos désigne une personne de condition servile, juridiquement dépendante ou appartenant à un maître, mais peut dans certains contextes se traduire plus généralement par « serviteur ».
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ γὰρ
  choice: Car
  rationale: La conjonction introduit l’explication donnée par le centurion. « Car » restitue naturellement cette valeur justificative sans alourdir la phrase.
- source_word: ἐγὼ
  choice: moi aussi, je
  rationale: Le pronom grec est explicite et emphatique. La tournure française « moi aussi, je » conserve à la fois l’insistance et la comparaison portée par καί.
- source_word: ἄνθρωπός εἰμι
  choice: je suis un homme
  rationale: Le locuteur parle de sa propre condition humaine et masculine. Cette formulation est naturelle et fidèle au contexte.
- source_word: ὑπὸ ἐξουσίαν τασσόμενος
  choice: placé sous une autorité
  rationale: Le participe passif exprime la place assignée au centurion dans une chaîne hiérarchique. « Placé sous une autorité » conserve cette nuance, plutôt que de dire simplement « soumis ».
- source_word: ἔχων ὑπ’ ἐμαυτὸν στρατιώτας
  choice: avec des soldats sous mes ordres
  rationale: Cette formulation française idiomatique exprime clairement la relation hiérarchique indiquée littéralement par « sous moi », sans ajouter l’idée d’une autorité indépendante de celle qui lui est déléguée.
- source_word: λέγω τούτῳ
  choice: Je dis à l’un
  rationale: Dans l’énumération française, « à l’un » rend naturellement le démonstratif τούτῳ tout en préparant le parallèle « à un autre ».
- source_word: Πορεύθητι / πορεύεται
  choice: « Va ! » et il va
  rationale: Les verbes simples conservent le parallélisme direct entre l’ordre et son exécution.
- source_word: Ἔρχου / ἔρχεται
  choice: « Viens ! » et il vient
  rationale: La formulation reproduit sobrement la structure grecque de commandement et d’obéissance.
- source_word: τῷ δούλῳ μου
  choice: à mon esclave
  rationale: Dans cette illustration fondée sur la subordination, δοῦλος désigne une personne en condition servile ou possédée. « Esclave » préserve cette réalité sociale, tandis que « serviteur » est signalé en note comme traduction possible.
- source_word: Ποίησον τοῦτο, καὶ ποιεῖ
  choice: « Fais ceci ! » et il le fait
  rationale: Le pronom « le » reprend naturellement « ceci » en français et maintient le rapport immédiat entre l’ordre et son accomplissement.
theological_decisions:
- issue: Traduction de δοῦλος dans l’analogie du centurion
  choice: esclave
  alternative: serviteur
  rationale: La structure d’autorité est essentielle à l’analogie, et « esclave » rend explicitement le statut de dépendance que peut désigner δοῦλος. Comme le mot grec peut, selon le contexte, être rendu plus généralement par « serviteur », cette possibilité est conservée en note sans atténuer le texte principal.
translation_notes:
  register: Français international moderne, clair et digne. La ponctuation du discours direct rend l’enchaînement oral sans perdre le parallélisme serré de l’original. « Sous mes ordres » est préféré au calque peu naturel « sous moi ».
