id: LUK.7.13
reference: Luke 7:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἰδὼν αὐτὴν ὁ κύριος ἐσπλαγχνίσθη ἐπ’ αὐτῇ καὶ εἶπεν αὐτῇ· Μὴ κλαῖε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/013.yaml
  text: And when the Lord saw her[a], he was moved with compassion for her and said to her, “Do not weep.”
translation:
  language: fr
  text: 'Quand le Seigneur la vit, il fut ému de compassion pour elle et lui dit : « Ne pleure pas. »[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Ne pleure plus » ou « Cesse de pleurer ». Le grec peut exprimer soit une interdiction générale, soit l’ordre de cesser les pleurs en cours.
    reason: alternative lexicale et nuance aspectuelle
lexical_decisions:
- source_word: ἰδὼν
  choice: Quand … vit
  rationale: Le participe aoriste exprime ici une action antérieure à celle du verbe principal. Une proposition temporelle est naturelle en français et conserve clairement la succession des actions.
- source_word: ὁ κύριος
  choice: le Seigneur
  rationale: Dans le récit de Luc, κύριος est employé comme titre christologique de Jésus. « Le Seigneur » préserve cette portée sans réduire le terme à « maître ».
- source_word: ἐσπλαγχνίσθη
  choice: fut ému de compassion
  rationale: Le verbe désigne une compassion profonde et intérieure. Cette formulation en restitue la force affective tout en restant digne et compréhensible.
- source_word: ἐπ’ αὐτῇ
  choice: pour elle
  rationale: Avec σπλαγχνίζομαι, ἐπί suivi du datif indique la personne vers laquelle se porte la compassion. « Pour elle » est l’expression française la plus naturelle.
- source_word: εἶπεν αὐτῇ
  choice: lui dit
  rationale: Cette tournure rend directement et naturellement le verbe λέγω accompagné de son complément indirect.
- source_word: Μὴ κλαῖε
  choice: Ne pleure pas
  rationale: Le présent impératif avec μή peut être compris comme une interdiction générale ou comme une invitation à cesser l’action en cours. « Ne pleure pas » conserve cette ambiguïté mieux que « Cesse de pleurer ».
theological_decisions:
- issue: Traduction de κύριος comme titre de Jésus
  choice: le Seigneur
  alternative: le maître
  rationale: Le contexte narratif de Luc favorise un titre élevé appliqué à Jésus. « Le Seigneur » préserve cette dimension christologique sans expliciter davantage que le texte grec.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple convient au registre narratif biblique sans être archaïque. La formulation conserve la profondeur affective de ἐσπλαγχνίσθη et l’ambiguïté aspectuelle de Μὴ κλαῖε.
