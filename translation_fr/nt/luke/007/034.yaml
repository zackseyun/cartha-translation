  to: 'Le Fils de l’homme est venu en mangeant et en buvant, et vous dites : « Regardez cet homme : un glouton et un ivrogne[a], un ami des collecteurs d’impôts et des pécheurs ! »'
  rationale: La révision remplace le rendu principal trop neutre de οἰνοπότης par « ivrogne », qui restitue la virulence de l’accusation rapportée. La note maintient l’alternative littérale et la référence explicite au vin. Le reste du texte est conservé.
