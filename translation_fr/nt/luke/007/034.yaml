source:
  edition: SBLGNT
  text: ἐλήλυθεν ὁ υἱὸς τοῦ ἀνθρώπου ἐσθίων καὶ πίνων, καὶ λέγετε· Ἰδοὺ ἄνθρωπος φάγος καὶ οἰνοπότης, φίλος τελωνῶν καὶ ἁμαρτωλῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/034.yaml
  text: The Son of Man has come eating and drinking[a], and you say, ‘Look, a glutton and a drunkard, a friend of tax collectors and sinners!’
translation:
  language: fr
  text: 'Le Fils de l’homme est venu en mangeant et en buvant, et vous dites : « Regardez cet homme : un glouton et un ivrogne[a], un ami des collecteurs d’impôts et des pécheurs ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou plus littéralement : « un buveur de vin ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλήλυθεν
  choice: est venu
  rationale: Le passé composé rend naturellement en français le parfait grec, en présentant la venue comme accomplie et pertinente dans la situation présente.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: le Fils de l’homme
  rationale: Formulation française consacrée qui préserve la valeur de titre ainsi que ses résonances possibles, notamment daniéliques.
- source_word: ἐσθίων καὶ πίνων
  choice: en mangeant et en buvant
  rationale: Le gérondif exprime naturellement la manière ou les circonstances accompagnant sa venue.
- source_word: λέγετε
  choice: vous dites
  rationale: Le présent français correspond directement au présent grec dans cette adresse aux interlocuteurs.
- source_word: Ἰδοὺ
  choice: Regardez
  rationale: Impératif moderne et naturel qui conserve la force déictique et exclamative du grec.
- source_word: ἄνθρωπος
  choice: cet homme
  rationale: Le démonstratif s’accorde naturellement avec « Regardez » et maintient explicitement le nom ἄνθρωπος, sans alléger la formulation grecque.
- source_word: φάγος
  choice: un glouton
  rationale: Nom français direct et nettement péjoratif, adapté à l’accusation hostile.
- source_word: οἰνοπότης
  choice: un buveur de vin
  rationale: Rendu lexicalement précis qui conserve la référence explicite au vin et le parallélisme des noms d’agent; une note signale l’équivalent idiomatique plus accusateur.
- source_word: φίλος
  choice: un ami
  rationale: L’article indéfini produit en français une apposition naturelle à la suite des accusations.
- source_word: τελωνῶν
  choice: des collecteurs d’impôts
  rationale: Expression moderne, claire et historiquement générale pour les agents chargés de percevoir taxes ou péages.
- source_word: ἁμαρτωλῶν
  choice: des pécheurs
  rationale: Traduction directe qui préserve l’étiquette sociale et religieuse employée par les adversaires de Jésus.
theological_decisions:
- issue: Rendu du titre ὁ υἱὸς τοῦ ἀνθρώπου
  choice: le Fils de l’homme
  alternative: l’Être humain
  rationale: Le choix retient la formulation titulaire reconnue et ses possibles résonances scripturaires sans imposer une interprétation christologique particulière.
- issue: Force de l’accusation οἰνοπότης
  choice: un buveur de vin
  alternative: un ivrogne
  rationale: Le rendu principal suit de près la composition lexicale grecque et laisse le contexte porter la condamnation; la note fournit l’équivalent français idiomatique qui explicite la virulence de l’insulte.
- issue: Statut des qualificatifs hostiles
  choice: les conserver comme paroles rapportées des interlocuteurs
  alternative: les reformuler comme description du narrateur
  rationale: La syntaxe « vous dites » et les guillemets montrent qu’il s’agit d’accusations dirigées contre Jésus, non d’un jugement approuvé par le narrateur.
translation_notes:
  register: Français international moderne, digne et accessible. « Regardez cet homme » conserve explicitement ἄνθρωπος tout en évitant l’archaïsme de « Voici ». La ponctuation souligne la vigueur de l’accusation rapportée.
