    issue: « un buveur de vin » n’a pas, en français moderne, la force péjorative inhérente à οἰνοπότης dans cette série d’injures.
    rationale: Le grec rapporte une accusation hostile parallèle à « glouton ». Le terme français peut désigner simplement une personne qui boit du vin; « ivrogne » rend mieux l’insulte sans présenter celle-ci comme un jugement du narrateur.
