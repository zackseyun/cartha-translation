  text: ἀγαπᾷ γὰρ τὸ ἔθνος ἡμῶν καὶ τὴν συναγωγὴν αὐτὸς ᾠκοδόμησεν ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/005.yaml
  text: For he loves our nation[a], and he himself built the synagogue for us.
translation:
  language: fr
  text: Car il aime notre peuple et c’est lui qui nous a construit la synagogue[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « c’est lui qui a fait construire la synagogue pour nous ». Le grec dit simplement « a construit » ; il peut s’agir soit d’une participation personnelle, soit de la prise en charge ou du financement des travaux.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγαπᾷ
  choice: aime
  rationale: Le verbe « aimer » rend directement ἀγαπᾷ et conserve la force de la recommandation formulée par les anciens.
- source_word: γὰρ
  choice: car
  rationale: « Car » marque naturellement en français la justification donnée à la demande du verset précédent.
- source_word: τὸ ἔθνος ἡμῶν
  choice: notre peuple
  rationale: Dans la bouche des anciens juifs, ἔθνος désigne ici leur communauté ethnoreligieuse. « Notre peuple » est plus naturel en français actuel que « notre nation » dans ce contexte, sans réduire la portée collective du grec.
- source_word: τὴν συναγωγήν
  choice: la synagogue
  rationale: Le grec emploie l’article défini sans possessif explicite et renvoie vraisemblablement à la synagogue locale connue des interlocuteurs.
- source_word: αὐτός
  choice: c’est lui qui
  rationale: Cette tournure française restitue l’insistance portée par le pronom grec αὐτός sans produire le tour moins naturel « lui-même a construit ».
- source_word: ᾠκοδόμησεν
  choice: a construit
  rationale: Le passé composé rend naturellement l’aoriste narratif en français. Le verbe reste volontairement non explicité quant à une construction personnelle ou financée par le centurion.
- source_word: ἡμῖν
  choice: nous a construit
  rationale: Le pronom « nous » exprime le bénéficiaire de la construction dans une syntaxe française naturelle, équivalant à « a construit pour nous ».
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. « Notre peuple » évite la connotation politique moderne que pourrait prendre « notre nation ». La construction clivée « c’est lui qui » conserve l’emphase de αὐτός. Le marqueur [a] est placé après « synagogue », là où porte l’alternative concernant le mode de construction.
