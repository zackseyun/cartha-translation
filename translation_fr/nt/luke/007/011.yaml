id: LUK.7.11
reference: Luke 7:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ἐν τῷ ἑξῆς ⸀ἐπορεύθη εἰς πόλιν καλουμένην Ναΐν, καὶ συνεπορεύοντο αὐτῷ οἱ μαθηταὶ ⸀αὐτοῦ καὶ ὄχλος πολύς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/011.yaml
  text: And it happened on the next day that he went into a town called Nain[a], and his disciples and a large crowd were going with him.
translation:
  language: fr
  text: Le jour suivant, Jésus se rendit dans une ville appelée Naïn[a]. Ses disciples et une foule nombreuse faisaient route avec lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Certains manuscrits portent « peu après » au lieu de « le jour suivant ».
    reason: textual_variant
lexical_decisions:
- source_word: Καὶ ἐγένετο
  choice: Le jour suivant,
  rationale: La formule narrative lucanienne introduit le nouvel épisode. En français naturel, son apport est rendu par l’ouverture temporelle sans calque lourd comme « Et il arriva que ».
- source_word: ἐν τῷ ἑξῆς
  choice: Le jour suivant
  rationale: Dans le texte du SBLGNT, l’expression désigne le moment suivant et s’entend ici naturellement du jour suivant; la variante « peu après » est signalée en note.
- source_word: ἐπορεύθη
  choice: se rendit
  rationale: Le verbe exprime le déplacement vers Naïn; « se rendit » est idiomatique, digne et précis en français narratif.
- source_word: εἰς πόλιν
  choice: dans une ville
  rationale: πόλις désigne une agglomération; « ville » reste le correspondant français ordinaire, tandis que « dans » reflète le mouvement vers l’intérieur du lieu.
- source_word: καλουμένην Ναΐν
  choice: appelée Naïn
  rationale: Rendu direct et idiomatique du participe; la graphie française traditionnelle « Naïn » marque le hiatus du nom propre.
- source_word: συνεπορεύοντο αὐτῷ
  choice: faisaient route avec lui
  rationale: L’imparfait grec décrit un accompagnement en cours et conserve l’idée de déplacement, mieux que le simple « l’accompagnaient ».
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: Ses disciples
  rationale: Rendu français naturel et consacré de μαθηταί avec le possessif.
- source_word: ὄχλος πολύς
  choice: une foule nombreuse
  rationale: Expression claire et naturelle qui rend l’importance numérique indiquée par πολύς.
theological_decisions: []
translation_notes:
  register: Français international moderne, fluide et digne. La formule grecque d’introduction est intégrée à la syntaxe française afin d’éviter un calque archaïsant. Le nom « Jésus », implicite dans le pronom grec mais explicité pour la clarté à l’ouverture du verset, reprend sans ambiguïté le protagoniste du contexte.
