  to: À ce moment-là[a], il guérit beaucoup de personnes de maladies et de souffrances[b], et il en délivra beaucoup d’autres d’esprits mauvais ; à beaucoup d’aveugles, il accorda la vue[c].
  rationale: 'La phrase est révisée afin d’éviter une construction française maladroite avec « guérir ... d’esprits mauvais ». Toutefois, « beaucoup d’autres » would introduce a distinction of groups absent from the Greek; therefore the safe final revision must retain the same collective referent: « À ce moment-là[a], il guérit beaucoup de personnes de maladies et de souffrances[b], et les délivra d’esprits mauvais ; à beaucoup d’aveugles, il accorda la vue[c]. » This maintains the single group denoted by πολλούς, preserves the three source categories, and gives a natural modern French rendering of ἐχαρίσατο βλέπειν.'
