source:
  edition: SBLGNT
  text: ἐν ⸀ἐκείνῃ τῇ ὥρᾳ ἐθεράπευσεν πολλοὺς ἀπὸ νόσων καὶ μαστίγων καὶ πνευμάτων πονηρῶν, καὶ τυφλοῖς πολλοῖς ⸀ἐχαρίσατο βλέπειν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/021.yaml
  text: In that hour he healed many from diseases and afflictions and evil spirits[c][b][a], and to many blind people he granted sight.
translation:
  language: fr
  text: À ce moment-là[a], il guérit beaucoup de personnes de maladies et de souffrances[b], et il en délivra beaucoup d’autres d’esprits mauvais ; à beaucoup d’aveugles, il accorda la vue[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « À cette heure même ». L’expression grecque peut souligner que ces actes eurent lieu précisément à ce moment-là.
    reason: lexical_alternative
  - marker: b
    text: Ou « de fléaux ». Le mot grec désigne littéralement des coups de fouet et, au sens figuré, des maux ou des souffrances sévères.
    reason: lexical_alternative
  - marker: c
    text: Littéralement, « il accorda de voir ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἐκείνῃ τῇ ὥρᾳ
  choice: À ce moment-là
  rationale: Cette tournure conserve la précision temporelle de Luc tout en étant plus naturelle en français actuel que le calque « à cette heure-là ».
- source_word: ἐθεράπευσεν
  choice: il guérit
  rationale: « Guérir » rend directement le sens courant de θεραπεύω dans le contexte des actes de guérison de Jésus.
- source_word: πολλοὺς
  choice: beaucoup de gens
  rationale: Le grec substantivé désigne de nombreuses personnes; expliciter « gens » produit une phrase française naturelle sans restreindre leur sexe.
- source_word: ἀπὸ νόσων
  choice: de maladies
  rationale: Avec « guérir », la préposition française « de » exprime naturellement la délivrance des maladies marquée par ἀπό.
- source_word: μαστίγων
  choice: souffrances
  rationale: Au sens propre, μάστιξ désigne un fouet ou un fléau; ici, son emploi figuré évoque des maux corporels pénibles. « Souffrances » reste clair sans imposer une maladie précise.
- source_word: πνευμάτων πονηρῶν
  choice: esprits mauvais
  rationale: Cette expression rend directement πονηρός, « mauvais », et conserve le référent spirituel personnel du texte.
- source_word: τυφλοῖς πολλοῖς
  choice: à beaucoup d’aveugles
  rationale: Le datif désigne les bénéficiaires. « Aveugles » est ici un substantif courant et inclusif en français.
- source_word: ἐχαρίσατο
  choice: il accorda
  rationale: « Accorder » exprime le don bienveillant porté par χαρίζομαι sans alourdir la formulation.
- source_word: βλέπειν
  choice: de voir
  rationale: Le choix conserve l’infinitif grec et l’expression remarquable « accorda… de voir », plutôt que de la réduire à un simple verbe de guérison.
theological_decisions:
- issue: Nature des πνεύματα πονηρά
  choice: Conserver « esprits mauvais » comme une catégorie distincte des maladies et des souffrances.
  alternative: Interpréter l’expression comme une simple métaphore de troubles physiques ou psychiques.
  rationale: La syntaxe coordonne trois réalités et l’expression grecque désigne normalement des esprits mauvais; la traduction ne doit pas en effacer la dimension spirituelle.
- issue: Nuance de grâce dans ἐχαρίσατο
  choice: Employer « accorda » sans développer explicitement « dans sa grâce ».
  alternative: Traduire « donna gracieusement » ou simplement « rendit la vue ».
  rationale: « Accorda » préserve la valeur de don de χαρίζομαι, tandis que la traduction littérale de l’infinitif maintient la formulation de Luc sans ajouter une explicitation théologique.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase garde les trois catégories du grec, ainsi que la nuance de don exprimée par ἐχαρίσατο. Les marqueurs de notes sont placés immédiatement après les expressions concernées.
