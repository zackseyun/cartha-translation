id: LUK.7.28
reference: Luke 7:28
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸀λέγω ὑμῖν, μείζων ἐν γεννητοῖς γυναικῶν ⸀Ἰωάννου οὐδείς ἐστιν· ὁ δὲ μικρότερος ἐν τῇ βασιλείᾳ τοῦ θεοῦ μείζων αὐτοῦ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/028.yaml
  text: I tell you[a], among those born of women no one is greater than John[c][b]; yet the least in the kingdom of God is greater than he is.
translation:
  language: fr
  text: 'Je vous le dis[a] : parmi ceux qui sont nés d’une femme[b], personne n’est plus grand que Jean. Pourtant, le plus petit[c] dans le royaume de Dieu est plus grand que lui.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Je vous dis ».'
    reason: lexical_alternative
  - marker: b
    text: L’expression « nés d’une femme » désigne ici les êtres humains en général.
    reason: cultural_note
  - marker: c
    text: 'Ou : « celui qui est le plus petit ». Le grec emploie un comparatif substantivé, qui peut aussi se rendre par « le moindre ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω ὑμῖν
  choice: Je vous le dis
  rationale: Cette formule de discours directe est naturelle en français moderne et conserve le présent ainsi que l’adresse aux auditeurs.
- source_word: μείζων
  choice: plus grand
  rationale: 'Le comparatif reste volontairement général : le texte ne précise pas s’il s’agit du rang, du privilège, de l’importance ou d’une autre forme de grandeur.'
- source_word: ἐν γεννητοῖς γυναικῶν
  choice: parmi ceux qui sont nés d’une femme
  rationale: Cette formulation conserve l’image sémitique tout en restant compréhensible; l’expression désigne les êtres humains en général.
- source_word: Ἰωάννου
  choice: Jean
  rationale: Forme française traditionnelle et courante du nom propre.
- source_word: οὐδείς ἐστιν
  choice: personne n’est
  rationale: Expression française naturelle de l’énoncé négatif dans cette construction comparative.
- source_word: ὁ δὲ μικρότερος
  choice: Pourtant, le plus petit
  rationale: L’article avec le comparatif employé comme substantif désigne une personne. « Le plus petit » est idiomatique dans ce cadre collectif; « pourtant » rend la valeur contrastive de δέ sans la renforcer excessivement.
- source_word: ἐν τῇ βασιλείᾳ τοῦ θεοῦ
  choice: dans le royaume de Dieu
  rationale: Rendu biblique courant qui conserve à la fois le nom βασιλεία et la relation exprimée par τοῦ θεοῦ.
- source_word: μείζων αὐτοῦ ἐστιν
  choice: est plus grand que lui
  rationale: La comparaison avec Jean est exprimée clairement, sans préciser sur quel plan porte cette grandeur.
theological_decisions:
- issue: Sens de la comparaison entre Jean et « le plus petit » dans le royaume de Dieu
  choice: Conserver la comparaison paradoxale sans définir la nature de la grandeur.
  alternative: Préciser qu’il s’agit du privilège lié à l’histoire du salut, de la valeur morale ou spirituelle, du rang, ou d’une hyperbole rhétorique.
  rationale: Le grec affirme que le plus petit dans le royaume est plus grand que Jean, mais ne donne pas ici le critère de cette grandeur. La traduction préserve donc cette tension interprétative.
translation_notes:
  register: Français international moderne, clair et digne. La tournure « nés d’une femme » maintient la couleur de l’expression source, tandis que les notes éclairent l’idiome et les possibilités lexicales sans résoudre la portée théologique du contraste.
