id: LUK.7.4
reference: Luke 7:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οἱ δὲ παραγενόμενοι πρὸς τὸν Ἰησοῦν παρεκάλουν αὐτὸν σπουδαίως λέγοντες ὅτι Ἄξιός ἐστιν ᾧ ⸀παρέξῃ τοῦτο,
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/004.yaml
  text: When they came to Jesus[a], they earnestly appealed to him, saying, “He is worthy that you should grant this to him.”
translation:
  language: fr
  text: 'Quand ils arrivèrent auprès de Jésus, ils le supplièrent avec insistance en disant : « Il mérite que tu lui accordes cela[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Il est digne que tu fasses cela pour lui. »'
    reason: Alternative plus formelle qui conserve la construction de ἄξιος et le sens plus général de παρέχω.
lexical_decisions:
- source_word: παραγενόμενοι
  choice: arrivèrent auprès de
  rationale: Le participe exprime l’arrivée auprès de Jésus; cette formulation française rend naturellement sa valeur temporelle après « quand ».
- source_word: παρεκάλουν
  choice: supplièrent
  rationale: Dans ce contexte de requête respectueuse et pressante, « supplier » rend la force de παρακαλέω sans suggérer un ordre.
- source_word: σπουδαίως
  choice: avec insistance
  rationale: L’expression traduit l’empressement et l’intensité de leur demande dans un français courant.
- source_word: Ἄξιός
  choice: mérite
  rationale: La tournure idiomatique « il mérite que » conserve le jugement de valeur exprimé par ἄξιος tout en étant plus naturelle ici que « il est digne que ».
- source_word: ᾧ
  choice: lui
  rationale: Le pronom datif renvoie au centurion, bénéficiaire de l’action demandée.
- source_word: παρέξῃ
  choice: tu lui accordes
  rationale: παρέχω peut signifier fournir ou accorder; « accorder » convient à une faveur sollicitée et maintient le ton déférent.
- source_word: τοῦτο
  choice: cela
  rationale: Le démonstratif renvoie à l’intervention demandée dans le contexte, sans explicitation ajoutée.
theological_decisions:
- issue: Fondement du mérite attribué au centurion
  choice: Conserver simplement l’affirmation rapportée « Il mérite »
  alternative: Préciser la nature morale, religieuse ou sociale de ce mérite
  rationale: Le verset rapporte l’évaluation des anciens sans définir ici le mérite ni en faire une déclaration théologique absolue.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple convient au registre narratif biblique sans archaïsme marqué; « avec insistance » communique clairement l’intensité de la requête.
