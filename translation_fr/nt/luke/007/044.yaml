  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ στραφεὶς πρὸς τὴν γυναῖκα τῷ Σίμωνι ἔφη· Βλέπεις ταύτην τὴν γυναῖκα; εἰσῆλθόν σου εἰς τὴν οἰκίαν, ὕδωρ ⸀μοι ἐπὶ ⸀πόδας οὐκ ἔδωκας· αὕτη δὲ τοῖς δάκρυσιν ἔβρεξέν μου τοὺς πόδας καὶ ταῖς ⸀θριξὶν αὐτῆς ἐξέμαξεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/044.yaml
  text: And turning toward the woman[a], he said to Simon, “Do you see this woman? I entered your house; you gave me no water for my feet, but she wet my feet with her tears and wiped them with her hair.”
translation:
  language: fr
  text: 'Puis, se tournant vers la femme, il dit à Simon : « Tu vois cette femme ? Je suis entré dans ta maison, et tu ne m’as pas donné d’eau pour mes pieds[a] ; mais elle, elle a mouillé mes pieds de ses larmes et les a essuyés avec ses cheveux. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus formellement : « tu ne m’as pas donné d’eau sur les pieds ». Il s’agit de l’usage consistant à fournir de l’eau pour se laver les pieds.'
    reason: lexical_alternative
lexical_decisions:
- source_word: στραφεὶς πρὸς τὴν γυναῖκα
  choice: se tournant vers la femme
  rationale: Le participe aoriste décrit la réorientation physique qui précède la parole ; cette formulation est naturelle en français et reste proche du grec.
- source_word: τῷ Σίμωνι ἔφη
  choice: il dit à Simon
  rationale: Le passé simple convient au récit et rend idiomatiquement l’imparfait de φημί dans cette proposition introductive.
- source_word: Βλέπεις ταύτην τὴν γυναῖκα;
  choice: Tu vois cette femme ?
  rationale: La traduction conserve le verbe de perception, le présent et le démonstratif, sans remplacer la question par une interprétation comme « remarques-tu ».
- source_word: εἰσῆλθόν σου εἰς τὴν οἰκίαν
  choice: Je suis entré dans ta maison
  rationale: Le passé composé est naturel dans la parole directe en français moderne ; « maison » correspond sobrement à οἰκία.
- source_word: ὕδωρ μοι ἐπὶ πόδας οὐκ ἔδωκας
  choice: tu ne m’as pas donné d’eau pour mes pieds
  rationale: Cette formulation traduit explicitement le don d’eau sans ajouter dans le texte principal le verbe « laver », qui demeure implicite.
- source_word: αὕτη δὲ
  choice: mais elle, elle
  rationale: La dislocation, courante et digne en français oral, souligne le contraste marqué entre Simon et la femme.
- source_word: τοῖς δάκρυσιν ἔβρεξέν μου τοὺς πόδας
  choice: elle a mouillé mes pieds de ses larmes
  rationale: « Mouiller » rend directement βρέχω, tandis que « de ses larmes » exprime naturellement en français le moyen indiqué par le datif.
- source_word: ταῖς θριξὶν αὐτῆς ἐξέμαξεν
  choice: les a essuyés avec ses cheveux
  rationale: « Essuyer » rend ἐκμάσσω sans surinterpréter le résultat ; le pronom « les » reprend clairement « mes pieds ».
