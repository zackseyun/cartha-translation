  text: Ἠρώτα δέ τις αὐτὸν τῶν Φαρισαίων ἵνα φάγῃ μετ’ αὐτοῦ· καὶ εἰσελθὼν εἰς ⸂τὸν οἶκον⸃ τοῦ Φαρισαίου ⸀κατεκλίθη.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/036.yaml
  text: One of the Pharisees was asking him to eat with him[a], and after entering the Pharisee’s house[b], he reclined at the table.
translation:
  language: fr
  text: L’un des Pharisiens lui demandait de manger avec lui[a]. Jésus entra dans la maison du pharisien et prit place à table[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus formellement : « lui demandait qu’il mange avec lui ». Dans ce contexte, cette demande constitue une invitation.'
    reason: lexical_alternative
  - marker: b
    text: 'Le verbe grec désigne ici la position adoptée pour un repas formel : les convives se tenaient inclinés ou allongés, plutôt qu’assis bien droits.'
    reason: cultural_note
lexical_decisions:
- source_word: Ἠρώτα
  choice: demandait
  rationale: L’imparfait grec présente la demande dans son déroulement. En français, « lui demandait de manger avec lui » en conserve l’aspect sans remplacer le verbe par l’interprétation plus explicite « invitait ».
- source_word: δέ
  choice: non rendu explicitement
  rationale: Connecteur narratif léger; l’enchaînement français reste naturel sans lui ajouter « alors » ou « or », qui risqueraient de surcharger sa valeur.
- source_word: τις … τῶν Φαρισαίων
  choice: un des pharisiens
  rationale: Rend naturellement la construction partitive grecque.
- source_word: ἵνα φάγῃ μετ’ αὐτοῦ
  choice: de manger avec lui
  rationale: L’infinitif français après « demander » exprime naturellement le contenu et la visée de la demande, tout en restant proche du grec.
- source_word: εἰσελθὼν εἰς τὸν οἶκον τοῦ Φαρισαίου
  choice: Jésus entra dans la maison du pharisien
  rationale: La proposition coordonnée rend clairement la séquence exprimée par le participe aoriste. La répétition de « Jésus » lève l’ambiguïté que créerait en français une succession de pronoms masculins.
- source_word: κατεκλίθη
  choice: prit place à table
  rationale: Expression française naturelle pour l’installation au repas; la note précise la posture historique de la personne allongée, sens concret du verbe grec.
theological_decisions: []
translation_notes:
  register: Français international moderne, simple et digne. « Pharisiens » conserve le nom traditionnel du groupe. La syntaxe grecque a été légèrement restructurée afin d’éviter une chaîne de pronoms ambigus et de produire un récit naturel.
