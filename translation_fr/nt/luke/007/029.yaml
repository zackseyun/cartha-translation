revisions:
- from: Et tout le peuple, y compris les collecteurs d’impôts, après avoir entendu cela, reconnut que Dieu était juste[a], ayant reçu le baptême de Jean[b].
  to: Et tous ceux du peuple, y compris les collecteurs d’impôts, lorsqu’ils entendirent cela, reconnurent que Dieu était juste[a], ayant reçu le baptême de Jean[b].
  rationale: La révision emploie un sujet pluriel afin de refléter la coordination grecque et d’éviter un accord français moins naturel. « Lorsqu’ils entendirent cela » conserve la valeur temporelle sans accentuer indûment l’antériorité. Le participe final et sa note sont maintenus afin de préserver l’ambiguïté circonstancielle ou causale du grec.
