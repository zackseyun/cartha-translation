source:
  edition: SBLGNT
  text: (καὶ πᾶς ὁ λαὸς ἀκούσας καὶ οἱ τελῶναι ἐδικαίωσαν τὸν θεόν, βαπτισθέντες τὸ βάπτισμα Ἰωάννου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/029.yaml
  text: And all the people[a], when they heard this, including the tax collectors, declared God to be righteous[b], having been baptized with John's baptism.
translation:
  language: fr
  text: Et tous ceux du peuple, y compris les collecteurs d’impôts, lorsqu’ils entendirent cela, reconnurent que Dieu était juste[a], ayant reçu le baptême de Jean[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « justifièrent Dieu ». Autrement dit, ils reconnurent que Dieu était dans son droit.'
    reason: lexical_alternative
  - marker: b
    text: 'Le participe peut aussi être compris dans un sens causal : « parce qu’ils avaient reçu le baptême de Jean ».'
    reason: alternative_reading
lexical_decisions:
- source_word: πᾶς ὁ λαὸς
  choice: tout le peuple
  rationale: Cette expression collective conserve l’étendue générale du grec dans un français naturel.
- source_word: ἀκούσας
  choice: après avoir entendu cela
  rationale: Le participe aoriste a ici une valeur temporelle naturelle. « Cela » explicite sobrement l’objet sous-entendu par le contexte.
- source_word: καὶ οἱ τελῶναι
  choice: y compris les collecteurs d’impôts
  rationale: « Y compris » rattache naturellement les collecteurs d’impôts au peuple sans ajouter l’emphase que pourrait suggérer « même ».
- source_word: ἐδικαίωσαν τὸν θεόν
  choice: reconnut que Dieu était juste
  rationale: Dans ce contexte, le peuple ne rend pas Dieu juste, mais reconnaît qu’il est juste et qu’il a raison. Cette formulation reste claire tout en conservant la nuance judiciaire de δικαιόω.
- source_word: βαπτισθέντες
  choice: ayant reçu le baptême
  rationale: La tournure participiale garde le lien circonstanciel du grec sans imposer explicitement une valeur causale.
- source_word: τὸ βάπτισμα Ἰωάννου
  choice: le baptême de Jean
  rationale: Formulation française usuelle et concise pour désigner le baptême administré par Jean.
theological_decisions:
- issue: Sens de « justifier Dieu »
  choice: Le peuple reconnaît que Dieu est juste et qu’il a raison.
  alternative: « justifia Dieu », formulation plus littérale
  rationale: Le texte décrit l’assentiment humain à la justice de Dieu, non un changement de l’état moral de Dieu. La traduction évite ce contresens tout en signalant en note la forme plus littérale.
- issue: Valeur du participe βαπτισθέντες
  choice: Le participe est conservé comme indication circonstancielle, sans préciser davantage la relation logique.
  alternative: 'Valeur causale : « parce qu’ils avaient reçu le baptême de Jean »'
  rationale: Le contexte permet une lecture causale, mais la morphologie seule ne l’impose pas. Le texte principal préserve donc l’ambiguïté.
translation_notes:
  register: Français international moderne, digne et accessible. « Collecteurs d’impôts » est le terme courant et précis. La construction participiale finale est légèrement soutenue, mais elle permet de préserver l’indétermination syntaxique du grec.
