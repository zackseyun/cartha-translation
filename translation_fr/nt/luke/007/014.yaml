id: LUK.7.14
reference: Luke 7:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ προσελθὼν ἥψατο τῆς σοροῦ, οἱ δὲ βαστάζοντες ἔστησαν, καὶ εἶπεν· Νεανίσκε, σοὶ λέγω, ἐγέρθητι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/014.yaml
  text: And coming up[a], he touched the bier, and the men carrying it stood still, and he said, “Young man, I say to you, arise.”
translation:
  language: fr
  text: 'Puis il s’approcha et toucha la civière funéraire[a]. Les porteurs s’arrêtèrent. Il dit : « Jeune homme, je te le dis, lève-toi ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le brancard funéraire ». Le terme grec désigne le support sur lequel le mort était porté dans le cortège, et non nécessairement un cercueil fermé.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθὼν
  choice: il s’approcha
  rationale: Le participe aoriste marque le mouvement de Jésus vers le convoi avant qu’il touche la civière. « Il s’approcha » est naturel en français et conserve la progression de l’action.
- source_word: ἥψατο
  choice: toucha
  rationale: Dans ce contexte, le moyen ἥψατο signifie qu’il entra en contact avec l’objet. « Toucha » n’ajoute pas l’idée d’une prise prolongée.
- source_word: σοροῦ
  choice: la civière funéraire
  rationale: σορός désigne ici le support sur lequel le mort était transporté dans le cortège, et non nécessairement un cercueil fermé au sens moderne. « Civière funéraire » est précis et compréhensible.
- source_word: οἱ δὲ βαστάζοντες
  choice: les porteurs
  rationale: L’expression désigne ceux qui portaient la civière. « Les porteurs » est concis, idiomatique et ne précise pas leur sexe au-delà de ce que requiert le français.
- source_word: ἔστησαν
  choice: s’arrêtèrent
  rationale: Dans la scène, le verbe indique qu’ils cessèrent d’avancer. « S’arrêtèrent » exprime clairement ce résultat sans lourdeur.
- source_word: Νεανίσκε
  choice: Jeune homme
  rationale: Le vocatif s’adresse directement à un homme jeune. « Jeune homme » est la formulation moderne la plus naturelle.
- source_word: σοὶ λέγω
  choice: je te le dis
  rationale: Le pronom datif explicite renforce l’adresse personnelle. « Je te le dis » restitue cette insistance avec naturel et solennité.
- source_word: ἐγέρθητι
  choice: lève-toi
  rationale: L’impératif commande au jeune homme de se relever. « Lève-toi » est actuel, digne et naturel en discours direct, tout en laissant le contexte de résurrection donner au verbe sa portée.
theological_decisions:
- issue: Portée du commandement adressé au mort
  choice: « lève-toi »
  alternative: « sois relevé » ou « relève-toi »
  rationale: La forme grecque peut avoir une morphologie passive, mais elle fonctionne naturellement comme un impératif demandant de se lever. « Lève-toi » préserve l’autorité directe de Jésus sans expliciter le mécanisme du miracle ni imposer une interprétation théologique supplémentaire.
translation_notes:
  register: Français international moderne, clair et digne. La structure narrative est légèrement segmentée pour une lecture naturelle. Le vocabulaire évite à la fois l’archaïsme de « bière » et l’anachronisme possible de « cercueil ».
