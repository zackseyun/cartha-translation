id: LUK.7.50
reference: Luke 7:50
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἶπεν δὲ πρὸς τὴν γυναῖκα· Ἡ πίστις σου σέσωκέν σε· πορεύου εἰς εἰρήνην.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/050.yaml
  text: And he said to the woman[a], “Your faith has saved you[b]; go in peace.”
translation:
  language: fr
  text: 'Et il dit à la femme : « Ta foi[a] t’a sauvée[b] ; va en paix. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « confiance » ; moins probablement ici, « fidélité ».
    reason: lexical_alternative
  - marker: b
    text: Ou « guérie ». Le verbe grec peut signifier « sauver », « délivrer » ou « guérir », mais le contexte met ici l’accent sur le pardon et le salut.
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπεν δὲ
  choice: Et il dit
  rationale: Le verbe à l’aoriste rapporte simplement la parole de Jésus, tandis que δέ assure ici la continuité du récit sans marquer une forte opposition.
- source_word: πρὸς τὴν γυναῖκα
  choice: à la femme
  rationale: Dans ce contexte, γυνή désigne la femme présente dans la scène, et non une épouse.
- source_word: Ἡ πίστις σου
  choice: Ta foi
  rationale: πίστις désigne ici la confiance placée en Jésus. « Foi » en rend naturellement la portée dans ce contexte, tout en laissant « confiance » comme possibilité explicative.
- source_word: σέσωκέν σε
  choice: t’a sauvée
  rationale: Le parfait de σῴζω présente une action accomplie dont le résultat demeure. Le contexte immédiat, centré sur le pardon, favorise « sauver » plutôt que le seul sens thérapeutique de « guérir ».
- source_word: πορεύου εἰς εἰρήνην
  choice: va en paix
  rationale: Cette expression idiomatique se rend naturellement en français par « va en paix », plutôt que par le calque « va vers la paix ».
theological_decisions:
- issue: Sens de σῴζω en rapport avec le pardon et le salut
  choice: t’a sauvée
  alternative: t’a guérie
  rationale: Luc 7.36–50 met l’accent sur le pardon des péchés et sur la réponse confiante de la femme. « Sauvée » préserve cette portée sans exclure du champ lexical de σῴζω son emploi ailleurs pour une guérison.
- issue: Sens de πίστις
  choice: foi
  alternative: confiance ; moins probablement, fidélité
  rationale: Dans cette parole adressée à la femme, πίστις renvoie le plus naturellement à sa confiance en Jésus. Le texte ne présente pas sa fidélité personnelle comme la cause explicitement mise en avant.
translation_notes:
  register: Français international moderne, simple et digne. Le tutoiement correspond au singulier grec et convient à l’adresse directe. L’accord féminin de « sauvée » explicite grammaticalement que la parole s’adresse à la femme, sans ajouter de contenu au grec.
