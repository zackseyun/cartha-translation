  variant: modern international French
source:
  edition: SBLGNT
  text: ἔλαβεν δὲ φόβος πάντας, καὶ ἐδόξαζον τὸν θεὸν λέγοντες ὅτι Προφήτης μέγας ⸀ἠγέρθη ἐν ἡμῖν, καὶ ὅτι Ἐπεσκέψατο ὁ θεὸς τὸν λαὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/016.yaml
  text: And fear seized them all[a], and they were glorifying God, saying, “A great prophet has arisen among us[c][b], and God has visited his people.”
translation:
  language: fr
  text: 'Alors, la crainte les saisit tous, et ils glorifiaient Dieu en disant : « Un grand prophète s’est levé parmi nous[a], et Dieu a visité son peuple[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « a été suscité parmi nous », ce qui peut mettre en relief l’action de Dieu qui suscite un prophète.'
    reason: lexical_alternative
  - marker: b
    text: Dans le langage biblique, dire que Dieu « visite » son peuple signifie qu’il vient vers lui avec attention et qu’il agit en sa faveur.
    reason: cultural_note
lexical_decisions:
- source_word: ἔλαβεν ... φόβος πάντας
  choice: la crainte les saisit tous
  rationale: Cette tournure française naturelle conserve l’image d’une crainte qui s’empare soudainement de tous. « Crainte » reste plus proche de φόβος que « émerveillement » et préserve l’ambivalence entre peur et respect religieux.
- source_word: δὲ
  choice: Alors
  rationale: Dans ce récit, δέ est un connecteur léger. « Alors » assure une transition narrative fluide sans donner au mot une valeur fortement adversative.
- source_word: ἐδόξαζον τὸν θεὸν
  choice: ils glorifiaient Dieu
  rationale: L’imparfait français rend l’aspect duratif ou répété de l’imparfait grec ἐδόξαζον. « Glorifiaient » maintient le lien lexical avec δοξάζω sans l’atténuer en simple louange.
- source_word: λέγοντες
  choice: en disant
  rationale: Le gérondif introduit naturellement en français les paroles par lesquelles ils glorifiaient Dieu.
- source_word: Προφήτης μέγας
  choice: Un grand prophète
  rationale: Rendu direct, idiomatique et fidèle à la valeur appréciative de μέγας.
- source_word: ἠγέρθη
  choice: s’est levé
  rationale: Le verbe pronominal est naturel en français et conserve la possibilité qu’un prophète soit apparu ou se soit manifesté, sans exclure l’arrière-plan biblique d’une action de Dieu qui le suscite.
- source_word: ἐν ἡμῖν
  choice: parmi nous
  rationale: Expression française directe et naturelle pour une présence au sein de la communauté.
- source_word: Ἐπεσκέψατο
  choice: a visité
  rationale: « A visité » préserve le langage biblique de la venue attentive et agissante de Dieu, sans le réduire à une seule idée comme aider ou délivrer.
- source_word: τὸν λαὸν αὐτοῦ
  choice: son peuple
  rationale: Rendu français naturel qui conserve les résonances d’appartenance et d’alliance.
theological_decisions:
- issue: Sens de φόβος après le miracle
  choice: la crainte
  alternative: l’effroi ; une crainte respectueuse
  rationale: « Crainte » suit directement le grec et laisse le contexte suggérer la dimension de respect religieux, plutôt que de résoudre la tension par « émerveillement » ou « respect ».
- issue: Sens de ἠγέρθη à propos d’un prophète
  choice: s’est levé
  alternative: a été suscité
  rationale: Le principal reste idiomatique tout en conservant l’écho possible de Dieu suscitant un prophète. La note explicite cette possibilité sans imposer l’agent divin dans le texte.
- issue: Portée de Ἐπεσκέψατο pour l’action divine
  choice: Dieu a visité son peuple
  alternative: Dieu est venu au secours de son peuple
  rationale: La formulation garde la richesse du motif biblique de la visitation divine — attention, présence et intervention — sans la limiter explicitement au secours.
- issue: Relation entre les deux propositions introduites par ὅτι ... καὶ ὅτι
  choice: une seule citation continue
  alternative: 'deux proclamations distinctes : « Un grand prophète… » et : « Dieu… »'
  rationale: Les deux propositions constituent naturellement le contenu coordonné de λέγοντες. Une citation unique est fluide en français, tout en respectant leur parallélisme.
translation_notes:
  register: Français international moderne, digne et accessible. L’imparfait « glorifiaient » conserve l’aspect du grec. Le vocabulaire biblique « glorifiaient » et « a visité » est maintenu parce qu’il reste compréhensible et porte des résonances que des paraphrases plus courantes réduiraient.
