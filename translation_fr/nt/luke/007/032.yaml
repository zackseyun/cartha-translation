id: LUK.7.32
reference: Luke 7:32
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὅμοιοί εἰσιν παιδίοις τοῖς ἐν ἀγορᾷ καθημένοις καὶ προσφωνοῦσιν ἀλλήλοις, ⸂ἃ λέγει⸃· Ηὐλήσαμεν ὑμῖν καὶ οὐκ ὠρχήσασθε· ⸀ἐθρηνήσαμεν καὶ οὐκ ἐκλαύσατε·
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/032.yaml
  text: 'They are like children sitting in the marketplace and calling to one another[a], who say: ‘We played the flute for you, and you did not dance; we sang a lament[b], and you did not weep.’'
translation:
  language: fr
  text: 'Ils ressemblent à des enfants assis sur la place publique, qui s''interpellent les uns les autres en disant : « Nous avons joué de la flûte pour vous, et vous n''avez pas dansé ; nous avons chanté une lamentation[a], et vous n''avez pas pleuré. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « nous avons entonné un chant funèbre » ou « nous nous sommes lamentés ». Le verbe grec peut désigner une lamentation, notamment funèbre.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅμοιοί εἰσιν
  choice: Ils ressemblent à
  rationale: Expression comparative naturelle en français moderne, qui introduit clairement la comparaison.
- source_word: παιδίοις
  choice: des enfants
  rationale: Le terme désigne des enfants sans préciser leur sexe ni imposer un âge plus étroit.
- source_word: ἐν ἀγορᾷ
  choice: sur la place publique
  rationale: Dans ce contexte, ἀγορά désigne l'espace public central où se tenaient notamment les activités commerciales; « place publique » restitue mieux le cadre antique que le seul « marché ».
- source_word: καθημένοις
  choice: assis
  rationale: Rend simplement le participe présent décrivant la posture des enfants.
- source_word: προσφωνοῦσιν ἀλλήλοις
  choice: qui s'interpellent les uns les autres
  rationale: « S'interpeller » exprime l'appel adressé à autrui, tandis que « les uns les autres » préserve explicitement la réciprocité de ἀλλήλοις.
- source_word: ἃ λέγει
  choice: en disant
  rationale: Cette formulation française fluide évite de reproduire maladroitement l'accord grec atypique entre le relatif neutre pluriel et le verbe singulier, sans en tirer une interprétation.
- source_word: Ηὐλήσαμεν ὑμῖν
  choice: Nous avons joué de la flûte pour vous
  rationale: αὐλέω désigne spécifiquement le fait de jouer de l'aulos, instrument à vent; « flûte » est le terme courant le plus immédiatement compréhensible.
- source_word: οὐκ ὠρχήσασθε
  choice: vous n'avez pas dansé
  rationale: Rend directement l'action concrète sans expliciter prématurément sa portée symbolique.
- source_word: ἐθρηνήσαμεν
  choice: nous avons chanté une lamentation
  rationale: Le verbe peut évoquer l'exécution d'un chant funèbre ou l'action de se lamenter; dans le jeu mimé par les enfants, cette traduction conserve la dimension performative et le contraste avec la flûte.
- source_word: οὐκ ἐκλαύσατε
  choice: vous n'avez pas pleuré
  rationale: Traduction directe et naturelle de κλαίω, qui maintient l'image concrète.
theological_decisions:
- issue: Préserver la portée parabolique des deux jeux opposés sans interpréter leur application
  choice: 'Employer des actions concrètes : jouer de la flûte, danser, chanter une lamentation et pleurer'
  alternative: Paraphraser en termes de célébration et de deuil
  rationale: Le verset expose la comparaison sans encore en développer toutes les correspondances. Le langage concret préserve l'image ainsi que sa tension interprétative.
translation_notes:
  register: Français international moderne, naturel et digne. « Place publique » rend le cadre social de l'agora sans suggérer seulement un lieu de vente. La phrase conserve le parallélisme rythmé des paroles enfantines.
