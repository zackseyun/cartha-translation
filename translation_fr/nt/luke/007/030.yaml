id: LUK.7.30
reference: Luke 7:30
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οἱ δὲ Φαρισαῖοι καὶ οἱ νομικοὶ τὴν βουλὴν τοῦ θεοῦ ἠθέτησαν εἰς ἑαυτούς, μὴ βαπτισθέντες ὑπ’ αὐτοῦ.)
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/030.yaml
  text: But the Pharisees and the lawyers rejected God's purpose for themselves[b][a], not having been baptized by him.
translation:
  language: fr
  text: Mais les pharisiens et les spécialistes de la Loi ont rejeté le dessein de Dieu à leur égard[a], n’ayant pas été baptisés par lui[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « le dessein de Dieu pour eux »; autre compréhension possible : « le conseil de Dieu contre eux ».'
    reason: alternative_reading
  - marker: b
    text: C’est-à-dire par Jean le Baptiste.
    reason: cross_reference
lexical_decisions:
- source_word: νομικοὶ
  choice: spécialistes de la Loi
  rationale: Le terme désigne ici des personnes versées dans la loi de Moïse. « Spécialistes de la Loi » est clair en français moderne et évite de les confondre avec les scribes.
- source_word: βουλὴν
  choice: dessein
  rationale: « Dessein » rend l’idée de projet ou d’intention délibérée de Dieu, dans un registre digne sans suggérer simplement un conseil donné.
- source_word: ἠθέτησαν
  choice: ont rejeté
  rationale: Le verbe exprime le refus ou la mise à l’écart. « Ont rejeté » est direct, naturel et convient au contexte.
- source_word: εἰς ἑαυτούς
  choice: à leur égard
  rationale: Cette formulation exprime que le dessein de Dieu les concernait personnellement, tout en évitant de trancher entre les nuances possibles « pour eux » et « contre eux ».
- source_word: μὴ βαπτισθέντες ὑπ’ αὐτοῦ
  choice: n’ayant pas été baptisés par lui
  rationale: La tournure participiale conserve la forme circonstancielle du grec sans imposer explicitement une valeur causale, instrumentale ou concomitante.
- source_word: αὐτοῦ
  choice: lui
  rationale: Le pronom renvoie, d’après le contexte immédiat, à Jean le Baptiste. Le conserver dans le texte suit de près le grec; la note apporte la clarification.
- source_word: δὲ
  choice: Mais
  rationale: La conjonction marque le contraste avec ceux qui, au verset précédent, ont reçu le baptême de Jean.
theological_decisions:
- issue: Sens du dessein de Dieu en rapport avec les pharisiens et les spécialistes de la Loi
  choice: le dessein de Dieu à leur égard
  alternative: le dessein de Dieu pour eux / le conseil de Dieu contre eux
  rationale: « À leur égard » maintient le rapport personnel exprimé par εἰς ἑαυτούς sans résoudre la tension théologique en affirmant soit qu’un décret absolu de Dieu aurait été contrarié, soit que son dessein était dirigé contre eux.
translation_notes:
  register: Français international moderne, clair et digne. « Spécialistes de la Loi » privilégie l’intelligibilité; « dessein » conserve une tonalité biblique naturelle. La construction participiale préserve l’ambiguïté syntaxique du grec.
