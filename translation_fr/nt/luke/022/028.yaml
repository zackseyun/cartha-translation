id: LUK.22.28
reference: Luke 22:28
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ὑμεῖς δέ ἐστε οἱ διαμεμενηκότες μετ’ ἐμοῦ ἐν τοῖς πειρασμοῖς μου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/028.yaml
  text: But you are the ones who have remained with me in my trials[a].
translation:
  language: fr
  text: Mais vous, vous êtes ceux qui sont restés avec moi dans mes épreuves[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans mes tentations » ou « dans mes mises à l’épreuve ». Le mot grec peut désigner une tentation ou une épreuve; ici, il renvoie probablement aux difficultés que Jésus a traversées.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑμεῖς
  choice: vous, vous
  rationale: Le pronom placé en tête est emphatique. La dislocation « vous, vous » rend naturellement cette insistance en français et prépare le contraste avec le contexte précédent.
- source_word: δέ
  choice: Mais
  rationale: La conjonction marque ici un contraste avec ce qui précède; « Mais » en conserve clairement la valeur adversative.
- source_word: οἱ διαμεμενηκότες
  choice: ceux qui sont restés
  rationale: Le participe parfait substantivé désigne un groupe caractérisé par sa persévérance jusqu'au moment présent. Le passé composé français exprime naturellement cette continuité résultante.
- source_word: μετ’ ἐμοῦ
  choice: avec moi
  rationale: Rend directement l'association ou l'accompagnement exprimé par μετά avec le génitif.
- source_word: ἐν τοῖς πειρασμοῖς μου
  choice: dans mes épreuves
  rationale: πειρασμός peut désigner une épreuve, une mise à l'épreuve ou une tentation. Dans ce contexte, « épreuves » évoque le mieux les difficultés et oppositions traversées par Jésus, sans effacer les autres nuances possibles.
theological_decisions:
- issue: Sens de πειρασμοῖς à propos de Jésus
  choice: les épreuves traversées par Jésus
  alternative: les tentations ou les mises à l’épreuve subies par Jésus
  rationale: Le contexte met en avant la fidélité des disciples demeurés auprès de Jésus au milieu des difficultés de son ministère. « Épreuves » convient donc au fil narratif, tandis que la note maintient l'ambiguïté réelle du terme grec.
translation_notes:
  register: Français international moderne, naturel et digne. Le redoublement « vous, vous » porte l'emphase du pronom grec; « ceux qui sont restés » conserve la forme identificatrice et la portée du parfait.
