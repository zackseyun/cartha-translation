  yaml_path: translation/nt/luke/022/009.yaml
  text: They said to him[a], “Where do you want us to prepare it?”
translation:
  language: fr
  text: 'Ils lui dirent : « Où veux-tu que nous fassions les préparatifs[a] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « que nous préparions le repas ». Le grec n’exprime pas l’objet; le contexte indique qu’il s’agit du repas de la Pâque.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: Ils
  rationale: L’article substantivé désigne les disciples dans le contexte. La particule δέ assure ici une transition légère que le français rend naturellement sans connecteur explicite.
- source_word: εἶπαν αὐτῷ
  choice: lui dirent
  rationale: Cette formulation rend directement l’aoriste de λέγω et le pronom au datif, dans un français naturel et soutenu sans être archaïque.
- source_word: Ποῦ
  choice: Où
  rationale: L’adverbe interrogatif porte simplement sur le lieu.
- source_word: θέλεις
  choice: veux-tu
  rationale: θέλω exprime ici la volonté ou le souhait; « veux-tu » est direct, actuel et naturel.
- source_word: ἑτοιμάσωμεν
  choice: que nous fassions les préparatifs
  rationale: Le subjonctif délibératif dépendant de θέλεις se rend naturellement par « veux-tu que nous… ». « Faire les préparatifs » préserve l’absence d’objet exprimé dans le grec, tout en renvoyant clairement au repas de la Pâque mentionné au verset précédent.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. « Faire les préparatifs » conserve l’implicite du texte grec et évite d’ajouter dans le corps du verset un pronom objet absent de la source.
