  source_fidelity: 'Le sens général est bien rendu : l’intervalle bref, la seconde accusation et le démenti de Pierre sont conservés. Toutefois, « mon ami » ajoute une nuance de familiarité ou de bienveillance qui n’est pas portée par le vocatif grec Ἄνθρωπε. « Non » ajoute également une particule absente du grec, tandis que « répondit » est un léger enrichissement par rapport à « dit ».'
