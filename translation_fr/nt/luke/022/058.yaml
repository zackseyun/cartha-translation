  text: καὶ μετὰ βραχὺ ἕτερος ἰδὼν αὐτὸν ἔφη· Καὶ σὺ ἐξ αὐτῶν εἶ· ὁ δὲ Πέτρος ⸀ἔφη· Ἄνθρωπε, οὐκ εἰμί.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/058.yaml
  text: And after a little while[a], another man, seeing him, said, “You also are one of them.” But Peter said, “Man, I am not.”
translation:
  language: fr
  text: 'Peu après, un autre le vit et dit : « Toi aussi, tu es l’un d’entre eux. » Mais Pierre dit : « Homme, je n’en suis pas.[a] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « je ne suis pas ». En grec, le complément reste sous-entendu et se comprend d’après l’accusation précédente.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ βραχὺ
  choice: Peu après
  rationale: Expression temporelle idiomatique indiquant qu’un bref intervalle s’est écoulé.
- source_word: ἕτερος
  choice: un autre
  rationale: Le masculin singulier français indique naturellement une autre personne de sexe masculin sans devoir ajouter « homme ».
- source_word: ἰδὼν αὐτὸν
  choice: le vit
  rationale: Le participe aoriste est rendu par un verbe coordonné, tournure plus naturelle en français narratif, sans changer la succession immédiate des actions.
- source_word: Καὶ σὺ ἐξ αὐτῶν εἶ
  choice: Toi aussi, tu es l’un d’entre eux
  rationale: Rend idiomatiquement l’appartenance au groupe visé par l’accusation, tout en conservant l’insistance de καὶ σὺ.
- source_word: Ἄνθρωπε
  choice: mon ami
  rationale: En apostrophe, « homme » serait peu naturel en français moderne. « Mon ami » garde l’adresse directe et vive sans lui attribuer un titre honorifique.
- source_word: οὐκ εἰμί
  choice: je n’en suis pas
  rationale: Le pronom « en » reprend naturellement en français le groupe mentionné juste avant, tout en conservant la brièveté du démenti.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La ponctuation met en relief la riposte brusque de Pierre. « Mon ami » évite le calque peu idiomatique « Homme ! » ; la note signale l’ellipse exacte du grec.
