id: LUK.22.22
reference: Luke 22:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸂ὅτι ὁ υἱὸς μὲν⸃ τοῦ ἀνθρώπου ⸂κατὰ τὸ ὡρισμένον πορεύεται⸃, πλὴν οὐαὶ τῷ ἀνθρώπῳ ἐκείνῳ δι’ οὗ παραδίδοται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/022.yaml
  text: For the Son of Man indeed goes as it has been determined[a], but woe to that man through whom he is betrayed.
translation:
  language: fr
  text: Car le Fils de l’homme s’en va selon ce qui a été déterminé, mais malheur à cet homme par qui il est livré[a] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « trahi ». Le verbe grec peut signifier « livrer » ou « trahir » selon le contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Car
  rationale: Introduit naturellement en français la raison de la déclaration précédente.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: le Fils de l’homme
  rationale: Rendu français consacré qui préserve le titre et ses résonances intertextuelles.
- source_word: μέν … πλὴν
  choice: … mais
  rationale: Le français exprime clairement l’opposition entre le destin déterminé du Fils de l’homme et le malheur annoncé au responsable, sans alourdir la phrase par un équivalent explicite de μέν.
- source_word: κατὰ τὸ ὡρισμένον
  choice: selon ce qui a été déterminé
  rationale: Conserve la conformité à une détermination préalable ainsi que le passif, sans préciser dans le texte qui en est l’auteur.
- source_word: πορεύεται
  choice: s’en va
  rationale: Expression française naturelle qui rend le mouvement de Jésus vers le sort qui l’attend, sans expliciter sa mort.
- source_word: οὐαὶ
  choice: malheur à
  rationale: Préserve la force prophétique de la lamentation et de l’annonce de jugement.
- source_word: τῷ ἀνθρώπῳ ἐκείνῳ
  choice: à cet homme
  rationale: Désigne fidèlement l’individu masculin précis visé dans le contexte.
- source_word: δι’ οὗ
  choice: par qui
  rationale: Rend naturellement en français l’agence exprimée par διά avec le génitif.
- source_word: παραδίδοται
  choice: il est livré
  rationale: Préserve le sens fondamental et l’ambiguïté lexicale du verbe, qui peut désigner la remise de Jésus aux autorités tout en impliquant ici la trahison de Judas.
theological_decisions:
- issue: Rapport entre la détermination divine et la responsabilité humaine
  choice: Maintenir côte à côte ce qui a été déterminé et le malheur annoncé à l’homme par qui Jésus est livré.
  alternative: Atténuer soit la détermination préalable, soit la culpabilité de l’homme.
  rationale: Le grec juxtapose explicitement les deux affirmations sans expliquer leur articulation; la traduction conserve cette tension.
- issue: Agent implicite de la détermination
  choice: Employer le passif « a été déterminé » sans nommer Dieu.
  alternative: Traduire « selon ce que Dieu a déterminé ».
  rationale: Le contexte peut suggérer une détermination divine, mais l’agent n’est pas exprimé dans le grec; il ne convient donc pas de l’ajouter au texte.
translation_notes:
  register: Français international moderne, digne et accessible. « S’en va » conserve l’idiome de mouvement sans paraphrase excessive; « livré » maintient mieux que le seul « trahi » le réseau lexical de la remise de Jésus aux autorités.
