id: LUK.22.7
reference: Luke 22:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἦλθεν δὲ ἡ ἡμέρα τῶν ἀζύμων, ⸀ᾗ ἔδει θύεσθαι τὸ πάσχα·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/007.yaml
  text: Then the day of Unleavened Bread came[a], on which the Passover had to be sacrificed.
translation:
  language: fr
  text: Puis arriva le jour des Pains sans levain, où l’on devait sacrifier la Pâque[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’agneau pascal » ou « le sacrifice pascal ». Le terme grec peut désigner la célébration de la Pâque ou, ici, plus précisément la victime offerte en sacrifice.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἦλθεν
  choice: arriva
  rationale: L’aoriste de ἔρχομαι exprime ici l’arrivée d’un jour; « arriva » est naturel en français narratif et conserve cette image temporelle.
- source_word: δὲ
  choice: Puis
  rationale: δέ marque ici la progression du récit; « Puis » rend clairement la succession sans donner au connecteur une valeur adversative.
- source_word: ἡ ἡμέρα τῶν ἀζύμων
  choice: le jour des Pains sans levain
  rationale: Le singulier « jour » respecte le grec, tandis que « des Pains sans levain » est l’appellation française courante de cette période festive juive.
- source_word: ᾗ
  choice: où
  rationale: Le relatif datif a une valeur temporelle et renvoie à « jour »; « où » est plus naturel en français actuel que « durant lequel ».
- source_word: ἔδει
  choice: l’on devait
  rationale: L’imparfait impersonnel exprime une nécessité prescrite par le calendrier cultuel; « devait » en restitue sobrement l’obligation.
- source_word: θύεσθαι
  choice: sacrifier
  rationale: Dans ce contexte cultuel, θύω désigne la mise à mort sacrificielle; « sacrifier » conserve explicitement cette dimension rituelle.
- source_word: τὸ πάσχα
  choice: la Pâque
  rationale: πάσχα peut désigner la fête, le repas ou, par métonymie ici, la victime pascale. « La Pâque » reste proche de la formulation grecque, tandis que le verbe « sacrifier » oriente vers la victime.
theological_decisions:
- issue: Référent de τὸ πάσχα dans un contexte sacrificiel
  choice: « la Pâque » dans le texte principal, le sens de victime sacrificielle étant indiqué par « sacrifier »
  alternative: « l’agneau pascal » ou « le sacrifice pascal »
  rationale: Le grec demeure lexicalement plus large que « agneau » et peut désigner la célébration ou sa victime. Ne pas expliciter « agneau » dans le texte principal préserve cette amplitude, tandis qu’une note rend transparent le sens contextuel probable.
translation_notes:
  register: Français international moderne, naturel et digne. « Pains sans levain » et « Pâque » sont traités comme des noms de fête; la tournure « où l’on devait » évite une construction passive lourde tout en conservant la nécessité cultuelle.
