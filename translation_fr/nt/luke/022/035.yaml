id: LUK.22.35
reference: Luke 22:35
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ εἶπεν αὐτοῖς· Ὅτε ἀπέστειλα ὑμᾶς ἄτερ βαλλαντίου καὶ πήρας καὶ ὑποδημάτων, μή τινος ὑστερήσατε; οἱ δὲ εἶπαν· Οὐθενός.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/035.yaml
  text: And he said to them[a], “When I sent you out without a money bag and a travel bag and sandals, did you lack anything?” And they said, “Nothing.”
translation:
  language: fr
  text: 'Puis il leur dit : « Quand je vous ai envoyés sans bourse, sans sac de voyage[a] ni sandales, avez-vous manqué de quelque chose ? » Ils répondirent : « De rien. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « besace ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄτερ
  choice: sans
  rationale: La préposition exprime l’absence. « Sans » est l’équivalent français le plus direct et naturel; il régit ici les trois éléments de l’énumération.
- source_word: βαλλαντίου
  choice: bourse
  rationale: Le terme désigne un petit contenant destiné à l’argent. « Bourse » est concis, traditionnel dans ce contexte et reste clair en français moderne.
- source_word: πήρας
  choice: sac de voyage
  rationale: Le mot désigne un sac servant à transporter des provisions ou des effets en voyage. « Sac de voyage » en communique clairement la fonction, tandis que « besace » demeure une possibilité plus concrète mais moins courante.
- source_word: ὑποδημάτων
  choice: sandales
  rationale: Dans le cadre des déplacements au Ier siècle, « sandales » est une désignation culturellement appropriée et immédiatement compréhensible.
- source_word: μή τινος ὑστερήσατε
  choice: avez-vous manqué de quelque chose ?
  rationale: La formulation rend directement ὑστερέω, « manquer de, être privé de », et conserve la question qui appelle une réponse négative.
- source_word: Οὐθενός
  choice: De rien.
  rationale: Le génitif grec répond elliptiquement au verbe « manquer de ». « De rien » préserve cette construction et la brièveté de la réponse.
- source_word: ἀπέστειλα
  choice: je vous ai envoyés
  rationale: Dans ce contexte de mission, le verbe exprime l’envoi des disciples. Le français n’a pas besoin d’ajouter « en mission » ou « au loin », que le grec ne formule pas explicitement.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et narratif. La répétition de « sans » devant les deux premiers noms clarifie l’énumération, tandis que « ni » relie naturellement le dernier élément. Le masculin pluriel « envoyés » suit le groupe de disciples visé par le contexte.
