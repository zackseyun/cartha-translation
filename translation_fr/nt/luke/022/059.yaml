id: LUK.22.59
reference: Luke 22:59
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ διαστάσης ὡσεὶ ὥρας μιᾶς ἄλλος τις διϊσχυρίζετο λέγων· Ἐπ’ ἀληθείας καὶ οὗτος μετ’ αὐτοῦ ἦν, καὶ γὰρ Γαλιλαῖός ἐστιν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/059.yaml
  text: And after about one hour had passed[a], another man insisted, saying, “Truly, this man also was with him, for he too is a Galilean.”
translation:
  language: fr
  text: 'Environ une heure plus tard, quelqu’un d’autre[a] affirma avec insistance : « C’est vrai, cet homme aussi était avec lui, car lui aussi est Galiléen. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un autre homme »; l’expression grecque est indéfinie, bien que le contexte puisse suggérer un homme.
    reason: lexical_alternative
lexical_decisions:
- source_word: διαστάσης ὡσεὶ ὥρας μιᾶς
  choice: Environ une heure plus tard
  rationale: Le génitif absolu indique qu’un intervalle d’environ une heure s’est écoulé. Cette formulation est naturelle en français moderne et conserve l’approximation exprimée par ὡσεὶ.
- source_word: ἄλλος τις
  choice: quelqu’un d’autre
  rationale: L’expression grecque est indéfinie et ne précise pas grammaticalement le sexe de la personne; cette traduction préserve cette indétermination.
- source_word: διϊσχυρίζετο
  choice: affirma avec insistance
  rationale: Le verbe exprime une assertion ferme ou insistante; l’imparfait grec présente l’action dans son déroulement sans exiger en français la traduction « continuait d’affirmer ».
- source_word: Ἐπ’ ἀληθείας
  choice: C’est vrai
  rationale: L’expression introduit une affirmation énergique de la véracité du propos. « C’est vrai » est idiomatique, direct et adapté au dialogue.
- source_word: οὗτος
  choice: cet homme
  rationale: Le démonstratif désigne Pierre de manière directe et accusatrice; « cet homme » en conserve la force déictique.
- source_word: μετ’ αὐτοῦ ἦν
  choice: était avec lui
  rationale: Traduction directe qui préserve l’affirmation d’une association avec Jésus sans préciser davantage sa nature.
- source_word: καὶ γὰρ
  choice: car lui aussi
  rationale: « car » rend la justification introduite par γάρ, tandis que « lui aussi » conserve la valeur additive de καί.
- source_word: Γαλιλαῖός ἐστιν
  choice: est Galiléen
  rationale: Le prédicat identifie Pierre par son origine régionale. En français, l’adjectif employé sans article est la tournure naturelle.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Le dialogue garde un ton oral ferme. L’indétermination de ἄλλος τις est maintenue dans le texte principal, et l’alternative contextuelle est signalée en note.
