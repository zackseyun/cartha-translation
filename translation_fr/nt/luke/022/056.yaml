source:
  edition: SBLGNT
  text: ἰδοῦσα δὲ αὐτὸν παιδίσκη τις καθήμενον πρὸς τὸ φῶς καὶ ἀτενίσασα αὐτῷ εἶπεν· Καὶ οὗτος σὺν αὐτῷ ἦν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/056.yaml
  text: Then a certain servant girl[a], seeing him seated by the light and looking intently at him, said, “This man also was with him.”
translation:
  language: fr
  text: 'Alors, une jeune servante le vit assis à la lumière[a]. Après l’avoir regardé fixement, elle dit : « Cet homme aussi était avec lui. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « près de la lumière ». L’expression grecque peut désigner une position proche de la source lumineuse aussi bien qu’une place dans la zone éclairée.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοῦσα
  choice: le vit
  rationale: Le participe aoriste introduit la perception qui précède la parole. Une forme verbale conjuguée donne en français un récit naturel et clair.
- source_word: δὲ
  choice: Alors
  rationale: Ici, δέ fait progresser le récit sans marquer une forte opposition.
- source_word: παιδίσκη τις
  choice: une jeune servante
  rationale: παιδίσκη désigne une jeune femme de condition servile. « Jeune servante » reste naturel en français tout en conservant l’indication d’âge et de statut; l’indéfini « une » rend suffisamment τις.
- source_word: καθήμενον πρὸς τὸ φῶς
  choice: assis à la lumière[a]
  rationale: La formulation française indique que Pierre était visible dans la zone éclairée, sans préciser abusivement la nature de la source lumineuse. La note conserve l’autre nuance spatiale possible.
- source_word: ἀτενίσασα αὐτῷ
  choice: Après l’avoir regardé fixement
  rationale: ἀτενίζω exprime un regard soutenu et attentif. La tournure temporelle rend naturellement la valeur du participe aoriste.
- source_word: Καὶ οὗτος
  choice: Cet homme aussi
  rationale: La formulation conserve la désignation appuyée de οὗτος et la valeur additive de καί dans un français idiomatique.
- source_word: σὺν αὐτῷ ἦν
  choice: était avec lui
  rationale: Traduction directe de l’idée de présence et d’association, sans préciser davantage la nature de la relation.
theological_decisions: []
