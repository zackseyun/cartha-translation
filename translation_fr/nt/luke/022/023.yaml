id: LUK.22.23
reference: Luke 22:23
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ αὐτοὶ ἤρξαντο συζητεῖν πρὸς ἑαυτοὺς τὸ τίς ἄρα εἴη ἐξ αὐτῶν ὁ τοῦτο μέλλων πράσσειν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/023.yaml
  text: And they began to discuss among themselves which one of them might be the one about to do this[a].
translation:
  language: fr
  text: Et ils se mirent à discuter entre eux pour savoir lequel d’entre eux pourrait bien être sur le point de faire cela[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « pour savoir qui, parmi eux, pourrait bien être sur le point de faire cela ». Le contexte montre que « cela » désigne l’acte de trahison annoncé au verset précédent.'
    reason: alternative lexicale et clarification du référent contextuel
lexical_decisions:
- source_word: ἤρξαντο
  choice: se mirent à
  rationale: Cette tournure française naturelle marque clairement le commencement de l’action exprimé par l’aoriste ingressif suivi de l’infinitif.
- source_word: συζητεῖν
  choice: discuter
  rationale: Le verbe peut désigner une discussion ou un débat collectif; « discuter » convient ici sans suggérer à tort une querelle.
- source_word: πρὸς ἑαυτούς
  choice: entre eux
  rationale: Cette expression rend naturellement l’interaction réciproque au sein du groupe.
- source_word: τὸ τίς ἄρα εἴη ἐξ αὐτῶν
  choice: pour savoir lequel d’entre eux pourrait bien être
  rationale: « Pour savoir » introduit naturellement la question indirecte nominalisée; « lequel d’entre eux » désigne un membre du groupe connu, tandis que « pourrait bien » conserve l’incertitude délibérative portée par ἄρα et l’optatif εἴη.
- source_word: μέλλων πράσσειν
  choice: sur le point de faire
  rationale: Cette formulation conserve la valeur d’imminence de μέλλω avec l’infinitif sans la transformer en simple intention.
- source_word: τοῦτο
  choice: cela
  rationale: Le démonstratif renvoie à l’acte annoncé au verset précédent; « cela » préserve cette référence implicite sans explicitation interprétative.
theological_decisions:
- issue: Faut-il expliciter que l’acte est la trahison de Jésus ?
  choice: Conserver la formulation générale « faire cela » dans le texte principal.
  alternative: « le trahir » ou « trahir Jésus »
  rationale: Le contexte identifie clairement l’acte, mais le grec de ce verset dit littéralement « faire cela ». L’expliciter dans le corps du texte supprimerait l’allusion voulue et ajouterait un complément absent de la phrase source.
translation_notes:
  register: Français international moderne, naturel et digne. « Se mirent à discuter entre eux » est idiomatique sans être familier; « pourrait bien » restitue la nuance délibérative sans alourdir excessivement la phrase.
