source:
  edition: SBLGNT
  text: καὶ περικαλύψαντες ⸂αὐτὸν ἐπηρώτων⸃ λέγοντες· Προφήτευσον, τίς ἐστιν ὁ παίσας σε;
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/064.yaml
  text: And after covering him[a], they kept asking, saying, “Prophesy! Who is the one who struck you?”
translation:
  language: fr
  text: 'Après lui avoir couvert le visage[a], ils ne cessaient de lui demander : « Prophétise ! Qui est celui qui t’a frappé ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Après lui avoir bandé les yeux ».
    reason: Alternative lexicale contextuelle pour περικαλύψαντες.
lexical_decisions:
- source_word: περικαλύψαντες
  choice: Après lui avoir couvert le visage
  rationale: Le participe exprime le fait de couvrir ou voiler. En français, « couvrir le visage » reste proche du grec tout en rendant naturellement l’obstruction de la vue suggérée par le contexte, sans préciser qu’un bandeau a été utilisé.
- source_word: ἐπηρώτων
  choice: ils ne cessaient de lui demander
  rationale: L’imparfait grec suggère une action prolongée ou répétée. Cette formulation en restitue clairement la valeur itérative.
- source_word: λέγοντες
  choice: introduit directement par les deux-points
  rationale: Le participe introduit les paroles prononcées. En français naturel, les deux-points rendent cette fonction sans alourdir la phrase avec « en disant ».
- source_word: Προφήτευσον
  choice: Prophétise !
  rationale: L’impératif aoriste est rendu directement et conserve le ton de défi moqueur adressé à Jésus.
- source_word: τίς ἐστιν ὁ παίσας σε
  choice: Qui est celui qui t’a frappé ?
  rationale: Cette traduction préserve la tournure substantivée de ὁ παίσας, « celui qui a frappé », ainsi que la force de παίω.
theological_decisions:
- issue: Faut-il expliciter que Jésus avait les yeux bandés ?
  choice: Conserver dans le texte principal l’idée plus générale de lui couvrir le visage
  alternative: « Après lui avoir bandé les yeux »
  rationale: Le contexte implique que sa vue était obstruée, mais le verbe grec signifie plus largement couvrir ou voiler. Le texte principal évite donc de préciser le moyen employé, tandis que la note donne la traduction contextuelle courante.
translation_notes:
  register: Français international moderne, naturel et digne. La construction « ils ne cessaient de » traduit la répétition portée par l’imparfait grec; les deux-points remplacent idiomatiquement le participe λέγοντες.
