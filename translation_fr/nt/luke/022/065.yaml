id: LUK.22.65
reference: Luke 22:65
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἕτερα πολλὰ βλασφημοῦντες ἔλεγον εἰς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/065.yaml
  text: And they were saying many other blasphemous things against him[a][b].
translation:
  language: fr
  text: Et ils proféraient contre lui beaucoup d’autres paroles blasphématoires[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « beaucoup d’autres paroles insultantes » ou « beaucoup d’autres injures ». Le verbe grec peut désigner plus largement des propos outrageants, mais « blasphématoires » en conserve ici toute la force.
    reason: lexical_alternative
  - marker: b
    text: Ou « à son adresse ». La préposition grecque indique la direction des paroles ; dans ce contexte hostile, « contre lui » en exprime mieux la portée.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Et
  rationale: Conjonction simple qui relie cette phrase aux mauvais traitements rapportés juste avant.
- source_word: ἕτερα πολλὰ
  choice: beaucoup d’autres
  rationale: Rend naturellement l’idée d’un grand nombre de paroles supplémentaires, en plus de celles déjà évoquées.
- source_word: βλασφημοῦντες
  choice: paroles blasphématoires
  rationale: Le participe de βλασφημέω peut désigner des propos outrageants, injurieux ou blasphématoires. Cette formulation française conserve la forte gravité du terme sans réduire le sens à de simples insultes.
- source_word: ἔλεγον
  choice: proféraient
  rationale: L’imparfait grec présente une action en cours ou répétée. « Proféraient » convient naturellement à des paroles hostiles et maintient cet aspect duratif.
- source_word: εἰς αὐτόν
  choice: contre lui
  rationale: Dans le contexte de paroles hostiles, εἰς peut exprimer leur orientation adverse. « Contre lui » communique clairement cette force.
theological_decisions:
- issue: Faut-il rendre βλασφημοῦντες par un terme général désignant l’injure ou conserver sa portée plus forte ?
  choice: Conserver la portée forte avec « paroles blasphématoires »
  alternative: « paroles insultantes » ou « injures »
  rationale: Le champ sémantique autorise aussi l’idée d’outrage ou d’injure, mais « blasphématoires » préserve la gravité maximale du mot dans ce contexte, sans ajouter une affirmation doctrinale absente du verset.
translation_notes:
  register: Français international moderne, digne et accessible. « Proféraient » soutient le contexte judiciaire et violent sans être archaïque ; l’ordre des mots met nettement en relief l’hostilité dirigée contre Jésus.
