  text: κἀγὼ διατίθεμαι ὑμῖν, καθὼς διέθετό μοι ὁ πατήρ μου βασιλείαν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/029.yaml
  text: And I appoint to you, just as my Father appointed to me, a kingdom.
translation:
  language: fr
  text: Et moi, je vous confère un royaume, comme mon Père me l’a conféré.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, en soulignant la nuance d’alliance : « Et moi, je vous accorde un royaume en vertu d’une alliance, comme mon Père m’en a accordé un en vertu d’une alliance. » Le verbe grec peut désigner le fait de disposer ou de conférer, mais il peut aussi avoir une nuance d’alliance.'
    reason: alternative_reading
lexical_decisions:
- source_word: κἀγὼ
  choice: Et moi, je
  rationale: La crase καί + ἐγώ associe la continuité (« et ») à une mise en relief du locuteur. « Et moi, je » restitue naturellement cette insistance en français.
- source_word: διατίθεμαι / διέθετό
  choice: confère / a conféré
  rationale: Le verbe peut signifier disposer, attribuer, conférer ou établir par alliance. Avec « un royaume » pour objet, « conférer » exprime clairement l’octroi d’une dignité ou d’une autorité et permet de conserver le parallélisme verbal entre l’action de Jésus et celle du Père.
- source_word: ὑμῖν / μοι
  choice: vous / me
  rationale: Ces pronoms au datif désignent les bénéficiaires respectifs. Les pronoms compléments indirects français rendent ce rapport de manière naturelle.
- source_word: καθὼς
  choice: comme
  rationale: « Comme » introduit clairement la correspondance entre l’action de Jésus envers les disciples et celle du Père envers Jésus.
- source_word: ὁ πατήρ μου
  choice: mon Père
  rationale: Formulation française idiomatique qui conserve explicitement la relation filiale.
- source_word: βασιλείαν
  choice: un royaume
  rationale: Dans ce contexte, le terme désigne vraisemblablement le royaume ou la souveraineté royale accordée, en lien avec la table et les trônes du verset suivant. « Un royaume » conserve l’image concrète sans exclure la notion de règne.
theological_decisions:
- issue: Faut-il rendre διατίθεμαι par un vocabulaire explicitement lié à l’alliance ?
  choice: confère
  alternative: accorde par alliance / établit par alliance
  rationale: Le verbe peut avoir une portée testamentaire ou liée à l’alliance, mais la construction avec « un royaume » permet aussi le sens plus général de conférer ou d’attribuer. Le texte principal ne tranche donc pas en faveur d’une formulation théologique plus précise que le grec ; la nuance possible d’alliance est signalée en note.
translation_notes:
  register: Français international moderne, digne et fluide. La répétition de « conférer » maintient le parallélisme grec, tandis que « Et moi, je » en préserve l’emphase. L’objet est placé dans l’ordre naturel du français plutôt qu’à la fin de toute la comparaison.
