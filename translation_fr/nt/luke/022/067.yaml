id: LUK.22.67
reference: Luke 22:67
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: λέγοντες· Εἰ σὺ εἶ ὁ χριστός, εἰπὸν ἡμῖν. εἶπεν δὲ αὐτοῖς· Ἐὰν ὑμῖν εἴπω οὐ μὴ πιστεύσητε·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/067.yaml
  text: saying[a], “If you are the Messiah, tell us.” But he said to them, “If I tell you, you will certainly not believe;”
translation:
  language: fr
  text: 'Ils disaient : « Si tu es le Messie[a], dis-le-nous. » Mais il leur répondit : « Si je vous le dis, vous ne croirez certainement pas ; »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le Christ ».
    reason: Signale l’autre rendu traditionnel du titre grec ὁ χριστός.
lexical_decisions:
- source_word: λέγοντες
  choice: Ils disaient
  rationale: Le participe présent se rattache au récit précédent et introduit les paroles du conseil ; une proposition conjuguée est naturelle en français tout en gardant l’aspect continu.
- source_word: Εἰ σὺ εἶ
  choice: Si tu es
  rationale: Conserve la forme conditionnelle explicite et l’insistance portée par σὺ, perceptible ici dans le pronom sujet français.
- source_word: ὁ χριστός
  choice: le Messie
  rationale: Dans cet interrogatoire juif, le terme fonctionne comme un titre messianique ; « Messie » en restitue clairement la portée.
- source_word: εἰπὸν ἡμῖν
  choice: dis-le-nous
  rationale: Formulation française idiomatique ; le pronom « le » reprend la proposition « tu es le Messie » sans en modifier le sens.
- source_word: εἶπεν δὲ αὐτοῖς
  choice: Mais il leur répondit
  rationale: « Mais » rend le léger contraste marqué par δέ, et « répondit » exprime naturellement en français la fonction contextuelle de εἶπεν.
- source_word: Ἐὰν ὑμῖν εἴπω
  choice: Si je vous le dis
  rationale: Rend simplement la condition éventuelle avec le présent français ; « le » renvoie à l’affirmation demandée.
- source_word: οὐ μὴ πιστεύσητε
  choice: vous ne croirez certainement pas
  rationale: La tournure οὐ μή avec le subjonctif constitue une négation emphatique ; « certainement pas » en conserve la force sans archaïsme.
theological_decisions:
- issue: Traduction du titre Χριστός
  choice: Messie
  alternative: Christ
  rationale: « Messie » manifeste le sens du titre dans le cadre des attentes juives, tandis que « Christ » peut être compris par le lecteur moderne comme un nom propre. Une note conserve l’équivalent traditionnel.
translation_notes:
  register: Français international moderne, naturel et digne. La structure conditionnelle et la négation emphatique du grec sont conservées. Le point-virgule final maintient le lien syntaxique avec le verset suivant.
