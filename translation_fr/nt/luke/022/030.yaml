id: LUK.22.30
reference: Luke 22:30
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἵνα ⸀ἔσθητε καὶ πίνητε ἐπὶ τῆς τραπέζης μου ⸂ἐν τῇ βασιλείᾳ μου⸃, καὶ ⸀καθήσεσθε ἐπὶ θρόνων ⸂τὰς δώδεκα φυλὰς κρίνοντες⸃ τοῦ Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/030.yaml
  text: so that you may eat and drink at my table in my kingdom[a], and you will sit on thrones judging the twelve tribes of Israel.
translation:
  language: fr
  text: afin que vous mangiez et buviez à ma table dans mon royaume, et vous siégerez sur des trônes et jugerez[a] les douze tribus d’Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « gouvernerez » ou « exercerez l’autorité sur ».
    reason: Alternative lexicale possible pour κρίνοντες, qui peut comporter une dimension de gouvernement en plus de son sens judiciaire.
lexical_decisions:
- source_word: ἵνα
  choice: afin que
  rationale: Introduit le but ou le résultat découlant de la promesse précédente, avec une tournure française naturelle qui conserve la valeur finale.
- source_word: ἔσθητε καὶ πίνητε
  choice: vous mangiez et buviez
  rationale: Les deux subjonctifs sous la dépendance de ἵνα sont rendus par le subjonctif français après « afin que », sans ajouter une modalité absente.
- source_word: ἐπὶ τῆς τραπέζης μου
  choice: à ma table
  rationale: Expression idiomatique française qui préserve l’image de la communion autour de la table.
- source_word: ἐν τῇ βασιλείᾳ μου
  choice: dans mon royaume
  rationale: Dans ce contexte de banquet et de trônes, « royaume » exprime naturellement la sphère royale, tout en laissant présente l’idée de règne.
- source_word: καθήσεσθε ἐπὶ θρόνων
  choice: vous siégerez sur des trônes
  rationale: « Siéger » convient à la position d’autorité évoquée par les trônes et rend le futur de manière concise et digne.
- source_word: κρίνοντες
  choice: jugerez
  rationale: La coordination verbale produit un français plus naturel que le participe « jugeant », tout en conservant le sens judiciaire principal de κρίνω.
- source_word: τὰς δώδεκα φυλὰς τοῦ Ἰσραήλ
  choice: les douze tribus d’Israël
  rationale: Formulation transparente et consacrée qui maintient la référence collective et historique à Israël.
theological_decisions:
- issue: Nature du rôle futur des disciples à l’égard des douze tribus d’Israël
  choice: jugerez
  alternative: gouvernerez ou exercerez l’autorité sur
  rationale: κρίνω peut évoquer à la fois l’exercice du jugement et, dans certains contextes, celui du gouvernement. Le texte principal retient le sens lexical le plus direct sans réduire ce jugement à la condamnation; la note conserve la nuance possible d’autorité gouvernementale.
translation_notes:
  register: Français international moderne, clair et digne. Le subjonctif après « afin que » conserve la structure finale grecque. « Siégerez » maintient l’imagerie royale et judiciaire. Le marqueur de note est placé après « jugerez », terme auquel la variante lexicale se rapporte.
