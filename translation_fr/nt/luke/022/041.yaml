revisions:
- from: Et lui s’éloigna d’eux à peu près à la distance d’un jet de pierre[a] ; puis il se mit à genoux[b] et priait.
  to: Et lui, il s’éloigna d’eux d’environ un jet de pierre[a] et, s’étant mis à genoux[b], il priait.
  rationale: La révision conserve l’emphase légère de αὐτός par « Et lui, il », allège l’expression de distance tout en gardant ὡσεὶ (« environ »), et rend la relation entre le participe θεὶς et l’imparfait προσηύχετο par « s’étant mis à genoux, il priait ». Aucun ajout interprétatif ou doctrinal n’est introduit.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T11:05:14Z'
review_pass:
  verdict: revise
  source_fidelity: 'Le sens est globalement fidèle : ἀπεσπάσθη est bien rendu par « s’éloigna », ὡσεὶ conserve l’approximation, et « priait » rend convenablement l’imparfait προσηύχετο. Toutefois, la coordination « il se mit à genoux et priait » associe de façon maladroite un passé simple et un imparfait là où le grec présente l’agenouillement comme une action participiale préalable à la prière en cours.'
  naturalness: « À peu près à la distance d’un jet de pierre » est compréhensible mais pesant. « D’environ un jet de pierre » est plus idiomatique en français moderne. La reprise par un participe composé rend également la succession des actions plus fluide et plus proche de la syntaxe grecque.
  terminology: « Jet de pierre » est une expression claire et internationale pour la mesure imagée. « Se mettre à genoux » rend naturellement l’idiome θεὶς τὰ γόνατα sans introduire l’idée plus forte de tomber à genoux.
  issues:
  - severity: medium
    issue: Enchaînement verbal maladroit et aspectuellement imprécis
    rationale: « Puis il se mit à genoux et priait » juxtapose un passé simple et un imparfait sous une même coordination. Le participe aoriste θεὶς est mieux rendu par « s’étant mis à genoux », suivi de l’imparfait « il priait ».
  - severity: low
    issue: Formulation de distance lourde
    rationale: « à peu près à la distance d’un jet de pierre » répète inutilement l’idée d’approximation et de distance. « d’environ un jet de pierre » conserve exactement la valeur approximative de ὡσεὶ dans une formulation plus naturelle.
  revised_text: Et lui, il s’éloigna d’eux d’environ un jet de pierre[a] et, s’étant mis à genoux[b], il priait.
  revised_footnotes:
