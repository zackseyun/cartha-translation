source:
  edition: SBLGNT
  text: καὶ αὐτὸς ἀπεσπάσθη ἀπ’ αὐτῶν ὡσεὶ λίθου βολήν, καὶ θεὶς τὰ γόνατα προσηύχετο
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/041.yaml
  text: And he withdrew from them about a stone’s throw[a], and kneeling down[b], he was praying.
translation:
  language: fr
  text: Et lui, il s’éloigna d’eux d’environ un jet de pierre[a] et, s’étant mis à genoux[b], il priait.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « à la distance approximative d’un jet de pierre ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « ayant posé les genoux », c’est-à-dire « s’étant mis à genoux ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεσπάσθη
  choice: s’éloigna
  rationale: Le passif grec peut évoquer le fait de se détacher ou de s’arracher au groupe, mais le contexte décrit idiomatiquement Jésus qui prend ses distances avec les disciples. « S’éloigna » est naturel et n’impose pas l’idée qu’une force extérieure l’aurait entraîné.
- source_word: ὡσεὶ λίθου βολήν
  choice: à peu près à la distance d’un jet de pierre
  rationale: Cette formulation conserve à la fois l’expression concrète de distance et la valeur approximative de ὡσεὶ.
- source_word: θεὶς τὰ γόνατα
  choice: il se mit à genoux
  rationale: L’expression signifie littéralement « ayant posé les genoux » et désigne idiomatiquement l’action de s’agenouiller. « Se mit à genoux » est clair et naturel en français moderne.
- source_word: προσηύχετο
  choice: priait
  rationale: L’imparfait grec présente la prière comme une action en cours. L’imparfait français « priait » en préserve la valeur durative sans ajouter explicitement l’idée de commencement.
- source_word: αὐτὸς
  choice: lui
  rationale: Le pronom grec est exprimé et légèrement emphatique. « Et lui » conserve ce relief, notamment le contraste narratif avec ceux dont Jésus s’éloigne.
- source_word: καὶ
  choice: Et / puis
  rationale: Le premier καὶ maintient la continuité narrative avec « Et » ; le second relie naturellement les actions successives par « puis », sans ajouter de causalité.
theological_decisions:
- issue: Posture de prière et présentation christologique
  choice: Décrire simplement Jésus qui s’éloigne, se met à genoux et prie.
  alternative: Ajouter une interprétation dévotionnelle ou doctrinale de son geste.
  rationale: Le texte rapporte des actions physiques et une prière sans en expliciter ici la portée doctrinale. La traduction conserve la gravité de la scène sans commentaire confessionnel.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure « à la distance d’un jet de pierre » évite l’ambiguïté possible de « à un jet de pierre », qui peut devenir une simple expression de proximité. L’imparfait « priait » garde l’aspect continu du grec.
