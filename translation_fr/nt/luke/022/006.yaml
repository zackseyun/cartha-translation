reference: Luke 22:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἐξωμολόγησεν, καὶ ἐζήτει εὐκαιρίαν τοῦ παραδοῦναι αὐτὸν ⸂ἄτερ ὄχλου αὐτοῖς⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/006.yaml
  text: And he agreed[a], and began seeking an opportunity to hand him over to them apart from the crowd.
translation:
  language: fr
  text: Il accepta et se mit à chercher une occasion de le leur livrer[a] en l’absence de la foule.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le trahir ». Le verbe grec signifie littéralement « livrer » ou « remettre » ; dans le cas de Judas, « trahir » est une traduction interprétative qui convient au contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξωμολόγησεν
  choice: accepta
  rationale: Dans ce contexte, le verbe exprime l’assentiment de Judas à la proposition des chefs des prêtres. « Il accepta » est naturel en français et convient mieux ici qu’un sens tel que « confessa ouvertement ».
- source_word: ἐζήτει
  choice: se mit à chercher
  rationale: L’imparfait grec présente une action en cours et peut, dans cette progression narrative, avoir une nuance inchoative. « Se mit à chercher » marque naturellement le début de cette démarche après son accord.
- source_word: εὐκαιρίαν
  choice: une occasion
  rationale: Ce choix rend simplement et idiomatiquement l’idée d’un moment favorable ou propice.
- source_word: τοῦ παραδοῦναι αὐτόν
  choice: de le leur livrer
  rationale: « Livrer » reste proche du sens de παραδίδωμι, tout en étant naturel dans le récit de la Passion. Le pronom « leur » rend aussi αὐτοῖς sans lourdeur.
- source_word: ἄτερ ὄχλου
  choice: loin de la foule
  rationale: Cette formulation française exprime une remise accomplie à l’écart de la foule. Elle est naturelle et conserve l’idée que la foule ne doit pas être présente.
- source_word: αὐτοῖς
  choice: leur
  rationale: Le pronom indirect désigne les chefs des prêtres et les officiers mentionnés dans le contexte immédiat, destinataires de la remise de Jésus.
theological_decisions:
- issue: Valeur de παραδίδωμι dans le rôle de Judas
  choice: livrer
  alternative: trahir
  rationale: « Trahir » explicite justement la nature morale de l’acte, mais « livrer » préserve le sens lexical fondamental et les échos du même verbe tout au long du récit de la Passion, sans atténuer le contexte de trahison.
translation_notes:
  register: Français international moderne, sobre et narratif. « Accepta » évite une tournure pesante ; « se mit à chercher » rend la progression du récit. La formulation demeure digne et accessible, sans ajouter d’interprétation confessionnelle.
