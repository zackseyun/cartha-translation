  variant: modern international French
source:
  edition: SBLGNT
  text: Ἤγγιζεν δὲ ἡ ἑορτὴ τῶν ἀζύμων ἡ λεγομένη Πάσχα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/001.yaml
  text: The Feast of Unleavened Bread[a], which is called Passover, was drawing near.
translation:
  language: fr
  text: La fête des Pains sans levain[a], appelée la Pâque, approchait.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La Pâque et la fête des Pains sans levain étaient des célébrations étroitement liées; dans l’usage juif, elles pouvaient être désignées ensemble ou par des noms qui se recoupaient.
    reason: Note culturelle expliquant l’emploi conjoint ou interchangeable des deux appellations.
lexical_decisions:
- source_word: Ἤγγιζεν
  choice: approchait
  rationale: L’imparfait grec présente la fête comme étant en train d’approcher; l’imparfait français restitue naturellement cet aspect.
- source_word: δὲ
  choice: non rendu explicitement
  rationale: Ici, δέ sert de légère transition narrative. Le rendre par « or » ou « alors » alourdirait ou préciserait excessivement le lien; l’enchaînement français suffit.
- source_word: ἡ ἑορτὴ τῶν ἀζύμων
  choice: la fête des Pains sans levain
  rationale: Cette formulation française courante désigne clairement la fête juive et conserve la valeur religieuse de ἑορτή ainsi que le sens de ἄζυμα.
- source_word: ἡ λεγομένη
  choice: appelée
  rationale: Le participe passif est rendu par une apposition concise et naturelle qui conserve la fonction explicative de l’expression grecque.
- source_word: Πάσχα
  choice: la Pâque
  rationale: « La Pâque » est le nom français traditionnel et toujours intelligible de la fête juive; le singulier la distingue de la fête chrétienne de Pâques.
theological_decisions:
- issue: Rapport entre la fête des Pains sans levain et la Pâque
  choice: 'Conserver l’identification explicative de Luc : « la fête des Pains sans levain, appelée la Pâque »'
  alternative: Présenter la Pâque et la fête des Pains sans levain comme deux célébrations strictement distinctes
  rationale: La syntaxe de Luc applique « appelée la Pâque » à la fête mentionnée. La traduction préserve cette formulation et l’usage ancien où les appellations pouvaient se recouvrir, sans imposer une distinction chronologique étrangère au verset.
translation_notes:
  register: Français international moderne, sobre et digne. « Pains sans levain » est plus immédiatement compréhensible que le substantif traditionnel « Azymes », tandis que « la Pâque » conserve la désignation française précise de la fête juive.
