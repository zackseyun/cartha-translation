  text: ὁ δὲ εἶπεν· Λέγω σοι, Πέτρε, οὐ ⸀φωνήσει σήμερον ἀλέκτωρ ⸀ἕως τρίς ⸂με ἀπαρνήσῃ εἰδέναι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/034.yaml
  text: But he said[a], “I tell you, Peter, a rooster will not crow today until you deny three times that you know me.”
translation:
  language: fr
  text: 'Mais il dit : « Je te le dis, Pierre, aujourd’hui, le coq ne chantera pas avant que tu aies nié trois fois me connaître. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ εἶπεν
  choice: Mais il dit
  rationale: δέ marque ici une légère opposition dans l’échange; « Mais » rend naturellement cette transition.
- source_word: Λέγω σοι
  choice: Je te le dis
  rationale: Formule directe et courante qui conserve la force du présent λέγω.
- source_word: Πέτρε
  choice: Pierre
  rationale: Forme française traditionnelle et courante du nom personnel grec.
- source_word: οὐ φωνήσει σήμερον ἀλέκτωρ
  choice: aujourd’hui, le coq ne chantera pas
  rationale: Avec ἀλέκτωρ pour sujet, φωνέω désigne le chant du coq. L’article défini est idiomatique en français pour évoquer ce chant caractéristique.
- source_word: ἕως
  choice: avant que
  rationale: Après une principale négative, « ne… pas avant que » exprime naturellement en français la limite temporelle indiquée par ἕως, sans suggérer davantage ce qui se produira ensuite.
- source_word: τρίς
  choice: trois fois
  rationale: Équivalent français moderne et direct de l’adverbe.
- source_word: με ἀπαρνήσῃ εἰδέναι
  choice: tu aies nié trois fois me connaître
  rationale: Cette formulation conserve εἰδέναι et précise que le reniement porte sur le fait de connaître Jésus, plutôt que de réduire l’expression à un simple « me renier ».
theological_decisions:
- issue: Nature du reniement prédit à Pierre
  choice: Rendre explicitement le reniement comme le fait de nier connaître Jésus.
  alternative: « avant que tu m’aies renié trois fois »
  rationale: Le grec contient εἰδέναι (« connaître »). Le conserver maintient la portée précise de la prédiction sans l’élargir à une répudiation générale de Jésus.
translation_notes:
  register: Français international moderne, naturel et digne. La construction « ne… pas avant que » évite la lourdeur d’un calque avec « jusqu’à ce que »; le subjonctif passé présente le triple reniement comme accompli avant le chant annoncé.
