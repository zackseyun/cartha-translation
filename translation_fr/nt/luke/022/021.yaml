  text: πλὴν ἰδοὺ ἡ χεὶρ τοῦ παραδιδόντος με μετ’ ἐμοῦ ἐπὶ τῆς τραπέζης·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/021.yaml
  text: But look, the hand of the one betraying me is with me on the table.
translation:
  language: fr
  text: 'Mais voici : la main de celui qui me livre est avec moi sur la table.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πλὴν
  choice: Mais
  rationale: Marque ici un contraste fort avec la parole précédente, de façon naturelle en français.
- source_word: ἰδοὺ
  choice: voici
  rationale: Conserve la fonction d'attirer solennellement l'attention, sans archaïsme excessif.
- source_word: τοῦ παραδιδόντος με
  choice: de celui qui me livre
  rationale: Le participe présent garde l'action en cours ou imminente; «livrer» préserve aussi la portée judiciaire du verbe sans réduire le sens à la seule notion de trahison.
- source_word: μετ’ ἐμοῦ ἐπὶ τῆς τραπέζης
  choice: est avec moi à table
  rationale: Expression française idiomatique qui rend la présence commune au repas; traduire littéralement «sur la table» risquerait de suggérer que la main repose physiquement sur sa surface.
theological_decisions:
- issue: Sens de παραδίδωμι
  choice: livre
  alternative: trahit
  rationale: «Livre» maintient l'ambivalence entre trahison personnelle et remise de Jésus aux autorités, présente dans le vocabulaire narratif de Luc.
translation_notes:
  register: Français moderne, sobre et digne. La tournure brève «Mais voici» conserve l'effet d'annonce, tandis que «à table» évite une formulation littérale peu naturelle.
