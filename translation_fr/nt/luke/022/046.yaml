  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς· Τί καθεύδετε; ἀναστάντες προσεύχεσθε, ἵνα μὴ εἰσέλθητε εἰς πειρασμόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/046.yaml
  text: And he said to them, “Why are you sleeping? Get up and pray, so that you may not enter into temptation.”
translation:
  language: fr
  text: 'Puis il leur dit : « Pourquoi dormez-vous ? Levez-vous et priez, afin de ne pas entrer dans l’épreuve[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « dans la tentation »; le mot grec peut désigner une épreuve qui met à l’essai ou une tentation.'
    reason: Préserver l’étendue sémantique de πειρασμός sans trancher silencieusement entre les deux nuances.
lexical_decisions:
- source_word: καθεύδετε
  choice: dormez-vous
  rationale: Rend directement le présent grec dans une question naturelle en français.
- source_word: ἀναστάντες
  choice: Levez-vous
  rationale: Le participe a ici une valeur circonstancielle liée à l’impératif suivant; « Levez-vous » exprime clairement l’ordre de se relever.
- source_word: προσεύχεσθε
  choice: priez
  rationale: Équivalent courant et direct de l’impératif grec.
- source_word: πειρασμόν
  choice: épreuve
  rationale: Le terme grec peut désigner une épreuve ou une tentation; le texte français retient « épreuve » tout en signalant l’autre sens possible en note.
theological_decisions:
- issue: Sens de εἰσέλθητε εἰς πειρασμόν
  choice: entrer dans l’épreuve
  alternative: entrer en tentation
  rationale: La formulation littérale conserve l’idée d’entrer dans une situation d’épreuve, sans réduire πειρασμός à la seule sollicitation au péché. La note préserve l’ambiguïté lexicale.
translation_notes:
  register: Français moderne, international et digne. La syntaxe reste proche du grec tout en étant naturelle à l’oral comme à l’écrit; « Levez-vous » est préféré au plus soutenu « Relevez-vous » ou « Levez-vous donc ».
