  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ ὡς ἐγένετο ἡμέρα, συνήχθη τὸ πρεσβυτέριον τοῦ λαοῦ, ἀρχιερεῖς ⸀τε καὶ γραμματεῖς, καὶ ⸀ἀπήγαγον αὐτὸν εἰς τὸ συνέδριον αὐτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/066.yaml
  text: And when day came[a], the council of the elders of the people gathered together, both chief priests and scribes, and they led him away into their Sanhedrin[b],
translation:
  language: fr
  text: Quand le jour fut venu[a], le conseil des anciens du peuple se réunit, avec les chefs des prêtres et les scribes, et ils emmenèrent Jésus devant leur conseil[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « quand il fit jour » ou « à l’aube ».
    reason: lexical_alternative
  - marker: b
    text: Ou « dans leur conseil » ou « devant leur Sanhédrin ». Le mot grec peut désigner le conseil lui-même, sa séance officielle ou son lieu de réunion.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς ἐγένετο ἡμέρα
  choice: Quand le jour fut venu
  rationale: Rend naturellement l’idiome temporel tout en conservant sa construction verbale; « à l’aube » serait également possible.
- source_word: συνήχθη
  choice: se réunit
  rationale: Exprime clairement et naturellement en français le rassemblement du corps constitué, sans surinterpréter le passif grec.
- source_word: τὸ πρεσβυτέριον τοῦ λαοῦ
  choice: le conseil des anciens du peuple
  rationale: πρεσβυτέριον désigne ici le corps constitué des anciens; « conseil » rend cette dimension institutionnelle.
- source_word: ἀρχιερεῖς τε καὶ γραμματεῖς
  choice: avec les chefs des prêtres et les spécialistes de la Loi
  rationale: Le contexte présente ces groupes comme composant le conseil réuni. « Chefs des prêtres » est transparent; « spécialistes de la Loi » communique la fonction des γραμματεῖς aux lecteurs modernes.
- source_word: ἀπήγαγον αὐτόν
  choice: ils emmenèrent Jésus
  rationale: ἀπάγω signifie conduire ou emmener; le nom explicite le référent du pronom en français sans modifier le sens.
- source_word: εἰς τὸ συνέδριον αὐτῶν
  choice: devant leur tribunal
  rationale: Dans ce cadre judiciaire, συνέδριον peut désigner le conseil siégeant en audience; « devant » rend idiomatiquement le mouvement vers sa comparution, tout en signalant l’ambiguïté dans la note.
theological_decisions:
- issue: Désignation de l’instance dirigeante juive
  choice: Distinguer πρεσβυτέριον (« conseil des anciens ») et συνέδριον (« tribunal »)
  alternative: Employer deux fois « conseil », rendre συνέδριον par « Sanhédrin », ou comprendre le second terme comme le lieu de réunion
  rationale: Le grec emploie deux termes distincts. La traduction retenue préserve cette variation et le cadre judiciaire sans introduire obligatoirement le terme historique translittéré « Sanhédrin »; la note maintient l’ambiguïté entre corps, séance et lieu.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple convient au registre narratif biblique sans être archaïque. Les termes institutionnels sont rendus de manière intelligible, et les ambiguïtés de συνέδριον sont conservées en note.
