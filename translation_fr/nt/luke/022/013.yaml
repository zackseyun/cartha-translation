id: LUK.22.13
reference: Luke 22:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀπελθόντες δὲ εὗρον καθὼς ⸀εἰρήκει αὐτοῖς, καὶ ἡτοίμασαν τὸ πάσχα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/013.yaml
  text: So they went and found it just as he had told them[a], and they prepared the Passover.
translation:
  language: fr
  text: Ils partirent donc et trouvèrent les choses comme il le leur avait dit ; puis ils préparèrent la Pâque.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le repas de la Pâque » ou « l’agneau pascal ». Le terme grec peut désigner largement la célébration de la Pâque ou, plus précisément, son repas ou l’agneau sacrifié.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπελθόντες δὲ
  choice: Ils partirent donc
  rationale: Le participe aoriste marque l’action préalable; une proposition coordonnée est plus naturelle en français. « Donc » rend ici la légère progression narrative exprimée par δέ.
- source_word: εὗρον
  choice: trouvèrent tout
  rationale: Le verbe signifie « trouver ». « Tout » explicite sobrement la situation sous-entendue et prépare naturellement la comparaison, sans identifier un objet précis absent du grec.
- source_word: καθὼς εἰρήκει αὐτοῖς
  choice: comme il le leur avait dit
  rationale: « Comme » exprime la correspondance, et le plus-que-parfait rend l’antériorité de εἰρήκει. Le pronom « le » reprend de façon idiomatique ce qui avait été annoncé.
- source_word: καὶ ἡτοίμασαν
  choice: puis ils préparèrent
  rationale: « Puis » indique naturellement la succession des actions; « préparèrent » rend directement ἡτοίμασαν.
- source_word: τὸ πάσχα
  choice: la Pâque
  rationale: En français biblique courant, « la Pâque » désigne la célébration juive et conserve l’étendue sémantique du grec sans imposer dans le texte principal le repas ou l’agneau comme référent exclusif.
theological_decisions:
- issue: Portée de πάσχα dans le contexte
  choice: la Pâque
  alternative: le repas de la Pâque; l’agneau pascal
  rationale: Le terme grec peut désigner la fête, le repas ou l’agneau sacrifié. Le contexte concerne les préparatifs en vue de manger la Pâque, mais le terme lui-même reste large; la traduction principale préserve cette latitude.
translation_notes:
  register: Français international moderne, naturel et digne. La coordination évite un participe lourd, tandis que « la Pâque » conserve l’ambiguïté réelle de πάσχα.
