source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτῷ· Κύριε, μετὰ σοῦ ἕτοιμός εἰμι καὶ εἰς φυλακὴν καὶ εἰς θάνατον πορεύεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/033.yaml
  text: But he said to him, “Lord, I am ready to go with you both to prison and to death.”
translation:
  language: fr
  text: 'Mais il lui dit : « Seigneur, je suis prêt à aller avec toi, aussi bien en prison qu’à la mort. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ
  choice: Mais il
  rationale: L’article est employé comme pronom et renvoie à Pierre; δέ marque ici un léger contraste avec les paroles précédentes de Jésus.
- source_word: εἶπεν αὐτῷ
  choice: il lui dit
  rationale: Cette formulation naturelle conserve le pronom grec sans expliciter inutilement que son référent est Jésus.
- source_word: Κύριε
  choice: Seigneur
  rationale: En adresse directe à Jésus, « Seigneur » garde à la fois la valeur respectueuse du titre et sa portée théologique.
- source_word: μετὰ σοῦ
  choice: avec toi
  rationale: μετά suivi du génitif exprime l’accompagnement; « avec toi » en est l’équivalent français direct et naturel.
- source_word: ἕτοιμός εἰμι
  choice: je suis prêt
  rationale: L’expression indique la disposition et la détermination; « je suis prêt » restitue clairement l’assurance de Pierre.
- source_word: καὶ ... καὶ
  choice: aussi bien ... que
  rationale: La corrélation rend l’association emphatique des deux éventualités tout en restant idiomatique en français.
- source_word: εἰς φυλακὴν
  choice: en prison
  rationale: Dans cette construction avec πορεύεσθαι, la tournure française idiomatique est « aller en prison ».
- source_word: εἰς θάνατον
  choice: à la mort
  rationale: La formule conserve le parallélisme directionnel du grec et exprime que Pierre se dit prêt à accompagner Jésus jusque dans la mort.
- source_word: πορεύεσθαι
  choice: à aller
  rationale: Le verbe complète l’idée d’être prêt et désigne ici le fait d’accompagner Jésus dans le chemin annoncé; « aller » est simple et naturel.
theological_decisions:
- issue: Traduction de κύριος comme titre adressé à Jésus
  choice: Seigneur
  alternative: Maître
  rationale: « Seigneur » préserve la valeur habituelle du titre κύριος et sa résonance christologique, sans imposer davantage que ce qu’exprime le texte.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement correspond à l’adresse directe singulière du grec. La phrase conserve le contraste initial, le parallélisme et l’assurance solennelle de Pierre.
