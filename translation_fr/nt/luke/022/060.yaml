source:
  edition: SBLGNT
  text: εἶπεν δὲ ὁ Πέτρος· Ἄνθρωπε, οὐκ οἶδα ὃ λέγεις. καὶ παραχρῆμα ἔτι λαλοῦντος αὐτοῦ ἐφώνησεν ἀλέκτωρ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/060.yaml
  text: But Peter said[a], “Man, I do not know what you are saying.” And immediately, while he was still speaking, a rooster crowed.
translation:
  language: fr
  text: 'Mais Pierre dit : « Homme, je ne sais pas ce que tu dis. » Et aussitôt, tandis qu’il parlait encore, un coq chanta.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Mais
  rationale: Marque le contraste avec l’accusation qui précède et introduit la nouvelle dénégation de Pierre.
- source_word: Ἄνθρωπε
  choice: Mon ami
  rationale: Le vocatif s’adresse ici à un homme de manière directe. « Mon ami » est une interpellation française naturelle qui conserve la vivacité de l’échange sans ajouter la déférence de « Monsieur ».
- source_word: οὐκ οἶδα
  choice: je ne sais pas
  rationale: Rend directement le verbe οἶδα, de forme parfaite mais de sens présent.
- source_word: ὃ λέγεις
  choice: ce que tu dis
  rationale: Traduction directe et naturelle qui évite la paraphrase plus interprétative « ce que tu veux dire ».
- source_word: παραχρῆμα
  choice: aussitôt
  rationale: Exprime clairement que le chant du coq survient sans délai.
- source_word: ἔτι λαλοῦντος αὐτοῦ
  choice: tandis qu’il parlait encore
  rationale: Restitue le génitif absolu et souligne que le coq chante avant même que Pierre ait fini de parler.
- source_word: ἐφώνησεν ἀλέκτωρ
  choice: un coq chanta
  rationale: « Chanter » est le verbe français idiomatique pour le cri du coq; « coq » est le terme courant et précis.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Le tutoiement correspond au caractère direct de l’interpellation. Aucun marqueur de note n’est nécessaire, car la variante anglaise « cock/rooster » se réduit naturellement à « coq » en français.
