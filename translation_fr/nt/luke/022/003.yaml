reference: Luke 22:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Εἰσῆλθεν δὲ Σατανᾶς εἰς Ἰούδαν τὸν ⸀καλούμενον Ἰσκαριώτην, ὄντα ἐκ τοῦ ἀριθμοῦ τῶν δώδεκα·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/003.yaml
  text: Then Satan entered into Judas[a], the one called Iscariot[c][b], who was of the number of the twelve.
translation:
  language: fr
  text: Alors Satan entra dans Judas, appelé Iscariote, qui était du nombre des douze.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « qui était l’un des douze ». Littéralement : « qui était du nombre des douze ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰσῆλθεν δὲ
  choice: Alors … entra
  rationale: Dans ce récit, δέ marque la progression narrative, rendue naturellement par « Alors ». Avec εἰς, le verbe εἰσῆλθεν décrit explicitement une entrée dans une personne.
- source_word: Σατανᾶς
  choice: Satan
  rationale: Transcription française traditionnelle et claire du nom ou titre personnel employé dans le Nouveau Testament.
- source_word: εἰς Ἰούδαν
  choice: en Judas
  rationale: 'La préposition εἰς est conservée afin de rendre la formulation forte du grec : Satan entre en Judas, et ne se contente pas de l’influencer.'
- source_word: τὸν καλούμενον Ἰσκαριώτην
  choice: appelé Iscariote
  rationale: Cette tournure française naturelle conserve la fonction identificatrice du participe καλούμενον.
- source_word: ὄντα ἐκ τοῦ ἀριθμοῦ τῶν δώδεκα
  choice: qui était du nombre des douze
  rationale: La proposition relative rend naturellement le participe ὄντα, tandis que « du nombre des douze » conserve plus étroitement l’expression grecque qu’un simple « l’un des douze ».
theological_decisions:
- issue: Nature de l’action de Satan en Judas
  choice: « Satan entra en Judas »
  alternative: « Satan influença Judas » ou « Satan prit possession de Judas »
  rationale: Le grec emploie explicitement εἰσῆλθεν avec εἰς. La traduction en conserve la force sans l’affaiblir en simple influence ni préciser davantage la nature de cette entrée ou son rapport avec la responsabilité de Judas.
- issue: Statut de « douze »
  choice: 'minuscule : « les douze »'
  alternative: 'majuscule : « les Douze »'
  rationale: Le groupe apostolique est clairement identifiable dans le contexte, mais le grec ne marque pas une majuscule distinctive. La minuscule évite d’ajouter une interprétation typographique.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation demeure proche de la structure grecque tout en étant naturelle. « Iscariote » suit l’usage biblique français courant.
