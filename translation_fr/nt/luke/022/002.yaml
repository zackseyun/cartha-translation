id: LUK.22.2
reference: Luke 22:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἐζήτουν οἱ ἀρχιερεῖς καὶ οἱ γραμματεῖς τὸ πῶς ἀνέλωσιν αὐτόν, ἐφοβοῦντο γὰρ τὸν λαόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/002.yaml
  text: And the chief priests and the scribes were seeking how they might kill him[a], for they were afraid of the people.
translation:
  language: fr
  text: Les chefs des prêtres et les spécialistes de la Loi cherchaient comment le tuer[a], car ils avaient peur du peuple.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le faire mourir ».'
    reason: Alternative lexicale permettant une formulation un peu plus formelle sans modifier le sens.
lexical_decisions:
- source_word: ἐζήτουν
  choice: cherchaient
  rationale: L’imparfait grec exprime une démarche en cours dans le passé ; l’imparfait français en conserve naturellement l’aspect.
- source_word: ἀρχιερεῖς
  choice: chefs des prêtres
  rationale: Cette expression désigne clairement les dirigeants sacerdotaux de Jérusalem sans suggérer que plusieurs personnes occupaient simultanément la fonction unique de grand prêtre.
- source_word: γραμματεῖς
  choice: spécialistes de la Loi
  rationale: Cette formulation moderne et compréhensible exprime la fonction de ces experts religieux ; « scribes » serait plus formel, mais peut aujourd’hui évoquer de simples copistes.
- source_word: τὸ πῶς
  choice: comment
  rationale: L’expression grecque introduit la recherche du moyen d’agir ; « comment » en est l’équivalent français naturel.
- source_word: ἀνέλωσιν
  choice: le tuer
  rationale: Dans ce contexte, ἀναιρέω désigne clairement le fait de donner la mort. « Le tuer » préserve la force du propos sans préciser indûment une procédure judiciaire.
- source_word: ἐφοβοῦντο
  choice: avaient peur
  rationale: L’imparfait rend l’état continu exprimé par le verbe grec et emploie une tournure française courante.
- source_word: τὸν λαόν
  choice: du peuple
  rationale: « Le peuple » conserve la portée collective de λαός, contrairement à « la foule », qui limiterait le sens aux personnes alors rassemblées.
theological_decisions:
- issue: Force de ἀνέλωσιν concernant l’intention des dirigeants
  choice: le tuer
  alternative: le faire mourir
  rationale: Le texte présente sans atténuation leur intention de donner la mort à Jésus, mais ne précise pas encore par quel processus elle serait mise à exécution.
- issue: Référence de λαός
  choice: le peuple
  alternative: la foule
  rationale: Ce choix préserve l’étendue collective du terme et la tension narrative liée à la crainte d’une réaction populaire.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe reste proche du grec tout en évitant les termes susceptibles d’être opaques pour le lecteur contemporain.
