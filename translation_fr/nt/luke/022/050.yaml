id: LUK.22.50
reference: Luke 22:50
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἐπάταξεν εἷς τις ἐξ αὐτῶν ⸂τοῦ ἀρχιερέως τὸν δοῦλον⸃ καὶ ἀφεῖλεν ⸂τὸ οὖς αὐτοῦ⸃ τὸ δεξιόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/050.yaml
  text: And one of them struck the high priest’s servant and cut off his right ear[a].
translation:
  language: fr
  text: L’un d’eux frappa l’esclave[a] du grand-prêtre et lui coupa l’oreille droite.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « serviteur ». Le mot grec doulos peut désigner un esclave ou un serviteur selon le contexte.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπάταξεν
  choice: frappa
  rationale: L’aoriste de πατάσσω désigne ici un coup violent. « Frappa » est précis, naturel et d’un registre digne.
- source_word: εἷς τις ἐξ αὐτῶν
  choice: l’un d’eux
  rationale: Cette tournure française rend naturellement l’expression indéfinie grecque tout en maintenant l’anonymat du personnage chez Luc.
- source_word: τοῦ ἀρχιερέως τὸν δοῦλον
  choice: l’esclave du grand-prêtre
  rationale: Dans ce contexte social concret, δοῦλος désigne une personne placée sous l’autorité et la dépendance du grand-prêtre. « Esclave » évite d’atténuer le statut exprimé par le terme grec; « serviteur » reste signalé en note comme traduction possible.
- source_word: ἀφεῖλεν
  choice: lui coupa
  rationale: Bien que ἀφαιρέω signifie littéralement « enlever », le contexte d’un coup porté à l’oreille appelle naturellement « couper » en français. Le pronom « lui » exprime idiomatiquement le rapport avec la partie du corps.
- source_word: τὸ οὖς αὐτοῦ τὸ δεξιόν
  choice: l’oreille droite
  rationale: Le français emploie naturellement l’article défini avec une partie du corps lorsque le possesseur est déjà indiqué par le pronom « lui ». Le détail de δεξιόν est pleinement conservé.
theological_decisions:
- issue: Traduction de δοῦλος
  choice: esclave
  alternative: serviteur
  rationale: Le mot est employé ici au sens social littéral. « Esclave » rend explicitement la condition de dépendance que « serviteur » pourrait adoucir, tandis que la note conserve l’autre possibilité lexicale sans imposer une lecture confessionnelle.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste concise, et la coordination du récit est conservée sans lourdeur. Le possessif grec relatif à l’oreille est rendu par la construction française idiomatique « lui coupa l’oreille droite ».
