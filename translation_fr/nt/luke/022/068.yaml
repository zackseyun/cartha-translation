  text: But if I ask[a], you will certainly not answer.
translation:
  language: fr
  text: Mais si je vous pose une question, vous ne répondrez certainement pas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐὰν
  choice: si
  rationale: Introduit une condition éventuelle; « si » est la formulation française naturelle et n’ajoute aucune insistance absente du grec.
- source_word: δὲ
  choice: mais
  rationale: Marque le contraste avec l’affirmation précédente; « mais » en restitue clairement la valeur adversative.
- source_word: ἐρωτήσω
  choice: je vous pose une question
  rationale: Dans ce contexte d’échange, cette formulation idiomatique rend le sens de « demander/interroger » sans suggérer à tort un interrogatoire hostile mené par Jésus.
- source_word: οὐ μὴ
  choice: certainement pas
  rationale: La double négation grecque exprime une négation emphatique; « certainement pas » en conserve la force en français moderne.
- source_word: ἀποκριθῆτε
  choice: vous ne me répondrez
  rationale: Le verbe signifie « répondre »; le pronom « me », naturel en français avec « répondre », explicite seulement le destinataire déjà impliqué par la situation.
