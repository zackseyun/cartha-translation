  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ οἱ ἄνδρες οἱ συνέχοντες ⸀αὐτὸν ἐνέπαιζον αὐτῷ δέροντες,
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/063.yaml
  text: And the men who were holding him mocked him while beating him,[a]
translation:
  language: fr
  text: Et les hommes qui le retenaient se moquaient de lui tout en le frappant.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les hommes qui le détenaient ».
    reason: Alternative lexicale pour συνέχοντες, qui peut souligner la détention plutôt que la contrainte physique.
lexical_decisions:
- source_word: συνέχοντες
  choice: qui le retenaient
  rationale: Le verbe désigne ici le fait de garder Jésus sous contrainte. « Retenaient » reste concret et naturel sans préciser indûment un statut officiel de détention.
- source_word: ἐνέπαιζον
  choice: se moquaient de lui
  rationale: Cette expression rend le caractère hostile et humiliant du verbe grec dans un français moderne et courant.
- source_word: αὐτῷ
  choice: de lui
  rationale: Avec « se moquer », le datif grec se rend idiomatiquement en français par un complément introduit par « de ».
- source_word: δέροντες
  choice: tout en le frappant
  rationale: Le participe exprime une action physique concomitante. « Frappant » rend les coups sans introduire l'idée plus précise d'une flagellation.
- source_word: ἄνδρες
  choice: les hommes
  rationale: Le grec emploie le terme générique « hommes » et ne les désigne explicitement ni comme gardes ni comme soldats.
- source_word: Καὶ
  choice: Et
  rationale: La conjonction simple conserve l'enchaînement narratif du grec sans ajouter une nuance temporelle.
theological_decisions:
- issue: Identification de ceux qui maltraitent Jésus
  choice: les hommes qui le retenaient
  alternative: les gardes qui le détenaient
  rationale: Le texte dit explicitement « les hommes ». Bien que le contexte suggère des personnes chargées de la garde de Jésus, la traduction ne précise pas leur fonction au-delà du grec.
translation_notes:
  register: Français international moderne, clair et digne. La tournure « tout en le frappant » préserve la simultanéité exprimée par le participe grec.
