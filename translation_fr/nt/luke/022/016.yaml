  naturalness: La formulation révisée est idiomatique en français international moderne. « La Pâque soit accomplie » est une tournure naturelle dans un registre biblique contemporain, sans être archaïque.
  terminology: « Royaume de Dieu » conserve le terme clé βασιλεία et son expression biblique établie. La note maintient l’ambiguïté quant à la nature de l’accomplissement et ne lui impose aucune interprétation doctrinale.
