source:
  edition: SBLGNT
  text: λέγω γὰρ ὑμῖν ⸀ὅτι οὐ μὴ φάγω ⸀αὐτὸ ἕως ὅτου πληρωθῇ ἐν τῇ βασιλείᾳ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/016.yaml
  text: For I tell you that I will certainly not eat it until it is fulfilled in the kingdom of God[a][b].
translation:
  language: fr
  text: 'Car, je vous le dis : je ne la mangerai certainement pas[a] jusqu’à ce qu’elle soit accomplie dans le royaume de Dieu[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '« La » renvoie à la Pâque mentionnée au verset 15. Ou : « je n’en mangerai plus jusqu’à ce qu’elle soit accomplie dans le royaume de Dieu ». Le grec nie avec force le fait de la manger à l’avenir ; « plus » est suggéré par le contexte, mais n’est pas exprimé dans le texte grec.'
    reason: cross_reference; lexical_alternative
  - marker: b
    text: La formulation annonce l’accomplissement de la Pâque dans le royaume de Dieu, sans préciser ici de quelle manière.
    reason: theological_ambiguity
lexical_decisions:
- source_word: λέγω γὰρ ὑμῖν
  choice: Car je vous le dis
  rationale: « Je vous le dis » rend naturellement la formule de parole, tandis que « car » conserve le lien explicatif marqué par γάρ avec le verset précédent.
- source_word: ὅτι
  choice: ':'
  rationale: En français moderne, les deux-points introduisent naturellement le contenu de la déclaration et évitent la tournure plus lourde « je vous dis que je ne… ».
- source_word: οὐ μὴ φάγω
  choice: je ne mangerai certainement pas
  rationale: La combinaison οὐ μή avec le subjonctif aoriste exprime une négation future fortement appuyée. « Certainement pas » en restitue l’insistance sans recourir à une formulation archaïque.
- source_word: αὐτό
  choice: cette Pâque
  rationale: Le pronom neutre renvoie à « cette Pâque » mentionnée au verset précédent. Le français exige un référent permettant l’accord du pronom repris ensuite; expliciter sobrement « cette Pâque » rend le lien clair sans le réduire nécessairement au seul repas.
- source_word: ἕως ὅτου
  choice: avant que
  rationale: Avec une proposition négative principale, « ne… pas avant que » exprime idiomatiquement la limite temporelle indiquée par ἕως ὅτου.
- source_word: πληρωθῇ
  choice: trouve son accomplissement
  rationale: Cette formulation restitue le passif et la portée d’accomplissement de πληρόω, tout en étant plus naturelle en français que « soit accomplie » avec « Pâque ».
- source_word: ἐν τῇ βασιλείᾳ τοῦ θεοῦ
  choice: dans le royaume de Dieu
  rationale: Cette expression traditionnelle et intelligible préserve les associations de βασιλεία avec le règne et le domaine royal, sans trancher entre elles.
theological_decisions:
- issue: Référent de αὐτό
  choice: « Cette Pâque », au sens contextuel de la Pâque qui vient d’être mentionnée
  alternative: Le repas pascal uniquement; ou, plus largement, la célébration et l’événement pascals
  rationale: Le contexte immédiat désigne « cette Pâque », mais le grec ne précise pas davantage si l’accent porte exclusivement sur le repas ou sur l’observance. La traduction garde cette latitude.
- issue: Sens de « trouve son accomplissement dans le royaume de Dieu »
  choice: Conserver le langage eschatologique d’accomplissement sans en définir le mécanisme
  alternative: L’identifier explicitement à la venue du royaume ou au banquet messianique
  rationale: Le grec annonce l’accomplissement de la Pâque dans le royaume de Dieu, sans préciser de quelle manière. La traduction ne résout donc pas cette tension théologique.
- issue: Portée temporelle de la négation emphatique
  choice: « Je ne mangerai certainement pas… avant que »
  alternative: « Je n’en mangerai plus jusqu’à ce que »
  rationale: οὐ μή nie fortement une action future, mais le texte grec ne contient pas explicitement « de nouveau » ou « plus ». La traduction principale n’ajoute donc pas cette notion, tout en la signalant en note.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation conserve l’insistance de la négation grecque, le lien avec le contexte immédiat et l’indétermination relative de l’accomplissement eschatologique.
