source:
  edition: SBLGNT
  text: ⸀Ἔτι αὐτοῦ λαλοῦντος ἰδοὺ ὄχλος, καὶ ὁ λεγόμενος Ἰούδας εἷς τῶν δώδεκα προήρχετο αὐτούς, καὶ ἤγγισεν τῷ Ἰησοῦ φιλῆσαι αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/047.yaml
  text: While he was still speaking[a], behold, a crowd came, and the one called Judas, one of the twelve, was going before them, and he came near to Jesus to kiss him.
translation:
  language: fr
  text: Tandis qu’il parlait encore, voici qu’une foule arriva. Celui qu’on appelait Judas, l’un des Douze, marchait devant eux[a]. Il s’approcha de Jésus pour lui donner un baiser.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les conduisait » ou « allait devant eux ».
    reason: La tournure προήρχετο αὐτούς peut décrire Judas allant devant les membres de la foule ou, par implication, les guidant. Le texte principal retient le mouvement spatial sans exclure cette nuance.
lexical_decisions:
- source_word: Ἔτι αὐτοῦ λαλοῦντος
  choice: Tandis qu’il parlait encore
  rationale: Le génitif absolu exprime une action en cours, simultanée à l’arrivée de la foule. Cette formulation naturelle conserve la valeur temporelle de ἔτι et du participe présent.
- source_word: ἰδοὺ
  choice: voici que
  rationale: Ce marqueur attire vivement l’attention sur l’apparition soudaine de la foule. « Voici que » en préserve la force narrative dans un français actuel et digne.
- source_word: ὄχλος
  choice: une foule arriva
  rationale: ὄχλος désigne une foule. Le verbe « arriva », implicite dans cette construction grecque, permet une phrase française complète sans préciser davantage le mouvement.
- source_word: ὁ λεγόμενος Ἰούδας
  choice: Celui qu’on appelait Judas
  rationale: Cette traduction rend directement la désignation participiale, sans donner à « appelé » la nuance péjorative que pourrait avoir « soi-disant ».
- source_word: εἷς τῶν δώδεκα
  choice: l’un des Douze
  rationale: Formulation française usuelle qui conserve l’identification de Judas comme membre du groupe des douze disciples ainsi que la tension narrative qui en résulte.
- source_word: προήρχετο αὐτούς
  choice: marchait devant elle
  rationale: L’imparfait grec décrit Judas en train d’avancer devant la foule. « Marchait devant elle » préserve cet aspect et n’impose pas l’idée plus forte qu’il la commandait ou la dirigeait officiellement.
- source_word: ἤγγισεν τῷ Ἰησοῦ
  choice: Il s’approcha de Jésus
  rationale: Traduction française naturelle de l’aoriste de ἐγγίζω, qui exprime ici l’approche de Judas vers Jésus.
- source_word: φιλῆσαι αὐτόν
  choice: pour lui donner un baiser
  rationale: Dans ce contexte, φιλέω signifie embrasser au sens de donner un baiser. Cette formulation évite l’ambiguïté moderne du verbe français « embrasser », qui peut aussi évoquer une étreinte.
theological_decisions:
- issue: Présentation narrative de l’acte de Judas
  choice: Décrire simplement son approche et son intention de donner un baiser, sans ajouter qu’il s’agit d’une trahison.
  alternative: « pour le trahir par un baiser »
  rationale: Le contexte du récit établit la fonction du baiser, mais le verset lui-même décrit l’approche et le geste sans employer ici le vocabulaire de la trahison. La traduction conserve cette retenue et la tension narrative du texte.
translation_notes:
  register: Français international moderne, clair et digne. « Voici que » maintient la vivacité narrative du grec sans archaïsme excessif. « Donner un baiser » est préféré à « embrasser » pour éviter une ambiguïté courante en français contemporain.
