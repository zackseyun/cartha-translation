  rationale: La révision remplace uniquement le pronom singulier « elle » par le pluriel « eux », conformément à αὐτούς et à l’antécédent notionnel, les personnes de la foule. Le reste du texte est conservé, car il est fidèle au grec et naturel en français international moderne.
