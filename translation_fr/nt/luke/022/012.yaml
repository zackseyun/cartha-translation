  text: κἀκεῖνος ὑμῖν δείξει ἀνάγαιον μέγα ἐστρωμένον· ἐκεῖ ἑτοιμάσατε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/012.yaml
  text: And he will show you a large furnished upper room[a]; prepare there.
translation:
  language: fr
  text: Et lui vous montrera une grande pièce à l’étage, aménagée[a] ; faites-y les préparatifs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « déjà préparée », « garnie de couches » ou « avec les installations disposées ».
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀκεῖνος
  choice: Et lui
  rationale: La contraction de καί et ἐκεῖνος poursuit la suite des instructions tout en désignant clairement l’homme mentionné auparavant. « Et lui » est naturel en français et conserve la légère insistance du démonstratif.
- source_word: δείξει ὑμῖν
  choice: vous montrera
  rationale: Le futur de δείκνυμι avec le datif ὑμῖν se rend naturellement par « vous montrera ».
- source_word: ἀνάγαιον
  choice: pièce à l’étage
  rationale: Le terme désigne une pièce située à l’étage. Cette formulation est plus courante en français moderne que « chambre haute » et ne précise pas indûment sa fonction.
- source_word: μέγα
  choice: grande
  rationale: L’adjectif décrit simplement les dimensions importantes de la pièce.
- source_word: ἐστρωμένον
  choice: aménagée
  rationale: Le participe parfait passif de στρώννυμι évoque un lieu où ce qui est nécessaire a été étendu ou disposé, probablement pour le repas. « Aménagée » exprime cet état résultant sans affirmer que tous les préparatifs pascals sont déjà achevés.
- source_word: ἐκεῖ ἑτοιμάσατε
  choice: faites-y les préparatifs
  rationale: L’adverbe ἐκεῖ est repris par « y », et l’impératif pluriel ἑτοιμάσατε ordonne aux disciples d’y accomplir les préparatifs requis.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. « Pièce à l’étage » évite l’expression traditionnelle mais peu courante « chambre haute ». La note conserve l’ambiguïté de ἐστρωμένον entre l’aménagement matériel et l’état de préparation.
