id: LUK.22.26
reference: Luke 22:26
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὑμεῖς δὲ οὐχ οὕτως, ἀλλ’ ὁ μείζων ἐν ὑμῖν ⸀γινέσθω ὡς ὁ νεώτερος, καὶ ὁ ἡγούμενος ὡς ὁ διακονῶν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/026.yaml
  text: But you are not to be like that[a]. Instead, let the greater among you become like the younger[b], and the one who leads like the one who serves.
translation:
  language: fr
  text: Mais pour vous, il ne doit pas en être ainsi[a]. Au contraire, que celui qui est plus grand parmi vous devienne comme le plus jeune[b], et celui qui dirige, comme celui qui sert.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Mais qu’il n’en soit pas ainsi parmi vous. » Le grec est elliptique et oppose vivement les disciples de Jésus au comportement de ceux qui recherchent le prestige, décrit juste avant.'
    reason: alternative_reading
  - marker: b
    text: Ici, « le plus jeune » désigne aussi celui qui occupe une position sociale inférieure, et pas seulement une personne moins âgée.
    reason: cultural_note
lexical_decisions:
- source_word: ὑμεῖς δὲ οὐχ οὕτως
  choice: Mais pour vous, il ne doit pas en être ainsi
  rationale: Cette formulation naturelle conserve le contraste appuyé entre les disciples et la recherche de prestige décrite au verset précédent, tout en rendant explicite la portée prescriptive de l’expression grecque elliptique.
- source_word: ἀλλ’
  choice: Au contraire
  rationale: Marque nettement l’opposition et introduit l’instruction positive de Jésus dans un français courant et digne.
- source_word: ὁ μείζων ἐν ὑμῖν
  choice: celui qui est plus grand parmi vous
  rationale: Préserve le comparatif μείζων et son sens contextuel de rang ou de considération, sans le transformer en superlatif ni imposer un titre institutionnel.
- source_word: γινέσθω
  choice: que ... devienne
  rationale: Rend l’impératif présent de γίνομαι ainsi que l’idée d’adopter une nouvelle posture, plutôt que celle d’un simple état statique.
- source_word: ὡς ὁ νεώτερος
  choice: comme le plus jeune
  rationale: Traduit le comparatif νεώτερος de façon idiomatique; dans ce contexte, la jeunesse évoque aussi une position sociale subalterne.
- source_word: ὁ ἡγούμενος
  choice: celui qui dirige
  rationale: Conserve la forme active du participe et la notion de conduite ou de direction, sans importer un vocabulaire ecclésiastique ou politique plus marqué.
- source_word: ὡς ὁ διακονῶν
  choice: comme celui qui sert
  rationale: 'Préserve le caractère verbal et concret de διακονῶν: une personne qui se met effectivement au service des autres.'
theological_decisions:
- issue: Nature de l’enseignement de Jésus sur le rang et la direction
  choice: Présenter le verset comme un renversement éthique des valeurs de rang au sein de la communauté des disciples, où la grandeur et la direction prennent la forme de l’humilité et du service.
  alternative: Employer un vocabulaire plus institutionnel relatif à l’autorité, à la charge ou au gouvernement.
  rationale: Le grec met en parallèle « celui qui est plus grand » et « celui qui dirige » avec « le plus jeune » et « celui qui sert ». La traduction conserve cette tension sans abolir la direction ni légitimer une hiérarchie privilégiée.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe conserve le parallélisme du grec. « Plus grand » maintient le comparatif et l’ambiguïté relative au rang; les notes explicitent seulement l’ellipse et l’arrière-plan social indispensables à la compréhension.
