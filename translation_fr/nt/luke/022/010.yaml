id: LUK.22.10
reference: Luke 22:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτοῖς· Ἰδοὺ εἰσελθόντων ὑμῶν εἰς τὴν πόλιν συναντήσει ὑμῖν ἄνθρωπος κεράμιον ὕδατος βαστάζων· ἀκολουθήσατε αὐτῷ εἰς τὴν οἰκίαν ⸂εἰς ἣν⸃ εἰσπορεύεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/010.yaml
  text: And he said to them[a], “Look, when you enter the city, a man carrying a jar of water will meet you[b]. Follow him into the house that he enters.”
translation:
  language: fr
  text: 'Il leur dit : « Quand vous entrerez dans la ville, voici[a] qu’un homme portant une cruche d’eau[b] viendra à votre rencontre. Suivez-le dans la maison où il entrera. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Regardez ».'
    reason: lexical_alternative
  - marker: b
    text: Le terme grec peut désigner plus précisément un récipient en terre cuite.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδοὺ
  choice: Voici
  rationale: « Voici » conserve la fonction déictique et attire l’attention, tout en gardant un ton narratif digne et compréhensible en français moderne.
- source_word: εἰσελθόντων ὑμῶν εἰς τὴν πόλιν
  choice: quand vous entrerez dans la ville
  rationale: Le génitif absolu reçoit une valeur temporelle. Le futur est naturel en français puisque Jésus annonce ce qui se produira à leur arrivée.
- source_word: συναντήσει ὑμῖν
  choice: viendra à votre rencontre
  rationale: Cette tournure française exprime clairement la rencontre annoncée sans suggérer nécessairement un rendez-vous convenu.
- source_word: ἄνθρωπος
  choice: un homme
  rationale: Le nom et le participe sont masculins et désignent ici un individu de sexe masculin.
- source_word: κεράμιον ὕδατος
  choice: une cruche d’eau
  rationale: « Cruche d’eau » désigne naturellement en français un récipient transportable contenant de l’eau. La matière en terre cuite, possible lexicalement, est signalée en note sans être imposée au texte.
- source_word: βαστάζων
  choice: portant
  rationale: Le participe présent restitue simplement l’action en cours qui permettra d’identifier l’homme.
- source_word: ἀκολουθήσατε αὐτῷ
  choice: Suivez-le
  rationale: L’impératif direct rend avec concision l’ordre donné aux disciples.
- source_word: οἰκίαν
  choice: maison
  rationale: « Maison » correspond concrètement au lieu dans lequel l’homme entre.
- source_word: εἰς ἣν εἰσπορεύεται
  choice: où il entrera
  rationale: La relative identifie la maison. Le futur français harmonise naturellement cette action encore à venir avec le contexte, sans modifier son contenu.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La formulation reste directe et accessible, sans archaïsme marqué. « Voici » maintient toutefois la force d’appel de Ἰδοὺ ; la note présente une solution plus courante.
