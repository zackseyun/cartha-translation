  text: καὶ δεξάμενος ποτήριον εὐχαριστήσας εἶπεν· Λάβετε τοῦτο καὶ διαμερίσατε ⸂εἰς ἑαυτούς⸃·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/017.yaml
  text: And after receiving a cup and giving thanks[a], he said[b], “Take this and divide it among yourselves.”
translation:
  language: fr
  text: 'Ayant reçu une coupe et rendu grâce, il dit : « Prenez ceci et répartissez-le entre vous. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δεξάμενος
  choice: il reçut
  rationale: Le participe aoriste marque une action antérieure au verbe principal. La coordination française, complétée par « après avoir rendu grâce », restitue naturellement la succession des actions.
- source_word: ποτήριον
  choice: une coupe
  rationale: Le nom grec est sans article. « Une coupe » en reflète la forme tout en convenant au contexte d’un repas.
- source_word: εὐχαριστήσας
  choice: après avoir rendu grâce
  rationale: Cette formulation française naturelle exprime l’antériorité du participe et garde le sens ordinaire d’une action de grâce, sans imposer un vocabulaire liturgique ultérieur.
- source_word: εἶπεν
  choice: il dit
  rationale: Le grec ne précise aucun complément indirect; la traduction n’ajoute donc pas « leur ».
- source_word: Λάβετε
  choice: Prenez
  rationale: Impératif naturel dans la situation concrète d’un repas.
- source_word: τοῦτο
  choice: ceci
  rationale: Le démonstratif renvoie à la coupe sans répéter le nom, conformément à la concision du grec.
- source_word: διαμερίσατε
  choice: partagez-le
  rationale: Le verbe peut désigner l’action de diviser ou de répartir. « Partager » est naturel ici et, avec « entre vous », exprime la distribution au sein du groupe.
- source_word: εἰς ἑαυτούς
  choice: entre vous
  rationale: Cette expression rend idiomatiquement la répartition réciproque au sein du groupe.
theological_decisions:
- issue: Emploi éventuel d’un vocabulaire eucharistique ou liturgique pour εὐχαριστήσας et ποτήριον
  choice: 'Employer le langage narratif ordinaire : « une coupe » et « rendre grâce »'
  alternative: « la coupe » ou une formulation explicitement eucharistique
  rationale: Le grec décrit une action accomplie à table sans exiger une terminologie ecclésiale ultérieure. La traduction conserve ainsi la scène et évite d’ajouter une portée doctrinale non explicitée dans le verset.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase conserve la succession narrative des participes grecs sans lourdeur, et « partagez-le entre vous » privilégie la clarté courante tout en maintenant la portée de διαμερίσατε.
