id: LUK.22.49
reference: Luke 22:49
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἰδόντες δὲ οἱ περὶ αὐτὸν τὸ ἐσόμενον ⸀εἶπαν· Κύριε, εἰ πατάξομεν ἐν μαχαίρῃ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/049.yaml
  text: And when those around him saw what was about to happen[a], they said, “Lord, shall we strike with the sword?”
translation:
  language: fr
  text: 'Quand ceux qui étaient autour de lui virent ce qui allait arriver, ils dirent : « Seigneur, devons-nous frapper de l’épée[a] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avec une épée ». Le mot grec peut désigner une épée ou une lame plus courte, comme un poignard.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: quand ... virent
  rationale: Le participe aoriste est rendu par une proposition temporelle naturelle en français, qui conserve son rapport avec le verbe principal.
- source_word: οἱ περὶ αὐτὸν
  choice: ceux qui étaient autour de lui
  rationale: Cette formulation rend l’expression grecque sans préciser plus qu’elle qu’il s’agit des disciples ou des compagnons.
- source_word: τὸ ἐσόμενον
  choice: ce qui allait arriver
  rationale: Le participe futur substantivé désigne l’événement imminent; cette tournure est claire et idiomatique en français.
- source_word: εἶπαν
  choice: ils dirent
  rationale: Le sens ordinaire de λέγω est conservé, même si les paroles qui suivent constituent une question.
- source_word: Κύριε
  choice: Seigneur
  rationale: Ce titre respectueux adressé à Jésus conserve également la portée théologique possible de κύριος.
- source_word: εἰ πατάξομεν
  choice: devons-nous frapper
  rationale: Dans cette question délibérative, le futur grec demande quelle action entreprendre. « Devons-nous » exprime naturellement en français la demande d’autorisation ou de directive sans la résoudre explicitement.
- source_word: ἐν μαχαίρῃ
  choice: de l’épée
  rationale: ἐν a ici une valeur instrumentale. « Frapper de l’épée » est une formulation française naturelle; μάχαιρα peut toutefois désigner une épée ou une lame plus courte.
theological_decisions:
- issue: Traduction de κύριος dans une adresse à Jésus
  choice: Seigneur
  alternative: Maître
  rationale: « Seigneur » garde le titre et sa possible résonance théologique, tandis que « Maître » réduirait ici l’éventail de sens.
- issue: Valeur de la question εἰ πατάξομεν
  choice: devons-nous frapper
  alternative: allons-nous frapper
  rationale: Le contexte suggère une question délibérative adressée à Jésus. La traduction choisie exprime la recherche d’une directive sans ajouter une approbation de la violence.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple convient au registre narratif biblique sans archaïsme marqué; la question directe reste vive et naturelle.
