source:
  edition: SBLGNT
  text: ⸄καὶ τὸ ποτήριον ὡσαύτως⸅ μετὰ τὸ δειπνῆσαι, λέγων· Τοῦτο τὸ ποτήριον ἡ καινὴ διαθήκη ἐν τῷ αἵματί μου, τὸ ὑπὲρ ὑμῶν ἐκχυννόμενον]⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/020.yaml
  text: And likewise the cup after supper[a], saying, “This cup is the new covenant in my blood[b], which is poured out for you.”
translation:
  language: fr
  text: 'De même, après le repas, il prit la coupe et dit : « Cette coupe est la nouvelle alliance[a] en mon sang, qui est versé pour vous[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot grec traduit par « alliance » peut aussi signifier « testament » ; ici, l’arrière-plan biblique de l’alliance favorise la traduction retenue.
    reason: alternative_reading
  - marker: b
    text: En grec, les mots « qui est versé pour vous » viennent après toute la proposition. Ils se rapportent le plus naturellement au sang de Jésus, bien que leur forme grammaticale puisse aussi être rattachée à la coupe.
    reason: lexical_alternative
lexical_decisions:
- source_word: ποτήριον
  choice: coupe
  rationale: « Coupe » est le terme courant et naturel pour le récipient; « calice » introduirait une coloration liturgique que le grec n’impose pas.
- source_word: ὡσαύτως
  choice: de même
  rationale: Cette expression conserve le lien avec le geste précédent tout en restant idiomatique en français.
- source_word: μετὰ τὸ δειπνῆσαι
  choice: après le repas
  rationale: Rend naturellement la proposition infinitive temporelle et maintient clairement la succession des événements.
- source_word: λέγων
  choice: et dit
  rationale: Le participe grec est rendu par un verbe coordonné, tournure plus naturelle en français dans ce contexte narratif.
- source_word: καινὴ διαθήκη
  choice: nouvelle alliance
  rationale: « Alliance » restitue l’arrière-plan biblique et sacrificiel de διαθήκη; « testament » évoquerait surtout en français moderne les dernières volontés d’un défunt.
- source_word: ἐν τῷ αἵματί μου
  choice: en mon sang
  rationale: Cette formulation proche du grec préserve l’expression d’alliance et l’amplitude sémantique de la préposition ἐν sans préciser indûment « par » ou « au moyen de ».
- source_word: τὸ ὑπὲρ ὑμῶν ἐκχυννόμενον
  choice: qui est versé pour vous
  rationale: Le sens contextuel renvoie le plus naturellement au sang de Jésus. « Pour vous » conserve la portée bénéficiaire et sacrificielle de ὑπέρ sans imposer une théorie particulière de l’expiation.
theological_decisions:
- issue: Sens de διαθήκη dans la parole sur la coupe
  choice: nouvelle alliance
  alternative: nouveau testament
  rationale: Le contexte évoque le sang qui établit une alliance et l’arrière-plan vétérotestamentaire. « Alliance » est donc le choix principal, tandis que « testament » demeure une possibilité lexicale et traditionnelle signalée en note.
- issue: Référent de ἐκχυννόμενον
  choice: le sang de Jésus, rendu par « qui est versé pour vous »
  alternative: rattachement grammatical plus direct à la coupe
  rationale: Le participe neutre suit l’ensemble de la proposition et pourrait formellement se rattacher à ποτήριον, également neutre, mais le sens sacrificiel indique le plus naturellement que c’est le sang qui est versé. La note conserve la particularité syntaxique du grec.
translation_notes:
  register: Français international moderne, clair et digne. « Coupe » évite la coloration ecclésiastique de « calice ». « En mon sang » conserve volontairement l’expression dense et solennelle du grec. Le verbe « prit », implicite dans la construction elliptique grecque et fourni par le contexte, est explicité pour obtenir une phrase française complète et naturelle.
