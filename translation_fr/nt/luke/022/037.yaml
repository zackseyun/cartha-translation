id: LUK.22.37
reference: Luke 22:37
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: λέγω γὰρ ὑμῖν ⸀ὅτι τοῦτο τὸ γεγραμμένον δεῖ τελεσθῆναι ἐν ἐμοί, τό· Καὶ μετὰ ἀνόμων ἐλογίσθη· καὶ γὰρ ⸀τὸ περὶ ἐμοῦ τέλος ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/037.yaml
  text: 'For I tell you that this which is written must be fulfilled in me: ‘And he was counted with the lawless.’ For what concerns me has its fulfillment[a][b].'
translation:
  language: fr
  text: 'Car je vous le dis, il faut que ce qui est écrit s’accomplisse en moi : « Et il a été compté parmi les sans-loi[a]. » En effet, ce qui me concerne arrive à son terme[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, selon la formulation traditionnelle : « Il a été mis au nombre des transgresseurs » (Ésaïe 53.12).'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « trouve son accomplissement » ou « touche à son achèvement ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω γὰρ ὑμῖν
  choice: Car je vous le dis
  rationale: « Je vous le dis » est naturel en français moderne, tandis que « car » conserve le lien explicatif marqué par γάρ.
- source_word: τοῦτο τὸ γεγραμμένον
  choice: cette parole écrite
  rationale: Cette formulation rend le démonstratif et le participe parfait sans introduire explicitement le terme « Écriture », absent du grec.
- source_word: δεῖ τελεσθῆναι
  choice: il faut que … s’accomplisse
  rationale: « Il faut » exprime la nécessité de δεῖ, et « s’accomplisse » convient à une parole prophétique tout en gardant l’idée d’achèvement.
- source_word: ἐν ἐμοί
  choice: en moi
  rationale: La traduction directe préserve la formulation grecque et son ouverture quant à l’accomplissement dans la personne et la destinée de Jésus.
- source_word: Καὶ μετὰ ἀνόμων ἐλογίσθη
  choice: Il a été compté parmi ceux qui sont sans loi
  rationale: ἀνόμων désigne littéralement ceux qui sont sans loi ou qui la méprisent; « compté parmi » rend idiomatiquement μετὰ et ἐλογίσθη. Le « et » initial de la citation est omis en français, où il serait peu naturel hors du contexte d’Ésaïe.
- source_word: τὸ περὶ ἐμοῦ
  choice: ce qui me concerne
  rationale: Expression française naturelle qui conserve la portée générale de la tournure grecque.
- source_word: τέλος ἔχει
  choice: arrive à son terme
  rationale: Cette expression garde la tension entre fin, achèvement et accomplissement sans réduire le sens au seul accomplissement prophétique.
theological_decisions:
- issue: Rendu de la citation d’Ésaïe 53.12
  choice: Il a été compté parmi ceux qui sont sans loi
  alternative: Il a été mis au nombre des transgresseurs
  rationale: Le texte principal suit de près ἀνόμων, tandis que la note conserve la formulation traditionnelle et reconnaissable de la citation.
- issue: Sens de τέλος ἔχει
  choice: arrive à son terme
  alternative: trouve son accomplissement
  rationale: Le grec peut évoquer aussi bien la fin que l’achèvement. Le choix principal préserve cette tension; la note signale le sens d’accomplissement possible dans le contexte de la Passion.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche du grec sans devenir artificielle; les notes préservent la formulation traditionnelle d’Ésaïe et l’ambiguïté de la dernière proposition.
