id: LUK.22.69
reference: Luke 22:69
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀπὸ τοῦ νῦν ⸀δὲ ἔσται ὁ υἱὸς τοῦ ἀνθρώπου καθήμενος ἐκ δεξιῶν τῆς δυνάμεως τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/069.yaml
  text: But from now on the Son of Man will be seated at the right hand of the power of God[a].
translation:
  language: fr
  text: Mais désormais, le Fils de l’homme sera assis à la droite de la puissance de Dieu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « à la droite de la Puissance », désignation révérencielle de Dieu.'
    reason: Alternative lexicale préservant la possibilité que « la Puissance » fonctionne comme une manière révérencielle de désigner Dieu.
lexical_decisions:
- source_word: ἀπὸ τοῦ νῦν
  choice: désormais
  rationale: Expression temporelle naturelle en français moderne, marquant le point à partir duquel cette réalité s’établit, tout en conservant sa portée prospective.
- source_word: δὲ
  choice: Mais
  rationale: Dans le contexte, δέ introduit un tournant contrastif dans la réponse de Jésus ; « Mais » en rend clairement la nuance.
- source_word: ἔσται
  choice: sera
  rationale: Le futur de εἰμί annonce l’état à venir du Fils de l’homme sans suggérer plus précisément un changement d’essence.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: le Fils de l’homme
  rationale: Cette désignation établie de Jésus conserve littéralement le titre ainsi que ses résonances daniéliques et apocalyptiques.
- source_word: καθήμενος
  choice: assis
  rationale: Le participe décrit la posture d’intronisation. « Assis » est naturel, digne et garde l’image royale.
- source_word: ἐκ δεξιῶν
  choice: à la droite
  rationale: Cette expression biblique désigne la place d’honneur et d’autorité suprêmes ; la formulation traditionnelle française en préserve les échos intertextuels.
- source_word: τῆς δυνάμεως
  choice: de la puissance
  rationale: Le nom δύναμις signifie « puissance ». Le maintien du nom commun avec son article respecte la formulation grecque et n’en fait pas implicitement un nom propre.
- source_word: τοῦ θεοῦ
  choice: de Dieu
  rationale: Le génitif précise explicitement à qui appartient la puissance et doit rester visible dans la traduction.
theological_decisions:
- issue: Formule d’exaltation et affirmation de l’autorité divine
  choice: le Fils de l’homme sera assis à la droite de la puissance de Dieu
  alternative: le Fils de l’homme sera assis à la droite de la Puissance
  rationale: La formulation conserve l’affirmation forte d’exaltation et d’autorité ainsi que les résonances du Psaume 110 et de Daniel 7, sans les expliciter de manière interprétative. Elle maintient aussi le complément « de Dieu » présent dans le grec ; la possibilité de comprendre « la Puissance » comme une désignation révérencielle de Dieu est signalée en note.
translation_notes:
  register: Français international moderne, clair et digne. « Désormais » évite une tournure lourde, tandis que « le Fils de l’homme » et « à la droite » conservent les formulations bibliques nécessaires aux échos intertextuels.
