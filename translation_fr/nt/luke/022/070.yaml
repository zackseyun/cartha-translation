source:
  edition: SBLGNT
  text: εἶπαν δὲ πάντες· Σὺ οὖν εἶ ὁ υἱὸς τοῦ θεοῦ; ὁ δὲ πρὸς αὐτοὺς ἔφη· Ὑμεῖς λέγετε ὅτι ἐγώ εἰμι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/070.yaml
  text: Then they all said[a], “So you are the Son of God?” And he said to them, “You say that I am.”
translation:
  language: fr
  text: 'Alors ils dirent tous : « Tu es donc le Fils de Dieu ? » Il leur répondit : « C’est vous qui dites que je le suis.[a] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de manière plus idiomatique : « Vous le dites » ou « C’est bien ce que vous dites. » Dans ce contexte, la réponse de Jésus a une portée affirmative, mais le grec dit plus littéralement : « C’est vous qui dites que je le suis. »'
    reason: alternative_reading
lexical_decisions:
- source_word: πάντες
  choice: ils dirent tous
  rationale: L’adjectif substantivé désigne l’ensemble du groupe ; cette tournure française conserve naturellement l’accent collectif.
- source_word: οὖν
  choice: donc
  rationale: Dans cette question, le terme marque la conclusion que les interlocuteurs tirent de l’échange précédent.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: le Fils de Dieu
  rationale: La formulation définie conserve le caractère formel du titre christologique.
- source_word: ἔφη
  choice: répondit
  rationale: Dans ce dialogue, « répondit » rend naturellement l’acte de parole sans ajouter une nuance doctrinale.
- source_word: Ὑμεῖς λέγετε
  choice: C’est vous qui dites
  rationale: La construction clivée rend l’emphase du pronom explicite Ὑμεῖς tout en restant idiomatique en français.
- source_word: ὅτι ἐγώ εἰμι
  choice: que je le suis
  rationale: Le pronom « le » reprend en français l’attribut « le Fils de Dieu » et évite l’ambiguïté moderne de « je suis » isolé, sans transformer la réponse en affirmation directe.
theological_decisions:
- issue: La réponse de Jésus doit-elle être formulée comme une affirmation explicite ou comme une réponse indirecte ?
  choice: « C’est vous qui dites que je le suis »
  alternative: « Vous le dites » ; « C’est bien ce que vous dites » ; « Oui, je le suis »
  rationale: Le grec place la formulation sur les lèvres des interlocuteurs tout en ayant, dans le contexte, une portée affirmative. Le texte principal en conserve la forme indirecte et la tension, plutôt que de la remplacer par un « oui » explicite.
translation_notes:
  register: Français international moderne, digne et naturel. La construction « C’est vous qui dites » préserve l’emphase du pronom grec ; la note explicite la valeur contextuelle de la réponse sans effacer sa formulation indirecte.
