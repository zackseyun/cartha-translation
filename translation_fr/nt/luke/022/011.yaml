id: LUK.22.11
reference: Luke 22:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἐρεῖτε τῷ οἰκοδεσπότῃ τῆς οἰκίας· Λέγει σοι ὁ διδάσκαλος· Ποῦ ἐστιν τὸ κατάλυμα ὅπου τὸ πάσχα μετὰ τῶν μαθητῶν μου φάγω;
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/011.yaml
  text: And you will say to the master of the house[a], ‘The Teacher says to you, “Where is the guest room where I may eat the Passover with my disciples?”’
translation:
  language: fr
  text: 'Et vous direz au maître de la maison : « Le Maître te dit : “Où est la pièce réservée aux hôtes[a] où je pourrai manger la Pâque avec mes disciples ?” »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « lieu d’hébergement ». Le grec κατάλυμα désigne un endroit où loger ou une pièce destinée aux hôtes. Il ne signifie pas précisément « auberge » ici, et ce n’est qu’au verset suivant que la pièce est située à l’étage.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκοδεσπότῃ τῆς οἰκίας
  choice: au maître de la maison
  rationale: Cette expression rend le chef du foyer et conserve la répétition sémantique du grec dans une tournure française naturelle.
- source_word: ὁ διδάσκαλος
  choice: Le Maître
  rationale: En français, « Maître » est le titre traditionnel et naturel pour un enseignant reconnu dans cette relation avec ses disciples. La majuscule marque ici l’emploi comme titre désignant Jésus.
- source_word: κατάλυμα
  choice: pièce réservée aux hôtes
  rationale: Le terme désigne un lieu d’hébergement ou d’accueil. Cette formulation convient au cadre domestique sans suggérer à tort une auberge ni anticiper la précision « pièce à l’étage » du verset suivant.
- source_word: τὸ πάσχα
  choice: la Pâque
  rationale: Dans ce contexte où il est question de manger, le terme vise particulièrement le repas pascal, mais « la Pâque » conserve l’étendue du mot grec sans explicitation excessive.
- source_word: μετὰ τῶν μαθητῶν μου
  choice: avec mes disciples
  rationale: « Disciples » exprime la relation durable de formation et d’attachement, au-delà du simple statut d’élèves.
- source_word: φάγω
  choice: je pourrai manger
  rationale: Le futur français avec « pouvoir » restitue naturellement l’action envisagée exprimée par le subjonctif aoriste dans la proposition introduite par ὅπου.
- source_word: ἐρεῖτε
  choice: vous direz
  rationale: Le futur indicatif grec est conservé et fonctionne naturellement en français comme instruction annonçant les paroles à prononcer.
theological_decisions:
- issue: 'Titre par lequel Jésus se désigne : ὁ διδάσκαλος'
  choice: Le Maître
  alternative: L’Enseignant
  rationale: « Le Maître » est en français un titre idiomatique adressé à une personne qui enseigne et correspond à la relation avec des disciples. Il ne faut toutefois pas confondre ici διδάσκαλος avec un terme grec signifiant expressément seigneur ou propriétaire.
translation_notes:
  register: Français international moderne, digne et accessible. « Pièce réservée aux hôtes » est préféré à « chambre d’amis », qui évoquerait trop exclusivement une chambre à coucher, et à « salle haute », qui anticiperait le verset suivant. Les guillemets emboîtés distinguent les paroles des disciples de la citation qu’ils transmettent au nom de Jésus.
