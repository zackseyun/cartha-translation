  text: γενόμενος δὲ ἐπὶ τοῦ τόπου εἶπεν αὐτοῖς· Προσεύχεσθε μὴ εἰσελθεῖν εἰς πειρασμόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/040.yaml
  text: When he came to the place[a], he said to them, “Pray that you may not enter into temptation.”
translation:
  language: fr
  text: 'Lorsqu’il arriva à l’endroit, il leur dit : « Priez pour ne pas entrer dans la tentation[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’épreuve » ou « la mise à l’épreuve ». Le terme grec peut désigner soit une tentation au sens moral, soit plus largement une situation où quelqu’un est mis à l’épreuve.
    reason: lexical_alternative
lexical_decisions:
- source_word: γενόμενος δὲ ἐπὶ τοῦ τόπου
  choice: Quand il fut arrivé à cet endroit
  rationale: Le participe aoriste avec ἐπὶ τοῦ τόπου exprime ici l’arrivée au lieu déjà connu dans le contexte. La proposition temporelle est naturelle en français et restitue le léger enchaînement narratif marqué par δέ.
- source_word: εἶπεν αὐτοῖς
  choice: il leur dit
  rationale: Cette formulation rend directement λέγω et son complément, sans renforcer indûment la nuance de commandement.
- source_word: Προσεύχεσθε
  choice: Priez
  rationale: L’impératif présent appelle à la prière; l’impératif français simple est idiomatique sans exclure l’idée d’une action soutenue.
- source_word: μὴ εἰσελθεῖν
  choice: pour ne pas entrer
  rationale: Cette tournure exprime naturellement en français le but ou le contenu de la prière tout en conservant l’image d’« entrer », sans l’interpréter comme « succomber ».
- source_word: πειρασμόν
  choice: la tentation
  rationale: Dans le contexte immédiat de la vulnérabilité spirituelle des disciples, « tentation » est le sens le plus naturel. La polysémie du terme grec est néanmoins signalée en note.
theological_decisions:
- issue: Sens de πειρασμός dans l’avertissement de Jésus
  choice: la tentation
  alternative: l’épreuve ou la mise à l’épreuve
  rationale: Le contexte annonce la défaillance spirituelle des disciples, ce qui favorise « tentation ». Toutefois, le grec peut aussi désigner plus largement une épreuve; la note préserve cette tension lexicale sans trancher silencieusement.
translation_notes:
  register: Français international moderne, clair et digne. « Cet endroit » renvoie naturellement au lieu précis déjà mentionné. La formulation conserve l’image grecque d’entrer dans la tentation et place correctement l’appel de note sur le terme concerné.
