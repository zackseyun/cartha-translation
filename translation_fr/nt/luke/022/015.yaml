source:
  edition: SBLGNT
  text: καὶ εἶπεν πρὸς αὐτούς· Ἐπιθυμίᾳ ἐπεθύμησα τοῦτο τὸ πάσχα φαγεῖν μεθ’ ὑμῶν πρὸ τοῦ με παθεῖν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/015.yaml
  text: And he said to them[b][a], “I have earnestly desired to eat this Passover with you before I suffer.”
translation:
  language: fr
  text: 'Il leur dit : « J’ai ardemment désiré manger cette Pâque[a] avec vous avant de souffrir. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ici, « cette Pâque » désigne probablement le repas de la Pâque.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν πρὸς αὐτούς
  choice: Il leur dit
  rationale: Formule narrative directe et naturelle en français pour λέγω avec πρός et l’accusatif.
- source_word: Ἐπιθυμίᾳ ἐπεθύμησα
  choice: J’ai ardemment désiré
  rationale: La construction apparentée du nom et du verbe intensifie le désir. « Ardemment désiré » en restitue la force dans un français naturel et digne.
- source_word: τοῦτο τὸ πάσχα
  choice: cette Pâque
  rationale: Le contexte du verbe « manger » indique le repas pascal, mais la formulation conserve simplement « cette Pâque », comme le grec, sans explicitation dans le texte principal.
- source_word: φαγεῖν
  choice: manger
  rationale: Rendu direct et courant de l’infinitif de ἐσθίω.
- source_word: μεθ’ ὑμῶν
  choice: avec vous
  rationale: Expression simple et exacte de l’accompagnement.
- source_word: πρὸ τοῦ με παθεῖν
  choice: avant de souffrir
  rationale: La construction exprime l’antériorité. En français, « avant de souffrir » est naturel lorsque le sujet reste le même et préserve le caractère non précisé de la souffrance annoncée.
theological_decisions:
- issue: Sens de πάσχα dans ce contexte
  choice: « cette Pâque » est conservé dans le texte principal.
  alternative: « ce repas de la Pâque »
  rationale: Le contexte montre qu’il s’agit du repas, mais le grec dit littéralement « cette Pâque ». Le choix retenu préserve cette formulation sans ajouter une précision interprétative inutile.
- issue: Force de Ἐπιθυμίᾳ ἐπεθύμησα
  choice: « J’ai ardemment désiré »
  alternative: '« J’ai vivement désiré » ; plus littéralement : « D’un désir, j’ai désiré »'
  rationale: Le tour grec exprime une vive intensité. La traduction la communique sans calque artificiel ni ajout théologique.
translation_notes:
  register: Français international moderne, clair et digne. La formulation reste proche de la syntaxe grecque tout en évitant un calque peu naturel de la construction emphatique.
