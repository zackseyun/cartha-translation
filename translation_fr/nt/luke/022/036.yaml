  variant: modern international French
source:
  edition: SBLGNT
  text: εἶπεν ⸀δὲ αὐτοῖς· Ἀλλὰ νῦν ὁ ἔχων βαλλάντιον ἀράτω, ὁμοίως καὶ πήραν, καὶ ὁ μὴ ἔχων ⸀πωλησάτω τὸ ἱμάτιον αὐτοῦ καὶ ⸀ἀγορασάτω μάχαιραν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/036.yaml
  text: But now[a], let the one who has a money bag take it, and likewise a travel bag[b]; and let the one who does not have one sell his cloak and buy a sword.
translation:
  language: fr
  text: Mais maintenant, que celui qui a une bourse la prenne, ainsi qu’un sac de voyage[a] ; que celui qui n’en a pas vende son manteau et achète une épée[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une besace » ou « un sac » pour le grec πήρα.
    reason: lexical_alternative
  - marker: b
    text: Le mot grec traduit par « épée » (μάχαιρα) peut aussi désigner une lame plus courte, telle qu’un poignard ou une épée courte.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀλλὰ νῦν
  choice: Mais maintenant
  rationale: Rend naturellement le contraste marqué avec les consignes précédentes tout en conservant la valeur temporelle de νῦν.
- source_word: ὁ ἔχων
  choice: celui qui a
  rationale: L’expression rend le participe substantivé de façon générique, sans ajouter de précision de genre inutile.
- source_word: βαλλάντιον
  choice: une bourse
  rationale: Le terme désigne un contenant destiné à l’argent. « Bourse » est ici une formulation française claire et traditionnelle, sans être archaïque.
- source_word: ἀράτω
  choice: la prenne
  rationale: Dans ce contexte de préparation au voyage, l’impératif signifie prendre avec soi. Le pronom reprend naturellement « une bourse ».
- source_word: ὁμοίως καὶ πήραν
  choice: et de même un sac de voyage
  rationale: πήρα désigne le sac d’un voyageur. « Sac de voyage » en explicite sobrement la fonction, tandis que « de même » conserve ὁμοίως.
- source_word: ὁ μὴ ἔχων
  choice: celui qui n’en a pas
  rationale: Cette formulation conserve l’ellipse du grec sans nommer explicitement l’objet manquant ; le contexte immédiat oriente vers l’épée sans que la traduction tranche davantage.
- source_word: πωλησάτω τὸ ἱμάτιον αὐτοῦ
  choice: vende son manteau
  rationale: ἱμάτιον désigne couramment le vêtement extérieur. « Manteau » est naturel en français moderne et exprime qu’il s’agit d’un bien personnel important.
- source_word: ἀγορασάτω μάχαιραν
  choice: achète une épée
  rationale: La formulation garde l’impératif direct et le sens usuel de μάχαιρα, sans imposer une précision excessive quant au type exact de lame.
theological_decisions:
- issue: Faut-il atténuer ou accentuer la portée littérale de l’ordre d’acheter une épée ?
  choice: 'Conserver l’ordre direct : « achète une épée »'
  alternative: Employer « achète une arme » ou reformuler comme une préparation figurée au danger
  rationale: Le grec nomme explicitement une μάχαιρα et emploie un impératif. La traduction préserve cette tension et laisse à l’interprétation la question de la portée littérale, symbolique ou contextuelle de l’ordre.
- issue: Quel est l’objet sous-entendu après ὁ μὴ ἔχων ?
  choice: Maintenir l’ellipse avec « celui qui n’en a pas »
  alternative: Préciser « celui qui n’a pas d’épée »
  rationale: Le contexte suivant suggère fortement l’épée, mais le texte grec ne répète aucun nom. Le français permet de conserver cette concision et cette légère ambiguïté.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe impérative est conservée sans lourdeur. Les points-virgules distinguent les deux consignes, et les notes signalent les principales possibilités lexicales sans surcharger le texte.
