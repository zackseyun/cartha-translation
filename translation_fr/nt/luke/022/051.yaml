  text: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν· Ἐᾶτε ἕως τούτου· καὶ ἁψάμενος τοῦ ⸀ὠτίου ἰάσατο αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/051.yaml
  text: But Jesus answered, “Enough of this!” And he touched his ear and healed him.
translation:
  language: fr
  text: 'Mais Jésus répondit : « Cela suffit[a] ! » Puis il toucha l’oreille de l’homme et le guérit.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Laissez faire jusque-là. » Le grec est elliptique ; l’adresse exacte et la nuance précise de l’injonction ne sont pas certaines.'
    reason: Signale l’ambiguïté sémantique et syntaxique de Ἐᾶτε ἕως τούτου sans imposer une interprétation.
lexical_decisions:
- source_word: Ἐᾶτε ἕως τούτου
  choice: Ça suffit !
  rationale: Dans ce contexte d’affrontement, l’expression elliptique ordonne naturellement de mettre fin à l’action. Cette formulation française est directe et courante, tout en évitant de préciser artificiellement si Jésus s’adresse à ses disciples ou à ceux qui viennent l’arrêter.
- source_word: τοῦ ὠτίου
  choice: l’oreille de l’homme
  rationale: Le grec dit littéralement « l’oreille » et le pronom αὐτόν renvoie à l’homme blessé. L’ajout explicite « de l’homme » rend le référent naturel en français sans ajouter d’identité absente de ce verset.
- source_word: ἰάσατο αὐτόν
  choice: le guérit
  rationale: Le verbe ἰάομαι exprime ici une guérison effective; le pronom masculin vise l’homme, non simplement son oreille.
theological_decisions:
- issue: Portée de l’ordre Ἐᾶτε ἕως τούτου
  choice: « Ça suffit ! »
  alternative: « Laissez faire jusque-là » / « Arrêtez-vous là »
  rationale: La syntaxe grecque est concise et peut recevoir plusieurs nuances. Le contexte immédiat favorise un ordre mettant fin à la violence, mais la traduction ne précise pas davantage son destinataire ni son objet.
translation_notes:
  register: Français international moderne, naturel et digne. « Ça suffit ! » conserve la vigueur de l’intervention de Jésus sans lourdeur; « Puis » marque simplement la progression narrative exprimée par καί.
