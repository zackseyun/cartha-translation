  naturalness: « Seigneur, voici deux épées » est plus naturel en français international moderne dans ce tour de parole bref. « Regarde » est grammatical, mais sonne comme un impératif personnel ajouté et moins idiomatique ici. La suppression de « alors » évite de surmarquer la légère connective δέ, qui peut rester non exprimée en français.
