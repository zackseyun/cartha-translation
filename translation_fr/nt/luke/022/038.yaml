  text: οἱ δὲ εἶπαν· Κύριε, ἰδοὺ μάχαιραι ὧδε δύο. ὁ δὲ εἶπεν αὐτοῖς· Ἱκανόν ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/038.yaml
  text: And they said[a], “Lord, look, here are two swords.” And he said to them, “It is enough.”
translation:
  language: fr
  text: 'Ils dirent : « Seigneur, voici deux épées. » Il leur dit : « Cela suffit[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Assez ! », peut-être pour mettre fin à la discussion plutôt que pour dire que deux épées suffisaient.'
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ δὲ εἶπαν
  choice: Ils dirent alors
  rationale: δέ est une transition narrative légère. « Alors » assure un enchaînement naturel sans introduire un contraste trop marqué.
- source_word: Κύριε
  choice: Seigneur
  rationale: « Seigneur » convient à la fois comme terme d’adresse à Jésus et comme titre établi dans le Nouveau Testament.
- source_word: ἰδοὺ
  choice: regarde
  rationale: L’impératif « regarde » restitue naturellement la fonction déictique de ἰδού dans un dialogue moderne, sans l’archaïsme de « voici » employé comme interjection solennelle.
- source_word: μάχαιραι
  choice: épées
  rationale: μάχαιρα désigne une arme blanche; « épée » est le terme français conventionnel sans préciser indûment sa taille ou sa forme.
- source_word: ὧδε δύο
  choice: il y a ici deux
  rationale: Cette tournure rend clairement l’adverbe déictique ὧδε et le nombre δύο dans un ordre idiomatique en français.
- source_word: Ἱκανόν ἐστιν
  choice: Cela suffit
  rationale: Cette formulation française naturelle peut désigner soit le nombre d’épées, soit la fin de l’échange, et conserve ainsi l’ambiguïté du grec.
theological_decisions:
- issue: Ambiguïté de la réponse de Jésus, Ἱκανόν ἐστιν
  choice: Cela suffit
  alternative: Assez !
  rationale: Le grec peut être compris comme une appréciation littérale — deux épées suffisent — ou comme une manière de clore la discussion. Le texte principal ne tranche pas entre ces interprétations; la note signale explicitement l’autre nuance possible.
translation_notes:
  register: Français international moderne, naturel et digne. Le dialogue reste direct et concis; la formulation finale préserve volontairement la tension interprétative du grec.
