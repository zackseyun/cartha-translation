id: LUK.22.31
reference: Luke 22:31
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸀Σίμων Σίμων, ἰδοὺ ὁ Σατανᾶς ἐξῃτήσατο ὑμᾶς τοῦ σινιάσαι ὡς τὸν σῖτον·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/031.yaml
  text: 'Simon, Simon, look: Satan has demanded to have all of you, to sift you like wheat.'
translation:
  language: fr
  text: 'Simon, Simon, écoute : Satan a réclamé de pouvoir vous passer tous au crible comme le blé.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le « vous » est pluriel en grec : Satan a réclamé de passer tous les disciples au crible, et non Simon seulement.'
    reason: Le français « vous » peut être compris comme un singulier de politesse ; la note explicite le nombre grammatical essentiel au sens.
lexical_decisions:
- source_word: ἰδού
  choice: écoute
  rationale: Dans cette adresse directe, l’interjection attire solennellement l’attention de Simon ; « écoute » est idiomatique en français moderne sans réduire le terme à une perception visuelle.
- source_word: ἐξῃτήσατο
  choice: a réclamé de pouvoir
  rationale: Le verbe exprime une demande insistante. Cette formulation conserve l’idée d’une autorisation recherchée sans préciser explicitement auprès de qui.
- source_word: ὑμᾶς
  choice: vous… tous
  rationale: 'Le pronom grec est pluriel : Jésus s’adresse à Simon, mais la demande de Satan concerne l’ensemble des disciples. « tous » rend cette donnée audible en français.'
- source_word: σινιάσαι
  choice: passer… au crible
  rationale: Expression française naturelle qui garde l’image agricole du tamisage et sa portée métaphorique d’épreuve violente.
- source_word: ὡς τὸν σῖτον
  choice: comme le blé
  rationale: Traduction directe de la comparaison grecque.
theological_decisions:
- issue: Portée du pronom ὑμᾶς
  choice: vous… tous
  alternative: te
  rationale: Le texte passe de l’adresse singulière « Simon » au pronom pluriel ὑμᾶς ; la traduction préserve ce contraste au lieu de limiter la demande à Pierre.
- issue: Autorisation impliquée par ἐξῃτήσατο
  choice: a réclamé de pouvoir
  alternative: a obtenu l’autorisation de
  rationale: Le grec indique une demande insistante, mais le verset ne dit pas explicitement ici que l’autorisation a été accordée ; la formulation maintient cette nuance.
translation_notes:
  register: Français international moderne, naturel et digne. La répétition « Simon, Simon » est conservée pour son insistance. « Écoute » fonctionne comme interjection d’attention, et « passer au crible » maintient l’image concrète tout en restant idiomatique.
