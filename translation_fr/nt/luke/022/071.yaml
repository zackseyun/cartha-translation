source:
  edition: SBLGNT
  text: οἱ δὲ εἶπαν· Τί ἔτι ⸂ἔχομεν μαρτυρίας χρείαν⸃; αὐτοὶ γὰρ ἠκούσαμεν ἀπὸ τοῦ στόματος αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/071.yaml
  text: Then they said[a], “Why do we still need testimony? For we ourselves have heard it from his own mouth.”
translation:
  language: fr
  text: 'Alors ils dirent : « Pourquoi avons-nous encore besoin de témoignage ? Car nous l’avons nous-mêmes entendu de sa bouche. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ εἶπαν
  choice: Alors ils dirent
  rationale: δέ est ici un connecteur narratif léger. « Alors » fait progresser naturellement le récit sans accentuer indûment une opposition.
- source_word: Τί ἔτι ἔχομεν μαρτυρίας χρείαν
  choice: Pourquoi avons-nous encore besoin d’un témoignage ?
  rationale: La tournure χρείαν ἔχειν signifie « avoir besoin ». Dans cette question rhétorique, τί ἔτι se rend naturellement par « pourquoi… encore ? », tandis que « témoignage » convient au contexte judiciaire.
- source_word: αὐτοὶ γὰρ ἠκούσαμεν
  choice: Nous l’avons nous-mêmes entendu
  rationale: « Nous-mêmes » conserve l’insistance de αὐτοί. Le passé composé exprime en français l’audition récente dont ils tirent maintenant leur conclusion. Le pronom « l’ » reprend sans l’expliciter ce qui vient d’être entendu.
- source_word: ἀπὸ τοῦ στόματος αὐτοῦ
  choice: de sa bouche
  rationale: Cette expression conserve l’image grecque et souligne qu’ils ont entendu directement les paroles de Jésus, sans ajouter « propre », qui n’a pas de correspondant lexical distinct dans le grec.
theological_decisions:
- issue: Faut-il préciser la nature des paroles entendues comme un aveu, une affirmation ou un témoignage ?
  choice: Nous l’avons nous-mêmes entendu de sa bouche
  alternative: Nous avons nous-mêmes entendu son affirmation de sa propre bouche
  rationale: Le grec ne donne aucun complément explicite à ἠκούσαμεν. Le pronom neutre « l’ » permet un français naturel tout en évitant de qualifier théologiquement ou juridiquement ce qu’ils ont entendu.
translation_notes:
  register: Français international moderne, clair et digne. La question garde sa force rhétorique et le vocabulaire judiciaire du contexte, sans lourdeur archaïsante.
