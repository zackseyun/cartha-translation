id: LUK.22.53
reference: Luke 22:53
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καθ’ ἡμέραν ὄντος μου μεθ’ ὑμῶν ἐν τῷ ἱερῷ οὐκ ἐξετείνατε τὰς χεῖρας ἐπ’ ἐμέ· ἀλλ’ αὕτη ⸂ἐστὶν ὑμῶν⸃ ἡ ὥρα καὶ ἡ ἐξουσία τοῦ σκότους.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/053.yaml
  text: Day after day[a], while I was with you in the temple, you did not lay hands on me. But this is your hour[b], and the authority of darkness.
translation:
  language: fr
  text: Chaque jour, alors que j’étais avec vous dans le temple, vous ne m’avez pas mis la main dessus[a]. Mais voici votre heure, et l’autorité des ténèbres[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « vous n’avez pas étendu les mains contre moi » ; cette expression désigne ici une action hostile visant à l’arrêter.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « le pouvoir des ténèbres ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθ’ ἡμέραν
  choice: Chaque jour
  rationale: Expression distributive naturelle en français, qui indique une présence quotidienne répétée.
- source_word: ὄντος μου μεθ’ ὑμῶν
  choice: j’étais avec vous
  rationale: Le génitif absolu est rendu par une proposition temporelle intégrée, idiomatique en français.
- source_word: ἐν τῷ ἱερῷ
  choice: dans le temple
  rationale: ἱερόν désigne ici l’ensemble du domaine du temple; la formulation traditionnelle reste claire sans limiter le sens au sanctuaire intérieur.
- source_word: οὐκ ἐξετείνατε τὰς χεῖρας ἐπ’ ἐμέ
  choice: vous n’avez pas porté la main sur moi
  rationale: Cette locution française conserve l’image grecque d’une main tendue contre quelqu’un et exprime une action hostile, ici l’arrestation.
- source_word: ἀλλ’ αὕτη ἐστὶν ὑμῶν ἡ ὥρα
  choice: Mais c’est maintenant votre heure
  rationale: «Votre heure» conserve la solennité et l’idée d’un moment déterminé; «maintenant» explicite naturellement la valeur déictique de αὕτη sans interpréter davantage.
- source_word: ἐξουσία
  choice: pouvoir
  rationale: Dans «le pouvoir des ténèbres», ce terme français couvre l’autorité ou la domination qui peut s’exercer; une note signale l’autre rendu majeur.
- source_word: τοῦ σκότους
  choice: des ténèbres
  rationale: Le pluriel idiomatique français conserve la métaphore théologique sans identifier explicitement les ténèbres à Satan ou au mal.
theological_decisions:
- issue: Faut-il expliciter «le pouvoir des ténèbres» comme le pouvoir de Satan ou la domination du mal?
  choice: Conserver «le pouvoir des ténèbres».
  alternative: «l’autorité de Satan» ou «la domination du mal»
  rationale: Le grec nomme les ténèbres et non Satan ou le mal de façon explicite. La métaphore est donc maintenue afin de préserver sa portée et sa tension théologiques.
- issue: Rapport entre «votre heure» et «le pouvoir des ténèbres»
  choice: Conserver les deux expressions coordonnées sans préciser si elles sont strictement identiques.
  alternative: Paraphraser en faisant de l’heure celle où les ténèbres exercent leur pouvoir.
  rationale: La coordination grecque permet d’associer étroitement ces réalités sans en définir exhaustivement le rapport.
translation_notes:
  register: Français international moderne, digne et accessible. «Porter la main sur» garde l’image corporelle et le caractère hostile de l’expression grecque. «Les ténèbres» est le tour français usuel pour la métaphore de σκότος.
