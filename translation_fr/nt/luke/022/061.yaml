id: LUK.22.61
reference: Luke 22:61
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ στραφεὶς ὁ κύριος ἐνέβλεψεν τῷ Πέτρῳ, καὶ ὑπεμνήσθη ὁ Πέτρος τοῦ ⸀λόγου τοῦ κυρίου ὡς εἶπεν αὐτῷ ὅτι Πρὶν ἀλέκτορα φωνῆσαι ⸀σήμερον ἀπαρνήσῃ με τρίς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/061.yaml
  text: And the Lord turned and looked at Peter[a], and Peter remembered the word of the Lord, how he had said to him, “Before a rooster crows today, you will deny me three times.”
translation:
  language: fr
  text: 'Alors le Seigneur se retourna et regarda Pierre[a]. Pierre se souvint de la parole que le Seigneur lui avait dite : « Avant qu’un coq chante aujourd’hui, tu me renieras trois fois. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « fixa son regard sur Pierre » ; le verbe grec peut désigner un regard direct ou soutenu.
    reason: lexical_alternative
lexical_decisions:
- source_word: στραφεὶς
  choice: se retourna
  rationale: Le participe aoriste marque une action précédant le regard. « Se retourna » rend naturellement le mouvement du Seigneur en français.
- source_word: κύριος
  choice: Seigneur
  rationale: Ce titre appliqué à Jésus conserve ici sa portée narrative et christologique sans la réduire à « maître ».
- source_word: ἐνέβλεψεν
  choice: regarda
  rationale: Le verbe peut évoquer un regard direct ou soutenu. « Regarda » convient au texte principal, tandis qu’une note conserve la nuance plus forte possible.
- source_word: ὑπεμνήσθη
  choice: se souvint
  rationale: Même si la forme peut aussi signifier « fut amené à se souvenir », le contexte met en avant le souvenir qui revient à Pierre; « se souvint » est idiomatique.
- source_word: λόγου
  choice: parole
  rationale: Ici, λόγος désigne une déclaration précise de Jésus. « Parole » convient à l’expression biblique naturelle « la parole que le Seigneur lui avait dite ».
- source_word: ὡς εἶπεν αὐτῷ
  choice: que le Seigneur lui avait dite
  rationale: Dans ce contexte, ὡς introduit le contenu remémoré. Cette formulation française évite le tour lourd « comment il lui avait dit » tout en transmettant clairement le sens.
- source_word: Πρὶν ἀλέκτορα φωνῆσαι
  choice: Avant qu’un coq chante
  rationale: πρίν avec l’infinitif exprime l’antériorité. L’absence d’article devant ἀλέκτορα se rend naturellement par l’indéfini « un coq ».
- source_word: σήμερον
  choice: aujourd’hui
  rationale: Rend directement l’indication temporelle et l’immédiateté de la prédiction.
- source_word: ἀπαρνήσῃ
  choice: tu me renieras
  rationale: « Renier » est le verbe français précis et traditionnellement intelligible pour le refus répété de reconnaître son lien avec Jésus.
- source_word: τρίς
  choice: trois fois
  rationale: Expression claire et courante en français moderne.
theological_decisions:
- issue: Titre κύριος appliqué à Jésus
  choice: Seigneur
  alternative: Maître
  rationale: « Seigneur » préserve la force du titre dans le récit et sa portée christologique, sans imposer le sens plus étroit de « Maître ».
translation_notes:
  register: Français international moderne, naturel et digne. La phrase est légèrement restructurée pour éviter une répétition maladroite de coordination et rendre clairement le contenu du souvenir, tout en conservant la séquence des actions et l’ambiguïté relative à l’intensité du regard dans une note.
