id: LUK.22.39
reference: Luke 22:39
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ ἐξελθὼν ἐπορεύθη κατὰ τὸ ἔθος εἰς τὸ Ὄρος τῶν Ἐλαιῶν· ἠκολούθησαν δὲ αὐτῷ καὶ οἱ ⸀μαθηταί.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/039.yaml
  text: And going out[a], he went as was his custom to the Mount of Olives, and the disciples also followed him.
translation:
  language: fr
  text: Puis il sortit et se rendit, comme il en avait l’habitude, au mont des Oliviers. Les disciples le suivirent eux aussi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ ἐξελθὼν
  choice: Puis il sortit
  rationale: Le participe aoriste ἐξελθών exprime une action précédant le verbe principal. Une proposition coordonnée est plus naturelle en français moderne, tandis que « Puis » rend l’enchaînement narratif marqué par Καί.
- source_word: ἐπορεύθη
  choice: se rendit
  rationale: Dans ce contexte de déplacement vers un lieu précis, « se rendit » traduit naturellement πορεύομαι sans la lourdeur de « poursuivit son chemin ».
- source_word: κατὰ τὸ ἔθος
  choice: comme il en avait l’habitude
  rationale: La formule grecque signifie « selon l’habitude ». Le contexte identifie clairement Jésus comme celui dont il s’agit; cette tournure française idiomatique exprime la pratique coutumière sans préciser davantage la nature de l’habitude.
- source_word: εἰς τὸ Ὄρος τῶν Ἐλαιῶν
  choice: au mont des Oliviers
  rationale: Il s’agit du nom géographique traditionnel et immédiatement reconnaissable en français.
- source_word: ἠκολούθησαν δὲ αὐτῷ
  choice: Les disciples le suivirent
  rationale: Ἀκολουθέω conserve ici son sens direct de suivre une personne en déplacement. Δέ assure une transition narrative légère, rendue naturellement par une nouvelle phrase.
- source_word: καὶ οἱ μαθηταί
  choice: Les disciples… eux aussi
  rationale: Le second καί a une valeur additive. « eux aussi » la fait ressortir clairement tout en évitant d’ajouter le possessif « ses », absent du grec.
theological_decisions:
- issue: Rattachement de l’habitude à Jésus
  choice: comme il en avait l’habitude
  alternative: selon l’habitude
  rationale: Même si le grec ne comporte pas de possessif explicite, son sujet grammatical et le contexte rattachent naturellement l’habitude à Jésus. La formulation retenue est idiomatique et ne précise rien au-delà de cette relation contextuelle.
translation_notes:
  register: Français international moderne, narratif et digne. La construction participiale grecque est transformée en deux verbes coordonnés pour assurer une lecture fluide, sans perdre l’ordre des actions. Aucun appel de note n’est nécessaire.
