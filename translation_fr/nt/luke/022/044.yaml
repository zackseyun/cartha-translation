id: LUK.22.44
reference: Luke 22:44
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ γενόμενος ἐν ἀγωνίᾳ ἐκτενέστερον προσηύχετο· ⸄καὶ ἐγένετο⸅ ὁ ἱδρὼς αὐτοῦ ὡσεὶ θρόμβοι αἵματος καταβαίνοντες ἐπὶ τὴν γῆν.⸃
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/044.yaml
  text: And being in agony[a], he was praying more intensely[c][b]; and his sweat became like drops of blood falling to the ground.
translation:
  language: fr
  text: En proie à l’angoisse, il priait avec plus d’intensité[a] ; sa sueur devint comme des gouttes de sang[b] qui tombaient à terre.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « avec plus d’ardeur » ou « avec plus de ferveur ».'
    reason: lexical_alternative
  - marker: b
    text: Le grec porte « comme des caillots de sang » ; le terme peut désigner des masses épaisses et, dans ce contexte, de grosses gouttes. Il maintient une comparaison sans affirmer que la sueur elle-même était du sang.
    reason: lexical_alternative
  - marker: c
    text: Certains manuscrits omettent Luc 22.43-44, tandis que d’autres les contiennent. Le SBLGNT place ces versets entre crochets pour signaler cette incertitude textuelle.
    reason: textual_variant
lexical_decisions:
- source_word: γενόμενος ἐν ἀγωνίᾳ
  choice: En proie à l’angoisse
  rationale: Cette tournure française exprime naturellement l’état de lutte intérieure et de détresse intense. « Agonie » a été évité dans le texte principal, car en français moderne ce mot évoque surtout les derniers instants avant la mort et risquerait de restreindre le sens du grec.
- source_word: ἐκτενέστερον
  choice: avec plus d’intensité
  rationale: Le comparatif indique une intensification de la prière. Cette formulation en conserve explicitement la valeur comparative sans préciser indûment si cette intensité relève surtout de la ferveur, de l’effort ou de l’insistance.
- source_word: προσηύχετο
  choice: il priait
  rationale: L’imparfait rend l’action en cours exprimée par l’imparfait grec.
- source_word: ἐγένετο
  choice: devint
  rationale: Le verbe marque l’apparition d’un état résultant ; « devint » en préserve la force sans l’aplatir en une simple description statique.
- source_word: ὡσεὶ
  choice: comme
  rationale: Le terme introduit explicitement une comparaison et non une identification certaine.
- source_word: θρόμβοι αἵματος
  choice: des gouttes de sang
  rationale: « Gouttes de sang » donne en français une image naturelle de ce qui tombe à terre, tandis qu’une note signale que θρόμβοι peut aussi évoquer des masses épaisses ou des caillots.
- source_word: καταβαίνοντες ἐπὶ τὴν γῆν
  choice: qui tombaient à terre
  rationale: La formulation rend clairement le mouvement descendant et s’accorde naturellement avec l’image des gouttes.
theological_decisions:
- issue: Nature de la comparaison entre la sueur et le sang
  choice: 'Maintenir une comparaison : « sa sueur devint comme des gouttes de sang »'
  alternative: Affirmer que la sueur était réellement du sang
  rationale: La particule ὡσεὶ marque une ressemblance. La traduction ne transforme donc pas la comparaison en affirmation physiologique ou miraculeuse, tout en préservant la force saisissante de l’image.
- issue: Degré de précision de ἀγωνία
  choice: Traduire par « angoisse »
  alternative: Traduire par « agonie »
  rationale: Le grec décrit une lutte ou une détresse extrême. En français contemporain, « agonie » désigne habituellement la phase précédant immédiatement la mort ; « angoisse » préserve mieux l’état intérieur sans imposer ce sens plus étroit.
translation_notes:
  register: Français international moderne, naturel et digne. « En proie à l’angoisse » communique la gravité de la scène sans employer le faux ami potentiel « agonie ». La ponctuation conserve l’enchaînement serré des deux propositions, et les notes rendent visibles l’ambiguïté lexicale ainsi que la variante manuscrite.
