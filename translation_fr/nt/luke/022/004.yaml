reference: Luke 22:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἀπελθὼν συνελάλησεν τοῖς ἀρχιερεῦσιν καὶ στρατηγοῖς τὸ πῶς ⸂αὐτοῖς παραδῷ αὐτόν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/004.yaml
  text: And he went away and discussed with the chief priests and officers how he might hand him over to them[a][b].
translation:
  language: fr
  text: Il s’en alla et discuta avec les chefs des prêtres et les officiers de la garde du Temple[b] de la manière dont il pourrait leur livrer Jésus[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le trahir ». Le verbe grec peut signifier « remettre », « livrer » ou, dans ce contexte, « trahir ».
    reason: lexical_alternative
  - marker: b
    text: Il s’agit vraisemblablement de responsables de la garde du Temple, et non de soldats romains.
    reason: cultural_note
lexical_decisions:
- source_word: ἀπελθὼν
  choice: Il partit donc
  rationale: Le participe aoriste exprime une action antérieure ou étroitement liée au verbe principal. Cette formulation française est naturelle, conserve la progression du récit et rend καί par « donc » dans sa valeur narrative.
- source_word: συνελάλησεν
  choice: discuta avec
  rationale: Le verbe désigne un échange concerté, et non une simple prise de parole. « Discuta avec » rend clairement cette idée en français courant.
- source_word: ἀρχιερεῦσιν
  choice: les chefs des prêtres
  rationale: Le pluriel désigne les principales autorités sacerdotales, et non plusieurs titulaires simultanés de la fonction de grand-prêtre.
- source_word: στρατηγοῖς
  choice: les responsables de la garde du Temple
  rationale: Dans ce contexte lucanien et hiérosolymitain, le terme désigne les responsables liés à la garde du Temple plutôt que des commandants militaires romains. L'explicitation évite une méprise naturelle en français.
- source_word: τὸ πῶς
  choice: de la manière dont
  rationale: L'expression introduit l'objet de leur discussion. Cette tournure restitue naturellement en français la construction grecque articulée.
- source_word: παραδῷ
  choice: pourrait leur livrer
  rationale: παραδίδωμι signifie remettre ou livrer quelqu'un à d'autres et peut, dans ce contexte, impliquer la trahison. « Livrer » préserve le sens concret sans réduire le verbe à cette seule nuance.
- source_word: αὐτοῖς ... αὐτόν
  choice: leur ... Jésus
  rationale: Le datif « leur » renvoie aux autorités mentionnées. Le pronom objet est explicité par « Jésus » afin d'éviter en français l'enchaînement potentiellement ambigu « le leur livrer ».
theological_decisions:
- issue: Sens de παραδῷ dans l'action de Judas
  choice: leur livrer Jésus
  alternative: le trahir
  rationale: 'Le contexte rend l''acte traître, mais le verbe grec a un champ sémantique plus large : remettre, livrer ou, selon le contexte, trahir. Le texte principal conserve le sens lexical concret, tandis que la note signale l''interprétation contextuelle.'
translation_notes:
  register: Français international moderne, clair et digne. « Chefs des prêtres » évite l'impression que plusieurs grands-prêtres exerçaient simultanément la charge suprême. « Responsables de la garde du Temple » explicite sobrement la fonction contextuelle de στρατηγοί. Les deux appels de note figurent dans le texte principal.
