id: LUK.22.24
reference: Luke 22:24
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἐγένετο δὲ καὶ φιλονεικία ἐν αὐτοῖς, τὸ τίς αὐτῶν δοκεῖ εἶναι μείζων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/024.yaml
  text: A dispute also arose among them as to which of them was considered to be greater[a].
translation:
  language: fr
  text: Une dispute s’éleva aussi entre eux pour savoir lequel d’entre eux était considéré comme plus grand[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « semblait être plus grand ». Le verbe grec peut signifier « sembler » ou « être considéré ».
    reason: Alternative lexicale préservant l’ambiguïté de δοκεῖ.
lexical_decisions:
- source_word: Ἐγένετο
  choice: s’éleva
  rationale: Le verbe introduit ici la naissance d’une situation. « S’éleva » exprime naturellement en français le déclenchement d’une dispute.
- source_word: δὲ καὶ
  choice: aussi
  rationale: « Aussi » conserve la valeur additive de καί. La légère progression narrative portée par δέ n’exige pas ici de connecteur français distinct.
- source_word: φιλονεικία
  choice: dispute
  rationale: Le nom désigne une contestation marquée par la rivalité. « Dispute » est clair, actuel et adapté au désaccord portant sur le rang.
- source_word: ἐν αὐτοῖς
  choice: entre eux
  rationale: L’expression situe la dispute au sein du groupe. « Entre eux » est idiomatique en français pour une querelle interne.
- source_word: τὸ τίς αὐτῶν
  choice: pour savoir lequel d’entre eux
  rationale: L’article introduit le contenu de la dispute sous la forme d’une question indirecte. Cette tournure est naturelle en français.
- source_word: δοκεῖ
  choice: était considéré
  rationale: Dans ce contexte de classement social, le verbe peut exprimer l’estimation accordée par le groupe. L’imparfait s’intègre naturellement au récit français, tandis qu’une note conserve l’autre sens possible.
- source_word: εἶναι
  choice: comme
  rationale: Avec « considérer », le complément attributif se construit naturellement avec « comme » en français.
- source_word: μείζων
  choice: le plus grand
  rationale: Bien que le grec emploie morphologiquement le comparatif, une question portant sur le rang d’une personne au sein d’un groupe se formule idiomatiquement en français avec « le plus grand ». Le sens demeure celui d’une supériorité relative dans le groupe.
theological_decisions:
- issue: Le langage du rang parmi les disciples
  choice: le plus grand
  alternative: plus grand
  rationale: Le grec a la forme comparative μείζων. En français, après « lequel d’entre eux », le superlatif relatif est la formulation naturelle pour désigner celui qui dépasse les autres; ce choix grammatical n’intensifie pas la revendication théologique.
- issue: La portée de δοκεῖ
  choice: était considéré
  alternative: semblait être
  rationale: Le contexte permet soit une estimation sociale, soit l’apparence. Le texte principal retient l’estimation sociale sans supprimer l’ambiguïté, signalée en note.
translation_notes:
  register: Français international moderne, clair et digne. « S’éleva » garde une tonalité narrative soutenue sans archaïsme marqué; « pour savoir » rend explicitement et naturellement le contenu de la dispute.
