id: LUK.22.19
reference: Luke 22:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ λαβὼν ἄρτον εὐχαριστήσας ἔκλασεν καὶ ἔδωκεν αὐτοῖς λέγων· Τοῦτό ἐστιν τὸ σῶμά μου ⸂[τὸ ὑπὲρ ὑμῶν διδόμενον· τοῦτο ποιεῖτε εἰς τὴν ἐμὴν ἀνάμνησιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/019.yaml
  text: And taking bread[a], after giving thanks he broke it and gave it to them, saying, “This is my body, which is given for you[c][b]. Keep doing this in remembrance of me.”
translation:
  language: fr
  text: 'Puis il prit du pain et, après avoir rendu grâce, il le rompit et le leur donna en disant : « Ceci est mon corps, qui est donné pour vous.[a][b] Continuez à faire cela en mémoire de moi. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Certains manuscrits omettent : « qui est donné pour vous. Continuez à faire cela en mémoire de moi. »'
    reason: textual_variant
  - marker: b
    text: 'Ou : « qui est en train d’être donné pour vous ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβὼν ἄρτον
  choice: il prit du pain
  rationale: Le participe aoriste s’intègre naturellement en français par un verbe conjugué dans la suite narrative, sans perdre l’ordre des actions.
- source_word: εὐχαριστήσας
  choice: après avoir rendu grâce
  rationale: Cette formulation idiomatique marque clairement l’antériorité de l’action et évite d’ajouter explicitement un destinataire absent du grec.
- source_word: ἔκλασεν καὶ ἔδωκεν αὐτοῖς
  choice: il le rompit et le leur donna
  rationale: Le pronom « le » reprend naturellement le pain; « leur » rend αὐτοῖς avec concision.
- source_word: Τοῦτό ἐστιν τὸ σῶμά μου
  choice: Ceci est mon corps
  rationale: La copule « est » est conservée sans paraphrase interprétative, afin de préserver la formulation et sa tension théologique.
- source_word: τὸ ὑπὲρ ὑμῶν διδόμενον
  choice: qui est donné pour vous
  rationale: La proposition relative rend naturellement la construction grecque; « pour vous » conserve la portée bénéficiaire de ὑπέρ sans préciser davantage le mécanisme théologique.
- source_word: τοῦτο ποιεῖτε
  choice: Continuez à faire cela
  rationale: Le présent impératif peut porter une valeur continue ou répétée; cette formulation la rend visible en français moderne.
- source_word: εἰς τὴν ἐμὴν ἀνάμνησιν
  choice: en mémoire de moi
  rationale: Expression française naturelle qui rend l’acte de commémoration sans réduire la phrase à un simple souvenir intérieur.
theological_decisions:
- issue: Sens de « Ceci est mon corps » dans le contexte eucharistique
  choice: Conserver « Ceci est mon corps »
  alternative: « Ceci représente mon corps » ou « Ceci signifie mon corps »
  rationale: Le grec emploie directement la copule ἐστιν. La traduction ne doit pas trancher par paraphrase un débat sacramentel que le texte laisse ouvert.
- issue: Statut textuel de la leçon longue
  choice: Inclure dans le texte « qui est donné pour vous. Continuez à faire cela en mémoire de moi »
  alternative: Terminer le verset après « Ceci est mon corps »
  rationale: Le SBLGNT fourni présente la leçon longue entre crochets comme texte de travail tout en signalant son incertitude; la variante courte est donc indiquée en note.
- issue: Aspect du participe διδόμενον
  choice: « qui est donné »
  alternative: « qui est en train d’être donné »
  rationale: Le présent participial permet de souligner le procès en cours, mais le présent français « est donné » demeure direct, naturel et compatible avec cette nuance sans la suraccentuer.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple convient au registre narratif biblique sans être archaïque. « Rendre grâce » est courant et précis; « Continuez à faire cela » explicite la valeur répétée possible du présent impératif.
