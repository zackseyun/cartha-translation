source:
  edition: SBLGNT
  text: εἶπεν ⸀δὲ Ἰησοῦς πρὸς τοὺς παραγενομένους ἐπ’ αὐτὸν ἀρχιερεῖς καὶ στρατηγοὺς τοῦ ἱεροῦ καὶ πρεσβυτέρους· Ὡς ἐπὶ λῃστὴν ⸀ἐξήλθατε μετὰ μαχαιρῶν καὶ ξύλων;
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/052.yaml
  text: But Jesus said to the chief priests[a], the officers of the temple, and the elders who had come against him, “Have you come out as against a robber, with swords and clubs?”
translation:
  language: fr
  text: 'Mais Jésus dit aux chefs des prêtres, aux chefs de la garde du Temple et aux anciens qui étaient venus contre lui : « Est-ce comme contre un bandit[a] que vous êtes venus avec des épées et des bâtons ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « brigand » ou « voleur ». Le mot grec λῃστής peut désigner un voleur, un brigand ou un hors-la-loi lié à une insurrection. Jésus oppose ici leur approche armée à celle employée contre un criminel dangereux.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Mais
  rationale: Marque ici une légère opposition et le passage de l’action d’arrestation à la réponse de Jésus.
- source_word: παραγενομένους ἐπ’ αὐτόν
  choice: qui étaient venus contre lui
  rationale: Dans ce contexte d’arrestation, ἐπί avec l’accusatif exprime une démarche hostile dirigée contre Jésus.
- source_word: ἀρχιερεῖς
  choice: chefs des prêtres
  rationale: Désigne collectivement les principales autorités sacerdotales; cette formulation est claire en français moderne.
- source_word: στρατηγοὺς τοῦ ἱεροῦ
  choice: responsables de la garde du Temple
  rationale: Le titre désigne les officiers chargés de la sécurité du Temple; la traduction explicite leur fonction sans les assimiler à des officiers militaires ordinaires.
- source_word: πρεσβυτέρους
  choice: anciens
  rationale: Il s’agit ici de dirigeants reconnus du peuple, et non simplement d’hommes âgés.
- source_word: Ὡς ἐπὶ λῃστὴν
  choice: Suis-je un bandit, pour que
  rationale: Cette reformulation française naturelle conserve la comparaison rhétorique et le lien entre la prétendue dangerosité de Jésus et le déploiement d’armes contre lui.
- source_word: ἐξήλθατε
  choice: vous soyez venus
  rationale: Dans la reformulation causale de la question, le passé composé au subjonctif renvoie naturellement à la démarche qu’ils viennent d’accomplir.
- source_word: μαχαιρῶν
  choice: épées
  rationale: Équivalent français courant et adapté à une scène d’arrestation.
- source_word: ξύλων
  choice: bâtons
  rationale: Dans ce contexte, le mot désigne des bâtons employés comme armes; « bâtons » reste naturel et concret.
theological_decisions:
- issue: Portée de λῃστής
  choice: bandit
  alternative: voleur; brigand; insurgé
  rationale: « Bandit » maintient l’idée d’un criminel dangereux contre lequel une force armée serait déployée, sans décider que Jésus évoque précisément un insurgé politique.
translation_notes:
  register: Français international moderne, naturel et digne. La question grecque est restructurée en « Suis-je… pour que… ? », tournure idiomatique qui conserve sa force rhétorique. La majuscule à « Temple » distingue le sanctuaire de Jérusalem d’un édifice religieux générique.
