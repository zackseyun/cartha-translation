  naturalness: Le français est généralement naturel et digne. « Est-ce comme contre un bandit que vous êtes venus… ? » est plus idiomatique que « Suis-je un bandit, pour que vous soyez venus… ? » tout en préservant la question rhétorique.
  terminology: « Chefs des prêtres », « chefs de la garde du Temple » et « anciens » rendent correctement les groupes dirigeants. « Bandit » est un bon choix principal pour λῃστής; la note doit exprimer ses possibilités lexicales sans présenter la violence ou l’insurrection comme inhérentes au mot.
