  text: ὁ δὲ ⸀ἠρνήσατο λέγων· ⸂Οὐκ οἶδα αὐτόν, γύναι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/057.yaml
  text: But he denied it[a], saying, “I do not know him[b], woman.”
translation:
  language: fr
  text: 'Mais il nia[a] : « Femme[b], je ne le connais pas. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus explicitement : « nia cela ». Le grec ne précise pas l’objet du verbe « nier » ; le contexte indique qu’il rejette l’affirmation de la servante.'
    reason: lexical_alternative
  - marker: b
    text: « Femme » traduit le vocatif γύναι, adresse directe à une interlocutrice. « Madame » serait plus poli, mais atténuerait la formulation grecque.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠρνήσατο
  choice: nia
  rationale: Le verbe ἀρνέομαι signifie ici nier ou repousser l’affirmation faite à son sujet. Employé sans complément, « nia » respecte l’absence d’objet explicite dans le grec tout en restant compréhensible dans le contexte.
- source_word: λέγων
  choice: en disant
  rationale: Le participe présent introduit les paroles par lesquelles Pierre formule son démenti ; « en disant » conserve naturellement ce lien.
- source_word: Οὐκ οἶδα
  choice: je ne connais pas
  rationale: Cette formulation rend directement le verbe de connaissance nié, dans un français courant et digne.
- source_word: αὐτόν
  choice: le
  rationale: Le pronom masculin renvoie directement à Jésus. Il n’est pas nécessaire de l’expliciter par « cet homme », ajout absent du grec.
- source_word: γύναι
  choice: Femme
  rationale: Le vocatif γύναι est une adresse directe à l’interlocutrice. « Femme » en conserve la force littérale sans introduire la nuance de politesse de « madame ».
theological_decisions:
- issue: Faut-il expliciter l’objet du reniement de Pierre ?
  choice: Conserver « nia » sans complément explicite.
  alternative: « le nia » ou « nia cela »
  rationale: Le grec ne précise pas l’objet de ἠρνήσατο. Dans le contexte, Pierre nie l’affirmation de la servante, mais ajouter « le » pourrait aussi être compris comme renvoyant à Jésus et surdéterminer le sens. Le français permet ici l’emploi absolu, légèrement soutenu, de « nier ».
translation_notes:
  register: Français moderne, sobre et digne. La tournure « il nia en disant » garde la structure participiale grecque. L’adresse « Femme » peut paraître abrupte en français actuel, mais elle préserve sans l’adoucir la forme directe du texte source.
