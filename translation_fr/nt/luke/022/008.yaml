source:
  edition: SBLGNT
  text: καὶ ἀπέστειλεν Πέτρον καὶ Ἰωάννην εἰπών· Πορευθέντες ἑτοιμάσατε ἡμῖν τὸ πάσχα ἵνα φάγωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/008.yaml
  text: And he sent Peter and John[a], saying, “Go and prepare the Passover for us, so that we may eat it.”
translation:
  language: fr
  text: 'Il envoya Pierre et Jean et leur dit : « Allez préparer la Pâque[a] pour nous, afin que nous la mangions. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le repas de la Pâque » ; le grec peut désigner la Pâque dans un sens plus large, mais ici le contexte de la préparation et du fait de manger indique qu’il s’agit du repas.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: envoya
  rationale: L’aoriste narratif signifie simplement « envoya » et conserve la sobriété du récit.
- source_word: εἰπών
  choice: en leur disant
  rationale: Cette formulation naturelle en français maintient le lien participial avec le verbe principal et introduit les paroles adressées à Pierre et Jean.
- source_word: Πορευθέντες
  choice: Allez
  rationale: Dans ce contexte d’ordre, le participe aoriste a la valeur d’une action préalable associée à l’impératif principal ; « Allez » en rend naturellement la force.
- source_word: ἑτοιμάσατε
  choice: préparer
  rationale: « Préparer » exprime clairement les dispositions pratiques demandées, sans préciser davantage que le grec.
- source_word: ἡμῖν
  choice: nous
  rationale: Le pronom datif indique les bénéficiaires de la préparation ; dans « nous préparer », le français exprime naturellement « préparer pour nous ».
- source_word: τὸ πάσχα
  choice: la Pâque
  rationale: Le grec peut désigner la fête, le repas ou ce qui est mangé à cette occasion. « La Pâque » conserve cette amplitude, tandis que le contexte oriente vers le repas.
- source_word: ἵνα φάγωμεν
  choice: afin que nous la mangions
  rationale: « Afin que » rend la finalité exprimée par ἵνα avec le subjonctif ; le pronom « la » reprend naturellement « la Pâque », objet implicite de « manger ».
theological_decisions:
- issue: Référent de « la Pâque »
  choice: Conserver « la Pâque » sans préciser s’il s’agit de l’ensemble du repas ou d’un élément sacrificiel plus restreint.
  alternative: « le repas de la Pâque » ou « l’agneau pascal »
  rationale: Le contexte de préparation et de consommation évoque fortement le repas, mais πάσχα possède une gamme de sens plus large. La formulation retenue préserve cette latitude du texte source.
translation_notes:
  register: Français international moderne, simple et digne. Le passé simple convient au registre narratif biblique sans être archaïque. « Allez nous préparer » est idiomatique et direct ; « afin que nous la mangions » conserve explicitement la relation de finalité du grec.
