  source_fidelity: 'Le sens est globalement fidèle au grec : Jésus envoie Pierre et Jean, leur donne l’ordre de préparer la Pâque pour le groupe, dans le but de la manger. « La Pâque » conserve à juste titre l’amplitude de πάσχα, sans imposer « repas » ou « agneau ».'
  naturalness: « Allez nous préparer la Pâque » est compréhensible, mais « Allez préparer la Pâque pour nous » est plus nettement idiomatique et évite toute lecture momentanée où « nous » serait l’objet de « préparer ». « Il envoya Pierre et Jean et leur dit » est une formulation narrative française simple et naturelle.
  terminology: « La Pâque » est le terme approprié pour le contexte juif et correspond au genre et à l’usage biblique français. Le pronom féminin « la » est cohérent avec ce choix. La note lexicale est exacte, mais son appel doit être ancré à « la Pâque », le terme qu’elle explique, et non à « Jean ».
