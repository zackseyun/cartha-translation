id: LUK.22.54
reference: Luke 22:54
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Συλλαβόντες δὲ αὐτὸν ἤγαγον καὶ ⸀εἰσήγαγον εἰς ⸂τὴν οἰκίαν⸃ τοῦ ἀρχιερέως· ὁ δὲ Πέτρος ἠκολούθει μακρόθεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/054.yaml
  text: After arresting him[a], they led him away and brought him into the high priest’s house; but Peter was following at a distance.
translation:
  language: fr
  text: Après l’avoir arrêté, ils l’emmenèrent et le firent entrer dans la maison du grand prêtre ; mais Pierre suivait à distance[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de loin ».
    reason: Alternative lexicale naturelle pour μακρόθεν.
lexical_decisions:
- source_word: Συλλαβόντες
  choice: Après l’avoir arrêté
  rationale: Le participe aoriste exprime une action antérieure aux verbes principaux. « Arrêter » convient au contexte de mise sous garde et donne une formulation naturelle en français moderne.
- source_word: ἤγαγον
  choice: ils l’emmenèrent
  rationale: Le verbe exprime ici le déplacement de Jésus sous la conduite de ceux qui l’ont arrêté. « Emmener » rend naturellement ce mouvement vers un autre lieu.
- source_word: εἰσήγαγον
  choice: le firent entrer
  rationale: Le préverbe εἰσ- marque l’entrée dans un lieu. Cette formulation conserve la distinction avec ἤγαγον sans répétition maladroite.
- source_word: οἰκίαν
  choice: la maison
  rationale: Le contexte désigne le bâtiment où réside le grand prêtre ; « maison » est le terme français le plus direct et le moins marqué.
- source_word: ἀρχιερέως
  choice: du grand prêtre
  rationale: « Grand prêtre » est l’équivalent français établi du titre ἀρχιερεύς dans ce contexte.
- source_word: ἠκολούθει
  choice: suivait
  rationale: L’imparfait français rend naturellement l’action en cours exprimée par l’imparfait grec, sans ajouter de jugement sur les motifs de Pierre.
- source_word: μακρόθεν
  choice: à distance
  rationale: Cette expression rend clairement l’éloignement spatial dans un français actuel ; « de loin » reste une possibilité idiomatique.
- source_word: δὲ
  choice: mais
  rationale: Le second δέ introduit un léger contraste entre Jésus emmené dans la maison et Pierre qui continue à le suivre à distance.
theological_decisions:
- issue: Description de l’attitude de Pierre pendant l’arrestation de Jésus
  choice: « Pierre suivait à distance » décrit seulement son action et son éloignement physique.
  alternative: Ajouter une qualification telle que « discrètement », « secrètement » ou « par peur ».
  rationale: Le texte ne précise pas le mobile de Pierre. La traduction maintient la tension narrative sans lui attribuer une intention ou un état psychologique.
translation_notes:
  register: 'Français international moderne, clair et digne. Le passé simple convient au récit écrit, tandis que l’imparfait « suivait » préserve l’aspect continu. La structure conserve les deux mouvements successifs : emmener Jésus, puis le faire entrer.'
