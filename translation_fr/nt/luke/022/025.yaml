id: LUK.22.25
reference: Luke 22:25
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτοῖς· Οἱ βασιλεῖς τῶν ἐθνῶν κυριεύουσιν αὐτῶν καὶ οἱ ἐξουσιάζοντες αὐτῶν εὐεργέται καλοῦνται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/025.yaml
  text: But he said to them[a], “The kings of the Gentiles lord it over them[b], and those exercising authority over them are called benefactors.”
translation:
  language: fr
  text: 'Mais il leur dit : « Les rois des nations[a] les dominent, et ceux qui exercent leur autorité sur elles sont appelés “bienfaiteurs”[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des non-Juifs ».
    reason: lexical_alternative
  - marker: b
    text: « Bienfaiteurs » était un titre honorifique donné à des souverains ou à de puissants protecteurs considérés comme faisant du bien à la collectivité.
    reason: cultural_note
lexical_decisions:
- source_word: βασιλεῖς
  choice: rois
  rationale: Le nom désigne précisément des rois plutôt que des dirigeants en général.
- source_word: τῶν ἐθνῶν
  choice: des nations
  rationale: Cette traduction naturelle conserve la portée collective du grec et son ambiguïté possible entre les nations en général et les peuples non juifs; l’autre sens est signalé en note.
- source_word: κυριεύουσιν
  choice: exercent leur domination
  rationale: Cette formulation exprime l’exercice d’une maîtrise dominante et prépare clairement le contraste avec le modèle de conduite donné par Jésus.
- source_word: ἐξουσιάζοντες
  choice: ceux qui exercent leur autorité
  rationale: La tournure verbale conserve le caractère actif du participe grec, qui décrit l’exercice de l’autorité et non la simple possession d’une fonction.
- source_word: εὐεργέται
  choice: bienfaiteurs
  rationale: « Bienfaiteurs » correspond au titre honorifique employé dans le monde gréco-romain pour des souverains ou de puissants protecteurs réputés procurer des avantages publics.
- source_word: καλοῦνται
  choice: sont appelés
  rationale: Le passif grec indique simplement le titre qu’on leur attribue, sans préciser s’il est mérité.
- source_word: δὲ
  choice: Mais
  rationale: La conjonction marque ici un léger contraste avec la discussion précédente des disciples.
theological_decisions:
- issue: Sens de ἐθνῶν dans le contexte
  choice: nations
  alternative: non-Juifs
  rationale: Le grec peut désigner les nations ou, dans l’usage néotestamentaire, les peuples non juifs. Le texte principal garde l’expression française naturelle « nations », tandis que la note préserve explicitement l’autre lecture sans imposer une interprétation confessionnelle.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme « exercent leur domination / exercent leur autorité » reflète les deux verbes grecs et maintient la tension entre pouvoir politique, réputation publique et véritable service.
