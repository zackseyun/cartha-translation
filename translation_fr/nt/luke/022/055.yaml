id: LUK.22.55
reference: Luke 22:55
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸀περιαψάντων δὲ πῦρ ἐν μέσῳ τῆς αὐλῆς καὶ ⸀συγκαθισάντων ἐκάθητο ὁ Πέτρος ⸀μέσος αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/055.yaml
  text: And after they had kindled a fire in the middle of the courtyard and sat down together[a], Peter was sitting among them.
translation:
  language: fr
  text: Après qu’ils eurent allumé un feu au milieu de la cour et se furent assis ensemble, Pierre était assis parmi eux.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « Pierre s’assit au milieu d’eux. » L’imparfait grec présente toutefois la scène comme en cours, ce que rend mieux « était assis ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: περιαψάντων
  choice: Après qu’ils eurent allumé
  rationale: Le participe aoriste au génitif pluriel exprime une action antérieure à celle du verbe principal. « Allumer » est le verbe français naturel avec « un feu ».
- source_word: πῦρ
  choice: un feu
  rationale: Dans ce contexte, le nom singulier désigne le feu concret que le groupe vient d’allumer ; l’article indéfini convient en français.
- source_word: ἐν μέσῳ τῆς αὐλῆς
  choice: au milieu de la cour
  rationale: La locution a ici un sens spatial concret. « Cour » désigne naturellement l’espace découvert intérieur de la résidence du grand prêtre.
- source_word: συγκαθισάντων
  choice: se furent assis ensemble
  rationale: Le participe aoriste est parallèle à περιαψάντων, et le préfixe σύν marque le fait de s’asseoir ensemble. Le plus-que-parfait maintient l’antériorité par rapport à la scène principale.
- source_word: ἐκάθητο
  choice: était assis
  rationale: L’imparfait grec présente Pierre dans une posture continue à l’arrière-plan ; l’imparfait français restitue naturellement cet aspect.
- source_word: μέσος αὐτῶν
  choice: parmi eux
  rationale: L’expression situe Pierre à l’intérieur du groupe. « Parmi eux » est idiomatique et fidèle sans suggérer nécessairement une position géométriquement centrale.
- source_word: δὲ
  choice: Après que
  rationale: La particule assure une transition narrative légère. En français, la relation avec la phrase précédente peut rester implicite dans la construction temporelle, sans ajout lourd de « et ».
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe conserve l’antériorité des deux participes aoristes et l’aspect continu de l’imparfait, tout en restant claire pour un lectorat général.
