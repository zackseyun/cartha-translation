id: LUK.22.27
reference: Luke 22:27
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τίς γὰρ μείζων, ὁ ἀνακείμενος ἢ ὁ διακονῶν; οὐχὶ ὁ ἀνακείμενος; ἐγὼ δὲ ⸂ἐν μέσῳ ὑμῶν εἰμι⸃ ὡς ὁ διακονῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/027.yaml
  text: For who is greater[a], the one reclining at the table or the one serving? Is it not the one reclining at the table? But I am among you as one who serves.
translation:
  language: fr
  text: 'Car qui est le plus grand : celui qui est à table[a] ou celui qui sert ? N’est-ce pas celui qui est à table ? Mais moi, je suis parmi vous comme celui qui sert.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec désigne littéralement celui qui est allongé à table. Selon l’usage des banquets antiques, les convives prenaient leur repas en position allongée, tandis que d’autres les servaient.
    reason: cultural_note
lexical_decisions:
- source_word: τίς γὰρ μείζων
  choice: Car qui est le plus grand
  rationale: « Car » maintient le lien explicatif avec ce qui précède, et « le plus grand » exprime naturellement en français le rang ou le statut supérieur visé par le comparatif μείζων.
- source_word: ὁ ἀνακείμενος
  choice: celui qui est à table
  rationale: Dans un contexte de repas, le participe désigne celui qui est étendu à table selon l’usage antique. « Est à table » est naturel en français moderne, tandis que la note conserve le détail culturel de la position allongée.
- source_word: ὁ διακονῶν
  choice: celui qui sert
  rationale: Le participe présent décrit l’action de servir, particulièrement dans le cadre du repas. Cette formulation évite les connotations institutionnelles de « ministre » et la nuance de statut attachée à « esclave » ou « serviteur ».
- source_word: οὐχί
  choice: N’est-ce pas
  rationale: Cette tournure rend la question rhétorique grecque, qui attend une réponse affirmative.
- source_word: ἐγὼ δὲ
  choice: Pourtant, moi
  rationale: δέ marque ici un contraste avec l’ordre social normalement admis; « pourtant » le rend clairement, tandis que le pronom tonique souligne ἐγώ.
- source_word: ἐν μέσῳ ὑμῶν εἰμι
  choice: je suis au milieu de vous
  rationale: Cette expression reste proche du grec tout en étant claire et idiomatique en français; « parmi vous » serait également possible.
- source_word: ὡς ὁ διακονῶν
  choice: comme celui qui sert
  rationale: « Comme » conserve la valeur de manière ou de comparaison de ὡς sans transformer le participe en un titre ou un statut substantiel.
theological_decisions:
- issue: La manière de rendre la description que Jésus donne de lui-même
  choice: Pourtant, moi, je suis au milieu de vous comme celui qui sert.
  alternative: Mais moi, je suis parmi vous comme un serviteur.
  rationale: Le grec emploie le participe διακονῶν, « celui qui sert », et non un nom désignant un serviteur ou un esclave. La traduction retenue conserve l’accent sur l’action de servir dans la scène du repas, ainsi que l’humilité christologique du propos, sans lui ajouter une nuance de statut absente du terme.
translation_notes:
  register: Français international moderne, clair et digne. La formulation « celui qui est à table » privilégie l’intelligibilité immédiate; la note restitue précisément la coutume antique exprimée par ἀνακείμενος. Le contraste entre statut social et service est maintenu sans vocabulaire ecclésiastique ajouté.
