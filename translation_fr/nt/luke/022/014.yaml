  yaml_path: translation/nt/luke/022/014.yaml
  text: And when the hour came[a], he reclined at the table, and the apostles with him.
translation:
  language: fr
  text: Quand l’heure fut venue, il prit place à table[a], et les apôtres avec lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « il se mit à table en position allongée » ; à cette époque, on prenait habituellement les repas en position allongée autour de la table.'
    reason: cultural_note
lexical_decisions:
- source_word: Καὶ ὅτε ἐγένετο ἡ ὥρα
  choice: Quand l’heure fut venue
  rationale: Cette tournure française naturelle conserve « l’heure » et présente le moment attendu comme étant arrivé. Le καί initial est intégré au lien narratif sans imposer un « Et » peu naturel en français.
- source_word: ἀνέπεσεν
  choice: il prit place à table
  rationale: Cette formulation courante indique clairement le contexte du repas. La note précise la posture allongée propre aux repas de l’époque, afin de ne pas effacer le sens historique du verbe.
- source_word: οἱ ἀπόστολοι
  choice: les apôtres
  rationale: Rendu direct du groupe nominal avec article, sans ajouter le possessif « ses », absent du grec.
- source_word: σὺν αὐτῷ
  choice: avec lui
  rationale: Traduction directe et idiomatique de la relation exprimée par σύν.
theological_decisions:
- issue: Posture de Jésus pendant le repas
  choice: il prit place à table, avec une note indiquant la posture allongée
  alternative: il s’allongea pour prendre le repas
  rationale: Le texte principal reste naturel pour un lectorat moderne, tandis que la note conserve la précision historique du grec. Ce choix culturel et lexical n’ajoute aucune interprétation doctrinale.
translation_notes:
  register: Français international moderne, simple et digne. La syntaxe elliptique « et les apôtres avec lui » est conservée, car elle demeure claire et reflète la concision du grec.
