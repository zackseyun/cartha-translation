id: LUK.22.32
reference: Luke 22:32
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐγὼ δὲ ἐδεήθην περὶ σοῦ ἵνα μὴ ἐκλίπῃ ἡ πίστις σου· καὶ σύ ποτε ἐπιστρέψας ⸀στήρισον τοὺς ἀδελφούς σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/032.yaml
  text: But I have prayed for you[a], that your faith may not fail; and you, when you have turned back[b], strengthen your brothers.
translation:
  language: fr
  text: Mais moi, j’ai prié pour toi, afin que ta foi ne défaille pas[a]. Et toi, quand tu seras revenu[b], affermis tes frères.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « afin que ta fidélité ne défaille pas » ou « afin que ta confiance ne disparaisse pas ». Le mot grec peut réunir ces nuances.
    reason: alternative_reading
  - marker: b
    text: Ou « quand tu te seras retourné ». L’expression évoque le retour et le rétablissement de Pierre après sa défaillance à venir.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδεήθην
  choice: j’ai prié
  rationale: Le verbe exprime une demande instante. « J’ai prié » est naturel en français et présente l’intercession comme accomplie, sans la renforcer excessivement par « supplié ».
- source_word: περὶ σοῦ
  choice: pour toi
  rationale: Avec un verbe de prière, περί suivi du génitif exprime naturellement l’intercession en faveur de quelqu’un.
- source_word: ἵνα μὴ ἐκλίπῃ
  choice: afin que… ne défaille pas
  rationale: ἐκλείπω peut signifier cesser, manquer ou défaillir. « Ne défaille pas » convient à la foi mise à l’épreuve sans affirmer sa disparition totale.
- source_word: πίστις
  choice: foi
  rationale: « Foi » conserve l’étendue du terme grec, qui peut ici inclure la confiance et la fidélité sans se réduire à l’une d’elles.
- source_word: ποτε
  choice: quand
  rationale: Dans cette construction tournée vers l’avenir, ποτέ désigne le moment où surviendra le retour; « quand » est idiomatique en français.
- source_word: ἐπιστρέψας
  choice: quand tu seras revenu
  rationale: Le participe évoque un retour après la défaillance annoncée. « Revenu » préserve l’idée de restauration sans imposer le terme plus technique de « repentance ».
- source_word: στήρισον
  choice: affermis
  rationale: Le verbe signifie rendre ferme ou fortifier. « Affermis » conserve cette image et convient au soutien spirituel demandé à Pierre.
- source_word: ἀδελφούς
  choice: frères
  rationale: Le masculin pluriel renvoie immédiatement aux autres disciples de Jésus, qui sont des hommes dans cette scène.
theological_decisions:
- issue: Portée de πίστις dans le contexte de l’épreuve de Pierre
  choice: foi
  alternative: fidélité; confiance
  rationale: « Foi » garde ensemble la confiance croyante et la fidélité persévérante. Une note préserve les nuances possibles sans restreindre le grec.
- issue: Sens de ἐπιστρέψας après la défaillance annoncée
  choice: quand tu seras revenu
  alternative: quand tu te seras retourné; quand tu seras revenu à moi
  rationale: Le texte suggère le rétablissement de Pierre après son reniement, mais ne précise pas explicitement le complément du retour. La formulation choisie conserve cette tension.
- issue: Référent de ἀδελφούς
  choice: frères
  alternative: frères et sœurs; autres croyants
  rationale: Dans le contexte immédiat, Jésus s’adresse à Pierre au sujet du cercle des disciples masculins; « frères » respecte ce référent.
translation_notes:
  register: Français international moderne, digne et accessible. « Défaillir » et « affermir » maintiennent la force imagée du grec tout en restant intelligibles dans un registre biblique courant.
