id: LUK.22.45
reference: Luke 22:45
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἀναστὰς ἀπὸ τῆς προσευχῆς ἐλθὼν πρὸς τοὺς μαθητὰς εὗρεν ⸂κοιμωμένους αὐτοὺς⸃ ἀπὸ τῆς λύπης,
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/045.yaml
  text: And after rising from prayer[a], he came to the disciples and found them sleeping from sorrow.
translation:
  language: fr
  text: Puis il se releva après avoir prié, alla vers les disciples et les trouva endormis à cause de la tristesse.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναστὰς ἀπὸ τῆς προσευχῆς
  choice: il se releva après avoir prié
  rationale: Le participe aoriste ἀναστάς exprime une action antérieure, et ἀπὸ τῆς προσευχῆς le point de départ après la prière. Cette formulation rend naturellement en français la succession des actions sans suggérer que Jésus se relève de la prière elle-même.
- source_word: ἐλθὼν πρὸς τοὺς μαθητάς
  choice: alla vers les disciples
  rationale: Le participe ἐλθών et πρός indiquent un déplacement en direction des disciples. La coordination par un verbe conjugué donne une phrase française fluide et conserve la séquence narrative.
- source_word: μαθητάς
  choice: disciples
  rationale: « Disciples » est le terme français usuel et précis dans le contexte des Évangiles.
- source_word: εὗρεν
  choice: les trouva
  rationale: « Trouva » rend directement εὗρεν et introduit naturellement l'état constaté.
- source_word: κοιμωμένους αὐτούς
  choice: les trouva endormis
  rationale: Le participe présent décrit leur état au moment où Jésus les trouve. « Endormis » est idiomatique en français tout en conservant l'aspect duratif du contexte.
- source_word: ἀπὸ τῆς λύπης
  choice: à cause de la tristesse
  rationale: Ici, ἀπό exprime naturellement la cause. « À cause de la tristesse » est plus clair et plus idiomatique que le calque « de tristesse »; λύπη désigne leur profonde peine ou tristesse.
theological_decisions:
- issue: Lien entre la tristesse et le sommeil des disciples
  choice: Leur sommeil est présenté comme causé par la tristesse.
  alternative: Ils dormaient tout en étant tristes, sans lien causal fortement marqué.
  rationale: Dans ce contexte, ἀπὸ τῆς λύπης exprime le plus naturellement la cause. La traduction ne développe aucune explication psychologique au-delà de ce qu'affirme le texte.
translation_notes:
  register: Français international moderne, sobre et digne. La phrase suit clairement la succession des actions et évite les calques peu naturels, tout en restant proche de la syntaxe et du sens du grec.
source_grounding:
  english_pob_role: consult_only
