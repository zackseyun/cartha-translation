  variant: modern international French
source:
  edition: SBLGNT
  text: ⸂ὤφθη δὲ αὐτῷ ἄγγελος ⸀ἀπ’ οὐρανοῦ ἐνισχύων αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/043.yaml
  text: Then an angel from heaven appeared to him[a], strengthening him.
translation:
  language: fr
  text: Alors un ange venu du ciel lui apparut[a] et le fortifia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Certains manuscrits omettent les versets 43–44.
    reason: textual_variant
lexical_decisions:
- source_word: ὤφθη
  choice: apparut
  rationale: L’aoriste passif de ὁράω fonctionne ici comme une formule d’apparition. « Apparut » est naturel en français et évite le tour plus mécanique « fut vu ».
- source_word: δὲ
  choice: Alors
  rationale: δέ marque ici la progression du récit plutôt qu’une opposition nette. « Alors » rend ce mouvement de façon idiomatique.
- source_word: αὐτῷ
  choice: lui
  rationale: 'Avec ὤφθη, le datif désigne la personne à qui l’apparition se manifeste : « lui apparut ».'
- source_word: ἄγγελος
  choice: un ange
  rationale: L’origine céleste indique clairement le sens d’« ange » plutôt que celui, plus général, de « messager ».
- source_word: ἀπ’ οὐρανοῦ
  choice: venu du ciel
  rationale: Cette formulation française naturelle exprime l’origine céleste de l’ange sans archaïsme.
- source_word: ἐνισχύων
  choice: et le fortifiait
  rationale: Le participe présent exprime une action accompagnant l’apparition. L’imparfait conserve sa valeur durative, tandis que la coordination est plus naturelle en français qu’un participe présent.
- source_word: αὐτόν
  choice: le
  rationale: Le pronom objet renvoie à Jésus et se rend directement par « le ».
theological_decisions:
- issue: Statut textuel de Luc 22.43
  choice: Inclure le verset dans le texte principal conformément au texte grec fourni par la SBLGNT.
  alternative: Certains manuscrits omettent les versets 43-44.
  rationale: Le verset est traduit d’après le texte source fourni. Son attestation étant discutée dans la tradition manuscrite, l’omission est signalée en note sans trancher silencieusement la question.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase suit la progression narrative du grec, tout en transformant le participe en proposition coordonnée pour une lecture fluide.
