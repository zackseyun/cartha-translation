source:
  edition: SBLGNT
  text: λέγων· Πάτερ, εἰ βούλει ⸀παρένεγκε ⸂τοῦτο τὸ ποτήριον⸃ ἀπ’ ἐμοῦ· πλὴν μὴ τὸ θέλημά μου ἀλλὰ τὸ σὸν ⸀γινέσθω.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/042.yaml
  text: saying[a], “Father, if you are willing, take this cup away from me. Nevertheless, not my will[c][b], but yours be done.”
translation:
  language: fr
  text: 'disant : « Père, si tu le veux, éloigne de moi cette coupe[a]. Pourtant, que ce ne soit pas ma volonté, mais la tienne qui se réalise[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dans la Bible, la « coupe » représente parfois la part attribuée à quelqu’un, souvent une souffrance ou un jugement.
    reason: cross_reference
  - marker: b
    text: 'Autre traduction : « Pourtant, que se réalise non pas ce que je veux, mais ce que tu veux. »'
    reason: alternative_reading
lexical_decisions:
- source_word: λέγων
  choice: disant
  rationale: Le participe présent introduit le contenu de la prière et conserve son lien syntaxique avec le contexte précédent.
- source_word: Πάτερ
  choice: Père
  rationale: Vocatif direct adressé à Dieu ; cette forme est naturelle, digne et n’ajoute aucune interjection absente du grec.
- source_word: εἰ βούλει
  choice: si tu le veux
  rationale: βούλομαι exprime ici la volonté ou le consentement. Cette formulation française est directe et préserve la condition.
- source_word: παρένεγκε … ἀπ’ ἐμοῦ
  choice: éloigne de moi
  rationale: L’impératif de παραφέρω, complété par ἀπ’ ἐμοῦ, demande que la coupe soit écartée de Jésus. « Éloigne de moi » est naturel et conserve l’image sans l’expliquer.
- source_word: τοῦτο τὸ ποτήριον
  choice: cette coupe
  rationale: La traduction littérale maintient la métaphore biblique et ses résonances liées à la part assignée, notamment à la souffrance ou au jugement.
- source_word: πλὴν
  choice: Pourtant
  rationale: Marque nettement le tournant concessif entre la demande et la soumission, dans un français moderne et solennel.
- source_word: μὴ τὸ θέλημά μου ἀλλὰ τὸ σὸν
  choice: que ce ne soit pas ma volonté, mais la tienne
  rationale: Conserve les expressions nominales du grec et la distinction explicite entre la volonté de Jésus et celle du Père.
- source_word: γινέσθω
  choice: qui se réalise
  rationale: L’impératif de γίνομαι exprime ici l’accomplissement effectif de la volonté du Père. « Se réalise » rend ce sens naturellement sans réduire la formule à une simple action humaine.
theological_decisions:
- issue: Rapport entre la volonté de Jésus et celle du Père
  choice: « que ce ne soit pas ma volonté, mais la tienne qui se réalise »
  alternative: « non pas ce que je veux, mais ce que tu veux »
  rationale: La formulation maintient sans l’expliquer la distinction et la soumission présentes dans le texte, préservant ainsi sa tension théologique.
- issue: Portée métaphorique de la coupe
  choice: Conserver « cette coupe » dans le texte principal
  alternative: « cette souffrance » ou « cette épreuve »
  rationale: Interpréter directement l’image en termes de souffrance ou de jugement en réduirait la richesse et les résonances bibliques.
translation_notes:
  register: Français international moderne, naturel et digne. La structure participiale est conservée par « disant », puisque le verset dépend du contexte précédent. Le tutoiement correspond à l’usage français courant dans la prière biblique. Les marqueurs [a] et [b] figurent tous deux dans le texte principal.
