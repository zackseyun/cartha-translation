source:
  edition: SBLGNT
  text: καὶ ἐχάρησαν καὶ συνέθεντο αὐτῷ ἀργύριον δοῦναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/005.yaml
  text: And they rejoiced and agreed to give him money[a].
translation:
  language: fr
  text: Ils s’en réjouirent et convinrent de lui donner de l’argent[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « de l’argent métal ». Le mot grec peut désigner littéralement l’argent métal ou, plus généralement, une somme d’argent.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐχάρησαν
  choice: s’en réjouirent
  rationale: L’aoriste de χαίρω exprime ici leur réaction de joie. « S’en réjouirent » est naturel en français et rattache clairement cette joie à ce qui précède.
- source_word: συνέθεντο
  choice: convinrent
  rationale: Le moyen de συντίθημι signifie ici parvenir à un accord. « Convinrent » rend ce sens avec concision, sans introduire l’idée plus précise d’une promesse.
- source_word: αὐτῷ
  choice: lui
  rationale: Le pronom au datif désigne le bénéficiaire de l’action de donner. « Lui donner » est la construction idiomatique française.
- source_word: ἀργύριον
  choice: de l’argent
  rationale: Dans un contexte de transaction, ἀργύριον désigne couramment de l’argent comme moyen de paiement. Le sens littéral « argent métal » est conservé en note.
- source_word: δοῦναι
  choice: donner
  rationale: L’infinitif précise le contenu de l’accord. « Donner » est l’équivalent direct et évite le caractère plus interprétatif de « payer ».
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple convient au registre narratif biblique sans être archaïque. Le pronom « en » explicite naturellement que leur joie répond à la proposition évoquée dans le contexte immédiat.
