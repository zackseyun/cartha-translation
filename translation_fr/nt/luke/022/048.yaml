  text: ⸂Ἰησοῦς δὲ⸃ εἶπεν αὐτῷ· Ἰούδα, φιλήματι τὸν υἱὸν τοῦ ἀνθρώπου παραδίδως;
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/048.yaml
  text: But Jesus said to him[a], “Judas, are you betraying the Son of Man with a kiss?”
translation:
  language: fr
  text: 'Mais Jésus lui dit : « Judas, c’est par un baiser que tu livres[a] le Fils de l’homme ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Judas, est-ce par un baiser que tu trahis le Fils de l’homme ? »'
    reason: Variante lexicale contextuelle pour παραδίδως, qui peut mettre explicitement l’accent sur la trahison.
lexical_decisions:
- source_word: δὲ
  choice: Mais
  rationale: La particule marque ici une légère opposition entre le geste de Judas et la réaction de Jésus; « Mais » convient naturellement au contexte.
- source_word: εἶπεν αὐτῷ
  choice: lui dit
  rationale: Cette formulation française naturelle représente explicitement le pronom datif αὐτῷ.
- source_word: Ἰούδα
  choice: Judas
  rationale: Le vocatif est rendu par la forme française usuelle du nom propre.
- source_word: φιλήματι
  choice: par un baiser
  rationale: Le datif exprime le moyen ou l’instrument; « par un baiser » conserve la force concrète et frappante du geste.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: le Fils de l’homme
  rationale: Cette désignation traditionnelle préserve la structure grecque, l’usage évangélique et les résonances scripturaires du titre.
- source_word: παραδίδως
  choice: tu livres
  rationale: Le présent décrit l’acte en cours. « Livrer » conserve l’étendue sémantique de παραδίδωμι sans réduire le verbe à la seule notion interprétative de trahison.
theological_decisions:
- issue: Traduction de τὸν υἱὸν τοῦ ἀνθρώπου
  choice: le Fils de l’homme
  alternative: l’Être humain
  rationale: « Le Fils de l’homme » préserve la désignation christologique consacrée ainsi que sa portée intertextuelle, sans la transformer en expression générique.
- issue: Portée de παραδίδως
  choice: tu livres
  alternative: tu trahis
  rationale: Dans ce contexte, l’acte constitue bien une trahison, mais « tu livres » maintient le sens premier du verbe grec et la tension entre remise aux autorités et trahison personnelle.
translation_notes:
  register: Français international moderne, digne et direct. La tournure disloquée « c’est par un baiser que » met naturellement en relief le moyen scandaleux de la remise, conformément à l’ordre et à la force rhétorique du grec.
