  variant: modern international French
source:
  edition: SBLGNT
  text: λέγω γὰρ ὑμῖν, ⸀οὐ μὴ πίω ἀπὸ τοῦ ⸂νῦν ἀπὸ τοῦ⸃ γενήματος τῆς ἀμπέλου ἕως ⸀οὗ ἡ βασιλεία τοῦ θεοῦ ἔλθῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/018.yaml
  text: For I tell you[a], from now on I will certainly not drink from the fruit of the vine until the kingdom of God comes.
translation:
  language: fr
  text: 'Car je vous le dis : à partir de maintenant, je ne boirai certainement plus du fruit de la vigne[a] jusqu’à ce que le royaume de Dieu vienne.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « du vin ». Le grec dit littéralement « du fruit de la vigne », expression plus large qui désigne vraisemblablement le contenu de la coupe sans employer le mot ordinaire pour « vin ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω γὰρ ὑμῖν
  choice: Car je vous le dis
  rationale: La formule rend naturellement λέγω avec le datif ὑμῖν, tandis que « car » conserve le lien explicatif marqué par γάρ.
- source_word: οὐ μὴ πίω
  choice: je ne boirai certainement plus
  rationale: οὐ μή suivi de l’aoriste subjonctif exprime ici une forte négation tournée vers l’avenir. « certainement » en préserve l’insistance, et « plus », avec « à partir de maintenant », marque la cessation sans suggérer une négation éternelle.
- source_word: ἀπὸ τοῦ νῦν
  choice: à partir de maintenant
  rationale: Cette expression situe explicitement le point de départ au moment présent; la formulation française est claire et naturelle.
- source_word: ἀπὸ τοῦ γενήματος τῆς ἀμπέλου
  choice: du fruit de la vigne
  rationale: γένημα désigne ce que produit la vigne. Cette traduction conserve l’expression plus large et solennelle du grec sans la réduire explicitement au « vin ».
- source_word: ἕως οὗ
  choice: jusqu’à ce que
  rationale: Cette locution introduit la limite temporelle de la négation et appelle naturellement le subjonctif en français.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: le royaume de Dieu
  rationale: « Royaume de Dieu » est une expression française établie qui préserve à la fois les dimensions royale et eschatologique de βασιλεία.
- source_word: ἔλθῃ
  choice: vienne
  rationale: L’aoriste subjonctif après ἕως οὗ est correctement rendu par le subjonctif présent français après « jusqu’à ce que », sans préciser le mode ni l’étape de cette venue.
theological_decisions:
- issue: Rendre γενήματος τῆς ἀμπέλου par « vin » ou par l’expression plus proche du grec
  choice: fruit de la vigne
  alternative: vin
  rationale: Le grec emploie une expression plus large que le terme ordinaire désignant le vin. La conserver évite de préciser davantage que le texte et maintient sa résonance liée au repas.
- issue: Portée eschatologique de la venue du royaume
  choice: jusqu’à ce que le royaume de Dieu vienne
  alternative: jusqu’à ce que le royaume de Dieu soit pleinement venu
  rationale: Le texte fixe une limite future sans définir la modalité ni le degré d’accomplissement de la venue du royaume. La traduction laisse cette tension intacte.
translation_notes:
  register: Français international moderne, digne et accessible. La ponctuation met en relief la déclaration solennelle, tandis que « certainement » conserve l’intensité de la négation grecque sans recourir à une tournure archaïque.
