id: LUK.17.5
reference: Luke 17:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ εἶπαν οἱ ἀπόστολοι τῷ κυρίῳ· Πρόσθες ἡμῖν πίστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/005.yaml
  text: And the apostles said to the Lord[b][a], “Increase our faith.”
translation:
  language: fr
  text: 'Les apôtres dirent au Seigneur : « Augmente notre foi[a][b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Ajoute-nous de la foi. » Ici, le verbe grec traduit par « augmente » signifie proprement « ajouter ».'
    reason: lexical_alternative
  - marker: b
    text: Le mot traduit par « foi » peut aussi évoquer la « confiance »; dans certains contextes, il peut signifier « fidélité », mais ce sens est moins probable ici.
    reason: alternative_reading
lexical_decisions:
- source_word: Καὶ
  choice: Les apôtres dirent
  rationale: La coordination grecque relie simplement cette parole au récit précédent. En français moderne, commencer directement par le sujet évite un « Et » lourd sans ajouter une nuance temporelle absente du texte.
- source_word: εἶπαν
  choice: dirent
  rationale: L’aoriste indicatif exprime ici une action narrative ponctuelle, naturellement rendue par le passé simple dans ce registre.
- source_word: οἱ ἀπόστολοι
  choice: les apôtres
  rationale: « Apôtres » est le terme français établi pour les envoyés mandatés de Jésus dans Luc–Actes.
- source_word: τῷ κυρίῳ
  choice: au Seigneur
  rationale: « Seigneur » conserve à la fois la valeur de titre respectueux et la portée christologique possible de κύριος dans le récit de Luc.
- source_word: Πρόσθες
  choice: Augmente
  rationale: Le verbe signifie littéralement « ajouter », mais avec πίστιν la demande porte idiomatiquement sur un accroissement de la foi.
- source_word: ἡμῖν
  choice: notre
  rationale: Le datif grec « à nous » se rend naturellement en français par le possessif avec le verbe « augmenter ».
- source_word: πίστιν
  choice: foi
  rationale: « Foi » est le rendu français naturel dans ce contexte; la notion de confiance demeure présente dans le champ sémantique du terme.
theological_decisions:
- issue: Sens du titre κύριος appliqué à Jésus
  choice: Seigneur
  alternative: maître
  rationale: « Seigneur » ne réduit pas le titre à une simple relation d’autorité humaine et préserve sa résonance dans la christologie de Luc.
- issue: Sens de πίστις dans la demande des apôtres
  choice: foi
  alternative: confiance; fidélité
  rationale: La demande concerne le plus naturellement leur foi ou confiance. « Fidélité » appartient au champ sémantique de πίστις, mais convient moins bien à cette construction et à ce contexte.
translation_notes:
  register: Français international moderne, sobre et digne. Le passé simple convient au registre narratif biblique sans être archaïque. La formulation reste concise et naturelle, tout en signalant les nuances lexicales dans les notes.
