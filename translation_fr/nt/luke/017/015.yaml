  text: εἷς δὲ ἐξ αὐτῶν, ἰδὼν ὅτι ἰάθη, ὑπέστρεψεν μετὰ φωνῆς μεγάλης δοξάζων τὸν θεόν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/015.yaml
  text: But one of them[a], seeing that he had been healed, returned, glorifying God with a loud voice,
translation:
  language: fr
  text: Mais l’un d’eux, voyant qu’il était guéri, revint en glorifiant Dieu à haute voix.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἷς δὲ ἐξ αὐτῶν
  choice: Mais l’un d’eux
  rationale: La tournure partitive signifie clairement « l’un d’eux ». La conjonction δέ marque ici un léger contraste narratif avec les neuf autres, naturellement rendu par « Mais ».
- source_word: ἰδὼν ὅτι ἰάθη
  choice: voyant qu’il était guéri
  rationale: Le participe aoriste ἰδών est conservé par un participe français fluide. L’aoriste passif ἰάθη désigne la guérison constatée; « était guéri » exprime naturellement l’état résultant sans surdéterminer la chronologie.
- source_word: ὑπέστρεψεν
  choice: revint
  rationale: Dans ce récit, ὑποστρέφω signifie revenir ou retourner. « Revint » indique de façon concise le mouvement de retour vers Jésus.
- source_word: μετὰ φωνῆς μεγάλης
  choice: à haute voix
  rationale: L’expression grecque signifie que l’action vocale est accomplie avec force. « À haute voix » est l’équivalent idiomatique courant en français moderne.
- source_word: δοξάζων τὸν θεόν
  choice: en glorifiant Dieu
  rationale: δοξάζω signifie ici glorifier Dieu, lui rendre gloire. « Glorifier » préserve le vocabulaire de la gloire et la portée de l’expression grecque.
theological_decisions:
- issue: Sens de δοξάζων τὸν θεόν
  choice: en glorifiant Dieu
  alternative: en louant Dieu
  rationale: « Glorifier Dieu » rend directement δοξάζω et conserve son lien lexical avec la gloire. Dans ce contexte, l’action comprend la louange, mais le texte ne justifie ni développement doctrinal ni identification supplémentaire.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe participiale maintient le mouvement du grec sans produire une formulation lourde; « à haute voix » remplace le calque peu idiomatique « avec une grande voix ».
