id: LUK.17.11
reference: Luke 17:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ἐν τῷ ⸀πορεύεσθαι εἰς Ἰερουσαλὴμ καὶ αὐτὸς διήρχετο διὰ ⸀μέσον Σαμαρείας καὶ Γαλιλαίας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/011.yaml
  text: And it happened that[a], as he was going to Jerusalem, he was passing through the midst of Samaria and Galilee.
translation:
  language: fr
  text: Il arriva[a] que, tandis qu’il se rendait à Jérusalem, il passait entre la Samarie et la Galilée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « il traversait la région située entre la Samarie et la Galilée ». L’expression grecque peut désigner un déplacement entre les deux régions ou à travers la zone frontière qui les séparait.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγένετο
  choice: il arriva que
  rationale: Formule narrative fréquente chez Luc, rendue dans un français actuel et soutenu sans l’archaïsme de « il advint ».
- source_word: ἐν τῷ πορεύεσθαι
  choice: comme il se rendait
  rationale: L’infinitif articulé avec ἐν exprime ici la simultanéité et le déroulement du voyage.
- source_word: εἰς Ἰερουσαλήμ
  choice: à Jérusalem
  rationale: Exprime naturellement en français la destination du déplacement.
- source_word: αὐτός
  choice: il
  rationale: Le pronom grec explicite reprend Jésus; une traduction par « lui-même » produirait en français une insistance probablement excessive.
- source_word: διήρχετο
  choice: il passait
  rationale: L’imparfait grec présente le déplacement comme en cours; l’imparfait français en garde la valeur progressive.
- source_word: διὰ μέσον
  choice: entre
  rationale: Avec les deux régions au génitif, l’expression peut désigner un passage entre elles ou dans leur zone frontière; « entre » est idiomatique et évite d’affirmer qu’il traversait l’intérieur des deux régions.
- source_word: Σαμαρείας καὶ Γαλιλαίας
  choice: la Samarie et la Galilée
  rationale: Les noms géographiques usuels en français sont employés, dans l’ordre grec.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et accessible. La formule narrative lucanienne est conservée sans tournure archaïque. La note maintient l’ambiguïté géographique réelle de διὰ μέσον.
