  text: οὐχ εὑρέθησαν ὑποστρέψαντες δοῦναι δόξαν τῷ θεῷ εἰ μὴ ὁ ἀλλογενὴς οὗτος;
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/018.yaml
  text: Were none found to return and give glory to God except this foreigner?[a]
translation:
  language: fr
  text: Ne s’est-il trouvé personne pour revenir rendre gloire à Dieu, sauf cet étranger[a] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « cet homme d’un autre peuple » ou « cet homme venu d’ailleurs » ; le terme grec désigne un étranger, quelqu’un qui n’appartient pas au peuple d’Israël.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὑρέθησαν
  choice: s’est-il trouvé personne
  rationale: Le passif aoriste est rendu par une tournure existentielle française naturelle, tout en conservant la forme de question rhétorique.
- source_word: ὑποστρέψαντες
  choice: pour revenir
  rationale: Dans ce contexte, le participe désigne le retour qui accompagne et précède l’action de rendre gloire; l’infinitif français exprime naturellement ce lien.
- source_word: δοῦναι δόξαν
  choice: rendre gloire
  rationale: « Rendre gloire à Dieu » est une expression française courante et digne qui restitue fidèlement l’idiome grec.
- source_word: τῷ θεῷ
  choice: à Dieu
  rationale: Cette formulation est la construction idiomatique normale en français.
- source_word: εἰ μὴ
  choice: sauf
  rationale: Dans cette construction exclusive, « sauf » est concis, clair et naturel.
- source_word: ἀλλογενής
  choice: étranger
  rationale: Le terme désigne une personne appartenant à un autre peuple et souligne ici son statut extérieur à Israël.
- source_word: οὗτος
  choice: cet
  rationale: 'Le démonstratif conserve l’accent porté sur l’homme présent: « cet étranger ».'
theological_decisions:
- issue: Statut ethnique et religieux de l’homme guéri
  choice: cet étranger
  alternative: cet homme d’un autre peuple; cet homme venu d’ailleurs
  rationale: Le verset souligne que celui qui est revenu honorer Dieu était extérieur à Israël, un Samaritain d’après le contexte. « Étranger » préserve ce contraste sans ajouter de polémique.
translation_notes:
  register: Français international moderne, naturel et digne. La question rhétorique et l’expression biblique « rendre gloire à Dieu » sont conservées; la négation française est formulée de manière idiomatique.
