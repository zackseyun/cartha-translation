id: LUK.17.19
reference: Luke 17:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτῷ· Ἀναστὰς πορεύου· ἡ πίστις σου σέσωκέν σε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/019.yaml
  text: And he said to him[a], “Rise and go[b]; your faith has saved you.”
translation:
  language: fr
  text: 'Et il lui dit : « Lève-toi et va ; ta foi[b] t’a sauvé[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « t’a guéri » ou « t’a rendu la santé ». Le verbe grec peut désigner le salut, la délivrance ou la guérison.
    reason: lexical_alternative
  - marker: b
    text: Ou « confiance ». Le mot grec traduit par « foi » peut aussi désigner la confiance ou la fidélité, bien que « foi » convienne le mieux ici.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν αὐτῷ
  choice: il lui dit
  rationale: Formulation narrative française naturelle et fidèle au verbe λέγω ainsi qu’au pronom datif renvoyant à l’homme guéri.
- source_word: Ἀναστὰς
  choice: Lève-toi
  rationale: Le participe aoriste est employé avec une valeur impérative liée à l’ordre qui suit. « Lève-toi » garde la concision et la dignité de l’expression grecque.
- source_word: πορεύου
  choice: va
  rationale: L’impératif de πορεύομαι appelle ici un ordre simple. « Va » est clair et idiomatique, sans ajouter l’idée de chemin absente du texte.
- source_word: πίστις
  choice: foi
  rationale: « Foi » est l’équivalent français usuel et conserve la portée religieuse du terme. « Confiance » reste possible dans ce contexte et est signalé en note.
- source_word: σέσωκέν
  choice: a sauvé
  rationale: Le parfait de σῴζω peut évoquer le salut, la délivrance ou la guérison, avec un résultat qui demeure. « A sauvé » préserve ici la portée la plus large, puisque les dix hommes avaient déjà été purifiés physiquement.
- source_word: σε
  choice: t’
  rationale: Le pronom objet de deuxième personne se rend naturellement par « te », élidé devant « a ».
theological_decisions:
- issue: Portée de σέσωκέν σε dans un récit de guérison
  choice: t’a sauvé
  alternative: t’a guéri / t’a rendu la santé
  rationale: Le verbe grec permet aussi une lecture liée à la guérison. Toutefois, le contraste narratif entre les dix hommes purifiés et celui qui revient rendre gloire à Dieu justifie de conserver « sauvé », sans exclure la dimension physique ni réduire l’énoncé à celle-ci.
- issue: Sens de πίστις
  choice: foi
  alternative: confiance / fidélité
  rationale: Dans ce contexte, le mot désigne très probablement la confiance manifestée envers Jésus. « Foi » garde néanmoins l’étendue habituelle du terme grec, tandis que les autres possibilités sont indiquées sans imposer une interprétation plus étroite.
translation_notes:
  register: Français international moderne, simple et digne. La ponctuation rend les deux impératifs de façon fluide. Les appels de note sont placés directement après les termes auxquels ils se rapportent.
