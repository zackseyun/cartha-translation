  text: ὁμοίως ⸀καθὼς ἐγένετο ἐν ταῖς ἡμέραις Λώτ· ἤσθιον, ἔπινον, ἠγόραζον, ἐπώλουν, ἐφύτευον, ᾠκοδόμουν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/028.yaml
  text: 'Likewise[a], just as it happened in the days of Lot: they were eating, drinking, buying, selling, planting, and building.'
translation:
  language: fr
  text: De même, comme cela s’est passé aux jours de Loth, les gens mangeaient, buvaient, achetaient, vendaient, plantaient et construisaient.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁμοίως
  choice: De même
  rationale: Cet adverbe relie l’exemple de Loth à la comparaison précédente. « De même » est naturel et conserve clairement la valeur comparative.
- source_word: καθὼς
  choice: comme
  rationale: Introduit la comparaison de manière. En français, « comme » exprime ici naturellement le rapport rendu en anglais par « just as », sans lourdeur.
- source_word: ἐγένετο
  choice: cela s’est passé
  rationale: Le verbe γίνομαι a ici un sens événementiel. « Cela s’est passé » est idiomatique, moderne et évite l’archaïsme de « il advint ».
- source_word: ἐν ταῖς ἡμέραις Λώτ
  choice: à l’époque de Loth
  rationale: L’expression désigne la période associée à Loth. « À l’époque de Loth » transmet clairement cet idiome temporel en français moderne.
- source_word: ἤσθιον, ἔπινον, ἠγόραζον, ἐπώλουν, ἐφύτευον, ᾠκοδόμουν
  choice: les gens mangeaient, buvaient, achetaient, vendaient, plantaient et construisaient
  rationale: La série à l’imparfait décrit des activités habituelles et continues de la vie ordinaire. L’imparfait français reproduit naturellement cet aspect, tandis que « les gens » explicite sobrement le sujet pluriel implicite.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. L’imparfait maintient l’arrière-plan duratif de la série verbale grecque; la liste reste simple afin de préserver l’accent sur les activités ordinaires.
