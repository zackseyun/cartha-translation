id: LUK.17.35
reference: Luke 17:35
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸂ἔσονται δύο⸃ ἀλήθουσαι ἐπὶ τὸ αὐτό, ⸀ἡ μία παραλημφθήσεται ⸂ἡ δὲ⸃ ἑτέρα ⸀ἀφεθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/035.yaml
  text: There will be two women grinding together[a]; one will be taken[b], but the other will be left.
translation:
  language: fr
  text: 'Deux femmes moudront ensemble[a] : l’une sera prise[b], mais l’autre sera laissée.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « au même endroit ». L’expression grecque peut signifier « ensemble » ou « au même endroit ».
    reason: lexical_alternative
  - marker: b
    text: L’expression « sera prise » ne précise pas à elle seule si cette personne est prise pour être sauvée ou pour subir le jugement ; le grec laisse le contexte plus large éclairer ce point.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔσονται δύο ἀλήθουσαι
  choice: Deux femmes moudront
  rationale: Le participe féminin pluriel indique qu’il s’agit de femmes. Le futur français « moudront » exprime naturellement la scène future sans devoir reproduire séparément l’auxiliaire grec.
- source_word: ἐπὶ τὸ αὐτό
  choice: ensemble
  rationale: Cette expression peut indiquer l’action commune ou le même lieu. « Ensemble » est naturel ici tout en laissant l’alternative en note.
- source_word: ἡ μία
  choice: l’une
  rationale: Dans une opposition entre deux femmes, « l’une » est la formulation française idiomatique.
- source_word: παραλημφθήσεται
  choice: sera prise
  rationale: Le futur passif est rendu directement, sans préciser si le fait d’être prise conduit au salut ou au jugement.
- source_word: ἡ δὲ ἑτέρα
  choice: mais l’autre
  rationale: « Mais » rend clairement la valeur contrastive de δέ, et « l’autre » désigne la seconde des deux femmes.
- source_word: ἀφεθήσεται
  choice: sera laissée
  rationale: Cette traduction directe du futur passif évite d’ajouter les nuances plus fortes de « abandonnée » ou l’explicitation « laissée sur place ».
theological_decisions:
- issue: La portée théologique de l’opposition entre être prise et être laissée
  choice: Conserver « l’une sera prise, mais l’autre sera laissée » sans préciser le sort associé à chaque action.
  alternative: Expliciter que l’une est prise pour être sauvée ou pour subir le jugement, et que l’autre connaît le sort inverse.
  rationale: Le verset décrit la séparation sans préciser à lui seul si le fait d’être prise ou laissée correspond au salut ou au jugement. La traduction préserve donc cette tension interprétative.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation reste concise, reproduit le contraste des deux futurs passifs et évite de trancher une ambiguïté théologique réelle.
