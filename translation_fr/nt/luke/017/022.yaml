id: LUK.17.22
reference: Luke 17:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Εἶπεν δὲ πρὸς τοὺς μαθητάς· Ἐλεύσονται ἡμέραι ὅτε ἐπιθυμήσετε μίαν τῶν ἡμερῶν τοῦ υἱοῦ τοῦ ἀνθρώπου ἰδεῖν καὶ οὐκ ὄψεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/022.yaml
  text: Then he said to the disciples[a], “Days are coming when you will long to see one of the days of the Son of Man[b], and you will not see it.”
translation:
  language: fr
  text: 'Puis il dit aux disciples : « Des jours viendront où vous désirerez ardemment voir l’un des jours du Fils de l’homme[a], et vous ne le verrez pas. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « les jours du Fils de l’homme » peut désigner le temps de sa présence et de son œuvre, ou plus précisément celui de sa révélation future ; la formulation grecque laisse ouverte la portée exacte de l’expression.
    reason: alternative_reading
lexical_decisions:
- source_word: Εἶπεν δὲ
  choice: Puis il dit
  rationale: δέ est ici un léger connecteur narratif. « Puis » fait avancer naturellement le récit sans introduire une opposition marquée.
- source_word: πρὸς τοὺς μαθητάς
  choice: aux disciples
  rationale: Le grec emploie l’article sans possessif explicite ; « aux disciples » en respecte précisément la formulation.
- source_word: Ἐλεύσονται ἡμέραι
  choice: Des jours viendront
  rationale: Cette tournure française naturelle conserve l’expression prophétique d’un temps futur sans ajouter d’article absent du grec.
- source_word: ἐπιθυμήσετε
  choice: vous désirerez ardemment
  rationale: Le verbe exprime un désir intense ; l’adverbe rend cette force en français moderne sans registre excessivement littéraire.
- source_word: μίαν τῶν ἡμερῶν
  choice: un seul des jours
  rationale: « Un seul » fait entendre la valeur de μίαν et « des jours » conserve le génitif partitif.
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: du Fils de l’homme
  rationale: Traduction traditionnelle et littérale du titre, qui en préserve les résonances bibliques et théologiques.
- source_word: ἰδεῖν
  choice: voir
  rationale: Équivalent simple et direct de l’infinitif grec, complément du verbe de désir.
- source_word: καὶ οὐκ ὄψεσθε
  choice: mais vous ne le verrez pas
  rationale: Dans ce contexte, καί relie une issue contraire au désir exprimé. « Mais » rend naturellement cette opposition implicite ; « le » reprend en français le jour que les disciples souhaitent voir.
theological_decisions:
- issue: Sens de « l’un des jours du Fils de l’homme »
  choice: Conserver une référence ouverte et chargée d’attente au temps du Fils de l’homme
  alternative: Limiter l’expression soit aux jours de la présence terrestre de Jésus, soit uniquement à sa révélation future
  rationale: La formulation grecque ne tranche pas explicitement entre le regret de la présence de Jésus et l’attente eschatologique de la manifestation du Fils de l’homme. Le texte et la note préservent cette tension.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la solennité prophétique du grec tout en restant naturelle à l’oral. Le titre « Fils de l’homme » est maintenu sous sa forme biblique usuelle.
