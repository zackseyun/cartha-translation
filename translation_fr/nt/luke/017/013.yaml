id: LUK.17.13
reference: Luke 17:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ αὐτοὶ ἦραν φωνὴν λέγοντες· Ἰησοῦ ἐπιστάτα, ἐλέησον ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/013.yaml
  text: And they raised their voices[a], saying, “Jesus, Master[b], have mercy on us!”
translation:
  language: fr
  text: 'Et ils élevèrent la voix[a] en disant : « Jésus, Maître[b], aie pitié de nous ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « levèrent la voix ».'
    reason: lexical_alternative
  - marker: b
    text: Le mot grec traduit par « Maître » est un titre donné à une personne investie d’autorité ; ce n’est pas le mot habituellement traduit par « Seigneur ».
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Et
  rationale: Cette conjonction simple respecte l’enchaînement narratif sans lui ajouter une valeur temporelle absente du grec.
- source_word: αὐτοὶ
  choice: ils
  rationale: Le pronom grec est explicite et légèrement emphatique, mais le français naturel n’exige pas ici « eux-mêmes ».
- source_word: ἦραν φωνὴν
  choice: élevèrent la voix
  rationale: Cette expression française naturelle conserve l’image grecque et indique qu’ils parlent assez fort pour être entendus à distance.
- source_word: λέγοντες
  choice: en disant
  rationale: Le gérondif reproduit clairement le rapport entre le participe grec et l’action principale.
- source_word: Ἰησοῦ
  choice: Jésus
  rationale: Il s’agit du vocatif du nom personnel Ἰησοῦς, rendu selon sa forme française usuelle.
- source_word: ἐπιστάτα
  choice: Maître
  rationale: Ce titre d’adresse présente Jésus comme une personne investie d’autorité. « Maître » convient au contexte sans le confondre avec κύριος, « Seigneur ».
- source_word: ἐλέησον
  choice: aie pitié
  rationale: L’impératif exprime une demande pressante de compassion et d’intervention. « Aie pitié de nous » est naturel, digne et fidèle à la force de la supplication.
- source_word: ἡμᾶς
  choice: de nous
  rationale: La préposition est imposée en français par la locution « avoir pitié de » et rend correctement l’objet du verbe grec.
theological_decisions:
- issue: Le titre ἐπιστάτα adressé à Jésus
  choice: Maître
  alternative: Seigneur
  rationale: Le texte emploie ἐπιστάτης et non κύριος. « Maître » préserve l’idée d’autorité sans effacer cette distinction lexicale ni introduire à cet endroit les connotations propres au titre « Seigneur ».
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la coordination et le participe du grec tout en restant idiomatique. Le tutoiement dans « aie pitié » correspond à l’adresse directe au singulier et ne marque aucun manque de respect.
