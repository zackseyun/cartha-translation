source:
  edition: SBLGNT
  text: ἤσθιον, ἔπινον, ἐγάμουν, ⸀ἐγαμίζοντο, ἄχρι ἧς ἡμέρας εἰσῆλθεν Νῶε εἰς τὴν κιβωτόν, καὶ ἦλθεν ὁ κατακλυσμὸς καὶ ἀπώλεσεν ⸀πάντας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/027.yaml
  text: They were eating[a], they were drinking, they were marrying, they were being given in marriage, until the day Noah entered into the ark, and the flood came and destroyed them all.
translation:
  language: fr
  text: Ils mangeaient, ils buvaient, ils se mariaient, on les donnait en mariage[a], jusqu’au jour où Noé entra dans l’arche ; le déluge vint et les fit tous périr.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec distingue deux verbes : « se marier » et « être donné en mariage ». L’expression impersonnelle « on les donnait en mariage » rend le second, qui est au passif.'
    reason: lexical_clarification
lexical_decisions:
- source_word: ἤσθιον, ἔπινον
  choice: Ils mangeaient, ils buvaient
  rationale: Les imparfaits grecs décrivent des activités habituelles ou continues; l’imparfait français en restitue naturellement l’aspect.
- source_word: ἐγάμουν
  choice: ils se mariaient
  rationale: Cette tournure rend l’action de contracter mariage sans préciser davantage le genre des personnes concernées.
- source_word: ἐγαμίζοντο
  choice: étaient donnés en mariage
  rationale: Le passif français maintient la distinction avec le verbe actif précédent, même si l’expression est moins courante aujourd’hui.
- source_word: ἄχρι ἧς ἡμέρας
  choice: jusqu’au jour où
  rationale: Expression temporelle française naturelle qui marque la limite des activités en cours.
- source_word: εἰσῆλθεν Νῶε εἰς τὴν κιβωτόν
  choice: Noé entra dans l’arche
  rationale: Le passé simple convient au récit et présente l’entrée comme un événement ponctuel; « arche » est le terme consacré dans le contexte de Noé.
- source_word: ὁ κατακλυσμός
  choice: le déluge
  rationale: « Déluge » est en français le terme courant et traditionnel pour l’inondation du récit de Noé.
- source_word: ἀπώλεσεν πάντας
  choice: les fit tous périr
  rationale: Cette formulation exprime clairement la mort de toutes les personnes visées, sans la nuance potentiellement matérielle de « détruire » appliqué à des humains.
theological_decisions:
- issue: Distinction entre les deux verbes relatifs au mariage
  choice: ils se mariaient et étaient donnés en mariage
  alternative: ils se mariaient
  rationale: Le grec emploie deux verbes distincts, l’un actif et l’autre passif. Les conserver évite d’aplanir le texte et maintient le tableau complet de la vie sociale ordinaire.
- issue: Aspect de la série verbale initiale
  choice: imparfait français (« mangeaient », « buvaient », « se mariaient », « étaient donnés »)
  alternative: passé simple ou passé composé
  rationale: Les imparfaits grecs présentent des activités continues ou habituelles qui se poursuivent jusqu’à l’arrivée soudaine du jugement.
translation_notes:
  register: Français moderne, sobre et narratif. L’imparfait installe la continuité de la vie quotidienne, tandis que le passé simple marque les événements soudains. La formule « étaient donnés en mariage », volontairement plus formelle, préserve la distinction présente dans le grec; la note propose une formulation plus compacte.
