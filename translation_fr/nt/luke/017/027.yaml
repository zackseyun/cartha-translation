  source_fidelity: Le projet rend correctement les quatre imparfaits initiaux par l’imparfait français, puis les aoristes narratifs par le passé simple. Il conserve aussi, à juste titre, la distinction entre γαμέω (« se marier ») et le passif de γαμίζω (« être donné en mariage »). La coordination grecque doit toutefois être maintenue sans introduire « Alors » ni scinder la phrase.
