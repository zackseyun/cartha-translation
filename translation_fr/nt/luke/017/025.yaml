source:
  edition: SBLGNT
  text: πρῶτον δὲ δεῖ αὐτὸν πολλὰ παθεῖν καὶ ἀποδοκιμασθῆναι ἀπὸ τῆς γενεᾶς ταύτης.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/025.yaml
  text: But first he must suffer many things and be rejected by this generation.
translation:
  language: fr
  text: Mais il faut d’abord qu’il souffre beaucoup et qu’il soit rejeté par cette génération.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πρῶτον
  choice: d’abord
  rationale: L’adverbe marque une priorité temporelle. « D’abord » exprime naturellement en français ce qui doit précéder les événements évoqués dans le contexte.
- source_word: δὲ
  choice: Mais
  rationale: La particule introduit ici un contraste modéré avec ce qui précède; « Mais » en conserve clairement la nuance adversative.
- source_word: δεῖ
  choice: il faut
  rationale: Cette tournure exprime avec force la nécessité, tout en restant naturelle en français et sans expliciter davantage l’origine de cette nécessité.
- source_word: αὐτὸν
  choice: qu’il
  rationale: L’accusatif grec est le sujet des infinitifs dépendant de δεῖ. La construction française idiomatique est « il faut qu’il… ».
- source_word: πολλὰ παθεῖν
  choice: souffre beaucoup
  rationale: Le neutre pluriel πολλὰ précise l’étendue des souffrances. « Souffrir beaucoup » est plus naturel en français que « souffrir beaucoup de choses », tout en préservant la gravité et l’ampleur de l’expression grecque.
- source_word: ἀποδοκιμασθῆναι
  choice: soit rejeté
  rationale: Le verbe désigne le fait d’être repoussé ou déclaré inacceptable. « Être rejeté » est direct, courant et fidèle dans ce contexte.
- source_word: ἀπὸ τῆς γενεᾶς ταύτης
  choice: par cette génération
  rationale: Avec le passif, ἀπό indique ici l’agent ou la source du rejet. « Par cette génération » est idiomatique et conserve la référence aux contemporains de Jésus.
theological_decisions:
- issue: Portée de δεῖ concernant les souffrances du Fils de l’homme
  choice: « il faut »
  alternative: « il est nécessaire » ou explicitation comme accomplissement du dessein de Dieu
  rationale: Dans Luc, δεῖ évoque souvent une nécessité liée au dessein divin. « Il faut » en préserve le poids théologique sans ajouter une explication absente du verset.
translation_notes:
  register: Français moderne, digne et accessible. La structure « il faut d’abord qu’il… » maintient la priorité temporelle et la nécessité. « Souffre beaucoup » privilégie l’idiome français sans réduire la portée du grec πολλὰ.
