id: LUK.17.20
reference: Luke 17:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἐπερωτηθεὶς δὲ ὑπὸ τῶν Φαρισαίων πότε ἔρχεται ἡ βασιλεία τοῦ θεοῦ ἀπεκρίθη αὐτοῖς καὶ εἶπεν· Οὐκ ἔρχεται ἡ βασιλεία τοῦ θεοῦ μετὰ παρατηρήσεως,
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/020.yaml
  text: When he was asked by the Pharisees when the kingdom of God was coming[a], he answered them and said, “The kingdom of God does not come with observable signs,”
translation:
  language: fr
  text: 'Interrogé par les pharisiens sur quand viendrait le royaume de Dieu, il leur répondit : « Le royaume de Dieu ne vient pas de manière à se laisser observer[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avec observation », « d’une manière observable » ou « avec une attention soutenue ».
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐπερωτηθεὶς δὲ ὑπὸ τῶν Φαρισαίων
  choice: Interrogé par les pharisiens
  rationale: Le participe aoriste passif exprime la circonstance qui précède la réponse. « Interrogé par » conserve la voix passive et rend naturellement la transition légère portée par δέ, sans ajouter un marqueur temporel appuyé.
- source_word: πότε ἔρχεται
  choice: sur le moment où viendrait
  rationale: Dans cette interrogation indirecte au cadre narratif passé, le conditionnel français exprime naturellement une venue encore future du point de vue des interlocuteurs.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: le royaume de Dieu
  rationale: Expression française traditionnelle, transparente et largement reconnue. « Royaume » laisse ouverte la portée de βασιλεία, qui peut évoquer aussi bien la souveraineté exercée que son domaine.
- source_word: ἀπεκρίθη αὐτοῖς καὶ εἶπεν
  choice: il leur répondit
  rationale: En français, « il leur répondit et dit » serait inutilement redondant. Le verbe « répondit » transmet naturellement l’ensemble de la formule narrative grecque.
- source_word: Οὐκ ἔρχεται
  choice: ne vient pas
  rationale: Le présent énonce ici une affirmation générale concernant la manière dont vient le royaume.
- source_word: μετὰ παρατηρήσεως
  choice: de manière à se laisser observer
  rationale: Cette formulation conserve l’idée d’observation ou de surveillance attentive sans introduire explicitement le mot « signes », absent du grec, ni trancher entre simple visibilité et repérage par examen.
theological_decisions:
- issue: Portée de la négation concernant la venue du royaume de Dieu
  choice: La phrase nie que sa venue soit d’une nature qui se prête à l’observation ou au repérage.
  alternative: La phrase nierait soit toute possibilité de percevoir le royaume, soit l’existence de tout signe eschatologique.
  rationale: Le rendu reste centré sur μετὰ παρατηρήσεως et ne transforme pas cette affirmation en doctrine générale sur toute perception du royaume ou sur tous les signes de la fin.
translation_notes:
  register: Français international actuel, sobre et digne. La syntaxe participiale conserve la structure du récit sans lourdeur. Le marqueur de note est placé après le membre de phrase qu’il éclaire.
