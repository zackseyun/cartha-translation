id: LUK.17.26
reference: Luke 17:26
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ καθὼς ἐγένετο ἐν ταῖς ἡμέραις Νῶε, οὕτως ἔσται καὶ ἐν ταῖς ἡμέραις τοῦ υἱοῦ τοῦ ἀνθρώπου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/026.yaml
  text: And just as it happened in the days of Noah[a], so it will be also in the days of the Son of Man.
translation:
  language: fr
  text: Et tout comme cela s’est passé aux jours de Noé, ainsi en sera-t-il aussi aux jours du Fils de l’homme[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de l’Humain ». Le titre grec traditionnellement rendu par « le Fils de l’homme » fait probablement écho à Daniel 7; il est conservé ici en raison de ses résonances messianiques et apocalyptiques bien établies.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς
  choice: tout comme
  rationale: Introduit une comparaison appuyée; « tout comme » exprime naturellement en français la correspondance marquée par καθὼς.
- source_word: ἐγένετο
  choice: cela s’est passé
  rationale: Rend le sens événementiel de γίνομαι dans un français moderne, sans recourir à la tournure vieillie « il advint ».
- source_word: ἐν ταῖς ἡμέραις Νῶε
  choice: aux jours de Noé
  rationale: Conserve l’idiome temporel et le parallélisme avec « aux jours du Fils de l’homme ».
- source_word: οὕτως
  choice: ainsi
  rationale: Marque clairement le second terme de la comparaison tout en restant proche de la structure grecque.
- source_word: ἔσται
  choice: en sera-t-il
  rationale: La tournure « ainsi en sera-t-il » rend le futur de εἰμί sans préciser indûment quels événements se produiront.
- source_word: καὶ
  choice: aussi
  rationale: Le second καί étend explicitement la comparaison au temps du Fils de l’homme; « aussi » en conserve la force.
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: du Fils de l’homme
  rationale: Conserve le titre évangélique traditionnel ainsi que ses résonances messianiques et apocalyptiques probables, notamment avec Daniel 7.
theological_decisions:
- issue: Traduction du titre τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: le Fils de l’homme
  alternative: l’Humain
  rationale: « Le Fils de l’homme » préserve la forme du titre, son emploi établi dans les Évangiles et son probable écho à Daniel 7, sans réduire l’expression à une simple désignation générique.
translation_notes:
  register: Français international moderne, digne et accessible. La structure comparative et le parallélisme « aux jours de… aux jours de… » sont maintenus. Le marqueur de note est placé après « Fils de l’homme », expression à laquelle la note se rapporte.
