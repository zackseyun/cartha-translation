id: LUK.17.29
reference: Luke 17:29
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ᾗ δὲ ἡμέρᾳ ἐξῆλθεν Λὼτ ἀπὸ Σοδόμων, ἔβρεξεν πῦρ καὶ θεῖον ἀπ’ οὐρανοῦ καὶ ἀπώλεσεν ⸀πάντας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/029.yaml
  text: but on the day Lot went out from Sodom[a], fire and sulfur rained from heaven and destroyed them all.
translation:
  language: fr
  text: Mais, le jour où Lot sortit de Sodome, il plut du feu et du soufre du ciel, et tous furent détruits.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ᾗ δὲ ἡμέρᾳ
  choice: mais, le jour où
  rationale: La tournure temporelle signifie « le jour où ». « Mais » rend le léger contraste introduit par δέ avec la situation décrite au verset précédent.
- source_word: ἐξῆλθεν
  choice: sortit
  rationale: Le verbe exprime concrètement la sortie de Lot hors de la ville; « sortit de Sodome » est direct et naturel en français.
- source_word: Λὼτ
  choice: Lot
  rationale: Forme française traditionnelle et courante du nom propre.
- source_word: ἀπὸ Σοδόμων
  choice: de Sodome
  rationale: Cette forme idiomatique rend le point de départ indiqué par ἀπό et emploie le nom français usuel de la ville.
- source_word: ἔβρεξεν πῦρ καὶ θεῖον
  choice: une pluie de feu et de soufre tomba
  rationale: Le grec emploie βρέχω dans une construction impersonnelle. Cette formulation française conserve explicitement l’image de la pluie sans introduire comme sujet Dieu, qui n’est pas nommé dans ce verset.
- source_word: ἀπ’ οὐρανοῦ
  choice: du ciel
  rationale: « Du ciel » conserve l’idiome biblique et le lien avec Genèse 19.24, sans expliciter davantage la provenance divine.
- source_word: ἀπώλεσεν πάντας
  choice: les détruisit tous
  rationale: ἀπόλλυμι signifie ici « détruire ». Le pronom « les » reprend naturellement les habitants concernés, tandis que « tous » rend πάντας.
theological_decisions:
- issue: Sens de θεῖον dans le récit du jugement
  choice: soufre
  alternative: soufre ardent
  rationale: « Soufre » donne le sens lexical courant sans ajouter un qualificatif absent du grec; l’association avec le feu exprime déjà le caractère brûlant du jugement.
- issue: Sujet non exprimé de ἔβρεξεν et ἀπώλεσεν
  choice: une pluie de feu et de soufre tomba du ciel et les détruisit tous
  alternative: '[Dieu] fit pleuvoir du feu et du soufre du ciel et les détruisit tous'
  rationale: Le grec ne nomme pas explicitement Dieu comme sujet dans ce verset. La formulation retenue préserve cette absence tout en produisant une phrase française naturelle et en maintenant l’allusion au jugement divin de Genèse 19.
- issue: Rendu de οὐρανός
  choice: ciel
  alternative: firmament
  rationale: « Ciel » est à la fois moderne, naturel et fidèle à l’idiome scripturaire; « firmament » serait plus marqué et moins précis ici.
translation_notes:
  register: Français international moderne, clair et digne. La formulation « une pluie de feu et de soufre » évite l’étrangeté de « il plut du feu » dans le corps du texte tout en conservant l’image originale, donnée littéralement en note.
