  text: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν· ⸀Οὐχὶ οἱ δέκα ἐκαθαρίσθησαν; οἱ δὲ ἐννέα ποῦ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/017.yaml
  text: Then Jesus answered[a], “Were not the ten cleansed? But where are the nine?”
translation:
  language: fr
  text: 'Jésus répondit alors : « Les dix n’ont-ils pas été purifiés[a] ? Mais les neuf autres, où sont-ils ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : rendus purs.'
    reason: Alternative lexicale qui exprime plus littéralement la valeur factitive et passive de καθαρίζω.
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν
  choice: Jésus répondit alors
  rationale: La formule participiale suivie de « dit » introduit ici la prise de parole de Jésus. « Répondit alors » en restitue naturellement le sens et la progression narrative sans reproduire lourdement la construction grecque.
- source_word: Οὐχὶ
  choice: n’ont-ils pas
  rationale: οὐχί introduit une question rhétorique qui attend une réponse affirmative. La tournure française négative conserve cette attente.
- source_word: οἱ δέκα
  choice: les dix
  rationale: L’article et le nombre désignent le groupe déjà connu dans le récit. Il n’est pas nécessaire d’ajouter « tous », absent du grec.
- source_word: ἐκαθαρίσθησαν
  choice: ont été purifiés
  rationale: Le passif de καθαρίζω signifie « rendre pur, purifier ». Dans le contexte de la lèpre, il évoque à la fois la disparition de l’affection et le rétablissement de la pureté, nuance que le simple verbe « guérir » réduirait.
- source_word: οἱ δὲ ἐννέα ποῦ
  choice: Mais les neuf autres, où sont-ils ?
  rationale: δέ marque ici le contraste entre celui qui est revenu et les neuf restants. « Les neuf autres » est idiomatique en français et explicite seulement la relation numérique déjà évidente dans le contexte.
theological_decisions:
- issue: Sens de καθαρίζω dans le récit de la guérison des lépreux
  choice: purifiés
  alternative: guéris ; rendus purs
  rationale: « Purifiés » préserve les dimensions physique et cultuelle du terme grec sans limiter le propos à une guérison médicale ni lui ajouter une interprétation doctrinale.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation garde la force rhétorique des deux questions et le contraste exprimé par δέ.
