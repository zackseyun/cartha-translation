  text: λέγω ὑμῖν, ταύτῃ τῇ νυκτὶ ἔσονται δύο ἐπὶ κλίνης μιᾶς, ⸀ὁ εἷς παραλημφθήσεται καὶ ὁ ἕτερος ἀφεθήσεται·
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/034.yaml
  text: I tell you[a], on that night there will be two on one bed; one will be taken[b], and the other will be left.
translation:
  language: fr
  text: 'Je vous le dis : cette nuit-là, deux personnes seront dans le même lit ; l’une sera emmenée[a] et l’autre sera laissée[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sera prise avec soi » ; le verbe grec ne précise pas ici si la personne est emmenée pour être délivrée ou pour être jugée.
    reason: lexical_alternative
  - marker: b
    text: Ou « laissée sur place » ; la formulation plus brève « laissée » évite d’introduire des associations eschatologiques ultérieures qui ne sont pas explicites dans le grec.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω ὑμῖν
  choice: Je vous le dis
  rationale: Formule directe et emphatique, rendue dans un français actuel et naturel.
- source_word: ταύτῃ τῇ νυκτί
  choice: cette nuit-là
  rationale: L’expression temporelle au datif désigne la nuit précise dont Jésus parle ; « cette nuit-là » est idiomatique et conserve la valeur démonstrative.
- source_word: ἔσονται δύο
  choice: deux personnes seront
  rationale: « Deux personnes » explicite naturellement en français que le numeral désigne deux êtres humains, sans préciser leur sexe.
- source_word: ἐπὶ κλίνης μιᾶς
  choice: dans le même lit
  rationale: κλίνη peut désigner un lit ou une couche. Le contexte nocturne favorise « lit », et le français idiomatique dit que deux personnes sont « dans le même lit ».
- source_word: ὁ εἷς … ὁ ἕτερος
  choice: l’une … l’autre
  rationale: Cette tournure française reproduit clairement le contraste entre les deux personnes.
- source_word: παραλημφθήσεται
  choice: sera emmenée
  rationale: Le futur passif de παραλαμβάνω exprime ici le fait de prendre quelqu’un avec soi ou de l’emmener. « Emmenée » est naturel en français tout en laissant indéterminés la destination et le sort de la personne.
- source_word: ἀφεθήσεται
  choice: sera laissée
  rationale: Dans l’opposition avec παραλημφθήσεται, ἀφίημι signifie ici « laisser ». La formulation brève évite les connotations eschatologiques modernes que pourrait imposer « laissée derrière ».
theological_decisions:
- issue: Le sort de la personne emmenée et celui de la personne laissée
  choice: Le texte principal ne précise pas si la personne emmenée l’est en vue de la délivrance ou du jugement.
  alternative: Comprendre soit que la personne emmenée est sauvée, soit qu’elle est emmenée pour être jugée.
  rationale: Dans ce verset, les verbes grecs ne tranchent pas à eux seuls la question. La traduction conserve donc l’ambiguïté et la tension théologique du texte.
translation_notes:
  register: Français international moderne, simple et digne. « Deux personnes » évite un masculin potentiellement restrictif ; « dans le même lit » privilégie l’idiome français sans modifier la scène. Les marqueurs de notes sont placés immédiatement après les termes concernés.
