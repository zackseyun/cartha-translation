id: LUK.17.9
reference: Luke 17:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: μὴ ⸂ἔχει χάριν⸃ τῷ ⸀δούλῳ ὅτι ἐποίησεν τὰ ⸀διαταχθέντα;
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/009.yaml
  text: Does he thank the servant because he did what was commanded?[a]
translation:
  language: fr
  text: Remercie-t-il l’esclave parce qu’il a fait ce qui lui était ordonné ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « serviteur » pour « esclave » (grec doulos).
    reason: Alternative lexicale permettant de signaler une traduction française traditionnelle, bien que « esclave » rende plus directement le statut exprimé dans ce contexte.
lexical_decisions:
- source_word: μὴ
  choice: Remercie-t-il… ?
  rationale: Avec l’indicatif, μή introduit ici une question rhétorique qui appelle une réponse négative. En français naturel, la forme interrogative et le contexte font clairement entendre la réponse « non ».
- source_word: ἔχει χάριν
  choice: remercie
  rationale: L’expression ἔχειν χάριν τινί signifie ici éprouver ou manifester de la reconnaissance envers quelqu’un. « Remercier » en donne le sens de façon concise et idiomatique.
- source_word: δούλῳ
  choice: l’esclave
  rationale: Dans cette comparaison, le personnage est placé sous l’autorité d’un maître et tenu d’exécuter ses ordres. « Esclave » conserve le statut social et l’asymétrie exprimés par δοῦλος, sans les atténuer.
- source_word: ὅτι
  choice: parce que
  rationale: ὅτι introduit la raison pour laquelle le maître pourrait être supposé remercier l’esclave.
- source_word: ἐποίησεν
  choice: il a fait
  rationale: Le verbe ποιέω désigne ici l’accomplissement des instructions reçues. « Faire » est simple, naturel et précis dans ce contexte.
- source_word: τὰ διαταχθέντα
  choice: ce qui lui était ordonné
  rationale: Le participe passif substantivé désigne les choses prescrites. La tournure française conserve le passif et explicite naturellement que l’ordre concernait l’esclave.
theological_decisions:
- issue: Traduction de δοῦλος dans un contexte de maître et d’esclave
  choice: esclave
  alternative: serviteur
  rationale: Le raisonnement du verset repose sur l’obligation imposée à une personne entièrement subordonnée aux ordres de son maître. « Esclave » préserve cette force sociale et rhétorique, tandis que « serviteur » pourrait l’atténuer.
translation_notes:
  register: Français international moderne, naturel et digne. La question rhétorique reste sobre et appelle implicitement une réponse négative. Le pronom « lui » rend explicite en français que l’ordre avait été donné à l’esclave, sans modifier le sens du grec.
