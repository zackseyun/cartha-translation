id: LUK.17.33
reference: Luke 17:33
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὃς ἐὰν ζητήσῃ τὴν ψυχὴν αὐτοῦ ⸀περιποιήσασθαι ἀπολέσει αὐτήν, ⸂ὃς δ’ ἂν⸃ ⸀ἀπολέσῃ ζῳογονήσει αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/033.yaml
  text: Whoever seeks to preserve his life will lose it[b][a], but whoever loses it will preserve it alive.
translation:
  language: fr
  text: Quiconque cherchera à préserver sa vie[a] la perdra, mais quiconque la perdra la gardera en vie[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « son âme » ; ici, le mot grec désigne vraisemblablement la vie ou la personne elle-même plutôt que l’âme immatérielle.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « la gardera vivante » ; on peut aussi traduire « lui conservera la vie ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ζητήσῃ
  choice: cherchera
  rationale: Le verbe exprime ici une démarche intentionnelle visant à obtenir un résultat, et non un simple désir.
- source_word: ψυχὴν
  choice: vie
  rationale: Dans ce contexte de perte et de préservation de soi, ψυχή désigne la vie de la personne plutôt que spécifiquement une âme immatérielle.
- source_word: περιποιήσασθαι
  choice: à préserver
  rationale: L’infinitif moyen évoque l’action de conserver ou de mettre sa vie à l’abri pour soi-même. « Préserver » restitue cette nuance sans explicitation excessive.
- source_word: ἀπολέσει / ἀπολέσῃ
  choice: la perdra / la perdra
  rationale: La répétition de « perdre » maintient le parallélisme et le paradoxe de la formulation grecque.
- source_word: ζῳογονήσει
  choice: la gardera en vie
  rationale: Le verbe signifie littéralement garder en vie ou conserver vivant. Cette formulation transparente préserve le contraste frappant avec « perdre ».
- source_word: ὃς ἐὰν … ὃς δ’ ἂν
  choice: Quiconque… mais quiconque
  rationale: La tournure rend naturellement la condition générale, tandis que « mais » marque l’opposition introduite par δέ.
theological_decisions:
- issue: Sens de ψυχή dans cette parole paradoxale
  choice: « vie »
  alternative: « âme »
  rationale: Le contexte porte sur la volonté de préserver sa propre existence face au jugement. « Vie » conserve la portée existentielle de la parole sans imposer une opposition entre corps et âme.
- issue: Traduction de ζῳογονήσει
  choice: « la gardera en vie »
  alternative: « la sauvera » ou « la préservera »
  rationale: Le grec emploie un verbe qui désigne précisément le fait de garder vivant, et non le verbe habituellement traduit par « sauver ». La traduction retenue conserve cette particularité lexicale et la tension du paradoxe.
translation_notes:
  register: Français international actuel, sobre et digne. L’emploi du futur dans les deux propositions restitue naturellement en français la portée générale et prospective de la construction grecque. « Quiconque » évite toute marque de genre tout en conservant la concision solennelle de la parole.
