id: LUK.17.1
reference: Luke 17:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Εἶπεν δὲ πρὸς τοὺς μαθητὰς ⸀αὐτοῦ· Ἀνένδεκτόν ἐστιν τοῦ ⸂τὰ σκάνδαλα μὴ ἐλθεῖν⸃, ⸂πλὴν οὐαὶ⸃ δι’ οὗ ἔρχεται·
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/001.yaml
  text: Then he said to his disciples[a], “It is impossible for stumbling blocks not to come, but woe to the one through whom they come.”
translation:
  language: fr
  text: 'Puis il dit à ses disciples : « Il est impossible qu’il ne survienne pas de causes de chute[a] ; mais malheur à celui par qui elles surviennent ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « occasions de péché », « tentations » ou « offenses ». Le grec σκάνδαλα désigne ce qui fait trébucher ou tomber quelqu’un sur le plan moral ou spirituel.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἶπεν δὲ
  choice: Puis il dit
  rationale: δέ assure ici une liaison narrative légère. « Puis » rend naturellement la progression sans introduire une opposition marquée.
- source_word: πρὸς τοὺς μαθητὰς αὐτοῦ
  choice: à ses disciples
  rationale: Le possessif αὐτοῦ est explicitement représenté, et « disciples » est le terme courant pour μαθηταί dans Luc.
- source_word: Ἀνένδεκτόν ἐστιν
  choice: Il est impossible
  rationale: La formule exprime l’impossibilité que la situation décrite par l’infinitif négatif ne se produise ; la tournure française conserve cette forme tout en faisant entendre son caractère inévitable.
- source_word: τοῦ τὰ σκάνδαλα μὴ ἐλθεῖν
  choice: qu’il ne survienne pas de causes de chute
  rationale: 'La construction impersonnelle française restitue naturellement l’infinitif articulé négatif : c’est la non-survenue des σκάνδαλα qui est dite impossible.'
- source_word: σκάνδαλα
  choice: causes de chute
  rationale: Cette expression conserve l’image de ce qui fait tomber tout en indiquant sa portée morale ou spirituelle, sans réduire le sens à une simple offense ressentie ni à la seule tentation.
- source_word: πλὴν οὐαὶ
  choice: mais malheur
  rationale: 'πλήν marque ici un retournement adversatif : l’inévitabilité des causes de chute n’ôte rien à la responsabilité de la personne par qui elles arrivent.'
- source_word: δι’ οὗ
  choice: à celui par qui
  rationale: La formulation garde le référent personnel singulier et la notion d’intermédiaire exprimée par διά, sans ajouter de précision absente du grec.
- source_word: ἔρχεται
  choice: elles surviennent
  rationale: Le singulier grec est possible avec un sujet neutre pluriel ; en français, l’accord pluriel avec « causes de chute » est nécessaire. La reprise de « surviennent » maintient le lien verbal entre les deux propositions.
theological_decisions:
- issue: Portée éthique de σκάνδαλα
  choice: causes de chute
  alternative: occasions de péché ; tentations ; offenses ; obstacles qui font tomber
  rationale: Le mot désigne ce qui entraîne quelqu’un dans la faute ou la ruine morale et spirituelle. « Causes de chute » préserve cette largeur de sens et l’image sous-jacente sans trancher entre tentation, piège et occasion de péché.
- issue: Inévitabilité et responsabilité humaine
  choice: Conserver côte à côte « il est impossible » et « malheur à celui »
  alternative: Reformuler de manière à expliquer ou atténuer leur tension
  rationale: Le verset affirme à la fois l’inévitabilité générale de telles causes de chute et la responsabilité de la personne par qui elles surviennent. La traduction ne résout pas cette tension théologique à la place du texte.
- issue: Référence personnelle singulière de δι’ οὗ
  choice: celui par qui
  alternative: la personne par qui ; l’homme par qui
  rationale: « Celui par qui » respecte le singulier représentatif du grec sans introduire une insistance supplémentaire sur le sexe du référent.
translation_notes:
  register: Français international moderne, sobre et digne. La phrase impersonnelle « qu’il ne survienne pas de… » reste naturelle tout en suivant de près la structure grecque. « Malheur à celui » conserve la force solennelle de l’avertissement.
