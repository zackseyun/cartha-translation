id: LUK.17.30
reference: Luke 17:30
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: κατὰ ⸂τὰ αὐτὰ⸃ ἔσται ᾗ ἡμέρᾳ ὁ υἱὸς τοῦ ἀνθρώπου ἀποκαλύπτεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/030.yaml
  text: It will be the same on the day when the Son of Man is revealed[a].
translation:
  language: fr
  text: Il en sera de même[a] le jour où le Fils de l’homme sera révélé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Il en ira pareillement » ou « Ce sera de la même manière ». L’expression grecque renvoie aux exemples précédents.
    reason: Alternative lexicale et clarification du renvoi contextuel.
lexical_decisions:
- source_word: κατὰ τὰ αὐτά
  choice: Il en sera de même
  rationale: Cette expression idiomatique renvoie aux exemples précédents et exprime une correspondance de situation. Cette formulation française est naturelle et, avec le futur, conserve l’orientation donnée par ἔσται.
- source_word: ἔσται
  choice: sera
  rationale: Le futur de εἰμί est rendu directement par le futur français « sera ».
- source_word: ᾗ ἡμέρᾳ
  choice: le jour où
  rationale: Le datif relatif a ici une valeur temporelle. « Le jour où » est la tournure idiomatique en français moderne.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: le Fils de l’homme
  rationale: Cette traduction établie conserve le titre employé dans les Évangiles ainsi que ses résonances apocalyptiques et messianiques, notamment avec Daniel 7.
- source_word: ἀποκαλύπτεται
  choice: sera révélé
  rationale: Le passif grec désigne la révélation ou la manifestation publique du Fils de l’homme. Le futur français s’accorde naturellement avec la proposition principale future, sans réduire le verbe à la simple idée de venue.
theological_decisions:
- issue: Traduction du titre eschatologique ὁ υἱὸς τοῦ ἀνθρώπου
  choice: le Fils de l’homme
  alternative: l’Être humain
  rationale: La formulation traditionnelle maintient le lien intertextuel avec Daniel 7 et l’usage reconnaissable de ce titre dans les Évangiles. L’alternative affaiblirait ici sa portée titulaire, messianique et apocalyptique.
- issue: Portée de ἀποκαλύπτεται dans ce contexte
  choice: sera révélé
  alternative: viendra / apparaîtra
  rationale: Le verbe exprime une révélation ou un dévoilement, et non simplement un mouvement ou une arrivée. « Sera révélé » préserve en outre la voix passive et évite d’introduire une autre idée lexicale.
translation_notes:
  register: Français international moderne, naturel et digne. La tournure « Il en sera de même » relie clairement le verset aux exemples de Noé et de Lot, tandis que « sera révélé » conserve la voix passive et la portée eschatologique du texte grec.
