id: LUK.17.6
reference: Luke 17:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἶπεν δὲ ὁ κύριος· Εἰ ἔχετε πίστιν ὡς κόκκον σινάπεως, ἐλέγετε ἂν τῇ συκαμίνῳ ταύτῃ· Ἐκριζώθητι καὶ φυτεύθητι ἐν τῇ θαλάσσῃ· καὶ ὑπήκουσεν ἂν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/006.yaml
  text: And the Lord said[a], “If you had faith like a mustard seed, you would say to this mulberry tree, ‘Be uprooted and be planted in the sea,’ and it would obey you.”
translation:
  language: fr
  text: 'Le Seigneur dit : « Si vous aviez une foi semblable à une graine de moutarde, vous diriez à ce mûrier[a] : “Déracine-toi et plante-toi dans la mer”, et il vous obéirait. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, selon une appellation traditionnelle : « sycamine ». Le mot grec désigne un mûrier, et non le sycomore-figuier.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος
  choice: Seigneur
  rationale: Rend le titre narratif et christologique habituel dans Luc sans l’affaiblir en « maître ».
- source_word: πίστιν
  choice: foi
  rationale: Dans cette parole sur l’impossible, le terme désigne la confiance placée en Dieu; « foi » conserve aussi le vocabulaire théologique courant.
- source_word: ὡς κόκκον σινάπεως
  choice: semblable à une graine de moutarde
  rationale: Préserve la comparaison introduite par ὡς sans la réduire explicitement à la seule petitesse de la graine.
- source_word: συκαμίνῳ
  choice: mûrier
  rationale: Le terme grec désigne un mûrier, vraisemblablement le mûrier noir; « mûrier » est clair en français moderne et évite la confusion avec le sycomore-figuier.
- source_word: ἐλέγετε ἂν
  choice: vous diriez
  rationale: Le conditionnel français rend naturellement la valeur potentielle ou hypothétique de l’imparfait avec ἄν.
- source_word: Ἐκριζώθητι
  choice: Déracine-toi
  rationale: Formulation française vive qui exprime l’ordre d’être arraché avec ses racines, tout en convenant à la personnification de l’arbre.
- source_word: φυτεύθητι ἐν τῇ θαλάσσῃ
  choice: plante-toi dans la mer
  rationale: Conserve littéralement l’image paradoxale de la plantation dans la mer, sans l’expliciter par « transplante-toi ».
- source_word: ὑπήκουσεν ἂν ὑμῖν
  choice: il vous obéirait
  rationale: « Obéir » restitue la force du verbe dans le cadre d’un commandement adressé à l’arbre.
theological_decisions:
- issue: Sens de πίστις dans une parole de miracle
  choice: foi
  alternative: confiance; fidélité
  rationale: Le contexte met en avant la confiance qui s’en remet à Dieu face à l’impossible, plutôt que la fidélité comme constance morale; « foi » laisse néanmoins intacte la portée théologique du terme.
- issue: Force de la condition εἰ ἔχετε avec les formes en ἄν
  choice: Si vous aviez… vous diriez… il vous obéirait
  alternative: Si vous avez… vous pouvez dire… il vous obéira
  rationale: La suite à l’imparfait avec ἄν appelle naturellement en français une construction hypothétique au conditionnel. Cette formulation ne tranche pas la question de savoir si Jésus reproche une absence totale de foi ou souligne la puissance d’une foi même minime.
translation_notes:
  register: Français international moderne, digne et oralement naturel. La structure conditionnelle est conservée, ainsi que l’image volontairement paradoxale de l’arbre planté dans la mer. Le marqueur de note est placé immédiatement après le terme concerné.
