  text: καὶ εἰσερχομένου αὐτοῦ εἴς τινα κώμην ⸀ἀπήντησαν δέκα λεπροὶ ἄνδρες, οἳ ⸀ἔστησαν πόρρωθεν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/012.yaml
  text: And as he was entering a certain village[a], ten leprous men met him, who stood at a distance[b],
translation:
  language: fr
  text: Comme il entrait dans un village, dix hommes lépreux[a] vinrent à sa rencontre. Ils se tinrent à distance[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme grec traditionnellement rendu par « lépreux » appartient à une classification ancienne et ne permet pas nécessairement d’identifier l’affection à la lèpre au sens médical moderne.
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « au loin ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσερχομένου αὐτοῦ
  choice: Comme il entrait
  rationale: Le génitif absolu avec participe présent exprime une action en cours, contemporaine de la rencontre. « Comme il entrait » conserve cet aspect et reste naturel en français.
- source_word: εἴς τινα κώμην
  choice: dans un certain village
  rationale: Le pronom indéfini τινα indique un village non nommé mais particulier. « Un certain village » reflète cette nuance sans identifier le lieu.
- source_word: ἀπήντησαν
  choice: vinrent à sa rencontre
  rationale: Le verbe peut signifier « rencontrer » ou « aller à la rencontre de ». Cette formulation idiomatique rend ici la démarche des hommes vers Jésus sans ajouter de détail absent du texte.
- source_word: δέκα λεπροὶ ἄνδρες
  choice: dix hommes atteints d’une maladie de peau
  rationale: λεπροί qualifie les hommes selon une catégorie ancienne d’affections cutanées. La formulation évite d’assimiler automatiquement cette catégorie à la maladie moderne précisément appelée lèpre, tout en mettant les personnes avant leur affection.
- source_word: οἳ ἔστησαν
  choice: Ils se tinrent
  rationale: Dans ce contexte, ἵστημι décrit le fait de prendre ou de garder une position. Une nouvelle phrase est plus naturelle en français que le relatif grec tout en conservant son référent.
- source_word: πόρρωθεν
  choice: à distance
  rationale: Cette expression française actuelle rend clairement la séparation spatiale, sans préciser une distance que le grec ne quantifie pas.
theological_decisions:
- issue: Portée de la désignation λεπροί
  choice: hommes atteints d’une maladie de peau
  alternative: hommes lépreux
  rationale: Le terme grec appartient à une classification ancienne qui ne correspond pas nécessairement au diagnostic moderne de la lèpre. Le choix retenu préserve cette réserve historique et médicale sans minimiser l’affection ni introduire une interprétation confessionnelle.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe est légèrement réorganisée en deux phrases pour une lecture naturelle, sans modifier les rapports temporels ni l’enchaînement du grec.
