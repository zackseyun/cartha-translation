id: LUK.17.4
reference: Luke 17:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἐὰν ἑπτάκις τῆς ἡμέρας ⸀ἁμαρτήσῃ εἰς σὲ καὶ ⸀ἑπτάκις ἐπιστρέψῃ ⸂πρὸς σὲ⸃ λέγων· Μετανοῶ, ἀφήσεις αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/004.yaml
  text: And if he sins against you seven times in a day[a], and seven times returns to you saying[c][b], ‘I repent,’ you shall forgive him.
translation:
  language: fr
  text: 'Et s’il pèche contre toi sept fois dans la même journée, et que sept fois il revienne à toi en disant : « Je me repens », tu lui pardonneras.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « tu dois lui pardonner ». Le grec emploie un futur qui a ici valeur de commandement.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑπτάκις τῆς ἡμέρας
  choice: sept fois dans la même journée
  rationale: Cette formulation française naturelle exprime la répétition à l’intérieur d’une seule journée, valeur du génitif de temps, sans donner à entendre qu’il s’agit d’un jour déterminé.
- source_word: ἁμαρτήσῃ εἰς σὲ
  choice: il pèche contre toi
  rationale: Le tour avec εἰς σέ désigne ici une faute commise envers la personne à qui Jésus s’adresse; « contre toi » est l’équivalent français direct et idiomatique.
- source_word: ἐπιστρέψῃ πρὸς σὲ
  choice: il revienne à toi
  rationale: ἐπιστρέφω peut signifier revenir ou se tourner. Dans la succession répétée faute-retour, « revienne à toi » rend naturellement le mouvement de retour vers la personne offensée.
- source_word: λέγων
  choice: en disant
  rationale: Le gérondif français conserve le lien de manière exprimé par le participe présent grec.
- source_word: Μετανοῶ
  choice: Je me repens
  rationale: Cette traduction garde la portée morale de μετανοέω et ne la réduit ni à un simple regret ni à une excuse.
- source_word: ἀφήσεις αὐτῷ
  choice: tu lui pardonneras
  rationale: Le futur français correspond à la forme future grecque et peut, comme elle dans ce contexte d’enseignement, porter la force d’une prescription.
theological_decisions:
- issue: Force du futur ἀφήσεις
  choice: « tu lui pardonneras », comme prescription formulée au futur
  alternative: « pardonne-lui » ou « tu dois lui pardonner »
  rationale: Le contexte donne au futur grec une valeur directive. Le futur français préserve à la fois la forme et l’obligation, sans expliciter davantage que le texte.
- issue: Portée de Μετανοῶ
  choice: « Je me repens »
  alternative: « Je regrette » ou « J’ai changé d’avis »
  rationale: Le verbe désigne ici la repentance déclarée, et non le seul regret émotionnel ou un simple changement d’opinion.
- issue: Condition du pardon dans l’énoncé
  choice: Conserver explicitement le retour accompagné de « Je me repens »
  alternative: Formuler un pardon sans référence à la repentance
  rationale: Le verset relie grammaticalement l’ordre de pardonner au retour de l’offenseur qui affirme se repentir; la traduction conserve cette articulation sans développer une doctrine générale au-delà de l’énoncé.
translation_notes:
  register: Français international moderne, courant et digne. « Dans la même journée » évite le tour peu naturel « dans le jour » et rend clairement la limite temporelle. Le masculin singulier de l’offenseur est conservé conformément au texte grec et au contexte immédiat.
