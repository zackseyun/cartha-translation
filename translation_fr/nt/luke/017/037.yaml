source:
  edition: SBLGNT
  text: καὶ ἀποκριθέντες λέγουσιν αὐτῷ· Ποῦ, κύριε; ὁ δὲ εἶπεν αὐτοῖς· Ὅπου τὸ σῶμα, ἐκεῖ ⸂καὶ οἱ ἀετοὶ ἐπισυναχθήσονται⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/037.yaml
  text: And answering[a], they say to him, “Where, Lord?” And he said to them, “Where the body is[b], there also the vultures will be gathered.”
translation:
  language: fr
  text: 'Ils lui répondirent : « Où, Seigneur ? » Il leur dit : « Là où est le corps[a], là aussi les vautours[b] seront rassemblés. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le cadavre » ou « la carcasse ».
    reason: lexical_alternative
  - marker: b
    text: Ou « les aigles ». Le mot grec peut désigner des aigles, mais le contexte évoque probablement des oiseaux qui se nourrissent de charogne.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθέντες λέγουσιν
  choice: ils lui demandèrent
  rationale: La tournure grecque signifie littéralement « ayant répondu, ils lui disent ». En français actuel, « ils lui demandèrent » exprime naturellement la réaction des disciples et introduit leur question sans calquer une formule grecque peu idiomatique.
- source_word: Ποῦ
  choice: où
  rationale: L’adverbe demande le lieu de façon brève et directe.
- source_word: κύριε
  choice: Seigneur
  rationale: Dans cette adresse à Jésus, « Seigneur » rend naturellement κύριε tout en conservant la portée possible du titre.
- source_word: Ὅπου
  choice: là où
  rationale: Cette expression convient à la formulation proverbiale et établit clairement la correspondance avec « là aussi ».
- source_word: σῶμα
  choice: corps
  rationale: « Corps » est le sens ordinaire du terme et préserve la retenue du grec, même si le contexte évoque manifestement un cadavre ou une carcasse.
- source_word: ἀετοὶ
  choice: vautours
  rationale: Le mot grec peut désigner des aigles, mais l’image d’oiseaux se réunissant autour d’un corps rend ici « vautours » plus immédiatement intelligible en français moderne.
- source_word: ἐπισυναχθήσονται
  choice: seront rassemblés
  rationale: Le futur passif grec est conservé. Cette formulation maintient l’éventuelle suggestion d’une action ou d’une nécessité extérieure sans en préciser l’agent.
theological_decisions:
- issue: Référent de l’image proverbiale du corps et des vautours
  choice: Conserver l’image sans identifier ce qu’elle représente
  alternative: L’expliciter comme une référence au jugement final, aux armées romaines ou au principe général d’un jugement inévitable
  rationale: Le grec ne précise pas le référent de cette parole. Une traduction non interprétative préserve donc son ambiguïté et sa tension eschatologique.
- issue: Portée du passif « seront rassemblés »
  choice: Maintenir le passif sans nommer d’agent
  alternative: Employer l’actif « se rassembleront »
  rationale: Le passif correspond à la forme grecque et évite de décider si le rassemblement est simplement naturel ou implicitement provoqué par Dieu.
translation_notes:
  register: Français international moderne, sobre et digne. Le dialogue est rendu au passé simple, temps naturel du récit écrit, plutôt que par un calque du présent historique grec. La structure parallèle « Là où… là aussi… » conserve le ton proverbial.
