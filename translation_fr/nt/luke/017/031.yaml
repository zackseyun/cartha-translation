id: LUK.17.31
reference: Luke 17:31
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐν ἐκείνῃ τῇ ἡμέρᾳ ὃς ἔσται ἐπὶ τοῦ δώματος καὶ τὰ σκεύη αὐτοῦ ἐν τῇ οἰκίᾳ, μὴ καταβάτω ἆραι αὐτά, καὶ ὁ ⸀ἐν ἀγρῷ ὁμοίως μὴ ἐπιστρεψάτω εἰς τὰ ὀπίσω.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/031.yaml
  text: On that day, whoever is on the housetop, with his belongings in the house, must not go down to take them away; and likewise, the one in the field must not turn back to the things behind.
translation:
  language: fr
  text: Ce jour-là, celui qui sera sur le toit-terrasse[a], tandis que ses affaires seront dans la maison, ne devra pas descendre pour les prendre. De même, celui qui sera aux champs ne devra pas retourner en arrière[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Il s’agit du toit plat d’une maison, généralement accessible et utilisé comme espace de vie.
    reason: cultural_note
  - marker: b
    text: 'Ou, selon le sens suggéré par le contexte : « ne devra pas retourner chercher ce qu’il a laissé derrière lui ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: Ce jour-là
  rationale: Expression temporelle française naturelle qui conserve l’insistance démonstrative de ἐκείνῃ.
- source_word: ὃς ἔσται
  choice: celui qui sera
  rationale: Conserve explicitement le futur grec et la portée représentative du relatif dans ce contexte.
- source_word: ἐπὶ τοῦ δώματος
  choice: sur le toit en terrasse
  rationale: δώμα désigne ici le toit plat, accessible et utilisable, caractéristique des maisons du contexte ancien; cette formulation évite l’image d’un toit incliné.
- source_word: τὰ σκεύη αὐτοῦ
  choice: ses affaires
  rationale: Dans ce contexte, σκεύη évoque les biens ou objets personnels; « affaires » est courant, clair et n’exagère ni leur valeur ni leur nature.
- source_word: μὴ καταβάτω
  choice: ne devra pas descendre
  rationale: Rend la forte interdiction exprimée par l’impératif aoriste négatif à la troisième personne.
- source_word: ἆραι αὐτά
  choice: pour les prendre
  rationale: αἴρω signifie ici prendre ou emporter les biens; le contexte rend l’idée de récupération suffisamment claire sans ajout explicatif.
- source_word: ὁ ἐν ἀγρῷ
  choice: celui qui sera dans les champs
  rationale: Rend naturellement l’expression substantivée et maintient le parallélisme avec « celui qui sera sur le toit »; le futur est repris du cadre établi par ἔσται.
- source_word: ὁμοίως
  choice: De même
  rationale: Marque clairement et sobrement le parallèle entre les deux interdictions.
- source_word: μὴ ἐπιστρεψάτω εἰς τὰ ὀπίσω
  choice: ne devra pas retourner en arrière
  rationale: Rend l’interdiction urgente de revenir sur ses pas. « En arrière » préserve quelque chose de l’expression grecque εἰς τὰ ὀπίσω sans produire le français artificiel « vers les choses derrière ».
theological_decisions:
- issue: Urgence eschatologique exprimée par une scène concrète
  choice: Maintenir les consignes concrètes de ne pas descendre et de ne pas retourner en arrière.
  alternative: Paraphraser en une exhortation générale à se détacher de ses biens.
  rationale: Le grec décrit une situation précise liée à « ce jour-là ». Garder cette scène préserve sa force et évite d’introduire une moralisation absente du verset.
- issue: Référent de εἰς τὰ ὀπίσω
  choice: Traduire « retourner en arrière » sans préciser explicitement qu’il s’agit des biens laissés derrière.
  alternative: Traduire « retourner chercher ce qu’il a laissé derrière lui ».
  rationale: L’expression peut évoquer ce qui se trouve derrière, mais le texte ne nomme pas explicitement les biens dans la seconde proposition. La traduction choisie conserve cette ouverture, tandis que la note signale l’interprétation contextuelle possible.
translation_notes:
  register: Français international moderne, clair et digne. « Toit en terrasse » rend la réalité culturelle sans archaïsme; « ses affaires » reste concret et accessible. Les formes « ne devra pas » expriment l’urgence des interdictions sans recourir au tour soutenu « qu’il ne descende pas ».
