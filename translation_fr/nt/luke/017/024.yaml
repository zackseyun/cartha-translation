id: LUK.17.24
reference: Luke 17:24
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὥσπερ γὰρ ἡ ⸀ἀστραπὴ ἀστράπτουσα ἐκ τῆς ⸂ὑπὸ τὸν⸃ οὐρανὸν εἰς τὴν ὑπ’ οὐρανὸν λάμπει, οὕτως ἔσται ὁ υἱὸς τοῦ ἀνθρώπου ⸂ἐν τῇ ἡμέρᾳ αὐτοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/024.yaml
  text: For just as lightning, flashing from one part under heaven to the other part under heaven, shines[b][a], so will the Son of Man be in his day.
translation:
  language: fr
  text: En effet, tout comme l’éclair, quand il jaillit, brille d’un point sous le ciel jusqu’à un autre point sous le ciel[a], ainsi en sera-t-il du Fils de l’homme en son jour[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de manière plus idiomatique : « d’une extrémité du ciel à l’autre ». Le grec répète plus littéralement « sous le ciel » dans les deux parties de l’expression.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « au jour qui sera le sien ». L’expression désigne le temps associé au Fils de l’homme sans le définir davantage.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: En effet, tout comme
  rationale: « En effet » conserve la valeur explicative de γάρ, tandis que « tout comme » introduit naturellement la comparaison portée par ὥσπερ.
- source_word: ἡ ἀστραπὴ ἀστράπτουσα
  choice: l’éclair, quand il jaillit
  rationale: « L’éclair » est le sens courant de ἀστραπή. La proposition temporelle rend le participe ἀστράπτουσα de manière naturelle en français tout en maintenant l’action vive distincte de λάμπει.
- source_word: ἐκ τῆς ὑπὸ τὸν οὐρανὸν εἰς τὴν ὑπ’ οὐρανόν
  choice: d’un point sous le ciel jusqu’à un autre point sous le ciel
  rationale: Cette formulation conserve la répétition inhabituelle de « sous le ciel » dans les deux membres grecs et explicite sobrement les deux points implicites du trajet.
- source_word: λάμπει
  choice: brille
  rationale: « Brille » traduit directement λάμπει et le distingue du jaillissement exprimé par ἀστράπτουσα.
- source_word: οὕτως ἔσται
  choice: ainsi en sera-t-il
  rationale: Formule française naturelle qui maintient le futur et la correspondance établie par la comparaison.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: le Fils de l’homme
  rationale: Rendu traditionnel, transparent et non paraphrastique de ce titre.
- source_word: ἐν τῇ ἡμέρᾳ αὐτοῦ
  choice: en son jour
  rationale: Cette formulation concise préserve la préposition, le possessif et l’ampleur référentielle du grec sans préciser indûment qu’il s’agit de la venue ou du jugement.
theological_decisions:
- issue: Portée eschatologique de « le Fils de l’homme en son jour »
  choice: Conserver « en son jour » sans explicitation
  alternative: « lors de sa venue », « au jour du jugement » ou « au jour du Fils de l’homme »
  rationale: Le contexte est eschatologique, mais le grec dit seulement « en son jour ». Une précision supplémentaire résoudrait une tension que le texte laisse ouverte.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure conserve délibérément la répétition concrète de « sous le ciel », tandis que la note propose l’équivalent français plus idiomatique. « En son jour » garde la formulation eschatologique ouverte du texte grec.
