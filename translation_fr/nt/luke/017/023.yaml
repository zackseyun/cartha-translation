revisions:
- from: 'On vous dira : « Regardez, il est là ! » ou : « Il est ici ! » N’y allez pas et ne vous lancez pas à sa poursuite.[a]'
  to: 'On vous dira : « Regardez, là-bas ! Regardez, ici ! » N’y allez pas et ne poursuivez pas.[a]'
  rationale: La révision restitue les deux appels à l’attention et l’opposition « là-bas / ici » sans introduire le pronom « il ». Elle conserve « N’y allez pas » comme rendu contextuel naturel de μὴ ἀπέλθητε, tout en laissant sans complément explicite le second impératif négatif, conformément à μηδὲ διώξητε. La note documente cette ambiguïté sans la résoudre.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T10:54:26Z'
review_pass:
  verdict: revise
  source_fidelity: 'La version ajoute deux précisions absentes du grec : « il » dans les annonces et surtout « sa » dans « à sa poursuite ». Le grec juxtapose deux appels déictiques elliptiques (« Voici/regardez : là-bas ; voici/regardez : ici ») et laisse l’objet de διώξητε non exprimé. La révision conserve ces ellipses autant que le permet le français.'
  naturalness: « Regardez, là-bas ! Regardez, ici ! » est direct, moderne et reproduit la répétition expressive de ἰδού. « N’y allez pas et ne poursuivez pas » est un peu plus soutenu, mais reste naturel dans le registre d’un avertissement solennel et évite de fixer indûment le complément implicite.
  terminology: Aucun terme théologique technique n’est en jeu. La suppression de « il » ne nie pas le référent fourni par le contexte ; elle évite simplement de l’insérer dans une phrase grecque qui ne le formule pas. La suppression de « sa » préserve l’ambiguïté de l’objet de « poursuivre ».
  issues:
  - severity: medium
    issue: « il est » est ajouté aux deux exclamations.
    rationale: Ἰδοὺ ἐκεῖ / Ἰδοὺ ὧδε ne contient ni verbe ni pronom personnel. Le contexte permet de comprendre le référent, mais la formulation française peut conserver l’ellipse sans perte de clarté décisive.
  - severity: high
    issue: « à sa poursuite » impose un objet singulier à διώξητε.
    rationale: Le verbe grec n’a pas de complément exprimé. Le possessif « sa » identifie cet objet à la personne annoncée, alors que le texte laisse ouverte la question de savoir si l’avertissement vise la personne prétendument localisée, les annonciateurs ou la piste indiquée.
  - severity: low
    issue: La note qualifie de « littéralement » une formulation qui ne correspond pas exactement au texte révisé et ne signale pas l’ajout de « sa » dans le texte actuel.
    rationale: La note doit décrire précisément l’absence d’objet du verbe grec et ne pas présenter comme littérale une paraphrase française.
  revised_text: 'On vous dira : « Regardez, là-bas ! Regardez, ici ! » N’y allez pas et ne poursuivez pas.[a]'
  revised_footnotes:
