  text: καὶ ἐροῦσιν ὑμῖν· Ἰδοὺ ⸂ἐκεῖ· Ἰδοὺ ὧδε⸃· μὴ ἀπέλθητε μηδὲ διώξητε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/023.yaml
  text: And they will say to you[a], ‘Look, there!’ or ‘Look, here!’ Do not go away or run after them.
translation:
  language: fr
  text: 'On vous dira : « Regardez, là-bas ! Regardez, ici ! » N’y allez pas et ne poursuivez pas.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec ne précise pas l’objet de « poursuivez ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐροῦσιν ὑμῖν
  choice: On vous dira
  rationale: Le pluriel grec indéfini se rend naturellement en français par « on » ; le futur et le destinataire pluriel sont conservés.
- source_word: Ἰδοὺ
  choice: Regardez / il est
  rationale: Dans la première exclamation, « Regardez » conserve explicitement la fonction d’appel à l’attention. Dans la seconde, l’ellipse française « Il est ici ! » évite une répétition lourde tout en gardant le contraste déictique.
- source_word: ἐκεῖ · ὧδε
  choice: là / ici
  rationale: Ces adverbes opposent directement un lieu éloigné à un lieu proche.
- source_word: μὴ ἀπέλθητε
  choice: N’y allez pas
  rationale: Dans ce contexte de lieux que l’on désigne, le pronom « y » exprime naturellement le déplacement vers l’endroit annoncé, sans préciser davantage le grec.
- source_word: μηδὲ διώξητε
  choice: et ne vous lancez pas à sa poursuite
  rationale: διώκω exprime ici l’idée de poursuivre ou de courir après. La tournure française est vive et naturelle, mais l’objet demeure implicite dans le grec, d’où la note.
theological_decisions:
- issue: Référent implicite des annonces déictiques
  choice: Employer « il » dans les citations, en référence contextuelle au Fils de l’homme
  alternative: « Regardez, là ! Regardez, ici ! »
  rationale: Le contexte immédiat fournit le référent, et le français exige plus naturellement un sujet dans cette annonce de localisation. La traduction ne précise ni la nature ni les modalités de sa manifestation.
- issue: Objet non exprimé de διώξητε
  choice: Formuler « à sa poursuite » dans le texte et signaler l’absence d’objet grec en note
  alternative: « ne poursuivez pas »
  rationale: 'La formulation est idiomatique en français, tandis que la note préserve l’ambiguïté réelle : l’objet peut être compris comme la personne annoncée, ceux qui font l’annonce ou la piste ainsi indiquée.'
translation_notes:
  register: Français international moderne, direct et digne. Les exclamations gardent l’urgence de l’avertissement ; la note évite de résoudre silencieusement l’objet implicite de διώξητε.
