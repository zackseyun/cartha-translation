review_pass:
  verdict: revise
  source_fidelity: La comparaison introduite par λυσιτελεῖ et ἢ ἵνα est bien rendue. Toutefois, « fasse tomber dans le péché » explicite dans le texte une portée que σκανδαλίζω exprime métaphoriquement; « faire trébucher » préserve mieux l’image et l’ouverture du grec. « Pierre supérieure » dans la note a n’est pas suffisamment étayé par λίθος μυλικός.
  naturalness: La formulation révisée est idiomatique en français international moderne. « Plutôt que de faire trébucher » rend la comparaison plus naturellement que « plutôt qu’il fasse tomber ».
  terminology: « Meule de moulin » est le terme français usuel pour λίθος μυλικός. « Ces petits » conserve sans la trancher l’ambiguïté du référent. La note b propose l’explicitation morale comme variante plutôt que de l’imposer au texte.
  issues:
  - severity: medium
    issue: Le texte principal explicite σκανδαλίσῃ par « fasse tomber dans le péché ».
    rationale: Le verbe grec peut comporter l’idée d’une chute dans le péché ou la ruine, mais il emploie l’image de faire trébucher. La conserver dans le texte évite de restreindre inutilement la nuance, tandis qu’une note peut donner l’explicitation.
  - severity: medium
    issue: La note a identifie la pierre comme « la pierre supérieure » d’un moulin.
    rationale: λίθος μυλικός désigne une meule/pierre de moulin; le texte ne permet pas d’identifier avec sûreté une pierre supérieure. La note doit se limiter à la possible grandeur ou lourdeur de la meule.
  - severity: low
    issue: « plutôt qu’il fasse » est moins fluide dans cette construction comparative.
    rationale: « plutôt que de faire » est une formulation française plus directe, dont le sujet reste clairement « lui ».
