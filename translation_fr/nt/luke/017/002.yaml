revisions:
- from: Il vaudrait mieux pour lui qu’on lui attache au cou une pierre de moulin[a] et qu’on le jette dans la mer, plutôt qu’il fasse tomber dans le péché un seul de ces petits[b].
  to: Il vaudrait mieux pour lui qu’on lui attache au cou une meule de moulin[a] et qu’on le jette à la mer, plutôt que de faire trébucher l’un de ces petits[b].
  rationale: La révision conserve la force comparative et l’ambiguïté du grec, emploie une terminologie française plus usuelle pour la meule, et replace dans la note l’explicitation interprétative de σκανδαλίζω. Elle corrige aussi une précision historique non assurée dans la note a.
