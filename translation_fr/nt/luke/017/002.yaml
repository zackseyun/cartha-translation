id: LUK.17.2
reference: Luke 17:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: λυσιτελεῖ αὐτῷ εἰ ⸂λίθος μυλικὸς⸃ περίκειται περὶ τὸν τράχηλον αὐτοῦ καὶ ἔρριπται εἰς τὴν θάλασσαν ἢ ἵνα σκανδαλίσῃ ⸂τῶν μικρῶν τούτων ἕνα⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/002.yaml
  text: It would be better for him if a millstone were hung around his neck and he were thrown into the sea than that he should cause one of these little ones to stumble[a][b].
translation:
  language: fr
  text: Il vaudrait mieux pour lui qu’on lui attache au cou une meule de moulin[a] et qu’on le jette à la mer, plutôt que de faire trébucher l’un de ces petits[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, plus précisément, « une lourde meule de moulin ». L’expression grecque peut désigner une grosse meule utilisée dans un moulin.
    reason: lexical_alternative
  - marker: b
    text: Ou « faire tomber l’un de ces petits dans le péché ». Le verbe grec évoque le fait de provoquer une chute, notamment dans le péché ou vers la ruine spirituelle.
    reason: lexical_alternative
lexical_decisions:
- source_word: λυσιτελεῖ αὐτῷ
  choice: Il vaudrait mieux pour lui
  rationale: Cette tournure française naturelle exprime qu’un sort, pourtant terrible, serait préférable à l’autre et conserve la valeur comparative de l’expression grecque.
- source_word: λίθος μυλικὸς
  choice: une pierre de moulin
  rationale: Équivalent français clair du grec, sans préciser dans le corps du texte le type ou la taille de la meule; la nuance possible d’une lourde pierre est signalée en note.
- source_word: περίκειται περὶ τὸν τράχηλον αὐτοῦ
  choice: qu’on lui attache au cou
  rationale: Formulation idiomatique qui rend l’état résultant exprimé par le grec et s’intègre naturellement à la construction hypothétique française.
- source_word: ἔρριπται εἰς τὴν θάλασσαν
  choice: qu’on le jette dans la mer
  rationale: Le passif grec est rendu par la tournure indéfinie « on », courante en français, tout en conservant l’action subie et sa coordination avec la proposition précédente.
- source_word: σκανδαλίσῃ
  choice: fasse tomber dans le péché
  rationale: Le verbe désigne ici le fait de provoquer une chute morale ou spirituelle. Cette formulation garde l’image de la chute tout en explicitant sa portée, que le simple verbe « scandaliser » ne transmettrait pas clairement en français moderne.
- source_word: τῶν μικρῶν τούτων ἕνα
  choice: un seul de ces petits
  rationale: Cette traduction reste proche du grec, souligne la valeur de ἕνα et ne limite pas arbitrairement le référent aux enfants ou aux disciples.
- source_word: ἢ ἵνα
  choice: plutôt que
  rationale: Cette locution exprime naturellement en français la comparaison entre les deux issues.
theological_decisions:
- issue: Référent de « ces petits »
  choice: Conserver la désignation générale « ces petits » sans préciser leur identité.
  alternative: « ces enfants » ou « ces croyants/disciples humbles »
  rationale: Le grec ne définit pas ici explicitement le groupe. Une désignation ouverte préserve l’ambiguïté réelle et évite d’imposer une interprétation théologique plus étroite.
- issue: Portée de σκανδαλίσῃ
  choice: « fasse tomber dans le péché »
  alternative: « fasse trébucher » ou « entraîne à sa perte »
  rationale: La traduction retenue communique la chute morale ou spirituelle en jeu sans réduire le verbe à une simple offense psychologique; une note conserve une formulation plus métaphorique.
translation_notes:
  register: Français international moderne, digne et direct. La tournure avec « on » évite un passif pesant. « Pierre de moulin » est plus immédiatement transparent que le rare « meule » pour certains lecteurs, tandis que « ces petits » préserve la portée ouverte du grec.
