id: LUK.17.21
reference: Luke 17:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὐδὲ ἐροῦσιν· Ἰδοὺ ὧδε ἤ· ⸀Ἐκεῖ· ἰδοὺ γὰρ ἡ βασιλεία τοῦ θεοῦ ἐντὸς ὑμῶν ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/021.yaml
  text: Nor will they say[a], ‘Look, here!’ or ‘There!’ For behold, the kingdom of God is in your midst.”
translation:
  language: fr
  text: 'On ne dira pas non plus : « Regardez, il est ici ! » ou : « Il est là ! » Car voici : le royaume de Dieu est au milieu de vous[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « en vous ». L’expression grecque peut désigner une réalité intérieure ou une présence collective, « parmi vous / au milieu de vous ».'
    reason: alternative_reading
lexical_decisions:
- source_word: οὐδὲ ἐροῦσιν
  choice: On ne dira pas non plus
  rationale: Le pronom indéfini « on » rend naturellement en français le pluriel non précisé du grec, tandis que « pas non plus » poursuit la négation du verset précédent.
- source_word: Ἰδοὺ ὧδε ἤ· Ἐκεῖ
  choice: '« Regardez, il est ici ! » ou : « Il est là ! »'
  rationale: « Regardez » conserve la fonction d'appel à l'attention de ἰδού; l'ajout idiomatique de « il est » explicite en français que les indications de lieu concernent le royaume, sans modifier leur opposition.
- source_word: γὰρ ἰδοὺ
  choice: Car voici
  rationale: « Car » maintient le lien explicatif de γάρ. « Voici » rend le second ἰδού dans un registre digne et permet d'éviter une répétition lourde de « regardez ».
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: le royaume de Dieu
  rationale: Formulation française consacrée et transparente, qui préserve les dimensions royale et eschatologique sans réduire le sens au seul règne abstrait ou à un territoire.
- source_word: ἐντὸς ὑμῶν
  choice: au milieu de vous
  rationale: Dans cette adresse à un auditoire pluriel, l'expression collective est contextuellement préférable et naturelle. Le sens possible « en vous » est conservé en note.
- source_word: ἐστιν
  choice: est
  rationale: Le présent simple de εἰμί est rendu directement; le complément exprime la présence.
theological_decisions:
- issue: Sens de ἐντὸς ὑμῶν
  choice: le royaume de Dieu est au milieu de vous
  alternative: le royaume de Dieu est en vous
  rationale: Le grec permet une lecture intérieure aussi bien qu'une lecture collective. L'auditoire pluriel et le contraste avec des localisations observables favorisent ici « au milieu de vous », sans exclure l'autre lecture, signalée en note.
translation_notes:
  register: Français international moderne, naturel et digne. Les démonstratifs sont formulés idiomatiquement; « voici » conserve la solennité mesurée du second ἰδού. L'ambiguïté interprétative centrale est préservée par une note.
