id: LUK.17.14
reference: Luke 17:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἰδὼν εἶπεν αὐτοῖς· Πορευθέντες ἐπιδείξατε ἑαυτοὺς τοῖς ἱερεῦσιν. καὶ ἐγένετο ἐν τῷ ὑπάγειν αὐτοὺς ἐκαθαρίσθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/014.yaml
  text: And when he saw them[a], he said to them, “Go and show yourselves to the priests.” And as they were going[b], they were cleansed.
translation:
  language: fr
  text: 'Quand il les vit, il leur dit : « Allez vous montrer aux prêtres[a]. » Et pendant qu’ils y allaient, ils furent purifiés[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’ordre de se montrer aux prêtres renvoie à l’examen prescrit pour une personne guérie d’une maladie de peau ; voir Lévitique 14.
    reason: cross_reference
  - marker: b
    text: Ou « ils devinrent purs ». Le verbe grec peut désigner une purification à la fois physique et rituelle.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν
  choice: Quand il les vit
  rationale: Le participe aoriste de ὁράω est rendu par une proposition temporelle naturelle en français. Le pronom « les » est fourni par le contexte immédiat.
- source_word: Πορευθέντες
  choice: Allez
  rationale: Ce participe aoriste accompagne l’impératif ἐπιδείξατε avec une valeur injonctive. « Allez vous montrer » exprime clairement et naturellement la séquence demandée.
- source_word: ἐπιδείξατε ἑαυτοὺς
  choice: vous montrer
  rationale: Dans le contexte d’un examen sacerdotal, cette formulation directe reste idiomatique et fidèle au geste demandé.
- source_word: τοῖς ἱερεῦσιν
  choice: aux prêtres
  rationale: L’article et le pluriel désignent les prêtres chargés de constater la purification selon la Loi.
- source_word: ἐγένετο ἐν τῷ ὑπάγειν αὐτοὺς
  choice: Et pendant qu’ils y allaient
  rationale: La tournure grecque situe la purification au cours de leur déplacement. « Y allaient » reprend naturellement la destination déjà indiquée.
- source_word: ἐκαθαρίσθησαν
  choice: ils furent purifiés
  rationale: Le passif de καθαρίζω peut évoquer à la fois le rétablissement physique et le retour à l’état de pureté rituelle. « Purifiés » conserve ces deux dimensions mieux que le seul terme « guéris ».
theological_decisions:
- issue: Rendu du langage de purification dans le contexte d’une maladie de peau
  choice: ils furent purifiés
  alternative: ils furent guéris ; ils devinrent purs
  rationale: Le grec met l’accent sur la purification, notion qui englobe ici le rétablissement corporel et la réintégration dans l’état de pureté reconnu par les prêtres. La traduction ne réduit donc pas le sens à la seule guérison médicale.
translation_notes:
  register: 'Français international moderne, clair et digne. La syntaxe reste fluide tout en conservant la progression du grec : Jésus les voit, leur donne l’ordre, puis la purification survient tandis qu’ils obéissent.'
