  text: μνημονεύετε τῆς γυναικὸς Λώτ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/032.yaml
  text: Remember Lot's wife[a][b].
translation:
  language: fr
  text: Souvenez-vous de la femme de Loth.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Allusion à Genèse 19.26, où la femme de Loth regarde en arrière pendant la destruction de Sodome.
    reason: cross_reference
lexical_decisions:
- source_word: μνημονεύετε
  choice: Souvenez-vous
  rationale: Impératif présent actif, deuxième personne du pluriel. « Souvenez-vous » exprime naturellement en français l’appel direct à garder à l’esprit cet exemple, sans surtraduire l’aspect du présent.
- source_word: τῆς γυναικὸς
  choice: de la femme
  rationale: γυνή peut signifier « femme » ou « épouse ». Avec le génitif du nom Loth, il s’agit de son épouse. La tournure française biblique et naturelle « la femme de Loth » conserve clairement ce sens relationnel.
- source_word: Λώτ
  choice: Loth
  rationale: Forme française traditionnelle et largement reconnue du nom biblique Lot.
theological_decisions:
- issue: Forme de l’avertissement et de l’allusion
  choice: « Souvenez-vous de la femme de Loth. »
  alternative: « Rappelez-vous la femme de Loth. »
  rationale: La formulation retenue préserve l’impératif bref et solennel ainsi que l’allusion directe à Genèse 19.26. « Souvenez-vous de » est idiomatique, digne et proche de la construction grecque, sans expliciter au-delà du texte la faute ou le sort de cette femme.
translation_notes:
  register: 'Français moderne, direct et solennel. La construction « la femme de Loth » est à la fois naturelle en français et formellement proche du génitif grec. Une seule note est conservée : contrairement à l’anglais, le français emploie déjà dans le texte la tournure littérale « la femme de Loth », de sorte qu’une note d’alternative lexicale serait redondante.'
