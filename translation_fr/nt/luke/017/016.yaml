  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἔπεσεν ἐπὶ πρόσωπον παρὰ τοὺς πόδας αὐτοῦ εὐχαριστῶν αὐτῷ· καὶ αὐτὸς ἦν Σαμαρίτης.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/016.yaml
  text: And he fell on his face at his feet, thanking him. And he was a Samaritan.
translation:
  language: fr
  text: Il tomba face contre terre aux pieds de Jésus, en le remerciant. Et il était Samaritain.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔπεσεν ἐπὶ πρόσωπον
  choice: tomba face contre terre
  rationale: Cette formulation naturelle en français conserve à la fois le mouvement exprimé par ἔπεσεν et la posture de prosternation indiquée par ἐπὶ πρόσωπον.
- source_word: παρὰ τοὺς πόδας αὐτοῦ
  choice: aux pieds de Jésus
  rationale: « Aux pieds de » rend idiomatiquement la position humble et révérencieuse. Le nom « Jésus » explicite le référent du pronom sans ajouter d’interprétation.
- source_word: εὐχαριστῶν αὐτῷ
  choice: et le remerciait
  rationale: 'L’imparfait français présente l’action concomitante du participe présent : il était en train de remercier Jésus en se tenant prosterné.'
- source_word: καὶ αὐτὸς ἦν Σαμαρίτης
  choice: Or, c’était un Samaritain
  rationale: « Or » signale sobrement l’information narrative remarquable, tandis que « c’était » met en relief l’identité de cet homme sans commentaire ajouté.
theological_decisions:
- issue: Mise en relief de l’identité de l’homme guéri
  choice: Or, c’était un Samaritain
  alternative: Et il était Samaritain
  rationale: La formulation retenue fait entendre l’accent porté par αὐτός et la portée surprenante de cette identité dans le récit, sans expliquer ni résoudre sa tension sociale et théologique.
translation_notes:
  register: Français moderne, courant et digne. La phrase reste vive et concrète; le référent de « ses pieds » est clarifié par « Jésus » afin d’éviter une ambiguïté pronominale peu naturelle en français.
