  source_fidelity: La posture (« tomba face contre terre ») et la localisation (« aux pieds de Jésus ») rendent bien ἔπεσεν ἐπὶ πρόσωπον παρὰ τοὺς πόδας αὐτοῦ. En revanche, « le remerciait » à l’imparfait présente le remerciement comme une action durative de second plan et ne rend pas aussi directement le participe présent εὐχαριστῶν, qui accompagne l’action principale. « en le remerciant » conserve clairement cette concomitance. « Or » ajoute une valeur adversative ou argumentative qui n’est pas portée par le simple καί.
  naturalness: « Il tomba face contre terre aux pieds de Jésus, en le remerciant » est naturel, clair et soutenu sans être archaïque. « Et il était Samaritain » est une formulation française simple qui préserve la révélation narrative sans explicitation interprétative.
