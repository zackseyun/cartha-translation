source:
  edition: SBLGNT
  text: προσέχετε ἑαυτοῖς. ἐὰν ⸀ἁμάρτῃ ὁ ἀδελφός σου ἐπιτίμησον αὐτῷ, καὶ ἐὰν μετανοήσῃ ἄφες αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/003.yaml
  text: Pay attention to yourselves[a]. If your brother sins, rebuke him, and if he repents[b], forgive him.
translation:
  language: fr
  text: Prenez garde à vous-mêmes. Si ton frère[b] pèche[a], reprends-le et, s’il se repent, pardonne-lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Certains manuscrits portent : « Si ton frère pèche contre toi, reprends-le. »'
    reason: textual_variant
  - marker: b
    text: Le mot grec rendu par « frère » est au masculin singulier et peut désigner plus largement un autre disciple.
    reason: cultural_note
lexical_decisions:
- source_word: προσέχετε ἑαυτοῖς
  choice: Veillez sur vous-mêmes
  rationale: L’impératif présent appelle à une vigilance continue. Cette formulation naturelle conserve le réflexif et laisse ouverte une portée à la fois personnelle et communautaire.
- source_word: ἁμάρτῃ
  choice: pèche
  rationale: Le texte grec fourni ne comporte aucun complément équivalant à « contre toi » ; la traduction garde donc le verbe sans en restreindre la portée.
- source_word: ὁ ἀδελφός σου
  choice: ton frère
  rationale: Cette expression rend directement le masculin singulier grec. Dans le contexte, elle peut désigner plus largement un autre disciple, ce qui est signalé en note.
- source_word: ἐπιτίμησον αὐτῷ
  choice: reprends-le
  rationale: « Reprendre » exprime une correction verbale directe et ferme, sans la connotation parfois excessivement dure de « réprimander » en français courant.
- source_word: μετανοήσῃ
  choice: se repent
  rationale: « Se repentir » conserve la dimension morale et relationnelle du changement demandé dans ce contexte.
- source_word: ἄφες αὐτῷ
  choice: pardonne-lui
  rationale: Dans ce contexte interpersonnel, « pardonner » est l’équivalent français le plus clair et naturel.
theological_decisions:
- issue: Présence de « contre toi » après « pèche »
  choice: Omission dans le texte principal
  alternative: « Si ton frère pèche contre toi, reprends-le »
  rationale: Le SBLGNT fourni lit simplement ἐὰν ἁμάρτῃ ὁ ἀδελφός σου, sans εἰς σέ ni expression équivalente. La formulation plus longue est conservée en note comme variante textuelle.
- issue: Portée du mot ἀδελφός
  choice: « ton frère » dans le texte principal
  alternative: « ton frère ou ta sœur » ou « un autre disciple »
  rationale: Le grec est au masculin singulier ; la traduction le respecte tout en indiquant en note que le terme peut avoir une portée plus large au sein de la communauté des disciples.
translation_notes:
  register: Français international moderne, digne et accessible. L’alternance entre « vous-mêmes » et « ton » reflète fidèlement le passage du pluriel au singulier dans le grec. Les deux appels de note sont placés à la fin du verset afin de préserver la fluidité, tout en restant explicitement présents dans le texte principal.
