source:
  edition: SBLGNT
  text: Τίς δὲ ἐξ ὑμῶν δοῦλον ἔχων ἀροτριῶντα ἢ ποιμαίνοντα, ὃς εἰσελθόντι ἐκ τοῦ ἀγροῦ ἐρεῖ ⸀αὐτῷ· Εὐθέως παρελθὼν ἀνάπεσε,
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/007.yaml
  text: But which of you[a], having a servant plowing or shepherding, will say to him when he has come in from the field[b], ‘Come at once and recline at the table’?
translation:
  language: fr
  text: 'Mais qui parmi vous, s’il a un esclave[a] qui laboure ou garde le troupeau, lui dira à son retour des champs : « Viens tout de suite prendre place à table[b] » ?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « serviteur ». Le grec doulos désigne ici une personne asservie, et non un ouvrier salarié.
    reason: alternative_reading
  - marker: b
    text: L’expression grecque évoque le fait de venir se mettre à table en position reclinée. Dans l’Antiquité, on prenait souvent les repas allongé à table.
    reason: cultural_note
lexical_decisions:
- source_word: δοῦλον
  choice: esclave
  rationale: Le terme désigne ici une personne asservie placée sous l’autorité d’un maître, et non un salarié. « Esclave » préserve la force sociale et rhétorique de la parabole.
- source_word: ἀροτριῶντα
  choice: qui laboure
  rationale: Le participe désigne précisément le travail de labour et se rend naturellement en français par une proposition relative.
- source_word: ποιμαίνοντα
  choice: garde le troupeau
  rationale: Le verbe signifie exercer la fonction de berger ou prendre soin d’un troupeau. Cette formulation française est naturelle sans préciser indûment l’espèce animale.
- source_word: εἰσελθόντι ἐκ τοῦ ἀγροῦ
  choice: à son retour des champs
  rationale: Cette tournure exprime naturellement la valeur temporelle du participe et le mouvement de retour après le travail agricole. Le pluriel français « des champs » est idiomatique sans modifier le référent.
- source_word: ἐρεῖ αὐτῷ
  choice: lui dira
  rationale: Le futur et le complément indirect sont rendus directement et avec concision.
- source_word: Εὐθέως
  choice: tout de suite
  rationale: Cette expression moderne et courante restitue clairement l’idée d’immédiateté.
- source_word: παρελθὼν
  choice: Viens
  rationale: Associé à l’impératif suivant, le participe introduit le déplacement vers l’endroit du repas; « Viens » en restitue naturellement la fonction.
- source_word: ἀνάπεσε
  choice: prendre place à table
  rationale: Le verbe évoque littéralement la posture allongée adoptée lors des repas antiques. « Prendre place à table » communique ici l’invitation au repas dans un français naturel, tandis qu’une note conserve le détail culturel.
theological_decisions:
- issue: Traduction de δοῦλος dans le cadre domestique de la parabole
  choice: esclave
  alternative: serviteur
  rationale: Le raisonnement repose sur l’inégalité d’autorité entre le maître et la personne asservie. « Esclave » conserve cette réalité historique et la force de l’image, sans lui ajouter une interprétation doctrinale.
translation_notes:
  register: Français international moderne, naturel et digne. La question rhétorique est conservée. « S’il a » évite la lourdeur de « ayant », et « prendre place à table » rend l’action intelligible tout en maintenant le détail historique dans la note.
