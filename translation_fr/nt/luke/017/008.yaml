source:
  edition: SBLGNT
  text: ἀλλ’ οὐχὶ ἐρεῖ αὐτῷ· Ἑτοίμασον τί δειπνήσω καὶ περιζωσάμενος διακόνει μοι ἕως φάγω καὶ πίω, καὶ μετὰ ταῦτα φάγεσαι καὶ πίεσαι σύ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/008.yaml
  text: On the contrary[a], will he not say to him, ‘Prepare my supper, and gird yourself and serve me until I have eaten and drunk[b], and after that you will eat and drink’?”
translation:
  language: fr
  text: 'Ne lui dira-t-il pas au contraire : « Prépare-moi de quoi dîner, ceins-toi[a] et sers-moi jusqu’à ce que j’aie mangé et bu[b] ; après cela, toi, tu mangeras et tu boiras » ?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ceins-toi ». Il s’agissait d’attacher ou de relever à la taille les pans d’un vêtement ample afin de pouvoir travailler.'
    reason: cultural_note
  - marker: b
    text: 'On peut aussi traduire : « jusqu’à ce que je mange et boive ». Le subjonctif passé souligne ici que le maître termine d’abord son repas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’ οὐχὶ
  choice: Ne lui dira-t-il pas au contraire
  rationale: La tournure introduit une question rhétorique contrastive qui appelle une réponse affirmative. Cette formulation française restitue à la fois l’opposition marquée par ἀλλά et l’attente portée par οὐχί.
- source_word: Ἑτοίμασον τί δειπνήσω
  choice: Prépare-moi de quoi dîner
  rationale: Cette formulation rend naturellement l’idée littérale de préparer ce dont le maître fera son repas, sans imposer une désignation trop précise de celui-ci.
- source_word: περιζωσάμενος
  choice: attache ton vêtement à la taille
  rationale: Le participe évoque l’action de relever ou d’attacher un vêtement ample à l’aide d’une ceinture afin de pouvoir travailler. La formulation conserve l’image concrète tout en restant intelligible en français moderne.
- source_word: διακόνει μοι
  choice: sers-moi
  rationale: Dans ce contexte de repas, le verbe désigne le service personnel, notamment à table. « Sers-moi » est direct et naturel, sans connotation ecclésiastique ajoutée.
- source_word: ἕως φάγω καὶ πίω
  choice: jusqu’à ce que j’aie mangé et bu
  rationale: Le subjonctif passé exprime naturellement en français l’achèvement du repas avant que l’autre personne puisse manger et boire.
- source_word: μετὰ ταῦτα
  choice: après cela
  rationale: Cette expression temporelle courante marque clairement la succession des actions.
- source_word: φάγεσαι καὶ πίεσαι σύ
  choice: toi, tu mangeras et tu boiras
  rationale: Les futurs sont rendus directement, et le pronom disjoint « toi » restitue l’emphase du σύ grec ainsi que le contraste entre les deux personnes.
theological_decisions:
- issue: Désignation du rôle social dans la parabole
  choice: Conserver les pronoms sans ajouter « serviteur » ni « esclave » dans ce verset.
  alternative: Expliciter le référent par « ce serviteur » ou « cet esclave » d’après le contexte précédent.
  rationale: Le verset grec emploie ici des pronoms et des impératifs, sans répéter δοῦλος. La dynamique entre maître et serviteur demeure claire grâce aux ordres et au service demandé, sans introduire dans ce verset un nom absent du texte.
translation_notes:
  register: Français international moderne, naturel et digne. Le discours direct conserve le ton ferme de la situation sociale, tandis que « toi, tu » rend l’emphase finale du grec. L’image culturelle de la ceinture est exprimée concrètement et expliquée en note.
