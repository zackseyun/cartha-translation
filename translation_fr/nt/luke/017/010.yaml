source:
  edition: SBLGNT
  text: οὕτως καὶ ὑμεῖς, ὅταν ποιήσητε πάντα τὰ διαταχθέντα ὑμῖν, λέγετε ὅτι Δοῦλοι ἀχρεῖοί ἐσμεν, ⸂ὃ ὠφείλομεν⸃ ποιῆσαι πεποιήκαμεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/010.yaml
  text: So also you[a], when you have done all that was commanded you, say, ‘We are unworthy servants[b]; we have done what we were obligated to do.’
translation:
  language: fr
  text: 'De même, vous aussi, quand vous aurez fait tout ce qui vous a été commandé, dites : « Nous sommes des esclaves sans mérite[a] ; nous n’avons fait que ce que nous devions faire. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des esclaves inutiles » ou « sans profit ». Dans ce contexte, l’expression souligne qu’après avoir fait ce qui leur était commandé, ils ne peuvent revendiquer aucun mérite ni aucune récompense particulière.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως καὶ ὑμεῖς
  choice: De même, vous aussi
  rationale: Cette formulation relie naturellement l’application à l’exemple précédent et conserve la force comparative de οὕτως καί.
- source_word: ὅταν ποιήσητε
  choice: quand vous aurez fait
  rationale: Le futur antérieur rend l’action envisagée comme accomplie avant l’ordre « dites ».
- source_word: πάντα τὰ διαταχθέντα ὑμῖν
  choice: tout ce qui vous a été commandé
  rationale: « Commandé » préserve l’autorité exprimée par διατάσσω, tandis que la tournure passive suit clairement la structure grecque.
- source_word: λέγετε
  choice: dites
  rationale: L’impératif présent grec est rendu par l’impératif français simple, naturel dans cette instruction.
- source_word: Δοῦλοι
  choice: esclaves
  rationale: Dans l’analogie immédiate entre maître et esclave, le statut de dépendance est saillant ; « esclaves » conserve mieux cette force que « serviteurs ».
- source_word: ἀχρεῖοί
  choice: sans mérite
  rationale: Dans ce contexte, l’expression indique qu’ils ne peuvent revendiquer aucun mérite ni avantage particulier pour avoir accompli leur obligation. Elle évite de suggérer qu’ils seraient absolument inutiles ou dépourvus de valeur.
- source_word: ὃ ὠφείλομεν ποιῆσαι πεποιήκαμεν
  choice: nous n’avons fait que ce que nous devions faire
  rationale: La tournure idiomatique française exprime clairement l’obligation portée par ὀφείλω et le caractère accompli de πεποιήκαμεν, sans ajouter l’idée d’un mérite supplémentaire.
theological_decisions:
- issue: Traduction de δοῦλοι dans l’analogie de la condition de disciple
  choice: esclaves
  alternative: serviteurs
  rationale: Le contexte met explicitement en scène un maître et son esclave. Le terme choisi préserve la dépendance et la force sociale de l’image sans atténuer le propos.
- issue: Sens de ἀχρεῖοι
  choice: sans mérite
  alternative: inutiles / bons à rien / sans profit
  rationale: Le propos porte sur l’absence de créance ou de mérite supplémentaire après l’accomplissement du devoir. « Sans mérite » rend ce sens contextuel tout en laissant en note les valeurs lexicales plus littérales.
- issue: Portée de l’obéissance accomplie
  choice: nous n’avons fait que ce que nous devions faire
  alternative: nous avons fait ce que nous étions tenus de faire
  rationale: La formulation souligne que l’obéissance ne place pas le maître en dette envers l’esclave, sans développer au-delà de l’énoncé grec une doctrine particulière du mérite.
translation_notes:
  register: Français international moderne, digne et accessible. « Esclaves » conserve la vigueur de l’analogie antique ; « sans mérite » privilégie le sens contextuel tout en signalant dans la note les équivalents plus littéraux et plus durs.
