id: LUK.17.36
reference: Luke 17:36
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: robinson-pierpont-2005-byzantine
  text: Δύο ἔσονται ἐν τῷ ἀγρῷ· εἷς παραληφθήσεται, καὶ ὁ ἕτερος ἀφεθήσεται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/036.yaml
  text: Two[a] men will be in the field; one will be taken, and the other will be left.
translation:
  language: fr
  text: 'Deux personnes[a] seront dans un champ : l’une sera prise et l’autre sera laissée.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ce verset est absent des plus anciens manuscrits grecs, notamment le Sinaïticus et le Vaticanus du IVe siècle, ainsi que des anciennes traductions coptes. Il figure toutefois dans la tradition occidentale, par exemple dans le Codex de Bèze du Ve siècle, dans la tradition majoritaire byzantine et dans la Vulgate latine. Il a probablement été ajouté par des copistes tardifs pour harmoniser ce passage avec Matthieu 24.40.
    reason: textual_critical
lexical_decisions:
- source_word: δύο
  choice: deux hommes
  rationale: Le grec dit simplement « deux », mais le masculin εἷς (« l’un ») permet d’expliciter naturellement « hommes » en français.
- source_word: παραλαμβάνω
  choice: sera pris
  rationale: Dans ce contexte eschatologique, le verbe indique qu’une personne est prise ou emmenée, par contraste direct avec celle qui est laissée ; la formule conserve l’ambiguïté sur la destination et la valeur positive ou négative de l’action.
- source_word: ἀφίημι
  choice: sera laissé
  rationale: Le verbe signifie ici laisser sur place ou derrière soi. « Sera laissé » reproduit sobrement le contraste avec « sera pris » sans ajouter « abandonné », qui serait plus interprétatif.
- source_word: ἕτερος
  choice: l’autre
  rationale: Le terme désigne le second des deux individus déjà mentionnés ; « l’autre » est la formulation française naturelle.
theological_decisions:
- issue: Sens eschatologique de « sera pris » et « sera laissé »
  choice: Ne pas préciser lequel des deux connaît le salut ou le jugement.
  alternative: Interpréter explicitement la personne prise comme sauvée, ou comme jugée.
  rationale: Le verset ne précise ni la destination de la personne prise ni le sort final de celle qui est laissée. La traduction préserve donc cette tension interprétative.
translation_notes:
  register: Français international moderne, simple et digne. Le futur passif du grec est conservé. « Dans un champ » est plus idiomatique en français que « dans le champ » lorsque aucun champ particulier n’a été préalablement identifié.
