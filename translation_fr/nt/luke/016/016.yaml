source:
  edition: SBLGNT
  text: Ὁ νόμος καὶ οἱ προφῆται ⸀μέχρι Ἰωάννου· ἀπὸ τότε ἡ βασιλεία τοῦ θεοῦ εὐαγγελίζεται καὶ πᾶς εἰς αὐτὴν βιάζεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/016.yaml
  text: The Law and the Prophets were until John; from then on the kingdom of God is being proclaimed as good news, and everyone is forcing his way into it.
translation:
  language: fr
  text: La Loi et les Prophètes ont eu cours jusqu’à Jean. Depuis lors, la bonne nouvelle du royaume de Dieu est annoncée, et chacun force son entrée.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « chacun se presse pour y entrer ». Le verbe grec peut évoquer un mouvement énergique, voire violent.'
    reason: lexical_alternative
  - marker: b
    text: Certains comprennent la dernière proposition dans un sens plus négatif, notamment à la lumière d’une parole proche en Matthieu 11.12. Ici, toutefois, le sujet grammatical est « chacun », et non « le royaume ».
    reason: alternative_reading
lexical_decisions:
- source_word: Ὁ νόμος καὶ οἱ προφῆται
  choice: La Loi et les Prophètes
  rationale: Cette formule désigne les Écritures et leur époque dans l’histoire du salut; les majuscules signalent les catégories reconnues sans réduire l’expression à des règles et à des individus.
- source_word: μέχρι Ἰωάννου
  choice: ont eu cours jusqu’à Jean
  rationale: Le grec marque une limite temporelle. « Ont eu cours » rend naturellement l’ellipse verbale sans affirmer que la Loi et les Prophètes auraient cessé d’être valables en tout sens.
- source_word: ἀπὸ τότε
  choice: Depuis lors
  rationale: Expression française concise qui marque la transition temporelle et sa continuité jusqu’au moment évoqué.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: le royaume de Dieu
  rationale: Formulation française traditionnelle et claire, qui conserve les dimensions royale, dynamique et collective de βασιλεία.
- source_word: εὐαγγελίζεται
  choice: la bonne nouvelle … est annoncée
  rationale: Le présent passif exprime une proclamation en cours; cette tournure fait entendre explicitement la notion de bonne nouvelle contenue dans le verbe grec.
- source_word: πᾶς
  choice: chacun
  rationale: Le singulier distributif grec est rendu naturellement en français et conserve la portée générale de l’énoncé.
- source_word: εἰς αὐτὴν βιάζεται
  choice: cherche à y entrer de force
  rationale: La construction avec εἰς indique un mouvement vers l’intérieur du royaume. « De force » préserve la vigueur de βιάζεται, tandis que « cherche à entrer » évite de présenter comme nécessairement achevée l’entrée de chaque personne.
theological_decisions:
- issue: Sens de βιάζεται par rapport au royaume
  choice: Le sujet est « chacun », qui cherche avec force à entrer dans le royaume.
  alternative: '« Chacun se presse pour y entrer »; lecture plus négative: des personnes usent de violence à son encontre.'
  rationale: Dans cette phrase, πᾶς est le sujet grammatical et εἰς αὐτήν indique normalement un mouvement vers le royaume. La traduction maintient la nuance de force sans transformer cette parole en doctrine du salut mérité par l’effort humain; les autres nuances plausibles sont signalées en note.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase est divisée en deux pour éviter un point-virgule lourd. « Jean » suffit dans le contexte pour Jean le Baptiseur. La formulation garde l’ellipse et la tension du grec tout en restant idiomatique.
