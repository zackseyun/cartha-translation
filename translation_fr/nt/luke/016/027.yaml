id: LUK.16.27
reference: Luke 16:27
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἶπεν δέ· Ἐρωτῶ ⸂σε οὖν⸃, πάτερ, ἵνα πέμψῃς αὐτὸν εἰς τὸν οἶκον τοῦ πατρός μου,
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/027.yaml
  text: Then he said[a], ‘I ask you then, father, that you send him to my father’s house,’
translation:
  language: fr
  text: 'Il dit alors : « Je te demande[a] donc, père, de l’envoyer chez mon père, »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Je t’en prie ». Le verbe grec peut exprimer une demande insistante, bien que « demander » en soit le sens le plus fondamental.
    reason: Alternative lexicale reflétant la force possible de ἐρωτάω dans ce contexte.
lexical_decisions:
- source_word: εἶπεν δέ
  choice: Il dit alors
  rationale: δέ est ici un connecteur léger qui fait progresser le récit. « Alors » rend naturellement cette progression en français sans donner au lien une valeur fortement adversative.
- source_word: Ἐρωτῶ
  choice: Je te demande
  rationale: ἐρωτάω signifie couramment « demander » ou « adresser une requête ». Le contexte implique une demande pressante, mais « demander » conserve le sens lexical de base sans accentuer indûment l’émotion.
- source_word: σε οὖν
  choice: te… donc
  rationale: Le pronom objet est rendu par « te », et οὖν par « donc », qui marque la reprise ou la conséquence après le refus précédent.
- source_word: πάτερ
  choice: père
  rationale: Il s’agit d’une adresse à Abraham comme ancêtre dans la parabole. La minuscule évite de suggérer qu’il s’agit ici d’un titre divin.
- source_word: ἵνα πέμψῃς αὐτόν
  choice: de l’envoyer
  rationale: Après « demander », l’infinitif précédé de « de » exprime naturellement en français le contenu de la requête portée en grec par ἵνα et le subjonctif. « L’ » renvoie à Lazare.
- source_word: εἰς τὸν οἶκον τοῦ πατρός μου
  choice: chez mon père
  rationale: Dans ce contexte, οἶκος désigne la maison ou le foyer paternel. « Chez mon père » exprime idiomatiquement en français le lieu de destination sans modifier le référent.
theological_decisions:
- issue: Sens du vocatif πάτερ dans la parabole
  choice: père
  alternative: Père
  rationale: Le riche s’adresse à Abraham en tant qu’ancêtre. La minuscule maintient cette lecture contextuelle et n’importe pas une adresse directe à Dieu.
translation_notes:
  register: Français international moderne, naturel et digne. « Chez mon père » évite la tournure plus lourde « dans la maison de mon père », tandis que « donc » conserve explicitement la progression argumentative. La ponctuation finale indique que la phrase se poursuit au verset suivant.
