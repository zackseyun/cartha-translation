id: LUK.16.18
reference: Luke 16:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Πᾶς ὁ ἀπολύων τὴν γυναῖκα αὐτοῦ καὶ γαμῶν ἑτέραν μοιχεύει, ⸀καὶ ὁ ἀπολελυμένην ἀπὸ ἀνδρὸς γαμῶν μοιχεύει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/018.yaml
  text: Everyone who divorces his wife and marries another commits adultery[b][a], and he who marries a woman divorced from her husband commits adultery.
translation:
  language: fr
  text: Quiconque divorce de sa femme et épouse une autre femme commet un adultère, et celui qui épouse une femme divorcée de son mari commet un adultère.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πᾶς ὁ
  choice: Quiconque
  rationale: La construction généralisante exprime une portée universelle; « Quiconque » est naturel et digne en français moderne.
- source_word: ἀπολύων
  choice: divorce de
  rationale: Dans ce contexte matrimonial, le verbe désigne le divorce; « divorcer de sa femme » est l’expression idiomatique française.
- source_word: τὴν γυναῖκα αὐτοῦ
  choice: sa femme
  rationale: Le contexte du mariage et du divorce impose ici le sens de « femme » au sens d’épouse.
- source_word: γαμῶν ἑτέραν
  choice: en épouse une autre
  rationale: Le pronom « en » reprend naturellement « sa femme », tandis que « une autre » conserve le caractère elliptique de ἑτέραν sans lourdeur.
- source_word: μοιχεύει
  choice: commet un adultère
  rationale: Cette formulation française courante rend clairement le verbe désignant l’adultère.
- source_word: ἀπολελυμένην ἀπὸ ἀνδρός
  choice: une femme divorcée de son mari
  rationale: Le parfait passif présente la femme dans l’état résultant du divorce. Dans ce contexte, ἀνήρ signifie « mari », et « de son mari » est la formulation française naturelle qui reste proche de ἀπό.
theological_decisions:
- issue: Portée et force de la parole de Jésus sur le divorce
  choice: Conserver la formulation universelle du verset sans ajouter d’exception.
  alternative: Introduire une exception tirée d’un autre passage ou limiter explicitement la parole à un cadre juridique particulier.
  rationale: Luc formule ici une déclaration générale sans exception exprimée. La traduction doit préserver cette tension et ne pas importer une harmonisation absente du texte.
translation_notes:
  register: Français international moderne, clair et digne. La répétition de « commet un adultère » reproduit l’insistance et le parallélisme du grec. Aucune note n’est nécessaire, car les choix lexicaux peuvent être rendus directement et naturellement en français.
