base_translation:
  language: en
  yaml_path: translation/nt/luke/016/020.yaml
  text: And a poor man named Lazarus had been laid at his gate[a], covered with sores[b],
translation:
  language: fr
  text: Or un pauvre nommé Lazare avait été déposé devant son portail[a], couvert de plaies[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avait été jeté devant son portail ». Le verbe grec peut évoquer l’action de jeter quelqu’un, ce qui soulignerait ici l’impuissance de Lazare et l’abandon dont il souffrait.
    reason: lexical_alternative
  - marker: b
    text: Ou « le corps plein de plaies ». Le participe grec indique que Lazare était atteint de plaies ulcéreuses.
    reason: lexical_alternative
lexical_decisions:
- source_word: πτωχὸς
  choice: un pauvre
  rationale: Le nom « pauvre » exprime directement la condition de dénuement sans préciser qu’il exerçait le rôle social de mendiant.
- source_word: τις
  choice: un
  rationale: L’indéfini grec introduit un nouveau personnage. En français actuel, l’article indéfini suffit, tandis que « un certain » serait plus appuyé et moins naturel.
- source_word: ὀνόματι Λάζαρος
  choice: nommé Lazare
  rationale: Cette construction au datif signifie idiomatiquement « nommé Lazare » ; le nom est rendu sous sa forme française traditionnelle.
- source_word: ἐβέβλητο
  choice: avait été déposé
  rationale: Le plus-que-parfait passif indique qu’on l’avait placé là et met en relief son impuissance. « Déposé » reste naturel sans imposer la violence possible de « jeté », signalée en note.
- source_word: πρὸς τὸν πυλῶνα αὐτοῦ
  choice: devant son portail
  rationale: Dans cette scène, πρός avec l’accusatif situe Lazare à l’entrée de la propriété du riche. « Portail » convient à l’entrée d’une demeure importante, et « son » conserve la référence contextuelle au riche.
- source_word: εἱλκωμένος
  choice: couvert de plaies
  rationale: Le participe décrit Lazare comme atteint de plaies ulcéreuses. Cette formulation claire et naturelle communique son état visible sans employer un terme médical trop technique.
