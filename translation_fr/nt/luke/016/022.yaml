id: LUK.16.22
reference: Luke 16:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐγένετο δὲ ἀποθανεῖν τὸν πτωχὸν καὶ ἀπενεχθῆναι αὐτὸν ὑπὸ τῶν ἀγγέλων εἰς τὸν κόλπον Ἀβραάμ· ἀπέθανεν δὲ καὶ ὁ πλούσιος καὶ ἐτάφη.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/022.yaml
  text: It happened that the poor man died and was carried by the angels to Abraham’s bosom[a]. And the rich man also died and was buried.
translation:
  language: fr
  text: Il arriva que le pauvre mourut et fut emporté par les anges dans le sein d’Abraham[a]. Le riche mourut lui aussi et fut enseveli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « auprès d’Abraham ». L’expression grecque signifie littéralement « dans le sein d’Abraham » et évoque la proximité, l’honneur et la communion.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο δὲ ἀποθανεῖν
  choice: Il arriva que… mourut
  rationale: La tournure impersonnelle suivie de l’infinitif marque la survenue de l’événement. « Il arriva que » en conserve la forme narrative sans ajouter un repère temporel absent du grec.
- source_word: τὸν πτωχὸν
  choice: le pauvre
  rationale: πτωχός désigne ici un homme pauvre ou démuni. « Le pauvre » est direct et n’ajoute pas l’idée explicite de mendicité.
- source_word: ἀπενεχθῆναι αὐτὸν ὑπὸ τῶν ἀγγέλων
  choice: fut emporté par les anges
  rationale: Le passif et l’agent exprimé sont maintenus. « Emporté » rend le mouvement impliqué par ἀποφέρω avec naturel en français.
- source_word: εἰς τὸν κόλπον Ἀβραάμ
  choice: dans le sein d’Abraham
  rationale: Cette formulation conserve l’image concrète de κόλπος ainsi que son sens de proximité intime et honorable, sans la réduire d’emblée à une description générale de l’au-delà.
- source_word: ἀπέθανεν δὲ καὶ ὁ πλούσιος
  choice: Le riche mourut lui aussi
  rationale: « Lui aussi » rend καί et souligne le parallèle entre la mort des deux hommes. Le δέ est porté naturellement par le passage à la seconde proposition, sans connecteur lourd.
- source_word: ἐτάφη
  choice: fut enseveli
  rationale: Le passif de θάπτω est rendu directement. « Fut enseveli » convient au registre narratif digne du passage.
theological_decisions:
- issue: Sens de εἰς τὸν κόλπον Ἀβραάμ
  choice: dans le sein d’Abraham
  alternative: auprès d’Abraham
  rationale: Le texte principal préserve la métaphore culturellement et théologiquement chargée de la proximité avec Abraham. La note donne l’équivalent idiomatique sans transformer cette image en système explicatif de l’au-delà.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe narrative reste proche du grec, tandis que « lui aussi » assure un enchaînement naturel. L’image traditionnelle du « sein d’Abraham » est conservée et éclairée par une note.
