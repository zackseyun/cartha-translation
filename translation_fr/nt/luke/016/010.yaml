id: LUK.16.10
reference: Luke 16:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ὁ πιστὸς ἐν ἐλαχίστῳ καὶ ἐν πολλῷ πιστός ἐστιν, καὶ ὁ ἐν ἐλαχίστῳ ἄδικος καὶ ἐν πολλῷ ἄδικός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/010.yaml
  text: The one who is faithful in very little is also faithful in much[b][a], and the one who is unrighteous in very little is also unrighteous in much.
translation:
  language: fr
  text: Celui qui est fidèle dans les plus petites choses[a] l’est aussi dans les grandes choses ; et celui qui est injuste[b] dans les plus petites choses l’est aussi dans les grandes choses.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans ce qui est très petit ». L’expression grecque désigne ce qui est minime ou insignifiant.
    reason: lexical_alternative
  - marker: b
    text: Ou « malhonnête ». Le terme grec a un sens plus large que la seule malhonnêteté financière, même si cette nuance convient au contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: πιστός
  choice: fidèle
  rationale: Dans ce contexte, le terme qualifie une personne fiable dans ce qui lui est confié. « Fidèle » exprime cette constance et maintient le parallélisme moral de la phrase.
- source_word: ἐν ἐλαχίστῳ
  choice: dans les plus petites choses
  rationale: La tournure grecque désigne le domaine de ce qui est minime ou de très peu d’importance. Cette formulation est naturelle en français et s’oppose clairement à « dans les grandes ».
- source_word: ἐν πολλῷ
  choice: dans les grandes
  rationale: Le neutre singulier grec exprime ici ce qui est beaucoup ou important. En français, « les grandes [choses] » reprend elliptiquement « choses » et conserve l’antithèse.
- source_word: ἄδικος
  choice: injuste
  rationale: Le mot désigne largement celui qui agit mal ou sans justice. « Injuste » évite de limiter le propos à la malhonnêteté financière, même si celle-ci appartient au contexte immédiat.
- source_word: ὁ ... πιστός / ὁ ... ἄδικος
  choice: celui qui est fidèle ... celui qui est injuste
  rationale: L’article suivi de l’adjectif a une valeur substantive et générique. « Celui qui… » rend naturellement ce singulier représentatif en français.
- source_word: καί
  choice: aussi ; et
  rationale: « Aussi » rend la valeur additive à l’intérieur de chaque affirmation, tandis que « et » relie les deux moitiés parallèles du proverbe.
theological_decisions:
- issue: Portée morale de ἄδικος dans un contexte d’intendance
  choice: injuste
  alternative: malhonnête
  rationale: La déclaration énonce un principe moral général et ne se limite pas à la gestion de l’argent. « Injuste » préserve cette portée plus large sans exclure la nuance de malhonnêteté suggérée par le contexte.
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme est conservé par la répétition de « dans les plus petites choses » et « dans les grandes », avec une ponctuation qui fait ressortir les deux volets de la maxime.
