reference: Luke 16:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἶπεν δὲ ἐν ἑαυτῷ ὁ οἰκονόμος· Τί ποιήσω ὅτι ὁ κύριός μου ἀφαιρεῖται τὴν οἰκονομίαν ἀπ’ ἐμοῦ; σκάπτειν οὐκ ἰσχύω, ἐπαιτεῖν αἰσχύνομαι·
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/003.yaml
  text: Then the manager said to himself[a], ‘What will I do, since my master is taking the management away from me? I am not strong enough to dig, and I am ashamed to beg.’
translation:
  language: fr
  text: 'L’intendant[a] se dit alors : « Que vais-je faire, puisque mon maître m’enlève l’intendance ? Je n’ai pas la force de creuser, et j’ai honte de mendier. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « gérant » et « gestion » pour « intendant » et « intendance ». Le grec emploie des mots de la même famille pour la personne et sa fonction.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκονόμος / οἰκονομία
  choice: intendant / intendance
  rationale: Ces termes désignent respectivement la personne chargée d’administrer les biens d’un autre et la fonction qui lui est confiée. « Intendant / intendance » conserve en français le lien lexical présent en grec, tout en convenant au cadre socioéconomique de la parabole.
- source_word: ἐν ἑαυτῷ
  choice: en lui-même
  rationale: L’expression indique une réflexion intérieure. « Se dit … en lui-même » restitue naturellement cette parole silencieuse sans en modifier le sens.
- source_word: Τί ποιήσω
  choice: Que vais-je faire
  rationale: Le subjonctif aoriste délibératif exprime une question sur la conduite à adopter. Cette formulation est naturelle en français moderne.
- source_word: κύριός μου
  choice: mon maître
  rationale: Dans cette parabole, κύριος désigne le supérieur humain de l’intendant. « Maître » exprime cette relation d’autorité sans suggérer ici un titre divin.
- source_word: ἀφαιρεῖται … ἀπ’ ἐμοῦ
  choice: me retire
  rationale: Le verbe exprime le retrait de la fonction confiée. Le pronom « me » rend explicitement le complément grec « de moi » dans une tournure française idiomatique.
- source_word: σκάπτειν οὐκ ἰσχύω
  choice: Je n’ai pas la force de creuser
  rationale: Avec le travail de creusement, ἰσχύω évoque particulièrement la force physique plutôt qu’une incapacité générale.
- source_word: ἐπαιτεῖν αἰσχύνομαι
  choice: j’ai honte de mendier
  rationale: ἐπαιτεῖν désigne l’action de mendier ou de demander l’aumône, et αἰσχύνομαι la honte éprouvée à cette perspective.
theological_decisions:
- issue: Sens de κύριος dans un contexte parabolique non divin
  choice: maître
  alternative: seigneur ; propriétaire
  rationale: Le référent immédiat est le riche propriétaire dont l’intendant administre les biens. « Maître » préserve son autorité personnelle sans introduire des connotations théologiques étrangères à cette occurrence.
translation_notes:
  register: Français international moderne, clair et digne. « Intendant » est légèrement plus soutenu que « gérant », mais il correspond bien à la fonction exercée dans une grande maison et permet de conserver le lien lexical avec « intendance ». Le monologue intérieur garde un rythme oral naturel.
