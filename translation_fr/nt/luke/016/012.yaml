id: LUK.16.12
reference: Luke 16:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ εἰ ἐν τῷ ἀλλοτρίῳ πιστοὶ οὐκ ἐγένεσθε, τὸ ⸀ὑμέτερον τίς ⸂δώσει ὑμῖν⸃;
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/012.yaml
  text: And if you have not been faithful with what belongs to another[c][b][a], who will give you what is your own?
translation:
  language: fr
  text: Et si vous n’avez pas été fidèles dans ce qui appartient à autrui[a], qui vous donnera ce qui est à vous[b] ?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « dans le bien d’autrui ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « ce qui vous appartient en propre ».'
    reason: lexical_alternative
  - marker: c
    text: Le contraste peut opposer la fidélité dans l’usage des richesses de ce monde, dès maintenant, à la réception ultérieure des richesses véritables ou durables; le verset lui-même ne précise pas explicitement les réalités visées.
    reason: cross_reference
lexical_decisions:
- source_word: καὶ εἰ
  choice: Et si
  rationale: Rend simplement le lien avec le verset précédent et introduit la condition.
- source_word: ἐν τῷ ἀλλοτρίῳ
  choice: dans ce qui appartient à autrui
  rationale: L’adjectif neutre substantivé désigne ce qui appartient à un autre. « Autrui » offre un contraste naturel et digne avec « ce qui est à vous ».
- source_word: πιστοὶ οὐκ ἐγένεσθε
  choice: vous n’avez pas été fidèles
  rationale: Dans ce contexte de gestion, πιστός exprime la fidélité et la fiabilité plutôt que la croyance; le passé composé rend naturellement l’aoriste dans cette condition.
- source_word: τὸ ὑμέτερον
  choice: ce qui est à vous
  rationale: Le neutre substantivé signifie littéralement ce qui est vôtre; cette formulation conserve le parallélisme possessif sans préciser le référent.
- source_word: τίς δώσει ὑμῖν
  choice: qui vous donnera
  rationale: Rend directement la question rhétorique et conserve le sens courant de δίδωμι, sans introduire l’idée plus interprétative de confier.
theological_decisions:
- issue: Nature du contraste entre « ce qui appartient à autrui » et « ce qui est à vous »
  choice: Conserver les deux référents implicites dans le texte principal.
  alternative: Préciser qu’il s’agit des richesses de ce monde par opposition aux vraies richesses, ou de la gestion terrestre par opposition à l’héritage futur.
  rationale: Le verset énonce le contraste sans en identifier explicitement les réalités. La traduction préserve donc son ambiguïté et sa tension théologique; une note signale les principales lectures suggérées par le contexte.
translation_notes:
  register: Français international moderne, clair et digne. Le pluriel « fidèles » conserve le vocabulaire moral de la gestion. « Autrui » est courant dans un registre soutenu accessible, et le parallélisme de la phrase grecque est maintenu.
