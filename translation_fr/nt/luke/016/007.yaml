  text: ἔπειτα ἑτέρῳ εἶπεν· Σὺ δὲ πόσον ὀφείλεις; ὁ δὲ εἶπεν· Ἑκατὸν κόρους σίτου· ⸀λέγει αὐτῷ· Δέξαι σου ⸂τὰ γράμματα⸃ καὶ γράψον ὀγδοήκοντα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/007.yaml
  text: Then he said to another[a], ‘And you, how much do you owe?’ He said, ‘A hundred cors of wheat.’ He says to him[b], ‘Take your bill and write eighty.’
translation:
  language: fr
  text: 'Puis il dit à un autre : « Et toi, combien dois-tu ? » Celui-ci répondit : « Cent cors[b] de blé. » Il lui dit : « Prends tes documents de dette[a] et écris quatre-vingts. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ton contrat écrit » ou « tes documents » ; le grec dit littéralement « tes écrits » (τὰ γράμματα) et désigne ici les documents écrits relatifs à la dette.
    reason: lexical_alternative
  - marker: b
    text: Le cor était une grande unité de mesure de capacité employée notamment pour les céréales.
    reason: cultural_note
lexical_decisions:
- source_word: ἔπειτα
  choice: Puis
  rationale: Marque naturellement la succession des débiteurs dans le récit.
- source_word: ἑτέρῳ
  choice: à un autre
  rationale: Désigne une autre personne que le premier débiteur, sans ajouter un nom absent du grec.
- source_word: Σὺ δὲ
  choice: Et toi
  rationale: Conserve l’insistance du pronom et la légère transition marquée par δέ dans une formulation française naturelle.
- source_word: πόσον ὀφείλεις
  choice: combien dois-tu
  rationale: Exprime directement une dette financière dans un français courant.
- source_word: Ἑκατὸν κόρους σίτου
  choice: Cent cors de blé
  rationale: Conserve le nom de l’unité antique précise plutôt que de le remplacer par une mesure générique.
- source_word: λέγει αὐτῷ
  choice: Il lui dit
  rationale: Formulation française naturelle; la forme « dit » peut servir au présent comme au passé simple, ce qui évite de surmarquer le changement grec au présent historique.
- source_word: Δέξαι
  choice: Prends
  rationale: Impératif naturel dans ce contexte où le débiteur doit reprendre le document.
- source_word: σου τὰ γράμματα
  choice: ton document de dette
  rationale: Le pluriel grec signifie littéralement « tes écrits », mais désigne ici le document écrit constatant la dette; le singulier fonctionnel est plus clair en français.
- source_word: γράψον ὀγδοήκοντα
  choice: écris quatre-vingts
  rationale: Reste proche de l’ordre grec et indique que le montant doit être inscrit de nouveau.
