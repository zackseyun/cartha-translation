id: LUK.16.1
reference: Luke 16:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἔλεγεν δὲ καὶ πρὸς τοὺς ⸀μαθητάς· Ἄνθρωπός τις ἦν πλούσιος ὃς εἶχεν οἰκονόμον, καὶ οὗτος διεβλήθη αὐτῷ ὡς διασκορπίζων τὰ ὑπάρχοντα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/001.yaml
  text: He was also saying to the disciples[a], “There was a certain rich man who had a manager[b], and this man was accused to him of squandering his possessions.”
translation:
  language: fr
  text: 'Il disait aussi à ses disciples : « Un homme riche avait un intendant[a]. Celui-ci fut accusé auprès de lui de dilapider ses biens[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « administrateur » ou « gérant ». L’intendant était chargé de gérer une maison, un domaine ou des biens pour le compte de leur propriétaire.
    reason: lexical_alternative
  - marker: b
    text: Ou « ses biens en les gaspillant ». L’expression rapporte le contenu de l’accusation sans indiquer ici qu’elle était prouvée.
    reason: ambiguity
lexical_decisions:
- source_word: Ἔλεγεν δὲ καὶ πρὸς τοὺς μαθητάς
  choice: Il disait aussi à ses disciples
  rationale: L’imparfait « disait » conserve l’aspect duratif ou introductif de ἔλεγεν. « Aussi » rend καί, tandis que δέ est naturellement porté par la transition du récit. Le possessif « ses » explicite en français idiomatique que ce sont les disciples de Jésus, sans modifier le référent contextuel.
- source_word: Ἄνθρωπός τις ἦν πλούσιος
  choice: Un homme riche avait
  rationale: La tournure française introduit naturellement le personnage indéfini de la parabole. La construction avec « avait » permet de rendre sans lourdeur la relation exprimée par ὃς εἶχεν.
- source_word: οἰκονόμον
  choice: intendant
  rationale: « Intendant » désigne clairement une personne chargée d’administrer les biens ou le domaine d’un autre et convient mieux au cadre ancien que le terme très général « gestionnaire ».
- source_word: οὗτος
  choice: Celui-ci
  rationale: Le démonstratif reprend l’intendant avec une légère insistance et évite toute ambiguïté avec l’homme riche.
- source_word: διεβλήθη αὐτῷ
  choice: fut accusé auprès de lui
  rationale: Cette formulation conserve à la fois le caractère accusatoire de διαβάλλω et le destinataire αὐτῷ. Elle ne présente pas l’accusation comme déjà prouvée.
- source_word: ὡς διασκορπίζων
  choice: de dilapider
  rationale: Dans ce contexte patrimonial, « dilapider » rend naturellement l’idée de disperser ou gaspiller des ressources confiées, tout en présentant cela comme le contenu de l’accusation.
- source_word: τὰ ὑπάρχοντα αὐτοῦ
  choice: ses biens
  rationale: « Ses biens » est l’équivalent français courant et suffisamment large pour les possessions de l’homme riche.
theological_decisions:
- issue: Statut de l’accusation portée contre l’intendant
  choice: La traduction dit qu’il « fut accusé » sans affirmer sa culpabilité.
  alternative: « On rapporta qu’il dilapidait » ou « il fut dénoncé comme dilapidant ».
  rationale: Le verbe διαβάλλω peut désigner une accusation, une dénonciation ou un rapport défavorable; le verset ne dit pas encore que l’allégation a été établie.
translation_notes:
  register: Français international moderne, sobre et digne. « Intendant » garde la couleur du cadre social ancien tout en restant compréhensible; les notes explicitent les principales possibilités lexicales et l’incertitude inhérente à l’accusation.
