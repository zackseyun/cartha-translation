source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς· Ὑμεῖς ἐστε οἱ δικαιοῦντες ἑαυτοὺς ἐνώπιον τῶν ἀνθρώπων, ὁ δὲ θεὸς γινώσκει τὰς καρδίας ὑμῶν· ὅτι τὸ ἐν ἀνθρώποις ὑψηλὸν βδέλυγμα ἐνώπιον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/015.yaml
  text: And he said to them[a], “You are the ones who justify yourselves before men, but God knows your hearts[c][b]. For what is exalted among men is detestable before God.”
translation:
  language: fr
  text: 'Et il leur dit : « C’est vous qui vous justifiez vous-mêmes aux yeux des gens[a], mais Dieu connaît vos cœurs. En effet, ce qui est élevé parmi les gens[b] est une abomination aux yeux de Dieu[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « devant les êtres humains » ; le terme grec désigne ici les humains en général.'
    reason: Précision sur le sens générique et sur l’image spatiale de l’expression grecque.
  - marker: b
    text: 'Ou : « ce qui est hautement estimé parmi les gens ».'
    reason: Cette formulation explicite l’idée d’estime sociale possible, tandis que le texte principal conserve l’image de hauteur et l’ambiguïté du grec.
  - marker: c
    text: 'Ou : « est détestable devant Dieu ».'
    reason: Autre rendu naturel de βδέλυγμα et de ἐνώπιον.
lexical_decisions:
- source_word: δικαιοῦντες ἑαυτούς
  choice: vous justifiez vous-mêmes
  rationale: Cette formulation conserve le verbe « justifier » et la valeur réfléchie, sans réduire le propos au simple fait de paraître juste.
- source_word: ἐνώπιον τῶν ἀνθρώπων
  choice: aux yeux des gens
  rationale: « Aux yeux de » exprime naturellement l’idée d’évaluation publique portée par ἐνώπιον, tandis que « les gens » rend ici le pluriel générique ἀνθρώπων en français moderne.
- source_word: γινώσκει τὰς καρδίας ὑμῶν
  choice: connaît vos cœurs
  rationale: Le rendu direct préserve le sens biblique du cœur comme siège des pensées, des intentions et des motivations.
- source_word: τὸ ἐν ἀνθρώποις ὑψηλόν
  choice: ce qui est hautement estimé parmi les gens
  rationale: Dans ce contexte, ὑψηλόν désigne ce qui jouit d’un rang élevé ou d’une grande estime dans l’évaluation humaine. Cette formulation française reste naturelle tout en gardant l’image de hauteur par « hautement ».
- source_word: βδέλυγμα
  choice: une abomination
  rationale: Le nom fort βδέλυγμα désigne quelque chose de profondément odieux à Dieu. « Une abomination » en conserve la force et la forme nominale.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: aux yeux de Dieu
  rationale: La répétition de « aux yeux de » maintient le contraste explicite entre l’évaluation humaine et celle de Dieu.
- source_word: Ὑμεῖς ἐστε οἱ δικαιοῦντες
  choice: C’est vous qui vous justifiez
  rationale: La construction clivée « C’est vous qui » restitue l’insistance du pronom Ὑμεῖς et de la construction grecque avec article et participe.
theological_decisions:
- issue: Portée de δικαιοῦντες ἑαυτούς
  choice: vous justifiez vous-mêmes
  alternative: vous faites passer pour justes
  rationale: Le choix principal préserve le lien lexical avec « justifier » ainsi que la tension entre revendication humaine de justice et connaissance divine des cœurs, sans préciser indûment s’il s’agit seulement d’apparence sociale.
- issue: Sens de τὸ ἐν ἀνθρώποις ὑψηλόν
  choice: ce qui est hautement estimé parmi les gens
  alternative: ce qui est élevé parmi les êtres humains
  rationale: L’expression peut évoquer à la fois le prestige, le rang et l’estime sociale. Le texte principal privilégie un français intelligible, tandis que la note conserve l’image grecque plus littérale de hauteur.
- issue: Force de βδέλυγμα
  choice: une abomination
  alternative: détestable
  rationale: Le substantif français maintient la vigueur du jugement divin sans en préciser davantage la nature cultuelle ou morale.
translation_notes:
  register: Français international moderne, digne et accessible. La reprise « vous… vous-mêmes » est volontairement emphatique. « Aux yeux de » est employé dans les deux membres afin de faire ressortir le contraste entre jugement humain et jugement divin.
