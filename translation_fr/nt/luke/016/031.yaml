id: LUK.16.31
reference: Luke 16:31
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἶπεν δὲ αὐτῷ· Εἰ Μωϋσέως καὶ τῶν προφητῶν οὐκ ἀκούουσιν, οὐδ’ ἐάν τις ἐκ νεκρῶν ἀναστῇ πεισθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/031.yaml
  text: But he said to him[a], ‘If they do not listen to Moses and the Prophets[c][b], neither will they be persuaded if someone rises from the dead.’
translation:
  language: fr
  text: 'Mais il lui répondit : « S’ils n’écoutent pas Moïse et les Prophètes[a], ils ne se laisseront pas non plus convaincre[c], même si quelqu’un ressuscite d’entre les morts[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Écouter » peut aussi avoir ici le sens d’« entendre » ou de « prêter attention » ; le verbe grec peut inclure à la fois l’audition et une attention qui appelle une réponse.
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « se relève d’entre les morts ».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « seront persuadés » ou « seront convaincus ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν δὲ αὐτῷ
  choice: Mais il lui répondit
  rationale: « Mais » conserve la légère opposition marquée par δέ. Dans ce dialogue, « répondit » est plus naturel en français que le littéral « dit », sans ajouter de contenu.
- source_word: Μωϋσέως καὶ τῶν προφητῶν
  choice: Moïse et les Prophètes
  rationale: L’expression désigne le témoignage scripturaire donné à Israël. La majuscule à « Prophètes » signale le corpus reconnu tout en conservant la formulation originale plutôt qu’en la remplaçant par « les Écritures ».
- source_word: οὐκ ἀκούουσιν
  choice: ils n’écoutent pas
  rationale: ἀκούω peut exprimer le fait d’entendre, d’écouter ou de prêter attention. « N’écoutent pas » maintient cette amplitude sans imposer l’idée plus forte d’obéissance.
- source_word: οὐδ’ ἐάν
  choice: ils ne… pas non plus…, même si
  rationale: Cette tournure française transmet le renforcement négatif de οὐδ’ et rend naturellement la condition introduite par ἐάν.
- source_word: τις
  choice: quelqu’un
  rationale: Le pronom indéfini singulier est rendu directement et naturellement.
- source_word: ἐκ νεκρῶν ἀναστῇ
  choice: ressuscite d’entre les morts
  rationale: « Ressusciter » exprime idiomatiquement ἀνίστημι dans ce contexte, tandis que « d’entre les morts » conserve la valeur de ἐκ νεκρῶν.
- source_word: πεισθήσονται
  choice: se laisseront convaincre
  rationale: Le futur passif de πείθω indique qu’ils ne seront pas persuadés ou convaincus. Cette formulation française est naturelle et n’impose ni la foi salvatrice ni la repentance comme sens lexical explicite.
theological_decisions:
- issue: Sens de « Moïse et les Prophètes »
  choice: Référence au témoignage autorisé des Écritures déjà donné à Israël
  alternative: Référence étroite à deux catégories de personnes ou à deux figures représentatives seulement
  rationale: Dans le contexte, la formule fonctionne comme une désignation scripturaire. La traduction conserve toutefois l’expression elle-même et ne l’explicite pas en « les Écritures ».
- issue: Portée de πεισθήσονται
  choice: Être persuadés ou convaincus au sens général
  alternative: Croire au sens théologique précis, ou se repentir
  rationale: Le verbe grec ne précise pas à lui seul une conversion, une foi salvatrice ou une repentance. « Se laisser convaincre » préserve cette retenue.
translation_notes:
  register: Français international moderne, naturel et digne. La structure conditionnelle reste ferme et rhétorique. « Se laisseront convaincre » est idiomatique tout en respectant le passif grec. Tous les marqueurs de notes figurent dans le texte.
