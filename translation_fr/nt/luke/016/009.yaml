id: LUK.16.9
reference: Luke 16:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἐγὼ ὑμῖν λέγω, ⸂ἑαυτοῖς ποιήσατε⸃ φίλους ἐκ τοῦ μαμωνᾶ τῆς ἀδικίας, ἵνα ὅταν ⸀ἐκλίπῃ δέξωνται ὑμᾶς εἰς τὰς αἰωνίους σκηνάς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/009.yaml
  text: And I tell you[a], make friends for yourselves by means of unrighteous wealth, so that when it fails[c][b], they may welcome you into the eternal dwellings.
translation:
  language: fr
  text: 'Et moi, je vous le dis : faites-vous des amis au moyen des richesses injustes[a], afin que, lorsqu’elles viendront à manquer[b], ils vous accueillent dans les demeures éternelles[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à partir du Mammon de l’injustice ». « Mammon » est une transcription traditionnelle du terme grec désignant l’argent ou les richesses.
    reason: lexical_alternative
  - marker: b
    text: 'Ou « lorsque vous viendrez à manquer », compris par certains au sens de « lorsque vous mourrez »; autre traduction possible : « lorsqu’elles seront épuisées ». Le grec permet plusieurs compréhensions dans ce contexte.'
    reason: alternative_reading
  - marker: c
    text: 'Littéralement : « dans les tentes éternelles ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑαυτοῖς ποιήσατε φίλους
  choice: faites-vous des amis
  rationale: Cette tournure française naturelle rend à la fois l’impératif et le datif réfléchi, sans lourdeur.
- source_word: ἐκ τοῦ μαμωνᾶ τῆς ἀδικίας
  choice: au moyen des richesses injustes
  rationale: « Au moyen de » exprime la valeur instrumentale de ἐκ dans ce contexte. « Richesses injustes » conserve la portée large de ἀδικία sans limiter le sens à des biens nécessairement acquis par fraude.
- source_word: μαμωνᾶ
  choice: richesses
  rationale: Le terme grec désigne l’argent ou les biens matériels. « Richesses » est clair en français moderne, tandis que « Mammon » risquerait d’être opaque ou de forcer une personnification.
- source_word: τῆς ἀδικίας
  choice: injustes
  rationale: Ce choix conserve l’idée d’injustice propre à ἀδικία et demeure plus large que « malhonnêtes », qui suggérerait surtout une acquisition frauduleuse.
- source_word: ἵνα ὅταν ἐκλίπῃ
  choice: afin que, lorsqu’elles viendront à manquer
  rationale: Le verbe signifie ici « faire défaut, venir à manquer ». Le sujet le plus naturel est « les richesses », malgré l’absence d’un sujet explicitement exprimé dans la forme verbale grecque.
- source_word: δέξωνται ὑμᾶς
  choice: ils vous accueillent
  rationale: « Accueillir » rend la réception hospitalière suggérée par δέχομαι et s’accorde bien avec l’entrée dans des demeures.
- source_word: εἰς τὰς αἰωνίους σκηνάς
  choice: dans les demeures éternelles
  rationale: « Demeures » exprime naturellement la fonction des σκηναί dans ce contexte; l’image plus littérale des « tentes » est signalée en note.
theological_decisions:
- issue: Sens des « richesses injustes »
  choice: Des richesses appartenant au monde présent marqué par l’injustice, sans affirmer qu’elles ont nécessairement été acquises frauduleusement
  alternative: Des biens acquis malhonnêtement; ou Mammon personnifié comme maître rival
  rationale: La formulation française garde la tension du grec et ne réduit pas l’expression aux seuls gains frauduleux. Elle n’impose pas non plus une personnification, même si le contexte plus large permet cette association.
- issue: Sujet de ἐκλίπῃ
  choice: Les richesses viennent à manquer
  alternative: Vous venez à manquer, c’est-à-dire vous mourez; ou les ressources de ce monde cessent de manière générale
  rationale: Le référent contextuel le plus proche et le plus naturel est la richesse. Comme le grec permet une autre compréhension, celle-ci est conservée en note.
- issue: Identité du sujet de δέξωνται (« ils »)
  choice: Identité laissée implicite
  alternative: Les amis acquis par l’usage généreux des richesses; les pauvres ou le peuple de Dieu; des êtres célestes
  rationale: Le grec ne précise pas qui accueille. Ajouter une identité dans le texte trancherait une ambiguïté réelle.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase conserve l’adresse solennelle de Jésus (« Et moi, je vous le dis »), tout en évitant l’archaïsme. Les ambiguïtés relatives à la disparition des richesses et à l’identité de ceux qui accueillent ne sont pas résolues au-delà de ce que permet le grec.
