id: LUK.16.19
reference: Luke 16:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἄνθρωπος δέ τις ἦν πλούσιος, καὶ ἐνεδιδύσκετο πορφύραν καὶ βύσσον εὐφραινόμενος καθ’ ἡμέραν λαμπρῶς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/019.yaml
  text: There was a certain rich man[a], and he used to dress in purple and fine linen, feasting splendidly every day.
translation:
  language: fr
  text: Il y avait un homme riche qui s’habillait de pourpre et de fin lin, et qui, chaque jour, festoyait avec faste.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « vivait chaque jour dans les plaisirs et le luxe ». Le participe grec peut exprimer le fait de se réjouir ou de faire la fête, tandis que l’adverbe souligne l’éclat et le luxe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄνθρωπος δέ τις
  choice: Il y avait un homme
  rationale: Cette tournure introduit un personnage indéfini dans le récit. « Il y avait un homme » est naturel en français et rend la valeur de τις sans le tour plus lourd « un certain homme » ; la transition marquée par δέ n’exige pas ici de connecteur explicite.
- source_word: πλούσιος
  choice: riche
  rationale: L’adjectif désigne directement la richesse matérielle ; « riche » est l’équivalent français le plus simple et le plus exact.
- source_word: ἐνεδιδύσκετο
  choice: s’habillait
  rationale: L’imparfait grec présente une habitude. L’imparfait français « s’habillait » en conserve naturellement la valeur répétée.
- source_word: πορφύραν
  choice: de pourpre
  rationale: Le nom désigne par métonymie des vêtements teints en pourpre, marque de luxe. Après « s’habillait », le sens vestimentaire est clair.
- source_word: βύσσον
  choice: de fin lin
  rationale: βύσσος désigne un lin de grande qualité. « Fin lin » exprime à la fois la matière et son caractère précieux.
- source_word: εὐφραινόμενος
  choice: festoyait
  rationale: Dans ce contexte de richesse ostentatoire, le participe évoque les réjouissances et probablement les repas de fête. « Festoyait » est idiomatique tout en gardant cette nuance contextuelle.
- source_word: καθ’ ἡμέραν
  choice: chaque jour
  rationale: Cette expression idiomatique indique une pratique quotidienne et régulière.
- source_word: λαμπρῶς
  choice: avec faste
  rationale: L’adverbe évoque l’éclat, la magnificence et, dans ce contexte, le luxe. « Avec faste » restitue cette idée dans un français naturel.
theological_decisions: []
translation_notes:
  register: Français moderne, narratif et digne. La formulation évite le littéralisme peu naturel « un certain homme » et fait ressortir, sans l’amplifier, le caractère habituel et luxueux du mode de vie décrit.
