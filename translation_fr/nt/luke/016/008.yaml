id: LUK.16.8
reference: Luke 16:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἐπῄνεσεν ὁ κύριος τὸν οἰκονόμον τῆς ἀδικίας ὅτι φρονίμως ἐποίησεν· ὅτι οἱ υἱοὶ τοῦ αἰῶνος τούτου φρονιμώτεροι ὑπὲρ τοὺς υἱοὺς τοῦ φωτὸς εἰς τὴν γενεὰν τὴν ἑαυτῶν εἰσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/008.yaml
  text: And the master praised the unrighteous manager because he had acted shrewdly[c][b][a]. For the sons of this age are more shrewd in dealing with their own generation than the sons of light are.
translation:
  language: fr
  text: Et le maître[a] loua le gérant injuste, parce qu’il avait agi habilement. En effet, les fils de cette époque sont plus habiles que les fils de la lumière à l’égard de leur propre génération.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le Seigneur ». Dans le contexte immédiat, « le maître » désigne probablement le maître du gérant dans la parabole.'
    reason: alternative_reading
  - marker: b
    text: 'Littéralement : « sont plus habiles que les fils de la lumière à l’égard de leur propre génération ». L’expression grecque est difficile ; elle peut évoquer leur habileté dans leurs rapports avec les gens de leur propre milieu ou de leur propre époque.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ κύριος
  choice: le maître
  rationale: Dans le cadre immédiat de la parabole, le terme désigne le plus naturellement le maître du gérant. Cette traduction n’exclut pas grammaticalement « le Seigneur », signalé en note.
- source_word: οἰκονόμον
  choice: le gérant
  rationale: « Gérant » désigne clairement en français actuel celui qui administre les biens d’un autre, sans l’archaïsme possible d’« intendant ».
- source_word: τῆς ἀδικίας
  choice: injuste
  rationale: Le génitif caractérise le gérant par l’injustice sans préciser davantage la forme de sa faute. « Malhonnête » serait plus étroit.
- source_word: φρονίμως / φρονιμώτεροι
  choice: habilement / plus habiles
  rationale: Ces termes expriment l’intelligence pratique et l’efficacité stratégique, sans donner à l’éloge une portée morale positive comme pourrait le faire « sagement ».
- source_word: οἱ υἱοὶ τοῦ αἰῶνος τούτου
  choice: les fils du monde présent
  rationale: La formulation conserve l’image sémitique des « fils » ainsi que son parallélisme avec « les fils de la lumière »; « monde présent » rend ici l’ère actuelle.
- source_word: οἱ υἱοὶ τοῦ φωτός
  choice: les fils de la lumière
  rationale: Cette expression biblique conserve l’image du texte grec et le contraste formel avec « les fils du monde présent ».
- source_word: εἰς τὴν γενεὰν τὴν ἑαυτῶν
  choice: à l’égard de leur propre génération
  rationale: Cette formulation reste proche de la construction grecque difficile et en préserve une part d’ambiguïté, plutôt que de la réduire sans avertissement à « dans leurs rapports avec leurs semblables ».
theological_decisions:
- issue: Identité de ὁ κύριος dans la première proposition
  choice: le maître à l’intérieur de la parabole
  alternative: le Seigneur, désignant Jésus ou Dieu
  rationale: Le contexte narratif immédiat favorise le maître du gérant. La variante « le Seigneur » demeure possible et est conservée en note.
- issue: Évaluation morale de la conduite du gérant
  choice: éloge de son habileté pratique, non de son injustice
  alternative: approbation morale de sa conduite ou de sa malhonnêteté
  rationale: Le texte maintient délibérément la tension entre la qualification négative du gérant et l’éloge de son habileté. « Habilement » évite de transformer cette perspicacité en sagesse morale.
translation_notes:
  register: Français international actuel, naturel et digne. La syntaxe conserve le parallélisme entre « fils du monde présent » et « fils de la lumière ». Le vocabulaire distingue nettement l’habileté stratégique de l’approbation morale.
