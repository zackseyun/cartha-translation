  verdict: revise
  source_fidelity: 'Le sens central est fidèlement rendu : le maître de la parabole loue le gérant qualifié par l’injustice pour son habileté, sans que l’injustice elle-même soit approuvée. La comparaison finale et sa difficulté syntaxique sont conservées. Toutefois, « monde présent » risque d’assimiler αἰών à κόσμος (« monde »), alors que le grec désigne plus précisément l’époque ou l’âge actuel.'
  naturalness: Le français est clair et de registre moderne. « Les fils de cette époque » demeure une formulation biblique volontairement imagée, mais elle est plus exacte que « les fils du monde présent » tout en restant compréhensible. La note explique utilement la construction finale difficile.
  terminology: « Maître », « gérant injuste », « habilement » et « fils de la lumière » sont appropriés. « Cette époque » rend αἰών sans effacer le contraste entre l’âge présent et la lumière.
