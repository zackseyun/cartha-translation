id: LUK.16.23
reference: Luke 16:23
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἐν τῷ ᾅδῃ ἐπάρας τοὺς ὀφθαλμοὺς αὐτοῦ, ὑπάρχων ἐν βασάνοις, ⸀ὁρᾷ Ἀβραὰμ ἀπὸ μακρόθεν καὶ Λάζαρον ἐν τοῖς κόλποις αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/023.yaml
  text: And in Hades[a], lifting up his eyes, being in torment[b], he sees Abraham far away and Lazarus in his bosom.
translation:
  language: fr
  text: Dans l’Hadès[a], il lève les yeux alors qu’il est en proie aux tourments. Il voit au loin Abraham, et Lazare, tout contre lui[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans le séjour des morts ». Le grec emploie Hadès, terme distinct de « géhenne ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « dans son sein » ; expression traditionnellement rendue par « dans le sein d’Abraham ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾅδῃ
  choice: dans l’Hadès
  rationale: La translittération préserve le terme grec et sa distinction avec la géhenne, sans assimiler d’emblée ce lieu au châtiment final.
- source_word: ἐπάρας τοὺς ὀφθαλμοὺς αὐτοῦ
  choice: il lève les yeux
  rationale: Expression française naturelle qui conserve l’image et la valeur circonstancielle du participe grec.
- source_word: ὑπάρχων ἐν βασάνοις
  choice: alors qu’il est en proie aux tourments
  rationale: Cette formulation exprime clairement la circonstance concomitante et rend le pluriel βασάνοις sans atténuer l’intensité de la souffrance.
- source_word: ὁρᾷ
  choice: Il voit
  rationale: Le présent narratif grec est maintenu afin de conserver la vivacité de la scène.
- source_word: ἀπὸ μακρόθεν
  choice: au loin
  rationale: Formulation concise et idiomatique qui souligne la distance séparant les personnages.
- source_word: ἐν τοῖς κόλποις αὐτοῦ
  choice: tout contre lui
  rationale: L’expression rend naturellement en français la proximité intime et protectrice évoquée par κόλπος, sans imposer l’image anatomique aujourd’hui peu transparente de « sein ».
theological_decisions:
- issue: Sens de ᾅδης dans un passage associé à l’état des morts et au jugement
  choice: l’Hadès
  alternative: le séjour des morts ; l’enfer
  rationale: « Hadès » maintient la distinction lexicale avec la géhenne et évite de trancher dans la traduction la question du rapport entre cette scène et le jugement final.
- issue: Image de Lazare dans les κόλποι d’Abraham
  choice: tout contre lui
  alternative: dans le sein d’Abraham ; auprès de lui
  rationale: Le choix principal communique la proximité privilégiée indiquée par l’expression grecque, tandis que la note conserve la formulation traditionnelle et plus littérale.
translation_notes:
  register: Français international moderne, digne et accessible. Le présent narratif est conservé. La ponctuation répartit la longue phrase grecque en deux phrases françaises pour en faciliter la lecture sans modifier les rapports logiques.
