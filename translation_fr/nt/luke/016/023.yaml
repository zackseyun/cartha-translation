    rationale: La distinction lexicale entre Hadès et géhenne est certaine; une affirmation supplémentaire sur leur référent doctrinal précis risque de résoudre une question interprétative au-delà du texte.
  revised_text: Dans l’Hadès[a], il lève les yeux alors qu’il est en proie aux tourments. Il voit au loin Abraham, et Lazare, tout contre lui[b].
