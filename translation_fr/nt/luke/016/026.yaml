id: LUK.16.26
reference: Luke 16:26
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ⸀ἐν πᾶσι τούτοις μεταξὺ ἡμῶν καὶ ὑμῶν χάσμα μέγα ἐστήρικται, ὅπως οἱ θέλοντες διαβῆναι ἔνθεν πρὸς ὑμᾶς μὴ δύνωνται, ⸀μηδὲ ἐκεῖθεν πρὸς ἡμᾶς διαπερῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/026.yaml
  text: And besides all these things[a], between us and you a great chasm has been fixed, so that those wanting to cross over from here to you cannot, nor can they cross over from there to us.
translation:
  language: fr
  text: En plus de tout cela[a], un grand abîme a été établi entre nous et vous, de sorte que ceux qui veulent passer d’ici vers vous ne le peuvent pas, et qu’on ne peut pas non plus passer de là-bas vers nous.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « outre tout cela ». Littéralement : « dans toutes ces choses » ; l’expression grecque introduit ici une considération supplémentaire.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν πᾶσι τούτοις
  choice: En plus de tout cela
  rationale: Rend naturellement en français la valeur discursive de la locution, qui ajoute une considération décisive à ce qui précède, tout en signalant en note sa forme plus littérale.
- source_word: μεταξὺ ἡμῶν καὶ ὑμῶν
  choice: entre nous et vous
  rationale: Reproduit directement la relation spatiale entre les deux groupes; le français indique clairement le pluriel de ὑμῶν par le contexte.
- source_word: χάσμα μέγα
  choice: un grand abîme
  rationale: « Abîme » exprime une séparation profonde et infranchissable dans un registre courant et digne; « grand » conserve μέγα sans amplification.
- source_word: ἐστήρικται
  choice: a été fermement établi
  rationale: Le parfait passif décrit une réalité mise en place et demeurant stable; « fermement » restitue la force de στηρίζω et l’état durable résultant.
- source_word: ὅπως
  choice: de sorte que
  rationale: Introduit naturellement la conséquence ou finalité de la séparation sans imposer une explication doctrinale supplémentaire.
- source_word: οἱ θέλοντες
  choice: ceux qui veulent
  rationale: Rend simplement et exactement le participe substantivé, en conservant l’idée de volonté.
- source_word: διαβῆναι ἔνθεν πρὸς ὑμᾶς
  choice: passer d’ici vers vous
  rationale: Conserve le point de vue déictique du locuteur et le mouvement d’un côté vers l’autre.
- source_word: μὴ δύνωνται
  choice: ne le peuvent pas
  rationale: Exprime l’incapacité réelle plutôt qu’une simple interdiction.
- source_word: μηδὲ ἐκεῖθεν πρὸς ἡμᾶς διαπερῶσιν
  choice: et que ceux qui sont là-bas ne puissent pas non plus traverser vers nous
  rationale: Rend explicite en français le sujet sous-entendu du second verbe, maintient le contraste entre « ici » et « là-bas » et conserve le parallélisme des deux impossibilités.
theological_decisions:
- issue: Nature de la séparation entre les deux domaines dans la parabole
  choice: Présenter l’abîme comme fermement établi et infranchissable.
  alternative: Préciser qu’il s’agit soit d’un élément topographique littéral de l’au-delà, soit d’une image purement figurée.
  rationale: Le verset affirme la stabilité de la séparation et l’impossibilité de la franchir, mais il ne définit pas davantage sa nature; la traduction conserve donc cette tension sans systématisation doctrinale.
- issue: Valeur de ὅπως
  choice: Employer « de sorte que », compatible avec une nuance de résultat et, dans le contexte, de finalité.
  alternative: Employer « afin que », qui marquerait plus nettement une intention.
  rationale: La formulation choisie préserve la relation forte entre l’abîme établi et l’impossibilité de traverser, sans accentuer au-delà du texte l’identité ou l’intention de celui qui l’a établi.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe reste accessible, tandis que « fermement établi » conserve la force du parfait passif grec. Le second sujet implicite est explicité pour éviter en français toute ambiguïté sur ceux qui voudraient traverser depuis l’autre côté.
