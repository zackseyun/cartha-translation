id: LUK.16.6
reference: Luke 16:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν· Ἑκατὸν βάτους ἐλαίου· ⸂ὁ δὲ⸃ εἶπεν αὐτῷ· Δέξαι σου ⸂τὰ γράμματα⸃ καὶ καθίσας ταχέως γράψον πεντήκοντα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/006.yaml
  text: He said[a], ‘A hundred baths of olive oil.’ Then he said to him, ‘Take your bill, sit down quickly[b], and write fifty.’
translation:
  language: fr
  text: 'Il répondit : « Cent baths[a] d’huile d’olive. » L’intendant lui dit : « Prends ton document de dette[b], assieds-toi vite et écris cinquante. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le bath était une ancienne unité de capacité pour les liquides. Le grec dit littéralement : « cent baths d’huile d’olive ».'
    reason: cultural_note
  - marker: b
    text: 'Ou « tes documents » ou « ton contrat écrit »; littéralement : « tes écrits ». Dans ce contexte, il s’agit du document où la dette était consignée.'
    reason: lexical_alternative
lexical_decisions:
- source_word: βάτους
  choice: baths
  rationale: Le terme grec désigne une unité antique précise de capacité pour les liquides. La translittération conserve ce détail concret; une note en explique le sens au lecteur moderne.
- source_word: ἐλαίου
  choice: huile d’olive
  rationale: Dans ce contexte, ἔλαιον désigne naturellement l’huile d’olive; cette précision est plus claire que le simple mot « huile ».
- source_word: Δέξαι
  choice: Prends
  rationale: L’impératif invite le débiteur à prendre en main son document; « Prends » est direct et idiomatique.
- source_word: τὰ γράμματα
  choice: ton document de dette
  rationale: Le pluriel grec signifie littéralement « écrits » ou « documents », mais le contexte indique le document constatant la dette. Le singulier collectif est naturel en français sans effacer la portée commerciale.
- source_word: καθίσας
  choice: assieds-toi
  rationale: Le participe exprime ici une action accompagnant l’ordre principal; deux impératifs coordonnés rendent naturellement la séquence en français.
- source_word: ταχέως
  choice: vite
  rationale: « Vite » transmet directement l’idée de rapidité dans cet ordre oral.
- source_word: γράψον
  choice: écris
  rationale: Le verbe demande d’inscrire le nouveau montant sur le document; le contexte suffit sans explicitation supplémentaire.
- source_word: πεντήκοντα
  choice: cinquante
  rationale: Traduction directe du nombre, sans ajout interprétatif.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Le dialogue reste vif. « Document de dette » est plus transparent que « billet », qui pourrait évoquer un billet de banque, et moins technique que « reconnaissance de dette ». Tous les marqueurs de note figurent dans le texte.
