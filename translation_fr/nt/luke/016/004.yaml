id: LUK.16.4
reference: Luke 16:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἔγνων τί ποιήσω, ἵνα ὅταν μετασταθῶ ⸀ἐκ τῆς οἰκονομίας δέξωνταί με εἰς τοὺς οἴκους ⸀ἑαυτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/004.yaml
  text: I know what I will do[a], so that when I am removed from the management, they may receive me into their homes.
translation:
  language: fr
  text: Je sais ce que je vais faire pour que, lorsque je serai relevé de mes fonctions de gestionnaire, ils m’accueillent chez eux.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔγνων
  choice: Je sais
  rationale: 'L’aoriste exprime ici l’aboutissement soudain d’une réflexion : le gestionnaire vient de trouver la conduite à suivre. Le présent français « Je sais » rend naturellement cette prise de décision.'
- source_word: τί ποιήσω
  choice: ce que je vais faire
  rationale: Le subjonctif délibératif porte sur l’action envisagée. « Ce que je vais faire » convient au contexte, où le personnage a désormais arrêté son plan.
- source_word: ἵνα ὅταν
  choice: pour que, lorsque
  rationale: 'Cette combinaison associe un but à une circonstance future : il agit afin d’obtenir un certain résultat lorsque son renvoi aura lieu.'
- source_word: μετασταθῶ
  choice: je serai relevé
  rationale: Le passif de μεθίστημι indique ici qu’il sera écarté de sa charge. « Relevé de mes fonctions » est une expression française naturelle qui conserve l’idée de destitution sans préciser davantage ses modalités.
- source_word: ἐκ τῆς οἰκονομίας
  choice: de mes fonctions de gestionnaire
  rationale: οἰκονομία désigne ici la charge ou la responsabilité d’administrer les biens d’une maison. Cette formulation est claire en français moderne et évite le sens contemporain trompeur d’« économie ».
- source_word: δέξωνταί με
  choice: ils m’accueillent
  rationale: Dans ce contexte d’hospitalité, δέχομαι signifie recevoir ou accueillir. « Accueillent » rend idiomatiquement le fait de prendre quelqu’un chez soi.
- source_word: εἰς τοὺς οἴκους ἑαυτῶν
  choice: chez eux
  rationale: La tournure française « chez eux » exprime naturellement l’entrée dans leurs propres maisons et restitue la valeur du réfléchi ἑαυτῶν sans lourdeur.
theological_decisions: []
translation_notes:
  register: Français moderne, courant et digne. La phrase conserve le raisonnement intérieur du gestionnaire ainsi que le rapport de but et de circonstance future. Aucun marqueur de note n’est nécessaire, car la variante lexicale anglaise fournie ne correspond pas à une note attachée au bon segment et la traduction française peut exprimer clairement le sens dans le corps du texte.
