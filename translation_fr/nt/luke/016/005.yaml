id: LUK.16.5
reference: Luke 16:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ προσκαλεσάμενος ἕνα ἕκαστον τῶν χρεοφειλετῶν τοῦ κυρίου ἑαυτοῦ ἔλεγεν τῷ πρώτῳ· Πόσον ὀφείλεις τῷ κυρίῳ μου;
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/005.yaml
  text: And after summoning each one of his master's debtors[a], he was saying to the first, 'How much do you owe my master?'
translation:
  language: fr
  text: 'Puis, après avoir fait venir chacun des débiteurs de son maître[a], il demanda au premier : « Combien dois-tu à mon maître ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot grec κύριος, souvent traduit par « Seigneur », désigne ici le supérieur humain du gérant ; « maître » convient donc mieux au contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: il fit venir
  rationale: Le participe aoriste moyen exprime une action préalable par laquelle le gérant appelle les débiteurs auprès de lui. « Il fit venir » est naturel en français et conserve cette idée.
- source_word: ἕνα ἕκαστον
  choice: un à un tous ceux
  rationale: La tournure grecque a une forte valeur distributive. « Un à un » la rend clairement sans alourdir la phrase.
- source_word: χρεοφειλετῶν
  choice: ceux qui avaient une dette
  rationale: Cette formulation courante et précise désigne les débiteurs dans le contexte économique de la parabole; elle évite le caractère parfois technique de « débiteurs ».
- source_word: τοῦ κυρίου ἑαυτοῦ
  choice: envers son maître
  rationale: Le génitif désigne ici les débiteurs de son propre maître. En français, la relation économique se formule naturellement par « avoir une dette envers ».
- source_word: ἔλεγεν
  choice: Il demanda
  rationale: L’imparfait grec plante la scène et peut suggérer une action répétée auprès de chaque débiteur. Le français passe naturellement au verbe de parole au passé simple pour la première question rapportée, sans affirmer explicitement une répétition.
- source_word: τῷ πρώτῳ
  choice: au premier
  rationale: Rendu direct et idiomatique de l’adjectif ordinal substantivé au datif.
- source_word: Πόσον ὀφείλεις
  choice: Combien dois-tu
  rationale: Dans ce contexte financier, cette question est la formulation française la plus directe et naturelle.
- source_word: κύριος
  choice: maître
  rationale: Le terme désigne le supérieur humain du gérant dans la parabole, et non le Seigneur comme titre divin.
theological_decisions:
- issue: Traduction de κύριος dans un contexte domestique et économique parabolique
  choice: maître
  alternative: Seigneur
  rationale: Le référent immédiat est le supérieur humain du gérant. « Maître » exprime la relation sociale sans introduire à tort un titre divin, tout en conservant la tension narrative propre à la parabole.
translation_notes:
  register: Français moderne, international et digne. La narration reste fluide; « un à un » explicite la valeur distributive de ἕνα ἕκαστον, et le tutoiement correspond au singulier grec ainsi qu’à la relation sociale de la scène.
