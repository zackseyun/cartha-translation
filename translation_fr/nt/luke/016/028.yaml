id: LUK.16.28
reference: Luke 16:28
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἔχω γὰρ πέντε ἀδελφούς, ὅπως διαμαρτύρηται αὐτοῖς, ἵνα μὴ καὶ αὐτοὶ ἔλθωσιν εἰς τὸν τόπον τοῦτον τῆς βασάνου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/028.yaml
  text: for I have five brothers[a], so that he may solemnly warn them, lest they too come to this place of torment.
translation:
  language: fr
  text: car j’ai cinq frères. Qu’il les avertisse solennellement[a], afin qu’eux aussi ne viennent pas dans ce lieu de tourment.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qu’il leur rende un témoignage solennel » ou « qu’il les avertisse avec insistance ». Le verbe grec peut exprimer un témoignage pressant ou un avertissement solennel.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔχω γὰρ
  choice: car j’ai
  rationale: γάρ marque ici l’explication de la demande précédente. « Car j’ai » conserve ce lien avec naturel et dignité.
- source_word: πέντε ἀδελφούς
  choice: cinq frères
  rationale: Le masculin pluriel désigne ici cinq frères, et non un groupe mixte de frères et sœurs.
- source_word: ὅπως διαμαρτύρηται αὐτοῖς
  choice: Qu’il les avertisse solennellement
  rationale: ὅπως exprime le but de la demande, rendu naturellement en français par une proposition injonctive. διαμαρτύρομαι peut désigner un témoignage insistant ou un avertissement solennel; le contexte appelle ici l’idée d’avertir, tout en conservant la gravité du verbe.
- source_word: ἵνα μὴ καὶ αὐτοὶ ἔλθωσιν
  choice: afin qu’eux aussi ne viennent pas
  rationale: ἵνα μή exprime le but négatif, tandis que καὶ αὐτοί souligne que les frères pourraient, eux aussi, connaître le même sort.
- source_word: εἰς τὸν τόπον τοῦτον τῆς βασάνου
  choice: dans ce lieu de tourment
  rationale: εἰς indique l’entrée ou le mouvement vers ce lieu. βάσανος évoque une souffrance intense; « tourment » en conserve la force sans ajouter de précision doctrinale absente du verset.
theological_decisions:
- issue: Description du lieu dans l’au-delà évoqué par l’homme riche
  choice: ce lieu de tourment
  alternative: ce lieu de souffrance / ce lieu d’angoisse
  rationale: La formulation décrit le lieu par le tourment qui y est éprouvé, sans développer une doctrine plus complète de l’au-delà. « Tourment » préserve l’intensité de βάσανος et les limites de l’énoncé.
translation_notes:
  register: Français international actuel, clair et digne. La ponctuation en deux phrases évite une accumulation lourde de propositions finales tout en maintenant le lien explicatif avec le verset précédent. Le pronom renforcé « eux aussi » conserve l’insistance de καὶ αὐτοί.
