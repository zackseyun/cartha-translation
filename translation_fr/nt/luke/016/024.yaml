id: LUK.16.24
reference: Luke 16:24
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ αὐτὸς φωνήσας εἶπεν· Πάτερ Ἀβραάμ, ἐλέησόν με καὶ πέμψον Λάζαρον ἵνα βάψῃ τὸ ἄκρον τοῦ δακτύλου αὐτοῦ ὕδατος καὶ καταψύξῃ τὴν γλῶσσάν μου, ὅτι ὀδυνῶμαι ἐν τῇ φλογὶ ταύτῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/024.yaml
  text: And he cried out and said[a], ‘Father Abraham, have mercy on me, and send Lazarus so that he may dip the tip of his finger in water and cool my tongue, because I am in agony in this flame.’
translation:
  language: fr
  text: 'Alors il s’écria : « Père Abraham, aie pitié de moi ! Envoie Lazare tremper le bout de son doigt dans l’eau pour me rafraîchir la langue, car je souffre terriblement dans cette flamme.[a] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « car je suis tourmenté dans cette flamme ». Le verbe grec peut désigner une souffrance ou un tourment intense.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνήσας
  choice: il s’écria
  rationale: Le participe aoriste introduit un appel pressant prononcé à haute voix. « Il s’écria » exprime naturellement cette intensité en français.
- source_word: ἐλέησόν με
  choice: aie pitié de moi
  rationale: Cette formule directe et idiomatique rend l’appel à la compassion sans ajouter de nuance confessionnelle.
- source_word: πέμψον
  choice: envoie
  rationale: Impératif simple qui correspond directement au sens du grec.
- source_word: βάψῃ τὸ ἄκρον τοῦ δακτύλου αὐτοῦ ὕδατος
  choice: tremper le bout de son doigt dans l’eau
  rationale: « Tremper » rend l’action brève de βάπτω, tandis que « le bout de son doigt » préserve l’image concrète du grec.
- source_word: καταψύξῃ τὴν γλῶσσάν μου
  choice: pour me rafraîchir la langue
  rationale: « Rafraîchir » exprime ici l’effet concret du refroidissement recherché et convient mieux que le peu naturel « refroidir ma langue ».
- source_word: ὀδυνῶμαι
  choice: je souffre terriblement
  rationale: Le verbe indique une douleur ou une détresse aiguë. Cette formulation française en restitue l’intensité sans présupposer l’action d’un agent qui tourmente.
- source_word: ἐν τῇ φλογὶ ταύτῃ
  choice: dans cette flamme
  rationale: « Flamme » correspond précisément à φλόξ et conserve l’image singulière et saisissante du texte.
- source_word: Πάτερ Ἀβραάμ
  choice: Père Abraham
  rationale: L’apostrophe est conservée directement et exprime le recours à Abraham comme ancêtre.
theological_decisions:
- issue: Expression de la souffrance de l’homme riche
  choice: car je souffre terriblement dans cette flamme
  alternative: car je suis tourmenté dans cette flamme
  rationale: Le grec décrit une souffrance intense, mais ne précise pas ici qu’un agent inflige le tourment. La traduction choisie préserve l’intensité tout en évitant de résoudre cette ambiguïté.
translation_notes:
  register: Français international moderne, naturel et digne. Les impératifs et l’exclamation rendent l’urgence de l’appel sans dramatisation excessive. Le marqueur [a] est placé immédiatement après la proposition concernée.
