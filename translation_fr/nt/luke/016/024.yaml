  terminology: « Père Abraham » respecte l’apostrophe ancestrale du texte. « Lazare », « flamme », « pitié » et « souffre terriblement » conviennent au registre et ne surchargent pas le texte de formulations doctrinales. La note signale adéquatement « tourmenté » comme possibilité lexicale sans la présenter comme imposée.
