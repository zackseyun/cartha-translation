  text: καὶ φωνήσας αὐτὸν εἶπεν αὐτῷ· Τί τοῦτο ἀκούω περὶ σοῦ; ἀπόδος τὸν λόγον τῆς οἰκονομίας σου, οὐ γὰρ ⸀δύνῃ ἔτι οἰκονομεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/002.yaml
  text: And after calling him[a], he said to him, “What is this that I hear about you? Give an account of your stewardship[b], for you are no longer able to manage.”
translation:
  language: fr
  text: 'Il le fit appeler et lui dit : « Qu’est-ce que j’entends dire à ton sujet ? Rends compte de ta gestion[a], car tu ne peux plus exercer la fonction d’intendant[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Présente le compte de ta gestion ».
    reason: lexical_alternative
  - marker: b
    text: Ou « continuer à gérer ».
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνήσας αὐτόν
  choice: Il le fit appeler
  rationale: Le participe aoriste exprime ici une action antérieure au verbe principal. « Il le fit appeler » est naturel en français et convient à la convocation d’un intendant par son maître.
- source_word: Τί τοῦτο ἀκούω περὶ σοῦ;
  choice: Qu’est-ce que j’entends dire à ton sujet ?
  rationale: Cette formulation conserve la force de la question grecque et rend naturellement περὶ σοῦ, sans préciser la nature des accusations au-delà du texte.
- source_word: ἀπόδος τὸν λόγον
  choice: Rends compte
  rationale: Dans ce contexte administratif, λόγος désigne le compte ou bilan qu’un responsable doit présenter. L’expression française « rendre compte » restitue idiomatiquement ἀπόδος τὸν λόγον.
- source_word: τῆς οἰκονομίας σου
  choice: de ta gestion
  rationale: οἰκονομία désigne ici la responsabilité d’administrer les biens d’un autre. « Gestion » est clair en français moderne et évite le sens principalement moral que peut prendre « intendance » hors contexte.
- source_word: οὐ γὰρ δύνῃ ἔτι οἰκονομεῖν
  choice: car tu ne peux plus exercer la fonction d’intendant
  rationale: La formulation exprime la cessation de la capacité ou de l’autorisation d’exercer cette responsabilité. Elle conserve le lien entre le verbe οἰκονομεῖν et la fonction d’intendant, tout en restant naturelle.
