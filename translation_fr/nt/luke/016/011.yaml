source:
  edition: SBLGNT
  text: εἰ οὖν ἐν τῷ ἀδίκῳ μαμωνᾷ πιστοὶ οὐκ ἐγένεσθε, τὸ ἀληθινὸν τίς ὑμῖν πιστεύσει;
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/011.yaml
  text: If[a], then, you have not been faithful with unrighteous wealth[b], who will entrust the true riches to you?
translation:
  language: fr
  text: Si donc vous n’avez pas été fidèles dans l’usage des richesses injustes[a], qui vous confiera les vraies richesses[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « le mammon injuste ». « Mammon » désigne les richesses ou les biens matériels.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « ce qui est véritable » ; le contexte suggère ici les vraies richesses, par contraste avec les richesses injustes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀδίκῳ
  choice: injustes
  rationale: ἄδικος signifie normalement « injuste » ou « contraire à la justice ». Ce choix conserve la coloration morale du grec sans réduire l’expression à des biens nécessairement acquis par fraude.
- source_word: μαμωνᾷ
  choice: richesses
  rationale: μαμωνᾶς désigne les biens ou la richesse. « Richesses » est naturel en français moderne et plus large que « argent ».
- source_word: ἐν τῷ ἀδίκῳ μαμωνᾷ
  choice: dans la gestion des richesses injustes
  rationale: Le grec dit littéralement « dans le mammon injuste ». L’ajout contextuel de « la gestion » rend idiomatiquement le domaine où la fidélité se manifeste et reprend le thème de l’intendance, sans faire de la richesse elle-même un simple instrument.
- source_word: πιστοὶ
  choice: fidèles
  rationale: Dans ce contexte d’intendance, πιστός décrit des personnes fiables dans l’usage de ce qui leur est confié. « Fidèles » conserve également le vocabulaire récurrent du passage.
- source_word: οὐκ ἐγένεσθε
  choice: vous n’avez pas été
  rationale: Avec un adjectif attribut, γίνομαι peut exprimer le fait de se montrer ou d’être. Le passé composé convient naturellement à la condition formulée ici.
- source_word: τὸ ἀληθινὸν
  choice: les vraies richesses
  rationale: L’adjectif neutre substantivé signifie littéralement « ce qui est véritable ». Le nom implicite est explicité par « richesses » afin de rendre clairement en français le contraste avec μαμωνᾶς, tout en signalant cette explicitation dans une note.
- source_word: πιστεύσει
  choice: confiera
  rationale: Avec un complément de personne au datif et un objet à l’accusatif, πιστεύω signifie « confier quelque chose à quelqu’un », et non « croire ».
theological_decisions:
- issue: Sens de τὸ ἀληθινὸν en contraste avec les richesses injustes
  choice: les vraies richesses
  alternative: « ce qui est véritable »
  rationale: Le grec laisse le nom sous-entendu. Le contexte suggère fortement une réalité de valeur authentique opposée aux richesses présentes, mais la note préserve la formulation plus ouverte du texte source.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve la structure conditionnelle et le contraste rhétorique du grec. « Dans la gestion de » clarifie idiomatiquement le cadre d’intendance, tandis que les notes maintiennent visibles les formulations plus littérales et l’ambiguïté du substantif implicite.
