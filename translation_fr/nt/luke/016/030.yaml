  timestamp: '2026-07-14T10:54:23Z'
review_pass:
  verdict: revise
  source_fidelity: La proposition conserve bien la négation, l’adresse à Abraham, la condition éventuelle et le déplacement vers les destinataires. Toutefois, « en revenant » ajoute l’idée d’un retour, qui n’est pas exprimée par πορευθῇ, et « changeront de vie » est une paraphrase moins précise de μετανοήσουσιν, dont le sens de repentance doit être conservé.
  naturalness: « Mais il répondit » et « père Abraham » sont naturels dans un registre biblique moderne. La reprise de l’adversatif par « Si, au contraire » est compréhensible, mais « mais si » restitue plus directement la coordination grecque. La note actuelle propose en outre une formulation française peu naturelle (« va les trouver d’entre les morts ») sans bien isoler l’alternative.
  terminology: « Se repentiront » est le terme français courant et précis pour μετανοήσουσιν dans ce contexte; il ne réduit pas la réponse à un changement intellectuel. « D’entre les morts » rend adéquatement ἀπὸ νεκρῶν sans imposer d’explication doctrinale.
  issues:
  - severity: medium
    issue: « en revenant d’entre les morts » ajoute une notion de retour.
    rationale: ἀπὸ νεκρῶν πορευθῇ indique qu’une personne va vers eux depuis les morts; le verbe grec ne dit pas explicitement « revenir ».
  - severity: medium
    issue: « ils changeront de vie » paraphrase μετανοήσουσιν.
    rationale: L’expression communique une conséquence morale possible, mais ne rend pas aussi directement le verbe de repentance et peut suggérer un changement de comportement sans la dimension de repentir.
  - severity: low
    issue: L’ancre de note est placée à la fin de toute la citation et la note est maladroite.
    rationale: La note concerne précisément ἀπὸ νεκρῶν; elle doit être attachée à « d’entre les morts » et présenter l’alternative sans une pseudo-littéralité confuse.
  revised_text: 'Mais il répondit : « Non, père Abraham, mais si quelqu’un va les trouver d’entre les morts[a], ils se repentiront. »'
  revised_footnotes:
