source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν· Οὐχί, πάτερ Ἀβραάμ, ἀλλ’ ἐάν τις ἀπὸ νεκρῶν πορευθῇ πρὸς αὐτοὺς μετανοήσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/030.yaml
  text: But he said[a], ‘No, father Abraham, but if someone goes to them from among the dead, they will change their thinking.’
translation:
  language: fr
  text: 'Mais il répondit : « Non, père Abraham, mais si quelqu’un va les trouver d’entre les morts[a], ils se repentiront. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou simplement : « des morts ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐχί
  choice: Non
  rationale: Réponse négative appuyée qui contredit directement l’affirmation précédente; « Non » est naturel en dialogue, et le point d’exclamation en restitue la vigueur.
- source_word: πάτερ Ἀβραάμ
  choice: père Abraham
  rationale: Le vocatif exprime l’appel d’un descendant à son ancêtre; la minuscule convient à une relation plutôt qu’à un titre officiel.
- source_word: ἀλλ’ ἐάν
  choice: Si, au contraire
  rationale: 'Cette tournure française marque clairement la correction contrastive: le personnage rejette la proposition précédente et avance une autre condition.'
- source_word: τις
  choice: quelqu’un
  rationale: Rend naturellement l’indéfini singulier.
- source_word: ἀπὸ νεκρῶν
  choice: en revenant d’entre les morts
  rationale: « D’entre les morts » rend le pluriel sans suggérer nécessairement une formule technique; « en revenant » explicite en français naturel la provenance associée au déplacement vers les frères.
- source_word: πορευθῇ πρὸς αὐτοὺς
  choice: va les trouver
  rationale: Rend le mouvement vers des personnes de façon idiomatique, tout en conservant la perspective du verbe grec « aller ».
- source_word: μετανοήσουσιν
  choice: ils changeront de vie
  rationale: Dans ce contexte lucanien, le verbe désigne une réorientation morale et spirituelle, et non une simple modification d’opinion; cette expression reste compréhensible au lecteur moderne.
theological_decisions:
- issue: Portée de μετανοήσουσιν
  choice: ils changeront de vie
  alternative: ils se repentiront; ils changeront d’avis
  rationale: « Changer de vie » exprime la conversion morale et spirituelle visée dans le contexte, sans réduire le terme à une opération intellectuelle. « Se repentir » serait plus formel et traditionnel, mais moins immédiatement transparent pour certains lecteurs.
- issue: Sens de ἀπὸ νεκρῶν
  choice: en revenant d’entre les morts
  alternative: d’entre les morts; de chez les morts
  rationale: La formulation conserve l’idée d’une personne issue du domaine ou du groupe des morts sans préciser le mécanisme envisagé ni imposer une lecture doctrinale plus étroite.
translation_notes:
  register: Français international moderne, digne et oral. Le contraste est formulé par « Si, au contraire » afin d’éviter le lourd « mais si » après une négation. La note conserve l’ambiguïté concise de l’expression grecque.
