revisions:
- from: 'Mais il répondit : « Non, père Abraham ! Si, au contraire, quelqu’un va les trouver en revenant d’entre les morts, ils changeront de vie. »[a]'
  to: 'Mais il répondit : « Non, père Abraham, mais si quelqu’un va les trouver d’entre les morts[a], ils se repentiront. »'
  rationale: La révision restitue directement l’opposition ἀλλ’ ἐάν par « mais si », supprime l’ajout interprétatif « en revenant », et rend μετανοήσουσιν par « se repentiront », terme moderne, clair et sémantiquement exact dans le contexte lucanien. La note est rattachée à l’expression qu’elle éclaire et conserve l’alternative française plus concise.
