id: LUK.16.29
reference: Luke 16:29
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: λέγει ⸀δὲ Ἀβραάμ· Ἔχουσι Μωϋσέα καὶ τοὺς προφήτας· ἀκουσάτωσαν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/029.yaml
  text: But Abraham said[a], ‘They have Moses and the Prophets[b]; let them listen to them.’
translation:
  language: fr
  text: 'Mais Abraham dit : « Ils ont Moïse et les Prophètes[a] ; qu’ils les écoutent[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Moïse et les Prophètes » désigne le témoignage des Écritures associé à Moïse et aux livres prophétiques.
    reason: cross_reference
  - marker: b
    text: 'Ou, plus littéralement : « qu’ils les entendent ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει δὲ
  choice: Mais Abraham dit
  rationale: Le présent historique λέγει est conservé par un présent de narration, naturel en français biblique moderne. δέ marque ici une réponse légèrement contrastive, rendue par « Mais ».
- source_word: Ἔχουσι
  choice: Ils ont
  rationale: Le présent indique qu’ils disposent déjà de ce témoignage ; « ils ont » est direct et naturel.
- source_word: Μωϋσέα καὶ τοὺς προφήτας
  choice: Moïse et les Prophètes
  rationale: 'La formulation concise conserve la métonymie grecque : Moïse et les écrits prophétiques représentent le témoignage des Écritures, sans expliciter cette interprétation dans le corps du texte.'
- source_word: ἀκουσάτωσαν
  choice: qu’ils les écoutent
  rationale: Ce subjonctif à valeur injonctive rend naturellement l’impératif grec à la troisième personne et exprime l’idée de prêter attention, plutôt que la simple perception auditive.
- source_word: αὐτῶν
  choice: les
  rationale: Avec « écouter », le français moderne emploie un complément direct. Le pronom renvoie à « Moïse et les Prophètes », c’est-à-dire à leur témoignage.
theological_decisions:
- issue: Référent de « Moïse et les Prophètes »
  choice: Maintenir la formule comme métonymie du témoignage scripturaire déjà accessible aux frères.
  alternative: 'Développer dans le texte : « les écrits de Moïse et des Prophètes », ou comprendre seulement les personnages historiques.'
  rationale: L’usage juif et lucanien permet d’y reconnaître les Écritures, mais la traduction conserve l’expression littérale et sa tension, tandis que la note en éclaire le référent.
translation_notes:
  register: Français international moderne, clair et digne. Le présent narratif donne de la vivacité sans altérer la valeur du grec. La majuscule à « Prophètes » signale ici un ensemble reconnu d’écrits scripturaires.
