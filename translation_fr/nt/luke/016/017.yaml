id: LUK.16.17
reference: Luke 16:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Εὐκοπώτερον δέ ἐστιν τὸν οὐρανὸν καὶ τὴν γῆν παρελθεῖν ἢ τοῦ νόμου μίαν κεραίαν πεσεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/017.yaml
  text: But it is easier for heaven and earth to pass away than for one stroke of a letter of the Law to fall[a].
translation:
  language: fr
  text: Mais il est plus facile pour le ciel et la terre de disparaître que pour un seul petit trait d’une lettre de la Loi de tomber[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « un seul trait minuscule » : il s’agit d’un petit trait qui permet de distinguer une lettre d’une autre.'
    reason: Alternative lexicale et explication de l’image graphique.
lexical_decisions:
- source_word: Εὐκοπώτερον
  choice: il est plus facile
  rationale: Rend naturellement le comparatif grec et conserve la force de la comparaison.
- source_word: δέ
  choice: Mais
  rationale: Marque ici une légère opposition avec le contexte précédent.
- source_word: τὸν οὐρανὸν καὶ τὴν γῆν
  choice: le ciel et la terre
  rationale: Conserve le mérisme biblique qui désigne l’ensemble de l’ordre créé.
- source_word: παρελθεῖν
  choice: disparaissent
  rationale: Dans ce contexte, le verbe évoque la disparition du ciel et de la terre; cette formulation est plus naturelle en français que « passent » tout en gardant le sens.
- source_word: τοῦ νόμου
  choice: de la Loi
  rationale: La majuscule signale qu’il s’agit de la Loi scripturaire, et non de la loi en général.
- source_word: μίαν κεραίαν
  choice: un seul petit trait d’une lettre
  rationale: κεραία désigne un minuscule trait graphique; la formulation est claire pour le lecteur moderne sans recourir au terme ancien « iota » ou à un jargon typographique.
- source_word: πεσεῖν
  choice: voir tomber
  rationale: Conserve l’image littérale de la chute; la tournure « que de voir tomber » donne une syntaxe française naturelle sans expliciter davantage la portée de cette chute.
theological_decisions:
- issue: Référent de νόμος
  choice: la Loi en tant que révélation scripturaire
  alternative: la loi au sens général
  rationale: Le contexte lucanien et la mention du plus petit détail écrit orientent vers la Loi scripturaire. La majuscule le signale sans préciser artificiellement son étendue canonique.
- issue: Portée de πεσεῖν
  choice: tomber
  alternative: perdre sa validité / disparaître
  rationale: Le grec garde une image concise et potentiellement riche. La traduction la préserve au lieu de trancher entre disparition matérielle, non-accomplissement et perte de validité.
- issue: Nature de κεραία
  choice: petit trait d’une lettre
  alternative: iota / empattement / signe minuscule
  rationale: L’accent porte sur le détail écrit le plus infime de la Loi. Cette formulation moderne transmet l’image sans identifier le trait à une caractéristique typographique trop précise.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve le contraste, l’expression biblique « le ciel et la terre » et l’image de quelque chose qui « tombe », tout en évitant les archaïsmes.
