  text: καὶ ἐπιθυμῶν χορτασθῆναι ⸀ἀπὸ τῶν πιπτόντων ἀπὸ τῆς τραπέζης τοῦ πλουσίου· ἀλλὰ καὶ οἱ κύνες ἐρχόμενοι ⸀ἐπέλειχον τὰ ἕλκη αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/021.yaml
  text: and longing to be fed from what fell from the rich man's table[a]. But even the dogs came and licked his sores.
translation:
  language: fr
  text: Et il désirait être rassasié de ce qui tombait de la table du riche[a]. Mais même les chiens venaient lécher ses plaies.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « des miettes qui tombaient de la table du riche ». Le grec dit littéralement « de ce qui tombait » ; le mot « miettes » est déduit du contexte du repas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιθυμῶν
  choice: il désirait
  rationale: Le participe présent exprime un désir persistant. L’imparfait français restitue naturellement cette durée sans exagérer l’intensité.
- source_word: χορτασθῆναι
  choice: se rassasier
  rationale: Dans ce contexte alimentaire, le verbe signifie recevoir assez de nourriture pour être rassasié. La tournure pronominale est idiomatique en français et conserve l’idée de satiété.
- source_word: ἀπὸ τῶν πιπτόντων
  choice: de ce qui tombait
  rationale: Le participe substantivé désigne littéralement « ce qui tombait ». Cette formulation préserve le caractère non précisé du grec au lieu d’introduire « miettes » dans le texte principal.
- source_word: τῆς τραπέζης τοῦ πλουσίου
  choice: de la table du riche
  rationale: « Table » est le sens courant de τράπεζα ici, et l’adjectif substantivé ὁ πλούσιος renvoie au riche déjà présenté dans le récit.
- source_word: ἀλλὰ καὶ
  choice: Mais même
  rationale: Cette expression rend à la fois le contraste introduit par ἀλλά et la nuance intensive ou surprenante de καί.
- source_word: οἱ κύνες
  choice: les chiens
  rationale: Traduction directe du pluriel, sans adoucissement ni précision absente du contexte.
- source_word: ἐρχόμενοι ἐπέλειχον
  choice: venaient lécher
  rationale: La construction française rend naturellement le participe de mouvement avec l’imparfait du verbe principal et préserve le caractère répété ou continu de l’action.
- source_word: τὰ ἕλκη αὐτοῦ
  choice: ses plaies
  rationale: ἕλκη désigne des lésions ulcéreuses ou des plaies ouvertes. « Plaies » est précis, courant et moins clinique qu’« ulcères ».
