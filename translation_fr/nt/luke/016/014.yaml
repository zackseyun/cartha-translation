id: LUK.16.14
reference: Luke 16:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἤκουον δὲ ταῦτα ⸀πάντα οἱ Φαρισαῖοι φιλάργυροι ὑπάρχοντες, καὶ ἐξεμυκτήριζον αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/014.yaml
  text: The Pharisees[a], who were lovers of money, were hearing all these things and were ridiculing him.
translation:
  language: fr
  text: Les pharisiens, qui aimaient l’argent, entendaient tout cela et se moquaient de lui.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le tournaient en dérision ». Le verbe grec exprime une moquerie ouverte et méprisante.'
    reason: alternative lexicale
lexical_decisions:
- source_word: Ἤκουον
  choice: entendaient
  rationale: L’imparfait grec présente l’action comme en cours dans la scène. L’imparfait français « entendaient » en rend naturellement l’aspect sans suggérer nécessairement une écoute favorable.
- source_word: δὲ
  choice: non exprimé séparément
  rationale: Ici, δέ assure une transition narrative légère. En français moderne, l’enchaînement est naturel sans connecteur explicite ; « mais » marquerait un contraste trop fort.
- source_word: ταῦτα πάντα
  choice: tout cela
  rationale: Cette formulation française naturelle reprend l’ensemble de l’enseignement qui précède et rend à la fois le démonstratif et l’idée de totalité.
- source_word: οἱ Φαρισαῖοι
  choice: les pharisiens
  rationale: Désignation française courante de ce groupe juif dans les Évangiles.
- source_word: φιλάργυροι ὑπάρχοντες
  choice: qui aimaient l’argent
  rationale: La relative décrit leur disposition durable et traduit directement l’idée d’amour de l’argent, sans l’élargir au jugement plus général « cupides ».
- source_word: ἐξεμυκτήριζον
  choice: se moquaient de lui
  rationale: L’imparfait restitue l’action en cours ou répétée, tandis que « se moquaient » exprime clairement la dérision méprisante dans un français courant.
- source_word: αὐτόν
  choice: de lui
  rationale: Le pronom renvoie à Jésus dans le contexte et se construit naturellement avec « se moquer de ».
theological_decisions:
- issue: Caractérisation des pharisiens par φιλάργυροι
  choice: qui aimaient l’argent
  alternative: qui étaient cupides
  rationale: Le grec désigne explicitement l’amour de l’argent. La traduction retenue préserve ce lien précis avec l’enseignement précédent sur les richesses sans lui substituer une qualification morale plus large.
translation_notes:
  register: Français international moderne, simple et digne. Les imparfaits rendent les deux actions duratives du récit. La note est placée après le verbe qu’elle précise.
