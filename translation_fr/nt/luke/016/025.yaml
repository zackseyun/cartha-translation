source:
  edition: SBLGNT
  text: εἶπεν δὲ Ἀβραάμ· Τέκνον, μνήσθητι ὅτι ⸀ἀπέλαβες τὰ ἀγαθά σου ἐν τῇ ζωῇ σου, καὶ Λάζαρος ὁμοίως τὰ κακά· νῦν δὲ ὧδε παρακαλεῖται σὺ δὲ ὀδυνᾶσαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/025.yaml
  text: But Abraham said[a], ‘Child, remember that you received your good things during your life, and Lazarus likewise bad things; but now he is comforted here[b], and you are in anguish.’
translation:
  language: fr
  text: 'Mais Abraham répondit : « Mon enfant, souviens-toi que tu as reçu[a] tes biens pendant ta vie, et que Lazare, lui aussi, a reçu les maux. Maintenant, il est consolé ici, tandis que toi, tu souffres terriblement[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « tu as reçu pleinement ». Le verbe grec peut évoquer le fait de recevoir ce qui était attribué ou de recevoir en totalité.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « tu es tourmenté ». Le verbe grec peut désigner une douleur ou une détresse intense.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τέκνον
  choice: Mon enfant
  rationale: Cette apostrophe exprime à la fois une relation familière, une certaine compassion et une asymétrie sociale, sans nécessairement désigner une filiation biologique. « Mon enfant » est naturel en français dans ce contexte.
- source_word: μνήσθητι
  choice: souviens-toi
  rationale: L’impératif appelle directement l’interlocuteur à se rappeler sa vie passée; « souviens-toi » est l’équivalent français le plus naturel.
- source_word: ἀπέλαβες
  choice: tu as reçu
  rationale: Le verbe peut évoquer le fait de recevoir ce qui revient à quelqu’un ou de le recevoir pleinement. « Tu as reçu » reste sobre et idiomatique; la nuance possible est signalée en note.
- source_word: τὰ ἀγαθά σου
  choice: tes biens
  rationale: Le substantif adjectival désigne les choses bonnes ou avantageuses dont l’homme riche a joui. « Tes biens » est naturel et conserve le possessif, sans introduire le terme théologique « bénédictions ».
- source_word: ἐν τῇ ζωῇ σου
  choice: pendant ta vie
  rationale: Cette formulation rend clairement la valeur temporelle de l’expression grecque et son contraste avec la situation présente.
- source_word: ὁμοίως
  choice: lui aussi
  rationale: Dans une phrase française naturelle, « lui aussi » marque le parallélisme entre ce qu’a reçu l’homme riche et ce qu’a reçu Lazare, tout en préparant leur opposition.
- source_word: τὰ κακά
  choice: les maux
  rationale: L’expression renvoie aux expériences pénibles subies par Lazare, non à des actes moralement mauvais. « Les maux » préserve la généralité du grec avec un registre digne.
- source_word: παρακαλεῖται
  choice: il est consolé
  rationale: Dans ce contexte de renversement après la mort, le passif indique que Lazare reçoit consolation et réconfort. « Il est consolé » est précis et naturel.
- source_word: ὧδε
  choice: ici
  rationale: L’adverbe désigne le lieu où se trouve Abraham dans la scène; « ici » en conserve simplement la valeur déictique.
- source_word: ὀδυνᾶσαι
  choice: tu souffres terriblement
  rationale: Le verbe exprime une douleur ou une détresse intense. Cette formulation française rend l’intensité sans imposer le vocabulaire potentiellement plus interprétatif de « tourment ».
theological_decisions:
- issue: Description de la souffrance après la mort
  choice: tu souffres terriblement
  alternative: tu es tourmenté
  rationale: Le récit décrit une souffrance consciente, mais la traduction doit conserver l’étendue lexicale de ὀδυνᾶσαι sans préciser inutilement la cause ou la nature doctrinale de cette souffrance. La note conserve l’autre traduction possible.
translation_notes:
  register: Français international moderne, naturel et digne. Le contraste entre la vie passée et la situation présente est maintenu, ainsi que le parallélisme entre les biens reçus par l’homme riche et les maux reçus par Lazare. Les deux nuances lexicales importantes sont conservées en notes.
