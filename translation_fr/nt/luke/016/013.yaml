id: LUK.16.13
reference: Luke 16:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὐδεὶς οἰκέτης δύναται δυσὶ κυρίοις δουλεύειν· ἢ γὰρ τὸν ἕνα μισήσει καὶ τὸν ἕτερον ἀγαπήσει, ἢ ἑνὸς ἀνθέξεται καὶ τοῦ ἑτέρου καταφρονήσει. οὐ δύνασθε θεῷ δουλεύειν καὶ μαμωνᾷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/013.yaml
  text: No household servant can serve two masters; for either he will hate the one and love the other[a], or he will be devoted to one and despise the other. You cannot serve God and Mammon.
translation:
  language: fr
  text: Aucun serviteur domestique ne peut servir deux maîtres. En effet, ou bien il détestera l’un et aimera l’autre, ou bien il s’attachera à l’un et méprisera l’autre. Vous ne pouvez pas servir Dieu et Mammon[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les richesses » ou « l’argent ». Le grec emploie Mammon, un terme désignant les richesses, présentées ici comme un maître rival.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκέτης
  choice: serviteur de maison
  rationale: Le terme désigne une personne de condition servile attachée à une maisonnée, plus précisément qu’un simple « serviteur ». Cette formulation garde le cadre domestique et la relation de dépendance sans employer ici le terme plus général « esclave ».
- source_word: κυρίοις
  choice: maîtres
  rationale: Dans cette image sociale, le mot désigne ceux qui exercent l’autorité sur le serviteur. « Maîtres » convient au cadre domestique et prépare le contraste entre Dieu et Mammon.
- source_word: δουλεύειν
  choice: servir
  rationale: Le verbe signifie servir dans une condition servile. « Servir » est naturel en français et permet de conserver exactement la répétition qui relie l’image des deux maîtres à son application.
- source_word: μισήσει
  choice: détestera
  rationale: Le verbe exprime une forte opposition à « aimera ». « Détestera » conserve la vigueur proverbiale du grec sans réduire d’emblée le contraste à une simple préférence.
- source_word: ἀγαπήσει
  choice: aimera
  rationale: Traduction directe qui maintient l’antithèse voulue avec « détestera ».
- source_word: ἀνθέξεται
  choice: s’attachera à
  rationale: Le verbe évoque le fait de tenir fermement à quelqu’un, de prendre son parti ou de lui demeurer attaché. « S’attachera à » rend naturellement cette allégeance relationnelle.
- source_word: καταφρονήσει
  choice: méprisera
  rationale: Le mot signifie considérer avec mépris ou dédain. « Méprisera » est précis et forme un contraste net avec « s’attachera à ».
- source_word: θεῷ
  choice: Dieu
  rationale: Le référent est sans ambiguïté et « Dieu » est la traduction française naturelle.
- source_word: μαμωνᾷ
  choice: Mammon
  rationale: La conservation de l’emprunt sémitique préserve la personnification rhétorique des richesses comme maître rival. Une note en explique le sens aux lecteurs modernes.
theological_decisions:
- issue: Traduction de μαμωνᾷ en contraste avec θεῷ
  choice: Mammon
  alternative: l’argent ; les richesses
  rationale: Le verset présente Dieu et Mammon comme deux maîtres rivaux. Garder « Mammon » maintient cette personnification et cette tension rhétorique sans laisser entendre qu’il s’agit nécessairement d’une divinité réelle.
- issue: Formulation du sujet singulier générique
  choice: il détestera… aimera… s’attachera… méprisera
  alternative: ce serviteur détestera… ; emploi du pluriel
  rationale: Les verbes grecs sont au singulier et renvoient au serviteur pris comme cas représentatif. Le pronom masculin reprend grammaticalement « serviteur » sans modifier le nombre du texte source.
translation_notes:
  register: Français international moderne, digne et accessible. La structure antithétique et la répétition de « servir » sont conservées. « Serviteur de maison » explicite le cadre domestique de οἰκέτης, tandis que « Mammon » garde la force personnifiée du contraste final.
