id: LUK.11.31
reference: Luke 11:31
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: βασίλισσα νότου ἐγερθήσεται ἐν τῇ κρίσει μετὰ τῶν ἀνδρῶν τῆς γενεᾶς ταύτης καὶ κατακρινεῖ αὐτούς· ὅτι ἦλθεν ἐκ τῶν περάτων τῆς γῆς ἀκοῦσαι τὴν σοφίαν Σολομῶνος, καὶ ἰδοὺ πλεῖον Σολομῶνος ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/031.yaml
  text: The queen of the South will rise up in the judgment with the men of this generation and will condemn them[a], because she came from the ends of the earth to hear the wisdom of Solomon, and behold[b], something greater than Solomon is here.
translation:
  language: fr
  text: 'La reine du Sud se lèvera, lors du jugement, avec les hommes de cette génération et les condamnera[a], car elle est venue des extrémités de la terre pour entendre la sagesse de Salomon. Et voici : il y a ici quelque chose de plus grand que Salomon[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Il s’agit de la figure généralement identifiée à la reine de Saba (voir 1 Rois 10.1-13 ; 2 Chroniques 9.1-12).
    reason: cross_reference
  - marker: b
    text: Ou « quelqu’un de plus grand que Salomon ». Le grec emploie une expression neutre, littéralement « quelque chose de plus grand que Salomon », qui peut souligner davantage qu’une simple comparaison entre deux personnes.
    reason: lexical_alternative
lexical_decisions:
- source_word: βασίλισσα νότου
  choice: la reine du Sud
  rationale: Cette traduction conserve la construction grecque et l’allusion à la figure de l’Ancien Testament sans introduire son identification traditionnelle dans le corps du texte.
- source_word: ἐγερθήσεται
  choice: se lèvera
  rationale: Le verbe décrit naturellement le fait de se lever ou de comparaître dans la scène du jugement, tout en laissant résonner sa possible portée eschatologique.
- source_word: ἐν τῇ κρίσει
  choice: lors du jugement
  rationale: Cette formulation française naturelle présente le jugement comme un événement déterminé, conformément à l’article grec.
- source_word: μετὰ τῶν ἀνδρῶν τῆς γενεᾶς ταύτης
  choice: avec les hommes de cette génération
  rationale: « Hommes » rend la valeur masculine de ἀνδρῶν, et « cette génération » correspond au sens contextuel habituel de γενεά.
- source_word: κατακρινεῖ αὐτούς
  choice: les condamnera
  rationale: Le verbe κατακρίνω exprime une condamnation, et non un simple acte de jugement.
- source_word: ἐκ τῶν περάτων τῆς γῆς
  choice: des extrémités de la terre
  rationale: L’expression française conserve l’image conventionnelle d’une région extrêmement éloignée.
- source_word: ἀκοῦσαι τὴν σοφίαν Σολομῶνος
  choice: pour entendre la sagesse de Salomon
  rationale: L’infinitif exprime ici le but de sa venue; la formulation reste proche de la structure grecque.
- source_word: ἰδοὺ
  choice: Et voici
  rationale: « Voici » restitue l’appel solennel à l’attention porté par ἰδού; « Et » maintient l’articulation rhétorique avec ce qui précède.
- source_word: πλεῖον Σολομῶνος
  choice: quelque chose de plus grand que Salomon
  rationale: Le comparatif grec est neutre. « Quelque chose » en préserve la forme et évite de réduire silencieusement la comparaison à une seule comparaison personnelle.
- source_word: ὧδε
  choice: il y a ici
  rationale: Cette tournure rend naturellement en français la présence locale exprimée par l’adverbe grec.
theological_decisions:
- issue: Identification de la reine comme reine de Saba
  choice: Maintenir « la reine du Sud » dans le texte
  alternative: la reine de Saba
  rationale: L’allusion à 1 Rois 10 et 2 Chroniques 9 est forte, mais le grec dit littéralement « reine du Sud ». L’identification probable est donc donnée en note plutôt qu’intégrée au texte.
- issue: Personnalisation de πλεῖον Σολομῶνος
  choice: quelque chose de plus grand que Salomon
  alternative: quelqu’un de plus grand que Salomon
  rationale: Le grec emploie une forme neutre. La traduction retenue préserve la possibilité que la parole évoque plus largement la réalité présente en Jésus — sa personne, son œuvre ou son message — sans trancher cette tension.
- issue: Portée résurrectionnelle de ἐγερθήσεται
  choice: se lèvera
  alternative: sera ressuscitée
  rationale: Dans ce contexte eschatologique, le verbe peut évoquer la résurrection, mais il peut aussi décrire le fait de se lever pour comparaître au jugement. « Se lèvera » conserve les deux résonances sans surinterpréter.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe demeure accessible, tout en conservant la solennité de la scène judiciaire et l’ambiguïté du comparatif neutre grec.
