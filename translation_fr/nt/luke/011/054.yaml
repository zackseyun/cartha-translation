lexical_decisions:
- source_word: ἐνεδρεύοντες αὐτόν
  choice: lui tendant un piège
  rationale: Le participe exprime une action hostile et préméditée visant à piéger Jésus. Cette tournure est naturelle en français et conserve l’idée d’une embuscade sans l’alourdir.
- source_word: θηρεῦσαί
  choice: pour le prendre en défaut
  rationale: Le verbe appartient au domaine de la chasse et signifie littéralement « attraper ». Dans ce contexte verbal, « prendre en défaut » rend clairement le but recherché tout en conservant l’idée de capture.
- source_word: τι
  choice: une parole
  rationale: Le grec dit littéralement « quelque chose », mais le complément « de sa bouche » montre qu’il s’agit de paroles prononcées. Cette explicitation minimale produit un français naturel.
- source_word: ἐκ τοῦ στόματος αὐτοῦ
  choice: qui sortirait de sa bouche
  rationale: Cette formulation conserve l’image concrète de la bouche présente dans le grec, ainsi que le caractère éventuel de la parole qu’ils espéraient exploiter.
