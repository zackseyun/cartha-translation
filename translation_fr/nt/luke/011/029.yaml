id: LUK.11.29
reference: Luke 11:29
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Τῶν δὲ ὄχλων ἐπαθροιζομένων ἤρξατο λέγειν· Ἡ γενεὰ αὕτη ⸀γενεὰ πονηρά ἐστιν· σημεῖον ⸀ζητεῖ, καὶ σημεῖον οὐ δοθήσεται αὐτῇ εἰ μὴ τὸ σημεῖον ⸀Ἰωνᾶ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/029.yaml
  text: As the crowds were gathering[a], he began to say, “This generation is an evil generation. It seeks a sign[b], and no sign will be given to it except the sign of Jonah.”
translation:
  language: fr
  text: 'Alors que les foules se rassemblaient, il se mit à dire : « Cette génération est une génération mauvaise. Elle cherche un signe, et aucun signe ne lui sera donné, si ce n’est le signe de Jonas[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « le signe de Jonas » peut désigner Jonas lui-même comme signe par sa mission prophétique ; à la lumière des passages parallèles des Évangiles, elle peut aussi évoquer typologiquement la mort et la résurrection de Jésus.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπαθροιζομένων
  choice: se rassemblaient en nombre toujours plus grand
  rationale: Le verbe évoque un rassemblement qui s’amplifie. Cette formulation rend à la fois l’action en cours du participe présent et l’idée d’accumulation portée par ἐπί.
- source_word: ἤρξατο λέγειν
  choice: il se mit à dire
  rationale: Tour français naturel qui conserve la valeur inchoative de la construction grecque.
- source_word: γενεά
  choice: génération
  rationale: Équivalent direct qui maintient la portée à la fois temporelle et collective de la parole de Jésus.
- source_word: πονηρά
  choice: mauvaise
  rationale: Terme moral clair et courant. « Mauvaise » garde ici la condamnation sans adopter le registre plus marqué de « perverse » ou « méchante ».
- source_word: σημεῖον
  choice: signe
  rationale: Équivalent standard qui n’ajoute pas explicitement l’adjectif « miraculeux » et préserve la portée validante du terme.
- source_word: ζητεῖ
  choice: cherche
  rationale: Rend directement le sens du verbe. Le contexte laisse percevoir l’attitude exigeante sans que la traduction introduise « réclame ».
- source_word: δοθήσεται
  choice: sera donné
  rationale: Reproduit simplement le futur passif grec dans un français actuel.
- source_word: εἰ μὴ
  choice: si ce n’est
  rationale: Dans cette construction suivant une négation, cette expression marque clairement l’exception.
- source_word: τὸ σημεῖον Ἰωνᾶ
  choice: le signe de Jonas
  rationale: Le complément « de Jonas » conserve l’ambiguïté du génitif grec au lieu d’imposer l’identité ou la nature précise du signe.
theological_decisions:
- issue: Portée de la condamnation de « cette génération »
  choice: Une appréciation morale collective formulée sans atténuation.
  alternative: Limiter explicitement la condamnation aux seuls adversaires présents.
  rationale: La répétition de γενεά donne à la déclaration une portée collective. La traduction n’en restreint pas le référent au-delà de ce que dit le grec.
- issue: Sens du « signe de Jonas »
  choice: Conserver dans le texte l’expression ouverte « le signe de Jonas ».
  alternative: Préciser qu’il s’agit exclusivement de la mission prophétique de Jonas, ou exclusivement d’une préfiguration de la mort et de la résurrection de Jésus.
  rationale: Le contexte lucanien immédiat rattache Jonas lui-même à un signe, tandis que les parallèles évangéliques permettent aussi une lecture typologique. La formulation grecque ne doit pas être refermée dans ce verset.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition « Cette génération est une génération mauvaise » est volontairement conservée pour respecter l’insistance du grec. « Se rassemblaient en nombre toujours plus grand » explicite sobrement la nuance cumulative de ἐπαθροιζομένων.
