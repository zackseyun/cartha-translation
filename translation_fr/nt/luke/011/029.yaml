  verdict: revise
  source_fidelity: La formulation « en nombre toujours plus grand » explicite une idée d’accroissement qui n’est pas nécessairement exprimée par ἐπαθροιζομένων. Le grec indique que les foules se rassemblaient / s’attroupaient. La conjonction καί est additive; « mais » introduit un contraste plus marqué que le texte source ne l’exige.
  naturalness: Le français est globalement clair et de registre approprié. « Alors que les foules se rassemblaient » est plus sobre, naturel et fidèle. La répétition de « génération » maintient utilement l’insistance grecque.
  terminology: « génération », « mauvaise », « signe », « sera donné » et « le signe de Jonas » sont des choix justes. « Le signe de Jonas » préserve correctement l’ouverture du génitif grec, sans imposer une interprétation confessionnelle.
