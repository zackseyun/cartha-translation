    rationale: « Se rassemblaient en nombre toujours plus grand » peut suggérer explicitement une croissance numérique progressive. « Alors que les foules se rassemblaient » rend l’action en cours sans cette explicitation.
  - severity: low
    issue: Contraste introduit par « mais »
    rationale: Le καί grec relie simplement les deux propositions. La suppression de « mais » évite d’accentuer une opposition logique qui n’est pas marquée dans le source.
