  text: Καὶ ἦν ἐκβάλλων ⸀δαιμόνιον κωφόν· ἐγένετο δὲ τοῦ δαιμονίου ἐξελθόντος ἐλάλησεν ὁ κωφός. καὶ ἐθαύμασαν οἱ ὄχλοι·
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/014.yaml
  text: And he was casting out a mute demon. Then[a], when the demon had gone out, the mute man spoke, and the crowds marveled.
translation:
  language: fr
  text: Il chassait un démon qui rendait un homme muet[a]. Lorsque le démon fut sorti, l’homme parla, et les foules furent étonnées.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « un démon muet ». Le mot grec peut aussi signifier « sourd », mais le contexte indique ici l’incapacité de parler, puisque l’homme parle après la sortie du démon.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν ἐκβάλλων
  choice: Il chassait
  rationale: La périphrase à l’imparfait présente l’action en cours dans le passé. L’imparfait français l’exprime naturellement sans la tournure plus lourde « était en train de chasser ».
- source_word: δαιμόνιον
  choice: un démon
  rationale: Le terme désigne directement un démon ou esprit mauvais. « Démon » rend le mot grec sans importer l’expression différente « esprit impur ».
- source_word: κωφόν
  choice: qui rendait un homme muet
  rationale: κωφός peut signifier « sourd » ou « muet ». Le fait que l’homme parle après la sortie du démon montre qu’ici l’incapacité de parler est au premier plan. Cette formulation française rend clairement la relation implicite entre le démon et l’affliction, plutôt que de laisser entendre que le démon lui-même était incapable de parler.
- source_word: ἐγένετο δὲ τοῦ δαιμονίου ἐξελθόντος
  choice: Lorsque le démon fut sorti
  rationale: La proposition temporelle rend la succession narrative et l’antériorité de la sortie du démon. La formule sémitisante « il arriva que » n’est pas nécessaire en français courant.
- source_word: ἐλάλησεν
  choice: se mit à parler
  rationale: Le grec signifie littéralement « parla ». Dans ce contexte de restauration d’une faculté jusque-là empêchée, « se mit à parler » est naturel en français et exprime le résultat immédiat sans préciser le contenu des paroles.
- source_word: ὁ κωφός
  choice: l’homme
  rationale: L’adjectif substantivé désigne la personne précédemment présentée comme muette. « L’homme » évite la répétition pesante de « muet » tout en gardant le référent parfaitement clair.
- source_word: ἐθαύμασαν
  choice: furent émerveillées
  rationale: Le verbe exprime l’étonnement admiratif. « Furent émerveillées » conserve cette nuance mieux que le simple « furent surprises ».
- source_word: οἱ ὄχλοι
  choice: les foules
  rationale: Le pluriel grec est conservé. « Les foules » est actuel et plus exact que le singulier collectif « la foule ».
theological_decisions:
- issue: Nature de l’affliction et langage de l’exorcisme
  choice: Présenter explicitement un démon chassé, dont la sortie entraîne le rétablissement de la parole.
  alternative: Employer une description purement phénoménologique ou remplacer « démon » par une formulation atténuée.
  rationale: Le texte grec nomme explicitement un δαιμόνιον et relie sa sortie au retour de la parole. La traduction conserve cette affirmation surnaturelle sans la réduire ni l’amplifier.
- issue: Rapport de κωφόν au démon et à l’homme
  choice: Rendre le démon comme celui qui rend l’homme muet.
  alternative: Traduire littéralement « un démon muet », ce qui peut faire croire que le démon lui-même ne parle pas.
  rationale: La reprise substantivée ὁ κωφός et le fait qu’il parle après l’exorcisme indiquent que l’adjectif décrit fonctionnellement l’affliction de la personne. La note maintient toutefois visible la forme plus littérale et l’autre sens lexical possible.
translation_notes:
  register: Français international moderne, courant et digne. L’imparfait ouvre naturellement la scène; le passé simple maintient le ton narratif biblique sans archaïsme marqué. La formulation explicite « qui rendait un homme muet » privilégie la clarté tout en signalant en note la construction grecque littérale.
