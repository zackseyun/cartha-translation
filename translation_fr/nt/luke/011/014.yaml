revisions:
- from: Il chassait un démon qui rendait un homme muet[a]. Lorsque le démon fut sorti, l’homme se mit à parler, et les foules furent émerveillées.
  to: Il chassait un démon qui rendait un homme muet[a]. Lorsque le démon fut sorti, l’homme parla, et les foules furent étonnées.
  rationale: La révision retire l’aspect inchoatif ajouté par « se mit à parler » et emploie pour la réaction des foules un terme français plus neutre, correspondant à l’étonnement exprimé par ἐθαύμασαν. Elle conserve l’explicitation française de l’affliction et la note qui rend compte de la forme littérale grecque ainsi que de son ambiguïté lexicale.
