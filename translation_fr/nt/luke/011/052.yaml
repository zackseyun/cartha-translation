id: LUK.11.52
reference: Luke 11:52
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὐαὶ ὑμῖν τοῖς νομικοῖς, ὅτι ἤρατε τὴν κλεῖδα τῆς γνώσεως· αὐτοὶ οὐκ εἰσήλθατε καὶ τοὺς εἰσερχομένους ἐκωλύσατε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/052.yaml
  text: Woe to you lawyers[a], because you took away the key of knowledge; you yourselves did not enter[b], and you hindered those who were entering.
translation:
  language: fr
  text: Malheur à vous, spécialistes de la Loi, parce que vous avez enlevé la clé de la connaissance[a] ! Vous-mêmes, vous n’êtes pas entrés, et vous avez empêché ceux qui entraient.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « la clé qui donne accès à la connaissance ».'
    reason: La construction grecque peut être exprimée en français soit par un génitif proche de la forme originale, soit en explicitant la relation d’accès suggérée par la métaphore.
lexical_decisions:
- source_word: οὐαί
  choice: Malheur à vous
  rationale: Cette formule française conserve la force de la dénonciation prophétique, plutôt que d’exprimer seulement la tristesse.
- source_word: νομικοῖς
  choice: spécialistes de la Loi
  rationale: Le terme désigne ici des spécialistes de la loi juive, et non des avocats au sens moderne. La majuscule à « Loi » signale naturellement ce contexte religieux.
- source_word: ἤρατε
  choice: vous avez enlevé
  rationale: Dans cette image, αἴρω exprime le retrait de la clé, qui prive ainsi les autres de l’accès.
- source_word: κλεῖδα τῆς γνώσεως
  choice: la clé de la connaissance
  rationale: Ce rendu proche de la construction grecque préserve la métaphore et son ambiguïté, sans préciser indûment ce que la clé ouvre.
- source_word: αὐτοὶ
  choice: Vous-mêmes
  rationale: La forme détachée restitue l’insistance du pronom grec et souligne le contraste avec ceux qui entraient.
- source_word: οὐκ εἰσήλθατε
  choice: vous n’êtes pas entrés
  rationale: Le complément implicite n’est pas ajouté, afin de conserver l’image ouverte du texte grec.
- source_word: τοὺς εἰσερχομένους
  choice: ceux qui entraient
  rationale: L’imparfait rend naturellement l’aspect en cours du participe présent, sans ajouter l’idée qu’ils essayaient seulement d’entrer.
- source_word: ἐκωλύσατε
  choice: vous avez empêché
  rationale: Le verbe exprime une obstruction effective. En français actuel, « empêcher » est plus naturel et direct que « entraver » dans cette construction.
theological_decisions:
- issue: Référent métaphorique de l’entrée et de la clé
  choice: Le texte conserve l’image de l’accès sans nommer ce dans quoi les personnes entrent.
  alternative: Expliciter soit l’entrée dans le royaume de Dieu, soit l’accès à la véritable connaissance de Dieu.
  rationale: Le grec ne fournit aucun complément explicite au verbe « entrer ». L’ajout d’un référent résoudrait une tension que le verset laisse ouverte.
translation_notes:
  register: Français international moderne, digne et direct. « Spécialistes de la Loi » évite l’ambiguïté de « juristes » ou « avocats ». La reprise « Vous-mêmes, vous » est idiomatique et conserve l’emphase accusatrice du grec.
