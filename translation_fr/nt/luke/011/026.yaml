id: LUK.11.26
reference: Luke 11:26
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τότε πορεύεται καὶ παραλαμβάνει ⸂ἕτερα πνεύματα πονηρότερα ἑαυτοῦ ἑπτά⸃, καὶ ⸀εἰσελθόντα κατοικεῖ ἐκεῖ, καὶ γίνεται τὰ ἔσχατα τοῦ ἀνθρώπου ἐκείνου χείρονα τῶν πρώτων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/026.yaml
  text: Then it goes and takes along seven other spirits more evil than itself[a], and they enter and live there[c][b]; and the last state of that man becomes worse than the first.
translation:
  language: fr
  text: Alors il s’en va et prend avec lui sept autres esprits[b], plus mauvais que lui[a]. Une fois entrés, ils habitent là[c], et la condition finale de cet homme devient pire que la première.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « plus méchants que lui ».
    reason: lexical_alternative
  - marker: b
    text: Le grec dit ici « esprits », sans répéter « impur » et sans employer explicitement « démons »; le contexte montre toutefois qu’il s’agit d’esprits hostiles.
    reason: lexical_alternative
  - marker: c
    text: Le participe « entrés » est au pluriel, mais le verbe traduit par « habitent » est au singulier dans le texte grec.
    reason: textual_grammar
lexical_decisions:
- source_word: τότε
  choice: Alors
  rationale: Marque naturellement la succession des événements dans le récit.
- source_word: πορεύεται καὶ παραλαμβάνει
  choice: il s’en va et prend avec lui
  rationale: Rend à la fois le mouvement de πορεύεται et l’idée d’accompagnement portée par παραλαμβάνει.
- source_word: ἕτερα πνεύματα
  choice: autres esprits
  rationale: Conserve le nom non qualifié « esprits » sans ajouter « démons » ou « impurs », absents de ce verset.
- source_word: πονηρότερα ἑαυτοῦ
  choice: plus mauvais que lui
  rationale: Le masculin français « lui » reprend naturellement « esprit » et maintient la comparaison avec l’esprit initial.
- source_word: εἰσελθόντα
  choice: Une fois entrés
  rationale: Le participe aoriste neutre pluriel renvoie aux esprits et présente leur entrée comme antérieure à leur installation.
- source_word: κατοικεῖ ἐκεῖ
  choice: ils habitent là
  rationale: Expression française naturelle pour une résidence durable; le pluriel suit le participe pluriel et le sens collectif du passage, tandis que la singularité formelle du verbe grec est signalée en note.
- source_word: τὰ ἔσχατα ... χείρονα τῶν πρώτων
  choice: la condition finale ... pire que la première
  rationale: Rend l’expression idiomatique désignant l’état ultérieur de l’homme et conserve le contraste final/premier.
- source_word: τοῦ ἀνθρώπου ἐκείνου
  choice: de cet homme
  rationale: Désigne l’individu particulier de l’illustration et respecte le genre grammatical du grec.
theological_decisions:
- issue: Faut-il préciser que les esprits sont des démons ou des esprits impurs ?
  choice: esprits
  alternative: démons / esprits impurs
  rationale: Le contexte indique leur caractère hostile, mais ce verset emploie seulement πνεύματα; la traduction n’ajoute donc pas une qualification absente.
- issue: Accord du verbe κατοικεῖ après le participe pluriel εἰσελθόντα
  choice: ils habitent
  alternative: il habite
  rationale: Le participe pluriel et le contexte présentent les esprits comme entrant ensemble; le pluriel donne ce sens naturel, sans dissimuler la forme verbale singulière, indiquée en note.
- issue: Sens de πονηρότερα
  choice: plus mauvais
  alternative: plus méchants
  rationale: « Mauvais » exprime largement le mal moral sans réduire le terme à un trait de comportement.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proche de la progression grecque, tout en employant des tournures françaises naturelles. Les notes préservent les nuances lexicales et l’accord grammatical inhabituel du texte source.
