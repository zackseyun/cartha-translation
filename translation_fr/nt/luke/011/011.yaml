source:
  edition: SBLGNT
  text: τίνα δὲ ⸀ἐξ ὑμῶν τὸν πατέρα αἰτήσει ὁ ⸀υἱὸς ἰχθύν, ⸀καὶ ἀντὶ ἰχθύος ὄφιν ⸂αὐτῷ ἐπιδώσει⸃;
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/011.yaml
  text: What father among you[a], if his son asks for a fish, will give him a snake instead of a fish?
translation:
  language: fr
  text: Quel père parmi vous, si son fils lui demande un poisson, lui donnera un serpent à la place du poisson ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τίνα δὲ ἐξ ὑμῶν τὸν πατέρα
  choice: Quel père parmi vous
  rationale: Cette formulation française naturelle conserve la portée rhétorique de la question grecque et désigne un père pris parmi les auditeurs.
- source_word: αἰτήσει ὁ υἱὸς ἰχθύν
  choice: si son fils lui demande un poisson
  rationale: La tournure conditionnelle rend naturellement en français la situation envisagée par la question rhétorique. « Son fils » explicite la relation exprimée par le contexte, et « lui » identifie le père comme destinataire de la demande.
- source_word: ἀντὶ ἰχθύος
  choice: à la place du poisson
  rationale: Cette expression traduit clairement la substitution marquée par ἀντί tout en conservant la répétition concrète du poisson présente en grec.
- source_word: ὄφιν
  choice: un serpent
  rationale: « Serpent » est le terme français courant et direct pour ὄφις dans ce contexte; contrairement à l’anglais, le français n’exige pas ici de choisir entre deux termes usuels comme « snake » et « serpent ».
- source_word: αὐτῷ ἐπιδώσει
  choice: lui donnera
  rationale: Le futur et le bénéficiaire masculin singulier sont conservés dans une formulation française idiomatique.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. La structure interrogative et le contraste concret entre le poisson demandé et le serpent donné sont préservés sans ajouter d’interprétation symbolique.
