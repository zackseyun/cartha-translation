id: LUK.11.41
reference: Luke 11:41
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: πλὴν τὰ ἐνόντα δότε ἐλεημοσύνην, καὶ ἰδοὺ πάντα καθαρὰ ὑμῖν ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/041.yaml
  text: But give as alms the things that are within[a], and behold, everything is clean for you.
translation:
  language: fr
  text: Mais donnez comme aumône ce qui est à l’intérieur[a], et voici, tout est pur pour vous.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ce que vous avez ». L’expression grecque peut désigner soit ce qui est à l’intérieur, soit les biens dont on dispose.'
    reason: alternative_reading
lexical_decisions:
- source_word: πλὴν
  choice: Mais
  rationale: Introduit une opposition corrective avec la discussion précédente sur la purification extérieure.
- source_word: τὰ ἐνόντα
  choice: ce qui est à l’intérieur
  rationale: Conserve le sens littéral et le contraste immédiat entre l’extérieur et l’intérieur de la coupe, tout en laissant l’autre compréhension possible en note.
- source_word: δότε ἐλεημοσύνην
  choice: donnez en aumône
  rationale: Rend naturellement l’impératif et le nom désignant l’aumône, sans ajouter explicitement un bénéficiaire absent du grec.
- source_word: ἰδοὺ
  choice: voici
  rationale: Préserve la mise en relief rhétorique dans un français actuel et digne.
- source_word: πάντα καθαρὰ ὑμῖν ἐστιν
  choice: tout est pur pour vous
  rationale: Rend la portée globale de πάντα, le vocabulaire de pureté du contexte et le datif de référence ὑμῖν.
theological_decisions:
- issue: Sens de τὰ ἐνόντα en rapport avec la pureté et l’aumône
  choice: « ce qui est à l’intérieur », dans un sens intérieur ou moral
  alternative: « ce que vous avez », en référence aux biens dont on dispose
  rationale: Le contexte immédiat oppose l’extérieur et l’intérieur de la coupe (Luc 11.39), ce qui favorise le sens intérieur. L’expression grecque restant susceptible d’une lecture possessive, celle-ci est conservée en note afin de ne pas supprimer l’ambiguïté réelle.
translation_notes:
  register: Français international moderne, concis et digne. « Voici » conserve l’emphase de ἰδοὺ sans recourir à l’archaïsant « voici que ». La formulation maintient l’ambiguïté centrale au moyen d’une note.
