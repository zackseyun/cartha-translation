id: LUK.11.40
reference: Luke 11:40
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἄφρονες, οὐχ ὁ ποιήσας τὸ ἔξωθεν καὶ τὸ ἔσωθεν ἐποίησεν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/040.yaml
  text: Fools! Did not the one who made the outside also make the inside?[a]
translation:
  language: fr
  text: Insensés ! Celui qui a fait l’extérieur n’a-t-il pas aussi fait l’intérieur ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le dehors […] le dedans ». Dans le contexte immédiat, ces mots peuvent désigner l’extérieur et l’intérieur du récipient et, par extension, la vie extérieure et la vie intérieure de l’être humain.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄφρονες
  choice: Insensés !
  rationale: L’adjectif au vocatif pluriel est employé comme substantif dans une interpellation directe et sévère. « Insensés ! » restitue cette force en français actuel et digne, sans ajouter de pronom absent du grec.
- source_word: οὐχ ... ἐποίησεν;
  choice: n’a-t-il pas ... fait ?
  rationale: La question introduite par οὐχ appelle une réponse affirmative. La tournure négative interrogative française en conserve naturellement la valeur rhétorique.
- source_word: ὁ ποιήσας
  choice: Celui qui a fait
  rationale: Le participe aoriste substantivé désigne personnellement l’auteur de l’acte. Cette formulation préserve l’allusion implicite à Dieu sans introduire son nom dans le texte.
- source_word: τὸ ἔξωθεν
  choice: l’extérieur
  rationale: Le substantif neutre désigne ce qui est au-dehors. « L’extérieur » convient à la fois au récipient évoqué dans le contexte et, par extension, à la dimension visible de la vie humaine.
- source_word: τὸ ἔσωθεν
  choice: l’intérieur
  rationale: En parallèle avec τὸ ἔξωθεν, le terme désigne ce qui est au-dedans. « L’intérieur » maintient l’application possible au récipient comme à la réalité intérieure de la personne.
- source_word: καὶ
  choice: aussi
  rationale: Dans cette question rhétorique, « aussi » exprime clairement que celui qui a fait l’extérieur a également fait l’intérieur, tout en restant fidèle à la valeur de καί.
theological_decisions:
- issue: Référent de « Celui qui a fait »
  choice: L’allusion implicite à Dieu comme Créateur est maintenue sans explicitation.
  alternative: Comprendre l’expression uniquement comme une référence immédiate au fabricant du récipient.
  rationale: La parole s’appuie sur l’image concrète de la coupe ou du plat tout en pouvant renvoyer à Dieu, auteur de l’être humain dans ses dimensions extérieure et intérieure. La traduction conserve les deux plans sans ajouter « Dieu », absent du grec.
translation_notes:
  register: Français international moderne, direct et digne. L’exclamation conserve la vigueur de la réprimande, tandis que la question rhétorique reste fluide. Le couple « l’extérieur / l’intérieur » préserve la symétrie du grec et la double portée concrète et anthropologique.
