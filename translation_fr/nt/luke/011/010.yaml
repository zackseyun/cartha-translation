id: LUK.11.10
reference: Luke 11:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: πᾶς γὰρ ὁ αἰτῶν λαμβάνει, καὶ ὁ ζητῶν εὑρίσκει, καὶ τῷ κρούοντι ἀνοιγήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/010.yaml
  text: For everyone who asks receives[a], and the one who seeks finds, and to the one who knocks it will be opened.
translation:
  language: fr
  text: Car quiconque demande reçoit, quiconque cherche trouve, et l’on ouvrira à quiconque frappe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « il sera ouvert à celui qui frappe ». Le grec ne précise pas ce qui sera ouvert ; le contexte suggère une porte.'
    reason: Précision syntaxique et objet implicite
lexical_decisions:
- source_word: πᾶς ὁ αἰτῶν
  choice: quiconque demande
  rationale: La construction distributive désigne toute personne qui demande. « Quiconque » exprime naturellement cette portée universelle sans ajouter de restriction.
- source_word: γὰρ
  choice: Car
  rationale: Conserve la valeur explicative qui relie cette affirmation à l’exhortation précédente.
- source_word: λαμβάνει
  choice: reçoit
  rationale: Équivalent direct et naturel dans le rapport entre demande et réponse.
- source_word: ὁ ζητῶν
  choice: qui cherche
  rationale: Rend le participe présent substantivé comme une caractéristique générale, tout en maintenant la formulation concise et parallèle.
- source_word: εὑρίσκει
  choice: trouve
  rationale: Équivalent direct qui préserve la structure proverbiale de la série.
- source_word: τῷ κρούοντι
  choice: à celui qui frappe
  rationale: Le complément introduit par « à » conserve la relation syntaxique du datif avec le verbe passif grec.
- source_word: ἀνοιγήσεται
  choice: l’on ouvrira
  rationale: Le futur avec « on » constitue en français une manière naturelle de rendre le passif grec tout en laissant l’objet inexprimé, comme dans le texte source.
theological_decisions:
- issue: Portée et force universelles de la promesse
  choice: Présenter l’affirmation comme une maxime universelle sans qualification ajoutée.
  alternative: Ajouter une condition interprétative telle que « quiconque demande comme il convient », ou atténuer la phrase en simple encouragement hyperbolique.
  rationale: Le grec formule une déclaration universelle sans restriction explicite dans le contexte de l’enseignement sur la prière. La traduction en préserve la tension au lieu d’y introduire des conditions théologiques absentes du verset.
- issue: Agent implicite de l’ouverture
  choice: Employer « l’on ouvrira » sans identifier l’agent.
  alternative: Nommer Dieu comme agent ou reformuler explicitement « Dieu lui ouvrira ».
  rationale: Le passif grec ne nomme pas l’agent. La formulation française conserve cette retenue et n’explicite pas une interprétation théologique.
translation_notes:
  register: Français international moderne, clair et digne. « Quiconque » maintient la portée universelle et la concision de la maxime. La reprise « à celui qui frappe » préserve la syntaxe grecque, tandis que « l’on ouvrira » évite une tournure passive artificielle en français sans expliciter l’objet ni l’agent.
