id: LUK.11.36
reference: Luke 11:36
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἰ οὖν τὸ σῶμά σου ὅλον φωτεινόν, μὴ ἔχον ⸂μέρος τι⸃ σκοτεινόν, ἔσται φωτεινὸν ὅλον ὡς ὅταν ὁ λύχνος τῇ ἀστραπῇ φωτίζῃ σε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/036.yaml
  text: If[a], then, your whole body is full of light, having no dark part, it will be wholly full of light, as when a lamp lights you with its brightness.
translation:
  language: fr
  text: Si donc ton corps tout entier est lumineux, sans aucune partie obscure, il sera tout entier lumineux, comme lorsque la lampe t’éclaire de son éclat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « comme lorsque la lampe t’illumine d’un éclair ». Le mot grec peut désigner un éclair ou un éclat lumineux ; ici, il évoque vraisemblablement le rayonnement de la lampe plutôt que la foudre.
    reason: lexical_alternative
lexical_decisions:
- source_word: σῶμά
  choice: corps
  rationale: Le terme désigne littéralement le corps. Le conserver respecte l’image liée à l’œil et à la lumière dans le contexte, sans la réduire à une explication de l’état intérieur.
- source_word: ὅλον / ὅλον
  choice: tout entier / tout entier
  rationale: La répétition grecque souligne la totalité. « Tout entier » est naturel en français et maintient cette insistance.
- source_word: φωτεινόν
  choice: lumineux
  rationale: L’adjectif français rend directement le prédicat grec et s’oppose clairement à « obscure », tout en évitant une paraphrase interprétative.
- source_word: μὴ ἔχον μέρος τι σκοτεινόν
  choice: sans aucune partie obscure
  rationale: Cette formulation française fluide préserve l’image concrète d’une partie du corps qui serait obscure et rend la portée indéfinie de μέρος τι sous la négation.
- source_word: ἔσται
  choice: il sera
  rationale: Rend simplement le futur grec, avec « il » reprenant « ton corps ».
- source_word: ὡς ὅταν
  choice: comme lorsque
  rationale: Cette tournure conserve à la fois la comparaison et la nuance temporelle de l’expression grecque.
- source_word: λύχνος
  choice: lampe
  rationale: Le mot grec désigne une lampe concrète, et non la lumière abstraite ni un porte-lampe.
- source_word: τῇ ἀστραπῇ
  choice: de son éclat
  rationale: ἀστραπή peut désigner un éclair, un jaillissement lumineux ou un éclat. Avec la lampe pour sujet, « son éclat » exprime naturellement la lumière rayonnante sans suggérer nécessairement la foudre.
- source_word: φωτίζῃ σε
  choice: t’éclaire
  rationale: Le verbe signifie donner de la lumière ou illuminer. « T’éclaire » est idiomatique et conserve l’objet personnel σε.
theological_decisions:
- issue: Portée métaphorique du corps et de la lumière
  choice: Conserver les images du corps, de l’obscurité et de la lumière sans les expliquer.
  alternative: Paraphraser « corps » comme la personne entière, la vie intérieure ou l’état spirituel.
  rationale: Le verset prolonge l’image de l’œil comme lampe du corps. Une traduction explicative trancherait le sens métaphorique et atténuerait la tension propre à la parole de Jésus.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe garde le mouvement conditionnel et la répétition de « tout entier », tout en évitant le calque lourd « n’ayant aucune partie obscure ».
