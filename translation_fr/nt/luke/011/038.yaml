  text: ὁ δὲ Φαρισαῖος ἰδὼν ἐθαύμασεν ὅτι οὐ πρῶτον ἐβαπτίσθη πρὸ τοῦ ἀρίστου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/038.yaml
  text: But the Pharisee, when he saw it, was astonished that he had not first washed before the meal.
translation:
  language: fr
  text: Mais le pharisien, en voyant cela, s’étonna qu’il ne se soit pas d’abord lavé avant le repas[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qu’il n’ait pas d’abord accompli le lavage rituel ». Le verbe grec est souvent traduit par « baptiser », mais il désigne ici un lavage lié aux pratiques pharisiennes de pureté.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Mais
  rationale: Marque une légère opposition ou transition narrative avec l’action de Jésus au verset précédent.
- source_word: Φαρισαῖος
  choice: le pharisien
  rationale: Désignation courante et naturelle en français, avec l’article défini du grec.
- source_word: ἰδὼν
  choice: en le voyant
  rationale: Rend le participe aoriste comme une circonstance antérieure ou concomitante; le pronom reprend naturellement ce que Jésus vient de faire.
- source_word: ἐθαύμασεν
  choice: s’étonna
  rationale: Exprime la vive surprise du pharisien sans ajouter explicitement une désapprobation que le verbe seul ne formule pas.
- source_word: οὐ πρῶτον ἐβαπτίσθη
  choice: qu’il n’ait pas d’abord fait les ablutions rituelles
  rationale: Dans ce contexte de pratiques pharisiennes avant un repas, le verbe désigne une purification par lavage plutôt que le baptême chrétien. Le passé du subjonctif après «s’étonna que» est idiomatique et marque l’antériorité.
- source_word: πρὸ τοῦ ἀρίστου
  choice: avant le repas
  rationale: Préserve la référence générale au repas sans préciser indûment qu’il s’agit du déjeuner ou du repas de midi.
theological_decisions:
- issue: Sens de ἐβαπτίσθη dans le contexte d’un repas chez un pharisien
  choice: a fait les ablutions rituelles
  alternative: s’est lavé; a été baptisé; s’est immergé
  rationale: Le contexte porte sur la pureté rituelle avant le repas, non sur le baptême chrétien. La formulation retenue explicite la nature cérémonielle de l’acte tout en laissant une note signaler le lien lexical avec le verbe habituellement traduit par «baptiser».
translation_notes:
  register: Français international moderne, naturel et digne. «Ablutions rituelles» est précis mais légèrement soutenu; la note fournit l’expression plus courante «se laver» et préserve la portée lexicale du grec.
