review_pass:
  verdict: revise
  source_fidelity: 'Le sens fondamental est bien rendu : le pharisien s''étonne que Jésus ne se soit pas lavé avant le repas. Toutefois, « faire les ablutions rituelles » est plus interprétatif et plus lourd que le grec ἐβαπτίσθη, qui exprime ici l''action de se laver dans un cadre de pureté. Une traduction principale plus simple, accompagnée d''une note, préserve mieux à la fois le contexte et la portée lexicale du verbe.'
  naturalness: « En voyant cela » est plus naturel et moins ambigu que « en le voyant », dont le pronom peut renvoyer directement à Jésus plutôt qu'à ce qu'il venait de faire. « Ne se soit pas d'abord lavé » est idiomatique en français moderne après « s'étonna que »; « avant le repas » garde une formulation fluide.
  terminology: « Pharisien » et « repas » conviennent. Le lavage est correctement distingué du baptême chrétien par la note. Le terme « ablutions rituelles », au pluriel, peut suggérer un ensemble de rites déterminés et explicite davantage que le texte; il vaut mieux le réserver à l'explication en note.
  issues:
  - severity: medium
    issue: La formulation principale « fait les ablutions rituelles » est trop explicative.
    rationale: Le grec emploie le passif de βαπτίζω dans un contexte de lavage, mais ne comporte ni le substantif « ablutions » ni l'adjectif « rituelles ». « Se laver » rend l'action sans surinterpréter; la note peut préciser le contexte de pureté.
  - severity: low
    issue: « En le voyant » est ambigu.
    rationale: L'objet de ἰδών est implicite. « En voyant cela » rend naturellement l'observation du pharisien sans imposer un référent pronominal masculin.
