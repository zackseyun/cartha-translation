id: LUK.11.30
reference: Luke 11:30
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καθὼς γὰρ ἐγένετο ⸀Ἰωνᾶς ⸂τοῖς Νινευίταις σημεῖον⸃, οὕτως ἔσται καὶ ὁ υἱὸς τοῦ ἀνθρώπου τῇ γενεᾷ ταύτῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/030.yaml
  text: For just as Jonah became a sign to the Ninevites[a], so also the Son of Man will be to this generation.
translation:
  language: fr
  text: En effet, tout comme Jonas est devenu un signe pour les Ninivites, de même le Fils de l’homme sera un signe pour cette génération[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement, le grec ne répète pas « un signe » dans la seconde partie : « de même aussi le Fils de l’homme sera pour cette génération ». Le sens « sera un signe » découle du parallèle avec Jonas.'
    reason: Précision sur le prédicat sous-entendu dans le texte grec.
lexical_decisions:
- source_word: καθὼς γὰρ
  choice: En effet, tout comme
  rationale: « En effet » rend la valeur explicative de γάρ, tandis que « tout comme » introduit naturellement la comparaison marquée par καθώς.
- source_word: ἐγένετο
  choice: est devenu
  rationale: Cette formulation conserve la nuance selon laquelle Jonas en est venu à remplir la fonction de signe, plutôt que d’indiquer seulement un état.
- source_word: Ἰωνᾶς
  choice: Jonas
  rationale: Forme française traditionnelle et courante du nom biblique.
- source_word: τοῖς Νινευίταις
  choice: pour les Ninivites
  rationale: Le datif exprime ici les personnes à l’égard desquelles Jonas a servi de signe. « Pour » est naturel en français dans cette construction.
- source_word: σημεῖον
  choice: un signe
  rationale: « Signe » conserve la portée révélatrice du terme dans Luc sans la réduire à un présage ou à une preuve.
- source_word: οὕτως … καὶ
  choice: de même
  rationale: La locution marque clairement la corrélation avec « tout comme » et exprime la correspondance entre Jonas et le Fils de l’homme.
- source_word: ἔσται
  choice: sera
  rationale: Le futur du verbe « être » est rendu directement; le prédicat « un signe », sous-entendu en grec, est repris en français pour assurer la clarté.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: le Fils de l’homme
  rationale: Cette désignation traditionnelle préserve sa formulation littérale ainsi que ses résonances messianiques et apocalyptiques.
- source_word: τῇ γενεᾷ ταύτῃ
  choice: pour cette génération
  rationale: « Pour » exprime idiomatiquement la relation du signe à cette génération, tout en conservant le terme γενεά sans le paraphraser par « les gens de cette époque ».
theological_decisions:
- issue: Prédicat sous-entendu dans la seconde proposition
  choice: 'Répéter « un signe » : « le Fils de l’homme sera un signe pour cette génération »'
  alternative: « le Fils de l’homme sera pour cette génération »
  rationale: Le grec ne répète pas σημεῖον, mais le parallélisme l’impose comme prédicat sous-entendu. Sa reprise rend la phrase française claire sans ajouter une affirmation théologique étrangère au texte.
- issue: Sens de « le Fils de l’homme »
  choice: Conserver le titre traditionnel « le Fils de l’homme »
  alternative: « l’Humain » ou « l’être humain »
  rationale: La traduction retenue maintient à la fois la forme de l’expression et sa tension intertextuelle, sans imposer une interprétation unique du titre.
translation_notes:
  register: Français international moderne, clair et digne. La construction corrélative « tout comme… de même… » conserve le parallélisme rhétorique, tandis que « est devenu » maintient la nuance de γίνομαι.
