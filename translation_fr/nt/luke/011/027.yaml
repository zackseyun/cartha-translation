id: LUK.11.27
reference: Luke 11:27
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἐγένετο δὲ ἐν τῷ λέγειν αὐτὸν ταῦτα ἐπάρασά τις ⸂φωνὴν γυνὴ⸃ ἐκ τοῦ ὄχλου εἶπεν αὐτῷ· Μακαρία ἡ κοιλία ἡ βαστάσασά σε καὶ μαστοὶ οὓς ἐθήλασας·
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/027.yaml
  text: And it happened[a], as he was saying these things, that a woman from the crowd raised her voice and said to him, “Blessed is the womb that carried you[b], and the breasts that nursed you.”
translation:
  language: fr
  text: 'Or, tandis qu’il disait cela, une femme de la foule éleva la voix[a] et lui dit : « Heureux le ventre qui t’a porté[b], et les seins que tu as tétés ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « s’écria ». L’expression grecque signifie littéralement « éleva la voix ».
    reason: lexical_alternative
  - marker: b
    text: Ou « qui t’a porté dans son sein ». Le verbe grec désigne le fait de porter un enfant durant la grossesse.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: Or, … il arriva que
  rationale: Conserve la formule de transition narrative de Luc sans recourir à l’archaïque « il advint que ».
- source_word: ἐν τῷ λέγειν αὐτὸν ταῦτα
  choice: pendant qu’il disait cela
  rationale: Rend la simultanéité et l’aspect duratif de la construction avec l’infinitif articulé.
- source_word: ἐπάρασά τις φωνὴν γυνὴ
  choice: une femme … éleva la voix
  rationale: Rend directement l’expression idiomatique grecque ; τις a ici une valeur indéfinie et n’exige pas le lourd « une certaine femme ».
- source_word: ἐκ τοῦ ὄχλου
  choice: du milieu de la foule
  rationale: Exprime naturellement en français la provenance de la voix au sein de la foule.
- source_word: Μακαρία
  choice: Heureux
  rationale: Dans cette formulation apparentée aux béatitudes, « heureux » exprime le statut favorable proclamé, et non un simple sentiment subjectif.
- source_word: ἡ κοιλία
  choice: le ventre
  rationale: Le contexte maternel indique le ventre comme lieu de la gestation. Ce choix maintient aussi la distinction concrète avec les seins mentionnés ensuite.
- source_word: ἡ βαστάσασά σε
  choice: qui t’a porté
  rationale: βαστάζω évoque ici le fait de porter un enfant durant la grossesse ; la formulation française est naturelle tout en conservant l’image.
- source_word: μαστοὶ οὓς ἐθήλασας
  choice: les seins que tu as tétés
  rationale: Conserve l’image anatomique et respecte la syntaxe grecque, où Jésus est le sujet de l’action de téter, plutôt que d’attribuer figurément l’allaitement aux seins.
theological_decisions:
- issue: Portée de μακαρία dans l’exclamation qui honore la mère de Jésus
  choice: « Heureux le ventre qui t’a porté… »
  alternative: « Béni soit le ventre qui t’a porté… » ou « Heureuse celle qui t’a porté… »
  rationale: « Heureux » garde la force d’une béatitude sans transformer μακαρία en formule explicite de bénédiction ni remplacer l’image corporelle du texte par une désignation directe de la mère. La traduction n’atténue ni n’amplifie la portée mariale de l’exclamation.
translation_notes:
  register: Français international actuel, au registre narratif digne. La tournure « il arriva que » préserve le rythme lucanien sans archaïsme marqué. L’image corporelle, volontairement concrète dans le grec, est maintenue.
