id: LUK.11.8
reference: Luke 11:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: λέγω ὑμῖν, εἰ καὶ οὐ δώσει αὐτῷ ἀναστὰς διὰ τὸ εἶναι ⸂φίλον αὐτοῦ⸃, διά γε τὴν ἀναίδειαν αὐτοῦ ἐγερθεὶς δώσει αὐτῷ ⸀ὅσων χρῄζει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/008.yaml
  text: I tell you[a], even if he will not get up and give him anything because he is his friend, yet because of his shameless persistence he will get up and give him whatever he needs.
translation:
  language: fr
  text: Je vous le dis, même s’il ne se lève pas pour lui donner quoi que ce soit parce qu’il est son ami, il se lèvera pourtant à cause de son insistance sans gêne[a] et lui donnera tout ce dont il a besoin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à cause de son audace », « de son effronterie » ou, plus littéralement, « de son absence de honte ».
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω ὑμῖν
  choice: Je vous le dis
  rationale: Formule introductive directe et idiomatique dans le discours de Jésus.
- source_word: εἰ καὶ οὐ δώσει αὐτῷ ἀναστὰς
  choice: même s’il ne se lève pas pour lui donner
  rationale: « Même si » conserve la valeur concessive de εἰ καί, tandis que « se lever » convient naturellement à la scène nocturne.
- source_word: διὰ τὸ εἶναι φίλον αὐτοῦ
  choice: parce qu’il est son ami
  rationale: La formulation garde la relation personnelle exprimée par φίλον αὐτοῦ sans l’abstraire en « amitié ».
- source_word: διά γε
  choice: pourtant à cause de
  rationale: « Pourtant » marque le contraste appuyé entre le motif insuffisant de l’amitié et le motif qui entraîne l’action.
- source_word: ἀναίδειαν
  choice: insistance sans gêne
  rationale: Cette expression française naturelle conserve à la fois l’idée contextuelle d’insistance et la nuance littérale d’absence de honte ou de retenue.
- source_word: ἐγερθεὶς δώσει αὐτῷ
  choice: il se lèvera ... et lui donnera
  rationale: Dans ce contexte domestique, ἐγερθείς désigne le fait de quitter le lit; une proposition coordonnée rend naturellement le participe grec.
- source_word: ὅσων χρῄζει
  choice: tout ce dont il a besoin
  rationale: La tournure exprime l’ensemble ou la quantité complète des choses nécessaires.
- source_word: objet implicite après δώσει dans la première proposition
  choice: ce qu’il demande
  rationale: Le français exige ici un complément; celui-ci est fourni par le contexte immédiat de la requête, sans ajouter un contenu précis absent du grec.
theological_decisions:
- issue: Sens de ἀναίδεια dans la parabole
  choice: L’expression désigne l’insistance sans gêne du demandeur.
  alternative: « effronterie », « audace » ou, plus littéralement, « absence de honte »
  rationale: Le terme grec comporte une nuance socialement négative que « persévérance » seule effacerait. « Insistance sans gêne » garde cette tension sans transformer le verset en approbation générale de l’impudence.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve la structure concessive et le contraste du grec, tandis que la note maintient l’ambiguïté lexicale de ἀναίδεια.
