reference: Luke 11:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐπὰν ⸀δὲ ἰσχυρότερος ⸀αὐτοῦ ἐπελθὼν νικήσῃ αὐτόν, τὴν πανοπλίαν αὐτοῦ αἴρει ἐφ’ ᾗ ἐπεποίθει, καὶ τὰ σκῦλα αὐτοῦ διαδίδωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/022.yaml
  text: But when one stronger than he comes upon him and overpowers him[a], he takes away his full armor on which he had relied[c][b], and distributes his plunder.
translation:
  language: fr
  text: Mais lorsque quelqu’un de plus fort que lui vient l’attaquer et le vainc[a], il lui enlève son armure complète[b], sur laquelle il comptait, puis il distribue son butin[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le défait » ou « le maîtrise ».
    reason: lexical_alternative
  - marker: b
    text: Le terme grec désigne une armure complète.
    reason: lexical_alternative
  - marker: c
    text: Ou « ses dépouilles ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὰν δὲ
  choice: Mais lorsque
  rationale: « Mais » marque le contraste avec la situation du verset précédent, et « lorsque » rend naturellement la valeur temporelle éventuelle de ἐπάν.
- source_word: ἰσχυρότερος αὐτοῦ
  choice: un plus fort que lui
  rationale: Le comparatif grec est substantivé sans nom exprimé. Cette formulation française conserve cette sobriété sans ajouter « homme », tout en restant intelligible grâce au contexte.
- source_word: ἐπελθὼν
  choice: survient
  rationale: Le verbe évoque le fait de venir sur ou contre quelqu’un. « Survient » préserve le mouvement de la scène sans expliciter davantage l’idée d’une attaque.
- source_word: νικήσῃ αὐτόν
  choice: le vainc
  rationale: « Vaincre » exprime directement la victoire qui permet ensuite de désarmer l’adversaire; « maîtrise » ou « défait » demeurent possibles.
- source_word: τὴν πανοπλίαν αὐτοῦ
  choice: l’armure complète
  rationale: πανοπλία désigne l’ensemble complet de l’équipement défensif, nuance que conserve l’adjectif « complète ».
- source_word: αἴρει
  choice: il lui enlève
  rationale: Dans ce contexte, αἴρω indique que le vainqueur retire au vaincu son armure; le pronom « lui » rend clairement cette relation en français.
- source_word: ἐφ’ ᾗ ἐπεποίθει
  choice: sur laquelle il comptait
  rationale: Cette expression française naturelle traduit la confiance durable placée dans l’armure sans alourdir la phrase.
- source_word: τὰ σκῦλα αὐτοῦ
  choice: son butin
  rationale: σκῦλα désigne les biens pris à un ennemi vaincu. « Butin » rend clairement cette image militaire, tout en laissant ouverte dans le contexte l’identification précise de ces biens.
- source_word: διαδίδωσιν
  choice: il distribue
  rationale: Le verbe signifie répartir ou distribuer entre plusieurs destinataires. « Distribue » en conserve la valeur sans préciser qui reçoit le butin.
theological_decisions:
- issue: Faut-il identifier explicitement le personnage comme « un homme plus fort »?
  choice: Conserver « un plus fort que lui » sans ajouter « homme ».
  alternative: « un homme plus fort que lui »
  rationale: Le grec emploie un adjectif comparatif substantivé et n’exprime pas le nom « homme » dans ce verset. Le contexte suffit à rendre l’image compréhensible; ne pas ajouter le nom préserve la formulation et l’ambiguïté du texte.
- issue: Quelle force donner à νικάω dans cette scène de conflit?
  choice: Traduire par « le vainc ».
  alternative: « le maîtrise » ou « le défait »
  rationale: « Vaincre » exprime la victoire effective qui conduit au désarmement et à la prise du butin, sans identifier explicitement les figures de l’image ni imposer une interprétation théologique.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve l’image militaire et le contraste avec le verset précédent, sans expliciter l’identité des personnages. « Sur laquelle il comptait » est idiomatique tout en maintenant l’idée de confiance placée dans l’armure.
