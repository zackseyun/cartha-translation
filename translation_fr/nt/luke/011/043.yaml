id: LUK.11.43
reference: Luke 11:43
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὐαὶ ὑμῖν τοῖς Φαρισαίοις, ὅτι ἀγαπᾶτε τὴν πρωτοκαθεδρίαν ἐν ταῖς συναγωγαῖς καὶ τοὺς ἀσπασμοὺς ἐν ταῖς ἀγοραῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/043.yaml
  text: Woe to you Pharisees[b][a], because you love the best seats in the synagogues and greetings in the marketplaces.
translation:
  language: fr
  text: Malheur à vous, pharisiens, parce que vous aimez les places d’honneur[a] dans les synagogues et les salutations[b] sur les places publiques.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les premiers sièges » ou « les meilleures places ».
    reason: lexical_alternative
  - marker: b
    text: Il s’agit de salutations publiques qui exprimaient l’honneur et la reconnaissance sociale.
    reason: cultural_note
lexical_decisions:
- source_word: οὐαὶ
  choice: Malheur à
  rationale: Cette formule conserve la force de la dénonciation prophétique, plutôt que de réduire l’expression à une simple plainte.
- source_word: ὑμῖν τοῖς Φαρισαίοις
  choice: à vous, pharisiens
  rationale: Le complément et l’adresse directe sont conservés dans une syntaxe française naturelle. La minuscule à « pharisiens » suit l’usage courant pour les membres d’un groupe religieux.
- source_word: ὅτι
  choice: parce que
  rationale: Introduit clairement la raison de la déclaration de malheur.
- source_word: ἀγαπᾶτε
  choice: vous aimez
  rationale: Rendu direct qui exprime ici un fort attachement aux marques de prestige, sans ajouter cette interprétation au corps du texte.
- source_word: τὴν πρωτοκαθεδρίαν
  choice: les places d’honneur
  rationale: Le singulier grec désigne collectivement les sièges les plus prestigieux. « Places d’honneur » transmet naturellement leur valeur sociale plutôt que leur seul emplacement.
- source_word: ἐν ταῖς συναγωγαῖς
  choice: dans les synagogues
  rationale: Rendu français standard et précis du cadre religieux indiqué.
- source_word: τοὺς ἀσπασμοὺς
  choice: les salutations
  rationale: Conserve le sens concret de salutations reçues, tandis qu’une note explicite leur portée honorifique dans ce contexte.
- source_word: ἐν ταῖς ἀγοραῖς
  choice: sur les places publiques
  rationale: Dans ce contexte, ἀγοραί désigne les espaces publics où se tenaient marchés et rencontres sociales. Cette formulation française met en valeur le caractère public de la reconnaissance recherchée.
theological_decisions:
- issue: Nature de la dénonciation de Jésus
  choice: Une déclaration prophétique de malheur contre l’amour des honneurs publics
  alternative: Une simple critique sociale de comportements prétentieux
  rationale: οὐαί, suivi des motifs de la dénonciation, donne à la parole une portée morale et spirituelle. La traduction en préserve la force sans développer une interprétation doctrinale supplémentaire.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve le parallélisme grec entre les places d’honneur dans les synagogues et les salutations dans l’espace public.
