id: LUK.11.44
reference: Luke 11:44
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὐαὶ ⸀ὑμῖν, ὅτι ἐστὲ ὡς τὰ μνημεῖα τὰ ἄδηλα, καὶ οἱ ἄνθρωποι ⸀οἱ περιπατοῦντες ἐπάνω οὐκ οἴδασιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/044.yaml
  text: Woe to you, because you are like unmarked tombs, and the men walking over them do not know it.
translation:
  language: fr
  text: 'Malheur à vous, car vous êtes comme des tombeaux qu’on ne voit pas : les gens marchent dessus sans le savoir.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐαὶ ὑμῖν
  choice: Malheur à vous !
  rationale: Formule française naturelle et solennelle qui conserve la force de l’avertissement prophétique.
- source_word: τὰ μνημεῖα τὰ ἄδηλα
  choice: des tombeaux qu’on ne voit pas
  rationale: ἄδηλα désigne ce qui n’est pas visible ou reconnaissable. Cette formulation exprime clairement que les tombeaux ne sont pas repérés, sans ajouter l’idée précise d’une absence de marque.
- source_word: οἱ ἄνθρωποι
  choice: les gens
  rationale: Dans ce contexte générique, ἄνθρωποι vise les êtres humains qui passent, sans insister sur le sexe masculin.
- source_word: περιπατοῦντες ἐπάνω
  choice: marchent dessus
  rationale: Rend directement l’action de marcher au-dessus ou sur les tombeaux, dans un français courant.
- source_word: οὐκ οἴδασιν
  choice: sans le savoir
  rationale: Restitue idiomatiquement leur ignorance du fait qu’ils marchent sur des tombeaux.
theological_decisions:
- issue: Impureté rituelle implicite liée au contact avec un tombeau
  choice: Ne pas expliciter l’impureté dans le corps du verset
  alternative: Ajouter que les passants deviennent impurs sans le savoir
  rationale: L’allusion est culturellement et théologiquement pertinente, mais le grec du verset ne l’énonce pas. L’expliciter résoudrait une implication que le texte laisse au lecteur.
translation_notes:
  register: Français international moderne, digne et oralement fluide. La ponctuation en deux phrases avec deux-points conserve le lien causal tout en évitant une lourde répétition de « parce que ».
