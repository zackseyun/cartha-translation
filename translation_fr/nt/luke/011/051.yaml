review_pass:
  verdict: revise
  source_fidelity: La structure « du sang d’Abel jusqu’au sang de Zacharie » rend plus directement ἀπὸ ... ἕως que « depuis ... jusqu’à ». « Qui a péri » préserve à juste titre l’ambiguïté de ἀπολομένου. La formule passive « il en sera demandé compte à cette génération » restitue convenablement la portée judiciaire de ἐκζητηθήσεται sans expliciter l’agent divin.
  naturalness: « La Maison », même avec majuscule, est peu naturel et insuffisamment transparent en français international moderne dans cette phrase. « Le temple » est l’équivalent contextuel idiomatique de τοῦ οἴκου; une note peut conserver le littéral « maison ». La ponctuation avec deux-points après « je vous le dis » rend naturellement l’énoncé solennel.
  terminology: « Zacharie », « autel », « temple » et « cette génération » sont stables et naturels. La note maintient l’incertitude historique sur l’identité de Zacharie sans trancher la question.
