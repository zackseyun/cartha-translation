reference: Luke 11:51
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸀ἀπὸ αἵματος Ἅβελ ⸀ἕως αἵματος Ζαχαρίου τοῦ ἀπολομένου μεταξὺ τοῦ θυσιαστηρίου καὶ τοῦ οἴκου· ναί, λέγω ὑμῖν, ἐκζητηθήσεται ἀπὸ τῆς γενεᾶς ταύτης.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/051.yaml
  text: from the blood of Abel to the blood of Zechariah[a], who perished between the altar and the house. Yes, I tell you[b], it will be required from this generation.
translation:
  language: fr
  text: 'du sang d’Abel jusqu’au sang de Zacharie[a], qui a péri entre l’autel et le temple[b]. Oui, je vous le dis : il en sera demandé compte à cette génération.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’identité de ce Zacharie est discutée. Il pourrait s’agir de Zacharie, fils de Joïada (2 Chroniques 24.20-22), ou de Zacharie, fils de Bérékia.
    reason: cross_reference
  - marker: b
    text: 'Littéralement : « entre l’autel et la maison ». Dans ce contexte, « la maison » désigne le temple.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ αἵματος Ἅβελ … ἕως αἵματος Ζαχαρίου
  choice: depuis le sang d’Abel jusqu’au sang de Zacharie
  rationale: Conserve le parallélisme et l’étendue rhétorique du grec, tout en employant une tournure naturelle en français biblique moderne.
- source_word: τοῦ ἀπολομένου
  choice: qui a péri
  rationale: Rend le participe de ἀπόλλυμι sans préciser davantage l’agent de la mort, bien que le contexte implique une mort violente.
- source_word: μεταξὺ τοῦ θυσιαστηρίου καὶ τοῦ οἴκου
  choice: entre l’autel et la Maison
  rationale: « Maison » conserve le sens premier de οἶκος et son emploi comme désignation de la maison de Dieu; la majuscule aide à signaler la référence au sanctuaire sans remplacer le terme source par une explicitation.
- source_word: ναί, λέγω ὑμῖν
  choice: Oui, je vous le dis
  rationale: Expression française naturelle qui garde l’affirmation solennelle et emphatique du grec.
- source_word: ἐκζητηθήσεται ἀπὸ τῆς γενεᾶς ταύτης
  choice: il en sera demandé compte à cette génération
  rationale: Cette formulation idiomatique conserve le passif et la portée judiciaire de ἐκζητέω, sans ajouter explicitement celui qui demandera des comptes. « Cette génération » rend directement γενεᾶς ταύτης.
theological_decisions:
- issue: Identité de Zacharie et portée de l’accusation
  choice: Le texte ne précise pas de quel Zacharie il s’agit et maintient « cette génération » sans élargissement doctrinal.
  alternative: Identifier Zacharie au fils de Yehoyada, au fils de Bérékia, ou à une figure représentative des prophètes martyrs.
  rationale: Le grec nomme simplement Zacharie. La traduction préserve donc l’ambiguïté historique ainsi que la force judiciaire de la déclaration sans imposer une identification ou un système théologique.
translation_notes:
  register: Français international moderne, digne et accessible. « La Maison » garde l’image biblique tout en désignant clairement, par la majuscule et la note, l’édifice du Temple. La tournure « il en sera demandé compte » exprime naturellement la reddition de comptes liée au sang versé.
