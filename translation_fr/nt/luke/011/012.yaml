  yaml_path: translation/nt/luke/011/012.yaml
  text: Or if he asks for an egg, will he give him a scorpion?
translation:
  language: fr
  text: Ou encore, s’il demande un œuf, lui donnera-t-il un scorpion ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἢ καὶ
  choice: Ou, s’il
  rationale: Introduit naturellement en français le nouvel exemple parallèle de la série rhétorique; καί n’a pas besoin d’être rendu séparément ici.
- source_word: αἰτήσει
  choice: demande
  rationale: Le futur grec fonctionne dans une tournure conditionnelle; le présent français après « si » est idiomatique et exprime clairement la demande.
- source_word: ᾠόν
  choice: un œuf
  rationale: Équivalent direct et courant du nom grec.
- source_word: ἐπιδώσει
  choice: donnera-t-il
  rationale: Rend naturellement le futur et la question rhétorique; le verbe désigne ici l’action de donner en réponse à une demande.
- source_word: αὐτῷ
  choice: lui
  rationale: Le pronom datif est rendu par le pronom français d’objet indirect.
- source_word: σκορπίον
  choice: un scorpion
  rationale: Équivalent direct qui conserve le contraste saisissant et absurde avec l’œuf.
theological_decisions:
- issue: Force rhétorique de l’analogie entre le père et l’enfant
  choice: Conserver une question rhétorique directe, sans explication ajoutée.
  alternative: Ajouter « à la place » pour expliciter le contraste.
  rationale: Le grec laisse le contraste implicite. La formulation française le fait comprendre sans résoudre ni développer le propos au-delà du texte.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe interrogative avec inversion maintient la force rhétorique du texte.
