id: LUK.11.50
reference: Luke 11:50
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἵνα ἐκζητηθῇ τὸ αἷμα πάντων τῶν προφητῶν τὸ ἐκκεχυμένον ἀπὸ καταβολῆς κόσμου ἀπὸ τῆς γενεᾶς ταύτης,
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/050.yaml
  text: so that the blood of all the prophets[a], shed from the foundation of the world, may be required of this generation,
translation:
  language: fr
  text: afin que cette génération ait à répondre du sang de tous les prophètes[a], versé depuis la fondation du monde,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : «que le sang de tous les prophètes […] soit réclamé à cette génération». Le verbe exprime ici l’idée de demander des comptes pour le sang versé.'
    reason: alternative_lexicale
lexical_decisions:
- source_word: ἵνα
  choice: afin que
  rationale: Introduit la visée ou le résultat lié au contexte précédent et conserve naturellement la force télique de la proposition.
- source_word: ἐκζητηθῇ
  choice: ait à répondre de
  rationale: Dans ce contexte de sang versé, le verbe passif exprime une demande de comptes. Cette tournure française rend clairement la responsabilité judiciaire sans ajouter une théorie particulière de la culpabilité collective.
- source_word: τὸ αἷμα
  choice: du sang
  rationale: Conserve l’image explicite du grec; le sang évoque ici, par métonymie, la responsabilité liée au meurtre des prophètes.
- source_word: πάντων τῶν προφητῶν
  choice: de tous les prophètes
  rationale: Reproduit la portée exhaustive de πάντων et la relation génitive.
- source_word: τὸ ἐκκεχυμένον
  choice: versé
  rationale: Participe passif qualifiant le sang; «sang versé» est l’expression française idiomatique pour une mort violente.
- source_word: ἀπὸ καταβολῆς κόσμου
  choice: depuis la fondation du monde
  rationale: Rend l’expression biblique établie tout en indiquant clairement le point de départ temporel.
- source_word: ἀπὸ τῆς γενεᾶς ταύτης
  choice: cette génération ait à répondre
  rationale: Le complément introduit par ἀπό désigne la partie à qui des comptes sont demandés; la restructuration active est naturelle en français et conserve cette relation.
theological_decisions:
- issue: Nature de la demande concernant le sang des prophètes
  choice: Une mise en cause judiciaire de «cette génération», appelée à répondre du sang accumulé des prophètes.
  alternative: Une simple affirmation rhétorique de continuité historique, sans forte portée judiciaire.
  rationale: Dans les contextes de sang versé, ἐκζητέω exprime naturellement l’idée de demander des comptes. La formulation maintient cette portée tout en laissant intacte la tension concernant la manière dont une génération répond des actes antérieurs.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure «avoir à répondre de» évite le calque peu naturel «le sang soit requis de» tout en préservant la force judiciaire du grec. La virgule finale est conservée puisque le verset se poursuit syntaxiquement au verset suivant.
