id: LUK.11.13
reference: Luke 11:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἰ οὖν ὑμεῖς πονηροὶ ὑπάρχοντες οἴδατε δόματα ἀγαθὰ διδόναι τοῖς τέκνοις ὑμῶν, πόσῳ μᾶλλον ὁ πατὴρ ὁ ἐξ οὐρανοῦ δώσει πνεῦμα ἅγιον τοῖς αἰτοῦσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/013.yaml
  text: If you[a], then, being evil, know how to give good gifts to your children[b], how much more will the Father from heaven give the Holy Spirit to those who ask him.
translation:
  language: fr
  text: Si donc vous, qui êtes mauvais, savez donner de bons dons à vos enfants, combien plus le Père du ciel[a] donnera-t-il l’Esprit saint[b] à ceux qui lui demandent !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Certaines traductions rendent cette expression par « votre Père céleste », par rapprochement avec Matthieu 7.11. Le grec de Luc ne dit pas « votre » et porte « le Père du ciel ».
    reason: alternative_reading
  - marker: b
    text: Dans Matthieu 7.11, le passage parallèle porte « de bonnes choses », tandis que Luc nomme ici « l’Esprit saint ».
    reason: cross_reference
lexical_decisions:
- source_word: εἰ οὖν ὑμεῖς πονηροὶ ὑπάρχοντες
  choice: Si donc vous, qui êtes mauvais
  rationale: La proposition relative rend naturellement en français la construction participiale descriptive, avec sa nuance concessive implicite, sans atténuer le jugement moral exprimé par πονηροί.
- source_word: οἴδατε … διδόναι
  choice: savez donner
  rationale: En français, « savoir » suivi de l’infinitif exprime ici la capacité pratique, conformément à la construction grecque.
- source_word: δόματα ἀγαθὰ
  choice: de bons cadeaux
  rationale: « Cadeaux » conserve le sens concret de δόματα, plus précis que le terme général « choses ».
- source_word: τοῖς τέκνοις ὑμῶν
  choice: à vos enfants
  rationale: Traduction courante et exacte dans ce contexte familial.
- source_word: πόσῳ μᾶλλον
  choice: combien plus
  rationale: Cette tournure maintient explicitement l’argument a fortiori du grec tout en restant claire en français soutenu courant.
- source_word: ὁ πατὴρ ὁ ἐξ οὐρανοῦ
  choice: le Père du ciel
  rationale: Cette formulation concise conserve l’idée d’origine ou de provenance portée par ἐξ οὐρανοῦ, sans ajouter « votre » ni harmoniser le texte avec Matthieu 7.11.
- source_word: πνεῦμα ἅγιον
  choice: l’Esprit saint
  rationale: Dans ce contexte lucanien, l’expression désigne l’Esprit divin. L’article est requis par l’usage français, et la graphie « Esprit saint » marque ce référent personnel sans surtraduction.
- source_word: τοῖς αἰτοῦσιν αὐτόν
  choice: à ceux qui le lui demandent
  rationale: Le pronom « lui » représente le Père, référent masculin de αὐτόν. Le pronom « le », requis par l’idiome français avec « demander quelque chose à quelqu’un », reprend le don mentionné, l’Esprit saint.
theological_decisions:
- issue: Référent de πνεῦμα ἅγιον
  choice: l’Esprit saint, compris comme l’Esprit divin personnel
  alternative: un esprit saint
  rationale: Même sans article en grec, le contexte présente l’Esprit de Dieu comme le don accordé par le Père. La traduction française définie exprime ce sens idiomatique sans développer la doctrine au-delà du texte.
- issue: Rapport avec le parallèle de Matthieu 7.11
  choice: 'conserver les formulations propres à Luc : « le Père du ciel » et « l’Esprit saint »'
  alternative: harmoniser avec « votre Père céleste » ou « de bonnes choses »
  rationale: La traduction suit le texte grec de Luc, qui ne contient pas « votre » et nomme précisément l’Esprit saint comme don.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve la vigueur de l’interpellation et la structure comparative de l’argument. « Le Père du ciel » est volontairement moins idiomatique que « le Père céleste », afin de préserver la formulation distinctive de Luc et la valeur de provenance de ἐξ.
