id: LUK.11.4
reference: Luke 11:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἄφες ἡμῖν τὰς ἁμαρτίας ἡμῶν, καὶ γὰρ αὐτοὶ ἀφίομεν παντὶ ὀφείλοντι ἡμῖν· καὶ μὴ εἰσενέγκῃς ἡμᾶς εἰς ⸀πειρασμόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/004.yaml
  text: And forgive us our sins[a], for we ourselves also forgive everyone indebted to us[c][b]. And do not bring us into temptation.
translation:
  language: fr
  text: Et pardonne-nous nos péchés, car nous-mêmes, nous pardonnons aussi à toute personne qui a une dette envers nous[a]. Et ne nous fais pas entrer dans la tentation[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à quiconque nous doit quelque chose ». Le grec emploie ici le langage de la dette, alors que la première proposition parle de « péchés ».
    reason: lexical_alternative
  - marker: b
    text: Ou « dans l’épreuve ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄφες
  choice: pardonne
  rationale: Dans cette prière, l’impératif de ἀφίημι signifie naturellement « pardonner ». Ce choix est direct, courant et digne.
- source_word: τὰς ἁμαρτίας ἡμῶν
  choice: nos péchés
  rationale: ἁμαρτίας désigne explicitement les « péchés », et non les « dettes », dans la première proposition.
- source_word: καὶ γὰρ αὐτοὶ
  choice: car nous-mêmes aussi
  rationale: « Car » exprime la justification introduite par γάρ, tandis que « nous-mêmes aussi » conserve à la fois l’insistance de αὐτοί et la valeur additive de καί.
- source_word: ἀφίομεν
  choice: nous pardonnons
  rationale: La répétition de « pardonner » maintient le lien verbal avec ἄφες et convient au contexte interpersonnel, sans effacer l’image de la dette portée par le complément.
- source_word: παντὶ ὀφείλοντι ἡμῖν
  choice: à toute personne qui a une dette envers nous
  rationale: Cette formulation conserve le langage explicite de la dette tout en restant compréhensible en français moderne. « Toute personne » rend la portée distributive de παντί.
- source_word: μὴ εἰσενέγκῃς ἡμᾶς εἰς πειρασμόν
  choice: ne nous fais pas entrer dans la tentation
  rationale: εἰσφέρω signifie littéralement faire entrer ou amener dans. La formulation française reste naturelle et préserve la tension de la demande sans l’expliquer ni l’atténuer.
- source_word: πειρασμόν
  choice: tentation
  rationale: « Tentation » est un sens contextuellement plausible et immédiatement intelligible de πειρασμός; l’autre sens important, « épreuve », est signalé en note.
theological_decisions:
- issue: Rapport entre les « péchés » pardonnés par Dieu et la dette de ceux auxquels les disciples pardonnent
  choice: Conserver « péchés » dans la première proposition et le langage de la dette dans la seconde
  alternative: Uniformiser les deux propositions en parlant seulement d’offenses ou de fautes
  rationale: Le grec emploie ἁμαρτίας dans la première proposition, puis ὀφείλοντι dans la seconde. La traduction maintient cette variation porteuse de sens au lieu de l’aplanir.
- issue: Sens de la demande concernant πειρασμός
  choice: « ne nous fais pas entrer dans la tentation »
  alternative: « ne nous fais pas entrer dans l’épreuve »
  rationale: La formulation principale conserve le sens traditionnel et plausible de « tentation », tout en laissant intacte la tension théologique du grec. La note indique l’autre sens lexical sans imposer une interprétation doctrinale.
translation_notes:
  register: Français international moderne, simple et digne. La reprise « nous-mêmes aussi, nous pardonnons » marque l’insistance du grec sans devenir excessivement littérale. Le langage distinct des péchés et de la dette est volontairement conservé.
