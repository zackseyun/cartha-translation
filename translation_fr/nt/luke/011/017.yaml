reference: Luke 11:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: αὐτὸς δὲ εἰδὼς αὐτῶν τὰ διανοήματα εἶπεν αὐτοῖς· Πᾶσα βασιλεία ἐφ’ ἑαυτὴν διαμερισθεῖσα ἐρημοῦται, καὶ οἶκος ἐπὶ οἶκον πίπτει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/017.yaml
  text: But he[a], knowing their thoughts, said to them, “Every kingdom divided against itself is laid waste, and a house falls upon a house.”
translation:
  language: fr
  text: 'Mais lui, sachant ce qu’ils pensaient, leur dit : « Tout royaume divisé contre lui-même est dévasté, et une maison tombe sur une autre[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une maisonnée tombe sur une autre ». Le mot grec traduit par « maison » peut aussi désigner une maisonnée ou une famille.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδὼς αὐτῶν τὰ διανοήματα
  choice: sachant ce qu’ils pensaient
  rationale: Cette formulation naturelle en français exprime la connaissance des réflexions intérieures désignée par le participe εἰδὼς et le nom διανοήματα, sans préciser davantage leur nature ni leur intention.
- source_word: Πᾶσα βασιλεία
  choice: Tout royaume
  rationale: « Tout royaume » conserve la portée générale et distributive de πᾶσα dans cette maxime.
- source_word: ἐφ’ ἑαυτὴν διαμερισθεῖσα
  choice: divisé contre lui-même
  rationale: La tournure rend l’idée d’une division interne devenue opposition, tout en restant idiomatique et proche de la structure grecque.
- source_word: ἐρημοῦται
  choice: est dévasté
  rationale: « Est dévasté » conserve la voix passive et l’idée forte de ruine ou de désolation, plutôt que celle d’un simple affaiblissement.
- source_word: οἶκος ἐπὶ οἶκον
  choice: une maison tombe sur une autre
  rationale: Le rendu maintient l’image concrète et la formulation condensée du grec. L’article indéfini est nécessaire en français courant, tandis que « sur » reflète le sens premier de ἐπί avec l’accusatif.
- source_word: πίπτει
  choice: tombe
  rationale: « Tombe » conserve le présent de portée proverbiale et la métaphore simple du verbe grec.
theological_decisions:
- issue: Sens de οἶκος dans la seconde proposition
  choice: maison dans le texte principal
  alternative: famille ou maisonnée
  rationale: οἶκος peut désigner aussi bien un bâtiment qu’une maisonnée. Le contexte n’impose pas définitivement le sens social; le texte principal garde donc l’image littérale, tandis qu’une note préserve l’autre lecture possible.
translation_notes:
  register: Français international moderne, digne et accessible. « Sachant ce qu’ils pensaient » évite un participe lourd sans perdre le rapport logique avec le verbe principal. La seconde proposition reste volontairement imagée et quelque peu condensée afin de préserver l’ambiguïté du grec.
