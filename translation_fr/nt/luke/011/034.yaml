source:
  edition: SBLGNT
  text: ὁ λύχνος τοῦ σώματός ἐστιν ὁ ὀφθαλμός ⸀σου. ⸀ὅταν ὁ ὀφθαλμός σου ἁπλοῦς ᾖ, καὶ ὅλον τὸ σῶμά σου φωτεινόν ἐστιν· ἐπὰν δὲ πονηρὸς ᾖ, καὶ τὸ σῶμά σου σκοτεινόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/034.yaml
  text: The lamp of your body is your eye[a]. When your eye is healthy, your whole body also is full of light; but when it is bad[b], your body also is dark.
translation:
  language: fr
  text: La lampe de ton corps, c’est ton œil. Quand ton œil est sain[a], ton corps tout entier est aussi plein de lumière ; mais quand il est mauvais[b], ton corps aussi est sombre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « simple », « sans partage », « clair » ou « droit ». Le mot grec peut évoquer ce qui est entier, sans duplicité ou en bon état ; ici, il qualifie l’œil par opposition à un œil « mauvais ».
    reason: lexical_alternative
  - marker: b
    text: Le mot grec peut signifier « mauvais » ou « mauvais au sens moral ». Il peut évoquer ici aussi bien un œil défectueux qu’une perception moralement faussée.
    reason: lexical_alternative
lexical_decisions:
- source_word: λύχνος
  choice: lampe
  rationale: Le terme désigne une source concrète de lumière, ici une lampe, et non la lumière au sens abstrait. « Lampe » conserve la métaphore.
- source_word: σῶμα
  choice: corps
  rationale: C’est le sens ordinaire du terme dans cette image, où l’état du corps entier dépend de l’œil.
- source_word: ὀφθαλμός
  choice: œil
  rationale: Le sens littéral est conservé, puisque la métaphore part de l’organe de la vue pour évoquer la perception et l’état intérieur.
- source_word: ἁπλοῦς
  choice: sain
  rationale: Dans son opposition à πονηρός et dans l’image de l’œil qui éclaire le corps, « sain » exprime naturellement en français un œil qui remplit correctement sa fonction. Une note maintient les nuances possibles d’unité, de simplicité ou de droiture.
- source_word: φωτεινός
  choice: plein de lumière
  rationale: Cette expression française rend l’idée de ce qui est lumineux ou rempli de lumière et maintient l’image développée par la lampe.
- source_word: πονηρός
  choice: mauvais
  rationale: Le mot peut décrire ce qui est défectueux ou ce qui est mauvais au sens moral. « Mauvais » préserve mieux cette ambiguïté que « malade » ou « méchant ».
- source_word: σκοτεινός
  choice: dans l’obscurité
  rationale: Cette formulation idiomatique exprime l’état opposé à celui d’un corps plein de lumière, sans introduire une interprétation supplémentaire.
theological_decisions:
- issue: Sens de ἁπλοῦς appliqué à l’œil
  choice: Traduire par « sain » dans le texte principal, avec une note.
  alternative: « simple », « sans partage », « clair » ou « droit »
  rationale: Le contexte immédiat met en scène le bon ou le mauvais fonctionnement de l’œil et son effet sur tout le corps. « Sain » rend clairement l’image en français moderne, tandis que la note préserve les possibles connotations d’unité et de droiture sans imposer une lecture doctrinale.
- issue: Portée de πονηρός appliqué à l’œil
  choice: Traduire par « mauvais » et signaler la nuance morale en note.
  alternative: « malade », « défectueux » ou « mauvais au sens moral »
  rationale: L’image peut évoquer à la fois un œil qui fonctionne mal et une perception moralement faussée. « Mauvais » permet de conserver cette tension.
translation_notes:
  register: Français international moderne, naturel et digne. La tournure présentative « La lampe de ton corps, c’est ton œil » conserve la mise en relief grecque. Le tutoiement singulier suit les pronoms grecs au singulier. Les images de la lampe, de la lumière et de l’obscurité sont maintenues.
