id: LUK.11.42
reference: Luke 11:42
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἀλλὰ οὐαὶ ὑμῖν τοῖς Φαρισαίοις, ὅτι ἀποδεκατοῦτε τὸ ἡδύοσμον καὶ τὸ πήγανον καὶ πᾶν λάχανον, καὶ παρέρχεσθε τὴν κρίσιν καὶ τὴν ἀγάπην τοῦ θεοῦ· ταῦτα ⸀δὲ ἔδει ποιῆσαι κἀκεῖνα μὴ ⸀παρεῖναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/042.yaml
  text: But woe to you Pharisees, because you tithe mint and rue and every herb, and you pass by justice and the love of God. These things you ought to have done, without neglecting those things.
translation:
  language: fr
  text: Mais quel malheur pour vous, pharisiens ! Vous donnez la dîme de la menthe, de la rue et de toutes les plantes potagères, mais vous passez à côté de la justice et de l’amour de Dieu. C’est cela qu’il fallait pratiquer, sans négliger le reste.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐαὶ ὑμῖν
  choice: quel malheur pour vous
  rationale: Exprime naturellement en français moderne la lamentation et la dénonciation portées par οὐαί, sans la réduire à une simple menace.
- source_word: ἀποδεκατοῦτε
  choice: vous donnez la dîme de
  rationale: Rend explicitement la pratique consistant à prélever et donner le dixième.
- source_word: τὸ ἡδύοσμον καὶ τὸ πήγανον καὶ πᾶν λάχανον
  choice: la menthe, de la rue et de toutes les plantes potagères
  rationale: « Rue » désigne la plante πήγανον; « plantes potagères » conserve le sens large de λάχανον dans ce contexte de produits cultivés.
- source_word: παρέρχεσθε
  choice: vous passez à côté de
  rationale: Préserve l’image littérale de passer outre ou à côté, soulignée par la révision anglaise, plutôt que de l’aplanir en « négliger ».
- source_word: τὴν κρίσιν
  choice: la justice
  rationale: Dans ce contexte éthique, κρίσις désigne l’exercice du jugement juste ou la justice.
- source_word: τὴν ἀγάπην τοῦ θεοῦ
  choice: l’amour de Dieu
  rationale: Conserve la formulation génitive et son éventuelle amplitude sémantique, sans préciser arbitrairement s’il s’agit de l’amour envers Dieu ou de celui qui vient de Dieu.
- source_word: ταῦτα δὲ ἔδει ποιῆσαι κἀκεῖνα μὴ παρεῖναι
  choice: C’est cela qu’il fallait pratiquer, sans négliger le reste
  rationale: Le singulier collectif français « cela » renvoie naturellement à la justice et à l’amour de Dieu; « le reste » reprend les pratiques de dîme sans les présenter comme l’essentiel.
theological_decisions:
- issue: Portée du génitif dans « l’amour de Dieu »
  choice: Conserver « l’amour de Dieu »
  alternative: « l’amour pour Dieu » ou « l’amour venant de Dieu »
  rationale: Le grec τοῦ θεοῦ peut appeler plusieurs analyses; la formulation française conserve cette tension sans imposer une interprétation.
- issue: Rapport entre justice, amour et dîme
  choice: « C’est cela qu’il fallait pratiquer, sans négliger le reste »
  alternative: Formulation qui abolirait ou minimiserait explicitement la dîme
  rationale: Le verset donne la priorité à la justice et à l’amour de Dieu tout en déclarant que les autres pratiques ne devaient pas être laissées de côté.
translation_notes:
  register: Français international moderne, direct et digne. L’exclamation après l’adresse restitue la force prophétique de οὐαί. La tournure « passer à côté de » maintient l’image du texte grec et la distinction avec « négliger » dans la dernière proposition.
