  source_fidelity: 'Le texte rend avec fidélité les éléments essentiels du grec : l''exclamation de malheur (οὐαί), la dîme des aromates et de tout légume/herbe potagère, le fait de « passer à côté » de la justice et de l''amour de Dieu, puis l''obligation de faire les premières choses sans laisser les autres de côté. « Passer à côté de » conserve de manière idiomatique l''image de παρέρχεσθε, conformément à la piste d''audit anglaise, sans effacer la distinction finale avec « négliger ».'
  naturalness: Le français est moderne, fluide et d'un registre convenablement direct. « Quel malheur pour vous, pharisiens ! » restitue bien la vigueur prophétique sans recourir à une formulation archaïque. « C'est cela qu'il fallait pratiquer, sans négliger le reste » est naturel et le référent du « reste » est suffisamment clair dans le contexte immédiat.
  terminology: « Pharisiens », « dîme », « rue », « justice » et « amour de Dieu » sont justes et adaptés. « Plantes potagères » est une restitution recevable de λάχανον, terme collectif qui peut désigner des herbes ou légumes de jardin. « L'amour de Dieu » préserve à bon droit l'ambiguïté du génitif grec.
