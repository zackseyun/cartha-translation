id: LUK.11.20
reference: Luke 11:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἰ δὲ ἐν δακτύλῳ ⸀θεοῦ ἐκβάλλω τὰ δαιμόνια, ἄρα ἔφθασεν ἐφ’ ὑμᾶς ἡ βασιλεία τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/020.yaml
  text: But if I cast out the demons by the finger of God[b][a], then the kingdom of God has come upon you.
translation:
  language: fr
  text: Mais si c’est par le doigt de Dieu[a] que je chasse les démons, alors le règne de Dieu vous a atteints[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’expression évoque l’action directe et puissante de Dieu; voir Exode 8.19. On pourrait aussi traduire : « avec le doigt de Dieu ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « est parvenu jusqu’à vous »; autre traduction possible : « vous a rattrapés ».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν δακτύλῳ θεοῦ
  choice: par le doigt de Dieu
  rationale: La préposition ἐν exprime ici le moyen ou l’action. Cette formulation française conserve l’image vive du texte grec et son écho probable à Exode 8.19, sans l’expliciter dans le corps du verset.
- source_word: ἐκβάλλω
  choice: je chasse
  rationale: « Chasser les démons » est l’expression française naturelle et courante pour l’expulsion d’êtres démoniaques; elle rend la force de ἐκβάλλω sans archaïsme.
- source_word: τὰ δαιμόνια
  choice: les démons
  rationale: Équivalent lexical direct, distinct de l’expression grecque signifiant « esprits impurs ».
- source_word: ἄρα
  choice: alors
  rationale: Marque clairement la conclusion tirée de la condition précédente, dans un français naturel.
- source_word: ἔφθασεν ἐφ’ ὑμᾶς
  choice: vous a atteints
  rationale: Le verbe exprime ici une arrivée effective jusqu’aux interlocuteurs. « Vous a atteints » conserve l’aspect décisif et la direction de ἐπί, tout en évitant la nuance excessivement hostile de « vous a rattrapés ».
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: le règne de Dieu
  rationale: Dans cette déclaration sur l’action présente de Dieu, « règne » exprime naturellement l’exercice dynamique de sa souveraineté. « Royaume de Dieu » reste une traduction possible et traditionnelle.
theological_decisions:
- issue: Sens du « doigt de Dieu »
  choice: Conserver la métaphore de l’action ou de la puissance directe de Dieu.
  alternative: Identifier explicitement le doigt de Dieu au Saint-Esprit, par rapprochement avec Matthieu 12.28.
  rationale: Luc emploie cette image précise; la traduction la préserve sans substituer le libellé de Matthieu ni imposer son interprétation dans le texte.
- issue: Portée de l’arrivée du règne de Dieu
  choice: Présenter le règne comme ayant effectivement atteint les auditeurs dans le ministère de Jésus.
  alternative: Comprendre le règne comme uniquement futur, ou donner à la phrase le seul sens hostile de « vous a rattrapés ».
  rationale: L’aoriste ἔφθασεν, avec ἐπί, indique ici une arrivée accomplie. La formulation maintient cette tension entre présence actuelle et portée eschatologique sans construire un système doctrinal supplémentaire.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure clivée « c’est… que » met naturellement en relief le moyen exprimé par ἐν sans ajouter de contenu. « Règne de Dieu » souligne ici la souveraineté divine en action; la note conserve l’ambiguïté de ἔφθασεν ἐπί.
