id: LUK.11.18
reference: Luke 11:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἰ δὲ καὶ ὁ Σατανᾶς ἐφ’ ἑαυτὸν διεμερίσθη, πῶς σταθήσεται ἡ βασιλεία αὐτοῦ; ὅτι λέγετε ἐν Βεελζεβοὺλ ἐκβάλλειν με τὰ δαιμόνια.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/018.yaml
  text: But if Satan also is divided against himself[a], how will his kingdom stand? For you say that I cast out the demons by Beelzebul.
translation:
  language: fr
  text: Mais si Satan, lui aussi, est divisé contre lui-même, comment son royaume tiendra-t-il ? En effet, vous dites que c’est par Béelzébul[a] que j’expulse les démons.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Grec : Béelzébul ; certaines traditions emploient la forme Béelzébub.'
    reason: Signaler l’autre forme traditionnelle du nom tout en suivant la forme du texte grec.
lexical_decisions:
- source_word: Σατανᾶς
  choice: Satan
  rationale: Translittération française usuelle de ce nom ou titre personnel.
- source_word: ἐφ’ ἑαυτὸν διεμερίσθη
  choice: est divisé contre lui-même
  rationale: Avec διαμερίζω, ἐπί suivi du réfléchi exprime ici une opposition interne. Le présent français rend naturellement l’état envisagé dans cette condition, tandis que « contre lui-même » conserve l’image.
- source_word: πῶς σταθήσεται
  choice: comment … tiendra-t-il ?
  rationale: Le futur de ἵστημι évoque ici le fait de subsister ou de rester établi. « Tenir » préserve la métaphore et la force de la question rhétorique.
- source_word: βασιλεία
  choice: royaume
  rationale: « Royaume » désigne ici le domaine ou la domination de Satan et maintient l’image politique du texte.
- source_word: ὅτι
  choice: En effet
  rationale: La conjonction introduit l’explication qui fonde le raisonnement de Jésus dans l’accusation de ses interlocuteurs.
- source_word: ἐν Βεελζεβοὺλ
  choice: par Béelzébul
  rationale: Dans ce contexte, ἐν exprime le moyen ou l’agent supposé. « Par » est idiomatique en français sans expliciter davantage la nature de cette action.
- source_word: Βεελζεβοὺλ
  choice: Béelzébul
  rationale: Cette forme suit directement Βεελζεβούλ dans le texte grec, adaptée à l’usage orthographique français.
- source_word: ἐκβάλλειν
  choice: expulse
  rationale: Le verbe exprime l’action de chasser ou faire sortir avec force. « Expulser » est clair et naturel dans ce contexte.
- source_word: δαιμόνια
  choice: démons
  rationale: Équivalent français direct et conventionnel de δαιμόνια, sans paraphrase interprétative.
theological_decisions:
- issue: Nature de l’accusation portée contre Jésus
  choice: L’accusation affirme que Jésus expulse les démons « par Béelzébul », sans préciser davantage le mécanisme de cette intervention supposée.
  alternative: « par le pouvoir de Béelzébul » ou « en association avec Béelzébul »
  rationale: Le grec ἐν peut indiquer l’agent ou le moyen, mais le texte ne développe pas lui-même la nature exacte du rapport allégué. La formulation retenue préserve cette concision et cette tension.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure « Satan, lui aussi » rend la valeur de καί, et l’interrogation conserve la force rhétorique de l’original.
