id: LUK.11.33
reference: Luke 11:33
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸀Οὐδεὶς λύχνον ἅψας εἰς κρύπτην τίθησιν οὐδὲ ὑπὸ τὸν μόδιον ἀλλ’ ἐπὶ τὴν λυχνίαν, ἵνα οἱ εἰσπορευόμενοι τὸ ⸀φέγγος βλέπωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/033.yaml
  text: No one[a], after lighting a lamp, puts it in a hidden place or under a basket, but on a lampstand[b], so that those who enter may see the light.
translation:
  language: fr
  text: Personne, après avoir allumé une lampe, ne la met ni dans un endroit caché[a] ni sous un récipient de mesure[b], mais sur un porte-lampe, afin que ceux qui entrent voient la lumière.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans un cellier », « dans une cave » ou « dans un lieu secret »; le grec κρύπτη désigne un endroit caché et peut notamment évoquer un espace souterrain servant au stockage.
    reason: lexical_alternative
  - marker: b
    text: 'Le grec μόδιος désigne une mesure de capacité pour les matières sèches, ainsi que le récipient servant à cette mesure; traduction traditionnelle : « boisseau ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐδεὶς
  choice: Personne
  rationale: Équivalent français naturel du pronom négatif indéfini, qui conserve la portée universelle de la négation.
- source_word: λύχνον
  choice: une lampe
  rationale: Le terme désigne une lampe portative, normalement à huile, et non spécifiquement une bougie.
- source_word: ἅψας
  choice: après avoir allumé
  rationale: Le participe aoriste exprime ici une action antérieure à celle du verbe principal; cette formulation en rend naturellement la succession.
- source_word: εἰς κρύπτην
  choice: dans un endroit caché
  rationale: κρύπτη peut désigner un lieu dissimulé, notamment un cellier ou un espace souterrain; le contexte met surtout l’accent sur le fait de cacher la lumière.
- source_word: τίθησιν
  choice: met
  rationale: Verbe français courant et précis pour l’action de placer la lampe.
- source_word: ὑπὸ τὸν μόδιον
  choice: sous un récipient de mesure
  rationale: μόδιος désigne une mesure de capacité et, par métonymie, le récipient correspondant. Cette traduction conserve cette fonction sans recourir au « boisseau », unité traditionnelle devenue peu transparente.
- source_word: ἐπὶ τὴν λυχνίαν
  choice: sur un support
  rationale: λυχνία est le support destiné à recevoir une lampe. « Support » est ici naturel et évite l’anachronisme possible de « lampadaire ».
- source_word: ἵνα
  choice: afin que
  rationale: La locution introduit clairement le but exprimé par ἵνα.
- source_word: οἱ εἰσπορευόμενοι
  choice: ceux qui entrent
  rationale: Rend avec concision le participe présent substantivé désignant les personnes qui entrent.
- source_word: τὸ φέγγος
  choice: la lumière
  rationale: Dans l’image concrète de la lampe, « lumière » rend naturellement φέγγος, qui peut aussi évoquer l’éclat ou la clarté.
- source_word: βλέπωσιν
  choice: voient
  rationale: Le subjonctif français exigé après « afin que » exprime le but du geste.
theological_decisions:
- issue: Portée de κρύπτη
  choice: un endroit caché
  alternative: un cellier; une cave; un lieu secret
  rationale: La formulation générique préserve l’image de la lumière dissimulée sans imposer une architecture précise que le mot grec permet mais n’exige pas.
- issue: Nature du μόδιος
  choice: un récipient de mesure
  alternative: un boisseau; un panier; un panier servant de mesure
  rationale: Le choix conserve la fonction métrologique de l’objet tout en restant compréhensible en français moderne; la note maintient les autres possibilités lexicales.
translation_notes:
  register: Français international moderne, clair et digne. La structure proverbiale et le contraste entre cacher et exposer la lampe sont conservés. « Support » est compris dans le contexte comme un support de lampe.
