id: LUK.11.32
reference: Luke 11:32
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἄνδρες ⸀Νινευῖται ἀναστήσονται ἐν τῇ κρίσει μετὰ τῆς γενεᾶς ταύτης καὶ κατακρινοῦσιν αὐτήν· ὅτι μετενόησαν εἰς τὸ κήρυγμα Ἰωνᾶ, καὶ ἰδοὺ πλεῖον Ἰωνᾶ ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/032.yaml
  text: The men of Nineveh will rise up in the judgment with this generation and will condemn it[a], because they repented at the proclamation of Jonah, and behold, something greater than Jonah is here.
translation:
  language: fr
  text: 'Les hommes de Ninive se lèveront, lors du jugement, avec cette génération et la condamneront, parce qu’ils se sont repentis en réponse à la proclamation de Jonas, et voici : il y a ici plus grand que Jonas[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « quelqu’un de plus grand que Jonas est ici » ou « quelque chose de plus grand que Jonas est ici ». Le grec emploie une forme neutre (« plus grand »), qui peut désigner largement la réalité supérieure présente en Jésus et dans son ministère, et non seulement établir une comparaison entre deux personnes.'
    reason: Lecture alternative et préservation de l’ambiguïté du neutre grec πλεῖον.
lexical_decisions:
- source_word: ἄνδρες Νινευῖται
  choice: Les hommes de Ninive
  rationale: ἄνδρες est explicitement masculin pluriel et Νινευῖται désigne les Ninivites. Cette formulation française est naturelle et conserve la référence masculine du grec.
- source_word: ἀναστήσονται
  choice: se lèveront
  rationale: Le futur de ἀνίστημι évoque ici le fait de se lever dans le cadre eschatologique du jugement, sans expliciter davantage que le texte la résurrection sous-entendue.
- source_word: ἐν τῇ κρίσει
  choice: lors du jugement
  rationale: Cette tournure idiomatique exprime clairement le cadre judiciaire dans lequel ils se lèveront.
- source_word: μετὰ τῆς γενεᾶς ταύτης
  choice: avec cette génération
  rationale: μετά avec le génitif marque l’association. « Cette génération » préserve l’expression synoptique et sa portée historique et morale.
- source_word: κατακρινοῦσιν αὐτήν
  choice: la condamneront
  rationale: κατακρίνω signifie condamner, et le pronom féminin αὐτήν reprend naturellement « cette génération » en français.
- source_word: μετενόησαν
  choice: ils se sont repentis
  rationale: Dans ce contexte prophétique, μετανοέω désigne une repentance morale et spirituelle, et non un simple changement d’avis.
- source_word: εἰς τὸ κήρυγμα Ἰωνᾶ
  choice: à la proclamation de Jonas
  rationale: κήρυγμα désigne la proclamation ou la prédication. Avec εἰς après μετανοέω, la préposition indique ici ce à quoi les Ninivites ont répondu; « à » conserve cette relation de façon concise.
- source_word: ἰδοὺ
  choice: Or voici
  rationale: ἰδού attire solennellement l’attention. « Or voici » garde cette force discursive dans un français actuel et digne.
- source_word: πλεῖον Ἰωνᾶ ὧδε
  choice: il y a ici plus grand que Jonas
  rationale: Le neutre singulier πλεῖον se rend sans imposer un référent exclusivement personnel. Cette formulation française préserve l’ambiguïté entre une personne plus grande et une réalité plus vaste présente en Jésus et dans son ministère.
theological_decisions:
- issue: Référent et portée de πλεῖον Ἰωνᾶ
  choice: il y a ici plus grand que Jonas
  alternative: quelqu’un de plus grand que Jonas est ici / quelque chose de plus grand que Jonas est ici
  rationale: Le grec emploie le neutre πλεῖον. La traduction choisie évite de trancher entre le référent personnel évident et la réalité plus large que peuvent englober Jésus, son œuvre et son message.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche du mouvement du grec tout en étant idiomatique. Le marqueur de note [a] est placé après la proposition qu’il explique.
