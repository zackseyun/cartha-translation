  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὐαὶ ὑμῖν, ὅτι οἰκοδομεῖτε τὰ μνημεῖα τῶν προφητῶν οἱ δὲ πατέρες ὑμῶν ἀπέκτειναν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/047.yaml
  text: Woe to you[b][a], because you build the tombs of the prophets whom your fathers killed.
translation:
  language: fr
  text: Malheur à vous ! Vous construisez les tombeaux[a] des prophètes, alors que vos ancêtres les ont tués.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « monuments funéraires ». Le terme grec peut désigner des tombeaux ou des monuments érigés sur des sépultures.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐαὶ ὑμῖν
  choice: Quel malheur pour vous
  rationale: Formule française naturelle et forte de dénonciation prophétique, sans réduire οὐαί à une simple lamentation.
- source_word: ὅτι
  choice: parce que
  rationale: Exprime clairement la valeur causale qui introduit le motif du malheur annoncé.
- source_word: οἰκοδομεῖτε
  choice: vous construisez
  rationale: Rend directement le présent grec sans lui imposer une valeur progressive particulière.
- source_word: τὰ μνημεῖα
  choice: les tombeaux
  rationale: Le terme désigne ici des sépultures ou monuments funéraires; « tombeaux » est clair et idiomatique.
- source_word: τῶν προφητῶν
  choice: des prophètes
  rationale: Reproduit simplement le complément grec associé aux tombeaux.
- source_word: οἱ δὲ πατέρες ὑμῶν
  choice: tandis que vos ancêtres
  rationale: « Ancêtres » transmet ici le sens collectif de πατέρες sans suggérer seulement les pères immédiats; « tandis que » conserve la juxtaposition contrastive de δέ sans la durcir excessivement.
- source_word: ἀπέκτειναν αὐτούς
  choice: les ont tués
  rationale: Traduction directe qui évite d'ajouter la nuance juridiquement plus forte de « assassinés ».
theological_decisions:
- issue: Faut-il expliciter l'hypocrisie ou la complicité suggérée par la construction des tombeaux des prophètes tués par les ancêtres ?
  choice: 'Conserver la juxtaposition : « vous construisez… tandis que vos ancêtres les ont tués »'
  alternative: « vous construisez les tombeaux des prophètes que vos ancêtres ont tués »
  rationale: Le verset juxtapose les deux actions, tandis que la portée accusatrice est développée au verset suivant. La traduction préserve donc la tension sans expliciter prématurément l'inférence.
translation_notes:
  register: Français international moderne, digne et accessible. L'exclamation finale convient à la force de la dénonciation. Les marqueurs [a] et [b] figurent dans le texte dans l'ordre de leur apparition.
