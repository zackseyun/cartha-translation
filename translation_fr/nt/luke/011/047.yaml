review_pass:
  verdict: revise
  source_fidelity: La traduction rend correctement le motif causal, le présent « construisez », le sens funéraire de μνημεῖα et la référence de « les » aux prophètes. Toutefois, « Malheur à vous ! » est l’équivalent français direct, idiomatique et traditionnel de οὐαὶ ὑμῖν; « Quel malheur pour vous » affaiblit légèrement l’apostrophe proclamatoire. « Alors que » rend mieux la valeur contrastive de δέ que « tandis que », qui peut être compris d’abord temporellement.
  naturalness: Le texte révisé est fluide, moderne et solennel sans archaïsme. « Ancêtres » convient au sens collectif et ancestral de πατέρες dans ce contexte.
  terminology: « Tombeaux », « prophètes » et « ancêtres » sont appropriés. La note sur μνημεῖα conserve utilement l’alternative « monuments funéraires ».
