    rationale: « Quel malheur pour vous » est compréhensible, mais οὐαὶ ὑμῖν est une exclamation adressée directement aux interlocuteurs; « Malheur à vous ! » la reproduit plus exactement.
  - severity: low
    issue: Nuance de δέ
    rationale: « Tandis que » peut signaler une simultanéité temporelle; « alors que » exprime plus naturellement en français la juxtaposition contrastive de la seconde proposition.
  - severity: low
    issue: Note [a] devenue inutile
    rationale: Une fois « Malheur à vous ! » adopté dans le texte, une note le donnant comme sens littéral ne fournit plus d’information alternative.
