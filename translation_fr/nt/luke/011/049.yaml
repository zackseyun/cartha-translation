  text: διὰ τοῦτο καὶ ἡ σοφία τοῦ θεοῦ εἶπεν· Ἀποστελῶ εἰς αὐτοὺς προφήτας καὶ ἀποστόλους, καὶ ἐξ αὐτῶν ἀποκτενοῦσιν καὶ ⸀διώξουσιν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/049.yaml
  text: For this reason also the wisdom of God said[a], ‘I will send to them prophets and apostles, and some of them they will kill and persecute,’
translation:
  language: fr
  text: 'C’est pourquoi la sagesse de Dieu a aussi dit[a] : « Je leur enverrai des prophètes et des apôtres ; ils en tueront et en persécuteront. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la sagesse divine ». L’expression peut désigner la sagesse de Dieu personnifiée, son sage dessein ou une autoréférence implicite de Jésus.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: C’est pourquoi
  rationale: Expression française naturelle qui conserve la valeur causale et déductive du grec.
- source_word: καὶ
  choice: a aussi dit
  rationale: Le placement de « aussi » auprès du verbe est idiomatique en français tout en gardant la nuance additive.
- source_word: ἡ σοφία τοῦ θεοῦ
  choice: la sagesse de Dieu
  rationale: Rendu proche de la construction grecque, qui ne tranche pas entre personnification, dessein sage de Dieu et éventuelle autoréférence implicite de Jésus.
- source_word: εἶπεν
  choice: a dit
  rationale: Passé composé naturel dans un discours français moderne, sans surcharge interprétative.
- source_word: Ἀποστελῶ
  choice: J’enverrai
  rationale: Rend directement le futur actif du verbe grec.
- source_word: εἰς αὐτούς
  choice: leur
  rationale: Avec « envoyer », le pronom indirect est la formulation française la plus naturelle pour exprimer la destination.
- source_word: προφήτας
  choice: des prophètes
  rationale: Équivalent français standard.
- source_word: ἀποστόλους
  choice: des apôtres
  rationale: Conserve le sens vraisemblablement reconnu et technique du terme dans Luc-Actes.
- source_word: ἐξ αὐτῶν
  choice: certains d’entre eux … d’autres
  rationale: Exprime clairement la valeur partitive du grec. L’ajout elliptique de « d’autres » évite en français de laisser entendre que les mêmes individus seront à la fois tués et ensuite persécutés, tout en répartissant les deux actions sur le groupe partitif.
- source_word: ἀποκτενοῦσιν
  choice: ils tueront
  rationale: Rendu direct, courant et vigoureux du futur grec.
- source_word: διώξουσιν
  choice: en persécuteront
  rationale: Dans ce contexte hostile, le verbe désigne la persécution plutôt qu’une simple poursuite.
theological_decisions:
- issue: Sens de « la sagesse de Dieu »
  choice: Conserver « la sagesse de Dieu » sans l’identifier explicitement à Jésus, à l’Écriture ou à une figure distincte personnifiée.
  alternative: Comprendre l’expression comme une personnification de la sagesse divine, comme le sage décret de Dieu ou comme une autoréférence implicite de Jésus.
  rationale: Le contexte permet plusieurs lectures. Une formulation transparente préserve cette tension théologique sans imposer une interprétation particulière.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste naturelle à l’oral comme à l’écrit. « Apôtres » conserve le terme ecclésial reconnu sans préciser davantage leur statut.
