source:
  edition: SBLGNT
  text: Ἐν δὲ τῷ λαλῆσαι ⸀ἐρωτᾷ αὐτὸν ⸀Φαρισαῖος ὅπως ἀριστήσῃ παρ’ αὐτῷ· εἰσελθὼν δὲ ἀνέπεσεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/037.yaml
  text: While he was speaking[a], a Pharisee asks him to dine with him[b]; so he went in and reclined at the table.
translation:
  language: fr
  text: Pendant qu’il parlait, un pharisien lui demande de prendre un repas chez lui ; il entra et se mit à table[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe grec évoque le fait de prendre place pour le repas. Selon l’usage de l’époque, on prenait souvent les repas formels en position inclinée sur des divans.
    reason: cultural_note
lexical_decisions:
- source_word: Ἐν δὲ τῷ λαλῆσαι
  choice: Pendant qu’il parlait
  rationale: La construction ἐν + infinitif articulé exprime ici la simultanéité. Cette formulation naturelle conserve l’aspect duratif sans alourdir la phrase.
- source_word: ἐρωτᾷ
  choice: lui demande
  rationale: Le présent historique grec est conservé afin de préserver la vivacité narrative. Le sens d’invitation ressort de la proposition finale qui suit.
- source_word: Φαρισαῖος
  choice: un pharisien
  rationale: Désignation usuelle du groupe; l’absence d’article en grec appelle naturellement l’article indéfini en français.
- source_word: ὅπως ἀριστήσῃ
  choice: de venir prendre un repas
  rationale: ἀριστάω peut désigner un repas pris le matin ou vers le milieu de la journée. « Prendre un repas » évite de préciser indûment l’heure; « venir » rend naturellement en français la force de l’invitation, sans faire de ἐρωτάω un verbe signifiant directement « inviter ».
- source_word: παρ’ αὐτῷ
  choice: chez lui
  rationale: Dans le contexte d’une invitation à un repas, παρά avec le datif désigne naturellement le lieu où se trouve l’hôte. « Chez lui » reste plus proche du grec et moins explicite que « dans sa maison ».
- source_word: εἰσελθὼν
  choice: Jésus entra donc
  rationale: Le participe aoriste marque une action précédant celle du verbe principal. Le nom « Jésus » clarifie le sujet en français, et « donc » exprime l’enchaînement narratif porté par δέ.
- source_word: ἀνέπεσεν
  choice: s’installa à table
  rationale: Le verbe désigne le fait de s’allonger ou de s’étendre pour prendre un repas. Cette expression française est naturelle; une note conserve l’information culturelle relative à la posture.
theological_decisions: []
translation_notes:
  register: Français international moderne, fluide et digne. Le présent historique est maintenu. La traduction évite de fixer l’heure du repas, que le verbe grec ne permet pas d’établir avec certitude, et explicite seulement en note la posture antique impliquée par ἀνέπεσεν.
