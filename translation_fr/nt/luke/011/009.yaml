id: LUK.11.9
reference: Luke 11:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Κἀγὼ ὑμῖν λέγω, αἰτεῖτε, καὶ δοθήσεται ὑμῖν· ζητεῖτε, καὶ εὑρήσετε· κρούετε, καὶ ἀνοιγήσεται ὑμῖν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/009.yaml
  text: And I tell you[a], ask, and it will be given to you; seek, and you will find; knock, and it will be opened to you.
translation:
  language: fr
  text: 'Et moi, je vous le dis : demandez, et l’on vous donnera ; cherchez, et vous trouverez ; frappez[a], et l’on vous ouvrira.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Les impératifs présents grecs peuvent aussi exprimer une action continue ou répétée : « continuez à demander… à chercher… à frapper ».'
    reason: alternative lexicale et aspectuelle
lexical_decisions:
- source_word: Κἀγὼ ὑμῖν λέγω
  choice: Et moi, je vous le dis
  rationale: La crase Κἀγώ associe la continuité exprimée par καί à l’accent porté sur ἐγώ. Cette tournure française naturelle maintient à la fois le lien avec l’enseignement précédent et l’insistance sur celui qui parle.
- source_word: αἰτεῖτε
  choice: demandez
  rationale: L’impératif présent commande de demander, sans que sa valeur continue ou répétée doive nécessairement être explicitée dans le corps du texte.
- source_word: δοθήσεται ὑμῖν
  choice: l’on vous donnera
  rationale: Cette formulation française rend naturellement le futur passif grec tout en conservant l’agent non exprimé. Elle évite le tour moins idiomatique « cela vous sera donné ».
- source_word: ζητεῖτε
  choice: cherchez
  rationale: « Cherchez » conserve la portée concrète ou figurée de ζητέω et s’intègre au parallélisme des trois impératifs.
- source_word: εὑρήσετε
  choice: vous trouverez
  rationale: Le futur actif est rendu directement, en maintenant la structure de commandement suivie d’une promesse.
- source_word: κρούετε
  choice: frappez
  rationale: Dans ce contexte, κρούω désigne le fait de frapper à une porte. Le français permet de laisser la porte sous-entendue, comme le grec.
- source_word: ἀνοιγήσεται ὑμῖν
  choice: l’on vous ouvrira
  rationale: Le tour impersonnel garde l’agent implicite et rend idiomatiquement l’idée de la porte sous-entendue qui sera ouverte à ceux qui frappent.
theological_decisions:
- issue: Valeur aspectuelle des impératifs présents αἰτεῖτε, ζητεῖτε et κρούετε
  choice: 'Impératifs simples : « demandez », « cherchez », « frappez »'
  alternative: « continuez à demander… à chercher… à frapper »
  rationale: Le présent impératif grec est compatible avec une action persistante ou répétée, mais n’impose pas à lui seul de l’expliciter. Le texte principal préserve donc l’ambiguïté aspectuelle, et une note signale l’autre possibilité.
- issue: Agent des passifs δοθήσεται et ἀνοιγήσεται
  choice: Agent laissé implicite par « l’on »
  alternative: 'Nommer Dieu comme agent : « Dieu vous donnera… Dieu vous ouvrira »'
  rationale: Le contexte peut faire comprendre Dieu comme l’agent, mais le grec ne le nomme pas. La traduction évite donc de rendre explicite ce que le texte laisse sous-entendu.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme ternaire et la ponctuation solennelle sont conservés. « L’on » évite la succession moins soignée « et on » et permet de rendre naturellement les passifs grecs sans en préciser l’agent.
