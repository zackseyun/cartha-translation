  variant: modern international French
source:
  edition: SBLGNT
  text: Ἀποκριθεὶς δέ τις τῶν νομικῶν λέγει αὐτῷ· Διδάσκαλε, ταῦτα λέγων καὶ ἡμᾶς ὑβρίζεις.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/045.yaml
  text: Then one of the lawyers answered and said to him[a], “Teacher[b], in saying these things you insult us also.”
translation:
  language: fr
  text: 'Alors, l’un des spécialistes de la Loi lui répondit : « Maître, en disant cela, tu nous insultes[a], nous aussi. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tu nous traites avec mépris ». Le verbe grec peut évoquer l’insulte, l’humiliation ou un traitement méprisant, et non le simple fait d’offenser.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀποκριθεὶς δέ
  choice: Alors … répondit
  rationale: Le participe aoriste introduit une réaction à ce qui vient d’être dit, tandis que δέ marque une progression légère du récit. Cette formulation est naturelle en français sans créer un contraste trop appuyé.
- source_word: τις τῶν νομικῶν
  choice: l’un des spécialistes de la Loi
  rationale: Dans ce contexte, νομικός désigne un connaisseur de la Loi juive, et non un avocat au sens professionnel moderne. La majuscule à « Loi » précise qu’il s’agit de la Loi de Moïse.
- source_word: λέγει αὐτῷ
  choice: lui répondit
  rationale: Le présent historique grec est rendu au passé, conformément à l’usage narratif naturel du français. Le verbe est intégré à la tournure introduite par Ἀποκριθείς afin d’éviter le lourd « ayant répondu, il lui dit ».
- source_word: Διδάσκαλε
  choice: Maître
  rationale: Comme terme d’adresse, « Maître » est la formulation française courante et digne pour désigner celui qui enseigne; ici, le contexte exclut l’idée d’un propriétaire ou d’un dominateur.
- source_word: ταῦτα λέγων
  choice: en disant cela
  rationale: 'Le participe exprime le moyen ou la circonstance concomitante : ce sont les paroles que Jésus vient de prononcer qui motivent la réaction. Le singulier collectif « cela » est idiomatique en français.'
- source_word: καὶ ἡμᾶς
  choice: nous aussi
  rationale: καί ajoute les spécialistes de la Loi aux personnes déjà visées par les paroles précédentes. La reprise disloquée après le verbe restitue naturellement cette insistance en français.
- source_word: ὑβρίζεις
  choice: tu nous insultes
  rationale: ὑβρίζω exprime ici le fait d’outrager ou de traiter avec mépris. « Insulter » convient directement à un tort causé par des paroles et conserve la force du verbe grec.
theological_decisions: []
translation_notes:
  register: Français moderne, naturel et digne. « Spécialistes de la Loi » évite l’anachronisme d’« avocats ». Le tutoiement correspond à l’usage biblique français courant dans l’adresse directe à Jésus, sans ajouter de familiarité particulière.
