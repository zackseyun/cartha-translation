  text: σκόπει οὖν μὴ τὸ φῶς τὸ ἐν σοὶ σκότος ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/035.yaml
  text: Therefore[a], watch out lest the light in you be darkness.
translation:
  language: fr
  text: Veille donc à ce que la lumière qui est en toi ne soit pas ténèbres.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σκόπει
  choice: Veille
  rationale: L’impératif présent appelle à une vigilance continue. « Veille à ce que » est naturel en français moderne et conserve la force de l’avertissement.
- source_word: οὖν
  choice: donc
  rationale: Marque la conséquence tirée de l’enseignement précédent sur l’œil et la lumière.
- source_word: μὴ
  choice: à ce que… ne… pas
  rationale: Avec l’impératif, μή introduit l’éventualité indésirable contre laquelle Jésus met en garde. Cette tournure est idiomatique en français.
- source_word: τὸ φῶς
  choice: la lumière
  rationale: Conserve littéralement la métaphore et son opposition avec les ténèbres.
- source_word: τὸ ἐν σοὶ
  choice: qui est en toi
  rationale: Rend explicitement la construction grecque tout en laissant ouverte la portée intérieure, morale ou spirituelle de l’image.
- source_word: σκότος
  choice: ténèbres
  rationale: Préserve l’opposition métaphorique avec la lumière. Le pluriel lexical « ténèbres » est la formulation française naturelle dans ce registre.
- source_word: ἐστίν
  choice: soit
  rationale: Après « veille à ce que », le français exige naturellement le subjonctif, sans modifier le sens de la copule grecque.
theological_decisions:
- issue: Sens métaphorique de « lumière » et de « ténèbres »
  choice: Conserver la métaphore sans en préciser le référent.
  alternative: Paraphraser par « compréhension », « lumière intérieure », « conscience » ou « état spirituel ».
  rationale: Le grec maintient une image ample, liée au contexte de la perception et de la condition intérieure. La préciser réduirait indûment sa portée et résoudrait une tension que le texte laisse ouverte.
translation_notes:
  register: Français international moderne, sobre et digne. « Veille à ce que » exprime clairement l’avertissement sans archaïsme; « ténèbres » maintient le registre biblique courant et le contraste imagé.
