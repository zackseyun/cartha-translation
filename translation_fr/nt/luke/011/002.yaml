id: LUK.11.2
reference: Luke 11:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἶπεν δὲ αὐτοῖς· Ὅταν προσεύχησθε, λέγετε· ⸀Πάτερ, ἁγιασθήτω τὸ ὄνομά σου· ἐλθέτω ἡ βασιλεία ⸀σου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/002.yaml
  text: 'And he said to them[a], “When you pray, say: ‘Father, hallowed be your name[b]. Your kingdom come.’”'
translation:
  language: fr
  text: 'Il leur dit : « Quand vous priez, dites : “Père, que ton nom soit reconnu comme saint[a] ; que ton règne vienne[b].” »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « que ton nom soit sanctifié » ou « tenu pour saint ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « que ton royaume vienne ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅταν προσεύχησθε
  choice: Quand vous priez
  rationale: La proposition temporelle générale décrit la prière comme une pratique habituelle. Cette formulation est naturelle en français et n'alourdit pas le texte par « chaque fois que ».
- source_word: λέγετε
  choice: dites
  rationale: Le présent impératif donne une instruction générale ; l'impératif simple français en restitue naturellement la force.
- source_word: Πάτερ
  choice: Père
  rationale: Le vocatif grec porte seulement « Père » ; il ne faut pas l'harmoniser avec « Notre Père » en Matthieu 6.9.
- source_word: ἁγιασθήτω τὸ ὄνομά σου
  choice: que ton nom soit reconnu comme saint
  rationale: Cette tournure conserve la forme passive et la valeur de requête, tout en indiquant en français moderne qu'il s'agit de la reconnaissance et de l'honneur dus à la sainteté du nom de Dieu, non de rendre saint ce qui ne le serait pas.
- source_word: ἐλθέτω
  choice: que … vienne
  rationale: Le subjonctif introduit par « que » est la manière française naturelle de rendre ici l'impératif grec employé comme requête.
- source_word: ἡ βασιλεία σου
  choice: ton règne
  rationale: βασιλεία peut désigner l'exercice de la royauté aussi bien que le royaume. « Règne » exprime clairement la souveraineté agissante de Dieu dans cette demande, sans exclure sa dimension future.
theological_decisions:
- issue: L'adresse à Dieu sans pronom possessif
  choice: Père
  alternative: Notre Père
  rationale: Le texte grec de Luc porte Πάτερ, sans « notre ». La traduction suit cette forme et ne l'harmonise pas avec Matthieu 6.9.
- issue: Le sens de la sanctification du nom de Dieu
  choice: que ton nom soit reconnu comme saint
  alternative: que ton nom soit sanctifié
  rationale: La formulation retenue préserve la demande visant l'honneur rendu au nom de Dieu sans laisser entendre que celui-ci manquerait intrinsèquement de sainteté.
- issue: La portée de βασιλεία
  choice: ton règne
  alternative: ton royaume
  rationale: Le contexte d'une demande que la βασιλεία « vienne » permet les deux rendus. « Règne » met en avant la souveraineté divine qui advient, tandis que la note conserve l'autre traduction traditionnelle.
translation_notes:
  register: Français international moderne, digne et directement compréhensible. Le tutoiement correspond au singulier σου et à l'usage biblique français courant dans la prière. Les deux requêtes sont rendues par « que » suivi du subjonctif, structure idiomatique qui conserve leur parallélisme.
