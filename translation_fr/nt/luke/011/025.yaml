id: LUK.11.25
reference: Luke 11:25
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἐλθὸν ⸀εὑρίσκει σεσαρωμένον καὶ κεκοσμημένον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/025.yaml
  text: And when it comes[a], it finds it swept and put in order.
translation:
  language: fr
  text: À son arrivée, il la trouve balayée et bien rangée.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « balayée et ornée ».
    reason: Alternative lexicale possible pour κεκοσμημένον, qui peut évoquer l’ornementation aussi bien que la mise en ordre.
lexical_decisions:
- source_word: ἐλθὸν
  choice: À son arrivée
  rationale: Le participe aoriste exprime ici la circonstance temporelle du retour de l’esprit impur. Cette formulation est naturelle en français et garde le lien avec le verset précédent.
- source_word: εὑρίσκει
  choice: il la trouve
  rationale: Le présent donne de la vivacité au récit. En français, « il » reprend naturellement « l’esprit impur », nom masculin, tandis que « la » renvoie à la maison évoquée dans le contexte.
- source_word: σεσαρωμένον
  choice: balayée
  rationale: Le participe parfait passif décrit la maison dans l’état résultant du balayage. « Balayée » exprime cet état sans ajouter explicitement l’idée de propreté.
- source_word: κεκοσμημένον
  choice: bien rangée
  rationale: Dans le contexte domestique, κοσμέω peut désigner une maison ordonnée ou aménagée. « Bien rangée » est idiomatique et compréhensible, tandis que la possibilité « ornée » est conservée en note.
theological_decisions:
- issue: Référent de l’objet sous-entendu
  choice: il la trouve
  alternative: il trouve la maison
  rationale: Le grec ne répète pas le nom de la maison, mais le contexte l’identifie clairement. Le pronom féminin français préserve la concision du texte tout en rendant le référent intelligible.
- issue: Genre du sujet, l’esprit impur
  choice: il
  alternative: cela
  rationale: Contrairement au grec πνεῦμα, le français « esprit » est masculin. Employer « il » respecte donc la grammaire française sans trancher une question sur la nature personnelle de l’esprit au-delà de ce que dit le contexte.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase conserve la brièveté du grec, les états résultants exprimés par les participes parfaits et l’objet implicite identifié par le contexte.
