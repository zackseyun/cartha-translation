id: LUK.11.1
reference: Luke 11:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ἐν τῷ εἶναι αὐτὸν ἐν τόπῳ τινὶ προσευχόμενον, ὡς ἐπαύσατο, εἶπέν τις τῶν μαθητῶν αὐτοῦ πρὸς αὐτόν· Κύριε, δίδαξον ἡμᾶς προσεύχεσθαι, καθὼς καὶ Ἰωάννης ἐδίδαξεν τοὺς μαθητὰς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/001.yaml
  text: And it happened that while he was praying in a certain place, when he stopped, one of his disciples said to him, “Lord, teach us to pray, just as John also taught his disciples.”
translation:
  language: fr
  text: 'Un jour, Jésus priait dans un certain lieu. Quand il eut fini de prier, l’un de ses disciples lui dit : « Seigneur, apprends-nous à prier, comme Jean l’a lui aussi enseigné à ses disciples. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ ἐγένετο
  choice: Un jour
  rationale: La formule narrative lucanienne introduit ici un nouvel épisode. « Un jour » en restitue naturellement la fonction en français moderne sans l’archaïsme de « Et il arriva ».
- source_word: ἐν τῷ εἶναι αὐτὸν ... προσευχόμενον
  choice: Jésus priait
  rationale: L’infinitif articulé avec ἐν et le participe expriment une action en cours. L’imparfait français en conserve l’aspect. Le nom « Jésus » explicite naturellement le référent du pronom dans un verset présenté isolément.
- source_word: ἐν τόπῳ τινὶ
  choice: dans un certain endroit
  rationale: Cette formulation conserve le caractère délibérément indéfini de τόπῳ τινί tout en restant idiomatique.
- source_word: ὡς ἐπαύσατο
  choice: Quand il eut terminé
  rationale: Le verbe signifie qu’il cessa l’action en cours. Dans ce contexte, le plus-que-parfait antérieur « eut terminé » indique clairement que la demande suit la fin de la prière, sans répétition lourde.
- source_word: τις τῶν μαθητῶν αὐτοῦ
  choice: l’un de ses disciples
  rationale: Cette tournure française rend naturellement la construction partitive et l’indétermination de τις.
- source_word: Κύριε
  choice: Seigneur
  rationale: « Seigneur » conserve à la fois la valeur d’adresse respectueuse et la portée titulaire possible de κύριος dans Luc.
- source_word: δίδαξον ἡμᾶς προσεύχεσθαι
  choice: apprends-nous à prier
  rationale: La construction avec l’infinitif se rend directement et naturellement ainsi, sans ajouter explicitement « comment ».
- source_word: καθὼς καὶ Ἰωάννης ἐδίδαξεν τοὺς μαθητὰς αὐτοῦ
  choice: comme Jean l’a lui aussi appris à ses disciples
  rationale: « Comme » exprime la comparaison introduite par καθώς, et « lui aussi » rend καί. Le pronom « l’ » reprend naturellement « à prier » en français.
theological_decisions:
- issue: Valeur de κύριος dans l’adresse à Jésus
  choice: Seigneur
  alternative: Maître
  rationale: « Seigneur » préserve l’éventail sémantique et la portée christologique possible du titre sans imposer qu’elles soient pleinement explicites dans cette seule adresse.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure narrative « Un jour » évite un calque biblique archaïque. Le rythme est fluide à l’oral comme à l’écrit, et aucune note n’est nécessaire pour ce verset.
