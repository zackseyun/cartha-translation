revisions:
- from: 'Un jour, Jésus priait dans un certain endroit. Quand il eut terminé, l’un de ses disciples lui dit : « Seigneur, apprends-nous à prier, comme Jean l’a lui aussi appris à ses disciples. »'
  to: 'Un jour, Jésus priait dans un certain lieu. Quand il eut fini de prier, l’un de ses disciples lui dit : « Seigneur, apprends-nous à prier, comme Jean l’a lui aussi enseigné à ses disciples. »'
  rationale: 'La révision corrige l’inversion de sens produite par « appris » et conserve l’ellipse grecque : ce que Jean a enseigné à ses disciples est la prière, déjà exprimée dans la demande précédente. « Un certain lieu » améliore légèrement l’idiomaticité tout en maintenant le caractère indéfini du lieu.'
