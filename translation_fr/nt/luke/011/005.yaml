source:
  edition: SBLGNT
  text: Καὶ εἶπεν πρὸς αὐτούς· Τίς ἐξ ὑμῶν ἕξει φίλον καὶ πορεύσεται πρὸς αὐτὸν μεσονυκτίου καὶ εἴπῃ αὐτῷ· Φίλε, χρῆσόν μοι τρεῖς ἄρτους,
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/005.yaml
  text: And he said to them[a], “Which of you who has a friend will go to him at midnight and say to him, ‘Friend, lend me three loaves,’”
translation:
  language: fr
  text: 'Puis il leur dit : « Lequel d’entre vous, s’il a un ami, ira le trouver à minuit et lui dira : “Mon ami, prête-moi trois pains,” »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τίς ἐξ ὑμῶν ἕξει φίλον καὶ πορεύσεται πρὸς αὐτόν
  choice: Supposons que l’un de vous ait un ami et qu’il aille le trouver
  rationale: La tournure introduit une situation hypothétique dans une question rhétorique. « Supposons que » rend naturellement en français cette mise en situation, tandis que les subjonctifs conservent sa valeur éventuelle sans imposer un futur français lourd.
- source_word: φίλον / Φίλε
  choice: un ami / Mon ami
  rationale: « Ami » est l’équivalent courant et préserve la répétition lexicale. Au vocatif, « Mon ami » constitue une adresse naturelle en français moderne.
- source_word: μεσονυκτίου
  choice: à minuit
  rationale: Le génitif a une valeur temporelle adverbiale; « à minuit » est direct et idiomatique.
- source_word: εἴπῃ αὐτῷ
  choice: pour lui dire
  rationale: Dans la chaîne hypothétique, l’infinitif de but donne une formulation française fluide tout en conservant l’action visée par le déplacement.
- source_word: χρῆσόν μοι
  choice: prête-moi
  rationale: L’impératif demande qu’on mette temporairement quelque chose à la disposition du locuteur; « prête-moi » exprime précisément cette demande.
- source_word: τρεῖς ἄρτους
  choice: trois pains
  rationale: ἄρτοι désigne ici des pains individuels. « Trois pains » est naturel et n’ajoute aucune précision sur leur taille ou leur forme.
theological_decisions: []
translation_notes:
  register: Français international moderne, oral et digne. La formulation garde la vivacité de l’enseignement direct de Jésus et se termine par une virgule, puisque la phrase se poursuit au verset suivant.
