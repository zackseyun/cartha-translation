id: LUK.11.21
reference: Luke 11:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὅταν ὁ ἰσχυρὸς καθωπλισμένος φυλάσσῃ τὴν ἑαυτοῦ αὐλήν, ἐν εἰρήνῃ ἐστὶν τὰ ὑπάρχοντα αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/021.yaml
  text: When the strong man[a], fully armed, guards his own courtyard[b], his possessions are secure.
translation:
  language: fr
  text: Quand l’homme fort, bien armé, garde sa propre cour[a], ses biens sont en sécurité[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sa propre demeure », « son propre palais » ou « son propre domaine » ; le mot grec peut désigner une cour fermée ou, par extension, l’habitation et l’ensemble résidentiel auxquels elle appartient.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « sont dans la paix ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: Quand
  rationale: Introduit ici une situation générale à valeur temporelle et conditionnelle. « Quand » est naturel en français et convient à l’image employée.
- source_word: ὁ ἰσχυρός
  choice: l’homme fort
  rationale: L’adjectif substantivé désigne une personne forte et conserve la forme masculine singulière du grec.
- source_word: καθωπλισμένος
  choice: bien armé
  rationale: Le participe parfait décrit l’état durable de quelqu’un qui s’est équipé d’armes. « Bien armé » rend naturellement cette préparation complète sans alourdir la phrase.
- source_word: φυλάσσῃ
  choice: garde
  rationale: Le verbe exprime une surveillance protectrice continue dans la situation envisagée.
- source_word: τὴν ἑαυτοῦ αὐλήν
  choice: sa propre demeure
  rationale: αὐλή peut désigner une cour fermée, mais aussi, par extension, l’habitation ou l’ensemble résidentiel auquel elle appartient. « Demeure » convient au contexte des biens gardés, tandis qu’une note préserve l’étendue sémantique du terme. « Propre » rend l’insistance de ἑαυτοῦ.
- source_word: ἐν εἰρήνῃ ἐστίν
  choice: sont en sécurité
  rationale: L’expression signifie littéralement « sont dans la paix » et décrit ici des biens à l’abri de toute atteinte. « Sont en sécurité » en communique clairement le sens contextuel, avec conservation de la formulation littérale en note.
- source_word: τὰ ὑπάρχοντα αὐτοῦ
  choice: ses biens
  rationale: Le substantif participial désigne ce qui appartient à quelqu’un. « Ses biens » est courant, clair et suffisamment large.
theological_decisions:
- issue: Portée métaphorique de l’homme fort dans le contexte
  choice: Conserver l’image de « l’homme fort » sans identifier explicitement son référent dans ce verset.
  alternative: Nommer explicitement Satan dans le texte principal.
  rationale: Le verset présente lui-même une scène imagée; le contexte en éclaire la portée. Une identification explicite dans la traduction résoudrait une implication que le texte laisse à l’interprétation contextuelle.
translation_notes:
  register: Français international moderne, simple et digne. La phrase conserve la brièveté de l’image et évite tout vocabulaire confessionnel ou toute explicitation doctrinale absente du verset.
