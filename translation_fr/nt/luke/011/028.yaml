source:
  edition: SBLGNT
  text: αὐτὸς δὲ εἶπεν· ⸀Μενοῦν μακάριοι οἱ ἀκούοντες τὸν λόγον τοῦ θεοῦ καὶ ⸀φυλάσσοντες.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/028.yaml
  text: But he said[a], “Rather, blessed are those who hear the word of God and keep it.”
translation:
  language: fr
  text: 'Mais il dit : « Heureux plutôt ceux qui écoutent la parole de Dieu et qui la gardent ! »[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Oui, bien plus, heureux sont ceux qui… » La particule grecque peut confirmer ce qui précède tout en réorientant l’accent.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μενοῦν
  choice: Bien plus
  rationale: La particule acquiesce à ce qui précède tout en réorientant et en renforçant l'accent. « Bien plus » rend cette nuance sans suggérer un rejet brutal.
- source_word: μακάριοι
  choice: heureux
  rationale: Dans une béatitude, « heureux » est naturel en français biblique moderne et exprime la condition favorable accordée par Dieu, au-delà d'une simple émotion.
- source_word: οἱ ἀκούοντες
  choice: ceux qui écoutent
  rationale: Le participe présent substantivé désigne ceux qui se caractérisent par une écoute attentive; « écoutent » convient ici mieux que la simple perception exprimée par « entendent ».
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: la parole de Dieu
  rationale: Cette formulation conserve l'étendue de λόγος ainsi que sa résonance biblique, sans le réduire au seul sens de « message ».
- source_word: φυλάσσοντες
  choice: qui la gardent
  rationale: « Garder » conserve les dimensions de préservation, d'attachement et de mise en pratique présentes dans φυλάσσω, tandis que « obéir » en réduirait quelque peu la portée.
- source_word: αὐτὸς δὲ εἶπεν
  choice: Mais il dit
  rationale: « Mais » marque le contraste léger avec l'exclamation précédente, et « dit » reste proche de εἶπεν sans expliciter davantage la nature de la réponse.
theological_decisions:
- issue: Portée de la réponse de Jésus à la bénédiction prononcée par la femme
  choice: Jésus déplace et approfondit l'accent vers le bonheur de ceux qui écoutent et gardent la parole de Dieu, sans nier explicitement la bénédiction évoquée auparavant.
  alternative: Comprendre la réponse soit comme un rejet catégorique de la parole de la femme, soit comme une simple bénédiction supplémentaire sans correction.
  rationale: Μενοῦν peut à la fois confirmer et réorienter. « Bien plus » préserve cette tension et évite de trancher au-delà de ce que permet le grec.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve le parallélisme « écoutent… gardent » et la brièveté sentencieuse de la béatitude.
