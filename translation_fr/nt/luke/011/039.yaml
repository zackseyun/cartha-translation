id: LUK.11.39
reference: Luke 11:39
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἶπεν δὲ ὁ κύριος πρὸς αὐτόν· Νῦν ὑμεῖς οἱ Φαρισαῖοι τὸ ἔξωθεν τοῦ ποτηρίου καὶ τοῦ πίνακος καθαρίζετε, τὸ δὲ ἔσωθεν ὑμῶν γέμει ἁρπαγῆς καὶ πονηρίας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/039.yaml
  text: But the Lord said to him[a], “Now you Pharisees clean the outside of the cup and the dish, but your inside is full of greed and wickedness.”
translation:
  language: fr
  text: 'Mais le Seigneur lui dit : « Vous, les pharisiens, vous nettoyez maintenant l’extérieur de la coupe et du plat, mais votre intérieur est plein d’avidité[a] et de méchanceté. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vol », « rapine » ou « extorsion ».
    reason: alternative lexicale pour ἁρπαγή
lexical_decisions:
- source_word: κύριος
  choice: Seigneur
  rationale: Titre néotestamentaire naturel et traditionnel en français dans ce contexte, plutôt qu’une simple formule de politesse.
- source_word: Νῦν
  choice: maintenant
  rationale: Conserve le marqueur discursif qui introduit la réprimande; sa place après le verbe rend la phrase plus naturelle en français.
- source_word: ὑμεῖς οἱ Φαρισαῖοι
  choice: Vous, les pharisiens, vous
  rationale: La dislocation française restitue l’insistance du pronom grec avec naturel et vigueur.
- source_word: τὸ ἔξωθεν
  choice: l’extérieur
  rationale: Désigne concrètement la partie externe tout en préparant le contraste avec « votre intérieur ».
- source_word: ποτηρίου
  choice: coupe
  rationale: Équivalent courant de ποτήριον, adapté à l’image du récipient.
- source_word: πίνακος
  choice: plat
  rationale: Terme moderne et suffisamment général pour un plat ou plateau destiné à servir la nourriture.
- source_word: καθαρίζετε
  choice: nettoyez
  rationale: Verbe concret et courant qui convient aux objets et préserve le contraste moral.
- source_word: τὸ δὲ ἔσωθεν ὑμῶν
  choice: mais votre intérieur
  rationale: Préserve la métaphore spatiale et le passage des récipients aux personnes sans préciser de manière interprétative « cœur » ou « esprit ».
- source_word: γέμει
  choice: est plein de
  rationale: Équivalent français idiomatique du verbe γέμω suivi de compléments au génitif.
- source_word: ἁρπαγῆς
  choice: avidité
  rationale: Exprime ici la rapacité intérieure tout en restant naturel en français; une note conserve les sens plus concrets de prise violente ou injuste.
- source_word: πονηρίας
  choice: méchanceté
  rationale: Rend le vice moral général désigné par πονηρία dans un français accessible et sérieux.
theological_decisions:
- issue: Référent métaphorique de « l’intérieur »
  choice: Conserver « votre intérieur »
  alternative: « votre cœur » ou « votre être intérieur »
  rationale: Le grec oppose délibérément l’extérieur nettoyé à l’intérieur corrompu. Nommer le cœur préciserait au-delà du texte et atténuerait la continuité de l’image.
- issue: Sens moral de ἁρπαγή
  choice: « avidité » dans le texte, avec les sens concrets en note
  alternative: « vol », « rapine » ou « extorsion »
  rationale: Le contexte dénonce une disposition intérieure rapace, mais le nom grec peut aussi évoquer l’appropriation injuste ou violente; la note préserve cette ambiguïté lexicale.
translation_notes:
  register: Français international moderne, digne et direct. La reprise « Vous, les pharisiens, vous » restitue l’emphase grecque sans archaïsme. La métaphore de l’extérieur et de l’intérieur est conservée.
