id: LUK.11.48
reference: Luke 11:48
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἄρα ⸂μάρτυρές ἐστε⸃ καὶ συνευδοκεῖτε τοῖς ἔργοις τῶν πατέρων ὑμῶν, ὅτι αὐτοὶ μὲν ἀπέκτειναν αὐτοὺς ὑμεῖς δὲ ⸀οἰκοδομεῖτε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/048.yaml
  text: So you are witnesses and approve of the deeds of your fathers[a], because they killed them, but you build their tombs.
translation:
  language: fr
  text: Ainsi, vous êtes témoins et vous approuvez les actes de vos ancêtres, parce qu’eux ont tué les prophètes, et vous, vous bâtissez leurs tombeaux[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec dit simplement « vous bâtissez »; le complément « leurs tombeaux » est sous-entendu d’après le verset précédent.
    reason: Clarification du complément fourni par le contexte immédiat.
lexical_decisions:
- source_word: ἄρα
  choice: Ainsi
  rationale: Introduit naturellement en français la conclusion tirée de l’accusation du verset précédent.
- source_word: μάρτυρές ἐστε
  choice: vous êtes témoins
  rationale: Conserve la construction nominale grecque et l’idée que leurs actes témoignent contre eux.
- source_word: συνευδοκεῖτε
  choice: vous approuvez
  rationale: Exprime clairement l’assentiment moral et l’association aux actes des générations précédentes.
- source_word: τοῖς ἔργοις
  choice: les actes
  rationale: « Actes » désigne ici des actions concrètes chargées d’une portée morale, avec plus de naturel que « œuvres ».
- source_word: τῶν πατέρων ὑμῶν
  choice: de vos ancêtres
  rationale: Dans ce contexte intergénérationnel, « ancêtres » restitue le sens de πατέρες en français moderne sans suggérer seulement les pères immédiats.
- source_word: ὅτι
  choice: ':'
  rationale: 'Les deux-points rendent avec naturel la valeur explicative de ὅτι : la proposition suivante expose en quoi consiste leur témoignage approbateur.'
- source_word: αὐτοὶ μὲν ἀπέκτειναν αὐτοὺς
  choice: eux ont tué les prophètes
  rationale: « Eux » marque le contraste emphatique avec « vous ». Le référent des prophètes est repris du contexte immédiat afin d’éviter l’ambiguïté de deux pronoms « ils/les » en français.
- source_word: ὑμεῖς δὲ
  choice: et vous, vous
  rationale: Le redoublement idiomatique met en relief le contraste entre les ancêtres et les interlocuteurs. « Et » préserve aussi la complémentarité accusatrice des deux actions plutôt que d’en faire une simple opposition.
- source_word: οἰκοδομεῖτε
  choice: vous bâtissez leurs tombeaux
  rationale: Le verbe signifie « bâtir »; son complément non répété dans ce verset est clairement fourni par le verset 47. L’expliciter donne une phrase française complète et intelligible.
theological_decisions:
- issue: Faut-il expliciter le complément sous-entendu de οἰκοδομεῖτε ?
  choice: Expliciter « leurs tombeaux » dans le texte principal.
  alternative: 'Conserver le verbe sans complément : « vous bâtissez ».'
  rationale: Le grec laisse le complément sous-entendu parce que les tombeaux viennent d’être mentionnés au verset 47. En français, le verbe employé absolument serait obscur et peu naturel; l’ajout contextuel est donc signalé par une note.
- issue: Nature du lien entre les meurtres des ancêtres et la construction des tombeaux
  choice: 'Conserver la tension ironique : les deux actions réunies témoignent d’une approbation.'
  alternative: Présenter la construction des tombeaux comme un hommage innocent ou comme une participation littérale aux meurtres.
  rationale: Le verset accuse les interlocuteurs de s’associer moralement aux actes de leurs ancêtres, sans expliquer davantage le mécanisme de cette solidarité. La traduction ne résout pas cette tension.
translation_notes:
  register: Français international moderne, digne et accessible. « Ancêtres » est plus naturel ici que « pères »; « bâtissez » convient particulièrement à des tombeaux et garde une légère solennité. La structure contrastive « eux… et vous, vous… » reproduit l’insistance du grec.
