id: LUK.11.23
reference: Luke 11:23
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ μὴ ὢν μετ’ ἐμοῦ κατ’ ἐμοῦ ἐστιν, καὶ ὁ μὴ συνάγων μετ’ ἐμοῦ σκορπίζει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/023.yaml
  text: The one who is not with me is against me[a], and the one who does not gather with me scatters.
translation:
  language: fr
  text: Celui qui n’est pas avec moi est contre moi, et celui qui ne rassemble pas avec moi disperse.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ μὴ ὢν
  choice: celui qui n’est pas
  rationale: L’article suivi du participe présent a une valeur substantive et générique. « Celui qui n’est pas » reproduit naturellement cette structure en français moderne.
- source_word: μετ’ ἐμοῦ
  choice: avec moi
  rationale: μετά avec le génitif exprime ici l’association ou l’alignement; « avec moi » conserve la formulation simple et relationnelle du grec.
- source_word: κατ’ ἐμοῦ
  choice: contre moi
  rationale: κατά avec le génitif marque l’opposition. « Contre moi » forme en français l’antithèse directe avec « avec moi ».
- source_word: συνάγων
  choice: rassemble
  rationale: Le verbe signifie réunir ou rassembler. « Rassemble » est concis et préserve l’image ainsi que son opposition à « disperse ».
- source_word: σκορπίζει
  choice: disperse
  rationale: Le verbe désigne l’action d’éparpiller ou de disperser. « Disperse » rend clairement le contraste avec « rassemble ».
- source_word: καὶ
  choice: et
  rationale: La conjonction coordonne simplement les deux propositions parallèles; « et » en conserve la structure rhétorique.
theological_decisions:
- issue: Portée de la parole de Jésus sur la neutralité envers lui
  choice: La personne qui n’est pas avec Jésus est dite contre lui, sans atténuation.
  alternative: Comprendre la formule comme une simple absence de soutien ou la limiter explicitement au contexte de l’exorcisme.
  rationale: La formulation grecque est absolue et fortement antithétique. La traduction en préserve la tension sans lui ajouter une systématisation doctrinale ni restreindre ce que le texte ne restreint pas explicitement.
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme « avec moi / contre moi » et « rassemble / disperse » est conservé. Aucun marqueur de note n’est requis puisqu’aucune note n’est retenue.
