  text: Give us each day our daily bread[a].
translation:
  language: fr
  text: Donne-nous chaque jour notre pain quotidien[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le pain dont nous avons besoin », « le pain pour le jour qui vient » ou, moins probablement ici, « le pain supersubstantiel ». L’adjectif grec est rare et son sens fait débat.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρτον
  choice: pain
  rationale: Le nom désigne littéralement le pain et peut, dans cette prière, représenter la subsistance essentielle. « Pain » conserve à la fois l’image concrète et la formulation traditionnelle.
- source_word: ἡμῶν
  choice: dont nous avons besoin
  rationale: Le possessif grec se rattache à « pain ». En français naturel, sa valeur est ici intégrée à la proposition « dont nous avons besoin », qui rend aussi une interprétation plausible de ἐπιούσιον sans produire la tournure peu idiomatique « notre pain quotidien chaque jour ».
- source_word: ἐπιούσιον
  choice: dont nous avons besoin
  rationale: Cet adjectif très rare et discuté peut désigner le pain nécessaire, quotidien ou destiné au jour qui vient. La formulation retenue est naturelle et intelligible, tandis qu’une note conserve les principales autres possibilités.
- source_word: δίδου
  choice: Donne
  rationale: Le présent impératif peut suggérer une action répétée. L’impératif français « Donne », accompagné de « chaque jour », exprime naturellement cette demande continuelle.
- source_word: ἡμῖν
  choice: nous
  rationale: Pronom complément indirect de l’impératif, rendu directement par « nous ».
- source_word: τὸ καθ’ ἡμέραν
  choice: chaque jour
  rationale: Cette expression adverbiale souligne explicitement la répétition quotidienne et la dépendance continuelle.
theological_decisions:
- issue: Sens de ἐπιούσιον dans la prière enseignée par Jésus
  choice: dont nous avons besoin
  alternative: quotidien ; pour le jour qui vient ; substantiel ou supersubstantiel
  rationale: Le terme grec demeure incertain. Le contexte lucanien, avec « chaque jour », favorise l’idée d’une provision régulière et nécessaire. Le texte principal reste naturel sans imposer une lecture sacramentelle ou métaphysique, et la note signale l’ambiguïté réelle.
translation_notes:
  register: Français international moderne, simple et digne. La formulation évite la répétition lourde « pain quotidien chaque jour », tout en conservant explicitement l’insistance de Luc sur une provision reçue jour après jour.
