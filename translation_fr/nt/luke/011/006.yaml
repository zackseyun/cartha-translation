source:
  edition: SBLGNT
  text: ἐπειδὴ φίλος ⸀μου παρεγένετο ἐξ ὁδοῦ πρός με καὶ οὐκ ἔχω ὃ παραθήσω αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/006.yaml
  text: because a friend of mine has come to me from a journey[a], and I have nothing to set before him.
translation:
  language: fr
  text: car un de mes amis est arrivé chez moi après un voyage[a], et je n’ai rien à lui servir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « venant de la route ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπειδὴ
  choice: car
  rationale: Introduit naturellement en français la raison de la demande formulée dans la parabole.
- source_word: φίλος μου
  choice: un de mes amis
  rationale: Rend de façon idiomatique la tournure indéfinie avec le possessif, sans suggérer qu’il s’agit de l’unique ami du locuteur.
- source_word: παρεγένετο
  choice: est arrivé
  rationale: 'Exprime l’arrivée accomplie dont le résultat demeure pertinent : l’ami est maintenant présent.'
- source_word: ἐξ ὁδοῦ
  choice: après un voyage
  rationale: Communique naturellement l’idée d’une arrivée au terme d’un déplacement, tout en signalant en note la formulation grecque plus littérale.
- source_word: πρός με
  choice: chez moi
  rationale: Dans ce contexte d’hospitalité domestique, « chez moi » exprime idiomatiquement le mouvement vers le locuteur sans expliciter davantage le lieu.
- source_word: οὐκ ἔχω
  choice: je n’ai rien
  rationale: Rend directement et naturellement la négation de possession.
- source_word: ὃ παραθήσω αὐτῷ
  choice: à lui servir
  rationale: Dans un contexte de repas et d’hospitalité, παρατίθημι désigne ce que l’on présente à manger ; « servir » est naturel en français et conserve cette image.
theological_decisions: []
translation_notes:
  register: Français moderne, courant et digne. La formulation conserve le cadre concret de l’hospitalité tout en évitant un calque peu naturel de l’expression grecque ἐξ ὁδοῦ.
