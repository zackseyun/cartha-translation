  text: ⸂Κἀκεῖθεν ἐξελθόντος αὐτοῦ⸃ ἤρξαντο οἱ γραμματεῖς καὶ οἱ Φαρισαῖοι δεινῶς ἐνέχειν καὶ ἀποστοματίζειν αὐτὸν περὶ πλειόνων,
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/053.yaml
  text: And after he left there[a], the scribes and the Pharisees began to press him hard and to provoke him to speak about many things,
translation:
  language: fr
  text: Une fois Jésus sorti de là, les spécialistes de la Loi et les pharisiens commencèrent à le harceler et à le pousser à s’exprimer sur de nombreux sujets[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à le questionner de près sur de nombreux sujets » ou « à lui faire répondre sans préparation ». Le verbe grec est rare et évoque une tentative insistante de lui arracher des réponses.
    reason: lexical_alternative
lexical_decisions:
- source_word: Κἀκεῖθεν ἐξελθόντος αὐτοῦ
  choice: Après que Jésus fut sorti de là
  rationale: Le génitif absolu à l’aoriste situe la sortie avant les actions principales. Le nom « Jésus » explicite naturellement le référent du pronom en français, sans ajouter de contenu.
- source_word: ἤρξαντο
  choice: commencèrent
  rationale: Rend directement la valeur inchoative du verbe suivi des infinitifs.
- source_word: οἱ γραμματεῖς
  choice: les spécialistes de la Loi
  rationale: Dans ce contexte, γραμματεῖς désigne des experts religieux de la Loi; cette formulation actuelle communique mieux leur fonction que le terme devenu peu transparent « scribes ».
- source_word: οἱ Φαρισαῖοι
  choice: les pharisiens
  rationale: Translittération française habituelle du nom de ce groupe.
- source_word: δεινῶς ἐνέχειν
  choice: à s’acharner contre lui
  rationale: L’expression rend l’hostilité intense et la pression persistante exprimées par l’adverbe et le verbe, dans un français naturel.
- source_word: ἀποστοματίζειν αὐτὸν
  choice: à le pousser à parler
  rationale: Le verbe rare paraît désigner une tentative agressive de faire produire des réponses ou des déclarations. La traduction conserve cette idée sans préciser abusivement la méthode.
- source_word: περὶ πλειόνων
  choice: de nombreux sujets
  rationale: Le pluriel substantivé renvoie ici à une multiplicité de questions ou de matières, plutôt qu’à une comparaison explicite.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. « Spécialistes de la Loi » privilégie la compréhension fonctionnelle; « s’acharner contre lui » exprime vigoureusement l’hostilité sans archaïsme. La virgule précède l’appel de note conformément à la ponctuation française du verset.
