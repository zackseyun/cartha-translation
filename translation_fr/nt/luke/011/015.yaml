id: LUK.11.15
reference: Luke 11:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τινὲς δὲ ἐξ αὐτῶν εἶπον· Ἐν Βεελζεβοὺλ ⸀τῷ ἄρχοντι τῶν δαιμονίων ἐκβάλλει τὰ δαιμόνια·
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/015.yaml
  text: But some of them said[a], “By Beelzebul, the ruler of the demons, he casts out demons.”
translation:
  language: fr
  text: 'Mais certains d’entre eux dirent : « C’est par Béelzéboul, le chef des démons, qu’il chasse les démons. »[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Béelzébub : forme traditionnelle du nom rendu ici par Béelzéboul, conformément au texte grec.'
    reason: alternative_reading
lexical_decisions:
- source_word: τινὲς δὲ ἐξ αὐτῶν
  choice: Mais certains d’entre eux
  rationale: « Certains » rend naturellement le pluriel indéfini τινές, « d’entre eux » conserve la valeur partitive de ἐξ αὐτῶν, et « mais » exprime le contraste marqué par δέ avec la réaction précédente.
- source_word: εἶπον
  choice: dirent
  rationale: L’aoriste présente la parole comme un événement ponctuel. « Dirent » convient au registre narratif digne et courant.
- source_word: Ἐν Βεελζεβοὺλ
  choice: C’est par Béelzéboul
  rationale: Avec un nom personnel, ἐν exprime ici le moyen ou la puissance agissante. La tournure emphatique française « C’est par… que » reproduit clairement l’accusation. « Béelzéboul » suit la forme grecque Βεελζεβούλ.
- source_word: τῷ ἄρχοντι τῶν δαιμονίων
  choice: le chef des démons
  rationale: ἄρχων désigne celui qui commande ou exerce l’autorité. « Chef » est clair en français moderne et évite le sens dynastique que peut évoquer « prince ».
- source_word: ἐκβάλλει τὰ δαιμόνια
  choice: il chasse les démons
  rationale: Dans ce contexte d’exorcisme, ἐκβάλλω signifie expulser ou chasser. « Chasser les démons » est une formulation française naturelle et fidèle, tandis que δαιμόνια est rendu directement par « démons ».
theological_decisions:
- issue: Forme du nom Βεελζεβούλ
  choice: Béelzéboul
  alternative: Béelzébub
  rationale: Le texte principal suit la forme du grec SBLGNT. La forme traditionnelle française « Béelzébub » est signalée en note sans remplacer la donnée du texte source.
- issue: Sens de ἄρχων dans la hiérarchie démoniaque alléguée
  choice: le chef des démons
  alternative: le prince des démons
  rationale: « Chef » communique l’autorité attribuée à Béelzéboul sans ajouter de précision démonologique ni employer le titre traditionnel « prince », potentiellement moins transparent aujourd’hui.
translation_notes:
  register: Français international moderne, narratif et digne. La construction « C’est par… que » rend explicite l’instrumentalité de ἐν tout en restant naturelle. Le marqueur [a] est placé après la citation, conformément à son rôle de note sur le nom présent dans celle-ci.
