id: LUK.11.19
reference: Luke 11:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἰ δὲ ἐγὼ ἐν Βεελζεβοὺλ ἐκβάλλω τὰ δαιμόνια, οἱ υἱοὶ ὑμῶν ἐν τίνι ἐκβάλλουσιν; διὰ τοῦτο ⸂αὐτοὶ ὑμῶν κριταὶ⸃ ἔσονται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/019.yaml
  text: But if I cast out the demons by Beelzebul[b][a], by whom do your sons cast them out? Therefore they will be your judges.
translation:
  language: fr
  text: Mais si, moi, je chasse les démons par Béelzéboul, par qui vos fils les chassent-ils[a] ? C’est pourquoi ils seront eux-mêmes vos juges.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « par quoi » ou « par quelle puissance vos fils les chassent-ils ? »'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ
  choice: Mais si
  rationale: δέ marque ici un léger contraste dans la réfutation de Jésus ; « Mais si » rend naturellement cette articulation argumentative.
- source_word: ἐγὼ
  choice: moi, je
  rationale: Le pronom grec explicite est emphatique. La dislocation « moi, je » conserve ce relief en français naturel.
- source_word: ἐν Βεελζεβοὺλ
  choice: par Béelzéboul
  rationale: Dans ce contexte, ἐν exprime l’agent ou le moyen. « Par » reste concis et évite d’ajouter explicitement « la puissance de », absent du grec.
- source_word: ἐκβάλλω τὰ δαιμόνια
  choice: je chasse les démons
  rationale: Dans un contexte d’exorcisme, ἐκβάλλω signifie faire sortir ou chasser. « Chasser les démons » est courant, clair et digne en français moderne.
- source_word: οἱ υἱοὶ ὑμῶν
  choice: vos fils
  rationale: La traduction littérale conserve l’expression grecque et n’en fixe pas l’identité comme disciples, partisans ou compatriotes.
- source_word: ἐν τίνι
  choice: par qui
  rationale: La tournure demande ici par quel agent les exorcismes sont accomplis, en parallèle avec Béelzéboul. Le grec peut aussi se comprendre comme une question sur le moyen ou la puissance, possibilité signalée en note.
- source_word: ἐκβάλλουσιν
  choice: les chassent-ils
  rationale: La reprise de « chasser » maintient la correspondance avec le premier emploi de ἐκβάλλω ; le pronom « les » reprend naturellement les démons.
- source_word: διὰ τοῦτο
  choice: C’est pourquoi
  rationale: Cette formule rend clairement et naturellement la conséquence tirée de la question rhétorique.
- source_word: αὐτοὶ ὑμῶν κριταὶ ἔσονται
  choice: ils seront eux-mêmes vos juges
  rationale: '« Eux-mêmes » restitue l’accent porté par αὐτοί : ce sont précisément ces fils qui jugeront les interlocuteurs de Jésus.'
theological_decisions:
- issue: Identité de « vos fils »
  choice: Conserver « vos fils »
  alternative: vos disciples ; vos partisans ; vos compatriotes juifs
  rationale: Le grec ne précise pas l’identité du groupe. La formulation littérale préserve l’ambiguïté historique et théologique au lieu de la résoudre dans le texte.
- issue: Force de ἐν τίνι
  choice: par qui
  alternative: par quoi ; par quelle puissance
  rationale: Le parallèle personnel avec Béelzéboul favorise « par qui », sans exclure une lecture instrumentale. La note conserve cette possibilité.
translation_notes:
  register: Français international moderne, oral mais digne. « Moi, je » restitue l’emphase grecque sans lourdeur excessive ; « eux-mêmes » conserve celle de αὐτοί. Le nom propre est translittéré « Béelzéboul ».
