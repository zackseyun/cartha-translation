id: LUK.11.16
reference: Luke 11:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἕτεροι δὲ πειράζοντες σημεῖον ⸂ἐξ οὐρανοῦ ἐζήτουν παρ’ αὐτοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/016.yaml
  text: But others[a], testing him, were seeking from him a sign from heaven.
translation:
  language: fr
  text: Mais d’autres, pour le mettre à l’épreuve, lui demandaient un signe venant du ciel[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « un signe céleste ».'
    reason: Cette autre formulation est possible, mais elle peut décrire aussi bien la nature du signe que son origine.
lexical_decisions:
- source_word: ἕτεροι
  choice: d’autres
  rationale: Le terme distingue ce groupe des personnes mentionnées auparavant ; « d’autres » exprime naturellement ce contraste en français.
- source_word: δὲ
  choice: mais
  rationale: La particule marque ici une légère opposition entre les réactions rapportées dans le contexte.
- source_word: πειράζοντες
  choice: pour le mettre à l’épreuve
  rationale: Dans ce contexte hostile, le participe décrit une tentative de tester Jésus. Cette formulation française exprime clairement l’intention sans suggérer nécessairement une tentation morale.
- source_word: σημεῖον
  choice: un signe
  rationale: « Signe » conserve le terme grec sans préciser davantage la nature du phénomène, déjà suggérée par le contexte.
- source_word: ἐξ οὐρανοῦ
  choice: venant du ciel
  rationale: La formule indique l’origine céleste demandée pour le signe et évite une répétition maladroite de « de ».
- source_word: ἐζήτουν
  choice: demandaient
  rationale: Dans cette construction, le verbe signifie demander ou chercher à obtenir. L’imparfait français conserve l’aspect continu ou répété de l’imparfait grec.
- source_word: παρ’ αὐτοῦ
  choice: lui demandaient
  rationale: Le complément indirect français rend naturellement Jésus comme la personne à qui le signe était demandé, tout en conservant distinctement l’origine céleste du signe.
theological_decisions:
- issue: Nature du signe demandé
  choice: un signe venant du ciel
  alternative: un signe céleste
  rationale: La traduction principale met en avant l’origine ou l’authentification céleste du signe sans préciser davantage sa nature ni résoudre la tension narrative.
translation_notes:
  register: Français international moderne, clair et digne. La phrase reste concise ; « mettre à l’épreuve » restitue l’hostilité du contexte, tandis que l’imparfait « demandaient » rend l’action continue ou répétée.
