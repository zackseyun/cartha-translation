source:
  edition: SBLGNT
  text: κἀκεῖνος ἔσωθεν ἀποκριθεὶς εἴπῃ· Μή μοι κόπους πάρεχε· ἤδη ἡ θύρα κέκλεισται, καὶ τὰ παιδία μου μετ’ ἐμοῦ εἰς τὴν κοίτην εἰσίν· οὐ δύναμαι ἀναστὰς δοῦναί σοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/007.yaml
  text: and he from inside answers and says, ‘Do not trouble me. The door has already been shut, and my children are with me in bed. I am not able to get up and give you anything.’
translation:
  language: fr
  text: 'et que, de l’intérieur, il lui réponde : « Ne me dérange pas[a]. La porte est déjà fermée[b], et mes enfants sont au lit avec moi[c]. Je ne peux pas me lever pour te donner quoi que ce soit. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Ne m’importune pas » ou « Ne me cause pas d’ennuis ». L’expression grecque signifie littéralement « procurer des peines ».
    reason: lexical_alternative
  - marker: b
    text: Ou « La porte a déjà été fermée ». Le parfait grec peut mettre en relief soit l’action accomplie, soit l’état qui en résulte.
    reason: lexical_alternative
  - marker: c
    text: Il est ici question de l’espace de couchage partagé par les membres d’un même foyer, sans aucune connotation d’intimité sexuelle.
    reason: cultural_note
lexical_decisions:
- source_word: κἀκεῖνος ἔσωθεν ἀποκριθεὶς εἴπῃ
  choice: et que, de l’intérieur, il lui réponde
  rationale: Le tour français conserve l’enchaînement hypothétique marqué par le subjonctif grec et la provenance de la réponse, tout en rendant naturellement la formule narrative « répondre et dire » par le seul verbe « répondre ».
- source_word: Μή μοι κόπους πάρεχε
  choice: Ne me dérange pas
  rationale: L’expression grecque signifie littéralement causer ou procurer des peines, d’où l’idée contextuelle d’importuner ou de déranger quelqu’un.
- source_word: ἤδη ἡ θύρα κέκλεισται
  choice: La porte est déjà fermée
  rationale: Le parfait grec présente une fermeture accomplie dont l’état demeure. Le présent français exprime clairement cet état résultant sans ajouter l’idée non explicite de verrouillage.
- source_word: τὰ παιδία μου μετ’ ἐμοῦ εἰς τὴν κοίτην εἰσίν
  choice: mes enfants sont au lit avec moi
  rationale: Cette formulation garde la proximité familiale et le lieu de couchage commun indiqués par le grec, sans préciser davantage l’âge des enfants.
- source_word: οὐ δύναμαι ἀναστὰς δοῦναί σοι
  choice: Je ne peux pas me lever pour te donner quoi que ce soit
  rationale: Le participe exprime l’action préalable nécessaire pour donner. « Quoi que ce soit » explicite en français l’objet sous-entendu par le contexte immédiat de la demande de pain.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Le vouvoiement n’est pas employé, puisque le singulier grec et la scène entre voisins appellent ici le tutoiement. La structure au subjonctif (« et que… il lui réponde ») maintient le lien syntaxique avec la situation hypothétique commencée au verset précédent.
