  verdict: revise
  source_fidelity: 'Le sens est globalement fidèle : l’addition de « aussi », la dénonciation « Malheur », les fardeaux difficiles à porter et le contraste emphatique sont bien rendus. Toutefois, « répondit » est plus spécifique que εἶπεν (« dit ») et ne reproduit pas le choix sobre du texte source. La formule finale peut refléter plus exactement le partitif grec par « d’un seul de vos doigts ».'
  naturalness: Le français est naturel, moderne et d’un registre approprié. « Spécialistes de la Loi » est clair et évite l’anachronisme de « juristes ». « Vous ne touchez pas les fardeaux d’un seul de vos doigts » demeure idiomatique tout en étant plus proche de l’image grecque.
  terminology: « Loi » avec majuscule convient ici à la Loi juive/Mosaïque. Le terme « spécialistes de la Loi » est précis sans confondre les νομικοί avec les scribes ni leur attribuer une fonction juridique moderne.
