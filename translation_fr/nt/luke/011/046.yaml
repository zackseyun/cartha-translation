id: LUK.11.46
reference: Luke 11:46
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν· Καὶ ὑμῖν τοῖς νομικοῖς οὐαί, ὅτι φορτίζετε τοὺς ἀνθρώπους φορτία δυσβάστακτα, καὶ αὐτοὶ ἑνὶ τῶν δακτύλων ὑμῶν οὐ προσψαύετε τοῖς φορτίοις.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/046.yaml
  text: But he said[a], “Woe also to you lawyers, because you load people with burdens hard to bear[b], and you yourselves do not touch the burdens with one of your fingers.”
translation:
  language: fr
  text: 'Mais il dit : « Malheur à vous aussi, spécialistes de la Loi[a], parce que vous chargez les gens de fardeaux difficiles à porter, et vous-mêmes, vous ne touchez pas les fardeaux d’un seul de vos doigts[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « docteurs de la Loi ». Le terme grec désigne ici des spécialistes de la Loi juive.
    reason: lexical_alternative
  - marker: b
    text: L’expression souligne qu’ils ne font pas le moindre geste à l’égard des fardeaux qu’ils imposent aux autres.
    reason: idiom_explanation
lexical_decisions:
- source_word: νομικοῖς
  choice: spécialistes de la Loi
  rationale: Dans Luc, le terme désigne des spécialistes de la loi juive, et non des juristes au sens civil moderne. Cette formulation explicite naturellement le référent en français.
- source_word: οὐαί
  choice: Malheur à vous
  rationale: Cette formule conserve la force prophétique de l’avertissement et de la dénonciation.
- source_word: φορτίζετε
  choice: vous chargez
  rationale: Le verbe causatif évoque concrètement l’action de placer une charge sur quelqu’un et maintient la métaphore avec « fardeaux ».
- source_word: ἀνθρώπους
  choice: les gens
  rationale: Le nom est générique ici et désigne les êtres humains sans distinction de sexe ; « les gens » est courant et naturel.
- source_word: φορτία δυσβάστακτα
  choice: des fardeaux difficiles à porter
  rationale: Cette traduction préserve l’image concrète et n’exagère pas δυσβάστακτα en le rendant par « insupportables ».
- source_word: αὐτοὶ
  choice: vous-mêmes
  rationale: Le pronom emphatique souligne le contraste entre ceux qui imposent les fardeaux et leur propre conduite.
- source_word: ἑνὶ τῶν δακτύλων ὑμῶν
  choice: d’un seul doigt
  rationale: Cette expression française naturelle conserve l’idée du geste le plus minime.
- source_word: προσψαύετε
  choice: vous ne touchez pas
  rationale: Le rendu garde le sens concret du verbe et la métaphore du texte sans expliciter excessivement l’aide qu’ils refusent d’apporter.
- source_word: Καὶ ὑμῖν
  choice: à vous aussi
  rationale: '« Aussi » conserve la valeur additive de καί : ce malheur s’étend au groupe qui vient de prendre la parole.'
theological_decisions:
- issue: Identité des νομικοί
  choice: « spécialistes de la Loi », c’est-à-dire de la loi juive
  alternative: « juristes » ou « docteurs de la Loi »
  rationale: « Juristes » risquerait d’évoquer le droit civil moderne, tandis que « docteurs de la Loi » est plus traditionnel mais moins immédiatement transparent. Le choix retenu identifie leur fonction sans les confondre automatiquement avec les scribes.
- issue: Portée de la proposition finale
  choice: 'Conserver l’image concrète : « vous ne touchez pas ces fardeaux d’un seul doigt »'
  alternative: « vous ne levez pas le petit doigt pour aider »
  rationale: Le texte source affirme littéralement qu’ils ne touchent pas les fardeaux, même d’un doigt. La formulation retenue préserve l’accusation et son image sans ajouter explicitement la notion d’aide, qui demeure implicite.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « fardeaux » ainsi que l’emphase de « vous-mêmes » sont conservées pour maintenir le contraste et la force de l’image grecque.
