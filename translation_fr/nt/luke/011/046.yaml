  to: 'Mais il dit : « Malheur à vous aussi, spécialistes de la Loi[a], parce que vous chargez les gens de fardeaux difficiles à porter, et vous-mêmes, vous ne touchez pas les fardeaux d’un seul de vos doigts[b]. »'
