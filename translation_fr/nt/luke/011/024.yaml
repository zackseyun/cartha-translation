    rationale: Le grec καὶ μὴ εὑρίσκον signifie littéralement « et ne trouvant pas [de repos] » ; il n’exprime pas explicitement la cause. Employer « et, n’en trouvant pas » préserve la coordination et évite d’ajouter une relation causale.
