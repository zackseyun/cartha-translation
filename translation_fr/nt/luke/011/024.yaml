source:
  edition: SBLGNT
  text: Ὅταν τὸ ἀκάθαρτον πνεῦμα ἐξέλθῃ ἀπὸ τοῦ ἀνθρώπου, διέρχεται δι’ ἀνύδρων τόπων ζητοῦν ἀνάπαυσιν, καὶ μὴ ⸀εὑρίσκον λέγει· Ὑποστρέψω εἰς τὸν οἶκόν μου ὅθεν ἐξῆλθον·
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/024.yaml
  text: When the unclean spirit has gone out from the man[a], it passes through waterless places seeking rest, and not finding any, it says, ‘I will return to my house, from which I came out.’
translation:
  language: fr
  text: '« Lorsque l’esprit impur est sorti de l’homme, il parcourt des lieux sans eau[a], à la recherche de repos et, n’en trouvant pas, il dit : “Je retournerai dans ma maison, d’où je suis sorti.” »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « des lieux arides ». Le grec désigne littéralement des lieux sans eau.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅταν
  choice: Lorsque
  rationale: Introduit avec le subjonctif une situation générale éventuelle. « Lorsque » garde la valeur temporelle et convient au registre de l’enseignement.
- source_word: τὸ ἀκάθαρτον πνεῦμα
  choice: l’esprit impur
  rationale: Expression française naturelle qui conserve l’idée d’impureté rituelle et morale ainsi que le caractère personnel de l’esprit dans le récit.
- source_word: ἐξέλθῃ ἀπὸ τοῦ ἀνθρώπου
  choice: est sorti de l’homme
  rationale: Le passé composé rend naturellement l’antériorité de l’aoriste subjonctif dans la proposition temporelle. « L’homme » maintient le singulier masculin représentatif du grec.
- source_word: διέρχεται δι’ ἀνύδρων τόπων
  choice: il parcourt des lieux sans eau
  rationale: « Parcourt » exprime le déplacement à travers ces lieux, et « sans eau » conserve l’image précise de ἀνύδρων sans la réduire d’emblée à « arides ».
- source_word: ζητοῦν ἀνάπαυσιν
  choice: à la recherche de repos
  rationale: Rend clairement la visée du participe tout en conservant le terme « repos ».
- source_word: καὶ μὴ εὑρίσκον
  choice: Comme il n’en trouve pas
  rationale: Le pronom « en » reprend naturellement « repos » en français, et « comme » explicite sobrement le lien circonstanciel sans modifier le sens.
- source_word: λέγει
  choice: il dit
  rationale: Conserve le présent grec et présente l’esprit comme un agent personnel qui formule une résolution.
- source_word: Ὑποστρέψω εἰς τὸν οἶκόν μου
  choice: Je retournerai dans ma maison
  rationale: Le futur exprime la résolution; « maison » préserve l’image concrète développée dans la suite, et « dans » convient au mouvement de retour vers l’intérieur.
- source_word: ὅθεν ἐξῆλθον
  choice: d’où je suis sorti
  rationale: Reproduit la proposition relative et fait écho à la sortie mentionnée au début du verset.
theological_decisions:
- issue: Nature de « l’esprit impur »
  choice: Le texte le présente comme un agent personnel qui se déplace, cherche et parle.
  alternative: Y voir uniquement une métaphore de la rechute morale ou une force impersonnelle.
  rationale: La traduction conserve la présentation narrative du grec sans imposer une réduction métaphorique ni développer une doctrine au-delà du texte.
- issue: Portée de τοῦ ἀνθρώπου
  choice: « de l’homme », au singulier masculin représentatif
  alternative: « d’une personne » ou « de quelqu’un »
  rationale: Ce choix maintient la forme définie et masculine du grec, tout en laissant le contexte indiquer qu’il s’agit d’un cas général.
translation_notes:
  register: Français international moderne, clair et digne. La structure reste proche du grec, avec quelques ajustements idiomatiques (« à la recherche de », reprise par « en »). Le marqueur de note est placé après l’expression qu’il explique.
