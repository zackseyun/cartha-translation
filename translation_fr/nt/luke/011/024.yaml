  source_fidelity: 'La phrase rend fidèlement les principaux éléments du grec : l’esprit impur, la sortie de l’homme, les lieux sans eau, la recherche de repos, le retour projeté vers « ma maison » et la relative « d’où je suis sorti ». Toutefois, « Comme il n’en trouve pas » introduit normalement une nuance causale (« puisqu’il n’en trouve pas »), alors que καὶ μὴ εὑρίσκον coordonne simplement le fait de ne pas trouver de repos.'
