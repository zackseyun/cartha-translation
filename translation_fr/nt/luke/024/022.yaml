review_pass:
  verdict: revise
  source_fidelity: « Nous ont bouleversés » tend à exprimer un choc affectif profond, alors que ἐξέστησαν décrit plus directement un fort étonnement, pouvant aller jusqu’à la déconcertation. « Nous ont stupéfiés » rend mieux cette amplitude sans décider de la réaction croyante ou incrédule. Le participe aoriste génόμεναι est rendu de façon plus proche et naturelle par « s’étant rendues »; le plus-que-parfait « s’étaient rendues » ajoute inutilement une antériorité narrative marquée.
  naturalness: La formulation révisée est idiomatique dans un registre biblique moderne et conserve la phrase comme une affirmation qui prépare la suite du récit. Le placement de « aussi » après le verbe est plus fluide que « Mais en plus » tout en gardant la valeur additive de καί.
  terminology: « Tombeau » convient à μνημεῖον dans ce contexte. « Quelques femmes de notre groupe » rend clairement γυναῖκές τινες ἐξ ἡμῶν sans alourdir la phrase. Les notes proposent des équivalents français naturels et maintiennent l’ambiguïté lexicale.
  issues:
  - severity: medium
    issue: « nous ont bouleversés » pour ἐξέστησαν
    rationale: Le terme français suggère volontiers un bouleversement émotionnel, voire traumatique, qui n’est pas requis par le grec. « Stupéfiés » exprime plus exactement le saisissement ou l’étonnement intense; « déconcertés » demeure une possibilité en note.
  - severity: low
    issue: Plus-que-parfait « elles s’étaient rendues »
    rationale: Cette forme est possible en contexte, mais elle accentue une antériorité que le participe aoriste ne demande pas. « S’étant rendues » préserve plus directement le lien participial avec l’assertion principale.
