lexical_decisions:
- source_word: ἀλλὰ καὶ
  choice: Mais en plus
  rationale: Rend à la fois le contraste avec la déception exprimée auparavant et l’ajout d’un élément surprenant.
- source_word: γυναῖκές τινες
  choice: quelques femmes
  rationale: Formulation naturelle en français moderne pour un groupe féminin indéfini.
- source_word: ἐξ ἡμῶν
  choice: de notre groupe
  rationale: Indique clairement que ces femmes appartenaient au cercle des disciples.
- source_word: ἐξέστησαν ἡμᾶς
  choice: nous ont bouleversés
  rationale: Le verbe exprime ici un fort saisissement pouvant inclure l’étonnement ou le désarroi; « bouleversés » en conserve l’intensité sans préciser à tort la réaction exacte.
- source_word: γενόμεναι ὀρθριναὶ
  choice: elles s’étaient rendues … de bon matin
  rationale: Tour français idiomatique qui exprime leur présence matinale au tombeau et, avec la préposition directionnelle, leur déplacement vers celui-ci.
- source_word: ἐπὶ τὸ μνημεῖον
  choice: au tombeau
  rationale: Avec ἐπί et l’accusatif, le contexte favorise un mouvement vers le tombeau; « au tombeau » s’emploie naturellement après « se rendre ».
theological_decisions:
- issue: Portée de ἐξέστησαν dans le récit concernant la résurrection
  choice: nous ont bouleversés
  alternative: nous ont stupéfiés / nous ont déconcertés
  rationale: La formulation maintient ouverte la nature exacte de leur réaction et n’indique prématurément ni foi ni incrédulité face au témoignage des femmes.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase conserve le lien avec le verset précédent et demeure ouverte, puisqu’elle se poursuit au verset suivant.
