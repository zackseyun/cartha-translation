revisions:
- from: 'Mais en plus, quelques femmes de notre groupe nous ont bouleversés[a] : elles s’étaient rendues au tombeau de bon matin[b]'
  to: Mais quelques femmes de notre groupe nous ont aussi stupéfiés[a], s’étant rendues de bon matin au tombeau[b]
  rationale: La révision remplace un terme affectivement plus fort et moins précis par « stupéfiés », qui rend le sens principal de ἐξέστησαν tout en laissant ouverte la nuance de déconcertement. Elle restitue aussi plus fidèlement la construction participiale et la direction vers le tombeau, sans imposer d’interprétation théologique.
