  text: καὶ ἦσαν διὰ παντὸς ἐν τῷ ἱερῷ ⸀εὐλογοῦντες τὸν ⸀θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/053.yaml
  text: And they were continually in the temple[a], blessing God.
translation:
  language: fr
  text: Et ils étaient sans cesse dans le temple et bénissaient Dieu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « louant Dieu ». Le verbe grec signifie « bénir ».
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Et
  rationale: Conjonction simple qui relie ce verset conclusif au récit précédent sans ajouter de nuance interprétative.
- source_word: ἦσαν
  choice: ils étaient
  rationale: L’imparfait décrit une situation qui se prolongeait; cette valeur durative est renforcée par « constamment ».
- source_word: διὰ παντός
  choice: constamment
  rationale: Cette locution signifie « continuellement » ou « en tout temps ». « Constamment » exprime naturellement la régularité persistante dans ce contexte.
- source_word: ἐν τῷ ἱερῷ
  choice: dans le temple
  rationale: ἱερόν désigne l’ensemble du complexe du temple, et non précisément le sanctuaire intérieur. « Dans le temple » est la formulation française usuelle et concise.
- source_word: εὐλογοῦντες
  choice: bénissant
  rationale: Le participe de εὐλογέω signifie littéralement « bénissant » ou « disant du bien de ». Avec Dieu pour objet, « bénissant Dieu » reste intelligible et conserve le terme grec plutôt que de le réduire à « louant ».
- source_word: τὸν θεόν
  choice: Dieu
  rationale: Complément d’objet direct de « bénissant »; traduction directe et naturelle.
theological_decisions:
- issue: Langage d’adoration envers Dieu dans εὐλογοῦντες τὸν θεόν
  choice: bénissant Dieu
  alternative: louant Dieu
  rationale: Le grec emploie εὐλογέω, et non αἰνέω. « Bénissant Dieu » préserve cette distinction lexicale et l’expression biblique, tandis que « louant Dieu » explicite son sens contextuel possible.
translation_notes:
  register: Français international moderne, simple et digne. La syntaxe conserve le caractère conclusif du verset et le vocabulaire cultuel du grec sans archaïsme marqué.
