  variant: modern international French
source:
  edition: SBLGNT
  text: οἱ δὲ ὀφθαλμοὶ αὐτῶν ἐκρατοῦντο τοῦ μὴ ἐπιγνῶναι αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/016.yaml
  text: But their eyes were kept from recognizing him[a].
translation:
  language: fr
  text: Mais leurs yeux étaient empêchés de le reconnaître[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « étaient retenus, de sorte qu’ils ne le reconnaissaient pas ». Le grec ne précise pas qui ou quoi les empêchait de le reconnaître.
    reason: Variante lexicale et maintien de l’agent implicite du passif grec.
lexical_decisions:
- source_word: δὲ
  choice: Mais
  rationale: La particule marque ici un léger contraste entre la présence de Jésus et l’incapacité des disciples à le reconnaître.
- source_word: οἱ ὀφθαλμοὶ αὐτῶν
  choice: leurs yeux
  rationale: Cette formulation naturelle en français conserve l’image corporelle concrète du grec.
- source_word: ἐκρατοῦντο
  choice: étaient empêchés
  rationale: Le passif exprime une entrave sans en préciser l’agent. « Étaient empêchés » rend clairement le sens dans un français actuel tout en maintenant ce passif.
- source_word: τοῦ μὴ ἐπιγνῶναι
  choice: de reconnaître
  rationale: Dans ce contexte, ἐπιγινώσκω désigne l’identification d’une personne plutôt que le simple fait de la connaître. La construction française complète naturellement « étaient empêchés ».
- source_word: αὐτόν
  choice: le
  rationale: Le pronom objet renvoie à Jésus dans le contexte immédiat.
theological_decisions:
- issue: Faut-il préciser qui empêchait les disciples de reconnaître Jésus ?
  choice: 'Conserver le passif sans agent : « leurs yeux étaient empêchés de le reconnaître ».'
  alternative: Expliciter une action divine (« Dieu les empêchait de le reconnaître ») ou reformuler comme une simple incapacité (« ils ne pouvaient pas le reconnaître »).
  rationale: Le grec ne nomme pas l’agent du passif. La traduction préserve donc cette indétermination et la tension théologique du texte.
translation_notes:
  register: Français international moderne, simple et digne. La syntaxe conserve l’image des yeux ainsi que le passif sans agent, malgré son caractère légèrement inhabituel en français.
