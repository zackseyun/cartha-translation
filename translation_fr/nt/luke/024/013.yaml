lexical_decisions:
- source_word: Καὶ ἰδοὺ
  choice: Et voici que
  rationale: Conserve le marqueur narratif qui attire l’attention, dans une formulation française claire et digne.
- source_word: δύο ἐξ αὐτῶν
  choice: deux d’entre eux
  rationale: Rend naturellement l’expression partitive sans préciser davantage l’identité du groupe.
- source_word: ἐν αὐτῇ τῇ ἡμέρᾳ
  choice: ce jour-là même
  rationale: Reproduit l’insistance du grec sur le fait que le déplacement avait lieu ce même jour.
- source_word: ἦσαν πορευόμενοι
  choice: se rendaient
  rationale: Exprime le déplacement en cours indiqué par la construction périphrastique à l’imparfait.
- source_word: εἰς κώμην
  choice: à un village
  rationale: κώμη désigne un village, et la préposition exprime ici la destination.
- source_word: ἀπέχουσαν σταδίους ἑξήκοντα ἀπὸ Ἰερουσαλήμ
  choice: situé à soixante stades de Jérusalem
  rationale: Conserve dans le texte l’unité de distance du monde ancien tout en formulant naturellement la relation spatiale en français.
- source_word: ᾗ ὄνομα Ἐμμαοῦς
  choice: dont le nom était Emmaüs
  rationale: Suit de près la construction nominale explicite du grec sans la réduire simplement à « appelé Emmaüs ».
