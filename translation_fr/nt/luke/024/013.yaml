  text: Καὶ ἰδοὺ δύο ἐξ αὐτῶν ⸂ἐν αὐτῇ τῇ ἡμέρᾳ ἦσαν πορευόμενοι⸃ εἰς κώμην ἀπέχουσαν σταδίους ἑξήκοντα ἀπὸ Ἰερουσαλήμ, ᾗ ὄνομα Ἐμμαοῦς,
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/013.yaml
  text: And behold[a], two of them were going that very day to a village sixty stadia from Jerusalem, whose name was Emmaus,
translation:
  language: fr
  text: Et voici que, ce jour-là même, deux d’entre eux se rendaient à un village situé à soixante stades[a] de Jérusalem, dont le nom était Emmaüs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le stade était une ancienne unité de distance ; soixante stades correspondent à environ 11 kilomètres.
