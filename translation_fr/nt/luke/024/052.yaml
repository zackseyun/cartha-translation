    issue: « Et eux » est une tournure lourde et peu idiomatique.
    rationale: Le pronom explicite αὐτοὶ porte une emphase discrète, mais « Et eux » ne la rend pas naturellement en français. « Ils » est préférable sans introduire le contraste plus fort de « quant à eux ».
  - severity: low
    issue: « remplis d’une grande joie » explicite davantage que le grec.
    rationale: μετὰ χαρᾶς μεγάλης signifie littéralement « avec une grande joie ». Cette formulation française est tout aussi naturelle et plus directement fidèle.
  revised_text: Ils, après s’être prosternés devant lui[a], retournèrent à Jérusalem avec une grande joie.
