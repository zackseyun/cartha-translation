  text: καὶ αὐτοὶ ⸂[προσκυνήσαντες αὐτὸν]⸃ ὑπέστρεψαν εἰς Ἰερουσαλὴμ μετὰ χαρᾶς μεγάλης,
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/052.yaml
  text: And they[a], after worshiping him, returned to Jerusalem with great joy[b],
translation:
  language: fr
  text: Ils, après s’être prosternés devant lui[a], retournèrent à Jérusalem avec une grande joie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Certains manuscrits omettent « après s’être prosternés devant lui ». Le verbe peut aussi être traduit par « après l’avoir adoré » ou « après lui avoir rendu hommage ».
    reason: Variante textuelle et alternative lexicale.
lexical_decisions:
- source_word: καὶ
  choice: Et
  rationale: Conserve le lien narratif simple du grec sans ajouter une nuance temporelle explicite.
- source_word: αὐτοὶ
  choice: eux
  rationale: Le pronom grec est explicite et légèrement emphatique; « eux » rend cette mise en relief de manière naturelle en français.
- source_word: προσκυνήσαντες αὐτόν
  choice: après s’être prosternés devant lui
  rationale: Le participe aoriste exprime ici une action antérieure au retour. « Se prosterner devant » préserve à la fois le geste d’hommage et la portée cultuelle possible du verbe, sans trancher une ambiguïté lexicale réelle.
- source_word: ὑπέστρεψαν
  choice: retournèrent
  rationale: Rend directement le sens de retour dans un registre narratif digne et courant.
- source_word: εἰς Ἰερουσαλήμ
  choice: à Jérusalem
  rationale: Formulation française idiomatique avec un nom de ville.
- source_word: μετὰ χαρᾶς μεγάλης
  choice: remplis d’une grande joie
  rationale: Expression française naturelle qui conserve le nom « joie » et son intensification par μεγάλη; « remplis » explicite idiomatiquement la manière dont cette joie accompagne les disciples.
theological_decisions:
- issue: Sens de προσκυνέω à l’égard de Jésus ressuscité
  choice: se prosterner devant lui
  alternative: l’adorer / lui rendre hommage
  rationale: Le verbe peut désigner la prosternation, l’hommage ou l’adoration. Dans ce contexte, la portée cultuelle est forte, mais la traduction principale conserve l’étendue sémantique du geste sans imposer une seule interprétation; la note signale les autres rendus possibles.
- issue: Présence de προσκυνήσαντες αὐτόν dans le texte
  choice: phrase conservée dans le texte principal avec une note de variante
  alternative: omission de la phrase
  rationale: La phrase figure dans le texte fourni tout en étant marquée comme textuellement incertaine. Elle est donc traduite, et son absence dans certains manuscrits est signalée.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple convient au récit biblique écrit. La formulation garde l’emphase discrète de αὐτοὶ et préserve l’ambiguïté de προσκυνέω.
