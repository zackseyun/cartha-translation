revisions:
- from: Or, comme elles restaient perplexes à ce sujet, voici que deux hommes se tinrent près d’elles, vêtus d’habits étincelants[a].
  to: Or, tandis qu’elles étaient perplexes à ce sujet, voici que deux hommes se tinrent près d’elles, dans des vêtements éclatants[a].
  rationale: La révision supprime la redondance de « vêtus d’habits », rend plus naturellement la simultanéité de la construction temporelle grecque et conserve la portée narrative de « voici que » ainsi que « deux hommes ». Le pluriel français « des vêtements » est idiomatique pour deux personnes, tandis que la note conserve le singulier et l’image de l’éclair du grec.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T11:05:07Z'
review_pass:
  verdict: revise
  source_fidelity: 'Le sens est fidèlement rendu : la formule narrative, la perplexité simultanée, l’arrivée ou présence de deux hommes, et l’éclat de leur tenue sont tous préservés. Une légère révision est recommandée pour mieux rendre ἐν ἐσθῆτι, qui parle de la tenue sans employer explicitement « vêtus » et se présente au singulier grec.'
  naturalness: « Comme elles restaient perplexes » est compréhensible, mais « tandis qu’elles étaient perplexes » est plus direct et idiomatique. « Vêtus d’habits » est redondant en français ; « dans des vêtements éclatants » est plus naturel dans le récit.
  terminology: « Deux hommes » respecte exactement la présentation narrative de ἄνδρες δύο et n’anticipe pas l’identification angélique. « Voici que » rend bien ἰδού. « Éclatants » rend l’intensité lumineuse de ἀστραπτούσῃ, avec l’image de l’éclair conservée en note.
  issues:
  - severity: low
    issue: Redondance dans « vêtus d’habits étincelants »
    rationale: La construction est française mais lourde et quelque peu tautologique. Le grec dit littéralement qu’ils étaient « dans une tenue » lumineuse, sans le participe explicite « vêtus ».
  - severity: low
    issue: Incohérence de nombre entre le texte et la note
    rationale: Le texte emploie « habits » au pluriel, tandis que la note indique « un habit ». Le singulier grec peut être rendu naturellement par un pluriel distributif en français, mais la note doit présenter la valeur littérale avec précision.
  revised_text: Or, tandis qu’elles étaient perplexes à ce sujet, voici que deux hommes se tinrent près d’elles, dans des vêtements éclatants[a].
  revised_footnotes:
