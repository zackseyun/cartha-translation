id: LUK.24.4
reference: Luke 24:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἐγένετο ἐν τῷ ⸀ἀπορεῖσθαι αὐτὰς περὶ τούτου καὶ ἰδοὺ ἄνδρες δύο ἐπέστησαν αὐταῖς ἐν ⸂ἐσθῆτι ἀστραπτούσῃ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/004.yaml
  text: And it happened[a], while they were perplexed about this, that behold, two men stood by them in dazzling clothing.
translation:
  language: fr
  text: Or, tandis qu’elles étaient perplexes à ce sujet, voici que deux hommes se tinrent près d’elles, dans des vêtements éclatants[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « dans un vêtement qui brillait comme l’éclair ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: Or
  rationale: La formule narrative lucanienne καὶ ἐγένετο introduit ici la circonstance suivante. En français moderne, « Or » en restitue naturellement la fonction sans recourir au tour plus lourd « Il arriva que ».
- source_word: ἐν τῷ ἀπορεῖσθαι αὐτὰς
  choice: comme elles restaient perplexes
  rationale: La construction ἐν τῷ avec infinitif est temporelle. « Restـaient perplexes » exprime le fait qu’elles ne savaient que penser ou faire, plutôt qu’une simple curiosité.
- source_word: περὶ τούτου
  choice: à ce sujet
  rationale: Expression référentielle naturelle renvoyant à la disparition du corps qui vient d’être constatée.
- source_word: ἰδοὺ
  choice: voici que
  rationale: Ce marqueur attire l’attention sur une apparition soudaine et conserve la vivacité du récit dans un français actuel et digne.
- source_word: ἄνδρες δύο
  choice: deux hommes
  rationale: ἀνήρ désigne ici des figures présentées narrativement comme des hommes; la traduction n’anticipe pas leur identification céleste donnée par le contexte.
- source_word: ἐπέστησαν αὐταῖς
  choice: se tinrent près d’elles
  rationale: Le verbe exprime leur présence soudaine à proximité. Cette formulation conserve la dimension spatiale sans expliciter davantage que le grec le mode de leur venue.
- source_word: ἐν ἐσθῆτι ἀστραπτούσῃ
  choice: vêtus d’habits étincelants
  rationale: La tournure française rend naturellement le vêtement et son éclat intense; l’image plus littérale de l’éclair est conservée en note.
theological_decisions:
- issue: Identité des deux figures
  choice: deux hommes
  alternative: deux anges
  rationale: Le verset les présente explicitement comme « deux hommes ». Même si le contexte indique qu’il s’agit de messagers célestes, traduire ici « anges » importerait cette identification dans le texte au lieu de laisser le récit la communiquer.
translation_notes:
  register: Français international moderne, narratif et digne. « Or » et « voici que » gardent le relief littéraire du récit sans archaïsme marqué; « habits étincelants » reste immédiatement compréhensible.
