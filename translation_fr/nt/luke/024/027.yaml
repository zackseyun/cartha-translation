source:
  edition: SBLGNT
  text: καὶ ἀρξάμενος ἀπὸ Μωϋσέως καὶ ἀπὸ πάντων τῶν προφητῶν ⸀διερμήνευσεν αὐτοῖς ἐν πάσαις ταῖς γραφαῖς τὰ περὶ ⸀ἑαυτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/027.yaml
  text: And beginning with Moses and all the Prophets[b][a], he interpreted to them in all the Scriptures the things concerning himself.
translation:
  language: fr
  text: Et, commençant par Moïse et par tous les prophètes[b], il leur expliqua[a], dans toutes les Écritures, ce qui le concernait.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « interpréta » ou « exposa ». Le verbe grec peut désigner une explication détaillée.
    reason: lexical_alternative
  - marker: b
    text: « Moïse et tous les prophètes » renvoie, dans ce contexte scripturaire, aux écrits associés à Moïse et aux témoignages des prophètes.
    reason: cultural_note
lexical_decisions:
- source_word: ἀρξάμενος
  choice: en commençant
  rationale: Le participe aoriste introduit l’action principale. « En commençant » conserve ce lien tout en restant naturel en français moderne.
- source_word: ἀπὸ Μωϋσέως
  choice: par Moïse
  rationale: Après « en commençant », « par » indique naturellement le premier point du parcours scripturaire; dans ce contexte, Moïse désigne les écrits qui lui sont associés.
- source_word: πάντων τῶν προφητῶν
  choice: tous les Prophètes
  rationale: La majuscule signale qu’il s’agit de la division reconnue des écrits bibliques appelée « les Prophètes », et non simplement de tous les individus ayant prophétisé.
- source_word: διερμήνευσεν
  choice: expliqua
  rationale: Le verbe désigne l’action d’interpréter ou d’exposer le sens en détail. « Expliqua » est clair et naturel, tandis que la note conserve les autres nuances possibles.
- source_word: αὐτοῖς
  choice: leur
  rationale: Le pronom datif est rendu directement comme complément indirect.
- source_word: ἐν πάσαις ταῖς γραφαῖς
  choice: dans toutes les Écritures
  rationale: γραφή désigne ici les écrits sacrés. Cette formulation conserve à la fois la valeur de ἐν et l’ampleur exprimée par πάσαις.
- source_word: τὰ περὶ ἑαυτοῦ
  choice: ce qui le concernait
  rationale: Cette formulation française naturelle garde la portée générale de l’expression grecque sans préciser indûment s’il s’agit uniquement de prédictions, de figures ou d’autres thèmes.
theological_decisions:
- issue: Portée de l’explication scripturaire donnée par Jésus
  choice: Le verset affirme que Jésus expliqua, à travers les Écritures, ce qui le concernait, sans limiter ces éléments à une seule catégorie herméneutique.
  alternative: Limiter le propos aux seules prédictions messianiques directes, ou affirmer que chaque passage des Écritures parle individuellement de lui.
  rationale: Le grec autorise une lecture christologique large, mais ne précise ni que seuls des oracles explicites sont visés ni que chaque passage particulier se rapporte directement à Jésus. La traduction préserve cette ampleur et cette tension.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe suit le mouvement du grec sans lourdeur. « Écritures » et « Prophètes » prennent une majuscule pour signaler leur emploi comme désignations scripturaires.
