    issue: Majuscule à « Prophètes » et note culturelle trop catégorique
    rationale: Le contexte renvoie bien aux Écritures, mais πάντων τῶν προφητῶν peut désigner tous les prophètes en tant que témoins scripturaires aussi bien qu’une collection d’écrits. La formulation actuelle (« la division reconnue ») tranche une question que le grec ne tranche pas explicitement.
  - severity: low
    issue: « Puis » pour le καί initial
    rationale: « Puis » est possible dans le récit, mais ajoute une nuance séquentielle plus marquée. « Et » est plus directement fidèle à la coordination grecque et demeure naturel ici.
  revised_text: Et, commençant par Moïse et par tous les prophètes[b], il leur expliqua[a], dans toutes les Écritures, ce qui le concernait.
