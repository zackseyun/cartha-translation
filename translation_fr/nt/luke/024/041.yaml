  to: 'Et comme ils n’arrivaient toujours pas à y croire, tant leur joie était grande, et qu’ils étaient dans l’étonnement[a], il leur dit : « Avez-vous ici quelque chose à manger ? »'
  rationale: La révision remplace « ils n’y croyaient toujours pas » par « ils n’arrivaient toujours pas à y croire », tournure naturelle qui rend bien l’incapacité momentanée à croire devant une joie accablante. Elle remplace aussi « émerveillés » par « dans l’étonnement », plus neutre et plus directement conforme à θαυμαζόντων. Le lien causal de la joie, la continuité de leur réaction et la question de Jésus sont conservés.
