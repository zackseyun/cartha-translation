  source_fidelity: 'Le sens global est bien rendu : la difficulté à croire demeure en cours, elle est liée à la joie, et elle s’accompagne d’étonnement. Toutefois, « émerveillés » accentue l’admiration heureuse plus que θαυμαζόντων, qui désigne plus directement l’étonnement ou la stupeur. « Dans l’étonnement » conserve mieux la portée du grec sans surinterpréter la tonalité affective.'
  naturalness: 'La phrase est compréhensible et de registre approprié. La révision proposée allège toutefois l’enchaînement des deux propositions participiales et emploie une tournure française très naturelle dans ce contexte : « n’arrivaient ... à y croire » et « étaient dans l’étonnement ».'
