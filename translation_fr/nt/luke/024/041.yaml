id: LUK.24.41
reference: Luke 24:41
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἔτι δὲ ἀπιστούντων αὐτῶν ἀπὸ τῆς χαρᾶς καὶ θαυμαζόντων εἶπεν αὐτοῖς· Ἔχετέ τι βρώσιμον ἐνθάδε;
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/041.yaml
  text: And while they still were disbelieving because of joy and were marveling[a], he said to them, “Do you have anything here to eat?”
translation:
  language: fr
  text: 'Et comme ils n’arrivaient toujours pas à y croire, tant leur joie était grande, et qu’ils étaient dans l’étonnement[a], il leur dit : « Avez-vous ici quelque chose à manger ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « et qu’ils étaient stupéfaits ».'
    reason: Alternative lexicale pour θαυμαζόντων, qui peut exprimer une stupeur ou un étonnement marqué.
lexical_decisions:
- source_word: ἔτι δὲ
  choice: Et comme ils… toujours
  rationale: ἔτι marque la continuité (« toujours »), tandis que δέ assure ici une transition légère; la construction avec « comme » introduit naturellement en français les deux participes au génitif.
- source_word: ἀπιστούντων
  choice: ils n’y croyaient toujours pas
  rationale: L’imparfait rend l’aspect continu du participe présent sans suggérer une incrédulité permanente; le pronom « y » renvoie naturellement, dans le contexte, à la réalité qu’ils constatent.
- source_word: ἀπὸ τῆς χαρᾶς
  choice: tant leur joie était grande
  rationale: ἀπό indique ici la cause. Cette tournure française exprime clairement le paradoxe d’une joie si intense qu’elle contribue à leur difficulté à croire, sans éliminer la tension du texte.
- source_word: θαυμαζόντων
  choice: ils étaient émerveillés
  rationale: L’imparfait conserve la simultanéité et la durée du second participe; « émerveillés » associe l’étonnement à une vive admiration, conformément au contexte joyeux.
- source_word: Ἔχετέ
  choice: Avez-vous
  rationale: C’est la formulation interrogative naturelle en français moderne pour le présent de ἔχω.
- source_word: τι
  choice: quelque chose
  rationale: Dans cette question, le pronom indéfini τι se rend idiomatiquement par « quelque chose » en français.
- source_word: βρώσιμον
  choice: à manger
  rationale: Cette expression française naturelle restitue le sens de « comestible, propre à être mangé ».
- source_word: ἐνθάδε
  choice: ici
  rationale: L’adverbe local est rendu directement et sobrement par « ici ».
theological_decisions:
- issue: Nature de la réaction des disciples devant Jésus ressuscité
  choice: Leur difficulté persistante à croire est présentée comme liée à l’intensité de leur joie et accompagnée d’émerveillement.
  alternative: Mettre principalement l’accent sur leur scepticisme en traduisant simplement qu’ils ne croyaient pas encore et étaient étonnés.
  rationale: La formulation conserve ensemble ἀπιστούντων, la cause ἀπὸ τῆς χαρᾶς et θαυμαζόντων. Elle ne transforme donc ni leur réaction en rejet obstiné ni leur joie en pleine foi déjà acquise.
translation_notes:
  register: Français international moderne, naturel et digne. L’imparfait maintient la durée et la simultanéité des participes grecs. La tournure « tant leur joie était grande » explicite idiomatiquement la valeur causale de ἀπό tout en préservant le paradoxe émotionnel du passage.
