  text: καὶ αὐτοὶ ὡμίλουν πρὸς ἀλλήλους περὶ πάντων τῶν συμβεβηκότων τούτων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/014.yaml
  text: And they were talking with one another about all these things that had happened[a].
translation:
  language: fr
  text: Et ils parlaient entre eux de tout ce qui était arrivé.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: Et
  rationale: Conjonction narrative simple, qui relie ce verset au précédent sans ajouter une nuance temporelle absente du grec.
- source_word: αὐτοὶ
  choice: ils
  rationale: Le pronom grec explicite est naturellement rendu par le sujet « ils » en français; son éventuelle légère insistance ne justifie pas ici « eux-mêmes ».
- source_word: ὡμίλουν
  choice: parlaient
  rationale: L’imparfait grec décrit une conversation en cours; l’imparfait français « parlaient » restitue naturellement cet aspect.
- source_word: πρὸς ἀλλήλους
  choice: entre eux
  rationale: Cette expression indique la réciprocité de la conversation; « entre eux » est idiomatique en français moderne.
- source_word: περὶ πάντων τῶν συμβεβηκότων τούτων
  choice: de tout ce qui était arrivé
  rationale: Cette formulation naturelle couvre l’ensemble des faits évoqués. Le plus-que-parfait rend l’antériorité des événements par rapport à leur conversation et le parfait participial grec.
theological_decisions: []
translation_notes:
  register: Français moderne, courant et digne. La phrase conserve la simplicité narrative du grec, sans expliciter davantage la nature des événements ni renforcer artificiellement le pronom sujet.
