id: LUK.24.46
reference: Luke 24:46
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς ὅτι οὕτως ⸀γέγραπται παθεῖν τὸν χριστὸν καὶ ἀναστῆναι ἐκ νεκρῶν τῇ τρίτῃ ἡμέρᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/046.yaml
  text: And he said to them[a], “Thus it is written[b], that the Messiah would suffer and rise from the dead on the third day,”
translation:
  language: fr
  text: 'Et il leur dit : « Ainsi est-il écrit que le Messie[a] souffrirait et ressusciterait d’entre les morts le troisième jour. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le Christ ». Le titre grec Χριστός signifie « Messie », c’est-à-dire « Oint ».
    reason: alternative_reading
lexical_decisions:
- source_word: γέγραπται
  choice: il est écrit
  rationale: 'Le parfait passif constitue ici une formule scripturaire : ce qui a été écrit demeure valable. « Il est écrit » est la tournure française consacrée et naturelle.'
- source_word: οὕτως
  choice: ainsi
  rationale: « Ainsi » conserve le lien avec la manière dont les Écritures présentent les événements et le ton solennel de l’introduction.
- source_word: παθεῖν
  choice: souffrirait
  rationale: L’infinitif exprime le contenu de ce qui est écrit. Le conditionnel français s’intègre naturellement au discours rapporté sans ajouter l’idée explicite de nécessité que donnerait « devait souffrir ».
- source_word: τὸν χριστόν
  choice: le Messie
  rationale: Avec l’article, Χριστός fonctionne clairement comme un titre. « Le Messie » restitue son arrière-plan juif et scripturaire.
- source_word: ἀναστῆναι
  choice: ressusciterait
  rationale: L’infinitif aoriste actif est rendu par un verbe français intransitif et actif. « Ressusciter » est la formulation usuelle et n’introduit pas le passif « serait ressuscité ».
- source_word: ἐκ νεκρῶν
  choice: d’entre les morts
  rationale: Cette expression rend explicitement ἐκ, qui présente Jésus sortant du milieu des morts, tout en restant idiomatique en français biblique moderne.
- source_word: τῇ τρίτῃ ἡμέρᾳ
  choice: le troisième jour
  rationale: Le datif a une valeur temporelle ; le français exprime naturellement cette indication sans préposition.
theological_decisions:
- issue: Rendu de Χριστός dans le résumé de la passion et de la résurrection
  choice: le Messie
  alternative: le Christ
  rationale: Le mot est ici un titre déterminé plutôt qu’une désignation devenue presque nominale. « Messie » préserve le cadre scripturaire de la déclaration sans imposer une lecture confessionnelle particulière.
- issue: Voix du verbe de résurrection ἀναστῆναι
  choice: ressusciterait
  alternative: serait ressuscité
  rationale: La forme grecque est active. Le texte principal conserve donc cette voix, sans nier que d’autres passages du Nouveau Testament emploient le passif pour parler de l’action de Dieu.
- issue: Modalité de παθεῖν
  choice: souffrirait
  alternative: devait souffrir
  rationale: Le grec présente un infinitif dépendant de la formule scripturaire, sans verbe modal explicite. Le conditionnel français rend le contenu annoncé par l’Écriture sans transformer implicitement la phrase en affirmation explicite de nécessité.
translation_notes:
  register: Français international moderne, digne et accessible. L’inversion « Ainsi est-il écrit » garde le ton solennel de la formule scripturaire sans archaïsme marqué. La ponctuation française introduit clairement le contenu de ce qui est écrit.
