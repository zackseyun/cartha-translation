  source_fidelity: 'Le sens fondamental est fidèlement rendu : la formule scripturaire, le titre « le Messie », les infinitifs actifs de souffrir et ressusciter, « d’entre les morts » et l’indication temporelle sont correctement représentés. Il convient toutefois d’expliciter ὅτι par « que », surtout avec le conditionnel français.'
  naturalness: « Ainsi est-il écrit » est une formule naturelle et digne. Dans le texte proposé, les deux-points suivis du conditionnel (« le Messie souffrirait ») produisent une articulation moins nette en français moderne. « Ainsi est-il écrit que… » est plus idiomatique et correspond directement à la subordonnée introduite par ὅτι.
  terminology: « Le Messie » convient pour τὸν χριστόν dans ce contexte titularisé. « Ressusciterait » maintient à juste titre la voix active de ἀναστῆναι. La note doit désigner le terme grec avec sa graphie grecque, Χριστός, plutôt que par la translittération non signalée « Christos ».
