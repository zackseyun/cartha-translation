  source_fidelity: 'Le sens est globalement fidèle : « leurs yeux s’ouvrirent », « ils le reconnurent » et l’idée qu’il cessa d’être visible sont bien rendus. « Invisible pour eux » est toutefois moins idiomatique et moins précis en français que « invisible à leurs yeux ».'
  naturalness: « Alors leurs yeux s’ouvrirent et ils le reconnurent » est naturel. En revanche, « et lui devint invisible pour eux » est lourd et peu naturel ; « mais il devint invisible à leurs yeux » exprime mieux le grec dans un français international moderne. Le contraste narratif convient à δέ dans ce contexte.
  terminology: « Reconnaître » rend correctement ἐπέγνωσαν. « Invisible » rend ἄφαντος sans imposer un mécanisme de disparition. La note doit être ancrée sur le terme auquel elle se rapporte, non à la fin de la phrase.
