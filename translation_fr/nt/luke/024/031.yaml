reference: Luke 24:31
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: αὐτῶν δὲ διηνοίχθησαν οἱ ὀφθαλμοὶ καὶ ἐπέγνωσαν αὐτόν· καὶ αὐτὸς ἄφαντος ἐγένετο ἀπ’ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/031.yaml
  text: Then their eyes were opened[a], and they recognized him; and he became unseen by them.
translation:
  language: fr
  text: Alors leurs yeux s’ouvrirent et ils le reconnurent ; mais il devint invisible[a] à leurs yeux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « il disparut de devant eux » ou « il disparut de leur vue ».'
    reason: Alternative lexicale pour ἄφαντος ἐγένετο ἀπ’ αὐτῶν.
lexical_decisions:
- source_word: διηνοίχθησαν
  choice: s’ouvrirent
  rationale: L’aoriste passif de διανοίγω indique que leurs yeux furent ouverts. En français, la tournure pronominale « leurs yeux s’ouvrirent » est naturelle tout en laissant entendre que cette perception leur fut accordée.
- source_word: οἱ ὀφθαλμοὶ
  choice: leurs yeux
  rationale: Le grec dit littéralement « les yeux d’eux » ; le possessif est la formulation française idiomatique.
- source_word: ἐπέγνωσαν
  choice: reconnurent
  rationale: Dans le récit d’Emmaüs, ἐπιγινώσκω désigne le fait d’identifier enfin celui qu’ils voyaient déjà, plutôt qu’une simple connaissance intellectuelle.
- source_word: ἄφαντος
  choice: invisible
  rationale: Ἄφαντος signifie « non visible » ou « invisible ». Ce choix rend directement le grec sans préciser le mécanisme de l’événement.
- source_word: ἐγένετο ἀπ’ αὐτῶν
  choice: devint invisible pour eux
  rationale: 'La formulation conserve γίνομαι (« devenir ») et rend de manière naturelle la relation exprimée par ἀπό : il ne fut plus visible pour eux.'
- source_word: δὲ
  choice: Alors
  rationale: Δέ fait progresser le récit ; « Alors » marque naturellement cette étape en français.
theological_decisions:
- issue: Nature de la disparition de Jésus
  choice: il devint invisible pour eux
  alternative: il disparut de devant eux ; il disparut à leurs regards
  rationale: La formulation avec ἄφαντος et γίνομαι décrit Jésus comme devenant non visible pour les disciples, sans expliquer comment cela se produisit. Elle préserve ainsi le mystère du récit.
translation_notes:
  register: Français international moderne, naturel et digne. Le léger relief de « et lui » reprend l’insistance du pronom grec αὐτός et distingue l’action de Jésus de celle des disciples.
