- from: Alors leurs yeux s’ouvrirent et ils le reconnurent ; et lui devint invisible pour eux.[a]
  to: Alors leurs yeux s’ouvrirent et ils le reconnurent ; mais il devint invisible[a] à leurs yeux.
  rationale: La révision remplace la tournure peu idiomatique « invisible pour eux » par « invisible à leurs yeux », conserve l’ambiguïté du grec quant au mécanisme de l’événement, rend le développement contrastif par « mais », et déplace l’appel de note auprès du mot concerné.
