id: LUK.24.44
reference: Luke 24:44
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Εἶπεν δὲ ⸂πρὸς αὐτούς⸃· Οὗτοι οἱ λόγοι ⸀μου οὓς ἐλάλησα πρὸς ὑμᾶς ἔτι ὢν σὺν ὑμῖν, ὅτι δεῖ πληρωθῆναι πάντα τὰ γεγραμμένα ἐν τῷ νόμῳ Μωϋσέως ⸀καὶ προφήταις καὶ ψαλμοῖς περὶ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/044.yaml
  text: 'Then he said to them[c][b][a], “These are my words that I spoke to you while I was still with you: that everything written about me in the Law of Moses and the Prophets and the Psalms must be fulfilled.”'
translation:
  language: fr
  text: 'Puis il leur dit : « Voici mes paroles, celles que je vous ai dites lorsque j’étais encore avec vous : il faut que s’accomplisse tout ce qui est écrit[a] à mon sujet[c] dans la Loi de Moïse, les Prophètes et les Psaumes[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « toutes les choses écrites ».'
    reason: lexical_alternative
  - marker: b
    text: « La Loi de Moïse, les Prophètes et les Psaumes » désigne probablement les grandes divisions des Écritures d’Israël. « Les Psaumes » peut désigner précisément le Psautier ou, plus largement, les Écrits.
    reason: cultural_note
  - marker: c
    text: 'Ou : « me concernant ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἶπεν δὲ πρὸς αὐτούς
  choice: Puis il leur dit
  rationale: δέ est ici un connecteur narratif léger. « Puis » assure un enchaînement naturel sans introduire une opposition absente du grec.
- source_word: Οὗτοι οἱ λόγοι μου
  choice: Voici les paroles
  rationale: Cette formulation française restitue naturellement la construction démonstrative grecque et sous-entend sans ambiguïté qu’il s’agit des paroles de Jésus.
- source_word: οὓς ἐλάλησα πρὸς ὑμᾶς
  choice: que je vous ai dites
  rationale: En français, on « dit des paroles » plus naturellement qu’on ne les « parle ». Le choix conserve le sens de λαλέω sans calque maladroit.
- source_word: ἔτι ὢν σὺν ὑμῖν
  choice: lorsque j’étais encore avec vous
  rationale: La proposition temporelle rend clairement le participe grec, tandis que « encore » correspond à ἔτι.
- source_word: δεῖ πληρωθῆναι
  choice: il faut que s’accomplisse
  rationale: « Il faut » conserve la nécessité exprimée par δεῖ, et « s’accomplisse » rend l’usage de πληρόω relatif à l’accomplissement des Écritures.
- source_word: πάντα τὰ γεγραμμένα
  choice: tout ce qui est écrit
  rationale: Cette tournure idiomatique conserve la portée globale de πάντα et la valeur résultative de la forme parfaite γεγραμμένα.
- source_word: ἐν τῷ νόμῳ Μωϋσέως καὶ προφήταις καὶ ψαλμοῖς
  choice: dans la Loi de Moïse, les Prophètes et les Psaumes
  rationale: Les majuscules signalent des ensembles scripturaires reconnus. L’énumération française évite de répéter « et » tout en conservant les trois désignations.
- source_word: περὶ ἐμοῦ
  choice: à mon sujet
  rationale: Cette expression actuelle et digne rend directement la référence indiquée par περί avec le génitif.
theological_decisions:
- issue: Portée de la nécessité de l’accomplissement des Écritures
  choice: « il faut que s’accomplisse »
  alternative: « devait s’accomplir »
  rationale: Le présent « il faut » préserve la force de δεῖ et l’affirmation d’une nécessité, sans expliquer le mécanisme de l’accomplissement ni imposer une théorie prophétique particulière.
- issue: Identification de « la Loi de Moïse, les Prophètes et les Psaumes »
  choice: Présenter ces expressions comme des ensembles scripturaires nommés
  alternative: Comprendre « les Psaumes » soit comme le seul Psautier, soit comme une désignation plus large des Écrits
  rationale: Le texte évoque vraisemblablement les grandes divisions des Écritures d’Israël, mais ne précise pas si « les Psaumes » désigne techniquement l’ensemble des Écrits. Cette ambiguïté est conservée en note.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proche du grec tout en évitant les calques peu naturels. Les termes désignant les ensembles scripturaires prennent une majuscule.
