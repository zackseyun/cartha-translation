id: LUK.24.6
reference: Luke 24:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸂οὐκ ἔστιν ὧδε, ἀλλὰ ἠγέρθη.⸃ μνήσθητε ὡς ἐλάλησεν ὑμῖν ἔτι ὢν ἐν τῇ Γαλιλαίᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/006.yaml
  text: He is not here[a], but has been raised. Remember how he spoke to you while he was still in Galilee,
translation:
  language: fr
  text: Il n’est pas ici, mais il a été ressuscité[a][b]. Rappelez-vous ce qu’il vous a dit lorsqu’il était encore en Galilée,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « il est ressuscité ». Le verbe grec est au passif (« il a été ressuscité »), bien que la résurrection puisse aussi être exprimée naturellement en français par la tournure intransitive « il est ressuscité ».'
    reason: alternative_reading
  - marker: b
    text: 'Certains manuscrits anciens omettent : « Il n’est pas ici, mais il a été ressuscité. »'
    reason: textual_variant
lexical_decisions:
- source_word: οὐκ ἔστιν ὧδε
  choice: Il n’est pas ici
  rationale: Le grec sous-entend le sujet, clairement identifié comme Jésus par le contexte. Le français l’explicite naturellement, et ὧδε est rendu par l’adverbe de lieu « ici ».
- source_word: ἀλλὰ
  choice: mais
  rationale: La conjonction marque le contraste direct entre l’absence de Jésus dans le tombeau et sa résurrection.
- source_word: ἠγέρθη
  choice: il a été ressuscité
  rationale: Le passé composé passif préserve la voix passive de l’aoriste grec tout en employant le terme français courant pour la résurrection. Cette formulation laisse percevoir l’action divine implicite sans la rendre explicite.
- source_word: μνήσθητε
  choice: Rappelez-vous
  rationale: Cet impératif exprime une exhortation directe. « Rappelez-vous » est naturel en français moderne et convient à un souvenir partagé.
- source_word: ὡς ἐλάλησεν ὑμῖν
  choice: ce qu’il vous a dit
  rationale: Dans ce contexte, ὡς introduit le contenu général des paroles à rappeler. Cette tournure française est plus naturelle que « comment il vous a parlé », qui pourrait indûment insister sur la manière de parler.
- source_word: ἔτι ὢν
  choice: lorsqu’il était encore
  rationale: La proposition temporelle rend naturellement le participe ὢν, tandis que « encore » conserve la valeur de ἔτι.
- source_word: ἐν τῇ Γαλιλαίᾳ
  choice: en Galilée
  rationale: Rendu locatif courant du nom géographique.
theological_decisions:
- issue: Rendu du verbe de résurrection ἠγέρθη
  choice: il a été ressuscité
  alternative: il est ressuscité
  rationale: Le texte principal conserve la voix passive du grec et sa possible évocation de l’action de Dieu. La formulation intransitive, naturelle et théologiquement compatible, est signalée en note plutôt que substituée au passif.
translation_notes:
  register: Français international moderne, clair et digne. « Rappelez-vous » est idiomatique sans être familier. La virgule finale maintient le lien syntaxique avec les paroles rapportées au verset suivant.
