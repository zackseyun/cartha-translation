id: LUK.24.21
reference: Luke 24:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἡμεῖς δὲ ἠλπίζομεν ὅτι αὐτός ἐστιν ὁ μέλλων λυτροῦσθαι τὸν Ἰσραήλ· ἀλλά γε ⸀καὶ σὺν πᾶσιν τούτοις τρίτην ταύτην ἡμέραν ⸀ἄγει ἀφ’ οὗ ταῦτα ἐγένετο.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/021.yaml
  text: But we were hoping that he is the one who is about to redeem Israel[a]. Yet besides all this[b], it is now the third day since these things happened.
translation:
  language: fr
  text: Mais nous espérions que c’était lui qui allait délivrer Israël[a][b]. Mais, en plus de tout cela, voici déjà le troisième jour depuis que ces événements se sont produits.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Litt. : « qu’il est celui qui est sur le point de délivrer Israël ». Le grec conserve le présent (« est ») dans le contenu de leur espérance passée; le français emploie normalement la concordance des temps.'
    reason: alternative_reading
  - marker: b
    text: « Délivrer Israël » peut désigner largement la délivrance messianique espérée; le texte ne précise pas si les disciples pensent à une libération politique, au salut spirituel ou aux deux.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμεῖς δὲ
  choice: Mais nous, nous
  rationale: Le tour marque nettement le contraste introduit par δέ et l’insistance portée par le pronom ἡμεῖς, tout en restant naturel en français oral soigné.
- source_word: ἠλπίζομεν
  choice: nous espérions
  rationale: L’imparfait rend l’attente prolongée exprimée par l’imparfait grec et laisse entendre, par le contexte, qu’elle a été déçue.
- source_word: ὅτι αὐτός ἐστιν
  choice: que c’est lui
  rationale: Le présent de ἐστιν est conservé dans le contenu de l’espérance passée, plutôt que d’être automatiquement transposé à l’imparfait.
- source_word: ὁ μέλλων λυτροῦσθαι
  choice: qui doit délivrer
  rationale: « Doit » exprime ici l’action attendue ou destinée, sans imposer l’idée d’une imminence chronologique stricte; « délivrer » garde la portée large de λυτρόομαι dans ce contexte messianique.
- source_word: τὸν Ἰσραήλ
  choice: Israël
  rationale: Le nom désigne directement le peuple de l’alliance dans son ensemble.
- source_word: ἀλλά γε καὶ σὺν πᾶσιν τούτοις
  choice: Et, en plus de tout cela
  rationale: Cette formulation rend l’ajout insistant d’un nouvel élément décourageant, sans reproduire lourdement l’enchaînement des particules grecques.
- source_word: τρίτην ταύτην ἡμέραν ἄγει
  choice: voici déjà le troisième jour
  rationale: Le tour idiomatique français exprime clairement le temps désormais écoulé; « déjà » fait ressortir la valeur cumulative du propos.
- source_word: ἀφ’ οὗ ταῦτα ἐγένετο
  choice: depuis que ces événements se sont produits
  rationale: La formulation indique naturellement le point de départ à partir duquel les jours sont comptés.
theological_decisions:
- issue: Portée messianique de λυτροῦσθαι τὸν Ἰσραήλ
  choice: délivrer Israël
  alternative: racheter Israël; libérer Israël
  rationale: « Délivrer » peut évoquer aussi bien une libération nationale qu’un salut plus large. La traduction ne réduit donc pas l’espérance des disciples à une dimension exclusivement politique ou exclusivement spirituelle.
- issue: Présent ἐστιν dans le contenu d’une espérance passée
  choice: que c’est lui qui doit délivrer
  alternative: que c’était lui qui allait délivrer
  rationale: Le maintien du présent respecte la forme grecque et conserve la tension entre le contenu de leur espérance et la déception suggérée par le contexte, même si la transposition au passé serait plus habituelle en français.
translation_notes:
  register: Français international moderne, courant et digne. Le redoublement « nous, nous » restitue l’emphase sans raideur. Le présent « c’est » est volontairement conservé malgré la préférence habituelle du français pour la concordance au passé; la note signale l’autre possibilité. Les deux appels de note sont placés immédiatement après l’expression qu’ils éclairent.
