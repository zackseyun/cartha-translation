  text: καὶ ἀπῆλθόν τινες τῶν σὺν ἡμῖν ἐπὶ τὸ μνημεῖον, καὶ εὗρον οὕτως καθὼς ⸀καὶ αἱ γυναῖκες εἶπον, αὐτὸν δὲ οὐκ εἶδον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/024.yaml
  text: And some of those with us went to the tomb and found it just as the women had said, but they did not see him.
translation:
  language: fr
  text: Quelques-uns de ceux qui étaient avec nous sont allés au tombeau et ont trouvé les choses telles que les femmes l’avaient dit, mais lui, ils ne l’ont pas vu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπῆλθόν
  choice: sont allés
  rationale: Dans ce récit, le verbe exprime simplement le déplacement vers le tombeau. « Sont allés » est naturel et n’insiste pas indûment sur le fait de partir.
- source_word: τινες τῶν σὺν ἡμῖν
  choice: Quelques-uns de ceux qui étaient avec nous
  rationale: Cette formulation conserve l’idée d’un sous-groupe parmi les personnes associées aux deux disciples, sans préciser davantage leur statut.
- source_word: ἐπὶ τὸ μνημεῖον
  choice: au tombeau
  rationale: Dans ce contexte funéraire, μνημεῖον désigne le lieu où Jésus avait été déposé. « Tombeau » est précis et idiomatique.
- source_word: εὗρον οὕτως καθὼς καὶ αἱ γυναῖκες εἶπον
  choice: ont trouvé les choses comme les femmes l’avaient dit
  rationale: L’ajout idiomatique de « les choses » rend en français l’état de fait sous-entendu après « ont trouvé ». Le plus-que-parfait indique clairement que le témoignage des femmes précédait cette vérification.
- source_word: αὐτὸν δὲ οὐκ εἶδον
  choice: mais lui, ils ne l’ont pas vu
  rationale: La dislocation de « lui » reproduit naturellement en français l’emphase du pronom grec placé avant la négation, tandis que « mais » exprime le contraste marqué par δέ.
theological_decisions:
- issue: Formulation du récit de la résurrection
  choice: Le texte dit que certains compagnons ont constaté une situation conforme aux paroles des femmes, tout en précisant qu’ils n’ont pas vu Jésus lui-même.
  alternative: Préciser explicitement ce qu’ils ont trouvé dans le tombeau ou harmoniser le verset avec les récits parallèles.
  rationale: 'La formulation préserve la distinction et la retenue du grec : le constat confirme les paroles des femmes, mais aucune apparition de Jésus à ces visiteurs n’est affirmée.'
translation_notes:
  register: Français international moderne, narratif et digne. La phrase reste proche de la structure grecque tout en évitant un calque peu naturel. « Mais lui, ils ne l’ont pas vu » conserve l’emphase et le contraste sans expliciter le nom de Jésus.
