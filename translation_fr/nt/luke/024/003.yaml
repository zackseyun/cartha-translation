  language: en
  yaml_path: translation/nt/luke/024/003.yaml
  text: But when they entered[a], they did not find the body.
translation:
  language: fr
  text: Mais, une fois entrées, elles ne trouvèrent pas le corps[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Certains manuscrits lisent : « le corps du Seigneur Jésus ».'
    reason: textual_variant
lexical_decisions:
- source_word: εἰσελθοῦσαι
  choice: une fois entrées
  rationale: Le participe aoriste actif, au féminin pluriel, renvoie aux femmes et exprime ici une action antérieure à celle du verbe principal. « Une fois entrées » le rend naturellement en français tout en conservant la succession narrative.
- source_word: δὲ
  choice: Mais
  rationale: δέ assure la progression du récit avec une légère opposition entre leur entrée dans le tombeau et la découverte inattendue qui suit.
- source_word: οὐχ εὗρον
  choice: elles ne trouvèrent pas
  rationale: Le passé simple convient au récit écrit, exprime sobrement l’aoriste et rend explicite le sujet féminin pluriel déjà indiqué par le participe grec.
- source_word: τὸ σῶμα
  choice: le corps
  rationale: « Le corps » est le sens direct de σῶμα. Le terme est naturel dans le contexte funéraire et n’ajoute aucune précision absente du texte grec retenu.
theological_decisions:
- issue: Faut-il préciser à qui appartient le corps ?
  choice: le corps
  alternative: le corps du Seigneur Jésus
  rationale: Le texte du SBLGNT fourni porte seulement « le corps ». La traduction conserve cette leçon courte et signale en note la leçon plus développée de certains manuscrits.
translation_notes:
  register: Français international moderne, digne et narratif. Le passé simple maintient le registre d’un récit biblique écrit sans archaïsme lexical. La note est placée après « entrées » afin de correspondre au point où la variante élargit la suite de la phrase.
