  text: ἀποκριθεὶς δὲ ⸂εἷς ὀνόματι⸃ Κλεοπᾶς εἶπεν πρὸς αὐτόν· Σὺ μόνος παροικεῖς Ἰερουσαλὴμ καὶ οὐκ ἔγνως τὰ γενόμενα ἐν αὐτῇ ἐν ταῖς ἡμέραις ταύταις;
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/018.yaml
  text: Then one of them[a], named Cleopas, answered and said to him, “Are you the only visitor to Jerusalem who does not know the things that have happened there in these days?”
translation:
  language: fr
  text: 'L’un d’eux, nommé Cléopas, lui répondit : « Es-tu le seul étranger qui séjourne à Jérusalem sans savoir ce qui s’y est passé ces jours-ci ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ
  choice: lui répondit
  rationale: Le participe aoriste introduit ici la prise de parole en réponse; une proposition principale est plus naturelle en français. Le connecteur δέ n’exige pas de traduction distincte dans ce contexte narratif.
- source_word: εἷς ὀνόματι Κλεοπᾶς
  choice: L’un d’eux, nommé Cléopas
  rationale: « D’eux » explicite sobrement que Cléopas est l’un des deux disciples mentionnés dans le contexte; ὀνόματι introduit son nom.
- source_word: εἶπεν πρὸς αὐτόν
  choice: lui répondit
  rationale: Le destinataire pronominal est conservé sans introduire explicitement le nom de Jésus; le verbe est combiné avec ἀποκριθείς pour éviter le lourd « répondit et dit ».
- source_word: Σὺ μόνος παροικεῖς Ἰερουσαλήμ
  choice: Es-tu le seul étranger de passage à Jérusalem
  rationale: παροικέω évoque le séjour d’une personne extérieure au lieu, souvent temporaire. « Étranger de passage » conserve à la fois l’idée d’outsider et celle de séjour, tandis que « le seul » rend l’insistance de μόνος.
- source_word: οὐκ ἔγνως
  choice: qui ne sache pas
  rationale: Dans cette question, l’aoriste exprime le fait surprenant d’être resté sans connaissance des événements récents. Le subjonctif après « le seul… qui » est idiomatique en français.
- source_word: τὰ γενόμενα ἐν αὐτῇ
  choice: ce qui s’y est passé
  rationale: La tournure française rend naturellement le participe substantivé et reprend Jérusalem par « y ».
- source_word: ἐν ταῖς ἡμέραις ταύταις
  choice: ces jours-ci
  rationale: Expression française actuelle et naturelle pour les jours tout récents visés par le grec.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et narratif. La formulation garde la question étonnée de Cléopas et le sens de παροικεῖς sans employer l’archaïsme « séjourner comme étranger ».
