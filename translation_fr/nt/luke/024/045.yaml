lexical_decisions:
- source_word: τότε
  choice: Alors
  rationale: Marque naturellement la succession des événements dans le récit.
- source_word: διήνοιξεν
  choice: ouvrit
  rationale: Conserve la métaphore concrète du grec sans la réduire à « rendit capables » ni l’amplifier.
- source_word: αὐτῶν τὸν νοῦν
  choice: leur ouvrit l’intelligence
  rationale: En français, « ouvrir l’intelligence à quelqu’un » rend naturellement νοῦς comme faculté de comprendre tout en maintenant l’image du verbe.
- source_word: τοῦ συνιέναι
  choice: pour qu’ils comprennent
  rationale: Rend explicitement et idiomatiquement la valeur de but ou de résultat de l’infinitif grec, sans trancher davantage entre ces nuances proches.
- source_word: τὰς γραφάς
  choice: les Écritures
  rationale: Dans ce contexte, le terme désigne les écrits sacrés d’Israël reconnus comme Écriture.
theological_decisions:
- issue: Nature de l’action de Jésus sur l’intelligence des disciples
  choice: « il leur ouvrit l’intelligence »
  alternative: « il les rendit capables de comprendre » ou « il leur expliqua les Écritures »
  rationale: La formulation directe conserve l’affirmation et la métaphore du grec sans introduire une doctrine particulière de l’illumination ni réduire l’action à une simple explication.
translation_notes:
  register: Français moderne, international et digne. La tournure est naturelle tout en restant proche de la structure et de l’image du texte grec.
