source:
  edition: SBLGNT
  text: ἴδετε τὰς χεῖράς μου καὶ τοὺς πόδας μου ὅτι ⸂ἐγώ εἰμι αὐτός⸃· ψηλαφήσατέ με καὶ ἴδετε, ὅτι πνεῦμα σάρκα καὶ ὀστέα οὐκ ἔχει καθὼς ἐμὲ θεωρεῖτε ἔχοντα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/039.yaml
  text: Look at my hands and my feet[a], that it is I myself. Touch me and see[d][c][b], because a spirit does not have flesh and bones as you see that I have.
translation:
  language: fr
  text: 'Regardez mes mains et mes pieds : c’est bien moi.[a] Touchez-moi[b] et voyez : un esprit[c] n’a ni chair ni os, comme vous voyez que j’ai de la chair et des os.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi traduire : « et reconnaissez que c’est bien moi » ou « car c’est bien moi ». Le grec souligne fortement l’identité : « moi, je suis bien le même ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « Palpez-moi » ; le verbe grec évoque une vérification par le toucher.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « un fantôme ». Le mot grec signifie littéralement « esprit ».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἴδετε
  choice: Regardez / voyez
  rationale: L’impératif appelle à une vérification visuelle immédiate. « Regardez » convient naturellement avec « mes mains et mes pieds » ; « voyez » garde ensuite la même force sans lourdeur.
- source_word: χεῖράς ... πόδας
  choice: mains ... pieds
  rationale: Ces termes corporels concrets sont rendus directement, sans ajouter une mention explicite des blessures que le texte ne formule pas.
- source_word: ὅτι ἐγώ εἰμι αὐτός
  choice: c’est bien moi
  rationale: La tournure française exprime naturellement l’insistance conjointe de ἐγώ et αὐτός sur l’identité personnelle de Jésus, sans donner à ἐγώ εἰμι une portée théologique étrangère au contexte.
- source_word: ψηλαφήσατέ
  choice: Touchez-moi
  rationale: Le verbe désigne ici une vérification par le toucher. « Touchez-moi » est clair et courant ; « palpez-moi » serait plus précis quant à l’examen tactile, mais paraît plus clinique.
- source_word: πνεῦμα
  choice: un esprit
  rationale: « Esprit » est l’équivalent lexical direct et préserve le contraste entre une réalité incorporelle et le corps tangible de Jésus.
- source_word: σάρκα καὶ ὀστέα
  choice: ni chair ni os
  rationale: La négation française coordonnée se rend idiomatiquement par « ni… ni… ». Les noms conservent le langage corporel concret du grec.
- source_word: καθὼς ἐμὲ θεωρεῖτε ἔχοντα
  choice: comme vous voyez que j’en ai
  rationale: Cette formulation française naturelle conserve la comparaison et l’appel à l’observation directe, tout en rendant le participe grec par une proposition verbale.
theological_decisions:
- issue: La réalité corporelle de Jésus ressuscité
  choice: Conserver explicitement le toucher, la chair et les os
  alternative: Atténuer le contraste par une formulation plus abstraite sur la présence de Jésus
  rationale: Le grec insiste sur la vérification visuelle et tactile et sur la réalité corporelle. La traduction garde cette affirmation sans lui ajouter d’explication doctrinale.
- issue: La valeur de ὅτι après « regardez »
  choice: Ponctuer par deux-points et rendre l’identification par « c’est bien moi »
  alternative: « Regardez mes mains et mes pieds et reconnaissez que c’est bien moi » ou « car c’est bien moi »
  rationale: Le grec permet de comprendre ὅτι comme introduisant ce qu’il faut constater, tandis qu’une nuance causale reste possible. Le deux-points donne un français naturel sans trancher excessivement le rapport logique.
translation_notes:
  register: Français international moderne, direct et digne. Les impératifs restent simples et concrets. « C’est bien moi » transmet l’emphase sans archaïsme ; « ni chair ni os » est idiomatique et fidèle au contraste corporel.
