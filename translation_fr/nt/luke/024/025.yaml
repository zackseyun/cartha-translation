source:
  edition: SBLGNT
  text: καὶ αὐτὸς εἶπεν πρὸς αὐτούς· Ὦ ἀνόητοι καὶ βραδεῖς τῇ καρδίᾳ τοῦ πιστεύειν ἐπὶ πᾶσιν οἷς ἐλάλησαν οἱ προφῆται·
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/025.yaml
  text: And he said to them[a], “O foolish ones[c][b], and slow of heart to believe all that the prophets have spoken!”
translation:
  language: fr
  text: 'Il leur dit alors : « Ô vous qui manquez d’intelligence, et qui êtes lents de cœur à croire tout ce qu’ont dit les prophètes ! »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ αὐτὸς εἶπεν πρὸς αὐτούς
  choice: Alors il leur dit
  rationale: « Alors » assure une transition narrative naturelle en français, tandis que le pronom sujet rend αὐτός sans lui imposer une emphase absente du contexte.
- source_word: Ὦ ἀνόητοι
  choice: Ô hommes sans intelligence
  rationale: Cette formulation conserve l’interpellation solennelle et exprime le manque de compréhension visé par ἀνόητοι, sans réduire le reproche à une faute purement morale.
- source_word: βραδεῖς τῇ καρδίᾳ
  choice: que votre cœur est lent
  rationale: Le tour exclamatif est naturel en français tout en préservant l’image biblique du cœur comme siège intérieur de la compréhension et de la confiance.
- source_word: τοῦ πιστεύειν
  choice: à croire
  rationale: L’infinitif français complète naturellement « lent » et conserve la dimension de foi ou de confiance du verbe πιστεύω.
- source_word: ἐπὶ πᾶσιν οἷς
  choice: tout ce que
  rationale: Cette tournure idiomatique maintient la portée exhaustive de πᾶσιν sans reproduire artificiellement la préposition grecque.
- source_word: ἐλάλησαν
  choice: ont annoncé
  rationale: Dans le contexte de la parole prophétique, « annoncer » rend la proclamation des prophètes et le parfait composé français présente leurs paroles comme un témoignage donné qui demeure pertinent.
- source_word: οἱ προφῆται
  choice: les prophètes
  rationale: Équivalent français usuel et précis pour le témoignage prophétique évoqué dans le contexte.
theological_decisions:
- issue: Nature du reproche de Jésus
  choice: Le reproche concerne à la fois le manque de compréhension et la lenteur intérieure à faire confiance à l’ensemble du témoignage prophétique.
  alternative: Comprendre le reproche soit comme une condamnation principalement morale, soit comme une simple déficience intellectuelle.
  rationale: L’association de ἀνόητοι, du cœur et de πιστεύειν unit compréhension et confiance. La traduction maintient cette tension en conservant « cœur » et « croire ».
translation_notes:
  register: Français moderne, international et digne. « Ô » maintient la force de l’apostrophe grecque; « hommes sans intelligence » évite le caractère potentiellement insultant ou exclusivement moral de « insensés ». L’image du cœur est conservée plutôt que paraphrasée.
