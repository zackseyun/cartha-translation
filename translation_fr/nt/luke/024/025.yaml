review_pass:
  verdict: revise
  source_fidelity: 'Le sens central est bien rendu : le reproche vise le manque de compréhension et la lenteur intérieure à croire l’intégralité du témoignage des prophètes. Toutefois, « hommes » n’est pas exprimé dans le grec et « ont annoncé » interprète plus spécifiquement ἐλάλησαν (« ont dit / ont parlé »).'
  naturalness: La phrase est globalement claire, mais « Ô hommes sans intelligence » est lourd et inutilement genré en français moderne. « Vous qui manquez d’intelligence » est plus naturel, tandis que « lents de cœur » conserve l’image biblique avec un registre digne et compréhensible.
  terminology: « Cœur » et « croire » doivent être maintenus. « Les prophètes » est exact. « Ont dit » rend plus directement ἐλάλησαν sans restreindre leur parole à l’annonce prophétique.
  issues:
  - severity: medium
    issue: Ajout de « hommes »
    rationale: ἀνόητοι est un vocatif pluriel et ne contient pas de nom équivalent à « hommes ». Cet ajout est évitable et produit une formulation genrée qui n’est pas requise par le texte source.
  - severity: low
    issue: « ont annoncé » est plus interprétatif que le verbe grec
    rationale: ἐλάλησαν signifie d’abord « ont parlé / ont dit ». « Annoncer » convient au contexte prophétique, mais resserre inutilement le sens de leur parole.
  - severity: low
    issue: Tour « que votre cœur est lent »
    rationale: Le singulier collectif est possible, mais « vous qui êtes lents de cœur » rend plus directement le pluriel de βραδεῖς et conserve plus nettement l’adresse aux deux disciples.
  revised_text: 'Il leur dit alors : « Ô vous qui manquez d’intelligence, et qui êtes lents de cœur à croire tout ce qu’ont dit les prophètes ! »'
