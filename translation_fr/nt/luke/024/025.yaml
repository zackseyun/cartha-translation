revisions:
- from: 'Alors il leur dit : « Ô hommes sans intelligence, que votre cœur est lent à croire tout ce qu’ont annoncé les prophètes ! »'
  to: 'Il leur dit alors : « Ô vous qui manquez d’intelligence, et qui êtes lents de cœur à croire tout ce qu’ont dit les prophètes ! »'
  rationale: La révision retire l’ajout non marqué « hommes », emploie une interpellation française naturelle qui conserve l’idée d’ἀνόητοι sans la réduire à une faute morale, préserve l’expression « lents de cœur » et rend ἐλάλησαν par « ont dit », plus proche et plus large que « ont annoncé ».
