lexical_decisions:
- source_word: καὶ
  choice: Alors
  rationale: Dans ce contexte narratif, καί relie la réaction des femmes aux paroles qu’elles viennent d’entendre. « Alors » rend naturellement cet enchaînement en français sans alourdir la phrase.
- source_word: ἐμνήσθησαν
  choice: elles se souvinrent
  rationale: L’aoriste de μιμνῄσκομαι exprime ici le fait de se rappeler. Le passé simple convient au récit et la forme pronominale « se souvenir » est idiomatique en français.
- source_word: τῶν ῥημάτων
  choice: de ses paroles
  rationale: ῥῆμα désigne ici des paroles prononcées, voire ce qui a été dit. « Paroles » est naturel, digne et suffisamment large pour préserver cette nuance.
- source_word: αὐτοῦ
  choice: ses
  rationale: Le génitif renvoie à Jésus dans le contexte, mais le texte grec emploie simplement le pronom. « Ses » conserve cette formulation sans expliciter davantage.
