lexical_decisions:
- source_word: καὶ
  choice: Après avoir dit cela
  rationale: Le lien narratif est rendu naturellement avec le participe qui suit; en français, ajouter « Et » serait possible mais plus lourd et n'apporterait ici aucune nuance nécessaire.
- source_word: τοῦτο εἰπὼν
  choice: Après avoir dit cela
  rationale: Le participe aoriste exprime une action antérieure à celle du verbe principal; cette formulation moderne préserve clairement la succession.
- source_word: ἔδειξεν
  choice: il leur montra
  rationale: « Montrer » rend directement l'idée de donner à voir; le passé simple convient au registre narratif biblique, tout en restant courant à l'écrit.
- source_word: αὐτοῖς
  choice: leur
  rationale: Le pronom complément indirect est la construction française naturelle avec « montrer ».
- source_word: τὰς χεῖρας
  choice: ses mains
  rationale: Le possessif, implicite dans le contexte grec, est idiomatique en français pour désigner les parties du corps de Jésus.
- source_word: τοὺς πόδας
  choice: ses pieds
  rationale: Le possessif est naturel en français et « pieds » est l'équivalent direct de πόδας dans ce contexte corporel.
