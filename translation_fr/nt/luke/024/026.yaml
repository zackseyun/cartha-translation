id: LUK.24.26
reference: Luke 24:26
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὐχὶ ταῦτα ἔδει παθεῖν τὸν χριστὸν καὶ εἰσελθεῖν εἰς τὴν δόξαν αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/026.yaml
  text: Was it not necessary for the Messiah to suffer these things and to enter into his glory?[a]
translation:
  language: fr
  text: Le Messie ne devait-il pas souffrir tout cela et entrer dans sa gloire ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le Christ ». Le titre grec Χριστός est rendu ici par « Messie » afin d’en préserver le sens dans ce contexte d’accomplissement des Écritures.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐχὶ
  choice: Ne fallait-il pas
  rationale: La particule introduit une question qui attend une réponse affirmative. Cette tournure française restitue naturellement cette force avec ἔδει.
- source_word: ταῦτα
  choice: ces choses
  rationale: Le démonstratif neutre pluriel renvoie aux souffrances évoquées dans le contexte tout en conservant sa formulation générale.
- source_word: ἔδει
  choice: fallait-il
  rationale: L’imparfait de δεῖ exprime ici une nécessité liée au dessein de Dieu et à l’accomplissement des Écritures, sans que cette explication soit ajoutée au texte.
- source_word: παθεῖν
  choice: souffre
  rationale: Le verbe « souffrir » rend directement et naturellement l’infinitif aoriste παθεῖν.
- source_word: τὸν χριστὸν
  choice: le Messie
  rationale: Χριστός est ici un titre dans un contexte d’accomplissement scripturaire ; « Messie » en communique le sens plutôt que de le traiter comme un nom propre.
- source_word: καὶ
  choice: et
  rationale: La coordination simple préserve le lien entre les deux infinitifs sans expliciter davantage leur séquence.
- source_word: εἰσελθεῖν εἰς τὴν δόξαν αὐτοῦ
  choice: entre dans sa gloire
  rationale: Cette formulation française idiomatique conserve l’idée d’entrée ainsi que le possessif αὐτοῦ. « Entrer dans » convient mieux en français courant que le calque « entrer en » dans cette phrase.
- source_word: δόξαν
  choice: gloire
  rationale: « Gloire » est le terme naturel et consacré pour δόξα dans ce contexte de résurrection et d’exaltation.
- source_word: αὐτοῦ
  choice: sa
  rationale: Le possessif est rendu directement, sans préciser de manière interprétative s’il s’agit d’une gloire lui appartenant ou qui lui est destinée.
theological_decisions:
- issue: Traduction de Χριστός
  choice: le Messie
  alternative: le Christ
  rationale: Le mot fonctionne comme un titre messianique dans une déclaration portant sur l’accomplissement des Écritures. Une note conserve l’autre rendu français traditionnel.
- issue: Force de ἔδει
  choice: fallait-il
  alternative: devait-il
  rationale: « Fallait-il » exprime clairement la nécessité, vraisemblablement divine et scripturaire dans le contexte lucanien, sans transformer cette implication en explication explicite.
- issue: Rapport entre souffrance et gloire
  choice: et entre dans sa gloire
  alternative: puis entre dans sa gloire
  rationale: Le grec coordonne les deux infinitifs par καί. Ne pas ajouter « puis » préserve la sobriété et le degré d’explicitation de la source.
translation_notes:
  register: Français international moderne, digne et accessible. La question rhétorique reste concise ; l’inversion « Ne fallait-il pas » est naturelle dans ce registre. Le texte évite d’expliciter dans le verset la nature divine de la nécessité ou la chronologie précise entre souffrance et gloire.
