id: LUK.24.50
reference: Luke 24:50
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἐξήγαγεν δὲ αὐτοὺς ⸀ἕως ⸀πρὸς Βηθανίαν, καὶ ἐπάρας τὰς χεῖρας αὐτοῦ εὐλόγησεν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/050.yaml
  text: Then he led them out as far as Bethany[a], and lifting up his hands, he blessed them.
translation:
  language: fr
  text: Puis il les conduisit dehors jusque vers Béthanie[a] et, levant les mains, il les bénit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « jusqu’à Béthanie » ou « près de Béthanie »; l’expression grecque signifie littéralement « jusque vers Béthanie ».
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐξήγαγεν
  choice: il les conduisit hors de la ville
  rationale: Le verbe ἐξάγω exprime le fait de conduire vers l’extérieur. En contexte, la sortie de Jérusalem est implicite; « hors de la ville » rend naturellement cette direction en français.
- source_word: δὲ
  choice: Puis
  rationale: Ici, δέ assure la progression du récit sans marquer une forte opposition; « Puis » convient au mouvement narratif.
- source_word: ἕως πρὸς Βηθανίαν
  choice: jusque vers Béthanie
  rationale: Cette formulation conserve la nuance inhabituelle de ἕως πρός, qui associe l’idée de limite atteinte à celle de direction ou de proximité, sans décider précisément s’ils entrèrent dans Béthanie.
- source_word: Βηθανίαν
  choice: Béthanie
  rationale: Forme française traditionnelle et courante du nom de lieu.
- source_word: ἐπάρας τὰς χεῖρας αὐτοῦ
  choice: levant les mains
  rationale: Le participe aoriste décrit le geste qui précède ou accompagne la bénédiction. La formulation française est naturelle et maintient le pluriel significatif.
- source_word: εὐλόγησεν αὐτούς
  choice: il les bénit
  rationale: « Bénir » rend directement εὐλογέω et préserve la sobriété du texte, sans développer l’action en formule liturgique.
theological_decisions:
- issue: Nature de la bénédiction donnée par Jésus
  choice: il les bénit
  alternative: il prononça une bénédiction sur eux
  rationale: La traduction conserve l’acte de bénédiction avec les mains levées, sans lui imposer une catégorie liturgique ou sacerdotale ultérieure.
- issue: Localisation par rapport à Béthanie
  choice: jusque vers Béthanie
  alternative: jusqu’à Béthanie
  rationale: Le grec ἕως πρός laisse une certaine tension entre destination, direction et proximité. Le texte principal conserve cette nuance plutôt que de préciser si Jésus et les disciples entrèrent dans le village.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple convient au registre narratif biblique écrit. La tournure « jusque vers » est légèrement marquée, mais elle préserve utilement l’ambiguïté spatiale du grec; la note explicite les principales possibilités.
