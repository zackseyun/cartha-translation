id: LUK.24.1
reference: Luke 24:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τῇ δὲ μιᾷ τῶν σαββάτων ὄρθρου βαθέως ⸂ἐπὶ τὸ μνῆμα ἦλθον⸃ φέρουσαι ἃ ἡτοίμασαν ⸀ἀρώματα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/001.yaml
  text: But on the first day of the week[a], at early dawn, they came to the tomb, bringing the spices they had prepared.
translation:
  language: fr
  text: Mais le premier jour de la semaine[a], de très bon matin, elles vinrent au tombeau, apportant les aromates qu’elles avaient préparés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « le premier des sabbats », expression idiomatique désignant le premier jour de la semaine.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ δὲ μιᾷ τῶν σαββάτων
  choice: Mais le premier jour de la semaine
  rationale: Cette expression sémitique courante désigne idiomatiquement le premier jour de la semaine. La tournure française est claire et naturelle, sans donner artificiellement à « sabbats » une portée calendaire particulière.
- source_word: ὄρθρου βαθέως
  choice: de très bon matin
  rationale: La formule grecque situe l’action à l’aube, très tôt. « De très bon matin » restitue naturellement en français l’intensification exprimée par βαθέως.
- source_word: ἐπὶ τὸ μνῆμα
  choice: au tombeau
  rationale: Avec le verbe de mouvement, ἐπί indique la destination. « Tombeau » convient précisément au contexte funéraire.
- source_word: ἦλθον
  choice: elles vinrent
  rationale: Le sujet féminin ressort du participe φέρουσαι et du contexte précédent. Le passé simple conserve le mouvement narratif et l’idée de venue au tombeau.
- source_word: φέρουσαι
  choice: apportant
  rationale: Le participe décrit une action simultanée à leur venue. « Apportant » est naturel et exprime qu’elles amènent les aromates au tombeau.
- source_word: ἃ ἡτοίμασαν ἀρώματα
  choice: les aromates qu’elles avaient préparés
  rationale: ἀρώματα désigne ici des substances aromatiques destinées aux soins funéraires. Le plus-que-parfait marque clairement que leur préparation avait précédé la venue.
theological_decisions:
- issue: Valeur temporelle de τῇ μιᾷ τῶν σαββάτων dans le récit de la résurrection
  choice: le premier jour de la semaine
  alternative: le premier des sabbats
  rationale: La traduction retient le sens idiomatique normal de l’expression grecque et évite de lui imposer une chronologie confessionnelle ou sectaire non exigée par le texte.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple convient au registre narratif biblique sans être archaïque. « Aromates » est précis dans le contexte funéraire; « de très bon matin » demeure naturel tout en rendant l’intensité de ὄρθρου βαθέως.
