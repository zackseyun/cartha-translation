id: LUK.24.33
reference: Luke 24:33
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἀναστάντες αὐτῇ τῇ ὥρᾳ ὑπέστρεψαν εἰς Ἰερουσαλήμ, καὶ εὗρον ⸀ἠθροισμένους τοὺς ἕνδεκα καὶ τοὺς σὺν αὐτοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/033.yaml
  text: And rising that very hour[a], they returned to Jerusalem and found the Eleven and those with them gathered together,
translation:
  language: fr
  text: À cette heure même, ils se levèrent et retournèrent à Jérusalem. Ils y trouvèrent les Onze et ceux qui étaient avec eux, tous réunis.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναστάντες
  choice: ils se levèrent
  rationale: Le participe aoriste exprime ici une action qui accompagne et précède le retour. La tournure verbale est naturelle en français et conserve l’action physique sans la surinterpréter.
- source_word: αὐτῇ τῇ ὥρᾳ
  choice: À cette heure même
  rationale: Cette formulation garde à la fois le repère temporel précis et l’insistance du grec, sans réduire l’expression au seul adverbe « immédiatement ».
- source_word: ὑπέστρεψαν
  choice: retournèrent
  rationale: Sens narratif courant de ὑποστρέφω dans un contexte de déplacement vers un lieu où ils reviennent.
- source_word: Ἰερουσαλήμ
  choice: Jérusalem
  rationale: Forme française conventionnelle du nom de lieu.
- source_word: εὗρον
  choice: trouvèrent
  rationale: Équivalent direct et naturel du sens narratif ordinaire de εὑρίσκω.
- source_word: ἠθροισμένους
  choice: tous réunis
  rationale: Le participe parfait passif décrit l’état déjà constitué du groupe au moment où il est trouvé. « Tous réunis » porte naturellement sur les Onze et sur ceux qui sont avec eux.
- source_word: τοὺς ἕνδεκα
  choice: les Onze
  rationale: Conserve la désignation grecque du groupe sans ajouter « apôtres » ni résoudre la question du nombre exact de personnes alors présentes.
- source_word: τοὺς σὺν αὐτοῖς
  choice: ceux qui étaient avec eux
  rationale: Rendu explicite mais fidèle de la construction grecque, sans préciser davantage l’identité de ces personnes.
theological_decisions:
- issue: La désignation « les Onze » malgré l’absence de Judas et la possible absence de Thomas
  choice: Conserver la désignation collective « les Onze »
  alternative: les onze apôtres ; les disciples restants
  rationale: Le grec emploie directement τοὺς ἕνδεκα comme désignation établie. La traduction ne doit ni ajouter « apôtres » ni harmoniser le récit en fonction de l’assistance exacte.
translation_notes:
  register: Français international moderne, narratif et digne. Deux phrases évitent une coordination lourde tout en conservant l’ordre des événements. L’ajout de « y » reprend naturellement Jérusalem sans ajouter de contenu. Aucun marqueur de note n’est requis.
