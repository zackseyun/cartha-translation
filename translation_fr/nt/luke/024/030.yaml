id: LUK.24.30
reference: Luke 24:30
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἐγένετο ἐν τῷ κατακλιθῆναι αὐτὸν μετ’ αὐτῶν λαβὼν τὸν ἄρτον εὐλόγησεν καὶ κλάσας ἐπεδίδου αὐτοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/030.yaml
  text: And it happened that[a], when he reclined at the table with them, he took the bread, blessed it, and after breaking it[b], began giving it to them.
translation:
  language: fr
  text: Il arriva que, lorsqu’il prit place à table avec eux[a], il prit le pain, prononça la bénédiction, le rompit, puis se mit à le leur donner[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement, le verbe grec évoque le fait de s’allonger pour manger, selon l’usage antique.
    reason: cultural_note
  - marker: b
    text: Ou « le leur donnait ». L’imparfait grec peut présenter l’action comme étant en cours ; « se mit à » en souligne ici le commencement.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: Il arriva que
  rationale: Cette tournure conserve la formule de transition narrative fréquente chez Luc sans recourir à une formulation excessivement archaïque.
- source_word: ἐν τῷ κατακλιθῆναι αὐτὸν μετ’ αὐτῶν
  choice: lorsqu’il prit place à table avec eux
  rationale: La construction avec l’infinitif articulé a une valeur temporelle. « Prendre place à table » est naturel en français moderne, tandis que la note précise la posture antique évoquée par le verbe grec.
- source_word: λαβὼν τὸν ἄρτον
  choice: il prit le pain
  rationale: Le participe est rendu par un verbe conjugué afin de reproduire naturellement la succession des gestes. L’article désigne le pain présent au repas.
- source_word: εὐλόγησεν
  choice: prononça la bénédiction
  rationale: Le grec ne nomme pas explicitement l’objet de la bénédiction. Cette formulation convient au contexte d’un repas et évite d’affirmer inutilement que le pain lui-même est l’objet direct, tout en distinguant εὐλογέω de « rendre grâce ».
- source_word: κλάσας
  choice: le rompit
  rationale: Le pronom reprend naturellement « le pain », et la coordination française exprime clairement l’action achevée avant la distribution.
- source_word: ἐπεδίδου
  choice: se mit à le leur donner
  rationale: Cette formulation rend la valeur imperfective possiblement inchoative du verbe et souligne le début de la distribution, sans exclure l’autre lecture signalée en note.
theological_decisions:
- issue: Éventuelles résonances eucharistiques ou sacramentelles des gestes accomplis pendant le repas
  choice: Employer le vocabulaire ordinaire du repas et conserver exactement la succession des gestes, sans interprétation sacramentelle ajoutée
  alternative: Choisir une formulation évoquant plus explicitement la Cène
  rationale: La séquence « prit… prononça la bénédiction… rompit… donna » peut rappeler d’autres récits de repas, mais le verset ne définit pas lui-même cet acte comme un rite sacramentel. La traduction préserve donc l’écho possible sans imposer une lecture confessionnelle.
translation_notes:
  register: Français international moderne, naturel et digne. « Il arriva que » maintient la couleur narrative de Luc ; « prit place à table » évite une description culturellement déroutante dans le corps du texte, tout en conservant la précision historique en note.
