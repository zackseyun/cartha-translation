    issue: Nuance ingressive de ἐμφόβων ... γενομένων insuffisamment marquée
    rationale: « Étaient saisies de peur » décrit surtout un état déjà installé, tandis que γενομένων exprime le fait d’entrer dans cet état. « Furent saisies de peur » le rend sans alourdir la phrase.
  - severity: low
    issue: Formulation imprécise de la note lexicale
    rationale: 'Après « parmi les morts », « plus littéralement : avec les morts » laisse entendre que « avec » serait le seul rendu littéral. Μετά avec le génitif peut se rendre par « avec » ou « parmi » selon le contexte; il convient de présenter « avec » comme une autre possibilité.'
  revised_text: 'Comme elles furent saisies de peur et inclinaient le visage vers le sol, ils leur dirent : « Pourquoi cherchez-vous celui qui est vivant parmi les morts[a] ? »'
