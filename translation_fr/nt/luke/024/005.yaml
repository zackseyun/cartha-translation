source:
  edition: SBLGNT
  text: ἐμφόβων δὲ γενομένων αὐτῶν καὶ κλινουσῶν ⸂τὰ πρόσωπα⸃ εἰς τὴν γῆν εἶπαν πρὸς αὐτάς· Τί ζητεῖτε τὸν ζῶντα μετὰ τῶν νεκρῶν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/005.yaml
  text: And when they became terrified and bowed their faces to the ground[a], they said to them, “Why are you seeking the living one among the dead?”
translation:
  language: fr
  text: 'Comme elles furent saisies de peur et inclinaient le visage vers le sol, ils leur dirent : « Pourquoi cherchez-vous celui qui est vivant parmi les morts[a] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre possibilité : « avec les morts ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμφόβων δὲ γενομένων αὐτῶν
  choice: Comme elles étaient saisies de peur
  rationale: Le génitif absolu exprime la circonstance qui accompagne et précède la parole. « Saisies de peur » rend naturellement l’intensité de ἔμφοβος et la nuance d’entrée dans cet état portée par γενομένων.
- source_word: κλινουσῶν τὰ πρόσωπα εἰς τὴν γῆν
  choice: inclinaient le visage vers le sol
  rationale: Cette formulation conserve le geste concret décrit par κλίνω et l’aspect duratif du participe, tout en employant le singulier collectif idiomatique « le visage » en français.
- source_word: εἶπαν πρὸς αὐτάς
  choice: ils leur dirent
  rationale: Les pronoms gardent les référents du contexte sans répéter « les femmes » ni préciser l’identité des locuteurs au-delà du grec.
- source_word: Τί ζητεῖτε
  choice: Pourquoi cherchez-vous
  rationale: Pris dans cette question, τί conteste la pertinence de la recherche et se rend naturellement par « pourquoi » en français; le présent « cherchez-vous » correspond à ζητεῖτε.
- source_word: τὸν ζῶντα
  choice: celui qui est vivant
  rationale: Le participe substantivé est personnel et singulier. Cette expression française naturelle conserve l’opposition explicite entre cet homme vivant et les morts, sans ajouter d’explication.
- source_word: μετὰ τῶν νεκρῶν
  choice: parmi les morts
  rationale: Avec le génitif, μετά peut signifier « avec »; dans ce contexte spatial et contrastif, « parmi les morts » exprime idiomatiquement le sens visé.
theological_decisions:
- issue: Portée de τὸν ζῶντα dans le contexte de la résurrection
  choice: celui qui est vivant
  alternative: le vivant
  rationale: « Celui qui est vivant » désigne personnellement Jésus et maintient la force du contraste avec les morts, sans expliciter la résurrection au-delà de ce que dit le verset.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve le mouvement narratif, l’image corporelle et la question incisive du grec. Le passé composé a été évité au profit de l’imparfait circonstanciel et du passé simple narratif.
