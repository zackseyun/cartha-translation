revisions:
- from: Eux-mêmes racontaient ce qui s’était passé en chemin et comment il s’était fait reconnaître d’eux au moment où il avait rompu le pain.[a]
  to: Eux-mêmes racontaient ce qui s’était passé en chemin et comment il s’était fait connaître à eux lors de la fraction du pain.[a]
  rationale: La révision corrige une construction française défectueuse et rétablit une expression nominale correspondant à « la fraction du pain ». « Il s’était fait connaître à eux » demeure une formulation française fluide qui ne tranche pas indûment entre reconnaissance humaine et manifestation du ressuscité.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T11:05:14Z'
review_pass:
  verdict: revise
  source_fidelity: 'Le texte rend bien l’emphase de αὐτοὶ, l’imparfait narratif de ἐξηγοῦντο, l’ellipse de τὰ ἐν τῇ ὁδῷ et la valeur circonstancielle de ἐν τῇ κλάσει τοῦ ἄρτου. Toutefois, « il s’était fait reconnaître d’eux » n’est pas une formulation française correcte ou naturelle : avec « se faire reconnaître », le complément attendu est « par eux », ce qui infléchirait aussi davantage le sens vers leur acte de reconnaissance. « Il s’était fait connaître à eux » conserve plus justement l’ambiguïté du passif ἐγνώσθη αὐτοῖς.'
  naturalness: « Eux-mêmes racontaient » est possible et restitue l’emphase, mais « Eux aussi racontaient » risquerait d’ajouter une nuance non exigée. La formulation retenue reste naturelle dans un registre biblique moderne. « Lors de la fraction du pain » est idiomatique, correspond à la construction nominale grecque et ne présuppose pas une interprétation liturgique.
  terminology: « Fraction du pain » est le correspondant français établi et précis de κλάσις τοῦ ἄρτου. Il convient de ne pas expliciter « au moment où il avait rompu le pain », car le grec emploie un substantif et ne réintroduit pas explicitement Jésus comme sujet du geste. La note conserve l’alternative légitime « ils l’avaient reconnu ».
  issues:
  - severity: medium
    issue: La tournure « il s’était fait reconnaître d’eux » est fautive ou très maladroite en français contemporain.
    rationale: « Se faire reconnaître » se construit normalement avec « par » pour l’agent qui reconnaît (« se faire reconnaître par eux »), ou bien « se faire connaître à » pour les destinataires. La correction évite une construction non idiomatique et préserve mieux l’ambiguïté du passif grec.
  - severity: low
    issue: « Au moment où il avait rompu le pain » explicite inutilement le geste et son sujet.
    rationale: ἐν τῇ κλάσει τοῦ ἄρτου signifie littéralement « dans/lors de la fraction du pain ». La formulation nominale française est naturelle et plus fidèle, sans imposer que le verset répète explicitement le sujet du geste.
  revised_text: Eux-mêmes racontaient ce qui s’était passé en chemin et comment il s’était fait connaître à eux lors de la fraction du pain.[a]
  revised_footnotes:
  - marker: a
    text: 'Autre traduction : « et comment ils l’avaient reconnu à la fraction du pain ». Le grec emploie un verbe passif, qui peut souligner soit qu’ils l’ont reconnu, soit qu’il s’est fait connaître à eux.'
    reason: alternative_reading
