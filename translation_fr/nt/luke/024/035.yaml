  text: καὶ αὐτοὶ ἐξηγοῦντο τὰ ἐν τῇ ὁδῷ καὶ ὡς ἐγνώσθη αὐτοῖς ἐν τῇ κλάσει τοῦ ἄρτου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/035.yaml
  text: And they themselves were recounting the things that had happened on the road[b][a], and how he was made known to them in the breaking of the bread.
translation:
  language: fr
  text: Eux-mêmes racontaient ce qui s’était passé en chemin et comment il s’était fait connaître à eux lors de la fraction du pain.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction : « et comment ils l’avaient reconnu à la fraction du pain ». Le grec emploie un verbe passif, qui peut souligner soit qu’ils l’ont reconnu, soit qu’il s’est fait connaître à eux.'
    reason: alternative_reading
lexical_decisions:
- source_word: αὐτοὶ
  choice: Eux-mêmes
  rationale: Le pronom explicite est emphatique et distingue ces deux disciples, qui apportent à leur tour leur propre témoignage.
- source_word: ἐξηγοῦντο
  choice: racontaient
  rationale: L’imparfait exprime un récit en cours; « racontaient » est naturel en français moderne sans suggérer une explication formelle.
- source_word: τὰ ἐν τῇ ὁδῷ
  choice: ce qui s’était passé en chemin
  rationale: La formule grecque est elliptique. Cette explicitation restitue naturellement les événements survenus pendant le trajet.
- source_word: ὡς
  choice: comment
  rationale: Le terme introduit ici la manière ou les circonstances dans lesquelles Jésus leur est devenu reconnaissable.
- source_word: ἐγνώσθη αὐτοῖς
  choice: il s’était fait reconnaître d’eux
  rationale: Cette tournure conserve une valeur passive et laisse ouverte la tension entre leur reconnaissance et le fait qu’il leur ait été rendu reconnaissable.
- source_word: ἐν τῇ κλάσει τοῦ ἄρτου
  choice: au moment où il avait rompu le pain
  rationale: Dans le contexte immédiat du repas raconté aux versets 30-31, cette formulation française exprime clairement la circonstance visée sans transformer l’expression en désignation liturgique technique.
theological_decisions:
- issue: 'Valeur du passif ἐγνώσθη : simple reconnaissance humaine ou manifestation accordée'
  choice: il s’était fait reconnaître d’eux
  alternative: ils l’avaient reconnu
  rationale: Le choix maintient la forme passive et la tension narrative, sans attribuer explicitement l’action à Dieu ni la réduire à une simple perception humaine.
- issue: Portée de « la fraction du pain »
  choice: au moment où il avait rompu le pain
  alternative: à la fraction du pain
  rationale: Le contexte renvoie d’abord au geste précis du repas d’Emmaüs. La traduction évite d’imposer au texte une interprétation sacramentelle tout en conservant le lien avec le pain rompu.
translation_notes:
  register: Français international moderne, fluide et digne. « En chemin » convient naturellement au trajet vers Emmaüs. La tournure « d’eux » est légèrement soutenue, mais elle permet de préserver le passif grec et son ambiguïté théologique.
