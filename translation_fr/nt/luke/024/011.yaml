  text: καὶ ἐφάνησαν ἐνώπιον αὐτῶν ὡσεὶ λῆρος τὰ ῥήματα ⸀ταῦτα, καὶ ἠπίστουν αὐταῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/011.yaml
  text: And these words seemed like nonsense to them, and they did not believe the women.
translation:
  language: fr
  text: Ces paroles leur parurent être des propos insensés[a], et ils ne crurent pas les femmes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des histoires absurdes » ou « des paroles délirantes ». Le grec λῆρος désigne des propos considérés comme dépourvus de sens ou absurdes.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐφάνησαν ἐνώπιον αὐτῶν
  choice: leur parurent
  rationale: 'Dans cette construction évaluative, ἐφάνησαν exprime une impression ou un jugement, tandis que ἐνώπιον αὐτῶν indique le point de vue : « leur parurent » est naturel en français et reste proche de la formulation grecque.'
- source_word: ὡσεὶ λῆρος
  choice: être des propos insensés[a]
  rationale: « Propos insensés » rend λῆρος comme un discours jugé dépourvu de sens ou absurde. La tournure avec « être » exprime naturellement en français la comparaison introduite par ὡσεὶ, sans présenter ce jugement subjectif comme un fait.
- source_word: τὰ ῥήματα ταῦτα
  choice: ces paroles
  rationale: Rendu direct du groupe démonstratif, naturel dans le contexte d’un récit rapporté.
- source_word: ἠπίστουν
  choice: ils ne crurent pas
  rationale: Le passé simple convient au registre narratif français. La traduction n’ajoute pas l’idée volontaire de refus, absente du verbe lui-même.
- source_word: αὐταῖς
  choice: les femmes
  rationale: Le pronom grec est féminin pluriel et renvoie clairement aux femmes nommées dans le contexte immédiat. L’explicitation évite une ambiguïté référentielle en français sans ajouter de nouveau participant.
