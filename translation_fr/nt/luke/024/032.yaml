  text: καὶ εἶπαν πρὸς ἀλλήλους· Οὐχὶ ἡ καρδία ἡμῶν καιομένη ἦν ⸂ἐν ἡμῖν⸃ ὡς ἐλάλει ἡμῖν ἐν τῇ ὁδῷ, ⸀ὡς διήνοιγεν ἡμῖν τὰς γραφάς;
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/032.yaml
  text: And they said to one another[a], “Was not our heart burning within us as he was speaking to us on the road[c][b], as he was opening the Scriptures to us?”
translation:
  language: fr
  text: 'Ils se dirent l’un à l’autre : « Notre cœur ne brûlait-il pas en nous pendant qu’il nous parlait en chemin et qu’il nous ouvrait les Écritures[a] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « nous ouvrait les Écritures »; cette expression signifie qu’il en faisait comprendre le sens.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸς ἀλλήλους
  choice: l’un à l’autre
  rationale: Expression réciproque naturelle en français, adaptée ici à deux interlocuteurs.
- source_word: Οὐχὶ
  choice: ne… pas
  rationale: Introduit une question rhétorique qui appelle une réponse affirmative.
- source_word: ἡ καρδία ἡμῶν
  choice: notre cœur
  rationale: Conserve le singulier grec et peut exprimer leur réaction intérieure commune.
- source_word: καιομένη ἦν ἐν ἡμῖν
  choice: brûlait… en nous
  rationale: Préserve la métaphore vive ainsi que son caractère intérieur, sans préciser s’il s’agit d’une émotion, d’une illumination ou d’une expérience spirituelle.
- source_word: ὡς ἐλάλει ἡμῖν
  choice: pendant qu’il nous parlait
  rationale: L’imparfait grec décrit une action en cours; « pendant que » rend clairement cette simultanéité.
- source_word: ἐν τῇ ὁδῷ
  choice: en chemin
  rationale: Formulation française idiomatique qui garde à la fois le sens concret de la route et la nuance possible de « chemin ».
- source_word: ὡς διήνοιγεν ἡμῖν τὰς γραφάς
  choice: et nous ouvrait le sens des Écritures
  rationale: En français, explicite naturellement la métaphore de l’ouverture appliquée aux Écritures, tout en gardant l’image du texte grec et l’aspect duratif de l’imparfait.
theological_decisions:
- issue: Portée métaphorique du cœur qui brûle
  choice: Conserver « notre cœur… brûlait… en nous »
  alternative: « nous étions profondément émus » ou « notre cœur était tout ardent »
  rationale: Le texte ne détermine pas précisément la nature émotionnelle, cognitive ou spirituelle de cette expérience; la métaphore maintient cette tension.
- issue: Sens de l’ouverture des Écritures
  choice: « ouvrait le sens des Écritures »
  alternative: « nous expliquait les Écritures » ou, plus littéralement, « nous ouvrait les Écritures »
  rationale: Le contexte indique une mise en lumière de leur sens. Cette formulation reste proche de la métaphore sans donner à entendre qu’il ouvrait matériellement un livre.
translation_notes:
  register: Français international moderne, naturel et digne. Le singulier « notre cœur » suit le grec et évoque leur expérience commune; « en chemin » convient au récit sans alourdir la phrase.
