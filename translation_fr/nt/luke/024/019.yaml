  text: καὶ εἶπεν αὐτοῖς· Ποῖα; οἱ δὲ εἶπαν αὐτῷ· Τὰ περὶ Ἰησοῦ τοῦ ⸀Ναζαρηνοῦ, ὃς ἐγένετο ἀνὴρ προφήτης δυνατὸς ἐν ἔργῳ καὶ λόγῳ ἐναντίον τοῦ θεοῦ καὶ παντὸς τοῦ λαοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/019.yaml
  text: And he said to them, “What things?” And they said to him, “The things concerning Jesus the Nazarene, who became a man, a prophet mighty in deed and word before God and all the people,”
translation:
  language: fr
  text: 'Il leur demanda : « Quoi donc ? » Ils lui répondirent : « Ce qui concerne Jésus le Nazaréen[a], qui fut[b] un homme, un prophète puissant en actes et en paroles devant Dieu et tout le peuple. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « Jésus de Nazareth » ; grec : « Jésus le Nazaréen ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « qui devint un homme, un prophète » ; le verbe grec peut ici se rendre plus naturellement par « fut » ou « était ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ποῖα
  choice: Quoi donc ?
  rationale: Le neutre pluriel renvoie aux événements évoqués. En français actuel, « Quoi donc ? » est plus naturel que le calque « Quelles choses ? » tout en conservant la demande de précision.
- source_word: Τὰ περὶ Ἰησοῦ
  choice: Ce qui concerne Jésus
  rationale: Cette formulation rend directement l’expression articulée avec περί sans ajouter explicitement l’idée d’événements, absente du grec.
- source_word: Ναζαρηνοῦ
  choice: le Nazaréen
  rationale: Le gentilé ou qualificatif « le Nazaréen » reflète la forme grecque plus directement que « de Nazareth », tout en restant intelligible en français biblique moderne.
- source_word: ἐγένετο
  choice: C’était
  rationale: Dans cette description rétrospective, γίνομαι a une valeur idiomatique proche de « être/se montrer ». « C’était » évite le contresens potentiel de « devint un homme »; la valeur plus littérale est signalée en note.
- source_word: ἀνὴρ προφήτης
  choice: un homme, un prophète
  rationale: Les deux substantifs en apposition sont conservés. La ponctuation maintient la double caractérisation explicite sans faire de « homme » un simple mot de remplissage.
- source_word: δυνατὸς ἐν ἔργῳ καὶ λόγῳ
  choice: puissant en actes et en paroles
  rationale: « Puissant » convient à δυνατός, et les pluriels « actes » et « paroles » donnent en français une expression naturelle et digne du couple grec singulier collectif.
- source_word: ἐναντίον τοῦ θεοῦ καὶ παντὸς τοῦ λαοῦ
  choice: devant Dieu et devant tout le peuple
  rationale: « Devant » exprime ici la présence, le regard et l’attestation publique. La répétition de la préposition clarifie naturellement les deux compléments en français.
theological_decisions:
- issue: Maintien de ἀνήρ dans la description de Jésus
  choice: un homme, un prophète
  alternative: un prophète
  rationale: Le grec nomme explicitement Jésus comme ἀνήρ et comme προφήτης. Conserver les deux éléments respecte le point de vue des disciples dans le récit sans développer ni réduire sa portée christologique.
- issue: Valeur de ἐγένετο avec ἀνὴρ προφήτης
  choice: C’était un homme, un prophète
  alternative: qui devint un homme, un prophète
  rationale: La traduction idiomatique évite de suggérer que Jésus aurait commencé à être humain à ce moment-là. Une note préserve néanmoins la forme verbale grecque et son autre rendu possible.
translation_notes:
  register: Français international moderne, naturel et digne. Le dialogue est allégé par « demanda » et « répondirent », tandis que la description garde une cadence biblique mesurée. Les marqueurs [a] et [b] figurent dans le texte aux endroits pertinents.
