id: LUK.24.38
reference: Luke 24:38
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς· Τί τεταραγμένοι ἐστέ, καὶ διὰ τί διαλογισμοὶ ἀναβαίνουσιν ἐν ⸂τῇ καρδίᾳ⸃ ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/038.yaml
  text: And he said to them[a], “Why are you troubled, and why do doubts arise in your hearts?”
translation:
  language: fr
  text: 'Et il leur dit : « Pourquoi êtes-vous troublés, et pourquoi des doutes[a] surgissent-ils dans vos cœurs ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pensées » ou « raisonnements ».
    reason: Alternative lexicale pour διαλογισμοί, dont « doutes » exprime ici la nuance contextuelle sans épuiser le sens.
lexical_decisions:
- source_word: Τί
  choice: Pourquoi
  rationale: Dans cette construction avec un adjectif prédicatif et le verbe être, τί demande la cause du trouble ; « Pourquoi » est l’équivalent français naturel.
- source_word: τεταραγμένοι
  choice: troublés
  rationale: Le participe parfait passif décrit l’état présent des disciples, intérieurement bouleversés ; « troublés » en restitue sobrement la force.
- source_word: διαλογισμοὶ
  choice: doutes
  rationale: Le nom peut désigner des pensées ou des raisonnements, mais le contexte de crainte et d’incertitude donne ici à ces réflexions une valeur négative que « doutes » exprime naturellement.
- source_word: ἀναβαίνουσιν
  choice: surgissent
  rationale: Le sens littéral est « montent », mais « surgissent » rend idiomatiquement l’apparition de pensées intérieures en français.
- source_word: ἐν τῇ καρδίᾳ ὑμῶν
  choice: dans votre cœur
  rationale: Le grec associe le singulier καρδίᾳ au possessif pluriel ὑμῶν dans une construction distributive. Le français peut naturellement conserver ce singulier collectif et distributif.
- source_word: καρδία
  choice: cœur
  rationale: « Cœur » conserve l’anthropologie biblique, où le terme englobe la pensée, les dispositions et la vie intérieure, sans le réduire à l’émotion.
theological_decisions:
- issue: Portée anthropologique de καρδία
  choice: cœur
  alternative: esprit / for intérieur
  rationale: Le texte situe les raisonnements dans le « cœur », siège biblique de la pensée et des dispositions. Garder ce terme préserve cette richesse sans imposer une catégorie psychologique moderne.
- issue: Valeur contextuelle de διαλογισμοί
  choice: doutes
  alternative: pensées / raisonnements
  rationale: « Doutes » rend l’incertitude réprobative du contexte, tandis que la note maintient visibles les sens plus généraux du mot grec et évite de masquer son amplitude lexicale.
translation_notes:
  register: Français international moderne, naturel et digne. La question conserve son parallélisme, et le singulier distributif « votre cœur » suit de près la formulation grecque tout en restant idiomatique.
