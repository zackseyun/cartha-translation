  naturalness: La formulation est naturelle et de registre approprié. Toutefois, dans une adresse à plusieurs personnes, « dans vos cœurs » est plus idiomatique et plus immédiatement clair en français international que le singulier distributif « dans votre cœur ».
  terminology: « Cœur » préserve utilement la portée biblique de καρδία, qui inclut la pensée et les dispositions intérieures. La note sur διαλογισμοί maintient sans surcharge les sens plus larges de « pensées » et « raisonnements ».
