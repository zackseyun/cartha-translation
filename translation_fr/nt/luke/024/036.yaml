  text: Ταῦτα δὲ αὐτῶν λαλούντων ⸀αὐτὸς ἔστη ἐν μέσῳ ⸀αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/036.yaml
  text: While they were saying these things[a], he himself stood among them.
translation:
  language: fr
  text: Pendant qu’ils parlaient de ces choses, lui-même se tint au milieu d’eux.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Certains manuscrits ajoutent : « et il leur dit : “Paix à vous.” »'
    reason: textual_variant
lexical_decisions:
- source_word: Ταῦτα
  choice: ces choses
  rationale: Le démonstratif neutre pluriel renvoie explicitement aux événements dont les disciples viennent de parler; « ces choses » en conserve le nombre et le lien discursif.
- source_word: δὲ avec αὐτῶν λαλούντων
  choice: Pendant que
  rationale: Dans cette construction au génitif absolu, la particule accompagne une action en cours qui sert de cadre temporel; « Pendant que » rend naturellement cette simultanéité.
- source_word: αὐτῶν λαλούντων
  choice: ils parlaient
  rationale: Le participe présent exprime une parole en cours. « Parlaient » est naturel en français et convient au récit qu’ils étaient en train de faire.
- source_word: αὐτὸς
  choice: lui-même
  rationale: Le pronom explicite est emphatique; « lui-même » garde l’accent porté sur la présence personnelle et soudaine de Jésus.
- source_word: ἔστη
  choice: se tint
  rationale: L’aoriste de ἵστημι indique ici qu’il prit place debout. « Se tint » reste proche du sens lexical sans ajouter l’idée d’une apparition ou d’un déplacement.
- source_word: ἐν μέσῳ αὐτῶν
  choice: au milieu d’eux
  rationale: Cette expression situe Jésus au centre du groupe. « Au milieu d’eux » est une formulation française courante, claire et fidèle.
theological_decisions:
- issue: 'Faut-il inclure la leçon byzantine plus longue : « et il leur dit : “Que la paix soit avec vous !” » ?'
  choice: Ne pas l’inclure dans le texte principal, conformément au texte fourni du SBLGNT.
  alternative: 'Inclure : « et il leur dit : “Que la paix soit avec vous !” »'
  rationale: Le texte grec source fourni se termine par « au milieu d’eux ». La salutation, attestée dans certains manuscrits, est signalée en note afin de préserver cette variante importante sans l’introduire dans le texte principal.
translation_notes:
  register: Français international moderne, naturel et digne. La tournure « lui-même » conserve l’emphase grecque; « se tint » maintient le sens de la posture sans interpréter le verbe comme « apparut ».
