id: LUK.24.47
reference: Luke 24:47
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ κηρυχθῆναι ἐπὶ τῷ ὀνόματι αὐτοῦ μετάνοιαν ⸀καὶ ἄφεσιν ἁμαρτιῶν εἰς πάντα τὰ ἔθνη— ⸀ἀρξάμενοι ἀπὸ Ἰερουσαλήμ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/047.yaml
  text: and that repentance for the forgiveness of sins should be proclaimed in his name to all the nations[b][a], beginning from Jerusalem.
translation:
  language: fr
  text: et que la repentance et le pardon des péchés[a] soient proclamés en son nom à toutes les nations[b], en partant de Jérusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la repentance pour le pardon des péchés » ; le grec peut être compris comme reliant étroitement la repentance au pardon.
    reason: alternative_reading
  - marker: b
    text: Ou « à tous les non-Juifs » ; selon le contexte, le mot grec traduit par « nations » peut désigner les non-Juifs.
    reason: lexical_alternative
lexical_decisions:
- source_word: κηρυχθῆναι
  choice: soit proclamée
  rationale: L’infinitif aoriste passif dépend du contexte précédent d’accomplissement des Écritures. « Proclamer » exprime clairement l’annonce publique sans la limiter à la prédication formelle.
- source_word: ἐπὶ τῷ ὀνόματι αὐτοῦ
  choice: en son nom
  rationale: Cette tournure naturelle en français conserve l’idée que l’annonce repose sur la personne et l’autorité de Jésus.
- source_word: μετάνοιαν
  choice: la repentance
  rationale: « Repentance » exprime ici le retournement intérieur et la réorientation de la vie, plus complètement qu’un simple « changement d’avis », tout en gardant la forme nominale du grec.
- source_word: ἄφεσιν ἁμαρτιῶν
  choice: le pardon des péchés
  rationale: Dans ce contexte, ἄφεσις désigne la remise ou le pardon des péchés. La formulation française est courante, précise et théologiquement non restrictive.
- source_word: εἰς πάντα τὰ ἔθνη
  choice: à toutes les nations
  rationale: Cette traduction conserve l’étendue universelle de la mission et la valeur première de ἔθνη, sans exclure la nuance possible de « non-Juifs ».
- source_word: ἀρξάμενοι ἀπὸ Ἰερουσαλήμ
  choice: en commençant par Jérusalem
  rationale: Le participe indique le point de départ de la proclamation et implique les témoins chargés de l’annoncer. « Par Jérusalem » rend naturellement cette priorité géographique.
theological_decisions:
- issue: Rapport entre la repentance et le pardon dans le contenu proclamé
  choice: « la repentance pour le pardon des péchés »
  alternative: « la repentance et le pardon des péchés »
  rationale: Le texte peut étroitement relier la repentance au pardon, mais la présence de καί devant ἄφεσιν permet aussi de comprendre les deux noms comme deux éléments coordonnés de la proclamation. Le texte principal garde leur lien étroit sans détailler davantage l’ordre du salut; la note préserve l’autre analyse grammaticale.
- issue: Sens de ἔθνη
  choice: « toutes les nations »
  alternative: « tous les non-Juifs »
  rationale: Le contexte de la mission après la résurrection favorise une portée mondiale. « Nations » conserve néanmoins l’ambivalence lexicale du terme grec, signalée en note.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe conserve le lien avec la proposition précédente au moyen de « et que ». Les termes familiers au langage biblique sont maintenus lorsqu’ils expriment plus précisément le grec, tandis que les ambiguïtés réelles sont signalées en notes.
