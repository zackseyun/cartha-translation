lexical_decisions:
- source_word: οἱ δὲ
  choice: Ils… alors
  rationale: οἱ est employé comme pronom substantivé et renvoie aux disciples présents. δέ est un lien narratif léger; « alors » marque ici naturellement la suite de l’échange sans introduire une opposition forte.
- source_word: ἐπέδωκαν
  choice: donnèrent
  rationale: L’aoriste de ἐπιδίδωμι désigne ici l’action de donner ou de remettre. « Donnèrent » est direct, naturel et exact dans ce contexte.
- source_word: αὐτῷ
  choice: lui
  rationale: Le datif indique le destinataire; placé avant le verbe, « lui » est la formulation française idiomatique.
- source_word: ἰχθύος ὀπτοῦ μέρος
  choice: un morceau de poisson grillé
  rationale: μέρος est le nom principal, « morceau », tandis que ἰχθύος ὀπτοῦ précise qu’il s’agit de poisson préparé par cuisson au feu. Cette formulation est claire et naturelle en français moderne.
- source_word: ὀπτοῦ
  choice: grillé
  rationale: ὀπτός désigne un aliment rôti ou grillé. « Grillé » conserve ce mode de cuisson sans employer le terme plus général « cuit ».
theological_decisions:
- issue: Forme textuelle de Luc 24.42
  choice: 'Traduire uniquement le texte du SBLGNT: « un morceau de poisson grillé »'
  alternative: 'Certains manuscrits plus tardifs ajoutent: « et d’un rayon de miel »'
  rationale: Le texte critique fourni s’achève avec μέρος et ne contient pas l’ajout. La variante plus longue est néanmoins signalée en note pour assurer la transparence textuelle.
translation_notes:
  register: Français international moderne, courant et digne. Le passé simple convient au registre narratif biblique écrit; « poisson grillé » demeure immédiatement compréhensible sans surinterpréter le procédé précis de cuisson.
