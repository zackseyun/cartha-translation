id: LUK.24.51
reference: Luke 24:51
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἐγένετο ἐν τῷ εὐλογεῖν αὐτὸν αὐτοὺς διέστη ἀπ’ αὐτῶν ⸂[καὶ ἀνεφέρετο εἰς τὸν οὐρανόν]⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/051.yaml
  text: And it happened that[a], while he was blessing them, he parted from them and was carried up into heaven.
translation:
  language: fr
  text: Il arriva que, tandis qu’il les bénissait, il se sépara d’eux et fut emporté au ciel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Certains manuscrits omettent « et fut emporté au ciel ».
    reason: textual_variant
lexical_decisions:
- source_word: ἐγένετο
  choice: Il arriva que
  rationale: Cette tournure rend la formule narrative fréquente chez Luc tout en restant naturelle et digne en français moderne.
- source_word: ἐν τῷ εὐλογεῖν αὐτὸν αὐτούς
  choice: tandis qu’il les bénissait
  rationale: La construction avec ἐν et l’infinitif substantivé exprime une action en cours, contemporaine de la séparation.
- source_word: εὐλογεῖν
  choice: bénissait
  rationale: Le verbe français « bénir » restitue directement le sens sans explicitation interprétative superflue.
- source_word: διέστη ἀπ’ αὐτῶν
  choice: il se sépara d’eux
  rationale: Cette formulation conserve l’idée de séparation physique sans préciser davantage la manière du départ.
- source_word: ἀνεφέρετο
  choice: fut emporté
  rationale: Le passif français préserve l’idée qu’il est porté ou élevé sans nommer l’agent; le mouvement ascendant ressort du complément « au ciel ».
- source_word: εἰς τὸν οὐρανόν
  choice: au ciel
  rationale: Dans ce contexte, οὐρανός désigne le ciel comme domaine céleste. « Au ciel » est l’expression française naturelle, plutôt que le plus spatial mais moins idiomatique « dans le ciel ».
theological_decisions:
- issue: Présence de la proposition καὶ ἀνεφέρετο εἰς τὸν οὐρανόν
  choice: Inclure « et fut emporté au ciel » dans le texte principal avec une note de variante textuelle
  alternative: Omettre la proposition et terminer par « il se sépara d’eux »
  rationale: Le SBLGNT place cette proposition entre crochets pour signaler une incertitude textuelle. Son inclusion dans le texte, accompagnée d’une note, conserve à la fois la leçon fournie et l’existence de l’autre tradition manuscrite, sans trancher silencieusement.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve la formule narrative lucanienne et le déroulement temporel du grec, sans archaïsme ni précision doctrinale ajoutée.
