  text: εὗρον δὲ τὸν λίθον ἀποκεκυλισμένον ἀπὸ τοῦ μνημείου,
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/002.yaml
  text: And they found the stone rolled away from the tomb,
translation:
  language: fr
  text: Elles trouvèrent la pierre roulée loin du tombeau.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὗρον
  choice: Elles trouvèrent
  rationale: L’aoriste actif à la troisième personne du pluriel renvoie aux femmes mentionnées au verset précédent. Le français exige ici un sujet explicite ; « elles » assure naturellement la continuité du récit.
- source_word: δὲ
  choice: non rendu explicitement
  rationale: Ici, δέ est un léger connecteur narratif. Dans ce contexte, l’enchaînement est naturel en français sans « et » ni « mais » ; l’omettre évite une coordination lourde sans perdre de contraste significatif.
- source_word: τὸν λίθον
  choice: la pierre
  rationale: Dans ce contexte funéraire, λίθος désigne la pierre qui fermait le tombeau. « La pierre » est l’expression française habituelle et précise.
- source_word: ἀποκεκυλισμένον
  choice: roulée loin
  rationale: Le participe parfait passif décrit l’état résultant de la pierre après qu’elle a été roulée. « Roulée loin » conserve à la fois l’idée du mouvement et celle de l’éloignement.
- source_word: ἀπὸ τοῦ μνημείου
  choice: du tombeau
  rationale: μνημεῖον désigne ici le tombeau, et ἀπό marque l’éloignement. Avec « roulée loin », « du tombeau » rend clairement cette relation en français naturel.
theological_decisions:
- issue: Sujet implicite de la proposition grecque
  choice: Elles trouvèrent
  alternative: On trouva / Trouvèrent
  rationale: Le verbe pluriel reprend les femmes du verset précédent. L’ajout du pronom « elles », requis par le français courant, clarifie le référent sans ajouter de contenu théologique.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au registre d’un récit biblique écrit sans être archaïque. Aucun marqueur de note n’est nécessaire.
