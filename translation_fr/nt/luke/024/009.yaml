id: LUK.24.9
reference: Luke 24:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ὑποστρέψασαι ἀπὸ τοῦ μνημείου ἀπήγγειλαν ταῦτα πάντα τοῖς ἕνδεκα καὶ πᾶσιν τοῖς λοιποῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/009.yaml
  text: And returning from the tomb, they reported all these things to the eleven and to all the rest.
translation:
  language: fr
  text: Après être revenues du tombeau, elles rapportèrent tout cela aux onze et à tous les autres.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑποστρέψασαι
  choice: Après être revenues
  rationale: Le participe aoriste actif, féminin pluriel, renvoie aux femmes. Cette formulation française exprime naturellement leur retour antérieur à l’action principale tout en respectant leur genre grammatical.
- source_word: μνημείου
  choice: du tombeau
  rationale: Dans le récit de la résurrection, « tombeau » désigne précisément le lieu où Jésus avait été déposé et correspond à l’usage français courant.
- source_word: ἀπήγγειλαν
  choice: elles rapportèrent
  rationale: Le verbe signifie transmettre ou faire connaître une information. « Rapportèrent » convient au ton narratif et le pronom explicite rend visible le sujet féminin pluriel indiqué par le grec.
- source_word: ταῦτα πάντα
  choice: tout cela
  rationale: Cette expression française naturelle conserve à la fois la valeur démonstrative de ταῦτα et la portée globale de πάντα.
- source_word: τοῖς ἕνδεκα
  choice: aux onze
  rationale: Le grec dit simplement « les onze »; la traduction n’ajoute donc pas « apôtres ».
- source_word: πᾶσιν τοῖς λοιποῖς
  choice: à tous les autres
  rationale: Cette formulation préserve la distinction entre les onze et l’ensemble plus large des autres personnes présentes.
theological_decisions:
- issue: Référent du participe féminin et du verbe pluriel
  choice: Le sujet est rendu par « elles », c’est-à-dire les femmes revenues du tombeau.
  alternative: Rendre le sujet implicitement ou ajouter « les femmes ».
  rationale: La morphologie grecque indique clairement un sujet féminin pluriel. Le pronom français le manifeste sans ajouter un nom absent de ce verset.
- issue: Désignation du groupe apostolique
  choice: « aux onze » sans ajout explicatif
  alternative: « aux onze apôtres »
  rationale: Le texte emploie la désignation conventionnelle « les onze »; ajouter « apôtres » expliciterait le référent au-delà de la formulation grecque.
translation_notes:
  register: Français moderne, naturel et digne. Le passé simple maintient le registre narratif biblique sans archaïsme lexical; la phrase reste immédiatement compréhensible.
