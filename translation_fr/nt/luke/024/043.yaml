  text: καὶ λαβὼν ἐνώπιον αὐτῶν ἔφαγεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/043.yaml
  text: And taking it[a], he ate it before them.
translation:
  language: fr
  text: Il le prit[a] et le mangea sous leurs yeux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec dit simplement « ayant pris » et « mangea » ; l’objet, sous-entendu, est le morceau de poisson mentionné au verset précédent.
    reason: alternative_lexicale
lexical_decisions:
- source_word: καὶ
  choice: et
  rationale: Conjonction narrative simple reliant directement cette action au verset précédent, sans ajouter une valeur temporelle absente du grec.
- source_word: λαβὼν
  choice: le prit
  rationale: Le participe aoriste exprime une action antérieure à celle du verbe principal. Une coordination avec deux verbes conjugués est naturelle en français. Le pronom « le » reprend le morceau de poisson mentionné au verset précédent.
- source_word: ἐνώπιον αὐτῶν
  choice: sous leurs yeux
  rationale: Expression française naturelle indiquant que l'action se déroule en leur présence et à leur vue, tout en conservant la portée probante de la scène.
- source_word: ἔφαγεν
  choice: le mangea
  rationale: L'aoriste décrit l'action accomplie. Le pronom explicite en français l'objet sous-entendu en grec et repris du contexte immédiat.
theological_decisions:
- issue: Explicitation de l'objet sous-entendu avec λαβὼν et ἔφαγεν
  choice: Employer « le » avec les deux verbes
  alternative: « Puis, ayant pris, il mangea devant eux » ou « Il prit et mangea devant eux »
  rationale: Le grec omet l'objet, car celui-ci se déduit du verset précédent. Le français courant appelle ici un pronom objet. Cette explicitation clarifie l'action sans ajouter de contenu ni développer sa portée théologique.
translation_notes:
  register: Français moderne, clair et digne. La coordination « Il le prit et le mangea » rend naturellement le participe grec, tandis que « sous leurs yeux » conserve l'idée d'une action observable accomplie en leur présence.
