id: LUK.24.10
reference: Luke 24:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἦσαν δὲ ἡ Μαγδαληνὴ Μαρία καὶ Ἰωάννα καὶ Μαρία ⸀ἡ Ἰακώβου καὶ αἱ λοιπαὶ σὺν αὐταῖς· ⸀ἔλεγον πρὸς τοὺς ἀποστόλους ταῦτα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/010.yaml
  text: They were Mary Magdalene[a], Joanna, Mary the mother of James, and the other women with them; they were telling these things to the apostles.
translation:
  language: fr
  text: Il s’agissait de Marie de Magdala, de Jeanne, de Marie, mère de Jacques[a], et des autres femmes qui étaient avec elles. Elles racontaient tout cela aux apôtres.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec dit littéralement « Marie de Jacques ». Il s’agit probablement de la mère de Jacques, mais « Marie, femme de Jacques » est aussi possible.
    reason: Le génitif grec ne précise pas la nature de la relation entre Marie et Jacques.
lexical_decisions:
- source_word: ἦσαν δὲ
  choice: Il s’agissait de
  rationale: Cette tournure française introduit naturellement l’identification des femmes déjà évoquées. Elle rend la légère transition portée par δέ sans ajouter un marqueur temporel absent du grec.
- source_word: ἡ Μαγδαληνὴ Μαρία
  choice: Marie de Magdala
  rationale: Forme française courante et transparente de l’appellation géographique.
- source_word: Ἰωάννα
  choice: Jeanne
  rationale: Forme française traditionnelle et courante du nom.
- source_word: Μαρία ἡ Ἰακώβου
  choice: Marie, mère de Jacques[a]
  rationale: Le génitif grec exprime une relation sans la préciser. « mère de Jacques » est l’interprétation la plus probable et la plus naturelle en français, tandis que l’ambiguïté est signalée en note.
- source_word: αἱ λοιπαὶ σὺν αὐταῖς
  choice: les autres femmes qui étaient avec elles
  rationale: Le féminin pluriel permet d’expliciter naturellement « femmes »; la proposition relative rend clairement l’accompagnement exprimé par σὺν αὐταῖς.
- source_word: ἔλεγον
  choice: racontaient
  rationale: L’imparfait français conserve l’aspect duratif ou répété de l’imparfait grec; « raconter » convient au rapport des événements qui précèdent.
- source_word: ταῦτα
  choice: tout cela
  rationale: Expression française idiomatique qui renvoie à l’ensemble des faits et paroles précédemment rapportés.
- source_word: πρὸς τοὺς ἀποστόλους
  choice: aux apôtres
  rationale: « Apôtres » est le terme français établi et exact dans ce contexte.
theological_decisions:
- issue: Identification de Μαρία ἡ Ἰακώβου
  choice: Marie, mère de Jacques
  alternative: Marie de Jacques; Marie, femme de Jacques
  rationale: Le grec laisse la relation exacte implicite. L’identification par le fils est la plus probable dans cette formule, mais la possibilité qu’il s’agisse de l’épouse de Jacques demeure et est conservée dans la note.
translation_notes:
  register: Français international moderne, naturel et digne. La répétition « de Marie » clarifie la structure de la liste; la seconde phrase conserve l’imparfait narratif du grec.
