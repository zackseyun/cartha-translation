id: LUK.24.29
reference: Luke 24:29
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ παρεβιάσαντο αὐτὸν λέγοντες· Μεῖνον μεθ’ ἡμῶν, ὅτι πρὸς ἑσπέραν ἐστὶν καὶ κέκλικεν ⸀ἤδη ἡ ἡμέρα. καὶ εἰσῆλθεν τοῦ μεῖναι σὺν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/029.yaml
  text: But they urged him strongly[a], saying, “Stay with us[b], because it is toward evening and the day has already declined.” And he went in to stay with them.
translation:
  language: fr
  text: 'Mais ils insistèrent auprès de lui[a] : « Reste avec nous, car le soir approche et le jour est déjà sur son déclin[b]. » Alors il entra pour rester avec eux.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ils le pressèrent vivement ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « le jour s’est déjà incliné ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεβιάσαντο
  choice: ils insistèrent auprès de lui
  rationale: Le verbe au moyen exprime ici une insistance pressante plutôt qu’une contrainte physique. Cette tournure est naturelle en français moderne et conserve l’intensité.
- source_word: Μεῖνον μεθ’ ἡμῶν
  choice: Reste avec nous
  rationale: Dans ce contexte d’hospitalité, « reste » rend naturellement l’impératif de μένω, et « avec nous » traduit directement l’accompagnement exprimé par μετά avec le génitif.
- source_word: ὅτι πρὸς ἑσπέραν ἐστὶν
  choice: car le soir approche
  rationale: La formulation exprime l’approche du soir, et non nécessairement son arrivée complète. « Le soir approche » est idiomatique et précis.
- source_word: κέκλικεν ἤδη ἡ ἡμέρα
  choice: le jour est déjà sur son déclin
  rationale: Cette expression conserve l’image du jour qui s’incline ou décline, portée par le parfait de κλίνω, tout en restant intelligible en français actuel.
- source_word: εἰσῆλθεν
  choice: il entra
  rationale: Le verbe indique l’entrée de Jésus dans le lieu où ils allaient demeurer; « entra » convient au registre narratif.
- source_word: τοῦ μεῖναι σὺν αὐτοῖς
  choice: pour rester avec eux
  rationale: L’infinitif articulaire exprime ici le but; la répétition de « rester » fait écho à leur demande et σύν marque l’accompagnement.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La traduction maintient l’insistance énergique sans suggérer une contrainte physique et préserve la métaphore du jour qui décline.
