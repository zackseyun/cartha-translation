id: LUK.24.34
reference: Luke 24:34
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: λέγοντας ὅτι ⸂ὄντως ἠγέρθη ὁ κύριος⸃ καὶ ὤφθη Σίμωνι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/034.yaml
  text: saying[a], “The Lord has truly been raised and has appeared to Simon!”
translation:
  language: fr
  text: 'disant[a] : « Le Seigneur a vraiment été ressuscité et il est apparu à Simon ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ils disaient ». Le participe grec se rattache à la phrase précédente.'
    reason: alternative_syntax
lexical_decisions:
- source_word: λέγοντας
  choice: disant
  rationale: Le participe présent accusatif masculin pluriel dépend de la phrase précédente. « disant » conserve ce lien participial sans préciser davantage le sujet dans ce seul verset.
- source_word: ὅτι
  choice: ponctuation de discours direct
  rationale: ὅτι introduit ici le contenu des paroles. En français, les deux-points et les guillemets rendent naturellement cette fonction.
- source_word: ὄντως
  choice: vraiment
  rationale: L’adverbe affirme avec force la réalité du fait annoncé. « vraiment » est courant, clair et fidèle, sans donner au registre une solennité artificielle.
- source_word: ἠγέρθη
  choice: a été ressuscité
  rationale: L’aoriste passif de ἐγείρω est rendu par un passé composé passif naturel en français, ce qui préserve la voix du grec et la portée actuelle de l’annonce.
- source_word: ὁ κύριος
  choice: Le Seigneur
  rationale: Dans ce contexte, κύριος est un titre christologique désignant Jésus. « Seigneur » en conserve le poids sans l’affaiblir en « maître ».
- source_word: καὶ
  choice: et
  rationale: La conjonction coordonne simplement l’affirmation de la résurrection et l’apparition à Simon.
- source_word: ὤφθη
  choice: il est apparu
  rationale: Bien que la forme grecque soit morphologiquement passive, ὤφθη s’emploie idiomatiquement pour une manifestation ou apparition. « il est apparu » est le rendu français naturel dans les récits d’apparitions après la résurrection.
- source_word: Σίμωνι
  choice: à Simon
  rationale: Le datif désigne le bénéficiaire ou témoin de l’apparition. Le texte dit seulement « Simon » et ne développe pas en « Simon Pierre ».
theological_decisions:
- issue: Voix du verbe de résurrection
  choice: a été ressuscité
  alternative: est ressuscité / s’est relevé
  rationale: Le grec ἠγέρθη est passif. Le maintien du passif évite d’effacer une nuance réelle du texte, notamment la possibilité d’un passif divin, sans expliciter l’agent.
- issue: Traduction de κύριος
  choice: Le Seigneur
  alternative: le Maître
  rationale: Dans cette confession de résurrection, « Seigneur » conserve la valeur du titre appliqué à Jésus ainsi que sa densité christologique.
- issue: Voix de ὤφθη
  choice: il est apparu
  alternative: il a été vu
  rationale: La morphologie passive pourrait être reproduite par « a été vu », mais l’usage idiomatique grec relatif aux manifestations justifie « est apparu ». Ce choix ne précise ni la manière ni la nature de l’apparition.
translation_notes:
  register: Français international moderne, clair et digne. Le participe initial maintient la continuité avec Luc 24.33, tandis que le discours direct conserve la vivacité de l’annonce. Le passif « a été ressuscité » est volontairement maintenu malgré la possibilité française plus courante « est ressuscité ».
