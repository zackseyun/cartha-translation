  source_fidelity: « Vous êtes témoins de tout cela » rend fidèlement ὑμεῖς ἐστε μάρτυρες τούτων. « Témoins » correspond au sens testimonial de μάρτυρες dans ce contexte, et « de tout cela » exprime naturellement en français la référence récapitulative du démonstratif grec pluriel aux événements précédemment évoqués. Le léger effet d’insistance du pronom grec explicite ne peut pas être reproduit mécaniquement, puisque « vous » est requis en français moderne, mais la formulation reste adéquate.
  naturalness: La phrase est concise, idiomatique et de registre moderne international. « Vous êtes témoins de tout cela » est plus naturel dans ce contexte que « Vous êtes témoins de ces choses », sans modifier le sens.
