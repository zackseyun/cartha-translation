  text: ὑμεῖς ⸀ἐστε μάρτυρες τούτων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/048.yaml
  text: You are witnesses of these things[a].
translation:
  language: fr
  text: Vous êtes témoins de tout cela[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou simplement : « Vous en êtes témoins. » Le démonstratif grec renvoie aux événements dont Jésus vient de parler.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς
  choice: Vous
  rationale: Le pronom de deuxième personne du pluriel est exprimé en grec et met les disciples en relief. En français, « vous » est nécessaire avec le verbe et convient naturellement; l’emphase ressort aussi du contexte.
- source_word: ἐστε
  choice: êtes
  rationale: Présent de l’indicatif du verbe « être », rendu directement par « êtes ».
- source_word: μάρτυρες
  choice: témoins
  rationale: Désigne ici ceux qui peuvent attester les événements vus et entendus. « Témoins » est le terme français naturel et n’introduit pas le sens ultérieur de martyr.
- source_word: τούτων
  choice: de tout cela
  rationale: Le démonstratif au génitif pluriel renvoie à l’ensemble des faits que Jésus vient d’évoquer. « De tout cela » est idiomatique en français et conserve cette référence rétrospective sans la préciser davantage.
theological_decisions:
- issue: Portée du rôle des disciples comme μάρτυρες
  choice: Le verset présente les disciples comme ceux qui attestent les événements qui viennent d’être évoqués.
  alternative: Comprendre le terme à la lumière de son sens chrétien ultérieur lié au martyre.
  rationale: Dans le contexte immédiat, il s’agit de témoigner de la souffrance et de la résurrection de Jésus ainsi que du message à proclamer. Traduire par « témoins » préserve ce sens sans importer une évolution sémantique postérieure.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation est concise et accessible; « tout cela » explicite idiomatiquement le renvoi global du démonstratif grec.
