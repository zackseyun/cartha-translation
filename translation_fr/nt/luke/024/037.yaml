id: LUK.24.37
reference: Luke 24:37
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: πτοηθέντες δὲ καὶ ἔμφοβοι γενόμενοι ἐδόκουν πνεῦμα θεωρεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/037.yaml
  text: But being startled and becoming afraid[a], they thought they were seeing a spirit.
translation:
  language: fr
  text: Mais eux, saisis de stupeur et gagnés par la peur, pensaient voir un esprit[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un fantôme ». Le grec πνεῦμα signifie littéralement « esprit ».
    reason: lexical_alternative
lexical_decisions:
- source_word: πτοηθέντες
  choice: saisis de stupeur
  rationale: Le participe aoriste passif exprime le bouleversement soudain provoqué par l’apparition. « Saisis de stupeur » restitue ce choc sans faire double emploi avec la peur explicitement nommée ensuite.
- source_word: δὲ
  choice: Mais
  rationale: La conjonction marque ici le contraste entre l’apparition de Jésus et la réaction des disciples.
- source_word: ἔμφοβοι γενόμενοι
  choice: de peur
  rationale: Coordonné à « saisis », ce complément rend naturellement en français l’entrée dans un état de peur exprimée par l’adjectif et γίνομαι.
- source_word: ἐδόκουν
  choice: pensaient
  rationale: L’imparfait conserve la durée de leur impression ou supposition.
- source_word: πνεῦμα
  choice: un esprit
  rationale: « Esprit » est l’équivalent lexical direct et préserve le contraste narratif avec le corps ressuscité de Jésus sans introduire les connotations folkloriques de « fantôme ».
- source_word: θεωρεῖν
  choice: voir
  rationale: Après « pensaient », l’infinitif français « voir » exprime naturellement leur perception supposée; l’imparfait de « pensaient » porte la nuance durative.
theological_decisions:
- issue: Sens de πνεῦμα dans le récit d’une apparition du Ressuscité
  choice: un esprit
  alternative: un fantôme
  rationale: Le texte rapporte l’interprétation erronée des disciples sans définir davantage la nature de l’être qu’ils croyaient voir. « Un esprit » reste au plus près du grec et préserve la tension narrative que Jésus résout dans les versets suivants.
translation_notes:
  register: Français international moderne, naturel et digne. La structure participiale grecque est condensée en « saisis de stupeur et de peur » afin d’éviter une formulation pesante, tout en maintenant les deux réactions distinctes et l’imparfait de leur supposition.
