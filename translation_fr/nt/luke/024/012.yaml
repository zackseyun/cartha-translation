source:
  edition: SBLGNT
  text: ⸂Ὁ δὲ Πέτρος ἀναστὰς ἔδραμεν ἐπὶ τὸ μνημεῖον· καὶ παρακύψας βλέπει τὰ ⸀ὀθόνια μόνα· καὶ ἀπῆλθεν πρὸς ⸀αὑτὸν θαυμάζων τὸ γεγονός.⸃
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/012.yaml
  text: But Peter got up and ran to the tomb; and stooping to look in, he sees the linen cloths alone, and he went away to himself, marveling at what had happened.
translation:
  language: fr
  text: Mais Pierre se leva et courut vers le tombeau ; en se penchant, il voit les linges seuls ; puis il repartit chez lui[a], étonné de ce qui était arrivé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « en lui-même ».'
    reason: 'πρὸς ἑαυτόν est ambigu : il peut indiquer le retour chez soi ou un mouvement/réflexion intérieure.'
lexical_decisions:
- source_word: μνημεῖον
  choice: tombeau
  rationale: Terme français naturel et digne pour désigner le lieu où Jésus avait été déposé.
- source_word: παρακύψας
  choice: s’étant penché pour regarder
  rationale: Exprime à la fois le mouvement de se courber et l’action de regarder à l’intérieur.
- source_word: ὀθόνια
  choice: bandelettes de lin
  rationale: Rend le pluriel et la matière de ces pièces de tissu funéraire sans les assimiler à un unique linceul.
- source_word: μόνα
  choice: seulement
  rationale: Souligne que les bandelettes étaient là sans le corps.
- source_word: πρὸς αὑτόν
  choice: chez lui
  rationale: Dans ce contexte, l’expression peut naturellement indiquer que Pierre repart vers son logement; cette traduction reste concise et idiomatique.
- source_word: θαυμάζων
  choice: tout étonné
  rationale: Restitue l’étonnement profond, sans imposer le sens moderne parfois admiratif de « s’émerveiller ».
theological_decisions:
- issue: Présent historique βλέπει au milieu d’un récit au passé
  choice: il voit
  alternative: il vit
  rationale: Conserve le présent historique marqué du texte grec et l’effet de vivacité également retenu dans la couche anglaise auditée.
- issue: Sens de πρὸς αὑτόν
  choice: chez lui
  alternative: en lui-même / de son côté
  rationale: Le contexte narratif favorise un déplacement vers son logement, mais l’expression grecque admet une certaine ambiguïté; aucune conclusion doctrinale n’en dépend.
translation_notes:
  register: Français international moderne, narratif et digne. Les phrases ont été légèrement segmentées pour la lisibilité, tout en préservant la succession des actions et le présent historique « il voit ».
