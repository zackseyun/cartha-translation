id: LUK.24.23
reference: Luke 24:23
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ μὴ εὑροῦσαι τὸ σῶμα αὐτοῦ ἦλθον λέγουσαι καὶ ὀπτασίαν ἀγγέλων ἑωρακέναι, οἳ λέγουσιν αὐτὸν ζῆν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/023.yaml
  text: and not finding his body[a], they came saying that they had also seen a vision of angels[b], who say that he is alive.
translation:
  language: fr
  text: Et, n’ayant pas trouvé son corps, elles sont venues dire qu’elles avaient aussi eu une vision d’anges, qui disent qu’il est vivant[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, moins probablement : « elles sont venues dire qu’elles avaient eu une vision d’anges et qu’elles disent qu’il est vivant », en rattachant « qui disent » aux femmes plutôt qu’aux anges.'
    reason: alternative_reading
lexical_decisions:
- source_word: μὴ εὑροῦσαι
  choice: n’ayant pas trouvé
  rationale: Le participe aoriste féminin pluriel se rapporte aux femmes. Le participe composé est naturel en français et conserve le lien circonstanciel sans préciser davantage s’il est temporel ou causal.
- source_word: τὸ σῶμα αὐτοῦ
  choice: son corps
  rationale: Rendu direct et courant de σῶμα dans le contexte du tombeau.
- source_word: ἦλθον λέγουσαι
  choice: elles sont venues dire
  rationale: Cette formulation idiomatique conserve le sens littéral de ἦλθον, « elles sont venues », sans expliciter « revenues », et rend naturellement le participe λέγουσαι.
- source_word: καὶ ὀπτασίαν
  choice: aussi … une vision
  rationale: Ici καί ajoute à l’absence du corps le récit d’une vision. « Aussi » exprime cette valeur additive sans imposer la nuance plus forte de « même ».
- source_word: ὀπτασίαν ἀγγέλων
  choice: une vision d’anges
  rationale: « Vision » rend le caractère extraordinaire de ὀπτασία sans développement interprétatif; le complément « d’anges » préserve la construction grecque.
- source_word: ἑωρακέναι
  choice: qu’elles avaient … vu
  rationale: Le parfait infinitif dans le discours indirect est rendu naturellement par le plus-que-parfait français.
- source_word: οἳ λέγουσιν
  choice: qui disent
  rationale: Le relatif masculin pluriel renvoie le plus naturellement aux anges, et le présent λέγουσιν est conservé.
- source_word: αὐτὸν ζῆν
  choice: qu’il est vivant
  rationale: La proposition infinitive est rendue par une subordonnée française; « est vivant » exprime naturellement ζῆν dans ce contexte.
theological_decisions:
- issue: Antécédent de οἳ λέγουσιν
  choice: 'Le relatif renvoie aux anges : « des anges, qui disent qu’il est vivant ».'
  alternative: 'Le relatif pourrait être rattaché aux femmes : « elles sont venues dire qu’elles avaient vu une vision d’anges et qu’elles disent qu’il est vivant » ou une construction équivalente.'
  rationale: L’accord masculin pluriel et la proximité de ἀγγέλων font des anges l’antécédent syntaxique le plus naturel. L’autre rattachement, moins probable, est signalé en note afin de ne pas effacer l’ambiguïté possible.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation reste proche de la syntaxe grecque tout en étant idiomatique; « sont venues » évite d’ajouter explicitement l’idée de retour, et « aussi » conserve la valeur additive de καί.
