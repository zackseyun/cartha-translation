id: LUK.24.49
reference: Luke 24:49
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ἐγὼ ⸀ἐξαποστέλλω τὴν ἐπαγγελίαν τοῦ πατρός μου ἐφ’ ὑμᾶς· ὑμεῖς δὲ καθίσατε ἐν τῇ ⸀πόλει ἕως οὗ ἐνδύσησθε ⸂ἐξ ὕψους δύναμιν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/049.yaml
  text: And look, I am sending the promise of my Father upon you. But stay in the city until you are clothed with power from on high.
translation:
  language: fr
  text: Et voici, j’envoie sur vous ce que mon Père a promis. Quant à vous, restez dans la ville jusqu’à ce que vous soyez revêtus de la puissance d’en haut.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδού
  choice: voici
  rationale: Marque naturellement l’attention en français biblique moderne, avec dignité, sans la lourdeur de « regardez » dans ce contexte.
- source_word: ἐξαποστέλλω
  choice: j’envoie
  rationale: Le présent français conserve le présent grec et l’affirmation d’une action imminente ou engagée.
- source_word: τὴν ἐπαγγελίαν τοῦ πατρός μου
  choice: ce que mon Père a promis
  rationale: 'Rend l’expression idiomatiquement et clairement : la promesse désigne ici ce qui a été promis, sans expliciter davantage son contenu.'
- source_word: ἐφ’ ὑμᾶς
  choice: sur vous
  rationale: Conserve l’image directionnelle du grec et son lien avec le don promis.
- source_word: καθίσατε ἐν τῇ πόλει
  choice: restez dans la ville
  rationale: Dans ce contexte, καθίζω a le sens de demeurer ou attendre sur place plutôt que de s’asseoir littéralement.
- source_word: ἐνδύσησθε
  choice: vous soyez revêtus
  rationale: Préserve la métaphore grecque de l’habillement et la voix passive.
- source_word: ἐξ ὕψους δύναμιν
  choice: de la puissance d’en haut
  rationale: Conserve l’origine céleste exprimée par ἐξ ὕψους et le sens large de δύναμις.
theological_decisions:
- issue: Identification de « ce que mon Père a promis »
  choice: Ne pas identifier explicitement la promesse dans le corps du verset
  alternative: Ajouter « l’Esprit Saint »
  rationale: Le contexte permet cette identification, mais le grec du verset lui-même dit seulement « la promesse de mon Père »; l’explicitation réduirait la formulation originale.
- issue: Nature de la « puissance d’en haut »
  choice: Conserver l’expression métaphorique sans explication doctrinale
  alternative: Paraphraser comme une habilitation ou un baptême spirituel précis
  rationale: La formulation source établit un lien avec la promesse sans définir ici tous ses contours théologiques.
translation_notes:
  register: Français international moderne, naturel et digne. « Et voici » garde la transition et l’appel à l’attention; « Quant à vous » rend nettement le contraste de ὑμεῖς δέ. La métaphore « revêtus de la puissance » est maintenue malgré son caractère légèrement marqué, car elle est centrale au texte grec.
