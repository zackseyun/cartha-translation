  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἶπεν δὲ πρὸς αὐτούς· Τίνες οἱ λόγοι οὗτοι οὓς ἀντιβάλλετε πρὸς ἀλλήλους περιπατοῦντες; καὶ ⸀ἐστάθησαν σκυθρωποί.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/017.yaml
  text: And he said to them[a], “What are these words that you are exchanging with one another as you walk?” And they stood still[b], looking sad.
translation:
  language: fr
  text: 'Il leur dit : « Quels sont ces propos[a] que vous échangez entre vous en marchant ? » Et ils s’arrêtèrent, le visage sombre.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « De quoi discutez-vous entre vous en marchant ? »'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « Et ils s’immobilisèrent, l’air triste. »'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν δὲ πρὸς αὐτούς
  choice: Il leur dit
  rationale: La tournure rend simplement le verbe λέγω et le destinataire; δέ assure ici une transition narrative légère qu’il n’est pas nécessaire d’expliciter en français.
- source_word: Τίνες οἱ λόγοι οὗτοι
  choice: De quoi parlez-vous ainsi
  rationale: Dans ce contexte, λόγοι désigne les propos ou le sujet de la conversation. Une traduction littérale par « Quelles sont ces paroles ? » serait peu naturelle en français; « De quoi parlez-vous ainsi ? » conserve la portée interrogative sans préciser indûment le contenu.
- source_word: ἀντιβάλλετε πρὸς ἀλλήλους
  choice: parlez-vous ainsi entre vous
  rationale: Le verbe rare ἀντιβάλλω évoque ici un échange réciproque de propos. « Parlez-vous … entre vous » est idiomatique et laisse ouverte la possibilité d’une discussion animée sans imposer l’idée d’une dispute.
- source_word: περιπατοῦντες
  choice: en marchant
  rationale: Le participe exprime une action simultanée à l’échange verbal; « en marchant » le rend directement et naturellement.
- source_word: ἐστάθησαν
  choice: ils s’arrêtèrent
  rationale: Dans la scène, la forme de ἵστημι indique qu’ils cessent de marcher. « Ils s’arrêtèrent » exprime clairement ce mouvement narratif.
- source_word: σκυθρωποί
  choice: le visage sombre
  rationale: L’adjectif décrit une apparence renfrognée, abattue ou triste, particulièrement perceptible sur le visage. Cette expression française est concise et conserve la dimension visible de leur état.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La question est formulée idiomatiquement plutôt que calquée sur « quelles sont ces paroles », tout en préservant le caractère réciproque de l’échange. Le marqueur [a] est placé dans le texte principal.
