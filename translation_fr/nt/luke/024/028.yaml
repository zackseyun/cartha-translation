id: LUK.24.28
reference: Luke 24:28
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ ἤγγισαν εἰς τὴν κώμην οὗ ἐπορεύοντο, καὶ αὐτὸς ⸀προσεποιήσατο ⸀πορρώτερον πορεύεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/028.yaml
  text: And they came near to the village where they were going[a], and he acted as though he were going farther.
translation:
  language: fr
  text: Ils approchèrent du village où ils se rendaient, et il fit comme s’il allait plus loin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « fit mine d’aller plus loin » ; autre traduction possible : « prétendit aller plus loin ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤγγισαν
  choice: approchèrent
  rationale: L’aoriste de ἐγγίζω indique qu’ils arrivèrent à proximité du village. « Approchèrent » est naturel et conserve le mouvement vers le lieu.
- source_word: κώμην
  choice: village
  rationale: κώμη désigne normalement une petite localité, plutôt qu’une ville.
- source_word: οὗ ἐπορεύοντο
  choice: où ils se rendaient
  rationale: L’adverbe relatif et l’imparfait de πορεύομαι expriment la destination de leur trajet en cours. « Où ils se rendaient » est idiomatique et précis.
- source_word: προσεποιήσατο
  choice: fit comme si
  rationale: Le verbe indique qu’il donna l’impression de poursuivre sa route. « Fit comme si » préserve cette apparence sans imposer explicitement l’idée plus forte de tromperie que pourrait suggérer « prétendit ».
- source_word: πορρώτερον
  choice: plus loin
  rationale: Le comparatif adverbial marque une continuation du déplacement au-delà du village.
- source_word: πορεύεσθαι
  choice: allait
  rationale: L’infinitif complète προσεποιήσατο et désigne l’action apparente; la tournure « comme s’il allait » est naturelle en français.
theological_decisions:
- issue: La manière de décrire l’action de Jésus en προσεποιήσατο
  choice: fit comme s’il allait plus loin
  alternative: prétendit aller plus loin
  rationale: 'La formulation retenue garde la tension narrative: Jésus donne l’impression qu’il va continuer, sans résoudre la question en qualifiant explicitement son geste de tromperie.'
translation_notes:
  register: Français international moderne, fluide et digne. La coordination « et lui » met légèrement le changement de sujet en relief, comme αὐτός dans le grec. La note conserve les principales nuances possibles de προσποιέομαι.
