  naturalness: 'La formulation « et lui fit » n’est pas idiomatique en français moderne : le pronom tonique « lui » ne peut pas être ainsi juxtaposé au verbe sans reprise ou ponctuation appropriée, et la phrase paraît fautive. « Et il fit comme s’il allait plus loin » est naturel et conserve le sens.'
  terminology: Aucun problème de nom propre ni de terme théologique. « Fit comme si » est un bon rendu non chargé de προσεποιήσατο. La note présente utilement « fit mine de » et « prétendit » comme possibilités lexicales.
