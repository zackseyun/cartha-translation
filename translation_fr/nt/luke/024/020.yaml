source:
  edition: SBLGNT
  text: ὅπως τε παρέδωκαν αὐτὸν οἱ ἀρχιερεῖς καὶ οἱ ἄρχοντες ἡμῶν εἰς κρίμα θανάτου καὶ ἐσταύρωσαν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/020.yaml
  text: and how our chief priests and rulers handed him over to a sentence of death and crucified him[a][b].
translation:
  language: fr
  text: et comment nos grands prêtres et nos dirigeants l’ont livré pour être condamné à mort et l’ont crucifié[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’ont fait crucifier », en explicitant leur responsabilité dans l’exécution, réalisée par les autorités romaines.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπως τε
  choice: et comment
  rationale: ὅπως introduit ici la suite de ce que les disciples racontent, tandis que τε assure la liaison avec le verset précédent. « et comment » rend naturellement cette continuité.
- source_word: παρέδωκαν
  choice: l’ont livré
  rationale: παραδίδωμι signifie ici remettre ou livrer quelqu’un aux autorités en vue d’une procédure judiciaire. « livré » conserve cette valeur sans introduire le sens plus étroit de « trahi ».
- source_word: οἱ ἀρχιερεῖς
  choice: nos chefs des prêtres
  rationale: Dans ce contexte, le pluriel désigne les membres dirigeants de l’aristocratie sacerdotale, et non plusieurs grands prêtres exerçant simultanément la charge suprême.
- source_word: οἱ ἄρχοντες ἡμῶν
  choice: nos dirigeants
  rationale: ἄρχοντες désigne les autorités dirigeantes. « dirigeants » est actuel et naturel, et ἡμῶν est rendu une seule fois de manière distributive par « nos » devant chacun des deux groupes.
- source_word: εἰς κρίμα θανάτου
  choice: pour qu’il soit condamné à mort
  rationale: κρίμα peut désigner un jugement, un verdict ou une condamnation. Cette formulation française exprime clairement l’issue judiciaire visée par εἰς, sans l’expression peu idiomatique « à une sentence de mort ».
- source_word: ἐσταύρωσαν
  choice: l’ont crucifié
  rationale: Le verbe actif attribue directement l’action et la responsabilité aux chefs mentionnés. La traduction conserve cette force, sans préciser dans le corps du texte que l’exécution matérielle fut effectuée par les Romains.
theological_decisions:
- issue: Responsabilité dans l’exécution de Jésus
  choice: « l’ont crucifié » maintient l’attribution directe de responsabilité portée par le verbe grec actif.
  alternative: « l’ont fait crucifier » expliciterait une causalité indirecte et l’intervention des autorités romaines.
  rationale: Le grec présente les chefs des prêtres et les dirigeants comme sujets de ἐσταύρωσαν. Il convient de préserver cette formulation et sa tension historique plutôt que de la résoudre dans le texte principal; une note signale l’autre rendu possible.
translation_notes:
  register: Français international moderne, courant et digne. « Chefs des prêtres » est plus transparent pour le grand public que « principaux sacrificateurs »; « dirigeants » évite la tonalité vieillie ou monarchique de « chefs » ou « gouvernants ». La coordination par « puis » clarifie la succession sans gommer le lien étroit entre condamnation et crucifixion.
