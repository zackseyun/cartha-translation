revisions:
- from: et comment nos chefs des prêtres et nos dirigeants l’ont livré pour qu’il soit condamné à mort, puis l’ont crucifié[a].
  to: et comment nos grands prêtres et nos dirigeants l’ont livré pour être condamné à mort et l’ont crucifié[a].
  rationale: La révision remplace une expression française peu naturelle par le terme biblique usuel « grands prêtres », resserre le rendu de l’issue judiciaire en conservant « condamné à mort », et maintient le verbe actif « l’ont crucifié », conformément au grec. La coordination par « et » suit le καί sans introduire une nuance temporelle supplémentaire. La note conserve l’alternative causative sans résoudre dans le texte principal la question historique de l’exécution romaine.
