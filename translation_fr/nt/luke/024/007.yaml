source:
  edition: SBLGNT
  text: λέγων ⸂τὸν υἱὸν τοῦ ἀνθρώπου ὅτι δεῖ⸃ παραδοθῆναι εἰς χεῖρας ἀνθρώπων ἁμαρτωλῶν καὶ σταυρωθῆναι καὶ τῇ τρίτῃ ἡμέρᾳ ἀναστῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/007.yaml
  text: saying that the Son of Man must be delivered into the hands of sinful men and be crucified and on the third day rise again[a][b].
translation:
  language: fr
  text: 'en disant : « Il faut que le Fils de l’homme soit livré aux mains d’hommes pécheurs, qu’il soit crucifié et que, le troisième jour, il ressuscite[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « se relève » ; le grec est à la voix active, et non passive (« soit ressuscité »).
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγων
  choice: en disant
  rationale: Le participe présent garde le lien syntaxique avec l’appel à se souvenir formulé au verset précédent, sans le transformer en verbe autonome.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: le Fils de l’homme
  rationale: Expression française consacrée qui préserve la valeur de titre ainsi que les résonances bibliques de cette désignation.
- source_word: ὅτι δεῖ
  choice: Il faut que
  rationale: Cette tournure exprime la nécessité portée par δεῖ, et non une simple prédiction, tout en conservant le présent du grec.
- source_word: παραδοθῆναι εἰς χεῖρας
  choice: soit livré entre les mains de
  rationale: « Livré » rend le passif sans le limiter à la trahison de Judas, tandis que « entre les mains de » conserve l’image d’une remise au pouvoir d’autrui.
- source_word: ἀνθρώπων ἁμαρτωλῶν
  choice: d’hommes pécheurs
  rationale: Le masculin pluriel désigne ici les hommes qui participent à l’arrestation et à l’exécution de Jésus ; cette formulation conserve aussi explicitement ἀνθρώπων.
- source_word: σταυρωθῆναι
  choice: soit crucifié
  rationale: Rendu précis, usuel et direct de l’infinitif passif désignant la crucifixion.
- source_word: τῇ τρίτῃ ἡμέρᾳ
  choice: le troisième jour
  rationale: Rend naturellement le datif temporel sans ajout explicatif.
- source_word: ἀναστῆναι
  choice: ressuscite
  rationale: En français, l’emploi intransitif actif de « ressusciter » exprime clairement le retour à la vie et respecte la forme active du grec.
theological_decisions:
- issue: Portée de δεῖ dans l’annonce de la Passion
  choice: « Il faut que », exprimant une nécessité inscrite dans le dessein de Dieu
  alternative: « il arrivera que », comme simple annonce de l’avenir
  rationale: Dans Luc, δεῖ marque régulièrement une nécessité liée à l’accomplissement du dessein divin. La traduction conserve cette portée sans l’expliciter davantage.
- issue: Voix grammaticale de ἀναστῆναι
  choice: « ressuscite », à la voix active
  alternative: « soit ressuscité », à la voix passive
  rationale: Le texte grec emploie ici un infinitif actif. Le passif serait théologiquement possible ailleurs, mais modifierait la nuance grammaticale de ce verset.
- issue: Genre de ἀνθρώπων ἁμαρτωλῶν
  choice: « hommes pécheurs »
  alternative: « personnes pécheresses » ou « pécheurs »
  rationale: Le masculin du grec correspond dans le contexte aux agents masculins de l’arrestation et de la crucifixion ; « hommes » conserve en outre le substantif ἀνθρώπων.
translation_notes:
  register: Français moderne, international et digne. La structure « en disant » dépend volontairement du verset précédent. La répétition de « que » clarifie la série des trois infinitifs grecs et donne à la phrase un rythme naturel.
