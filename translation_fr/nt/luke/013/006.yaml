id: LUK.13.6
reference: Luke 13:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἔλεγεν δὲ ταύτην τὴν παραβολήν. Συκῆν εἶχέν τις ⸂πεφυτευμένην ἐν τῷ ἀμπελῶνι αὐτοῦ⸃, καὶ ἦλθεν ζητῶν καρπὸν ἐν αὐτῇ καὶ οὐχ εὗρεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/006.yaml
  text: 'And he was telling this parable: “A man had a fig tree planted in his vineyard[a], and he came looking for fruit on it and found none.”'
translation:
  language: fr
  text: 'Il disait aussi cette parabole : « Un homme avait un figuier planté dans sa vigne[a]. Il vint y chercher du fruit, mais n’en trouva pas. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Quelqu’un avait un figuier planté dans sa vigne. » Le pronom grec est indéfini; « un homme » convient toutefois bien au style narratif de la parabole.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔλεγεν
  choice: Il disait
  rationale: L’imparfait grec présente ici l’action narrative en cours ou introduit le discours. « Il disait » en conserve l’aspect tout en restant naturel en français.
- source_word: δὲ
  choice: aussi
  rationale: La particule δέ marque une liaison légère avec ce qui précède. Dans ce contexte, « aussi » assure la continuité sans donner au lien une valeur trop forte.
- source_word: παραβολήν
  choice: parabole
  rationale: « Parabole » est le terme français usuel et précis pour ce type de récit figuré dans l’enseignement de Jésus.
- source_word: Συκῆν
  choice: un figuier
  rationale: Le nom désigne précisément un figuier.
- source_word: εἶχέν τις
  choice: Un homme avait
  rationale: Le pronom indéfini τις introduit un personnage non identifié. « Un homme » convient au style narratif d’une parabole, sans ajouter de précision absente du grec.
- source_word: πεφυτευμένην
  choice: planté
  rationale: 'Le participe parfait passif décrit le figuier dans son état résultant : il avait été planté et se trouvait dans la vigne. L’adjectif participial « planté » rend cela naturellement.'
- source_word: ἐν τῷ ἀμπελῶνι αὐτοῦ
  choice: dans sa vigne
  rationale: ἀμπελών désigne une vigne, c’est-à-dire un terrain planté de ceps; le possessif αὐτοῦ est rendu par « sa ».
- source_word: ἦλθεν ζητῶν
  choice: Il vint y chercher
  rationale: Le verbe principal à l’aoriste accompagné du participe présent exprime la venue avec une recherche en cours ou visée. « Vint y chercher » est idiomatique et concis.
- source_word: καρπὸν
  choice: du fruit
  rationale: Le singulier collectif « du fruit » rend naturellement le grec et conserve la portée métaphorique du terme.
- source_word: ἐν αὐτῇ
  choice: y
  rationale: Le pronom adverbial « y » renvoie naturellement au figuier comme lieu où l’homme cherche du fruit, sans reproduire maladroitement la préposition grecque.
- source_word: οὐχ εὗρεν
  choice: n’en trouva pas
  rationale: Le pronom « en » reprend « du fruit » et rend la négation grecque de façon claire et naturelle.
theological_decisions:
- issue: Sujet indéfini τις dans la parabole
  choice: Un homme
  alternative: Quelqu’un
  rationale: Le texte introduit simplement un personnage humain sans l’identifier. « Un homme » correspond au style narratif traditionnel et courant des paraboles, sans lui attribuer de portée théologique supplémentaire.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple dans le récit enchâssé (« vint », « trouva ») maintient un registre littéraire sobre, tandis que l’imparfait introductif respecte l’aspect de ἔλεγεν. Le marqueur [a] figure dans le texte principal.
