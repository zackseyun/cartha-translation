id: LUK.13.19
reference: Luke 13:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁμοία ἐστὶν κόκκῳ σινάπεως, ὃν λαβὼν ἄνθρωπος ἔβαλεν εἰς κῆπον ἑαυτοῦ, καὶ ηὔξησεν καὶ ἐγένετο εἰς ⸀δένδρον, καὶ τὰ πετεινὰ τοῦ οὐρανοῦ κατεσκήνωσεν ἐν τοῖς κλάδοις αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/019.yaml
  text: It is like a mustard seed[a], which a man took and threw into his garden, and it grew and became a tree[b], and the birds of the sky nested in its branches.
translation:
  language: fr
  text: Il est semblable à un grain de moutarde qu’un homme prit et jeta dans son jardin. Le grain poussa, devint un arbre[a], et les oiseaux du ciel nichèrent dans ses branches.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec dit bien « devint un arbre », conservant l’image amplifiée de la croissance dans la parabole.
    reason: Préciser que « arbre » traduit directement δένδρον malgré le caractère botanique possiblement surprenant de l’image.
lexical_decisions:
- source_word: ὁμοία ἐστὶν
  choice: Il est semblable à
  rationale: Cette formule française naturelle conserve la comparaison explicite des paraboles du Royaume. Le pronom masculin s’accorde en français avec « le royaume », sous-entendu d’après le contexte.
- source_word: κόκκῳ σινάπεως
  choice: un grain de moutarde
  rationale: « Grain de moutarde » est l’expression française courante et rend naturellement κόκκος, qui peut désigner un grain ou une graine.
- source_word: ὃν λαβὼν ἄνθρωπος
  choice: qu’un homme prit
  rationale: Le personnage singulier masculin est conservé. Le participe λαβών est rendu par un verbe coordonné naturel en français.
- source_word: ἔβαλεν εἰς κῆπον ἑαυτοῦ
  choice: jeta dans son jardin
  rationale: « Jeta » préserve la vivacité de βάλλω sans introduire le verbe interprétatif « semer »; κῆπος désigne bien un jardin.
- source_word: ηὔξησεν
  choice: Le grain poussa
  rationale: « Poussa » exprime clairement la croissance végétale. La répétition de « le grain » évite l’ambiguïté que créerait le pronom féminin « elle » après le masculin « grain ».
- source_word: ἐγένετο εἰς δένδρον
  choice: devint un arbre
  rationale: La formulation garde l’image amplifiée et surprenante du grec, sans la réduire à celle d’un arbuste.
- source_word: τὰ πετεινὰ τοῦ οὐρανοῦ
  choice: les oiseaux du ciel
  rationale: Rendu direct et idiomatique de l’expression grecque, où οὐρανός a ici un sens spatial.
- source_word: κατεσκήνωσεν
  choice: nichèrent
  rationale: Dans le contexte d’oiseaux installés dans des branches, « nichèrent » transmet naturellement l’idée de s’établir ou de camper. Le pluriel français correspond au sujet collectif pluriel du grec.
- source_word: ἐν τοῖς κλάδοις αὐτοῦ
  choice: dans ses branches
  rationale: Rendu simple et précis; le possessif renvoie à l’arbre issu du grain de moutarde.
theological_decisions:
- issue: Genre du personnage désigné par ἄνθρωπος
  choice: un homme
  alternative: quelqu’un / une personne
  rationale: Dans cette scène particulière, le grec présente un personnage singulier masculin; la traduction le conserve sans généraliser ni neutraliser.
- issue: Image de δένδρον dans la parabole
  choice: un arbre
  alternative: un grand arbuste / une grande plante
  rationale: Le texte grec emploie explicitement δένδρον, « arbre ». La traduction préserve donc l’hyperbole ou l’amplification possible de la parabole au lieu de l’atténuer pour des raisons botaniques.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple convient au récit bref de la parabole et maintient sa concision. La coordination demeure proche du rythme grec, tout en scindant légèrement la syntaxe pour éviter une phrase lourde.
