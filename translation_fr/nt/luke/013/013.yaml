source:
  edition: SBLGNT
  text: καὶ ἐπέθηκεν αὐτῇ τὰς χεῖρας· καὶ παραχρῆμα ἀνωρθώθη, καὶ ἐδόξαζεν τὸν θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/013.yaml
  text: And he laid his hands on her, and immediately she was made straight again, and she glorified God.
translation:
  language: fr
  text: Puis il posa les mains sur elle. Aussitôt, elle se redressa[a] et se mit à rendre gloire à Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « elle fut redressée » ou « elle se tint droite ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέθηκεν αὐτῇ τὰς χεῖρας
  choice: il posa les mains sur elle
  rationale: La tournure française naturelle « poser les mains sur quelqu’un » conserve l’action concrète et rend le datif αὐτῇ par « sur elle ». Le possessif n’est pas nécessaire en français.
- source_word: παραχρῆμα
  choice: aussitôt
  rationale: Exprime clairement le caractère immédiat de la guérison dans un français narratif courant.
- source_word: ἀνωρθώθη
  choice: elle se redressa
  rationale: Le verbe passif décrit ici le rétablissement physique de la femme courbée. Le pronominal français est naturel sans préciser dans le texte le mécanisme de l’action; une note conserve les autres nuances possibles.
- source_word: ἐδόξαζεν
  choice: se mit à rendre gloire
  rationale: L’imparfait grec présente une action qui se prolonge ou commence alors. « Se mit à rendre gloire » en restitue ici la valeur inchoative tout en conservant la portée de δοξάζω.
- source_word: τὸν θεόν
  choice: à Dieu
  rationale: Complément naturel de l’expression française « rendre gloire à ».
theological_decisions:
- issue: Nature du rétablissement exprimé par ἀνωρθώθη
  choice: « elle se redressa » comme rétablissement physique immédiat
  alternative: « elle fut redressée » ou « elle se tint droite »
  rationale: Le contexte indique une guérison corporelle, mais la formulation ne développe pas son mécanisme et n’ajoute pas « de nouveau », absent du grec.
translation_notes:
  register: Français international moderne, simple et digne. La coordination grecque est répartie en deux phrases pour une narration naturelle; « aussitôt » reste mis en relief. Le marqueur [a] figure immédiatement après le terme concerné.
