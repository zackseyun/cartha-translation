reference: Luke 13:27
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἐρεῖ ⸀λέγων ὑμῖν· Οὐκ ⸀οἶδα πόθεν ἐστέ· ἀπόστητε ἀπ’ ἐμοῦ, πάντες ⸀ἐργάται ἀδικίας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/027.yaml
  text: And he will say to you[a], ‘I do not know where you are from. Depart from me[c][b], all you workers of unrighteousness.’
translation:
  language: fr
  text: 'Et il vous dira[a] : « Je ne sais pas d’où vous venez. Éloignez-vous de moi, vous tous qui commettez l’injustice[b] ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement, le grec emploie une tournure redondante : « il dira, en vous disant » ; elle introduit la parole qui suit.'
    reason: source_form
  - marker: b
    text: Ou « le mal ». Littéralement, « vous tous, ouvriers d’injustice ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐρεῖ λέγων ὑμῖν
  choice: il vous dira
  rationale: La construction grecque associe le futur de « dire » à un participe de même sens. En français, « il vous dira » en restitue naturellement la fonction sans produire une répétition maladroite.
- source_word: οἶδα
  choice: je ne sais pas
  rationale: Le sens premier est « savoir, connaître ». Cette formulation conserve la déclaration de non-connaissance sans l’interpréter explicitement comme un simple défaut de reconnaissance.
- source_word: πόθεν ἐστέ
  choice: d’où vous venez
  rationale: πόθεν indique l’origine. « D’où vous venez » est plus naturel en français courant que le calque « d’où vous êtes », tout en gardant le même sens.
- source_word: ἀπόστητε ἀπ’ ἐμοῦ
  choice: éloignez-vous de moi
  rationale: L’impératif exprime une séparation ferme. Cette formulation est claire, digne et directement compréhensible en français moderne.
- source_word: πάντες ἐργάται ἀδικίας
  choice: vous tous qui pratiquez l’injustice
  rationale: La tournure verbale française rend naturellement l’idée de personnes dont l’activité se caractérise par l’ἀδικία, tout en conservant l’adresse collective πάντες.
theological_decisions:
- issue: Sens de ἀδικίας dans cette parole de jugement
  choice: l’injustice
  alternative: le mal ; ce qui est injuste
  rationale: « Injustice » conserve le lien lexical avec l’absence de justice sans introduire la notion plus précise de transgression de la loi, qui correspondrait plus directement à un autre vocabulaire grec. La note signale une formulation française plus générale possible.
translation_notes:
  register: Français international moderne, naturel et solennel. « Éloignez-vous de moi » garde la force de l’ordre sans archaïsme, et « pratiquez l’injustice » rend idiomatiquement le groupe nominal grec.
