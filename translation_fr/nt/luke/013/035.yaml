id: LUK.13.35
reference: Luke 13:35
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἰδοὺ ἀφίεται ὑμῖν ὁ οἶκος ⸀ὑμῶν. λέγω ⸀δὲ ⸀ὑμῖν, οὐ μὴ ⸂ἴδητέ με⸃ ἕως ⸂ἥξει ὅτε⸃ εἴπητε· Εὐλογημένος ὁ ἐρχόμενος ἐν ὀνόματι κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/035.yaml
  text: Look[a], your house is left to you. And I tell you, you will certainly not see me until the time comes when you say[d][c][b], ‘Blessed is the one who comes in the name of the Lord.’
translation:
  language: fr
  text: 'Voici que votre maison[b] vous est laissée[a]. Et je vous le dis, vous ne me verrez certainement pas jusqu’à ce que vienne le moment où vous direz[d] : « Béni soit celui qui vient au nom du Seigneur ! »[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « est abandonnée » ou « est délaissée ». Le passif grec peut évoquer le fait d’être livré à l’abandon, notamment dans un contexte de jugement.
    reason: lexical_alternative
  - marker: b
    text: « Votre maison » désigne probablement Jérusalem, en particulier son temple, mais le grec dit simplement « votre maison ».
    reason: alternative_reading
  - marker: c
    text: La parole « Béni soit celui qui vient au nom du Seigneur » fait écho au Psaume 118.26.
    reason: cross_reference
  - marker: d
    text: Certains comprennent ces paroles comme une allusion à l’entrée triomphale de Jésus; d’autres comme l’annonce d’une reconnaissance future. Le grec n’impose pas à lui seul un moment précis.
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδοὺ
  choice: Voici
  rationale: Introduit avec solennité la déclaration qui suit tout en restant naturel en français moderne.
- source_word: ἀφίεται ὑμῖν
  choice: vous est laissée
  rationale: Conserve le présent passif et le datif du grec sans imposer dans le texte le sens plus marqué d’abandon; ce sens possible est signalé en note.
- source_word: ὁ οἶκος ὑμῶν
  choice: votre maison
  rationale: Reproduit l’expression grecque sans la réduire explicitement à Jérusalem ou au temple.
- source_word: λέγω δὲ ὑμῖν
  choice: Et je vous le dis
  rationale: Rend δέ comme une transition neutre et idiomatique; le pronom « le » donne à la formule une tournure française naturelle.
- source_word: οὐ μὴ ἴδητέ με
  choice: vous ne me verrez certainement plus
  rationale: « certainement » restitue la forte négation οὐ μή; « plus » exprime ici naturellement la cessation future de la vision dans le contexte, sans changer la portée temporelle.
- source_word: ἕως ἥξει ὅτε
  choice: jusqu’à ce que vienne le moment où
  rationale: Rend clairement en français l’expression temporelle grecque, dont un calque serait lourd.
- source_word: εἴπητε
  choice: vous direz
  rationale: Le futur est naturel en français après « le moment où » et explicite la visée future de l’aoriste subjonctif dans cette construction.
- source_word: Εὐλογημένος ὁ ἐρχόμενος
  choice: Béni soit celui qui vient
  rationale: Conserve la formule de bénédiction et son écho scripturaire, dans une formulation française consacrée mais encore intelligible.
- source_word: ἐν ὀνόματι κυρίου
  choice: au nom du Seigneur
  rationale: Formule biblique française naturelle qui préserve la référence au Seigneur.
theological_decisions:
- issue: Référent de « votre maison »
  choice: Maintien de « votre maison » dans le texte principal
  alternative: Jérusalem, le temple, ou la maison d’Israël
  rationale: Le contexte suggère Jérusalem, particulièrement son temple, mais le grec dit seulement « votre maison »; la traduction préserve cette latitude.
- issue: Moment visé par la déclaration finale
  choice: Formulation temporelle ouverte, sans préciser l’événement
  alternative: L’entrée triomphale de Jésus, une reconnaissance future par Jérusalem ou Israël, ou une reconnaissance eschatologique
  rationale: Le grec ne tranche pas explicitement entre ces lectures; le texte principal ne doit donc pas imposer un scénario particulier.
translation_notes:
  register: Français international moderne, digne et accessible. « Voici » garde la solennité de l’annonce sans archaïsme excessif. La citation conserve une cadence biblique reconnaissable. Les notes maintiennent les ambiguïtés lexicale, référentielle et temporelle du grec.
