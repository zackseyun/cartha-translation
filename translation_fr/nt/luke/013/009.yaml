  text: κἂν μὲν ποιήσῃ καρπὸν ⸂εἰς τὸ μέλλον— εἰ δὲ μήγε,⸃ ἐκκόψεις αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/009.yaml
  text: And if it bears fruit in the future—well and good; but if not[a], you will cut it down.
translation:
  language: fr
  text: Et s’il porte du fruit à l’avenir… ; sinon[a], tu le couperas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « l’année prochaine ». Certaines traductions précisent ainsi le délai à partir du verset précédent, mais le grec dit plus littéralement « à l’avenir » ou « dans le temps à venir ».'
    reason: alternative_reading
lexical_decisions:
- source_word: κἂν μὲν
  choice: Peut-être
  rationale: La combinaison de καί et ἐάν introduit ici une éventualité conditionnelle, tandis que μέν prépare le contraste avec δέ. Dans cette phrase elliptique, « Peut-être » rend naturellement l’espoir conditionnel sans alourdir le français.
- source_word: ποιήσῃ καρπὸν
  choice: portera-t-il du fruit
  rationale: Avec καρπός, ποιέω signifie idiomatiquement « porter » ou « produire » du fruit. « Porter du fruit » conserve l’image agricole et constitue la tournure française habituelle.
- source_word: εἰς τὸ μέλλον
  choice: à l’avenir
  rationale: La locution désigne littéralement ce qui est à venir, sans préciser explicitement « l’année prochaine ». « À l’avenir » préserve cette indétermination temporelle.
- source_word: εἰ δὲ μήγε
  choice: sinon
  rationale: « Sinon » exprime avec concision le contraste introduit par δέ et la négation de la condition précédente.
- source_word: ἐκκόψεις αὐτήν
  choice: tu le couperas
  rationale: Dans le contexte horticole, ἐκκόπτω désigne l’action de couper ou d’abattre l’arbre. Le pronom français masculin « le » reprend naturellement « figuier » dans le contexte immédiat.
theological_decisions:
- issue: Portée temporelle du jugement différé dans la parabole
  choice: Conserver une indication générale avec « à l’avenir »
  alternative: Traduire « l’année prochaine » en explicitant le délai suggéré par le verset précédent
  rationale: Le grec de ce verset ne répète pas explicitement « cette année » et ne dit pas précisément « l’année prochaine ». La formulation retenue maintient donc à la fois le sursis, l’espoir de fruit et la possibilité persistante du jugement.
- issue: Caractère elliptique de la première conséquence
  choice: Ne pas ajouter « ce sera bien »
  alternative: Fournir une conséquence telle que « tant mieux » ou « ce sera bien »
  rationale: Le texte grec laisse la première branche en suspens après « s’il porte du fruit à l’avenir », puis énonce la conséquence négative. Garder cette légère ellipse préserve la tension et la forme du propos.
translation_notes:
  register: Français international moderne, simple et digne. La syntaxe reste naturelle tout en conservant l’ellipse et l’indétermination temporelle du grec.
