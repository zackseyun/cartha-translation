source:
  edition: SBLGNT
  text: καὶ ⸀ἀποκριθεὶς εἶπεν αὐτοῖς· Δοκεῖτε ὅτι οἱ Γαλιλαῖοι οὗτοι ἁμαρτωλοὶ παρὰ πάντας τοὺς Γαλιλαίους ἐγένοντο, ὅτι ⸀ταῦτα πεπόνθασιν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/002.yaml
  text: And answering, he said to them, “Do you think that these Galileans became sinners beyond all the Galileans, because they have suffered these things?”
translation:
  language: fr
  text: 'Il leur répondit : « Pensez-vous que ces Galiléens étaient de plus grands pécheurs que tous les autres Galiléens, parce qu’ils ont subi un tel sort ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: Il leur répondit
  rationale: Cette tournure grecque idiomatique signifie naturellement « répondre » en français ; reproduire les deux verbes donnerait une formulation inutilement lourde.
- source_word: ἁμαρτωλοὶ παρὰ πάντας τοὺς Γαλιλαίους
  choice: de plus grands pécheurs que tous les autres Galiléens
  rationale: παρά avec l’accusatif exprime ici une comparaison. « Tous les autres » rend explicite que les victimes appartenaient elles-mêmes au groupe des Galiléens.
- source_word: ἐγένοντο
  choice: étaient
  rationale: Avec un adjectif ou un substantif attribut, γίνομαι peut décrire l’état ou la qualité que quelqu’un manifeste ou s’avère avoir. « Sont devenus pécheurs » suggérerait à tort que l’événement les a transformés en pécheurs ; le contexte porte sur leur degré supposé de culpabilité.
- source_word: ταῦτα πεπόνθασιν
  choice: ils ont subi un tel sort
  rationale: Le parfait grec évoque ce qu’ils ont subi et ses conséquences présentes. L’expression française résume naturellement les faits tragiques mentionnés au verset précédent.
theological_decisions:
- issue: Lien supposé entre une mort tragique et un degré supérieur de péché
  choice: 'La question conserve explicitement le raisonnement causal que Jésus met en cause : ils auraient subi ce sort parce qu’ils auraient été plus pécheurs.'
  alternative: Formuler directement une négation ou parler de punition divine.
  rationale: Le verset est une question rhétorique ; il ne faut ni anticiper la réponse du verset suivant ni préciser au-delà du grec le rôle de Dieu dans la tragédie.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe interrogative reste claire à l’oral comme à l’écrit, sans calque pesant du participe grec.
