  text: Καὶ διεπορεύετο κατὰ πόλεις καὶ κώμας διδάσκων καὶ πορείαν ποιούμενος εἰς ⸀Ἱεροσόλυμα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/022.yaml
  text: And he was traveling through towns and villages[a], teaching and making his way toward Jerusalem.
translation:
  language: fr
  text: Il traversait des villes et des villages en enseignant, tout en faisant route vers Jérusalem[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « à Jérusalem ».'
    reason: Variante lexicale possible pour εἰς, qui peut marquer la destination.
lexical_decisions:
- source_word: διεπορεύετο
  choice: il traversait
  rationale: L’imparfait présente un déplacement en cours. « Traversait » rend le mouvement à travers plusieurs lieux sans le réduire à une action ponctuelle.
- source_word: κατὰ πόλεις καὶ κώμας
  choice: villes et villages
  rationale: Avec l’accusatif, κατά exprime ici un parcours à travers divers lieux, avec une nuance distributive. La distinction entre πόλεις et κώμας est conservée par « villes et villages ».
- source_word: διδάσκων
  choice: en enseignant
  rationale: Le participe présent décrit l’activité qui accompagne le déplacement. Cette formulation concise conserve la simultanéité.
- source_word: πορείαν ποιούμενος
  choice: tout en faisant route
  rationale: L’expression idiomatique désigne le fait de poursuivre un voyage. « Faire route » est naturel en français et suggère une progression orientée.
- source_word: εἰς Ἱεροσόλυμα
  choice: vers Jérusalem
  rationale: εἰς indique la direction ou la destination. Dans ce sommaire de voyage, « vers » met naturellement en valeur la progression en cours plutôt que l’arrivée immédiate.
- source_word: Ἱεροσόλυμα
  choice: Jérusalem
  rationale: Forme française usuelle du nom de lieu biblique.
theological_decisions:
- issue: Orientation narrative du voyage de Jésus vers Jérusalem
  choice: vers Jérusalem
  alternative: jusqu’à Jérusalem
  rationale: Le verset s’inscrit dans le récit lucanien du voyage et décrit une progression encore en cours. « Vers » maintient cette perspective sans nier que Jérusalem soit la destination.
translation_notes:
  register: Français international moderne, clair et digne. Le sujet implicite grec est rendu par « il », conformément au contexte. La tournure « tout en » relie naturellement l’enseignement et la progression vers Jérusalem sans effacer leur simultanéité.
