  text: ἀπεκρίθη ⸀δὲ αὐτῷ ὁ κύριος καὶ εἶπεν· Ὑποκριταί, ἕκαστος ὑμῶν τῷ σαββάτῳ οὐ λύει τὸν βοῦν αὐτοῦ ἢ τὸν ὄνον ἀπὸ τῆς φάτνης καὶ ⸀ἀπαγαγὼν ποτίζει;
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/015.yaml
  text: But the Lord answered him and said[a], “Hypocrites! Does not each of you on the Sabbath untie his ox or donkey from the feeding trough and lead it away to water it?”
translation:
  language: fr
  text: 'Mais le Seigneur lui répondit : « Hypocrites ! Le jour du sabbat, chacun de vous ne détache-t-il pas son bœuf ou son âne de la mangeoire[a] et ne l’emmène-t-il pas pour lui donner à boire ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « du lieu où il se nourrit ». Le grec peut désigner une mangeoire ou, plus largement, un lieu d’alimentation pour les animaux.
    reason: alternative lexicale
lexical_decisions:
- source_word: κύριος
  choice: le Seigneur
  rationale: Conserve le titre narratif que Luc applique à Jésus et sa portée christologique, sans l’affaiblir en « maître ».
- source_word: Ὑποκριταί
  choice: Hypocrites !
  rationale: Le vocatif pluriel constitue une réprimande directe et vive ; le français reprend naturellement cette force.
- source_word: ἕκαστος ὑμῶν
  choice: chacun de vous
  rationale: Préserve exactement la valeur distributive de l’expression grecque.
- source_word: τῷ σαββάτῳ
  choice: le jour du sabbat
  rationale: Expression temporelle claire et naturelle en français moderne.
- source_word: λύει
  choice: détache
  rationale: Dans le contexte d’un animal attaché près de son lieu d’alimentation, « détacher » est plus idiomatique que « délier ».
- source_word: βοῦν
  choice: bœuf
  rationale: Équivalent traditionnel et contextuellement approprié pour un bovin employé comme animal domestique.
- source_word: ὄνον
  choice: âne
  rationale: Équivalent français moderne, courant et précis.
- source_word: φάτνης
  choice: mangeoire
  rationale: Désigne naturellement en français le récipient ou lieu où mange l’animal, tout en conservant l’image concrète.
- source_word: ἀπαγαγὼν
  choice: pour le mener
  rationale: Intègre naturellement le participe grec à la question et exprime le déplacement de l’animal vers l’eau.
- source_word: ποτίζει
  choice: boire
  rationale: La tournure idiomatique « mener un animal boire » exprime de façon concise l’action de lui procurer à boire.
theological_decisions:
- issue: Titre narratif κύριος appliqué à Jésus
  choice: le Seigneur
  alternative: le maître
  rationale: « Le Seigneur » respecte l’usage narratif de Luc et la portée possible du titre, sans imposer une explicitation absente du grec.
translation_notes:
  register: Français international moderne, digne et accessible. La question rhétorique et la vigueur de la réprimande sont conservées. « Pour le mener boire » rend de manière naturelle la séquence du participe ἀπαγαγών suivi de ποτίζει.
