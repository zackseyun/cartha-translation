id: LUK.13.31
reference: Luke 13:31
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἐν αὐτῇ τῇ ⸀ὥρᾳ προσῆλθάν τινες Φαρισαῖοι λέγοντες αὐτῷ· Ἔξελθε καὶ πορεύου ἐντεῦθεν, ὅτι Ἡρῴδης θέλει σε ἀποκτεῖναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/031.yaml
  text: At that very hour some Pharisees came up and said to him[a], “Leave and go away from here[b], because Herod wants to kill you.”
translation:
  language: fr
  text: 'À cette heure même[a], quelques pharisiens s’approchèrent et lui dirent : « Pars et va-t’en d’ici[b], car Hérode veut te tuer. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « À cette même heure ».
    reason: lexical_alternative
  - marker: b
    text: Ou « Pars et éloigne-toi d’ici ».
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν αὐτῇ τῇ ὥρᾳ
  choice: À cette heure même
  rationale: Cette formulation naturelle conserve l’indication temporelle précise et la valeur emphatique de αὐτῇ.
- source_word: προσῆλθάν
  choice: s’approchèrent
  rationale: Le verbe exprime le mouvement vers Jésus; « s’approchèrent » le rend clairement sans ajouter de nuance.
- source_word: τινες Φαρισαῖοι
  choice: quelques pharisiens
  rationale: τινες désigne un groupe indéfini. « Quelques » est idiomatique en français moderne et ne précise pas leur identité.
- source_word: λέγοντες αὐτῷ
  choice: et lui dirent
  rationale: Le participe contemporain du verbe principal est rendu par un second verbe coordonné, tournure fluide en français narratif.
- source_word: Ἔξελθε καὶ πορεύου ἐντεῦθεν
  choice: Pars et va-t’en d’ici
  rationale: Les deux impératifs sont conservés. La formulation exprime directement le départ exigé, dans un français actuel, tout en évitant le ton excessivement brusque de « Dégage ».
- source_word: ὅτι
  choice: car
  rationale: La conjonction introduit la raison donnée à l’ordre. « Car » convient naturellement au discours direct et au registre digne du récit.
- source_word: Ἡρῴδης
  choice: Hérode
  rationale: Forme française traditionnelle et courante du nom propre.
- source_word: θέλει
  choice: veut
  rationale: Le verbe exprime ici la volonté ou le désir; « veut » en conserve le sens direct sans renforcer indûment l’idée de projet arrêté.
- source_word: ἀποκτεῖναι
  choice: te tuer
  rationale: L’infinitif signifie tuer. Cette traduction directe n’implique pas nécessairement une exécution judiciaire.
theological_decisions:
- issue: Motif des pharisiens qui avertissent Jésus
  choice: Présenter leurs paroles comme un avertissement, sans préciser leur intention.
  alternative: Les décrire comme sincèrement soucieux de Jésus, ou comme cherchant à l’intimider pour le faire partir.
  rationale: Le texte rapporte leur démarche et leurs paroles, mais ne révèle pas explicitement leur motivation. La traduction maintient cette ouverture narrative.
translation_notes:
  register: Français international moderne, clair et digne. « Pharisiens » prend une minuscule conformément à l’usage typographique français pour les membres d’un groupe religieux. Les deux impératifs grecs sont maintenus sans rendre la réplique artificiellement littérale.
