  text: ⸀Καὶ πάλιν εἶπεν· Τίνι ὁμοιώσω τὴν βασιλείαν τοῦ θεοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/020.yaml
  text: And again he said, “To what shall I compare the kingdom of God?”
translation:
  language: fr
  text: 'Et il dit encore : « À quoi comparerai-je le royaume de Dieu ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: Puis
  rationale: Dans l’enchaînement narratif français, « Puis » relie naturellement cette nouvelle parole à la précédente, sans alourdir la phrase par un « Et » peu idiomatique.
- source_word: πάλιν
  choice: encore
  rationale: L’adverbe marque la répétition et se rend naturellement ici par « encore ».
- source_word: εἶπεν
  choice: il dit
  rationale: L’aoriste narratif de λέγω introduit directement la parole ; « il dit » est simple, actuel et digne.
- source_word: Τίνι
  choice: À quoi
  rationale: Le datif interrogatif neutre demande le terme de comparaison, et non une personne ; « À quoi » convient à la construction française avec « comparer ».
- source_word: ὁμοιώσω
  choice: comparerai-je
  rationale: Le futur actif à la première personne a ici une valeur délibérative. Le futur français conserve cette forme rhétorique de manière naturelle.
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: le royaume de Dieu
  rationale: Cette formulation consacrée conserve la largeur sémantique de βασιλεία, qui peut évoquer à la fois la royauté, le règne et le domaine où elle s’exerce.
theological_decisions:
- issue: Traduction de βασιλεία dans une parole concernant l’autorité royale de Dieu
  choice: le royaume de Dieu
  alternative: le règne de Dieu
  rationale: « Royaume de Dieu » préserve l’expression biblique reconnue et ne réduit pas βασιλεία au seul exercice dynamique de l’autorité, tout en laissant cette dimension présente.
translation_notes:
  register: Français international moderne, clair et digne. L’inversion « comparerai-je » maintient le caractère rhétorique de la question sans paraître archaïque. Aucun appel de note n’est nécessaire.
