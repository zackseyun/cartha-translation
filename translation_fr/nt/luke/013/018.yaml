id: LUK.13.18
reference: Luke 13:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἔλεγεν ⸀οὖν· Τίνι ὁμοία ἐστὶν ἡ βασιλεία τοῦ θεοῦ, καὶ τίνι ὁμοιώσω αὐτήν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/018.yaml
  text: So he was saying[a], “What is the kingdom of God like, and to what shall I compare it?”
translation:
  language: fr
  text: 'Il disait donc : « À quoi le royaume de Dieu[a] ressemble-t-il, et à quoi le comparerai-je ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le règne de Dieu », pour souligner l’exercice de la souveraineté de Dieu plutôt qu’un domaine.
    reason: Alternative lexicale préservant l’étendue sémantique de βασιλεία.
lexical_decisions:
- source_word: Ἔλεγεν
  choice: Il disait
  rationale: L’imparfait grec présente la parole dans son déroulement ou comme une reprise du discours; l’imparfait français en conserve naturellement l’aspect.
- source_word: οὖν
  choice: donc
  rationale: Le connecteur marque la continuité ou la conséquence par rapport au contexte précédent; « donc » en garde la force sans lourdeur.
- source_word: Τίνι ὁμοία ἐστὶν
  choice: À quoi ... ressemble-t-il
  rationale: Cette formulation idiomatique exprime directement la question comparative du grec.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: le royaume de Dieu
  rationale: Expression biblique consacrée et intelligible, qui conserve le champ métaphorique du royaume sans exclure le sens dynamique de la souveraineté exercée par Dieu.
- source_word: καὶ
  choice: et
  rationale: La conjonction coordonne simplement les deux questions parallèles.
- source_word: τίνι ὁμοιώσω αὐτήν
  choice: à quoi le comparerai-je
  rationale: Le futur français rend le futur grec à valeur délibérative et conserve la force rhétorique de la question.
theological_decisions:
- issue: Traduction de βασιλεία τοῦ θεοῦ
  choice: le royaume de Dieu
  alternative: le règne de Dieu
  rationale: Le grec peut évoquer à la fois le domaine royal et l’exercice de la royauté divine. « Royaume de Dieu » maintient l’expression biblique établie et son image, tandis qu’une note signale le sens dynamique possible.
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme des deux questions est conservé; l’imparfait narratif et le futur délibératif reflètent les formes grecques sans archaïsme.
