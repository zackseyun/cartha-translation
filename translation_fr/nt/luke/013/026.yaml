source:
  edition: SBLGNT
  text: τότε ἄρξεσθε λέγειν· Ἐφάγομεν ἐνώπιόν σου καὶ ἐπίομεν, καὶ ἐν ταῖς πλατείαις ἡμῶν ἐδίδαξας·
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/026.yaml
  text: Then you will begin to say[a], ‘We ate and drank in your presence, and you taught in our streets.’
translation:
  language: fr
  text: 'Alors vous commencerez à dire : « Nous avons mangé et bu en ta présence, et tu as enseigné dans nos rues[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sur nos places publiques »; le mot grec peut désigner de larges rues ou des espaces publics ouverts dans une ville.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Alors
  rationale: Marque naturellement la succession dans le discours et convient au français courant.
- source_word: ἄρξεσθε λέγειν
  choice: vous commencerez à dire
  rationale: Rend explicitement la valeur ingressive de ἄρχομαι suivi de l’infinitif, sans la réduire à un simple « vous direz ».
- source_word: Ἐφάγομεν … καὶ ἐπίομεν
  choice: Nous avons mangé et bu
  rationale: Le passé composé est la forme naturelle en français moderne pour évoquer ces faits passés dans un discours direct.
- source_word: ἐνώπιόν σου
  choice: en ta présence
  rationale: Exprime la proximité et l’association invoquées par les locuteurs sans suggérer que le maître reconnaît une véritable communion avec eux.
- source_word: ἐν ταῖς πλατείαις ἡμῶν
  choice: dans nos rues
  rationale: Traduction naturelle de πλατεῖαι, qui peut désigner les rues larges ou les espaces publics d’une ville; elle préserve le cadre public et local sans préciser excessivement « places publiques ».
- source_word: ἐδίδαξας
  choice: tu as enseigné
  rationale: Le passé composé rend naturellement l’aoriste comme un fait historique accompli dans le discours direct.
theological_decisions:
- issue: Nature de l’argument avancé par les locuteurs
  choice: Conserver leur revendication d’une proximité extérieure avec Jésus sans laisser entendre une relation salvatrice reconnue par lui.
  alternative: Une formulation plus libre pourrait suggérer une communion acceptée ou une reconnaissance d’alliance.
  rationale: Le grec affirme qu’ils ont mangé et bu en sa présence et qu’il a enseigné dans leurs rues; il ne dit pas qu’il les reconnaît. La traduction maintient cette tension.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement correspond au discours direct adressé à une seule personne. La ponctuation française et le passé composé assurent une lecture fluide tout en restant proches de la structure grecque.
