source:
  edition: SBLGNT
  text: καὶ ἰδοὺ εἰσὶν ἔσχατοι οἳ ἔσονται πρῶτοι, καὶ εἰσὶν πρῶτοι οἳ ἔσονται ἔσχατοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/030.yaml
  text: And behold[a], there are last who will be first, and there are first who will be last.
translation:
  language: fr
  text: 'Et voici : il y a des derniers qui seront premiers, et des premiers qui seront derniers.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: voici
  rationale: « Voici » conserve la fonction d'attirer l'attention tout en restant digne et naturel en français biblique moderne; « regardez » serait plus concret que ne l'exige ici l'interjection.
- source_word: ἔσχατοι
  choice: les derniers
  rationale: Ce choix préserve la position ou le rang évoqué et maintient l'antithèse concise avec « les premiers », sans réduire le terme à une moindre valeur morale.
- source_word: πρῶτοι
  choice: les premiers
  rationale: Équivalent direct et idiomatique de πρῶτοι, en opposition symétrique avec « les derniers ».
- source_word: οἳ ἔσονται
  choice: seront
  rationale: Le futur français rend directement la proposition relative grecque; la relation est exprimée naturellement par « certains parmi… ».
- source_word: εἰσὶν
  choice: certains parmi
  rationale: Cette formulation rend la valeur existentielle de « il y en a » sans produire le tour peu naturel « il y a des derniers » et sans affirmer que tous les membres de chaque catégorie sont visés.
- source_word: καὶ
  choice: et
  rationale: Le coordonnant est conservé afin de maintenir le parallélisme équilibré de la sentence.
theological_decisions:
- issue: Portée du renversement annoncé
  choice: Formulation générale d'un renversement entre derniers et premiers, sans identifier les groupes concernés.
  alternative: Préciser qu'il s'agit des non-Juifs et des Juifs, des humbles et des orgueilleux, ou de rangs lors du jugement final.
  rationale: Le contexte concerne l'entrée dans le royaume, mais la formulation grecque reste générale et peut porter plusieurs dimensions. La traduction ne doit pas imposer une interprétation particulière.
translation_notes:
  register: Français international moderne, concis et digne. La structure en miroir est conservée. « Certains parmi » évite une substantivation abrupte tout en préservant le caractère non universel de l'énoncé existentiel.
