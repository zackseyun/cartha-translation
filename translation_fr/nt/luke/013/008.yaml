id: LUK.13.8
reference: Luke 13:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς λέγει αὐτῷ· Κύριε, ἄφες αὐτὴν καὶ τοῦτο τὸ ἔτος, ἕως ὅτου σκάψω περὶ αὐτὴν καὶ βάλω κόπρια·
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/008.yaml
  text: But he answered and said to him[a], ‘Lord, leave it alone this year also[b], until I dig around it and put manure on it.’
translation:
  language: fr
  text: 'Mais il lui répondit : « Seigneur, laisse-le encore cette année[a], le temps que je creuse tout autour et que j’y mette du fumier[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « épargne-le encore cette année » ou « laisse-le en place encore cette année ».
    reason: lexical_alternative
  - marker: b
    text: 'Plus généralement : « que je le fertilise » ou « que je mette de l’engrais ». Le grec parle concrètement de fumier.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς λέγει αὐτῷ
  choice: il lui répondit
  rationale: La tournure grecque, littéralement « ayant répondu, il lui dit », est une formule narrative. « Il lui répondit » en exprime naturellement les deux éléments en français moderne.
- source_word: Κύριε
  choice: Seigneur
  rationale: Le vocatif est un titre respectueux adressé au propriétaire dans la parabole. « Seigneur » conserve la correspondance habituelle avec κύριος, sans faire de ce personnage une identification théologique explicite.
- source_word: ἄφες αὐτὴν
  choice: laisse-le
  rationale: ἀφίημι signifie ici laisser le figuier en place et ne pas l’abattre. Le masculin français renvoie à « figuier », malgré le féminin grammatical du nom grec sous-entendu συκῆ.
- source_word: καὶ τοῦτο τὸ ἔτος
  choice: encore cette année
  rationale: Cette formulation française exprime clairement l’année supplémentaire demandée tout en restant proche de « cette année aussi ».
- source_word: ἕως ὅτου
  choice: le temps que
  rationale: Dans ce contexte, la locution délimite le délai nécessaire aux soins annoncés. « Le temps que » est plus naturel en français que le calque « jusqu’à ce que » avec deux actions ponctuelles.
- source_word: σκάψω περὶ αὐτὴν
  choice: je creuse tout autour
  rationale: La traduction garde l’image concrète de l’action de creuser autour du figuier, sans expliciter son but agronomique.
- source_word: βάλω κόπρια
  choice: j’y mette du fumier
  rationale: κόπρια désigne du fumier employé comme engrais. « Mettre du fumier » conserve l’image concrète du grec; « y » indique naturellement l’endroit autour du figuier.
theological_decisions:
- issue: Valeur de κύριος dans l’adresse interne à la parabole
  choice: Seigneur
  alternative: Maître ; monsieur
  rationale: Le terme peut n’être ici qu’une marque de respect envers le propriétaire. « Seigneur » préserve toutefois la portée lexicale de κύριος et l’éventuelle résonance du récit, sans imposer que le propriétaire soit directement identifié à Dieu.
- issue: Portée de ἄφες dans la demande du vigneron
  choice: laisse-le
  alternative: épargne-le
  rationale: « Épargne-le » rend explicite le sursis par rapport à l’ordre d’abattre, mais « laisse-le » conserve davantage l’expression ouverte du verbe grec tout en restant intelligible dans le contexte.
translation_notes:
  register: Français international moderne, naturel et digne. Le discours direct reste simple et concret, conformément au registre agricole de la parabole. Le pronom masculin « le » suit le genre français de « figuier », sous-entendu dans ce verset.
