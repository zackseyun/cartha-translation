id: LUK.13.11
reference: Luke 13:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ⸀γυνὴ πνεῦμα ἔχουσα ἀσθενείας ἔτη ⸀δεκαοκτώ, καὶ ἦν συγκύπτουσα καὶ μὴ δυναμένη ἀνακύψαι εἰς τὸ παντελές.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/011.yaml
  text: And behold[a], there was a woman who had a spirit of infirmity for eighteen years, and she was bent over and unable to straighten up completely.
translation:
  language: fr
  text: Et voici qu’il y avait une femme qui avait un esprit de faiblesse depuis dix-huit ans. Elle était courbée et ne pouvait pas se redresser complètement.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: voici
  rationale: Interjection narrative naturelle et digne en français, qui attire l’attention sans l’archaïsme plus marqué de « voici que » employé seul; la construction « Et voici que » restitue la vivacité du grec.
- source_word: γυνὴ
  choice: une femme
  rationale: Le personnage est introduit pour la première fois; l’indéfini convient au contexte.
- source_word: πνεῦμα ἔχουσα ἀσθενείας
  choice: avait un esprit qui la rendait infirme
  rationale: Cette formulation conserve la mention explicite d’un esprit tout en exprimant naturellement le génitif de caractérisation ou d’effet, sans préciser davantage la nature de cet esprit.
- source_word: ἔτη δεκαοκτώ
  choice: depuis dix-huit ans
  rationale: Le français emploie naturellement « depuis » pour un état commencé dans le passé et toujours présent au moment du récit.
- source_word: συγκύπτουσα
  choice: était courbée
  rationale: Rend clairement et sobrement la posture physique durable décrite par le participe.
- source_word: μὴ δυναμένη ἀνακύψαι
  choice: ne pouvait pas se redresser
  rationale: Expression française idiomatique qui restitue l’incapacité de revenir à une posture droite.
- source_word: εἰς τὸ παντελές
  choice: absolument pas
  rationale: Dans cette construction négative, la locution renforce l’incapacité totale; « absolument pas » est naturel et évite l’ambiguïté possible de « complètement » quant au degré de redressement.
theological_decisions:
- issue: La nature de πνεῦμα ἀσθενείας et le degré d’agence spirituelle exprimé
  choice: Conserver explicitement « un esprit » et rendre son effet par « qui la rendait infirme »
  alternative: « un esprit d’infirmité »; « un esprit de faiblesse »
  rationale: Le grec mentionne explicitement πνεῦμα; il ne faut donc pas réduire l’affection à un diagnostic purement médical. La formulation retenue préserve l’agence spirituelle possible sans identifier explicitement cet esprit comme un démon ni affirmer une possession.
translation_notes:
  register: Français international moderne, narratif et digne. « Et voici qu’il y avait là » garde l’effet d’introduction vive de καὶ ἰδοὺ. La phrase est divisée en deux pour une lecture fluide, sans perdre les coordinations ni la progression du grec.
