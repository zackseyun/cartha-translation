review_pass:
  verdict: revise
  source_fidelity: 'La formulation « absolument pas se redresser » transforme εἰς τὸ παντελές en impossibilité de se redresser à quelque degré que ce soit. La locution grecque intensifie plutôt le redressement : elle ne pouvait pas se redresser complètement. Le génitif πνεῦμα ἀσθενείας est mieux conservé en français par « un esprit de faiblesse », sans expliciter dans le texte principal un lien causal que le grec laisse formulé de manière plus compacte.'
  naturalness: Le français révisé est naturel, moderne et narratif. « Et voici qu’il y avait une femme » restitue l’appel d’attention de καὶ ἰδού sans l’ajout facultatif « là ». « Se redresser complètement » est idiomatique et rend exactement la portée de l’intensif grec.
  terminology: « Esprit de faiblesse » conserve πνεῦμα et le sens large d’ἀσθένεια. La note maintient « esprit d’infirmité » comme option lexicale, sans qualifier l’esprit de démon ni trancher la nature de l’agence évoquée.
  issues:
  - severity: medium
    issue: « ne pouvait absolument pas se redresser »
    rationale: 'Cette expression signifie normalement qu’elle ne pouvait pas se redresser du tout, tandis que εἰς τὸ παντελές porte sur l’achèvement ou la plénitude du redressement : elle ne pouvait pas se redresser complètement.'
  - severity: low
    issue: « un esprit qui la rendait infirme »
    rationale: La relative causale explicite davantage la relation entre l’esprit et l’affection que le génitif grec. « Un esprit de faiblesse » préserve plus directement la construction et son ambiguïté.
  revised_text: Et voici qu’il y avait une femme qui avait un esprit de faiblesse depuis dix-huit ans. Elle était courbée et ne pouvait pas se redresser complètement.
  revised_footnotes:
  - marker: a
    text: 'Autre traduction : « un esprit d’infirmité ». Le grec mentionne explicitement un « esprit », ce qui peut indiquer une action spirituelle dans son état.'
    reason: lexical_alternative
  revision_rationale: La révision corrige la portée de εἰς τὸ παντελές et rend plus directement le génitif πνεῦμα ἀσθενείας, tout en préservant l’ambiguïté du texte quant à la nature de l’esprit. L’ancre de note demeure attachée à « esprit de faiblesse ».
