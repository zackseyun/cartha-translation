revisions:
- from: Et voici qu’il y avait là une femme qui, depuis dix-huit ans, avait un esprit qui la rendait infirme[a]. Elle était courbée et ne pouvait absolument pas se redresser.
  to: Et voici qu’il y avait une femme qui avait un esprit de faiblesse depuis dix-huit ans. Elle était courbée et ne pouvait pas se redresser complètement.
  rationale: La révision corrige la portée de εἰς τὸ παντελές et rend plus directement le génitif πνεῦμα ἀσθενείας, tout en préservant l’ambiguïté du texte quant à la nature de l’esprit. L’ancre de note demeure attachée à « esprit de faiblesse ».
