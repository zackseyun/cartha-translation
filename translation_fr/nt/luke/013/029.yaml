id: LUK.13.29
reference: Luke 13:29
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἥξουσιν ἀπὸ ἀνατολῶν καὶ δυσμῶν καὶ ⸀ἀπὸ βορρᾶ καὶ νότου καὶ ἀνακλιθήσονται ἐν τῇ βασιλείᾳ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/029.yaml
  text: And they will come from east and west[a], and from north and south, and will recline at table in the kingdom of God.
translation:
  language: fr
  text: Et l’on viendra de l’est et de l’ouest, du nord et du sud, et l’on prendra place à table dans le royaume de Dieu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « l’on s’allongera ». Dans l’Antiquité, on prenait les repas de fête allongé à table.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἥξουσιν
  choice: l’on viendra
  rationale: Le futur de ἥκω exprime ici le fait de venir ou d’arriver. La tournure française « l’on viendra » est naturelle avec l’énumération des quatre points cardinaux et conserve le sujet humain indéfini du grec.
- source_word: ἀπὸ ἀνατολῶν καὶ δυσμῶν
  choice: de l’est et de l’ouest
  rationale: Les pluriels grecs, littéralement liés aux levers et aux couchers du soleil, désignent idiomatiquement les directions de l’est et de l’ouest.
- source_word: ἀπὸ βορρᾶ καὶ νότου
  choice: du nord et du sud
  rationale: Ces termes complètent naturellement l’évocation des quatre points cardinaux. La seconde préposition ἀπό est rendue sans répéter « de » devant chaque direction.
- source_word: ἀνακλιθήσονται
  choice: l’on prendra place à table
  rationale: Dans le contexte d’un banquet, ἀνακλίνω désigne le fait de s’allonger ou de s’installer pour manger. « Prendre place à table » restitue clairement la scène du repas en français moderne sans suggérer artificiellement la posture antique.
- source_word: ἐν τῇ βασιλείᾳ τοῦ θεοῦ
  choice: dans le royaume de Dieu
  rationale: Cette formulation française courante et transparente conserve la portée théologique et eschatologique de βασιλεία τοῦ θεοῦ sans la paraphraser.
theological_decisions:
- issue: Image du banquet dans le royaume eschatologique
  choice: Conserver explicitement l’image du repas par « prendre place à table ».
  alternative: « s’assiéra » ou simplement « entrera » dans le royaume de Dieu
  rationale: Le verbe grec évoque concrètement la participation à un banquet. La traduction garde cette image sans ajouter de précision doctrinale absente du verset.
- issue: Portée géographique universelle
  choice: Rendre directement les quatre points cardinaux sans identifier les personnes concernées.
  alternative: Préciser qu’il s’agit des non-Juifs ou des gens de toutes les nations.
  rationale: Le texte présente un rassemblement venu de toutes les directions, mais ne nomme explicitement ici ni les non-Juifs ni des groupes ethniques déterminés.
translation_notes:
  register: Français international moderne, naturel et digne. « L’on » évite un « ils » sans antécédent immédiat dans ce verset isolé et s’accorde avec la portée générale de la scène. « Prendre place à table » communique l’image du banquet plus naturellement que « s’allonger à table », tandis que la note conserve la précision culturelle du grec.
