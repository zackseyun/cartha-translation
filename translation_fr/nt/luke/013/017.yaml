id: LUK.13.17
reference: Luke 13:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ταῦτα λέγοντος αὐτοῦ κατῃσχύνοντο πάντες οἱ ἀντικείμενοι αὐτῷ, καὶ πᾶς ὁ ὄχλος ἔχαιρεν ἐπὶ πᾶσιν τοῖς ἐνδόξοις τοῖς γινομένοις ὑπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/017.yaml
  text: And as he was saying these things[a], all who were opposing him were put to shame[b], and the whole crowd was rejoicing over all the glorious things being done by him.
translation:
  language: fr
  text: Pendant qu’il disait cela, tous ceux qui s’opposaient à lui étaient couverts de honte[a], tandis que toute la foule se réjouissait de tout ce qu’il accomplissait de glorieux[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « étaient humiliés » ou « avaient honte ».
    reason: lexical_alternative
  - marker: b
    text: Ou « tout ce qu’il accomplissait de merveilleux » ou « de splendide ». Le grec emploie un terme large qui peut inclure ses actes puissants.
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα λέγοντος αὐτοῦ
  choice: Pendant qu’il disait cela
  rationale: Le génitif absolu au participe présent exprime une action contemporaine; « pendant que » en conserve clairement la durée.
- source_word: οἱ ἀντικείμενοι αὐτῷ
  choice: ceux qui s’opposaient à lui
  rationale: Cette formulation garde la force verbale et l’aspect continu du participe, plutôt que de réduire l’expression au nom « adversaires ».
- source_word: κατῃσχύνοντο
  choice: se trouvaient couverts de honte
  rationale: L’expression rend l’état durable suggéré par l’imparfait ainsi que la honte publique subie, sans se limiter au sentiment intérieur d’avoir honte.
- source_word: πᾶς ὁ ὄχλος
  choice: toute la foule
  rationale: Formulation française naturelle qui conserve la portée collective de l’expression grecque.
- source_word: ἔχαιρεν
  choice: se réjouissait
  rationale: L’imparfait français reflète la joie continue exprimée par l’imparfait grec.
- source_word: ἐπὶ πᾶσιν τοῖς ἐνδόξοις
  choice: de tout ce […] de glorieux
  rationale: « Se réjouir de » rend naturellement ἐπί avec le datif; la tournure conserve la portée large de ἔνδοξος sans préciser qu’il s’agit uniquement de miracles.
- source_word: τοῖς γινομένοις ὑπ’ αὐτοῦ
  choice: qu’il accomplissait
  rationale: La construction active est idiomatique en français et attribue directement à Jésus l’accomplissement de ces actes, conformément à ὑπό avec le génitif.
theological_decisions:
- issue: Nature de ce qui est qualifié d’ἔνδοξος
  choice: tout ce qu’il accomplissait de glorieux
  alternative: tous les miracles qu’il accomplissait; toutes les choses merveilleuses qu’il faisait
  rationale: Le contexte comprend une guérison, mais ἔνδοξος signifie plus largement « glorieux », « splendide » ou « remarquable ». La traduction retenue ne limite donc pas l’expression aux seuls miracles.
- issue: Agent des actes dans ὑπ’ αὐτοῦ
  choice: qu’il accomplissait
  alternative: qui s’accomplissait par lui
  rationale: Ὑπό avec le génitif désigne normalement l’agent. La formulation retenue attribue sans détour ces actes à Jésus, sans introduire une nuance instrumentale indirecte.
translation_notes:
  register: Français international moderne, naturel et digne. « Pendant que », « toute la foule » et « se réjouissait » sont immédiatement compréhensibles. La tournure « tout ce qu’il accomplissait de glorieux » reste élevée sans être archaïque et préserve la largeur sémantique du grec.
