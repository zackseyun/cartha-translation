source:
  edition: SBLGNT
  text: ἢ ἐκεῖνοι οἱ ⸀δεκαοκτὼ ἐφ’ οὓς ἔπεσεν ὁ πύργος ἐν τῷ Σιλωὰμ καὶ ἀπέκτεινεν αὐτούς, δοκεῖτε ὅτι ⸀αὐτοὶ ὀφειλέται ἐγένοντο παρὰ πάντας ⸀τοὺς ἀνθρώπους τοὺς ⸀κατοικοῦντας Ἰερουσαλήμ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/004.yaml
  text: Or those eighteen on whom the tower in Siloam fell and killed them—do you think that they became debtors beyond all the men living in Jerusalem?[a][b]
translation:
  language: fr
  text: Ou bien ces dix-huit personnes sur lesquelles la tour de Siloé est tombée et qu’elle a tuées, pensez-vous qu’elles étaient plus coupables que tous les autres habitants de Jérusalem ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « débiteurs ». Le terme grec peut désigner ici des personnes ayant une dette morale, donc coupables devant Dieu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ
  choice: Ou bien
  rationale: Introduit naturellement en français un second exemple dans la suite de l’argumentation.
- source_word: ἐκεῖνοι οἱ δεκαοκτώ
  choice: ces dix-huit personnes
  rationale: Le grec ne précise pas le sexe des victimes. « Personnes » permet de substantiver le nombre clairement et sans ajouter une restriction masculine.
- source_word: ἔπεσεν ὁ πύργος ἐν τῷ Σιλωὰμ
  choice: la tour de Siloé est tombée
  rationale: Conserve le verbe concret « tomber » plutôt que l’interprétation « s’effondrer »; « Siloé » est la forme française traditionnelle du toponyme.
- source_word: ἀπέκτεινεν αὐτούς
  choice: qu’elle a tuées
  rationale: Le pronom reprend explicitement la tour, sujet grammatical du verbe grec, tout en donnant une phrase française fluide.
- source_word: δοκεῖτε ὅτι
  choice: pensez-vous que
  rationale: Rend directement la question rhétorique adressée aux auditeurs.
- source_word: ὀφειλέται
  choice: coupables
  rationale: Dans ce contexte comparatif et moral, « coupables » communique naturellement l’idée de personnes redevables ou passibles d’une dette morale; une note conserve la métaphore littérale.
- source_word: ἐγένοντο
  choice: étaient
  rationale: Dans cette tournure comparative, le français idiomatique emploie « étaient »; traduire mécaniquement par « étaient devenues » risquerait de faire croire que l’accident avait créé leur culpabilité.
- source_word: παρὰ πάντας τοὺς ἀνθρώπους τοὺς κατοικοῦντας Ἰερουσαλήμ
  choice: que tous les autres habitants de Jérusalem
  rationale: « Que » exprime la comparaison marquée par παρά; « habitants » rend de façon concise et inclusive ἀνθρώπους τοὺς κατοικοῦντας, tandis que « autres » explicite la comparaison entre les victimes et le reste des résidents.
theological_decisions:
- issue: Portée morale de ὀφειλέται
  choice: plus coupables
  alternative: davantage débiteurs / plus redevables
  rationale: Le contexte porte sur la culpabilité supposée des victimes devant Dieu. « Coupables » est intelligible en français moderne, tandis que la note maintient visible l’image grecque de la dette morale sans la transformer en dette financière.
- issue: Lien entre l’accident et la culpabilité dans ἐγένοντο
  choice: elles étaient plus coupables
  alternative: elles étaient devenues plus coupables
  rationale: La question compare leur culpabilité supposée à celle des autres habitants; elle n’affirme pas que leur mort les aurait rendues coupables. La formulation choisie évite cette fausse implication tout en préservant la question de Jésus.
- issue: Référence humaine de ἀνθρώπους
  choice: habitants
  alternative: hommes
  rationale: Le groupe visé comprend collectivement les personnes résidant à Jérusalem, sans indication qu’il soit exclusivement masculin. « Habitants » respecte cette portée générique.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase conserve la forme interrogative et le caractère brutal de l’accident, tout en évitant le calque peu intelligible « débiteurs plus que ». Le féminin pluriel des pronoms et participes s’accorde avec « personnes ».
