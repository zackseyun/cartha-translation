  source_fidelity: 'Le sens général est fidèle : la comparaison avec le levain, l’action de la femme, les trois mesures de farine et l’aboutissement de l’action sont conservés. Toutefois, « toute la pâte ait levé » rend surtout la levée de la pâte, alors que le passif ἐζυμώθη exprime plus précisément que toute la masse a été fermentée/levée par le levain. « toute la masse ait levé » garde l’idiome français tout en représentant mieux ὅλον.'
  naturalness: « Il est semblable à » est une formulation française plus complète et plus proche de la structure comparative du grec que « Il ressemble à », sans perdre la fluidité. « Toute la masse ait levé » est naturel dans le contexte de la panification.
