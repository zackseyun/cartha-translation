  variant: modern international French
source:
  edition: SBLGNT
  text: ὁμοία ἐστὶν ζύμῃ, ἣν λαβοῦσα γυνὴ ⸀ἔκρυψεν εἰς ἀλεύρου σάτα τρία ἕως οὗ ἐζυμώθη ὅλον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/021.yaml
  text: It is like leaven[c][b][a], which a woman took and hid in three measures of flour until it was all leavened.
translation:
  language: fr
  text: Il est semblable à du levain[a] qu’une femme a pris et caché[b] dans trois mesures de farine[c], jusqu’à ce que toute la masse ait levé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de la levure ». Le terme grec désigne un agent de fermentation employé dans la pâte.
    reason: lexical_alternative
  - marker: b
    text: Ou « mélangé à ». Le verbe grec signifie littéralement « caché » ou « dissimulé ».
    reason: lexical_alternative
  - marker: c
    text: Littéralement « trois sata de farine ». Le sata est une ancienne mesure de capacité (environ un séa).
    reason: cultural_note
lexical_decisions:
- source_word: ὁμοία ἐστὶν
  choice: Il ressemble à
  rationale: Le pronom reprend naturellement le royaume mentionné dans le contexte; cette tournure rend la comparaison de façon claire et actuelle.
- source_word: ζύμῃ
  choice: du levain
  rationale: « Levain » désigne convenablement l’agent de fermentation ancien et conserve l’image biblique sans évoquer spécialement la levure commerciale moderne.
- source_word: λαβοῦσα γυνὴ
  choice: qu’une femme a pris
  rationale: Le participe aoriste est rendu par une proposition coordonnée naturelle en français, antérieure à l’action principale.
- source_word: ἔκρυψεν
  choice: caché
  rationale: Le choix conserve le sens concret et frappant de « cacher, dissimuler » plutôt que d’expliciter l’action par « mélanger ».
- source_word: εἰς ἀλεύρου σάτα τρία
  choice: dans trois mesures de farine
  rationale: Cette formulation préserve l’unité ancienne dans le texte de manière intelligible; une note précise le terme grec et l’importance de la quantité.
- source_word: ἕως οὗ
  choice: jusqu’à ce que
  rationale: Équivalent temporel idiomatique qui maintient l’idée d’un processus parvenu à son terme.
- source_word: ἐζυμώθη ὅλον
  choice: toute la pâte ait levé
  rationale: Le neutre singulier ὅλον vise l’ensemble de la masse; « pâte » explicite naturellement le résultat du mélange de farine et de levain, tandis que « ait levé » rend le passif grec de façon idiomatique.
theological_decisions:
- issue: Portée symbolique du levain dans la parabole
  choice: Conserver l’image du levain sans lui attribuer explicitement une valeur positive ou négative.
  alternative: Interpréter le levain soit négativement à partir d’autres textes bibliques, soit positivement comme symbole de la croissance du royaume.
  rationale: Le verset lui-même donne une comparaison sans expliquer chaque élément. La traduction ne doit pas trancher une question interprétative que le grec laisse ouverte.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe reste accessible, l’image concrète de « cacher » est préservée, et les réalités lexicales ou culturelles moins transparentes sont expliquées en notes.
