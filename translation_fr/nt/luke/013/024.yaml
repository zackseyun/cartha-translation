id: LUK.13.24
reference: Luke 13:24
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἀγωνίζεσθε εἰσελθεῖν διὰ τῆς στενῆς ⸀θύρας, ὅτι πολλοί, λέγω ὑμῖν, ζητήσουσιν εἰσελθεῖν καὶ οὐκ ἰσχύσουσιν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/024.yaml
  text: Strive to enter through the narrow door[a], because many, I tell you, will seek to enter and will not be able.
translation:
  language: fr
  text: Efforcez-vous d’entrer par la porte étroite[a], car beaucoup, je vous le dis, chercheront à entrer et ne le pourront pas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « par le portail étroit ». Luc emploie le mot grec θύρα, « porte » ; dans le passage parallèle, Matthieu emploie πύλη, « porte » ou « portail ».
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀγωνίζεσθε
  choice: Efforcez-vous
  rationale: L’impératif présent exprime un effort soutenu et sérieux. « Efforcez-vous » est naturel en français moderne et conserve cette force sans expliciter davantage la nature de l’effort.
- source_word: εἰσελθεῖν
  choice: d’entrer / à entrer
  rationale: Les deux occurrences de l’infinitif sont rendues uniformément par « entrer », avec les prépositions exigées par la syntaxe française.
- source_word: διὰ τῆς στενῆς θύρας
  choice: par la porte étroite
  rationale: θύρα désigne normalement une « porte », tandis que στενός signifie ici « étroite ». « Par » rend naturellement le passage au travers de cette porte.
- source_word: ὅτι
  choice: car
  rationale: ὅτι introduit la raison de l’exhortation. « Car » conserve clairement le lien causal dans un registre digne et courant.
- source_word: πολλοί
  choice: beaucoup
  rationale: L’adjectif substantivé désigne un grand nombre de personnes ; « beaucoup » le rend sans ajout interprétatif.
- source_word: λέγω ὑμῖν
  choice: je vous le dis
  rationale: Cette formule est idiomatique en français et garde l’insistance personnelle de Jésus.
- source_word: ζητήσουσιν
  choice: chercheront
  rationale: « Chercheront » préserve le sens propre de ζητέω et maintient la distinction avec l’effort intense exprimé par Ἀγωνίζεσθε.
- source_word: οὐκ ἰσχύσουσιν
  choice: ne le pourront pas
  rationale: Dans ce contexte, ἰσχύω indique la capacité d’accomplir l’action. Le pronom « le » reprend naturellement « entrer » et évite une formulation lourde.
theological_decisions:
- issue: Effort humain et entrée dans le salut
  choice: Conserver l’impératif fort « Efforcez-vous » et l’avertissement selon lequel beaucoup ne pourront pas entrer.
  alternative: « Faites tout votre possible pour entrer » ou « Essayez d’entrer »
  rationale: Le texte commande un effort sérieux tout en annonçant l’incapacité future de beaucoup. La traduction maintient cette tension sans introduire d’explication doctrinale sur le mérite, les œuvres, la grâce ou la souveraineté divine.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation reste concise, conserve l’opposition entre « s’efforcer » et simplement « chercher », et évite tout vocabulaire confessionnel ajouté.
