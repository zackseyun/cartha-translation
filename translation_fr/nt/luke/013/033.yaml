id: LUK.13.33
reference: Luke 13:33
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: πλὴν δεῖ με σήμερον καὶ αὔριον καὶ τῇ ἐχομένῃ πορεύεσθαι, ὅτι οὐκ ἐνδέχεται προφήτην ἀπολέσθαι ἔξω Ἰερουσαλήμ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/033.yaml
  text: Nevertheless[a], I must go on my way today and tomorrow and the next day[b], because it is not possible for a prophet to perish outside Jerusalem.
translation:
  language: fr
  text: Pourtant, il faut que je poursuive ma route aujourd’hui, demain et le jour suivant[b], car il n’est pas possible[a] qu’un prophète périsse hors de Jérusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « il ne se peut pas » ou « il est inconcevable ».
    reason: lexical_alternative
  - marker: b
    text: L’expression « aujourd’hui, demain et le jour suivant » peut désigner de façon imagée un parcours bref et déterminé, plutôt que trois jours civils au sens strict.
    reason: cultural_note
lexical_decisions:
- source_word: πλὴν
  choice: Pourtant
  rationale: Marque nettement la réserve ou le contraste avec ce qui précède, dans un français actuel et digne.
- source_word: δεῖ με
  choice: il faut que je
  rationale: Rend la nécessité exprimée par le verbe impersonnel δεῖ sans préciser indûment si elle est divine, circonstancielle ou les deux.
- source_word: σήμερον καὶ αὔριον καὶ τῇ ἐχομένῃ
  choice: aujourd’hui, demain et le jour suivant
  rationale: Conserve la progression temporelle en trois temps et laisse ouverte sa possible portée idiomatique.
- source_word: πορεύεσθαι
  choice: poursuive ma route
  rationale: Exprime à la fois le déplacement et sa continuation dans le contexte du voyage.
- source_word: ὅτι
  choice: car
  rationale: Introduit naturellement en français la raison de la nécessité qui vient d’être affirmée.
- source_word: οὐκ ἐνδέχεται
  choice: il n’est pas possible
  rationale: Préserve la formulation d’impossibilité ou d’incongruité sans imposer une lecture exclusivement littérale ou ironique.
- source_word: προφήτην
  choice: un prophète
  rationale: Le singulier sans article a ici une portée générique et proverbiale.
- source_word: ἀπολέσθαι
  choice: périsse
  rationale: Conserve la solennité et l’étendue sémantique de ἀπόλλυμι, qui peut évoquer la mort ou la destruction.
- source_word: ἔξω Ἰερουσαλήμ
  choice: hors de Jérusalem
  rationale: Rend directement l’expression spatiale tout en convenant au ton solennel de la déclaration.
theological_decisions:
- issue: Portée de l’affirmation selon laquelle un prophète ne peut périr hors de Jérusalem
  choice: Formulation comme impossibilité ou incongruité, sans la définir comme une impossibilité métaphysique absolue
  alternative: « Il est inconcevable qu’un prophète périsse loin de Jérusalem » ou une formulation explicitement ironique
  rationale: Le grec οὐκ ἐνδέχεται peut exprimer l’impossible, l’inadmissible ou l’inconcevable. Le texte principal conserve cette tension et permet de percevoir l’ironie prophétique sans l’imposer.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe conserve le caractère solennel et proverbial de la seconde proposition. Les marqueurs [a] et [b] sont placés immédiatement après les expressions qu’ils éclairent.
