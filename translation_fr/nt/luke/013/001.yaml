  source_fidelity: 'Le texte rend fidèlement la structure et le sens du grec : présence de certaines personnes au moment indiqué, information adressée à Jésus au sujet des Galiléens, et formulation directe de l’acte attribué à Pilate. « Dont … le sang » rend correctement le relatif possessif ὧν, tandis que « à leurs sacrifices » conserve l’ambiguïté de αὐτῶν sans reconstruire les circonstances de l’événement.'
  naturalness: Le français est moderne, clair et suffisamment soutenu. « Étaient là et lui rapportaient » restitue de manière naturelle la valeur descriptive de Παρῆσαν avec le participe ἀπαγγέλλοντες. « Ce qui concernait les Galiléens » est un peu plus développé que « au sujet des Galiléens », mais reste idiomatique et exact.
  terminology: « Galiléens », « Pilate », « sang » et « sacrifices » sont les termes établis et appropriés. « Avait mêlé le sang à leurs sacrifices » préserve l’image concrète de μίγνυμι et n’ajoute aucune interprétation théologique ou historique.
