id: LUK.13.1
reference: Luke 13:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Παρῆσαν δέ τινες ἐν αὐτῷ τῷ καιρῷ ἀπαγγέλλοντες αὐτῷ περὶ τῶν Γαλιλαίων ὧν τὸ αἷμα Πιλᾶτος ἔμιξεν μετὰ τῶν θυσιῶν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/001.yaml
  text: Some were present at that very time reporting to him about the Galileans whose blood Pilate had mixed with their sacrifices[a].
translation:
  language: fr
  text: À ce moment même, quelques personnes étaient là et lui rapportaient ce qui concernait les Galiléens dont Pilate avait mêlé le sang à leurs sacrifices[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « avait mélangé le sang à leurs sacrifices ».'
    reason: Variante lexicale possible pour ἔμιξεν ; « mêlé » a été retenu dans le texte pour sa concision et sa force.
lexical_decisions:
- source_word: Παρῆσαν
  choice: étaient là
  rationale: L’imparfait de πάρειμι décrit la présence de ces personnes plutôt que leur arrivée. « Étaient là » en conserve naturellement la valeur stative.
- source_word: δέ
  choice: non rendu explicitement
  rationale: La particule marque ici une transition légère. En français, l’enchaînement est suffisamment porté par « À ce moment même » ; ajouter « or » ou « alors » risquerait de surcharger ou de préciser indûment le rapport logique.
- source_word: τινες
  choice: quelques personnes
  rationale: Cette expression rend clairement l’indéfini pluriel dans un français courant.
- source_word: ἐν αὐτῷ τῷ καιρῷ
  choice: À ce moment même
  rationale: La formulation conserve à la fois le repère temporel précis et la valeur intensive de αὐτῷ.
- source_word: ἀπαγγέλλοντες αὐτῷ
  choice: lui rapportaient
  rationale: Le verbe exprime la transmission d’une information ou d’une nouvelle. L’imparfait s’intègre à la construction descriptive ouverte par « étaient là ».
- source_word: περὶ τῶν Γαλιλαίων
  choice: ce qui concernait les Galiléens
  rationale: περί avec le génitif introduit le sujet du rapport. Cette tournure est naturelle en français et n’ajoute aucune explication de l’événement.
- source_word: ὧν τὸ αἷμα
  choice: dont […] le sang
  rationale: Le relatif français « dont » reproduit naturellement la relation possessive exprimée en grec.
- source_word: Πιλᾶτος
  choice: Pilate
  rationale: Forme française traditionnelle et courante du nom propre.
- source_word: ἔμιξεν
  choice: avait mêlé
  rationale: Le plus-que-parfait situe naturellement l’acte antérieurement au rapport. « Mêler » conserve l’image forte et concrète du grec.
- source_word: μετὰ τῶν θυσιῶν αὐτῶν
  choice: à leurs sacrifices
  rationale: Le grec évoque les sacrifices qui leur appartenaient ou qu’ils offraient, sans préciser davantage les circonstances. La formulation française préserve cette concision et cette ambiguïté.
theological_decisions:
- issue: Portée historique et morale de l’acte de Pilate
  choice: Rapporter directement que Pilate avait mêlé le sang des Galiléens à leurs sacrifices.
  alternative: 'Développer : « les avait tués pendant qu’ils offraient leurs sacrifices ».'
  rationale: Le texte présente un événement choquant sans en expliquer le déroulement ni la signification théologique. La traduction garde donc sa formulation saisissante sans introduire de reconstruction historique.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proche de la structure grecque tout en évitant une tournure participiale peu naturelle en français. Aucun détail explicatif sur la manière dont les Galiléens sont morts n’est ajouté.
