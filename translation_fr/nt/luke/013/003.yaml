source:
  edition: SBLGNT
  text: οὐχί, λέγω ὑμῖν, ἀλλ’ ἐὰν μὴ μετανοῆτε πάντες ⸀ὁμοίως ἀπολεῖσθε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/003.yaml
  text: No, I tell you; but unless you change your thinking, you will all likewise perish.
translation:
  language: fr
  text: Non, je vous le dis ; mais si vous ne vous repentez pas, vous périrez tous de même[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « d’une manière semblable ». L’expression peut désigner un jugement soudain comparable, sans nécessairement annoncer une manière de mourir identique.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχί
  choice: Non
  rationale: Réponse négative nette à l’idée implicite du contexte précédent, sans ajouter une emphase absente du grec.
- source_word: λέγω ὑμῖν
  choice: je vous le dis
  rationale: Formule directe, idiomatique et solennelle, qui conserve l’adresse personnelle.
- source_word: ἀλλ’
  choice: Mais
  rationale: Marque simplement le contraste entre le refus de l’hypothèse précédente et l’avertissement qui suit.
- source_word: ἐὰν μὴ
  choice: si vous ne… pas
  rationale: Formulation conditionnelle naturelle en français, équivalente à « à moins que », mais plus fluide ici.
- source_word: μετανοῆτε
  choice: changez radicalement d’attitude
  rationale: Exprime un profond changement intérieur et moral orientant autrement la conduite, plutôt qu’une simple révision intellectuelle. Cette formulation reste compréhensible sans recourir au terme religieux plus spécialisé « se repentir ».
- source_word: πάντες
  choice: tous
  rationale: Conserve la portée universelle de l’avertissement adressé aux auditeurs.
- source_word: ὁμοίως
  choice: de même
  rationale: Maintient la comparaison avec les victimes mentionnées auparavant, tout en laissant ouverte la nature exacte de cette similitude.
- source_word: ἀπολεῖσθε
  choice: vous périrez
  rationale: Préserve la gravité et l’étendue possible de la ruine annoncée sans la limiter à la mort physique ni l’expliciter comme condamnation éternelle.
theological_decisions:
- issue: Portée du changement demandé par μετανοῆτε
  choice: changez radicalement d’attitude
  alternative: repentez-vous
  rationale: Le choix retenu communique la réorientation intérieure, morale et pratique impliquée dans le contexte, sans réduire le verbe à un simple changement d’opinion ni imposer un vocabulaire confessionnel.
- issue: Portée de ἀπολεῖσθε
  choice: vous périrez
  alternative: vous mourrez / vous serez condamnés
  rationale: « Périrez » conserve l’indétermination du grec quant au mode et à l’étendue de la ruine, et maintient la tension entre jugement historique, mort et portée théologique plus large.
- issue: Nature de la similitude exprimée par ὁμοίως
  choice: de même
  alternative: de la même manière
  rationale: « De même » permet que la comparaison porte sur la soudaineté ou la certitude du jugement, sans affirmer nécessairement une manière de mourir identique.
translation_notes:
  register: Français international moderne, direct et digne. La phrase courte conserve la force de la réponse et de l’avertissement. « Changer radicalement d’attitude » rend le mouvement moral et intérieur de μετανοέω dans un langage courant, tandis que « périr » préserve l’ambiguïté théologique du texte.
