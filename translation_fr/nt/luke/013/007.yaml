  terminology: « Vigneron », « figuier », « fruit » et « sol » conviennent. Le choix « vigneron » préserve correctement le sens de ἀμπελουργός, même si la scène porte ici sur un figuier planté dans une vigne. La note doit présenter l’alternative spatiale sans faire de l’épuisement du sol le sens principal.
