reference: Luke 13:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἶπεν δὲ πρὸς τὸν ἀμπελουργόν· Ἰδοὺ τρία ἔτη ⸂ἀφ’ οὗ⸃ ἔρχομαι ζητῶν καρπὸν ἐν τῇ συκῇ ταύτῃ καὶ οὐχ εὑρίσκω· ⸀ἔκκοψον αὐτήν· ἱνατί καὶ τὴν γῆν καταργεῖ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/007.yaml
  text: Then he said to the vine-dresser[a], ‘Look, for three years now I have come seeking fruit on this fig tree and have found none. Cut it down. Why should it even keep using up the ground?’
translation:
  language: fr
  text: 'Alors il dit au vigneron : « Voilà trois ans que je viens chercher du fruit sur ce figuier, et je n’en trouve pas. Coupe-le. Pourquoi rend-il aussi le sol improductif[a] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Pourquoi occupe-t-il aussi inutilement le terrain ? » Le verbe grec peut désigner le fait de rendre le sol inutile ou improductif ; dans ce contexte, il peut aussi évoquer l’occupation improductive du terrain.
    reason: Alternative lexicale préservant l’étendue sémantique de καταργεῖ.
lexical_decisions:
- source_word: ἀμπελουργόν
  choice: vigneron
  rationale: Le terme désigne celui qui cultive et entretient une vigne. « Vigneron » est précis, naturel et conserve le cadre de la vigne.
- source_word: Ἰδοὺ
  choice: Voilà
  rationale: Dans « Voilà trois ans que », le français exprime naturellement à la fois l’appel à l’attention et la durée soulignée par le grec.
- source_word: τρία ἔτη ἀφ’ οὗ
  choice: Voilà trois ans que
  rationale: Cette tournure française idiomatique marque une durée commencée dans le passé et qui se prolonge jusqu’au moment présent.
- source_word: ἔρχομαι ζητῶν
  choice: je viens chercher
  rationale: La formulation conserve le mouvement exprimé par ἔρχομαι et l’action simultanée de chercher, tout en permettant au contexte des trois années de suggérer la répétition.
- source_word: καρπὸν
  choice: du fruit
  rationale: Le sens agricole littéral convient à la parabole sans en expliciter prématurément l’interprétation.
- source_word: συκῇ
  choice: figuier
  rationale: Équivalent français courant et précis de l’arbre désigné.
- source_word: οὐχ εὑρίσκω
  choice: je n’en trouve pas
  rationale: Le présent français reflète directement le présent grec et résume l’absence persistante de fruit.
- source_word: ἔκκοψον
  choice: Coupe-le
  rationale: L’impératif exprime directement l’ordre d’abattre le figuier; en contexte, « couper » est clair et naturel.
- source_word: ἱνατί
  choice: Pourquoi
  rationale: Rend simplement et directement la question rhétorique du grec.
- source_word: καὶ
  choice: aussi
  rationale: 'Conserve la valeur additive : outre son absence de fruit, l’arbre a également un effet nuisible sur le sol.'
- source_word: γῆν
  choice: le sol
  rationale: Dans ce contexte agricole, « le sol » désigne naturellement la terre cultivable concernée.
- source_word: καταργεῖ
  choice: épuise
  rationale: Le verbe peut signifier rendre inactif, inutile ou improductif. « Épuise » exprime ici l’effet du figuier stérile sur le sol sans réduire le sens à la seule occupation d’espace.
theological_decisions:
- issue: Image parabolique et interprétation explicite
  choice: Conserver littéralement le langage agricole
  alternative: Introduire dans le texte une référence explicite à la stérilité spirituelle
  rationale: Le verset appartient à une parabole; la traduction doit préserver l’image et laisser son interprétation découler du contexte.
- issue: Portée de καταργεῖ
  choice: « épuise le sol », avec une note signalant l’autre compréhension possible
  alternative: « occupe inutilement le terrain »
  rationale: Le grec permet une idée plus forte que la simple occupation, celle de rendre le sol improductif, mais le contexte autorise aussi la compréhension spatiale. La note préserve cette ambiguïté réelle.
translation_notes:
  register: Français international moderne, naturel et digne. La tournure « Voilà trois ans que » est idiomatique et souligne la durée; le dialogue reste direct. Aucun sens théologique extérieur à l’image agricole n’est ajouté.
