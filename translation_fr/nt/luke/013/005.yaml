id: LUK.13.5
reference: Luke 13:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὐχί, λέγω ὑμῖν, ἀλλ’ ἐὰν μὴ ⸀μετανοῆτε πάντες ⸀ὡσαύτως ἀπολεῖσθε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/005.yaml
  text: No[a], I tell you; but unless you repent, you will all likewise perish.
translation:
  language: fr
  text: « Non, je vous le dis. Mais si vous ne vous repentez pas, vous périrez tous de même[a]. »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vous périrez tous de la même manière ». Le grec traduit par « de même » peut évoquer un jugement comparable à celui des exemples précédents, sans préciser exactement en quoi consiste la ressemblance.
    reason: alternative lexicale et préservation de l’ambiguïté contextuelle
lexical_decisions:
- source_word: οὐχί
  choice: Non
  rationale: Réponse négative nette et emphatique à la question implicite du contexte précédent, exprimée de façon naturelle en français.
- source_word: λέγω ὑμῖν
  choice: je vous le dis
  rationale: Formule idiomatique courante qui restitue fidèlement l’affirmation solennelle de Jésus.
- source_word: ἀλλ’ ἐὰν μὴ
  choice: Mais si vous ne… pas
  rationale: Cette tournure française rend naturellement à la fois l’opposition introduite par ἀλλά et la condition négative exprimée par ἐὰν μή.
- source_word: μετανοῆτε
  choice: vous vous repentez
  rationale: « Se repentir » conserve ici la portée spirituelle et morale du verbe, sans le réduire à un simple changement d’opinion ni en préciser excessivement les composantes.
- source_word: πάντες
  choice: tous
  rationale: 'Le placement après le verbe préserve la portée universelle de l’avertissement adressé aux auditeurs : ils sont tous concernés.'
- source_word: ὡσαύτως
  choice: de même
  rationale: 'Expression concise qui maintient ouverte la nature exacte de la comparaison avec les morts évoquées précédemment : manière, caractère comparable ou certitude du jugement.'
- source_word: ἀπολεῖσθε
  choice: vous périrez
  rationale: « Périr » exprime la gravité de la ruine annoncée sans la limiter explicitement à la seule mort physique.
theological_decisions:
- issue: Sens de la repentance dans l’avertissement de Jésus
  choice: vous vous repentez
  alternative: vous changez d’attitude ; vous revenez à Dieu
  rationale: Le verbe désigne davantage qu’un changement intellectuel, mais le verset ne développe pas une définition doctrinale complète de la repentance. Le terme consacré « se repentir » en préserve l’ampleur.
- issue: Portée de ὡσαύτως ἀπολεῖσθε
  choice: vous périrez tous de même
  alternative: vous périrez tous de la même manière
  rationale: La formulation principale préserve l’ambiguïté du grec quant au point précis de comparaison avec les événements précédents, sans imposer l’idée d’une mort matériellement identique.
translation_notes:
  register: Français international moderne, sobre et solennel. La syntaxe reste proche du grec tout en étant naturelle à l’oral comme à l’écrit. Le marqueur de note est placé après l’expression qu’il explique.
