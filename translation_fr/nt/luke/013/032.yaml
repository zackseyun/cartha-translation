  - severity: medium
    issue: 'Formulation maladroite de τελειοῦμαι : « je suis mené à l’accomplissement »'
    rationale: La tournure est pesante et « à l’accomplissement » reste abstrait. « Je suis conduit à mon terme » rend plus naturellement l’aboutissement passif sans réduire l’ambiguïté du grec.
