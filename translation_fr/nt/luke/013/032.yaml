  to: 'Et il leur dit : « Allez dire à ce renard : “Voici, je chasse des démons et j’opère des guérisons aujourd’hui et demain, et le troisième jour, je suis conduit à mon terme[a].” »'
  rationale: La révision remplace deux formulations littérales mais peu idiomatiques par des équivalents français naturels. Elle garde la distinction entre l’expulsion des démons et les guérisons, ainsi que la voix passive et l’ambiguïté théologique de τελειοῦμαι.
