source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς· Πορευθέντες εἴπατε τῇ ἀλώπεκι ταύτῃ· Ἰδοὺ ἐκβάλλω δαιμόνια καὶ ἰάσεις ⸀ἀποτελῶ σήμερον καὶ αὔριον, καὶ τῇ τρίτῃ τελειοῦμαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/032.yaml
  text: And he said to them[a], “Go and tell that fox, ‘Look, I cast out demons and accomplish healings today and tomorrow, and on the third day I am brought to completion.’”
translation:
  language: fr
  text: 'Et il leur dit : « Allez dire à ce renard : “Voici, je chasse des démons et j’opère des guérisons aujourd’hui et demain, et le troisième jour, je suis conduit à mon terme[a].” »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « j’atteins mon but », « je suis rendu parfait » ou « j’achève ma course ». Le grec peut désigner le fait d’être conduit à son terme, probablement en référence à l’achèvement de la mission confiée à Jésus.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλώπεκι
  choice: renard
  rationale: Le nom désigne littéralement un renard. Conserver l’animal préserve la force métaphorique et le ton méprisant sans expliciter abusivement l’insulte.
- source_word: Ἰδοὺ
  choice: Voici
  rationale: Marqueur discursif qui attire l’attention sur la déclaration suivante ; « Voici » garde sa force déictique dans un registre biblique digne mais non archaïque.
- source_word: ἐκβάλλω δαιμόνια
  choice: je chasse des démons
  rationale: Expression française naturelle pour l’expulsion des démons, qui conserve la vigueur de ἐκβάλλω.
- source_word: ἰάσεις ἀποτελῶ
  choice: j’accomplis des guérisons
  rationale: Cette formulation maintient ἰάσεις comme nom et rend ἀποτελῶ par l’idée d’accomplir ou de mener à effet, sans confondre ce verbe avec celui de la proposition précédente.
- source_word: σήμερον καὶ αὔριον
  choice: aujourd’hui et demain
  rationale: Rendu direct qui préserve à la fois le sens temporel littéral et la possibilité d’une expression désignant une période brève et déterminée.
- source_word: τῇ τρίτῃ
  choice: le troisième jour
  rationale: Le datif de l’ordinal a ici une valeur temporelle ; cette formulation est claire et idiomatique en français.
- source_word: τελειοῦμαι
  choice: je suis mené à l’accomplissement
  rationale: Le présent passif peut exprimer le fait d’être conduit à son terme, d’être achevé ou d’atteindre son but. Cette formulation conserve le passif et l’ouverture théologique du grec, sans suggérer principalement une perfection morale.
theological_decisions:
- issue: Sens de τελειοῦμαι par rapport à la mission de Jésus et possible allusion à sa mort ou à sa résurrection
  choice: je suis mené à l’accomplissement
  alternative: j’atteins mon but ; je suis rendu parfait ; j’achève ma course
  rationale: Le propos peut évoquer l’achèvement de la mission assignée à Jésus, jusqu’à sa mort et sa justification, mais le grec ne mentionne pas explicitement ici la résurrection ou la glorification. Le rendu retenu maintient cette tension et la forme passive.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe conserve l’enchaînement solennel de la parole directe, tandis que « ce renard », « je chasse des démons » et les repères temporels restent immédiatement compréhensibles.
