source:
  edition: SBLGNT
  text: ἰδὼν δὲ αὐτὴν ὁ Ἰησοῦς προσεφώνησεν καὶ εἶπεν αὐτῇ· Γύναι, ἀπολέλυσαι τῆς ἀσθενείας σου,
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/012.yaml
  text: But when Jesus saw her[a], he called her over and said to her, “Woman, you are freed from your weakness.”
translation:
  language: fr
  text: 'Mais quand Jésus la vit, il l’appela et lui dit : « Femme, tu es délivrée de ton infirmité. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδὼν δὲ αὐτὴν
  choice: Mais quand Jésus la vit
  rationale: Le participe aoriste ἰδών se rend naturellement par une proposition temporelle. δέ marque ici la progression du récit avec une légère transition, rendue par « Mais ».
- source_word: προσεφώνησεν
  choice: il l’appela
  rationale: προσφωνέω signifie appeler quelqu’un ou s’adresser à lui. « Il l’appela » conserve l’initiative de Jésus sans préciser de façon incertaine qu’il lui demanda de s’approcher.
- source_word: εἶπεν αὐτῇ
  choice: et lui dit
  rationale: Cette formulation française représente explicitement le datif αὐτῇ et reste idiomatique.
- source_word: Γύναι
  choice: Femme
  rationale: Le vocatif γύναι est une adresse directe et respectueuse. « Femme » en est l’équivalent formel le plus proche, sans ajouter une nuance affective ou sociale absente du grec.
- source_word: ἀπολέλυσαι
  choice: tu es délivrée
  rationale: Le parfait passif exprime une libération accomplie dont le résultat demeure. « Tu es délivrée » rend naturellement en français l’état résultant et la voix passive.
- source_word: τῆς ἀσθενείας σου
  choice: de ton infirmité
  rationale: Dans ce contexte, ἀσθένεια désigne une affection physique invalidante. « Infirmité » conserve une certaine largeur sémantique tout en étant plus naturel ici que « faiblesse » en français.
theological_decisions:
- issue: Nature de l’état désigné par ἀσθένεια
  choice: infirmité
  alternative: faiblesse ; maladie ; handicap
  rationale: Le contexte indique une atteinte physique, mais le terme grec ne fournit pas de diagnostic précis. « Infirmité » préserve cette généralité sans introduire une catégorie médicale moderne.
- issue: Valeur du parfait passif ἀπολέλυσαι
  choice: tu es délivrée
  alternative: tu as été délivrée
  rationale: La formulation choisie garde l’idée d’un acte subi et de son résultat présent, sans préciser l’agent ni résoudre davantage le rapport entre déclaration et guérison.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe suit le mouvement du grec tout en restant naturelle à l’oral comme à la lecture publique.
