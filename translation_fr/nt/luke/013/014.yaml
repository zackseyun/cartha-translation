source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ ἀρχισυνάγωγος, ἀγανακτῶν ὅτι τῷ σαββάτῳ ἐθεράπευσεν ὁ Ἰησοῦς, ἔλεγεν τῷ ὄχλῳ ⸀ὅτι Ἓξ ἡμέραι εἰσὶν ἐν αἷς δεῖ ἐργάζεσθαι· ἐν ⸀αὐταῖς οὖν ἐρχόμενοι θεραπεύεσθε καὶ μὴ τῇ ἡμέρᾳ τοῦ σαββάτου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/014.yaml
  text: But the synagogue ruler answered[a], indignant because Jesus had healed on the Sabbath, and said to the crowd, “There are six days in which it is necessary to work; so come on those days and be healed, and not on the day of the Sabbath.”
translation:
  language: fr
  text: 'Mais le responsable de la synagogue, indigné de ce que Jésus avait guéri le jour du sabbat, prit la parole et dit à la foule : « Il y a six jours pendant lesquels il faut travailler. Venez donc vous faire guérir ces jours-là, et non le jour du sabbat. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ
  choice: Mais … prit la parole
  rationale: Le participe ἀποκριθείς introduit ici une réaction à l’acte de Jésus plutôt qu’une réponse à une question explicite. « Prit la parole » est naturel en français et δέ marque le contraste avec la guérison précédente.
- source_word: ὁ ἀρχισυνάγωγος
  choice: le responsable de la synagogue
  rationale: ἀρχισυνάγωγος désigne celui qui dirige ou supervise les affaires de la synagogue. « Responsable » est clair en français moderne sans suggérer un pouvoir civil.
- source_word: ἀγανακτῶν
  choice: indigné
  rationale: Le terme exprime un vif mécontentement teinté de réprobation morale, que rend précisément « indigné ».
- source_word: ὅτι τῷ σαββάτῳ ἐθεράπευσεν ὁ Ἰησοῦς
  choice: de ce que Jésus avait guéri un jour de sabbat
  rationale: ὅτι est causal après un verbe d’indignation. Le plus-que-parfait situe naturellement la guérison avant la prise de parole; l’absence d’article devant σαββάτῳ permet l’expression idiomatique « un jour de sabbat ».
- source_word: ἔλεγεν τῷ ὄχλῳ
  choice: dit à la foule
  rationale: L’imparfait grec présente la parole dans son déroulement, mais le passé simple français convient mieux à cet acte de parole ponctuel dans un récit au passé.
- source_word: Ἓξ ἡμέραι εἰσὶν ἐν αἷς δεῖ ἐργάζεσθαι
  choice: Il y a six jours pendant lesquels il faut travailler
  rationale: Cette formulation conserve la structure et la force d’obligation de δεῖ tout en restant naturelle et intelligible.
- source_word: ἐν αὐταῖς οὖν ἐρχόμενοι θεραπεύεσθε
  choice: Venez donc vous faire guérir ces jours-là
  rationale: Le participe ἐρχόμενοι associé à l’impératif θεραπεύεσθε invite les gens à venir recevoir la guérison. « Vous faire guérir » préserve la valeur passive ou réceptive sans faire de la foule l’agent de sa propre guérison.
- source_word: καὶ μὴ τῇ ἡμέρᾳ τοῦ σαββάτου
  choice: et non le jour du sabbat
  rationale: La formulation française rend directement l’opposition entre les six jours et le jour du sabbat.
theological_decisions:
- issue: Statut de l’obligation concernant le travail et la guérison
  choice: Conserver « il faut travailler » dans le discours direct du responsable
  alternative: Paraphraser de manière à dénoncer explicitement son légalisme ou son hypocrisie
  rationale: Le verset rapporte l’objection normative du responsable sans l’approuver. La traduction maintient sa logique et la tension narrative, sans anticiper la réponse de Jésus ni ajouter un jugement théologique absent de cette phrase.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe narrative est fluide; « responsable de la synagogue » évite l’ambiguïté civile de « chef », tandis que « jour de sabbat » conserve la couleur biblique sans archaïsme.
