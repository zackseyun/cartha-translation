id: LUK.13.25
reference: Luke 13:25
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀφ’ οὗ ἂν ἐγερθῇ ὁ οἰκοδεσπότης καὶ ἀποκλείσῃ τὴν θύραν, καὶ ἄρξησθε ἔξω ἑστάναι καὶ κρούειν τὴν θύραν λέγοντες· ⸀Κύριε, ἄνοιξον ἡμῖν· καὶ ἀποκριθεὶς ἐρεῖ ὑμῖν· Οὐκ οἶδα ὑμᾶς πόθεν ἐστέ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/025.yaml
  text: Once the master of the house has risen and shut the door[a], and you begin to stand outside and knock on the door, saying, ‘Lord, open to us,’ then he will answer you, ‘I do not know you[c][b], where you are from.’
translation:
  language: fr
  text: 'Une fois que le maître de maison se sera levé et aura fermé la porte[a], vous commencerez, du dehors, à frapper à la porte en disant : « Seigneur[b], ouvre-nous la porte ! » Il vous répondra : « Je ne sais pas d’où vous venez[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus formellement : « Après que le maître de maison se sera levé et aura fermé la porte. »'
    reason: Alternative temporelle plus proche de la forme grecque.
  - marker: b
    text: Le grec κύριε, traditionnellement traduit par « Seigneur », peut aussi signifier ici « Maître » ou « Monsieur ».
    reason: La portée de la formule d’adresse dans la parabole reste ouverte.
  - marker: c
    text: Le grec enchaîne littéralement « Je ne vous connais pas » et « d’où vous êtes ». Le français rend naturellement cette indication d’origine par « Je ne sais pas d’où vous venez ».
    reason: La syntaxe grecque associe explicitement les personnes au refus de reconnaître leur origine et ne se reproduit pas idiomatiquement telle quelle en français.
lexical_decisions:
- source_word: ἀφ’ οὗ ἂν
  choice: Une fois que
  rationale: Cette tournure introduit une proposition temporelle indéfinie. « Une fois que » exprime naturellement en français le moment décisif après lequel la scène se déroule.
- source_word: ἐγερθῇ
  choice: se sera levé
  rationale: Le verbe désigne ici le fait de se lever, et non la résurrection. Le futur antérieur convient à la séquence introduite par « une fois que ».
- source_word: ὁ οἰκοδεσπότης
  choice: le maître de maison
  rationale: Cette expression actuelle conserve à la fois l’idée du responsable de la maison et celle de son autorité.
- source_word: ἀποκλείσῃ τὴν θύραν
  choice: aura fermé la porte
  rationale: « Fermer la porte » est l’expression française naturelle et garde, dans ce contexte, la force d’une exclusion devenue effective.
- source_word: ἄρξησθε ἔξω ἑστάναι
  choice: vous commencerez, du dehors
  rationale: La formulation conserve le verbe « commencer » et la position extérieure, tout en évitant le tour lourd « commencer à vous tenir debout dehors ».
- source_word: κρούειν τὴν θύραν
  choice: à frapper à la porte
  rationale: « Frapper à la porte » est l’idiome français courant correspondant à l’action décrite.
- source_word: Κύριε
  choice: Seigneur
  rationale: « Seigneur » conserve le sens usuel de κύριος et sa possible résonance théologique chez Luc, sans exclure le sens contextuel de « maître » ou la formule d’adresse « monsieur ».
- source_word: ἄνοιξον ἡμῖν
  choice: ouvre-nous la porte
  rationale: Le grec dit littéralement « ouvre-nous ». En français moderne, l’ajout de « la porte », déjà explicitement mentionnée, rend la demande claire et idiomatique sans ajouter un nouvel élément à la scène.
- source_word: ἀποκριθεὶς ἐρεῖ
  choice: Il vous répondra
  rationale: Le participe suivi du verbe de parole se rend naturellement en français par le seul verbe « répondre ».
- source_word: Οὐκ οἶδα ὑμᾶς
  choice: Je ne vous connais pas
  rationale: Cette traduction maintient le complément explicite ὑμᾶς et la portée relationnelle ou identificatoire possible de οἶδα.
- source_word: πόθεν ἐστέ
  choice: je ne sais pas d’où vous êtes
  rationale: Le tour conserve la notion d’origine exprimée par πόθεν. La répétition de « je ne sais pas » explicite en français le lien syntaxique difficile entre les deux éléments grecs.
theological_decisions:
- issue: Sens de κύριος dans l’adresse de la parabole
  choice: Seigneur
  alternative: Maître ; Monsieur
  rationale: « Seigneur » respecte le terme grec et permet sa résonance dans l’ensemble de l’Évangile, tandis qu’une note signale les sens plus ordinaires possibles dans le cadre de la parabole.
- issue: Rapport entre οὐκ οἶδα ὑμᾶς et πόθεν ἐστέ
  choice: Je ne vous connais pas, je ne sais pas d’où vous êtes
  alternative: Je ne sais pas d’où vous êtes ; Je ne vous connais pas, ni d’où vous êtes
  rationale: Le choix retient à la fois le complément « vous » et l’indication d’origine, sans réduire le propos à une seule de ces deux dimensions. La note préserve la construction grecque plus resserrée et ambiguë.
translation_notes:
  register: Français international moderne, clair et digne. Le futur antérieur suivi du futur respecte la progression temporelle. La formulation conserve la solennité de l’avertissement tout en évitant des tours archaïques ou inutilement littéraux.
