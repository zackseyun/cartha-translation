review_pass:
  verdict: revise
  source_fidelity: La question et le pluriel de « leur » reflètent bien εἰ ὀλίγοι οἱ σῳζόμενοι et πρὸς αὐτούς. Toutefois, εἶπεν est « dit », non spécifiquement « demanda » ni « répondit » ; ces verbes français ajoutent une caractérisation discursive qui n’est pas exprimée par le grec. « En train d’être sauvés » surinterprète aussi le présent comme un progressif explicite.
  naturalness: « Peu de gens qui soient en train d’être sauvés » est lourd et peu naturel en français international moderne. « Y a-t-il peu de gens qui sont sauvés ? » est idiomatique tout en gardant le présent passif.
  terminology: « Seigneur » est un bon choix pour Κύριε et la note conserve correctement l’ouverture entre titre plus fort et adresse respectueuse. « Sont sauvés » rend naturellement le participe passif présent sans imposer une compréhension théologique du processus.
  issues:
  - severity: medium
    issue: Les deux occurrences de εἶπεν sont rendues par « demanda » et « répondit ».
    rationale: Le grec emploie simplement « dit » dans les deux cas. Puisque le contenu est une question, « demanda » est compréhensible, mais l’équivalence optimale privilégie « dit » ; « répondit » caractérise en outre la seconde prise de parole comme une réponse.
  - severity: medium
    issue: « qui soient en train d’être sauvés » explicite excessivement l’aspect présent.
    rationale: Le participe présent passif désigne « ceux qui sont sauvés / en cours de salut » selon le contexte, sans exiger le périphrastique français « en train de », qui est à la fois plus étroit et moins naturel.
  revised_text: 'Quelqu’un lui dit : « Seigneur,[a] y a-t-il peu de gens qui sont sauvés ? » Il leur dit :'
