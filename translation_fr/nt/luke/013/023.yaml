  text: εἶπεν δέ τις αὐτῷ· Κύριε, εἰ ὀλίγοι οἱ σῳζόμενοι; ὁ δὲ εἶπεν πρὸς αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/023.yaml
  text: And someone said to him[a], “Lord, are only a few being saved?” And he said to them[b],
translation:
  language: fr
  text: 'Quelqu’un lui dit : « Seigneur,[a] y a-t-il peu de gens qui sont sauvés ? » Il leur dit :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ici, « Seigneur » peut aussi être compris comme une formule d’adresse respectueuse, proche de « Monsieur » ; le grec laisse ouverte la portée exacte du titre.
    reason: alternative_reading
lexical_decisions:
- source_word: δέ
  choice: Quelqu’un lui demanda
  rationale: La particule δέ assure ici une transition narrative légère. En français, la ponctuation et l’enchaînement suffisent, sans imposer un contraste absent du contexte immédiat.
- source_word: τις
  choice: Quelqu’un
  rationale: Le pronom indéfini désigne une personne non précisée ; « quelqu’un » est naturel et fidèle.
- source_word: αὐτῷ
  choice: lui
  rationale: Le pronom grec est conservé sans remplacer son référent par le nom de Jésus, que ce verset ne donne pas explicitement.
- source_word: Κύριε
  choice: Seigneur
  rationale: « Seigneur » maintient l’ouverture du titre grec, qui peut être une adresse respectueuse tout en ayant une portée plus forte dans Luc.
- source_word: εἰ ὀλίγοι
  choice: n’y a-t-il que peu de gens
  rationale: Cette formulation interrogative française rend naturellement la question portant sur le petit nombre, avec la nuance restrictive suggérée par le contexte syntaxique.
- source_word: οἱ σῳζόμενοι
  choice: qui soient en train d’être sauvés
  rationale: Le présent passif substantivé désigne littéralement ceux qui sont en cours d’être sauvés. La formulation conserve à la fois l’aspect progressif et la voix passive.
- source_word: ὁ δὲ εἶπεν πρὸς αὐτούς
  choice: Il leur répondit
  rationale: Après une question, « répondit » est idiomatique pour εἶπεν ; « leur » préserve le pluriel αὐτούς, qui élargit les destinataires au-delà de l’interlocuteur individuel.
theological_decisions:
- issue: Portée de Κύριε dans l’adresse à Jésus
  choice: Seigneur
  alternative: Monsieur
  rationale: Le grec permet une adresse de respect aussi bien qu’un titre à portée christologique. « Seigneur » préserve cette tension dans le vocabulaire lucanien, tandis qu’une note signale la valeur polie possible.
- issue: Aspect et voix de σῳζόμενοι
  choice: qui soient en train d’être sauvés
  alternative: qui seront sauvés / qui sont sauvés
  rationale: Le participe présent passif présente les personnes comme recevant le salut dans un processus ou un état en cours. La traduction évite de transformer cette expression en futur ou en résultat simplement accompli.
- issue: Passage du singulier au pluriel dans la réponse
  choice: Il leur répondit
  alternative: Il lui répondit
  rationale: 'Le texte grec emploie explicitement le pluriel αὐτούς : Jésus adresse sa réponse à plusieurs personnes, non au seul questionneur.'
translation_notes:
  register: Français international moderne, digne et accessible. La tournure « en train d’être sauvés » est volontairement plus explicite afin de préserver le présent passif grec. Le marqueur de note [a] est placé immédiatement après « Seigneur ».
