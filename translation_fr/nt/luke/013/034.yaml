id: LUK.13.34
reference: Luke 13:34
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἰερουσαλὴμ Ἰερουσαλήμ, ἡ ἀποκτείνουσα τοὺς προφήτας καὶ λιθοβολοῦσα τοὺς ἀπεσταλμένους πρὸς αὐτήν— ποσάκις ἠθέλησα ἐπισυνάξαι τὰ τέκνα σου ὃν τρόπον ὄρνις τὴν ἑαυτῆς νοσσιὰν ὑπὸ τὰς πτέρυγας, καὶ οὐκ ἠθελήσατε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/034.yaml
  text: Jerusalem[a], Jerusalem, the one killing the prophets and stoning those sent to her—how often I wanted to gather your children the way a hen gathers her brood under her wings[b], and you were not willing.
translation:
  language: fr
  text: Jérusalem, Jérusalem, toi qui tues les prophètes et lapides ceux qui te sont envoyés — combien de fois ai-je voulu rassembler tes enfants comme une poule rassemble sa couvée sous ses ailes, et vous ne l’avez pas voulu !
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰερουσαλὴμ Ἰερουσαλήμ
  choice: Jérusalem, Jérusalem
  rationale: La répétition du nom est conservée pour rendre l’interpellation emphatique et la lamentation.
- source_word: ἡ ἀποκτείνουσα ... καὶ λιθοβολοῦσα
  choice: toi qui tues ... et lapides
  rationale: Les participes présents caractérisent Jérusalem par son traitement habituel des messagers de Dieu. La relative est plus naturelle en français que des participes juxtaposés.
- source_word: τοὺς ἀπεσταλμένους πρὸς αὐτήν
  choice: ceux qui te sont envoyés
  rationale: Cette formulation conserve le passif et rend explicitement la destination exprimée par πρὸς αὐτήν, sans préciser l’auteur de l’envoi.
- source_word: ποσάκις ἠθέλησα
  choice: Combien de fois ai-je voulu
  rationale: Formulation française naturelle qui préserve à la fois la fréquence répétée et la volonté personnelle exprimée par θέλω.
- source_word: ἐπισυνάξαι τὰ τέκνα σου
  choice: rassembler tes enfants
  rationale: « Rassembler » rend la force du verbe composé, tandis que « tes enfants » conserve la personnification de Jérusalem sans en restreindre le référent.
- source_word: ὄρνις
  choice: une poule
  rationale: Le mot peut désigner plus largement un oiseau, mais l’image maternelle d’une femelle regroupant sa couvée sous ses ailes appelle naturellement « poule » en français.
- source_word: τὴν ἑαυτῆς νοσσιὰν
  choice: sa couvée
  rationale: « Couvée » rend le collectif désignant les petits et s’accorde naturellement avec l’image de la poule.
- source_word: καὶ οὐκ ἠθελήσατε
  choice: et vous ne l’avez pas voulu
  rationale: Le pluriel français reflète le pluriel grec et maintient le contraste de volonté avec « ai-je voulu »; le pronom « l’ » reprend l’action de rassemblement.
theological_decisions:
- issue: Référent de « tes enfants »
  choice: Conserver « tes enfants » sans préciser davantage le groupe visé.
  alternative: les habitants de Jérusalem; le peuple représenté par Jérusalem
  rationale: Le grec personnifie la ville comme une mère et laisse ouvert le référent exact de ses enfants. La traduction ne tranche pas cette ambiguïté.
- issue: Passage du singulier « te » au pluriel « vous »
  choice: 'Reproduire le changement de nombre : Jérusalem est interpellée au singulier, puis le refus est formulé au pluriel.'
  alternative: 'Uniformiser au singulier : « tu ne l’as pas voulu »'
  rationale: Le grec passe de σου et αὐτήν au singulier à ἠθελήσατε au pluriel. Cette tension peut faire entendre les enfants ou les habitants derrière la ville personnifiée et doit être préservée.
- issue: Contraste volitif θέλω / ἠθελήσατε
  choice: « ai-je voulu ... vous ne l’avez pas voulu »
  alternative: « ai-je désiré ... vous avez refusé »
  rationale: La répétition de « vouloir » conserve le parallèle lexical et l’accent du texte sur les volontés opposées sans développer de conclusion doctrinale extérieure au verset.
translation_notes:
  register: Français international moderne, digne et oralement fluide. L’exclamation après « envoyés » rend la rupture émotive de l’apostrophe. Le changement grec du singulier au pluriel est volontairement conservé et signalé en note.
