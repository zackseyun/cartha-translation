  text: Ἦν δὲ διδάσκων ἐν μιᾷ τῶν συναγωγῶν ἐν τοῖς σάββασιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/010.yaml
  text: He was teaching in one of the synagogues on the Sabbath[a].
translation:
  language: fr
  text: Il enseignait dans une des synagogues, un jour de sabbat[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les jours de sabbat » ; le grec emploie une forme plurielle qui peut aussi désigner idiomatiquement le sabbat.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἦν δὲ διδάσκων
  choice: Il enseignait
  rationale: La construction périphrastique à l’imparfait exprime une action en cours dans le passé. L’imparfait français « enseignait » la rend naturellement. La faible valeur connective de δέ n’a pas besoin d’être explicitée dans ce verset de transition.
- source_word: ἐν μιᾷ τῶν συναγωγῶν
  choice: dans une des synagogues
  rationale: L’expression partitive signifie littéralement « dans une des synagogues ». Le terme « synagogue » est conservé puisqu’il désigne précisément le cadre institutionnel juif.
- source_word: ἐν τοῖς σάββασιν
  choice: un jour de sabbat
  rationale: Bien que σάββασιν soit morphologiquement au pluriel, ce pluriel peut fonctionner idiomatiquement pour désigner le sabbat. « Un jour de sabbat » est naturel en français et convient à une scène particulière, sans suggérer que cet enseignement avait lieu dans plusieurs synagogues chaque sabbat.
theological_decisions: []
translation_notes:
  register: Français international moderne, simple et digne. La formulation conserve le cadre juif précis et rend l’action passée en cours par l’imparfait.
