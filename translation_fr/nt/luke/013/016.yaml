id: LUK.13.16
reference: Luke 13:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ταύτην δὲ θυγατέρα Ἀβραὰμ οὖσαν, ἣν ἔδησεν ὁ Σατανᾶς ἰδοὺ δέκα καὶ ὀκτὼ ἔτη, οὐκ ἔδει λυθῆναι ἀπὸ τοῦ δεσμοῦ τούτου τῇ ἡμέρᾳ τοῦ σαββάτου;
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/016.yaml
  text: And ought not this woman, being a daughter of Abraham, whom Satan bound for eighteen years—look—be released from this bond on the Sabbath day?
translation:
  language: fr
  text: Et cette femme, qui est une fille d’Abraham et que Satan a tenue liée, voilà dix-huit ans, ne devait-elle pas être libérée de ce lien le jour du sabbat ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θυγατέρα Ἀβραὰμ
  choice: une fille d’Abraham
  rationale: Conserve l’expression familiale et l’identité d’alliance du grec, sans la réduire à la simple idée de descendante.
- source_word: ἔδησεν / λυθῆναι / δεσμοῦ
  choice: a tenue liée / délivrer / lien
  rationale: Préserve le réseau métaphorique de lier, délier et lien, tout en donnant une tournure française naturelle.
- source_word: ἰδού
  choice: voyez !
  rationale: Rend l’interjection qui attire expressément l’attention sur la durée remarquable de dix-huit ans.
- source_word: οὐκ ἔδει
  choice: ne fallait-il pas
  rationale: Exprime la nécessité attendue dans une question rhétorique, sans surinterpréter sa nature.
- source_word: τῇ ἡμέρᾳ τοῦ σαββάτου
  choice: le jour du sabbat
  rationale: Traduction directe et courante de l’expression temporelle grecque.
theological_decisions:
- issue: Lien entre Satan et l’infirmité de la femme
  choice: que Satan a tenue liée
  alternative: que Satan avait rendue malade
  rationale: Le texte attribue explicitement à Satan le fait de l’avoir liée, mais ne précise pas davantage le mécanisme; la traduction conserve cette tension sans l’assimiler à une possession ni généraliser à toute maladie.
- issue: Statut de « fille d’Abraham »
  choice: conserver littéralement « une fille d’Abraham »
  alternative: une descendante d’Abraham
  rationale: La formulation peut évoquer à la fois la descendance et l’appartenance au peuple de l’alliance; la traduction ne tranche pas entre ces nuances.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase garde la force de la question rhétorique et le parallélisme conceptuel entre être liée et être délivrée; « voyez ! » conserve l’interjection emphatique du texte source.
