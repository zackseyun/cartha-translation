id: LUK.13.28
reference: Luke 13:28
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐκεῖ ἔσται ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων, ὅταν ⸀ὄψησθε Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακὼβ καὶ πάντας τοὺς προφήτας ἐν τῇ βασιλείᾳ τοῦ θεοῦ, ὑμᾶς δὲ ἐκβαλλομένους ἔξω.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/028.yaml
  text: There will be weeping and gnashing of teeth there[a], when you see Abraham and Isaac and Jacob and all the prophets in the kingdom of God[c][b], but you yourselves thrown out.
translation:
  language: fr
  text: C’est là qu’il y aura des pleurs et des grincements de dents, quand vous verrez Abraham, Isaac, Jacob et tous les prophètes dans le royaume de Dieu, tandis que vous-mêmes serez jetés dehors.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’expression grecque associe un verbe indiquant une expulsion énergique à « dehors » : littéralement, « jetés dehors ».'
    reason: lexical_nuance
lexical_decisions:
- source_word: ἐκεῖ
  choice: C’est là
  rationale: Rend clairement l’adverbe locatif, qui renvoie au lieu d’exclusion évoqué à la fin du verset.
- source_word: ὁ κλαυθμὸς
  choice: des pleurs
  rationale: Expression française naturelle et traditionnelle, sans amplifier le terme grec jusqu’à « lamentations ».
- source_word: ὁ βρυγμὸς τῶν ὀδόντων
  choice: des grincements de dents
  rationale: Équivalent français établi de l’expression grecque décrivant une vive détresse.
- source_word: ὅταν ὄψησθε
  choice: quand vous verrez
  rationale: Le subjonctif aoriste après ὅταν désigne ici une scène future précise; le futur est idiomatique en français.
- source_word: πάντας τοὺς προφήτας
  choice: tous les prophètes
  rationale: Traduction directe qui conserve l’insistance de πάντας.
- source_word: ἐν τῇ βασιλείᾳ τοῦ θεοῦ
  choice: dans le royaume de Dieu
  rationale: Conserve la formulation biblique centrale et l’image spatiale du texte.
- source_word: ὑμᾶς δὲ
  choice: tandis que vous-mêmes
  rationale: « tandis que » marque nettement le contraste; « vous-mêmes » restitue l’emphase du pronom explicite.
- source_word: ἐκβαλλομένους ἔξω
  choice: serez jetés dehors
  rationale: « jetés » maintient la force d’expulsion de ἐκβάλλω, et « dehors » rend explicitement ἔξω dans un français naturel.
theological_decisions:
- issue: Nature de l’image du jugement
  choice: Conserver les images concrètes de détresse et d’exclusion.
  alternative: Les expliciter comme « profonde tristesse » ou « condamnation finale ».
  rationale: Le verset représente l’exclusion du royaume et la détresse qui l’accompagne, sans exposer à lui seul toute une doctrine du jugement.
- issue: Portée de la construction participiale ὑμᾶς…ἐκβαλλομένους
  choice: 'La rendre par une proposition future contrastive : « tandis que vous-mêmes serez jetés dehors ».'
  alternative: « en vous voyant vous-mêmes jetés dehors » ou une construction nominale plus littérale.
  rationale: Le français exige une formulation verbale naturelle; celle-ci conserve le contraste entre les figures présentes dans le royaume et les destinataires expulsés, sans déterminer davantage la relation syntaxique avec « vous verrez ».
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve le rythme solennel de l’énoncé ainsi que l’opposition marquée entre « tous les prophètes » et « vous-mêmes ».
