id: LUK.4.39
reference: Luke 4:39
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἐπιστὰς ἐπάνω αὐτῆς ἐπετίμησεν τῷ πυρετῷ, καὶ ἀφῆκεν αὐτήν· παραχρῆμα δὲ ἀναστᾶσα διηκόνει αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/039.yaml
  text: And standing over her[a], he rebuked the fever, and it left her. Immediately she got up and began serving them.
translation:
  language: fr
  text: Se penchant sur elle, il réprimanda la fièvre, et celle-ci la quitta. Aussitôt, elle se leva et se mit à les servir.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιστὰς ἐπάνω αὐτῆς
  choice: Se tenant au-dessus d’elle
  rationale: Cette formulation conserve la position physique concrète de Jésus auprès de la femme tout en restant naturelle en français.
- source_word: ἐπετίμησεν τῷ πυρετῷ
  choice: il réprimanda la fièvre
  rationale: Le grec présente directement la fièvre comme l’objet de la réprimande. « Réprimanda » maintient le ton d’autorité sans expliquer la maladie comme une puissance personnelle ou démoniaque.
- source_word: ἀφῆκεν αὐτήν
  choice: celle-ci la quitta
  rationale: Le sujet sous-entendu est la fièvre. Le démonstratif rend ce lien explicite et évite la répétition, tout en préservant l’image grecque d’une fièvre qui s’en va.
- source_word: παραχρῆμα
  choice: Aussitôt
  rationale: Ce terme exprime clairement le caractère immédiat de la guérison et convient au registre narratif.
- source_word: ἀναστᾶσα
  choice: elle se leva
  rationale: Le français conjugue naturellement le participe grec comme une action successive, sans perdre sa promptitude.
- source_word: διηκόνει αὐτοῖς
  choice: se mit à les servir
  rationale: Cette tournure rend la valeur inceptive possible de l’imparfait grec et décrit un service concret sans employer un vocabulaire ecclésiastique.
theological_decisions:
- issue: La réprimande adressée à la fièvre implique-t-elle une personnification ou une cause démoniaque ?
  choice: Conserver « il réprimanda la fièvre » sans explication supplémentaire.
  alternative: « Il parla sévèrement à la fièvre » ou « il réprimanda la maladie ».
  rationale: Le texte attribue directement la réprimande à la fièvre, mais ne précise pas la nature de celle-ci. La traduction préserve donc la présentation de Luc et l’autorité de Jésus sans imposer une interprétation démonologique.
translation_notes:
  register: 'Français international moderne, fluide et digne. La syntaxe demeure proche du mouvement du grec : position de Jésus, parole d’autorité, départ de la fièvre, puis relèvement et service immédiats.'
