source:
  edition: SBLGNT
  text: ⸂Ἤγαγεν δὲ⸃ αὐτὸν εἰς Ἰερουσαλὴμ καὶ ⸀ἔστησεν ἐπὶ τὸ πτερύγιον τοῦ ἱεροῦ, καὶ εἶπεν αὐτῷ· Εἰ υἱὸς εἶ τοῦ θεοῦ, βάλε σεαυτὸν ἐντεῦθεν κάτω·
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/009.yaml
  text: Then he led him to Jerusalem and set him on the pinnacle of the temple[a], and said to him, “If you are the Son of God[c][b], throw yourself down from here;”
translation:
  language: fr
  text: 'Puis il le conduisit à Jérusalem, le plaça sur le pinacle du Temple[a] et lui dit : « Si tu es le Fils de Dieu[b], jette-toi d’ici vers le bas : »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot grec peut aussi se traduire par « l’aile du Temple ». Il désigne ici une extrémité saillante ou un point élevé du complexe du Temple, sans nécessairement préciser son emplacement exact. Le grec parle du complexe du Temple, et non spécifiquement du sanctuaire intérieur.
    reason: lexical_alternative
  - marker: b
    text: 'On pourrait aussi comprendre : « Puisque tu es le Fils de Dieu. » La tournure grecque permet cette nuance, mais « si » conserve ici la force du défi lancé par le tentateur.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἤγαγεν δὲ
  choice: Puis il le conduisit
  rationale: δὲ marque ici la progression du récit, rendue naturellement par « Puis » ; ἄγω exprime le fait de conduire ou d’amener, sans préciser davantage le mode de déplacement.
- source_word: ἔστησεν
  choice: le plaça
  rationale: 'L’aoriste transitif de ἵστημι a ici un sens causatif : faire se tenir, placer. « Le plaça » est naturel en français moderne.'
- source_word: ἐπὶ τὸ πτερύγιον τοῦ ἱεροῦ
  choice: sur le point le plus élevé du Temple
  rationale: πτερύγιον désigne littéralement une petite aile et, dans ce contexte architectural, une extrémité saillante ou un point élevé. Cette formulation est claire sans imposer une identification architecturale trop précise. ἱερόν vise l’ensemble du complexe du Temple.
- source_word: Εἰ υἱὸς εἶ τοῦ θεοῦ
  choice: Si tu es le Fils de Dieu
  rationale: « Si » conserve la forme conditionnelle et la force provocatrice de l’épreuve, tandis que « le Fils de Dieu » rend naturellement la valeur titulaire de l’expression.
- source_word: βάλε σεαυτὸν ἐντεῦθεν κάτω
  choice: jette-toi d’ici en bas
  rationale: L’impératif βάλε exprime un mouvement volontaire et brusque ; « jette-toi » est direct et actuel. ἐντεῦθεν κάτω est rendu explicitement par « d’ici en bas ».
theological_decisions:
- issue: Force de la condition appliquée à l’identité de Jésus
  choice: Si tu es le Fils de Dieu
  alternative: Puisque tu es le Fils de Dieu
  rationale: εἰ avec l’indicatif peut parfois introduire une prémisse tenue pour vraie, mais « si » préserve ici le défi du tentateur et la tension rhétorique sans suggérer que le narrateur met lui-même en doute l’identité de Jésus.
translation_notes:
  register: Français international moderne, digne et accessible. La majuscule à « Temple » distingue naturellement le Temple de Jérusalem ; la formulation évite le terme plus littéraire « pinacle » et explicite le sens architectural probable sans prétendre identifier précisément le lieu.
