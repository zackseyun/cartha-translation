id: LUK.4.13
reference: Luke 4:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ συντελέσας πάντα πειρασμὸν ὁ διάβολος ἀπέστη ἀπ’ αὐτοῦ ἄχρι καιροῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/013.yaml
  text: And after finishing every temptation[a], the devil departed from him until an opportune time.
translation:
  language: fr
  text: Après avoir achevé toutes les tentations[a], le diable s’éloigna de lui jusqu’à un moment favorable.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « toutes les épreuves ». Le terme grec peut désigner soit une tentation, soit une épreuve; ici, le rôle du diable rend « tentations » plus naturel.
    reason: lexical_alternative
lexical_decisions:
- source_word: συντελέσας
  choice: Après avoir achevé
  rationale: Le participe aoriste actif exprime une action accomplie avant le verbe principal. Cette tournure française naturelle conserve clairement ce rapport temporel.
- source_word: πάντα πειρασμόν
  choice: toutes les tentations
  rationale: Le singulier grec avec πᾶς a ici une portée globale ou distributive. Le pluriel français exprime naturellement l’ensemble des tentations présentées dans le récit. « Épreuves » demeure possible et figure en note.
- source_word: διάβολος
  choice: le diable
  rationale: Dans ce récit, le terme désigne l’adversaire personnel surnaturel; « le diable » est la désignation française courante et précise.
- source_word: ἀπέστη ἀπ’ αὐτοῦ
  choice: s’éloigna de lui
  rationale: Le verbe signifie partir, se retirer ou s’éloigner de quelqu’un. Cette formulation garde l’idée de retrait sans suggérer que l’éloignement est définitif.
- source_word: ἄχρι καιροῦ
  choice: jusqu’à un moment favorable
  rationale: καιρός désigne ici non un simple point chronologique, mais une occasion appropriée ou propice. « Un moment favorable » rend la nuance stratégique et temporaire du retrait.
theological_decisions:
- issue: Nuance de πειρασμός dans l’expérience de Jésus
  choice: tentations
  alternative: épreuves
  rationale: Le mot grec peut désigner une épreuve ou une tentation. Puisque le diable agit ici pour détourner Jésus de l’obéissance fidèle, « tentations » convient mieux dans le texte principal. La note conserve néanmoins l’autre sens possible, car la scène met aussi Jésus à l’épreuve.
translation_notes:
  register: Français moderne international, naturel et digne. Le passé simple convient au registre narratif biblique sans être archaïque. La formulation préserve la brièveté du grec et l’ambiguïté réelle de πειρασμός au moyen d’une note.
