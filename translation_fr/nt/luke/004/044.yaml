  yaml_path: translation/nt/luke/004/044.yaml
  text: And he was preaching in the synagogues of Judea[a].
translation:
  language: fr
  text: Et il prêchait dans les synagogues de Judée[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Certains manuscrits lisent « Galilée » au lieu de « Judée ». Le texte principal suit la leçon « Judée » du texte grec retenu.
    reason: textual_variant
lexical_decisions:
- source_word: ἦν κηρύσσων
  choice: continuait à prêcher
  rationale: La construction périphrastique à l’imparfait exprime une action prolongée ou répétée dans le passé. « Continuait à prêcher » rend cet aspect de manière naturelle en français.
- source_word: κηρύσσων
  choice: prêcher
  rationale: Le verbe κηρύσσω désigne une proclamation publique. Dans le cadre des synagogues, « prêcher » est idiomatique et conserve l’idée de proclamation.
- source_word: εἰς τὰς συναγωγάς
  choice: dans les synagogues
  rationale: Bien que εἰς signifie souvent « dans, vers » avec une idée de mouvement, il indique ici le lieu ou la sphère de l’activité; le français naturel demande « dans les synagogues ».
- source_word: συναγωγάς
  choice: synagogues
  rationale: Dans ce contexte, συναγωγή désigne les lieux ou assemblées du culte juif; « synagogues » est le terme français standard.
- source_word: Ἰουδαίας
  choice: Judée
  rationale: Le texte grec retenu porte Ἰουδαίας, normalement rendu par « Judée ». La difficulté créée par le contexte galiléen est préservée et signalée en note plutôt qu’harmonisée.
theological_decisions:
- issue: La référence géographique à la Judée dans un contexte narratif galiléen
  choice: Judée
  alternative: Galilée; ou « Judée » au sens large de territoire juif
  rationale: La traduction suit la leçon du SBLGNT sans l’harmoniser avec le contexte immédiat. La variante « Galilée » est signalée, tandis que le sens géographique exact de « Judée » reste ouvert.
translation_notes:
  register: Français international moderne, naturel et digne. « Continuait à prêcher » explicite sans excès la valeur durative ou répétée de la construction grecque; la variante géographique est conservée en note.
