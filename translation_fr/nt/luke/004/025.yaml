source:
  edition: SBLGNT
  text: ἐπ’ ἀληθείας δὲ λέγω ὑμῖν, πολλαὶ χῆραι ἦσαν ἐν ταῖς ἡμέραις Ἠλίου ἐν τῷ Ἰσραήλ, ὅτε ἐκλείσθη ὁ οὐρανὸς ⸀ἐπὶ ἔτη τρία καὶ μῆνας ἕξ, ὡς ἐγένετο λιμὸς μέγας ἐπὶ πᾶσαν τὴν γῆν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/025.yaml
  text: But I tell you truly, there were many widows in Israel in the days of Elijah, when the sky was shut up for three years and six months, as a great famine came over all the land.
translation:
  language: fr
  text: 'Mais, en vérité, je vous le dis : il y avait beaucoup de veuves en Israël, à l’époque d’Élie, lorsque le ciel fut fermé pendant trois ans et six mois et qu’une grande famine survint dans tout le pays.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπ’ ἀληθείας
  choice: en vérité
  rationale: Conserve l’affirmation solennelle de véracité tout en restant naturelle et digne en français.
- source_word: ἐν ταῖς ἡμέραις Ἠλίου
  choice: à l’époque d’Élie
  rationale: Exprime naturellement l’hébraïsme « aux jours d’Élie » sans en modifier le sens temporel.
- source_word: ἐκλείσθη ὁ οὐρανός
  choice: le ciel fut fermé
  rationale: Préserve l’image et la voix passive du grec, sans expliciter à sa place que la pluie cessa.
- source_word: λιμὸς μέγας
  choice: une grande famine
  rationale: Rend directement l’intensité indiquée par μέγας.
- source_word: ἐπὶ πᾶσαν τὴν γῆν
  choice: tout le pays
  rationale: Dans ce récit lié à Israël et à Élie, γῆ peut désigner le territoire touché; « pays » évite de donner automatiquement à l’expression une portée mondiale.
theological_decisions:
- issue: Étendue géographique de la famine dans πᾶσαν τὴν γῆν
  choice: tout le pays
  alternative: toute la terre
  rationale: Le mot γῆ permet les deux lectures. Le contexte narratif favorise ici le territoire concerné, tandis que « toute la terre » pourrait suggérer sans nécessité une famine mondiale.
translation_notes:
  register: Français international moderne, clair et solennel. La syntaxe reste proche du mouvement de la phrase grecque, avec une coordination naturelle en français.
