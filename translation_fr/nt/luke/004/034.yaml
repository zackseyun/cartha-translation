id: LUK.4.34
reference: Luke 4:34
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸀Ἔα, τί ἡμῖν καὶ σοί, Ἰησοῦ Ναζαρηνέ; ἦλθες ἀπολέσαι ἡμᾶς; οἶδά σε τίς εἶ, ὁ ἅγιος τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/034.yaml
  text: Ah! What have you to do with us[e][d][c][b][a], Jesus of Nazareth? Have you come to destroy us? I know who you are—the Holy One of God.
translation:
  language: fr
  text: '« Ah ! Qu’y a-t-il entre nous et toi[a], Jésus de Nazareth[b] ? Es-tu venu pour nous détruire[c] ? Je sais qui tu es : le Saint de Dieu[d]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Quoi à nous et à toi ? » Tournure sémitisante exprimant la dissociation ou une protestation hostile.'
    reason: cultural_note
  - marker: b
    text: 'Ou : « Jésus le Nazaréen ».'
    reason: lexical_alternative
  - marker: c
    text: Le pluriel « nous » n’est pas expliqué dans le grec. Il peut représenter le démon parlant au nom d’autres démons ou avoir une portée plus large.
    reason: alternative_reading
  - marker: d
    text: 'Ou : « le Saint qui appartient à Dieu ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔα
  choice: Ah !
  rationale: Cette interjection exprime brusquement l’alarme ou la protestation. « Ah ! » conserve la forme d’un cri sans développer implicitement le sens en « Laisse-nous tranquilles ! ».
- source_word: τί ἡμῖν καὶ σοί
  choice: Qu’y a-t-il entre nous et toi ?
  rationale: Cette tournure, littéralement « quoi à nous et à toi ? », est un idiome sémitisant de dissociation ou de protestation hostile. La formulation choisie demeure naturelle en français tout en conservant sa distance conflictuelle.
- source_word: Ἰησοῦ Ναζαρηνέ
  choice: Jésus de Nazareth
  rationale: Le vocatif désigne Jésus par son association à Nazareth. « Jésus de Nazareth » est la formulation française la plus naturelle; « Jésus le Nazaréen » reste possible.
- source_word: ἦλθες ἀπολέσαι
  choice: Es-tu venu pour nous détruire ?
  rationale: L’aoriste interrogatif porte ici sur la venue de Jésus et son but redouté. « Es-tu venu » exprime naturellement en français l’effet présent de cette arrivée, et « détruire » rend directement ἀπόλλυμι.
- source_word: ἡμᾶς
  choice: nous
  rationale: Le pluriel est conservé sans en préciser le référent, puisque le grec ne dit pas explicitement si le démon parle au nom du monde démoniaque ou inclut autrement plusieurs êtres.
- source_word: οἶδά σε τίς εἶ
  choice: Je sais qui tu es
  rationale: Traduction française directe qui préserve l’affirmation de reconnaissance sans ajout explicatif.
- source_word: ὁ ἅγιος τοῦ θεοῦ
  choice: le Saint de Dieu
  rationale: Cette formulation conserve le titre christologique et la relation exprimée par le génitif, sans en développer ici la portée doctrinale.
theological_decisions:
- issue: Référent du pluriel ἡμᾶς dans la parole démoniaque
  choice: Conserver simplement « nous » sans identifier son référent.
  alternative: Le démon pourrait parler au nom du monde démoniaque, ou associer à sa parole une autre personne ou réalité.
  rationale: Le texte emploie le pluriel mais n’en définit pas l’étendue. La traduction préserve cette ambiguïté au lieu de la résoudre.
- issue: Titre christologique ὁ ἅγιος τοῦ θεοῦ
  choice: « le Saint de Dieu » sans expansion doctrinale.
  alternative: « celui qui est saint, envoyé par Dieu » ou une explicitation messianique.
  rationale: Le titre est théologiquement significatif, mais le verset n’en explicite pas toutes les implications. Il convient donc de le rendre tel quel.
translation_notes:
  register: Français international moderne, digne et oralement naturel. La ponctuation rend l’éclat du cri et la confrontation. Les idiomes sont traduits de manière intelligible sans effacer leur étrangeté biblique ni préciser les ambiguïtés du texte.
