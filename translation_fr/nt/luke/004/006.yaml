id: LUK.4.6
reference: Luke 4:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτῷ ὁ διάβολος· Σοὶ δώσω τὴν ἐξουσίαν ταύτην ἅπασαν καὶ τὴν δόξαν αὐτῶν, ὅτι ἐμοὶ παραδέδοται καὶ ᾧ ⸀ἂν θέλω δίδωμι αὐτήν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/006.yaml
  text: And the devil said to him[a], “I will give you all this authority and their glory, because it has been handed over to me, and I give it to whomever I want.”
translation:
  language: fr
  text: 'Le diable lui dit : « Je te donnerai toute cette autorité et leur gloire[a], car elle m’a été remise, et je la donne à qui je veux. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leur splendeur ». Le mot grec peut désigner ici la gloire, la splendeur ou la magnificence.
    reason: lexical_alternative
lexical_decisions:
- source_word: διάβολος
  choice: le diable
  rationale: Dans le récit de la tentation, le terme désigne personnellement Satan ; le titre français courant convient mieux que le sens étymologique « calomniateur ».
- source_word: Σοὶ δώσω
  choice: Je te donnerai
  rationale: Le pronom grec placé en tête porte une certaine emphase ; la formulation française reste naturelle tout en mettant le destinataire immédiatement après le sujet.
- source_word: ἐξουσίαν
  choice: autorité
  rationale: Le mot désigne ici l’autorité ou le droit d’exercer une domination, plutôt que la seule puissance brute.
- source_word: ταύτην ἅπασαν
  choice: toute cette
  rationale: Cette tournure française rend à la fois le démonstratif et l’idée de totalité exprimée par ἅπασαν.
- source_word: δόξαν αὐτῶν
  choice: leur gloire
  rationale: « Gloire » conserve la portée biblique de δόξα, tandis que le pronom renvoie aux royaumes montrés au verset précédent ; dans ce contexte, le terme peut aussi désigner leur splendeur.
- source_word: παραδέδοται
  choice: elle m’a été remise
  rationale: Le parfait passif indique une remise antérieure dont le résultat demeure. Le féminin singulier reprend naturellement « autorité » sans suggérer que le narrateur valide la prétention du diable.
- source_word: ᾧ ἂν θέλω
  choice: à qui je veux
  rationale: Cette expression française naturelle conserve l’idée que le diable revendique la liberté de choisir le bénéficiaire.
- source_word: δίδωμι αὐτήν
  choice: je la donne
  rationale: Le présent simple rend l’action générale ou habituelle, et le pronom féminin reprend clairement « autorité ».
theological_decisions:
- issue: La formulation pourrait-elle sembler confirmer que le diable possède légitimement l’autorité sur les royaumes ?
  choice: Rapporter directement son affirmation, sans la renforcer ni la mettre à distance dans la traduction.
  alternative: Ajouter une réserve telle que « prétend-il » ou « selon lui ».
  rationale: Le grec présente ces mots comme le discours direct du diable. La traduction doit préserver cette tension narrative sans transformer sa déclaration en affirmation du narrateur ni lui ajouter un commentaire doctrinal.
translation_notes:
  register: Français international moderne, naturel et digne. La ponctuation française du discours direct est employée. Le féminin des pronoms « elle » et « la » rattache clairement la proposition à « autorité », conformément au singulier grec αὐτήν.
