source:
  edition: SBLGNT
  text: Ἀναστὰς δὲ ⸀ἀπὸ τῆς συναγωγῆς εἰσῆλθεν εἰς τὴν οἰκίαν Σίμωνος. πενθερὰ δὲ τοῦ Σίμωνος ἦν συνεχομένη πυρετῷ μεγάλῳ, καὶ ἠρώτησαν αὐτὸν περὶ αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/038.yaml
  text: And after rising from the synagogue[a], he entered Simon’s house. Now Simon’s mother-in-law was afflicted with a high fever, and they asked him about her.
translation:
  language: fr
  text: Après avoir quitté la synagogue, il entra dans la maison de Simon. Or, la belle-mère de Simon était en proie à une forte fièvre, et ils lui parlèrent d’elle[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ils le prièrent d’intervenir pour elle ». Le grec dit qu’ils s’adressèrent à lui à son sujet ; dans ce contexte, il s’agit probablement d’une demande d’aide.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀναστὰς δὲ ἀπὸ τῆς συναγωγῆς
  choice: Puis il se leva, quitta la synagogue
  rationale: Le participe aoriste Ἀναστάς exprime une action antérieure à l’entrée dans la maison, tandis que ἀπό marque l’éloignement du lieu. La coordination française restitue naturellement la succession des actions.
- source_word: εἰσῆλθεν εἰς τὴν οἰκίαν Σίμωνος
  choice: entra dans la maison de Simon
  rationale: εἰσέρχομαι avec εἰς indique l’entrée dans un lieu. Cette formulation est directe et idiomatique en français.
- source_word: πενθερὰ τοῦ Σίμωνος
  choice: la belle-mère de Simon
  rationale: πενθερά désigne précisément la mère de l’épouse, ou plus généralement la belle-mère par alliance. Le lien familial est rendu sans explicitation supplémentaire.
- source_word: ἦν συνεχομένη
  choice: était en proie à
  rationale: La construction périphrastique passive décrit une personne tenue ou accablée par la maladie. « Être en proie à » conserve cette force tout en restant naturel.
- source_word: πυρετῷ μεγάλῳ
  choice: une forte fièvre
  rationale: μέγας intensifie ici πυρετός. « Forte fièvre » rend clairement la gravité indiquée sans employer une expression médicalement plus précise que le grec.
- source_word: ἠρώτησαν αὐτὸν περὶ αὐτῆς
  choice: ils l’interrogèrent à son sujet
  rationale: ἐρωτάω peut signifier interroger ou adresser une demande, et περί signifie « au sujet de ». Le texte principal reste proche de la formulation grecque, tandis que la note signale la valeur probable de requête dans ce contexte.
theological_decisions:
- issue: Conséquence possible du terme πενθερά pour la situation matrimoniale de Simon
  choice: Rendre simplement le lien familial par « belle-mère de Simon ».
  alternative: Expliciter que Simon était marié.
  rationale: Le lien familial implique naturellement une alliance matrimoniale, mais le verset n’en tire lui-même aucune conclusion doctrinale ou historique.
- issue: Portée de la demande exprimée par ἠρώτησαν αὐτὸν περὶ αὐτῆς
  choice: Conserver dans le texte la formulation peu explicite « ils l’interrogèrent à son sujet ».
  alternative: « Ils le prièrent d’intervenir en sa faveur. »
  rationale: Le contexte laisse fortement entendre une demande d’aide ou de guérison, mais la tournure grecque ne précise pas expressément l’intervention attendue. La note préserve cette nuance contextuelle sans l’imposer au texte principal.
translation_notes:
  register: Français international moderne, digne et accessible. La narration demeure concise ; « or » marque le passage à l’état de la belle-mère, et la note conserve l’ambiguïté entre question et requête.
