    rationale: « Lui adressèrent une demande à son sujet » est syntaxiquement et sémantiquement moins clair que le grec. Il vaut mieux indiquer simplement que le grec dit qu’ils lui demandèrent/parlèrent à son sujet et que le contexte suggère une demande d’aide.
