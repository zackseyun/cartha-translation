  source_fidelity: Le mouvement depuis la synagogue, l’entrée dans la maison de Simon, le lien de belle-mère et la forte fièvre sont fidèlement rendus. Pour ἠρώτησαν αὐτὸν περὶ αὐτῆς, « ils l’interrogèrent » suggère en français un interrogatoire ou une série de questions et ne rend pas bien la nuance d’une démarche faite auprès de Jésus au sujet de la malade.
  naturalness: « Après avoir quitté la synagogue » est plus idiomatique et exprime naturellement la valeur circonstancielle de Ἀναστάς avec ἀπό. « Ils lui parlèrent d’elle » est la formulation française narrative naturelle pour la démarche, sans imposer explicitement la demande de guérison.
  terminology: « Belle-mère », « forte fièvre », « synagogue » et « Simon » conviennent au français international moderne et respectent le sens grec. La note doit présenter l’alternative de requête sans qualifier de littérale une paraphrase française imprécise.
