    issue: « ils l’interrogèrent à son sujet »
    rationale: En français moderne, « interroger quelqu’un » évoque normalement le fait de le questionner de manière soutenue. ἐρωτάω περὶ αὐτῆς désigne ici une démarche ou une demande faite auprès de lui à propos d’elle; le contexte peut impliquer une requête d’aide, mais le grec ne la formule pas explicitement.
  - severity: low
