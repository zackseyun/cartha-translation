id: LUK.4.40
reference: Luke 4:40
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Δύνοντος δὲ τοῦ ἡλίου ⸀ἅπαντες ὅσοι εἶχον ἀσθενοῦντας νόσοις ποικίλαις ἤγαγον αὐτοὺς πρὸς αὐτόν· ὁ δὲ ἑνὶ ἑκάστῳ αὐτῶν τὰς χεῖρας ⸂ἐπιτιθεὶς ἐθεράπευεν⸃ αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/040.yaml
  text: When the sun was setting[a], all who had people sick with various diseases brought them to him; and he laid his hands on each one of them and healed them.
translation:
  language: fr
  text: Alors que le soleil se couchait[a], tous ceux qui avaient auprès d’eux des malades atteints de diverses maladies les lui amenèrent. Jésus posa les mains sur chacun d’eux et les guérit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Au coucher du soleil. » Le grec emploie une construction qui présente le coucher du soleil comme contemporain de ces événements.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Δύνοντος δὲ τοῦ ἡλίου
  choice: Au coucher du soleil
  rationale: Le génitif absolu avec le participe présent situe la scène pendant que le soleil se couche. Cette formulation française est naturelle et conserve la valeur temporelle, tandis que la note signale une traduction plus explicitement progressive.
- source_word: ἅπαντες ὅσοι
  choice: tous ceux qui
  rationale: La tournure rend clairement la portée exhaustive et distributive de la combinaison grecque.
- source_word: εἶχον ἀσθενοῦντας
  choice: avaient auprès d’eux des malades
  rationale: Dans ce contexte, ἔχω désigne des personnes malades relevant de l’entourage ou des soins de quelqu’un. « Auprès d’eux » évite de suggérer la possession tout en gardant ce lien implicite.
- source_word: νόσοις ποικίλαις
  choice: atteints de diverses maladies
  rationale: La formulation exprime naturellement en français la diversité des affections indiquée par ποικίλαις.
- source_word: ἤγαγον αὐτοὺς πρὸς αὐτόν
  choice: les lui amenèrent
  rationale: ἄγω signifie ici amener les malades jusqu’à Jésus; le double pronom français restitue sans lourdeur les deux référents.
- source_word: ἑνὶ ἑκάστῳ αὐτῶν
  choice: chacun d’eux
  rationale: Cette expression préserve l’accent distributif du grec sur l’attention accordée individuellement à chaque malade.
- source_word: τὰς χεῖρας ἐπιτιθεὶς
  choice: posa les mains sur
  rationale: La formule rend concrètement le geste décrit, sans lui attribuer de portée rituelle supplémentaire.
- source_word: ἐθεράπευεν
  choice: les guérit
  rationale: L’imparfait grec présente une action répétée au fil des personnes; en français, le passé simple accompagné de « chacun d’eux » transmet naturellement cette succession.
theological_decisions:
- issue: Imposition des mains
  choice: Jésus posa les mains sur chacun d’eux
  alternative: il imposait les mains à chacun d’eux
  rationale: « Posa les mains sur » décrit le geste physique de façon directe et actuelle, sans importer les connotations sacramentelles ou ecclésiales que « imposer les mains » pourrait recevoir.
translation_notes:
  register: Français international moderne, clair et digne. Le nom « Jésus » remplace ici le pronom grec afin de lever une ambiguïté référentielle naturelle en français. Le passé simple convient au registre narratif biblique sans être archaïque.
