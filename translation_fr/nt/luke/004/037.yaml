  text: And news about him was spreading into every place in the surrounding region[a].
translation:
  language: fr
  text: Et la nouvelle à son sujet se répandait partout dans la région environnante.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « La nouvelle à son sujet se propageait dans chaque localité de la région environnante. »'
    reason: Alternative plus explicite pour la valeur distributive de εἰς πάντα τόπον et pour le mouvement continu exprimé par ἐξεπορεύετο.
lexical_decisions:
- source_word: καὶ
  choice: Et
  rationale: Conserve le lien narratif simple avec l’événement précédent sans ajouter de nuance causale ou temporelle.
- source_word: ἐξεπορεύετο
  choice: se répandait
  rationale: L’imparfait exprime une action continue dans le passé. Avec ἦχος pour sujet, « se répandait » rend naturellement en français l’idée d’une nouvelle qui circulait, tout en conservant son mouvement vers l’extérieur.
- source_word: ἦχος
  choice: la nouvelle
  rationale: Le mot peut littéralement désigner un son ou un bruit, mais, avec « à son sujet » dans ce contexte, il renvoie à ce qui se disait de Jésus. « La nouvelle » est clair et idiomatique.
- source_word: περὶ αὐτοῦ
  choice: à son sujet
  rationale: Rend directement le contenu de la nouvelle, dans un français naturel.
- source_word: εἰς πάντα τόπον
  choice: partout
  rationale: Rend idiomatiquement la valeur distributive de « chaque lieu »; la note conserve une formulation plus proche de la structure grecque.
- source_word: τῆς περιχώρου
  choice: dans la région environnante
  rationale: περίχωρος désigne le territoire ou la région des alentours. Cette formulation conserve la portée géographique et reste naturelle en français.
theological_decisions: []
translation_notes:
  register: Français international moderne, simple et digne. La formulation principale privilégie une expression courante tout en conservant l’imparfait duratif du grec; la note signale une traduction plus formelle de l’image source.
