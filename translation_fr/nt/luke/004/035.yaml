reference: Luke 4:35
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἐπετίμησεν αὐτῷ ὁ Ἰησοῦς λέγων· Φιμώθητι καὶ ἔξελθε ⸀ἀπ’ αὐτοῦ. καὶ ῥίψαν αὐτὸν τὸ δαιμόνιον εἰς ⸀τὸ μέσον ἐξῆλθεν ἀπ’ αὐτοῦ μηδὲν βλάψαν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/035.yaml
  text: And Jesus rebuked it[a], saying, “Be silent and come out of him.” And after throwing him into the midst[b], the demon came out of him without harming him at all.
translation:
  language: fr
  text: 'Jésus le réprimanda en disant : « Tais-toi[a] et sors de lui ! » Après l’avoir jeté au milieu, le démon sortit de lui sans lui faire aucun mal.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Sois muselé. »'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπετίμησεν αὐτῷ
  choice: le réprimanda
  rationale: Le verbe exprime une réprimande ou un ordre sévère. Le pronom masculin français renvoie naturellement au démon mentionné dans le contexte.
- source_word: Φιμώθητι
  choice: Tais-toi
  rationale: L’impératif signifie littéralement « être muselé », mais commande ici énergiquement le silence. « Tais-toi » est direct et naturel; l’image littérale est conservée en note.
- source_word: ἔξελθε ἀπ’ αὐτοῦ
  choice: sors de cet homme
  rationale: Cette formulation française rend clairement l’ordre d’expulsion. « Cet homme » explicite sans ambiguïté le référent humain du pronom grec.
- source_word: ῥίψαν αὐτὸν … εἰς τὸ μέσον
  choice: après avoir jeté l’homme au milieu de tous
  rationale: Le participe aoriste présente l’action comme antérieure ou étroitement liée à la sortie du démon. « Au milieu de tous » exprime naturellement le cadre collectif implicite de εἰς τὸ μέσον sans ajouter l’idée de chute, absente du grec.
- source_word: τὸ δαιμόνιον
  choice: le démon
  rationale: « Démon » est l’équivalent direct de δαιμόνιον et respecte la présentation narrative d’un être spirituel auquel Jésus s’adresse.
- source_word: μηδὲν βλάψαν αὐτόν
  choice: sans lui faire aucun mal
  rationale: Cette tournure française naturelle conserve la négation absolue et souligne que l’homme n’a subi aucun dommage.
theological_decisions:
- issue: Nature et rôle du δαιμόνιον
  choice: Présenter le démon comme un être spirituel personnel que Jésus réprimande et qui sort de l’homme.
  alternative: Reformuler le démon comme une force impersonnelle ou une simple affection humaine.
  rationale: Le récit grec emploie l’adresse directe, un ordre de sortie et le verbe de départ; la traduction ne doit ni dépersonnaliser ni réinterpréter ces éléments.
translation_notes:
  register: Français international moderne, digne et accessible. Les ordres de Jésus restent brefs et fermes. La syntaxe finale est fluidifiée sans atténuer la violence de la manifestation ni l’absence totale de dommage.
