- from: 'Jésus le réprimanda en disant : « Tais-toi[a] et sors de cet homme ! » Après avoir jeté l’homme au milieu de tous, le démon sortit de lui sans lui faire aucun mal.'
  to: 'Jésus le réprimanda en disant : « Tais-toi[a] et sors de lui ! » Après l’avoir jeté au milieu, le démon sortit de lui sans lui faire aucun mal.'
  rationale: La révision retire les explicitations non nécessaires (« de tous », « cet homme »), afin de suivre de plus près l’ambiguïté et la concision du grec, tout en conservant un français naturel et clair. Aucun changement théologique ou interprétatif n’est introduit.
