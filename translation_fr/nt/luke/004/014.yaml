id: LUK.4.14
reference: Luke 4:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ ὑπέστρεψεν ὁ Ἰησοῦς ἐν τῇ δυνάμει τοῦ πνεύματος εἰς τὴν Γαλιλαίαν. καὶ φήμη ἐξῆλθεν καθ’ ὅλης τῆς περιχώρου περὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/014.yaml
  text: And Jesus returned to Galilee in the power of the Spirit[a], and a report about him went out through all the surrounding region.
translation:
  language: fr
  text: Jésus retourna en Galilée dans la puissance de l’Esprit, et la nouvelle[a] à son sujet se répandit dans toute la région environnante.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le bruit », « la renommée » ou « une rumeur ». Le terme grec désigne une information qui se diffuse largement, sans préciser en lui-même si elle est favorable ou défavorable.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπέστρεψεν
  choice: retourna
  rationale: L'aoriste narratif de ὑποστρέφω exprime le retour de Jésus; le passé simple convient au récit biblique écrit et reste naturel en français.
- source_word: ἐν τῇ δυνάμει
  choice: dans la puissance
  rationale: Cette formulation conserve la préposition et laisse ouverte la nuance de sphère ou de manière, sans réduire l'expression à une simple instrumentalité.
- source_word: τοῦ πνεύματος
  choice: de l'Esprit
  rationale: Le contexte immédiat de Luc désigne l'Esprit Saint, mais l'adjectif « saint », absent de ce verset grec, n'est pas ajouté.
- source_word: εἰς τὴν Γαλιλαίαν
  choice: en Galilée
  rationale: En français, « retourner en Galilée » est la tournure idiomatique pour cette destination.
- source_word: φήμη
  choice: la nouvelle
  rationale: φήμη désigne ici une information ou un bruit qui circule. « La nouvelle » est fluide et ne lui impose ni la valeur positive de « renommée » ni la valeur négative de « rumeur ».
- source_word: ἐξῆλθεν
  choice: se répandit
  rationale: Le français exprime naturellement par « se répandre » le mouvement figuré d'une nouvelle qui sort et circule.
- source_word: καθ’ ὅλης τῆς περιχώρου
  choice: dans toute la région environnante
  rationale: La formulation rend la distribution dans l'ensemble du territoire alentour et le sens géographique de περίχωρος.
- source_word: περὶ αὐτοῦ
  choice: à son sujet
  rationale: Expression française actuelle et précise pour περί avec le génitif.
theological_decisions:
- issue: Référent de πνεύματος
  choice: « l'Esprit » désigne l'Esprit Saint
  alternative: un esprit non spécifié
  rationale: Dans le contexte de Luc 4, il s'agit de l'Esprit Saint. La traduction garde toutefois la forme plus concise du grec et n'ajoute pas « Saint ».
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple soutient le registre narratif écrit. La syntaxe demeure proche du grec tout en employant l'expression idiomatique « la nouvelle se répandit ».
