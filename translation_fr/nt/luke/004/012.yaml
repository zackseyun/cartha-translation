  text: καὶ ἀποκριθεὶς εἶπεν αὐτῷ ὁ Ἰησοῦς ὅτι Εἴρηται· Οὐκ ἐκπειράσεις κύριον τὸν θεόν σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/012.yaml
  text: 'And Jesus answered him[b][a], “It is said: You shall not put the Lord your God to the test.”'
translation:
  language: fr
  text: 'Jésus lui répondit : « Il est dit[a] : Tu ne mettras pas à l’épreuve le Seigneur, ton Dieu[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La tradition traduit souvent : « Il est écrit. » Le grec emploie le verbe « dire », et non « écrire ».'
    reason: alternative_reading
  - marker: b
    text: Citation de Deutéronome 6.16, où le texte hébreu porte le nom divin YHWH, souvent rendu par « le SEIGNEUR ».
    reason: cross_reference
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν αὐτῷ
  choice: Jésus lui répondit
  rationale: La construction participiale suivie d’un verbe fini est un idiome grec, marqué par l’usage sémitique, qui signifie naturellement « répondre ». Le pronom renvoie à l’interlocuteur de Jésus dans le contexte.
- source_word: ὅτι
  choice: —
  rationale: Après « répondit », le français introduit naturellement les paroles directes par deux-points, sans rendre explicitement ὅτι.
- source_word: Εἴρηται
  choice: Il est dit
  rationale: Le parfait passif de λέγω signifie littéralement « il a été dit » ou « cela demeure dit ». « Il est dit » conserve le verbe grec et fonctionne comme formule de citation faisant autorité.
- source_word: Οὐκ ἐκπειράσεις
  choice: Tu ne mettras pas à l’épreuve
  rationale: ἐκπειράζω signifie éprouver ou mettre à l’épreuve. Cette formulation claire évite le sens moderne de « tenter », qui pourrait suggérer une incitation au péché.
- source_word: κύριον τὸν θεόν σου
  choice: le Seigneur ton Dieu
  rationale: La formulation garde l’apposition du grec et l’expression d’alliance de la citation. « Seigneur » traduit κύριος, tandis que « ton Dieu » rend τὸν θεόν σου.
theological_decisions:
- issue: Formule de citation scripturaire (Εἴρηται)
  choice: Il est dit
  alternative: Il est écrit ; Il a été dit
  rationale: Le grec emploie le parfait passif de λέγω, non γράφω. Le texte principal suit donc la forme grecque sans remplacer la formule par la tournure traditionnelle « Il est écrit ».
- issue: κύριος dans la citation de Deutéronome 6.16
  choice: le Seigneur
  alternative: YHWH ; l’Éternel
  rationale: Le texte grec de Luc porte κύριον. La traduction principale suit cette forme, tout en signalant que le passage hébreu cité contient le nom divin YHWH.
translation_notes:
  register: Français international moderne, naturel et digne. Le futur à valeur d’interdiction (« Tu ne mettras pas ») conserve la force de la citation biblique et son adresse à la deuxième personne du singulier. Les deux notes sont placées après la citation, dans l’ordre correspondant à leur point d’ancrage conceptuel.
