id: LUK.4.2
reference: Luke 4:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἡμέρας τεσσεράκοντα πειραζόμενος ὑπὸ τοῦ διαβόλου. καὶ οὐκ ἔφαγεν οὐδὲν ἐν ταῖς ἡμέραις ἐκείναις, καὶ συντελεσθεισῶν ⸀αὐτῶν ἐπείνασεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/002.yaml
  text: for forty days, being tempted by the devil. And he ate nothing during those days, and when they were completed, he was hungry.
translation:
  language: fr
  text: pendant quarante jours, tenté[a] par le diable. Il ne mangea rien durant ces jours-là et, lorsqu’ils furent achevés, il eut faim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « mis à l’épreuve ». Le verbe grec peut avoir les deux sens; « tenté » convient mieux ici puisque l’agent est le diable.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμέρας τεσσεράκοντα
  choice: pendant quarante jours
  rationale: L’accusatif exprime la durée; « pendant » la rend explicitement et naturellement en français.
- source_word: πειραζόμενος
  choice: tenté
  rationale: Le verbe peut signifier « tenter » ou « mettre à l’épreuve ». Avec le diable comme agent, « tenté » convient le mieux au contexte, tandis que l’autre possibilité est signalée en note.
- source_word: ὑπὸ τοῦ διαβόλου
  choice: par le diable
  rationale: Dans ce contexte, διάβολος est la désignation personnelle courante du diable; une traduction étymologique comme « le calomniateur » obscurcirait le référent.
- source_word: οὐκ ἔφαγεν οὐδὲν
  choice: Il ne mangea rien
  rationale: Cette formulation française naturelle conserve la négation forte et directe du grec.
- source_word: ἐν ταῖς ἡμέραις ἐκείναις
  choice: durant ces jours-là
  rationale: « Durant » exprime clairement l’étendue temporelle, et « ces jours-là » reprend le démonstratif grec.
- source_word: συντελεσθεισῶν αὐτῶν
  choice: lorsqu’ils furent achevés
  rationale: La construction absolue au génitif devient une proposition temporelle; le pronom reprend les jours et le passif conserve l’idée de leur accomplissement.
- source_word: ἐπείνασεν
  choice: il eut faim
  rationale: Cette expression idiomatique rend sobrement l’apparition ou la constatation de la faim au terme de la période.
theological_decisions:
- issue: Sens de πειραζόμενος dans l’expérience de Jésus au désert
  choice: tenté
  alternative: mis à l’épreuve
  rationale: La présence du diable comme agent favorise le sens hostile de « tenter », sans développer ni résoudre ici les questions doctrinales liées à la tentation de Jésus. L’ambiguïté lexicale réelle est conservée en note.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple convient au registre narratif biblique sans être archaïque. La phrase conserve le lien syntaxique avec le verset précédent, puisqu’elle commence par un complément de durée suivi d’un participe.
