  text: κηρύξαι ἐνιαυτὸν κυρίου δεκτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/019.yaml
  text: to proclaim the favorable year of the Lord[a][b].
translation:
  language: fr
  text: pour proclamer l’année de faveur du Seigneur[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « pour proclamer l’année où le Seigneur accorde sa faveur ».'
    reason: lexical_alternative
  - marker: b
    text: 'Traduction traditionnelle : « l’année acceptable du Seigneur ». Cette expression fait écho à Ésaïe 61.2 et peut évoquer l’année du jubilé.'
    reason: cross_reference
lexical_decisions:
- source_word: κηρύξαι
  choice: proclamer
  rationale: L’infinitif aoriste poursuit la série exprimant le but dans le contexte précédent. « Proclamer » conserve l’idée d’une annonce publique et solennelle, sans la restreindre à la prédication.
- source_word: ἐνιαυτὸν
  choice: année
  rationale: Le terme désigne normalement une année. Le conserver respecte l’écho à Ésaïe 61.2 et laisse ouverte une possible résonance avec l’année du jubilé.
- source_word: κυρίου
  choice: du Seigneur
  rationale: « Seigneur » est l’équivalent français naturel de κύριος ici. Le génitif est rendu par « du Seigneur », formulation qui préserve le lien étroit avec « faveur » et l’allusion scripturaire.
- source_word: δεκτόν
  choice: de faveur
  rationale: Dans cette expression, δεκτός qualifie une période agréée et favorable, marquée par la faveur divine. « Année de faveur » est idiomatique en français biblique moderne et plus clair que « année acceptable ».
theological_decisions:
- issue: Allusion à Ésaïe 61.2 et possible résonance avec le jubilé
  choice: Conserver « année » et « faveur » dans le texte sans ajouter explicitement « jubilé ».
  alternative: l’année acceptable du Seigneur ; le jubilé du Seigneur
  rationale: Le grec reprend Ésaïe 61.2 et peut évoquer le jubilé, mais il ne contient pas le terme « jubilé ». La traduction maintient donc l’allusion sans transformer une résonance possible en affirmation explicite.
- issue: Traduction de κύριος
  choice: Seigneur
  alternative: SEIGNEUR ; Maître
  rationale: « Seigneur » correspond directement à κύριος et convient à la citation d’Ésaïe, tout en évitant de préciser dans le texte principal si la convention du nom divin doit être explicitement marquée.
translation_notes:
  register: Français international moderne, naturel et digne. « Proclamer » garde la portée publique de l’annonce ; « année de faveur du Seigneur » restitue l’expression idiomatiquement sans expliciter au-delà du grec ses possibles résonances jubilaires.
