  text: καὶ πάντες ἐμαρτύρουν αὐτῷ καὶ ἐθαύμαζον ἐπὶ τοῖς λόγοις τῆς χάριτος τοῖς ἐκπορευομένοις ἐκ τοῦ στόματος αὐτοῦ, καὶ ἔλεγον· ⸂Οὐχὶ υἱός ἐστιν Ἰωσὴφ οὗτος⸃;
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/022.yaml
  text: And all were speaking well of him and were marveling at the gracious words coming from his mouth[a], and they were saying[b], “Is this not Joseph’s son?”
translation:
  language: fr
  text: 'Tous disaient du bien de lui[a] et s’émerveillaient des paroles de grâce[b] qui sortaient de sa bouche. Ils disaient : « Celui-ci n’est-il pas le fils de Joseph ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « lui rendaient témoignage » ou « témoignaient à son sujet ». L’expression grecque peut désigner un témoignage ; dans ce contexte, le sens d’une réaction favorable s’accorde bien avec leur émerveillement.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « paroles empreintes de grâce » ou « paroles agréables ». L’expression grecque peut évoquer la grâce, la faveur ou l’attrait.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμαρτύρουν αὐτῷ
  choice: parlaient de lui en bien
  rationale: Dans ce contexte, l’expression désigne probablement un témoignage favorable. Cette formulation française rend clairement l’approbation exprimée, en parallèle avec leur émerveillement.
- source_word: ἐθαύμαζον
  choice: s’émerveillaient
  rationale: L’imparfait exprime une réaction continue, et « s’émerveillaient » conserve l’idée d’étonnement admiratif.
- source_word: ἐπὶ τοῖς λόγοις
  choice: des paroles
  rationale: Avec ἐπί et le datif, l’expression indique ce qui suscite leur émerveillement. En français, « s’émerveiller de » est naturel.
- source_word: τῆς χάριτος
  choice: pleines de grâce
  rationale: Le génitif peut qualifier les paroles comme marquées par la grâce, la faveur ou l’attrait. « Pleines de grâce » reste naturel tout en conservant le terme théologiquement évocateur « grâce ».
- source_word: τοῖς ἐκπορευομένοις ἐκ τοῦ στόματος αὐτοῦ
  choice: qui sortaient de sa bouche
  rationale: Cette formulation actuelle et concrète préserve l’image grecque et le lien grammatical avec les paroles.
- source_word: Οὐχὶ
  choice: n’est-il pas
  rationale: La tournure rend la question rhétorique grecque qui attend normalement une réponse affirmative.
- source_word: υἱός ἐστιν Ἰωσὴφ οὗτος
  choice: Celui-ci n’est-il pas le fils de Joseph ?
  rationale: « Le fils de Joseph » restitue directement la perception de la foule, tandis que « celui-ci » conserve l’élément démonstratif οὗτος.
theological_decisions:
- issue: Désignation de Jésus comme fils de Joseph malgré la conception virginale
  choice: 'Rapporter sans correction la question de la foule : « le fils de Joseph »'
  alternative: Ajouter une précision indiquant qu’il était seulement considéré comme le fils de Joseph
  rationale: Le verset rapporte la perception de la foule et non une correction du narrateur. Une précision doctrinale ajoutée ici supprimerait la tension narrative du texte.
- issue: Portée de τῆς χάριτος
  choice: « paroles pleines de grâce »
  alternative: « paroles agréables » ou « paroles de grâce »
  rationale: Le grec permet une nuance de faveur, d’attrait ou de grâce. La traduction retenue préserve cette richesse sans réduire l’expression à la seule éloquence ni lui imposer un sens sotériologique exclusif.
translation_notes:
  register: Français international moderne, naturel et digne. L’imparfait restitue les réactions continues de la foule. La coordination est divisée en deux phrases pour éviter une accumulation lourde, sans modifier la progression du verset.
