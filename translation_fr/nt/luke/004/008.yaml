id: LUK.4.8
reference: Luke 4:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ⸂ὁ Ἰησοῦς εἶπεν αὐτῷ⸃· Γέγραπται· ⸂Κύριον τὸν θεόν σου προσκυνήσεις⸃ καὶ αὐτῷ μόνῳ λατρεύσεις.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/008.yaml
  text: 'And Jesus answered him[a], “It is written: ‘You shall worship the Lord your God[b], and you shall serve only him.’”'
translation:
  language: fr
  text: 'Jésus lui répondit : « Il est écrit : “Tu adoreras[a] le Seigneur ton Dieu, et c’est lui seul que tu serviras.” »[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « tu te prosterneras devant » le Seigneur ton Dieu.'
    reason: lexical_alternative
  - marker: b
    text: Cette citation fait écho à Deutéronome 6.13.
    reason: cross_reference
lexical_decisions:
- source_word: καὶ ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν αὐτῷ
  choice: Jésus lui répondit
  rationale: La tournure grecque associe un participe aoriste à un verbe déclaratif. Le français narratif naturel les réunit dans « répondit », tout en conservant le destinataire exprimé par αὐτῷ.
- source_word: Γέγραπται
  choice: Il est écrit
  rationale: Ce parfait passif sert de formule consacrée pour introduire une citation de l’Écriture et exprime la validité durable du texte cité.
- source_word: Κύριον τὸν θεόν σου
  choice: le Seigneur ton Dieu
  rationale: Traduction directe qui respecte le titre κύριος dans le texte grec et la relation d’alliance marquée par « ton Dieu ».
- source_word: προσκυνήσεις
  choice: tu adoreras
  rationale: Dans ce contexte de dévotion exclusive envers Dieu, « adorer » rend clairement la portée religieuse du verbe. Une note conserve l’image plus concrète de la prosternation.
- source_word: λατρεύσεις
  choice: tu serviras
  rationale: Le verbe désigne le service rendu à une divinité. « Servir » est naturel et digne en français, tandis que le contexte cultuel en précise le sens.
- source_word: αὐτῷ μόνῳ
  choice: c’est lui seul que
  rationale: 'La construction détachée met naturellement en relief, en français, l’exclusivité portée par μόνῳ : le service revient à Dieu seul.'
theological_decisions:
- issue: Traduction de κύριος dans une citation scripturaire désignant Dieu
  choice: Seigneur
  alternative: l’Éternel
  rationale: Le texte grec de Luc porte κύριον. « Seigneur » traduit directement ce terme sans importer dans le texte néotestamentaire une restitution particulière du nom divin hébreu.
- issue: Portée de προσκυνέω
  choice: adorer
  alternative: se prosterner devant
  rationale: « Adorer » exprime le sens religieux requis par le contexte, sans supprimer la nuance gestuelle du grec, signalée en note.
- issue: Exclusivité de αὐτῷ μόνῳ
  choice: c’est lui seul que tu serviras
  alternative: tu ne serviras que lui
  rationale: La formulation retenue conserve positivement la structure de la citation et souligne que Dieu est l’unique destinataire du service cultuel.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe narrative est allégée sans perte de sens, et la mise en relief « c’est lui seul » préserve l’accent grec sur l’exclusivité.
