  source_fidelity: 'Le texte rend fidèlement les éléments grecs : « plein de l’Esprit saint » pour πλήρης πνεύματος ἁγίου, « revint du Jourdain » pour ὑπέστρεψεν ἀπὸ τοῦ Ἰορδάνου, et l’imparfait passif « était conduit » pour ἤγετο. « Par l’Esprit » explicite naturellement la valeur agentive la plus probable de ἐν τῷ πνεύματι, tandis que la note conserve l’alternative littérale. « Dans le désert » rend correctement ἐν τῇ ἐρήμῳ sans surdéterminer le paysage.'
  naturalness: La phrase est fluide, sobre et adaptée à un français international moderne. L’alternance du passé simple (« revint ») et de l’imparfait passif (« était conduit ») restitue bien la progression narrative et l’aspect du grec. L’omission d’un équivalent autonome pour δέ est idiomatique en français.
  terminology: « Esprit saint » et « l’Esprit » maintiennent le lien contextuel et le registre biblique sans imposer de développement doctrinal. « Désert » est un choix courant et sémantiquement suffisamment large. L’ancre de note est placée sur « l’Esprit », précisément là où se situe la nuance de ἐν τῷ πνεύματι.
