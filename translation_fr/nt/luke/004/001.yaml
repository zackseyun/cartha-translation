id: LUK.4.1
reference: Luke 4:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἰησοῦς δὲ ⸂πλήρης πνεύματος ἁγίου⸃ ὑπέστρεψεν ἀπὸ τοῦ Ἰορδάνου, καὶ ἤγετο ἐν τῷ πνεύματι ⸂ἐν τῇ ἐρήμῳ⸃
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/001.yaml
  text: And Jesus[a], full of the Holy Spirit, returned from the Jordan and was being led by the Spirit in the wilderness.
translation:
  language: fr
  text: Jésus, plein de l’Esprit saint, revint du Jourdain et était conduit par l’Esprit[a] dans le désert.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans l’Esprit ». L’expression grecque peut se traduire plus littéralement ainsi, mais elle signifie probablement ici que l’Esprit conduisait Jésus.
    reason: Alternative lexicale préservant la formulation et la nuance possibles de ἐν τῷ πνεύματι.
lexical_decisions:
- source_word: πλήρης πνεύματος ἁγίου
  choice: plein de l’Esprit saint
  rationale: « Plein de » rend directement πλήρης suivi du génitif et décrit l’état de Jésus sans suggérer nécessairement un nouvel événement où il aurait été rempli.
- source_word: ὑπέστρεψεν
  choice: revint
  rationale: Le passé simple convient au récit écrit et rend avec concision l’action achevée exprimée par l’aoriste.
- source_word: ἀπὸ τοῦ Ἰορδάνου
  choice: du Jourdain
  rationale: Le français nomme naturellement le fleuve « le Jourdain », sans qu’il soit nécessaire d’ajouter « fleuve ».
- source_word: ἤγετο
  choice: était conduit
  rationale: L’imparfait passif préserve à la fois la durée de l’action passée et la forme passive du grec.
- source_word: ἐν τῷ πνεύματι
  choice: par l’Esprit
  rationale: Avec le verbe passif, ἐν peut indiquer l’agent ou le moyen. « Par l’Esprit » exprime naturellement que l’Esprit conduisait Jésus, tout en signalant le même Esprit saint mentionné juste avant.
- source_word: ἐν τῇ ἐρήμῳ
  choice: dans le désert
  rationale: « Désert » est le terme français courant pour une région inhabitée ou désolée et n’impose pas nécessairement l’image d’une étendue de sable.
- source_word: δὲ
  choice: non représenté séparément
  rationale: La transition légère marquée par δέ est naturellement portée en français par l’ouverture du nouveau récit et l’enchaînement de la phrase; ajouter « et » ou « or » au début alourdirait ici le style.
theological_decisions:
- issue: Référent de πνεῦμα dans ἐν τῷ πνεύματι
  choice: l’Esprit saint comme agent qui conduit Jésus
  alternative: l’état spirituel intérieur de Jésus, ou la formulation plus littérale « dans l’Esprit »
  rationale: La mention immédiatement précédente de « l’Esprit saint » et l’accent narratif de Luc sur son action rendent ce référent le plus naturel. La note conserve toutefois la tournure grecque plus littérale sans résoudre davantage sa nuance.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple « revint » établit l’action principale, tandis que l’imparfait « était conduit » maintient l’aspect continu de ἤγετο. La majuscule à « Esprit » marque le référent personnel; « saint » reste en minuscule conformément à l’usage français courant.
