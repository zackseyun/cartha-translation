id: LUK.4.41
reference: Luke 4:41
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐξήρχετο δὲ καὶ δαιμόνια ἀπὸ πολλῶν ⸀κραυγάζοντα καὶ λέγοντα ὅτι Σὺ ⸀εἶ ὁ υἱὸς τοῦ θεοῦ. καὶ ἐπιτιμῶν οὐκ εἴα αὐτὰ λαλεῖν, ὅτι ᾔδεισαν τὸν χριστὸν αὐτὸν εἶναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/041.yaml
  text: Demons also were coming out of many[a], crying out and saying, “You are the Son of God!” But rebuking them, he would not allow them to speak, because they knew that he was the Messiah.
translation:
  language: fr
  text: 'Des démons sortaient aussi de beaucoup de personnes en criant : « Tu es le Fils de Dieu ! » Mais il les réprimandait et ne les laissait pas parler, parce qu’ils savaient qu’il était le Messie[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le Christ ». Le grec Χριστός est un titre qui signifie littéralement « oint » ; « Messie » en est le rendu français usuel dans ce contexte.'
    reason: Signaler l’autre traduction française traditionnelle de Χριστός et préciser le sens lexical du titre grec.
lexical_decisions:
- source_word: δαιμόνια
  choice: démons
  rationale: Le nom désigne directement des démons ; « esprits impurs » traduirait une autre expression grecque.
- source_word: ἐξήρχετο
  choice: sortaient
  rationale: L’imparfait français rend naturellement l’action répétée ou en cours exprimée par l’imparfait grec.
- source_word: ἀπὸ πολλῶν
  choice: de beaucoup de personnes
  rationale: Le grec laisse le référent humain implicite, mais le français exige ici une formulation plus explicite pour éviter l’expression peu naturelle « sortir de beaucoup ».
- source_word: κραυγάζοντα καὶ λέγοντα
  choice: en criant
  rationale: La citation qui suit fournit le contenu de ce qui est dit ; « en criant » exprime à la fois l’énonciation et la force du cri sans lourdeur redondante.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: le Fils de Dieu
  rationale: Cette formulation conserve la valeur de titre christologique et sa forme traditionnelle, immédiatement compréhensible.
- source_word: ἐπιτιμῶν
  choice: il les réprimandait
  rationale: Le verbe exprime une réprimande autoritaire ; l’imparfait maintient la dimension répétée de la scène.
- source_word: οὐκ εἴα αὐτὰ λαλεῖν
  choice: ne les laissait pas parler
  rationale: Cette tournure française naturelle conserve le refus continu ou répété de leur permettre de parler.
- source_word: ᾔδεισαν
  choice: ils savaient
  rationale: La forme grecque exprime ici un état de connaissance, rendu idiomatiquement par l’imparfait français.
- source_word: τὸν χριστὸν αὐτὸν εἶναι
  choice: qu’il était le Messie
  rationale: Χριστός fonctionne comme un titre ; « Messie » en communique le sens dans le cadre narratif de Luc, tandis que la construction infinitive grecque devient une proposition complétive naturelle en français.
theological_decisions:
- issue: Traduction de Χριστός dans l’identification formulée à propos de Jésus
  choice: le Messie
  alternative: le Christ
  rationale: Le terme est ici un titre plutôt qu’un nom propre. « Messie » en préserve la portée, tandis que l’autre rendu reconnu est signalé en note.
- issue: Rapport entre « Fils de Dieu » et « Messie »
  choice: Maintenir les deux titres distincts
  alternative: Les fondre en une seule désignation explicative
  rationale: Le discours des démons emploie « Fils de Dieu », puis le narrateur les décrit comme sachant qu’il est « le Messie ». La traduction respecte cette distinction sans définir leur rapport théologique.
translation_notes:
  register: Français international moderne, naturel et digne. L’imparfait structure la scène comme une série d’actions répétées. La formulation explicite « de beaucoup de personnes » clarifie en français le référent humain laissé implicite en grec.
