id: LUK.4.28
reference: Luke 4:28
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἐπλήσθησαν πάντες θυμοῦ ἐν τῇ συναγωγῇ ἀκούοντες ταῦτα,
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/028.yaml
  text: And all in the synagogue were filled with anger when they heard these things,[a]
translation:
  language: fr
  text: Tous ceux qui étaient dans la synagogue furent remplis de colère en entendant cela.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « furent remplis de fureur ». Le grec θυμός peut désigner une colère intense ou la fureur.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπλήσθησαν
  choice: furent remplis
  rationale: L’aoriste passif de πίμπλημι est rendu de façon naturelle tout en conservant l’image et la voix passive du grec.
- source_word: πάντες
  choice: Tous ceux qui étaient
  rationale: Cette formulation fait clairement porter πάντες sur l’ensemble des personnes présentes dans la synagogue, sans suggérer que le bâtiment lui-même est concerné.
- source_word: θυμοῦ
  choice: de colère
  rationale: θυμός désigne ici une colère intense. « Colère » est naturel en français moderne, tandis que « fureur » reste une possibilité plus forte signalée en note.
- source_word: ἐν τῇ συναγωγῇ
  choice: dans la synagogue
  rationale: La préposition ἐν situe directement les personnes à l’intérieur de la synagogue.
- source_word: ἀκούοντες
  choice: en entendant
  rationale: Le participe présent exprime une circonstance contemporaine de la réaction principale; le gérondif français préserve ce rapport avec concision.
- source_word: ταῦτα
  choice: cela
  rationale: Bien que le grec emploie un démonstratif pluriel, « cela » reprend naturellement en français l’ensemble des propos précédents sans les préciser davantage.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La structure conserve l’idée grecque d’être « remplis » de colère, tout en explicitant naturellement que πάντες désigne toutes les personnes présentes.
