source:
  edition: SBLGNT
  text: καὶ ἀπεκρίθη ⸂πρὸς αὐτὸν ὁ Ἰησοῦς⸃· Γέγραπται ὅτι Οὐκ ἐπ’ ἄρτῳ μόνῳ ζήσεται ⸀ὁ ⸀ἄνθρωπος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/004.yaml
  text: 'And Jesus answered him[b][a], “It is written: ‘Man will not live by bread alone.’”'
translation:
  language: fr
  text: 'Jésus lui répondit[a] : « Il est écrit : “L’être humain ne vivra pas de pain seul.” »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jésus cite Deutéronome 8,3.
    reason: cross_reference
lexical_decisions:
- source_word: ἀπεκρίθη πρὸς αὐτόν
  choice: lui répondit
  rationale: En français naturel, répondre à quelqu’un se construit avec un complément indirect repris ici par « lui » ; cette formulation rend fidèlement l’idiome grec sans calque maladroit.
- source_word: Γέγραπται
  choice: Il est écrit
  rationale: Cette formule consacrée d’introduction d’une citation biblique rend le parfait passif grec et sa portée toujours actuelle.
- source_word: ὅτι
  choice: ':'
  rationale: Ici, ὅτι introduit le contenu cité ; les deux-points sont la manière la plus naturelle de le marquer en français.
- source_word: ἐπ’ ἄρτῳ μόνῳ
  choice: de pain seulement
  rationale: Avec le verbe « vivre », la préposition ἐπί indique ce dont dépend la subsistance. « Vivre de » est idiomatique en français, et « seulement » conserve la portée de μόνῳ.
- source_word: ζήσεται
  choice: ne vivra pas
  rationale: Le futur français rend directement le futur grec dans une langue actuelle et digne.
- source_word: ὁ ἄνθρωπος
  choice: l’être humain
  rationale: Dans cette citation, le singulier est générique et désigne tout humain. « L’être humain » conserve le singulier représentatif sans que « l’homme » soit compris à tort comme visant uniquement le sexe masculin.
theological_decisions:
- issue: Rendu du singulier générique ὁ ἄνθρωπος dans la citation de Deutéronome 8.3
  choice: l’être humain
  alternative: l’homme
  rationale: Le grec emploie un masculin singulier générique. En français moderne international, « l’être humain » en restitue clairement la portée universelle tout en conservant le singulier et sans introduire une interprétation théologique particulière.
- issue: Étendue de la citation de Deutéronome 8.3
  choice: Ne traduire que les mots présents dans le texte grec de Luc
  alternative: Compléter par « mais de toute parole de Dieu » d’après certaines traditions textuelles ou le contexte de Deutéronome
  rationale: Le SBLGNT s’arrête à « seulement ». Ajouter la suite résoudrait une donnée textuelle par harmonisation et dépasserait la source fournie.
translation_notes:
  register: Français moderne international, naturel et digne. La citation imbriquée est signalée par des guillemets doubles à l’intérieur des guillemets français. « De pain seulement » garde l’ordre de pensée et l’accent du grec tout en restant idiomatique.
