  text: καὶ αὐτὸς ἐδίδασκεν ἐν ταῖς συναγωγαῖς αὐτῶν, δοξαζόμενος ὑπὸ πάντων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/015.yaml
  text: And he was teaching in their synagogues[a], being glorified by all.
translation:
  language: fr
  text: Il enseignait dans leurs synagogues, et tous le louaient[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tous l’honoraient » ou, plus littéralement, « il était glorifié par tous ». Le participe grec peut désigner la louange ou l’honneur publics ; « glorifié » conserve son lien avec le vocabulaire de la gloire.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ αὐτὸς
  choice: Il
  rationale: Le pronom grec explicite peut porter une légère emphase, mais la rendre par « lui-même » serait ici plus appuyé que ne l’exige le contexte. En français, « Il » reprend naturellement Jésus, tandis que la coordination est portée par le second « et ».
- source_word: ἐδίδασκεν
  choice: enseignait
  rationale: L’imparfait grec présente une activité en cours ou habituelle; l’imparfait français en conserve naturellement l’aspect.
- source_word: ἐν ταῖς συναγωγαῖς αὐτῶν
  choice: dans leurs synagogues
  rationale: Traduction locative directe et idiomatique; « leurs » conserve le pronom génitif qui renvoie aux communautés galiléennes du contexte.
- source_word: δοξαζόμενος
  choice: lui rendaient gloire
  rationale: La tournure active est plus naturelle en français que « étant glorifié », tout en maintenant le lien lexical avec la gloire. Dans ce contexte, elle peut exprimer l’éloge ou l’honneur public.
- source_word: ὑπὸ πάντων
  choice: tous
  rationale: Le complément d’agent grec devient le sujet de la tournure active française. « Tous » conserve la portée générale sans l’alourdir.
theological_decisions:
- issue: Portée de δοξαζόμενος appliqué à Jésus
  choice: tous lui rendaient gloire
  alternative: tous faisaient son éloge / il était honoré de tous
  rationale: Le choix conserve le vocabulaire de la gloire et sa possible résonance lucanienne, sans exclure le sens contextuel d’éloge ou d’honneur accordé publiquement. La note signale cette amplitude sémantique plutôt que de la résoudre.
translation_notes:
  register: Français international moderne, simple et digne. L’ordre de la proposition participiale grecque est rendu par une coordination fluide; la construction passive est transformée en construction active sans modifier les rôles sémantiques.
