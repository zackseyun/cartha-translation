id: LUK.4.20
reference: Luke 4:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ πτύξας τὸ βιβλίον ἀποδοὺς τῷ ὑπηρέτῃ ἐκάθισεν· καὶ πάντων ⸂οἱ ὀφθαλμοὶ ἐν τῇ συναγωγῇ⸃ ἦσαν ἀτενίζοντες αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/020.yaml
  text: And after rolling up the scroll and giving it back to the attendant[a], he sat down[b]. And the eyes of everyone in the synagogue were fixed on him.
translation:
  language: fr
  text: Après avoir réenroulé le rouleau[a] et l’avoir rendu au préposé[b], il s’assit. Dans la synagogue, tous avaient les yeux fixés sur lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « livre ». Le mot grec peut désigner plus généralement un document écrit, mais, dans cette synagogue, il s’agissait d’un rouleau.
    reason: lexical_alternative
  - marker: b
    text: C’est-à-dire l’assistant de la synagogue, chargé notamment de manipuler les rouleaux pendant le service.
    reason: cultural_note
lexical_decisions:
- source_word: πτύξας
  choice: après avoir réenroulé
  rationale: Le verbe décrit ici l’action de rouler de nouveau un rouleau après la lecture. « Réenroulé » rend concrètement ce geste sans évoquer la fermeture d’un livre relié.
- source_word: βιβλίον
  choice: le rouleau
  rationale: Le terme peut désigner plus généralement un livre ou un document écrit, mais, dans cette synagogue du Ier siècle, le texte d’Ésaïe se présentait sous la forme d’un rouleau.
- source_word: ἀποδοὺς
  choice: l’avoir rendu
  rationale: Le verbe exprime la remise de l’objet à la personne qui en avait la charge; « rendre » conserve naturellement cette idée.
- source_word: ὑπηρέτῃ
  choice: au préposé
  rationale: Dans ce contexte, il s’agit de la personne chargée d’assister au service de la synagogue, notamment en prenant soin des rouleaux. « Préposé » indique une fonction sans suggérer à tort un esclave.
- source_word: ἐκάθισεν
  choice: il s’assit
  rationale: Traduction directe et naturelle de l’action narrative, sans expliciter dans le texte la posture d’enseignement que le contexte peut suggérer.
- source_word: πάντων οἱ ὀφθαλμοὶ
  choice: tous avaient les yeux
  rationale: Cette tournure française naturelle conserve à la fois la portée universelle de πάντων et l’image concrète des yeux présente dans le grec.
- source_word: ἀτενίζοντες αὐτῷ
  choice: fixés sur lui
  rationale: L’expression rend le regard soutenu et attentif, sans lui attribuer une nuance d’hostilité absente du texte.
- source_word: συναγωγῇ
  choice: synagogue
  rationale: Le contexte désigne clairement le lieu et l’assemblée cultuelle juive appelés synagogue.
theological_decisions:
- issue: Forme matérielle du βιβλίον dans le culte synagogal
  choice: Traduire par « rouleau »
  alternative: « livre »
  rationale: « Rouleau » reflète avec précision la forme historique du document lu dans une synagogue du Ier siècle, sans modifier la portée théologique du passage.
translation_notes:
  register: Français international moderne, narratif et digne. La première phrase conserve la succession des actions grecques; la seconde adopte un ordre naturel en français tout en maintenant l’image vive des yeux fixés sur Jésus.
