  text: εἶπεν δέ· Ἀμὴν λέγω ὑμῖν ὅτι οὐδεὶς προφήτης δεκτός ἐστιν ἐν τῇ πατρίδι αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/024.yaml
  text: And he said[a], “Truly I tell you, no prophet is accepted in his hometown.”
translation:
  language: fr
  text: 'Il dit : « En vérité, je vous le dis, aucun prophète n’est bien accueilli dans son lieu d’origine[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans sa ville d’origine », « dans sa région natale » ou « dans sa patrie ». Le grec πατρίς peut désigner la ville, la région ou le pays dont une personne est originaire ; ici, le contexte de Nazareth favorise « ville d’origine ».
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν δέ
  choice: Puis il ajouta
  rationale: Le δέ est un connecteur narratif léger. Dans ce contexte, « Puis il ajouta » rend naturellement la poursuite de la parole de Jésus sans accentuer indûment un contraste.
- source_word: Ἀμὴν
  choice: Oui
  rationale: Placée en tête d’une déclaration de Jésus, l’expression introduit une affirmation solennelle. « Oui, je vous le dis » est une formule française naturelle et digne qui en transmet la force.
- source_word: λέγω ὑμῖν
  choice: je vous le dis
  rationale: Cette formulation courante conserve l’adresse directe et la solennité de la formule grecque.
- source_word: οὐδεὶς προφήτης
  choice: aucun prophète
  rationale: Cette traduction directe et idiomatique conserve la portée générale de la négation.
- source_word: δεκτός
  choice: bien accueilli
  rationale: Le terme désigne ici le fait d’être reçu favorablement. « Bien accueilli » exprime clairement cette dimension relationnelle dans un français actuel.
- source_word: ἐν τῇ πατρίδι αὐτοῦ
  choice: dans son pays
  rationale: πατρίς peut désigner le lieu d’origine, la région natale ou la patrie. « Son pays » conserve une certaine largeur de sens, tandis que la note précise les possibilités contextuelles.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La tournure proverbiale reste concise, et la note préserve l’étendue sémantique de πατρίς.
