  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: et
  rationale: Conjonction de coordination qui poursuit la citation commencée au verset précédent.
- source_word: ὅτι
  choice: non rendu séparément
  rationale: Introduit ici le contenu de la citation ; en français naturel, sa fonction est suffisamment indiquée par les deux-points et les guillemets.
- source_word: Ἐπὶ χειρῶν
  choice: sur leurs mains
  rationale: Reproduit directement l'image de personnes soutenues et portées par les mains des anges.
- source_word: ἀροῦσίν σε
  choice: ils te porteront
  rationale: Le futur de αἴρω exprime ici l'action de soulever et de porter ; « porteront » est clair, actuel et adapté au contexte.
- source_word: μήποτε
  choice: de peur que… ne
  rationale: Tour français idiomatique exprimant le but préventif ou le résultat évité.
- source_word: προσκόψῃς
  choice: heurte
  rationale: Avec le pied et une pierre, le verbe désigne le fait de cogner ou heurter contre un obstacle ; « heurte » conserve cette image concrète.
- source_word: πρὸς λίθον
  choice: une pierre
  rationale: Le rapport de contact exprimé par πρός est intégré naturellement au verbe français « heurter », qui se construit directement avec son complément.
- source_word: τὸν πόδα σου
  choice: ton pied
  rationale: Conserve le singulier du texte grec.
theological_decisions:
- issue: Formulation française de la citation du psaume et maintien de son image protectrice
  choice: « Ils te porteront sur leurs mains »
  alternative: « Ils te soutiendront de leurs mains »
  rationale: La formulation retenue reste proche du grec et préserve l'image concrète des mains angéliques portant Jésus, sans ajouter d'interprétation doctrinale.
