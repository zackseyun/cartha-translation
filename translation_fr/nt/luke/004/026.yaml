id: LUK.4.26
reference: Luke 4:26
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ πρὸς οὐδεμίαν αὐτῶν ἐπέμφθη Ἠλίας εἰ μὴ εἰς Σάρεπτα τῆς ⸀Σιδωνίας πρὸς γυναῖκα χήραν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/026.yaml
  text: And Elijah was sent to none of them[a], except to Zarephath of Sidon, to a widow.
translation:
  language: fr
  text: Et Élie ne fut envoyé auprès d’aucune d’elles, si ce n’est à Sarepta[a], dans le territoire de Sidon, auprès d’une veuve.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Voir 1 Rois 17.9.
    reason: Renvoi au récit où Élie est envoyé à Sarepta auprès d’une veuve.
lexical_decisions:
- source_word: ἐπέμφθη
  choice: fut envoyé
  rationale: Le passif rend naturellement le verbe grec et laisse l’auteur de l’envoi sous-entendu, comme dans le texte source.
- source_word: πρὸς οὐδεμίαν αὐτῶν
  choice: auprès d’aucune d’elles
  rationale: « Auprès de » exprime ici la destination vers des personnes, tandis que « aucune d’elles » conserve l’exclusion appuyée du grec et renvoie aux veuves mentionnées au verset précédent.
- source_word: Ἠλίας
  choice: Élie
  rationale: Forme française traditionnelle et courante du nom grec Ἠλίας.
- source_word: εἰ μὴ
  choice: si ce n’est
  rationale: Cette tournure française exprime clairement l’exception et maintient l’insistance de la construction grecque.
- source_word: Σάρεπτα
  choice: Sarepta
  rationale: Forme française reconnue du lieu mentionné dans le récit d’Élie en 1 Rois 17.
- source_word: τῆς Σιδωνίας
  choice: dans le territoire de Sidon
  rationale: Le génitif rattache Sarepta à la région sidonienne; cette formulation géographique est naturelle et évite de faire de la ville une possession au sens strict.
- source_word: γυναῖκα χήραν
  choice: une veuve
  rationale: Le grec dit littéralement « une femme veuve »; « une veuve » en donne le sens complet dans un français naturel.
theological_decisions:
- issue: Auteur implicite de l’envoi d’Élie
  choice: 'Conserver le passif sans nommer l’auteur : « Élie ne fut envoyé »'
  alternative: 'Expliciter : « Dieu n’envoya Élie »'
  rationale: Le contexte laisse entendre que Dieu envoie Élie, mais le grec ne nomme pas l’agent. La traduction respecte cette retenue et ne rend pas explicite ce qui demeure implicite.
translation_notes:
  register: Français international moderne, clair et digne. « Si ce n’est » garde la force exceptive du grec; la répétition de « auprès » reflète les deux destinations personnelles encadrant la destination géographique.
