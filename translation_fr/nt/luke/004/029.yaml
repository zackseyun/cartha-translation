source:
  edition: SBLGNT
  text: καὶ ἀναστάντες ἐξέβαλον αὐτὸν ἔξω τῆς πόλεως, καὶ ἤγαγον αὐτὸν ἕως ὀφρύος τοῦ ὄρους ἐφ’ οὗ ἡ πόλις ⸂ᾠκοδόμητο αὐτῶν, ὥστε⸃ κατακρημνίσαι αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/029.yaml
  text: And rising up[a], they drove him out of the town and led him to the brow of the hill on which their town had been built[b], so as to throw him down.
translation:
  language: fr
  text: Puis ils se levèrent, le chassèrent hors de la ville et le conduisirent jusqu’au bord de la colline sur laquelle leur ville avait été bâtie, pour le précipiter.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de sorte à le précipiter ». La construction grecque peut exprimer le but visé ou le résultat envisagé.
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: ἀναστάντες
  choice: ils se levèrent
  rationale: Le participe aoriste marque le passage de la foule à l’action et conserve le mouvement physique exprimé par le grec.
- source_word: ἐξέβαλον
  choice: le chassèrent hors de la ville
  rationale: Le verbe exprime ici une expulsion hostile et énergique; « chasser » rend cette force sans connotation ecclésiastique particulière.
- source_word: πόλεως
  choice: ville
  rationale: « Ville » est le correspondant français naturel de πόλις et convient aussi à une petite agglomération dans l’usage biblique et courant.
- source_word: ἤγαγον
  choice: le conduisirent
  rationale: Ce choix rend le sens large de ἄγω sans ajouter l’idée plus forte de le traîner.
- source_word: ἕως ὀφρύος τοῦ ὄρους
  choice: jusqu’à l’escarpement de la colline
  rationale: ὀφρύς désigne littéralement le sourcil, puis le rebord ou la saillie d’une hauteur. « Escarpement » exprime naturellement en français le bord abrupt impliqué par l’action projetée, sans introduire explicitement une falaise.
- source_word: ἐφ’ οὗ ἡ πόλις ᾠκοδόμητο αὐτῶν
  choice: sur laquelle leur ville était bâtie
  rationale: L’imparfait plus-que-parfait passif grec décrit l’emplacement établi de la ville; l’imparfait français est ici plus naturel que « avait été bâtie », tout en conservant le passif et le possessif αὐτῶν.
- source_word: ὥστε
  choice: afin de
  rationale: Avec l’infinitif, ὥστε peut exprimer ici la visée de l’action. « Afin de » rend clairement l’intention meurtrière sans affirmer qu’elle a abouti.
- source_word: κατακρημνίσαι
  choice: le précipiter en bas
  rationale: Le verbe signifie jeter ou précipiter quelqu’un du haut d’un lieu. Cette formulation conserve la violence et la direction du geste sans ajouter le mot « falaise », absent du grec.
theological_decisions:
- issue: Degré de violence attribué à la foule
  choice: Faire ressortir l’intention de tuer par « afin de le précipiter en bas », sans écrire explicitement « le tuer » ni ajouter une falaise.
  alternative: Employer « pour le jeter du haut de la falaise » ou expliciter « pour le tuer ».
  rationale: La succession des actions et le verbe κατακρημνίζω indiquent clairement une tentative violente, mais la traduction doit laisser le texte lui-même manifester l’issue recherchée sans ajouter de détail topographique ou d’explication.
- issue: Valeur de ὥστε avec l’infinitif
  choice: 'Le rendre comme une intention: « afin de ».'
  alternative: 'Le rendre comme une conséquence: « de sorte à » ou « si bien qu’ils allaient ».'
  rationale: Dans ce contexte, l’action n’aboutit pas dans le récit; la construction désigne donc naturellement le but poursuivi, tout en laissant subsister la souplesse sémantique de ὥστε dans la note.
translation_notes:
  register: Français moderne, international et digne. La phrase suit la progression rapide du grec. « Escarpement » évite l’image peu naturelle du « sourcil de la colline » et ne va pas jusqu’à introduire explicitement une falaise. Le marqueur [a] est placé après la proposition concernée.
