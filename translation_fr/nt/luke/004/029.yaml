revisions:
- from: Puis ils se levèrent, le chassèrent hors de la ville et le conduisirent jusqu’à l’escarpement de la colline sur laquelle leur ville était bâtie, afin de le précipiter en bas.[a]
  to: Puis ils se levèrent, le chassèrent hors de la ville et le conduisirent jusqu’au bord de la colline sur laquelle leur ville avait été bâtie, pour le précipiter.[a]
  rationale: La révision remplace un terme topographique trop spécifique par « bord », correspondant naturel de ὀφρύς, et supprime une redondance. Elle conserve l’expulsion hostile, la conduite jusqu’au rebord, le possessif « leur ville » et l’intention violente sans ajouter « falaise » ni expliciter un meurtre. Le plus-que-parfait passif est rendu par « avait été bâtie ».
