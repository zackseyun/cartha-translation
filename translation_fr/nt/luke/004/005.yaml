    issue: 'Note b : « Littéralement “en un point de temps” »'
    rationale: La glose ne rend pas adéquatement l’expression ἐν στιγμῇ χρόνου, qui signifie littéralement quelque chose comme « en un instant de temps ». Une note d’alternative idiomatique est préférable.
