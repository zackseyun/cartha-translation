reference: Luke 4:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ ἀναγαγὼν ⸀αὐτὸν ἔδειξεν αὐτῷ πάσας τὰς βασιλείας τῆς οἰκουμένης ἐν στιγμῇ χρόνου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/005.yaml
  text: And after leading him up[b][a], he showed him all the kingdoms of the inhabited world in a moment of time.
translation:
  language: fr
  text: Après l’avoir emmené vers le haut, il lui montra tous les royaumes du monde habité[a] en un instant[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « du monde ». Le terme grec désigne souvent le monde habité et peut, selon le contexte, évoquer plus précisément le monde civilisé ou impérial.
    reason: lexical_alternative
  - marker: b
    text: Ou « en un moment de temps ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναγαγὼν
  choice: l’ayant conduit en hauteur
  rationale: Le participe aoriste de ἀνάγω exprime ici le fait de conduire vers le haut. Cette formulation conserve le mouvement ascendant et la relation participiale sans ajouter la « montagne » mentionnée dans le récit parallèle de Matthieu, mais absente du texte de Luc.
- source_word: ἔδειξεν
  choice: il lui montra
  rationale: Rend directement le sens narratif courant de δείκνυμι et respecte le complément indirect αὐτῷ.
- source_word: πάσας τὰς βασιλείας
  choice: tous les royaumes
  rationale: Le pluriel βασιλείας désigne ici des royaumes ou domaines politiques plutôt que l’idée abstraite de royauté; πάσας est rendu simplement par « tous ».
- source_word: τῆς οἰκουμένης
  choice: du monde habité
  rationale: οἰκουμένη désigne proprement le monde habité, avec parfois une nuance de monde civilisé ou impérial. « Monde habité » conserve cette précision sans limiter indûment l’expression à l’Empire romain.
- source_word: ἐν στιγμῇ χρόνου
  choice: en un instant
  rationale: στιγμή désigne un point ou un très bref instant. En français actuel, « en un instant » rend naturellement l’extrême brièveté exprimée par la locution entière.
theological_decisions:
- issue: Nature de la présentation des royaumes par le diable
  choice: Décrire simplement qu’il les lui montra, sans préciser le mécanisme.
  alternative: Une vision surnaturelle, ou une vue littérale depuis un lieu élevé.
  rationale: Le grec affirme seulement qu’il lui montra tous les royaumes du monde habité en un instant. La traduction ne tranche donc pas entre une vision, un acte surnaturel ou un point de vue géographique.
translation_notes:
  register: Français international moderne, narratif et digne. « L’ayant conduit en hauteur » conserve le mouvement ascendant sans importer une montagne; « en un instant » est plus idiomatique que le calque « en un moment de temps ».
