id: LUK.4.43
reference: Luke 4:43
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν πρὸς αὐτοὺς ὅτι Καὶ ταῖς ἑτέραις πόλεσιν εὐαγγελίσασθαί με δεῖ τὴν βασιλείαν τοῦ θεοῦ, ὅτι ⸀ἐπὶ τοῦτο ⸀ἀπεστάλην.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/043.yaml
  text: But he said to them[a], “I must also proclaim the good news of the kingdom of God to the other cities[b], because I was sent for this.”
translation:
  language: fr
  text: 'Mais il leur dit : « Je dois aussi proclamer la bonne nouvelle du royaume de Dieu dans les autres villes[a], car c’est pour cela que j’ai été envoyé[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « dans les autres localités ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « car j’ai été envoyé dans ce but ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ εἶπεν πρὸς αὐτούς
  choice: Mais il leur dit
  rationale: δέ marque ici une légère opposition à la volonté de la foule de retenir Jésus. « Mais » rend naturellement ce contraste, tandis que « il leur dit » reste proche de la formulation grecque.
- source_word: Καὶ ταῖς ἑτέραις πόλεσιν
  choice: aussi … dans les autres villes
  rationale: καί a une valeur additive et étend la mission au-delà du lieu présent. ἕτεραις désigne d’autres villes, et πόλις peut couvrir selon le contexte une ville ou une localité.
- source_word: εὐαγγελίσασθαί
  choice: proclamer la bonne nouvelle
  rationale: Le verbe signifie apporter ou annoncer une bonne nouvelle. « Proclamer la bonne nouvelle » conserve sa force publique sans employer un vocabulaire inutilement technique.
- source_word: δεῖ … με
  choice: Je dois
  rationale: δεῖ exprime une nécessité forte, souvent liée chez Luc à l’accomplissement de la mission divine. « Je dois » est direct, naturel et n’explicite pas davantage la source de cette nécessité.
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: le royaume de Dieu
  rationale: Cette expression centrale chez Luc est rendue par la formulation française traditionnelle et transparente, qui laisse ouverte la portée de βασιλεία comme règne ou royaume.
- source_word: ἐπὶ τοῦτο
  choice: c’est pour cela
  rationale: La locution indique ici le but de l’envoi. « C’est pour cela » est idiomatique et garde la référence au mandat de proclamation exprimé juste avant.
- source_word: ἀπεστάλην
  choice: j’ai été envoyé
  rationale: Le passif aoriste exprime l’envoi en mission. La traduction conserve le passif et laisse, comme le grec, l’identité de celui qui envoie implicite.
theological_decisions:
- issue: Force de la nécessité missionnaire de Jésus
  choice: « Je dois » exprime une nécessité forte sans préciser explicitement qu’elle est divine.
  alternative: « Il faut que j’annonce » ou une paraphrase telle que « Dieu m’a chargé d’annoncer ».
  rationale: Le contexte lucanien permet de comprendre une nécessité divine, mais le verset ne nomme pas directement sa source. La traduction préserve donc cette implication sans la transformer en affirmation explicite.
- issue: Identité de celui qui envoie Jésus
  choice: Conserver le passif « j’ai été envoyé ».
  alternative: « Dieu m’a envoyé » ou « j’ai reçu cette mission ».
  rationale: Le passif suggère fortement un envoi par Dieu, mais le texte ne désigne pas le mandant. Le maintien du passif respecte cette retenue et la portée missionnaire de ἀποστέλλω.
- issue: Portée de βασιλεία τοῦ θεοῦ
  choice: « le royaume de Dieu »
  alternative: « le règne de Dieu »
  rationale: « Royaume » conserve la formulation biblique reconnue et l’ambivalence possible entre la souveraineté exercée par Dieu et le domaine où elle s’établit. Choisir uniquement « règne » pourrait réduire cette amplitude sémantique.
translation_notes:
  register: Français international moderne, clair et digne. La phrase reste proche de la structure grecque tout en adoptant une syntaxe naturelle. « Proclamer » garde la dimension publique de l’annonce; « royaume de Dieu » préserve une expression théologique centrale sans en réduire le sens à une seule interprétation.
