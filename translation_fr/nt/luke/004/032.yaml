source:
  edition: SBLGNT
  text: καὶ ἐξεπλήσσοντο ἐπὶ τῇ διδαχῇ αὐτοῦ, ὅτι ἐν ἐξουσίᾳ ἦν ὁ λόγος αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/032.yaml
  text: And they were astonished at his teaching[a], because his word had authority.
translation:
  language: fr
  text: Ils étaient stupéfaits de son enseignement, car sa parole était empreinte d’autorité[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « son message avait de l’autorité » ou « il parlait avec autorité ».
    reason: Alternative lexicale pour refléter les nuances possibles de ὁ λόγος αὐτοῦ et de ἐν ἐξουσίᾳ.
lexical_decisions:
- source_word: ἐξεπλήσσοντο
  choice: étaient frappés
  rationale: L’imparfait exprime leur réaction soutenue devant l’enseignement de Jésus. « Étaient frappés » rend naturellement la force de leur étonnement en français moderne.
- source_word: ἐπὶ τῇ διδαχῇ αὐτοῦ
  choice: par son enseignement
  rationale: ἐπί avec le datif indique ici ce qui provoque leur réaction. « Par son enseignement » est idiomatique et conserve le lien direct avec διδαχή.
- source_word: ὅτι
  choice: car
  rationale: ὅτι introduit la raison de leur étonnement. « Car » convient au registre narratif digne et demeure naturel.
- source_word: ἐν ἐξουσίᾳ
  choice: pleine d’autorité
  rationale: La tournure grecque caractérise la parole de Jésus comme porteuse d’autorité. « Pleine d’autorité » est idiomatique en français et évite le calque peu naturel « avec autorité » après le verbe être.
- source_word: ὁ λόγος αὐτοῦ
  choice: sa parole
  rationale: λόγος désigne ici ce que Jésus prononce, son discours ou son message. « Sa parole » préserve la concision et la portée du grec sans réduire le terme au seul contenu d’un message.
theological_decisions:
- issue: Nature de l’autorité de la parole de Jésus
  choice: sa parole était pleine d’autorité
  alternative: son message faisait autorité ; il parlait avec autorité
  rationale: Le texte affirme l’autorité de la parole de Jésus sans en préciser ici le fondement théologique. La traduction conserve cette affirmation sans y ajouter d’explication christologique.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation reste proche de la structure grecque tout en évitant un calque maladroit.
