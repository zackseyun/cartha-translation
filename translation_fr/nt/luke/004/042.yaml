id: LUK.4.42
reference: Luke 4:42
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Γενομένης δὲ ἡμέρας ἐξελθὼν ἐπορεύθη εἰς ἔρημον τόπον· καὶ οἱ ὄχλοι ἐπεζήτουν αὐτόν, καὶ ἦλθον ἕως αὐτοῦ, καὶ κατεῖχον αὐτὸν τοῦ μὴ πορεύεσθαι ἀπ’ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/042.yaml
  text: And when day came[a], he went out and went to a deserted place. And the crowds were seeking him[b], and they came to him and were trying to keep him from going away from them.
translation:
  language: fr
  text: Quand il fit jour, il sortit et se rendit dans un lieu désert[a]. Les foules le cherchaient; elles vinrent jusqu’à lui et tentaient de le retenir[b] pour l’empêcher de les quitter.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans un endroit isolé » ou « dans un lieu inhabité ». Le grec désigne un endroit à l’écart ou sans habitants, pas nécessairement un désert géographique.
    reason: lexical_alternative
  - marker: b
    text: Ou « cherchaient à l’empêcher de partir ». Le verbe grec peut évoquer le fait de retenir, de maintenir sur place ou d’empêcher quelqu’un de s’en aller.
    reason: lexical_alternative
lexical_decisions:
- source_word: Γενομένης δὲ ἡμέρας
  choice: Quand il fit jour
  rationale: Le génitif absolu marque une transition temporelle. Cette formulation est naturelle en français et conserve l’idée de l’arrivée du jour.
- source_word: ἐξελθὼν ἐπορεύθη
  choice: il sortit et se rendit
  rationale: Les deux mouvements restent explicites sans la répétition peu élégante de « il sortit et alla »; « se rendit » exprime le déplacement vers une destination.
- source_word: εἰς ἔρημον τόπον
  choice: dans un lieu désert
  rationale: ἔρημος décrit ici un endroit isolé ou inhabité, sans imposer l’image d’un désert géographique.
- source_word: οἱ ὄχλοι
  choice: Les foules
  rationale: Le pluriel du grec est conservé et désigne les groupes nombreux qui recherchent Jésus.
- source_word: ἐπεζήτουν αὐτόν
  choice: le cherchaient
  rationale: L’imparfait français rend l’action en cours exprimée par l’imparfait grec; le contexte indique une recherche active.
- source_word: ἦλθον ἕως αὐτοῦ
  choice: elles vinrent jusqu’à lui
  rationale: « Jusqu’à lui » rend explicitement ἕως et souligne qu’elles atteignirent l’endroit où il se trouvait.
- source_word: κατεῖχον αὐτὸν
  choice: tentaient de le retenir
  rationale: κατέχω peut signifier retenir ou empêcher de partir. « Tentaient » restitue ici la portée durative et conative de l’imparfait sans supposer nécessairement une contrainte physique.
- source_word: τοῦ μὴ πορεύεσθαι ἀπ’ αὐτῶν
  choice: pour l’empêcher de les quitter
  rationale: La construction infinitive négative exprime ce que les foules voulaient empêcher; la formulation française est claire et idiomatique.
theological_decisions: []
translation_notes:
  register: Français international moderne, fluide et digne. La structure narrative reste proche du grec, tandis que « se rendit » évite une répétition maladroite et que « tentaient de le retenir » préserve la nuance possible d’un effort en cours.
