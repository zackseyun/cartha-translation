id: LUK.4.7
reference: Luke 4:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: σὺ οὖν ἐὰν προσκυνήσῃς ἐνώπιον ἐμοῦ, ἔσται σοῦ πᾶσα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/007.yaml
  text: Therefore[a], if you worship before me, it will all be yours.
translation:
  language: fr
  text: Toi donc, si tu te prosternes devant moi[a], tout cela sera à toi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « si tu m’adores ». Le verbe grec peut désigner le fait de se prosterner ou d’adorer ; ici, le contexte donne au geste la valeur d’un hommage religieux rendu au diable.
    reason: lexical_alternative
lexical_decisions:
- source_word: σὺ
  choice: Toi
  rationale: Le pronom grec est exprimé pour marquer l’insistance. Le pronom disjoint « Toi », placé en tête, rend cette emphase sans ajouter « toi-même », qui serait plus appuyé que le texte.
- source_word: οὖν
  choice: donc
  rationale: « Donc » exprime naturellement la conséquence que le diable tire de son offre précédente.
- source_word: ἐὰν
  choice: si
  rationale: La conjonction introduit une condition éventuelle avec le subjonctif grec ; « si » en est l’équivalent français direct.
- source_word: προσκυνήσῃς
  choice: te prosternes
  rationale: Le verbe peut désigner le fait de se prosterner ou l’adoration. « Te prosternes » conserve l’image concrète et s’accorde naturellement avec « devant moi », tandis que le contexte et la note signalent la portée religieuse du geste.
- source_word: ἐνώπιον ἐμοῦ
  choice: devant moi
  rationale: Cette expression spatiale et relationnelle indique que l’hommage doit être rendu en présence du diable ; « devant moi » est concis et fidèle.
- source_word: ἔσται σοῦ
  choice: sera à toi
  rationale: Le futur de la copule suivi du génitif possessif signifie que la chose promise appartiendra au destinataire. « Sera à toi » est naturel en français moderne.
- source_word: πᾶσα
  choice: tout cela
  rationale: Le féminin singulier grec reprend de manière elliptique ce qui vient d’être offert au verset précédent. « Tout cela » rend la totalité sans répéter ni limiter artificiellement l’antécédent.
theological_decisions:
- issue: Faut-il rendre προσκυνέω par un geste corporel neutre ou par le vocabulaire explicite de l’adoration ?
  choice: te prosternes devant moi
  alternative: m’adores
  rationale: Le verbe grec désigne concrètement une prosternation qui, dans ce contexte, constitue un hommage religieux au diable. La traduction principale préserve l’image et l’ambiguïté lexicale ; la note explicite la valeur possible d’« adorer », confirmée par la réponse de Jésus au verset suivant.
translation_notes:
  register: Français international moderne, naturel et digne. L’ordre « Toi donc » conserve l’emphase du pronom grec. Le tutoiement convient à l’échange direct et au singulier grec.
