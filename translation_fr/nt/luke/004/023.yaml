  - severity: low
    issue: Absence de note pour εἰς τὴν Καφαρναούμ
    rationale: La traduction locative « à Capharnaüm » est contextuellement juste, mais εἰς signifie littéralement « vers/dans ». Une note brève préserve cette particularité textuelle sans imposer une lecture non naturelle en français.
