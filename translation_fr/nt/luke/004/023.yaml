source:
  edition: SBLGNT
  text: καὶ εἶπεν πρὸς αὐτούς· Πάντως ἐρεῖτέ μοι τὴν παραβολὴν ταύτην· Ἰατρέ, θεράπευσον σεαυτόν· ὅσα ἠκούσαμεν γενόμενα ⸂εἰς τὴν Καφαρναοὺμ⸃ ποίησον καὶ ὧδε ἐν τῇ πατρίδι σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/023.yaml
  text: And he said to them[a], “Surely you will say to me this proverb, ‘Physician, heal yourself.’ Whatever we have heard was done in Capernaum, do here also in your hometown.”
translation:
  language: fr
  text: 'Puis il leur dit : « Vous allez certainement me citer ce proverbe : “Médecin, guéris-toi toi-même.” Tout ce que nous avons entendu dire s’être passé à Capharnaüm[a], fais-le aussi ici, dans ta ville natale. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement, « vers/dans Capharnaüm ». La préposition grecque εἰς est normalement directionnelle, mais le contexte lui donne ici un sens de lieu.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάντως
  choice: certainement
  rationale: Exprime avec naturel l’assurance avec laquelle Jésus anticipe les paroles de ses auditeurs.
- source_word: ἐρεῖτέ μοι
  choice: vous allez me citer
  rationale: Le futur est conservé comme anticipation. Avec « ce proverbe », « citer » est plus idiomatique en français que le calque « dire à moi ».
- source_word: παραβολὴν
  choice: proverbe
  rationale: Le terme désigne ici une maxime proverbiale brève, et non une parabole narrative.
- source_word: Ἰατρέ
  choice: Médecin
  rationale: Rend directement le vocatif désignant celui qui soigne et convient au registre proverbial.
- source_word: θεράπευσον σεαυτόν
  choice: guéris-toi toi-même
  rationale: Préserve l’impératif direct et la forme traditionnelle, claire et naturelle, du proverbe.
- source_word: ὅσα ἠκούσαμεν γενόμενα
  choice: Tout ce que nous avons entendu dire qui s’est passé
  rationale: Conserve à la fois le caractère rapporté de l’information et le sens événementiel de γενόμενα, sans transformer explicitement les faits en miracles ou en œuvres.
- source_word: εἰς τὴν Καφαρναοὺμ
  choice: à Capharnaüm
  rationale: Avec « se passer », le français emploie naturellement « à » pour situer un événement dans une ville; cette formulation rend ici la valeur locative contextuelle de εἰς.
- source_word: ποίησον καὶ ὧδε
  choice: fais-le aussi ici
  rationale: Préserve l’impératif large ποιήσον et la valeur additive de καί dans un ordre français naturel.
- source_word: ἐν τῇ πατρίδι σου
  choice: dans ta ville d’origine
  rationale: Dans le contexte de Nazareth, πατρίς désigne le lieu dont Jésus est originaire. Cette formulation est actuelle et évite le sens politique moderne de « patrie ».
theological_decisions:
- issue: Nature de παραβολή dans ce contexte
  choice: proverbe
  alternative: parabole; comparaison; dicton
  rationale: La formule « Médecin, guéris-toi toi-même » est une maxime concise plutôt qu’un récit parabolique.
- issue: Nature des faits rapportés à Capharnaüm
  choice: « ce qui s’est passé », formulation non spécifiée
  alternative: « ce qui a été fait » ou explicitation « les miracles accomplis »
  rationale: γενόμενα décrit ce qui est arrivé ou s’est produit. La traduction ne précise pas qu’il s’agit de miracles ou d’œuvres afin de conserver l’indétermination du grec.
translation_notes:
  register: Français international moderne, digne et accessible. Tutoiement conservé dans la parole adressée directement à Jésus, conformément au singulier grec. La syntaxe est légèrement idiomatisée (« me citer ce proverbe ») sans atténuer la force prédictive du futur.
