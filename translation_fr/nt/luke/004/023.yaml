  verdict: revise
  source_fidelity: Le projet rend correctement la prédiction emphatique (Πάντως ἐρεῖτέ μοι), le caractère proverbial de παραβολή et l’impératif. « À Capharnaüm » rend de façon idiomatique la valeur locative contextuelle de εἰς, tout en nécessitant une note car la préposition grecque est littéralement directionnelle. La formulation révisée maintient γενόμενα comme des événements rapportés, sans les identifier à des miracles.
  naturalness: « Tout ce que nous avons entendu dire qui s’est passé » est lourd et syntaxiquement ambigu en français moderne. « Tout ce que nous avons entendu dire s’être passé » exprime nettement le discours rapporté. « Ville natale » est plus naturel que « ville d’origine » dans ce contexte narratif.
  terminology: « Proverbe », « Médecin, guéris-toi toi-même » et « ville natale » conviennent au registre français international moderne. Aucune interprétation théologique n’est ajoutée.
