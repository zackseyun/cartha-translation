  to: 'Puis il leur dit : « Vous allez certainement me citer ce proverbe : “Médecin, guéris-toi toi-même.” Tout ce que nous avons entendu dire s’être passé à Capharnaüm[a], fais-le aussi ici, dans ta ville natale. »'
