revisions:
- from: L’Esprit du Seigneur est sur moi, parce qu’il m’a consacré par l’onction pour annoncer la bonne nouvelle aux pauvres. Il m’a envoyé proclamer aux captifs la libération[a] et aux aveugles le retour à la vue, renvoyer les opprimés en liberté[b],
