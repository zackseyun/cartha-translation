id: LUK.4.18
reference: Luke 4:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Πνεῦμα κυρίου ἐπ’ ἐμέ, οὗ εἵνεκεν ἔχρισέν με εὐαγγελίσασθαι πτωχοῖς, ἀπέσταλκέν ⸀με κηρύξαι αἰχμαλώτοις ἄφεσιν καὶ τυφλοῖς ἀνάβλεψιν, ἀποστεῖλαι τεθραυσμένους ἐν ἀφέσει,
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/018.yaml
  text: The Spirit of the Lord is upon me[a], because he has anointed me to proclaim good news to the poor. He has sent me to proclaim release to the captives and recovery of sight to the blind, to send out the oppressed in release[b],
translation:
  language: fr
  text: L’Esprit du Seigneur est sur moi, parce qu’il m’a oint pour annoncer la bonne nouvelle aux pauvres. Il m’a envoyé proclamer aux captifs la libération[a] et aux aveugles le retour à la vue, renvoyer libres les opprimés[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot grec traduit par « libération » peut aussi signifier « pardon »; ici, la mention des captifs et des opprimés favorise le langage de la remise en liberté.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « ceux qui ont été brisés ». Dans ce contexte, « les opprimés » en exprime le sens idiomatique.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πνεῦμα κυρίου ἐπ’ ἐμέ
  choice: L’Esprit du Seigneur est sur moi
  rationale: La tournure restitue directement le génitif et la préposition du grec, tout en conservant la cadence de la citation d’Ésaïe. Le verbe « est », sous-entendu en grec, est nécessaire en français.
- source_word: οὗ εἵνεκεν
  choice: parce que
  rationale: Cette locution a ici une valeur causale; « parce que » l’exprime clairement en français actuel.
- source_word: ἔχρισέν με
  choice: il m’a consacré par l’onction
  rationale: Cette formulation rend le geste d’onction et sa portée de consécration sans recourir au peu courant « il m’a oint »; elle conserve aussi la résonance messianique de χρίω.
- source_word: εὐαγγελίσασθαι πτωχοῖς
  choice: annoncer la bonne nouvelle aux pauvres
  rationale: « Annoncer la bonne nouvelle » rend le sens verbal sans jargon ecclésiastique. « Les pauvres » laisse ouverte la portée matérielle et sociale de πτωχοί.
- source_word: ἀπέσταλκέν με
  choice: Il m’a envoyé
  rationale: Le passé composé exprime naturellement en français l’envoi accompli dont la mission demeure en vigueur.
- source_word: κηρύξαι
  choice: proclamer
  rationale: Le verbe évoque une annonce publique et solennelle, conformément au sens de κηρύσσω.
- source_word: αἰχμαλώτοις ἄφεσιν
  choice: aux captifs la libération
  rationale: Avec « captifs » et dans le contexte isaïen, ἄφεσις désigne d’abord la remise en liberté. L’ordre choisi reste naturel tout en suivant la structure grecque.
- source_word: τυφλοῖς ἀνάβλεψιν
  choice: aux aveugles le retour à la vue
  rationale: ἀνάβλεψις désigne l’accès ou le retour à la vue; cette expression est précise et naturelle en français.
- source_word: ἀποστεῖλαι τεθραυσμένους ἐν ἀφέσει
  choice: renvoyer les opprimés en liberté
  rationale: « Renvoyer » maintient le sens verbal d’ἀποστέλλω, tandis que « en liberté » reprend le champ lexical d’ἄφεσις. « Les opprimés » exprime dans ce contexte le sens idiomatique de ceux qui ont été brisés.
theological_decisions:
- issue: Sens de ἄφεσις dans la citation d’Ésaïe
  choice: libération / liberté
  alternative: pardon
  rationale: Les associations immédiates avec les captifs et les personnes brisées favorisent ici l’image de la délivrance. Comme Luc emploie aussi ἄφεσις pour le pardon des péchés, cette autre valeur réelle est signalée en note sans être imposée au texte principal.
- issue: Portée de τεθραυσμένους
  choice: les opprimés
  alternative: ceux qui ont été brisés
  rationale: Le participe décrit littéralement des personnes brisées. Dans ce contexte de délivrance, « les opprimés » en communique le sens social et idiomatique, tandis que la note conserve l’image littérale et sa possible portée plus large.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation garde le rythme d’une proclamation scripturaire, évite le jargon confessionnel et conserve, au moyen des notes, l’ambiguïté de ἄφεσις ainsi que l’image littérale de τεθραυσμένους.
