  rationale: La révision remplace une explicitation de χρίω par son équivalent scripturaire direct, « oint », et reformule la dernière proposition pour une syntaxe française plus naturelle tout en maintenant le verbe d’envoi, la répétition du champ de la libération et l’ambiguïté signalée en note. Les ancres sont conservées et la note b est placée immédiatement après le rendu de τεθραυσμένους.
