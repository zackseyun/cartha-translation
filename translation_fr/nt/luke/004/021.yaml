- from: 'Alors il se mit à leur dire : « Aujourd’hui, ce passage de l’Écriture s’est accompli à vos oreilles[a]. »'
  to: 'Il commença alors à leur dire : « Aujourd’hui, ce passage de l’Écriture s’est accompli alors que vous venez de l’entendre[a]. »'
  rationale: La révision conserve le sens, le temps verbal et la retenue théologique du grec, tout en remplaçant un calque français peu naturel par une formulation claire qui rattache l’accomplissement à l’écoute du texte qui vient d’être lu. La note maintient l’image lexicale du grec.
