source:
  edition: SBLGNT
  text: ἤρξατο δὲ λέγειν πρὸς αὐτοὺς ὅτι Σήμερον πεπλήρωται ἡ γραφὴ αὕτη ἐν τοῖς ὠσὶν ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/021.yaml
  text: Then he began to say to them[a], “Today this Scripture has been fulfilled in your hearing.”
translation:
  language: fr
  text: 'Il commença alors à leur dire : « Aujourd’hui, ce passage de l’Écriture s’est accompli alors que vous venez de l’entendre[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « dans vos oreilles ».'
    reason: Signale l’expression grecque ἐν τοῖς ὠσὶν ὑμῶν. Le texte principal en rend idiomatiquement le sens dans le contexte de l’audition du passage.
lexical_decisions:
- source_word: ἤρξατο δὲ λέγειν
  choice: Alors il se mit à leur dire
  rationale: La tournure « se mit à dire » rend naturellement en français le commencement exprimé par ἤρξατο avec l’infinitif λέγειν. « Alors » marque la progression du récit portée ici par δέ, sans introduire de contraste fort.
- source_word: Σήμερον
  choice: Aujourd’hui
  rationale: Le terme temporel placé en tête de la déclaration garde ainsi son relief et son caractère immédiat.
- source_word: πεπλήρωται
  choice: s’est accompli
  rationale: Le passé composé français exprime un accomplissement réalisé dont le résultat demeure présent, conformément au parfait passif grec.
- source_word: ἡ γραφὴ αὕτη
  choice: ce passage de l’Écriture
  rationale: Dans le contexte, γραφή désigne précisément le texte d’Ésaïe qui vient d’être lu. Cette formulation française est claire et évite que « cette Écriture » soit comprise comme désignant l’ensemble des Écritures.
- source_word: ἐν τοῖς ὠσὶν ὑμῶν
  choice: à vos oreilles
  rationale: Cette formulation conserve l’image concrète et inhabituelle du grec, intelligible en français, plutôt que d’en réduire le sens à une simple compréhension ou réception.
theological_decisions:
- issue: Nature de l’accomplissement déclaré
  choice: Présenter l’accomplissement actuel du passage sans préciser par qui ni de quelle manière il s’opère.
  alternative: « Aujourd’hui, cette prophétie s’est accomplie en moi sous vos yeux. »
  rationale: Le contexte associe l’accomplissement à Jésus, mais le verset ne dit explicitement ni « prophétie », ni « en moi », ni « sous vos yeux ». La traduction préserve donc la force et l’ouverture de la déclaration grecque.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la solennité de la déclaration tout en évitant une syntaxe archaïque ou une explicitation théologique absente du grec.
