id: LUK.4.31
reference: Luke 4:31
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ κατῆλθεν εἰς Καφαρναοὺμ πόλιν τῆς Γαλιλαίας. καὶ ἦν διδάσκων αὐτοὺς ἐν τοῖς σάββασιν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/031.yaml
  text: And he went down to Capernaum[a], a city of Galilee. And he was teaching them on the Sabbaths.
translation:
  language: fr
  text: Puis il descendit à Capernaüm, une ville de Galilée, et il leur enseignait les jours de sabbat.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατῆλθεν
  choice: descendit
  rationale: Le verbe κατέρχομαι exprime un déplacement vers le bas. « Descendit » en conserve le sens directionnel, cohérent avec le trajet depuis les hauteurs de Nazareth jusqu’à Capernaüm.
- source_word: Καφαρναοὺμ
  choice: Capernaüm
  rationale: Cette graphie française traditionnelle et courante rend naturellement le nom grec.
- source_word: πόλιν τῆς Γαλιλαίας
  choice: une ville de Galilée
  rationale: L’absence d’article devant πόλιν favorise l’indéfini « une ville » ; le génitif est rendu directement et naturellement par « de Galilée ».
- source_word: ἦν διδάσκων
  choice: il enseignait
  rationale: L’imparfait périphrastique grec décrit une activité en cours ou répétée ; l’imparfait français en restitue naturellement l’aspect duratif.
- source_word: αὐτοὺς
  choice: les gens
  rationale: Le pronom grec n’a pas d’antécédent explicite dans ce verset. En français, « les gens » évite le pronom « leur », dont le référent serait artificiellement obscur, sans préciser davantage l’identité du groupe.
- source_word: ἐν τοῖς σάββασιν
  choice: les jours de sabbat
  rationale: Le pluriel grec suggère plusieurs occasions successives. « Les jours de sabbat » conserve ce pluriel et exprime idiomatiquement en français une pratique répétée.
theological_decisions:
- issue: Faut-il ramener le pluriel σάββασιν à un singulier idiomatique ?
  choice: les jours de sabbat
  alternative: le jour du sabbat
  rationale: Le pluriel est conservé parce qu’il évoque probablement l’enseignement répété de Jésus lors de plusieurs sabbats et s’accorde avec l’aspect duratif de « il enseignait ».
translation_notes:
  register: Français international moderne, simple et digne. « Puis » assure la continuité narrative. « Là » clarifie naturellement le lieu de l’enseignement sans ajouter de contenu substantiel. Le pluriel « les jours de sabbat » reste lisible tout en respectant la forme grecque.
