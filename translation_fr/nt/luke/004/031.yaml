review_pass:
  verdict: revise
  source_fidelity: « Descendit » rend bien κατῆλθεν et « une ville de Galilée » correspond fidèlement à πόλιν τῆς Γαλιλαίας. L’imparfait « enseignait » restitue de manière appropriée la valeur durative/itérative de ἦν διδάσκων. En revanche, « les gens » remplace le pronom αὐτούς par un nom et introduit une désignation plus précise que le grec ne fournit pas.
  naturalness: « Il leur enseignait » est la formulation française idiomatique avec enseigner lorsqu’un complément désigne les personnes instruites. « Les jours de sabbat » est naturel et conserve utilement le pluriel grec.
  terminology: « Capernaüm », « Galilée » et « sabbat » sont les formes françaises usuelles. Le pluriel « les jours de sabbat » préserve la nuance de répétition sans imposer une interprétation doctrinale.
  issues:
