    issue: « les gens » explicite indûment αὐτούς.
    rationale: Le grec emploie seulement le pronom « eux/les ». En français, « il leur enseignait » conserve cette absence de spécification tout en restant grammatical et naturel.
  - severity: low
    issue: Ajout de « Là ».
    rationale: Le lieu est déjà établi par la proposition précédente, mais « là » n’est pas exprimé dans le grec. Le supprimer permet une correspondance plus directe, sans nuire à la fluidité.
  revised_text: Puis il descendit à Capernaüm, une ville de Galilée, et il leur enseignait les jours de sabbat.
