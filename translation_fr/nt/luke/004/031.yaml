- from: Puis il descendit à Capernaüm, une ville de Galilée. Là, il enseignait les gens les jours de sabbat.
  to: Puis il descendit à Capernaüm, une ville de Galilée, et il leur enseignait les jours de sabbat.
  rationale: La révision remplace le groupe nominal ajouté « les gens » par le datif français « leur », qui rend le pronom grec sans en préciser le référent. Elle supprime également « Là », absent du texte source, et rétablit la coordination explicite. Le pluriel « les jours de sabbat » est conservé pour refléter τοῖς σάββασιν et l’aspect itératif de l’imparfait.
