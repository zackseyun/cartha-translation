reference: Luke 4:33
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἐν τῇ συναγωγῇ ἦν ἄνθρωπος ἔχων πνεῦμα δαιμονίου ἀκαθάρτου, καὶ ἀνέκραξεν φωνῇ μεγάλῃ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/033.yaml
  text: And in the synagogue there was a man having an unclean spirit of a demon[a], and he cried out with a loud voice[b],
translation:
  language: fr
  text: 'Or, dans la synagogue, il y avait un homme qui avait un esprit d’un démon impur[a]. Il poussa un grand cri :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « un esprit d’un démon impur ». Le grec emploie à la fois les mots « esprit » et « démon ».'
    reason: clarification_lexicale
lexical_decisions:
- source_word: συναγωγῇ
  choice: synagogue
  rationale: « Synagogue » est le terme français courant et précis pour le lieu juif de rassemblement et de culte.
- source_word: ἄνθρωπος
  choice: homme
  rationale: Dans ce récit, le nom masculin singulier désigne un individu de sexe masculin, et non l’être humain en général.
- source_word: ἔχων
  choice: qui avait
  rationale: Cette formulation rend directement le participe « ayant » sans ajouter l’interprétation plus forte « possédé par ».
- source_word: πνεῦμα δαιμονίου ἀκαθάρτου
  choice: un esprit de démon impur
  rationale: La traduction conserve les deux termes grecs, « esprit » et « démon ». L’adjectif ἀκαθάρτου s’accorde grammaticalement avec δαιμονίου; « impur » qualifie donc explicitement « démon », tout en laissant subsister l’étrangeté de l’expression grecque.
- source_word: ἀνέκραξεν φωνῇ μεγάλῃ
  choice: Il poussa un grand cri
  rationale: Expression française naturelle qui restitue à la fois le verbe désignant un cri soudain et l’intensité de « d’une voix forte ».
theological_decisions:
- issue: Terminologie relative au démon
  choice: un esprit de démon impur
  alternative: un esprit impur; un esprit démoniaque impur
  rationale: Le grec contient explicitement à la fois πνεῦμα (« esprit ») et δαιμόνιον (« démon »). La formulation retenue préserve ces deux éléments sans réduire l’expression à « esprit impur » ni introduire une explication doctrinale supplémentaire.
- issue: Nature de l’emprise démoniaque
  choice: qui avait
  alternative: qui était possédé par
  rationale: Le texte dit littéralement que l’homme « avait » cet esprit. La traduction évite de préciser davantage la nature ou le degré de cette emprise.
translation_notes:
  register: Français international moderne, sobre et narratif. « Or » marque naturellement l’introduction d’une nouvelle scène; « il y avait » et « qui avait » reproduisent la structure du grec sans lourdeur excessive. La ponctuation finale par deux-points prépare les paroles du verset suivant.
