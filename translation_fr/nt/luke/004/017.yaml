source:
  edition: SBLGNT
  text: καὶ ἐπεδόθη αὐτῷ βιβλίον ⸂τοῦ προφήτου Ἠσαΐου⸃ καὶ ⸀ἀναπτύξας τὸ βιβλίον εὗρεν τὸν τόπον οὗ ἦν γεγραμμένον·
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/017.yaml
  text: 'And the scroll of the prophet Isaiah was handed to him[a], and after unrolling the scroll, he found the place where it was written:'
translation:
  language: fr
  text: 'On lui remit le rouleau[a] du prophète Ésaïe. Après avoir déroulé le rouleau, il trouva le passage où il était écrit :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « livre ». Le mot grec βιβλίον peut désigner de manière générale un document écrit, mais, dans ce contexte synagogal, il s’agit très probablement d’un rouleau.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεδόθη
  choice: on lui remit
  rationale: Le passif grec indique que le document lui fut donné pour la lecture. La tournure française « on lui remit » est naturelle dans ce cadre et conserve la valeur passive sans suggérer un transfert hostile.
- source_word: βιβλίον
  choice: rouleau
  rationale: Bien que le mot puisse désigner plus largement un document écrit ou un livre, le contexte d’une lecture synagogale au Ier siècle renvoie très probablement à un rouleau.
- source_word: τοῦ προφήτου Ἠσαΐου
  choice: du prophète Ésaïe
  rationale: Cette formulation rend directement le génitif grec tout en conservant le titre prophétique d’Ésaïe.
- source_word: ἀναπτύξας
  choice: Il déroula
  rationale: Le participe aoriste exprime une action antérieure à « trouva ». Le français coordonne naturellement les actions successives, et « déroula » correspond précisément à l’usage d’un rouleau.
- source_word: εὗρεν
  choice: trouva
  rationale: Rendu direct et courant de εὑρίσκω, sans ajouter l’idée d’une recherche difficile.
- source_word: τὸν τόπον
  choice: l’endroit
  rationale: « L’endroit » préserve l’image concrète d’une localisation dans le texte; « le passage » serait plus interprétatif.
- source_word: οὗ ἦν γεγραμμένον
  choice: où il était écrit
  rationale: Cette formule française claire introduit naturellement la citation et rend la construction périphrastique grecque sans archaïsme.
theological_decisions: []
translation_notes:
  register: Français international moderne, fluide et digne. La syntaxe a été divisée en deux phrases pour éviter une accumulation lourde, tout en maintenant l’ordre des actions du grec. « Ésaïe » suit la forme française traditionnelle du nom.
