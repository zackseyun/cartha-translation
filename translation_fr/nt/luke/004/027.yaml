id: LUK.4.27
reference: Luke 4:27
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ πολλοὶ λεπροὶ ἦσαν ⸂ἐν τῷ Ἰσραὴλ ἐπὶ Ἐλισαίου τοῦ προφήτου⸃, καὶ οὐδεὶς αὐτῶν ἐκαθαρίσθη, εἰ μὴ Ναιμὰν ὁ Σύρος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/027.yaml
  text: And there were many lepers in Israel in the time of Elisha the prophet, and none of them was cleansed except Naaman the Syrian.
translation:
  language: fr
  text: Il y avait aussi beaucoup de lépreux en Israël au temps du prophète Élisée, et aucun d’eux ne fut purifié[a], sauf Naaman le Syrien.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ne fut guéri » ; le verbe grec signifie littéralement « ne fut rendu pur ».'
    reason: La note signale sans la résoudre la double portée possible du verbe, qui peut désigner la guérison de l’affection et la purification qui en résulte.
lexical_decisions:
- source_word: λεπροὶ
  choice: lépreux
  rationale: Le substantif français garde la concision du grec et correspond au vocabulaire biblique traditionnel. Dans le contexte biblique, le terme peut couvrir diverses affections cutanées, sans permettre un diagnostic médical moderne précis.
- source_word: ἐν τῷ Ἰσραὴλ
  choice: en Israël
  rationale: Cette formulation naturelle conserve la portée locative ou collective assez large de l’expression grecque, sans préciser indûment « le pays » ou « le peuple ».
- source_word: ἐπὶ Ἐλισαίου τοῦ προφήτου
  choice: au temps du prophète Élisée
  rationale: Avec le génitif, ἐπί a ici un sens temporel. Cette traduction est claire et idiomatique en français moderne.
- source_word: ἐκαθαρίσθη
  choice: fut purifié
  rationale: Le verbe évoque à la fois la disparition de l’affection et le passage de l’impureté à la pureté. « Purifié » préserve cette double résonance mieux que le seul « guéri ».
- source_word: εἰ μὴ
  choice: sauf
  rationale: L’expression introduit ici l’unique exception à l’énoncé négatif.
- source_word: Ναιμὰν ὁ Σύρος
  choice: Naaman le Syrien
  rationale: Cette désignation conserve l’article grec et souligne que l’unique personne purifiée était un étranger syrien.
theological_decisions:
- issue: Portée du vocabulaire de purification appliqué à la lèpre
  choice: fut purifié
  alternative: fut guéri
  rationale: « Purifié » maintient ensemble les dimensions corporelle et rituelle du langage biblique, sans réduire le propos à une guérison médicale ni y ajouter une interprétation doctrinale.
- issue: Force de l’origine de Naaman
  choice: Naaman le Syrien
  alternative: Naaman, un Syrien
  rationale: La formulation définie reflète ὁ Σύρος et garde la force rhétorique du contraste entre les nombreux lépreux en Israël et cet étranger connu.
translation_notes:
  register: Français international moderne, sobre et digne. Le passé simple convient au récit scripturaire écrit sans être archaïque. La syntaxe demeure proche du parallélisme grec tout en restant naturelle.
