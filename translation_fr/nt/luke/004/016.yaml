source:
  edition: SBLGNT
  text: Καὶ ἦλθεν ⸀εἰς Ναζαρά, οὗ ἦν τεθραμμένος, καὶ εἰσῆλθεν κατὰ τὸ εἰωθὸς αὐτῷ ἐν τῇ ἡμέρᾳ τῶν σαββάτων εἰς τὴν συναγωγήν, καὶ ἀνέστη ἀναγνῶναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/016.yaml
  text: And he came to Nazara[a], where he had been brought up, and as was his custom, he entered the synagogue on the Sabbath day, and stood up to read.
translation:
  language: fr
  text: Il se rendit à Nazara[a], où il avait été élevé ; comme il en avait l’habitude, il entra dans la synagogue le jour du sabbat et se leva pour lire.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Nazareth ». Le grec porte ici « Nazara ».
    reason: alternative_reading
lexical_decisions:
- source_word: Ναζαρά
  choice: Nazara
  rationale: Cette translittération représente directement la forme grecque propre à ce verset, sans l’harmoniser avec la forme française traditionnelle « Nazareth ».
- source_word: τεθραμμένος
  choice: avait grandi
  rationale: Dans ce contexte, le participe parfait passif de τρέφω évoque le lieu où Jésus a été élevé. « Avait grandi » est naturel en français moderne et rend clairement l’idée de son enfance et de son éducation dans cette ville.
- source_word: κατὰ τὸ εἰωθὸς αὐτῷ
  choice: comme il en avait l’habitude
  rationale: Cette tournure française idiomatique exprime fidèlement une pratique habituelle.
- source_word: ἐν τῇ ἡμέρᾳ τῶν σαββάτων
  choice: Le jour du sabbat
  rationale: Le pluriel grec σαββάτων appartient ici à une expression idiomatique désignant le jour du sabbat au singulier.
- source_word: συναγωγήν
  choice: synagogue
  rationale: Dans ce cadre juif, le mot désigne naturellement le lieu institutionnel de réunion et de culte.
- source_word: ἀνέστη ἀναγνῶναι
  choice: se leva pour faire la lecture
  rationale: Le verbe suivi de l’infinitif indique qu’il se lève afin de lire. « Faire la lecture » convient au contexte de la lecture publique dans la synagogue sans préciser davantage que le grec.
theological_decisions:
- issue: Forme du nom de lieu Ναζαρά
  choice: Nazara
  alternative: Nazareth
  rationale: Le texte principal conserve la forme attestée dans le grec de ce verset plutôt que de l’harmoniser avec le nom français traditionnel. La forme familière est signalée en note.
translation_notes:
  register: Français international moderne, naturel et digne. La structure est légèrement réorganisée pour éviter une longue coordination peu idiomatique, tout en conservant la succession narrative et toutes les données du grec.
