id: LUK.4.3
reference: Luke 4:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸂εἶπεν δὲ⸃ αὐτῷ ὁ διάβολος· Εἰ υἱὸς εἶ τοῦ θεοῦ, εἰπὲ τῷ λίθῳ τούτῳ ἵνα γένηται ἄρτος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/003.yaml
  text: Then the devil said to him[a], “If you are the Son of God, tell this stone to become bread.”
translation:
  language: fr
  text: 'Alors le diable lui dit : « Si tu es le Fils de Dieu, dis à cette pierre de devenir du pain. »[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Puisque tu es le Fils de Dieu. » La condition grecque peut être comprise comme tenant la prémisse pour acquise dans le cadre du défi, mais le texte principal en conserve la forme conditionnelle.'
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: Alors
  rationale: Connecteur léger marquant ici la progression du récit; « Alors » est naturel en français moderne sans alourdir la phrase.
- source_word: διάβολος
  choice: le diable
  rationale: Dans ce contexte, le terme désigne personnellement Satan; « le diable » est la formulation française reconnue et idiomatique.
- source_word: Εἰ
  choice: Si
  rationale: « Si » conserve explicitement la forme conditionnelle et la tension du défi, sans décider si le locuteur tient la prémisse pour acquise.
- source_word: υἱὸς ... τοῦ θεοῦ
  choice: le Fils de Dieu
  rationale: Dans ce contexte christologique, le groupe nominal a une valeur définie et titulaire, non indéfinie.
- source_word: εἰπὲ
  choice: dis
  rationale: L’impératif de λέγω signifie littéralement « dis »; avec la construction « dis à cette pierre de… », le français reste naturel et n’ajoute pas la force interprétative de « ordonne ».
- source_word: τῷ λίθῳ τούτῳ
  choice: à cette pierre
  rationale: « Pierre » rend précisément λίθος, tandis que le démonstratif τούτῳ est conservé.
- source_word: ἵνα γένηται
  choice: de devenir
  rationale: Après « dis à », l’infinitif constitue en français la manière naturelle d’exprimer le contenu de la demande introduit en grec par ἵνα et le subjonctif.
- source_word: ἄρτος
  choice: du pain
  rationale: « Pain » correspond directement au terme grec; l’article partitif convient à la matière obtenue sans ajouter l’idée plus précise d’un pain ou d’une miche.
theological_decisions:
- issue: Valeur de la proposition conditionnelle εἰ υἱὸς εἶ τοῦ θεοῦ
  choice: Si tu es le Fils de Dieu
  alternative: Puisque tu es le Fils de Dieu
  rationale: Le texte principal garde la forme conditionnelle du grec et maintient ainsi la tension narrative et théologique de la tentation, sans nier la filiation de Jésus ni présenter comme certaine une nuance pragmatique discutée.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement correspond à l’adresse grecque au singulier. La tournure « dis à cette pierre de devenir du pain » reste proche de la structure source tout en étant idiomatique.
