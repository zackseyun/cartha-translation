  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἐγένετο θάμβος ἐπὶ πάντας, καὶ συνελάλουν πρὸς ἀλλήλους λέγοντες· Τίς ὁ λόγος οὗτος ὅτι ἐν ἐξουσίᾳ καὶ δυνάμει ἐπιτάσσει τοῖς ἀκαθάρτοις πνεύμασιν, καὶ ἐξέρχονται;
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/036.yaml
  text: And amazement came upon everyone[a], and they were speaking with one another, saying, “What is this word, that with authority and power he commands the unclean spirits, and they come out?”
translation:
  language: fr
  text: 'Tous furent saisis de stupeur et se disaient les uns aux autres : « Quelle est donc cette parole[a] : avec autorité et puissance, il commande aux esprits impurs, et ils sortent ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Quel est donc ce message ? » Le mot grec logos peut signifier « parole », « message » ou « affaire ».
    reason: lexical_alternative
lexical_decisions:
- source_word: θάμβος
  choice: stupeur
  rationale: Le terme désigne un profond étonnement. « Stupeur » exprime naturellement en français la forte saisie provoquée par l’événement, sans suggérer nécessairement l’admiration.
- source_word: ἐγένετο θάμβος ἐπὶ πάντας
  choice: Tous furent saisis de stupeur
  rationale: Cette tournure française restitue l’idée idiomatique d’un étonnement qui s’empare de toutes les personnes présentes.
- source_word: συνελάλουν πρὸς ἀλλήλους
  choice: se disaient les uns aux autres
  rationale: L’imparfait grec présente un échange en cours. La formulation française garde la réciprocité et introduit naturellement les paroles rapportées.
- source_word: Τίς ὁ λόγος οὗτος
  choice: Quelle est cette parole ?
  rationale: « Parole » conserve la largeur sémantique de λόγος et convient ici à l’énoncé ou au commandement efficace de Jésus. Une note signale l’autre sens possible, « message ».
- source_word: ἐν ἐξουσίᾳ καὶ δυνάμει
  choice: Avec autorité et puissance
  rationale: « Avec » rend la valeur modale ou instrumentale de ἐν, tandis que l’ordre grec est conservé.
- source_word: ἐπιτάσσει
  choice: il commande
  rationale: Le présent garde la vivacité du propos rapporté, et « commander à » rend précisément l’ordre donné.
- source_word: τοῖς ἀκαθάρτοις πνεύμασιν
  choice: aux esprits impurs
  rationale: « Esprits impurs » est une formulation exacte et naturelle en français biblique moderne; elle conserve la catégorie spirituelle explicite du récit et l’arrière-plan de l’impureté.
- source_word: ἐξέρχονται
  choice: ils sortent
  rationale: Le verbe rend directement la sortie des esprits hors de la personne, sans explicitation absente du grec.
theological_decisions:
- issue: Désignation des êtres démoniaques dans le récit d’exorcisme
  choice: les esprits impurs
  alternative: les esprits mauvais; les esprits impurs compris métaphoriquement
  rationale: La traduction maintient la désignation personnelle et surnaturelle du grec sans la réduire à une réalité psychologique ni ajouter l’interprétation « mauvais ».
- issue: Relation entre autorité et puissance
  choice: conserver les deux termes distincts
  alternative: les fondre en une seule notion de pouvoir
  rationale: Le grec coordonne ἐξουσία et δύναμις. Les rendre par « autorité et puissance » préserve leur distinction et la tension entre droit de commander et efficacité.
translation_notes:
  register: Français international moderne, naturel et digne. « Saisis de stupeur » évite un calque lourd, tandis que « parole », « autorité », « puissance » et « esprits impurs » conservent les termes théologiquement significatifs du texte source.
