  text: γέγραπται γὰρ ὅτι Τοῖς ἀγγέλοις αὐτοῦ ἐντελεῖται περὶ σοῦ τοῦ διαφυλάξαι σε,
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/010.yaml
  text: 'For it is written: ‘He will command his angels concerning you[c][b][a], to guard you,’'
translation:
  language: fr
  text: 'Car il est écrit : « Il donnera à ses anges des ordres à ton sujet, afin qu’ils te gardent. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γέγραπται
  choice: il est écrit
  rationale: Formule française consacrée et naturelle pour introduire une citation de l’Écriture; elle rend la valeur durable du parfait passif grec.
- source_word: γὰρ
  choice: car
  rationale: Conserve la valeur explicative qui relie la citation à l’affirmation précédente du tentateur.
- source_word: ὅτι
  choice: ':'
  rationale: En français, les deux-points introduisent naturellement le contenu de la citation après « il est écrit », sans qu’il soit nécessaire de traduire ὅτι par « que ».
- source_word: Τοῖς ἀγγέλοις αὐτοῦ
  choice: à ses anges
  rationale: Le datif désigne les destinataires de l’ordre; le possessif français rend naturellement αὐτοῦ.
- source_word: ἐντελεῖται
  choice: il donnera … des ordres
  rationale: Le futur de ἐντέλλομαι exprime le fait de donner une consigne ou un ordre. Cette tournure s’emploie naturellement avec « à ses anges » et évite l’ambiguïté de « il commandera ses anges ».
- source_word: περὶ σοῦ
  choice: à ton sujet
  rationale: Rend directement περί avec le génitif au sens de « au sujet de, concernant », sans lui substituer l’idée plus interprétative de « en ta faveur ».
- source_word: τοῦ διαφυλάξαι σε
  choice: afin qu’ils te gardent
  rationale: La proposition finale explicite naturellement en français le but de l’ordre. « Garder » préserve le sens protecteur de διαφυλάσσω et le lien lexical avec la citation scripturaire.
theological_decisions:
- issue: Étendue de la citation du Psaume dans la parole du tentateur
  choice: Traduire uniquement les mots cités par Luc, sans compléter la suite du Psaume.
  alternative: Ajouter la formulation plus complète de Psaume 91.11 ou harmoniser explicitement la citation avec elle.
  rationale: Le texte doit représenter la forme de la citation transmise par Luc, y compris son caractère partiel, sans importer des mots absents du grec de ce verset.
- issue: Rapport entre περὶ σοῦ et τοῦ διαφυλάξαι σε
  choice: Conserver « à ton sujet » puis exprimer le but par « afin qu’ils te gardent ».
  alternative: Fondre les deux éléments en « il ordonnera à ses anges de te protéger ».
  rationale: La formulation retenue préserve les deux éléments distincts du grec et évite de résoudre inutilement la relation syntaxique par une paraphrase plus compacte.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe garde la forme solennelle d’une citation scripturaire tout en restant idiomatique. Aucun archaïsme ni développement harmonisant n’a été ajouté.
