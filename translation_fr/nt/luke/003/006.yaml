id: LUK.3.6
reference: Luke 3:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ὄψεται πᾶσα σὰρξ τὸ σωτήριον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/006.yaml
  text: and all flesh will see the salvation of God[a][b].
translation:
  language: fr
  text: et toute chair verra le salut de Dieu[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « toute l’humanité ». Le grec dit littéralement « toute chair », en écho à Ésaïe 40.5; l’expression désigne ici tous les êtres humains.
    reason: lexical_alternative
  - marker: b
    text: Ou « le salut venant de Dieu ».
    reason: alternative_reading
lexical_decisions:
- source_word: ὄψεται
  choice: verra
  rationale: Le futur de ὁράω a ici son sens direct. « Verra » est naturel en français moderne et conserve l’image visuelle concrète.
- source_word: πᾶσα σὰρξ
  choice: toute chair
  rationale: Cette expression prophétique d’arrière-plan sémitique désigne l’humanité entière et fait écho à Ésaïe 40.5. La traduction littérale conserve cet écho et la formulation marquante du texte source; le sens idiomatique est indiqué en note.
- source_word: σωτήριον
  choice: le salut
  rationale: Employé comme substantif avec l’article, le terme désigne ici le salut. Ce choix direct préserve l’ampleur théologique de l’œuvre salvatrice de Dieu et l’écho à Ésaïe.
- source_word: τοῦ θεοῦ
  choice: de Dieu
  rationale: Le génitif grec est rendu formellement par « de Dieu », expression qui laisse ouverte la nuance de relation, d’appartenance ou de source. « Venant de Dieu » explicite la source et figure donc en note.
theological_decisions:
- issue: Sens de l’expression πᾶσα σὰρξ
  choice: 'La portée est universellement humaine : toute l’humanité verra le salut de Dieu.'
  alternative: Une lecture strictement littérale visant l’ensemble des êtres de chair.
  rationale: Dans cette citation prophétique, l’expression désigne les humains collectivement. « Toute chair » maintient l’écho scripturaire et la tension du langage original sans masquer son référent humain.
- issue: Valeur du génitif τοῦ θεοῦ
  choice: « le salut de Dieu », en conservant la construction et son ouverture sémantique.
  alternative: « le salut venant de Dieu », qui comprend le génitif comme indiquant explicitement la source.
  rationale: Le grec permet naturellement de rapporter le salut à Dieu sans imposer une seule analyse du génitif. La traduction principale préserve cette souplesse; la lecture de provenance est signalée en note.
translation_notes:
  register: Français international moderne, sobre et digne. La tournure « toute chair », légèrement marquée mais intelligible, est conservée pour son importance intertextuelle; les deux notes explicitent l’idiome et l’ambiguïté du génitif.
