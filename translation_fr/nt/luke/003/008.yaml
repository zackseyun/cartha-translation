id: LUK.3.8
reference: Luke 3:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ποιήσατε οὖν καρποὺς ἀξίους τῆς μετανοίας· καὶ μὴ ἄρξησθε λέγειν ἐν ἑαυτοῖς· Πατέρα ἔχομεν τὸν Ἀβραάμ, λέγω γὰρ ὑμῖν ὅτι δύναται ὁ θεὸς ἐκ τῶν λίθων τούτων ἐγεῖραι τέκνα τῷ Ἀβραάμ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/008.yaml
  text: Therefore produce fruits worthy of repentance[a], and do not begin to say among yourselves[b], ‘We have Abraham as our father,’ for I tell you that God is able to raise up children for Abraham from these stones.
translation:
  language: fr
  text: 'Produisez donc des fruits qui correspondent à la repentance[a], et ne vous mettez pas à dire entre vous[b] : « Nous avons Abraham pour père. » Car je vous dis que Dieu peut, de ces pierres, susciter à Abraham des enfants.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « des fruits dignes de la repentance ». On peut aussi traduire : « des fruits conformes à la repentance ». Le grec emploie le pluriel et souligne une conduite qui correspond à une repentance authentique.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « en vous-mêmes » ou « dans votre for intérieur ». L’expression peut désigner soit un raisonnement intérieur, soit des paroles échangées au sein du groupe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιήσατε
  choice: Produisez
  rationale: L’impératif aoriste appelle à une action résolue. Avec « fruits », « produire » est naturel en français et reste proche du verbe grec.
- source_word: οὖν
  choice: donc
  rationale: Marque la conséquence tirée de l’avertissement précédent.
- source_word: καρποὺς ἀξίους τῆς μετανοίας
  choice: des fruits qui correspondent à la repentance
  rationale: Conserve le pluriel « fruits » et exprime l’idée d’une conduite en accord avec une repentance réelle, sans suggérer qu’elle mérite le pardon.
- source_word: μὴ ἄρξησθε λέγειν
  choice: ne commencez pas à vous dire
  rationale: Rend directement l’idée de ne pas même commencer ce discours destiné à se rassurer.
- source_word: ἐν ἑαυτοῖς
  choice: entre vous
  rationale: Le pluriel réflexif peut désigner des paroles échangées au sein du groupe; la note préserve aussi la possibilité d’un discours intérieur.
- source_word: Πατέρα ἔχομεν τὸν Ἀβραάμ
  choice: Nous avons Abraham pour père
  rationale: Formulation française naturelle qui conserve la revendication emphatique d’une ascendance abrahamique.
- source_word: δύναται ὁ θεὸς
  choice: Dieu peut
  rationale: Exprime clairement la capacité souveraine de Dieu dans un français actuel.
- source_word: ἐκ τῶν λίθων τούτων ἐγεῖραι τέκνα τῷ Ἀβραάμ
  choice: de ces pierres, Dieu peut susciter des enfants à Abraham
  rationale: « Susciter » rend le pouvoir de faire apparaître ou de donner naissance à une descendance inattendue; l’antéposition de « de ces pierres » garde son relief.
theological_decisions:
- issue: Sens des fruits correspondant à la repentance
  choice: Des actes visibles accordés à une repentance authentique
  alternative: « des fruits dignes de la repentance » ou « le fruit qui convient à la repentance »
  rationale: ἀξίους indique une correspondance appropriée. La formulation évite à la fois d’effacer l’exigence éthique et de présenter les actes comme méritant le pardon.
- issue: Valeur de la descendance d’Abraham
  choice: Jean récuse la confiance placée dans la seule ascendance physique
  alternative: Expliciter dans le texte la notion de « vrais enfants » d’Abraham
  rationale: Le grec affirme que Dieu peut susciter des enfants à Abraham, sans ajouter ici la qualification « vrais ». La traduction garde cette tension et n’importe pas une formulation doctrinale ultérieure.
translation_notes:
  register: Français international moderne, digne et accessible. « Repentance » est retenu pour μετάνοια en raison de sa précision biblique; « qui correspondent à » en explicite naturellement le rapport avec les fruits. Les deux ambiguïtés principales sont conservées en notes.
