id: LUK.3.17
reference: Luke 3:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὗ τὸ πτύον ἐν τῇ χειρὶ αὐτοῦ ⸀διακαθᾶραι τὴν ἅλωνα αὐτοῦ καὶ ⸀συναγαγεῖν τὸν σῖτον εἰς τὴν ἀποθήκην αὐτοῦ, τὸ δὲ ἄχυρον κατακαύσει πυρὶ ἀσβέστῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/017.yaml
  text: His winnowing fork is in his hand to thoroughly clear his threshing floor and to gather the wheat into his storehouse[c][b][a], but the chaff he will burn up with unquenchable fire.
translation:
  language: fr
  text: Il tient dans sa main la pelle à vanner[a], afin de nettoyer entièrement son aire de battage et de rassembler le blé dans son grenier[b] ; mais la bale, il la brûlera dans un feu qu’on ne peut éteindre[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « fourche à vanner » ; traditionnellement, « van ». Le terme grec désigne l’instrument avec lequel on lançait le grain en l’air pour le séparer de la bale.
    reason: lexical_alternative
  - marker: b
    text: Ou « entrepôt » ou « grange ».
    reason: lexical_alternative
  - marker: c
    text: Ou « dans un feu inextinguible ».
    reason: lexical_alternative
lexical_decisions:
- source_word: πτύον
  choice: pelle à vanner
  rationale: Désigne l’instrument servant à lancer le grain en l’air pour que le vent sépare la bale du grain. « Pelle à vanner » est naturel et précis en français moderne.
- source_word: διακαθᾶραι
  choice: nettoyer entièrement
  rationale: Le verbe composé exprime un nettoyage complet de l’aire, ce que l’adverbe « entièrement » restitue clairement.
- source_word: ἅλωνα
  choice: aire de battage
  rationale: Terme agricole usuel pour l’endroit où les céréales sont battues et vannées ; il maintient intacte l’image du texte.
- source_word: συναγαγεῖν
  choice: rassembler
  rationale: Rend directement l’action de réunir et de mettre à l’abri le grain après le vannage.
- source_word: σῖτον
  choice: blé
  rationale: Le mot peut désigner le grain en général, mais « blé » convient naturellement au contraste avec la bale dans ce contexte.
- source_word: ἀποθήκην
  choice: grenier
  rationale: Désigne ici le lieu où l’on entrepose le grain. « Grenier » est idiomatique en français biblique moderne sans préciser indûment le type de bâtiment.
- source_word: ἄχυρον
  choice: bale
  rationale: Dans le contexte du vannage, « bale » désigne les enveloppes légères séparées du grain et est plus précis que « paille ».
- source_word: κατακαύσει
  choice: brûlera
  rationale: Le contexte rend manifeste la destruction par le feu ; en français, « brûlera » exprime naturellement l’action sans tournure lourde. L’intensité du composé est portée par l’image entière.
- source_word: πυρὶ ἀσβέστῳ
  choice: dans un feu qu’on ne peut éteindre
  rationale: Rend explicitement l’idée d’un feu impossible à éteindre, dans une formulation immédiatement compréhensible.
- source_word: οὗ
  choice: Il tient dans sa main
  rationale: Le relatif génitif décrit celui qui vient. Une phrase indépendante avec possession implicite produit un français naturel tout en conservant le lien avec son antécédent contextuel.
theological_decisions:
- issue: Image du jugement dans la métaphore agricole
  choice: Conserver la séparation décisive entre le blé rassemblé et la bale brûlée, ainsi que la force du feu impossible à éteindre.
  alternative: Interpréter explicitement l’image soit comme un jugement historique limité à Israël, soit comme une formulation doctrinale complète du châtiment final.
  rationale: Le verset exprime clairement séparation, salut et jugement, mais n’en développe pas ici toutes les modalités. La traduction préserve cette tension sans ajouter de systématisation doctrinale.
translation_notes:
  register: Français international moderne, naturel et digne. Le vocabulaire agricole est précis mais accessible ; les notes proposent les variantes traditionnelles ou plus littérales.
