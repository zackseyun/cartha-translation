id: LUK.3.14
reference: Luke 3:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐπηρώτων δὲ αὐτὸν καὶ στρατευόμενοι λέγοντες· ⸂Τί ποιήσωμεν καὶ ἡμεῖς⸃; καὶ εἶπεν ⸀αὐτοῖς· Μηδένα διασείσητε μηδὲ συκοφαντήσητε, καὶ ἀρκεῖσθε τοῖς ὀψωνίοις ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/014.yaml
  text: And soldiers also were asking him[a], saying, “What should we also do?” And he said to them, “Do not extort money from anyone, nor accuse anyone falsely[c][b], and be content with your wages.”
translation:
  language: fr
  text: 'Des soldats aussi lui demandaient : « Et nous, que devons-nous faire ? » Il leur répondit : « N’extorquez rien à personne[a], ne portez pas de fausses accusations contre personne, et contentez-vous de votre solde[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe grec peut littéralement évoquer le fait de secouer quelqu’un ; ici, il désigne l’extorsion par coercition ou intimidation.
    reason: lexical_alternative
  - marker: b
    text: Le terme grec peut désigner la solde, la rémunération ou les provisions accordées aux soldats.
    reason: lexical_alternative
lexical_decisions:
- source_word: στρατευόμενοι
  choice: des soldats
  rationale: Le participe désigne ici des personnes en service militaire. « Des soldats » est précis, naturel et immédiatement compréhensible.
- source_word: Τί ποιήσωμεν καὶ ἡμεῖς
  choice: Et nous, que devons-nous faire ?
  rationale: 'Cette formulation française naturelle conserve l’insistance explicite de καὶ ἡμεῖς : les soldats demandent ce qu’eux aussi doivent faire.'
- source_word: διασείσητε
  choice: ne soutirez d’argent à personne par la force
  rationale: Le verbe évoque une intimidation ou une contrainte exercée pour obtenir un gain. La formulation explicite l’abus coercitif sans employer un terme familier.
- source_word: συκοφαντήσητε
  choice: n’accusez personne faussement
  rationale: Le verbe désigne une accusation mensongère ou abusive, éventuellement intéressée. Cette traduction conserve le sens large sans le réduire au seul chantage.
- source_word: ἀρκεῖσθε
  choice: contentez-vous
  rationale: L’impératif présent exprime une attitude durable de satisfaction à l’égard de ce que l’on reçoit.
- source_word: ὀψωνίοις
  choice: solde
  rationale: Dans ce contexte militaire, le terme renvoie à la rémunération ou aux provisions des soldats. « Solde » est le terme français précis et courant pour leur rémunération.
theological_decisions:
- issue: Instruction éthique adressée aux soldats
  choice: Jean leur interdit l’extorsion, les fausses accusations et l’avidité dans leur situation présente.
  alternative: Comprendre que ce verset condamne implicitement tout service militaire.
  rationale: Le texte donne directement aux soldats des prescriptions contre l’abus de pouvoir et le mécontentement, sans leur ordonner d’abandonner le service militaire. La traduction ne tire aucune conclusion doctrinale au-delà de ces prescriptions.
translation_notes:
  register: Français international moderne, digne et accessible. « Et nous » préserve l’accent grec sur le fait que les soldats posent eux aussi la question. « Solde » maintient clairement le contexte militaire.
