  verdict: revise
  source_fidelity: 'La formulation rend bien l’interrogation inclusive des soldats, les deux interdictions et l’appel à se contenter de leur solde. Toutefois, « d’argent » restreint indûment διασείσητε : le grec interdit l’extorsion coercitive sans en préciser l’objet. « Par la force » peut aussi être compris comme une violence strictement physique, alors que l’intimidation est également en jeu.'
  naturalness: Le français est globalement naturel, moderne et d’un registre approprié. « N’extorquez rien à personne » est à la fois idiomatique et plus fidèle; « ne portez pas de fausses accusations contre personne » exprime clairement la seconde interdiction.
  terminology: « Soldats » et « solde » sont précis dans le contexte militaire. La révision conserve la portée large de συκοφαντήσητε sans l’assimiler au seul chantage, et celle de διασείσητε sans ajouter un objet monétaire absent du texte.
  issues:
