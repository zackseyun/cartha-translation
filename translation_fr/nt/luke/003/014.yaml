    rationale: διασείσητε désigne l’extorsion ou la coercition abusive, mais le texte grec ne mentionne pas explicitement l’argent. « Rien » préserve cette absence de spécification.
  - severity: low
    issue: « Par la force » peut limiter la coercition à la force physique.
    rationale: Le verbe peut impliquer intimidation et abus de pouvoir aussi bien que contrainte physique. « Extorquer » porte déjà l’idée de coercition, précisée utilement en note.
