id: LUK.3.9
reference: Luke 3:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἤδη δὲ καὶ ἡ ἀξίνη πρὸς τὴν ῥίζαν τῶν δένδρων κεῖται· πᾶν οὖν δένδρον μὴ ποιοῦν καρπὸν καλὸν ἐκκόπτεται καὶ εἰς πῦρ βάλλεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/009.yaml
  text: And already the ax is laid at the root of the trees[c][b][a]. Therefore every tree not producing good fruit is cut down and thrown into the fire.
translation:
  language: fr
  text: Déjà, la hache est placée à la racine des arbres. Tout arbre qui ne produit pas de bon fruit est donc coupé et jeté au feu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤδη δὲ καὶ
  choice: Déjà
  rationale: Rend l’imminence soulignée par ἤδη; δὲ καὶ assure ici la continuité et l’insistance sans exiger une traduction distincte, qui alourdirait le français.
- source_word: ἡ ἀξίνη
  choice: la hache
  rationale: Désigne naturellement en français l’outil servant à abattre l’arbre dans cette image de jugement.
- source_word: πρὸς τὴν ῥίζαν τῶν δένδρων
  choice: à la racine des arbres
  rationale: Expression française idiomatique qui conserve la position de la hache et l’idée d’une action imminente.
- source_word: κεῖται
  choice: est placée
  rationale: Le verbe signifie que la hache se trouve là, prête à servir; «est placée» préserve cet état résultant sans suggérer qu’elle frappe déjà.
- source_word: πᾶν οὖν δένδρον
  choice: Tout arbre… donc
  rationale: Conserve la portée universelle de πᾶν et la valeur déductive de οὖν, placé à un endroit naturel en français.
- source_word: μὴ ποιοῦν καρπὸν καλὸν
  choice: qui ne produit pas de bon fruit
  rationale: «Produire du fruit» est naturel en français et reste proche de ποιέω, tandis que «bon fruit» maintient la portée morale de καλόν sans l’expliciter.
- source_word: ἐκκόπτεται
  choice: est coupé
  rationale: Dans ce contexte arboricole, «coupé» exprime clairement l’abattage; «abattu» serait également idiomatique mais s’éloignerait davantage de la forme verbale grecque.
- source_word: εἰς πῦρ βάλλεται
  choice: est… jeté au feu
  rationale: Formulation française courante qui conserve le passif et la sévérité de l’image; «au feu» rend idiomatiquement le mouvement vers le feu exprimé par εἰς.
theological_decisions:
- issue: Image métaphorique du jugement
  choice: Conserver sans l’expliquer l’image de la hache, de l’arbre sans bon fruit et du feu.
  alternative: Identifier explicitement le feu à l’enfer, ou limiter l’image à un jugement historique précis.
  rationale: Le verset annonce un jugement sévère et imminent, mais ne définit pas ici la portée exacte du feu. La traduction ne doit pas trancher ce que le texte laisse ouvert.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proche du grec tout en étant naturelle; aucune note n’est nécessaire, les variantes proposées ne représentant pas d’ambiguïté substantielle à signaler.
