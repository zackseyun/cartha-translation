id: LUK.3.19
reference: Luke 3:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ δὲ Ἡρῴδης ὁ τετραάρχης, ἐλεγχόμενος ὑπ’ αὐτοῦ περὶ Ἡρῳδιάδος τῆς γυναικὸς τοῦ ἀδελφοῦ αὐτοῦ καὶ περὶ πάντων ὧν ἐποίησεν πονηρῶν ὁ Ἡρῴδης,
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/019.yaml
  text: But Herod the tetrarch[a], being rebuked by him concerning Herodias, his brother’s wife, and concerning all the evil things Herod had done,
translation:
  language: fr
  text: Mais Hérode le tétrarque, repris par lui au sujet d’Hérodiade, la femme de son frère, et de tout le mal qu’il avait fait,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τετραάρχης
  choice: tétrarque
  rationale: Conserve le titre politico-administratif précis de l’époque; le terme est établi en français et évite d’aplatir le sens en simple « dirigeant ».
- source_word: ἐλεγχόμενος
  choice: repris
  rationale: Exprime la réprobation morale et la mise en cause contenues dans le participe grec, tout en gardant sa valeur circonstancielle et sans imposer un cadre judiciaire.
- source_word: ὑπ’ αὐτοῦ
  choice: par lui
  rationale: Préserve le pronom grec, dont le référent est Jean dans le contexte, sans l’expliciter dans le corps du texte.
- source_word: περὶ Ἡρῳδιάδος
  choice: au sujet d’Hérodiade
  rationale: Rend naturellement περὶ et permet de conserver son parallélisme avec le second complément introduit par περὶ.
- source_word: τῆς γυναικὸς τοῦ ἀδελφοῦ αὐτοῦ
  choice: la femme de son frère
  rationale: Restitue clairement et naturellement la chaîne de génitifs ainsi que la relation au cœur du reproche.
- source_word: καὶ περὶ πάντων ὧν ἐποίησεν πονηρῶν
  choice: et de tout le mal qu’il avait fait
  rationale: Rend idiomatiquement la totalité des actes mauvais visés; le singulier collectif français « tout le mal » correspond naturellement au grec sans minimiser la pluralité des méfaits.
- source_word: δὲ
  choice: Mais
  rationale: Marque le contraste narratif avec ce qui précède et convient en tête de proposition.
theological_decisions:
- issue: Force morale de la critique adressée à Hérode
  choice: « repris »
  alternative: « réprimandé », « convaincu de faute » ou « dénoncé »
  rationale: « Repris » conserve la portée prophétique et morale de ἐλέγχω sans préciser indûment si Jean se contente de réprimander Hérode ou met aussi ses fautes en lumière.
translation_notes:
  register: 'Français moderne, digne et lisible. La structure demeure volontairement inachevée par une virgule, conformément au grec: la phrase se poursuit au verset suivant. « Tétrarque » conserve la précision historique; « repris » garde une légère formalité adaptée au registre biblique sans archaïsme marqué.'
