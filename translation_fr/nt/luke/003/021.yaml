id: LUK.3.21
reference: Luke 3:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἐγένετο δὲ ἐν τῷ βαπτισθῆναι ἅπαντα τὸν λαὸν καὶ Ἰησοῦ βαπτισθέντος καὶ προσευχομένου ἀνεῳχθῆναι τὸν οὐρανὸν
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/021.yaml
  text: It happened that when all the people were baptized[a], and Jesus also had been baptized and was praying, heaven was opened,
translation:
  language: fr
  text: Or, comme tout le peuple se faisait baptiser, Jésus fut lui aussi baptisé ; et, pendant qu’il priait, le ciel[a] s’ouvrit,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot grec peut désigner soit le ciel visible, soit le domaine céleste. Ici, le contexte de révélation favorise le second sens.
    reason: alternative lexicale et préservation de l’ambiguïté de οὐρανός
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: Or
  rationale: La formule introduit la progression du récit. En français, « Or » marque naturellement la transition sans ajouter un « maintenant » absent du grec ; la valeur événementielle de Ἐγένετο ressort de l’événement principal, « le ciel s’ouvrit ».
- source_word: ἐν τῷ βαπτισθῆναι ἅπαντα τὸν λαὸν
  choice: quand tout le peuple eut été baptisé
  rationale: La construction ἐν suivi de l’infinitif articulé a ici une valeur temporelle. Le passé antérieur français situe ce baptême collectif dans le cadre antérieur à l’ouverture du ciel, sans remplacer le passif du grec par une formulation active.
- source_word: καὶ Ἰησοῦ βαπτισθέντος
  choice: Jésus, lui aussi, fut baptisé
  rationale: « Lui aussi » rend la valeur additive de καί. La formulation passive conserve le point de vue du texte et évite la tournure lourde « Jésus ayant été baptisé ».
- source_word: καὶ προσευχομένου
  choice: et pendant qu’il priait
  rationale: L’imparfait rend l’action en cours, contemporaine de l’ouverture du ciel. La proposition temporelle est idiomatique en français moderne.
- source_word: ἀνεῳχθῆναι
  choice: s’ouvrit
  rationale: Le passif grec est rendu par le pronominal français idiomatique, sans introduire l’image plus forte d’un ciel déchiré.
- source_word: τὸν οὐρανὸν
  choice: le ciel
  rationale: « Ciel » est le terme français naturel et conserve la possibilité de désigner tant le ciel visible que le domaine céleste ; le contexte révélatoire favorise ce dernier sens.
theological_decisions:
- issue: Sens de οὐρανός dans la scène du baptême
  choice: le ciel
  alternative: le ciel visible / la voûte céleste
  rationale: Le contexte immédiat de la descente de l’Esprit et de la voix divine favorise le domaine céleste, mais « le ciel » préserve en français l’ambiguïté lexicale du grec sans la résoudre artificiellement.
- issue: Relation temporelle entre le baptême de Jésus, sa prière et l’ouverture du ciel
  choice: Jésus est baptisé, puis le ciel s’ouvre pendant qu’il prie
  alternative: présenter le baptême et la prière comme deux actions entièrement simultanées à l’ouverture du ciel
  rationale: Le participe aoriste βαπτισθέντος présente naturellement le baptême comme accompli, tandis que le participe présent προσευχομένου présente la prière comme en cours lorsque le ciel s’ouvre.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe grecque très imbriquée est légèrement redistribuée en deux unités coordonnées afin d’éviter une cascade de participes, tout en conservant la progression temporelle et la focalisation sur la prière de Jésus.
