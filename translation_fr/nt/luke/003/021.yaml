  naturalness: La révision proposée est fluide en français international moderne. « Se faisait baptiser » est idiomatique pour une action collective servant d’arrière-plan, tandis que « fut lui aussi baptisé » conserve la formulation passive appliquée à Jésus. La virgule finale est maintenue, car la phrase se poursuit au verset suivant.
