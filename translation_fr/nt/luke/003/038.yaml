  text: τοῦ Ἐνὼς τοῦ Σὴθ τοῦ Ἀδὰμ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/038.yaml
  text: the son of Enosh[a], the son of Seth, the son of Adam, the son of God.
translation:
  language: fr
  text: fils d’Énosh[a], fils de Seth, fils d’Adam, fils de Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec répète simplement la construction au génitif : « d’Énosh, de Seth, d’Adam, de Dieu » ; « fils » est ajouté en français d’après la syntaxe établie de la généalogie.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦ Ἐνὼς
  choice: fils d’Énosh
  rationale: Le génitif répété poursuit la formule généalogique de Luc, où le lien filial est sous-entendu. « fils de » est explicité pour rendre la phrase naturelle et claire en français. La forme « Énosh » correspond à la translittération usuelle du nom.
- source_word: τοῦ Σὴθ
  choice: fils de Seth
  rationale: Le même génitif elliptique exprime la filiation. « Seth » est la forme française traditionnelle et courante du nom propre.
- source_word: τοῦ Ἀδὰμ
  choice: fils d’Adam
  rationale: La construction généalogique implique encore la filiation. « Adam » est conservé comme nom propre plutôt que traduit par « homme ».
- source_word: τοῦ θεοῦ
  choice: fils de Dieu
  rationale: Le dernier génitif reprend la même structure que les noms précédents. L’explicitation de « fils de » préserve l’effet culminant de la généalogie, tandis que « Dieu » désigne ici le référent divin.
theological_decisions:
- issue: Rendu de τοῦ θεοῦ à la fin de la généalogie d’Adam
  choice: fils de Dieu
  alternative: de Dieu ; venant de Dieu
  rationale: Le grec ne donne formellement qu’un génitif, mais la chaîne généalogique fait sous-entendre le même rapport filial à chaque étape. « fils de Dieu » conserve le parallélisme et la tension théologique du texte sans préciser davantage la nature de cette filiation.
translation_notes:
  register: Français moderne, sobre et digne. La formulation nominale sans répétition d’article convient à la continuité d’une liste généalogique. Les élisions « d’Énosh » et « d’Adam » sont naturelles en français.
