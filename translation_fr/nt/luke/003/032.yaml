  text: τοῦ Ἰεσσαὶ τοῦ Ἰωβὴλ τοῦ Βόος τοῦ ⸀Σαλὰ τοῦ Ναασσὼν
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/032.yaml
  text: the son of Jesse, the son of Jobed, the son of Boaz, the son of Sala, the son of Nahshon,
translation:
  language: fr
  text: fils de Jessé, fils de Jobel, fils de Booz, fils de Sala, fils de Naasson,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦ
  choice: fils de
  rationale: Dans cette généalogie, le génitif répété exprime la filiation; « fils de » restitue naturellement en français l’ellipse grecque.
- source_word: Ἰεσσαί
  choice: Jessé
  rationale: Forme française traditionnelle et immédiatement reconnaissable du nom.
- source_word: Ἰωβήλ
  choice: Jobel
  rationale: Translittération française du nom tel qu’il apparaît dans le texte grec fourni, sans le normaliser silencieusement en « Obed » ni adopter « Jobed », qui ne correspond pas exactement à cette forme grecque.
- source_word: Βόος
  choice: Booz
  rationale: Forme française traditionnelle correspondant à ce nom biblique.
- source_word: Σαλά
  choice: Sala
  rationale: Translittération directe de la leçon grecque fournie.
- source_word: Ναασσών
  choice: Naasson
  rationale: Forme française traditionnelle proche de la graphie grecque.
theological_decisions:
- issue: Nature de la relation généalogique
  choice: Répéter « fils de » pour chaque nom
  alternative: Présenter une simple suite de noms ou employer « descendant de »
  rationale: Le contexte et la construction génitivale de Luc indiquent une généalogie formulée comme une chaîne de filiations; la répétition conserve aussi le rythme du texte.
translation_notes:
  register: Français moderne, sobre et digne. Les formes françaises établies des noms sont retenues lorsqu’elles correspondent au grec; « Jobel » suit précisément la forme Ἰωβήλ fournie. La ponctuation finale conserve l’enchaînement avec les versets voisins.
