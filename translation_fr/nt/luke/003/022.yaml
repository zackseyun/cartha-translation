id: LUK.3.22
reference: Luke 3:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ καταβῆναι τὸ πνεῦμα τὸ ἅγιον σωματικῷ εἴδει ⸀ὡς περιστερὰν ἐπ’ αὐτόν, καὶ φωνὴν ἐξ οὐρανοῦ ⸀γενέσθαι· Σὺ εἶ ὁ υἱός μου ὁ ἀγαπητός, ἐν σοὶ εὐδόκησα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/022.yaml
  text: 'and the Holy Spirit descended on him in bodily form like a dove[a], and a voice came from heaven: “You are my beloved Son; in you I am well pleased.”'
translation:
  language: fr
  text: 'et l’Esprit Saint descendit sur lui sous une forme corporelle, comme une colombe, et une voix vint du ciel : « Tu es mon Fils bien-aimé ; en toi, j’ai pris plaisir[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « en toi, je prends plaisir ».'
    reason: L’aoriste εὐδόκησα est rendu directement par le passé composé dans le texte ; cette formulation française peut aussi exprimer l’approbation actuelle et durable impliquée par la déclaration.
lexical_decisions:
- source_word: καταβῆναι
  choice: descendit
  rationale: L’infinitif aoriste s’inscrit dans la suite narrative dépendant du verset précédent. « Descendit » conserve le mouvement vers le bas dans un français naturel et digne.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: l’Esprit Saint
  rationale: C’est la désignation usuelle et précise en français contemporain.
- source_word: σωματικῷ εἴδει
  choice: sous une forme corporelle
  rationale: Cette formulation exprime une manifestation perceptible ayant un aspect corporel, sans préciser davantage sa nature.
- source_word: ὡς περιστερὰν
  choice: comme une colombe
  rationale: « Comme » maintient explicitement la comparaison introduite par ὡς et n’affirme pas que l’Esprit devint littéralement une colombe.
- source_word: ἐπ’ αὐτόν
  choice: sur lui
  rationale: Rend simplement le mouvement ou l’arrivée de l’Esprit sur Jésus.
- source_word: φωνὴν ἐξ οὐρανοῦ γενέσθαι
  choice: une voix vint du ciel
  rationale: γενέσθαι avec φωνή décrit idiomatiquement la survenue de la voix ; « vint du ciel » est clair et naturel.
- source_word: Σὺ εἶ
  choice: Tu es
  rationale: L’adresse directe et emphatique est rendue sans alourdir la phrase française.
- source_word: ὁ υἱός μου ὁ ἀγαπητός
  choice: mon Fils bien-aimé
  rationale: « Bien-aimé » garde la force affective et solennelle de ἀγαπητός ; la tournure possessive est idiomatique.
- source_word: ἐν σοὶ
  choice: en toi
  rationale: La traduction conserve directement la préposition ἐν et l’expression théologique sans la remplacer par « de toi ».
- source_word: εὐδόκησα
  choice: j’ai pris plaisir
  rationale: Le passé composé rend l’aoriste et exprime naturellement l’approbation ou le plaisir. Une autre formulation française courante est signalée en note.
theological_decisions:
- issue: Nature de la manifestation de l’Esprit
  choice: L’Esprit descend sous une forme corporelle, comparée à une colombe.
  alternative: L’Esprit descend sous la forme d’une colombe réelle.
  rationale: La combinaison σωματικῷ εἴδει ὡς περιστερὰν affirme une manifestation corporelle ou visible tout en maintenant une comparaison ; elle ne dit pas explicitement que l’Esprit est devenu une colombe.
- issue: Valeur de l’aoriste εὐδόκησα
  choice: « en toi, j’ai pris plaisir »
  alternative: « en toi, je prends plaisir » ou « tu as toute mon approbation »
  rationale: Le passé composé préserve la morphologie passée de l’aoriste sans exclure une approbation qui demeure. La note donne une expression française plus idiomatique, mais moins formellement proche.
translation_notes:
  register: Français international moderne, clair et solennel. La syntaxe conserve les deux événements coordonnés du grec. « Forme corporelle » et « comme une colombe » maintiennent ensemble la visibilité de la manifestation et le caractère comparatif de l’image.
