review_pass:
  verdict: revise
  source_fidelity: Le sens contextuel de πράσσετε est bien celui de percevoir/exiger dans l’activité des collecteurs d’impôts. Toutefois, « rien au-delà de ce qui vous a été prescrit » est moins idiomatique et « prescrit » peut évoquer une obligation imposée aux collecteurs plutôt que le montant ou la norme qui leur est fixé. « Plus que ce qui vous a été fixé » rend naturellement Μηδὲν πλέον et le parfait passif διατεταγμένον.
  naturalness: « Ne percevez pas plus que ce qui vous a été fixé » est une formulation moderne, claire et sobre en français international. Elle évite la tournure lourde « ne percevez rien au-delà de » tout en gardant la limite quantitative explicite dans le grec.
  terminology: « Percevez » convient au contexte fiscal immédiat sans introduire indûment le mot « impôts » dans le texte. « Ce qui vous a été fixé » conserve l’idée d’une disposition ou d’un montant officiellement déterminé, sans préciser l’autorité qui l’a établi.
  issues:
  - severity: low
    issue: Tournure quantitative peu naturelle
    rationale: La négation « ne percevez rien au-delà de » est compréhensible, mais « ne percevez pas plus que » correspond plus directement à μηδὲν πλέον et est plus naturelle en français.
  - severity: low
    issue: Nuance possiblement imprécise de « prescrit »
    rationale: En français, « ce qui vous a été prescrit » peut se comprendre comme une instruction donnée aux collecteurs. Le grec vise ce qui leur a été fixé ou ordonné comme limite; « fixé » est plus transparent dans ce contexte.
