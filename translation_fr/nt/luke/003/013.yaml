  text: ὁ δὲ εἶπεν πρὸς αὐτούς· Μηδὲν πλέον παρὰ τὸ διατεταγμένον ὑμῖν πράσσετε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/013.yaml
  text: And he said to them[a], “Collect no more than what has been ordered for you.”
translation:
  language: fr
  text: 'Il leur dit : « Ne percevez pas plus que ce qui vous a été fixé.[a] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « Ne faites rien de plus que ce qui vous a été fixé. » Dans ce contexte, le verbe concerne précisément la perception des impôts.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ
  choice: Il
  rationale: Le sujet pronominal suffit en français; δέ marque ici une légère continuité narrative qu’il n’est pas nécessaire de rendre explicitement.
- source_word: εἶπεν πρὸς αὐτούς
  choice: leur dit
  rationale: Tour français naturel et fidèle pour λέγω suivi de πρός.
- source_word: Μηδὲν πλέον
  choice: rien au-delà de
  rationale: Cette formulation exprime clairement l’interdiction de dépasser une limite fixée.
- source_word: παρὰ τὸ διατεταγμένον ὑμῖν
  choice: de ce qui vous a été prescrit
  rationale: Le parfait passif de διατάσσω désigne ce qui a été officiellement fixé ou prescrit; le passif et la portée réglementaire sont conservés.
- source_word: πράσσετε
  choice: percevez
  rationale: Dans le contexte immédiat, Jésus répond à des collecteurs d’impôts; « percevoir » exprime naturellement en français l’activité fiscale visée, sans ajouter un objet absent du grec.
theological_decisions:
- issue: Explicitation contextuelle de l’activité exprimée par πράσσετε
  choice: « Ne percevez rien au-delà de ce qui vous a été prescrit. »
  alternative: « Ne faites rien au-delà de ce qui vous a été prescrit. »
  rationale: Le verbe peut signifier largement « faire », mais, adressé aux collecteurs d’impôts du verset précédent, il vise ici leur activité de perception. La traduction explicite ce sens contextuel tout en signalant en note la formulation plus littérale.
translation_notes:
  register: Français international moderne, sobre et digne. « Percevez » convient au registre administratif du contexte; « prescrit » conserve l’idée d’une limite officiellement fixée.
