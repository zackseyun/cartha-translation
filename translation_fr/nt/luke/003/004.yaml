reference: Luke 3:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὡς γέγραπται ἐν βίβλῳ λόγων Ἠσαΐου τοῦ ⸀προφήτου· Φωνὴ βοῶντος ἐν τῇ ἐρήμῳ· Ἑτοιμάσατε τὴν ὁδὸν κυρίου, εὐθείας ποιεῖτε τὰς τρίβους αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/004.yaml
  text: 'as it is written in the book of the words of Isaiah the prophet[a], “A voice of one crying in the wilderness: ‘Prepare the way of the Lord[b]; make his paths straight.’”'
translation:
  language: fr
  text: 'Comme il est écrit dans le livre des paroles du prophète Ésaïe : « Une voix de quelqu’un qui crie dans le désert[a] : “Préparez le chemin du Seigneur[b], rendez droits ses sentiers.” »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’expression « dans le désert » peut se rattacher à « qui crie », comme dans le texte, ou au commandement qui suit : « Une voix de quelqu’un qui crie : “Dans le désert, préparez le chemin du Seigneur.” »'
    reason: alternative_reading
  - marker: b
    text: Dans l’arrière-plan hébreu de la citation, on peut aussi lire « de l’Éternel » ou « du SEIGNEUR ». La citation reprend Ésaïe 40.3, où l’hébreu porte le nom divin YHWH.
    reason: alternative_reading
lexical_decisions:
- source_word: ὡς γέγραπται
  choice: comme il est écrit
  rationale: Formule française consacrée et naturelle pour introduire une citation de l’Écriture; le présent « est écrit » rend la portée durable du parfait grec.
- source_word: ἐν βίβλῳ λόγων Ἠσαΐου τοῦ προφήτου
  choice: dans le livre des paroles du prophète Ésaïe
  rationale: Rend les deux noms βίβλῳ et λόγων sans lourdeur excessive, tout en identifiant naturellement Ésaïe comme prophète.
- source_word: Φωνὴ βοῶντος
  choice: Une voix crie
  rationale: Formulation française naturelle qui conserve l’idée d’une voix lançant un appel, sans ajouter explicitement l’identité de celui qui crie.
- source_word: ἐν τῇ ἐρήμῳ
  choice: dans le désert
  rationale: « Désert » est le terme français courant dans ce contexte biblique et convient au cadre où se trouve Jean; une note préserve l’autre rattachement syntaxique possible.
- source_word: Ἑτοιμάσατε τὴν ὁδὸν κυρίου
  choice: Préparez le chemin du Seigneur
  rationale: Conserve l’impératif, la métaphore routière et le titre κύριος du texte grec.
- source_word: εὐθείας ποιεῖτε τὰς τρίβους αὐτοῦ
  choice: rendez droits ses sentiers
  rationale: Reproduit directement la construction prédicative et le parallélisme entre « chemin » et « sentiers ».
theological_decisions:
- issue: Traduction de κύριος dans une citation d’Ésaïe où le texte hébreu porte le nom divin YHWH
  choice: Seigneur
  alternative: l’Éternel / le SEIGNEUR
  rationale: Le texte grec de Luc porte κύριος; « Seigneur » le traduit directement et maintient la résonance christologique sans l’expliciter davantage. La note signale le nom divin présent dans l’arrière-plan hébreu.
- issue: Rattachement de l’expression « dans le désert »
  choice: à « crie »
  alternative: au commandement « dans le désert, préparez… »
  rationale: L’ordre des mots dans la citation grecque de Luc favorise naturellement le rattachement à « crie », mais la ponctuation des manuscrits anciens ne tranche pas définitivement; l’autre lecture est donc conservée en note.
translation_notes:
  register: Français international moderne, clair et digne. La formulation garde le ton d’une citation prophétique tout en évitant les tournures inutilement archaïques. « Ésaïe » suit l’usage biblique français courant.
