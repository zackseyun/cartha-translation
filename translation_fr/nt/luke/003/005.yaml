source:
  edition: SBLGNT
  text: πᾶσα φάραγξ πληρωθήσεται καὶ πᾶν ὄρος καὶ βουνὸς ταπεινωθήσεται, καὶ ἔσται τὰ σκολιὰ εἰς ⸀εὐθείαν καὶ αἱ τραχεῖαι εἰς ὁδοὺς λείας·
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/005.yaml
  text: Every valley will be filled[a], and every mountain and hill will be made low, and the crooked places will become straight[b], and the rough ways smooth roads.
translation:
  language: fr
  text: Toute vallée sera comblée[a], toute montagne et toute colline seront abaissées, les passages tortueux deviendront droits[b], et les voies raboteuses deviendront des routes aplanies.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Tout ravin sera comblé » ; le terme grec peut désigner une vallée, un ravin ou une gorge.
    reason: lexical_alternative
  - marker: b
    text: Cette formulation fait écho à Ésaïe 40.4 et emploie l’image de l’aménagement d’une route pour préparer le chemin du Seigneur.
    reason: cross_reference
lexical_decisions:
- source_word: πᾶσα φάραγξ
  choice: Toute vallée
  rationale: φάραγξ peut désigner une vallée, un ravin ou une gorge. « Vallée » est naturel en français et convient à l’image prophétique de nivellement, tandis qu’une note conserve l’alternative plus encaissée « ravin ».
- source_word: πληρωθήσεται
  choice: sera comblée
  rationale: Le futur passif de πληρόω décrit ici le remplissage d’un creux de terrain. « Sera comblée » est plus idiomatique que « sera remplie » dans ce contexte topographique.
- source_word: πᾶν ὄρος καὶ βουνός
  choice: toute montagne et toute colline
  rationale: La traduction maintient les deux termes proches mais distincts, ainsi que la répétition distributive de πᾶς.
- source_word: ταπεινωθήσεται
  choice: seront abaissées
  rationale: Dans ce contexte topographique, le passif de ταπεινόω signifie que les hauteurs seront rendues plus basses. « Abaissées » conserve aussi la résonance figurée possible sans l’imposer.
- source_word: τὰ σκολιά
  choice: les passages sinueux
  rationale: L’adjectif neutre pluriel substantivé désigne ce qui est tortueux. « Passages » explicite sobrement l’image du terrain et de la voie sans la réduire nécessairement à des routes déjà formées.
- source_word: εἰς εὐθείαν
  choice: deviendront droits
  rationale: La construction avec εἰς exprime le résultat d’une transformation. Le singulier abstrait grec est rendu naturellement en français par l’adjectif pluriel « droits ».
- source_word: αἱ τραχεῖαι
  choice: les chemins accidentés
  rationale: L’adjectif féminin pluriel substantivé évoque vraisemblablement des voies rudes ou inégales. « Chemins accidentés » rend clairement la qualité du terrain tout en préparant la mention explicite des routes.
- source_word: εἰς ὁδοὺς λείας
  choice: deviendront des routes lisses
  rationale: ὁδούς est explicite et λείας signifie « lisses » ou « unies ». « Routes lisses » préserve l’image concrète de travaux préparant une voie.
theological_decisions:
- issue: Imagerie prophétique et topographique d’Ésaïe 40.4 reprise par Luc
  choice: Conserver l’imagerie concrète du nivellement du terrain et de la préparation d’une route.
  alternative: Paraphraser en termes moraux, par exemple l’élévation des humbles et l’abaissement des orgueilleux.
  rationale: Le texte présente directement des vallées, des montagnes, des collines et des voies. Garder ces images préserve la force poétique et la tension théologique sans imposer leur interprétation.
translation_notes:
  register: Français international moderne, naturel et digne. La structure poétique est conservée par une série équilibrée de futurs passifs ou de transformations, sans moraliser explicitement l’image prophétique.
