id: LUK.3.1
reference: Luke 3:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἐν ἔτει δὲ πεντεκαιδεκάτῳ τῆς ἡγεμονίας Τιβερίου Καίσαρος, ἡγεμονεύοντος Ποντίου Πιλάτου τῆς Ἰουδαίας, καὶ τετρααρχοῦντος τῆς Γαλιλαίας Ἡρῴδου, Φιλίππου δὲ τοῦ ἀδελφοῦ αὐτοῦ τετρααρχοῦντος τῆς Ἰτουραίας καὶ Τραχωνίτιδος χώρας, καὶ Λυσανίου τῆς Ἀβιληνῆς τετρααρχοῦντος,
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/001.yaml
  text: In the fifteenth year of the reign of Tiberius Caesar[a], while Pontius Pilate was governing Judea, and Herod was tetrarch of Galilee, and Philip his brother was tetrarch of the region of Iturea and Trachonitis, and Lysanias was tetrarch of Abilene[b],
translation:
  language: fr
  text: Au cours de la quinzième année du règne de Tibère César[a], alors que Ponce Pilate gouvernait la Judée, qu’Hérode était tétrarque de la Galilée, que son frère Philippe était tétrarque de la région de l’Iturée et de la Trachonitide, et que Lysanias était tétrarque de l’Abilène[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Durant la quinzième année du règne de Tibère César. »'
    reason: Alternative de formulation pour la construction temporelle grecque.
  - marker: b
    text: Un tétrarque était un dirigeant régional placé sous l’autorité de Rome.
    reason: Note culturelle expliquant un titre politique antique.
lexical_decisions:
- source_word: Ἐν ἔτει δὲ πεντεκαιδεκάτῳ
  choice: La quinzième année
  rationale: Cette formulation française naturelle rend le cadre chronologique de la construction grecque. Le δέ marque ici une transition narrative légère, qui n’exige pas nécessairement un mot distinct en français.
- source_word: ἡγεμονίας
  choice: règne
  rationale: Avec Tibère César comme complément, « règne » exprime naturellement la période d’exercice du pouvoir impérial.
- source_word: Τιβερίου Καίσαρος
  choice: Tibère César
  rationale: Forme française traditionnelle et immédiatement reconnaissable du nom et du titre.
- source_word: ἡγεμονεύοντος Ποντίου Πιλάτου τῆς Ἰουδαίας
  choice: alors que Ponce Pilate gouvernait la Judée
  rationale: Le tour verbal « gouvernait » préserve la valeur circonstancielle du participe sans transformer explicitement celui-ci en titre officiel.
- source_word: τετρααρχοῦντος
  choice: était tétrarque de
  rationale: Le titre historique précis est conservé plutôt que généralisé en « gouvernait » ou « dirigeait ».
- source_word: Φιλίππου δὲ τοῦ ἀδελφοῦ αὐτοῦ
  choice: son frère Philippe
  rationale: Cette formulation française naturelle conserve l’apposition et rattache clairement le possessif à Hérode.
- source_word: τῆς Ἰτουραίας καὶ Τραχωνίτιδος χώρας
  choice: de la région de l’Iturée et de la Trachonitide
  rationale: « région » rend χώρα et évite de présenter ces territoires comme un État moderne; les deux noms géographiques restent coordonnés comme en grec.
- source_word: τῆς Ἀβιληνῆς
  choice: de l’Abilène
  rationale: Le nom désigne ici un territoire antique; l’article contribue en français à signaler cette valeur géographique.
theological_decisions:
- issue: Précision du titre politique τετρααρχοῦντος
  choice: était tétrarque de
  alternative: gouvernait / était le dirigeant de
  rationale: Conserver le titre historique évite d’aplanir le texte et n’impose aucune interprétation confessionnelle.
translation_notes:
  register: Français international moderne, digne et accessible. La longue phrase et l’enchaînement des autorités sont conservés, avec une subordination fluide. Le verset se termine par une virgule parce que la phrase grecque se poursuit au verset suivant.
