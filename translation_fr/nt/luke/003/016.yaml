source:
  edition: SBLGNT
  text: ἀπεκρίνατο ⸂λέγων πᾶσιν ὁ Ἰωάννης⸃· Ἐγὼ μὲν ὕδατι βαπτίζω ὑμᾶς· ἔρχεται δὲ ὁ ἰσχυρότερός μου, οὗ οὐκ εἰμὶ ἱκανὸς λῦσαι τὸν ἱμάντα τῶν ὑποδημάτων αὐτοῦ· αὐτὸς ὑμᾶς βαπτίσει ἐν πνεύματι ἁγίῳ καὶ πυρί·
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/016.yaml
  text: John answered them all[a], saying, “I indeed baptize you with water, but one stronger than I is coming, whose sandal strap I am not worthy to untie[d][c][b]. He will baptize you in the Holy Spirit and fire.”
translation:
  language: fr
  text: 'Jean leur répondit à tous : « Moi, je vous baptise dans l’eau[a] ; mais il vient, celui qui est plus puissant que moi[b], et je ne suis pas digne de délier la lanière de ses sandales. Lui vous baptisera dans l’Esprit Saint et le feu[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « avec de l’eau ». Le datif grec peut ici indiquer le moyen ou l’élément.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « celui qui est plus fort que moi ».'
    reason: lexical_alternative
  - marker: c
    text: 'On peut aussi comprendre : « avec l’Esprit Saint et le feu ». Le grec dit littéralement « dans l’Esprit Saint et le feu » ; le feu peut évoquer la purification, le jugement, ou appartenir à l’unique image du baptême dans l’Esprit et le feu.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίνατο λέγων πᾶσιν ὁ Ἰωάννης
  choice: Jean leur répondit à tous
  rationale: La formule narrative grecque avec λέγων n’exige pas un « en disant » en français ; les paroles citées l’expriment déjà. « Leur répondit à tous » conserve le caractère responsif et la portée de πᾶσιν.
- source_word: Ἐγὼ μὲν ... δὲ
  choice: Moi, je ... ; mais
  rationale: Le pronom disjoint « Moi » rend l’emphase de Ἐγώ, tandis que « mais » fait entendre le contraste préparé par μέν et exprimé par δέ sans calque lourd.
- source_word: ὕδατι
  choice: dans l’eau
  rationale: Le datif peut désigner le moyen ou l’élément. « Baptiser dans l’eau » est naturel en français et préserve l’image d’un élément dans lequel se fait le baptême, sans exclure la nuance instrumentale.
- source_word: βαπτίζω / βαπτίσει
  choice: baptise / baptisera
  rationale: « Baptiser » est le terme établi et approprié au récit évangélique. « Immerger » préciserait davantage le mode que ne l’exige ici la traduction.
- source_word: ὁ ἰσχυρότερός μου
  choice: celui qui est plus puissant que moi
  rationale: Cette formulation française rend explicitement le comparatif substantivé. « Puissant » convient à la capacité et à l’autorité du personnage annoncé ; « plus fort » reste possible.
- source_word: ἔρχεται
  choice: il vient
  rationale: Le présent français conserve la vivacité et l’imminence du présent grec tout en restant idiomatique.
- source_word: οὗ οὐκ εἰμὶ ἱκανὸς
  choice: je ne suis pas digne
  rationale: Dans cette formule d’humilité, ἱκανός exprime l’indignité ou l’inadéquation personnelle ; « pas digne » en rend clairement le sens idiomatique.
- source_word: λῦσαι τὸν ἱμάντα τῶν ὑποδημάτων αὐτοῦ
  choice: délier la lanière de ses sandales
  rationale: La traduction conserve précisément l’action servile évoquée, dans un français actuel et digne.
- source_word: αὐτὸς
  choice: Lui
  rationale: Le pronom disjoint rend l’emphase de αὐτός et souligne le contraste entre Jean et celui qui vient.
- source_word: ἐν πνεύματι ἁγίῳ
  choice: dans l’Esprit Saint
  rationale: « Dans » maintient la formulation grecque et laisse ouverte la nuance de sphère, d’élément ou de moyen. Les majuscules indiquent qu’il s’agit de l’Esprit divin.
- source_word: καὶ πυρί
  choice: et le feu
  rationale: La coordination est conservée sans expliquer la fonction du feu. La répétition française implicite de « dans » permet de garder l’expression concise et son ambiguïté.
theological_decisions:
- issue: Sens de « baptisera dans l’Esprit Saint et le feu »
  choice: Conserver la formulation sans préciser si le feu purifie, juge, ou constitue avec l’Esprit les deux aspects d’une même image.
  alternative: Interpréter explicitement le feu soit comme purification, soit comme jugement distinct.
  rationale: Le grec ne tranche pas à lui seul entre ces lectures, et le contexte immédiat nourrit la tension. La traduction ne doit donc pas imposer une résolution doctrinale.
translation_notes:
  register: Français international moderne, courant et digne. La syntaxe privilégie la clarté orale du discours direct. Les pronoms disjoints « Moi » et « Lui » rendent le contraste grec sans lourdeur. Les notes signalent les ambiguïtés lexicales et théologiques réelles sans introduire de lecture confessionnelle.
