  text: And the crowds were asking him[a], saying, “What then should we do?”
translation:
  language: fr
  text: 'Les foules lui demandaient : « Que devons-nous donc faire ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπηρώτων
  choice: demandaient
  rationale: L’imparfait grec exprime une action en cours ou répétée ; l’imparfait français « demandaient » en préserve naturellement l’aspect.
- source_word: οἱ ὄχλοι
  choice: les foules
  rationale: Le pluriel grec désigne les groupes nombreux rassemblés autour de Jean ; « les foules » conserve ce pluriel dans un français actuel.
- source_word: λέγοντες
  choice: ponctuation introductive (:)
  rationale: En français naturel, le contenu de la parole est introduit directement après « demandaient » par deux-points ; traduire séparément « en disant » serait ici lourd et redondant.
- source_word: Τί οὖν
  choice: Que… donc
  rationale: « donc » maintient le lien logique avec l’exhortation précédente, tandis que l’ordre choisi est idiomatique en français.
- source_word: ποιήσωμεν
  choice: devons-nous faire
  rationale: Dans cette question délibérative, le subjonctif aoriste demande quelle conduite adopter ; « devons-nous faire » rend clairement cette portée sans ajouter de nuance doctrinale.
theological_decisions: []
