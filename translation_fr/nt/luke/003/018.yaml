  text: Πολλὰ μὲν οὖν καὶ ἕτερα παρακαλῶν εὐηγγελίζετο τὸν λαόν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/018.yaml
  text: So with many other exhortations as well[a], he was proclaiming the good news to the people.
translation:
  language: fr
  text: Ainsi donc, avec beaucoup d’autres exhortations, il annonçait la bonne nouvelle au peuple.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec dit littéralement : « avec beaucoup d’autres [choses], exhortant »; le nom auquel renvoient « beaucoup » et « autres » est implicite.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πολλὰ … καὶ ἕτερα
  choice: beaucoup d’autres … encore
  rationale: Le neutre pluriel substantivé renvoie à de nombreuses paroles ou choses supplémentaires, sans que le grec exprime le nom. Cette tournure française en restitue le sens tout en conservant l’implicite dans une note.
- source_word: μὲν οὖν
  choice: Ainsi
  rationale: La combinaison de particules assure ici une transition qui tire la suite du contexte précédent. « Ainsi » rend naturellement ce mouvement discursif sans traduire artificiellement chaque particule.
- source_word: παρακαλῶν
  choice: par … exhortations
  rationale: Dans le cadre de la prédication prophétique de Jean, παρακαλέω exprime l’exhortation, l’appel pressant ou l’encouragement. Le substantif « exhortations » conserve cette portée morale et pastorale.
- source_word: εὐηγγελίζετο
  choice: il annonçait la bonne nouvelle
  rationale: L’imparfait français rend l’action continue de l’imparfait grec, tandis que « annoncer la bonne nouvelle » exprime clairement le sens de εὐαγγελίζω dans une langue actuelle.
- source_word: τὸν λαόν
  choice: au peuple
  rationale: « Le peuple » correspond directement à λαός et laisse intactes ses possibles résonances collectives ou bibliques sans le réduire à la foule ni préciser explicitement Israël.
theological_decisions:
- issue: Portée de εὐηγγελίζετο dans le ministère de Jean
  choice: il annonçait la bonne nouvelle
  alternative: il prêchait / il faisait une annonce
  rationale: Même si Jean adresse des exhortations exigeantes, le grec qualifie explicitement son activité d’annonce de la bonne nouvelle. La traduction maintient cette tension théologique au lieu de l’atténuer.
translation_notes:
  register: Français international moderne, simple et digne. « Exhortations » garde le ton prophétique du passage; « annonçait la bonne nouvelle » reste accessible tout en préservant l’aspect duratif du verbe grec.
