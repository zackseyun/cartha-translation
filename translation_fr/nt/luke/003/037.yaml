  text: the son of Methuselah[a], the son of Enoch, the son of Jared, the son of Mahalaleel, the son of Cainan,
translation:
  language: fr
  text: fils de Mathusalem, fils d’Hénoc, fils de Yéred, fils de Mahalalel, fils de Caïnan[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec porte Καϊνάμ, également transcrit « Kaïnam ». Dans les généalogies de l’Ancien Testament, le nom correspondant est souvent rendu « Qénân » d’après l’hébreu.
    reason: Formes françaises alternatives du nom et précision sur la forme hébraïque correspondante, sans suggérer une harmonisation textuelle.
lexical_decisions:
- source_word: τοῦ
  choice: fils de
  rationale: Dans la généalogie de Luc, l’article au génitif répété devant chaque nom reprend elliptiquement la relation généalogique exprimée par le contexte. « fils de » rend cette relation explicite et naturelle en français.
- source_word: Μαθουσαλά
  choice: Mathusalem
  rationale: Forme française biblique traditionnelle et immédiatement reconnaissable du nom.
- source_word: Ἑνώχ
  choice: Hénoc
  rationale: Forme française courante correspondant au personnage de la Genèse.
- source_word: Ἰάρετ
  choice: Yéred
  rationale: Forme française moderne qui correspond au nom hébreu du personnage de la Genèse tout en représentant le nom grec de Luc.
- source_word: Μαλελεήλ
  choice: Mahalalel
  rationale: Forme française reconnaissable, proche du nom attesté dans la généalogie de la Genèse.
- source_word: Καϊνάμ
  choice: Caïnan
  rationale: Forme française conventionnelle du nom dans la généalogie lucanienne. Le nom présent dans le texte grec est conservé sans harmonisation avec les généalogies de l’Ancien Testament.
theological_decisions:
- issue: Ellipse généalogique produite par la répétition des génitifs
  choice: Répéter « fils de » devant chaque nom
  alternative: Conserver une chaîne plus littérale introduite seulement par « de »
  rationale: Le contexte généalogique établit clairement la relation sous-entendue. L’expliciter produit un français naturel sans ajouter une interprétation doctrinale.
- issue: Présence et forme de Καϊνάμ dans la généalogie de Luc
  choice: Conserver le nom sous la forme « Caïnan » dans le texte principal
  alternative: Kaïnam ou Qénân, ou omission par harmonisation avec certaines formes des généalogies de l’Ancien Testament
  rationale: Le texte grec de Luc contient explicitement Καϊνάμ. La traduction doit donc conserver ce nom et signaler les autres formes possibles sans harmoniser silencieusement les traditions généalogiques.
translation_notes:
  register: Français international moderne, sobre et digne. Les formes des noms cherchent un équilibre entre l’usage biblique français, la proximité avec le texte source et la reconnaissance des personnages de la Genèse. L’apostrophe typographique est employée dans « d’Hénoc ».
