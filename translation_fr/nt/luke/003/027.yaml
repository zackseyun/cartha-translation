lexical_decisions:
- source_word: τοῦ
  choice: fils de
  rationale: Dans cette généalogie, l’article au génitif répété devant chaque nom reprend elliptiquement la relation filiale établie par le contexte. « fils de » l’explicite en français naturel.
- source_word: Ἰωανὰν
  choice: Joanan
  rationale: Translittération française usuelle de ce nom propre grec.
- source_word: Ῥησὰ
  choice: Rhésa
  rationale: Forme française traditionnelle qui rend le nom grec et son accentuation.
- source_word: Ζοροβαβὲλ
  choice: Zorobabel
  rationale: Forme française biblique bien établie, permettant de reconnaître le personnage connu dans l’Ancien Testament.
- source_word: Σαλαθιὴλ
  choice: Salathiel
  rationale: Forme française biblique traditionnelle correspondant directement à la forme grecque; elle conserve ici la forme transmise par Luc.
- source_word: Νηρὶ
  choice: Néri
  rationale: Translittération française naturelle du nom grec, avec l’accent conforme à la prononciation française.
theological_decisions:
- issue: Ellipse généalogique
  choice: Répéter « fils de » devant chaque nom.
  alternative: Conserver une suite littérale de génitifs rendus par « de ».
  rationale: Le grec sous-entend la relation filiale à partir de la formule généalogique du contexte. L’expliciter produit un français clair sans ajouter de relation absente du sens du texte.
- issue: Forme du nom Σαλαθιὴλ
  choice: Salathiel
  alternative: Shéaltiel
  rationale: « Salathiel » traduit directement la forme grecque de Luc, tandis que « Shéaltiel » reflète davantage la forme hébraïque de l’Ancien Testament. Une note signale l’identification traditionnelle sans l’imposer dans le texte.
translation_notes:
  register: Français international moderne, sobre et digne. La répétition de « fils de » préserve la cadence généalogique et rend explicite l’ellipse grecque. Les noms suivent les formes françaises bibliques usuelles lorsqu’elles sont bien établies.
