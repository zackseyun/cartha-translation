source:
  edition: SBLGNT
  text: ἐπὶ ἀρχιερέως Ἅννα καὶ Καϊάφα, ἐγένετο ῥῆμα θεοῦ ἐπὶ Ἰωάννην τὸν Ζαχαρίου υἱὸν ἐν τῇ ἐρήμῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/002.yaml
  text: during the high priesthood of Annas and Caiaphas[a], the word of God came to John, the son of Zechariah, in the wilderness.
translation:
  language: fr
  text: Sous le grand sacerdoce d’Anne et de Caïphe[a], la parole de Dieu fut adressée à Jean, fils de Zacharie, dans le désert.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « sous le grand-prêtre Anne et Caïphe ». Le grec emploie « grand-prêtre » au singulier tout en nommant les deux hommes.'
    reason: La formulation grecque associe deux noms au titre singulier. La note signale cette tension sans chercher à la résoudre.
lexical_decisions:
- source_word: ἐπὶ ἀρχιερέως Ἅννα καὶ Καϊάφα
  choice: sous le grand-prêtre Anne et Caïphe
  rationale: Avec le génitif, ἐπί situe ici l’événement dans le temps. La tournure « sous le grand-prêtre » est naturelle dans un repère chronologique et conserve le singulier ἀρχιερέως, tout en laissant subsister la tension créée par les deux noms.
- source_word: ἐγένετο ῥῆμα θεοῦ
  choice: la parole de Dieu fut adressée
  rationale: Cette formule biblique marque la réception d’une révélation prophétique. « Fut adressée » rend idiomatiquement la venue de la parole à Jean sans réduire ῥῆμα à un simple message humain.
- source_word: ἐπὶ Ἰωάννην
  choice: à Jean
  rationale: Après la formule de révélation, ἐπί avec l’accusatif désigne celui vers qui la parole vient. « À Jean » est naturel en français contemporain.
- source_word: τὸν Ζαχαρίου υἱὸν
  choice: fils de Zacharie
  rationale: L’apposition identifie Jean par sa filiation. Sans article en français, cette formulation est fluide et fidèle.
- source_word: ἐν τῇ ἐρήμῳ
  choice: dans le désert
  rationale: ἔρημος désigne ici une région isolée et peu habitée. En français biblique courant, « désert » convient sans impliquer nécessairement une étendue sablonneuse.
theological_decisions:
- issue: La mention d’Anne et de Caïphe avec le singulier ἀρχιερέως
  choice: 'Conserver le singulier : « sous le grand-prêtre Anne et Caïphe »'
  alternative: « alors qu’Anne et Caïphe étaient grands-prêtres » ou « durant le grand-prêtrise d’Anne et de Caïphe »
  rationale: Le grec emploie le singulier tout en nommant deux hommes. La traduction conserve cette tension historique et littéraire sans expliquer dans le texte principal le statut respectif d’Anne et de Caïphe. La note signale la construction inhabituelle.
translation_notes:
  register: Français moderne, sobre et digne. « Fut adressée » garde la tonalité prophétique; « dans le désert » demeure immédiatement compréhensible. La construction « sous le grand-prêtre Anne et Caïphe » est volontairement inhabituelle afin de refléter le singulier grec.
