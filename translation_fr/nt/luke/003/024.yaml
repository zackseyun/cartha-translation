  text: the son of Matthat[a], the son of Levi, the son of Melchi, the son of Jannai, the son of Joseph,
translation:
  language: fr
  text: fils de Matthat[a], fils de Lévi, fils de Melchi, fils de Jannaï, fils de Joseph,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus formellement : « de Matthat, de Lévi, de Melchi, de Jannaï, de Joseph ». Le grec poursuit la généalogie par une suite de génitifs et sous-entend « fils de » d’après le contexte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦ
  choice: fils de
  rationale: Dans cette généalogie, l’article au génitif répété devant chaque nom reprend elliptiquement la relation filiale établie par le contexte. « fils de » l’explicite naturellement en français.
- source_word: Μαθθὰτ
  choice: Matthat
  rationale: Translittération usuelle du nom propre grec, sans le traduire.
- source_word: Λευὶ
  choice: Lévi
  rationale: Forme française traditionnelle et immédiatement reconnaissable du nom Λευί.
- source_word: Μελχὶ
  choice: Melki
  rationale: Translittération française lisible qui représente le χ grec par « k » et évite de suggérer la prononciation française de « ch ».
- source_word: Ἰανναὶ
  choice: Jannaï
  rationale: Translittération proche de la forme grecque Ἰανναί; le tréma indique que le ï se prononce séparément.
- source_word: Ἰωσὴφ
  choice: Joseph
  rationale: Forme française traditionnelle du nom Ἰωσήφ.
theological_decisions:
- issue: Ellipse généalogique
  choice: Répéter « fils de » devant chaque nom
  alternative: Conserver la chaîne formelle « de Matthat, de Lévi, de Melki, de Jannaï, de Joseph »
  rationale: Le grec présente une série de génitifs qui dépend de la formule généalogique du contexte. L’explicitation rend la relation intelligible en français sans ajouter de contenu théologique ni trancher une ambiguïté étrangère au texte.
translation_notes:
  register: Français international moderne, clair et digne. La répétition de « fils de » conserve le rythme généalogique tout en explicitant l’ellipse grecque. Les noms suivent des formes françaises établies ou des translittérations adaptées à la lecture française.
