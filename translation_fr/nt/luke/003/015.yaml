id: LUK.3.15
reference: Luke 3:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Προσδοκῶντος δὲ τοῦ λαοῦ καὶ διαλογιζομένων πάντων ἐν ταῖς καρδίαις αὐτῶν περὶ τοῦ Ἰωάννου, μήποτε αὐτὸς εἴη ὁ χριστός,
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/015.yaml
  text: As the people were waiting expectantly[a], and all were reasoning in their hearts about John, whether perhaps he might be the Messiah,
translation:
  language: fr
  text: Comme le peuple était dans l’attente et que tous se demandaient intérieurement, au sujet de Jean, s’il ne serait pas le Messie[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « le Christ ». Grec : ho christos.'
    reason: Signaler l’autre traduction française traditionnelle du titre grec et préserver sa transparence lexicale.
lexical_decisions:
- source_word: Προσδοκῶντος
  choice: était dans l’attente
  rationale: Le participe présent dans le génitif absolu plante le décor et exprime une attente soutenue et pleine d’anticipation.
- source_word: δὲ
  choice: Comme
  rationale: La particule marque ici une légère progression narrative. En français, la construction circonstancielle introduite par « Comme » relie naturellement la scène sans ajouter un « or » trop appuyé.
- source_word: τοῦ λαοῦ
  choice: le peuple
  rationale: Traduction directe de λαός, qui désigne ici collectivement le peuple et peut conserver ses résonances bibliques.
- source_word: διαλογιζομένων πάντων
  choice: tous se demandaient
  rationale: Le verbe indique une réflexion ou délibération intérieure. « Se demandaient » rend naturellement cette activité mentale dans le contexte interrogatif.
- source_word: ἐν ταῖς καρδίαις αὐτῶν
  choice: intérieurement
  rationale: L’expression sémitique situe la réflexion dans l’être intérieur. « Intérieurement » évite en français moderne la lourdeur de « raisonnaient dans leur cœur » tout en conservant le sens.
- source_word: περὶ τοῦ Ἰωάννου
  choice: au sujet de Jean
  rationale: περί avec le génitif signifie ici « au sujet de » ou « concernant ».
- source_word: μήποτε αὐτὸς εἴη
  choice: s’il ne serait pas
  rationale: Cette interrogation indirecte préserve l’incertitude exprimée par μήποτε et l’optatif εἴη, sans trancher la question.
- source_word: ὁ χριστός
  choice: le Messie
  rationale: Χριστός fonctionne clairement comme un titre attendu par le peuple; « Messie » restitue son cadre juif et son sens d’oint.
theological_decisions:
- issue: Traduction de Χριστός comme titre
  choice: le Messie
  alternative: le Christ
  rationale: Dans cette question sur l’identité de Jean, le terme désigne la figure messianique attendue plutôt qu’un nom propre. La note conserve l’équivalent traditionnel « le Christ ».
translation_notes:
  register: Français international moderne, digne et lisible. La formulation conserve la phrase suspendue du grec, appelée à se poursuivre au verset suivant. « Était dans l’attente » garde l’aspect continu; « se demandaient intérieurement » exprime idiomatiquement la délibération du cœur.
