lexical_decisions:
- source_word: τοῦ
  choice: fils de
  rationale: Dans cette généalogie, l’article grec répété au génitif poursuit une construction elliptique dont le lien filial est établi par le contexte. Le français naturel exige que ce lien soit explicité.
- source_word: Ἰακὼβ
  choice: Jacob
  rationale: Forme française traditionnelle et courante du nom du patriarche.
- source_word: Ἰσαὰκ
  choice: Isaac
  rationale: Forme française traditionnelle et courante du nom du patriarche.
- source_word: Ἀβραὰμ
  choice: Abraham
  rationale: Forme française traditionnelle et courante du nom du patriarche.
- source_word: Θάρα
  choice: Térah
  rationale: La forme grecque est Thara, mais « Térah » identifie clairement le personnage selon la forme française courante de son nom dans l’Ancien Testament.
- source_word: Ναχὼρ
  choice: Nahor
  rationale: La forme « Nahor », familière dans l’Ancien Testament français, identifie clairement le même patriarche tout en restant proche de la forme grecque.
theological_decisions:
- issue: Explicitation du lien filial dans une généalogie elliptique
  choice: Rendre chaque génitif par « fils de »
  alternative: Conserver seulement une suite de noms introduits par « de »
  rationale: Le grec dépend du schéma généalogique établi par le contexte et répète littéralement l’article au génitif devant chaque nom. Expliciter « fils de » rend la relation intelligible en français sans ajouter de contenu doctrinal.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation sans répétition de l’article (« le fils de ») convient à un fragment qui poursuit la généalogie du verset précédent. Les noms suivent les formes bibliques françaises usuelles.
