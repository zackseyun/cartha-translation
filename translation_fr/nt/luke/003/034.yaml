  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec répète l’article au génitif devant chaque nom ; « fils de » est explicité d’après la structure de la généalogie afin que le lien soit clair en français.
    reason: lexical_alternative
  - marker: b
    text: 'Grec : « Thara » ; « Térah » correspond à la forme familière du nom dans l’Ancien Testament.'
