  text: τοῦ Καϊνὰμ τοῦ Ἀρφαξὰδ τοῦ Σὴμ τοῦ Νῶε τοῦ Λάμεχ
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/036.yaml
  text: the son of Cainan[a], the son of Arphaxad, the son of Shem, the son of Noah, the son of Lamech[c][b],
translation:
  language: fr
  text: fils de Caïnam[a], fils d’Arphaxad[b], fils de Sem, fils de Noé, fils de Lamek.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Certaines traditions omettent ici Caïnam afin de rapprocher cette généalogie de certaines formes de l’Ancien Testament.
    reason: textual_variant
  - marker: b
    text: « Arphaxad » reflète la forme grecque employée dans Luc; dans l’Ancien Testament, le nom est aussi rendu « Arpakshad ».
    reason: cross_reference
lexical_decisions:
- source_word: τοῦ
  choice: fils de
  rationale: Dans la généalogie de Luc, l’article au génitif répété devant chaque nom reprend elliptiquement la relation de filiation établie par le contexte. « fils de » l’exprime naturellement en français.
- source_word: Καϊνὰμ
  choice: Caïnam
  rationale: Forme française traditionnelle et transparente du nom grec Καϊνάμ; le tréma indique que les voyelles se prononcent séparément.
- source_word: Ἀρφαξὰδ
  choice: Arphaxad
  rationale: Cette graphie reflète la forme grecque employée dans Luc, tout en suivant l’usage biblique français courant.
- source_word: Σὴμ
  choice: Sem
  rationale: Forme française biblique établie du nom propre grec Σήμ.
- source_word: Νῶε
  choice: Noé
  rationale: Forme française biblique établie correspondant au grec Νῶε.
- source_word: Λάμεχ
  choice: Lamek
  rationale: Translittération française directe de Λάμεχ; le k rend clairement la consonne grecque finale χ dans ce nom sémitique transmis en grec.
theological_decisions:
- issue: Présence de Caïnam dans la généalogie de Luc entre Arphaxad et Sem
  choice: Maintenir Caïnam dans le texte principal.
  alternative: Certaines traditions omettent Caïnam afin de rapprocher cette généalogie de certaines formes de l’Ancien Testament.
  rationale: Le texte du SBLGNT contient Καϊνάμ. La traduction conserve donc la leçon grecque de Luc sans harmoniser la généalogie avec celle de la Genèse.
translation_notes:
  register: Français international moderne, sobre et digne. La répétition de « fils de » rend explicite l’ellipse généalogique grecque. Les noms suivent des formes françaises bibliques usuelles ou une translittération claire; la ponctuation clôt le fragment comme un verset complet.
