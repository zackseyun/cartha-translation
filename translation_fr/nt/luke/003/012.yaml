id: LUK.3.12
reference: Luke 3:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἦλθον δὲ καὶ τελῶναι βαπτισθῆναι καὶ εἶπαν πρὸς αὐτόν· Διδάσκαλε, τί ⸀ποιήσωμεν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/012.yaml
  text: Even tax collectors came to be baptized[a], and they said to him, “Teacher, what should we do?”
translation:
  language: fr
  text: 'Même des collecteurs d’impôts vinrent pour être baptisés[a] et lui dirent : « Maître, que devons-nous faire ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Des collecteurs d’impôts vinrent eux aussi pour être baptisés. »'
    reason: La portée additive de καί peut être rendue par « eux aussi » plutôt que par l’emphatique « même ».
lexical_decisions:
- source_word: ἦλθον
  choice: vinrent
  rationale: L’aoriste indicatif de ἔρχομαι présente ici leur venue comme un fait passé simple.
- source_word: δὲ καὶ τελῶναι
  choice: Même des collecteurs d’impôts
  rationale: La combinaison de δέ et de καί a une valeur progressive et additive, voire emphatique. « Même » met naturellement en relief l’inclusion surprenante des collecteurs d’impôts.
- source_word: βαπτισθῆναι
  choice: pour être baptisés
  rationale: L’infinitif aoriste passif exprime le but de leur venue.
- source_word: εἶπαν πρὸς αὐτόν
  choice: lui dirent
  rationale: Cette formulation conserve le sens direct de λέγω avec πρός, sans remplacer le verbe par « demander » malgré la forme interrogative des paroles.
- source_word: Διδάσκαλε
  choice: Maître
  rationale: En français courant, « Maître » est une adresse naturelle pour un enseignant reconnu. « Enseignant » serait peu idiomatique comme apostrophe et « Rabbi » constituerait une translittération absente du grec.
- source_word: τί ποιήσωμεν
  choice: que devons-nous faire ?
  rationale: Le subjonctif aoriste délibératif sollicite la conduite appropriée ; cette tournure française en exprime clairement la portée pratique.
theological_decisions:
- issue: Inclusion d’un groupe socialement et moralement discrédité dans l’appel de Jean
  choice: Mettre l’inclusion en relief par « Même des collecteurs d’impôts »
  alternative: « Des collecteurs d’impôts vinrent eux aussi »
  rationale: Le texte souligne la réponse à l’appel de Jean d’un groupe mal considéré dans ce contexte. « Même » préserve cette force rhétorique sans ajouter de jugement explicatif.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple convient au registre narratif biblique soutenu sans être archaïque. « Collecteurs d’impôts » est plus précis et international que « publicains » ; « Maître » demeure l’apostrophe française la plus naturelle dans ce contexte.
