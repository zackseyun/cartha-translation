  text: τοῦ ⸂Ἀμιναδὰβ τοῦ Ἀδμὶν τοῦ Ἀρνὶ⸃ τοῦ Ἑσρὼμ τοῦ Φαρὲς τοῦ Ἰούδα
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/033.yaml
  text: the son of Amminadab[a], the son of Admin, the son of Arni, the son of Hezron, the son of Perez, the son of Judah,
translation:
  language: fr
  text: fils d’Amminadab[a], fils d’Admin, fils d’Arni, fils de Hetsron, fils de Pérets, fils de Juda,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Certains manuscrits portent : « fils d’Amminadab, fils d’Admin, fils d’Aram »; d’autres omettent « Admin » et portent : « fils d’Amminadab, fils d’Aram ».'
    reason: textual_variant
lexical_decisions:
- source_word: τοῦ
  choice: fils de
  rationale: Dans la généalogie de Luc, l’article répété au génitif est elliptique et reprend la relation généalogique établie auparavant. « fils de » explicite naturellement cette relation en français tout en conservant le rythme de la liste.
- source_word: Ἀμιναδάβ
  choice: Amminadab
  rationale: Forme française biblique courante, proche du grec et reconnaissable dans la tradition généalogique.
- source_word: Ἀδμίν
  choice: Admin
  rationale: Translittération directe du nom grec imprimé dans le SBLGNT; cette leçon est donc conservée dans le texte principal.
- source_word: Ἀρνί
  choice: Arni
  rationale: Translittération du nom grec tel qu’il figure dans le SBLGNT. La variante « Aram » est signalée en note plutôt que substituée au texte source retenu.
- source_word: Ἑσρώμ
  choice: Hetsron
  rationale: Forme française alignée sur le nom de l’Ancien Testament, facilitant son identification dans le canon tout en représentant le même nom.
- source_word: Φαρές
  choice: Pérets
  rationale: Forme française courante alignée sur l’Ancien Testament, préférable à une translittération plus directement grecque comme « Pharès ».
- source_word: Ἰούδα
  choice: Juda
  rationale: Forme française consacrée pour le patriarche et la tribu, adaptée au contexte généalogique et distincte du nom « Judas » employé pour des personnages du Nouveau Testament.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et accessible. La répétition de « fils de » reproduit clairement la structure généalogique elliptique du grec. Les noms sont rendus selon les formes françaises bibliques usuelles lorsqu’elles permettent de reconnaître leurs correspondants de l’Ancien Testament; Admin et Arni suivent directement la leçon du SBLGNT.
