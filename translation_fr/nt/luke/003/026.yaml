- source_word: Σεμεῒν
  choice: Séméïn
  rationale: Translittération française qui conserve les voyelles et le tréma final du nom grec, en marquant que ï forme une syllabe distincte.
- source_word: Ἰωσὴχ
  choice: Josech
  rationale: Translittération proche de la forme grecque du SBLGNT; elle conserve la consonne finale χ sous la graphie traditionnelle « ch ».
- source_word: Ἰωδὰ
  choice: Joda
  rationale: Translittération directe de la forme grecque, sans harmonisation avec une forme hébraïsante conjecturale.
