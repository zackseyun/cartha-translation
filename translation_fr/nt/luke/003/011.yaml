source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ⸀ἔλεγεν αὐτοῖς· Ὁ ἔχων δύο χιτῶνας μεταδότω τῷ μὴ ἔχοντι, καὶ ὁ ἔχων βρώματα ὁμοίως ποιείτω.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/011.yaml
  text: And answering[a], he said to them, “The one who has two tunics must share with the one who has none, and the one who has food must do likewise.”
translation:
  language: fr
  text: 'Il leur répondit : « Que celui qui a deux tuniques[a] partage avec celui qui n’en a pas, et que celui qui a de la nourriture fasse de même. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La tunique était un vêtement de base porté près du corps.
    reason: cultural_note
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ἔλεγεν αὐτοῖς
  choice: Il leur répondait
  rationale: Cette formulation française naturelle rend le participe de réponse, le connecteur léger δέ et l’imparfait ἔλεγεν, qui peut présenter une réponse répétée ou caractéristique dans ce contexte.
- source_word: Ὁ ἔχων
  choice: Que celui qui a
  rationale: Le tour avec « que » rend naturellement l’impératif à la troisième personne et conserve le singulier représentatif du participe substantivé.
- source_word: δύο χιτῶνας
  choice: deux tuniques
  rationale: χιτών désigne un vêtement de base porté près du corps; « tunique » est historiquement plus précis que « chemise » ou « manteau ».
- source_word: μεταδότω
  choice: partage
  rationale: L’impératif aoriste ordonne de faire part de ce que l’on possède; « partage » exprime clairement cette exigence sans ajouter l’idée de donner nécessairement les deux vêtements.
- source_word: τῷ μὴ ἔχοντι
  choice: avec celui qui n’en a pas
  rationale: Le pronom « en » reprend les tuniques et explicite sobrement l’objet sous-entendu en grec.
- source_word: βρώματα
  choice: de quoi manger
  rationale: Le pluriel βρώματα désigne des aliments ou des provisions; cette expression est claire, courante et conserve l’idée de ressources alimentaires disponibles.
- source_word: ὁμοίως ποιείτω
  choice: fasse de même
  rationale: Cette tournure rend directement le second impératif et maintient le parallélisme de l’exhortation.
theological_decisions:
- issue: Singulier représentatif et formulation générique
  choice: celui qui a ... celui qui n’en a pas
  alternative: quiconque a ... celui qui n’a rien
  rationale: Le grec emploie des participes substantivés masculins singuliers à valeur générale. Le français « celui qui » conserve ce singulier représentatif sans limiter l’instruction aux hommes.
- issue: Portée du commandement de partage
  choice: partage avec celui qui n’en a pas
  alternative: en donne une à celui qui n’en a pas
  rationale: μεταδίδωμι signifie faire part ou partager. La traduction évite de préciser une quantité que le grec n’énonce pas explicitement, tout en laissant entendre le partage concret exigé.
translation_notes:
  register: Français international moderne, simple et digne. L’imparfait « répondait » respecte l’aspect de ἔλεγεν et convient à une réponse donnée aux différents groupes de la foule. La syntaxe impérative avec « que celui qui… » reste naturelle tout en reflétant la structure grecque.
