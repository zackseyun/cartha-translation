  source_fidelity: 'Le sens central est bien rendu : l’instruction concerne le partage de vêtements et de nourriture avec ceux qui en sont dépourvus. Toutefois, « Il leur répondait » absorbe le participe ἀποκριθείς et donne au verbe français une nuance itérative moins nette que la construction grecque usuelle de réponse. « A de quoi manger » peut aussi évoquer les moyens de se nourrir plutôt que les βρώματα, c’est-à-dire la nourriture/provisions que l’on possède.'
