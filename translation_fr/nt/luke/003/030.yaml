lexical_decisions:
- source_word: τοῦ
  choice: fils de
  rationale: Dans cette généalogie, l’article au génitif répété devant chaque nom reprend de manière elliptique la relation de filiation exprimée dans le contexte. « fils de » rend cette relation clairement et naturellement en français.
- source_word: Συμεὼν
  choice: Siméon
  rationale: Forme française traditionnelle et immédiatement reconnaissable de ce nom propre.
- source_word: Ἰούδα
  choice: Juda
  rationale: Le grec peut aussi être francisé « Judas », mais « Juda » reflète mieux ici le nom sémitique dans un contexte généalogique et évite une association indue avec Judas Iscariote.
- source_word: Ἰωσὴφ
  choice: Joseph
  rationale: Forme française usuelle du nom propre.
- source_word: Ἰωνὰμ
  choice: Jonam
  rationale: Transcription directe de la forme Ἰωνάμ attestée dans le SBLGNT; « Jonan » relève d’une variante textuelle ou d’une autre tradition de transmission.
- source_word: Ἐλιακὶμ
  choice: Éliakim
  rationale: Forme française claire et conventionnelle du nom sémitique; l’accent initial guide la prononciation française.
