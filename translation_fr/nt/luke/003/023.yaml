id: LUK.3.23
reference: Luke 3:23
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ αὐτὸς ⸀ἦν Ἰησοῦς ⸂ἀρχόμενος ὡσεὶ ἐτῶν τριάκοντα⸃, ὢν ⸂υἱός, ὡς ἐνομίζετο⸃, Ἰωσὴφ τοῦ Ἠλὶ
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/023.yaml
  text: And Jesus himself[a], when he began, was about thirty years old, being the son (as was supposed) of Joseph[c][b], of Heli.
translation:
  language: fr
  text: Jésus lui-même avait environ trente ans lorsqu’il commença[a]. Il était, à ce que l’on pensait[b], fils de Joseph, fils d’Héli[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec ne précise pas ce que Jésus commença; d’après le contexte, il s’agit du début de son activité publique.
    reason: lexical_alternative
  - marker: b
    text: Autrement dit, on considérait généralement Jésus comme le fils de Joseph.
    reason: clarification
  - marker: c
    text: Littéralement, le grec enchaîne « Joseph, d’Héli »; comme dans la suite de la généalogie, « fils » est sous-entendu.
    reason: source_form
lexical_decisions:
- source_word: Καὶ
  choice: Non traduit séparément
  rationale: Le lien narratif avec la scène précédente demeure clair en français sans « Et » initial, qui serait lourd ici.
- source_word: αὐτὸς … Ἰησοῦς
  choice: Jésus lui-même
  rationale: « Lui-même » conserve l’accent porté par le pronom grec sur Jésus.
- source_word: ἦν … ἀρχόμενος
  choice: avait … lorsqu’il commença
  rationale: Cette tournure française naturelle rend la construction grecque périphrastique sans ajouter le complément implicite « son ministère ».
- source_word: ὡσεὶ ἐτῶν τριάκοντα
  choice: environ trente ans
  rationale: Rend clairement l’âge et conserve l’approximation exprimée par ὡσεὶ.
- source_word: ὢν υἱός, ὡς ἐνομίζετο
  choice: Il était, à ce que l’on pensait, fils de
  rationale: La proposition distincte reste lisible en français et l’incise marque que cette filiation relevait de l’opinion commune.
- source_word: Ἰωσὴφ
  choice: Joseph
  rationale: Forme française traditionnelle et courante du nom.
- source_word: τοῦ Ἠλὶ
  choice: fils d’Héli
  rationale: Le génitif généalogique grec est elliptique; le français exige normalement que la relation « fils de » soit explicitée.
theological_decisions:
- issue: Portée de « à ce que l’on pensait »
  choice: Faire porter explicitement l’incise sur la désignation de Jésus comme fils de Joseph.
  alternative: Intégrer l’expression sans incise, ce qui rendrait sa portée moins nette.
  rationale: Dans le contexte de Luc, la formule présente Joseph comme le père présumé de Jésus sans affirmer ici une paternité biologique; elle conserve ainsi la tension narrative sans l’expliquer davantage.
- issue: Complément de « commença »
  choice: Ne pas ajouter « son ministère » dans le texte principal.
  alternative: « lorsqu’il commença son ministère »
  rationale: Le contexte suggère le début de l’activité publique de Jésus, mais le grec ne nomme pas cette activité. La traduction maintient cette implicitation.
- issue: Relation d’Héli dans la chaîne généalogique
  choice: Rendre le génitif elliptique par « fils d’Héli », rattaché à Joseph.
  alternative: Conserver littéralement « Joseph, d’Héli » ou laisser ouverte une lecture rattachant directement Jésus à Héli.
  rationale: Dans la construction généalogique continue, τοῦ Ἠλὶ dépend naturellement de Joseph. L’ajout de « fils » explicite en français l’ellipse régulière du grec sans résoudre au-delà de la syntaxe la nature juridique ou biologique de la filiation.
translation_notes:
  register: Français international moderne, sobre et digne. La première phrase adopte un ordre naturel en français tout en maintenant l’accent sur Jésus et l’absence de complément après « commença ». La seconde amorce clairement la généalogie; les incises et les notes préservent les nuances du grec.
