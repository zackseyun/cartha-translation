lexical_decisions:
- source_word: τοῦ
  choice: fils de
  rationale: Dans cette généalogie, l’article grec au génitif est elliptique et reprend la relation de filiation indiquée par le contexte. « Fils de » rend cette relation clairement et naturellement en français.
- source_word: Μελχὶ
  choice: Melki
  rationale: Translittération française moderne du nom propre grec, avec k pour χ afin de refléter la forme source sans suggérer la prononciation française de « ch ».
- source_word: Ἀδδὶ
  choice: Addi
  rationale: Translittération directe et lisible du nom propre grec.
- source_word: Κωσὰμ
  choice: Kosam
  rationale: Translittération du kappa grec par k, conformément à un usage français transparent.
- source_word: Ἐλμαδὰμ
  choice: Elmadam
  rationale: Translittération directe du nom propre grec.
- source_word: Ἢρ
  choice: Er
  rationale: Translittération simple du nom propre grec, sans ajouter une aspiration absente du texte.
