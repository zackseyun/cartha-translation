id: LUK.3.7
reference: Luke 3:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἔλεγεν οὖν τοῖς ἐκπορευομένοις ὄχλοις βαπτισθῆναι ὑπ’ αὐτοῦ· Γεννήματα ἐχιδνῶν, τίς ὑπέδειξεν ὑμῖν φυγεῖν ἀπὸ τῆς μελλούσης ὀργῆς;
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/007.yaml
  text: So he was saying to the crowds coming out to be baptized by him[a], “Offspring of vipers[b], who warned you to flee from the coming wrath?”
translation:
  language: fr
  text: 'Il disait donc aux foules qui venaient se faire baptiser par lui : « Engeance de vipères[a] ! Qui vous a avertis de fuir la colère qui vient[b] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Rejetons de vipères. »'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « la colère à venir ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔλεγεν
  choice: Il disait
  rationale: L’imparfait grec présente la parole de Jean comme en cours ou répétée ; l’imparfait français en conserve naturellement l’aspect sans préciser indûment la fréquence.
- source_word: οὖν
  choice: donc
  rationale: Le terme marque la continuité narrative et logique avec le contexte précédent.
- source_word: τοῖς ἐκπορευομένοις ὄχλοις
  choice: aux foules qui venaient
  rationale: Le participe désigne les foules qui sortaient pour aller vers Jean ; « qui venaient » adopte naturellement le point de vue de la scène en français.
- source_word: βαπτισθῆναι ὑπ’ αὐτοῦ
  choice: se faire baptiser par lui
  rationale: Cette tournure française exprime clairement le but du déplacement tout en conservant le sens passif et le pronom du grec.
- source_word: Γεννήματα ἐχιδνῶν
  choice: Engeance de vipères
  rationale: « Engeance » désigne une descendance ou une catégorie issue d’une même souche et restitue avec force l’invective imagée, sans la lourdeur de « progéniture de vipères ».
- source_word: τίς ὑπέδειξεν ὑμῖν
  choice: Qui vous a avertis
  rationale: Dans le contexte d’un danger imminent, ὑποδείκνυμι a la force d’un avertissement plutôt que d’une simple indication.
- source_word: φυγεῖν
  choice: de fuir
  rationale: Le choix conserve l’image vive d’une fuite devant un danger, plutôt que de la réduire au seul résultat exprimé par « échapper ».
- source_word: ἀπὸ τῆς μελλούσης ὀργῆς
  choice: la colère qui vient
  rationale: Cette formulation actuelle conserve à la fois ὀργή comme « colère » et l’orientation future de μέλλουσα, sans définir davantage la nature ou le moment du jugement.
theological_decisions:
- issue: Nature de la colère (ὀργή) annoncée par Jean
  choice: La « colère qui vient » désigne le jugement divin imminent sans en préciser ici le cadre doctrinal.
  alternative: Préciser qu’il s’agit exclusivement du jugement eschatologique final ou, à l’inverse, d’un jugement historique temporel.
  rationale: Le contexte appelle à la repentance face au jugement de Dieu, mais le verset ne tranche pas entre les différentes précisions proposées. La traduction conserve donc la portée générale et la tension du texte.
translation_notes:
  register: Français international moderne, naturel et digne. « Engeance » garde la vigueur de l’apostrophe et son idée de filiation, tandis que le reste de la phrase emploie une syntaxe courante et immédiatement compréhensible. Les marqueurs [a] et [b] sont placés sur les expressions qu’éclairent réellement leurs notes.
