  source_fidelity: Le texte français restitue fidèlement l’imparfait de ἔλεγεν (« Il disait »), la continuité de οὖν (« donc »), le mouvement des foules vers Jean, l’infinitif passif (« se faire baptiser par lui »), ainsi que l’image accusatrice de Γεννήματα ἐχιδνῶν. « Qui vous a avertis de fuir la colère qui vient ? » rend correctement l’avertissement et la fuite devant la colère à venir, sans préciser indûment la nature temporelle ou eschatologique du jugement.
  naturalness: La formulation est naturelle en français international moderne. « Engeance de vipères ! » conserve la vigueur publique et prophétique de l’apostrophe; « la colère qui vient » est clair et actuel. La ponctuation du discours direct est idiomatique.
  terminology: « Engeance » transmet l’idée de descendance/production contenue dans γέννημα tout en portant la force péjorative appropriée au contexte. « Vipères », « avertis », « fuir » et « colère » sont exacts et ne chargent pas le texte d’une interprétation doctrinale supplémentaire.
