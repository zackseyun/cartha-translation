  text: καὶ ἦλθεν εἰς ⸀πᾶσαν περίχωρον τοῦ Ἰορδάνου κηρύσσων βάπτισμα μετανοίας εἰς ἄφεσιν ἁμαρτιῶν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/003.yaml
  text: And he came into all the surrounding region of the Jordan[a], proclaiming a baptism of repentance for the forgiveness of sins[b],
translation:
  language: fr
  text: Il parcourut toute la région autour du Jourdain, proclamant un baptême de repentance pour le pardon des péchés.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἦλθεν εἰς πᾶσαν περίχωρον τοῦ Ἰορδάνου
  choice: Il parcourut toute la région autour du Jourdain
  rationale: Le grec exprime l’entrée et le déplacement dans l’ensemble de la région environnant le Jourdain. « Parcourut » rend naturellement en français la progression implicite dans ce territoire, sans imposer un point de vue directionnel artificiel par « vint » ou « alla ».
- source_word: κηρύσσων
  choice: proclamait
  rationale: Le verbe désigne une annonce publique, avec la force de la proclamation d’un héraut. « Proclamait » est clair et évite de restreindre le sens au cadre ecclésial que pourrait suggérer « prêchait ».
- source_word: βάπτισμα
  choice: un baptême
  rationale: Le nom désigne ici le baptême ou rite d’immersion; « baptême » est le terme français établi et direct.
- source_word: μετανοίας
  choice: de repentance
  rationale: Le génitif est conservé sans préciser davantage le rapport entre le baptême et la repentance. « Repentance » exprime le changement intérieur et le retournement impliqués par μετάνοια, tout en restant un terme biblique intelligible.
- source_word: εἰς ἄφεσιν ἁμαρτιῶν
  choice: pour le pardon des péchés
  rationale: « Pardon » rend naturellement ἄφεσις dans ce contexte. La préposition « pour » préserve la relation orientée vers le pardon sans trancher son fonctionnement théologique précis.
theological_decisions:
- issue: Rapport entre le baptême, la repentance et le pardon
  choice: « un baptême de repentance pour le pardon des péchés »
  alternative: « un baptême exprimant la repentance en vue du pardon des péchés »
  rationale: La formulation retenue reproduit de manière transparente les rapports grammaticaux du grec et laisse ouverte la question de savoir si le baptême est instrumental, déclaratif, symbolique ou probant par rapport au pardon.
translation_notes:
  register: Français moderne, international et digne. La phrase privilégie une narration naturelle tout en conservant la densité théologique de l’expression grecque. Aucun marqueur de note n’est requis puisqu’aucune note n’est ajoutée.
