id: LUK.3.20
reference: Luke 3:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: προσέθηκεν καὶ τοῦτο ἐπὶ πᾶσιν, ⸀καὶ κατέκλεισεν τὸν Ἰωάννην ⸀ἐν φυλακῇ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/020.yaml
  text: 'He added this also to them all: he locked John up in prison[a].'
translation:
  language: fr
  text: 'Il ajouta encore ceci à tout le reste : il enferma Jean en prison[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « Il ajouta aussi ceci à tout le reste. » Dans le contexte, cet acte vient s’ajouter à toutes les autres mauvaises actions d’Hérode.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσέθηκεν
  choice: ajouta
  rationale: Le verbe exprime ici l’ajout d’un acte supplémentaire à ceux déjà mentionnés. « Ajouta » conserve clairement cette idée cumulative.
- source_word: καὶ τοῦτο
  choice: encore ceci
  rationale: « Encore » rend la valeur additive de καί, tandis que « ceci » reprend le démonstratif τοῦτο et annonce l’acte qui suit.
- source_word: ἐπὶ πᾶσιν
  choice: à tout le reste
  rationale: 'Cette formulation française naturelle conserve le sens cumulatif de l’expression : l’emprisonnement de Jean vient s’ajouter à toutes les actions précédemment reprochées à Hérode, sans les répéter dans le texte.'
- source_word: κατέκλεισεν
  choice: enferma
  rationale: Le verbe κατακλείω signifie fermer ou tenir enfermé. « Enferma » en conserve la force concrète sans faire double emploi avec « en prison ».
- source_word: Ἰωάννην
  choice: Jean
  rationale: Forme française traditionnelle et courante du nom.
- source_word: ἐν φυλακῇ
  choice: en prison
  rationale: Dans ce contexte, φυλακή désigne le lieu de détention ; « en prison » est l’expression française la plus naturelle.
theological_decisions:
- issue: Référent et portée de ἐπὶ πᾶσιν
  choice: L’acte d’enfermer Jean s’ajoute à tout ce qui vient d’être reproché à Hérode.
  alternative: Traduire plus littéralement par « par-dessus toutes choses » ou expliciter « à toutes ses mauvaises actions ».
  rationale: Le contexte immédiat énumère les mauvaises actions d’Hérode, puis présente l’emprisonnement de Jean comme un acte supplémentaire. « À tout le reste » exprime ce lien sans ajouter dans le corps du texte le qualificatif « mauvaises », qui demeure contextuel plutôt qu’explicite dans ce syntagme.
translation_notes:
  register: Français international moderne, sobre et narratif. La répétition naturelle « enferma Jean en prison » préserve la distinction entre l’acte exprimé par κατακλείω et le lieu exprimé par ἐν φυλακῇ.
