id: LUK.6.11
reference: Luke 6:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: αὐτοὶ δὲ ἐπλήσθησαν ἀνοίας, καὶ διελάλουν πρὸς ἀλλήλους τί ἂν ποιήσαιεν τῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/011.yaml
  text: But they were filled with rage[a], and they discussed with one another what they might do to Jesus.
translation:
  language: fr
  text: Mais eux furent remplis d’une fureur insensée[a] et ils discutaient entre eux de ce qu’ils pourraient faire à Jésus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de folie », « de démence » ou « d’une conduite insensée ». Le terme grec désigne un manque de raison, la sottise ou un égarement frénétique.
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτοὶ
  choice: eux
  rationale: Le pronom explicite est emphatique et marque le contraste avec Jésus et l’homme guéri; la tournure « Mais eux » le restitue naturellement en français.
- source_word: δὲ
  choice: Mais
  rationale: La conjonction introduit ici un contraste avec l’action bienfaisante de Jésus dans la scène précédente.
- source_word: ἐπλήσθησαν ἀνοίας
  choice: furent remplis d’une fureur insensée
  rationale: La formulation conserve l’image d’un remplissage. Dans ce contexte hostile, ἄνοια évoque une perte de raison, une folie ou une conduite insensée; « fureur insensée » exprime à la fois l’irrationalité et la violence de leur réaction sans suggérer un diagnostic clinique.
- source_word: διελάλουν
  choice: discutaient
  rationale: L’imparfait grec présente une délibération en cours; l’imparfait français rend naturellement cet aspect.
- source_word: πρὸς ἀλλήλους
  choice: entre eux
  rationale: Cette expression réciproque indique qu’ils échangeaient les uns avec les autres.
- source_word: τί ἂν ποιήσαιεν
  choice: ce qu’ils pourraient faire
  rationale: ἄν avec l’optatif dans cette interrogation indirecte exprime une possibilité envisagée au cours de leur délibération, sans imposer l’idée d’obligation.
- source_word: τῷ Ἰησοῦ
  choice: à Jésus
  rationale: Le datif désigne la personne visée par l’action projetée. « À Jésus » préserve la formulation du grec sans expliciter davantage l’hostilité par « contre Jésus ».
theological_decisions:
- issue: Faut-il rendre ἀνοίας par un terme pouvant évoquer une maladie mentale, ou par une expression soulignant l’irrationalité morale et passionnelle?
  choice: fureur insensée
  alternative: folie; démence; fureur
  rationale: Le contexte montre une réaction hostile à la guérison accomplie par Jésus. « Fureur insensée » maintient la dimension affective suggérée par la scène et le défaut de raison porté par ἄνοια, sans médicaliser le propos. La note conserve les autres possibilités lexicales.
translation_notes:
  register: Français international moderne, naturel et digne. « Mais eux » conserve l’emphase du pronom grec; les imparfaits rendent la délibération en cours. La note signale l’étendue sémantique de ἄνοια sans faire du texte un diagnostic psychologique.
