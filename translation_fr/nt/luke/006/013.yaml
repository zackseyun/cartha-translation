source:
  edition: SBLGNT
  text: καὶ ὅτε ἐγένετο ἡμέρα, προσεφώνησεν τοὺς μαθητὰς αὐτοῦ, καὶ ἐκλεξάμενος ἀπ’ αὐτῶν δώδεκα, οὓς καὶ ἀποστόλους ὠνόμασεν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/013.yaml
  text: And when day came[a], he called his disciples, and chose twelve from among them[b], whom he also named apostles.
translation:
  language: fr
  text: Quand le jour parut, il appela ses disciples[a] et en choisit douze, qu’il nomma aussi apôtres[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « convoqua ses disciples » ou « appela ses disciples auprès de lui ». Le verbe grec peut aussi signifier « adresser la parole à » ; le contexte favorise ici l’idée de les réunir pour en choisir douze.
    reason: lexical_alternative
  - marker: b
    text: Ou « qu’il appela aussi apôtres ». Le verbe grec signifie « nommer » ou « appeler » ; « nomma » permet de distinguer cette désignation de l’appel adressé auparavant aux disciples.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε ἐγένετο ἡμέρα
  choice: Quand le jour fut venu
  rationale: Cette tournure française naturelle et digne exprime l’arrivée du jour sans réduire nécessairement l’expression au seul lever du soleil.
- source_word: προσεφώνησεν
  choice: appela ses disciples auprès de lui
  rationale: Dans ce contexte, le verbe indique que Jésus fait venir ses disciples en vue d’en choisir douze. « Auprès de lui » rend explicite la direction suggérée par le verbe composé sans ajouter d’idée étrangère au passage.
- source_word: μαθητὰς
  choice: disciples
  rationale: « Disciples » est le terme français courant qui conserve ici l’idée de personnes attachées à Jésus pour recevoir son enseignement.
- source_word: ἐκλεξάμενος
  choice: en choisit
  rationale: « Choisit » rend simplement l’acte délibéré de sélection; le pronom « en » reprend les disciples et indique que les douze sont tirés de leur groupe.
- source_word: ἀπ’ αὐτῶν
  choice: en
  rationale: Dans « il en choisit douze », le pronom français exprime naturellement que les douze sont choisis parmi l’ensemble des disciples.
- source_word: δώδεκα
  choice: douze
  rationale: Traduction directe du nombre, sans substantiver inutilement « les Douze » à ce stade de la phrase.
- source_word: ἀποστόλους
  choice: apôtres
  rationale: Le mot fonctionne ici comme la désignation donnée aux douze. « Apôtres » en conserve la valeur reconnue dans le récit de Luc, tandis que « envoyés » ou « messagers » serait trop générique.
- source_word: ὠνόμασεν
  choice: nomma
  rationale: « Nomma » exprime l’attribution d’une désignation et évite de répéter « appela », employé plus tôt au sens de faire venir.
theological_decisions:
- issue: Faut-il rendre ἀποστόλους par le titre établi « apôtres » ou par son sens plus général « envoyés » ?
  choice: apôtres
  alternative: envoyés; messagers
  rationale: Dans ce verset, Jésus donne un nom ou un titre aux douze, et non une simple description ponctuelle de leur mission. « Apôtres » préserve cette fonction narrative sans ajouter de définition doctrinale.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase conserve le déroulement du grec tout en évitant une syntaxe participiale pesante. « Apôtres » garde le terme biblique établi, et les deux verbes français distincts clarifient les deux sens différents de l’idée d’appeler.
