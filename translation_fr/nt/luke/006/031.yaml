  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ καθὼς θέλετε ἵνα ποιῶσιν ὑμῖν οἱ ⸀ἄνθρωποι, ποιεῖτε αὐτοῖς ὁμοίως.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/031.yaml
  text: And just as you want people to do for you[a], do the same for them.
translation:
  language: fr
  text: Et comme vous voulez que les gens fassent pour vous[a], faites de même pour eux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Et comme vous souhaitez que les autres fassent pour vous, faites de même pour eux. »'
    reason: 'Alternative lexicale : « souhaitez » peut rendre θέλετε, et « les autres » explicite également la portée réciproque de la référence humaine générique.'
lexical_decisions:
- source_word: καθὼς
  choice: comme
  rationale: Introduit naturellement en français la norme de comparaison exprimée par le grec, sans affaiblir le parallélisme.
- source_word: θέλετε
  choice: vous voulez
  rationale: Rend le désir ou la préférence ordinaire exprimé ici par θέλω dans un français actuel et direct.
- source_word: ἵνα ποιῶσιν ὑμῖν
  choice: que les autres agissent envers vous
  rationale: La construction française avec « que » rend le contenu du désir. « Agir envers » conserve la portée générale de ποιέω et le rapport orienté vers les destinataires exprimé par le datif.
- source_word: οἱ ἄνθρωποι
  choice: les autres
  rationale: Dans cette maxime réciproque, « les autres » désigne naturellement les personnes en général, sans donner au terme grec générique un sens exclusivement masculin.
- source_word: ποιεῖτε αὐτοῖς ὁμοίως
  choice: agissez de même envers eux
  rationale: Reprend le même verbe que dans la première proposition et préserve la correspondance éthique marquée par ὁμοίως.
theological_decisions:
- issue: Portée générique de οἱ ἄνθρωποι
  choice: les autres
  alternative: les gens ; les êtres humains ; les hommes
  rationale: Le terme grec vise les personnes en général et non les seuls hommes. « Les autres » exprime cette portée inclusive de manière naturelle dans le contexte de réciprocité.
- issue: Sens large de ποιέω avec le datif
  choice: agir envers
  alternative: faire pour
  rationale: « Agir envers » garde la maxime générale et évite de limiter le commandement aux services rendus. La variante plus formelle « faire pour » reste signalée en note.
translation_notes:
  register: Français international moderne, simple et digne. La répétition d’« agir » conserve le parallélisme du grec, tandis que « les autres » rend naturellement la référence humaine générique.
