id: LUK.6.20
reference: Luke 6:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ αὐτὸς ἐπάρας τοὺς ὀφθαλμοὺς αὐτοῦ εἰς τοὺς μαθητὰς αὐτοῦ ἔλεγεν· Μακάριοι οἱ πτωχοί, ὅτι ὑμετέρα ἐστὶν ἡ βασιλεία τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/020.yaml
  text: 'And he[a], lifting up his eyes toward his disciples, was saying: “Blessed are the poor[b], because yours is the kingdom of God.”'
translation:
  language: fr
  text: 'Lui, levant les yeux vers ses disciples, disait : « Heureux, vous qui êtes pauvres[a][b], car le royaume de Dieu est à vous. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « Heureux les pauvres. » La tournure grecque est à la troisième personne, mais les mots « à vous » qui suivent montrent que Jésus s’adresse directement à ses disciples.'
    reason: lexical_alternative
  - marker: b
    text: Luc dit « les pauvres », et non « les pauvres en esprit » (voir Matthieu 5.3).
    reason: cross_reference
lexical_decisions:
- source_word: ἐπάρας
  choice: levant
  rationale: Le participe présent restitue naturellement l’action qui accompagne et précède la parole, tout en conservant l’image concrète du regard levé.
- source_word: εἰς
  choice: vers
  rationale: Avec les yeux et un complément de personne, la préposition exprime ici la direction du regard.
- source_word: ἔλεγεν
  choice: il disait
  rationale: L’imparfait grec est conservé afin de présenter la parole dans son déroulement ou comme l’ouverture d’un discours, plutôt que comme un acte simplement ponctuel.
- source_word: Μακάριοι
  choice: Heureux
  rationale: « Heureux » est la formule française consacrée des béatitudes et exprime une condition déclarée favorable par Dieu, sans la réduire à une émotion passagère.
- source_word: οἱ πτωχοί
  choice: vous les pauvres
  rationale: Le grec dit formellement « les pauvres », mais le possessif de deuxième personne qui suit (« à vous ») montre que Jésus s’adresse directement à ses disciples. Cette formulation française garde à la fois le groupe nominal et l’adresse directe.
- source_word: ὅτι
  choice: car
  rationale: « Car » introduit clairement et dignement la raison de la déclaration de bonheur.
- source_word: ὑμετέρα ἐστὶν
  choice: est à vous
  rationale: Cette tournure française naturelle rend la possession prédicative et maintient l’accent mis sur les destinataires.
- source_word: βασιλεία τοῦ θεοῦ
  choice: le royaume de Dieu
  rationale: Expression française établie qui préserve l’étendue sémantique de βασιλεία, pouvant évoquer aussi bien la royauté ou le règne que le domaine royal.
theological_decisions:
- issue: Faut-il comprendre πτωχοί au sens spirituel ou conserver la désignation sans complément ?
  choice: les pauvres
  alternative: les pauvres en esprit
  rationale: Luc écrit simplement « les pauvres ». Ajouter « en esprit » harmoniserait indûment ce verset avec Matthieu 5.3 et atténuerait la portée propre de la formulation lucanienne.
- issue: Faut-il traduire la béatitude à la troisième personne ou comme une adresse directe ?
  choice: Heureux, vous les pauvres
  alternative: Heureux les pauvres
  rationale: La construction grecque est formellement à la troisième personne, mais ὑμετέρα (« à vous ») fait immédiatement de la parole une adresse directe. Le texte retient les deux traits, tandis qu’une note signale la forme plus littérale.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe conserve l’imparfait introductif et la direction concrète du regard. La formule « Heureux, vous les pauvres » rend l’adresse directe sans effacer la forme nominale grecque, explicitée en note.
