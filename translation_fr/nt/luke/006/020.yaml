    issue: « Alors » ajoute une transition temporelle non exprimée par le grec.
    rationale: Καὶ αὐτός signifie simplement « et lui » / « lui », avec une possible emphase sur le sujet, non « alors ».
  - severity: low
    issue: La formule « Heureux, vous les pauvres » est stylistiquement abrupte.
    rationale: Une relative explicative rend l’adresse directe plus naturelle en français sans introduire « pauvres en esprit » ni modifier le référent.
  revised_text: 'Lui, levant les yeux vers ses disciples, disait : « Heureux, vous qui êtes pauvres[a][b], car le royaume de Dieu est à vous. »'
