  to: L’homme bon tire le bien du bon trésor de son cœur, et l’homme mauvais tire le mal de son mauvais trésor ; car c’est de ce qui déborde du cœur que la bouche parle.[a]
  rationale: La correction, limitée à la dernière proposition et à la note, évite l’ambiguïté française de « parler de » et préserve la relation exprimée par ἐκ (« de, à partir de »). La note conserve une alternative lexicale directement pertinente, sans ajouter une paraphrase interprétative.
