id: LUK.6.45
reference: Luke 6:45
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ ἀγαθὸς ἄνθρωπος ἐκ τοῦ ἀγαθοῦ θησαυροῦ τῆς καρδίας ⸀αὐτοῦ προφέρει τὸ ἀγαθόν, καὶ ὁ ⸀πονηρὸς ἐκ τοῦ ⸀πονηροῦ προφέρει τὸ πονηρόν· ἐκ γὰρ ⸀περισσεύματος καρδίας λαλεῖ τὸ στόμα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/045.yaml
  text: The good man brings forth what is good out of the good treasure of his heart[a], and the evil man out of his evil treasure brings forth what is evil; for out of the overflow of the heart his mouth speaks.
translation:
  language: fr
  text: L’homme bon tire le bien du bon trésor de son cœur, et l’homme mauvais tire le mal de son mauvais trésor ; car c’est de ce qui déborde du cœur que la bouche parle.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « car c’est de l’abondance du cœur que la bouche parle ».'
    reason: Le nom grec περισσεύματος désigne ce qui est en surplus ou en abondance, avec l’image de ce qui déborde.
lexical_decisions:
- source_word: ἀγαθὸς ἄνθρωπος
  choice: l’homme bon
  rationale: Conserve la forme masculine singulière du grec tout en présentant un type humain représentatif, dans un parallélisme direct avec « l’homme mauvais ».
- source_word: θησαυροῦ
  choice: trésor
  rationale: Préserve l’image d’une réserve intérieure d’où sortent le bien ou le mal ; « réserve » serait plus explicatif.
- source_word: καρδίας
  choice: cœur
  rationale: Équivalent français usuel pour le centre intérieur de la personne, de ses dispositions et de sa volonté.
- source_word: προφέρει
  choice: tire
  rationale: « Tirer quelque chose de » exprime naturellement en français le mouvement depuis une réserve intérieure, sans alourdir la phrase.
- source_word: πονηρὸς / πονηροῦ / πονηρόν
  choice: mauvais / mauvais trésor / mal
  rationale: Rend la valeur morale du terme dans un français naturel et maintient l’opposition nette avec « bon » et « bien ».
- source_word: περισσεύματος
  choice: ce qui déborde
  rationale: Conserve l’image dynamique d’une surabondance intérieure qui se répand dans la parole.
- source_word: λαλεῖ
  choice: parle
  rationale: Équivalent courant et digne dans cette maxime.
- source_word: τὸ στόμα αὐτοῦ
  choice: sa bouche
  rationale: Maintient la mention explicite de la bouche, qui souligne la manifestation extérieure de l’état du cœur.
theological_decisions:
- issue: Contraste moral entre ἀγαθός et πονηρός
  choice: « bon / bien » opposé à « mauvais / mal »
  alternative: « bon / bien » opposé à « méchant / mal »
  rationale: Le texte décrit le caractère moral et ce qu’il produit. « Mauvais » garde ce contraste sans donner à πονηρός une nuance psychologique ou agressive plus étroite que le contexte n’impose.
- issue: Relation entre le cœur et la parole
  choice: Conserver l’image selon laquelle la bouche parle de ce qui déborde du cœur
  alternative: 'Paraphraser : « les paroles révèlent ce qui remplit le cœur »'
  rationale: La formulation retenue préserve la causalité et la métaphore de la surabondance sans réduire le propos à une simple révélation diagnostique.
translation_notes:
  register: Français international moderne, proverbial et digne. Le parallélisme est conservé, ainsi que les images du trésor, du cœur et de la bouche. La répétition grecque est légèrement allégée par les tournures idiomatiques « tire le bien » et « tire le mal ».
