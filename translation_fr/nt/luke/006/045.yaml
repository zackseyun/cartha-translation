review_pass:
  verdict: revise
  source_fidelity: 'La première moitié rend fidèlement le parallélisme grec : l’homme bon/mauvais, le bon/mauvais trésor, et le bien/mal qui en est tiré. En revanche, « sa bouche parle de ce qui déborde de son cœur » peut signifier en français que la bouche parle *au sujet de* ce qui déborde, alors que ἐκ marque la source : la parole procède du débordement du cœur. La révision rétablit explicitement ce rapport de provenance.'
  naturalness: Le registre proverbial est bon et la phrase est fluide. « C’est de ce qui déborde du cœur que la bouche parle » est un peu plus soutenu, mais naturel dans ce genre de maxime et plus précis que la formulation initiale.
  terminology: « Bon », « mauvais », « bien », « mal », « trésor », « cœur » et « bouche » conservent correctement les contrastes et images du grec. « Mauvais » demeure une option moderne et suffisamment morale pour πονηρός dans ce parallélisme.
  issues:
  - severity: medium
    issue: La construction « parler de ce qui déborde » affaiblit le sens de provenance de ἐκ.
    rationale: En français, « parler de » introduit normalement le thème du discours. Le grec dit que la bouche parle à partir du surplus du cœur. « C’est de ce qui déborde du cœur que la bouche parle » exprime cette source sans paraphraser l’image.
  revised_text: L’homme bon tire le bien du bon trésor de son cœur, et l’homme mauvais tire le mal de son mauvais trésor ; car c’est de ce qui déborde du cœur que la bouche parle.[a]
  revised_footnotes:
