    text: 'Ou : « car c’est de l’abondance du cœur que la bouche parle ».'
    reason: Le nom grec περισσεύματος désigne ce qui est en surplus ou en abondance, avec l’image de ce qui déborde.
  revision_rationale: La correction, limitée à la dernière proposition et à la note, évite l’ambiguïté française de « parler de » et préserve la relation exprimée par ἐκ (« de, à partir de »). La note conserve une alternative lexicale directement pertinente, sans ajouter une paraphrase interprétative.
