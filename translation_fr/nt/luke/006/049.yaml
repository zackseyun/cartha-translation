id: LUK.6.49
reference: Luke 6:49
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ δὲ ἀκούσας καὶ μὴ ποιήσας ὅμοιός ἐστιν ἀνθρώπῳ οἰκοδομήσαντι οἰκίαν ἐπὶ τὴν γῆν χωρὶς θεμελίου, ᾗ προσέρηξεν ὁ ποταμός, καὶ ⸂εὐθὺς συνέπεσεν⸃, καὶ ἐγένετο τὸ ῥῆγμα τῆς οἰκίας ἐκείνης μέγα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/049.yaml
  text: But the one who heard and did not act is like a man who built a house on the ground without a foundation[a]. When the river burst against it, it immediately collapsed[b], and the ruin of that house was great.
translation:
  language: fr
  text: Mais celui qui a entendu et n’a pas agi[a] ressemble à un homme qui a construit une maison sur le sol, sans fondation. Le fleuve s’est précipité contre elle, et aussitôt elle s’est effondrée ; la ruine de cette maison fut grande[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « n’a pas fait ». Dans le contexte, il s’agit de ne pas mettre en pratique les paroles de Jésus.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « la brèche de cette maison fut grande ». Le mot grec peut désigner une fracture, une brèche ou la ruine qui en résulte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ ἀκούσας καὶ μὴ ποιήσας
  choice: Mais celui qui a entendu et n’a pas mis mes paroles en pratique
  rationale: Le participe substantivé désigne celui qui entend, tandis que ποιέω renvoie ici à la mise en pratique des paroles de Jésus dans le contexte immédiat. L’explicitation « mes paroles » produit un français naturel et relie clairement le verset à Luc 6.47, sans modifier le référent contextuel.
- source_word: ὅμοιός ἐστιν ἀνθρώπῳ
  choice: ressemble à un homme
  rationale: Formulation française courante qui conserve le singulier représentatif masculin de l’image grecque.
- source_word: οἰκοδομήσαντι οἰκίαν ἐπὶ τὴν γῆν
  choice: qui a construit une maison à même le sol
  rationale: « À même le sol » exprime naturellement une construction directement posée sur la terre et prépare la précision « sans fondations ».
- source_word: χωρὶς θεμελίου
  choice: sans fondations
  rationale: Le pluriel est idiomatique en français pour désigner l’assise d’un bâtiment et rend clairement l’absence de fondation.
- source_word: ᾗ προσέρηξεν ὁ ποταμός
  choice: Le fleuve s’est jeté contre elle
  rationale: προσρήγνυμι évoque un choc violent. « Se jeter contre » conserve cette force, et « elle » reprend sans ambiguïté « maison ».
- source_word: εὐθὺς συνέπεσεν
  choice: aussitôt elle s’est effondrée
  rationale: « S’effondrer » est le verbe français naturel pour la chute d’une maison, et « aussitôt » préserve εὐθύς.
- source_word: ἐγένετο τὸ ῥῆγμα τῆς οἰκίας ἐκείνης μέγα
  choice: la ruine de cette maison a été grande
  rationale: ῥῆγμα peut désigner la fracture, la brèche ou la ruine résultant de l’effondrement. « Ruine » convient au contexte, tandis que « grande » maintient le caractère sobre et littéral de μέγα.
theological_decisions:
- issue: Langage masculin représentatif dans la comparaison
  choice: un homme
  alternative: une personne
  rationale: Le grec emploie ἀνθρώπῳ au singulier dans une image représentative. « Un homme » conserve la forme de la comparaison sans suggérer que son application serait limitée aux hommes.
- issue: Objet implicite de ποιήσας
  choice: n’a pas mis mes paroles en pratique
  alternative: n’a pas agi / n’a pas fait
  rationale: 'Le complément est implicite dans ce verset mais explicite dans le contexte immédiat : il s’agit des paroles de Jésus (Luc 6.47). La traduction l’explicite pour rendre le sens naturel en français, tout en signalant cette précision en note.'
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proche de la progression grecque tout en évitant les tournures artificielles. « À même le sol », « fondations » et « s’est effondrée » appartiennent au vocabulaire courant de la construction. Les deux notes préservent l’implicite de ποιέω et l’étendue sémantique de ῥῆγμα.
