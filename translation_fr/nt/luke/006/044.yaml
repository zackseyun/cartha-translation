id: LUK.6.44
reference: Luke 6:44
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἕκαστον γὰρ δένδρον ἐκ τοῦ ἰδίου καρποῦ γινώσκεται· οὐ γὰρ ἐξ ἀκανθῶν συλλέγουσιν σῦκα, οὐδὲ ἐκ βάτου ⸂σταφυλὴν τρυγῶσιν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/044.yaml
  text: For each tree is known by its own fruit[a]. For they do not gather figs from thorns[b], nor do they harvest grapes from a bramble bush.
translation:
  language: fr
  text: Car chaque arbre se reconnaît à son propre fruit. Car on ne cueille pas de figues sur des épines, et l’on ne récolte pas une grappe de raisin sur une ronce.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἕκαστον ... δένδρον
  choice: chaque arbre
  rationale: La tournure distributive est rendue directement et naturellement en français.
- source_word: γὰρ
  choice: car / en effet
  rationale: Les deux occurrences gardent leur valeur explicative, avec une variation française naturelle qui évite une répétition pesante.
- source_word: ἐκ τοῦ ἰδίου καρποῦ
  choice: à son propre fruit
  rationale: Avec « se reconnaît », la préposition « à » est idiomatique; « propre » maintient l’insistance sur le fruit particulier de chaque arbre.
- source_word: γινώσκεται
  choice: se reconnaît
  rationale: Le passif grec exprime une reconnaissance habituelle; le pronominal français est naturel et conserve ce sens proverbial.
- source_word: ἀκανθῶν
  choice: plantes épineuses
  rationale: Le pluriel grec désigne largement des végétaux épineux; cette formulation évite de réduire le terme aux seules épines détachées.
- source_word: συλλέγουσιν
  choice: on ne cueille pas
  rationale: « Cueillir » convient naturellement aux figues et le sujet indéfini « on » rend le pluriel générique grec.
- source_word: σῦκα
  choice: figues
  rationale: Équivalent français direct du pluriel grec.
- source_word: βάτου
  choice: buisson de ronces
  rationale: Le terme désigne un buisson épineux de type ronce, sans qu’il soit nécessaire d’en préciser l’espèce.
- source_word: σταφυλήν
  choice: raisin
  rationale: Bien que le grec soit au singulier, « raisin » s’emploie naturellement en français comme nom collectif pour le produit de la vigne.
- source_word: τρυγῶσιν
  choice: on ne vendange pas
  rationale: Le verbe grec concerne spécialement la récolte de fruits mûrs, notamment du raisin; « vendanger » préserve précisément cette nuance.
theological_decisions:
- issue: Portée métaphorique de l’image du fruit
  choice: Conserver le proverbe agricole sans expliciter son application morale.
  alternative: Ajouter une référence au caractère, aux paroles ou aux actes humains.
  rationale: Le grec maintient l’image dans ce verset; son application ressort du contexte et ne doit pas être ajoutée à la traduction.
translation_notes:
  register: Français international moderne, digne et proverbial. La formulation privilégie des expressions agricoles compréhensibles et naturelles, tout en conservant la correspondance entre l’arbre et son fruit ainsi que la distinction lexicale entre cueillir et vendanger.
