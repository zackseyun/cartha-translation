review_pass:
  verdict: revise
  source_fidelity: 'La première proposition est fidèle. Dans la seconde, « buisson de ronces » rend adéquatement βάτος, mais « vendanger du raisin sur » est moins précis : σταφυλήν est singulier (« une grappe de raisin ») et τρυγῶσιν signifie récolter/cueillir, sans impliquer l’opération viticole particulière de la vendange. La reprise de γάρ par « Car » dans les deux propositions conserve clairement la structure explicative grecque.'
  naturalness: « Chaque arbre se reconnaît à son propre fruit » est naturel et proverbial. « On ne récolte pas une grappe de raisin sur une ronce » est idiomatique, compréhensible en français international moderne et évite l’association quelque peu incongrue de « vendanger » avec un buisson de ronces.
  terminology: '« Épines » et « ronce » rendent respectivement ἀκάνθαι et βάτος sans sur-spécifier les végétaux. « Propre fruit » conserve l’insistance de ἰδίου. Aucune note n’est nécessaire : les termes français choisis expriment le contraste botanique sans ambiguïté excessive.'
  issues:
  - severity: medium
    issue: « vendanger pas de raisin » pour τρυγῶσιν σταφυλήν
    rationale: Le grec emploie le singulier σταφυλήν, une grappe de raisin, et le verbe désigne la récolte des raisins. « Vendanger » évoque plus spécifiquement la récolte dans une vigne et son emploi avec « sur un buisson de ronces » est moins naturel. « Récolter une grappe de raisin » préserve mieux le sens et le nombre.
  - severity: low
    issue: Variation « Car / En effet » pour les deux γάρ
    rationale: La variation est possible en français, mais la répétition de γάρ structure explicitement les deux affirmations proverbiales. Employer « Car » dans les deux cas rend ce parallélisme sans lourdeur notable.
  revised_text: Car chaque arbre se reconnaît à son propre fruit. Car on ne cueille pas de figues sur des épines, et l’on ne récolte pas une grappe de raisin sur une ronce.
