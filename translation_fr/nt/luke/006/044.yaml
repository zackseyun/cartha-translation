- from: Car chaque arbre se reconnaît à son propre fruit. En effet, on ne cueille pas de figues sur des plantes épineuses, et l’on ne vendange pas de raisin sur un buisson de ronces.
  to: Car chaque arbre se reconnaît à son propre fruit. Car on ne cueille pas de figues sur des épines, et l’on ne récolte pas une grappe de raisin sur une ronce.
  rationale: Révision limitée à la seconde image agricole afin de rendre le singulier « une grappe de raisin » et le sens général de la récolte, tout en conservant la distinction entre cueillir des figues et récolter des raisins. Le parallélisme des deux γάρ est également explicité par la reprise de « Car ».
