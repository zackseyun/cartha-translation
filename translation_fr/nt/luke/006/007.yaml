  text: ⸀παρετηροῦντο ⸀δὲ οἱ γραμματεῖς καὶ οἱ Φαρισαῖοι εἰ ἐν τῷ σαββάτῳ ⸀θεραπεύει, ἵνα εὕρωσιν ⸀κατηγορεῖν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/007.yaml
  text: And the scribes and the Pharisees were watching him closely to see whether he would heal on the Sabbath[b][a], so that they might find grounds to accuse him.
translation:
  language: fr
  text: Les spécialistes de la Loi et les pharisiens surveillaient attentivement Jésus[a] pour voir s’il allait guérir le jour du sabbat, afin de trouver un motif pour l’accuser[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « observaient attentivement ». Le verbe grec peut désigner une observation minutieuse et, dans ce contexte, soupçonneuse ou hostile.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « afin de trouver de quoi l’accuser », ou simplement « afin de pouvoir l’accuser ». L’expression grecque évoque la recherche d’une base ou d’une occasion d’accusation.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρετηροῦντο
  choice: surveillaient attentivement Jésus
  rationale: L’imparfait exprime une observation continue et intentionnelle; dans ce contexte, « surveillaient » laisse percevoir sa dimension hostile. « Jésus » explicite en français l’objet sous-entendu par le grec.
- source_word: οἱ γραμματεῖς
  choice: les spécialistes de la Loi
  rationale: Dans le contexte évangélique, le terme désigne des experts et interprètes de la Loi. Cette formulation actuelle communique plus clairement leur fonction que le terme traditionnel « scribes ».
- source_word: οἱ Φαρισαῖοι
  choice: les pharisiens
  rationale: Désignation française usuelle de ce groupe religieux.
- source_word: εἰ
  choice: pour voir si
  rationale: Après un verbe d’observation, cette tournure rend naturellement l’interrogation indirecte.
- source_word: ἐν τῷ σαββάτῳ
  choice: le jour du sabbat
  rationale: Expression temporelle idiomatique en français, fidèle au singulier grec.
- source_word: θεραπεύει
  choice: il ferait une guérison
  rationale: Le présent grec dans l’interrogation indirecte est rendu selon la perspective passée du récit. La formulation conserve l’idée d’un acte de guérison sans préciser qui en serait l’objet.
- source_word: ἵνα εὕρωσιν κατηγορεῖν αὐτοῦ
  choice: afin de trouver un motif pour l’accuser
  rationale: La proposition exprime leur but. « Un motif » explicite sobrement l’idée de trouver une base ou une occasion d’accusation impliquée par la construction grecque.
theological_decisions:
- issue: Caractère hostile de l’observation
  choice: « surveillaient attentivement Jésus » et « afin de trouver un motif pour l’accuser »
  alternative: « observaient attentivement » et « afin de pouvoir l’accuser »
  rationale: Le contexte et la proposition finale indiquent une observation orientée vers l’accusation. La traduction fait entendre cette hostilité sans ajouter de mobile doctrinal ou psychologique.
translation_notes:
  register: Français international moderne, naturel et digne. « Spécialistes de la Loi » privilégie la compréhension immédiate; « pharisiens » et « sabbat » conservent les désignations historiques usuelles.
