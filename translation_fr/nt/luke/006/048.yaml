id: LUK.6.48
reference: Luke 6:48
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὅμοιός ἐστιν ἀνθρώπῳ οἰκοδομοῦντι οἰκίαν ὃς ἔσκαψεν καὶ ἐβάθυνεν καὶ ἔθηκεν θεμέλιον ἐπὶ τὴν πέτραν· πλημμύρης δὲ γενομένης προσέρηξεν ὁ ποταμὸς τῇ οἰκίᾳ ἐκείνῃ, καὶ οὐκ ἴσχυσεν σαλεῦσαι αὐτὴν ⸂διὰ τὸ καλῶς οἰκοδομῆσθαι αὐτήν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/048.yaml
  text: He is like a man building a house[a], who dug deep and laid a foundation on the rock. And when a flood came, the river burst against that house and was not able to shake it, because it had been well built.
translation:
  language: fr
  text: 'Il est semblable à un homme qui construit une maison[a] : il a creusé profondément et posé une fondation sur le roc. Quand une inondation est survenue, la rivière s’est précipitée contre cette maison, mais elle n’a pas pu l’ébranler, parce qu’elle avait été bien construite.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une personne ». Le grec emploie ici le masculin singulier « homme » comme figure représentative dans la comparaison.
    reason: Alternative lexicale et clarification de la portée représentative du masculin grec.
lexical_decisions:
- source_word: ὅμοιός ἐστιν
  choice: Il est semblable à
  rationale: Formule de comparaison naturelle et digne en français, qui conserve le lien direct établi par le grec.
- source_word: ἀνθρώπῳ
  choice: un homme
  rationale: Le singulier masculin de la figure représentative est conservé, sans exclure la portée générale de la comparaison.
- source_word: οἰκοδομοῦντι οἰκίαν
  choice: qui construit une maison
  rationale: Formulation courante et claire pour le participe grec décrivant l’activité de bâtir.
- source_word: ἔσκαψεν καὶ ἐβάθυνεν
  choice: il a creusé, approfondi le trou
  rationale: Les deux verbes grecs sont rendus distinctement afin de préserver l’insistance sur une excavation poussée en profondeur.
- source_word: ἔθηκεν θεμέλιον
  choice: posé les fondations
  rationale: Expression française idiomatique dans le domaine de la construction; le pluriel « fondations » est usuel en français pour le singulier collectif grec.
- source_word: ἐπὶ τὴν πέτραν
  choice: sur le roc
  rationale: « Le roc » évoque une masse rocheuse solide et conserve l’article défini du grec sans préciser de manière interprétative qu’il s’agit de la roche-mère.
- source_word: πλημμύρης δὲ γενομένης
  choice: Quand une inondation est survenue
  rationale: Rend naturellement la circonstance temporelle exprimée par le génitif absolu.
- source_word: προσέρηξεν ὁ ποταμὸς
  choice: le fleuve s’est jeté avec violence contre
  rationale: La formulation exprime l’impact violent du cours d’eau contre la maison; « fleuve » rend ποταμός sans atténuer sa force dans cette scène de crue.
- source_word: οὐκ ἴσχυσεν σαλεῦσαι αὐτὴν
  choice: il n’a pas pu l’ébranler
  rationale: « Ébranler » exprime à la fois la secousse et l’incapacité à déstabiliser la maison.
- source_word: διὰ τὸ καλῶς οἰκοδομῆσθαι αὐτήν
  choice: parce qu’elle avait été bien construite
  rationale: Conserve la relation causale, l’antériorité narrative et la voix passive de l’infinitif grec.
theological_decisions:
- issue: Genre grammatical et figure représentative dans ἀνθρώπῳ
  choice: un homme
  alternative: une personne
  rationale: Le texte présente au masculin singulier l’individu de la comparaison. La traduction conserve cette forme tout en signalant en note sa valeur représentative.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe reste fluide tout en conservant les deux actions d’excavation, la violence de la crue et le passif final du grec.
