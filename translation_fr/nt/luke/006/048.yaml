  to: 'Il est semblable à un homme qui construit une maison[a] : il a creusé profondément et posé une fondation sur le roc. Quand une inondation est survenue, la rivière s’est précipitée contre cette maison, mais elle n’a pas pu l’ébranler, parce qu’elle avait été bien construite.'
  rationale: La révision supprime l’ajout interprétatif « le trou », rend l’intensification de l’excavation par une formulation française idiomatique, rétablit le singulier de « fondation » et évite la restriction géographique impliquée par « fleuve ». Le sens, le registre et l’ambiguïté non pertinente du texte source sont préservés.
