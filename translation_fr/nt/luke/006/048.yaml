    issue: Ajout de « le trou » dans « approfondi le trou »
    rationale: Le grec ἔσκαψεν καὶ ἐβάθυνεν ne nomme pas un trou. Cette explicitation est inutile et l’expression est moins naturelle en français.
  - severity: low
    issue: « les fondations » au pluriel
    rationale: θεμέλιον est singulier. « Une fondation » est naturel ici et préserve plus précisément l’image source.
  - severity: low
    issue: « fleuve » pour ποταμός
    rationale: « Fleuve » désigne en français un cours d’eau qui se jette dans la mer; le grec ne requiert pas cette précision géographique. « Rivière » reste plus générique dans cette scène.
