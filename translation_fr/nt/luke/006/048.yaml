review_pass:
  verdict: revise
  source_fidelity: La structure comparative, l’image de la construction, la crue, l’impact du cours d’eau et la cause finale sont bien rendus. Toutefois, « approfondi le trou » introduit un objet explicite absent du grec et sonne peu naturel; « les fondations » pluralise le singulier θεμέλιον. « Fleuve » restreint aussi sans nécessité le sens usuel de ποταμός (« rivière/cours d’eau »).
  naturalness: Le français est globalement fluide et de registre approprié. « Creusé profondément » exprime naturellement l’insistance des deux verbes grecs sans ajouter « le trou ». « La rivière s’est précipitée contre » conserve une image dynamique et idiomatique dans le contexte d’une crue.
  terminology: « Roc », « maison », « ébranler » et « bien construite » conviennent. Le masculin représentatif d’ἀνθρώπῳ est conservé; la note lexicale est claire et non doctrinale.
  issues:
