  text: ⸀καὶ Μαθθαῖον καὶ Θωμᾶν ⸁καὶ ⸀Ἰάκωβον Ἁλφαίου καὶ Σίμωνα τὸν καλούμενον Ζηλωτὴν
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/015.yaml
  text: and Matthew and Thomas[a], and James son of Alphaeus, and Simon who was called the Zealot
translation:
  language: fr
  text: Et Matthieu et Thomas, et Jacques, fils d’Alphée, et Simon, appelé le Zélote[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le zélé ». Le terme grec peut servir de surnom et n’implique pas nécessairement que Simon appartenait officiellement à un mouvement politique organisé.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: et
  rationale: Conjonction de coordination ordinaire. En français, sa répétition est allégée là où l’énumération reste claire et naturelle.
- source_word: Μαθθαῖον
  choice: Matthieu
  rationale: Forme française traditionnelle et courante du nom grec Μαθθαῖος.
- source_word: Θωμᾶν
  choice: Thomas
  rationale: Forme française traditionnelle et courante du nom grec Θωμᾶς.
- source_word: Ἰάκωβον Ἁλφαίου
  choice: Jacques, fils d’Alphée
  rationale: Dans cette formule d’identification, le génitif Ἁλφαίου indique très probablement la filiation. L’ajout de « fils de » l’explicite naturellement en français sans alourdir le texte.
- source_word: Σίμωνα
  choice: Simon
  rationale: Forme française traditionnelle et courante du nom grec Σίμων.
- source_word: τὸν καλούμενον
  choice: appelé
  rationale: Le participe passif attributif désigne le nom ou surnom sous lequel Simon était connu. « Appelé » est concis et naturel dans une liste de noms.
- source_word: Ζηλωτὴν
  choice: le Zélote
  rationale: Rend l’épithète identificatrice habituelle sans préciser indûment s’il s’agit d’une appartenance officielle à un mouvement politique constitué.
theological_decisions:
- issue: Ζηλωτής désigne-t-il l’appartenance à un parti politique ou simplement une personne zélée ?
  choice: le Zélote
  alternative: le zélé
  rationale: « Le Zélote » conserve l’épithète traditionnelle tout en laissant ouverte la question historique de l’appartenance formelle de Simon à un mouvement politique. La note signale l’autre valeur lexicale possible.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe demeure celle d’une liste tout en évitant une répétition pesante de « et ». La virgule autour de « fils d’Alphée » clarifie l’identification de Jacques. Le marqueur de note est placé après « le Zélote », expression directement concernée par la variante lexicale.
