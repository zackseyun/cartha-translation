  naturalness: « Et Matthieu et Thomas, et Jacques, fils d’Alphée, et Simon, appelé le Zélote » reste une énumération lisible et naturelle dans le style sobre d’une liste d’apôtres. La répétition des conjonctions reflète le rythme catalogique du grec sans produire de lourdeur excessive.
  terminology: « Matthieu », « Thomas », « Jacques », « Alphée » et « Simon » sont les formes françaises usuelles. « le Zélote » maintient l’épithète traditionnelle et son ambiguïté quant à une éventuelle affiliation historique; la note offre l’alternative descriptive sans trancher la question.
