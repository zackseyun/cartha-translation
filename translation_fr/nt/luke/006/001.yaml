id: LUK.6.1
reference: Luke 6:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἐγένετο δὲ ἐν ⸀σαββάτῳ διαπορεύεσθαι αὐτὸν ⸀διὰ σπορίμων, καὶ ἔτιλλον οἱ μαθηταὶ αὐτοῦ ⸂καὶ ἤσθιον τοὺς στάχυας⸃ ψώχοντες ταῖς χερσίν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/001.yaml
  text: It happened on a Sabbath that he was passing through grainfields[a], and his disciples were plucking and eating the heads of grain[b], rubbing them in their hands.
translation:
  language: fr
  text: Un jour de sabbat, il traversait des champs de céréales. Ses disciples arrachaient des épis, les frottaient entre leurs mains et les mangeaient.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐγένετο δὲ ἐν σαββάτῳ
  choice: Un jour de sabbat
  rationale: Cette formulation française naturelle introduit l’épisode et rend le sabbat non défini, sans calquer lourdement la tournure narrative grecque Ἐγένετο δὲ.
- source_word: διαπορεύεσθαι αὐτὸν διὰ σπορίμων
  choice: il traversait des champs de céréales
  rationale: L’imparfait restitue l’aspect imperfectif de l’infinitif présent. « Champs de céréales » désigne naturellement des terres ensemencées sans préciser indûment l’espèce cultivée.
- source_word: ἔτιλλον
  choice: arrachaient
  rationale: Le verbe décrit l’action de détacher ou cueillir les épis; « arrachaient des épis » est courant et concret en français. L’imparfait conserve l’action en cours.
- source_word: τοὺς στάχυας
  choice: des épis
  rationale: « Épis » est le terme français précis et usuel pour στάχυας; le contexte des champs de céréales rend inutile l’ajout « de grain ».
- source_word: ψώχοντες ταῖς χερσίν
  choice: les frottaient entre leurs mains
  rationale: La formulation décrit clairement le geste servant à dégager les grains comestibles et garde la référence explicite aux mains.
- source_word: καὶ ἤσθιον
  choice: et les mangeaient
  rationale: L’imparfait rend l’action continue et coordonnée. La réorganisation française suit l’ordre concret des gestes — arracher, frotter, manger — sans changer leur relation sémantique.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et narratif. La tournure idiomatique « Un jour de sabbat » évite un calque de Ἐγένετο δὲ, tandis que les imparfaits maintiennent la progression en cours. Le pronom « il » conserve la référence du texte grec sans introduire un nom absent de ce verset.
