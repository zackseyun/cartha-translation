id: LUK.6.5
reference: Luke 6:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἔλεγεν ⸀αὐτοῖς· Κύριός ἐστιν ⸂τοῦ σαββάτου ὁ υἱὸς τοῦ ἀνθρώπου⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/005.yaml
  text: And he was saying to them[a], “The Son of Man is Lord of the Sabbath.”
translation:
  language: fr
  text: 'Et il leur disait : « Le Fils de l’homme est Seigneur du sabbat[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « maître du sabbat ».'
    reason: Alternative lexicale possible pour κύριος dans ce contexte d’autorité.
lexical_decisions:
- source_word: καὶ
  choice: Et
  rationale: Conserve le lien narratif simple du grec sans ajouter une nuance temporelle absente du texte.
- source_word: ἔλεγεν
  choice: il leur disait
  rationale: L’imparfait français rend naturellement l’aspect imperfectif de l’imparfait grec, qui présente la parole dans le déroulement du récit.
- source_word: αὐτοῖς
  choice: leur
  rationale: Le pronom datif pluriel est rendu directement, sans préciser davantage l’identité des interlocuteurs.
- source_word: Κύριος
  choice: Seigneur
  rationale: Dans cette déclaration d’autorité, « Seigneur » conserve la force titulaires et christologique de κύριος, tandis que « maître » reste une possibilité lexicale signalée en note.
- source_word: τοῦ σαββάτου
  choice: du sabbat
  rationale: Le génitif est rendu de façon compacte et naturelle. En français moderne, « sabbat » s’écrit normalement avec une minuscule.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: le Fils de l’homme
  rationale: Cette formulation établie préserve le caractère de titre, son arrière-plan sémitique et son possible écho à Daniel 7.
theological_decisions:
- issue: Portée christologique de l’autorité sur le sabbat
  choice: « Le Fils de l’homme est Seigneur du sabbat » affirme directement son autorité à l’égard du sabbat.
  alternative: « Le Fils de l’homme est maître du sabbat »
  rationale: La traduction maintient la force de κύριος et l’ordre prédicatif de la proposition sans ajouter « même », qui n’est pas exprimé dans ce verset.
translation_notes:
  register: Français international moderne, digne et accessible. L’imparfait « disait » reste naturel dans le récit. La majuscule à « Seigneur » signale ici l’emploi comme titre christologique, tandis que « sabbat » conserve la minuscule usuelle en français.
