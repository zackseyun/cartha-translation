id: LUK.6.30
reference: Luke 6:30
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸀παντὶ αἰτοῦντί σε δίδου, καὶ ἀπὸ τοῦ αἴροντος τὰ σὰ μὴ ἀπαίτει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/030.yaml
  text: Give to everyone who asks you[a], and from the one who takes what is yours, do not demand it back.
translation:
  language: fr
  text: Donne à quiconque te demande, et à celui qui prend ce qui est à toi, ne le réclame pas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « n’exige pas qu’il te le rende ».'
    reason: Alternative lexicale pour ἀπαίτει, qui peut exprimer plus explicitement l’idée d’exiger la restitution.
lexical_decisions:
- source_word: παντὶ αἰτοῦντί σε
  choice: à quiconque te demande
  rationale: Cette formulation naturelle conserve la portée distributive et générale de παντί, tout en rendant simplement αἰτοῦντί σε sans préciser indûment qu’il s’agit de mendier.
- source_word: δίδου
  choice: Donne
  rationale: L’impératif présent exprime directement le commandement; en français, l’impératif simple est naturel et peut porter une valeur habituelle sans ajout explicatif.
- source_word: ἀπὸ τοῦ αἴροντος
  choice: à celui qui prend
  rationale: Avec un verbe de réclamation, le français construit naturellement le complément de personne avec « à ». « Prend » préserve la largeur de αἴρω sans imposer la qualification juridique de vol.
- source_word: τὰ σὰ
  choice: ce qui est à toi
  rationale: Cette expression idiomatique reflète le neutre pluriel substantivé et demeure plus large que « tes biens » ou « ta propriété ».
- source_word: μὴ ἀπαίτει
  choice: ne le réclame pas
  rationale: ἀπαιτέω désigne ici l’action de réclamer ou d’exiger en retour. « Réclamer » exprime naturellement la reprise de ce qui appartient à la personne, tandis que le pronom « le » reprend globalement « ce qui est à toi ».
theological_decisions:
- issue: Portée et force des commandements éthiques de Jésus
  choice: Conserver des impératifs directs et de portée générale, sans atténuer le propos.
  alternative: Interpréter le propos comme une hyperbole, le limiter à l’aumône ou restreindre la seconde proposition à un cadre juridique précis.
  rationale: Le grec emploie des impératifs directs et une formulation générale. La traduction doit maintenir la tension éthique du propos plutôt que décider de son application.
translation_notes:
  register: Français international moderne, direct et digne. Le tutoiement singulier reflète les formes grecques de deuxième personne du singulier. La phrase reste volontairement absolue et ne précise ni le statut de celui qui demande ni les circonstances dans lesquelles les biens sont pris.
