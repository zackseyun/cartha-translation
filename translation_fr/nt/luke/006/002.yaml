id: LUK.6.2
reference: Luke 6:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τινὲς δὲ τῶν Φαρισαίων ⸀εἶπαν· Τί ποιεῖτε ὃ οὐκ ⸀ἔξεστιν τοῖς σάββασιν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/002.yaml
  text: But some of the Pharisees said[a], “Why are you doing what is not lawful on the Sabbaths?”
translation:
  language: fr
  text: 'Mais quelques Pharisiens dirent : « Pourquoi faites-vous ce qu’il n’est pas permis de faire le jour du sabbat ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τινὲς
  choice: quelques
  rationale: Désigne une partie des pharisiens, et non le groupe entier ; « quelques » est naturel et précis en français.
- source_word: δὲ
  choice: Mais
  rationale: Marque ici une légère opposition et introduit la contestation qui suit.
- source_word: Φαρισαίων
  choice: pharisiens
  rationale: Forme française usuelle du nom de ce groupe juif.
- source_word: εἶπαν
  choice: dirent
  rationale: L’aoriste présente simplement la prise de parole comme un événement ; le passé simple convient au registre narratif biblique courant.
- source_word: Τί ποιεῖτε
  choice: Pourquoi faites-vous
  rationale: Pris littéralement, Τί signifie « quoi », mais dans cette tournure interrogative de reproche, le français idiomatique emploie « pourquoi ».
- source_word: ὃ οὐκ ἔξεστιν
  choice: ce qu’il n’est pas permis de faire
  rationale: Rend clairement l’action interdite tout en conservant la portée normative de ἔξεστιν, sans préciser abusivement la source exacte de l’interdiction.
- source_word: τοῖς σάββασιν
  choice: le jour du sabbat
  rationale: Le pluriel grec est une tournure idiomatique courante pour désigner le sabbat ; le singulier français exprime naturellement le sens dans ce contexte.
theological_decisions:
- issue: Expression désignant le sabbat
  choice: le jour du sabbat
  alternative: les jours de sabbat
  rationale: Bien que le grec emploie le pluriel τοῖς σάββασιν, celui-ci fonctionne couramment comme une désignation idiomatique du sabbat. Le singulier français évite de suggérer à tort plusieurs sabbats distincts dans la scène.
- issue: Nature de l’interdiction
  choice: il n’est pas permis
  alternative: il n’est pas légal
  rationale: « Permis » préserve la question de ce qui est autorisé selon la norme religieuse en cause, sans décider si les pharisiens invoquent directement la Loi écrite ou son interprétation traditionnelle.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple maintient une narration littéraire naturelle, tandis que la question directe reste immédiatement compréhensible. Aucune note n’est nécessaire, puisque l’expression grecque au pluriel se rend idiomatiquement au singulier en français.
