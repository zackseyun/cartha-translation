  text: Ἀλλὰ ὑμῖν λέγω τοῖς ἀκούουσιν, ἀγαπᾶτε τοὺς ἐχθροὺς ὑμῶν, καλῶς ποιεῖτε τοῖς μισοῦσιν ὑμᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/027.yaml
  text: 'But I say to you who are listening: love your enemies[a]; do good to those who hate you,'
translation:
  language: fr
  text: 'Mais je vous le dis, à vous qui écoutez[a] : aimez vos ennemis ; faites du bien à ceux qui vous haïssent,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qui entendez ». Le participe grec peut désigner ceux qui entendent ; « qui écoutez » souligne ici l’attention active.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀλλὰ
  choice: Mais
  rationale: Marque nettement le contraste avec ce qui précède, dans un français simple et naturel.
- source_word: ὑμῖν λέγω
  choice: je vous le dis
  rationale: Conserve l’adresse directe ; le pronom « le » rend la tournure idiomatique en français sans ajouter de contenu précis.
- source_word: τοῖς ἀκούουσιν
  choice: à vous qui écoutez
  rationale: Le participe présent désigne ici ceux qui prêtent activement l’oreille. « Écoutez » exprime cette réceptivité de façon naturelle tout en maintenant le lien grammatical avec « vous ».
- source_word: ἀγαπᾶτε
  choice: aimez
  rationale: Rend directement l’impératif et respecte le sens usuel du verbe ἀγαπάω.
- source_word: τοὺς ἐχθροὺς ὑμῶν
  choice: vos ennemis
  rationale: Traduction directe de l’objet accompagné du possessif, sans en restreindre la portée.
- source_word: καλῶς ποιεῖτε
  choice: faites du bien
  rationale: Expression française naturelle qui rend l’action moralement bonne indiquée par la locution grecque.
- source_word: τοῖς μισοῦσιν ὑμᾶς
  choice: à ceux qui vous haïssent
  rationale: Conserve sans l’atténuer le sens fort de μισέω et rend naturellement le datif après « faites du bien ».
theological_decisions:
- issue: Portée des impératifs éthiques envers les adversaires
  choice: Présenter les commandements comme des impératifs généraux, sans restriction ajoutée.
  alternative: Limiter le propos aux seuls ennemis personnels ou le présenter comme une hyperbole.
  rationale: Les impératifs grecs à la deuxième personne du pluriel ne comportent aucune limitation explicite. La formulation conserve donc toute leur force et laisse ouvertes les questions d’application.
translation_notes:
  register: Français international moderne, clair et digne. La reprise « à vous » préserve l’insistance de la construction grecque. La virgule finale est maintenue puisque le verset se poursuit dans la phrase suivante.
