id: LUK.6.40
reference: Luke 6:40
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὐκ ἔστιν μαθητὴς ὑπὲρ τὸν ⸀διδάσκαλον, κατηρτισμένος δὲ πᾶς ἔσται ὡς ὁ διδάσκαλος αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/040.yaml
  text: A disciple is not above his teacher[b][a], but everyone when fully trained will be like his teacher.
translation:
  language: fr
  text: Un disciple n’est pas au-dessus de son maître[a] ; mais, une fois pleinement formé[b], chacun sera comme son maître.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « enseignant ».
    reason: lexical_alternative
  - marker: b
    text: Ou « une fois entièrement préparé » ou « rendu pleinement apte ».
    reason: lexical_alternative
lexical_decisions:
- source_word: μαθητής
  choice: disciple
  rationale: « Disciple » conserve la dimension relationnelle et formatrice d’une personne qui apprend auprès d’un maître, au-delà du sens plus scolaire d’« élève ».
- source_word: ὑπὲρ
  choice: au-dessus de
  rationale: Dans cette comparaison, le terme exprime une supériorité de rang ou de condition ; « au-dessus de » restitue directement l’image grecque.
- source_word: διδάσκαλον / διδάσκαλος
  choice: maître
  rationale: Dans la relation antique entre disciple et enseignant, « maître » est naturel en français et maintient la corrélation traditionnelle « disciple–maître », sans désigner ici un statut divin.
- source_word: κατηρτισμένος
  choice: une fois pleinement formé
  rationale: Le participe parfait passif évoque l’aboutissement d’un processus par lequel quelqu’un est rendu apte ou accompli ; dans ce contexte pédagogique, « pleinement formé » convient, tandis que « une fois » rend la circonstance participiale sans imposer une proposition relative lourde.
- source_word: πᾶς
  choice: chacun
  rationale: Le masculin singulier a ici une portée générale. « Chacun » garde la forme distributive et singulière du proverbe en français naturel.
- source_word: ὡς
  choice: comme
  rationale: 'Le mot introduit une comparaison : le disciple formé devient comme son maître.'
- source_word: αὐτοῦ
  choice: son
  rationale: Le possessif renvoie individuellement à « chacun » ; le français « son maître » préserve naturellement cette correspondance singulière sans marquage de genre superflu.
theological_decisions:
- issue: Nature de la ressemblance entre le disciple formé et son maître
  choice: 'Conserver la comparaison ouverte : « sera comme son maître »'
  alternative: Préciser qu’il sera égal à son maître ou qu’il lui ressemblera seulement dans son caractère
  rationale: Le grec affirme une ressemblance sans en définir exactement l’étendue. La traduction ne doit ni transformer cette comparaison en égalité absolue ni la restreindre à un aspect particulier.
- issue: Valeur de κατηρτισμένος
  choice: « une fois pleinement formé » dans le cadre de la relation disciple–maître
  alternative: « équipé », « préparé », « rétabli » ou « rendu parfait »
  rationale: Le contexte immédiat favorise la formation du disciple, mais le verbe peut plus largement évoquer le fait d’être rendu apte ou accompli. Une note conserve cette amplitude lexicale.
translation_notes:
  register: Français international moderne, sobre et proverbial. Le couple « disciple–maître » est immédiatement intelligible et reflète la relation formative du texte. La ponctuation met en relief l’opposition entre l’absence de supériorité du disciple et sa ressemblance avec le maître au terme de sa formation.
