  text: καὶ ἀποκριθεὶς πρὸς αὐτοὺς εἶπεν ὁ Ἰησοῦς· Οὐδὲ τοῦτο ἀνέγνωτε ὃ ἐποίησεν Δαυὶδ ⸀ὁπότε ἐπείνασεν αὐτὸς καὶ οἱ μετ’ αὐτοῦ ⸀ὄντες;
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/003.yaml
  text: And Jesus answered them, “Have you not even read this, what David did when he was hungry, he and those who were with him?”
translation:
  language: fr
  text: 'Jésus leur répondit : « N’avez-vous pas même lu ce qu’a fait David lorsqu’il a eu faim, lui et ceux qui étaient avec lui ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς ... εἶπεν
  choice: répondit
  rationale: La construction participiale suivie d’un verbe conjugué constitue une tournure courante en grec koinè. « Répondit » en restitue naturellement le sens en français sans redondance.
- source_word: πρὸς αὐτοὺς
  choice: leur
  rationale: « Leur répondit » est la construction idiomatique française et conserve les destinataires de la réponse.
- source_word: Οὐδὲ τοῦτο ἀνέγνωτε
  choice: N’avez-vous pas même lu
  rationale: « Pas même » maintient l’insistance de οὐδέ dans cette question rhétorique, tandis que le passé composé est naturel pour évoquer une lecture antérieure ayant une portée présente.
- source_word: ὃ ἐποίησεν Δαυὶδ
  choice: ce qu’a fait David
  rationale: Cette relative est naturelle en français et suit directement le contenu du grec.
- source_word: ὁπότε ἐπείνασεν
  choice: lorsqu’il a eu faim
  rationale: « Lorsqu’il » rend sobrement la relation temporelle, et « a eu faim » exprime l’événement délimité indiqué par l’aoriste sans accentuer indûment le commencement de la faim.
- source_word: αὐτὸς καὶ οἱ μετ’ αὐτοῦ ὄντες
  choice: lui et ceux qui étaient avec lui
  rationale: La formulation conserve le pronom explicite αὐτός ainsi que la périphrase désignant les personnes présentes avec David, sans les qualifier plus précisément de compagnons.
