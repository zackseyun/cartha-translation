id: LUK.6.16
reference: Luke 6:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸀καὶ Ἰούδαν Ἰακώβου καὶ Ἰούδαν ⸀Ἰσκαριὼθ ⸀ὃς ἐγένετο προδότης.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/016.yaml
  text: and Judas son of James[a], and Judas Iscariot, who became a traitor.
translation:
  language: fr
  text: Judas, fils de Jacques[a], et Judas Iscariote, qui devint un traître.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Judas, frère de Jacques » ; le grec dit simplement « Judas de Jacques ».
    reason: alternative_reading
lexical_decisions:
- source_word: Ἰούδαν Ἰακώβου
  choice: Judas, fils de Jacques
  rationale: Le génitif Ἰακώβου exprime ici une relation familiale laissée implicite. Dans une liste de disciples, le français naturel demande de préciser cette relation. « fils de Jacques » est l’interprétation la plus probable, tandis que l’ambiguïté du grec est signalée en note.
- source_word: Ἰσκαριὼθ
  choice: Iscariote
  rationale: Forme française traditionnelle et toujours courante de ce nom ou surnom propre.
- source_word: ὃς ἐγένετο
  choice: qui devint
  rationale: « devint » conserve la valeur dynamique de ἐγένετο, plutôt que de la réduire au simple état exprimé par « fut ».
- source_word: προδότης
  choice: un traître
  rationale: « traître » rend naturellement le nom désignant celui qui trahit et convient comme attribut après « devint ».
- source_word: καὶ
  choice: et
  rationale: La conjonction répétée coordonne simplement les deux derniers noms de la liste.
theological_decisions:
- issue: Relation exprimée implicitement par Ἰακώβου dans « Judas de Jacques »
  choice: « Judas, fils de Jacques » dans le texte principal
  alternative: « Judas, frère de Jacques » ou, littéralement, « Judas de Jacques »
  rationale: Le grec ne précise pas la nature exacte de la relation. « fils de Jacques » fournit une formulation française naturelle et représente l’interprétation la plus probable, sans supprimer l’autre possibilité, conservée en note.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase conserve la coordination de la liste et la valeur dynamique de ἐγένετο ; la note maintient l’ambiguïté réelle du génitif grec.
