  rationale: La révision remplace le verbe interprétatif « versera » par « donnera », rétablit la succession descriptive du grec et emploie « giron », rendu français naturel de κόλπος, accompagné de la note culturelle nécessaire. La dernière proposition conserve explicitement la répétition de « mesurer », présente dans le grec, ainsi que l’idée de réciprocité exprimée par ἀντι- dans « en retour ».
