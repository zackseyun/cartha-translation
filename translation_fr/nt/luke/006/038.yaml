    issue: Ajout interprétatif de « versera »
    rationale: δώσουσιν signifie « ils donneront »; le verbe ne spécifie pas que la mesure est versée. Bien que plausible dans l’image, « versera » ajoute une modalité absente du grec.
  - severity: low
    issue: Ordre de l’image réagencé
    rationale: Le grec décrit « une bonne mesure, tassée, secouée, débordante », puis indique qu’elle sera donnée dans le κόλπος. Rétablir cet ordre conserve mieux l’effet accumulatif du texte.
  - severity: low
    issue: Note b redondante
    rationale: La note ne fournit ni variante textuelle ni information culturelle ou sémantique supplémentaire; la répétition explicite est maintenue dans le texte révisé.
