id: LUK.6.38
reference: Luke 6:38
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: δίδοτε, καὶ δοθήσεται ὑμῖν· μέτρον καλὸν πεπιεσμένον ⸀σεσαλευμένον ὑπερεκχυννόμενον δώσουσιν εἰς τὸν κόλπον ὑμῶν· ⸂ᾧ γὰρ μέτρῳ⸃ μετρεῖτε ἀντιμετρηθήσεται ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/038.yaml
  text: 'Give[a], and it will be given to you: a good measure—pressed down, shaken together, overflowing—they will give into your lap. For with the measure by which you measure[b], it will be measured back to you.'
translation:
  language: fr
  text: 'Donnez, et l’on vous donnera : une bonne mesure, tassée, secouée, débordante, on vous la donnera dans votre giron[a]. Car on vous mesurera en retour avec la mesure avec laquelle vous mesurez.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « dans votre sein ». Il s’agit probablement du repli formé sur le devant d’un vêtement ample, qui pouvait servir à recevoir et à transporter des denrées.
    reason: cultural_note
lexical_decisions:
- source_word: δίδοτε
  choice: Donnez
  rationale: L’impératif présent pluriel exprime une exhortation générale. « Donnez » est naturel en français et n’explicite pas excessivement la valeur aspectuelle.
- source_word: δοθήσεται ὑμῖν
  choice: l’on vous donnera
  rationale: Le futur passif grec garde l’agent implicite. La tournure française avec « l’on » demeure fluide et conserve cette indétermination.
- source_word: μέτρον καλὸν
  choice: une bonne mesure
  rationale: Cette expression maintient l’image concrète de la quantité mesurée sans ajouter la nuance interprétative de « généreuse ».
- source_word: πεπιεσμένον
  choice: tassée
  rationale: Dans l’image de denrées versées dans un récipient, « tassée » rend naturellement l’idée d’un contenu comprimé afin d’en mettre davantage.
- source_word: σεσαλευμένον
  choice: secouée
  rationale: Le participe évoque une mesure que l’on secoue pour que son contenu se mette en place. « Secouée » reste concise et concrète.
- source_word: ὑπερεκχυννόμενον
  choice: débordante
  rationale: Le participe décrit une quantité si abondante qu’elle déborde. « Débordante » restitue clairement cette image.
- source_word: δώσουσιν
  choice: on versera
  rationale: La troisième personne du pluriel a un sujet indéfini. Le pronom français « on » conserve cette indétermination ; « versera » s’accorde avec l’image d’une mesure de denrées reçue dans un vêtement.
- source_word: εἰς τὸν κόλπον ὑμῶν
  choice: dans le pan de votre vêtement
  rationale: κόλπος désigne ici vraisemblablement le repli antérieur d’un vêtement pouvant recevoir des marchandises. Cette formulation rend l’image culturelle plus clairement que le seul mot « giron ».
- source_word: ᾧ γὰρ μέτρῳ μετρεῖτε
  choice: Car … avec la mesure dont vous vous servez
  rationale: La formulation garde la métaphore de la mesure tout en évitant en français la répétition peu naturelle « la mesure avec laquelle vous mesurez ».
- source_word: ἀντιμετρηθήσεται ὑμῖν
  choice: on vous mesurera en retour
  rationale: « En retour » exprime la réciprocité portée par ἀντί, tandis que la construction indéfinie n’identifie pas l’agent.
theological_decisions:
- issue: Limiter le don à l’argent ou à l’aumône
  choice: Conserver une exhortation générale à donner et le principe de réciprocité
  alternative: Préciser qu’il s’agit exclusivement de dons matériels ou d’aumônes
  rationale: Le grec ne restreint pas explicitement le commandement au domaine financier, et le contexte proche parle aussi de miséricorde, de jugement et de pardon. La traduction ne tranche donc pas en faveur d’une lecture exclusivement matérielle.
- issue: Identifier l’agent de la récompense
  choice: Employer les tournures indéfinies « l’on » et « on »
  alternative: Nommer explicitement Dieu comme celui qui donne et mesure en retour
  rationale: Le texte laisse l’agent grammaticalement inexprimé ou indéfini. Nommer Dieu dans la traduction résoudrait une ambiguïté que le grec conserve.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme accumulatif de « tassée, secouée et débordante » préserve la vivacité de l’image. Les agents restent indéfinis conformément au grec, et aucune application exclusivement financière n’est ajoutée.
