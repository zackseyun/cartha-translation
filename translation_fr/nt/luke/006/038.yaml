  verdict: revise
  source_fidelity: 'La version conserve le sens général et l’indétermination de l’agent. Toutefois, « on versera » précise inutilement le mode du don pour δώσουσιν (« ils donneront »), et l’ordre de l’image est inversé : le grec présente d’abord la bonne mesure et ses qualifications, puis le fait qu’elle est donnée dans le κόλπος.'
  naturalness: Le français est globalement naturel. « GIRON » est un équivalent moderne, concis et idiomatique de κόλπος dans ce contexte; la note culturelle en précise le sens vestimentaire.
  terminology: « Donnez », « bonne mesure », « tassée », « secouée », « débordante » et « en retour » rendent correctement les termes et la réciprocité du grec. La répétition « la mesure avec laquelle vous mesurez » est acceptable ici, car elle maintient volontairement la métaphore et la formulation du texte source.
  issues:
