reference: Luke 6:29
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τῷ τύπτοντί σε ἐπὶ τὴν σιαγόνα πάρεχε καὶ τὴν ἄλλην, καὶ ἀπὸ τοῦ αἴροντός σου τὸ ἱμάτιον καὶ τὸν χιτῶνα μὴ κωλύσῃς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/029.yaml
  text: To the one who strikes you on the cheek[a], offer the other also; and from the one who takes away your cloak[c][b], do not withhold your tunic also.
translation:
  language: fr
  text: À celui qui te frappe sur la joue[a], présente-lui aussi l’autre joue ; et à celui qui t’enlève ton manteau[b], ne l’empêche pas de prendre aussi ta tunique.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « sur la mâchoire ».'
    reason: lexical_alternative
  - marker: b
    text: Le « manteau » (ἱμάτιον) est le vêtement extérieur ; la « tunique » (χιτών), le vêtement porté dessous.
    reason: cultural_note
lexical_decisions:
- source_word: τῷ τύπτοντί
  choice: À celui qui te frappe
  rationale: Le participe présent substantivé désigne de manière générale la personne qui accomplit l’action. Cette tournure est naturelle en français et garde l’adresse directe.
- source_word: ἐπὶ τὴν σιαγόνα
  choice: sur la joue
  rationale: σιαγών peut désigner la joue ou la mâchoire. Dans le contexte d’un coup porté au visage, « joue » est l’équivalent français le plus naturel ; une note conserve l’autre possibilité lexicale.
- source_word: πάρεχε
  choice: présente
  rationale: παρέχω signifie ici offrir, fournir ou présenter. « Présente » reste proche du verbe de Luc et évite d’importer le verbe « tendre/tourner » du passage parallèle de Matthieu.
- source_word: καὶ τὴν ἄλλην
  choice: aussi l’autre
  rationale: « L’autre » reprend implicitement la joue, tandis que « aussi » rend καί et maintient le parallélisme concis du grec.
- source_word: ἀπὸ τοῦ αἴροντός σου
  choice: à celui qui te prend
  rationale: Dans cette construction, le français idiomatique rattache l’interdiction au preneur par « à celui qui ». « Prend » rend clairement αἴρω dans le contexte de l’enlèvement d’un vêtement sans surinterpréter les circonstances.
- source_word: τὸ ἱμάτιον
  choice: ton manteau
  rationale: ἱμάτιον désigne le vêtement extérieur. « Manteau » est compréhensible en français courant et préserve la distinction avec la tunique portée dessous.
- source_word: τὸν χιτῶνα
  choice: ta tunique
  rationale: χιτών désigne le vêtement porté sous le manteau. « Tunique » est le terme français usuel qui respecte le cadre culturel ancien.
- source_word: μὴ κωλύσῃς
  choice: ne refuse pas
  rationale: κωλύω signifie empêcher, interdire ou faire obstacle. Dans ce contexte, « ne refuse pas » exprime naturellement l’ordre de ne pas s’opposer à la prise du second vêtement.
theological_decisions:
- issue: Harmonisation éventuelle avec la formulation mieux connue de Matthieu, « tends/tourne l’autre joue »
  choice: 'Conserver la formulation propre à Luc : « présente aussi l’autre »'
  alternative: « tends-lui aussi l’autre joue » ou « tourne aussi l’autre joue »
  rationale: Luc emploie πάρεχε, « présente/offre », et non un verbe signifiant « tourner ». La traduction reste ainsi ancrée dans le texte de Luc sans importer la formulation du passage parallèle.
- issue: Portée des impératifs concernant la non-riposte et les vêtements
  choice: Traduire directement les impératifs sans les atténuer ni leur ajouter d’exception
  alternative: Introduire dans le texte une qualification les présentant comme hyperboliques ou limités à certaines circonstances
  rationale: Le grec formule des ordres directs à la deuxième personne. La traduction doit en préserver la force et la tension éthique sans trancher les débats d’interprétation.
translation_notes:
  register: Français international moderne, direct et digne. La syntaxe parallèle reste proche du grec tout en étant naturelle. « Présente » préserve la formulation particulière de Luc ; « ne refuse pas » évite le calque peu idiomatique « n’empêche pas ». Tous les marqueurs de notes figurent dans le texte.
