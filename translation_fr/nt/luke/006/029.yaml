revisions:
- from: À celui qui te frappe sur la joue[a], présente aussi l’autre ; et à celui qui te prend ton manteau[b], ne refuse pas non plus ta tunique.
  to: À celui qui te frappe sur la joue[a], présente-lui aussi l’autre joue ; et à celui qui t’enlève ton manteau[b], ne l’empêche pas de prendre aussi ta tunique.
  rationale: La révision conserve les impératifs directs et la formulation propre à Luc (« présente »), tout en rendant plus exactement κωλύσῃς par « ne l’empêche pas ». L’explicitation de « l’autre joue » assure la clarté du français sans introduire le verbe traditionnel « tourner » ni interprétation doctrinale.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T10:52:41Z'
review_pass:
  verdict: revise
  source_fidelity: La première proposition rend bien τῷ τύπτοντί, σιαγών et l’impératif πάρεχε. Toutefois, « ne refuse pas » affaiblit légèrement μὴ κωλύσῃς (« n’empêche pas, ne fais pas obstacle »). La révision explicite l’action empêchée sans ajouter de qualification interprétative. « T’enlève ton manteau » rend naturellement αἴρω dans ce contexte de dépossession.
  naturalness: « Présente aussi l’autre » est compréhensible, mais l’ellipse de « joue » est moins naturelle et moins claire en français qu’en grec. « Présente-lui aussi l’autre joue » est direct, idiomatique et conserve le choix lexical distinct de Luc, sans harmoniser avec « tourne/tends ». « Ne l’empêche pas de prendre aussi ta tunique » est plus naturel et plus précis que « ne refuse pas non plus ta tunique ».
  terminology: « Joue », « manteau » et « tunique » sont appropriés en français international moderne. La note sur la mâchoire conserve correctement l’alternative de σιαγών; la note vestimentaire maintient la distinction entre ἱμάτιον et χιτών.
  issues:
  - severity: medium
    issue: « ne refuse pas » ne rend pas pleinement μὴ κωλύσῃς.
    rationale: κωλύω signifie empêcher, entraver ou faire obstacle. Dans ce contexte, la formulation française devrait exprimer l’absence d’empêchement plutôt qu’un simple refus de donner.
  - severity: low
    issue: L’antécédent de « l’autre » reste implicite dans le texte français.
    rationale: Le grec peut omettre σιαγόνα par ellipse, mais en français « l’autre joue » est plus clair et plus idiomatique. Cette explicitation ne modifie pas le sens.
  revised_text: À celui qui te frappe sur la joue[a], présente-lui aussi l’autre joue ; et à celui qui t’enlève ton manteau[b], ne l’empêche pas de prendre aussi ta tunique.
