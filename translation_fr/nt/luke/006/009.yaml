id: LUK.6.9
reference: Luke 6:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἶπεν ⸀δὲ ὁ Ἰησοῦς πρὸς αὐτούς· ⸀Ἐπερωτῶ ὑμᾶς, ⸀εἰ ἔξεστιν ⸂τῷ σαββάτῳ⸃ ἀγαθοποιῆσαι ἢ κακοποιῆσαι, ψυχὴν σῶσαι ἢ ⸀ἀπολέσαι;
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/009.yaml
  text: But Jesus said to them[a], “I ask you, is it lawful on the Sabbath to do good or to do harm[b], to save a life or to destroy it?”
translation:
  language: fr
  text: 'Mais Jésus leur dit : « Je vous le demande : est-il permis, le jour du sabbat, de faire du bien ou de faire du mal, de sauver une vie ou de la détruire[a] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sauver une âme ou la perdre ». Ici, « vie » est retenu parce que le contexte porte sur la préservation ou la destruction de la vie d’une personne.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Mais
  rationale: Marque naturellement la légère opposition et la transition narrative, alors que Jésus répond à l'attitude de ses adversaires.
- source_word: Ἐπερωτῶ ὑμᾶς
  choice: Je vous le demande
  rationale: Rend directement la question-défi adressée aux auditeurs dans un français naturel et soutenu sans être archaïque.
- source_word: εἰ ἔξεστιν
  choice: est-il permis
  rationale: Exprime ce qui est autorisé par la Loi ou l'usage dans cette controverse sur le sabbat, sans suggérer seulement la légalité civile moderne.
- source_word: τῷ σαββάτῳ
  choice: le jour du sabbat
  rationale: Formulation française idiomatique qui identifie clairement le jour concerné.
- source_word: ἀγαθοποιῆσαι
  choice: faire du bien
  rationale: Préserve l'opposition éthique et verbale avec κακοποιῆσαι.
- source_word: κακοποιῆσαι
  choice: faire du mal
  rationale: Conserve l'ambivalence entre commettre le mal et causer un tort, tout en correspondant au contraste concret du contexte.
- source_word: ψυχὴν
  choice: une vie
  rationale: Dans l'association avec sauver et détruire, ψυχή désigne ici concrètement la vie d'une personne plutôt qu'une âme immatérielle.
- source_word: σῶσαι
  choice: sauver
  rationale: Préserve le sens immédiat de préserver la vie ainsi que les résonances bibliques plus larges du verbe.
- source_word: ἀπολέσαι
  choice: la détruire
  rationale: Reprend explicitement « une vie » et maintient l'antithèse forte avec « sauver », sans réduire le verbe au seul sens de tuer.
theological_decisions:
- issue: Sens de ψυχή dans ψυχὴν σῶσαι ἢ ἀπολέσαι
  choice: « sauver une vie ou la détruire »
  alternative: « sauver une âme ou la perdre » ; « sauver une personne ou la faire périr »
  rationale: Le contexte immédiat de guérison un jour de sabbat concerne la préservation ou la destruction concrète d'une vie humaine. Ce choix évite d'imposer une conception particulière de l'âme, tandis que la note conserve l'autre rendu lexical possible.
- issue: Portée de κακοποιῆσαι
  choice: « faire du mal »
  alternative: « faire le mal » ; « nuire »
  rationale: « Faire du mal » maintient à la fois la dimension morale et l'idée d'une action nuisible, sans trancher artificiellement entre ces nuances.
translation_notes:
  register: Français international moderne, naturel et digne. La structure parallèle de la question grecque est conservée, ainsi que les oppositions « faire du bien / faire du mal » et « sauver / détruire ».
