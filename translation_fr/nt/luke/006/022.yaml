id: LUK.6.22
reference: Luke 6:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Μακάριοί ἐστε ὅταν μισήσωσιν ὑμᾶς οἱ ἄνθρωποι, καὶ ὅταν ἀφορίσωσιν ὑμᾶς καὶ ὀνειδίσωσιν καὶ ἐκβάλωσιν τὸ ὄνομα ὑμῶν ὡς πονηρὸν ἕνεκα τοῦ υἱοῦ τοῦ ἀνθρώπου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/022.yaml
  text: Blessed are you when people hate you[a], and when they exclude you and insult you and reject your name as evil because of the Son of Man.
translation:
  language: fr
  text: Heureux êtes-vous lorsque les gens vous haïssent, lorsqu’ils vous excluent, vous insultent et rejettent votre nom comme mauvais, à cause du Fils de l’homme.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’expression grecque peut aussi se comprendre ainsi : « vous dénoncent publiquement comme mauvais » ou « répudient votre réputation comme mauvaise ».'
    reason: La tournure « rejeter le nom » est idiomatique et peut renvoyer à la condamnation publique de la personne et de sa réputation.
lexical_decisions:
- source_word: Μακάριοί
  choice: Heureux
  rationale: « Heureux » est la formulation française consacrée des béatitudes et exprime une condition déclarée enviable, sans réduire le terme à une émotion passagère.
- source_word: ὅταν
  choice: lorsque
  rationale: Avec les subjonctifs grecs, le mot introduit une circonstance éventuelle ou répétable; « lorsque » convient au registre soutenu mais accessible des béatitudes.
- source_word: μισήσωσιν ὑμᾶς οἱ ἄνθρωποι
  choice: les gens vous haïssent
  rationale: οἱ ἄνθρωποι est générique; « les gens » est naturel et n’en restreint pas la portée aux hommes de sexe masculin.
- source_word: ἀφορίσωσιν ὑμᾶς
  choice: vous excluent
  rationale: Dans ce contexte de persécution sociale, le verbe évoque la mise à l’écart d’un groupe ou de la vie collective.
- source_word: ὀνειδίσωσιν
  choice: vous insultent
  rationale: Le choix rend clairement et dans un français actuel l’idée d’outrage ou de reproche injurieux.
- source_word: ἐκβάλωσιν τὸ ὄνομα ὑμῶν
  choice: rejettent votre nom
  rationale: Littéralement, l’expression parle de « jeter dehors » le nom. « Rejettent votre nom » conserve l’image du nom publiquement répudié tout en restant idiomatique en français.
- source_word: ὡς πονηρὸν
  choice: comme mauvais
  rationale: Cette formulation conserve la qualification morale portée sur « votre nom », sans préciser indûment s’il s’agit de méchanceté, de corruption ou de danger social.
- source_word: ἕνεκα
  choice: à cause de
  rationale: La préposition indique ici le motif de l’hostilité subie.
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: du Fils de l’homme
  rationale: Le titre traditionnel préserve la formulation grecque, son emploi évangélique et ses résonances scripturaires.
theological_decisions:
- issue: Sens de ἐκβάλωσιν τὸ ὄνομα ὑμῶν ὡς πονηρόν
  choice: « rejettent votre nom comme mauvais » dans le texte, avec une note explicative
  alternative: « vous dénoncent comme mauvais »; « bannissent votre nom comme mauvais »; « rejettent votre réputation comme mauvaise »
  rationale: Le grec présente une image inhabituelle qui peut désigner la répudiation publique des disciples ou de leur réputation. La traduction conserve « nom » et la qualification morale sans enfermer le passage dans un mécanisme social précis.
- issue: Portée générique de οἱ ἄνθρωποι
  choice: « les gens »
  alternative: « les hommes »; « les êtres humains »
  rationale: Le référent est la société humaine en général et non les seuls individus masculins.
- issue: Titre τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: « le Fils de l’homme »
  alternative: « l’Humain »
  rationale: La traduction traditionnelle demeure intelligible et conserve les échos intertextuels ainsi que la fonction de ce titre dans les Évangiles.
translation_notes:
  register: Français international moderne, digne et accessible. La cadence coordonnée du grec est resserrée naturellement en français. « Heureux êtes-vous » maintient le ton solennel propre aux béatitudes; la note conserve l’ambiguïté de l’expression concernant le nom et la réputation.
