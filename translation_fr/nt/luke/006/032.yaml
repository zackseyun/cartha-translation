id: LUK.6.32
reference: Luke 6:32
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ εἰ ἀγαπᾶτε τοὺς ἀγαπῶντας ὑμᾶς, ποία ὑμῖν χάρις ἐστίν; καὶ γὰρ οἱ ἁμαρτωλοὶ τοὺς ἀγαπῶντας αὐτοὺς ἀγαπῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/032.yaml
  text: And if you love those who love you[a], what credit is that to you? For even sinners love those who love them.
translation:
  language: fr
  text: Si vous aimez ceux qui vous aiment, quelle reconnaissance cela vous vaut-il[a] ? Car même les pécheurs aiment ceux qui les aiment.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « quel mérite cela a-t-il pour vous ? » Le mot grec peut aussi signifier « grâce » ou « faveur » ; ici, il désigne ce qu’une conduite a de louable.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγαπᾶτε / ἀγαπῶντας / ἀγαπῶσιν
  choice: aimez / aiment
  rationale: La répétition du verbe « aimer » dans les trois occurrences préserve le lien lexical et la force rhétorique du grec.
- source_word: ποία
  choice: quel
  rationale: Avec « mérite », « quel » formule naturellement en français la question portant sur la valeur de cette conduite.
- source_word: χάρις
  choice: mérite
  rationale: Dans ce contexte, le terme désigne ce qu'une conduite a de louable ou de digne de considération, plutôt que la grâce au sens théologique.
- source_word: ἁμαρτωλοὶ
  choice: les pécheurs
  rationale: Cette formulation directe et usuelle conserve la catégorie morale exprimée par l'adjectif substantivé grec.
- source_word: καὶ γὰρ
  choice: Même
  rationale: Dans la seconde phrase, « même » rend l'accent inclusif de καί; le rapport explicatif marqué par γάρ demeure clair par l'enchaînement rhétorique.
- source_word: ὑμῖν
  choice: avez-vous
  rationale: Le datif est rendu idiomatiquement dans la tournure française « quel mérite avez-vous ? ».
theological_decisions:
- issue: Sens de χάρις dans cette parole de Jésus
  choice: « mérite », au sens de ce qui est louable
  alternative: « grâce », « reconnaissance » ou « faveur »
  rationale: Le contexte oppose une conduite ordinaire à une conduite véritablement remarquable. « Grâce » risquerait d'introduire ici un sens sotériologique qui n'est pas nécessaire, tandis que « mérite » exprime naturellement la valeur louable visée sans en faire une doctrine du mérite devant Dieu.
translation_notes:
  register: Français international moderne, naturel et digne. La répétition de « aimer » est conservée. « Quel mérite avez-vous ? » privilégie l'idiome français tout en maintenant la question rhétorique et sans transformer le verset en affirmation doctrinale sur le mérite.
