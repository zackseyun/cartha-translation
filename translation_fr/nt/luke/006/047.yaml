id: LUK.6.47
reference: Luke 6:47
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: πᾶς ὁ ἐρχόμενος πρός με καὶ ἀκούων μου τῶν λόγων καὶ ποιῶν αὐτούς, ὑποδείξω ὑμῖν τίνι ἐστὶν ὅμοιος·
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/047.yaml
  text: Everyone who comes to me and hears my words and does them—I will show you what he is like:[a][b]
translation:
  language: fr
  text: 'Toute personne qui vient à moi, qui entend mes paroles et les met en pratique — je vous montrerai à qui elle ressemble[a] :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec emploie ici des formes masculines singulières avec un sens général. En français, « elle » reprend le nom grammaticalement féminin « personne » et désigne tout individu, homme ou femme.
    reason: cultural_note
lexical_decisions:
- source_word: πᾶς ὁ ἐρχόμενος
  choice: Toute personne qui vient
  rationale: La construction désigne de manière générale quiconque vient. « Toute personne qui » exprime naturellement en français moderne la portée universelle du grec.
- source_word: ἐρχόμενος πρός με
  choice: vient à moi
  rationale: Le participe présent a ici une valeur générale, et πρός avec l’accusatif indique le mouvement vers Jésus.
- source_word: ἀκούων μου τῶν λόγων
  choice: qui entend mes paroles
  rationale: « Entend » reste proche du verbe grec et maintient le parallélisme avec l’action qui suit, sans ajouter explicitement l’idée d’une écoute attentive.
- source_word: λόγων
  choice: paroles
  rationale: Dans ce contexte, le terme désigne les enseignements prononcés par Jésus. « Paroles » est direct, naturel et moins stylisé que « propos » ou « déclarations ».
- source_word: ποιῶν αὐτούς
  choice: les met en pratique
  rationale: Littéralement, le grec dit « les fait ». En français, « mettre des paroles en pratique » rend clairement et naturellement l’idée de leur obéir sans réduire le sens à une simple compréhension.
- source_word: ὑποδείξω ὑμῖν
  choice: je vous montrerai
  rationale: Le futur introduit la comparaison que Jésus va développer. « Montrer » est l’équivalent direct et idiomatique.
- source_word: τίνι ἐστὶν ὅμοιος
  choice: à qui elle ressemble
  rationale: Le grec demande littéralement « à qui [il] est semblable ». Contrairement à l’anglais, cette tournure est naturelle en français et conserve la forme personnelle de la comparaison.
theological_decisions:
- issue: Genre grammatical de la personne décrite
  choice: Employer « toute personne » puis le pronom grammaticalement féminin « elle »
  alternative: Employer « quiconque » puis « il », ou reformuler pour éviter tout pronom
  rationale: Le masculin singulier grec a une portée générique. En français, « personne » est un nom féminin quel que soit le sexe de l’individu concerné ; « elle » reprend donc grammaticalement ce nom sans limiter l’énoncé aux femmes. La note préserve la différence formelle avec le grec.
translation_notes:
  register: Français international moderne, clair et digne. La reprise de « qui » souligne les trois éléments — venir, entendre et mettre en pratique — tandis que le tiret conserve la mise en relief initiale. Le deux-points rend la ponctuation grecque et introduit la comparaison développée au verset suivant.
