id: LUK.6.17
reference: Luke 6:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ καταβὰς μετ’ αὐτῶν ἔστη ἐπὶ τόπου πεδινοῦ, καὶ ὄχλος ⸀πολὺς μαθητῶν αὐτοῦ, καὶ πλῆθος πολὺ τοῦ λαοῦ ἀπὸ πάσης τῆς Ἰουδαίας καὶ Ἰερουσαλὴμ καὶ τῆς παραλίου Τύρου καὶ Σιδῶνος,
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/017.yaml
  text: And coming down with them[a], he stood on a level place, with a large crowd of his disciples and a great multitude of the people from all Judea and Jerusalem and the coastal region of Tyre and Sidon,
translation:
  language: fr
  text: Après être descendu avec eux, il se tint sur un terrain plat,[a] avec une grande foule de ses disciples et une grande foule de gens venus de toute la Judée, de Jérusalem et de la région côtière de Tyr et de Sidon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans une plaine ». Le grec dit littéralement « sur un lieu plat ».
    reason: lexical_alternative
lexical_decisions:
- source_word: καταβὰς
  choice: il descendit
  rationale: Le participe aoriste marque le mouvement qui précède le verbe principal. Une proposition coordonnée est plus naturelle en français tout en conservant la succession narrative.
- source_word: ἔστη
  choice: s’arrêta
  rationale: Dans ce contexte de déplacement, ἵστημι indique qu’il prend position et demeure à cet endroit. « S’arrêta » rend naturellement le passage du mouvement à l’immobilité.
- source_word: ἐπὶ τόπου πεδινοῦ
  choice: sur un endroit plat
  rationale: Cette formulation rend directement τόπος (« endroit, lieu ») et πεδινός (« plat, de plaine ») sans imposer l’idée d’une vaste plaine.
- source_word: ὄχλος πολὺς μαθητῶν αὐτοῦ
  choice: une grande foule de ses disciples
  rationale: ὄχλος désigne une foule, πολὺς sa grande taille, et le génitif indique que cette foule est composée de disciples de Jésus.
- source_word: πλῆθος πολὺ τοῦ λαοῦ
  choice: une multitude de gens
  rationale: πλῆθος πολὺ souligne le très grand nombre. Ici, « de gens » exprime naturellement en français la population plus large distinguée des disciples, sans la connotation institutionnelle possible de « du peuple ».
- source_word: ἀπὸ πάσης τῆς Ἰουδαίας
  choice: venus de toute la Judée
  rationale: Le participe implicite « venus » clarifie naturellement en français que l’indication d’origine se rapporte aux gens; πάσης exprime l’ensemble de la région.
- source_word: τῆς παραλίου Τύρου καὶ Σιδῶνος
  choice: de la région côtière de Tyr et de Sidon
  rationale: παράλιος désigne le territoire situé au bord de la mer; « région côtière » communique clairement le sens géographique.
theological_decisions:
- issue: Formulation topographique du cadre du discours
  choice: sur un endroit plat
  alternative: dans une plaine
  rationale: Le texte décrit littéralement un lieu plat sans préciser qu’il s’agit d’une vaste plaine. La traduction conserve cette ouverture et ne cherche ni à harmoniser ni à opposer artificiellement le récit à celui de Matthieu.
translation_notes:
  register: Français international moderne, narratif et digne. La phrase reste accessible, avec une ponctuation qui distingue les disciples de la population venue des différentes régions.
