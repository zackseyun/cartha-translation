    issue: Formulation du regard initiale maladroite
    rationale: Dans « les avoir tous regardés autour de lui », le complément « autour de lui » se rattache de façon ambiguë à « regardés » ou aux personnes regardées. La tournure ne correspond pas à un français naturel pour περιβλεψάμενος πάντας αὐτούς.
  - severity: medium
    issue: Note de bas de page logiquement incohérente avec le texte principal
    rationale: Le texte principal dit déjà « sa main fut rétablie », mais la note affirme que le grec dit « plus littéralement » qu’elle fut « rétablie ». La note doit présenter « guérie » comme variante et expliquer que « rétablie » traduit le sens de restauration du grec.
  revised_text: 'Après avoir promené son regard sur eux tous, il dit à l’homme : « Tends la main. » Celui-ci le fit, et sa main fut rétablie.[a]'
  revised_footnotes:
