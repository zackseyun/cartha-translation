source:
  edition: SBLGNT
  text: καὶ περιβλεψάμενος πάντας αὐτοὺς εἶπεν αὐτῷ· Ἔκτεινον τὴν χεῖρά σου· ὁ δὲ ἐποίησεν, καὶ ἀπεκατεστάθη ἡ χεὶρ ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/010.yaml
  text: And after looking around at them all[a], he said to him, “Stretch out your hand.” And he did so, and his hand was restored.
translation:
  language: fr
  text: 'Après avoir promené son regard sur eux tous, il dit à l’homme : « Tends la main. » Celui-ci le fit, et sa main fut rétablie.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sa main fut guérie ». Le verbe grec traduit par « fut rétablie » souligne le retour de la main à son état normal.
    reason: lexical_alternative
lexical_decisions:
- source_word: περιβλεψάμενος πάντας αὐτούς
  choice: Après les avoir tous regardés autour de lui
  rationale: Le participe aoriste marque une action antérieure à la parole de Jésus, et περιβλέπομαι évoque un regard porté tout autour. Cette formulation naturelle conserve aussi l’insistance de πάντας sur la totalité des personnes présentes.
- source_word: εἶπεν αὐτῷ
  choice: il dit à l’homme
  rationale: Le grec emploie un pronom masculin renvoyant à l’homme mentionné dans le contexte. En français, « à l’homme » évite l’ambiguïté entre plusieurs pronoms tout en restant fidèle au référent.
- source_word: Ἔκτεινον τὴν χεῖρά σου
  choice: Tends la main
  rationale: « Tendre la main » est l’expression française courante et précise pour l’impératif Ἔκτεινον avec χείρ. L’article défini devant une partie du corps est idiomatique en français.
- source_word: ὁ δὲ ἐποίησεν
  choice: Celui-ci le fit
  rationale: Le sujet est l’homme auquel Jésus vient de parler. « Celui-ci » clarifie le changement de sujet, tandis que « le fit » reprend sans l’alourdir l’action commandée.
- source_word: ἀπεκατεστάθη ἡ χεὶρ αὐτοῦ
  choice: sa main fut rétablie
  rationale: ἀποκαθίστημι exprime le retour à un état normal ou antérieur. « Fut rétablie » préserve cette nuance de restauration plutôt que de la remplacer directement par le terme plus interprétatif « guérie ».
theological_decisions:
- issue: Nature du miracle exprimée par ἀπεκατεστάθη
  choice: sa main fut rétablie
  alternative: sa main fut guérie
  rationale: Le choix principal conserve le langage de restauration du verbe grec et laisse le contexte manifester qu’il s’agit d’une guérison, sans substituer un vocabulaire médical plus explicite.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe narrative reste fluide; « Celui-ci » clarifie les sujets successifs, et le discours direct demeure bref et énergique.
