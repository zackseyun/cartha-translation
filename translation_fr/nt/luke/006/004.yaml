reference: Luke 6:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸀ὡς εἰσῆλθεν εἰς τὸν οἶκον τοῦ θεοῦ καὶ τοὺς ἄρτους τῆς προθέσεως ⸀λαβὼν ἔφαγεν καὶ ⸀ἔδωκεν τοῖς μετ’ αὐτοῦ, οὓς οὐκ ἔξεστιν φαγεῖν εἰ μὴ μόνους τοὺς ἱερεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/004.yaml
  text: how he entered into the house of God[a], and took and ate the bread of the Presence, and gave some to those with him—which it is not lawful to eat except for the priests alone?
translation:
  language: fr
  text: comment il entra dans la maison de Dieu, prit les pains de la Présence[a] — qu’il n’est permis de manger qu’aux prêtres seuls —, en mangea et en donna à ceux qui étaient avec lui ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les pains consacrés » ; traditionnellement, « les pains de proposition ».
    reason: Alternative lexicale pour l’expression cultuelle ἄρτους τῆς προθέσεως.
lexical_decisions:
- source_word: ὡς
  choice: comment
  rationale: Dans cette question indirecte rappelant ce que David a fait, « comment » introduit naturellement le récit des actes.
- source_word: εἰσῆλθεν εἰς τὸν οἶκον τοῦ θεοῦ
  choice: il entra dans la maison de Dieu
  rationale: « Maison de Dieu » préserve οἶκος et l’écho du récit scripturaire, sans préciser « temple » au-delà du texte.
- source_word: τοὺς ἄρτους τῆς προθέσεως
  choice: les pains de la Présence
  rationale: Cette expression conserve l’idée cultuelle des pains placés devant Dieu; le pluriel français reflète ἄρτους.
- source_word: λαβὼν ἔφαγεν
  choice: prit … en mangea
  rationale: La coordination rend naturellement la succession du participe et du verbe principal; « en » reprend explicitement les pains.
- source_word: ἔδωκεν τοῖς μετ’ αὐτοῦ
  choice: en donna à ceux qui étaient avec lui
  rationale: Cette formulation suit le grec sans ajouter « aussi » ni « une partie »; « ceux qui étaient avec lui » demeure transparent.
- source_word: οὐκ ἔξεστιν φαγεῖν
  choice: il n’est permis d’en manger
  rationale: « Permis » exprime ici l’autorisation légale et cultuelle dans un français courant, tandis que « en » rattache clairement l’infinitif aux pains.
- source_word: εἰ μὴ μόνους τοὺς ἱερεῖς
  choice: qu’aux prêtres seuls
  rationale: La tournure restrictive « ne… que » avec « seuls » préserve l’exclusivité emphatique du grec.
theological_decisions:
- issue: Restriction cultuelle et légale concernant les pains sacrés
  choice: « il n’est permis d’en manger qu’aux prêtres seuls »
  alternative: « seuls les prêtres ont le droit d’en manger »
  rationale: La formulation retenue conserve l’impersonnel ἔξεστιν et présente la restriction comme une permission relevant de la Loi, sans transformer le texte en commentaire explicatif.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple convient à la citation narrative enchâssée. La phrase reste liée au contexte précédent et conserve donc sa forme interrogative finale.
