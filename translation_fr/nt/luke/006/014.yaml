  text: Simon, qu’il nomma aussi Pierre, André son frère, Jacques et Jean, Philippe et Barthélemy,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Σίμωνα
  choice: Simon
  rationale: Forme française traditionnelle et courante du nom de cet apôtre.
- source_word: ὃν καὶ ὠνόμασεν Πέτρον
  choice: qu’il nomma aussi Pierre
  rationale: « Nomma » exprime naturellement l’acte d’attribuer un nom, et « aussi » rend καί sans alourdir la phrase.
- source_word: Πέτρον
  choice: Pierre
  rationale: Forme française consacrée de Πέτρος dans le Nouveau Testament.
- source_word: Ἀνδρέαν
  choice: André
  rationale: Forme française traditionnelle de Ἀνδρέας.
- source_word: τὸν ἀδελφὸν αὐτοῦ
  choice: son frère
  rationale: Expression française naturelle qui indique ici le lien fraternel d’André avec Simon.
- source_word: Ἰάκωβον
  choice: Jacques
  rationale: Forme française traditionnelle de Ἰάκωβος pour cet apôtre.
- source_word: Ἰωάννην
  choice: Jean
  rationale: Forme française traditionnelle de Ἰωάννης.
- source_word: Φίλιππον
  choice: Philippe
  rationale: Forme française traditionnelle de Φίλιππος.
- source_word: Βαρθολομαῖον
  choice: Barthélemy
  rationale: Forme française traditionnelle de Βαρθολομαῖος.
- source_word: καὶ
  choice: et, ou juxtaposition dans la liste
  rationale: Καί coordonne les noms. Le français moderne peut omettre certains « et » répétés sans perdre les relations syntaxiques ni le rythme de l’énumération.
