source:
  edition: SBLGNT
  text: χάρητε ἐν ἐκείνῃ τῇ ἡμέρᾳ καὶ σκιρτήσατε, ἰδοὺ γὰρ ὁ μισθὸς ὑμῶν πολὺς ἐν τῷ οὐρανῷ· κατὰ ⸂τὰ αὐτὰ⸃ γὰρ ἐποίουν τοῖς προφήταις οἱ πατέρες αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/023.yaml
  text: Rejoice in that day and leap for joy[a], for behold, your reward is great in heaven[b]; for in the same way their fathers used to do to the prophets.
translation:
  language: fr
  text: Réjouissez-vous ce jour-là et bondissez de joie[a], car voici que votre récompense est grande dans le ciel ; en effet, leurs pères agissaient de la même manière envers les prophètes[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « soyez dans la joie ce jour-là et bondissez ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « car leurs pères faisaient les mêmes choses aux prophètes ». Ici, « leurs pères » peut désigner leurs ancêtres.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρητε
  choice: Réjouissez-vous
  rationale: L’impératif aoriste pluriel appelle à une joie active. « Réjouissez-vous » est direct, naturel et digne.
- source_word: σκιρτήσατε
  choice: bondissez de joie
  rationale: Le verbe évoque un mouvement physique exubérant. Cette expression française rend à la fois le bond et la joie qui le motive.
- source_word: ἰδοὺ
  choice: voyez
  rationale: Ce terme attire l’attention sur la raison qui suit. « Voyez » conserve cette fonction discursive dans un français actuel, sans recourir à l’archaïque « voici » employé isolément.
- source_word: μισθὸς
  choice: récompense
  rationale: Dans ce contexte, il s’agit d’une rétribution positive, non d’un salaire au sens économique étroit.
- source_word: πολὺς
  choice: grande
  rationale: L’adjectif qualifie la récompense et exprime son importance ; « grande » est l’association naturelle en français.
- source_word: ἐν τῷ οὐρανῷ
  choice: dans le ciel
  rationale: Le singulier désigne ici la sphère céleste. « Dans le ciel » respecte la formulation sans ajouter d’explication théologique.
- source_word: κατὰ τὰ αὐτά
  choice: de la même manière
  rationale: Cette locution exprime la similitude de conduite et se rend naturellement ainsi en français.
- source_word: ἐποίουν
  choice: agissaient
  rationale: L’imparfait grec peut décrire une conduite répétée ou habituelle. « Agissaient » conserve l’expression relativement ouverte du grec sans préciser davantage la nature du traitement.
- source_word: τοῖς προφήταις
  choice: envers les prophètes
  rationale: Le datif associé à ποιέω est elliptique. « Envers » produit un français naturel tout en laissant le contexte déterminer le caractère hostile de la conduite.
- source_word: οἱ πατέρες αὐτῶν
  choice: leurs pères
  rationale: La traduction littérale conserve l’image familiale et la portée intergénérationnelle de l’accusation ; le sens d’« ancêtres » est signalé en note.
theological_decisions:
- issue: Nature et situation de la récompense promise
  choice: votre récompense est grande dans le ciel
  alternative: votre récompense auprès de Dieu dans le ciel est grande
  rationale: Le texte situe la récompense « dans le ciel » sans préciser davantage son rapport à Dieu ni le moment de sa réception. La traduction préserve cette retenue et la tension eschatologique.
- issue: Référent de « leurs pères »
  choice: leurs pères
  alternative: leurs ancêtres
  rationale: Il s’agit vraisemblablement des ancêtres de ceux qui rejettent les disciples, mis en parallèle avec les persécuteurs des prophètes. Le terme familial est conservé sans atténuer ni développer l’accusation.
- issue: Nature des actes commis envers les prophètes
  choice: agissaient de la même manière envers les prophètes
  alternative: traitaient les prophètes de la même manière
  rationale: La formulation grecque est elliptique et dépend du contexte précédent. « Agissaient envers » préserve cette relative indétermination plutôt que de préciser explicitement le traitement subi.
translation_notes:
  register: Français international moderne, clair et digne. « Bondissez de joie » garde l’énergie concrète du grec ; « voyez » conserve l’appel à l’attention. La dernière proposition reste volontairement assez proche de l’expression elliptique de la source.
