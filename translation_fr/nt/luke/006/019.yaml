id: LUK.6.19
reference: Luke 6:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ πᾶς ὁ ὄχλος ⸀ἐζήτουν ἅπτεσθαι αὐτοῦ, ὅτι δύναμις παρ’ αὐτοῦ ἐξήρχετο καὶ ἰᾶτο πάντας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/019.yaml
  text: And the whole crowd was trying to touch him[a], because power was coming out from him and healing them all.
translation:
  language: fr
  text: Toute la foule cherchait à le toucher, car une puissance sortait de lui[a] et les guérissait tous.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « émanait de lui ».'
    reason: Alternative lexicale pour παρ’ αὐτοῦ ἐξήρχετο ; « émanait » exprime plus explicitement la provenance, tandis que « sortait » conserve davantage l’image concrète du grec.
lexical_decisions:
- source_word: πᾶς ὁ ὄχλος
  choice: toute la foule
  rationale: Cette formulation française naturelle conserve la portée collective de πᾶς avec le nom singulier ὄχλος.
- source_word: ἐζήτουν
  choice: cherchait
  rationale: L’imparfait exprime l’action continue ou répétée. En français, l’accord au singulier avec « toute la foule » est naturel, malgré l’accord selon le sens au pluriel dans le grec.
- source_word: ἅπτεσθαι
  choice: à le toucher
  rationale: Dans ce contexte de guérison, « toucher » rend directement et naturellement l’idée de contact exprimée par ἅπτεσθαι.
- source_word: δύναμις
  choice: une puissance
  rationale: « Puissance » préserve le terme grec sans ajouter l’adjectif interprétatif « miraculeuse » ; l’article indéfini convient à l’absence d’article en grec et à l’usage français.
- source_word: παρ’ αὐτοῦ ἐξήρχετο
  choice: sortait de lui
  rationale: Cette expression conserve l’image concrète d’une puissance qui provient de Jésus ainsi que l’aspect continu de l’imparfait.
- source_word: ἰᾶτο πάντας
  choice: les guérissait tous
  rationale: L’imparfait « guérissait » rend l’action en cours, tandis que « tous » conserve la portée universelle de πάντας parmi les personnes présentes.
theological_decisions:
- issue: Nature de la δύναμις provenant de Jésus
  choice: « une puissance sortait de lui »
  alternative: « une puissance miraculeuse émanait de lui »
  rationale: Le texte présente Jésus comme la source d’une puissance efficace qui guérit. La traduction maintient cette affirmation sans préciser davantage la nature de cette puissance ni ajouter « miraculeuse », absent du grec.
- issue: Sujet implicite de ἰᾶτο
  choice: La puissance est présentée comme ce qui « les guérissait tous »
  alternative: 'Rendre Jésus explicitement sujet : « il les guérissait tous »'
  rationale: La syntaxe grecque relie naturellement δύναμις aux deux verbes, ἐξήρχετο et ἰᾶτο. La traduction conserve cette structure et évite de substituer un sujet explicite non exprimé.
translation_notes:
  register: Français international moderne, clair et digne. La phrase reste proche de la structure grecque tout en employant un tour naturel. Le marqueur de note est placé après l’expression à laquelle l’alternative se rapporte.
