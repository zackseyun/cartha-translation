  text: Ἐγένετο ⸀δὲ ἐν ἑτέρῳ σαββάτῳ εἰσελθεῖν αὐτὸν εἰς τὴν συναγωγὴν καὶ διδάσκειν· καὶ ἦν ⸂ἄνθρωπος ἐκεῖ⸃ καὶ ἡ χεὶρ αὐτοῦ ἡ δεξιὰ ἦν ξηρά·
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/006.yaml
  text: It happened on another Sabbath that he entered the synagogue and was teaching[a]. And a man was there whose right hand was withered.
translation:
  language: fr
  text: Un autre sabbat, il entra dans la synagogue et enseignait. Il y avait là un homme dont la main droite était desséchée[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « flétrie ». Le mot grec désigne quelque chose de sec ou de flétri ; dans ce contexte, il décrit la main droite handicapée de cet homme.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ ἐν ἑτέρῳ σαββάτῳ
  choice: Un autre sabbat
  rationale: Cette formulation française naturelle situe le nouvel épisode tout en rendant ἑτέρῳ; la légère transition narrative portée par Ἐγένετο δὲ n’exige pas une expression lourde comme « il arriva que ».
- source_word: εἰσελθεῖν αὐτὸν εἰς τὴν συναγωγὴν
  choice: il entra dans la synagogue
  rationale: L’infinitif dépendant de Ἐγένετο est rendu naturellement par un verbe conjugué en français.
- source_word: καὶ διδάσκειν
  choice: et se mit à enseigner
  rationale: Cette tournure s’intègre au récit et présente l’enseignement comme l’activité engagée dans la synagogue, sans le réduire à un acte ponctuel achevé.
- source_word: ἄνθρωπος ἐκεῖ
  choice: Il y avait là un homme
  rationale: Rendu idiomatique de la proposition existentielle, en conservant la référence explicite à un homme.
- source_word: ἡ χεὶρ αὐτοῦ ἡ δεξιὰ
  choice: dont la main droite
  rationale: La proposition relative est naturelle en français et conserve la précision selon laquelle il s’agissait de la main droite.
- source_word: ξηρά
  choice: desséchée
  rationale: Le terme conserve l’image grecque d’un membre sec ou flétri sans préciser médicalement une affection que le texte ne nomme pas.
theological_decisions: []
