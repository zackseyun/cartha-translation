id: LUK.6.21
reference: Luke 6:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: μακάριοι οἱ πεινῶντες νῦν, ὅτι χορτασθήσεσθε. μακάριοι οἱ κλαίοντες νῦν, ὅτι γελάσετε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/021.yaml
  text: Blessed are you who are hungry now[a], because you will be filled. Blessed are you who weep now[b], because you will laugh.
translation:
  language: fr
  text: Heureux, vous qui avez faim maintenant[a], car vous serez rassasiés[b] ! Heureux, vous qui pleurez maintenant, car vous rirez !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Heureux ceux qui ont faim maintenant… Heureux ceux qui pleurent maintenant. » Le grec emploie des participes précédés de l’article, mais le contexte immédiat et les verbes à la deuxième personne du pluriel appuient l’adresse directe.'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « vous serez comblés ». Le verbe désigne d’abord le fait d’être nourri jusqu’à satiété et peut, par extension, exprimer une pleine satisfaction.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριοι
  choice: Heureux
  rationale: « Heureux » est la formule française naturelle des béatitudes. Elle exprime une condition déclarée enviable et bénie, sans la réduire à un simple sentiment passager.
- source_word: οἱ πεινῶντες
  choice: vous qui avez faim
  rationale: Le grec emploie un participe substantivé, littéralement « ceux qui ont faim », mais les verbes à la deuxième personne du pluriel et le contexte immédiat indiquent une adresse directe.
- source_word: νῦν
  choice: maintenant
  rationale: Ce terme maintient clairement le contraste temporel entre la détresse présente et le renversement promis.
- source_word: χορτασθήσεσθε
  choice: vous serez rassasiés
  rationale: Le futur passif évoque concrètement le fait d’être nourri jusqu’à satiété, tout en pouvant suggérer plus largement une pleine satisfaction. « Rassasiés » conserve cette image sans préciser la nature ni le moment de son accomplissement.
- source_word: οἱ κλαίοντες
  choice: vous qui pleurez
  rationale: La formulation directe correspond au contexte et à la deuxième personne du pluriel. « Pleurez » garde le sens concret de κλαίω sans le limiter au deuil.
- source_word: γελάσετε
  choice: vous rirez
  rationale: La traduction littérale préserve l’image vive du renversement entre les pleurs présents et le rire futur, sans l’atténuer en « vous vous réjouirez ».
theological_decisions:
- issue: Adresse directe ou formulation générale à la troisième personne
  choice: « vous qui avez faim » et « vous qui pleurez »
  alternative: « ceux qui ont faim » et « ceux qui pleurent »
  rationale: Bien que les sujets grecs soient des participes substantivés, les promesses sont à la deuxième personne du pluriel et s’inscrivent dans une adresse directe aux disciples. La note conserve la possibilité d’une formulation plus formelle à la troisième personne.
- issue: Nature et moment du renversement promis
  choice: Conserver les images concrètes « rassasiés » et « rirez » sans en préciser l’accomplissement
  alternative: Expliciter une satisfaction spirituelle ou un accomplissement exclusivement eschatologique
  rationale: Le verset affirme un renversement futur, mais n’en définit ici ni le mode précis ni le calendrier. La traduction laisse cette tension intacte.
translation_notes:
  register: Français international moderne, clair et digne. La tournure « Heureux, vous qui… » conserve la cadence solennelle des béatitudes tout en restant naturelle. Les points d’exclamation rendent la force déclarative des deux paroles sans ajouter d’interprétation doctrinale.
