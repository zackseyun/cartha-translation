id: LUK.6.39
reference: Luke 6:39
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Εἶπεν δὲ ⸀καὶ παραβολὴν αὐτοῖς· Μήτι δύναται τυφλὸς τυφλὸν ὁδηγεῖν; οὐχὶ ἀμφότεροι εἰς βόθυνον ⸀ἐμπεσοῦνται;
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/039.yaml
  text: 'And he also told them a parable: “Can a blind man guide a blind man? Will not both fall into a pit?”[a][b]'
translation:
  language: fr
  text: 'Il leur dit aussi une parabole : « Un aveugle peut-il guider un aveugle ? Ne tomberont-ils pas tous les deux dans une fosse ? »[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans un fossé ».
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: aussi
  rationale: Après δὲ, « aussi » conserve naturellement la valeur additive du grec.
- source_word: παραβολὴν
  choice: une parabole
  rationale: Terme consacré dans les Évangiles pour une parole imagée ou une comparaison illustrative.
- source_word: Μήτι δύναται
  choice: peut-il
  rationale: La question rhétorique attend une réponse négative ; cette formulation française la rend sans l'alourdir.
- source_word: τυφλὸς ... τυφλὸν
  choice: un aveugle ... un aveugle
  rationale: L'adjectif substantivé masculin singulier a ici une portée générique et proverbiale ; le français emploie naturellement « un aveugle ».
- source_word: ὁδηγεῖν
  choice: guider
  rationale: « Guider » restitue précisément l'image d'une personne qui en dirige une autre sur son chemin.
- source_word: οὐχὶ ἀμφότεροι
  choice: ne tomberont-ils pas tous les deux
  rationale: La tournure interrogative négative conserve l'attente d'une réponse affirmative, et « tous les deux » rend explicitement ἀμφότεροι.
- source_word: βόθυνον
  choice: fosse
  rationale: βόθυνος peut désigner une fosse ou un fossé ; « fosse » est ici général, concret et naturel.
- source_word: ἐμπεσοῦνται
  choice: tomberont ... dans
  rationale: Le futur grec se rend naturellement par le futur simple français, avec « dans » pour εἰς.
theological_decisions:
- issue: Portée du masculin substantivé τυφλός
  choice: un aveugle ... un aveugle
  alternative: une personne aveugle ... une personne aveugle
  rationale: Le grec emploie deux formes masculines singulières avec une portée représentative. La formulation française retenue conserve cette forme proverbiale sans limiter l'application du propos aux hommes.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe conserve les deux questions rhétoriques et leur force proverbiale. « Il leur dit aussi » est plus naturel en français que le calque « Et il leur dit aussi ».
