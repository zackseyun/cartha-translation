id: LUK.6.33
reference: Luke 6:33
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸀καὶ ἐὰν ἀγαθοποιῆτε τοὺς ἀγαθοποιοῦντας ὑμᾶς, ποία ὑμῖν χάρις ἐστίν; ⸁καὶ οἱ ἁμαρτωλοὶ τὸ αὐτὸ ποιοῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/033.yaml
  text: And if you do good to those who do good to you[a], what credit is that to you? Even sinners do the same.
translation:
  language: fr
  text: Et si vous faites du bien à ceux qui vous font du bien, quelle reconnaissance[a] cela vous vaut-il ? Même les pécheurs en font autant.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot grec peut aussi signifier « grâce », « faveur », « gratitude » ou « mérite ». Ici, il désigne la reconnaissance ou l’approbation que vaudrait une telle conduite.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγαθοποιῆτε / ἀγαθοποιοῦντας
  choice: faites du bien / font du bien
  rationale: Cette formulation naturelle conserve la répétition du même verbe grec et exprime l’action bénéfique envers autrui.
- source_word: ποία ... χάρις
  choice: quelle reconnaissance
  rationale: Dans cette question rhétorique, χάρις désigne la reconnaissance ou l’approbation attachée à un comportement, plutôt que la grâce au sens sotériologique. « Reconnaissance » reste idiomatique en français et évite le calque ambigu « crédit ».
- source_word: ὑμῖν
  choice: cela vous vaut-il
  rationale: Cette tournure rend naturellement en français le datif ὑμῖν en indiquant la reconnaissance qui revient aux interlocuteurs.
- source_word: ἁμαρτωλοὶ
  choice: les pécheurs
  rationale: Traduction directe du terme grec, qui conserve la catégorie morale et religieuse employée dans Luc.
- source_word: τὸ αὐτὸ ποιοῦσιν
  choice: en font autant
  rationale: Expression française naturelle qui rend l’idée de faire la même chose sans alourdir la phrase.
- source_word: καὶ ... καὶ
  choice: Et ... Même
  rationale: Le premier καὶ maintient l’enchaînement avec les paroles précédentes ; le second a ici une valeur intensive bien rendue par « Même ».
theological_decisions:
- issue: Sens de χάρις dans cet enseignement éthique
  choice: reconnaissance ou approbation
  alternative: grâce, faveur ou gratitude
  rationale: Le contexte porte sur la valeur reconnue d’une bonté simplement réciproque. Traduire par « grâce » dans le corps du texte risquerait d’introduire ici une portée sotériologique que la question n’impose pas, tout en laissant cette possibilité lexicale signalée en note.
translation_notes:
  register: Français international moderne, clair et digne. La répétition « faites du bien / font du bien » reproduit volontairement celle du grec ; « en font autant » donne une conclusion concise et naturelle.
