id: LUK.6.41
reference: Luke 6:41
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τί δὲ βλέπεις τὸ κάρφος τὸ ἐν τῷ ὀφθαλμῷ τοῦ ἀδελφοῦ σου, τὴν δὲ δοκὸν τὴν ἐν τῷ ἰδίῳ ὀφθαλμῷ οὐ κατανοεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/041.yaml
  text: But why do you see the speck in your brother’s eye[c][b][a], yet do not notice the beam in your own eye?
translation:
  language: fr
  text: Mais pourquoi vois-tu le brin de paille[a] qui est dans l’œil de ton frère[b], alors que tu ne remarques pas la poutre[c] qui est dans ton propre œil ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « fétu » ou « petite écharde ». Le grec κάρφος désigne une minuscule particule sèche, mise en contraste avec la poutre.
    reason: lexical_alternative
  - marker: b
    text: Le grec emploie ici le masculin singulier « frère » ; l’enseignement s’applique plus largement qu’à un frère de sexe masculin seul.
    reason: cultural_note
  - marker: c
    text: Ou « grosse pièce de bois ». Le grec δοκός désigne une grande pièce de bois de construction.
    reason: lexical_alternative
lexical_decisions:
- source_word: τί
  choice: pourquoi
  rationale: 'Dans cette question rhétorique, τί associé à βλέπεις a une valeur causale et exprime un reproche : « pourquoi vois-tu… ? »'
- source_word: δὲ
  choice: mais
  rationale: δὲ assure la progression du discours tout en marquant ici un léger contraste avec ce qui précède.
- source_word: βλέπεις
  choice: vois-tu
  rationale: Ce choix conserve le sens concret et la métaphore visuelle du verbe βλέπω.
- source_word: κάρφος
  choice: brin de paille
  rationale: κάρφος désigne une petite particule sèche, comme un fétu ou un fragment de paille. « Brin de paille » est naturel et maintient le contraste hyperbolique avec la poutre.
- source_word: ἀδελφοῦ
  choice: frère
  rationale: Le nom grec est masculin singulier. « Frère » en préserve la forme dans cette illustration morale, sans exclure l’application plus large du propos.
- source_word: δοκόν
  choice: poutre
  rationale: δοκός désigne une grosse pièce de bois de construction. « Poutre » rend clairement le contraste démesuré avec le brin de paille.
- source_word: ἰδίῳ
  choice: propre
  rationale: ἴδιος souligne la possession et renforce l’opposition entre l’œil du frère et son propre œil.
- source_word: κατανοεῖς
  choice: ne remarques pas
  rationale: κατανοέω signifie observer, percevoir ou prendre attentivement en considération. « Ne remarques pas » exprime naturellement ici l’aveuglement dénoncé.
theological_decisions:
- issue: Portée du terme relationnel masculin ἀδελφοῦ
  choice: frère
  alternative: frère ou sœur ; prochain
  rationale: Le grec emploie un masculin singulier dans une illustration représentative. Le texte garde « frère » afin de respecter cette forme, tandis qu’une note précise que l’enseignement ne se limite pas à un frère biologique ou à un homme.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement singulier conserve l’adresse individuelle du grec. L’opposition entre « vois-tu » et « ne remarques pas », ainsi que l’hyperbole du brin de paille et de la poutre, est maintenue.
