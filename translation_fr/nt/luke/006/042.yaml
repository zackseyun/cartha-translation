id: LUK.6.42
reference: Luke 6:42
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸀πῶς δύνασαι λέγειν τῷ ἀδελφῷ σου· Ἀδελφέ, ἄφες ἐκβάλω τὸ κάρφος τὸ ἐν τῷ ὀφθαλμῷ σου, αὐτὸς τὴν ἐν τῷ ὀφθαλμῷ σοῦ δοκὸν οὐ βλέπων; ὑποκριτά, ἔκβαλε πρῶτον τὴν δοκὸν ἐκ τοῦ ὀφθαλμοῦ σοῦ, καὶ τότε διαβλέψεις ⸂τὸ κάρφος τὸ ἐν τῷ ὀφθαλμῷ τοῦ ἀδελφοῦ σου ἐκβαλεῖν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/042.yaml
  text: How can you say to your brother[a], ‘Brother, let me take out the speck that is in your eye,’ while you yourself do not see the beam that is in your own eye? Hypocrite, first take the beam out of your own eye[c][b], and then you will see clearly to take out the speck that is in your brother’s eye.
translation:
  language: fr
  text: 'Comment peux-tu dire à ton frère[c] : « Frère, laisse-moi retirer la paille[a] qui est dans ton œil », alors que toi-même, tu ne vois pas la poutre[b] qui est dans ton propre œil ? Hypocrite ! Retire d’abord la poutre de ton œil ; alors tu verras clair pour retirer la paille qui est dans l’œil de ton frère.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « brindille » ou « fétu » ; le grec κάρφος désigne un très petit fragment de matière sèche.
    reason: lexical_alternative
  - marker: b
    text: Ou « pièce de charpente » ; le grec δοκός désigne une grosse pièce de bois.
    reason: lexical_alternative
  - marker: c
    text: Le grec ἀδελφός est ici un nom de parenté masculin singulier, également employé dans l’interpellation « Frère ». L’enseignement peut avoir une portée plus générale, mais la formulation grecque est masculine.
    reason: cultural_note
lexical_decisions:
- source_word: πῶς δύνασαι λέγειν
  choice: Comment peux-tu dire
  rationale: Rend directement la question rhétorique qui conteste à la fois la capacité et la légitimité d’une telle parole.
- source_word: ἀδελφῷ / Ἀδελφέ / ἀδελφοῦ
  choice: frère / Frère / frère
  rationale: Conserve le nom de parenté masculin singulier et l’adresse directe du grec, sans en restreindre artificiellement la portée morale.
- source_word: ἄφες ἐκβάλω
  choice: laisse-moi retirer
  rationale: ἄφες introduit ici une demande de permission ; « laisse-moi » est idiomatique, tandis que « retirer » convient au geste évoqué.
- source_word: κάρφος
  choice: paille
  rationale: « Paille » est une image française immédiatement compréhensible et maintient le contraste traditionnel et hyperbolique avec la poutre ; le mot grec désigne un minuscule fragment sec.
- source_word: αὐτός
  choice: toi-même
  rationale: Préserve l’insistance contrastive du pronom grec.
- source_word: δοκός
  choice: poutre
  rationale: Désigne une grosse pièce de bois et restitue nettement l’exagération voulue par opposition à la paille.
- source_word: ὑποκριτά
  choice: Hypocrite !
  rationale: Reproduit l’apostrophe directe, au singulier, et sa vigueur réprobatrice.
- source_word: διαβλέψεις
  choice: tu verras clair
  rationale: Exprime naturellement en français l’idée de recouvrer une vision nette, tant dans l’image physique que dans sa portée morale.
- source_word: ἐκβαλεῖν
  choice: pour retirer
  rationale: L’infinitif dépend de l’idée de voir clairement et indique l’action que cette vision rend possible ; la formulation française conserve cette relation sans la surinterpréter.
theological_decisions:
- issue: Portée du terme masculin ἀδελφός dans une instruction morale
  choice: frère
  alternative: frère ou sœur ; prochain ; autre croyant
  rationale: Le grec emploie trois fois un terme masculin singulier de parenté. La traduction garde cette forme textuelle sans nier que l’enseignement puisse avoir une application plus large.
- issue: Nature du reproche formulé par ὑποκριτά
  choice: Hypocrite !
  alternative: Espèce d’hypocrite ! ; Homme hypocrite !
  rationale: 'Le terme grec est une apostrophe accusatrice directe. La traduction n’ajoute aucune définition doctrinale de l’hypocrisie et laisse l’image préciser le reproche : prétendre corriger autrui sans reconnaître son propre défaut plus grave.'
- issue: Relation entre correction de soi et correction du frère
  choice: alors tu verras clair pour retirer
  alternative: alors tu pourras retirer ; alors tu verras comment retirer
  rationale: 'La formulation préserve la tension du texte : Jésus n’interdit pas explicitement toute aide apportée au frère, mais exige d’abord une lucidité et une correction personnelles. Elle évite de transformer cette séquence en système théologique.'
translation_notes:
  register: Français international moderne, courant et digne. La ponctuation met en relief l’apostrophe « Hypocrite ! ». Le couple imagé « paille / poutre », bien établi en français, conserve l’hyperbole saisissante du grec. « Tu verras clair » reste naturel tout en gardant le jeu entre vision physique et discernement moral.
