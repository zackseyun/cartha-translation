id: LUK.6.26
reference: Luke 6:26
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Οὐαὶ ὅταν ⸂καλῶς ὑμᾶς⸃ εἴπωσιν ⸀πάντες οἱ ἄνθρωποι, κατὰ ⸂τὰ αὐτὰ⸃ γὰρ ἐποίουν τοῖς ψευδοπροφήταις οἱ πατέρες αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/026.yaml
  text: Woe when all people speak well of you[b][a], for their fathers used to do the same to the false prophets.
translation:
  language: fr
  text: Malheur à vous lorsque tout le monde dit du bien de vous[a] ! Car leurs ancêtres agissaient de même envers les faux prophètes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « parle favorablement de vous ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐαί
  choice: Malheur à vous
  rationale: Conserve la force solennelle de l’exclamation prophétique. « À vous » explicite en français le groupe visé, déjà indiqué par le pronom ὑμᾶς dans la proposition qui suit.
- source_word: ὅταν
  choice: lorsque
  rationale: Exprime une éventualité générale tout en gardant un registre digne et naturel.
- source_word: καλῶς ὑμᾶς εἴπωσιν
  choice: dit du bien de vous
  rationale: Rend naturellement l’expression grecque, qui désigne des paroles favorables à propos de quelqu’un plutôt que le simple fait de bien parler.
- source_word: πάντες οἱ ἄνθρωποι
  choice: tout le monde
  rationale: Expression française courante et inclusive qui restitue la portée générale du pluriel grec sans suggérer qu’il s’agit uniquement d’hommes.
- source_word: κατὰ τὰ αὐτά
  choice: de même
  rationale: Équivalent idiomatique concis de l’idée d’agir de la même manière.
- source_word: γάρ
  choice: Car
  rationale: Maintient explicitement le lien explicatif entre l’avertissement et le précédent historique invoqué.
- source_word: ἐποίουν
  choice: agissaient
  rationale: L’imparfait français rend bien l’action habituelle ou répétée exprimée par l’imparfait grec.
- source_word: τοῖς ψευδοπροφήταις
  choice: envers les faux prophètes
  rationale: Indique clairement les personnes qui bénéficiaient de cette attitude favorable, sans limiter l’action à une seule formule verbale.
- source_word: οἱ πατέρες αὐτῶν
  choice: leurs ancêtres
  rationale: Rend dans un français moderne le sens collectif de « leurs pères », c’est-à-dire les générations antérieures de leur peuple.
theological_decisions:
- issue: Portée de la comparaison avec les faux prophètes
  choice: La parole avertit que l’approbation universelle reproduit la manière dont les générations antérieures traitaient les faux prophètes.
  alternative: Comprendre le verset comme une condamnation absolue de toute parole positive ou, plus largement, de toute popularité.
  rationale: Le lien introduit par γάρ et κατὰ τὰ αὐτά fonde le malheur sur un précédent historique précis. La formulation conserve cet avertissement sans transformer le texte en rejet indistinct de toute approbation.
translation_notes:
  register: Français international moderne, clair et digne. « Tout le monde » privilégie la fluidité sans perdre l’universalité de πάντες οἱ ἄνθρωποι ; « ancêtres » évite le possible contresens moderne de « pères » tout en conservant la dimension intergénérationnelle.
