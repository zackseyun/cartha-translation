  text: οἳ ἦλθον ἀκοῦσαι αὐτοῦ καὶ ἰαθῆναι ἀπὸ τῶν νόσων αὐτῶν· καὶ οἱ ⸂ἐνοχλούμενοι ἀπὸ⸃ πνευμάτων ⸀ἀκαθάρτων ἐθεραπεύοντο·
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/018.yaml
  text: who came to hear him and to be healed of their diseases[a]; and those troubled by unclean spirits were being healed.
translation:
  language: fr
  text: qui étaient venus pour l’entendre et pour être guéris de leurs maladies ; et ceux qui étaient tourmentés[a] par des esprits impurs étaient guéris.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « affligés » ou « harcelés ». Le participe grec peut exprimer divers degrés d’oppression selon le contexte.'
    reason: Alternative lexicale pour ἐνοχλούμενοι, dont l’intensité exacte n’est pas entièrement déterminée par le seul terme.
lexical_decisions:
- source_word: οἳ ἦλθον
  choice: qui étaient venus
  rationale: Le pronom relatif rattache ce verset à la foule mentionnée au verset précédent. Le plus-que-parfait français situe naturellement leur venue avant les actions décrites dans la scène.
- source_word: ἀκοῦσαι αὐτοῦ
  choice: pour l’entendre
  rationale: L’infinitif aoriste exprime ici le but de leur venue. « Pour l’entendre » est direct et naturel en français.
- source_word: ἰαθῆναι ἀπὸ τῶν νόσων αὐτῶν
  choice: pour être guéris de leurs maladies
  rationale: La tournure française idiomatique « guérir de » rend le passage de la maladie à la guérison sans reproduire mécaniquement la préposition grecque ἀπό.
- source_word: ἐνοχλούμενοι ἀπὸ πνευμάτων ἀκαθάρτων
  choice: ceux que des esprits impurs tourmentaient
  rationale: La construction active est fluide en français et exprime clairement la cause de l’affliction. « Tourmentaient » transmet la détresse indiquée par le participe, tandis qu’une note conserve des possibilités moins fortes.
- source_word: πνευμάτων ἀκαθάρτων
  choice: esprits impurs
  rationale: « Esprits impurs » est l’expression biblique française courante et conserve la dimension morale et cultuelle de ἀκάθαρτος sans expliciter davantage par « démons ».
- source_word: ἐθεραπεύοντο
  choice: étaient eux aussi guéris
  rationale: L’imparfait français préserve l’aspect imperfectif du verbe grec. « Eux aussi » rend la valeur additive de καί et relie ce groupe aux malades déjà mentionnés.
theological_decisions:
- issue: Désignation des πνεύματα ἀκάθαρτα
  choice: esprits impurs
  alternative: démons
  rationale: Le texte les appelle littéralement des « esprits impurs ». Cette formulation préserve l’expression propre à Luc sans remplacer le terme par une identification interprétative.
- issue: Valeur aspectuelle de ἐθεραπεύοντο
  choice: étaient eux aussi guéris
  alternative: furent eux aussi guéris
  rationale: L’imparfait grec présente la guérison comme une action en cours ou répétée dans cette scène. L’imparfait français évite de réduire cette nuance à un événement ponctuel.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase reste liée au verset précédent par « qui ». Le point-virgule distingue les deux groupes tout en maintenant l’unité de la scène.
