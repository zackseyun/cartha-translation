  source_fidelity: 'Le sens général et les contrastes temporels de l’original sont bien rendus : οὐαί conserve sa force d’avertissement, ἐμπεπλησμένοι est adéquatement rendu par « êtes rassasiés », et les futurs annoncent le renversement à venir. Toutefois, « vous serez dans le deuil » restreint πενθήσετε à un état de deuil, souvent lié en français à un décès, alors que le verbe grec exprime plus largement le fait de se lamenter ou de mener deuil. La coordination avec κλαύσετε appelle deux verbes d’action distincts.'
