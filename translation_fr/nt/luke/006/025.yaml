id: LUK.6.25
reference: Luke 6:25
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὐαὶ ὑμῖν, οἱ ἐμπεπλησμένοι ⸀νῦν, ὅτι πεινάσετε. ⸀οὐαί, οἱ γελῶντες νῦν, ὅτι πενθήσετε καὶ κλαύσετε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/025.yaml
  text: Woe to you who are full now[a], because you will be hungry. Woe to you who are laughing now[b], because you will mourn and weep.
translation:
  language: fr
  text: Malheur à vous qui êtes rassasiés maintenant, car vous aurez faim ! Malheur à vous qui riez maintenant, car vous vous lamenterez et vous pleurerez !
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐαί
  choice: Malheur à vous
  rationale: Cette formule française naturelle conserve la force prophétique d’une dénonciation et d’un avertissement de jugement, plutôt que de réduire l’interjection à une simple expression de compassion.
- source_word: ἐμπεπλησμένοι
  choice: qui êtes rassasiés
  rationale: Le participe parfait décrit un état présent résultant du fait d’avoir été comblé ou nourri. « Êtes rassasiés » exprime cet état et maintient le contraste concret avec la faim future.
- source_word: νῦν
  choice: maintenant
  rationale: Le terme conserve le contraste temporel essentiel entre la situation présente et le renversement à venir.
- source_word: πεινάσετε
  choice: vous aurez faim
  rationale: Cette tournure courante en français moderne rend clairement le futur et la privation annoncée.
- source_word: γελῶντες
  choice: qui riez
  rationale: Le présent français rend l’activité actuelle désignée par le participe, sans élargir indûment le sens à la joie en général.
- source_word: πενθήσετε
  choice: vous serez dans le deuil
  rationale: Cette expression garde la gravité de πενθέω et le distingue du verbe suivant, qui désigne les pleurs.
- source_word: κλαύσετε
  choice: vous pleurerez
  rationale: Le verbe conserve l’intensification rhétorique produite par l’enchaînement du deuil et des pleurs.
- source_word: ὅτι
  choice: car
  rationale: « Car » introduit naturellement en français la raison du malheur proclamé, tout en maintenant le ton solennel de la parole.
theological_decisions:
- issue: Nature de la parole de malheur
  choice: Un avertissement prophétique annonçant un renversement et un jugement à venir pour ceux qui sont actuellement rassasiés et insouciants
  alternative: Une simple observation sociologique sur les changements de fortune
  rationale: La répétition de οὐαί, les verbes au futur et le parallélisme avec les bénédictions voisines signalent davantage qu’un constat neutre. La traduction préserve cet avertissement sans préciser le moment ni le mécanisme du renversement.
translation_notes:
  register: Français international moderne, clair et digne. La répétition de « Malheur à vous » et les deux contrastes entre « maintenant » et le futur sont conservés. La ponctuation exclamative restitue la force orale et prophétique sans ajouter de contenu.
