  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἐὰν ⸀δανίσητε παρ’ ὧν ἐλπίζετε ⸀λαβεῖν, ποία ὑμῖν χάρις ἐστίν; ⸀καὶ ἁμαρτωλοὶ ἁμαρτωλοῖς δανίζουσιν ἵνα ἀπολάβωσιν τὰ ἴσα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/034.yaml
  text: And if you lend to those from whom you expect to receive[a], what credit is that to you? Even sinners lend to sinners so that they may receive back the same amount.
translation:
  language: fr
  text: Et si vous prêtez à ceux de qui vous espérez recevoir, quel mérite en avez-vous[a] ? Même les pécheurs prêtent aux pécheurs afin de recevoir l’équivalent en retour.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « quelle reconnaissance vous en revient-elle ? » Le mot grec peut aussi signifier « grâce » ou « reconnaissance » ; ici, il désigne probablement le mérite ou la considération favorable.
    reason: lexical_alternative
lexical_decisions:
- source_word: δανίσητε / δανίζουσιν
  choice: prêtez / prêtent
  rationale: Le verbe désigne le fait de prêter de l’argent ou des biens. « Prêter » est l’équivalent français naturel et conserve clairement le sens financier.
- source_word: παρ’ ὧν
  choice: à ceux dont
  rationale: 'La formulation française exprime naturellement les deux rapports implicites : on prête à ces personnes et l’on attend de recevoir d’elles.'
- source_word: ἐλπίζετε λαβεῖν
  choice: vous espérez recevoir en retour
  rationale: « Espérer » conserve la valeur ordinaire de ἐλπίζω, tandis que « en retour » rend explicite, sans surinterprétation, le caractère réciproque suggéré par le contexte.
- source_word: ποία ὑμῖν χάρις ἐστίν
  choice: quel mérite en avez-vous ?
  rationale: Dans ce refrain lucanien, χάρις désigne ici la considération favorable ou le mérite reconnu plutôt que la grâce salvatrice. Cette tournure est idiomatique en français et convient à la question rhétorique.
- source_word: ἁμαρτωλοὶ
  choice: les pécheurs
  rationale: L’adjectif substantivé désigne directement les « pécheurs », catégorie morale conservée telle quelle.
- source_word: ἵνα ἀπολάβωσιν
  choice: afin de recevoir ... en retour
  rationale: ἀπολαμβάνω exprime ici l’idée de recevoir en retour ce qui a été prêté. La formulation reste proche du grec sans imposer la notion technique de remboursement.
- source_word: τὰ ἴσα
  choice: l’équivalent
  rationale: L’expression désigne ce qui est égal ou équivalent à ce qui a été prêté. « L’équivalent » reste naturel et n’ajoute ni intérêt ni profit.
theological_decisions:
- issue: Sens de χάρις dans la question rhétorique de Jésus
  choice: « mérite » au sens de considération favorable ou de caractère louable
  alternative: « grâce », « reconnaissance » ou « avantage »
  rationale: Le contexte oppose le comportement attendu des disciples à celui des pécheurs. Il s’agit de ce qui rend leur conduite digne d’approbation, non de la grâce salvatrice comme notion théologique abstraite. Une note conserve l’autre possibilité lexicale importante.
- issue: Nature de ce qui est attendu en retour du prêt
  choice: Un retour équivalent, exprimé sans référence à un intérêt ou à un profit
  alternative: Un remboursement avec intérêt ou un gain
  rationale: τὰ ἴσα indique l’équivalence. Le texte ne précise ni intérêt ni bénéfice ; la traduction évite donc d’importer une affirmation économique ou éthique supplémentaire.
translation_notes:
  register: Français international moderne, courant et digne. La syntaxe demeure naturelle à l’oral comme à l’écrit. « Recevoir en retour » et « l’équivalent » préservent la réciprocité du grec sans préciser indûment qu’il s’agit d’argent, d’intérêts ou d’un profit.
