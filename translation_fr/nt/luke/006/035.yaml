source:
  edition: SBLGNT
  text: πλὴν ἀγαπᾶτε τοὺς ἐχθροὺς ὑμῶν καὶ ἀγαθοποιεῖτε καὶ δανίζετε μηδὲν ἀπελπίζοντες· καὶ ἔσται ὁ μισθὸς ὑμῶν πολύς, καὶ ἔσεσθε υἱοὶ Ὑψίστου, ὅτι αὐτὸς χρηστός ἐστιν ἐπὶ τοὺς ἀχαρίστους καὶ πονηρούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/035.yaml
  text: But love your enemies[a], and do good, and lend, expecting nothing in return; and your reward will be great, and you will be sons of the Most High[b], because he is kind to the ungrateful and evil.
translation:
  language: fr
  text: 'Mais aimez vos ennemis[a], faites du bien et prêtez sans rien espérer en retour ; votre récompense sera grande, et vous serez fils du Très-Haut[b], car il est bon envers les ingrats et les méchants.


    [a] La tournure grecque rendue par « sans rien espérer en retour » est difficile. D’autres comprennent, de manière moins probable : « sans désespérer de personne » ou « sans jamais perdre espoir ». Dans ce contexte, elle désigne vraisemblablement le fait de prêter sans attendre de remboursement ni de contrepartie.


    [b] Le grec emploie ici le nom masculin pluriel « fils », qui peut avoir un sens représentatif et inclure tous ceux qui agissent ainsi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La tournure grecque rendue par « sans rien espérer en retour » est difficile. D’autres comprennent, de manière moins probable : « sans désespérer de personne » ou « sans jamais perdre espoir ». Dans ce contexte, elle désigne vraisemblablement le fait de prêter sans attendre de remboursement ni de contrepartie.'
    reason: lexical_alternative
  - marker: b
    text: Le grec emploie ici le nom masculin pluriel « fils », qui peut avoir un sens représentatif et inclure tous ceux qui agissent ainsi.
    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: Mais
  rationale: Marque le contraste avec la conduite fondée sur la réciprocité décrite auparavant ; « Mais » est naturel et conserve cette force adversative.
- source_word: ἀγαπᾶτε τοὺς ἐχθροὺς ὑμῶν
  choice: aimez vos ennemis
  rationale: Rend directement l’impératif et conserve sans l’atténuer la portée saisissante du commandement.
- source_word: ἀγαθοποιεῖτε
  choice: faites du bien
  rationale: Expression française courante qui traduit l’action bienfaisante demandée.
- source_word: δανίζετε
  choice: prêtez
  rationale: Traduit le verbe sans préciser indûment qu’il s’agit uniquement d’argent.
- source_word: μηδὲν ἀπελπίζοντες
  choice: sans rien espérer en retour
  rationale: Dans le contexte du prêt et de la réciprocité, la tournure signifie vraisemblablement qu’il ne faut attendre ni remboursement ni contrepartie ; son autre interprétation est signalée en note.
- source_word: μισθὸς ὑμῶν πολύς
  choice: votre récompense sera grande
  rationale: « Récompense » convient au contexte moral et eschatologique, tandis que « grande » rend naturellement l’adjectif πολύς.
- source_word: υἱοὶ Ὑψίστου
  choice: fils du Très-Haut
  rationale: Conserve le masculin pluriel explicite υἱοί et le titre divin traditionnel Ὑψίστος, tout en signalant en note la portée représentative possible.
- source_word: χρηστός
  choice: bon
  rationale: Exprime simplement la bonté bienveillante de Dieu envers ceux qui ne la méritent pas, dans une langue naturelle et digne.
- source_word: ἀχαρίστους καὶ πονηρούς
  choice: les ingrats et les méchants
  rationale: Rend clairement les deux adjectifs substantivés sans en affaiblir la portée morale.
theological_decisions:
- issue: Rendu genré de υἱοὶ Ὑψίστου
  choice: fils du Très-Haut
  alternative: enfants du Très-Haut
  rationale: Le texte grec emploie explicitement le masculin pluriel « fils ». Le texte principal le conserve, tandis qu’une note précise que l’expression peut avoir une portée représentative.
- issue: Interprétation de μηδὲν ἀπελπίζοντες
  choice: sans rien espérer en retour
  alternative: sans désespérer de personne / sans jamais perdre espoir
  rationale: Le contexte immédiat porte sur le prêt et l’absence de réciprocité ; l’idée de ne pas attendre de remboursement ou de contrepartie y est donc la plus probable. La difficulté réelle du grec et l’autre lecture sont conservées en note.
translation_notes:
  register: Français international moderne, clair et digne. La coordination impérative reste directe ; la seconde phrase met naturellement en relief la promesse. Le vocabulaire évite aussi bien l’archaïsme que la paraphrase confessionnelle.
