id: LUK.6.43
reference: Luke 6:43
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Οὐ γάρ ἐστιν δένδρον καλὸν ποιοῦν καρπὸν σαπρόν, οὐδὲ ⸀πάλιν δένδρον σαπρὸν ποιοῦν καρπὸν καλόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/043.yaml
  text: For there is no good tree producing rotten fruit, nor again a rotten tree producing good fruit.
translation:
  language: fr
  text: Car il n’y a pas de bon arbre qui produise un fruit pourri[a], ni, à l’inverse, d’arbre pourri qui produise un bon fruit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « mauvais fruit » et « mauvais arbre ». Le grec σαπρός peut signifier « gâté », « pourri » ou « mauvais ».
    reason: Alternative lexicale permettant de signaler l’étendue sémantique du terme grec.
lexical_decisions:
- source_word: Οὐ γάρ ἐστιν
  choice: Car il n’y a pas
  rationale: « Car » conserve la valeur explicative de γάρ et relie le proverbe au contexte précédent; « il n’y a pas » rend naturellement en français la négation existentielle.
- source_word: δένδρον καλὸν
  choice: de bon arbre
  rationale: « Bon arbre » préserve à la fois l’image agricole et la portée morale possible de καλός, sans expliciter excessivement la métaphore.
- source_word: ποιοῦν καρπὸν
  choice: qui produise un fruit
  rationale: Avec καρπός, ποιέω se rend idiomatiquement par « produire ». Le subjonctif est naturel après la négation d’existence et ne modifie pas le sens du participe grec.
- source_word: σαπρόν
  choice: pourri
  rationale: σαπρός désigne concrètement ce qui est gâté ou pourri, et par extension ce qui est mauvais. « Pourri » maintient la vigueur de l’image agricole tout en laissant sa portée morale découler du contexte.
- source_word: οὐδὲ πάλιν
  choice: ni, à l’inverse
  rationale: « Ni » coordonne la seconde proposition négative, tandis que « à l’inverse » exprime ici naturellement la valeur contrastive de πάλιν.
- source_word: δένδρον σαπρὸν
  choice: d’arbre pourri
  rationale: La répétition de « pourri » reflète le même adjectif grec σαπρός et maintient le parallélisme antithétique.
- source_word: καρπὸν καλόν
  choice: un bon fruit
  rationale: Ce choix reproduit le contraste entre καλός et σαπρός et conserve le singulier générique du grec.
theological_decisions:
- issue: Intensité de la métaphore agricole et morale
  choice: Traduire σαπρός par « pourri » dans les deux propositions
  alternative: « mauvais » ou « gâté »
  rationale: « Pourri » conserve le sens concret premier et la cohérence lexicale du grec. La portée morale reste présente par la métaphore sans être imposée directement dans la traduction.
translation_notes:
  register: Français international moderne, clair et digne. La structure proverbiale et le parallélisme sont conservés; « à l’inverse » rend le contraste plus naturel que le littéral « de nouveau ».
