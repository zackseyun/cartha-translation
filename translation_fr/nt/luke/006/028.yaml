  text: εὐλογεῖτε τοὺς καταρωμένους ⸀ὑμᾶς, προσεύχεσθε ⸀περὶ τῶν ἐπηρεαζόντων ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/028.yaml
  text: Bless those who curse you[a]; pray for those who mistreat you.
translation:
  language: fr
  text: Bénissez ceux qui vous maudissent ; priez pour ceux qui vous maltraitent.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: Bénissez
  rationale: L’impératif pluriel est rendu directement par « Bénissez », formulation naturelle et consacrée qui maintient le contraste éthique avec « maudissent ».
- source_word: τοὺς καταρωμένους ὑμᾶς
  choice: ceux qui vous maudissent
  rationale: Le participe substantivé désigne les personnes qui profèrent des malédictions contre les disciples. Cette formulation est idiomatique en français et conserve la portée active de l’expression grecque.
- source_word: προσεύχεσθε
  choice: priez
  rationale: L’impératif « priez » transmet clairement le commandement. L’aspect présent peut suggérer une conduite habituelle, mais il n’est pas nécessaire de le surtraduire en français.
- source_word: περὶ τῶν ἐπηρεαζόντων ὑμᾶς
  choice: pour ceux qui vous maltraitent
  rationale: Avec προσεύχομαι, περί signifie ici naturellement « pour ». Le verbe ἐπηρεάζω couvre les mauvais traitements hostiles, notamment l’outrage ou l’abus ; « maltraitent » en préserve la portée générale sans la limiter aux insultes.
theological_decisions:
- issue: Portée des commandements relatifs à l’amour des ennemis
  choice: Présenter directement les deux impératifs éthiques, sans explication doctrinale ajoutée.
  alternative: Préciser la nature, les limites ou les effets de la bénédiction et de la prière.
  rationale: Le grec formule des commandements directs sur la manière de répondre à l’hostilité. La traduction doit en conserver la force et la tension sans importer de cadre doctrinal particulier.
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme concis de l’original est conservé, ainsi que le contraste entre la malédiction reçue et la bénédiction donnée.
