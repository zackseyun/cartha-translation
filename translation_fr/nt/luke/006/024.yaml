id: LUK.6.24
reference: Luke 6:24
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: πλὴν οὐαὶ ὑμῖν τοῖς πλουσίοις, ὅτι ἀπέχετε τὴν παράκλησιν ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/024.yaml
  text: But woe to you who are rich[b][a], for you have received your comfort.
translation:
  language: fr
  text: Mais malheur à vous qui êtes riches, car vous avez reçu votre consolation[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « vous avez reçu intégralement votre consolation ». Le verbe grec peut évoquer le fait de recevoir en totalité ce qui est dû.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: Mais
  rationale: Introduit nettement le contraste avec les déclarations de bonheur précédentes, dans un français courant et digne.
- source_word: οὐαὶ
  choice: malheur à vous
  rationale: Conserve la force solennelle de la formule prophétique d’avertissement et de jugement, sans l’atténuer en simple plainte.
- source_word: ὑμῖν τοῖς πλουσίοις
  choice: à vous qui êtes riches
  rationale: Rend l’adresse directe à une catégorie de personnes de façon naturelle, sans ajouter de précision sur l’origine ou l’usage de leurs richesses.
- source_word: ἀπέχετε
  choice: vous avez reçu
  rationale: Rend l’idée que la consolation est déjà en leur possession. La nuance possible de réception intégrale, souvent attachée à ce verbe, est signalée en note.
- source_word: παράκλησιν
  choice: consolation
  rationale: Équivalent naturel dans ce contexte de renversement entre la situation présente et la situation future; le mot garde une tonalité plus solennelle que « réconfort ».
- source_word: ὑμῶν
  choice: votre
  rationale: Reproduit simplement le possessif grec qui détermine « consolation ».
theological_decisions:
- issue: Portée de l’avertissement adressé aux riches
  choice: 'Maintenir l’adresse directe et sévère: « malheur à vous qui êtes riches »'
  alternative: Atténuer en « hélas pour vous » ou préciser « vous qui mettez votre confiance dans les richesses »
  rationale: Le grec vise directement ceux qui sont riches. La traduction n’adoucit pas la formule et n’ajoute pas une condition morale que ce verset n’énonce pas.
- issue: Valeur temporelle et idiomatique de ἀπέχετε
  choice: « vous avez reçu », avec la nuance de totalité en note
  alternative: « vous recevez » ou « vous avez reçu intégralement » dans le texte principal
  rationale: Le présent grec peut décrire ce que les riches ont déjà en leur possession, tandis que le verbe peut aussi évoquer le fait de recevoir intégralement ce qui revient à quelqu’un. La note préserve cette tension lexicale sans surcharger le texte.
translation_notes:
  register: Français international moderne, clair et solennel. La formulation reste directe, sans archaïsme ni explicitation doctrinale étrangère au verset.
