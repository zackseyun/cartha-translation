source:
  edition: SBLGNT
  text: Καὶ μὴ κρίνετε, καὶ οὐ μὴ κριθῆτε· ⸀καὶ μὴ καταδικάζετε, καὶ οὐ μὴ καταδικασθῆτε. ἀπολύετε, καὶ ἀπολυθήσεσθε·
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/037.yaml
  text: And do not judge[a], and you will certainly not be judged; and do not condemn, and you will certainly not be condemned. Forgive, and you will be forgiven.
translation:
  language: fr
  text: Ne jugez pas, et vous ne serez certainement pas jugés ; ne condamnez pas, et vous ne serez certainement pas condamnés. Pardonnez[a], et vous serez pardonnés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Relâchez » ou « Libérez ». Le verbe grec peut signifier « relâcher », « libérer » ou « pardonner » ; dans ce contexte, il est compris au sens de « pardonner ».
    reason: alternative lexicale
lexical_decisions:
- source_word: κρίνετε
  choice: jugez
  rationale: Le verbe κρίνω signifie couramment « juger » ou « évaluer ». « Jugez » conserve la concision de l’impératif et la correspondance avec le passif « serez jugés ».
- source_word: οὐ μὴ κριθῆτε
  choice: vous ne serez certainement pas jugés
  rationale: La construction οὐ μή exprime une négation appuyée. « Certainement pas » en restitue la force en français moderne.
- source_word: καταδικάζετε
  choice: condamnez
  rationale: καταδικάζω est plus fort que κρίνω et désigne un jugement défavorable ou une déclaration de culpabilité. « Condamnez » préserve cette progression.
- source_word: οὐ μὴ καταδικασθῆτε
  choice: vous ne serez certainement pas condamnés
  rationale: Cette formulation rend la négation emphatique οὐ μή et maintient le parallélisme avec la proposition précédente.
- source_word: ἀπολύετε
  choice: Libérez
  rationale: ἀπολύω peut signifier « libérer », « relâcher », « renvoyer » ou, dans ce contexte, « pardonner ». « Libérez » conserve son sens large et sa correspondance avec le passif qui suit.
- source_word: ἀπολυθήσεσθε
  choice: vous serez libérés
  rationale: La répétition de « libérer » reproduit la réciprocité et le lien verbal explicite du grec, sans réduire d’emblée le sens à celui de « pardonner ».
- source_word: καὶ
  choice: et
  rationale: Le « et » répété conserve la coordination et le rythme des propositions grecques.
theological_decisions:
- issue: Faut-il rendre ἀπολύετε au sens étroit de « pardonner » ou au sens plus large de « libérer » ?
  choice: Employer « Libérez » dans le texte principal
  alternative: « Pardonnez » ou « Relâchez »
  rationale: Dans un contexte de jugement et de condamnation, le verbe peut évoquer la remise en liberté, l’acquittement ou le pardon. « Libérez » préserve cette amplitude et le parallélisme verbal ; la lecture familière « pardonnez » est signalée en note afin de ne pas effacer l’ambiguïté.
translation_notes:
  register: Français international moderne, sobre et digne. Les impératifs brefs et les passifs parallèles reproduisent le rythme de l’énoncé grec. « Libérez » est volontairement plus large que « pardonnez », malgré son caractère légèrement inhabituel sans complément explicite.
