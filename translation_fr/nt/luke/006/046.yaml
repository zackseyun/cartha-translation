id: LUK.6.46
reference: Luke 6:46
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Τί δέ με καλεῖτε· Κύριε κύριε, καὶ οὐ ποιεῖτε ἃ λέγω;
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/046.yaml
  text: Why do you call me[a], ‘Lord, Lord,’ and not do what I say?
translation:
  language: fr
  text: Pourquoi m’appelez-vous[a] « Seigneur, Seigneur » et ne faites-vous pas ce que je dis ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « Maître, Maître ». Grec : « Kyrios, kyrios ».'
    reason: Alternative lexicale possible pour κύριος ; la translittération rend visible le terme grec sous-jacent.
lexical_decisions:
- source_word: Τί
  choice: Pourquoi
  rationale: 'Dans la tournure Τί ... καλεῖτε, τί demande la raison plutôt que l’objet : « Pourquoi m’appelez-vous… ? » restitue naturellement la force de reproche.'
- source_word: δέ
  choice: —
  rationale: Connecteur léger dont la fonction discursive ressort du contexte immédiat ; l’exprimer par « mais » ou « et » alourdirait la question en français.
- source_word: με
  choice: m’
  rationale: Pronom objet direct de καλεῖτε, rendu directement par le pronom élidé français.
- source_word: καλεῖτε
  choice: appelez-vous
  rationale: Présent de la deuxième personne du pluriel ; « appeler » convient naturellement lorsqu’un titre suit en apostrophe.
- source_word: Κύριε κύριε
  choice: Seigneur, Seigneur
  rationale: Le double vocatif est conservé pour maintenir l’insistance et le contraste entre la confession verbale et l’absence d’obéissance.
- source_word: καὶ οὐ
  choice: sans
  rationale: Dans cette question de reproche, « sans faire » exprime idiomatiquement en français le contraste coordonné entre l’appellation et la conduite, sans en changer le sens.
- source_word: ποιεῖτε
  choice: faire
  rationale: Le verbe désigne ici la mise en pratique des paroles de Jésus ; « faire ce que je dis » est direct et naturel.
- source_word: ἃ
  choice: ce que
  rationale: Le relatif neutre pluriel renvoie collectivement au contenu des paroles ; le français idiomatique emploie « ce que ».
- source_word: λέγω
  choice: je dis
  rationale: Traduction directe qui n’ajoute pas un destinataire explicitement absent du grec.
theological_decisions:
- issue: Valeur de κύριος comme titre adressé à Jésus
  choice: Seigneur
  alternative: Maître
  rationale: « Seigneur » conserve la portée d’autorité et la possible dimension christologique du titre sans la réduire à la seule relation maître-disciple. « Maître » demeure une possibilité lexicale signalée en note.
translation_notes:
  register: Français international moderne, simple et digne. Le vouvoiement rend la deuxième personne du pluriel grec. La ponctuation met clairement en relief l’apostrophe répétée, tandis que « sans faire » donne une formulation naturelle au contraste.
