id: LUK.6.12
reference: Luke 6:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἐγένετο δὲ ἐν ταῖς ἡμέραις ταύταις ⸂ἐξελθεῖν αὐτὸν⸃ εἰς τὸ ὄρος προσεύξασθαι, καὶ ἦν διανυκτερεύων ἐν τῇ προσευχῇ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/012.yaml
  text: It happened in those days that he went out to the mountain to pray[a], and he spent the whole night in prayer to God.
translation:
  language: fr
  text: En ces jours-là, il arriva que Jésus se rendit sur la montagne pour prier, et il passa toute la nuit à prier Dieu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: il arriva que
  rationale: Tournure narrative naturelle qui conserve la fonction d’introduction de l’événement; la légère valeur connective de δέ n’exige pas ici un « or » explicite.
- source_word: ἐν ταῖς ἡμέραις ταύταις
  choice: En ces jours-là
  rationale: Expression temporelle française idiomatique qui renvoie à la période du récit.
- source_word: ἐξελθεῖν αὐτὸν
  choice: Jésus se rendit
  rationale: L’infinitif avec sujet à l’accusatif après ἐγένετο devient naturellement une proposition personnelle en français. Le nom « Jésus » clarifie le référent du pronom sans modifier le sens.
- source_word: εἰς τὸ ὄρος
  choice: sur la montagne
  rationale: En français, « se rendre sur la montagne » exprime naturellement le déplacement vers le relief désigné, tout en conservant l’article défini du grec.
- source_word: προσεύξασθαι
  choice: pour prier
  rationale: Rend directement l’infinitif de but associé au déplacement.
- source_word: ἦν διανυκτερεύων
  choice: passa toute la nuit
  rationale: Formulation française courante qui restitue l’action continue et la durée nocturne entière exprimées par la périphrase verbale.
- source_word: ἐν τῇ προσευχῇ τοῦ θεοῦ
  choice: dans la prière adressée à Dieu
  rationale: Rend le génitif comme objectif ou directionnel et évite l’ambiguïté trompeuse de « la prière de Dieu », qui pourrait suggérer que Dieu est celui qui prie.
theological_decisions:
- issue: Rapport de τοῦ θεοῦ à la prière de Jésus
  choice: la prière adressée à Dieu
  alternative: la prière de Dieu
  rationale: Le contexte présente Jésus comme celui qui prie et Dieu comme le destinataire. Cette formulation conserve cette relation sans ajouter que la prière est explicitement adressée au Père ni développer une explication doctrinale.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase garde le mouvement narratif de Luc et évite une construction trop littérale. « Jésus » remplace le pronom afin d’éviter une référence flottante dans un verset isolé.
