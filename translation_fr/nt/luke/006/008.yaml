  rationale: La révision retire le diagnostic médical implicite de « paralysée » et rend ξηρά par « desséchée », avec l’alternative contextuelle « atrophiée » en note. Elle améliore aussi l’idiomaticité de l’expression de la connaissance tout en conservant son absence d’explication théologique, et elle ne rajoute pas le déictique « là ».
