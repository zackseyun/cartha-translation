source:
  edition: SBLGNT
  text: αὐτὸς δὲ ᾔδει τοὺς διαλογισμοὺς αὐτῶν, ⸂εἶπεν δὲ⸃ τῷ ⸀ἀνδρὶ τῷ ξηρὰν ἔχοντι τὴν χεῖρα· ⸀Ἔγειρε καὶ στῆθι εἰς τὸ μέσον· ⸀καὶ ἀναστὰς ἔστη.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/008.yaml
  text: But he knew their thoughts[a], and he said to the man who had the withered hand[c][b], “Get up and stand in the middle.” And he got up and stood there.
translation:
  language: fr
  text: 'Mais lui savait ce qu’ils pensaient[a]. Il dit à l’homme qui avait la main desséchée[b] : « Lève-toi et tiens-toi au milieu. » L’homme se leva et se tint au milieu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leurs raisonnements » ou « leurs délibérations intérieures ».
    reason: lexical_alternative
  - marker: b
    text: Ou « la main atrophiée ». Littéralement « la main desséchée ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾔδει
  choice: connaissait
  rationale: Le verbe οἶδα, sous cette forme à valeur présente, exprime ici une connaissance effective. « Connaissait » convient au récit français sans préciser par quel moyen Jésus le savait.
- source_word: διαλογισμοὺς
  choice: pensées
  rationale: Le terme peut désigner des pensées, des raisonnements ou des délibérations intérieures. « Pensées » est naturel et garde l’étendue sémantique du grec.
- source_word: ἀνδρὶ
  choice: homme
  rationale: ἀνήρ désigne ici un homme adulte ; la traduction conserve cette précision.
- source_word: ξηρὰν ... τὴν χεῖρα
  choice: la main était paralysée
  rationale: Littéralement desséchée ou atrophiée, la main est décrite comme privée de sa fonction. « Paralysée » est une formulation française claire et courante, tandis qu’une note conserve l’image grecque.
- source_word: Ἔγειρε
  choice: Lève-toi
  rationale: Cet impératif commande à l’homme de se lever et reste distinct de l’ordre suivant.
- source_word: στῆθι
  choice: tiens-toi
  rationale: « Tiens-toi » préserve le second impératif et évite de répéter « lève-toi ».
- source_word: εἰς τὸ μέσον
  choice: au milieu
  rationale: La formule indique que l’homme doit venir se placer au milieu du groupe ; « au milieu » est idiomatique et conserve le caractère public de la scène.
- source_word: ἀναστὰς ἔστη
  choice: L’homme se leva et se tint là
  rationale: La traduction rend successivement le participe puis le verbe principal, sans réduire les deux actions à un seul mouvement.
theological_decisions:
- issue: La connaissance par Jésus des pensées d’autrui
  choice: Affirmer simplement qu’il connaissait leurs pensées
  alternative: Préciser qu’il discernait leurs intentions ou qu’il les connaissait surnaturellement
  rationale: Le texte affirme cette connaissance sans en expliquer le mécanisme ; la traduction ne lui ajoute donc aucune interprétation théologique.
translation_notes:
  register: Français international moderne, naturel et digne. Les deux impératifs et les deux actions correspondantes restent distincts. Le pronom initial emphatique αὐτός est rendu par « lui ».
