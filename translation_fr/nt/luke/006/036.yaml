  text: ⸀γίνεσθε οἰκτίρμονες ⸀καθὼς ὁ πατὴρ ὑμῶν οἰκτίρμων ἐστίν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/036.yaml
  text: Be merciful[a], just as your Father is merciful.
translation:
  language: fr
  text: Soyez miséricordieux[a], comme votre Père est miséricordieux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pleins de compassion ». L’adjectif grec désigne une personne émue de pitié et qui fait preuve de miséricorde.
    reason: lexical_alternative
lexical_decisions:
- source_word: γίνεσθε
  choice: Soyez
  rationale: L’impératif présent appelle les disciples à manifester durablement cette qualité. « Soyez » est l’expression française naturelle ici, sans imposer la nuance plus marquée de « devenez ».
- source_word: οἰκτίρμονες / οἰκτίρμων
  choice: miséricordieux
  rationale: L’adjectif désigne une personne émue de compassion et portée à faire miséricorde. Le même terme français est conservé dans les deux propositions pour reproduire le lien lexical grec.
- source_word: καθὼς
  choice: comme
  rationale: « Comme » exprime naturellement la comparaison et présente le Père comme modèle, sans transformer le rapport en lien causal.
- source_word: ὁ πατὴρ ὑμῶν
  choice: votre Père
  rationale: Cette formulation suit le grec, qui ne comporte pas l’adjectif « céleste », et préserve la force relationnelle de l’expression.
theological_decisions:
- issue: Rapport entre le commandement et le caractère du Père
  choice: La miséricorde du Père est présentée comme le modèle de la conduite des disciples.
  alternative: 'Comprendre la proposition au sens causal : « parce que votre Père est miséricordieux ».'
  rationale: καθὼς marque ici la comparaison (« comme ») plutôt que la cause, sans ajouter d’explication théologique au texte.
translation_notes:
  register: Français international moderne, simple et digne. « Miséricordieux » conserve le vocabulaire biblique tout en restant intelligible; la note explicite sa dimension de compassion active.
