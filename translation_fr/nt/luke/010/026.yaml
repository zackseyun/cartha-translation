  text: ὁ δὲ εἶπεν πρὸς αὐτόν· Ἐν τῷ νόμῳ τί γέγραπται; πῶς ἀναγινώσκεις;
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/026.yaml
  text: And he said to him[a], “What is written in the Law? How do you read it?”
translation:
  language: fr
  text: 'Il lui dit : « Qu’est-ce qui est écrit dans la Loi ? Comment la lis-tu[a] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Comment l’interprètes-tu ? » Le grec emploie littéralement le verbe « lire », mais la question peut aussi porter sur la compréhension ou l’interprétation.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ
  choice: Il
  rationale: Le sujet pronominal implicite est rendu naturellement en français. δέ marque ici une transition narrative légère qu’il n’est pas nécessaire d’expliciter.
- source_word: εἶπεν πρὸς αὐτόν
  choice: lui dit
  rationale: Cette formulation française concise rend directement le verbe de parole et son destinataire, sans ajouter une nuance de réponse absente du grec.
- source_word: Ἐν τῷ νόμῳ
  choice: dans la Loi
  rationale: νόμος désigne ici le corpus scripturaire reconnu d’Israël. La majuscule indique ce sens précis sans imposer la translittération « Torah ».
- source_word: τί γέγραπται
  choice: Qu’est-il écrit
  rationale: 'Le présent français exprime idiomatiquement l’état résultant du parfait passif grec : ce qui se trouve écrit et demeure faisant autorité.'
- source_word: πῶς
  choice: Comment
  rationale: « Comment » conserve la question ouverte sur la manière de lire, y compris sa possible portée interprétative.
- source_word: ἀναγινώσκεις
  choice: la lis-tu
  rationale: Le sens lexical premier est « lire ». Le pronom féminin « la » reprend naturellement « la Loi » en français, tandis qu’une note signale la nuance possible d’interprétation.
theological_decisions:
- issue: Sens de νόμος dans la question de Jésus
  choice: « la Loi », au sens de la Loi scripturaire reconnue d’Israël
  alternative: « la Torah » ou « la loi » au sens générique
  rationale: Le contexte d’un échange avec un spécialiste de la Loi renvoie aux Écritures d’Israël. « La Loi » est précis, accessible et n’enferme pas le terme dans une formulation plus spécialisée.
- issue: Nuance interprétative de πῶς ἀναγινώσκεις
  choice: Conserver « Comment la lis-tu ? » dans le texte principal
  alternative: « Comment l’interprètes-tu ? »
  rationale: Le verbe grec signifie d’abord « lire », mais la question peut aussi viser la compréhension ou l’interprétation. La traduction principale préserve cette ouverture, et la note rend l’autre nuance explicite.
translation_notes:
  register: Français international moderne, naturel et digne. L’inversion « lis-tu » convient au discours direct soutenu sans être archaïque. Le marqueur [a] figure dans le texte principal.
