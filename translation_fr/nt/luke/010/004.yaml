id: LUK.10.4
reference: Luke 10:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: μὴ βαστάζετε βαλλάντιον, μὴ πήραν, ⸀μὴ ὑποδήματα, καὶ μηδένα κατὰ τὴν ὁδὸν ἀσπάσησθε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/004.yaml
  text: Do not carry a money bag[a], a travel bag, or sandals[b], and greet no one along the road.
translation:
  language: fr
  text: Ne portez ni bourse, ni sac de voyage[a], ni sandales. Et ne saluez personne en chemin[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: On pourrait aussi traduire par « sac », « besace » ou « sac à provisions ».
    reason: lexical_alternative
  - marker: b
    text: Cette consigne n’interdit probablement pas la simple politesse; elle souligne plutôt l’urgence de la mission, qui ne laisse pas de temps pour les longues salutations sociales habituelles dans cette culture.
    reason: cultural_note
lexical_decisions:
- source_word: βαστάζετε
  choice: portez
  rationale: Dans ces consignes de voyage, βαστάζω signifie naturellement « porter »; ce choix conserve la forme directe de l’interdiction.
- source_word: βαλλάντιον
  choice: bourse
  rationale: Le terme désigne un contenant destiné à l’argent. « Bourse » est concis, courant dans ce contexte ancien et plus précis que le terme général « sac ».
- source_word: πήραν
  choice: sac de voyage
  rationale: πήρα désigne un sac servant notamment à transporter des provisions pendant un déplacement. « Sac de voyage » en exprime clairement la fonction sans imposer une forme précise.
- source_word: ὑποδήματα
  choice: sandales
  rationale: Le mot désigne ce que l’on porte aux pieds et, dans le cadre méditerranéen antique, renvoie naturellement à des sandales.
- source_word: μηδένα
  choice: personne
  rationale: Avec la négation impérative, μηδένα est rendu naturellement par « ne… personne ».
- source_word: κατὰ τὴν ὁδόν
  choice: en chemin
  rationale: Cette expression idiomatique désigne ce qui se passe pendant le trajet. « En chemin » est naturel en français et conserve le cadre du voyage.
- source_word: ἀσπάσησθε
  choice: saluez
  rationale: ἀσπάζομαι signifie ici adresser une salutation ou échanger des salutations. « Saluer » en donne le sens direct sans ajouter d’interprétation.
theological_decisions:
- issue: Portée de l’interdiction de saluer pendant le trajet
  choice: 'Conserver l’interdiction directe : « ne saluez personne en chemin »'
  alternative: 'Paraphraser : « ne vous attardez pas à échanger des salutations en chemin »'
  rationale: Le grec formule une interdiction sans en expliciter le motif. Le texte principal en préserve donc la force, tandis qu’une note signale que les salutations sociales pouvaient être longues et que l’urgence de la mission est probablement en vue.
translation_notes:
  register: Français international moderne, direct et digne. La coordination négative « ni… ni… ni… » restitue la série grecque avec naturel. La seconde phrase maintient nettement l’interdiction finale. Les appels de note sont placés sur les expressions qu’ils expliquent, en corrigeant le décalage apparent des marqueurs dans la couche anglaise de consultation.
