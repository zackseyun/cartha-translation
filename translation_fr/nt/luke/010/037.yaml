  text: ὁ δὲ εἶπεν· Ὁ ποιήσας τὸ ἔλεος μετ’ αὐτοῦ. εἶπεν ⸀δὲ αὐτῷ ὁ Ἰησοῦς· Πορεύου καὶ σὺ ποίει ὁμοίως.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/037.yaml
  text: And he said, “The one who showed mercy to him.” Then Jesus said to him, “Go, and you do likewise.”
translation:
  language: fr
  text: 'Il répondit : « C’est celui qui a fait preuve de compassion envers lui. » Jésus lui dit : « Va, et toi aussi, fais de même. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁ ποιήσας τὸ ἔλεος
  choice: celui qui a fait preuve de compassion
  rationale: L’expression grecque signifie littéralement « celui qui a fait/exercé la miséricorde ». « Faire preuve de compassion » rend naturellement l’action concrète et bienveillante désignée ici par ἔλεος.
- source_word: μετ’ αὐτοῦ
  choice: envers lui
  rationale: Dans cette expression idiomatique, μετά avec le génitif désigne la personne envers laquelle la compassion a été exercée.
- source_word: Πορεύου
  choice: Va
  rationale: Impératif présent à valeur directive, rendu directement et naturellement.
- source_word: καὶ σὺ ποίει ὁμοίως
  choice: et toi aussi, fais de même
  rationale: La mention explicite de σὺ met le destinataire en relief; « toi aussi » préserve cette insistance, tandis que « fais de même » rend idiomatiquement ὁμοίως.
theological_decisions:
- issue: Nature de l’action exprimée par τὸ ἔλεος
  choice: faire preuve de compassion
  alternative: exercer la miséricorde
  rationale: Le choix retenu évite un registre religieux spécialisé tout en conservant l’idée d’une compassion mise en pratique, sans réduire l’enseignement à un simple sentiment.
translation_notes:
  register: Français international moderne, clair et digne. Le dialogue reste direct, et l’insistance grecque sur « toi » est conservée par « toi aussi ».
