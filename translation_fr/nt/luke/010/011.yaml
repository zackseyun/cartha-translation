  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ τὸν κονιορτὸν τὸν κολληθέντα ἡμῖν ἐκ τῆς πόλεως ὑμῶν ⸂εἰς τοὺς πόδας⸃ ἀπομασσόμεθα ὑμῖν· πλὴν τοῦτο γινώσκετε ὅτι ⸀ἤγγικεν ἡ βασιλεία τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/011.yaml
  text: 'Even the dust from your city that clung to our feet[a], we wipe off against you[d][c][b]. Nevertheless know this: the kingdom of God has come near.'
translation:
  language: fr
  text: '« Même la poussière de votre ville, collée à nos pieds, nous l’essuyons contre vous[a]. Pourtant, sachez-le : le royaume de Dieu s’est approché[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe grec signifie plus précisément « essuyer » ou « enlever en essuyant », et non « secouer ». La formulation grecque concernant la poussière collée aux pieds est idiomatique et quelque peu abrupte.
    reason: lexical_alternative
  - marker: b
    text: Ou « s’est fait proche ». Le parfait grec indique que le royaume s’est approché et que cette proximité garde sa portée présente.
    reason: lexical_alternative
lexical_decisions:
- source_word: κονιορτός
  choice: poussière
  rationale: Le nom désigne précisément la poussière, et ce terme conserve la portée symbolique du geste.
- source_word: κολληθέντα
  choice: qui s’est attachée
  rationale: Le participe exprime l’adhérence de la poussière; cette formulation est naturelle en français et reste proche du grec.
- source_word: εἰς τοὺς πόδας
  choice: à nos pieds
  rationale: Dans cette tournure idiomatique quelque peu abrupte, le groupe décrit la poussière adhérant aux pieds des envoyés.
- source_word: ἀπομασσόμεθα
  choice: nous l’essuyons de nos pieds
  rationale: Le verbe signifie enlever en essuyant plutôt que secouer; la traduction évite donc le rendu traditionnel « secouer ».
- source_word: ὑμῖν
  choice: contre vous
  rationale: Dans le contexte, le datif donne au geste une orientation hostile ou testimoniale; « contre vous » en préserve la force.
- source_word: πλήν
  choice: pourtant
  rationale: Le mot introduit une réserve forte tout en restant naturel dans une déclaration orale.
- source_word: γινώσκετε
  choice: sachez-le
  rationale: L’impératif appelle les auditeurs à reconnaître ce qui suit; la reprise pronominale donne une formulation française naturelle.
- source_word: ἤγγικεν
  choice: s’est approché
  rationale: Le parfait présente une proximité désormais advenue et toujours pertinente, sans réduire le sens à une simple imminence future.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: le royaume de Dieu
  rationale: Cette expression française établie demeure claire et conserve l’image royale du grec sans trancher entre domaine et exercice du règne.
theological_decisions:
- issue: Portée du geste d’essuyer la poussière
  choice: Un geste dirigé contre la ville qui refuse le message
  alternative: Un simple geste pratique lié au voyage
  rationale: Le datif ὑμῖν et le cadre de l’envoi missionnaire donnent au geste une valeur de témoignage et de jugement, sans qu’il soit nécessaire de l’expliciter davantage dans le corps du texte.
- issue: Sens de la proximité du royaume
  choice: Le royaume de Dieu s’est réellement approché et cette proximité demeure significative
  alternative: Le royaume serait seulement imminent, ou déjà pleinement accompli
  rationale: Le parfait ἤγγικεν exprime une proximité advenue sans affirmer que l’accomplissement final est déjà total; la formulation maintient cette tension eschatologique.
translation_notes:
  register: Français international moderne, direct et digne. La syntaxe conserve la mise en relief initiale de « Même la poussière… ». « Pourtant » marque nettement le contraste, tandis que « sachez-le » restitue l’impératif de façon idiomatique.
