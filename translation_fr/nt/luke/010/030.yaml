source:
  edition: SBLGNT
  text: ὑπολαβὼν ⸀δὲ ὁ Ἰησοῦς εἶπεν· Ἄνθρωπός τις κατέβαινεν ἀπὸ Ἰερουσαλὴμ εἰς Ἰεριχὼ καὶ λῃσταῖς περιέπεσεν, οἳ καὶ ἐκδύσαντες αὐτὸν καὶ πληγὰς ἐπιθέντες ἀπῆλθον ἀφέντες ⸀ἡμιθανῆ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/030.yaml
  text: Jesus replied, “A certain man was going down from Jerusalem to Jericho, and he fell among robbers, who also stripped him, beat him, and went away, leaving him half dead.”
translation:
  language: fr
  text: 'Jésus reprit : « Un homme descendait de Jérusalem à Jéricho. Il tomba aux mains de bandits, qui le dépouillèrent, le rouèrent de coups et s’en allèrent en le laissant à demi-mort. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπολαβών
  choice: reprit
  rationale: Dans ce dialogue, le participe indique que Jésus prend la parole en réponse; « reprit » est naturel en français et conserve ce lien avec la question précédente.
- source_word: Ἄνθρωπός τις
  choice: Un homme
  rationale: Le grec introduit un personnage indéfini. « Un homme » rend naturellement l’expression sans alourdir par « un certain homme ».
- source_word: κατέβαινεν
  choice: descendait
  rationale: L’imparfait décrit le trajet en cours et correspond aussi à la descente géographique de Jérusalem vers Jéricho.
- source_word: λῃσταῖς περιέπεσεν
  choice: tomba aux mains de bandits
  rationale: Cette tournure française idiomatique exprime une rencontre hostile et involontaire; « bandits » convient à des voleurs violents.
- source_word: ἐκδύσαντες αὐτόν
  choice: le dépouillèrent
  rationale: Le verbe signifie lui retirer ses vêtements et, dans ce contexte, le voler; « dépouiller » garde ces deux dimensions.
- source_word: πληγὰς ἐπιθέντες
  choice: le rouèrent de coups
  rationale: L’expression grecque signifie littéralement lui infliger des coups; cette formulation française transmet clairement la violence répétée.
- source_word: ἡμιθανῆ
  choice: à demi-mort
  rationale: Équivalent direct qui préserve l’état intermédiaire décrit par le grec.
theological_decisions: []
