id: LUK.10.9
reference: Luke 10:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ θεραπεύετε τοὺς ἐν αὐτῇ ἀσθενεῖς, καὶ λέγετε αὐτοῖς· Ἤγγικεν ἐφ’ ὑμᾶς ἡ βασιλεία τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/009.yaml
  text: And heal the sick in it[a], and say to them, ‘The kingdom of God has come near to you.’
translation:
  language: fr
  text: 'Guérissez les malades qui s’y trouvent et dites-leur : « Le royaume de Dieu s’est approché de vous. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θεραπεύετε
  choice: Guérissez
  rationale: L’impératif présent appelle les envoyés à exercer cette action dans les localités où ils sont accueillis. « Guérissez » exprime directement le sens médical que le contexte donne au verbe.
- source_word: τοὺς ἐν αὐτῇ ἀσθενεῖς
  choice: les malades qui s’y trouvent
  rationale: Avec θεραπεύετε, ἀσθενεῖς désigne ici les personnes malades plutôt que les faibles en général. « qui s’y trouvent » renvoie naturellement à la ville mentionnée au verset précédent, sans ambiguïté de référent.
- source_word: λέγετε αὐτοῖς
  choice: dites-leur
  rationale: Cette formulation simple et directe reproduit l’impératif de parole.
- source_word: Ἤγγικεν
  choice: s’est approché
  rationale: Le passé composé rend l’approche accomplie et sa pertinence présente, sans réduire l’expression au seul état « est proche » ni affirmer une pleine réalisation.
- source_word: ἐφ’ ὑμᾶς
  choice: de vous
  rationale: Avec « s’approcher », « de vous » est la construction française naturelle pour exprimer la proximité atteinte par rapport aux destinataires. Elle évite le tour artificiel « sur vous ».
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: Le royaume de Dieu
  rationale: Expression biblique consacrée, claire en français moderne, qui conserve l’étendue sémantique du grec sans la limiter au seul exercice dynamique du règne.
theological_decisions:
- issue: Portée de l’annonce du royaume
  choice: L’annonce affirme que le royaume de Dieu s’est approché des auditeurs dans la mission des envoyés, sans préciser qu’il est déjà pleinement réalisé ni qu’il demeure seulement futur.
  alternative: « Le royaume de Dieu est proche de vous », qui pourrait être compris comme une simple imminence future.
  rationale: Le parfait ἤγγικεν présente une approche accomplie ayant une portée actuelle, mais le verset ne résout pas toute la tension entre présence et accomplissement futur. « s’est approché » préserve cette tension.
translation_notes:
  register: Français international moderne, naturel et digne. La coordination est rendue sans « Et » initial, inutile en français courant. « Les malades qui s’y trouvent » explicite sobrement le renvoi de ἐν αὐτῇ à la ville du contexte immédiat.
