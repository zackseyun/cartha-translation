id: LUK.10.1
reference: Luke 10:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Μετὰ δὲ ταῦτα ἀνέδειξεν ὁ κύριος ⸀καὶ ἑτέρους ἑβδομήκοντα ⸀δύο καὶ ἀπέστειλεν αὐτοὺς ἀνὰ δύο ⸁δύο πρὸ προσώπου αὐτοῦ εἰς πᾶσαν πόλιν καὶ τόπον οὗ ἤμελλεν αὐτὸς ἔρχεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/001.yaml
  text: After these things[a], the Lord appointed seventy-two others also, and sent them two by two ahead of him into every town and place where he himself was about to go.
translation:
  language: fr
  text: Après cela, le Seigneur désigna encore soixante-douze[a] autres personnes et les envoya deux par deux devant lui, dans toute ville et tout lieu où lui-même allait se rendre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Certains manuscrits portent « soixante-dix » au lieu de « soixante-douze ».
    reason: textual_variant
lexical_decisions:
- source_word: Μετὰ δὲ ταῦτα
  choice: Après cela
  rationale: Rend naturellement en français moderne la transition temporelle exprimée par la locution grecque, sans alourdir la phrase.
- source_word: ἀνέδειξεν
  choice: désigna
  rationale: Le verbe indique ici le choix officiel de personnes en vue d’une mission. « Désigna » est précis sans ajouter une nuance ecclésiastique absente du texte.
- source_word: ὁ κύριος
  choice: le Seigneur
  rationale: Traduction française habituelle de κύριος dans ce contexte, où le titre renvoie à Jésus.
- source_word: καὶ ἑτέρους ἑβδομήκοντα δύο
  choice: encore soixante-douze autres personnes
  rationale: « Encore » rend la valeur additive de καί, tandis que « autres » traduit ἑτέρους. « Personnes » évite d’ajouter « disciples », terme implicite dans le contexte mais absent du grec.
- source_word: ἀπέστειλεν
  choice: les envoya
  rationale: Traduction directe et naturelle qui conserve l’acte d’envoi sans lui imposer une nuance technique supplémentaire.
- source_word: ἀνὰ δύο δύο
  choice: deux par deux
  rationale: Cette tournure française idiomatique reproduit clairement la valeur distributive et la répétition du grec.
- source_word: πρὸ προσώπου αὐτοῦ
  choice: devant lui
  rationale: Dans ce contexte, l’expression signifie qu’ils précèdent Jésus et préparent son passage. « Devant lui » conserve l’image grecque tout en restant naturel.
- source_word: εἰς πᾶσαν πόλιν καὶ τόπον
  choice: dans toute ville et tout lieu
  rationale: Conserve les deux substantifs et la formulation distributive du grec, sans limiter πόλις aux seules grandes agglomérations.
- source_word: οὗ ἤμελλεν αὐτὸς ἔρχεσθαι
  choice: où lui-même allait se rendre
  rationale: « Allait se rendre » exprime le futur proche ou projeté de μέλλω avec l’infinitif. « Lui-même » maintient l’insistance portée par αὐτός.
theological_decisions:
- issue: Variante textuelle concernant le nombre de personnes désignées
  choice: soixante-douze
  alternative: soixante-dix
  rationale: Le texte du SBLGNT fourni porte ἑβδομήκοντα δύο (« soixante-douze »). La variante bien attestée « soixante-dix » est signalée en note plutôt que supprimée ou adoptée silencieusement.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve la progression et les répétitions significatives du grec, tout en évitant les archaïsmes et les ajouts interprétatifs.
