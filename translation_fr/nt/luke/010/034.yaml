id: LUK.10.34
reference: Luke 10:34
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ προσελθὼν κατέδησεν τὰ τραύματα αὐτοῦ ἐπιχέων ἔλαιον καὶ οἶνον, ἐπιβιβάσας δὲ αὐτὸν ἐπὶ τὸ ἴδιον κτῆνος ἤγαγεν αὐτὸν εἰς πανδοχεῖον καὶ ἐπεμελήθη αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/034.yaml
  text: And coming near[a], he bound up his wounds, pouring on oil and wine. Then he put him on his own animal, brought him to an inn[b], and took care of him.
translation:
  language: fr
  text: Il s’approcha de lui, banda ses blessures en y versant de l’huile et du vin. Puis il le plaça sur sa propre monture, le conduisit dans une auberge et prit soin de lui.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσελθὼν
  choice: Il s’approcha de lui
  rationale: Le participe aoriste exprime le mouvement vers l’homme blessé avant ou au moment de lui prodiguer les premiers soins. L’ajout de « de lui » est naturel en français et explicite la relation déjà claire dans le contexte.
- source_word: κατέδησεν
  choice: banda
  rationale: Le verbe signifie ici envelopper ou panser des blessures. « Banda » est précis, courant et conserve l’image concrète de liens appliqués aux plaies.
- source_word: τὰ τραύματα
  choice: ses blessures
  rationale: « Blessures » est l’équivalent direct et naturel dans le contexte d’une agression physique.
- source_word: ἐπιχέων
  choice: en y versant
  rationale: Le participe présent indique la manière dont les blessures sont soignées. Le pronom « y » rattache clairement l’huile et le vin aux blessures sans alourdir la phrase.
- source_word: ἔλαιον
  choice: de l’huile
  rationale: « Huile » correspond directement au grec. Il s’agissait vraisemblablement d’huile d’olive, mais le texte ne le précise pas lexicalement.
- source_word: οἶνον
  choice: du vin
  rationale: Équivalent direct du terme grec, sans ajouter dans le texte une explication sur son usage médicinal.
- source_word: ἐπιβιβάσας
  choice: il le plaça sur
  rationale: Cette formulation exprime naturellement l’action de soulever ou d’installer l’homme blessé sur l’animal.
- source_word: τὸ ἴδιον κτῆνος
  choice: sa propre monture
  rationale: κτῆνος désigne un animal domestique servant au transport ou de bête de somme. « Monture » convient ici puisque l’homme y est placé, tandis que « propre » préserve l’insistance de ἴδιον sur la possession personnelle.
- source_word: πανδοχεῖον
  choice: une auberge
  rationale: Terme français usuel pour un établissement accueillant et hébergeant des voyageurs.
- source_word: ἐπεμελήθη
  choice: prit soin de lui
  rationale: Cette expression naturelle rend l’attention personnelle et concrète exprimée par le verbe grec.
theological_decisions: []
