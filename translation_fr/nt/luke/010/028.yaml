id: LUK.10.28
reference: Luke 10:28
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἶπεν δὲ αὐτῷ· Ὀρθῶς ἀπεκρίθης· τοῦτο ποίει καὶ ζήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/028.yaml
  text: And he said to him[a], “You have answered correctly. Do this[b], and you will live.”
translation:
  language: fr
  text: 'Il lui dit : « Tu as répondu correctement. Fais cela, et tu vivras[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le contexte plus large concerne la vie éternelle (voir Luc 10.25), mais le grec dit ici simplement : « tu vivras ».'
    reason: cross_reference
lexical_decisions:
- source_word: εἶπεν δὲ αὐτῷ
  choice: Il lui dit
  rationale: Le verbe εἶπεν est un aoriste narratif de λέγω. En français, le passé simple « dit » convient au récit. δέ est une liaison légère qu’il n’est pas nécessaire de rendre explicitement, et αὐτῷ donne « lui ».
- source_word: Ὀρθῶς ἀπεκρίθης
  choice: Tu as répondu correctement
  rationale: Ὀρθῶς signifie « correctement, avec justesse ». Le passé composé rend naturellement en français moderne la réponse achevée que Jésus vient d’évaluer.
- source_word: τοῦτο ποίει
  choice: Fais cela
  rationale: τοῦτο renvoie au commandement qui vient d’être cité. L’impératif présent ποίει peut suggérer une pratique continue, mais « Fais cela » reste naturel et conserve cette possibilité sans l’expliciter excessivement.
- source_word: καὶ ζήσῃ
  choice: et tu vivras
  rationale: Le futur de ζάω signifie simplement « tu vivras ». Cette formulation préserve la concision du grec sans ajouter « éternellement » ni « tu hériteras de la vie éternelle ».
theological_decisions:
- issue: Portée de « tu vivras » dans le contexte de la vie éternelle
  choice: Traduire simplement « tu vivras » dans le texte principal.
  alternative: « tu auras la vie éternelle » ou « tu hériteras de la vie éternelle »
  rationale: La question de Luc 10.25 porte sur la vie éternelle, mais cette proposition dit seulement καὶ ζήσῃ, « et tu vivras ». La traduction maintient donc la tension entre la formulation brève du verset et son contexte plus large.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement correspond au singulier grec et au dialogue direct. La liaison δέ reste implicite afin d’éviter un « et » initial peu naturel en français.
