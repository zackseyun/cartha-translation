source:
  edition: SBLGNT
  text: ⸀τίς τούτων τῶν τριῶν πλησίον δοκεῖ σοι γεγονέναι τοῦ ἐμπεσόντος εἰς τοὺς λῃστάς;
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/036.yaml
  text: Which of these three seems to you to have become a neighbor to the man who fell among the robbers?[a]
translation:
  language: fr
  text: Lequel de ces trois te semble être devenu le prochain de l’homme qui était tombé aux mains des bandits ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Lequel de ces trois, à ton avis, a été le prochain de l’homme qui était tombé aux mains des bandits ? » Le grec dit plus littéralement « te semble être devenu le prochain », ce qui souligne le fait de se faire prochain.
    reason: lexical_alternative
lexical_decisions:
- source_word: τίς
  choice: Lequel
  rationale: Introduit un choix parmi un ensemble défini (« ces trois ») ; « Lequel » est naturel et précis en français.
- source_word: τούτων τῶν τριῶν
  choice: de ces trois
  rationale: Rend directement le génitif partitif sans ajouter « hommes », absent du grec.
- source_word: πλησίον
  choice: le prochain
  rationale: Le substantif désigne ici la personne qui se fait proche d’une autre. « Le prochain » conserve le vocabulaire éthique caractéristique du contexte biblique.
- source_word: δοκεῖ σοι
  choice: te semble
  rationale: Conserve explicitement l’idée de δοκεῖ (« sembler ») et le pronom σοι (« à toi »), plutôt que de paraphraser par « à ton avis ».
- source_word: γεγονέναι
  choice: être devenu
  rationale: Le parfait infinitif de γίνομαι exprime le fait de devenir, et non simplement un état ; cette formulation préserve le renversement de la question vers celui qui se fait prochain.
- source_word: τοῦ ἐμπεσόντος
  choice: de l’homme qui était tombé
  rationale: Le participe substantivé désigne la victime déjà présentée dans le récit. « L’homme » est contextuellement naturel, tandis que le plus-que-parfait situe sa mésaventure avant l’action évoquée.
- source_word: εἰς τοὺς λῃστάς
  choice: aux mains des bandits
  rationale: Rend idiomatiquement le fait de tomber au pouvoir de λῃσταί. « Bandits » convient à des brigands violents, et « aux mains de » explicite en français l’idiome grec sans modifier son sens.
theological_decisions:
- issue: Orientation éthique de la question dans la parabole du bon Samaritain
  choice: Traduire γίνομαι par « être devenu » afin de préserver le passage de la recherche de son prochain à l’action de se faire prochain.
  alternative: Traduire de manière plus statique par « a été le prochain » ou « s’est montré le prochain ».
  rationale: Le grec met l’accent sur ce que l’un des trois est devenu pour la victime. La traduction retenue conserve cette tension éthique sans intégrer l’explication directement au texte.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement correspond à l’échange direct entre Jésus et le spécialiste de la Loi. « Le prochain » maintient le lien lexical avec la question formulée en Luc 10.29, tandis que « être devenu » préserve l’accent propre à la réponse de Jésus.
