  text: Ὁ δὲ θέλων ⸀δικαιῶσαι ἑαυτὸν εἶπεν πρὸς τὸν Ἰησοῦν· Καὶ τίς ἐστίν μου πλησίον;
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/029.yaml
  text: But he[a], wanting to justify himself, said to Jesus, “And who is my neighbor?”
translation:
  language: fr
  text: 'Mais lui, voulant se justifier, dit à Jésus : « Et qui est mon prochain[a] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Qui dois-je considérer comme mon prochain ? »'
    reason: Alternative lexicale et interprétative explicitant la portée possible de la question grecque.
lexical_decisions:
- source_word: θέλων
  choice: voulant
  rationale: Le participe présent exprime le mobile ou l’intention de l’homme. « Voulant » en conserve directement la valeur tout en restant naturel en français.
- source_word: δικαιῶσαι ἑαυτὸν
  choice: se justifier
  rationale: Dans ce contexte, l’expression évoque la volonté de montrer qu’il a raison ou qu’il est dans son droit. « Se justifier » est idiomatique en français et préserve la portée du verbe sans lui imposer ici un sens doctrinal technique.
- source_word: εἶπεν πρὸς τὸν Ἰησοῦν
  choice: dit à Jésus
  rationale: Formule narrative simple et directe, conforme à l’usage courant du français.
- source_word: Καὶ
  choice: Et
  rationale: La conjonction introduit la question qui prolonge l’échange. Sa conservation respecte le mouvement du dialogue grec.
- source_word: τίς ἐστίν μου πλησίον
  choice: qui est mon prochain
  rationale: πλησίον est employé comme substantif et renvoie au vocabulaire du commandement cité dans le contexte. « Mon prochain » est la formulation française traditionnelle, toujours claire et exacte.
theological_decisions:
- issue: Sens de δικαιῶσαι ἑαυτόν
  choice: L’homme cherche à se justifier, c’est-à-dire à montrer qu’il a raison ou qu’il est dans son droit.
  alternative: L’homme cherche à se faire reconnaître comme juste dans un sens moral ou devant les personnes présentes.
  rationale: Le contexte est celui d’un échange juridique et éthique. La formulation française conserve l’ironie narrative et l’ambiguïté possible de « se justifier », sans transformer le passage en énoncé technique sur la justification.
- issue: Portée de « mon prochain »
  choice: 'La question est traduite littéralement : « qui est mon prochain ? »'
  alternative: « Qui dois-je considérer comme mon prochain ? »
  rationale: La formulation grecque directe laisse ouverte la manière dont l’homme cherche à délimiter la catégorie du prochain. L’explicitation interprétative est donc signalée en note plutôt qu’intégrée au texte.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe conserve le participe de motif et la conjonction ouvrant la question. Le terme « prochain » maintient le lien avec le commandement biblique cité dans le contexte.
