id: LUK.10.25
reference: Luke 10:25
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ ἰδοὺ νομικός τις ἀνέστη ἐκπειράζων ⸀αὐτὸν λέγων· Διδάσκαλε, τί ποιήσας ζωὴν αἰώνιον κληρονομήσω;
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/025.yaml
  text: And behold[a], a lawyer stood up, testing him, saying, “Teacher, what must I do to inherit eternal life?”
translation:
  language: fr
  text: 'Et voici qu’un spécialiste de la Loi[a] se leva pour le mettre à l’épreuve. Il lui demanda : « Maître, que dois-je faire pour hériter de la vie éternelle ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « docteur de la Loi ». Le terme grec désigne ici un spécialiste de la loi de Moïse.
    reason: Précise le sens historique et religieux du terme et signale une traduction française traditionnelle possible.
lexical_decisions:
- source_word: Καὶ ἰδοὺ
  choice: Et voici que
  rationale: Conserve le marqueur narratif et sa fonction d’appel à l’attention, dans une tournure française naturelle et digne.
- source_word: νομικός τις
  choice: un spécialiste de la Loi
  rationale: Dans ce contexte, le terme désigne un connaisseur de la loi de Moïse, et non un juriste au sens civil moderne. Cette formulation explicite le référent historique sans alourdir le texte.
- source_word: ἀνέστη
  choice: se leva
  rationale: Rend directement l’action exprimée par l’aoriste et convient naturellement à la scène.
- source_word: ἐκπειράζων αὐτόν
  choice: pour le mettre à l’épreuve
  rationale: Exprime la visée du personnage et la nuance de test appuyé ou potentiellement hostile, sans suggérer nécessairement une incitation au péché.
- source_word: λέγων
  choice: Il lui demanda
  rationale: Restructure le participe grec en une phrase française fluide tout en conservant l’acte de parole, qui prend ici la forme d’une question adressée à Jésus.
- source_word: Διδάσκαλε
  choice: Maître
  rationale: Titre d’adresse français courant pour un enseignant reconnu dans ce contexte; il évite la lourdeur de « Enseignant » tout en gardant la fonction de διδάσκαλος.
- source_word: τί ποιήσας
  choice: que dois-je faire
  rationale: Rend idiomatiquement le participe aoriste lié au futur comme condition ou moyen envisagé, sans effacer la manière dont l’homme formule sa question.
- source_word: ζωὴν αἰώνιον
  choice: la vie éternelle
  rationale: Équivalent français établi, précis et immédiatement compréhensible.
- source_word: κληρονομήσω
  choice: hériter de
  rationale: Préserve la métaphore de l’héritage portée par le verbe grec, plutôt que de l’aplatir en « obtenir » ou « recevoir ».
theological_decisions:
- issue: Sens de νομικός dans le contexte juif du premier siècle
  choice: spécialiste de la Loi
  alternative: docteur de la Loi; juriste
  rationale: Le personnage est compétent dans l’interprétation de la Torah. « Spécialiste de la Loi » communique clairement ce sens au lectorat moderne sans évoquer principalement un avocat ou le titulaire contemporain d’un doctorat.
- issue: Portée de τί ποιήσας … κληρονομήσω
  choice: que dois-je faire pour hériter de la vie éternelle ?
  alternative: que faut-il que j’aie fait pour hériter de la vie éternelle ?; que ferai-je pour hériter de la vie éternelle ?
  rationale: La formulation conserve la question pratique de l’homme et la tension entre « faire » et « hériter », sans imposer au verset une résolution doctrinale extérieure au texte.
translation_notes:
  register: Français international moderne, clair et digne. « Et voici que » maintient la vivacité narrative légèrement soutenue de l’original. La division en deux phrases rend naturellement le participe λέγων sans modifier le déroulement de la scène.
