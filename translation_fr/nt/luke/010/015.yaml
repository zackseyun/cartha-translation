id: LUK.10.15
reference: Luke 10:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ σύ, Καφαρναούμ, ⸂μὴ ἕως οὐρανοῦ ὑψωθήσῃ⸃; ἕως ⸀τοῦ ᾅδου ⸀καταβιβασθήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/015.yaml
  text: And you[a], Capernaum, will you be exalted to heaven? You will be brought down to Hades.
translation:
  language: fr
  text: Et toi, Capharnaüm, seras-tu élevée jusqu’au ciel ? Tu seras abaissée jusque dans le séjour des morts.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Grec : « l’Hadès ». Ce terme désigne le séjour des morts, à distinguer de la géhenne.'
    reason: Préciser le terme grec et éviter sa confusion avec la géhenne ou avec une conception plus déterminée de l’enfer.
lexical_decisions:
- source_word: Καφαρναούμ
  choice: Capharnaüm
  rationale: Forme française traditionnelle et immédiatement reconnaissable du nom de lieu.
- source_word: μὴ ... ὑψωθήσῃ
  choice: seras-tu élevée
  rationale: La construction est comprise comme une question rhétorique appelant une réponse négative. « Élevée » conserve à la fois l’image verticale et la notion possible d’exaltation. Le féminin suit l’usage français pour une ville.
- source_word: ἕως οὐρανοῦ
  choice: jusqu’au ciel
  rationale: « Jusqu’à » exprime précisément la limite ou l’étendue marquée par ἕως et maintient le contraste vertical avec la descente qui suit.
- source_word: ἕως τοῦ ᾅδου
  choice: jusqu’au séjour des morts
  rationale: Cette expression française rend le domaine des morts désigné par ᾅδης sans le confondre avec la géhenne ni importer automatiquement la notion d’enfer comme lieu du châtiment final.
- source_word: καταβιβασθήσῃ
  choice: tu descendras
  rationale: Le français naturel emploie ici l’intransitif, même si le grec est passif et signifie littéralement « tu seras abaissée/fais descendre ». Le contexte conserve clairement l’idée d’abaissement en jugement.
theological_decisions:
- issue: Sens de ᾅδης
  choice: séjour des morts
  alternative: Hadès ; enfer
  rationale: « Séjour des morts » communique le sens du terme grec à un lectorat moderne tout en préservant sa distinction d’avec la géhenne. « Enfer » risquerait de trancher une question théologique que le lexème ne tranche pas à lui seul.
- issue: Valeur de μὴ avec le futur
  choice: 'question rhétorique : « seras-tu élevée… ? »'
  alternative: 'affirmation négative : « tu ne seras pas élevée… »'
  rationale: La question conserve la forme et la force rhétoriques du grec ainsi que la réponse négative attendue, sans transformer implicitement la phrase en déclaration.
translation_notes:
  register: Français international moderne, digne et direct. L’adresse à la ville est au féminin selon l’usage français. Le parallélisme « jusqu’au ciel / jusqu’au séjour des morts » est conservé.
