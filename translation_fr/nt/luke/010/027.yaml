id: LUK.10.27
reference: Luke 10:27
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν· Ἀγαπήσεις κύριον τὸν θεόν σου ἐξ ὅλης ⸀τῆς καρδίας σου καὶ ⸂ἐν ὅλῃ τῇ ψυχῇ⸃ σου καὶ ⸂ἐν ὅλῃ τῇ ἰσχύϊ⸃ σου καὶ ⸂ἐν ὅλῃ τῇ διανοίᾳ⸃ σου, καὶ τὸν πλησίον σου ὡς σεαυτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/027.yaml
  text: And he answered, “You shall love the Lord your God from all your heart and with all your soul and with all your strength and with all your mind, and your neighbor as yourself.”
translation:
  language: fr
  text: 'Il répondit : « Tu aimeras le Seigneur ton Dieu de tout ton cœur[a], de toute ton âme, de toute ta force et de toute ton intelligence, et ton prochain comme toi-même. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec emploie ἐξ (« de, hors de ») avec « cœur », puis ἐν avec l’âme, la force et l’intelligence. En français, « de tout/de toute » est la tournure idiomatique dans toute l’énumération.
    reason: Précision sur l’alternance prépositionnelle du grec, que le français ne reproduit pas naturellement dans cette formule.
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: Il répondit
  rationale: Cette formulation française naturelle rend sans perte de sens la construction narrative grecque, littéralement « ayant répondu, il dit ».
- source_word: Ἀγαπήσεις
  choice: Tu aimeras
  rationale: Le futur de l’indicatif reprend ici la formulation d’un commandement scripturaire. Le futur français en conserve la force et l’écho intertextuel.
- source_word: κύριον τὸν θεόν σου
  choice: le Seigneur ton Dieu
  rationale: « Seigneur » convient au titre divin κύριος dans cette citation concernant le Dieu d’Israël, tandis que θεός est directement rendu par « Dieu ».
- source_word: ἐξ ὅλης τῆς καρδίας σου
  choice: de tout ton cœur
  rationale: Expression française idiomatique qui rend la totalité de l’engagement du cœur et convient à la préposition grecque ἐξ, sans produire le tour artificiel « depuis tout ton cœur ».
- source_word: ἐν ὅλῃ τῇ ψυχῇ σου
  choice: de toute ton âme
  rationale: « Âme » conserve le terme traditionnel et la portée de ψυχή dans cette énumération, sans imposer une anthropologie technique.
- source_word: ἐν ὅλῃ τῇ ἰσχύϊ σου
  choice: de toute ta force
  rationale: ἰσχύς désigne la force ou la puissance dont une personne dispose ; « force » est clair et naturel dans ce commandement.
- source_word: ἐν ὅλῃ τῇ διανοίᾳ σου
  choice: de toute ta pensée
  rationale: διάνοια désigne la faculté de penser ou de comprendre. « Pensée » est naturel dans cette série et maintient la distinction avec le cœur et l’âme.
- source_word: τὸν πλησίον σου ὡς σεαυτόν
  choice: ton prochain comme toi-même
  rationale: Formulation française établie et exacte, qui conserve la catégorie relationnelle de πλησίον et la comparaison exprimée par ὡς.
theological_decisions:
- issue: Titre divin κύριος dans la citation du commandement
  choice: Seigneur
  alternative: Maître
  rationale: Dans cette citation scripturaire, κύριος renvoie au Dieu d’Israël. « Seigneur » conserve le poids théologique et la résonance canonique du titre.
- issue: Énumération anthropologique καρδία, ψυχή, ἰσχύς, διάνοια
  choice: 'Conserver les quatre termes : cœur, âme, force et pensée'
  alternative: Les regrouper dans une paraphrase telle que « de tout ton être »
  rationale: Ces termes qui se recouvrent partiellement expriment ensemble la totalité de l’amour demandé. Les maintenir préserve la plénitude rhétorique sans figer une anthropologie technique ni aplanir le texte.
- issue: Valeur du futur Ἀγαπήσεις
  choice: Tu aimeras
  alternative: Tu dois aimer / Aime
  rationale: Le futur français respecte la forme du commandement cité et son écho scripturaire, sans en atténuer la portée impérative.
translation_notes:
  register: Français international moderne, courant et digne. Le tutoiement correspond au singulier grec et au style traditionnel du commandement. La syntaxe conserve l’accumulation solennelle des quatre dimensions sans devenir artificielle.
