id: LUK.10.12
reference: Luke 10:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: λέγω ὑμῖν ὅτι Σοδόμοις ἐν τῇ ἡμέρᾳ ἐκείνῃ ἀνεκτότερον ἔσται ἢ τῇ πόλει ἐκείνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/012.yaml
  text: I tell you[b][a], it will be more bearable for Sodom on that day than for that city.
translation:
  language: fr
  text: 'Je vous le dis : ce sera plus supportable[a] pour Sodome, en ce jour-là[b], que pour cette ville.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « plus tolérable ». Le comparatif grec ἀνεκτότερον permet les deux traductions.
    reason: lexical_alternative
  - marker: b
    text: « Ce jour-là » désigne le jour du jugement divin; certains passages parallèles le disent explicitement.
    reason: cross_reference
lexical_decisions:
- source_word: λέγω ὑμῖν
  choice: Je vous le dis
  rationale: Formulation idiomatique et solennelle en français moderne, qui conserve l’adresse directe.
- source_word: Σοδόμοις
  choice: pour Sodome
  rationale: Le nom de lieu est employé par métonymie pour ses habitants, comme en grec, sans explicitation excessive.
- source_word: ἐν τῇ ἡμέρᾳ ἐκείνῃ
  choice: en ce jour-là
  rationale: Expression temporelle française naturelle qui préserve la référence judiciaire et eschatologique sans ajouter « jugement » au texte principal.
- source_word: ἀνεκτότερον
  choice: plus supportable
  rationale: Rend clairement le comparatif grec indiquant ce qui est plus facile à supporter; « plus tolérable » demeure possible.
- source_word: ἔσται
  choice: ce sera
  rationale: Rend simplement le futur de εἰμί dans la construction comparative impersonnelle.
- source_word: ἢ τῇ πόλει ἐκείνῃ
  choice: que pour cette ville
  rationale: Conserve la comparaison et le démonstratif renvoyant à la ville précédemment évoquée.
theological_decisions:
- issue: Nature de « ce jour-là »
  choice: Conserver « en ce jour-là » dans le texte principal.
  alternative: « au jour du jugement »
  rationale: Le contexte renvoie au jugement divin, mais ce verset ne le nomme pas explicitement; la formulation conserve donc l’implicite du grec.
translation_notes:
  register: Français international moderne, naturel et digne. La tournure « Je vous le dis » garde la force solennelle de l’affirmation, tandis que « cette ville » maintient le renvoi au contexte immédiat.
