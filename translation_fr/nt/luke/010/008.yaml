id: LUK.10.8
reference: Luke 10:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ εἰς ἣν ἂν πόλιν εἰσέρχησθε καὶ δέχωνται ὑμᾶς, ἐσθίετε τὰ παρατιθέμενα ὑμῖν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/008.yaml
  text: And into whatever city you enter[a], if they receive you, eat what is set before you[b],
translation:
  language: fr
  text: Dans toute ville où vous entrez et où l’on vous accueille, mangez ce qui vous est servi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰς ἣν ἂν πόλιν
  choice: Dans toute ville où
  rationale: La relative avec ἄν exprime une généralité indéfinie. « Dans toute ville où » est naturel en français et conserve l’idée de l’entrée dans n’importe quelle ville concernée.
- source_word: εἰσέρχησθε
  choice: vous entrerez
  rationale: Le présent du subjonctif grec appartient à une construction générale. Le futur français convient naturellement à cette instruction portant sur les situations à venir.
- source_word: δέχωνται ὑμᾶς
  choice: où l’on vous accueillera
  rationale: Dans ce contexte d’hospitalité, δέχομαι signifie recevoir favorablement, donc « accueillir ». Le pronom indéfini « on » rend naturellement le sujet pluriel non précisé.
- source_word: ἐσθίετε
  choice: mangez
  rationale: L’impératif présent donne une instruction directe ; l’impératif français simple en restitue clairement la force.
- source_word: τὰ παρατιθέμενα ὑμῖν
  choice: ce qu’on vous servira
  rationale: Dans un contexte de repas, παρατίθημι désigne ce qui est placé devant quelqu’un. « Ce qu’on vous servira » est l’équivalent idiomatique moderne, tout en gardant la référence générale aux aliments offerts.
theological_decisions: []
translation_notes:
  register: Français international moderne, simple et digne. La formulation privilégie l’idiome naturel sans développer l’instruction ni résoudre une question théologique absente du verset.
