id: LUK.10.16
reference: Luke 10:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ὁ ἀκούων ὑμῶν ἐμοῦ ἀκούει, καὶ ὁ ἀθετῶν ὑμᾶς ἐμὲ ἀθετεῖ· ὁ δὲ ἐμὲ ἀθετῶν ἀθετεῖ τὸν ἀποστείλαντά με.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/016.yaml
  text: The one who hears you hears me[a], and the one who rejects you rejects me; but the one who rejects me rejects the one who sent me.
translation:
  language: fr
  text: Celui qui vous écoute m’écoute, et celui qui vous rejette[a] me rejette ; mais celui qui me rejette rejette celui qui m’a envoyé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « écarte », « méprise » ou « tient pour nul » ; le verbe grec ἀθετέω exprime le refus ou la mise à l’écart.
    reason: alternative lexicale
lexical_decisions:
- source_word: Ὁ ἀκούων
  choice: Celui qui écoute
  rationale: Le participe présent substantivé désigne de façon générale toute personne caractérisée par cette action. « Celui qui » conserve le singulier représentatif et la structure du grec tout en restant naturel en français.
- source_word: ὑμῶν
  choice: vous
  rationale: Le génitif après ἀκούω désigne ici les personnes entendues. Traduire directement par « vous » préserve l’identification personnelle sans ajouter « votre message », absent du grec.
- source_word: ἐμοῦ
  choice: m’
  rationale: 'Le génitif parallèle à ὑμῶν garde la portée personnelle de l’affirmation : écouter les disciples, c’est écouter Jésus lui-même.'
- source_word: ἀκούει
  choice: écoute
  rationale: « Écouter » est l’équivalent français naturel quand le complément désigne une personne et conserve la répétition d’ἀκούω. Dans ce contexte, le verbe implique l’accueil de la parole entendue, sans qu’il soit nécessaire d’ajouter « obéir ».
- source_word: ὁ ἀθετῶν
  choice: celui qui rejette
  rationale: ἀθετέω peut signifier rejeter, tenir pour nul, écarter ou mépriser. Dans ce contexte relationnel où les disciples représentent Jésus, « rejeter » exprime clairement le refus de leur autorité sans technicité.
- source_word: ὑμᾶς
  choice: vous
  rationale: Le complément direct désigne les disciples eux-mêmes. « Vous » conserve cette portée personnelle au lieu de la réduire à leur seul message.
- source_word: ἐμὲ ἀθετεῖ
  choice: me rejette
  rationale: La répétition de « rejette » reproduit l’enchaînement rhétorique du grec et l’identification entre Jésus et ses envoyés.
- source_word: δὲ
  choice: mais
  rationale: δέ introduit une légère progression contrastive vers la dernière proposition. « Mais » rend nettement cette articulation sans la surcharger.
- source_word: τὸν ἀποστείλαντά με
  choice: celui qui m’a envoyé
  rationale: Le participe aoriste substantivé se rend naturellement ainsi. La formulation garde le référent implicite, comme en grec, sans ajouter « le Père ».
theological_decisions:
- issue: Identification de Jésus à ses messagers mandatés
  choice: 'Conserver la chaîne personnelle directe : écouter ou rejeter les disciples revient à écouter ou rejeter Jésus, et rejeter Jésus revient à rejeter celui qui l’a envoyé.'
  alternative: Paraphraser en parlant seulement d’écouter ou de rejeter le message des disciples.
  rationale: Le grec emploie les pronoms personnels « vous » et « moi », non des noms abstraits comme « message » ou « enseignement ». La traduction préserve donc le rapport de représentation sans le réduire à l’accueil d’un contenu.
- issue: Référent de « celui qui m’a envoyé »
  choice: Laisser le référent implicite.
  alternative: 'Expliciter : « le Père qui m’a envoyé » ou « Dieu qui m’a envoyé ».'
  rationale: Le contexte permet d’identifier le référent à Dieu le Père, mais le verset ne le nomme pas. La formulation implicite respecte le texte et sa force théologique.
translation_notes:
  register: Français international moderne, clair et digne. La structure répétitive et le singulier générique sont maintenus pour préserver la concision et la progression solennelle de la parole de Jésus. Le marqueur de note [a] est placé à la première occurrence de « rejette », où l’alternative lexicale s’applique ensuite aux répétitions du même verbe grec.
