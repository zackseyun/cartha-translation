id: LUK.10.13
reference: Luke 10:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Οὐαί σοι, Χοραζίν· οὐαί σοι, Βηθσαϊδά· ὅτι εἰ ἐν Τύρῳ καὶ Σιδῶνι ⸀ἐγενήθησαν αἱ δυνάμεις αἱ γενόμεναι ἐν ὑμῖν, πάλαι ἂν ἐν σάκκῳ καὶ σποδῷ ⸀καθήμενοι μετενόησαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/013.yaml
  text: Woe to you[a], Chorazin! Woe to you, Bethsaida! For if the mighty works that happened among you had happened in Tyre and Sidon, long ago they would have repented[b], sitting in sackcloth and ashes.
translation:
  language: fr
  text: « Malheur à toi, Chorazin ! Malheur à toi, Bethsaïda ! Car si les actes de puissance qui se sont produits chez vous s’étaient produits à Tyr et à Sidon, leurs habitants se seraient repentis il y a longtemps, assis dans le sac et la cendre[a]. »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ils auraient changé de vie il y a longtemps » ; le verbe grec exprime un changement profond de pensée et d’orientation.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐαί σοι
  choice: Quel malheur pour toi
  rationale: Cette tournure française conserve à la fois la dénonciation prophétique et la lamentation, tout en étant plus naturelle en français moderne que le littéral « Malheur à toi » dans une adresse répétée.
- source_word: Χοραζίν / Βηθσαϊδά
  choice: Chorazin / Bethsaïda
  rationale: Formes françaises usuelles des noms de lieux bibliques.
- source_word: δυνάμεις
  choice: actes de puissance
  rationale: 'Cette expression garde les deux composantes du terme grec : des actes concrets qui manifestent une puissance. « Miracles » serait plus immédiatement courant, mais aussi légèrement plus interprétatif.'
- source_word: ἐγενήθησαν ... αἱ γενόμεναι
  choice: accomplis ... avaient eu lieu
  rationale: Le français évite une répétition lourde tout en rendant l'idée d'événements survenus; « accomplis » convient naturellement aux actes, et « avaient eu lieu » à la proposition hypothétique.
- source_word: ἐν ὑμῖν
  choice: chez vous
  rationale: Dans l'adresse à des villes envisagées avec leurs habitants, « chez vous » exprime naturellement la sphère où les actes se sont produits.
- source_word: πάλαι
  choice: il y a longtemps
  rationale: Rend clairement la valeur temporelle dans l'irréel du passé.
- source_word: ἐν σάκκῳ καὶ σποδῷ
  choice: dans la toile de sac et la cendre
  rationale: Préserve l'image concrète traditionnelle du deuil et du repentir. Le singulier collectif « la cendre » est idiomatique en français biblique moderne.
- source_word: καθήμενοι
  choice: assis
  rationale: Conserve explicitement la posture décrite par le participe grec.
- source_word: μετενόησαν
  choice: auraient changé de vie
  rationale: Rend le retournement intérieur et pratique exprimé ici par μετανοέω dans une langue accessible; une note signale le terme traditionnel « se repentir ».
theological_decisions:
- issue: Nature des δυνάμεις dans le ministère de Jésus
  choice: actes de puissance
  alternative: miracles
  rationale: Le choix principal conserve l'accent lexical sur les actes et la puissance sans imposer un terme devenu plus technique.
- issue: Portée de μετενόησαν
  choice: auraient changé de vie
  alternative: se seraient repentis / auraient changé de manière de penser
  rationale: « Changer de vie » communique en français actuel le retournement appelé par le contexte, sans réduire le verbe à une modification purement intellectuelle. La note conserve l'équivalent religieux traditionnel et l'ambiguïté lexicale.
- issue: Référent implicite du pluriel dans la proposition concernant Tyr et Sidon
  choice: leurs habitants
  alternative: elles
  rationale: Le grec personnifie les villes et emploie un participe masculin pluriel, orientant vers leurs habitants. L'explicitation évite en français un désaccord de genre avec les noms féminins des villes.
translation_notes:
  register: Français international moderne, digne et oralement fluide. La répétition solennelle de l'avertissement et l'image concrète de la toile de sac et de la cendre sont maintenues. Le marqueur [a] figure dans le texte principal.
