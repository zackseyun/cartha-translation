revisions:
- from: « Quel malheur pour toi, Chorazin ! Quel malheur pour toi, Bethsaïda ! Car si les actes de puissance accomplis chez vous avaient eu lieu à Tyr et à Sidon, il y a longtemps que leurs habitants auraient changé de vie[a], assis dans la toile de sac et la cendre. »
  to: « Malheur à toi, Chorazin ! Malheur à toi, Bethsaïda ! Car si les actes de puissance qui se sont produits chez vous s’étaient produits à Tyr et à Sidon, leurs habitants se seraient repentis il y a longtemps, assis dans le sac et la cendre[a]. »
  rationale: Le texte est resserré autour des équivalents français les plus directs pour l’avertissement prophétique et la repentance, tout en conservant « actes de puissance », le caractère hypothétique du propos, l’explicitation légitime des habitants et la posture de deuil exprimée par le participe grec. La note garde une reformulation accessible sans la substituer au sens lexical central.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T10:53:55Z'
review_pass:
  verdict: revise
  source_fidelity: 'Révision nécessaire : « auraient changé de vie » interprète et concrétise davantage μετενόησαν que ne le fait le grec. « Se seraient repentis » en est l’équivalent direct et préserve mieux le vocabulaire lucanien. La reprise de γίνομαι peut être rendue naturellement par « qui se sont produits … s’étaient produits ». Le participe masculin pluriel justifie l’explicitation prudente « leurs habitants ».'
  naturalness: « Malheur à toi » est l’expression française biblique moderne, concise et vigoureuse, la plus naturelle pour l’apostrophe prophétique répétée. « Quel malheur pour toi » affaiblit légèrement l’interpellation. « Dans la toile de sac et la cendre » est moins idiomatique ; « dans le sac et la cendre » conserve l’image traditionnelle et reste intelligible.
  terminology: « Actes de puissance » rend bien δυνάμεις sans imposer « miracles ». « Sac et cendre » est la formulation française usuelle de l’image de deuil et de repentance. La note doit présenter « changer de vie » comme reformulation possible, non comme l’alternative principale à un texte qui ne traduit pas directement le verbe.
  issues:
