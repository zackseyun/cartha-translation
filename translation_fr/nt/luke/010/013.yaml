    issue: Rendu principal de μετενόησαν
    rationale: « Auraient changé de vie » explicite un effet pratique possible de la repentance plutôt que de rendre directement le verbe grec. « Se seraient repentis » est plus fidèle, tout en restant français moderne.
  - severity: low
    issue: Force de Οὐαί σοι
    rationale: « Quel malheur pour toi » est compréhensible, mais « Malheur à toi » préserve mieux la formule prophétique directe et son registre établi.
  - severity: low
    issue: Expression du sac et de la cendre
    rationale: « Toile de sac » est lexicalement possible mais la construction « dans la toile de sac et la cendre » est peu idiomatique. La formule consacrée « dans le sac et la cendre » est plus fluide.
