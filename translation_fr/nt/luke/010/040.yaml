source:
  edition: SBLGNT
  text: ἡ δὲ Μάρθα περιεσπᾶτο περὶ πολλὴν διακονίαν· ἐπιστᾶσα δὲ εἶπεν· Κύριε, οὐ μέλει σοι ὅτι ἡ ἀδελφή μου μόνην με ⸀κατέλειπεν διακονεῖν; ⸀εἰπὲ οὖν αὐτῇ ἵνα μοι συναντιλάβηται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/040.yaml
  text: But Martha was distracted with much serving. And she came up and said[a], “Lord, does it not matter to you that my sister has left me to serve alone? Tell her, then, to help me.”
translation:
  language: fr
  text: 'Mais Marthe était absorbée par les nombreuses tâches du service. Elle s’approcha et dit : « Seigneur, cela ne te préoccupe pas que ma sœur m’a laissée seule faire le service ? Dis-lui donc de m’aider. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: περιεσπᾶτο
  choice: était accaparée
  rationale: L’imparfait exprime un état qui se prolonge, et le verbe évoque le fait d’être tiré de différents côtés ou détourné de son attention. « Était accaparée » rend naturellement cette idée sans réduire le sens à la simple inquiétude.
- source_word: περὶ πολλὴν διακονίαν
  choice: par tout le service à assurer
  rationale: Dans ce cadre domestique, διακονία désigne le service pratique plutôt qu’un ministère officiel. Cette formulation française naturelle conserve l’idée d’une lourde charge de service sans la limiter explicitement aux seuls préparatifs du repas.
- source_word: ἐπιστᾶσα
  choice: elle s’approcha
  rationale: Le participe indique que Marthe vient près de Jésus avant de parler. « Elle s’approcha » est clair, naturel et d’un registre digne.
- source_word: Κύριε
  choice: Seigneur
  rationale: « Seigneur » est le titre français usuel pour κύριος lorsqu’il est adressé à Jésus et préserve à la fois le respect de l’adresse et la portée du titre dans Luc.
- source_word: οὐ μέλει σοι
  choice: cela ne te fait rien
  rationale: L’expression grecque demande si la situation importe à Jésus ou le concerne. La tournure française transmet directement la plainte de Marthe sans ajouter une interprétation doctrinale.
- source_word: μόνην με κατέλειπεν διακονεῖν
  choice: me laisse seule faire le service
  rationale: La formulation conserve explicitement μόνην, « seule », ainsi que l’infinitif διακονεῖν, tout en restant idiomatique en français.
- source_word: εἰπὲ οὖν αὐτῇ
  choice: Dis-lui donc
  rationale: L’impératif demeure direct, et « donc » conserve la valeur consécutive ou déductive de οὖν.
- source_word: συναντιλάβηται
  choice: de m’aider
  rationale: Le verbe signifie se joindre à quelqu’un pour lui prêter assistance. Dans ce contexte, « m’aider » est la formulation la plus naturelle; l’idée d’une participation commune ressort déjà de la situation.
theological_decisions:
- issue: Traduction de κύριος dans l’adresse de Marthe à Jésus
  choice: Seigneur
  alternative: Maître
  rationale: « Seigneur » correspond à l’usage lucanien courant pour Jésus et laisse intactes les dimensions de respect et de titre que peut porter κύριος, sans les réduire au seul rapport maître-disciple.
translation_notes:
  register: Français international moderne, naturel et digne. Le rythme narratif reste direct; la plainte de Marthe conserve sa vigueur, tandis que « accaparée » maintient le contraste contextuel avec l’attention de Marie sans expliciter davantage ce contraste.
