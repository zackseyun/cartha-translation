review_pass:
  verdict: revise
  source_fidelity: La formulation « tout le service à assurer » ne rend pas avec assez de précision πολλὴν διακονίαν (« beaucoup de service ») et ajoute légèrement l’idée d’un service restant « à assurer ». « Les nombreuses tâches du service » exprime plus directement l’ampleur de l’activité domestique. Le présent « me laisse » affaiblit aussi l’aoriste κατέλειπεν, mieux rendu par « m’a laissée ».
  naturalness: Le texte est globalement naturel et d’un registre approprié. « Cela ne te fait rien » est idiomatique, mais « cela ne te préoccupe pas » rend plus directement μέλει tout en conservant la plainte de Marthe.
  terminology: « Seigneur », « s’approcha », « seule » et « m’aider » sont fidèles, naturels et cohérents avec le contexte. Aucun terme théologique ni nom propre ne requiert de modification.
  issues:
  - severity: medium
    issue: « tout le service à assurer » pour περὶ πολλὴν διακονίαν
    rationale: « Tout » ne correspond pas exactement à πολλήν (« beaucoup de »), et « à assurer » introduit une nuance non exprimée par le grec. Une mention des nombreuses tâches du service conserve le cadre domestique sans ajouter cette idée.
  - severity: low
    issue: « me laisse seule » pour μόνην με κατέλειπεν διακονεῖν
    rationale: Le verbe grec est à l’aoriste et évoque le fait que la sœur l’a laissée seule; « m’a laissée seule » le rend plus exactement.
  revised_text: 'Mais Marthe était absorbée par les nombreuses tâches du service. Elle s’approcha et dit : « Seigneur, cela ne te préoccupe pas que ma sœur m’a laissée seule faire le service ? Dis-lui donc de m’aider. »'
