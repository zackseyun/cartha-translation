id: LUK.10.5
reference: Luke 10:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἰς ἣν δ’ ἂν ⸂εἰσέλθητε οἰκίαν⸃ πρῶτον λέγετε· Εἰρήνη τῷ οἴκῳ τούτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/005.yaml
  text: Into whatever house you enter[a], first say, ‘Peace to this house.’
translation:
  language: fr
  text: 'Dans toute maison où vous entrerez, dites d’abord : « Paix à cette maison[a] ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi traduire : « Que la paix soit sur cette maison ! » ou « Paix sur cette maison ! » Le grec emploie une formule concise de bénédiction.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ἣν δ’ ἂν ⸂εἰσέλθητε οἰκίαν⸃
  choice: Dans toute maison où vous entrerez
  rationale: La relative indéfinie avec ἄν exprime une éventualité générale orientée vers l’avenir. En français naturel, « dans toute maison où vous entrerez » restitue le mouvement de εἰς et évite la tournure lourde « dans quelque maison que vous entriez ».
- source_word: πρῶτον
  choice: d’abord
  rationale: 'Le terme marque la priorité dans la séquence : cette parole doit être prononcée en premier. « D’abord » est courant et précis.'
- source_word: λέγετε
  choice: dites
  rationale: L’impératif présent prescrit la parole à prononcer chaque fois qu’ils entrent dans une maison. « Dites » est l’équivalent français direct et idiomatique.
- source_word: Εἰρήνη
  choice: Paix
  rationale: Le nominatif forme ici une salutation-bénédiction concise, d’arrière-plan sémitique. Le simple mot « Paix » en conserve la brièveté et la force performative.
- source_word: τῷ οἴκῳ τούτῳ
  choice: à cette maison
  rationale: Le datif désigne le bénéficiaire de la paix. « À cette maison » garde l’image concrète tout en pouvant inclure, par métonymie, ceux qui l’habitent.
theological_decisions:
- issue: Nature de la formule de paix
  choice: « Paix à cette maison ! » comme bénédiction-salutation prononcée
  alternative: « Que la paix soit sur cette maison ! » ou « Paix sur cette maison ! »
  rationale: Le grec ordonne de prononcer la paix sur la maison sans verbe explicite. La formulation retenue préserve cette concision et ne réduit pas la parole à une simple salutation banale, sans toutefois expliciter davantage que le texte.
translation_notes:
  register: Français moderne, international et digne. « Dans toute maison où vous entrerez » est plus naturel que le calque « dans quelque maison que vous entriez ». La formule citée conserve la brièveté solennelle de l’original.
