id: LUK.10.39
reference: Luke 10:39
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ τῇδε ἦν ἀδελφὴ καλουμένη ⸀Μαριάμ, ἣ καὶ ⸂παρακαθεσθεῖσα πρὸς⸃ τοὺς πόδας τοῦ ⸀Ἰησοῦ ἤκουεν τὸν λόγον αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/039.yaml
  text: And she had a sister called Mary[a], who also sat at Jesus’ feet and was listening to his word.
translation:
  language: fr
  text: Elle avait une sœur appelée Marie, qui, assise aux pieds de Jésus[a], écoutait sa parole.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Certains manuscrits portent « du Seigneur » au lieu de « de Jésus ».
    reason: textual_variant
lexical_decisions:
- source_word: τῇδε
  choice: elle
  rationale: Le démonstratif au datif renvoie à Marthe, mentionnée au verset précédent. Le pronom « elle » est la reprise la plus naturelle en français.
- source_word: ἀδελφὴ καλουμένη Μαριάμ
  choice: une sœur appelée Marie
  rationale: Cette formulation rend directement le lien familial et le participe qui introduit le nom, dans un français courant et digne.
- source_word: παρακαθεσθεῖσα πρὸς τοὺς πόδας
  choice: assise aux pieds de
  rationale: L’expression française naturelle « aux pieds de » restitue la position prise par Marie et conserve sa possible portée de posture de disciple, sans l’expliciter.
- source_word: τοῦ Ἰησοῦ
  choice: de Jésus
  rationale: Le texte fourni du SBLGNT porte explicitement Ἰησοῦ. La variante « du Seigneur » est signalée en note.
- source_word: ἤκουεν
  choice: écoutait
  rationale: L’imparfait grec décrit une action en cours; l’imparfait français en rend naturellement l’aspect duratif.
- source_word: τὸν λόγον αὐτοῦ
  choice: sa parole
  rationale: « Sa parole » reste proche de λόγος et préserve sa largeur de sens, plutôt que de le réduire à « son enseignement » ou à « ce qu’il disait ».
theological_decisions:
- issue: Le nom ou titre dans l’expression « aux pieds de… »
  choice: Jésus
  alternative: le Seigneur
  rationale: Le texte grec de référence fourni lit Ἰησοῦ (« Jésus »). Comme la variante κύριος (« le Seigneur ») est significative, elle est conservée en note sans remplacer la leçon du texte de base.
translation_notes:
  register: Français international moderne, fluide et sobre. La construction participiale est rendue par « assise », tandis que « écoutait » maintient l’action continue. Le marqueur de note est placé après « Jésus », là où se situe la variante textuelle.
