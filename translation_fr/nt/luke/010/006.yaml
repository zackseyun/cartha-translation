id: LUK.10.6
reference: Luke 10:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἐὰν ⸂ᾖ ἐκεῖ⸃ υἱὸς εἰρήνης, ἐπαναπαήσεται ἐπ’ αὐτὸν ἡ εἰρήνη ὑμῶν· εἰ δὲ μήγε, ἐφ’ ὑμᾶς ἀνακάμψει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/006.yaml
  text: And if a son of peace is there[a], your peace will rest upon him; but if not, it will return to you.
translation:
  language: fr
  text: Et s’il y a là un fils de paix[a], votre paix reposera sur lui ; sinon, elle reviendra sur vous.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une personne de paix », c’est-à-dire quelqu’un disposé à accueillir la paix apportée par ce message.
    reason: lexical_alternative
lexical_decisions:
- source_word: υἱὸς εἰρήνης
  choice: un fils de paix
  rationale: Cette expression de tournure sémitique désigne une personne caractérisée par la paix ou disposée à accueillir la paix apportée par les messagers. « Fils de paix » conserve l’image et le masculin singulier du grec ; une note donne l’équivalent français plus idiomatique.
- source_word: ἐπαναπαήσεται
  choice: reposera sur
  rationale: Le verbe exprime l’idée de se poser et de demeurer sur quelqu’un. « Reposera sur » conserve cette image tout en restant naturel en français.
- source_word: ἡ εἰρήνη ὑμῶν
  choice: votre paix
  rationale: Le possessif direct préserve la formulation grecque et laisse ouverte la relation entre la salutation prononcée et la paix qu’elle communique.
- source_word: μήγε
  choice: sinon
  rationale: « Sinon » rend avec concision la condition négative renforcée et assure un enchaînement naturel en français.
- source_word: ἀνακάμψει
  choice: reviendra
  rationale: Le verbe signifie revenir ou retourner. Ici, il décrit la paix qui retourne vers ceux qui l’ont annoncée.
- source_word: ἐφ’ ὑμᾶς
  choice: sur vous
  rationale: La préposition reprend l’image spatiale déjà présente dans « reposera sur lui » et souligne le retour de la paix sur les messagers.
- source_word: καὶ ἐὰν ᾖ ἐκεῖ
  choice: Et s’il y a là
  rationale: Cette formulation conserve à la fois le lien introduit par καί, la condition et l’accent locatif de ἐκεῖ.
theological_decisions:
- issue: Faut-il neutraliser l’expression masculine υἱὸς εἰρήνης ?
  choice: Conserver « un fils de paix » dans le texte principal.
  alternative: « une personne de paix » ou « quelqu’un qui accueille la paix »
  rationale: Le grec emploie une expression imagée au masculin singulier. La conserver respecte la texture de la source sans réduire son sens à une seule interprétation ; la note fournit un équivalent plus idiomatique.
translation_notes:
  register: Français international moderne, digne et direct. La syntaxe reste fluide tout en conservant l’image biblique du « fils de paix » et le mouvement de la paix qui repose puis revient.
