id: LUK.10.33
reference: Luke 10:33
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Σαμαρίτης δέ τις ὁδεύων ἦλθεν κατ’ αὐτὸν καὶ ⸀ἰδὼν ἐσπλαγχνίσθη,
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/033.yaml
  text: But a Samaritan[a], as he traveled, came to where he was, and when he saw him, he was moved with compassion.
translation:
  language: fr
  text: Mais un Samaritain, en voyage, arriva à l’endroit où se trouvait cet homme. Quand il le vit, il fut ému de compassion.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Σαμαρίτης
  choice: un Samaritain
  rationale: « Samaritain » est le terme français établi pour cette identité ethnoreligieuse et conserve toute la force du contraste narratif.
- source_word: δέ
  choice: Mais
  rationale: La conjonction marque ici le contraste avec le prêtre et le lévite mentionnés auparavant.
- source_word: τις
  choice: un
  rationale: Avec Σαμαρίτης, le pronom indéfini se rend naturellement en français par l’article indéfini, sans le tour plus appuyé « un certain ».
- source_word: ὁδεύων
  choice: qui était en voyage
  rationale: Cette proposition rend naturellement le participe présent, qui présente le déplacement comme circonstance de fond.
- source_word: ἦλθεν
  choice: arriva
  rationale: Dans ce contexte de déplacement jusqu’au lieu où se trouve le blessé, « arriva » exprime idiomatiquement l’aoriste de ἔρχομαι.
- source_word: κατ’ αὐτόν
  choice: près de lui
  rationale: Avec l’accusatif, κατά indique ici que le Samaritain parvient à l’endroit où se trouve l’homme; « près de lui » est clair et naturel sans suggérer un contact physique.
- source_word: ἰδών
  choice: Quand il le vit
  rationale: La proposition temporelle rend clairement l’action du participe aoriste qui précède la réaction principale.
- source_word: ἐσπλαγχνίσθη
  choice: il fut saisi de compassion
  rationale: Cette expression française restitue la force affective du verbe, qui désigne une compassion profonde et viscérale, sans ajouter d’interprétation.
theological_decisions:
- issue: Rendre la réaction compatissante du Samaritain sans introduire une interprétation morale ou doctrinale ultérieure
  choice: il fut saisi de compassion
  alternative: il eut compassion de lui
  rationale: Le choix conserve l’intensité émotionnelle du grec tout en s’en tenant à la réaction explicitement décrite dans le verset.
translation_notes:
  register: Français international moderne, naturel et digne. Deux phrases allègent la syntaxe sans modifier les rapports temporels ni le contraste du texte grec.
