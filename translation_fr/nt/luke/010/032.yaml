id: LUK.10.32
reference: Luke 10:32
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁμοίως δὲ καὶ ⸀Λευίτης κατὰ τὸν τόπον ἐλθὼν καὶ ἰδὼν ἀντιπαρῆλθεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/032.yaml
  text: Likewise[a], a Levite also came to the place, and when he saw him[b], he passed by on the opposite side.
translation:
  language: fr
  text: De même, un Lévite arriva à cet endroit[a] et, quand il vit cet homme, passa de l’autre côté[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « arriva à ce lieu » ou « parvint à cet endroit ».'
    reason: lexical_alternative
  - marker: b
    text: Le verbe peut être rendu plus simplement par « passa outre ». Sa forme composée indique qu’il passa de l’autre côté et peut évoquer un évitement.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁμοίως
  choice: De même
  rationale: L’adverbe relie explicitement l’action du Lévite à celle du prêtre au verset précédent, dans une formulation française naturelle et concise.
- source_word: δὲ
  choice: —
  rationale: Cette particule sert ici de liaison légère; en français, son rôle est suffisamment rendu par l’enchaînement de la phrase.
- source_word: καὶ Λευίτης
  choice: un Lévite
  rationale: Le nom historique est conservé par translittération. La valeur additive de καί ressort déjà de « De même » et de la progression narrative; ajouter « aussi » alourdirait la phrase sans gain réel.
- source_word: κατὰ τὸν τόπον ἐλθὼν
  choice: arriva à cet endroit
  rationale: Cette formulation rend de façon idiomatique l’arrivée du Lévite au lieu où se trouvait l’homme, tout en laissant en note l’autre nuance possible de la préposition κατά.
- source_word: ἰδὼν
  choice: quand il vit cet homme
  rationale: Le participe aoriste exprime une action antérieure à l’action principale. « Cet homme », fourni par le contexte, évite en français l’ambiguïté que créerait le simple pronom « le ».
- source_word: ἀντιπαρῆλθεν
  choice: passa de l’autre côté
  rationale: Le verbe composé suggère qu’il passe à distance, du côté opposé, plutôt que de simplement continuer son chemin.
theological_decisions:
- issue: Identité sociale et religieuse de Λευίτης
  choice: Lévite
  alternative: serviteur du Temple; membre de la tribu de Lévi
  rationale: Le terme historique précis est maintenu en parallèle avec le prêtre du verset précédent, sans introduire dans le texte une explication ou une généralisation absente du grec.
translation_notes:
  register: Français international moderne, narratif et digne. La phrase demeure fluide à l’oral comme à l’écrit; elle explicite seulement les éléments exigés par l’idiome français sans résoudre au-delà du contexte les nuances du grec.
