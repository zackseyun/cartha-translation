id: LUK.10.19
reference: Luke 10:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἰδοὺ ⸀δέδωκα ὑμῖν τὴν ἐξουσίαν τοῦ πατεῖν ἐπάνω ὄφεων καὶ σκορπίων, καὶ ἐπὶ πᾶσαν τὴν δύναμιν τοῦ ἐχθροῦ, καὶ οὐδὲν ὑμᾶς οὐ μὴ ⸀ἀδικήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/019.yaml
  text: Behold[a], I have given you the authority to tread on snakes and scorpions, and over all the power of the enemy[b], and nothing will ever harm you.
translation:
  language: fr
  text: Voici, je vous ai donné l’autorité de marcher sur les serpents et les scorpions[a], et sur toute la puissance de l’ennemi[b] ; rien ne vous fera jamais de mal.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’image des serpents et des scorpions peut aussi évoquer ici des forces spirituelles hostiles.
    reason: Portée possible de l’image dans le contexte, sans remplacer son sens littéral.
  - marker: b
    text: Dans le contexte, « l’ennemi » désigne vraisemblablement Satan, mais le grec ne le nomme pas explicitement.
    reason: Clarification contextuelle du référent tout en respectant la formulation du texte.
  - marker: c
    text: 'Autre traduction possible : « absolument rien ne vous fera de mal ». Le grec emploie une négation particulièrement forte.'
    reason: Signalement de l’intensité emphatique de la construction grecque.
lexical_decisions:
- source_word: ἰδού
  choice: Voici
  rationale: Marque naturellement l’appel à l’attention en français moderne, sans l’archaïsme de « voici que ».
- source_word: δέδωκα
  choice: je vous ai donné
  rationale: Le passé composé rend l’acte accompli dont l’effet demeure présent, nuance portée par le parfait grec.
- source_word: ἐξουσίαν
  choice: l’autorité
  rationale: Préserve l’idée d’une autorité accordée et la distingue de δύναμις, rendu plus loin par « puissance ».
- source_word: τοῦ πατεῖν ἐπάνω
  choice: de marcher sur
  rationale: Expression claire et actuelle qui conserve l’image spatiale sans renforcer indûment le verbe en « écraser ».
- source_word: ὄφεων καὶ σκορπίων
  choice: les serpents et les scorpions
  rationale: Rend littéralement les deux animaux et maintient ouverte la possibilité d’une portée symbolique dans le contexte.
- source_word: ἐπὶ πᾶσαν τὴν δύναμιν
  choice: sur toute la puissance
  rationale: Exprime l’étendue de l’autorité accordée sur l’ensemble de la force adverse, tout en préservant le contraste lexical avec ἐξουσία.
- source_word: τοῦ ἐχθροῦ
  choice: de l’ennemi
  rationale: Conserve le singulier substantivé du grec sans identifier explicitement cet ennemi au-delà de ce que dit le verset.
- source_word: οὐδὲν ὑμᾶς οὐ μὴ ἀδικήσῃ
  choice: rien ne pourra jamais vous faire de mal
  rationale: Rend en français idiomatique la négation grecque fortement emphatique et la notion de dommage.
theological_decisions:
- issue: Identité de « l’ennemi »
  choice: Conserver « l’ennemi » sans autre identification dans le texte principal.
  alternative: Expliciter « Satan » ou « le diable ».
  rationale: Le contexte évoque l’opposition satanique, mais le grec dit seulement « l’ennemi » ; la traduction ne doit pas supprimer cette retenue du texte.
- issue: Portée des serpents et des scorpions
  choice: Maintenir l’image concrète dans le texte principal.
  alternative: Les présenter explicitement comme des forces spirituelles hostiles.
  rationale: Les termes désignent littéralement des animaux, même si le contexte peut leur donner une portée représentative ou symbolique.
- issue: Étendue de la promesse de protection
  choice: Traduire avec toute la force de la négation sans préciser les catégories de dommages visées.
  alternative: Restreindre explicitement la promesse au dommage spirituel ou l’étendre explicitement à toute souffrance physique.
  rationale: Le verset formule une assurance très forte, mais n’explicite pas ici la manière dont elle s’articule avec les souffrances ultérieures des disciples ; cette tension doit demeurer.
translation_notes:
  register: Français international moderne, naturel et digne. « Voici » conserve l’appel à l’attention ; « autorité » et « puissance » maintiennent la distinction entre ἐξουσία et δύναμις. La phrase garde la coordination grecque sans ajouter une interprétation doctrinale.
