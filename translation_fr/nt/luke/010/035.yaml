id: LUK.10.35
reference: Luke 10:35
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἐπὶ τὴν ⸀αὔριον ἐκβαλὼν ⸂δύο δηνάρια ἔδωκεν⸃ τῷ πανδοχεῖ καὶ ⸀εἶπεν· Ἐπιμελήθητι αὐτοῦ, καὶ ὅ τι ἂν προσδαπανήσῃς ἐγὼ ἐν τῷ ἐπανέρχεσθαί με ἀποδώσω σοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/035.yaml
  text: And on the next day[a], taking out two denarii, he gave them to the innkeeper and said, ‘Take care of him, and whatever more you spend, I will repay you when I return.’
translation:
  language: fr
  text: 'Le lendemain, il sortit deux deniers[a], les donna à l’aubergiste et lui dit : « Prends soin de lui. Tout ce que tu dépenseras en plus, je te le rembourserai à mon retour. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le denier était une monnaie romaine en argent couramment utilisée, correspondant approximativement au salaire journalier d’un ouvrier.
    reason: cultural_note
lexical_decisions:
- source_word: ἐπὶ τὴν αὔριον
  choice: Le lendemain
  rationale: Cette expression temporelle idiomatique désigne le jour suivant ; « Le lendemain » est la formulation naturelle en français moderne.
- source_word: ἐκβαλών
  choice: il sortit
  rationale: Dans ce contexte, le participe indique qu’il tire l’argent de ce qu’il possède. La coordination en français rend naturellement la succession des gestes.
- source_word: δύο δηνάρια
  choice: deux deniers
  rationale: « Denier » est le terme français traditionnel et précis pour le denarius romain ; il conserve la référence monétaire historique sans la remplacer par une équivalence salariale interprétative.
- source_word: πανδοχεῖ
  choice: à l’aubergiste
  rationale: Le terme désigne la personne qui tient le lieu d’hébergement, et non l’auberge elle-même.
- source_word: Ἐπιμελήθητι αὐτοῦ
  choice: Prends soin de lui
  rationale: Cette formulation claire et actuelle exprime l’ordre de lui apporter des soins attentifs.
- source_word: ὅ τι ἂν προσδαπανήσῃς
  choice: Tout ce que tu dépenseras en plus
  rationale: La traduction conserve à la fois le caractère indéfini de la somme et l’idée d’une dépense supplémentaire.
- source_word: ἐν τῷ ἐπανέρχεσθαί με
  choice: à mon retour
  rationale: La construction infinitive a une valeur temporelle ; « à mon retour » la rend avec concision et naturel.
- source_word: ἀποδώσω σοι
  choice: je te le rembourserai
  rationale: Le verbe signifie ici rendre une somme avancée. Le pronom « le » reprend naturellement le montant supplémentaire dépensé.
theological_decisions: []
