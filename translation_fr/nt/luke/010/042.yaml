  variant: modern international French
source:
  edition: SBLGNT
  text: ⸂ὀλίγων δέ ἐστιν χρεία ἢ ἑνός⸃· ⸂Μαριὰμ γὰρ⸃ τὴν ἀγαθὴν μερίδα ἐξελέξατο ἥτις οὐκ ἀφαιρεθήσεται ⸀αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/042.yaml
  text: But few things are needed—or one[a]. For Mary has chosen the good portion[b], which will not be taken away from her.
translation:
  language: fr
  text: Mais il faut peu de choses — ou une seule[a]. En effet, Marie a choisi la bonne part[b], qui ne lui sera pas enlevée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « une seule chose est nécessaire ». Dans le contexte du repas, le grec peut aussi se comprendre plus précisément ainsi : « Il ne faut que peu de plats — ou même un seul. »'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « la bonne portion ». Le terme peut évoquer à la fois une portion de repas et, au sens figuré, une part dans ce qui a une valeur véritable.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀλίγων δέ ἐστιν χρεία ἢ ἑνός
  choice: Mais il faut peu de choses — ou une seule
  rationale: La tournure ἐστιν χρεία exprime la nécessité. « Peu de choses — ou une seule » conserve le contraste compact entre le pluriel et le singulier ainsi que l’ambiguïté entre les préparatifs du repas et une nécessité plus fondamentale.
- source_word: Μαριὰμ
  choice: Marie
  rationale: Forme française traditionnelle et courante du nom.
- source_word: τὴν ἀγαθὴν μερίδα
  choice: la bonne part
  rationale: « Part » rend naturellement μερίς et peut évoquer à la fois une portion de repas et, au sens figuré, ce qui revient à quelqu’un. « Bonne » traduit directement ἀγαθή sans introduire le comparatif « meilleure ».
- source_word: ἐξελέξατο
  choice: a choisi
  rationale: Le passé composé exprime naturellement en français le choix personnel de Marie et son résultat durable dans le contexte.
- source_word: ἥτις οὐκ ἀφαιρεθήσεται αὐτῆς
  choice: qui ne lui sera pas enlevée
  rationale: Cette formulation rend le futur passif et rattache clairement le pronom relatif à « la bonne part », tout en exprimant sa permanence.
theological_decisions:
- issue: Sens de « peu de choses — ou une seule » par rapport au service de Marthe et au choix de Marie
  choice: Conserver une formulation ouverte qui affirme la nécessité de peu de choses, ou d’une seule, sans préciser davantage.
  alternative: Comprendre soit « quelques plats suffisent, ou même un seul », soit « une seule chose est nécessaire ».
  rationale: Le grec permet à la fois une allusion pratique au repas et une portée plus large concernant l’unique nécessité. La traduction préserve cette tension au lieu de trancher.
translation_notes:
  register: Français international moderne, clair et digne. La formulation reste concise, suit de près la structure grecque et conserve les ambiguïtés lexicale et contextuelle du verset.
