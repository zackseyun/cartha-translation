  text: ⸂Ἐν δὲ⸃ τῷ πορεύεσθαι ⸀αὐτοὺς αὐτὸς εἰσῆλθεν εἰς κώμην τινά· γυνὴ δέ τις ὀνόματι Μάρθα ὑπεδέξατο ⸀αὐτὸν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/038.yaml
  text: As they were traveling along[a], he entered a certain village, and a woman named Martha welcomed him.
translation:
  language: fr
  text: Pendant qu’ils faisaient route, il entra dans un certain village. Une femme nommée Marthe l’accueillit[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le reçut ». Le verbe grec évoque l’accueil hospitalier accordé à un invité.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν δὲ τῷ πορεύεσθαι αὐτοὺς
  choice: Pendant qu’ils faisaient route
  rationale: La construction ἐν avec l’infinitif articulé exprime une action simultanée. Le pluriel αὐτούς désigne le groupe en déplacement. « Faisaient route » est naturel en français narratif et δέ n’exige pas ici un connecteur appuyé.
- source_word: αὐτὸς
  choice: il
  rationale: Le pronom grec met Jésus en relief par rapport au groupe pluriel. En français, « il » maintient clairement le changement de sujet sans ajouter explicitement le nom de Jésus.
- source_word: εἰσῆλθεν
  choice: entra
  rationale: L’aoriste de εἰσέρχομαι décrit simplement l’entrée dans le village; le passé simple convient au récit.
- source_word: εἰς κώμην τινά
  choice: dans un certain village
  rationale: κώμη désigne un village, et τινά lui confère une indétermination légèrement particularisante que rend « un certain ».
- source_word: γυνὴ δέ τις ὀνόματι Μάρθα
  choice: Une femme nommée Marthe
  rationale: δέ introduit ici un nouveau personnage sans contraste marqué. Le caractère indéfini de τις est naturellement exprimé par l’article indéfini, tandis que ὀνόματι Μάρθα devient idiomatiquement « nommée Marthe ».
- source_word: ὑπεδέξατο αὐτόν
  choice: l’accueillit
  rationale: ὑποδέχομαι évoque le fait de recevoir quelqu’un avec hospitalité. « L’accueillit » restitue ce sens sans ajouter explicitement « chez elle », élément implicite mais absent du texte grec.
