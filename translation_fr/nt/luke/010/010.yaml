source:
  edition: SBLGNT
  text: εἰς ἣν δ’ ἂν πόλιν ⸀εἰσέλθητε καὶ μὴ δέχωνται ὑμᾶς, ἐξελθόντες εἰς τὰς πλατείας αὐτῆς εἴπατε·
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/010.yaml
  text: But whatever city you enter and they do not receive you[a], go out into its streets and say,
translation:
  language: fr
  text: 'Mais dans toute ville où vous entrez et où l’on ne vous accueille pas, sortez dans ses rues[a] et dites :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sur ses places publiques ». Le grec πλατείας désigne des rues larges ou des espaces ouverts au public.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ἣν δ’ ἂν πόλιν
  choice: Mais si vous entrez dans une ville
  rationale: La relative indéfinie avec ἄν présente un cas général susceptible de se produire. En français courant, la tournure conditionnelle « si vous entrez dans une ville » exprime naturellement cette portée sans alourdir la phrase.
- source_word: εἰσέλθητε
  choice: vous entrez
  rationale: L’aoriste subjonctif appartient ici à la construction éventuelle et indéfinie. Le présent français convient à une consigne générale.
- source_word: μὴ δέχωνται ὑμᾶς
  choice: qu’on ne vous y accueille pas
  rationale: δέχομαι désigne ici l’accueil réservé aux messagers. « Accueillir » est naturel en français et conserve le sens relationnel du verbe; « y » rattache explicitement cet accueil à la ville.
- source_word: ἐξελθόντες
  choice: sortez
  rationale: Le participe circonstanciel précède l’impératif εἴπατε et indique l’action à accomplir avant de parler. Un impératif coordonné implicite rend clairement cette séquence en français.
- source_word: τὰς πλατείας αὐτῆς
  choice: sur ses places publiques[a]
  rationale: πλατεῖα désigne un espace public large et ouvert, selon les lieux une grande rue ou une place. « Places publiques » rend bien le cadre d’une proclamation publique, tandis que la note conserve l’autre possibilité lexicale.
- source_word: εἴπατε
  choice: dites
  rationale: L’aoriste impératif de λέγω introduit directement les paroles du verset suivant; « dites » est la formulation française la plus simple et précise.
theological_decisions: []
translation_notes:
  register: Français moderne, international et digne. La phrase privilégie une consigne directe et naturelle, tout en conservant le caractère général de la construction grecque et l’ambiguïté spatiale de πλατείας dans une note.
