id: LUK.10.7
reference: Luke 10:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐν αὐτῇ δὲ τῇ οἰκίᾳ μένετε, ἐσθίοντες καὶ πίνοντες τὰ παρ’ αὐτῶν, ἄξιος γὰρ ὁ ἐργάτης τοῦ μισθοῦ ⸀αὐτοῦ. μὴ μεταβαίνετε ἐξ οἰκίας εἰς οἰκίαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/007.yaml
  text: Stay in that same house[a], eating and drinking what they provide, for the worker is worthy of his wages. Do not move from house to house.
translation:
  language: fr
  text: Restez dans cette même maison, en mangeant et en buvant ce qu’ils vous offrent, car le travailleur mérite son salaire.[a] Ne déménagez pas de maison en maison.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « car le travailleur est digne du salaire qui lui revient ».'
    reason: Cette formulation plus littérale conserve explicitement ἄξιος (« digne ») et rend la relation exprimée par le génitif, tandis que le texte principal emploie l’idiome français « mérite son salaire ».
lexical_decisions:
- source_word: ἐν αὐτῇ δὲ τῇ οἰκίᾳ
  choice: dans cette même maison
  rationale: « Cette même maison » reprend la maison qui a accueilli les disciples et souligne qu’ils doivent y demeurer plutôt que chercher un autre logement.
- source_word: μένετε
  choice: Restez
  rationale: L’impératif présent exprime une action continue. « Restez » est direct, naturel et fidèle.
- source_word: ἐσθίοντες καὶ πίνοντες
  choice: en mangeant et en buvant
  rationale: Les participes décrivent les actions qui accompagnent le séjour dans la maison; cette construction les conserve naturellement en français.
- source_word: τὰ παρ’ αὐτῶν
  choice: ce qu’ils vous offrent
  rationale: L’expression désigne ce que les hôtes mettent à la disposition des envoyés. Le pronom « vous » explicite seulement le destinataire déjà impliqué par le contexte.
- source_word: ἄξιος γὰρ ὁ ἐργάτης τοῦ μισθοῦ αὐτοῦ
  choice: car le travailleur mérite son salaire
  rationale: Dans ce contexte, μισθός désigne la rémunération du travail. « Mérite son salaire » rend idiomatiquement la construction grecque avec ἄξιος tout en maintenant le lien entre le travailleur et sa rétribution.
- source_word: μὴ μεταβαίνετε ἐξ οἰκίας εἰς οἰκίαν
  choice: Ne passez pas de maison en maison
  rationale: La formule interdit de changer successivement de logement. « Passer de maison en maison » est une expression française naturelle et ne suppose pas explicitement le motif du changement.
theological_decisions:
- issue: Valeur du masculin singulier dans τοῦ μισθοῦ αὐτοῦ
  choice: son salaire
  alternative: le salaire qui lui revient
  rationale: Le grec emploie un travailleur masculin singulier de portée générale et rattache à celui-ci sa rémunération. « Son salaire » conserve ce nombre et cette relation sans neutraliser la formulation.
translation_notes:
  register: Français international moderne, clair et digne. Le verset garde l’enchaînement des deux impératifs et la justification introduite par « car ». Le marqueur de note est placé après la proposition qu’il éclaire.
