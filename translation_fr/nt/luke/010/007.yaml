  source_fidelity: 'Le texte rend correctement les impératifs, les participes circonstanciels, l’hospitalité fournie par les hôtes et la justification relative au salaire. « Ne passez pas de maison en maison » reste toutefois trop ambigu en français : il peut décrire des visites successives plutôt qu’un changement de logement, alors que μεταβαίνετε vise le transfert d’un lieu d’hébergement à un autre.'
