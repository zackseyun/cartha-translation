id: LUK.10.21
reference: Luke 10:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἐν αὐτῇ τῇ ὥρᾳ ἠγαλλιάσατο ⸀τῷ πνεύματι ⸂τῷ ἁγίῳ⸃ καὶ εἶπεν· Ἐξομολογοῦμαί σοι, πάτερ κύριε τοῦ οὐρανοῦ καὶ τῆς γῆς, ὅτι ἀπέκρυψας ταῦτα ἀπὸ σοφῶν καὶ συνετῶν, καὶ ἀπεκάλυψας αὐτὰ νηπίοις· ναί, ὁ πατήρ, ὅτι οὕτως ⸂εὐδοκία ἐγένετο⸃ ἔμπροσθέν σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/021.yaml
  text: In that same hour he rejoiced in the Holy Spirit and said[a], “I praise you, Father, Lord of heaven and earth, because you hid these things from the wise and understanding, and revealed them to little children. Yes, Father[c][b], because this was well-pleasing in your sight.”
translation:
  language: fr
  text: 'À cette heure même, Jésus exulta dans l''Esprit Saint et dit : « Je te loue[a], Père, Seigneur du ciel et de la terre, parce que tu as caché ces choses aux sages et aux gens intelligents, et que tu les as révélées aux tout-petits[b]. Oui, Père, car tel a été ton bon plaisir[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Je te remercie ». Dans une prière, le verbe grec peut exprimer aussi bien la louange que l'action de grâce.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « aux nourrissons ». Le terme désigne probablement ici, de manière imagée, les personnes humbles, dépendantes ou sans prestige, et non uniquement de très jeunes enfants.
    reason: lexical_alternative
  - marker: c
    text: Ou « car cela a été agréable devant toi » ou « car telle a été ta volonté bienveillante ».
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐν αὐτῇ τῇ ὥρᾳ
  choice: À cette heure même
  rationale: Cette formulation naturelle conserve l'insistance du démonstratif grec et situe l'événement au même moment.
- source_word: ἠγαλλιάσατο
  choice: exulta
  rationale: Le verbe exprime une joie intense; « exulta » en préserve la force dans un registre digne.
- source_word: τῷ πνεύματι τῷ ἁγίῳ
  choice: dans l'Esprit Saint
  rationale: La construction articulée désigne très probablement l'Esprit Saint; « dans » conserve sans la trancher entièrement la nuance de sphère ou de moyen du datif.
- source_word: Ἐξομολογοῦμαί σοι
  choice: Je te loue
  rationale: Dans cette prière adressée au Père, le verbe exprime la louange et peut aussi comporter une nuance d'action de grâce, signalée en note.
- source_word: πάτερ κύριε τοῦ οὐρανοῦ καὶ τῆς γῆς
  choice: Père, Seigneur du ciel et de la terre
  rationale: Les deux vocatifs en apposition sont conservés directement, et κύριος est rendu par « Seigneur ».
- source_word: ἀπέκρυψας ταῦτα
  choice: tu as caché ces choses
  rationale: Le passé composé rend naturellement l'aoriste en français tout en gardant Dieu comme sujet actif et l'objet démonstratif explicite.
- source_word: σοφῶν καὶ συνετῶν
  choice: aux sages et aux gens intelligents
  rationale: La paire conserve les notions de sagesse et d'intelligence sans supposer nécessairement une instruction scolaire.
- source_word: ἀπεκάλυψας αὐτὰ
  choice: tu les as révélées
  rationale: « Révéler » maintient le contraste lexical et théologique avec « cacher »; le pronom reprend « ces choses ».
- source_word: νηπίοις
  choice: aux tout-petits
  rationale: Le terme signifie littéralement de très jeunes enfants ou des nourrissons, mais fonctionne probablement ici comme image de personnes dépendantes ou sans prestige; « tout-petits » préserve cette image.
- source_word: ναί, ὁ πατήρ
  choice: Oui, Père
  rationale: La formulation française rend simplement l'affirmation suivie de l'adresse au Père.
- source_word: οὕτως εὐδοκία ἐγένετο ἔμπροσθέν σου
  choice: car tel a été ton bon plaisir
  rationale: Cette tournure française exprime l'approbation ou la volonté favorable de Dieu sans introduire l'idée supplémentaire de grâce; la note conserve une formulation plus proche de l'image grecque « devant toi ».
theological_decisions:
- issue: Référent de τῷ πνεύματι τῷ ἁγίῳ
  choice: l'Esprit Saint, avec majuscules
  alternative: dans son esprit / en esprit
  rationale: La présence de l'article avec le nom et l'adjectif favorise nettement la référence à l'Esprit Saint, tout en laissant au datif sa possible nuance de sphère ou de moyen.
- issue: Agent divin dans ἀπέκρυψας et ἀπεκάλυψας
  choice: 'conserver les verbes actifs : « tu as caché » et « tu as révélé »'
  alternative: formulations passives ou atténuées
  rationale: Le grec attribue explicitement les deux actions au Père; les atténuer résoudrait silencieusement une tension théologique présente dans le texte.
- issue: Sens de εὐδοκία
  choice: « ton bon plaisir »
  alternative: « ta volonté bienveillante » / « cela a été agréable devant toi »
  rationale: Le syntagme peut désigner ce qui plaît à Dieu ou sa volonté favorable. « Bon plaisir » maintient cette amplitude, tandis que la note donne une option plus formelle.
translation_notes:
  register: Français international moderne, naturel et digne. « Jésus » explicite le sujet afin d'éviter en français un pronom sans antécédent dans un verset isolé. « Exulta » conserve l'intensité de la joie; « tout-petits » garde l'image concrète sans archaïsme. Les marqueurs de notes sont placés immédiatement après les expressions concernées.
