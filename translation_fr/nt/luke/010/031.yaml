id: LUK.10.31
reference: Luke 10:31
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: κατὰ συγκυρίαν δὲ ἱερεύς τις κατέβαινεν ἐν τῇ ὁδῷ ἐκείνῃ, καὶ ἰδὼν αὐτὸν ἀντιπαρῆλθεν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/031.yaml
  text: By chance a certain priest was going down on that road[a], and when he saw him, he passed by on the opposite side.
translation:
  language: fr
  text: Par hasard, un prêtre descendait par cette route. Quand il vit l’homme, il passa de l’autre côté de la route.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « il passa en se tenant du côté opposé ». Le verbe grec évoque le fait de passer la victime en restant de l’autre côté.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ συγκυρίαν
  choice: Par hasard
  rationale: Cette locution exprime une coïncidence fortuite dans le déroulement du récit. « Par hasard » est naturel en français et ne tranche pas une question philosophique sur le hasard ou la providence.
- source_word: δὲ
  choice: non rendu séparément
  rationale: Ici, δέ est une particule légère de transition narrative. La progression est naturelle en français sans ajouter « or » ou « mais », qui risquerait de surcharger le lien.
- source_word: ἱερεύς τις
  choice: un prêtre
  rationale: τις introduit un individu non identifié. En français courant, l’article indéfini suffit; « un certain prêtre » pourrait suggérer qu’il s’agit d’une personne particulière déjà repérable ou donner une nuance appuyée absente du contexte.
- source_word: κατέβαινεν
  choice: descendait
  rationale: L’imparfait rend l’aspect imperfectif du verbe et place le déplacement à l’arrière-plan. « Descendre » convient aussi au trajet de Jérusalem vers Jéricho mentionné au verset précédent.
- source_word: ἐν τῇ ὁδῷ ἐκείνῃ
  choice: par cette route
  rationale: Avec ὁδός, ἐν désigne idiomatiquement le parcours suivi. « Par cette route » est naturel et maintient le démonstratif ἐκείνῃ.
- source_word: ἰδὼν αὐτὸν
  choice: Quand il vit l’homme
  rationale: Le participe aoriste exprime ici la circonstance temporelle qui précède l’action principale. « L’homme » identifie clairement la victime déjà évoquée, sans l’ambiguïté possible de deux pronoms masculins.
- source_word: ἀντιπαρῆλθεν
  choice: il passa de l’autre côté
  rationale: Le verbe composé évoque le fait de passer en se tenant du côté opposé, et donc une prise de distance, davantage que le simple « passer ».
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et narratif. La première phrase conserve l’arrière-plan à l’imparfait; la seconde met au premier plan les actions ponctuelles au passé simple. La note est placée après « de l’autre côté », là où porte l’alternative lexicale.
