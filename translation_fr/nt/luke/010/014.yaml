id: LUK.10.14
reference: Luke 10:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: πλὴν Τύρῳ καὶ Σιδῶνι ἀνεκτότερον ἔσται ἐν τῇ κρίσει ἢ ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/014.yaml
  text: But it will be more bearable for Tyre and Sidon in the judgment than for you[a].
translation:
  language: fr
  text: Mais, lors du jugement, ce sera plus supportable pour Tyr et Sidon que pour vous.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « plus tolérable ».
    reason: Alternative lexicale possible pour ἀνεκτότερον.
lexical_decisions:
- source_word: πλὴν
  choice: Mais
  rationale: Marque le fort contraste avec la dénonciation précédente dans un français actuel et naturel.
- source_word: Τύρῳ καὶ Σιδῶνι
  choice: pour Tyr et Sidon
  rationale: Les datifs, associés au comparatif, désignent ceux pour qui le jugement sera plus supportable.
- source_word: ἀνεκτότερον
  choice: plus supportable
  rationale: Rend clairement le comparatif de ἀνεκτός et convient au contexte du jugement, sans préciser au-delà du grec la nature exacte de ce qui devra être supporté.
- source_word: ἔσται
  choice: ce sera
  rationale: Rend simplement et naturellement le futur de εἰμί.
- source_word: ἐν τῇ κρίσει
  choice: lors du jugement
  rationale: Exprime naturellement en français le cadre temporel de la comparaison tout en conservant le caractère défini du jugement.
- source_word: ἢ ὑμῖν
  choice: que pour vous
  rationale: Complète la comparaison et rend explicitement la valeur du datif en français idiomatique.
theological_decisions:
- issue: Nature de κρίσις dans le contexte
  choice: « le jugement », compris contextuellement comme le jugement divin à venir
  alternative: « un jugement » ou un jugement au sens général
  rationale: La comparaison entre les villes impénitentes et Tyr et Sidon indique fortement le jugement eschatologique. La traduction conserve toutefois la formulation concise du grec sans ajouter « dernier » ou « final ».
translation_notes:
  register: Français international moderne, digne et accessible. La construction « lors du jugement » évite la tournure moins naturelle « dans le jugement », tandis que « plus supportable » conserve la force comparative du grec.
