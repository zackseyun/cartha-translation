id: LUK.10.24
reference: Luke 10:24
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: λέγω γὰρ ὑμῖν ὅτι πολλοὶ προφῆται καὶ βασιλεῖς ἠθέλησαν ἰδεῖν ἃ ὑμεῖς βλέπετε καὶ οὐκ εἶδαν, καὶ ἀκοῦσαι ἃ ἀκούετε καὶ οὐκ ἤκουσαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/024.yaml
  text: For I tell you that many prophets and kings desired to see what you see and did not see it[a], and to hear what you hear and did not hear it.
translation:
  language: fr
  text: Car je vous le dis, beaucoup de prophètes et de rois ont désiré[a] voir ce que vous voyez, mais ne l’ont pas vu, et entendre ce que vous entendez, mais ne l’ont pas entendu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ont voulu ».
    reason: Alternative lexicale possible pour ἠθέλησαν, qui peut exprimer aussi bien le désir que la volonté.
lexical_decisions:
- source_word: λέγω γὰρ ὑμῖν
  choice: Car je vous le dis
  rationale: « Je vous le dis » rend naturellement λέγω ὑμῖν, tandis que « car » conserve le lien explicatif marqué par γάρ avec la bénédiction précédente.
- source_word: πολλοὶ προφῆται καὶ βασιλεῖς
  choice: beaucoup de prophètes et de rois
  rationale: Traduction directe qui conserve les deux catégories historiques sans élargir βασιλεῖς en « dirigeants ».
- source_word: ἠθέλησαν
  choice: ont désiré
  rationale: Le verbe θέλω exprime ici le désir ou la volonté. « Ont désiré » convient au registre digne du passage sans exagérer l’intensité émotionnelle.
- source_word: ἰδεῖν ἃ ὑμεῖς βλέπετε
  choice: voir ce que vous voyez
  rationale: Formulation française naturelle qui préserve le parallélisme et la différence des verbes grecs de vision sans lui attribuer une portée interprétative supplémentaire.
- source_word: καὶ οὐκ εἶδαν
  choice: mais ne l’ont pas vu
  rationale: Dans ce contexte contrastif, « mais » rend naturellement καί suivi de la négation. Le pronom « l’ » reprend en français ce qu’ils désiraient voir.
- source_word: ἀκοῦσαι ἃ ἀκούετε καὶ οὐκ ἤκουσαν
  choice: et entendre ce que vous entendez, mais ne l’ont pas entendu
  rationale: La répétition d’« entendre » reproduit le parallélisme grec. « Mais » explicite naturellement le contraste créé par la négation, et « l’ » reprend le contenu entendu.
theological_decisions:
- issue: Identité des « prophètes et des rois »
  choice: Conserver les catégories historiques « prophètes » et « rois » sans précision ajoutée.
  alternative: « prophètes et dirigeants » ou « prophètes et rois d’autrefois »
  rationale: Le grec nomme précisément des prophètes et des rois, mais n’ajoute ni « d’autrefois » ni une identification particulière. La traduction maintient ainsi le contraste entre ces figures et les disciples sans le résoudre davantage.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve la structure parallèle entre voir et entendre. Le contraste est rendu par « mais », plus idiomatique en français devant les deux propositions négatives.
