  source_fidelity: 'Le sens central est bien rendu : contraste entre l’abondance de la moisson et le petit nombre d’ouvriers, impératif de prière, titre « Seigneur de la moisson », envoi d’ouvriers et possessif « sa moisson ». « Dans sa moisson » rend correctement εἰς τὸν θερισμὸν αὐτοῦ sans ajouter « champ ». L’imparfait ἔλεγεν peut être rendu par un imparfait, mais, dans cette formule narrative introductive, le passé simple français (« il leur dit ») est plus idiomatique sans perte significative de sens contextuel.'
  naturalness: Le texte est globalement clair et de registre approprié. « Il leur disait » sonne toutefois comme une parole répétée ou prolongée et est moins naturel, isolément, qu’« Il leur dit » dans un récit biblique français moderne. La note peut aussi exprimer plus directement la nuance énergique de ἐκβάλῃ.
  terminology: « Moisson », « ouvriers », « priez » et « Seigneur » sont des équivalents établis, compréhensibles et théologiquement non interprétatifs. « Envoyer » est naturel dans le contexte, à condition que la note conserve la nuance plus énergique possible du verbe grec.
