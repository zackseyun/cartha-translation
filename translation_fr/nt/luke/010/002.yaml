source:
  edition: SBLGNT
  text: ἔλεγεν ⸀δὲ πρὸς αὐτούς· Ὁ μὲν θερισμὸς πολύς, οἱ δὲ ἐργάται ὀλίγοι· δεήθητε οὖν τοῦ κυρίου τοῦ θερισμοῦ ὅπως ⸂ἐργάτας ἐκβάλῃ⸃ εἰς τὸν θερισμὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/002.yaml
  text: And he said to them[a], “The harvest is plentiful, but the workers are few. Therefore pray to the Lord of the harvest that he would send out workers into his harvest.”
translation:
  language: fr
  text: 'Il leur dit : « La moisson est abondante, mais les ouvriers sont peu nombreux. Priez donc le Seigneur de la moisson d’envoyer[a] des ouvriers dans sa moisson. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « envoyer avec force » ; le verbe grec peut avoir un sens plus énergique que le simple « envoyer ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: Il leur disait
  rationale: L’imparfait grec est conservé par l’imparfait français, naturel ici pour introduire une parole adressée au groupe dans le récit.
- source_word: δὲ
  choice: non rendu séparément
  rationale: Cette particule assure une transition légère. En français, l’enchaînement narratif reste naturel sans conjonction explicite.
- source_word: θερισμός
  choice: moisson
  rationale: Ce terme courant conserve à la fois l’image agricole et sa portée métaphorique.
- source_word: πολύς
  choice: abondante
  rationale: Avec « moisson », « abondante » exprime naturellement l’idée d’une grande quantité.
- source_word: ἐργάται
  choice: ouvriers
  rationale: « Ouvriers » désigne clairement ceux qui accomplissent le travail de la moisson et appartient au français courant.
- source_word: ὀλίγοι
  choice: peu nombreux
  rationale: Cette formulation produit en français un contraste naturel avec « abondante ».
- source_word: δεήθητε
  choice: Priez
  rationale: L’impératif exprime une demande pressante adressée à Dieu ; « priez » convient au contexte sans exagérer la nuance.
- source_word: οὖν
  choice: donc
  rationale: « Donc » marque clairement la conséquence tirée du constat précédent.
- source_word: κύριος
  choice: Seigneur
  rationale: « Seigneur » rend l’autorité du propriétaire et maître de la moisson tout en conservant la résonance théologique du titre.
- source_word: ὅπως
  choice: de
  rationale: Après « prier quelqu’un », la construction française « de » suivie de l’infinitif exprime naturellement le contenu de la demande.
- source_word: ἐκβάλῃ
  choice: envoyer
  rationale: Dans ce contexte missionnaire, « envoyer » exprime naturellement la mise en action et le mouvement vers la moisson. Une note conserve la force potentiellement plus vive du verbe grec.
- source_word: εἰς τὸν θερισμὸν αὐτοῦ
  choice: dans sa moisson
  rationale: Cette traduction proche du grec maintient la métaphore et le possessif sans ajouter explicitement l’idée de champ.
theological_decisions:
- issue: Référent et portée du titre « Seigneur de la moisson »
  choice: Conserver le titre métaphorique sans en préciser le référent
  alternative: Expliciter qu’il s’agit de Dieu, ou y voir une affirmation implicite de l’autorité divine de Jésus sur la mission
  rationale: Le texte présente une autorité qui possède la moisson et envoie les ouvriers, mais il n’explicite pas ici toutes les implications christologiques. Le titre est donc maintenu sans développement interprétatif.
translation_notes:
  register: Français international moderne, digne et accessible. L’imparfait « disait » préserve l’aspect du récit ; le vocabulaire traditionnel de la métaphore (« moisson », « ouvriers », « Seigneur ») demeure immédiatement compréhensible.
