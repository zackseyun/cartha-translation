id: LUK.10.41
reference: Luke 10:41
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ εἶπεν αὐτῇ ὁ ⸀κύριος· Μάρθα Μάρθα, μεριμνᾷς καὶ ⸀θορυβάζῃ περὶ πολλά,
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/041.yaml
  text: But the Lord answered her[a], “Martha, Martha, you are anxious and troubled about many things,”
translation:
  language: fr
  text: 'Mais le Seigneur lui répondit : « Marthe, Marthe, tu t’inquiètes et tu t’agites[a] au sujet de beaucoup de choses, »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « tu es inquiète et troublée ».'
    reason: Alternative lexicale reflétant une autre manière naturelle de rendre μεριμνᾷς et θορυβάζῃ.
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ εἶπεν αὐτῇ
  choice: Mais le Seigneur lui répondit
  rationale: La tournure participiale suivie de εἶπεν forme une expression narrative idiomatique, rendue naturellement en français par le verbe simple « répondit ». δὲ marque ici un léger contraste avec les paroles précédentes de Marthe, d’où « Mais ».
- source_word: ὁ κύριος
  choice: le Seigneur
  rationale: Dans le récit de Luc, κύριος est un titre usuel de Jésus et peut porter à la fois une nuance de respect et une portée christologique. « Seigneur » en préserve mieux l’amplitude que « maître ».
- source_word: Μάρθα Μάρθα
  choice: Marthe, Marthe
  rationale: La répétition du vocatif est conservée, car elle exprime l’insistance et la sollicitude de Jésus.
- source_word: μεριμνᾷς
  choice: tu t’inquiètes
  rationale: Le verbe désigne l’inquiétude intérieure ou le souci. La forme pronominale est naturelle en français moderne.
- source_word: θορυβάζῃ
  choice: tu t’agites
  rationale: Le verbe évoque le trouble et l’agitation. « Tu t’agites » le distingue de l’inquiétude exprimée par μεριμνᾷς tout en restant naturel.
- source_word: περὶ πολλά
  choice: au sujet de beaucoup de choses
  rationale: Cette formulation conserve le sens large de la préposition et du neutre pluriel sans préciser indûment la nature des préoccupations de Marthe.
theological_decisions:
- issue: Traduction de κύριος comme titre de Jésus
  choice: le Seigneur
  alternative: le maître
  rationale: « Seigneur » maintient la valeur respectueuse du titre ainsi que sa possible résonance christologique dans Luc, sans réduire le terme à une relation sociale de maîtrise.
translation_notes:
  register: Français international moderne, courant et digne. La phrase conserve la répétition affectueuse du nom et distingue l’inquiétude intérieure de l’agitation, sans atténuer ni surinterpréter les paroles de Jésus.
