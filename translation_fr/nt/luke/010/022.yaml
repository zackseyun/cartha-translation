id: LUK.10.22
reference: Luke 10:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸀πάντα μοι παρεδόθη ὑπὸ τοῦ πατρός μου, καὶ οὐδεὶς γινώσκει τίς ἐστιν ὁ υἱὸς εἰ μὴ ὁ πατήρ, καὶ τίς ἐστιν ὁ πατὴρ εἰ μὴ ὁ υἱὸς καὶ ᾧ ⸀ἐὰν βούληται ὁ υἱὸς ἀποκαλύψαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/022.yaml
  text: All things have been handed over to me by my Father[a], and no one knows who the Son is except the Father[b], and who the Father is except the Son and anyone to whom the Son chooses to reveal him.
translation:
  language: fr
  text: Tout m’a été remis par mon Père[a]. Personne ne sait qui est le Fils, si ce n’est le Père, ni qui est le Père, si ce n’est le Fils et celui à qui le Fils veut le révéler[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Toutes choses m’ont été remises par mon Père ».
    reason: lexical_alternative
  - marker: b
    text: Ou « et quiconque à qui le Fils décide de le révéler ».
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα
  choice: Tout
  rationale: Le neutre pluriel a ici une portée globale. « Tout » est naturel en français moderne et conserve le caractère solennel et compréhensif de l’affirmation.
- source_word: παρεδόθη
  choice: m’a été remis
  rationale: L’aoriste passif de παραδίδωμι indique que le Père a placé « tout » entre les mains du Fils. « A été remis » garde le sens fondamental sans introduire la nuance plus étroite de gestion qu’aurait « confié ».
- source_word: ὑπὸ τοῦ πατρός μου
  choice: par mon Père
  rationale: Ὑπό suivi du génitif désigne l’agent personnel de la forme passive; « par mon Père » rend cette fonction avec précision.
- source_word: γινώσκει
  choice: sait
  rationale: Dans la tournure française « savoir qui est quelqu’un », « sait » est plus idiomatique que « connaît » et n’ajoute pas l’intensification interprétative de « connaît pleinement ».
- source_word: τίς ἐστιν ὁ υἱός / τίς ἐστιν ὁ πατήρ
  choice: qui est le Fils / qui est le Père
  rationale: Cette formulation directe préserve la dimension personnelle et identitaire des deux propositions sans les expliquer davantage.
- source_word: εἰ μὴ
  choice: si ce n’est
  rationale: Cette expression française digne et actuelle marque clairement l’exception exclusive dans les deux propositions parallèles.
- source_word: ᾧ ἐὰν βούληται ὁ υἱὸς ἀποκαλύψαι
  choice: celui à qui le Fils veut le révéler
  rationale: La construction désigne un destinataire indéfini dépendant de la volonté du Fils. Le pronom objet « le » renvoie naturellement au Père, objet sous-entendu de ἀποκαλύψαι.
- source_word: βούληται
  choice: veut
  rationale: « Veut » exprime directement la volonté décisionnelle du Fils en français courant, sans l’archaïsme possible de « daigne » ni l’affaiblissement de « désire ».
- source_word: ἀποκαλύψαι
  choice: révéler
  rationale: « Révéler » conserve le sens de dévoilement et la portée théologique du terme grec, tout en restant intelligible.
theological_decisions:
- issue: Connaissance réciproque exclusive du Père et du Fils
  choice: La formulation directe « Personne ne sait… si ce n’est… » est maintenue sans amplification.
  alternative: Ajouter « pleinement », « véritablement » ou une explication de la nature de cette connaissance.
  rationale: Le texte affirme une connaissance mutuelle unique et exclusive, mais γινώσκει ne comporte pas explicitement un adverbe d’intensité. La syntaxe porte elle-même la force christologique.
- issue: Volonté révélatrice du Fils
  choice: « celui à qui le Fils veut le révéler »
  alternative: « celui à qui le Fils désire le révéler » ou une paraphrase atténuant son initiative.
  rationale: Le grec présente le Fils comme celui dont dépend la révélation du Père. « Veut » préserve cette agence sans systématiser davantage sa portée.
- issue: Objet implicite de « révéler »
  choice: Le pronom « le » explicite que le Père est révélé.
  alternative: Laisser le verbe sans objet ou paraphraser « révéler qui est le Père ».
  rationale: Le grec sous-entend l’objet à partir de la proposition précédente. Le français exige ici un complément; « le » reprend sobrement « le Père » sans ajout interprétatif.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme grec est conservé, avec « ni » pour enchaîner naturellement les deux propositions négatives. Les majuscules à « Père » et « Fils » signalent leur emploi comme titres relationnels dans ce contexte.
