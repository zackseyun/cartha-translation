id: LUK.10.20
reference: Luke 10:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: πλὴν ἐν τούτῳ μὴ χαίρετε ὅτι τὰ πνεύματα ὑμῖν ὑποτάσσεται, χαίρετε δὲ ὅτι τὰ ὀνόματα ὑμῶν ⸀ἐγγέγραπται ἐν τοῖς οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/020.yaml
  text: Nevertheless[a], do not rejoice in this, that the spirits submit to you[c][b], but rejoice that your names have been written in the heavens.
translation:
  language: fr
  text: Toutefois, ne vous réjouissez pas de ce que les esprits[a] vous sont soumis ; mais réjouissez-vous de ce que vos noms sont inscrits dans les cieux[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le contexte désigne des êtres spirituels hostiles ; on pourrait aussi traduire « les démons » ou « les esprits mauvais », bien que le grec dise ici simplement « les esprits ».
    reason: lexical_alternative
  - marker: b
    text: 'Ou, selon la tournure française traditionnelle, « au ciel ». Le grec emploie le pluriel : « dans les cieux ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: Toutefois
  rationale: Marque nettement la réserve corrective de Jésus tout en gardant un registre naturel et digne.
- source_word: ἐν τούτῳ μὴ χαίρετε ὅτι
  choice: ne vous réjouissez pas de ce que
  rationale: Cette tournure française naturelle conserve le lien entre le motif de la joie et la proposition introduite par ὅτι.
- source_word: μὴ χαίρετε ... χαίρετε δὲ
  choice: ne vous réjouissez pas ... mais réjouissez-vous
  rationale: La répétition du même verbe préserve le contraste rhétorique et lexical du grec.
- source_word: τὰ πνεύματα
  choice: les esprits
  rationale: Le contexte désigne des êtres spirituels hostiles, mais le grec dit simplement « les esprits » ; la traduction n'en réduit donc pas la portée dans le texte principal.
- source_word: ὑμῖν ὑποτάσσεται
  choice: vous sont soumis
  rationale: Rend clairement l'idée qu'ils se trouvent sous l'autorité des disciples et respecte la forme verbale grecque.
- source_word: τὰ ὀνόματα ὑμῶν
  choice: vos noms
  rationale: Équivalent français direct et idiomatique de la construction possessive grecque.
- source_word: ἐγγέγραπται
  choice: sont inscrits
  rationale: Le présent résultatif français exprime naturellement l'état durable issu d'une inscription accomplie, valeur portée par le parfait passif grec.
- source_word: ἐν τοῖς οὐρανοῖς
  choice: dans les cieux
  rationale: Conserve le pluriel explicite du grec tout en employant une expression française biblique encore compréhensible et naturelle.
theological_decisions:
- issue: Nature des esprits
  choice: les esprits
  alternative: les démons ; les esprits mauvais
  rationale: Le contexte implique des puissances spirituelles hostiles, mais πνεύματα n'apporte pas lui-même ces précisions. Le texte principal maintient donc l'ambiguïté lexicale.
- issue: Lieu où les noms sont inscrits
  choice: dans les cieux
  alternative: au ciel
  rationale: Le pluriel οὐρανοῖς est conservé au lieu d'être normalisé selon l'expression française traditionnelle au singulier.
- issue: Valeur du parfait passif ἐγγέγραπται
  choice: sont inscrits
  alternative: ont été inscrits
  rationale: « Sont inscrits » met en avant le résultat présent et durable sans nier l'action antérieure, préservant ainsi la tension aspectuelle du parfait grec.
translation_notes:
  register: Français international moderne, sobre et digne. La répétition de « réjouissez-vous » maintient la force rhétorique de l'original ; « vous sont soumis » et « dans les cieux » privilégient la précision sans rendre la phrase obscure.
