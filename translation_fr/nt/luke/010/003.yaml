source:
  edition: SBLGNT
  text: ὑπάγετε· ⸀ἰδοὺ ἀποστέλλω ὑμᾶς ὡς ἄρνας ἐν μέσῳ λύκων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/003.yaml
  text: Go[a]; behold[b], I am sending you out as lambs in the midst of wolves.
translation:
  language: fr
  text: Allez ! Voici, je vous envoie comme des agneaux au milieu des loups.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπάγετε
  choice: Allez
  rationale: Impératif présent à la deuxième personne du pluriel. « Allez » exprime naturellement et avec concision l’ordre de partir en mission.
- source_word: ἰδοὺ
  choice: Voici
  rationale: Particule qui attire solennellement l’attention sur ce qui suit. « Voici » convient au registre biblique moderne sans l’archaïsme de « voici que » employé systématiquement.
- source_word: ἀποστέλλω ὑμᾶς
  choice: je vous envoie
  rationale: Le présent grec et le pronom pluriel sont rendus directement. En français, « envoyer » exprime suffisamment le départ en mission sans ajout interprétatif tel que « charger d’une mission ».
- source_word: ὡς
  choice: comme
  rationale: Introduit une comparaison et non une identification ; « comme » est l’équivalent français naturel.
- source_word: ἄρνας
  choice: des agneaux
  rationale: Le grec désigne précisément des agneaux, image qui souligne leur vulnérabilité. Il ne faut pas généraliser en « brebis » ni harmoniser avec des formulations parallèles.
- source_word: ἐν μέσῳ λύκων
  choice: au milieu des loups
  rationale: Rend étroitement l’expression grecque tout en restant idiomatique en français et en conservant l’image d’un environnement hostile qui les entoure.
theological_decisions:
- issue: Image animale décrivant la mission des disciples
  choice: Conserver la comparaison « comme des agneaux au milieu des loups »
  alternative: comme des brebis parmi les loups
  rationale: ἄρνας signifie « agneaux », non le terme plus général « brebis ». Cette traduction préserve l’accent mis sur la vulnérabilité des envoyés sans harmoniser le verset avec d’autres passages.
translation_notes:
  register: Français international moderne, clair et digne. L’exclamation après « Allez » restitue la force de l’impératif ; « Voici » garde la fonction d’appel à l’attention de ἰδού. Aucun appel de note n’est nécessaire, puisque les nuances lexicales importantes sont directement préservées dans le texte.
