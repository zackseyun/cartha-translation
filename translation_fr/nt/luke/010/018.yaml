  text: And he said to them[a], “I was watching Satan fall like lightning from heaven.”
translation:
  language: fr
  text: 'Il leur dit : « Je regardais Satan tomber du ciel comme un éclair[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « J’ai vu Satan tomber du ciel comme un éclair. » Le verbe grec à l’imparfait peut aussi être rendu plus simplement par un passé composé, mais « je regardais » en souligne davantage l’aspect en cours.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν δὲ αὐτοῖς
  choice: Il leur dit
  rationale: Le passé simple convient au récit et le pronom datif est rendu naturellement par « leur ». Le léger lien marqué par δέ n’exige pas ici un connecteur français explicite.
- source_word: Ἐθεώρουν
  choice: Je regardais
  rationale: L’imparfait français préserve l’aspect imperfectif et duratif du verbe grec tout en restant naturel.
- source_word: τὸν Σατανᾶν
  choice: Satan
  rationale: Le nom ou titre personnel est rendu par sa forme française traditionnelle.
- source_word: ὡς ἀστραπὴν
  choice: comme un éclair
  rationale: Cette formulation française idiomatique conserve la comparaison et l’image de soudaineté et d’éclat.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: du ciel
  rationale: Dans ce contexte, « ciel » conserve mieux que « firmament » ou « espace céleste » la portée cosmologique et théologique du grec οὐρανός.
- source_word: πεσόντα
  choice: tomber
  rationale: L’infinitif complète naturellement le verbe de perception en français et exprime l’événement présenté par le participe aoriste.
theological_decisions:
- issue: Valeur temporelle et aspectuelle de la chute de Satan
  choice: « Je regardais Satan tomber »
  alternative: « J’ai vu Satan tomber »
  rationale: L’imparfait conserve l’aspect imperfectif de Ἐθεώρουν sans déterminer si Jésus évoque une chute primordiale, l’effet présent de la mission des disciples ou une vision prophétique de la défaite de Satan.
translation_notes:
  register: Français moderne, international et digne. La syntaxe reste simple et orale, adaptée à une parole directe, sans explicitation doctrinale.
