id: LUK.10.23
reference: Luke 10:23
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ στραφεὶς πρὸς τοὺς μαθητὰς κατ’ ἰδίαν εἶπεν· Μακάριοι οἱ ὀφθαλμοὶ οἱ βλέποντες ἃ βλέπετε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/023.yaml
  text: And turning to the disciples privately[a], he said, “Blessed are the eyes that see what you see.”
translation:
  language: fr
  text: 'Et, se tournant vers les disciples, il leur dit en privé[a] : « Heureux sont les yeux qui voient ce que vous voyez. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à l’écart ».
    reason: Variante lexicale pour l’expression κατ’ ἰδίαν, indiquant une parole adressée séparément des autres.
lexical_decisions:
- source_word: στραφεὶς
  choice: se tournant
  rationale: Le participe présent français conserve naturellement le lien participial avec le verbe principal tout en indiquant le geste qui précède la parole.
- source_word: κατ’ ἰδίαν
  choice: en privé
  rationale: Cette expression idiomatique indique que Jésus s’adresse aux disciples à part des autres, sans préciser davantage les circonstances.
- source_word: μαθητάς
  choice: disciples
  rationale: « Disciples » est le terme français courant qui conserve les dimensions d’apprentissage et d’attachement au maître.
- source_word: Μακάριοι
  choice: Heureux
  rationale: « Heureux » est la formulation française consacrée et naturelle des béatitudes. Ici, le mot exprime une condition privilégiée et déclarée bienheureuse, non une simple émotion passagère.
- source_word: ὀφθαλμοὶ
  choice: les yeux
  rationale: La formulation garde la métonymie concrète du grec, qui met l’accent sur le privilège de voir.
- source_word: οἱ βλέποντες
  choice: qui voient
  rationale: La proposition relative rend naturellement le participe grec employé comme qualificatif de « yeux » et en conserve l’aspect descriptif.
- source_word: ἃ βλέπετε
  choice: ce que vous voyez
  rationale: Cette tournure directe et idiomatique reproduit le relatif grec sans explicitation interprétative.
theological_decisions:
- issue: Portée de la béatitude
  choice: Une proclamation du bonheur privilégié accordé à ceux qui voient ce que les disciples voient.
  alternative: Une simple expression de bonheur émotionnel.
  rationale: Dans cette formule de béatitude, μακάριοι déclare une situation objectivement privilégiée devant Dieu. « Heureux » conserve cette portée dans l’usage biblique français sans ajouter au texte l’objet précis de la vision.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe participiale et l’image des « yeux » sont conservées; le point d’exclamation rend la force de la proclamation sans en amplifier le contenu.
