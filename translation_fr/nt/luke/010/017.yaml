id: LUK.10.17
reference: Luke 10:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ὑπέστρεψαν δὲ οἱ ἑβδομήκοντα ⸀δύο μετὰ χαρᾶς λέγοντες· Κύριε, καὶ τὰ δαιμόνια ὑποτάσσεται ἡμῖν ἐν τῷ ὀνόματί σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/017.yaml
  text: Then the seventy-two returned with joy[a], saying, “Lord, even the demons submit to us in your name.”
translation:
  language: fr
  text: 'Les soixante-douze revinrent alors avec joie[a] et dirent : « Seigneur, même les démons se soumettent à nous en ton nom ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Certains manuscrits portent « les soixante-dix » au lieu de « les soixante-douze ».
    reason: textual_variant
lexical_decisions:
- source_word: Ὑπέστρεψαν
  choice: revinrent
  rationale: L’aoriste de ὑποστρέφω indique le retour de mission. Le passé simple convient au registre narratif digne et reste naturel dans une traduction biblique française.
- source_word: δὲ
  choice: alors
  rationale: δέ fait progresser le récit sans marquer une forte opposition. « Alors » rend ici naturellement cette transition narrative.
- source_word: οἱ ἑβδομήκοντα δύο
  choice: les soixante-douze
  rationale: Le texte imprimé du SBLGNT porte « soixante-douze ». La variante importante « soixante-dix » est signalée en note.
- source_word: μετὰ χαρᾶς
  choice: avec joie
  rationale: Cette formulation directe conserve le nom χαρά et exprime clairement l’état d’esprit des envoyés.
- source_word: λέγοντες
  choice: et dirent
  rationale: En français narratif, la coordination avec un verbe conjugué restitue plus naturellement le participe grec introduisant le discours direct.
- source_word: Κύριε
  choice: Seigneur
  rationale: Le vocatif κύριε, adressé à Jésus, est rendu par son équivalent néotestamentaire courant et digne.
- source_word: καὶ
  choice: même
  rationale: 'Dans cette exclamation, καί a une valeur intensive ou ascendante : les envoyés s’émerveillent que même les démons leur soient soumis.'
- source_word: τὰ δαιμόνια
  choice: les démons
  rationale: « Les démons » traduit directement le terme grec et son article, sans le remplacer par l’expression plus interprétative « les esprits mauvais ».
- source_word: ὑποτάσσεται
  choice: se soumettent
  rationale: Le présent exprime la réalité constatée durant la mission. Le pluriel français s’accorde naturellement avec « les démons ».
- source_word: ἡμῖν
  choice: à nous
  rationale: Le datif régi par ὑποτάσσω est rendu directement par « à nous ».
- source_word: ἐν τῷ ὀνόματί σου
  choice: en ton nom
  rationale: Cette expression conserve l’idiome biblique et peut évoquer l’autorité ou la puissance liée au nom de Jésus sans réduire le grec à une seule nuance.
theological_decisions:
- issue: Variante textuelle concernant le nombre des envoyés
  choice: les soixante-douze
  alternative: les soixante-dix
  rationale: Le texte source fourni, le SBLGNT, lit « soixante-douze ». La leçon « soixante-dix », bien attestée et connue, est conservée en note afin de ne pas masquer la variation manuscrite.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple soutient le récit écrit sans archaïsme lexical. « En ton nom » conserve la formulation biblique familière et l’ambiguïté féconde entre autorité, mandat et puissance associée au nom de Jésus.
