revisions:
- from: Quand ils eurent tout accompli conformément à la loi du Seigneur[a], ils retournèrent en Galilée, dans leur propre ville[b], Nazareth.
  to: Quand ils eurent accompli tout ce que prescrivait la loi du Seigneur[a], ils retournèrent en Galilée, dans leur propre ville[b], Nazareth.
  rationale: 'La révision rend explicitement, dans un français naturel, le contenu de πάντα τὰ κατὰ τὸν νόμον κυρίου : les actes prescrits par la loi. Elle conserve la temporalité sans imposer l’immédiateté, le registre narratif, l’emphase de « leur propre ville » et les deux ancres de notes.'
  reviewer_model: gpt-5.6-terra
