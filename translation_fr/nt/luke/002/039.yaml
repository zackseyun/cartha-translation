review_pass:
  verdict: revise
  source_fidelity: 'La séquence temporelle (« Quand ils eurent… ils retournèrent »), le retour en Galilée et l’apposition « Nazareth » rendent fidèlement le grec. Toutefois, « tout accompli conformément à la loi » rattache grammaticalement « conformément à la loi » au seul verbe « accompli » et ne rend pas aussi clairement le substantif sous-entendu : « toutes les choses relatives à/conformes à la loi ». « Tout ce que prescrivait la loi » explicite sobrement ce rapport sans ajout doctrinal.'
  naturalness: Le passé antérieur suivi du passé simple est naturel dans un registre narratif français soutenu. « Dans leur propre ville » est intelligible et conserve l’emphase possessive, mais « tout ce que prescrivait la loi » produit une phrase plus idiomatique et moins ambiguë.
  terminology: « La loi du Seigneur » et « Seigneur » respectent le langage scripturaire et le référent divin de κυρίου. « Ville » est recevable pour πόλις, même si Nazareth était une petite localité; la note en informe utilement le lecteur. « Nazareth » est la forme française établie.
  issues:
  - severity: low
    issue: Portée de « conformément à la loi » dans la proposition initiale
    rationale: Le grec πάντα τὰ κατὰ τὸν νόμον κυρίου désigne tout ce qui relevait de ou était prescrit par la loi du Seigneur. La formulation actuelle est possible, mais « accomplir tout conformément à » est moins nette en français et peut donner l’impression que le texte décrit seulement la manière d’accomplir « tout ».
  revised_text: Quand ils eurent accompli tout ce que prescrivait la loi du Seigneur[a], ils retournèrent en Galilée, dans leur propre ville[b], Nazareth.
  revised_footnotes:
  - marker: a
    text: Ou « tout ce qui était conforme à la loi du Seigneur ».
    reason: lexical_alternative
  - marker: b
    text: Le mot grec rendu par « ville » pouvait aussi désigner une localité de petite taille; Nazareth était une petite agglomération.
    reason: cultural_note
  revision_rationale: 'La révision rend explicitement, dans un français naturel, le contenu de πάντα τὰ κατὰ τὸν νόμον κυρίου : les actes prescrits par la loi. Elle conserve la temporalité sans imposer l’immédiateté, le registre narratif, l’emphase de « leur propre ville » et les deux ancres de notes.'
