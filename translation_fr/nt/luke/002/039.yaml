id: LUK.2.39
reference: Luke 2:39
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ ὡς ἐτέλεσαν ⸀πάντα τὰ κατὰ τὸν νόμον κυρίου, ⸀ἐπέστρεψαν εἰς τὴν Γαλιλαίαν ⸀εἰς πόλιν ἑαυτῶν Ναζαρέθ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/039.yaml
  text: And when they had completed everything according to the law of the Lord[a], they returned to Galilee, to their own town[b], Nazareth.
translation:
  language: fr
  text: Quand ils eurent accompli tout ce que prescrivait la loi du Seigneur[a], ils retournèrent en Galilée, dans leur propre ville[b], Nazareth.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tout ce qui était conforme à la loi du Seigneur ».
    reason: lexical_alternative
  - marker: b
    text: Le mot grec rendu par « ville » pouvait aussi désigner une localité de petite taille; Nazareth était une petite agglomération.
    reason: cultural_note
lexical_decisions:
- source_word: ὡς
  choice: quand
  rationale: Dans cette construction temporelle suivie d’un aoriste, ὡς situe l’action principale après l’achèvement de ce qui précède, sans nécessairement exprimer l’immédiateté.
- source_word: ἐτέλεσαν
  choice: eurent tout accompli
  rationale: Le verbe indique que les actes prescrits ont été menés à leur terme. « Accomplir » convient au registre narratif, tandis que la construction au passé antérieur marque clairement l’antériorité par rapport au retour.
- source_word: πάντα τὰ κατὰ τὸν νόμον κυρίου
  choice: tout accompli conformément à la loi du Seigneur
  rationale: Cette formulation reste proche de la structure grecque et exprime la totalité des actes conformes aux prescriptions de la Loi, sans intégrer directement dans le texte l’explicitation « tout ce qu’exigeait ».
- source_word: νόμον κυρίου
  choice: la loi du Seigneur
  rationale: La construction génitive est rendue directement et conserve la tonalité scripturaire de l’expression.
- source_word: κυρίου
  choice: Seigneur
  rationale: Dans ce contexte, κύριος désigne Dieu comme auteur de la Loi. « Seigneur » traduit le terme grec sans substituer artificiellement le tétragramme.
- source_word: ἐπέστρεψαν
  choice: ils retournèrent
  rationale: Dans ce contexte de déplacement, le verbe signifie revenir ou retourner. Le passé simple assure une narration française claire et digne.
- source_word: εἰς τὴν Γαλιλαίαν
  choice: en Galilée
  rationale: Pour une destination régionale, « en Galilée » est la tournure idiomatique française.
- source_word: εἰς πόλιν ἑαυτῶν
  choice: dans leur propre ville
  rationale: πόλις peut désigner une ville ou une localité; « ville » est le correspondant français habituel. « Propre » préserve l’insistance du pronom réfléchi ἑαυτῶν.
- source_word: Ναζαρέθ
  choice: Nazareth
  rationale: Il s’agit de la forme française établie du nom de lieu.
theological_decisions:
- issue: Référent de « Seigneur » dans « la loi du Seigneur »
  choice: « Seigneur » désigne Dieu, dont la Loi est donnée dans les Écritures.
  alternative: Aucune autre lecture ayant une conséquence théologique majeure ne s’impose ici.
  rationale: L’expression appartient au langage scripturaire juif. La traduction directe souligne l’obéissance de la famille sans ajouter d’affirmation doctrinale étrangère au verset.
translation_notes:
  register: Français narratif moderne, clair et digne. Le passé antérieur suivi du passé simple rend précisément la succession des actions; « conformément à » conserve le rapport souple exprimé par la construction grecque sans réduire celle-ci à la seule idée d’obligation.
