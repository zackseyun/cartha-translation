id: LUK.2.27
reference: Luke 2:27
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἦλθεν ἐν τῷ πνεύματι εἰς τὸ ἱερόν· καὶ ἐν τῷ εἰσαγαγεῖν τοὺς γονεῖς τὸ παιδίον Ἰησοῦν τοῦ ποιῆσαι αὐτοὺς κατὰ τὸ εἰθισμένον τοῦ νόμου περὶ αὐτοῦ
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/027.yaml
  text: And he came in the Spirit into the temple[a]; and when the parents brought in the child Jesus to do for him according to the custom of the law[b],
translation:
  language: fr
  text: Il vint au temple dans l’Esprit[a]. Et lorsque les parents y amenèrent l’enfant Jésus pour accomplir à son égard ce qui était habituellement prescrit par la Loi[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « par l’Esprit ». Littéralement : « dans l’Esprit ». Dans le contexte, l’expression renvoie très probablement à l’Esprit Saint.'
    reason: lexical_alternative
  - marker: b
    text: 'Le grec dit : « les parents ». Luc emploie ici le langage familial ordinaire pour parler de Marie et de Joseph dans leur rôle auprès de Jésus.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν τῷ πνεύματι
  choice: conduit par l’Esprit
  rationale: Dans le contexte immédiat, πνεῦμα désigne très probablement l’Esprit Saint. Le français « conduit par l’Esprit » exprime naturellement la force circonstancielle ou instrumentale de ἐν, tout en conservant l’idée que la venue de Siméon se fait sous l’action de l’Esprit.
- source_word: ἱερόν
  choice: temple
  rationale: ἱερόν désigne ici l’ensemble du domaine du Temple, non le sanctuaire intérieur proprement dit. « Temple » est le terme français courant et suffisamment précis dans ce contexte.
- source_word: ἐν τῷ εἰσαγαγεῖν
  choice: lorsque … y amenèrent
  rationale: La construction ἐν avec l’infinitif articulé a une valeur temporelle. « Lorsque » la rend clairement, et « y amenèrent » reprend naturellement le mouvement d’entrée dans le Temple.
- source_word: γονεῖς
  choice: les parents
  rationale: C’est le sens direct et ordinaire du mot grec. Luc décrit ainsi Marie et Joseph dans leur rôle familial auprès de Jésus, sans traiter ici la question de sa conception.
- source_word: παιδίον Ἰησοῦν
  choice: l’enfant Jésus
  rationale: παιδίον désigne ici le très jeune enfant. « L’enfant Jésus » est naturel en français et conserve l’apposition du nom.
- source_word: τοῦ ποιῆσαι αὐτοὺς
  choice: pour accomplir
  rationale: L’infinitif génitif exprime le but, et αὐτούς a pour sujet les parents. En français, le sujet reste clairement celui de « amenèrent », ce qui évite une formulation lourde.
- source_word: κατὰ τὸ εἰθισμένον τοῦ νόμου
  choice: ce qui était prescrit par la coutume de la Loi
  rationale: εἰθισμένον renvoie à ce qui est établi par l’usage ou la pratique prescrite. Cette formulation française rend l’autorité normative de la Loi sans réduire le terme à une simple habitude sociale.
- source_word: περὶ αὐτοῦ
  choice: à son égard
  rationale: περί avec le génitif marque ici ce qui concerne Jésus. « À son égard » conserve explicitement cette relation sans préciser davantage quel rite est visé.
theological_decisions:
- issue: Référence de « l’Esprit » dans l’action de Siméon
  choice: L’Esprit Saint
  alternative: L’esprit ou la disposition intérieure de Siméon
  rationale: Les mentions répétées de l’Esprit Saint en Luc 2.25-27 favorisent fortement cette lecture. La majuscule française l’indique, sans ajouter le qualificatif « Saint » absent de ce verset.
- issue: Désignation de Marie et Joseph comme « les parents »
  choice: Traduire γονεῖς directement par « les parents »
  alternative: « les responsables de l’enfant » ou « Joseph et Marie »
  rationale: Le langage familial ordinaire du récit doit être conservé. Il décrit leur rôle social et familial dans cette scène et ne constitue pas une affirmation sur la paternité biologique de Joseph.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la continuité syntaxique du verset, qui se poursuit après la virgule. « La Loi » porte une majuscule pour désigner la Loi de Moïse.
