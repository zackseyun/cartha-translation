  - severity: low
    issue: « ce qui était prescrit par la coutume de la Loi » est maladroit en français.
    rationale: La construction peut suggérer que la coutume prescrit par elle-même. « Ce qui était habituellement prescrit par la Loi » exprime plus clairement le caractère coutumier de l’observance liée à la Loi.
