  naturalness: La phrase est naturelle dans l’ensemble et conserve à juste titre la virgule finale, puisque la phrase grecque se poursuit au verset suivant. « Ce qui était prescrit par la coutume de la Loi » est toutefois pesant et sémantiquement moins net en français. « Ce qui était habituellement prescrit par la Loi » est plus idiomatique tout en rendant εἰθισμένον.
  terminology: « Esprit », avec majuscule, est justifié par le contexte immédiat. « Temple », « parents », « enfant Jésus » et « Loi » conviennent. La note sur les parents est sobre et ne tire pas de conclusion doctrinale indue.
