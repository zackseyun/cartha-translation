revisions:
- from: Il vint au temple, conduit par l’Esprit[a]. Et lorsque les parents y amenèrent l’enfant Jésus pour accomplir à son égard ce qui était prescrit par la coutume de la Loi[b],
  to: Il vint au temple dans l’Esprit[a]. Et lorsque les parents y amenèrent l’enfant Jésus pour accomplir à son égard ce qui était habituellement prescrit par la Loi[b],
