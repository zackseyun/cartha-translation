reference: Luke 2:40
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Τὸ δὲ παιδίον ηὔξανεν καὶ ἐκραταιοῦτο ⸂πληρούμενον σοφίᾳ⸃, καὶ χάρις θεοῦ ἦν ἐπ’ αὐτό.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/040.yaml
  text: And the child grew and became strong[a], being filled with wisdom, and the favor of God was upon him.
translation:
  language: fr
  text: L’enfant grandissait et se fortifiait, rempli de sagesse[a], et la faveur[b] de Dieu était sur lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Certains manuscrits omettent : « rempli de sagesse ».'
    reason: Incertitude textuelle signalée par les crochets dans le texte grec source.
  - marker: b
    text: 'Ou : « la grâce de Dieu ».'
    reason: Alternative lexicale légitime pour χάρις.
lexical_decisions:
- source_word: Τὸ δὲ παιδίον
  choice: L’enfant
  rationale: παιδίον désigne ici l’enfant Jésus dans le contexte de sa petite enfance. Le δέ assure une transition narrative légère que le français rend naturellement sans conjonction explicite.
- source_word: ηὔξανεν
  choice: grandissait
  rationale: L’imparfait grec présente une croissance continue; l’imparfait français en restitue directement l’aspect progressif.
- source_word: ἐκραταιοῦτο
  choice: se fortifiait
  rationale: La forme imperfective décrit un développement continu de la force. « Se fortifiait » est naturel et conserve cette progression sans préciser indûment si la force est physique, intérieure ou les deux.
- source_word: πληρούμενον σοφίᾳ
  choice: rempli de sagesse
  rationale: Le participe présent décrit l’enfant pendant sa croissance; σοφίᾳ indique ce dont il est rempli. La tournure française conserve le lien descriptif tout en évitant la lourdeur de « étant rempli ».
- source_word: χάρις θεοῦ
  choice: la faveur de Dieu
  rationale: χάρις peut signifier grâce ou faveur. Dans cette description narrative, « faveur » exprime clairement la bienveillance divine, tandis que l’autre sens légitime est conservé en note.
- source_word: ἦν ἐπ’ αὐτό
  choice: était sur lui
  rationale: La formulation garde l’image grecque d’une faveur divine présente sur l’enfant, dans un registre biblique sobre et compréhensible.
theological_decisions:
- issue: Sens de χάρις θεοῦ dans la description de la croissance de Jésus
  choice: la faveur de Dieu
  alternative: la grâce de Dieu
  rationale: « Faveur » rend ici naturellement la bienveillance et l’approbation divines sans imposer une interprétation doctrinale de la manière dont Jésus aurait reçu la grâce. « Grâce » demeure une traduction lexicale possible et figure donc en note.
translation_notes:
  register: Français international moderne, digne et accessible. Les imparfaits rendent la croissance continue. La syntaxe reste concise, et le marqueur de note [a] est placé immédiatement après le terme concerné.
