reference: Luke 2:37
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ αὐτὴ χήρα ⸀ἕως ἐτῶν ὀγδοήκοντα τεσσάρων,) ἣ οὐκ ⸀ἀφίστατο τοῦ ἱεροῦ νηστείαις καὶ δεήσεσιν λατρεύουσα νύκτα καὶ ἡμέραν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/037.yaml
  text: and then as a widow until she was eighty-four years old[a]. She did not depart from the temple[c][b], worshiping with fastings and prayers night and day.
translation:
  language: fr
  text: et elle était restée veuve jusqu’à l’âge de quatre-vingt-quatre ans[a]. Elle ne quittait pas le temple[b] ; nuit et jour, elle rendait un culte par des jeûnes et des prières[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « et elle était restée veuve pendant quatre-vingt-quatre ans ». Le grec peut indiquer soit l’âge d’Anne, soit la durée de son veuvage.'
    reason: alternative_reading
  - marker: b
    text: Le mot grec désigne ici l’ensemble du temple et de ses cours, non le sanctuaire intérieur proprement dit.
    reason: cultural_note
  - marker: c
    text: 'Ou : « supplications » ou « requêtes ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: χήρα
  choice: veuve
  rationale: Terme français courant et précis pour une femme dont le mari est mort ; ici, il décrit la condition d’Anne après ses années de mariage.
- source_word: ἕως ἐτῶν ὀγδοήκοντα τεσσάρων
  choice: jusqu’à l’âge de quatre-vingt-quatre ans
  rationale: Cette lecture comprend la formule elliptique comme indiquant l’âge d’Anne et s’exprime naturellement en français. La possibilité qu’elle indique plutôt la durée de son veuvage est conservée en note.
- source_word: ἀφίστατο τοῦ ἱεροῦ
  choice: ne s’éloignait pas du temple
  rationale: L’imparfait exprime une pratique habituelle et durable. « Ne s’éloignait pas » reste proche du verbe grec sans imposer l’idée qu’Anne habitait littéralement dans l’enceinte.
- source_word: ἱεροῦ
  choice: temple
  rationale: « Temple » est la désignation française naturelle ; le grec vise toutefois l’ensemble de l’enceinte du temple plutôt que le sanctuaire intérieur, précision donnée en note.
- source_word: νηστείαις
  choice: par des jeûnes
  rationale: Le pluriel rend l’idée de jeûnes répétés, et la préposition « par » exprime ici le moyen ou la manière de son service cultuel.
- source_word: δεήσεσιν
  choice: prières
  rationale: « Prières » est naturel dans ce contexte, tandis que « supplications » ou « requêtes » en précise la nuance de demande ; ces possibilités sont signalées en note.
- source_word: λατρεύουσα
  choice: elle rendait un culte à Dieu
  rationale: La formule transmet clairement le sens religieux de λατρεύω. Dieu, objet implicite de ce service cultuel dans le contexte, est explicité pour produire une phrase française idiomatique.
- source_word: νύκτα καὶ ἡμέραν
  choice: nuit et jour
  rationale: Expression française courante qui suit l’ordre grec et souligne la constance de sa dévotion.
theological_decisions:
- issue: Âge d’Anne ou durée de son veuvage
  choice: Le texte principal comprend qu’Anne avait quatre-vingt-quatre ans.
  alternative: La formule peut signifier qu’elle était veuve depuis quatre-vingt-quatre ans.
  rationale: La construction grecque condensée permet les deux analyses en lien avec le verset précédent. Le texte principal retient la lecture la plus fluide, sans supprimer l’autre, qui est conservée en note.
translation_notes:
  register: Français moderne, digne et accessible. La syntaxe est légèrement réorganisée pour relier clairement « nuit et jour » au service cultuel. Les pluriels « jeûnes » et « prières » conservent l’idée de pratiques répétées.
