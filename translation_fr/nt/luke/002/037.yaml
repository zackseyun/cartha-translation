  to: et elle était restée veuve jusqu’à l’âge de quatre-vingt-quatre ans[a]. Elle ne quittait pas le temple[b] ; nuit et jour, elle rendait un culte par des jeûnes et des prières[c].
  rationale: La correction retire l’explicitation non nécessaire de Dieu et remplace « ne s’éloignait pas » par « ne quittait pas », plus proche du verbe grec. Elle maintient la lecture principale de l’âge d’Anne, la note qui préserve l’ambiguïté syntaxique, ainsi que les ancres et les notes existantes.
