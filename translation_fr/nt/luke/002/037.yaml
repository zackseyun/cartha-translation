  source_fidelity: La formulation « elle était restée veuve jusqu’à l’âge de quatre-vingt-quatre ans » rend de façon recevable la lecture qui prend ἕως ἐτῶν ὀγδοήκοντα τεσσάρων comme l’âge d’Anne, et la note conserve justement l’autre analyse possible. En revanche, « à Dieu » explicite un destinataire qui n’est pas exprimé dans le grec. « Ne quittait pas le temple » est plus direct et plus fidèle à ἀφίστατο que « ne s’éloignait pas ».
  naturalness: Le français proposé est globalement fluide et de registre biblique moderne. La révision conserve cette fluidité tout en évitant l’ajout d’un complément absent du texte source.
  terminology: « Veuve », « temple », « jeûnes », « prières » et « nuit et jour » sont appropriés. « Rendait un culte » communique bien la valeur cultuelle de λατρεύουσα, sans nécessiter l’explicitation de Dieu.
