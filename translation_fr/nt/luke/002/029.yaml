id: LUK.2.29
reference: Luke 2:29
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Νῦν ἀπολύεις τὸν δοῦλόν σου, δέσποτα, κατὰ τὸ ῥῆμά σου ἐν εἰρήνῃ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/029.yaml
  text: Now you are dismissing your servant[a], Master, according to your word[b], in peace.
translation:
  language: fr
  text: Maintenant, Maître, tu laisses partir ton esclave[a] en paix[b], conformément à ta parole.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ton serviteur ». Le grec δοῦλος peut désigner un esclave ou un serviteur; « esclave » est retenu ici parce que l’adresse « Maître » souligne la relation d’autorité et d’appartenance.
    reason: lexical_alternative
  - marker: b
    text: Siméon exprime ainsi qu’il est prêt à quitter cette vie en paix; le grec parle toutefois plus littéralement de le relâcher ou de le laisser partir.
    reason: alternative_reading
lexical_decisions:
- source_word: Νῦν
  choice: Maintenant
  rationale: L’adverbe marque l’accomplissement présent de l’attente de Siméon; « maintenant » est l’équivalent français direct et naturel.
- source_word: ἀπολύεις
  choice: tu laisses partir
  rationale: Le verbe signifie relâcher, renvoyer ou laisser aller. Dans ce contexte, « tu laisses partir » est idiomatique et conserve l’image du départ sans traduire explicitement par « mourir ».
- source_word: τὸν δοῦλόν σου
  choice: ton esclave
  rationale: δοῦλος peut désigner un esclave ou un serviteur. L’adresse δέσποτα (« Maître ») met ici particulièrement en relief la relation d’autorité et d’appartenance; « esclave » en préserve la force.
- source_word: δέσποτα
  choice: Maître
  rationale: Le vocatif désigne celui qui exerce l’autorité sur un esclave ou un serviteur. « Maître » rend précisément ce rapport et convient à l’adresse directe.
- source_word: κατὰ τὸ ῥῆμά σου
  choice: conformément à ta parole
  rationale: κατά avec l’accusatif exprime ici la conformité. « Ta parole » conserve à la fois l’idée de parole prononcée et l’allusion à la promesse divine.
- source_word: ἐν εἰρήνῃ
  choice: en paix
  rationale: Cette formulation directe garde la résonance biblique d’un départ paisible sous la faveur de Dieu.
theological_decisions:
- issue: Faut-il rendre explicite que Siméon parle de sa mort?
  choice: Conserver l’image d’un départ sans nommer explicitement la mort.
  alternative: « Maintenant, tu peux laisser mourir ton serviteur en paix. »
  rationale: Le contexte laisse fortement entendre que Siméon est prêt à mourir, mais ἀπολύω signifie relâcher, renvoyer ou laisser partir, non « faire mourir ». La traduction préserve donc l’image et sa tension poétique.
translation_notes:
  register: Français international moderne, digne et accessible. L’ordre des constituants a été légèrement réorganisé pour une adresse naturelle en français, sans modifier le sens. « Esclave » conserve la force du couple δοῦλος–δέσποτα, tandis que la note signale l’autre rendu possible.
