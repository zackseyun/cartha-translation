  text: καὶ αὐτὸς ἐδέξατο αὐτὸ εἰς τὰς ⸀ἀγκάλας καὶ εὐλόγησεν τὸν θεὸν καὶ εἶπεν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/028.yaml
  text: And he took him into his arms and blessed God and said,[a]
translation:
  language: fr
  text: 'Il le prit[a] dans ses bras, bénit Dieu et dit :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le reçut ». Le verbe grec peut signifier « recevoir » ou « accueillir » ; avec « dans ses bras », « prit » rend naturellement le geste concret.'
    reason: alternative lexicale
lexical_decisions:
- source_word: ἐδέξατο
  choice: reçut
  rationale: Le verbe signifie « recevoir » ou « accueillir ». Avec « dans ses bras », « reçut » exprime naturellement à la fois l’accueil et le geste physique, tout en restant proche du grec.
- source_word: αὐτό
  choice: le
  rationale: Bien que le pronom grec soit neutre par accord avec le nom désignant l’enfant, il renvoie ici personnellement à Jésus ; le français exige donc le pronom masculin « le ».
- source_word: εἰς τὰς ἀγκάλας
  choice: dans ses bras
  rationale: Cette expression désigne les bras qui accueillent ou portent quelqu’un. Le possessif, implicite en grec, est nécessaire et naturel en français.
- source_word: εὐλόγησεν τὸν θεόν
  choice: bénit Dieu
  rationale: « Bénir Dieu » conserve le sens lexical et la formulation biblique, tout en restant compréhensible en français moderne.
- source_word: καὶ εἶπεν
  choice: 'et dit :'
  rationale: Cette formulation assure une transition narrative simple vers les paroles qui suivent ; le deux-points convient à la ponctuation française.
- source_word: αὐτός
  choice: Il
  rationale: Le pronom grec maintient le sujet avec une légère mise en relief. En français, « Il » suffit ici ; « lui-même » accentuerait excessivement le texte.
theological_decisions:
- issue: Référent du pronom neutre αὐτό
  choice: Le pronom renvoie personnellement à l’enfant Jésus et est rendu par « le ».
  alternative: Employer un pronom neutre ou impersonnel en suivant mécaniquement le genre grammatical grec.
  rationale: Le neutre grec s’explique par le genre grammatical du terme désignant l’enfant dans le contexte. Le français renvoie naturellement à la personne de Jésus au masculin, sans ajouter d’interprétation théologique.
translation_notes:
  register: Français international moderne, naturel et digne. « Reçut dans ses bras » préserve la nuance d’accueil du verbe grec, tandis que la note signale la traduction physique également possible.
