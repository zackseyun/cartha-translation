id: LUK.2.30
reference: Luke 2:30
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὅτι εἶδον οἱ ὀφθαλμοί μου τὸ σωτήριόν σου
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/030.yaml
  text: because my eyes have seen your salvation[a]
translation:
  language: fr
  text: car mes yeux ont vu ton salut.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ton Sauveur ». Le grec dit « ton salut », mais, dans ce contexte, le salut de Dieu est présent dans la personne de Jésus.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: car
  rationale: Dans le contexte, la conjonction introduit la raison pour laquelle Siméon peut partir en paix. « Car » exprime naturellement ce lien causal dans un registre digne.
- source_word: εἶδον
  choice: ont vu
  rationale: L’aoriste désigne ici la vision accomplie de l’enfant. En français, le passé composé convient à une action récente dont la portée demeure présente.
- source_word: οἱ ὀφθαλμοί μου
  choice: mes yeux
  rationale: Cette formulation conserve l’expression concrète et insistante du grec, sans la réduire à « j’ai vu ».
- source_word: τὸ σωτήριόν σου
  choice: ton salut
  rationale: σωτήριον désigne lexicalement le salut ou la délivrance, et non directement « le Sauveur ». « Ton salut » préserve la formulation grecque tout en laissant le contexte montrer que ce salut est présent dans la personne de Jésus.
theological_decisions:
- issue: Faut-il rendre τὸ σωτήριόν σου par le nom abstrait « ton salut » ou le personnaliser en « ton Sauveur » puisque Siméon voit l’enfant Jésus ?
  choice: ton salut
  alternative: ton Sauveur
  rationale: Le grec emploie σωτήριον, et non le nom personnel σωτήρ (« Sauveur »). La traduction retenue respecte cette distinction et maintient la tension entre le salut donné par Dieu et sa manifestation dans la personne de Jésus.
translation_notes:
  register: Français international moderne, simple et digne. « Car » assure la continuité syntaxique avec le verset précédent; « mes yeux ont vu » conserve l’image corporelle du texte grec.
