  - severity: low
    issue: La note présente comme « littérale » une phrase avec un plus-que-parfait et emploie le pluriel « les paroles ».
    rationale: Le grec porte un singulier (« la parole / le propos ») et un aoriste. La note doit éviter de qualifier d’exactement littérale une paraphrase temporelle française.
