  source_fidelity: 'Le sens fondamental est correctement rendu : les parents ne comprennent pas l’énoncé que Jésus vient de leur adresser. Toutefois, « ce qu’il leur avait dit » neutralise le nom singulier τὸ ῥῆμα (« la parole / le propos ») et la note qualifie à tort de littérale une formulation au plus-que-parfait qui ne reproduit pas exactement la structure grecque.'
