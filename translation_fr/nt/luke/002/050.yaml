  text: καὶ αὐτοὶ οὐ συνῆκαν τὸ ῥῆμα ὃ ἐλάλησεν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/050.yaml
  text: And they did not understand the statement that he spoke to them[a].
translation:
  language: fr
  text: Et ils ne comprirent pas la parole qu’il leur avait dite[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le propos », « la déclaration » ou « l’affaire » qu’il leur avait dite.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Et
  rationale: La conjonction conserve simplement la continuité du récit sans introduire une opposition plus forte que celle exprimée en grec.
- source_word: αὐτοὶ
  choice: ils
  rationale: Le pronom renvoie aux parents de Jésus. En français, « ils » exprime naturellement le sujet explicite sans recourir à la tournure lourde « eux-mêmes ».
- source_word: οὐ συνῆκαν
  choice: ne comprirent pas
  rationale: Cette formulation rend directement l’absence de compréhension exprimée par συνίημι, sans l’atténuer en compréhension partielle ni la transformer en refus.
- source_word: τὸ ῥῆμα
  choice: ce qu’
  rationale: Dans ce contexte, ῥῆμα désigne les paroles que Jésus vient de prononcer. La tournure « ce qu’il leur avait dit » est la formulation française la plus naturelle, tandis que la note conserve les autres valeurs possibles du nom grec.
- source_word: ὃ ἐλάλησεν αὐτοῖς
  choice: il leur avait dit
  rationale: Le plus-que-parfait indique naturellement en français que les paroles de Jésus précèdent la réaction des parents; « dire à quelqu’un » rend idiomatiquement λαλέω avec son complément.
theological_decisions:
- issue: Réaction des parents de Jésus
  choice: Le texte affirme sans restriction qu’ils ne comprirent pas les paroles de Jésus.
  alternative: « Ils ne comprirent pas pleinement » ou « ils n’acceptèrent pas »
  rationale: Le grec exprime un manque de compréhension, sans préciser qu’il serait seulement partiel et sans évoquer un refus. La traduction maintient ainsi la tension narrative concernant l’identité et la mission de Jésus.
translation_notes:
  register: Français international moderne, simple et digne. La formulation idiomatique « ce qu’il leur avait dit » évite la lourdeur de « la parole qu’il leur avait dite », tout en signalant cette structure plus littérale dans la note.
