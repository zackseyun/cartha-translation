  yaml_path: translation/nt/luke/002/047.yaml
  text: And all who heard him were astonished at his understanding and his answers[a].
translation:
  language: fr
  text: Tous ceux qui l’entendaient étaient stupéfaits de son intelligence et de ses réponses.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « étaient émerveillés ». Le verbe grec exprime une très vive surprise.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξίσταντο
  choice: étaient stupéfaits
  rationale: L’imparfait exprime la réaction persistante de tous les auditeurs, et « stupéfaits » rend naturellement la forte surprise portée par le verbe sans recourir à un idiome trompeur.
- source_word: δὲ
  choice: non traduit explicitement
  rationale: Cette particule assure ici une transition narrative légère. En français, l’enchaînement est naturel sans conjonction explicite, tandis que « mais » marquerait une opposition excessive.
- source_word: πάντες οἱ ἀκούοντες αὐτοῦ
  choice: Tous ceux qui l’entendaient
  rationale: Cette formulation conserve la portée universelle de πάντες et la valeur durative du participe présent, tout en restant idiomatique en français.
- source_word: ἐπὶ τῇ συνέσει
  choice: de son intelligence
  rationale: Après « être stupéfait », « de » exprime naturellement le motif de la réaction. Dans ce contexte, « intelligence » désigne la faculté de comprendre manifestée par Jésus et forme une expression française naturelle.
- source_word: ταῖς ἀποκρίσεσιν αὐτοῦ
  choice: de ses réponses
  rationale: « Réponses » convient au dialogue décrit dans le contexte et reproduit le second élément coordonné du grec.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La phrase suit de près la structure grecque tout en omettant la particule δέ, dont une traduction explicite alourdirait ou surinterpréterait ici l’enchaînement.
