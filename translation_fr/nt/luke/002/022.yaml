id: LUK.2.22
reference: Luke 2:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ ὅτε ἐπλήσθησαν αἱ ἡμέραι τοῦ καθαρισμοῦ αὐτῶν κατὰ τὸν νόμον Μωϋσέως, ἀνήγαγον αὐτὸν εἰς Ἱεροσόλυμα παραστῆσαι τῷ κυρίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/022.yaml
  text: And when the days of their purification were fulfilled according to the law of Moses[a], they brought him up to Jerusalem to present him to the Lord,
translation:
  language: fr
  text: Quand les jours de leur purification[a] furent accomplis, conformément à la loi de Moïse, ils l’amenèrent à Jérusalem pour le présenter au Seigneur,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Certains manuscrits portent « sa purification » au lieu de « leur purification ».
    reason: textual_variant
lexical_decisions:
- source_word: ἐπλήσθησαν
  choice: furent accomplis
  rationale: Le passif indique ici qu’une période prescrite est arrivée à son terme; cette formulation conserve la nuance temporelle et le registre solennel.
- source_word: καθαρισμοῦ
  choice: purification
  rationale: Dans ce contexte, le terme désigne la purification rituelle prescrite après un accouchement.
- source_word: αὐτῶν
  choice: leur
  rationale: Le texte grec de la SBLGNT porte le pronom pluriel; la traduction le conserve sans harmonisation implicite avec l’arrière-plan lévitique.
- source_word: κατὰ τὸν νόμον Μωϋσέως
  choice: conformément à la loi de Moïse
  rationale: Cette tournure française naturelle exprime clairement la conformité à la prescription mosaïque tout en gardant le registre juridique.
- source_word: ἀνήγαγον
  choice: ils l’amenèrent
  rationale: Le verbe exprime le fait de conduire ou d’amener vers le haut; avec Jérusalem, l’idée d’ascension est contextuelle, tandis que «amenèrent» reste idiomatique en français.
- source_word: Ἱεροσόλυμα
  choice: Jérusalem
  rationale: Forme française usuelle du nom de lieu.
- source_word: παραστῆσαι
  choice: pour le présenter
  rationale: Dans ce cadre cultuel, le verbe signifie présenter quelqu’un devant Dieu; «présenter» est précis, naturel et traditionnel sans être archaïque.
- source_word: κυρίῳ
  choice: au Seigneur
  rationale: Le terme désigne ici Dieu dans un contexte révérenciel et cultuel; «au Seigneur» est la formulation française naturelle.
theological_decisions:
- issue: Nombre du pronom dans «les jours de leur purification»
  choice: Conserver le pluriel «leur purification» dans le texte principal
  alternative: «les jours de sa purification»
  rationale: Le texte grec fourni lit αὐτῶν, «leur». Malgré la difficulté créée par le contexte de Lévitique 12 et l’existence d’une variante au singulier, il convient de préserver le pluriel du texte source et de signaler l’autre lecture en note.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve le mouvement de la phrase grecque et son registre légal et cultuel, tout en restant naturelle. Le marqueur [a] est placé après «loi de Moïse», conformément à la couche de consultation anglaise, bien que la note porte sur «leur purification».
