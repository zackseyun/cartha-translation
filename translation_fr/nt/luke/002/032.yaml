  text: φῶς εἰς ἀποκάλυψιν ἐθνῶν καὶ δόξαν λαοῦ σου Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/032.yaml
  text: a light for revelation to the Gentiles[a], and glory to your people Israel.
translation:
  language: fr
  text: une lumière pour apporter la révélation aux nations[a], et pour la gloire de ton peuple, Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « aux non-Juifs ». Le terme grec signifie généralement « nations » ou « peuples », mais il désigne probablement ici les non-Juifs, par contraste avec Israël.
    reason: lexical_alternative
lexical_decisions:
- source_word: φῶς
  choice: une lumière
  rationale: L’article indéfini convient naturellement en français dans cette description poétique et prédicative de l’enfant.
- source_word: εἰς
  choice: pour apporter
  rationale: La préposition exprime ici la visée ou le résultat. L’ajout verbal « apporter » rend en français courant le rapport elliptique entre « lumière » et « révélation » sans préciser indûment le contenu de celle-ci.
- source_word: ἀποκάλυψιν
  choice: la révélation
  rationale: « Révélation » conserve l’idée de dévoilement ou de manifestation et sa portée théologique, tout en restant intelligible en français moderne.
- source_word: ἐθνῶν
  choice: aux nations
  rationale: « Nations » correspond directement au terme grec et conserve sa gamme de sens. Dans le parallélisme avec Israël, il désigne vraisemblablement les peuples non juifs; cette lecture est signalée en note sans remplacer le terme source dans le texte.
- source_word: δόξαν
  choice: la gloire
  rationale: « Gloire » préserve à la fois les idées de splendeur, d’honneur et d’exaltation associées au salut donné par Dieu.
- source_word: λαοῦ σου Ἰσραήλ
  choice: de ton peuple Israël
  rationale: Cette formulation rend naturellement l’apposition qui identifie Israël comme le peuple auquel Dieu s’adresse possessivement dans la prière de Siméon.
- source_word: καὶ
  choice: et
  rationale: La coordination simple maintient le parallélisme entre la révélation destinée aux nations et la gloire d’Israël.
theological_decisions:
- issue: Sens de ἐθνῶν dans son rapport avec Israël
  choice: aux nations
  alternative: aux non-Juifs
  rationale: Le grec peut parler des nations en général, mais leur mise en parallèle avec « ton peuple Israël » fait probablement ressortir les peuples non juifs. Le texte principal garde le terme plus formel et la note explicite la lecture contextuelle.
- issue: Rapport entre la lumière et la révélation
  choice: pour apporter la révélation
  alternative: pour la révélation
  rationale: Le grec est concis et permet une relation de visée ou de résultat. « Apporter » rend cette relation idiomatique sans identifier explicitement ce qui est révélé ni éliminer la densité théologique de « révélation ».
translation_notes:
  register: Français international moderne, poétique et digne. La syntaxe conserve le caractère condensé du cantique tout en explicitant légèrement, par « apporter », une relation qui serait peu naturelle en français sous la forme strictement nominale « une lumière pour la révélation ».
