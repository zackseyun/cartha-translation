  text: καὶ ὅτε ἐγένετο ἐτῶν δώδεκα, ⸀ἀναβαινόντων ⸀αὐτῶν κατὰ τὸ ἔθος τῆς ἑορτῆς
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/042.yaml
  text: And when he was twelve years old[a], as they were going up according to the custom of the feast[b],
translation:
  language: fr
  text: Et lorsqu’il eut douze ans, tandis qu’ils montaient selon la coutume de la fête[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Il s’agit de la fête de la Pâque, mentionnée au verset précédent.
    reason: cross_reference
lexical_decisions:
- source_word: ἐγένετο ἐτῶν δώδεκα
  choice: il eut douze ans
  rationale: La construction idiomatique γίνομαι avec l’indication de l’âge signifie atteindre cet âge. « Il eut douze ans » est naturel dans ce récit au passé et renvoie clairement à Jésus.
- source_word: ἀναβαινόντων
  choice: tandis qu’ils montaient
  rationale: Le participe présent exprime une action en cours, contemporaine de la proposition temporelle. « Montaient » conserve aussi le verbe habituel pour la montée vers Jérusalem, sans ajouter le lieu, absent de ce verset.
- source_word: αὐτῶν
  choice: ils
  rationale: Le pronom renvoie au groupe familial mentionné dans le contexte, notamment aux parents de Jésus. « Ils » évite de préciser davantage que le grec.
- source_word: κατὰ τὸ ἔθος
  choice: selon la coutume
  rationale: Cette expression indique la conformité à une pratique établie. La formulation française est claire et proche du grec.
- source_word: τῆς ἑορτῆς
  choice: de la fête
  rationale: ἑορτή désigne une fête religieuse. Le contexte immédiat identifie celle-ci comme la Pâque.
- source_word: καὶ ὅτε
  choice: Et lorsqu’
  rationale: « Et » maintient la continuité narrative de καί, tandis que « lorsque » introduit naturellement la proposition temporelle.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La phrase reste ouverte par une virgule, conformément à la syntaxe grecque qui se poursuit au verset suivant. L’imparfait « montaient » préserve l’aspect en cours du participe présent.
