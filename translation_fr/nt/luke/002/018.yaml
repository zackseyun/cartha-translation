  text: καὶ πάντες οἱ ἀκούσαντες ἐθαύμασαν περὶ τῶν λαληθέντων ὑπὸ τῶν ποιμένων πρὸς αὐτούς,
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/018.yaml
  text: And all who heard it were amazed about what had been told to them by the shepherds,[a]
translation:
  language: fr
  text: Et tous ceux qui entendirent s’étonnèrent de ce qui leur avait été dit par les bergers.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « furent émerveillés ».'
    reason: Alternative lexicale possible pour ἐθαύμασαν ; le terme peut exprimer un étonnement admiratif, sans que le contexte impose cette nuance.
lexical_decisions:
- source_word: καὶ
  choice: Et
  rationale: Conserve le lien narratif simple avec le verset précédent.
- source_word: πάντες οἱ ἀκούσαντες
  choice: tous ceux qui entendirent
  rationale: Le participe aoriste substantivé désigne l’ensemble des personnes qui entendirent le récit. Le français permet de laisser l’objet implicite, comme le grec.
- source_word: ἐθαύμασαν
  choice: furent émerveillés
  rationale: Exprime la vive réaction d’étonnement suscitée par ce qui fut rapporté, dans un registre naturel et digne.
- source_word: περὶ τῶν λαληθέντων
  choice: de ce que … avaient raconté
  rationale: περί avec le génitif indique ici ce qui provoque ou concerne leur émerveillement; la tournure française rend naturellement le contenu des paroles.
- source_word: ὑπὸ τῶν ποιμένων
  choice: les bergers
  rationale: Dans la reformulation active française, les bergers deviennent le sujet de « avaient raconté », tout en conservant leur rôle d’agents dans le grec passif.
- source_word: πρὸς αὐτούς
  choice: leur
  rationale: Rend la direction des paroles vers les auditeurs sans préciser davantage le référent du pronom.
theological_decisions:
- issue: Nature de la réaction exprimée par ἐθαύμασαν
  choice: Une réaction d’émerveillement ou de vif étonnement, sans conclusion sur la foi des auditeurs
  alternative: Une réponse explicite de foi, ou une simple curiosité
  rationale: Le verbe décrit une réaction de surprise admirative, mais le texte ne dit pas si elle conduit à la foi ni si elle reste superficielle.
translation_notes:
  register: Français international moderne, fluide et digne. Le passé simple convient au récit biblique écrit; le plus-que-parfait marque l’antériorité du récit des bergers. La voix active évite une construction passive lourde tout en préservant les rôles sémantiques du grec.
