  text: καὶ τοῦτο ὑμῖν ⸀τὸ σημεῖον, εὑρήσετε βρέφος ἐσπαργανωμένον ⸀καὶ κείμενον ἐν φάτνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/012.yaml
  text: 'And this will be the sign for you: you will find a baby wrapped in cloths and lying in a manger[a][b].'
translation:
  language: fr
  text: 'Et voici le signe pour vous : vous trouverez un nouveau-né emmailloté et couché dans une mangeoire[a][b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « enveloppé de langes ».
    reason: lexical_alternative
  - marker: b
    text: Ou « dans une auge », c’est-à-dire un récipient où mangent les animaux.
    reason: lexical_alternative
lexical_decisions:
- source_word: σημεῖον
  choice: signe
  rationale: « Signe » rend directement l’idée d’un indice distinctif permettant aux bergers de reconnaître l’enfant, sans préciser qu’il s’agit nécessairement d’un prodige.
- source_word: εὑρήσετε
  choice: vous trouverez
  rationale: Le futur de εὑρίσκω est rendu simplement et naturellement par « vous trouverez ».
- source_word: βρέφος
  choice: un nouveau-né
  rationale: Dans ce contexte, βρέφος désigne un tout jeune enfant. « Nouveau-né » est précis, naturel et convient au récit de la naissance.
- source_word: ἐσπαργανωμένον
  choice: enveloppé de langes
  rationale: Le participe décrit un nourrisson enveloppé dans des pièces de tissu. « Enveloppé de langes » est une formulation française claire, concrète et courante dans ce contexte.
- source_word: κείμενον
  choice: couché
  rationale: « Couché » exprime l’état ou la position de l’enfant, conformément au sens statif de κεῖμαι, sans mettre l’accent sur l’action antérieure de le déposer.
- source_word: φάτνῃ
  choice: dans une mangeoire
  rationale: φάτνη désigne ici une auge destinée à nourrir les animaux. « Mangeoire » est le terme français standard, précis et immédiatement compréhensible.
- source_word: τοῦτο ὑμῖν τὸ σημεῖον
  choice: voici le signe qui vous est donné
  rationale: La proposition grecque est elliptique. Cette tournure française en restitue naturellement la fonction présentative et indique que le signe est destiné aux bergers, sans alourdir la phrase.
theological_decisions:
- issue: Nature du signe donné aux bergers
  choice: Le verset présente concrètement un signe permettant d’identifier l’enfant.
  alternative: Le signe peut également être compris comme une confirmation divine ayant une portée théologique plus large.
  rationale: La traduction conserve le mot « signe » sans l’expliciter comme preuve ou miracle. Elle maintient ainsi la simplicité narrative et laisse ouverte sa portée théologique implicite.
translation_notes:
  register: Français international moderne, naturel et digne. « Nouveau-né » précise βρέφος dans le contexte immédiat; « langes » reste courant et compréhensible dans le récit d’une naissance. La formulation évite les archaïsmes tout en conservant la solennité sobre du passage.
