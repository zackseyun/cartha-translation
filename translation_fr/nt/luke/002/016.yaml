id: LUK.2.16
reference: Luke 2:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἦλθαν σπεύσαντες καὶ ἀνεῦραν τήν τε Μαριὰμ καὶ τὸν Ἰωσὴφ καὶ τὸ βρέφος κείμενον ἐν τῇ φάτνῃ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/016.yaml
  text: And they came in haste and found Mary and Joseph[a], and the baby lying in the manger.
translation:
  language: fr
  text: Ils vinrent en toute hâte et trouvèrent Marie et Joseph, ainsi que le bébé couché dans la mangeoire[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot grec désigne une mangeoire pour animaux, traditionnellement appelée « crèche » dans ce récit.
    reason: Précision lexicale et indication de la formulation française traditionnelle.
lexical_decisions:
- source_word: ἦλθαν
  choice: vinrent
  rationale: L’aoriste de ἔρχομαι décrit ici leur arrivée au lieu indiqué par l’ange. « Vinrent » suit naturellement le mouvement du récit.
- source_word: σπεύσαντες
  choice: en toute hâte
  rationale: Le participe exprime la manière dont ils vinrent. Cette tournure française naturelle conserve pleinement l’idée d’empressement.
- source_word: ἀνεῦραν
  choice: trouvèrent
  rationale: Le verbe évoque le fait de trouver au terme d’une recherche. « Trouvèrent » convient au récit et laisse le contexte suggérer la recherche préalable.
- source_word: τήν τε Μαριὰμ καὶ τὸν Ἰωσὴφ
  choice: Marie et Joseph
  rationale: Les noms sont rendus selon leur forme française usuelle. La coordination τε…καί est naturellement exprimée par « et ».
- source_word: τὸ βρέφος
  choice: le bébé
  rationale: βρέφος désigne un très jeune enfant. Dans le contexte immédiat de la naissance, « le bébé » est précis, courant et naturel.
- source_word: κείμενον
  choice: couché
  rationale: Le participe de κεῖμαι décrit l’état et la position du bébé, non l’action de le déposer. « Couché » préserve ce sens statif.
- source_word: ἐν τῇ φάτνῃ
  choice: dans la mangeoire
  rationale: φάτνη désigne ici une mangeoire destinée aux animaux. « Mangeoire » est concret et exact, tout en évitant l’ambiguïté moderne de « crèche ».
- source_word: καὶ … καὶ … καὶ
  choice: et … ainsi que
  rationale: La coordination additive du grec est conservée dans un français fluide. « Ainsi que » relie clairement le bébé, accompagné de sa précision de lieu, aux deux personnes déjà nommées.
theological_decisions: []
translation_notes:
  register: Français international moderne, simple et digne. La phrase conserve l’urgence du déplacement, l’énumération narrative et la description stative du bébé, sans ajouter de détail absent du grec.
