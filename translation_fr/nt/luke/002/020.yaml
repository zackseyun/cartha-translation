revisions:
- from: Les bergers repartirent[a], rendant gloire à Dieu et le louant pour[b] tout ce qu’ils avaient entendu et vu, exactement comme cela leur avait été dit[c].
  to: Les bergers s’en retournèrent[a], rendant gloire à Dieu et le louant pour[b] tout ce qu’ils avaient entendu et vu, comme cela leur avait été dit.
  rationale: La révision remplace « repartirent » par « s’en retournèrent » afin de rendre le retour exprimé par ὑπέστρεψαν, et retire le renforcement « exactement ». La note c n’est pas ancrée dans le texte révisé, car elle ne fournit pas une variante utile au-delà de la formulation retenue; elle est donc omise de l’affichage du verset et ne doit pas être conservée comme note active.
