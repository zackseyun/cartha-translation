source:
  edition: SBLGNT
  text: καὶ ὑπέστρεψαν οἱ ποιμένες δοξάζοντες καὶ αἰνοῦντες τὸν θεὸν ἐπὶ πᾶσιν οἷς ἤκουσαν καὶ εἶδον καθὼς ἐλαλήθη πρὸς αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/020.yaml
  text: And the shepherds returned[a], glorifying and praising God for all that they had heard and seen[c][b], just as it had been told to them.
translation:
  language: fr
  text: Les bergers s’en retournèrent[a], rendant gloire à Dieu et le louant pour[b] tout ce qu’ils avaient entendu et vu, comme cela leur avait été dit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « revinrent ».
    reason: lexical_alternative
  - marker: b
    text: Ou « à cause de tout ce qu’ils avaient entendu et vu ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπέστρεψαν
  choice: repartirent
  rationale: Dans ce contexte, le verbe indique que les bergers regagnent le lieu ou l’activité qu’ils avaient quittés. « Repartirent » est naturel en français et n’explicite pas une destination absente du grec.
- source_word: οἱ ποιμένες
  choice: les bergers
  rationale: Équivalent courant et précis de ποιμένες dans ce récit.
- source_word: δοξάζοντες
  choice: rendant gloire à Dieu
  rationale: Cette tournure française idiomatique conserve l’idée de glorifier Dieu et exprime l’action qui accompagne leur retour.
- source_word: αἰνοῦντες
  choice: le louant
  rationale: Conserve un verbe distinct de δοξάζοντες tout en évitant la répétition de « Dieu ».
- source_word: ἐπὶ πᾶσιν οἷς
  choice: pour tout ce que
  rationale: ἐπί avec le datif indique ici le motif ou l’occasion de la glorification et de la louange. « Pour » est concis et naturel, tandis que la note signale la valeur causale possible.
- source_word: ἤκουσαν καὶ εἶδον
  choice: ils avaient entendu et vu
  rationale: Le plus-que-parfait rend clairement l’antériorité de ces expériences par rapport à leur retour et à leur louange, sans modifier le sens des aoristes grecs.
- source_word: καθὼς ἐλαλήθη πρὸς αὐτούς
  choice: exactement comme cela leur avait été dit
  rationale: La formulation garde le passif et laisse l’auteur des paroles implicite, comme en grec. « Exactement comme » exprime ici naturellement la correspondance marquée par καθώς.
theological_decisions:
- issue: Faut-il nommer celui ou ceux qui avaient parlé aux bergers ?
  choice: 'Maintenir le passif : « comme cela leur avait été dit »'
  alternative: « comme l’ange le leur avait annoncé » ou « comme les anges le leur avaient annoncé »
  rationale: Le contexte renvoie au message angélique, mais cette proposition ne nomme pas explicitement l’agent. La traduction préserve donc cette retenue et n’ajoute aucun détail.
translation_notes:
  register: Français international moderne, naturel et digne. Le rythme conserve les deux actions parallèles de glorifier et de louer, tout en maintenant l’agent implicite du passif final.
