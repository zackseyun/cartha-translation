id: LUK.2.7
reference: Luke 2:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἔτεκεν τὸν υἱὸν αὐτῆς τὸν πρωτότοκον, καὶ ἐσπαργάνωσεν αὐτὸν καὶ ἀνέκλινεν αὐτὸν ⸀ἐν φάτνῃ, διότι οὐκ ἦν αὐτοῖς τόπος ἐν τῷ καταλύματι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/007.yaml
  text: And she gave birth to her firstborn son[a], and wrapped him in cloths and laid him in a feeding trough[c][b], because there was no place for them in the guest room.
translation:
  language: fr
  text: Elle mit au monde son fils premier-né, l’enveloppa de langes[a] et le coucha dans une mangeoire[b], parce qu’il n’y avait pas de place pour eux dans la chambre d’amis[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’emmaillota ».
    reason: lexical_alternative
  - marker: b
    text: Ou « une auge ». Le terme grec désigne un lieu ou un récipient où l’on met la nourriture des animaux.
    reason: lexical_alternative
  - marker: c
    text: Traditionnellement « l’auberge ». Le grec κατάλυμα peut désigner une chambre d’amis ou un lieu d’hébergement ; en Luc 10.34, l’auteur emploie un autre mot pour parler d’une auberge commerciale.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔτεκεν
  choice: mit au monde
  rationale: Expression française actuelle et naturelle pour désigner l’accouchement, sans archaïsme.
- source_word: πρωτότοκον
  choice: le premier-né
  rationale: Rend directement l’idée de rang de naissance, sans tirer de conclusion au-delà du récit immédiat.
- source_word: ἐσπαργάνωσεν
  choice: l’enveloppa de langes
  rationale: Le verbe désigne le fait d’envelopper un nourrisson dans des pièces de tissu. Cette formulation est claire et conserve le terme français traditionnel « langes ».
- source_word: ἀνέκλινεν
  choice: le coucha
  rationale: Dans ce contexte, le verbe signifie déposer ou coucher l’enfant; « le coucha » est idiomatique en français.
- source_word: φάτνῃ
  choice: dans une mangeoire
  rationale: Le nom grec désigne un endroit où les animaux se nourrissent, notamment une auge ou mangeoire. « Mangeoire » en communique clairement le sens concret.
- source_word: τόπος
  choice: de place
  rationale: Rend le sens général d’espace ou de place disponible dans ce contexte.
- source_word: καταλύματι
  choice: dans la chambre d’amis
  rationale: Le terme peut désigner un lieu d’hébergement ou une chambre réservée aux hôtes. Luc l’emploie clairement pour une chambre d’hôtes en 22.11 et utilise un autre mot pour une auberge commerciale en 10.34.
theological_decisions:
- issue: Faut-il rendre καταλύματι par le traditionnel « auberge » ou par un terme désignant l’espace réservé aux hôtes dans une maison ?
  choice: chambre d’amis
  alternative: auberge; lieu d’hébergement
  rationale: Le grec n’impose pas l’idée d’une auberge commerciale. Luc emploie πανδοχεῖον pour une auberge en 10.34, tandis que κατάλυμα désigne une chambre d’hôtes en 22.11. « Chambre d’amis » évite donc d’introduire un cadre traditionnel que le texte n’exige pas.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase conserve la progression narrative du grec et évite d’imposer le cadre traditionnel d’une auberge commerciale.
