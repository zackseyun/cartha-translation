  text: Δόξα ἐν ὑψίστοις θεῷ καὶ ἐπὶ γῆς εἰρήνη ἐν ἀνθρώποις ⸀εὐδοκίας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/014.yaml
  text: Glory to God in the highest[c][b][a], and on earth peace among people of good pleasure.
translation:
  language: fr
  text: « Gloire à Dieu au plus haut des cieux, et paix sur la terre parmi les humains qu’il agrée[a] ! »[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « parmi des humains de faveur », c’est-à-dire parmi des humains qui sont l’objet de la faveur divine.'
    reason: lexical_alternative
  - marker: b
    text: 'Certains manuscrits portent : « et sur la terre, paix, bienveillance parmi les humains » ; ils lisent le nominatif εὐδοκία plutôt que le génitif εὐδοκίας.'
    reason: textual_variant
lexical_decisions:
- source_word: Δόξα
  choice: Gloire
  rationale: Dans cette proclamation, le nom fonctionne comme une acclamation qui attribue la gloire à Dieu. « Gloire » conserve la force liturgique et théologique du grec.
- source_word: ἐν ὑψίστοις
  choice: dans les lieux très hauts
  rationale: L’expression désigne le domaine céleste le plus élevé. Cette formulation garde la valeur locative du grec tout en restant compréhensible en français moderne.
- source_word: θεῷ
  choice: à Dieu
  rationale: 'Le datif exprime ici l’attribution : la gloire revient à Dieu.'
- source_word: ἐπὶ γῆς
  choice: sur la terre
  rationale: Rendu spatial direct, en contraste avec les lieux très hauts.
- source_word: εἰρήνη
  choice: paix
  rationale: Le terme garde ici son sens biblique large de paix, sans qu’un équivalent plus étroit soit imposé par le contexte.
- source_word: ἐν ἀνθρώποις
  choice: parmi les humains
  rationale: ἄνθρωποι désigne ici les êtres humains de manière générique. « Les humains » exprime naturellement cette portée sans restriction de sexe.
- source_word: εὐδοκίας
  choice: qui ont sa faveur
  rationale: Le génitif rattache la faveur aux humains concernés. Cette formulation française naturelle exprime qu’ils sont les bénéficiaires de la faveur divine, sans développer davantage la portée doctrinale de cette relation.
theological_decisions:
- issue: Sens du génitif εὐδοκίας dans la proclamation angélique
  choice: La paix est annoncée parmi les humains qui ont la faveur de Dieu.
  alternative: « Paix sur la terre, bienveillance parmi les humains », selon la variante nominative εὐδοκία.
  rationale: Le texte du SBLGNT porte le génitif εὐδοκίας, qui qualifie les humains comme bénéficiaires de la faveur divine. Le rendu ne précise pas pourquoi ni de quelle manière ils ont cette faveur, afin de ne pas imposer un système doctrinal au texte. La variante nominative est signalée en note.
translation_notes:
  register: Français international moderne, naturel et digne. La structure en deux membres et le contraste entre les lieux très hauts et la terre sont conservés. « Les humains » rend explicitement la portée générique de ἄνθρωποι, sans nécessiter de note culturelle distincte.
