id: LUK.2.9
reference: Luke 2:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸀καὶ ἄγγελος κυρίου ἐπέστη αὐτοῖς καὶ δόξα κυρίου περιέλαμψεν αὐτούς, καὶ ἐφοβήθησαν φόβον μέγαν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/009.yaml
  text: And an angel of the Lord stood before them[a], and the glory of the Lord shone around them[b], and they feared a great fear.
translation:
  language: fr
  text: Et un ange du Seigneur se présenta à eux[a]. La gloire du Seigneur resplendit autour d’eux, et ils furent saisis d’une grande frayeur[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « survint près d’eux » ou « se tint auprès d’eux ». Le verbe grec peut exprimer aussi bien une arrivée soudaine que le fait de se tenir près de quelqu’un.
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « ils craignirent une grande crainte », tournure grecque qui exprime une peur intense.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄγγελος κυρίου
  choice: un ange du Seigneur
  rationale: Dans ce contexte narratif, ἄγγελος désigne un ange plutôt qu’un simple messager. L’absence d’article devant ἄγγελος se rend naturellement par l’indéfini « un », sans identifier ce personnage à « l’ange du Seigneur » comme titre déterminé.
- source_word: ἐπέστη αὐτοῖς
  choice: se présenta à eux
  rationale: Le verbe ἐφίστημι peut évoquer le fait de survenir, de se tenir près de quelqu’un ou de se rendre soudainement présent. « Se présenta à eux » exprime clairement cette présence sans imposer une position spatiale trop précise.
- source_word: δόξα κυρίου
  choice: la gloire du Seigneur
  rationale: Traduction directe qui conserve à δόξα son poids théologique et, dans ce contexte lumineux, sa dimension de splendeur divine.
- source_word: περιέλαμψεν αὐτούς
  choice: resplendit autour d’eux
  rationale: περιλάμπω décrit une lumière qui brille tout autour. Cette formulation reste proche du grec tout en étant naturelle et digne en français moderne.
- source_word: ἐφοβήθησαν φόβον μέγαν
  choice: ils furent saisis d’une grande frayeur
  rationale: La construction grecque associant le verbe et son nom apparenté intensifie la peur. L’expression française restitue cette vive terreur sans calquer artificiellement « ils craignirent une grande crainte ».
theological_decisions:
- issue: Traduction de κύριος dans les deux groupes au génitif
  choice: Seigneur
  alternative: Maître
  rationale: Le référent est ici divin. « Seigneur » préserve l’usage biblique français, ainsi que la portée théologique et intertextuelle de κύριος, sans introduire une interprétation confessionnelle particulière.
translation_notes:
  register: Français international moderne, clair et solennel. La coordination grecque initiale est conservée, mais la longue chaîne de propositions est divisée en deux phrases pour une lecture naturelle. « Frayeur » rend ici une peur intense sans lourdeur littérale.
