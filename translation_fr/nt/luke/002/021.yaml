id: LUK.2.21
reference: Luke 2:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ ὅτε ἐπλήσθησαν ἡμέραι ὀκτὼ τοῦ περιτεμεῖν αὐτόν, καὶ ἐκλήθη τὸ ὄνομα αὐτοῦ Ἰησοῦς, τὸ κληθὲν ὑπὸ τοῦ ἀγγέλου πρὸ τοῦ συλλημφθῆναι αὐτὸν ἐν τῇ κοιλίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/021.yaml
  text: And when eight days were fulfilled for circumcising him[a], his name was called Jesus[c][b], the name called by the angel before he was conceived in the womb.
translation:
  language: fr
  text: Lorsque les huit jours furent accomplis pour le circoncire[a], on lui donna le nom de Jésus[b], le nom que l’ange avait donné avant qu’il soit conçu dans le sein de sa mère[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « lorsque les huit jours furent achevés pour sa circoncision ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « son nom fut appelé Jésus ».'
    reason: lexical_alternative
  - marker: c
    text: C’est-à-dire avant sa conception dans le sein de Marie.
    reason: clarification
lexical_decisions:
- source_word: ἐπλήσθησαν ἡμέραι ὀκτὼ
  choice: quand les huit jours furent accomplis
  rationale: Conserve l’expression complétive et la tonalité lucanienne, tout en restant intelligible en français moderne.
- source_word: τοῦ περιτεμεῖν αὐτόν
  choice: au moment de le circoncire
  rationale: Rend naturellement l’infinitif articulé, qui situe l’événement prévu pour le huitième jour.
- source_word: ἐκλήθη τὸ ὄνομα αὐτοῦ Ἰησοῦς
  choice: on lui donna le nom de Jésus
  rationale: Expression française idiomatique qui maintient explicitement la notion de nom et la valeur passive de la tournure grecque.
- source_word: Ἰησοῦς
  choice: Jésus
  rationale: Forme française traditionnelle et standard du nom dans le Nouveau Testament.
- source_word: τὸ κληθὲν ὑπὸ τοῦ ἀγγέλου
  choice: celui que l’ange avait indiqué
  rationale: Le participe renvoie au nom. « Indiqué » évite une répétition maladroite de « donner le nom » tout en exprimant que l’ange avait prescrit ce nom.
- source_word: πρὸ τοῦ συλλημφθῆναι αὐτὸν
  choice: avant qu’il soit conçu
  rationale: Rend directement le passif et le sens contextuel de συλλαμβάνω, sans ajout doctrinal.
- source_word: ἐν τῇ κοιλίᾳ
  choice: dans le ventre de sa mère
  rationale: Formulation naturelle en français pour la conception intra-utérine; « de sa mère » explicite seulement le référent contextuellement évident.
theological_decisions:
- issue: Portée christologique de la proposition relative à la conception
  choice: avant qu’il soit conçu dans le ventre de sa mère
  alternative: avant sa conception dans le sein maternel
  rationale: La traduction affirme simplement la conception humaine de Jésus mentionnée par le texte, sans introduire de terminologie théologique ultérieure ni résoudre des questions que le verset ne traite pas.
translation_notes:
  register: Français international moderne, digne et accessible. Le tour « furent accomplis » préserve la coloration formelle de Luc; les autres formulations privilégient une syntaxe française naturelle.
