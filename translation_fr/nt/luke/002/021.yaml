    rationale: Le grec τοῦ περιτεμεῖν αὐτόν présente la circoncision comme l’objet ou la finalité pour laquelle les huit jours ont été accomplis, plutôt que comme un simple moment simultané. « Pour le circoncire » conserve mieux ce rapport.
  - severity: medium
    issue: « celui que l’ange avait indiqué »
    rationale: τὸ κληθέν renvoie au nom « appelé » ou attribué par l’ange. « Indiqué » peut évoquer une simple désignation ou instruction et ne rend pas explicitement l’acte de donner ce nom.
