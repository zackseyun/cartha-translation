  text: Καὶ Ἰησοῦς προέκοπτεν ⸂σοφίᾳ καὶ ἡλικίᾳ⸃ καὶ χάριτι παρὰ θεῷ καὶ ἀνθρώποις.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/052.yaml
  text: And Jesus kept increasing in wisdom and stature[b][a], and in favor with God and men.
translation:
  language: fr
  text: Et Jésus progressait en sagesse, en taille[a] et en faveur auprès de Dieu et des hommes[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en âge » ou « en maturité »; le grec ἡλικία peut avoir ces sens.
    reason: lexical_alternative
  - marker: b
    text: Ou « des êtres humains »; ici, le grec ἄνθρωποι désigne les humains en général, et non uniquement les personnes de sexe masculin.
    reason: lexical_alternative
lexical_decisions:
- source_word: προέκοπτεν
  choice: progressait
  rationale: L’imparfait exprime un développement continu. « Progressait » rend naturellement cette progression réelle au fil du temps.
- source_word: σοφίᾳ
  choice: en sagesse
  rationale: 'Rend le sens courant de σοφία : compréhension, discernement et sagesse au sens large.'
- source_word: ἡλικίᾳ
  choice: en stature
  rationale: Ἡλικία peut désigner l’âge ou la stature physique. « Stature » évoque ici la croissance humaine visible, tandis qu’une note conserve l’ambiguïté lexicale.
- source_word: χάριτι
  choice: en faveur
  rationale: Dans la relation parallèle avec Dieu et les humains, χάρις désigne naturellement la faveur ou l’estime plutôt que la grâce salvatrice prise comme notion théologique abstraite.
- source_word: παρὰ θεῷ
  choice: auprès de Dieu
  rationale: Παρά avec le datif exprime ici la relation ou la considération dont quelqu’un jouit auprès d’une personne. « Auprès de » convient également au membre parallèle.
- source_word: ἀνθρώποις
  choice: des hommes
  rationale: Le pluriel ἄνθρωποι désigne ici les humains en général. « Des hommes » conserve la formulation représentative traditionnelle; une note explicite le sens inclusif pour éviter une lecture limitée au sexe masculin.
theological_decisions:
- issue: Le développement humain de Jésus et la christologie chalcédonienne
  choice: Le verset décrit directement une croissance réelle de Jésus en sagesse, en stature et en faveur.
  alternative: Atténuer ou obscurcir cette progression afin d’éviter la tension théologique.
  rationale: Le grec affirme clairement que Jésus progressait. Sa véritable croissance humaine ne doit donc pas être minimisée; la traduction conserve la tension théologique sans tenter de la résoudre.
translation_notes:
  register: Français international moderne, naturel et digne. La coordination répétée reste proche de la structure grecque, tandis que « progressait » exprime clairement l’aspect continu de l’imparfait.
