id: LUK.2.31
reference: Luke 2:31
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὃ ἡτοίμασας κατὰ πρόσωπον πάντων τῶν λαῶν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/031.yaml
  text: which you prepared before the face of all the peoples[b][a],
translation:
  language: fr
  text: que tu as préparé devant tous les peuples[a][b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à la vue de tous les peuples » ; l’expression grecque désigne ce qui est placé ouvertement sous les yeux de tous.
    reason: alternative_lexicale
  - marker: b
    text: Ou « toutes les nations ».
    reason: traduction_alternative
lexical_decisions:
- source_word: ὃ
  choice: que
  rationale: Le pronom relatif neutre renvoie au « salut » du verset précédent. En français, le genre grammatical de l’antécédent gouverne la formulation, et « que » est naturel dans cette proposition.
- source_word: ἡτοίμασας
  choice: tu as préparé
  rationale: L’aoriste actif, à la deuxième personne du singulier et adressé à Dieu, est rendu naturellement par le passé composé en français moderne.
- source_word: κατὰ πρόσωπον
  choice: devant
  rationale: Cette locution exprime ici l’idée de placer quelque chose en présence de tous, ouvertement sous leurs yeux. « Devant » conserve cette portée sans calquer lourdement le mot « face ».
- source_word: πάντων
  choice: tous
  rationale: Le génitif pluriel qualifie l’ensemble des peuples sans restriction exprimée dans ce verset.
- source_word: τῶν λαῶν
  choice: les peuples
  rationale: Le pluriel « peuples » conserve la pluralité du grec et laisse au verset suivant le soin de préciser les non-Juifs et Israël.
theological_decisions:
- issue: Portée de λαῶν par rapport au verset suivant
  choice: les peuples
  alternative: les nations ; tous les humains
  rationale: « Les peuples » respecte le pluriel grec sans anticiper la distinction entre les non-Juifs et Israël formulée au verset 32.
translation_notes:
  register: Français international moderne, digne et fluide. La tournure « devant tous les peuples » restitue l’expression grecque de manière idiomatique tout en préservant son caractère public et visible.
