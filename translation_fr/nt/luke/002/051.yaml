id: LUK.2.51
reference: Luke 2:51
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ κατέβη μετ’ αὐτῶν καὶ ἦλθεν εἰς Ναζαρέθ, καὶ ἦν ὑποτασσόμενος αὐτοῖς. καὶ ἡ μήτηρ αὐτοῦ διετήρει πάντα τὰ ῥήματα ⸀ταῦτα ἐν τῇ καρδίᾳ αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/051.yaml
  text: And he went down with them and came to Nazareth[a], and he was subject to them[b]. And his mother kept all these things in her heart.
translation:
  language: fr
  text: Puis il descendit avec eux et se rendit à Nazareth, et il leur était soumis[a]. Sa mère gardait toutes ces paroles[b] dans son cœur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « il continuait à leur obéir ». La tournure grecque indique une soumission ou une obéissance qui se prolongeait.
    reason: lexical_alternative
  - marker: b
    text: Ou « toutes ces choses », « tous ces événements ». Le mot grec peut désigner des paroles, mais aussi les faits dont il est question.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατέβη
  choice: descendit
  rationale: Conserve le sens topographique naturel de la descente depuis Jérusalem, sans alourdir la phrase.
- source_word: μετ’ αὐτῶν
  choice: avec eux
  rationale: Rend directement l’idée simple d’accompagnement.
- source_word: ἦλθεν εἰς Ναζαρέθ
  choice: se rendit à Nazareth
  rationale: Expression française naturelle pour le déplacement vers Nazareth; elle évite le déictique parfois ambigu de « vint ».
- source_word: ἦν ὑποτασσόμενος αὐτοῖς
  choice: il leur était soumis
  rationale: La construction périphrastique à l’imparfait exprime une attitude durable de soumission ou d’obéissance; cette formulation est naturelle et fidèle en français.
- source_word: διετήρει
  choice: gardait
  rationale: Rend l’idée de conserver soigneusement dans la mémoire sans introduire l’interprétation plus affective de « chérissait ».
- source_word: πάντα τὰ ῥήματα ταῦτα
  choice: toutes ces paroles
  rationale: « Paroles » conserve la valeur verbale possible de ῥήματα, tout en laissant la note signaler son sens plus large de faits ou d’événements.
- source_word: ἐν τῇ καρδίᾳ αὐτῆς
  choice: dans son cœur
  rationale: Préserve l’idiome biblique de la mémoire et de la réflexion intérieures, idiome encore clair en français moderne.
theological_decisions:
- issue: La relation de Jésus à ses parents terrestres
  choice: il leur était soumis
  alternative: il continuait à leur obéir
  rationale: Le texte affirme une soumission durable de Jésus à Marie et Joseph sans expliquer ni atténuer la tension avec son identité révélée dans le contexte. « Soumis » reste proche du grec, tandis que la note explicite la dimension continue.
translation_notes:
  register: Français international moderne, simple et digne. Le récit reste fluide; « se rendit » est idiomatique, tandis que « dans son cœur » maintient l’image biblique. Les notes préservent les nuances de durée et l’étendue sémantique de ῥήματα.
