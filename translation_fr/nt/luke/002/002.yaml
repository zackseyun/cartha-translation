source:
  edition: SBLGNT
  text: (⸀αὕτη ἀπογραφὴ πρώτη ἐγένετο ἡγεμονεύοντος τῆς Συρίας Κυρηνίου·)
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/002.yaml
  text: This registration took place first while Quirinius was governing Syria[a][b].
translation:
  language: fr
  text: Ce recensement eut lieu en premier pendant que Quirinius gouvernait la Syrie[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ce recensement eut lieu avant que Quirinius gouverne la Syrie. » Certains comprennent ici le mot grec traduit par « en premier » dans un sens temporel comparatif.'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « Cet enregistrement ». Le terme grec désigne une inscription officielle, souvent liée à la fiscalité.'
    reason: lexical_alternative
lexical_decisions:
- source_word: αὕτη
  choice: Ce
  rationale: Le démonstratif renvoie à l’opération d’inscription mentionnée au verset précédent; « ce » est naturel devant « recensement ».
- source_word: ἀπογραφὴ
  choice: recensement
  rationale: Le terme désigne une inscription officielle, souvent liée à l’impôt. « Recensement » est le terme français courant, tandis qu’« enregistrement » reste une possibilité plus générale signalée en note.
- source_word: πρώτη
  choice: en premier
  rationale: Cette formulation conserve le sens ordinal le plus direct et rattache naturellement πρώτη à l’événement, sans trancher au-delà de la syntaxe grecque.
- source_word: ἐγένετο
  choice: eut lieu
  rationale: Expression française idiomatique et digne pour un événement qui se produit.
- source_word: ἡγεμονεύοντος
  choice: pendant que … gouvernait
  rationale: Rend la circonstance contemporaine exprimée par le génitif absolu, sans imposer à Quirinius un titre administratif plus précis que ne le fait le verbe grec.
- source_word: τῆς Συρίας
  choice: la Syrie
  rationale: Désignation géographique française usuelle.
- source_word: Κυρηνίου
  choice: Quirinius
  rationale: Forme française traditionnelle et largement reconnue du nom propre.
theological_decisions:
- issue: Interprétation de πρώτη dans une proposition historiquement et syntaxiquement discutée
  choice: 'Traduire premièrement au sens ordinal dans le texte principal : « eut lieu en premier ».'
  alternative: « Ce recensement eut lieu avant que Quirinius gouverne la Syrie. »
  rationale: Le sens ordinal est le sens le plus direct de πρώτη. Puisque l’interprétation temporelle comparative « avant » est défendue mais discutée, elle est conservée en note afin de ne pas résoudre silencieusement l’ambiguïté.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple convient au registre narratif biblique écrit; « gouvernait » évite d’ajouter le titre précis de gouverneur. Les deux appels de note figurent dans le texte principal.
