source:
  edition: SBLGNT
  text: ἀπογράψασθαι σὺν Μαριὰμ τῇ ⸂ἐμνηστευμένῃ αὐτῷ⸃, οὔσῃ ἐγκύῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/005.yaml
  text: to register with Mary[b][a], who was betrothed to him and was pregnant.
translation:
  language: fr
  text: pour se faire recenser avec Marie, qui lui était promise en mariage[a] et qui était enceinte[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sa fiancée ». Le grec désigne un engagement matrimonial officiel, dont la portée juridique et sociale était plus forte que celle des fiançailles modernes.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement « étant enceinte » ; autre traduction possible : « qui attendait un enfant ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπογράψασθαι
  choice: se faire recenser
  rationale: Dans le contexte du recensement, l’infinitif aoriste moyen exprime le but du déplacement de Joseph. « Se faire recenser » est l’expression administrative naturelle en français.
- source_word: σὺν
  choice: avec
  rationale: Rend directement et naturellement l’idée d’accompagnement.
- source_word: Μαριὰμ
  choice: Marie
  rationale: Forme française traditionnelle et courante du nom.
- source_word: ἐμνηστευμένῃ αὐτῷ
  choice: qui lui était promise en mariage
  rationale: Cette formulation exprime le lien officiel et juridiquement plus fort que ne le suggèrent souvent les fiançailles modernes, tout en évitant de présenter Marie comme déjà pleinement mariée dans cette proposition.
- source_word: οὔσῃ ἐγκύῳ
  choice: et qui était enceinte
  rationale: Rend clairement la circonstance exprimée par le participe et produit une phrase naturelle en français moderne.
theological_decisions:
- issue: Statut matrimonial de Marie par rapport à Joseph
  choice: promise en mariage
  alternative: fiancée à lui ; sa femme
  rationale: Le grec μνηστεύομαι désigne des fiançailles formelles dotées d’une forte portée sociale et juridique. « Promise en mariage » préserve cette réalité sans affaiblir le lien comme pourrait le faire le sens moderne de « fiancée », ni anticiper un mariage accompli en traduisant « sa femme ».
translation_notes:
  register: Français international moderne, clair et digne. « Se faire recenser » convient au contexte administratif ; « promise en mariage » reste accessible tout en conservant la force historique du lien. Les marqueurs suivent immédiatement les expressions concernées.
