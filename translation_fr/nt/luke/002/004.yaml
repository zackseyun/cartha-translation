id: LUK.2.4
reference: Luke 2:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἀνέβη δὲ καὶ Ἰωσὴφ ἀπὸ τῆς Γαλιλαίας ἐκ πόλεως Ναζαρὲθ εἰς τὴν Ἰουδαίαν εἰς πόλιν Δαυὶδ ἥτις καλεῖται Βηθλέεμ, διὰ τὸ εἶναι αὐτὸν ἐξ οἴκου καὶ πατριᾶς Δαυίδ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/004.yaml
  text: And Joseph also went up from Galilee[a], from the town of Nazareth, to Judea, to the city of David which is called Bethlehem, because he was from the house and family line of David,
translation:
  language: fr
  text: Joseph aussi monta de Galilée, de la ville de Nazareth, jusqu’en Judée, dans la ville de David appelée Bethléem, parce qu’il était de la maison et de la lignée[a] de David.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de la maison et de la famille de David ». Le grec emploie deux termes apparentés concernant l’ascendance, ce qui souligne l’origine davidique de Joseph.
    reason: Alternative lexicale pour πατριά et préservation des deux termes grecs d’ascendance.
lexical_decisions:
- source_word: Ἀνέβη
  choice: monta
  rationale: Conserve l’idée de déplacement vers le haut exprimée par le grec et courante pour un voyage vers la Judée, sans alourdir la phrase.
- source_word: δὲ καὶ
  choice: aussi
  rationale: « Aussi » marque la participation de Joseph au déplacement général; la continuité narrative est rendue naturellement par l’enchaînement de la phrase.
- source_word: ἀπὸ τῆς Γαλιλαίας ἐκ πόλεως Ναζαρὲθ
  choice: de Galilée, depuis la ville de Nazareth
  rationale: La variation « de / depuis » rend les deux indications d’origine sans répétition maladroite et situe Nazareth à l’intérieur de la Galilée.
- source_word: εἰς τὴν Ἰουδαίαν εἰς πόλιν Δαυὶδ
  choice: jusqu’en Judée, dans la ville de David
  rationale: Rend les deux compléments introduits par εἰς tout en employant des prépositions françaises naturelles.
- source_word: ἥτις καλεῖται Βηθλέεμ
  choice: appelée Bethléem
  rationale: Formulation française concise qui conserve l’identification explicite de la ville de David à Bethléem.
- source_word: διὰ τὸ εἶναι αὐτὸν
  choice: parce qu’il était
  rationale: L’infinitif grec articulé avec διά exprime ici la cause; une proposition personnelle est la formulation française la plus naturelle.
- source_word: ἐξ οἴκου καὶ πατριᾶς Δαυίδ
  choice: de la maison et de la lignée de David
  rationale: Conserve les deux termes d’appartenance ancestrale. « Maison » maintient la portée dynastique et « lignée » exprime clairement la descendance.
theological_decisions:
- issue: Terminologie de l’ascendance davidique
  choice: de la maison et de la lignée de David
  alternative: de la maison et de la famille de David
  rationale: La traduction garde distincts οἶκος et πατριά et souligne l’ascendance davidique de Joseph sans préciser davantage la relation entre ces deux notions.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe suit le mouvement géographique du grec tout en évitant une succession pesante de prépositions identiques.
