  text: καὶ μὴ ⸀εὑρόντες ὑπέστρεψαν εἰς Ἰερουσαλὴμ ⸀ἀναζητοῦντες αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/045.yaml
  text: And when they did not find him[a], they returned to Jerusalem, searching for him.
translation:
  language: fr
  text: Sans l’avoir trouvé, ils retournèrent à Jérusalem à sa recherche.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: Comme
  rationale: Le lien avec la séquence précédente est intégré à la proposition circonstancielle; en français, « Comme » rend naturellement le rapport entre l'absence de découverte et le retour, sans alourdir le récit par un « Et » initial.
- source_word: μὴ εὑρόντες
  choice: ils ne le trouvaient pas
  rationale: Le participe aoriste négatif exprime ici une circonstance antérieure ou causale. L'imparfait français présente naturellement l'échec de leur recherche comme la situation qui motive leur retour, sans imposer une nuance strictement ponctuelle.
- source_word: ὑπέστρεψαν
  choice: ils retournèrent
  rationale: Le passé simple convient au registre narratif biblique moderne et rend l'action achevée de revenir sur leurs pas.
- source_word: εἰς Ἰερουσαλήμ
  choice: à Jérusalem
  rationale: Avec le verbe « retourner » et un nom de ville, « à » est la tournure française idiomatique.
- source_word: ἀναζητοῦντες
  choice: pour le chercher
  rationale: Le participe présent peut indiquer l'action accompagnant le retour ou son but pratique. « pour le chercher » exprime clairement et naturellement qu'ils retournent afin de mener une recherche active.
- source_word: αὐτόν
  choice: le
  rationale: Le pronom accusatif masculin renvoie à Jésus et se rend naturellement par le pronom objet direct « le ».
