id: LUK.2.46
reference: Luke 2:46
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἐγένετο μετὰ ἡμέρας τρεῖς εὗρον αὐτὸν ἐν τῷ ἱερῷ καθεζόμενον ἐν μέσῳ τῶν διδασκάλων καὶ ἀκούοντα αὐτῶν καὶ ἐπερωτῶντα αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/046.yaml
  text: And it happened that after three days they found him in the temple[b][a], sitting among the teachers and listening to them and asking them questions.
translation:
  language: fr
  text: Au bout de trois jours, ils le trouvèrent dans le Temple[a], assis au milieu des enseignants, les écoutant et leur posant des questions[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot grec désigne ici l’ensemble du Temple et de ses cours, non le sanctuaire intérieur en particulier.
    reason: cultural_note
  - marker: b
    text: 'Ou : « les interrogeant ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: non rendu séparément
  rationale: La formule narrative sémitisante et lucanienne καὶ ἐγένετο introduit l’événement. En français moderne, la rendre littéralement par « et il arriva que » alourdirait la phrase; l’enchaînement narratif est naturellement porté par « Au bout de trois jours ».
- source_word: μετὰ ἡμέρας τρεῖς
  choice: Au bout de trois jours
  rationale: Cette expression indique qu’un intervalle de trois jours s’est écoulé. « Au bout de trois jours » reste proche du grec tout en étant idiomatique en français.
- source_word: εὗρον
  choice: ils le trouvèrent
  rationale: Le passé simple convient au récit écrit et exprime directement l’action ponctuelle de l’aoriste.
- source_word: ἐν τῷ ἱερῷ
  choice: dans le Temple
  rationale: ἱερόν désigne ici l’ensemble du complexe du Temple, et non spécifiquement le sanctuaire intérieur. « Temple » demeure la formulation française courante, avec précision en note.
- source_word: καθεζόμενον
  choice: assis
  rationale: Le participe présent décrit la posture de Jésus au moment où ils le trouvent; « assis » est naturel et précis.
- source_word: ἐν μέσῳ τῶν διδασκάλων
  choice: au milieu des enseignants
  rationale: La formulation reproduit le sens spatial de ἐν μέσῳ sans ajouter « de la Loi », précision plausible dans le contexte mais absente du texte grec.
- source_word: ἀκούοντα αὐτῶν
  choice: les écoutant
  rationale: Le verbe décrit ici une écoute attentive plutôt que la simple perception auditive.
- source_word: ἐπερωτῶντα αὐτούς
  choice: leur posant des questions
  rationale: Cette tournure française rend l’action d’interroger sans suggérer nécessairement une confrontation ou un interrogatoire.
theological_decisions:
- issue: Nature de l’échange de Jésus avec les enseignants
  choice: « les écoutant et leur posant des questions »
  alternative: « les écoutant et les interrogeant »
  rationale: Le grec présente Jésus comme participant activement à un échange. La formulation retenue préserve à la fois son écoute et son intelligence sans imposer l’idée d’une confrontation ni tirer une conclusion théologique au-delà du verset.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple maintient un registre narratif biblique soutenu mais accessible. La majuscule à « Temple » signale le Temple de Jérusalem comme édifice particulier.
