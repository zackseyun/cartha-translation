id: LUK.2.11
reference: Luke 2:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὅτι ἐτέχθη ὑμῖν σήμερον σωτὴρ ὅς ἐστιν χριστὸς κύριος ἐν πόλει Δαυίδ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/011.yaml
  text: because today a Savior was born for you in the city of David[a], who is Messiah the Lord.
translation:
  language: fr
  text: 'Car aujourd’hui, dans la ville de David, un Sauveur est né pour vous : c’est le Messie, le Seigneur[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, selon la formulation traditionnelle : « le Christ, le Seigneur ». Le grec χριστὸς κύριος signifie littéralement « Messie Seigneur » et se comprend généralement comme deux titres : « le Messie, le Seigneur ».'
    reason: Signaler le rendu traditionnel et la construction compacte des deux titres grecs sans imposer silencieusement une interprétation.
lexical_decisions:
- source_word: ὅτι
  choice: Car
  rationale: Introduit la raison ou le contenu explicatif de l’annonce angélique précédente. « Car » conserve ce lien tout en restant naturel dans un registre narratif digne.
- source_word: ἐτέχθη
  choice: est né
  rationale: Rend idiomatiquement l’aoriste passif de τίκτω. Le passé composé convient en français à l’annonce d’un événement récent dont la portée demeure actuelle.
- source_word: ὑμῖν
  choice: pour vous
  rationale: 'Exprime le datif d’intérêt ou de bénéfice : la naissance est une bonne nouvelle destinée aux auditeurs.'
- source_word: σήμερον
  choice: aujourd’hui
  rationale: Équivalent direct et courant de l’adverbe temporel grec.
- source_word: σωτὴρ
  choice: un Sauveur
  rationale: « Sauveur » conserve à la fois l’idée de délivrance et la portée royale et théologique du titre.
- source_word: ὅς ἐστιν
  choice: c’est
  rationale: La tournure présentative après les deux-points identifie naturellement en français le Sauveur par les titres qui suivent, sans modifier le rapport syntaxique essentiel.
- source_word: χριστὸς
  choice: le Messie
  rationale: Χριστός fonctionne ici comme un titre lié à l’attente davidique; « Messie » en rend le sens pour le lecteur moderne plutôt que de le traiter comme un nom propre.
- source_word: κύριος
  choice: le Seigneur
  rationale: « Seigneur » est le rendu français établi de κύριος et en préserve ici le poids d’autorité ainsi que la forte portée théologique.
- source_word: ἐν πόλει Δαυίδ
  choice: dans la ville de David
  rationale: Rendu direct et idiomatique qui préserve l’association davidique et la référence contextuelle à Bethléem.
theological_decisions:
- issue: Interprétation de χριστὸς κύριος
  choice: le Messie, le Seigneur
  alternative: le Christ, le Seigneur; le Messie du Seigneur
  rationale: Le grec juxtapose deux formes nominatives qui identifient le Sauveur comme Messie et Seigneur. La virgule rend clairement cette apposition sans transformer « Christ » en nom propre. « Le Christ, le Seigneur » est la formulation traditionnelle; « le Messie du Seigneur » représente une autre compréhension attestée, mais elle est moins directe avec la forme nominative κύριος du texte retenu.
translation_notes:
  register: Français international moderne, clair et digne. L’ordre place naturellement le lieu avant l’annonce principale; les deux-points rendent l’identification exprimée par la proposition relative grecque. La majuscule à « Sauveur », « Messie » et « Seigneur » marque leur emploi comme titres dans ce contexte.
