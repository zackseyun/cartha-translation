id: LUK.2.13
reference: Luke 2:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἐξαίφνης ἐγένετο σὺν τῷ ἀγγέλῳ πλῆθος στρατιᾶς ⸀οὐρανίου αἰνούντων τὸν θεὸν καὶ λεγόντων·
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/013.yaml
  text: 'And suddenly there was with the angel a multitude of the heavenly host[a], praising God and saying:'
translation:
  language: fr
  text: 'Et soudain, il y eut avec l’ange une multitude de l’armée céleste[a], qui louait Dieu et disait :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de la troupe céleste » ou « de l’armée du ciel ».
    reason: Alternative lexicale permettant de refléter d’autres formulations naturelles de στρατιᾶς οὐρανίου tout en conservant son image collective et militaire.
lexical_decisions:
- source_word: ἐξαίφνης
  choice: soudain
  rationale: Rend directement l’irruption inattendue signalée par l’adverbe grec, dans un français naturel.
- source_word: ἐγένετο
  choice: il y eut
  rationale: Dans cette construction existentielle, cette formulation signale la présence soudaine de la multitude sans préciser davantage le mode de son apparition.
- source_word: σὺν τῷ ἀγγέλῳ
  choice: avec l’ange
  rationale: Rend simplement l’accompagnement exprimé par σύν avec le datif.
- source_word: πλῆθος
  choice: une multitude
  rationale: Conserve l’idée d’un très grand nombre ainsi que le ton élevé du récit.
- source_word: στρατιᾶς οὐρανίου
  choice: de l’armée céleste
  rationale: Préserve l’image collective et militaire de στρατιά, que le terme français « armée » communique plus clairement aujourd’hui que « milice » ou « host ».
- source_word: αἰνούντων τὸν θεὸν
  choice: qui louait Dieu
  rationale: Rend l’action simultanée du participe. Le singulier « louait » accorde naturellement le verbe avec le nom collectif « multitude ».
- source_word: καὶ λεγόντων
  choice: et disait
  rationale: Coordonne la seconde action à la première et introduit les paroles du verset suivant; le singulier suit le nom collectif « multitude ».
theological_decisions:
- issue: Sens de στρατιᾶς οὐρανίου
  choice: l’armée céleste
  alternative: la troupe céleste; l’armée du ciel
  rationale: Le grec évoque une multitude céleste organisée, avec une réelle nuance militaire, même si elle est ici occupée à louer Dieu. « Armée céleste » conserve cette tension sans remplacer explicitement ses membres par des « anges ».
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proche du déroulement grec sans être artificielle. « Armée céleste » est intelligible au grand public et maintient l’imagerie du texte source.
