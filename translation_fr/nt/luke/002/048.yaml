  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἰδόντες αὐτὸν ἐξεπλάγησαν, καὶ ⸂εἶπεν πρὸς αὐτὸν ἡ μήτηρ αὐτοῦ⸃· Τέκνον, τί ἐποίησας ἡμῖν οὕτως; ἰδοὺ ὁ πατήρ σου καὶ ἐγὼ ὀδυνώμενοι ⸀ἐζητοῦμέν σε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/048.yaml
  text: And when they saw him[a], they were astonished, and his mother said to him, “Child, why have you done this to us? Look, your father and I have been anxiously looking for you.”
translation:
  language: fr
  text: 'Quand ils le virent, ils furent stupéfaits, et sa mère lui dit : « Mon enfant, pourquoi nous as-tu fait cela ? Vois, ton père et moi, nous te cherchions dans l’angoisse[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « dans la détresse » ou « dans la douleur ». Le terme grec évoque la souffrance émotionnelle éprouvée pendant la recherche.'
    reason: Alternative lexicale précisant la force de ὀδυνώμενοι.
lexical_decisions:
- source_word: ἰδόντες
  choice: Quand ils le virent
  rationale: Le participe aoriste est rendu par une proposition temporelle naturelle en français, qui marque clairement la succession des événements.
- source_word: ἐξεπλάγησαν
  choice: ils furent stupéfaits
  rationale: Le verbe exprime une vive surprise; « stupéfaits » en restitue l’intensité dans un registre courant et digne.
- source_word: Τέκνον
  choice: Mon enfant
  rationale: Le vocatif est une adresse affectueuse. En français, « Mon enfant » est plus naturel que le calque abrupt « Enfant », sans imposer le terme plus spécifiquement masculin « fils ».
- source_word: τί ἐποίησας ἡμῖν οὕτως
  choice: pourquoi nous as-tu fait cela ?
  rationale: Cette formulation idiomatique conserve à la fois la plainte introduite par τί et la portée relationnelle de ἡμῖν.
- source_word: ἰδοὺ
  choice: Vois
  rationale: L’impératif attire avec insistance l’attention de l’interlocuteur, sans recourir à l’archaïsme « voici que ».
- source_word: ὁ πατήρ σου
  choice: ton père
  rationale: La traduction reprend sans ajout la désignation employée par Marie et laisse intacte la tension narrative avec la parole de Jésus au verset suivant.
- source_word: ὀδυνώμενοι
  choice: dans l’angoisse
  rationale: Le participe exprime une souffrance émotionnelle profonde pendant la recherche; cette locution française en préserve mieux la force que le simple adverbe « anxieusement ».
- source_word: ἐζητοῦμέν σε
  choice: nous te cherchions
  rationale: L’imparfait français correspond naturellement à l’action continue exprimée par l’imparfait grec et convient au récit d’une recherche prolongée.
theological_decisions:
- issue: Joseph est appelé « ton père » alors que le récit affirme la filiation divine de Jésus.
  choice: Conserver « ton père » sans qualificatif.
  alternative: « ton père terrestre »
  rationale: Le grec rapporte simplement les paroles de Marie. Ajouter « terrestre » résoudrait par interprétation une tension que le texte maintient et que la réponse de Jésus au verset suivant éclaire.
translation_notes:
  register: Français international moderne, naturel et digne. La ponctuation du discours direct suit l’usage français; le registre familial demeure sobre, et aucun qualificatif théologique absent du grec n’est ajouté.
