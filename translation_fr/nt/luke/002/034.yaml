  to: 'Puis Siméon les bénit et dit à Marie, la mère de l’enfant : « Voici, celui-ci est destiné à la chute et au relèvement de beaucoup en Israël, et à être un signe que l’on contestera[a]. »'
  rationale: La révision retire uniquement la causalité plus marquée de « provoquer ». Elle maintient la construction de destination, le parallélisme « chute et relèvement », l’ambiguïté quant aux personnes concernées et le sens opposé/contesté du signe.
