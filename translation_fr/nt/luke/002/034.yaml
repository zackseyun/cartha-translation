id: LUK.2.34
reference: Luke 2:34
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ εὐλόγησεν αὐτοὺς Συμεὼν καὶ εἶπεν πρὸς Μαριὰμ τὴν μητέρα αὐτοῦ· Ἰδοὺ οὗτος κεῖται εἰς πτῶσιν καὶ ἀνάστασιν πολλῶν ἐν τῷ Ἰσραὴλ καὶ εἰς σημεῖον ἀντιλεγόμενον,
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/034.yaml
  text: And Simeon blessed them and said to Mary his mother, “Look, this one is appointed for the fall and rise of many in Israel, and for a sign that is opposed,[a]”
translation:
  language: fr
  text: 'Puis Siméon les bénit et dit à Marie, la mère de l’enfant : « Voici, celui-ci est destiné à la chute et au relèvement de beaucoup en Israël, et à être un signe que l’on contestera[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « auquel on s’opposera » ; littéralement : « qui sera contredit ».'
    reason: Signale que ἀντιλεγόμενον peut désigner à la fois la contradiction verbale et une opposition plus générale.
lexical_decisions:
- source_word: εὐλόγησεν
  choice: bénit
  rationale: Rend directement l’acte de bénédiction prononcé par Siméon.
- source_word: Ἰδοὺ
  choice: Voici
  rationale: Formule française naturelle et digne qui attire solennellement l’attention.
- source_word: κεῖται εἰς
  choice: est destiné à provoquer
  rationale: Exprime ici l’idée d’une fonction ou d’un résultat établi, sans préciser explicitement qui l’a établi.
- source_word: πτῶσιν καὶ ἀνάστασιν
  choice: la chute et le relèvement
  rationale: Conserve le parallélisme et l’ambiguïté de ἀνάστασις, qui peut évoquer le fait de se relever comme la résurrection.
- source_word: ἀντιλεγόμενον
  choice: que l’on contestera
  rationale: Traduit l’opposition exprimée verbalement par ἀντιλέγω dans un français courant.
theological_decisions:
- issue: Portée de « chute et relèvement »
  choice: Conserver les deux termes sans expliquer s’ils concernent les mêmes personnes ou des groupes différents.
  alternative: « la chute des uns et le relèvement des autres »
  rationale: Le grec dit seulement « de beaucoup » et maintient cette tension interprétative.
- issue: Agent implicite de la destinée
  choice: « est destiné » sans nommer Dieu comme agent
  alternative: « Dieu l’a établi »
  rationale: La tournure grecque κεῖται est passive ou stative et ne désigne pas explicitement l’agent.
- issue: Sens de ἀνάστασις
  choice: « relèvement »
  alternative: « résurrection »
  rationale: « Relèvement » préserve mieux l’étendue sémantique dans ce contexte, tout en laissant possible une résonance de résurrection.
translation_notes:
  register: Français international moderne, clair et digne. « La mère de l’enfant » explicite le référent du pronom grec αὐτοῦ afin d’éviter en français que « sa mère » renvoie naturellement à Siméon. La phrase conserve le mouvement solennel de l’annonce.
