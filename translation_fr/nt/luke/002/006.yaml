source:
  edition: SBLGNT
  text: ἐγένετο δὲ ἐν τῷ εἶναι αὐτοὺς ἐκεῖ ἐπλήσθησαν αἱ ἡμέραι τοῦ τεκεῖν αὐτήν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/006.yaml
  text: And while they were there[a], the days were fulfilled for her to give birth.
translation:
  language: fr
  text: Or, pendant qu’ils étaient là, les jours de sa grossesse arrivèrent à leur terme[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les jours furent accomplis pour qu’elle enfante ».'
    reason: La note signale la formulation grecque, qui parle des « jours » et emploie un verbe d’accomplissement, tandis que le texte français explicite idiomatiquement le contexte de la grossesse.
lexical_decisions:
- source_word: ἐγένετο δὲ
  choice: Pendant que…
  rationale: L’idiome introduit la suite du récit. En français, il n’est pas nécessaire de traduire mécaniquement « il arriva que » ; la proposition temporelle assure naturellement la progression narrative.
- source_word: ἐν τῷ εἶναι αὐτοὺς ἐκεῖ
  choice: pendant qu’ils étaient là
  rationale: La construction avec ἐν et l’infinitif articulé exprime la simultanéité. Cette formulation est naturelle et conserve la durée suggérée par le grec.
- source_word: ἐπλήσθησαν
  choice: arrivèrent à leur terme
  rationale: Le verbe indique ici que la période prévue a atteint son plein accomplissement. Cette expression française conserve l’idée d’achèvement sans lui imposer une interprétation théologique explicite.
- source_word: αἱ ἡμέραι
  choice: les jours
  rationale: Le grec emploie explicitement « les jours ». Les conserver permet de respecter l’image et le style de Luc plutôt que de les réduire simplement au « moment ».
- source_word: τοῦ τεκεῖν αὐτήν
  choice: où elle devait accoucher
  rationale: Cette formulation rend clairement le rapport entre l’achèvement des jours et l’accouchement de Marie. « Accoucher » est courant, précis et digne en français moderne.
theological_decisions:
- issue: Possible portée providentielle ou notion de temps fixé dans ἐπλήσθησαν αἱ ἡμέραι
  choice: les jours où elle devait accoucher arrivèrent à leur terme
  alternative: le moment où elle devait accoucher arriva
  rationale: La formulation retenue préserve à la fois le pluriel concret « les jours » et le vocabulaire d’accomplissement de Luc. Elle laisse ouverte une éventuelle résonance providentielle sans transformer le verset en affirmation doctrinale explicite.
translation_notes:
  register: Français international moderne, simple et digne. « Arriver à son terme » est idiomatique pour une période qui s’achève et convient au contexte de la grossesse, sans lourdeur archaïsante.
