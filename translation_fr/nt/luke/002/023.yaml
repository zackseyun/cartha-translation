  text: καθὼς γέγραπται ἐν νόμῳ κυρίου ὅτι Πᾶν ἄρσεν διανοῖγον μήτραν ἅγιον τῷ κυρίῳ κληθήσεται,
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/023.yaml
  text: as it is written in the Law of the Lord[a], that every male opening the womb shall be called holy to the Lord[c][b],
translation:
  language: fr
  text: 'comme il est écrit dans la Loi du Seigneur : « Tout enfant mâle qui ouvre la matrice sera appelé saint pour le Seigneur[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'C’est-à-dire : tout premier-né de sexe masculin sera considéré comme saint, ou consacré, pour le Seigneur ; voir Exode 13.2, 12.'
    reason: Clarification de l’expression idiomatique et renvoi au contexte de la citation.
lexical_decisions:
- source_word: καθὼς γέγραπται
  choice: comme il est écrit
  rationale: Formule française naturelle de citation scripturaire, qui conserve la valeur durable du parfait grec.
- source_word: ἐν νόμῳ κυρίου
  choice: dans la Loi du Seigneur
  rationale: « Loi » désigne ici le corpus de l’instruction mosaïque et prend une majuscule ; κύριος est rendu directement par « Seigneur » conformément au texte grec.
- source_word: Πᾶν ἄρσεν
  choice: Tout enfant mâle
  rationale: Le contexte concerne un nouveau-né ; l’ajout explicatif d’« enfant » rend le français naturel tout en maintenant la précision masculine de ἄρσεν.
- source_word: διανοῖγον μήτραν
  choice: qui ouvre le sein maternel
  rationale: Cette formulation conserve l’image biblique de l’ouverture du sein et désigne idiomatiquement le premier-né, sans la remplacer dans le texte par une interprétation.
- source_word: ἅγιον τῷ κυρίῳ
  choice: saint pour le Seigneur
  rationale: « Saint » préserve le vocabulaire explicite de la sainteté ; « pour le Seigneur » exprime ici la relation de consécration portée par le datif.
- source_word: κληθήσεται
  choice: sera appelé
  rationale: Rend directement le futur passif tout en restant naturel en français moderne.
theological_decisions:
- issue: Rendu de κύριος dans une citation de la Loi d’Israël
  choice: Seigneur
  alternative: L’ÉTERNEL
  rationale: La traduction suit directement le grec κύριος. Même si le passage de l’Exode sous-jacent renvoie au nom divin hébreu, il ne convient pas de le réintroduire dans le texte grec.
- issue: Sainteté ou consécration
  choice: saint pour le Seigneur
  alternative: consacré au Seigneur
  rationale: Le grec emploie explicitement ἅγιον. Le texte principal conserve donc le terme « saint », tandis que la note explicite sa portée de mise à part ou de consécration.
- issue: Valeur idiomatique de l’ouverture du sein maternel
  choice: conserver l’image dans le texte et l’expliquer en note
  alternative: traduire directement par « tout premier-né de sexe masculin »
  rationale: La formulation retenue respecte l’expression de la citation tout en permettant au lecteur moderne d’en saisir le sens par une note.
translation_notes:
  register: Français international moderne, digne et lisible. Les deux-points introduisent naturellement la citation après la formule « il est écrit ». La formulation biblique « ouvre le sein maternel » est conservée, mais éclairée par une note.
