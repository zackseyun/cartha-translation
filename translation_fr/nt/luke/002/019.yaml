id: LUK.2.19
reference: Luke 2:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἡ δὲ ⸀Μαρία πάντα συνετήρει τὰ ῥήματα ταῦτα συμβάλλουσα ἐν τῇ καρδίᾳ αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/019.yaml
  text: But Mary was treasuring up all these words[b][a], pondering them in her heart.
translation:
  language: fr
  text: Mais Marie gardait précieusement toutes ces paroles[a] et les méditait dans son cœur[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «toutes ces choses»; le terme grec peut désigner des paroles, des faits ou des événements.
    reason: lexical_alternative
  - marker: b
    text: Le terme traduit par «méditait» peut évoquer le fait de rapprocher les éléments et de les considérer ensemble.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Mais
  rationale: Marque ici un léger contraste entre la réaction publique de ceux qui entendent les bergers et la réaction intérieure de Marie.
- source_word: συνετήρει
  choice: gardait précieusement
  rationale: L’imparfait exprime une action continue, tandis que le verbe évoque le fait de conserver avec soin; cette formulation rend les deux nuances sans impliquer une compréhension complète.
- source_word: πάντα τὰ ῥήματα ταῦτα
  choice: toutes ces paroles
  rationale: Dans le contexte immédiat du récit transmis par les bergers, ῥήματα désigne naturellement des paroles ou propos; πάντα en souligne la totalité.
- source_word: συμβάλλουσα
  choice: les méditait
  rationale: Le participe décrit une réflexion qui rapproche et met en relation les éléments; «méditait» est naturel en français, tandis qu’une note conserve la nuance littérale de mise en rapport.
- source_word: ἐν τῇ καρδίᾳ αὐτῆς
  choice: dans son cœur
  rationale: Conserve l’image biblique du cœur comme lieu de la réflexion intérieure, sans la réduire à une activité seulement intellectuelle.
- source_word: Μαρία
  choice: Marie
  rationale: Forme française traditionnelle et courante du nom.
theological_decisions:
- issue: Nature de la réaction de Marie
  choice: Marie conserve soigneusement les paroles et y réfléchit intérieurement.
  alternative: Marie se contente de se souvenir des événements, ou elle en comprend déjà pleinement le sens.
  rationale: Les verbes indiquent conservation attentive et réflexion, mais n’affirment ni simple mémorisation ni compréhension complète; la traduction maintient cette tension.
translation_notes:
  register: Français moderne, naturel et digne. «Gardait précieusement» exprime la conservation attentive sans le tour moins idiomatique «amassait». Les marqueurs de notes figurent tous dans le texte principal.
