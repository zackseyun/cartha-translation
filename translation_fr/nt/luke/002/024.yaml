id: LUK.2.24
reference: Luke 2:24
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ τοῦ δοῦναι θυσίαν κατὰ τὸ εἰρημένον ἐν ⸀τῷ νόμῳ κυρίου, ζεῦγος τρυγόνων ἢ δύο νοσσοὺς περιστερῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/024.yaml
  text: 'and to offer a sacrifice according to what had been said in the Law of the Lord: a pair of turtledoves or two young pigeons[a].'
translation:
  language: fr
  text: 'et pour offrir un sacrifice conformément à ce qui est dit dans la loi du Seigneur : « une paire de tourterelles ou deux jeunes pigeons »[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « conformément à ce qui avait été dit dans la loi du Seigneur ».'
    reason: Le parfait passif εἰρημένον peut aussi être rendu en soulignant l’antériorité de la parole.
lexical_decisions:
- source_word: τοῦ δοῦναι θυσίαν
  choice: pour offrir un sacrifice
  rationale: L’infinitif articulaire exprime ici le but. Bien que δίδωμι signifie littéralement « donner », « offrir un sacrifice » est l’expression française naturelle et rend précisément le sens cultuel de θυσίαν.
- source_word: κατὰ τὸ εἰρημένον
  choice: conformément à ce qui est dit
  rationale: Le participe parfait passif désigne une parole antérieure qui demeure formulée dans la Loi. Le présent français « est dit » exprime naturellement cette valeur durable sans introduire le terme plus interprétatif « prescrit ».
- source_word: ἐν τῷ νόμῳ κυρίου
  choice: dans la loi du Seigneur
  rationale: νόμος renvoie ici à la Loi mosaïque, tandis que κύριος est rendu par « Seigneur », conformément à l’usage néotestamentaire et sans substituer au texte grec une reconstruction du nom divin.
- source_word: ζεῦγος τρυγόνων
  choice: une paire de tourterelles
  rationale: ζεῦγος désigne une paire, et τρυγών l’espèce précise de la tourterelle plutôt qu’une colombe au sens générique.
- source_word: δύο νοσσοὺς περιστερῶν
  choice: deux jeunes pigeons
  rationale: νοσσός désigne un jeune oiseau. « Jeunes pigeons » est une formulation française claire et précise dans ce contexte sacrificiel.
theological_decisions:
- issue: Rendu de κύριος dans la formule relative à la Loi divine
  choice: Seigneur
  alternative: SEIGNEUR
  rationale: Le texte grec porte κύριος. « Seigneur » le traduit directement et conserve la formulation habituelle du Nouveau Testament, sans imposer l’identification typographique avec le tétragramme de l’Ancien Testament.
- issue: Valeur temporelle de τὸ εἰρημένον
  choice: ce qui est dit
  alternative: ce qui avait été dit
  rationale: Le parfait peut être rendu en insistant soit sur la parole prononcée antérieurement, soit sur son résultat durable dans l’Écriture. Le texte retient la seconde nuance, plus naturelle en français, et signale l’autre en note.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe conserve le lien de but avec le contexte précédent. Les guillemets signalent la citation scripturaire, et le vocabulaire sacrificiel reste précis sans archaïsme.
