id: LUK.2.41
reference: Luke 2:41
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ ἐπορεύοντο οἱ γονεῖς αὐτοῦ κατ’ ἔτος εἰς Ἰερουσαλὴμ τῇ ἑορτῇ τοῦ πάσχα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/041.yaml
  text: And his parents went to Jerusalem year by year for the Feast of the Passover.
translation:
  language: fr
  text: Chaque année, ses parents allaient à Jérusalem pour la fête de la Pâque.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπορεύοντο
  choice: allaient
  rationale: L’imparfait grec exprime ici une action habituelle dans le passé. L’imparfait français « allaient », avec « chaque année », rend naturellement cette répétition.
- source_word: οἱ γονεῖς αὐτοῦ
  choice: ses parents
  rationale: Le grec désigne simplement « ses parents ». Cette formulation française conserve le sens familial ordinaire du récit sans ajouter d’explication doctrinale.
- source_word: κατ’ ἔτος
  choice: chaque année
  rationale: Cette expression distributive signifie « année après année » ou « tous les ans ». « Chaque année » est idiomatique, précis et naturel en français moderne.
- source_word: Ἰερουσαλήμ
  choice: Jérusalem
  rationale: Forme française usuelle du nom de lieu.
- source_word: τῇ ἑορτῇ
  choice: pour la fête
  rationale: Dans ce contexte de déplacement, le datif indique l’occasion ou le motif du voyage. « Pour la fête » restitue clairement ce rapport.
- source_word: τοῦ πάσχα
  choice: de la Pâque
  rationale: πάσχα désigne ici la fête juive de la Pâque. Le singulier « la Pâque » est la désignation française traditionnelle et précise de cette fête.
theological_decisions:
- issue: Désignation des membres de la famille de Jésus
  choice: ses parents
  alternative: son père et sa mère
  rationale: Le texte grec dit « ses parents ». Traduire directement ce terme préserve le sens ordinaire du récit sans résoudre artificiellement la tension avec le récit lucanien de la conception virginale.
translation_notes:
  register: Français international moderne, simple et digne. L’ordre a été légèrement adapté pour placer « Chaque année » en tête, ce qui rend immédiatement claire la valeur habituelle de l’imparfait.
