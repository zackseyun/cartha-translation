  text: καὶ ἦν ⸂ὁ πατὴρ αὐτοῦ⸃ καὶ ἡ ⸀μήτηρ θαυμάζοντες ἐπὶ τοῖς λαλουμένοις περὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/033.yaml
  text: And his father and mother were marveling at the things being said about him[a].
translation:
  language: fr
  text: Son père et sa mère s’étonnaient de ce qu’on disait à son sujet[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec dit « son père ». Dans le récit, cette expression désigne Joseph au sens familial et social ordinaire. Certains manuscrits lisent « Joseph et sa mère »; certaines traductions retiennent cette leçon afin d’éviter un malentendu à la lumière du récit antérieur de la conception virginale de Jésus.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ πατὴρ αὐτοῦ
  choice: son père
  rationale: Rend directement le texte grec sans le remplacer par « Joseph ». Dans le récit, cette désignation relève du cadre familial et social ordinaire.
- source_word: μήτηρ
  choice: sa mère
  rationale: Équivalent français courant et exact, formant naturellement le couple « son père et sa mère ».
- source_word: θαυμάζοντες
  choice: s’émerveillaient
  rationale: Avec ἦν, le participe forme une tournure périphrastique à valeur imperfective. L’imparfait français exprime cette action en cours, tandis que « s’émerveiller » conserve l’idée d’étonnement admiratif.
- source_word: ἐπὶ τοῖς λαλουμένοις
  choice: de ce qu’on disait
  rationale: Formulation naturelle en français pour le contenu des paroles. Le pronom indéfini « on » rend idiomatiquement le passif grec sans préciser l’agent.
- source_word: περὶ αὐτοῦ
  choice: à son sujet
  rationale: Rend clairement περί avec le génitif dans un français moderne et naturel.
theological_decisions:
- issue: La désignation de Joseph comme « son père » dans un récit affirmant la conception virginale de Jésus
  choice: Conserver « son père » dans le texte principal et expliquer la portée narrative dans une note.
  alternative: « Joseph et sa mère » ou « son père, c’est-à-dire Joseph au sens légal et social »
  rationale: Le grec dit explicitement « son père ». Luc peut employer cette désignation dans le cadre familial ordinaire sans annuler son récit antérieur de la conception virginale. Remplacer ces mots par « Joseph » supprimerait une tension présente dans le texte.
translation_notes:
  register: Français international moderne, naturel et digne. L’imparfait « s’émerveillaient » restitue l’aspect duratif de la construction grecque. La formulation « de ce qu’on disait à son sujet » évite une tournure trop littérale tout en préservant le passif et le contenu de la parole.
