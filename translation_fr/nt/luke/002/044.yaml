  text: νομίσαντες δὲ αὐτὸν ⸂εἶναι ἐν τῇ συνοδίᾳ⸃ ἦλθον ἡμέρας ὁδὸν καὶ ἀνεζήτουν αὐτὸν ἐν τοῖς συγγενεῦσιν ⸀καὶ τοῖς γνωστοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/044.yaml
  text: But supposing him to be in the traveling group[a], they went a day's journey[b], and they began searching for him among their relatives and acquaintances.
translation:
  language: fr
  text: Mais, pensant qu’il était dans le groupe de voyageurs[a], ils firent une journée de chemin, puis se mirent à le chercher parmi les membres de leur famille et leurs connaissances[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans la caravane » ; le mot grec désigne un groupe de personnes faisant route ensemble.
    reason: lexical_alternative
  - marker: b
    text: 'On peut aussi traduire : « ils le cherchaient », ce qui souligne la durée de la recherche.'
    reason: lexical_alternative
lexical_decisions:
- source_word: νομίσαντες
  choice: pensant
  rationale: Le participe aoriste exprime l’idée qu’ils tenaient sa présence dans le groupe pour probable. « Pensant » est naturel en français et n’ajoute pas une certitude absente du grec.
- source_word: δὲ
  choice: Mais
  rationale: La particule marque ici une légère opposition avec le fait que Jésus était resté à Jérusalem sans que ses parents s’en aperçoivent.
- source_word: εἶναι ἐν τῇ συνοδίᾳ
  choice: qu’il était dans le groupe de voyageurs
  rationale: συνοδία désigne des personnes faisant route ensemble. Cette formulation est claire et actuelle, sans les connotations parfois étroites de « caravane ».
- source_word: ἦλθον ἡμέρας ὁδὸν
  choice: ils firent une journée de chemin
  rationale: Cette expression française rend naturellement l’idiome grec désignant le trajet parcouru en une journée.
- source_word: ἀνεζήτουν
  choice: se mirent à le chercher
  rationale: L’imparfait grec peut présenter une recherche en cours ou son commencement dans le récit. « Se mirent à » convient à la progression narrative, tandis qu’une note préserve l’autre nuance.
- source_word: συγγενεῦσιν
  choice: parents
  rationale: Le pluriel désigne largement les membres de la parenté. En français, « parents » peut avoir ce sens collectif dans ce contexte.
- source_word: γνωστοῖς
  choice: connaissances
  rationale: Le terme désigne des personnes connues, sans impliquer nécessairement l’intimité exprimée par « amis ».
