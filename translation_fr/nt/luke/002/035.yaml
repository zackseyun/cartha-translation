id: LUK.2.35
reference: Luke 2:35
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ σοῦ ⸀δὲ αὐτῆς τὴν ψυχὴν διελεύσεται ῥομφαία, ὅπως ἂν ἀποκαλυφθῶσιν ἐκ πολλῶν καρδιῶν διαλογισμοί.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/035.yaml
  text: and a sword will pass through your own soul also[b][a], so that the thoughts of many hearts may be revealed.
translation:
  language: fr
  text: et toi-même, une épée te transpercera l’âme[a][b], afin que soient révélées les pensées de beaucoup de cœurs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « une épée traversera ton âme elle-même ». Avec l’image d’une épée, le français dit naturellement « transpercera ».'
    reason: lexical_alternative
  - marker: b
    text: L’« épée » représente vraisemblablement la profonde souffrance que Marie connaîtra; le texte ne précise pas ici comment cette souffrance se réalisera.
    reason: cultural_note
lexical_decisions:
- source_word: σοῦ ... αὐτῆς
  choice: toi-même ... te
  rationale: La combinaison du pronom au génitif et de l’intensif αὐτῆς souligne que Marie sera personnellement touchée. La tournure française « toi-même ... te » restitue cette insistance sans lourdeur.
- source_word: ψυχή
  choice: âme
  rationale: Dans cette parole prophétique, ψυχή désigne la personne intérieure, siège d’une souffrance profonde. « Âme » conserve la force affective et spirituelle du terme.
- source_word: διελεύσεται
  choice: transpercera
  rationale: Le verbe signifie littéralement « traversera »; avec une épée pour sujet, « transpercera » exprime naturellement en français l’image produite par cette construction. Une note conserve le sens verbal plus littéral.
- source_word: ῥομφαία
  choice: épée
  rationale: ῥομφαία désigne une grande épée, mais « épée » suffit dans le texte courant et évite une précision artificielle.
- source_word: ὅπως ἂν
  choice: afin que
  rationale: Cette locution introduit le but ou le résultat visé. « Afin que » préserve nettement ce lien tout en gardant un registre digne.
- source_word: ἀποκαλυφθῶσιν
  choice: soient révélées
  rationale: Le passif aoriste au subjonctif est rendu par un subjonctif passif français, qui conserve l’idée de dévoilement.
- source_word: ἐκ πολλῶν καρδιῶν
  choice: de beaucoup de cœurs
  rationale: ἐκ indique ici la provenance intérieure des pensées. Associé à « pensées », le français naturel dit « les pensées de beaucoup de cœurs ».
- source_word: διαλογισμοί
  choice: pensées
  rationale: Le mot peut désigner des pensées, des raisonnements ou des réflexions intérieures. « Pensées » reste assez large pour ne pas imposer une nuance morale absente de l’expression elle-même.
theological_decisions:
- issue: Portée de l’épée annoncée à Marie
  choice: Conserver l’image d’une souffrance personnelle profonde sans préciser son accomplissement historique.
  alternative: Identifier explicitement l’épée au chagrin de Marie lors de la crucifixion, ou plus largement à la douleur causée par la division suscitée par la mission de Jésus.
  rationale: Le grec s’adresse directement à Marie et annonce qu’elle sera intimement atteinte, mais il ne précise pas ici le mécanisme exact de cette souffrance. La traduction ne doit donc pas résoudre cette tension.
- issue: Rapport exprimé par ὅπως ἂν
  choice: « afin que », laissant ouverte la relation précise de but ou de résultat dans le contexte.
  alternative: « de sorte que », qui mettrait davantage l’accent sur le résultat.
  rationale: La construction grecque peut exprimer le but ou le résultat envisagé. « Afin que » conserve la connexion forte sans développer une explication théologique supplémentaire.
translation_notes:
  register: Français international moderne, digne et accessible. L’ordre initial « et toi-même » maintient l’insistance portée par σοῦ ... αὐτῆς. « Transpercera » est idiomatique avec « épée », tandis que la note signale le sens plus littéral du verbe grec. Les marqueurs [a] et [b] suivent immédiatement l’expression concernée.
