- from: 'Quand les anges les eurent quittés pour retourner au ciel, les bergers se dirent les uns aux autres : « Allons donc jusqu’à Bethléem et voyons ce qui est arrivé[a], ce que le Seigneur nous a fait connaître. »'
  to: 'Lorsque les anges les eurent quittés pour le ciel, les bergers se dirent les uns aux autres : « Allons donc jusqu’à Bethléem et voyons ce fait qui s’est produit, que le Seigneur nous a fait connaître. »'
  rationale: La révision retire l’ajout interprétatif « retourner », améliore la référence de la relative finale et corrige la note afin qu’elle reflète exactement la polysémie de ῥῆμα et la valeur de γεγονός. L’ambiguïté concernant le référent de « le Seigneur » est préservée.
