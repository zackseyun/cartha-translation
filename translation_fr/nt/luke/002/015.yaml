source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ὡς ἀπῆλθον ἀπ’ αὐτῶν εἰς τὸν οὐρανὸν οἱ ἄγγελοι, ⸀οἱ ποιμένες ⸀ἐλάλουν πρὸς ἀλλήλους· Διέλθωμεν δὴ ἕως Βηθλέεμ καὶ ἴδωμεν τὸ ῥῆμα τοῦτο τὸ γεγονὸς ὃ ὁ κύριος ἐγνώρισεν ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/015.yaml
  text: And it happened that when the angels had gone away from them into heaven[a], the shepherds said to one another, “Let us go now to Bethlehem and see this thing that has happened[b], which the Lord has made known to us.”
translation:
  language: fr
  text: 'Lorsque les anges les eurent quittés pour le ciel, les bergers se dirent les uns aux autres : « Allons donc jusqu’à Bethléem et voyons ce fait qui s’est produit, que le Seigneur nous a fait connaître. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ ἐγένετο ὡς
  choice: Quand
  rationale: La formule narrative sémitisante introduit ici la circonstance temporelle. En français actuel, « Quand » en restitue naturellement la fonction sans lourdeur ni archaïsme.
- source_word: ἀπῆλθον ἀπ’ αὐτῶν εἰς τὸν οὐρανόν
  choice: les eurent quittés pour retourner au ciel
  rationale: Le passé antérieur marque l’action achevée avant la prise de parole des bergers. « Retourner au ciel » exprime idiomatiquement le mouvement d’éloignement vers le ciel, sans réduire οὐρανός au seul ciel visible.
- source_word: ἐλάλουν πρὸς ἀλλήλους
  choice: se dirent les uns aux autres
  rationale: Dans l’introduction d’un discours direct, cette formulation française rend naturellement l’imparfait grec sans imposer une durée particulière.
- source_word: Διέλθωμεν δὴ ἕως Βηθλέεμ
  choice: Allons donc jusqu’à Bethléem
  rationale: « Allons » rend le subjonctif d’exhortation, « donc » la force pragmatique de δὴ, et « jusqu’à » conserve la nuance de limite ou de destination portée par ἕως.
- source_word: τὸ ῥῆμα τοῦτο τὸ γεγονός
  choice: ce qui est arrivé
  rationale: Dans ce contexte, ῥῆμα désigne la réalité annoncée et accomplie. La tournure française est claire et naturelle tout en laissant une note signaler la polysémie du grec.
- source_word: ὃ ὁ κύριος ἐγνώρισεν ἡμῖν
  choice: ce que le Seigneur nous a fait connaître
  rationale: « A fait connaître » correspond étroitement à ἐγνώρισεν sans renforcer le verbe en « révéler ». « Le Seigneur » préserve la désignation grecque sans préciser davantage son référent.
theological_decisions:
- issue: Référent de ὁ κύριος
  choice: le Seigneur
  alternative: Dieu
  rationale: Le contexte présente Dieu comme la source de l’annonce angélique, mais le texte dit seulement « le Seigneur ». La traduction conserve cette formulation et sa résonance dans le récit lucanien sans imposer une identification plus étroite.
- issue: Portée de ῥῆμα
  choice: ce qui est arrivé
  alternative: cette parole qui s’est accomplie / cet événement
  rationale: Le mot peut désigner une parole, une affaire ou une chose. Ici, il renvoie à l’événement annoncé aux bergers; la formulation retenue communique ce sens tout en conservant l’ambiguïté lexicale dans une note.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe narrative grecque est allégée là où une reproduction littérale serait pesante, tandis que « jusqu’à Bethléem », « le Seigneur » et la note sur ῥῆμα préservent les nuances pertinentes du texte source.
