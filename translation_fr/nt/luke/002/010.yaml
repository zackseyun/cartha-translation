review_pass:
  verdict: revise
  source_fidelity: La relative ἥτις ἔσται se rapporte grammaticalement à χαρὰν μεγάλην (« une grande joie »), non à εὐαγγελίζομαι / « une bonne nouvelle ». Le texte proposé déplace donc l’antécédent et reformule la relation source de manière moins directe. La révision rétablit la syntaxe et le sens de la phrase grecque.
  naturalness: '« N’ayez pas peur » et « je vous annonce » sont naturels en français international moderne. « Car voici : » conserve de façon intelligible l’appel à l’attention de ἰδού, avec une ponctuation qui rend l’enchaînement plus lisible.'
  terminology: « L’ange », « une grande joie » et « tout le peuple » rendent correctement les termes grecs sans introduire de terminologie confessionnelle. La note propose « pour tous », alternative française plus directement parallèle à « for all people » que « pour tout le monde ».
  issues:
  - severity: medium
    issue: Antécédent du pronom relatif déplacé
    rationale: Dans le grec, ἥτις, féminin singulier, renvoie à χαρά (« joie »). Le brouillon fait de « une bonne nouvelle » l’antécédent de « qui sera une grande joie », ce qui ne correspond pas à la construction source.
  - severity: low
    issue: Alternative de note trop idiomatique et moins précise
    rationale: « Pour tout le monde » peut suggérer le monde entier ou une réception universelle. « Pour tous » représente plus directement l’alternative « for all people », tout en laissant l’ambiguïté interprétative ouverte.
  revised_text: 'Alors l’ange leur dit : « N’ayez pas peur, car voici : je vous annonce une grande joie qui sera pour tout le peuple[a]. »'
