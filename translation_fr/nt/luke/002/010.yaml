id: LUK.2.10
reference: Luke 2:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς ὁ ἄγγελος· Μὴ φοβεῖσθε, ἰδοὺ γὰρ εὐαγγελίζομαι ὑμῖν χαρὰν μεγάλην ἥτις ἔσται παντὶ τῷ λαῷ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/010.yaml
  text: And the angel said to them[a], “Do not be afraid, for behold, I bring you good news of great joy that will be for all the people,”
translation:
  language: fr
  text: 'Alors l’ange leur dit : « N’ayez pas peur, car voici : je vous annonce une grande joie qui sera pour tout le peuple[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour tous ». Le grec dit plus littéralement « pour tout le peuple » ; chez Luc, le contexte donne souvent à cette expression un sens défini.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ ἄγγελος
  choice: l’ange
  rationale: L’article renvoie naturellement à l’ange déjà présenté dans le contexte.
- source_word: Μὴ φοβεῖσθε
  choice: N’ayez pas peur
  rationale: Formulation idiomatique en français moderne, qui exprime clairement l’interdiction sans raideur archaïque.
- source_word: ἰδοὺ γὰρ
  choice: car voici
  rationale: « Car » conserve le lien explicatif de γάρ, tandis que « voici » garde la fonction solennelle d’appel à l’attention de ἰδού.
- source_word: εὐαγγελίζομαι ὑμῖν
  choice: je vous annonce une bonne nouvelle
  rationale: Rend explicitement l’annonce d’une nouvelle heureuse et intègre naturellement le datif ὑμῖν, sans imposer ici un terme religieux technique.
- source_word: χαρὰν μεγάλην
  choice: une grande joie
  rationale: Restitue directement l’intensité de l’expression grecque et produit une formulation naturelle en français.
- source_word: ἥτις ἔσται
  choice: qui sera
  rationale: Conserve le lien relatif avec la bonne nouvelle, comprise ici comme porteuse ou source de grande joie, tout en restant fluide en français.
- source_word: παντὶ τῷ λαῷ
  choice: pour tout le peuple
  rationale: Préserve l’article grec et la référence vraisemblablement définie à un peuple dans le contexte immédiat, sans élargir prématurément le sens à toute l’humanité.
theological_decisions:
- issue: Portée de παντὶ τῷ λαῷ
  choice: pour tout le peuple
  alternative: pour tous les peuples / pour tout le monde
  rationale: L’article avec λαός favorise ici la lecture d’un peuple déterminé, vraisemblablement Israël dans la scène immédiate. La traduction conserve cette tension sans nier l’ouverture ultérieure de Luc aux nations.
translation_notes:
  register: Français international moderne, digne et accessible. « N’ayez pas peur » est naturel à l’oral comme à l’écrit ; « car voici » maintient la solennité narrative sans employer l’archaïque « voici que ». La structure a été légèrement ajustée afin d’éviter que le relatif français ne fasse maladroitement de la joie, plutôt que de la bonne nouvelle, l’antécédent grammatical.
