id: LUK.2.17
reference: Luke 2:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἰδόντες δὲ ⸀ἐγνώρισαν περὶ τοῦ ῥήματος τοῦ λαληθέντος αὐτοῖς περὶ τοῦ παιδίου τούτου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/017.yaml
  text: And when they saw it[a], they made known the message that had been spoken to them about this child.
translation:
  language: fr
  text: Après l’avoir vu, ils firent connaître ce qui leur avait été dit[a] au sujet de cet enfant.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « la parole »; on pourrait aussi traduire « le message qui leur avait été adressé ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: Après l’avoir vu
  rationale: Le participe aoriste exprime ici une action antérieure au verbe principal. Le pronom « l’ » est nécessaire en français naturel et renvoie, dans le contexte immédiat, à l’enfant.
- source_word: δὲ
  choice: ils
  rationale: La particule δέ marque une légère progression du récit. En français, l’enchaînement est suffisamment rendu par la nouvelle proposition, sans connecteur explicite qui alourdirait la phrase.
- source_word: ἐγνώρισαν
  choice: ils firent connaître
  rationale: 'Cette formulation conserve le sens causatif de γνωρίζω : rendre une information connue, sans suggérer nécessairement une proclamation officielle.'
- source_word: περὶ τοῦ ῥήματος
  choice: ce qui leur avait été dit
  rationale: Dans ce contexte, ῥῆμα désigne le contenu des paroles adressées aux bergers. Cette tournure est naturelle en français et maintient le lien avec l’acte de parler exprimé par λαληθέντος.
- source_word: τοῦ λαληθέντος αὐτοῖς
  choice: qui leur avait été dit
  rationale: Le plus-que-parfait rend l’antériorité de la parole reçue par rapport au récit qu’en font les bergers, tout en conservant la forme passive.
- source_word: περὶ τοῦ παιδίου τούτου
  choice: au sujet de cet enfant
  rationale: « Enfant » rend naturellement παιδίον dans ce contexte, et « au sujet de » restitue avec précision la relation exprimée par περί.
theological_decisions:
- issue: Sens de ῥῆμα dans l’annonce concernant l’enfant
  choice: ce qui leur avait été dit
  alternative: le message / la parole
  rationale: La formulation choisie exprime clairement le contenu communiqué aux bergers sans charger « parole » d’une nuance théologique absente du contexte. Une note conserve les principales possibilités lexicales.
translation_notes:
  register: Français moderne, fluide et digne. Le passé simple convient au registre narratif biblique sans être archaïque; le plus-que-parfait marque clairement l’antériorité de l’annonce reçue.
