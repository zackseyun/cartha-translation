  source_fidelity: 'Le texte rend correctement la structure : le participe aoriste ἰδόντες est exprimé par « Après l’avoir vu », puis ἐγνώρισαν par « ils firent connaître ». « Ce qui leur avait été dit au sujet de cet enfant » transmet fidèlement le contenu de περὶ τοῦ ῥήματος τοῦ λαληθέντος αὐτοῖς περὶ τοῦ παιδίου τούτου, sans ajouter d’interprétation. L’objet implicite de « l’avoir vu » est naturellement identifiable dans le contexte comme l’enfant.'
  naturalness: La phrase est fluide et idiomatique en français international moderne. Le passé simple convient au récit biblique soutenu, et le plus-que-parfait exprime clairement l’antériorité de l’annonce. L’omission explicite de δέ est naturelle en français et ne supprime aucune opposition importante.
