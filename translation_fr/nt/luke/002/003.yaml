  text: καὶ ἐπορεύοντο πάντες ἀπογράφεσθαι, ἕκαστος εἰς τὴν ⸀ἑαυτοῦ πόλιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/003.yaml
  text: And everyone was going to be registered[b][a], each to his own city.
translation:
  language: fr
  text: Et tous allaient se faire recenser[a], chacun dans sa propre ville.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : se faire inscrire sur les registres.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπορεύοντο
  choice: allaient
  rationale: L’imparfait grec présente le déplacement comme un processus en cours. L’imparfait français « allaient » en conserve naturellement l’aspect narratif.
- source_word: πάντες
  choice: tous
  rationale: « Tous » correspond directement au pluriel grec et désigne ici l’ensemble des personnes concernées.
- source_word: ἀπογράφεσθαι
  choice: se faire recenser
  rationale: Dans le contexte du recensement, l’infinitif désigne l’inscription officielle. « Se faire recenser » est clair et idiomatique en français moderne, tout en laissant en note l’équivalent plus littéral lié aux registres.
- source_word: ἕκαστος
  choice: chacun
  rationale: Le distributif singulier « chacun » souligne que chaque personne se rend individuellement au lieu qui lui correspond.
- source_word: ἑαυτοῦ
  choice: propre
  rationale: Associé à « sa ville », « propre » rend la valeur réfléchie de ἑαυτοῦ sans lourdeur. Le français conserve ainsi la construction distributive au singulier.
- source_word: πόλιν
  choice: ville
  rationale: « Ville » est l’équivalent direct et courant de πόλις. « Ville d’origine » ou « ville de ses ancêtres » ajouterait une précision absente de ce verset.
theological_decisions:
- issue: Expression distributive singulière ἕκαστος…ἑαυτοῦ
  choice: « chacun dans sa propre ville »
  alternative: « chacun dans leur propre ville » ou « chacun dans sa ville d’origine »
  rationale: Le français idiomatique emploie « chacun » avec un possessif singulier. La forme « sa » s’accorde grammaticalement avec « ville » et ne permet pas de reproduire explicitement le masculin grec sans rendre la phrase artificielle. « Ville d’origine » interpréterait davantage que le texte.
translation_notes:
  register: Français moderne, courant et digne. La phrase conserve l’imparfait narratif, le mouvement de chaque personne vers sa ville et la portée administrative de l’inscription.
