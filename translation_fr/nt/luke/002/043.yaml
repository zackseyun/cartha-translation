- from: Quand les jours de la fête furent achevés, ils reprirent le chemin du retour, mais le jeune Jésus resta à Jérusalem[a], et ses parents[b] ne s’en aperçurent pas.
  to: Lorsque les jours furent achevés, alors qu’ils s’en retournaient, Jésus, l’enfant, resta[a] à Jérusalem, et ses parents[b] ne le savaient pas.
  rationale: La révision retire les ajouts non nécessaires, conserve l’ordre et la simultanéité du récit grec, rend explicitement l’apposition ὁ παῖς par « l’enfant », et replace l’ancre de variante sur le mot concerné. Elle préserve l’ambiguïté et le langage familial du texte source.
