source:
  edition: SBLGNT
  text: καὶ τελειωσάντων τὰς ἡμέρας, ἐν τῷ ὑποστρέφειν αὐτοὺς ὑπέμεινεν Ἰησοῦς ὁ παῖς ἐν Ἰερουσαλήμ, καὶ οὐκ ⸂ἔγνωσαν οἱ γονεῖς⸃ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/043.yaml
  text: And when they had completed the days[a], as they were returning, Jesus the boy remained in Jerusalem[b], and his parents did not know it.
translation:
  language: fr
  text: Lorsque les jours furent achevés, alors qu’ils s’en retournaient, Jésus, l’enfant, resta[a] à Jérusalem, et ses parents[b] ne le savaient pas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « resta en arrière ».'
    reason: lexical_alternative
  - marker: b
    text: Le grec dit « ses parents ». Le langage familial ordinaire employé ici par Luc ne nie pas la conception virginale racontée plus haut dans l’Évangile.
    reason: cross_reference
lexical_decisions:
- source_word: τελειωσάντων τὰς ἡμέρας
  choice: Quand les jours de la fête furent achevés
  rationale: Le génitif absolu présente l’achèvement des jours comme une circonstance antérieure. « Les jours de la fête » rend explicite, sans surinterprétation, le référent immédiatement fourni par le contexte de la Pâque.
- source_word: ἐν τῷ ὑποστρέφειν αὐτοὺς
  choice: ils reprirent le chemin du retour
  rationale: La tournure française exprime naturellement leur retour en cours. La coordination avec « mais » rend clairement le contraste narratif avec le fait que Jésus demeure à Jérusalem.
- source_word: ὑπέμεινεν
  choice: resta
  rationale: Dans ce contexte, ὑπομένω signifie demeurer sur place ou rester en arrière. « Resta » est naturel et fidèle; la nuance « resta en arrière » est signalée en note.
- source_word: ὁ παῖς
  choice: le jeune Jésus
  rationale: παῖς désigne ici Jésus à l’âge de douze ans. « Le jeune Jésus » est plus naturel en français moderne que « Jésus, le garçon », tout en conservant l’indication de jeunesse.
- source_word: ἐν Ἰερουσαλήμ
  choice: à Jérusalem
  rationale: Avec un nom de ville, le français emploie naturellement « à » pour rendre la valeur locative de ἐν.
- source_word: οὐκ ἔγνωσαν
  choice: ne s’en aperçurent pas
  rationale: Dans le contexte, γινώσκω exprime le fait de prendre conscience d’une situation. Cette formulation idiomatique indique que les parents ignoraient que Jésus était resté à Jérusalem.
- source_word: οἱ γονεῖς αὐτοῦ
  choice: ses parents
  rationale: γονεῖς signifie directement « parents ». Cette traduction conserve le langage familial ordinaire employé par Luc.
theological_decisions:
- issue: La désignation de Marie et Joseph comme les γονεῖς de Jésus
  choice: ses parents
  alternative: son père et sa mère
  rationale: Le grec dit explicitement « ses parents ». Cette formulation doit être conservée sans harmonisation; elle relève du langage familial ordinaire du récit et n’annule pas le récit antérieur de la conception virginale.
translation_notes:
  register: Français international moderne, narratif et digne. La phrase privilégie une syntaxe fluide tout en conservant la succession des actions et le contraste entre le départ du groupe et le séjour de Jésus à Jérusalem.
