id: LUK.2.49
reference: Luke 2:49
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ εἶπεν πρὸς αὐτούς· Τί ὅτι ἐζητεῖτέ με; οὐκ ᾔδειτε ὅτι ἐν τοῖς τοῦ πατρός μου δεῖ εἶναί με;
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/049.yaml
  text: And he said to them[a], “Why were you looking for me? Did you not know that I must be in my Father’s house?”
translation:
  language: fr
  text: 'Il leur dit : « Pourquoi me cherchiez-vous ? Ne saviez-vous pas que je dois être chez mon Père[a] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « m’occuper des affaires de mon Père » ; plus littéralement : « être dans les choses de mon Père ». L’expression grecque est elliptique et peut désigner soit le lieu appartenant au Père, soit ce qui concerne le Père.'
    reason: alternative_reading
lexical_decisions:
- source_word: Τί ὅτι
  choice: Pourquoi
  rationale: Cette tournure demande la raison ou la cause. « Pourquoi » est naturel en français et conserve pleinement la force interrogative.
- source_word: ἐζητεῖτέ
  choice: me cherchiez-vous
  rationale: Dans le contexte des recherches menées par ses parents, « chercher » est l’équivalent français le plus naturel de ζητέω. L’imparfait rend ici l’action en cours dans le passé.
- source_word: οὐκ ᾔδειτε
  choice: Ne saviez-vous pas
  rationale: Cette formulation directe conserve la question rhétorique et le sens ordinaire de connaissance ou de conscience porté par οἶδα.
- source_word: ἐν τοῖς τοῦ πατρός μου
  choice: chez mon Père
  rationale: L’expression grecque est elliptique, littéralement « dans les [choses] de mon Père ». Dans le contexte immédiat du temple, « chez mon Père » exprime naturellement le lieu sans ajouter le nom « maison », absent du grec. L’autre sens possible, relatif aux affaires du Père, est conservé en note.
- source_word: δεῖ
  choice: je dois
  rationale: « Je dois » rend avec concision la nécessité exprimée par δεῖ, laquelle peut avoir chez Luc une portée divine.
- source_word: εἶναί με
  choice: être
  rationale: Après δεῖ, l’infinitif et son sujet à l’accusatif se rendent naturellement par « je dois être » ; le complément elliptique détermine la nuance contextuelle.
- source_word: πατρός μου
  choice: mon Père
  rationale: La majuscule indique que Jésus parle de Dieu comme de son Père dans le contexte du temple, sans développer davantage l’interprétation dans le corps du texte.
theological_decisions:
- issue: Ambiguïté de l’expression elliptique ἐν τοῖς τοῦ πατρός μου
  choice: « chez mon Père » dans le texte principal
  alternative: « aux affaires de mon Père » ou, plus littéralement, « dans les choses de mon Père »
  rationale: Le cadre du temple favorise une lecture locale, mais le grec peut aussi désigner ce qui concerne le Père. La note préserve cette ambiguïté réelle au lieu de la résoudre silencieusement.
- issue: Référent de « mon Père »
  choice: Dieu, désigné par « mon Père » avec une majuscule
  alternative: Lecture comme référence à Joseph
  rationale: Le contraste narratif avec les parents de Jésus et le cadre du temple indiquent que Jésus parle de Dieu. La traduction maintient cette affirmation filiale sans y ajouter d’explication doctrinale.
translation_notes:
  register: Français international moderne, naturel et digne. L’inversion « me cherchiez-vous » convient à une parole directe de registre soutenu mais accessible. « Chez mon Père » évite d’introduire explicitement « maison », tout en restant idiomatique et contextuellement clair.
