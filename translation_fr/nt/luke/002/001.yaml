reference: Luke 2:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἐγένετο δὲ ἐν ταῖς ἡμέραις ἐκείναις ἐξῆλθεν δόγμα παρὰ Καίσαρος Αὐγούστου ἀπογράφεσθαι πᾶσαν τὴν οἰκουμένην·
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/001.yaml
  text: It happened in those days that a decree went out from Caesar Augustus that all the inhabited world should be registered[a].
translation:
  language: fr
  text: En ces jours-là, il arriva qu’un décret fut promulgué par César Auguste, ordonnant que toute la terre habitée soit enregistrée[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le monde romain tout entier » ou « l’Empire tout entier ». Le terme grec désigne souvent la terre habitée telle qu’on la concevait dans le contexte de l’Empire romain.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: En ces jours-là, … fut promulgué
  rationale: La formule narrative et la particule de transition introduisent l’événement. Une traduction littérale comme « Il arriva » serait possible, mais alourdirait le français moderne; la progression narrative est naturellement portée par l’ouverture temporelle et le verbe principal.
- source_word: ἐν ταῖς ἡμέραις ἐκείναις
  choice: En ces jours-là
  rationale: Expression temporelle française courante, proche de la structure et du registre du grec.
- source_word: ἐξῆλθεν δόγμα
  choice: un décret … fut promulgué
  rationale: Le grec dit littéralement qu’un décret « sortit ». « Fut promulgué » exprime naturellement en français la publication officielle d’un ordre, sans perdre sa provenance impériale.
- source_word: παρὰ Καίσαρος Αὐγούστου
  choice: de César Auguste
  rationale: Le génitif avec παρά indique ici la source du décret; « de César Auguste » conserve cette relation de provenance de manière idiomatique.
- source_word: ἀπογράφεσθαι
  choice: soit enregistrée
  rationale: Le verbe désigne une inscription officielle, souvent liée à un recensement ou à la fiscalité. « Être enregistrée » évite d’introduire une précision qui n’est pas explicitement formulée dans ce verset.
- source_word: πᾶσαν τὴν οἰκουμένην
  choice: toute la terre habitée
  rationale: Cette formulation conserve le sens propre de οἰκουμένη tout en laissant ouverte sa portée contextuelle, qui peut viser le monde conçu dans le cadre de l’Empire romain.
theological_decisions:
- issue: Portée de οἰκουμένη
  choice: toute la terre habitée
  alternative: tout le monde romain; tout l’Empire
  rationale: Il s’agit surtout d’une question historique et lexicale. Le texte principal préserve le sens ordinaire du grec sans identifier explicitement son étendue à l’Empire romain; la note présente les lectures contextuelles possibles.
translation_notes:
  register: Français international moderne, clair et digne. « Fut promulgué » convient au contexte officiel sans archaïsme. La subordonnée participiale implicite du grec est rendue par « ordonnant que », ce qui clarifie le rapport entre le décret et l’enregistrement sans transformer celui-ci en « recensement » explicite.
