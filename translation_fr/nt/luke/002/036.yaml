  text: Καὶ ἦν Ἅννα προφῆτις, θυγάτηρ Φανουήλ, ἐκ φυλῆς Ἀσήρ (αὕτη προβεβηκυῖα ἐν ἡμέραις πολλαῖς, ζήσασα ⸂μετὰ ἀνδρὸς ἔτη⸃ ἑπτὰ ἀπὸ τῆς παρθενίας αὐτῆς,
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/036.yaml
  text: And there was a prophetess[a], Anna, the daughter of Phanuel, from the tribe of Asher. She was advanced in years, having lived with her husband seven years from her virginity[b],
translation:
  language: fr
  text: Il y avait aussi une prophétesse, Anne, fille de Phanuel, de la tribu d’Aser. Elle était très avancée en âge[a], ayant vécu avec son mari pendant sept ans après son mariage[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « avancée en beaucoup de jours », expression signifiant qu’elle était très âgée.'
    reason: idiome_source
  - marker: b
    text: 'Littéralement : « depuis sa virginité ». L’expression situe ces sept années à partir de son mariage, compris comme le moment où elle quittait l’état de jeune fille.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προφῆτις
  choice: prophétesse
  rationale: Le nom grec est explicitement féminin et désigne une femme reconnue comme prophète. « Prophétesse » est le terme français courant et précis.
- source_word: θυγάτηρ Φανουήλ
  choice: fille de Phanuel
  rationale: Cette formulation rend directement l’expression généalogique grecque et s’insère naturellement en apposition après le nom d’Anne.
- source_word: ἐκ φυλῆς Ἀσήρ
  choice: de la tribu d’Aser
  rationale: ἐκ indique ici l’origine ou l’appartenance; cette tournure française exprime naturellement l’affiliation tribale.
- source_word: προβεβηκυῖα ἐν ἡμέραις πολλαῖς
  choice: très avancée en âge
  rationale: L’expression grecque signifie littéralement « avancée en beaucoup de jours », idiome désignant un âge avancé. Le français naturel demande « très avancée en âge », tandis que la note conserve l’image littérale.
- source_word: ζήσασα μετὰ ἀνδρὸς ἔτη ἑπτὰ
  choice: avait vécu sept ans avec son mari
  rationale: Dans ce contexte, ἀνήρ désigne le mari et l’expression évoque la durée de la vie conjugale, non une simple cohabitation.
- source_word: ἀπὸ τῆς παρθενίας αὐτῆς
  choice: depuis la fin de sa virginité
  rationale: ἀπό marque le point de départ du décompte, et παρθενία désigne l’état de virginité ou de jeune fille. L’ajout de « la fin de » rend en français le passage implicite de cet état au mariage sans préciser davantage la chronologie.
theological_decisions:
- issue: Rôle d’Anne comme προφῆτις
  choice: Anne est explicitement appelée « prophétesse ».
  alternative: Affaiblir le terme en « femme pieuse » ou en simple titre honorifique.
  rationale: Le grec emploie le nom féminin ordinaire correspondant à « prophète »; rien dans le texte ne justifie d’en réduire la portée.
- issue: Description de l’âge d’Anne
  choice: Rendre l’idiome par « très avancée en âge » et signaler sa forme littérale en note.
  alternative: Conserver dans le corps du texte le calque « avancée en beaucoup de jours ».
  rationale: Le calque serait peu naturel en français et risquerait d’obscurcir le sens, tandis que la traduction retenue communique fidèlement l’idiome sans anticiper les précisions du verset suivant.
- issue: Point de départ des sept années de vie conjugale
  choice: Conserver l’idée que les sept années sont comptées à partir de la fin de la virginité, comprise contextuellement comme l’entrée dans le mariage.
  alternative: Traduire simplement « sept ans après son mariage » ou laisser le calque ambigu « depuis sa virginité ».
  rationale: La formulation retenue garde le terme grec « virginité » et son point de départ tout en restant intelligible; la note indique l’interprétation contextuelle sans importer un calcul d’âge.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase suit le mouvement narratif grec tout en employant des idiomes français naturels. « Anne » et « Aser » suivent les formes bibliques françaises usuelles. La virgule finale indique que la phrase se poursuit au verset suivant.
