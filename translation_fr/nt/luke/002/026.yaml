id: LUK.2.26
reference: Luke 2:26
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἦν αὐτῷ κεχρηματισμένον ὑπὸ τοῦ πνεύματος τοῦ ἁγίου μὴ ἰδεῖν θάνατον πρὶν ⸂ἢ ἂν⸃ ἴδῃ τὸν χριστὸν κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/026.yaml
  text: And it had been revealed to him by the Holy Spirit that he would not see death before he had seen the Lord’s Messiah[a].
translation:
  language: fr
  text: Et il lui avait été révélé par l’Esprit Saint qu’il ne verrait pas la mort avant d’avoir vu le Messie du Seigneur[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, selon la formulation traditionnelle : « le Christ du Seigneur ».'
    reason: alternative_reading
lexical_decisions:
- source_word: κεχρηματισμένον
  choice: avait été révélé
  rationale: Le passif de χρηματίζω désigne ici une communication divine. « Avait été révélé » est naturel en français et convient à l’agent explicitement nommé, l’Esprit Saint.
- source_word: ὑπὸ τοῦ πνεύματος τοῦ ἁγίου
  choice: par l’Esprit Saint
  rationale: Ὑπό avec le génitif indique l’agent personnel. « Par l’Esprit Saint » reflète directement cette construction.
- source_word: μὴ ἰδεῖν θάνατον
  choice: qu’il ne verrait pas la mort
  rationale: Cette formulation conserve l’image littérale de « voir la mort », compréhensible en français, plutôt que de la réduire à « qu’il ne mourrait pas ».
- source_word: πρὶν ἢ ἂν ἴδῃ
  choice: avant d’avoir vu
  rationale: La tournure française exprime clairement que la vision du Messie devait précéder la mort de Siméon, tout en respectant la relation temporelle du grec.
- source_word: τὸν χριστὸν κυρίου
  choice: le Messie du Seigneur
  rationale: Χριστός fonctionne ici comme un titre messianique. « Le Messie du Seigneur » est clair, digne et proche de la construction grecque au génitif, sans trancher plus précisément entre appartenance, désignation et envoi.
- source_word: κυρίου
  choice: du Seigneur
  rationale: Le génitif κυρίου est rendu sobrement par « du Seigneur », formulation naturelle qui préserve la relation générale exprimée par le grec.
theological_decisions:
- issue: Traduction de Χριστός comme titre messianique
  choice: Messie
  alternative: Christ
  rationale: Dans τὸν χριστὸν κυρίου, Χριστός est un titre. « Messie » rend explicitement sa valeur d’oint attendu; la traduction traditionnelle « Christ » est signalée en note.
- issue: Relation exprimée par le génitif dans τὸν χριστὸν κυρίου
  choice: du Seigneur
  alternative: le Messie qui appartient au Seigneur / le Messie envoyé par le Seigneur
  rationale: Le génitif grec ne précise pas à lui seul toute la nature de la relation. « Du Seigneur » conserve cette relative ouverture au lieu d’imposer une seule interprétation.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe reste proche du grec tout en étant idiomatique; l’image « voir la mort » et l’ambiguïté relative du génitif sont conservées.
