id: LUK.2.8
reference: Luke 2:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ ποιμένες ἦσαν ἐν τῇ χώρᾳ τῇ αὐτῇ ἀγραυλοῦντες καὶ φυλάσσοντες φυλακὰς τῆς νυκτὸς ἐπὶ τὴν ποίμνην αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/008.yaml
  text: And there were shepherds in that same region[b][a], staying out in the fields and keeping watch over their flock by night.
translation:
  language: fr
  text: Il y avait, dans cette même région, des bergers qui passaient la nuit en plein air[a] et montaient la garde auprès de leur troupeau pendant les veilles de la nuit[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qui séjournaient dans les champs ». Le verbe grec souligne qu’ils passaient la nuit dehors, en plein air.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « gardaient les veilles de la nuit sur leur troupeau », ce qui peut évoquer des tours de garde nocturnes.
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιμένες
  choice: bergers
  rationale: Le nom désigne normalement des gardiens de moutons; « bergers » est précis, courant et naturel en français.
- source_word: ἐν τῇ χώρᾳ τῇ αὐτῇ
  choice: dans cette même région
  rationale: χώρα désigne ici la région ou les environs déjà évoqués; cette formulation conserve la reprise narrative sans élargir le sens à un pays entier.
- source_word: ἀγραυλοῦντες
  choice: qui passaient la nuit en plein air
  rationale: Le verbe indique que les bergers séjournaient dehors, dans les champs, durant la nuit. La formulation rend explicitement cette nuance temporelle et spatiale.
- source_word: φυλάσσοντες φυλακὰς τῆς νυκτὸς
  choice: montaient la garde ... pendant les veilles de la nuit
  rationale: La construction apparentée φυλάσσοντες φυλακάς évoque l'accomplissement des périodes de garde nocturne, vraisemblablement à tour de rôle; « veilles » préserve cette particularité du grec.
- source_word: ἐπὶ τὴν ποίμνην αὐτῶν
  choice: auprès de leur troupeau
  rationale: Avec « monter la garde », « auprès de » exprime naturellement la surveillance exercée sur le troupeau sans suggérer une position physique au-dessus de lui.
- source_word: Καὶ ... ἦσαν
  choice: Il y avait
  rationale: L'expression introduit naturellement la nouvelle scène en français. La continuité portée par καί est suffisamment assurée par le contexte immédiat, tandis qu'un « et » initial serait moins fluide ici.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. « Passaient la nuit en plein air » évite l’ambiguïté possible de « vivaient dehors », tandis que « les veilles de la nuit » conserve une tournure biblique intelligible et la nuance des périodes de garde.
