id: LUK.2.25
reference: Luke 2:25
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ ἰδοὺ ⸂ἄνθρωπος ἦν⸃ ἐν Ἰερουσαλὴμ ᾧ ὄνομα Συμεών, καὶ ὁ ἄνθρωπος οὗτος δίκαιος καὶ εὐλαβής, προσδεχόμενος παράκλησιν τοῦ Ἰσραήλ, καὶ πνεῦμα ἦν ἅγιον ἐπ’ αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/025.yaml
  text: And behold[a], there was a man in Jerusalem whose name was Simeon, and this man was righteous and devout, waiting for the consolation of Israel[b], and the Holy Spirit was upon him.
translation:
  language: fr
  text: Or voici qu’il y avait à Jérusalem un homme du nom de Siméon. Cet homme était juste et pieux. Il attendait la consolation d’Israël[a], et l’Esprit saint reposait sur lui[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le réconfort d’Israël ». L’expression désigne le réconfort et le relèvement qu’Israël espérait recevoir de Dieu.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement, la construction grecque peut aussi se comprendre : « un esprit saint était sur lui »; dans le contexte de Luc, elle désigne très probablement l’Esprit saint.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδοὺ
  choice: voici
  rationale: « Voici » conserve la fonction du marqueur discursif grec, qui attire l’attention sur l’entrée en scène de Siméon, tout en restant naturel dans un récit biblique moderne.
- source_word: ἄνθρωπος
  choice: un homme
  rationale: Le mot désigne ici un individu de sexe masculin, identifié comme Siméon.
- source_word: ᾧ ὄνομα Συμεών
  choice: du nom de Siméon
  rationale: Cette tournure française idiomatique conserve la fonction d’identification de la construction grecque sans en reproduire la syntaxe de façon pesante.
- source_word: δίκαιος
  choice: juste
  rationale: « Juste » exprime la droiture morale et la fidélité à Dieu qui caractérisent Siméon, avec la résonance biblique habituelle du terme.
- source_word: εὐλαβής
  choice: pieux
  rationale: « Pieux » rend de façon concise et naturelle l’attitude de révérence envers Dieu et le soin porté à une conduite religieuse fidèle.
- source_word: προσδεχόμενος
  choice: attendait
  rationale: L’imparfait français traduit l’attente continue et confiante exprimée par le participe présent grec.
- source_word: παράκλησιν τοῦ Ἰσραήλ
  choice: la consolation d’Israël
  rationale: « Consolation » préserve la richesse de l’espérance biblique d’un réconfort et d’un relèvement accordés par Dieu à Israël.
- source_word: πνεῦμα ἅγιον
  choice: l’Esprit saint
  rationale: Dans le contexte immédiat de Luc 2.26-27 et dans l’usage de Luc-Actes, l’expression désigne le plus naturellement l’Esprit saint, malgré l’absence d’article en grec.
- source_word: ἐπ’ αὐτόν
  choice: reposait sur lui
  rationale: Cette formulation française naturelle conserve l’image biblique de la présence de l’Esprit sur une personne, sans préciser davantage la nature de son action.
theological_decisions:
- issue: Référent de πνεῦμα ἦν ἅγιον ἐπ’ αὐτόν
  choice: l’Esprit saint reposait sur lui
  alternative: un esprit saint était sur lui
  rationale: L’absence d’article permet formellement une lecture indéfinie, mais le contexte immédiat, où l’Esprit révèle puis conduit Siméon, favorise nettement la référence à l’Esprit saint. La note conserve l’ambiguïté grammaticale sans affaiblir la lecture contextuellement la plus probable.
- issue: Portée de παράκλησις appliqué à Israël
  choice: la consolation d’Israël
  alternative: le réconfort d’Israël
  rationale: Le terme évoque non seulement un soulagement affectif, mais aussi l’intervention divine attendue pour consoler et relever Israël; « consolation » maintient cette ampleur sans définir plus précisément la forme de cette restauration.
translation_notes:
  register: Français international moderne, digne et accessible. « Or voici » garde le relief narratif de καὶ ἰδοὺ sans employer l’archaïque « et voici ». Les deux propositions descriptives sont séparées en phrases courtes pour une lecture naturelle. La capitalisation de « Esprit » signale le référent personnel retenu, tandis que la graphie française courante garde l’adjectif « saint » en minuscule.
