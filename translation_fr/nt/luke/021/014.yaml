  text: ⸀θέτε οὖν ⸂ἐν ταῖς καρδίαις⸃ ὑμῶν μὴ προμελετᾶν ἀπολογηθῆναι,
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/014.yaml
  text: Therefore[a], settle it in your hearts not to prepare beforehand to defend yourselves[b],
translation:
  language: fr
  text: Décidez donc dans votre cœur de ne pas préparer d’avance votre défense[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « de ne pas répéter d’avance comment vous défendre ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: θέτε
  choice: Décidez
  rationale: L’impératif de τίθημι, associé à « dans votre cœur », exprime ici une décision intérieure ferme. « Décidez » restitue naturellement cette valeur idiomatique en français moderne.
- source_word: οὖν
  choice: donc
  rationale: Le connecteur introduit la conséquence pratique de ce qui précède. « Donc » marque clairement cette relation sans alourdir la phrase.
- source_word: ἐν ταῖς καρδίαις ὑμῶν
  choice: dans votre cœur
  rationale: Le grec emploie le pluriel « dans vos cœurs », mais le singulier distributif est plus naturel en français lorsqu’un groupe est exhorté à prendre chacun une résolution intérieure. L’image biblique du cœur comme siège de la volonté est conservée.
- source_word: μὴ προμελετᾶν
  choice: de ne pas préparer d’avance
  rationale: Le verbe désigne le fait de réfléchir, de préparer ou de répéter à l’avance. Cette formulation française est claire et conserve l’idée d’anticipation.
- source_word: ἀπολογηθῆναι
  choice: votre défense
  rationale: Le verbe renvoie à l’action de présenter une défense, notamment dans un cadre judiciaire ou officiel. Le nom « défense » produit ici une formulation française concise et naturelle.
theological_decisions:
- issue: Portée de l’interdiction de préparer une défense
  choice: Conserver la formulation directe sans préciser si elle vise toute préparation ou la répétition anticipée d’un plaidoyer dans cette situation particulière.
  alternative: Traduire « ne pas répéter d’avance comment vous défendre » afin de restreindre explicitement l’interdiction à la formulation préalable du plaidoyer.
  rationale: Le verbe προμελετάω peut évoquer aussi bien la préparation que la répétition préalable. La traduction principale préserve cette largeur de sens au lieu de trancher une question d’application théologique ou pratique.
translation_notes:
  register: 'Français moderne, direct et digne. Le singulier distributif « votre cœur » évite le tour plus lourd « dans vos cœurs » tout en conservant l’image du texte grec. La phrase reste volontairement ouverte quant à la nuance exacte de προμελετᾶν : préparation mentale ou répétition anticipée.'
