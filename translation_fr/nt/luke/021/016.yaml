id: LUK.21.16
reference: Luke 21:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: παραδοθήσεσθε δὲ καὶ ὑπὸ γονέων καὶ ⸂ἀδελφῶν καὶ συγγενῶν καὶ φίλων⸃, καὶ θανατώσουσιν ἐξ ὑμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/016.yaml
  text: But you will be handed over even by parents and brothers and relatives and friends[a], and they will put some of you to death.
translation:
  language: fr
  text: Mais vous serez même livrés par vos parents, vos frères, des membres de votre famille et vos amis[a], et ils mettront à mort certains d’entre vous.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « vos frères et sœurs » : le pluriel masculin grec peut parfois désigner un groupe comprenant des frères et des sœurs.'
    reason: Alternative lexicale préservant la portée possible de ἀδελφῶν.
lexical_decisions:
- source_word: παραδοθήσεσθε
  choice: vous serez livrés
  rationale: Le futur passif de παραδίδωμι désigne ici le fait d’être remis à des autorités ou à des adversaires. « Livrés » est naturel et conserve la portée fondamentale du verbe sans imposer explicitement la nuance plus interprétative de « trahis ».
- source_word: δὲ
  choice: Mais
  rationale: δέ marque une transition légèrement contrastive avec l’assurance du contexte précédent ; « Mais » rend clairement ce tournant sans le durcir.
- source_word: καὶ
  choice: même
  rationale: 'Le premier καί après δέ a ici une valeur intensive : jusque dans le cercle familial et amical, certains livreront les disciples.'
- source_word: ὑπὸ
  choice: par
  rationale: Avec le passif, ὑπό introduit les agents personnels de l’action.
- source_word: γονέων
  choice: parents
  rationale: γονεῖς désigne collectivement le père et la mère ; « parents » est l’équivalent français courant et inclusif.
- source_word: ἀδελφῶν
  choice: frères
  rationale: Le masculin pluriel grec est conservé dans le texte principal. Dans cette liste de liens familiaux, il peut toutefois englober les sœurs ; cette possibilité est signalée en note.
- source_word: συγγενῶν
  choice: proches
  rationale: συγγενεῖς désigne les membres de la parenté. « Proches » est naturel dans cette énumération, tout en gardant l’idée du cercle familial élargi ; « membres de votre famille » serait plus explicite mais plus lourd.
- source_word: φίλων
  choice: amis
  rationale: Équivalent direct et naturel de φίλοι dans ce contexte.
- source_word: θανατώσουσιν
  choice: ils feront mourir
  rationale: θανατόω signifie causer la mort ou mettre à mort. « Feront mourir » conserve la gravité et le caractère délibéré de l’acte, sans préciser indûment son mode.
- source_word: ἐξ ὑμῶν
  choice: certains d’entre vous
  rationale: L’expression partitive signifie naturellement qu’une partie des disciples, et non leur totalité, sera mise à mort.
theological_decisions:
- issue: Portée de ἀδελφῶν dans une liste de liens familiaux
  choice: frères
  alternative: frères et sœurs
  rationale: Le texte principal respecte la forme masculine du grec sans exclure la possibilité représentative courante du pluriel, laquelle est conservée dans une note afin de ne pas résoudre silencieusement l’ambiguïté.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase suit l’ordre et l’accumulation du grec, tout en employant des formulations idiomatiques. La répétition de « vos » est limitée pour éviter une lourdeur inutile, sans obscurcir que chaque groupe appartient au cercle relationnel des disciples.
