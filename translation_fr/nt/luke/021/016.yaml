review_pass:
  verdict: revise
  source_fidelity: « Vous serez livrés ... par » rend fidèlement le futur passif παραδοθήσεσθε avec ὑπό, et « certains d’entre vous » restitue bien le partitif ἐξ ὑμῶν. En revanche, « proches » peut désigner des personnes intimement liées sans lien de parenté et recouvre donc insuffisamment συγγενῶν. « Ils feront mourir » est possible, mais moins direct et moins idiomatique ici que « ils mettront à mort », qui traduit exactement θανατώσουσιν sans préciser le mode de mise à mort.
  naturalness: La construction et le registre sont globalement naturels. « Membres de votre famille » est plus précis que « proches » tout en restant accessible. « Ils mettront à mort certains d’entre vous » est une formulation française biblique moderne, claire et grave.
  terminology: « Parents », « frères », « amis » et « livrés » sont appropriés. La note conserve légitimement la possibilité que ἀδελφῶν vise un groupe mixte, sans imposer cette lecture au texte principal.
  issues:
  - severity: medium
    issue: « proches » pour συγγενῶν
    rationale: En français moderne, « proches » peut inclure des amis ou d’autres relations affectives et ne marque pas nécessairement la parenté. Or συγγενῶν désigne les membres de la parenté; « membres de votre famille » préserve cette distinction d’avec φίλων (« amis »).
  - severity: low
    issue: « ils feront mourir » pour θανατώσουσιν
    rationale: La formulation est intelligible, mais elle est moins idiomatique et peut suggérer une causalité indirecte. « Ils mettront à mort » rend naturellement l’action directe et délibérée exprimée par θανατόω.
  revised_text: Mais vous serez même livrés par vos parents, vos frères, des membres de votre famille et vos amis[a], et ils mettront à mort certains d’entre vous.
