  to: Mais vous serez même livrés par vos parents, vos frères, des membres de votre famille et vos amis[a], et ils mettront à mort certains d’entre vous.
  rationale: La révision distingue explicitement les « membres de votre famille » (συγγενῶν) des « amis » (φίλων), et remplace une tournure moins directe par l’équivalent français courant de θανατόω. Elle maintient l’ordre, l’intensité de « même », le caractère passif de « serez livrés » et l’ambiguïté contrôlée de ἀδελφῶν.
