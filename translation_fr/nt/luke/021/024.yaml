id: LUK.21.24
reference: Luke 21:24
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ πεσοῦνται στόματι μαχαίρης καὶ αἰχμαλωτισθήσονται εἰς ⸂τὰ ἔθνη πάντα⸃, καὶ Ἰερουσαλὴμ ἔσται πατουμένη ὑπὸ ἐθνῶν, ἄχρι ⸀οὗ ⸀πληρωθῶσιν καιροὶ ἐθνῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/024.yaml
  text: And they will fall by the edge of the sword and will be led captive into all the nations[c][b][a], and Jerusalem will be trampled by the nations until the times of the nations are fulfilled.
translation:
  language: fr
  text: Ils tomberont sous le tranchant de l’épée et seront emmenés captifs parmi toutes les nations[a]. Jérusalem sera piétinée par les nations[b] jusqu’à ce que les temps des nations soient accomplis[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «chez tous les peuples non juifs»; le grec ἔθνη peut désigner les «nations», les «non-Juifs» ou les «païens», selon le contexte.
    reason: lexical_alternative
  - marker: b
    text: Ou «Jérusalem sera piétinée par les non-Juifs».
    reason: alternative_reading
  - marker: c
    text: Ou «jusqu’à ce que les temps des non-Juifs soient accomplis».
    reason: alternative_reading
lexical_decisions:
- source_word: πεσοῦνται
  choice: ils tomberont
  rationale: Le futur de πίπτω, dans ce contexte de guerre, évoque la mort violente sans la rendre plus explicite que le grec; la suite en indique le moyen.
- source_word: στόματι μαχαίρης
  choice: sous le tranchant de l’épée
  rationale: Cette expression idiomatique, littéralement «par la bouche de l’épée», est rendue par une formulation française naturelle qui conserve l’image concrète du tranchant.
- source_word: αἰχμαλωτισθήσονται
  choice: seront emmenés captifs
  rationale: Le passif et l’idée d’un déplacement forcé de prisonniers sont tous deux conservés.
- source_word: εἰς τὰ ἔθνη πάντα
  choice: parmi toutes les nations
  rationale: Avec εἰς, la formule indique un mouvement vers les peuples étrangers et leur dispersion parmi eux. «Nations» maintient la cohésion lexicale des trois emplois de ἔθνη dans le verset.
- source_word: Ἰερουσαλήμ
  choice: Jérusalem
  rationale: Forme française usuelle du nom propre.
- source_word: πατουμένη
  choice: sera piétinée
  rationale: La construction périphrastique ἔσται πατουμένη exprime une situation future durable; «sera piétinée» conserve l’image de l’assujettissement.
- source_word: ὑπὸ ἐθνῶν
  choice: par les nations
  rationale: Ce choix maintient la répétition de ἔθνη et laisse ouverte sa portée géopolitique ou ethnoreligieuse.
- source_word: ἄχρι οὗ
  choice: jusqu’à ce que
  rationale: Équivalent temporel naturel de la construction grecque.
- source_word: πληρωθῶσιν
  choice: soient accomplis
  rationale: Le passif est préservé, ainsi que l’idée de périodes parvenant à leur terme ou à leur accomplissement, sans préciser le cadre eschatologique.
- source_word: καιροὶ ἐθνῶν
  choice: les temps des nations
  rationale: «Temps» rend καιροί sans réduire le terme à une simple durée; le génitif demeure volontairement ouvert quant au rapport exact entre ces temps et les nations.
theological_decisions:
- issue: Sens de ἔθνη dans ses trois occurrences
  choice: nations
  alternative: non-Juifs / païens
  rationale: Traduire uniformément par «nations» conserve la cohésion lexicale et évite de trancher prématurément entre un sens géopolitique et la désignation des peuples non juifs. Les autres sens possibles sont signalés en notes.
- issue: Sens de καιροὶ ἐθνῶν
  choice: les temps des nations soient accomplis
  alternative: les temps des non-Juifs soient accomplis / les périodes fixées pour les nations arrivent à leur terme
  rationale: Cette formulation garde le passif, le poids eschatologique et l’ambiguïté du génitif sans imposer un scénario doctrinal particulier.
translation_notes:
  register: Français international moderne, clair et digne. La phrase reste proche de la structure grecque tout en employant des tournures idiomatiques françaises. «Non-Juifs» est préféré à «Gentils» dans les notes pour être immédiatement compréhensible; «païens» n’est mentionné que comme possibilité lexicale, car il peut suggérer une appréciation religieuse plus marquée.
