  text: καὶ θρὶξ ἐκ τῆς κεφαλῆς ὑμῶν οὐ μὴ ἀπόληται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/018.yaml
  text: And not a hair from your head will perish[a].
translation:
  language: fr
  text: Et pas un cheveu de votre tête ne périra[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec emploie οὐ μή, une tournure de négation très emphatique qui exprime une assurance très forte.
    reason: Préciser la force de la négation grecque οὐ μή sans présenter un adverbe français ajouté comme une traduction littérale.
lexical_decisions:
- source_word: καὶ
  choice: Et
  rationale: Conjonction de liaison simple, qui maintient le rapport avec le contexte précédent sans introduire un contraste absent du grec.
- source_word: θρὶξ
  choice: un cheveu
  rationale: Le singulier a une valeur proverbiale et exprime de façon naturelle l’idée qu’aucune perte, même infime, n’échappera à la protection promise.
- source_word: ἐκ τῆς κεφαλῆς ὑμῶν
  choice: de votre tête
  rationale: Cette tournure française naturelle rend l’expression partitive grecque; le singulier distributif « votre tête » convient à un groupe d’interlocuteurs.
- source_word: οὐ μὴ
  choice: ne … pas
  rationale: Avec le subjonctif aoriste, cette double négation grecque exprime une assurance particulièrement forte. Le français courant emploie une négation simple dans le texte, tandis que la note en signale l’intensité.
- source_word: ἀπόληται
  choice: périra
  rationale: « Périr » conserve le registre solennel et la portée de ἀπόλλυμι sans réduire d’emblée l’énoncé à une simple perte matérielle.
theological_decisions:
- issue: Tension apparente avec l’annonce, dans le contexte immédiat, de la persécution et de la mort de certains disciples
  choice: Conserver l’affirmation proverbiale et absolue sans en préciser dans le texte la nature physique ou ultime.
  alternative: Traduire comme la promesse littérale qu’aucun disciple ne subira le moindre dommage physique.
  rationale: Le contexte proche annonce que certains disciples seront mis à mort. La formulation retenue préserve donc la tension du passage et sa forte assurance sans imposer une harmonisation interprétative dans le corps du texte.
translation_notes:
  register: Français international moderne, sobre et digne. La phrase conserve l’image proverbiale et la solennité de « périra ». La note rend compte de l’emphase grammaticale grecque sans ajouter « jamais » au texte principal.
