  text: καὶ εἶπεν· Ἀληθῶς λέγω ὑμῖν ὅτι ἡ χήρα ⸂ἡ πτωχὴ αὕτη⸃ πλεῖον πάντων ἔβαλεν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/003.yaml
  text: And he said[a], “Truly I tell you that this poor widow put in more than all of them.”
translation:
  language: fr
  text: 'Il dit : « Vraiment, je vous le dis, cette pauvre veuve a mis plus que tous les autres. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀληθῶς
  choice: Vraiment
  rationale: Introduit une affirmation solennelle et appuyée. « Vraiment » est naturel en français moderne et conserve la force de la déclaration.
- source_word: λέγω ὑμῖν
  choice: je vous le dis
  rationale: Formule idiomatique qui garde l’adresse directe et l’autorité de la parole de Jésus, dans un français courant et digne.
- source_word: ἡ χήρα ἡ πτωχὴ αὕτη
  choice: cette pauvre veuve
  rationale: Rend naturellement le démonstratif, le nom et l’adjectif, sans préciser davantage le degré de pauvreté.
- source_word: πλεῖον πάντων
  choice: plus que tous les autres
  rationale: Exprime clairement la comparaison avec l’ensemble des autres donateurs mentionnés dans le contexte, sans anticiper l’explication donnée au verset suivant.
- source_word: ἔβαλεν
  choice: a mis
  rationale: Dans le contexte des offrandes déposées dans le trésor, « a mis » est une formulation française naturelle; une traduction plus concrète comme « a jeté » risquerait de suggérer un geste désinvolte.
theological_decisions:
- issue: Nature de la comparaison concernant l’offrande de la veuve
  choice: « a mis plus que tous les autres »
  alternative: « a mis plus que chacun des autres »
  rationale: Le grec πλεῖον πάντων compare son geste à celui des autres donateurs. La formulation retenue préserve la portée frappante de l’affirmation sans expliquer dès ce verset qu’il s’agit d’une comparaison fondée sur la proportion ou le sacrifice.
translation_notes:
  register: Français international moderne, naturel et digne. La tournure solennelle « Vraiment, je vous le dis » conserve l’emphase de Jésus sans archaïsme. Aucun appel de note n’est nécessaire, car « a mis » rend clairement ἔβαλεν dans ce contexte.
