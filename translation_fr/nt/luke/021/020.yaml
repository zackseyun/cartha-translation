id: LUK.21.20
reference: Luke 21:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ὅταν δὲ ἴδητε κυκλουμένην ὑπὸ ⸀στρατοπέδων Ἰερουσαλήμ, τότε γνῶτε ὅτι ἤγγικεν ἡ ἐρήμωσις αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/020.yaml
  text: But when you see Jerusalem surrounded by armies[b][a], then know that her desolation has drawn near.
translation:
  language: fr
  text: Mais quand vous verrez Jérusalem encerclée par des armées[a], sachez alors que sa dévastation[b] est proche.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « encerclée par des camps militaires ». Le terme grec peut désigner des campements ou les armées qui y sont installées; ici, il évoque les forces qui assiègent Jérusalem.
    reason: lexical_alternative
  - marker: b
    text: Le mot traduit par « dévastation » appartient au langage prophétique du jugement; voir les formulations apparentées en Matthieu 24.15 et Marc 13.14.
    reason: cross_reference
lexical_decisions:
- source_word: Ὅταν δὲ
  choice: Mais quand
  rationale: Introduit une circonstance future tout en marquant une légère transition ou opposition avec ce qui précède.
- source_word: ἴδητε
  choice: vous verrez
  rationale: Le futur est naturel en français après « quand » dans cet avertissement prophétique et rend la portée future du grec.
- source_word: κυκλουμένην
  choice: encerclée
  rationale: Exprime clairement l'état de Jérusalem assiégée de toutes parts, tout en conservant la valeur passive du participe.
- source_word: ὑπὸ στρατοπέδων
  choice: par des armées
  rationale: στρατόπεδον peut désigner un camp militaire ou, par extension, les forces qui y campent. Dans ce contexte de siège, « armées » communique naturellement le référent.
- source_word: τότε γνῶτε
  choice: sachez alors
  rationale: Conserve la valeur impérative de γνῶτε et le repère temporel τότε dans un ordre français fluide.
- source_word: ἤγγικεν
  choice: est proche
  rationale: Rend l'état présent résultant de l'approche exprimée par le parfait grec, dans une formulation française naturelle.
- source_word: ἡ ἐρήμωσις αὐτῆς
  choice: sa dévastation
  rationale: « Dévastation » rend le résultat concret de ἐρήμωσις sans réduire le terme à la seule destruction matérielle; le possessif français évite d'imposer une personnification de la ville.
theological_decisions:
- issue: Portée du jugement prochain sur Jérusalem
  choice: Traduire ἐρήμωσις par « dévastation » sans préciser de cadre eschatologique.
  alternative: Employer « désolation » ou identifier explicitement l'événement à « l'abomination de la désolation ».
  rationale: Le verset annonce la dévastation imminente de Jérusalem lorsque des armées l'encercleront. La traduction ne doit pas intégrer une construction interprétative qui n'est pas explicitée ici.
translation_notes:
  register: Français international moderne, clair et digne. « Encerclée » évoque naturellement un siège; « sachez alors » maintient la force de l'impératif. Les deux appels de note figurent dans le texte principal et suivent l'expression qu'ils expliquent.
