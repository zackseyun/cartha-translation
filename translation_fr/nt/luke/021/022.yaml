  variant: modern international French
source:
  edition: SBLGNT
  text: ὅτι ἡμέραι ἐκδικήσεως αὗταί εἰσιν τοῦ πλησθῆναι πάντα τὰ γεγραμμένα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/022.yaml
  text: For these are days of vengeance[b][a], that all the things written may be fulfilled.
translation:
  language: fr
  text: Car ce sont des jours de vengeance[a], pour que s’accomplisse tout ce qui est écrit[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « des jours de rétribution ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « pour l’accomplissement de tout ce qui est écrit ».'
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: Car
  rationale: Introduit l’explication de l’avertissement précédent et conserve la valeur causale ou explicative du grec.
- source_word: ἡμέραι ἐκδικήσεως
  choice: des jours de vengeance
  rationale: Conserve l’image concrète des « jours » et la forte portée judiciaire de ἐκδίκησις. « Vengeance » correspond directement au grec, tandis que la note signale « rétribution », qui évite en français moderne une éventuelle connotation de vindicte humaine.
- source_word: αὗταί εἰσιν
  choice: ce sont
  rationale: Tournure française naturelle qui rend le démonstratif et la copule sans alourdir la phrase.
- source_word: τοῦ πλησθῆναι
  choice: pour que s’accomplisse
  rationale: Rend la construction avec τοῦ et l’infinitif en maintenant sa nuance de finalité ou de résultat, sans la réduire exclusivement à l’une des deux.
- source_word: πάντα τὰ γεγραμμένα
  choice: tout ce qui est écrit
  rationale: Rend naturellement le participe parfait passif substantivé et sa portée globale, tout en laissant ouverte l’étendue précise des textes visés.
theological_decisions:
- issue: Nature de ἐκδίκησις dans la prophétie de Jésus
  choice: « vengeance », au sens de sanction judiciaire
  alternative: « rétribution »
  rationale: Le terme grec exprime une action punitive ou réparatrice relevant de la justice. Le texte principal en préserve la force, tandis que la note propose une formulation moins susceptible d’évoquer une réaction vindicative humaine.
- issue: Valeur de τοῦ suivi de l’infinitif
  choice: « pour que s’accomplisse »
  alternative: « pour l’accomplissement de »
  rationale: La formulation retenue conserve la tension entre but et résultat. Elle ne précise pas davantage que le grec la manière dont l’accomplissement des écrits se rapporte à ces jours.
- issue: Référent de τὰ γεγραμμένα
  choice: « tout ce qui est écrit »
  alternative: « toutes les Écritures »
  rationale: Le grec parle littéralement des choses écrites sans employer ici un nom explicite pour « les Écritures ». La traduction évite donc de préciser le référent au-delà du texte.
translation_notes:
  register: Français international moderne, sobre et digne. « Car » maintient le lien argumentatif avec le contexte; l’ordre « pour que s’accomplisse » est idiomatique tout en gardant un registre biblique mesuré.
