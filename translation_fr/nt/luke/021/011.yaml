id: LUK.21.11
reference: Luke 21:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: σεισμοί τε μεγάλοι ⸂καὶ κατὰ τόπους⸃ ⸂λιμοὶ καὶ λοιμοὶ⸃ ἔσονται, φόβητρά τε καὶ ⸂σημεῖα ἀπ’ οὐρανοῦ μεγάλα⸃ ἔσται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/011.yaml
  text: There will be great earthquakes[a], and in various places famines and plagues[c][b]; and there will be terrors and great signs from heaven.
translation:
  language: fr
  text: Il y aura de grands tremblements de terre et, en divers lieux, des famines et des épidémies[a]. Il y aura aussi des terreurs et de grands signes[b] venant du ciel[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « pestes » ou « fléaux épidémiques ». Le terme grec désigne des épidémies ou des maladies contagieuses répandues.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « présages ». Dans un contexte apocalyptique, le terme grec peut désigner des signes annonciateurs.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « du ciel visible ». Le grec peut désigner soit le ciel, soit la sphère céleste ; la formulation conserve cette ambiguïté.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σεισμοί μεγάλοι
  choice: de grands tremblements de terre
  rationale: « Tremblements de terre » est le sens courant de σεισμοί, et « grands » conserve l’idée d’ampleur ou de gravité portée par μεγάλοι sans la préciser davantage.
- source_word: κατὰ τόπους
  choice: en divers lieux
  rationale: Cette tournure rend la répartition géographique exprimée par l’idiome grec, dans un français naturel et digne.
- source_word: λιμοὶ
  choice: famines
  rationale: Le terme désigne des famines, et non de simples pénuries alimentaires.
- source_word: λοιμοὶ
  choice: épidémies
  rationale: Le pluriel grec désigne des maladies contagieuses ou des fléaux épidémiques. « Épidémies » est clair en français moderne et évite de restreindre le sens à la peste.
- source_word: φόβητρα
  choice: événements terrifiants
  rationale: Ce pluriel rare désigne des choses ou des manifestations qui inspirent la peur. « Événements terrifiants » en exprime naturellement la force sans identifier leur nature.
- source_word: σημεῖα μεγάλα
  choice: de grands signes
  rationale: « Signes » conserve le sens large et habituel de σημεῖα, tandis que « grands » traduit directement μεγάλα sans ajouter explicitement l’idée de miracle.
- source_word: ἀπ’ οὐρανοῦ
  choice: venant du ciel
  rationale: En français, « ciel » peut désigner à la fois l’espace visible au-dessus de la terre et la sphère céleste; il préserve donc naturellement l’ambiguïté de οὐρανός.
- source_word: ἔσονται / ἔσται
  choice: Il y aura … Il y aura aussi
  rationale: La tournure existentielle rend naturellement les formes futures de εἰμί et respecte les deux propositions du grec.
theological_decisions:
- issue: Portée de οὐρανός dans le contexte apocalyptique
  choice: du ciel
  alternative: depuis la sphère céleste / dans le ciel visible
  rationale: Le français « ciel » maintient à lui seul la possibilité de phénomènes célestes visibles et celle d’une provenance céleste à portée théologique, sans trancher entre elles.
- issue: Nature des φόβητρα
  choice: événements terrifiants
  alternative: terreurs
  rationale: Le texte ne précise pas s’il s’agit d’objets, de phénomènes ou d’événements. La formulation retenue conserve ce caractère indéterminé tout en exprimant leur effet effrayant.
- issue: Valeur apocalyptique de σημεῖα
  choice: signes
  alternative: présages
  rationale: « Signes » garde le sens lexical large et n’impose pas que ces manifestations annoncent nécessairement un événement précis; l’autre lecture est signalée en note.
translation_notes:
  register: Français international moderne, clair et soutenu sans archaïsme. La répétition de « Il y aura » suit la structure grecque, tandis que « aussi » restitue la progression cumulative. « Ciel » préserve sans note nécessaire l’ambiguïté entre le ciel visible et la sphère céleste.
