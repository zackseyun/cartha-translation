id: LUK.21.7
reference: Luke 21:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἐπηρώτησαν δὲ αὐτὸν λέγοντες· Διδάσκαλε, πότε οὖν ταῦτα ἔσται, καὶ τί τὸ σημεῖον ὅταν μέλλῃ ταῦτα γίνεσθαι;
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/007.yaml
  text: And they asked him[a], saying, “Teacher, when then will these things be, and what will be the sign when these things are about to happen?”
translation:
  language: fr
  text: 'Ils lui demandèrent : « Maître, quand donc cela arrivera-t-il, et quel sera le signe lorsque cela sera sur le point d’arriver[a] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « lorsque cela va arriver ». Le verbe grec peut exprimer plus généralement un futur proche ou simplement une réalisation future, sans nécessairement souligner l’imminence.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐπηρώτησαν
  choice: Ils lui demandèrent
  rationale: L’aoriste présente une action passée ponctuelle; « demandèrent » est naturel et précis dans ce contexte de question directe.
- source_word: δὲ
  choice: absence de connecteur explicite
  rationale: Le français narratif n’exige pas ici de rendre le léger enchaînement marqué par δέ; ajouter « alors » risquerait de lui donner une valeur temporelle excessive.
- source_word: λέγοντες
  choice: deux-points introduisant le discours direct
  rationale: Le participe introduit le contenu de la question. En français moderne, les deux-points rendent cette fonction plus naturellement que « en disant ».
- source_word: Διδάσκαλε
  choice: Maître
  rationale: Dans l’adresse directe à un enseignant reconnu, « Maître » est l’équivalent français idiomatique de διδάσκαλε; il ne vise pas ici le sens de propriétaire ou de souverain.
- source_word: πότε οὖν
  choice: quand donc
  rationale: « Quand » exprime l’interrogation temporelle et « donc » conserve l’inférence tirée des paroles précédentes.
- source_word: ταῦτα ἔσται
  choice: cela arrivera-t-il
  rationale: Avec le démonstratif neutre pluriel, le futur de εἰμί désigne idiomatiquement la réalisation des événements évoqués. Le singulier collectif « cela » est naturel en français.
- source_word: σημεῖον
  choice: signe
  rationale: « Signe » est l’équivalent courant et conserve la fonction d’indice annonciateur sans préciser sa nature.
- source_word: ὅταν
  choice: indiquant que
  rationale: Cette formulation française relie clairement le signe à la survenue future des événements, tout en rendant la relation temporelle portée par ὅταν dans le contexte interrogatif.
- source_word: μέλλῃ
  choice: est sur le point de
  rationale: Cette expression préserve la nuance possible d’imminence de μέλλω, sans identifier le moment historique des événements.
- source_word: γίνεσθαι
  choice: arriver
  rationale: Dans ce contexte événementiel, « arriver » est un équivalent français courant de γίνομαι et évite le tour plus soutenu « se produire ».
theological_decisions:
- issue: Portée temporelle et eschatologique de μέλλῃ
  choice: « est sur le point d’arriver »
  alternative: « va arriver » ou « doit arriver »
  rationale: Le choix conserve la nuance d’imminence que peut porter μέλλω, sans imposer une chronologie eschatologique déterminée. Une note signale que le verbe peut aussi recevoir un sens futur plus général.
- issue: Nature du « signe »
  choice: Conserver simplement « signe »
  alternative: Préciser « signe annonciateur » ou identifier un phénomène particulier
  rationale: Le grec ne définit pas encore la nature du signe; la traduction laisse donc intacte la question des interlocuteurs.
translation_notes:
  register: Français international moderne, digne et accessible. Le discours direct est formulé naturellement; « quand donc » garde le mouvement logique du grec. « Maître » est l’appellation française usuelle adressée à un enseignant. La répétition grecque de ταῦτα est rendue par « cela » dans les deux propositions afin de préserver la référence commune aux événements précédemment évoqués.
