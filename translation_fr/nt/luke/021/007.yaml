  source_fidelity: La première question rend bien πότε οὖν ταῦτα ἔσται. Dans la seconde, « indiquant que » transforme légèrement la subordonnée temporelle ὅταν (« lorsque/quand ») en relation explicitement explicative. Il est préférable de conserver la relation temporelle sans en préciser davantage la fonction du signe.
  naturalness: Le français est globalement moderne et fluide. « Maître » est une appellation directe idiomatique dans ce cadre, et « quand donc » rend naturellement l’inférence de οὖν. « Lorsque cela sera sur le point d’arriver » est naturel et restitue plus directement la construction grecque.
  terminology: « Maître » convient ici pour Διδάσκαλε dans un registre scripturaire moderne; il ne faut pas le remplacer nécessairement par « Enseignant », moins naturel comme apostrophe. « Signe » et « sur le point d’arriver » rendent adéquatement σημεῖον et la nuance d’imminence possible de μέλλῃ, sans imposer une lecture eschatologique.
