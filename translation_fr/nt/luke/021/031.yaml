id: LUK.21.31
reference: Luke 21:31
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὕτως καὶ ὑμεῖς, ὅταν ἴδητε ταῦτα γινόμενα, γινώσκετε ὅτι ἐγγύς ἐστιν ἡ βασιλεία τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/031.yaml
  text: So also you[a], when you see these things happening[b], know that the kingdom of God is near.
translation:
  language: fr
  text: De même, vous aussi, quand vous verrez ces choses se produire[a], sachez que le royaume de Dieu[b] est proche.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : arriver.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : le règne de Dieu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως καὶ ὑμεῖς
  choice: De même, vous aussi
  rationale: Cette formulation applique aux disciples la comparaison précédente et conserve l’accent porté par le pronom explicite ὑμεῖς.
- source_word: ὅταν ἴδητε
  choice: quand vous verrez
  rationale: ὅταν suivi de l’aoriste subjonctif exprime ici une éventualité future. Le futur français est naturel dans ce contexte prédictif.
- source_word: ταῦτα γινόμενα
  choice: ces choses se produire
  rationale: La traduction conserve le démonstratif renvoyant aux signes précédemment décrits et rend γινόμενα comme la survenue d’événements.
- source_word: γινώσκετε
  choice: sachez
  rationale: Dans le contexte, la forme est comprise comme un impératif invitant les disciples à reconnaître la portée des signes.
- source_word: ἐγγύς ἐστιν
  choice: est proche
  rationale: Cette expression concise conserve l’idée de proximité sans préciser davantage si elle est temporelle ou figurée.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: le royaume de Dieu
  rationale: Formulation biblique usuelle qui peut évoquer à la fois la royauté, le règne et le domaine royal, sans réduire l’expression à une seule nuance.
theological_decisions:
- issue: Sens du « royaume de Dieu » dans ce contexte eschatologique
  choice: Conserver « le royaume de Dieu » sans développement interprétatif.
  alternative: « le règne de Dieu » ou une formulation précisant l’accomplissement final de la royauté divine
  rationale: Le texte associe la proximité du royaume aux signes décrits, mais ne précise pas s’il s’agit avant tout de sa manifestation, de son accomplissement ou de sa vindication. La formulation retenue préserve cette tension.
translation_notes:
  register: Français international moderne, clair et digne. « De même, vous aussi » maintient l’insistance du grec sans lourdeur, tandis que « sachez » donne naturellement la force impérative du passage.
