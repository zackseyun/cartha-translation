lexical_decisions:
- source_word: ὑπομονῇ
  choice: persévérance
  rationale: Le terme désigne la constance qui tient ferme dans l’épreuve. « Persévérance » est naturel en français actuel et convient au contexte de persécution.
- source_word: κτήσασθε
  choice: gagnez
  rationale: Dans le texte SBLGNT, le verbe est un impératif aoriste moyen. « Gagnez » en conserve directement la force, sans transformer l’ordre en simple prédiction.
- source_word: ψυχὰς
  choice: votre vie
  rationale: Dans ce contexte, ψυχή désigne la vie ou la personne elle-même, sans imposer une distinction étroite entre corps et âme. Le singulier distributif « votre vie » est plus idiomatique en français que « vos vies ».
- source_word: ἐν
  choice: Par
  rationale: Avec le datif, ἐν exprime ici vraisemblablement le moyen. « Par » rend cette valeur de façon claire et naturelle.
theological_decisions:
- issue: Sens de ψυχή dans un contexte de persécution eschatologique
  choice: vie, au sens global de la personne
  alternative: âme; personne
  rationale: « Vie » maintient ensemble le danger de mort et la sauvegarde ultime promise, sans réduire le propos à la seule partie immatérielle de l’être humain.
- issue: Valeur de κτήσασθε
  choice: 'impératif : « gagnez »'
  alternative: 'futur : « vous gagnerez »'
  rationale: Le texte grec fourni porte un impératif. La traduction principale en respecte la forme, tandis que la variante au futur est signalée en note afin de préserver l’ambiguïté textuelle et la nuance de résultat présente dans le contexte.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation est concise et conserve l’impératif du texte grec fourni. « Votre vie » emploie un singulier distributif idiomatique en français.
