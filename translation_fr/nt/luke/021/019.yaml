  text: Par votre persévérance, préservez votre vie[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'D’autres manuscrits ont le futur : « Par votre persévérance, vous préserverez votre vie. »'
    reason: textual_variant
  - marker: b
    text: Ou « votre âme » ; le mot grec peut aussi désigner la personne elle-même.
