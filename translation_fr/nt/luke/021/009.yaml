id: LUK.21.9
reference: Luke 21:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὅταν δὲ ἀκούσητε πολέμους καὶ ἀκαταστασίας, μὴ πτοηθῆτε· δεῖ γὰρ ταῦτα γενέσθαι πρῶτον, ἀλλ’ οὐκ εὐθέως τὸ τέλος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/009.yaml
  text: But when you hear of wars and upheavals[a], do not be terrified; for these things must happen first[b], but the end is not at once.
translation:
  language: fr
  text: Mais quand vous entendrez parler de guerres et de bouleversements[a], ne soyez pas terrifiés ; car il faut que ces choses arrivent d’abord. Mais la fin ne viendra pas immédiatement[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « troubles », « agitations » ou « désordres ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « mais pas immédiatement la fin » ; autre traduction possible : « mais ce ne sera pas tout de suite la fin ».'
    reason: alternative_reading
lexical_decisions:
- source_word: ὅταν δὲ
  choice: Mais quand
  rationale: ὅταν introduit une circonstance future indéfinie, tandis que δέ marque ici une transition légèrement contrastive avec l’avertissement précédent.
- source_word: ἀκούσητε
  choice: vous entendrez parler de
  rationale: Cette tournure française est naturelle lorsqu’il s’agit d’apprendre par des rapports ou des nouvelles que des événements se produisent.
- source_word: πολέμους
  choice: guerres
  rationale: Équivalent direct du pluriel πόλεμοι, qui désigne des conflits armés.
- source_word: ἀκαταστασίας
  choice: bouleversements
  rationale: Le terme peut désigner l’instabilité, l’agitation ou le désordre. « Bouleversements » conserve une portée sociale et politique assez large sans la réduire aux seules émeutes ou insurrections.
- source_word: μὴ πτοηθῆτε
  choice: ne soyez pas terrifiés
  rationale: Le verbe exprime une peur intense pouvant aller jusqu’à la panique ; cette formulation en conserve la force.
- source_word: δεῖ γὰρ ταῦτα γενέσθαι πρῶτον
  choice: car il faut que ces choses arrivent d’abord
  rationale: δεῖ exprime la nécessité, γάρ donne l’explication, et πρῶτον marque l’antériorité de ces événements.
- source_word: ἀλλ’ οὐκ εὐθέως τὸ τέλος
  choice: Mais la fin ne viendra pas immédiatement
  rationale: La proposition grecque est sans verbe exprimé. Le français exige ici de l’expliciter ; « viendra » rend naturellement le sens temporel sans préciser la nature de « la fin ».
theological_decisions:
- issue: Rapport entre les guerres, les bouleversements et le moment de la fin
  choice: Ces événements doivent d’abord se produire, mais la fin ne les suivra pas immédiatement.
  alternative: Ces événements appartiennent à la période précédant la fin, sans constituer eux-mêmes la fin.
  rationale: Le texte met en garde contre l’identification des troubles annoncés avec l’arrivée immédiate de la fin, sans imposer de système eschatologique particulier.
translation_notes:
  register: Français international moderne, naturel et digne. « Bouleversements » reste compréhensible tout en préservant l’étendue sémantique du grec. La seconde phrase est séparée après « d’abord » afin d’éviter une ponctuation française trop lourde, sans modifier le rapport logique exprimé par ἀλλά.
