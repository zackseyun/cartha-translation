  text: when they already put forth leaves[a], seeing for yourselves, you know that summer is already near.
translation:
  language: fr
  text: Quand ils ont déjà bourgeonné[a], en les voyant, vous savez par vous-mêmes que l’été est déjà proche.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ont déjà poussé ». Le grec ne mentionne pas explicitement des feuilles; dans ce contexte d’arbres, il évoque leur nouvelle croissance.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: quand
  rationale: Introduit une proposition temporelle éventuelle; « quand » convient naturellement à cette comparaison.
- source_word: προβάλωσιν
  choice: commencent à pousser
  rationale: Dans le contexte des arbres, le verbe désigne l’apparition de la nouvelle croissance. Cette formulation reste naturelle sans ajouter « feuilles » au texte principal.
- source_word: ἤδη
  choice: déjà
  rationale: L’adverbe figure deux fois et sa répétition est conservée pour marquer que les signes de la saison sont d’ores et déjà perceptibles.
- source_word: βλέποντες
  choice: vous voyez
  rationale: Le participe exprime l’observation qui conduit à la constatation; une proposition coordonnée est plus naturelle en français.
- source_word: ἀφ’ ἑαυτῶν
  choice: par vous-mêmes
  rationale: L’expression indique qu’ils tirent cette conclusion de leur propre observation.
- source_word: γινώσκετε
  choice: vous savez
  rationale: Rend simplement la connaissance acquise par l’observation directe.
- source_word: ἐγγὺς
  choice: proche
  rationale: Exprime ici la proximité temporelle de l’été.
- source_word: θέρος
  choice: l’été
  rationale: Désigne directement la saison estivale.
