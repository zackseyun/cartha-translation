id: LUK.21.33
reference: Luke 21:33
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ οὐρανὸς καὶ ἡ γῆ ⸀παρελεύσονται, οἱ δὲ λόγοι μου οὐ μὴ παρελεύσονται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/033.yaml
  text: Heaven and earth will pass away[a], but my words will certainly not pass away.
translation:
  language: fr
  text: Le ciel et la terre passeront, mais mes paroles ne passeront jamais[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ne passeront absolument pas ». La tournure grecque exprime une négation particulièrement forte.'
    reason: Précision sur la force de la négation grecque οὐ μὴ et indication d’une autre formulation française possible.
lexical_decisions:
- source_word: ὁ οὐρανὸς
  choice: le ciel
  rationale: Dans l’expression coordonnée avec « la terre », le singulier désigne le ciel comme partie de l’ensemble créé, et non seulement le ciel visible.
- source_word: ἡ γῆ
  choice: la terre
  rationale: Associé à « le ciel », le terme a ici une portée cosmique plutôt que le sens local de « pays » ou de « territoire ».
- source_word: παρελεύσονται
  choice: passeront
  rationale: Le verbe exprime ici la disparition ou la fin. Le même verbe français est répété dans les deux propositions afin de conserver le parallélisme et le contraste du grec.
- source_word: δὲ
  choice: mais
  rationale: La conjonction marque nettement le contraste entre le caractère passager du ciel et de la terre et la permanence des paroles de Jésus.
- source_word: οἱ λόγοι μου
  choice: mes paroles
  rationale: « Paroles » désigne naturellement les propos prononcés par Jésus et convient au registre solennel de l’affirmation.
- source_word: οὐ μὴ
  choice: ne… jamais
  rationale: La double négation grecque avec le futur est emphatique. « Ne… jamais » exprime en français moderne une négation absolue, naturelle et forte.
theological_decisions:
- issue: Force de l’affirmation concernant la permanence des paroles de Jésus
  choice: « mes paroles ne passeront jamais »
  alternative: « mes paroles ne passeront absolument pas »
  rationale: La traduction conserve l’opposition radicale entre la disparition du monde créé et la permanence des paroles de Jésus. « Jamais » rend la négation emphatique οὐ μὴ sans atténuer l’affirmation ni y ajouter une interprétation doctrinale.
translation_notes:
  register: Français international moderne, clair et digne. La répétition de « passeront » maintient la structure rhétorique du grec; « jamais » restitue naturellement son insistance.
