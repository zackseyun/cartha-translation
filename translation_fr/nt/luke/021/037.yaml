revisions:
- from: Pendant la journée, il enseignait dans le temple[a] ; mais la nuit, il sortait et allait passer la nuit[b] sur la montagne appelée mont des Oliviers.
  to: Pendant la journée, il enseignait dans le temple[a] ; mais la nuit, il sortait pour passer la nuit[b] sur le mont appelé le mont des Oliviers.
  rationale: La révision supprime le déplacement supplémentaire suggéré par « allait », tout en conservant le rapport entre le fait de sortir et celui de passer la nuit. Elle normalise aussi le nom de lieu selon l’usage biblique français, sans supprimer l’élément explicatif « appelé » du grec.
