  text: Ἦν δὲ τὰς ἡμέρας ⸂ἐν τῷ ἱερῷ διδάσκων⸃, τὰς δὲ νύκτας ἐξερχόμενος ηὐλίζετο εἰς τὸ ὄρος τὸ καλούμενον Ἐλαιῶν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/037.yaml
  text: And during the days he was teaching in the temple[b][a], but at night he would go out and lodge on the mountain called the Mount of Olives.
translation:
  language: fr
  text: Pendant la journée, il enseignait dans le temple[a] ; mais la nuit, il sortait pour passer la nuit[b] sur le mont appelé le mont des Oliviers.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot grec désigne ici l’ensemble du domaine du temple, et non précisément le sanctuaire intérieur.
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « loger » ; le verbe peut aussi évoquer le fait de passer la nuit en plein air.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἦν ... διδάσκων
  choice: il enseignait
  rationale: L’imparfait périphrastique exprime ici une activité habituelle et continue ; l’imparfait français la rend naturellement.
- source_word: τὰς ἡμέρας
  choice: pendant la journée
  rationale: L’accusatif de temps désigne la période diurne et forme un contraste avec « la nuit » ; le singulier collectif est idiomatique en français.
- source_word: ἐν τῷ ἱερῷ
  choice: dans le temple
  rationale: Cette expression naturelle conserve le terme usuel, tandis qu’une note précise que ἱερόν désigne l’ensemble du domaine du temple.
- source_word: τὰς δὲ νύκτας
  choice: mais la nuit
  rationale: La formulation française exprime une habitude répétée et maintient le contraste marqué par δέ.
- source_word: ἐξερχόμενος
  choice: il sortait
  rationale: L’imparfait rend l’action répétée qui accompagne le fait de passer la nuit hors de la ville.
- source_word: ηὐλίζετο
  choice: allait passer la nuit
  rationale: Le verbe signifie passer la nuit ou loger, éventuellement en plein air ; « passer la nuit » évite le registre vieilli de « loger » dans cet emploi.
- source_word: εἰς τὸ ὄρος
  choice: sur la montagne
  rationale: Avec le verbe de séjour, εἰς indique la destination aboutissant au lieu où Jésus passe la nuit.
- source_word: τὸ καλούμενον Ἐλαιῶν
  choice: appelée mont des Oliviers
  rationale: Cette formulation traduit le nom du lieu de façon claire et conforme à l’usage biblique français, sans transformer inutilement le nom en simple translittération.
