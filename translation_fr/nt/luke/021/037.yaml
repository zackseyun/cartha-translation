    issue: Redondance et légère surinterprétation du mouvement dans « sortait et allait passer la nuit ».
    rationale: ἐξερχόμενος exprime le fait de sortir, tandis que ηὐλίζετο exprime le fait de passer la nuit. La tournure « sortait pour passer la nuit » rend leur relation sans ajouter inutilement « allait ».
  - severity: low
    issue: 'Formulation toponymique peu naturelle : « la montagne appelée mont des Oliviers ».'
    rationale: Le français emploie normalement « le mont des Oliviers ». L’article et le nom commun « mont » rendent le nom de lieu plus naturel tout en préservant l’idée de « appelé ».
  revised_text: Pendant la journée, il enseignait dans le temple[a] ; mais la nuit, il sortait pour passer la nuit[b] sur le mont appelé le mont des Oliviers.
