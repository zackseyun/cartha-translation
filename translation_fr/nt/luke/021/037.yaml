review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est fidèle : l’imparfait rend bien l’activité habituelle, le contraste jour/nuit est conservé, et les notes lexicales correspondent à ἱερόν et αὐλίζομαι. Toutefois, « sortait et allait passer la nuit » introduit un second verbe de déplacement (« allait ») qui n’est pas nécessairement exprimé par le grec et alourdit la coordination.'
  naturalness: Le texte est globalement naturel, mais « sur la montagne appelée mont des Oliviers » est moins idiomatique et moins conforme à l’usage français établi du toponyme. « Sur le mont appelé le mont des Oliviers » est clair, grammatical et conserve explicitement καλούμενον (« appelé »).
  terminology: « temple » avec la note sur le domaine du temple est approprié. « Le mont des Oliviers » est le toponyme biblique français usuel. « Passer la nuit » est moderne et exact pour αὐλίζομαι.
  issues:
