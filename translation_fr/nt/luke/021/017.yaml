  text: καὶ ἔσεσθε μισούμενοι ὑπὸ πάντων διὰ τὸ ὄνομά μου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/017.yaml
  text: And you will be hated by all because of my name[a].
translation:
  language: fr
  text: Et vous serez haïs de tous à cause de mon nom[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à cause de moi ». L’expression « mon nom » peut renvoyer à l’identité et à l’autorité de Jésus, ainsi qu’à l’attachement et à la confession qui lui sont liés.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔσεσθε μισούμενοι
  choice: vous serez haïs
  rationale: La copule au futur avec le participe passif forme naturellement en français un futur passif. Cette formulation claire conserve l’idée d’une hostilité subie.
- source_word: ὑπὸ πάντων
  choice: de tous
  rationale: Avec un verbe passif, « de tous » exprime naturellement l’agent en français et préserve la portée générale de πάντων sans ajouter un nom absent du grec.
- source_word: διὰ τὸ ὄνομά μου
  choice: à cause de mon nom
  rationale: διά avec l’accusatif indique ici la cause. « À cause de » est courant et précis, tandis que « mon nom » conserve l’expression grecque et ses résonances liées à l’identité, à l’autorité et à l’attachement à Jésus.
theological_decisions:
- issue: Sens de « mon nom » dans le contexte de la persécution des disciples
  choice: Conserver « à cause de mon nom »
  alternative: « à cause de moi » ou « parce que vous m’appartenez »
  rationale: Le grec mentionne explicitement le nom de Jésus. Garder cette formulation préserve sa richesse théologique et son ambiguïté légitime sans la réduire à une seule explication.
translation_notes:
  register: Français international moderne, simple et digne. « Haïs » est direct et fidèle; « de tous » garde la formulation concise et générale du grec.
