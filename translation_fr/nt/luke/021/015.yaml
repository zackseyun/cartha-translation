  source_fidelity: 'Le sens principal est bien rendu : Jésus promet lui-même aux disciples une expression inspirée et une sagesse telles que l’ensemble de leurs opposants ne pourra leur tenir tête ni leur répondre de façon valable. « Des paroles » est une explicitation contextuellement défendable de στόμα (« bouche »). Toutefois, « répondre » seul n’exprime pas suffisamment ἀντειπεῖν, qui signifie répondre contre, contredire ou répliquer en opposition.'
  naturalness: 'La phrase est globalement naturelle, mais la coordination « résister ni répondre » après « auxquelles » affaiblit la seconde action : on peut répondre à des paroles sans les contredire. « Ni résister ni répliquer » conserve les deux régimes indirects et rend la force polémique du grec dans un français moderne.'
