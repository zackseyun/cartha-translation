id: LUK.21.15
reference: Luke 21:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐγὼ γὰρ δώσω ὑμῖν στόμα καὶ σοφίαν ᾗ οὐ δυνήσονται ⸂ἀντιστῆναι ἢ ἀντειπεῖν⸃ ⸀ἅπαντες οἱ ἀντικείμενοι ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/015.yaml
  text: For I will give you words and wisdom that all who oppose you will not be able to withstand or contradict.
translation:
  language: fr
  text: Car moi, je vous donnerai des paroles et une sagesse auxquelles aucun de vos adversaires ne pourra résister ni répliquer.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στόμα
  choice: des paroles
  rationale: Littéralement « une bouche », mais l’expression désigne ici la capacité de parler ou les paroles à prononcer. « Des paroles » est naturel en français et correspond au sens contextuel sans obscurcir le verset.
- source_word: σοφίαν
  choice: une sagesse
  rationale: Rend directement le grec et conserve l’idée d’un discernement accordé pour témoigner.
- source_word: ἀντιστῆναι
  choice: résister
  rationale: Équivalent direct qui exprime l’incapacité des adversaires à tenir contre les paroles et la sagesse données.
- source_word: ἀντειπεῖν
  choice: répondre
  rationale: Le verbe signifie parler contre, contredire ou répliquer. « Répondre » convient à la coordination avec « résister » et garde le sens d’une réfutation adverse impossible.
- source_word: οἱ ἀντικείμενοι ὑμῖν
  choice: vos adversaires
  rationale: Formulation française concise pour ceux qui s’opposent aux disciples.
theological_decisions:
- issue: Nature du don promis par Jésus
  choice: « je vous donnerai des paroles et une sagesse »
  alternative: « je vous donnerai une bouche et une sagesse »
  rationale: La traduction exprime l’aide concrète promise pour le témoignage sans transformer la métaphore grecque en anthropomorphisme peu naturel en français.
- issue: Portée de l’incapacité des adversaires
  choice: « aucun de vos adversaires ne pourra »
  alternative: « tous vos adversaires ne pourront pas »
  rationale: Le grec ἅπαντες avec la négation exprime ici l’absence d’exception parmi les adversaires; cette tournure française évite l’ambiguïté de portée de la négation.
translation_notes:
  register: Français moderne, international et digne. La phrase reste proche de la structure grecque tout en employant une formulation immédiatement intelligible à l’oral comme à l’écrit.
