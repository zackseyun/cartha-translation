id: LUK.21.32
reference: Luke 21:32
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν ὅτι οὐ μὴ παρέλθῃ ἡ γενεὰ αὕτη ἕως ἂν πάντα γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/032.yaml
  text: Truly I say to you[c][b][a], this generation will certainly not pass away until all things happen.
translation:
  language: fr
  text: '« Vraiment, je vous le dis : cette génération[a] ne passera certainement pas avant que tout[b] se produise[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ce peuple » ou « cette époque » ; le mot grec peut être compris de plusieurs manières, bien que « génération » soit sa traduction la plus directe ici.
    reason: alternative_reading
  - marker: b
    text: Certaines traductions ont « tout cela », en ajoutant le démonstratif d’après le contexte ; le grec dit simplement « tout ».
    reason: lexical_alternative
  - marker: c
    text: Ou « arrive » ou « ait lieu » ; « s’accomplisse » est également possible, mais ajoute une nuance plus explicite d’accomplissement.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: Vraiment
  rationale: Introduit une affirmation solennelle et certaine. « Vraiment » transmet naturellement la force de l’expression en français moderne sans recourir à une simple translittération.
- source_word: λέγω ὑμῖν
  choice: je vous le dis
  rationale: Formule directe, naturelle en français, qui reste proche du grec tout en reprenant idiomatiquement le complément par « le ».
- source_word: οὐ μὴ παρέλθῃ
  choice: ne passera certainement pas
  rationale: La construction οὐ μή avec le subjonctif aoriste exprime une négation fortement appuyée. « Certainement pas » en conserve l’emphase sans exagérer jusqu’à « jamais ».
- source_word: ἡ γενεὰ αὕτη
  choice: cette génération
  rationale: C’est le sens lexical le plus direct de γενεά dans ce contexte. La traduction ne tranche pas la question discutée de son référent.
- source_word: ἕως ἂν
  choice: avant que
  rationale: Avec la proposition principale négative, « ne passera pas avant que » exprime naturellement en français la limite temporelle marquée par ἕως ἂν.
- source_word: πάντα
  choice: tout
  rationale: Le neutre pluriel désigne la totalité des choses concernées. « Tout » respecte le grec, qui ne contient pas explicitement de démonstratif équivalant à « cela ».
- source_word: γένηται
  choice: se produise
  rationale: Dans ce contexte, γίνομαι désigne ce qui arrive ou a lieu. « Se produise » convient à la subordonnée temporelle française et n’ajoute pas la nuance théologique plus forte de « s’accomplisse ».
theological_decisions:
- issue: Le sens de « cette génération » dans une déclaration eschatologique
  choice: Conserver la traduction lexicale « cette génération » sans préciser son référent.
  alternative: « ce peuple », « cette époque » ou une explicitation telle que « la génération qui verra ces choses »
  rationale: 'Le groupe grec est lexicalement direct, mais son référent demeure discuté : les contemporains de Jésus, la génération qui voit les signes, ou un groupe humain. Le texte principal préserve cette tension au lieu d’imposer une interprétation.'
translation_notes:
  register: Français international moderne, clair et digne. La tournure solennelle « Vraiment, je vous le dis » conserve l’autorité de la déclaration, tandis que « ne passera certainement pas » rend explicitement la forte négation grecque. Les notes maintiennent les principales ambiguïtés lexicales et interprétatives sans les résoudre dans le texte.
