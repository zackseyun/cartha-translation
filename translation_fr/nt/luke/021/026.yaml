source:
  edition: SBLGNT
  text: ἀποψυχόντων ἀνθρώπων ἀπὸ φόβου καὶ προσδοκίας τῶν ἐπερχομένων τῇ οἰκουμένῃ, αἱ γὰρ δυνάμεις τῶν οὐρανῶν σαλευθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/026.yaml
  text: with people fainting from fear and expectation of the things coming upon the inhabited world[b][a], for the powers of the heavens will be shaken.
translation:
  language: fr
  text: Les gens défailliront sous l’effet de la peur et de l’attente de ce qui va survenir au monde habité[a], car les puissances des cieux seront ébranlées[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « au monde » ou « à la terre » ; le grec désigne le monde habité.
    reason: lexical_alternative
  - marker: b
    text: Ou « les puissances célestes » ou « les puissances du ciel ». L’expression peut désigner largement des puissances cosmiques ou célestes.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποψυχόντων ἀνθρώπων
  choice: les gens défailliront
  rationale: Le participe présent au génitif décrit des personnes à qui leurs forces viennent à manquer sous l’effet de la terreur. « Défailliront » garde la dimension à la fois physique et psychologique sans limiter le propos aux hommes de sexe masculin.
- source_word: ἀπὸ φόβου
  choice: de peur
  rationale: ἀπό avec le génitif exprime ici la cause. « De peur » est concis et naturel en français.
- source_word: καὶ προσδοκίας
  choice: dans l’attente
  rationale: Le nom désigne l’attente de ce qui vient. Le contexte lui donne un caractère angoissant, sans qu’il soit nécessaire d’ajouter explicitement « terrible » ou « anxieuse ».
- source_word: τῶν ἐπερχομένων
  choice: de ce qui va arriver
  rationale: Le participe substantivé neutre pluriel renvoie aux événements qui surviennent. Le français idiomatique emploie naturellement le collectif singulier « ce qui ».
- source_word: τῇ οἰκουμένῃ
  choice: au monde habité
  rationale: οἰκουμένη désigne le monde où vivent les humains, parfois simplement le monde ou la terre. « Monde habité » conserve cette nuance lexicale.
- source_word: αἱ δυνάμεις τῶν οὐρανῶν
  choice: les puissances des cieux
  rationale: Cette formulation proche du grec préserve l’ambiguïté entre réalités cosmiques, célestes ou corps célestes.
- source_word: σαλευθήσονται
  choice: seront ébranlées
  rationale: Le futur passif exprime une mise en mouvement ou un bouleversement. « Seront ébranlées » convient au registre apocalyptique et conserve la force de l’image.
theological_decisions:
- issue: Sens des « puissances des cieux » dans le contexte apocalyptique
  choice: Conserver l’expression ambiguë « les puissances des cieux ».
  alternative: « les corps célestes » ou « les puissances célestes »
  rationale: Le grec peut évoquer les structures du cosmos, les astres ou des puissances célestes. La traduction ne tranche pas en faveur d’une seule interprétation.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve le mouvement de la phrase grecque tout en rendant la construction participiale par un verbe conjugué. Les marqueurs de notes suivent immédiatement les expressions concernées.
