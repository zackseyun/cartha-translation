id: LUK.21.23
reference: Luke 21:23
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸀οὐαὶ ταῖς ἐν γαστρὶ ἐχούσαις καὶ ταῖς θηλαζούσαις ἐν ἐκείναις ταῖς ἡμέραις· ἔσται γὰρ ἀνάγκη μεγάλη ἐπὶ τῆς γῆς καὶ ⸀ὀργὴ τῷ λαῷ τούτῳ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/023.yaml
  text: Woe to those who are pregnant and to those who are nursing infants in those days! For there will be great distress upon the land[a], and wrath against this people[b],
translation:
  language: fr
  text: Malheur aux femmes enceintes et à celles qui allaitent en ces jours-là ! Car il y aura une grande détresse dans le pays[a] et de la colère contre ce peuple[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sur la terre ». Le mot grec γῆ peut désigner un pays ou la terre entière ; « pays » est retenu ici parce que le contexte immédiat concerne Jérusalem et la Judée.
    reason: lexical_alternative
  - marker: b
    text: Ou « de la colère pour ce peuple » ou « de la colère sur ce peuple ».
    reason: alternative_reading
lexical_decisions:
- source_word: οὐαί
  choice: Quel malheur
  rationale: Rend l’exclamation prophétique de lamentation et de jugement dans un français naturel et fort.
- source_word: ταῖς ἐν γαστρὶ ἐχούσαις
  choice: les femmes enceintes
  rationale: Expression française actuelle et idiomatique correspondant littéralement à celles qui « ont dans le ventre ».
- source_word: ταῖς θηλαζούσαις
  choice: celles qui allaiteront
  rationale: Le participe présent grec désigne les femmes qui allaitent; le futur français s’accorde naturellement avec « en ces jours-là » et la situation annoncée.
- source_word: ἐν ἐκείναις ταῖς ἡμέραις
  choice: en ces jours-là
  rationale: Formulation temporelle courante, proche de la structure et du démonstratif grecs.
- source_word: ἀνάγκη μεγάλη
  choice: une grande détresse
  rationale: Dans ce contexte de catastrophe, ἀνάγκη exprime une détresse ou calamité pressante plutôt qu’une simple nécessité.
- source_word: ἐπὶ τῆς γῆς
  choice: dans le pays
  rationale: γῆ peut désigner la terre entière ou un pays; le contexte immédiat de Jérusalem et de la Judée favorise ici « pays ». La préposition ἐπί est rendue idiomatiquement par « dans » en français.
- source_word: ὀργή
  choice: de la colère
  rationale: Préserve le sens d’une colère lourde de jugement sans ajouter explicitement Dieu comme sujet, absent du grec.
- source_word: τῷ λαῷ τούτῳ
  choice: contre ce peuple
  rationale: Le datif indique ici le peuple atteint par la colère; « contre » est naturel en français tout en conservant le démonstratif.
theological_decisions:
- issue: Référent et portée de γῆ et de « ce peuple »
  choice: Le texte principal emploie « pays », ce qui privilégie le cadre local d’Israël ou de la Judée.
  alternative: « terre », avec une portée potentiellement universelle.
  rationale: Le contexte immédiat porte sur Jérusalem, sa désolation et la Judée, mais une note conserve l’ambiguïté lexicale de γῆ.
- issue: Nature et source de ὀργή
  choice: « de la colère », sans préciser qu’il s’agit de la colère de Dieu.
  alternative: « la colère de Dieu » ou « le jugement ».
  rationale: Le contexte peut suggérer une colère divine ou judiciaire, mais le grec n’en nomme pas explicitement l’auteur; la traduction ne résout donc pas cette tension.
- issue: Valeur du datif τῷ λαῷ τούτῳ
  choice: « contre ce peuple »
  alternative: « pour ce peuple » ou « sur ce peuple ».
  rationale: « Contre » exprime naturellement en français le peuple visé par la colère, tandis qu’une note signale les autres nuances formellement possibles.
translation_notes:
  register: Français international moderne, digne et accessible. « Quel malheur » garde la force prophétique sans archaïsme; « femmes enceintes » et « allaiteront » sont directs et usuels. La ponctuation conserve l’exclamation suivie de son explication.
