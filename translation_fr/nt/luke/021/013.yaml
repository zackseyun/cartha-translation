  text: ⸀ἀποβήσεται ὑμῖν εἰς μαρτύριον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/013.yaml
  text: This will turn out for you as a testimony[a].
translation:
  language: fr
  text: Cela vous donnera l’occasion de témoigner[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Cela se traduira pour vous par un témoignage. »'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποβήσεται
  choice: donnera l’occasion
  rationale: Le futur moyen exprime ici l’issue des persécutions annoncées. En français courant, « donnera l’occasion » rend naturellement cette idée de résultat sans réduire le verbe à une simple occurrence.
- source_word: ὑμῖν
  choice: vous
  rationale: Le datif désigne les disciples comme bénéficiaires ou personnes concernées par cette issue; il s’intègre idiomatiquement à « vous donnera ».
- source_word: εἰς
  choice: l’occasion de
  rationale: Avec μαρτύριον, εἰς peut marquer le résultat ou la finalité. Cette formulation française explicite avec mesure que les événements deviennent une occasion de témoignage.
- source_word: μαρτύριον
  choice: témoigner
  rationale: Le substantif désigne le témoignage rendu. La tournure verbale est naturelle en français et convient au contexte où les disciples comparaissent devant des autorités, tout en laissant ouverte la portée évangélique ou judiciaire de leur témoignage.
theological_decisions:
- issue: Sens du témoignage des disciples devant les autorités
  choice: Les événements annoncés fourniront aux disciples l’occasion de rendre témoignage.
  alternative: Les événements constitueront un témoignage, éventuellement une preuve, contre leurs adversaires.
  rationale: Le contexte immédiat de comparution devant des rois et des gouverneurs favorise le témoignage rendu par les disciples, mais le texte grec reste concis. La note conserve donc l’autre lecture possible sans l’introduire dans le corps du verset.
translation_notes:
  register: Français international moderne, clair et digne. La formulation principale privilégie l’expression idiomatique « donner l’occasion de témoigner »; la note maintient une traduction plus formelle et l’ambiguïté de μαρτύριον.
