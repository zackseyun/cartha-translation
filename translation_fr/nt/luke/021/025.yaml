id: LUK.21.25
reference: Luke 21:25
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ ⸀ἔσονται σημεῖα ἐν ἡλίῳ καὶ σελήνῃ καὶ ἄστροις, καὶ ἐπὶ τῆς γῆς συνοχὴ ἐθνῶν ἐν ἀπορίᾳ ⸀ἤχους θαλάσσης καὶ σάλου,
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/025.yaml
  text: And there will be signs in sun and moon and stars[a], and on the earth distress of nations in perplexity because of the roaring of the sea and the surging waves[b],
translation:
  language: fr
  text: Il y aura des signes dans le soleil, la lune et les étoiles, et, sur la terre, les nations seront dans l’angoisse et ne sauront que faire devant le fracas de la mer et son agitation[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « au bruit de la mer et de l’agitation »; autre traduction possible : « à cause du fracas de la mer et de la houle ».'
    reason: La construction grecque et la portée de σάλος permettent une formulation plus littérale ou une explicitation du mouvement de la mer.
lexical_decisions:
- source_word: σημεῖα
  choice: signes
  rationale: « Signes » est le terme français courant et suffisamment large pour désigner des phénomènes extraordinaires sans préciser s’ils sont symboliques, littéraux ou les deux.
- source_word: ἐν ἡλίῳ καὶ σελήνῃ καὶ ἄστροις
  choice: dans le soleil, la lune et les étoiles
  rationale: Le français demande naturellement l’article défini devant ces noms; la préposition « dans » conserve la formulation grecque sans réduire les signes à une simple localisation extérieure.
- source_word: συνοχὴ ἐθνῶν
  choice: les nations seront dans l’angoisse
  rationale: συνοχή exprime une détresse oppressante. Une proposition verbale est plus naturelle en français que « l’angoisse des nations » tout en gardant les nations comme celles qui éprouvent cette détresse.
- source_word: ἐν ἀπορίᾳ
  choice: ne sauront que faire
  rationale: Cette expression française rend concrètement l’idée d’être désemparé, sans issue ni moyen de répondre à la situation.
- source_word: ἤχους θαλάσσης καὶ σάλου
  choice: devant le fracas de la mer et son agitation
  rationale: ἦχος désigne ici le bruit puissant de la mer, et σάλος son mouvement tumultueux. « Devant » préserve la relation contextuelle sans imposer une causalité plus précise que le grec.
theological_decisions:
- issue: Nature des phénomènes cosmiques
  choice: Présenter directement des signes dans les astres sans expliquer leur mode d’accomplissement.
  alternative: Les définir comme des perturbations astronomiques littérales ou comme une imagerie politique symbolique.
  rationale: Le verset ne tranche pas entre lecture littérale, symbolique ou mixte; la traduction maintient cette ouverture.
- issue: Relation entre la détresse des nations et le tumulte marin
  choice: Employer « devant », qui peut exprimer leur réaction face au phénomène sans préciser davantage le lien logique.
  alternative: Employer « à cause du », qui rendrait le rapport explicitement causal, ou « au bruit de », plus formel.
  rationale: La construction ἐν ἀπορίᾳ ἤχους est difficile et textuellement discutée quant à la relation syntaxique exacte. Une formulation souple évite de surdéterminer le rapport.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase verbale « les nations seront dans l’angoisse et ne sauront que faire » évite une tournure nominale lourde. « Fracas » et « agitation » conservent la force apocalyptique sans ajouter explicitement les « vagues », absentes du grec.
