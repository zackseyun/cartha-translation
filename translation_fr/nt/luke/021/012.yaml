id: LUK.21.12
reference: Luke 21:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Πρὸ δὲ τούτων πάντων ἐπιβαλοῦσιν ἐφ’ ὑμᾶς τὰς χεῖρας αὐτῶν καὶ διώξουσιν, παραδιδόντες εἰς ⸀τὰς συναγωγὰς καὶ φυλακάς, ⸀ἀπαγομένους ἐπὶ βασιλεῖς καὶ ἡγεμόνας ἕνεκεν τοῦ ὀνόματός μου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/012.yaml
  text: But before all these things[a], they will lay their hands on you and persecute you, handing you over to synagogues and prisons[b], bringing you before kings and governors because of my name.
translation:
  language: fr
  text: Mais avant tout cela, ils mettront la main sur vous[a] et vous persécuteront, vous livrant aux synagogues et aux prisons, et vous conduisant devant des rois et des gouverneurs à cause de mon nom[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ils vous saisiront ». Le grec dit littéralement qu’ils « poseront leurs mains sur vous » ; c’est une expression qui peut désigner une saisie, une arrestation ou des mauvais traitements hostiles.
    reason: lexical_alternative
  - marker: b
    text: On peut aussi traduire « pour mon nom » ou, de manière plus explicite, « à cause de moi ». L’expression « mon nom » renvoie à la personne et à l’autorité de Jésus.
    reason: alternative_reading
lexical_decisions:
- source_word: Πρὸ δὲ τούτων πάντων
  choice: Mais avant tout cela
  rationale: πρό avec le génitif marque l’antériorité temporelle; δέ introduit ici un contraste. « Tout cela » rend naturellement τούτων πάντων en français.
- source_word: ἐπιβαλοῦσιν ἐφ’ ὑμᾶς τὰς χεῖρας αὐτῶν
  choice: on portera la main sur vous
  rationale: Cette tournure française conserve l’image concrète de l’expression grecque et évoque une saisie hostile; la note explicite le sens.
- source_word: διώξουσιν
  choice: on vous persécutera
  rationale: Dans ce contexte d’hostilité envers les disciples, διώκω désigne clairement la persécution.
- source_word: παραδιδόντες
  choice: On vous livrera
  rationale: Le participe décrit une modalité de la persécution. La coordination en proposition indépendante produit un français plus naturel tout en conservant la relation logique.
- source_word: εἰς τὰς συναγωγὰς καὶ φυλακάς
  choice: aux synagogues et aux prisons
  rationale: Les noms d’institutions sont maintenus sans expliciter les autorités ou procédures que les synagogues peuvent représenter ici.
- source_word: ἀπαγομένους
  choice: l’on vous conduira
  rationale: Le participe passif exprime le fait d’être emmené sous contrainte. La formulation active indéfinie est idiomatique en français et garde le même agent implicite que le contexte.
- source_word: ἐπὶ βασιλεῖς καὶ ἡγεμόνας
  choice: devant des rois et des gouverneurs
  rationale: 'Avec ce verbe de mouvement, ἐπί a ici une valeur judiciaire: comparaître devant des autorités.'
- source_word: ἕνεκεν τοῦ ὀνόματός μου
  choice: à cause de mon nom
  rationale: Cette traduction conserve l’expression biblique qui associe le nom de Jésus à sa personne et à son autorité, sans la réduire à une paraphrase.
theological_decisions:
- issue: Sens de « mon nom » dans le contexte de la persécution
  choice: Conserver « à cause de mon nom »
  alternative: à cause de moi; parce que vous m’appartenez
  rationale: 'Le grec τοῦ ὀνόματός μου porte une résonance biblique propre: le nom renvoie à la personne et à l’autorité de Jésus. Le conserver évite d’imposer une interprétation plus étroite.'
- issue: Référence institutionnelle des synagogues
  choice: Conserver simplement « aux synagogues »
  alternative: aux autorités des synagogues; devant les tribunaux des synagogues
  rationale: Le contexte peut évoquer les autorités ou les procédures judiciaires liées aux synagogues, mais le texte grec nomme les synagogues elles-mêmes. L’explicitation réduirait l’ambiguïté du texte.
translation_notes:
  register: Français international moderne, digne et accessible. Le pronom indéfini « on » évite un lourd « ils » sans antécédent explicite. Les deux phrases rendent la longue structure participiale grecque de façon naturelle, tout en préservant la progression des actes hostiles. Tous les marqueurs de notes figurent dans le texte.
