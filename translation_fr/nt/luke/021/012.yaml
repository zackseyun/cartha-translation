  naturalness: Le français est clair et de registre approprié. Employer « ils » plutôt que le pronom indéfini « on » rend plus nettement le sujet hostile implicite du grec et permet une suite participiale plus cohérente. « Mettre la main sur vous » est l’idiome français courant pour la saisie, sans devoir expliciter davantage.
  terminology: « Synagogues », « prisons », « rois », « gouverneurs » et « à cause de mon nom » sont fidèles et naturels. L’expression « mon nom » doit être maintenue sans paraphrase confessionnelle.
