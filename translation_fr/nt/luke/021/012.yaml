revisions:
- from: Mais avant tout cela, on portera la main sur vous[a] et on vous persécutera. On vous livrera aux synagogues et aux prisons, et l’on vous conduira devant des rois et des gouverneurs à cause de mon nom[b].
  to: Mais avant tout cela, ils mettront la main sur vous[a] et vous persécuteront, vous livrant aux synagogues et aux prisons, et vous conduisant devant des rois et des gouverneurs à cause de mon nom[b].
  rationale: La révision remplace une expression française susceptible de réduire l’action à la violence physique par l’idiome usuel de la saisie, tout en conservant cette nuance dans la note. Elle garde la structure de dépendance des participes grecs au moyen de participes présents français et préserve l’expression théologiquement significative « à cause de mon nom ».
