    rationale: Cette expression suggère principalement une atteinte violente (« porter la main sur quelqu’un »), tandis que ἐπιβαλεῖν τὰς χεῖρας ἐπί peut désigner une intervention hostile incluant la saisie ou l’arrestation. « Ils mettront la main sur vous » est plus idiomatique et correspond mieux à cette portée.
  - severity: low
    issue: La note a décrit le littéral de façon imprécise.
    rationale: Le grec parle de « poser/jeter leurs mains sur vous », au pluriel, et non de « mettre les mains sur vous » comme simple formulation littérale française. La note peut distinguer le sens idiomatique de la formulation grecque.
