id: LUK.21.38
reference: Luke 21:38
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ πᾶς ὁ λαὸς ὤρθριζεν πρὸς αὐτὸν ἐν τῷ ἱερῷ ἀκούειν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/038.yaml
  text: And all the people would come early in the morning to him in the temple to hear him[a].
translation:
  language: fr
  text: Et tout le peuple venait de grand matin à lui, dans le Temple, pour l’écouter[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot grec ἱερόν désigne l’ensemble du complexe du Temple, notamment ses cours, et non précisément le sanctuaire intérieur.
    reason: cultural_note
lexical_decisions:
- source_word: πᾶς ὁ λαὸς
  choice: tout le peuple
  rationale: Rend naturellement le sens collectif et général de l’expression, sans imposer l’idée que chaque individu était nécessairement présent.
- source_word: ὤρθριζεν
  choice: venait dès le matin
  rationale: L’imparfait français exprime l’action habituelle ou répétée portée par l’imparfait grec, tandis que « dès le matin » conserve l’idée de venir de bonne heure.
- source_word: πρὸς αὐτόν
  choice: auprès de lui
  rationale: Exprime le mouvement vers Jésus et convient naturellement à des personnes qui se rassemblent autour de lui pour l’écouter.
- source_word: ἐν τῷ ἱερῷ
  choice: dans le Temple
  rationale: « Temple » est la désignation française courante; la majuscule identifie le Temple de Jérusalem. Une note précise que ἱερόν désigne ici l’ensemble du complexe et de ses cours.
- source_word: ἀκούειν αὐτοῦ
  choice: pour l’écouter
  rationale: L’infinitif marque le but. Dans ce contexte d’enseignement, « écouter » est plus idiomatique que le simple « entendre » et rend l’attention portée aux paroles de Jésus.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. L’imparfait « venait » restitue la valeur habituelle du grec; « auprès de lui » garde le mouvement vers Jésus sans répéter son nom.
