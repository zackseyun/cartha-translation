  text: ἀρχομένων δὲ τούτων γίνεσθαι ἀνακύψατε καὶ ἐπάρατε τὰς κεφαλὰς ὑμῶν, διότι ἐγγίζει ἡ ἀπολύτρωσις ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/028.yaml
  text: But when these things begin to happen[a], straighten up and lift up your heads[c][b], because your redemption is drawing near.
translation:
  language: fr
  text: Mais quand ces choses commenceront à se produire[a], redressez-vous[b] et relevez la tête, car votre rédemption[c] approche.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « lorsque ces choses commenceront à arriver ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « levez les yeux ». Le verbe peut évoquer le fait de se redresser ou de regarder vers le haut.'
    reason: lexical_alternative
  - marker: c
    text: « Rédemption » peut aussi se traduire par « délivrance » ; le terme désigne ici une délivrance à venir.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρχομένων δὲ τούτων γίνεσθαι
  choice: Mais quand ces choses commenceront à se produire
  rationale: La construction au génitif absolu exprime une circonstance temporelle. « Quand » convient au contexte prospectif, tandis que « commenceront à se produire » rend à la fois l’idée de commencement et celle d’événements qui adviennent. « Mais » marque la transition entre la détresse précédente et l’encouragement qui suit.
- source_word: ἀνακύψατε
  choice: redressez-vous
  rationale: Le verbe évoque le fait de se redresser après avoir été courbé et, par extension, de reprendre courage. Cette formulation conserve l’image corporelle sans la réduire au seul fait de regarder vers le haut.
- source_word: ἐπάρατε τὰς κεφαλὰς ὑμῶν
  choice: relevez la tête
  rationale: Cette expression française naturelle conserve l’image d’une posture confiante. Le singulier collectif « la tête » est idiomatique en français pour une exhortation adressée à plusieurs personnes.
- source_word: διότι
  choice: car
  rationale: « Car » exprime clairement la cause tout en maintenant un registre digne et fluide.
- source_word: ἐγγίζει
  choice: approche
  rationale: Le présent indique que la rédemption se rapproche. « Approche » restitue ce mouvement vers la proximité sans l’interpréter comme déjà pleinement accompli.
- source_word: ἀπολύτρωσις
  choice: rédemption
  rationale: « Rédemption » conserve la profondeur salvatrice et libératrice du terme grec. La note signale « délivrance » comme équivalent possible sans réduire le sens à un simple secours immédiat.
theological_decisions:
- issue: Sens de « votre rédemption » dans le discours eschatologique
  choice: Conserver « votre rédemption », dans le sens d’une délivrance salvatrice qui approche.
  alternative: « Votre délivrance », comprise soit comme un secours historique immédiat, soit dans un sens plus général.
  rationale: Le contexte est futur et eschatologique, mais le verset ne précise pas ici le mécanisme ni toutes les dimensions de cette rédemption. Le terme traditionnel conserve cette densité sans imposer une explication doctrinale supplémentaire.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve les images corporelles du grec, avec le singulier collectif idiomatique « la tête ». Les notes préservent les principales possibilités lexicales sans surcharger le texte.
