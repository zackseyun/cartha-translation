source:
  edition: SBLGNT
  text: ⸀πάντες γὰρ οὗτοι ἐκ τοῦ περισσεύοντος αὐτοῖς ἔβαλον εἰς τὰ ⸀δῶρα, αὕτη δὲ ἐκ τοῦ ὑστερήματος αὐτῆς ⸀πάντα τὸν βίον ὃν εἶχεν ἔβαλεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/004.yaml
  text: For all these gave into the gifts out of their abundance, but she, out of her lack, put in all the livelihood she had.
translation:
  language: fr
  text: Car tous ceux-là ont fait des offrandes de leur superflu[a] ; mais elle, de son dénuement[b], a donné tout ce qu’elle avait pour vivre[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les dons » ; dans ce contexte, il s’agit d’offrandes faites au Temple.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « de sa pauvreté », « de son manque » ou « de ce qui lui manquait ».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « toute sa subsistance » ou « tous ses moyens de subsistance » ; il ne s’agit pas de « toute sa vie » au sens de son existence entière.'
    reason: lexical_clarification
lexical_decisions:
- source_word: πάντες γὰρ οὗτοι
  choice: Car tous ceux-là
  rationale: « Car » conserve le lien explicatif de γάρ avec le verset précédent, et « tous ceux-là » rend naturellement πάντες οὗτοι.
- source_word: ἐκ τοῦ περισσεύοντος αὐτοῖς
  choice: ont pris sur leur superflu
  rationale: Cette formulation française exprime une contribution prélevée sur ce qu’ils avaient en excédent et maintient le contraste avec le dénuement de la veuve.
- source_word: ἔβαλον εἰς τὰ δῶρα
  choice: pour déposer quelque chose parmi les offrandes
  rationale: ἔβαλον évoque concrètement l’action de déposer, tandis que δῶρα désigne ici les dons faits dans le cadre du Temple. « Offrandes » est plus naturel en français que le littéral « dons » dans cette construction.
- source_word: αὕτη δὲ
  choice: mais elle
  rationale: Le pronom renvoie clairement à la veuve du contexte, et « mais » marque le contraste exprimé par δέ.
- source_word: ἐκ τοῦ ὑστερήματος αὐτῆς
  choice: malgré son dénuement
  rationale: ὑστέρημα désigne ici l’état de manque ou de privation. « Malgré » rend idiomatiquement le paradoxe de donner à partir d’une situation de manque, sans atténuer le contraste.
- source_word: πάντα τὸν βίον ὃν εἶχεν
  choice: tout ce qu’elle avait pour vivre
  rationale: Dans ce contexte monétaire, βίος désigne les ressources nécessaires à la subsistance, non la vie entière au sens existentiel. La formulation est claire et courante en français moderne.
- source_word: ἔβαλεν
  choice: a déposé
  rationale: Le verbe conserve l’image concrète du dépôt des pièces tout en restant naturel dans le contexte.
theological_decisions:
- issue: Sens de βίος dans le don de la veuve
  choice: Les ressources matérielles dont elle disposait pour vivre
  alternative: Toute sa vie
  rationale: Le contexte porte sur un don d’argent, et βίος peut désigner les moyens de subsistance. Traduire par « toute sa vie » risquerait de suggérer qu’elle a donné son existence même.
- issue: Référence de τὰ δῶρα
  choice: Les offrandes
  alternative: Les dons ; le trésor du Temple
  rationale: Le terme désigne littéralement des dons, mais le contexte du Temple en fait des offrandes. La traduction n’ajoute pas la précision non exprimée « trésor du Temple ».
- issue: Force de ἐκ τοῦ ὑστερήματος
  choice: malgré son dénuement
  alternative: sur son nécessaire ; dans sa pauvreté
  rationale: La formulation retenue exprime une situation réelle de privation sans définir plus précisément que le grec la nature ou le degré de cette pauvreté.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme oppose nettement le superflu des autres au dénuement de la veuve. La phrase évite le calque peu naturel « jeter dans les dons » tout en conservant l’acte concret de déposer.
