lexical_decisions:
- source_word: εἶδεν
  choice: il vit
  rationale: L’aoriste de ὁράω décrit simplement la perception dans le fil du récit; « il vit » est direct et naturel.
- source_word: δέ
  choice: aussi
  rationale: Dans ce contexte, δέ assure une transition légère et met cette veuve à la suite des riches observés au verset précédent. « Aussi » rend naturellement cette continuité sans créer un contraste trop marqué.
- source_word: τινα
  choice: une
  rationale: Le pronom indéfini introduit une personne non identifiée; en français courant, l’article indéfini suffit.
- source_word: χήραν
  choice: veuve
  rationale: Équivalent direct de χήρα, qui conserve la situation sociale importante dans le contexte.
- source_word: πενιχράν
  choice: pauvre
  rationale: Le terme indique des moyens très modestes. « Pauvre » est clair et exact, tandis que « indigente » ou « misérable » pourrait surinterpréter son degré de dénuement.
- source_word: βάλλουσαν
  choice: qui mettait
  rationale: Dans le contexte d’une offrande déposée dans le trésor, « mettait » exprime idiomatiquement l’action sans la littéralité maladroite de « jetait ».
- source_word: ἐκεῖ
  choice: y
  rationale: Le pronom adverbial « y » renvoie naturellement en français au lieu mentionné dans le contexte précédent.
- source_word: λεπτὰ δύο
  choice: deux petites pièces de cuivre
  rationale: Les λεπτά étaient de très petites monnaies de cuivre et de faible valeur. Cette formulation accessible communique leur nature sans employer le terme technique « lepta » dans le texte.
