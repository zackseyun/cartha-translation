source:
  edition: SBLGNT
  text: Προσέχετε δὲ ἑαυτοῖς μήποτε βαρηθῶσιν ⸂ὑμῶν αἱ καρδίαι⸃ ἐν κραιπάλῃ καὶ μέθῃ καὶ μερίμναις βιωτικαῖς, καὶ ⸂ἐπιστῇ ἐφ’ ὑμᾶς αἰφνίδιος⸃ ἡ ἡμέρα ἐκείνη
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/034.yaml
  text: But watch yourselves[a], lest your hearts be weighed down with dissipation and drunkenness and the worries of life, and that day come upon you suddenly
translation:
  language: fr
  text: Mais prenez garde à vous-mêmes, de peur que vos cœurs ne s’alourdissent dans les excès[a], l’ivresse et les soucis de la vie, et que ce jour-là ne survienne sur vous à l’improviste.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme grec peut désigner les excès liés à la boisson ainsi que leurs pénibles séquelles.
    reason: alternative lexicale et précision du champ sémantique
lexical_decisions:
- source_word: Προσέχετε δὲ ἑαυτοῖς
  choice: Mais prenez garde à vous-mêmes
  rationale: L’impératif appelle à une vigilance personnelle. « Prenez garde à vous-mêmes » conserve la force de l’avertissement et rend explicitement le pronom réfléchi.
- source_word: μήποτε
  choice: de peur que… ne
  rationale: Cette tournure française naturelle introduit l’éventualité négative que l’avertissement cherche à prévenir.
- source_word: βαρηθῶσιν … αἱ καρδίαι
  choice: vos cœurs ne s’alourdissent
  rationale: La formulation conserve la métaphore du cœur rendu lourd, tout en respectant le pluriel grec.
- source_word: κραιπάλῃ
  choice: les excès
  rationale: Le mot peut évoquer les excès liés à la boisson ainsi que leurs séquelles. « Les excès » préserve cette amplitude sans réduire le sens à la seule gueule de bois ni l’élargir à toute forme de débauche.
- source_word: μέθῃ
  choice: l’ivresse
  rationale: Équivalent direct et courant du nom grec désignant l’état d’ébriété.
- source_word: μερίμναις βιωτικαῖς
  choice: les soucis de la vie
  rationale: Cette expression claire couvre les préoccupations et inquiétudes de l’existence ordinaire sans ajouter une condamnation du monde matériel.
- source_word: ἐπιστῇ ἐφ’ ὑμᾶς
  choice: ne vienne … sur vous
  rationale: La tournure garde l’image de la venue du jour sur les destinataires sans accentuer indûment l’idée d’une attaque ou d’un jugement.
- source_word: αἰφνίδιος
  choice: soudain
  rationale: L’adjectif grec qualifie formellement « ce jour-là »; son sens se rend naturellement en français par un adverbe lié à sa venue.
- source_word: ἡ ἡμέρα ἐκείνη
  choice: ce jour-là
  rationale: La traduction conserve la désignation eschatologique implicite du texte sans ajouter « du jugement ».
theological_decisions:
- issue: Référence eschatologique de « ce jour-là »
  choice: ce jour-là
  alternative: ce jour-là, le jour du jugement
  rationale: Le contexte donne à l’expression sa portée eschatologique, mais le grec ne développe pas ici cette portée en une désignation doctrinale explicite.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve le mouvement de l’avertissement grec et la métaphore des cœurs qui s’alourdissent, sans explicitation doctrinale ajoutée.
