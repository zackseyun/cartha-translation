id: LUK.21.8
reference: Luke 21:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν· Βλέπετε μὴ πλανηθῆτε· πολλοὶ γὰρ ἐλεύσονται ἐπὶ τῷ ὀνόματί μου ⸀λέγοντες· Ἐγώ εἰμι καί· Ὁ καιρὸς ἤγγικεν· ⸀μὴ πορευθῆτε ὀπίσω αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/008.yaml
  text: And he said[a], “See that you are not led astray. For many will come in my name, saying, ‘I am he,’ and, ‘The time has drawn near.’ Do not go after them.”
translation:
  language: fr
  text: 'Il dit : « Veillez à ne pas vous laisser égarer. Car beaucoup viendront en mon nom et diront : “C’est moi”[a] et “Le temps est proche.” Ne les suivez pas. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou simplement : « Je suis »; il s’agit d’une personne qui prétend être celui qu’on attend, peut-être le Messie.'
    reason: alternative_reading
lexical_decisions:
- source_word: Βλέπετε μὴ πλανηθῆτε
  choice: Veillez à ne pas vous laisser égarer
  rationale: L’impératif appelle à la vigilance, tandis que la tournure pronominale passive conserve l’idée d’être entraîné loin de la vérité.
- source_word: ἐλεύσονται ἐπὶ τῷ ὀνόματί μου
  choice: viendront en mon nom
  rationale: Cette expression naturelle en français conserve l’appel revendiqué au nom, à l’autorité ou à l’identité de Jésus sans préciser davantage.
- source_word: λέγοντες
  choice: diront
  rationale: Le verbe reste neutre et laisse le contenu des paroles manifester leur caractère trompeur.
- source_word: Ἐγώ εἰμι
  choice: C’est moi
  rationale: Dans ce contexte, cette formulation française exprime naturellement une revendication d’identité tout en évitant d’ajouter explicitement « le Messie », absent du grec.
- source_word: Ὁ καιρὸς ἤγγικεν
  choice: Le temps est proche
  rationale: « Le temps » peut désigner ici le moment décisif ou fixé; le parfait grec exprime une proximité désormais actuelle, rendue naturellement par « est proche ».
- source_word: μὴ πορευθῆτε ὀπίσω αὐτῶν
  choice: Ne les suivez pas
  rationale: Cette formulation française claire restitue l’interdiction de se rallier à ces personnes ou de marcher à leur suite.
theological_decisions:
- issue: Sens de Ἐγώ εἰμι dans la bouche de faux prétendants
  choice: C’est moi
  alternative: Je suis; Je suis le Messie
  rationale: Le contexte suggère une revendication d’identité attendue, possiblement messianique, mais le grec ne nomme pas explicitement le Messie. Le texte garde donc une formulation concise et la note préserve l’ambiguïté.
translation_notes:
  register: Français international moderne, naturel et digne. « Veillez » maintient le ton d’avertissement; « C’est moi » est idiomatique sans effacer l’ambiguïté, explicitée en note.
