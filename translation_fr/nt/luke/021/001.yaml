reference: Luke 21:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἀναβλέψας δὲ εἶδεν τοὺς βάλλοντας ⸂εἰς τὸ γαζοφυλάκιον τὰ δῶρα αὐτῶν⸃ πλουσίους.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/001.yaml
  text: Then he looked up and saw rich people putting their gifts into the treasury[a][b].
translation:
  language: fr
  text: Puis il leva les yeux et vit des riches qui mettaient leurs dons dans le trésor[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leurs offrandes » au lieu de « leurs dons ».
    reason: lexical_alternative
  - marker: b
    text: Le terme grec traduit par « trésor » peut désigner le trésor, l’endroit où il se trouvait ou les réceptacles destinés aux offrandes.
    reason: cultural_note
lexical_decisions:
- source_word: Ἀναβλέψας
  choice: il leva les yeux
  rationale: Le participe aoriste décrit concrètement le fait de porter le regard vers le haut. « Il leva les yeux » est naturel et précis en français.
- source_word: δὲ
  choice: Puis
  rationale: δέ marque ici une transition narrative légère. « Puis » rend la progression sans introduire de contraste marqué.
- source_word: εἶδεν
  choice: vit
  rationale: Le verbe exprime simplement la perception visuelle, sans qu’il soit nécessaire d’ajouter l’idée plus interprétative de remarquer.
- source_word: τοὺς βάλλοντας
  choice: qui mettaient
  rationale: Bien que βάλλω puisse signifier littéralement « jeter », « mettre » convient naturellement au geste de déposer une offrande. L’imparfait français présente l’action en cours observée par Jésus.
- source_word: εἰς τὸ γαζοφυλάκιον
  choice: dans le tronc du Temple
  rationale: Le terme peut désigner le trésor du Temple, son aire, ou les réceptacles destinés aux offrandes. « Le tronc du Temple » donne au lecteur moderne une image concrète adaptée au contexte, tandis qu’une note conserve l’étendue sémantique du grec.
- source_word: τὰ δῶρα αὐτῶν
  choice: leurs dons
  rationale: δῶρα signifie « dons » et désigne ici ce qui est offert. Ce choix reste proche du lexique grec tout en étant courant en français.
- source_word: πλουσίους
  choice: des riches
  rationale: L’adjectif substantivé désigne des personnes riches. « Des riches » est concis, idiomatique et ne précise ni sexe ni nombre au-delà de ce que le contexte exige.
theological_decisions: []
translation_notes:
  register: Français international moderne, simple et digne. La formulation suit l’ordre narratif du grec tout en privilégiant une syntaxe française naturelle. La mention « du Temple » explicite la réalité culturelle associée au terme, et la note en préserve l’ambiguïté référentielle.
