  text: ὡς παγίς· ⸂ἐπεισελεύσεται γὰρ⸃ ἐπὶ πάντας τοὺς καθημένους ἐπὶ πρόσωπον πάσης τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/035.yaml
  text: like a trap[c][b][a]. For it will come upon all those dwelling on the face of the whole earth.
translation:
  language: fr
  text: comme un piège[a]. Car il viendra sur tous ceux qui habitent à la surface de toute la terre[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « comme un lacet ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « sur la face de toute la terre ». Le mot grec peut aussi signifier « pays », mais « terre » convient mieux ici à la portée générale de l’expression.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς παγίς
  choice: comme un piège
  rationale: παγίς désigne un piège ou un lacet. « Piège » est naturel en français moderne et conserve l’image de quelque chose de soudain et d’inévitable.
- source_word: ἐπεισελεύσεται
  choice: il s’abattra sur
  rationale: Le futur de ἐπεισέρχομαι exprime ici la venue soudaine du jour mentionné au verset précédent sur les humains. « S’abattre sur » rend cette force en français sans expliciter davantage le sujet implicite.
- source_word: γὰρ
  choice: Car
  rationale: γάρ introduit la raison de l’avertissement précédent. « Car » en préserve clairement la valeur explicative et le registre solennel.
- source_word: ἐπὶ πάντας
  choice: sur tous
  rationale: ἐπί avec l’accusatif marque ici ce sur quoi vient l’événement; « sur tous » s’accorde naturellement avec « s’abattra ».
- source_word: τοὺς καθημένους
  choice: ceux qui habitent
  rationale: Bien que κάθημαι signifie littéralement « être assis », l’expression désigne idiomatiquement les personnes établies ou vivant sur la terre. « Habitent » communique ce sens sans traduction artificiellement littérale.
- source_word: ἐπὶ πρόσωπον πάσης τῆς γῆς
  choice: sur toute la surface de la terre
  rationale: Littéralement « sur la face de toute la terre », cette tournure d’influence sémitique signifie « sur toute la surface de la terre ». La formulation retenue reste imagée tout en étant naturelle en français.
theological_decisions:
- issue: Portée de γῆ dans cet avertissement eschatologique
  choice: la terre
  alternative: le pays / toute la contrée
  rationale: γῆ peut désigner la terre ou un pays. Avec πάντας et πάσης dans la formule « tous ceux qui habitent sur toute la surface de… », le contexte favorise ici une portée universelle, tout en signalant en note la possibilité lexicale plus restreinte.
- issue: Sujet implicite de ἐπεισελεύσεται
  choice: pronom « il », renvoyant au jour du verset précédent
  alternative: répéter explicitement « ce jour »
  rationale: Le grec laisse le sujet implicite mais le contexte immédiat l’identifie. Le pronom préserve la cohésion avec le verset précédent sans ajouter une répétition absente du texte source.
translation_notes:
  register: Français international moderne, digne et accessible. La traduction conserve l’image du piège et le lien explicatif marqué par γάρ, tout en rendant naturellement l’idiome relatif aux habitants de la terre.
