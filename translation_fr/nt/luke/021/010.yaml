  text: τότε ἔλεγεν αὐτοῖς· Ἐγερθήσεται ἔθνος ἐπ’ ἔθνος καὶ βασιλεία ἐπὶ βασιλείαν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/010.yaml
  text: Then he said to them[a], “Nation will rise against nation, and kingdom against kingdom,”
translation:
  language: fr
  text: 'Alors il leur dit : « Une nation se dressera contre une nation, et un royaume contre un royaume. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε
  choice: Alors
  rationale: Marqueur temporel et discursif qui relie naturellement cette parole au contexte précédent.
- source_word: ἔλεγεν
  choice: il leur dit
  rationale: L’imparfait grec introduit ici le discours direct; le passé simple est la tournure narrative française la plus naturelle sans surinterpréter l’aspect.
- source_word: αὐτοῖς
  choice: leur
  rationale: Le datif de destinataire s’exprime naturellement par le pronom indirect « leur ».
- source_word: Ἐγερθήσεται
  choice: se dressera
  rationale: Dans cette formule de conflit, le futur à valeur médio-passive évoque le fait de se lever en opposition; « se dressera » rend clairement cette nuance hostile.
- source_word: ἔθνος
  choice: nation
  rationale: Dans ce contexte géopolitique et en parallèle avec « royaume », le terme désigne une nation ou un peuple envisagé comme entité collective.
- source_word: ἐπ’ ἔθνος
  choice: contre une nation
  rationale: Avec l’accusatif, ἐπί exprime ici l’opposition hostile; « contre » en donne l’équivalent idiomatique.
- source_word: βασιλεία
  choice: royaume
  rationale: Le mot désigne ici un royaume ou domaine politique concret, plutôt que l’exercice abstrait de la royauté.
- source_word: ἐπὶ βασιλείαν
  choice: contre un royaume
  rationale: La répétition de « contre » conserve le parallélisme et le sens adversatif de la formule grecque.
theological_decisions:
- issue: Formule apocalyptique de conflit
  choice: Présenter la parole comme l’annonce directe de conflits entre collectivités politiques, sans préciser de système eschatologique.
  alternative: La limiter exclusivement à la chute de Jérusalem ou en faire un calendrier détaillé de la fin.
  rationale: Le verset énonce la montée de nations et de royaumes les uns contre les autres, mais ne tranche pas à lui seul les débats sur la portée chronologique de cette annonce.
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme de la formule grecque est conservé. Aucune note n’est nécessaire, car « se dressera » exprime adéquatement le sens contextuel de Ἐγερθήσεται sans effacer une ambiguïté théologiquement significative.
