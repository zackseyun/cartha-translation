id: LUK.21.27
reference: Luke 21:27
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ τότε ὄψονται τὸν υἱὸν τοῦ ἀνθρώπου ἐρχόμενον ἐν νεφέλῃ μετὰ δυνάμεως καὶ δόξης πολλῆς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/027.yaml
  text: And then they will see the Son of Man coming in a cloud with power and great glory[a].
translation:
  language: fr
  text: Et alors, ils verront le Fils de l’homme venir dans une nuée[a], avec puissance et une grande gloire.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sur une nuée ». Le grec emploie le singulier et dit littéralement « dans une nuée », tandis que l’image fait écho à Daniel 7 et à des passages apparentés où le Fils de l’homme vient avec les nuées.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὄψονται
  choice: ils verront
  rationale: Le futur de ὁράω exprime ici une perception visuelle à venir. « Ils verront » est direct, naturel et fidèle, sans ajouter de solennité étrangère au texte.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: le Fils de l’homme
  rationale: Cette formulation française établie conserve la valeur de titre de l’expression ainsi que son écho à Daniel 7.
- source_word: ἐρχόμενον
  choice: venir
  rationale: Après « verront », l’infinitif français rend naturellement le participe présent grec décrivant le Fils de l’homme au moment de sa venue.
- source_word: ἐν νεφέλῃ
  choice: dans une nuée
  rationale: Le grec emploie ἐν avec un nom singulier. « Dans une nuée » suit cette formulation et garde le registre théophanique; « nuée » convient mieux que « nuage » à cette image biblique solennelle.
- source_word: μετὰ δυνάμεως
  choice: avec puissance
  rationale: μετά avec le génitif indique ici l’accompagnement. « Avec puissance » est une formulation française concise et traditionnelle qui reste claire aujourd’hui.
- source_word: δόξης πολλῆς
  choice: une grande gloire
  rationale: Cette expression rend idiomatiquement l’intensité de πολλῆς appliquée à δόξης et conserve le registre élevé du passage.
theological_decisions:
- issue: Traduction du titre christologique τὸν υἱὸν τοῦ ἀνθρώπου
  choice: le Fils de l’homme
  alternative: l’Humain
  rationale: « Le Fils de l’homme » préserve le titre reconnu, son usage dans les Évangiles et sa résonance avec Daniel 7, sans réduire sa portée à une paraphrase interprétative.
- issue: Image de la nuée et résonance daniélique/théophanique
  choice: dans une nuée
  alternative: sur une nuée
  rationale: La traduction suit le singulier νεφέλῃ et le sens premier de ἐν, plutôt que d’harmoniser la formulation avec Daniel 7 ou d’autres passages. La note signale l’autre possibilité réelle.
translation_notes:
  register: Français international moderne, clair et digne. « Nuée » maintient la tonalité biblique et théophanique sans archaïsme excessif; la syntaxe demeure naturelle à l’oral comme à l’écrit.
