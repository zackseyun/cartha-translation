id: LUK.21.21
reference: Luke 21:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τότε οἱ ἐν τῇ Ἰουδαίᾳ φευγέτωσαν εἰς τὰ ὄρη, καὶ οἱ ἐν μέσῳ αὐτῆς ἐκχωρείτωσαν, καὶ οἱ ἐν ταῖς χώραις μὴ εἰσερχέσθωσαν εἰς αὐτήν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/021.yaml
  text: Then let those in Judea flee to the mountains[a], and let those in the midst of her depart, and let those in the countryside not enter into her.
translation:
  language: fr
  text: Alors, que ceux qui sont en Judée fuient vers les montagnes, que ceux qui sont dans Jérusalem[a] en sortent, et que ceux qui sont dans les campagnes n’y entrent pas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ceux qui sont au milieu d’elle ». Le pronom féminin grec renvoie, dans le contexte, à Jérusalem.'
    reason: Clarification du référent pronominal et conservation de la forme littérale en note.
lexical_decisions:
- source_word: τότε
  choice: Alors
  rationale: Marque naturellement en français la succession temporelle avec les signes évoqués juste avant.
- source_word: οἱ ἐν τῇ Ἰουδαίᾳ
  choice: ceux qui sont en Judée
  rationale: Rend directement le groupe substantivé désignant les personnes présentes en Judée.
- source_word: φευγέτωσαν εἰς τὰ ὄρη
  choice: fuient vers les montagnes
  rationale: Le subjonctif exhortatif après « que » transmet l’impératif grec de troisième personne; « vers » exprime naturellement la destination.
- source_word: οἱ ἐν μέσῳ αὐτῆς
  choice: ceux qui sont dans Jérusalem
  rationale: Le référent contextuel du pronom féminin est explicité, car une traduction littérale par « en elle » serait obscure et peu naturelle en français.
- source_word: ἐκχωρείτωσαν
  choice: en sortent
  rationale: Dans ce contexte d’évacuation, le verbe indique qu’il faut quitter le lieu; le pronom « en » reprend Jérusalem sans lourdeur.
- source_word: οἱ ἐν ταῖς χώραις
  choice: ceux qui sont dans les campagnes
  rationale: Le pluriel « les campagnes » désigne naturellement les zones rurales environnantes et conserve le pluriel grec.
- source_word: μὴ εἰσερχέσθωσαν εἰς αὐτήν
  choice: n’y entrent pas
  rationale: Le subjonctif négatif coordonné conserve la force prohibitive de l’impératif grec; « y » reprend naturellement Jérusalem.
theological_decisions:
- issue: Référent des pronoms αὐτῆς et αὐτήν
  choice: Identifier Jérusalem dans le texte principal, puis la reprendre par « en » et « y ».
  alternative: Conserver une personnification féminine littérale avec « en elle » et « entrer en elle ».
  rationale: Le contexte immédiat désigne Jérusalem. Contrairement à l’anglais, le français n’emploie pas ici naturellement un pronom personnel féminin pour personnifier une ville; l’explicitation clarifie le référent sans modifier le sens ni résoudre une tension doctrinale.
translation_notes:
  register: Français international moderne, digne et accessible. La construction répétée « que… » maintient le parallélisme et la force des impératifs de troisième personne. « Jérusalem » est explicitée pour éviter l’ambiguïté française entre la Judée et la ville.
