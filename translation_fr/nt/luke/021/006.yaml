source:
  edition: SBLGNT
  text: Ταῦτα ἃ θεωρεῖτε, ἐλεύσονται ἡμέραι ἐν αἷς οὐκ ἀφεθήσεται λίθος ἐπὶ ⸀λίθῳ ὃς οὐ καταλυθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/006.yaml
  text: As for these things that you are looking at[b][a], days will come in which not one stone will be left upon another that will not be torn down.
translation:
  language: fr
  text: 'Ces choses que vous voyez[a] : des jours viendront où il ne restera pas pierre sur pierre qui ne soit démolie[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « que vous observez ». Le verbe grec peut désigner le simple fait de voir ou, plus précisément, celui de regarder attentivement.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « il ne sera pas laissé pierre sur pierre qui ne soit démolie », expression soulignant la destruction complète.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτα ἃ θεωρεῖτε
  choice: Quant à ce que vous contemplez
  rationale: La tournure « Quant à » restitue la mise en relief de Ταῦτα, tandis que « contemplez » exprime ici l'observation attentive suggérée par θεωρεῖτε, dans un registre naturel et digne.
- source_word: ἐλεύσονται ἡμέραι
  choice: des jours viendront
  rationale: Cette formulation française conserve l'idiome grec et sa valeur d'annonce future sans ajouter d'article absent du texte.
- source_word: ἐν αἷς
  choice: où
  rationale: Le relatif temporel « où » est plus naturel en français que le calque « dans lesquels », tout en gardant le même rapport temporel.
- source_word: οὐκ ἀφεθήσεται λίθος ἐπὶ λίθῳ
  choice: il ne restera pas pierre sur pierre
  rationale: Cette expression française idiomatique correspond à l'image grecque et indique une destruction complète.
- source_word: ὃς οὐ καταλυθήσεται
  choice: tout sera démoli
  rationale: Le grec précise qu'aucune pierre ne restera sans être abattue. La formulation explicite la portée distributive de la relative sans suggérer autre chose que la démolition des constructions visibles.
theological_decisions:
- issue: Portée de la prédiction concernant les constructions du Temple
  choice: Présenter une annonce concrète de leur destruction totale
  alternative: Interpréter principalement l'énoncé comme un symbole ou le rattacher explicitement à un système eschatologique particulier
  rationale: Le verset décrit directement le démantèlement des structures observées. La traduction en conserve la force concrète sans imposer de cadre doctrinal extérieur.
translation_notes:
  register: Français international moderne, clair et digne. « Contemplez » garde l'idée d'une observation soutenue sans archaïsme marqué. Les deux-points rendent naturellement en français l'intensification portée par la proposition relative grecque.
