lexical_decisions:
- source_word: Καὶ
  choice: Puis
  rationale: Dans la continuité narrative, « Puis » rend naturellement la coordination grecque sans alourdir la phrase.
- source_word: εἶπεν παραβολὴν αὐτοῖς
  choice: il leur dit une parabole
  rationale: Cette formulation française est naturelle et conserve directement le verbe « dire », le destinataire et le terme littéraire traditionnel « parabole ».
- source_word: Ἴδετε
  choice: Regardez
  rationale: L’impératif appelle les auditeurs à porter leur attention sur l’exemple visible; « Regardez » est direct et courant.
- source_word: τὴν συκῆν
  choice: le figuier
  rationale: Le nom désigne l’arbre lui-même; « le figuier » est l’équivalent français précis.
- source_word: πάντα τὰ δένδρα
  choice: tous les arbres
  rationale: La traduction reste proche du grec et n’ajoute pas « autres », terme seulement implicite dans le contexte.
