id: LUK.21.5
reference: Luke 21:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καί τινων λεγόντων περὶ τοῦ ἱεροῦ, ὅτι λίθοις καλοῖς καὶ ἀναθήμασιν κεκόσμηται εἶπεν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/005.yaml
  text: And as some were speaking about the temple[a], that it had been adorned with beautiful stones and votive offerings, he said[b],
translation:
  language: fr
  text: 'Alors que certains parlaient du temple[a], disant qu’il était orné de belles pierres et de dons consacrés[b], il dit :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot grec désigne ici l’ensemble du temple et de son enceinte, et non seulement le sanctuaire intérieur.
    reason: cultural_note
  - marker: b
    text: 'Ou « d’offrandes votives » : il s’agit de dons offerts à Dieu et exposés dans le temple.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τινων λεγόντων
  choice: Comme certains parlaient
  rationale: Le génitif absolu exprime ici une circonstance temporelle concomitante. Cette formulation naturelle conserve l’aspect duratif de λεγόντων.
- source_word: τοῦ ἱεροῦ
  choice: du temple
  rationale: ἱερόν désigne globalement le temple et son enceinte, non le seul sanctuaire intérieur. « Temple » est le terme français courant, la précision étant donnée en note.
- source_word: λίθοις καλοῖς
  choice: de belles pierres
  rationale: καλοῖς souligne la beauté et la qualité impressionnante des pierres ; « belles pierres » restitue simplement cette appréciation.
- source_word: ἀναθήμασιν
  choice: de dons consacrés
  rationale: Le terme désigne des objets offerts à Dieu et exposés dans le temple. « Dons consacrés » est plus immédiatement compréhensible en français courant que « offrandes votives », tout en conservant la dimension cultuelle.
- source_word: κεκόσμηται
  choice: était orné
  rationale: Le parfait passif présente le temple dans l’état résultant de son ornementation. L’imparfait français décrit naturellement cet état dans le discours indirect.
- source_word: εἶπεν
  choice: il dit
  rationale: Le grec n’explicite pas le nom de Jésus ; le pronom maintient la continuité du récit sans ajout.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. La phrase conserve le mouvement du grec et se termine par deux-points, puisque les paroles de Jésus suivent au verset suivant.
