id: LUK.21.36
reference: Luke 21:36
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀγρυπνεῖτε ⸀δὲ ἐν παντὶ καιρῷ δεόμενοι ἵνα ⸀κατισχύσητε ἐκφυγεῖν ⸀ταῦτα πάντα τὰ μέλλοντα γίνεσθαι, καὶ σταθῆναι ἔμπροσθεν τοῦ υἱοῦ τοῦ ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/036.yaml
  text: But stay awake at all times[a], praying that you may have strength to escape all these things that are about to happen[c][b], and to stand before the Son of Man.
translation:
  language: fr
  text: Mais restez éveillés en tout temps, en priant afin d’avoir la force[a] d’échapper à toutes ces choses qui vont arriver[b], et de vous tenir debout devant le Fils de l’homme[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Certains manuscrits ont : « afin d’être jugés dignes d’échapper à toutes ces choses », au lieu de : « afin d’avoir la force d’échapper à toutes ces choses ».'
    reason: textual_variant
  - marker: b
    text: 'Ou : « qui sont sur le point de se produire ».'
    reason: lexical_alternative
  - marker: c
    text: L’expression « vous tenir debout devant le Fils de l’homme » peut suggérer que l’on se tient devant lui en étant accepté ou reconnu juste, mais le grec laisse cette idée implicite.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγρυπνεῖτε
  choice: restez éveillés
  rationale: L’impératif appelle à une vigilance constante tout en conservant l’image concrète de l’éveil.
- source_word: δὲ
  choice: Mais
  rationale: La conjonction marque ici une légère opposition avec les avertissements précédents.
- source_word: ἐν παντὶ καιρῷ
  choice: en tout temps
  rationale: Cette formulation naturelle rend la portée distributive et continue de l’expression grecque.
- source_word: δεόμενοι
  choice: en priant
  rationale: Le participe désigne une prière de demande; « en priant » exprime naturellement la manière dont les disciples doivent rester vigilants.
- source_word: ἵνα κατισχύσητε
  choice: pour avoir la force
  rationale: κατισχύω signifie être assez fort ou parvenir à l’emporter. Cette traduction s’accorde avec les deux infinitifs qui suivent sans introduire l’idée de mérite propre à une variante textuelle.
- source_word: ἐκφυγεῖν
  choice: d’échapper
  rationale: Le verbe exprime le fait de se soustraire effectivement aux événements annoncés.
- source_word: ταῦτα πάντα τὰ μέλλοντα γίνεσθαι
  choice: tout ce qui va arriver
  rationale: Cette tournure française naturelle rend l’ensemble des événements futurs annoncés, sans imposer au verbe μέλλω une nuance exclusive d’imminence ou de nécessité.
- source_word: σταθῆναι
  choice: vous tenir debout
  rationale: La formulation conserve l’image de la station debout devant le Fils de l’homme sans expliciter si elle implique acceptation, acquittement ou fermeté.
- source_word: ἔμπροσθεν
  choice: devant
  rationale: « Devant » exprime simplement et naturellement la relation spatiale et personnelle indiquée par le grec.
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: le Fils de l’homme
  rationale: C’est la traduction française établie de ce titre, qui en préserve l’arrière-plan sémitique et la portée christologique.
theological_decisions:
- issue: Sens de κατισχύσητε dans le contexte de l’épreuve eschatologique
  choice: avoir la force
  alternative: être jugés dignes
  rationale: Le texte du SBLGNT porte κατισχύσητε, qui exprime la force suffisante ou la capacité de l’emporter, et non la dignité. La variante textuelle est signalée en note en raison de son incidence interprétative.
- issue: Portée de σταθῆναι ἔμπροσθεν τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: vous tenir debout devant le Fils de l’homme
  alternative: être accueillis favorablement devant le Fils de l’homme
  rationale: L’expression peut suggérer l’acceptation ou la justification lors du jugement, mais le grec ne le dit pas explicitement. Le texte principal conserve donc l’image et son ambiguïté théologique.
- issue: Nuance temporelle de μέλλοντα γίνεσθαι
  choice: qui va arriver
  alternative: qui est sur le point d’arriver
  rationale: La construction peut exprimer soit le futur attendu, soit une certaine imminence. La traduction retenue demeure naturelle sans trancher excessivement entre ces nuances.
translation_notes:
  register: Français international moderne, clair et digne. « Restez éveillés » conserve la métaphore concrète de la vigilance; « tout ce qui va arriver » évite une tournure littérale maladroite; « vous tenir debout » préserve l’image judiciaire ou eschatologique sans l’interpréter dans le texte principal.
