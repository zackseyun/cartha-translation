  text: καὶ τοῦτο ποιήσαντες συνέκλεισαν πλῆθος ἰχθύων πολύ, ⸀διερρήσσετο δὲ ⸂τὰ δίκτυα⸃ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/006.yaml
  text: And when they had done this[a], they enclosed a great multitude of fish[b], and their nets were tearing.
translation:
  language: fr
  text: Après avoir fait cela, ils enfermèrent dans leurs filets une grande quantité de poissons, et leurs filets commençaient à se déchirer.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leurs filets se déchiraient ». L’imparfait grec décrit une déchirure en cours, sans nécessairement indiquer que les filets se sont complètement rompus.
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιήσαντες
  choice: Après avoir fait cela
  rationale: Le participe aoriste exprime ici une action antérieure à celle du verbe principal. Cette tournure restitue naturellement la succession des actions.
- source_word: συνέκλεισαν
  choice: ils prirent dans leurs filets
  rationale: Le verbe signifie littéralement « enfermer, cerner ». Dans ce contexte de pêche, la formulation choisie reste naturelle tout en conservant l'image des poissons entourés par les filets.
- source_word: πλῆθος ἰχθύων πολύ
  choice: une si grande quantité de poissons
  rationale: Cette expression rend l'abondance fortement soulignée par πλῆθος et πολύ et prépare naturellement la conséquence introduite en français par « que ».
- source_word: διερρήσσετο
  choice: commençaient à se déchirer
  rationale: L'imparfait grec présente la déchirure comme un processus en cours, sans affirmer que les filets se sont entièrement rompus.
- source_word: τὰ δίκτυα αὐτῶν
  choice: leurs filets
  rationale: Le possessif est idiomatique en français et le pluriel explicite du grec est conservé.
