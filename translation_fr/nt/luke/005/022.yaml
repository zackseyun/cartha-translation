reference: Luke 5:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐπιγνοὺς δὲ ὁ Ἰησοῦς τοὺς διαλογισμοὺς αὐτῶν ἀποκριθεὶς εἶπεν πρὸς αὐτούς· Τί διαλογίζεσθε ἐν ταῖς καρδίαις ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/022.yaml
  text: But Jesus[a], perceiving their thoughts, answered and said to them, “Why are you reasoning in your hearts?”
translation:
  language: fr
  text: 'Mais Jésus, discernant leurs raisonnements[a], leur répondit : « Pourquoi raisonnez-vous dans vos cœurs ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « connaissant leurs raisonnements ».
    reason: Alternative lexicale pour ἐπιγνούς ; « connaissant » exprime la prise de connaissance sans préciser le moyen.
lexical_decisions:
- source_word: ἐπιγνοὺς
  choice: discernant
  rationale: Le participe aoriste de ἐπιγινώσκω exprime ici la pleine conscience que Jésus a de leur activité intérieure. « Discernant » reste naturel en français et n’explique pas par quel moyen il la connaît.
- source_word: δὲ
  choice: Mais
  rationale: 'δέ marque une légère transition contrastive : Jésus réagit aux objections intérieures évoquées dans le contexte.'
- source_word: τοὺς διαλογισμοὺς αὐτῶν
  choice: leurs raisonnements
  rationale: διαλογισμός désigne ici leurs réflexions ou délibérations intérieures. « Raisonnements » conserve aussi le lien lexical avec le verbe διαλογίζεσθε.
- source_word: ἀποκριθεὶς εἶπεν πρὸς αὐτούς
  choice: leur répondit
  rationale: La tournure grecque « ayant répondu, il leur dit » est une formule narrative. « Leur répondit » en rend le sens avec dignité et naturel, sans lourdeur en français moderne.
- source_word: Τί
  choice: Pourquoi
  rationale: Dans cette question, τί porte sur la raison de leur délibération intérieure ; « Pourquoi » est donc l’équivalent idiomatique français.
- source_word: διαλογίζεσθε
  choice: raisonnez-vous ainsi
  rationale: Le présent exprime une activité mentale en cours. « Raisonnez-vous » préserve le processus délibératif et l’écho avec « raisonnements » ; « ainsi » renvoie naturellement aux raisonnements déjà mentionnés sans en préciser le contenu.
- source_word: ἐν ταῖς καρδίαις ὑμῶν
  choice: dans vos cœurs
  rationale: La formule biblique désigne l’être intérieur, notamment le siège de la pensée et de la volonté. La conserver évite de réduire καρδία à la seule émotion selon l’usage moderne.
theological_decisions:
- issue: Nature de la connaissance qu’a Jésus des pensées intérieures d’autrui
  choice: Affirmer simplement que Jésus discerne leurs raisonnements, sans préciser le mode de cette connaissance.
  alternative: Expliciter une connaissance surnaturelle, ou au contraire présenter Jésus comme déduisant ou devinant leurs pensées.
  rationale: Le texte affirme que Jésus connaît leur délibération intérieure, mais n’explique pas comment. La traduction préserve cette retenue et la tension théologique du passage.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste fluide tout en conservant l’image biblique des « cœurs » et l’écho entre le nom διαλογισμούς et le verbe διαλογίζεσθε.
