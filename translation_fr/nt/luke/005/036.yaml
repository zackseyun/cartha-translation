id: LUK.5.36
reference: Luke 5:36
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἔλεγεν δὲ καὶ παραβολὴν πρὸς αὐτοὺς ὅτι Οὐδεὶς ἐπίβλημα ⸀ἀπὸ ἱματίου καινοῦ ⸀σχίσας ἐπιβάλλει ἐπὶ ἱμάτιον παλαιόν· εἰ δὲ μήγε, καὶ τὸ καινὸν ⸀σχίσει καὶ τῷ παλαιῷ οὐ ⸂συμφωνήσει τὸ ἐπίβλημα⸃ τὸ ἀπὸ τοῦ καινοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/036.yaml
  text: 'He was also telling them a parable: “No one tears a patch from a new garment and puts it on an old garment[a]. Otherwise, he will tear the new one[b], and the patch from the new will not match the old.”'
translation:
  language: fr
  text: 'Il leur disait aussi cette parabole : « Personne ne déchire une pièce d’un vêtement neuf pour la mettre sur un vieux vêtement.[a] Sinon, il déchirera le vêtement neuf, et la pièce prise du vêtement neuf ne s’accordera pas avec le vieux vêtement.[b] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « Personne, après avoir déchiré une pièce d’un vêtement neuf, ne la met sur un vieux vêtement. » Le grec emploie un participe aoriste, « ayant déchiré », avant le verbe principal.'
    reason: lexical_alternative
  - marker: b
    text: « Ne s’accordera pas » peut aussi se traduire par « ne conviendra pas » ou « ne sera pas assortie ». Le verbe grec peut évoquer l’absence de correspondance, d’adaptation ou de convenance entre la pièce neuve et le vieux vêtement.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν δὲ καὶ
  choice: Il leur disait aussi
  rationale: L’imparfait ἔλεγεν est rendu par « disait », qui conserve l’aspect duratif du récit. « Aussi » exprime καί, tandis que δέ assure ici une transition discrète.
- source_word: παραβολὴν
  choice: cette parabole
  rationale: « Parabole » est le terme français courant pour ce genre d’enseignement imagé. Le démonstratif « cette » introduit naturellement la parole citée sans modifier son sens.
- source_word: ἐπίβλημα
  choice: une pièce
  rationale: Dans le contexte d’un vêtement, il s’agit d’un morceau destiné à servir de pièce de réparation. « Une pièce » est idiomatique en français et évite la formulation moins naturelle « un patch ».
- source_word: ἀπὸ ἱματίου καινοῦ
  choice: d’un vêtement neuf
  rationale: Ἱμάτιον désigne ici un vêtement sans qu’il soit nécessaire de préciser sa forme; « vêtement » garde cette généralité.
- source_word: σχίσας ἐπιβάλλει
  choice: déchire … pour la mettre
  rationale: Le participe aoriste σχίσας indique que la pièce est d’abord arrachée au vêtement neuf, puis posée sur l’ancien. La construction française exprime clairement cette relation sans surcharger la phrase.
- source_word: ἐπὶ ἱμάτιον παλαιόν
  choice: sur un vieux vêtement
  rationale: « Sur » rend directement l’idée de placement exprimée par ἐπί, et « vieux vêtement » s’oppose naturellement au vêtement neuf.
- source_word: εἰ δὲ μήγε
  choice: Sinon
  rationale: « Sinon » rend de façon concise et naturelle la conséquence contraire introduite par cette formule conditionnelle.
- source_word: καὶ τὸ καινὸν σχίσει
  choice: il déchirera aussi le neuf
  rationale: Le futur actif garde comme sujet implicite la personne qui agit. « Le neuf » reprend le vêtement neuf sans répétition lourde, et « aussi » conserve καί.
- source_word: οὐ συμφωνήσει
  choice: ne s’accordera pas
  rationale: Συμφωνέω exprime ici l’absence de correspondance ou de convenance. « Ne s’accordera pas » préserve cette portée sans décider exclusivement entre l’aspect, l’ajustement et la compatibilité.
- source_word: τὸ ἐπίβλημα τὸ ἀπὸ τοῦ καινοῦ
  choice: la pièce prise au neuf
  rationale: Cette formulation identifie clairement l’origine de la pièce tout en reprenant de manière concise le vêtement neuf déjà mentionné.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proverbiale et concrète. « Pièce » relève du vocabulaire courant de la réparation des vêtements; « s’accorder » maintient l’ambiguïté du grec entre correspondance visuelle et convenance pratique.
