reference: Luke 5:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐμβὰς δὲ εἰς ἓν τῶν πλοίων, ὃ ⸀ἦν Σίμωνος, ἠρώτησεν αὐτὸν ἀπὸ τῆς γῆς ἐπαναγαγεῖν ὀλίγον, ⸂καθίσας δὲ ἐκ τοῦ πλοίου ἐδίδασκεν⸃ τοὺς ὄχλους.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/003.yaml
  text: Then he got into one of the boats[a], which belonged to Simon, and asked him to put out a little from the land. Then he sat down and was teaching the crowds from the boat.
translation:
  language: fr
  text: Il monta dans l’une des barques, qui appartenait à Simon, et lui demanda d’éloigner un peu la barque du rivage. Puis il s’assit et, de la barque, enseignait les foules.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμβὰς
  choice: Il monta dans
  rationale: Le participe aoriste marque l’entrée dans la barque avant la demande. « Monter dans » est naturel en français pour embarquer dans une petite embarcation.
- source_word: πλοίων / πλοίου
  choice: barques / barque
  rationale: Dans ce contexte de pêche sur le lac, « barque » désigne naturellement ces petites embarcations et convient mieux que « navire ».
- source_word: ὃ ἦν Σίμωνος
  choice: qui appartenait à Simon
  rationale: Le génitif exprime clairement la possession; cette formulation est courante et sans ambiguïté.
- source_word: ἠρώτησεν
  choice: demanda
  rationale: Le verbe signifie ici demander à quelqu’un d’accomplir une action; « demanda » restitue simplement cette requête.
- source_word: ἐπαναγαγεῖν
  choice: de s’éloigner
  rationale: Dans ce contexte nautique, le verbe indique que Simon doit faire reculer ou avancer la barque à quelque distance de la terre. « S’éloigner » exprime naturellement le mouvement sans ajouter l’idée de haute mer.
- source_word: ἀπὸ τῆς γῆς
  choice: du rivage
  rationale: Bien que γῆ signifie littéralement « terre », « rivage » désigne ici avec précision la terre ferme dont la barque doit s’écarter et donne une formulation française naturelle.
- source_word: ὀλίγον
  choice: un peu
  rationale: L’expression indique une faible distance sans la préciser; « un peu » conserve cette indétermination.
- source_word: καθίσας
  choice: Puis il s’assit
  rationale: Le participe aoriste présente l’action préalable à l’enseignement. Une proposition coordonnée restitue clairement la succession en français.
- source_word: ἐκ τοῦ πλοίου
  choice: de la barque
  rationale: La préposition ἐκ indique le lieu depuis lequel Jésus enseigne; la tournure française « de la barque » est concise et naturelle.
- source_word: ἐδίδασκεν
  choice: enseignait
  rationale: L’imparfait grec présente l’enseignement comme une action en cours; l’imparfait français en préserve l’aspect duratif.
- source_word: τοὺς ὄχλους
  choice: les foules
  rationale: Le pluriel du grec est conservé. « Les foules » est compréhensible et évite de réduire le texte au singulier.
theological_decisions: []
