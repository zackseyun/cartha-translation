  source_fidelity: 'Le sens général est fidèle : Jésus entre dans une des barques de Simon, lui adresse une demande, puis s’assied et enseigne depuis la barque. Toutefois, « lui demanda de s’éloigner » fait grammaticalement de Simon celui qui s’éloigne, alors que l’infinitif nautique ἐπαναγαγεῖν concerne le déplacement de la barque. La révision explicite donc l’objet implicite sans modifier le sens.'
  naturalness: La formulation révisée est naturelle en français international moderne. « Éloigner un peu la barque du rivage » rend clairement la manœuvre demandée, sans introduire l’idée d’un départ au large. « Enseignait les foules » demeure une formulation sobre et recevable dans ce registre.
  terminology: « Barque » convient au πλοῖον de ce contexte lacustre. « Rivage » est une contextualisation française naturelle de ἀπὸ τῆς γῆς et ne porte pas d’enjeu théologique ou textuel. Aucun nom propre ni terme théologique ne demande de correction.
