id: LUK.5.12
reference: Luke 5:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ἐν τῷ εἶναι αὐτὸν ἐν μιᾷ τῶν πόλεων καὶ ἰδοὺ ἀνὴρ πλήρης λέπρας· ⸂καὶ ἰδὼν⸃ τὸν Ἰησοῦν πεσὼν ἐπὶ πρόσωπον ἐδεήθη αὐτοῦ λέγων· Κύριε, ἐὰν θέλῃς δύνασαί με καθαρίσαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/012.yaml
  text: And it happened that while he was in one of the towns[a], behold, there was a man full of leprosy. And when he saw Jesus, he fell on his face and begged him, saying, “Lord, if you are willing[b], you can cleanse me.”
translation:
  language: fr
  text: 'Alors que Jésus se trouvait dans l’une des villes, voici qu’un homme couvert de lèpre[a] était là. Quand il vit Jésus, il tomba face contre terre et le supplia : « Seigneur, si tu le veux, tu peux me purifier[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « plein de lèpre ». Dans la Bible, le mot grec traduit par « lèpre » peut désigner diverses affections de la peau, et pas uniquement la maladie aujourd’hui appelée maladie de Hansen.
    reason: Précision lexicale et historique sur πλήρης λέπρας et λέπρα.
  - marker: b
    text: Ou « me rendre pur ». Le verbe grec peut évoquer à la fois la guérison physique et le rétablissement de la pureté rituelle et sociale.
    reason: Préserver l’étendue de sens de καθαρίζω.
lexical_decisions:
- source_word: ἐγένετο ἐν τῷ εἶναι αὐτὸν
  choice: Il arriva que Jésus se trouvait
  rationale: Rend la formule narrative lucanienne et la construction temporelle dans un français actuel, tout en explicitant le référent du pronom pour éviter une ambiguïté artificielle hors contexte.
- source_word: μιᾷ τῶν πόλεων
  choice: dans l’une des villes
  rationale: « Ville » est le correspondant français courant de πόλις et ne suppose pas nécessairement une grande agglomération.
- source_word: ἰδοὺ
  choice: Or, voici
  rationale: Conserve l’effet de mise en relief et l’apparition soudaine du personnage sans recourir à une tournure trop archaïque.
- source_word: πλήρης λέπρας
  choice: couvert de lèpre
  rationale: Exprime naturellement en français l’étendue et la gravité de l’affection; une note conserve l’expression grecque littérale « plein de lèpre ».
- source_word: πεσὼν ἐπὶ πρόσωπον
  choice: il tomba face contre terre
  rationale: Décrit clairement la posture physique d’humilité et de supplication.
- source_word: ἐδεήθη αὐτοῦ
  choice: le supplia
  rationale: Communique l’intensité de la demande dans un registre digne et naturel.
- source_word: Κύριε
  choice: Seigneur
  rationale: Préserve à la fois l’adresse respectueuse et la possible portée christologique de κύριος sans trancher entre elles.
- source_word: ἐὰν θέλῃς
  choice: si tu le veux
  rationale: Exprime directement et naturellement la volonté personnelle de Jésus.
- source_word: δύνασαί με καθαρίσαι
  choice: tu peux me rendre pur
  rationale: Conserve la notion de purification portée par καθαρίζω, qui dépasse la seule guérison médicale et inclut les dimensions rituelle et sociale.
theological_decisions:
- issue: Sens de λέπρα et de καθαρίζω dans le récit
  choice: Employer « lèpre » et « me rendre pur »
  alternative: Employer « maladie de peau » et « me guérir »
  rationale: Le vocabulaire grec associe l’affection corporelle à la purification et à la réintégration rituelle et sociale. « Rendre pur » maintient ces dimensions sans nier la guérison physique. « Lèpre » reste le terme biblique reconnu, tandis que la note évite de l’identifier trop précisément à la maladie de Hansen moderne.
- issue: Portée de Κύριε adressé à Jésus
  choice: Seigneur
  alternative: Maître ou Monsieur
  rationale: « Seigneur » garde ensemble le respect exprimé dans la scène et une éventuelle résonance christologique, sans imposer que l’homme formule ici une confession théologique complète.
translation_notes:
  register: Français international moderne, narratif et digne. La formulation reste accessible, avec « Or, voici » pour conserver la vivacité du marqueur grec. Les notes portent leurs marqueurs immédiatement après les expressions concernées.
