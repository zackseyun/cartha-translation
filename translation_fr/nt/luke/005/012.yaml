  source_fidelity: 'Le sens essentiel est bien rendu : la situation dans une des villes, l’apparition marquée de l’homme, l’intensité de son état, sa prosternation, sa supplication et la demande conditionnelle sont conservés. Une légère révision rend plus directement la construction temporelle et καθαρίσαι.'
  naturalness: Le français est globalement naturel et digne. « Il arriva que Jésus se trouvait » est toutefois moins fluide en français contemporain que « Alors que Jésus se trouvait… ». « Tu peux me purifier » est à la fois naturel et plus directement aligné sur le verbe grec que « me rendre pur ».
  terminology: « Lèpre », « Seigneur » et « purifier » préservent utilement le vocabulaire biblique et ses résonances sans identifier abusivement la λέπρα antique à une maladie moderne précise. La note sur la lèpre est resserrée afin de ne pas qualifier sans nécessité toutes les affections visées de « graves ».
