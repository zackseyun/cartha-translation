  to: 'Alors que Jésus se trouvait dans l’une des villes, voici qu’un homme couvert de lèpre[a] était là. Quand il vit Jésus, il tomba face contre terre et le supplia : « Seigneur, si tu le veux, tu peux me purifier[b]. »'
  rationale: La révision améliore la fluidité du français tout en gardant la vivacité de ἰδού par « voici ». Elle maintient « couvert de lèpre » comme expression française naturelle pour πλήρης λέπρας, avec une note qui donne le littéral et évite une identification médicale anachronique. « Me purifier » rend explicitement le verbe de purification sans réduire la demande à une guérison médicale.
