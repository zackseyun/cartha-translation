id: LUK.5.28
reference: Luke 5:28
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ καταλιπὼν ⸀πάντα ἀναστὰς ⸀ἠκολούθει αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/028.yaml
  text: And leaving everything behind[a], he got up and followed him.
translation:
  language: fr
  text: Et, laissant tout derrière lui[a], il se leva et le suivit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « après avoir tout laissé, il se leva et le suivit ».'
    reason: Le participe aoriste καταλιπών peut être rendu en français comme une action antérieure achevée plutôt que par un participe présent.
lexical_decisions:
- source_word: καταλιπὼν
  choice: laissant … derrière lui
  rationale: Le participe aoriste de καταλείπω exprime ici l’abandon de ce qui occupait Lévi auparavant. Cette tournure française est naturelle et marque une rupture décisive sans renforcer le sens jusqu’à « abandonner ».
- source_word: πάντα
  choice: tout
  rationale: Le neutre pluriel accusatif a une portée globale. « Tout » restitue simplement cette totalité sans préciser davantage ce que Lévi a laissé.
- source_word: ἀναστὰς
  choice: il se leva
  rationale: Le participe aoriste de ἀνίστημι décrit le fait de se lever pour agir. Le passé simple convient au registre narratif biblique tout en restant clair.
- source_word: ἠκολούθει
  choice: le suivit
  rationale: L’imparfait grec peut présenter une action en cours ou son entrée dans la durée. Dans cette séquence narrative, le français idiomatique emploie naturellement le passé simple; le contexte de l’appel suggère que Lévi devient disciple sans qu’il soit nécessaire d’ajouter explicitement « se mit à ».
- source_word: αὐτῷ
  choice: le
  rationale: Le pronom renvoie à Jésus dans le contexte immédiat. Conserver un pronom respecte la cohésion du texte grec sans répéter son nom.
- source_word: καὶ
  choice: Et
  rationale: La conjonction relie directement cette réponse à l’appel du verset précédent. « Et » préserve cette coordination simple sans ajouter une nuance causale ou temporelle.
theological_decisions:
- issue: Portée du renoncement de Lévi dans la démarche de disciple
  choice: Le texte affirme qu’il laisse « tout » et suit Jésus, sans définir la durée ni les modalités matérielles de ce renoncement.
  alternative: Comprendre soit qu’il quitte seulement son activité sur le moment, soit qu’il renonce définitivement à tous ses biens.
  rationale: La traduction conserve le caractère absolu de πάντα tout en évitant d’introduire une doctrine de dépossession permanente que ce verset ne formule pas.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple maintient la concision narrative; « laissant tout derrière lui » demeure naturel et fait entendre le caractère décisif de la réponse.
