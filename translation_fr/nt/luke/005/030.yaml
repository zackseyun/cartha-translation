  rationale: La révision remplace le rendu fonctionnel de γραμματεῖς par « scribes » et corrige le complément de « murmuraient » afin de rendre la direction de πρός vers les disciples. Elle conserve l’imparfait, les termes sociaux et religieux du texte, ainsi que l’ambiguïté inhérente à la plainte murmurée.
