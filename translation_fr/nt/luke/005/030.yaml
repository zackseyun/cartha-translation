  text: καὶ ἐγόγγυζον οἱ ⸂Φαρισαῖοι καὶ οἱ γραμματεῖς αὐτῶν⸃ πρὸς τοὺς μαθητὰς αὐτοῦ λέγοντες· Διὰ τί μετὰ τῶν τελωνῶν καὶ ἁμαρτωλῶν ἐσθίετε καὶ πίνετε;
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/030.yaml
  text: And the Pharisees and their scribes were grumbling to his disciples[a], saying, “Why do you eat and drink with tax collectors and sinners?”
translation:
  language: fr
  text: 'Et les Pharisiens et leurs scribes murmuraient à ses disciples[a], disant : « Pourquoi mangez-vous et buvez-vous avec les collecteurs d’impôts et les pécheurs ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « se plaignaient à ses disciples ». Le verbe grec peut désigner une plainte murmurée, et pas seulement une objection formulée ouvertement.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγόγγυζον
  choice: murmuraient
  rationale: L’imparfait exprime une plainte en cours ou répétée, et « murmuraient » conserve l’idée d’une récrimination exprimée à mi-voix.
- source_word: γραμματεῖς
  choice: spécialistes de la Loi
  rationale: Cette expression française actuelle rend clairement la fonction historique des γραμματεῖς dans ce contexte, sans le caractère potentiellement obscur de « scribes ».
- source_word: αὐτῶν
  choice: leurs
  rationale: Le génitif rattache naturellement ces spécialistes de la Loi aux Pharisiens.
- source_word: πρὸς τοὺς μαθητὰς αὐτοῦ
  choice: auprès de ses disciples
  rationale: πρός avec l’accusatif indique ici les destinataires vers lesquels la plainte est dirigée; « auprès de » permet d’articuler naturellement le verbe « murmurer ».
- source_word: Διὰ τί
  choice: Pourquoi
  rationale: Équivalent interrogatif direct et idiomatique.
- source_word: τελωνῶν
  choice: collecteurs d’impôts
  rationale: Désignation claire et courante des agents chargés de percevoir taxes et péages, tout en préservant leur identité sociale dans les récits évangéliques.
- source_word: ἁμαρτωλῶν
  choice: pécheurs
  rationale: Traduction directe qui maintient la catégorie morale et sociale employée par les interlocuteurs.
- source_word: ἐσθίετε καὶ πίνετε
  choice: mangez-vous et buvez-vous
  rationale: La formulation conserve les deux verbes concrets et rend naturellement le présent grec dans la question.
- source_word: καὶ
  choice: Et
  rationale: Le connecteur simple maintient l’enchaînement narratif grec.
theological_decisions:
- issue: Portée sociale et religieuse des repas pris avec les « collecteurs d’impôts et les pécheurs »
  choice: Conserver l’accusation concrète sans l’expliciter
  alternative: Paraphraser en précisant une transgression rituelle, morale ou sociale
  rationale: Le texte ne définit pas précisément la nature de l’offense reprochée. La traduction maintient donc la tension liée à cette fréquentation et à cette communion de table sans imposer une interprétation confessionnelle.
translation_notes:
  register: Français international moderne, naturel et digne. « Pharisiens » et « pécheurs » conservent les désignations historiques et théologiques traditionnelles; « spécialistes de la Loi » privilégie la compréhension immédiate de la fonction des γραμματεῖς.
