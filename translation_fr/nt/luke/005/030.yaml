review_pass:
  verdict: revise
  source_fidelity: La désignation « spécialistes de la Loi » explicite de façon interprétative γραμματεῖς, alors que « scribes » est l’équivalent direct et historiquement établi dans ce contexte. Surtout, « auprès de ses disciples » ne rend pas adéquatement πρός avec l’accusatif, qui désigne ici les disciples comme destinataires de la plainte et de la question. « À ses disciples » le rend directement. L’imparfait « murmuraient » conserve bien la valeur durative ou répétée de ἐγόγγυζον.
  naturalness: « Murmuraient à ses disciples » est naturel dans le cadre du discours direct qui suit. La phrase demeure fluide en français international moderne. « Scribes » est un terme biblique courant; son maintien évite de substituer une analyse fonctionnelle contemporaine à la désignation du texte.
  terminology: « Pharisiens », « scribes », « collecteurs d’impôts » et « pécheurs » préservent les désignations historiques du grec sans atténuer ni expliquer indûment la catégorisation portée par les interlocuteurs. Aucun enjeu doctrinal ne requiert d’explicitation.
