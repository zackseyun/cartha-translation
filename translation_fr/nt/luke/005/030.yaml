  - severity: low
    issue: « spécialistes de la Loi » pour γραμματεῖς
    rationale: Cette expression explicite une fonction et peut être défendable, mais « scribes » est la traduction lexicale directe, conventionnelle et historiquement plus précise comme désignation de groupe. Elle correspond également à la piste d’audit anglaise.
  - severity: low
    issue: Formulation de la note alternative
    rationale: L’alternative actuelle reprend « auprès de ses disciples », qui ne correspond pas au sens directionnel retenu. La note doit proposer l’alternative lexicale sans modifier le complément.
