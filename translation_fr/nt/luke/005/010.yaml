id: LUK.5.10
reference: Luke 5:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁμοίως δὲ καὶ Ἰάκωβον καὶ Ἰωάννην υἱοὺς Ζεβεδαίου, οἳ ἦσαν κοινωνοὶ τῷ Σίμωνι. καὶ εἶπεν πρὸς τὸν Σίμωνα ⸀ὁ Ἰησοῦς· Μὴ φοβοῦ· ἀπὸ τοῦ νῦν ἀνθρώπους ἔσῃ ζωγρῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/010.yaml
  text: and likewise also James and John, Zebedee’s sons, who were partners with Simon. And Jesus said to Simon, “Do not be afraid; from now on you will be catching people alive.”
translation:
  language: fr
  text: 'Il en allait de même pour Jacques et Jean, fils de Zébédée, qui étaient les associés de Simon. Alors Jésus dit à Simon : « N’aie pas peur ; désormais, tu prendras des êtres humains vivants[a][b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tu captureras des êtres humains vivants ». Le verbe grec signifie prendre ou capturer vivant.
    reason: lexical_alternative
  - marker: b
    text: Comparer Matthieu 4.19 et Marc 1.17, où Jésus parle de « pêcheurs d’hommes ». Luc emploie ici un verbe différent, qui évoque le fait de prendre vivant.
    reason: cross_reference
lexical_decisions:
- source_word: ὁμοίως δὲ καὶ
  choice: Il en allait de même pour
  rationale: 'Rend naturellement en français la comparaison et l’ajout : Jacques et Jean partageaient la même réaction évoquée dans le contexte précédent.'
- source_word: υἱοὺς Ζεβεδαίου
  choice: fils de Zébédée
  rationale: Formulation française usuelle et fidèle à l’identification familiale.
- source_word: κοινωνοὶ
  choice: associés
  rationale: Dans le contexte de leur activité de pêche, le terme désigne vraisemblablement des partenaires de travail plutôt que de simples compagnons.
- source_word: Μὴ φοβοῦ
  choice: N’aie pas peur
  rationale: Expression actuelle et naturelle qui conserve la valeur rassurante de l’impératif grec.
- source_word: ἀπὸ τοῦ νῦν
  choice: désormais
  rationale: Marque avec concision le tournant décisif annoncé dans la vocation de Simon.
- source_word: ἀνθρώπους
  choice: des êtres humains
  rationale: Le nom grec vise ici l’humanité sans restriction au sexe masculin ; cette formulation reste précise dans la métaphore de la capture.
- source_word: ζωγρῶν
  choice: tu prendras des êtres humains vivants
  rationale: Le verbe signifie prendre ou capturer vivant. « Prendras » évite la tournure française peu naturelle « pêcher des gens », tandis que « vivants » préserve la nuance propre à Luc.
theological_decisions:
- issue: Métaphore de ζωγρέω dans l’appel adressé à Simon
  choice: tu prendras des êtres humains vivants
  alternative: tu prendras des êtres humains / tu seras pêcheur d’hommes
  rationale: La formulation de Luc souligne la prise en vie et diffère de celle de Matthieu 4.19 et Marc 1.17. La traduction conserve cette particularité sans harmoniser les récits.
- issue: Portée de ἀνθρώπους
  choice: des êtres humains
  alternative: des hommes
  rationale: Dans ce contexte, le terme grec désigne des personnes en général et non exclusivement des hommes.
translation_notes:
  register: Français international moderne, digne et accessible. « Il en allait de même » assure le lien avec le verset précédent ; « associés » convient au cadre professionnel de la pêche. La syntaxe conserve la métaphore singulière de Luc sans reprendre artificiellement la formule plus connue des passages parallèles.
