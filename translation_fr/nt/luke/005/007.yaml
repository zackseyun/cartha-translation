  text: καὶ κατένευσαν τοῖς ⸀μετόχοις ἐν τῷ ἑτέρῳ πλοίῳ τοῦ ἐλθόντας συλλαβέσθαι αὐτοῖς· καὶ ἦλθον, καὶ ἔπλησαν ἀμφότερα τὰ πλοῖα ὥστε βυθίζεσθαι αὐτά.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/007.yaml
  text: So they signaled to their partners in the other boat to come and help them[a]. And they came and filled both boats[c][b], so that they began to sink.
translation:
  language: fr
  text: Alors ils firent signe à leurs partenaires dans l’autre barque de venir les aider[a]. Ceux-ci vinrent et remplirent les deux barques, au point qu’elles commençaient à couler[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de venir leur prêter main-forte ».
    reason: lexical_alternative
  - marker: b
    text: Ou « au point qu’elles étaient en train de couler ».
    reason: lexical_alternative
lexical_decisions:
- source_word: κατένευσαν
  choice: firent signe
  rationale: Le verbe désigne un signe ou un geste adressé à distance. « Firent signe » est naturel en français et convient à la scène sur l’eau.
- source_word: μετόχοις
  choice: associés
  rationale: Dans ce contexte de pêche, le terme évoque des personnes qui prennent part à la même activité, probablement des partenaires de travail, plutôt que de simples compagnons.
- source_word: ἐν τῷ ἑτέρῳ πλοίῳ
  choice: qui étaient dans l’autre barque
  rationale: Cette formulation identifie naturellement les associés se trouvant dans l’autre embarcation. « Barque » convient au récit de pêche.
- source_word: τοῦ ἐλθόντας συλλαβέσθαι αὐτοῖς
  choice: de venir les aider
  rationale: La construction exprime le but du signe, et συλλαμβάνομαι signifie ici prêter main-forte en participant à l’effort.
- source_word: ἔπλησαν ἀμφότερα τὰ πλοῖα
  choice: remplirent les deux barques
  rationale: 'La traduction conserve l’image concrète du texte grec et rend explicitement la valeur de ἀμφότερα : les deux embarcations.'
- source_word: ὥστε βυθίζεσθαι αὐτά
  choice: au point qu’elles s’enfonçaient
  rationale: Le présent infinitif présente l’enfoncement comme un processus résultant du chargement, sans affirmer que les barques ont effectivement coulé.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. « Associés » préserve la dimension pratique du lien entre les pêcheurs; « s’enfonçaient » maintient l’idée d’un processus en cours sans laisser entendre que les barques ont sombré.
