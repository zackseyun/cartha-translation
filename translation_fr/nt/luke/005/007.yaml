  verdict: revise
  source_fidelity: 'La structure et les référents sont bien rendus : le signe est adressé aux partenaires dans l’autre embarcation afin qu’ils viennent aider, puis les deux barques sont remplies. Toutefois, « s’enfonçaient » décrit surtout le fait de s’enfoncer dans l’eau sous le poids; βυθίζεσθαι exprime plus précisément le fait de couler ou d’être en train de sombrer. Il convient de conserver cette idée sans affirmer qu’elles ont effectivement sombré.'
