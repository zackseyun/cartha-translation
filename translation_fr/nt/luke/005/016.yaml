  yaml_path: translation/nt/luke/005/016.yaml
  text: But he would withdraw in the wilderness and pray[a].
translation:
  language: fr
  text: Mais lui se retirait dans des endroits déserts et priait[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Mais lui était en train de se retirer dans les lieux déserts et de prier. » Le grec emploie plus littéralement une construction à l’imparfait avec des participes, qui peut exprimer une action continue ou habituelle.'
    reason: alternative lexicale et précision grammaticale
lexical_decisions:
- source_word: αὐτὸς
  choice: lui
  rationale: Le pronom grec explicite possède une légère valeur emphatique et contrastive. La tournure « Mais lui » la rend naturellement en français.
- source_word: δὲ
  choice: Mais
  rationale: La particule marque ici un léger contraste avec la publicité croissante évoquée dans le contexte.
- source_word: ἦν ὑποχωρῶν
  choice: se retirait
  rationale: L’imparfait périphrastique exprime une action continue ou habituelle dans le passé. L’imparfait français conserve naturellement cette valeur sans la surinterpréter.
- source_word: ἐν ταῖς ἐρήμοις
  choice: dans des endroits déserts
  rationale: Le pluriel désigne des lieux inhabités ou isolés plutôt qu’un désert géographique précis; « dans » préserve directement la préposition ἐν.
- source_word: καὶ
  choice: et
  rationale: Coordination simple des deux actions.
- source_word: προσευχόμενος
  choice: priait
  rationale: Le participe coordonné au précédent participe à la construction imperfective et décrit une activité concomitante ou habituelle.
theological_decisions:
- issue: Aspect des actions de Jésus
  choice: 'Le verset présente une pratique continue ou habituelle: Jésus se retirait et priait.'
  alternative: Le verset raconterait uniquement une occasion particulière où Jésus s’est retiré pour prier.
  rationale: La construction grecque ἦν avec deux participes présents favorise une valeur durative ou coutumière. L’imparfait français préserve cette portée tout en maintenant une certaine souplesse aspectuelle.
translation_notes:
  register: Français international moderne, naturel et digne. « Endroits déserts » évite de suggérer nécessairement une région désertique et reste accessible; « Mais lui » conserve l’emphase discrète du pronom grec.
