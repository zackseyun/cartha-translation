id: LUK.5.27
reference: Luke 5:27
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ μετὰ ταῦτα ἐξῆλθεν καὶ ἐθεάσατο τελώνην ὀνόματι Λευὶν καθήμενον ἐπὶ τὸ τελώνιον, καὶ εἶπεν αὐτῷ· Ἀκολούθει μοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/027.yaml
  text: And after these things he went out and saw a tax collector named Levi sitting at the tax booth[a], and he said to him[b], “Follow me.”
translation:
  language: fr
  text: 'Après cela, Jésus sortit et vit[a] un collecteur d’impôts nommé Lévi, assis au poste de perception[b]. Il lui dit : « Suis-moi. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « remarqua » ou « regarda » ; le verbe grec peut évoquer davantage qu’un regard fugitif.
    reason: lexical_alternative
  - marker: b
    text: Ou « au bureau des taxes », « au poste de péage » ou « au poste de douane ».
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ ταῦτα
  choice: Après cela
  rationale: Cette tournure française naturelle rend la transition narrative et peut reprendre un ensemble d’événements malgré le démonstratif grec au pluriel.
- source_word: ἐξῆλθεν
  choice: sortit
  rationale: Le verbe conserve le mouvement concret exprimé par ἐξέρχομαι, sans préciser un lieu que le verset ne nomme pas.
- source_word: ἐθεάσατο
  choice: vit
  rationale: « Vit » est naturel dans le récit tout en laissant ouverte la nuance possible d’un regard attentif, signalée en note.
- source_word: τελώνην
  choice: un collecteur d’impôts
  rationale: Cette expression claire désigne la fonction de Lévi sans recourir à un terme administratif trop technique.
- source_word: ὀνόματι Λευὶν
  choice: nommé Lévi
  rationale: La formulation rend simplement et idiomatiquement la construction grecque avec ὀνόματι.
- source_word: καθήμενον
  choice: assis
  rationale: Le participe décrit l’état de Lévi à son poste et garde la scène concrète.
- source_word: ἐπὶ τὸ τελώνιον
  choice: au poste de perception
  rationale: « Poste de perception » couvre le lieu où étaient perçus impôts, droits ou péages, sans imposer un type précis de prélèvement.
- source_word: Ἀκολούθει μοι
  choice: Suis-moi
  rationale: L’impératif direct conserve à la fois le sens littéral et, dans le contexte, la portée d’un appel à devenir disciple, sans l’expliciter dans le texte.
theological_decisions:
- issue: Portée de l’impératif de Jésus comme appel à devenir disciple
  choice: « Suis-moi »
  alternative: « Deviens mon disciple »
  rationale: Le contexte donne à l’ordre une portée de vocation, mais le grec exprime celle-ci par le simple verbe « suivre ». La traduction n’ajoute donc aucune explicitation doctrinale.
- issue: Sujet implicite de ἐξῆλθεν
  choice: « Jésus sortit »
  alternative: « il sortit »
  rationale: Le sujet grammatical est implicite en grec et renvoie à Jésus dans le contexte immédiat. Le nommer en français évite une ouverture de verset isolé ambiguë sans ajouter un nouvel acteur.
translation_notes:
  register: Français international moderne, sobre et narratif. « Collecteur d’impôts » est immédiatement compréhensible, tandis que « poste de perception » reste assez large pour préserver l’imprécision du type exact de droits perçus. Les marqueurs de notes sont placés sur les expressions auxquelles les variantes se rapportent.
