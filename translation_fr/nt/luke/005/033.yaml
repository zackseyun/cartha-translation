source:
  edition: SBLGNT
  text: Οἱ δὲ εἶπαν πρὸς αὐτόν· ⸀Οἱ μαθηταὶ Ἰωάννου νηστεύουσιν πυκνὰ καὶ δεήσεις ποιοῦνται, ὁμοίως καὶ οἱ τῶν Φαρισαίων, οἱ δὲ σοὶ ἐσθίουσιν καὶ πίνουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/033.yaml
  text: And they said to him[a], “John’s disciples fast often and make prayers; likewise also those of the Pharisees[b], but yours eat and drink.”
translation:
  language: fr
  text: 'Ils lui dirent : « Les disciples de Jean jeûnent souvent et font des prières, tout comme les disciples des pharisiens[a] ; mais les tiens[b] mangent et boivent. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Litt. « ceux des pharisiens » ; le mot « disciples » est sous-entendu d’après la proposition précédente.
    reason: lexical_alternative
  - marker: b
    text: Ou « tes disciples ». Le grec dit simplement « les tiens » ; le mot « disciples » est compris d’après le contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἱ δὲ εἶπαν πρὸς αὐτόν
  choice: Ils lui dirent
  rationale: δέ est ici un lien narratif léger ; l’omettre en français produit une narration naturelle sans imposer un contraste plus fort que le grec.
- source_word: μαθηταὶ Ἰωάννου
  choice: les disciples de Jean
  rationale: Cette formulation rend naturellement le génitif d’association en français moderne.
- source_word: νηστεύουσιν πυκνά
  choice: jeûnent souvent
  rationale: πυκνά indique la fréquence ; « souvent » est clair, courant et exact.
- source_word: δεήσεις ποιοῦνται
  choice: font des prières
  rationale: La formulation conserve la construction nominale du grec et distingue cette expression du simple verbe « prier ».
- source_word: ὁμοίως καὶ
  choice: tout comme
  rationale: Cette locution exprime naturellement en français la similitude cumulative marquée par ὁμοίως καί.
- source_word: οἱ τῶν Φαρισαίων
  choice: ceux des pharisiens
  rationale: Le nom « disciples » reste sous-entendu comme en grec ; le contexte permet d’identifier clairement le référent.
- source_word: οἱ δὲ σοὶ
  choice: mais les tiens
  rationale: Cette formulation préserve l’ellipse grecque tout en marquant clairement le contraste ; « disciples » est compris d’après le contexte.
- source_word: ἐσθίουσιν καὶ πίνουσιν
  choice: mangent et boivent
  rationale: Le présent simple rend ici un comportement habituel opposé au jeûne fréquent.
theological_decisions:
- issue: Faut-il expliciter « disciples » dans les deuxième et troisième groupes ?
  choice: Conserver l’ellipse grecque avec « ceux des pharisiens » et « les tiens »
  alternative: Écrire « les disciples des pharisiens » et « tes disciples »
  rationale: L’ellipse est intelligible en français et reflète la structure du texte grec sans infléchir l’interprétation.
translation_notes:
  register: Français international moderne, digne et accessible. « Pharisiens » prend une minuscule conformément à l’usage typographique français pour les membres d’un groupe religieux. Le point-virgule clarifie l’opposition finale sans alourdir la phrase.
