  source_fidelity: 'Le texte rend fidèlement les éléments essentiels du grec : le début de leur délibération (ἤρξαντο διαλογίζεσθαι), les deux groupes désignés, l’accusation au pluriel (« blasphèmes »), l’expression idiomatique du pardon des péchés et l’exclusivité attribuée à Dieu seul. « Entre eux » est une explicitation acceptable de la délibération collective, sans imposer indûment qu’il s’agisse d’un débat public plutôt que d’un raisonnement partagé.'
  naturalness: La formulation est claire, idiomatique et digne en français international moderne. « Se mirent à raisonner » convient au registre narratif sans lourdeur. « Qui est celui-ci ? » conserve utilement l’effet abrupt et dépréciatif du grec ; bien que légèrement marqué par le registre biblique, il demeure naturel et précis dans ce contexte.
  terminology: « Spécialistes de la Loi » communique clairement la fonction des γραμματεῖς, sans confondre le terme avec une simple activité de copie. « Pharisiens », « blasphèmes », « pardonner les péchés » et « Dieu seul » sont établis, exacts et théologiquement non interprétatifs.
