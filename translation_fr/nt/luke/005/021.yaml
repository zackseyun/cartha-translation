id: LUK.5.21
reference: Luke 5:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἤρξαντο διαλογίζεσθαι οἱ γραμματεῖς καὶ οἱ Φαρισαῖοι λέγοντες· Τίς ἐστιν οὗτος ὃς λαλεῖ βλασφημίας; τίς δύναται ⸂ἁμαρτίας ἀφεῖναι⸃ εἰ μὴ μόνος ὁ θεός;
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/021.yaml
  text: And the scribes and the Pharisees began to reason among themselves, saying, “Who is this who speaks blasphemies? Who can forgive sins except God alone?”
translation:
  language: fr
  text: 'Alors les spécialistes de la Loi et les pharisiens se mirent à raisonner entre eux : « Qui est celui-ci, qui prononce des blasphèmes ? Qui peut pardonner les péchés, sinon Dieu seul ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤρξαντο διαλογίζεσθαι
  choice: se mirent à raisonner entre eux
  rationale: « Se mirent à » rend le commencement exprimé par ἤρξαντο, tandis que « raisonner entre eux » conserve l’idée de réflexion ou de délibération sans trancher entre pensée intérieure et discussion exprimée.
- source_word: γραμματεῖς
  choice: spécialistes de la Loi
  rationale: Dans ce contexte évangélique, le terme désigne des experts reconnus de la Loi. Cette formulation est plus immédiatement compréhensible en français moderne que « scribes », tout en préservant leur fonction.
- source_word: Φαρισαῖοι
  choice: pharisiens
  rationale: Translittération française consacrée du nom de ce groupe.
- source_word: λαλεῖ βλασφημίας
  choice: prononce des blasphèmes
  rationale: Le pluriel « des blasphèmes » respecte βλασφημίας. « Prononce » exprime naturellement l’acte de proférer des paroles jugées blasphématoires.
- source_word: ἁμαρτίας ἀφεῖναι
  choice: pardonner les péchés
  rationale: Expression française naturelle et exacte pour l’emploi établi de ἀφίημι avec ἁμαρτίας.
- source_word: εἰ μὴ μόνος ὁ θεός
  choice: sinon Dieu seul
  rationale: Rend de façon concise l’exception et l’exclusivité exprimées par εἰ μὴ et μόνος.
- source_word: Τίς ἐστιν οὗτος
  choice: Qui est celui-ci
  rationale: Conserve la formulation abrupte et potentiellement dépréciative sans ajouter « homme », absent du grec.
theological_decisions:
- issue: Implication de l’autorité de Jésus pour pardonner les péchés
  choice: Conserver sans l’atténuer l’affirmation des interlocuteurs selon laquelle Dieu seul peut pardonner les péchés.
  alternative: Expliciter dans la traduction une conclusion christologique, ou affaiblir l’exclusivité de leur affirmation.
  rationale: Le verset expose leur objection et crée une tension théologique dans le récit. La traduction la préserve sans ajouter la conclusion que le texte ne formule pas ici.
translation_notes:
  register: Français international moderne, naturel et digne. « Spécialistes de la Loi » privilégie la compréhension immédiate; la syntaxe interrogative et le pluriel « blasphèmes » restent proches du grec.
