reference: Luke 5:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ⸀Σίμων ⸀εἶπεν· Ἐπιστάτα, δι’ ⸀ὅλης νυκτὸς κοπιάσαντες οὐδὲν ἐλάβομεν, ἐπὶ δὲ τῷ ῥήματί σου χαλάσω ⸂τὰ δίκτυα⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/005.yaml
  text: And Simon answered[a], “Master, we worked hard all night and caught nothing[b]; but at your word I will let down the nets.”
translation:
  language: fr
  text: 'Simon lui répondit : « Maître, nous avons peiné toute la nuit sans rien prendre ; mais sur ta parole[a], je vais mettre les filets à l’eau. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « parce que tu le dis » ; littéralement « sur ta parole ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς … εἶπεν
  choice: lui répondit
  rationale: Le participe suivi de « dit » constitue une tournure grecque d’introduction au discours direct. Le français naturel la rend par le verbe simple « répondit » ; le pronom « lui » explicite le destinataire déjà évident dans le contexte.
- source_word: Ἐπιστάτα
  choice: Maître
  rationale: Chez Luc, ce titre reconnaît l’autorité de Jésus sans employer κύριος (« Seigneur »). « Maître » conserve cette distinction et convient à une adresse directe.
- source_word: δι’ ὅλης νυκτός
  choice: toute la nuit
  rationale: Expression française idiomatique qui restitue la durée couvrant la nuit entière.
- source_word: κοπιάσαντες
  choice: nous avons peiné
  rationale: « Peiner » exprime l’effort pénible et soutenu contenu dans le verbe grec, tout en restant naturel en français moderne.
- source_word: οὐδὲν ἐλάβομεν
  choice: sans rien prendre
  rationale: Dans le contexte de la pêche, « prendre » signifie naturellement capturer du poisson. La construction avec « sans » relie avec fluidité le résultat nul au travail de toute la nuit.
- source_word: ἐπὶ δὲ τῷ ῥήματί σου
  choice: mais, sur ta parole
  rationale: La construction avec ἐπί indique ici le fondement sur lequel Simon agit. « Sur ta parole » en conserve la nuance, qui peut être celle de l’appui ou du motif.
- source_word: χαλάσω
  choice: je vais jeter
  rationale: Dans l’usage français de la pêche, « jeter les filets » est plus naturel que « descendre les filets », bien que le verbe grec décrive littéralement leur abaissement dans l’eau. Le futur proche exprime une action immédiatement projetée.
- source_word: τὰ δίκτυα
  choice: les filets
  rationale: Le pluriel du texte grec est conservé sans ajout explicatif inutile.
- source_word: δὲ
  choice: mais
  rationale: La conjonction marque le contraste entre l’échec de la nuit et la décision d’agir sur la parole de Jésus.
theological_decisions:
- issue: Traduction du titre Ἐπιστάτα adressé à Jésus
  choice: Maître
  alternative: Seigneur
  rationale: Le grec porte ἐπιστάτης et non κύριος. « Maître » reconnaît l’autorité de Jésus tout en préservant la distinction lexicale et la progression narrative.
- issue: Fondement de l’action exprimé par ἐπὶ τῷ ῥήματί σου
  choice: sur ta parole
  alternative: parce que tu le dis
  rationale: '« Sur ta parole » préserve la formulation ouverte du grec : Simon peut agir en s’appuyant sur la parole de Jésus ou en raison de celle-ci, sans que la traduction tranche davantage.'
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement correspond à l’adresse singulière du grec. « Nous avons peiné » garde l’idée d’un effort éprouvant ; « jeter les filets » privilégie l’expression française usuelle dans le contexte de la pêche.
