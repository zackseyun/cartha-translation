id: LUK.5.26
reference: Luke 5:26
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἔκστασις ἔλαβεν ἅπαντας καὶ ἐδόξαζον τὸν θεόν, καὶ ἐπλήσθησαν φόβου λέγοντες ὅτι Εἴδομεν παράδοξα σήμερον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/026.yaml
  text: And amazement seized them all[a], and they were glorifying God, and they were filled with fear, saying, “We have seen extraordinary things today.”
translation:
  language: fr
  text: 'Tous furent saisis de stupeur et glorifiaient Dieu. Remplis de crainte, ils disaient : « Nous avons vu aujourd’hui des choses extraordinaires[a] ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des choses remarquables » ou « des choses surprenantes » ; le grec désigne ce qui dépasse les attentes ordinaires.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκστασις
  choice: stupeur
  rationale: Dans ce contexte, le nom désigne un étonnement bouleversant, non une extase mystique. « Stupeur » est naturel en français et exprime la force de la réaction collective.
- source_word: ἔλαβεν ἅπαντας
  choice: Tous furent saisis
  rationale: Cette formulation française rend l’image vive de l’expression grecque, littéralement « saisit tous », sans lourdeur.
- source_word: ἐδόξαζον
  choice: glorifiaient
  rationale: L’imparfait conserve l’aspect duratif ou répété du verbe grec, tandis que « glorifiaient » reste proche de son sens lexical.
- source_word: τὸν θεόν
  choice: Dieu
  rationale: Traduction française usuelle de θεός dans ce contexte.
- source_word: ἐπλήσθησαν φόβου
  choice: Remplis de crainte
  rationale: Cette tournure conserve directement l’image du passif grec et ne réduit pas φόβος au seul émerveillement.
- source_word: λέγοντες
  choice: ils disaient
  rationale: L’imparfait s’accorde naturellement au récit et introduit clairement les paroles de la foule.
- source_word: Εἴδομεν
  choice: Nous avons vu
  rationale: Le passé composé rend idiomatiquement en français la réaction présente à un événement qui vient de se produire.
- source_word: παράδοξα
  choice: des choses extraordinaires
  rationale: Le terme désigne ici des faits qui dépassent l’attente ordinaire. « Extraordinaires » exprime cette idée sans la connotation négative possible de « choses étranges ».
- source_word: σήμερον
  choice: aujourd’hui
  rationale: Rend directement l’adverbe temporel et conserve l’immédiateté du témoignage.
theological_decisions:
- issue: Nuance de φόβος devant l’action divine
  choice: crainte
  alternative: émerveillement
  rationale: « Crainte » préserve la tension entre peur, respect et saisissement devant l’autorité divine, sans réduire interprétativement la réaction à un sentiment positif.
translation_notes:
  register: 'Français international moderne, naturel et digne. La ponctuation en deux phrases évite une coordination pesante tout en conservant la progression grecque : stupeur, glorification de Dieu, crainte et déclaration.'
