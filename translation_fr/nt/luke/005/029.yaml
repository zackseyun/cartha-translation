id: LUK.5.29
reference: Luke 5:29
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ ἐποίησεν δοχὴν μεγάλην Λευὶς αὐτῷ ἐν τῇ οἰκίᾳ αὐτοῦ· καὶ ἦν ὄχλος ⸂πολὺς τελωνῶν⸃ καὶ ἄλλων οἳ ἦσαν μετ’ αὐτῶν κατακείμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/029.yaml
  text: And Levi made a great banquet for him in his house[b][a], and there was a large crowd of tax collectors and others who were reclining at table with them.
translation:
  language: fr
  text: Lévi lui offrit un grand banquet dans sa maison. Il y avait là une foule nombreuse de collecteurs d’impôts et d’autres personnes qui étaient à table[a] avec eux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression grecque signifie littéralement qu’ils étaient allongés à table, selon l’usage des repas dans le monde méditerranéen antique.
    reason: cultural_note
lexical_decisions:
- source_word: δοχὴν μεγάλην
  choice: un grand banquet
  rationale: « Banquet » exprime naturellement un repas important donné en l’honneur de quelqu’un, conformément au sens de δοχή dans ce contexte.
- source_word: ἐποίησεν ... αὐτῷ
  choice: lui offrit
  rationale: Cette formulation française rend naturellement l’idée d’organiser ou de donner un banquet pour Jésus, tout en conservant le pronom du grec.
- source_word: ἐν τῇ οἰκίᾳ αὐτοῦ
  choice: dans sa maison
  rationale: Rendu direct de la localisation et du possessif, dont le référent est Lévi.
- source_word: ὄχλος πολὺς τελωνῶν
  choice: une foule nombreuse de collecteurs d’impôts
  rationale: « Foule nombreuse » restitue ὄχλος πολύς, tandis que « collecteurs d’impôts » est la désignation moderne claire de ce groupe social.
- source_word: καὶ ἄλλων
  choice: et d’autres personnes
  rationale: L’ajout de « personnes », implicite en grec, est nécessaire à la fluidité du français sans préciser davantage l’identité laissée indéterminée dans le texte.
- source_word: κατακείμενοι
  choice: étaient à table
  rationale: Le verbe désigne ici la posture allongée adoptée pendant les repas; l’expression idiomatique française « être à table » communique clairement la scène sans faire croire qu’ils étaient simplement couchés.
- source_word: μετ’ αὐτῶν
  choice: avec eux
  rationale: Le pluriel du grec est conservé sans imposer un antécédent plus précis que ne le fait le texte.
theological_decisions:
- issue: Référent de μετ’ αὐτῶν (« avec eux »)
  choice: Conserver le pluriel « avec eux » dans le texte
  alternative: « avec lui », compris comme une référence contextuelle à Jésus
  rationale: Le grec porte explicitement le pluriel αὐτῶν. La traduction ne le corrige pas en un singulier et préserve ainsi la légère ambiguïté de son rattachement dans la scène.
translation_notes:
  register: Français international moderne, naturel et digne. « Offrit un grand banquet » évite le calque peu idiomatique « fit un banquet ». « Étaient à table » privilégie la compréhension immédiate, tandis que la note conserve l’information culturelle sur la posture antique.
