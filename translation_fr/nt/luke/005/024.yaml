id: LUK.5.24
reference: Luke 5:24
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἵνα δὲ εἰδῆτε ὅτι ⸂ὁ υἱὸς τοῦ ἀνθρώπου ἐξουσίαν ἔχει⸃ ἐπὶ τῆς γῆς ἀφιέναι ἁμαρτίας— εἶπεν τῷ παραλελυμένῳ· Σοὶ λέγω, ⸀ἔγειρε καὶ ἄρας τὸ κλινίδιόν σου πορεύου εἰς τὸν οἶκόν σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/024.yaml
  text: But so that you may know that the Son of Man has authority on earth to forgive sins—he said to the paralyzed man[a], “I say to you, rise, pick up your mat[b], and go to your house.”
translation:
  language: fr
  text: 'Mais afin que vous sachiez que le Fils de l’homme[a] a, sur la terre, l’autorité de pardonner les péchés — il dit à l’homme paralysé : « Je te le dis, lève-toi, prends ta natte[b] et va chez toi. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’Humain ». Le titre grec traditionnellement rendu par « le Fils de l’homme » est conservé parce que Jésus l’emploie pour parler de lui-même et qu’il possède d’importantes résonances bibliques, notamment avec Daniel 7.
    reason: alternative_reading
  - marker: b
    text: Ou « ta couche » ou « ton petit lit ». Le mot grec désigne une petite couche, un grabat ou une natte.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα δὲ
  choice: Mais afin que
  rationale: δέ marque une transition légèrement contrastive, tandis que ἵνα introduit ici le but; « Mais afin que » rend naturellement les deux éléments.
- source_word: εἰδῆτε
  choice: vous sachiez
  rationale: Le verbe exprime ici une connaissance assurée; « sachiez » est direct et idiomatique.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: le Fils de l’homme
  rationale: Cette désignation que Jésus emploie pour lui-même est conservée sous sa forme biblique reconnue afin de préserver ses résonances, notamment avec Daniel 7.
- source_word: ἐξουσίαν ἔχει
  choice: a l’autorité
  rationale: ἐξουσία désigne ici le droit ou la prérogative légitime, plutôt qu’une simple puissance.
- source_word: ἐπὶ τῆς γῆς
  choice: sur la terre
  rationale: Traduction locative directe qui n’explicite pas davantage le rapport possible avec la prérogative divine.
- source_word: ἀφιέναι ἁμαρτίας
  choice: de pardonner les péchés
  rationale: Dans ce contexte, ἀφίημι signifie remettre ou pardonner; cette formulation est claire et usuelle.
- source_word: τῷ παραλελυμένῳ
  choice: à l’homme paralysé
  rationale: Le participe substantivé désigne la personne atteinte; cette formulation est naturelle, actuelle et respectueuse.
- source_word: Σοὶ λέγω
  choice: Je te le dis
  rationale: Le pronom placé en tête est emphatique; « Je te le dis » conserve l’adresse directe avec un français naturel.
- source_word: ἔγειρε
  choice: lève-toi
  rationale: Impératif immédiat rendu par l’expression française la plus naturelle, tout en gardant un registre digne.
- source_word: ἄρας
  choice: prends
  rationale: Le participe a ici une valeur coordonnée à l’impératif et désigne le fait de soulever puis d’emporter l’objet.
- source_word: κλινίδιόν σου
  choice: ta natte
  rationale: Le diminutif désigne un petit lit, une couche ou une natte; « natte » convient au contexte sans suggérer un lit lourd.
- source_word: πορεύου εἰς τὸν οἶκόν σου
  choice: va chez toi
  rationale: Rend idiomatiquement en français le mouvement vers la maison de l’homme, sans lourdeur littérale.
theological_decisions:
- issue: Traduction de ὁ υἱὸς τοῦ ἀνθρώπου
  choice: le Fils de l’homme
  alternative: l’Humain
  rationale: La formulation traditionnelle préserve à la fois le titre christologique, l’auto-désignation de Jésus et l’écho possible à Daniel 7, sans réduire son ambiguïté.
- issue: Nuance de ἐξουσία concernant le pardon des péchés
  choice: l’autorité
  alternative: le pouvoir
  rationale: Le contexte porte sur la prérogative légitime de pardonner, et non seulement sur la capacité d’accomplir un acte puissant.
- issue: Portée de ἐπὶ τῆς γῆς
  choice: sur la terre
  alternative: dans le domaine terrestre
  rationale: La formulation directe conserve la tension du texte sans préciser de manière interprétative la relation entre cette autorité terrestre et l’autorité divine.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe conserve l’interruption narrative marquée par le tiret grec au moyen de points de suspension, puis reprend avec « Il dit ». Le tutoiement correspond à l’adresse directe singulière de Jésus à l’homme.
