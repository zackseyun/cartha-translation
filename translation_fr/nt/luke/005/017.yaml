  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ἐν μιᾷ τῶν ἡμερῶν καὶ αὐτὸς ἦν διδάσκων, καὶ ἦσαν καθήμενοι Φαρισαῖοι καὶ νομοδιδάσκαλοι οἳ ἦσαν ἐληλυθότες ἐκ πάσης κώμης τῆς Γαλιλαίας καὶ Ἰουδαίας καὶ Ἰερουσαλήμ· καὶ δύναμις κυρίου ἦν εἰς τὸ ἰᾶσθαι ⸀αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/017.yaml
  text: And it happened on one of those days that he was teaching[a], and Pharisees and teachers of the law were sitting there, who had come from every village of Galilee and Judea and from Jerusalem; and the power of the Lord was there for him to heal.
translation:
  language: fr
  text: Un de ces jours-là, Jésus enseignait. Des pharisiens et des enseignants de la Loi étaient assis là ; ils étaient venus de tous les villages de Galilée et de Judée, ainsi que de Jérusalem. Et la puissance du Seigneur était là pour que Jésus guérisse[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Certains manuscrits portent : « pour les guérir » au lieu de « pour que Jésus guérisse ».'
    reason: textual_variant
lexical_decisions:
- source_word: ἐγένετο ἐν μιᾷ τῶν ἡμερῶν
  choice: Un de ces jours-là
  rationale: Cette formulation française naturelle rend la formule narrative de Luc sans conserver le calque lourd « il arriva que ».
- source_word: αὐτὸς ἦν διδάσκων
  choice: Jésus enseignait
  rationale: L’imparfait rend l’action en cours. Le nom « Jésus » explicite naturellement le sujet en français sans donner à αὐτός une emphase indue.
- source_word: Φαρισαῖοι καὶ νομοδιδάσκαλοι
  choice: des pharisiens et des enseignants de la Loi
  rationale: « Pharisiens » est l’appellation française établie. « Enseignants de la Loi » rend directement le composé νομοδιδάσκαλοι, tandis que la majuscule à « Loi » signale ici la Loi mosaïque.
- source_word: ἐκ πάσης κώμης
  choice: de tous les villages
  rationale: κώμη désigne un village ou une petite localité ; le pluriel français exprime naturellement la valeur distributive de πάσης.
- source_word: Γαλιλαίας καὶ Ἰουδαίας καὶ Ἰερουσαλήμ
  choice: de Galilée et de Judée, ainsi que de Jérusalem
  rationale: La reprise de « de » devant Jérusalem distingue naturellement la ville des deux régions.
- source_word: δύναμις κυρίου
  choice: la puissance du Seigneur
  rationale: Cette traduction conserve la construction génitive et la portée théologique de la puissance divine à l’œuvre.
- source_word: ἦν εἰς τὸ ἰᾶσθαι αὐτόν
  choice: était là pour qu’il guérisse
  rationale: La proposition finale rend εἰς τὸ avec l’infinitif et comprend αὐτόν comme le sujet de l’activité de guérison, sans ajouter d’objet absent de cette forme du texte.
theological_decisions:
- issue: Sens de δύναμις κυρίου ἦν εἰς τὸ ἰᾶσθαι αὐτόν
  choice: La puissance du Seigneur était là pour que Jésus guérisse.
  alternative: La puissance du Seigneur était là pour les guérir.
  rationale: Le SBLGNT fourni lit αὐτόν, et non le pluriel αὐτούς. Le texte principal évite donc d’introduire « les », tout en conservant le lien entre la puissance divine et l’activité de guérison de Jésus. La variante plurielle est signalée en note.
translation_notes:
  register: Français international moderne, naturel et digne. Les phrases ont été légèrement réorganisées pour éviter une longue construction à relatives, tout en conservant la progression du récit et les rapports syntaxiques essentiels.
