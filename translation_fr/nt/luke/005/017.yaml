  source_fidelity: Le texte rend fidèlement la formule narrative, l’imparfait d’action en cours, la présence des pharisiens et enseignants de la Loi, leur provenance, et la puissance du Seigneur à l’œuvre. La leçon αὐτόν est correctement comprise comme désignant Jésus en sujet de l’infinitif, sans ajout d’un objet de guérison.
