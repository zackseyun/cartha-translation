id: LUK.5.20
reference: Luke 5:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἰδὼν τὴν πίστιν αὐτῶν ⸀εἶπεν· Ἄνθρωπε, ἀφέωνταί σοι αἱ ἁμαρτίαι σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/020.yaml
  text: And seeing their faith[a], he said, “Man[c][b], your sins are forgiven.”
translation:
  language: fr
  text: 'Voyant leur foi[a], il dit : « Homme, tes péchés sont pardonnés[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « confiance » ; grec : « foi ».'
    reason: lexical_alternative
  - marker: b
    text: Ou « ont été pardonnés ». Le parfait passif grec peut souligner un état présent résultant d’une action accomplie.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν
  choice: Voyant
  rationale: Le participe présent conserve la structure participiale et le mouvement narratif du grec sans préciser davantage la relation temporelle.
- source_word: πίστιν
  choice: foi
  rationale: « Foi » est le terme français courant dans ce contexte et exprime la confiance manifestée, sans privilégier la notion de fidélité.
- source_word: αὐτῶν
  choice: leur
  rationale: Le pluriel grec est conservé, sans limiter le référent aux porteurs ni décider s’il inclut explicitement l’homme paralysé.
- source_word: Ἄνθρωπε
  choice: Homme
  rationale: Le vocatif est rendu directement. « Mon ami » ajouterait une nuance affective absente du grec, tandis que « Monsieur » introduirait un registre social inapproprié.
- source_word: ἀφέωνταί
  choice: sont pardonnés
  rationale: Cette formulation française naturelle exprime l’état présent résultant de l’action accomplie que porte le parfait passif grec.
- source_word: ἁμαρτίαι
  choice: péchés
  rationale: Équivalent direct et usuel qui conserve la portée morale et théologique du terme.
- source_word: σοι ... σου
  choice: tes
  rationale: En français idiomatique, le possessif indique suffisamment la personne bénéficiaire du pardon; reproduire séparément le datif donnerait une tournure lourde.
theological_decisions:
- issue: Portée de « leur foi »
  choice: Conserver le pronom pluriel sans préciser davantage son référent.
  alternative: Comprendre uniquement la foi des hommes qui l’ont porté, ou la foi commune du paralysé et de ses compagnons.
  rationale: Le grec laisse ouverte l’étendue exacte du groupe désigné; la traduction préserve cette tension.
- issue: Portée temporelle de la déclaration de pardon
  choice: « tes péchés sont pardonnés »
  alternative: « tes péchés ont été pardonnés »
  rationale: Le parfait passif affirme un état présent issu d’une action accomplie sans trancher si la parole effectue le pardon à cet instant ou en annonce un déjà accordé.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe participiale est conservée parce qu’elle demeure naturelle en français. Le vocatif littéral « Homme » est inhabituel mais intelligible et évite d’ajouter une familiarité absente du texte source.
