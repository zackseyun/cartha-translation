source:
  edition: SBLGNT
  text: θάμβος γὰρ περιέσχεν αὐτὸν καὶ πάντας τοὺς σὺν αὐτῷ ἐπὶ τῇ ἄγρᾳ τῶν ἰχθύων ⸀ὧν συνέλαβον,
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/009.yaml
  text: For astonishment had seized him and all those with him because of the catch of fish that they had taken,[a]
translation:
  language: fr
  text: Car la stupéfaction l’avait saisi, lui et tous ceux qui étaient avec lui, à cause de la prise de poissons qu’ils avaient faite.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θάμβος
  choice: la stupéfaction
  rationale: Le nom exprime un étonnement intense et saisissant devant un événement extraordinaire. « Stupéfaction » conserve cette force dans un français actuel et digne.
- source_word: γὰρ
  choice: Car
  rationale: La conjonction introduit l’explication de la réaction de Simon rapportée au verset précédent.
- source_word: περιέσχεν
  choice: avait saisi
  rationale: Le verbe évoque littéralement ce qui entoure ou prend entièrement; avec « stupéfaction » pour sujet, « avait saisi » rend naturellement l’emprise de cette émotion.
- source_word: πάντας τοὺς σὺν αὐτῷ
  choice: tous ceux qui étaient avec lui
  rationale: Cette formulation préserve la portée collective et identifie clairement les personnes présentes aux côtés de Simon.
- source_word: ἐπὶ τῇ ἄγρᾳ τῶν ἰχθύων
  choice: à cause de la quantité de poissons
  rationale: ἐπί indique ici la cause de la stupéfaction. Dans ce contexte, ἄγρα désigne le produit de la pêche; « quantité de poissons » exprime naturellement en français le caractère exceptionnel de la prise sans répéter immédiatement « pris ».
- source_word: ὧν συνέλαβον
  choice: qu’ils avaient prise
  rationale: Le relatif renvoie grammaticalement à la quantité exprimée par la tournure française, et le pluriel du verbe grec indique que Simon et ses compagnons ont participé à la prise.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Le plus-que-parfait marque l’antériorité de la prise et de la saisie par rapport à la réaction décrite au verset précédent. La tournure évite la répétition peu élégante « prise de poissons qu’ils avaient pris ».
