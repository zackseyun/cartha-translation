  text: καὶ καταγαγόντες τὰ πλοῖα ἐπὶ τὴν γῆν ἀφέντες ⸀πάντα ἠκολούθησαν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/011.yaml
  text: And after bringing the boats to land[b][a], they left everything and followed him.
translation:
  language: fr
  text: Puis ils ramenèrent les barques à terre, laissèrent tout et le suivirent.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καταγαγόντες
  choice: Puis ils ramenèrent
  rationale: Le participe aoriste décrit une action accomplie avant les actions principales. La coordination avec « puis » rend naturellement la succession en français sans perdre l’antériorité contextuelle.
- source_word: τὰ πλοῖα
  choice: les barques
  rationale: Dans le contexte de la pêche sur le lac de Galilée, « barques » est le terme français courant et précis.
- source_word: ἐπὶ τὴν γῆν
  choice: à terre
  rationale: Cette expression naturelle correspond au sens littéral « sur la terre ferme » sans préciser indûment qu’il s’agit du rivage ou d’un accostage particulier.
- source_word: ἀφέντες
  choice: laissèrent
  rationale: Le participe aoriste signifie ici laisser derrière soi. Une forme verbale coordonnée donne une phrase française claire et conserve la suite des actions.
- source_word: πάντα
  choice: tout
  rationale: Le neutre pluriel a une portée globale. « Tout » exprime cette totalité de manière naturelle et forte en français.
- source_word: ἠκολούθησαν αὐτῷ
  choice: le suivirent
  rationale: « Suivre » conserve à la fois l’action narrative et sa portée de disciple, sans explicitation théologique ajoutée.
theological_decisions:
- issue: Portée du renoncement exprimé par πάντα
  choice: laissèrent tout
  alternative: abandonnèrent tout ce qu’ils avaient
  rationale: « Laissèrent tout » préserve la portée globale du texte tout en évitant de préciser la nature, la durée ou les modalités de ce renoncement.
translation_notes:
  register: Français international moderne, simple et digne. La coordination verbale rend les participes grecs avec fluidité; la brièveté et la force de la déclaration finale sont conservées.
