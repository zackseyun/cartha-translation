id: LUK.5.8
reference: Luke 5:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἰδὼν δὲ Σίμων Πέτρος προσέπεσεν τοῖς γόνασιν Ἰησοῦ λέγων· Ἔξελθε ἀπ’ ἐμοῦ, ὅτι ἀνὴρ ἁμαρτωλός εἰμι, κύριε·
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/008.yaml
  text: But when Simon Peter saw it[a], he fell at Jesus’s knees, saying, “Go away from me, because I am a sinful man[b], Lord.”
translation:
  language: fr
  text: 'Mais, à la vue de cela[a], Simon Pierre se jeta aux genoux de Jésus et dit : « Éloigne-toi de moi[b], car je suis un homme pécheur, Seigneur. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec laisse implicite ce que Simon Pierre voit ; le contexte renvoie à la pêche extraordinaire.
    reason: explicitation_contextuelle
  - marker: b
    text: 'Ou : « Va-t’en loin de moi. »'
    reason: alternative_lexicale
lexical_decisions:
- source_word: ἰδὼν
  choice: voyant cela
  rationale: Le participe aoriste est rendu par un participe français naturel. « Cela » explicite l’objet sous-entendu par le grec, à savoir la pêche extraordinaire décrite dans le contexte.
- source_word: δὲ
  choice: Mais
  rationale: La particule marque ici une transition narrative avec une légère nuance de contraste entre le miracle et la réaction de Simon Pierre.
- source_word: Σίμων Πέτρος
  choice: Simon Pierre
  rationale: Les deux noms présents dans le texte grec sont conservés.
- source_word: προσέπεσεν τοῖς γόνασιν Ἰησοῦ
  choice: tomba aux genoux de Jésus
  rationale: Cette formulation française naturelle conserve le mouvement et la posture corporelle très concrète exprimés par le grec.
- source_word: λέγων
  choice: et dit
  rationale: La coordination rend avec naturel en français l’action concomitante exprimée par le participe présent grec.
- source_word: Ἔξελθε ἀπ’ ἐμοῦ
  choice: Éloigne-toi de moi
  rationale: L’impératif exprime une demande pressante de séparation. Cette tournure est actuelle et digne, sans la raideur de « Retire-toi de moi ».
- source_word: ὅτι
  choice: car
  rationale: La conjonction introduit la raison donnée par Simon Pierre. « Car » convient au ton direct et solennel de la parole.
- source_word: ἀνὴρ ἁμαρτωλός
  choice: un homme pécheur
  rationale: Cette traduction conserve le nom masculin ἀνήρ, qui renvoie à Simon Pierre lui-même, ainsi que la construction adjectivale du grec.
- source_word: κύριε
  choice: Seigneur
  rationale: « Seigneur » préserve à la fois le respect manifesté envers Jésus et la portée théologique possible du titre dans ce contexte, sans imposer une interprétation plus précise.
theological_decisions:
- issue: Sens de κύριε dans l’adresse de Simon Pierre à Jésus
  choice: Seigneur
  alternative: maître ; monsieur
  rationale: Face au miracle, Simon Pierre exprime crainte et conscience de son péché. « Seigneur » maintient la révérence et l’éventuelle profondeur christologique du terme, tandis que « monsieur » l’atténuerait et que « maître » en préciserait autrement le sens.
translation_notes:
  register: Français international moderne, clair et digne. L’ordre final « Seigneur » est conservé afin de respecter l’accent rhétorique du grec. La formulation « un homme pécheur » maintient la référence explicitement masculine à Simon Pierre.
