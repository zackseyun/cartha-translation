id: LUK.5.23
reference: Luke 5:23
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τί ἐστιν εὐκοπώτερον, εἰπεῖν· Ἀφέωνταί σοι αἱ ἁμαρτίαι σου, ἢ εἰπεῖν· ⸀Ἔγειρε καὶ περιπάτει;
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/023.yaml
  text: 'Which is easier: to say[a], ‘Your sins are forgiven you,’ or to say, ‘Rise and walk’?”'
translation:
  language: fr
  text: 'Qu’est-ce qui est plus facile : dire « Tes péchés sont pardonnés[a] », ou dire « Lève-toi et marche » ?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Tes péchés ont été pardonnés ».
    reason: Alternative temporelle permettant de faire ressortir l’état résultant d’une action accomplie exprimé par le parfait grec.
lexical_decisions:
- source_word: τί ἐστιν εὐκοπώτερον
  choice: Qu’est-ce qui est le plus facile
  rationale: Cette formulation française naturelle conserve la question comparative exprimée par τί avec εὐκοπώτερον.
- source_word: εἰπεῖν
  choice: dire
  rationale: L’infinitif introduit le contenu de chacune des deux paroles mises en parallèle.
- source_word: Ἀφέωνταί
  choice: sont pardonnés
  rationale: Dans ce contexte, ἀφίημι désigne le pardon des péchés. Le parfait à forme passive exprime un état présent résultant d’une action accomplie; « sont pardonnés » le rend clairement sans surinterpréter le temps verbal ni préciser l’agent.
- source_word: σοι
  choice: tes
  rationale: En français, le datif personnel et le possessif grec qui suit sont rendus naturellement ensemble par « Tes péchés sont pardonnés », plutôt que par le calque lourd « sont pardonnés à toi ».
- source_word: αἱ ἁμαρτίαι σου
  choice: Tes péchés
  rationale: Le possessif français rend directement et idiomatiquement la construction grecque.
- source_word: ἢ
  choice: ou
  rationale: La conjonction disjonctive oppose les deux paroles.
- source_word: Ἔγειρε
  choice: Lève-toi
  rationale: Cet impératif est naturel en français moderne, digne et précis dans le contexte de la guérison.
- source_word: καὶ περιπάτει
  choice: et marche
  rationale: Le verbe désigne ici l’action physique de marcher; l’impératif français conserve le parallélisme avec « Lève-toi ».
theological_decisions:
- issue: Rendre la déclaration de pardon sans ajouter une nuance doctrinale au parfait passif grec
  choice: Tes péchés sont pardonnés
  alternative: Tes péchés ont été pardonnés
  rationale: Le choix principal exprime l’état présent de pardon et maintient le contraste avec l’ordre de guérison, sans attribuer explicitement l’action ni faire porter au temps français une précision théologique excessive.
translation_notes:
  register: Français international moderne, clair et digne. « Lève-toi » est plus naturel ici que « Debout » ou « Relève-toi ». La ponctuation met nettement en parallèle les deux paroles sans alourdir la phrase.
