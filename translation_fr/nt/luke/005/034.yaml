source:
  edition: SBLGNT
  text: ὁ ⸀δὲ εἶπεν πρὸς αὐτούς· Μὴ δύνασθε τοὺς υἱοὺς τοῦ νυμφῶνος ἐν ᾧ ὁ νυμφίος μετ’ αὐτῶν ἐστιν ποιῆσαι ⸀νηστεῦσαι;
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/034.yaml
  text: And he said to them[a], “You cannot make the wedding guests fast while the bridegroom is with them, can you?”
translation:
  language: fr
  text: 'Il leur dit : « Vous ne pouvez pas faire jeûner les invités de la noce[a] pendant que le marié est avec eux, n’est-ce pas ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les fils de la salle nuptiale », expression désignant les compagnons du marié ou les invités de la noce.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ δύνασθε
  choice: Vous ne pouvez pas… n’est-ce pas ?
  rationale: Avec μή, la question appelle une réponse négative. Cette tournure française conserve clairement la force rhétorique sans transformer la question en simple affirmation.
- source_word: τοὺς υἱοὺς τοῦ νυμφῶνος
  choice: les invités de la noce
  rationale: L’expression signifie littéralement « les fils de la salle nuptiale » et désigne les personnes associées à la célébration, notamment les compagnons du marié. « Les invités de la noce » en transmet naturellement le sens en français moderne.
- source_word: νυμφίος
  choice: le marié
  rationale: « Le marié » est l’équivalent français courant et conserve l’image nuptiale essentielle à la parole.
- source_word: μετ’ αὐτῶν ἐστιν
  choice: est avec eux
  rationale: Traduction directe et naturelle de la présence du marié auprès des participants à la noce.
- source_word: ποιῆσαι νηστεῦσαι
  choice: faire jeûner
  rationale: La construction de ποιέω suivi de l’infinitif est causative. « Faire jeûner » préserve ce sens avec concision.
- source_word: νηστεῦσαι
  choice: jeûner
  rationale: Terme français standard pour l’abstention de nourriture pratiquée dans ce contexte religieux.
theological_decisions:
- issue: Identification métaphorique de Jésus au marié
  choice: Conserver l’image du marié sans en expliciter la portée théologique dans le texte principal.
  alternative: Préciser explicitement que Jésus se présente comme le marié.
  rationale: Le verset suggère cette identification par la métaphore, mais ne l’explique pas directement. La traduction préserve donc l’image et sa tension théologique sans ajouter d’interprétation.
translation_notes:
  register: Français international moderne, naturel et digne. La question finale « n’est-ce pas ? » rend l’attente d’une réponse négative, tandis que « faire jeûner » maintient la valeur causative du grec.
