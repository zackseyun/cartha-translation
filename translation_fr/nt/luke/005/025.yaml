id: LUK.5.25
reference: Luke 5:25
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ παραχρῆμα ἀναστὰς ἐνώπιον αὐτῶν, ἄρας ἐφ’ ὃ κατέκειτο, ἀπῆλθεν εἰς τὸν οἶκον αὐτοῦ δοξάζων τὸν θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/025.yaml
  text: And immediately he stood up before them[a], picked up what he had been lying on, and went away to his house, glorifying God.
translation:
  language: fr
  text: Et aussitôt, il se leva devant eux, prit ce sur quoi il était couché[a] et s’en alla chez lui en glorifiant Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « la natte sur laquelle il était couché » ; littéralement : « ce sur quoi il était couché ».'
    reason: Variante lexicale explicitant l’objet sans l’imposer dans le texte principal.
lexical_decisions:
- source_word: παραχρῆμα
  choice: aussitôt
  rationale: L’adverbe exprime l’absence de délai et souligne l’effet immédiat de la guérison.
- source_word: ἀναστὰς
  choice: il se leva
  rationale: Le participe aoriste est rendu par un verbe conjugué afin d’exprimer naturellement en français la succession des actions.
- source_word: ἐνώπιον αὐτῶν
  choice: devant eux
  rationale: Cette formulation concise conserve l’idée que l’action se déroule publiquement en leur présence, sans ajouter l’image plus interprétative de « sous leurs yeux ».
- source_word: ἄρας
  choice: prit
  rationale: Dans ce contexte, αἴρω désigne le fait de prendre et d’emporter ce sur quoi l’homme était couché. « Prit » est naturel et laisse le mouvement être précisé par la suite de la phrase.
- source_word: ἐφ’ ὃ κατέκειτο
  choice: ce sur quoi il était couché
  rationale: Le grec emploie une expression relative sans nommer explicitement une natte ou un lit. La traduction en conserve l’indétermination.
- source_word: ἀπῆλθεν εἰς τὸν οἶκον αὐτοῦ
  choice: s’en alla chez lui
  rationale: « S’en alla » rend la nuance de départ, tandis que « chez lui » exprime naturellement en français le retour à sa maison.
- source_word: δοξάζων τὸν θεόν
  choice: en glorifiant Dieu
  rationale: Cette traduction préserve le langage d’honneur rendu à Dieu et la simultanéité indiquée par le participe présent.
theological_decisions:
- issue: Faut-il préciser que l’objet emporté était une natte ou un lit ?
  choice: Conserver dans le texte l’expression indéterminée « ce sur quoi il était couché ».
  alternative: « la natte sur laquelle il était couché » ou « le lit sur lequel il était couché »
  rationale: Ce verset ne contient aucun nom explicite désignant l’objet. La formulation retenue évite d’ajouter une précision absente de cette proposition, tout en donnant en note une lecture explicite possible d’après le contexte.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe suit clairement la succession rapide des actions, tout en conservant l’indétermination du grec concernant l’objet emporté.
