  text: Ἐγένετο δὲ ἐν τῷ τὸν ὄχλον ἐπικεῖσθαι αὐτῷ ⸀καὶ ἀκούειν τὸν λόγον τοῦ θεοῦ καὶ αὐτὸς ἦν ἑστὼς παρὰ τὴν λίμνην Γεννησαρέτ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/001.yaml
  text: It happened that while the crowd was pressing in on him and listening to the word of God[a], he was standing by the lake of Gennesaret[b],
translation:
  language: fr
  text: Il arriva que, tandis que la foule se pressait contre lui et écoutait la parole de Dieu[a], il se tenait au bord du lac de Génésareth[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « entendait la parole de Dieu ».'
    reason: lexical_alternative
  - marker: b
    text: Le lac de Génésareth est aussi connu sous le nom de la mer de Galilée.
    reason: cultural_note
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: Il arriva que
  rationale: Cette formule narrative fréquente chez Luc introduit l’événement. « Il arriva que » en conserve la fonction sans ajouter un repère temporel absent du grec; la légère valeur connective de δέ reste implicite dans l’enchaînement.
- source_word: ἐν τῷ ... ἐπικεῖσθαι ... καὶ ἀκούειν
  choice: tandis que ... se pressait ... et écoutait
  rationale: La construction ἐν τῷ suivie d’infinitifs a ici une valeur temporelle. « Tandis que » exprime la simultanéité et garde distinctes les deux actions de la foule.
- source_word: ἐπικεῖσθαι αὐτῷ
  choice: se pressait contre lui
  rationale: Le verbe évoque une foule qui exerce une pression physique sur Jésus; cette formulation est naturelle en français et plus précise que « se rassemblait autour de lui ».
- source_word: ἀκούειν
  choice: écoutait
  rationale: « Écoutait » exprime l’attention active de la foule, tout en laissant en note l’équivalent plus littéral « entendait ».
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: la parole de Dieu
  rationale: Cette expression française consacrée préserve à la fois la portée théologique et la résonance intertextuelle du grec, sans la réduire à la seule idée de « message ».
- source_word: καὶ αὐτὸς ἦν ἑστὼς
  choice: il se tenait
  rationale: La tournure rend l’état continu exprimé par la construction périphrastique grecque. Le pronom αὐτός n’exige pas ici une insistance telle que « lui-même ».
- source_word: παρὰ τὴν λίμνην
  choice: au bord du lac
  rationale: Cette expression idiomatique indique clairement une position près de la rive.
- source_word: Γεννησαρέτ
  choice: Génésareth
  rationale: La forme française usuelle translittère le nom propre du texte grec au lieu de lui substituer l’appellation explicative « mer de Galilée ».
theological_decisions:
- issue: Sens de τὸν λόγον τοῦ θεοῦ
  choice: la parole de Dieu
  alternative: le message de Dieu
  rationale: Le contexte vise la proclamation venant de Dieu, mais « parole de Dieu » conserve l’étendue sémantique et théologique de l’expression sans préciser davantage que le texte.
- issue: Identification de Γεννησαρέτ
  choice: Génésareth
  alternative: mer de Galilée
  rationale: Le verset nomme explicitement le lac de Génésareth. L’autre appellation est fournie en note à titre d’information géographique, sans remplacer le nom employé par Luc.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe conserve la formule narrative lucanienne ainsi que la simultanéité des actions, sans lourdeur excessive. Les noms et expressions bibliques familiers sont maintenus lorsqu’ils reflètent directement le grec.
