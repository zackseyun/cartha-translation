review_pass:
  verdict: revise
  source_fidelity: 'Le sens essentiel est bien rendu : Jésus étend la main, touche l’homme, exprime sa volonté, ordonne la purification, puis la lèpre disparaît immédiatement. « Puis » introduit toutefois une nuance de succession plus marquée que le simple καί grec ; « Et » reproduit plus sobrement l’enchaînement du texte.'
  naturalness: Le français est naturel, sobre et adapté à un registre biblique moderne. « Je le veux ; sois purifié » est idiomatique dans ce contexte et conserve la force de la parole grecque.
  terminology: « Sois purifié » rend justement καθαρίσθητι en maintenant la notion de purification. « Lèpre » est le rendu usuel de λέπρα, avec une note explicative appropriée. La qualification « graves » dans la note va au-delà de ce que le terme grec établit à lui seul et doit être supprimée.
  issues:
  - severity: low
    issue: Nuance ajoutée par « Puis »
    rationale: Le καί initial est une simple coordination narrative. « Puis » reste possible, mais « Et » est plus proche de l’enchaînement non marqué du grec.
  - severity: low
    issue: La note qualifie les affections de « graves »
    rationale: λέπρα a un champ sémantique plus large que la lèpre moderne, mais le mot grec ne permet pas à lui seul d’affirmer que toutes les affections visées étaient « graves ». Une formulation neutre préserve mieux l’incertitude historique.
