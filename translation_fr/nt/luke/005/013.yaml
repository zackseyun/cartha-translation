id: LUK.5.13
reference: Luke 5:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἐκτείνας τὴν χεῖρα ἥψατο αὐτοῦ ⸀εἰπών· Θέλω, καθαρίσθητι· καὶ εὐθέως ἡ λέπρα ἀπῆλθεν ἀπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/013.yaml
  text: And stretching out his hand[a], he touched him, saying, “I am willing; be cleansed.” And immediately the leprosy left him.
translation:
  language: fr
  text: 'Et, étendant la main, il le toucha et dit : « Je le veux ; sois purifié. » Aussitôt, la lèpre[a] le quitta.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, dans un sens plus large, « maladie de peau » ; dans la Bible, le terme grec λέπρα peut désigner diverses affections cutanées, et pas seulement la lèpre au sens moderne.
    reason: cultural_note
lexical_decisions:
- source_word: ἐκτείνας τὴν χεῖρα
  choice: étendant la main
  rationale: Cette tournure conserve l’action physique exprimée par le participe aoriste et reste naturelle en français.
- source_word: ἥψατο αὐτοῦ
  choice: il le toucha
  rationale: Le génitif régi par ἅπτομαι se rend naturellement par un complément d’objet direct en français.
- source_word: Θέλω
  choice: Je le veux
  rationale: La formule exprime clairement la volonté et la disposition de Jésus, tout en faisant écho à la demande du verset précédent.
- source_word: καθαρίσθητι
  choice: sois purifié
  rationale: L’impératif passif préserve la notion de purification, qui englobe ici la guérison physique et la restauration liée à l’impureté rituelle.
- source_word: εὐθέως
  choice: Aussitôt
  rationale: Rendu temporel courant et direct, qui conserve l’immédiateté de l’action.
- source_word: λέπρα
  choice: lèpre
  rationale: Le terme traditionnel reste immédiatement reconnaissable dans ce récit, tandis qu’une note précise que le mot grec avait un champ d’application plus large que la maladie de Hansen moderne.
- source_word: ἀπῆλθεν ἀπ’ αὐτοῦ
  choice: le quitta
  rationale: Expression française idiomatique qui conserve l’image de la maladie s’éloignant de l’homme.
theological_decisions:
- issue: Rendu de καθαρίσθητι dans la guérison d’un homme atteint de lèpre
  choice: sois purifié
  alternative: sois guéri ; sois rendu pur
  rationale: Le grec met l’accent sur la purification plutôt que sur la seule guérison médicale. Ce choix maintient ensemble les dimensions physique, rituelle et sociale sans les réduire l’une à l’autre.
translation_notes:
  register: Français international moderne, sobre et digne. « Je le veux » répond naturellement à la formulation du verset précédent et évite l’ambiguïté d’un simple futur. Le marqueur de note est placé après « lèpre », terme auquel la note se rapporte.
