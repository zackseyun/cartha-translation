  text: ἀλλὰ οἶνον νέον εἰς ἀσκοὺς καινοὺς ⸀βλητέον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/038.yaml
  text: But new wine must be put into fresh wineskins[a].
translation:
  language: fr
  text: Mais il faut mettre le vin nouveau dans des outres neuves[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec emploie deux adjectifs différents : νέος (« nouveau », surtout quant au temps) pour le vin, et καινός (« neuf », notamment quant à l’état ou à la qualité) pour les outres.'
    reason: alternative lexicale et préservation d’une nuance du texte grec
lexical_decisions:
- source_word: ἀλλὰ
  choice: Mais
  rationale: La conjonction marque le contraste avec la pratique inadéquate décrite au verset précédent. « Mais » est naturel et suffisamment adversatif en français.
- source_word: οἶνον νέον
  choice: le vin nouveau
  rationale: νέον qualifie directement le vin et indique ici un vin récemment produit. « Vin nouveau » est l’expression française usuelle et exacte dans ce contexte.
- source_word: εἰς
  choice: dans
  rationale: Avec le verbe de placement, « mettre dans » exprime naturellement en français le mouvement vers l’intérieur du récipient.
- source_word: ἀσκοὺς
  choice: des outres
  rationale: ἀσκός désigne un récipient fait de peau et servant notamment à conserver du vin. « Outres » est le terme français précis et traditionnel, encore compréhensible.
- source_word: καινοὺς
  choice: neuves
  rationale: καινός souligne que les outres sont neuves et donc en bon état, adaptées au vin nouveau. « Outres neuves » est plus idiomatique que « outres fraîches » ; la nuance par rapport à νέος est signalée en note.
- source_word: βλητέον
  choice: il faut mettre
  rationale: L’adjectif verbal exprime une nécessité impersonnelle. « Il faut mettre » en rend clairement la force sans préciser un agent absent du grec.
theological_decisions:
- issue: Distinction entre νέος et καινός dans la même phrase
  choice: Traduire par « vin nouveau » et « outres neuves », avec une note expliquant les deux adjectifs grecs
  alternative: Employer une formulation explicative telle que « outres encore souples »
  rationale: 'Le grec emploie deux adjectifs distincts : νέος évoque surtout ce qui est récent dans le temps, tandis que καινός peut souligner la nouveauté d’état ou de qualité. Le français idiomatique ne permet pas de reproduire nettement cette distinction sans paraphrase interprétative ; la note la préserve sans surcharger le texte.'
translation_notes:
  register: Français international moderne, simple et digne. La tournure impersonnelle « il faut » conserve la nécessité exprimée par βλητέον. « Outres » maintient l’objet culturel précis sans paraphrase excessive.
