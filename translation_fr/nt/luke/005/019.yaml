id: LUK.5.19
reference: Luke 5:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ μὴ εὑρόντες ποίας εἰσενέγκωσιν αὐτὸν διὰ τὸν ὄχλον ἀναβάντες ἐπὶ τὸ δῶμα διὰ τῶν κεράμων καθῆκαν αὐτὸν σὺν τῷ κλινιδίῳ εἰς τὸ μέσον ἔμπροσθεν τοῦ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/019.yaml
  text: And not finding a way to bring him in because of the crowd[a], they went up on the roof and lowered him with his mat through the tiles into the middle[c][b], in front of Jesus.
translation:
  language: fr
  text: Comme ils ne trouvaient pas par où le faire entrer à cause de la foule[a], ils montèrent sur le toit et, à travers les tuiles[b], le descendirent avec sa natte[c] au milieu, devant Jésus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « comment le faire entrer à cause de la foule ». La tournure grecque peut porter sur le passage à emprunter aussi bien que sur la manière de procéder.
    reason: lexical_alternative
  - marker: b
    text: Il s’agit des tuiles du toit. La formulation de Luc évoque une toiture couverte de tuiles.
    reason: cultural_note
  - marker: c
    text: Ou « avec son petit lit » ou « avec sa couche ». Le terme grec désigne un petit lit ou une natte sur laquelle on peut s’allonger.
    reason: lexical_alternative
lexical_decisions:
- source_word: ποίας εἰσενέγκωσιν
  choice: par où le faire entrer
  rationale: La tournure elliptique peut désigner le passage par lequel entrer ou la manière de procéder. « Par où » convient naturellement au contexte d’un accès bloqué, sans exclure entièrement la nuance de moyen.
- source_word: διὰ τὸν ὄχλον
  choice: à cause de la foule
  rationale: 'διά avec l’accusatif a ici une valeur causale : la foule constitue l’obstacle.'
- source_word: ἀναβάντες ἐπὶ τὸ δῶμα
  choice: ils montèrent sur le toit
  rationale: Cette formulation moderne rend le mouvement vers la toiture sans imposer davantage de détails architecturaux.
- source_word: διὰ τῶν κεράμων
  choice: à travers les tuiles
  rationale: Le pluriel κεράμων désigne les tuiles de la toiture et conserve le détail architectural propre au récit de Luc.
- source_word: καθῆκαν
  choice: le descendirent
  rationale: Le verbe exprime l’action de faire descendre quelqu’un depuis un point situé en hauteur.
- source_word: σὺν τῷ κλινιδίῳ
  choice: avec sa natte
  rationale: κλινίδιον désigne un petit lit, une couche ou une natte. « Natte » est courant et évite la connotation médicale moderne de « brancard ».
- source_word: εἰς τὸ μέσον
  choice: au milieu de l’assemblée
  rationale: Le grec dit littéralement « au milieu ». L’ajout explicatif « de l’assemblée » indique naturellement le groupe au milieu duquel l’homme est déposé, sans changer la scène.
- source_word: ἔμπροσθεν τοῦ Ἰησοῦ
  choice: devant Jésus
  rationale: La formule exprime clairement la position spatiale de l’homme par rapport à Jésus.
theological_decisions: []
