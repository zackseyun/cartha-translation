id: LUK.5.32
reference: Luke 5:32
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὐκ ἐλήλυθα καλέσαι δικαίους ἀλλὰ ἁμαρτωλοὺς εἰς μετάνοιαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/032.yaml
  text: I have not come to call the righteous, but sinners to a change of mind.
translation:
  language: fr
  text: Je ne suis pas venu appeler des justes, mais des pécheurs à la repentance.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « à se repentir ». L’expression grecque εἰς μετάνοιαν indique le but de l’appel.'
    reason: Variante de formulation idiomatique et précision sur la relation exprimée par εἰς.
lexical_decisions:
- source_word: ἐλήλυθα
  choice: je ne suis pas venu
  rationale: Le parfait de ἔρχομαι présente la venue de Jésus comme accomplie avec une portée présente; cette tournure française exprime naturellement sa mission.
- source_word: καλέσαι
  choice: appeler
  rationale: L’infinitif exprime ici le but de la venue. « Appeler » conserve la portée ouverte du grec, qui peut évoquer à la fois l’invitation et la convocation.
- source_word: δικαίους
  choice: des justes
  rationale: L’adjectif substantivé désigne des personnes justes. Cette formulation maintient la catégorie telle quelle sans préciser s’il s’agit de personnes réellement justes ou tenues pour telles.
- source_word: ἁμαρτωλούς
  choice: des pécheurs
  rationale: Équivalent français direct et usuel du substantif désignant ceux qui sont caractérisés comme pécheurs.
- source_word: εἰς μετάνοιαν
  choice: à changer de vie
  rationale: Dans ce contexte, μετάνοια désigne une réorientation intérieure qui se manifeste dans la vie. « Changer de vie » est naturel en français moderne et restitue mieux cette portée qu’un simple « changer d’avis »; une formulation nominale plus traditionnelle est signalée en note.
theological_decisions:
- issue: Le statut des « justes » dans le contraste entre justes et pécheurs
  choice: Conserver sans qualification les catégories « des justes » et « des pécheurs ».
  alternative: Ceux qui se croient justes / ceux qui sont considérés comme justes
  rationale: Le grec ne comporte aucune qualification explicite. En ajouter une résoudrait une tension théologique que le texte laisse ouverte.
- issue: La portée de μετάνοια
  choice: Rendre le terme par « changer de vie », qui implique une réorientation profonde sans en détailler les composantes.
  alternative: À la repentance / à changer de manière de penser
  rationale: Le contexte appelle davantage qu’une simple modification d’opinion, mais le texte ne développe pas ici toute la nature de ce changement.
translation_notes:
  register: Français international moderne, simple et digne. La phrase conserve le contraste net et la concision de l’original. Le marqueur de note [a] est placé après l’expression qu’il éclaire.
