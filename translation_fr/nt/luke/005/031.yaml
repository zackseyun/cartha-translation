  text: καὶ ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν πρὸς αὐτούς· Οὐ χρείαν ἔχουσιν οἱ ὑγιαίνοντες ἰατροῦ ἀλλὰ οἱ κακῶς ἔχοντες·
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/031.yaml
  text: And Jesus answered them[a], “Those who are healthy have no need of a physician, but those who are sick do.”
translation:
  language: fr
  text: 'Jésus leur répondit : « Ce ne sont pas les gens en bonne santé qui ont besoin d’un médecin, mais les malades. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς ... εἶπεν πρὸς αὐτούς
  choice: Jésus leur répondit
  rationale: La construction grecque associe un participe signifiant « répondre » au verbe « dire ». En français narratif naturel, « leur répondit » conserve à la fois la valeur responsive et les destinataires sans reproduire lourdement les deux verbes.
- source_word: Οὐ χρείαν ἔχουσιν
  choice: Ce ne sont pas ... qui ont besoin
  rationale: Cette tournure française exprime naturellement l’absence de besoin et permet de préserver le contraste emphatique entre les deux groupes.
- source_word: οἱ ὑγιαίνοντες
  choice: les gens en bonne santé
  rationale: Le participe substantivé désigne les personnes qui se trouvent en état de santé. « Les gens en bonne santé » est courant, clair et évite une formulation trop abstraite.
- source_word: ἰατροῦ
  choice: d’un médecin
  rationale: « Médecin » est l’équivalent moderne, précis et digne de ἰατρός en français international.
- source_word: οἱ κακῶς ἔχοντες
  choice: les malades
  rationale: L’expression grecque signifie littéralement « ceux qui vont mal », mais constitue ici une locution idiomatique désignant les personnes malades. « Les malades » rend ce sens avec concision et conserve le parallélisme proverbial.
