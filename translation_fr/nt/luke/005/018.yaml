id: LUK.5.18
reference: Luke 5:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ἄνδρες φέροντες ἐπὶ κλίνης ἄνθρωπον ὃς ἦν παραλελυμένος, καὶ ἐζήτουν αὐτὸν εἰσενεγκεῖν καὶ ⸀θεῖναι ἐνώπιον αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/018.yaml
  text: And behold[a], men were carrying on a bed a man who was paralyzed[b], and they were seeking to bring him in and set him before him.
translation:
  language: fr
  text: Et voici que des hommes portaient sur un lit[a] un homme paralysé. Ils cherchaient à le faire entrer et à le placer devant lui[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sur une civière » ou « sur une couche »; le grec peut désigner différents supports semblables à un lit.
    reason: lexical_alternative
  - marker: b
    text: C’est-à-dire devant Jésus.
    reason: referent_clarification
lexical_decisions:
- source_word: ἰδοὺ
  choice: voici que
  rationale: Cette tournure française conserve la fonction de mise en relief et la vivacité narrative de la particule, sans recourir à l’archaïque « voici » employé isolément.
- source_word: ἄνδρες
  choice: des hommes
  rationale: Le terme désigne ici des adultes de sexe masculin; « des hommes » est précis et naturel.
- source_word: φέροντες
  choice: portaient
  rationale: L’imparfait rend l’action en cours exprimée par le participe présent dans le cadre narratif.
- source_word: ἐπὶ κλίνης
  choice: sur un lit
  rationale: κλίνη désigne un meuble ou support sur lequel on s’allonge. « Lit » reste proche du grec et évite de préciser indûment qu’il s’agissait d’un brancard.
- source_word: ἄνθρωπον
  choice: un homme
  rationale: Dans ce contexte, le mot désigne un individu masculin; « un homme » convient au récit.
- source_word: παραλελυμένος
  choice: paralysé
  rationale: Le participe parfait passif décrit l’état résultant de la paralysie; l’adjectif français l’exprime clairement sans ajout médical.
- source_word: ἐζήτουν
  choice: ils cherchaient
  rationale: L’imparfait conserve l’idée d’une tentative en cours, sans présumer encore de son résultat.
- source_word: εἰσενεγκεῖν
  choice: à le faire entrer
  rationale: La formulation rend le mouvement vers l’intérieur tout en tenant compte du fait que l’homme est transporté.
- source_word: θεῖναι
  choice: à le placer
  rationale: « Placer » traduit sobrement τίθημι sans préciser davantage la posture de l’homme.
- source_word: ἐνώπιον αὐτοῦ
  choice: devant lui
  rationale: La traduction conserve le pronom du texte grec plutôt que de lui substituer explicitement le nom de Jésus.
theological_decisions:
- issue: Référent du dernier αὐτοῦ
  choice: devant lui
  alternative: devant Jésus
  rationale: Le contexte identifie naturellement Jésus comme référent, mais le grec emploie un pronom. Le conserver respecte la formulation et la cohésion du récit sans en changer le sens.
translation_notes:
  register: Français international moderne, clair et digne. « Et voici que » maintient la vivacité du récit; les imparfaits présentent les actions en cours. La phrase a été divisée en deux pour une lecture naturelle, sans modifier les rapports logiques du grec.
