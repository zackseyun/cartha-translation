  text: καὶ εἶδεν ⸂δύο πλοῖα⸃ ἑστῶτα παρὰ τὴν λίμνην, οἱ δὲ ἁλιεῖς ⸂ἀπ’ αὐτῶν ἀποβάντες⸃ ⸀ἔπλυνον τὰ δίκτυα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/002.yaml
  text: And he saw two boats standing by the lake[a], but the fishermen, having gotten out of them, were washing the nets.
translation:
  language: fr
  text: Il vit deux barques au bord du lac ; les pêcheurs en étaient descendus[a] et lavaient les filets.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « étaient débarqués de ces barques ».'
    reason: 'Alternative lexicale pour ἀποβάντες : le verbe peut être rendu par « débarquer », tout en explicitant par « de ces barques » le complément ἀπ’ αὐτῶν.'
lexical_decisions:
- source_word: εἶδεν
  choice: vit
  rationale: L’aoriste de ὁράω exprime simplement la perception dans le récit ; « vit » est direct et naturel.
- source_word: δύο πλοῖα
  choice: deux barques
  rationale: Dans ce contexte de pêche sur un lac, « barques » est plus naturel et précis en français moderne que « bateaux » ou « navires ».
- source_word: ἑστῶτα παρὰ τὴν λίμνην
  choice: au bord du lac
  rationale: Le participe parfait décrit les barques comme présentes et immobiles à cet endroit. En français, « deux barques au bord du lac » exprime naturellement cette situation sans employer le calque peu idiomatique « se tenant ».
- source_word: οἱ δὲ ἁλιεῖς
  choice: les pêcheurs
  rationale: Le point-virgule marque la légère transition ou opposition portée par δέ sans imposer un « mais » trop fortement contrastif.
- source_word: ἀπ’ αὐτῶν ἀποβάντες
  choice: en étaient descendus
  rationale: Le participe aoriste indique une action antérieure à celle de laver les filets. Le plus-que-parfait rend clairement cette succession, et « en » reprend naturellement les barques.
- source_word: ἔπλυνον τὰ δίκτυα
  choice: lavaient les filets
  rationale: L’imparfait grec présente l’action en cours ; l’imparfait français en conserve l’aspect. L’article défini respecte τὰ sans ajouter le possessif « leurs ».
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La formulation évite le calque « deux barques se tenant » tout en conservant leur position au bord du lac. Le point-virgule maintient le lien entre les barques et les pêcheurs ainsi que la légère transition marquée par δέ.
