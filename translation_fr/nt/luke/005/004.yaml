source:
  edition: SBLGNT
  text: ὡς δὲ ἐπαύσατο λαλῶν, εἶπεν πρὸς τὸν Σίμωνα· Ἐπανάγαγε εἰς τὸ βάθος καὶ χαλάσατε τὰ δίκτυα ὑμῶν εἰς ἄγραν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/004.yaml
  text: When he had finished speaking[a], he said to Simon, “Put out into the deep water, and let down your nets for a catch.”
translation:
  language: fr
  text: 'Quand il eut fini de parler, il dit à Simon : « Avance vers les eaux profondes[a] et jetez vos filets pour prendre du poisson. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « vers la profondeur » ; l’expression désigne ici les eaux profondes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ
  choice: Quand
  rationale: Introduit naturellement l’événement suivant et sa relation temporelle avec la prise de parole, sans surtraduire la légère progression narrative marquée par δέ.
- source_word: ἐπαύσατο λαλῶν
  choice: il eut fini de parler
  rationale: Le verbe παύω accompagné du participe présent exprime la cessation d’une action en cours. Le passé antérieur convient à cette proposition temporelle dans un récit au passé.
- source_word: εἶπεν πρὸς τὸν Σίμωνα
  choice: il dit à Simon
  rationale: Rend directement la formule introductive sans donner au verbe λέγω la nuance plus forte d’un ordre explicite.
- source_word: Ἐπανάγαγε
  choice: Avance
  rationale: Dans ce contexte nautique, le verbe désigne le fait d’éloigner l’embarcation du rivage. « Avance » est naturel et conserve l’impératif singulier adressé à Simon.
- source_word: εἰς τὸ βάθος
  choice: en eau profonde
  rationale: βάθος désigne ici la profondeur de l’eau. Cette formulation française claire évite « au large », qui mettrait surtout l’accent sur l’éloignement du rivage.
- source_word: χαλάσατε
  choice: jetez
  rationale: Pour des filets de pêche, « jeter les filets » est une expression française naturelle. Le pluriel de l’impératif grec est conservé, après le singulier adressé à Simon.
- source_word: τὰ δίκτυα ὑμῶν
  choice: vos filets
  rationale: Rend simplement le nom pluriel et le possessif pluriel grecs.
- source_word: εἰς ἄγραν
  choice: pour prendre du poisson
  rationale: ἄγρα désigne ici une prise de pêche. La formulation exprime naturellement le but en français, sans l’expression peu idiomatique « pour une prise ».
theological_decisions:
- issue: Alternance entre l’impératif singulier Ἐπανάγαγε et l’impératif pluriel χαλάσατε
  choice: « Avance » au singulier, puis « jetez » au pluriel
  alternative: Uniformiser les deux impératifs au singulier ou au pluriel
  rationale: Le grec passe délibérément d’un ordre adressé à Simon à un ordre impliquant plusieurs personnes. La traduction conserve cette variation sans préciser davantage l’identité des autres participants.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation conserve l’enchaînement narratif ainsi que le passage significatif du singulier au pluriel. Le marqueur de note est placé après l’expression qu’il explique.
