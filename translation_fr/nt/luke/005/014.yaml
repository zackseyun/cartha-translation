    issue: « présente, pour ta purification, ce que Moïse a prescrit »
    rationale: προσένεγκε est employé dans un contexte d’offrande; « présenter ce que Moïse a prescrit » transforme l’acte d’offrir en présentation d’un contenu indéterminé. « offrir ... comme Moïse l’a prescrit » conserve mieux l’acte cultuel et la portée de καθὼς.
  - severity: low
    issue: 'Insertion de « mais lui dit : »'
    rationale: Le grec enchaîne l’interdiction et les impératifs sous la même instruction. La reformulation indirecte est plus fluide en français sans ajouter un second acte de parole.
