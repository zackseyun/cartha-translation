  to: Il lui ordonna de n’en parler à personne, mais d’aller se montrer au prêtre et d’offrir, pour sa purification, comme Moïse l’a prescrit[b], afin que cela leur serve de témoignage[a].
  rationale: La révision rétablit la valeur d’offrande de προσένεγκε, conserve le caractère rituel de « purification » et maintient volontairement indéterminés les destinataires et la nuance de « témoignage ». Les ancres de notes restent placées sur les expressions qu’elles éclairent.
