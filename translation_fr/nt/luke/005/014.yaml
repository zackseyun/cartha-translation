id: LUK.5.14
reference: Luke 5:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ αὐτὸς παρήγγειλεν αὐτῷ μηδενὶ εἰπεῖν, ἀλλὰ ἀπελθὼν δεῖξον σεαυτὸν τῷ ἱερεῖ, καὶ προσένεγκε περὶ τοῦ καθαρισμοῦ σου καθὼς προσέταξεν Μωϋσῆς εἰς μαρτύριον αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/014.yaml
  text: And he ordered him to tell no one[a], but go and show yourself to the priest, and offer for your cleansing as Moses commanded[b], for a testimony to them.
translation:
  language: fr
  text: Il lui ordonna de n’en parler à personne, mais d’aller se montrer au prêtre et d’offrir, pour sa purification, comme Moïse l’a prescrit[b], afin que cela leur serve de témoignage[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression peut désigner un témoignage adressé aux prêtres ou à d’autres personnes ; certains la comprennent aussi au sens de « comme preuve contre eux ».
    reason: alternative_reading
  - marker: b
    text: Voir Lévitique 14 pour les offrandes prescrites par Moïse concernant la purification d’une personne atteinte d’une maladie de peau.
    reason: cross_reference
lexical_decisions:
- source_word: παρήγγειλεν
  choice: ordonna
  rationale: Rend l’instruction directe et revêtue d’autorité, sans ajouter une intensité absente du verbe grec.
- source_word: μηδενὶ εἰπεῖν
  choice: de n’en parler à personne
  rationale: Formulation idiomatique en français qui exprime clairement l’interdiction de divulguer ce qui vient de se passer.
- source_word: ἀπελθὼν
  choice: va
  rationale: Dans la suite d’impératifs, « va » exprime naturellement le déplacement préalable sans alourdir la phrase par un calque participial.
- source_word: δεῖξον σεαυτὸν τῷ ἱερεῖ
  choice: va te montrer au prêtre
  rationale: Rendu direct qui conserve le verbe « montrer » et le pronom réfléchi du grec.
- source_word: προσένεγκε
  choice: présente
  rationale: Dans ce contexte cultuel, « présente » convient à ce qui doit être apporté en offrande tout en évitant d’ajouter un objet trop précis non exprimé dans le grec.
- source_word: περὶ τοῦ καθαρισμοῦ σου
  choice: pour ta purification
  rationale: « Purification » rend la dimension rituelle du καθαρισμός exigé après la guérison, tandis que « pour » exprime naturellement le rapport introduit par περί.
- source_word: καθὼς προσέταξεν Μωϋσῆς
  choice: ce que Moïse a prescrit
  rationale: Cette formulation française indique que le contenu à présenter est celui fixé par la Loi de Moïse, sans introduire de détail absent du verset.
- source_word: εἰς μαρτύριον αὐτοῖς
  choice: afin que cela leur serve de témoignage
  rationale: Conserve la finalité, le terme « témoignage » et le pronom indéterminé « leur », sans préciser abusivement les destinataires ni la valeur favorable ou défavorable du témoignage.
theological_decisions:
- issue: Référent et portée de αὐτοῖς dans εἰς μαρτύριον αὐτοῖς
  choice: « leur », sans identifier les personnes visées ni préciser la valeur du témoignage
  alternative: « aux prêtres », « au peuple » ou « comme preuve contre eux »
  rationale: Le grec ne nomme pas explicitement le groupe concerné et n’indique pas sans ambiguïté si le témoignage est simplement attestatif ou comporte une dimension accusatrice.
- issue: Nature de ce qui doit être présenté pour la purification
  choice: « ce que Moïse a prescrit »
  alternative: « l’offrande prescrite par Moïse »
  rationale: Le contexte de Lévitique 14 implique une offrande, mais le grec de ce verset ne contient pas de nom explicite correspondant à « offrande » ; le rendu choisi reste naturel tout en évitant une explicitation excessive.
translation_notes:
  register: Français international moderne, digne et accessible. Le discours direct rend naturellement le passage de l’instruction rapportée aux impératifs grecs. Le marqueur [a] est placé sur l’expression qu’il explique, et [b] sur la prescription mosaïque.
