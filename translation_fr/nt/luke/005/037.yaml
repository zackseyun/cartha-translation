reference: Luke 5:37
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ οὐδεὶς βάλλει οἶνον νέον εἰς ἀσκοὺς παλαιούς· εἰ δὲ μήγε, ῥήξει ὁ ⸂οἶνος ὁ νέος⸃ τοὺς ἀσκούς, καὶ αὐτὸς ἐκχυθήσεται καὶ οἱ ἀσκοὶ ἀπολοῦνται·
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/037.yaml
  text: And no one puts new wine into old wineskins[a]. Otherwise, the new wine will burst the wineskins, and it will be spilled[c][b], and the wineskins will be ruined.
translation:
  language: fr
  text: Et personne ne met du vin nouveau dans de vieilles outres[a]. Sinon, le vin nouveau fera éclater les outres, se répandra[b], et les outres seront détruites.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Une outre est un récipient fait d’une peau d’animal, utilisé notamment pour conserver le vin.
    reason: lexical_explanation
  - marker: b
    text: 'Autre traduction possible : « sera répandu ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: βάλλει
  choice: met
  rationale: Le verbe général signifie placer ou mettre. « Met » reste naturel en français et évite de préciser, de manière interprétative, que le vin est versé.
- source_word: οἶνον νέον
  choice: du vin nouveau
  rationale: Expression française courante qui conserve l’image du vin récemment produit, encore susceptible de fermenter.
- source_word: ἀσκοὺς παλαιούς
  choice: de vieilles outres
  rationale: « Outres » désigne précisément les récipients en peau destinés notamment aux liquides et convient au registre biblique tout en restant compréhensible.
- source_word: εἰ δὲ μήγε
  choice: Sinon
  rationale: Rend clairement et avec concision la conséquence conditionnelle introduite par l’expression grecque.
- source_word: ῥήξει
  choice: fera éclater
  rationale: 'Le verbe est transitif : le vin provoquera la rupture des outres. « Fera éclater » conserve cette relation causale.'
- source_word: ἐκχυθήσεται
  choice: se répandra
  rationale: Le passif grec décrit le vin qui s’écoule à la suite de la rupture. Le pronominal français est naturel et garde l’idée de déversement sans suggérer une action volontaire.
- source_word: ἀπολοῦνται
  choice: seront perdues
  rationale: Pour des récipients, l’expression indique qu’ils seront détruits ou rendus inutilisables. « Seront perdues » préserve la portée du verbe ἀπόλλυμι sans imposer l’idée d’anéantissement.
- source_word: καὶ αὐτός
  choice: il
  rationale: Le pronom renvoie au vin nouveau. En français, « il » assure une reprise naturelle; l’enchaînement conserve suffisamment la mise en relief grecque.
- source_word: οὐδεὶς
  choice: personne ne
  rationale: Équivalent français standard qui convient à la forme proverbiale de la parole.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La formulation conserve la structure proverbiale, la causalité du vin qui fait éclater les outres et le sens concret de l’image, sans en ajouter une interprétation théologique.
