id: LUK.5.35
reference: Luke 5:35
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐλεύσονται δὲ ἡμέραι, καὶ ὅταν ἀπαρθῇ ἀπ’ αὐτῶν ὁ νυμφίος τότε νηστεύσουσιν ἐν ἐκείναις ταῖς ἡμέραις.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/035.yaml
  text: But days will come[a], and when the bridegroom is taken away from them, then they will fast in those days.
translation:
  language: fr
  text: Mais des jours viendront où l’époux leur sera enlevé[a] ; alors, en ces jours-là, ils jeûneront.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leur sera retiré ». Le verbe grec indique que l’époux est enlevé, et non simplement qu’il part.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλεύσονται δὲ ἡμέραι
  choice: Mais des jours viendront
  rationale: Cette formulation conserve l’idiome grec et le contraste introduit par δέ, tout en restant naturelle en français.
- source_word: ὅταν
  choice: où
  rationale: Après « des jours viendront », le relatif temporel « où » exprime naturellement le moment futur visé par ὅταν.
- source_word: ἀπαρθῇ ἀπ’ αὐτῶν
  choice: leur sera enlevé
  rationale: Le passif et l’idée de séparation sont préservés. Cette tournure indique que l’époux subit son éloignement plutôt qu’il ne part simplement de lui-même.
- source_word: ὁ νυμφίος
  choice: l’époux
  rationale: « L’époux » est le terme français courant et digne pour νυμφίος dans cette image nuptiale.
- source_word: τότε
  choice: alors
  rationale: « Alors » marque clairement la conséquence temporelle de l’enlèvement de l’époux.
- source_word: νηστεύσουσιν
  choice: ils jeûneront
  rationale: Le verbe « jeûner » conserve le sens religieux précis de νηστεύω.
- source_word: ἐν ἐκείναις ταῖς ἡμέραις
  choice: en ces jours-là
  rationale: La répétition temporelle du grec est maintenue pour préserver son insistance.
theological_decisions:
- issue: Faut-il atténuer le passif ἀπαρθῇ en simple départ volontaire ?
  choice: « l’époux leur sera enlevé »
  alternative: « l’époux les quittera » ou « l’époux partira »
  rationale: Le passif grec suggère que l’époux est soustrait à ses compagnons. Cette traduction conserve la tension et la possible anticipation de la mort de Jésus sans l’expliciter dans le texte.
translation_notes:
  register: 'Français international moderne, naturel et digne. La structure a été légèrement adaptée à l’idiome français : « des jours viendront où… », tandis que le passif, la progression temporelle et la répétition « en ces jours-là » sont conservés.'
