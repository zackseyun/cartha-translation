id: LUK.5.15
reference: Luke 5:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: διήρχετο δὲ μᾶλλον ὁ λόγος περὶ αὐτοῦ, καὶ συνήρχοντο ὄχλοι πολλοὶ ἀκούειν καὶ ⸀θεραπεύεσθαι ἀπὸ τῶν ἀσθενειῶν αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/015.yaml
  text: But the report about him spread even more[a], and large crowds were gathering to hear and to be healed of their sicknesses.
translation:
  language: fr
  text: Mais la nouvelle à son sujet se répandait de plus en plus[a], et des foules nombreuses se rassemblaient pour l’entendre et pour être guéries de leurs maladies.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ce qu’on disait de lui » ou « l’information à son sujet ».
    reason: lexical_alternative
lexical_decisions:
- source_word: διήρχετο
  choice: se répandait
  rationale: L’imparfait décrit une diffusion continue; « se répandait » est naturel en français et conserve cet aspect duratif.
- source_word: μᾶλλον
  choice: de plus en plus
  rationale: Cette expression rend clairement la progression comparative marquée par μᾶλλον.
- source_word: ὁ λόγος περὶ αὐτοῦ
  choice: la nouvelle à son sujet
  rationale: Dans ce contexte narratif, λόγος désigne ce qui se disait au sujet de Jésus, c’est-à-dire la nouvelle qui circulait, plutôt qu’une « parole » au sens théologique.
- source_word: συνήρχοντο
  choice: se rassemblaient
  rationale: L’imparfait exprime une action continue ou répétée; « se rassemblaient » restitue aussi le mouvement collectif.
- source_word: ὄχλοι πολλοὶ
  choice: des foules nombreuses
  rationale: Cette formulation conserve le pluriel de ὄχλοι et la quantité exprimée par πολλοί, dans un français digne et intelligible.
- source_word: ἀκούειν
  choice: pour l’entendre
  rationale: L’infinitif exprime le but. Le pronom explicite naturellement que les foules venaient entendre Jésus, implicite dans le grec.
- source_word: θεραπεύεσθαι
  choice: pour être guéries
  rationale: Le passif est conservé sans préciser explicitement l’agent de la guérison.
- source_word: ἀπὸ τῶν ἀσθενειῶν αὐτῶν
  choice: de leurs maladies
  rationale: Dans ce contexte de guérison, ἀσθένεια désigne des affections corporelles; « maladies » est naturel et précis.
theological_decisions:
- issue: Nature de la guérison
  choice: 'Employer un vocabulaire direct de guérison corporelle: « être guéries de leurs maladies ».'
  alternative: Employer une expression plus large comme « être rétablies » ou « retrouver la plénitude ».
  rationale: Le contexte immédiat concerne les affections des personnes. La traduction n’ajoute donc pas ici une dimension explicitement spirituelle que le verset ne formule pas.
- issue: Agent implicite de la guérison
  choice: Conserver le passif « être guéries » sans ajouter « par Jésus ».
  alternative: Expliciter « être guéries par lui ».
  rationale: Même si Jésus est clairement l’agent dans le récit, le grec emploie un passif et ne l’explicite pas dans cette proposition.
translation_notes:
  register: 'Français international moderne, fluide et digne. La syntaxe conserve les deux buts coordonnés des foules: entendre Jésus et recevoir la guérison. Le marqueur [a] figure immédiatement après l’expression qu’il précise.'
