  text: ⸀καὶ οὐδεὶς πιὼν ⸀παλαιὸν θέλει νέον· λέγει γάρ· Ὁ παλαιὸς ⸀χρηστός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/039.yaml
  text: And no one[a], after drinking old wine, wants new, for he says, ‘The old is good.’
translation:
  language: fr
  text: 'Et personne, après avoir bu du vin vieux, ne veut de vin nouveau, car il dit : « Le vin vieux est bon.[a] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Certains manuscrits portent : « Le vin vieux est meilleur. »'
    reason: textual_variant
lexical_decisions:
- source_word: οὐδεὶς
  choice: personne
  rationale: Négation indéfinie à portée générale. « Personne » est naturel en français moderne et n’introduit aucun marquage de genre.
- source_word: πιὼν
  choice: après avoir bu
  rationale: Le participe aoriste exprime ici une action antérieure à celle du verbe principal ; cette tournure française en conserve clairement le rapport temporel.
- source_word: παλαιὸν
  choice: du vin vieux
  rationale: Le nom « vin » est sous-entendu en grec mais ressort du contexte immédiat. Le rétablir ici produit un français clair et idiomatique.
- source_word: θέλει
  choice: veut
  rationale: Dans ce contexte, θέλω exprime le désir ou la préférence. « Veut » est l’équivalent courant le plus direct.
- source_word: νέον
  choice: du nouveau
  rationale: L’adjectif substantivé renvoie au vin nouveau. « Du nouveau » conserve l’ellipse du grec tout en évitant l’ambiguïté que créerait simplement « en veut du neuf ».
- source_word: λέγει γάρ
  choice: car on dit
  rationale: γάρ introduit la raison de la préférence. Le grec emploie littéralement la troisième personne du singulier (« il dit »), mais le français proverbial et générique emploie naturellement « on dit », sans changer le référent indéfini.
- source_word: Ὁ παλαιὸς
  choice: Le vieux
  rationale: Le grec laisse de nouveau « vin » implicite. « Le vieux » préserve cette concision proverbiale et reste clair grâce à la première proposition.
- source_word: χρηστός
  choice: bon
  rationale: χρηστός signifie ici « bon » ou « agréable », non le comparatif « meilleur ». « Bon » est fidèle, sobre et peu interprétatif.
theological_decisions:
- issue: Sens de χρηστός dans la comparaison entre vin vieux et vin nouveau
  choice: bon
  alternative: meilleur
  rationale: Le texte grec retenu porte χρηστός, adjectif positif signifiant « bon » ou « agréable », et non un comparatif. La traduction « meilleur », connue dans une partie de la tradition textuelle et traductive, est donc signalée en note plutôt qu’introduite dans le texte principal.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation garde le caractère proverbial de la phrase. « On dit » rend idiomatiquement le sujet générique après « personne », tandis que les ellipses « du nouveau » et « le vieux » reflètent la concision grecque.
