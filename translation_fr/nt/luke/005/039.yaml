review_pass:
  verdict: revise
  source_fidelity: 'Le projet rend correctement la séquence temporelle de πιὼν, le sens préférentiel de θέλει et la valeur positive non comparative de χρηστός. Toutefois, « n’en veut du nouveau » n’est pas une construction française recevable : le pronom « en » double indûment le complément « du nouveau ». Le sujet de λέγει est au singulier générique (« il dit »), et non l’impersonnel « on dit », même si ce dernier ne change que légèrement le sens.'
  naturalness: La correction « personne ... ne veut de vin nouveau » est naturelle et grammaticale. « Le vieux » est ambigu en français moderne (il peut désigner un homme âgé) ; expliciter « le vin vieux » est nécessaire pour une lecture immédiate et idiomatique, sans ajout sémantique, puisque le nom est clairement sous-entendu dans le grec et fourni dans le contexte.
  terminology: « Vin vieux », « vin nouveau » et « bon » sont appropriés. « Bon » respecte χρηστός dans le texte SBLGNT ; « meilleur » demeure correctement réservé à la note de variante.
  issues:
  - severity: high
    issue: Construction « n’en veut du nouveau »
    rationale: Après « personne », le français exige ici « ne veut de vin nouveau » (ou une reformulation équivalente). « En » ne peut pas coexister avec le complément redoublé « du nouveau » dans cette structure.
  - severity: medium
    issue: « car on dit » pour λέγει γάρ
    rationale: Le grec a le singulier générique « il dit ». « Car il dit » conserve plus exactement la syntaxe et le lien avec « personne ».
  - severity: medium
    issue: « Le vieux » est ambigu en français
    rationale: Contrairement à l’anglais « the old », « le vieux » désigne couramment une personne. « Le vin vieux » restitue sans ambiguïté l’ellipse grecque.
