id: LUK.12.24
reference: Luke 12:24
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: κατανοήσατε τοὺς κόρακας ὅτι οὐ σπείρουσιν οὐδὲ θερίζουσιν, οἷς οὐκ ἔστιν ταμεῖον οὐδὲ ἀποθήκη, καὶ ὁ θεὸς τρέφει αὐτούς· πόσῳ μᾶλλον ὑμεῖς διαφέρετε τῶν πετεινῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/024.yaml
  text: 'Consider the ravens: they neither sow nor reap[a]; they have neither storeroom nor barn, and God feeds them[c][b]. How much more valuable are you than the birds!'
translation:
  language: fr
  text: 'Observez attentivement les corbeaux[a] : ils ne sèment ni ne moissonnent ; ils n’ont ni cellier ni grange[b], et Dieu les nourrit. Combien plus valez-vous que les oiseaux[c] !'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Considérez les corbeaux » ou « Réfléchissez attentivement aux corbeaux ».
    reason: lexical_alternative
  - marker: b
    text: 'Le grec emploie deux termes distincts : ταμεῖον désigne ici un lieu de stockage intérieur, et ἀποθήκη une grange ou un entrepôt pour les récoltes.'
    reason: lexical_alternative
  - marker: c
    text: Ou « Combien êtes-vous plus précieux que les oiseaux ! » Le verbe grec peut exprimer ici une supériorité de valeur ou d’importance.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατανοήσατε
  choice: Observez attentivement
  rationale: L’impératif appelle à porter une attention réfléchie aux corbeaux, et non à leur jeter un simple regard. Cette formulation est naturelle en français moderne tout en conservant cette nuance.
- source_word: κόρακας
  choice: les corbeaux
  rationale: κόραξ désigne précisément le corbeau ; le terme concret est conservé plutôt que généralisé en « oiseaux ».
- source_word: σπείρουσιν οὐδὲ θερίζουσιν
  choice: ils ne sèment ni ne moissonnent
  rationale: La tournure maintient le parallélisme bref des deux verbes agricoles grecs.
- source_word: ταμεῖον
  choice: réserve
  rationale: Le mot désigne un lieu intérieur où l’on conserve des provisions. « Réserve » le distingue naturellement de la grange mentionnée ensuite.
- source_word: ἀποθήκη
  choice: grange
  rationale: Dans ce contexte agricole, le terme désigne un bâtiment où l’on entrepose les récoltes. « Grange » préserve la distinction avec ταμεῖον.
- source_word: τρέφει
  choice: nourrit
  rationale: Le présent exprime l’action continue de Dieu qui procure aux oiseaux leur nourriture.
- source_word: πόσῳ μᾶλλον
  choice: Combien plus
  rationale: Cette formulation concise conserve le mouvement du raisonnement grec, qui va du moindre au plus important.
- source_word: διαφέρετε
  choice: valez-vous
  rationale: Dans ce contexte comparatif, διαφέρω signifie surpasser en valeur ou en importance, plutôt que simplement être différent.
- source_word: τῶν πετεινῶν
  choice: que les oiseaux
  rationale: πετεινόν est un terme général pour les créatures ailées. Après la mention précise des corbeaux, le texte élargit la comparaison aux oiseaux.
theological_decisions:
- issue: La providence divine dans la comparaison
  choice: et Dieu les nourrit
  alternative: et Dieu prend soin de leur nourriture
  rationale: La traduction conserve l’affirmation explicite de l’action de Dieu sans l’élargir en une formulation doctrinale plus générale.
- issue: La valeur humaine par rapport aux oiseaux
  choice: Combien plus valez-vous que les oiseaux !
  alternative: Combien êtes-vous plus précieux que les oiseaux !
  rationale: « Valez-vous » exprime la supériorité de valeur impliquée par le contexte tout en évitant de préciser sur quel plan ou en vertu de quelle doctrine cette valeur repose.
translation_notes:
  register: Français international moderne, clair et digne. Le rythme parallèle de la phrase grecque est conservé, ainsi que la vigueur rhétorique de la conclusion, rendue par un point d’exclamation.
