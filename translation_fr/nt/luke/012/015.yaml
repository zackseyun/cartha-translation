source:
  edition: SBLGNT
  text: εἶπεν δὲ πρὸς αὐτούς· Ὁρᾶτε καὶ φυλάσσεσθε ἀπὸ ⸀πάσης πλεονεξίας, ὅτι οὐκ ἐν τῷ περισσεύειν τινὶ ἡ ζωὴ ⸀αὐτοῦ ἐστιν ἐκ τῶν ὑπαρχόντων ⸀αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/015.yaml
  text: Then he said to them, “Watch out and guard yourselves from every kind of greed, because a person’s life does not consist in the abundance of his possessions.”
translation:
  language: fr
  text: 'Puis il leur dit : « Prenez garde et gardez-vous de toute forme d’avidité[a], car la vie d’une personne ne consiste pas dans l’abondance de ses biens. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de toute convoitise ». Le grec πλεονεξία peut désigner l’avidité, la convoitise ou le désir d’avoir toujours davantage.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁρᾶτε
  choice: Soyez vigilants
  rationale: L’impératif pluriel a ici une valeur d’avertissement. Cette formulation actuelle et digne exprime l’attention requise sans se limiter au sens littéral de « voir ».
- source_word: φυλάσσεσθε
  choice: gardez-vous
  rationale: L’impératif moyen souligne la protection de soi. « Gardez-vous » conserve cette nuance réflexive et complète naturellement le premier avertissement.
- source_word: ἀπὸ πάσης πλεονεξίας
  choice: de toute forme d’avidité
  rationale: πλεονεξία désigne largement le désir d’avoir toujours davantage. « Avidité » rend cette disposition acquisitive, tandis que « toute forme » restitue la portée globale de πάσης.
- source_word: ὅτι
  choice: car
  rationale: La conjonction introduit le motif de l’avertissement. « Car » convient au registre biblique moderne sans alourdir la phrase.
- source_word: οὐκ ἐν τῷ περισσεύειν τινὶ ἡ ζωὴ αὐτοῦ ἐστιν
  choice: la vie d’une personne ne dépend pas de l’abondance
  rationale: La construction nie que la vie soit fondée sur le fait d’avoir en abondance. « Ne dépend pas de » en exprime clairement le rapport sans prétendre définir exhaustivement la vie.
- source_word: ἐκ τῶν ὑπαρχόντων αὐτῷ
  choice: de ses biens
  rationale: Le participe substantivé désigne ce que quelqu’un possède. « Ses biens » est concis, naturel et adapté au contexte matériel.
theological_decisions:
- issue: Portée de πλεονεξία
  choice: toute forme d’avidité
  alternative: toute convoitise
  rationale: Le terme grec vise largement l’appétit de possession et non uniquement le désir du bien d’autrui. Le choix principal garde cette portée morale étendue, et la note signale l’autre rendu possible.
- issue: Expression masculine à valeur générique
  choice: la vie d’une personne… ses biens
  alternative: sa vie… ce qu’il possède
  rationale: Le propos vaut pour tout être humain. Une formulation épicène rend cette portée générique sans ajouter de distinction absente du grec.
- issue: Rapport entre la vie et les possessions
  choice: ne dépend pas de l’abondance de ses biens
  alternative: ne consiste pas dans l’abondance de ses biens
  rationale: Le grec nie que la vie ait son fondement dans la profusion des possessions. « Ne dépend pas de » préserve cette affirmation sans trancher au-delà de ce qu’exige le contexte.
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme des deux impératifs est conservé, de même que la portée générale de l’avertissement.
