  text: Τί δὲ καὶ ἀφ’ ἑαυτῶν οὐ κρίνετε τὸ δίκαιον;
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/057.yaml
  text: And why do you not judge for yourselves what is right?[a]
translation:
  language: fr
  text: Et pourquoi ne jugez-vous pas par vous-mêmes de ce qui est juste[a] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ce qui est droit » ou « la chose juste ».
    reason: Alternative lexicale pour τὸ δίκαιον, qui peut désigner ce qui est juste ou droit.
lexical_decisions:
- source_word: Τί δὲ καὶ
  choice: Et pourquoi
  rationale: Cette tournure rend naturellement la question rhétorique tout en conservant son lien avec l’argument précédent.
- source_word: ἀφ’ ἑαυτῶν
  choice: par vous-mêmes
  rationale: L’expression indique que les auditeurs devraient exercer leur propre jugement ou discernement; « par vous-mêmes » est idiomatique et proche de la formulation grecque.
- source_word: οὐ κρίνετε
  choice: ne jugez-vous pas
  rationale: « Juger » conserve le sens évaluatif de κρίνω et convient à la question rhétorique.
- source_word: τὸ δίκαιον
  choice: ce qui est juste
  rationale: L’adjectif neutre substantivé désigne ce qui est droit ou juste. Cette formulation française reste naturelle et préserve à la fois la portée morale et la nuance de justice.
theological_decisions:
- issue: Nuance de τὸ δίκαιον
  choice: ce qui est juste
  alternative: ce qui est droit; la bonne conduite à tenir
  rationale: « Ce qui est juste » conserve l’étendue morale et évaluative du grec sans réduire le propos à la seule justice juridique ni l’élargir par une interprétation doctrinale.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation garde la force rhétorique de la question ainsi que l’ambiguïté entre jugement moral, justice et décision appropriée.
