review_pass:
  verdict: revise
  source_fidelity: 'Le sens fondamental est bien rendu : Jésus s’adresse à ses disciples, tire une conséquence de l’enseignement précédent et interdit l’inquiétude concernant la vie/nourriture et le corps/vêtement. Toutefois, « ce que vous porterez » peut en français moderne désigner aussi ce que l’on transporte; le grec ἐνδύσησθε désigne explicitement le fait de se vêtir.'
  naturalness: La phrase proposée est compréhensible, mais la répétition « au sujet de ... de ce que » est un peu lourde. « De quoi vous vous vêtirez » est idiomatique dans un registre biblique moderne et rend précisément le parallèle grec.
  terminology: « Vie » pour ψυχή est juste dans ce contexte, sans exclure par principe le sens « âme » signalé en note. « Corps » et « disciples » sont appropriés. La note est correctement ancrée à « vie ».
  issues:
  - severity: low
    issue: Ambiguïté de « ce que vous porterez »
    rationale: En français, « porter » peut aussi signifier transporter ou supporter. Dans ce contexte, il sera normalement compris comme relatif aux vêtements, mais « de quoi vous vous vêtirez » explicite sans ajout le sens vestimentaire de ἐνδύω.
  - severity: low
    issue: Enchaînement légèrement lourd
    rationale: « Ne vous inquiétez pas au sujet de votre vie, de ce que vous mangerez » accumule deux compléments introduits de manière peu fluide. La révision conserve les mêmes relations sémantiques dans une formulation plus naturelle.
  revised_text: 'Puis il dit à ses disciples : « C’est pourquoi je vous le dis : ne vous inquiétez pas de votre vie, de ce que vous mangerez, ni de votre corps, de quoi vous vous vêtirez. »'
  revised_footnotes:
  - marker: a
    text: Ou « âme » ; ici, le mot grec désigne vraisemblablement la vie, au sens de l’existence terrestre.
    reason: lexical_alternative
  revision_rationale: La révision maintient la structure et le sens du grec, tout en remplaçant le verbe français potentiellement ambigu « porterez » par « vous vous vêtirez », qui correspond au moyen ἐνδύσησθε et au contexte du corps et du vêtement. L’ancre et le contenu de la note sur ψυχή sont conservés.
