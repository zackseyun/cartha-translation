source:
  edition: SBLGNT
  text: Εἶπεν δὲ πρὸς τοὺς μαθητὰς αὐτοῦ· Διὰ τοῦτο ⸂λέγω ὑμῖν⸃, μὴ μεριμνᾶτε τῇ ⸀ψυχῇ τί φάγητε, μηδὲ τῷ ⸀σώματι τί ἐνδύσησθε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/022.yaml
  text: Then he said to his disciples[a], “For this reason I tell you, do not worry about your life, what you will eat, nor about your body[b], what you will wear.”
translation:
  language: fr
  text: 'Puis il dit à ses disciples : « C’est pourquoi je vous le dis : ne vous inquiétez pas de votre vie, de ce que vous mangerez, ni de votre corps, de quoi vous vous vêtirez. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἶπεν δὲ
  choice: Puis il dit
  rationale: δέ est une articulation légère. « Puis » assure une progression narrative naturelle sans introduire une opposition marquée.
- source_word: πρὸς τοὺς μαθητὰς αὐτοῦ
  choice: à ses disciples
  rationale: Le possessif αὐτοῦ est explicite, et « disciples » est le terme français courant pour μαθηταί dans ce contexte.
- source_word: Διὰ τοῦτο
  choice: C’est pourquoi
  rationale: L’expression renvoie à l’enseignement précédent et en tire une conséquence; « C’est pourquoi » en conserve clairement la valeur logique.
- source_word: λέγω ὑμῖν
  choice: je vous le dis
  rationale: Cette tournure française naturelle garde l’adresse directe; le pronom « le » reprend la conclusion introduite par « C’est pourquoi ».
- source_word: μὴ μεριμνᾶτε
  choice: ne vous inquiétez pas
  rationale: μεριμνάω désigne ici une préoccupation anxieuse. Cette formulation est claire et idiomatique en français moderne.
- source_word: τῇ ψυχῇ
  choice: au sujet de votre vie
  rationale: Dans le parallèle entre nourriture et vêtement, ψυχή désigne la vie terrestre plutôt que nécessairement l’âme comme composante immatérielle.
- source_word: τί φάγητε
  choice: de ce que vous mangerez
  rationale: Le subjonctif aoriste à valeur délibérative indirecte porte naturellement en français sur une situation future.
- source_word: μηδὲ τῷ σώματι
  choice: ni au sujet de votre corps
  rationale: « Ni » conserve la coordination négative et le parallélisme explicite avec la vie.
- source_word: τί ἐνδύσησθε
  choice: de ce que vous porterez
  rationale: Le moyen de ἐνδύω évoque le fait de se vêtir; « ce que vous porterez » est naturel et parallèle à « ce que vous mangerez ».
theological_decisions:
- issue: Sens de ψυχή dans ce contexte
  choice: vie
  alternative: âme
  rationale: Le contexte immédiat associe ψυχή à la nourriture et la met en parallèle avec le corps et le vêtement. « Vie » exprime donc ici l’existence terrestre sans imposer une lecture anthropologique dualiste; une note conserve néanmoins l’autre rendu lexical possible.
translation_notes:
  register: Français international moderne, digne et accessible. La structure parallèle du grec est conservée, malgré une légère solennité, afin de maintenir la distinction entre la vie et la nourriture, puis le corps et le vêtement.
