- from: 'Puis il dit à ses disciples : « C’est pourquoi je vous le dis : ne vous inquiétez pas au sujet de votre vie[a], de ce que vous mangerez, ni au sujet de votre corps, de ce que vous porterez. »'
  to: 'Puis il dit à ses disciples : « C’est pourquoi je vous le dis : ne vous inquiétez pas de votre vie, de ce que vous mangerez, ni de votre corps, de quoi vous vous vêtirez. »'
  rationale: La révision maintient la structure et le sens du grec, tout en remplaçant le verbe français potentiellement ambigu « porterez » par « vous vous vêtirez », qui correspond au moyen ἐνδύσησθε et au contexte du corps et du vêtement. L’ancre et le contenu de la note sur ψυχή sont conservés.
