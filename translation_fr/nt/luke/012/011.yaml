id: LUK.12.11
reference: Luke 12:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὅταν δὲ ⸀εἰσφέρωσιν ὑμᾶς ἐπὶ τὰς συναγωγὰς καὶ τὰς ἀρχὰς καὶ τὰς ἐξουσίας, μὴ ⸀μεριμνήσητε πῶς ⸂ἢ τί⸃ ἀπολογήσησθε ἢ τί εἴπητε·
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/011.yaml
  text: But whenever they bring you before the synagogues and the rulers and the authorities[a], do not worry about how or what you should say in your defense, or what you should say[b];
translation:
  language: fr
  text: Mais quand on vous conduira devant les synagogues, les magistrats et les autorités[a], ne vous inquiétez pas de la manière dont vous vous défendrez ni de ce que vous direz pour votre défense[b], ni de ce que vous direz.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les « synagogues, magistrats et autorités » désignent ici des instances religieuses et civiles devant lesquelles les disciples peuvent être interrogés.
    reason: cultural_note
  - marker: b
    text: Littéralement, la formulation distingue la manière de se défendre et ce qu’il faut dire pour sa défense.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν δὲ
  choice: Mais quand
  rationale: ὅταν exprime une éventualité future récurrente ou indéfinie; « quand » convient naturellement ici. δέ marque une transition légèrement contrastive, rendue par « Mais ».
- source_word: εἰσφέρωσιν ὑμᾶς
  choice: on vous conduira
  rationale: Le verbe signifie amener ou faire comparaître. La tournure indéfinie « on » rend naturellement le sujet non exprimé et le contexte de comparution.
- source_word: ἐπὶ τὰς συναγωγὰς καὶ τὰς ἀρχὰς καὶ τὰς ἐξουσίας
  choice: devant les synagogues, les dirigeants et les autorités
  rationale: ἐπί avec l’accusatif indique ici la comparution devant des instances. Les trois catégories du grec sont conservées sans les fusionner.
- source_word: συναγωγάς
  choice: synagogues
  rationale: Le sens lexical direct est conservé, même si le terme désigne probablement ici, par métonymie, les instances judiciaires liées aux synagogues.
- source_word: ἀρχάς
  choice: dirigeants
  rationale: Dans ce contexte institutionnel, le mot désigne ceux qui gouvernent ou exercent une charge; « dirigeants » reste large et actuel.
- source_word: ἐξουσίας
  choice: autorités
  rationale: Le terme désigne des personnes ou instances investies d’un pouvoir officiel; « autorités » est précis et idiomatique.
- source_word: μὴ μεριμνήσητε
  choice: ne vous inquiétez pas
  rationale: La formule interdit l’inquiétude anticipée, sans nier la gravité de la comparution.
- source_word: πῶς ἢ τί ἀπολογήσησθε ἢ τί εἴπητε
  choice: de la manière dont vous vous défendrez, ni de ce que vous direz
  rationale: ἀπολογέομαι porte le sens judiciaire de présenter sa défense. La formulation française distingue naturellement la manière de se défendre du contenu plus général des paroles, tout en évitant la répétition lourde de « quoi ».
theological_decisions:
- issue: Nature de la promesse implicite concernant la défense des disciples
  choice: Traduire simplement l’interdiction de s’inquiéter, sans préciser le mode de l’assistance divine
  alternative: Ajouter une formulation laissant entendre une inspiration verbale automatique
  rationale: Le verset interdit l’anticipation anxieuse; l’explication de l’assistance vient au verset suivant. Il ne faut pas résoudre ici plus que le texte ne le fait.
translation_notes:
  register: Français international moderne, digne et accessible. « Conduire devant » signale la comparution sans technicisme excessif; « se défendre » conserve la nuance judiciaire. Les marqueurs de notes figurent tous dans le texte principal.
