review_pass:
  verdict: revise
  source_fidelity: La traduction rend correctement la comparution devant des instances ainsi que l’interdiction de l’inquiétude. Toutefois, le texte grec distingue « comment » et « quoi » dans la défense (πῶς ἢ τί ἀπολογήσησθε), puis ajoute « quoi dire » (ἢ τί εἴπητε). Le projet ne rend que le premier élément de la première paire et omet donc « quoi » concernant la défense.
  naturalness: « Mais quand on vous conduira » et « ne vous inquiétez pas » sont naturels en français international moderne. La formulation révisée maintient une syntaxe française fluide tout en conservant les trois volets de l’énoncé grec.
  terminology: « Synagogues » est lexicalement exact; la note explique sobrement son emploi institutionnel dans ce contexte. « Dirigeants » est possible, mais « magistrats » convient mieux au cadre de comparution et permet de distinguer clairement les ἀρχαί des ἐξουσίαι (« autorités »), sans surinterpréter leur portée exacte.
  issues:
  - severity: medium
    issue: Omission de τί dans πῶς ἢ τί ἀπολογήσησθε.
    rationale: « de la manière dont vous vous défendrez » rend πῶς, mais ne rend pas τί (« quoi ») relatif à la défense. La note b ne peut pas compenser une omission du texte principal, d’autant qu’elle est elle-même maladroite.
  - severity: low
    issue: La note b ne correspond pas précisément à l’ancrage ni à la construction grecque.
    rationale: « ce par quoi vous présenterez votre défense » est peu naturel et ne rend pas simplement l’alternative « comment ou quoi »; elle doit être remplacée par une note qui explicite la structure sans introduire de formulation opaque.
