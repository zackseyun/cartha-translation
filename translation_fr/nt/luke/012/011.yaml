revisions:
- from: Mais quand on vous conduira devant les synagogues, les dirigeants et les autorités[a], ne vous inquiétez pas de la manière dont vous vous défendrez, ni de ce que vous direz[b].
  to: Mais quand on vous conduira devant les synagogues, les magistrats et les autorités[a], ne vous inquiétez pas de la manière dont vous vous défendrez ni de ce que vous direz pour votre défense[b], ni de ce que vous direz.
  rationale: La révision rétablit les deux interrogatifs associés à ἀπολογήσησθε (« comment » et « quoi »), tout en conservant la distinction finale avec « ce que vous direz ». Elle remplace aussi une note lexicale imprécise par une explication concise et fidèle de la structure grecque.
  reviewer_model: gpt-5.6-terra
