source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτῷ· Ἄνθρωπε, τίς με κατέστησεν ⸀κριτὴν ἢ μεριστὴν ἐφ’ ὑμᾶς;
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/014.yaml
  text: But he said to him, “Man, who appointed me a judge or divider over you?”
translation:
  language: fr
  text: 'Mais il lui répondit : « Homme, qui m’a établi juge ou chargé de faire vos partages ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἄνθρωπε
  choice: Homme
  rationale: Le vocatif est conservé directement. En français, « Homme » garde ici la distance et la légère réprimande de l’adresse grecque, sans ajouter « mon ami » ou « monsieur ».
- source_word: κατέστησεν
  choice: a établi
  rationale: Le verbe désigne le fait d’établir ou de désigner quelqu’un dans une fonction; « a établi » reste proche du grec et convient au registre.
- source_word: κριτὴν
  choice: juge
  rationale: Équivalent direct désignant celui qui tranche un différend.
- source_word: μεριστὴν
  choice: chargé de faire vos partages
  rationale: Le terme rare désigne celui qui partage ou répartit, ici probablement un héritage. Cette formulation naturelle conserve cette fonction concrète sans la réduire au rôle plus général d’« arbitre ».
- source_word: ἐφ’ ὑμᾶς
  choice: vos
  rationale: Dans ce contexte de litige entre plusieurs personnes, le complément signifie que la fonction s’exercerait à leur égard. L’intégration dans « faire vos partages » rend idiomatiquement le pluriel ὑμᾶς.
theological_decisions:
- issue: Portée du refus de Jésus
  choice: Conserver la question sur l’identité de celui qui l’aurait établi dans cette fonction précise.
  alternative: Formuler une interdiction générale selon laquelle Jésus ne juge jamais les affaires humaines.
  rationale: Le grec pose une question rhétorique concernant cette nomination particulière; il ne faut pas élargir le propos en affirmation doctrinale générale.
translation_notes:
  register: Français moderne, digne et accessible. La tournure « chargé de faire vos partages » est plus idiomatique que « partageur » tout en restant plus concrète que « arbitre ». Aucun marqueur de note n’est nécessaire.
