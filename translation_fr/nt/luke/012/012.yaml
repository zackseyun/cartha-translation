id: LUK.12.12
reference: Luke 12:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τὸ γὰρ ἅγιον πνεῦμα διδάξει ὑμᾶς ἐν αὐτῇ τῇ ὥρᾳ ἃ δεῖ εἰπεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/012.yaml
  text: for the Holy Spirit will teach you in that very hour what you must say[a].
translation:
  language: fr
  text: Car le Saint-Esprit vous enseignera, à cette heure même, ce qu’il faudra dire[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à ce moment-là » ou « en cette heure-là ». L’expression grecque souligne l’heure précise où cette aide sera nécessaire.
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: car
  rationale: Conserve la valeur explicative qui rattache cette promesse à l’assurance donnée au verset précédent.
- source_word: τὸ ἅγιον πνεῦμα
  choice: le Saint-Esprit
  rationale: Formulation française contemporaine et usuelle pour désigner l’Esprit divin présenté ici comme sujet personnel de l’action.
- source_word: διδάξει
  choice: enseignera
  rationale: Rend directement le futur actif de διδάσκω et préserve la promesse d’une instruction à venir.
- source_word: ὑμᾶς
  choice: vous
  rationale: Rend naturellement le pronom objet de la deuxième personne du pluriel.
- source_word: ἐν αὐτῇ τῇ ὥρᾳ
  choice: à ce moment même
  rationale: Expression française naturelle qui restitue l’insistance de αὐτῇ sur le moment précis où l’aide sera nécessaire.
- source_word: ἃ
  choice: ce qu’
  rationale: Rend idiomatiquement le relatif neutre pluriel introduisant le contenu des paroles.
- source_word: δεῖ
  choice: il faudra
  rationale: La tournure impersonnelle exprime la nécessité en français et son futur s’accorde naturellement avec la promesse formulée par διδάξει.
- source_word: εἰπεῖν
  choice: dire
  rationale: Équivalent français direct et naturel de l’infinitif dans ce contexte de prise de parole.
theological_decisions:
- issue: Référence du « Saint-Esprit »
  choice: Un agent divin personnel qui enseignera activement aux disciples ce qu’ils devront dire
  alternative: Une influence ou une inspiration divine impersonnelle
  rationale: Le Saint-Esprit est le sujet explicite du verbe actif « enseignera ». La traduction préserve cette présentation personnelle sans ajouter de formulation doctrinale postérieure au texte.
translation_notes:
  register: Français international moderne, digne et accessible. « À ce moment même » évite le caractère potentiellement littéral ou ambigu de « à cette heure même », tout en conservant l’emphase temporelle du grec.
