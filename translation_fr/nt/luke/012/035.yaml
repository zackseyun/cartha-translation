  yaml_path: translation/nt/luke/012/035.yaml
  text: Let your waists be girded and your lamps burning,[a]
translation:
  language: fr
  text: Ayez la ceinture serrée autour de la taille et vos lampes allumées.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Litt. « que votre taille soit ceinte ». L’image évoque de longs vêtements relevés et maintenus par une ceinture afin de pouvoir agir sans entrave.
    reason: cultural_note
lexical_decisions:
- source_word: Ἔστωσαν
  choice: Que ... reste ... et ... [restent]
  rationale: L’impératif présent à la troisième personne exprime ici une exhortation à demeurer dans un état de disponibilité. « Que… reste » est naturel en français et fait ressortir cette continuité.
- source_word: ὑμῶν
  choice: votre / vos
  rationale: Le génitif a une fonction possessive avec les deux groupes nominaux coordonnés; le français exige l’accord distinct « votre taille » et « vos lampes ».
- source_word: αἱ ὀσφύες
  choice: votre taille
  rationale: Le pluriel grec désigne la région des reins ou de la taille. Le singulier collectif « votre taille » est idiomatique en français moderne et conserve l’image corporelle sans l’archaïsme de « reins ».
- source_word: περιεζωσμέναι
  choice: ceinte
  rationale: Le participe parfait passif décrit un vêtement déjà attaché autour de la taille, état maintenu en vue d’agir. « Ceinte » préserve l’image concrète, tandis que la note en explicite la portée culturelle.
- source_word: οἱ λύχνοι
  choice: vos lampes
  rationale: Le terme désigne concrètement des lampes, notamment des lampes à huile, et non la lumière prise abstraitement.
- source_word: καιόμενοι
  choice: allumées
  rationale: Le participe présent décrit des lampes qui brûlent continuellement. En français courant, « lampes allumées » rend naturellement cet état; l’ajout de « restent », partagé depuis la première proposition, en souligne la durée.
theological_decisions:
- issue: Image idiomatique de la disponibilité
  choice: Conserver dans le texte l’image concrète de la taille ceinte
  alternative: « Soyez prêts à agir » ou « Gardez vos vêtements attachés, prêts à agir »
  rationale: Le grec présente deux images parallèles de vigilance plutôt qu’une explication abstraite. La traduction conserve donc l’image sans réduire l’exhortation à une interprétation unique; la note fournit le contexte nécessaire.
translation_notes:
  register: Français international moderne, digne et accessible. « Taille ceinte » garde la force de l’image ancienne tout en restant compréhensible; la note évite de surcharger le verset et en précise le sens culturel.
