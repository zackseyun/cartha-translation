    issue: « Que votre taille reste ceinte » est une tournure peu naturelle.
    rationale: En français contemporain, une taille n’est généralement pas dite « ceinte » sans préciser la ceinture ou le vêtement. La formulation peut distraire du sens concret de préparation présent dans le grec.
  - severity: low
    issue: Le deuxième membre ne porte pas de verbe explicite.
    rationale: L’ellipse après « Que votre taille reste ceinte » est possible, mais elle est moins fluide dans cette phrase brève et ne reproduit pas avec netteté les deux états parallèles du grec.
  - severity: low
    issue: La note dit que les vêtements « restent attachés ».
    rationale: L’image ne concerne pas simplement des vêtements attachés, mais de longs vêtements relevés et retenus par une ceinture afin de permettre le mouvement.
  revised_text: Ayez la ceinture serrée autour de la taille et vos lampes allumées.[a]
