  verdict: revise
  source_fidelity: 'Le projet rend correctement les deux images coordonnées de préparation : la taille/vêtement ceint et les lampes en état de brûler. Toutefois, « votre taille reste ceinte » est peu idiomatique et l’ellipse verbale dans le second membre affaiblit la construction française. « Ayez la ceinture serrée autour de la taille » exprime naturellement l’image de περιεζωσμέναι sans la réduire à une exhortation abstraite.'
  naturalness: La formulation révisée est naturelle en français international moderne, conserve un registre biblique accessible et rend explicitement les deux injonctions parallèles.
  terminology: « Ceinture serrée autour de la taille » restitue l’acte de relever et fixer le vêtement à la taille. « Lampes allumées » est l’expression française usuelle pour des lampes qui brûlent; la note précise la portée culturelle de la première image.
  issues:
