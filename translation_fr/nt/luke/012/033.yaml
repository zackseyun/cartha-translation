id: LUK.12.33
reference: Luke 12:33
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: πωλήσατε τὰ ὑπάρχοντα ὑμῶν καὶ δότε ἐλεημοσύνην· ποιήσατε ἑαυτοῖς βαλλάντια μὴ παλαιούμενα, θησαυρὸν ἀνέκλειπτον ἐν τοῖς οὐρανοῖς, ὅπου κλέπτης οὐκ ἐγγίζει οὐδὲ σὴς διαφθείρει·
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/033.yaml
  text: Sell your possessions and give alms[a]. Make for yourselves money bags that do not wear out, an unfailing treasure in the heavens[b], where no thief comes near and no moth destroys.
translation:
  language: fr
  text: Vendez vos biens et donnez aux pauvres[a]. Faites-vous des bourses qui ne s’usent pas, un trésor inépuisable dans les cieux[b], là où aucun voleur n’approche et où aucune mite ne détruit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « faites l’aumône ». Le terme grec désigne un acte de compassion qui consiste à donner aux nécessiteux.
    reason: lexical_alternative
  - marker: b
    text: 'Ou « au ciel ». Le grec emploie ici le pluriel : « dans les cieux ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πωλήσατε
  choice: Vendez
  rationale: L’impératif aoriste pluriel appelle à une action résolue. « Vendez » est direct sans ajouter l’idée d’une liquidation totale.
- source_word: τὰ ὑπάρχοντα ὑμῶν
  choice: vos biens
  rationale: Expression française naturelle désignant ce qui appartient aux destinataires, leurs possessions.
- source_word: δότε ἐλεημοσύνην
  choice: donnez aux pauvres
  rationale: ἐλεημοσύνη désigne ici l’aide matérielle accordée aux nécessiteux. Cette formulation moderne explicite naturellement le bénéficiaire sans réduire le geste à une institution.
- source_word: ποιήσατε ἑαυτοῖς
  choice: Faites-vous
  rationale: 'Conserve l’impératif et la valeur bénéficiaire du datif réfléchi : agir pour soi-même.'
- source_word: βαλλάντια μὴ παλαιούμενα
  choice: des bourses qui ne s’usent pas
  rationale: « Bourses » préserve l’image concrète de contenants destinés à l’argent, et « ne s’usent pas » rend naturellement le vieillissement ou l’usure exprimé par παλαιόω.
- source_word: θησαυρὸν ἀνέκλειπτον
  choice: un trésor inépuisable
  rationale: ἀνέκλειπτος qualifie ce qui ne fait pas défaut et ne s’épuise pas ; « inépuisable » est précis et idiomatique.
- source_word: ἐν τοῖς οὐρανοῖς
  choice: dans les cieux
  rationale: Conserve le pluriel grec tout en employant une tournure biblique encore claire en français moderne.
- source_word: ὅπου κλέπτης οὐκ ἐγγίζει
  choice: là où aucun voleur n’approche
  rationale: Rend directement le mouvement spatial exprimé par ἐγγίζω.
- source_word: οὐδὲ σὴς διαφθείρει
  choice: et où aucune mite ne détruit
  rationale: « Mite » rend σής dans le contexte des biens matériels, tandis que « détruit » exprime la ruine causée par l’insecte.
theological_decisions:
- issue: Portée de ἐλεημοσύνην dans l’exhortation sur les biens
  choice: donnez aux pauvres
  alternative: faites l’aumône
  rationale: La formulation choisie communique clairement l’acte concret de miséricorde envers les nécessiteux. La note conserve l’équivalent plus formel « faites l’aumône » sans élargir le commandement en programme économique non exprimé.
- issue: Nombre grammatical de ἐν τοῖς οὐρανοῖς
  choice: dans les cieux
  alternative: au ciel
  rationale: Le pluriel du texte grec est conservé afin de maintenir sa texture et son idiome, sans implication doctrinale ajoutée.
translation_notes:
  register: Français international moderne, clair et digne. Les impératifs restent directs. « Biens », « bourses » et « trésor » maintiennent l’imagerie concrète du texte, tandis que les notes signalent les principales possibilités lexicales sans surcharger le verset.
