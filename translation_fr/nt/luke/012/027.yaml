  variant: modern international French
source:
  edition: SBLGNT
  text: κατανοήσατε τὰ κρίνα πῶς αὐξάνει· οὐ κοπιᾷ οὐδὲ νήθει· λέγω δὲ ὑμῖν, οὐδὲ Σολομὼν ἐν πάσῃ τῇ δόξῃ αὐτοῦ περιεβάλετο ὡς ἓν τούτων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/027.yaml
  text: 'Consider the lilies[a], how they grow: they do not labor or spin; yet I tell you[b], not even Solomon in all his glory was clothed like one of these.'
translation:
  language: fr
  text: 'Considérez les lis[a] : comment ils poussent. Ils ne travaillent ni ne filent. Mais je vous le dis : même Salomon, dans toute sa gloire[b], n’était pas vêtu comme l’un d’eux.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les fleurs sauvages » ou « les fleurs » ; le grec dit précisément « les lis ».
    reason: lexical_alternative
  - marker: b
    text: Ou « dans toute sa splendeur ».
    reason: lexical_alternative
lexical_decisions:
- source_word: κατανοήσατε
  choice: Observez attentivement
  rationale: L’impératif appelle à une observation réfléchie, et non à un simple regard. Cette formulation naturelle en français conserve cette nuance.
- source_word: τὰ κρίνα
  choice: les lis
  rationale: Le grec désigne précisément des lis, même si le terme peut évoquer plus largement les fleurs sauvages du contexte.
- source_word: πῶς αὐξάνει
  choice: comment ils poussent
  rationale: Le singulier verbal grec avec un sujet neutre pluriel se rend naturellement au pluriel en français ; « comment » maintient l’attention portée à leur manière de croître.
- source_word: οὐ κοπιᾷ
  choice: Ils ne peinent pas
  rationale: κοπιάω exprime un travail pénible ou fatigant. « Peiner » est idiomatique et préserve cette force.
- source_word: οὐδὲ νήθει
  choice: et ne filent pas
  rationale: νήθω désigne l’action de filer des fibres ou du fil. Le verbe français suffit sans complément explicatif.
- source_word: λέγω δὲ ὑμῖν
  choice: Pourtant, je vous le dis
  rationale: δέ marque ici une transition légèrement contrastive vers la conclusion emphatique.
- source_word: οὐδὲ Σολομὼν
  choice: même Salomon
  rationale: Dans une phrase française déjà négative, « même Salomon… n’était pas » rend clairement l’emphase de οὐδέ.
- source_word: ἐν πάσῃ τῇ δόξῃ αὐτοῦ
  choice: dans toute sa gloire
  rationale: « Gloire » conserve la résonance sémantique de δόξα tout en évoquant ici la magnificence royale.
- source_word: περιεβάλετο
  choice: n’était pas vêtu
  rationale: La tournure rend naturellement la forme moyenne/passive sans préciser indûment qui habille Salomon.
- source_word: ὡς ἓν τούτων
  choice: comme l’un d’eux
  rationale: Le pronom renvoie sans ambiguïté aux lis et respecte la formulation concise du grec.
theological_decisions:
- issue: Portée de l’image florale
  choice: Conserver le terme précis « lis » dans le texte.
  alternative: « fleurs » ou « fleurs sauvages »
  rationale: κρίνα nomme les lis. Généraliser dans le corps du texte affaiblirait inutilement la précision de la source ; les autres possibilités sont signalées en note.
- issue: Sens de δόξα appliqué à Salomon
  choice: « gloire »
  alternative: « splendeur » ou « magnificence »
  rationale: Le contexte vise la splendeur royale, mais « gloire » demeure compréhensible et conserve les résonances plus larges du terme grec sans imposer une interprétation étroite.
translation_notes:
  register: Français international moderne, digne et accessible. « Observez attentivement » explicite la réflexion attentive portée par κατανοήσατε. La ponctuation met en relief l’émerveillement implicite devant leur croissance sans ajouter de contenu doctrinal.
