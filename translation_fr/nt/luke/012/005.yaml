id: LUK.12.5
reference: Luke 12:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὑποδείξω δὲ ὑμῖν τίνα φοβηθῆτε· φοβήθητε τὸν μετὰ τὸ ἀποκτεῖναι ⸂ἔχοντα ἐξουσίαν⸃ ἐμβαλεῖν εἰς τὴν γέενναν· ναί, λέγω ὑμῖν, τοῦτον φοβήθητε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/005.yaml
  text: 'But I will show you whom to fear: fear the one who[a], after killing, has authority to throw into Gehenna. Yes, I tell you, fear this one.'
translation:
  language: fr
  text: 'Mais je vais vous montrer qui craindre : craignez celui qui, après avoir tué, a autorité de jeter dans la géhenne[a]. Oui, je vous le dis, craignez-le, lui.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’enfer ». Le terme grec est « géhenne », un terme de jugement dont l’arrière-plan est lié à l’imagerie de la vallée de Hinnom.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑποδείξω
  choice: je vais vous montrer
  rationale: Le futur introduit l’enseignement de Jésus. Cette formulation française est naturelle et conserve l’idée d’indiquer clairement, sans ajouter la nuance plus forte d’un avertissement.
- source_word: τίνα φοβηθῆτε
  choice: qui vous devez craindre
  rationale: Cette tournure rend naturellement l’interrogative indirecte et maintient la force solennelle de φοβέομαι.
- source_word: φοβήθητε
  choice: craignez
  rationale: L’impératif est repris avec le même verbe pour conserver l’insistance et la continuité lexicale du grec.
- source_word: τὸν
  choice: celui qui
  rationale: L’article substantivé désigne une personne sans la nommer explicitement. « Celui qui » est clair et idiomatique en français moderne.
- source_word: μετὰ τὸ ἀποκτεῖναι
  choice: après avoir tué
  rationale: La construction avec μετά et l’infinitif articulé exprime une succession temporelle; l’infinitif passé français la rend de manière concise.
- source_word: ἔχοντα ἐξουσίαν
  choice: a autorité
  rationale: ἐξουσία désigne ici l’autorité ou le droit d’agir, et non simplement une puissance brute.
- source_word: ἐμβαλεῖν εἰς
  choice: jeter dans
  rationale: Cette expression directe et actuelle rend le mouvement violent exprimé par ἐμβάλλω εἰς.
- source_word: γέενναν
  choice: géhenne
  rationale: La translittération conserve le terme grec et son arrière-plan lié à la vallée de Hinnom, sans le réduire d’emblée aux associations théologiques ultérieures du mot « enfer ».
- source_word: ναί
  choice: Oui
  rationale: « Oui » reproduit sobrement l’affirmation emphatique du grec.
- source_word: τοῦτον φοβήθητε
  choice: c’est lui que vous devez craindre
  rationale: La construction détachée préserve l’accent porté par le démonstratif τοῦτον, tout en restant naturelle en français.
theological_decisions:
- issue: Traduction de γέεννα dans un contexte de jugement
  choice: géhenne
  alternative: enfer
  rationale: Le texte principal conserve le terme historique et imagé du grec afin de ne pas imposer toutes les connotations théologiques développées plus tard. L’équivalent interprétatif courant est signalé en note.
- issue: Identité de « celui » qu’il faut craindre
  choice: ne pas expliciter le référent
  alternative: ajouter « Dieu »
  rationale: Le contexte conduit généralement à comprendre Dieu, mais le verset emploie un substantif implicite et ne le nomme pas. La traduction préserve cette formulation et sa tension.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « craindre » est maintenue pour refléter l’insistance du grec; la dernière proposition adopte une tournure emphatique naturelle en français.
