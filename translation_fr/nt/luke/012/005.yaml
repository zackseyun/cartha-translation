  rationale: La révision enlève l’ajout modal « devez », rétablit l’impératif répété dans la conclusion et conserve l’accent du démonstratif par « lui ». Elle maintient « géhenne » sans imposer l’équivalence théologique plus interprétative « enfer », laquelle reste proposée en note.
