review_pass:
  verdict: revise
  source_fidelity: La traduction conserve correctement la séquence du grec, l’autorité (ἐξουσία) après la mise à mort, la géhenne, ainsi que l’insistance finale. Toutefois, « vous devez craindre » explicite une modalité qui n’est pas formulée par le grec et affaiblit, dans la dernière occurrence, l’impératif répété.
  naturalness: Le français est globalement naturel. « Qui craindre » est une interrogative indirecte idiomatique et plus directe. « Craignez-le, lui » rend naturellement l’impératif final tout en conservant l’accent du démonstratif.
  terminology: « Géhenne » est un bon choix, fidèle à γέεννα et préférablement non réducteur à « enfer » dans le texte principal. « A autorité de jeter » rend plus précisément ἔχοντα ἐξουσίαν que « a autorité pour jeter ».
  issues:
  - severity: medium
    issue: Ajout modal dans « qui vous devez craindre » et « c’est lui que vous devez craindre ».
    rationale: τίνα φοβηθῆτε introduit la personne à craindre, et les deux occurrences de φοβήθητε sont des impératifs. « Devez » introduit une formulation modale explicite; au terme du verset, il remplace l’impératif répété par une assertion.
  - severity: low
    issue: Rendu de l’emphase finale.
    rationale: τοῦτον φοβήθητε porte l’accent sur « celui-là ». « Craignez-le, lui » maintient à la fois l’impératif et l’emphase sans identifier le référent.
  - severity: low
    issue: Formulation de la note sur la géhenne.
    rationale: La géhenne est présentée plus exactement comme un terme de jugement ayant un arrière-plan dans l’imagerie de la vallée de Hinnom, plutôt que comme une « image de jugement » en elle-même.
