id: LUK.12.40
reference: Luke 12:40
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ⸀ὑμεῖς γίνεσθε ἕτοιμοι, ὅτι ᾗ ὥρᾳ οὐ δοκεῖτε ὁ υἱὸς τοῦ ἀνθρώπου ἔρχεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/040.yaml
  text: You also must be ready[c][b][a], because the Son of Man is coming at an hour you do not expect.
translation:
  language: fr
  text: Vous aussi, tenez-vous prêts, car le Fils de l’homme[a] vient à une heure où vous ne vous y attendez pas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Le Fils de l’homme » est un titre que Jésus emploie pour parler de lui-même, avec de probables échos à Daniel 7.13-14.
    reason: cross_reference
  - marker: b
    text: 'Autres traductions possibles : « à une heure que vous ne prévoyez pas » ou « quand vous ne vous y attendez pas ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ὑμεῖς
  choice: Vous aussi
  rationale: 'Cette formulation naturelle conserve l’inclusion et l’emphase : les auditeurs, comme les serviteurs de l’image précédente, sont eux aussi concernés.'
- source_word: γίνεσθε ἕτοιμοι
  choice: tenez-vous prêts
  rationale: L’impératif présent appelle à demeurer dans un état de préparation. « Tenez-vous prêts » exprime clairement cette posture continue en français courant.
- source_word: ὅτι
  choice: car
  rationale: La conjonction introduit la raison de l’ordre. « Car » convient au registre digne du passage sans être archaïque.
- source_word: ᾗ ὥρᾳ
  choice: à une heure
  rationale: Le tour temporel désigne un moment indéterminé, dont l’inattendu est souligné.
- source_word: οὐ δοκεῖτε
  choice: où vous ne vous y attendez pas
  rationale: Dans ce contexte d’avertissement, δοκέω exprime l’idée de penser ou de supposer que l’événement aura lieu. La tournure française rend naturellement le défaut d’attente.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: le Fils de l’homme
  rationale: Cette traduction consacrée préserve la forme du titre et ses résonances scripturaires, notamment avec Daniel 7.13-14.
- source_word: ἔρχεται
  choice: vient
  rationale: Le présent grec a ici une portée future et vive. Le présent français conserve cette immédiateté sans imposer une formulation systématique de l’eschatologie.
theological_decisions:
- issue: Traduction du titre christologique ὁ υἱὸς τοῦ ἀνθρώπου
  choice: le Fils de l’homme
  alternative: l’Humain
  rationale: Le maintien du titre traditionnel en conserve les résonances messianiques et apocalyptiques sans ajouter d’affirmation doctrinale étrangère au texte.
- issue: Valeur temporelle de ἔρχεται dans cet avertissement eschatologique
  choice: vient
  alternative: viendra
  rationale: Le présent peut avoir une portée future. « Vient » respecte la forme et la vivacité du grec, tout en laissant ouverte la manière précise de situer cet événement.
translation_notes:
  register: Français international moderne, clair et digne. « Tenez-vous prêts » rend l’idée d’une préparation continue. Le masculin pluriel suit l’adresse collective conventionnelle sans restreindre les destinataires aux hommes.
