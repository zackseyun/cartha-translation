id: LUK.12.31
reference: Luke 12:31
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: πλὴν ζητεῖτε τὴν βασιλείαν ⸀αὐτοῦ, καὶ ⸀ταῦτα προστεθήσεται ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/031.yaml
  text: But seek his kingdom[b][a], and these things will be added to you.
translation:
  language: fr
  text: Mais cherchez son royaume[b][a], et ces choses vous seront données en plus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le royaume de Dieu » ; le grec porte « son royaume », dont le référent est indiqué par le contexte.
    reason: lexical_alternative
  - marker: b
    text: Certains manuscrits portent « le royaume de Dieu » au lieu de « son royaume ».
    reason: textual_variant
lexical_decisions:
- source_word: πλὴν
  choice: Mais
  rationale: Marque naturellement le contraste avec la recherche inquiète des besoins matériels évoquée auparavant, sans surtraduire.
- source_word: ζητεῖτε
  choice: cherchez
  rationale: L’impératif présent exprime une orientation continue; en français, l’impératif simple peut naturellement porter cette valeur.
- source_word: βασιλείαν
  choice: royaume
  rationale: Terme courant et reconnu qui conserve l’étendue sémantique du grec, pouvant désigner à la fois le règne et le domaine royal.
- source_word: αὐτοῦ
  choice: son
  rationale: Conserve le pronom du texte grec; le contexte identifie Dieu comme référent sans qu’il soit nécessaire de l’expliciter dans le corps du verset.
- source_word: ταῦτα
  choice: ces choses
  rationale: Renvoie aux nécessités mentionnées dans le contexte. L’absence de « toutes » évite une harmonisation avec le parallèle matthéen.
- source_word: προστεθήσεται
  choice: seront données en plus
  rationale: Rend idiomatiquement le futur passif et l’idée d’ajout dans le contexte de biens nécessaires accordés, tout en évitant l’étrange littéralisme « seront ajoutées à vous ».
- source_word: ὑμῖν
  choice: vous
  rationale: Le pronom complément de « données » exprime naturellement en français le bénéficiaire indiqué par le datif grec.
theological_decisions:
- issue: Référent de αὐτοῦ
  choice: Le pronom renvoie à Dieu et est rendu implicitement par « son royaume ».
  alternative: Expliciter « le royaume de Dieu ».
  rationale: Le contexte immédiat parle du Père et de sa sollicitude. Garder « son » respecte la forme du texte grec tout en préservant l’identification contextuelle.
translation_notes:
  register: Français moderne international, naturel et digne. « Données en plus » privilégie une formulation française claire tout en conservant l’idée d’addition; les marqueurs suivent l’ordre fourni dans le texte anglais audité.
