id: LUK.12.6
reference: Luke 12:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὐχὶ πέντε στρουθία ⸀πωλοῦνται ἀσσαρίων δύο; καὶ ἓν ἐξ αὐτῶν οὐκ ἔστιν ἐπιλελησμένον ἐνώπιον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/006.yaml
  text: Are not five sparrows sold for two assaria? Yet not one of them is forgotten before God[a][b].
translation:
  language: fr
  text: Ne vend-on pas cinq moineaux pour deux assarions[a] ? Pourtant, pas un seul d’entre eux n’est oublié devant Dieu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’assarion était une petite monnaie romaine en cuivre.
    reason: cultural_note
  - marker: b
    text: 'Ou : « pas un seul d’entre eux ne passe inaperçu aux yeux de Dieu ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: στρουθία
  choice: moineaux
  rationale: Dans ce contexte, le diminutif désigne naturellement de petits oiseaux, traditionnellement et plausiblement identifiés comme des moineaux.
- source_word: πωλοῦνται
  choice: vend-on
  rationale: La tournure impersonnelle française rend naturellement le présent passif grec dans cette question de prix.
- source_word: ἀσσαρίων δύο
  choice: pour deux assarions
  rationale: Le nom de la monnaie antique est conservé afin d’éviter un équivalent moderne inexact; une note en donne une explication concise.
- source_word: ἐπιλελησμένον
  choice: n’est oublié
  rationale: Le participe parfait exprime l’état de ce qui a été oublié; cette formulation reste proche du grec sans développer davantage l’idée de providence.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: devant Dieu
  rationale: Rendu direct qui conserve l’idée d’être présent au regard de Dieu, sans réduire l’expression à une simple perception visuelle.
- source_word: οὐχὶ ... ;
  choice: Ne ... pas ?
  rationale: Cette interrogation rhétorique française appelle, comme le grec, une réponse affirmative.
- source_word: καὶ ἓν ἐξ αὐτῶν οὐκ
  choice: Pourtant, pas un seul d’entre eux
  rationale: « Pourtant » exprime le contraste contextuel, tandis que « pas un seul » restitue l’accent porté sur chacun des cinq oiseaux.
theological_decisions:
- issue: Langage de la mémoire et de la providence divines
  choice: pas un seul d’entre eux n’est oublié devant Dieu
  alternative: pas un seul d’entre eux ne passe inaperçu aux yeux de Dieu
  rationale: « Oublié » suit le sens lexical immédiat et préserve la formulation théologique du texte sans la transformer en affirmation plus développée sur la providence.
translation_notes:
  register: Français international moderne, courant et digne. La question rhétorique reste naturelle; le terme monétaire antique est conservé et expliqué en note.
