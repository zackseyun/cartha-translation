  text: οὕτως ὁ θησαυρίζων ⸀ἑαυτῷ καὶ μὴ εἰς θεὸν πλουτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/021.yaml
  text: So is the one who stores up treasure for himself and is not rich toward God[a].
translation:
  language: fr
  text: Il en va ainsi de celui qui amasse des trésors pour lui-même et qui n’est pas riche pour Dieu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « riche devant Dieu ».'
    reason: Variante lexicale possible pour εἰς θεόν ; la relation exacte avec « être riche » demeure ouverte.
lexical_decisions:
- source_word: οὕτως
  choice: Il en va ainsi de
  rationale: La formule reprend et applique la parabole précédente. Elle restitue naturellement en français la tournure grecque elliptique sans préciser davantage le sort évoqué.
- source_word: ὁ θησαυρίζων
  choice: celui qui amasse des trésors
  rationale: Le participe présent substantivé désigne de façon générale une personne caractérisée par cette conduite. « Amasser des trésors » conserve l’image lexicale du trésor et de l’accumulation.
- source_word: ἑαυτῷ
  choice: pour lui-même
  rationale: Le datif réfléchi exprime l’intérêt personnel et maintient l’accent sur l’orientation égoïste de l’accumulation.
- source_word: καὶ μὴ
  choice: et qui n’est pas
  rationale: La coordination est conservée, tandis que le verbe « être » est explicité pour produire une phrase française fluide.
- source_word: εἰς θεὸν
  choice: envers Dieu
  rationale: Cette expression préserve l’orientation relationnelle de εἰς sans réduire la formule à ce qui compte aux yeux de Dieu ni l’expliquer doctrinalement.
- source_word: πλουτῶν
  choice: riche
  rationale: Le participe est rendu idiomatiquement par l’adjectif attribut « riche », en contraste avec les trésors amassés pour soi.
theological_decisions:
- issue: Singulier masculin à valeur générique
  choice: celui qui
  alternative: l’homme qui ; la personne qui
  rationale: « Celui qui » correspond naturellement au participe substantivé masculin singulier et garde la forme représentative du texte sans suggérer que l’enseignement ne concernerait que les hommes.
- issue: Sens de l’expression « riche envers Dieu »
  choice: conserver la formulation relationnelle sans l’expliciter
  alternative: riche pour Dieu ; riche devant Dieu ; riche de ce qui compte pour Dieu
  rationale: Le verset ne définit pas précisément cette richesse. La formulation retenue maintient l’ambiguïté suggestive et la tension théologique de l’expression grecque.
translation_notes:
  register: Français international moderne, sobre et proverbial. « Il en va ainsi de » rend l’application elliptique de la parabole ; « envers Dieu » est volontairement dense afin de ne pas expliquer à la place du texte.
