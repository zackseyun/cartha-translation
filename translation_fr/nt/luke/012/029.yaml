  text: καὶ ὑμεῖς μὴ ζητεῖτε τί φάγητε ⸀καὶ τί πίητε, καὶ μὴ μετεωρίζεσθε,
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/029.yaml
  text: And you[a], do not seek what you may eat and what you may drink, and do not be unsettled.
translation:
  language: fr
  text: Et vous, ne cherchez pas ce que vous mangerez ni ce que vous boirez, et ne soyez pas inquiets[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « ne soyez pas anxieux », « ne soyez pas troublés » ; plus littéralement, « ne restez pas en suspens ».


      Le verbe grec peut évoquer l’agitation inquiète ou l’incertitude.'
    reason: Alternative lexicale pour μετεωρίζεσθε.
lexical_decisions:
- source_word: ὑμεῖς
  choice: vous
  rationale: Le pronom est explicite et emphatique. La tournure initiale « Et vous » conserve cette mise en relief sans alourdir par « vous-mêmes ».
- source_word: ζητεῖτε
  choice: cherchez
  rationale: « Chercher » garde le sens courant de ζητέω et laisse le contexte préciser qu’il s’agit d’une recherche préoccupée, plutôt que de toute prévoyance ordinaire.
- source_word: τί φάγητε … τί πίητε
  choice: ce que vous mangerez ni ce que vous boirez
  rationale: Le futur français exprime naturellement ici la question indéterminée des ressources à venir. « Ni » est la coordination idiomatique après une négation, sans modifier la portée cumulative du grec.
- source_word: μετεωρίζεσθε
  choice: soyez dans l’inquiétude
  rationale: Le verbe évoque un état d’agitation et d’incertitude, littéralement le fait d’être tenu en suspens. Cette formulation reste naturelle tout en évitant de réduire le terme à une simple émotion passagère.
- source_word: καὶ … καὶ … καὶ
  choice: Et … ni … et
  rationale: Le premier et le dernier καί sont conservés par « et ». Entre les deux objets de la recherche, le français exige naturellement « ni » sous la portée de la négation.
theological_decisions:
- issue: Portée de l’interdiction concernant la nourriture et la boisson
  choice: Une interdiction de rechercher ces biens dans l’inquiétude
  alternative: Une interdiction de prévoir normalement sa nourriture et sa boisson, ou un appel à l’indifférence envers les besoins du corps
  rationale: Le contexte porte sur l’inquiétude liée aux nécessités matérielles. La traduction conserve l’ordre direct sans lui donner une portée ascétique absente du passage.
translation_notes:
  register: Français international moderne, simple et digne. La structure reste proche du grec, avec l’adaptation idiomatique « ni » après la négation. La note préserve l’image et l’étendue sémantique inhabituelles de μετεωρίζεσθε.
