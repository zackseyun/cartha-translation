id: LUK.12.52
reference: Luke 12:52
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἔσονται γὰρ ἀπὸ τοῦ νῦν πέντε ἐν ⸂ἑνὶ οἴκῳ⸃ διαμεμερισμένοι, τρεῖς ἐπὶ δυσὶν καὶ δύο ἐπὶ τρισίν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/052.yaml
  text: For from now on there will be five in one house divided[a], three against two and two against three,
translation:
  language: fr
  text: 'Car désormais, dans une même maison, cinq personnes seront divisées[a] : trois contre deux et deux contre trois.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « au sein d’une même maisonnée ». Le mot grec peut désigner la maison elle-même ou l’ensemble des personnes qui y vivent.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔσονται
  choice: seront
  rationale: Le futur de εἰμί s’intègre naturellement en français avec « cinq personnes » comme sujet explicite.
- source_word: γὰρ
  choice: Car
  rationale: Conserve la valeur explicative qui relie ce verset à l’annonce précédente de la division.
- source_word: ἀπὸ τοῦ νῦν
  choice: désormais
  rationale: Expression française actuelle et concise qui rend l’idée de « à partir de maintenant » avec une portée continue.
- source_word: πέντε
  choice: cinq personnes
  rationale: Le grec porte simplement « cinq », mais le français gagne en clarté en explicitant qu’il s’agit de personnes, comme le confirme le verset suivant.
- source_word: ἐν ἑνὶ οἴκῳ
  choice: dans une même maison
  rationale: « Maison » préserve le sens concret de οἶκος, tandis que « une même » exprime naturellement l’unité du lieu domestique; le sens possible de maisonnée est signalé en note.
- source_word: διαμεμερισμένοι
  choice: divisées
  rationale: Le participe parfait passif décrit un état de division résultant; « divisées » conserve cette valeur et s’accorde avec « personnes ».
- source_word: τρεῖς ἐπὶ δυσὶν
  choice: trois contre deux
  rationale: « Contre » rend clairement l’opposition exprimée ici par ἐπί avec le datif.
- source_word: καὶ δύο ἐπὶ τρισίν
  choice: et deux contre trois
  rationale: La formulation parallèle conserve la symétrie adversative du grec.
theological_decisions:
- issue: Faut-il rendre οἶκος par le lieu concret « maison » ou par l’unité familiale « maisonnée »?
  choice: maison
  alternative: maisonnée
  rationale: Le contexte du verset suivant montre qu’il s’agit de relations familiales, mais οἶκος peut désigner aussi bien la maison que ceux qui la composent. Le texte principal conserve « maison » et la note maintient l’autre nuance possible.
translation_notes:
  register: Français international moderne, naturel et digne. « Désormais » évite une tournure lourde, tandis que les deux groupes « trois contre deux » et « deux contre trois » gardent le rythme et la tension du grec.
