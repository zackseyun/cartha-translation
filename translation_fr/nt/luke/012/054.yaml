id: LUK.12.54
reference: Luke 12:54
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἔλεγεν δὲ καὶ τοῖς ὄχλοις· Ὅταν ⸀ἴδητε νεφέλην ἀνατέλλουσαν ⸀ἐπὶ δυσμῶν, εὐθέως λέγετε ⸀ὅτι Ὄμβρος ἔρχεται, καὶ γίνεται οὕτως·
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/054.yaml
  text: He was also saying to the crowds[a], “When you see a cloud rising in the west, you immediately say, ‘A rainstorm is coming,’ and so it happens.”
translation:
  language: fr
  text: 'Il disait aussi aux foules : « Quand vous voyez un nuage se lever à l’ouest, vous dites aussitôt : “Une forte pluie arrive[a]”, et cela se produit. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la pluie arrive ». Le mot grec peut désigner la pluie en général ou, plus précisément, une forte pluie ou une averse.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔλεγεν
  choice: Il disait
  rationale: L’imparfait grec présente la parole dans son déroulement ou comme répétée; l’imparfait français en conserve naturellement l’aspect.
- source_word: δὲ καὶ
  choice: aussi
  rationale: « Aussi » rend la valeur additive de καί, tandis que δέ assure ici une transition légère qu’il n’est pas nécessaire de traduire séparément.
- source_word: τοῖς ὄχλοις
  choice: aux foules
  rationale: Le pluriel explicite du grec est conservé dans un français actuel et intelligible.
- source_word: Ὅταν ἴδητε
  choice: Quand vous voyez
  rationale: Ὅταν suivi du subjonctif exprime une situation générale; le présent français avec « quand » rend naturellement cette valeur habituelle.
- source_word: νεφέλην ἀνατέλλουσαν
  choice: un nuage se lever
  rationale: La formulation conserve le sens concret de « nuage » et le mouvement exprimé par ἀνατέλλω sans préciser qu’il s’agit déjà d’un nuage de pluie.
- source_word: ἐπὶ δυσμῶν
  choice: à l’ouest
  rationale: Dans ce contexte d’observation météorologique, « à l’ouest » exprime naturellement la localisation ou l’origine occidentale tout en laissant subsister la légère souplesse de la préposition grecque.
- source_word: εὐθέως
  choice: aussitôt
  rationale: « Aussitôt » rend pleinement l’immédiateté de l’adverbe dans un registre naturel et digne.
- source_word: Ὄμβρος
  choice: une forte pluie
  rationale: ὄμβρος peut désigner la pluie en général, mais aussi une pluie abondante ou une averse; « forte pluie » garde ici l’intensité possible sans imposer la notion moderne plus large de tempête.
- source_word: ἔρχεται
  choice: arrive
  rationale: Le présent français exprime avec naturel l’imminence de la pluie annoncée.
- source_word: γίνεται οὕτως
  choice: c’est ce qui se passe
  rationale: Cette tournure idiomatique restitue l’idée que l’événement annoncé se produit effectivement ainsi.
theological_decisions: []
translation_notes:
  register: Français international moderne, oral mais digne. La phrase conserve le pluriel « foules », l’aspect duratif de l’imparfait et la structure proverbiale de l’observation météorologique.
