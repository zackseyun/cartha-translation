source:
  edition: SBLGNT
  text: ⸂κἂν ἐν τῇ δευτέρᾳ κἂν⸃ ἐν τῇ τρίτῃ φυλακῇ ἔλθῃ καὶ εὕρῃ οὕτως, μακάριοί ⸀εἰσιν ἐκεῖνοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/038.yaml
  text: Even if he comes in the second watch[a], or even in the third, and finds them so[b], blessed are those servants.
translation:
  language: fr
  text: Même s’il arrive pendant la deuxième veille[a], ou même pendant la troisième, et qu’il les trouve ainsi, heureux sont ces serviteurs[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus explicitement : « pendant la deuxième veille de la nuit, ou pendant la troisième veille de la nuit ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « heureux sont ceux-là ». Le contexte indique qu’il s’agit des serviteurs mentionnés juste avant.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κἂν ... κἂν
  choice: Même si… ou même…
  rationale: Cette tournure rend la valeur concessive et indéfinie de la répétition de κἄν, tout en restant naturelle en français.
- source_word: δευτέρᾳ ... τρίτῃ φυλακῇ
  choice: pendant la deuxième veille… pendant la troisième
  rationale: φυλακή désigne ici une période de garde nocturne. « Veille » est le terme français traditionnel et précis; « de la nuit » reste implicite dans le texte principal et est explicité en note.
- source_word: ἔλθῃ
  choice: il arrive
  rationale: Le subjonctif aoriste dans cette construction conditionnelle exprime une éventualité future indéterminée, naturellement rendue par le présent français après « même si ».
- source_word: εὕρῃ οὕτως
  choice: qu’il les trouve ainsi
  rationale: οὕτως renvoie à l’état de vigilance décrit au verset précédent. Le pronom « les », implicite en grec, reprend naturellement les serviteurs.
- source_word: μακάριοί
  choice: heureux
  rationale: Dans une béatitude, « heureux » exprime l’état favorable proclamé par Jésus sans réduire le terme à une émotion passagère; cette formulation est naturelle et digne en français biblique moderne.
- source_word: ἐκεῖνοι
  choice: ces serviteurs
  rationale: Le grec dit littéralement « ceux-là ». L’ajout contextuel de « serviteurs » rend explicite le référent immédiat sans introduire de contenu nouveau; une note signale la forme littérale.
theological_decisions:
- issue: Explicitation du référent de ἐκεῖνοι
  choice: ces serviteurs
  alternative: ceux-là
  rationale: Le démonstratif renvoie clairement aux serviteurs du maître dans le contexte immédiat. Expliciter ce référent améliore la clarté sans trancher une question doctrinale ni ajouter un nouveau personnage.
- issue: Rendu de μακάριοι
  choice: heureux
  alternative: bénis
  rationale: « Heureux » conserve la forme française habituelle d’une béatitude et désigne une condition favorable reconnue par Dieu. « Bénis » pourrait suggérer plus directement une action divine exprimée par un autre vocabulaire grec.
translation_notes:
  register: Français international moderne, clair et digne. La structure répétée « même si… ou même… » préserve l’insistance grecque. « Veille » maintient l’image historique des divisions de la nuit, tandis que les notes explicitent les éléments sous-entendus dans le grec.
