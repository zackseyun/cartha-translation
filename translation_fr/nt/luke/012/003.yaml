  source_fidelity: 'Le sens général et le parallélisme du grec sont bien rendus : l’inférence (« C’est pourquoi »), la portée exhaustive, l’opposition obscurité/lumière, les futurs passifs sans agent explicité, et la proclamation publique sont conservés. « Du haut des toits » est une formulation idiomatique qui rend convenablement l’image de ἐπὶ τῶν δωμάτων.'
