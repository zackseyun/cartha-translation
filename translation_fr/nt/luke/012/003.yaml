id: LUK.12.3
reference: Luke 12:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀνθ’ ὧν ὅσα ἐν τῇ σκοτίᾳ εἴπατε ἐν τῷ φωτὶ ἀκουσθήσεται, καὶ ὃ πρὸς τὸ οὖς ἐλαλήσατε ἐν τοῖς ταμείοις κηρυχθήσεται ἐπὶ τῶν δωμάτων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/003.yaml
  text: Therefore[a], whatever you said in the darkness will be heard in the light, and what you spoke into the ear in the inner rooms will be proclaimed on the housetops.
translation:
  language: fr
  text: C’est pourquoi, tout ce que vous avez dit dans l’obscurité sera entendu en pleine lumière, et ce que vous avez dit à l’oreille dans les pièces intérieures sera proclamé du haut des toits.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’image est celle d’une annonce publique faite depuis les toits plats des maisons.
    reason: contexte_culturel
lexical_decisions:
- source_word: ἀνθ’ ὧν
  choice: C’est pourquoi
  rationale: L’expression a ici une valeur déductive et relie cette parole à l’affirmation précédente concernant la révélation de ce qui est caché.
- source_word: ὅσα
  choice: tout ce que
  rationale: Cette tournure française naturelle exprime la portée générale de l’indéfini relatif.
- source_word: ἐν τῇ σκοτίᾳ … ἐν τῷ φωτί
  choice: dans l’obscurité … en pleine lumière
  rationale: Ce choix conserve l’opposition imagée entre secret et dévoilement public; « en pleine lumière » rend cette opposition clairement en français courant.
- source_word: ἀκουσθήσεται
  choice: sera entendu
  rationale: Le futur passif est conservé sans préciser l’agent ni le moment du dévoilement.
- source_word: πρὸς τὸ οὖς
  choice: à l’oreille
  rationale: L’expression française évoque naturellement une parole murmurée en privé tout en gardant l’image concrète du grec.
- source_word: ἐν τοῖς ταμείοις
  choice: dans les pièces retirées
  rationale: ταμεῖον peut désigner une pièce intérieure, privée ou servant de réserve. Ici, « pièces retirées » met en valeur le cadre secret sans limiter le sens à un cellier.
- source_word: κηρυχθήσεται
  choice: sera proclamé
  rationale: Le verbe désigne une annonce publique et solennelle; « proclamé » évite de lui donner ici le sens religieux plus étroit de « prêché ».
- source_word: ἐπὶ τῶν δωμάτων
  choice: du haut des toits
  rationale: Cette formulation française rend l’image d’une annonce publique faite depuis les toits plats, tout en exprimant naturellement le point depuis lequel la proclamation retentit.
theological_decisions:
- issue: Nature et moment du dévoilement
  choice: Conserver l’annonce générale selon laquelle les paroles secrètes deviendront publiques.
  alternative: Préciser qu’il s’agit soit du jugement final, soit d’une révélation historique de l’hypocrisie.
  rationale: Le contexte porte sur ce qui est caché et sera révélé, mais le verset ne fixe ni le moment ni le moyen de ce dévoilement. La formulation maintient cette ouverture.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme entre obscurité/lumière et parole privée/proclamation publique est préservé. La répétition de « dit » est naturelle en français et évite d’introduire une différence sémantique excessive entre λέγω et λαλέω.
