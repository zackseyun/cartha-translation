id: LUK.12.53
reference: Luke 12:53
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸀διαμερισθήσονται πατὴρ ἐπὶ υἱῷ καὶ υἱὸς ἐπὶ πατρί, μήτηρ ⸀ἐπὶ ⸀θυγατέρα καὶ θυγάτηρ ἐπὶ ⸂τὴν μητέρα⸃, πενθερὰ ἐπὶ τὴν νύμφην αὐτῆς καὶ νύμφη ἐπὶ τὴν ⸀πενθεράν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/053.yaml
  text: 'They will be divided: father against son and son against father[a], mother against daughter and daughter against mother[c][b], mother-in-law against her daughter-in-law and daughter-in-law against her mother-in-law.'
translation:
  language: fr
  text: 'Ils seront divisés[a] : le père contre le fils et le fils contre le père, la mère contre la fille et la fille contre la mère, la belle-mère contre sa belle-fille[b] et la belle-fille contre sa belle-mère.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ils seront séparés les uns des autres. » Le verbe grec souligne une division au sein d’un groupe ou d’une famille.'
    reason: lexical_alternative
  - marker: b
    text: Ici, « belle-mère » désigne la mère du conjoint, et « belle-fille » la femme du fils. Le mot grec traduit par « belle-fille » peut aussi signifier « jeune mariée » dans d’autres contextes.
    reason: lexical_alternative
lexical_decisions:
- source_word: διαμερισθήσονται
  choice: ils seront divisés
  rationale: Le futur passif introduit l’état de division qui touchera les relations familiales. Cette formulation conserve la voix passive et la force du constat sans préciser une cause que le verbe n’explicite pas.
- source_word: ἐπί
  choice: contre
  rationale: Dans chacune de ces constructions relationnelles, la préposition exprime l’opposition. « Contre » rend naturellement cette valeur en français.
- source_word: πατήρ / υἱός
  choice: père / fils
  rationale: Ces termes gardent les liens familiaux masculins précis et la réciprocité de l’opposition.
- source_word: μήτηρ / θυγάτηρ
  choice: mère / fille
  rationale: Ces équivalents usuels préservent les relations féminines précises et la structure réciproque.
- source_word: πενθερά / νύμφη
  choice: belle-mère / belle-fille
  rationale: Dans ce couple réciproque, les mots grecs désignent la mère du conjoint et la femme du fils. Les termes français usuels sont naturels, bien qu’ils aient aussi d’autres sens de parenté, d’où la note.
- source_word: αὐτῆς
  choice: sa
  rationale: Le possessif grec est rendu explicitement dans « sa belle-fille ». Il est également exprimé dans le dernier membre pour la clarté et le parallélisme naturels en français.
theological_decisions:
- issue: Nature de la division décrite
  choice: Conserver la description abrupte d’une opposition réciproque au sein de la famille
  alternative: Atténuer le propos en parlant seulement de désaccords ou présenter cette hostilité comme une prescription
  rationale: Le contexte décrit les conflits familiaux provoqués par la mission de Jésus sans faire de l’hostilité familiale un idéal. La traduction garde cette tension sans l’expliquer ni l’approuver.
translation_notes:
  register: Français international moderne, sobre et digne. La répétition des liens familiaux et de « contre » est conservée afin de reproduire le rythme insistant et la réciprocité du texte grec. Les possessifs rendent les relations naturelles et claires en français.
