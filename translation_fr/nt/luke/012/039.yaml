revisions:
- from: 'Mais sachez-le : si le maître de maison avait su à quelle heure le voleur allait venir, il n’aurait pas laissé percer le mur de sa maison[a].'
  to: 'Mais sachez-le : si le maître de maison avait su à quelle heure le voleur allait venir, il n’aurait pas laissé sa maison être percée[a].'
  rationale: La révision retire du texte principal l’objet implicite « le mur », afin de ne pas dépasser la formulation grecque, tout en conservant dans la note l’éclairage culturel sur une effraction par une paroi. La construction passive reflète plus directement διορυχθῆναι et préserve l’image matérielle.
