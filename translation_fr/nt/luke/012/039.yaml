review_pass:
  verdict: revise
  source_fidelity: Le sens contrefactuel est bien rendu, ainsi que l’image de l’effraction. Toutefois, le grec dit littéralement que le maître n’aurait pas laissé « sa maison être percée/creusée à travers »; l’ajout de « le mur » dans le texte principal explicite au-delà de ce qui est formulé dans le grec. Cette précision convient mieux à la note.
  naturalness: « Mais sachez-le » est naturel et direct. « Il n’aurait pas laissé percer sa maison » est grammaticalement possible mais un peu moins idiomatique; « il n’aurait pas laissé sa maison être percée » garde la voix passive du grec et demeure clair dans ce registre.
  terminology: '« Maître de maison », « voleur » et « maison » sont appropriés. La note doit éviter de présenter « à travers sa maison » comme le littéral exact : διορύσσω évoque le fait de creuser/percer à travers, et l’objet est « sa maison »; le mur relève de l’arrière-plan culturel et peut être indiqué comme tel.'
  issues:
  - severity: low
    issue: Ajout de « le mur » dans le texte principal
    rationale: διορυχθῆναι porte sur « sa maison » (τὸν οἶκον αὐτοῦ), sans que « mur » soit exprimé. L’image du percement d’une paroi est plausible et utile en note, mais elle restreint légèrement la formulation du texte.
  - severity: low
    issue: Formulation de la note littérale
    rationale: « creuser à travers sa maison » peut donner l’impression que l’ensemble de la maison est traversé. Il vaut mieux rendre l’expression verbale comme « être creusée/perforée à travers » et présenter les parois comme une explication culturelle.
  revised_text: 'Mais sachez-le : si le maître de maison avait su à quelle heure le voleur allait venir, il n’aurait pas laissé sa maison être percée[a].'
  revised_footnotes:
  - marker: a
    text: Littéralement, « être creusée à travers ». Cette expression peut évoquer l’effraction à travers la paroi d’une habitation.
    reason: cultural_note
  revision_rationale: La révision retire du texte principal l’objet implicite « le mur », afin de ne pas dépasser la formulation grecque, tout en conservant dans la note l’éclairage culturel sur une effraction par une paroi. La construction passive reflète plus directement διορυχθῆναι et préserve l’image matérielle.
