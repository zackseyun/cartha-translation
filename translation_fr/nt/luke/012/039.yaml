  variant: modern international French
source:
  edition: SBLGNT
  text: Τοῦτο δὲ γινώσκετε ὅτι εἰ ᾔδει ὁ οἰκοδεσπότης ποίᾳ ὥρᾳ ὁ κλέπτης ἔρχεται, ⸂οὐκ ἂν⸃ ἀφῆκεν ⸀διορυχθῆναι τὸν οἶκον αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/039.yaml
  text: 'But know this: if the master of the house had known at what hour the thief was coming[a], he would not have allowed his house to be broken into.'
translation:
  language: fr
  text: 'Mais sachez-le : si le maître de maison avait su à quelle heure le voleur allait venir, il n’aurait pas laissé sa maison être percée[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement, « être creusée à travers ». Cette expression peut évoquer l’effraction à travers la paroi d’une habitation.
    reason: cultural_note
lexical_decisions:
- source_word: Τοῦτο δὲ γινώσκετε
  choice: Mais sachez-le
  rationale: L’impératif présent pluriel γινώσκετε appelle les auditeurs à reconnaître un fait. « Sachez-le » est direct et naturel en français, tandis que « Mais » rend la transition marquée par δέ.
- source_word: ὅτι
  choice: ':'
  rationale: Les deux-points introduisent naturellement en français le contenu de ce qu’il faut savoir, sans alourdir la phrase avec « que ».
- source_word: οἰκοδεσπότης
  choice: le maître de maison
  rationale: Cette expression conserve l’idée du responsable ou chef de la maisonnée et reste claire en français moderne.
- source_word: ποίᾳ ὥρᾳ
  choice: à quelle heure
  rationale: Ce choix reproduit la précision de l’expression grecque et convient au thème contextuel de la vigilance.
- source_word: ὁ κλέπτης ἔρχεται
  choice: le voleur allait venir
  rationale: Le présent grec envisage la venue du voleur depuis le point de vue du maître de maison. Dans cette condition irréelle au passé, « allait venir » exprime naturellement cette perspective sans transformer explicitement le présent en conditionnel.
- source_word: οὐκ ἂν ἀφῆκεν
  choice: il n’aurait pas laissé
  rationale: La combinaison de ἄν avec l’aoriste exprime ici la conséquence irréelle d’une condition contraire aux faits. Le conditionnel passé français la rend clairement.
- source_word: διορυχθῆναι
  choice: percer le mur de sa maison
  rationale: Le verbe désigne littéralement l’action de creuser ou percer à travers, notamment une paroi. Cette formulation garde l’image concrète tout en explicitant son objet naturel en français.
- source_word: τὸν οἶκον αὐτοῦ
  choice: sa maison
  rationale: « Maison » est l’équivalent direct de οἶκος et correspond à l’image d’une effraction à travers la structure du bâtiment.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La phrase conserve la forme proverbiale et l’image matérielle du grec, avec une brève note culturelle. Le marqueur [a] est placé immédiatement après l’expression qu’il explique.
