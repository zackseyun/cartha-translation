  variant: modern international French
source:
  edition: SBLGNT
  text: Ἐν οἷς ἐπισυναχθεισῶν τῶν μυριάδων τοῦ ὄχλου, ὥστε καταπατεῖν ἀλλήλους, ἤρξατο λέγειν πρὸς τοὺς μαθητὰς αὐτοῦ πρῶτον· Προσέχετε ἑαυτοῖς ἀπὸ τῆς ζύμης, ⸂ἥτις ἐστὶν ὑπόκρισις, τῶν Φαρισαίων⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/001.yaml
  text: Meanwhile[a], when the many thousands of the crowd had gathered together, so that they were trampling one another, he began to say first to his disciples, “Beware of the leaven of the Pharisees[b], which is hypocrisy.”
translation:
  language: fr
  text: 'Pendant ce temps, alors que des dizaines de milliers de personnes s’étaient rassemblées, au point de se piétiner les unes les autres, Jésus se mit à parler d’abord à ses disciples : « Gardez-vous du levain des Pharisiens[a], c’est-à-dire de l’hypocrisie. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi traduire : « Prenez garde à vous contre le levain des Pharisiens. »'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν οἷς
  choice: Pendant ce temps
  rationale: Cette tournure idiomatique marque ici une transition temporelle et circonstancielle avec la scène précédente, plutôt qu’un rapport spatial.
- source_word: ἐπισυναχθεισῶν τῶν μυριάδων τοῦ ὄχλου
  choice: la foule s’était rassemblée par dizaines de milliers
  rationale: Le plus-que-parfait rend l’antériorité du participe aoriste dans le génitif absolu. « Par dizaines de milliers » communique l’immensité de la foule sans imposer un décompte précis.
- source_word: ὥστε καταπατεῖν ἀλλήλους
  choice: au point que les gens se piétinaient les uns les autres
  rationale: « Au point que » exprime le résultat indiqué par ὥστε, tandis que l’imparfait rend le caractère continu et chaotique de l’action.
- source_word: ἤρξατο λέγειν
  choice: se mit à parler
  rationale: Formulation française naturelle qui conserve la valeur inchoative de la construction grecque.
- source_word: πρὸς τοὺς μαθητὰς αὐτοῦ πρῶτον
  choice: d’abord à ses disciples
  rationale: Cette formulation maintient l’idée que les disciples sont les premiers destinataires, sans préciser au-delà du grec la suite du discours.
- source_word: Προσέχετε ἑαυτοῖς ἀπὸ
  choice: Gardez-vous de
  rationale: L’expression française conserve naturellement à la fois l’avertissement, la protection contre un danger et la nuance réfléchie de ἑαυτοῖς.
- source_word: τῆς ζύμης
  choice: du levain
  rationale: « Levain » préserve l’image biblique et ses résonances littéraires, contrairement à une explicitation comme « influence ».
- source_word: ἥτις ἐστὶν ὑπόκρισις
  choice: c’est-à-dire de l’hypocrisie
  rationale: Cette tournure rend clairement la valeur explicative et qualitative du relatif, tout en identifiant le référent de la métaphore.
- source_word: τῶν Φαρισαίων
  choice: des pharisiens
  rationale: Le génitif décrit le levain caractéristique des pharisiens. La minuscule suit l’usage courant du français moderne pour les membres d’un groupe religieux ancien.
theological_decisions:
- issue: Portée métaphorique de ζύμη (« levain »)
  choice: Conserver la métaphore du levain, ensuite explicitement identifiée à l’hypocrisie.
  alternative: Remplacer l’image par « enseignement », « influence » ou « corruption ».
  rationale: Luc fournit lui-même l’explication de l’image. La conserver respecte la forme littéraire et évite d’en réduire la portée à une interprétation doctrinale particulière.
- issue: Portée de πρῶτον
  choice: Comprendre « d’abord » comme indiquant la priorité accordée aux disciples parmi les destinataires.
  alternative: 'Le comprendre comme un marqueur discursif : « avant tout ».'
  rationale: La position grecque permet une certaine ambiguïté, mais le lien avec « à ses disciples » favorise la priorité des destinataires; la formulation française n’ajoute aucune séquence détaillée absente du texte.
translation_notes:
  register: Français international moderne, naturel et digne. « Se piétinaient » restitue concrètement la cohue; « gardez-vous » conserve un registre biblique accessible sans archaïsme marqué.
