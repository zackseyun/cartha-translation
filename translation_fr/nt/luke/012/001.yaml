revisions:
- from: 'Pendant ce temps, la foule s’était rassemblée par dizaines de milliers[a], au point que les gens se piétinaient les uns les autres. Jésus se mit à parler, d’abord à ses disciples : « Gardez-vous du levain des pharisiens[b], c’est-à-dire de l’hypocrisie. »'
  to: 'Pendant ce temps, alors que des dizaines de milliers de personnes s’étaient rassemblées, au point de se piétiner les unes les autres, Jésus se mit à parler d’abord à ses disciples : « Gardez-vous du levain des Pharisiens[a], c’est-à-dire de l’hypocrisie. »'
  rationale: La révision élimine l’ambiguïté française de « par dizaines de milliers » sans imposer un chiffre exact, tout en conservant l’idée d’une foule immense. Elle rend la relation de résultat de ὥστε plus directement. L’ancre de la note quantitative est déplacée vers « dizaines de milliers », où elle est pertinente; la note sur l’alternative de l’avertissement demeure ancrée à « Gardez-vous ».
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T10:54:17Z'
review_pass:
  verdict: revise
  source_fidelity: La traduction rend correctement la transition temporelle, la foule extrêmement nombreuse, le résultat de cohue, l’adresse prioritaire aux disciples et l’avertissement concernant le levain identifié à l’hypocrisie. Toutefois, « la foule s’était rassemblée par dizaines de milliers » suggère que le rassemblement s’effectuait en groupes de dizaines de milliers; le grec décrit plutôt des dizaines de milliers de personnes déjà rassemblées.
  naturalness: Le registre est globalement naturel et accessible. La reformulation de la première proposition et de la conséquence (« au point de se piétiner les unes les autres ») est plus idiomatique et suit mieux la construction résultative grecque.
  terminology: « Levain », « hypocrisie » et « Pharisiens » préservent avec justesse l’image et les termes du texte. La majuscule à « Pharisiens » est retenue pour désigner le groupe historique nommé.
  issues:
  - severity: medium
    issue: « la foule s’était rassemblée par dizaines de milliers »
    rationale: En français, « se rassembler par dizaines de milliers » peut décrire une modalité ou des vagues de rassemblement. τῶν μυριάδων τοῦ ὄχλου désigne les très nombreux membres de la foule qui se sont rassemblés. « des dizaines de milliers de personnes s’étaient rassemblées » exprime plus exactement ce sens.
  - severity: low
    issue: « au point que les gens se piétinaient les uns les autres »
    rationale: Cette formulation est compréhensible, mais « au point de se piétiner les unes les autres » est plus fluide, garde le même sujet collectif et correspond directement à ὥστε suivi de l’infinitif.
  revised_text: 'Pendant ce temps, alors que des dizaines de milliers de personnes s’étaient rassemblées, au point de se piétiner les unes les autres, Jésus se mit à parler d’abord à ses disciples : « Gardez-vous du levain des Pharisiens[a], c’est-à-dire de l’hypocrisie. »'
  revised_footnotes:
