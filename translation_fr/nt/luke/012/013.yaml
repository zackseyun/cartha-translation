  text: Εἶπεν δέ τις ⸂ἐκ τοῦ ὄχλου αὐτῷ⸃· Διδάσκαλε, εἰπὲ τῷ ἀδελφῷ μου μερίσασθαι μετ’ ἐμοῦ τὴν κληρονομίαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/013.yaml
  text: Then someone from the crowd said to him[a], “Teacher, tell my brother to divide the inheritance with me.”
translation:
  language: fr
  text: 'Quelqu’un du milieu de la foule lui dit alors : « Maître, dis à mon frère de partager l’héritage avec moi. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἶπεν δέ
  choice: dit alors
  rationale: δέ marque ici une transition narrative légère ; « alors » assure un enchaînement naturel sans créer une opposition forte.
- source_word: τις ἐκ τοῦ ὄχλου
  choice: Quelqu’un dans la foule
  rationale: L’expression désigne une personne non identifiée appartenant à la foule ; cette formulation est naturelle en français moderne.
- source_word: αὐτῷ
  choice: lui
  rationale: Le pronom au datif désigne Jésus comme destinataire des paroles.
- source_word: Διδάσκαλε
  choice: Maître
  rationale: Dans cette adresse, le terme désigne celui qui enseigne. « Maître » est l’appellation française biblique courante et reste compréhensible sans ajouter de titre confessionnel.
- source_word: εἰπὲ τῷ ἀδελφῷ μου
  choice: dis à mon frère
  rationale: L’impératif demande à Jésus d’intervenir verbalement auprès du frère ; la construction française correspond directement au grec.
- source_word: μερίσασθαι
  choice: de partager
  rationale: Le verbe signifie diviser ou répartir en parts. Dans le contexte d’un héritage, « partager » exprime naturellement cette répartition sans préciser indûment sa forme juridique.
- source_word: μετ’ ἐμοῦ
  choice: avec moi
  rationale: La préposition exprime ici l’association ou la participation ; « avec moi » conserve la formulation et l’ambiguïté du grec plutôt que d’imposer « entre nous ».
- source_word: τὴν κληρονομίαν
  choice: l’héritage
  rationale: Le terme peut désigner les biens hérités ou la succession ; « l’héritage » est le terme français le plus large et le plus direct.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe demeure proche du grec tout en évitant un calque lourd. Aucun marqueur de note n’est nécessaire, puisque « partager avec moi l’héritage » conserve déjà la latitude lexicale pertinente.
