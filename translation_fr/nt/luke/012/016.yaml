  text: εἶπεν δὲ παραβολὴν πρὸς αὐτοὺς λέγων· Ἀνθρώπου τινὸς πλουσίου εὐφόρησεν ἡ χώρα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/016.yaml
  text: Then he told them a parable[a], saying, “The land of a certain rich man produced abundantly.”
translation:
  language: fr
  text: 'Puis il leur raconta une parabole : « Les terres d’un certain homme riche produisirent abondamment[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « donnèrent beaucoup » ou « furent très productives ».
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν δὲ
  choice: Puis il raconta
  rationale: Le connecteur δέ marque ici une progression légère dans le récit. « Puis » la rend naturellement, tandis que « raconta » convient en français lorsque παραβολή est le complément direct.
- source_word: παραβολὴν
  choice: une parabole
  rationale: « Parabole » est le terme évangélique courant et conserve la catégorie littéraire et théologique du grec.
- source_word: πρὸς αὐτοὺς
  choice: leur
  rationale: Le complément est intégré idiomatiquement au verbe « raconta », tout en conservant l’idée qu’il s’adresse à eux.
- source_word: λέγων
  choice: ': «'
  rationale: Le participe introduit le contenu de la parabole. En français moderne, les deux-points et les guillemets rendent cette fonction plus naturellement qu’un calque tel que « en disant ».
- source_word: Ἀνθρώπου τινὸς πλουσίου
  choice: d’un homme riche
  rationale: Le génitif exprime la possession des terres. L’indéfini « un » rend suffisamment τινός en français naturel; « un certain homme riche » serait inutilement appuyé dans ce contexte.
- source_word: εὐφόρησεν
  choice: avaient produit une récolte abondante
  rationale: Le verbe désigne une forte productivité agricole. Cette formulation française explicite naturellement le résultat implicite sans modifier le sens.
- source_word: ἡ χώρα
  choice: Les terres
  rationale: Dans ce contexte agricole, χώρα désigne les terres ou le domaine cultivable de l’homme, non un pays. Le pluriel français « les terres » est idiomatique pour une propriété agricole.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe directe convient à l’ouverture d’une parabole; le plus-que-parfait situe naturellement la récolte déjà produite au moment où commence le récit.
