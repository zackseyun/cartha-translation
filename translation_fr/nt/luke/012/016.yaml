  source_fidelity: La paraphrase agricole est globalement juste, mais le plus-que-parfait (« avaient produit ») présente la récolte comme antérieure à un repère narratif que le grec aoriste ne pose pas. « Produisirent abondamment » restitue plus directement l’événement perfectif. L’ajout de « un certain » rend la nuance narrative de τινός sans lourdeur excessive.
  naturalness: La formulation révisée reste naturelle dans un français biblique moderne et international. « Les terres ... produisirent abondamment » est clair dans ce contexte agricole; les deux-points introduisent idiomatiquement le contenu de la parabole.
  terminology: « Parabole » conserve le terme évangélique παραβολή. « Terres » convient à χώρα au sens de propriété ou de terrain agricole, sans le confondre avec un pays. Aucun terme théologique disputé n’est en jeu.
  issues:
