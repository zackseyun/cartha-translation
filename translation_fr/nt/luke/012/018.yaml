  text: καὶ εἶπεν· Τοῦτο ποιήσω· καθελῶ μου τὰς ἀποθήκας καὶ μείζονας οἰκοδομήσω, καὶ συνάξω ἐκεῖ πάντα ⸂τὸν σῖτον⸃ καὶ τὰ ἀγαθά μου,
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/018.yaml
  text: 'And he said[a], ‘This is what I will do: I will tear down my barns and build larger ones[c][b], and there I will gather all my grain and my goods.’'
translation:
  language: fr
  text: 'Et il dit : « Voici ce que je vais faire : je vais démolir mes greniers et en construire de plus grands ; là, je rassemblerai tout le grain[a] et tous mes biens[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot grec traduit par « grain » peut, dans certains contextes, désigner plus précisément le blé.
    reason: lexical_alternative
  - marker: b
    text: Ou « toutes mes possessions ».
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῦτο ποιήσω
  choice: Voici ce que je vais faire
  rationale: Formulation française naturelle qui conserve la mise en relief prospective de τοῦτο.
- source_word: καθελῶ
  choice: je vais démolir
  rationale: Exprime concrètement la destruction des bâtiments existants et convient au contexte de leur remplacement.
- source_word: ἀποθήκας
  choice: greniers
  rationale: Dans ce contexte agricole et en lien avec le stockage du grain, « greniers » est précis et courant ; le grec peut plus largement désigner des entrepôts.
- source_word: μείζονας οἰκοδομήσω
  choice: en construire de plus grands
  rationale: Le pronom « en » reprend naturellement « greniers » et le comparatif est pleinement conservé.
- source_word: συνάξω ἐκεῖ
  choice: là, je rassemblerai
  rationale: Rend directement le mouvement de regroupement et l'indication de lieu, sans expliciter davantage l'idée de stockage.
- source_word: πάντα τὸν σῖτον
  choice: tout mon grain
  rationale: « Grain » conserve la portée possible de σῖτος sans la restreindre au blé ; le possessif est naturel dans le discours du propriétaire et correspond au parallèle avec « mes biens ».
- source_word: τὰ ἀγαθά μου
  choice: tous mes biens
  rationale: Désigne largement les ressources ou possessions matérielles sans les réduire à l'argent.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Le futur proche dans la décision initiale et pour la démolition/construction rend l'intention arrêtée de manière idiomatique ; le futur simple pour le rassemblement évite une répétition lourde. Les marqueurs de notes suivent immédiatement les termes concernés.
