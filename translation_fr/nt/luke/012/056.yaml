id: LUK.12.56
reference: Luke 12:56
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὑποκριταί, τὸ πρόσωπον τῆς γῆς καὶ τοῦ οὐρανοῦ οἴδατε δοκιμάζειν, τὸν ⸂δὲ καιρὸν⸃ τοῦτον πῶς ⸂οὐκ οἴδατε δοκιμάζειν⸃;
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/056.yaml
  text: Hypocrites! You know how to interpret the appearance of the earth and the sky[a], but how is it that you do not know how to interpret this time?
translation:
  language: fr
  text: Hypocrites ! Vous savez discerner l’aspect de la terre et du ciel, mais comment se fait-il que vous ne sachiez pas discerner ce temps-ci[a] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « cette période » ou « ce moment décisif ». Le grec καιρός peut désigner un temps significatif ou opportun, et non simplement le temps en général.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑποκριταί
  choice: Hypocrites !
  rationale: Vocatif de réprimande direct. Le terme français établi exprime ici la dissimulation morale, non le métier d’acteur.
- source_word: τὸ πρόσωπον
  choice: l’aspect
  rationale: Dans cette tournure, πρόσωπον désigne l’apparence visible de la terre et du ciel ; « aspect » rend naturellement l’expression sans imposer le littéral « face ».
- source_word: τῆς γῆς καὶ τοῦ οὐρανοῦ
  choice: de la terre et du ciel
  rationale: L’association des deux termes renvoie aux signes météorologiques observables ; « ciel » convient mieux ici que « cieux ».
- source_word: οἴδατε δοκιμάζειν
  choice: vous savez discerner
  rationale: οἴδατε suivi de l’infinitif exprime le savoir-faire, tandis que δοκιμάζειν signifie ici examiner correctement les indices et en reconnaître la portée.
- source_word: τὸν δὲ καιρὸν τοῦτον
  choice: mais ce temps-ci
  rationale: καιρός peut désigner un moment significatif ou opportun. « Ce temps-ci » conserve le démonstratif et l’ambiguïté du grec sans préciser indûment la nature de ce moment.
- source_word: πῶς οὐκ οἴδατε δοκιμάζειν
  choice: comment se fait-il que vous ne sachiez pas discerner
  rationale: Cette formulation française restitue la force indignée de la question rhétorique et maintient la répétition de δοκιμάζειν.
theological_decisions:
- issue: Portée de καιρός dans la réprimande de Jésus
  choice: ce temps-ci
  alternative: ce moment décisif / cette période
  rationale: Le contexte suggère un moment chargé de signification dans l’action de Dieu, mais le grec ne l’explicite pas entièrement. La traduction conserve donc cette tension, et la note signale les nuances possibles.
translation_notes:
  register: Français international moderne, clair et digne. « Hypocrites ! » garde la vigueur de l’interpellation ; « discerner » convient aux signes visibles comme à la portée du moment, tout en préservant le parallélisme grec.
