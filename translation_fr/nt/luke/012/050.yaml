  text: βάπτισμα δὲ ἔχω βαπτισθῆναι, καὶ πῶς συνέχομαι ἕως ⸀ὅτου τελεσθῇ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/050.yaml
  text: But I have a baptism to undergo[c][b][a], and how distressed I am until it is accomplished.
translation:
  language: fr
  text: Mais je dois passer par un baptême[a], et quelle angoisse m’étreint jusqu’à ce qu’il soit accompli ![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement, la tournure grecque dit : « j’ai un baptême à recevoir »; elle peut aussi se comprendre : « j’ai un baptême dont je dois être baptisé ». Le baptême évoque ici métaphoriquement l’épreuve accablante que Jésus va subir.'
    reason: lexical_alternative
  - marker: b
    text: 'Autres traductions possibles : « combien je suis contraint » ou « combien je suis sous pression », jusqu’à son accomplissement.'
    reason: lexical_alternative
lexical_decisions:
- source_word: βάπτισμα
  choice: un baptême
  rationale: Le terme est conservé afin de préserver l’image explicite du baptême et de ne pas la réduire dans le texte à une simple mention de la souffrance ou de la mort.
- source_word: ἔχω βαπτισθῆναι
  choice: je dois passer par un baptême
  rationale: La tournure exprime ici une nécessité qui attend Jésus. « Passer par » rend naturellement en français l’expérience qu’il doit subir, tout en gardant le nom « baptême ».
- source_word: πῶς
  choice: quelle
  rationale: Dans cette exclamation, πῶς marque l’intensité. La tournure française « quelle angoisse » en restitue naturellement la force.
- source_word: συνέχομαι
  choice: l’angoisse m’étreint
  rationale: Le verbe évoque le fait d’être serré, pressé ou intérieurement contraint. « M’étreint » conserve cette image de pression tout en exprimant clairement la détresse dans un français actuel.
- source_word: ἕως ὅτου
  choice: jusqu’à ce que
  rationale: Cette locution indique le terme temporel de l’état décrit.
- source_word: τελεσθῇ
  choice: il soit accompli
  rationale: Le passif exprime l’achèvement du baptême évoqué, considéré comme un événement devant parvenir à son terme. « Accompli » garde cette nuance sans reprendre artificiellement la formule de Jean 19.30.
theological_decisions:
- issue: Référence métaphorique du « baptême »
  choice: Conserver « baptême » dans le texte, tout en signalant qu’il désigne métaphoriquement l’épreuve à venir de Jésus.
  alternative: Paraphraser directement par « souffrance », « épreuve » ou « mort ».
  rationale: Le contexte oriente vers les souffrances et la mort prochaines de Jésus, mais le texte maintient délibérément l’image d’un baptême. La traduction préserve donc cette tension littéraire et théologique.
- issue: Nuance de συνέχομαι
  choice: Rendre la détresse intense par « quelle angoisse m’étreint ».
  alternative: « Comme je suis pressé », « contraint » ou « sous pression ».
  rationale: Le grec permet à la fois l’idée de détresse et celle de contrainte ou de pression. Le texte principal adopte une formulation française naturelle, tandis que la note conserve les autres nuances possibles.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve l’image forte du baptême et adopte une exclamation naturelle pour rendre l’intensité émotionnelle, sans effacer l’ambiguïté de συνέχομαι.
