id: LUK.12.46
reference: Luke 12:46
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἥξει ὁ κύριος τοῦ δούλου ἐκείνου ἐν ἡμέρᾳ ᾗ οὐ προσδοκᾷ καὶ ἐν ὥρᾳ ᾗ οὐ γινώσκει, καὶ διχοτομήσει αὐτὸν καὶ τὸ μέρος αὐτοῦ μετὰ τῶν ἀπίστων θήσει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/046.yaml
  text: the master of that servant will come on a day when he does not expect him and at an hour he does not know[b][a], and will cut him in pieces and assign his place with the unfaithful.
translation:
  language: fr
  text: le maître de cet esclave viendra un jour où celui-ci ne l’attend pas et à une heure qu’il ne connaît pas ; il le coupera en deux[a] et lui assignera sa part parmi les infidèles[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le mettra en pièces » ; certains comprennent cette expression au sens figuré : « le punira sévèrement ».'
    reason: Alternative lexicale et possible compréhension idiomatique de διχοτομήσει.
  - marker: b
    text: 'Ou : « les incroyants ».'
    reason: ἀπίστων peut exprimer soit l’infidélité, soit l’absence de foi.
lexical_decisions:
- source_word: κύριος
  choice: maître
  rationale: Dans la relation domestique explicite « le maître de cet esclave », « maître » exprime naturellement le rapport social de la parabole sans imposer ici le titre « Seigneur ».
- source_word: δοῦλος
  choice: esclave
  rationale: Le cadre parabolique met en relief l’autorité du maître et la condition servile ; « esclave » conserve cette réalité plus précisément que « serviteur ».
- source_word: ἥξει
  choice: viendra
  rationale: Le futur de ἥκω annonce l’arrivée du maître ; « viendra » est direct et naturel en français.
- source_word: ἐν ἡμέρᾳ ᾗ οὐ προσδοκᾷ
  choice: un jour où celui-ci ne l’attend pas
  rationale: Le complément implicite de « attendre » est le maître. « Celui-ci » lève l’ambiguïté du pronom sujet en français tout en restant proche du grec.
- source_word: ἐν ὥρᾳ ᾗ οὐ γινώσκει
  choice: à une heure qu’il ne connaît pas
  rationale: Cette formulation maintient la distinction du grec entre ne pas attendre et ne pas connaître.
- source_word: διχοτομήσει
  choice: le coupera en deux
  rationale: Le verbe signifie littéralement « couper en deux ». Cette image saisissante est conservée dans le texte, tandis que la compréhension idiomatique est signalée en note.
- source_word: τὸ μέρος αὐτοῦ
  choice: sa part
  rationale: μέρος désigne une part, un lot ou une portion. « Sa part » conserve l’image de l’attribution d’un sort et s’intègre naturellement avec « assignera ».
- source_word: ἀπίστων
  choice: les infidèles
  rationale: Dans le contexte de la fidélité attendue d’un esclave, « infidèles » rend le sens relationnel de ἄπιστος, sans exclure son possible sens d’incroyance, indiqué en note.
- source_word: θήσει
  choice: lui assignera
  rationale: τίθημι exprime ici l’attribution d’une part ou d’un sort ; « assignera » restitue la portée judiciaire de l’énoncé.
theological_decisions:
- issue: Faut-il conserver littéralement l’image du châtiment ou la rendre comme une expression idiomatique ?
  choice: Conserver « le coupera en deux » dans le texte principal.
  alternative: « le punira sévèrement »
  rationale: Le sens lexical concret et la violence de l’avertissement doivent rester visibles. Puisque l’expression peut aussi être comprise idiomatiquement, cette possibilité figure en note plutôt que de remplacer l’image grecque.
- issue: ἀπίστων désigne-t-il les infidèles ou les incroyants ?
  choice: Employer « les infidèles » dans le texte principal.
  alternative: « les incroyants »
  rationale: La parabole porte immédiatement sur la fidélité d’un esclave à son maître, ce qui favorise « infidèles ». Le terme grec peut toutefois désigner ceux qui ne croient pas ; cette tension est préservée en note.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe demeure proche du grec tout en clarifiant les référents pronominaux. « Esclave » conserve la réalité sociale du terme δοῦλος ; les ambiguïtés lexicales ayant une portée théologique sont maintenues par les notes.
