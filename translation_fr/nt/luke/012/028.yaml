id: LUK.12.28
reference: Luke 12:28
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἰ δὲ ⸂ἐν ἀγρῷ τὸν χόρτον ὄντα σήμερον⸃ καὶ αὔριον εἰς κλίβανον βαλλόμενον ὁ θεὸς οὕτως ⸀ἀμφιέζει, πόσῳ μᾶλλον ὑμᾶς, ὀλιγόπιστοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/028.yaml
  text: But if God so clothes the grass in the field[a], which is here today and tomorrow is thrown into an oven, how much more will he clothe you[b], you of little faith!
translation:
  language: fr
  text: Mais si Dieu vêt ainsi l’herbe des champs[a], qui est là aujourd’hui et qui demain sera jetée dans un four[b], à combien plus forte raison vous vêtira-t-il, vous qui avez peu de foi !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la végétation » ou « les plantes des champs ».
    reason: lexical_alternative
  - marker: b
    text: Il s’agit d’un four à pain ; de l’herbe séchée des champs pouvait servir de combustible.
    reason: cultural_note
lexical_decisions:
- source_word: χόρτον
  choice: l’herbe
  rationale: « Herbe » est l’équivalent français courant de χόρτος et convient à la végétation éphémère des champs évoquée ici.
- source_word: ἐν ἀγρῷ
  choice: des champs
  rationale: Cette tournure française naturelle exprime le cadre générique du champ sans introduire de précision absente du grec.
- source_word: ὄντα σήμερον καὶ αὔριον ... βαλλόμενον
  choice: qui est là aujourd’hui et qui demain sera jetée
  rationale: Cette expansion naturelle rend la construction participiale grecque et maintient le contraste temporel soulignant le caractère passager de l’herbe.
- source_word: κλίβανον
  choice: un four
  rationale: κλίβανος désigne ici un four de cuisson, et non une installation industrielle de type fournaise.
- source_word: ἀμφιέζει
  choice: vêt
  rationale: « Vêt » conserve la métaphore de l’habillement et permet de maintenir le même champ lexical lorsque la phrase passe de l’herbe aux disciples.
- source_word: πόσῳ μᾶλλον
  choice: à combien plus forte raison
  rationale: Cette formulation idiomatique exprime clairement en français l’argument grec allant du moindre au plus grand.
- source_word: ὀλιγόπιστοι
  choice: vous qui avez peu de foi
  rationale: La formule garde l’adresse directe et le reproche mesuré du vocatif grec sans en faire une qualification doctrinale technique.
- source_word: εἰ δὲ
  choice: Mais si
  rationale: « Mais » marque la légère transition argumentative portée par δέ, tandis que « si » rend directement εἰ.
- source_word: ὁ θεὸς
  choice: Dieu
  rationale: Le sujet explicite ὁ θεός est rendu directement, sans ajout.
- source_word: οὕτως
  choice: ainsi
  rationale: « Ainsi » exprime naturellement la manière indiquée par οὕτως.
theological_decisions:
- issue: Portée de ὀλιγόπιστοι dans l’adresse de Jésus
  choice: 'Une interpellation directe mais mesurée : « vous qui avez peu de foi »'
  alternative: Un reproche exaspéré, ou une simple description neutre d’une confiance faible
  rationale: Le terme dénonce un manque de confiance en Dieu, mais ne formule pas ici une doctrine technique sur la foi qui sauve ni sur l’apostasie. La traduction préserve à la fois le reproche et sa retenue.
translation_notes:
  register: Français international moderne, naturel et digne. « Vêt » conserve la métaphore commune à l’herbe et aux personnes ; « à combien plus forte raison » rend l’argument du moindre au plus grand sans lourdeur excessive.
