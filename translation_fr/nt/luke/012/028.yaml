  source_fidelity: Le texte rend fidèlement l’argument a fortiori de εἰ δὲ… πόσῳ μᾶλλον, l’image de Dieu qui « vêt » l’herbe, le contraste « aujourd’hui / demain », et l’interpellation finale ὀλιγόπιστοι. « L’herbe des champs » exprime naturellement χόρτος ἐν ἀγρῷ; « un four » convient à κλίβανος sans anachronisme industriel.
  naturalness: Le français est moderne, clair et idiomatique. « À combien plus forte raison » est légèrement soutenu, mais reste naturel dans un registre biblique digne. La reprise de « qui » dans « qui est là aujourd’hui et qui demain sera jetée » évite une construction participiale artificielle et se lit bien.
  terminology: « Vêt » préserve intentionnellement la métaphore commune à ἀμφιέζει et à son application aux destinataires. « Vous qui avez peu de foi » restitue de façon accessible l’adresse critique mais non techniquement doctrinale de ὀλιγόπιστοι. Les notes proposent des alternatives lexicales et expliquent sobrement le four comme contexte culturel.
