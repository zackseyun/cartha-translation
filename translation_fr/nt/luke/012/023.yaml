  text: ἡ ⸀γὰρ ψυχὴ πλεῖόν ἐστιν τῆς τροφῆς καὶ τὸ σῶμα τοῦ ἐνδύματος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/023.yaml
  text: For life is more than food[a], and the body more than clothing.
translation:
  language: fr
  text: Car la vie vaut plus que la nourriture[a], et le corps plus que le vêtement.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « l’âme » : le mot grec ψυχή peut désigner la vie, la personne elle-même ou l’âme ; ici, le contexte favorise « la vie ».'
    reason: alternative lexicale
lexical_decisions:
- source_word: γὰρ
  choice: Car
  rationale: Introduit la raison qui fonde l’exhortation précédente à ne pas s’inquiéter, tout en conservant clairement le lien logique.
- source_word: ψυχή
  choice: vie
  rationale: Dans ce contexte de nourriture, d’inquiétude et de besoins corporels, le mot désigne la vie de la personne plutôt que l’âme au sens strict.
- source_word: πλεῖόν
  choice: vaut plus que
  rationale: Exprime naturellement en français la supériorité de valeur impliquée par le comparatif avec le génitif, sans réduire la comparaison à une simple quantité.
- source_word: τροφή
  choice: nourriture
  rationale: Équivalent courant et précis dans le contexte de l’alimentation.
- source_word: σῶμα
  choice: corps
  rationale: Désigne directement le corps physique, mis en parallèle avec le vêtement.
- source_word: ἔνδυμα
  choice: vêtement
  rationale: Terme générique, naturel et contemporain pour ce qui couvre le corps.
theological_decisions:
- issue: Sens de ψυχή dans l’enseignement sur l’inquiétude et la sollicitude divine
  choice: vie
  alternative: âme
  rationale: Le parallèle entre ψυχή et nourriture, puis entre corps et vêtement, porte ici sur la vie terrestre et ses besoins. « Vie » respecte ce contexte sans nier que ψυχή puisse signifier « âme » ailleurs.
translation_notes:
  register: Français international moderne, simple et digne. « Vaut plus que » rend explicitement la valeur supérieure sans ajouter « importante », tandis que la seconde occurrence elliptique demeure naturelle en français.
