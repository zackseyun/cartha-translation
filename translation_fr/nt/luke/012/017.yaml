  text: καὶ διελογίζετο ἐν ⸀ἑαυτῷ λέγων· Τί ποιήσω, ὅτι οὐκ ἔχω ποῦ συνάξω τοὺς καρπούς μου;
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/017.yaml
  text: And he reasoned within himself[a], saying, ‘What will I do[b], since I have nowhere to gather my crops?’
translation:
  language: fr
  text: 'Et il réfléchissait en lui-même : « Que vais-je faire, puisque je n’ai pas de place où amasser mes récoltes[a] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « mes produits » (c’est-à-dire les produits de ses terres).
    reason: lexical_alternative
lexical_decisions:
- source_word: διελογίζετο
  choice: réfléchissait
  rationale: L’imparfait décrit une délibération intérieure en cours. « Réfléchissait » est naturel en français moderne et exprime mieux ce processus que le plus abstrait « raisonnait ».
- source_word: ἐν ἑαυτῷ
  choice: en lui-même
  rationale: Cette expression indique clairement que la délibération est intérieure, sans suggérer nécessairement des paroles prononcées à voix haute.
- source_word: λέγων
  choice: ':'
  rationale: En français, les deux-points introduisent naturellement le contenu de la réflexion intérieure et évitent le tour plus lourd « en disant ».
- source_word: Τί ποιήσω
  choice: Que vais-je faire
  rationale: Cette formulation rend naturellement en français contemporain la question délibérative exprimée par le subjonctif aoriste grec.
- source_word: ὅτι
  choice: puisque
  rationale: La conjonction introduit ici la raison du dilemme. « Puisque » conserve clairement ce rapport causal dans la question.
- source_word: οὐκ ἔχω ποῦ
  choice: je n’ai pas de place où
  rationale: Cette tournure idiomatique exprime clairement l’absence d’un lieu disponible, tout en conservant le lien avec le verbe qui suit.
- source_word: συνάξω
  choice: amasser
  rationale: Dans ce contexte agricole, le verbe évoque le fait de rassembler la production en un lieu. « Amasser » conserve ce sens sans préciser excessivement le mode d’entreposage.
- source_word: τοὺς καρπούς μου
  choice: mes récoltes
  rationale: Ici, καρποί désigne le rendement agricole. « Récoltes » est clair, naturel et mieux adapté au contexte que le sens littéral étroit de « fruits ».
theological_decisions: []
translation_notes:
  register: Français moderne, courant et digne. La structure interrogative et la délibération intérieure sont conservées, tandis que les deux-points rendent naturellement le participe grec λέγων.
