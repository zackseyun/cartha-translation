id: LUK.12.37
reference: Luke 12:37
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: μακάριοι οἱ δοῦλοι ἐκεῖνοι, οὓς ἐλθὼν ὁ κύριος εὑρήσει γρηγοροῦντας· ἀμὴν λέγω ὑμῖν ὅτι περιζώσεται καὶ ἀνακλινεῖ αὐτοὺς καὶ παρελθὼν διακονήσει αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/037.yaml
  text: Blessed are those servants whom the Lord[a], when he comes, will find staying awake. Truly I say to you, he will dress himself for service and have them recline at the table[c][b], and he will come and serve them.
translation:
  language: fr
  text: Heureux ces esclaves[a] que le maître[b], à son arrivée, trouvera éveillés ! Amen, je vous le dis, il se préparera lui-même à servir[c], les fera prendre place à table et, s’approchant, les servira.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « serviteurs ». Le mot grec désigne ici des personnes placées sous l’autorité d’un maître et peut aussi se traduire par « esclaves ».
    reason: lexical_alternative
  - marker: b
    text: Ou « le Seigneur ». Dans la scène racontée, le mot grec peut désigner le maître de la maison, tout en laissant entendre le titre « Seigneur ».
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « il se ceindra ». On attachait son vêtement autour de la taille pour être prêt à travailler ou à servir.'
    reason: cultural_note
lexical_decisions:
- source_word: μακάριοι
  choice: Heureux
  rationale: Formule naturelle et solennelle des béatitudes en français biblique actuel ; elle exprime la condition enviable déclarée par Jésus sans la réduire à un sentiment passager.
- source_word: δοῦλοι
  choice: esclaves
  rationale: Dans cette scène domestique, le rapport de dépendance envers le maître est explicite. « Esclaves » rend donc plus précisément le statut social exprimé par δοῦλοι ; « serviteurs » demeure une possibilité signalée en note.
- source_word: κύριος
  choice: le maître
  rationale: Dans le cadre immédiat de la comparaison domestique, κύριος désigne le maître des esclaves. Une note conserve l’autre lecture possible, « le Seigneur », qui laisse entendre la portée plus large du récit.
- source_word: γρηγοροῦντας
  choice: éveillés
  rationale: Le participe évoque d’abord le fait de ne pas dormir, avec l’idée contextuelle de vigilance et de disponibilité.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: Amen, je vous le dis
  rationale: Cette formulation conserve le mot sémitique emphatique et la structure solennelle de la déclaration, tout en restant intelligible en français moderne.
- source_word: περιζώσεται
  choice: il se préparera lui-même à servir
  rationale: Littéralement, le maître se ceint, geste par lequel on relève et attache son vêtement afin de travailler ou de servir. La formulation française en communique la fonction, et la note garde l’image concrète.
- source_word: ἀνακλινεῖ αὐτούς
  choice: les fera prendre place à table
  rationale: Le verbe désigne le fait de faire s’allonger pour un repas selon l’usage antique. La traduction rend clairement la scène de repas sans imposer au lecteur moderne l’image peu naturelle de convives couchés.
- source_word: παρελθὼν
  choice: s’approchant
  rationale: Dans ce contexte de service à table, le participe décrit le mouvement du maître qui vient auprès des convives pour les servir.
- source_word: διακονήσει αὐτοῖς
  choice: les servira
  rationale: Le verbe exprime ici un service concret, vraisemblablement à table ; « servira » est direct et évite une coloration ecclésiastique étrangère à la scène.
theological_decisions:
- issue: Sens de κύριος dans une comparaison domestique susceptible d’évoquer Jésus comme Seigneur
  choice: le maître
  alternative: le Seigneur
  rationale: Le rapport maître-esclaves gouverne le sens immédiat de la scène. La note préserve toutefois la résonance possible de « Seigneur », sans décider à la place du lecteur si cette portée christologique doit être entendue ici.
- issue: Désignation des δοῦλοι dans la maisonnée
  choice: esclaves
  alternative: serviteurs
  rationale: 'Le statut de dépendance fait partie du renversement saisissant de la scène : le maître sert ceux qui lui appartiennent. « Serviteurs » est plus doux en français, mais atténue ce rapport social ; il est donc conservé en note.'
- issue: Renversement des rôles lorsque le maître sert ses esclaves
  choice: conserver explicitement le maître comme sujet de « se préparera », « fera » et « servira »
  alternative: reformuler de manière moins marquée comme un simple accueil à table
  rationale: La répétition des actions accomplies par le maître porte la tension du verset. La traduction ne l’explique pas théologiquement et n’en réduit pas le caractère paradoxal.
translation_notes:
  register: Français international actuel, digne et oralement fluide. « Amen, je vous le dis » conserve la solennité propre aux paroles de Jésus. La syntaxe met en relief le renversement inattendu des rôles sans ajouter d’interprétation doctrinale.
