  text: ⸂καὶ εἶπεν⸃ ὁ κύριος· Τίς ἄρα ἐστὶν ὁ πιστὸς οἰκονόμος, ⸀ὁ φρόνιμος, ὃν καταστήσει ὁ κύριος ἐπὶ τῆς θεραπείας αὐτοῦ τοῦ διδόναι ἐν καιρῷ ⸀τὸ σιτομέτριον;
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/042.yaml
  text: And the Lord said[a], “Who then is the faithful and prudent steward[b], whom the master will appoint over his household staff to give them their food allowance at the proper time?”
translation:
  language: fr
  text: 'Et le Seigneur dit : « Qui est donc l’intendant fidèle et avisé[a] que le maître établira à la tête de son personnel de maison, pour leur donner, au moment voulu, leur ration de nourriture[b] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sage ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « la ration de grain », c’est-à-dire la portion mesurée de nourriture attribuée aux serviteurs.
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος
  choice: Seigneur / maître
  rationale: Le premier emploi désigne Jésus dans le récit et est rendu par « Seigneur ». Le second désigne le propriétaire à l’intérieur de l’image et est rendu par « maître », distinction naturelle en français tout en conservant la gamme de sens du même mot grec.
- source_word: πιστός
  choice: fidèle
  rationale: Dans ce contexte de responsabilité confiée, le terme exprime la fiabilité et la loyauté de l’intendant ; « fidèle » est clair et traditionnel sans être archaïque.
- source_word: οἰκονόμος
  choice: intendant
  rationale: Le mot désigne une personne chargée d’administrer une maison ou un domaine pour le compte du maître. « Intendant » conserve cette notion de gestion déléguée.
- source_word: φρόνιμος
  choice: avisé
  rationale: Le terme évoque le discernement pratique et le bon jugement. « Avisé » convient au contexte de gestion, tandis que « sage » demeure une possibilité signalée en note.
- source_word: καταστήσει
  choice: établira
  rationale: Le verbe signifie placer quelqu’un dans une fonction ou une position de responsabilité. « Établira à la tête de » rend clairement cette délégation d’autorité.
- source_word: θεραπεία
  choice: personnel de maison
  rationale: Ici, le mot désigne collectivement les personnes attachées au service de la maison. « Personnel de maison » exprime ce groupe sans réduire le sens à la famille du maître.
- source_word: ἐν καιρῷ
  choice: au moment voulu
  rationale: L’expression indique le moment approprié ou fixé. « Au moment voulu » est idiomatique et conserve cette idée d’opportunité.
- source_word: σιτομέτριον
  choice: ration de nourriture
  rationale: Le terme désigne une portion mesurée de vivres, à l’origine notamment une ration de céréales. « Ration de nourriture » communique directement la fonction distributive ; la note conserve la nuance littérale.
theological_decisions:
- issue: Rendu des deux emplois de κύριος
  choice: « Seigneur » pour Jésus qui parle ; « maître » pour le propriétaire dans l’image
  alternative: « Seigneur » dans les deux cas
  rationale: Le grec emploie le même terme, mais le contexte change de niveau référentiel. Cette variation française évite la confusion sans nier le lien lexical ni imposer une identification théologique au-delà du texte.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve la question ouverte de Jésus, le vocabulaire de la gestion confiée et la distinction contextuelle entre « Seigneur » et « maître ». Les marqueurs de notes sont placés immédiatement après les expressions qu’ils éclairent.
