source:
  edition: SBLGNT
  text: ἐὰν δὲ εἴπῃ ὁ δοῦλος ἐκεῖνος ἐν τῇ καρδίᾳ αὐτοῦ· Χρονίζει ὁ κύριός μου ἔρχεσθαι, καὶ ἄρξηται τύπτειν τοὺς παῖδας καὶ τὰς παιδίσκας, ἐσθίειν τε καὶ πίνειν καὶ μεθύσκεσθαι,
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/045.yaml
  text: But if that servant says in his heart[a], ‘My master delays in coming,’ and begins to beat the male servants and the female servants, and to eat and drink and get drunk[b],
translation:
  language: fr
  text: 'Mais si cet esclave[a] dit dans son cœur : « Mon maître[b] tarde à venir », et se met à battre les serviteurs et les servantes, à manger, à boire et à s’enivrer,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « serviteur ». Le grec δοῦλος désigne ici une personne placée sous l’autorité de son maître dans la maison.
    reason: lexical_alternative
  - marker: b
    text: Ou « seigneur ». Ici, le grec κύριος désigne le supérieur de la maison dans le cadre de la parabole.
    reason: alternative_reading
lexical_decisions:
- source_word: δοῦλος
  choice: esclave
  rationale: Dans cette parabole, le rapport de dépendance et l’autorité exercée au sein de la maison sont au premier plan. « Esclave » rend donc plus clairement le statut social exprimé par δοῦλος que le terme plus général « serviteur ».
- source_word: ἐν τῇ καρδίᾳ αὐτοῦ
  choice: dans son cœur
  rationale: Cette formulation conserve l’image grecque du cœur comme lieu de la pensée intérieure, tout en restant claire en français moderne.
- source_word: Χρονίζει … ἔρχεσθαι
  choice: tarde à venir
  rationale: Cette tournure française naturelle exprime le retard continu que l’esclave attribue au retour de son maître.
- source_word: κύριός μου
  choice: mon maître
  rationale: Dans le cadre domestique de la parabole, κύριος désigne le supérieur humain de l’esclave. « Maître » exprime cette relation sans faire directement entendre le titre divin « Seigneur ».
- source_word: ἄρξηται τύπτειν
  choice: se met à battre
  rationale: « Se met à » rend l’idée de commencement portée par ἄρξηται, tandis que « battre » convient à l’action violente et potentiellement répétée de τύπτειν.
- source_word: τοὺς παῖδας καὶ τὰς παιδίσκας
  choice: les serviteurs et les servantes
  rationale: Le couple masculin-féminin du grec est préservé. Dans ce contexte domestique, les deux termes désignent les membres subalternes de la maison.
- source_word: ἐσθίειν τε καὶ πίνειν καὶ μεθύσκεσθαι
  choice: à manger, à boire et à s’enivrer
  rationale: La série d’infinitifs est reproduite simplement, et « s’enivrer » exprime naturellement le fait de devenir ivre.
theological_decisions:
- issue: Sens de κύριος dans une parabole où le mot désigne le supérieur d’une maison
  choice: maître
  alternative: Seigneur
  rationale: 'Le référent immédiat appartient au monde narratif de la parabole : il s’agit du maître humain de l’esclave. La traduction ne transforme donc pas ici κύριος en titre divin, tout en signalant l’autre rendu possible.'
- issue: Rendu de δοῦλος dans ce contexte
  choice: esclave
  alternative: serviteur
  rationale: La hiérarchie domestique, la dépendance et la reddition de comptes rendent le statut servile particulièrement pertinent. « Esclave » évite d’atténuer cette réalité sociale.
translation_notes:
  register: Français international moderne, clair et digne. La structure conditionnelle et la série d’actions sont conservées. « Dit dans son cœur » maintient l’image originale sans réduire l’expression à une simple paraphrase comme « se dit en lui-même ».
