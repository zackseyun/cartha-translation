id: LUK.12.49
reference: Luke 12:49
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Πῦρ ἦλθον βαλεῖν ⸀ἐπὶ τὴν γῆν, καὶ τί θέλω εἰ ἤδη ἀνήφθη;
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/049.yaml
  text: I came to cast fire on the earth[a], and how I wish it were already kindled!
translation:
  language: fr
  text: Je suis venu jeter un feu sur la terre, et comme je voudrais qu’il soit déjà allumé ![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « et que veux-je, s’il est déjà allumé ? » La proposition grecque est difficile ; le texte retient le sens idiomatique probable exprimant un désir intense.'
    reason: alternative_reading
lexical_decisions:
- source_word: Πῦρ
  choice: un feu
  rationale: Le nom sans article désigne ici le feu comme image vive. En français, « jeter un feu » est plus naturel que « jeter feu », sans préciser si l’image évoque le jugement, la purification, l’Esprit ou la crise provoquée par la mission de Jésus.
- source_word: ἦλθον
  choice: Je suis venu
  rationale: Le passé composé est la manière naturelle d’exprimer en français moderne cet aoriste qui présente la venue de Jésus sous l’angle de sa mission.
- source_word: βαλεῖν
  choice: jeter
  rationale: « Jeter » conserve le mouvement énergique et concret de βάλλω, contrairement à une formulation interprétative telle que « apporter ».
- source_word: ἐπὶ τὴν γῆν
  choice: sur la terre
  rationale: γῆ peut signifier la terre, le pays ou le sol. Ici, « la terre » convient à la portée générale de la déclaration sans la localiser indûment.
- source_word: καὶ τί θέλω εἰ ἤδη ἀνήφθη;
  choice: et comme je voudrais qu’il soit déjà allumé !
  rationale: La construction grecque est difficile. Cette formulation rend l’interprétation idiomatique probable d’un désir intense, tout en signalant en note la lecture plus littérale de la question.
- source_word: ἤδη
  choice: déjà
  rationale: « Déjà » restitue directement la valeur temporelle de ἤδη.
- source_word: ἀνήφθη
  choice: soit ... allumé
  rationale: Le passif aoriste de ἀνάπτω signifie « être allumé » ou « s’embraser ». Avec « je voudrais que », le subjonctif français est requis et garde l’image du feu.
theological_decisions:
- issue: Sens du « feu » dans la parole de Jésus
  choice: Conserver la métaphore du feu sans l’expliquer.
  alternative: Traduire ou expliciter par le jugement, la purification, le Saint-Esprit ou la division suscitée par la mission de Jésus.
  rationale: Le verset ne définit pas lui-même l’image. La conserver maintient ses résonances possibles et la tension théologique du contexte.
- issue: Valeur de τί θέλω εἰ ἤδη ἀνήφθη
  choice: Comprendre la proposition comme l’expression exclamative d’un désir intense.
  alternative: 'La rendre comme une question littérale : « et que veux-je, s’il est déjà allumé ? »'
  rationale: L’expression grecque est notoirement difficile. Le sens optatif donne une phrase française cohérente dans le contexte, tandis que la note préserve la forme plus littérale et l’ambiguïté réelle.
translation_notes:
  register: Français international moderne, naturel et digne. « Je suis venu » et « sur la terre » sont courants sans être familiers. « Jeter un feu » préserve la vigueur de l’image grecque ; « allumé » est plus immédiatement compréhensible que « embrasé » et reprend clairement le référent « feu ».
