id: LUK.12.34
reference: Luke 12:34
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὅπου γάρ ἐστιν ὁ θησαυρὸς ὑμῶν, ἐκεῖ καὶ ἡ καρδία ὑμῶν ἔσται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/034.yaml
  text: For where your treasure is[a], there your heart will be also.
translation:
  language: fr
  text: Car là où est votre trésor, là aussi sera votre cœur.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅπου
  choice: là où
  rationale: Cette tournure introduit naturellement en français le lieu, réel ou figuré, où se trouve le trésor, tout en préparant la reprise corrélative par « là ».
- source_word: γάρ
  choice: car
  rationale: « Car » conserve la valeur explicative qui relie cette maxime à l'instruction précédente.
- source_word: θησαυρός
  choice: trésor
  rationale: Équivalent direct et idiomatique, « trésor » préserve à la fois le sens concret de richesse accumulée et la portée figurée de ce à quoi l'on attache du prix.
- source_word: καρδία
  choice: cœur
  rationale: « Cœur » maintient le langage anthropologique biblique désignant le centre des affections, des désirs et des engagements, sans en réduire le sens à une seule faculté.
- source_word: ἐκεῖ
  choice: là
  rationale: 'La reprise par « là » conserve la structure corrélative du grec : « là où… là aussi… ».'
- source_word: καὶ
  choice: aussi
  rationale: '« Aussi » exprime l''idée additive : le cœur se trouve avec le trésor.'
- source_word: ἔσται
  choice: sera
  rationale: Le futur explicite du grec est conservé ; il peut exprimer ici à la fois une conséquence et une certitude proverbiale.
- source_word: ὑμῶν
  choice: votre
  rationale: Le possessif grec est au pluriel et s'adresse à plusieurs personnes ; « votre » le rend naturellement avec les noms singuliers « trésor » et « cœur ».
theological_decisions:
- issue: Sens anthropologique de « cœur »
  choice: Conserver « cœur » comme désignation biblique du centre intérieur des affections, des désirs et des engagements.
  alternative: Préciser de manière interprétative par « désirs », « pensée » ou « être intérieur ».
  rationale: La maxime décrit l'orientation intérieure d'une personne en fonction de ce qu'elle estime précieux. « Cœur » préserve l'étendue théologique et littéraire du terme sans imposer une interprétation psychologique étroite.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation concise conserve le parallélisme proverbial et l'ordre du grec sans lourdeur.
