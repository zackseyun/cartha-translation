  verdict: revise
  source_fidelity: 'La structure et le sens général sont fidèlement rendus : ignorance, actes méritant des coups, sanction moindre, puis principe de responsabilité proportionnée. Toutefois, « des choses méritant des coups » est moins idiomatique et moins directement calqué sur le neutre substantivé grec (« ce qui méritait des coups »). La formulation explicite « recevra peu de coups » maintient clairement l’image de δαρήσεται et de πληγῶν.'
  naturalness: Le français est globalement moderne et clair. « A fait ce qui méritait des coups » est plus naturel que « a fait des choses méritant des coups ». « On lui demandera encore davantage » est une formulation plus fluide et plus directement orientée vers la personne concernée que la reprise disloquée « de celle..., on demandera ».
  terminology: « Coups », « exiger », « confier » et « demander » conviennent au registre et préservent les distinctions sémantiques du grec sans préciser indûment l’agent ni l’instrument de la sanction.
