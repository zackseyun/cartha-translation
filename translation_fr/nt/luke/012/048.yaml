id: LUK.12.48
reference: Luke 12:48
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ δὲ μὴ γνοὺς ποιήσας δὲ ἄξια πληγῶν δαρήσεται ὀλίγας. παντὶ δὲ ᾧ ἐδόθη πολύ, πολὺ ζητηθήσεται παρ’ αὐτοῦ, καὶ ᾧ παρέθεντο πολύ, περισσότερον αἰτήσουσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/048.yaml
  text: But the one who did not know[a], yet did what deserved blows, will receive few. From everyone to whom much was given, much will be required, and from the one to whom they entrusted much[b], they will ask even more.
translation:
  language: fr
  text: Mais celui qui ne savait pas et qui a fait ce qui méritait des coups recevra peu de coups. On exigera beaucoup de toute personne à qui beaucoup a été donné, et à celle à qui l’on a beaucoup confié, on demandera encore davantage.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ... μὴ γνοὺς
  choice: celui qui ne savait pas
  rationale: Le participe substantivé désigne celui qui n’avait pas connaissance de la volonté du maître dans le contexte. Cette formulation naturelle n’ajoute ni incompréhension ni culpabilité au texte.
- source_word: ποιήσας ... ἄξια πληγῶν
  choice: qui a fait des choses méritant des coups
  rationale: La tournure conserve explicitement le lien entre les actes commis et les coups qu’ils méritent, sans généraliser en un simple « châtiment ».
- source_word: πληγῶν
  choice: des coups
  rationale: Dans cette image disciplinaire, πληγή désigne des coups infligés comme sanction. « Coups » reste concret sans préciser un instrument absent du grec.
- source_word: δαρήσεται ὀλίγας
  choice: en recevra peu
  rationale: Le passif de δέρω exprime le fait d’être battu. Le pronom « en » reprend naturellement « des coups » dans la proposition précédente et évite une répétition pesante.
- source_word: παντὶ ... ᾧ ἐδόθη πολύ
  choice: de toute personne à qui beaucoup a été donné
  rationale: Cette formulation rend le datif et prépare naturellement le complément de l’exigence, tout en conservant le passif sans nommer le donateur.
- source_word: πολὺ ζητηθήσεται παρ’ αὐτοῦ
  choice: on exigera beaucoup de toute personne
  rationale: Dans ce contexte de responsabilité, ζητέω au passif a le sens d’exiger ou de réclamer. La construction française impersonnelle exprime le passif grec avec naturel.
- source_word: παρέθεντο
  choice: l’on a beaucoup confié
  rationale: Le moyen pluriel sans sujet exprimé évoque ce qui a été placé sous la responsabilité de quelqu’un. Le « on » indéfini préserve l’absence de sujet explicite.
- source_word: περισσότερον αἰτήσουσιν αὐτόν
  choice: on demandera encore davantage
  rationale: « Demander » maintient la distinction lexicale avec ζητέω rendu par « exiger », tandis que « encore davantage » rend la gradation de περισσότερον.
theological_decisions:
- issue: Nature de l’image du châtiment
  choice: Conserver l’image concrète des « coups » et la gradation « peu ».
  alternative: Employer un terme abstrait comme « châtiment », ou préciser « coups de fouet ».
  rationale: Le propos parabolique associe connaissance, responsabilité et sanction graduée. La traduction garde cette tension sans élaborer une doctrine du jugement ni préciser un mode de châtiment.
- issue: Sujet des verbes dans les deux maximes finales
  choice: Employer le pronom indéfini « on ».
  alternative: Nommer Dieu, le maître ou des responsables humains.
  rationale: 'Le grec emploie des formes sans sujet explicite : passif dans la première maxime et troisième personne du pluriel indéfinie dans la seconde. Le français « on » préserve cette indétermination sans introduire un agent absent du texte.'
- issue: Rapport entre ignorance et responsabilité
  choice: Traduire simplement « celui qui ne savait pas » tout en maintenant qu’il a commis des actes méritant des coups.
  alternative: Parler d’innocence, d’ignorance coupable ou de manque de compréhension.
  rationale: Le texte réduit la sanction sans supprimer la responsabilité. La traduction ne résout pas davantage la relation théologique entre ignorance, faute et jugement.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve le parallélisme de la maxime grecque. « L’on » après « à qui » évite la rencontre peu élégante de deux voyelles et garde le sujet indéfini. Aucun marqueur de note n’est requis puisque le texte ne comporte aucune note.
