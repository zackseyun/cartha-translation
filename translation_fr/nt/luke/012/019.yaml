id: LUK.12.19
reference: Luke 12:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἐρῶ τῇ ψυχῇ μου· Ψυχή, ἔχεις πολλὰ ἀγαθὰ κείμενα εἰς ἔτη πολλά· ἀναπαύου, φάγε, πίε, εὐφραίνου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/019.yaml
  text: And I will say to my soul[a], ‘Soul, you have many good things laid up for many years. Rest, eat, drink[b], be merry.’
translation:
  language: fr
  text: 'Et je dirai à mon âme[a] : « Mon âme, tu as beaucoup de biens en réserve pour de nombreuses années. Repose-toi, mange, bois et réjouis-toi. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « moi » ; selon le contexte, le grec ψυχή peut aussi désigner la vie ou la personne.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐρῶ
  choice: je me dirai
  rationale: Le futur de λέγω est rendu directement. Avec le complément « à mon âme », la tournure pronominale est naturelle en français et exprime clairement le monologue intérieur.
- source_word: τῇ ψυχῇ μου / Ψυχή
  choice: me / Mon âme
  rationale: ψυχή désigne ici la personne intérieure à laquelle l’homme s’adresse. « Mon âme » conserve l’image et la portée littéraire du grec, tandis que « je me dirai » évite la formulation française pesante « je dirai à mon âme ».
- source_word: πολλὰ ἀγαθὰ
  choice: beaucoup de biens
  rationale: Dans le contexte des récoltes mises en réserve, ἀγαθά désigne des ressources matérielles. « Biens » est naturel en français et conserve une portée assez large.
- source_word: κείμενα
  choice: en réserve
  rationale: Le participe de κεῖμαι décrit ici des biens déposés et conservés. « En réserve » rend clairement leur disponibilité durable sans calquer la construction grecque.
- source_word: εἰς ἔτη πολλά
  choice: pour de nombreuses années
  rationale: La locution exprime la durée future envisagée par l’homme; cette traduction est proche du grec et idiomatique.
- source_word: ἀναπαύου
  choice: Repose-toi
  rationale: L’impératif invite à prendre du repos et à vivre sans souci. « Repose-toi » est direct, actuel et digne.
- source_word: φάγε
  choice: mange
  rationale: Impératif simple rendu directement.
- source_word: πίε
  choice: bois
  rationale: Impératif simple rendu directement.
- source_word: εὐφραίνου
  choice: réjouis-toi
  rationale: Le verbe signifie éprouver de la joie ou prendre du bon temps. « Réjouis-toi » conserve cette valeur sans introduire explicitement l’idée plus précise de fête.
theological_decisions:
- issue: Sens de ψυχή dans une adresse à soi-même
  choice: Mon âme
  alternative: Moi-même / ma vie
  rationale: Le passage ne définit pas techniquement la composition de l’être humain; il met en scène un homme qui parle à son être intérieur. « Mon âme » préserve la personnification et la résonance du terme grec, tandis que la note signale son amplitude sémantique.
translation_notes:
  register: Français international moderne, naturel et digne. Le rythme bref des quatre impératifs grecs est conservé; la coordination finale par « et » est idiomatique en français.
