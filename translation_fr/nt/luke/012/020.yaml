    rationale: En français, « redemander » suggère volontiers qu’une même requête est formulée une seconde fois. Le grec ἀπαιτέω exprime ici plutôt le fait d’exiger ou de réclamer, éventuellement comme une reprise. « T’est réclamée » rend mieux cette idée sans ajouter d’agent.
