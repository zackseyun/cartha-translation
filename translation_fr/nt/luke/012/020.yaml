reference: Luke 12:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἶπεν δὲ αὐτῷ ὁ θεός· ⸀Ἄφρων, ταύτῃ τῇ νυκτὶ τὴν ψυχήν σου ⸀ἀπαιτοῦσιν ἀπὸ σοῦ· ἃ δὲ ἡτοίμασας, τίνι ἔσται;
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/020.yaml
  text: But God said to him, ‘Fool! This very night your life is being demanded back from you, and the things you prepared—whose will they be?’
translation:
  language: fr
  text: 'Mais Dieu lui dit : « Insensé ! Cette nuit même, ta vie[a] t’est réclamée. Et ce que tu as préparé, à qui cela appartiendra-t-il ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ton âme ». Le mot grec peut désigner la vie ou l’âme selon le contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄφρων
  choice: Insensé !
  rationale: Le vocatif exprime une réprimande directe. « Insensé » restitue le défaut de discernement visé par le grec dans un registre naturel et digne.
- source_word: ταύτῃ τῇ νυκτί
  choice: Cette nuit même
  rationale: Le démonstratif et l’expression temporelle soulignent l’immédiateté ; « même » rend cette insistance idiomatiquement.
- source_word: ψυχήν
  choice: vie
  rationale: Dans ce contexte de mort imminente, ψυχή désigne avant tout la vie de l’homme. Le sens possible de « âme » est conservé en note.
- source_word: ἀπαιτοῦσιν ἀπὸ σοῦ
  choice: t’est redemandée
  rationale: Le passif impersonnel français rend le pluriel grec à sujet non exprimé sans inventer d’agents. « Redemandée » conserve la nuance possible de restitution attachée à ἀπαιτέω.
- source_word: ἃ δὲ ἡτοίμασας
  choice: Et ce que tu as préparé
  rationale: Cette formulation reste proche du relatif neutre grec tout en étant naturelle en français ; le contexte indique qu’il s’agit des biens accumulés.
- source_word: τίνι ἔσται
  choice: à qui cela appartiendra-t-il ?
  rationale: Le datif interrogatif exprime ici la possession ou la destination. Cette question préserve la portée rhétorique du grec.
theological_decisions:
- issue: Sens de ψυχή dans le contexte de la mort
  choice: vie
  alternative: âme
  rationale: « Vie » correspond au contexte immédiat sans imposer une conception anthropologique plus étroite. La note maintient l’autre sens lexical et la tension interprétative.
- issue: Sujet non exprimé de ἀπαιτοῦσιν
  choice: 'passif impersonnel : « t’est redemandée »'
  alternative: « on te redemande » ou un sujet explicite tel que « ils te redemandent »
  rationale: Le grec emploie un pluriel sans identifier les agents. Le passif évite de préciser ce que le texte laisse indéterminé.
translation_notes:
  register: Français international moderne, direct et digne. Le tutoiement correspond à l’adresse personnelle du grec. La ponctuation met en valeur la réprimande et l’urgence sans alourdir la phrase.
