review_pass:
  verdict: revise
  source_fidelity: 'Le sens fondamental est bien rendu : Dieu s’adresse directement à l’homme, l’imminence de « cette nuit même » est conservée, ψυχή est justement traduit par « vie », et la question finale porte sur la possession des biens. Le pluriel grec non spécifié de ἀπαιτοῦσιν ne doit pas recevoir d’agent explicite.'
  naturalness: « Cette nuit même » et « à qui cela appartiendra-t-il ? » sont naturels en français international moderne. En revanche, « ta vie t’est redemandée » est un peu lourd et peut évoquer une demande répétée plutôt que l’idée de réclamation/exigence. « Ta vie t’est réclamée » est plus idiomatique et conserve l’indétermination de l’agent.
  terminology: « Insensé ! » est un équivalent digne et exact de Ἄφρων. « Vie », avec la note « âme », respecte le contexte immédiat et la polysémie de ψυχή sans imposer une lecture anthropologique. « Réclamée » restitue convenablement la force de ἀπαιτέω, qui peut exprimer l’exigence ou la reprise.
  issues:
