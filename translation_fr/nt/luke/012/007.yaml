id: LUK.12.7
reference: Luke 12:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀλλὰ καὶ αἱ τρίχες τῆς κεφαλῆς ὑμῶν πᾶσαι ἠρίθμηνται· ⸀μὴ φοβεῖσθε· πολλῶν στρουθίων διαφέρετε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/007.yaml
  text: But even the hairs of your head have all been counted[a]. Do not fear[b]; you are worth more than many sparrows.
translation:
  language: fr
  text: 'Mais même les cheveux de votre tête sont tous comptés. N’ayez pas peur : vous valez plus que beaucoup de moineaux.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλλὰ καὶ
  choice: Mais même
  rationale: Rend à la fois le contraste introduit par ἀλλά et la valeur intensive de καί, en reliant cette assurance à l’exemple précédent des moineaux.
- source_word: αἱ τρίχες τῆς κεφαλῆς ὑμῶν
  choice: les cheveux de votre tête
  rationale: Expression française naturelle et digne qui conserve l’image concrète et la construction possessive du grec.
- source_word: πᾶσαι ἠρίθμηνται
  choice: sont tous comptés
  rationale: Le parfait passif exprime un dénombrement accompli dont le résultat demeure. Le présent passif français communique naturellement cet état résultant, tandis que « tous » conserve la portée exhaustive de πᾶσαι.
- source_word: μὴ φοβεῖσθε
  choice: N’ayez pas peur
  rationale: Formulation idiomatique et directe en français moderne pour l’impératif négatif grec, sans atténuer l’exhortation.
- source_word: πολλῶν στρουθίων
  choice: beaucoup de moineaux
  rationale: Conserve l’oiseau précis évoqué dans le contexte immédiat et rend naturellement le génitif comparatif.
- source_word: διαφέρετε
  choice: vous valez plus que
  rationale: Dans ce contexte, le verbe exprime une supériorité de valeur, et non une simple différence. Cette formulation est claire et courante en français.
theological_decisions:
- issue: Comparaison de la valeur des disciples avec celle des moineaux
  choice: vous valez plus que beaucoup de moineaux
  alternative: vous avez plus de valeur que beaucoup de moineaux
  rationale: La formulation garde l’argument du moindre au plus grand sur les soins attentifs de Dieu, sans étendre l’affirmation au-delà de la comparaison faite dans le texte.
translation_notes:
  register: Français international moderne, simple et digne. Le pluriel « vous » est conservé dans tout le verset. « N’ayez pas peur » est préféré au plus littéraire « Ne craignez pas », et « sont tous comptés » garde l’image du dénombrement précis ainsi que l’état résultant du parfait grec.
