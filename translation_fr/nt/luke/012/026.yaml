id: LUK.12.26
reference: Luke 12:26
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἰ οὖν ⸀οὐδὲ ἐλάχιστον δύνασθε, τί περὶ τῶν λοιπῶν μεριμνᾶτε;
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/026.yaml
  text: If[a], then, you are not able to do even the smallest thing, why are you anxious about the rest?
translation:
  language: fr
  text: Si donc vous ne pouvez pas même faire la moindre chose, pourquoi vous inquiétez-vous du reste ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰ οὖν
  choice: Si donc
  rationale: Conserve à la fois la condition exprimée par εἰ et le lien déductif marqué par οὖν, dans une formulation française naturelle.
- source_word: οὐδὲ ἐλάχιστον
  choice: pas même accomplir la plus petite chose
  rationale: ἐλάχιστον est un neutre substantivé désignant la chose ou l'affaire la plus petite. « La plus petite chose » explicite naturellement l'ellipse en français.
- source_word: δύνασθε
  choice: vous ne pouvez pas… accomplir
  rationale: Rend directement l'idée de capacité de δύναμαι. « Accomplir » fournit le verbe requis en français sans préciser davantage la nature de l'action.
- source_word: τί
  choice: pourquoi
  rationale: Dans cette interrogation rhétorique, τί demande la raison et se rend idiomatiquement par « pourquoi ».
- source_word: περὶ τῶν λοιπῶν
  choice: du reste
  rationale: « Du reste » désigne avec concision les autres choses ou affaires évoquées après « la plus petite chose » et maintient le rapport logique entre les deux expressions.
- source_word: μεριμνᾶτε
  choice: vous inquiétez-vous
  rationale: μεριμνάω exprime ici l'inquiétude qui occupe l'esprit. Cette traduction convient au contexte tout en évitant le sens clinique que pourrait parfois suggérer « être anxieux ».
theological_decisions:
- issue: Portée de μεριμνάω dans l'enseignement de Jésus sur la confiance en Dieu
  choice: vous inquiétez-vous
  alternative: êtes-vous anxieux / vous souciez-vous
  rationale: Le contexte vise l'inquiétude qui tourmente plutôt que toute prévoyance ou préoccupation responsable. « S'inquiéter » garde cette nuance sans transformer le propos en diagnostic psychologique.
translation_notes:
  register: Français international moderne, clair et digne. La structure conditionnelle et déductive du grec est conservée. L'interrogation demeure rhétorique, sans résoudre l'ambiguïté référentielle de « la plus petite chose » et « le reste ».
