- from: 'Je vous le dis : toute personne qui se déclarera pour moi devant les hommes[a], le Fils de l’homme se déclarera lui aussi pour elle devant les anges de Dieu.'
  to: 'Je vous le dis : toute personne qui me reconnaîtra devant les gens, le Fils de l’homme la reconnaîtra lui aussi devant les anges de Dieu.'
  rationale: La révision remplace une expression de soutien partisan par « reconnaître », qui rend la reconnaissance publique exprimée par ὁμολογέω dans les deux membres de la phrase. Elle emploie « les gens » pour le sens humain générique de ἀνθρώπων et supprime ainsi une note devenue superflue. Le titre « le Fils de l’homme », le futur, le parallélisme et la scène devant les anges de Dieu sont préservés.
