source:
  edition: SBLGNT
  text: Λέγω δὲ ὑμῖν, πᾶς ὃς ἂν ⸀ὁμολογήσῃ ἐν ἐμοὶ ἔμπροσθεν τῶν ἀνθρώπων, καὶ ὁ υἱὸς τοῦ ἀνθρώπου ὁμολογήσει ἐν αὐτῷ ἔμπροσθεν τῶν ἀγγέλων τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/008.yaml
  text: And I tell you[a], everyone who confesses me before men, the Son of Man also will confess before the angels of God.
translation:
  language: fr
  text: 'Je vous le dis : toute personne qui me reconnaîtra devant les gens, le Fils de l’homme la reconnaîtra lui aussi devant les anges de Dieu.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Λέγω δὲ ὑμῖν
  choice: Je vous le dis
  rationale: Cette formule rend l’affirmation solennelle de Jésus. Le δέ, faiblement connectif, n’exige pas ici un « mais » contrastif en français.
- source_word: πᾶς ὃς ἂν
  choice: toute personne qui
  rationale: La tournure grecque exprime une condition générale de portée universelle. « Toute personne qui » est naturel et explicitement inclusif en français moderne.
- source_word: ὁμολογήσῃ ἐν ἐμοὶ
  choice: se déclarera pour moi
  rationale: Avec ἐν et le datif, ὁμολογέω désigne ici une reconnaissance publique en faveur de Jésus. « Se déclarer pour » restitue cette idée sans le calque peu naturel « confesser en moi ».
- source_word: ἔμπροσθεν τῶν ἀνθρώπων
  choice: devant les hommes
  rationale: « Devant » rend directement ἔμπροσθεν. Le pluriel ἀνθρώπων désigne ici les êtres humains en général; une note en précise la portée afin d’éviter une lecture exclusivement masculine.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: le Fils de l’homme
  rationale: Cette désignation de Jésus est conservée sous sa forme consacrée afin d’en préserver les résonances scripturaires et théologiques.
- source_word: ὁμολογήσει ἐν αὐτῷ
  choice: se déclarera lui aussi pour elle
  rationale: La reprise du même verbe est rendue par la même expression, ce qui maintient la réciprocité entre la déclaration humaine et celle du Fils de l’homme. Le pronom « elle » reprend grammaticalement « toute personne » sans préciser le sexe.
- source_word: ἔμπροσθεν τῶν ἀγγέλων τοῦ θεοῦ
  choice: devant les anges de Dieu
  rationale: Traduction directe qui conserve le caractère public et céleste de la scène.
theological_decisions:
- issue: La formule réciproque ὁμολογέω avec ἐν suivi du datif
  choice: se déclarera pour moi … se déclarera lui aussi pour elle
  alternative: me reconnaîtra … la reconnaîtra; confessera en moi … confessera en elle
  rationale: Le grec peut être rendu par une reconnaissance ou une déclaration publique. « Se déclarer pour » demeure idiomatique en français, conserve la symétrie des deux propositions et n’ajoute aucune précision doctrinale absente du texte.
- issue: La portée de ἀνθρώπων
  choice: les hommes, au sens représentatif de l’humanité
  alternative: les gens; les êtres humains
  rationale: La forme masculine plurielle du grec est conservée dans l’expression française traditionnelle, tandis qu’une note indique clairement qu’elle englobe ici toutes les personnes.
translation_notes:
  register: Français moderne, digne et accessible. La phrase garde le parallélisme solennel du grec. « Se déclarer pour » exprime une prise de position publique et évite à la fois le calque « confesser en » et une paraphrase doctrinalement chargée.
