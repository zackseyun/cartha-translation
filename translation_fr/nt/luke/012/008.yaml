review_pass:
  verdict: revise
  source_fidelity: La structure réciproque et le cadre public/céleste sont bien rendus. Toutefois, « se déclarer pour moi » tend en français à signifier prendre parti pour quelqu’un ou soutenir sa cause, alors que ὁμολογέω avec ἐν + datif exprime ici l’aveu/la reconnaissance publique de Jésus, puis la reconnaissance correspondante de la personne par le Fils de l’homme. « Reconnaître » transmet ce sens plus directement et conserve la symétrie verbale.
  naturalness: La phrase révisée est naturelle en français international moderne. « Devant les gens » rend sans ambiguïté le sens générique de τῶν ἀνθρώπων et évite que « les hommes » soit spontanément compris comme un groupe masculin dans l’usage actuel.
  terminology: « Le Fils de l’homme » doit être conservé comme titre établi. « Reconnaître » convient ici mieux que « se déclarer pour », sans imposer d’interprétation doctrinale supplémentaire.
  issues:
  - severity: medium
    issue: « se déclarera pour moi » / « se déclarera ... pour elle »
    rationale: Cette formulation peut évoquer le fait de prendre le parti de quelqu’un plutôt que de le reconnaître ou de l’avouer publiquement. Elle affaiblit la portée précise de ὁμολογέω et rend la réciprocité moins nette.
  - severity: low
    issue: « les hommes » et la note d’inclusivité
    rationale: Le grec ἀνθρώπων désigne ici les êtres humains en général; le français moderne peut le rendre directement par « les gens ». Cela rend la note explicative inutile et évite une formulation dont la lecture masculine est aujourd’hui possible.
