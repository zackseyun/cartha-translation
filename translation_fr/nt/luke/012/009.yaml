id: LUK.12.9
reference: Luke 12:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ δὲ ἀρνησάμενός με ἐνώπιον τῶν ἀνθρώπων ἀπαρνηθήσεται ἐνώπιον τῶν ἀγγέλων τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/009.yaml
  text: But the one who denies me before men will be denied before the angels of God[a][b].
translation:
  language: fr
  text: Mais celui qui me renie devant les êtres humains sera renié devant les anges de Dieu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sera désavoué » ; le verbe grec est apparenté à celui traduit par « renie », mais peut avoir une nuance plus forte.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρνησάμενός
  choice: celui qui me renie
  rationale: Le participe aoriste substantivé exprime ici, dans une maxime générale, « celui qui renie ». Le présent français est naturel et conserve le lien verbal avec le futur passif.
- source_word: ἐνώπιον
  choice: devant
  rationale: Rendu idiomatique et concis qui préserve l'idée d'une déclaration publique ou faite en présence de témoins.
- source_word: τῶν ἀνθρώπων
  choice: les êtres humains
  rationale: Le terme désigne ici l'humanité par contraste avec les anges de Dieu. « Les êtres humains » est précis et inclusif, sans suggérer seulement les personnes de sexe masculin.
- source_word: ἀπαρνηθήσεται
  choice: sera renié
  rationale: Le futur passif conserve la réciprocité solennelle « renie… sera renié » et ne précise pas l'agent que le grec laisse sous-entendu. Le préverbe peut donner une nuance plus forte, signalée en note.
- source_word: τῶν ἀγγέλων τοῦ θεοῦ
  choice: les anges de Dieu
  rationale: Cette formulation transparente conserve la construction et la cadence du grec.
- source_word: δὲ
  choice: Mais
  rationale: La conjonction marque le contraste avec la déclaration positive du verset précédent.
theological_decisions:
- issue: Identité de l'agent sous-entendu de « sera renié »
  choice: Conserver le passif sans ajouter d'agent explicite.
  alternative: Préciser « sera renié par le Fils de l'homme » ou comprendre un passif divin renvoyant à Dieu.
  rationale: Le grec ne nomme pas l'agent. Le contexte peut orienter l'interprétation, mais l'ajouter résoudrait une tension que le verset maintient.
translation_notes:
  register: Français moderne, international et digne. « Les êtres humains » traduit explicitement le contraste entre l'humanité et les anges, tandis que la répétition « renie… sera renié » préserve la force rhétorique de l'original.
