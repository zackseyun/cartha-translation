id: LUK.12.10
reference: Luke 12:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ πᾶς ὃς ἐρεῖ λόγον εἰς τὸν υἱὸν τοῦ ἀνθρώπου, ἀφεθήσεται αὐτῷ τῷ δὲ εἰς τὸ ἅγιον πνεῦμα βλασφημήσαντι οὐκ ἀφεθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/010.yaml
  text: And everyone who speaks a word against the Son of Man[a], it will be forgiven him[b]; but the one who blasphemes against the Holy Spirit will not be forgiven.
translation:
  language: fr
  text: Et quiconque dira une parole contre le Fils de l’homme[a], il lui sera pardonné[b] ; mais il ne sera pas pardonné à celui qui blasphème contre l’Esprit saint.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « toute personne qui prononcera une parole contre le Fils de l’homme ».'
    reason: lexical_alternative
  - marker: b
    text: Le grec dit littéralement « il lui sera pardonné » ; la faute ou la parole offensante est sous-entendue comme ce qui est pardonné.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς ὃς
  choice: quiconque
  rationale: Cette construction distributive et générale désigne toute personne concernée. « Quiconque » est naturel en français soutenu courant et conserve la portée universelle.
- source_word: ἐρεῖ λόγον
  choice: dira une parole
  rationale: Le futur est conservé et λόγον est rendu explicitement par « une parole », sans réduire l’expression au simple verbe « parler ».
- source_word: εἰς
  choice: contre
  rationale: Dans ce contexte de parole hostile et de blasphème, la préposition exprime l’opposition et se rend naturellement par « contre ».
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: le Fils de l’homme
  rationale: Cette formulation consacrée préserve le titre, son arrière-plan sémitique et sa portée christologique sans l’interpréter davantage.
- source_word: ἀφεθήσεται αὐτῷ
  choice: il lui sera pardonné
  rationale: La tournure impersonnelle française rend le passif grec et son bénéficiaire au datif, tandis que la faute pardonnée demeure sous-entendue comme dans le texte source.
- source_word: τῷ ... βλασφημήσαντι
  choice: à celui qui blasphème
  rationale: Le participe substantivé désigne la personne qui commet le blasphème. Le présent français exprime naturellement la portée générale de l’énoncé sans imposer une nuance temporelle étrangère.
- source_word: τὸ ἅγιον πνεῦμα
  choice: l’Esprit saint
  rationale: Formulation française contemporaine et reconnue pour désigner l’Esprit divin.
- source_word: οὐκ ἀφεθήσεται
  choice: il ne sera pas pardonné
  rationale: La négation et le futur passif sont conservés directement, avec une tournure impersonnelle naturelle en français.
theological_decisions:
- issue: Contraste entre une parole contre le Fils de l’homme et le blasphème contre l’Esprit saint
  choice: Maintenir sans explication le contraste établi par le verset entre ce qui sera pardonné et ce qui ne le sera pas.
  alternative: Définir dans la traduction le blasphème comme une ignorance moindre, une impénitence finale ou une autre notion doctrinale précise.
  rationale: Le texte énonce le contraste, mais n’en explique pas ici le mécanisme. La traduction préserve donc la tension théologique sans harmonisation ni développement interprétatif.
translation_notes:
  register: Français international moderne, digne et accessible. « Quiconque » et la tournure impersonnelle « il lui sera pardonné » gardent une légère solennité adaptée à l’énoncé tout en restant compréhensibles. La symétrie des deux propositions est préservée.
