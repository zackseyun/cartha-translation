id: LUK.12.32
reference: Luke 12:32
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Μὴ φοβοῦ, τὸ μικρὸν ποίμνιον, ὅτι εὐδόκησεν ὁ πατὴρ ὑμῶν δοῦναι ὑμῖν τὴν βασιλείαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/032.yaml
  text: Do not fear[a], little flock[c][b], because your Father was pleased to give you the kingdom.
translation:
  language: fr
  text: N’aie pas peur[a], petit troupeau[b], car votre Père a trouvé bon de vous donner le royaume[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ne crains pas. »'
    reason: lexical_alternative
  - marker: b
    text: L’expression peut aussi se comprendre comme « troupeau peu nombreux » ; « petit troupeau » conserve également la nuance affectueuse.
    reason: lexical_alternative
  - marker: c
    text: Le mot traduit par « royaume » peut aussi signifier « règne », en mettant l’accent sur l’exercice de l’autorité royale de Dieu aussi bien que sur le domaine accordé à son peuple.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ φοβοῦ
  choice: N’aie pas peur
  rationale: L’impératif présent avec μή exprime ici une exhortation négative directe. « N’aie pas peur » est naturel en français moderne et conserve l’adresse au singulier faite au troupeau comme ensemble.
- source_word: τὸ μικρὸν ποίμνιον
  choice: petit troupeau
  rationale: ποίμνιον désigne un troupeau, notamment de brebis, et μικρόν le qualifie de petit. Cette traduction préserve à la fois la métaphore pastorale et la nuance affectueuse.
- source_word: ὅτι
  choice: car
  rationale: ὅτι introduit la raison de ne pas avoir peur. « Car » exprime clairement ce lien causal dans un registre digne et courant.
- source_word: εὐδόκησεν
  choice: a trouvé bon
  rationale: Cette expression rend l’idée de volonté favorable et de bon plaisir sans transformer le verbe en formulation technique sur un décret ni accentuer excessivement l’émotion.
- source_word: ὁ πατὴρ ὑμῶν
  choice: votre Père
  rationale: Le grec dit simplement « votre Père ». La majuscule de respect identifie naturellement Dieu sans ajouter « céleste », absent du texte.
- source_word: δοῦναι ὑμῖν
  choice: de vous donner
  rationale: L’infinitif de δίδωμι avec le pronom au datif se rend directement et naturellement par « vous donner ».
- source_word: τὴν βασιλείαν
  choice: le royaume
  rationale: βασιλεία peut désigner aussi bien la royauté exercée que le domaine royal. « Le royaume » conserve l’expression biblique familière et sa largeur de sens, sans ajouter « de Dieu », qui n’est pas explicite ici.
theological_decisions:
- issue: Nuance de βασιλεία
  choice: le royaume
  alternative: le règne
  rationale: « Royaume » laisse ouvertes les dimensions complémentaires du domaine accordé au peuple de Dieu et de l’autorité royale de Dieu. La note signale « règne » sans réduire le terme à une seule dimension.
- issue: Portée de εὐδόκησεν concernant la volonté divine
  choice: a trouvé bon
  alternative: a bien voulu
  rationale: La formulation exprime l’initiative bienveillante du Père sans importer une terminologie doctrinale plus technique ni présenter le verbe comme une simple permission.
translation_notes:
  register: Français international moderne, naturel et digne. Le singulier « N’aie » correspond à l’adresse au troupeau pris collectivement, tandis que « votre » et « vous » conservent le pluriel grec visant les disciples. La métaphore pastorale et l’ambiguïté théologique de βασιλεία sont maintenues.
