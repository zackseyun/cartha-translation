id: LUK.12.36
reference: Luke 12:36
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ὑμεῖς ὅμοιοι ἀνθρώποις προσδεχομένοις τὸν κύριον ἑαυτῶν πότε ἀναλύσῃ ἐκ τῶν γάμων, ἵνα ἐλθόντος καὶ κρούσαντος εὐθέως ἀνοίξωσιν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/036.yaml
  text: And you, be like men waiting for their lord when he returns from the wedding feast, so that when he comes and knocks, they may open to him at once.
translation:
  language: fr
  text: Vous aussi, soyez semblables à des hommes qui attendent leur maître à son retour du festin de noces, afin que, lorsqu’il viendra et frappera, ils lui ouvrent aussitôt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ ὑμεῖς
  choice: Vous aussi
  rationale: Rend naturellement en français la coordination et l’insistance sur « vous ».
- source_word: προσδεχομένοις
  choice: qui attendent
  rationale: Exprime l’attente vigilante indiquée par le participe, sans ajouter une nuance absente du texte.
- source_word: τὸν κύριον ἑαυτῶν
  choice: leur maître
  rationale: Dans cette scène domestique, « maître » exprime clairement le rapport entre les serviteurs et le chef de maison, sans imposer ici le titre divin « Seigneur ».
- source_word: πότε ἀναλύσῃ ἐκ τῶν γάμων
  choice: à son retour du festin de noces
  rationale: ἀναλύω désigne ici le retour ou le départ depuis les noces; le contexte exige l’idée du retour auprès des serviteurs. Le pluriel γάμοι peut désigner les réjouissances ou le festin de noces.
- source_word: εὐθέως ἀνοίξωσιν αὐτῷ
  choice: lui ouvrir aussitôt
  rationale: Conserve la position sémantiquement forte de l’immédiateté et l’objet indirect « à lui ».
theological_decisions:
- issue: Valeur de κύριος dans la comparaison
  choice: leur maître
  alternative: leur seigneur
  rationale: Le référent immédiat est le maître humain attendu par ses serviteurs. « Maître » garde le sens narratif sans nier la portée figurée de la comparaison ni transformer prématurément le nom commun en titre christologique explicite.
translation_notes:
  register: Français international moderne, fluide et digne. La syntaxe conserve la comparaison, l’attente, le retour des noces et l’ouverture immédiate à l’arrivée du maître.
