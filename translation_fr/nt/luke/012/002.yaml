  variant: modern international French
source:
  edition: SBLGNT
  text: οὐδὲν δὲ συγκεκαλυμμένον ἐστὶν ὃ οὐκ ἀποκαλυφθήσεται, καὶ κρυπτὸν ὃ οὐ γνωσθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/002.yaml
  text: But nothing is covered up that will not be revealed[c][b][a], and hidden that will not be known.
translation:
  language: fr
  text: Mais il n’y a rien de voilé qui ne sera révélé, ni rien de caché qui ne sera connu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cette parole peut désigner toute mise au jour future, que ce soit dans le présent ou lors du jugement final.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐδὲν
  choice: il n’y a rien
  rationale: Cette tournure française naturelle rend la négation absolue du pronom grec neutre.
- source_word: δὲ
  choice: Mais
  rationale: Le connecteur marque ici une légère opposition ou progression par rapport au contexte précédent.
- source_word: συγκεκαλυμμένον
  choice: voilé
  rationale: Le participe parfait passif décrit ce qui se trouve dans un état de dissimulation; « voilé » conserve l’image concrète du recouvrement sans la lourdeur de « couvert ».
- source_word: ἀποκαλυφθήσεται
  choice: sera révélé
  rationale: Le futur passif exprime la révélation ultérieure et forme un contraste lexical net avec « voilé ».
- source_word: κρυπτὸν
  choice: caché
  rationale: Ce terme courant restitue directement l’idée de ce qui échappe actuellement aux regards ou à la connaissance.
- source_word: γνωσθήσεται
  choice: sera connu
  rationale: Le futur passif est conservé au plus près, sans préciser l’agent ni le moment où la chose deviendra connue.
- source_word: ὃ οὐκ / ὃ οὐ
  choice: qui ne sera… / qui ne sera…
  rationale: La structure relative négative parallèle du grec est reproduite naturellement en français.
theological_decisions:
- issue: Portée et moment de la révélation
  choice: Formulation générale selon laquelle ce qui est actuellement dissimulé finira par être révélé ou connu.
  alternative: Une révélation exclusivement lors du jugement final, ou uniquement la mise au jour présente de l’hypocrisie.
  rationale: Les futurs passifs affirment une révélation à venir sans en fixer le moment; la traduction préserve cette ouverture.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme et les passifs du grec sont conservés; « voilé / révélé » maintient le jeu d’image étymologique, tandis que « caché / connu » rend le second contraste.
