  to: Car, lorsque tu vas avec ton adversaire devant un magistrat, efforce-toi, en chemin, de te libérer de lui[a], de peur qu’il ne te traîne devant le juge, que le juge ne te livre à l’agent d’exécution et que celui-ci ne te jette en prison.
  rationale: La révision limitée de « te dégager de lui » en « te libérer de lui » améliore la fidélité au verbe grec et la lisibilité française. La note maintient l’alternative contextuelle « régler l’affaire », sans la faire entrer de manière interprétative dans le texte principal.
