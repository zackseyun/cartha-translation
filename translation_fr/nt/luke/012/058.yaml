id: LUK.12.58
reference: Luke 12:58
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὡς γὰρ ὑπάγεις μετὰ τοῦ ἀντιδίκου σου ἐπ’ ἄρχοντα, ἐν τῇ ὁδῷ δὸς ἐργασίαν ἀπηλλάχθαι ἀπ’ αὐτοῦ, μήποτε κατασύρῃ σε πρὸς τὸν κριτήν, καὶ ὁ κριτής σε ⸀παραδώσει τῷ πράκτορι, καὶ ὁ πράκτωρ σε ⸀βαλεῖ εἰς φυλακήν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/058.yaml
  text: For as you are going with your accuser before a magistrate[a], make an effort on the way to be released from him, lest he drag you to the judge, and the judge hand you over to the officer, and the officer throw you into prison.
translation:
  language: fr
  text: Car, lorsque tu vas avec ton adversaire devant un magistrat, efforce-toi, en chemin, de te libérer de lui[a], de peur qu’il ne te traîne devant le juge, que le juge ne te livre à l’agent d’exécution et que celui-ci ne te jette en prison.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de régler l’affaire avec lui ». Le grec dit littéralement « d’être libéré de lui » ; dans ce contexte, il s’agit probablement de résoudre le litige avant de comparaître devant le juge.
    reason: alternative lexicale et clarification contextuelle
lexical_decisions:
- source_word: ἀντιδίκου
  choice: adversaire
  rationale: Dans cette scène judiciaire, le mot désigne la partie adverse dans un litige. « Adversaire » est naturel en français et n’impose pas à tort le cadre plus étroit d’une accusation pénale.
- source_word: ἄρχοντα
  choice: magistrat
  rationale: Le contexte donne ici au terme général désignant une autorité un sens civique et judiciaire. « Magistrat » rend clairement cette fonction.
- source_word: δὸς ἐργασίαν
  choice: efforce-toi
  rationale: Cette expression idiomatique appelle une démarche active et pressante. « Efforce-toi » en restitue la force dans un français actuel et concis.
- source_word: ἀπηλλάχθαι ἀπ’ αὐτοῦ
  choice: te dégager de lui
  rationale: Cette formulation reste proche de l’idée d’être délivré ou libéré de la partie adverse et de sa réclamation, sans inscrire directement dans le texte l’interprétation plus précise « régler l’affaire avec lui ».
- source_word: κατασύρῃ
  choice: te traîne
  rationale: Le verbe décrit un déplacement contraint avec une nuance vigoureuse que « traîner » conserve bien.
- source_word: κριτήν / κριτής
  choice: juge
  rationale: « Juge » est le terme français courant et précis dans ce contexte judiciaire.
- source_word: παραδώσει
  choice: te livre
  rationale: « Livrer » exprime le transfert de la personne sous l’autorité de l’agent chargé d’exécuter la décision.
- source_word: πράκτορι / πράκτωρ
  choice: agent d’exécution
  rationale: Le terme désigne l’agent qui exécute la décision judiciaire, notamment par le recouvrement ou la mise en détention. Cette expression évite le caractère trop spécifique de « huissier » tout en étant plus précis que le simple « agent ».
- source_word: βαλεῖ εἰς φυλακήν
  choice: te jette en prison
  rationale: « Jeter en prison » conserve la vigueur de βάλλω et demeure une expression française naturelle.
- source_word: ὡς γὰρ
  choice: Car lorsque
  rationale: « Car » maintient le lien explicatif de γάρ, tandis que « lorsque » introduit naturellement en français la situation illustrative exprimée par ὡς.
- source_word: ἐν τῇ ὁδῷ
  choice: en chemin
  rationale: L’expression rend à la fois le déplacement concret et l’urgence d’agir avant d’arriver devant le juge.
theological_decisions:
- issue: Degré d’explicitation théologique de l’exhortation judiciaire
  choice: Conserver l’image judiciaire sans identifier explicitement ses personnages à des réalités spirituelles.
  alternative: Présenter directement le propos comme un appel à se réconcilier avec Dieu avant le jugement final.
  rationale: Le contexte plus large peut suggérer une portée eschatologique, mais le verset lui-même demeure formulé comme une scène judiciaire. La traduction préserve donc cette image et laisse son application théologique au contexte.
- issue: Sens de la délivrance à l’égard de la partie adverse
  choice: Employer « te dégager de lui » dans le texte et signaler en note le règlement amiable probable.
  alternative: Traduire directement « régler l’affaire avec lui » ou « trouver un accord avec lui ».
  rationale: Le grec dit littéralement être délivré ou libéré de lui. Dans le contexte, un arrangement avant le procès est vraisemblable, mais l’intégrer sans indication supprimerait la légère indétermination de la formulation source.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement singulier suit les formes grecques de deuxième personne. La phrase conserve l’enchaînement pressant de la scène judiciaire, avec une syntaxe naturelle en français.
