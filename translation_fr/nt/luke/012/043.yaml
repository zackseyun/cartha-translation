id: LUK.12.43
reference: Luke 12:43
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: μακάριος ὁ δοῦλος ἐκεῖνος, ὃν ἐλθὼν ὁ κύριος αὐτοῦ εὑρήσει ποιοῦντα οὕτως·
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/043.yaml
  text: Blessed is that servant whom his master[a], when he comes, will find doing thus.
translation:
  language: fr
  text: Heureux ce serviteur que son maître[a], à son arrivée, trouvera en train d’agir ainsi !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Seigneur ». Le mot grec peut désigner le « maître » dans le cadre domestique de la parabole ou le « Seigneur » si l’on considère son application plus large.
    reason: alternative_reading
lexical_decisions:
- source_word: μακάριος
  choice: Heureux
  rationale: Formule naturelle des béatitudes en français biblique moderne ; elle exprime une condition digne d’approbation et de faveur, sans réduire le sens à une émotion passagère.
- source_word: δοῦλος
  choice: serviteur
  rationale: Dans cette parabole domestique, le terme désigne une personne placée sous l’autorité d’un maître. « Serviteur » rend clairement sa fonction, tandis que « esclave » mettrait ici au premier plan un aspect qui n’est pas l’objet de la comparaison.
- source_word: ἐκεῖνος
  choice: ce
  rationale: Le démonstratif singularise et met en relief le serviteur dont il est question.
- source_word: κύριος
  choice: maître
  rationale: Dans l’image immédiate de la maisonnée, le mot désigne le supérieur du serviteur. « Maître » exprime naturellement cette relation en français ; la possible résonance de « Seigneur » est conservée en note.
- source_word: ἐλθὼν
  choice: à son arrivée
  rationale: Le participe aoriste a ici une valeur temporelle. Cette formulation française fluide conserve le rapport entre l’arrivée du maître et ce qu’il constatera.
- source_word: εὑρήσει
  choice: trouvera
  rationale: Le futur de l’indicatif est rendu directement par le futur simple français.
- source_word: ποιοῦντα οὕτως
  choice: en train d’agir ainsi
  rationale: La tournure exprime que le maître surprend le serviteur occupé à adopter la conduite décrite précédemment. « Ainsi » conserve le renvoi de οὕτως au contexte antérieur.
theological_decisions:
- issue: Résonance christologique possible de κύριος dans une parabole évoquant le retour du maître
  choice: « maître » dans le texte principal
  alternative: « Seigneur »
  rationale: Le sens de surface est celui du maître d’une maisonnée revenant auprès de son serviteur. Le contexte plus large peut cependant évoquer le retour du Seigneur ; cette tension est donc signalée en note plutôt que tranchée silencieusement.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation garde la cadence d’une béatitude, évite le littéralisme pesant et préserve en note l’ambiguïté théologique de κύριος.
