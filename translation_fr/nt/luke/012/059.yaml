id: LUK.12.59
reference: Luke 12:59
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: λέγω σοι, οὐ μὴ ἐξέλθῃς ἐκεῖθεν ἕως ⸂καὶ τὸ⸃ ἔσχατον λεπτὸν ἀποδῷς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/059.yaml
  text: I tell you[a], you will certainly not get out of there until you have paid even the last lepton.
translation:
  language: fr
  text: 'Je te le dis : tu ne sortiras certainement pas de là avant d’avoir payé jusqu’au tout dernier lepton[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « la toute dernière petite pièce ». Le grec λεπτόν désigne une monnaie de très faible valeur.'
    reason: Alternative lexicale et précision historique.
lexical_decisions:
- source_word: λέγω σοι
  choice: Je te le dis
  rationale: Formule naturelle d’adresse directe en français moderne, qui conserve le présent et le pronom singulier.
- source_word: οὐ μὴ ἐξέλθῃς
  choice: tu ne sortiras certainement pas
  rationale: La construction οὐ μή avec le subjonctif aoriste exprime une négation future emphatique ; « certainement pas » en restitue la force sans archaïsme.
- source_word: ἐκεῖθεν
  choice: de là
  rationale: Rend simplement et idiomatiquement l’idée de sortir depuis ce lieu.
- source_word: ἕως
  choice: avant d’avoir
  rationale: Dans cette phrase négative, cette tournure française exprime naturellement la limite temporelle introduite par ἕως et l’achèvement préalable du paiement.
- source_word: καὶ τὸ ἔσχατον
  choice: jusqu’au dernier
  rationale: La tournure « jusqu’au dernier » transmet l’accent intensif de καί et l’idée d’un paiement intégral.
- source_word: λεπτόν
  choice: lepton
  rationale: Le terme conserve la précision historique de la très petite monnaie grecque ; une note en explique le sens.
- source_word: ἀποδῷς
  choice: avoir payé
  rationale: Le parfait infinitif français marque que le paiement doit être entièrement accompli avant la sortie et convient au contexte de dette.
theological_decisions:
- issue: Nature de l’image de la dette et de la prison
  choice: Conserver l’image sans préciser son référent théologique
  alternative: L’interpréter explicitement comme une conséquence judiciaire terrestre, le jugement divin ou une peine purgatoire
  rationale: Le verset évoque la détention jusqu’au paiement complet, mais n’identifie pas explicitement ce que cette image représente. La traduction préserve donc cette tension sans importer une conclusion doctrinale ultérieure.
translation_notes:
  register: Français international moderne, direct et digne. Le tutoiement singulier reflète σοι. La formulation évite à la fois l’archaïsme et toute explicitation doctrinale étrangère au verset.
