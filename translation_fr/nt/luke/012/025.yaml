id: LUK.12.25
reference: Luke 12:25
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τίς δὲ ἐξ ὑμῶν μεριμνῶν δύναται ⸂ἐπὶ τὴν ἡλικίαν αὐτοῦ προσθεῖναι⸃ ⸀πῆχυν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/025.yaml
  text: And which of you, by worrying, is able to add a cubit to his lifespan?
translation:
  language: fr
  text: Et qui de vous, en se faisant du souci, peut ajouter une coudée à la durée de sa vie ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ajouter une coudée à sa taille ». Le mot grec peut désigner la durée de la vie, l’âge ou la taille.'
    reason: Préserver l'ambiguïté lexicale de ἡλικία et l'image de la coudée.
lexical_decisions:
- source_word: μεριμνῶν
  choice: en se faisant du souci
  rationale: Exprime naturellement en français l'idée de s'inquiéter ou de se préoccuper, dans le contexte de l'enseignement sur les soucis de la vie.
- source_word: δύναται
  choice: peut
  rationale: Équivalent direct et idiomatique de la capacité exprimée par δύναται.
- source_word: ἡλικία
  choice: durée de sa vie
  rationale: ἡλικία peut désigner la taille, l'âge ou la durée de la vie. Avec l'image d'ajouter une coudée, « durée de sa vie » rend ici le sens contextuel probable sans masquer l'autre lecture possible.
- source_word: πῆχυν
  choice: une coudée
  rationale: Conserve la mesure concrète et l'image frappante du texte grec.
theological_decisions:
- issue: Sens de ἡλικία dans la métaphore
  choice: durée de sa vie
  alternative: taille
  rationale: Le contexte immédiat porte sur l'inquiétude et la prolongation de la vie; toutefois, le grec permet aussi de comprendre la stature corporelle. Une note préserve cette ambiguïté réelle.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation interrogative reste proche de la structure grecque; « se faire du souci » est courant sans être familier, et « coudée » conserve l'image ancienne avec son ambiguïté.
