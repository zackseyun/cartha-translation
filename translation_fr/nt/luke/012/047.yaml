source:
  edition: SBLGNT
  text: ἐκεῖνος δὲ ὁ δοῦλος ὁ γνοὺς τὸ θέλημα τοῦ κυρίου ⸀αὐτοῦ καὶ μὴ ἑτοιμάσας ⸀ἢ ποιήσας πρὸς τὸ θέλημα αὐτοῦ δαρήσεται πολλάς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/047.yaml
  text: But that servant[a], who knew his master's will and did not prepare or act according to his will, will be beaten with many blows.
translation:
  language: fr
  text: Mais cet esclave qui connaissait la volonté de son maître et ne s’est pas préparé ou n’a pas agi conformément à sa volonté recevra de nombreux coups.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec laisse sous-entendu le nom auquel se rapporte « nombreux » : probablement « coups ».'
    reason: πολλάς est un adjectif féminin pluriel employé sans nom exprimé; « coups » rend naturellement cette ellipse en français.
lexical_decisions:
- source_word: δοῦλος
  choice: esclave
  rationale: Le terme désigne une personne juridiquement soumise à un maître, et non un simple employé. Dans cette parabole, « esclave » conserve nettement le rapport d’autorité et la possibilité du châtiment.
- source_word: γνοὺς
  choice: qui connaissait
  rationale: Le participe aoriste indique que l’esclave avait connaissance de la volonté de son maître avant de manquer à son devoir. La relative est naturelle en français.
- source_word: θέλημα
  choice: volonté
  rationale: « Volonté » exprime ici ce que le maître veut voir accompli, sans réduire le terme à un ordre explicite ni à un simple souhait.
- source_word: κυρίου αὐτοῦ
  choice: de son maître
  rationale: Dans le cadre domestique de la parabole, κύριος désigne le maître de l’esclave. Ce choix préserve le rapport social sans transformer directement le mot en titre divin.
- source_word: μὴ ἑτοιμάσας
  choice: qui n’a rien préparé
  rationale: Le grec ne précise pas l’objet de la préparation. « N’a rien préparé » rend naturellement cette ellipse en français sans inventer ce qui devait être préparé.
- source_word: ἢ ποιήσας πρὸς τὸ θέλημα αὐτοῦ
  choice: ni agi conformément à sa volonté
  rationale: La tournure française exprime l’action conforme à la volonté du maître. Dans la portée négative de la phrase, « ni » relie naturellement les deux manquements; le ἢ grec peut néanmoins être compris plus littéralement comme « ou ».
- source_word: δαρήσεται πολλάς
  choice: recevra un grand nombre de coups
  rationale: Le futur passif de δέρω annonce un châtiment corporel. πολλάς est féminin pluriel avec un nom sous-entendu, probablement « coups »; la formulation française rend l’image concrète et l’intensité quantitative.
theological_decisions:
- issue: Valeur de κύριος dans le cadre de la parabole
  choice: maître
  alternative: Seigneur
  rationale: Le référent immédiat est le supérieur de l’esclave dans une maison. « Maître » traduit cette relation narrative tout en laissant au lecteur la possibilité de saisir la portée théologique plus large de la parabole.
- issue: Coordination des deux manquements avec ἢ
  choice: ni… ni… dans la portée négative
  alternative: n’a rien préparé ou n’a pas agi conformément à sa volonté
  rationale: Après une négation, le français idiomatique emploie volontiers « ni » pour coordonner les deux actions non accomplies. La forme grecque porte ἢ (« ou »), possibilité signalée en note afin de ne pas effacer l’ambiguïté de la coordination.
- issue: Expression elliptique πολλάς
  choice: un grand nombre de coups
  alternative: sera battu de nombreuses fois
  rationale: Le grec laisse le nom féminin pluriel sous-entendu. « Coups » explicite l’image probable sans transformer la quantité en appréciation abstraite telle que « sévèrement ».
translation_notes:
  register: Français international moderne, clair et digne. « Esclave » conserve la force historique de δοῦλος; « maître » convient au cadre parabolique. La phrase évite les archaïsmes comme « verges » ou « meurtrissures » et maintient l’image concrète du châtiment.
