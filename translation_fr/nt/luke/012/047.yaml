  revision_rationale: La révision conserve les relations essentielles de la parabole et la force concrète du châtiment, tout en traduisant directement la disjonction ἢ par « ou ». Elle évite l’ajout de « rien » et emploie une expression française plus naturelle pour l’ellipse de πολλάς.
