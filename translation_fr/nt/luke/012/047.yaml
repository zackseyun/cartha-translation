review_pass:
  verdict: revise
  source_fidelity: La coordination ἢ doit être rendue par « ou » dans le texte principal. Le rendu actuel « ni » est idiomatique sous une négation, mais neutralise la disjonction explicitement présente dans le grec. « Qui n’a rien préparé » ajoute l’idée de totalité (« rien »), absente du texte, dont l’objet de « préparer » demeure implicite.
  naturalness: « Recevra de nombreux coups » est plus naturel et plus direct, en français moderne, que « recevra un grand nombre de coups ». « Ne s’est pas préparé » est une formulation française fluide pour l’emploi absolu de ἑτοιμάζω dans ce contexte, sans préciser ce qui devait être préparé.
  terminology: « Esclave », « maître » et « volonté » rendent correctement δοῦλος, κύριος et θέλημα dans le cadre parabolique. « De nombreux coups » exprime l’ellipse de πολλάς sans recourir à un archaïsme.
  issues:
  - severity: medium
    issue: La coordination grecque ἢ est rendue par « ni ».
    rationale: Même si « ni… ni… » est possible en français après une négation, ἢ signifie « ou ». Puisque le texte source emploie explicitement une disjonction, le français principal devrait la conserver plutôt que de la reléguer à une note.
  - severity: low
    issue: « N’a rien préparé » renforce l’ellipse du grec.
    rationale: μὴ ἑτοιμάσας signifie qu’il ne s’est pas préparé / n’a pas préparé, sans affirmer explicitement qu’il n’a absolument rien préparé.
  - severity: low
    issue: « Un grand nombre de coups » est moins idiomatique.
    rationale: « De nombreux coups » est la formulation moderne habituelle et conserve la quantité plurielle sous-entendue par πολλάς.
  revised_text: Mais cet esclave qui connaissait la volonté de son maître et ne s’est pas préparé ou n’a pas agi conformément à sa volonté recevra de nombreux coups.[a]
  revised_footnotes:
