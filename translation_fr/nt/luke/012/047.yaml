revisions:
- from: Mais cet esclave qui connaissait la volonté de son maître et qui n’a rien préparé ni agi conformément à sa volonté recevra un grand nombre de coups.[a]
  to: Mais cet esclave qui connaissait la volonté de son maître et ne s’est pas préparé ou n’a pas agi conformément à sa volonté recevra de nombreux coups.[a]
  rationale: La révision conserve les relations essentielles de la parabole et la force concrète du châtiment, tout en traduisant directement la disjonction ἢ par « ou ». Elle évite l’ajout de « rien » et emploie une expression française plus naturelle pour l’ellipse de πολλάς.
