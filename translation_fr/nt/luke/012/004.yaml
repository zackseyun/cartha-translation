id: LUK.12.4
reference: Luke 12:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Λέγω δὲ ὑμῖν τοῖς φίλοις μου, μὴ φοβηθῆτε ἀπὸ τῶν ἀποκτεινόντων τὸ σῶμα καὶ μετὰ ταῦτα μὴ ἐχόντων περισσότερόν τι ποιῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/004.yaml
  text: But I say to you[a], my friends, do not fear those who kill the body and after that have nothing more they can do.
translation:
  language: fr
  text: 'Mais je vous le dis, à vous, mes amis : n’ayez pas peur de ceux qui tuent le corps et qui, après cela, ne peuvent rien faire de plus.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Λέγω δὲ
  choice: Mais je vous le dis
  rationale: δέ marque ici une transition légèrement contrastive dans le discours. « Mais » la rend naturellement sans exagérer l’opposition, et l’ordre français met idiomatiquement en relief l’adresse aux auditeurs.
- source_word: ὑμῖν τοῖς φίλοις μου
  choice: à vous, mes amis
  rationale: 'Le groupe au datif est appositionnel : Jésus s’adresse aux auditeurs en les appelant « mes amis ». La formulation conserve à la fois le pronom et cette désignation affectueuse.'
- source_word: μὴ φοβηθῆτε ἀπὸ
  choice: n’ayez pas peur de
  rationale: Le subjonctif aoriste avec μή exprime une interdiction, tandis que ἀπό introduit l’objet de la peur. « N’ayez pas peur de » est clair, actuel et idiomatique en français.
- source_word: τῶν ἀποκτεινόντων τὸ σῶμα
  choice: ceux qui tuent le corps
  rationale: Le participe présent désigne de manière générale ceux qui tuent, et σῶμα désigne ici le corps physique. La traduction reste proche de la formulation grecque.
- source_word: καὶ μετὰ ταῦτα
  choice: et qui, après cela
  rationale: μετὰ ταῦτα indique la succession temporelle après la mise à mort du corps. La reprise par « qui » rattache clairement la limitation aux mêmes personnes.
- source_word: μὴ ἐχόντων περισσότερόν τι ποιῆσαι
  choice: ne peuvent rien faire de plus
  rationale: Littéralement, ils « n’ont rien de plus à faire »; dans ce contexte, la tournure exprime leur incapacité à agir davantage. Cette formulation française naturelle conserve la limite affirmée par le texte.
theological_decisions:
- issue: Étendue du pouvoir humain après la mort du corps
  choice: Le verset affirme seulement que les persécuteurs humains peuvent tuer le corps, puis ne peuvent rien faire de plus.
  alternative: Préciser par interprétation qu’ils ne peuvent pas tuer l’âme.
  rationale: Le verset suivant développe le contraste avec l’autorité divine, mais le présent verset ne mentionne pas explicitement l’âme. La traduction n’importe donc pas dans cette phrase une précision absente du grec.
translation_notes:
  register: Français international moderne, digne et accessible. « N’ayez pas peur » est plus naturel dans l’usage courant que « ne craignez pas », tout en gardant pleinement la force de l’interdiction. Aucun marqueur de note n’est requis, car aucune note n’est retenue.
