id: LUK.12.41
reference: Luke 12:41
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Εἶπεν ⸀δὲ ὁ Πέτρος· Κύριε, πρὸς ἡμᾶς τὴν παραβολὴν ταύτην λέγεις ἢ καὶ πρὸς πάντας;
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/041.yaml
  text: Then Peter said[a], “Lord, are you telling this parable to us, or also to everyone?”
translation:
  language: fr
  text: 'Alors Pierre dit : « Seigneur, est-ce à nous que tu racontes cette parabole, ou aussi à tout le monde[a] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « à tous ». Le masculin pluriel grec est employé ici de manière générique pour désigner l’ensemble plus large des destinataires.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἶπεν
  choice: dit
  rationale: L’aoriste de λέγω se rend directement par « dit ». La ponctuation suffit à indiquer que les paroles rapportées constituent une question.
- source_word: δὲ
  choice: Alors
  rationale: δέ assure ici la progression du récit et introduit naturellement l’intervention de Pierre.
- source_word: Κύριε
  choice: Seigneur
  rationale: Dans cette adresse directe à Jésus, « Seigneur » conserve le respect exprimé par κύριος ainsi que sa possible portée christologique, sans la préciser davantage.
- source_word: πρὸς ἡμᾶς
  choice: à nous
  rationale: πρός avec l’accusatif indique les destinataires de la parole. La tournure emphatique « est-ce à nous que… » restitue clairement le contraste.
- source_word: τὴν παραβολὴν ταύτην
  choice: cette parabole
  rationale: « Parabole » est le terme français courant et consacré pour ce genre d’enseignement figuré dans les Évangiles.
- source_word: λέγεις
  choice: tu racontes
  rationale: En français, on « raconte » naturellement une parabole. Ce choix exprime ici l’acte de dire ou de présenter ce récit figuré sans changer son contenu.
- source_word: ἢ καὶ
  choice: ou aussi
  rationale: Cette formulation conserve à la fois l’alternative marquée par ἤ et la valeur additive de καί.
- source_word: πρὸς πάντας
  choice: à tout le monde
  rationale: πάντας désigne ici l’ensemble plus large des destinataires. « Tout le monde » rend naturellement en français la portée générique du masculin pluriel grec.
theological_decisions:
- issue: Sens de κύριος dans l’adresse de Pierre à Jésus
  choice: Seigneur
  alternative: Maître
  rationale: « Seigneur » correspond directement au titre κύριος et en préserve la portée possible sans imposer une interprétation christologique plus précise que le texte.
- issue: Portée générique de πάντας
  choice: tout le monde
  alternative: tous
  rationale: Le masculin pluriel grec est employé de façon générique et oppose les disciples au public plus large. « Tout le monde » évite de suggérer que seuls des hommes sont visés.
translation_notes:
  register: Français international moderne, naturel et digne. La structure emphatique de la question conserve le contraste entre « nous » et l’ensemble plus large des destinataires.
