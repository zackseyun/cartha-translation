id: LUK.12.30
reference: Luke 12:30
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ταῦτα γὰρ πάντα τὰ ἔθνη τοῦ κόσμου ⸀ἐπιζητοῦσιν, ὑμῶν δὲ ὁ πατὴρ οἶδεν ὅτι χρῄζετε τούτων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/030.yaml
  text: For all these things the nations of the world seek[a], but your Father knows that you need these things.
translation:
  language: fr
  text: Car les nations du monde[a] recherchent toutes ces choses ; mais votre Père sait que vous en avez besoin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les non-Juifs du monde ». Le terme grec peut désigner les « nations » ou les « non-Juifs ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα ... πάντα
  choice: toutes ces choses
  rationale: Le démonstratif neutre pluriel avec πᾶς renvoie aux nécessités matérielles évoquées dans le contexte et les exprime explicitement.
- source_word: τὰ ἔθνη τοῦ κόσμου
  choice: les nations du monde
  rationale: Cette formulation conserve le sens premier et l'ampleur de ἔθνη, sans réduire d'emblée le terme aux seuls non-Juifs.
- source_word: ἐπιζητοῦσιν
  choice: recherchent
  rationale: « Rechercher » exprime une poursuite active et soutenue, tout en restant naturel en français contemporain.
- source_word: ὑμῶν ... ὁ πατήρ
  choice: votre Père
  rationale: La traduction respecte exactement la relation possessive du grec, sans ajouter « céleste », absent de ce verset.
- source_word: οἶδεν
  choice: sait
  rationale: Bien que de forme parfaite, οἶδα a ici un sens présent ; « sait » est la formulation française naturelle.
- source_word: χρῄζετε τούτων
  choice: vous en avez besoin
  rationale: Cette tournure idiomatique rend clairement le besoin et reprend sans lourdeur les choses déjà nommées.
theological_decisions:
- issue: Contraste entre la poursuite des nations et la confiance filiale des disciples
  choice: Conserver « les nations du monde » et « votre Père » sans développement interprétatif.
  alternative: Employer « les non-Juifs du monde » ou ajouter « céleste » à « Père ».
  rationale: Le texte oppose la poursuite caractéristique du monde à la connaissance attentive du Père, sans préciser davantage l'identité des nations ni qualifier ici le Père de « céleste ».
translation_notes:
  register: Français international moderne, clair et digne. La dislocation « toutes ces choses, ... les recherchent » préserve l'objet placé en tête dans le grec et son effet d'insistance ; le point-virgule marque nettement le contraste introduit par δέ.
