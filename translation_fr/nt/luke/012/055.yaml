id: LUK.12.55
reference: Luke 12:55
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ὅταν νότον πνέοντα, λέγετε ὅτι Καύσων ἔσται, καὶ γίνεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/055.yaml
  text: And when the south wind is blowing[a], you say[b], ‘There will be scorching heat,’ and it happens.
translation:
  language: fr
  text: 'Et quand le vent du sud[a] souffle, vous dites : « Il va faire une chaleur torride[b] », et c’est ce qui arrive.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le sud » ; dans ce contexte, il s’agit du vent du sud.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « une chaleur brûlante » ou « une chaleur accablante ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: νότον
  choice: le vent du sud
  rationale: Le nom peut désigner le sud ou le vent du sud. Avec πνέοντα (« souffle ») dans ce contexte météorologique, « le vent du sud » exprime naturellement en français le sens implicite.
- source_word: πνέοντα
  choice: souffle
  rationale: Le participe présent décrit le vent en train de souffler. La proposition française au présent convient à cette observation météorologique habituelle sans ajouter un verbe de perception absent du texte grec.
- source_word: λέγετε
  choice: vous dites
  rationale: Le présent simple rend la valeur générale et habituelle de l’énoncé.
- source_word: Καύσων
  choice: une chaleur torride
  rationale: Le nom désigne une chaleur forte, brûlante ou accablante. « Chaleur torride » en communique l’intensité dans un français naturel sans employer l’expression moderne plus spécifique « vague de chaleur ».
- source_word: ἔσται
  choice: il va faire
  rationale: Pour annoncer un état météorologique, « il va faire une chaleur torride » est plus idiomatique en français que le calque « il y aura », tout en conservant la valeur future.
- source_word: γίνεται
  choice: c’est ce qui arrive
  rationale: Cette formulation naturelle indique que la prévision se réalise, conformément au sens de γίνεται.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La tournure météorologique « il va faire » évite un calque tout en restant précise. Aucun verbe signifiant « voir » n’a été ajouté, puisqu’il n’apparaît pas dans ce verset grec.
