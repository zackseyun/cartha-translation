  source_fidelity: 'Le texte français rend fidèlement tous les éléments du grec : la question rhétorique plurielle (« Pensez-vous »), la venue avec son but (« je sois venu donner »), « la paix », « sur la terre », la réplique négative appuyée (« Non, je vous le dis ») et l’opposition finale avec « la division ». « Mais plutôt » exprime de façon recevable le contraste renforcé de ἀλλ’ ἤ sans interpréter davantage.'
