id: LUK.12.51
reference: Luke 12:51
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: δοκεῖτε ὅτι εἰρήνην παρεγενόμην δοῦναι ἐν τῇ γῇ; οὐχί, λέγω ὑμῖν, ἀλλ’ ἢ διαμερισμόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/051.yaml
  text: Do you think that I came to give peace on the earth? No[a], I tell you[b], but rather division.
translation:
  language: fr
  text: Pensez-vous que je sois venu donner la paix sur la terre ? Non, je vous le dis, mais plutôt la division.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot grec traduit par « division » peut aussi évoquer la dissension ou la séparation.
    reason: lexical_alternative
lexical_decisions:
- source_word: δοκεῖτε
  choice: Pensez-vous
  rationale: Rend naturellement en français moderne la question rhétorique adressée à plusieurs auditeurs.
- source_word: εἰρήνην
  choice: la paix
  rationale: Équivalent direct qui conserve la portée large du terme, notamment la paix et l’harmonie entre les personnes.
- source_word: παρεγενόμην
  choice: je sois venu
  rationale: Après « Pensez-vous que », le subjonctif passé est idiomatique et exprime ici la venue de Jésus envisagée selon son but.
- source_word: δοῦναι
  choice: donner
  rationale: Conserve le sens lexical direct du verbe grec et reste compréhensible en français, malgré la possibilité idiomatique d’« apporter ».
- source_word: ἐν τῇ γῇ
  choice: sur la terre
  rationale: Préserve le sens vraisemblablement large de γῆ sans le restreindre à un territoire particulier.
- source_word: οὐχί
  choice: Non
  rationale: Réponse négative nette et directe à la question rhétorique.
- source_word: λέγω ὑμῖν
  choice: je vous le dis
  rationale: Formulation française naturelle qui conserve l’adresse explicite et l’insistance de Jésus.
- source_word: ἀλλ’ ἢ
  choice: mais plutôt
  rationale: Marque avec force le contraste après la négation.
- source_word: διαμερισμόν
  choice: la division
  rationale: Équivalent direct, éclairé par les divisions familiales décrites dans les versets suivants, sans réduire le terme à une forme particulière de conflit.
theological_decisions:
- issue: Faut-il atténuer la tension entre cette parole et les textes bibliques associant Jésus à la paix ?
  choice: Conserver le contraste abrupt entre « la paix » et « la division ».
  alternative: Préciser qu’il ne s’agit que d’un effet social indirect, ou remplacer « division » par une formulation explicative comme « conflit ».
  rationale: Le grec formule délibérément une opposition forte. Le contexte précise l’effet diviseur de la mission de Jésus au sein des relations humaines, mais le verset lui-même ne doit pas être adouci ni harmonisé avec d’autres passages.
translation_notes:
  register: Français international moderne, direct et digne. La tournure « je sois venu » respecte l’usage français après une interrogation portant sur une supposition. « Donner la paix » est maintenu pour sa proximité avec le grec, tandis que la note signale la nuance possible du dernier terme.
