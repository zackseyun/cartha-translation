id: LUK.12.44
reference: Luke 12:44
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀληθῶς λέγω ὑμῖν ὅτι ἐπὶ πᾶσιν τοῖς ὑπάρχουσιν αὐτοῦ καταστήσει αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/044.yaml
  text: Truly I tell you that he will appoint him over all that he has[a].
translation:
  language: fr
  text: En vérité, je vous le dis, il l’établira sur tout ce qu’il possède[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sur tous ses biens » ou « sur toute sa propriété ».
    reason: L’expression grecque peut désigner globalement tout ce qui appartient au maître, notamment ses biens ou sa propriété.
lexical_decisions:
- source_word: ἀληθῶς
  choice: En vérité
  rationale: Cette locution naturelle et solennelle conserve l’insistance de l’adverbe sur la véracité de la déclaration.
- source_word: λέγω ὑμῖν
  choice: je vous le dis
  rationale: Formule idiomatique en français contemporain qui maintient l’adresse directe et l’autorité de la déclaration.
- source_word: ὅτι
  choice: '[non exprimé séparément]'
  rationale: Après « je vous le dis », le français introduit naturellement la proposition de contenu sans conjonction, contrairement au grec.
- source_word: ἐπὶ
  choice: sur
  rationale: Avec le datif dans cette construction, la préposition marque l’autorité ou la responsabilité exercée sur ce qui est confié.
- source_word: πᾶσιν τοῖς ὑπάρχουσιν αὐτοῦ
  choice: tout ce qu’il possède
  rationale: Cette formulation idiomatique garde la portée globale de l’expression participiale sans la limiter explicitement aux seuls biens matériels.
- source_word: καταστήσει
  choice: il l’établira
  rationale: Le futur de καθίστημι désigne ici le fait d’établir quelqu’un dans une fonction d’autorité; « établira » conserve ce sens de nomination tout en s’accordant naturellement avec « sur ».
- source_word: αὐτόν
  choice: l’
  rationale: Le pronom masculin singulier renvoie au serviteur ou intendant masculin de la parabole; le français le conserve sans neutralisation.
theological_decisions:
- issue: Pronom masculin dans le cadre de la parabole
  choice: Conserver le masculin singulier dans « il l’établira »
  alternative: Employer une formulation épicène telle que « cette personne »
  rationale: Les formes grecques sont au masculin singulier et renvoient au personnage masculin présenté dans le contexte immédiat. La traduction préserve ce trait narratif sans en tirer une restriction doctrinale.
translation_notes:
  register: Français international moderne, clair et digne. « En vérité, je vous le dis » garde la solennité de la formule de Jésus; « tout ce qu’il possède » reste courant et compréhensible.
