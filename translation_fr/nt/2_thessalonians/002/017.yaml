translation:
  language: fr
  text: qu’il encourage vos cœurs[a] et vous affermisse dans toute bonne œuvre et toute bonne parole[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « qu’il console vos cœurs » ; ou, selon le contexte, « qu’il vous exhorte ».'
