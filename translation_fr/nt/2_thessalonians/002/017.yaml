  - marker: b
    text: 'Ou : « vous fortifie » ou « vous rende fermes dans toute bonne œuvre et toute bonne parole ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακαλέσαι
  choice: encourage
  rationale: Le verbe peut signifier encourager, consoler ou exhorter. Ici, le rappel de l’encouragement éternel au verset 16 favorise « encourager », assez large pour ne pas limiter le sens à la consolation affective ou à l’exhortation morale.
- source_word: ὑμῶν τὰς καρδίας
  choice: vos cœurs
  rationale: Cette formulation conserve la métaphore anthropologique biblique du cœur comme centre de la personne intérieure, sans la réduire aux seules émotions ni à l’intellect.
- source_word: στηρίξαι
  choice: vous affermisse
  rationale: Le verbe exprime l’action de rendre ferme, stable ou solide. « Affermir » restitue directement cette nuance et convient naturellement à une prière.
- source_word: ἐν παντὶ ἔργῳ καὶ λόγῳ ἀγαθῷ
  choice: dans toute œuvre et toute parole bonnes
  rationale: « Dans » exprime la sphère où l’affermissement s’exerce. La répétition française de « toute » rend clairement la portée distributive de παντί sur les deux noms, tandis que « bonnes » se rapporte à l’œuvre comme à la parole.
theological_decisions:
- issue: Faut-il interpréter καρδία par une catégorie psychologique moderne ?
  choice: vos cœurs
  alternative: votre être intérieur / vos pensées
  rationale: Le maintien de « cœurs » préserve l’anthropologie et la richesse de la métaphore bibliques sans en fixer le sens sur les seules émotions ou facultés mentales.
- issue: Comment rendre la fermeté exprimée par στηρίξαι ?
  choice: vous affermisse
  alternative: vous fortifie / vous rende fermes
  rationale: « Affermir » garde l’idée fondamentale de rendre stable et ferme, sans introduire une nuance doctrinale étrangère au texte.
- issue: Quel est le référent de l’impératif optatif contenu dans les infinitifs aoristes ?
  choice: qu’il encourage… et vous affermisse
  alternative: encourage… et affermisse
  rationale: Le verset poursuit la prière-souhait commencée au verset 16, dont le sujet grammatical composé est Jésus-Christ et Dieu le Père. Le singulier grec peut être conservé naturellement en français par « il », sans chercher à résoudre davantage la tension syntaxique et théologique du contexte.
translation_notes:
  register: Français international moderne, digne et accessible. « Affermisse » relève d’un registre légèrement soutenu mais courant dans un contexte biblique. L’accord « bonnes » avec deux noms de genres différents suit le masculin pluriel normatif et indique que l’adjectif qualifie à la fois l’œuvre et la parole.
