reference: 2 Thessalonians 2:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἵνα κριθῶσιν ⸀πάντες οἱ μὴ πιστεύσαντες τῇ ἀληθείᾳ ἀλλὰ εὐδοκήσαντες ⸀τῇ ἀδικίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/012.yaml
  text: so that all may be judged who did not believe the truth but took pleasure in unrighteousness[a].
translation:
  language: fr
  text: afin que soient jugés tous ceux qui n’ont pas cru à la vérité, mais qui ont pris plaisir à l’injustice[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « soient condamnés ». Le verbe grec signifie plus littéralement « soient jugés », mais le contexte peut impliquer une condamnation.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: afin que
  rationale: Introduit le but ou le résultat par rapport au contexte précédent, sans trancher entièrement entre ces deux nuances.
- source_word: κριθῶσιν
  choice: soient jugés
  rationale: Rend le sens judiciaire fondamental du passif de κρίνω. Le contexte est défavorable, mais « condamnés » expliciterait davantage l’issue que ne le fait le verbe lui-même.
- source_word: πάντες οἱ μὴ πιστεύσαντες
  choice: tous ceux qui n’ont pas cru
  rationale: Reproduit naturellement en français la construction substantivée et l’aspect rétrospectif du participe aoriste.
- source_word: τῇ ἀληθείᾳ
  choice: à la vérité
  rationale: Après « croire », le complément introduit par « à » est idiomatique en français et l’article défini conserve la référence à une vérité déterminée.
- source_word: ἀλλὰ
  choice: mais
  rationale: Marque clairement le contraste entre le refus de croire à la vérité et l’adhésion affective à l’injustice.
- source_word: εὐδοκήσαντες
  choice: ont pris plaisir
  rationale: Exprime la satisfaction volontaire et affective portée par εὐδοκέω, plutôt qu’une simple approbation intellectuelle.
- source_word: τῇ ἀδικίᾳ
  choice: à l’injustice
  rationale: « Injustice » est un équivalent français courant et digne d’ἀδικία, capable de désigner ici ce qui est contraire à la justice et moralement mauvais.
theological_decisions:
- issue: Faut-il rendre κριθῶσιν par « soient jugés » ou par « soient condamnés » ?
  choice: soient jugés
  alternative: soient condamnés
  rationale: Le contexte implique un jugement défavorable, mais κρίνω désigne plus littéralement l’acte de juger. Le texte principal préserve cette portée sans transformer implicitement le jugement en verdict explicite.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe conserve le lien logique avec le verset précédent. « N’ont pas cru à la vérité » est idiomatique, tandis que « ont pris plaisir à l’injustice » maintient le contraste moral appuyé de l’original.
