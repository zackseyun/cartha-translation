- from: Car le mystère du mépris de la loi est déjà à l’œuvre. Seulement, celui qui, à présent, fait obstacle[a] continuera ainsi jusqu’à ce qu’il ne soit plus là[b].
  to: Car le mystère de l’illégalité est déjà à l’œuvre. Seulement, celui qui, à présent, fait obstacle[a] continuera ainsi jusqu’à ce qu’il ne soit plus là[b].
