    issue: « mépris de la loi » pour ἀνομίας
    rationale: 'Cette formulation évoque spécifiquement le dédain ou le refus délibéré d’une loi. Ἀνομία est plus ample : absence de respect de la loi, illégalité ou état de rébellion contre elle. « Illégalité » préserve mieux cette portée sans expliciter quelle loi est visée.'
  - severity: low
    issue: La note a dit « cette personne ».
    rationale: Le participe substantivé masculin ne permet pas d’identifier le reteneur comme une personne au sens interprétatif du terme. « Cette figure » ou « celui qui retient » préserve mieux l’indétermination du grec.
