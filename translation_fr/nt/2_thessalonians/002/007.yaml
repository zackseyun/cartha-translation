source:
  edition: SBLGNT
  text: τὸ γὰρ μυστήριον ἤδη ἐνεργεῖται τῆς ἀνομίας· μόνον ὁ κατέχων ἄρτι ἕως ἐκ μέσου γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/007.yaml
  text: For the mystery of lawlessness is already at work[b][a]; only the one who now restrains will do so until he is out of the way.
translation:
  language: fr
  text: Car le mystère de l’illégalité est déjà à l’œuvre. Seulement, celui qui, à présent, fait obstacle[a] continuera ainsi jusqu’à ce qu’il ne soit plus là[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « celui qui retient actuellement ». Le grec ne précise pas qui est cette figure.
    reason: alternative_reading
  - marker: b
    text: Ou « jusqu’à ce qu’il soit écarté » ou « jusqu’à ce qu’il soit enlevé du milieu ». Le grec précise moins nettement comment cela se produit.
    reason: lexical_alternative
lexical_decisions:
- source_word: μυστήριον
  choice: mystère
  rationale: Conserve le sens paulinien d’une réalité cachée qui est néanmoins déjà à l’œuvre, sans la réduire à une simple énigme.
- source_word: ἐνεργεῖται
  choice: est déjà à l’œuvre
  rationale: Expression française naturelle qui rend l’activité présente et continue indiquée par le verbe.
- source_word: ἀνομίας
  choice: mépris de la loi
  rationale: Rend l’idée de refus ou de transgression de la loi portée par ἀνομία, dans une langue actuelle, tout en maintenant le lien avec le contexte.
- source_word: μόνον
  choice: seulement
  rationale: Introduit, comme en grec, une restriction elliptique à l’affirmation précédente.
- source_word: ὁ κατέχων ἄρτι
  choice: celui qui, à présent, fait obstacle
  rationale: Rend la fonction de retenue sans identifier son auteur et évite en français un emploi transitif incomplet de « retenir ».
- source_word: ἕως ἐκ μέσου γένηται
  choice: jusqu’à ce qu’il ne soit plus là
  rationale: Exprime l’état résultant sans préciser si le personnage part de lui-même ou s’il est écarté par un autre agent.
theological_decisions:
- issue: Identité de ὁ κατέχων
  choice: celui qui, à présent, fait obstacle
  alternative: l’État romain, le gouvernement humain, l’Esprit saint, un ange ou la prédication apostolique
  rationale: Le verset mentionne une figure masculine qui exerce une retenue, mais ne l’identifie pas. La traduction conserve cette indétermination.
- issue: Agent impliqué dans ἕως ἐκ μέσου γένηται
  choice: jusqu’à ce qu’il ne soit plus là
  alternative: jusqu’à ce qu’il soit écarté / enlevé
  rationale: Le grec décrit surtout le fait de ne plus être au milieu ou de ne plus faire obstacle, sans nommer explicitement un agent qui provoquerait ce changement.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation évite le terme plus traditionnel « iniquité » ainsi que toute identification confessionnelle de la figure qui fait obstacle. « Continuera ainsi » explicite sobrement l’ellipse grecque sans ajouter d’agent ni de chronologie étrangère au texte.
