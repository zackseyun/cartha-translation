  text: εἰς ⸀ὃ ἐκάλεσεν ὑμᾶς διὰ τοῦ εὐαγγελίου ἡμῶν, εἰς περιποίησιν δόξης τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/014.yaml
  text: to which he called you through our gospel[b][a], for obtaining the glory of our Lord Jesus the Messiah.
translation:
  language: fr
  text: C’est à cela qu’il vous a appelés par notre Évangile, afin que vous obteniez la gloire[a] de notre Seigneur Jésus le Messie.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « entrer en possession de la gloire » ou « avoir part à la gloire ».'
    reason: Alternatives lexicales pour περιποίησις dans l’expression εἰς περιποίησιν δόξης.
  - marker: b
    text: 'Ou, selon la formulation traditionnelle : « Jésus-Christ ».'
    reason: Alternative traditionnelle pour le titre Χριστός.
lexical_decisions:
- source_word: εἰς ὃ
  choice: C’est à cela
  rationale: La tournure renvoie naturellement en français à l’ensemble du salut et de la sanctification évoqué au verset précédent, sans en préciser excessivement l’antécédent.
- source_word: ἐκάλεσεν ὑμᾶς
  choice: il vous a appelés
  rationale: « Appeler » conserve la force sotériologique habituelle du verbe chez Paul sans imposer une théorie particulière de l’appel divin.
- source_word: διὰ τοῦ εὐαγγελίου ἡμῶν
  choice: par notre Évangile
  rationale: '« Par » exprime ici le moyen. « Notre Évangile » reproduit l’expression apostolique : il s’agit de l’Évangile proclamé par Paul et ses collaborateurs, non d’un message distinct qui leur appartiendrait.'
- source_word: εἰς περιποίησιν δόξης
  choice: afin que vous obteniez la gloire
  rationale: Cette formulation française claire exprime la visée de εἰς et le sens d’acquisition ou d’obtention de περιποίησις, tout en évitant de trancher davantage la relation exacte des croyants à cette gloire.
- source_word: τοῦ κυρίου ἡμῶν
  choice: de notre Seigneur
  rationale: « Seigneur » conserve le titre néotestamentaire et sa portée théologique.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jésus le Messie
  rationale: Χριστός garde ici sa valeur de titre. « Le Messie » en restitue le sens dans un français naturel; la forme traditionnelle « Jésus-Christ » est signalée en note.
theological_decisions:
- issue: Nature de l’appel divin
  choice: il vous a appelés
  alternative: il vous a invités / il vous a appelés efficacement
  rationale: Le texte affirme l’appel de Dieu au moyen de l’Évangile sans définir ici son mode précis; la traduction préserve cette tension.
- issue: Sens de περιποίησις avec δόξης
  choice: afin que vous obteniez la gloire
  alternative: afin que vous entriez en possession de la gloire / afin que vous ayez part à la gloire
  rationale: « Obtenir » rend directement l’idée d’acquisition, tandis que « avoir part » expliciterait une interprétation plausible mais moins littérale.
- issue: Valeur de Χριστός
  choice: le Messie
  alternative: Christ
  rationale: Le terme grec désigne l’Oint attendu et reste intelligible comme titre après « Jésus »; l’équivalent ecclésial traditionnel demeure disponible en note.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase reste proche de la structure grecque, tout en transformant le groupe nominal final en proposition de but naturelle en français.
