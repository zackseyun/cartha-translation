reference: 2 Thessalonians 2:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἰς τὸ μὴ ταχέως σαλευθῆναι ὑμᾶς ἀπὸ τοῦ νοὸς ⸀μηδὲ θροεῖσθαι μήτε διὰ πνεύματος μήτε διὰ λόγου μήτε δι’ ἐπιστολῆς ὡς δι’ ἡμῶν, ὡς ὅτι ἐνέστηκεν ἡ ἡμέρα τοῦ ⸀κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/002.yaml
  text: that you not be quickly shaken from your mind or alarmed[a], either by a spirit or by a message or by a letter as if from us[b], to the effect that the day of the Lord has come.
translation:
  language: fr
  text: de ne pas vous laisser si vite ébranler dans votre bon sens ni vous laisser alarmer, que ce soit par un esprit[a], par un message ou par une lettre prétendument de notre part, selon laquelle le jour du Seigneur est déjà arrivé[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une parole inspirée » ou « une révélation prophétique ».
    reason: lexical_alternative
  - marker: b
    text: Ou « est là » ou « est présent ». Le parfait grec peut indiquer que, selon cette affirmation, le jour du Seigneur serait déjà arrivé et serait maintenant présent.
    reason: alternative_reading
lexical_decisions:
- source_word: ταχέως
  choice: rapidement
  rationale: L’adverbe porte sur les deux infinitifs et décrit la rapidité avec laquelle les destinataires pourraient être déstabilisés.
- source_word: σαλευθῆναι
  choice: vous laisser […] ébranler
  rationale: Cette formulation française naturelle conserve l’image du bouleversement exprimée par le passif grec.
- source_word: ἀπὸ τοῦ νοὸς
  choice: dans votre jugement
  rationale: L’expression grecque désigne ici la faculté de penser ou le jugement établi. « Dans votre jugement » est plus idiomatique que le calque « loin de votre esprit » sans réduire le sens à une simple émotion.
- source_word: θροεῖσθαι
  choice: alarmer
  rationale: Le verbe exprime un trouble marqué, proche de l’alarme, sans nécessairement impliquer la terreur.
- source_word: πνεύματος
  choice: un esprit
  rationale: Le rendu conserve le terme grec et son ambiguïté; dans ce contexte, il peut désigner une prétendue manifestation ou révélation spirituelle.
- source_word: λόγου
  choice: un message
  rationale: Dans la série qui l’oppose à une lettre, λόγος désigne vraisemblablement une communication orale; « message » l’exprime clairement en français actuel.
- source_word: ἐπιστολῆς
  choice: une lettre
  rationale: Équivalent courant et précis pour une correspondance écrite.
- source_word: ὡς δι’ ἡμῶν
  choice: présentée comme venant de nous
  rationale: La formulation rend naturellement l’idée d’une attribution revendiquée à Paul et à ses collaborateurs, sans affirmer qu’elle était réellement de leur main.
- source_word: ὡς ὅτι
  choice: et affirmant que
  rationale: Cette tournure introduit clairement le contenu prétendu du message tout en évitant une répétition maladroite de « comme si ».
- source_word: ἐνέστηκεν
  choice: est arrivé
  rationale: Le parfait présente le jour comme ayant commencé et étant désormais là. « Est arrivé » exprime cette arrivée avec son résultat présent.
- source_word: ἡμέρα τοῦ κυρίου
  choice: le jour du Seigneur
  rationale: Expression eschatologique établie en français, distincte d’un simple jour hebdomadaire consacré au culte.
theological_decisions:
- issue: Sens eschatologique de ἐνέστηκεν
  choice: est arrivé
  alternative: est là / est présent
  rationale: Le parfait peut exprimer une arrivée dont l’état présent demeure. Le texte principal rend l’arrivée revendiquée, tandis que la note préserve explicitement la nuance possible de présence actuelle.
- issue: Sens de πνεύματος parmi les sources alléguées
  choice: un esprit
  alternative: une parole inspirée / une révélation prophétique
  rationale: Le nom sans article peut renvoyer à une manifestation spirituelle prétendue plutôt qu’à identifier sans ambiguïté l’Esprit Saint. Le texte principal garde l’ambiguïté lexicale et la note en explicite les sens contextuels possibles.
translation_notes:
  register: Français international actuel, digne et accessible. Le verset demeure syntaxiquement rattaché à l’exhortation commencée au verset 1. La formulation évite le calque obscur de ἀπὸ τοῦ νοὸς, tout en conservant l’image d’être ébranlé, l’ambiguïté de πνεῦμα et la tension eschatologique du parfait ἐνέστηκεν.
