id: 2TH.2.3
reference: 2 Thessalonians 2:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: μή τις ὑμᾶς ἐξαπατήσῃ κατὰ μηδένα τρόπον· ὅτι ἐὰν μὴ ἔλθῃ ἡ ἀποστασία πρῶτον καὶ ἀποκαλυφθῇ ὁ ἄνθρωπος τῆς ⸀ἀνομίας, ὁ υἱὸς τῆς ἀπωλείας,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/003.yaml
  text: Let no one deceive you in any way[a], because that day will not come unless the rebellion comes first and the man of lawlessness is revealed[b], the son of destruction.
translation:
  language: fr
  text: Que personne ne vous trompe d’aucune manière, car ce jour ne viendra pas à moins que la rébellion[a] ne survienne d’abord et que l’homme de la rébellion contre la loi[b] ne soit révélé, le fils de la destruction.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’apostasie » ou « la défection ». Le terme grec peut désigner une rébellion décisive, souvent comprise comme un abandon de la foi.
    reason: alternative_reading
  - marker: b
    text: Certains manuscrits portent « l’homme du péché » au lieu de « l’homme de la rébellion contre la loi ».
    reason: textual_variant
lexical_decisions:
- source_word: ἐξαπατήσῃ
  choice: trompe
  rationale: Le verbe signifie tromper ou égarer. « Trompe » est direct, naturel et n’exagère pas la force éventuelle du préfixe.
- source_word: κατὰ μηδένα τρόπον
  choice: d’aucune manière
  rationale: Cette expression renforce l’interdiction et exclut toute forme de tromperie.
- source_word: ὅτι
  choice: car
  rationale: La conjonction introduit ici la raison de l’avertissement. « Car » exprime clairement ce lien dans un registre digne et courant.
- source_word: ἐὰν μὴ ἔλθῃ
  choice: ce jour ne viendra pas sans que… se produise
  rationale: Le sujet sous-entendu est repris du verset précédent. Cette formulation française exprime naturellement la condition préalable nécessaire.
- source_word: ἀποστασία
  choice: la révolte
  rationale: Le terme peut désigner une rébellion, une défection ou une apostasie. « La révolte » conserve le sens large sans imposer une interprétation exclusivement religieuse.
- source_word: πρῶτον
  choice: d’abord
  rationale: L’adverbe marque l’ordre chronologique des événements.
- source_word: ἀποκαλυφθῇ
  choice: soit révélé
  rationale: Le passif indique que ce personnage est rendu manifeste. « Soit révélé » garde aussi la résonance apocalyptique du verbe.
- source_word: ὁ ἄνθρωπος τῆς ἀνομίας
  choice: l’homme du mépris de la loi
  rationale: Cette formulation rend ἀνομία comme une attitude de rejet de la loi plutôt que comme une simple absence de règles. Le masculin singulier est conservé puisqu’il désigne un personnage précis.
- source_word: ὁ υἱὸς τῆς ἀπωλείας
  choice: le fils de la destruction
  rationale: La formulation préserve l’expression sémitique du grec, qui peut caractériser une personne par la destruction ou indiquer qu’elle lui est destinée, sans trancher cette nuance.
theological_decisions:
- issue: Sujet sous-entendu du verbe « viendra »
  choice: Expliciter « ce jour » d’après le contexte immédiat
  alternative: 'Conserver l’ellipse : « car, à moins que la révolte… »'
  rationale: Le grec reprend implicitement le jour du Seigneur mentionné au verset 2. L’explicitation évite en français une proposition incomplète sans ajouter une idée étrangère au contexte.
- issue: Sens de ἀποστασία
  choice: la révolte
  alternative: l’apostasie ; la défection
  rationale: Le choix principal garde la portée générale d’une rébellion décisive. La note signale la compréhension religieuse possible sans résoudre d’office le débat eschatologique.
- issue: Variante textuelle en 2 Thessaloniciens 2.3
  choice: 'Suivre le SBLGNT : ἀνομίας, « du mépris de la loi »'
  alternative: ἁμαρτίας, « du péché »
  rationale: Le texte source fourni porte ἀνομίας. La variante bien attestée et connue dans l’histoire de la traduction est signalée en note.
- issue: Portée de l’expression « fils de la destruction »
  choice: Conserver la tournure métaphorique du grec
  alternative: celui qui est voué à la destruction
  rationale: La traduction formelle préserve l’ambiguïté entre caractérisation et destinée, au lieu de ne retenir que l’idée d’une personne vouée à la destruction.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe explicite le sujet sous-entendu grâce au contexte immédiat. « Mépris de la loi » rend le concept de ἀνομία de façon intelligible, tandis que « fils de la destruction » conserve volontairement l’image et son ambiguïté.
