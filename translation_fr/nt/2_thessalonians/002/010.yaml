source:
  edition: SBLGNT
  text: καὶ ἐν πάσῃ ἀπάτῃ ⸀ἀδικίας τοῖς ἀπολλυμένοις, ἀνθ’ ὧν τὴν ἀγάπην τῆς ἀληθείας οὐκ ἐδέξαντο εἰς τὸ σωθῆναι αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/010.yaml
  text: and with every deception of unrighteousness for those who are perishing[d][c][b][a], because they did not accept the love of the truth so as to be saved.
translation:
  language: fr
  text: et par toutes sortes de tromperies de l’injustice[a] pour ceux qui vont à leur perte[b], parce qu’ils n’ont pas accueilli l’amour de la vérité[c], afin d’être sauvés[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « toute tromperie caractérisée par l’injustice »; littéralement « toute tromperie de l’injustice ».
    reason: lexical_alternative
  - marker: b
    text: Ou « parmi ceux qui vont à leur perte ».
    reason: lexical_alternative
  - marker: c
    text: Ou « n’ont pas reçu » ou « n’ont pas accepté l’amour de la vérité ».
    reason: lexical_alternative
  - marker: d
    text: Ou « pour qu’ils soient sauvés ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπάτῃ
  choice: tromperies
  rationale: Le nom désigne la tromperie ou la séduction mensongère. Le pluriel français, après « toutes les », exprime naturellement la valeur distributive de πάσῃ avec le nom collectif singulier grec.
- source_word: ἀδικίας
  choice: de l’injustice
  rationale: Le génitif qualifie moralement les tromperies. « Injustice » conserve le substantif et la portée de ἀδικία, sans la réduire à la seule injustice sociale.
- source_word: τοῖς ἀπολλυμένοις
  choice: envers ceux qui vont à leur perte
  rationale: « Envers » rend la relation de la tromperie avec le groupe désigné sans imposer une simple localisation. La tournure progressive conserve l’état en cours exprimé par le participe présent.
- source_word: ἀνθ’ ὧν
  choice: parce que
  rationale: Dans ce contexte, la locution introduit idiomatiquement la raison de leur situation; « parce que » en transmet clairement la valeur causale.
- source_word: ἀγάπην τῆς ἀληθείας
  choice: l’amour de la vérité
  rationale: Cette formulation conserve le génitif grec et la tension de l’expression, tout en suggérant naturellement l’amour porté à la vérité.
- source_word: ἐδέξαντο
  choice: n’ont pas accueilli
  rationale: δέχομαι peut signifier recevoir, accepter ou accueillir. « Accueillir » convient à un objet abstrait et exprime plus qu’un simple assentiment intellectuel.
- source_word: εἰς τὸ σωθῆναι αὐτούς
  choice: afin d’être sauvés
  rationale: La construction avec εἰς et l’infinitif substantivé exprime ici le but, avec une possible nuance de résultat; « afin d’être sauvés » en restitue clairement la visée.
theological_decisions:
- issue: Le participe « ceux qui vont à leur perte » décrit-il un état en cours ou un destin fixé d’avance ?
  choice: ceux qui vont à leur perte
  alternative: les condamnés; ceux qui sont en train d’être détruits
  rationale: Le participe présent ἀπολλυμένοις présente un processus ou un état en cours. La traduction évite d’introduire une affirmation sur un décret préalable que le syntagme lui-même n’explicite pas.
- issue: « L’amour de la vérité » désigne-t-il l’amour pour la vérité ou l’amour venant de la vérité ?
  choice: l’amour de la vérité
  alternative: l’amour pour la vérité
  rationale: Le contexte favorise l’amour porté à la vérité, mais la conservation du génitif respecte la forme grecque et n’explicite pas davantage que le texte source.
- issue: La proposition finale exprime-t-elle le but ou le résultat ?
  choice: afin d’être sauvés
  alternative: de sorte qu’ils soient sauvés
  rationale: La construction εἰς τό avec l’infinitif peut comporter une tension entre but et résultat. Le contexte permet naturellement la valeur de but, sans faire du salut un résultat automatique.
translation_notes:
  register: Français international moderne, digne et accessible. Le verset demeure syntaxiquement lié à ce qui précède, d’où l’ouverture par « et ». « Vont à leur perte » est idiomatique sans transformer le participe présent en étiquette définitive.
