revisions:
- from: et par toutes les tromperies de l’injustice[a] envers ceux qui vont à leur perte[b], parce qu’ils n’ont pas accueilli l’amour de la vérité[c], afin d’être sauvés[d].
  to: et par toutes sortes de tromperies de l’injustice[a] pour ceux qui vont à leur perte[b], parce qu’ils n’ont pas accueilli l’amour de la vérité[c], afin d’être sauvés[d].
  rationale: La révision remplace « envers » par « pour », plus idiomatique et plus proche de la relation exprimée par le datif dans ce contexte. Elle emploie aussi « toutes sortes de tromperies », tournure française naturelle qui préserve la valeur distributive de πάσῃ ἀπάτῃ. La note b est ajustée pour ne pas présenter comme simple alternative la formulation désormais retenue et pour conserver l’option de localisation « parmi ».
  reviewer_model: gpt-5.6-terra
