  text: καὶ νῦν τὸ κατέχον οἴδατε, εἰς τὸ ἀποκαλυφθῆναι αὐτὸν ἐν τῷ ⸀ἑαυτοῦ καιρῷ·
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/006.yaml
  text: And now you know what is restraining him[b][a], so that he may be revealed in his own time.
translation:
  language: fr
  text: Et maintenant, vous savez ce qui le retient[a], afin qu’il soit révélé en son temps[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ce qui fait obstacle ». Le grec emploie une expression neutre et n’identifie pas ici ce qui exerce cette retenue.
    reason: lexical_alternative
  - marker: b
    text: Ou « au moment qui lui est propre ». Le terme grec peut désigner un moment opportun ou déterminé.
    reason: alternative_reading
lexical_decisions:
- source_word: κατέχον
  choice: ce qui le retient
  rationale: Le participe substantivé neutre τὸ κατέχον désigne de manière impersonnelle ce qui exerce une action de retenue. Cette formulation française reste naturelle sans identifier la force ou l’agent en question.
- source_word: οἴδατε
  choice: vous savez
  rationale: Le parfait grec a ici un sens présent. « Vous savez » rend simplement l’appel de Paul à ce que ses destinataires connaissent déjà.
- source_word: εἰς τὸ ἀποκαλυφθῆναι
  choice: afin qu’il soit révélé
  rationale: La construction εἰς τό suivie de l’infinitif passif exprime ici le but, avec une possible nuance de résultat. « Afin que » conserve clairement la valeur finale sans préciser l’identité de celui qui sera révélé.
- source_word: ἐν τῷ ἑαυτοῦ καιρῷ
  choice: au moment qui lui est propre
  rationale: καιρός désigne un moment opportun ou déterminé, tandis que ἑαυτοῦ souligne qu’il s’agit du moment propre au personnage évoqué. Cette tournure conserve cette nuance sans ajouter explicitement l’idée d’une fixation divine.
- source_word: νῦν
  choice: maintenant
  rationale: Équivalent temporel direct et naturel de νῦν dans le fil du discours.
- source_word: αὐτόν
  choice: il
  rationale: Dans la proposition infinitive passive, le pronom masculin renvoie au personnage précédemment évoqué. La reprise par « il » en français préserve cette référence personnelle sans l’identifier davantage.
theological_decisions:
- issue: Identité de ce qui retient
  choice: Conserver l’expression neutre « ce qui le retient » sans nommer l’agent.
  alternative: L’ordre romain, le Saint-Esprit, une puissance angélique ou le décret providentiel de Dieu.
  rationale: Le verset n’identifie pas ce qui retient, et le grec emploie ici une forme neutre. La traduction ne doit donc pas trancher une question interprétative ancienne et disputée.
- issue: Valeur de καιρός dans le contexte eschatologique
  choice: Traduire par « au moment qui lui est propre ».
  alternative: « au moment fixé pour lui » ou « au moment voulu »
  rationale: καιρός peut désigner un moment opportun ou fixé, mais le texte met aussi en relief, par ἑαυτοῦ, le moment propre au personnage. La traduction principale conserve cette formulation sans rendre explicite qui aurait fixé ce moment.
translation_notes:
  register: Français international moderne, sobre et digne. La phrase suit étroitement la structure grecque tout en restant idiomatique. Les pronoms et l’expression neutre préservent l’ambiguïté du passage, et les notes signalent les principales nuances lexicales sans imposer d’interprétation confessionnelle.
