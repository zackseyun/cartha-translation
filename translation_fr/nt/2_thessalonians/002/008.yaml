source:
  edition: SBLGNT
  text: καὶ τότε ἀποκαλυφθήσεται ὁ ἄνομος, ὃν ὁ κύριος ⸀Ἰησοῦς ⸀ἀνελεῖ τῷ πνεύματι τοῦ στόματος αὐτοῦ καὶ καταργήσει τῇ ἐπιφανείᾳ τῆς παρουσίας αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/008.yaml
  text: And then the lawless one will be revealed[a], whom the Lord Jesus will slay with the breath of his mouth and bring to nothing by the appearance of his coming[b],
translation:
  language: fr
  text: Et alors, celui qui est sans loi sera révélé, et le Seigneur Jésus le tuera par le souffle de sa bouche[a] et le réduira à néant par la manifestation de sa venue[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « par l’esprit de sa bouche ». Le mot grec peut signifier « souffle » ou « esprit » ; « souffle » convient le mieux à l’expression employée ici.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « par la manifestation de sa présence ». Dans ce contexte, le mot grec désigne habituellement une venue, bien qu’il puisse aussi signifier « présence ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκαλυφθήσεται
  choice: paraîtra
  rationale: Le futur passif signifie littéralement « sera révélé ». Dans ce contexte apocalyptique, « paraîtra » exprime naturellement en français le fait que cette figure sera rendue manifeste, sans préciser l’agent.
- source_word: ὁ ἄνομος
  choice: celui qui est sans loi
  rationale: L’adjectif substantivé désigne littéralement « celui qui est sans loi ». Cette formulation évite d’ajouter « homme », absent de ce verset, et conserve la caractérisation de la figure.
- source_word: ὁ κύριος Ἰησοῦς
  choice: le Seigneur Jésus
  rationale: Rend directement le titre κύριος et le nom propre Ἰησοῦς selon l’usage français établi du Nouveau Testament.
- source_word: ἀνελεῖ
  choice: fera mourir
  rationale: Dans ce contexte, ἀναιρέω désigne la mise à mort. « Fera mourir » est clair, digne et actuel, sans l’archaïsme de « occira ».
- source_word: τῷ πνεύματι τοῦ στόματος αὐτοῦ
  choice: par le souffle de sa bouche
  rationale: πνεῦμα peut signifier « souffle » ou « esprit ». Dans cette expression, « souffle » forme l’image la plus naturelle et correspond probablement à l’arrière-plan d’Ésaïe 11.4 dans la Septante.
- source_word: καταργήσει
  choice: réduira à néant
  rationale: καταργέω indique ici une neutralisation ou une abolition décisive. « Réduira à néant » en conserve la force sans imposer à lui seul l’idée d’anéantissement ontologique.
- source_word: τῇ ἐπιφανείᾳ
  choice: par la manifestation
  rationale: ἐπιφάνεια désigne une apparition ou manifestation visible. « Manifestation » convient au registre eschatologique tout en restant intelligible.
- source_word: τῆς παρουσίας αὐτοῦ
  choice: de sa venue
  rationale: Dans ce contexte eschatologique, παρουσία désigne normalement la venue ou l’arrivée du Christ. Le sens lexical « présence » demeure possible et est signalé en note.
theological_decisions:
- issue: Identité et désignation de l’adversaire eschatologique
  choice: celui qui est sans loi
  alternative: l’impie
  rationale: Le grec emploie ici l’adjectif substantivé ὁ ἄνομος, et non l’expression plus développée du contexte proche. La traduction retenue conserve cette formulation sans ajouter une identification ou une nature non explicitée dans le verset.
- issue: Moyen par lequel le Seigneur Jésus triomphe
  choice: par le souffle de sa bouche
  alternative: par l’Esprit de sa bouche
  rationale: « Souffle » est le sens le plus naturel dans cette image de jugement et son probable écho scripturaire. Comme « esprit » appartient réellement au champ sémantique de πνεῦμα, l’ambiguïté est préservée en note.
- issue: Sens eschatologique de παρουσία
  choice: sa venue
  alternative: sa présence
  rationale: « Venue » correspond à l’emploi contextuel habituel de παρουσία pour l’avènement du Christ, tandis que « présence » reflète une possibilité lexicale réelle conservée en note.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve le parallélisme des deux actions du Seigneur Jésus. « Celui qui est sans loi » privilégie la précision formelle, tandis que « fera mourir » et « réduira à néant » gardent une formulation naturelle.
