  source_fidelity: « Voilà pourquoi » rend naturellement διὰ τοῦτο avec sa valeur causale. « Dieu leur envoie » conserve sans atténuation Dieu comme sujet de πέμπει. « Une action d’égarement » maintient les deux noms d’ἐνέργειαν πλάνης et l’ambiguïté d’une action caractérisée par l’égarement ou qui le produit. « Afin qu’ils croient au mensonge » rend correctement εἰς τὸ πιστεῦσαι αὐτοὺς τῷ ψεύδει, sans résoudre la nuance possible de but ou de résultat.
