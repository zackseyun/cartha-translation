id: 2TH.2.11
reference: 2 Thessalonians 2:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ διὰ τοῦτο ⸀πέμπει αὐτοῖς ὁ θεὸς ἐνέργειαν πλάνης εἰς τὸ πιστεῦσαι αὐτοὺς τῷ ψεύδει,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/011.yaml
  text: And because of this[a], God sends them a working of delusion so that they may believe the lie,
translation:
  language: fr
  text: Voilà pourquoi Dieu leur envoie une action d’égarement[a], afin qu’ils croient au mensonge.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une influence qui égare », « une action trompeuse » ou, selon la formulation traditionnelle, « un puissant égarement ».
    reason: Alternative lexicale pour ἐνέργειαν πλάνης, expression qui peut désigner une action efficace caractérisée par l’égarement ou une influence produisant celui-ci.
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Voilà pourquoi
  rationale: Cette tournure française naturelle conserve la relation causale explicite avec le refus de la vérité mentionné au verset précédent.
- source_word: πέμπει
  choice: envoie
  rationale: Le présent français rend directement le présent grec et maintient Dieu comme sujet explicite de l’action.
- source_word: ἐνέργειαν πλάνης
  choice: une action d’égarement
  rationale: Cette formulation conserve les deux notions du grec — une action opérante et l’égarement — ainsi que l’ambiguïté du génitif, sans réduire le propos à une simple permission divine.
- source_word: εἰς τὸ πιστεῦσαι
  choice: afin qu’ils croient
  rationale: La tournure exprime naturellement la visée ou l’aboutissement de l’action sans trancher plus nettement que le grec entre but et résultat.
- source_word: τῷ ψεύδει
  choice: au mensonge
  rationale: Le singulier défini est préservé et peut désigner le mensonge particulier évoqué par le contexte, plutôt que la fausseté en général.
theological_decisions:
- issue: L’action divine dans l’endurcissement judiciaire
  choice: Dieu leur envoie une action d’égarement
  alternative: Dieu permet qu’une action d’égarement les atteigne / Dieu les livre à l’égarement
  rationale: Le grec présente explicitement Dieu comme sujet du verbe « envoyer ». La traduction ne transforme donc pas cette action en simple permission, tout en laissant ouverte la manière dont elle doit être comprise théologiquement.
translation_notes:
  register: Français international moderne, clair et digne. « Voilà pourquoi » est idiomatique tout en restant explicitement causal. « Action d’égarement » est légèrement formel, mais garde visibles les deux substantifs grecs et la tension théologique du passage.
