id: 2TH.2.13
reference: 2 Thessalonians 2:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἡμεῖς δὲ ὀφείλομεν εὐχαριστεῖν τῷ θεῷ πάντοτε περὶ ὑμῶν, ἀδελφοὶ ἠγαπημένοι ὑπὸ κυρίου, ὅτι εἵλατο ὑμᾶς ὁ θεὸς ⸀ἀπαρχὴν εἰς σωτηρίαν ἐν ἁγιασμῷ πνεύματος καὶ πίστει ἀληθείας,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/013.yaml
  text: But we ought always to give thanks to God for you[a], brothers beloved by the Lord, because God chose you as firstfruits for salvation through sanctification by the Spirit and faith in the truth[b],
translation:
  language: fr
  text: Mais nous devons toujours rendre grâce à Dieu pour vous, frères[b] aimés par le Seigneur, parce que Dieu vous a choisis comme prémices[a] pour le salut, par la sanctification de l’Esprit et par la foi en la vérité,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dans certains manuscrits : « dès le commencement pour le salut ». Le texte principal suit la leçon « comme prémices » (ἀπαρχήν); la variante correspond à ἀπ’ ἀρχῆς (« dès le commencement »).'
    reason: textual_variant
  - marker: b
    text: Le mot « frères » traduit le pluriel masculin ἀδελφοί; cette interpellation peut inclure toute la communauté croyante.
    reason: cultural_note
lexical_decisions:
- source_word: Ἡμεῖς δὲ
  choice: Mais nous
  rationale: δὲ marque ici le contraste avec ceux qui périssent dans le contexte précédent, tandis que le pronom explicite Ἡμεῖς met « nous » en relief.
- source_word: ὀφείλομεν
  choice: devons
  rationale: Exprime une obligation morale ou un devoir qui convient, dans une formulation française naturelle.
- source_word: εὐχαριστεῖν τῷ θεῷ πάντοτε περὶ ὑμῶν
  choice: toujours rendre grâce à Dieu pour vous
  rationale: Rend naturellement la formule paulinienne tout en conservant πάντοτε et le complément introduit par περί.
- source_word: ἀδελφοὶ
  choice: frères
  rationale: Reproduit le pluriel masculin grec; une note précise que l’interpellation peut viser toute la communauté croyante.
- source_word: ἠγαπημένοι ὑπὸ κυρίου
  choice: aimés par le Seigneur
  rationale: Préserve la valeur passive du participe et désigne clairement le Seigneur comme l’auteur de cet amour.
- source_word: εἵλατο
  choice: a choisis
  rationale: Le moyen de αἱρέομαι signifie ici choisir; cette formulation n’ajoute aucune théorie particulière de l’élection.
- source_word: ἀπαρχὴν
  choice: comme prémices
  rationale: Suit le texte imprimé du SBLGNT et conserve l’image cultuelle des premiers produits consacrés, sans adopter la variante « dès le commencement ».
- source_word: εἰς σωτηρίαν
  choice: pour le salut
  rationale: Exprime le but ou l’aboutissement indiqué par εἰς.
- source_word: ἐν ἁγιασμῷ πνεύματος
  choice: par la sanctification de l’Esprit
  rationale: « Par » rend la nuance instrumentale de ἐν; la majuscule indique que πνεῦμα est compris ici comme l’Esprit Saint, lecture favorisée par le contexte sotériologique.
- source_word: καὶ πίστει ἀληθείας
  choice: et par la foi en la vérité
  rationale: Interprète naturellement le génitif ἀληθείας comme objectif et répète « par » afin de rendre claire en français la coordination des deux moyens.
theological_decisions:
- issue: Sens de πνεύματος dans ἐν ἁγιασμῷ πνεύματος
  choice: l’Esprit Saint
  alternative: l’esprit humain
  rationale: Dans ce contexte paulinien relatif au salut, la sanctification attribuée à l’Esprit Saint est la lecture la plus probable. La traduction ne développe pas davantage cette interprétation que ne le fait le grec.
- issue: Portée de εἵλατο ὑμᾶς ὁ θεὸς
  choice: Dieu vous a choisis
  alternative: Dieu vous a pris pour lui / vous a désignés
  rationale: « Choisir » transmet directement le sens du verbe sans importer un système doctrinal particulier concernant l’élection.
- issue: Relation de ἀπαρχὴν au salut
  choice: comme prémices pour le salut
  alternative: dès le commencement pour le salut
  rationale: Le texte principal suit ἀπαρχήν dans le SBLGNT; l’autre formulation relève d’une variante textuelle importante et est signalée en note.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proche de la progression grecque tout en étant naturelle. « Rendre grâce », « prémices », « salut » et « sanctification » conservent le vocabulaire biblique nécessaire; les notes éclairent les deux points susceptibles d’être mal compris.
