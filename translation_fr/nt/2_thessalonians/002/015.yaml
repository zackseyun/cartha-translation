id: 2TH.2.15
reference: 2 Thessalonians 2:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἄρα οὖν, ἀδελφοί, στήκετε, καὶ κρατεῖτε τὰς παραδόσεις ἃς ἐδιδάχθητε εἴτε διὰ λόγου εἴτε δι’ ἐπιστολῆς ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/015.yaml
  text: So then[a], brothers, stand firm and hold fast to the traditions that you were taught, whether by word or by our letter.
translation:
  language: fr
  text: Ainsi donc, frères[a], tenez ferme et restez attachés aux traditions qui vous ont été enseignées, soit de vive voix, soit par une lettre de notre part.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « frères et sœurs » : le grec dit « frères », mais l’expression désigne vraisemblablement toute l’assemblée.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρα οὖν
  choice: Ainsi donc
  rationale: Les deux particules introduisent avec insistance la conclusion tirée de ce qui précède. « Ainsi donc » en conserve la force logique dans un français naturel et digne.
- source_word: ἀδελφοί
  choice: frères
  rationale: Le vocatif masculin pluriel signifie littéralement « frères ». Il est conservé dans le texte, tandis qu’une note indique que l’ensemble de l’assemblée est vraisemblablement visé.
- source_word: στήκετε
  choice: tenez ferme
  rationale: L’impératif présent appelle à une fermeté continue. « Tenez ferme » exprime idiomatiquement la stabilité et la persévérance.
- source_word: κρατεῖτε
  choice: restez attachés à
  rationale: Le verbe exprime l’idée de retenir fermement et de maintenir son adhésion. Cette tournure française garde la vigueur de l’impératif sans être artificielle.
- source_word: παραδόσεις
  choice: traditions
  rationale: Le nom désigne ce qui est transmis. « Traditions » préserve directement cette notion et convient au contraste entre transmission orale et écrite.
- source_word: ἐδιδάχθητε
  choice: qui vous ont été enseignées
  rationale: Le passif présente les Thessaloniciens comme destinataires de l’enseignement. L’accord avec « traditions » donne une formulation française claire.
- source_word: διὰ λόγου
  choice: de vive voix
  rationale: Dans son opposition à la lettre, λόγος désigne ici la communication orale. « De vive voix » rend ce contraste sans ambiguïté en français courant.
- source_word: δι’ ἐπιστολῆς ἡμῶν
  choice: par une lettre de notre part
  rationale: La formulation conserve le moyen écrit et la provenance apostolique exprimée par ἡμῶν, sans imposer que le grec désigne nécessairement une seule lettre déterminée.
theological_decisions:
- issue: Traduction de παράδοσις dans un passage invoqué dans les débats sur la tradition apostolique
  choice: traditions
  alternative: enseignements ; instructions
  rationale: Le grec désigne explicitement ce qui a été transmis et inclut ici une transmission tant orale qu’écrite. « Traditions » conserve cette portée lexicale sans projeter sur le verset des conclusions confessionnelles ultérieures concernant l’étendue ou l’autorité de la tradition.
- issue: Portée de ἀδελφοί dans une assemblée vraisemblablement mixte
  choice: frères dans le texte, avec une note inclusive
  alternative: frères et sœurs
  rationale: Le masculin du texte source est maintenu, tout en signalant que, dans cet emploi paulinien, l’interpellation vise vraisemblablement toute l’assemblée.
- issue: Caractère défini ou indéfini de ἐπιστολῆς sans article
  choice: une lettre de notre part
  alternative: notre lettre
  rationale: Le grec peut se comprendre comme une référence au moyen épistolaire ou à une lettre connue. L’indéfini français évite de préciser davantage que le texte tout en maintenant l’origine apostolique.
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme des deux impératifs est préservé, ainsi que le contraste net entre transmission orale et écrite.
