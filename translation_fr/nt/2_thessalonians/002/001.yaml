reference: 2 Thessalonians 2:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἐρωτῶμεν δὲ ὑμᾶς, ἀδελφοί, ὑπὲρ τῆς παρουσίας τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ καὶ ἡμῶν ἐπισυναγωγῆς ἐπ’ αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/001.yaml
  text: We ask you[a], brothers, concerning the coming of our Lord Jesus the Messiah and our gathering together to him[b],
translation:
  language: fr
  text: 'Nous vous demandons, frères[a], au sujet de la venue de notre Seigneur Jésus le Messie et de notre rassemblement auprès de lui :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Frères » est la forme d’adresse employée par Paul ; dans ce contexte, elle désigne vraisemblablement l’ensemble de la communauté croyante, femmes comprises.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐρωτῶμεν
  choice: Nous vous le demandons
  rationale: Le verbe introduit ici une demande pastorale. Cette tournure française est naturelle et conserve une force plus douce que « nous vous exhortons ».
- source_word: δὲ
  choice: non rendu séparément
  rationale: La particule marque une transition légère. En français, l’enchaînement du contexte peut la porter sans ajouter artificiellement « maintenant » ou créer un contraste appuyé.
- source_word: ἀδελφοί
  choice: frères
  rationale: Le vocatif masculin est conservé dans le texte, tandis qu’une note précise qu’il vise vraisemblablement toute la communauté croyante.
- source_word: ὑπὲρ
  choice: au sujet de
  rationale: La préposition introduit ici le thème de la demande. « Au sujet de » est clair et idiomatique.
- source_word: παρουσίας
  choice: venue
  rationale: Dans ce contexte eschatologique, παρουσία désigne la venue future du Seigneur plutôt que sa simple présence.
- source_word: κυρίου
  choice: Seigneur
  rationale: Ce titre établi conserve l’idée d’autorité et sa portée théologique néotestamentaire.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jésus le Messie
  rationale: Χριστός garde ici sa valeur de titre. L’article français rend la formulation idiomatique sans postuler un article grec devant Χριστοῦ.
- source_word: ἐπισυναγωγῆς
  choice: rassemblement
  rationale: Le nom désigne le fait d’être réunis; « rassemblement » est naturel et évite les connotations institutionnelles possibles d’« assemblée ».
- source_word: ἐπ’ αὐτόν
  choice: auprès de lui
  rationale: La formule exprime l’orientation et le rassemblement vers le Christ. « Auprès de lui » convient idiomatiquement au nom « rassemblement » et suggère la réunion en sa présence sans préciser davantage sa modalité.
theological_decisions:
- issue: Rendu de Χριστοῦ dans le titre christologique
  choice: le Messie
  alternative: le Christ
  rationale: Dans la séquence complète « notre Seigneur Jésus Χριστός », le sens titulaire demeure perceptible; « Messie » en conserve le contenu plutôt que de traiter automatiquement Χριστός comme un simple nom propre.
- issue: Portée de ἀδελφοί
  choice: frères dans le texte, avec clarification en note
  alternative: frères et sœurs
  rationale: Le masculin grammatical de la forme d’adresse est préservé, sans occulter qu’en contexte paulinien l’ensemble de la communauté est probablement concerné.
- issue: Rapport entre la venue et le rassemblement
  choice: deux réalités coordonnées par « et »
  alternative: notre rassemblement lors de sa venue
  rationale: Le grec coordonne les deux groupes nominaux sans préciser leur rapport temporel ou logique exact. La traduction ne leur impose donc aucun scénario eschatologique particulier.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase se termine par deux-points parce que le verset introduit la demande développée au verset suivant. Le texte évite un « maintenant » initial, inutile en français pour rendre la transition légère de δέ.
