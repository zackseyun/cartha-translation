  text: οὗ ἐστιν ἡ παρουσία κατ’ ἐνέργειαν τοῦ Σατανᾶ ἐν πάσῃ δυνάμει καὶ σημείοις καὶ τέρασιν ψεύδους
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/009.yaml
  text: whose coming is according to the working of Satan[b][a], with all power and signs and wonders of falsehood.
translation:
  language: fr
  text: Sa venue[a] a lieu conformément à l’action de Satan, avec toute puissance, avec des signes et des prodiges de mensonge[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « présence » ou « arrivée ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « avec toute puissance, signes et prodiges de mensonge » ; on peut aussi traduire : « des prodiges mensongers ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗ
  choice: Sa
  rationale: Le pronom relatif au génitif renvoie à « l’être sans loi » du verset précédent. En français, le possessif assure une liaison naturelle avec cet antécédent.
- source_word: παρουσία
  choice: venue
  rationale: Dans ce contexte eschatologique, le mot désigne l’arrivée ou l’avènement du personnage, sans exclure entièrement la nuance de présence.
- source_word: κατ’ ἐνέργειαν
  choice: conformément à l’action
  rationale: Cette formulation conserve l’idée que la venue correspond à l’activité opérante de Satan, sans réduire la relation à une simple cause instrumentale.
- source_word: τοῦ Σατανᾶ
  choice: de Satan
  rationale: La translittération traditionnelle du nom propre est claire en français; le génitif rattache l’action à Satan.
- source_word: ἐν πάσῃ δυνάμει
  choice: avec toute puissance
  rationale: La préposition introduit ici ce qui accompagne ou caractérise la venue. « Toute puissance » conserve la portée globale de πάσῃ sans limiter δυνάμει à des miracles particuliers.
- source_word: σημείοις
  choice: des signes
  rationale: « Signes » est l’équivalent français courant et garde la notion de phénomènes à valeur significative ou probante.
- source_word: τέρασιν
  choice: des prodiges
  rationale: « Prodiges » rend naturellement les phénomènes extraordinaires et forme avec « signes » une paire française biblique mais encore actuelle.
- source_word: ψεύδους
  choice: marqués par le mensonge
  rationale: Cette expression rend le génitif de caractérisation sans décider que les phénomènes sont nécessairement de simples trucages. Elle permet de comprendre qu’ils appartiennent au domaine du mensonge ou servent la tromperie.
theological_decisions:
- issue: Nature des phénomènes sataniques
  choice: La puissance, les signes et les prodiges sont caractérisés par le mensonge, sans que leur nature métaphysique soit précisée.
  alternative: Les phénomènes seraient soit de purs trucages, soit d’authentiques miracles surnaturels produits par Satan.
  rationale: Le grec associe ces manifestations à l’action de Satan et au mensonge, mais ne tranche pas explicitement entre illusion totale et puissance réelle employée pour tromper.
translation_notes:
  register: Français international moderne, digne et accessible. « Conformément à l’action » maintient la relation exprimée par κατά; « marqués par le mensonge » préserve l’ambiguïté du génitif ψεύδους et évite d’affirmer que les prodiges sont forcément fictifs.
