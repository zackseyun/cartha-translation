id: 2TH.2.4
reference: 2 Thessalonians 2:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ ἀντικείμενος καὶ ὑπεραιρόμενος ἐπὶ πάντα λεγόμενον θεὸν ἢ σέβασμα, ὥστε αὐτὸν εἰς τὸν ναὸν τοῦ ⸀θεοῦ καθίσαι ἀποδεικνύντα ἑαυτὸν ὅτι ἔστιν θεός.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/004.yaml
  text: the one who opposes and exalts himself over every so-called god or object of worship[a], so that he takes his seat in the temple of God[b], displaying himself as being God.
translation:
  language: fr
  text: lui qui s’oppose et s’élève au-dessus de tout ce qui est appelé dieu ou qui fait l’objet d’un culte, au point de prendre place dans le temple de Dieu[b], se présentant lui-même comme Dieu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « se présentant lui-même comme un dieu ».'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « sanctuaire de Dieu ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἀντικείμενος
  choice: lui qui s’oppose
  rationale: Le participe présent substantivé désigne celui qui s’oppose de façon active, sans en faire un titre technique absent du grec.
- source_word: ὑπεραιρόμενος
  choice: s’élève au-dessus de
  rationale: Cette formulation naturelle conserve la valeur réfléchie du participe et l’idée de supériorité revendiquée.
- source_word: ἐπὶ πάντα λεγόμενον θεὸν
  choice: au-dessus de tout ce qui est appelé dieu
  rationale: Après le verbe d’élévation, ἐπί avec l’accusatif exprime ici la supériorité. « est appelé dieu » restitue λεγόμενον sans reconnaître comme réellement divin ce qui porte ce nom.
- source_word: σέβασμα
  choice: qui fait l’objet d’un culte
  rationale: Le terme désigne largement ce qui reçoit une vénération religieuse, sans se limiter à une divinité. La tournure française évite l’enchaînement peu naturel « appelé […] objet de culte ».
- source_word: ὥστε
  choice: au point de
  rationale: La locution introduit naturellement en français le résultat auquel aboutit l’opposition et l’auto-exaltation décrites auparavant.
- source_word: εἰς τὸν ναὸν τοῦ θεοῦ
  choice: dans le temple de Dieu
  rationale: Avec καθίσαι, εἰς peut être rendu idiomatiquement par « dans ». ναός désigne le temple, plus précisément son sanctuaire, mais « temple de Dieu » reste clair sans trancher la nature littérale ou figurée de l’image.
- source_word: καθίσαι
  choice: prendre place
  rationale: Cette expression traduit l’acte délibéré de s’asseoir et laisse percevoir sa portée de prétention à une position d’autorité.
- source_word: ἀποδεικνύντα ἑαυτὸν
  choice: se présentant lui-même
  rationale: Le participe exprime une manifestation ou une présentation publique de soi. Ce choix n’ajoute pas l’idée d’une proclamation verbale formelle.
- source_word: ὅτι ἔστιν θεός
  choice: comme Dieu
  rationale: Dans ce contexte culminant, le θεός sans article exprime la prétention divine du personnage. La formulation française décrit sa revendication sans l’affirmer comme vraie.
theological_decisions:
- issue: Faut-il rendre le dernier θεός par « Dieu » ou par « un dieu » ?
  choice: Dieu
  alternative: un dieu
  rationale: Le personnage prend place dans le temple de Dieu et s’y présente avec la prétention divine la plus élevée. « Dieu » rend bien cette portée blasphématoire sans affirmer que sa prétention est vraie. Comme θεός est sans article, « un dieu » demeure grammaticalement possible et figure en note.
- issue: Faut-il rendre ναός plus précisément par « sanctuaire » ?
  choice: temple de Dieu
  alternative: sanctuaire de Dieu
  rationale: ναός peut viser le sanctuaire proprement dit, mais « temple de Dieu » est plus naturel et transparent en français courant. Il préserve aussi l’ambiguïté quant au caractère littéral ou figuré du lieu.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve l’élan d’une seule proposition et la progression vers la prétention finale, sans introduire de titre doctrinal ni résoudre l’identité du temple.
