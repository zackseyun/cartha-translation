id: 2TH.2.16
reference: 2 Thessalonians 2:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Αὐτὸς δὲ ὁ κύριος ἡμῶν Ἰησοῦς Χριστὸς καὶ ⸀θεὸς ⸀ὁ πατὴρ ἡμῶν, ὁ ἀγαπήσας ἡμᾶς καὶ δοὺς παράκλησιν αἰωνίαν καὶ ἐλπίδα ἀγαθὴν ἐν χάριτι,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/016.yaml
  text: May our Lord Jesus the Messiah himself[a], and God our Father, who loved us and gave us eternal encouragement and good hope by grace,
translation:
  language: fr
  text: Que notre Seigneur Jésus le Messie lui-même, et Dieu notre Père, qui nous a aimés et nous a donné un réconfort éternel[a] ainsi qu’une bonne espérance par grâce,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une consolation éternelle » ou « un encouragement éternel ».
    reason: παράκλησις possède une gamme de sens comprenant le réconfort, la consolation et l’encouragement.
lexical_decisions:
- source_word: Αὐτὸς
  choice: lui-même
  rationale: L’emploi intensif de αὐτός souligne l’action personnelle du Seigneur Jésus. « Lui-même » conserve naturellement cette insistance en français.
- source_word: δὲ
  choice: non exprimé séparément
  rationale: δέ marque ici une transition légère vers la prière. Dans ce fragment français dépendant du verset suivant, ajouter « maintenant » introduirait une valeur temporelle absente du grec, tandis que « mais » suggérerait un contraste trop fort.
- source_word: κύριος
  choice: Seigneur
  rationale: Équivalent français courant et consacré de κύριος dans ce titre christologique.
- source_word: Ἰησοῦς Χριστός
  choice: Jésus le Messie
  rationale: Χριστός conserve ici sa valeur de titre. « Le Messie » en communique le sens dans un français idiomatique plutôt que de le traiter uniquement comme un nom propre.
- source_word: θεὸς ὁ πατὴρ ἡμῶν
  choice: Dieu notre Père
  rationale: Cette formulation naturelle conserve à la fois θεός et πατήρ ainsi que leur relation appositionnelle.
- source_word: ὁ ἀγαπήσας
  choice: qui nous a aimés
  rationale: Le participe aoriste substantivé est rendu par une proposition relative au passé composé, forme naturelle en français moderne sans surinterprétation aspectuelle.
- source_word: δοὺς
  choice: nous a donné
  rationale: Le participe aoriste coordonné à ἀγαπήσας est rendu dans la même proposition relative et avec le même temps.
- source_word: παράκλησιν
  choice: un réconfort
  rationale: παράκλησις peut exprimer le réconfort, la consolation ou l’encouragement. « Réconfort » convient au contexte où les croyants doivent être affermis, tout en restant naturel en français; les autres possibilités sont signalées en note.
- source_word: αἰωνίαν
  choice: éternel
  rationale: « Éternel » exprime directement la portée durable de αἰώνιος.
- source_word: ἐλπίδα ἀγαθὴν
  choice: une bonne espérance
  rationale: La traduction conserve l’adjectif positif ἀγαθή et emploie la formulation française biblique mais toujours compréhensible « bonne espérance ».
- source_word: ἐν χάριτι
  choice: par grâce
  rationale: La préposition ἐν peut ici indiquer le moyen ou le fondement du don. « Par grâce » est concis, naturel et ne précise pas davantage que le texte grec.
theological_decisions:
- issue: Accord au singulier des participes ὁ ἀγαπήσας et δούς après les sujets coordonnés « notre Seigneur Jésus le Messie » et « Dieu notre Père »
  choice: 'Conserver une proposition relative au singulier : « qui nous a aimés et nous a donné »'
  alternative: Employer le pluriel « qui nous ont aimés et nous ont donné », ou expliciter que la relative se rapporte seulement à Dieu le Père
  rationale: Le grec coordonne les deux sujets, puis emploie des modificateurs au singulier. Le singulier français maintient cette particularité et laisse subsister l’ambiguïté de rattachement sans imposer une conclusion christologique ni réserver explicitement les actions au Père.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase reste volontairement ouverte par une virgule, puisque le souhait commencé au verset 16 reçoit son verbe principal au verset 17. Le singulier de la relative, légèrement marqué après deux sujets coordonnés, reproduit une tension syntaxique réelle du grec.
