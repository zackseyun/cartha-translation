  text: οὐ μνημονεύετε ὅτι ἔτι ὢν πρὸς ὑμᾶς ταῦτα ἔλεγον ὑμῖν;
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/005.yaml
  text: Do you not remember that while I was still with you, I was telling you these things?
translation:
  language: fr
  text: Ne vous souvenez-vous pas que, lorsque j’étais encore avec vous, je vous disais ces choses ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μνημονεύετε
  choice: vous souvenez-vous
  rationale: Le verbe appelle les destinataires à se rappeler un enseignement antérieur. « Se souvenir » est l’équivalent courant et naturel en français, ici dans une question rhétorique.
- source_word: ἔτι
  choice: encore
  rationale: Avec le participe ὢν, l’adverbe indique que Paul se trouvait toujours auprès d’eux à l’époque évoquée.
- source_word: ὢν πρὸς ὑμᾶς
  choice: lorsque j’étais encore avec vous
  rationale: La tournure exprime la présence personnelle de Paul auprès des Thessaloniciens; la subordonnée temporelle est naturelle en français.
- source_word: ταῦτα
  choice: ces choses
  rationale: Le démonstratif pluriel renvoie aux éléments enseignés dans le contexte et en conserve explicitement le pluriel.
- source_word: ἔλεγον
  choice: je vous disais
  rationale: L’imparfait français rend naturellement l’aspect duratif ou répétitif de l’imparfait grec, sans imposer que Paul l’ait dit une seule fois.
- source_word: οὐ ... ὅτι
  choice: Ne vous souvenez-vous pas que… ?
  rationale: Cette construction rend directement la question rhétorique négative et introduit naturellement en français le contenu dont les lecteurs devraient se souvenir.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve la question rhétorique ainsi que la valeur continue ou répétée de l’imparfait ἔλεγον.
