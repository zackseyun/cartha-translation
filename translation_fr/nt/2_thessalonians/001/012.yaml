source:
  edition: SBLGNT
  text: ὅπως ἐνδοξασθῇ τὸ ὄνομα τοῦ κυρίου ἡμῶν Ἰησοῦ ἐν ὑμῖν, καὶ ὑμεῖς ἐν αὐτῷ, κατὰ τὴν χάριν τοῦ θεοῦ ἡμῶν καὶ κυρίου Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/012.yaml
  text: so that the name of our Lord Jesus may be glorified in you[a], and you in him[c][b], according to the grace of our God and the Lord Jesus the Messiah.
translation:
  language: fr
  text: afin que le nom de notre Seigneur Jésus soit glorifié en vous[a], et vous en lui, selon la grâce de notre Dieu et du Seigneur Jésus-Christ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « parmi vous ». La préposition grecque peut exprimer l'une ou l'autre nuance dans ce contexte.
    reason: lexical_alternative
  - marker: b
    text: 'La fin de la phrase peut aussi être comprise comme une expression étroitement unifiée : « selon la grâce de notre Dieu et Seigneur Jésus-Christ ». Le grec permet également de distinguer « notre Dieu » et « le Seigneur Jésus-Christ ». « Christ » signifie « Messie ».'
    reason: alternative_reading
lexical_decisions:
- source_word: ὅπως
  choice: afin que
  rationale: Introduit le but ou le résultat recherché de la prière précédente, avec une tournure naturelle et digne en français.
- source_word: ἐνδοξασθῇ
  choice: soit glorifié
  rationale: Conserve la voix passive et la portée du vocabulaire de la gloire, tout en rendant naturellement le subjonctif grec après la proposition finale.
- source_word: τὸ ὄνομα
  choice: le nom
  rationale: Maintient la formulation biblique et sa valeur métonymique possible — identité révélée, personne et réputation — sans l'expliciter dans le corps du texte.
- source_word: τοῦ κυρίου ἡμῶν Ἰησοῦ
  choice: de notre Seigneur Jésus
  rationale: Rend fidèlement le titre κύριος et la relation possessive dans l'ordre français le plus naturel.
- source_word: ἐν ὑμῖν
  choice: en vous
  rationale: Préserve au plus près la préposition ἐν; avec le pluriel, « parmi vous » demeure également possible et est signalé en note.
- source_word: καὶ ὑμεῖς ἐν αὐτῷ
  choice: et vous en lui
  rationale: Conserve le parallélisme réciproque. Le masculin αὐτῷ renvoie le plus naturellement au Seigneur Jésus plutôt qu'au nom.
- source_word: κατὰ τὴν χάριν
  choice: selon la grâce
  rationale: Reproduit la valeur de norme ou de fondement de κατά sans réduire la formule à une simple valeur instrumentale.
- source_word: τοῦ θεοῦ ἡμῶν καὶ κυρίου Ἰησοῦ Χριστοῦ
  choice: de notre Dieu et Seigneur Jésus-Christ
  rationale: La formulation compacte respecte l'article grec unique et le lien syntaxique étroit entre les deux désignations, sans ajouter un second article qui imposerait deux référents distincts. « Jésus-Christ » est idiomatique en français tout en conservant le titre traditionnel.
theological_decisions:
- issue: Référent de αὐτῷ
  choice: « lui », renvoyant au Seigneur Jésus
  alternative: « lui », compris comme renvoyant au nom, malgré le genre grammatical français
  rationale: Le pronom grec masculin et le mouvement réciproque — le Seigneur glorifié dans les croyants, les croyants en lui — favorisent nettement la référence à Jésus, sans nécessiter de paraphrase.
- issue: Portée de la proposition génitive finale
  choice: 'Expression étroitement liée : « notre Dieu et Seigneur Jésus-Christ »'
  alternative: 'Deux référents distincts : « notre Dieu et le Seigneur Jésus-Christ »'
  rationale: L'article unique devant θεοῦ et la coordination avec κυρίου Ἰησοῦ Χριστοῦ favorisent une désignation étroitement unifiée. La traduction suit cette syntaxe sans développer explicitement son implication christologique; la variante est documentée en note.
- issue: Rendu de Χριστοῦ
  choice: Christ, dans le nom-titre français établi « Jésus-Christ »
  alternative: Messie, soit « Jésus le Messie »
  rationale: En français moderne, « Jésus-Christ » est la forme épistolaire naturelle et reconnue; « Christ » translittère le titre grec Χριστός, tandis que « Messie » en explicite le sens. La note conserve cette transparence lexicale.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La formulation conserve le parallélisme et la densité théologique du grec. « En vous » garde l'ambiguïté individuelle et collective de ἐν ὑμῖν; « parmi vous » est donné en note. Le trait d'union de « Jésus-Christ » suit l'usage français établi.
