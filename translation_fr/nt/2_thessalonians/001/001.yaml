id: 2TH.1.1
reference: 2 Thessalonians 1:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Παῦλος καὶ Σιλουανὸς καὶ Τιμόθεος τῇ ἐκκλησίᾳ Θεσσαλονικέων ἐν θεῷ πατρὶ ἡμῶν καὶ κυρίῳ Ἰησοῦ Χριστῷ·
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/001.yaml
  text: 'Paul and Silvanus and Timothy[b][a], to the church of the Thessalonians in God our Father and the Lord Jesus the Messiah:'
translation:
  language: fr
  text: 'Paul, Silvain et Timothée, à l’Église des Thessaloniciens qui est en Dieu notre Père et dans le Seigneur Jésus, le Messie[a] :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Jésus-Christ ». Le titre grec Χριστός peut se traduire par « Messie » ou, selon la formulation traditionnelle, par « Christ ».
    reason: alternative_reading
lexical_decisions:
- source_word: Παῦλος
  choice: Paul
  rationale: Forme française traditionnelle et standard du nom grec Παῦλος.
- source_word: Σιλουανὸς
  choice: Silvain
  rationale: Forme française usuelle correspondant directement à Σιλουανός; elle évite d’harmoniser avec la forme abrégée « Silas » employée dans les Actes.
- source_word: Τιμόθεος
  choice: Timothée
  rationale: Forme française traditionnelle et standard du nom grec Τιμόθεος.
- source_word: ἐκκλησίᾳ
  choice: Église
  rationale: Dans l’usage épistolaire paulinien, le terme désigne la communauté chrétienne; « Église » est l’équivalent français courant et digne.
- source_word: Θεσσαλονικέων
  choice: des Thessaloniciens
  rationale: Le génitif pluriel désigne les personnes; cette formulation conserve cette référence plutôt que de la remplacer par un simple lieu.
- source_word: ἐν
  choice: qui est en … et dans
  rationale: La préposition est conservée afin de ne pas réduire l’idée à l’appartenance ou à l’établissement. La reprise de « dans » devant le second complément rend la coordination claire en français.
- source_word: θεῷ πατρὶ ἡμῶν
  choice: Dieu notre Père
  rationale: Cette traduction maintient le possessif explicite ἡμῶν et la relation paternelle sans transformer l’expression en titre figé.
- source_word: κυρίῳ
  choice: Seigneur
  rationale: Équivalent français normal de κύριος lorsqu’il est employé comme titre de Jésus.
- source_word: Χριστῷ
  choice: le Messie
  rationale: « Messie » traduit la valeur titulaire de Χριστός; l’article français est requis par l’usage naturel dans l’apposition « Jésus, le Messie ».
theological_decisions:
- issue: Traduction de Χριστῷ dans la séquence Ἰησοῦ Χριστῷ
  choice: Jésus, le Messie
  alternative: Jésus-Christ
  rationale: Le choix principal fait entendre Χριστός comme un titre tout en restant idiomatique en français. La forme traditionnelle « Jésus-Christ » demeure indiquée en note.
- issue: Relation exprimée par ἐν θεῷ πατρὶ ἡμῶν καὶ κυρίῳ Ἰησοῦ Χριστῷ
  choice: qui est en Dieu notre Père et dans le Seigneur Jésus, le Messie
  alternative: qui appartient à Dieu notre Père et au Seigneur Jésus, le Messie
  rationale: Le maintien de « en/dans » préserve l’ambiguïté féconde de la formule grecque, qui peut évoquer la sphère, l’union ou l’enracinement, sans imposer une seule interprétation.
translation_notes:
  register: Français international moderne, naturel et digne. « Silvain » suit directement le nom du texte grec. La relative « qui est » clarifie en français le rattachement de la formule prépositionnelle à l’Église, tandis que « en Dieu … et dans le Seigneur » conserve la tension théologique de l’original.
