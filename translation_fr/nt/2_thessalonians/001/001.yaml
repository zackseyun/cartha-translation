  source_fidelity: 'Le texte français rend fidèlement tous les constituants grecs : les trois expéditeurs, le destinataire (« l’Église des Thessaloniciens »), ainsi que la formule relationnelle ἐν avec Dieu notre Père et le Seigneur Jésus, le Messie. La relative « qui est » est une explicitation syntaxique française légitime du rattachement de la formule à l’Église et ne résout pas indûment la valeur de ἐν.'
