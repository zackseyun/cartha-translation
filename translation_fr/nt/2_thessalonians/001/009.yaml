id: 2TH.1.9
reference: 2 Thessalonians 1:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οἵτινες δίκην τίσουσιν ὄλεθρον αἰώνιον ἀπὸ προσώπου τοῦ κυρίου καὶ ἀπὸ τῆς δόξης τῆς ἰσχύος αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/009.yaml
  text: These will pay the penalty of eternal destruction[a], away from the presence of the Lord and from the glory of his might,
translation:
  language: fr
  text: Ils subiront la peine d’une destruction éternelle, loin de la présence du Seigneur et de la gloire de sa puissance[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou peut-être : « une destruction qui vient de la présence du Seigneur et de la gloire de sa puissance ». La préposition grecque peut exprimer soit la séparation (« loin de »), soit la provenance (« venant de »).'
    reason: alternative_reading
lexical_decisions:
- source_word: οἵτινες
  choice: Ils
  rationale: Le pronom reprend naturellement en français les personnes mentionnées au verset précédent, sans surcharger la nuance qualitative possible de ὅστις.
- source_word: δίκην τίσουσιν
  choice: subiront comme peine
  rationale: L’expression grecque désigne le fait d’encourir une sanction judiciaire. Cette formulation française conserve le cadre pénal tout en restant naturelle.
- source_word: ὄλεθρον
  choice: destruction
  rationale: « Destruction » rend clairement la gravité du terme dans ce contexte de jugement, sans préciser indûment la nature exacte du châtiment final.
- source_word: αἰώνιον
  choice: éternelle
  rationale: Dans ce contexte eschatologique, « éternelle » est la formulation française la plus naturelle et exprime le caractère durable et définitif du jugement.
- source_word: ἀπὸ προσώπου τοῦ κυρίου
  choice: loin de la présence du Seigneur
  rationale: ἀπό peut exprimer l’éloignement ou la séparation, tandis que πρόσωπον est rendu idiomatiquement par « présence ». L’autre sens possible, celui de provenance, est conservé en note.
- source_word: καὶ ἀπὸ τῆς δόξης τῆς ἰσχύος αὐτοῦ
  choice: et de la gloire de sa puissance
  rationale: « Gloire » correspond à δόξα et « puissance » rend ἰσχύς dans un français actuel et digne. Le génitif désigne la gloire appartenant à sa puissance ou la manifestant.
theological_decisions:
- issue: Sens de ἀπό dans le jugement final
  choice: 'séparation ou exclusion : « loin de la présence du Seigneur »'
  alternative: 'provenance : une destruction qui vient de la présence du Seigneur et de la gloire de sa puissance'
  rationale: La préposition grecque permet les deux analyses. Le texte principal retient la lecture traditionnelle et contextuellement forte de la séparation, mais la lecture de provenance, grammaticalement possible et théologiquement significative, est explicitement préservée en note.
- issue: Portée de « destruction éternelle »
  choice: traduction directe sans définir le mode précis du châtiment final
  alternative: interprétation comme anéantissement ou comme châtiment conscient éternel
  rationale: L’expression grecque énonce la peine sans trancher à elle seule le débat doctrinal plus large sur sa nature précise. La traduction évite donc d’importer une conclusion confessionnelle.
translation_notes:
  register: Français international moderne, clair et digne. « Subiront comme peine » maintient la dimension judiciaire sans calque maladroit; « loin de la présence » formule naturellement la lecture de séparation. La note conserve l’ambiguïté réelle de la préposition grecque.
