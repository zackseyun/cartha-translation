  text: καὶ ὑμῖν τοῖς θλιβομένοις ἄνεσιν μεθ’ ἡμῶν ἐν τῇ ἀποκαλύψει τοῦ κυρίου Ἰησοῦ ἀπ’ οὐρανοῦ μετ’ ἀγγέλων δυνάμεως αὐτοῦ
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/007.yaml
  text: and to you who are being afflicted[a], relief with us at the revelation of the Lord Jesus from heaven with his mighty angels.
translation:
  language: fr
  text: et à vous qui êtes affligés, le soulagement avec nous, lorsque le Seigneur Jésus se révélera du ciel avec les anges de sa puissance[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus idiomatiquement : « avec ses anges puissants ».'
    reason: alternative_lexicale
lexical_decisions:
- source_word: θλιβομένοις
  choice: qui êtes opprimés
  rationale: Le participe présent passif désigne ceux qui subissent actuellement une pression ou une détresse imposée. « Êtes opprimés » conserve le sens passif sans réduire le terme à une émotion intérieure.
- source_word: ἄνεσιν
  choice: le soulagement
  rationale: Le mot exprime le relâchement d’une pression et contraste directement avec l’oppression présente. « Soulagement » convient mieux ici que « repos », qui pourrait suggérer seulement un état intérieur.
- source_word: μεθ’ ἡμῶν
  choice: avec nous
  rationale: Cette formulation simple conserve l’association de Paul et de ses collaborateurs avec les destinataires dans le même soulagement promis.
- source_word: ἐν τῇ ἀποκαλύψει
  choice: lorsque … se révélera
  rationale: La préposition avec le nom d’événement a ici une valeur temporelle. La tournure verbale est naturelle en français et rend clairement le moment auquel le soulagement sera accordé.
- source_word: ἀποκαλύψει
  choice: se révélera
  rationale: Le verbe français restitue l’idée de dévoilement ou de manifestation portée par le nom grec, sans affaiblir sa portée eschatologique.
- source_word: κυρίου
  choice: Seigneur
  rationale: « Seigneur » conserve la valeur de titre de κύριος et correspond à l’usage établi du Nouveau Testament.
- source_word: ἀπ’ οὐρανοῦ
  choice: du ciel
  rationale: La préposition ἀπό marque ici la provenance. « Du ciel » est l’expression française naturelle dans ce contexte.
- source_word: μετ’ ἀγγέλων δυνάμεως αὐτοῦ
  choice: avec les anges de sa puissance
  rationale: 'Cette formulation garde la structure génitivale condensée du grec et laisse ouverte la nuance précise : anges puissants ou anges associés à la puissance du Seigneur.'
theological_decisions:
- issue: Sens du groupe génitival ἀγγέλων δυνάμεως αὐτοῦ
  choice: avec les anges de sa puissance
  alternative: avec ses anges puissants
  rationale: Le grec permet une lecture qualitative, mais sa construction peut aussi présenter les anges comme liés à la puissance du Seigneur. Le texte principal préserve cette tension, tandis que la note donne la formulation idiomatique possible.
- issue: Valeur temporelle de ἐν τῇ ἀποκαλύψει
  choice: lorsque le Seigneur Jésus se révélera
  alternative: lors de la révélation du Seigneur Jésus
  rationale: La tournure verbale exprime naturellement en français la valeur temporelle du groupe grec tout en conservant l’idée d’un dévoilement eschatologique.
translation_notes:
  register: Français international moderne, clair et digne. La phrase reste liée syntaxiquement au verset précédent, comme dans le grec. La formulation « anges de sa puissance » est volontairement plus formelle afin de ne pas effacer l’ambiguïté du génitif.
