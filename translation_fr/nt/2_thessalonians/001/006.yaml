id: 2TH.1.6
reference: 2 Thessalonians 1:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἴπερ δίκαιον παρὰ θεῷ ἀνταποδοῦναι τοῖς θλίβουσιν ὑμᾶς θλῖψιν
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/006.yaml
  text: since it is just before God to repay affliction to those who afflict you[a]
translation:
  language: fr
  text: puisqu’il est juste devant Dieu de rendre l’affliction à ceux qui vous affligent[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « si du moins il est juste auprès de Dieu de rendre l’affliction à ceux qui vous affligent ».
    reason: La variante rend plus formellement la nuance conditionnelle de εἴπερ et la tournure παρὰ θεῷ.
lexical_decisions:
- source_word: εἴπερ
  choice: puisque
  rationale: Dans ce contexte, la particule introduit une prémisse tenue pour vraie à des fins rhétoriques plutôt qu’une condition incertaine. « Puisque » exprime naturellement ce lien logique.
- source_word: δίκαιον
  choice: juste
  rationale: Le terme qualifie ce qui est conforme à la justice dans le jugement de Dieu. « Juste » convient au contexte judiciaire et reste naturel en français moderne.
- source_word: παρὰ θεῷ
  choice: devant Dieu
  rationale: L’expression présente cette justice selon l’évaluation de Dieu. « Devant Dieu » est idiomatique et conserve cette relation au jugement divin sans développer le sens dans le corps du texte.
- source_word: ἀνταποδοῦναι
  choice: rendre
  rationale: Le verbe exprime le fait de donner en retour. « Rendre » communique sobrement l’idée de rétribution et permet de conserver la construction concise du grec.
- source_word: τοῖς θλίβουσιν ὑμᾶς
  choice: à ceux qui vous affligent
  rationale: « Affliger » traduit la pression et la souffrance infligées et maintient le lien lexical avec θλῖψιν dans la même proposition.
- source_word: θλῖψιν
  choice: l’affliction
  rationale: « Affliction » exprime une souffrance grave et préserve la répétition intentionnelle entre le mal infligé et celui rendu, sans préciser davantage sa forme ou son moment.
theological_decisions:
- issue: Nature de la rétribution divine
  choice: Le texte affirme qu’il est juste pour Dieu de rendre l’affliction aux persécuteurs, sans préciser ici le moment ni la forme complète de ce jugement.
  alternative: Comprendre cette affliction comme exclusivement eschatologique, ou comme englobant aussi des jugements historiques présents.
  rationale: La proposition grecque affirme la justice de la rétribution divine, mais ne tranche pas à elle seule toutes les questions relatives à son calendrier ou à ses modalités. La traduction demeure donc générale.
- issue: Force de εἴπερ
  choice: Traduire par « puisque » dans le texte principal.
  alternative: « si du moins » ou « s’il est vrai que »
  rationale: Paul présente vraisemblablement la justice de Dieu comme une prémisse admise, mais la forme grecque conserve une nuance conditionnelle que la note signale.
translation_notes:
  register: Français international moderne, sobre et digne. La répétition « affliction / affligent » est conservée afin de refléter le jeu lexical θλῖψιν / θλίβουσιν du grec. La proposition reste syntaxiquement liée au contexte précédent, comme dans la source.
