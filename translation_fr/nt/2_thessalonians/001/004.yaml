id: 2TH.1.4
reference: 2 Thessalonians 1:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὥστε ⸂αὐτοὺς ἡμᾶς⸃ ἐν ὑμῖν ⸀ἐγκαυχᾶσθαι ἐν ταῖς ἐκκλησίαις τοῦ θεοῦ ὑπὲρ τῆς ὑπομονῆς ὑμῶν καὶ πίστεως ἐν πᾶσιν τοῖς διωγμοῖς ὑμῶν καὶ ταῖς θλίψεσιν αἷς ἀνέχεσθε,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/004.yaml
  text: so that we ourselves boast about you among the churches of God because of your perseverance and faith in all your persecutions and afflictions that you are enduring,[a]
translation:
  language: fr
  text: si bien que nous-mêmes, nous nous vantons de vous dans les Églises de Dieu, à cause de votre persévérance et de votre foi[a] au milieu de toutes les persécutions et détresses que vous endurez.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « fidélité » : le mot grec peut désigner aussi bien la foi que la fidélité persévérante, notamment dans un contexte de souffrance.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὥστε
  choice: si bien que
  rationale: Introduit ici le résultat de ce qui précède et s’intègre naturellement à la syntaxe française.
- source_word: αὐτοὺς ἡμᾶς
  choice: nous-mêmes, nous
  rationale: La dislocation avec reprise pronominale restitue avec naturel l’insistance du grec sur Paul et ses compagnons.
- source_word: ἐν ὑμῖν ἐγκαυχᾶσθαι
  choice: nous sommes fiers de vous
  rationale: Exprime idiomatiquement en français le fait de se glorifier au sujet de quelqu’un, sans suggérer ici une vantardise condamnable.
- source_word: ἐν ταῖς ἐκκλησίαις τοῦ θεοῦ
  choice: parmi les Églises de Dieu
  rationale: Rend la sphère communautaire dans laquelle Paul parle des Thessaloniciens; la majuscule distingue ici les communautés chrétiennes locales.
- source_word: ὑπὲρ
  choice: à cause de
  rationale: Introduit le motif de cette fierté.
- source_word: ὑπομονῆς
  choice: persévérance
  rationale: Désigne l’endurance ferme et patiente sous la pression.
- source_word: πίστεως
  choice: foi
  rationale: Conserve le sens courant de πίστις tout en laissant en note la nuance contextuellement plausible de fidélité.
- source_word: ἐν πᾶσιν τοῖς διωγμοῖς ὑμῶν καὶ ταῖς θλίψεσιν
  choice: au milieu de toutes les persécutions et les détresses
  rationale: « Au milieu de » exprime clairement les circonstances; « persécutions » désigne l’hostilité subie et « détresses » les pressions et épreuves plus larges.
- source_word: αἷς ἀνέχεσθε
  choice: que vous endurez
  rationale: Rend l’expérience continue exprimée par le présent grec dans un français direct et naturel.
theological_decisions:
- issue: Sens de πίστις dans un contexte de souffrance
  choice: foi
  alternative: fidélité
  rationale: Le terme peut désigner la confiance croyante ou la fidélité constante. Le texte principal retient « foi », tandis que la note préserve l’autre nuance plausible sans trancher artificiellement.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure « nous-mêmes, nous » conserve l’emphase grecque; « sommes fiers » évite la connotation généralement négative de « nous vantons » tout en gardant la force rhétorique.
