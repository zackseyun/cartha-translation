  text: ἐν ⸂φλογὶ πυρός⸃, διδόντος ἐκδίκησιν τοῖς μὴ εἰδόσι θεὸν καὶ τοῖς μὴ ὑπακούουσιν τῷ εὐαγγελίῳ τοῦ κυρίου ἡμῶν Ἰησοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/008.yaml
  text: in flaming fire[a], inflicting vengeance on those who do not know God and on those who do not obey the gospel of our Lord Jesus[b],
translation:
  language: fr
  text: dans un feu flamboyant[a], exerçant la vengeance[b] contre ceux qui ne connaissent pas Dieu et contre ceux qui n’obéissent pas à l’Évangile de notre Seigneur Jésus,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « dans une flamme de feu ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « infligeant un châtiment ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν φλογὶ πυρός
  choice: dans un feu flamboyant
  rationale: Rend naturellement l’image intensive de « flamme de feu » et se rattache à la révélation du Seigneur mentionnée au verset précédent.
- source_word: διδόντος ἐκδίκησιν
  choice: faisant justice
  rationale: Le participe signifie littéralement « donnant », mais l’expression désigne ici l’exercice d’une justice punitive. « Faisant justice » reste idiomatique en français et conserve la dimension judiciaire sans suggérer une revanche passionnelle.
- source_word: τοῖς μὴ εἰδόσι θεὸν
  choice: à ceux qui ne connaissent pas Dieu
  rationale: Le participe fondé sur οἶδα a ici un sens présent; cette formulation préserve simplement l’état décrit.
- source_word: τοῖς μὴ ὑπακούουσιν
  choice: à ceux qui n’obéissent pas
  rationale: Rend directement ὑπακούω sans ajouter l’idée explicite d’un refus volontaire.
- source_word: τῷ εὐαγγελίῳ
  choice: à l’Évangile
  rationale: « Évangile » est le terme paulinien établi et demeure courant et intelligible en français moderne.
- source_word: τοῦ κυρίου ἡμῶν Ἰησοῦ
  choice: de notre Seigneur Jésus
  rationale: Conserve le titre κύριος, le possessif communautaire et l’ordre naturel du français.
theological_decisions:
- issue: Nature de ἐκδίκησις dans le jugement divin
  choice: faisant justice
  alternative: exerçant la vengeance; infligeant le châtiment
  rationale: Dans ce contexte, ἐκδίκησις désigne une sanction judiciaire exercée par le Seigneur. « Faisant justice » conserve cette gravité tout en évitant que « vengeance » soit comprise au sens moderne d’une revanche personnelle et passionnelle; la note préserve l’équivalent plus formel.
translation_notes:
  register: Français international moderne, digne et accessible. La proposition demeure liée syntaxiquement au verset précédent; la virgule finale signale la continuité de la phrase.
