id: 2TH.1.11
reference: 2 Thessalonians 1:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἰς ὃ καὶ προσευχόμεθα πάντοτε περὶ ὑμῶν, ἵνα ὑμᾶς ἀξιώσῃ τῆς κλήσεως ὁ θεὸς ἡμῶν καὶ πληρώσῃ πᾶσαν εὐδοκίαν ἀγαθωσύνης καὶ ἔργον πίστεως ἐν δυνάμει,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/011.yaml
  text: To this end also we always pray for you[a], that our God may count you worthy of the calling and may fulfill every good resolve and work of faith with power[c][b],
translation:
  language: fr
  text: 'C’est aussi dans ce but que nous prions toujours pour vous : que notre Dieu vous juge dignes de l’appel[a] et qu’il accomplisse avec puissance tout désir de bonté[b] et toute œuvre de foi[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vous rende dignes de l’appel ». Le verbe grec peut signifier « juger dignes » ou « rendre dignes ».
    reason: alternative_reading
  - marker: b
    text: Ou « tout bon dessein » ou « toute résolution de faire le bien ».
    reason: lexical_alternative
  - marker: c
    text: « Œuvre de foi » peut aussi désigner une œuvre produite par la foi ; ici, « foi » peut également être compris au sens de « fidélité ».
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ὃ καὶ
  choice: C’est aussi dans ce but que
  rationale: Cette tournure reprend ce qui précède tout en conservant la nuance de but de εἰς et la valeur additive de καί.
- source_word: προσευχόμεθα πάντοτε περὶ ὑμῶν
  choice: nous prions toujours pour vous
  rationale: Formulation française naturelle qui exprime l’action habituelle ou continue indiquée par le présent et πάντοτε.
- source_word: ἵνα
  choice: que
  rationale: Après les deux-points, « que » introduit naturellement en français le contenu et la visée de la prière.
- source_word: ἀξιώσῃ
  choice: vous juge dignes
  rationale: Ce choix conserve le sens évaluatif possible du verbe sans exclure son autre sens, « rendre dignes », signalé en note.
- source_word: τῆς κλήσεως
  choice: de l’appel
  rationale: Le grec ne comporte aucun possessif explicite ; l’article défini renvoie à l’appel déjà connu sans préciser « son » ou « votre ».
- source_word: ὁ θεὸς ἡμῶν
  choice: notre Dieu
  rationale: Le possessif explicite du grec est conservé.
- source_word: πληρώσῃ
  choice: accomplisse
  rationale: Le verbe exprime ici l’idée de réaliser ou mener à effet les dispositions et l’œuvre mentionnées.
- source_word: πᾶσαν εὐδοκίαν ἀγαθωσύνης
  choice: toute résolution de faire le bien
  rationale: Cette formulation intelligible rend εὐδοκία comme une intention résolue et ἀγαθωσύνη comme le bien qui la caractérise ou la vise, tout en signalant d’autres analyses possibles en note.
- source_word: ἔργον πίστεως
  choice: toute œuvre de foi
  rationale: 'La formulation compacte maintient ouverte la relation du génitif : œuvre issue de la foi, caractérisée par elle, ou liée à la fidélité.'
- source_word: ἐν δυνάμει
  choice: avec puissance
  rationale: Le complément est rattaché à l’accomplissement divin et placé assez tôt pour porter naturellement sur les deux objets coordonnés.
theological_decisions:
- issue: Sens de ἀξιώσῃ par rapport à l’appel divin
  choice: vous juge dignes de l’appel
  alternative: vous rende dignes de l’appel
  rationale: Le verbe grec peut décrire soit une appréciation, soit l’action de rendre digne. Le texte principal retient le premier sens et la note conserve le second, sans trancher la tension théologique.
- issue: Rapport entre εὐδοκία et ἀγαθωσύνη
  choice: résolution de faire le bien
  alternative: dessein inspiré par la bonté ; résolution de bonté
  rationale: Le génitif grec permet de comprendre la bonté comme la qualité, la source ou l’objet de la résolution. La traduction principale est naturelle, tandis que la note préserve cette amplitude.
- issue: Sens de πίστις dans ἔργον πίστεως
  choice: foi
  alternative: fidélité
  rationale: « Foi » demeure le rendu principal de πίστις, mais le génitif compact et le contexte n’excluent pas la nuance de fidélité ; celle-ci est donc indiquée en note.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la structure de la prière grecque, tout en employant les deux-points pour éviter une subordination lourde. Les ambiguïtés lexicales et théologiques réelles sont maintenues par des notes brèves.
