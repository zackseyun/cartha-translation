id: 2TH.1.2
reference: 2 Thessalonians 1:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: χάρις ὑμῖν καὶ εἰρήνη ἀπὸ θεοῦ ⸀πατρὸς καὶ κυρίου Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/002.yaml
  text: Grace to you and peace from God our Father and the Lord Jesus the Messiah[a].
translation:
  language: fr
  text: Que la grâce et la paix vous soient données de la part de Dieu le Père et du Seigneur Jésus, le Messie[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Jésus-Christ ». Le titre grec Χριστός peut être rendu par « Christ » ou « Messie »; ici, « Messie » en exprime directement le sens.
    reason: alternative_reading
lexical_decisions:
- source_word: χάρις
  choice: la grâce
  rationale: Dans les salutations de Paul, « grâce » conserve à la fois la formule de bénédiction et la portée théologique du terme.
- source_word: ὑμῖν
  choice: vous soient données
  rationale: Le datif désigne les destinataires de la bénédiction. La tournure optative avec « que » rend naturellement en français la phrase nominale grecque.
- source_word: εἰρήνη
  choice: la paix
  rationale: « Paix » est l’équivalent usuel et garde les connotations de bien-être et de plénitude de cette bénédiction.
- source_word: ἀπὸ
  choice: de la part de
  rationale: Dans une salutation française, cette expression indique naturellement la source de la grâce et de la paix.
- source_word: θεοῦ πατρὸς
  choice: Dieu le Père
  rationale: Le français exige ici un déterminant. « Dieu le Père » rend naturellement le titre sans ajouter le possessif « notre », absent du texte grec retenu.
- source_word: κυρίου
  choice: Seigneur
  rationale: « Seigneur » préserve la valeur titulaire de κύριος et son usage néotestamentaire établi.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jésus, le Messie
  rationale: « Messie » explicite le sens du titre Χριστός; la virgule et l’article rendent ce titre idiomatique en français.
theological_decisions:
- issue: Déterminant à employer avec πατρὸς en l’absence de ἡμῶν (« notre ») dans le texte grec imprimé
  choice: Dieu le Père
  alternative: Dieu notre Père
  rationale: « Dieu le Père » est idiomatique en français et évite d’introduire dans le corps du texte un possessif qui ne figure pas dans cette édition grecque.
- issue: Rendu de Χριστός
  choice: le Messie
  alternative: le Christ
  rationale: Les deux termes sont possibles, mais « le Messie » conserve de façon transparente la valeur du titre grec et son arrière-plan d’oint attendu.
translation_notes:
  register: Français international moderne, digne et accessible. La construction « Que… vous soient données » transforme naturellement la formule nominale grecque en bénédiction française, sans en modifier la portée.
