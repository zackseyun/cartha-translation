  naturalness: La phrase révisée est naturelle en français international moderne, tout en gardant le parallélisme des deux infinitifs passifs. « Ses saints » est un terme biblique français courant; la note peut en préciser le sens sans le paraphraser dans le texte.
  terminology: « Saints » conserve le terme paulinien ἅγιοι et sa relation explicite au Christ (« ses saints »). « Admiré » rend naturellement θαυμασθῆναι dans ce contexte d’admiration émerveillée. La note préserve l’ambiguïté de ἐν (« parmi » / « en »).
