source:
  edition: SBLGNT
  text: ὅταν ἔλθῃ ἐνδοξασθῆναι ἐν τοῖς ἁγίοις αὐτοῦ καὶ θαυμασθῆναι ἐν πᾶσιν τοῖς πιστεύσασιν, ὅτι ἐπιστεύθη τὸ μαρτύριον ἡμῶν ἐφ’ ὑμᾶς, ἐν τῇ ἡμέρᾳ ἐκείνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/010.yaml
  text: on that day when he comes to be glorified among his saints and to be marveled at among all who have believed[b][a], because our testimony to you was believed.
translation:
  language: fr
  text: en ce jour-là, lorsqu’il viendra pour être glorifié parmi ses saints[a] et pour être admiré parmi tous ceux qui ont cru, puisque vous avez cru à notre témoignage[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en ses saints ». La préposition grecque peut indiquer que Christ est glorifié parmi ses saints ou que sa gloire se manifeste en eux.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « puisque notre témoignage à votre égard a été cru ». L’expression grecque peut aussi être comprise comme « notre témoignage vous concernant ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν ἔλθῃ
  choice: lorsqu’il viendra
  rationale: ὅταν avec le subjonctif aoriste renvoie ici à un événement futur déterminé. Le futur français rend naturellement cette orientation.
- source_word: ἐνδοξασθῆναι
  choice: pour être glorifié
  rationale: L’infinitif passif exprime ici le but ou le résultat de sa venue et conserve la forte notion de gloire.
- source_word: ἐν τοῖς ἁγίοις αὐτοῦ
  choice: parmi ceux qui lui appartiennent
  rationale: Dans ce contexte, οἱ ἅγιοι désigne les personnes consacrées à Christ. Cette formulation moderne évite que « saints » soit compris comme un titre réservé à une élite, tandis que « parmi » rend idiomatiquement ἐν sans exclure la nuance « en eux ».
- source_word: θαυμασθῆναι
  choice: pour susciter l’émerveillement
  rationale: Cette tournure française naturelle rend le passif et l’idée d’une admiration étonnée suscitée par Christ.
- source_word: ἐν πᾶσιν τοῖς πιστεύσασιν
  choice: parmi tous ceux qui auront cru
  rationale: Le futur antérieur situe leur foi comme acquise au moment de la venue, tout en conservant la force verbale du participe aoriste.
- source_word: ὅτι
  choice: puisque
  rationale: La conjonction introduit vraisemblablement la raison pour laquelle les destinataires font partie de ceux qui auront cru.
- source_word: ἐπιστεύθη τὸ μαρτύριον ἡμῶν
  choice: vous avez cru à notre témoignage
  rationale: Le passif grec, littéralement « notre témoignage a été cru », est rendu activement en français pour éviter une formulation raide, sans changer les rôles sémantiques.
- source_word: ἐφ’ ὑμᾶς
  choice: vous avez cru à
  rationale: La relation du témoignage aux destinataires est exprimée naturellement en faisant de « vous » le sujet de la tournure active; le sens directionnel « témoignage adressé à vous » reste possible et est signalé en note.
- source_word: ἐν τῇ ἡμέρᾳ ἐκείνῃ
  choice: en ce jour-là
  rationale: Formule temporelle française naturelle qui garde la solennité eschatologique.
theological_decisions:
- issue: Référent et portée de « ses saints »
  choice: « ceux qui lui appartiennent », compris comme le peuple consacré à Christ, avec ἐν rendu par « parmi »
  alternative: « en ses saints » ou « parmi ses saints », ce qui peut souligner que sa gloire se manifeste en eux
  rationale: Le parallèle avec « tous ceux qui auront cru » favorise les croyants comme référent. La formulation choisie est immédiatement compréhensible et n’impose pas l’idée d’une catégorie canonisée, tandis qu’une note préserve l’ambiguïté de la préposition.
- issue: Lien entre la foi des croyants et le témoignage apostolique
  choice: « puisque vous avez cru à notre témoignage »
  alternative: « puisque notre témoignage auprès de vous a été cru » ou « car notre témoignage vous concernant a été cru »
  rationale: La lecture causale explique l’inclusion des Thessaloniciens parmi ceux qui ont cru. La tournure active est idiomatique, mais la note conserve l’ambiguïté de ἐφ’ ὑμᾶς.
- issue: Portée temporelle de πιστεύσασιν
  choice: « ceux qui auront cru »
  alternative: « ceux qui ont cru »
  rationale: Le futur antérieur adopte le point de vue du jour futur évoqué, sans transformer la foi en catégorie abstraite ni préciser au-delà du texte la nature de cette foi.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase place « en ce jour-là » en tête pour une lecture naturelle. « Ceux qui lui appartiennent » explicite la valeur relationnelle de οἱ ἅγιοι sans connotation d’une élite canonisée; les lectures plus formelles sont conservées en note.
