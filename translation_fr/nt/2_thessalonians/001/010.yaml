  to: en ce jour-là, lorsqu’il viendra pour être glorifié parmi ses saints[a] et pour être admiré parmi tous ceux qui ont cru, puisque vous avez cru à notre témoignage[b].
  rationale: La révision rétablit « ses saints », terme qui correspond directement à οἱ ἅγιοι sans imposer une compréhension confessionnelle particulière; la note explique sa valeur et l’ambiguïté de la préposition. Elle conserve aussi les deux passifs grecs par « être glorifié » et « être admiré », et rend le participe aoriste par « ceux qui ont cru ». La formulation active « vous avez cru à notre témoignage » reste française et exprime clairement le sens causal du dernier membre.
