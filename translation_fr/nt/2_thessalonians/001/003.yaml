id: 2TH.1.3
reference: 2 Thessalonians 1:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Εὐχαριστεῖν ὀφείλομεν τῷ θεῷ πάντοτε περὶ ὑμῶν, ἀδελφοί, καθὼς ἄξιόν ἐστιν, ὅτι ὑπεραυξάνει ἡ πίστις ὑμῶν καὶ πλεονάζει ἡ ἀγάπη ἑνὸς ἑκάστου πάντων ὑμῶν εἰς ἀλλήλους,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/003.yaml
  text: We ought always to give thanks to God for you[a], brothers, as is fitting, because your faith is growing abundantly and the love of each and every one of you for one another is increasing[c][b],
translation:
  language: fr
  text: Nous devons toujours rendre grâce à Dieu pour vous, frères[a], comme il convient, parce que votre foi[b] croît abondamment et que l’amour de chacun d’entre vous pour tous les autres abonde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « frères et sœurs » ; le grec dit « frères », terme qui peut s’adresser de manière inclusive à toute la communauté croyante.
    reason: lexical_alternative
  - marker: b
    text: Ou « votre fidélité » ou « votre confiance » ; le mot grec peut exprimer la foi, la confiance ou la fidélité.
    reason: alternative_reading
lexical_decisions:
- source_word: Εὐχαριστεῖν ὀφείλομεν
  choice: Nous devons rendre grâce
  rationale: L’infinitif avec ὀφείλομεν exprime une obligation morale ou ce qui convient. « Nous devons rendre grâce » est naturel et conserve cette force sans durcir le propos en nécessité absolue.
- source_word: πάντοτε
  choice: toujours
  rationale: Rend directement la portée temporelle de l’adverbe.
- source_word: περὶ ὑμῶν
  choice: à votre sujet
  rationale: Dans cette formule d’action de grâce, cette expression française est naturelle et garde le sens de περί sans suggérer que les destinataires sont eux-mêmes l’objet auquel la grâce est rendue.
- source_word: ἀδελφοί
  choice: frères
  rationale: Conserve le vocatif masculin pluriel du grec; une note signale qu’il peut inclure toute la communauté croyante.
- source_word: καθὼς ἄξιόν ἐστιν
  choice: comme il convient
  rationale: Exprime clairement l’idée de convenance morale, sans employer le peu naturel « comme il est digne ».
- source_word: ὑπεραυξάνει
  choice: grandit de façon extraordinaire
  rationale: Le verbe composé marque une croissance particulièrement forte. Cette formulation conserve l’image de la croissance et son intensité dans un français courant.
- source_word: ἡ πίστις
  choice: votre foi
  rationale: « Foi » est ici le sens contextuel le plus probable, tout en laissant ouverte en note la nuance possible de fidélité ou de confiance.
- source_word: πλεονάζει
  choice: augmente
  rationale: Rend simplement et naturellement l’accroissement exprimé par le présent grec.
- source_word: ἡ ἀγάπη
  choice: l’amour
  rationale: Équivalent français courant et théologiquement non spécialisé de ἀγάπη.
- source_word: ἑνὸς ἑκάστου πάντων ὑμῶν εἰς ἀλλήλους
  choice: l’amour de chacun d’entre vous pour les autres
  rationale: Formulation naturelle qui garde la portée distributive de « chacun » et la réciprocité de ἀλλήλους. Une note préserve la redondance emphatique du grec.
theological_decisions:
- issue: Sens de πίστις
  choice: foi
  alternative: fidélité; confiance
  rationale: Le contexte parle le plus naturellement de la foi croissante des Thessaloniciens. Le champ sémantique du terme permet néanmoins une nuance de fidélité ou de confiance, conservée en note plutôt que tranchée silencieusement.
- issue: Portée de ἀδελφοί dans l’adresse à l’Église
  choice: frères
  alternative: frères et sœurs
  rationale: Le texte principal conserve la forme masculine plurielle de la source. La note précise sa possible portée inclusive dans l’adresse à l’ensemble de la communauté.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la structure causale et le parallélisme du grec, tout en évitant une formulation trop littérale ou pesante.
