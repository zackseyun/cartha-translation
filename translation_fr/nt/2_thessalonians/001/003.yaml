revisions:
- from: Nous devons toujours rendre grâce à Dieu à votre sujet, frères[a], comme il convient, parce que votre foi[b] grandit de façon extraordinaire et que l’amour de chacun d’entre vous[c] pour les autres augmente.
  to: Nous devons toujours rendre grâce à Dieu pour vous, frères[a], comme il convient, parce que votre foi[b] croît abondamment et que l’amour de chacun d’entre vous pour tous les autres abonde.
  rationale: La révision améliore l’idiomaticité de la formule française d’action de grâce et rend plus précisément l’intensité des deux verbes grecs, sans modifier le sens ni surinterpréter les termes. La note c conserve l’information sur la formulation emphatique de ἑνὸς ἑκάστου πάντων ὑμῶν. Le repère [c] n’est pas appelé dans le texte principal, puisque la note explique une nuance déjà couverte par « chacun d’entre vous » ; pour assurer l’ancrage, il doit être placé après cette expression.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T11:39:57Z'
review_pass:
  verdict: revise
  source_fidelity: Le sens général est fidèlement rendu. Toutefois, « à votre sujet » est moins idiomatique dans une formule d’action de grâce et affaiblit la relation de bénéficiaire exprimée naturellement en français par « pour vous ». « Pour les autres » rend εἰς ἀλλήλους, mais « pour tous les autres » restitue mieux l’orientation réciproque et l’insistance distributive du contexte.
  naturalness: Le français est globalement clair et de registre approprié. « Nous devons toujours rendre grâce à Dieu pour vous » est la formulation usuelle. « Croît abondamment » rend l’intensif grec avec plus de précision et de sobriété que « grandit de façon extraordinaire ».
  terminology: « Foi », « amour » et « frères » sont des choix exacts et cohérents. Les notes sur la portée inclusive possible de ἀδελφοί et sur les nuances de πίστις sont adéquates. La note c doit présenter la redondance grecque sans donner l’impression qu’elle constitue une tournure française normale.
  issues:
  - severity: low
    issue: « à votre sujet » dans la formule de reconnaissance
    rationale: Bien que possible littéralement pour περί, cette expression est moins naturelle que « pour vous » après « rendre grâce à Dieu » en français moderne.
  - severity: low
    issue: Intensité de ὑπεραυξάνει
    rationale: « De façon extraordinaire » peut évoquer un caractère insolite plutôt qu’une croissance très abondante. « Croît abondamment » conserve l’image et l’intensité du composé grec.
  - severity: low
    issue: Portée de εἰς ἀλλήλους
    rationale: « Pour tous les autres » exprime plus pleinement que « pour les autres » l’amour de chaque membre envers l’ensemble des autres, tout en restant naturel.
