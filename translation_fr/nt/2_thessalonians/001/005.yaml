source:
  edition: SBLGNT
  text: ἔνδειγμα τῆς δικαίας κρίσεως τοῦ θεοῦ, εἰς τὸ καταξιωθῆναι ὑμᾶς τῆς βασιλείας τοῦ θεοῦ, ὑπὲρ ἧς καὶ πάσχετε,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/005.yaml
  text: This is evidence of the righteous judgment of God[a], so that you may be counted worthy of the kingdom of God, for which you are also suffering[c][b],
translation:
  language: fr
  text: C’est un signe du juste jugement de Dieu[a], afin que vous soyez jugés dignes du royaume de Dieu[b], pour lequel vous souffrez aussi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une preuve » ou « une manifestation du juste jugement de Dieu ».
    reason: lexical_alternative
  - marker: b
    text: Ou « pour que vous soyez jugés dignes » ou « avec pour résultat que vous soyez jugés dignes ». La construction grecque peut exprimer le but ou le résultat.
    reason: alternative_reading
  - marker: c
    text: Ou « pour la cause de ce royaume » ou « en faveur duquel ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔνδειγμα
  choice: un signe
  rationale: Le nom désigne ce qui manifeste ou atteste une réalité. « Signe » est naturel en français et évite de présenter « preuve » comme nécessairement irréfutable. « C’est » est ajouté, car le grec forme un fragment sans verbe dépendant du verset précédent.
- source_word: δικαίας κρίσεως
  choice: du juste jugement
  rationale: « Juste » rend directement la qualité morale exprimée par δικαίας et convient à l’usage français courant avec « jugement ».
- source_word: εἰς τὸ καταξιωθῆναι
  choice: ainsi, vous serez jugés dignes
  rationale: Le passif de καταξιόω signifie être tenu ou jugé digne, non être rendu intrinsèquement digne. « Ainsi » laisse ouverte la nuance de but ou de résultat portée par εἰς τό avec l’infinitif.
- source_word: βασιλείας τοῦ θεοῦ
  choice: du royaume de Dieu
  rationale: Formulation biblique française habituelle, claire et fidèle au génitif grec.
- source_word: ὑπὲρ ἧς
  choice: pour lequel
  rationale: Cette formulation concise relie les souffrances au royaume et conserve la valeur de « pour la cause de » ou « en faveur de ».
- source_word: καὶ πάσχετε
  choice: vous souffrez aussi
  rationale: Le présent exprime une souffrance en cours, et « aussi » conserve explicitement καί.
theological_decisions:
- issue: Rapport entre la souffrance et le fait d’être jugés dignes du royaume
  choice: La souffrance des croyants est présentée comme liée au juste jugement de Dieu, dans une relation pouvant exprimer le but ou le résultat par lequel ils sont jugés dignes du royaume.
  alternative: Leur souffrance leur vaudrait ou leur ferait mériter l’entrée dans le royaume.
  rationale: Le passif καταξιωθῆναι signifie « être jugés/tenus dignes » et non « acquérir un mérite ». La traduction conserve cependant le lien syntaxique étroit entre souffrance, jugement et dignité sans l’expliquer au-delà du texte.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase explicite par « C’est » le fragment verbalement incomplet du grec. « Ainsi » préserve mieux que « afin que » seul l’ambiguïté entre but et résultat.
