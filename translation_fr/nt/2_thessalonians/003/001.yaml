source:
  edition: SBLGNT
  text: Τὸ λοιπὸν προσεύχεσθε, ἀδελφοί, περὶ ἡμῶν, ἵνα ὁ λόγος τοῦ κυρίου τρέχῃ καὶ δοξάζηται καθὼς καὶ πρὸς ὑμᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/001.yaml
  text: Finally[a], brothers, pray for us, that the word of the Lord may spread rapidly and be honored, just as it was among you[b],
translation:
  language: fr
  text: Enfin, frères[a], priez pour nous, afin que la parole du Seigneur se répande rapidement et soit honorée, comme elle l’a été parmi vous[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « frères et sœurs » ; le grec dit « frères » et peut s’adresser à l’ensemble de la communauté de manière représentative.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « coure et soit glorifiée ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τὸ λοιπὸν
  choice: Enfin
  rationale: Marqueur discursif épistolaire qui introduit la dernière partie de la lettre; « Enfin » est naturel en français moderne.
- source_word: προσεύχεσθε
  choice: priez
  rationale: L’impératif présent appelle la communauté à prier; l’impératif français exprime naturellement cette exhortation sans qu’il soit nécessaire d’expliciter l’aspect continu.
- source_word: ἀδελφοί
  choice: frères
  rationale: Le masculin pluriel du grec est conservé dans le texte; dans cette adresse représentative, il peut viser l’ensemble de la communauté, comme l’indique la note.
- source_word: περὶ ἡμῶν
  choice: pour nous
  rationale: Avec le verbe « prier », cette formulation rend idiomatiquement περί suivi du génitif.
- source_word: ἵνα
  choice: afin que
  rationale: Exprime ici le but ou le résultat demandé dans la prière.
- source_word: ὁ λόγος τοῦ κυρίου
  choice: la parole du Seigneur
  rationale: Rend directement le groupe génitif et conserve l’expression biblique, qui désigne ici le message proclamé.
- source_word: τρέχῃ
  choice: se répande rapidement
  rationale: Le sens littéral est « coure », mais la métaphore décrit la progression rapide de la parole; cette formulation en communique clairement la portée en français.
- source_word: δοξάζηται
  choice: soit honorée
  rationale: Dans ce contexte, il s’agit de la reconnaissance et de l’accueil accordés à la parole; « soit honorée » est plus naturel en français que « soit glorifiée » appliqué à une parole.
- source_word: καθὼς καὶ πρὸς ὑμᾶς
  choice: comme elle l’a été parmi vous
  rationale: La comparaison renvoie à l’expérience déjà vécue par les Thessaloniciens; le verbe est explicité pour produire une phrase française naturelle.
theological_decisions:
- issue: Portée de ἀδελφοί dans l’adresse à la communauté
  choice: frères
  alternative: frères et sœurs
  rationale: Le texte principal conserve la forme masculine grecque sans exclure la portée représentative probable; une note signale explicitement l’autre traduction possible.
- issue: Métaphore de τρέχῃ appliquée à la parole du Seigneur
  choice: se répande rapidement
  alternative: coure
  rationale: L’équivalence optimale privilégie une expression française claire de la progression rapide du message, tandis que la note préserve l’image littérale.
- issue: Sens de δοξάζηται appliqué à la parole
  choice: soit honorée
  alternative: soit glorifiée
  rationale: Le choix principal exprime naturellement l’accueil empreint d’honneur réservé à la parole, sans nier le rendu plus formel signalé en note.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste fluide tout en conservant les principaux rapports du grec. Les notes rendent visibles le marqueur discursif alternatif ainsi que la métaphore et le passif littéraux.
