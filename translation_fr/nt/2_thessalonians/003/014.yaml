source:
  edition: SBLGNT
  text: Εἰ δέ τις οὐχ ὑπακούει τῷ λόγῳ ἡμῶν διὰ τῆς ἐπιστολῆς, τοῦτον σημειοῦσθε, ⸀μὴ ⸀συναναμίγνυσθαι αὐτῷ, ἵνα ἐντραπῇ·
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/014.yaml
  text: And if anyone does not obey our word through this letter[a], take note of that person; do not associate with him[d][c][b], so that he may be ashamed.
translation:
  language: fr
  text: Et si quelqu’un n’obéit pas à notre instruction transmise par cette lettre[a], prenez note de cette personne[b] et ne la fréquentez pas[c], afin qu’elle ait honte[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans cette lettre ». L’expression grecque peut désigner le moyen par lequel l’instruction est transmise.
    reason: lexical_alternative
  - marker: b
    text: Ou « marquez cette personne » ou « repérez-la ».
    reason: lexical_alternative
  - marker: c
    text: Ou « n’ayez pas de relations avec elle » ou « ne vous associez pas à elle ».
    reason: lexical_alternative
  - marker: d
    text: 'Le but est correctif : voir le verset 15, où cette personne doit encore être avertie « comme un frère ».'
    reason: cross_reference
lexical_decisions:
- source_word: ὑπακούει
  choice: n’obéit pas
  rationale: Le verbe désigne ici le refus de se conformer à une instruction investie d’autorité; « obéir » convient au contexte exhortatif.
- source_word: τῷ λόγῳ ἡμῶν
  choice: à ce que nous disons
  rationale: λόγος renvoie ici à l’enseignement ou à l’instruction apostolique; cette formulation naturelle évite que « notre parole » soit comprise comme une seule déclaration orale.
- source_word: διὰ τῆς ἐπιστολῆς
  choice: dans cette lettre
  rationale: διά avec le génitif peut indiquer le moyen par lequel l’instruction est transmise. En français, « dans cette lettre » exprime naturellement la référence à la lettre présente, tandis que la note conserve l’ambiguïté instrumentale.
- source_word: σημειοῦσθε
  choice: repérez cette personne
  rationale: L’impératif demande d’identifier ou de signaler à l’attention la personne désobéissante. « Repérez » est clair sans introduire une procédure ecclésiastique technique.
- source_word: μὴ συναναμίγνυσθαι αὐτῷ
  choice: ne la fréquentez pas
  rationale: Le verbe signifie ne pas se mêler à quelqu’un ou ne pas entretenir de relations avec lui. « Ne la fréquentez pas » rend cette prise de distance sociale en français courant.
- source_word: ἐντραπῇ
  choice: qu’elle éprouve de la honte
  rationale: Le passif a ici le sens d’en venir à ressentir de la honte. Cette expression préserve le but correctif sans transformer le commandement en appel à l’humiliation publique.
- source_word: τις / τοῦτον / αὐτῷ
  choice: quelqu’un / cette personne / la
  rationale: Le référent est indéfini. Les reprises par « cette personne » et « la » sont naturelles en français et n’ajoutent pas une restriction de sexe que le référent générique n’exige pas.
theological_decisions:
- issue: Nature de la mesure exprimée par μὴ συναναμίγνυσθαι αὐτῷ
  choice: Une prise de distance relationnelle ou communautaire à visée corrective
  alternative: Une excommunication formelle au sens technique, ou une simple préférence personnelle sans portée communautaire
  rationale: Le verset commande une réelle cessation de fréquentation, mais ne définit pas une procédure ecclésiastique technique. Le verset suivant demande encore d’avertir la personne comme un frère, ce qui indique une visée corrective plutôt qu’une condamnation définitive.
- issue: Portée de ἐντραπῇ
  choice: Faire naître une honte susceptible de conduire à la correction
  alternative: Infliger une humiliation publique comme une fin en soi
  rationale: La proposition de but conserve la gravité morale du texte; le contexte immédiat permet de préciser en note que cette honte est recherchée dans un but correctif.
translation_notes:
  register: Français international moderne, digne et directement compréhensible. La formulation évite les termes ecclésiastiques techniques absents du grec et emploie des reprises épicènes naturelles pour le référent indéfini. Tous les appels de note figurent dans le texte.
