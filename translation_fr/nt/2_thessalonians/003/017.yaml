- from: 'La salutation est écrite de ma propre main, celle de Paul. C’est le signe distinctif dans chacune de mes lettres[a] : voilà comment j’écris.'
  to: 'Cette salutation est de ma propre main, moi, Paul. C’est un signe dans toutes mes lettres[a] : c’est ainsi que j’écris.'
  rationale: La révision corrige l’ambiguïté syntaxique produite par « celle de Paul » en rendant explicitement, mais sans ajout interprétatif, l’auto-identification de Paul. Elle remplace « signe distinctif » par le terme plus direct « signe » et adopte une finale française naturelle qui demeure proche du grec. La note conserve l’alternative de construction nominale et l’ambiguïté de οὕτως γράφω.
