  text: Ὁ ἀσπασμὸς τῇ ἐμῇ χειρὶ Παύλου, ὅ ἐστιν σημεῖον ἐν πάσῃ ἐπιστολῇ· οὕτως γράφω.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/017.yaml
  text: The greeting is by my own hand—Paul's—which is a sign in every letter[a]; this is how I write.
translation:
  language: fr
  text: 'Cette salutation est de ma propre main, moi, Paul. C’est un signe dans toutes mes lettres[a] : c’est ainsi que j’écris.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « La salutation de ma propre main, moi, Paul, qui est un signe dans chaque lettre ; ainsi j’écris. » La dernière proposition peut aussi se traduire plus littéralement : « ainsi j’écris ».'
    reason: La construction nominale initiale et la portée exacte de οὕτως permettent une formulation plus littérale.
lexical_decisions:
- source_word: ἀσπασμὸς
  choice: la salutation
  rationale: Dans ce contexte épistolaire, ἀσπασμός désigne la formule de salutation. « Salutation » est naturel et digne en français, tout en étant plus précis ici que « salut ».
- source_word: τῇ ἐμῇ χειρὶ
  choice: écrite de ma propre main
  rationale: Le datif exprime que Paul écrit personnellement cette salutation. L’ajout de « écrite », implicite dans le contexte et confirmé par γράφω, donne une formulation française claire.
- source_word: Παύλου
  choice: celle de Paul
  rationale: Le génitif, placé en apposition, identifie explicitement la main comme celle de Paul. Cette formulation française conserve l’effet d’auto-identification sans produire une tournure artificielle.
- source_word: ὅ ἐστιν σημεῖον
  choice: C’est le signe distinctif
  rationale: Le relatif renvoie vraisemblablement à la salutation autographe. « Signe distinctif » exprime ici la fonction d’identification ou d’authentification de σημεῖον sans développer davantage l’implicite.
- source_word: ἐν πάσῃ ἐπιστολῇ
  choice: dans chacune de mes lettres
  rationale: « Lettre » convient au français moderne mieux que « épître ». Le possessif explicite le rapport évident aux lettres de Paul, tandis que « chacune » rend la valeur distributive de πάσῃ.
- source_word: οὕτως γράφω
  choice: voilà comment j’écris
  rationale: Cette expression rend naturellement la valeur modale probable de οὕτως et attire l’attention sur l’écriture personnelle de Paul, tout en laissant en note la possibilité d’une formulation plus littérale.
theological_decisions:
- issue: Portée de la formule autographe de Paul
  choice: Présenter la salutation manuscrite comme le signe distinctif employé dans ses lettres
  alternative: Comprendre la dernière proposition plus étroitement comme « c’est ainsi que j’écris » ou « ainsi j’écris » dans la lettre présente
  rationale: Le contexte immédiat, notamment « dans chaque lettre », favorise une fonction d’identification ou d’authentification. La note conserve toutefois l’ambiguïté de οὕτως γράφω sans transformer cette pratique en affirmation doctrinale plus large.
translation_notes:
  register: Français international moderne, clair et digne. La ponctuation répartit en deux phrases la longue structure grecque pour la lisibilité. « Salutation » garde la précision épistolaire, tandis que la note préserve les ambiguïtés syntaxique et adverbiale.
