base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/004.yaml
  text: And we have confidence in the Lord about you, that you are doing and will do what we command.
translation:
  language: fr
  text: 'Mais nous avons confiance dans le Seigneur à votre sujet : vous faites et vous ferez ce que nous vous ordonnons.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πεποίθαμεν
  choice: nous avons confiance
  rationale: 'Rend naturellement le parfait grec à valeur d’état présent : Paul et ses compagnons demeurent confiants.'
- source_word: ἐν κυρίῳ
  choice: dans le Seigneur
  rationale: 'Conserve le cadre explicitement christologique de cette confiance : elle repose dans le Seigneur, non simplement sur les destinataires.'
- source_word: ἐφ’ ὑμᾶς
  choice: à votre sujet
  rationale: Exprime l’objet humain de la confiance sans suggérer que celle-ci serait indépendante du Seigneur.
- source_word: παραγγέλλομεν
  choice: nous vous ordonnons
  rationale: Le verbe désigne une directive donnée avec autorité; « ordonner » en préserve la force.
- source_word: καὶ ποιεῖτε καὶ ποιήσετε
  choice: vous faites et vous ferez
  rationale: Respecte le contraste temporel entre l’action présente et l’action future, ainsi que la répétition emphatique de καί.
theological_decisions:
- issue: Fondement et objet de la confiance apostolique
  choice: « confiance dans le Seigneur à votre sujet »
  alternative: « confiance en vous dans le Seigneur »
  rationale: La formulation retenue maintient ensemble les deux compléments grecs et évite de déplacer le fondement de la confiance du Seigneur vers les croyants.
- issue: Autorité des directives apostoliques
  choice: « ce que nous vous ordonnons »
  alternative: « ce que nous vous recommandons »
  rationale: « Recommandons » affaiblirait παραγγέλλομεν, qui exprime ici des instructions faisant autorité.
translation_notes:
  register: Français international moderne, clair et digne. La coordination grecque est rendue par deux futurs temporellement distincts, et les compléments de la confiance restent explicitement séparés.
