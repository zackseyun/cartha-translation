  text: οὐδὲ δωρεὰν ἄρτον ἐφάγομεν παρά τινος, ἀλλ’ ἐν κόπῳ καὶ μόχθῳ ⸂νυκτὸς καὶ ἡμέρας⸃ ἐργαζόμενοι πρὸς τὸ μὴ ἐπιβαρῆσαί τινα ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/008.yaml
  text: nor did we eat bread from anyone free of charge[a], but with labor and hardship, working night and day so as not to burden any of you.
translation:
  language: fr
  text: Nous n’avons pas non plus mangé le pain de personne sans le payer[a] ; mais nous avons travaillé nuit et jour, dans la peine et la fatigue, afin de n’être à la charge d’aucun de vous.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Nous n’avons reçu gratuitement le pain de personne. » Le grec dit littéralement « pain », terme qui peut aussi désigner plus largement la nourriture ou l’entretien matériel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δωρεὰν
  choice: gratuitement
  rationale: L’adverbe indique que quelque chose est reçu sans paiement. « Gratuitement » exprime naturellement cette nuance économique en français moderne.
- source_word: ἄρτον
  choice: le pain
  rationale: Le nom signifie littéralement « pain », tout en pouvant désigner plus largement la nourriture ou l’entretien matériel. Le sens concret est conservé dans le texte.
- source_word: παρά τινος
  choice: de personne
  rationale: παρά avec le génitif marque ici la source, et la négation donne à τις la valeur de « personne ». Cette tournure est naturelle en français.
- source_word: ἐν κόπῳ καὶ μόχθῳ
  choice: dans la peine et la fatigue
  rationale: Les deux termes proches soulignent ensemble l’effort pénible et épuisant. Cette formulation conserve leur effet cumulatif sans archaïsme.
- source_word: νυκτὸς καὶ ἡμέρας
  choice: nuit et jour
  rationale: Le génitif temporel exprime un travail poursuivi pendant tout le cycle quotidien. « Nuit et jour » est l’expression française courante correspondante.
- source_word: ἐργαζόμενοι
  choice: nous avons travaillé
  rationale: Le participe décrit l’activité par laquelle les auteurs ont évité de dépendre des destinataires. Une proposition verbale est plus naturelle en français.
- source_word: πρὸς τὸ μὴ ἐπιβαρῆσαί
  choice: afin de n’être à la charge de
  rationale: La construction exprime le but. Dans ce contexte, ἐπιβαρέω désigne le fait d’imposer une charge matérielle ou financière ; l’expression française retenue rend clairement cette idée.
- source_word: τινα ὑμῶν
  choice: aucun de vous
  rationale: Sous la négation, l’indéfini singulier suivi du génitif a un sens distributif, rendu idiomatiquement par « aucun de vous ».
- source_word: οὐδὲ ... ἀλλ’
  choice: nous n’avons… ; au contraire
  rationale: Le contexte antérieur doit porter la valeur additive de οὐδέ, tandis que ἀλλά introduit un contraste marqué. « Au contraire » rend celui-ci clairement dans ce verset isolé.
