  text: καὶ ἵνα ῥυσθῶμεν ἀπὸ τῶν ἀτόπων καὶ πονηρῶν ἀνθρώπων, οὐ γὰρ πάντων ἡ πίστις.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/002.yaml
  text: and that we may be delivered from wicked and evil men[b][a], for not all have faith.
translation:
  language: fr
  text: et que nous soyons délivrés des hommes pervers et méchants[a], car tout le monde n’a pas la foi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des hommes déraisonnables et méchants ». Le mot grec peut aussi signifier « déplacés », « absurdes » ou « inconvenants » ; dans ce contexte, il qualifie des adversaires dont la conduite est perverse.
    reason: lexical_alternative
  - marker: b
    text: 'Ou « car tous ne sont pas fidèles ». Le grec dit littéralement : « car la foi n’est pas de tous ».'
    reason: alternative_reading
lexical_decisions:
- source_word: ῥυσθῶμεν
  choice: nous soyons délivrés
  rationale: L’aoriste passif subjonctif après ἵνα exprime le but. « Soyons délivrés » rend l’idée d’être arrachés à des adversaires sans préciser indûment le moyen.
- source_word: ἀτόπων
  choice: dévoyés
  rationale: Ἄτοπος peut désigner ce qui est déplacé, inconvenant, absurde ou déraisonnable. Ici, associé à πονηρῶν et appliqué à des adversaires, « dévoyés » exprime leur conduite moralement et socialement déplacée sans faire double emploi avec « mauvais ».
- source_word: πονηρῶν
  choice: mauvais
  rationale: Terme moral courant désignant ce qui est mauvais ou méchant. « Mauvais » forme en français une association naturelle avec « dévoyés ».
- source_word: ἀνθρώπων
  choice: gens
  rationale: Le pluriel ἀνθρώπων désigne ici des personnes hostiles. « Gens » est naturel en français moderne et n’ajoute pas une précision de sexe que le nom grec, dans cet emploi générique, n’impose pas.
- source_word: πίστις
  choice: foi
  rationale: « Foi » est le sens le plus probable dans le contexte de l’opposition à la mission apostolique. L’autre possibilité, « fidélité » ou « fiabilité », est conservée en note.
- source_word: οὐ γὰρ πάντων ἡ πίστις
  choice: car tout le monde n’a pas la foi
  rationale: La tournure grecque est littéralement « car la foi n’est pas de tous ». La formulation française exprime clairement que la foi n’est pas possédée par chacun, sans transformer la phrase en affirmation plus générale sur la destination de la foi.
theological_decisions:
- issue: Sens de πίστις dans la proposition elliptique
  choice: foi
  alternative: fidélité / être digne de confiance
  rationale: Le contexte d’adversaires hostiles rend le manque de foi plus probable, mais πίστις peut également évoquer la fidélité ou la fiabilité. La note préserve cette réelle possibilité sans l’imposer au texte principal.
translation_notes:
  register: Français international actuel, digne et accessible. « Tout le monde n’a pas la foi » évite l’ambiguïté possible de « tous n’ont pas la foi ». Les deux adjectifs grecs restent distincts, et les variantes lexicales et théologiques sont signalées sans alourdir le texte.
