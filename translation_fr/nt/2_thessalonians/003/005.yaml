  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ δὲ κύριος κατευθύναι ὑμῶν τὰς καρδίας εἰς τὴν ἀγάπην τοῦ θεοῦ καὶ εἰς τὴν ὑπομονὴν τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/005.yaml
  text: May the Lord direct your hearts into the love of God and into the steadfastness of Messiah[a][b][c].
translation:
  language: fr
  text: Que le Seigneur dirige vos cœurs vers l’amour de Dieu[a] et vers la persévérance du Messie[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’amour pour Dieu ». Le grec peut aussi désigner l’amour que Dieu manifeste.
    reason: alternative_reading
  - marker: b
    text: Ou « la persévérance du Messie lui-même », ou « la persévérance envers le Messie ».
    reason: alternative_reading
  - marker: c
    text: Le grec porte « Christ », titre rendu ici par « Messie ».
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος
  choice: Seigneur
  rationale: « Seigneur » est l’équivalent français habituel de ce titre divin ou christologique et n’en précise pas excessivement le référent.
- source_word: κατευθύναι
  choice: dirige
  rationale: 'L’optatif exprime ici un souhait ou une prière : « Que… dirige ». Le verbe garde l’idée de conduire dans une direction déterminée.'
- source_word: καρδίας
  choice: cœurs
  rationale: « Cœurs » conserve l’image biblique désignant le centre de la pensée, de la volonté et des affections.
- source_word: ἀγάπην
  choice: amour
  rationale: « Amour » est l’équivalent français naturel et précis dans ce contexte.
- source_word: τοῦ θεοῦ
  choice: de Dieu
  rationale: Cette formulation conserve l’ambiguïté du génitif grec entre l’amour venant de Dieu, l’amour envers Dieu et, plus largement, l’amour caractérisé par Dieu.
- source_word: ὑπομονὴν
  choice: persévérance
  rationale: Le terme désigne la capacité de tenir ferme et de continuer malgré l’épreuve. « Persévérance » est naturel en français et convient à une disposition intérieure.
- source_word: τοῦ Χριστοῦ
  choice: du Messie
  rationale: Le génitif français préserve plusieurs rapports possibles avec le Messie, tandis que « Messie » traduit Χριστός comme un titre.
theological_decisions:
- issue: Ambiguïté du génitif dans τὴν ἀγάπην τοῦ θεοῦ
  choice: l’amour de Dieu
  alternative: l’amour pour Dieu ; l’amour que Dieu donne ou manifeste
  rationale: Le grec ne tranche pas clairement entre un génitif subjectif, objectif ou qualitatif. Le texte principal conserve donc cette tension.
- issue: Ambiguïté du génitif dans τὴν ὑπομονὴν τοῦ Χριστοῦ
  choice: la persévérance du Messie
  alternative: la persévérance manifestée par le Messie ; la persévérance dans l’attente ou au service du Messie
  rationale: La construction peut désigner la persévérance propre au Messie, celle qui est orientée vers lui ou celle qui est caractérisée par lui. La traduction ne choisit pas silencieusement entre ces lectures.
- issue: Traduction de Χριστοῦ
  choice: du Messie
  alternative: du Christ
  rationale: Χριστός fonctionne ici comme un titre ; « Messie » en rend le sens plutôt que de simplement reprendre sa forme traditionnelle.
translation_notes:
  register: Français international moderne, simple et digne. La structure parallèle « vers… et vers… » suit le mouvement du grec, et les deux génitifs sont volontairement laissés ouverts dans le texte principal.
