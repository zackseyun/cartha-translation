source:
  edition: SBLGNT
  text: τοῖς δὲ τοιούτοις παραγγέλλομεν καὶ παρακαλοῦμεν ⸂ἐν κυρίῳ Ἰησοῦ Χριστῷ⸃ ἵνα μετὰ ἡσυχίας ἐργαζόμενοι τὸν ἑαυτῶν ἄρτον ἐσθίωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/012.yaml
  text: To such people we command and urge in the Lord Jesus the Messiah that[a], working quietly[c][b], they should eat their own bread.
translation:
  language: fr
  text: Mais nous ordonnons à de telles personnes et les exhortons, dans le Seigneur Jésus le Messie, à travailler dans le calme et à manger leur propre pain.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῖς δὲ τοιούτοις
  choice: Mais à de telles personnes
  rationale: Le datif renvoie aux personnes désœuvrées et indisciplinées mentionnées juste avant. « Mais » rend le δέ de transition avec une légère nuance de contraste.
- source_word: παραγγέλλομεν καὶ παρακαλοῦμεν
  choice: nous ordonnons et recommandons
  rationale: 'Les deux verbes sont maintenus : le premier exprime l’autorité, le second une exhortation insistante. « Recommandons » est naturel en français dans ce contexte, sans annuler la force de l’ordre.'
- source_word: ἐν κυρίῳ Ἰησοῦ Χριστῷ
  choice: dans le Seigneur Jésus le Messie
  rationale: « Dans » conserve la formulation grecque, qui peut évoquer à la fois la communion avec le Seigneur et l’autorité attachée à lui. Χριστός garde ici sa valeur de titre et est donc rendu par « le Messie ».
- source_word: μετὰ ἡσυχίας ἐργαζόμενοι
  choice: de travailler dans le calme
  rationale: La tournure exprime une activité menée paisiblement, à l’opposé d’une oisiveté perturbatrice. « Dans le calme » préserve la forme nominale de ἡσυχία.
- source_word: τὸν ἑαυτῶν ἄρτον ἐσθίωσιν
  choice: de manger le pain qu’elles auront elles-mêmes gagné
  rationale: Le pain désigne concrètement la subsistance. L’ajout idiomatique « gagné » explicite le lien contextuel entre leur travail et leur propre nourriture sans réduire le propos à la seule fabrication du pain.
theological_decisions:
- issue: Valeur de Χριστός
  choice: le Messie
  alternative: Christ
  rationale: Dans cette expression, Χριστός demeure un titre identifiable plutôt qu’un simple élément du nom ; « le Messie » en maintient le sens.
- issue: Fondement de l’instruction apostolique
  choice: dans le Seigneur Jésus le Messie
  alternative: au nom du Seigneur Jésus le Messie
  rationale: La traduction formelle « dans » préserve l’ambiguïté de ἐν entre sphère de communion et autorité, tandis que « au nom de » choisirait plus nettement cette dernière.
- issue: Double force de l’instruction
  choice: nous ordonnons et recommandons
  alternative: nous exhortons
  rationale: Conserver les deux verbes maintient ensemble l’autorité de l’ordre et la sollicitude de l’appel pastoral.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase garde la fermeté du texte tout en évitant une syntaxe artificiellement calquée sur le grec. Le féminin pluriel de reprise (« elles ») s’accorde avec « personnes » et ne restreint pas le groupe visé aux femmes.
