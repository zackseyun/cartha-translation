  yaml_path: translation/nt/2_thessalonians/003/013.yaml
  text: But as for you[a], brothers, do not grow weary in doing good.
translation:
  language: fr
  text: Mais vous, frères[a], ne vous lassez pas de faire le bien.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « frères et sœurs » : le grec dit littéralement « frères », terme qui peut ici désigner l’ensemble de la communauté croyante.'
    reason: alternative lexicale et précision sur la portée inclusive
lexical_decisions:
- source_word: ὑμεῖς δέ
  choice: Mais vous
  rationale: δέ marque le contraste avec les personnes désœuvrées évoquées juste avant, tandis que le pronom exprimé ὑμεῖς met « vous » en relief. « Mais vous » rend naturellement les deux éléments en français.
- source_word: ἀδελφοί
  choice: frères
  rationale: Le vocatif masculin pluriel signifie littéralement « frères ». Dans cette adresse à l’assemblée, il peut inclure les croyantes; cette portée est signalée en note sans effacer la forme grecque dans le texte principal.
- source_word: μὴ ἐγκακήσητε
  choice: ne vous lassez pas
  rationale: La construction avec μή exprime une interdiction. ἐγκακέω désigne ici le fait de se fatiguer, de se décourager ou de perdre courage en persévérant; « ne vous lassez pas » est idiomatique et convient à l’action continue qui suit.
- source_word: καλοποιοῦντες
  choice: de faire le bien
  rationale: Le participe présent indique l’activité continue dans laquelle il ne faut pas se lasser. « Faire le bien » est une formulation naturelle, claire et digne en français moderne.
theological_decisions:
- issue: Portée de ἀδελφοί dans une adresse à l’assemblée
  choice: frères
  alternative: frères et sœurs
  rationale: La forme grecque est un masculin pluriel qui peut s’adresser à l’ensemble de la communauté croyante. Le texte conserve la forme lexicale, tandis qu’une note explicite sa portée inclusive probable.
translation_notes:
  register: Français international moderne, simple et digne. La phrase conserve l’opposition emphatique initiale et l’appel à persévérer dans une conduite bénéfique.
