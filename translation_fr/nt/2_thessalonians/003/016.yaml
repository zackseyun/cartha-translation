  rationale: Révision minimale du seul complément modal afin d’éviter l’acception française potentiellement concessive de « de toute manière » et de conserver explicitement l’ampleur de ἐν παντὶ τρόπῳ. Les ancres [a] et [b] restent correctement placées après les expressions auxquelles elles se rapportent.
