id: 2TH.3.16
reference: 2 Thessalonians 3:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Αὐτὸς δὲ ὁ κύριος τῆς εἰρήνης δῴη ὑμῖν τὴν εἰρήνην διὰ παντὸς ἐν παντὶ τρόπῳ. ὁ κύριος μετὰ πάντων ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/016.yaml
  text: May the Lord of peace himself give you peace at all times in every way[b][a]. The Lord be with all of you.
translation:
  language: fr
  text: Que le Seigneur de la paix lui-même vous donne la paix en tout temps[a], de toutes les manières[b]. Que le Seigneur soit avec vous tous.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « continuellement ».
    reason: lexical_alternative
  - marker: b
    text: Ou « en toute manière ».
    reason: lexical_alternative
lexical_decisions:
- source_word: Αὐτὸς
  choice: lui-même
  rationale: L’emploi intensif de αὐτός souligne que le Seigneur est personnellement le sujet de cette bénédiction. « Lui-même » conserve cette insistance en français naturel.
- source_word: δὲ
  choice: non exprimé séparément
  rationale: δέ marque ici une transition légère vers la bénédiction finale, sans contraste fort. En français, la succession des phrases suffit naturellement à rendre cette transition.
- source_word: ὁ κύριος
  choice: le Seigneur
  rationale: « Seigneur » est le rendu français établi de κύριος et préserve le titre sans préciser davantage son référent.
- source_word: τῆς εἰρήνης
  choice: de la paix
  rationale: Le génitif est conservé dans l’expression « le Seigneur de la paix », qui garde la formulation concise et évite une paraphrase interprétative telle que « qui donne la paix ».
- source_word: δῴη
  choice: Que … donne
  rationale: L’optatif aoriste exprime ici un souhait ou une prière de bénédiction. La construction française avec « que » et le subjonctif en rend naturellement la force.
- source_word: τὴν εἰρήνην
  choice: la paix
  rationale: Le français emploie naturellement l’article défini dans « donner la paix », en accord avec l’article grec.
- source_word: διὰ παντὸς
  choice: en tout temps
  rationale: Cette expression conserve clairement la portée temporelle et l’idée de constance.
- source_word: ἐν παντὶ τρόπῳ
  choice: de toute manière
  rationale: τρόπος désigne la manière ou le mode. « De toute manière » en préserve l’étendue sans restreindre le sens à un moyen précis.
- source_word: μετὰ πάντων ὑμῶν
  choice: avec vous tous
  rationale: Cette formulation française naturelle maintient explicitement la portée inclusive de πάντων.
theological_decisions:
- issue: Référent de « Seigneur » dans la bénédiction
  choice: Conserver « le Seigneur » sans explicitation supplémentaire.
  alternative: Préciser « le Seigneur Jésus » ou comprendre l’expression comme une référence générale à Dieu.
  rationale: Le grec dit seulement ὁ κύριος. Le contexte paulinien permet probablement de penser au Seigneur Jésus, mais la traduction ne doit pas ajouter une identification absente de ce verset.
- issue: Valeur de la proposition finale sans verbe exprimé
  choice: 'La rendre comme un souhait de bénédiction : « Que le Seigneur soit avec vous tous. »'
  alternative: 'La rendre comme une affirmation : « Le Seigneur est avec vous tous. »'
  rationale: Dans ce contexte conclusif, la proposition nominale grecque fonctionne comme une bénédiction. Le subjonctif français restitue cette valeur sans la transformer en simple constat.
translation_notes:
  register: Français international moderne, clair et digne. La tournure bénédictive avec « Que… » rend l’optatif grec, tandis que « lui-même » conserve l’accent porté sur le sujet. La ponctuation maintient côte à côte les deux compléments, temporel et modal, sans ajouter de coordination absente du grec.
