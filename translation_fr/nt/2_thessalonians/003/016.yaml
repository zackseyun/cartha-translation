    issue: Ambiguïté possible de « de toute manière »
    rationale: Dans l’usage moderne, l’expression peut avoir le sens concessif de « de toute façon ». Le pluriel « de toutes les manières » explicite mieux la portée de ἐν παντὶ τρόπῳ sans interprétation supplémentaire.
