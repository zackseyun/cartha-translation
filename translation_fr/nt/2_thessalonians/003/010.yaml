id: 2TH.3.10
reference: 2 Thessalonians 3:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ γὰρ ὅτε ἦμεν πρὸς ὑμᾶς, τοῦτο παρηγγέλλομεν ὑμῖν, ὅτι εἴ τις οὐ θέλει ἐργάζεσθαι μηδὲ ἐσθιέτω.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/010.yaml
  text: 'For even when we were with you, we kept commanding you this: if anyone is not willing to work, neither let him eat.'
translation:
  language: fr
  text: 'En effet, lorsque nous étions parmi vous, nous vous donnions cette consigne : si quelqu’un ne veut pas travailler, qu’il ne mange pas non plus.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec dit littéralement « ne veut pas travailler » : il s’agit d’un manque de volonté, non d’une incapacité.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: En effet
  rationale: La locution introduit une explication qui appuie l’exemple du verset précédent. « En effet » rend naturellement en français la valeur explicative et emphatique de l’ensemble.
- source_word: ὅτε ἦμεν πρὸς ὑμᾶς
  choice: lorsque nous étions parmi vous
  rationale: πρός avec des personnes exprime ici la présence au milieu d’elles. « Parmi vous » est naturel et évite l’ambiguïté possible de « avec vous ».
- source_word: τοῦτο παρηγγέλλομεν ὑμῖν
  choice: nous vous donnions cette consigne
  rationale: L’imparfait « donnions » conserve l’aspect duratif ou habituel de παρηγγέλλομεν. « Consigne » exprime l’autorité du verbe sans la lourdeur de « nous vous commandions ceci ».
- source_word: ὅτι
  choice: ':'
  rationale: ὅτι introduit le contenu de la consigne ; les deux-points remplissent cette fonction de manière idiomatique en français.
- source_word: εἴ τις
  choice: si quelqu’un
  rationale: Cette formulation conserve la condition indéfinie et le singulier générique.
- source_word: οὐ θέλει ἐργάζεσθαι
  choice: ne veut pas travailler
  rationale: θέλει porte sur la volonté, non sur la capacité. La formulation française est directe et n’intensifie pas le grec comme le ferait « refuse de travailler ».
- source_word: μηδὲ ἐσθιέτω
  choice: qu’il ne mange pas non plus
  rationale: Le subjonctif à valeur jussive rend l’impératif grec à la troisième personne ; « non plus » conserve la relation exprimée par μηδέ.
theological_decisions:
- issue: La parole vise-t-elle l’incapacité ou le manque de volonté de travailler ?
  choice: « si quelqu’un ne veut pas travailler »
  alternative: « si quelqu’un ne peut pas travailler »
  rationale: θέλει désigne la volonté. Le texte ne formule donc pas une exclusion des personnes incapables de travailler.
- issue: Forme singulière générique dans la conséquence
  choice: « qu’il ne mange pas non plus »
  alternative: « que cette personne ne mange pas non plus »
  rationale: Le grec emploie τις et un impératif à la troisième personne du singulier. Le pronom « il » conserve cette construction représentative en français naturel, sans limiter le principe aux hommes.
translation_notes:
  register: Français international moderne, clair et digne. La phrase garde la fermeté de la consigne apostolique, tout en distinguant explicitement le refus de travailler de l’incapacité. Le marqueur [a] est placé après l’ensemble de la maxime pour ne pas interrompre sa lecture.
