reference: 2 Thessalonians 3:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὐχ ὅτι οὐκ ἔχομεν ἐξουσίαν, ἀλλ’ ἵνα ἑαυτοὺς τύπον δῶμεν ὑμῖν εἰς τὸ μιμεῖσθαι ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/009.yaml
  text: not because we do not have the right, but in order to give ourselves to you as an example for you to imitate us.
translation:
  language: fr
  text: Ce n’est pas parce que nous n’avons pas le droit[a], mais pour vous donner nous-mêmes en exemple[b], afin que vous nous imitiez.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’autorité » ou « le pouvoir ». Dans ce contexte, il s’agit vraisemblablement d’un droit légitime.
    reason: lexical_alternative
  - marker: b
    text: Ou « modèle » ou « exemple à suivre ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξουσίαν
  choice: le droit
  rationale: Dans le contexte, le terme désigne le droit légitime des apôtres à recevoir un soutien matériel. « Le droit » exprime cette prérogative plus naturellement que « l’autorité » ou « le pouvoir ».
- source_word: ἑαυτοὺς
  choice: nous-mêmes
  rationale: Le pronom réfléchi renvoie à Paul et à ses compagnons; « nous-mêmes » en conserve la valeur emphatique et réflexive.
- source_word: τύπον
  choice: exemple
  rationale: Le mot désigne ici un comportement exemplaire destiné à être reproduit. « Exemple » est clair et naturel en français moderne.
- source_word: δῶμεν
  choice: donner
  rationale: La formulation « nous donner nous-mêmes à vous comme exemple » conserve l’image grecque tout en restant intelligible en français.
- source_word: εἰς τὸ μιμεῖσθαι ἡμᾶς
  choice: pour que vous nous imitiez
  rationale: Cette formulation rend directement la visée exprimée par la construction grecque et conserve « nous » comme objet explicite du verbe imiter.
- source_word: οὐχ ὅτι οὐκ
  choice: Ce n’est pas parce que nous n’en avons pas
  rationale: Cette tournure française naturelle préserve la double négation et introduit clairement la rectification du motif.
- source_word: ἀλλ’ ἵνα
  choice: mais afin de
  rationale: Cette expression marque nettement le contraste et la finalité, sans alourdir la phrase.
theological_decisions:
- issue: Nature du droit évoqué par ἐξουσίαν
  choice: Paul affirme que ses compagnons et lui possèdent un droit légitime, ici celui de recevoir un soutien matériel, auquel ils ont volontairement renoncé.
  alternative: Comprendre le terme plus largement comme l’autorité ou le pouvoir apostolique.
  rationale: Le contexte immédiat porte sur le fait de travailler pour ne pas être à la charge des croyants. La traduction « le droit » conserve ce point pratique sans étendre indûment l’affirmation à toute l’autorité apostolique.
translation_notes:
  register: Français international moderne, digne et accessible. La structure à deux expressions de but (« afin de… pour que… ») reflète les deux constructions grecques successives sans effacer leur relation.
