  text: πιστὸς δέ ἐστιν ὁ κύριος, ὃς στηρίξει ὑμᾶς καὶ φυλάξει ἀπὸ τοῦ πονηροῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/003.yaml
  text: But the Lord is faithful[a], who will strengthen you and guard you from the evil one.
translation:
  language: fr
  text: 'Mais le Seigneur est fidèle : il vous affermira et vous gardera du Malin.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « du mal ». Le grec τοῦ πονηροῦ peut être compris soit au masculin (« le Malin »), soit au neutre (« le mal »).'
    reason: alternative_reading
lexical_decisions:
- source_word: πιστὸς
  choice: fidèle
  rationale: Adjectif attribut exprimant la fiabilité constante du Seigneur, en contraste avec l’absence de foi mentionnée au verset précédent. « Fidèle » est naturel en français et conserve la portée théologique du terme.
- source_word: δέ
  choice: Mais
  rationale: Marque ici le contraste entre l’infidélité ou l’absence de foi de certains et la fidélité du Seigneur.
- source_word: ὁ κύριος
  choice: le Seigneur
  rationale: Rend directement le titre κύριος sans préciser davantage son référent; dans ce contexte paulinien, il désigne très probablement Jésus.
- source_word: στηρίξει
  choice: affermira
  rationale: Le verbe signifie rendre ferme, établir ou fortifier. « Affermira » conserve cette image tout en étant idiomatique dans un registre biblique moderne et digne.
- source_word: φυλάξει
  choice: gardera
  rationale: Exprime l’action de veiller sur quelqu’un et de le protéger; « gardera » reste proche du grec et s’accorde naturellement avec le complément introduit par ἀπό.
- source_word: ἀπὸ
  choice: du
  rationale: La contraction de « de le » rend ici naturellement l’idée de protection hors de l’atteinte du danger désigné.
- source_word: τοῦ πονηροῦ
  choice: du Mauvais
  rationale: La forme grecque peut être masculine (« le Mauvais ») ou neutre (« le mal »). Le texte principal retient la lecture personnelle, bien attestée dans le Nouveau Testament, tout en signalant l’autre lecture en note.
theological_decisions:
- issue: Référent de τοῦ πονηροῦ
  choice: le Mauvais
  alternative: le mal
  rationale: Le génitif grec avec article est grammaticalement ambigu entre le masculin, qui désigne une puissance personnelle mauvaise, et le neutre, qui désigne le mal. La lecture personnelle figure dans le texte, sans supprimer l’autre possibilité, donnée en note.
translation_notes:
  register: Français international moderne, clair et digne. Le deux-points évite une relative française pesante après « le Seigneur est fidèle » tout en conservant le lien explicatif du grec ὃς. La majuscule à « Mauvais » signale la lecture personnelle retenue sans ajouter le nom « Satan ».
