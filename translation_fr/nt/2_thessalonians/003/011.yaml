  text: ἀκούομεν γάρ τινας περιπατοῦντας ἐν ὑμῖν ἀτάκτως, μηδὲν ἐργαζομένους ἀλλὰ περιεργαζομένους·
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/011.yaml
  text: For we hear that some among you are walking disorderly[a], doing no work at all[b], but meddling.
translation:
  language: fr
  text: 'Nous entendons, en effet, que certains d’entre vous se conduisent de manière désordonnée[a] : ils ne travaillent pas du tout, mais se mêlent des affaires des autres[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vivent dans l’oisiveté » ou « mènent une vie indisciplinée ». L’adverbe grec peut désigner une conduite contraire à l’ordre attendu dans la communauté ou, dans ce contexte, une vie oisive.
    reason: lexical_alternative
  - marker: b
    text: 'Le grec fait un jeu de mots : ils ne « travaillent » pas, mais s’« affairent autour » de ce qui ne les regarde pas.'
    reason: wordplay
lexical_decisions:
- source_word: ἀκούομεν
  choice: nous entendons
  rationale: Le présent indique qu’un rapport circule actuellement ou parvient régulièrement à Paul. « Nous entendons » est naturel et conserve cette valeur.
- source_word: γάρ
  choice: en effet
  rationale: La particule introduit l’explication de l’exhortation précédente. « En effet » exprime clairement ce lien en français courant.
- source_word: τινας
  choice: certains
  rationale: Le pronom désigne une partie non précisée de la communauté, sans généraliser l’accusation.
- source_word: περιπατοῦντας
  choice: se conduisent
  rationale: Le verbe « marcher » est ici une métaphore conventionnelle du comportement. « Se conduisent » en restitue naturellement le sens en français sans produire un calque obscur.
- source_word: ἐν ὑμῖν
  choice: parmi vous
  rationale: L’expression situe les personnes concernées au sein de la communauté thessalonicienne.
- source_word: ἀτάκτως
  choice: de manière désordonnée
  rationale: Le terme évoque une conduite qui ne respecte pas l’ordre ou la discipline attendus. Cette formulation garde son champ plus large, tandis que la proposition suivante précise ici l’absence de travail.
- source_word: μηδὲν ἐργαζομένους
  choice: ils ne travaillent pas du tout
  rationale: La négation μηδέν est emphatique. « Pas du tout » rend clairement l’idée d’une absence complète de travail.
- source_word: ἀλλὰ
  choice: mais
  rationale: La conjonction marque le contraste direct entre ne pas travailler et déployer une activité déplacée.
- source_word: περιεργαζομένους
  choice: se mêlent des affaires des autres
  rationale: Le verbe décrit le fait de s’occuper indiscrètement de ce qui ne regarde pas la personne. Cette traduction est idiomatique et conserve le contraste, fondé en grec sur un jeu de mots avec ἐργάζομαι.
