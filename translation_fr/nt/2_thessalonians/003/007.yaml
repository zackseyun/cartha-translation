  text: αὐτοὶ γὰρ οἴδατε πῶς δεῖ μιμεῖσθαι ἡμᾶς, ὅτι οὐκ ἠτακτήσαμεν ἐν ὑμῖν
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/007.yaml
  text: For you yourselves know how you ought to imitate us[a], because we did not behave disorderly among you.
translation:
  language: fr
  text: Vous savez vous-mêmes comment il faut nous imiter[a], car nous ne nous sommes pas conduits de manière désordonnée parmi vous.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus précisément dans ce contexte : « nous ne sommes pas restés oisifs parmi vous ».'
    reason: Alternative lexicale contextuelle pour ἀτακτέω.
lexical_decisions:
- source_word: αὐτοὶ
  choice: vous-mêmes
  rationale: Le pronom intensif souligne que les Thessaloniciens le savent personnellement; « vous-mêmes » conserve cette emphase naturelle en français.
- source_word: γὰρ
  choice: en effet
  rationale: La particule introduit l’explication de l’exhortation précédente; « en effet » assure un lien argumentatif naturel en français.
- source_word: οἴδατε
  choice: vous savez
  rationale: Bien que la forme grecque soit historiquement parfaite, οἶδα a ici un sens présent.
- source_word: πῶς δεῖ μιμεῖσθαι ἡμᾶς
  choice: comment il faut nous imiter
  rationale: Cette formulation conserve à la fois l’idée de manière exprimée par πῶς, la nécessité de δεῖ et l’objet personnel « nous », sans remplacer celui-ci par l’expression interprétative « notre exemple ».
- source_word: ὅτι
  choice: puisque
  rationale: La conjonction présente la conduite des missionnaires comme le fondement déjà connu de l’imitation demandée; « puisque » rend naturellement cette nuance causale.
- source_word: οὐκ ἠτακτήσαμεν
  choice: nous ne nous sommes pas conduits de manière désordonnée
  rationale: ἀτακτέω décrit une conduite qui sort du rang, indisciplinée ou désordonnée. Le contexte concerne notamment l’oisiveté, mais le texte principal conserve le sens lexical plus large.
- source_word: ἐν ὑμῖν
  choice: parmi vous
  rationale: L’expression désigne la conduite des missionnaires au milieu de la communauté; « parmi vous » est précis et idiomatique.
theological_decisions:
- issue: Portée de ἀτακτέω dans le contexte immédiat
  choice: Une description générale d’une conduite désordonnée ou indisciplinée.
  alternative: « nous ne sommes pas restés oisifs parmi vous »
  rationale: Le refus de travailler est central dans le contexte de 2 Thessaloniciens 3, ce qui rend « rester oisifs » plausible. Toutefois, ἀτακτέω possède une portée plus large; la traduction principale évite donc de réduire silencieusement son sens à la seule oisiveté, tandis que la note préserve cette lecture contextuelle.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche du grec tout en étant naturelle; « il faut » exprime clairement l’obligation sans lourdeur, et la note maintient l’ambiguïté entre désordre général et oisiveté contextuelle.
