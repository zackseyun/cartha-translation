  text: The grace of our Lord Jesus Christ be with all of you[a].
translation:
  language: fr
  text: Que la grâce de notre Seigneur Jésus-Christ[a] soit avec vous tous.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Jésus le Messie ».'
    reason: Préserve la valeur titulaire possible de Χριστός, que la forme traditionnelle « Christ » rend moins transparente en français courant.
lexical_decisions:
- source_word: χάρις
  choice: grâce
  rationale: Terme habituel des bénédictions pauliniennes, « grâce » exprime ici la faveur généreuse accordée par Dieu et conserve la portée théologique du grec.
- source_word: κυρίου
  choice: Seigneur
  rationale: Dans ce titre donné à Jésus, « Seigneur » rend naturellement l’autorité et la dignité exprimées par κύριος.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jésus-Christ
  rationale: 'Dans cette formule finale, « Jésus-Christ » est l’expression française courante et digne. Une note conserve la possibilité de rendre explicitement Χριστός comme un titre : « le Messie ».'
- source_word: μετὰ πάντων ὑμῶν
  choice: soit avec vous tous
  rationale: Le grec dit littéralement « avec vous tous »; le verbe « soit » est ajouté en français pour exprimer naturellement le souhait contenu dans la bénédiction, tout en maintenant sa portée inclusive.
theological_decisions:
- issue: Valeur de Χριστός dans la bénédiction finale
  choice: Jésus-Christ
  alternative: Jésus le Messie
  rationale: Dans cette formule épistolaire, Χριστός peut être entendu comme un titre encore significatif ou comme un élément devenu étroitement associé au nom de Jésus. Le texte retient la tournure française établie sans effacer l’autre compréhension, signalée en note.
translation_notes:
  register: Français international moderne, simple et solennel. La formulation conserve la structure d’une bénédiction finale et place naturellement « tous » après « vous ».
