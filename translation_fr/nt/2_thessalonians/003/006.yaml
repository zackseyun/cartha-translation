source:
  edition: SBLGNT
  text: Παραγγέλλομεν δὲ ὑμῖν, ἀδελφοί, ἐν ὀνόματι τοῦ κυρίου ⸀ἡμῶν Ἰησοῦ Χριστοῦ στέλλεσθαι ὑμᾶς ἀπὸ παντὸς ἀδελφοῦ ἀτάκτως περιπατοῦντος καὶ μὴ κατὰ τὴν παράδοσιν ἣν ⸀παρελάβοσαν παρ’ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/006.yaml
  text: We command you[a], brothers, in the name of our Lord Jesus the Messiah[e][d][c][b], to keep away from every brother who is walking disorderly and not according to the tradition that they received from us.
translation:
  language: fr
  text: Frères[a], nous vous ordonnons, au nom de notre Seigneur Jésus le Messie[b], de vous tenir à l’écart de tout frère qui se conduit de manière désordonnée[c] et non selon la tradition qu’ils ont reçue de nous[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec emploie le masculin pluriel « frères » ; Paul s’adresse ici à l’ensemble de l’Église.
    reason: lexical_alternative
  - marker: b
    text: Ou « Jésus-Christ ».
    reason: lexical_alternative
  - marker: c
    text: L’expression peut aussi se traduire par « qui vit dans l’indiscipline » ; dans la suite du passage, cette conduite est notamment liée à l’oisiveté.
    reason: lexical_alternative
  - marker: d
    text: Le texte grec imprimé porte « qu’ils ont reçue de nous ». Certains manuscrits ont « que vous avez reçue de nous » ou « qu’il a reçue de nous », régularisant ainsi l’accord avec les destinataires ou avec « tout frère ».
    reason: textual_variant
lexical_decisions:
- source_word: Παραγγέλλομεν δὲ ὑμῖν
  choice: Cependant, frères, nous vous ordonnons
  rationale: παραγγέλλω exprime une directive revêtue d’autorité, d’où « ordonnons ». δέ marque ici une transition ou un léger contraste; « cependant » le rend sans lui donner une valeur temporelle absente du grec.
- source_word: ἀδελφοί
  choice: frères
  rationale: Le vocatif masculin pluriel est conservé. Dans ce contexte épistolaire, il s’adresse à l’ensemble de l’Église, ce qu’explicite la note.
- source_word: ἐν ὀνόματι τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: au nom de notre Seigneur Jésus le Messie
  rationale: « Au nom de » préserve l’expression solennelle et son idée d’autorité. Χριστός est ici rendu comme un titre, « le Messie ».
- source_word: στέλλεσθαι ὑμᾶς ἀπό
  choice: de vous tenir à l’écart de
  rationale: Le moyen στέλλεσθαι avec ἀπό évoque le fait de se retirer ou de garder ses distances. Cette formulation conserve la portée disciplinaire sans préciser indûment une exclusion officielle.
- source_word: παντὸς ἀδελφοῦ
  choice: de tout frère
  rationale: La formulation conserve le singulier masculin et le vocabulaire familial de la communauté chrétienne.
- source_word: ἀτάκτως περιπατοῦντος
  choice: qui se conduit de manière désordonnée
  rationale: περιπατέω décrit métaphoriquement la conduite de vie. « Se conduit » est naturel en français, tandis que « de manière désordonnée » garde la portée assez large de ἀτάκτως sans la limiter d’emblée à l’oisiveté.
- source_word: μὴ κατὰ τὴν παράδοσιν
  choice: et non selon la tradition
  rationale: παράδοσις désigne ce qui a été transmis. « Tradition » est le correspondant direct; le complément précise qu’il s’agit de la transmission apostolique.
- source_word: ἣν παρελάβοσαν παρ’ ἡμῶν
  choice: qu’ils ont reçue de nous
  rationale: La forme παρελάβοσαν du texte imprimé est à la troisième personne du pluriel. Le français en conserve la discordance inattendue avec le singulier « tout frère » plutôt que de corriger silencieusement le texte.
theological_decisions:
- issue: Rendu du titre Χριστοῦ
  choice: le Messie
  alternative: le Christ
  rationale: Dans cette titulature christologique, « le Messie » fait entendre le sens du titre grec sans le traiter simplement comme un nom propre.
- issue: Portée de la séparation exprimée par στέλλεσθαι ὑμᾶς ἀπό
  choice: vous tenir à l’écart de
  alternative: vous retirer de la compagnie de
  rationale: Le texte commande une prise de distance envers le membre désordonné, mais ne définit pas ici explicitement une procédure officielle d’exclusion.
- issue: Discordance de nombre dans ἣν παρελάβοσαν
  choice: qu’ils ont reçue
  alternative: que vous avez reçue / qu’il a reçue
  rationale: Le texte SBLGNT présente une troisième personne du pluriel malgré « tout frère » au singulier. La traduction maintient cette tension textuelle et signale les variantes.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la force de l’ordre apostolique, le vocabulaire communautaire de « frères » et « tradition », ainsi que l’étrangeté syntaxique de la leçon grecque au pluriel. « Cependant » rend le connecteur δέ comme transition contrastive, sans introduire un « maintenant » temporel.
