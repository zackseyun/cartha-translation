id: 2TH.3.15
reference: 2 Thessalonians 3:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ μὴ ὡς ἐχθρὸν ἡγεῖσθε, ἀλλὰ νουθετεῖτε ὡς ἀδελφόν.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/015.yaml
  text: And do not regard him as an enemy[b][a], but admonish him as a brother.
translation:
  language: fr
  text: Et ne le considérez pas comme un ennemi, mais avertissez-le comme un frère[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ici, « frère » désigne un autre croyant ; le masculin singulier peut représenter tout membre de la communauté chrétienne.
    reason: cultural_note
lexical_decisions:
- source_word: ἡγεῖσθε
  choice: considérez
  rationale: Le verbe exprime ici le jugement porté sur quelqu’un, c’est-à-dire le fait de le tenir pour appartenant à une certaine catégorie. « Considérez » est direct et naturel en français.
- source_word: ἐχθρόν
  choice: ennemi
  rationale: « Ennemi » rend clairement la catégorie dans laquelle cette personne ne doit pas être placée.
- source_word: νουθετεῖτε
  choice: avertissez
  rationale: Le verbe désigne un avertissement donné dans une intention corrective. « Avertissez » conserve cette force sans suggérer une hostilité punitive.
- source_word: ἀδελφόν
  choice: frère
  rationale: Le masculin singulier du texte désigne ici un membre de la communauté croyante. La formulation est conservée, et sa portée représentative est précisée en note.
- source_word: ὡς
  choice: comme
  rationale: Dans les deux propositions, « comme » indique en quelle qualité la personne doit être considérée et avertie.
- source_word: καὶ μὴ ... ἀλλὰ
  choice: Et ne… pas…, mais…
  rationale: Cette construction préserve à la fois le lien avec l’instruction précédente et le contraste marqué entre hostilité et correction fraternelle.
theological_decisions:
- issue: Attitude à adopter dans la discipline envers un croyant désobéissant
  choice: La personne ne doit pas être considérée comme un ennemi, mais avertie tout en étant reconnue comme membre de la communauté croyante.
  alternative: On pourrait comprendre le verset comme un conseil général relatif aux conflits interpersonnels.
  rationale: Le contexte immédiat de 2 Thessaloniciens 3.14-15 concerne la réponse de la communauté à celui qui n’obéit pas à l’instruction apostolique. Le terme « frère » maintient la relation communautaire sans atténuer la nécessité de l’avertissement.
translation_notes:
  register: Français international moderne, clair et digne. « Avertissez-le » restitue la dimension corrective de νουθετεῖτε dans un langage courant, tandis que la structure antithétique du grec est conservée.
