  text: Ὁ πρεσβύτερος Γαΐῳ τῷ ἀγαπητῷ, ὃν ἐγὼ ἀγαπῶ ἐν ἀληθείᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/001.yaml
  text: The elder to beloved Gaius[a], whom I love in truth.
translation:
  language: fr
  text: L’ancien, à Gaïus, le bien-aimé, que j’aime dans la vérité.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « que j’aime véritablement » ; autre traduction possible : « que j’aime en vérité ». L’expression grecque peut désigner un amour sincère, un amour fondé sur la vérité de l’Évangile, ou les deux.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ὁ πρεσβύτερος
  choice: L’ancien
  rationale: Cette désignation substantivée présente l’expéditeur par son statut ou sa fonction. « L’ancien » est naturel en français biblique actuel et évite le terme plus technique « presbytre » ainsi que le simple sens d’âge de « vieillard ».
- source_word: Γαΐῳ
  choice: à Gaïus
  rationale: Le datif désigne le destinataire de la lettre. « Gaïus » est la forme française traditionnelle et établie du nom.
- source_word: τῷ ἀγαπητῷ
  choice: le bien-aimé
  rationale: Cette appellation affectueuse conserve le lien lexical avec le verbe ἀγαπῶ qui suit. La reprise de l’article par « le » rend la construction appositive naturelle en français.
- source_word: ὃν ἐγὼ ἀγαπῶ
  choice: que j’aime
  rationale: Le pronom relatif est complément d’objet du verbe « aimer ». Le français exprime nécessairement le sujet par « je » ; aucune emphase supplémentaire n’est imposée au pronom grec explicite.
- source_word: ἐν ἀληθείᾳ
  choice: dans la vérité
  rationale: Cette formulation préserve le substantif « vérité » et sa résonance johannique sans réduire la phrase à la seule sincérité. L’article français est idiomatique et ne prétend pas reproduire mécaniquement la détermination grecque.
theological_decisions:
- issue: Portée de ἐν ἀληθείᾳ dans la formule finale
  choice: dans la vérité
  alternative: véritablement ; en vérité
  rationale: L’expression peut évoquer un amour sincère, un amour situé ou fondé dans la vérité de l’Évangile, ou les deux. Le texte principal garde cette ouverture théologique, tandis que la note explicite les principales nuances possibles.
translation_notes:
  register: Français international moderne, digne et lisible. La formulation conserve la brièveté de l’adresse épistolaire grecque et la répétition intentionnelle de la famille lexicale de l’amour.
