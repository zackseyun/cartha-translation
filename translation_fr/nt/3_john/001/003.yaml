id: 3JN.1.3
reference: 3 John 1:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐχάρην γὰρ λίαν ἐρχομένων ἀδελφῶν καὶ μαρτυρούντων σου τῇ ἀληθείᾳ, καθὼς σὺ ἐν ἀληθείᾳ περιπατεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/003.yaml
  text: For I rejoiced greatly when brothers came and testified to your truth[c][b][a], just as you are walking in truth.
translation:
  language: fr
  text: Car j’ai éprouvé une très grande joie lorsque des frères[a] sont venus et ont témoigné de ta fidélité à la vérité[b], tout comme tu marches dans la vérité.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des frères et sœurs », au sens de croyants; le grec dit « frères ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « ont témoigné de ta vérité »; on peut aussi comprendre « ont témoigné au sujet de la vérité qui est en toi ».
    reason: alternative_reading
lexical_decisions:
- source_word: ἐχάρην γὰρ λίαν
  choice: Car j’ai éprouvé une très grande joie
  rationale: Le passé composé rend naturellement l’aoriste français, tandis que « une très grande joie » exprime pleinement l’intensité de λίαν. « Car » conserve le lien explicatif de γάρ avec le verset précédent.
- source_word: ἐρχομένων ἀδελφῶν
  choice: lorsque des frères sont venus
  rationale: La construction participiale au génitif a ici une valeur circonstancielle temporelle. « Frères » respecte le masculin pluriel grec et le vocabulaire familial des premières communautés chrétiennes.
- source_word: μαρτυρούντων
  choice: ont témoigné
  rationale: Ce choix conserve le langage du témoignage propre à μαρτυρέω tout en restant naturel en français moderne.
- source_word: σου τῇ ἀληθείᾳ
  choice: de ta fidélité à la vérité
  rationale: Le grec associe le possessif σου à « la vérité » d’une manière difficile à reproduire littéralement en français. Cette formulation exprime la relation personnelle de Gaïus à la vérité sans suggérer qu’il posséderait une vérité qui lui serait propre; la forme plus littérale est signalée en note.
- source_word: καθὼς
  choice: tout comme
  rationale: Cette locution marque clairement la correspondance entre le témoignage reçu et la conduite effective du destinataire.
- source_word: ἐν ἀληθείᾳ περιπατεῖς
  choice: tu marches dans la vérité
  rationale: La traduction conserve à la fois le présent et la métaphore éthique johannique de la marche, plutôt que de l’expliciter par le seul verbe « vivre ».
theological_decisions:
- issue: Sens de « vérité » dans le contexte éthique johannique
  choice: Conserver « vérité » dans les deux propositions, tout en rendant la première relation possessive par « ta fidélité à la vérité ».
  alternative: « la vérité qui est en toi » ou, plus littéralement, « ta vérité »
  rationale: Le verset unit vérité confessée et conduite vécue. Le maintien du mot « vérité » préserve sa portée à la fois doctrinale, relationnelle et morale, sans la réduire à la sincérité ni résoudre entièrement la nature de cette fidélité.
translation_notes:
  register: Français international moderne, digne et accessible. La métaphore « marcher dans la vérité » est maintenue en raison de son importance dans le style johannique. La formulation évite l’expression potentiellement trompeuse « ta vérité » dans le corps du texte, tout en la conservant en note comme reflet de la construction grecque.
