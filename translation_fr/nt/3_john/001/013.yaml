  source_fidelity: Le texte rend fidèlement Πολλὰ εἶχον γράψαι σοι par « J’avais bien des choses à t’écrire » et conserve le contraste de ἀλλ’ οὐ θέλω. La répétition de σοι γράφειν est justement maintenue par « t’écrire ». « Avec de l’encre et une plume » transmet naturellement le moyen exprimé par διὰ avec le génitif. L’imparfait « J’avais » respecte le cadre passé de εἶχον.
  naturalness: Le français est moderne, clair et digne. « Bien des choses » est idiomatique sans effacer le pluriel, et la répétition de « t’écrire » reste naturelle dans cette formulation épistolaire. La ponctuation française avant le point-virgule est correcte et préserve l’enchaînement avec le verset suivant.
  terminology: « Plume » est un équivalent fonctionnel naturel de κάλαμος dans un contexte d’écriture. La note signale correctement que le terme désigne littéralement un roseau employé comme instrument d’écriture, sans imposer un sens plus technique au texte principal.
