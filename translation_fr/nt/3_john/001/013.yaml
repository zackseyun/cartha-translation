  text: Πολλὰ εἶχον ⸂γράψαι σοι⸃, ἀλλ’ οὐ θέλω διὰ μέλανος καὶ καλάμου σοι ⸀γράφειν·
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/013.yaml
  text: I had many things to write to you[a], but I do not want to write to you with ink and pen;
translation:
  language: fr
  text: J’avais bien des choses à t’écrire, mais je ne veux pas t’écrire avec de l’encre et une plume[a] ;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « avec de l’encre et un roseau » ; le roseau servait de plume.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πολλὰ
  choice: bien des choses
  rationale: L’adjectif neutre pluriel est employé substantivement. « Bien des choses » rend naturellement le pluriel et l’idée de quantité en français.
- source_word: εἶχον
  choice: J’avais
  rationale: L’imparfait grec situe dans le passé le projet d’écrire. L’imparfait français en conserve simplement la valeur.
- source_word: γράψαι σοι
  choice: à t’écrire
  rationale: L’infinitif aoriste désigne ici l’action envisagée, tandis que le datif σοι indique le destinataire. Cette tournure est naturelle en français.
- source_word: ἀλλ’ οὐ θέλω
  choice: mais je ne veux pas
  rationale: Cette formulation moderne et directe rend le désir ou la volonté exprimés par θέλω sans durcir le propos.
- source_word: διὰ μέλανος καὶ καλάμου
  choice: avec de l’encre et une plume
  rationale: διά avec le génitif exprime le moyen. μέλαν désigne l’encre et κάλαμος le roseau employé comme instrument d’écriture ; « plume » en rend clairement la fonction dans le texte courant.
- source_word: σοι γράφειν
  choice: t’écrire
  rationale: Le présent infinitif peut présenter l’activité d’écrire dans son déroulement, mais l’infinitif français simple suffit ici sans surinterpréter l’aspect.
theological_decisions: []
translation_notes:
  register: Français international moderne, simple et digne. Le tutoiement correspond au pronom singulier σοι. La répétition de « t’écrire » conserve celle du grec et la ponctuation finale maintient le lien avec le verset suivant.
