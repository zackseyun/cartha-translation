id: 3JN.1.12
reference: 3 John 1:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Δημητρίῳ μεμαρτύρηται ὑπὸ πάντων καὶ ὑπὸ αὐτῆς τῆς ἀληθείας· καὶ ἡμεῖς δὲ μαρτυροῦμεν, καὶ ⸀οἶδας ὅτι ἡ μαρτυρία ἡμῶν ἀληθής ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/012.yaml
  text: Demetrius has received testimony from everyone[a], and from the truth itself. We also testify[b], and you know that our testimony is true.
translation:
  language: fr
  text: Démétrius a reçu témoignage de tous[a], et de la vérité elle-même[b]. Nous aussi, nous lui rendons témoignage, et tu sais que notre témoignage est vrai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « il a été rendu témoignage à Démétrius par tous ». Le parfait passif grec présente ce témoignage comme déjà établi et ayant toujours valeur.'
    reason: lexical_alternative
  - marker: b
    text: « La vérité elle-même » peut signifier que la vie de Démétrius est conforme à la vérité ou, plus largement, que la vérité — notamment celle de l’Évangile — témoigne en sa faveur.
    reason: alternative_reading
lexical_decisions:
- source_word: Δημητρίῳ
  choice: Démétrius
  rationale: Translittération française usuelle du nom propre grec, avec la forme traditionnelle en -us.
- source_word: μεμαρτύρηται
  choice: reçoit un témoignage favorable
  rationale: Le parfait passif exprime un témoignage rendu dont la valeur demeure. « Favorable » explicite la portée élogieuse du contexte sans transformer le verbe en simple réputation populaire.
- source_word: ὑπὸ πάντων
  choice: de tous
  rationale: Dans cette construction passive, ὑπό avec le génitif désigne les auteurs du témoignage. « De tous » est naturel et conserve la portée générale.
- source_word: ὑπὸ αὐτῆς τῆς ἀληθείας
  choice: de la vérité elle-même
  rationale: La tournure garde l'article et la valeur intensive de αὐτῆς, sans réduire « la vérité » à une interprétation unique.
- source_word: καὶ ἡμεῖς δὲ μαρτυροῦμεν
  choice: Nous aussi, nous lui rendons témoignage
  rationale: « Nous aussi » rend la valeur additive de καί…δέ et l'emploi explicite du pronom ἡμεῖς. Le complément « lui » est fourni par le contexte immédiat.
- source_word: οἶδας
  choice: tu sais
  rationale: οἶδα, parfait de forme, a ici le sens présent usuel de « savoir »; le singulier correspond au destinataire de la lettre.
- source_word: ἡ μαρτυρία ἡμῶν
  choice: notre témoignage
  rationale: Rend directement le substantif μαρτυρία et maintient le lien lexical avec μαρτυροῦμεν.
- source_word: ἀληθής ἐστιν
  choice: est vrai
  rationale: Traduction directe qui conserve le lien lexical et thématique avec ἀλήθεια, « vérité ».
theological_decisions:
- issue: Sens de « la vérité elle-même » dans le langage johannique
  choice: Conserver littéralement « la vérité elle-même »
  alternative: « l'Évangile lui-même » ou « sa vie conforme à la vérité »
  rationale: 'Le grec permet plusieurs nuances : la conduite de Démétrius peut attester son accord avec la vérité, ou la vérité comprise plus largement peut témoigner en sa faveur. La traduction ne tranche pas cette richesse théologique.'
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe évite le passif lourd tout en conservant la valeur durable du parfait grec. Le tutoiement suit le destinataire singulier de cette lettre personnelle.
