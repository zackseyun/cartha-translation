  text: Ἀγαπητέ, πιστὸν ποιεῖς ὃ ἐὰν ἐργάσῃ εἰς τοὺς ἀδελφοὺς καὶ ⸀τοῦτο ξένους,
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/005.yaml
  text: Beloved[a], you are acting faithfully in whatever you do for the brothers[b], and especially when they are strangers.
translation:
  language: fr
  text: Bien-aimé[a], tu agis fidèlement dans tout ce que tu fais pour les frères[b], et cela, même lorsqu’ils te sont inconnus[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Cher ami ».'
    reason: lexical_alternative
  - marker: b
    text: Le grec emploie ici le masculin pluriel « frères ». Dans ce contexte, il désigne des personnes qui partagent la foi; le groupe pouvait comprendre des femmes.
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « et cela envers des étrangers ». Dans ce contexte, il s’agit vraisemblablement de frères et sœurs dans la foi que Gaïus ne connaissait pas personnellement, et non nécessairement de personnes venues d’un autre pays.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀγαπητέ
  choice: Bien-aimé
  rationale: Le vocatif singulier exprime une adresse affectueuse. « Bien-aimé » conserve la chaleur et la dignité du ton épistolaire, sans ajouter explicitement la notion d’amitié.
- source_word: πιστὸν ποιεῖς
  choice: tu agis fidèlement
  rationale: Cette tournure rend naturellement l’expression grecque, littéralement « tu fais une chose fidèle », et souligne la fidélité manifestée par la conduite de Gaïus.
- source_word: ὃ ἐὰν ἐργάσῃ
  choice: dans tout ce que tu fais
  rationale: 'Le relatif avec ἐάν et le subjonctif a un sens indéfini : « tout ce que tu fais ». Le verbe français « faire » convient mieux ici que le plus étroit « travailler ».'
- source_word: εἰς τοὺς ἀδελφοὺς
  choice: pour les frères
  rationale: « Pour » exprime naturellement la valeur bénéficiaire de εἰς. « Frères » conserve le masculin pluriel du grec tout en désignant, dans ce contexte, des croyants.
- source_word: καὶ τοῦτο ξένους
  choice: et cela même quand ils te sont inconnus
  rationale: La formulation relie les ξένους aux « frères » et met en relief le fait que Gaïus sert aussi des croyants qu’il ne connaît pas personnellement. Elle évite de suggérer nécessairement qu’ils sont étrangers au sens national.
theological_decisions:
- issue: Identité des ξένους par rapport aux « frères »
  choice: Les présenter comme des frères inconnus de Gaïus
  alternative: Comprendre « les frères » et « les étrangers » comme deux groupes distincts
  rationale: L’accusatif ξένους se rapporte naturellement à τοὺς ἀδελφούς et le contexte de l’accueil des prédicateurs itinérants favorise le sens de frères croyants personnellement inconnus. La note conserve la valeur lexicale sans transformer « inconnus » en catégorie théologique.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement convient à l’adresse personnelle au singulier dans cette lettre. La phrase conserve l’affection de l’apostrophe et la recommandation morale, tout en explicitant avec mesure le lien syntaxique entre « les frères » et « inconnus ».
