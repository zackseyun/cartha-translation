id: 3JN.1.11
reference: 3 John 1:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἀγαπητέ, μὴ μιμοῦ τὸ κακὸν ἀλλὰ τὸ ἀγαθόν. ὁ ἀγαθοποιῶν ἐκ τοῦ θεοῦ ἐστιν· ὁ κακοποιῶν οὐχ ἑώρακεν τὸν θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/011.yaml
  text: Beloved[a], do not imitate what is evil, but what is good. The one who does good is from God; the one who does evil has not seen God.
translation:
  language: fr
  text: Bien-aimé, n’imite pas le mal, mais le bien. Celui qui fait le bien est de Dieu ; celui qui fait le mal n’a pas vu Dieu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les expressions « celui qui fait le bien » et « celui qui fait le mal » peuvent aussi souligner une pratique continue ou une conduite caractéristique.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀγαπητέ
  choice: Bien-aimé
  rationale: Vocatif singulier affectueux. « Bien-aimé » conserve la chaleur de l’adresse et le style johannique récurrent.
- source_word: μὴ μιμοῦ
  choice: n’imite pas
  rationale: L’impératif présent avec μή exprime ici une interdiction ; « imiter » rend directement μιμέομαι et maintient l’idée d’un exemple moral à suivre ou à éviter.
- source_word: τὸ κακὸν / τὸ ἀγαθόν
  choice: le mal / le bien
  rationale: Les adjectifs neutres substantivés désignent des catégories morales générales. En français, « le mal » et « le bien » rendent naturellement leur opposition.
- source_word: ὁ ἀγαθοποιῶν
  choice: Celui qui fait le bien
  rationale: Le participe présent substantivé présente une conduite caractéristique ou répétée, sans imposer une formulation plus explicative que le grec.
- source_word: ἐκ τοῦ θεοῦ ἐστιν
  choice: est de Dieu
  rationale: Cette tournure brève conserve l’expression johannique de l’origine ou de l’appartenance, sans la réduire à une catégorie doctrinale ultérieure.
- source_word: ὁ κακοποιῶν
  choice: celui qui fait le mal
  rationale: Le participe présent substantivé est rendu parallèlement à ὁ ἀγαθοποιῶν et peut évoquer une pratique suivie ou une conduite caractéristique.
- source_word: οὐχ ἑώρακεν τὸν θεόν
  choice: n’a pas vu Dieu
  rationale: Le parfait de ὁράω est rendu littéralement afin de préserver le langage théologique johannique et sa portée expérientielle, plutôt que de l’interpréter comme « ne connaît pas Dieu ».
theological_decisions:
- issue: Rapport entre la conduite morale et la relation à Dieu dans la formule johannique
  choice: 'Conserver les catégories propres au texte : « est de Dieu » et « n’a pas vu Dieu ».'
  alternative: Expliciter en termes de régénération, de perfection morale ou d’absence absolue de toute relation antérieure avec Dieu.
  rationale: Le verset présente la conduite comme un diagnostic spirituel, mais ne formule pas les développements systématiques proposés par ces lectures. La traduction maintient donc la force et la tension de l’énoncé sans les résoudre.
translation_notes:
  register: Français international moderne, simple et digne. Le parallélisme du grec est conservé. « Bien-aimé » maintient le ton pastoral et johannique ; le tutoiement convient à l’adresse personnelle singulière.
