  - severity: medium
    issue: La note lexicale est ancrée à « le Nom » au lieu du mot qu’elle explique.
    rationale: La note traite de ἐθνικῶν et doit donc être attachée à « païens », afin que l’ancrage corresponde au contenu de la note.
  - severity: low
    issue: « sans rien accepter » est un peu plus interprétatif que nécessaire.
    rationale: λαμβάνοντες signifie d’abord « recevant ». « Sans rien recevoir » préserve mieux le verbe grec tout en exprimant naturellement l’absence de soutien matériel.
