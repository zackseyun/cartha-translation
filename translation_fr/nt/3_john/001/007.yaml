  text: ὑπὲρ γὰρ τοῦ ὀνόματος ἐξῆλθον μηδὲν λαμβάνοντες ἀπὸ τῶν ⸀ἐθνικῶν.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/007.yaml
  text: For they went out for the sake of the Name[a], taking nothing from the Gentiles.
translation:
  language: fr
  text: En effet, ils sont partis pour le Nom, sans rien recevoir des païens[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « des non-Juifs » ou « des non-croyants ». Le grec peut désigner les gens des nations, les païens ou, dans ce contexte, ceux qui ne partagent pas la foi chrétienne.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπὲρ
  choice: pour
  rationale: Avec le génitif « le Nom », ὑπέρ exprime ici le motif ou la cause de leur départ. « Pour le Nom » est naturel en français et conserve la concision solennelle du grec.
- source_word: τοῦ ὀνόματος
  choice: le Nom
  rationale: L’expression grecque signifie littéralement « le Nom » et fonctionne comme une désignation révérencielle implicite de Jésus ou du Seigneur. La conserver évite d’ajouter un référent explicite absent du texte.
- source_word: ἐξῆλθον
  choice: ils sont partis
  rationale: Dans ce contexte de déplacement missionnaire, « ils sont partis » rend naturellement l’aoriste et son idée de départ, sans archaïsme.
- source_word: μηδὲν λαμβάνοντες
  choice: sans rien accepter
  rationale: Le participe précise les conditions de leur départ et évoque le refus d’un soutien matériel. « Sans rien accepter » exprime plus clairement cette nuance en français que le littéral « ne prenant rien ».
- source_word: ἀπὸ τῶν ἐθνικῶν
  choice: des non-Juifs
  rationale: ἐθνικοί désigne ici ceux des nations, extérieurs à la communauté croyante. « Non-Juifs » préserve la perspective ethnoreligieuse du terme tout en étant plus immédiatement compréhensible que « Gentils » en français courant.
theological_decisions:
- issue: Référent de « le Nom »
  choice: Conserver la désignation révérencielle implicite « le Nom ».
  alternative: Expliciter par « le nom de Jésus », « le nom du Christ » ou « son nom ».
  rationale: Le grec ne nomme pas explicitement le référent. Garder « le Nom » préserve la force théologique et l’ambiguïté formelle de l’expression, même si le contexte chrétien oriente vers Jésus ou le Seigneur.
- issue: Portée de ἐθνικῶν
  choice: « non-Juifs » dans le texte principal, avec les sens contextuels alternatifs en note.
  alternative: « païens », « incroyants » ou « gens des nations ».
  rationale: Le mot possède une coloration à la fois ethnique et religieuse. « Non-Juifs » maintient le cadre historique judéo-chrétien, tandis que la note signale qu’en contexte il peut surtout désigner ceux qui ne partagent pas la foi.
translation_notes:
  register: Français international moderne, digne et accessible. « Le Nom » garde la formulation révérencielle du grec; « ils sont partis » et « sans rien accepter » rendent naturellement le contexte missionnaire.
