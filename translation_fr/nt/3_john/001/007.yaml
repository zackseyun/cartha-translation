  source_fidelity: 'La structure et le sens général sont bien rendus : γάρ est causal, ἐξῆλθον évoque un départ, et « le Nom » conserve à juste titre la désignation révérencielle non explicitée. Toutefois, « non-Juifs » réduit indûment ἐθνικῶν à une opposition ethnique. Dans cet emploi chrétien ancien, le mot désigne plus naturellement les païens / personnes extérieures à la foi. « Sans rien recevoir » rend directement μηδὲν λαμβάνοντες et son contexte de soutien matériel, sans surinterpréter l’acte comme une acceptation formelle.'
  naturalness: « Ils sont partis pour le Nom » est concis, digne et naturel dans un registre biblique moderne. « Sans rien recevoir des païens » est idiomatique et clair. L’ancienne note était en outre ancrée à « le Nom », alors qu’elle porte sur ἐθνικῶν ; l’appel doit suivre « païens ».
  terminology: « Le Nom » doit être maintenu, sans expliciter Jésus ou le Christ. « Païens » est le meilleur choix français principal ici ; la note conserve « non-Juifs » et « non-croyants » comme possibilités, sans présenter l’une d’elles comme certaine.
