  variant: modern international French
source:
  edition: SBLGNT
  text: ἡμεῖς οὖν ὀφείλομεν ⸀ὑπολαμβάνειν τοὺς τοιούτους, ἵνα συνεργοὶ γινώμεθα τῇ ἀληθείᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/008.yaml
  text: Therefore[a], we ought to receive such people[b], so that we may become fellow workers for the truth.
translation:
  language: fr
  text: Nous devons donc accueillir de telles personnes[a], afin de devenir des collaborateurs au service de la vérité[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe grec peut désigner le fait d’accueillir ces personnes et de leur apporter un soutien concret, notamment matériel.
    reason: lexical_alternative
  - marker: b
    text: 'On pourrait aussi traduire : « collaborateurs avec la vérité » ou « collaborateurs dans la vérité ». Le datif grec peut être compris de plusieurs manières ; le texte principal retient l’idée d’une collaboration au service de la cause de la vérité.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἡμεῖς
  choice: nous
  rationale: Le pronom explicite est conservé, car il souligne la responsabilité de l’auteur et de ses lecteurs.
- source_word: οὖν
  choice: donc
  rationale: Marque naturellement en français la conséquence tirée de ce qui précède.
- source_word: ὀφείλομεν
  choice: devons
  rationale: Exprime clairement l’obligation morale portée par le verbe grec, sans ajouter une nuance étrangère au contexte.
- source_word: ὑπολαμβάνειν
  choice: accueillir
  rationale: Dans ce contexte, le verbe désigne l’accueil concret accordé aux serviteurs itinérants, accueil qui peut comprendre l’hébergement et le soutien matériel.
- source_word: τοὺς τοιούτους
  choice: de telles personnes
  rationale: Renvoie aux personnes du genre de celles qui viennent d’être décrites, sans rendre l’expression inutilement masculine.
- source_word: ἵνα
  choice: afin de
  rationale: Introduit clairement le but ou le résultat visé.
- source_word: συνεργοὶ
  choice: collaborateurs
  rationale: Conserve l’idée d’une participation commune à une œuvre, dans un registre naturel et digne.
- source_word: γινώμεθα
  choice: devenir
  rationale: 'Préserve la valeur dynamique de γίνομαι : par cet accueil, les croyants en viennent à participer eux-mêmes à l’œuvre.'
- source_word: τῇ ἀληθείᾳ
  choice: au service de la vérité
  rationale: Rend le datif comme indiquant la cause au profit de laquelle ils collaborent, tout en signalant en note les autres analyses grammaticales possibles.
theological_decisions:
- issue: Rapport de τῇ ἀληθείᾳ avec συνεργοὶ
  choice: « au service de la vérité », au sens d’une participation à l’œuvre qui fait progresser la vérité
  alternative: « avec la vérité » ou « dans la vérité »
  rationale: Le contexte porte sur le soutien de serviteurs partis pour le Nom. La traduction principale exprime donc la participation à leur mission, mais la note préserve l’ambiguïté réelle du datif grec.
translation_notes:
  register: Français international moderne, clair et digne. « Accueillir » reste proche de l’image d’hospitalité du contexte, tandis que la note en explicite la dimension pratique. « Au service de la vérité » est idiomatique sans effacer les autres lectures possibles, conservées en note.
