reference: 3 John 1:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἔγραψά ⸀τι τῇ ἐκκλησίᾳ· ἀλλ’ ὁ φιλοπρωτεύων αὐτῶν Διοτρέφης οὐκ ἐπιδέχεται ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/009.yaml
  text: I wrote something to the church[a], but Diotrephes, who loves to be first among them[b], does not receive us.
translation:
  language: fr
  text: J’ai écrit quelque chose à l’Église[a], mais Diotrèphe, qui aime être le premier parmi eux, ne nous reçoit pas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « J’ai écrit une brève note à l’Église. » Le grec emploie une expression indéfinie (« j’ai écrit quelque chose »), et certains manuscrits présentent une formulation plus développée.'
    reason: textual_variant
  - marker: b
    text: 'Ou : « ne nous accueille pas » ou « ne nous reconnaît pas ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔγραψά
  choice: J’ai écrit
  rationale: Le passé composé exprime naturellement en français moderne l’aoriste indicatif, tout en convenant au contexte épistolaire.
- source_word: τι
  choice: quelque chose
  rationale: Le pronom indéfini neutre signifie le plus naturellement « quelque chose ». Cette formulation conserve l’indétermination et n’ajoute pas un objet plus précis que le grec.
- source_word: τῇ ἐκκλησίᾳ
  choice: à l’Église
  rationale: Le terme désigne ici l’assemblée chrétienne locale. « Église » est la désignation courante et immédiatement compréhensible en français.
- source_word: ἀλλ’
  choice: mais
  rationale: Cette conjonction marque nettement le contraste entre l’écrit de l’auteur et l’attitude de Diotrèphe.
- source_word: ὁ φιλοπρωτεύων
  choice: qui aime être le premier
  rationale: La tournure rend clairement le désir de prééminence exprimé par le participe, sans recourir à un vocabulaire archaïque ni préciser indûment la nature de cette primauté.
- source_word: αὐτῶν
  choice: parmi eux
  rationale: Le génitif indique le groupe au sein duquel Diotrèphe veut occuper la première place. « Parmi eux » préserve ce sens sans affirmer qu’il exerce officiellement une autorité sur eux.
- source_word: Διοτρέφης
  choice: Diotrèphe
  rationale: Forme française traditionnelle et usuelle du nom grec.
- source_word: οὐκ ἐπιδέχεται ἡμᾶς
  choice: ne nous reçoit pas
  rationale: « Recevoir » conserve la portée assez large du verbe grec, qui peut concerner l’accueil personnel aussi bien que l’acceptation ou la reconnaissance des personnes concernées.
theological_decisions:
- issue: Nature de l’opposition de Diotrèphe
  choice: ne nous reçoit pas
  alternative: ne nous accueille pas ; ne nous reconnaît pas
  rationale: La traduction ne réduit pas l’opposition à un simple refus d’hospitalité ni à un rejet explicite de l’autorité de l’auteur. Elle maintient l’étendue de sens du grec et la tension du passage.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase reste directe et accessible. « J’ai écrit » évite le passé simple, peu naturel dans une lettre moderne, tandis que « ne nous reçoit pas » préserve volontairement l’ambiguïté entre accueil, acceptation et reconnaissance.
