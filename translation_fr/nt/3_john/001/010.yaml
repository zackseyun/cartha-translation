id: 3JN.1.10
reference: 3 John 1:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: διὰ τοῦτο, ἐὰν ἔλθω, ὑπομνήσω αὐτοῦ τὰ ἔργα ἃ ποιεῖ, λόγοις πονηροῖς φλυαρῶν ἡμᾶς, καὶ μὴ ἀρκούμενος ἐπὶ τούτοις οὔτε αὐτὸς ἐπιδέχεται τοὺς ἀδελφοὺς καὶ τοὺς βουλομένους κωλύει καὶ ἐκ τῆς ἐκκλησίας ἐκβάλλει.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/010.yaml
  text: For this reason[a], if I come, I will call attention to the works he is doing, maliciously babbling against us with evil words; and not content with these things, he himself does not receive the brothers[c][b], and he hinders those who want to do so and throws them out of the church.
translation:
  language: fr
  text: 'C’est pourquoi, si je viens, je rappellerai les actes qu’il commet : il débite contre nous des propos malveillants et futiles. Et cela ne lui suffit pas : non seulement il refuse lui-même d’accueillir les frères[a], mais il en empêche ceux qui le voudraient et les chasse de l’Église[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ici, « les frères » désigne probablement des chrétiens itinérants venus au service de l’Évangile.
    reason: Précise le référent contextuel probable du masculin pluriel et le cadre d’hospitalité.
  - marker: b
    text: 'Ou : « les expulse de la communauté ».'
    reason: Signale que ἐκκλησία désigne ici l’assemblée ou la communauté chrétienne locale et que ἐκβάλλει exprime une exclusion énergique.
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: C’est pourquoi
  rationale: Rend naturellement la relation de conséquence explicite en grec.
- source_word: ἐὰν ἔλθω
  choice: si je viens
  rationale: Conserve la condition et la perspective épistolaire du texte.
- source_word: ὑπομνήσω
  choice: je rappellerai
  rationale: Le verbe signifie faire revenir à l’esprit; dans ce contexte, il s’agit de rappeler publiquement les agissements de Diotrèphe sans ajouter explicitement une idée de jugement.
- source_word: αὐτοῦ τὰ ἔργα ἃ ποιεῖ
  choice: les actes qu’il commet
  rationale: Préserve le pluriel concret ἔργα et la valeur actuelle du comportement; «commet» convient à des actes répréhensibles.
- source_word: λόγοις πονηροῖς φλυαρῶν ἡμᾶς
  choice: il répand contre nous des propos malveillants et sans fondement
  rationale: φλυαρέω évoque des paroles vaines, absurdes ou dépourvues de fondement, tandis que πονηροῖς en marque la malveillance. Cette formulation française exprime les deux composantes sans le ton enfantin possible de «babiller».
- source_word: μὴ ἀρκούμενος ἐπὶ τούτοις
  choice: cela ne lui suffit pas
  rationale: Tour français courant qui garde l’idée que sa conduite va encore plus loin.
- source_word: οὔτε αὐτὸς ἐπιδέχεται τοὺς ἀδελφούς
  choice: non seulement il refuse lui-même d’accueillir les frères
  rationale: Dans ce contexte, ἐπιδέχομαι désigne vraisemblablement l’accueil hospitalier. «Refuse» rend la négation volontaire, et «non seulement» prépare naturellement les deux actes suivants.
- source_word: τοὺς βουλομένους κωλύει
  choice: il en empêche ceux qui le voudraient
  rationale: Le complément implicite est l’accueil des frères. Le pronom «en» reprend cette action sans lourdeur, et «voudraient» conserve la valeur volitive de βούλομαι.
- source_word: ἐκ τῆς ἐκκλησίας ἐκβάλλει
  choice: les chasse de l’Église
  rationale: Rend avec force l’exclusion du rassemblement ou de la communauté chrétienne locale, sans imposer le terme technique «excommunier».
theological_decisions:
- issue: Portée de τοὺς ἀδελφούς dans le contexte de l’hospitalité chrétienne
  choice: les frères
  alternative: les frères et sœurs; les croyants
  rationale: Le contexte immédiat concerne vraisemblablement des frères chrétiens itinérants. Le masculin du grec est donc conservé plutôt que généralisé sans nécessité.
- issue: Sens institutionnel de ἐκκλησία
  choice: l’Église
  alternative: l’assemblée; la communauté
  rationale: «Église» est le terme français naturel, mais désigne ici la communauté chrétienne locale, non nécessairement une institution au sens ultérieur.
translation_notes:
  register: 'Français international moderne, digne et accessible. La phrase grecque est légèrement segmentée pour la clarté, tout en conservant sa progression: paroles hostiles, refus d’hospitalité, obstruction, puis exclusion. Les marqueurs [a] et [b] figurent tous deux dans le texte principal.'
