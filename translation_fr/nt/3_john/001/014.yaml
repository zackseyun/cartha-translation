base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/014.yaml
  text: But I hope to see you soon[a], and we will speak face to face.
translation:
  language: fr
  text: Mais j’espère te voir bientôt, et nous parlerons face à face[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « bouche à bouche ». L’expression désigne une conversation directe, en présence l’un de l’autre.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλπίζω
  choice: j’espère
  rationale: Le présent exprime naturellement l’espoir personnel de l’auteur dans la conclusion de la lettre.
- source_word: δὲ
  choice: Mais
  rationale: La conjonction marque une légère opposition ou transition par rapport à ce qui précède, où l’auteur évoque l’écriture.
- source_word: εὐθέως
  choice: bientôt
  rationale: Dans le contexte d’une visite projetée, le mot indique une proximité temporelle plutôt qu’une action instantanée.
- source_word: σε ἰδεῖν
  choice: te voir
  rationale: Cette traduction directe conserve le sens du grec sans expliciter davantage par « te rendre visite ».
- source_word: στόμα πρὸς στόμα
  choice: face à face
  rationale: Littéralement « bouche à bouche », l’expression désigne ici une conversation directe en présence l’un de l’autre. « Face à face » est l’équivalent français naturel et non ambigu.
- source_word: λαλήσομεν
  choice: nous parlerons
  rationale: Le futur exprime la conversation attendue; « parlerons » convient au registre simple et digne de la lettre.
