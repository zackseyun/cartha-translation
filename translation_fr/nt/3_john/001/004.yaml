  text: μειζοτέραν τούτων οὐκ ἔχω ⸀χαράν, ἵνα ἀκούω τὰ ἐμὰ τέκνα ἐν ⸀τῇ ἀληθείᾳ περιπατοῦντα.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/004.yaml
  text: 'I have no greater joy than this: to hear that my children are walking in the truth[a][b].'
translation:
  language: fr
  text: 'Je n’ai pas de plus grande joie que celle-ci : apprendre que mes enfants marchent dans la vérité[a][b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « Je n’ai pas de joie plus grande que ces choses. »'
    reason: lexical_alternative
  - marker: b
    text: « Mes enfants » désigne vraisemblablement les enfants spirituels de l’auteur, c’est-à-dire des croyants dont il prend soin.
    reason: cultural_note
lexical_decisions:
- source_word: μειζοτέραν
  choice: plus grande
  rationale: Comparatif qualifiant « joie » ; « de plus grande joie » est la tournure française naturelle dans cette construction négative.
- source_word: τούτων
  choice: que celle-ci
  rationale: Génitif de comparaison. Le pluriel grec peut se rendre littéralement par « que ces choses », mais « que celle-ci » renvoie naturellement en français au contenu précisé ensuite.
- source_word: χαράν
  choice: joie
  rationale: Équivalent courant qui conserve pleinement la force affective du terme grec.
- source_word: ἵνα ἀκούω
  choice: apprendre que
  rationale: Dans ce contexte, ἵνα introduit ce qui constitue la joie. « Apprendre que » exprime naturellement le fait de recevoir cette nouvelle, sans imposer une valeur finale stricte.
- source_word: τὰ ἐμὰ τέκνα
  choice: mes enfants
  rationale: Conserve l’image familiale du grec sans préciser dans le texte principal s’il s’agit d’enfants biologiques ou spirituels.
- source_word: ἐν τῇ ἀληθείᾳ
  choice: dans la vérité
  rationale: La formulation définie préserve l’ampleur johannique de l’expression, qui peut englober la vérité confessée et une conduite conforme à celle-ci.
- source_word: περιπατοῦντα
  choice: marchent
  rationale: Conserve la métaphore biblique de la marche comme manière de vivre, tout en restant intelligible en français.
theological_decisions:
- issue: 'Référent de τέκνα : enfants biologiques ou spirituels'
  choice: Conserver « mes enfants » dans le texte principal.
  alternative: « mes enfants spirituels » ou « ceux que j’ai amenés à la foi »
  rationale: Le contexte suggère des croyants dont l’auteur prend soin, mais le grec maintient la métaphore familiale ; la traduction ne doit pas en réduire la portée.
- issue: Portée de ἐν τῇ ἀληθείᾳ
  choice: Traduire par « dans la vérité ».
  alternative: « avec sincérité » ou « conformément au véritable enseignement »
  rationale: L’usage johannique peut unir conviction vraie et conduite fidèle. « Dans la vérité » préserve cette tension au lieu de choisir un seul aspect.
translation_notes:
  register: Français international moderne, naturel et digne. La métaphore « marcher dans la vérité » est maintenue en raison de sa portée johannique et de son intelligibilité dans le registre biblique.
