source:
  edition: SBLGNT
  text: οἳ ἐμαρτύρησάν σου τῇ ἀγάπῃ ἐνώπιον ἐκκλησίας, οὓς καλῶς ποιήσεις προπέμψας ἀξίως τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/006.yaml
  text: They testified before the church about your love[a], and you will do well to send them on their way in a manner worthy of God.
translation:
  language: fr
  text: Ils ont témoigné devant l’Église de ton amour ; tu feras bien de les aider à poursuivre leur route[a] d’une manière digne de Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : les envoyer en les aidant pour leur voyage. Le verbe grec peut désigner le fait d’envoyer des voyageurs en les aidant à poursuivre leur route, notamment en leur fournissant ce qui leur est nécessaire.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμαρτύρησάν
  choice: ont témoigné
  rationale: Le passé composé rend naturellement en français l’acte accompli rapporté par l’aoriste, tout en conservant sa pertinence dans le contexte présent de la lettre.
- source_word: σου τῇ ἀγάπῃ
  choice: de ton amour
  rationale: Avec μαρτυρέω, le datif indique ici ce sur quoi porte le témoignage. « Témoigner de ton amour » est idiomatique et fidèle au sens.
- source_word: ἐνώπιον ἐκκλησίας
  choice: devant l’Église
  rationale: La formule exprime un témoignage rendu en présence de la communauté chrétienne réunie.
- source_word: καλῶς ποιήσεις
  choice: tu feras bien de
  rationale: Cette tournure française conserve la forme au futur et la valeur d’exhortation courtoise de l’expression grecque.
- source_word: προπέμψας
  choice: les aider à poursuivre leur route
  rationale: Le verbe évoque le fait de faire continuer leur voyage à des personnes en leur accordant l’aide nécessaire, et non simplement de les congédier.
- source_word: ἀξίως τοῦ θεοῦ
  choice: d’une manière digne de Dieu
  rationale: Cette formulation conserve l’idée que la façon de les soutenir doit être à la mesure de l’honneur dû à Dieu.
theological_decisions:
- issue: Portée de προπέμπω dans le contexte de l’hospitalité chrétienne
  choice: les aider à poursuivre leur route
  alternative: les accompagner dans leur voyage
  rationale: Le terme peut inclure une aide concrète pour la suite du voyage. Le texte principal exprime cette nuance sans préciser indûment la forme matérielle de l’aide ; la note signale une autre formulation possible.
translation_notes:
  register: Français international moderne, naturel et digne. Le point-virgule conserve le lien étroit entre le témoignage rendu à l’amour de Gaïus et l’exhortation qui en découle. Le tutoiement correspond à l’adresse personnelle au destinataire.
