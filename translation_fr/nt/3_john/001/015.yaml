  text: Εἰρήνη σοι. ἀσπάζονταί σε οἱ φίλοι. ἀσπάζου τοὺς φίλους κατ’ ὄνομα.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/015.yaml
  text: Peace to you[a]. The friends greet you[b]. Greet the friends by name.
translation:
  language: fr
  text: Paix à toi[a]. Les amis te saluent. Salue les amis, chacun par son nom[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Que la paix soit avec toi. » Le grec dit littéralement : « Paix à toi », une bénédiction épistolaire concise.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « un par un » ou « personnellement ». Le grec dit littéralement « selon le nom » et souligne le caractère personnel de la salutation.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰρήνη σοι
  choice: Que la paix soit avec toi
  rationale: Cette formulation française naturelle exprime la bénédiction épistolaire concise du grec, littéralement « Paix à toi », sans en modifier le sens.
- source_word: ἀσπάζονταί σε
  choice: te saluent
  rationale: Le verbe est la formule épistolaire habituelle pour transmettre des salutations ; « te saluent » est direct et idiomatique.
- source_word: οἱ φίλοι / τοὺς φίλους
  choice: les amis
  rationale: Le grec emploie explicitement φίλοι, « amis » ; la même traduction est conservée dans les deux propositions, sans l'assimiler à « frères ».
- source_word: κατ’ ὄνομα
  choice: chacun par son nom
  rationale: L'expression signifie que les salutations doivent être personnelles et adressées individuellement ; cette tournure conserve l'image du nom tout en étant claire en français.
