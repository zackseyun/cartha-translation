id: 3JN.1.2
reference: 3 John 1:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἀγαπητέ, περὶ πάντων εὔχομαί σε εὐοδοῦσθαι καὶ ὑγιαίνειν, καθὼς εὐοδοῦταί σου ἡ ψυχή.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/002.yaml
  text: Beloved[a], I pray that in all respects you may prosper and be healthy[d][c][b], just as your soul prospers.
translation:
  language: fr
  text: Bien-aimé, je prie pour que tout aille bien pour toi à tous égards et que tu sois en bonne santé, tout comme ton âme se porte bien.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « que tu prospères à tous égards et que tu sois en bonne santé, tout comme ton âme prospère ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀγαπητέ
  choice: Bien-aimé
  rationale: Le vocatif singulier exprime une adresse affectueuse et conserve le lien lexical avec l’amour, tout en gardant un ton digne.
- source_word: περὶ πάντων
  choice: à tous égards
  rationale: L’expression indique naturellement l’étendue du souhait plutôt qu’une priorité; cette formulation française est claire et idiomatique.
- source_word: εὔχομαί
  choice: je prie
  rationale: Dans ce contexte épistolaire, le verbe exprime un souhait formulé dans la prière.
- source_word: σε εὐοδοῦσθαι
  choice: que tout aille bien pour toi
  rationale: Le verbe signifie prospérer ou connaître une situation favorable. Cette formulation moderne évite que « prospérer » soit compris dans un sens exclusivement matériel.
- source_word: ὑγιαίνειν
  choice: que tu sois en bonne santé
  rationale: Le verbe désigne ici clairement la santé physique.
- source_word: καθὼς
  choice: tout comme
  rationale: Cette locution marque naturellement la comparaison établie par le grec.
- source_word: εὐοδοῦταί σου ἡ ψυχή
  choice: ton âme se porte bien
  rationale: La formulation conserve ψυχή par « âme » et rend l’état favorable exprimé par le verbe sans imposer une notion étroite de réussite.
theological_decisions:
- issue: Sens de περὶ πάντων dans le souhait initial
  choice: à tous égards
  alternative: par-dessus tout
  rationale: Le grec exprime plus probablement la portée du souhait que son rang ou sa priorité.
- issue: Sens de ψυχή
  choice: âme
  alternative: être intérieur
  rationale: « Âme » préserve l’ambiguïté anthropologique du terme et le contraste contextuel avec la santé physique sans définir techniquement la constitution humaine.
- issue: Portée de εὐοδοῦσθαι
  choice: que tout aille bien pour toi
  alternative: que tu prospères
  rationale: Le choix rend le bien-être général demandé par l’auteur sans réduire le verset à une promesse de prospérité matérielle.
translation_notes:
  register: Français international moderne, naturel et digne. « Bien-aimé » maintient l’adresse affectueuse du texte; « que tout aille bien pour toi » est accessible et évite une lecture exclusivement économique de la prospérité.
