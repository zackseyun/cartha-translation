id: JAS.5.15
reference: James 5:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἡ εὐχὴ τῆς πίστεως σώσει τὸν κάμνοντα, καὶ ἐγερεῖ αὐτὸν ὁ κύριος· κἂν ἁμαρτίας ᾖ πεποιηκώς, ἀφεθήσεται αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/015.yaml
  text: And the prayer of faith will save the one who is sick[a], and the Lord will raise him up. And if he has committed sins[c][b], he will be forgiven.
translation:
  language: fr
  text: Et la prière de la foi[b] sauvera[a] le malade, et le Seigneur le relèvera. Et s’il[c] a commis des péchés, il sera pardonné.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « guérira » ou « rétablira » ; le grec dit littéralement « sauvera ».'
    reason: lexical_alternative
  - marker: b
    text: L’expression « prière de la foi » peut aussi se comprendre comme une prière marquée par la confiance ou, moins probablement ici, par la fidélité.
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « même s’il a commis des péchés ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐχὴ
  choice: prière
  rationale: Dans le contexte où les anciens prient pour le malade (v. 14), εὐχή désigne une prière, et non un vœu.
- source_word: πίστεως
  choice: de la foi
  rationale: Cette formulation conserve le génitif grec et désigne naturellement une prière caractérisée par la foi ou la confiance en Dieu, sans exclure les autres nuances possibles.
- source_word: σώσει
  choice: sauvera
  rationale: Le verbe σῴζω peut évoquer ici la guérison ou le rétablissement, puisque le contexte concerne un malade. « Sauvera » conserve toutefois l’étendue du terme grec et sa possible résonance spirituelle.
- source_word: τὸν κάμνοντα
  choice: le malade
  rationale: κάμνω peut signifier être épuisé ou malade. Le contexte immédiat de la maladie, de l’onction et du relèvement favorise nettement « le malade ».
- source_word: ἐγερεῖ
  choice: relèvera
  rationale: ἐγείρω signifie littéralement faire lever ou relever. Ici, le mot évoque le relèvement du lit de maladie tout en gardant une portée plus large de restauration divine.
- source_word: ὁ κύριος
  choice: le Seigneur
  rationale: « Le Seigneur » est l’équivalent français courant de κύριος dans ce contexte et maintient clairement l’action divine.
- source_word: κἂν ἁμαρτίας ᾖ πεποιηκώς
  choice: s’il a commis des péchés
  rationale: Cette traduction rend clairement la condition et le parfait grec. La nuance concessive « même s’il » demeure possible et est signalée en note.
- source_word: ἀφεθήσεται αὐτῷ
  choice: il sera pardonné
  rationale: Cette tournure française naturelle conserve le passif et exprime le pardon accordé au malade, sans préciser au-delà du texte l’agent divin sous-entendu.
theological_decisions:
- issue: Faut-il rendre σώσει dans un sens strictement médical ou conserver son sens plus large de salut et de restauration ?
  choice: « sauvera » dans le texte principal, avec une note indiquant les sens médicaux possibles
  alternative: « guérira » ou « rétablira »
  rationale: Le contexte concerne bien la maladie, mais Jacques emploie σῴζω, terme plus large qu’un verbe exclusivement médical. La traduction conserve ce choix lexical et sa tension.
- issue: Le verset promet-il une guérison automatique par la prière ?
  choice: Conserver sans ajout les futurs affirmatifs du grec
  alternative: Les affaiblir par « pourra rétablir » ou les renforcer par une paraphrase garantissant explicitement toute guérison
  rationale: La traduction ne doit ni atténuer l’affirmation directe du texte ni lui ajouter une doctrine particulière de guérison garantie en toute circonstance.
- issue: Le texte lie-t-il nécessairement toute maladie à un péché personnel ?
  choice: 'Maintenir la proposition conditionnelle : « s’il a commis des péchés »'
  alternative: Présenter le péché comme la cause universelle de la maladie
  rationale: La construction grecque présente les péchés comme une éventualité et ne permet pas d’affirmer que toute maladie résulte d’un péché personnel.
- issue: Portée de « prière de la foi »
  choice: Conserver la formulation génitive « prière de la foi »
  alternative: Expliciter dans le texte « prière faite avec confiance » ou comprendre « foi » au sens de fidélité
  rationale: Le génitif peut désigner une prière caractérisée par la foi ou la confiance. La formulation retenue préserve cette densité sans imposer une analyse unique.
translation_notes:
  register: Français international moderne, naturel et digne. « Le malade » reste concis et correspond au participe substantivé grec. « Relèvera » conserve l’image concrète du relèvement sans exclure une restauration plus ample. Les marqueurs de notes sont placés immédiatement après les expressions qu’ils éclairent.
