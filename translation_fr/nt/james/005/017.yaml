id: JAS.5.17
reference: James 5:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἠλίας ἄνθρωπος ἦν ὁμοιοπαθὴς ἡμῖν, καὶ προσευχῇ προσηύξατο τοῦ μὴ βρέξαι, καὶ οὐκ ἔβρεξεν ἐπὶ τῆς γῆς ἐνιαυτοὺς τρεῖς καὶ μῆνας ἕξ·
base_translation:
  language: en
  yaml_path: translation/nt/james/005/017.yaml
  text: Elijah was a man with a nature like ours[a], and he prayed earnestly that it would not rain, and it did not rain on the land for three years and six months.
translation:
  language: fr
  text: Élie était un homme comme nous[a]. Il pria avec insistance pour qu’il ne pleuve pas, et il ne plut pas sur le pays pendant trois ans et six mois.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « un homme de même nature que nous » ; ou : « un homme qui partageait nos sentiments ou nos passions ».

      '
    reason: 'Alternative lexicale pour ὁμοιοπαθὴς ἡμῖν : le terme peut désigner la condition humaine commune ou souligner des expériences et affects semblables.'
lexical_decisions:
- source_word: Ἠλίας
  choice: Élie
  rationale: Forme française traditionnelle et courante du nom du prophète.
- source_word: ἄνθρωπος
  choice: un homme
  rationale: Le nom désigne ici Élie comme un être humain ordinaire; puisqu’il s’agit d’un homme précis, cette formulation est naturelle et exacte.
- source_word: ὁμοιοπαθὴς ἡμῖν
  choice: de même condition que nous
  rationale: Cette expression rend l’idée d’une condition humaine partagée sans la limiter aux seuls sentiments ou passions.
- source_word: προσευχῇ προσηύξατο
  choice: il pria avec insistance
  rationale: La construction associant le nom et le verbe apparentés souligne la prière; «avec insistance» restitue cette force dans un français naturel sans préciser indûment la ferveur intérieure.
- source_word: τοῦ μὴ βρέξαι
  choice: pour qu’il ne pleuve pas
  rationale: L’infinitif articulé exprime ici le but ou le contenu demandé dans la prière; la formulation française laisse cette légère proximité de sens intacte.
- source_word: οὐκ ἔβρεξεν
  choice: il ne plut pas
  rationale: Tournure impersonnelle idiomatique en français, correspondant directement au verbe grec.
- source_word: ἐπὶ τῆς γῆς
  choice: sur le pays
  rationale: Dans le contexte du récit d’Élie, γῆ désigne naturellement le territoire touché par la sécheresse plutôt que nécessairement toute la terre.
- source_word: ἐνιαυτοὺς τρεῖς καὶ μῆνας ἕξ
  choice: pendant trois ans et six mois
  rationale: «Pendant» marque naturellement en français l’accusatif de durée.
theological_decisions:
- issue: Portée de ὁμοιοπαθὴς appliqué à Élie
  choice: Élie partageait la même condition humaine que les lecteurs.
  alternative: Élie éprouvait les mêmes sentiments ou passions que nous.
  rationale: Le terme peut inclure les affects et les faiblesses humaines, mais il souligne plus largement qu’Élie n’était pas d’une autre nature que les croyants auxquels Jacques s’adresse. La traduction principale préserve cette portée large, et la note signale les nuances possibles.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation reste proche de la structure grecque tout en évitant les calques peu naturels; «de même condition que nous» conserve la portée humaine générale de ὁμοιοπαθής.
