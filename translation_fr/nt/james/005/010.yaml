id: JAS.5.10
reference: James 5:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὑπόδειγμα λάβετε, ⸀ἀδελφοί, τῆς κακοπαθίας καὶ τῆς μακροθυμίας τοὺς προφήτας, οἳ ἐλάλησαν ⸀ἐν τῷ ὀνόματι κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/010.yaml
  text: Brothers[a], take the prophets who spoke in the name of the Lord as an example of suffering and patience.
translation:
  language: fr
  text: Frères[a], prenez pour exemple de souffrance et de patience les prophètes qui ont parlé au nom du Seigneur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec emploie ici le masculin pluriel « frères » ; dans ce contexte, Jacques s’adresse vraisemblablement à l’ensemble de la communauté croyante, femmes comprises.
    reason: Précision lexicale sur la forme grammaticale et la portée probable de l’adresse.
lexical_decisions:
- source_word: ὑπόδειγμα λάβετε
  choice: prenez pour exemple
  rationale: La tournure idiomatique française exprime naturellement l’impératif et l’idée d’un modèle à imiter, tout en restant proche de la construction grecque.
- source_word: ἀδελφοί
  choice: Frères
  rationale: Le vocatif grec est un masculin pluriel. « Frères » en préserve la forme, tandis qu’une note précise que l’adresse vise vraisemblablement toute la communauté croyante.
- source_word: κακοπαθίας
  choice: souffrance
  rationale: Le terme désigne l’expérience du malheur ou des épreuves. « Souffrance » est clair, actuel et convient au rôle exemplaire des prophètes.
- source_word: μακροθυμίας
  choice: patience
  rationale: Le mot évoque une endurance patiente et prolongée. « Patience » constitue ici l’équivalent français le plus naturel.
- source_word: τοὺς προφήτας
  choice: les prophètes
  rationale: 'Traduction directe de l’objet de l’exhortation : ce sont eux qu’il faut prendre pour exemple.'
- source_word: ἐλάλησαν
  choice: ont parlé
  rationale: Le verbe signifie simplement « parler » ; cette traduction évite d’ajouter la nuance plus précise de « proclamer ».
- source_word: ἐν τῷ ὀνόματι κυρίου
  choice: au nom du Seigneur
  rationale: Cette expression biblique courante conserve l’idée de représentation et d’autorité sans l’expliciter excessivement.
theological_decisions:
- issue: Portée du vocatif masculin ἀδελφοί
  choice: « Frères » dans le texte, avec une note signalant la portée communautaire probablement inclusive
  alternative: « Frères et sœurs »
  rationale: La forme masculine du grec est conservée sans nier que, dans cette adresse épistolaire, Jacques vise vraisemblablement les croyants des deux sexes.
- issue: Rapport entre les prophètes et ὑπόδειγμα
  choice: Les prophètes sont présentés comme l’exemple de souffrance et de patience
  alternative: Comprendre les génitifs comme décrivant seulement les circonstances dans lesquelles ils servent d’exemple
  rationale: La syntaxe fait des prophètes l’objet de λάβετε et de la souffrance ainsi que de la patience les domaines sous lesquels ils constituent un modèle. La formulation française conserve cette relation sans la développer.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe légèrement solennelle convient à l’exhortation biblique tout en restant naturelle ; l’expression consacrée « au nom du Seigneur » est conservée.
