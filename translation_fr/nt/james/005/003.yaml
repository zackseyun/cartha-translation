source:
  edition: SBLGNT
  text: ὁ χρυσὸς ὑμῶν καὶ ὁ ἄργυρος κατίωται, καὶ ὁ ἰὸς αὐτῶν εἰς μαρτύριον ὑμῖν ἔσται καὶ φάγεται τὰς σάρκας ὑμῶν· ὡς πῦρ ἐθησαυρίσατε ἐν ἐσχάταις ἡμέραις.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/003.yaml
  text: Your gold and silver have rusted[a], and their corrosion will be evidence against you and will eat your flesh like fire[b]. You have stored up treasure in the last days.
translation:
  language: fr
  text: Votre or et votre argent se sont corrodés[a] ; leur corrosion témoignera contre vous et dévorera votre chair comme un feu[b]. Vous avez amassé des trésors dans les derniers jours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ont rouillé ». Le verbe grec peut désigner plus largement la corrosion ou l’altération d’un métal.'
    reason: lexical_alternative
  - marker: b
    text: 'Autre rattachement possible : « … dévorera votre chair. Vous avez amassé du feu dans les derniers jours. » Le grec peut aussi être compris en rattachant « comme un feu » à la dernière proposition, avec une formulation elliptique ; le rattachement à « dévorera votre chair » est ici retenu.'
    reason: alternative_reading
lexical_decisions:
- source_word: κατίωται
  choice: se sont corrodés
  rationale: Le parfait grec décrit un état présent résultant d’un processus antérieur. « Se sont corrodés » convient à la fois à l’or et à l’argent et conserve l’image prophétique d’une richesse dégradée.
- source_word: ἰὸς
  choice: corrosion
  rationale: Dans ce contexte métallique, le mot désigne le produit ou l’effet corrosif, plutôt que le « poison ». « Corrosion » évite de limiter l’image à la rouille propre au fer.
- source_word: εἰς μαρτύριον ὑμῖν
  choice: témoignera contre vous
  rationale: Cette formulation française naturelle conserve la personnification et la portée judiciaire de μαρτύριον, ainsi que la valeur défavorable du contexte.
- source_word: φάγεται τὰς σάρκας ὑμῶν
  choice: dévorera votre chair
  rationale: « Dévorera » restitue avec force l’image concrète de φάγεται. Le singulier collectif « votre chair » est idiomatique en français tout en rendant le pluriel grec τὰς σάρκας.
- source_word: ὡς πῦρ
  choice: comme un feu
  rationale: La locution est rattachée à la proposition précédente, conformément à la syntaxe la plus naturelle, et exprime la puissance destructrice de la corrosion dans l’image du jugement.
- source_word: ἐθησαυρίσατε
  choice: avez amassé des trésors
  rationale: Le verbe contient l’idée de mettre en réserve un trésor. Cette traduction en restitue le contenu sans ajouter explicitement la nuance interprétative de « thésauriser » ou « accumuler égoïstement ».
- source_word: ἐν ἐσχάταις ἡμέραις
  choice: dans les derniers jours
  rationale: Il s’agit de la formulation eschatologique directe et traditionnelle, sans ajout d’un démonstratif absent du grec.
theological_decisions:
- issue: Rattachement syntaxique de ὡς πῦρ
  choice: « comme un feu » se rattache à « dévorera votre chair »
  alternative: « Vous avez amassé comme un feu dans les derniers jours » ou « Vous avez amassé du feu dans les derniers jours »
  rationale: 'La proximité syntaxique et la cohérence de l’image favorisent le rattachement à φάγεται : la corrosion dévore la chair comme un feu. L’autre ponctuation reste possible dans le texte grec et est donc signalée en note.'
translation_notes:
  register: Français international moderne, soutenu mais accessible. La ponctuation clarifie le mouvement de la phrase sans atténuer ses images judiciaires et corporelles. Les marqueurs [a] et [b] figurent dans le texte principal.
