id: JAS.5.1
reference: James 5:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἄγε νῦν οἱ πλούσιοι, κλαύσατε ὀλολύζοντες ἐπὶ ταῖς ταλαιπωρίαις ὑμῶν ταῖς ἐπερχομέναις.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/001.yaml
  text: Come now[a], you rich, weep[b], wailing over the miseries that are coming upon you.
translation:
  language: fr
  text: À vous maintenant, les riches ! Pleurez en poussant des cris de lamentation[a] à cause des malheurs[b] qui vont s’abattre sur vous.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en vous lamentant à grands cris ». Le participe grec évoque une lamentation forte et publique.
    reason: lexical_alternative
  - marker: b
    text: Ou « détresses » ou « calamités ».
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄγε νῦν
  choice: À vous maintenant
  rationale: Cette formule française introduit naturellement une interpellation vive et solennelle. Elle conserve la force du marqueur discursif grec sans ajouter un verbe d’écoute absent du texte.
- source_word: οἱ πλούσιοι
  choice: les riches
  rationale: Le nominatif grec a ici une fonction d’apostrophe. Après « À vous maintenant », « les riches » rend directement ce groupe sans préciser davantage leur identité.
- source_word: κλαύσατε
  choice: Pleurez
  rationale: L’impératif exprime un appel catégorique à une lamentation manifeste ; « pleurez » en donne l’équivalent français direct et soutenu.
- source_word: ὀλολύζοντες
  choice: en poussant de grands cris
  rationale: Le participe intensifie l’ordre de pleurer et évoque une lamentation forte et audible. Cette formulation est naturelle en français moderne et évite la connotation parfois animale de « hurler ».
- source_word: ἐπὶ
  choice: à cause de
  rationale: Avec le datif, la préposition indique ici le motif ou l’occasion de la lamentation.
- source_word: ταλαιπωρίαις
  choice: malheurs
  rationale: Le nom désigne de graves détresses ou calamités. « Malheurs » convient au ton prophétique tout en restant courant et intelligible.
- source_word: ταῖς ἐπερχομέναις
  choice: qui vont s’abattre sur vous
  rationale: Le participe décrit des malheurs en approche. « S’abattre sur vous » exprime naturellement leur venue menaçante sans déterminer plus précisément le moment.
theological_decisions:
- issue: Ton et référent de l’interpellation adressée aux riches
  choice: Une dénonciation prophétique de personnes riches menacées de malheurs imminents, sans préciser dans ce verset si elles sont croyantes ou non.
  alternative: Y voir exclusivement soit des propriétaires terriens oppresseurs non croyants, soit des membres riches de la communauté chrétienne.
  rationale: Le verset interpelle directement « les riches » et annonce les malheurs qui viennent sur eux, mais il ne définit pas à lui seul leur appartenance religieuse. La traduction maintient donc la portée générale et la tension du texte.
translation_notes:
  register: Français international moderne, direct et digne. L’exclamation conserve l’apostrophe prophétique abrupte ; le vocabulaire reste accessible sans atténuer la menace du passage.
