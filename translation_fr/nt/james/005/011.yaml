id: JAS.5.11
reference: James 5:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἰδοὺ μακαρίζομεν τοὺς ⸀ὑπομείναντας· τὴν ὑπομονὴν Ἰὼβ ἠκούσατε, καὶ τὸ τέλος κυρίου ⸀εἴδετε, ὅτι πολύσπλαγχνός ἐστιν ⸂ὁ κύριος⸃ καὶ οἰκτίρμων.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/011.yaml
  text: Behold, we count those who have endured as blessed. You have heard of Job’s endurance, and you have seen the Lord’s outcome, that the Lord is very compassionate and merciful.
translation:
  language: fr
  text: 'Voici, nous proclamons heureux ceux qui ont persévéré. Vous avez entendu parler de la persévérance de Job, et vous avez vu l’issue donnée par le Seigneur[a] : le Seigneur est plein de compassion et miséricordieux.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « l’aboutissement venant du Seigneur » ; le mot grec peut aussi évoquer la fin ou l’accomplissement.'
    reason: Le génitif κυρίου et le sens de τέλος permettent plusieurs nuances ; la note préserve cette ambiguïté sans introduire comme traduction principale l’idée plus interprétative de « dessein ».
lexical_decisions:
- source_word: μακαρίζομεν
  choice: nous proclamons heureux
  rationale: Exprime le fait de reconnaître et de déclarer quelqu’un heureux ou bienheureux, sans suggérer que les croyants lui confèrent eux-mêmes une bénédiction.
- source_word: ὑπομείναντας / ὑπομονήν
  choice: ceux qui ont persévéré / la persévérance
  rationale: Conserve le lien lexical entre le verbe et le nom grecs et met en valeur l’endurance fidèle dans l’épreuve.
- source_word: τὸ τέλος κυρίου
  choice: l’issue donnée par le Seigneur
  rationale: Dans le contexte de Job, τέλος désigne l’aboutissement ou le dénouement. Cette formulation naturelle en français rattache cette issue à l’action du Seigneur sans la réduire explicitement à son « but ».
- source_word: πολύσπλαγχνος
  choice: plein de compassion
  rationale: Rend l’idée intensive d’une compassion profonde et viscérale dans un français naturel et digne.
- source_word: οἰκτίρμων
  choice: miséricordieux
  rationale: Terme français courant dans le registre biblique, qui exprime la pitié active et la miséricorde.
theological_decisions:
- issue: Sens de τὸ τέλος κυρίου
  choice: l’issue donnée par le Seigneur
  alternative: le dessein du Seigneur
  rationale: « Dessein » interpréterait τέλος comme une intention divine, alors que le terme peut désigner l’aboutissement observé dans l’histoire de Job. Le texte principal retient l’issue tout en signalant l’éventail sémantique en note.
- issue: Relation introduite par ὅτι
  choice: deux-points avant l’affirmation sur le caractère du Seigneur
  alternative: car le Seigneur est plein de compassion et miséricordieux
  rationale: Le grec peut présenter cette affirmation comme le contenu ou l’explication de ce qui a été vu. Les deux-points préservent cette souplesse sans imposer exclusivement une relation causale.
translation_notes:
  register: Français international moderne, clair et digne. « Voici » conserve la force discursive de ἰδού ; la répétition de « Seigneur » suit l’insistance du grec.
