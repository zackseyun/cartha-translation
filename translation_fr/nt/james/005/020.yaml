id: JAS.5.20
reference: James 5:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸀γινωσκέτω ὅτι ὁ ἐπιστρέψας ἁμαρτωλὸν ἐκ πλάνης ὁδοῦ αὐτοῦ σώσει ψυχὴν ⸀αὐτοῦ ἐκ θανάτου καὶ καλύψει πλῆθος ἁμαρτιῶν.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/020.yaml
  text: let him know that whoever turns a sinner back from the error of his way will save his soul from death and will cover a multitude of sins[a][b].
translation:
  language: fr
  text: qu’il sache que celui qui ramène un pécheur du chemin où il s’est égaré sauvera son âme[a][b] de la mort et couvrira une multitude de péchés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sauvera sa vie de la mort ». Le mot grec peut désigner l’âme ou la vie.
    reason: lexical_alternative
  - marker: b
    text: Le possessif « son » peut renvoyer au pécheur qui est ramené ; certains comprennent qu’il renvoie à celui qui le ramène.
    reason: alternative_reading
lexical_decisions:
- source_word: γινωσκέτω
  choice: qu’il sache
  rationale: L’impératif présent actif à la troisième personne du singulier est rendu par une exhortation française naturelle qui reprend la personne envisagée dans le contexte.
- source_word: ὁ ἐπιστρέψας
  choice: celui qui ramène
  rationale: Le participe aoriste substantivé désigne de façon générale la personne qui fait revenir le pécheur. « Ramène » exprime la restauration sans donner à « convertir » un sens technique ultérieur.
- source_word: ἁμαρτωλὸν
  choice: un pécheur
  rationale: Le nom sans article a ici une valeur générique, naturellement rendue par l’article indéfini en français.
- source_word: ἐκ πλάνης ὁδοῦ αὐτοῦ
  choice: du chemin où il s’est égaré
  rationale: Cette formulation française conserve l’image du chemin et le sens d’égarement moral ou spirituel, tout en évitant le tour peu naturel « de l’erreur de son chemin ».
- source_word: σώσει
  choice: sauvera
  rationale: Le futur de σῴζω est conservé, avec toute sa portée sans préciser s’il s’agit d’un salut physique, spirituel ou des deux.
- source_word: ψυχὴν αὐτοῦ
  choice: son âme
  rationale: « Âme » garde la forme lexicale et la gravité spirituelle du grec. Une note signale le sens possible de « vie », et une autre préserve l’ambiguïté du possessif.
- source_word: ἐκ θανάτου
  choice: de la mort
  rationale: La traduction littérale maintient l’étendue du terme sans trancher entre mort physique et mort spirituelle.
- source_word: καλύψει
  choice: couvrira
  rationale: « Couvrira » conserve l’image biblique du verbe καλύπτω sans la réduire à la simple dissimulation.
- source_word: πλῆθος ἁμαρτιῶν
  choice: une multitude de péchés
  rationale: Ce tour naturel et soutenu reproduit le nom collectif grec et sa résonance biblique.
theological_decisions:
- issue: Antécédent de αὐτοῦ dans ψυχὴν αὐτοῦ
  choice: Le texte principal conserve « son âme » sans préciser explicitement à qui renvoie le possessif.
  alternative: L’âme du pécheur ramené ; selon une autre compréhension, l’âme de celui qui le ramène.
  rationale: La syntaxe grecque permet de rattacher le pronom au pécheur ou, moins probablement, à celui qui le ramène. La note expose les deux possibilités sans résoudre la tension.
- issue: Sens de ψυχή et de θάνατος
  choice: « âme » et « mort » sont maintenus dans leur sens large.
  alternative: « vie » et mort physique ; ou âme et mort spirituelle.
  rationale: Le verset peut évoquer la préservation de la vie, le salut spirituel, ou les deux. La traduction ne l’enferme pas dans un seul cadre doctrinal.
translation_notes:
  register: Français international moderne, naturel et digne. L’image du chemin est conservée dans une formulation idiomatique ; « couvrira une multitude de péchés » maintient la résonance biblique sans archaïsme marqué.
