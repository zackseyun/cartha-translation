id: JAS.5.16
reference: James 5:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐξομολογεῖσθε ⸀οὖν ἀλλήλοις ⸂τὰς ἁμαρτίας⸃ καὶ ⸀εὔχεσθε ὑπὲρ ἀλλήλων, ὅπως ἰαθῆτε. πολὺ ἰσχύει δέησις δικαίου ἐνεργουμένη.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/016.yaml
  text: Therefore[a], confess your sins to one another and pray for one another, so that you may be healed. The prayer of a righteous person is very powerful as it is at work.
translation:
  language: fr
  text: Confessez donc vos péchés les uns aux autres et priez les uns pour les autres, afin que vous soyez guéris. La supplication d’une personne juste a une grande force lorsqu’elle est à l’œuvre.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « La supplication d’une personne juste, lorsqu’elle est rendue efficace, a une grande force. »'
    reason: La construction de πολὺ ἰσχύει avec ἐνεργουμένη est difficile; le participe peut recevoir une nuance moyenne (« à l’œuvre ») ou passive (« rendue efficace »).
lexical_decisions:
- source_word: ἐξομολογεῖσθε
  choice: Reconnaissez
  rationale: L’impératif appelle à avouer ou reconnaître ouvertement ses péchés. « Reconnaissez » est naturel en français et conserve la dimension interpersonnelle sans suggérer à lui seul un cadre sacramentel formel.
- source_word: οὖν
  choice: donc
  rationale: Marque la conséquence tirée du contexte précédent concernant la prière, le péché et le relèvement.
- source_word: ἀλλήλοις
  choice: les uns devant les autres
  rationale: Exprime clairement la réciprocité de la reconnaissance des péchés; « devant » convient idiomatiquement au verbe français choisi.
- source_word: τὰς ἁμαρτίας
  choice: vos péchés
  rationale: Le possessif est naturellement requis en français dans cette exhortation réciproque; « péchés » rend directement ἁμαρτίας.
- source_word: εὔχεσθε
  choice: priez
  rationale: Équivalent direct, clair et courant de l’impératif grec.
- source_word: ὑπὲρ ἀλλήλων
  choice: les uns pour les autres
  rationale: Rend naturellement le sens d’intercession de ὑπέρ avec le génitif et maintient la réciprocité.
- source_word: ὅπως
  choice: afin que
  rationale: Exprime le but ou le résultat visé dans un registre français actuel et digne.
- source_word: ἰαθῆτε
  choice: vous soyez guéris
  rationale: Préserve l’étendue sémantique de la guérison sans la limiter arbitrairement au physique ou au spirituel.
- source_word: πολὺ ἰσχύει
  choice: a une grande puissance
  rationale: Rend l’idée de force et d’efficacité considérables sans transformer explicitement l’expression en résultat accompli.
- source_word: δέησις
  choice: supplication
  rationale: Conserve la nuance spécifique de prière instante ou de requête portée par δέησις.
- source_word: δικαίου
  choice: d’une personne juste
  rationale: L’adjectif substantivé masculin a ici une portée générique; « personne » évite de restreindre indûment l’énoncé aux hommes.
- source_word: ἐνεργουμένη
  choice: lorsqu’elle agit
  rationale: Préserve la difficulté du participe moyen/passif en exprimant une prière effectivement à l’œuvre, sans imposer l’idée qu’une force extérieure la rend efficace.
theological_decisions:
- issue: La confession est-elle mutuelle ou nécessairement adressée au clergé ?
  choice: Reconnaissance mutuelle des péchés au sein de la communauté
  alternative: Confession sacramentelle médiatisée par un ministre ordonné
  rationale: Le pronom réciproque ἀλλήλοις indique explicitement une action mutuelle entre les destinataires. La formulation n’exclut pas les applications ecclésiales propres à diverses traditions, mais ne les introduit pas dans le texte.
- issue: Portée de la guérison exprimée par ἰαθῆτε
  choice: 'Formulation générale : « guéris »'
  alternative: Guérison exclusivement physique ou exclusivement spirituelle
  rationale: Le contexte immédiat évoque la maladie physique, tandis que la mention des péchés élargit le cadre. La traduction conserve cette tension.
- issue: Portée générique de δικαίου
  choice: « une personne juste »
  alternative: « un homme juste »
  rationale: Le masculin grammatical fonctionne ici de manière proverbiale et générique; la traduction désigne donc toute personne juste.
- issue: Valeur de ἐνεργουμένη
  choice: « lorsqu’elle agit »
  alternative: « rendue efficace »
  rationale: La forme peut être comprise avec une nuance moyenne ou passive. Le texte principal retient une formulation non causative et une note signale l’autre analyse possible.
translation_notes:
  register: Français international moderne, clair et digne. La tournure réciproque est explicite, le vocabulaire théologique reste accessible, et la note conserve l’ambiguïté syntaxique de la dernière proposition.
