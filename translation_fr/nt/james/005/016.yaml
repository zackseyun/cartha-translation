revisions:
- from: Reconnaissez donc vos péchés les uns devant les autres et priez les uns pour les autres, afin que vous soyez guéris. La supplication d’une personne juste a une grande puissance lorsqu’elle agit.[a]
  to: Confessez donc vos péchés les uns aux autres et priez les uns pour les autres, afin que vous soyez guéris. La supplication d’une personne juste a une grande force lorsqu’elle est à l’œuvre.[a]
  rationale: La correction rétablit le sens mutuel explicite du pronom grec ἀλλήλοις. Une légère amélioration de la dernière proposition rend le français plus naturel tout en préservant l’ambiguïté syntaxique signalée en note. Aucun changement ne restreint la portée de la guérison ni n’introduit une lecture confessionnelle sacramentelle.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T11:46:05Z'
review_pass:
  verdict: revise
  source_fidelity: La réciprocité d’ἀλλήλοις doit être rendue par « les uns aux autres », non par « les uns devant les autres », qui évoque surtout une confession faite en présence d’autrui plutôt qu’adressée mutuellement. Le reste conserve adéquatement le lien inférentiel, la portée large de la guérison et l’ambiguïté relative du participe ἐνεργουμένη.
  naturalness: « Confessez donc vos péchés les uns aux autres » est l’expression française moderne, directe et idiomatique. « Lorsqu’elle est à l’œuvre » rend plus naturellement l’idée d’une supplication opérante que « lorsqu’elle agit », sans résoudre indûment la voix du participe.
  terminology: « Péchés », « priez », « guéris », « supplication » et « personne juste » sont appropriés. « Personne juste » maintient correctement la valeur générique de δικαίου. La note conserve l’analyse passive possible (« rendue efficace »), sans l’imposer au texte principal.
  issues:
  - severity: medium
    issue: « les uns devant les autres » pour ἀλλήλοις
    rationale: 'Cette tournure signifie principalement « en présence les uns des autres » et affaiblit le sens datif réciproque : la confession est à faire « les uns aux autres ».'
  - severity: low
    issue: « lorsqu’elle agit » pour ἐνεργουμένη
    rationale: La formulation est possible mais un peu moins idiomatique pour une supplication; « lorsqu’elle est à l’œuvre » conserve mieux l’idée d’activité/efficacité sans trancher la nuance moyenne ou passive.
  revised_text: Confessez donc vos péchés les uns aux autres et priez les uns pour les autres, afin que vous soyez guéris. La supplication d’une personne juste a une grande force lorsqu’elle est à l’œuvre.[a]
