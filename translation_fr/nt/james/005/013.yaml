id: JAS.5.13
reference: James 5:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Κακοπαθεῖ τις ἐν ὑμῖν; προσευχέσθω· εὐθυμεῖ τις; ψαλλέτω.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/013.yaml
  text: Is anyone among you suffering? Let him pray[a]. Is anyone cheerful? Let him sing praise.
translation:
  language: fr
  text: Quelqu’un parmi vous souffre-t-il ? Qu’il prie. Quelqu’un est-il de bonne humeur ? Qu’il chante des louanges.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qu’il chante des psaumes » ; le verbe grec peut désigner précisément le chant de psaumes ou, plus largement, un chant de louange.
    reason: alternative lexicale
lexical_decisions:
- source_word: Κακοπαθεῖ
  choice: souffre
  rationale: Le verbe κακοπαθέω désigne le fait de subir des difficultés ou de souffrir. « Souffre » reste naturel et suffisamment large pour ne pas limiter le sens à la maladie, à la persécution ou à une épreuve particulière.
- source_word: τις
  choice: quelqu’un
  rationale: Le pronom indéfini est singulier et générique. « Quelqu’un » rend naturellement cette valeur sans restreindre l’exhortation aux hommes.
- source_word: ἐν ὑμῖν
  choice: parmi vous
  rationale: Cette expression situe la personne envisagée au sein de la communauté à laquelle Jacques s’adresse.
- source_word: προσευχέσθω
  choice: qu’il prie
  rationale: Le présent impératif à la troisième personne exprime une exhortation individuelle continue ou générale. « Qu’il prie » en conserve clairement la force et le singulier représentatif.
- source_word: εὐθυμεῖ
  choice: est de bonne humeur
  rationale: Le verbe εὐθυμέω indique que l’on a bon courage ou que l’on est dans de bonnes dispositions. « Être de bonne humeur » exprime ici, en français courant, un état intérieur positif opposé à la souffrance.
- source_word: ψαλλέτω
  choice: qu’il chante des louanges
  rationale: Dans ce contexte, ψάλλω désigne un chant de louange adressé à Dieu. Cette formulation communique clairement la portée dévotionnelle tout en laissant en note la possibilité plus précise de chanter des psaumes.
theological_decisions:
- issue: Singulier générique des exhortations
  choice: Conserver le singulier avec « quelqu’un » et « qu’il »
  alternative: Employer le pluriel ou reformuler par « que cette personne prie »
  rationale: Le grec associe τις à des impératifs à la troisième personne du singulier. En français, « quelqu’un… qu’il » conserve ce mouvement grammatical et garde une valeur générique, sans désigner exclusivement une personne de sexe masculin.
- issue: Sens de ψαλλέτω
  choice: « qu’il chante des louanges »
  alternative: « qu’il chante des psaumes » ou « qu’il fasse entendre un chant »
  rationale: Le verbe peut évoquer plus précisément le chant de psaumes, mais il possède aussi ici le sens plus large de chanter la louange de Dieu. Le texte principal retient ce sens accessible sans transformer l’exhortation en prescription liturgique étroite; l’autre possibilité est préservée en note.
translation_notes:
  register: Français international moderne, simple et digne. Les deux questions parallèles et les deux exhortations brèves reproduisent la structure rhétorique du grec. Le pronom « il » reprend grammaticalement « quelqu’un » et a ici une valeur générique.
