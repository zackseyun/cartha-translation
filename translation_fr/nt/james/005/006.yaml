  text: κατεδικάσατε, ἐφονεύσατε τὸν δίκαιον. οὐκ ἀντιτάσσεται ὑμῖν;
base_translation:
  language: en
  yaml_path: translation/nt/james/005/006.yaml
  text: You condemned[a], you murdered the righteous one[b]. He does not resist you.
translation:
  language: fr
  text: Vous avez condamné, vous avez assassiné le juste[a]. Ne vous résiste-t-il pas[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression peut désigner de manière représentative une personne juste opprimée par les riches. Certains y voient aussi une possible allusion à Jésus, appelé « le Juste ».
    reason: alternative_reading
  - marker: b
    text: 'La ponctuation interrogative suit le SBLGNT. Les manuscrits anciens ne permettent toutefois pas de trancher avec certitude; la proposition peut aussi se lire comme une affirmation : « Il ne vous résiste pas. »'
    reason: textual_punctuation
lexical_decisions:
- source_word: κατεδικάσατε
  choice: vous avez condamné
  rationale: Le passé composé rend naturellement en français moderne l’aoriste dans cette dénonciation, tandis que « condamné » conserve la portée judiciaire de καταδικάζω.
- source_word: ἐφονεύσατε
  choice: vous avez assassiné
  rationale: φονεύω désigne une mise à mort coupable. « Assassiné » maintient la gravité morale de l’accusation, plus nettement que le verbe général « tuer ».
- source_word: τὸν δίκαιον
  choice: le juste
  rationale: L’adjectif masculin singulier substantivé est rendu directement par l’expression française naturelle « le juste ». Celle-ci préserve la possibilité d’un individu représentatif comme celle d’une éventuelle désignation christologique.
- source_word: οὐκ ἀντιτάσσεται ὑμῖν
  choice: Il ne vous résiste pas
  rationale: ἀντιτάσσομαι signifie s’opposer ou résister. La tournure déclarative exprime naturellement la non-résistance du juste dans le contexte, sans masquer dans la note que le SBLGNT ponctue la proposition comme une question.
theological_decisions:
- issue: Référent de « le juste »
  choice: Un juste représentatif opprimé par les riches, sans identification explicite à Jésus dans le texte principal.
  alternative: Une allusion à Jésus comme « le Juste ».
  rationale: Le contexte immédiat dénonce l’oppression exercée contre les justes, et le singulier peut avoir une valeur représentative. L’expression peut néanmoins évoquer Jésus; la note conserve cette possibilité sans l’imposer.
- issue: Valeur de la proposition finale
  choice: 'Une déclaration : « Il ne vous résiste pas. »'
  alternative: 'Une question : « Ne vous résiste-t-il pas ? »'
  rationale: La ponctuation interrogative du SBLGNT est éditoriale, puisque les manuscrits anciens ne fournissent pas cette ponctuation de manière décisive. La lecture déclarative s’accorde bien avec l’image d’une victime sans défense; l’autre analyse est signalée en note afin de préserver l’ambiguïté.
translation_notes:
  register: Français international moderne, direct et digne. Le passé composé est idiomatique dans une accusation portant sur des actes accomplis. « Le juste » reste concis et conserve la tension quant à son référent.
