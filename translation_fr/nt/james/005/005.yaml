  variant: modern international French
source:
  edition: SBLGNT
  text: ἐτρυφήσατε ἐπὶ τῆς γῆς καὶ ἐσπαταλήσατε, ἐθρέψατε τὰς καρδίας ⸀ὑμῶν ἐν ἡμέρᾳ σφαγῆς.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/005.yaml
  text: You have lived in luxury on the earth and indulged yourselves[d][c][b][a]; you have fattened your hearts in a day of slaughter.
translation:
  language: fr
  text: Vous avez vécu sur terre dans le luxe[a] et vous vous êtes abandonnés aux plaisirs[b] ; vous avez engraissé vos cœurs au jour du carnage[c][d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans les plaisirs ».
    reason: lexical_alternative
  - marker: b
    text: Ou « vous avez vécu dans la complaisance envers vous-mêmes ».
    reason: lexical_alternative
  - marker: c
    text: L’image est celle d’animaux engraissés avant d’être abattus ; elle évoque probablement un jugement imminent.
    reason: cultural_note
  - marker: d
    text: Ou « pour le jour du carnage ».
    reason: alternative_reading
lexical_decisions:
- source_word: ἐτρυφήσατε
  choice: vous avez vécu dans le luxe
  rationale: Le verbe décrit une vie de luxe orientée vers le plaisir. Cette formulation française est naturelle, garde la valeur réprobatrice du contexte et rend l’aoriste par une caractérisation rétrospective.
- source_word: ἐπὶ τῆς γῆς
  choice: sur la terre
  rationale: γῆ peut désigner la terre ou un territoire. Ici, « sur la terre » convient à la portée générale de la dénonciation et reste proche du grec.
- source_word: ἐσπαταλήσατε
  choice: vous vous êtes abandonnés à vos plaisirs
  rationale: Le verbe exprime une vie de jouissance excessive et complaisante. La tournure choisie rend l’idée d’auto-indulgence en français actuel sans recourir à un terme archaïque.
- source_word: ἐθρέψατε
  choice: vous avez engraissé
  rationale: Bien que τρέφω puisse signifier « nourrir », le contexte du carnage crée l’image ironique d’animaux engraissés avant d’être abattus. « Engraissé » conserve cette force.
- source_word: τὰς καρδίας ὑμῶν
  choice: vos cœurs
  rationale: La traduction littérale préserve l’anthropologie et l’image bibliques sans réduire la formule à une simple paraphrase telle que « vous-mêmes ».
- source_word: ἐν ἡμέρᾳ σφαγῆς
  choice: au jour du carnage
  rationale: Cette expression française garde l’image violente et sa portée de jugement sans expliciter son référent. « Carnage » peut évoquer une mise à mort massive tout en restant moins exclusivement technique que « abattage ».
theological_decisions:
- issue: Portée métaphorique du « jour du carnage »
  choice: Conserver dans le texte l’image d’un carnage imminent ou déjà caractéristique du jour, sans identifier explicitement le jugement divin.
  alternative: Rendre explicitement l’expression par « en vue du jour du jugement » ou la rapporter au massacre des innocents.
  rationale: Le contexte suggère fortement le jugement, mais le grec laisse subsister une image frappante plutôt qu’une explication doctrinale. La traduction préserve donc cette tension.
- issue: Valeur de ἐν dans ἐν ἡμέρᾳ σφαγῆς
  choice: au jour du carnage
  alternative: pour le jour du carnage
  rationale: La préposition ἐν signifie formellement « en/dans », tandis que l’image de l’engraissement peut faire comprendre une préparation « pour » le carnage. Le texte principal reste proche de la construction grecque et la lecture finale est signalée en note.
translation_notes:
  register: Français international moderne, soutenu sans être archaïque. Le parallélisme accusateur est conservé, de même que l’image biblique des cœurs engraissés. « Carnage » maintient la violence de σφαγή et l’ambiguïté entre l’abattage figuré et un jugement plus largement évoqué.
