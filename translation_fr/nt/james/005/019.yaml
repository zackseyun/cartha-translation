  text: Ἀδελφοί ⸀μου, ἐάν τις ἐν ὑμῖν πλανηθῇ ἀπὸ τῆς ἀληθείας καὶ ἐπιστρέψῃ τις αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/james/005/019.yaml
  text: My brothers[a], if anyone among you wanders from the truth and someone turns him back[c][b],
translation:
  language: fr
  text: Mes frères[a], si l’un de vous s’égare loin de la vérité[b] et que quelqu’un le ramène[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Mes frères et sœurs » ; le grec emploie le masculin pluriel dans une adresse qui peut inclure toute la communauté.
    reason: lexical_alternative
  - marker: b
    text: Ou « s’éloigne de la vérité » ou « est égaré loin de la vérité ».
    reason: lexical_alternative
  - marker: c
    text: Ou « le fasse revenir ».
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀδελφοί μου
  choice: Mes frères
  rationale: La forme grecque est un masculin pluriel employé comme adresse directe. « Mes frères » la conserve dans un français naturel et digne; dans ce contexte, elle peut désigner l’ensemble de la communauté.
- source_word: ἐάν τις ἐν ὑμῖν
  choice: si l’un de vous
  rationale: Cette tournure française rend naturellement la condition et le pronom indéfini singulier τις, tout en gardant l’idée d’une personne appartenant à la communauté.
- source_word: πλανηθῇ ἀπὸ τῆς ἀληθείας
  choice: s’égare loin de la vérité
  rationale: Le passif grec peut avoir ici un sens intransitif, « s’égarer », tout en laissant ouverte la nuance d’avoir été trompé ou entraîné. « Loin de » exprime clairement l’éloignement marqué par ἀπό sans préciser davantage ce que recouvre « la vérité ».
- source_word: καὶ ἐπιστρέψῃ τις αὐτόν
  choice: et qu’un autre le ramène
  rationale: « Ramener » exprime idiomatiquement le retour hors de l’égarement et prépare la reprise du verbe au verset suivant. « Un autre » évite en français l’enchaînement maladroit de deux indéfinis tout en représentant le second τις.
theological_decisions:
- issue: Portée de l’adresse masculine Ἀδελφοί μου
  choice: Conserver « Mes frères » dans le texte principal
  alternative: « Mes frères et sœurs »
  rationale: Le masculin grammatical du grec est préservé, tandis qu’une note signale que l’adresse peut inclure toute la communauté. Cela évite aussi d’exclure silencieusement la portée inclusive probable.
- issue: Nuance de πλανηθῇ
  choice: « s’égare »
  alternative: « est égaré » ou « se laisse tromper »
  rationale: La forme passive peut exprimer l’égarement ou la tromperie. Le français « s’égare » est naturel dans ce contexte moral et spirituel sans imposer un agent extérieur; la note conserve les autres nuances possibles.
- issue: Sens de « la vérité »
  choice: Garder l’expression non explicitée « la vérité »
  alternative: « la vérité de l’Évangile » ou « la voie chrétienne »
  rationale: Le contexte peut suggérer la vérité reçue et vécue par la communauté, mais le grec ne la précise pas davantage; l’expliciter introduirait une interprétation dans le texte.
translation_notes:
  register: Français international moderne, courant et digne. La phrase reste ouverte par une virgule parce que la proposition se poursuit au verset 20. Les marqueurs de notes sont placés immédiatement après les expressions concernées.
