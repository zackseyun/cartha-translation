id: JAS.5.8
reference: James 5:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: μακροθυμήσατε καὶ ὑμεῖς, στηρίξατε τὰς καρδίας ὑμῶν, ὅτι ἡ παρουσία τοῦ κυρίου ἤγγικεν.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/008.yaml
  text: You also be patient; strengthen your hearts[a], because the coming of the Lord has drawn near.
translation:
  language: fr
  text: Vous aussi, soyez patients. Affermissez vos cœurs, car la venue du Seigneur[a] est proche.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la présence du Seigneur ». Le mot grec peut signifier « présence » ou « venue » ; dans ce contexte, il évoque l’arrivée eschatologique du Seigneur.
    reason: lexical_alternative
lexical_decisions:
- source_word: μακροθυμήσατε
  choice: soyez patients
  rationale: L’impératif appelle à une endurance patiente dans l’épreuve. « Soyez patients » est clair et naturel en français moderne, tout en convenant au contexte agricole et exhortatif des versets précédents.
- source_word: καὶ ὑμεῖς
  choice: vous aussi
  rationale: Cette expression relie explicitement les lecteurs à l’exemple qui précède et met le pronom en relief.
- source_word: στηρίξατε
  choice: affermissez
  rationale: Le verbe signifie rendre ferme, fortifier ou établir solidement. « Affermissez » s’emploie naturellement avec « vos cœurs » et exprime la résolution intérieure demandée.
- source_word: τὰς καρδίας ὑμῶν
  choice: vos cœurs
  rationale: La traduction conserve la métaphore biblique du cœur comme siège de la volonté, du courage et de la vie intérieure.
- source_word: ὅτι
  choice: car
  rationale: La conjonction introduit la raison des deux impératifs. « Car » exprime clairement ce lien causal dans un registre digne et courant.
- source_word: ἡ παρουσία
  choice: la venue
  rationale: Dans le contexte eschatologique de Jacques 5.7-8, παρουσία désigne la venue ou l’arrivée attendue du Seigneur. La note maintient visible l’autre sens lexical possible, « présence ».
- source_word: τοῦ κυρίου
  choice: du Seigneur
  rationale: « Seigneur » est l’équivalent français établi de κύριος comme titre de Jésus dans ce contexte eschatologique.
- source_word: ἤγγικεν
  choice: est proche
  rationale: Le parfait grec présente cette proximité comme désormais établie. « Est proche » rend ce résultat de manière idiomatique, là où une traduction littérale comme « s’est approchée » serait peu naturelle avec « venue ».
theological_decisions:
- issue: Sens de παρουσία dans l’affirmation eschatologique concernant le Seigneur
  choice: la venue du Seigneur
  alternative: la présence du Seigneur
  rationale: Le contexte de Jacques 5.7-8 est orienté vers l’attente future de l’arrivée du Seigneur. « Venue » exprime le mieux ce sens contextuel sans nier l’autre valeur lexicale de παρουσία, signalée en note.
- issue: Portée temporelle de ἤγγικεν
  choice: est proche
  alternative: s’est approchée
  rationale: Le parfait indique une proximité déjà acquise et toujours valable. La formulation française « est proche » communique naturellement cet état sans préciser un calendrier ni atténuer la tension eschatologique du texte.
translation_notes:
  register: Français international moderne, clair et digne. Les impératifs restent directs, et la métaphore biblique des « cœurs » est conservée. Deux phrases courtes rendent le rythme exhortatif du grec sans lourdeur.
