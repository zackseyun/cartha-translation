id: JAS.5.18
reference: James 5:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ πάλιν προσηύξατο, καὶ ὁ οὐρανὸς ⸂ὑετὸν ἔδωκεν⸃ καὶ ἡ γῆ ἐβλάστησεν τὸν καρπὸν αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/018.yaml
  text: And he prayed again[a], and the sky gave rain[b], and the earth produced its fruit.
translation:
  language: fr
  text: Puis il a prié de nouveau, et le ciel a donné de la pluie, et la terre a produit son fruit.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάλιν
  choice: de nouveau
  rationale: L’adverbe marque la répétition de la prière d’Élie. « De nouveau » est naturel et précis en français moderne.
- source_word: προσηύξατο
  choice: il a prié
  rationale: L’aoriste de προσεύχομαι signifie simplement « prier ». Le verset ne répète pas ici l’idée d’intensité exprimée au verset précédent.
- source_word: ὁ οὐρανὸς
  choice: le ciel
  rationale: Dans ce contexte météorologique, οὐρανός désigne le ciel visible. Le français « ciel » conserve en outre naturellement l’étendue sémantique du terme grec.
- source_word: ὑετὸν ἔδωκεν
  choice: a donné de la pluie
  rationale: Cette formulation suit de près le grec, littéralement « a donné de la pluie », tout en restant claire et naturelle en français.
- source_word: ἡ γῆ
  choice: la terre
  rationale: « La terre » convient au parallélisme avec « le ciel » et garde la portée assez large de γῆ, qui peut aussi désigner le sol ou le pays.
- source_word: ἐβλάστησεν
  choice: a produit
  rationale: Avec καρπός comme complément, « a produit » exprime naturellement le fait que la terre a fait croître et porter sa production.
- source_word: τὸν καρπὸν αὐτῆς
  choice: son fruit
  rationale: La traduction littérale reste intelligible en français et peut désigner ici l’ensemble de la production agricole de la terre.
theological_decisions:
- issue: La réponse à la prière d’Élie et l’action divine
  choice: 'Décrire le résultat observable avec les sujets mêmes du texte : le ciel donne la pluie et la terre produit son fruit.'
  alternative: Préciser explicitement que Dieu a envoyé la pluie.
  rationale: Le contexte implique l’action de Dieu, mais ce verset ne la formule pas directement. La traduction conserve donc l’expression propre au texte sans ajouter d’explication théologique.
translation_notes:
  register: Français international moderne, clair et digne. Le passé composé assure une lecture naturelle, tandis que la répétition de « et » conserve le mouvement coordonné du grec. « Le ciel » et « la terre » préservent le parallélisme de la phrase.
