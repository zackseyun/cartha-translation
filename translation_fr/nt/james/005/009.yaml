id: JAS.5.9
reference: James 5:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: μὴ στενάζετε, ⸂ἀδελφοί, κατ’ ἀλλήλων⸃, ἵνα μὴ κριθῆτε· ἰδοὺ ὁ κριτὴς πρὸ τῶν θυρῶν ἕστηκεν.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/009.yaml
  text: Do not grumble against one another[a], brothers, so that you may not be judged. Look, the Judge is standing at the doors.
translation:
  language: fr
  text: 'Ne vous plaignez pas les uns des autres, frères et sœurs[a], afin de ne pas être jugés. Voici : le Juge se tient aux portes.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec dit littéralement « frères »; ce terme peut s’adresser collectivement à l’ensemble des croyants, femmes comprises.
    reason: lexical_alternative
lexical_decisions:
- source_word: στενάζετε
  choice: vous plaignez
  rationale: Avec κατ’ ἀλλήλων, le verbe désigne ici une plainte empreinte de ressentiment dirigée contre d’autres membres de la communauté, plutôt qu’un simple gémissement intérieur.
- source_word: ἀδελφοί
  choice: frères et sœurs
  rationale: Le vocatif masculin pluriel peut désigner collectivement les croyants des deux sexes. Cette formulation rend explicitement la portée communautaire naturelle en français moderne.
- source_word: κατ’ ἀλλήλων
  choice: les uns des autres
  rationale: Dans la construction française « se plaindre de quelqu’un », cette expression rend l’orientation hostile ou accusatrice exprimée par κατά avec le génitif.
- source_word: κριθῆτε
  choice: être jugés
  rationale: Le passif de κρίνω indique le fait de subir un jugement sans en préciser d’avance l’issue; « être condamnés » serait trop restrictif.
- source_word: κριτὴς
  choice: le Juge
  rationale: La majuscule signale l’emploi titulaire et le cadre eschatologique, tout en laissant ouverte l’identification précise du juge divin.
- source_word: πρὸ τῶν θυρῶν
  choice: aux portes
  rationale: La formulation conserve le pluriel grec et exprime l’extrême proximité du Juge.
- source_word: ἕστηκεν
  choice: se tient
  rationale: Le parfait exprime un état présent résultant d’une prise de position; « se tient » rend naturellement cette présence prête à agir.
- source_word: ἰδοὺ
  choice: Voici
  rationale: L’interjection attire vivement l’attention sur la proximité actuelle du Juge.
theological_decisions:
- issue: Référent du « Juge »
  choice: Un juge divin eschatologique, le plus naturellement le Seigneur ou le Christ dans le contexte
  alternative: Dieu désigné de manière générale comme juge
  rationale: Le texte conserve simplement « le Juge » et ne précise pas davantage son identité, afin de préserver l’ouverture du grec et la tension théologique du contexte.
translation_notes:
  register: Français international moderne, naturel et digne. « Ne vous plaignez pas les uns des autres » évite l’ambiguïté de « gémir » et garde la force relationnelle de l’exhortation. « Voici » préserve l’effet saisissant de ἰδοὺ, tandis que « aux portes » maintient le pluriel inhabituel de l’original.
