id: JAS.5.12
reference: James 5:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Πρὸ πάντων δέ, ἀδελφοί μου, μὴ ὀμνύετε, μήτε τὸν οὐρανὸν μήτε τὴν γῆν μήτε ἄλλον τινὰ ὅρκον· ἤτω δὲ ὑμῶν τὸ Ναὶ ναὶ καὶ τὸ Οὒ οὔ, ἵνα μὴ ⸂ὑπὸ κρίσιν⸃ πέσητε.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/012.yaml
  text: But above all[a], my brothers, do not swear, either by heaven or by earth or by any other oath. Instead, let your yes be yes and your no, no[b], so that you may not fall under judgment.
translation:
  language: fr
  text: Mais avant tout, mes frères[a], ne prêtez pas serment, ni par le ciel, ni par la terre ni par aucun autre serment. Que votre oui soit oui, et votre non, non, afin que vous ne tombiez pas sous le jugement[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « mes frères et sœurs »; le grec dit « frères » et s’adresse probablement à l’ensemble de la communauté croyante.
    reason: lexical_alternative
  - marker: b
    text: Ou « sous la condamnation ».
    reason: alternative_reading
lexical_decisions:
- source_word: Πρὸ πάντων
  choice: avant tout
  rationale: Expression française naturelle qui conserve l’idée de priorité ou d’importance majeure.
- source_word: ἀδελφοί μου
  choice: mes frères
  rationale: Conserve la forme masculine du grec, employée ici vraisemblablement pour s’adresser à l’ensemble de la communauté croyante; la portée inclusive est précisée en note.
- source_word: μὴ ὀμνύετε
  choice: ne prêtez pas serment
  rationale: Évite en français moderne l’ambiguïté de « ne jurez pas », qui pourrait évoquer les grossièretés, et exprime clairement l’acte de s’engager par serment.
- source_word: μήτε τὸν οὐρανὸν μήτε τὴν γῆν μήτε ἄλλον τινὰ ὅρκον
  choice: ni par le ciel, ni par la terre, ni par quelque autre serment
  rationale: Préserve la série négative et la portée générale de l’interdiction, dans une syntaxe française fluide.
- source_word: ἤτω δὲ ὑμῶν τὸ Ναὶ ναὶ καὶ τὸ Οὒ οὔ
  choice: Que votre oui soit oui, et votre non, non
  rationale: Reproduit la formulation brève et proverbiale du grec sans expliciter davantage que le texte.
- source_word: ἵνα μὴ ὑπὸ κρίσιν πέσητε
  choice: afin que vous ne tombiez pas sous le jugement
  rationale: Conserve la métaphore de πέσητε et rend κρίσις par le terme général « jugement », sans imposer le sens plus fort de condamnation.
theological_decisions:
- issue: 'Sens de κρίσις : jugement ou condamnation'
  choice: jugement
  alternative: condamnation
  rationale: « Jugement » reste plus proche de l’étendue sémantique du grec et n’impose pas une conclusion doctrinale plus précise; l’autre possibilité est signalée en note.
- issue: Portée de ἀδελφοί dans l’adresse communautaire
  choice: mes frères
  alternative: mes frères et sœurs
  rationale: La traduction conserve la forme grammaticale masculine du texte source tout en signalant que l’adresse vise probablement toute la communauté croyante.
translation_notes:
  register: Français international moderne, naturel et digne. « Prêter serment » clarifie qu’il est question de serments et non de langage grossier. La cadence concise de « oui… oui » et « non… non » est maintenue.
