id: JAS.5.4
reference: James 5:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἰδοὺ ὁ μισθὸς τῶν ἐργατῶν τῶν ἀμησάντων τὰς χώρας ὑμῶν ὁ ⸀ἀφυστερημένος ἀφ’ ὑμῶν κράζει, καὶ αἱ βοαὶ τῶν θερισάντων εἰς τὰ ὦτα Κυρίου Σαβαὼθ ⸀εἰσεληλύθασιν·
base_translation:
  language: en
  yaml_path: translation/nt/james/005/004.yaml
  text: Look[a], the wages of the workers who harvested your fields, which have been withheld by you, are crying out, and the cries of those who did the harvesting have entered into the ears of the Lord of Hosts.
translation:
  language: fr
  text: 'Voici : le salaire des ouvriers qui ont moissonné vos champs, salaire que vous avez retenu, crie, et les cris des moissonneurs sont parvenus aux oreilles du Seigneur des armées[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « du Seigneur Sabaoth ». Le grec conserve ici, sous la forme Σαβαώθ, la translittération d’un titre hébreu traditionnel.
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδοὺ
  choice: Voici
  rationale: Formule d’interpellation naturelle en français moderne, qui conserve la force emphatique du grec sans recourir à l’archaïque « Voici que ».
- source_word: μισθὸς
  choice: le salaire
  rationale: Désigne la rémunération due aux ouvriers. Le singulier français correspond directement au nom collectif singulier grec.
- source_word: ἐργατῶν
  choice: des ouvriers
  rationale: Terme courant pour des travailleurs manuels, particulièrement adapté au contexte agricole.
- source_word: ἀμησάντων
  choice: qui ont moissonné
  rationale: Le verbe désigne ici l’action de faucher ou de récolter; « moissonner » convient au travail effectué dans les champs et reste immédiatement compréhensible.
- source_word: χώρας
  choice: vos champs
  rationale: Dans ce contexte, le mot renvoie aux terres cultivées des propriétaires interpellés.
- source_word: ἀφυστερημένος ἀφ’ ὑμῶν
  choice: salaire que vous avez retenu
  rationale: Rend clairement l’idée d’une rémunération gardée par ceux qui la devaient, sans ajouter explicitement une qualification juridique comme « fraudé ».
- source_word: κράζει
  choice: crie
  rationale: Conserve le singulier du sujet grec et la personnification saisissante du salaire impayé qui réclame justice.
- source_word: βοαὶ
  choice: les cris
  rationale: Exprime des appels pressants réclamant secours ou justice.
- source_word: θερισάντων
  choice: des moissonneurs
  rationale: Désigne de façon concise et naturelle ceux qui ont accompli la récolte.
- source_word: εἰς τὰ ὦτα
  choice: aux oreilles
  rationale: Préserve l’image biblique de cris arrivant aux oreilles de Dieu tout en restant idiomatique en français.
- source_word: Κυρίου Σαβαὼθ
  choice: du Seigneur des armées
  rationale: Traduit le titre divin sémitique conservé dans le grec et en communique le sens au lecteur francophone.
- source_word: εἰσεληλύθασιν
  choice: sont parvenus
  rationale: Le passé composé rend l’accompli grec avec son résultat présent; « parvenir aux oreilles » est naturel en français tout en conservant l’image d’un mouvement jusqu’à Dieu.
theological_decisions:
- issue: Traduction du titre divin Κυρίου Σαβαὼθ
  choice: le Seigneur des armées
  alternative: le Seigneur Sabaoth
  rationale: « Seigneur des armées » communique le sens du titre issu de l’arrière-plan hébraïque, tandis que la translittération traditionnelle est signalée en note afin de ne pas effacer la forme grecque.
translation_notes:
  register: Français international moderne, digne et direct. La reprise « salaire que vous avez retenu » évite une longue relative ambiguë et met en relief l’accusation. La personnification du salaire qui « crie » ainsi que l’image des cris parvenus aux oreilles de Dieu sont conservées.
