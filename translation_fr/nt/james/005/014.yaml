id: JAS.5.14
reference: James 5:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀσθενεῖ τις ἐν ὑμῖν; προσκαλεσάσθω τοὺς πρεσβυτέρους τῆς ἐκκλησίας, καὶ προσευξάσθωσαν ἐπ’ αὐτὸν ἀλείψαντες ⸀αὐτὸν ἐλαίῳ ἐν τῷ ὀνόματι τοῦ κυρίου·
base_translation:
  language: en
  yaml_path: translation/nt/james/005/014.yaml
  text: Is anyone among you sick? Let him call for the elders of the church[a], and let them pray over him[b], anointing him with oil in the name of the Lord.
translation:
  language: fr
  text: Quelqu’un parmi vous est-il malade[a] ? Qu’il appelle les anciens de l’Église, et qu’ils prient sur lui en lui faisant une onction d’huile[b] au nom du Seigneur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « faible ». Le verbe grec peut désigner plus largement la faiblesse, mais la prière, l’onction d’huile et le contexte de guérison du verset suivant indiquent probablement ici une maladie.
    reason: lexical_alternative
  - marker: b
    text: Le texte ne précise pas si l’onction d’huile a une fonction médicinale, symbolique ou les deux.
    reason: cultural_note
lexical_decisions:
- source_word: ἀσθενεῖ
  choice: est malade
  rationale: Dans ce contexte de prière, d’onction d’huile et de relèvement au verset suivant, le verbe désigne très probablement une maladie physique, tout en pouvant plus largement exprimer la faiblesse.
- source_word: τις ἐν ὑμῖν
  choice: quelqu’un parmi vous
  rationale: Cette formulation naturelle conserve la portée indéfinie et inclusive de l’expression grecque.
- source_word: προσκαλεσάσθω
  choice: qu’il appelle
  rationale: Le subjonctif à valeur impérative rend clairement l’impératif grec de troisième personne et indique que le malade demande la venue des responsables.
- source_word: τοὺς πρεσβυτέρους τῆς ἐκκλησίας
  choice: les responsables de l’Église
  rationale: Dans cette construction, πρεσβύτεροι désigne les dirigeants reconnus de la communauté plutôt que simplement des hommes âgés. « Responsables » est clair en français international et évite l’ambiguïté courante de « anciens ».
- source_word: προσευξάσθωσαν ἐπ’ αὐτόν
  choice: que ceux-ci prient sur lui
  rationale: « Ceux-ci » identifie sans ambiguïté les responsables comme sujets. « Sur lui » conserve la valeur spatiale et relationnelle de ἐπί sans réduire l’expression à « pour lui ».
- source_word: ἀλείψαντες αὐτὸν ἐλαίῳ
  choice: après lui avoir fait une onction d’huile
  rationale: Le participe aoriste peut naturellement exprimer une action antérieure à la prière. La formulation décrit l’application d’huile sans décider si sa fonction est médicinale, symbolique, rituelle, ou plusieurs de ces aspects à la fois.
- source_word: ἐν τῷ ὀνόματι τοῦ κυρίου
  choice: au nom du Seigneur
  rationale: Cette expression française consacrée préserve l’idiome biblique ainsi que le rapport à la personne et à l’autorité du Seigneur.
theological_decisions:
- issue: Sens de ἀσθενεῖ dans le contexte
  choice: La maladie physique est le sens principal dans le texte.
  alternative: La faiblesse générale ou spirituelle.
  rationale: La prière des responsables, l’onction d’huile et le contexte de guérison au verset suivant favorisent la maladie physique, mais une note conserve l’étendue sémantique du verbe.
- issue: Fonction de l’onction d’huile
  choice: Décrire l’acte sans en préciser le mécanisme théologique ou médical.
  alternative: Y voir exclusivement un traitement médicinal, un symbole ou un rite sacramentel.
  rationale: Le grec mentionne l’application d’huile sans expliquer sa fonction précise ; la traduction ne doit donc pas imposer une lecture confessionnelle.
- issue: Rapport temporel du participe ἀλείψαντες
  choice: « après lui avoir fait une onction »
  alternative: « en lui faisant une onction » ou « tout en lui faisant une onction »
  rationale: Le participe aoriste décrit normalement une action antérieure au verbe principal, même si, dans la pratique, les deux actions appartiennent à une même démarche. Ce choix respecte l’aspect grec sans tirer de conclusion doctrinale de l’ordre des gestes.
- issue: Désignation des πρεσβύτεροι
  choice: « responsables »
  alternative: « anciens » ou « presbytres »
  rationale: Le contexte indique une fonction reconnue dans l’Église. « Responsables » communique cette fonction en français courant sans suggérer qu’il s’agit seulement de personnes âgées ni imposer un titre propre à une tradition ecclésiale.
translation_notes:
  register: Français moderne, international et digne. La structure interrogative suivie de deux impératifs est conservée. « Église » désigne ici la communauté chrétienne locale. Les reprises pronominales restent au masculin singulier conformément à la personne malade évoquée dans le grec, sans limiter l’ouverture inclusive de « quelqu’un ».
