source:
  edition: SBLGNT
  text: Μακροθυμήσατε οὖν, ἀδελφοί, ἕως τῆς παρουσίας τοῦ κυρίου. ἰδοὺ ὁ γεωργὸς ἐκδέχεται τὸν τίμιον καρπὸν τῆς γῆς, μακροθυμῶν ἐπ’ ⸀αὐτῷ ἕως ⸀λάβῃ πρόϊμον καὶ ὄψιμον.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/007.yaml
  text: Be patient[a], therefore, brothers, until the coming of the Lord. Look, the farmer waits for the precious fruit of the earth[b], being patient over it until it receives the early and late rains.
translation:
  language: fr
  text: 'Soyez donc patients, frères[a], jusqu’à la venue[b] du Seigneur. Voyez : le cultivateur attend avec patience le précieux fruit de la terre, jusqu’à ce qu’il reçoive les pluies de la première et de l’arrière-saison[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « frères et sœurs » : le grec dit « frères », terme qui sert souvent à s’adresser à l’ensemble de la communauté croyante.'
    reason: alternative_reading
  - marker: b
    text: Ou « présence ». Ici, le mot grec παρουσία désigne vraisemblablement l’arrivée future du Seigneur.
    reason: lexical_alternative
  - marker: c
    text: Le grec dit littéralement « la précoce et la tardive », en sous-entendant les pluies saisonnières. Le cultivateur est le sujet de « reçoive ».
    reason: source_clarification
lexical_decisions:
- source_word: Μακροθυμήσατε
  choice: Soyez patients
  rationale: L’impératif appelle à une patience durable. Cette formulation est naturelle en français moderne et permet de reprendre la même racine sémantique plus loin avec « prend patience ».
- source_word: οὖν
  choice: donc
  rationale: Marque la conséquence tirée du contexte précédent, dans une position idiomatique en français.
- source_word: ἀδελφοί
  choice: frères
  rationale: Conserve la forme masculine du vocatif grec; une note précise que cette manière de s’adresser à la communauté peut inclure les femmes.
- source_word: παρουσίας
  choice: venue
  rationale: Dans ce contexte d’attente eschatologique, « venue » exprime naturellement l’arrivée future du Seigneur tout en restant proche du sens de παρουσία.
- source_word: ἰδοὺ
  choice: Voyez
  rationale: Rend la force d’appel à l’attention sans employer l’archaïque « voici » comme simple présentatif.
- source_word: γεωργὸς
  choice: cultivateur
  rationale: Désigne naturellement celui qui travaille la terre, sans limiter l’image à une culture particulière.
- source_word: ἐκδέχεται
  choice: attend
  rationale: Exprime une attente soutenue et confiante, en accord avec le thème de la patience.
- source_word: τίμιον καρπὸν τῆς γῆς
  choice: le précieux fruit de la terre
  rationale: Préserve l’image ample du grec ainsi que la valeur attribuée à la récolte, dans un français clair et digne.
- source_word: μακροθυμῶν ἐπ’ αὐτῷ
  choice: prend patience à son sujet
  rationale: Reprend le thème lexical de μακροθυμέω et rattache naturellement le pronom au fruit attendu.
- source_word: πρόϊμον καὶ ὄψιμον
  choice: les pluies de la première et de l’arrière-saison
  rationale: Le grec sous-entend vraisemblablement la pluie. La formulation française désigne clairement les deux pluies saisonnières sans imposer des mois précis.
theological_decisions:
- issue: Portée de l’adresse ἀδελφοί
  choice: frères
  alternative: frères et sœurs
  rationale: Le texte principal conserve le masculin grammatical du grec, tandis que la note signale sa portée communautaire habituelle sans exclure les croyantes.
- issue: Sens de παρουσία τοῦ κυρίου
  choice: la venue du Seigneur
  alternative: la présence du Seigneur
  rationale: « Venue » convient au cadre d’une attente future, sans développer un schéma eschatologique absent du verset; « présence » demeure une possibilité lexicale signalée en note.
- issue: Sujet de λάβῃ
  choice: ce qu’il ait reçu
  alternative: ce que la terre ou le fruit ait reçu
  rationale: 'Le pronom français « il » conserve une part de l’ambiguïté syntaxique du grec: il peut renvoyer au cultivateur, grammaticalement sujet de l’action, ou au fruit, également masculin et immédiatement évoqué.'
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement ou le vouvoiement ne se pose pas ici, l’impératif étant au pluriel. « Voyez » garde la fonction d’appel à l’attention de ἰδοὺ. La répétition entre « Soyez patients » et « prend patience » reflète celle de la racine μακροθυμ- dans le grec.
