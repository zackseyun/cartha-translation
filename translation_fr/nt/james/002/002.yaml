id: JAS.2.2
reference: James 2:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐὰν γὰρ εἰσέλθῃ ⸀εἰς συναγωγὴν ὑμῶν ἀνὴρ χρυσοδακτύλιος ἐν ἐσθῆτι λαμπρᾷ, εἰσέλθῃ δὲ καὶ πτωχὸς ἐν ῥυπαρᾷ ἐσθῆτι,
base_translation:
  language: en
  yaml_path: translation/nt/james/002/002.yaml
  text: For if a man wearing gold rings and bright clothing enters into your assembly[a], and a poor man in filthy clothing also enters,
translation:
  language: fr
  text: En effet, si un homme portant des bagues en or et des vêtements éclatants entre dans votre assemblée[a], et si un pauvre vêtu d’habits sales y entre aussi,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « synagogue » : le mot grec synagōgē peut désigner une synagogue ou une assemblée.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συναγωγήν
  choice: assemblée
  rationale: Le terme peut désigner une synagogue ou, plus généralement, une assemblée. Ici, « assemblée » exprime naturellement la réunion des destinataires sans déterminer plus précisément son statut institutionnel; « synagogue » est conservé en note.
- source_word: ἀνὴρ
  choice: un homme
  rationale: Le grec emploie explicitement un nom masculin singulier pour le premier personnage de l’exemple.
- source_word: χρυσοδακτύλιος
  choice: portant des bagues en or
  rationale: L’adjectif évoque littéralement des doigts ornés d’or. Cette formulation française naturelle conserve l’image visible de la richesse sans imposer le singulier « une bague ».
- source_word: ἐσθῆτι λαμπρᾷ
  choice: des vêtements éclatants
  rationale: « Éclatants » garde la valeur visuelle de λαμπρός tout en suggérant une tenue remarquable et luxueuse.
- source_word: πτωχὸς
  choice: un pauvre
  rationale: L’adjectif substantivé masculin singulier est rendu de manière concise et demeure parallèle au premier homme.
- source_word: ῥυπαρᾷ ἐσθῆτι
  choice: vêtu d’habits sales
  rationale: « Sales » restitue directement la saleté exprimée par ῥυπαρός, sans l’atténuer en simple pauvreté ou usure.
- source_word: εἰσέλθῃ ... εἰσέλθῃ
  choice: entre ... y entre aussi
  rationale: La répétition du verbe « entrer » préserve le parallélisme grec; « y » évite une répétition française pesante tout en renvoyant clairement à l’assemblée.
- source_word: γὰρ
  choice: En effet
  rationale: Cette locution marque naturellement en français que l’exemple explique l’interdiction formulée au verset précédent.
theological_decisions:
- issue: Sens de συναγωγή dans le contexte d’une communauté destinataire de l’épître
  choice: assemblée
  alternative: synagogue
  rationale: Le texte ne tranche pas ici une question de structure ecclésiale. « Assemblée » laisse ouverte la nature précise de la réunion et évite de faire croire nécessairement à une institution distincte; la valeur plus littérale « synagogue » est signalée en note.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase conserve la structure hypothétique et reste ouverte pour se poursuivre au verset suivant. « En effet » est plus idiomatique que « Car » dans ce contexte explicatif; « habits » évite la répétition immédiate de « vêtements » sans modifier le sens.
