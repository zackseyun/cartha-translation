id: JAS.2.14
reference: James 2:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸀Τί ὄφελος, ἀδελφοί μου, ἐὰν πίστιν λέγῃ τις ἔχειν ἔργα δὲ μὴ ἔχῃ; μὴ δύναται ἡ πίστις σῶσαι αὐτόν;
base_translation:
  language: en
  yaml_path: translation/nt/james/002/014.yaml
  text: What good is it[a], my brothers[c][b], if someone says he has faith but does not have works? Can that faith save him?
translation:
  language: fr
  text: À quoi bon, mes frères[a], si quelqu’un dit avoir la foi[b] mais n’a pas d’œuvres ? Cette foi peut-elle le sauver[c] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « mes frères et sœurs ». Le grec emploie le masculin pluriel « frères » comme forme d’adresse représentative à la communauté croyante.
    reason: lexical_alternative
  - marker: b
    text: Le mot grec πίστις peut aussi se traduire par « confiance » ou, dans certains contextes, « fidélité » ; ici, « foi » convient au sens d’une foi que quelqu’un affirme avoir.
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « La foi peut-elle le sauver ? » L’article grec renvoie à la foi qui vient d’être décrite, une foi affirmée mais dépourvue d’œuvres. On pourrait aussi traduire : « Une telle foi peut-elle le sauver ? »'
    reason: alternative_reading
lexical_decisions:
- source_word: Τί ὄφελος
  choice: À quoi bon
  rationale: Formulation idiomatique et naturelle d’une question rhétorique portant sur l’utilité ou le bénéfice concret.
- source_word: ἀδελφοί μου
  choice: mes frères
  rationale: Conserve la forme masculine plurielle du grec, employée ici comme adresse représentative à la communauté croyante; la portée collective est précisée en note.
- source_word: πίστιν
  choice: la foi
  rationale: « Foi » convient au fait de professer une croyance; « confiance » reste lexicalement possible, tandis que « fidélité » est moins probable dans la tournure « dit qu’il a ».
- source_word: λέγῃ τις ἔχειν
  choice: si quelqu’un dit qu’il a
  rationale: Suit de près la formulation grecque sans renforcer celle-ci par le terme plus interprétatif « prétend avoir ».
- source_word: ἔργα
  choice: œuvres
  rationale: Préserve le lien lexical et théologique avec l’argument développé dans le contexte sur la foi et les œuvres; « actes » ou « actions » seraient également possibles.
- source_word: μὴ ἔχῃ
  choice: n’a pas
  rationale: Rend directement la négation de la possession exprimée en grec.
- source_word: μὴ δύναται
  choice: peut-elle… ?
  rationale: La question introduite par μή appelle une réponse négative; la forme interrogative française conserve cette orientation sans l’expliciter excessivement.
- source_word: ἡ πίστις
  choice: Cette foi
  rationale: L’article grec reprend anaphoriquement la foi qui vient d’être décrite, c’est-à-dire une foi affirmée mais dépourvue d’œuvres.
- source_word: σῶσαι αὐτόν
  choice: le sauver
  rationale: « Sauver » est le terme français usuel qui conserve ici toute la portée de σῴζω.
theological_decisions:
- issue: Rapport entre la foi et les œuvres dans la question rhétorique
  choice: Rendre ἡ πίστις par « cette foi », en renvoyant à la foi professée mais sans œuvres qui vient d’être mentionnée.
  alternative: « La foi peut-elle le sauver ? » ou « Une telle foi peut-elle le sauver ? »
  rationale: Cette formulation préserve la tension théologique du passage sans transformer la question en négation générale du pouvoir salvateur de la foi ni imposer une harmonisation doctrinale.
- issue: Représentation du genre dans l’adresse et le pronom
  choice: Conserver « mes frères » et le singulier masculin « le ».
  alternative: « mes frères et sœurs » et une reformulation inclusive
  rationale: Le texte principal reflète les formes masculines grecques, tout en signalant en note que l’adresse plurielle peut viser l’ensemble de la communauté croyante.
translation_notes:
  register: Français international moderne, digne et accessible. « À quoi bon » rend naturellement la question rhétorique; « œuvres » maintient le vocabulaire caractéristique de l’argument de Jacques. La syntaxe reste concise et conserve les deux questions du grec.
