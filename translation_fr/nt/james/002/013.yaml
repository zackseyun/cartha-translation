reference: James 2:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἡ γὰρ κρίσις ἀνέλεος τῷ μὴ ποιήσαντι ἔλεος· κατακαυχᾶται ⸀ἔλεος κρίσεως.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/013.yaml
  text: For judgment is without mercy to the one who has shown no mercy[a]; mercy triumphs over judgment.
translation:
  language: fr
  text: Car le jugement est sans miséricorde pour celui qui n’a pas fait preuve de miséricorde ; la miséricorde triomphe du jugement.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « la miséricorde se glorifie aux dépens du jugement ». Le verbe grec peut évoquer le fait de se glorifier ou d’exulter aux dépens de quelque chose ; « triomphe » en rend ici le sens de manière idiomatique.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κρίσις / κρίσεως
  choice: jugement
  rationale: « Jugement » conserve la portée judiciaire et l’évaluation divine sans préciser à tort qu’il s’agit nécessairement d’une condamnation. La répétition du même terme préserve le contraste interne du verset.
- source_word: ἀνέλεος
  choice: sans compassion
  rationale: Cette tournure attributive est naturelle en français actuel et maintient le lien lexical avec les deux occurrences de ἔλεος rendues par « compassion ».
- source_word: τῷ μὴ ποιήσαντι ἔλεος
  choice: pour celui qui n’a pas fait preuve de compassion
  rationale: L’expression grecque, littéralement « faire la compassion », signifie exercer ou manifester la compassion. La formulation française est idiomatique et garde la réciprocité morale du contexte.
- source_word: κατακαυχᾶται
  choice: triomphe de
  rationale: Le verbe peut exprimer le fait de se glorifier ou d’exulter aux dépens de quelque chose. « Triomphe de » en restitue naturellement la force rhétorique sans transformer l’aphorisme en explication doctrinale.
- source_word: ἔλεος
  choice: compassion
  rationale: « Compassion » est un équivalent français actuel, clair et digne, qui convient ici à une disposition se traduisant en actes et permet de conserver les trois reprises lexicales du verset.
theological_decisions:
- issue: Sens de la proposition finale κατακαυχᾶται ἔλεος κρίσεως
  choice: 'Principe général : « la compassion triomphe du jugement »'
  alternative: « La compassion se glorifie aux dépens du jugement » ou référence plus précise à la compassion exercée par la personne miséricordieuse
  rationale: La proposition grecque est brève et aphoristique. La traduction conserve sa tension sans décider si l’accent porte sur la compassion de Dieu, sur la compassion à l’œuvre lors du jugement ou sur celle que les croyants ont pratiquée.
translation_notes:
  register: Français international moderne, clair et digne. Le choix cohérent de « compassion » évite l’ambiguïté possible de « miséricorde » pour certains lecteurs tout en conservant la répétition de ἔλεος. Le point-virgule respecte l’articulation serrée des deux propositions.
