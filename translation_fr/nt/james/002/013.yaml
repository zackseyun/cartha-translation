  naturalness: La formulation révisée demeure naturelle, claire et digne en français international contemporain. « Faire preuve de miséricorde » est idiomatique et explicite la construction grecque sans l’alourdir. « La miséricorde triomphe du jugement » est une formulation française fluide pour la clausule concise du grec.
  terminology: '« Miséricorde » est préférable comme équivalent constant de ἔλεος dans ce verset : il maintient la répétition lexicale, correspond au vocabulaire biblique français largement compris et inclut la dimension active requise par le contexte. « Jugement » convient aux deux occurrences de κρίσις.'
