id: JAS.2.25
reference: James 2:25
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁμοίως δὲ καὶ Ῥαὰβ ἡ πόρνη οὐκ ἐξ ἔργων ἐδικαιώθη, ὑποδεξαμένη τοὺς ἀγγέλους καὶ ἑτέρᾳ ὁδῷ ἐκβαλοῦσα;
base_translation:
  language: en
  yaml_path: translation/nt/james/002/025.yaml
  text: And likewise[b][a], was not Rahab the prostitute also justified by works when she welcomed the messengers and sent them out by another way?
translation:
  language: fr
  text: De même, Rahab la prostituée n’a-t-elle pas, elle aussi, été justifiée[a] par les œuvres lorsqu’elle a accueilli les messagers[b] et les a fait partir par un autre chemin ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « reconnue juste » ou « déclarée juste ». Le grec dit « justifiée » ; la traduction conserve ce terme sans trancher ici le débat théologique sur sa nuance.
    reason: lexical_alternative
  - marker: b
    text: 'Grec : « messagers ». Le contexte renvoie aux hommes accueillis par Rahab (Josué 2), et non à des anges célestes.'
    reason: cross_reference
lexical_decisions:
- source_word: ὁμοίως δὲ καὶ
  choice: De même, ... elle aussi
  rationale: Cette formulation naturelle marque à la fois la comparaison avec Abraham, dans le contexte précédent, et l’ajout de Rahab comme second exemple.
- source_word: Ῥαὰβ
  choice: Rahab
  rationale: Transcription française usuelle du nom propre biblique.
- source_word: ἡ πόρνη
  choice: la prostituée
  rationale: Le terme πόρνη désigne directement une prostituée. Cette traduction moderne conserve la portée sociale et morale du grec sans recourir à un mot vieilli.
- source_word: οὐκ ... ἐδικαιώθη
  choice: n’a-t-elle pas ... été justifiée
  rationale: Le passif de δικαιόω est rendu par le terme théologique français correspondant, sans trancher entre déclaration de justice et manifestation de la justice.
- source_word: ἐξ ἔργων
  choice: par les œuvres
  rationale: Cette expression concise rend la valeur de moyen ou de fondement de ἐκ dans l’argument de Jacques et maintient la cohérence terminologique du passage.
- source_word: ὑποδεξαμένη
  choice: lorsqu’elle a accueilli
  rationale: Le verbe évoque ici l’accueil accordé aux hommes. « Lorsqu’elle a accueilli » exprime naturellement le rapport circonstanciel du participe.
- source_word: τοὺς ἀγγέλους
  choice: les messagers
  rationale: ἄγγελος peut désigner un ange ou un messager. Dans le récit de Rahab, il s’agit d’hommes envoyés auprès de Jéricho ; « messagers » préserve le sens lexical sans les identifier explicitement comme « espions ».
- source_word: καὶ ἑτέρᾳ ὁδῷ ἐκβαλοῦσα
  choice: et les a fait partir par un autre chemin
  rationale: Dans ce contexte, ἐκβάλλω signifie faire sortir ou faire partir, sans la force de « chasser ». « Par un autre chemin » rend clairement ἑτέρᾳ ὁδῷ.
theological_decisions:
- issue: Sens de δικαιόω en Jacques 2.25 dans le rapport entre la foi et les œuvres
  choice: Conserver « justifiée » dans le texte principal sans préciser s’il s’agit d’une déclaration de justice ou d’une manifestation de la justice.
  alternative: « reconnue juste » ou « déclarée juste »
  rationale: Le propos de Jacques maintient une tension théologique autour de la justification et des œuvres. Employer « justifiée » conserve le lien lexical avec le grec et avec l’argument du passage sans imposer une lecture doctrinale particulière.
translation_notes:
  register: Français international moderne, naturel et digne. La question rhétorique grecque est conservée. La reprise « elle aussi » maintient la valeur additive de καὶ tout en évitant une tournure française pesante.
