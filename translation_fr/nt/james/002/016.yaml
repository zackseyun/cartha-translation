source:
  edition: SBLGNT
  text: εἴπῃ δέ τις αὐτοῖς ἐξ ὑμῶν· Ὑπάγετε ἐν εἰρήνῃ, θερμαίνεσθε καὶ χορτάζεσθε, μὴ δῶτε δὲ αὐτοῖς τὰ ἐπιτήδεια τοῦ σώματος, ⸀τί ὄφελος;
base_translation:
  language: en
  yaml_path: translation/nt/james/002/016.yaml
  text: and one of you says to them[a], “Go in peace; keep warm and be filled,” but you do not give them the necessities of the body, what benefit is that?
translation:
  language: fr
  text: 'et que l’un de vous leur dise : « Allez en paix, ayez chaud et mangez à votre faim[a] », sans leur donner ce dont leur corps a besoin, à quoi cela sert-il ?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « soyez réchauffés et rassasiés ». En grec, ces formes peuvent être comprises au sens passif ou moyen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴπῃ δέ τις αὐτοῖς ἐξ ὑμῶν
  choice: et que l’un de vous leur dise
  rationale: La tournure française rend naturellement l’exemple hypothétique et le sens partitif de ἐξ ὑμῶν. « Et » assure la continuité sans accentuer excessivement la valeur adversative de δέ.
- source_word: Ὑπάγετε ἐν εἰρήνῃ
  choice: Allez en paix
  rationale: Formule naturelle de congé ou de bénédiction, qui conserve ici sa force ironique.
- source_word: θερμαίνεσθε
  choice: tenez-vous au chaud
  rationale: Cette formulation courante exprime le résultat souhaité sans trancher strictement entre les valeurs moyenne et passive de la forme grecque.
- source_word: χορτάζεσθε
  choice: rassasiez-vous
  rationale: Le verbe désigne le fait d’être rassasié, particulièrement de nourriture. Ce choix reste concret et naturel, tout en conservant la possibilité d’une lecture moyenne ou passive signalée en note.
- source_word: μὴ δῶτε δὲ αὐτοῖς
  choice: sans leur donner
  rationale: Le participe implicite en français relie naturellement l’absence d’aide aux paroles prononcées et rend nettement le contraste exprimé par δέ.
- source_word: τὰ ἐπιτήδεια τοῦ σώματος
  choice: ce dont leur corps a besoin
  rationale: Formulation claire en français moderne qui restitue les provisions nécessaires et maintient l’accent concret sur le corps.
- source_word: τί ὄφελος;
  choice: à quoi cela sert-il ?
  rationale: Équivalent idiomatique de la question sur l’utilité pratique, bien adapté au contexte d’une parole sans action.
theological_decisions:
- issue: Valeur des impératifs θερμαίνεσθε et χορτάζεσθε
  choice: « tenez-vous au chaud et rassasiez-vous » avec une note sur l’ambiguïté de la voix
  alternative: « soyez réchauffés et rassasiés » ou « réchauffez-vous et mangez à votre faim »
  rationale: Le propos de Jacques porte sur la vanité de paroles pieuses non accompagnées d’une aide matérielle. La traduction principale demeure naturelle sans imposer une lecture précise — action des personnes elles-mêmes ou action reçue — et la note préserve explicitement l’ambiguïté grecque.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe hypothétique se rattache au verset précédent; le discours direct garde le contraste ironique entre la bénédiction et l’absence d’aide concrète.
