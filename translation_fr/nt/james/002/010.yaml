id: JAS.2.10
reference: James 2:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὅστις γὰρ ὅλον τὸν νόμον ⸂τηρήσῃ, πταίσῃ⸃ δὲ ἐν ἑνί, γέγονεν πάντων ἔνοχος.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/010.yaml
  text: For whoever keeps the whole law but stumbles in one point has become guilty of all of it[a][b].
translation:
  language: fr
  text: En effet, celui qui observe toute la loi, mais trébuche sur un seul point, devient coupable à l’égard de toute la loi[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « fait un faux pas sur un seul point », « manque à une seule chose » ou « en enfreint une seule partie ». Le grec dit littéralement « trébuche en un seul », image d’une défaillance morale.
    reason: lexical_alternative
  - marker: b
    text: Ou « devient redevable à l’égard de toute la loi ». L’expression signifie que la transgression d’une partie engage la responsabilité de la personne à l’égard de la loi dans son ensemble.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅστις
  choice: celui qui
  rationale: Le pronom relatif indéfini énonce un principe général. « Celui qui » est naturel en français et conserve cette portée.
- source_word: γὰρ
  choice: En effet
  rationale: La conjonction introduit le fondement explicatif de l’affirmation précédente. « En effet » rend clairement ce lien logique en français moderne.
- source_word: ὅλον τὸν νόμον
  choice: toute la loi
  rationale: Cette formulation idiomatique conserve l’idée de totalité exprimée par ὅλον.
- source_word: τηρήσῃ
  choice: observe
  rationale: Dans le contexte de la loi et de ses commandements, τηρέω signifie respecter ou mettre en pratique. « Observe » est précis et naturel.
- source_word: πταίσῃ
  choice: trébuche
  rationale: Le verbe conserve ici son image concrète de faux pas pour désigner une défaillance morale. « Trébuche » préserve cette métaphore.
- source_word: ἐν ἑνί
  choice: sur un seul point
  rationale: L’expression indique un seul domaine ou commandement de la loi. « Sur un seul point » est idiomatique et maintient l’indétermination du grec.
- source_word: γέγονεν
  choice: devient
  rationale: Le parfait grec exprime l’entrée dans un état qui demeure. Le présent français « devient », dans cette maxime générale, rend naturellement ce résultat.
- source_word: πάντων
  choice: envers l’ensemble de la loi
  rationale: Le pluriel génitif renvoie à la totalité des éléments de la loi. L’explicitation évite l’ambiguïté peu naturelle de « coupable de tous » en français.
- source_word: ἔνοχος
  choice: coupable envers
  rationale: ἔνοχος exprime la culpabilité ou l’assujettissement à une responsabilité. « Coupable envers » conserve la force judiciaire tout en indiquant que la culpabilité concerne la loi entière.
theological_decisions:
- issue: Étendue de la culpabilité par rapport à la loi
  choice: La transgression d’un seul point rend la personne coupable envers la loi considérée dans son ensemble.
  alternative: La transgression d’un commandement équivaudrait à avoir commis séparément toutes les transgressions possibles.
  rationale: πάντων ἔνοχος exprime naturellement une responsabilité à l’égard de l’ensemble, sans affirmer que chaque commandement a été individuellement enfreint ni que toutes les fautes sont de gravité identique.
translation_notes:
  register: Français international moderne, clair et digne. La métaphore de la chute est conservée par « trébuche ». « Envers l’ensemble de la loi » explicite le référent de πάντων sans transformer l’énoncé en affirmation selon laquelle chaque commandement aurait été transgressé séparément.
