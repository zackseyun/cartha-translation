  text: ⸀ἐὰν ἀδελφὸς ἢ ἀδελφὴ γυμνοὶ ὑπάρχωσιν καὶ ⸀λειπόμενοι τῆς ἐφημέρου τροφῆς,
base_translation:
  language: en
  yaml_path: translation/nt/james/002/015.yaml
  text: If a brother or sister is poorly clothed and lacking daily food,[a]
translation:
  language: fr
  text: Si un frère ou une sœur n’a pas de quoi se vêtir[a] et manque de nourriture pour la journée,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « est nu »; le terme grec peut désigner l’absence totale de vêtements, mais il évoque probablement ici le fait de ne pas avoir de quoi se vêtir convenablement.
    reason: alternative lexicale
lexical_decisions:
- source_word: ἐὰν
  choice: Si
  rationale: Introduit directement et naturellement en français la condition hypothétique qui se poursuit au verset suivant.
- source_word: ἀδελφὸς ἢ ἀδελφή
  choice: un frère ou une sœur
  rationale: Reproduit explicitement le couple masculin-féminin du grec et conserve le langage familial employé par Jacques.
- source_word: γυμνοὶ ὑπάρχωσιν
  choice: n’a pas de quoi se vêtir
  rationale: Dans cette évocation de la misère, γυμνός peut désigner une personne nue ou insuffisamment vêtue. Cette formulation française naturelle exprime le manque de vêtements sans imposer la nudité totale; une note conserve le sens littéral possible.
- source_word: λειπόμενοι
  choice: manque de
  rationale: Exprime clairement l’état durable de privation indiqué par le participe présent.
- source_word: τῆς ἐφημέρου τροφῆς
  choice: de la nourriture de chaque jour
  rationale: Rend à la fois τροφή, la nourriture ou subsistance, et ἐφήμερος, ce qui est nécessaire pour le jour, dans un français courant et digne.
theological_decisions:
- issue: Portée de ἀδελφὸς ἢ ἀδελφή dans la communauté chrétienne
  choice: Conserver « un frère ou une sœur »
  alternative: Généraliser en « une personne dans le besoin »
  rationale: Le texte emploie expressément le langage de la fraternité, vraisemblablement à propos de croyants dans le contexte. La traduction préserve cette formulation sans restreindre ni élargir explicitement sa portée.
translation_notes:
  register: Français international moderne, naturel et digne. La tournure singulière « un frère ou une sœur n’a… et manque… » traite les deux termes comme des possibilités alternatives et évite l’accord genré de « mal vêtus ». La virgule finale est conservée puisque la proposition conditionnelle se poursuit au verset 16.
