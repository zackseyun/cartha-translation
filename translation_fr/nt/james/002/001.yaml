source:
  edition: SBLGNT
  text: Ἀδελφοί μου, μὴ ἐν προσωπολημψίαις ἔχετε τὴν πίστιν τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ τῆς δόξης;
base_translation:
  language: en
  yaml_path: translation/nt/james/002/001.yaml
  text: My brothers[d][c][b][a], do not hold the faith of our Lord Jesus the Messiah with partiality.
translation:
  language: fr
  text: Mes frères[a], ne faites pas preuve de favoritisme dans la foi en notre Seigneur Jésus le Messie, le Seigneur de gloire[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « Mes frères et sœurs » : le grec dit littéralement « frères », mais l’adresse vise vraisemblablement l’ensemble de la communauté croyante.'
    reason: lexical_alternative
  - marker: b
    text: Ou « dans la foi de notre Seigneur Jésus le Messie ». La construction grecque peut être comprise de plusieurs manières.
    reason: alternative_reading
  - marker: c
    text: Ou « en notre glorieux Seigneur Jésus le Messie ».
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀδελφοί μου
  choice: Mes frères
  rationale: Le vocatif grec est grammaticalement masculin pluriel. Le contexte vise toutefois l’ensemble de la communauté croyante, ce que précise une note.
- source_word: μὴ ἐν προσωπολημψίαις ἔχετε
  choice: ne faites pas de favoritisme dans
  rationale: Le présent impératif avec μή exprime une interdiction. Cette formulation française naturelle rend la conduite visée par le pluriel προσωπολημψίαις sans reproduire servilement la tournure grecque « avoir dans des favoritismes ».
- source_word: τὴν πίστιν
  choice: votre foi
  rationale: L’ajout du possessif, idiomatique en français dans cette exhortation adressée aux croyants, explicite la foi qu’ils professent et pratiquent sans modifier son référent.
- source_word: τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: en notre Seigneur Jésus le Messie
  rationale: Dans la phrase française, « foi en » exprime naturellement la relation objective la plus probable. Χριστός conserve ici sa valeur de titre et est donc rendu par « le Messie ». Une note signale l’autre analyse possible du génitif.
- source_word: τῆς δόξης
  choice: le Seigneur de gloire
  rationale: Cette apposition restitue l’expression sémitisante et solennelle liée au Seigneur Jésus, sans réduire d’emblée le génitif à un simple adjectif signifiant « glorieux ».
theological_decisions:
- issue: Relation du génitif dans τὴν πίστιν τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: votre foi en notre Seigneur Jésus le Messie
  alternative: la foi de notre Seigneur Jésus le Messie
  rationale: La lecture objective est la plus idiomatique en français et convient au contexte de l’exhortation, mais la construction grecque peut recevoir plus d’une analyse; l’alternative est donc conservée en note.
- issue: Fonction de τῆς δόξης
  choice: le Seigneur de gloire
  alternative: notre glorieux Seigneur Jésus le Messie
  rationale: Le génitif peut être compris comme une apposition ou comme une qualification. Le texte retient l’expression biblique plus formelle, tandis que la note préserve la lecture adjectivale.
- issue: Portée de l’adresse Ἀδελφοί
  choice: Mes frères
  alternative: Mes frères et sœurs
  rationale: La forme masculine du grec est maintenue dans le texte, tout en indiquant en note que l’adresse englobe vraisemblablement toute la communauté.
translation_notes:
  register: Français international actuel, digne et directement compréhensible. La phrase évite l’archaïsme « acception de personnes » au profit de « favoritisme », tout en conservant « Seigneur de gloire » pour la force solennelle de l’expression grecque.
