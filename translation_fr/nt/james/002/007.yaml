  text: οὐκ αὐτοὶ βλασφημοῦσιν τὸ καλὸν ὄνομα τὸ ἐπικληθὲν ἐφ’ ὑμᾶς;
base_translation:
  language: en
  yaml_path: translation/nt/james/002/007.yaml
  text: Do not they themselves blaspheme the good name that was called upon you?[a][b]
translation:
  language: fr
  text: Ne sont-ce pas eux-mêmes qui blasphèment le noble nom qui a été invoqué sur vous[a][b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le beau nom » ou « le nom digne d’honneur ».
    reason: lexical_alternative
  - marker: b
    text: Ou « qui a été appelé sur vous » ; l’expression désigne probablement le nom par lequel les croyants sont identifiés et peut faire écho au langage de l’alliance ou du baptême.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐκ αὐτοὶ
  choice: Ne sont-ce pas eux-mêmes
  rationale: La tournure introduit une question rhétorique qui attend une réponse affirmative, tandis que αὐτοὶ souligne que ce sont précisément les personnes déjà mentionnées qui agissent ainsi.
- source_word: βλασφημοῦσιν
  choice: blasphèment
  rationale: Le verbe peut désigner des paroles calomnieuses ou outrageantes. Puisqu’il a ici pour objet le nom associé aux croyants et probablement au Seigneur Jésus, « blasphèment » conserve sa forte portée religieuse sans exclure l’idée d’outrage.
- source_word: τὸ καλὸν ὄνομα
  choice: le noble nom
  rationale: Dans ce contexte, καλός exprime ce qui est honorable, noble ou digne. « Le noble nom » est naturel et digne en français, tout en évitant de préciser trop étroitement le référent.
- source_word: τὸ ἐπικληθὲν
  choice: qui a été invoqué
  rationale: Dans cette construction, ἐπικαλέω évoque un nom appelé ou prononcé sur quelqu’un. « Invoqué » rend la valeur religieuse possible du verbe tout en conservant la voix passive.
- source_word: ἐφ’ ὑμᾶς
  choice: sur vous
  rationale: La préposition avec ἐπικαλέω forme l’expression « invoqué sur vous ». Cette traduction directe préserve l’image d’un nom prononcé sur des personnes, sans la réduire à une simple appellation.
theological_decisions:
- issue: Référent du « noble nom »
  choice: Conserver une référence volontairement large au nom honorable porté par les croyants, très probablement celui de Jésus ou du Seigneur auquel ils appartiennent.
  alternative: Préciser dans le texte « le nom du Christ », « le nom de Jésus » ou, plus largement, « le nom de Dieu ».
  rationale: Le grec ne nomme pas explicitement Jésus dans ce verset, même si Jacques 2.1 oriente fortement la lecture vers lui. La formulation littérale préserve cette tension et évite de résoudre ce que le texte laisse implicite.
- issue: Portée de « invoqué sur vous »
  choice: Préserver l’expression qui peut évoquer l’identification communautaire, l’alliance ou le baptême.
  alternative: Paraphraser « le nom que vous portez » ou « le nom par lequel vous êtes appelés ».
  rationale: Une paraphrase serait plus immédiatement claire, mais effacerait l’image biblique d’un nom prononcé sur des personnes et limiterait les échos possibles du texte.
translation_notes:
  register: Français international moderne, digne et accessible. La question rhétorique conserve l’insistance de αὐτοὶ au moyen de « eux-mêmes ». « Noble nom » évite le sens courant de « bonne réputation » que pourrait suggérer « bon nom », tandis que « invoqué sur vous » maintient l’image et l’ambiguïté théologique de l’original.
