id: JAS.2.6
reference: James 2:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὑμεῖς δὲ ἠτιμάσατε τὸν πτωχόν. οὐχ οἱ πλούσιοι καταδυναστεύουσιν ὑμῶν, καὶ αὐτοὶ ἕλκουσιν ὑμᾶς εἰς κριτήρια;
base_translation:
  language: en
  yaml_path: translation/nt/james/002/006.yaml
  text: But you have dishonored the poor man[b][a]. Is it not the rich who oppress you and themselves drag you into courts?
translation:
  language: fr
  text: Mais vous, vous avez déshonoré le pauvre[a]. Ne sont-ce pas les riches qui vous oppriment et qui vous traînent eux-mêmes devant les tribunaux[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la personne pauvre », ou, dans un sens plus général, « les pauvres ». Le grec est au singulier et fait probablement écho à l’exemple précis des versets précédents, tout en pouvant représenter les pauvres dans leur ensemble.
    reason: lexical_alternative
  - marker: b
    text: Ou « devant les cours de justice ». Le grec désigne des instances judiciaires.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠτιμάσατε
  choice: avez déshonoré
  rationale: Le verbe exprime le fait de traiter quelqu’un sans honneur, avec mépris. « Déshonoré » conserve la dimension d’honneur et de honte présente dans le grec.
- source_word: τὸν πτωχόν
  choice: le pauvre
  rationale: Le singulier substantivé renvoie naturellement à l’homme pauvre présenté dans les versets précédents, tout en pouvant avoir une portée représentative plus large.
- source_word: οἱ πλούσιοι
  choice: les riches
  rationale: L’adjectif substantivé désigne les personnes riches comme groupe social ; « les riches » est concis et idiomatique.
- source_word: καταδυναστεύουσιν
  choice: oppriment
  rationale: Le verbe décrit l’exercice abusif et hostile d’un pouvoir sur autrui ; « oppriment » en restitue directement la force.
- source_word: ἕλκουσιν
  choice: traînent
  rationale: Le verbe évoque une action énergique ou coercitive. « Traînent » préserve cette image vive dans le contexte judiciaire.
- source_word: κριτήρια
  choice: tribunaux
  rationale: Le terme désigne ici les instances judiciaires. « Tribunaux » est précis et naturel en français moderne.
- source_word: καὶ αὐτοὶ
  choice: et qui vous traînent eux-mêmes
  rationale: '« Eux-mêmes » maintient l’emphase grecque : ce sont précisément les riches qui engagent cette action contre les destinataires.'
- source_word: οὐχ ... ;
  choice: N’est-ce pas ... qui
  rationale: Cette construction française rend naturellement la question rhétorique grecque, qui appelle une réponse affirmative.
theological_decisions:
- issue: Référence du singulier « le pauvre »
  choice: Un homme pauvre représentatif dans la scène de l’assemblée, avec une portée plus générale possible
  alternative: Un singulier collectif désignant les pauvres en général
  rationale: Le contexte immédiat décrit un homme pauvre précis (2.2-3). Le maintien du singulier respecte ce fil discursif sans exclure son caractère représentatif.
translation_notes:
  register: Français international moderne, clair et digne. Le redoublement « vous, vous » restitue le contraste emphatique de ὑμεῖς δέ. La tournure « N’est-ce pas les riches qui… » est retenue comme forme courante et naturelle, tandis que « eux-mêmes » conserve l’insistance du texte grec.
