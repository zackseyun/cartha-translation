id: JAS.2.8
reference: James 2:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Εἰ μέντοι νόμον τελεῖτε βασιλικὸν κατὰ τὴν γραφήν Ἀγαπήσεις τὸν πλησίον σου ὡς σεαυτόν, καλῶς ποιεῖτε·
base_translation:
  language: en
  yaml_path: translation/nt/james/002/008.yaml
  text: If[a], however, you are fulfilling the royal law according to the Scripture, “You shall love your neighbor as yourself,” you are doing well.
translation:
  language: fr
  text: 'Si toutefois vous accomplissez la loi royale[a], conformément à l’Écriture : « Tu aimeras ton prochain comme toi-même », vous faites bien.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la loi du Roi » ou « la loi du Royaume ». Le grec dit « loi royale », expression qui peut souligner son origine royale ou son rang suprême.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰ μέντοι
  choice: Si toutefois
  rationale: Cette tournure conserve la valeur conditionnelle de εἰ et la légère nuance de contraste ou de réserve portée par μέντοι, dans un français actuel et naturel.
- source_word: νόμον ... βασιλικὸν
  choice: la loi royale
  rationale: « Royale » correspond directement à βασιλικός et laisse ouverte la question de savoir si la loi est ainsi qualifiée en raison de sa source royale, de son rang éminent ou de son lien avec le Royaume.
- source_word: τελεῖτε
  choice: vous accomplissez
  rationale: Le verbe « accomplir » exprime ici la mise en pratique effective et complète d’une exigence, tout en restant proche de la nuance de τελέω.
- source_word: κατὰ τὴν γραφήν
  choice: conformément à l’Écriture
  rationale: Cette formulation naturelle indique que l’accomplissement de la loi se fait en accord avec ce que dit l’Écriture, tout en conservant le singulier défini.
- source_word: Ἀγαπήσεις
  choice: Tu aimeras
  rationale: Le futur grec a ici valeur de commandement dans la citation de Lévitique 19.18 ; le futur français en préserve la forme scripturaire traditionnelle et la force prescriptive.
- source_word: τὸν πλησίον σου
  choice: ton prochain
  rationale: « Le prochain » est le terme français établi et exact pour πλησίον dans ce contexte éthique.
- source_word: ὡς σεαυτόν
  choice: comme toi-même
  rationale: Cette traduction concise reproduit la comparaison grecque sans explicitation ajoutée.
- source_word: καλῶς ποιεῖτε
  choice: vous faites bien
  rationale: Cette expression rend simplement l’approbation formulée par Jacques et demeure idiomatique en français moderne.
theological_decisions:
- issue: Sens de « loi royale »
  choice: Maintenir la qualification ouverte « loi royale »
  alternative: « loi du Roi », « loi suprême » ou « loi du Royaume »
  rationale: 'Le grec βασιλικός permet plusieurs associations : une loi provenant du Roi, une loi de rang supérieur ou une loi liée au Royaume. La traduction ne tranche pas entre ces lectures possibles.'
translation_notes:
  register: Français international moderne, digne et accessible. La citation scripturaire conserve le futur à valeur impérative. « Si toutefois » maintient la condition et la légère réserve du grec sans alourdir la phrase.
