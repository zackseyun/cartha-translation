  text: ⸀οὐ διεκρίθητε ἐν ἑαυτοῖς καὶ ἐγένεσθε κριταὶ διαλογισμῶν πονηρῶν;
base_translation:
  language: en
  yaml_path: translation/nt/james/002/004.yaml
  text: have you not made distinctions among yourselves and become judges with evil thoughts?[a][b]
translation:
  language: fr
  text: n’avez-vous pas fait de distinctions entre vous[a] et n’êtes-vous pas devenus des juges aux pensées mauvaises[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « n’avez-vous pas fait preuve de discrimination entre vous ? » Le verbe peut aussi signifier « vous diviser » ou, dans d’autres contextes, « douter » ; ici, le contexte favorise l’idée de distinctions discriminatoires.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « des juges de pensées mauvaises » ; on peut aussi comprendre : « des juges aux mauvais raisonnements » ou « des juges animés de mauvaises pensées ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: διεκρίθητε
  choice: avez-vous… fait de distinctions
  rationale: Dans le contexte immédiat du traitement préférentiel accordé au riche au détriment du pauvre (2.1-3), le verbe désigne surtout l’établissement de distinctions discriminatoires. Cette formulation conserve l’idée de distinguer sans réduire le sens à la seule hésitation intérieure.
- source_word: ἐν ἑαυτοῖς
  choice: entre vous
  rationale: Le cadre communautaire favorise le sens relationnel et collectif plutôt que le seul sens intérieur « en vous-mêmes ».
- source_word: ἐγένεσθε
  choice: êtes-vous devenus
  rationale: 'Le verbe marque le résultat de leur conduite : en établissant ces distinctions, ils sont devenus des juges d’un certain caractère.'
- source_word: κριταὶ
  choice: juges
  rationale: « Juges » rend directement la portée judiciaire et morale de κριταί.
- source_word: διαλογισμῶν πονηρῶν
  choice: aux raisonnements mauvais
  rationale: Cette tournure conserve le génitif grec et la valeur de διαλογισμός, qui peut désigner des pensées, des raisonnements ou des délibérations, sans le réduire au sens plus étroit de « motifs ».
- source_word: οὐ
  choice: n’avez-vous pas… ?
  rationale: La question négative garde la force rhétorique du reproche et appelle une réponse affirmative.
theological_decisions:
- issue: Sens de διακρίνω en rapport avec la partialité
  choice: Le verset condamne les distinctions discriminatoires faites au sein de la communauté croyante.
  alternative: Le verset parlerait principalement d’une division intérieure ou du doute.
  rationale: Les versets 1 à 3 décrivent explicitement un traitement différent du riche et du pauvre. Ce contexte favorise donc le sens social de discrimination, tout en laissant en note les autres nuances possibles du verbe.
translation_notes:
  register: Français international moderne, digne et direct. La structure interrogative conserve le ton de réprimande. « Aux raisonnements mauvais » est volontairement un peu soutenu afin de préserver la construction et l’ambiguïté du grec, éclairées par la note.
