id: JAS.2.5
reference: James 2:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀκούσατε, ἀδελφοί μου ἀγαπητοί. οὐχ ὁ θεὸς ἐξελέξατο τοὺς πτωχοὺς ⸂τῷ κόσμῳ⸃ πλουσίους ἐν πίστει καὶ κληρονόμους τῆς βασιλείας ἧς ἐπηγγείλατο τοῖς ἀγαπῶσιν αὐτόν;
base_translation:
  language: en
  yaml_path: translation/nt/james/002/005.yaml
  text: 'Listen[c][b][a], my beloved brothers: has not God chosen those who are poor in the world to be rich in faith and heirs of the kingdom that he promised to those who love him?'
translation:
  language: fr
  text: 'Écoutez, mes frères bien-aimés[a] : Dieu n’a-t-il pas choisi ceux qui sont pauvres aux yeux du monde[b] pour qu’ils soient riches dans la foi[c] et héritiers du royaume qu’il a promis à ceux qui l’aiment ?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « mes frères et sœurs bien-aimés » ; le grec dit « frères », mais cette forme d’adresse peut inclure toute la communauté croyante.
    reason: alternative_reading
  - marker: b
    text: Ou « pauvres selon les critères du monde » ; plus littéralement, « pauvres par rapport au monde ».
    reason: lexical_alternative
  - marker: c
    text: « Foi » peut aussi être rendu par « confiance » ou, moins probablement ici, par « fidélité ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσατε
  choice: Écoutez
  rationale: L’impératif aoriste pluriel appelle directement les destinataires à prêter attention. « Écoutez » est naturel et conserve la force de l’exhortation.
- source_word: ἀδελφοί μου ἀγαπητοί
  choice: mes frères bien-aimés
  rationale: « Frères » rend le masculin pluriel grec, tandis que « bien-aimés » restitue ἀγαπητοί. Une note signale que l’interpellation peut inclure toute la communauté croyante.
- source_word: οὐχ ὁ θεὸς ἐξελέξατο
  choice: Dieu n’a-t-il pas choisi
  rationale: La tournure interrogative négative attend une réponse affirmative. Le passé composé exprime naturellement en français un choix accompli dont la portée demeure actuelle.
- source_word: τοὺς πτωχοὺς τῷ κόσμῳ
  choice: ceux qui sont pauvres aux yeux du monde
  rationale: Le datif τῷ κόσμῳ indique vraisemblablement le domaine ou le critère selon lequel ils sont pauvres. Cette formulation française est naturelle tout en conservant le contraste entre l’évaluation du monde et la richesse dans la foi.
- source_word: πλουσίους ἐν πίστει
  choice: riches dans la foi
  rationale: « Foi » est ici le sens contextuel le plus probable de πίστις. « Riches dans la foi » conserve l’image et le contraste avec la pauvreté matérielle ou sociale.
- source_word: κληρονόμους τῆς βασιλείας
  choice: héritiers du royaume
  rationale: « Héritiers » restitue précisément l’image juridique et familiale de κληρονόμοι et constitue une expression française naturelle.
- source_word: ἧς ἐπηγγείλατο
  choice: qu’il a promis
  rationale: Le relatif reprend « royaume ». Le passé composé rend simplement la promesse faite par Dieu sans ajouter de nuance réflexive au moyen grec.
- source_word: τοῖς ἀγαπῶσιν αὐτόν
  choice: à ceux qui l’aiment
  rationale: Le datif désigne les bénéficiaires de la promesse, et le participe présent caractérise ceux qui aiment Dieu.
theological_decisions:
- issue: Portée doctrinale du choix de Dieu
  choice: Rendre ἐξελέξατο simplement par « choisi »
  alternative: Employer une formulation interprétative mettant explicitement en avant la prédestination
  rationale: Le verset affirme le choix de Dieu en faveur de ceux que le monde considère comme pauvres, dans le contexte d’une dénonciation du favoritisme. La traduction ne doit ni effacer ce choix ni lui imposer un système doctrinal ultérieur.
- issue: Portée de ἀδελφοί
  choice: Conserver « frères » dans le texte et signaler en note la portée inclusive possible
  alternative: Traduire directement « frères et sœurs »
  rationale: Le nom grec est grammaticalement masculin pluriel, mais cette forme d’adresse peut viser l’ensemble de la communauté. La note préserve ces deux données.
- issue: Sens de πίστις
  choice: Employer « foi » dans le texte principal
  alternative: « confiance » ou, moins probablement ici, « fidélité »
  rationale: Dans l’expression « riches dans la foi », « foi » est le sens le plus naturel, sans exclure les nuances lexicales indiquées en note.
translation_notes:
  register: Français international moderne, clair et digne. La question rhétorique est conservée, ainsi que les images de richesse et d’héritage. Les notes rendent visibles l’inclusivité possible de l’adresse et les ambiguïtés lexicales sans alourdir le texte principal.
