id: JAS.2.17
reference: James 2:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὕτως καὶ ἡ πίστις, ἐὰν μὴ ⸂ἔχῃ ἔργα⸃, νεκρά ἐστιν καθ’ ἑαυτήν.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/017.yaml
  text: So also faith[a], if it does not have works, is dead by itself.
translation:
  language: fr
  text: De même, la foi[a], si elle n’a pas d’œuvres, est morte à elle seule.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « confiance » ; moins probablement ici, « fidélité ». Le mot grec pistis peut avoir ces sens, mais « foi » convient le mieux au raisonnement de Jacques dans ce verset.
    reason: Alternative lexicale
lexical_decisions:
- source_word: οὕτως καὶ
  choice: De même
  rationale: L’expression relie la conclusion à l’illustration précédente et marque une correspondance. « De même » est naturel en français et conserve clairement le lien argumentatif.
- source_word: ἡ πίστις
  choice: la foi
  rationale: Dans l’argument de Jacques, πίστις désigne ici la foi professée ou affirmée. « La foi » préserve le terme central et la tension du passage sans imposer une interprétation confessionnelle.
- source_word: ἐὰν μὴ ἔχῃ
  choice: si elle n’a pas
  rationale: Cette formulation rend directement la proposition conditionnelle avec ἐὰν μή et reste idiomatique en français moderne.
- source_word: ἔργα
  choice: d’œuvres
  rationale: « Œuvres » maintient le lien lexical avec l’ensemble du raisonnement de Jacques 2 et désigne les actes concrets qui accompagnent la foi, sans réduire le sens à une catégorie particulière d’actions.
- source_word: νεκρά
  choice: morte
  rationale: L’adjectif prédicatif exprime une métaphore volontairement forte. « Morte » en conserve pleinement la vigueur.
- source_word: καθ’ ἑαυτήν
  choice: en elle-même
  rationale: L’expression considère la foi isolément, sans œuvres. « En elle-même » rend cette idée tout en restant proche de la formulation grecque; « à elle seule » serait une variante plus explicitement idiomatique.
theological_decisions:
- issue: Traduction de πίστις dans un passage central aux débats sur la foi et les œuvres
  choice: foi
  alternative: confiance; fidélité
  rationale: « Foi » correspond le mieux au raisonnement immédiat sur une foi qui se prétend telle mais n’est pas accompagnée d’œuvres. Ce choix conserve la tension théologique du texte sans expliquer à sa place le rapport entre foi, œuvres et justification.
- issue: Portée de καθ’ ἑαυτήν
  choice: en elle-même
  alternative: à elle seule; par elle-même
  rationale: La traduction conserve l’idée d’une foi considérée isolément. Elle n’ajoute pas que les œuvres produisent ou remplacent la foi, mais laisse intacte l’affirmation de Jacques selon laquelle une foi sans œuvres est morte.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe demeure proche du grec sans devenir artificielle. « Œuvres » est conservé comme terme biblique courant et comme mot-clé du contexte.
