id: JAS.2.21
reference: James 2:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἀβραὰμ ὁ πατὴρ ἡμῶν οὐκ ἐξ ἔργων ἐδικαιώθη, ἀνενέγκας Ἰσαὰκ τὸν υἱὸν αὐτοῦ ἐπὶ τὸ θυσιαστήριον;
base_translation:
  language: en
  yaml_path: translation/nt/james/002/021.yaml
  text: Was not Abraham our father justified by works when he offered up Isaac his son on the altar?[a]
translation:
  language: fr
  text: Abraham, notre père, n’a-t-il pas été justifié par les œuvres lorsqu’il a offert son fils Isaac sur l’autel ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « reconnu juste », « montré comme juste » ou « déclaré juste ». Selon le contexte, le verbe grec peut signifier que quelqu’un est déclaré juste ou qu’il est montré comme juste.
    reason: alternative_reading
lexical_decisions:
- source_word: πατὴρ ἡμῶν
  choice: notre père
  rationale: Conserve la métaphore familiale et la portée identitaire de l’expression grecque, sans l’aplatir en « notre ancêtre ».
- source_word: ἐξ ἔργων
  choice: par les œuvres
  rationale: Rend naturellement en français la source ou le fondement exprimé par ἐξ avec le génitif, tout en maintenant le vocabulaire théologique du contexte.
- source_word: ἐδικαιώθη
  choice: a été justifié
  rationale: Préserve le lien lexical avec le thème de la justification ainsi que l’ambiguïté entre une valeur déclarative et une valeur démonstrative.
- source_word: ἀνενέγκας
  choice: lorsqu’il a offert
  rationale: Donne au participe aoriste une valeur temporelle naturelle en français et conserve ici le sens sacrificiel du verbe.
- source_word: τὸν υἱὸν αὐτοῦ
  choice: son fils Isaac
  rationale: Ordre français naturel qui restitue clairement Isaac comme le fils d’Abraham.
- source_word: θυσιαστήριον
  choice: l’autel
  rationale: Équivalent français courant et précis pour l’autel sacrificiel.
- source_word: οὐκ ... ἐδικαιώθη;
  choice: n’a-t-il pas été justifié ?
  rationale: Conserve la question rhétorique grecque qui appelle une réponse affirmative, dans une syntaxe française naturelle.
theological_decisions:
- issue: Sens de δικαιόω en Jacques 2.21 en rapport avec les œuvres
  choice: Employer « a été justifié » dans le texte principal.
  alternative: « a été reconnu juste », « s’est révélé juste » ou « a été déclaré juste »
  rationale: « Justifié » maintient le lien avec le débat explicite du passage et n’impose ni une lecture exclusivement déclarative ni une lecture exclusivement démonstrative. Les autres nuances sont signalées en note afin de préserver la tension théologique du texte.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation conserve le vocabulaire théologique traditionnel sans rendre la phrase obscure; la question rhétorique reste nettement perceptible.
