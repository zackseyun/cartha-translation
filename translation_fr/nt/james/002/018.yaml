source:
  edition: SBLGNT
  text: Ἀλλ’ ἐρεῖ τις· Σὺ πίστιν ἔχεις κἀγὼ ἔργα ἔχω. δεῖξόν μοι τὴν πίστιν σου ⸀χωρὶς τῶν ⸀ἔργων, κἀγώ ⸂σοι δείξω⸃ ἐκ τῶν ἔργων μου τὴν ⸀πίστιν.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/018.yaml
  text: But someone will say[a], “You have faith, and I have works.” Show me your faith apart from works[c][b], and I will show you my faith by my works.
translation:
  language: fr
  text: 'Mais quelqu’un dira[d] : « Toi, tu as la foi[c], et moi, j’ai les œuvres. Montre-moi ta foi sans les œuvres[a], et moi, je te montrerai ma foi par mes œuvres[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « indépendamment des œuvres ».
    reason: lexical_alternative
  - marker: b
    text: Ou « à partir de mes œuvres ». La préposition grecque peut indiquer la source ou le moyen ; ici, les œuvres rendent la foi visible.
    reason: lexical_alternative
  - marker: c
    text: Le grec pistis peut aussi, selon le contexte, exprimer la confiance ou la fidélité.
    reason: alternative_reading
  - marker: d
    text: Les manuscrits grecs anciens ne comportaient pas de guillemets. La délimitation exacte des paroles de l’interlocuteur hypothétique est discutée.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀλλ’
  choice: Mais
  rationale: Marque le contraste et introduit l’objection hypothétique dans l’argumentation de Jacques.
- source_word: ἐρεῖ τις
  choice: quelqu’un dira
  rationale: Conserve le futur de l’indicatif et le style de dialogue argumentatif du grec.
- source_word: πίστιν / πίστιν
  choice: foi
  rationale: Terme naturel et traditionnel dans ce contexte, qui maintient la tension entre la foi affirmée et les œuvres qui la rendent visible, sans réduire πίστις à la seule fidélité.
- source_word: ἔργα
  choice: œuvres
  rationale: Conserve le terme clé de l’argumentation de Jacques et ses liens avec le contexte immédiat.
- source_word: δεῖξόν μοι
  choice: Montre-moi
  rationale: Rend directement l’impératif grec et son appel à une démonstration concrète.
- source_word: χωρὶς τῶν ἔργων
  choice: sans les œuvres
  rationale: Expression française naturelle qui rend χωρίς au sens de séparation ou d’absence, sans ajouter d’élément absent du grec.
- source_word: κἀγώ σοι δείξω
  choice: et moi, je te montrerai
  rationale: Le pronom disjoint et la reprise de « je » rendent l’emphase de κἀγώ et maintiennent le parallélisme rhétorique.
- source_word: ἐκ τῶν ἔργων μου
  choice: par mes œuvres
  rationale: Dans ce contexte, ἐκ indique que les œuvres constituent le moyen ou la base visible à partir de laquelle la foi est montrée.
theological_decisions:
- issue: Sens de πίστις dans le débat sur la foi et les œuvres
  choice: foi
  alternative: confiance ou fidélité
  rationale: « Foi » préserve le vocabulaire central et la tension théologique du passage. « Fidélité » trancherait trop vite en faveur d’une interprétation particulière.
- issue: Étendue des paroles attribuées à l’interlocuteur hypothétique
  choice: La citation directe se limite à « Toi, tu as la foi, et moi, j’ai les œuvres » ; la suite exprime la réponse de Jacques
  alternative: Faire porter la citation de l’interlocuteur sur une partie plus longue, voire sur tout le verset
  rationale: Les manuscrits grecs anciens ne fournissent pas les guillemets modernes, et la délimitation des voix est discutée. La ponctuation retenue donne une progression argumentative intelligible sans nier cette ambiguïté.
translation_notes:
  register: Français international moderne, direct et digne. Le parallélisme « Toi… et moi… / ta foi… ma foi » est conservé, ainsi que le terme théologique « œuvres ». La ponctuation rend le dialogue lisible tout en signalant dans les décisions éditoriales l’incertitude ancienne sur la délimitation de la citation.
