source:
  edition: SBLGNT
  text: θέλεις δὲ γνῶναι, ὦ ἄνθρωπε κενέ, ὅτι ἡ πίστις χωρὶς τῶν ἔργων ⸀ἀργή ἐστιν;
base_translation:
  language: en
  yaml_path: translation/nt/james/002/020.yaml
  text: But do you want to know[a], O foolish man[b], that faith apart from works is useless?
translation:
  language: fr
  text: Mais veux-tu savoir, homme sans consistance[a], que la foi sans les œuvres est inopérante[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « homme vide ». On pourrait aussi traduire : « homme creux » ou « insensé ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « inactive », « improductive » ou « inutile ». Le terme grec désigne ce qui ne travaille pas ou ne produit aucun effet.'
    reason: lexical_alternative
lexical_decisions:
- source_word: θέλεις δὲ γνῶναι
  choice: Mais veux-tu savoir
  rationale: θέλω suivi de l’infinitif exprime ici la volonté, et δέ marque la transition adversative. Cette formulation conserve la tournure interrogative et son caractère rhétorique.
- source_word: ὦ ἄνθρωπε κενέ
  choice: homme sans consistance
  rationale: Le vocatif singulier ἄνθρωπε est rendu par « homme ». κενέ signifie littéralement « vide » et dénonce ici le manque de substance ou de discernement ; « sans consistance » transmet cette image en français naturel sans la réduire d’emblée au seul sens d’« insensé ».
- source_word: ὅτι
  choice: que
  rationale: ὅτι introduit le contenu de ce que l’interlocuteur est appelé à savoir.
- source_word: ἡ πίστις
  choice: la foi
  rationale: « La foi » est le rendu direct et usuel de πίστις dans l’argument de Jacques, sans préciser davantage la nature de cette foi que ne le fait le verset.
- source_word: χωρὶς τῶν ἔργων
  choice: sans les œuvres
  rationale: χωρίς avec le génitif indique l’absence ou la séparation. « Sans les œuvres » est idiomatique et exact dans ce contexte.
- source_word: ἀργή ἐστιν
  choice: est inopérante
  rationale: ἀργός désigne ce qui reste inactif, ne travaille pas ou ne produit aucun effet. « Inopérante » exprime cette inefficacité sans substituer à ce mot le qualificatif « morte » employé dans les versets voisins.
theological_decisions:
- issue: Rapport entre la foi et les œuvres dans l’argument de Jacques
  choice: Décrire la foi sans les œuvres comme « inopérante »
  alternative: La qualifier d’« inutile », d’« inactive » ou, par harmonisation avec les versets voisins, de « morte »
  rationale: Le texte porte ἀργή, et non νεκρά. « Inopérante » préserve l’affirmation propre à ce verset et sa tension théologique, sans imposer une explication confessionnelle ni l’assimiler au vocabulaire des versets voisins.
translation_notes:
  register: Français international moderne, digne et accessible. L’interpellation conserve le singulier masculin du grec tout en rendant l’image de κενός de manière intelligible. La ponctuation française comporte une espace avant le point d’interrogation.
