  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἐπληρώθη ἡ γραφὴ ἡ λέγουσα· Ἐπίστευσεν δὲ Ἀβραὰμ τῷ θεῷ, καὶ ἐλογίσθη αὐτῷ εἰς δικαιοσύνην, καὶ φίλος θεοῦ ἐκλήθη.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/023.yaml
  text: And the Scripture was fulfilled that says[a], “Abraham believed God, and it was counted to him as righteousness,” and he was called a friend of God.
translation:
  language: fr
  text: 'Et l’Écriture qui dit : « Abraham crut Dieu, et cela lui fut compté comme justice[a] » fut accomplie, et il fut appelé ami de Dieu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « crédité comme justice » ou « porté à son compte comme justice » ; le verbe grec peut aussi évoquer l’idée de porter au compte de quelqu’un.
    reason: Alternative lexicale destinée à faire entendre la nuance d’attribution de λογίζομαι.
lexical_decisions:
- source_word: ἐπληρώθη
  choice: s’accomplit
  rationale: Le passif de πληρόω, dans une formule relative à l’Écriture, exprime ici l’accomplissement de la parole citée. Le passé simple convient au registre narratif et solennel du verset.
- source_word: ἡ γραφὴ ἡ λέγουσα
  choice: l’Écriture qui dit
  rationale: γραφή désigne ici l’Écriture sainte; le participe présent λέγουσα est naturellement rendu par la relative « qui dit ».
- source_word: Ἐπίστευσεν ... Ἀβραὰμ τῷ θεῷ
  choice: Abraham crut Dieu
  rationale: Avec le datif, πιστεύω souligne qu’Abraham a tenu Dieu pour digne de foi. « Crut Dieu » reste proche de la citation et évite d’expliciter davantage par « mit sa foi en Dieu ».
- source_word: ἐλογίσθη αὐτῷ
  choice: cela lui fut compté
  rationale: Le passif de λογίζομαι évoque une attribution ou une mise au compte. « Fut compté » conserve cette nuance sans imposer une explication doctrinale.
- source_word: εἰς δικαιοσύνην
  choice: comme justice
  rationale: Cette formulation rend directement la valeur attribuée à la foi dans la citation de Genèse 15.6. « Justice » est le terme français usuel pour δικαιοσύνη dans ce contexte.
- source_word: φίλος θεοῦ
  choice: ami de Dieu
  rationale: Cette expression française naturelle préserve le sens relationnel du génitif sans le préciser davantage.
- source_word: ἐκλήθη
  choice: fut appelé
  rationale: Le passif de καλέω désigne sobrement l’appellation reçue, tout en laissant ouverte sa source précise.
theological_decisions:
- issue: Rapport entre la foi et les œuvres d’Abraham dans l’argument de Jacques
  choice: Conserver l’affirmation que l’Écriture s’accomplit, sans préciser ici de quelle manière l’acte d’obéissance d’Abraham se rapporte à sa foi.
  alternative: Dissocier l’imputation de justice des œuvres, ou présenter les œuvres comme remplaçant la foi.
  rationale: Le contexte unit la foi d’Abraham à son obéissance ultérieure. La traduction garde cette tension sans trancher un débat confessionnel.
- issue: Sens de δικαιοσύνη
  choice: justice
  alternative: justification; droiture
  rationale: « Justice » est l’équivalent français traditionnel et contextuellement approprié dans la citation de Genèse 15.6; « justification » interpréterait le terme, tandis que « droiture » en réduirait potentiellement la portée.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple maintient le caractère littéraire d’une citation scripturaire sans archaïsmes marqués. Le δέ de la citation n’est pas rendu séparément, car son emploi n’exige pas ici un connecteur français.
