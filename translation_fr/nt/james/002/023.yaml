  naturalness: « Et l’Écriture qui dit … fut accomplie » est une formulation française littéraire, claire et naturelle dans un registre biblique moderne. « Abraham crut Dieu » et « ami de Dieu » sont idiomatiques et respectent le registre.
  terminology: « Justice » convient ici comme équivalent français traditionnel et établi de δικαιοσύνη dans la citation de Genèse 15.6. « Compté comme justice » maintient la formulation sans imposer d’interprétation doctrinale. La note proposée est simplifiée afin que les alternatives françaises soient grammaticalement nettes.
