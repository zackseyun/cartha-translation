id: JAS.2.11
reference: James 2:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ γὰρ εἰπών Μὴ ⸀μοιχεύσῃς εἶπεν καί Μὴ ⸀φονεύσῃς· εἰ δὲ οὐ ⸂μοιχεύεις φονεύεις⸃ δέ, γέγονας παραβάτης νόμου.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/011.yaml
  text: For he who said, “Do not commit adultery,” also said, “Do not murder.” Now if you do not commit adultery but do murder, you have become a transgressor of the law.
translation:
  language: fr
  text: 'Car celui qui a dit : « Tu ne commettras pas d’adultère » a aussi dit : « Tu ne commettras pas de meurtre. » Or, si tu ne commets pas d’adultère, mais que tu commets un meurtre, tu es devenu un transgresseur de la loi.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ... εἰπών
  choice: celui qui a dit
  rationale: Le participe substantivé avec article désigne personnellement l’auteur des commandements sans ajouter explicitement « Dieu », absent du grec.
- source_word: Μὴ μοιχεύσῃς
  choice: Tu ne commettras pas d’adultère
  rationale: Cette formulation française reconnue restitue naturellement la portée impérative et l’écho du Décalogue.
- source_word: καί
  choice: a aussi dit
  rationale: « Aussi » souligne que les deux commandements viennent du même locuteur, point essentiel de l’argument.
- source_word: Μὴ φονεύσῃς
  choice: Tu ne commettras pas de meurtre
  rationale: φονεύω désigne le meurtre, et non toute mise à mort sans distinction; cette formulation garde aussi la forme traditionnelle du commandement.
- source_word: εἰ δὲ
  choice: Or, si
  rationale: Cette articulation introduit avec naturel l’application hypothétique tout en conservant la progression argumentative.
- source_word: οὐ μοιχεύεις ... φονεύεις δέ
  choice: tu ne commets pas d’adultère, mais que tu commets un meurtre
  rationale: Les présents sont rendus comme un cas général; « mais » exprime clairement le contraste porté par δέ.
- source_word: γέγονας
  choice: tu es devenu
  rationale: Le parfait de γίνομαι indique l’entrée dans un état qui demeure; « es devenu » en conserve mieux la nuance qu’un simple « es ».
- source_word: παραβάτης νόμου
  choice: transgresseur de la loi
  rationale: Cette expression conserve le registre juridique et moral de παραβάτης ainsi que la référence à la loi prise comme un tout.
theological_decisions:
- issue: Identité de celui qui prononce les commandements
  choice: « celui qui a dit », sans expliciter « Dieu »
  alternative: « Dieu, qui a dit »
  rationale: Dieu est clairement sous-entendu, mais le grec ne le nomme pas ici; conserver la tournure substantivée évite une explicitation interprétative inutile.
- issue: Portée de la transgression
  choice: « transgresseur de la loi »
  alternative: « transgresseur de ce commandement »
  rationale: Le grec dit νόμου et l’argument présente la loi comme un ensemble dont on devient transgresseur en enfreignant un commandement.
translation_notes:
  register: Français international moderne, digne et accessible. Les citations gardent la formulation française bien établie du Décalogue, tandis que la phrase argumentative reste naturelle. Aucun marqueur de note n’est requis.
