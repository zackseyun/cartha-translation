id: JAS.2.24
reference: James 2:24
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸀ὁρᾶτε ὅτι ἐξ ἔργων δικαιοῦται ἄνθρωπος καὶ οὐκ ἐκ πίστεως μόνον.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/024.yaml
  text: You see that a man is justified by works and not by faith alone[a][b][c].
translation:
  language: fr
  text: Vous voyez qu’une personne est justifiée par les œuvres, et non par la foi seule[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « est reconnue juste » ou « est déclarée juste ». La formulation de Jacques est conservée sans trancher le débat sur son rapport avec l’emploi du verbe « justifier » chez Paul.
    reason: alternative_reading
  - marker: b
    text: Le mot grec traduit par « foi » peut aussi exprimer la confiance ou la fidélité ; « foi » reste ici la traduction principale.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁρᾶτε
  choice: Vous voyez
  rationale: Le présent de l’indicatif, à la deuxième personne du pluriel, interpelle directement les destinataires en tirant la conclusion de l’exemple précédent. « Vous voyez » est naturel et conserve la valeur indicative.
- source_word: ἐξ ἔργων
  choice: par les œuvres
  rationale: Avec le génitif, ἐξ indique ici le fondement ou le moyen. « Par les œuvres » exprime clairement cette relation en français et maintient le contraste avec « par la foi ».
- source_word: δικαιοῦται
  choice: est justifiée
  rationale: δικαιόω peut signifier « justifier », « déclarer juste » ou « reconnaître/démontrer comme juste » selon le contexte. « Est justifiée » conserve le poids lexical et théologique du terme sans trancher le débat interprétatif.
- source_word: ἄνθρωπος
  choice: une personne
  rationale: ἄνθρωπος désigne ici l’être humain de manière générique, et non spécifiquement un homme de sexe masculin. « Une personne » restitue naturellement en français moderne cette portée universelle.
- source_word: πίστεως
  choice: la foi
  rationale: « Foi » est l’équivalent courant de πίστις dans ce contexte, où elle est mise en contraste avec les œuvres. Les nuances possibles de confiance et de fidélité sont signalées en note.
- source_word: μόνον
  choice: seule
  rationale: 'L’adjectif « seule », accordé avec « foi », exprime idiomatiquement en français l’exclusivité portée par μόνον : la foi considérée isolément.'
theological_decisions:
- issue: Sens de δικαιοῦται et rapport avec la théologie de la justification
  choice: Conserver « est justifiée » dans le texte principal.
  alternative: « est reconnue comme juste », « est démontrée juste » ou « est déclarée juste »
  rationale: Le verbe grec permet une lecture déclarative ou vindicative selon le contexte. La formulation retenue préserve la tension du texte de Jacques et sa continuité lexicale avec d’autres emplois de δικαιόω, sans imposer une harmonisation avec Paul.
- issue: Portée générique de ἄνθρωπος
  choice: Traduire par « une personne ».
  alternative: « un être humain » ou, formellement, « un homme »
  rationale: Dans ce verset, le masculin singulier grec a une portée représentative et générique. Le français « une personne » rend cette portée sans donner à tort l’impression que l’affirmation ne concerne que les hommes.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proche du grec tout en étant idiomatique. « Une personne » rend naturellement la portée générique de ἄνθρωπος ; le vocabulaire théologique traditionnel « justifiée », « œuvres » et « foi seule » est maintenu.
