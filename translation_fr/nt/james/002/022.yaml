id: JAS.2.22
reference: James 2:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: βλέπεις ὅτι ἡ πίστις συνήργει τοῖς ἔργοις αὐτοῦ καὶ ἐκ τῶν ἔργων ἡ πίστις ἐτελειώθη,
base_translation:
  language: en
  yaml_path: translation/nt/james/002/022.yaml
  text: You see that faith was working together with his works[b][a], and by the works faith was brought to completion.
translation:
  language: fr
  text: Tu vois que la foi[a] agissait de concert avec ses œuvres et que, par les œuvres, la foi a été menée à son accomplissement[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « fidélité » ou « confiance ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « a été rendue parfaite » ou « a été rendue complète » ; le verbe grec peut évoquer le fait d’atteindre le terme ou la maturité prévus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: βλέπεις
  choice: Tu vois
  rationale: Le présent actif à la deuxième personne du singulier constitue une interpellation directe. « Tu vois » conserve le mouvement argumentatif de Jacques dans un français naturel.
- source_word: πίστις
  choice: la foi
  rationale: « Foi » est le sens usuel dans ce contexte et maintient le vocabulaire central de l’argument sans trancher les nuances possibles de confiance ou de fidélité.
- source_word: συνήργει
  choice: agissait de concert avec
  rationale: L’imparfait grec décrit une action en cours dans le passé, tandis que « de concert avec » restitue l’idée de coopération portée par συνεργέω sans réduire les œuvres à une simple preuve extérieure.
- source_word: τοῖς ἔργοις αὐτοῦ
  choice: avec ses œuvres
  rationale: Le datif dépend de συνεργέω et désigne les œuvres d’Abraham. « Œuvres » assure la cohérence avec le raisonnement de Jacques et son vocabulaire théologique.
- source_word: ἐκ τῶν ἔργων
  choice: par les œuvres
  rationale: Dans ce contexte, ἐκ présente les œuvres comme le moyen ou la source à partir desquels la foi atteint son accomplissement. « Par » est idiomatique en français et préserve ce rapport.
- source_word: ἐτελειώθη
  choice: a été menée à son accomplissement
  rationale: L’aoriste passif de τελειόω exprime l’atteinte d’un terme ou d’une plénitude. Cette formulation évite de suggérer automatiquement une imperfection morale antérieure tout en conservant l’idée d’achèvement.
theological_decisions:
- issue: Rapport entre la foi et les œuvres dans l’argument de Jacques
  choice: La foi agit de concert avec les œuvres et est menée à son accomplissement par elles.
  alternative: Les œuvres ne font que rendre la foi visible devant les humains ; ou les œuvres font mûrir la foi ; ou elles coopèrent avec elle comme son expression nécessaire.
  rationale: Le grec affirme à la fois une action conjointe et un accomplissement, sans exposer ici une théologie systématique complète de la justification. La traduction conserve cette tension au lieu d’imposer une explication confessionnelle.
- issue: Sens de πίστις dans un contexte théologiquement discuté
  choice: foi
  alternative: fidélité ; confiance
  rationale: « Foi » convient le mieux au fil du discours de Jacques et demeure la traduction principale la plus reconnue, tandis que les nuances lexicales possibles sont signalées en note.
translation_notes:
  register: Français moderne, international et digne. Le tutoiement singulier préserve l’adresse rhétorique directe. « Agissait de concert avec » reste accessible tout en exprimant précisément la coopération, et « menée à son accomplissement » rend l’idée d’achèvement sans surinterprétation doctrinale.
