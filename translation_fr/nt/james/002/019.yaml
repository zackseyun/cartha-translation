id: JAS.2.19
reference: James 2:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: σὺ πιστεύεις ὅτι ⸂εἷς ἐστιν ὁ θεός⸃; καλῶς ποιεῖς· καὶ τὰ δαιμόνια πιστεύουσιν καὶ φρίσσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/019.yaml
  text: You believe that God is one[a]; you do well[b]. Even the demons believe—and shudder.
translation:
  language: fr
  text: Toi, tu crois que Dieu est un[a] ; tu fais bien. Même les démons le croient — et ils frémissent[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « qu’il y a un seul Dieu ». Le grec permet les deux formulations ; « Dieu est un » suit de plus près sa tournure et peut faire écho à la confession juive de l’unicité de Dieu.'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « tremblent ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: σὺ
  choice: Toi, tu
  rationale: Le pronom grec explicite met le sujet en relief. « Toi, tu » restitue naturellement cette insistance en français sans ajouter l’idée réflexive de « toi-même ».
- source_word: πιστεύεις
  choice: crois
  rationale: Avec la proposition introduite par ὅτι, « croire » exprime naturellement l’adhésion à une affirmation. « Avoir foi » ou « faire confiance » donnerait ici une portée plus personnelle que ne l’exige la syntaxe.
- source_word: ὅτι
  choice: que
  rationale: Introduit le contenu de ce qui est cru et se rend directement par « que ».
- source_word: εἷς ἐστιν ὁ θεός
  choice: Dieu est un
  rationale: Cette formulation suit de près la structure grecque et conserve l’écho possible à la confession juive de l’unicité de Dieu. « Il y a un seul Dieu » reste une traduction possible, mais déplace légèrement l’accent vers l’existence ou le nombre.
- source_word: καλῶς ποιεῖς
  choice: tu fais bien
  rationale: Expression française concise et naturelle qui garde la brève approbation, dont la suite révèle la portée rhétorique.
- source_word: καὶ
  choice: Même
  rationale: 'Dans ce contexte, καί a une valeur ascendante : les démons eux-mêmes partagent cette croyance. « Même » rend clairement la pointe de la comparaison.'
- source_word: τὰ δαιμόνια
  choice: les démons
  rationale: Traduction directe et usuelle, moins interprétative que « les esprits mauvais ».
- source_word: πιστεύουσιν
  choice: le croient
  rationale: La reprise du verbe « croire » préserve le parallélisme avec πιστεύεις. Le pronom « le » reprend naturellement en français le contenu de la confession précédente.
- source_word: φρίσσουσιν
  choice: frémissent
  rationale: « Frémir » évoque ici une réaction physique de peur ou d’effroi et conserve la force expressive du verbe grec. « Trembler » est également possible.
theological_decisions:
- issue: Formulation de la confession monothéiste εἷς ἐστιν ὁ θεός
  choice: Dieu est un
  alternative: Il y a un seul Dieu
  rationale: Le choix retenu préserve la forme prédicative du grec et son possible écho à la confession d’Israël, sans préciser davantage que le texte la nature de cette unité.
- issue: Contraste entre la croyance humaine évoquée et celle des démons
  choice: Même les démons le croient — et ils frémissent
  alternative: Les démons aussi le croient et tremblent
  rationale: '« Même » fait ressortir la valeur ascendante de καί, tandis que le tiret met en relief la réaction des démons sans ajouter de contenu. La formulation maintient la tension du passage : l’adhésion à une affirmation vraie ne suffit pas, à elle seule, à distinguer la foi dont parle Jacques.'
translation_notes:
  register: Français international moderne, direct et digne. « Toi, tu » rend l’insistance du pronom grec ; le parallélisme de « crois / croient » est conservé. Le tiret souligne la chute rhétorique sans expliciter davantage le texte.
