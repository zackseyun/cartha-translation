  text: οὕτως λαλεῖτε καὶ οὕτως ποιεῖτε ὡς διὰ νόμου ἐλευθερίας μέλλοντες κρίνεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/012.yaml
  text: So speak and so act as those who are going to be judged through the law of freedom.
translation:
  language: fr
  text: Parlez ainsi et agissez ainsi, comme des personnes qui vont être jugées par le moyen de la loi de la liberté.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὕτως … καὶ οὕτως
  choice: ainsi … et
  rationale: 'Conserve le parallélisme exhortatif tout en adoptant un ordre naturel en français : « Parlez et agissez ainsi ».'
- source_word: λαλεῖτε … ποιεῖτε
  choice: Parlez et agissez
  rationale: Les deux présents à valeur impérative appellent une conduite habituelle, aussi bien en paroles qu’en actes.
- source_word: ὡς
  choice: comme des personnes qui
  rationale: Rend la comparaison sans ajouter une identité théologique absente du texte.
- source_word: μέλλοντες κρίνεσθαι
  choice: qui vont être jugées
  rationale: Exprime la perspective future de μέλλω et conserve le passif de κρίνεσθαι.
- source_word: διὰ νόμου ἐλευθερίας
  choice: au moyen de la loi de liberté
  rationale: « Au moyen de » garde la valeur instrumentale de διά avec le génitif, tandis que « loi de liberté » préserve la relation génitive sans l’expliciter abusivement.
theological_decisions:
- issue: Rapport entre la loi de liberté et le jugement
  choice: au moyen de la loi de liberté
  alternative: selon la loi de liberté / par la loi qui donne la liberté
  rationale: La traduction conserve l’idée instrumentale de διά et la tension entre jugement, loi et liberté, sans réduire la loi à un simple critère ni définir de quelle manière elle se rapporte à la liberté.
translation_notes:
  register: Français international moderne, direct et digne. La répétition grecque de οὕτως est légèrement resserrée pour éviter une lourdeur, sans affaiblir la portée conjointe de la parole et de l’action.
