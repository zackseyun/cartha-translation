id: JAS.2.9
reference: James 2:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἰ δὲ προσωπολημπτεῖτε, ἁμαρτίαν ἐργάζεσθε, ἐλεγχόμενοι ὑπὸ τοῦ νόμου ὡς παραβάται.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/009.yaml
  text: But if you show partiality[d][c][b][a], you commit sin and are convicted by the law as transgressors.
translation:
  language: fr
  text: Mais si vous faites preuve de favoritisme[a], vous commettez un péché et vous êtes reconnus coupables[b] par la loi en tant que transgresseurs[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « si vous faites des distinctions entre les personnes ». Le verbe grec désigne le fait de juger ou de traiter quelqu’un selon son apparence ou son rang.
    reason: lexical_alternative
  - marker: b
    text: Ou « votre faute est mise en évidence ». Le terme grec peut exprimer l’idée de dévoiler une faute, de reprendre ou d’établir la culpabilité.
    reason: lexical_alternative
  - marker: c
    text: Ou « comme des personnes qui enfreignent la loi ».
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ
  choice: Mais si
  rationale: εἰ introduit la condition, tandis que δέ marque un léger contraste avec l’argument qui précède.
- source_word: προσωπολημπτεῖτε
  choice: vous faites preuve de favoritisme
  rationale: Le verbe désigne le fait de juger ou de traiter des personnes selon leur apparence ou leur rang social. Cette formulation est naturelle en français moderne.
- source_word: ἁμαρτίαν ἐργάζεσθε
  choice: vous commettez un péché
  rationale: Littéralement « vous accomplissez un péché » ; l’expression française retenue restitue naturellement l’emploi idiomatique du verbe avec ἁμαρτίαν.
- source_word: ἐλεγχόμενοι
  choice: vous êtes reconnus coupables
  rationale: Le participe passif exprime ici l’action de mettre la faute en évidence et d’établir la culpabilité. La tournure finie coordonnée produit une phrase française fluide sans changer le rapport logique.
- source_word: ὑπὸ τοῦ νόμου
  choice: par la loi
  rationale: Le complément d’agent est conservé. La minuscule évite de préciser au-delà du grec s’il s’agit ici d’un titre formel ou d’une désignation plus générale.
- source_word: ὡς παραβάται
  choice: en tant que transgresseurs
  rationale: παραβάται désigne ceux qui franchissent une limite prescrite et violent ainsi la loi. « Transgresseurs » conserve la portée juridique et le registre biblique du terme.
theological_decisions:
- issue: Nature de la loi dans l’argument éthique de Jacques
  choice: Traduire νόμος par « la loi », sans majuscule ni précision supplémentaire.
  alternative: « la Loi » ou « la loi de Dieu »
  rationale: Le texte présente la loi comme la norme qui met en évidence le péché du favoritisme, mais il ne précise pas ici davantage sa portée. La traduction préserve cette ouverture.
- issue: Rapport entre favoritisme, péché et culpabilité
  choice: 'Maintenir les trois éléments : le favoritisme constitue un péché, la loi établit la culpabilité, et les personnes sont qualifiées de transgresseurs.'
  alternative: Réduire la proposition à « la loi vous convainc de transgression »
  rationale: La formulation retenue conserve la distinction grammaticale entre ἁμαρτίαν, l’action exprimée par ἐλεγχόμενοι et le qualificatif παραβάται.
translation_notes:
  register: Français international moderne, clair et digne. « Faire preuve de favoritisme » est idiomatique et accessible ; « transgresseurs » maintient le registre juridique et biblique du grec. La coordination des deux verbes principaux rend naturellement en français le participe grec sans effacer sa valeur passive.
