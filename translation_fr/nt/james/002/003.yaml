source:
  edition: SBLGNT
  text: ⸂ἐπιβλέψητε δὲ⸃ ἐπὶ τὸν φοροῦντα τὴν ἐσθῆτα τὴν λαμπρὰν καὶ ⸀εἴπητε· Σὺ κάθου ὧδε καλῶς, καὶ τῷ πτωχῷ εἴπητε· Σὺ στῆθι ⸂ἢ κάθου ἐκεῖ⸃ ὑπὸ τὸ ὑποπόδιόν μου,
base_translation:
  language: en
  yaml_path: translation/nt/james/002/003.yaml
  text: and if you pay attention to the one wearing the bright clothing and say[a], “You sit here in a good place,” and say to the poor man, “You stand there[b], or sit under my footstool,”
translation:
  language: fr
  text: 'et que vous accordiez votre attention à celui qui porte le vêtement éclatant[a] en lui disant : « Toi, assieds-toi ici, à une bonne place », tandis que vous dites au pauvre : « Toi, tiens-toi debout, ou assieds-toi là[b], au-dessous de mon repose-pieds »,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le vêtement somptueux » ou « le vêtement splendide ».
    reason: lexical_alternative
  - marker: b
    text: Certains manuscrits omettent « ou assieds-toi là » ; le texte imprimé conserve ces mots.
    reason: textual_variant
lexical_decisions:
- source_word: ἐπιβλέψητε
  choice: accordiez votre attention à
  rationale: Le verbe exprime ici une attention particulière accordée à la personne bien vêtue, et non un simple regard. Cette formulation reste naturelle sans expliciter prématurément l’idée de favoritisme.
- source_word: φοροῦντα
  choice: qui porte
  rationale: Dans ce contexte, le participe désigne naturellement le fait de porter un vêtement.
- source_word: ἐσθῆτα τὴν λαμπράν
  choice: le vêtement éclatant
  rationale: ἐσθής désigne un vêtement et λαμπρός peut évoquer ce qui est brillant, splendide ou somptueux. « Éclatant » conserve l’image visible et valorisante sans réduire le sens à la seule cherté.
- source_word: Σὺ κάθου ὧδε καλῶς
  choice: Toi, assieds-toi ici, à une bonne place
  rationale: L’impératif et le pronom emphatique sont conservés. « À une bonne place » exprime naturellement la position avantageuse suggérée par καλῶς et fait ressortir le contraste social.
- source_word: τῷ πτωχῷ
  choice: au pauvre
  rationale: L’adjectif substantivé masculin singulier désigne ici l’homme pauvre mis en contraste avec l’homme bien vêtu. Le français « au pauvre » est direct et naturel dans cette scène.
- source_word: στῆθι
  choice: reste debout
  rationale: Dans la situation décrite, l’ordre signifie que le pauvre doit demeurer debout plutôt que recevoir une place honorable. « Reste debout » rend ce contraste plus naturellement que le seul « tiens-toi debout ».
- source_word: ἢ κάθου ἐκεῖ
  choice: ou assieds-toi là
  rationale: La formule conserve l’ordre alternatif ainsi que la distance marquée par ἐκεῖ.
- source_word: ὑπὸ τὸ ὑποπόδιόν μου
  choice: au-dessous de mon repose-pieds
  rationale: ὑπό avec l’accusatif a ici son sens spatial de « sous, au-dessous de ». Malgré le caractère volontairement humiliant et quelque peu abrupt de l’image, cette traduction évite de l’atténuer en « près de ».
theological_decisions:
- issue: Expression de la partialité sociale
  choice: Conserver la description concrète de l’attention et des places accordées aux deux visiteurs.
  alternative: Traduire explicitement par « favoriser » ou « faire preuve de favoritisme ».
  rationale: Le contexte condamne la partialité, mais ce verset la met en scène par des paroles et des gestes. La traduction laisse cette portée théologique ressortir du contraste sans introduire ici un vocabulaire plus interprétatif.
- issue: Genre de τῷ πτωχῷ
  choice: au pauvre
  alternative: à la personne pauvre
  rationale: Le grec emploie un masculin singulier pour l’individu de la scène. La traduction conserve cette donnée sans alourdir la phrase.
translation_notes:
  register: Français international moderne, digne et oralement fluide. La répétition emphatique de « Toi » préserve l’opposition entre les deux traitements. La phrase reste liée au contexte précédent par « et que », conformément à la syntaxe grecque du passage.
