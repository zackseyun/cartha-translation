id: JAS.2.26
reference: James 2:26
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὥσπερ ⸀γὰρ τὸ σῶμα χωρὶς πνεύματος νεκρόν ἐστιν, οὕτως καὶ ἡ πίστις ⸀χωρὶς ἔργων νεκρά ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/026.yaml
  text: For just as the body without the spirit is dead[b][a], so also faith without works is dead.
translation:
  language: fr
  text: En effet, de même que le corps sans l’esprit[a] est mort, de même aussi la foi[b] sans les œuvres est morte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le souffle ». Le mot grec peut désigner l’« esprit » ou le « souffle ».
    reason: lexical_alternative
  - marker: b
    text: Ou « la confiance » ou « la fidélité ». Le mot grec possède cette gamme de sens; le texte principal retient ici « la foi ».
    reason: alternative_reading
lexical_decisions:
- source_word: ὥσπερ … οὕτως καὶ
  choice: de même que… de même aussi
  rationale: Cette tournure française rend clairement les deux membres de la comparaison et conserve la présence de καί dans le second.
- source_word: γὰρ
  choice: En effet
  rationale: Le connecteur introduit l’explication qui conclut l’argument précédent; « En effet » est naturel en français moderne.
- source_word: τὸ σῶμα
  choice: le corps
  rationale: Équivalent direct du nom grec désignant ici le corps physique.
- source_word: χωρὶς πνεύματος
  choice: sans l’esprit
  rationale: « Sans » rend directement χωρίς. « Esprit » conserve le sens anthropologique possible de πνεῦμα, tandis que « souffle » est signalé en note comme autre sens plausible.
- source_word: νεκρόν ἐστιν / νεκρά ἐστιν
  choice: est mort / est morte
  rationale: La répétition de « mort » maintient le parallélisme et la force rhétorique du grec; l’accord français suit respectivement « corps » et « foi ».
- source_word: ἡ πίστις
  choice: la foi
  rationale: « Foi » est ici l’équivalent principal et traditionnel de πίστις; les possibilités « confiance » et « fidélité » sont conservées en note sans trancher la tension lexicale.
- source_word: χωρὶς ἔργων
  choice: sans les œuvres
  rationale: « Œuvres » préserve le lien lexical et théologique avec l’ensemble du raisonnement de Jacques mieux que le terme plus général « actes ».
theological_decisions:
- issue: Sens de πνεύματος dans la comparaison
  choice: l’esprit
  alternative: le souffle
  rationale: « Esprit » respecte une valeur courante du terme grec et l’image du principe qui anime le corps. « Souffle » convient également à l’image d’un corps privé de vie et demeure donc indiqué en note.
- issue: Sens de πίστις dans Jacques 2.26
  choice: la foi
  alternative: la confiance; la fidélité
  rationale: Le texte principal garde le sens habituel « foi » dans ce passage théologiquement sensible. La note reconnaît l’étendue sémantique du grec sans imposer une interprétation particulière.
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme serré de la phrase grecque est conservé, ainsi que la répétition de « mort », avec les accords de genre exigés en français.
