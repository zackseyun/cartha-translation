source:
  edition: SBLGNT
  text: Πᾶσα δόσις ἀγαθὴ καὶ πᾶν δώρημα τέλειον ἄνωθέν ἐστιν, καταβαῖνον ἀπὸ τοῦ πατρὸς τῶν φώτων, παρ’ ᾧ οὐκ ἔνι παραλλαγὴ ἢ τροπῆς ἀποσκίασμα.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/017.yaml
  text: Every good gift and every perfect gift is from above[a], coming down from the Father of lights[b], with whom there is no variation or shadow of turning.
translation:
  language: fr
  text: Tout don excellent et tout cadeau parfait viennent d’en haut[a] ; ils descendent du Père des lumières[b], chez qui il n’y a ni variation ni ombre de variation.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Tout acte de donner qui est bon et tout cadeau parfait ». Le premier nom peut mettre l’accent sur l’acte de donner, tandis que le second désigne plus nettement ce qui est donné.'
    reason: lexical_alternative
  - marker: b
    text: 'Les « lumières » sont probablement les luminaires célestes. La fin peut aussi se traduire : « ni ombre de changement » ou « ni ombre changeante » ; elle évoque sans doute les ombres qui se déplacent avec le mouvement ou la rotation des astres.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πᾶσα δόσις ἀγαθὴ
  choice: Tout don excellent
  rationale: δόσις peut désigner l’acte de donner ou ce qui est donné. « Don » est naturel en français, tandis que « excellent » exprime ici la qualité positive de ἀγαθή sans suggérer que le donateur humain serait en vue.
- source_word: πᾶν δώρημα τέλειον
  choice: tout cadeau parfait
  rationale: 'δώρημα désigne plus nettement la chose offerte. « Cadeau » le distingue de δόσις, et « parfait » conserve la portée de τέλειον : complet, pleinement bon.'
- source_word: ἄνωθέν ἐστιν
  choice: viennent d’en haut
  rationale: « D’en haut » conserve l’expression spatiale et théologique de ἄνωθεν. Le pluriel est requis par la coordination naturelle des deux groupes nominaux en français.
- source_word: καταβαῖνον
  choice: ils descendent
  rationale: La proposition verbale rend clairement le participe présent et maintient l’image d’un mouvement continu depuis la source céleste.
- source_word: ἀπὸ τοῦ πατρὸς τῶν φώτων
  choice: du Père des lumières
  rationale: Cette formulation conserve la métaphore et le génitif du grec, probablement en référence aux luminaires célestes, sans l’expliciter dans le texte principal.
- source_word: παρ’ ᾧ οὐκ ἔνι παραλλαγὴ
  choice: chez qui il n’y a ni variation
  rationale: « Chez qui » exprime naturellement la relation indiquée par παρά. « Variation » garde la nuance de changement et son lien possible avec les phénomènes célestes.
- source_word: ἢ τροπῆς ἀποσκίασμα
  choice: ni ombre due à un changement
  rationale: Après la négation, « ni » est idiomatique. La formulation rend le rapport génitif entre τροπῆς et ἀποσκίασμα tout en conservant l’image difficile de l’ombre.
theological_decisions:
- issue: L’image du « Père des lumières » et l’absence de changement en Dieu
  choice: Conserver la métaphore céleste et l’affirmation d’absence de variation sans les transformer en énoncé doctrinal abstrait.
  alternative: Expliciter « lumières » comme les astres et paraphraser la fin par « Dieu ne change jamais ».
  rationale: Le texte oppose implicitement le Père aux lumières créées, variables et génératrices d’ombres changeantes. La traduction maintient cette tension imagée sans imposer une interprétation doctrinale plus développée.
- issue: Portée de δόσις et distinction avec δώρημα
  choice: Employer « don » puis « cadeau », avec une note sur le sens possible d’acte de donner.
  alternative: Traduire les deux substantifs par « don » ou rendre δόσις par « action de donner ».
  rationale: Le français distingue ainsi les termes grecs tout en restant naturel. La note préserve l’ambiguïté réelle de δόσις.
translation_notes:
  register: Français international actuel, digne et accessible. « Père des lumières » conserve volontairement la métaphore inhabituelle du grec. Le pluriel verbal après deux sujets coordonnés assure une syntaxe française naturelle, tandis que « ils descendent » rend explicitement le participe grec.
