  source_fidelity: La structure et l’image sont globalement bien rendues. Toutefois, « ombre due à un changement » affaiblit trop le sens concret et imagé de τροπῆς (« rotation », « mouvement/tournant ») en le réduisant à un changement abstrait. La formulation doit conserver l’ambiguïté de l’expression difficile sans en fixer indûment le rapport causal.
  naturalness: Le français est clair et actuel. « Variation » convient, mais « ombre de variation » est plus concis, plus naturel dans cette formulation solennelle et plus proche du génitif grec que « ombre due à un changement ».
