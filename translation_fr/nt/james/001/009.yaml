  text: Καυχάσθω δὲ ὁ ἀδελφὸς ὁ ταπεινὸς ἐν τῷ ὕψει αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/james/001/009.yaml
  text: But let the lowly brother boast in his exaltation[b][a],
translation:
  language: fr
  text: Mais que le frère de condition modeste[a] se glorifie de son élévation[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le frère ou la sœur de condition modeste ». Le grec emploie le masculin singulier « frère », qui peut représenter ici tout membre de la communauté croyante.
    reason: lexical_alternative
  - marker: b
    text: Ou « de sa position élevée ». L’expression peut désigner l’honneur du croyant de condition modeste devant Dieu, avec en vue un renversement présent et futur.
    reason: alternative_reading
lexical_decisions:
- source_word: Καυχάσθω
  choice: qu’il mette sa fierté
  rationale: L’impératif présent exprime une exhortation. « Mettre sa fierté » conserve l’idée de καυχάομαι tout en sonnant naturellement en français et sans suggérer nécessairement une vantardise arrogante.
- source_word: δὲ
  choice: Mais
  rationale: La conjonction marque ici une transition légèrement contrastive, qui introduit l’opposition entre la personne de condition modeste et le riche aux versets 9-10.
- source_word: ὁ ἀδελφὸς
  choice: le frère
  rationale: Le grec est au masculin singulier et désigne ici un membre de la communauté croyante. La forme du texte source est conservée, tandis qu’une note indique sa possible portée représentative.
- source_word: ὁ ταπεινὸς
  choice: de condition modeste
  rationale: Dans l’opposition avec le riche au verset 10, ταπεινός évoque surtout une condition sociale peu élevée, sans exclure les résonances d’humilité et d’abaissement. Cette formulation reste claire sans réduire le terme à la seule pauvreté.
- source_word: ἐν τῷ ὕψει αὐτοῦ
  choice: dans l’élévation qui lui est accordée
  rationale: « Élévation » préserve l’image de la hauteur et le renversement de condition. L’ajout idiomatique « qui lui est accordée » évite l’impression d’une élévation produite par l’intéressé, sans préciser explicitement l’agent ni trancher entre honneur présent et exaltation future.
theological_decisions:
- issue: Sens de l’« élévation » du croyant de condition modeste
  choice: Une dignité ou un statut élevé qui lui est accordé, avec une possible dimension présente et future
  alternative: Une promotion sociale présente seulement, un statut spirituel devant Dieu seulement, ou une exaltation eschatologique seulement
  rationale: Le contraste des versets 9-10 comporte un motif de renversement. La traduction maintient l’ampleur du terme sans limiter son sens à une seule réalisation temporelle ou doctrinale.
- issue: Portée de ἀδελφός au masculin singulier
  choice: Conserver « le frère » dans le texte et signaler en note sa possible valeur représentative
  alternative: « Le frère ou la sœur » ou « le croyant »
  rationale: Ce choix respecte le genre et le nombre grammaticaux du grec tout en informant le lecteur que le mot peut viser plus largement un membre de la communauté croyante.
translation_notes:
  register: Français international moderne, digne et accessible. « De condition modeste » rend naturellement le statut peu élevé; « mette sa fierté » conserve la force de l’exhortation sans connotation inutilement péjorative. La ponctuation finale par une virgule reflète la continuité syntaxique avec le verset 10.
