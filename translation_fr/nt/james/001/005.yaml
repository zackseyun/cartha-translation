id: JAS.1.5
reference: James 1:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Εἰ δέ τις ὑμῶν λείπεται σοφίας, αἰτείτω παρὰ τοῦ διδόντος θεοῦ πᾶσιν ἁπλῶς καὶ ⸀μὴ ὀνειδίζοντος, καὶ δοθήσεται αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/james/001/005.yaml
  text: But if any of you lacks wisdom[a], let him ask of God, who gives to all generously and without reproach[b], and it will be given to him.
translation:
  language: fr
  text: Mais si l’un de vous manque de sagesse, qu’il la demande à Dieu, qui donne à tous généreusement et sans faire de reproches, et elle lui sera donnée.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec emploie ici des formes au masculin singulier dans un sens représentatif, pour toute personne parmi les destinataires.
    reason: cultural_note
lexical_decisions:
- source_word: Εἰ δέ
  choice: Mais si
  rationale: δέ marque ici une légère transition ou un contraste avec ce qui précède; « Mais si » en conserve naturellement la force.
- source_word: τις ὑμῶν
  choice: l’un de vous
  rationale: Cette tournure rend naturellement l’indéfini τις avec le génitif partitif ὑμῶν et maintient l’adresse directe.
- source_word: λείπεται σοφίας
  choice: manque de sagesse
  rationale: Le verbe exprime ici le fait d’être dépourvu de quelque chose; cette formulation française est concise et idiomatique sans restreindre le sens de « sagesse ».
- source_word: αἰτείτω παρὰ τοῦ ... θεοῦ
  choice: qu’il la demande à Dieu
  rationale: Le subjonctif français rend naturellement l’impératif de troisième personne. Le pronom « la » explicite le référent, la sagesse, et « demander à Dieu » est l’expression française courante.
- source_word: τοῦ διδόντος θεοῦ πᾶσιν
  choice: Dieu, qui donne à tous
  rationale: La proposition relative rend clairement le participe attributif et conserve la portée large de πᾶσιν.
- source_word: ἁπλῶς
  choice: généreusement
  rationale: Dans le contexte du don divin, l’adverbe évoque surtout une libéralité entière, sans réticence; « généreusement » communique ce sens en français courant.
- source_word: μὴ ὀνειδίζοντος
  choice: sans faire de reproches
  rationale: Cette expression naturelle conserve l’idée que Dieu ne blâme ni n’humilie celui qui demande.
- source_word: δοθήσεται αὐτῷ
  choice: elle lui sera donnée
  rationale: Le futur passif est conservé, et « elle » renvoie sans ambiguïté à la sagesse, nom féminin en français.
theological_decisions:
- issue: Singulier représentatif
  choice: l’un de vous ... qu’il ... lui
  alternative: si quelqu’un parmi vous ... qu’il ... lui
  rationale: Le grec emploie un singulier générique pour toute personne du groupe. Le français « l’un de vous » garde cette structure représentative sans limiter l’énoncé aux hommes.
- issue: Sens du don de Dieu exprimé par ἁπλῶς
  choice: généreusement
  alternative: avec simplicité / sans réserve
  rationale: « Généreusement » rend le mieux, dans ce contexte, le don libre et non réticent de Dieu, sans introduire une promesse de prospérité matérielle.
- issue: Portée de la promesse
  choice: elle lui sera donnée
  alternative: Dieu la lui donnera
  rationale: Le passif grec est maintenu afin de ne pas reformuler inutilement la promesse, même si Dieu en est clairement l’agent dans le contexte.
translation_notes:
  register: Français international moderne, naturel et digne. « Sans faire de reproches » est préféré au plus abstrait « sans reproche », qui pourrait décrire le don plutôt que la manière dont Dieu accueille la demande. Le marqueur [a] est placé après l’ensemble de la formulation concernée.
