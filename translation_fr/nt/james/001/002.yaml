id: JAS.1.2
reference: James 1:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Πᾶσαν χαρὰν ἡγήσασθε, ἀδελφοί μου, ὅταν πειρασμοῖς περιπέσητε ποικίλοις,
base_translation:
  language: en
  yaml_path: translation/nt/james/001/002.yaml
  text: Consider it all joy[a], my brothers, whenever you fall into various trials[b],
translation:
  language: fr
  text: Considérez comme une joie entière, mes frères et sœurs[a], chaque fois que vous tombez dans diverses épreuves[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « mes frères » ; dans cette adresse, le terme grec désigne vraisemblablement toute la communauté croyante.'
    reason: alternative_reading
  - marker: b
    text: Le mot grec peut aussi signifier « mises à l’épreuve » ou, dans certains contextes, « tentations ». Ici, il s’agit surtout de difficultés qui mettent la foi à l’épreuve.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πᾶσαν χαρὰν
  choice: comme une joie entière
  rationale: La tournure est le complément prédicatif de ἡγήσασθε. « Une joie entière » reste proche de l’idée de totalité exprimée par πᾶσαν, sans suggérer que l’épreuve est agréable en elle-même.
- source_word: ἡγήσασθε
  choice: Considérez
  rationale: L’impératif appelle les destinataires à porter une appréciation réfléchie sur leur situation. « Considérez » est naturel, actuel et conserve cette force impérative.
- source_word: ἀδελφοί μου
  choice: mes frères et sœurs
  rationale: Dans cette adresse épistolaire au pluriel, le masculin grec peut désigner l’ensemble de la communauté croyante. La formulation inclusive explicite naturellement cette portée en français moderne.
- source_word: ὅταν
  choice: dans lesquelles
  rationale: La relation temporelle indéfinie de ὅταν avec le subjonctif est ici intégrée à une construction française fluide; l’idée de situations susceptibles de se produire demeure portée par « les épreuves dans lesquelles vous tombez ».
- source_word: πειρασμοῖς
  choice: épreuves
  rationale: Le contexte immédiat évoque des difficultés qui mettent la foi à l’épreuve, plutôt que des incitations intérieures au péché. La polysémie du terme est signalée en note.
- source_word: περιπέσητε
  choice: vous tombez
  rationale: « Tomber dans » conserve l’image vive du verbe grec et reste idiomatique en français.
- source_word: ποικίλοις
  choice: diverses
  rationale: L’adjectif exprime la variété des épreuves; « diverses » en donne une traduction concise et formellement proche.
theological_decisions:
- issue: Portée inclusive de ἀδελφοί dans l’adresse épistolaire
  choice: « mes frères et sœurs » dans le texte principal
  alternative: « mes frères », avec une note indiquant que toute la communauté est probablement visée
  rationale: Le vocatif masculin pluriel peut avoir une portée collective incluant les femmes. Le français moderne rend cette portée explicite sans introduire de distinction théologique étrangère au texte.
- issue: Nature des πειρασμοί en Jacques 1.2
  choice: « épreuves »
  alternative: « mises à l’épreuve » ou, dans d’autres contextes, « tentations »
  rationale: Les versets suivants parlent de la mise à l’épreuve de la foi, tandis que le verset 13 aborde explicitement la tentation morale. « Épreuves » respecte donc le contexte tout en laissant la gamme lexicale visible en note.
translation_notes:
  register: Français international moderne, naturel et digne. L’ordre a été légèrement réorganisé pour éviter une phrase pesante, tout en conservant l’impératif, l’image de « tomber dans » et la diversité des épreuves.
