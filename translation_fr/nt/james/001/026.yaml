id: JAS.1.26
reference: James 1:26
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Εἴ τις δοκεῖ θρησκὸς ⸀εἶναι μὴ χαλιναγωγῶν γλῶσσαν ⸀αὐτοῦ ἀλλὰ ἀπατῶν καρδίαν ⸀αὐτοῦ, τούτου μάταιος ἡ θρησκεία.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/026.yaml
  text: If anyone thinks he is religious while not bridling his tongue but deceiving his heart[c][b][a], this person's religion is worthless.
translation:
  language: fr
  text: Si quelqu’un se croit religieux[a], mais ne tient pas sa langue en bride et trompe son propre cœur, sa religion est sans valeur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « paraît religieux ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: δοκεῖ
  choice: se croit
  rationale: « Se croit » exprime ici l’évaluation que la personne porte sur elle-même. Le verbe grec peut aussi décrire l’apparence, possibilité signalée en note.
- source_word: θρησκὸς
  choice: religieux
  rationale: Ce terme conserve le lien lexical avec θρησκεία et désigne une personne qui se considère comme pratiquant la religion, sans réduire le sens à la seule piété intérieure.
- source_word: χαλιναγωγῶν
  choice: tient … en bride
  rationale: Cette formulation française préserve l’image concrète de la bride, reprise dans la discussion de la langue en Jacques 3.
- source_word: γλῶσσαν αὐτοῦ
  choice: sa langue
  rationale: La traduction littérale conserve à la fois l’organe concret, la métonymie de la parole et le lien thématique avec la suite de la lettre.
- source_word: ἀπατῶν
  choice: trompe
  rationale: « Trompe » rend directement l’idée d’égarer ou d’abuser, ici appliquée au propre cœur de la personne.
- source_word: καρδίαν αὐτοῦ
  choice: son propre cœur
  rationale: « Cœur » préserve l’expression biblique désignant l’être intérieur. « Propre » rend explicite, en français naturel, la portée réflexive du groupe possessif.
- source_word: τούτου
  choice: sa
  rationale: Le possessif français reprend naturellement la personne qui vient d’être décrite; une formulation comme « la religion de cette personne » serait plus lourde.
- source_word: μάταιος
  choice: sans valeur
  rationale: Cette expression actuelle communique clairement le caractère vain, futile et sans effet de cette religion, sans l’ambiguïté moderne possible de « vaine ».
- source_word: ἡ θρησκεία
  choice: sa religion
  rationale: « Religion » est l’équivalent direct et maintient le lien avec « religieux »; dans ce contexte, il s’agit de la pratique ou de l’expression religieuse de la personne.
theological_decisions:
- issue: Portée de δοκεῖ
  choice: se croit religieux
  alternative: paraît religieux
  rationale: Le contexte favorise l’autoévaluation illusoire, mais le grec peut aussi évoquer ce qui paraît être; cette ambiguïté est conservée par une note plutôt que tranchée silencieusement.
- issue: Sens de θρησκός et θρησκεία
  choice: religieux / religion
  alternative: pieux / piété; pratiquant / pratique religieuse
  rationale: Le choix retenu préserve la parenté lexicale grecque et la critique d’une religion professée dont la parole n’est pas maîtrisée, sans faire dire au verset que toute religion serait vaine.
- issue: Référence générique au singulier
  choice: quelqu’un … sa langue … son propre cœur … sa religion
  alternative: une personne … sa langue … son cœur … sa pratique religieuse
  rationale: « Quelqu’un » garde le singulier générique du grec et fonctionne naturellement en français sans restreindre l’application du propos aux hommes.
translation_notes:
  register: Français international moderne, clair et digne. « Tenir sa langue en bride » garde l’image vive du grec tout en restant intelligible; « sans valeur » évite le caractère parfois littéraire ou ambigu de « vain ». Le marqueur [a] figure immédiatement après l’expression concernée.
