id: JAS.1.22
reference: James 1:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Γίνεσθε δὲ ποιηταὶ λόγου καὶ μὴ ⸂ἀκροαταὶ μόνον⸃ παραλογιζόμενοι ἑαυτούς.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/022.yaml
  text: But be doers of the word[a], and not hearers only, deceiving yourselves.
translation:
  language: fr
  text: Mais mettez la parole en pratique, et ne vous contentez pas de l’écouter, en vous trompant vous-mêmes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en vous faisant illusion à vous-mêmes » ou « en raisonnant de manière à vous égarer ».
    reason: 'Alternative lexicale: παραλογιζόμενοι peut évoquer plus précisément une tromperie de soi produite par un raisonnement faux.'
lexical_decisions:
- source_word: Γίνεσθε
  choice: mettez… en pratique
  rationale: Le présent impératif appelle à une conduite suivie. Avec ποιηταὶ λόγου, cette tournure française est plus naturelle que le calque « soyez des faiseurs de la parole » et conserve pleinement la force exhortative.
- source_word: δὲ
  choice: Mais
  rationale: Marque ici un contraste avec une réception de la parole qui resterait sans mise en pratique, dans la continuité du verset précédent.
- source_word: ποιηταὶ λόγου
  choice: mettez la parole en pratique
  rationale: Rend idiomatiquement l’idée de personnes qui font ce que demande la parole, tout en conservant « la parole » pour λόγος et son lien avec Jacques 1.21.
- source_word: ἀκροαταὶ μόνον
  choice: ne vous contentez pas de l’écouter
  rationale: Exprime naturellement en français la restriction portée par μόνον et maintient l’opposition entre écouter et pratiquer.
- source_word: παραλογιζόμενοι
  choice: en vous trompant
  rationale: Le participe désigne une illusion de soi liée à un raisonnement faux. « Se tromper soi-même » est clair et naturel; la nuance argumentative est signalée en note.
- source_word: ἑαυτούς
  choice: vous-mêmes
  rationale: Rend directement le pronom réfléchi emphatique, objet du participe.
theological_decisions:
- issue: Sens de λόγος en Jacques 1.22
  choice: « la parole », comprise comme la parole reçue dont parle Jacques 1.21
  alternative: « le message » ou « l’enseignement »
  rationale: « La parole » maintient la continuité contextuelle et la portée biblique du terme sans lui imposer une définition doctrinale plus étroite.
- issue: Force de Γίνεσθε
  choice: Exhortation à une pratique durable, rendue par « mettez… en pratique »
  alternative: « devenez ceux qui mettent… en pratique »
  rationale: Le présent impératif invite à un mode de vie continu. La formulation retenue le communique naturellement sans trancher artificiellement entre valeur progressive et valeur ingressive.
- issue: Rapport du participe παραλογιζόμενοι à l’exhortation
  choice: « en vous trompant vous-mêmes », décrivant l’illusion produite par l’écoute sans pratique
  alternative: « car autrement vous vous trompez vous-mêmes »
  rationale: La construction participiale est conservée autant que le permet un français naturel, sans expliciter un lien causal que le grec laisse implicite.
translation_notes:
  register: Français international moderne, courant et digne. La tournure idiomatique « mettre la parole en pratique » évite le calque peu naturel « faiseurs de la parole » tout en préservant le contraste rhétorique entre pratique et écoute. Le marqueur [a] figure dans le texte principal.
