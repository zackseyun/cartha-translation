  text: γινώσκοντες ὅτι τὸ δοκίμιον ὑμῶν τῆς πίστεως κατεργάζεται ὑπομονήν·
base_translation:
  language: en
  yaml_path: translation/nt/james/001/003.yaml
  text: because you know that the testing of your faith produces endurance[a][b].
translation:
  language: fr
  text: car vous savez que la mise à l’épreuve[a] de votre foi produit la persévérance[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la valeur éprouvée de votre foi ». Le terme grec peut désigner soit le processus de mise à l’épreuve, soit la qualité authentique manifestée par cette épreuve.
    reason: lexical_alternative
  - marker: b
    text: Ou « endurance » ou « constance ».
    reason: lexical_alternative
lexical_decisions:
- source_word: γινώσκοντες
  choice: car vous savez
  rationale: Le participe présent, rattaché au contexte impératif du verset 2, exprime naturellement la raison pour laquelle les destinataires peuvent considérer leurs épreuves comme une joie.
- source_word: ὅτι
  choice: que
  rationale: Introduit le contenu de ce que les destinataires savent.
- source_word: τὸ δοκίμιον
  choice: la mise à l’épreuve
  rationale: Le terme peut désigner soit le processus d’épreuve, soit la qualité éprouvée qui en résulte. Le contexte immédiat favorise ici le processus, tandis qu’une note conserve l’autre possibilité.
- source_word: ὑμῶν τῆς πίστεως
  choice: de votre foi
  rationale: Le génitif indique que la foi des destinataires est soumise à l’épreuve; « foi » est ici le terme français standard et naturel.
- source_word: κατεργάζεται
  choice: produit
  rationale: Le verbe exprime l’obtention effective d’un résultat; « produit » en rend clairement la force causative.
- source_word: ὑπομονήν
  choice: la persévérance
  rationale: Le mot désigne la capacité de tenir ferme sous l’épreuve. « Persévérance » est naturel en français et souligne la continuité fidèle dans la difficulté.
theological_decisions:
- issue: Sens de πίστις
  choice: foi
  alternative: confiance; fidélité
  rationale: Dans ce contexte, il s’agit de la foi des lecteurs soumise à l’épreuve. « Foi » conserve le sens théologique large sans imposer ici la nuance de fidélité.
- issue: Ambiguïté de δοκίμιον
  choice: mise à l’épreuve
  alternative: valeur éprouvée; authenticité éprouvée
  rationale: Le déroulement de l’argument associe les épreuves à la production de la persévérance, ce qui favorise le sens processuel. L’ambiguïté lexicale réelle est néanmoins signalée en note.
translation_notes:
  register: Français international moderne, clair et digne. La tournure causale « car vous savez » maintient le lien avec le verset précédent. « Mise à l’épreuve » évite la connotation scolaire ou strictement judiciaire de certains emplois d’« épreuve » et « persévérance » est idiomatique dans ce contexte.
