id: JAS.1.4
reference: James 1:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἡ δὲ ὑπομονὴ ἔργον τέλειον ἐχέτω, ἵνα ἦτε τέλειοι καὶ ὁλόκληροι, ἐν μηδενὶ λειπόμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/004.yaml
  text: And let endurance have its perfect work[a], so that you may be mature and complete, lacking in nothing.
translation:
  language: fr
  text: Que la persévérance accomplisse pleinement son œuvre[a], afin que vous soyez mûrs et entiers, sans manquer de rien.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « accomplisse une œuvre parfaite » ; le grec emploie le même mot, sous deux formes, pour « pleinement/parfaite » et « mûrs », évoquant ce qui atteint son but ou son plein accomplissement.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπομονή
  choice: persévérance
  rationale: Le terme désigne la constance qui tient bon dans l’épreuve. « Persévérance » convient au contexte immédiat et suggère mieux une attitude active que « patience ».
- source_word: ἔργον τέλειον ἐχέτω
  choice: mène son œuvre à son plein accomplissement
  rationale: Cette formulation naturelle conserve l’image de l’« œuvre » et exprime l’idée d’un travail qui atteint son but. Elle rend aussi la valeur impérative de ἐχέτω sans produire le tour peu idiomatique « qu’elle ait une œuvre parfaite ».
- source_word: ἵνα ἦτε
  choice: afin que vous soyez
  rationale: « Afin que » exprime clairement la visée ou le résultat indiqué par ἵνα avec le subjonctif.
- source_word: τέλειοι
  choice: mûrs
  rationale: Appliqué à des personnes, le terme peut désigner celles qui sont parvenues à la maturité ou au but visé. « Mûrs » évite d’imposer au texte l’idée d’une perfection morale absolue.
- source_word: ὁλόκληροι
  choice: entiers
  rationale: Le mot souligne l’intégrité et la totalité dans toutes leurs parties. « Entiers » reste distinct de « mûrs » et prépare naturellement l’expression « sans manquer de rien ».
- source_word: ἐν μηδενὶ λειπόμενοι
  choice: sans manquer de rien
  rationale: Cette expression française courante conserve la portée exhaustive de ἐν μηδενί et l’idée de ne présenter aucune carence.
- source_word: δέ
  choice: Que…
  rationale: Le lien continuatif avec le verset précédent est rendu par l’enchaînement direct de l’exhortation; ajouter « mais » créerait un contraste trop fort, tandis que « et » alourdirait ici la phrase française isolée.
theological_decisions:
- issue: Sens de τέλειοι dans le contexte de la formation spirituelle
  choice: mûrs
  alternative: parfaits
  rationale: 'Le contexte présente l’aboutissement visé par la persévérance: une maturité et une intégrité qui ne souffrent d’aucune déficience. « Mûrs » transmet cette orientation sans trancher en faveur d’une doctrine de perfection sans péché.'
- issue: Rapport lexical entre τέλειον et τέλειοι
  choice: plein accomplissement / mûrs
  alternative: œuvre parfaite / parfaits
  rationale: La traduction française privilégie le sens contextuel de l’achèvement tout en signalant en note que le grec emploie des mots apparentés. Elle conserve ainsi la tension entre accomplissement, maturité et perfection sans rendre la phrase artificielle.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase garde l’image de l’œuvre tout en évitant un calque peu naturel. « Persévérance », « mûrs » et « entiers » sont courants et rendent distinctement les trois idées grecques de constance, d’aboutissement et d’intégrité.
