  source_fidelity: 'Le sens général est juste : ὑπομονή est bien rendu par « persévérance », et la finalité introduite par ἵνα, ainsi que la triade « mûrs », « entiers », « sans manquer de rien », sont préservées. Toutefois, « mène son œuvre à son plein accomplissement » est plus lourd et redondant que nécessaire pour ἔργον τέλειον ἐχέτω. « Accomplisse pleinement son œuvre » rend naturellement l’impératif et l’idée d’une œuvre menée à son terme.'
  naturalness: La révision proposée est plus idiomatique en français international moderne. « Mûrs et entiers » demeure une association compréhensible, digne et suffisamment distincte pour rendre τέλειοι et ὁλόκληροι.
  terminology: '« Persévérance », « mûrs », « entiers » et « sans manquer de rien » conviennent. La note doit cependant parler du même mot grec sous deux formes, et non de « mots apparentés » : τέλειον et τέλειοι sont des formes du même adjectif.'
  issues:
