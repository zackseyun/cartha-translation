  - severity: medium
    issue: Description lexicale imprécise dans la note
    rationale: 'τέλειον (« parfaite/achevée ») et τέλειοι (« mûrs/parfaits ») ne sont pas simplement des mots apparentés : ce sont deux formes du même adjectif grec. La note doit le dire exactement.'
  revised_text: Que la persévérance accomplisse pleinement son œuvre[a], afin que vous soyez mûrs et entiers, sans manquer de rien.
