reference: James 1:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: βουληθεὶς ἀπεκύησεν ἡμᾶς λόγῳ ἀληθείας, εἰς τὸ εἶναι ἡμᾶς ἀπαρχήν τινα τῶν αὐτοῦ κτισμάτων.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/018.yaml
  text: Having willed it[a], he gave birth to us by the word of truth[b], so that we might be a kind of firstfruits of his creatures.
translation:
  language: fr
  text: De sa propre volonté[a], il nous a donné naissance par la parole de vérité, afin que nous soyons en quelque sorte les prémices de tout ce qu’il a créé[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Parce qu’il l’a voulu, il nous a donné naissance par la parole de vérité. »'
    reason: alternative_reading
  - marker: b
    text: Les « prémices » étaient la première part d’une récolte, mise à part et offerte à Dieu. Ici, l’image présente les croyants comme une première part consacrée parmi tout ce que Dieu a créé.
    reason: cultural_note
lexical_decisions:
- source_word: βουληθεὶς
  choice: Parce qu’il l’a voulu
  rationale: Le participe aoriste exprime ici vraisemblablement la volonté de Dieu comme motif antérieur de l’action principale. Cette formulation française rend naturellement la valeur causale probable sans y intégrer un système doctrinal particulier.
- source_word: ἀπεκύησεν
  choice: il nous a donné naissance
  rationale: Le verbe évoque l’accouchement ou la mise au monde. Cette traduction conserve l’image de la naissance et son écho avec Jacques 1.15, où le désir donne naissance au péché.
- source_word: λόγῳ ἀληθείας
  choice: par la parole de vérité
  rationale: 'Le datif a une valeur instrumentale : la parole de vérité est le moyen par lequel Dieu donne naissance. L’expression préserve la formulation biblique sans expliciter davantage la nature de cette parole que ne le fait le verset.'
- source_word: εἰς τὸ εἶναι ἡμᾶς
  choice: afin que nous soyons
  rationale: La construction εἰς avec l’infinitif substantivé exprime le but ou le résultat visé. « Afin que » en conserve nettement la portée finale.
- source_word: ἀπαρχήν τινα
  choice: en quelque sorte les prémices
  rationale: « Prémices » garde la métaphore cultuelle et agricole de la première part consacrée d’une récolte, tandis que « en quelque sorte » rend la nuance qualificative de τινα.
- source_word: τῶν αὐτοῦ κτισμάτων
  choice: de tout ce qu’il a créé
  rationale: κτίσματα désigne les êtres ou les choses créés. Cette formulation française garde la portée large du grec et évite que « créatures » soit compris comme visant uniquement les êtres vivants.
theological_decisions:
- issue: L’initiative divine dans la nouvelle naissance
  choice: La volonté de Dieu est présentée comme la cause de l’action par laquelle il nous donne naissance.
  alternative: « De sa propre volonté, il nous a fait naître »
  rationale: Le grec place clairement la volonté divine avant l’action principale, mais ne développe pas ici une doctrine complète de la prédestination ou de la régénération. La traduction maintient cette initiative sans dépasser le texte.
- issue: La portée de κτισμάτων
  choice: « tout ce qu’il a créé » conserve une référence large à l’ensemble des réalités créées.
  alternative: « ses créatures » ou « les êtres humains qu’il a créés »
  rationale: Le grec n’impose pas de limiter le terme à l’humanité. La formulation retenue laisse ouverte la portée exacte de la comparaison avec les prémices.
translation_notes:
  register: Français international moderne, naturel et digne. L’image concrète de la naissance est conservée, de même que la métaphore biblique des « prémices ». Le marqueur de la note culturelle est placé après l’expression qu’elle explique.
