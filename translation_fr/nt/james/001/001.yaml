id: JAS.1.1
reference: James 1:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἰάκωβος θεοῦ καὶ κυρίου Ἰησοῦ Χριστοῦ δοῦλος ταῖς δώδεκα φυλαῖς ταῖς ἐν τῇ διασπορᾷ χαίρειν.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/001.yaml
  text: 'James[a], a servant of God and of the Lord Jesus the Messiah[c][b], to the twelve tribes in the Dispersion: greetings.'
translation:
  language: fr
  text: 'Jacques, esclave[a] de Dieu et du Seigneur Jésus, le Messie[b], aux douze tribus qui sont dans la diaspora[c] : salutations !'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « serviteur ». Le grec désigne une personne qui appartient à un maître ; « esclave » en conserve ici le sens le plus fort.
    reason: lexical_alternative
  - marker: b
    text: Ou « le Christ ». Le titre grec Χριστός peut être traduit par « Messie » ou, dans un emploi devenu plus proche d’un nom, par « Christ ».
    reason: alternative_reading
  - marker: c
    text: La « diaspora » désigne une dispersion. Dans l’usage juif, le terme s’appliquait notamment aux communautés vivant hors de la terre d’Israël, parmi les nations. L’expression ne tranche pas à elle seule l’identité précise des destinataires de la lettre.
    reason: cultural_note
lexical_decisions:
- source_word: Ἰάκωβος
  choice: Jacques
  rationale: « Jacques » est la forme française traditionnelle et immédiatement reconnaissable pour l’auteur de cette lettre, bien que le nom grec corresponde historiquement à « Jacob ».
- source_word: θεοῦ
  choice: Dieu
  rationale: 'Le génitif marque ici l’appartenance : Jacques est esclave de Dieu.'
- source_word: κυρίου
  choice: Seigneur
  rationale: Dans ce titre appliqué à Jésus, « Seigneur » conserve à la fois l’idée d’autorité et l’usage néotestamentaire établi.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jésus, le Messie
  rationale: « Messie » traduit le sens titulaire de Χριστός, tandis que l’article ajouté en français rend le titre de manière idiomatique sans prétendre reproduire un article grec.
- source_word: δοῦλος
  choice: esclave
  rationale: Le terme grec désigne une personne appartenant à un maître. « Esclave » en conserve la force, ici pertinente dans une déclaration d’appartenance totale à Dieu et au Seigneur Jésus.
- source_word: ταῖς δώδεκα φυλαῖς
  choice: aux douze tribus
  rationale: Traduction directe qui préserve le langage identitaire et biblique d’Israël sans préciser à tort si son emploi est strictement ethnique ou élargi.
- source_word: διασπορᾷ
  choice: diaspora
  rationale: « Diaspora » est un terme français moderne et courant qui garde le sens semi-technique de communautés dispersées hors de leur terre d’origine.
- source_word: χαίρειν
  choice: salut !
  rationale: L’infinitif grec est une formule épistolaire conventionnelle. « Salut ! » en restitue brièvement la fonction, plutôt que son sens étymologique « réjouissez-vous ».
theological_decisions:
- issue: Valeur de Χριστοῦ dans l’identification de Jésus
  choice: le Messie
  alternative: le Christ
  rationale: Le mot demeure un titre porteur de sens dans ce contexte. « Le Messie » en explicite la valeur sans réduire Χριστός à un simple second nom.
- issue: Force de δοῦλος dans l’auto-identification de Jacques
  choice: esclave
  alternative: serviteur
  rationale: « Esclave » préserve l’idée centrale d’appartenance à un maître; une note signale « serviteur », plus traditionnel mais moins fort.
- issue: Identité des « douze tribus »
  choice: préserver l’expression sans l’expliciter
  alternative: identifier explicitement les destinataires soit au peuple juif, soit à l’Église
  rationale: Le grec emploie le langage des douze tribus, mais le verset seul ne tranche pas toutes les questions relatives à l’identité précise des destinataires. La traduction maintient cette tension.
translation_notes:
  register: Français international moderne, sobre et digne. La structure brève de l’adresse grecque est conservée. « Salut ! » rend la formule d’ouverture sans alourdir la phrase; « diaspora » est aujourd’hui plus naturel en français que « Dispersion » employé comme nom propre.
