id: JAS.1.12
reference: James 1:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Μακάριος ἀνὴρ ὃς ὑπομένει πειρασμόν, ὅτι δόκιμος γενόμενος λήμψεται τὸν στέφανον τῆς ζωῆς, ὃν ⸀ἐπηγγείλατο τοῖς ἀγαπῶσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/012.yaml
  text: Blessed is the man who endures trial[a], because after he has been approved, he will receive the crown of life[b], which he promised to those who love him.
translation:
  language: fr
  text: Heureux l’homme qui tient bon dans l’épreuve[a], car, après avoir fait ses preuves, il recevra la couronne de la vie[b], que Dieu a promise à ceux qui l’aiment.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans la tentation » ou « dans la mise à l’épreuve » ; le mot grec peut désigner aussi bien une épreuve qu’une tentation, mais le contexte souligne ici la persévérance sous l’épreuve.
    reason: lexical_alternative
  - marker: b
    text: Le mot grec traduit par « couronne » peut désigner la couronne, souvent faite de feuillage, remise au vainqueur, et pas nécessairement une couronne royale.
    reason: cultural_note
lexical_decisions:
- source_word: Μακάριος
  choice: Heureux
  rationale: « Heureux » est la formulation naturelle et consacrée des béatitudes en français; elle exprime une condition favorable accordée par Dieu plutôt qu’un simple sentiment passager.
- source_word: ἀνὴρ
  choice: l’homme
  rationale: Le nom grec est masculin singulier et employé ici de manière représentative. « L’homme » en conserve la forme sans exclure la portée générale de l’énoncé.
- source_word: ὑπομένει
  choice: tient bon dans
  rationale: Cette expression française actuelle rend la persévérance ferme sous la pression, de façon plus naturelle ici que le verbe transitif « endurer ».
- source_word: πειρασμόν
  choice: l’épreuve
  rationale: Le contexte immédiat met l’accent sur la résistance, la mise à l’épreuve et l’approbation qui en résulte. Une note maintient toutefois la possibilité lexicale de la tentation.
- source_word: δόκιμος γενόμενος
  choice: une fois reconnu digne
  rationale: La tournure exprime le résultat positif d’une mise à l’épreuve et conserve la valeur temporelle du participe, sans préciser au-delà du grec la nature exacte de cette approbation.
- source_word: λήμψεται
  choice: il recevra
  rationale: Rend directement le futur de λαμβάνω et présente la couronne comme un don promis.
- source_word: στέφανον
  choice: la couronne
  rationale: « Couronne » est la traduction française établie; une note précise qu’il peut s’agir de la couronne honorifique du vainqueur plutôt que d’un diadème royal.
- source_word: τῆς ζωῆς
  choice: de la vie
  rationale: La formulation conserve le génitif grec et son ouverture sémantique, sans décider s’il s’agit d’une couronne constituée par la vie ou associée à celle-ci.
- source_word: ἐπηγγείλατο
  choice: Dieu a promise
  rationale: Le verbe a pour sujet implicite Dieu. Le nommer en français évite un pronom masculin sans antécédent explicite dans le verset; le passé composé rend naturellement l’aoriste et l’accord féminin suit « couronne ».
- source_word: τοῖς ἀγαπῶσιν αὐτόν
  choice: à ceux qui l’aiment
  rationale: Le datif désigne les bénéficiaires de la promesse, et le présent exprime leur amour caractéristique pour Dieu.
theological_decisions:
- issue: Portée de πειρασμός en Jacques 1.12
  choice: épreuve
  alternative: tentation ou mise à l’épreuve
  rationale: L’endurance et le fait d’être reconnu digne favorisent ici le sens d’épreuve subie. La note préserve néanmoins la gamme sémantique du terme grec, particulièrement pertinente dans le contexte de Jacques 1.
- issue: Sujet implicite de ἐπηγγείλατο
  choice: Dieu
  alternative: il
  rationale: Le grec laisse le sujet sous-entendu, mais celui-ci est naturellement Dieu dans la formule de promesse. L’explicitation est nécessaire pour un français clair et n’ajoute pas de distinction doctrinale.
- issue: Sens du génitif τῆς ζωῆς
  choice: de la vie
  alternative: qui est la vie ou qui donne la vie
  rationale: La traduction formelle du génitif préserve l’ambiguïté entre apposition, contenu et association, plutôt que de trancher théologiquement.
translation_notes:
  register: Français international moderne, digne et accessible. « Heureux » conserve la forme d’une béatitude; « tient bon » apporte une expression courante sans relâcher le registre. Les deux notes préservent respectivement l’ambiguïté de πειρασμός et l’arrière-plan culturel de στέφανος.
