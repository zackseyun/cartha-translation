id: JAS.1.23
reference: James 1:23
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὅτι εἴ τις ἀκροατὴς λόγου ἐστὶν καὶ οὐ ποιητής, οὗτος ἔοικεν ἀνδρὶ κατανοοῦντι τὸ πρόσωπον τῆς γενέσεως αὐτοῦ ἐν ἐσόπτρῳ,
base_translation:
  language: en
  yaml_path: translation/nt/james/001/023.yaml
  text: For if anyone is a hearer of the word and not a doer, this one is like a man carefully looking at the face of his birth[a] in a mirror,
translation:
  language: fr
  text: En effet, si quelqu’un écoute la parole sans la mettre en pratique, il ressemble à un homme qui observe attentivement son visage naturel[a] dans un miroir,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « le visage de sa naissance », c’est-à-dire son visage naturel.
    reason: La tournure grecque est inhabituelle; la note en préserve la formulation littérale tout en en indiquant le sens contextuel.
lexical_decisions:
- source_word: ἀκροατὴς λόγου … καὶ οὐ ποιητής
  choice: écoute la parole sans la mettre en pratique
  rationale: Cette formulation française naturelle conserve nettement l’opposition éthique entre entendre la parole et agir conformément à elle, sans recourir aux substantifs peu idiomatiques « auditeur » et « faiseur ».
- source_word: λόγου
  choice: la parole
  rationale: « La parole » rend directement λόγος et maintient le lien avec le contexte immédiat de Jacques, où il s’agit de la parole reçue et proclamée.
- source_word: ἔοικεν
  choice: il ressemble à
  rationale: Le parfait grec a ici un sens présent; « il ressemble à » exprime naturellement la comparaison.
- source_word: ἀνδρὶ
  choice: un homme
  rationale: Le grec emploie le nom spécifiquement masculin ἀνήρ; le français en conserve la forme masculine dans cette comparaison représentative.
- source_word: κατανοοῦντι
  choice: qui observe attentivement
  rationale: κατανοέω indique une observation soutenue ou attentive, davantage qu’un simple regard.
- source_word: τὸ πρόσωπον τῆς γενέσεως αὐτοῦ
  choice: le visage qu’il a de naissance
  rationale: Cette formulation reste proche du génitif grec littéral tout en étant intelligible et naturelle en français; elle désigne le visage naturel de l’homme.
- source_word: ἐν ἐσόπτρῳ
  choice: dans un miroir
  rationale: C’est l’équivalent français moderne et courant de ἔσοπτρον.
theological_decisions:
- issue: Langage représentatif masculin dans ἀνδρὶ
  choice: un homme
  alternative: une personne
  rationale: Puisque le texte grec emploie ἀνήρ, terme spécifiquement masculin, la traduction garde « un homme » sans empêcher que l’application de la comparaison soit comprise comme générale.
translation_notes:
  register: Français international moderne, clair et digne. La structure « écoute… sans la mettre en pratique » privilégie l’usage idiomatique tout en maintenant l’opposition centrale entre écoute et action. La virgule finale conserve la continuité syntaxique avec le verset suivant.
