  variant: modern international French
source:
  edition: SBLGNT
  text: ἕκαστος δὲ πειράζεται ὑπὸ τῆς ἰδίας ἐπιθυμίας ἐξελκόμενος καὶ δελεαζόμενος·
base_translation:
  language: en
  yaml_path: translation/nt/james/001/014.yaml
  text: But each one is tempted by his own desire[b][a], being drawn away and enticed.
translation:
  language: fr
  text: Mais chacun est tenté par son propre désir[a], qui l’attire et l’appâte[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sa propre convoitise » ou « son propre désir ardent ». Le terme grec peut désigner un désir intense en général, et pas seulement un désir sexuel.
    reason: lexical_alternative
  - marker: b
    text: Les deux verbes évoquent l’image de quelqu’un que l’on attire hors de sa position et que l’on appâte, comme une proie ou un poisson attiré dans un piège.
    reason: cultural_note
lexical_decisions:
- source_word: ἕκαστος
  choice: chacun
  rationale: « Chacun » conserve la portée distributive du singulier grec et son insistance sur la responsabilité individuelle, tout en étant naturel en français.
- source_word: δὲ
  choice: Mais
  rationale: '« Mais » marque le contraste modéré avec le verset précédent : Dieu ne tente personne; la tentation est ici rapportée au désir propre de chacun.'
- source_word: πειράζεται
  choice: est tenté
  rationale: Dans ce contexte, le verbe désigne l’incitation au mal plutôt qu’une simple mise à l’épreuve, comme le confirment les versets 13 et 15.
- source_word: ὑπὸ τῆς ἰδίας ἐπιθυμίας
  choice: par son propre désir
  rationale: La tournure exprime ce qui exerce la tentation. « Son propre » souligne que ce désir appartient à la personne concernée, tandis que « désir » garde l’étendue sémantique du grec sans la limiter au domaine sexuel.
- source_word: ἐξελκόμενος
  choice: qui l’entraîne
  rationale: Le participe évoque l’action de tirer quelqu’un hors de sa position ou de l’attirer au loin. La relative avec « l’entraîne » rend clairement en français que le désir agit sur la personne, sans alourdir la phrase.
- source_word: καὶ δελεαζόμενος
  choice: et le séduit
  rationale: Le verbe grec évoque l’appât qui attire une proie. « Séduit » exprime naturellement l’attrait trompeur en français; une note conserve l’image concrète du piège et de l’appât.
theological_decisions:
- issue: Source de la tentation par rapport à Dieu
  choice: La tentation est attribuée au désir propre de chacun, et non à Dieu.
  alternative: Comprendre le verset comme parlant seulement d’une épreuve provoquée par des circonstances extérieures.
  rationale: Le contexte immédiat nie que Dieu tente qui que ce soit, puis présente le désir personnel comme ce qui attire et séduit. La formulation maintient ce contraste sans développer une théorie de la causalité que le verset n’énonce pas.
- issue: Genre du singulier représentatif
  choice: Employer « chacun » avec « son propre désir » et le pronom objet « l’ », formes génériques naturelles en français.
  alternative: Recourir à un pluriel tel que « les gens sont tentés par leurs propres désirs ».
  rationale: Le grec individualise chaque personne au singulier. Le français permet de conserver cette force sans attribuer explicitement un sexe à la personne visée.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase reste proche de la structure grecque tout en remplaçant les participes passifs, peu naturels ici en français, par une relative active dont le sujet est « désir ». Les notes préservent l’étendue de ἐπιθυμία et l’imagerie de la chasse ou de la pêche.
