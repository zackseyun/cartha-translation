id: JAS.1.15
reference: James 1:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἶτα ἡ ἐπιθυμία συλλαβοῦσα τίκτει ἁμαρτίαν, ἡ δὲ ἁμαρτία ἀποτελεσθεῖσα ἀποκύει θάνατον.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/015.yaml
  text: Then desire[a], after it has conceived, gives birth to sin; and sin, when it is fully grown[b], brings forth death.
translation:
  language: fr
  text: Puis le désir, après avoir conçu[a], donne naissance au péché ; et le péché, une fois arrivé à maturité[b], donne naissance à la mort.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ayant conçu ». Le participe grec rattache étroitement au désir l’image de la conception.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « une fois arrivé à son terme » ou « une fois pleinement développé ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶτα
  choice: Puis
  rationale: Marque naturellement la nouvelle étape de la progression décrite depuis la tentation jusqu’à la mort.
- source_word: ἐπιθυμία
  choice: le désir
  rationale: « Désir » garde la portée générale du terme grec dans ce contexte. « Convoitise » serait possible, mais ajoute d’emblée une qualification morale plus explicite et peut rétrécir le sens.
- source_word: συλλαβοῦσα
  choice: après avoir conçu
  rationale: Rend l’antériorité du participe aoriste par rapport au verbe principal et maintient clairement l’image de la conception.
- source_word: τίκτει
  choice: donne naissance au
  rationale: Expression française actuelle et transparente qui conserve l’image de l’accouchement.
- source_word: ἁμαρτίαν
  choice: péché
  rationale: Équivalent français direct et habituel du terme grec désignant ici le mal moral issu du désir.
- source_word: δὲ
  choice: et
  rationale: La conjonction poursuit ici la séquence plutôt qu’elle n’introduit une forte opposition.
- source_word: ἀποτελεσθεῖσα
  choice: une fois arrivé à maturité
  rationale: Exprime l’idée d’un processus mené à son terme tout en s’accordant avec le développement organique de l’image.
- source_word: ἀποκύει
  choice: enfante
  rationale: Préserve avec force et concision la métaphore de la naissance, tout en évitant de répéter « donne naissance ».
- source_word: θάνατον
  choice: la mort
  rationale: Traduction directe qui conserve l’expression absolue et non précisée du texte grec.
theological_decisions:
- issue: Nature de l’image reliant le désir, le péché et la mort
  choice: Conserver la personnification et l’enchaînement conception-naissance-maturité-enfantement.
  alternative: 'Paraphraser : « le désir mène au péché, et le péché mène à la mort ».'
  rationale: Une simple formulation causale effacerait l’image organique et sa force rhétorique.
- issue: Portée de θάνατος
  choice: Traduire simplement par « la mort ».
  alternative: Préciser « la mort spirituelle » ou « la mort éternelle ».
  rationale: Le grec ne précise pas la nature de la mort ; la traduction doit préserver cette ampleur et cette tension sans introduire une interprétation doctrinale.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation conserve l’image saisissante de la conception, de la naissance et de la maturation sans expliciter au-delà du grec la nature de la mort.
