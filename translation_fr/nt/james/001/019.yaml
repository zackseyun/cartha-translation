id: JAS.1.19
reference: James 1:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸀Ἴστε, ἀδελφοί μου ἀγαπητοί. ἔστω ⸀δὲ πᾶς ἄνθρωπος ταχὺς εἰς τὸ ἀκοῦσαι, βραδὺς εἰς τὸ λαλῆσαι, βραδὺς εἰς ὀργήν,
base_translation:
  language: en
  yaml_path: translation/nt/james/001/019.yaml
  text: 'Know this[a], my beloved brothers: let every man be quick to hear, slow to speak, slow to anger[c][b],'
translation:
  language: fr
  text: 'Sachez-le[a], mes frères bien-aimés[b] : que chacun[c] soit prompt à écouter, lent à parler, lent à la colère.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Vous le savez ». La forme grecque peut être comprise comme un impératif ou comme un indicatif.'
    reason: alternative_reading
  - marker: b
    text: Le grec dit « frères »; dans ce type d’adresse, le terme peut englober les frères et les sœurs de la communauté croyante.
    reason: inclusive_scope
  - marker: c
    text: 'Littéralement : « tout être humain »; on peut aussi traduire « tout homme » ou « toute personne ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἴστε
  choice: Sachez-le
  rationale: La forme peut être comprise comme un impératif (« sachez ») ou comme un indicatif (« vous savez »). L’impératif convient au mouvement exhortatif du passage; le pronom « le » reprend de manière idiomatique l’enseignement qui suit.
- source_word: ἀδελφοί μου ἀγαπητοί
  choice: mes frères bien-aimés
  rationale: « Frères » rend directement le masculin pluriel ἀδελφοί, qui peut désigner ici l’ensemble de la communauté croyante; « bien-aimés » conserve la chaleur et la dignité de ἀγαπητοί.
- source_word: ἔστω δὲ πᾶς ἄνθρωπος
  choice: que chacun soit
  rationale: Le subjonctif exhortatif français rend naturellement l’impératif grec de troisième personne. « Chacun » exprime la portée distributive et générique de πᾶς ἄνθρωπος sans suggérer que l’exhortation ne viserait que les hommes.
- source_word: ταχὺς εἰς τὸ ἀκοῦσαι
  choice: prompt à écouter
  rationale: « Prompt à écouter » rend l’idée de disponibilité immédiate à l’écoute dans un français actuel, concis et digne.
- source_word: βραδὺς εἰς τὸ λαλῆσαι
  choice: lent à parler
  rationale: Traduction directe et idiomatique qui préserve le parallélisme de l’exhortation.
- source_word: βραδὺς εἰς ὀργήν
  choice: lent à la colère
  rationale: Cette formulation concise conserve le parallélisme grec et désigne une disposition qui ne s’emporte pas rapidement.
theological_decisions:
- issue: 'Valeur de Ἴστε : impératif ou indicatif'
  choice: 'Impératif : « Sachez-le »'
  alternative: 'Indicatif : « Vous le savez »'
  rationale: Les deux analyses grammaticales sont possibles. L’impératif s’accorde bien avec les exhortations qui suivent, mais l’indicatif demeure une lecture réelle et est signalé en note.
- issue: Portée de l’appellation ἀδελφοί
  choice: Conserver « frères » dans le texte
  alternative: « frères et sœurs »
  rationale: Le grec emploie le masculin pluriel « frères », probablement avec une portée communautaire incluant les croyantes. Le texte conserve la forme source et la note explicite sa portée vraisemblable.
- issue: Portée générique de πᾶς ἄνθρωπος
  choice: « chacun »
  alternative: « tout homme » ou « toute personne »
  rationale: Dans ce contexte, ἄνθρωπος a une portée générique. « Chacun » transmet précisément l’application individuelle et universelle de l’exhortation en français moderne.
translation_notes:
  register: Français international moderne, sobre et exhortatif. Le parallélisme ternaire est conservé (« prompt… lent… lent… »), avec un vocabulaire digne mais immédiatement compréhensible.
