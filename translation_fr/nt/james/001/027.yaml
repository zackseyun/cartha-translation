id: JAS.1.27
reference: James 1:27
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: θρησκεία καθαρὰ καὶ ἀμίαντος παρὰ ⸀τῷ θεῷ καὶ πατρὶ αὕτη ἐστίν, ἐπισκέπτεσθαι ὀρφανοὺς καὶ χήρας ἐν τῇ θλίψει αὐτῶν, ἄσπιλον ἑαυτὸν τηρεῖν ἀπὸ τοῦ κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/027.yaml
  text: 'Religion that is pure and undefiled before God the Father is this: to care for orphans and widows in their affliction[b][a], and to keep oneself unstained from the world.'
translation:
  language: fr
  text: La religion pure et sans souillure devant Dieu le Père consiste à prendre soin des orphelins et des veuves dans leur détresse[a], et à se garder sans tache du monde[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « visiter les orphelins et les veuves dans leur détresse » ; le verbe grec peut désigner à la fois le fait de leur rendre visite et celui de veiller concrètement sur eux.
    reason: lexical_alternative
  - marker: b
    text: Ici, « le monde » désigne l’ordre moral corrompu opposé à Dieu, et non la création elle-même.
    reason: cultural_note
lexical_decisions:
- source_word: θρησκεία
  choice: la religion
  rationale: Le terme désigne ici la pratique religieuse ou la piété dans sa manifestation concrète. « Religion » conserve cette portée et s’accorde avec l’opposition du contexte entre pratique vaine et pratique authentique.
- source_word: καθαρὰ καὶ ἀμίαντος
  choice: pure et sans souillure
  rationale: Cette formulation préserve le double qualificatif grec ainsi que ses connotations morales et cultuelles, dans un français actuel et digne.
- source_word: παρὰ τῷ θεῷ καὶ πατρὶ
  choice: devant Dieu le Père
  rationale: παρά avec le datif exprime ici le jugement ou le regard de Dieu. L’article unique favorise la lecture appositionnelle « Dieu le Père », sans qu’il soit nécessaire d’ajouter « notre », absent du texte grec.
- source_word: ἐπισκέπτεσθαι
  choice: prendre soin de
  rationale: Dans ce contexte de vulnérabilité, le verbe implique une attention concrète et secourable, et non une simple visite sociale. La nuance littérale « visiter » est signalée en note.
- source_word: ὀρφανοὺς καὶ χήρας
  choice: les orphelins et les veuves
  rationale: Équivalents directs, naturels et traditionnels de deux catégories particulièrement vulnérables dans le monde biblique.
- source_word: ἐν τῇ θλίψει αὐτῶν
  choice: dans leur détresse
  rationale: « Détresse » rend la gravité de θλῖψις tout en étant plus naturel en français contemporain que « affliction » dans ce contexte.
- source_word: ἄσπιλον ἑαυτὸν τηρεῖν
  choice: se garder sans tache
  rationale: La tournure conserve l’image d’une préservation vigilante contre la contamination morale. Le pronom réfléchi français exprime naturellement la portée générale de ἑαυτόν.
- source_word: ἀπὸ τοῦ κόσμου
  choice: du monde
  rationale: Le texte garde volontairement le terme κόσμος sans explicitation interprétative dans le corps du verset; une note précise sa portée éthique contextuelle.
theological_decisions:
- issue: Sens éthique de κόσμος
  choice: Conserver « le monde » dans le texte, avec une note indiquant l’ordre moral corrompu opposé à Dieu.
  alternative: « la corruption du monde » ou « l’ordre présent opposé à Dieu »
  rationale: L’explicitation dans le texte principal réduirait l’ambiguïté et pourrait faire croire que la création ou toute société humaine est en elle-même visée. La traduction maintient la tension théologique du grec.
- issue: Relation entre θεῷ et πατρὶ
  choice: « Dieu le Père »
  alternative: « Dieu et Père »
  rationale: L’article unique et la construction permettent de comprendre πατρί comme une désignation appositionnelle du même référent. « Dieu le Père » est clair et naturel, sans introduire le possessif « notre », qui manque dans le grec.
- issue: Portée générale de ἑαυτόν
  choice: Employer la construction générique « se garder ».
  alternative: « que chacun se garde » ou une formulation masculine explicite
  rationale: L’infinitif énonce une exigence générale; la forme pronominale française transmet cette portée sans limiter le propos aux hommes.
translation_notes:
  register: Français international moderne, sobre et digne. « Consiste à » rend naturellement la construction explicative αὕτη ἐστίν suivie de deux infinitifs. Les deux notes sont appelées dans le texte, dans leur ordre d’apparition.
