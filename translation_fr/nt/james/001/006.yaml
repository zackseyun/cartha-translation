id: JAS.1.6
reference: James 1:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: αἰτείτω δὲ ἐν πίστει, μηδὲν διακρινόμενος, ὁ γὰρ διακρινόμενος ἔοικεν κλύδωνι θαλάσσης ἀνεμιζομένῳ καὶ ῥιπιζομένῳ·
base_translation:
  language: en
  yaml_path: translation/nt/james/001/006.yaml
  text: But let him ask in faith[a], doubting nothing, for the one who doubts is like a wave of the sea, driven by the wind and tossed about.
translation:
  language: fr
  text: Mais qu’il demande avec foi[a], sans douter aucunement, car celui qui doute ressemble à une vague de la mer, poussée par le vent et ballottée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avec confiance ». Dans ce contexte, le mot grec traduit par « foi » peut aussi exprimer une confiance entière en Dieu.
    reason: lexical_alternative
lexical_decisions:
- source_word: αἰτείτω
  choice: qu’il demande
  rationale: L’impératif présent à la troisième personne exprime une exhortation continue ou générale. « Qu’il demande » en conserve naturellement la force en français et reprend la demande de sagesse du verset précédent.
- source_word: δὲ
  choice: Mais
  rationale: 'La particule marque ici une légère opposition ou une précision par rapport à la promesse du verset précédent : Dieu donne, mais la demande doit être faite avec foi.'
- source_word: ἐν πίστει
  choice: avec foi
  rationale: « Avec foi » est plus idiomatique en français que le calque « dans la foi », tout en conservant le sens de confiance placée en Dieu. La nuance « avec confiance » est signalée en note.
- source_word: μηδὲν διακρινόμενος
  choice: sans douter en rien
  rationale: Dans ce contexte, διακρίνομαι désigne l’hésitation intérieure ou le doute. « En rien » rend explicitement μηδέν sans atténuer la formulation grecque.
- source_word: ὁ γὰρ διακρινόμενος
  choice: car celui qui doute
  rationale: Le participe substantivé désigne de manière générale toute personne qui doute. Le masculin générique français suit l’antécédent « il » sans ajouter de restriction proprement masculine.
- source_word: ἔοικεν
  choice: ressemble à
  rationale: Cette formulation rend directement la comparaison et convient à un registre moderne et digne.
- source_word: κλύδωνι θαλάσσης
  choice: une vague de la mer
  rationale: κλύδων évoque une vague ou une houle agitée. « Une vague de la mer » garde l’image concrète sans archaïsme.
- source_word: ἀνεμιζομένῳ
  choice: poussée par le vent
  rationale: Le participe passif exprime l’action du vent sur la vague. Cette traduction est claire et fidèle à l’image.
- source_word: ῥιπιζομένῳ
  choice: ballottée
  rationale: Le second participe accentue l’agitation et l’instabilité de la vague. « Ballottée » restitue cette idée de mouvement subi sans préciser une direction absente du grec.
theological_decisions:
- issue: Sens de πίστις dans le contexte de la prière
  choice: foi
  alternative: confiance
  rationale: Le terme πίστις conserve ici sa portée théologique habituelle tout en désignant concrètement une confiance assurée en Dieu. Le texte principal retient « foi » et la note préserve la nuance contextuelle « confiance ».
- issue: Portée de διακρινόμενος
  choice: celui qui doute
  alternative: celui qui hésite / celui qui est partagé
  rationale: Dans ce contexte, le contraste avec la foi et l’image de la vague favorisent le sens de doute ou d’hésitation intérieure. La traduction n’explicite pas davantage la nature de ce conflit afin de préserver l’amplitude du grec.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe exhortative « qu’il demande » conserve la force de l’impératif grec. L’image maritime reste concrète et fluide, sans vocabulaire archaïque.
