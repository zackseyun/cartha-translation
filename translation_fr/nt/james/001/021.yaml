source:
  edition: SBLGNT
  text: διὸ ἀποθέμενοι πᾶσαν ῥυπαρίαν καὶ περισσείαν κακίας ἐν πραΰτητι δέξασθε τὸν ἔμφυτον λόγον τὸν δυνάμενον σῶσαι τὰς ψυχὰς ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/021.yaml
  text: Therefore, having put away all filthiness and the overflow of wickedness, receive with meekness the implanted word, which is able to save your souls.
translation:
  language: fr
  text: C’est pourquoi, débarrassez-vous de toute souillure et de tout débordement de méchanceté[a], et accueillez avec douceur[b] la parole implantée[c], qui peut sauver vos âmes[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de toute abondance de mal » ou « de tout excès de malveillance ».
    reason: lexical_alternative
  - marker: b
    text: Ou « dans l’humilité ».
    reason: lexical_alternative
  - marker: c
    text: 'Ou « la parole innée » ; traditionnellement : « la parole greffée ».'
    reason: lexical_alternative
  - marker: d
    text: Ou « vos vies » ou « vous-mêmes ».
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: C’est pourquoi
  rationale: Marque naturellement en français la conséquence tirée de l’exhortation précédente.
- source_word: ἀποθέμενοι
  choice: débarrassez-vous
  rationale: Le participe aoriste accompagne l’impératif principal. La coordination de deux impératifs est plus naturelle en français tout en conservant l’action préalable ou concomitante consistant à rejeter ce qui souille.
- source_word: πᾶσαν ῥυπαρίαν
  choice: toute souillure
  rationale: « Souillure » garde l’image concrète de la saleté et son emploi moral, dans un registre actuel et digne.
- source_word: περισσείαν κακίας
  choice: tout débordement de méchanceté
  rationale: « Débordement » préserve l’idée d’excès portée par περισσεία, tandis que « méchanceté » rend κακία sans la limiter à la seule malveillance interpersonnelle.
- source_word: ἐν πραΰτητι
  choice: avec douceur
  rationale: Exprime une disposition douce, humble et réceptive. « Douceur » est plus naturel en français moderne que « mansuétude », sans effacer la nuance d’humilité.
- source_word: δέξασθε
  choice: accueillez
  rationale: Rend l’impératif comme une réception volontaire et favorable; le verbe convient particulièrement à une parole reçue intérieurement.
- source_word: τὸν ἔμφυτον λόγον
  choice: la parole implantée en vous
  rationale: « Implantée » conserve l’image de quelque chose placé et enraciné au-dedans. « En vous » explicite en français la valeur contextuelle de l’adjectif sans préciser qui l’a implantée ni par quel moyen.
- source_word: τὸν δυνάμενον σῶσαι
  choice: qui peut sauver
  rationale: Rend simplement la capacité exprimée par le participe, sans préciser le mécanisme du salut.
- source_word: τὰς ψυχὰς ὑμῶν
  choice: votre âme
  rationale: Le singulier distributif français est naturel après l’adresse plurielle et garde le vocabulaire traditionnel de ψυχή dans ce contexte de salut, tout en laissant ouvertes les nuances de vie et de personne.
theological_decisions:
- issue: Sens de ψυχὰς ὑμῶν dans un contexte de salut
  choice: votre âme
  alternative: votre vie ; vous-mêmes
  rationale: « Âme » préserve la portée théologique traditionnelle sans réduire ψυχή à la seule vie physique. La note signale que le grec peut aussi désigner la vie ou la personne entière.
- issue: Sens de ἔμφυτον λόγον
  choice: la parole implantée en vous
  alternative: la parole innée ; la parole greffée
  rationale: Cette formulation conserve l’idée d’une parole désormais intérieure et enracinée, sans trancher la manière dont elle y a été placée ni identifier plus précisément la « parole ».
translation_notes:
  register: Français international moderne, clair et digne. La phrase évite le calque lourd « ayant rejeté » en coordonnant les exhortations. Les images fortes de souillure, de débordement et d’implantation sont maintenues; les variantes sémantiques importantes figurent en notes.
