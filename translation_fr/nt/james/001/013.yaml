id: JAS.1.13
reference: James 1:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: μηδεὶς πειραζόμενος λεγέτω ὅτι Ἀπὸ θεοῦ πειράζομαι· ὁ γὰρ θεὸς ἀπείραστός ἐστιν κακῶν, πειράζει δὲ αὐτὸς οὐδένα.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/013.yaml
  text: Let no one who is being tempted say[a], “I am being tempted by God,” for God is untemptable by evil, and he himself tempts no one.
translation:
  language: fr
  text: 'Que personne, lorsqu’il est tenté, ne dise : « C’est Dieu qui me tente. » Car Dieu ne peut être tenté par le mal[a], et lui-même ne tente personne.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, selon une autre compréhension de cette expression grecque rare : « Dieu est sans expérience du mal. »'
    reason: ambiguïté lexicale de ἀπείραστός et de la construction avec κακῶν
lexical_decisions:
- source_word: μηδεὶς … λεγέτω
  choice: Que personne … ne dise
  rationale: Cette tournure française rend naturellement l’interdiction exprimée par le pronom négatif et l’impératif grec.
- source_word: πειραζόμενος
  choice: lorsqu’il est tenté
  rationale: Le participe présent passif situe la parole dans la situation de tentation; le contexte immédiat, qui évoque le mauvais désir et le péché, favorise « tenter » plutôt que « mettre à l’épreuve ».
- source_word: Ἀπὸ θεοῦ πειράζομαι
  choice: C’est Dieu qui me tente
  rationale: Cette formulation idiomatique exprime clairement Dieu comme source ou agent supposé de la tentation, tout en évitant le français peu naturel « je suis tenté de la part de Dieu ».
- source_word: ἀπείραστός ἐστιν κακῶν
  choice: Dieu ne peut être tenté par le mal
  rationale: L’adjectif grec rare désigne ici l’absence de toute susceptibilité à la tentation face au mal. Une note conserve l’ambiguïté lexicale d’une autre compréhension possible.
- source_word: πειράζει
  choice: tente
  rationale: Dans ce contexte moral, le verbe désigne l’incitation au mal, non la mise à l’épreuve au sens plus large.
- source_word: αὐτὸς οὐδένα
  choice: lui-même ne tente personne
  rationale: « Lui-même » maintient l’emphase du pronom grec, et « personne » rend directement l’objet négatif.
theological_decisions:
- issue: Sens de πειράζω dans ce verset
  choice: Employer « tenter » dans toutes ses occurrences.
  alternative: Employer « éprouver » ou « mettre à l’épreuve » dans une ou plusieurs occurrences.
  rationale: Le contexte des versets suivants porte sur le désir qui entraîne au péché. « Tenter » rend donc le sens moral visé ici sans nier que Dieu puisse mettre à l’épreuve dans un autre sens ailleurs.
- issue: Sens de ἀπείραστός ἐστιν κακῶν
  choice: « Dieu ne peut être tenté par le mal »
  alternative: « Dieu est sans expérience du mal »
  rationale: Le premier sens s’accorde le mieux avec la proposition suivante, selon laquelle Dieu ne tente personne. La rareté du terme et l’ambiguïté réelle de la construction sont néanmoins signalées en note.
translation_notes:
  register: Français international moderne, naturel et digne. La construction emphatique « C’est Dieu qui me tente » restitue idiomatiquement Ἀπὸ θεοῦ, tandis que « lui-même » conserve l’insistance du grec. Le marqueur [a] figure dans le texte principal.
