revisions:
- from: Mais celui qui s’est penché attentivement sur la loi parfaite, celle de la liberté[a], et qui y demeure — non pas en devenant un auditeur qui oublie, mais quelqu’un qui met en œuvre[b] — celui-là sera heureux dans ce qu’il fait.
  to: Mais celui qui se penche attentivement sur la loi parfaite, celle de la liberté[a], et qui y demeure — qui ne devient pas un auditeur oublieux, mais qui agit[b] — celui-là sera heureux dans ce qu’il fait.
  rationale: La révision corrige l’ellipse de « met en œuvre » et rétablit une antithèse syntaxiquement parallèle, tout en conservant l’imagerie attentive de παρακύψας, l’apposition non interprétative relative à la liberté et le lien entre l’action et la félicité finale. Les ancres de notes sont placées sur les expressions auxquelles elles se rapportent.
