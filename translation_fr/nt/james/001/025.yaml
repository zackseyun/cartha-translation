id: JAS.1.25
reference: James 1:25
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ δὲ παρακύψας εἰς νόμον τέλειον τὸν τῆς ἐλευθερίας καὶ παραμείνας, ⸀οὐκ ἀκροατὴς ἐπιλησμονῆς γενόμενος ἀλλὰ ποιητὴς ἔργου, οὗτος μακάριος ἐν τῇ ποιήσει αὐτοῦ ἔσται.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/025.yaml
  text: But the one who has looked intently into the perfect law[a], the law of freedom[c][b], and has continued in it—not becoming a forgetful hearer but a doer of the work—this one will be blessed in his doing.
translation:
  language: fr
  text: Mais celui qui se penche attentivement sur la loi parfaite, celle de la liberté[a], et qui y demeure — qui ne devient pas un auditeur oublieux, mais qui agit[b] — celui-là sera heureux dans ce qu’il fait.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « la loi parfaite de la liberté ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « un faiseur d’œuvre » ; ou : « quelqu’un qui fait une œuvre ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακύψας
  choice: s’est penché attentivement sur
  rationale: Le verbe évoque le fait de se pencher pour regarder de près. Cette formulation garde l’image et l’attention soutenue sans suggérer un simple regard.
- source_word: νόμον τέλειον τὸν τῆς ἐλευθερίας
  choice: la loi parfaite, celle de la liberté
  rationale: « Celle de la liberté » conserve l’apposition grecque et évite d’interpréter la loi comme étant uniquement une loi qui procure la liberté.
- source_word: παραμείνας
  choice: qui y demeure
  rationale: Le verbe exprime la persistance auprès de cette loi; le présent français rend naturellement cette continuité dans la construction de la phrase.
- source_word: οὐκ ἀκροατὴς ἐπιλησμονῆς γενόμενος
  choice: non pas en devenant un auditeur qui oublie
  rationale: Cette tournure restitue idiomatiquement le génitif grec inhabituel tout en gardant le contraste avec la mise en pratique.
- source_word: ποιητὴς ἔργου
  choice: quelqu’un qui met en œuvre
  rationale: La formule grecque signifie littéralement « faiseur d’œuvre/d’action ». « Mettre en œuvre » conserve en français le champ lexical de l’œuvre et exprime une action effective sans substituer ici « parole » à ἔργον.
- source_word: μακάριος
  choice: heureux
  rationale: Dans cette déclaration de félicité, « heureux » est le rendu français naturel et traditionnel de μακάριος; il ne réduit pas nécessairement le terme à une émotion passagère.
- source_word: ἐν τῇ ποιήσει αὐτοῦ
  choice: dans ce qu’il fait
  rationale: Cette expression rend naturellement la « mise en pratique » ou l’« action » désignée par ποίησις et maintient le lien avec la personne qui agit.
- source_word: ὁ ... οὗτος
  choice: celui qui… celui-là
  rationale: La construction française conserve la reprise emphatique du grec et la valeur représentative du masculin singulier.
theological_decisions:
- issue: Sens de « loi de la liberté »
  choice: celle de la liberté
  alternative: la loi qui donne la liberté
  rationale: Le génitif grec ne précise pas à lui seul si la loi produit la liberté, se caractérise par elle ou appartient à sa sphère. La formulation retenue préserve cette richesse sans identifier explicitement la loi à l’Évangile ou à une catégorie doctrinale particulière.
- issue: Portée générique du masculin singulier
  choice: celui qui… celui-là
  alternative: quiconque… cette personne
  rationale: Le masculin singulier est générique dans le contexte. La formulation garde le nombre et la structure représentative du grec, conformément à l’usage français naturel.
- issue: Nature de la bénédiction
  choice: sera heureux dans ce qu’il fait
  alternative: sera béni dans son activité
  rationale: La formulation conserve la déclaration de félicité et son lien avec l’action, sans préciser le mécanisme théologique ni faire de l’œuvre le fondement explicite du salut.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la structure contrastive et la reprise emphatique du grec. « Se pencher attentivement » garde l’image concrète de παρακύπτω; « mettre en œuvre » évite une littéralité maladroite tout en maintenant la distinction entre écouter et agir.
