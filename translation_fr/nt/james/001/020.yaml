id: JAS.1.20
reference: James 1:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὀργὴ γὰρ ἀνδρὸς δικαιοσύνην θεοῦ ⸂οὐκ ἐργάζεται⸃.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/020.yaml
  text: For a man's anger does not produce God's righteousness.
translation:
  language: fr
  text: Car la colère humaine ne produit pas la justice de Dieu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὀργὴ ... ἀνδρός
  choice: la colère humaine
  rationale: Cette formulation naturelle rend la colère propre à l’être humain sans limiter indûment le propos aux hommes de sexe masculin.
- source_word: δικαιοσύνην θεοῦ
  choice: la justice de Dieu
  rationale: Le génitif est conservé afin de ne pas trancher entre la justice qui caractérise Dieu, celle qu’il exige ou celle qu’il produit.
- source_word: οὐκ ἐργάζεται
  choice: n’accomplit pas
  rationale: Le verbe ἐργάζομαι peut exprimer le fait d’opérer, de produire ou d’accomplir. « N’accomplit pas » convient au complément « la justice » et conserve l’idée que la colère humaine ne réalise pas ce qui relève de la justice divine.
theological_decisions:
- issue: Sens du génitif dans δικαιοσύνην θεοῦ
  choice: la justice de Dieu
  alternative: la justice voulue par Dieu / ce qui est juste aux yeux de Dieu
  rationale: La traduction littérale préserve l’ambiguïté réelle du grec au lieu de réduire l’expression à la seule conduite que Dieu demande.
translation_notes:
  register: Français international moderne, concis et digne. « Car » maintient le lien explicatif marqué par γάρ avec le verset précédent.
