id: JAS.1.10
reference: James 1:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ δὲ πλούσιος ἐν τῇ ταπεινώσει αὐτοῦ, ὅτι ὡς ἄνθος χόρτου παρελεύσεται.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/010.yaml
  text: and the rich man in his humiliation[b][a], because like a flower of grass he will pass away.
translation:
  language: fr
  text: et le riche dans son abaissement[a], car il passera comme la fleur de l’herbe[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sous-entendu d’après le verset précédent : « mais que le riche mette sa fierté dans son abaissement ».'
    reason: alternative_reading
  - marker: b
    text: 'Littéralement : « la fleur de l’herbe »; l’image souligne que le riche disparaît aussi vite que la végétation en fleur.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ πλούσιος
  choice: et le riche
  rationale: δέ relie ce membre à l’exhortation parallèle du verset précédent. « Et » maintient cette continuité sans accentuer excessivement l’opposition; πλούσιος, employé substantivement au masculin singulier, est rendu par « le riche ».
- source_word: ἐν τῇ ταπεινώσει αὐτοῦ
  choice: dans son abaissement
  rationale: ταπείνωσις désigne ici le fait d’être abaissé ou ramené à une condition basse. « Abaissement » conserve à la fois la perte de statut et le mouvement de renversement, sans réduire le terme à la vertu intérieure d’humilité.
- source_word: ὅτι
  choice: car
  rationale: ὅτι introduit la raison de l’exhortation implicite. « Car » exprime clairement ce rapport causal dans un registre français digne et naturel.
- source_word: ὡς ἄνθος χόρτου
  choice: comme la fleur de l’herbe
  rationale: 'Cette formulation conserve l’image grecque et son écho scripturaire: la végétation fleurit brièvement avant de disparaître. Elle évite d’ajouter l’idée de « champ », absente du texte.'
- source_word: παρελεύσεται
  choice: il passera
  rationale: Dans ce contexte, le futur de παρέρχομαι évoque la disparition et le caractère éphémère du riche. « Il passera » garde la sobriété de l’image sans préciser au-delà du grec s’il s’agit surtout de la mort, de la richesse ou du statut.
theological_decisions:
- issue: Ellipse dépendant du verset précédent
  choice: Le texte principal laisse sous-entendu le verbe d’exhortation repris du verset 9.
  alternative: 'Expliciter: « que le riche mette sa fierté dans son abaissement » ou « que le riche se glorifie de son abaissement ».'
  rationale: Le grec du verset 10 ne répète pas l’impératif du verset 9. Maintenir l’ellipse respecte la forme du texte source et laisse la note expliciter le lien syntaxique.
- issue: Sens de l’« abaissement » du riche
  choice: L’expression évoque le fait que le riche est abaissé, à la lumière du caractère passager de sa vie et de sa situation.
  alternative: Comprendre ταπείνωσις comme une humilité volontaire ou seulement comme une condition sociale modeste.
  rationale: La proposition causale qui suit met l’accent sur la fragilité et la disparition du riche. La traduction préserve toutefois l’étendue sémantique du mot sans imposer une construction doctrinale particulière.
translation_notes:
  register: Français international moderne, sobre et digne. L’ordre et l’ellipse du grec sont conservés, tandis que « car » rend naturellement le lien causal. L’image inhabituelle de « la fleur de l’herbe » est maintenue et expliquée en note.
