  text: κατενόησεν γὰρ ἑαυτὸν καὶ ἀπελήλυθεν καὶ εὐθέως ἐπελάθετο ὁποῖος ἦν.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/024.yaml
  text: For he looked at himself and went away[a], and immediately forgot what kind of person he was.
translation:
  language: fr
  text: Car il s’est regardé, puis il est parti et a aussitôt oublié quel genre de personne il était.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατενόησεν
  choice: s’est regardé
  rationale: Dans l’image du miroir, cette formulation naturelle exprime le fait de porter son regard sur soi, tout en laissant entendre l’attention impliquée par κατανοέω.
- source_word: γὰρ
  choice: Car
  rationale: La conjonction introduit l’explication de la comparaison formulée au verset précédent.
- source_word: ἑαυτὸν
  choice: se
  rationale: Le pronom réfléchi signifie directement « lui-même » ; en français, « se regarder » rend naturellement l’action sans répéter le visage mentionné dans le contexte.
- source_word: ἀπελήλυθεν
  choice: puis il est parti
  rationale: Le passé composé convient au récit en français moderne. « Puis » rend clairement la succession des actions, tandis que « est parti » exprime simplement l’éloignement.
- source_word: εὐθέως
  choice: aussitôt
  rationale: « Aussitôt » conserve pleinement l’idée d’immédiateté et souligne le contraste entre le regard et l’oubli.
- source_word: ἐπελάθετο
  choice: a oublié
  rationale: 'Cette expression directe et idiomatique rend le sens courant du verbe : ne plus se souvenir.'
- source_word: ὁποῖος ἦν
  choice: quel genre de personne il était
  rationale: ὁποῖος porte sur la qualité ou la sorte. Cette formulation préserve ce sens et indique que l’exemple concerne une personne de manière générique.
theological_decisions:
- issue: Valeur générique du masculin dans l’image du miroir
  choice: quel genre de personne il était
  alternative: quel genre d’homme il était
  rationale: Bien que le grec emploie le masculin singulier, l’exemple est représentatif de toute personne. « Personne » transmet cette portée générique sans ajouter une restriction masculine.
translation_notes:
  register: 'Français international moderne, naturel et digne. La coordination reste fluide tout en conservant la progression rapide : regard, départ, oubli immédiat.'
