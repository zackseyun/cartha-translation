id: JAS.1.7
reference: James 1:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: μὴ γὰρ οἰέσθω ὁ ἄνθρωπος ἐκεῖνος ὅτι λήμψεταί τι παρὰ τοῦ κυρίου
base_translation:
  language: en
  yaml_path: translation/nt/james/001/007.yaml
  text: For that man must not suppose that he will receive anything from the Lord,[a]
translation:
  language: fr
  text: Car que cet homme ne s’imagine pas qu’il recevra quoi que ce soit du Seigneur.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « cette personne ». Le grec est au masculin singulier (« cet homme »), mais il désigne de manière représentative l’individu qui doute, décrit au verset précédent.
    reason: Alternative lexicale et clarification de la portée représentative du masculin singulier.
lexical_decisions:
- source_word: μὴ γὰρ
  choice: Car ... ne doit pas
  rationale: γάρ établit le lien explicatif avec le verset précédent; « Car » le conserve. μή avec l’impératif exprime ici une défense, rendue naturellement par « ne doit pas ».
- source_word: οἰέσθω
  choice: s’imaginer
  rationale: Le verbe signifie « penser, supposer, s’imaginer ». « S’imaginer » exprime clairement la conviction infondée visée par l’avertissement, sans le réduire à la seule idée d’attente.
- source_word: ὁ ἄνθρωπος ἐκεῖνος
  choice: cet homme
  rationale: Cette formulation conserve le masculin singulier du grec et renvoie directement à l’individu qui doute, décrit au verset précédent. Sa portée représentative est précisée en note.
- source_word: ὅτι
  choice: que
  rationale: Introduit naturellement en français le contenu de ce que cet homme ne doit pas s’imaginer.
- source_word: λήμψεταί
  choice: il recevra
  rationale: Le futur de λαμβάνω est rendu directement par « il recevra », formulation naturelle et digne dans ce contexte.
- source_word: τι
  choice: quoi que ce soit
  rationale: Dans la portée de la négation, τι a un sens non spécifique et global; « quoi que ce soit » restitue nettement cette force.
- source_word: παρὰ τοῦ κυρίου
  choice: du Seigneur
  rationale: παρά avec le génitif indique la source. « Du Seigneur » traduit le titre sans préciser davantage son référent.
theological_decisions:
- issue: Référent de τοῦ κυρίου
  choice: le Seigneur
  alternative: Dieu; le Seigneur Dieu
  rationale: Le grec emploie κύριος sans identification supplémentaire. Conserver « le Seigneur » respecte l’indétermination du texte et évite une explicitation théologique importée.
- issue: Genre de ὁ ἄνθρωπος ἐκεῖνος
  choice: cet homme
  alternative: cette personne; celui-là
  rationale: Le syntagme grec est au masculin singulier. « Cet homme » en préserve la forme, tandis qu’une note indique que cet individu représente toute personne qui doute de la manière décrite auparavant.
translation_notes:
  register: Français international moderne, clair et digne. La structure explicative est maintenue par « Car »; « quoi que ce soit » restitue avec naturel la portée générale de τι sous la négation.
