id: JAS.1.16
reference: James 1:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: μὴ πλανᾶσθε, ἀδελφοί μου ἀγαπητοί.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/016.yaml
  text: Do not be deceived[a], my beloved brothers.
translation:
  language: fr
  text: Ne vous laissez pas tromper, mes frères bien-aimés.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « mes frères et sœurs bien-aimés » : le mot grec traduit par « frères » peut désigner collectivement les croyants, femmes comprises.'
    reason: Alternative lexicale et clarification de la portée collective.
lexical_decisions:
- source_word: μὴ πλανᾶσθε
  choice: Ne vous égarez pas
  rationale: Le présent impératif avec μή exprime ici une mise en garde. Le verbe πλανάω, à cette forme moyenne/passive, peut signifier « s’égarer », « se laisser tromper » ou « être induit en erreur ». « Ne vous égarez pas » est naturel en français et conserve l’ambiguïté entre erreur de jugement et égarement, sans imposer un agent extérieur.
- source_word: ἀδελφοί
  choice: frères
  rationale: Le vocatif pluriel signifie littéralement « frères » et sert ici à interpeller affectueusement les membres de la communauté croyante. Le sens collectif pouvant inclure des femmes est précisé en note.
- source_word: μου
  choice: mes
  rationale: Le possessif marque la proximité personnelle et pastorale de l’auteur avec ses destinataires.
- source_word: ἀγαπητοί
  choice: bien-aimés
  rationale: « Bien-aimés » restitue la chaleur affective de ἀγαπητοί dans un registre digne et biblique qui demeure compréhensible en français moderne.
theological_decisions:
- issue: Portée genrée de l’adresse à la communauté chrétienne
  choice: Employer « frères » dans le texte et préciser en note sa portée collective possible.
  alternative: « frères et sœurs »
  rationale: Le grec emploie un masculin pluriel qui peut désigner collectivement une assemblée mixte. Cette solution préserve la forme du texte source tout en rendant son référent probable explicite dans la note.
- issue: Nature de l’égarement visé
  choice: Conserver avec « Ne vous égarez pas » une formulation pouvant évoquer aussi bien l’erreur que le fait d’être trompé.
  alternative: « Ne vous laissez pas tromper »
  rationale: La forme πλανᾶσθε permet une lecture moyenne ou passive. Le contexte met en garde contre une conception erronée de la source de la tentation, mais le texte ne nomme aucun trompeur; il convient donc de ne pas résoudre davantage cette tension.
translation_notes:
  register: Français international moderne, naturel et digne. L’ordre « mes frères bien-aimés » conserve l’affection du vocatif grec sans lourdeur. « Ne vous égarez pas » est une exhortation concise et idiomatique.
