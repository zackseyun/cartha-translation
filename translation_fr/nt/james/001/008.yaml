id: JAS.1.8
reference: James 1:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀνὴρ δίψυχος, ἀκατάστατος ἐν πάσαις ταῖς ὁδοῖς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/008.yaml
  text: a double-minded man[a], unstable in all his ways.
translation:
  language: fr
  text: un homme partagé[a], instable dans toutes ses voies.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une personne partagée, instable dans toute sa conduite ». Le grec est au masculin singulier, mais a vraisemblablement ici une valeur représentative.
    reason: Alternative lexicale et clarification de la portée générique du masculin grec.
lexical_decisions:
- source_word: ἀνὴρ
  choice: un homme
  rationale: Le nom grec est au masculin singulier et reprend de manière représentative la personne qui demande au verset précédent. « Un homme » conserve cette forme sans limiter le propos aux seuls hommes, ce que précise la note.
- source_word: δίψυχος
  choice: partagé
  rationale: L’adjectif rare évoque littéralement quelqu’un qui a « deux âmes ». En français actuel, « partagé » exprime naturellement la division intérieure et l’hésitation entre deux orientations, sans la lourdeur de « à l’âme double ».
- source_word: ἀκατάστατος
  choice: instable
  rationale: « Instable » rend directement l’idée d’inconstance et de manque de fermeté. « Agité » ou « désordonné » orienteraient davantage le sens vers l’émotion ou le désordre social.
- source_word: ἐν πάσαις ταῖς ὁδοῖς αὐτοῦ
  choice: dans toutes ses voies
  rationale: L’expression conserve l’image biblique des voies pour désigner l’ensemble de la conduite et des orientations d’une personne. Elle reste intelligible et digne en français moderne.
theological_decisions:
- issue: Langage masculin à valeur représentative
  choice: Maintenir « un homme » dans le texte principal
  alternative: « une personne partagée, instable dans toute sa conduite »
  rationale: Le grec emploie le masculin singulier, mais sa portée est vraisemblablement générale. Le texte principal en préserve la forme, tandis que la note explicite que l’énoncé concerne toute personne placée dans cette situation.
- issue: Nature de la division exprimée par δίψυχος
  choice: Employer « partagé » sans préciser l’objet de la division
  alternative: « partagé entre deux loyautés » ou « irrésolu »
  rationale: Le terme suggère une division intérieure, mais le verset ne formule pas explicitement les deux orientations en cause. La traduction préserve cette ouverture au lieu d’imposer une interprétation théologique particulière.
translation_notes:
  register: Français international moderne, naturel et digne. « Partagé » est idiomatique sans être familier; « voies » conserve l’image du grec et le registre biblique. La formulation demeure un fragment syntaxique, conformément au texte source et à son lien avec le verset précédent.
