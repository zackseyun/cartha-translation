id: JAS.1.11
reference: James 1:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀνέτειλεν γὰρ ὁ ἥλιος σὺν τῷ καύσωνι καὶ ἐξήρανεν τὸν χόρτον, καὶ τὸ ἄνθος αὐτοῦ ἐξέπεσεν καὶ ἡ εὐπρέπεια τοῦ προσώπου αὐτοῦ ἀπώλετο· οὕτως καὶ ὁ πλούσιος ἐν ταῖς πορείαις αὐτοῦ μαρανθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/011.yaml
  text: For the sun rose with its scorching heat and dried up the grass[a], and its flower fell off and the beauty of its appearance perished[b]; so also the rich man will wither away in the midst of his pursuits.
translation:
  language: fr
  text: Car le soleil s’est levé avec sa chaleur brûlante[a] et a desséché l’herbe ; sa fleur est tombée et la beauté de son aspect a disparu. De même, le riche se flétrira au cours de ses activités[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avec le vent brûlant ». Le grec καύσων peut désigner une chaleur ardente et, dans certains contextes, le vent chaud qui l’accompagne.
    reason: lexical_alternative
  - marker: b
    text: Ou « au cours de ses voyages ». Le grec peut désigner des voyages au sens propre ou, plus largement, les activités et les entreprises d’une personne.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέτειλεν
  choice: s’est levé
  rationale: Le passé composé rend naturellement en français moderne l’aoriste de cette illustration saisissante, tout en conservant l’image du lever du soleil.
- source_word: σὺν τῷ καύσωνι
  choice: avec sa chaleur brûlante
  rationale: καύσων désigne une chaleur ardente et peut aussi évoquer le vent chaud qui l’accompagne. Le possessif relie naturellement cette chaleur au soleil, sujet de la phrase.
- source_word: ἐξήρανεν τὸν χόρτον
  choice: a desséché l’herbe
  rationale: « Dessécher » exprime concrètement l’effet de la chaleur sur la végétation et correspond au sens causatif de ξηραίνω.
- source_word: τὸ ἄνθος αὐτοῦ ἐξέπεσεν
  choice: sa fleur est tombée
  rationale: Cette formulation simple conserve l’image physique de la fleur qui tombe, portée par ἐκπίπτω.
- source_word: ἡ εὐπρέπεια τοῦ προσώπου αὐτοῦ
  choice: la beauté de son aspect
  rationale: « Aspect » rend ici πρόσωπον sans imposer à la plante un « visage » peu naturel en français ; « beauté » traduit clairement εὐπρέπεια.
- source_word: ἀπώλετο
  choice: a disparu
  rationale: Dans ce contexte, la forme exprime la perte ou la disparition de la beauté. « A disparu » est naturel et ne suggère pas nécessairement une destruction extérieure.
- source_word: ὁ πλούσιος
  choice: le riche
  rationale: L’adjectif substantivé français correspond directement au grec et garde le singulier masculin représentatif sans ajouter le nom « homme ».
- source_word: ἐν ταῖς πορείαις αὐτοῦ
  choice: au cours de ses activités
  rationale: πορεία peut désigner des déplacements au sens propre ou, plus largement, le cours des entreprises et occupations d’une personne. « Activités » conserve cette portée large sans limiter le texte aux voyages ni aux affaires commerciales.
- source_word: μαρανθήσεται
  choice: se flétrira
  rationale: « Se flétrir » prolonge clairement en français la métaphore végétale et exprime la disparition future annoncée par le verbe.
theological_decisions:
- issue: Référence genrée de ὁ πλούσιος
  choice: le riche
  alternative: la personne riche
  rationale: Le singulier masculin grammatical est conservé comme figure représentative, sans restreindre aux hommes la portée de l’avertissement.
- issue: Portée de πορείαις dans l’avertissement adressé au riche
  choice: au cours de ses activités
  alternative: au cours de ses voyages
  rationale: Le terme peut évoquer des voyages réels, mais aussi le déroulement des occupations et entreprises. La traduction principale garde cette portée générale, tandis que la note préserve le sens littéral possible.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase garde l’enchaînement concret de l’image végétale et sa reprise dans l’avertissement final. Le point-virgule allège la longue coordination grecque sans en modifier la progression.
