source:
  edition: SBLGNT
  text: ἐγγίσατε τῷ θεῷ, καὶ ⸀ἐγγιεῖ ὑμῖν. καθαρίσατε χεῖρας, ἁμαρτωλοί, καὶ ἁγνίσατε καρδίας, δίψυχοι.
base_translation:
  language: en
  yaml_path: translation/nt/james/004/008.yaml
  text: Draw near to God[a], and he will draw near to you. Cleanse your hands, sinners, and purify your hearts, double-minded people.
translation:
  language: fr
  text: Approchez-vous de Dieu et il s’approchera de vous. Nettoyez vos mains, pécheurs, et purifiez vos cœurs, vous qui avez l’âme partagée[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « à deux âmes ». Le terme décrit des personnes divisées dans leur loyauté ou leur engagement intérieur.'
    reason: Alternative lexicale préservant l’image littérale du grec δίψυχοι.
lexical_decisions:
- source_word: ἐγγίσατε
  choice: Approchez-vous
  rationale: L’impératif aoriste pluriel appelle les destinataires à s’approcher de Dieu. La tournure pronominale est naturelle en français et permet de conserver le parallélisme avec « il s’approchera ».
- source_word: τῷ θεῷ
  choice: de Dieu
  rationale: Avec « s’approcher », le complément français se construit naturellement avec « de ».
- source_word: ἐγγιεῖ
  choice: il s’approchera
  rationale: Le futur actif a Dieu pour sujet implicite. La répétition du même verbe préserve le parallélisme grec.
- source_word: καθαρίσατε
  choice: Nettoyez
  rationale: L’impératif conserve l’image concrète des mains rendues nettes ainsi que sa portée morale, sans la remplacer par une explication.
- source_word: χεῖρας
  choice: vos mains
  rationale: Le possessif, implicite dans l’adresse directe grecque, est requis par l’usage français courant. L’image corporelle est conservée.
- source_word: ἁμαρτωλοί
  choice: pécheurs
  rationale: Le vocatif pluriel est rendu directement et garde la vigueur de l’interpellation.
- source_word: ἁγνίσατε
  choice: purifiez
  rationale: Ce verbe distinct de καθαρίσατε évoque la pureté intérieure. « Purifiez » maintient la variation lexicale entre les mains et les cœurs.
- source_word: καρδίας
  choice: vos cœurs
  rationale: Le possessif est naturel en français. « Cœurs » conserve l’image biblique du centre intérieur des motifs et des fidélités.
- source_word: δίψυχοι
  choice: vous qui êtes partagés intérieurement
  rationale: L’expression rend de façon compréhensible la division intérieure et la loyauté partagée évoquées par l’adjectif grec, tout en gardant la vive image littérale dans une note.
theological_decisions:
- issue: Image corporelle et portée morale de l’exhortation
  choice: Conserver les images des « mains » et des « cœurs » sans les expliciter comme actes extérieurs et dispositions intérieures.
  alternative: Paraphraser en parlant directement de conduite et de motivations.
  rationale: Le langage de purification peut porter à la fois des résonances rituelles et morales. Le maintien des images préserve cette richesse et évite de réduire le texte à une seule interprétation.
- issue: Sens de δίψυχοι
  choice: « vous qui êtes partagés intérieurement » dans le texte principal
  alternative: « âmes doubles » ou « irrésolus »
  rationale: Le grec décrit des personnes divisées dans leur engagement intérieur. Le choix principal est clair en français moderne, tandis que la note conserve la formulation grecque particulièrement frappante.
translation_notes:
  register: Français international moderne, direct et digne. Les impératifs restent incisifs, le parallélisme verbal est conservé, et les métaphores corporelles ne sont pas remplacées par une paraphrase interprétative.
