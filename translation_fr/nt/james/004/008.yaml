    issue: La note donne « âmes doubles » comme formulation plus littérale de δίψυχοι.
    rationale: L’adjectif grec signifie littéralement « à deux âmes » / « double-souled ». En français, « âmes doubles » n’est pas l’équivalent idiomatique le plus précis et peut être compris comme des âmes dédoublées plutôt que comme une personne intérieurement divisée.
  - severity: low
    issue: « Vous qui êtes partagés intérieurement » est une paraphrase légèrement lourde de δίψυχοι.
    rationale: Le sens est juste, mais « vous qui avez l’âme partagée » garde l’apostrophe, la concision et l’image de l’âme présentes dans le grec, sans préciser indûment la nature de la division.
