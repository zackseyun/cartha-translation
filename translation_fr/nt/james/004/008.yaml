  verdict: revise
  source_fidelity: Le parallélisme des impératifs ἐγγίσατε / ἐγγιεῖ est bien rendu, de même que les impératifs de purification et les images des mains et des cœurs. « Nettoyez » et « purifiez » maintiennent utilement la distinction lexicale entre καθαρίσατε et ἁγνίσατε. Pour δίψυχοι, l’idée de division intérieure est présente, mais la formulation proposée est un peu explicative et la note ne rend pas de façon idiomatique l’image littérale du grec.
  naturalness: Le français est globalement moderne, clair et d’un registre approprié. « Vous qui êtes partagés intérieurement » est compréhensible, mais moins direct et moins naturel comme apostrophe que « vous qui avez l’âme partagée ». La suppression de la virgule avant « et » suit aussi l’usage français courant sans affecter la force du parallélisme.
  terminology: « Pécheurs », « mains », « cœurs » et « purifiez » conviennent au registre biblique moderne et ne surinterprètent pas les métaphores. Pour δίψυχοι, « à deux âmes » dans la note préserve mieux l’image lexicale que « âmes doubles », qui peut suggérer autre chose en français.
  issues:
