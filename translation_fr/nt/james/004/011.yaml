id: JAS.4.11
reference: James 4:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Μὴ καταλαλεῖτε ἀλλήλων, ἀδελφοί· ὁ καταλαλῶν ἀδελφοῦ ⸀ἢ κρίνων τὸν ἀδελφὸν αὐτοῦ καταλαλεῖ νόμου καὶ κρίνει νόμον· εἰ δὲ νόμον κρίνεις, οὐκ εἶ ποιητὴς νόμου ἀλλὰ κριτής.
base_translation:
  language: en
  yaml_path: translation/nt/james/004/011.yaml
  text: Do not speak against one another[a], brothers. The one who speaks against a brother or judges his brother speaks against the law and judges the law. But if you judge the law[b], you are not a doer of the law but a judge.
translation:
  language: fr
  text: Ne dites pas du mal les uns des autres[a], frères[b]. Celui qui dit du mal d’un frère ou qui juge son frère dit du mal de la loi et juge la loi. Or, si tu juges la loi, tu n’es pas quelqu’un qui met la loi en pratique, mais un juge.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ne vous dénigrez pas les uns les autres » ; le verbe grec désigne le fait de parler contre quelqu’un, notamment de manière hostile ou diffamatoire.'
    reason: lexical_alternative
  - marker: b
    text: Le grec emploie ici le masculin pluriel « frères », qui désigne vraisemblablement l’ensemble de la communauté, hommes et femmes.
    reason: inclusive_scope
lexical_decisions:
- source_word: καταλαλεῖτε / καταλαλῶν / καταλαλεῖ
  choice: dire du mal de
  rationale: Cette expression naturelle rend l’idée de parler contre quelqu’un de manière hostile ou dénigrante, sans limiter le sens à la calomnie au sens strict. Sa répétition préserve le lien verbal du grec.
- source_word: ἀλλήλων
  choice: les uns des autres
  rationale: Équivalent réciproque idiomatique qui convient à l’exhortation adressée à la communauté.
- source_word: ἀδελφοί
  choice: frères
  rationale: Le masculin pluriel grec est conservé dans le texte principal; dans ce contexte communautaire, il désigne vraisemblablement l’ensemble des croyants, hommes et femmes, ce qu’explicite une note.
- source_word: ἀδελφοῦ / τὸν ἀδελφὸν αὐτοῦ
  choice: d’un frère / son frère
  rationale: Ce choix maintient la métaphore familiale et la cohérence lexicale avec l’apostrophe « frères ».
- source_word: ἢ
  choice: ou
  rationale: Le sens disjonctif présente comme actions parallèles le fait de dire du mal d’un frère et celui de le juger.
- source_word: κρίνων / κρίνει / κρίνεις
  choice: juger / juge
  rationale: « Juger » conserve la répétition lexicale et la portée générale du grec; « condamner » serait trop restrictif.
- source_word: νόμου / νόμον
  choice: la loi
  rationale: L’article défini convient à l’usage français et au cadre conceptuel de l’épître, sans préciser indûment s’il s’agit ici de la loi mosaïque, de la loi royale ou plus largement de la loi de Dieu.
- source_word: ποιητὴς νόμου
  choice: quelqu’un qui met la loi en pratique
  rationale: Cette formulation française courante exprime clairement l’action d’accomplir la loi et maintient le contraste avec le rôle de juge.
- source_word: κριτής
  choice: juge
  rationale: Le nom direct et concis préserve l’opposition rhétorique entre mettre la loi en pratique et s’ériger en juge.
theological_decisions:
- issue: Portée de ἀδελφοί dans l’adresse à la communauté
  choice: « frères » dans le texte, avec une note indiquant l’inclusion probable des femmes
  alternative: « frères et sœurs »
  rationale: Le choix conserve la forme masculine du grec tout en permettant au lecteur moderne de comprendre que l’adresse vise vraisemblablement toute la communauté.
- issue: Référent de « la loi »
  choice: Maintenir simplement « la loi »
  alternative: « la loi de Moïse », « la loi royale » ou « la loi de Dieu »
  rationale: Le contexte de Jacques évoque l’instruction divine et l’amour du prochain, mais ce verset ne précise pas davantage le référent. La traduction ne tranche donc pas l’ambiguïté.
- issue: Nature du jugement interdit
  choice: Employer le terme général « juger »
  alternative: « condamner » ou « porter un jugement sur »
  rationale: Le grec garde une portée générale et construit un jeu argumentatif entre juger son frère, juger la loi et devenir juge. « Condamner » résoudrait trop étroitement la tension.
translation_notes:
  register: Français international moderne, digne et accessible. L’alternance entre « vous » dans l’interdiction collective et « tu » dans l’application individuelle suit le passage du pluriel au singulier en grec. La répétition de « dire du mal » et de « juger » conserve la structure argumentative du verset.
