id: JAS.4.4
reference: James 4:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸀μοιχαλίδες, οὐκ οἴδατε ὅτι ἡ φιλία τοῦ κόσμου ἔχθρα τοῦ θεοῦ ἐστιν; ὃς ⸀ἐὰν οὖν βουληθῇ φίλος εἶναι τοῦ κόσμου, ἐχθρὸς τοῦ θεοῦ καθίσταται.
base_translation:
  language: en
  yaml_path: translation/nt/james/004/004.yaml
  text: Adulteresses[a], do you not know that friendship with the world is hostility toward God? Therefore[d][c][b], whoever wants to be a friend of the world makes himself an enemy of God.
translation:
  language: fr
  text: Femmes adultères[a], ne savez-vous pas que l’amitié pour le monde[b] est une hostilité envers Dieu[c] ? Ainsi, quiconque veut être ami du monde se rend ennemi de Dieu[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le terme est probablement métaphorique : il évoque l’infidélité envers Dieu, à la manière du langage prophétique sur l’infidélité à l’alliance.'
    reason: lexical_alternative
  - marker: b
    text: Ici, « le monde » désigne l’ordre humain opposé à Dieu, et non la création elle-même.
    reason: cultural_note
  - marker: c
    text: 'Ou : « une inimitié avec Dieu ».'
    reason: alternative_reading
  - marker: d
    text: 'Ou : « devient ennemi de Dieu ».'
    reason: alternative_reading
lexical_decisions:
- source_word: μοιχαλίδες
  choice: Femmes adultères
  rationale: Le vocatif féminin pluriel est conservé explicitement. L’expression garde la force concrète et accusatrice du grec, tout en laissant la note signaler son probable emploi métaphorique pour l’infidélité envers Dieu.
- source_word: οὐκ οἴδατε
  choice: ne savez-vous pas
  rationale: Formulation française naturelle qui préserve la valeur rhétorique de la question négative.
- source_word: φιλία τοῦ κόσμου
  choice: l’amitié pour le monde
  rationale: « Amitié » correspond directement à φιλία et maintient le lien lexical avec φίλος. « Pour le monde » exprime naturellement en français l’attachement dont le monde est l’objet.
- source_word: κόσμος
  choice: le monde
  rationale: La traduction conserve le terme large du grec sans intégrer au texte principal une explication interprétative sur l’ordre humain opposé à Dieu.
- source_word: ἔχθρα τοῦ θεοῦ
  choice: une hostilité envers Dieu
  rationale: Cette formulation comprend le génitif comme objectif et rend clairement l’opposition dirigée contre Dieu, tout en signalant en note l’autre formulation possible.
- source_word: ὃς ἐὰν οὖν
  choice: Ainsi, quiconque
  rationale: « Ainsi » marque l’inférence portée par οὖν, tandis que « quiconque » restitue la portée générale de la proposition relative indéfinie.
- source_word: βουληθῇ
  choice: veut
  rationale: Le verbe français courant exprime la volonté délibérée sans surcharger le texte.
- source_word: φίλος εἶναι τοῦ κόσμου
  choice: être ami du monde
  rationale: La construction nominale du grec est préservée, ainsi que le contraste entre l’ami du monde et l’ennemi de Dieu.
- source_word: ἐχθρὸς τοῦ θεοῦ καθίσταται
  choice: se rend ennemi de Dieu
  rationale: « Se rend » exprime à la fois l’entrée dans un état et la responsabilité personnelle liée au choix évoqué dans la proposition.
theological_decisions:
- issue: Portée métaphorique de μοιχαλίδες
  choice: Conserver « Femmes adultères » dans le texte principal.
  alternative: « Gens infidèles » ou « personnes adultères ».
  rationale: Le terme évoque probablement l’infidélité spirituelle ou à l’alliance, dans le prolongement du langage prophétique. Une paraphrase ferait toutefois disparaître l’image vive et la forme féminine explicite du grec.
- issue: Sens de κόσμος
  choice: Traduire simplement par « le monde ».
  alternative: « L’ordre humain opposé à Dieu ».
  rationale: Dans ce contexte, le mot vise vraisemblablement le système de valeurs rebelle à Dieu, non la création en elle-même. Le texte principal conserve néanmoins l’expression non développée de la source.
- issue: Valeur de καθίσταται
  choice: « se rend ennemi de Dieu »
  alternative: « devient ennemi de Dieu ».
  rationale: Les deux formulations sont possibles. « Se rend » met en relief la responsabilité liée à la volonté d’être ami du monde, sans prétendre décrire exhaustivement le mécanisme théologique de cet état.
translation_notes:
  register: Français international moderne, direct et digne. La question rhétorique et les oppositions « amitié/ennemi » sont conservées. « Femmes adultères » maintient la rudesse et le féminin pluriel du vocatif grec, tandis que les notes expliquent sans neutraliser la métaphore.
