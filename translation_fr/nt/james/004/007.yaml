id: JAS.4.7
reference: James 4:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὑποτάγητε οὖν τῷ θεῷ· ἀντίστητε δὲ τῷ διαβόλῳ, καὶ φεύξεται ἀφ’ ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/james/004/007.yaml
  text: Submit yourselves[a], therefore, to God. But resist the devil, and he will flee from you.
translation:
  language: fr
  text: Soumettez-vous donc à Dieu[a]. Mais résistez au diable, et il fuira loin de vous.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Soyez soumis à Dieu. »'
    reason: Variante lexicale qui rend plus directement la forme passive de ὑποτάγητε, tandis que le texte principal en exprime la valeur réfléchie naturelle dans cette exhortation.
lexical_decisions:
- source_word: ὑποτάγητε
  choice: Soumettez-vous
  rationale: L’impératif aoriste passif de ὑποτάσσω a ici une valeur réfléchie dans l’exhortation. « Soumettez-vous » est naturel en français et exprime le fait de se placer volontairement sous l’autorité de Dieu.
- source_word: οὖν
  choice: donc
  rationale: Le terme marque la conséquence de l’argument précédent ; « donc » conserve clairement ce lien logique.
- source_word: τῷ θεῷ
  choice: à Dieu
  rationale: Le datif complète directement ὑποτάγητε ; « à Dieu » est la formulation française normale.
- source_word: ἀντίστητε
  choice: résistez
  rationale: L’impératif aoriste actif signifie se dresser contre ou opposer une résistance. « Résistez » est concis, courant et adapté à l’exhortation.
- source_word: δὲ
  choice: Mais
  rationale: δέ introduit ici une légère opposition entre la soumission à Dieu et la résistance au diable. « Mais » rend cette nuance sans l’alourdir.
- source_word: τῷ διαβόλῳ
  choice: au diable
  rationale: Dans ce contexte, διάβολος avec l’article désigne l’adversaire personnel traditionnellement appelé « le diable », et non simplement un calomniateur quelconque.
- source_word: καὶ
  choice: et
  rationale: La conjonction relie l’ordre à son résultat annoncé ; « et » en conserve la simplicité.
- source_word: φεύξεται
  choice: il fuira
  rationale: Le futur de φεύγω annonce le résultat de la résistance. En français, le pronom explicite renvoie naturellement au diable.
- source_word: ἀφ’ ὑμῶν
  choice: loin de vous
  rationale: ἀπό avec le génitif exprime l’éloignement. « Loin de vous » rend clairement le mouvement de fuite dans un français naturel.
theological_decisions:
- issue: Sens de διάβολος
  choice: « le diable », adversaire personnel
  alternative: « le calomniateur », compris de manière plus générique ou impersonnelle
  rationale: L’emploi articulé de διάβολος et le contexte de résistance spirituelle soutiennent la désignation d’un adversaire personnel. La traduction garde cette lecture lexicale et contextuelle sans ajouter de précision doctrinale absente du verset.
translation_notes:
  register: Français international moderne, clair et digne. La formulation reste concise, conserve le lien logique de « donc », la légère opposition marquée par « mais » et la promesse exprimée au futur.
