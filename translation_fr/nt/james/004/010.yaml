  text: ταπεινώθητε ἐνώπιον ⸀κυρίου, καὶ ὑψώσει ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/james/004/010.yaml
  text: Humble yourselves before the Lord[b][a], and he will exalt you.
translation:
  language: fr
  text: Humiliez-vous devant le Seigneur[a], et il vous élèvera[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en présence du Seigneur ».
    reason: lexical_alternative
  - marker: b
    text: Ou « vous relèvera ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ταπεινώθητε
  choice: Humiliez-vous
  rationale: L’impératif aoriste passif peut avoir ici une valeur réfléchie dans cette série d’exhortations. « Humiliez-vous » exprime naturellement en français l’appel à s’abaisser volontairement.
- source_word: ἐνώπιον
  choice: devant
  rationale: « Devant » rend avec concision le sens relationnel et spatial de ἐνώπιον, tout en laissant possible la formulation plus explicite « en présence de ».
- source_word: κυρίου
  choice: le Seigneur
  rationale: Cette formulation française naturelle conserve le titre défini du texte grec sans préciser davantage son référent.
- source_word: ὑψώσει
  choice: élèvera
  rationale: Le verbe exprime ici une élévation métaphorique accordée après l’humiliation. « Élèvera » en conserve la portée morale et théologique sans la réduire au réconfort émotionnel.
- source_word: ὑμᾶς
  choice: vous
  rationale: « Vous » traduit directement le pronom de deuxième personne du pluriel et convient à l’adresse collective.
theological_decisions:
- issue: Référent de « le Seigneur »
  choice: Conserver « le Seigneur » sans préciser le référent.
  alternative: « Dieu » ou « le Seigneur Jésus »
  rationale: Dans la lettre, κύριος peut désigner Dieu ou Jésus. Le contexte immédiat ne permet pas d’imposer ici l’un de ces référents; la traduction préserve donc l’ambiguïté du grec.
translation_notes:
  register: Français international moderne, direct et digne. L’impératif conserve la force exhortative du grec; le futur exprime la promesse correspondante. Les marqueurs de notes sont placés immédiatement après les expressions concernées.
