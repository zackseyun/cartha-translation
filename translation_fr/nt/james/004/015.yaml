id: JAS.4.15
reference: James 4:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀντὶ τοῦ λέγειν ὑμᾶς· Ἐὰν ὁ κύριος ⸀θελήσῃ, καὶ ⸀ζήσομεν καὶ ⸀ποιήσομεν τοῦτο ἢ ἐκεῖνο.
base_translation:
  language: en
  yaml_path: translation/nt/james/004/015.yaml
  text: Instead, you ought to say, “If the Lord wills, we will live and also do this or that.”
translation:
  language: fr
  text: 'Vous devriez plutôt dire[a] : « Si le Seigneur le veut, nous vivrons et nous ferons ceci ou cela. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « au lieu que vous disiez » ou « au lieu de dire ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντὶ τοῦ λέγειν ὑμᾶς
  choice: Vous devriez plutôt dire
  rationale: La construction signifie littéralement « au lieu que vous disiez » ou « au lieu de dire ». La formulation retenue exprime naturellement en français la correction implicite et le contraste avec le verset précédent.
- source_word: Ἐὰν
  choice: Si
  rationale: Introduit ici une condition avec le subjonctif grec ; « si » en est l’équivalent français naturel.
- source_word: ὁ κύριος
  choice: le Seigneur
  rationale: Rend directement κύριος sans préciser si Jacques vise particulièrement Dieu le Père ou le Seigneur Jésus.
- source_word: θελήσῃ
  choice: le veut
  rationale: θέλω exprime la volonté. Dans la tournure française consacrée et naturelle « si le Seigneur le veut », le pronom « le » reprend implicitement la poursuite de la vie et la réalisation des projets.
- source_word: καὶ ζήσομεν καὶ ποιήσομεν
  choice: nous vivrons et nous ferons
  rationale: Les deux futurs coordonnés placent aussi bien la vie que l’action sous la volonté du Seigneur. La répétition de « nous » donne une phrase claire et digne sans imposer l’emphase supplémentaire de « aussi ».
- source_word: τοῦτο ἢ ἐκεῖνο
  choice: ceci ou cela
  rationale: Expression indéfinie et idiomatique désignant les diverses activités envisagées.
theological_decisions:
- issue: Référent de « le Seigneur »
  choice: Conserver « le Seigneur » sans autre précision
  alternative: « Dieu » ou « le Seigneur Jésus »
  rationale: Le grec porte seulement ὁ κύριος. La traduction préserve ainsi l’indétermination du référent tout en maintenant l’affirmation de la souveraineté divine sur la vie et les projets humains.
- issue: Portée de la volonté du Seigneur
  choice: Coordonner « nous vivrons » et « nous ferons » sous la même condition
  alternative: Faire porter explicitement la condition surtout sur les actions projetées
  rationale: 'La structure grecque associe la continuation de la vie et l’accomplissement des projets : toutes deux dépendent de la volonté du Seigneur.'
translation_notes:
  register: Français moderne, international et digne. « Vous devriez plutôt dire » est plus naturel que le calque syntaxique, tandis que la note conserve la forme littérale. La citation garde une formulation simple et mémorable.
