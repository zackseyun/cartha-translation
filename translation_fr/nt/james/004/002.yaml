source:
  edition: SBLGNT
  text: ἐπιθυμεῖτε, καὶ οὐκ ἔχετε· φονεύετε καὶ ζηλοῦτε, καὶ οὐ δύνασθε ἐπιτυχεῖν· μάχεσθε καὶ πολεμεῖτε. οὐκ ἔχετε διὰ τὸ μὴ αἰτεῖσθαι ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/james/004/002.yaml
  text: You desire and do not have[a]; you murder and envy and are not able to obtain; you fight and wage war[d][c][b]. You do not have because you do not ask.
translation:
  language: fr
  text: Vous désirez et vous n’avez pas ; vous commettez des meurtres et vous êtes envieux, et vous ne pouvez parvenir à vos fins ; vous vous battez et vous faites la guerre. Vous n’avez pas parce que vous ne demandez pas[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: d
    text: D’après le contexte, la demande s’adresse implicitement à Dieu, bien que le grec ne le précise pas ici.
    reason: cross_reference
lexical_decisions:
- source_word: ἐπιθυμεῖτε
  choice: vous désirez quelque chose
  rationale: Le verbe désigne un désir intense, ici moralement désordonné. « Désirer » conserve sa largeur de sens sans lui imposer une nuance spécifiquement sexuelle ni le limiter d’emblée à la convoitise des biens d’autrui. « Quelque chose » rend naturelle en français l’opposition avec οὐκ ἔχετε sans préciser l’objet du désir.
- source_word: ἔχετε
  choice: vous l’avez / vous avez ce que vous désirez
  rationale: Le français exige ici un complément plus nettement que le grec. La reprise pronominale ou explicative rend le sens de ἔχω de façon naturelle sans définir la chose désirée.
- source_word: φονεύετε
  choice: vous commettez des meurtres
  rationale: φονεύω désigne normalement le fait de tuer de manière criminelle. Cette formulation garde la force morale du grec sans choisir « assassiner », qui peut suggérer plus précisément la préméditation en français.
- source_word: ζηλοῦτε
  choice: vous êtes envieux
  rationale: Dans ce contexte de désirs frustrés et de conflits, ζηλόω a un sens négatif. « Être envieux » est naturel en emploi absolu et n’exige pas l’ajout d’un objet absent du grec.
- source_word: οὐ δύνασθε ἐπιτυχεῖν
  choice: vous ne pouvez pas obtenir ce que vous désirez
  rationale: La combinaison exprime l’incapacité d’atteindre ou d’obtenir l’objet recherché. L’explicitation « ce que vous désirez » fournit en français le complément requis par « obtenir » tout en restant déterminée par le contexte immédiat.
- source_word: μάχεσθε
  choice: vous vous battez
  rationale: μάχομαι peut évoquer une lutte ou une querelle. « Vous vous battez » préserve la vigueur du terme et convient à son association avec πολεμεῖτε.
- source_word: πολεμεῖτε
  choice: vous faites la guerre
  rationale: πολεμέω porte une image guerrière plus forte que μάχομαι. « Faire la guerre » maintient cette intensification sans réduire les deux verbes à de simples disputes.
- source_word: διὰ τὸ μὴ αἰτεῖσθαι ὑμᾶς
  choice: parce que vous ne demandez pas
  rationale: La construction infinitive articulée avec διά exprime la cause. Le français rend celle-ci naturellement par « parce que ». L’objet de la demande, Dieu, reste implicite comme dans le grec.
theological_decisions:
- issue: Faut-il atténuer φονεύετε en lui donnant d’emblée un sens figuré ou rhétorique ?
  choice: Conserver la formulation forte « vous commettez des meurtres »
  alternative: « vous tuez », ou une paraphrase comme « vous nourrissez des pensées meurtrières »
  rationale: Le verbe grec est fort et la traduction ne doit pas résoudre la question exégétique en l’affaiblissant. Une lecture rhétorique, hyperbolique ou figurée relève de l’interprétation.
- issue: Faut-il nommer Dieu comme destinataire de la demande ?
  choice: 'Laisser le destinataire implicite : « vous ne demandez pas »'
  alternative: « vous ne demandez pas à Dieu »
  rationale: Le contexte, notamment le verset suivant, indique que la demande s’adresse à Dieu, mais le grec ne le nomme pas dans ce verset. Le texte conserve donc cette implication sans ajout explicite.
translation_notes:
  register: Français international moderne, direct et digne. Les compléments ajoutés (« quelque chose », « ce que vous désirez ») répondent aux exigences idiomatiques du français tout en laissant indéterminé l’objet convoité. Le rythme en trois propositions séparées par des points-virgules suit la progression du grec et conserve sa vigueur prophétique.
