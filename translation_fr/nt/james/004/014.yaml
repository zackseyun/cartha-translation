id: JAS.4.14
reference: James 4:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οἵτινες οὐκ ἐπίστασθε ⸀τὸ τῆς αὔριον ⸀ποία ἡ ζωὴ ὑμῶν· ἀτμὶς γάρ ⸀ἐστε ⸀ἡ πρὸς ὀλίγον φαινομένη, ⸀ἔπειτα καὶ ἀφανιζομένη·
base_translation:
  language: en
  yaml_path: translation/nt/james/004/014.yaml
  text: You do not know what tomorrow will bring[a]. What is your life? For you are a mist that appears for a little while and then vanishes.
translation:
  language: fr
  text: Vous ne savez pas ce que demain apportera. Qu’est-ce que votre vie ? Vous êtes en effet une brume[a] qui apparaît pendant un court moment, puis disparaît.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « vapeur ».'
    reason: Alternative lexicale possible pour ἀτμίς.
lexical_decisions:
- source_word: οὐκ ἐπίστασθε
  choice: vous ne savez pas
  rationale: Dans ce contexte, le verbe exprime directement l’ignorance humaine concernant l’avenir. « Vous ne savez pas » est naturel et précis.
- source_word: τὸ τῆς αὔριον
  choice: ce que demain apportera
  rationale: L’expression grecque est elliptique et désigne ce qui relève du lendemain. Cette formulation française en restitue clairement le sens sans préciser indûment la nature des événements.
- source_word: ποία ἡ ζωὴ ὑμῶν
  choice: Qu’est-ce que votre vie ?
  rationale: ποία interroge ici la nature ou la qualité de la vie. Cette question brève conserve la force rhétorique et prépare l’image qui suit.
- source_word: ἀτμίς
  choice: brume
  rationale: « Brume » évoque naturellement en français quelque chose de visible, ténu et passager. « Vapeur » reste une possibilité lexicale signalée en note.
- source_word: πρὸς ὀλίγον
  choice: un court moment
  rationale: L’expression indique une très brève durée. « Un court moment » s’intègre avec naturel à la proposition relative.
- source_word: φαινομένη
  choice: qui apparaît
  rationale: Le participe décrit le moment où la brume devient visible; « apparaît » maintient l’image et son mouvement.
- source_word: ἔπειτα καὶ ἀφανιζομένη
  choice: puis disparaît
  rationale: « Puis » marque la succession exprimée par ἔπειτα, tandis que « disparaît » rend sobrement la cessation de visibilité.
theological_decisions:
- issue: Image de la brièveté et de l’incertitude de la vie humaine
  choice: Conserver l’image concrète de la brume et la question rhétorique.
  alternative: Expliciter par « votre vie est éphémère » ou développer une affirmation doctrinale sur la mort ou le jugement.
  rationale: Le contexte souligne les limites humaines face à l’avenir. Garder la métaphore préserve la vigueur littéraire et la tension théologique du texte sans lui ajouter de conclusion absente du verset.
translation_notes:
  register: 'Français international moderne, clair et digne. Le rythme bref des trois propositions conserve la progression rhétorique : ignorance du lendemain, interrogation sur la vie, puis image de sa fugacité.'
