  source_fidelity: Le texte conserve les trois impératifs aoristes coordonnés (ταλαιπωρήσατε, πενθήσατε, κλαύσατε) et la double injonction finale. « Affligez-vous » rend de façon recevable l’appel à la détresse; « prenez le deuil » et « pleurez » maintiennent la progression vers le deuil et les larmes. « Que votre rire se change en deuil, et votre joie en abattement » restitue fidèlement le parallélisme ainsi que les impératifs passifs de changement d’état, sans ajouter d’interprétation doctrinale.
  naturalness: Le français est moderne, solennel et intelligible dans un cadre biblique. « Prendre le deuil » est une expression française établie; dans cette succession d’impératifs, elle communique naturellement l’idée de deuil et de lamentation. L’ellipse dans le second membre (« votre joie en abattement ») est fluide et soutient le parallélisme.
  terminology: « Deuil » correspond bien à πένθος et crée un lien pertinent avec « prenez le deuil ». « Abattement » rend adéquatement κατήφεια, c’est-à-dire un état de tristesse accablée ou de déjection, sans registre archaïque ni terme clinique. Les notes proposent des alternatives lexicales utiles et ne surinterprètent pas le texte.
