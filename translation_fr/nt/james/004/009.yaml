id: JAS.4.9
reference: James 4:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ταλαιπωρήσατε καὶ πενθήσατε καὶ κλαύσατε· ὁ γέλως ὑμῶν εἰς πένθος ⸀μετατραπήτω καὶ ἡ χαρὰ εἰς κατήφειαν·
base_translation:
  language: en
  yaml_path: translation/nt/james/004/009.yaml
  text: Be miserable and mourn and weep[b][a]. Let your laughter be turned into mourning and your joy into gloom.
translation:
  language: fr
  text: Affligez-vous[a], prenez le deuil et pleurez. Que votre rire se change en deuil, et votre joie en abattement[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Soyez dans la détresse ». Le verbe grec décrit le fait de se trouver dans la misère ou l’affliction.
    reason: lexical_alternative
  - marker: b
    text: Ou « en tristesse sombre ». Le terme grec désigne un état triste et abattu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ταλαιπωρήσατε
  choice: Affligez-vous
  rationale: L’impératif appelle les destinataires à entrer dans un état de détresse et de misère. « Affligez-vous » conserve la vigueur de l’ordre et s’insère naturellement dans la progression avec le deuil et les pleurs, sans ajouter explicitement l’idée de reconnaître sa misère.
- source_word: πενθήσατε
  choice: prenez le deuil
  rationale: Le verbe exprime le fait de mener deuil ou de se lamenter. « Prenez le deuil » garde ici sa force pénitentielle et permet de conserver le lien lexical avec le nom πένθος dans la proposition suivante.
- source_word: κλαύσατε
  choice: pleurez
  rationale: « Pleurez » rend directement l’expression visible de la douleur et maintient la progression des trois impératifs.
- source_word: ὁ γέλως ὑμῶν
  choice: votre rire
  rationale: Cette formulation concrète et naturelle conserve le nom singulier et le possessif du grec.
- source_word: εἰς πένθος
  choice: en deuil
  rationale: « Deuil » reprend le même champ lexical que πενθήσατε et exprime le passage du rire à une profonde lamentation.
- source_word: μετατραπήτω
  choice: se change
  rationale: Le subjonctif à valeur impérative « Que… se change » restitue naturellement en français l’impératif passif grec et le changement d’état demandé.
- source_word: ἡ χαρὰ
  choice: votre joie
  rationale: Bien que le possessif ne soit exprimé qu’avec « rire » en grec, il porte naturellement sur le membre parallèle en français, comme dans le texte source.
- source_word: εἰς κατήφειαν
  choice: en abattement
  rationale: κατήφεια désigne un état sombre, triste et accablé. « Abattement » rend cet état intérieur dans un français actuel et digne.
theological_decisions:
- issue: Force émotionnelle de l’appel à la repentance
  choice: Conserver des impératifs vigoureux appelant à l’affliction, au deuil et aux pleurs
  alternative: Atténuer le passage en simple appel au sérieux ou à la sobriété
  rationale: Dans le contexte de Jacques 4.6-10, ces ordres participent d’un appel pressant à s’humilier devant Dieu. La traduction en maintient la sévérité sans expliciter davantage la doctrine de la repentance que ne le fait le verset.
translation_notes:
  register: Français international moderne, solennel mais accessible. La triple injonction est maintenue, ainsi que le parallélisme entre rire et joie, puis deuil et abattement.
