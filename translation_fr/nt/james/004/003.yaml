id: JAS.4.3
reference: James 4:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: αἰτεῖτε καὶ οὐ λαμβάνετε, διότι κακῶς αἰτεῖσθε, ἵνα ἐν ταῖς ἡδοναῖς ὑμῶν δαπανήσητε.
base_translation:
  language: en
  yaml_path: translation/nt/james/004/003.yaml
  text: You ask and do not receive[a], because you ask wrongly[b], so that you may spend it on your pleasures.
translation:
  language: fr
  text: Vous demandez et vous ne recevez pas, parce que vous demandez mal[a], afin de le dépenser pour vos plaisirs[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de travers » ou « avec de mauvaises intentions ».
    reason: lexical_alternative
  - marker: b
    text: Le mot traduit par « plaisirs » peut aussi désigner des désirs de satisfaction personnelle ou des passions.
    reason: lexical_alternative
lexical_decisions:
- source_word: αἰτεῖτε
  choice: vous demandez
  rationale: Le verbe exprime directement l’action de demander. Le contexte suggère une demande adressée à Dieu, sans que celui-ci soit explicitement nommé dans ce verset.
- source_word: οὐ λαμβάνετε
  choice: vous ne recevez pas
  rationale: « Recevoir » conserve le lien naturel entre demander et recevoir et convient au registre du passage.
- source_word: διότι
  choice: parce que
  rationale: Cette conjonction introduit clairement la raison pour laquelle les destinataires ne reçoivent pas.
- source_word: κακῶς
  choice: mal
  rationale: « Mal » garde la portée morale et qualitative de l’adverbe sans la réduire d’emblée aux seules motivations; la proposition finale précise en quoi la demande est mauvaise.
- source_word: αἰτεῖσθε
  choice: vous demandez
  rationale: Le moyen grec n’exige pas ici une tournure réflexive explicite. La répétition reproduit le parallélisme du texte source.
- source_word: ἵνα
  choice: afin de
  rationale: Cette tournure française rend clairement la visée exprimée par la proposition au subjonctif.
- source_word: ἐν ταῖς ἡδοναῖς ὑμῶν
  choice: pour vos plaisirs
  rationale: ἡδονή désigne le plaisir et peut, dans ce contexte négatif, évoquer des désirs tournés vers la satisfaction personnelle. Avec « dépenser », la préposition « pour » donne une formulation française naturelle.
- source_word: δαπανήσητε
  choice: le dépenser
  rationale: Le verbe signifie dépenser ou employer des ressources. Le pronom « le », nécessaire à une expression française naturelle, renvoie implicitement à ce que les destinataires espèrent recevoir; « dilapider » renforcerait indûment la valeur négative du verbe lui-même.
theological_decisions:
- issue: Faut-il préciser que la demande est adressée à Dieu dans la prière?
  choice: 'Laisser le destinataire implicite : « Vous demandez »'
  alternative: « Vous demandez à Dieu »
  rationale: Le contexte indique vraisemblablement la prière, mais le grec ne nomme pas Dieu dans ce verset. Le laisser implicite évite d’ajouter au texte.
- issue: Faut-il traduire κακῶς en explicitant de mauvaises motivations?
  choice: « vous demandez mal »
  alternative: « vous demandez avec de mauvaises intentions »
  rationale: L’adverbe a un sens plus large que les seules motivations. La proposition qui suit expose la mauvaise finalité de la demande sans qu’il soit nécessaire de l’anticiper dans la traduction.
- issue: 'Portée de ἵνα : but ou résultat'
  choice: « afin de », avec une valeur de but
  alternative: « de sorte que », avec une nuance de résultat
  rationale: Dans ce contexte, la proposition décrit le dessein qui rend la demande mauvaise. La valeur finale est donc la plus probable, tout en reconnaissant que ἵνα peut parfois couvrir une relation plus large de but ou de résultat.
translation_notes:
  register: Français international moderne, sobre et digne. La répétition « vous demandez » maintient le parallélisme grec. La formulation reste directe et accessible, sans expliciter Dieu ni réduire κακῶς aux seules motivations.
