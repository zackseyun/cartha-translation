source:
  edition: SBLGNT
  text: Ἄγε νῦν οἱ λέγοντες· Σήμερον ⸀ἢ αὔριον ⸀πορευσόμεθα εἰς τήνδε τὴν πόλιν καὶ ⸀ποιήσομεν ἐκεῖ ⸀ἐνιαυτὸν καὶ ⸀ἐμπορευσόμεθα καὶ ⸀κερδήσομεν·
base_translation:
  language: en
  yaml_path: translation/nt/james/004/013.yaml
  text: Come now[a], you who say, “Today or tomorrow we will go into this city and spend a year there and do business and make a profit.”
translation:
  language: fr
  text: 'Allons donc, vous qui dites : « Aujourd’hui ou demain, nous irons dans cette ville-ci[a], nous y passerons un an, nous ferons des affaires et nous réaliserons un bénéfice. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus idiomatiquement : « telle ville ». Littéralement : « cette ville-ci » ; le grec désigne une ville précise dans le projet des personnes qui parlent.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄγε νῦν
  choice: À vous maintenant
  rationale: Cette formule française actuelle interpelle directement les destinataires et introduit la réprimande, sans recourir au calque peu naturel « Allons maintenant ».
- source_word: οἱ λέγοντες
  choice: qui dites
  rationale: Le participe substantivé a ici une valeur d’adresse directe; la deuxième personne conserve cette force rhétorique.
- source_word: Σήμερον ἢ αὔριον
  choice: Aujourd’hui ou demain
  rationale: ἤ est disjonctif et présente les deux moments comme des possibilités dans le projet annoncé.
- source_word: πορευσόμεθα
  choice: nous irons
  rationale: Le futur de πορεύομαι exprime simplement le déplacement projeté; « irons » est naturel et précis.
- source_word: εἰς τήνδε τὴν πόλιν
  choice: dans telle ville
  rationale: Le démonstratif τήνδε désigne la ville déterminée qu’ont en vue les locuteurs. En français, « telle ville » rend naturellement cette ville particulière mais non nommée dans la citation.
- source_word: ποιήσομεν ἐκεῖ ἐνιαυτόν
  choice: nous y passerons un an
  rationale: ποιέω suivi d’une durée à l’accusatif signifie idiomatiquement passer cette période de temps.
- source_word: ἐμπορευσόμεθα
  choice: nous ferons des affaires
  rationale: Le verbe désigne une activité commerciale; cette expression est courante et suffisamment large en français moderne.
- source_word: κερδήσομεν
  choice: nous réaliserons un bénéfice
  rationale: Dans ce contexte commercial, κερδαίνω évoque un gain financier; « réaliser un bénéfice » conserve cette précision.
theological_decisions:
- issue: Force de l’interpellation réprobatrice
  choice: 'Adresse directe : « À vous maintenant qui dites »'
  alternative: 'Description plus distante : « ceux qui disent »'
  rationale: Jacques interpelle directement les personnes dont il dénonce l’assurance présomptueuse; la traduction garde cette confrontation sans expliciter davantage son jugement.
- issue: Degré de certitude exprimé par les futurs
  choice: 'Futurs affirmatifs : « nous irons… passerons… ferons… réaliserons »'
  alternative: Formulation modale telle que « nous comptons aller »
  rationale: Les futurs grecs présentent le programme avec assurance. Les conserver permet au verset suivant de mettre lui-même en lumière la fragilité de cette prétention, sans l’anticiper dans la traduction.
translation_notes:
  register: Français international moderne, digne et direct. « À vous maintenant » maintient l’interpellation vive sans archaïsme; la série de futurs reproduit le ton assuré du projet commercial.
