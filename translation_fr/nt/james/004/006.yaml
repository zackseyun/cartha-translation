reference: James 4:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: μείζονα δὲ δίδωσιν χάριν· διὸ λέγει· Ὁ θεὸς ὑπερηφάνοις ἀντιτάσσεται ταπεινοῖς δὲ δίδωσιν χάριν.
base_translation:
  language: en
  yaml_path: translation/nt/james/004/006.yaml
  text: But he gives greater grace. Therefore it says[a], “God opposes the proud, but gives grace to the humble.”
translation:
  language: fr
  text: 'Mais il accorde une grâce plus grande. C’est pourquoi il est dit[a] : « Dieu s’oppose aux orgueilleux, mais accorde grâce aux humbles. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « C’est pourquoi il dit », ou : « C’est pourquoi l’Écriture dit ». En grec, le sujet du verbe « dit » reste implicite.'
    reason: alternative_reading
lexical_decisions:
- source_word: μείζονα
  choice: plus grande
  rationale: Conserve explicitement la valeur comparative de μείζονα et forme une expression naturelle avec « grâce ».
- source_word: δίδωσιν χάριν
  choice: accorde une grâce / accorde sa grâce
  rationale: « Accorder » convient naturellement à la grâce en français actuel. Dans la citation, l’article possessif rend l’expression idiomatique sans changer le sens, tandis que la répétition du verbe préserve l’écho rhétorique.
- source_word: διὸ
  choice: C’est pourquoi
  rationale: Marque clairement la conséquence tirée de l’affirmation précédente dans un français fluide.
- source_word: λέγει
  choice: il est dit
  rationale: Le sujet grec est implicite. La tournure impersonnelle française signale la citation sans décider s’il faut comprendre Dieu, l’Écriture ou le texte cité.
- source_word: ὑπερηφάνοις
  choice: aux orgueilleux
  rationale: Rend l’adjectif substantivé et son sens d’orgueil ou d’arrogance, en contraste direct avec « aux humbles ».
- source_word: ἀντιτάσσεται
  choice: s’oppose
  rationale: Exprime nettement l’opposition active indiquée par le verbe grec.
- source_word: ταπεινοῖς
  choice: aux humbles
  rationale: Rend naturellement l’adjectif substantivé et préserve le contraste éthique avec les orgueilleux.
- source_word: δὲ
  choice: Mais
  rationale: Préserve la valeur adversative au début du verset et à l’intérieur de la citation.
theological_decisions:
- issue: Sujet implicite de λέγει dans la formule de citation
  choice: C’est pourquoi il est dit
  alternative: C’est pourquoi il dit ; C’est pourquoi l’Écriture dit
  rationale: Le grec ne précise pas le sujet. La formulation impersonnelle évite d’identifier celui-ci au-delà de ce que dit le texte, tout en introduisant clairement une citation scripturaire.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve la comparaison « plus grande », le contraste entre orgueilleux et humbles, ainsi que l’ambiguïté du sujet de la formule de citation.
