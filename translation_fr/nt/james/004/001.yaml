source:
  edition: SBLGNT
  text: Πόθεν πόλεμοι καὶ ⸀πόθεν μάχαι ἐν ὑμῖν; οὐκ ἐντεῦθεν, ἐκ τῶν ἡδονῶν ὑμῶν τῶν στρατευομένων ἐν τοῖς μέλεσιν ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/james/004/001.yaml
  text: From where come wars and from where come fights among you? Is it not from here—from your pleasures that wage war in your members?[a][b][c]
translation:
  language: fr
  text: 'D’où viennent les guerres, et d’où viennent les combats parmi vous ? Ne viennent-ils pas de là : de vos plaisirs qui font la guerre dans vos membres ?[a][b][c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « conflits… querelles ». Le grec emploie des termes militaires, littéralement « guerres » et « combats », pour parler des disputes au sein de la communauté.
    reason: lexical_alternative
  - marker: b
    text: Ou « en vous » dans la première phrase. Le grec peut désigner les conflits entre les lecteurs ou les conflits en leur for intérieur. L’ensemble du verset relie les luttes extérieures aux désirs intérieurs.
    reason: alternative_reading
  - marker: c
    text: « Membres » est littéral ; le mot peut désigner les parties du corps ou, plus largement, les facultés de la personne.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πόθεν
  choice: D’où viennent
  rationale: Conserve l’idée d’origine ainsi que la répétition rhétorique de l’adverbe interrogatif.
- source_word: πόλεμοι
  choice: guerres
  rationale: Préserve le terme militaire fort et son emploi métaphorique pour les graves conflits de la communauté.
- source_word: μάχαι
  choice: combats
  rationale: Maintient le second terme militaire tout en le distinguant de « guerres » dans un français naturel.
- source_word: ἐν ὑμῖν
  choice: parmi vous
  rationale: Dans la première proposition, le contexte favorise les conflits interpersonnels au sein de la communauté, sans exclure l’arrière-plan intérieur explicité ensuite.
- source_word: οὐκ ἐντεῦθεν
  choice: Ne viennent-ils pas de là
  rationale: Rend la question rhétorique qui appelle une réponse affirmative et désigne la source énoncée immédiatement après.
- source_word: ἡδονῶν
  choice: plaisirs
  rationale: Équivalent direct qui conserve l’idée de jouissances, souvent égoïstes, sans substituer d’emblée la notion plus interprétative de passions ou de désirs.
- source_word: στρατευομένων
  choice: qui font la guerre
  rationale: Préserve l’image militaire active et son écho aux « guerres » du début du verset.
- source_word: ἐν τοῖς μέλεσιν ὑμῶν
  choice: dans vos membres
  rationale: Conserve la métaphore corporelle et laisse ouverte la référence aux parties du corps ou, plus largement, aux facultés de la personne.
theological_decisions:
- issue: Interprétation des conflits comme luttes uniquement intérieures ou comme disputes communautaires
  choice: « parmi vous » pour le premier ἐν ὑμῖν, puis « dans vos membres » pour la dernière expression
  alternative: Traduire les deux expressions dans un sens intérieur, ou rendre la dernière simplement par « en vous »
  rationale: Le texte relie les conflits visibles dans la communauté aux plaisirs qui combattent intérieurement. Cette formulation maintient ensemble les dimensions sociale et intérieure sans réduire le verset à l’une d’elles.
translation_notes:
  register: Français international moderne, naturel et digne. La répétition « D’où viennent » et le vocabulaire militaire sont maintenus pour préserver la vigueur rhétorique de l’original ; « membres » est conservé malgré son caractère légèrement soutenu afin de ne pas effacer la métaphore corporelle.
