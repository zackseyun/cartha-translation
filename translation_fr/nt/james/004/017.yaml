id: JAS.4.17
reference: James 4:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἰδότι οὖν καλὸν ποιεῖν καὶ μὴ ποιοῦντι, ἁμαρτία αὐτῷ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/james/004/017.yaml
  text: So[a], for the one who knows to do good and does not do it, it is sin for him.
translation:
  language: fr
  text: Ainsi[a], celui qui sait faire le bien et ne le fait pas commet un péché.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « C’est donc un péché, pour celui qui sait faire le bien et ne le fait pas. »'
    reason: Cette formulation plus formelle conserve explicitement le datif de référence αὐτῷ et la structure prédicative « c’est un péché ».
lexical_decisions:
- source_word: εἰδότι
  choice: celui qui sait
  rationale: Le participe datif singulier est employé substantivement et désigne de manière générale une personne qui sait; « celui qui sait » conserve cette forme personnelle et singulière.
- source_word: οὖν
  choice: Ainsi
  rationale: La particule marque une conclusion tirée de ce qui précède. « Ainsi » exprime naturellement ce lien logique en français.
- source_word: καλὸν ποιεῖν
  choice: faire le bien
  rationale: L’expression désigne l’accomplissement de ce qui est moralement bon ou juste. « Faire le bien » est direct, naturel et garde la portée générale du grec.
- source_word: μὴ ποιοῦντι
  choice: et ne le fait pas
  rationale: Le second participe contraste le bien connu avec l’inaction. Le pronom « le » reprend « le bien » sans ajouter un objet absent du grec.
- source_word: ἁμαρτία αὐτῷ ἐστιν
  choice: commet un péché
  rationale: Cette formulation française naturelle rend l’idée que, pour cette personne, l’omission constitue un péché. Elle évite le tour peu idiomatique « c’est péché pour lui ».
theological_decisions:
- issue: Portée de l’affirmation sur le bien omis
  choice: Le fait de savoir quel bien faire et de ne pas le faire constitue un péché.
  alternative: Limiter l’affirmation au seul projet présomptueux évoqué dans le contexte immédiat.
  rationale: Le contexte concerne les projets humains faits avec arrogance, mais la formulation grecque est assez générale pour énoncer un principe éthique plus large. La traduction conserve cette ampleur sans imposer un système doctrinal particulier.
translation_notes:
  register: Français international moderne, simple et digne. La phrase principale privilégie une syntaxe idiomatique tout en conservant le lien conclusif avec le contexte et la portée générale du principe.
