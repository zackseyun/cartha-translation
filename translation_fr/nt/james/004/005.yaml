source:
  edition: SBLGNT
  text: ἢ δοκεῖτε ὅτι κενῶς ἡ γραφὴ λέγει· Πρὸς φθόνον ἐπιποθεῖ τὸ πνεῦμα ὃ ⸀κατῴκισεν ἐν ἡμῖν;
base_translation:
  language: en
  yaml_path: translation/nt/james/004/005.yaml
  text: Or do you think that the Scripture speaks in vain? The Spirit whom he caused to dwell in us yearns jealously[a].
translation:
  language: fr
  text: 'Ou bien pensez-vous que l’Écriture parle en vain lorsqu’elle dit : « L’Esprit qu’il a fait habiter en nous éprouve un désir ardent et jaloux[a] » ?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « L’esprit qu’il a fait habiter en nous éprouve un désir marqué par l’envie. » Le grec peut désigner soit l’Esprit Saint, soit l’esprit humain ; l’expression rendue par « désir jaloux » peut aussi être comprise au sens d’un désir empreint d’envie.'
    reason: La formulation grecque est ambiguë quant au référent de « l’esprit » et au sens de πρὸς φθόνον.
lexical_decisions:
- source_word: κενῶς
  choice: en vain
  rationale: Cette expression française naturelle traduit l’idée que l’Écriture parlerait sans effet, sans raison ou sans portée.
- source_word: ἡ γραφὴ
  choice: l’Écriture
  rationale: Le singulier défini désigne ici les écrits sacrés considérés comme autorité.
- source_word: Πρὸς φθόνον
  choice: jaloux
  rationale: Associé à ἐπιποθεῖ, le groupe exprime un désir intense marqué par la jalousie. « Jaloux » convient à la lecture où il s’agit de l’Esprit de Dieu, tout en laissant en note la valeur possible d’« envie ».
- source_word: ἐπιποθεῖ
  choice: éprouve un ardent désir
  rationale: Le verbe exprime un désir profond et intense. Cette tournure est idiomatique en français et n’ajoute pas d’objet absent du grec.
- source_word: τὸ πνεῦμα
  choice: L’Esprit
  rationale: La majuscule retient dans le texte principal la lecture selon laquelle il s’agit de l’Esprit Saint, sans nier l’interprétation possible du souffle ou de l’esprit humain, signalée en note.
- source_word: κατῴκισεν
  choice: a fait habiter
  rationale: La formulation conserve la valeur causative du verbe grec et son aspect rétrospectif.
- source_word: ἐν ἡμῖν
  choice: en nous
  rationale: La préposition indique le plus naturellement une présence intérieure, tout en pouvant aussi avoir une nuance collective.
theological_decisions:
- issue: Référent de τὸ πνεῦμα
  choice: L’Esprit désigne l’Esprit Saint que Dieu a fait habiter en nous.
  alternative: L’esprit humain que Dieu a fait habiter en nous.
  rationale: La grammaire permet les deux lectures. Le texte principal retient l’Esprit Saint parce que le langage de l’habitation en nous s’accorde bien avec l’usage néotestamentaire, mais la note conserve l’ambiguïté réelle.
- issue: Valeur morale de φθόνος
  choice: Un ardent désir jaloux.
  alternative: Un désir marqué par l’envie.
  rationale: Si le sujet est l’Esprit Saint, « jaloux » peut exprimer l’attachement exclusif et légitime de Dieu sans lui attribuer un vice. Le sens plus littéral lié à l’envie demeure possible et est indiqué en note.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure « éprouve un ardent désir jaloux » conserve l’intensité du grec sans introduire un complément d’objet qui n’y est pas exprimé. Les guillemets présentent la proposition comme la parole de l’Écriture introduite par la première question.
