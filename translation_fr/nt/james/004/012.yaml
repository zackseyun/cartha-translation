source:
  edition: SBLGNT
  text: εἷς ⸀ἐστιν νομοθέτης ⸂καὶ κριτής⸃, ὁ δυνάμενος σῶσαι καὶ ἀπολέσαι· σὺ δὲ τίς εἶ, ⸂ὁ κρίνων⸃ τὸν ⸀πλησίον;
base_translation:
  language: en
  yaml_path: translation/nt/james/004/012.yaml
  text: There is one Lawgiver and Judge, the one who is able to save and to destroy. But who are you, judging your neighbor?
translation:
  language: fr
  text: 'Il n’y a qu’un seul législateur et juge : celui qui peut sauver et faire périr. Mais toi, qui es-tu, toi qui juges ton prochain ?'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νομοθέτης
  choice: législateur
  rationale: Rend directement celui qui établit la loi, dans un français courant et digne.
- source_word: ἀπολέσαι
  choice: faire périr
  rationale: Préserve la force du verbe grec et son contraste avec « sauver », sans limiter le sens à une destruction matérielle.
- source_word: ὁ κρίνων
  choice: toi qui juges
  rationale: Conserve la forme participiale et la reprise emphatique de « toi », plutôt que de reformuler simplement par « pour juger ».
- source_word: πλησίον
  choice: prochain
  rationale: Terme français établi qui désigne ici l’autre personne, celle avec qui l’on est en relation.
theological_decisions:
- issue: L’unicité du législateur et juge
  choice: Il n’y a qu’un seul législateur et juge
  alternative: Un seul est législateur et juge
  rationale: La tournure existentielle est naturelle en français tout en maintenant que la même figure est à la fois législateur et juge.
- issue: Portée de κρίνω
  choice: juges
  alternative: condamnes
  rationale: « Juger » conserve l’étendue sémantique du grec et évite de préciser indûment qu’il s’agit nécessairement d’une condamnation judiciaire définitive.
translation_notes:
  register: Français international moderne, clair et digne. La seconde personne singulière et la reprise « Mais toi… toi qui… » conservent l’interpellation directe et appuyée du grec.
