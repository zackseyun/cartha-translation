id: JAS.4.16
reference: James 4:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: νῦν δὲ καυχᾶσθε ἐν ταῖς ἀλαζονείαις ὑμῶν· πᾶσα καύχησις τοιαύτη πονηρά ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/james/004/016.yaml
  text: But as it is[a], you boast in your arrogance. All such boasting is evil.
translation:
  language: fr
  text: Mais en réalité, vous vous vantez de vos prétentions[a]. Toute vantardise de ce genre est mauvaise.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de votre arrogance », « de vos assurances présomptueuses » ou « de vos affirmations vantardes ». Le terme grec peut désigner des prétentions arrogantes en général ; ici, il renvoie probablement surtout aux projets pleins d’assurance décrits dans les versets précédents.
    reason: alternative lexicale
lexical_decisions:
- source_word: νῦν δὲ
  choice: Mais en réalité
  rationale: L’expression marque le contraste entre l’attitude humble recommandée au verset précédent et la conduite effective des destinataires. « Mais en réalité » rend naturellement cette opposition en français.
- source_word: καυχᾶσθε
  choice: vous vous vantez
  rationale: Le verbe exprime le fait de se glorifier ou de tirer orgueil de quelque chose. « Se vanter » est direct, courant et maintient le lien lexical avec καύχησις.
- source_word: ἐν ταῖς ἀλαζονείαις ὑμῶν
  choice: de vos prétentions
  rationale: ἀλαζονεία désigne des prétentions arrogantes ou une assurance présomptueuse. Le pluriel « prétentions » respecte la forme grecque sans ajouter explicitement l’idée de projets, qui vient du contexte.
- source_word: πᾶσα καύχησις τοιαύτη
  choice: Toute vantardise de ce genre
  rationale: Cette formulation conserve la généralisation distributive de πᾶσα et la valeur qualitative de τοιαύτη, tout en reprenant naturellement le champ lexical de « vous vous vantez ».
- source_word: πονηρά
  choice: mauvaise
  rationale: Dans ce jugement moral, « mauvaise » exprime nettement la condamnation éthique et correspond idiomatiquement au nom féminin « vantardise ».
theological_decisions:
- issue: Nature de la vantardise condamnée
  choice: La traduction condamne les prétentions présomptueuses liées, dans le contexte, à des projets humains conçus sans soumission au Seigneur.
  alternative: Comprendre le propos comme une condamnation générale de toute confiance en soi, ou comme visant exclusivement les projets commerciaux.
  rationale: Les versets 13 à 15 orientent le sens vers la planification présomptueuse, mais le présent verset formule une conclusion générale. « Prétentions » préserve à la fois ce lien contextuel et la portée plus large de l’énoncé.
translation_notes:
  register: Français international moderne, naturel et digne. « Prétentions » conserve l’ambiguïté du grec mieux que « projets arrogants », qui expliciterait une donnée contextuelle. Le marqueur [a] figure immédiatement après le terme annoté.
