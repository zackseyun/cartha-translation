id: JAS.3.9
reference: James 3:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐν αὐτῇ εὐλογοῦμεν τὸν ⸀κύριον καὶ πατέρα, καὶ ἐν αὐτῇ καταρώμεθα τοὺς ἀνθρώπους τοὺς καθ’ ὁμοίωσιν θεοῦ γεγονότας·
base_translation:
  language: en
  yaml_path: translation/nt/james/003/009.yaml
  text: With it we bless the Lord and Father[b][a], and with it we curse people who have been made according to the likeness of God.
translation:
  language: fr
  text: Par elle, nous bénissons le Seigneur et Père[a], et par elle, nous maudissons les êtres humains qui ont été faits à la ressemblance de Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’expression grecque peut aussi se comprendre ainsi : « le Seigneur, qui est Père » ; elle peut présenter « Seigneur » et « Père » comme deux désignations coordonnées de Dieu.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν αὐτῇ
  choice: par elle
  rationale: Le pronom renvoie à la langue mentionnée dans le contexte précédent. « Par elle » exprime naturellement en français la valeur instrumentale de la préposition.
- source_word: εὐλογοῦμεν
  choice: nous bénissons
  rationale: « Bénir » conserve le contraste lexical et moral avec « maudire », ainsi que le langage biblique de la bénédiction adressée à Dieu.
- source_word: τὸν κύριον καὶ πατέρα
  choice: le Seigneur et Père
  rationale: Cette formulation proche du grec préserve la possibilité d’une relation appositionnelle entre les deux titres sans la trancher dans le corps du texte.
- source_word: καταρώμεθα
  choice: nous maudissons
  rationale: « Maudire » est l’équivalent français direct et maintient la force du contraste avec « bénir ».
- source_word: τοὺς ἀνθρώπους
  choice: les êtres humains
  rationale: Le nom grec désigne ici l’humanité en général et non les hommes de sexe masculin seulement. « Les êtres humains » rend explicitement cette portée générique.
- source_word: καθ’ ὁμοίωσιν θεοῦ
  choice: à la ressemblance de Dieu
  rationale: Cette tournure naturelle conserve le vocabulaire de la ressemblance et l’écho au récit de la création.
- source_word: γεγονότας
  choice: ont été faits
  rationale: Dans ce contexte de création, cette formulation exprime l’état résultant et laisse entendre l’action créatrice de Dieu, sans ajouter un agent absent de la proposition grecque.
theological_decisions:
- issue: Relation entre « Seigneur » et « Père »
  choice: le Seigneur et Père
  alternative: le Seigneur, qui est Père
  rationale: Le grec peut être compris de manière appositionnelle, mais la traduction conserve la coordination afin de ne pas imposer une seule analyse.
- issue: Portée de ἀνθρώπους
  choice: les êtres humains
  alternative: les hommes
  rationale: Le propos vise tous les humains, faits à la ressemblance de Dieu; une formulation générique évite de restreindre indûment le référent aux personnes de sexe masculin.
- issue: Allusion à la création
  choice: ont été faits à la ressemblance de Dieu
  alternative: sont devenus selon la ressemblance de Dieu
  rationale: Le contexte rend probable une allusion à la création de l’humanité. La formulation choisie la restitue sans expliciter davantage que le grec l’identité de l’agent.
translation_notes:
  register: Français moderne, digne et accessible. Le parallélisme « par elle… et par elle… » ainsi que l’opposition « bénissons / maudissons » sont conservés. La tournure inhabituelle « le Seigneur et Père » maintient délibérément l’ambiguïté syntaxique du grec, expliquée en note.
