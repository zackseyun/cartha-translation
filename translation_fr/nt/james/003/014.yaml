id: JAS.3.14
reference: James 3:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἰ δὲ ζῆλον πικρὸν ἔχετε καὶ ἐριθείαν ἐν τῇ καρδίᾳ ὑμῶν, μὴ κατακαυχᾶσθε καὶ ψεύδεσθε κατὰ τῆς ἀληθείας.
base_translation:
  language: en
  yaml_path: translation/nt/james/003/014.yaml
  text: But if you have bitter jealousy and selfish ambition in your hearts[d][c][b][a], do not boast and lie against the truth.
translation:
  language: fr
  text: Mais si vous avez dans vos cœurs[c] une jalousie amère[a] et une ambition égoïste[b], ne vous vantez pas et ne mentez pas contre la vérité[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un zèle amer » ou « une envie amère ».
    reason: lexical_alternative
  - marker: b
    text: Ou « un esprit de rivalité » ou « un esprit de parti ».
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement, « dans votre cœur » : le grec emploie un singulier distributif en s’adressant à plusieurs personnes.'
    reason: source_form
  - marker: d
    text: Ou « ne soyez pas faux envers la vérité ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ζῆλον πικρὸν
  choice: une jalousie amère
  rationale: Dans ce contexte négatif et en association avec ἐριθεία, ζῆλος désigne surtout la jalousie ou l’envie hostile. « Jalousie » exprime clairement ce vice, tandis que « amère » conserve directement πικρόν.
- source_word: ἐριθείαν
  choice: une ambition égoïste
  rationale: Le terme évoque la recherche intéressée de son propre avantage, souvent avec un effet de rivalité ou de division. « Ambition égoïste » rend clairement le mobile intérieur sans effacer sa portée sociale.
- source_word: ἐν τῇ καρδίᾳ ὑμῶν
  choice: dans vos cœurs
  rationale: Le grec emploie le singulier καρδίᾳ avec un possessif pluriel dans une construction distributive. Le pluriel français s’adresse naturellement à l’ensemble des lecteurs tout en indiquant le for intérieur de chacun.
- source_word: μὴ κατακαυχᾶσθε
  choice: ne vous vantez pas
  rationale: Le verbe désigne une vantardise ou une exaltation arrogante, éventuellement dirigée contre autrui. Cette formulation est concise, naturelle et adaptée au contexte.
- source_word: ψεύδεσθε κατὰ τῆς ἀληθείας
  choice: ne mentez pas contre la vérité
  rationale: « Mentez » conserve la valeur verbale de ψεύδεσθε, et « contre » rend l’opposition exprimée par κατά avec le génitif, sans préciser abusivement la nature exacte du mensonge.
- source_word: εἰ δὲ
  choice: Mais si
  rationale: Cette expression marque le contraste avec la sagesse décrite auparavant; « Mais si » le signale clairement en français courant.
theological_decisions:
- issue: Nature de « la vérité »
  choice: Conserver l’expression générale « la vérité »
  alternative: « la vérité de l’Évangile », « la vraie sagesse » ou la seule sincérité dans les paroles
  rationale: Le terme ἀλήθεια reste assez large pour évoquer la vérité de Dieu face à la vantardise mensongère. Le préciser davantage imposerait une interprétation que le verset ne formule pas.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation reste proche de la structure grecque tout en étant intelligible; elle conserve notamment l’expression volontairement forte « contre la vérité ».
