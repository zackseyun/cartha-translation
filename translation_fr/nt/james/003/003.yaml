  variant: modern international French
source:
  edition: SBLGNT
  text: ⸂εἰ δὲ⸃ τῶν ἵππων τοὺς χαλινοὺς εἰς τὰ στόματα βάλλομεν ⸀εἰς τὸ πείθεσθαι αὐτοὺς ἡμῖν, καὶ ὅλον τὸ σῶμα αὐτῶν μετάγομεν.
base_translation:
  language: en
  yaml_path: translation/nt/james/003/003.yaml
  text: If we put bits into the mouths of horses so that they obey us[a], we also guide their whole bodies.
translation:
  language: fr
  text: Si nous mettons des mors[a] dans la bouche des chevaux pour qu’ils nous obéissent, nous dirigeons aussi tout leur corps.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des brides » ; dans ce contexte, il s’agit plus précisément du mors placé dans la bouche du cheval.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ
  choice: Si
  rationale: Introduit naturellement en français une condition servant d’illustration. La légère valeur connective de δέ n’exige pas ici l’ajout d’un marqueur comme « or ».
- source_word: χαλινοὺς
  choice: des mors
  rationale: Puisque ces objets sont placés dans la bouche des chevaux, il s’agit précisément des mors plutôt que de l’ensemble des brides.
- source_word: εἰς τὰ στόματα βάλλομεν
  choice: nous mettons … dans la bouche des chevaux
  rationale: « Mettre dans » rend naturellement le mouvement exprimé par εἰς avec βάλλομεν. Le singulier collectif « la bouche des chevaux » est idiomatique en français, chaque cheval ayant son mors dans sa bouche.
- source_word: εἰς τὸ πείθεσθαι αὐτοὺς ἡμῖν
  choice: pour qu’ils nous obéissent
  rationale: La tournure finale rend la valeur de but de l’infinitif articulé avec εἰς, tandis que πείθεσθαι suivi du datif signifie ici « obéir ».
- source_word: καὶ ὅλον τὸ σῶμα αὐτῶν μετάγομεν
  choice: nous dirigeons aussi tout leur corps
  rationale: « Diriger » exprime la conduite du mouvement indiquée par μετάγομεν. « Tout leur corps » garde le singulier distributif du grec tout en restant naturel en français.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. La phrase conserve la comparaison concrète et le rapport entre le petit moyen de contrôle et le corps entier, sans expliciter davantage l’application du contexte.
