id: JAS.3.2
reference: James 3:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: πολλὰ γὰρ πταίομεν ἅπαντες. εἴ τις ἐν λόγῳ οὐ πταίει, οὗτος τέλειος ἀνήρ, δυνατὸς χαλιναγωγῆσαι καὶ ὅλον τὸ σῶμα.
base_translation:
  language: en
  yaml_path: translation/nt/james/003/002.yaml
  text: For we all stumble in many ways[a]. If anyone does not stumble in word, this one is a mature man[c][b], able also to bridle the whole body.
translation:
  language: fr
  text: Car nous trébuchons tous de bien des manières. Si quelqu’un ne trébuche pas en paroles[a], c’est un homme accompli[b][c], capable aussi de tenir tout son corps en bride.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « dans la parole », c’est-à-dire dans ce que l’on dit.
    reason: lexical_alternative
  - marker: b
    text: Ou « parfait » ou « mûr ». Le grec τέλειος peut désigner ce qui est parfait, complet ou parvenu à maturité; ici, le contexte met l’accent sur l’accomplissement moral plutôt que sur une absence absolue de faute.
    reason: lexical_alternative
  - marker: c
    text: Le grec dit « homme » (ἀνήρ), employé ici avec une portée représentative dans un énoncé général.
    reason: cultural_note
lexical_decisions:
- source_word: πολλὰ
  choice: de bien des manières
  rationale: L’accusatif neutre pluriel a ici une valeur adverbiale et exprime la multiplicité des façons de faillir.
- source_word: γὰρ
  choice: Car
  rationale: Conserve le lien explicatif avec l’avertissement qui précède.
- source_word: πταίομεν / πταίει
  choice: trébuchons / trébuche
  rationale: Préserve l’image concrète du faux pas tout en exprimant métaphoriquement la faute morale.
- source_word: ἅπαντες
  choice: nous tous
  rationale: L’ordre français « nous trébuchons tous » rend naturellement l’inclusion emphatique de l’auteur.
- source_word: ἐν λόγῳ
  choice: en paroles
  rationale: Désigne le domaine de la parole, c’est-à-dire ce que l’on dit, sans réduire l’expression à une seule déclaration.
- source_word: οὗτος
  choice: c’est
  rationale: La tournure présentative française reprend avec netteté la personne hypothétique sans le calque peu naturel « celui-ci ».
- source_word: τέλειος
  choice: accompli
  rationale: Rend l’idée de maturité et d’intégrité achevée tout en laissant subsister la nuance possible de perfection ou de complétude.
- source_word: ἀνήρ
  choice: homme
  rationale: Reproduit le masculin explicite du grec; « quelqu’un » indique déjà que l’énoncé a une portée générale.
- source_word: δυνατὸς
  choice: capable
  rationale: Exprime directement l’aptitude à maîtriser l’ensemble du corps.
- source_word: χαλιναγωγῆσαι
  choice: tenir … en bride
  rationale: Expression française naturelle qui conserve l’image équestre développée dans les versets suivants.
- source_word: καὶ ὅλον τὸ σῶμα
  choice: aussi … tout son corps
  rationale: « Aussi » maintient la progression additive, et le possessif est idiomatique en français pour le corps de la personne concernée.
theological_decisions:
- issue: Sens de τέλειος dans ce contexte éthique
  choice: homme accompli
  alternative: homme parfait; homme mûr
  rationale: « Accompli » exprime la maturité et l’intégrité morale sans imposer l’idée d’une impeccabilité absolue, que la première proposition met en tension.
- issue: Portée du masculin ἀνήρ
  choice: homme, avec une portée représentative générale
  alternative: personne
  rationale: Le texte grec emploie explicitement ἀνήρ, tandis que l’introduction « si quelqu’un » rend claire l’application générale.
- issue: Rapport entre maîtrise de la parole et maîtrise du corps
  choice: capacité correspondante, sans préciser davantage le lien logique
  alternative: preuve que la personne maîtrise nécessairement tout comportement
  rationale: Le grec affirme la capacité de tenir le corps en bride; la traduction évite d’ajouter une théorie psychologique ou une garantie d’impeccabilité.
translation_notes:
  register: Français international moderne, digne et accessible. La métaphore du trébuchement est conservée, ainsi que celle de la bride, importante pour la suite du passage. « En paroles » est plus naturel que le calque « en parole », et « homme accompli » préserve la tension sémantique de τέλειος.
