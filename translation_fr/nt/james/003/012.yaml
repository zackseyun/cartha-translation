source:
  edition: SBLGNT
  text: μὴ δύναται, ἀδελφοί μου, συκῆ ἐλαίας ποιῆσαι ἢ ἄμπελος σῦκα; ⸂οὔτε ἁλυκὸν⸃ γλυκὺ ποιῆσαι ὕδωρ.
base_translation:
  language: en
  yaml_path: translation/nt/james/003/012.yaml
  text: My brothers[a], can a fig tree produce olives[c][b], or a grapevine figs? Neither can salt water produce fresh water.
translation:
  language: fr
  text: Mes frères[a], un figuier peut-il produire des olives, ou une vigne des figues ? Une eau salée ne peut pas non plus produire de l’eau douce[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Mes frères et sœurs ». Le grec dit « frères », un masculin pluriel qui peut s’adresser à un groupe mixte.
    reason: lexical_alternative
  - marker: b
    text: Le grec emploie un mot qui peut signifier « doux » ou « sucré » ; dans ce contraste avec l’eau salée, le sens est « eau douce ».
    reason: lexical_alternative
  - marker: c
    text: 'La dernière proposition est elliptique en grec. En lien avec l’image de la source au verset précédent, on peut aussi comprendre : « Une source salée ne peut pas non plus produire de l’eau douce. »'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀδελφοί μου
  choice: Mes frères
  rationale: Le vocatif masculin pluriel est conservé dans le texte principal. Dans ce contexte, il peut désigner l’ensemble de la communauté, hommes et femmes, ce que précise la note.
- source_word: μὴ δύναται
  choice: peut-il
  rationale: La question introduite par μή appelle une réponse négative. La tournure interrogative française exprime naturellement cette impossibilité sans l’expliciter à l’excès.
- source_word: συκῆ
  choice: un figuier
  rationale: Le nom désigne l’arbre, et non son fruit.
- source_word: ἐλαίας ποιῆσαι
  choice: produire des olives
  rationale: Dans ce contexte agricole, ποιέω signifie produire ou porter du fruit. « Produire » est clair et actuel.
- source_word: ἄμπελος
  choice: une vigne
  rationale: « Vigne » désigne naturellement en français la plante qui produit des raisins et maintient le parallélisme agricole.
- source_word: σῦκα
  choice: des figues
  rationale: Équivalent direct du pluriel grec désignant les fruits.
- source_word: οὔτε ἁλυκὸν
  choice: De même, l’eau salée ne peut pas
  rationale: 'Le grec est elliptique : ἁλυκόν, adjectif substantivé, signifie « ce qui est salé » ou « [une eau/source] salée ». La formulation française explicite l’eau sans imposer dans le texte principal l’image plus précise d’une source.'
- source_word: γλυκὺ ποιῆσαι ὕδωρ
  choice: produire de l’eau douce
  rationale: γλυκύς signifie littéralement « doux » ou « sucré », mais appliqué à l’eau et opposé à « salé », il désigne naturellement de l’eau douce.
theological_decisions:
- issue: Portée de l’adresse ἀδελφοί μου
  choice: Conserver « Mes frères » dans le texte principal et signaler la portée mixte possible en note
  alternative: « Mes frères et sœurs »
  rationale: Cette solution respecte la forme masculine du grec tout en évitant de laisser croire que l’exhortation s’adresse nécessairement aux seuls hommes.
- issue: Ellipse de la dernière proposition
  choice: « l’eau salée »
  alternative: « une source salée »
  rationale: Le contexte du verset précédent évoque une source, mais le grec de ce verset ne répète pas explicitement ce nom. Le texte principal reste donc moins spécifique, tandis que la note préserve l’autre compréhension possible.
translation_notes:
  register: Français international moderne, naturel et digne. La question rhétorique conserve l’attente d’une réponse négative. Le parallélisme agricole reste concis, avec omission naturelle du verbe dans « ou une vigne des figues ? ». La dernière proposition explicite sobrement l’ellipse grecque, tandis que la note en conserve l’autre lecture contextuelle.
