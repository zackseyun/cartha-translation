id: JAS.3.1
reference: James 3:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Μὴ πολλοὶ διδάσκαλοι γίνεσθε, ἀδελφοί μου, εἰδότες ὅτι μεῖζον κρίμα λημψόμεθα·
base_translation:
  language: en
  yaml_path: translation/nt/james/003/001.yaml
  text: Not many of you should become teachers[a], my brothers, knowing that we will receive a greater judgment.
translation:
  language: fr
  text: Ne soyez pas nombreux à devenir enseignants, mes frères[a], sachant que nous recevrons un jugement plus sévère.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ici, « frères » désigne probablement toute la communauté, y compris les sœurs.
    reason: Préciser la portée inclusive probable de l’apostrophe masculine plurielle ἀδελφοί.
lexical_decisions:
- source_word: Μὴ πολλοὶ
  choice: Ne soyez pas nombreux à
  rationale: Avec l’impératif présent γίνεσθε, μή formule ici une exhortation négative. Cette tournure conserve l’idée que beaucoup ne devraient pas entrer dans ce rôle, sans transformer l’énoncé en interdiction absolue.
- source_word: διδάσκαλοι
  choice: enseignants
  rationale: Le terme désigne ceux qui enseignent. « Enseignants » est naturel en français et n’impose pas au texte la notion plus précise d’une fonction ecclésiale officielle.
- source_word: γίνεσθε
  choice: devenir
  rationale: Le verbe met l’accent sur le fait d’accéder à cette position ou d’assumer ce rôle, plutôt que sur le simple fait de l’être.
- source_word: ἀδελφοί μου
  choice: mes frères
  rationale: La forme masculine du grec est conservée dans le texte. Comme cette apostrophe peut viser l’ensemble de la communauté, femmes comprises, cette portée probable est signalée en note.
- source_word: εἰδότες
  choice: sachant
  rationale: Le participe est rendu par un participe français, ce qui préserve sa relation souple avec l’exhortation sans imposer exclusivement une valeur causale.
- source_word: μεῖζον
  choice: plus sévère
  rationale: Avec κρίμα, le comparatif exprime un jugement accru en gravité. « Plus sévère » rend naturellement cette portée en français, là où « plus grand » serait peu idiomatique.
- source_word: κρίμα
  choice: jugement
  rationale: « Jugement » garde la latitude du terme grec, qui peut désigner l’acte de juger ou son résultat, sans préciser qu’il s’agit nécessairement d’une condamnation finale.
- source_word: λημψόμεθα
  choice: nous recevrons
  rationale: Cette traduction conserve le futur et la première personne du pluriel, par laquelle l’auteur semble s’inclure parmi ceux qui enseignent.
theological_decisions:
- issue: Portée de ἀδελφοί μου dans une communauté mixte
  choice: « mes frères » dans le texte, avec une note indiquant la portée inclusive probable
  alternative: « mes frères et sœurs »
  rationale: La formulation maintient le genre grammatical explicite de l’original tout en informant le lecteur que l’adresse vise vraisemblablement toute la communauté.
- issue: Sens de κρίμα dans l’avertissement adressé aux enseignants
  choice: jugement
  alternative: condamnation
  rationale: Le verset affirme une responsabilité accrue pour ceux qui enseignent, mais κρίμα ne requiert pas à lui seul l’idée plus déterminée d’une condamnation finale.
- issue: Valeur du comparatif μεῖζον appliqué au jugement
  choice: un jugement plus sévère
  alternative: un plus grand jugement
  rationale: Le français idiomatique exprime ici la grandeur comparative comme une sévérité accrue. Cela préserve la force de l’avertissement sans préciser davantage la nature du jugement.
translation_notes:
  register: Français international moderne, digne et direct. La syntaxe participiale de « sachant » conserve la légère ouverture du grec, tandis que « jugement plus sévère » exprime naturellement le comparatif sans le renforcer jusqu’à « condamnation ».
