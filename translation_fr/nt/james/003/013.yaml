  text: Τίς σοφὸς καὶ ἐπιστήμων ἐν ὑμῖν; δειξάτω ἐκ τῆς καλῆς ἀναστροφῆς τὰ ἔργα αὐτοῦ ἐν πραΰτητι σοφίας.
base_translation:
  language: en
  yaml_path: translation/nt/james/003/013.yaml
  text: Who is wise and understanding among you? Let him show his works by his good conduct[b][a], in the meekness of wisdom.
translation:
  language: fr
  text: Qui parmi vous est sage et intelligent ? Qu’il montre ses œuvres par sa bonne conduite, avec la douceur de la sagesse.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « dans la douceur de la sagesse ». Le grec peut présenter la sagesse comme la source de cette douceur ou comme ce qui la caractérise.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τίς σοφὸς καὶ ἐπιστήμων ἐν ὑμῖν
  choice: Qui parmi vous est sage et intelligent ?
  rationale: « Qui parmi vous » rend naturellement la question rhétorique. « Sage et intelligent » conserve les deux qualités, ἐπιστήμων désignant ici une personne qui possède du discernement plutôt qu’un simple savoir théorique.
- source_word: δειξάτω
  choice: Qu’il montre
  rationale: Rend l’impératif aoriste à la troisième personne du singulier et conserve la forme masculine singulière à portée représentative.
- source_word: ἐκ τῆς καλῆς ἀναστροφῆς
  choice: par sa bonne conduite
  rationale: ἀναστροφή désigne la conduite ou la manière de vivre; « bonne conduite » est idiomatique et ἐκ indique ici le moyen ou la manifestation concrète.
- source_word: τὰ ἔργα αὐτοῦ
  choice: ses œuvres
  rationale: « Œuvres » préserve le lien lexical et thématique avec l’emploi de ἔργον dans la lettre de Jacques.
- source_word: ἐν πραΰτητι σοφίας
  choice: accomplies avec la douceur qui vient de la sagesse
  rationale: « Douceur » rend πραΰτης comme force maîtrisée et absence d’arrogance. La formulation comprend le génitif σοφίας comme indiquant la source ou la qualité caractéristique, tout en signalant l’ambiguïté en note.
theological_decisions:
- issue: Genre grammatical et portée représentative de l’impératif
  choice: Qu’il montre
  alternative: Que cette personne montre
  rationale: Le grec emploie un masculin singulier dont la portée peut englober toute personne de la communauté; la traduction conserve cette forme sans limiter l’exhortation aux hommes.
- issue: Rapport entre la douceur et la sagesse
  choice: la douceur qui vient de la sagesse
  alternative: la douceur de la sagesse
  rationale: Le génitif peut exprimer la source ou une qualité caractéristique. Le texte principal retient une relation de source naturelle en français, tandis que la note préserve l’autre lecture possible.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe met clairement « ses œuvres » en relation avec « sa bonne conduite », et la note préserve l’ambiguïté du génitif grec.
