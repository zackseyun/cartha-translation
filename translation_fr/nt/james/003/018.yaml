id: JAS.3.18
reference: James 3:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καρπὸς ⸀δὲ δικαιοσύνης ἐν εἰρήνῃ σπείρεται τοῖς ποιοῦσιν εἰρήνην.
base_translation:
  language: en
  yaml_path: translation/nt/james/003/018.yaml
  text: And the fruit of righteousness is sown in peace by those who make peace[a][b].
translation:
  language: fr
  text: Et le fruit de la justice est semé dans la paix par ceux qui font la paix.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « pour ceux qui font la paix ». Le datif grec peut désigner soit les personnes qui sèment, soit celles au bénéfice desquelles le fruit est semé ; avec le verbe passif, « par ceux » paraît ici le plus naturel.'
    reason: alternative_reading
lexical_decisions:
- source_word: καρπὸς
  choice: fruit
  rationale: « Fruit » conserve directement la métaphore agricole et la forme singulière du grec ; « récolte » expliciterait davantage le résultat sans être nécessaire.
- source_word: δὲ
  choice: Et
  rationale: Ici, δέ assure une transition légère plutôt qu’une opposition forte. « Et » relie naturellement cette affirmation à la description précédente de la sagesse d’en haut.
- source_word: δικαιοσύνης
  choice: justice
  rationale: « Justice » est le correspondant français naturel de δικαιοσύνη et peut évoquer à la fois la conduite droite et la justesse des relations. La construction « fruit de la justice » préserve l’indétermination du génitif grec.
- source_word: ἐν εἰρήνῃ
  choice: dans la paix
  rationale: Cette formulation proche du grec conserve l’ambiguïté entre le cadre et la manière paisible dont se fait l’ensemencement.
- source_word: σπείρεται
  choice: est semé
  rationale: Le présent passif grec est rendu simplement par un présent passif français, tout en maintenant l’image des semailles.
- source_word: τοῖς ποιοῦσιν εἰρήνην
  choice: par ceux qui font la paix
  rationale: Avec le verbe passif, le datif peut naturellement désigner les agents de l’action. « Ceux qui font la paix » reflète aussi explicitement ποιέω avec εἰρήνην et conserve la répétition voulue de « paix ».
theological_decisions:
- issue: Sens de « fruit de la justice »
  choice: Conserver la formule ouverte « fruit de la justice », qui peut désigner un fruit caractérisé par la justice ou une récolte consistant en justice.
  alternative: Expliciter soit « le fruit produit par la justice », soit « une récolte de justice ».
  rationale: Le génitif δικαιοσύνης n’impose pas à lui seul une seule relation précise. Une traduction non développée préserve la tension entre source, caractère et résultat de la justice.
- issue: Fonction du datif τοῖς ποιοῦσιν εἰρήνην
  choice: 'Comprendre le datif comme indiquant les agents : « par ceux qui font la paix ».'
  alternative: 'Le comprendre comme indiquant les bénéficiaires : « pour ceux qui font la paix ».'
  rationale: La lecture agentive s’accorde bien avec le passif σπείρεται et avec l’action concrète de faire la paix, mais la lecture bénéficiaire reste grammaticalement possible et est donc signalée en note.
translation_notes:
  register: Français international moderne, clair et digne. La répétition de « paix » est maintenue parce qu’elle appartient à la structure et à l’insistance du texte grec. La formulation reste volontairement concise et métaphorique.
