id: JAS.3.16
reference: James 3:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὅπου γὰρ ζῆλος καὶ ἐριθεία, ἐκεῖ ἀκαταστασία καὶ πᾶν φαῦλον πρᾶγμα.
base_translation:
  language: en
  yaml_path: translation/nt/james/003/016.yaml
  text: For where jealousy and selfish ambition are[b][a], there is disorder and every vile practice.
translation:
  language: fr
  text: Car là où il y a jalousie[a] et ambition égoïste, il y a du désordre et toute mauvaise action[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « envie ». Le terme grec peut aussi signifier « zèle », mais le contexte lui donne ici un sens clairement négatif.
    reason: lexical_alternative
  - marker: b
    text: Ou « toute œuvre mauvaise »; littéralement, « toute chose mauvaise » ou « vile ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπου
  choice: là où
  rationale: Introduit une situation générale et forme naturellement en français la corrélation « là où… il y a… ».
- source_word: γὰρ
  choice: Car
  rationale: Conserve le lien explicatif avec ce qui précède dans un registre digne et courant.
- source_word: ζῆλος
  choice: jalousie
  rationale: Le contexte immédiat impose le sens négatif du terme; « jalousie » demeure naturel, tandis que « envie » est également possible.
- source_word: ἐριθεία
  choice: ambition égoïste
  rationale: Rend l'idée de recherche intéressée de son propre avantage, avec ses effets de rivalité et de division.
- source_word: ἐκεῖ
  choice: il y a
  rationale: La reprise locative grecque est exprimée idiomatiquement par la construction corrélative française « là où… il y a… »; traduire séparément par « là » serait lourd.
- source_word: ἀκαταστασία
  choice: désordre
  rationale: Désigne ici la perturbation et le désordre au sein de la communauté, plutôt qu'une simple confusion mentale.
- source_word: πᾶν
  choice: toutes sortes de
  rationale: Avec le singulier collectif πρᾶγμα, cette formulation française transmet naturellement l'étendue générale sans suggérer une seule pratique.
- source_word: φαῦλον
  choice: mauvaises
  rationale: Exprime clairement la valeur morale négative de φαῦλος sans recourir à un terme français excessivement marqué.
- source_word: πρᾶγμα
  choice: pratiques
  rationale: Dans ce contexte moral, « pratiques » désigne idiomatiquement les actes et conduites, là où « choses » serait imprécis et peu naturel.
theological_decisions:
- issue: Valeur morale de ζῆλος dans le contexte
  choice: Terme négatif rendu par « jalousie »
  alternative: « envie »; le sens neutre ou positif « zèle »
  rationale: Jacques 3.14-15 présente explicitement ce ζῆλος comme amer et associé à une sagesse terrestre. Le rendre par « zèle » brouillerait l'argument, tandis que « envie » reste une possibilité lexicale authentique signalée en note.
- issue: Portée de πᾶν φαῦλον πρᾶγμα
  choice: « toutes sortes de pratiques mauvaises »
  alternative: « toute mauvaise action » ou, plus littéralement, « toute chose mauvaise »
  rationale: La formulation choisie conserve la portée générale et morale de l'expression tout en restant naturelle, sans préciser indûment la nature exacte des actes.
translation_notes:
  register: Français international moderne, clair et digne. La structure explicative et la corrélation locative sont conservées sans calque lourd. Les notes maintiennent les principales possibilités lexicales du grec.
