id: JAS.3.7
reference: James 3:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: πᾶσα γὰρ φύσις θηρίων τε καὶ πετεινῶν ἑρπετῶν τε καὶ ἐναλίων δαμάζεται καὶ δεδάμασται τῇ φύσει τῇ ἀνθρωπίνῃ·
base_translation:
  language: en
  yaml_path: translation/nt/james/003/007.yaml
  text: For every kind of beast and bird[a], of reptile and sea creature, is being tamed and has been tamed by humankind.
translation:
  language: fr
  text: En effet, toutes les espèces de bêtes sauvages et d’oiseaux, de reptiles et d’animaux marins sont domptées et ont été domptées par l’être humain.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « par la nature humaine » ou « par l’humanité ». L’expression grecque peut désigner collectivement les êtres humains ou, de manière plus abstraite, la nature ou la sphère humaine.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶσα ... φύσις
  choice: toutes les espèces
  rationale: Dans cette énumération zoologique, φύσις désigne idiomatiquement une sorte ou une espèce; le pluriel français rend naturellement la portée distributive de πᾶσα.
- source_word: γὰρ
  choice: En effet
  rationale: La particule introduit l’explication de l’affirmation précédente; « En effet » exprime clairement ce lien en français moderne.
- source_word: θηρίων
  choice: bêtes sauvages
  rationale: Le terme désigne couramment des animaux sauvages; ce choix conserve cette nuance tout en restant immédiatement compréhensible.
- source_word: πετεινῶν
  choice: oiseaux
  rationale: Le terme désigne les oiseaux ou créatures ailées; « oiseaux » est ici le rendu français le plus naturel et concis.
- source_word: ἑρπετῶν
  choice: reptiles
  rationale: Même si le mot peut englober plus largement ce qui rampe, « reptiles » convient au catalogue des catégories animales et correspond à l’usage biblique français courant.
- source_word: ἐναλίων
  choice: animaux marins
  rationale: L’adjectif substantivé désigne les êtres vivant dans la mer; « animaux marins » est naturel et suffisamment large.
- source_word: δαμάζεται
  choice: sont domptées
  rationale: Le présent passif exprime un fait général et un processus continu; en français, le présent simple rend naturellement les deux sans la lourdeur de « sont en train d’être domptées ».
- source_word: δεδάμασται
  choice: ont été domptées
  rationale: Le parfait passif présente un domptage accompli dont le résultat demeure; le passé composé le distingue du présent précédent.
- source_word: τῇ φύσει τῇ ἀνθρωπίνῃ
  choice: par l’être humain
  rationale: La formule peut désigner collectivement l’humanité comme agent. « L’être humain » possède en français une valeur générique et évite le sens biologique moderne que pourrait suggérer « race humaine ».
theological_decisions:
- issue: Portée de τῇ φύσει τῇ ἀνθρωπίνῃ
  choice: 'Lecture collective: « par l’être humain »'
  alternative: 'Lecture plus abstraite: « par la nature humaine » ou « par l’humanité »'
  rationale: Dans le contraste entre les espèces animales et la sphère humaine, la lecture collective comme agent du domptage s’intègre le plus naturellement à la syntaxe. Une note conserve toutefois l’ambiguïté réelle de l’expression grecque.
translation_notes:
  register: Français international moderne, digne et accessible. L’énumération garde le rythme du grec, tandis que l’accord au féminin pluriel renvoie à « espèces ». Le présent français évite une tournure progressive artificielle tout en restant distinct du parfait rendu par le passé composé.
