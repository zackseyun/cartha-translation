source:
  edition: SBLGNT
  text: οὕτως καὶ ἡ γλῶσσα μικρὸν μέλος ἐστὶν καὶ ⸂μεγάλα αὐχεῖ⸃. Ἰδοὺ ⸀ἡλίκον πῦρ ἡλίκην ὕλην ἀνάπτει·
base_translation:
  language: en
  yaml_path: translation/nt/james/003/005.yaml
  text: So also the tongue is a small member[a], and yet it boasts of great things[b]. See how small a fire sets ablaze so great a forest.
translation:
  language: fr
  text: De même, la langue est une petite partie du corps, mais elle se vante de grandes choses. Voyez comme un petit feu[a] embrase une si grande forêt[b] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement, la tournure grecque est exclamative et évoque la dimension du feu et de ce qu’il embrase. Certains y comprennent « quel grand feu » plutôt que « un petit feu ». Le texte retient l’idée, suggérée par la comparaison immédiate avec la langue, d’une petite cause produisant un grand effet.
    reason: alternative_reading
  - marker: b
    text: 'Ou : « une si grande quantité de bois » ou « tant de matière combustible ». Le mot grec peut désigner une forêt, du bois ou, plus largement, une matière qui brûle.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γλῶσσα
  choice: la langue
  rationale: Le sens concret de l’organe est conservé, car il fonde la comparaison avec une petite partie du corps; traduire par « parole » expliciterait prématurément la métaphore.
- source_word: μικρὸν μέλος
  choice: une petite partie du corps
  rationale: Cette formulation rend clairement le sens anatomique de μέλος en français moderne. « Un petit membre » serait plus formel, mais peut évoquer une personne appartenant à un groupe.
- source_word: μεγάλα αὐχεῖ
  choice: elle se vante de grandes choses
  rationale: La formulation garde l’idée de vantardise et les « grandes choses » exprimées par l’adjectif neutre pluriel, sans préciser indûment s’il s’agit de prétentions, de paroles ou d’exploits.
- source_word: Ἰδοὺ
  choice: Voyez
  rationale: L’impératif attire naturellement l’attention du lecteur sur l’image qui suit, sans l’archaïsme de « Voici » employé comme interjection solennelle.
- source_word: ἡλίκον πῦρ
  choice: comme un petit feu
  rationale: Dans le contexte, la petitesse du feu répond à celle de la langue et souligne qu’une petite cause produit un effet immense. L’ambiguïté possible de ἡλίκον est signalée en note.
- source_word: ἡλίκην ὕλην
  choice: une si grande forêt
  rationale: ὕλη peut désigner du bois, une matière combustible ou une région boisée. « Forêt » produit en français une image naturelle et immédiatement compréhensible, tandis que « bois » pourrait désigner soit le matériau, soit un petit espace boisé.
- source_word: ἀνάπτει
  choice: embrase
  rationale: Le verbe exprime avec concision le fait d’allumer ou de mettre en feu et convient à l’image d’une forêt incendiée.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. « Petite partie du corps » évite l’ambiguïté moderne de « membre », tandis que « se vante de grandes choses » conserve la tension et la portée ouverte de l’expression grecque. Le point d’exclamation restitue la force exclamative de l’illustration.
