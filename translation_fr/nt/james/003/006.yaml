source:
  edition: SBLGNT
  text: καὶ ἡ γλῶσσα πῦρ, ὁ κόσμος τῆς ⸀ἀδικίας ἡ γλῶσσα καθίσταται ἐν τοῖς μέλεσιν ἡμῶν, ἡ σπιλοῦσα ὅλον τὸ σῶμα καὶ φλογίζουσα τὸν τροχὸν τῆς γενέσεως καὶ φλογιζομένη ὑπὸ τῆς γεέννης.
base_translation:
  language: en
  yaml_path: translation/nt/james/003/006.yaml
  text: And the tongue is a fire. The tongue is set among our members as a world of unrighteousness, staining the whole body and setting on fire the wheel of birth, and being set on fire by Gehenna.
translation:
  language: fr
  text: 'La langue aussi est un feu. La langue se trouve parmi les membres de notre corps comme un monde d’injustice : elle souille[a] le corps tout entier, embrase la roue de la naissance[b] et est elle-même embrasée par la géhenne[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « elle salit le corps tout entier ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « la roue de la naissance »; l’expression peut aussi désigner « le cours de la vie » ou « le cycle de la vie ».
    reason: lexical_alternative
  - marker: c
    text: La géhenne est le terme employé en grec; il est traditionnellement rendu par « l’enfer ».
    reason: alternative_reading
lexical_decisions:
- source_word: γλῶσσα
  choice: langue
  rationale: Conserve l’image concrète de l’organe, qui désigne aussi la parole par métonymie dans le contexte.
- source_word: πῦρ
  choice: un feu
  rationale: Rend naturellement en français le nom attribut sans article grec et maintient la métaphore de la puissance destructrice.
- source_word: κόσμος τῆς ἀδικίας
  choice: un monde d’injustice
  rationale: Préserve l’expression saisissante et sa portée morale sans la réduire à « pleine de mal ».
- source_word: καθίσταται ἐν τοῖς μέλεσιν ἡμῶν
  choice: prend place parmi les membres de notre corps
  rationale: Exprime la position de la langue au sein des parties du corps dans un français compréhensible, sans préciser indûment l’agent de cette disposition.
- source_word: σπιλοῦσα
  choice: souille
  rationale: Rend à la fois l’image de la tache et sa portée de contamination morale.
- source_word: ὅλον τὸ σῶμα
  choice: le corps tout entier
  rationale: Conserve la force totalisante de ὅλον.
- source_word: φλογίζουσα
  choice: embrase
  rationale: Maintient avec concision l’image répétée du feu.
- source_word: τὸν τροχὸν τῆς γενέσεως
  choice: la roue de l’existence
  rationale: Conserve la métaphore difficile de la roue tout en donnant à γένεσις son sens contextuel d’existence ou de vie issue de la naissance.
- source_word: φλογιζομένη
  choice: est elle-même embrasée
  rationale: Préserve le passif et souligne que la langue, qui embrase, reçoit elle-même son feu d’une autre source.
- source_word: ὑπὸ τῆς γεέννης
  choice: par la géhenne
  rationale: Conserve le terme grec sous sa forme française traditionnelle, sans l’assimiler silencieusement à une notion théologique plus générale.
theological_decisions:
- issue: Sens de τὸν τροχὸν τῆς γενέσεως
  choice: la roue de l’existence
  alternative: le cours de la vie / le cycle de la vie
  rationale: Le texte principal garde l’étrangeté de la métaphore grecque sans imposer une seule explication; les formulations interprétatives plus courantes sont signalées en note.
- issue: Traduction de γέεννα
  choice: la géhenne
  alternative: l’enfer
  rationale: Le terme spécifique du grec est maintenu pour préserver sa précision historique et conceptuelle; la traduction traditionnelle est indiquée en note.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe conserve les images fortes et la répétition de « langue » et d’« embraser ». « Membres de notre corps » explicite le sens anatomique de μέλη sans employer le seul mot « membres », potentiellement ambigu en français courant.
