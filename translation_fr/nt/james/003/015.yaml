id: JAS.3.15
reference: James 3:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὐκ ἔστιν αὕτη ἡ σοφία ἄνωθεν κατερχομένη, ἀλλὰ ἐπίγειος, ψυχική, δαιμονιώδης·
base_translation:
  language: en
  yaml_path: translation/nt/james/003/015.yaml
  text: This wisdom is not coming down from above[a], but is earthly, unspiritual, demonic.
translation:
  language: fr
  text: 'Cette sagesse-là ne descend pas d’en haut : elle est terrestre, non spirituelle[a], démoniaque.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « naturelle ». L’adjectif grec peut désigner ce qui relève seulement de la vie naturelle, par opposition à ce qui est spirituel.
    reason: lexical_alternative
lexical_decisions:
- source_word: αὕτη ἡ σοφία
  choice: Cette sagesse-là
  rationale: Le démonstratif renvoie à la prétendue sagesse décrite dans le contexte. « Cette sagesse-là » rend ce renvoi distinctif de façon naturelle en français.
- source_word: ἄνωθεν
  choice: d’en haut
  rationale: Cette expression conserve la formulation spatiale et sa résonance théologique d’origine divine, sans expliciter davantage que le grec.
- source_word: κατερχομένη
  choice: descend
  rationale: Le présent rend naturellement le participe présent et préserve le mouvement exprimé par le verbe grec.
- source_word: ἐπίγειος
  choice: terrestre
  rationale: « Terrestre » maintient le contraste lexical direct avec « d’en haut » sans ajouter la nuance morale plus interprétative de « mondaine ».
- source_word: ψυχική
  choice: non spirituelle
  rationale: Dans ce contexte, l’adjectif s’oppose à ce qui vient d’en haut et relève de ce qui est dépourvu de l’Esprit. Cette formulation est claire en français moderne, tandis que « psychique » serait trompeur et « naturelle » pourrait sembler moralement neutre.
- source_word: δαιμονιώδης
  choice: démoniaque
  rationale: Le terme désigne ce qui appartient aux démons ou en porte le caractère. « Démoniaque » est précis, courant et concis.
theological_decisions:
- issue: Portée de ψυχική dans le contraste entre le naturel et le spirituel
  choice: non spirituelle
  alternative: naturelle
  rationale: « Non spirituelle » exprime la valeur négative du terme dans cette série de trois adjectifs et son opposition implicite à ce qui relève de l’Esprit, sans imposer un système doctrinal particulier. Une note conserve l’autre possibilité lexicale.
translation_notes:
  register: Français international moderne, naturel et digne. La structure brève et cumulative du grec est conservée, ainsi que le contraste entre « d’en haut » et « terrestre ».
