  text: μήτι ἡ πηγὴ ἐκ τῆς αὐτῆς ὀπῆς βρύει τὸ γλυκὺ καὶ τὸ πικρόν;
base_translation:
  language: en
  yaml_path: translation/nt/james/003/011.yaml
  text: Does a spring pour out both sweet and bitter water from the same opening?[a]
translation:
  language: fr
  text: Une source fait-elle jaillir, par la même ouverture, de l’eau douce et de l’eau amère ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « La source fait-elle jaillir, par la même ouverture, le doux et l’amer ? »'
    reason: Alternative lexicale conservant les adjectifs substantivés du grec.
lexical_decisions:
- source_word: μήτι
  choice: fait-elle… ?
  rationale: μήτι introduit une question rhétorique qui appelle une réponse négative. En français, l’interrogation directe, éclairée par le contraste impossible, en restitue naturellement la force sans ajouter une négation absente de la formulation grecque.
- source_word: πηγή
  choice: source
  rationale: πηγή désigne ici une source naturelle d’où jaillit l’eau. « Source » est le terme français courant et précis dans ce contexte.
- source_word: ἐκ τῆς αὐτῆς ὀπῆς
  choice: par la même ouverture
  rationale: ὀπή désigne une ouverture ou un orifice. « Par la même ouverture » conserve l’image physique tout en restant idiomatique en français.
- source_word: βρύει
  choice: fait jaillir
  rationale: βρύω évoque l’action de jaillir ou de couler avec abondance. « Fait jaillir » rend clairement le mouvement de l’eau provenant de la source.
- source_word: τὸ γλυκύ
  choice: de l’eau douce
  rationale: L’adjectif substantivé γλυκύ signifie littéralement « le doux ». Dans le contexte d’une source, « eau douce » explicite le référent naturel sans confondre nécessairement cette qualité avec une saveur sucrée.
- source_word: τὸ πικρόν
  choice: de l’eau amère
  rationale: L’adjectif substantivé πικρόν signifie « l’amer ». « Eau amère » explicite le référent et maintient l’opposition lexicale avec l’eau douce.
