id: JAS.3.10
reference: James 3:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐκ τοῦ αὐτοῦ στόματος ἐξέρχεται εὐλογία καὶ κατάρα. οὐ χρή, ἀδελφοί μου, ταῦτα οὕτως γίνεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/james/003/010.yaml
  text: From the same mouth come blessing and cursing. My brothers[a], these things ought not to be so.
translation:
  language: fr
  text: De la même bouche sortent la bénédiction et la malédiction. Mes frères[a], il ne faut pas qu’il en soit ainsi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Mes frères et sœurs » ; le grec dit « frères », mais, dans ce contexte, Jacques s’adresse probablement à l’ensemble de la communauté croyante.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ τοῦ αὐτοῦ στόματος
  choice: De la même bouche
  rationale: Expression naturelle en français qui conserve l’image d’une seule et même bouche comme source de paroles opposées.
- source_word: ἐξέρχεται
  choice: sortent
  rationale: Le verbe grec est au singulier, mais son sujet coordonné, « la bénédiction et la malédiction », appelle naturellement le pluriel en français.
- source_word: εὐλογία
  choice: la bénédiction
  rationale: Dans ce contexte consacré à l’usage de la parole, le terme désigne une parole de bénédiction; « bénédiction » maintient directement le contraste avec « malédiction ».
- source_word: κατάρα
  choice: la malédiction
  rationale: Ce choix exprime l’acte de maudire tout en formant avec « bénédiction » une opposition française claire et traditionnelle.
- source_word: οὐ χρή
  choice: il ne faut pas
  rationale: Cette tournure courante exprime avec force ce qui ne doit pas ou ne convient pas de se produire, sans alourdir la phrase.
- source_word: ἀδελφοί μου
  choice: Mes frères[a]
  rationale: Le masculin pluriel du grec est conservé dans le texte; une note indique que l’adresse vise vraisemblablement l’ensemble de la communauté croyante.
- source_word: ταῦτα οὕτως γίνεσθαι
  choice: qu’il en soit ainsi
  rationale: Formulation française idiomatique qui conserve οὕτως, « ainsi », et reprend globalement la situation décrite par le pluriel ταῦτα sans paraphrase excessive.
theological_decisions:
- issue: Portée de l’adresse familiale ἀδελφοί μου
  choice: Mes frères
  alternative: Mes frères et sœurs
  rationale: La forme grecque est grammaticalement masculine, mais, dans ce contexte, elle désigne probablement toute la communauté croyante. Le texte conserve la forme source, tandis que la note explicite sa portée inclusive probable.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation conserve l’image concrète de la bouche ainsi que le contraste symétrique entre bénédiction et malédiction.
