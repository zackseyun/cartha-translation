id: JAS.3.17
reference: James 3:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἡ δὲ ἄνωθεν σοφία πρῶτον μὲν ἁγνή ἐστιν, ἔπειτα εἰρηνική, ἐπιεικής, εὐπειθής, μεστὴ ἐλέους καὶ καρπῶν ἀγαθῶν, ⸀ἀδιάκριτος, ἀνυπόκριτος·
base_translation:
  language: en
  yaml_path: translation/nt/james/003/017.yaml
  text: But the wisdom from above is first pure[a], then peaceable, gentle, open to reason, full of mercy and good fruits, impartial, sincere.
translation:
  language: fr
  text: Mais la sagesse d’en haut est d’abord pure, ensuite pacifique, douce, disposée à écouter, pleine de miséricorde et de bons fruits, sans parti pris[a], sincère.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sans division intérieure » ou « sans hésitation ni doute » ; le sens précis du mot grec est incertain.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄνωθεν
  choice: d’en haut
  rationale: Rend directement la métaphore spatiale et maintient le contraste avec la sagesse « terrestre » de Jacques 3.15, sans expliciter davantage par « du ciel ».
- source_word: σοφία
  choice: sagesse
  rationale: Équivalent français usuel et exact dans ce contexte.
- source_word: πρῶτον μὲν
  choice: d’abord
  rationale: Marque naturellement en français le premier élément d’une description ordonnée.
- source_word: ἁγνή
  choice: pure
  rationale: Exprime clairement la pureté morale et l’intégrité sans introduire la nuance plus étroite de chasteté.
- source_word: ἔπειτα
  choice: ensuite
  rationale: Préserve la progression indiquée par le grec.
- source_word: εἰρηνική
  choice: pacifique
  rationale: Décrit une disposition qui recherche et favorise la paix, plutôt qu’un simple état de tranquillité.
- source_word: ἐπιεικής
  choice: douce
  rationale: Terme courant qui restitue l’idée de douceur et de modération, même si le grec peut également évoquer l’indulgence ou l’équité.
- source_word: εὐπειθής
  choice: disposée à écouter
  rationale: Ce rare adjectif évoque une attitude réceptive, raisonnable et non obstinée. Cette formulation évite de suggérer une soumission aveugle ou une crédulité facile.
- source_word: μεστὴ ἐλέους
  choice: pleine de miséricorde
  rationale: Conserve l’idée d’abondance portée par μεστή et le sens moral de ἔλεος dans un registre biblique compréhensible.
- source_word: καρπῶν ἀγαθῶν
  choice: de bons fruits
  rationale: Respecte le pluriel grec et conserve la métaphore des effets visibles de cette sagesse.
- source_word: ἀδιάκριτος
  choice: sans parti pris
  rationale: Dans cette liste de qualités éthiques, cette expression rend naturellement l’idée d’impartialité. Le terme grec demeure difficile et ses autres sens possibles sont signalés en note.
- source_word: ἀνυπόκριτος
  choice: sincère
  rationale: Rend en français actuel l’absence d’hypocrisie et de faux-semblant.
theological_decisions:
- issue: Interprétation de ἀδιάκριτος
  choice: sans parti pris
  alternative: sans division intérieure ; sans hésitation ni doute
  rationale: Le mot peut évoquer l’absence de partialité, mais aussi ce qui est indivis ou exempt d’incertitude. Les préoccupations de Jacques concernant le favoritisme comme la duplicité intérieure donnent un appui contextuel aux deux axes. Le texte principal retient le sens social et moral qui s’intègre le mieux à la liste, tandis que la note préserve l’ambiguïté réelle.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve l’accumulation rythmée de qualités du grec. « Disposée à écouter » est plus naturel et moins équivoque que « facile à persuader », tandis que « miséricorde » maintient le registre biblique sans être archaïque. Le marqueur de note est placé après « sans parti pris », qui traduit effectivement ἀδιάκριτος.
