id: JAS.3.8
reference: James 3:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τὴν δὲ γλῶσσαν οὐδεὶς ⸂δαμάσαι δύναται ἀνθρώπων⸃· ⸀ἀκατάστατον κακόν, μεστὴ ἰοῦ θανατηφόρου.
base_translation:
  language: en
  yaml_path: translation/nt/james/003/008.yaml
  text: But no one among men is able to tame the tongue[a]. It is a restless evil[b], full of deadly poison.
translation:
  language: fr
  text: Mais aucun être humain ne peut dompter la langue. C’est un mal sans repos[a], plein d’un poison mortel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un mal instable » ou « un mal indiscipliné ».
    reason: lexical_alternative
lexical_decisions:
- source_word: γλῶσσαν
  choice: la langue
  rationale: Conserve l’image concrète déjà établie dans le passage pour désigner la parole humaine.
- source_word: οὐδεὶς … ἀνθρώπων
  choice: aucun être humain
  rationale: Rend naturellement en français le génitif partitif, littéralement « personne parmi les humains », sans limiter indûment l’énoncé aux hommes de sexe masculin.
- source_word: δαμάσαι δύναται
  choice: ne peut dompter
  rationale: « Dompter » préserve le lien verbal avec les animaux domptés dans le contexte immédiat.
- source_word: ἀκατάστατον κακόν
  choice: un mal instable
  rationale: « Instable » maintient la portée de désordre, d’inconstance et d’absence de maîtrise du terme grec, sans la réduire à une seule nuance.
- source_word: μεστὴ ἰοῦ θανατηφόρου
  choice: plein d’un poison mortel
  rationale: Expression française claire qui conserve l’image létale du grec; l’accord au masculin se fait avec le prédicat « mal ».
theological_decisions:
- issue: Portée anthropologique de οὐδεὶς … ἀνθρώπων
  choice: aucun être humain
  alternative: personne parmi les humains
  rationale: Le grec vise tout membre de l’humanité. La formulation choisie respecte cette portée générale et reste naturelle en français.
- issue: Caractère absolu de l’incapacité humaine
  choice: ne peut dompter
  alternative: n’est capable de dompter
  rationale: La formulation conserve sans atténuation l’affirmation du texte concernant l’incapacité humaine, sans ajouter d’explication doctrinale.
- issue: Nuance de ἀκατάστατον
  choice: instable
  alternative: sans repos ; indiscipliné
  rationale: Le terme admet plusieurs nuances liées à l’instabilité et au désordre; le texte retient la valeur lexicale large et signale les principales possibilités en note.
translation_notes:
  register: Français international moderne, courant et digne. La syntaxe est concise et l’image de la langue domptée est conservée. Le marqueur [a] figure dans le texte principal.
