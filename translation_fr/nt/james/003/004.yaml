source:
  edition: SBLGNT
  text: ἰδοὺ καὶ τὰ πλοῖα, τηλικαῦτα ὄντα καὶ ὑπὸ ⸂ἀνέμων σκληρῶν⸃ ἐλαυνόμενα, μετάγεται ὑπὸ ἐλαχίστου πηδαλίου ὅπου ⸂ἡ ὁρμὴ τοῦ εὐθύνοντος βούλεται⸃·
base_translation:
  language: en
  yaml_path: translation/nt/james/003/004.yaml
  text: 'Look also at the ships: though they are so large and are driven by strong winds[a], they are steered by a very small rudder wherever the inclination of the one steering wills.'
translation:
  language: fr
  text: 'Voyez aussi les navires : bien qu’ils soient si grands et poussés par des vents violents, ils sont dirigés par un gouvernail minuscule, là où le veut le désir de celui qui tient la barre[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « là où celui qui tient la barre veut aller ». Plus littéralement : « là où le veut l’élan de celui qui dirige ».'
    reason: La note offre une formulation idiomatique tout en signalant la construction plus littérale, dans laquelle l’élan ou le désir de la personne qui dirige est le sujet de « veut ».
lexical_decisions:
- source_word: ἰδοὺ καὶ τὰ πλοῖα
  choice: Voyez aussi les navires
  rationale: « Voyez » fonctionne comme une invitation actuelle à porter attention, tandis que « aussi » relie cet exemple à celui du verset précédent.
- source_word: τηλικαῦτα ὄντα
  choice: bien qu’ils soient si grands
  rationale: La tournure concessive fait ressortir naturellement le contraste entre la grande taille des navires et le gouvernail minuscule.
- source_word: ὑπὸ ἀνέμων σκληρῶν ἐλαυνόμενα
  choice: poussés par des vents violents
  rationale: Dans ce contexte, σκληρῶν évoque la force rude des vents ; « violents » est idiomatique et conserve cette intensité. Le passif de ἐλαυνόμενα est maintenu.
- source_word: μετάγεται
  choice: ils sont dirigés
  rationale: Le verbe exprime le changement de direction produit au moyen du gouvernail. « Dirigés » convient au contexte nautique sans rendre le mouvement excessivement technique.
- source_word: ὑπὸ ἐλαχίστου πηδαλίου
  choice: par un gouvernail minuscule
  rationale: « Minuscule » restitue la valeur intensive du superlatif et souligne le contraste de taille sans suggérer qu’il s’agit littéralement du plus petit gouvernail possible.
- source_word: ὅπου ἡ ὁρμὴ τοῦ εὐθύνοντος βούλεται
  choice: partout où le veut l’inclination de celui qui tient la barre
  rationale: Cette formulation conserve la structure inhabituelle du grec, où l’inclination de la personne qui dirige est sujet de « veut », tout en donnant à εὐθύνων une expression nautique française naturelle.
theological_decisions:
- issue: Degré d’explicitation de la volonté de celui qui dirige
  choice: partout où le veut l’inclination de celui qui tient la barre
  alternative: partout où celui qui tient la barre veut aller
  rationale: Le texte principal préserve la tension lexicale et la légère personnification de ὁρμή avec βούλεται, au lieu de réduire la proposition à la seule volonté du pilote. La lecture plus fluide est signalée en note.
translation_notes:
  register: Français international moderne, clair et digne. L’image nautique reste immédiatement compréhensible ; « celui qui tient la barre » évite un titre technique inutile tout en étant plus naturel que « celui qui dirige » dans le texte principal.
