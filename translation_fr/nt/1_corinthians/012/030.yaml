  source_fidelity: Le projet rend correctement χαρίσματα (« dons »), le pluriel marqué de ἰαμάτων (« guérisons »), γλώσσαις λαλοῦσιν (« parlent en langues ») et διερμηνεύουσιν (« interprètent »). Toutefois, « Tous ont-ils… ? » est une question française essentiellement neutre et ne rend pas suffisamment la réponse négative attendue de μή. Une formulation avec « pas tous » et la question finale conserve nettement cette valeur rhétorique sans ajouter d’interprétation doctrinale.
  naturalness: La formulation révisée est naturelle en français international moderne et maintient le parallélisme de la série. « Ils n’ont pas tous… » évite l’ambiguïté de portée que pourrait créer « Tous ne… pas ».
  terminology: « Dons de guérisons », bien que marqué en français, est justifié par les deux pluriels grecs et convient au registre biblique. « Parler en langues » et « interpréter » restent non restrictifs et fidèles au contexte. La note proposant « en langages » n’est pas idiomatique en français et n’apporte pas une alternative utile.
