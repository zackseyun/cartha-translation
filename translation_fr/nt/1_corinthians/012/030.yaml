source:
  edition: SBLGNT
  text: μὴ πάντες χαρίσματα ἔχουσιν ἰαμάτων; μὴ πάντες γλώσσαις λαλοῦσιν; μὴ πάντες διερμηνεύουσιν;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/030.yaml
  text: Not all have gifts of healings[a], do they? Not all speak in tongues, do they? Not all interpret[b], do they?
translation:
  language: fr
  text: Ils n’ont pas tous des dons de guérisons[a], n’est-ce pas ? Ils ne parlent pas tous en langues, n’est-ce pas ? Ils n’interprètent pas tous, n’est-ce pas ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « des dons de guérisons » ; le mot grec traduit par « guérisons » est au pluriel.'
    reason: Précision sur la forme plurielle inhabituelle de l’expression grecque.
lexical_decisions:
- source_word: μὴ πάντες
  choice: Tous ont-ils… ?
  rationale: 'La tournure interrogative répétée est naturelle en français et, dans cette série rhétorique, appelle chaque fois une réponse négative : tous ne possèdent pas chacun de ces dons.'
- source_word: χαρίσματα
  choice: dons
  rationale: Dans ce contexte, χάρισμα désigne un don accordé par grâce. « Dons » est clair et naturel, tandis que la source gracieuse de ces dons ressort de l’ensemble du chapitre.
- source_word: ἰαμάτων
  choice: de guérisons
  rationale: Le pluriel « guérisons » conserve le nombre du grec ἰαμάτων et évite de réduire l’expression à une faculté abstraite unique.
- source_word: γλώσσαις
  choice: en langues
  rationale: Dans 1 Corinthiens 12–14, γλῶσσαις désigne le phénomène charismatique traditionnellement appelé le parler « en langues ». Cette formulation reste intelligible sans préciser indûment la nature de ces langues.
- source_word: λαλοῦσιν
  choice: parlent
  rationale: Le présent exprime ici une caractéristique générale ; le présent simple français convient.
- source_word: διερμηνεύουσιν
  choice: interprètent
  rationale: Dans le contexte du parler en langues, διερμηνεύω signifie rendre l’énoncé intelligible. « Interprètent » préserve ce sens sans imposer qu’il s’agisse uniquement d’une traduction entre langues humaines.
theological_decisions:
- issue: Valeur rhétorique des questions introduites par μή
  choice: Formuler trois questions rhétoriques dont la réponse attendue est négative
  alternative: 'Employer des interrogations neutres ou expliciter : « Tous ne… pas, n’est-ce pas ? »'
  rationale: Le grec attend une réponse négative et souligne que tous les membres du corps ne reçoivent pas les mêmes dons. La série interrogative française préserve cette force sans recourir à une négation susceptible d’être ambiguë avec « tous ».
- issue: Nature du parler en langues et de son interprétation
  choice: Employer « en langues » et « interprètent » sans définir davantage le phénomène
  alternative: Rendre par « en langues étrangères » et « traduisent »
  rationale: Le passage ne tranche pas ici toutes les questions concernant la nature des langues. Une formulation non restrictive conserve l’ambiguïté légitime du texte.
translation_notes:
  register: Français international moderne, sobre et digne. Le parallélisme des trois questions reproduit le rythme du grec. « Guérisons » garde volontairement le pluriel marqué de la source, et « en langues » reprend l’expression usuelle dans ce contexte biblique.
