  text: ἑκάστῳ δὲ δίδοται ἡ φανέρωσις τοῦ πνεύματος πρὸς τὸ συμφέρον.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/007.yaml
  text: But to each one the manifestation of the Spirit is given for the common good[a].
translation:
  language: fr
  text: Mais à chacun est donnée la manifestation de l’Esprit, pour le bien de tous[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en vue de ce qui est utile » ou « pour l’utilité commune ».
    reason: Le grec désigne littéralement ce qui est utile ou avantageux; le contexte suggère, sans l’énoncer explicitement dans cette expression, le bien de toute la communauté.
lexical_decisions:
- source_word: ἑκάστῳ
  choice: à chacun
  rationale: 'Le datif singulier a une valeur distributive : chaque personne au sein de la communauté reçoit cette manifestation.'
- source_word: δὲ
  choice: Mais
  rationale: La conjonction marque ici une légère opposition ou une transition par rapport à la diversité mentionnée précédemment, sans introduire un contraste absolu.
- source_word: δίδοται
  choice: est donnée
  rationale: Cette formulation directe conserve le présent passif et présente la manifestation comme un don reçu.
- source_word: φανέρωσις
  choice: manifestation
  rationale: Le terme désigne le fait de rendre visible ou évident. « Manifestation » convient au contexte, où l’action de l’Esprit devient perceptible à travers les dons.
- source_word: τοῦ πνεύματος
  choice: de l’Esprit
  rationale: Le contexte immédiat désigne l’Esprit saint. La majuscule identifie ce référent sans ajouter « saint », absent de l’expression grecque.
- source_word: πρὸς τὸ συμφέρον
  choice: pour le bien de tous
  rationale: L’expression désigne ce qui est avantageux ou utile. Le contexte du corps et des dons distribués à ses membres favorise ici une formulation qui explicite leur orientation communautaire, tout en signalant en note la formulation plus générale possible.
theological_decisions:
- issue: Référent de « l’Esprit »
  choice: L’expression renvoie à l’Esprit saint.
  alternative: Un esprit au sens générique.
  rationale: Dans le contexte immédiat, le même Esprit est présenté à plusieurs reprises comme la source des dons. La traduction garde toutefois la forme sobre « l’Esprit », conformément au grec.
- issue: Portée de συμφέρον
  choice: Le bénéfice visé est celui de l’ensemble de la communauté.
  alternative: Ce qui est utile ou avantageux, sans précision explicite des bénéficiaires.
  rationale: Le mot grec peut exprimer l’utilité en général, mais l’argument du chapitre sur les membres d’un même corps soutient la portée communautaire. La note préserve l’ambiguïté lexicale.
translation_notes:
  register: Français international moderne, clair et digne. L’ordre des mots reste proche du grec tout en étant naturel; « manifestation » conserve la précision théologique du terme source, et la note maintient l’ambiguïté de la dernière expression.
