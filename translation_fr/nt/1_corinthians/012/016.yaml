reference: 1 Corinthians 12:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἐὰν εἴπῃ τὸ οὖς· Ὅτι οὐκ εἰμὶ ὀφθαλμός, οὐκ εἰμὶ ἐκ τοῦ σώματος, οὐ παρὰ τοῦτο οὐκ ἔστιν ἐκ τοῦ σώματος·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/016.yaml
  text: And if the ear says[a], ‘Because I am not an eye, I am not of the body,’ it is not for this reason not of the body.
translation:
  language: fr
  text: 'Et si l’oreille dit[a] : « Parce que je ne suis pas un œil, je ne fais pas partie du corps », elle n’en fait pas moins partie du corps.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement, le grec répète « être du corps » : « je ne suis pas du corps » … « ce n’est pas pour cela qu’elle n’est pas du corps ».'
    reason: La note signale la répétition rhétorique et la construction négative du grec, rendues plus idiomatiquement dans le texte.
lexical_decisions:
- source_word: καὶ
  choice: Et
  rationale: Conjonction simple qui relie ce nouvel exemple à celui du verset précédent.
- source_word: ἐὰν εἴπῃ
  choice: si … dit
  rationale: ἐὰν avec le subjonctif aoriste introduit ici une hypothèse générale ; le présent français rend naturellement cette valeur.
- source_word: τὸ οὖς
  choice: l’oreille
  rationale: Terme anatomique ordinaire, personnifié dans la comparaison.
- source_word: Ὅτι
  choice: Parce que
  rationale: Dans les paroles rapportées, ὅτι exprime la raison invoquée par l’oreille, plutôt qu’une simple marque de citation.
- source_word: ὀφθαλμός
  choice: un œil
  rationale: Équivalent anatomique direct, avec l’article indéfini naturel après « je ne suis pas ».
- source_word: ἐκ τοῦ σώματος
  choice: faire partie du corps
  rationale: Dans ce contexte d’appartenance organique, cette expression rend clairement et naturellement le sens de ἐκ τοῦ σώματος en français.
- source_word: οὐ παρὰ τοῦτο οὐκ ἔστιν ἐκ τοῦ σώματος
  choice: elle n’en fait pas moins partie du corps
  rationale: 'Cette tournure française conserve la réfutation énergique : la raison alléguée ne supprime aucunement l’appartenance de l’oreille au corps, tout en évitant une succession de négations obscure.'
theological_decisions:
- issue: Degré de littéralité dans la métaphore du corps
  choice: Exprimer explicitement l’appartenance par « faire partie du corps », en répétant cette formulation dans les deux membres.
  alternative: « être du corps … ce n’est pas pour cela qu’elle n’est pas du corps »
  rationale: Le grec répète ἐκ τοῦ σώματος et oppose directement l’affirmation de l’oreille à sa réfutation. La traduction garde cette répétition conceptuelle sans ajouter d’explication ecclésiologique ni résoudre la métaphore au-delà du texte.
translation_notes:
  register: Français international moderne, clair et digne. La personnification est maintenue par « l’oreille dit » puis reprise par le pronom féminin « elle ». La formule « n’en fait pas moins partie » reste courante tout en conservant la vigueur argumentative de l’original.
