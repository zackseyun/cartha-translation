reference: 1 Corinthians 12:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὐ δύναται δὲ ὁ ὀφθαλμὸς εἰπεῖν τῇ χειρί· Χρείαν σου οὐκ ἔχω, ἢ πάλιν ἡ κεφαλὴ τοῖς ποσίν· Χρείαν ὑμῶν οὐκ ἔχω·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/021.yaml
  text: But the eye cannot say to the hand[a], ‘I have no need of you,’ or again the head to the feet, ‘I have no need of you.’
translation:
  language: fr
  text: 'Mais l’œil ne peut pas dire à la main : « Je n’ai pas besoin de toi », ni la tête ne peut pas dire aux pieds : « Je n’ai pas besoin de vous. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐ δύναται
  choice: ne peut pas
  rationale: Exprime naturellement l’incapacité indiquée par la négation avec δύναμαι, et non une simple inconvenance.
- source_word: δὲ
  choice: Mais
  rationale: Marque le contraste avec le développement précédent sur l’interdépendance des parties du corps.
- source_word: ὁ ὀφθαλμός / τῇ χειρί / ἡ κεφαλή / τοῖς ποσίν
  choice: l’œil / à la main / la tête / aux pieds
  rationale: Conserve sans l’expliciter l’image concrète du corps qui structure l’argument de Paul.
- source_word: Χρείαν σου οὐκ ἔχω
  choice: Je n’ai pas besoin de toi
  rationale: Rend directement χρεία et respecte le singulier de σου, adressé à la main.
- source_word: ἢ πάλιν
  choice: ni, à son tour
  rationale: Dans la construction négative française, « ni » introduit naturellement le second exemple, tandis que « à son tour » restitue la reprise analogue signalée par πάλιν.
- source_word: Χρείαν ὑμῶν οὐκ ἔχω
  choice: Je n’ai pas besoin de vous
  rationale: Le français distingue clairement le pluriel ὑμῶν, adressé aux pieds, du singulier employé avec la main.
theological_decisions:
- issue: Image du corps et interdépendance dans l’Église
  choice: Conserver littéralement les parties du corps sans ajouter d’explication dans le verset
  alternative: Remplacer ou compléter l’image par une référence explicite aux membres de l’Église
  rationale: La portée théologique repose sur la métaphore elle-même; l’expliciter dans le texte dépasserait ce que dit directement le grec.
translation_notes:
  register: Français moderne, courant et digne. Le tutoiement singulier (« toi ») puis le pluriel (« vous ») reproduisent une distinction grammaticale visible en grec, si bien qu’aucune note n’est nécessaire. L’ellipse de « peut » devant « dire » dans le second membre reste naturelle et conserve la structure resserrée de l’original.
