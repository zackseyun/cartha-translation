  text: ἐὰν εἴπῃ ὁ πούς· Ὅτι οὐκ εἰμὶ χείρ, οὐκ εἰμὶ ἐκ τοῦ σώματος, οὐ παρὰ τοῦτο οὐκ ἔστιν ἐκ τοῦ σώματος;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/015.yaml
  text: If the foot says[a], “Because I am not a hand, I am not of the body,” it is not for this reason not of the body, is it?
translation:
  language: fr
  text: 'Si le pied dit : « Puisque je ne suis pas une main, je ne fais pas partie du corps », ce n’est pas pour autant qu’il ne fait pas partie du corps, n’est-ce pas ?'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐὰν εἴπῃ
  choice: Si ... dit
  rationale: ἐὰν suivi de l’aoriste subjonctif introduit ici une condition générale; « Si ... dit » est naturel en français moderne et garde la valeur hypothétique.
- source_word: ὁ πούς
  choice: le pied
  rationale: L’image concrète du membre corporel doit être conservée, car elle structure la métaphore de Paul.
- source_word: Ὅτι
  choice: Puisque
  rationale: ὅτι introduit ici la raison invoquée par le pied. « Puisque » rend naturellement le raisonnement formulé par celui-ci.
- source_word: χείρ
  choice: une main
  rationale: La traduction littérale maintient le contraste essentiel entre le pied et la main.
- source_word: ἐκ τοῦ σώματος
  choice: faire partie du corps
  rationale: Dans ce contexte d’appartenance organique, cette tournure française exprime naturellement le sens de ἐκ τοῦ σώματος sans suggérer à tort une provenance physique.
- source_word: οὐ παρὰ τοῦτο οὐκ ἔστιν ἐκ τοῦ σώματος
  choice: cela ne l’empêche pas de faire partie du corps
  rationale: Cette formulation restitue en français idiomatique la double négation et la réfutation contenues dans la question rhétorique grecque.
theological_decisions:
- issue: Degré de littéralité dans la double négation de la métaphore du corps
  choice: Rendre la réfutation par « cela ne l’empêche pas de faire partie du corps »
  alternative: « ce n’est pas pour autant qu’il ne fait pas partie du corps, n’est-ce pas ? »
  rationale: La formulation choisie conserve le raisonnement de Paul et l’appartenance effective du pied au corps, tout en évitant une double négation française lourde et potentiellement obscure. Elle ne résout aucune tension doctrinale absente du texte.
translation_notes:
  register: Français international moderne, courant et digne. La métaphore anatomique reste concrète; la syntaxe finale est légèrement lissée afin que la réfutation soit immédiatement compréhensible à la lecture publique.
