  yaml_path: translation/nt/1_corinthians/012/024.yaml
  text: but our presentable parts have no need. Instead[a], God has composed the body, giving greater honor to the part that lacked it,
translation:
  language: fr
  text: En revanche, les parties de notre corps qui sont présentables n’en ont pas besoin. Mais Dieu a composé[a] le corps en accordant plus d’honneur à la partie qui manquait d’honneur,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « a uni les différentes parties du corps ». Le verbe grec peut souligner leur combinaison en un tout.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐσχήμονα
  choice: les parties de notre corps qui sont présentables
  rationale: L’adjectif neutre pluriel désigne, dans la métaphore corporelle, les parties jugées décentes ou convenables à montrer. « Présentables » conserve ce contraste dans un français actuel, tandis que « parties de notre corps » explicite naturellement le nom sous-entendu.
- source_word: χρείαν ἔχει
  choice: n’en ont pas besoin
  rationale: Cette tournure rend directement l’expression grecque « avoir besoin ». Le pronom « en » reprend les soins et l’honneur particuliers évoqués dans le contexte immédiat.
- source_word: συνεκέρασεν
  choice: a composé
  rationale: Le verbe évoque l’action de combiner divers éléments pour former un ensemble uni. « A composé » exprime ici l’action intentionnelle de Dieu sans réduire l’image à un simple assemblage mécanique.
- source_word: σῶμα
  choice: le corps
  rationale: Ce choix conserve sans expansion la métaphore centrale de Paul.
- source_word: τῷ ὑστεροῦντι
  choice: à la partie qui en manquait
  rationale: Le participe désigne ce qui était en manque ou en retrait. Le pronom « en » indique naturellement que le manque porte sur l’honneur, sans suggérer une moindre valeur intrinsèque.
- source_word: περισσοτέραν τιμήν
  choice: plus d’honneur
  rationale: Cette formulation française naturelle préserve la valeur comparative de περισσοτέραν.
- source_word: δοὺς
  choice: en accordant
  rationale: 'Le gérondif rend la valeur instrumentale probable du participe : Dieu a composé le corps en accordant davantage d’honneur.'
theological_decisions:
- issue: Portée de l’action de Dieu dans la métaphore du corps
  choice: Dieu compose intentionnellement le corps et accorde davantage d’honneur à la partie qui en manquait.
  alternative: Le verbe décrirait seulement le mélange physique des parties anatomiques, sans portée pour la communauté.
  rationale: Le contexte développe l’analogie entre le corps humain et la communauté en tant que corps du Christ. La traduction maintient cette portée sans abandonner l’image concrète du corps ni préciser excessivement la manière dont Dieu agit.
translation_notes:
  register: Français international moderne, clair et digne. « En revanche » marque le contraste avec le verset précédent; « présentables » garde l’idée de convenance extérieure. La virgule finale est conservée puisque la phrase se poursuit au verset suivant.
