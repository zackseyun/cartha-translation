source:
  edition: SBLGNT
  text: ⸀νυνὶ δὲ ὁ θεὸς ἔθετο τὰ μέλη, ἓν ἕκαστον αὐτῶν, ἐν τῷ σώματι καθὼς ἠθέλησεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/018.yaml
  text: But as it is[a], God arranged the members, each one of them[b], in the body just as he desired.
translation:
  language: fr
  text: Mais en réalité, Dieu a disposé[a] dans le corps chacun des membres, comme il l’a voulu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « placé » ou « établi ».
    reason: lexical_alternative
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: Mais en réalité
  rationale: L’expression marque le contraste avec les hypothèses des versets précédents et revient à la situation réelle; cette formulation est naturelle en français et évite de donner à νυνί un sens seulement temporel.
- source_word: ὁ θεὸς
  choice: Dieu
  rationale: Traduction directe du sujet grec.
- source_word: ἔθετο
  choice: a disposé
  rationale: Dans la métaphore du corps, « disposé » exprime à la fois le placement et l’organisation intentionnelle des membres, sans surinterpréter le verbe.
- source_word: τὰ μέλη, ἓν ἕκαστον αὐτῶν
  choice: chacun des membres
  rationale: Cette formulation française naturelle conserve la force distributive de ἓν ἕκαστον et son renvoi explicite aux membres.
- source_word: ἐν τῷ σώματι
  choice: dans le corps
  rationale: Rend directement la relation spatiale au sein de la métaphore corporelle.
- source_word: καθὼς ἠθέλησεν
  choice: comme il l’a voulu
  rationale: Cette expression courante conserve la volonté intentionnelle de Dieu et la correspondance entre cette volonté et la disposition des membres.
theological_decisions:
- issue: L’intention divine dans la disposition des membres du corps
  choice: Dieu a intentionnellement disposé chacun des membres conformément à sa volonté.
  alternative: Dieu aurait simplement placé les membres, sans que leur organisation intentionnelle soit mise en relief.
  rationale: Le contexte présente la diversité du corps comme voulue par Dieu. « a disposé » et « comme il l’a voulu » maintiennent cette idée sans étendre l’affirmation au-delà du propos du verset.
translation_notes:
  register: Français international moderne, clair et digne. L’ordre des mots privilégie une lecture naturelle tout en conservant l’accent distributif de « chacun » et le caractère intentionnel de l’action divine.
