id: 1CO.12.26
reference: 1 Corinthians 12:26
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ⸀εἴτε πάσχει ἓν μέλος, συμπάσχει πάντα τὰ μέλη· εἴτε δοξάζεται ⸀μέλος, συγχαίρει πάντα τὰ μέλη.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/026.yaml
  text: And if one member suffers[a], all the members suffer with it; if a member is honored, all the members rejoice with it.
translation:
  language: fr
  text: Et si un membre souffre, tous les membres souffrent avec lui ; si un membre est honoré[a], tous les membres se réjouissent avec lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « glorifié ». Dans ce contexte, le sens est probablement qu’un membre reçoit de l’honneur et que tout le corps partage sa joie.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴτε … εἴτε
  choice: si … si
  rationale: Dans cette construction corrélative, la répétition de « si » exprime naturellement en français les deux situations envisagées, sans alourdir la phrase par « soit que… soit que ».
- source_word: πάσχει
  choice: souffre
  rationale: Le présent exprime ici une situation générale ou concrète. « Souffre » conserve la portée large du verbe sans préciser indûment la nature de la souffrance.
- source_word: ἓν μέλος
  choice: un membre
  rationale: « Membre » préserve la métaphore du corps qui structure le passage, tout en désignant l’une des personnes qui composent la communauté.
- source_word: συμπάσχει
  choice: souffrent avec lui
  rationale: Le préverbe συν- indique une souffrance partagée. Cette formulation rend explicite la solidarité de tous les membres avec celui qui souffre.
- source_word: πάντα τὰ μέλη
  choice: tous les membres
  rationale: La même expression est rendue de façon identique dans les deux propositions afin de conserver la répétition rhétorique et la métaphore corporelle.
- source_word: δοξάζεται
  choice: est honoré
  rationale: Dans le contexte des relations entre les membres d’un même corps, le verbe désigne vraisemblablement l’honneur accordé à un membre. « Honoré » est naturel en français et n’impose pas un sens technique de glorification.
- source_word: μέλος
  choice: un membre
  rationale: Dans la seconde proposition, le texte imprimé ne comporte pas le numéral ἕν. L’indéfini français « un membre » reste naturel sans ajouter l’idée explicite de « seul » ou de « même ».
- source_word: συγχαίρει
  choice: se réjouissent avec lui
  rationale: Le verbe composé exprime une joie partagée. « Se réjouissent avec lui » maintient le lien avec le membre singulier qui reçoit l’honneur.
theological_decisions:
- issue: Sens de δοξάζεται dans la métaphore communautaire du corps
  choice: « est honoré », au sens de recevoir de l’honneur au sein du corps
  alternative: « est glorifié »
  rationale: Le contexte immédiat porte sur la sollicitude mutuelle et l’interdépendance des membres. « Est honoré » communique ce sens social sans exclure l’alternative lexicale plus forte, signalée en note.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe parallèle et la répétition de « tous les membres » reproduisent le rythme du grec. Le pronom « lui » est naturel avec « membre » en français et renvoie, dans la métaphore, au membre personnifié du corps.
