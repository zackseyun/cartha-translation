id: 1CO.12.25
reference: 1 Corinthians 12:25
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἵνα μὴ ᾖ ⸀σχίσμα ἐν τῷ σώματι, ἀλλὰ τὸ αὐτὸ ὑπὲρ ἀλλήλων μεριμνῶσι τὰ μέλη.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/025.yaml
  text: so that there may be no division in the body[b][a], but that the members may have the same concern for one another.
translation:
  language: fr
  text: afin qu’il n’y ait pas de division dans le corps[a], mais que les membres prennent également soin les uns des autres[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « déchirure » ou « scission ». Le terme grec désigne une rupture; ici, il s’agit d’une division au sein du corps.
    reason: lexical_alternative
  - marker: b
    text: Ou « mais que les membres aient la même sollicitude les uns pour les autres ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: afin que
  rationale: Introduit ici le but ou le résultat recherché; « afin que » en conserve clairement la force.
- source_word: σχίσμα
  choice: division
  rationale: Le terme désigne une déchirure ou une scission. « Division » convient à la fois à l’image du corps et à la communauté, sans la nuance technique que peut avoir « schisme ».
- source_word: σῶμα
  choice: corps
  rationale: Préserve directement la métaphore corporelle développée dans le contexte.
- source_word: τὸ αὐτό
  choice: également
  rationale: Avec μεριμνῶσι, l’expression indique que les membres doivent avoir la même sollicitude les uns pour les autres; « également » rend naturellement en français cette égalité de soin.
- source_word: ὑπὲρ ἀλλήλων
  choice: les uns des autres
  rationale: Exprime la réciprocité et l’orientation de la sollicitude envers autrui.
- source_word: μεριμνῶσι
  choice: prennent soin
  rationale: Dans ce contexte positif, le verbe désigne la sollicitude active plutôt que l’inquiétude anxieuse.
- source_word: μέλη
  choice: les membres
  rationale: Terme précis et naturel dans la métaphore du corps, avec sa portée communautaire implicite.
theological_decisions:
- issue: Rendu de σχίσμα dans la métaphore ecclésiale
  choice: division
  alternative: schisme
  rationale: « Division » conserve le sens immédiat de rupture interne sans importer le sens ecclésiastique plus technique que « schisme » peut avoir en français.
- issue: Rapport exprimé par τὸ αὐτό avec la sollicitude mutuelle
  choice: prennent également soin les uns des autres
  alternative: aient la même sollicitude les uns pour les autres
  rationale: Le choix principal exprime naturellement l’égalité et la réciprocité des soins. La variante plus formelle demeure possible et rend plus explicitement τὸ αὐτό.
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve la métaphore du corps et rend de manière idiomatique la sollicitude réciproque et égale des membres.
