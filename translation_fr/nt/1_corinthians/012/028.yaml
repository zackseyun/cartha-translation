source:
  edition: SBLGNT
  text: καὶ οὓς μὲν ἔθετο ὁ θεὸς ἐν τῇ ἐκκλησίᾳ πρῶτον ἀποστόλους, δεύτερον προφήτας, τρίτον διδασκάλους, ἔπειτα δυνάμεις, ⸀ἔπειτα χαρίσματα ἰαμάτων, ἀντιλήμψεις, κυβερνήσεις, γένη γλωσσῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/028.yaml
  text: And God has appointed in the church first apostles[a], second prophets, third teachers, then miracles, then gifts of healings, helps, administrations[c][b], kinds of tongues.
translation:
  language: fr
  text: Et Dieu a établi dans l’Église premièrement des apôtres, deuxièmement des prophètes, troisièmement des enseignants, ensuite des miracles[a], puis des dons de guérisons, des formes d’aide, des formes de direction[b], diverses sortes de langues[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « actes de puissance ».
    reason: lexical_alternative
  - marker: b
    text: Ou « capacités de guider » ou « formes de gouvernement ».
    reason: lexical_alternative
  - marker: c
    text: Ou « diverses formes de parler en langues ». Le terme grec peut désigner des langues ou, dans ce contexte, le phénomène du parler en langues.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔθετο
  choice: a établi
  rationale: Dans ce contexte, τίθημι exprime l’action de placer ou d’établir des personnes et des fonctions dans l’Église. « A établi » rend naturellement l’initiative souveraine de Dieu sans réduire le verbe à une localisation spatiale.
- source_word: ἐν τῇ ἐκκλησίᾳ
  choice: dans l’Église
  rationale: Dans ce passage paulinien, ἐκκλησία désigne la communauté du peuple de Dieu. « Église » est le terme français courant et convient au contexte du corps et de ses divers ministères.
- source_word: πρῶτον … δεύτερον … τρίτον
  choice: premièrement… deuxièmement… troisièmement
  rationale: Ces termes marquent explicitement une séquence. La traduction en reproduit l’ordre sans préciser s’il s’agit d’un rang, d’une chronologie ou d’une importance fonctionnelle.
- source_word: ἀποστόλους
  choice: apôtres
  rationale: Le terme désigne ici la fonction apostolique reconnue dans l’Église, et non de simples messagers.
- source_word: προφήτας
  choice: prophètes
  rationale: Équivalent français direct et établi pour ceux qui exercent une fonction prophétique.
- source_word: διδασκάλους
  choice: enseignants
  rationale: « Enseignants » exprime clairement en français moderne la fonction d’instruction désignée par διδάσκαλοι.
- source_word: δυνάμεις
  choice: miracles
  rationale: Bien que le nom signifie littéralement « puissances », il désigne ici des manifestations ou actes de puissance. « Miracles » communique clairement ce sens, tandis qu’une note conserve l’expression plus littérale.
- source_word: χαρίσματα ἰαμάτων
  choice: dons de guérisons
  rationale: Les deux noms sont au pluriel en grec. La formulation conserve ce pluriel inhabituel afin de ne pas aplanir la forme du texte source.
- source_word: ἀντιλήμψεις
  choice: formes d’aide
  rationale: Le nom désigne des secours, soutiens ou capacités d’assistance. « Formes d’aide » est clair et préserve le pluriel catégoriel.
- source_word: κυβερνήσεις
  choice: formes de direction
  rationale: Le terme évoque l’action de piloter, guider ou diriger. « Formes de direction » rend la fonction sans imposer l’idée d’un office hiérarchique déterminé.
- source_word: γένη γλωσσῶν
  choice: diverses sortes de langues
  rationale: γένη désigne des sortes ou catégories, tandis que γλῶσσαι peut évoquer des langues ou le phénomène du parler en langues. La formulation française garde cette relative ambiguïté.
theological_decisions:
- issue: La nature de l’ordre « premièrement… deuxièmement… troisièmement »
  choice: Reproduire simplement la séquence du grec.
  alternative: Interpréter cette séquence comme une hiérarchie permanente, un ordre chronologique ou un classement selon l’importance.
  rationale: Le verset présente clairement un ordre, mais n’en explique pas la nature. La traduction ne tranche donc pas entre les principales interprétations.
- issue: Le sens de γλῶσσαι dans ce contexte
  choice: Employer « langues » dans le texte principal.
  alternative: Employer explicitement « parler en langues » ou limiter le sens aux langues humaines.
  rationale: Le mot grec et le contexte paulinien ont donné lieu à plusieurs compréhensions. « Langues » conserve la terminologie et l’ambiguïté sans définir prématurément la nature du phénomène.
translation_notes:
  register: Français international moderne, naturel et digne. La structure de l’énumération grecque est conservée, ainsi que le passage des personnes (« apôtres », « prophètes », « enseignants ») aux manifestations et fonctions. Les formulations interprétatives trop confessionnelles ou institutionnelles sont évitées.
