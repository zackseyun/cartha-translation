  text: ζηλοῦτε δὲ τὰ χαρίσματα τὰ ⸀μείζονα. καὶ ἔτι καθ’ ὑπερβολὴν ὁδὸν ὑμῖν δείκνυμι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/031.yaml
  text: But earnestly desire the greater gifts[b][a]. And I will show you a still more surpassing way.
translation:
  language: fr
  text: Mais recherchez avec ardeur les dons les plus importants.[a] Et, de plus, je vous montre une voie infiniment supérieure.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Mais vous recherchez avec ardeur les dons les plus importants. » La forme grecque ζηλοῦτε peut être comprise ici comme un impératif ou comme un indicatif.'
    reason: alternative_reading
  - marker: b
    text: 'Autre traduction possible : « une voie plus excellente encore ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ζηλοῦτε
  choice: recherchez avec ardeur
  rationale: Le verbe exprime un désir intense ou un zèle actif. Cette formulation naturelle rend ici la valeur impérative sans atténuer son intensité; la valeur indicative, grammaticalement possible, est signalée en note.
- source_word: χαρίσματα
  choice: dons
  rationale: Dans le contexte, il s’agit des dons accordés par grâce. « Dons » reste concis et n’ajoute pas l’adjectif « spirituels », absent de cette proposition.
- source_word: μείζονα
  choice: les plus importants
  rationale: Le comparatif peut désigner ce qui est plus grand ou plus important. En français, cette formulation exprime naturellement la valeur relative des dons dans ce contexte, sans préciser selon quel critère ils le sont.
- source_word: καὶ ἔτι
  choice: Et… encore
  rationale: La combinaison assure la continuité tout en introduisant un dépassement par rapport à ce qui précède.
- source_word: καθ’ ὑπερβολὴν
  choice: incomparablement supérieure
  rationale: L’expression marque un degré extraordinaire, l’idée de dépassement. Cette tournure est naturelle en français moderne et conserve la force intensive du grec.
- source_word: ὁδὸν
  choice: voie
  rationale: « Voie » préserve la métaphore d’une manière de vivre ou d’agir et introduit naturellement le développement sur l’amour.
- source_word: δείκνυμι
  choice: je vous montre
  rationale: Le présent français suit directement le présent grec et convient à l’annonce de l’exposé qui commence immédiatement après.
theological_decisions:
- issue: Valeur de ζηλοῦτε
  choice: 'Impératif : « recherchez avec ardeur »'
  alternative: 'Indicatif : « vous recherchez avec ardeur »'
  rationale: La forme grecque peut être comprise comme un impératif ou comme un indicatif. L’impératif s’accorde bien avec l’exhortation du passage, mais l’autre analyse demeure réellement possible et est donc conservée en note.
translation_notes:
  register: Français international actuel, clair et digne. La formulation conserve la métaphore de la « voie », rend explicitement l’intensité de ζηλοῦτε et de καθ’ ὑπερβολήν, et maintient en note l’ambiguïté grammaticale essentielle.
