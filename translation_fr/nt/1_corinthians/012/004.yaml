id: 1CO.12.4
reference: 1 Corinthians 12:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Διαιρέσεις δὲ χαρισμάτων εἰσίν, τὸ δὲ αὐτὸ πνεῦμα·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/004.yaml
  text: There are varieties of gifts[a], but the same Spirit.
translation:
  language: fr
  text: Il y a une diversité de dons[a], mais c’est le même Esprit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « différentes répartitions de dons » ou « différentes sortes de dons ». Le grec souligne la diversité des dons, non une division dans l’Église.
    reason: alternative lexicale
lexical_decisions:
- source_word: Διαιρέσεις
  choice: une diversité
  rationale: Le pluriel grec désigne des distinctions, des répartitions ou des formes diverses au sein d’un ensemble. « Une diversité » est idiomatique en français et exprime ici la pluralité légitime sans suggérer des factions dans l’Église.
- source_word: δὲ
  choice: mais
  rationale: Le premier δέ, qui assure une transition légère, reste implicite en français pour éviter un connecteur pesant. Le second marque le contraste entre la diversité des dons et l’identité de l’Esprit, d’où « mais ».
- source_word: χαρισμάτων
  choice: dons
  rationale: Dans ce contexte, χάρισμα désigne des dons accordés par grâce, notamment des capacités venant de l’Esprit. « Dons » est le terme français le plus clair et le plus naturel; la nuance de grâce n’a pas besoin d’être explicitée dans le texte principal.
- source_word: τὸ ... αὐτὸ
  choice: le même
  rationale: Cette tournure souligne l’identité de l’Esprit malgré la diversité des dons. « Le même » conserve cet accent avec concision.
- source_word: πνεῦμα
  choice: Esprit
  rationale: Le contexte immédiat de 1 Corinthiens 12.3-11 désigne l’Esprit Saint comme la source des dons; la majuscule indique ce référent sans développer le texte.
theological_decisions:
- issue: Référent de πνεῦμα
  choice: l’Esprit Saint
  alternative: l’esprit humain ou un principe spirituel
  rationale: Dans l’ensemble du passage, l’Esprit distribue les dons parmi les croyants. La traduction « Esprit » avec une majuscule reflète ce référent tout en conservant la formulation concise du grec.
translation_notes:
  register: Français international moderne, naturel et digne. La tournure existentielle « Il y a » rend clairement εἰσίν; le singulier collectif « une diversité » transpose idiomatiquement le pluriel grec. Le présentatif « c’est » exprime naturellement en français le contraste elliptique de la seconde proposition.
