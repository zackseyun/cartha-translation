id: 1CO.12.10
reference: 1 Corinthians 12:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸀ἄλλῳ ἐνεργήματα δυνάμεων, ⸁ἄλλῳ προφητεία, ⸀1ἄλλῳ διακρίσεις πνευμάτων, ⸀ἑτέρῳ γένη γλωσσῶν, ⸀2ἄλλῳ ἑρμηνεία γλωσσῶν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/010.yaml
  text: to another[a], workings of miracles; to another, prophecy; to another, discernments of spirits; to another, kinds of tongues; to another[b], interpretation of tongues.
translation:
  language: fr
  text: à un autre, des actes de puissance[a] ; à un autre, la prophétie ; à un autre, des discernements des esprits ; à un autre, diverses sortes de langues[b] ; à un autre, l’interprétation des langues.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des miracles » ou « des œuvres puissantes ».
    reason: lexical_alternative
  - marker: b
    text: Le mot grec peut désigner aussi bien des langues que le phénomène appelé « parler en langues » ; la traduction conserve cette ambiguïté.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐνεργήματα δυνάμεων
  choice: des actes de puissance
  rationale: « Actes » exprime les manifestations ou effets produits, tandis que « puissance » garde le sens premier de δυνάμεων sans décider d’emblée qu’il s’agit exclusivement de miracles.
- source_word: προφητεία
  choice: la prophétie
  rationale: Équivalent français courant et suffisamment large pour ne pas réduire le don à la seule prédiction.
- source_word: διακρίσεις πνευμάτων
  choice: des discernements des esprits
  rationale: Le pluriel « discernements » reflète διακρίσεις, et « des esprits » conserve l’indétermination du grec quant à leur identité ou à leur nature.
- source_word: γένη γλωσσῶν
  choice: diverses sortes de langues
  rationale: « Diverses sortes » rend naturellement le pluriel γένη. « Langues » demeure en français ambigu entre des langues humaines et le phénomène charismatique appelé parler en langues.
- source_word: ἑρμηνεία γλωσσῶν
  choice: l’interprétation des langues
  rationale: « Interprétation » convient à l’action de rendre intelligible le contenu exprimé et ne la limite pas à une traduction entre langues humaines.
- source_word: ἄλλῳ / ἑτέρῳ
  choice: à un autre
  rationale: La répétition marque la distribution des dons à différentes personnes. Le changement lexical grec n’impose pas ici une distinction nette en français.
theological_decisions:
- issue: Sens de δυνάμεων dans la liste des dons
  choice: actes de puissance
  alternative: miracles ; œuvres puissantes
  rationale: La formulation retenue garde le lien lexical avec la puissance tout en laissant entendre ses manifestations concrètes. Une note indique les rendus plus interprétatifs possibles.
- issue: Sens de γλωσσῶν
  choice: langues
  alternative: parlers en langues
  rationale: Le français « langues » préserve l’ambiguïté entre langues identifiables et expression charismatique, sans trancher la nature précise du phénomène.
- issue: Référent de πνευμάτων
  choice: esprits
  alternative: manifestations spirituelles ; esprits à l’origine des paroles
  rationale: Le texte grec ne précise ni la nature des esprits ni le mode de discernement ; le rendu reste donc volontairement large.
translation_notes:
  register: Français international moderne, digne et accessible. La structure répétitive « à un autre » est maintenue pour rendre la distribution des dons. Le point-virgule clarifie la liste sans en modifier la syntaxe.
