source:
  edition: SBLGNT
  text: καὶ γὰρ ἐν ἑνὶ πνεύματι ἡμεῖς πάντες εἰς ἓν σῶμα ἐβαπτίσθημεν, εἴτε Ἰουδαῖοι εἴτε Ἕλληνες, εἴτε δοῦλοι εἴτε ἐλεύθεροι, καὶ ⸀πάντες ἓν πνεῦμα ἐποτίσθημεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/013.yaml
  text: For indeed[a], in one Spirit we all were baptized into one body—whether Jews or Greeks[c][b], whether servants or free—and we all were given to drink one Spirit.
translation:
  language: fr
  text: Car c’est dans un seul Esprit[a] que nous avons tous été baptisés pour former un seul corps — Juifs ou Grecs, esclaves ou personnes libres — et nous avons tous été abreuvés d’un seul Esprit[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « par un seul Esprit ». La préposition grecque peut indiquer la sphère dans laquelle une action a lieu, mais aussi le moyen ou l’agent par lequel elle s’accomplit.'
    reason: alternative_reading
  - marker: b
    text: 'Ou, avec une compréhension moins personnelle du terme : « abreuvés d’un même esprit ». Le contexte favorise toutefois une référence à l’Esprit Saint.'
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ γὰρ
  choice: Car c’est… que
  rationale: « Car » conserve la valeur explicative de γάρ, tandis que la tournure clivée française rend naturellement l’insistance portée par καί et par l’ensemble de la proposition.
- source_word: ἐν ἑνὶ πνεύματι
  choice: dans un seul Esprit
  rationale: « Dans » conserve au mieux la forme grecque et laisse ouverte la nuance de sphère, de moyen ou d’agent; la variante « par un seul Esprit » est signalée en note.
- source_word: ἡμεῖς πάντες
  choice: nous avons tous
  rationale: La présence du pronom et de πάντες donne une insistance collective que « nous… tous » restitue clairement.
- source_word: ἐβαπτίσθημεν
  choice: avons été baptisés
  rationale: Rend le passif et emploie le terme ecclésial français courant sans préciser un mode de baptême non explicité ici.
- source_word: εἰς ἓν σῶμα
  choice: pour former un seul corps
  rationale: Cette formulation française exprime naturellement l’incorporation et le résultat indiqués par εἰς, tout en conservant l’image paulinienne du corps unique.
- source_word: Ἰουδαῖοι εἴτε Ἕλληνες
  choice: Juifs ou Grecs
  rationale: Conserve les désignations ethniques explicites du grec plutôt que de généraliser Ἕλληνες en « non-Juifs ».
- source_word: δοῦλοι εἴτε ἐλεύθεροι
  choice: esclaves ou hommes libres
  rationale: Le contraste de statut social rend « esclaves » nécessaire; « hommes libres » exprime clairement le pluriel substantivé ἐλεύθεροι, au sens générique.
- source_word: ἐποτίσθημεν
  choice: avons été abreuvés
  rationale: « Abreuver » rend de façon concise et idiomatique le passif de ποτίζω ainsi que la métaphore de la participation commune.
- source_word: ἓν πνεῦμα
  choice: un seul Esprit
  rationale: Le contexte désigne très probablement l’Esprit Saint; la majuscule l’indique, sans ajouter « Saint » au texte grec.
theological_decisions:
- issue: Valeur de ἐν dans ἐν ἑνὶ πνεύματι
  choice: dans un seul Esprit
  alternative: par un seul Esprit
  rationale: Le grec permet une nuance de sphère comme de moyen ou d’agent. Le texte principal reste proche de la construction grecque et la note préserve l’autre lecture importante sans trancher dogmatiquement.
- issue: Nature de l’unité exprimée par εἰς ἓν σῶμα
  choice: pour former un seul corps
  alternative: en un seul corps
  rationale: « Pour former » rend en français courant le mouvement ou résultat d’incorporation exprimé par εἰς, sans définir plus précisément le rapport sacramentel entre baptême, Esprit et Église.
- issue: Référent de ἓν πνεῦμα dans la dernière proposition
  choice: un seul Esprit
  alternative: un même esprit
  rationale: Le parallèle avec la première proposition et le contexte immédiat favorisent fortement une référence à l’Esprit Saint. L’autre compréhension demeure possible sur le plan grammatical et est mentionnée en note.
translation_notes:
  register: Français international moderne, digne et accessible. « Car c’est… que » porte l’explication et l’emphase sans lourdeur. « Abreuvés » maintient l’image de la boisson dans un registre biblique naturel. Le tiret long structure les deux contrastes sociaux et ethniques.
