  text: ἀλλὰ πολλῷ μᾶλλον τὰ δοκοῦντα μέλη τοῦ σώματος ἀσθενέστερα ὑπάρχειν ἀναγκαῖά ἐστιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/022.yaml
  text: On the contrary[a], the parts of the body that seem to be weaker are necessary[c][b],
translation:
  language: fr
  text: Au contraire, les parties du corps qui paraissent plus faibles sont d’autant plus nécessaires,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Bien plus, les membres du corps qui paraissent plus faibles sont indispensables. »'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ πολλῷ μᾶλλον
  choice: Au contraire … d’autant plus
  rationale: La tournure rend à la fois le contraste correctif de ἀλλά et l’intensification explicite de πολλῷ μᾶλλον, dans un français naturel.
- source_word: τὰ δοκοῦντα
  choice: qui paraissent
  rationale: Le verbe exprime ici une apparence ou une appréciation, sans affirmer que ces parties sont réellement plus faibles.
- source_word: μέλη τοῦ σώματος
  choice: les parties du corps
  rationale: « Parties du corps » est idiomatique en français contemporain et maintient l’image corporelle concrète; « membres du corps » reste possible.
- source_word: ἀσθενέστερα ὑπάρχειν
  choice: plus faibles
  rationale: Le comparatif ἀσθενέστερα est conservé; le sens existentiel de ὑπάρχειν s’intègre naturellement à « paraissent plus faibles ».
- source_word: ἀναγκαῖά ἐστιν
  choice: sont nécessaires
  rationale: Rendu formel et naturel de l’idée de nécessité; « indispensables » exprimerait cette nécessité avec davantage de force interprétative.
theological_decisions:
- issue: Portée ecclésiale de l’image du corps
  choice: Conserver l’image concrète des parties du corps
  alternative: Parler directement des membres de l’Église
  rationale: Le contexte applique l’image à l’Église, mais ce verset reste formulé en termes corporels. La traduction ne remplace donc pas la métaphore par son interprétation.
- issue: Faiblesse réelle ou perçue
  choice: « qui paraissent plus faibles »
  alternative: « qui sont considérées comme plus faibles »
  rationale: Le grec maintient la distinction entre l’apparence ou l’évaluation et la réalité; la traduction évite de confirmer comme réelle la faiblesse en question.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve le comparatif « plus faibles » et rend explicitement l’intensification grecque par « d’autant plus ». Le marqueur de note est placé après la proposition concernée.
