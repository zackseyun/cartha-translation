  text: Ὑμεῖς δέ ἐστε σῶμα Χριστοῦ καὶ μέλη ἐκ μέρους.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/027.yaml
  text: You are the body of Messiah[c][b][a], and members individually.
translation:
  language: fr
  text: Vous, vous êtes le corps du Messie[a], et chacun de vous en est un membre[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le corps du Christ ». Le titre grec Χριστός peut se traduire par « Messie » ou « Christ ».
    reason: alternative_reading
  - marker: b
    text: 'Littéralement : « et membres chacun pour sa part » ; l’expression grecque souligne que chacun est un membre au sein du corps tout entier.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑμεῖς δέ
  choice: Vous, vous
  rationale: Le pronom explicitement exprimé porte une emphase, tandis que δέ marque ici le passage de l’image générale à son application aux destinataires. La dislocation, naturelle en français, rend cette mise en relief sans ajouter un adverbe temporel absent du grec.
- source_word: σῶμα Χριστοῦ
  choice: le corps du Messie
  rationale: Dans cette affirmation ecclésiologique, Χριστός conserve sa valeur de titre messianique. L’article français est nécessaire pour former une expression définie naturelle.
- source_word: μέλη
  choice: un membre
  rationale: Le singulier distributif français, commandé par « chacun de vous », préserve l’image des différentes parties d’un même corps ainsi que sa portée communautaire.
- source_word: ἐκ μέρους
  choice: chacun de vous
  rationale: Dans le contexte immédiat du corps unique composé de plusieurs membres, l’expression a une portée distributive. Cette formulation évite que « en partie » soit compris comme une participation incomplète.
theological_decisions:
- issue: Traduction de Χριστοῦ dans l’expression paulinienne σῶμα Χριστοῦ
  choice: Messie
  alternative: Christ
  rationale: Le mot grec désigne ici le titre messianique. « Messie » en explicite le sens, tandis que « Christ » demeure une traduction française traditionnelle valable.
- issue: Portée de ἐκ μέρους
  choice: Chaque destinataire est individuellement membre du corps
  alternative: « membres, chacun pour sa part » ou, plus littéralement, « membres en partie »
  rationale: La lecture distributive correspond au contraste contextuel entre l’unité du corps et la pluralité de ses membres. L’ajout pronominal « en » rend explicite en français le lien avec le corps sans modifier l’affirmation théologique.
translation_notes:
  register: Français international actuel, digne et accessible. La reprise « Vous, vous » rend l’emphase du pronom grec et la transition marquée par δέ. Le second membre de phrase est reformulé au singulier distributif pour être idiomatique en français.
