source:
  edition: SBLGNT
  text: καὶ ἃ δοκοῦμεν ἀτιμότερα εἶναι τοῦ σώματος, τούτοις τιμὴν περισσοτέραν περιτίθεμεν, καὶ τὰ ἀσχήμονα ἡμῶν εὐσχημοσύνην περισσοτέραν ἔχει,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/023.yaml
  text: and those parts of the body that we think to be less honorable[a], on these we bestow greater honor, and our unpresentable parts have greater decorum[b],
translation:
  language: fr
  text: Et les parties du corps que nous estimons moins honorables, nous les entourons de plus d’honneur ; et nos parties peu présentables[a] ont une apparence plus convenable[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « inconvenantes » ; le terme grec peut désigner ce qui n’est pas convenable à montrer en public.
    reason: lexical_alternative
  - marker: b
    text: Ou « davantage de bienséance » ou « une plus grande respectabilité ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἃ δοκοῦμεν
  choice: que nous estimons
  rationale: δοκέω exprime ici une appréciation humaine plutôt qu’une réalité objective. « Nous estimons » conserve cette nuance et s’intègre naturellement à la phrase.
- source_word: ἀτιμότερα
  choice: moins honorables
  rationale: Le comparatif de ἄτιμος répond directement à τιμή (« honneur »). « Moins honorables » préserve ce contraste sans durcir le sens en « déshonorantes ».
- source_word: τούτοις τιμὴν περισσοτέραν περιτίθεμεν
  choice: nous les entourons de plus d’honneur
  rationale: περιτίθημι évoque littéralement le fait de mettre autour ou sur. « Entourons de » reste idiomatique en français tout en conservant l’image concrète du soin ou de la parure accordé à ces parties.
- source_word: τὰ ἀσχήμονα ἡμῶν
  choice: nos parties peu présentables
  rationale: ἀσχήμων désigne ce qui manque de tenue ou ne convient pas à l’exposition publique. « Peu présentables » rend la dimension sociale et corporelle sans imposer une condamnation morale.
- source_word: εὐσχημοσύνην περισσοτέραν ἔχει
  choice: sont présentées avec plus de décence
  rationale: Le grec dit littéralement que ces parties « ont davantage de bienséance ». La formulation française explicite sobrement la présentation suggérée par le contexte, tout en maintenant l’opposition lexicale avec ἀσχήμονα.
theological_decisions:
- issue: Image concrète du corps et honneur social
  choice: Conserver les parties concrètes du corps ainsi que le geste qui consiste à les entourer d’honneur.
  alternative: Paraphraser directement en parlant des membres de l’Église jugés plus faibles ou moins estimables.
  rationale: Paul fonde son enseignement ecclésial sur la manière dont le corps physique est traité. Garder cette image permet à l’application théologique de découler du contexte au lieu de l’introduire dans ce verset.
- issue: Rapport entre ἀσχήμονα et εὐσχημοσύνη
  choice: Rendre le contraste par « peu présentables » et « avec plus de décence ».
  alternative: Employer « indécentes » et « bienséance », ou comprendre le passage comme visant explicitement les organes sexuels.
  rationale: Le vocabulaire grec évoque ce qui est inconvenant à montrer et la tenue convenable, mais ne nomme pas précisément certaines parties. La traduction conserve cette retenue et l’ambiguïté du texte.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition « présentables / présentées » reflète volontairement l’opposition grecque entre ἀσχήμονα et εὐσχημοσύνη, tandis que « entourons de plus d’honneur » garde l’image concrète de περιτίθεμεν.
