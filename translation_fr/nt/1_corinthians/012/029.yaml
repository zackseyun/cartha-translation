  text: μὴ πάντες ἀπόστολοι; μὴ πάντες προφῆται; μὴ πάντες διδάσκαλοι; μὴ πάντες δυνάμεις;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/029.yaml
  text: Not all are apostles[a], are they? Not all are prophets, are they? Not all are teachers, are they? Not all work miracles, do they?
translation:
  language: fr
  text: Tous ne sont pas apôtres, n’est-ce pas ? Tous ne sont pas prophètes, n’est-ce pas ? Tous ne sont pas enseignants, n’est-ce pas ? Tous n’accomplissent pas de miracles[a], n’est-ce pas ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement, le grec emploie « puissances », de manière elliptique. Dans ce contexte, le terme peut désigner des actes miraculeux ou, par extension, ceux qui les accomplissent.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ
  choice: ne… pas, n’est-ce pas ?
  rationale: Dans chacune de ces questions, μή appelle une réponse négative. La négation suivie de « n’est-ce pas ? » rend cette attente explicite dans un français naturel tout en maintenant la force rhétorique.
- source_word: πάντες
  choice: tous
  rationale: « Tous » conserve la répétition insistante du grec et souligne que les mêmes fonctions ou manifestations ne sont pas données à chaque membre.
- source_word: ἀπόστολοι
  choice: apôtres
  rationale: Dans cette liste paulinienne, le terme désigne la fonction reconnue d’apôtre plutôt que de simples messagers.
- source_word: προφῆται
  choice: prophètes
  rationale: Équivalent français usuel et précis pour ceux qui prophétisent.
- source_word: διδάσκαλοι
  choice: enseignants
  rationale: « Enseignants » est clair en français moderne et désigne ici les personnes qui exercent la fonction d’enseigner.
- source_word: δυνάμεις
  choice: accomplissent des miracles
  rationale: Le nom grec signifie littéralement « puissances » ou, par extension, « miracles ». Dans cette série, il désigne par métonymie l’exercice d’actes miraculeux ; une formulation verbale communique clairement ce sens en français.
theological_decisions:
- issue: Interprétation de δυνάμεις dans une liste de fonctions et de dons
  choice: Tous n’accomplissent pas de miracles
  alternative: Tous ne sont pas des puissances / Tous n’ont pas des pouvoirs miraculeux
  rationale: Le grec emploie un nom comme raccourci métonymique au sein de la liste. La formulation choisie indique que tous les membres n’accomplissent pas d’actes miraculeux, sans affirmer que les personnes sont elles-mêmes des « puissances ». La note conserve néanmoins la forme littérale et son ambiguïté.
translation_notes:
  register: Français international moderne, clair et digne. La répétition de « Tous ne sont pas… n’est-ce pas ? » reproduit le rythme des quatre questions grecques et leur attente constante d’une réponse négative. Le marqueur de note est placé après l’expression correspondant à δυνάμεις.
