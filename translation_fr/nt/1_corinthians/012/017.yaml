id: 1CO.12.17
reference: 1 Corinthians 12:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἰ ὅλον τὸ σῶμα ὀφθαλμός, ποῦ ἡ ἀκοή; εἰ ὅλον ἀκοή, ποῦ ἡ ὄσφρησις;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/017.yaml
  text: If the whole body were an eye[a], where would the hearing be? If the whole were hearing, where would the sense of smell be?
translation:
  language: fr
  text: Si le corps tout entier était un œil, où serait l’ouïe[a] ? S’il était tout entier ouïe, où serait l’odorat ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « où serait l’oreille ?… où serait le nez ? » Le grec parle plus littéralement des facultés d’entendre et de sentir les odeurs.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅλον τὸ σῶμα
  choice: le corps tout entier
  rationale: Cette formulation naturelle conserve l’idée du corps dans sa totalité et met en relief l’hypothèse de Paul.
- source_word: ὀφθαλμός
  choice: un œil
  rationale: Le nom attribut se rend naturellement avec l’article indéfini en français et préserve l’image d’un corps réduit à un seul type d’organe.
- source_word: ποῦ
  choice: où serait… ?
  rationale: Dans cette condition hypothétique, le conditionnel français rend naturellement la portée implicite de la question grecque.
- source_word: ἀκοή
  choice: l’ouïe / ouïe
  rationale: Le terme grec désigne la faculté d’entendre plutôt que l’organe physique. L’article est conservé dans la première occurrence, tandis que l’emploi attributif de la seconde se rend sans article.
- source_word: ὅλον
  choice: tout entier
  rationale: Dans la seconde proposition, le corps reste sous-entendu en grec. Le pronom « il » suivi de « tout entier » restitue clairement cette ellipse sans répétition lourde.
- source_word: ὄσφρησις
  choice: l’odorat
  rationale: « L’odorat » est le terme français courant et précis pour la faculté de sentir les odeurs; il correspond au langage fonctionnel du grec.
theological_decisions:
- issue: Expression de la métaphore corporelle par les facultés sensorielles ou par les organes
  choice: Traduire ἀκοή et ὄσφρησις par les facultés « ouïe » et « odorat ».
  alternative: 'Employer les organes : « où serait l’oreille ?… où serait le nez ? »'
  rationale: Le grec nomme les capacités d’entendre et de sentir, non les organes anatomiques. Le maintien de ce langage fonctionnel respecte la formulation de Paul et n’accentue pas artificiellement l’image.
translation_notes:
  register: Français international moderne, clair et digne. « L’ouïe » et « l’odorat » sont précis et idiomatiques; la reprise par « il » évite l’expression peu naturelle « si le tout était ouïe » tout en conservant l’ellipse grecque.
