  text: οἴδατε ὅτι ὅτε ἔθνη ἦτε πρὸς τὰ εἴδωλα τὰ ἄφωνα ὡς ἂν ἤγεσθε ἀπαγόμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/002.yaml
  text: You know that when you were Gentiles[a], you were led away to the mute idols[b], however you were led.
translation:
  language: fr
  text: Vous savez que, lorsque vous étiez païens[a], vous étiez entraînés vers les idoles muettes[b], quelle que fût la manière dont on vous y conduisait[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des gens des nations » ou « non-Juifs ». Ici, le terme évoque leur ancienne vie liée au culte des idoles.
    reason: lexical_alternative
  - marker: b
    text: Ou « les idoles sans voix » ou « les idoles incapables de parler ».
    reason: lexical_alternative
  - marker: c
    text: Ou « comme on vous y conduisait ». La formulation grecque est difficile et souligne qu’ils étaient passivement emmenés vers les idoles, sans préciser de quelle manière.
    reason: translation_alternative
lexical_decisions:
- source_word: οἴδατε
  choice: Vous savez
  rationale: Formulation directe et naturelle qui conserve l’appel de Paul à un fait connu de ses destinataires.
- source_word: ἔθνη
  choice: païens
  rationale: Dans ce contexte, le mot désigne leur ancienne condition religieuse parmi les nations non juives. « Païens » est clair en français courant, tandis que « nations » serait ici obscur et « non-Juifs » atténuerait la dimension cultuelle du contexte.
- source_word: πρὸς τὰ εἴδωλα
  choice: vers les idoles
  rationale: « Vers » conserve le mouvement directionnel exprimé par πρός avec l’accusatif.
- source_word: τὰ ἄφωνα
  choice: muettes
  rationale: Le terme souligne que les idoles sont incapables de parler, contraste important dans un passage consacré aux paroles inspirées par l’Esprit.
- source_word: ἤγεσθε ἀπαγόμενοι
  choice: vous vous laissiez entraîner
  rationale: Cette tournure française rend le processus passé et la passivité fortement marquée par les deux formes grecques, sans la répétition maladroite de « vous étiez conduits… étant emmenés ».
- source_word: ὡς ἂν
  choice: au gré de ce qui
  rationale: La locution grecque a ici une valeur indéfinie ou modale. Avec « vous menait », cette traduction exprime qu’ils subissaient diverses influences sans préciser leur nature.
theological_decisions:
- issue: Portée ethnique et religieuse de ἔθνη
  choice: païens
  alternative: gens des nations ; non-Juifs
  rationale: Le contexte évoque à la fois l’origine non juive des Corinthiens et leur ancien culte idolâtre. « Païens » exprime naturellement cette situation en français, sans ajouter de condamnation absente du texte.
- issue: Contraste entre les idoles sans voix et la parole inspirée par l’Esprit
  choice: idoles muettes
  alternative: idoles incapables de parler ; idoles sans voix
  rationale: La formulation concise maintient le contraste rhétorique du texte sans l’expliquer au-delà de ce que dit le verset.
- issue: Passivité sous les anciennes influences religieuses
  choice: vous vous laissiez entraîner… au gré de ce qui vous menait
  alternative: vous étiez entraînés… de quelque manière que vous soyez conduits
  rationale: La traduction conserve la force passive et l’indétermination de la construction grecque, sans identifier l’influence qui les menait ni résoudre une syntaxe difficile de façon doctrinale.
translation_notes:
  register: 'Français international moderne, digne et accessible. « Vous vous laissiez entraîner » ne suppose pas un consentement pleinement volontaire : dans ce contexte, la tournure décrit surtout le fait de céder à une influence. La dernière proposition garde l’indétermination et la tension de la syntaxe grecque.'
