  source_fidelity: La tournure « vous vous laissiez entraîner » atténue la double passivité de ἤγεσθε ἀπαγόμενοι en suggérant que les destinataires se laissaient volontairement faire. Le texte grec les présente plutôt comme conduits ou entraînés. La formulation finale doit aussi conserver la valeur indéfinie de ὡς ἄν sans attribuer l’action à une force impersonnelle (« ce qui vous menait »).
  naturalness: « Vous étiez entraînés » est un français moderne, clair et suffisamment soutenu. « Quelle que fût la manière dont on vous y conduisait » rend la construction difficile avec une légère élévation de registre, mais reste naturelle et évite une paraphrase interprétative.
  terminology: « Païens » convient ici à ἔθνη dans son contexte cultuel, tout en gardant en note les possibilités « gens des nations » et « non-Juifs ». « Idoles muettes » rend avec précision τὰ εἴδωλα τὰ ἄφωνα et maintient le contraste avec la parole du contexte.
