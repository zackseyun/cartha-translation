  text: εἰ δὲ ἦν τὰ πάντα ἓν μέλος, ποῦ τὸ σῶμα;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/019.yaml
  text: If all were one member, where would the body be?
translation:
  language: fr
  text: Si tout était une seule partie, où serait le corps ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰ
  choice: Si
  rationale: Introduit naturellement en français la condition hypothétique qui fonde la question rhétorique.
- source_word: δὲ
  choice: —
  rationale: Particule de liaison et de léger contraste ; dans ce bref raisonnement, le français rend l’enchaînement avec naturel sans conjonction explicite.
- source_word: ἦν
  choice: était
  rationale: L’imparfait convient à la protase hypothétique introduite par « si » en français.
- source_word: τὰ πάντα
  choice: tout
  rationale: Désigne collectivement l’ensemble des éléments évoqués dans la métaphore du corps, plutôt que toutes choses en général.
- source_word: ἓν μέλος
  choice: une seule partie
  rationale: « Partie » exprime clairement μέλος comme partie du corps ; « seule » rend la valeur de ἓν en soulignant l’uniformité supposée.
- source_word: ποῦ
  choice: où serait… ?
  rationale: Préserve la forme et la force de la question rhétorique grecque dans un français idiomatique.
- source_word: τὸ σῶμα
  choice: le corps
  rationale: Rend directement le nom défini et conserve la métaphore sans explicitation théologique ajoutée.
theological_decisions:
- issue: Portée de la métaphore du corps
  choice: Conserver simplement « le corps »
  alternative: Expliciter « le corps du Christ » ou « l’Église »
  rationale: Le contexte applique la métaphore à la communauté, mais ce verset dit seulement « le corps ». La traduction n’ajoute donc pas une précision absente du grec.
translation_notes:
  register: Français moderne, sobre et digne. La formulation garde la concision et la question rhétorique de l’original. « Partie » est plus naturel ici que « membre », qui pourrait d’abord évoquer en français une personne appartenant à un groupe.
