  text: καὶ διαιρέσεις ἐνεργημάτων εἰσίν, ⸂ὁ δὲ⸃ ⸀αὐτὸς θεός, ὁ ἐνεργῶν τὰ πάντα ἐν πᾶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/006.yaml
  text: And there are varieties of workings[b][a], but it is the same God who works all things in all people.
translation:
  language: fr
  text: Il y a aussi diverses activités, mais c’est le même Dieu qui agit en tout en tous.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement « en tous ». Le grec ne précise pas le nom; dans le contexte, cela renvoie vraisemblablement à tous les membres de la communauté. Ou, par explicitation : « en chacun ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: διαιρέσεις
  choice: diverses formes
  rationale: Dans la série des versets 4 à 6, le terme désigne une diversité de manifestations au sein d’une même unité, sans suggérer conflit ni rupture.
- source_word: ἐνεργημάτων
  choice: d’action
  rationale: Le nom évoque des activités, des opérations ou leurs effets. « Formes d’action » est naturel en français actuel et convient aux manifestations de l’activité divine dans le contexte.
- source_word: ὁ δὲ αὐτὸς θεός
  choice: mais c’est le même Dieu
  rationale: « Mais » rend le léger contraste entre la diversité des actions et l’identité de leur source. La tournure « c’est le même Dieu » restitue naturellement en français la proposition nominale grecque.
- source_word: ὁ ἐνεργῶν
  choice: qui accomplit
  rationale: Le participe présent décrit Dieu comme l’auteur actif de ce qui se produit. « Accomplit » permet de conserver τὰ πάντα comme complément direct sans une formulation française artificielle.
- source_word: τὰ πάντα
  choice: tout
  rationale: « Tout » garde la portée large de l’expression grecque, sans la limiter explicitement aux seuls dons ou effets mentionnés dans le contexte immédiat.
- source_word: ἐν πᾶσιν
  choice: en tous
  rationale: La formulation conserve l’indétermination du grec, qui ne fournit aucun nom après « tous ». Le contexte oriente probablement vers tous les membres de la communauté.
theological_decisions:
- issue: Portée de l’action de Dieu dans τὰ πάντα ἐν πᾶσιν
  choice: « qui accomplit tout en tous »
  alternative: « qui produit tous ces effets en chacun »
  rationale: Le texte reste large tout en s’inscrivant dans le contexte des manifestations spirituelles. La traduction ne restreint pas « tout » aux dons seuls et ne précise pas dans le corps du verset ce que le grec laisse sous-entendu après « tous ».
translation_notes:
  register: Français international moderne, clair et digne. « Diverses formes d’action » évite le technicisme de « diversité d’opérations », tandis que « en tous » préserve l’ambiguïté réelle du texte source; la note en explicite la lecture personnelle probable.
