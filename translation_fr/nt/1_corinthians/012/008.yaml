id: 1CO.12.8
reference: 1 Corinthians 12:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ᾧ μὲν γὰρ διὰ τοῦ πνεύματος δίδοται λόγος σοφίας, ἄλλῳ δὲ λόγος γνώσεως κατὰ τὸ αὐτὸ πνεῦμα,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/008.yaml
  text: For to one is given through the Spirit a message of wisdom[a], and to another a message of knowledge according to the same Spirit[c][b],
translation:
  language: fr
  text: En effet, à l’un est donnée, par l’Esprit, une parole de sagesse[a] ; à un autre, une parole de connaissance[b], selon le même Esprit[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un message de sagesse » ou « une expression de sagesse ».
    reason: lexical_alternative
  - marker: b
    text: Ou « un message de connaissance » ou « une expression de connaissance ».
    reason: lexical_alternative
  - marker: c
    text: Ou « par le même Esprit ». Le grec emploie ici une préposition différente de celle traduite plus haut par « par l’Esprit » ; elle peut souligner que ce don est accordé en accord avec le même Esprit, source commune.
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾧ μὲν … ἄλλῳ δὲ
  choice: à l’un… à un autre
  rationale: Cette tournure française naturelle conserve la répartition contrastée entre différents membres de la communauté.
- source_word: διὰ τοῦ πνεύματος
  choice: par l’Esprit
  rationale: διά avec le génitif exprime ici le moyen ou l’agent. « Par l’Esprit » est idiomatique en français tout en distinguant cette construction du κατά qui suit.
- source_word: δίδοται
  choice: est donnée
  rationale: Le présent passif indique que cette capacité de parole est reçue plutôt que produite de façon autonome.
- source_word: λόγος σοφίας
  choice: une parole de sagesse
  rationale: « Parole » peut désigner ici une expression ou communication porteuse de sagesse. Elle conserve aussi la portée assez large de λόγος sans préciser indûment la forme du don.
- source_word: λόγος γνώσεως
  choice: une parole de connaissance
  rationale: Le même rendu de λόγος maintient le parallélisme grec ; « connaissance » traduit directement γνώσις.
- source_word: κατὰ τὸ αὐτὸ πνεῦμα
  choice: selon le même Esprit
  rationale: « Selon » préserve la valeur d’accord ou de conformité possible de κατά et rend visible le changement de préposition par rapport à διά.
theological_decisions:
- issue: Référent de πνεῦμα
  choice: l’Esprit, avec majuscule
  alternative: l’esprit humain
  rationale: Le contexte immédiat de 1 Corinthiens 12 présente l’unique Esprit comme celui qui accorde et répartit les manifestations ; la majuscule signale ce référent contextuel sans ajouter « Saint » au texte.
- issue: Sens de λόγος dans les expressions λόγος σοφίας et λόγος γνώσεως
  choice: parole
  alternative: message ou expression
  rationale: « Parole » garde l’ambiguïté de λόγος entre contenu communiqué et acte de parole, sans enfermer ces dons dans une définition charismatique plus précise que le grec.
- issue: Rapport exprimé par κατά
  choice: selon le même Esprit
  alternative: par le même Esprit
  rationale: Le choix retenu préserve la variation prépositionnelle du grec et sa possible nuance de conformité, tout en laissant une autre lecture idiomatique en note.
translation_notes:
  register: Français international moderne, clair et digne. La ponctuation met en relief le parallélisme distributif. « Parole » reste naturelle dans un contexte biblique tout en préservant l’étendue sémantique de λόγος ; les formulations plus explicatives figurent en notes.
