  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ γὰρ τὸ σῶμα οὐκ ἔστιν ἓν μέλος ἀλλὰ πολλά.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/014.yaml
  text: For the body is not one member, but many.
translation:
  language: fr
  text: En effet, le corps n’est pas un seul membre, mais plusieurs.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ γὰρ
  choice: En effet
  rationale: La combinaison introduit une explication qui prolonge l’argument précédent. « En effet » exprime naturellement ce lien en français moderne.
- source_word: τὸ σῶμα
  choice: le corps
  rationale: Traduction directe du sujet, qui conserve telle quelle l’image corporelle employée par Paul sans l’expliciter comme désignant l’Église.
- source_word: οὐκ ἔστιν
  choice: n’est pas
  rationale: Le verbe copule avec négation est rendu simplement, sans ajouter l’idée explicative de « n’est pas composé de ».
- source_word: ἓν μέλος
  choice: un seul membre
  rationale: « Membre » préserve l’image du corps et la cohérence lexicale du passage. « Un seul » rend clairement la valeur de ἓν dans l’opposition avec la pluralité.
- source_word: ἀλλὰ πολλά
  choice: mais plusieurs
  rationale: πολλά est employé substantivement, avec « membres » sous-entendu. « Plusieurs » conserve cette ellipse tout en étant idiomatique en français.
theological_decisions:
- issue: Référence métaphorique du « corps »
  choice: Conserver « le corps » sans développer l’expression.
  alternative: le corps du Christ
  rationale: Même si le contexte applique l’image à l’Église comme corps du Christ, le verset dit seulement « le corps ». L’expansion introduirait dans le texte une interprétation contextuelle.
translation_notes:
  register: Français international moderne, clair et digne. La formulation reste concise et conserve l’ellipse finale du grec ainsi que la métaphore anatomique.
