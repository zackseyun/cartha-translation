id: 1CO.12.1
reference: 1 Corinthians 12:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Περὶ δὲ τῶν πνευματικῶν, ἀδελφοί, οὐ θέλω ὑμᾶς ἀγνοεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/001.yaml
  text: Concerning spiritual gifts, brothers, I do not want you to be uninformed.
translation:
  language: fr
  text: Au sujet des réalités spirituelles[a], frères[b], je ne veux pas que vous soyez dans l’ignorance.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dons spirituels ». Le grec est plus large et peut aussi signifier « choses spirituelles »; dans ce chapitre, le contexte porte surtout sur les dons accordés par l’Esprit.
    reason: alternative_reading
  - marker: b
    text: Ici, « frères » est la manière dont Paul s’adresse à l’assemblée; cette appellation comprend vraisemblablement aussi les femmes.
    reason: cultural_note
lexical_decisions:
- source_word: Περὶ δὲ
  choice: Au sujet de
  rationale: Introduit un nouveau sujet. « Au sujet de » rend naturellement περί, tandis que la légère transition marquée par δέ n’exige pas nécessairement un mot distinct en français.
- source_word: τῶν πνευματικῶν
  choice: des réalités spirituelles
  rationale: L’adjectif substantivé est volontairement large et peut désigner les choses ou réalités spirituelles; le contexte porte notamment sur les dons de l’Esprit, mais le mot « dons » n’est pas explicite ici.
- source_word: ἀδελφοί
  choice: frères
  rationale: Conserve la forme masculine du vocatif grec. Dans cet emploi paulinien, l’appellation s’adresse vraisemblablement à toute l’assemblée, femmes comprises, ce qu’indique la note.
- source_word: οὐ θέλω ὑμᾶς ἀγνοεῖν
  choice: je ne veux pas que vous soyez dans l’ignorance
  rationale: Rend fidèlement l’idiome par lequel Paul annonce un enseignement important, dans un français actuel et digne, sans la connotation insultante que pourrait prendre « ignorants ».
theological_decisions:
- issue: Interprétation de τῶν πνευματικῶν
  choice: « réalités spirituelles » dans le texte principal
  alternative: « dons spirituels »; éventuellement « personnes spirituelles »
  rationale: Le grec est elliptique et plus large que « dons spirituels ». Bien que les versets suivants traitent des manifestations et des dons accordés par l’Esprit, « réalités spirituelles » préserve ici l’ambiguïté réelle sans imposer trop tôt une interprétation.
translation_notes:
  register: Français international moderne, clair et digne. « Réalités spirituelles » est naturel tout en préservant l’ampleur du grec; les deux notes rendent explicites l’ambiguïté lexicale et la portée collective de l’adresse.
