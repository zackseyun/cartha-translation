  source_fidelity: « Au sujet des réalités spirituelles » rend de façon fidèle περί δὲ τῶν πνευματικῶν sans introduire « dons », absent du grec. L’omission d’un équivalent autonome de δέ est idiomatique en français et conserve suffisamment la transition. « Frères » correspond au vocatif ἀδελφοί, et « je ne veux pas que vous soyez dans l’ignorance » traduit avec exactitude οὐ θέλω ὑμᾶς ἀγνοεῖν.
  naturalness: Le français est clair, actuel et d’un registre biblique sobre. « Être dans l’ignorance » est légèrement soutenu, mais naturel et particulièrement approprié à l’énoncé paulinien. « Réalités spirituelles » est une formulation recevable en français international et évite de réduire prématurément le terme aux seuls dons.
  terminology: Le choix de « réalités spirituelles » préserve l’ambiguïté du substantif grec et s’accorde avec la note proposant « dons spirituels ». La note sur « frères » explique sans modifier le genre grammatical du terme source. « Esprit » avec majuscule est cohérent avec le contexte chrétien immédiat.
