id: 1CO.12.12
reference: 1 Corinthians 12:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καθάπερ γὰρ τὸ σῶμα ἕν ἐστιν καὶ μέλη ⸂πολλὰ ἔχει⸃, πάντα δὲ τὰ μέλη τοῦ ⸀σώματος πολλὰ ὄντα ἕν ἐστιν σῶμα, οὕτως καὶ ὁ Χριστός·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/012.yaml
  text: For just as the body is one and has many members[a], and all the members of the body, though they are many, are one body[b], so also is Messiah.
translation:
  language: fr
  text: En effet, de même que le corps est un et possède de nombreux membres, et que tous les membres du corps, bien que nombreux, constituent un seul corps, ainsi en est-il aussi du Messie.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ainsi aussi le Messie ». On peut également traduire le titre grec Χριστός par « le Christ ».'
    reason: La note signale à la fois la tournure grecque très condensée et l’autre traduction française traditionnelle du titre.
lexical_decisions:
- source_word: Καθάπερ γὰρ
  choice: En effet, de même que
  rationale: « En effet » rend la valeur explicative de γάρ, tandis que « de même que » conserve la comparaison renforcée introduite par καθάπερ.
- source_word: τὸ σῶμα ἕν ἐστιν
  choice: le corps est un
  rationale: Cette formulation garde l’image corporelle et l’affirmation numérique d’unité sans la paraphraser.
- source_word: μέλη
  choice: membres
  rationale: « Membres » est le terme français naturel dans la métaphore du corps et permet de conserver le lien avec son application communautaire dans le contexte.
- source_word: πολλὰ ὄντα
  choice: bien que nombreux
  rationale: 'Le participe a ici une nuance concessive : la pluralité des membres ne supprime pas l’unité du corps.'
- source_word: ἕν ἐστιν σῶμα
  choice: constituent un seul corps
  rationale: Le verbe « constituent » rend naturellement en français le singulier collectif grec tout en maintenant l’idée que les nombreux membres sont un corps unique.
- source_word: οὕτως καὶ ὁ Χριστός
  choice: ainsi en est-il aussi du Messie
  rationale: La formulation française conserve la conclusion comparative et l’expression théologique condensée, sans ajouter « corps », « Église » ni autre explicitation absente du grec.
theological_decisions:
- issue: Traduction de ὁ Χριστός
  choice: du Messie
  alternative: du Christ
  rationale: Χριστός porte ici sa valeur de titre, « l’Oint » ou « le Messie ». « Messie » rend explicitement ce sens en français, tandis que « Christ » peut être perçu comme un nom propre.
- issue: Portée de l’expression οὕτως καὶ ὁ Χριστός
  choice: Maintenir l’expression condensée « ainsi en est-il aussi du Messie »
  alternative: ainsi en est-il du corps du Messie / de l’Église
  rationale: Le grec ne nomme explicitement ni « le corps du Messie » ni « l’Église ». L’explication se développe dans les versets suivants ; l’ajouter ici résoudrait prématurément la tension du texte.
translation_notes:
  register: Français international actuel, digne et lisible. La syntaxe comparative reste proche du grec, tandis que « constituent » évite une construction artificielle avec le sujet pluriel « tous les membres ». L’expression finale demeure volontairement concise afin de ne pas expliciter à la place de Paul l’identification entre le Messie et le corps formé de nombreux membres.
