source:
  edition: SBLGNT
  text: ⸀ἑτέρῳ πίστις ἐν τῷ αὐτῷ πνεύματι, ⸀ἄλλῳ χαρίσματα ἰαμάτων ἐν τῷ ⸀ἑνὶ πνεύματι,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/009.yaml
  text: to another[a], faith by the same Spirit; to another, gifts of healings by the one Spirit[b],
translation:
  language: fr
  text: à un autre, la foi[a], par le même Esprit ; à un autre, des dons de guérisons[b], par un seul Esprit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la fidélité » ou « la confiance » pour « la foi » (πίστις).
    reason: lexical_alternative
  - marker: b
    text: 'Le grec porte littéralement « dons de guérisons » : les deux noms sont au pluriel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑτέρῳ
  choice: à un autre
  rationale: Le datif poursuit la répartition commencée au verset précédent. Cette formulation française est naturelle sans imposer une différence de sens trop marquée avec ἄλλῳ.
- source_word: πίστις
  choice: la foi
  rationale: « Foi » demeure le rendu principal le plus direct de πίστις. Dans ce contexte, il s’agit d’une réalité accordée par l’Esprit, sans que la traduction précise davantage sa nature.
- source_word: ἐν τῷ αὐτῷ πνεύματι
  choice: par le même Esprit
  rationale: Ici, ἐν peut exprimer le moyen ou l’action de l’Esprit. « Par » est idiomatique en français et « le même Esprit » conserve l’accent du grec sur l’identité de celui qui agit.
- source_word: ἄλλῳ
  choice: à un autre
  rationale: Le datif continue la structure distributive. Rendre ἑτέρῳ et ἄλλῳ de la même manière évite de forcer en français une distinction qui n’est pas nécessairement significative ici.
- source_word: χαρίσματα
  choice: dons
  rationale: Le pluriel désigne des dons accordés gratuitement et correspond au vocabulaire du contexte immédiat.
- source_word: ἰαμάτων
  choice: guérisons
  rationale: Le pluriel français conserve le nombre du grec, même si « dons de guérison » serait plus courant.
- source_word: ἐν τῷ ἑνὶ πνεύματι
  choice: par l’unique Esprit
  rationale: « Par » exprime naturellement l’action ou le moyen. « L’unique Esprit » distingue ἑνί (« un, unique ») de αὐτῷ (« même ») et souligne l’unité au sein de la diversité des dons.
theological_decisions:
- issue: Sens de πίστις dans un contexte de dons spirituels
  choice: la foi
  alternative: la confiance ; la fidélité
  rationale: Le contexte présente la foi comme accordée par l’Esprit, mais ne définit pas plus précisément ce don. Le texte principal garde donc le terme large « foi », tandis que les autres possibilités lexicales sont signalées en note.
- issue: Référent de πνεύματι
  choice: Esprit, avec une majuscule
  alternative: esprit
  rationale: Dans le développement de 1 Corinthiens 12, le terme renvoie clairement à l’Esprit saint, qui accorde et répartit les dons. La majuscule explicite ce référent sans ajouter une affirmation étrangère au contexte.
- issue: Valeur de ἐν avec πνεύματι
  choice: par
  alternative: dans
  rationale: La valeur instrumentale convient à la formule de distribution des dons, tout en reconnaissant que la préposition grecque peut aussi être rendue plus littéralement par « dans ».
translation_notes:
  register: Français international moderne, digne et accessible. La structure elliptique et distributive du grec est conservée. « Dons de guérisons », légèrement moins idiomatique, maintient intentionnellement le double pluriel du texte source ; la note l’explique.
