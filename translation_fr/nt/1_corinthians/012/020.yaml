  text: But as it is[a], there are many parts, yet one body.
translation:
  language: fr
  text: Mais en réalité, il y a de nombreuses parties, et pourtant un seul corps.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νῦν
  choice: en réalité
  rationale: Dans ce contexte argumentatif, νῦν désigne l’état réel des choses, par contraste avec l’hypothèse du verset précédent, plutôt qu’un simple « maintenant » temporel.
- source_word: δὲ
  choice: Mais
  rationale: La particule marque ici une reprise contrastive après l’énoncé hypothétique précédent.
- source_word: πολλὰ ... μέλη
  choice: plusieurs parties
  rationale: Dans la métaphore anatomique, μέλη désigne les parties constitutives du corps. « Parties » est naturel en français moderne et évite que « membres » soit d’abord compris au sens institutionnel.
- source_word: μὲν ... δὲ
  choice: plusieurs parties, et pourtant un seul corps
  rationale: La paire corrélative oppose la pluralité des parties à l’unité du corps. « Et pourtant » exprime clairement ce contraste sans calquer lourdement les particules grecques.
- source_word: ἓν
  choice: un seul
  rationale: « Un seul » fait ressortir l’unité du corps face à la pluralité de ses parties.
- source_word: σῶμα
  choice: corps
  rationale: Le terme conserve à la fois l’image anatomique et sa portée théologique dans le développement de Paul.
theological_decisions:
- issue: Traduction de μέλη dans la métaphore du corps
  choice: parties
  alternative: membres
  rationale: « Parties » communique directement l’image anatomique en français contemporain sans introduire d’emblée le sens ecclésial de « membres ». Le contexte permet néanmoins au lecteur de saisir l’application communautaire.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation conserve le contraste entre pluralité et unité ainsi que le caractère métaphorique du passage.
