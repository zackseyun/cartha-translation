id: 1CO.12.5
reference: 1 Corinthians 12:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ διαιρέσεις διακονιῶν εἰσιν, καὶ ὁ αὐτὸς κύριος·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/005.yaml
  text: And there are varieties of ministries[a], and the same Lord.
translation:
  language: fr
  text: Il y a diversité de services[a], et le Seigneur est le même.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ministères » ou « formes de service ».
    reason: Le grec διακονιῶν possède un champ de sens qui englobe le service, le ministère et diverses fonctions exercées au service d’autrui.
lexical_decisions:
- source_word: διαιρέσεις
  choice: diversité
  rationale: Dans le parallèle des versets 4 à 6, le terme désigne des différences de forme ou de fonction au sein d’une même unité, et non des divisions conflictuelles.
- source_word: διακονιῶν
  choice: services
  rationale: Le mot grec peut désigner des services, des ministères ou des fonctions de service. « Services » conserve ici le sens large de l’activité accomplie au service des autres, sans la limiter à une charge ecclésiale officielle.
- source_word: ὁ αὐτὸς
  choice: le même
  rationale: Cette formulation naturelle en français maintient l’accent sur l’identité du Seigneur au milieu de la diversité.
- source_word: κύριος
  choice: Seigneur
  rationale: « Seigneur » est l’équivalent habituel de ce titre et en conserve la portée théologique sans préciser son référent dans le corps du texte.
- source_word: καὶ
  choice: et
  rationale: La répétition de « et » relie cette affirmation aux propositions parallèles des versets voisins et préserve la structure additive du grec.
- source_word: εἰσιν
  choice: il y a
  rationale: La tournure existentielle « il y a » rend le grec de façon naturelle et claire en français.
theological_decisions:
- issue: Référent de « Seigneur » dans la formulation de 1 Corinthiens 12.4-6
  choice: Conserver le seul titre « Seigneur » ; dans le contexte, il renvoie très probablement au Seigneur Jésus.
  alternative: Comprendre le titre comme une désignation plus générale du Seigneur ou de Dieu.
  rationale: 'Le contexte présente une série à trois termes : le même Esprit, le même Seigneur et le même Dieu. La traduction garde la formulation de Paul sans explicitation interprétative.'
translation_notes:
  register: Français international moderne, simple et digne. La construction parallèle conserve le contraste implicite entre la diversité des services et l’unité du Seigneur, sans remplacer le « et » grec par un « mais » explicatif.
