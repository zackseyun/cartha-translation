source:
  edition: SBLGNT
  text: πάντα δὲ ταῦτα ἐνεργεῖ τὸ ἓν καὶ τὸ αὐτὸ πνεῦμα, διαιροῦν ἰδίᾳ ἑκάστῳ καθὼς βούλεται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/011.yaml
  text: But one and the same Spirit works all these things[d][c][b][a], distributing to each one individually just as he wills.
translation:
  language: fr
  text: Mais c’est un seul et même Esprit qui accomplit[a] toutes ces choses, les répartissant[b] à chacun en particulier, comme il le veut[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « produit » ou « met en œuvre toutes ces choses ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « les attribuant » ou « les distribuant ».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « comme il le choisit ». Le verbe grec peut exprimer la volonté, le choix ou le désir.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα δὲ ταῦτα
  choice: Mais ... toutes ces choses
  rationale: '« Toutes ces choses » reprend l’ensemble des manifestations énumérées auparavant. « Mais » rend la transition légèrement contrastive de δέ : malgré leur diversité, elles ont une seule source.'
- source_word: ἐνεργεῖ
  choice: accomplit
  rationale: Le verbe exprime ici une action efficace qui produit un résultat. « Accomplit » reste naturel en français et conserve cette force causative sans préciser indûment le mécanisme.
- source_word: τὸ ἓν καὶ τὸ αὐτὸ πνεῦμα
  choice: le seul et même Esprit
  rationale: La tournure souligne fortement l’unité et l’identité de la source des divers dons. « Le seul et même Esprit » exprime cette insistance en français courant et digne.
- source_word: διαιροῦν
  choice: les répartissant
  rationale: Le participe explique comment l’Esprit agit en attribuant les diverses manifestations. Le pronom « les » reprend naturellement « toutes ces choses »; « répartir » conserve l’idée d’attribution sans suggérer une division négative.
- source_word: ἰδίᾳ ἑκάστῳ
  choice: à chacun en particulier
  rationale: Cette formulation préserve la portée distributive singulière de ἑκάστῳ et l’accent individualisant de ἰδίᾳ.
- source_word: καθὼς βούλεται
  choice: comme il le veut
  rationale: La formule rend la volonté ou la décision propre de l’Esprit. Le pronom personnel explicite en français l’agent déjà indiqué par le sujet grec.
theological_decisions:
- issue: Référent de πνεῦμα et caractère personnel de son action
  choice: « Esprit » désigne le Saint-Esprit; « comme il le veut » présente sa volonté personnelle.
  alternative: Employer une formulation impersonnelle ou éviter tout pronom.
  rationale: Bien que πνεῦμα soit grammaticalement neutre en grec, βούλεται lui attribue une volonté. Le contexte immédiat présente donc l’Esprit comme un agent personnel qui répartit les manifestations, sans qu’il soit nécessaire d’ajouter une qualification doctrinale absente du verset.
- issue: Portée de l’action souveraine exprimée par καθὼς βούλεται
  choice: « comme il le veut »
  alternative: « comme il le choisit » ou « selon son désir »
  rationale: Le grec affirme que la répartition dépend de la volonté de l’Esprit. « Veut » conserve cette affirmation sans préciser davantage le rapport entre volonté, choix et désir.
translation_notes:
  register: Français international moderne, clair et digne. La phrase garde l’insistance grecque sur l’unique source des dons et sur leur attribution individuelle. Les marqueurs de notes suivent l’élément précis qu’ils éclairent.
