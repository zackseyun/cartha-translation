id: 1CO.12.3
reference: 1 Corinthians 12:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: διὸ γνωρίζω ὑμῖν ὅτι οὐδεὶς ἐν πνεύματι θεοῦ λαλῶν λέγει· Ἀνάθεμα ⸀Ἰησοῦς, καὶ οὐδεὶς δύναται εἰπεῖν· ⸂Κύριος Ἰησοῦς⸃ εἰ μὴ ἐν πνεύματι ἁγίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/003.yaml
  text: Therefore I make known to you that no one speaking by the Spirit of God says[a], “Jesus is accursed,” and no one is able to say[b], “Jesus is Lord,” except by the Holy Spirit.
translation:
  language: fr
  text: 'C’est pourquoi je vous fais savoir que personne, parlant par l’Esprit de Dieu, ne dit : « Jésus est maudit[a] », et que personne ne peut dire : « Jésus est Seigneur[b] », si ce n’est par l’Esprit Saint.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Que Jésus soit maudit », selon la force que peut avoir l’exclamation grecque Ἀνάθεμα Ἰησοῦς.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « Seigneur Jésus »; dans ce contexte, l’expression a valeur de confession : « Jésus est Seigneur ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: διό
  choice: C’est pourquoi
  rationale: Marque naturellement en français la conséquence ou l’inférence tirée de ce qui précède.
- source_word: γνωρίζω ὑμῖν
  choice: je vous fais savoir
  rationale: Rend directement le sens causatif de γνωρίζω sans ajouter une nuance de volonté absente du grec.
- source_word: ἐν πνεύματι θεοῦ
  choice: par l’Esprit de Dieu
  rationale: Rend ἐν dans son sens instrumental ou d’agent de l’inspiration, tout en restant naturel en français.
- source_word: Ἀνάθεμα Ἰησοῦς
  choice: Jésus est maudit
  rationale: La proposition nominale grecque appelle une copule en français. « Maudit » transmet la force de ἀνάθεμα sans recourir au terme moins courant « anathème ».
- source_word: δύναται εἰπεῖν
  choice: peut dire
  rationale: Expression française claire et naturelle de la capacité indiquée par δύναται.
- source_word: Κύριος Ἰησοῦς
  choice: Jésus est Seigneur
  rationale: Dans ce contenu de confession, l’ordre nominal grec se rend naturellement par une proposition avec copule; « Seigneur » conserve le poids du titre κύριος.
- source_word: εἰ μὴ
  choice: si ce n’est
  rationale: Exprime l’unique exception après une proposition négative, dans un registre digne et courant.
- source_word: ἐν πνεύματι ἁγίῳ
  choice: par l’Esprit Saint
  rationale: Comme dans la première proposition, la préposition est comprise instrumentalement; « Esprit Saint » désigne ici le référent divin personnel.
theological_decisions:
- issue: Portée du titre κύριος dans la confession Κύριος Ἰησοῦς
  choice: Seigneur
  alternative: Maître
  rationale: « Seigneur » préserve à la fois le sens ordinaire du titre et sa forte portée christologique dans le contexte paulinien, sans préciser davantage que le texte.
- issue: Nature de la confession rendue possible par l’Esprit Saint
  choice: Conserver l’affirmation telle quelle, sans limiter « dire » à une simple articulation verbale ni en faire explicitement un exposé complet de la conversion
  alternative: Préciser « dire sincèrement » ou développer une doctrine de la régénération
  rationale: Le texte lie la confession de la seigneurie de Jésus à l’action de l’Esprit Saint, mais n’explicite pas ici toutes les dimensions doctrinales de cette relation.
- issue: Valeur de Ἀνάθεμα Ἰησοῦς
  choice: Jésus est maudit
  alternative: Que Jésus soit maudit
  rationale: Le grec est une exclamation nominale sans impératif exprimé. La traduction principale garde donc une lecture déclarative, tandis que la note signale la force imprécatoire possible.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe conserve le parallélisme grec entre les deux affirmations. « Si ce n’est » maintient un registre légèrement soutenu sans être archaïque, et les notes préservent les ambiguïtés des deux propositions nominales grecques.
