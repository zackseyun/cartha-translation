source:
  edition: SBLGNT
  text: δεῖ γὰρ καὶ αἱρέσεις ἐν ὑμῖν εἶναι, ἵνα ⸀καὶ οἱ δόκιμοι φανεροὶ γένωνται ἐν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/019.yaml
  text: For there must also be factions among you[b][a], so that those who are approved may also become evident among you.
translation:
  language: fr
  text: Car il faut aussi qu’il y ait des factions[a] parmi vous, afin que ceux qui ont fait leurs preuves[b] apparaissent eux aussi clairement parmi vous.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « divisions », « partis » ou « sectes »; dans un usage plus tardif, le mot peut aussi signifier « hérésies ». Ici, il désigne très probablement des factions au sein de l’assemblée.
    reason: lexical_alternative
  - marker: b
    text: Ou « ceux qui sont reconnus comme authentiques » ou « ceux qui ont résisté à l’épreuve ».
    reason: lexical_alternative
lexical_decisions:
- source_word: δεῖ
  choice: il faut
  rationale: Conserve l’idée forte de nécessité sans préciser si celle-ci est providentielle, logique ou liée à la situation.
- source_word: γὰρ
  choice: car
  rationale: Maintient le lien explicatif avec le verset précédent.
- source_word: καὶ αἱρέσεις
  choice: aussi… des factions
  rationale: Dans ce contexte, αἱρέσεις désigne vraisemblablement des groupes rivaux au sein de l’assemblée, non l’hérésie au sens doctrinal plus tardif.
- source_word: ἐν ὑμῖν
  choice: parmi vous
  rationale: Expression française naturelle qui situe les factions au sein de la communauté.
- source_word: ἵνα
  choice: afin que
  rationale: Préserve la nuance de but ou de résultat sans trancher artificiellement entre les deux.
- source_word: καὶ οἱ δόκιμοι
  choice: ceux qui ont fait leurs preuves… eux aussi
  rationale: Rend l’idée de personnes éprouvées et reconnues comme authentiques, tout en conservant le second καί.
- source_word: φανεροὶ γένωνται
  choice: soient clairement reconnus
  rationale: Exprime le fait de devenir manifestes ou identifiables au grand jour dans un français naturel.
- source_word: ἐν ὑμῖν
  choice: parmi vous
  rationale: Conserve la répétition grecque et l’encadrement communautaire de la phrase.
theological_decisions:
- issue: Sens de αἱρέσεις
  choice: factions
  alternative: divisions, partis, sectes ou, dans l’usage plus tardif, hérésies
  rationale: Le contexte immédiat concerne les clivages internes de l’assemblée. « Factions » évite d’importer le sens doctrinal postérieur d’« hérésies ».
- issue: Portée de δεῖ
  choice: il faut, sans identifier la source de cette nécessité
  alternative: nécessité divine ou inévitabilité pratique
  rationale: Paul affirme une nécessité sans en préciser ici la nature; la formulation conserve cette tension.
- issue: Portée de ἵνα
  choice: afin que
  alternative: de sorte que
  rationale: Le grec peut exprimer le but ou le résultat. « Afin que » reste proche de la construction source sans développer une explication théologique absente du verset.
translation_notes:
  register: Français international moderne, digne et accessible. « Factions » conserve la force du conflit communautaire; « ceux qui ont fait leurs preuves » rend δόκιμοι plus naturellement que le calque « les approuvés ».
