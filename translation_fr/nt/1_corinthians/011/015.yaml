  text: γυνὴ δὲ ἐὰν κομᾷ, δόξα αὐτῇ ἐστιν; ὅτι ἡ κόμη ἀντὶ περιβολαίου ⸀δέδοται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/015.yaml
  text: But if a woman has long hair[a], it is her glory[b], because her hair has been given to her instead of a covering.
translation:
  language: fr
  text: Mais si une femme[a] porte les cheveux longs, c’est sa gloire, car sa chevelure lui a été donnée à la place d’une couverture[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une épouse ». Le mot grec peut désigner une femme ou une épouse selon le contexte.
    reason: lexical_alternative
  - marker: b
    text: Ou « comme couverture ». La préposition grecque peut exprimer une correspondance ou une substitution ; cette expression ne suffit donc pas, à elle seule, à déterminer si la chevelure constitue la couverture ou si elle est donnée en relation avec une autre.
    reason: lexical_alternative
lexical_decisions:
- source_word: γυνή
  choice: une femme
  rationale: Le nom peut désigner une femme ou une épouse selon le contexte. Ici, la formulation générale favorise « une femme », sans exclure le cadre relationnel du passage.
- source_word: κομᾷ
  choice: porte les cheveux longs
  rationale: Le verbe désigne le fait d’avoir ou de porter les cheveux longs. Cette tournure française actuelle exprime clairement cette nuance.
- source_word: δόξα
  choice: gloire
  rationale: « Gloire » conserve la force rhétorique du grec et l’idée de ce qui honore ou met en valeur.
- source_word: κόμη
  choice: chevelure
  rationale: Le nom désigne les cheveux de la tête, souvent envisagés comme longs. « Chevelure » évite de répéter immédiatement « cheveux longs » tout en gardant cette portée.
- source_word: ἀντί
  choice: en guise de
  rationale: Cette expression peut rendre l’idée de correspondance fonctionnelle tout en laissant ouverte une nuance de substitution, que la note explicite.
- source_word: περιβολαίου
  choice: couverture
  rationale: Le terme grec désigne de façon générale ce qui enveloppe ou couvre. « Couverture » reste plus large que « voile », qui imposerait une précision absente du mot grec.
- source_word: δέδοται
  choice: lui a été donnée
  rationale: Le parfait passif présente la chevelure comme ayant été donnée et demeurant dans cet état; le passé composé passif le rend naturellement en français.
theological_decisions:
- issue: La chevelure est-elle elle-même la couverture, ou est-elle donnée en relation avec une autre couverture ?
  choice: en guise de couverture
  alternative: à la place d’une couverture
  rationale: La préposition ἀντί peut exprimer une correspondance ou une substitution. Le texte principal reste naturel sans trancher à lui seul la question plus large du type de couverture envisagé dans le passage.
- issue: περιβόλαιον désigne-t-il précisément un voile ?
  choice: couverture
  alternative: voile
  rationale: Le nom grec est plus général que « voile ». Une traduction générique préserve la tension interprétative et n’importe aucune prescription confessionnelle particulière.
translation_notes:
  register: Français international moderne, clair et digne. « Porte les cheveux longs » est idiomatique; « chevelure » évite une répétition lourde. La formulation conserve la « gloire » du texte grec et ne précise pas indûment la nature de la couverture.
