reference: 1 Corinthians 11:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀνὴρ μὲν γὰρ οὐκ ὀφείλει κατακαλύπτεσθαι τὴν κεφαλήν, εἰκὼν καὶ δόξα θεοῦ ὑπάρχων· ⸀ἡ γυνὴ δὲ δόξα ἀνδρός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/007.yaml
  text: For a man ought not to cover his head[a], since he is the image and glory of God[b]; but the woman is the glory of man.
translation:
  language: fr
  text: En effet, l’homme[a] ne doit pas se couvrir la tête[b], puisqu’il est l’image et la gloire de Dieu ; mais la femme est la gloire de l’homme.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les mots grecs traduits ici par « homme » et « femme » peuvent aussi signifier « mari » et « épouse », selon le contexte.
    reason: alternative_reading
  - marker: b
    text: Ou « se voiler la tête » ; le grec dit plus généralement « se couvrir la tête » et ne précise pas la forme de la couverture.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνὴρ
  choice: l’homme
  rationale: Le nom sans article a ici une portée générique. Le contexte oppose l’homme et la femme dans le culte et dans l’argument tiré de la création, sans limiter explicitement le propos au couple marié.
- source_word: ὀφείλει
  choice: doit
  rationale: Exprime clairement et naturellement l’obligation normative portée par le verbe, sans ajouter l’idée d’une contrainte extérieure.
- source_word: κατακαλύπτεσθαι τὴν κεφαλήν
  choice: se couvrir la tête
  rationale: Rend l’expression grecque de façon directe tout en laissant indéterminée la forme exacte de la couverture ; « se voiler » serait plus précis que le grec.
- source_word: εἰκὼν
  choice: image
  rationale: Équivalent théologique usuel qui conserve l’écho probable au récit de la création.
- source_word: δόξα
  choice: gloire
  rationale: Le même terme est conservé dans ses deux occurrences afin de préserver le parallélisme ainsi que toute la portée théologique et relationnelle du grec.
- source_word: θεοῦ
  choice: de Dieu
  rationale: Le génitif est rendu simplement, sans explicitation interprétative.
- source_word: ὑπάρχων
  choice: puisqu’il est
  rationale: Le participe donne le fondement de l’affirmation précédente ; « puisque » en exprime naturellement la valeur causale.
- source_word: ἡ γυνὴ
  choice: la femme
  rationale: Rend la catégorie féminine mise en contraste avec l’homme. « L’épouse » est lexicalement possible, mais imposerait ici une portée exclusivement conjugale qui n’est pas certaine.
- source_word: ἀνδρός
  choice: de l’homme
  rationale: Conserve la portée générique et le parallélisme de l’argument. « De son mari » préciserait une relation conjugale que la forme grecque n’établit pas à elle seule.
theological_decisions:
- issue: Faut-il rendre ἀνήρ et γυνή par « homme/femme » ou « mari/épouse » ?
  choice: homme/femme
  alternative: mari/épouse
  rationale: Le contexte immédiat associe le contraste masculin/féminin au culte et à la théologie de la création. La traduction principale conserve cette portée représentative, tandis qu’une note signale honnêtement l’autre sens lexical possible.
- issue: Comment rendre l’affirmation asymétrique sur la gloire ?
  choice: « la femme est la gloire de l’homme »
  alternative: « la femme reflète la gloire de l’homme » ou « la femme fait honneur à l’homme »
  rationale: Le grec emploie directement ἐστιν avec δόξα. La formulation littérale préserve la tension théologique et le parallélisme sans atténuer ni interpréter l’affirmation.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe conserve le raisonnement causal et le contraste du grec. Le vocabulaire théologique « image » et « gloire » est maintenu sans paraphrase ni atténuation.
