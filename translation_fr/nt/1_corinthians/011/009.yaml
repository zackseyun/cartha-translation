id: 1CO.11.9
reference: 1 Corinthians 11:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ γὰρ οὐκ ἐκτίσθη ἀνὴρ διὰ τὴν γυναῖκα, ἀλλὰ γυνὴ διὰ τὸν ἄνδρα.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/009.yaml
  text: For indeed[a], man was not created for the woman, but woman for the man.
translation:
  language: fr
  text: En effet, l’homme n’a pas été créé pour la femme, mais la femme pour l’homme.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « à cause de la femme […] à cause de l’homme ». La préposition grecque peut exprimer la cause ou la visée.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: En effet
  rationale: La locution introduit une explication qui appuie l’argument précédent. « En effet » rend naturellement en français la valeur explicative de γάρ, tandis que la nuance de καί est absorbée dans l’enchaînement plutôt que traduite lourdement.
- source_word: ἐκτίσθη
  choice: a été créé
  rationale: Le passif de κτίζω signifie ici « être créé » et renvoie au récit de la création. Le passé composé convient au français actuel tout en conservant le passif.
- source_word: ἀνὴρ / γυνὴ
  choice: l’homme / la femme
  rationale: Dans cet appel au récit de la création, les deux noms désignent l’homme et la femme de manière représentative, plutôt que spécifiquement le mari et l’épouse.
- source_word: διὰ τὴν γυναῖκα / διὰ τὸν ἄνδρα
  choice: pour la femme / pour l’homme
  rationale: Avec l’accusatif, διά peut indiquer la cause, le motif ou la visée. « Pour » préserve en français cette relative ouverture tout en convenant à l’orientation de l’argument fondé sur la création.
- source_word: ἀλλὰ
  choice: mais
  rationale: « Mais » rend directement le contraste entre les deux propositions parallèles.
theological_decisions:
- issue: Faut-il comprendre ἀνήρ et γυνή comme « homme/femme » ou « mari/épouse » ?
  choice: homme/femme
  alternative: mari/épouse
  rationale: Le verbe « créer » inscrit l’affirmation dans le récit de la création et favorise une portée homme-femme plus large. La traduction n’impose donc pas une limitation au seul cadre conjugal.
- issue: Faut-il préciser que διά exprime le but plutôt que la cause ?
  choice: Conserver « pour », sans trancher davantage dans le texte
  alternative: « à cause de » ou « en vue de »
  rationale: La préposition grecque avec l’accusatif peut exprimer la cause ou la visée. « Pour » maintient la tension sémantique sans imposer une interprétation théologique plus étroite.
translation_notes:
  register: Français international moderne, sobre et digne. La structure antithétique et le parallélisme du grec sont conservés. L’article défini donne aux termes « homme » et « femme » leur valeur générique naturelle en français.
