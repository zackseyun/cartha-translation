reference: 1 Corinthians 11:33
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ὥστε, ἀδελφοί μου, συνερχόμενοι εἰς τὸ φαγεῖν ἀλλήλους ἐκδέχεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/033.yaml
  text: So then[a], my brothers, when you come together to eat, wait for one another.
translation:
  language: fr
  text: Ainsi donc, mes frères[a], lorsque vous vous réunissez pour manger, attendez-vous les uns les autres.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « mes frères et sœurs » : le grec dit littéralement « frères » et emploie souvent cette forme masculine pour s’adresser à une assemblée mixte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὥστε
  choice: Ainsi donc
  rationale: La conjonction introduit la conséquence pratique des reproches précédents concernant les abus lors du repas du Seigneur. « Ainsi donc » exprime clairement ce lien logique dans un français naturel.
- source_word: ἀδελφοί μου
  choice: mes frères
  rationale: Le vocatif masculin pluriel accompagné du possessif signifie littéralement « mes frères ». La forme du texte grec est conservée, tandis que sa portée vraisemblablement inclusive dans l’adresse à l’assemblée est précisée en note.
- source_word: συνερχόμενοι
  choice: lorsque vous vous réunissez
  rationale: Le participe présent employé avec l’impératif indique la circonstance dans laquelle l’instruction s’applique. Cette formulation reprend naturellement le vocabulaire des réunions communautaires employé dans le chapitre.
- source_word: εἰς τὸ φαγεῖν
  choice: pour manger
  rationale: La préposition suivie de l’infinitif substantivé exprime ici le but. « Pour manger » reste concis et n’ajoute aucune précision absente du grec sur la nature du repas.
- source_word: ἀλλήλους
  choice: les uns les autres
  rationale: Le pronom réciproque désigne les membres de l’assemblée dans leur relation mutuelle. « Les uns les autres » est sa formulation française habituelle.
- source_word: ἐκδέχεσθε
  choice: attendez-vous
  rationale: Dans le contexte immédiat, où certains commencent à manger avant les autres, le verbe signifie très probablement « attendre ». La construction pronominale « attendez-vous les uns les autres » est idiomatique et conserve la réciprocité de l’ordre.
theological_decisions:
- issue: Portée du masculin représentatif dans ἀδελφοί
  choice: Conserver « mes frères » dans le texte et signaler en note que l’adresse peut inclure les femmes de l’assemblée.
  alternative: « mes frères et sœurs »
  rationale: Le nom grec est grammaticalement masculin, mais il sert fréquemment à interpeller l’ensemble d’une communauté chrétienne mixte. La traduction principale conserve la forme explicite du texte source sans nier sa portée inclusive probable.
- issue: Sens contextuel de ἐκδέχεσθε
  choice: « attendez-vous »
  alternative: « accueillez-vous » ou « recevez-vous »
  rationale: Le contexte des versets 21 et 33 oppose le fait de manger sans attendre les autres à la conduite ordonnée demandée par Paul. Le sens « attendre » convient donc mieux, tout en reconnaissant que le verbe peut avoir ailleurs le sens de recevoir ou d’accueillir.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve le lien logique, l’adresse affectueuse et l’impératif réciproque du grec, sans préciser davantage la nature du repas.
