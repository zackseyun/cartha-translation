source:
  edition: SBLGNT
  text: θέλω δὲ ὑμᾶς εἰδέναι ὅτι παντὸς ἀνδρὸς ἡ κεφαλὴ ὁ Χριστός ἐστιν, κεφαλὴ δὲ γυναικὸς ὁ ἀνήρ, κεφαλὴ δὲ ⸀τοῦ Χριστοῦ ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/003.yaml
  text: But I want you to know that the head of every man is Messiah[a], and the head of a woman is the man[b], and the head of Messiah is God.
translation:
  language: fr
  text: Mais je veux que vous sachiez que la tête de tout homme est le Messie[a], que la tête de la femme est l’homme[b], et que la tête du Messie est Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot grec traduit par « tête » peut aussi être compris au sens d’« origine » ou d’« autorité sur autrui » ; le texte principal conserve la métaphore grecque.
    reason: lexical_alternative
  - marker: b
    text: Ici, « femme » et « homme » peuvent aussi se comprendre comme « épouse » et « mari ».
    reason: alternative_reading
lexical_decisions:
- source_word: θέλω δὲ ὑμᾶς εἰδέναι
  choice: Mais je veux que vous sachiez
  rationale: Cette formulation française naturelle conserve l’expression personnelle de la volonté de Paul ainsi que la légère transition ou opposition marquée par δέ.
- source_word: παντὸς ἀνδρὸς
  choice: de tout homme
  rationale: ἀνήρ peut désigner un homme ou un mari. Dans cette première proposition générale, « tout homme » rend directement la portée distributive de παντός sans neutraliser le référent masculin.
- source_word: κεφαλή
  choice: tête
  rationale: Le mot grec désigne littéralement la tête et fonctionne ici comme une métaphore débattue. « Tête » préserve cette image sans imposer dans le texte principal le sens d’« origine » ou d’« autorité ».
- source_word: ὁ Χριστός / τοῦ Χριστοῦ
  choice: le Messie / du Messie
  rationale: Χριστός fonctionne ici comme un titre. « Messie » en conserve le caractère titulaire dans les deux propositions.
- source_word: γυναικός
  choice: de la femme
  rationale: γυνή peut signifier « femme » ou « épouse ». Le sens général est retenu dans le texte, tandis que le sens conjugal demeure signalé en note.
- source_word: ὁ ἀνήρ
  choice: l’homme
  rationale: Dans son parallélisme avec γυνή, ἀνήρ peut signifier « homme » ou « mari ». « L’homme » maintient la lecture générale et l’ambiguïté est explicitée en note.
- source_word: ὁ θεός
  choice: Dieu
  rationale: Rendu français usuel de θεός; le nominatif avec article est le sujet prédicatif de la dernière proposition.
theological_decisions:
- issue: Sens de κεφαλή dans les trois propositions parallèles
  choice: Conserver la métaphore « tête » dans le texte principal.
  alternative: Traduire explicitement par « origine » ou « autorité » / « celui qui a autorité sur ».
  rationale: Le grec laisse la portée exacte de la métaphore ouverte et débattue. La traduction ne doit pas résoudre silencieusement cette tension théologique.
- issue: Valeur de ἀνήρ et γυνή
  choice: Employer « homme » et « femme » dans le texte principal.
  alternative: Employer « mari » et « épouse ».
  rationale: La syntaxe parallèle favorise une formulation générale, mais le contexte et la polysémie des termes grecs permettent aussi une lecture conjugale, conservée en note.
- issue: Portée de la proposition finale concernant le Messie et Dieu
  choice: Traduire directement « la tête du Messie est Dieu ».
  alternative: Ajouter une paraphrase précisant une hiérarchie fonctionnelle ou une infériorité de nature.
  rationale: La formulation directe respecte le texte sans y importer une explication doctrinale qui excéderait ses mots.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « la tête de… est… » reproduit volontairement le parallélisme grec et conserve sa métaphore, même si celle-ci paraît moins idiomatique qu’une paraphrase interprétative.
