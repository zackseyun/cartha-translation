  text: For man is not from woman[a], but woman from man.
translation:
  language: fr
  text: En effet, l’homme ne vient pas de la femme[a], mais la femme vient de l’homme.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « En effet, un mari ne vient pas d’une épouse, mais une épouse vient d’un mari. » Les mots grecs peuvent désigner soit l’homme et la femme, soit le mari et l’épouse ; le sens plus général lié à la création est retenu ici.'
    reason: alternative_reading
lexical_decisions:
- source_word: γάρ
  choice: En effet
  rationale: Introduit la justification de l’affirmation précédente; « En effet » exprime naturellement ce lien argumentatif en français.
- source_word: ἀνὴρ / ἀνδρός
  choice: l’homme / de l’homme
  rationale: Dans cet argument fondé sur le récit de la création, le terme désigne l’homme par contraste avec la femme, plutôt que spécifiquement le mari.
- source_word: ἐκ / ἐξ
  choice: venir de
  rationale: La préposition indique ici la source ou l’origine. « Venir de » rend ce rapport clairement et naturellement dans les deux propositions.
- source_word: γυναικός / γυνὴ
  choice: de la femme / la femme
  rationale: Le contexte créationnel favorise le sens général « femme », sans limiter le propos à l’épouse.
- source_word: ἀλλὰ
  choice: mais
  rationale: Marque directement le contraste fort entre les deux propositions.
- source_word: ἐστιν
  choice: vient
  rationale: Avec ἐκ, la tournure française « vient de » exprime idiomatiquement l’idée d’origine portée par la construction grecque.
theological_decisions:
- issue: Faut-il rendre ἀνήρ/γυνή par « homme/femme » ou par « mari/femme (épouse) » ?
  choice: homme/femme
  alternative: mari/femme (épouse)
  rationale: Paul fait appel à l’origine de l’homme et de la femme dans le récit de la création. Le choix « homme/femme » conserve cette portée générale sans réduire l’affirmation aux seuls conjoints.
translation_notes:
  register: Français international moderne, clair et digne. La répétition de « vient de » préserve le parallélisme et met en relief la notion d’origine.
