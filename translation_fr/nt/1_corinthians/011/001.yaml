  text: μιμηταί μου γίνεσθε, καθὼς κἀγὼ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/001.yaml
  text: Become imitators of me[b][a], just as I also am of the Messiah.
translation:
  language: fr
  text: Devenez mes imitateurs, comme je suis moi aussi imitateur du Messie[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « du Christ ».'
    reason: Traduction traditionnelle possible du titre grec Χριστός.
lexical_decisions:
- source_word: μιμηταί
  choice: imitateurs
  rationale: Le nom grec désigne des personnes qui reproduisent l’exemple d’une autre. « Imitateurs » conserve cette idée explicite, contrairement à « disciples » ou « ceux qui me suivent », qui seraient plus larges.
- source_word: μου
  choice: mes
  rationale: Avec « imitateurs », le génitif grec se rend naturellement en français par le possessif « mes » ; il indique ici la personne prise pour modèle, non une possession mise en avant.
- source_word: γίνεσθε
  choice: Devenez
  rationale: L’impératif présent de γίνομαι exprime l’entrée dans une manière d’être ou son adoption. « Devenez » en garde mieux la force que le simple « soyez ».
- source_word: καθὼς
  choice: comme
  rationale: « Comme » introduit naturellement la comparaison entre l’imitation de Paul par les destinataires et l’imitation du Messie par Paul.
- source_word: κἀγὼ
  choice: je le suis moi-même
  rationale: La crase καί + ἐγώ ajoute l’idée de « moi aussi ». La tournure « je le suis moi-même » rend cette insistance tout en reprenant par « le » le nom « imitateur » laissé sous-entendu en grec.
- source_word: Χριστοῦ
  choice: du Messie
  rationale: Χριστός fonctionne ici comme un titre de Jésus. « Le Messie » en communique le sens en français moderne, tandis que « Christ » demeure une traduction traditionnelle possible.
theological_decisions:
- issue: Sens et rendu de Χριστοῦ
  choice: du Messie
  alternative: du Christ
  rationale: Le contexte présente Jésus comme celui dont Paul reproduit l’exemple. Le titre grec est donc traduit selon son sens, sans ajouter de précision doctrinale ; la forme traditionnelle « Christ » est signalée en note.
- issue: Ellipse dans κἀγὼ Χριστοῦ
  choice: je le suis moi-même du Messie
  alternative: j’imite moi-même le Messie
  rationale: Le grec sous-entend « imitateur » dans le second membre. Le pronom « le » reprend ce nom sans introduire un nouveau verbe explicite, préservant ainsi la construction elliptique tout en restant intelligible en français.
translation_notes:
  register: Français international moderne, concis et digne. La formulation conserve le nom « imitateurs », la valeur de changement portée par « devenez » et l’ellipse comparative du grec. « Je le suis moi-même du Messie » est légèrement soutenu, mais clair et proche de la structure source.
