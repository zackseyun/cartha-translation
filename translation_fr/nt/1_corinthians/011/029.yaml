id: 1CO.11.29
reference: 1 Corinthians 11:29
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ γὰρ ἐσθίων καὶ ⸀πίνων κρίμα ἑαυτῷ ἐσθίει καὶ πίνει μὴ διακρίνων τὸ ⸀σῶμα.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/029.yaml
  text: For the one who eats and drinks eats and drinks judgment on himself[b][a], not discerning the body.
translation:
  language: fr
  text: En effet, celui qui mange et boit mange et boit un jugement contre lui-même, sans discerner[b] le corps.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Certains manuscrits portent « le corps du Seigneur » au lieu de « le corps ».
    reason: textual_variant
  - marker: b
    text: 'Ou : « sans distinguer le corps ». Il peut s’agir de reconnaître la portée du repas du Seigneur, de reconnaître le corps constitué par l’assemblée des croyants, ou des deux.'
    reason: alternative_reading
lexical_decisions:
- source_word: κρίμα
  choice: un jugement
  rationale: Le terme désigne ici un jugement ou un verdict judiciaire. « Jugement » reste plus large que « condamnation » et convient au contexte, où Paul distingue ensuite la discipline divine de la condamnation avec le monde (v. 32).
- source_word: ἑαυτῷ
  choice: contre lui-même
  rationale: Le datif réfléchi indique que la personne qui mange et boit encourt elle-même ce jugement. « Contre lui-même » exprime naturellement en français son caractère défavorable.
- source_word: διακρίνων
  choice: discerner
  rationale: Le verbe peut exprimer l’action de distinguer, d’évaluer correctement ou de reconnaître. « Discerner » conserve cette portée cognitive et morale sans préciser abusivement l’objet exact de la distinction.
- source_word: τὸ σῶμα
  choice: le corps
  rationale: Le texte retenu porte simplement « le corps ». Cette formulation concise préserve l’ambiguïté entre le corps du Christ représenté dans le repas et l’assemblée comprise comme corps du Christ.
- source_word: ὁ … ἐσθίων καὶ πίνων
  choice: celui qui mange et boit
  rationale: Les participes substantivés désignent de manière générale toute personne qui agit ainsi. Cette formulation suit étroitement la structure grecque tout en restant naturelle.
- source_word: μὴ διακρίνων
  choice: sans discerner
  rationale: La tournure participiale grecque décrit la manière ou la circonstance dans laquelle la personne mange et boit. « Sans discerner » la reproduit naturellement sans imposer une relation conditionnelle plus explicite que le texte.
theological_decisions:
- issue: Sens de « le corps » dans le contexte du repas du Seigneur
  choice: Conserver « le corps » sans en préciser le référent dans le texte principal.
  alternative: « le corps du Seigneur » ou « le corps formé par les croyants »
  rationale: Le grec dit seulement « le corps ». Le contexte concerne à la fois le repas lié à Jésus et la manière dont les Corinthiens traitent les autres membres de l’assemblée. La traduction préserve donc cette tension théologique au lieu de la trancher.
- issue: Portée de κρίμα
  choice: « jugement »
  alternative: « condamnation »
  rationale: Dans le contexte, Paul parle d’une discipline divine destinée à éviter d’être condamné avec le monde (v. 32). « Condamnation » suggérerait ici, à tort, que le terme désigne nécessairement la condamnation finale.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition « mange et boit … mange et boit » est maintenue pour reproduire l’insistance et la métaphore du grec. « En effet » rend γάρ comme explication de l’avertissement précédent.
