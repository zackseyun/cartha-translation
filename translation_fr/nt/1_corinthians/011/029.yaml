  naturalness: Le français est moderne, clair et d’un registre biblique sobre. La répétition « mange et boit … mange et boit » est un peu lourde en français courant, mais elle est volontaire, intelligible et justifiée par l’insistance du grec. « Un jugement contre lui-même » est idiomatique dans ce contexte.
