  text: ἐν ὑμῖν αὐτοῖς κρίνατε· πρέπον ἐστὶν γυναῖκα ἀκατακάλυπτον τῷ θεῷ προσεύχεσθαι;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/013.yaml
  text: 'Judge for yourselves: is it proper for a woman to pray to God with her head uncovered?[a]'
translation:
  language: fr
  text: 'Jugez vous-mêmes : convient-il qu’une femme prie Dieu la tête découverte ?[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une épouse », si γυνή est compris au sens d’« épouse » dans le contexte plus large de ce passage.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν ὑμῖν αὐτοῖς
  choice: vous-mêmes
  rationale: Cette expression renforce l’appel adressé aux Corinthiens pour qu’ils portent eux-mêmes un jugement. « Jugez-en vous-mêmes » est idiomatique et garde cette insistance réflexive.
- source_word: κρίνατε
  choice: Jugez-en
  rationale: L’impératif aoriste appelle à une évaluation directe. « Jugez-en » conserve la force de l’ordre tout en étant naturel en français.
- source_word: πρέπον ἐστὶν
  choice: convient-il
  rationale: La tournure exprime ce qui est convenable ou approprié. « Convient-il » restitue avec dignité et naturel la question rhétorique.
- source_word: γυναῖκα
  choice: une femme
  rationale: γυνή peut désigner une femme ou une épouse. Comme le verset ne mentionne pas explicitement de mari et formule la question de manière générale, « une femme » convient au texte principal; l’autre possibilité est signalée en note.
- source_word: ἀκατακάλυπτον
  choice: la tête découverte
  rationale: L’adjectif signifie « non couverte ». Le contexte immédiat portant sur la tête, cette formulation explicite naturellement en français la partie du corps sous-entendue.
- source_word: τῷ θεῷ
  choice: Dieu
  rationale: Le datif avec προσεύχομαι désigne le destinataire de la prière. En français, « prier Dieu » est la construction directe la plus naturelle.
- source_word: προσεύχεσθαι
  choice: prie
  rationale: Le verbe signifie couramment « prier ». Le subjonctif après « convient-il que » rend naturellement la construction infinitive grecque.
theological_decisions:
- issue: Sens de γυνή dans la discussion sur la couverture de la tête
  choice: une femme
  alternative: une épouse
  rationale: Le verset ne fait aucune mention explicite d’un mari et présente la question en termes généraux. Le texte principal évite donc d’imposer un sens marital plus étroit, tandis que la note préserve cette possibilité contextuelle.
translation_notes:
  register: Français international moderne, clair et digne. La formulation brève conserve la force de la question rhétorique et l’ambiguïté possible de γυνή au moyen d’une note.
