id: 1CO.11.18
reference: 1 Corinthians 11:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: πρῶτον μὲν γὰρ συνερχομένων ὑμῶν ἐν ἐκκλησίᾳ ἀκούω σχίσματα ἐν ὑμῖν ὑπάρχειν, καὶ μέρος τι πιστεύω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/018.yaml
  text: For[a], in the first place, when you come together in assembly, I hear that divisions exist among you, and in part I believe it.
translation:
  language: fr
  text: Car, tout d’abord, lorsque vous vous réunissez en assemblée[a], j’entends dire qu’il y a des divisions parmi vous, et je le crois en partie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «en tant qu’Église»; le grec désigne ici la communauté rassemblée, et non spécialement un bâtiment.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρῶτον μὲν
  choice: tout d’abord
  rationale: Cette tournure naturelle en français introduit le premier point de l’argument, même si aucune construction formelle μέν…δέ n’est ensuite menée à son terme.
- source_word: συνερχομένων ὑμῶν
  choice: lorsque vous vous réunissez
  rationale: Le génitif absolu a ici une valeur temporelle; «vous vous réunissez» rend naturellement le rassemblement communautaire évoqué dans ce chapitre.
- source_word: ἐν ἐκκλησίᾳ
  choice: en assemblée
  rationale: Dans ce contexte, ἐκκλησία désigne la communauté réunie, non un bâtiment. «En assemblée» conserve ce sens collectif sans introduire une conception institutionnelle plus tardive.
- source_word: ἀκούω
  choice: j’entends dire
  rationale: Le présent grec indique que Paul tient cette information de rapports reçus. En français, «j’entends dire» exprime clairement cette connaissance rapportée.
- source_word: σχίσματα
  choice: des divisions
  rationale: Le terme désigne des déchirures ou divisions au sein de la communauté; «divisions» est précis, naturel et n’impose pas l’idée de partis formellement constitués.
- source_word: ὑπάρχειν
  choice: il y a
  rationale: Avec σχίσματα, l’infinitif affirme l’existence de divisions. «Il y a» est l’équivalent français le plus idiomatique.
- source_word: καὶ μέρος τι
  choice: et … en partie
  rationale: L’expression limite l’adhésion de Paul au rapport reçu et maintient sa réserve.
- source_word: πιστεύω
  choice: je le crois
  rationale: Le pronom «le» reprend naturellement en français le contenu du rapport sans ajouter d’information.
theological_decisions:
- issue: Sens de ἐκκλησία dans ce contexte
  choice: la communauté effectivement réunie, rendue par «en assemblée»
  alternative: «dans l’Église» ou «à l’église»
  rationale: Le passage porte sur le rassemblement des Corinthiens pour leur vie communautaire et le repas du Seigneur. La formulation retenue évite de faire du mot grec une référence à un bâtiment, tout en préservant sa portée ecclésiale.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase suit le mouvement argumentatif du grec tout en employant des formulations idiomatiques; «en partie» préserve la réserve de Paul.
