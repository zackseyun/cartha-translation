id: 1CO.11.27
reference: 1 Corinthians 11:27
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ὥστε ὃς ἂν ἐσθίῃ τὸν ⸀ἄρτον ἢ πίνῃ τὸ ποτήριον τοῦ κυρίου ⸀ἀναξίως, ἔνοχος ἔσται τοῦ σώματος καὶ τοῦ αἵματος τοῦ κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/027.yaml
  text: Therefore[b][a], whoever eats the bread or drinks the cup of the Lord in an unworthy manner will be guilty concerning the body and blood of the Lord.
translation:
  language: fr
  text: Ainsi donc, celui qui mange le pain ou boit la coupe du Seigneur d’une manière indigne[a] se rendra coupable envers le corps et le sang du Seigneur[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’expression grecque est un adverbe : elle décrit la manière de manger ou de boire, et non la valeur intrinsèque de la personne.'
    reason: lexical_alternative
  - marker: b
    text: 'On peut aussi traduire plus littéralement : « sera coupable du corps et du sang du Seigneur ». La formulation grecque exprime une culpabilité ou une responsabilité en rapport avec le corps et le sang du Seigneur.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὥστε
  choice: Ainsi donc
  rationale: Introduit la conclusion tirée de l’enseignement précédent sur le repas du Seigneur, avec une force logique naturelle en français.
- source_word: ὃς ἂν
  choice: celui qui
  rationale: Rend la portée générale et indéfinie de la construction grecque sans alourdir la phrase.
- source_word: ἐσθίῃ τὸν ἄρτον
  choice: mange le pain
  rationale: Conserve l’article et renvoie naturellement au pain dont il est question dans le contexte.
- source_word: ἢ
  choice: ou
  rationale: 'Respecte la conjonction disjonctive grecque : l’avertissement vise l’un ou l’autre acte accompli indignement.'
- source_word: πίνῃ τὸ ποτήριον
  choice: boit la coupe
  rationale: Préserve la métonymie concise du grec, également compréhensible en français dans ce contexte.
- source_word: ἀναξίως
  choice: d’une manière indigne
  rationale: La tournure adverbiale indique la manière de manger ou de boire, et non une indignité intrinsèque de la personne.
- source_word: ἔνοχος ἔσται
  choice: sera coupable
  rationale: Rend directement l’idée solennelle de culpabilité ou de responsabilité encourue.
- source_word: τοῦ σώματος καὶ τοῦ αἵματος τοῦ κυρίου
  choice: à l’égard du corps et du sang du Seigneur
  rationale: Exprime la culpabilité en rapport avec le corps et le sang du Seigneur sans préciser davantage la nuance juridique du génitif.
theological_decisions:
- issue: Portée de ἀναξίως dans la participation au repas du Seigneur
  choice: L’avertissement concerne le fait de manger ou de boire d’une manière indigne.
  alternative: Comprendre que le texte désigne une personne intrinsèquement indigne.
  rationale: ἀναξίως est un adverbe qui modifie les verbes « mange » et « boit ». La traduction maintient cette donnée grammaticale sans importer une doctrine ultérieure sur la dignité personnelle.
- issue: Force de ἢ entre manger et boire
  choice: Conserver « ou », de sorte que l’avertissement s’applique à l’un ou l’autre acte.
  alternative: Rendre la formule comme une paire fixe avec « et ».
  rationale: Le texte grec emploie explicitement la conjonction disjonctive ἢ; la traduction en respecte la portée, même si certaines formulations liturgiques privilégient « et ».
- issue: Nature de la culpabilité exprimée par ἔνοχος suivi du génitif
  choice: « coupable à l’égard du corps et du sang du Seigneur »
  alternative: « coupable du corps et du sang du Seigneur »
  rationale: La formulation retenue conserve l’idée de responsabilité vis-à-vis du corps et du sang sans définir précisément la nature de l’offense, que la construction grecque laisse relativement ouverte.
translation_notes:
  register: Français international moderne, sobre et solennel. « Ainsi donc » marque clairement l’inférence; « d’une manière indigne » évite l’ambiguïté personnelle de « indignement »; la métonymie « boire la coupe » est conservée parce qu’elle reste naturelle dans ce contexte.
