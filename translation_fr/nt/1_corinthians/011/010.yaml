id: 1CO.11.10
reference: 1 Corinthians 11:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: διὰ τοῦτο ὀφείλει ἡ γυνὴ ἐξουσίαν ἔχειν ἐπὶ τῆς κεφαλῆς διὰ τοὺς ἀγγέλους.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/010.yaml
  text: For this reason the woman ought to have authority on her head[b][a], because of the angels.
translation:
  language: fr
  text: C’est pourquoi la femme doit avoir autorité sur sa tête[a], à cause des anges[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de manière plus interprétative : « porter sur la tête un signe d’autorité ». Le texte grec dit « autorité » et ne mentionne explicitement ni « signe », ni « voile », ni « couverture ».'
    reason: alternative_reading
  - marker: b
    text: Ou « des messagers », bien que « anges » soit ici le sens le plus probable.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: C’est pourquoi
  rationale: Exprime naturellement en français la conséquence tirée de l’argument précédent.
- source_word: ὀφείλει
  choice: doit
  rationale: Rend l’idée d’obligation ou de convenance morale sans ajouter une qualification absente du grec.
- source_word: ἡ γυνὴ
  choice: la femme
  rationale: Conserve le singulier générique avec article et n’impose pas le sens plus étroit d’« épouse ».
- source_word: ἐξουσίαν
  choice: autorité
  rationale: Traduit directement le nom grec sans ajouter « signe », « voile » ou « couverture », termes absents du texte.
- source_word: ἔχειν
  choice: avoir
  rationale: Correspond au sens direct de l’infinitif et évite d’introduire l’idée interprétative de porter un objet.
- source_word: ἐπὶ τῆς κεφαλῆς
  choice: sur sa tête
  rationale: Formulation française naturelle qui préserve la relation spatiale et l’ambiguïté de l’expression.
- source_word: διὰ τοὺς ἀγγέλους
  choice: à cause des anges
  rationale: διά avec l’accusatif exprime ici la raison; « anges » est le sens contextuellement le plus probable de ἀγγέλους.
theological_decisions:
- issue: Sens de ἐξουσίαν ἔχειν ἐπὶ τῆς κεφαλῆς
  choice: Conserver « avoir autorité sur sa tête ».
  alternative: « porter sur la tête un signe d’autorité » ou « avoir la tête couverte en signe d’autorité ».
  rationale: Le grec ne comporte aucun mot signifiant « signe », « voile » ou « couverture ». La formulation principale préserve donc la difficulté réelle du texte, tandis que la note donne l’interprétation courante.
- issue: Référent de ἀγγέλους
  choice: anges
  alternative: messagers
  rationale: Bien que ἄγγελος puisse désigner un messager, le pluriel non qualifié renvoie plus probablement ici à des êtres célestes, sans que la traduction impose une théorie sur leur rôle.
- issue: Portée de γυνή
  choice: femme
  alternative: épouse
  rationale: Le contexte traite plus largement de l’homme et de la femme; « épouse » restreindrait indûment la portée du terme.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe demeure volontairement proche du grec dans l’expression difficile « avoir autorité sur sa tête », afin de ne pas résoudre dans la traduction une ambiguïté ancienne et théologiquement discutée.
