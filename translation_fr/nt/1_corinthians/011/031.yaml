  text: But if we judged ourselves[a], we would not be judged.
translation:
  language: fr
  text: Mais si nous nous jugions[a], nous ne serions pas jugés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « nous nous examinions » ou « nous nous évaluions ». Le verbe grec peut exprimer l’idée d’évaluer ou de distinguer ; « jugions » est retenu pour préserver le contraste avec « jugés » dans la proposition suivante.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ
  choice: Mais si
  rationale: εἰ introduit la condition et δέ marque un léger contraste avec ce qui précède. « Mais si » rend naturellement ces deux valeurs.
- source_word: ἑαυτοὺς
  choice: nous-mêmes
  rationale: Le pronom réfléchi à l’accusatif est le complément du verbe ; « nous-mêmes » est l’équivalent français naturel.
- source_word: διεκρίνομεν
  choice: nous nous jugions
  rationale: Dans ce contexte, διακρίνω désigne une appréciation lucide et discriminante de soi. « Juger » maintient en français le rapprochement avec ἐκρινόμεθα, sans exclure les nuances de s’examiner ou de discerner.
- source_word: οὐκ ἂν
  choice: ne… pas
  rationale: Avec l’imparfait, ἄν exprime ici la conséquence irréelle de la condition ; le conditionnel français « nous ne serions pas » en rend naturellement la valeur.
- source_word: ἐκρινόμεθα
  choice: nous ne serions pas jugés
  rationale: κρίνω évoque ici le jugement du Seigneur dans le contexte immédiat. « Jugés » préserve le lien lexical avec la première proposition et n’impose pas la notion plus forte de condamnation finale.
theological_decisions:
- issue: Le jugement de la seconde proposition désigne-t-il la condamnation finale ou un jugement divin à valeur disciplinaire ?
  choice: Conserver simplement « jugés », le contexte laissant entendre un jugement divin disciplinaire.
  alternative: « condamnés », compris comme une condamnation finale.
  rationale: Le verset 32 distingue le fait d’être jugés et corrigés par le Seigneur de la condamnation avec le monde. La traduction ne doit donc pas renforcer ἐκρινόμεθα en « condamnés » ni supprimer la tension du texte.
translation_notes:
  register: Français international moderne, clair et digne. La structure conditionnelle au plus-que-parfait implicite grec est rendue idiomatiquement par l’imparfait dans la proposition introduite par « si » et le conditionnel présent dans la principale. La répétition « jugions/jugés » préserve le jeu lexical et rhétorique du grec.
