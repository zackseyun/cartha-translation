  text: Every man who prays or prophesies with something on his head dishonors his head[a][b].
translation:
  language: fr
  text: Tout homme qui prie ou prophétise avec quelque chose sur la tête déshonore sa tête[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, selon la formulation traditionnelle : « la tête couverte ». Le grec dit littéralement qu’il a quelque chose sur la tête ou qui en descend, sans préciser ce dont il s’agit.'
    reason: lexical_alternative
  - marker: b
    text: « Sa tête » peut désigner littéralement sa propre tête, tout en faisant écho à l’emploi relationnel du mot « tête » dans le contexte.
    reason: alternative_reading
lexical_decisions:
- source_word: πᾶς ἀνὴρ
  choice: Tout homme
  rationale: ἀνήρ peut désigner un homme ou un mari selon le contexte. Ici, la formulation générale, en parallèle avec « toute femme » au verset suivant, favorise « tout homme », sans exclure les implications conjugales possibles du passage.
- source_word: προσευχόμενος ἢ προφητεύων
  choice: qui prie ou prophétise
  rationale: Les participes présents décrivent l’homme en train de prier ou de prophétiser. La relative est naturelle en français et conserve la coordination des deux activités.
- source_word: κατὰ κεφαλῆς ἔχων
  choice: avec quelque chose sur la tête
  rationale: L’expression grecque signifie littéralement qu’il a quelque chose sur ou descendant de la tête, sans nommer précisément l’objet. Cette formulation préserve cette indétermination; « la tête couverte » reste une traduction traditionnelle possible.
- source_word: καταισχύνει
  choice: déshonore
  rationale: Le verbe exprime la honte ou le déshonneur. « Déshonore » convient au cadre d’honneur et de honte du passage et s’emploie naturellement avec « sa tête ».
- source_word: τὴν κεφαλὴν αὐτοῦ
  choice: sa tête
  rationale: La formulation française garde ouverte la référence à la tête physique ainsi que l’écho possible au sens relationnel de « tête » dans le contexte immédiat.
theological_decisions:
- issue: La « tête » de la proposition finale est-elle la tête physique de l’homme ou celui qui est sa tête au sens relationnel?
  choice: Conserver l’ambiguïté avec « sa tête »
  alternative: « sa propre tête » ou « celui qui est sa tête »
  rationale: Le grec permet un chevauchement rhétorique entre la tête physique et l’emploi relationnel ou théologique de « tête » au verset 3. Le texte principal ne doit pas trancher cette tension.
translation_notes:
  register: Français international moderne, clair et digne. « Prophétise » conserve le terme biblique transparent; « avec quelque chose sur la tête » reste naturel tout en évitant de préciser davantage que le grec.
