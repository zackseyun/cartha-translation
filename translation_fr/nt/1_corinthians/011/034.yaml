  text: ⸀εἴ τις πεινᾷ, ἐν οἴκῳ ἐσθιέτω, ἵνα μὴ εἰς κρίμα συνέρχησθε. Τὰ δὲ λοιπὰ ὡς ἂν ἔλθω διατάξομαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/034.yaml
  text: If anyone is hungry[a], let him eat at home, so that you may not come together for judgment. And I will give directions about the rest when I come.
translation:
  language: fr
  text: Si quelqu’un a faim, qu’il mange chez lui, afin que vos réunions ne vous exposent pas au jugement[a]. Pour le reste, je donnerai des directives quand je viendrai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à une condamnation ». Le grec κρίμα peut signifier « jugement » ou « condamnation ». Ici, « jugement » correspond mieux au contexte immédiat, où Paul parle de la discipline présente du Seigneur plutôt que de la condamnation finale (versets 29 à 32).
    reason: lexical_alternative
lexical_decisions:
- source_word: πεινᾷ
  choice: a faim
  rationale: Le présent décrit un état actuel; « avoir faim » est l’expression naturelle en français moderne.
- source_word: ἐν οἴκῳ
  choice: chez lui
  rationale: La locution désigne le cadre domestique, par opposition au rassemblement de l’Église; « chez lui » restitue naturellement le singulier grec.
- source_word: ἐσθιέτω
  choice: qu’il mange
  rationale: Cette tournure conserve la valeur impérative du présent à la troisième personne.
- source_word: εἰς κρίμα
  choice: pour subir un jugement
  rationale: κρίμα peut désigner un jugement ou une condamnation. Cette formulation française exprime l’issue redoutée sans l’identifier explicitement à la condamnation finale.
- source_word: συνέρχησθε
  choice: vous ne vous réunissiez pas
  rationale: Le verbe désigne le rassemblement de la communauté et maintient le lien verbal avec le contexte immédiat.
- source_word: Τὰ δὲ λοιπὰ
  choice: Pour le reste
  rationale: Transition française concise et idiomatique vers les questions que Paul traitera ultérieurement.
- source_word: ὡς ἂν ἔλθω
  choice: quand je viendrai
  rationale: La construction renvoie à la visite future envisagée par Paul; cette formulation en conserve le caractère temporel sans lourdeur.
- source_word: διατάξομαι
  choice: je donnerai des directives
  rationale: Le futur exprime ici l’action de prescrire ou d’ordonner les dispositions pratiques restantes.
theological_decisions:
- issue: Sens de κρίμα dans l’avertissement relatif au repas du Seigneur
  choice: jugement, possiblement disciplinaire dans le contexte
  alternative: condamnation
  rationale: Les versets 29 à 32 évoquent le jugement et la discipline présents du Seigneur tout en les distinguant de la condamnation avec le monde. « Jugement » préserve la portée judiciaire du terme et la tension du texte sans imposer l’idée d’une condamnation finale.
- issue: Singulier indéfini τις suivi d’un impératif à la troisième personne
  choice: « quelqu’un… qu’il mange… chez lui »
  alternative: formulation entièrement épicène ou passage au pluriel
  rationale: Le français emploie naturellement le masculin grammatical pour reprendre l’indéfini singulier; ce choix conserve le nombre du grec sans restreindre l’application aux hommes.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe conserve l’enchaînement logique du grec et le lien avec le rassemblement communautaire, tout en évitant des calques peu naturels tels que « entrer dans le jugement ».
