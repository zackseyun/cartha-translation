  text: καὶ εὐχαριστήσας ἔκλασεν καὶ ⸀εἶπεν· Τοῦτό μού ἐστιν τὸ σῶμα τὸ ὑπὲρ ⸀ὑμῶν· τοῦτο ποιεῖτε εἰς τὴν ἐμὴν ἀνάμνησιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/024.yaml
  text: And after giving thanks[a], he broke it and said, “This is my body, which is for you[b]. Keep doing this in remembrance of me.”
translation:
  language: fr
  text: 'Après avoir rendu grâce, il le rompit et dit : « Ceci est mon corps, qui est pour vous[a][b]. Continuez à faire ceci en mémoire de moi. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qui est en votre faveur » ou « qui est pour votre bien ».
    reason: lexical_alternative
  - marker: b
    text: 'Certains manuscrits ajoutent « rompu » après « pour vous » : « Ceci est mon corps, qui est rompu pour vous. »'
    reason: textual_variant
lexical_decisions:
- source_word: εὐχαριστήσας
  choice: après avoir rendu grâce
  rationale: Le participe aoriste exprime ici une action antérieure à celle du verbe principal. Cette formulation française est naturelle et conserve clairement la succession des actions.
- source_word: ἔκλασεν
  choice: il le rompit
  rationale: Le verbe signifie « rompre ». Le pronom « le » reprend naturellement le pain mentionné dans le contexte, sans l’ajouter explicitement au texte.
- source_word: Τοῦτό μού ἐστιν τὸ σῶμα
  choice: Ceci est mon corps
  rationale: La proposition copulative est rendue directement. « Ceci représente mon corps » trancherait une question théologique que le grec laisse ouverte.
- source_word: τὸ ὑπὲρ ὑμῶν
  choice: qui est pour vous
  rationale: Avec le génitif, ὑπέρ exprime ici le bénéfice ou l’action en faveur d’autrui. « Pour vous » reste concis et ne précise pas davantage le mécanisme théologique.
- source_word: τοῦτο ποιεῖτε
  choice: Continuez à faire ceci
  rationale: L’impératif présent peut porter une valeur continue ou répétée dans ce contexte d’institution. La traduction rend cette pratique durable explicite.
- source_word: εἰς τὴν ἐμὴν ἀνάμνησιν
  choice: en mémoire de moi
  rationale: Ἀνάμνησις désigne l’acte de se souvenir ou de commémorer. L’expression française est claire, naturelle et conserve la portée mémorielle sans lui imposer une interprétation confessionnelle.
theological_decisions:
- issue: Sens de « Ceci est mon corps » dans le contexte eucharistique
  choice: Conserver la formulation directe « Ceci est mon corps » sans qualification interprétative.
  alternative: Traduire par « Ceci représente mon corps » ou expliciter une conception particulière de la présence sacramentelle.
  rationale: Le grec emploie une construction copulative simple et ne précise pas le mode de cette relation. La traduction préserve donc la tension entre les lectures théologiques ultérieures.
- issue: Portée de ὑπὲρ ὑμῶν
  choice: Employer « pour vous » avec une portée bénéfactive ou représentative.
  alternative: Employer « en votre faveur » ou « pour votre bien », ou préciser une théorie particulière de l’expiation.
  rationale: La formule indique que le corps est pour le bénéfice des destinataires, sans définir plus techniquement la manière dont il l’est.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple convient à la narration biblique soutenue sans être archaïque. « Ceci est mon corps » conserve la formulation solennelle et la tension théologique du grec; « Continuez à faire ceci » rend visible la valeur répétée de l’impératif présent.
