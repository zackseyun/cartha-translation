  text: δοκιμαζέτω δὲ ἄνθρωπος ἑαυτόν, καὶ οὕτως ἐκ τοῦ ἄρτου ἐσθιέτω καὶ ἐκ τοῦ ποτηρίου πινέτω·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/028.yaml
  text: But let a man examine himself, and in this way let him eat from the bread and drink from the cup.
translation:
  language: fr
  text: Mais que chacun s’examine lui-même, et qu’ainsi il mange du pain et boive de la coupe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δοκιμαζέτω
  choice: s’examine
  rationale: Le verbe désigne ici le fait de se mettre à l’épreuve ou d’évaluer son propre état; «s’examine» est naturel et fidèle dans ce contexte.
- source_word: ἄνθρωπος
  choice: chacun
  rationale: Ἄνθρωπος est générique ici. «Chacun» exprime naturellement en français que toute personne participante est concernée, sans restreindre le commandement aux hommes de sexe masculin.
- source_word: οὕτως
  choice: ainsi
  rationale: Conserve le lien entre l’examen de soi et la manière de manger et de boire, sans préciser davantage la nature de ce lien.
- source_word: ἐκ τοῦ ἄρτου … ἐκ τοῦ ποτηρίου
  choice: du pain … de la coupe
  rationale: Préserve les compléments introduits par ἐκ et le parallélisme grec; «boire de la coupe» maintient la métonymie du récipient pour son contenu.
theological_decisions:
- issue: Portée de l’examen de soi avant la participation
  choice: «qu’ainsi il mange… et boive…»
  alternative: «et seulement alors qu’il mange… et boive…»
  rationale: Le grec établit une relation entre l’examen et la participation, mais n’emploie pas explicitement «seulement». La traduction préserve donc l’injonction à participer après s’être examiné sans transformer le verset en interdiction absolue non exprimée.
- issue: Sens générique de ἄνθρωπος
  choice: «chacun»
  alternative: «un homme»
  rationale: Dans cette exhortation adressée à l’assemblée, le nom grec désigne l’être humain de manière générique. «Chacun» restitue cette portée en français moderne.
translation_notes:
  register: Français international moderne, sobre et digne. La structure exhortative est conservée avec «que…», tandis que le parallélisme entre manger et boire reste nettement perceptible.
