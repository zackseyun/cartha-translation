reference: 1 Corinthians 11:26
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁσάκις γὰρ ⸀ἐὰν ἐσθίητε τὸν ἄρτον τοῦτον καὶ τὸ ⸀ποτήριον πίνητε, τὸν θάνατον τοῦ κυρίου καταγγέλλετε, ἄχρι ⸀οὗ ἔλθῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/026.yaml
  text: For as often as you eat this bread and drink the cup[b][a], you proclaim the Lord’s death until he comes.
translation:
  language: fr
  text: En effet, chaque fois que vous mangez ce pain et que vous buvez la coupe[a], vous proclamez la mort du Seigneur, jusqu’à ce qu’il vienne.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec dit « la coupe », et non « cette coupe » dans ce verset, bien que le contexte immédiat précise de quelle coupe il s’agit.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁσάκις … ἐὰν
  choice: chaque fois que
  rationale: 'Cette tournure française exprime naturellement une occurrence indéfinie et répétée : toutes les fois où l’action a lieu.'
- source_word: γὰρ
  choice: en effet
  rationale: Le connecteur introduit l’explication de l’instruction précédente. « En effet » restitue clairement et naturellement cette relation en français moderne.
- source_word: ἐσθίητε
  choice: vous mangez
  rationale: Le présent français convient à la proposition temporelle indéfinie introduite par « chaque fois que ».
- source_word: τὸν ἄρτον τοῦτον
  choice: ce pain
  rationale: « Pain » est le sens courant de ἄρτος et le démonstratif τοῦτον est explicitement rendu par « ce ».
- source_word: τὸ ποτήριον
  choice: la coupe
  rationale: Le grec porte l’article défini, sans démonstratif dans ce verset. « La coupe » suit précisément cette forme tout en laissant le contexte en préciser le référent.
- source_word: καταγγέλλετε
  choice: vous proclamez
  rationale: Le verbe désigne une annonce publique et déclarative. « Proclamer » en conserve la force solennelle sans ajouter d’explication théologique.
- source_word: τὸν θάνατον τοῦ κυρίου
  choice: la mort du Seigneur
  rationale: Cette formulation naturelle et digne conserve directement la relation génitive du grec et l’accent porté sur la mort du Seigneur.
- source_word: ἄχρι οὗ ἔλθῃ
  choice: jusqu’à ce qu’il vienne
  rationale: La locution marque la limite temporelle de cette proclamation. Le subjonctif « vienne » est exigé par l’usage français après « jusqu’à ce que ».
theological_decisions:
- issue: Référent du sujet sous-entendu dans ἄχρι οὗ ἔλθῃ
  choice: Le pronom « il » renvoie au Seigneur Jésus.
  alternative: Rendre le sujet de manière indéterminée ou répéter explicitement « le Seigneur ».
  rationale: « Le Seigneur » est l’antécédent contextuel le plus proche et le plus naturel. Le pronom préserve toutefois le caractère implicite du sujet grec.
- issue: Portée eucharistique ou sacramentelle de l’énoncé
  choice: Traduire directement les actes de manger le pain, de boire la coupe et de proclamer la mort du Seigneur.
  alternative: Employer une paraphrase explicitement sacramentelle ou, à l’inverse, explicitement mémorialiste.
  rationale: Le verset affirme que cet acte proclame la mort du Seigneur, mais n’expose pas ici une théologie sacramentelle complète. La traduction n’impose donc aucune interprétation confessionnelle supplémentaire.
translation_notes:
  register: Français international moderne, clair et digne. « En effet » assure une transition explicative naturelle; « chaque fois que » conserve la valeur répétitive; « proclamez » maintient le registre déclaratif et solennel du passage.
