id: 1CO.11.17
reference: 1 Corinthians 11:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Τοῦτο δὲ ⸂παραγγέλλων οὐκ ἐπαινῶ⸃ ὅτι οὐκ εἰς τὸ κρεῖσσον ἀλλὰ εἰς τὸ ἧσσον συνέρχεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/017.yaml
  text: But in giving this instruction[a], I do not praise you, because you come together not for the better but for the worse.
translation:
  language: fr
  text: Mais en vous donnant cette instruction[a], je ne vous félicite pas, car lorsque vous vous réunissez, ce n’est pas pour le meilleur, mais pour le pire.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en vous donnant cet ordre ». Le participe grec peut exprimer une instruction, une directive ou un ordre.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῦτο δὲ
  choice: Mais en vous donnant cette instruction
  rationale: Le démonstratif neutre renvoie à la directive qui suit, tandis que δὲ introduit une transition contrastive. La formulation française rend naturellement le lien entre Τοῦτο et le participe.
- source_word: παραγγέλλων
  choice: en vous donnant cette instruction
  rationale: Le participe de παραγγέλλω peut exprimer le fait de donner une instruction, une directive ou un ordre. « Donner cette instruction » conserve l’autorité du propos sans durcir inutilement le ton.
- source_word: οὐκ ἐπαινῶ
  choice: je ne vous félicite pas
  rationale: ἐπαινέω signifie louer ou approuver. « Féliciter » convient ici à une évaluation adressée à la communauté et fait écho au contraste avec le verset 2.
- source_word: ὅτι
  choice: car
  rationale: La conjonction introduit la raison du refus de féliciter. « Car » est clair, naturel et digne dans ce contexte.
- source_word: συνέρχεσθε
  choice: lorsque vous vous réunissez
  rationale: Le verbe désigne le rassemblement de la communauté. L’ajout syntaxique de « lorsque » produit une phrase française naturelle sans ajouter de contenu conceptuel.
- source_word: οὐκ εἰς τὸ κρεῖσσον ἀλλὰ εἰς τὸ ἧσσον
  choice: ce n’est pas pour le meilleur, mais pour le pire
  rationale: Cette formulation conserve l’antithèse comparative marquée par κρεῖσσον et ἧσσον ainsi que l’idée de résultat ou d’effet portée par εἰς.
theological_decisions:
- issue: Force d’autorité de παραγγέλλων
  choice: instruction
  alternative: ordre
  rationale: Le verbe peut avoir la force d’un commandement, mais le contexte permet aussi le sens de directive apostolique. « Instruction » préserve l’autorité tout en maintenant l’étendue sémantique du grec; une note signale l’autre possibilité.
- issue: Portée de « pour le meilleur / pour le pire »
  choice: Maintien de la formulation comparative
  alternative: pour votre bien / pour votre malheur
  rationale: Le grec ne précise pas explicitement si l’effet concerne seulement les destinataires, la communauté ou le rassemblement lui-même. La traduction conserve cette ouverture plutôt que de la résoudre.
translation_notes:
  register: Français international moderne, clair et digne. La phrase garde la réprimande directe de Paul et l’opposition concise entre le meilleur et le pire.
