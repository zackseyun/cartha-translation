id: 1CO.11.6
reference: 1 Corinthians 11:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἰ γὰρ οὐ κατακαλύπτεται γυνή, καὶ κειράσθω· εἰ δὲ αἰσχρὸν γυναικὶ τὸ κείρασθαι ἢ ξυρᾶσθαι, κατακαλυπτέσθω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/006.yaml
  text: For if a woman does not cover her head[a], she should also have her hair cut off; but if it is disgraceful for a woman to have her hair cut off or to be shaved[b], she should cover her head.
translation:
  language: fr
  text: En effet, si une femme[a] ne se couvre pas la tête, qu’elle se fasse aussi couper les cheveux courts. Mais s’il est honteux pour une femme d’avoir les cheveux coupés courts ou la tête rasée, qu’elle se couvre la tête[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « épouse » dans tout le verset ; le grec gynē peut signifier « femme » ou « épouse » selon le contexte.
    reason: alternative_reading
  - marker: b
    text: 'On pourrait aussi traduire : « qu’elle soit voilée ». Le grec parle du fait d’être couverte, la tête étant sous-entendue par le contexte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατακαλύπτεται / κατακαλυπτέσθω
  choice: ne se couvre pas la tête / qu’elle se couvre la tête
  rationale: Le verbe signifie « couvrir complètement » ou « voiler ». Le complément « la tête », implicite dans le contexte, est explicité en français pour obtenir une formulation claire sans préciser la nature du couvre-chef.
- source_word: γυνή
  choice: femme
  rationale: Le terme grec peut désigner une femme ou une épouse. Comme le verset formule ici son propos de manière générale et ne mentionne pas explicitement un mari, « femme » évite de restreindre indûment la portée du texte.
- source_word: κειράσθω / τὸ κείρασθαι
  choice: qu’elle se fasse aussi couper les cheveux courts / d’avoir les cheveux coupés courts
  rationale: Le verbe évoque des cheveux coupés court ou tondus. Cette formulation moderne garde la distinction avec le rasage exprimé ensuite par ξυρᾶσθαι, tout en évitant le tour peu naturel « qu’elle soit tondue ».
- source_word: καί
  choice: aussi
  rationale: '« Aussi » conserve la progression rhétorique : si elle refuse de se couvrir, qu’elle accepte également la conséquence énoncée.'
- source_word: αἰσχρόν
  choice: honteux
  rationale: « Honteux » rend naturellement la dimension sociale d’honneur et de honte portée par l’adjectif dans ce contexte.
- source_word: ξυρᾶσθαι
  choice: avoir la tête rasée
  rationale: Le verbe désigne le rasage. L’explicitation de « la tête » est naturelle en français et maintient le contraste avec les cheveux simplement coupés courts.
- source_word: γὰρ ... δὲ
  choice: En effet ... Mais
  rationale: Ces connecteurs rendent clairement la justification puis le contraste qui structurent le raisonnement.
theological_decisions:
- issue: 'Portée de γυνή : femme ou épouse'
  choice: femme
  alternative: épouse
  rationale: Le grec permet les deux sens, mais aucune relation conjugale n’est explicitement mentionnée dans ce verset. Le texte principal garde donc le sens le moins restrictif, tandis que l’autre possibilité est signalée en note.
- issue: Nature précise de ce qui couvre la tête
  choice: se couvrir la tête
  alternative: être voilée
  rationale: Le grec exprime le fait d’être couverte sans nommer un vêtement précis. La traduction ne définit donc pas la forme exacte du couvre-chef et préserve l’ouverture lexicale.
translation_notes:
  register: Français international moderne, digne et direct. La syntaxe conditionnelle et impérative du grec est conservée, tandis que les expressions relatives à la coiffure sont rendues de façon idiomatique et sans archaïsme.
