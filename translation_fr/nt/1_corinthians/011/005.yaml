source:
  edition: SBLGNT
  text: πᾶσα δὲ γυνὴ προσευχομένη ἢ προφητεύουσα ἀκατακαλύπτῳ τῇ κεφαλῇ καταισχύνει τὴν κεφαλὴν ⸀αὐτῆς, ἓν γάρ ἐστιν καὶ τὸ αὐτὸ τῇ ἐξυρημένῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/005.yaml
  text: But every woman who prays or prophesies with her head uncovered dishonors her head[b][a], for that is one and the same as having been shaved.
translation:
  language: fr
  text: Mais toute femme qui prie ou prophétise la tête découverte[b] déshonore sa tête[a], car cela revient au même que d’être rasée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « toute épouse qui prie ou prophétise… déshonore sa tête ». Le grec peut signifier « femme » ou « épouse », et « tête » peut être compris au sens propre ou, selon le contexte, au sens métaphorique, possiblement en référence au mari.
    reason: alternative_reading
  - marker: b
    text: Le terme traduit par « découverte » ne précise pas à lui seul la nature exacte de la couverture ; il peut notamment être question d’un voile ou, plus généralement, d’une tête non couverte.
    reason: lexical_alternative
lexical_decisions:
- source_word: γυνή
  choice: femme
  rationale: Le nom peut désigner une femme ou une épouse. Ici, « toute femme qui prie ou prophétise » se lit naturellement comme une formulation générale; l’autre possibilité est signalée en note.
- source_word: προσευχομένη ἢ προφητεύουσα
  choice: qui prie ou prophétise
  rationale: La proposition relative rend naturellement les participes présents et conserve les deux activités sans les subordonner l’une à l’autre.
- source_word: ἀκατακαλύπτῳ τῇ κεφαλῇ
  choice: la tête découverte
  rationale: Cette expression française idiomatique décrit l’état de la tête sans préciser s’il s’agit de l’absence d’un voile ou d’une autre forme de couverture.
- source_word: καταισχύνει
  choice: déshonore
  rationale: Le verbe exprime la honte ou le déshonneur dans un cadre social; « déshonore » convient au registre digne du passage.
- source_word: τὴν κεφαλὴν αὐτῆς
  choice: sa tête
  rationale: La formulation littérale préserve la possibilité d’un sens physique aussi bien que relationnel ou métaphorique dans le contexte.
- source_word: ἓν γάρ ἐστιν καὶ τὸ αὐτό
  choice: car c’est exactement comme
  rationale: Cette tournure française exprime clairement l’équivalence emphatique de l’idiome grec sans lourdeur.
- source_word: τῇ ἐξυρημένῃ
  choice: si elle avait été rasée
  rationale: La formulation évoque l’état résultant d’un rasage et explicite naturellement en français le référent féminin sous-entendu par le participe.
theological_decisions:
- issue: Sens de « sa tête » dans « déshonore sa tête »
  choice: Conserver « sa tête » sans trancher entre le sens physique et le sens métaphorique.
  alternative: Comprendre soit sa tête physique, soit son mari ou l’homme considéré comme sa « tête » dans l’argument.
  rationale: Le grec permet la formulation littérale, tandis que le contexte antérieur ouvre une lecture relationnelle. Le texte principal doit préserver cette tension.
- issue: Nature de ce qui couvre la tête
  choice: Employer l’expression générale « la tête découverte ».
  alternative: Préciser « sans voile » ou comprendre une disposition particulière des cheveux.
  rationale: L’adjectif grec indique l’absence de couverture sans en définir précisément la nature.
- issue: Portée de γυνή
  choice: Traduire par « femme » dans le texte principal.
  alternative: « épouse »
  rationale: La phrase immédiate se prête à une portée générale, mais le contexte des relations entre l’homme et la femme permet aussi la lecture conjugale, conservée en note.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation reste concrète et accessible tout en conservant les ambiguïtés lexicales et théologiques du grec.
