id: 1CO.11.32
reference: 1 Corinthians 11:32
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: κρινόμενοι δὲ ⸀ὑπὸ κυρίου παιδευόμεθα, ἵνα μὴ σὺν τῷ κόσμῳ κατακριθῶμεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/032.yaml
  text: But when we are judged by the Lord[a], we are disciplined, so that we may not be condemned along with the world.
translation:
  language: fr
  text: Mais lorsque le Seigneur nous juge[a], il nous corrige, afin que nous ne soyons pas condamnés avec le monde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « étant jugés par le Seigneur, nous sommes corrigés ». Les formes grecques sont au présent et peuvent souligner une action en cours.'
    reason: Alternative syntaxique et aspectuelle permettant de conserver plus directement les deux formes passives du grec.
lexical_decisions:
- source_word: κρινόμενοι
  choice: lorsque le Seigneur nous juge
  rationale: Le participe présent passif est compris dans son sens temporel en contexte. La tournure active est plus naturelle en français tout en conservant le sens judiciaire de κρίνω et l’action du Seigneur.
- source_word: δὲ
  choice: Mais
  rationale: La conjonction marque ici un contraste modéré avec l’avertissement du verset précédent.
- source_word: ὑπὸ κυρίου
  choice: le Seigneur
  rationale: Ὑπό avec le génitif indique l’agent. « Le Seigneur » suffit dans le contexte du repas du Seigneur, sans expliciter davantage l’identité que ne le fait le grec.
- source_word: παιδευόμεθα
  choice: il nous corrige
  rationale: Dans ce contexte, παιδεύω désigne une intervention éducative et corrective. « Il nous corrige » est naturel en français moderne et exprime le caractère remédiateur plutôt que simplement punitif de cette action.
- source_word: ἵνα μὴ
  choice: afin que nous ne soyons pas
  rationale: Cette formulation conserve clairement la valeur de but, sans exclure la nuance de résultat possible dans le contexte.
- source_word: σὺν τῷ κόσμῳ
  choice: avec le monde
  rationale: Σύν exprime l’association et le partage d’un même sort. Ici, κόσμος désigne collectivement le monde opposé à Dieu.
- source_word: κατακριθῶμεν
  choice: nous soyons condamnés
  rationale: Κατακρίνω désigne un jugement défavorable, une condamnation. Ce choix maintient la distinction avec κρίνω, rendu plus haut par « juger ».
theological_decisions:
- issue: Rapport entre le jugement présent du Seigneur et la condamnation avec le monde
  choice: Le texte distingue l’action corrective présente du Seigneur de la condamnation évitée avec le monde.
  alternative: On peut comprendre le verset plus généralement comme parlant d’un châtiment temporel, sans y voir une distinction explicite entre croyants et non-croyants.
  rationale: Le contraste lexical entre κρίνω et κατακρίνω, associé à παιδεύω et à la proposition introduite par ἵνα μή, indique une correction orientée vers l’évitement de la condamnation. La traduction préserve cette relation sans préciser un système doctrinal concernant la persévérance ou l’efficacité sacramentelle.
translation_notes:
  register: Français international moderne, naturel et digne. La transformation des deux passifs grecs en verbes actifs ayant « le Seigneur » pour sujet évite une formulation lourde, tout en préservant l’agent, le contraste entre jugement et condamnation, ainsi que la portée corrective de παιδεύω.
