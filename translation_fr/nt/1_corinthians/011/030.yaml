  text: διὰ τοῦτο ἐν ὑμῖν πολλοὶ ἀσθενεῖς καὶ ἄρρωστοι καὶ κοιμῶνται ἱκανοί.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/030.yaml
  text: For this reason many among you are weak and sick[a], and a good number have fallen asleep.
translation:
  language: fr
  text: Voilà pourquoi beaucoup parmi vous sont faibles et malades, et un assez grand nombre se sont endormis[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus explicitement : « sont morts ». Paul emploie vraisemblablement « se sont endormis » comme métaphore chrétienne courante de la mort.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Voilà pourquoi
  rationale: Cette tournure française naturelle conserve le lien causal explicite avec les abus précédemment évoqués lors du repas du Seigneur.
- source_word: ἐν ὑμῖν
  choice: parmi vous
  rationale: L’expression situe ces situations au sein de la communauté de Corinthe, plutôt qu’à l’intérieur des personnes.
- source_word: πολλοὶ
  choice: beaucoup
  rationale: Ce rendu simple et courant exprime directement la quantité indiquée par l’adjectif employé substantivement.
- source_word: ἀσθενεῖς
  choice: faibles
  rationale: Le terme peut désigner une faiblesse physique générale; ce choix maintient la distinction lexicale avec ἄρρωστοι.
- source_word: ἄρρωστοι
  choice: malades
  rationale: Le mot désigne couramment la maladie et se rend clairement en français moderne par « malades ».
- source_word: κοιμῶνται
  choice: se sont endormis
  rationale: Dans ce contexte, le verbe est une métaphore de la mort. Le passé composé exprime naturellement en français l’entrée dans cet état tout en préservant l’image du sommeil.
- source_word: ἱκανοί
  choice: un assez grand nombre
  rationale: Ici, l’adjectif désigne un nombre considérable. Cette formulation naturelle évite de répéter mécaniquement « beaucoup ».
theological_decisions:
- issue: Faut-il rendre κοιμῶνται littéralement comme le sommeil ou l’expliciter comme la mort?
  choice: Conserver dans le texte la métaphore « se sont endormis » comme référence à la mort.
  alternative: « sont morts » ou, dans un sens strictement littéral, « dorment »
  rationale: Le contexte du jugement divin et la progression de la faiblesse à la maladie puis au sommeil indiquent fortement une évocation de la mort. Garder la métaphore respecte néanmoins la formulation et la tonalité de Paul sans les expliciter excessivement.
translation_notes:
  register: Français international moderne, clair et digne. La structure reste proche du grec, tout en employant des formulations idiomatiques; la métaphore du sommeil est conservée et expliquée en note.
