  text: Nevertheless[a], in the Lord woman is not apart from man, nor man apart from woman.
translation:
  language: fr
  text: Toutefois[a], dans le Seigneur, la femme n’est pas sans l’homme, ni l’homme sans la femme.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Toutefois, dans le Seigneur, l’épouse n’est pas sans son mari, ni le mari sans son épouse. » Les termes grecs peuvent désigner soit la femme et l’homme, soit l’épouse et le mari ; le sens plus général est retenu ici parce que l’affirmation ne semble pas limitée au mariage.'
    reason: alternative_reading
lexical_decisions:
- source_word: πλὴν
  choice: Toutefois
  rationale: Introduit une réserve qui rééquilibre l’argument précédent, dans un registre naturel et digne.
- source_word: γυνή
  choice: femme
  rationale: Le terme peut désigner une femme ou une épouse; le contexte général sur la relation entre les sexes favorise ici « femme ».
- source_word: ἀνήρ
  choice: homme
  rationale: Le terme peut désigner un homme ou un mari; le propos général et symétrique favorise ici « homme ».
- source_word: χωρὶς
  choice: indépendante de / indépendant de
  rationale: Dans cette construction relationnelle, cette formulation exprime clairement l’absence d’autonomie séparée sans suggérer une simple absence physique.
- source_word: ἐν κυρίῳ
  choice: dans le Seigneur
  rationale: Conserve la formule paulinienne et sa possible portée de sphère, d’union ou de relation au Seigneur.
- source_word: οὔτε ... οὔτε
  choice: ne… pas…, ni…
  rationale: Reproduit naturellement en français la double négation corrélative et le parallélisme des deux propositions.
theological_decisions:
- issue: Faut-il rendre γυνή / ἀνήρ par « femme / homme » ou « épouse / mari »?
  choice: femme / homme
  alternative: épouse / mari
  rationale: Le contexte traite de l’homme et de la femme dans la création et le culte; ce verset formule une réciprocité générale « dans le Seigneur ». Le sens conjugal demeure possible et est signalé en note.
- issue: Portée de χωρὶς dans l’affirmation de réciprocité
  choice: indépendante de / indépendant de
  alternative: sans / séparé de
  rationale: Ce choix fait ressortir l’interdépendance exprimée par les deux propositions parallèles, sans effacer leur tension avec l’argument précédent.
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme est conservé, ainsi que la formule paulinienne « dans le Seigneur ». La note préserve l’ambiguïté lexicale réelle du grec.
