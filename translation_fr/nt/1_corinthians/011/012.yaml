id: 1CO.11.12
reference: 1 Corinthians 11:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὥσπερ γὰρ ἡ γυνὴ ἐκ τοῦ ἀνδρός, οὕτως καὶ ὁ ἀνὴρ διὰ τῆς γυναικός· τὰ δὲ πάντα ἐκ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/012.yaml
  text: For just as the woman is from the man[a], so also the man is through the woman; but all things are from God.
translation:
  language: fr
  text: Car, de même que la femme vient de l’homme[a], de même aussi l’homme vient au monde par la femme ; mais tout vient de Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’épouse vient de son mari » et « le mari vient au monde par son épouse », si l’on comprend ici les termes grecs dans leur sens conjugal plutôt que dans leur sens général d’homme et de femme.
    reason: alternative_reading
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: Car, de même que
  rationale: « Car » rend la valeur explicative de γάρ et « de même que » introduit clairement la comparaison exprimée par ὥσπερ.
- source_word: ἡ γυνή
  choice: la femme
  rationale: γυνή peut signifier « femme » ou « épouse ». L’allusion à la création et la réciprocité avec la naissance humaine favorisent ici le sens générique « la femme ».
- source_word: ἐκ τοῦ ἀνδρός
  choice: vient de l’homme
  rationale: ἐκ exprime l’origine. « Vient de l’homme » rend naturellement cette provenance et conserve l’allusion à la création de la femme à partir de l’homme.
- source_word: ὁ ἀνήρ
  choice: l’homme
  rationale: ἀνήρ peut désigner un homme ou un mari. Dans cette affirmation générale mise en parallèle avec γυνή, « l’homme » convient mieux que « le mari ».
- source_word: διὰ τῆς γυναικός
  choice: vient au monde par la femme
  rationale: διά avec le génitif exprime ici le moyen. « Vient au monde par la femme » rend clairement la naissance tout en maintenant la différence entre διά (« par ») et ἐκ (« de »).
- source_word: τὰ δὲ πάντα
  choice: mais tout
  rationale: δέ introduit un léger contraste qui ramène les origines humaines à leur source ultime. « Mais tout » est naturel en français et garde la portée globale de τὰ πάντα.
- source_word: ἐκ τοῦ θεοῦ
  choice: vient de Dieu
  rationale: ἐκ indique de nouveau la source ou l’origine. « Vient de Dieu » exprime de façon idiomatique que Dieu est l’origine ultime de tout.
theological_decisions:
- issue: Sens de γυνή et ἀνήρ dans ce passage
  choice: « femme » et « homme » au sens générique
  alternative: « épouse » et « mari »
  rationale: Bien que les deux noms puissent désigner des conjoints, le verset rapproche l’origine de la femme dans le récit de la création et la venue au monde de l’homme par la femme. Le sens générique préserve donc mieux la portée de l’argument sans exclure l’autre possibilité lexicale.
- issue: Rapport entre les origines de la femme et de l’homme
  choice: Maintenir la distinction entre « de » (ἐκ) et « par » (διά)
  alternative: Employer « de » dans les deux propositions
  rationale: Paul distingue l’origine de la femme à partir de l’homme dans la création et la venue au monde de l’homme par l’intermédiaire de la femme. La traduction conserve cette réciprocité et cette tension au lieu d’uniformiser les deux rapports.
translation_notes:
  register: Français international moderne, naturel et digne. La tournure « vient au monde par » explicite sobrement la référence à la naissance tout en préservant la préposition instrumentale. Le point-virgule marque le mouvement conclusif vers Dieu.
