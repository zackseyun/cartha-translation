id: 1CO.11.23
reference: 1 Corinthians 11:23
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἐγὼ γὰρ παρέλαβον ἀπὸ τοῦ κυρίου, ὃ καὶ παρέδωκα ὑμῖν, ὅτι ὁ κύριος Ἰησοῦς ἐν τῇ νυκτὶ ᾗ ⸀παρεδίδετο ἔλαβεν ἄρτον
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/023.yaml
  text: 'For I received from the Lord what I also delivered to you: that the Lord Jesus[a], on the night when he was being handed over, took bread'
translation:
  language: fr
  text: 'Car j’ai reçu du Seigneur ce que je vous ai aussi transmis : le Seigneur Jésus, dans la nuit où il était livré[a], prit du pain.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, selon la traduction traditionnelle : « où il était trahi ».'
    reason: Le verbe grec peut signifier « livrer », « remettre » ou, selon le contexte, « trahir ».
lexical_decisions:
- source_word: παρέλαβον
  choice: j’ai reçu
  rationale: Rend le langage traditionnel de réception et maintient la correspondance avec παρέδωκα.
- source_word: ἀπὸ τοῦ κυρίου
  choice: du Seigneur
  rationale: Exprime naturellement la source sans expliciter davantage que le grec.
- source_word: παρέδωκα
  choice: j’ai transmis
  rationale: « Transmis » est clair en français actuel pour la communication d’une tradition reçue, tout en évitant une répétition artificielle de « livré » employé ensuite pour παρεδίδετο.
- source_word: ὅτι
  choice: ':'
  rationale: En français, les deux-points introduisent naturellement le contenu de ce qui a été transmis; un « que » explicite serait plus lourd ici.
- source_word: κύριος
  choice: Seigneur
  rationale: Conserve la portée révérencielle et christologique usuelle du terme.
- source_word: ἐν τῇ νυκτὶ ᾗ
  choice: dans la nuit où
  rationale: Formulation française naturelle qui suit de près la construction temporelle grecque.
- source_word: παρεδίδετο
  choice: il était livré
  rationale: L’imparfait passif conserve le sens large de remise ou de livraison sans réduire explicitement l’action à la trahison de Judas.
- source_word: ἔλαβεν ἄρτον
  choice: prit du pain
  rationale: Rend simplement l’aoriste et le nom sans article, dans une formulation française naturelle et reconnaissable.
theological_decisions:
- issue: Sens de παρεδίδετο dans le récit de l’institution
  choice: il était livré
  alternative: il était trahi
  rationale: « Était livré » préserve l’étendue sémantique du grec et la tension entre la trahison humaine et la remise de Jésus dans le cadre plus large de sa Passion. La lecture traditionnelle est signalée en note.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation garde le parallélisme entre réception et transmission, tout en distinguant clairement la transmission de l’enseignement et le fait que Jésus est livré.
