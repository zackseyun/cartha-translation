reference: 1 Corinthians 11:25
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὡσαύτως καὶ τὸ ποτήριον μετὰ τὸ δειπνῆσαι, λέγων· Τοῦτο τὸ ποτήριον ἡ καινὴ διαθήκη ἐστὶν ἐν τῷ ἐμῷ αἵματι· τοῦτο ποιεῖτε, ὁσάκις ⸀ἐὰν πίνητε, εἰς τὴν ἐμὴν ἀνάμνησιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/025.yaml
  text: In the same way also[a], after supper, he took the cup, saying, “This cup is the new covenant in my blood. Keep doing this, whenever you drink it[b], in remembrance of me.”
translation:
  language: fr
  text: 'De même, après le repas, il prit aussi la coupe et dit : « Cette coupe est la nouvelle alliance en mon sang. Continuez à faire cela, chaque fois que vous en boirez, en mémoire de moi. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡσαύτως καὶ τὸ ποτήριον
  choice: De même, … il prit aussi la coupe
  rationale: « De même » marque le parallèle avec le geste accompli sur le pain, tandis que « aussi » rend καί. Le verbe « prit » est sous-entendu par la construction parallèle du verset précédent et rend la phrase naturelle en français.
- source_word: μετὰ τὸ δειπνῆσαι
  choice: après le repas
  rationale: La construction indique l’antériorité temporelle. « Après le repas » est naturelle en français moderne et ne restreint pas indûment δειπνέω à une désignation culturelle précise.
- source_word: ποτήριον
  choice: coupe
  rationale: « Coupe » est le terme courant dans ce contexte biblique et évite le registre liturgique plus marqué de « calice ».
- source_word: ἡ καινὴ διαθήκη
  choice: la nouvelle alliance
  rationale: διαθήκη évoque ici l’alliance biblique, notamment le contexte de Jérémie 31. « Testament » serait moins clair et moins adapté en français contemporain.
- source_word: ἐν τῷ ἐμῷ αἵματι
  choice: en mon sang
  rationale: Cette formulation proche du grec conserve l’expression sacrificielle et relationnelle sans préciser de manière interprétative si ἐν signifie ici « par » ou « au moyen de ».
- source_word: τοῦτο ποιεῖτε
  choice: Continuez à faire cela
  rationale: L’impératif présent, associé à la proposition suivante, convient à une pratique répétée. Cette traduction rend explicitement cette continuité sans changer l’objet du commandement.
- source_word: ὁσάκις ἐὰν πίνητε
  choice: chaque fois que vous en boirez
  rationale: La construction exprime des occasions répétées et éventuelles. Le pronom « en » reprend naturellement le contenu de la coupe en français.
- source_word: εἰς τὴν ἐμὴν ἀνάμνησιν
  choice: en mémoire de moi
  rationale: Cette expression française naturelle rend l’acte de souvenir ou de commémoration indiqué par ἀνάμνησις.
theological_decisions:
- issue: Sens de διαθήκη dans la parole sur la coupe
  choice: alliance
  alternative: testament
  rationale: Le contexte du sang qui établit l’alliance et l’arrière-plan scripturaire favorisent « alliance ». Le choix n’impose pas une conception confessionnelle ultérieure.
- issue: Rapport entre la coupe et la nouvelle alliance
  choice: Cette coupe est la nouvelle alliance en mon sang
  alternative: Cette coupe représente la nouvelle alliance / Cette coupe est la nouvelle alliance ratifiée par mon sang
  rationale: La formulation directe du grec est conservée. Ajouter « représente » ou « ratifiée par » trancherait une question sacramentelle ou préciserait la valeur de la préposition au-delà de ce que dit explicitement le texte.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche de l’énoncé grec, tout en rétablissant le verbe sous-entendu « prit » pour assurer une phrase française complète. Aucun terme liturgique confessionnel n’est introduit.
