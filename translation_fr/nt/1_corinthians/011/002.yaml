source:
  edition: SBLGNT
  text: Ἐπαινῶ δὲ ⸀ὑμᾶς ὅτι πάντα μου μέμνησθε καὶ καθὼς παρέδωκα ὑμῖν τὰς παραδόσεις κατέχετε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/002.yaml
  text: I praise you because you remember me in everything and hold firmly to the traditions just as I delivered them to you[a].
translation:
  language: fr
  text: Je vous félicite parce que vous vous souvenez de moi à tous égards et que vous restez attachés aux traditions comme je vous les ai transmises[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « enseignements » ou « instructions »; le grec dit « traditions », c’est-à-dire ce qui est transmis.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐπαινῶ
  choice: Je vous félicite
  rationale: Le verbe signifie louer ou féliciter. Dans ce contexte, « je vous félicite » exprime naturellement l’approbation adressée aux Corinthiens sans paraître excessivement solennel.
- source_word: δὲ
  choice: non rendu explicitement
  rationale: Ici, δέ marque une transition légère. En français, l’enchaînement est naturel sans connecteur ajouté; « mais » suggérerait un contraste trop marqué.
- source_word: πάντα
  choice: en toute chose
  rationale: 'Cette expression conserve la portée générale du grec tout en restant idiomatique et laisse ouverte la nuance exacte: dans tous les domaines ou à tous égards.'
- source_word: μου μέμνησθε
  choice: vous souvenir de moi
  rationale: Cette formulation directe rend le souvenir durable exprimé par la forme verbale grecque; le contexte suffit à communiquer la continuité.
- source_word: καθὼς
  choice: exactement comme
  rationale: Cette tournure souligne la correspondance entre la transmission de Paul et la manière dont les Corinthiens conservent ce qu’ils ont reçu.
- source_word: παρέδωκα
  choice: je vous les ai transmises
  rationale: « Transmettre » rend clairement l’idée de faire passer à d’autres un enseignement ou une pratique reçue, avec un français plus naturel que « livrer » dans ce contexte.
- source_word: τὰς παραδόσεις
  choice: les traditions
  rationale: « Traditions » est l’équivalent lexical le plus transparent et préserve l’idée de réalités transmises sans les réduire aux seuls enseignements verbaux.
- source_word: κατέχετε
  choice: rester attachés à
  rationale: Le verbe exprime le fait de retenir et de maintenir fermement. « Rester attachés à » communique une adhésion durable en français actuel.
theological_decisions:
- issue: Sens de παραδόσεις dans un contexte ecclésial
  choice: traditions
  alternative: enseignements; instructions
  rationale: Le terme désigne ici ce que Paul a transmis aux Corinthiens. « Traditions » préserve cette catégorie propre au texte sans lui attribuer les développements doctrinaux ultérieurs d’une confession particulière; une note indique les autres rendus possibles.
translation_notes:
  register: Français international moderne, clair et digne. « Je vous félicite » convient à une adresse positive; « rester attachés » évite l’archaïsme de « retenir fermement » tout en conservant la force de κατέχετε. Le pluriel de « attachés » manifeste que « vous » désigne la communauté.
