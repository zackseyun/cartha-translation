  terminology: « Son propre repas » préserve l’opposition entre l’intérêt privé et le repas partagé sans imposer une interprétation confessionnelle. « S’enivre » ne minimise pas l’excès dénoncé. Les ancres de notes sont placées sur les expressions pertinentes et les notes correspondent bien aux ambiguïtés lexicales signalées.
