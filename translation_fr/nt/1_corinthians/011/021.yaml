source:
  edition: SBLGNT
  text: ἕκαστος γὰρ τὸ ἴδιον δεῖπνον προλαμβάνει ἐν τῷ φαγεῖν, καὶ ὃς μὲν πεινᾷ, ὃς δὲ μεθύει.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/021.yaml
  text: For each one goes ahead with his own supper when it is time to eat, and one is hungry while another gets drunk.
translation:
  language: fr
  text: 'Car, au moment de manger, chacun prend son propre repas sans attendre les autres[a] : l’un a faim, tandis que l’autre s’enivre[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « prend son propre repas avant les autres ». Le verbe grec peut souligner le fait de prendre quelque chose d’avance ou d’aller de l’avant sans attendre les autres.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « l’un a faim, tandis que l’autre est ivre ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕκαστος
  choice: chacun
  rationale: Le pronom distributif singulier « chacun » rend naturellement l’individualisation exprimée par le grec.
- source_word: γὰρ
  choice: Car
  rationale: « Car » introduit l’explication qui justifie le reproche formulé dans le contexte précédent.
- source_word: τὸ ἴδιον δεῖπνον
  choice: son propre repas
  rationale: « Son propre » souligne le caractère privé du repas, par contraste avec le repas commun. « Repas » évite les variations régionales de sens de « dîner » tout en restant naturel.
- source_word: προλαμβάνει
  choice: prend … sans attendre les autres
  rationale: Dans ce contexte, le verbe peut indiquer que quelqu’un prend son repas d’avance ou va de l’avant sans attendre. Cette formulation française exprime clairement l’attitude égoïste sans réduire le sens à une seule nuance temporelle; l’autre possibilité est signalée en note.
- source_word: ἐν τῷ φαγεῖν
  choice: au moment de manger
  rationale: La construction avec l’infinitif articulé a ici une valeur temporelle. Cette formulation est à la fois proche du grec et idiomatique en français.
- source_word: ὃς μὲν ... ὃς δὲ
  choice: l’un … l’autre
  rationale: Cette tournure rend avec concision l’opposition corrélative entre les situations des différents participants.
- source_word: πεινᾷ
  choice: a faim
  rationale: Le présent décrit simplement l’état de celui qui manque de nourriture; « a faim » est direct et naturel.
- source_word: μεθύει
  choice: s’enivre
  rationale: Le verbe grec peut exprimer le fait d’être ou de devenir ivre. « S’enivre » rend sans l’atténuer l’excès dénoncé et s’accorde bien avec le déroulement du repas.
theological_decisions:
- issue: Référence distributive au singulier
  choice: chacun prend son propre repas
  alternative: tous prennent leur propre repas
  rationale: Le singulier distributif du grec est conservé naturellement en français par « chacun » et « son », sans transformer la phrase en formulation collective.
- issue: Nature de l’abus pendant le repas du Seigneur
  choice: l’autre s’enivre
  alternative: l’autre est ivre
  rationale: Le texte évoque réellement l’ivresse et ne doit pas être adouci en simple excès alimentaire. Le choix « s’enivre » laisse entendre le processus, tandis que la note conserve la lecture stative possible.
translation_notes:
  register: Français international moderne, naturel et digne. « Repas » a été préféré à « dîner », dont l’emploi varie selon les régions francophones. La ponctuation par deux-points fait ressortir les conséquences opposées de la conduite décrite.
