  source_fidelity: Le texte rend fidèlement la structure explicative de γάρ, le distributif ἕκαστος, l’appropriation soulignée par τὸ ἴδιον δεῖπνον et le contraste final. « Prend son propre repas sans attendre les autres » exprime de façon contextuellement justifiée la valeur de προλαμβάνει (« prendre d’avance / aller de l’avant »), sans prétendre que le grec nomme explicitement les personnes attendues. « Au moment de manger » rend adéquatement la valeur temporelle de ἐν τῷ φαγεῖν. « S’enivre » conserve la réalité de l’ivresse exprimée par μεθύει; la note signale correctement l’alternative stative.
