  source_fidelity: Le texte rend fidèlement la construction temporelle συνερχομένων… ὑμῶν, l’inférence de οὖν, et la double idée de rassemblement et de lieu dans ἐπὶ τὸ αὐτό. « Ce n’est pas pour manger le repas du Seigneur » reproduit de manière idiomatique en français la formulation grecque compacte οὐκ ἔστιν… φαγεῖν, sans trancher indûment entre l’impossibilité évaluative et l’énoncé plus direct selon lequel ils ne mangent pas véritablement ce repas.
  naturalness: Le français est moderne, clair et d’un registre convenable pour une traduction biblique internationale. « Au même endroit » est naturel et préserve utilement la nuance spatiale; « repas » évite les régionalismes liés à « souper ». La tournure « ce n’est pas pour manger » est légèrement marquée, mais elle est établie dans ce contexte et conserve bien la tension syntaxique et évaluative du grec.
  terminology: « Le repas du Seigneur » rend directement κυριακὸν δεῖπνον, sans importer une désignation confessionnelle particulière. La note présente de façon adéquate l’alternative « vous ne mangez pas… » et explique sa portée contextuelle sans imposer de lecture doctrinale.
