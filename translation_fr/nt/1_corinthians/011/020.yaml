id: 1CO.11.20
reference: 1 Corinthians 11:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: συνερχομένων οὖν ὑμῶν ἐπὶ τὸ αὐτὸ οὐκ ἔστιν κυριακὸν δεῖπνον φαγεῖν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/020.yaml
  text: Therefore[a], when you come together in the same place, it is not to eat the Lord’s supper,
translation:
  language: fr
  text: Ainsi, lorsque vous vous réunissez au même endroit, ce n’est pas pour manger le repas du Seigneur[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « vous ne mangez pas le repas du Seigneur » ; leur conduite fait que le repas ne peut plus être considéré comme tel.'
    reason: alternative_reading
lexical_decisions:
- source_word: συνερχομένων
  choice: lorsque vous vous réunissez
  rationale: Le participe au génitif avec ὑμῶν forme une proposition temporelle. « Vous vous réunissez » exprime naturellement le rassemblement communautaire.
- source_word: οὖν
  choice: Ainsi
  rationale: Le mot marque ici la conséquence de la réprimande précédente concernant les divisions. « Ainsi » maintient ce lien logique dans un français actuel.
- source_word: ἐπὶ τὸ αὐτό
  choice: au même endroit
  rationale: Cette expression idiomatique désigne le fait de se trouver en un même lieu ou dans une même assemblée. La traduction conserve sa nuance spatiale sans répéter simplement l’idée de réunion.
- source_word: οὐκ ἔστιν ... φαγεῖν
  choice: ce n’est pas pour manger
  rationale: 'La formulation conserve la structure infinitive grecque et son caractère évaluatif : leur rassemblement, tel qu’il se déroule, n’aboutit pas véritablement à manger le repas du Seigneur. Une note signale l’autre formulation française naturelle.'
- source_word: κυριακὸν
  choice: du Seigneur
  rationale: L’adjectif signifie « appartenant au Seigneur ». Le complément « du Seigneur » en restitue clairement la valeur possessive.
- source_word: δεῖπνον
  choice: repas
  rationale: Dans ce contexte, le terme désigne le repas communautaire pris en mémoire de Jésus. « Repas » est plus naturel et international en français moderne que « souper », dont l’usage varie selon les régions.
- source_word: κυριακὸν δεῖπνον
  choice: le repas du Seigneur
  rationale: Cette formulation rend directement l’adjectif et le nom grecs, tout en restant claire et digne. Elle évite de privilégier l’expression confessionnelle traditionnelle « sainte cène ».
theological_decisions:
- issue: Paul nie-t-il la possibilité de prendre ce repas, ou affirme-t-il que leur conduite empêche leur repas de mériter le nom de repas du Seigneur ?
  choice: Leur rassemblement, compte tenu de leur manière d’agir, n’a pas pour réalité véritable de manger le repas du Seigneur.
  alternative: « Vous ne mangez pas le repas du Seigneur », ou « il n’est pas possible de manger le repas du Seigneur ».
  rationale: Les versets 21-22 montrent que Paul condamne la manière dont le repas communautaire est pris, plutôt qu’une impossibilité métaphysique. Le texte principal garde toutefois la formulation grecque comprimée, tandis que la note présente l’interprétation plus explicite sans supprimer la tension.
translation_notes:
  register: Français international moderne, naturel et digne. « Repas du Seigneur » est intelligible sans dépendre d’un vocabulaire confessionnel particulier. La syntaxe légèrement marquée de « ce n’est pas pour manger » préserve l’ambiguïté et la force évaluative de l’original, éclairées par la note.
