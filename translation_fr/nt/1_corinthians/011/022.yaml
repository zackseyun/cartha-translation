source:
  edition: SBLGNT
  text: μὴ γὰρ οἰκίας οὐκ ἔχετε εἰς τὸ ἐσθίειν καὶ πίνειν; ἢ τῆς ἐκκλησίας τοῦ θεοῦ καταφρονεῖτε, καὶ καταισχύνετε τοὺς μὴ ἔχοντας; τί ⸂εἴπω ὑμῖν⸃; ἐπαινέσω ὑμᾶς; ἐν τούτῳ οὐκ ἐπαινῶ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/022.yaml
  text: For do you not have houses for eating and drinking? Or do you despise the church of God and shame those who have nothing? What should I say to you? Should I praise you? In this I do not praise you[a].
translation:
  language: fr
  text: Car n’avez-vous pas des maisons pour manger et boire ? Ou bien méprisez-vous l’Église de Dieu et faites-vous honte à ceux qui n’ont rien[a] ? Que dois-je vous dire ? Dois-je vous féliciter ? Sur ce point, je ne vous félicite pas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les pauvres » ou « ceux qui n’ont rien à manger » ; le grec dit littéralement « ceux qui n’ont pas ».
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκίας
  choice: des maisons
  rationale: Le pluriel désigne les espaces domestiques privés, par contraste avec l’assemblée réunie. « Maisons » préserve clairement ce contraste.
- source_word: εἰς τὸ ἐσθίειν καὶ πίνειν
  choice: pour manger et boire
  rationale: La préposition suivie des infinitifs substantivés exprime le but ; cette formulation est naturelle en français et en conserve la valeur.
- source_word: ἐκκλησίας τοῦ θεοῦ
  choice: l’Église de Dieu
  rationale: Dans cet emploi paulinien, l’expression désigne la communauté ou l’assemblée appartenant à Dieu. « Église » est le terme français établi sans imposer ici une définition institutionnelle.
- source_word: καταφρονεῖτε
  choice: méprisez-vous
  rationale: Le verbe signifie traiter comme négligeable ou avec mépris. « Mépriser » conserve la vigueur morale du reproche.
- source_word: καταισχύνετε
  choice: faites-vous honte à
  rationale: Le verbe exprime le fait de couvrir quelqu’un de honte. Cette tournure directe reste naturelle et évite de renforcer le texte par « humilier ».
- source_word: τοὺς μὴ ἔχοντας
  choice: ceux qui n’ont rien
  rationale: L’expression signifie littéralement « ceux qui n’ont pas ». Le contexte suggère un manque de nourriture ou de ressources, mais cette formulation en préserve l’indétermination.
- source_word: τί εἴπω ὑμῖν;
  choice: Que dois-je vous dire ?
  rationale: Le subjonctif aoriste délibératif exprime ici une question rhétorique ; la formulation choisie en restitue naturellement la force.
- source_word: ἐπαινέσω ὑμᾶς;
  choice: Dois-je vous féliciter ?
  rationale: La question délibérative est ironique et appelle une réponse négative. « Féliciter » convient à l’idée d’approbation dans ce contexte.
- source_word: ἐν τούτῳ
  choice: Sur ce point
  rationale: L’expression renvoie à la conduite qui vient d’être dénoncée. « Sur ce point » est plus idiomatique en français que le calque « en ceci ».
- source_word: οὐκ ἐπαινῶ
  choice: je ne vous félicite pas
  rationale: La répétition de « féliciter » reproduit celle du verbe ἐπαινέω et maintient l’effet rhétorique.
theological_decisions:
- issue: Référent de « ceux qui n’ont rien » dans le contexte du repas du Seigneur
  choice: Conserver dans le texte la formulation générale « ceux qui n’ont rien ».
  alternative: « les pauvres » ou « ceux qui n’ont rien à manger »
  rationale: Le contexte immédiat vise vraisemblablement des croyants matériellement démunis, notamment privés de nourriture, mais le grec dit plus largement « ceux qui n’ont pas ». Le texte principal conserve cette ouverture, tandis que la note explicite les principales lectures contextuelles.
translation_notes:
  register: Français international moderne, digne et direct. Les questions rhétoriques et la répétition finale sont conservées. La majuscule à « Église » suit l’usage éditorial français pour la communauté ecclésiale, sans ajouter de précision institutionnelle.
