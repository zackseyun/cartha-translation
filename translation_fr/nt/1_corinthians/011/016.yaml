source:
  edition: SBLGNT
  text: εἰ δέ τις δοκεῖ φιλόνεικος εἶναι, ἡμεῖς τοιαύτην συνήθειαν οὐκ ἔχομεν, οὐδὲ αἱ ἐκκλησίαι τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/016.yaml
  text: But if anyone seems to be contentious[a], we have no such custom[b], nor do the churches of God.
translation:
  language: fr
  text: Mais si quelqu’un semble être querelleur[a], nous n’avons pas une telle coutume[b], et les Églises de Dieu non plus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « aimer les disputes », « être porté à la dispute ».'
    reason: lexical_alternative
  - marker: b
    text: « Une telle coutume » peut désigner soit le fait d’être querelleur, soit la pratique contestée dont parlent les versets précédents.
    reason: alternative_reading
lexical_decisions:
- source_word: δοκεῖ
  choice: semble
  rationale: Dans la construction avec l’infinitif, « semble » rend directement l’idiome grec et n’impose pas une lecture plus précise comme « pense » ou « est disposé à ».
- source_word: φιλόνεικος
  choice: vouloir chercher querelle
  rationale: Cette expression française naturelle décrit une personne portée à la dispute ou à la contestation, tout en conservant l’idée d’inclination exprimée par l’adjectif grec.
- source_word: τοιαύτην
  choice: une telle
  rationale: Le démonstratif renvoie à une pratique de cette sorte sans préciser son référent, ce qui préserve la concision et l’ambiguïté du grec.
- source_word: συνήθειαν
  choice: coutume
  rationale: « Coutume » désigne un usage ou une pratique établie et demeure assez large pour ne pas trancher le référent discuté.
- source_word: οὐκ ἔχομεν
  choice: nous n’avons pas
  rationale: Traduction directe qui évite d’introduire les nuances interprétatives plus fortes de « nous ne suivons pas » ou « nous ne permettons pas ».
- source_word: ἐκκλησίαι τοῦ θεοῦ
  choice: les Églises de Dieu
  rationale: Cette formulation naturelle conserve le génitif grec et l’appel de Paul aux communautés qui appartiennent à Dieu.
theological_decisions:
- issue: Référent de « une telle coutume »
  choice: La traduction conserve l’expression générale « une telle coutume » sans identifier explicitement ce qu’elle désigne.
  alternative: La coutume de chercher querelle, ou la pratique contestée dont parlent les versets précédents.
  rationale: Le grec τοιαύτην συνήθειαν est concis et son référent est débattu. Le préciser dans le texte principal résoudrait une ambiguïté réelle que la traduction doit préserver.
translation_notes:
  register: Français international moderne, digne et accessible. « Chercher querelle » est idiomatique sans être familier. La coordination finale « et… non plus » restitue naturellement οὐδέ tout en évitant une répétition lourde.
