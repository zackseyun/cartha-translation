source:
  edition: SBLGNT
  text: ⸀οὐδὲ ⸂ἡ φύσις αὐτὴ⸃ διδάσκει ὑμᾶς ὅτι ἀνὴρ μὲν ἐὰν κομᾷ, ἀτιμία αὐτῷ ἐστιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/014.yaml
  text: Does not even nature itself teach you that if a man wears long hair[a], it is a dishonor to him[b],
translation:
  language: fr
  text: La nature elle-même[b] ne vous enseigne-t-elle pas que, si un homme porte les cheveux longs[a], c’est pour lui un déshonneur ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « laisse pousser ses cheveux » ou « a les cheveux longs ». Le verbe grec désigne le fait de porter ou d’avoir les cheveux longs.
    reason: lexical_alternative
  - marker: b
    text: L’expression « la nature elle-même » peut désigner l’ordre créé, la perception humaine commune ou ce qu’une culture considère comme naturellement convenable ; ici, le grec ne précise pas davantage.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐδὲ
  choice: ne… pas… elle-même
  rationale: La tournure interrogative négative restitue la question rhétorique, tandis que « elle-même » porte aussi l’emphase explicitement présente dans αὐτή.
- source_word: ἡ φύσις αὐτὴ
  choice: la nature elle-même
  rationale: Cette formulation conserve l’emphase du grec et laisse volontairement ouvert le sens de φύσις, sans le réduire à la biologie ni à la coutume.
- source_word: διδάσκει ὑμᾶς
  choice: vous enseigne
  rationale: Rend directement le présent διδάσκει et son complément, dans un français naturel et digne.
- source_word: ἀνὴρ
  choice: un homme
  rationale: Le contexte oppose ici l’homme à la femme; rien dans cette proposition n’impose le sens de « mari ».
- source_word: μέν
  choice: non exprimé explicitement
  rationale: La particule annonce le premier volet d’un contraste poursuivi au verset suivant; la traduire par « d’une part » alourdirait artificiellement ce verset isolé.
- source_word: ἐὰν κομᾷ
  choice: si un homme porte les cheveux longs
  rationale: κομάω désigne le fait de porter ou d’avoir les cheveux longs. Cette expression actuelle évite de suggérer uniquement le processus de les laisser pousser.
- source_word: ἀτιμία αὐτῷ ἐστιν
  choice: c’est pour lui un déshonneur
  rationale: « Déshonneur » conserve le vocabulaire de l’honneur et de la honte, et « pour lui » rend naturellement le datif αὐτῷ.
theological_decisions:
- issue: Sens de φύσις dans l’argument de Paul
  choice: « la nature elle-même », sans précision interprétative dans le corps du texte
  alternative: l’ordre créé; la perception humaine commune; ce qu’une culture tient pour naturellement convenable
  rationale: Le terme grec ne tranche pas ici entre ces nuances. La traduction maintient donc l’ambiguïté réelle et la note les expose sans imposer une lecture doctrinale ou culturelle particulière.
translation_notes:
  register: Français international moderne, clair et digne. La question rhétorique est conservée. « Porte les cheveux longs » est idiomatique sans être familier, et les notes préservent les possibilités lexicales et interprétatives du grec.
