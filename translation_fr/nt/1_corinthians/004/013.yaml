source:
  edition: SBLGNT
  text: ⸀δυσφημούμενοι παρακαλοῦμεν· ὡς περικαθάρματα τοῦ κόσμου ἐγενήθημεν, πάντων περίψημα ἕως ἄρτι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/013.yaml
  text: When slandered[a], we appeal; we have become like the world's refuse, the scum of all things[b], until now.
translation:
  language: fr
  text: Quand on nous calomnie[a], nous faisons appel ; nous sommes devenus comme les déchets du monde, le rebut de tous[b], jusqu’à maintenant.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Quand on nous diffame ». Le verbe grec peut signifier « exhorter », « encourager », « supplier » ou « faire appel » ; dans ce contexte, il décrit vraisemblablement une réponse non vindicative à l’injure.
    reason: lexical_alternative
  - marker: b
    text: Les deux mots grecs rendus par « déchets » et « rebut » sont rares et très forts. Ils peuvent évoquer ce qu’on enlève, racle ou essuie lors d’un nettoyage ; certains y voient aussi un arrière-plan rituel, mais celui-ci reste incertain.
    reason: cultural_note
lexical_decisions:
- source_word: δυσφημούμενοι
  choice: Quand on nous calomnie
  rationale: Le participe passif désigne des paroles malveillantes qui portent atteinte à la réputation. La tournure temporelle française restitue naturellement sa fonction circonstancielle.
- source_word: παρακαλοῦμεν
  choice: nous répondons par des paroles d’apaisement
  rationale: Dans cette série de contrastes, le verbe décrit une réponse verbale conciliante à l’offense. Cette formulation évite le sens moderne ambigu de « nous faisons appel » et n’ajoute pas explicitement l’adverbe « doucement ».
- source_word: ὡς
  choice: comme
  rationale: Introduit une comparaison, sans imposer une identité stricte.
- source_word: περικαθάρματα τοῦ κόσμου
  choice: les déchets du monde
  rationale: Le terme rare évoque ce qu’on enlève en nettoyant et, par extension, ce qui est tenu pour abject. « Déchets » reste actuel, fort et intelligible.
- source_word: ἐγενήθημεν
  choice: nous sommes devenus
  rationale: Le passé composé exprime en français l’entrée dans un état qui demeure vrai au moment où Paul écrit.
- source_word: πάντων περίψημα
  choice: le rebut de tous
  rationale: περίψημα désigne ce qui est raclé ou essuyé et rejeté comme vil. Le masculin πάντων peut se comprendre comme « de tous » sans trancher explicitement entre toutes choses et toutes personnes.
- source_word: ἕως ἄρτι
  choice: Jusqu’à maintenant
  rationale: Restitue l’expression temporelle qui souligne que cet état se prolonge au moment de la rédaction.
theological_decisions:
- issue: Sens des deux termes d’abaissement περικαθάρματα et περίψημα
  choice: Employer un langage concret de déchet et de rebut, sans introduire dans le texte une notion de victimes expiatoires
  alternative: Traduire par « souillure » et « raclure », ou expliciter une éventuelle allusion rituelle ou sacrificielle
  rationale: Le contexte met directement en relief le mépris social et l’humiliation des apôtres. Les possibles arrière-plans purificatoires ou sacrificiels de ces mots rares demeurent incertains et ne doivent pas devenir une affirmation doctrinale dans le texte principal.
- issue: Portée de πάντων
  choice: « de tous », formulation qui préserve l’ambiguïté grammaticale
  alternative: « de toutes choses » ou « de tout le monde »
  rationale: La forme grecque peut recevoir une portée large et n’oblige pas à choisir entre personnes et choses. Le français « de tous » conserve cette ouverture.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase est divisée en deux pour éviter une accumulation lourde. « Paroles d’apaisement » traduit la réponse conciliante sans ajouter l’adverbe absent « doucement ». Les marqueurs [a] et [b] figurent dans le texte.
