reference: 1 Corinthians 4:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἡμεῖς μωροὶ διὰ Χριστόν, ὑμεῖς δὲ φρόνιμοι ἐν Χριστῷ· ἡμεῖς ἀσθενεῖς, ὑμεῖς δὲ ἰσχυροί· ὑμεῖς ἔνδοξοι, ἡμεῖς δὲ ἄτιμοι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/010.yaml
  text: We are fools for Messiah[a], but you are wise in Messiah; we are weak, but you are strong; you are honored[c][b], but we are dishonored.
translation:
  language: fr
  text: Nous sommes fous à cause du Messie[a], mais vous, vous êtes sages en relation avec le Messie[b] ; nous sommes faibles, mais vous, vous êtes forts ; vous êtes honorés[c], mais nous, nous sommes déshonorés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour le Messie ». L’expression grecque peut indiquer la cause ou le motif, avec la nuance « à cause du Messie » ou « pour lui ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « dans le Messie ». Ou « en Christ ». Le grec emploie ici la formule paulinienne courante ἐν Χριστῷ.
    reason: lexical_alternative
  - marker: c
    text: Ici, « honorés » et « déshonorés » évoquent vraisemblablement le rang social et la réputation publique, plutôt que de simples sentiments intérieurs.
    reason: cultural_note
lexical_decisions:
- source_word: μωροὶ
  choice: fous
  rationale: Le substantif français dans l’attribut conserve la vigueur ironique du grec et forme une antithèse nette avec « sages ».
- source_word: διὰ Χριστόν
  choice: à cause du Messie
  rationale: διά avec l’accusatif exprime ici naturellement la cause ou le motif. Cette formulation reste idiomatique tout en laissant la note signaler la nuance possible de dévouement ou de finalité.
- source_word: φρόνιμοι
  choice: sages
  rationale: Rend directement l’opposition ironique à μωροί sans la restreindre à la prudence pratique.
- source_word: ἐν Χριστῷ
  choice: dans le Messie
  rationale: Préserve la formule paulinienne avec ἐν ainsi que la valeur titulaire de Χριστός, sans la paraphraser.
- source_word: ἀσθενεῖς / ἰσχυροί
  choice: faibles / forts
  rationale: Ces antonymes simples gardent le parallélisme incisif et la portée assez large des termes grecs.
- source_word: ἔνδοξοι / ἄτιμοι
  choice: honorés / déshonorés
  rationale: Le couple exprime clairement le contraste de réputation et de statut public, tout en reproduisant la symétrie grecque.
- source_word: ἡμεῖς / ὑμεῖς
  choice: nous / vous, vous
  rationale: La dislocation « vous, vous » rend en français l’insistance des pronoms grecs explicites et soutient le contraste rhétorique.
theological_decisions:
- issue: Traduction de Χριστός
  choice: Messie dans διὰ Χριστόν et ἐν Χριστῷ
  alternative: Christ
  rationale: Le terme garde ici sa portée titulaire au sein d’un contraste théologique ; « Messie » la rend explicitement sans ajouter de précision doctrinale.
- issue: Valeur de διὰ Χριστόν
  choice: à cause du Messie
  alternative: pour le Messie / par amour pour le Messie
  rationale: La valeur causale est la plus directe dans ce contexte, mais la construction peut aussi évoquer le motif ou l’engagement ; cette latitude est conservée en note.
translation_notes:
  register: Français international moderne, digne et direct. Le parallélisme en trois contrastes et l’ironie mordante sont conservés. La répétition emphatique « vous, vous » est naturelle à l’oral comme à l’écrit et reflète les pronoms grecs exprimés.
