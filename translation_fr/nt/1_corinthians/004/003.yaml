  text: ἐμοὶ δὲ εἰς ἐλάχιστόν ἐστιν, ἵνα ὑφ’ ὑμῶν ἀνακριθῶ ἢ ὑπὸ ἀνθρωπίνης ἡμέρας· ἀλλ’ οὐδὲ ἐμαυτὸν ἀνακρίνω·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/003.yaml
  text: But to me it is a very small thing that I should be examined by you or by any human court; in fact[a], I do not even examine myself.
translation:
  language: fr
  text: Pour moi, il importe très peu que je sois examiné par vous ou par un tribunal humain[a] ; mais je ne m’examine même pas moi-même.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Grec, littéralement : « un jour humain », expression désignant ici une instance ou une séance humaine de jugement ou d’évaluation.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμοὶ
  choice: Pour moi
  rationale: Ce datif de référence exprime naturellement le point de vue personnel de Paul.
- source_word: εἰς ἐλάχιστόν ἐστιν
  choice: il importe très peu
  rationale: Cette tournure française naturelle rend l’idée d’une importance tout à fait minime sans reproduire servilement l’expression grecque.
- source_word: ἵνα
  choice: que
  rationale: Dans cette construction, la conjonction introduit le contenu de ce que Paul tient pour peu important.
- source_word: ἀνακριθῶ
  choice: que je sois examiné
  rationale: Le verbe évoque un examen ou une évaluation attentive, sans nécessairement désigner le jugement définitif ; la voix passive est conservée.
- source_word: ὑφ’ ὑμῶν
  choice: par vous
  rationale: Rend directement le complément d’agent, sans ajouter de nuance distributive absente du grec.
- source_word: ἢ ὑπὸ ἀνθρωπίνης ἡμέρας
  choice: ou par un tribunal humain[a]
  rationale: L’expression littérale « un jour humain » désigne idiomatiquement une instance ou une séance humaine d’évaluation ; « tribunal humain » en communique clairement le sens en français moderne.
- source_word: ἀλλ’ οὐδὲ
  choice: d’ailleurs, … même pas
  rationale: « D’ailleurs » marque la progression rhétorique, tandis que « même pas » conserve la force de οὐδέ.
- source_word: ἐμαυτὸν
  choice: moi-même
  rationale: Rend explicitement le pronom réfléchi accentué.
- source_word: ἀνακρίνω
  choice: je ne m’examine
  rationale: Le même verbe français est repris afin de préserver le lien lexical avec ἀνακριθῶ.
theological_decisions:
- issue: Sens de ἀνθρωπίνης ἡμέρας
  choice: Rendre l’idiome par « tribunal humain » dans le texte et signaler son sens littéral en note.
  alternative: « jour humain » ou « jugement humain »
  rationale: Le contexte oppose l’évaluation humaine au jugement du Seigneur. La traduction idiomatique évite de suggérer qu’il est ici question d’un jour du calendrier, sans faire de l’expression une affirmation doctrinale plus précise qu’elle ne l’est.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition d’« examiner » préserve la cohésion lexicale du grec, tandis que « tribunal humain » explicite avec mesure un idiome qui serait obscur s’il était traduit mot à mot.
