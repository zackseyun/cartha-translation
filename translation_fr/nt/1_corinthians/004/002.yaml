  text: ⸀ὧδε λοιπὸν ζητεῖται ἐν τοῖς οἰκονόμοις ἵνα πιστός τις εὑρεθῇ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/002.yaml
  text: In this case[a], moreover[c][b], it is required of stewards that one be found faithful.
translation:
  language: fr
  text: 'Voici donc ce qu’on demande aux intendants : que chacun soit trouvé fidèle.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Litt. « il est recherché parmi les intendants que quelqu’un soit trouvé fidèle » ; autrement dit, c’est ce qu’on attend ou exige d’eux.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὧδε
  choice: Dans ce cas
  rationale: Le terme renvoie ici à la situation ou au point dont Paul vient de parler, plutôt qu’à un lieu physique.
- source_word: λοιπὸν
  choice: donc
  rationale: Dans ce contexte, l’adverbe marque la suite logique du raisonnement. « Donc » rend cette transition plus naturellement que deux connecteurs juxtaposés.
- source_word: ζητεῖται
  choice: ce qu’on demande
  rationale: Le sens premier est « chercher », mais la construction exprime ici ce qui est attendu ou exigé des intendants.
- source_word: ἐν τοῖς οἰκονόμοις
  choice: aux intendants
  rationale: La tournure française « demander aux intendants » exprime naturellement le groupe auquel s’applique l’exigence.
- source_word: οἰκονόμοις
  choice: intendants
  rationale: « Intendants » conserve l’image de personnes chargées d’administrer ce qui leur a été confié.
- source_word: ἵνα
  choice: c’est que
  rationale: Après « ce qu’on demande », cette locution introduit naturellement en français le contenu de l’exigence.
- source_word: τις
  choice: chacun
  rationale: Le pronom grec est un singulier indéfini et générique. « Chacun » préserve la portée individuelle sans limiter l’énoncé aux hommes.
- source_word: πιστός
  choice: fidèle
  rationale: Le terme désigne une personne digne de confiance dans l’accomplissement de la charge reçue; « fidèle » conserve aussi la portée morale du grec.
- source_word: εὑρεθῇ
  choice: soit trouvé
  rationale: Cette formulation conserve le passif et l’idée qu’une personne se révèle fidèle lorsqu’elle est examinée.
theological_decisions:
- issue: Singulier représentatif et précision de genre
  choice: que chacun soit trouvé fidèle
  alternative: qu’un homme soit trouvé fidèle; qu’ils soient trouvés fidèles
  rationale: Le masculin singulier grec est générique dans ce contexte. « Chacun » conserve la responsabilité individuelle sans restreindre la déclaration aux personnes de sexe masculin ni la transformer en pluriel collectif.
translation_notes:
  register: Français international moderne, clair et digne. « Intendants » maintient la métaphore de l’administration d’un bien confié. La construction disloquée « ce qu’on demande…, c’est que… » rend idiomatiquement la tournure grecque tout en en conservant l’accent.
