id: 1CO.4.20
reference: 1 Corinthians 4:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὐ γὰρ ἐν λόγῳ ἡ βασιλεία τοῦ θεοῦ ἀλλ’ ἐν δυνάμει.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/020.yaml
  text: For the kingdom of God is not in word[a], but in power.
translation:
  language: fr
  text: Car le royaume de Dieu ne consiste pas en paroles[a], mais en puissance.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans le discours » ou « en simples paroles » ; le contraste porte sur la puissance effective, par opposition aux paroles seules.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ γὰρ
  choice: Car ... ne ... pas
  rationale: γάρ introduit la raison de l’affirmation précédente ; « Car » rend ce lien avec concision, tandis que la négation française encadre naturellement le verbe.
- source_word: ἐν λόγῳ
  choice: ne consiste pas en paroles
  rationale: λόγος peut désigner la parole, le discours ou les propos. Le pluriel français « paroles » exprime naturellement ici le contraste entre le discours seul et la puissance effective, sans réduire le terme à la rhétorique.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: le royaume de Dieu
  rationale: Formulation française consacrée et exacte, qui laisse ouvertes les nuances de règne et de domaine royal sans en privilégier artificiellement une.
- source_word: ἀλλ’ ἐν δυνάμει
  choice: mais en puissance
  rationale: « Puissance » conserve l’antithèse concise avec « paroles » et ne précise pas indûment s’il s’agit de miracles, de transformation, d’autorité apostolique ou d’une autre manifestation de la puissance divine.
theological_decisions:
- issue: Nature du contraste entre « paroles » et « puissance »
  choice: Le verset oppose les paroles seules à la puissance effective qui caractérise le royaume de Dieu, sans définir plus précisément cette puissance.
  alternative: Comprendre exclusivement la puissance comme les miracles, la transformation morale, la discipline ecclésiale ou l’autorité apostolique.
  rationale: Le grec ne précise pas ici la forme particulière de cette puissance ; la traduction maintient donc l’ouverture théologique du texte.
translation_notes:
  register: Français international moderne, naturel et digne. « Ne consiste pas en » rend idiomatiquement la construction grecque ἐν tout en conservant son opposition structurée ; « paroles » évite l’expression peu naturelle « en parole ».
