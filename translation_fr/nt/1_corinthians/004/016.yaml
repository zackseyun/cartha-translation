id: 1CO.4.16
reference: 1 Corinthians 4:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: παρακαλῶ οὖν ὑμᾶς, μιμηταί μου γίνεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/016.yaml
  text: 'Therefore I urge you: become imitators of me[a][b].'
translation:
  language: fr
  text: 'Je vous exhorte donc : devenez mes imitateurs[a][b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « soyez mes imitateurs ».
    reason: lexical_alternative
  - marker: b
    text: 'Ailleurs, Paul précise : « Imitez-moi, comme moi-même j’imite le Christ » (1 Corinthiens 11.1).'
    reason: cross_reference
lexical_decisions:
- source_word: παρακαλῶ
  choice: je vous exhorte
  rationale: Dans ce contexte, le verbe exprime un appel pressant. « Je vous exhorte » en conserve la force tout en restant digne et clair en français moderne.
- source_word: οὖν
  choice: donc
  rationale: La conjonction marque la conséquence tirée de l’argument précédent ; « donc » rend naturellement ce lien logique.
- source_word: ὑμᾶς
  choice: vous
  rationale: Le pronom est le complément pluriel de παρακαλῶ ; le français « vous » en rend directement le sens.
- source_word: μιμηταί
  choice: imitateurs
  rationale: Le nom désigne ceux qui prennent quelqu’un pour modèle et l’imitent. « Imitateurs » est plus précis que « disciples » ou « ceux qui suivent mon exemple ».
- source_word: μου
  choice: mes
  rationale: Le génitif dépend de μιμηταί. La tournure française naturelle est « mes imitateurs », équivalente à « imitateurs de moi ».
- source_word: γίνεσθε
  choice: devenez
  rationale: L’impératif présent de γίνομαι invite à entrer dans cet état ou à adopter cette conduite ; « devenez » en préserve la nuance mieux que le simple « soyez ».
theological_decisions:
- issue: L’appel de Paul à l’imiter peut sembler absolu s’il est séparé de son contexte christocentrique plus large, mais ce verset présente explicitement Paul comme modèle immédiat.
  choice: Traduire directement « devenez mes imitateurs » sans atténuer l’affirmation.
  alternative: « Suivez mon exemple » ou « prenez-moi pour modèle ».
  rationale: Le grec nomme sans ambiguïté Paul comme celui qu’il faut imiter. La traduction directe préserve la tension du texte ; le lien explicite avec l’imitation du Christ peut être signalé en note plutôt qu’ajouté au verset.
translation_notes:
  register: Français international moderne, clair et digne. « Je vous exhorte » garde le ton apostolique pressant, tandis que les deux-points mettent nettement en relief l’appel qui suit. « Christ » traduit ici le titre grec usuel dans la référence croisée sans imposer une formulation confessionnelle particulière.
