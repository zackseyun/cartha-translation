id: 1CO.4.21
reference: 1 Corinthians 4:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τί θέλετε; ἐν ῥάβδῳ ἔλθω πρὸς ὑμᾶς, ἢ ἐν ἀγάπῃ πνεύματί τε πραΰτητος;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/021.yaml
  text: What do you want? Should I come to you with a rod[b][a], or with love and a spirit of gentleness?
translation:
  language: fr
  text: Que voulez-vous ? Dois-je venir chez vous avec le bâton, ou avec amour et dans un esprit de douceur[a] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression peut désigner la disposition douce de Paul. Certains comprennent ici « l’Esprit » comme une allusion implicite à l’action du Saint-Esprit.
    reason: alternative_reading
lexical_decisions:
- source_word: τί θέλετε
  choice: Que voulez-vous ?
  rationale: Cette question directe rend naturellement la force du défi rhétorique grec sans l’atténuer.
- source_word: ἐν ῥάβδῳ
  choice: avec le bâton
  rationale: « Bâton » conserve l’image concrète de l’autorité et de la correction. Traduire directement par « discipline » expliquerait l’image au lieu de la préserver.
- source_word: ἔλθω πρὸς ὑμᾶς
  choice: Dois-je venir chez vous
  rationale: La tournure délibérative rend l’aoriste subjonctif et reste naturelle en français moderne. « Chez vous » désigne idiomatiquement la venue de Paul auprès de la communauté.
- source_word: ἐν ἀγάπῃ
  choice: avec amour
  rationale: La préposition « avec » maintient le parallélisme avec « avec le bâton » et exprime la manière dont Paul viendrait.
- source_word: πνεύματί τε πραΰτητος
  choice: et dans un esprit de douceur
  rationale: Cette formulation conserve le terme πνεῦμα et le rapport entre celui-ci et πραΰτης, tout en décrivant naturellement une disposition empreinte de douceur.
theological_decisions:
- issue: Sens de πνεύματι dans πνεύματί τε πραΰτητος
  choice: « un esprit de douceur », compris d’abord comme la disposition ou la manière d’agir de Paul
  alternative: « l’Esprit de douceur », compris comme une allusion à l’action du Saint-Esprit
  rationale: 'Le contexte oppose deux manières pour Paul de venir : avec une autorité corrective ou avec amour et douceur. L’absence d’article et ce contraste favorisent le sens de disposition personnelle, sans toutefois exclure que cette douceur soit produite par le Saint-Esprit. La note conserve cette ouverture.'
translation_notes:
  register: Français international moderne, direct et digne. La question garde son caractère incisif. « Le bâton » préserve la métaphore disciplinaire, tandis que « un esprit de douceur » maintient l’ambiguïté possible de πνεῦμα sans imposer une lecture explicitement pneumatologique.
