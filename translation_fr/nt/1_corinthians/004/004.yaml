reference: 1 Corinthians 4:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὐδὲν γὰρ ἐμαυτῷ σύνοιδα, ἀλλ’ οὐκ ἐν τούτῳ δεδικαίωμαι, ὁ δὲ ἀνακρίνων με κύριός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/004.yaml
  text: For I am aware of nothing against myself[a], but I am not justified by this[c][b]; the one who examines me is the Lord.
translation:
  language: fr
  text: Car je n’ai conscience de rien qui m’accuse[a] ; mais ce n’est pas pour autant que je suis déclaré juste[b]. Celui qui m’examine, c’est le Seigneur[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « je ne me connais aucun tort » ou « je n’ai conscience de rien contre moi-même ».
    reason: lexical_alternative
  - marker: b
    text: Ou « je ne suis pas pour autant acquitté » ou « je ne suis pas pour autant reconnu juste ». Le grec emploie un terme judiciaire que Paul utilise aussi ailleurs à propos du fait d’être déclaré juste.
    reason: lexical_alternative
  - marker: c
    text: Ou « Celui qui me juge ». Le verbe grec peut signifier examiner, enquêter sur ou évaluer, notamment dans un cadre judiciaire.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲν γὰρ ἐμαυτῷ σύνοιδα
  choice: Car je n’ai conscience de rien qui m’accuse
  rationale: L’expression σύνοιδα avec le datif ἐμαυτῷ décrit ce dont Paul a personnellement conscience, ici dans un contexte d’évaluation. La formulation française exprime naturellement l’absence de grief connu sans prétendre à une innocence absolue.
- source_word: ἀλλ’ οὐκ ἐν τούτῳ
  choice: mais ce n’est pas pour autant
  rationale: Cette tournure idiomatique rend le contraste et indique que l’absence de reproche dans la conscience de Paul ne constitue pas à elle seule le fondement du verdict.
- source_word: δεδικαίωμαι
  choice: je suis déclaré juste
  rationale: Le parfait passif de δικαιόω porte ici une valeur judiciaire. « Déclaré juste » conserve cette portée et le lien avec le vocabulaire paulinien, tout en restant compréhensible en français moderne.
- source_word: ὁ δὲ ἀνακρίνων με
  choice: Celui qui m’examine
  rationale: ἀνακρίνω peut désigner l’examen, l’enquête ou l’évaluation dans un cadre judiciaire. « Examine » préserve cette amplitude sans réduire le verbe au verdict final.
- source_word: κύριός
  choice: le Seigneur
  rationale: Le grec dit simplement κύριος avec un référent défini. La traduction n’ajoute pas une identification plus explicite que celle du texte.
theological_decisions:
- issue: Portée judiciaire de δεδικαίωμαι
  choice: je suis déclaré juste
  alternative: je suis acquitté ; je suis reconnu juste
  rationale: Le contexte concerne l’évaluation de Paul, mais le terme appartient aussi au vocabulaire théologique paulinien. La traduction conserve donc sa force judiciaire sans transformer le verset en exposé systématique sur la justification.
- issue: Valeur de la conscience personnelle de Paul
  choice: L’absence de grief conscient ne vaut pas verdict définitif.
  alternative: Comprendre la phrase comme une affirmation d’innocence absolue.
  rationale: Le contraste introduit par ἀλλά et la proposition suivante distinguent clairement l’autoévaluation de Paul du jugement du Seigneur.
- issue: Identité de κύριος
  choice: le Seigneur
  alternative: le Seigneur Jésus
  rationale: Même si le contexte paulinien peut orienter l’identification, le verset lui-même ne comporte que κύριος ; la traduction n’explicite donc pas davantage.
translation_notes:
  register: 'Français international moderne, naturel et digne. La phrase conserve la progression argumentative : conscience personnelle, insuffisance de cette autoévaluation, puis autorité du Seigneur. Les notes signalent les principales possibilités lexicales sans résoudre l’ambiguïté du vocabulaire judiciaire.'
