id: 1CO.4.5
reference: 1 Corinthians 4:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὥστε μὴ πρὸ καιροῦ τι κρίνετε, ἕως ἂν ἔλθῃ ὁ κύριος, ὃς καὶ φωτίσει τὰ κρυπτὰ τοῦ σκότους καὶ φανερώσει τὰς βουλὰς τῶν καρδιῶν, καὶ τότε ὁ ἔπαινος γενήσεται ἑκάστῳ ἀπὸ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/005.yaml
  text: Therefore[a], do not judge anything before the time, until the Lord comes, who will also bring to light the hidden things of darkness and reveal the purposes of the hearts[c][b]. Then each one’s praise will come from God.
translation:
  language: fr
  text: Ainsi donc, ne jugez rien avant le temps[a], jusqu’à ce que vienne le Seigneur. Il mettra aussi en lumière ce qui est caché dans les ténèbres et dévoilera les desseins des cœurs[b][c]. Alors, chacun recevra de Dieu sa louange.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avant le moment voulu » ou « prématurément »; l’expression grecque peut désigner une action accomplie avant le moment approprié.
    reason: lexical_alternative
  - marker: b
    text: Ou « les intentions des cœurs » ou « les motivations des cœurs ».
    reason: lexical_alternative
  - marker: c
    text: Il s’agit de l’évaluation finale du Seigneur lors de sa venue, quand il dévoilera ce qui est caché.
    reason: contextual_clarification
lexical_decisions:
- source_word: ὥστε
  choice: Ainsi donc
  rationale: Introduit la conséquence tirée de l’argument précédent, dans un français naturel tout en maintenant nettement le lien logique.
- source_word: μὴ πρὸ καιροῦ τι κρίνετε
  choice: ne jugez rien avant le temps
  rationale: Conserve la portée large de τι et traduit πρὸ καιροῦ sans ajouter explicitement l’idée d’un temps « fixé », absente du grec, tout en laissant entendre le moment approprié grâce au contexte.
- source_word: ἕως ἂν ἔλθῃ ὁ κύριος
  choice: jusqu’à ce que vienne le Seigneur
  rationale: La tournure française soutenue mais courante conserve la limite temporelle et le titre κύριος sans expliciter dans le corps du texte l’identité du Seigneur.
- source_word: φωτίσει τὰ κρυπτὰ τοῦ σκότους
  choice: mettra aussi en lumière ce qui est caché dans les ténèbres
  rationale: Rend naturellement la métaphore de la mise au jour. « Dans les ténèbres » exprime en français idiomatique la relation du génitif sans imposer que les réalités cachées appartiennent moralement aux ténèbres.
- source_word: φανερώσει τὰς βουλὰς τῶν καρδιῶν
  choice: dévoilera les desseins des cœurs
  rationale: « Desseins » garde l’éventail de βουλαί — projets, intentions, résolutions — sans le réduire aux seuls mobiles psychologiques; le pluriel « cœurs » respecte le grec.
- source_word: ὁ ἔπαινος γενήσεται ἑκάστῳ ἀπὸ τοῦ θεοῦ
  choice: chacun recevra de Dieu sa louange
  rationale: Formulation française claire qui préserve la distribution individuelle de ἑκάστῳ et Dieu comme source de la louange, sans préciser davantage sa nature.
theological_decisions:
- issue: Portée et moment du jugement
  choice: L’interdiction porte sur le jugement prononcé avant la venue et la révélation du Seigneur.
  alternative: Une interdiction absolue de toute forme de jugement ou de discernement.
  rationale: Le texte formule largement l’interdiction, mais πρὸ καιροῦ et ἕως ἂν ἔλθῃ ὁ κύριος la situent explicitement par rapport au moment futur où le caché sera dévoilé.
- issue: Identité du « Seigneur »
  choice: Conserver simplement le titre « le Seigneur », qui, dans ce contexte paulinien de venue future et de jugement, désigne naturellement Jésus.
  alternative: Expliciter « le Seigneur Jésus » ou comprendre une référence générale à Dieu.
  rationale: Le grec dit seulement ὁ κύριος. La traduction conserve cette formulation et sa portée christologique contextuelle sans ajouter un nom absent du verset.
- issue: Nature de la louange finale
  choice: Conserver l’affirmation distributive selon laquelle chacun recevra de Dieu sa louange.
  alternative: Reformuler en approbation, récompense ou verdict favorable.
  rationale: ἔπαινος signifie bien louange ou éloge. La formulation ne précise ni le degré ni les conditions de cette louange et évite de transformer le terme en doctrine détaillée de la récompense.
translation_notes:
  register: Français international moderne, digne et accessible. « Ainsi donc » marque l’inférence; l’inversion « jusqu’à ce que vienne le Seigneur » maintient une cadence solennelle sans archaïsme. Le texte évite les formulations confessionnelles ajoutées et conserve l’ambiguïté de βουλαί par « desseins ».
