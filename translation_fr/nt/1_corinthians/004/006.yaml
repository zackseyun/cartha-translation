review_pass:
  verdict: revise
  source_fidelity: La révision rend plus justement δι’ ὑμᾶς par « pour vous », valeur de bénéfice/purpose mieux établie ici que « à cause de vous ». Elle évite aussi de présenter la formule elliptique comme une « règle », qualification absente du grec, tout en conservant l’infinitif français qui respecte son caractère de maxime elliptique.
  naturalness: « Tout cela » est plus idiomatique que « Ces choses » en français moderne. « À travers nous » rend de façon naturelle le ἐν ἡμῖν condensé, sans expliciter davantage que nécessaire. « Ne s’enfle d’orgueil » conserve l’image paulinienne et s’intègre correctement à la subordonnée finale.
  terminology: « Frères et sœurs » est recevable en français contemporain pour le groupe visé, avec une note signalant le masculin grec. « Ce qui est écrit » préserve l’indétermination du référent. « S’enfle d’orgueil » maintient l’imagerie de φυσιοῦσθε mieux que la formulation au futur « se gonflera ».
  issues:
  - severity: medium
    issue: « à cause de vous » pour δι’ ὑμᾶς
    rationale: En contexte, Paul décrit une transposition faite au bénéfice des Corinthiens (« pour vous »), non un motif causal potentiellement négatif ou neutre (« à cause de vous »).
  - severity: low
    issue: « cette règle » ajoute une catégorisation
    rationale: τό introduit le contenu à apprendre, mais ne désigne pas explicitement une règle. « Ceci » respecte mieux l’ellipse et l’ambiguïté possible d’une maxime.
  - severity: low
    issue: « se gonflera d’orgueil » est au futur indicatif
    rationale: 'La seconde proposition en ἵνα appelle naturellement en français un subjonctif : « afin qu’aucun… ne s’enfle d’orgueil ».'
