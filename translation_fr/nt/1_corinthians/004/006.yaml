source:
  edition: SBLGNT
  text: Ταῦτα δέ, ἀδελφοί, μετεσχημάτισα εἰς ἐμαυτὸν καὶ ⸀Ἀπολλῶν δι’ ὑμᾶς, ἵνα ἐν ἡμῖν μάθητε τό· Μὴ ὑπὲρ ⸀ἃ ⸀γέγραπται, ἵνα μὴ εἷς ὑπὲρ τοῦ ἑνὸς φυσιοῦσθε κατὰ τοῦ ἑτέρου.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/006.yaml
  text: 'These things, brothers, I have applied to myself and Apollos for your sake, so that in us you may learn this: “Do not go beyond what is written,” so that none of you may be puffed up in favor of one against another.'
translation:
  language: fr
  text: 'Tout cela, frères et sœurs[a], je l’ai appliqué à moi-même et à Apollos pour vous, afin que vous appreniez à travers nous ceci : « Ne pas aller au-delà de ce qui est écrit »[b], afin qu’aucun de vous ne s’enfle d’orgueil pour l’un contre l’autre.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « frères » ; en grec, ce terme au pluriel peut s’adresser à un groupe comprenant des hommes et des femmes.
    reason: cultural_note
  - marker: b
    text: 'Le grec est elliptique, littéralement : « le “pas au-delà de ce qui est écrit” ». Il peut s’agir d’une maxime ou d’une formule connue.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτα
  choice: Ces choses
  rationale: Le démonstratif pluriel renvoie à l’ensemble de l’argument précédent et conserve cette portée rétrospective.
- source_word: ἀδελφοί
  choice: frères et sœurs
  rationale: Dans ce vocatif collectif, le masculin pluriel grec s’adresse aux croyants de Corinthe, hommes et femmes; la formulation française explicite naturellement cette portée.
- source_word: μετεσχημάτισα εἰς ἐμαυτὸν καὶ Ἀπολλῶν
  choice: je les ai appliquées à moi-même et à Apollos
  rationale: Le verbe décrit une transposition rhétorique de l’exposé précédent à Paul et Apollos; « appliquées » est clair sans effacer l’idée de transfert.
- source_word: δι’ ὑμᾶς
  choice: à cause de vous
  rationale: La préposition avec l’accusatif peut exprimer ici le motif ou l’intérêt des destinataires. Cette traduction conserve une certaine ouverture, là où « pour votre bien » préciserait davantage la valeur bénéficiaire.
- source_word: ἵνα ἐν ἡμῖν μάθητε
  choice: afin qu’à travers notre exemple vous appreniez
  rationale: Le grec est condensé; Paul et Apollos constituent l’exemple concret au moyen duquel les Corinthiens doivent apprendre.
- source_word: τό· Μὴ ὑπὲρ ἃ γέγραπται
  choice: 'cette règle : « Ne pas aller au-delà de ce qui est écrit »'
  rationale: La tournure grecque est elliptique. L’infinitif français préserve l’absence de verbe impératif explicite tout en rendant la maxime intelligible.
- source_word: φυσιοῦσθε
  choice: se gonflera d’orgueil
  rationale: Cette expression conserve l’image paulinienne du gonflement tout en en indiquant clairement le sens figuré.
- source_word: ὑπὲρ τοῦ ἑνὸς ... κατὰ τοῦ ἑτέρου
  choice: en prenant parti pour l’un contre l’autre
  rationale: La formulation rend le contraste partisan caractéristique du contexte des factions corinthiennes.
theological_decisions:
- issue: Sens de la formule elliptique τό· Μὴ ὑπὲρ ἃ γέγραπται
  choice: 'La présenter comme une règle elliptique : « Ne pas aller au-delà de ce qui est écrit ».'
  alternative: 'La transformer en impératif explicite : « N’allez pas au-delà de ce qui est écrit. »'
  rationale: Le texte grec ne comporte pas de verbe impératif exprimé. L’infinitif français communique la portée admonitrice sans résoudre entièrement l’ellipse ni déterminer si la formule est une maxime déjà connue.
- issue: Référent de ἃ γέγραπται
  choice: Conserver la formule générale « ce qui est écrit ».
  alternative: Préciser « les Écritures » ou identifier des citations particulières.
  rationale: Bien que la formule puisse viser les textes scripturaires cités dans le contexte, le verset ne précise pas lui-même son étendue; la traduction évite donc d’en fixer le référent.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase garde la structure argumentative de Paul, mais explicite légèrement « en nous » par « à travers notre exemple ». L’image de l’orgueil qui enfle est conservée sous une forme idiomatique.
