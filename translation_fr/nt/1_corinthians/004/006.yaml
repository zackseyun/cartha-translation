revisions:
- from: 'Ces choses, frères et sœurs[a], je les ai appliquées à moi-même et à Apollos à cause de vous, afin qu’à travers notre exemple vous appreniez cette règle : « Ne pas aller au-delà de ce qui est écrit »[b]. Ainsi, aucun de vous ne se gonflera d’orgueil en prenant parti pour l’un contre l’autre.'
  to: 'Tout cela, frères et sœurs[a], je l’ai appliqué à moi-même et à Apollos pour vous, afin que vous appreniez à travers nous ceci : « Ne pas aller au-delà de ce qui est écrit »[b], afin qu’aucun de vous ne s’enfle d’orgueil pour l’un contre l’autre.'
  rationale: La correction améliore la fidélité contextuelle de δι’ ὑμᾶς et la syntaxe française de la seconde proposition finale. Elle maintient la portée générale de « ce qui est écrit » et l’ellipse délibérée de la formule, sans imposer un impératif explicite ni un référent doctrinal précis.
