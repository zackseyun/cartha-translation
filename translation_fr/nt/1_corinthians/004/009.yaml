reference: 1 Corinthians 4:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: δοκῶ ⸀γάρ, ὁ θεὸς ἡμᾶς τοὺς ἀποστόλους ἐσχάτους ἀπέδειξεν ὡς ἐπιθανατίους, ὅτι θέατρον ἐγενήθημεν τῷ κόσμῳ καὶ ἀγγέλοις καὶ ἀνθρώποις.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/009.yaml
  text: For it seems to me that God has displayed us[a], the apostles, last of all, like men sentenced to death, because we have become a spectacle to the world[c][b], both to angels and to men.
translation:
  language: fr
  text: Car il me semble que Dieu nous a exposés, nous les apôtres, comme les derniers de tous, comme des condamnés à mort[a], puisque nous sommes devenus un spectacle[b] pour le monde, pour les anges comme pour les êtres humains.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « comme des êtres voués à la mort ». Le terme grec désigne des personnes destinées à mourir, probablement avec l’image de condamnés exhibés publiquement.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « un théâtre » ; ici, le mot désigne ce qui est publiquement offert aux regards.
    reason: lexical_alternative
lexical_decisions:
- source_word: δοκῶ γάρ
  choice: Car il me semble
  rationale: Rend l’appréciation personnelle de Paul et conserve le lien explicatif marqué par γάρ.
- source_word: ἡμᾶς τοὺς ἀποστόλους
  choice: nous, les apôtres
  rationale: Préserve l’apposition grecque, qui identifie explicitement le groupe auquel Paul appartient.
- source_word: ἐσχάτους ἀπέδειξεν
  choice: nous a exposés […] en tout dernier
  rationale: « Exposés » exprime la présentation publique suggérée par le contexte, tandis que « en tout dernier » conserve la place finale et dépréciée des apôtres dans l’image.
- source_word: ὡς ἐπιθανατίους
  choice: comme des condamnés à mort
  rationale: Exprime naturellement le sort de personnes destinées à mourir, probablement dans le cadre imagé d’une exhibition publique.
- source_word: θέατρον ἐγενήθημεν
  choice: nous sommes devenus un spectacle
  rationale: Rend le sens idiomatique de θέατρον comme spectacle offert aux regards, sans réduire le terme au bâtiment théâtral.
- source_word: τῷ κόσμῳ καὶ ἀγγέλοις καὶ ἀνθρώποις
  choice: pour le monde, pour les anges comme pour les êtres humains
  rationale: Présente clairement l’auditoire cosmique et explicite le contraste entre êtres angéliques et humains, sans employer « hommes » dans un sens potentiellement ambigu.
theological_decisions:
- issue: Sens de ἀγγέλοις
  choice: « anges » désigne les êtres angéliques qui assistent au spectacle
  alternative: Le mot peut, dans certains contextes, désigner des messagers humains.
  rationale: Son association ici avec « le monde » et « les êtres humains » favorise nettement le sens d’êtres célestes, sans préciser leur disposition morale.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve l’image publique et dramatique du grec, ainsi que l’étendue cosmique des spectateurs.
