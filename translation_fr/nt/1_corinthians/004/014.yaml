  text: Οὐκ ἐντρέπων ὑμᾶς γράφω ταῦτα, ἀλλ’ ὡς τέκνα μου ἀγαπητὰ ⸀νουθετῶν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/014.yaml
  text: I am not writing these things to shame you[b][a], but admonishing you as my beloved children.
translation:
  language: fr
  text: Je ne vous écris pas cela pour vous faire honte[a], mais je vous avertis[b] comme mes enfants bien-aimés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « pour vous couvrir de honte ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « je vous reprends » ; le terme grec peut désigner une mise en garde accompagnée d’une instruction corrective.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐντρέπων
  choice: pour vous faire honte
  rationale: Avec la négation, le participe exprime ici naturellement le but ou l’intention écartée par Paul. « Faire honte » conserve la dimension sociale et morale du verbe sans l’affaiblir en simple embarras.
- source_word: γράφω ταῦτα
  choice: je vous écris cela
  rationale: Le présent convient à l’acte d’écrire en cours. En français courant, le démonstratif singulier collectif « cela » reprend naturellement les propos précédents, même si le grec emploie le pluriel ταῦτα.
- source_word: ἀλλ’
  choice: mais
  rationale: Cette conjonction marque clairement le contraste entre l’intention que Paul nie et le but pastoral qu’il affirme.
- source_word: ὡς
  choice: comme
  rationale: « Comme » garde la formulation relationnelle simple du grec sans préciser davantage si l’accent porte sur la qualité, la manière ou la relation.
- source_word: τέκνα μου ἀγαπητὰ
  choice: mes enfants bien-aimés
  rationale: τέκνα est inclusif et exprime une relation filiale. « Bien-aimés » préserve la chaleur affective et le registre digne de ἀγαπητά.
- source_word: νουθετῶν
  choice: je vous avertis
  rationale: Le verbe associe mise en garde, instruction morale et correction. « Avertir » est naturel en français moderne et conserve la force corrective sans donner au propos une tonalité punitive excessive.
theological_decisions:
- issue: Tonalité pastorale de la correction de Paul
  choice: je vous avertis comme mes enfants bien-aimés
  alternative: je vous reprends comme mes enfants bien-aimés
  rationale: La négation de l’intention de faire honte, suivie de νουθετῶν, situe la correction dans une relation d’affection parentale. « Avertis » maintient à la fois la mise en garde et la tendresse, sans réduire le verbe à un simple conseil ni durcir le passage en condamnation.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase explicite le contraste par deux propositions verbales coordonnées, tout en conservant la relation affectueuse exprimée par « mes enfants bien-aimés ».
