id: 1CO.4.1
reference: 1 Corinthians 4:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Οὕτως ἡμᾶς λογιζέσθω ἄνθρωπος ὡς ὑπηρέτας Χριστοῦ καὶ οἰκονόμους μυστηρίων θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/001.yaml
  text: 'This is how a person should regard us: as servants of Messiah and stewards of the mysteries of God[a][b].'
translation:
  language: fr
  text: 'Que chacun nous considère ainsi : comme des serviteurs du Messie[a] et des intendants des mystères de Dieu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Christ ». Le grec Χριστός est ici rendu par « Messie » en tant que titre.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὕτως
  choice: ainsi
  rationale: 'Reprend naturellement en français l’idée de manière exprimée par l’adverbe démonstratif : c’est de cette façon qu’il faut les considérer.'
- source_word: λογιζέσθω
  choice: considère
  rationale: L’impératif présent exprime ici la manière normative dont Paul et ses collaborateurs doivent être tenus ou regardés ; « considère » est idiomatique et garde la force injonctive.
- source_word: ἄνθρωπος
  choice: chacun
  rationale: Dans ce contexte, le singulier a une portée générique. « Chacun » exprime clairement toute personne sans introduire une restriction masculine absente du sens.
- source_word: ὑπηρέτας
  choice: serviteurs
  rationale: Le terme désigne des personnes placées au service d’un supérieur, sans porter nécessairement la notion d’esclavage associée à δοῦλος.
- source_word: Χριστοῦ
  choice: du Messie
  rationale: Χριστός garde ici sa valeur de titre désignant l’oint de Dieu ; « Messie » rend explicitement cette valeur, tandis que « Christ » demeure une traduction traditionnelle possible.
- source_word: οἰκονόμους
  choice: intendants
  rationale: Le mot désigne des gestionnaires auxquels un maître confie l’administration de ses biens ; « intendants » conserve l’image de la responsabilité déléguée.
- source_word: μυστηρίων
  choice: des mystères
  rationale: Conserve le terme paulinien pour les réalités divines autrefois cachées et désormais communiquées, sans explicitation interprétative dans le texte.
- source_word: θεοῦ
  choice: de Dieu
  rationale: Le génitif rattache les mystères à Dieu, qui en est le détenteur et la source.
theological_decisions:
- issue: Valeur de Χριστοῦ
  choice: du Messie
  alternative: du Christ
  rationale: Le contexte présente celui que servent Paul et ses collaborateurs, et le titre grec peut garder sa force royale et messianique. Une note conserve l’autre rendu français établi sans faire disparaître cette nuance.
- issue: Portée générique de ἄνθρωπος
  choice: chacun
  alternative: une personne
  rationale: Le référent est indéfini et générique, non un homme par opposition à une femme. « Chacun » est naturel, concis et conforme à cette portée.
translation_notes:
  register: Français international moderne, sobre et digne. La construction « Que chacun… » rend directement l’impératif grec ; « intendants » maintient la métaphore de la gestion confiée sans archaïsme excessif.
