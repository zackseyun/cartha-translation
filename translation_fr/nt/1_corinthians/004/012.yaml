source:
  edition: SBLGNT
  text: καὶ κοπιῶμεν ἐργαζόμενοι ταῖς ἰδίαις χερσίν· λοιδορούμενοι εὐλογοῦμεν, διωκόμενοι ἀνεχόμεθα,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/012.yaml
  text: and we labor[a], working with our own hands. When insulted, we bless; when persecuted, we endure;
translation:
  language: fr
  text: et nous nous donnons de la peine en travaillant de nos propres mains. Insultés, nous bénissons ; persécutés, nous le supportons ;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κοπιῶμεν
  choice: nous nous donnons de la peine
  rationale: Exprime un travail pénible et fatigant, davantage que le simple fait de travailler, dans un français moderne et naturel.
- source_word: ἐργαζόμενοι
  choice: en travaillant
  rationale: Le participe précise comment s’accomplit cet effort, sans ajouter l’idée non exprimée de gagner sa vie.
- source_word: ταῖς ἰδίαις χερσίν
  choice: de nos propres mains
  rationale: Conserve l’insistance de ἰδίαις sur le travail manuel accompli personnellement.
- source_word: λοιδορούμενοι
  choice: Insultés
  rationale: Rend clairement le participe passif désignant les outrages verbaux, tout en préservant la construction concise de la série.
- source_word: εὐλογοῦμεν
  choice: nous bénissons
  rationale: Maintient le terme biblique et l’opposition entre l’insulte reçue et la bénédiction donnée.
- source_word: διωκόμενοι
  choice: persécutés
  rationale: Dans ce contexte paulinien, le terme désigne un traitement hostile plutôt qu’une simple poursuite.
- source_word: ἀνεχόμεθα
  choice: nous supportons
  rationale: Rend l’idée de tenir face au mauvais traitement sans introduire de complément d’objet absent du grec.
theological_decisions:
- issue: Réponse éthique aux mauvais traitements
  choice: 'Le texte décrit la conduite des apôtres : ils bénissent quand ils sont insultés et supportent la persécution.'
  alternative: Formuler ces réactions comme des commandements généraux adressés aux lecteurs.
  rationale: Les verbes sont à la première personne du pluriel et décrivent ici la pratique apostolique ; la traduction en conserve la portée éthique sans transformer la déclaration en injonction.
translation_notes:
  register: Français international moderne, digne et accessible. La succession brève des participes et des verbes principaux est conservée. « Nous nous donnons de la peine » évite l’ambiguïté moderne de « travailler » seul et exprime l’effort pénible de κοπιάω ; « supportons » demeure volontairement sans objet explicite, comme dans le grec.
