- from: C’est pourquoi je vous ai envoyé Timothée, qui est mon enfant bien-aimé et fidèle dans le Seigneur[a]. Il vous rappellera mes voies en Jésus le Messie[b], comme je les enseigne partout, dans chaque assemblée.
  to: C’est pourquoi je vous ai envoyé Timothée, qui est mon enfant bien-aimé et fidèle dans le Seigneur[a]. Il vous rappellera mes voies dans le Messie Jésus[b], comme j’enseigne partout, dans chaque assemblée.
  rationale: La révision préserve l’ambiguïté syntaxique du grec dans la dernière proposition, emploie une construction française plus directement calquée sur « en Christ Jésus » tout en gardant « Messie », et limite la note sur τέκνον à l’alternative lexicale pertinente.
