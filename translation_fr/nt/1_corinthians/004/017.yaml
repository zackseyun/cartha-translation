id: 1CO.4.17
reference: 1 Corinthians 4:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: διὰ τοῦτο ἔπεμψα ὑμῖν Τιμόθεον, ὅς ἐστίν ⸂μου τέκνον⸃ ἀγαπητὸν καὶ πιστὸν ἐν κυρίῳ, ὃς ὑμᾶς ἀναμνήσει τὰς ὁδούς μου τὰς ἐν Χριστῷ ⸀Ἰησοῦ, καθὼς πανταχοῦ ἐν πάσῃ ἐκκλησίᾳ διδάσκω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/017.yaml
  text: For this reason I sent Timothy to you[a], who is my beloved and faithful child in the Lord. He will remind you of my ways in Messiah Jesus[b], just as I teach everywhere in every church.
translation:
  language: fr
  text: C’est pourquoi je vous ai envoyé Timothée, qui est mon enfant bien-aimé et fidèle dans le Seigneur[a]. Il vous rappellera mes voies dans le Messie Jésus[b], comme j’enseigne partout, dans chaque assemblée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « mon fils bien-aimé et fidèle dans le Seigneur ». Le grec τέκνον signifie plus littéralement « enfant », mais peut se rendre ici par « fils ».
    reason: lexical_alternative
  - marker: b
    text: Ou « en Jésus-Christ » ou « dans le Christ Jésus ». Le grec Χριστός est rendu ici par le titre « Messie ».
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: C’est pourquoi
  rationale: Cette tournure naturelle conserve le lien causal avec l’argument précédent.
- source_word: ἔπεμψα
  choice: je vous ai envoyé
  rationale: Le passé composé convient naturellement en français à cet acte passé dont les conséquences concernent les destinataires.
- source_word: Τιμόθεον
  choice: Timothée
  rationale: Forme française traditionnelle du nom propre grec.
- source_word: τέκνον
  choice: enfant
  rationale: Le mot grec désigne littéralement un enfant sans préciser le sexe et préserve ici la métaphore familiale de Paul.
- source_word: ἀγαπητὸν καὶ πιστὸν
  choice: bien-aimé et fidèle
  rationale: Cette formulation garde à la fois l’affection de Paul et l’idée de fiabilité dans le service.
- source_word: ἐν κυρίῳ
  choice: dans le Seigneur
  rationale: Formule paulinienne indiquant la relation de Timothée au Seigneur et la sphère de sa vie et de son service.
- source_word: ἀναμνήσει
  choice: rappellera
  rationale: Le futur exprime directement la mission que Timothée accomplira auprès des Corinthiens.
- source_word: τὰς ὁδούς μου
  choice: mes voies
  rationale: Le choix conserve la métaphore grecque et sa portée large, qui englobe la conduite et l’enseignement de Paul.
- source_word: τὰς ἐν Χριστῷ Ἰησοῦ
  choice: en Jésus le Messie
  rationale: L’ordre français naturel place le nom Jésus avant le titre Messie, tout en conservant la valeur titulaire de Χριστός.
- source_word: καθὼς
  choice: comme
  rationale: Introduit simplement la correspondance entre le rappel confié à Timothée et l’enseignement habituel de Paul.
- source_word: πανταχοῦ ἐν πάσῃ ἐκκλησίᾳ
  choice: partout, dans chaque assemblée
  rationale: La formulation maintient distinctement l’étendue géographique et la référence distributive à chaque communauté réunie.
theological_decisions:
- issue: Rendu de Χριστός dans ἐν Χριστῷ Ἰησοῦ
  choice: Jésus le Messie
  alternative: Jésus-Christ / le Christ Jésus
  rationale: Χριστός conserve ici sa valeur de titre. « Jésus le Messie » en exprime le sens tout en respectant la syntaxe naturelle du français.
- issue: Sens de « mes voies »
  choice: Conserver la métaphore pour les manières de vivre, de servir et d’enseigner de Paul en Jésus le Messie
  alternative: ma conduite / ma manière de vivre
  rationale: Dans le contexte, ὁδοί ne désigne pas des itinéraires, mais le modèle apostolique de Paul. La métaphore demeure intelligible en français et évite d’en réduire la portée.
- issue: Référent de ἐν κυρίῳ
  choice: La relation et la fidélité de Timothée dans le Seigneur
  alternative: Limiter l’expression au seul adjectif « fidèle »
  rationale: La place de l’expression permet de l’entendre comme qualifiant l’ensemble de la description de Timothée; la traduction conserve cette portée sans la préciser davantage.
translation_notes:
  register: Français international moderne, naturel et digne. « Enfant bien-aimé », « mes voies » et « dans le Seigneur » maintiennent les métaphores et formulations pauliniennes sans lourdeur excessive. « Assemblée » rend ἐκκλησία comme communauté réunie tout en évitant de présupposer une structure institutionnelle précise.
