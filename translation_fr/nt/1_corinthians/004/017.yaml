    rationale: Le grec dit littéralement « comme j’enseigne partout dans chaque assemblée », sans objet exprimé pour « j’enseigne ». Le pronom français impose plus directement que les « voies » sont l’objet enseigné. Supprimer le pronom conserve l’ellipse et la souplesse du texte source.
  - severity: low
    issue: 'Note a : « fils spirituel »'
    rationale: La note peut signaler l’alternative « fils » en contexte, mais « spirituel » est une explicitation interprétative non requise par τέκνον.
