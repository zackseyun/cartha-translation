  text: ἐλεύσομαι δὲ ταχέως πρὸς ὑμᾶς, ἐὰν ὁ κύριος θελήσῃ, καὶ γνώσομαι οὐ τὸν λόγον τῶν πεφυσιωμένων ἀλλὰ τὴν δύναμιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/019.yaml
  text: But I will come to you soon[a], if the Lord wills, and I will find out not the speech of those who are puffed up[b], but the power.
translation:
  language: fr
  text: Mais je viendrai bientôt chez vous, si le Seigneur le veut, et je découvrirai non pas les paroles de ceux qui sont gonflés d’orgueil[a], mais leur puissance.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression grecque conserve l’image de personnes « gonflées », c’est-à-dire enflées d’orgueil; Paul emploie plusieurs fois ce terme dans cette lettre.
    reason: Métaphore et emploi récurrent dans l’épître.
lexical_decisions:
- source_word: ἐλεύσομαι δὲ ταχέως πρὸς ὑμᾶς
  choice: Mais je viendrai bientôt chez vous
  rationale: Le futur est rendu simplement; δέ marque le contraste, ταχέως indique ici la proximité temporelle, et πρὸς ὑμᾶς le mouvement vers les Corinthiens.
- source_word: ἐὰν ὁ κύριος θελήσῃ
  choice: si le Seigneur le veut
  rationale: Formulation française naturelle qui conserve la condition et la référence non précisée au Seigneur.
- source_word: γνώσομαι
  choice: je verrai
  rationale: Dans le contexte d’une visite, le futur de γινώσκω exprime l’idée de constater ou de découvrir personnellement; « je verrai » est idiomatique sans surinterpréter.
- source_word: οὐ τὸν λόγον
  choice: non pas ce que disent
  rationale: λόγος désigne ici les paroles ou le discours, mis en contraste avec la puissance. Cette formulation est claire en français moderne et évite le peu naturel « non pas la parole de ceux ».
- source_word: τῶν πεφυσιωμένων
  choice: ceux qui se sont gonflés d’orgueil
  rationale: Le parfait passif exprime un état durable; la formulation conserve l’image paulinienne de l’enflure tout en en explicitant la dimension d’orgueil.
- source_word: ἀλλὰ τὴν δύναμιν
  choice: mais quelle est leur puissance
  rationale: Le possessif est implicite dans la construction parallèle. « Puissance » préserve l’ampleur sémantique de δύναμις sans la réduire aux miracles, à l’autorité ou à l’efficacité.
theological_decisions:
- issue: Référent de « le Seigneur »
  choice: le Seigneur
  alternative: le Seigneur Jésus; Dieu
  rationale: Le grec dit seulement ὁ κύριος. La traduction ne précise donc pas davantage le référent.
- issue: Nature de la « puissance » opposée aux paroles
  choice: Conserver le terme général « puissance »
  alternative: puissance miraculeuse; autorité apostolique; efficacité réelle
  rationale: Le contexte oppose les prétentions verbales à la réalité de la puissance, mais ne demande pas de limiter celle-ci à une manifestation particulière.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe privilégie une formulation naturelle tout en conservant le contraste serré entre les paroles et la puissance.
