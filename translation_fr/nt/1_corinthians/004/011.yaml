id: 1CO.4.11
reference: 1 Corinthians 4:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἄχρι τῆς ἄρτι ὥρας καὶ πεινῶμεν καὶ διψῶμεν καὶ γυμνιτεύομεν καὶ κολαφιζόμεθα καὶ ἀστατοῦμεν
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/011.yaml
  text: Up to this present hour we are hungry and thirsty[a], and poorly clothed, and beaten[c][b], and homeless.
translation:
  language: fr
  text: Jusqu’à cette heure même[a], nous avons faim et soif, nous sommes mal vêtus[b], nous sommes frappés et nous vivons sans demeure fixe[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Jusqu’à l’heure présente. »'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « nous sommes nus » ; le grec peut désigner le fait d’être insuffisamment vêtu plutôt que totalement nu.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « nous errons » ou « nous n’avons pas de domicile stable ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄχρι τῆς ἄρτι ὥρας
  choice: Jusqu’à cette heure même
  rationale: Cette expression temporelle indique que la situation dure jusqu’au moment présent. « Cette heure même » conserve l’insistance de ἄρτι et la formulation concrète de ὥρα dans un français naturel.
- source_word: πεινῶμεν
  choice: nous avons faim
  rationale: Le présent décrit une privation qui se prolonge. « Avoir faim » est l’expression française courante et directe.
- source_word: διψῶμεν
  choice: soif
  rationale: Coordonné à « faim », le nom s’intègre naturellement à l’expression elliptique « nous avons faim et soif » sans affaiblir l’idée de privation continue.
- source_word: γυμνιτεύομεν
  choice: nous sommes mal vêtus
  rationale: Le verbe peut désigner le manque de vêtements convenables ou suffisants, sans impliquer nécessairement une nudité complète.
- source_word: κολαφιζόμεθα
  choice: nous sommes frappés
  rationale: Le passif présent évoque des coups subis de manière répétée. « Frappés » reste concret sans restreindre indûment le geste à une forme particulière de coup.
- source_word: ἀστατοῦμεν
  choice: nous vivons sans demeure fixe
  rationale: Le verbe exprime l’absence de lieu stable où demeurer et possiblement une vie errante. Cette formulation conserve cette instabilité sans imposer toutes les connotations sociales modernes de « sans-abri ».
- source_word: καὶ … καὶ … καὶ …
  choice: et … et …, …, … et …
  rationale: La coordination française conserve l’effet cumulatif de l’énumération grecque, tout en évitant une répétition de « et » qui semblerait artificielle en français moderne.
theological_decisions:
- issue: Nature de la description que Paul donne des apôtres
  choice: Une énumération concrète de privations et de mauvais traitements qui se prolongent
  alternative: Une description principalement rhétorique ou hyperbolique
  rationale: Les présents de l’indicatif exposent directement des épreuves en cours. La traduction ne réduit pas ces souffrances à une simple figure de style et ne les amplifie pas non plus.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe demeure accessible et garde le rythme cumulatif des épreuves, sans archaïsme ni vocabulaire confessionnel.
