source:
  edition: SBLGNT
  text: ἐὰν γὰρ μυρίους παιδαγωγοὺς ἔχητε ἐν Χριστῷ, ἀλλ’ οὐ πολλοὺς πατέρας, ἐν γὰρ Χριστῷ Ἰησοῦ διὰ τοῦ εὐαγγελίου ἐγὼ ὑμᾶς ἐγέννησα.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/015.yaml
  text: For even if you have countless guardians in Messiah[a], yet not many fathers; for in Messiah Jesus, through the gospel[d][c][b], I became your father.
translation:
  language: fr
  text: 'Car même si vous avez dix mille accompagnateurs[a] dans le Messie, vous n’avez pas beaucoup de pères : c’est en effet dans le Messie Jésus que, par la bonne nouvelle, moi, je vous ai engendrés[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec désigne un homme chargé d’accompagner, de surveiller et d’encadrer un enfant; il ne s’agissait pas principalement d’un enseignant.
    reason: cultural_note
  - marker: b
    text: 'Littéralement : « je vous ai engendrés ». Cette image exprime le rôle de Paul lorsqu’ils sont venus à la foi par la bonne nouvelle.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μυρίους
  choice: dix mille
  rationale: Le sens numérique concret reste naturel en français et conserve l’hyperbole rhétorique; le contraste avec « pas beaucoup de pères » en fait clairement comprendre la portée.
- source_word: παιδαγωγοὺς
  choice: accompagnateurs
  rationale: Dans le monde gréco-romain, le παιδαγωγός surveillait et encadrait un enfant sans être principalement son enseignant. « Accompagnateurs » évite le faux sens moderne de « professeurs », tandis que la note précise la fonction historique.
- source_word: ἐν Χριστῷ
  choice: dans le Messie
  rationale: Cette formulation conserve la préposition paulinienne et rend Χριστός comme un titre, « Messie », plutôt que comme un simple nom propre.
- source_word: πατέρας
  choice: pères
  rationale: La métaphore paternelle explicite est conservée sans ajout interprétatif tel que « spirituels ».
- source_word: διὰ τοῦ εὐαγγελίου
  choice: par la bonne nouvelle
  rationale: διά avec le génitif indique ici le moyen; « par » est idiomatique, et « bonne nouvelle » rend le contenu lexical de εὐαγγέλιον dans un français courant.
- source_word: ἐγέννησα
  choice: vous ai engendrés
  rationale: Le verbe français conserve directement la métaphore de la génération qui explique la mention des pères, tout en restant compréhensible dans un registre digne.
theological_decisions:
- issue: Métaphore de la paternité de Paul
  choice: « c’est moi qui… vous ai engendrés »
  alternative: « je suis devenu votre père » ou « je suis votre père spirituel »
  rationale: La formulation garde l’image forte du grec et le rôle particulier de Paul dans leur venue à la foi par la bonne nouvelle, sans expliciter une doctrine sacramentelle, cléricale ou institutionnelle absente du texte.
- issue: Portée de ἐν Χριστῷ / ἐν Χριστῷ Ἰησοῦ
  choice: « dans le Messie / dans le Messie Jésus »
  alternative: « en Christ / en Jésus-Christ »
  rationale: « Dans » préserve la formulation relationnelle ou sphérique de Paul, sans trancher davantage sa portée théologique; « Messie » maintient la valeur titulaire de Χριστός.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe met en relief « c’est moi » pour rendre le pronom grec emphatique ἐγώ. L’image d’engendrement est maintenue dans le texte plutôt que remplacée par une paraphrase.
