source:
  edition: SBLGNT
  text: τίς γάρ σε διακρίνει; τί δὲ ἔχεις ὃ οὐκ ἔλαβες; εἰ δὲ καὶ ἔλαβες, τί καυχᾶσαι ὡς μὴ λαβών;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/007.yaml
  text: For who makes you different? And what do you have that you did not receive? And if you did receive it[a], why do you boast as if you had not received it?
translation:
  language: fr
  text: En effet, qui te rend différent des autres[a] ? Et qu’as-tu que tu n’aies reçu ? Et si tu l’as effectivement reçu, pourquoi t’en vantes-tu comme si tu ne l’avais pas reçu ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Qui établit une différence entre toi et les autres ? » Le verbe grec peut signifier « distinguer », « différencier » ou « rendre distinct ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τίς γάρ σε διακρίνει
  choice: En effet, qui te distingue des autres ?
  rationale: « En effet » rend la valeur explicative de γάρ. Le verbe διακρίνω, transitif ici, évoque le fait d’établir une distinction ou de rendre différent. L’ajout « des autres » explicite en français la comparaison implicite sans préciser la nature de cette distinction.
- source_word: τί δὲ ἔχεις
  choice: Et qu’as-tu
  rationale: Le δέ est légèrement connectif dans cette suite de questions rhétoriques ; « Et » en reproduit naturellement l’enchaînement.
- source_word: ὃ οὐκ ἔλαβες
  choice: que tu n’aies reçu
  rationale: Le subjonctif est naturel en français après cette interrogation portant sur une chose indéfinie. Le passé composé exprime ici de façon idiomatique l’acte accompli de recevoir.
- source_word: εἰ δὲ καὶ ἔλαβες
  choice: Et si tu l’as bel et bien reçu
  rationale: « Si » conserve la forme conditionnelle de εἰ, tandis que « bel et bien » fait ressortir l’insistance de καί. Le pronom « l’ » reprend naturellement ce que la personne possède.
- source_word: τί καυχᾶσαι
  choice: pourquoi t’en vantes-tu
  rationale: « Se vanter » exprime en français courant et digne l’attitude de vantardise dénoncée par le verbe καυχάομαι ; « en » renvoie à ce qui a été reçu.
- source_word: ὡς μὴ λαβών
  choice: comme si tu ne l’avais pas reçu
  rationale: 'Cette formulation rend naturellement la manière contraire aux faits exprimée par ὡς avec le participe négatif : la personne se comporte comme si elle n’était pas bénéficiaire de ce qu’elle possède.'
theological_decisions:
- issue: Portée de la distinction et de ce qui a été reçu
  choice: 'La formulation reste générale : toute distinction ou tout bien évoqué est reçu plutôt qu’issu de soi-même.'
  alternative: Limiter le propos aux dons spirituels et aux fonctions de ministère, ou l’étendre explicitement à toute capacité, tout statut et toute bénédiction.
  rationale: Le contexte immédiat concerne le ministère apostolique, les partis et l’orgueil, mais les termes du verset sont généraux. La traduction n’en restreint ni n’en élargit artificiellement la portée.
- issue: Agent de la distinction
  choice: La question « qui te distingue » conserve l’interrogatif personnel τίς sans nommer explicitement Dieu ni attribuer la distinction à la personne elle-même.
  alternative: Traduire dans le sens de « qu’est-ce qui te rend supérieur ? » ou préciser que Dieu établit la distinction.
  rationale: Le grec demande littéralement « qui ? » et laisse à la question rhétorique sa force ainsi que son degré d’implicite. Nommer l’agent ou parler directement de supériorité résoudrait plus que le texte ne le fait.
translation_notes:
  register: Français international moderne, naturel et digne. Les questions rhétoriques sont conservées, avec un vocabulaire accessible. « Bel et bien » rend l’insistance sans transformer la condition en affirmation explicite, et la note maintient l’amplitude sémantique de διακρίνω.
