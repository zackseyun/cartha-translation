  text: ὡς μὴ ἐρχομένου δέ μου πρὸς ὑμᾶς ἐφυσιώθησάν τινες·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/018.yaml
  text: Some have become puffed up[b][a], as though I were not coming to you.
translation:
  language: fr
  text: Certains se sont gonflés d’orgueil[a][b], comme si je n’allais pas venir chez vous.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « se sont gonflés » ; l’image évoque une importance excessive que l’on s’attribue.'
    reason: lexical_alternative
  - marker: b
    text: Paul reprend plusieurs fois l’image du gonflement pour parler de l’orgueil dans 1 Corinthiens ; voir 4.6, 4.19 ; 5.2 ; 8.1 ; 13.4.
    reason: cross_reference
lexical_decisions:
- source_word: ὡς
  choice: comme si
  rationale: Cette tournure introduit naturellement en français la supposition erronée sur laquelle repose l’attitude de certains Corinthiens.
- source_word: μὴ ἐρχομένου ... μου πρὸς ὑμᾶς
  choice: je n’allais pas venir chez vous
  rationale: La construction participiale au génitif, dépendante de ὡς, exprime une situation supposée plutôt qu’une affirmation directe. « Je n’allais pas venir » rend clairement cette perspective en français courant.
- source_word: δέ
  choice: —
  rationale: La particule a ici une faible valeur connective; l’enchaînement avec le verset précédent suffit à la rendre sans ajouter un connecteur susceptible de suraccentuer l’opposition.
- source_word: ἐφυσιώθησάν
  choice: se sont enflés d’orgueil
  rationale: Cette formulation conserve l’image récurrente de l’enflure employée par Paul dans 1 Corinthiens, tout en explicitant naturellement en français qu’il s’agit d’orgueil.
- source_word: τινες
  choice: Certains
  rationale: Le mot désigne de manière indéfinie une partie des membres de l’Église; « Certains » est concis et naturel.
theological_decisions:
- issue: Rendu de la critique de l’orgueil chez les Corinthiens
  choice: Conserver la métaphore dans « se sont enflés d’orgueil ».
  alternative: « sont devenus arrogants »
  rationale: La métaphore appartient au vocabulaire rhétorique récurrent de Paul dans cette lettre. La conserver permet au lecteur d’en percevoir la continuité sans réduire le texte à une simple qualification abstraite.
translation_notes:
  register: Français international moderne, naturel et digne. « Comme si je n’allais pas venir » évite l’ambiguïté normative possible de « comme si je ne devais pas venir » et préserve la valeur supposée de la construction grecque.
