  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἤδη κεκορεσμένοι ἐστέ, ἤδη ἐπλουτήσατε, χωρὶς ἡμῶν ἐβασιλεύσατε· καὶ ὄφελόν γε ἐβασιλεύσατε, ἵνα καὶ ἡμεῖς ὑμῖν συμβασιλεύσωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/008.yaml
  text: Already you have had your fill[a]; already you have become rich; apart from us you have become kings. And I wish indeed that you had become kings[c][b], so that we also might reign with you.
translation:
  language: fr
  text: Déjà vous êtes rassasiés ! Déjà vous êtes devenus riches ! Sans nous, vous régnez ! Et si seulement vous régniez, afin que nous aussi nous régnions avec vous ![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Paul parle avec ironie : les Corinthiens se comportent comme s’ils étaient déjà pleinement rassasiés, riches et en train de régner.'
    reason: Cette note signale la tonalité rhétorique que le contexte immédiat rend manifeste, sans surinterpréter le vocabulaire du texte.
lexical_decisions:
- source_word: ἤδη
  choice: Déjà
  rationale: La répétition en tête des deux premières propositions conserve l’insistance temporelle et la force ironique de Paul.
- source_word: κεκορεσμένοι ἐστέ
  choice: vous êtes rassasiés
  rationale: La périphrase au parfait décrit un état présent résultant d’un accomplissement ; « rassasiés » exprime naturellement l’idée d’avoir pleinement de quoi se satisfaire.
- source_word: ἐπλουτήσατε
  choice: vous êtes devenus riches
  rationale: Cette formulation garde la valeur verbale de l’aoriste et fait ressortir le résultat présent revendiqué ironiquement.
- source_word: χωρὶς ἡμῶν
  choice: Sans nous
  rationale: Traduction directe et naturelle qui souligne que les Corinthiens se considèrent comme parvenus à leur position indépendamment des apôtres.
- source_word: ἐβασιλεύσατε
  choice: vous vous êtes mis à régner
  rationale: Le verbe signifie « régner » ; la formulation française conserve l’image royale et rend naturellement l’établissement prétendu de cette situation, sans transformer le verbe en nom.
- source_word: ὄφελόν γε
  choice: Ah ! si seulement
  rationale: Cette tournure française exprime vivement le souhait irréel et rend l’insistance de γε, tout en laissant percevoir que l’ironie ouvre sur un désir réel.
- source_word: ἐβασιλεύσατε
  choice: vous régniez vraiment
  rationale: Dans le souhait irréel, l’imparfait après « si seulement » est idiomatique. « vraiment » explicite sobrement le contraste contextuel entre la prétention ironisée et un règne qui serait réel.
- source_word: ἵνα
  choice: afin que
  rationale: Introduit clairement le but ou le résultat envisagé du souhait.
- source_word: συμβασιλεύσωμεν
  choice: nous régnions avec vous
  rationale: Conserve à la fois l’image royale et le préfixe συν-, qui exprime un règne partagé.
theological_decisions:
- issue: Tonalité des trois premières affirmations
  choice: Les rendre comme des exclamations ironiques.
  alternative: Les présenter comme de simples affirmations ou comme des compliments.
  rationale: Le contexte de 1 Corinthiens 4.7-13 oppose la suffisance des Corinthiens à l’abaissement des apôtres. Les exclamations rendent l’ironie perceptible sans la remplacer par une paraphrase explicative.
- issue: Rapport entre le règne prétendu et le souhait de Paul
  choice: Maintenir à la fois l’ironie et le souhait réel au moyen de « si seulement vous régniez vraiment ».
  alternative: Comprendre tout le souhait comme purement sarcastique, ou affirmer explicitement une réalisation eschatologique déterminée.
  rationale: Le grec permet à l’ironie de se doubler d’un véritable désir. La traduction préserve cette tension sans préciser quand ni comment ce règne s’accomplirait.
- issue: Image du règne
  choice: Conserver le vocabulaire royal de « régner ».
  alternative: Paraphraser par « réussir », « dominer » ou « être arrivés au sommet ».
  rationale: βασιλεύω et συμβασιλεύω portent une image royale importante, possiblement chargée d’une dimension eschatologique, qu’une paraphrase générale affaiblirait.
translation_notes:
  register: Français international moderne, naturel et digne. Les phrases brèves et exclamatives reproduisent la vigueur rhétorique. « Rassasiés », « riches » et « régner » conservent la progression imagée du grec ; la formulation évite tout vocabulaire confessionnel spécialisé.
