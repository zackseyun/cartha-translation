  rationale: La révision supprime les ajouts inchoatifs et l’intensif interprétatif, tout en gardant l’ironie, la répétition de « Déjà », l’imagerie du règne et le souhait de régner avec les Corinthiens. La note culturelle est conservée; la note alternative non justifiée par la forme grecque est retirée.
