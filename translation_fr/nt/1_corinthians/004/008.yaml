    rationale: « Vous vous êtes mis à régner » et la note proposant « commencé à régner » interprètent l’aoriste comme ingressif. Le verbe signifie « régner »; le contexte soutient l’ironie et un état revendiqué, mais n’exige pas l’idée de commencement.
  - severity: low
    issue: Ajout de « vraiment » dans le souhait
    rationale: Le mot n’a pas de correspondant lexical direct. Il est explicatif et peut être supprimé tout en conservant la tension entre l’ironie initiale et le désir réel de Paul.
  - severity: low
    issue: Note a fondée sur une interprétation non nécessaire
    rationale: L’alternative proposée renforce la même nuance inchoative non imposée par le grec; elle n’est donc pas à conserver.
