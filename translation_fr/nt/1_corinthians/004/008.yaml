  source_fidelity: La progression ironique est bien rendue, mais « vous vous êtes mis à régner » et l’alternative « commencé à régner » ajoutent une nuance inchoative que ἐβασιλεύσατε n’impose pas. Dans le souhait, « vraiment » explicite inutilement un contraste que le contexte permet de percevoir sans l’ajouter.
  naturalness: Le français est globalement vivant et moderne. « Et si seulement vous régniez » est plus sobre, plus naturel et plus proche du souhait grec que « Ah ! si seulement vous régniez vraiment ».
  terminology: « Rassasiés », « devenus riches » et « régner avec vous » conservent avec justesse les images et le vocabulaire royal du grec. Le verbe « régner » doit être maintenu sans le transformer en formulation inchoative.
