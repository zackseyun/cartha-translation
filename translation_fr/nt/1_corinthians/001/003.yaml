  text: χάρις ὑμῖν καὶ εἰρήνη ἀπὸ θεοῦ πατρὸς ἡμῶν καὶ κυρίου Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/003.yaml
  text: Grace to you and peace from God our Father and the Lord Jesus the Messiah[a].
translation:
  language: fr
  text: Que la grâce et la paix vous soient accordées de la part de Dieu notre Père et du Seigneur Jésus le Messie[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « du Seigneur Jésus-Christ ».'
    reason: Alternative lexicale traditionnelle pour Ἰησοῦ Χριστοῦ.
lexical_decisions:
- source_word: χάρις
  choice: la grâce
  rationale: « Grâce » conserve à la fois le sens de faveur accordée et la portée théologique habituelle du terme paulinien.
- source_word: ὑμῖν
  choice: vous soient accordées
  rationale: Le datif du destinataire est rendu dans une formule française naturelle de bénédiction; le verbe, sous-entendu en grec, est explicité sans modifier le contenu.
- source_word: εἰρήνη
  choice: la paix
  rationale: « Paix » est le correspondant naturel et maintient les résonances relationnelles et bibliques du terme.
- source_word: ἀπὸ
  choice: de la part de
  rationale: Cette formulation française indique clairement la source de la grâce et de la paix tout en convenant au registre d'une salutation.
- source_word: θεοῦ πατρὸς ἡμῶν
  choice: Dieu notre Père
  rationale: La formulation appositionnelle suit naturellement la construction grecque sans suggérer une coordination absente du texte.
- source_word: κυρίου
  choice: Seigneur
  rationale: « Seigneur » préserve la valeur de titre et la force théologique de κύριος dans ce contexte.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jésus le Messie
  rationale: « Messie » rend le sens du titre Χριστός; l'article est ajouté conformément à l'usage idiomatique du français quand « Messie » suit le nom Jésus.
theological_decisions:
- issue: La grâce et la paix ont-elles une même relation de provenance avec le Père et Jésus ?
  choice: Une seule expression « de la part de » régit à la fois « Dieu notre Père » et « le Seigneur Jésus le Messie ».
  alternative: Répéter « de la part de » devant « le Seigneur Jésus le Messie ».
  rationale: Dans le grec, la même préposition ἀπό régit les deux termes coordonnés. La traduction conserve cette coordination sans l'atténuer ni en tirer une explication doctrinale supplémentaire.
- issue: Valeur de Χριστός dans la formule de salutation
  choice: le Messie
  alternative: Christ
  rationale: La traduction principale rend le sens du titre grec, tandis que la forme française traditionnelle « Christ » est signalée en note afin de préserver l'alternative lexicale et liturgique.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure optative « Que… soient accordées » restitue naturellement la bénédiction exprimée par la phrase nominale grecque; « de la part de » maintient explicitement l'idée de provenance.
