id: 1CO.1.26
reference: 1 Corinthians 1:26
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Βλέπετε γὰρ τὴν κλῆσιν ὑμῶν, ἀδελφοί, ὅτι οὐ πολλοὶ σοφοὶ κατὰ σάρκα, οὐ πολλοὶ δυνατοί, οὐ πολλοὶ εὐγενεῖς·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/026.yaml
  text: 'For consider your calling, brothers: not many of you were wise by human standards, not many were powerful, not many were of noble birth.'
translation:
  language: fr
  text: 'Considérez en effet votre appel, frères[a] : parmi vous, il n’y a pas beaucoup de sages selon les critères humains, pas beaucoup de puissants, pas beaucoup de gens de noble naissance.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ici, « frères » s’adresse collectivement à toute l’Église et comprend les femmes croyantes aussi bien que les hommes.
    reason: cultural_note
lexical_decisions:
- source_word: Βλέπετε
  choice: Considérez
  rationale: L’impératif convient au mouvement exhortatif du contexte. « Considérez » exprime naturellement l’invitation à examiner la situation de la communauté, tout en laissant reconnaître que la forme grecque pourrait aussi être comprise comme un indicatif.
- source_word: κλῆσιν
  choice: appel
  rationale: Dans ce contexte paulinien, le mot désigne l’appel de Dieu qui a rejoint et constitué les croyants, non une vocation professionnelle.
- source_word: ἀδελφοί
  choice: frères
  rationale: Le terme grec est au masculin pluriel. « Frères » en conserve la forme, tandis qu’une note précise que l’ensemble de la communauté, femmes comprises, est interpellé.
- source_word: οὐ πολλοὶ σοφοὶ κατὰ σάρκα
  choice: parmi vous, il n’y a pas beaucoup de sages selon les critères humains
  rationale: La tournure française explicite naturellement le groupe visé. Ici, κατὰ σάρκα renvoie à une évaluation proprement humaine plutôt qu’à la chair au sens physique ou moral; « selon les critères humains » en communique le sens sans ambiguïté indue.
- source_word: δυνατοί
  choice: puissants
  rationale: « Puissants » conserve l’idée générale de pouvoir ou d’influence sans préciser abusivement qu’il serait politique, économique ou social.
- source_word: εὐγενεῖς
  choice: gens de noble naissance
  rationale: Le terme concerne l’origine sociale élevée. Cette formulation est claire en français moderne et évite que « nobles » soit compris seulement comme une qualité morale.
theological_decisions:
- issue: Sens de κατὰ σάρκα
  choice: selon les critères humains
  alternative: selon la chair
  rationale: Dans cette énumération de statuts reconnus par la société, l’expression indique le point de vue de l’évaluation humaine. La traduction retenue évite d’introduire ici le sens théologique de « nature pécheresse », absent du contexte.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition « pas beaucoup » reproduit l’insistance rhétorique du grec. « En effet » rend γὰρ et relie le verset à l’argument précédent.
