id: 1CO.1.24
reference: 1 Corinthians 1:24
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: αὐτοῖς δὲ τοῖς κλητοῖς, Ἰουδαίοις τε καὶ Ἕλλησιν, Χριστὸν θεοῦ δύναμιν καὶ θεοῦ σοφίαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/024.yaml
  text: But to those who are called[a], both Jews and Greeks, Messiah is the power of God and the wisdom of God.
translation:
  language: fr
  text: Mais pour ceux qui sont appelés, Juifs comme Grecs, le Messie[a] est la puissance de Dieu et la sagesse de Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : le Christ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κλητοῖς
  choice: ceux qui sont appelés
  rationale: L’adjectif substantivé désigne ceux que caractérise l’appel reçu. Cette formulation naturelle en français conserve clairement la valeur verbale du grec.
- source_word: Ἰουδαίοις
  choice: Juifs
  rationale: Dans l’opposition paulinienne avec les Grecs, le terme a principalement un sens ethnoreligieux ; « Juifs » est donc le rendu le plus clair.
- source_word: Ἕλλησιν
  choice: Grecs
  rationale: Le grec nomme explicitement les Grecs. Ce choix préserve la formulation de la source sans l’élargir par l’interprétation « non-Juifs ».
- source_word: Χριστόν
  choice: le Messie
  rationale: Χριστός fonctionne ici comme un titre. « Le Messie » en traduit le contenu sémantique, tandis que « le Christ » demeure une possibilité traditionnelle signalée en note.
- source_word: θεοῦ δύναμιν
  choice: la puissance de Dieu
  rationale: La construction avec « de Dieu » restitue formellement le génitif et convient au registre biblique français sans être obscure.
- source_word: θεοῦ σοφίαν
  choice: la sagesse de Dieu
  rationale: Le maintien de la même construction que dans le membre précédent préserve le parallélisme grec.
- source_word: implicit copula / verbless predicate relation
  choice: le Messie est la puissance de Dieu et la sagesse de Dieu
  rationale: La proposition grecque est elliptique et dépend du contexte précédent. L’ajout de « est » produit une phrase française autonome et exprime naturellement la relation prédicative.
theological_decisions:
- issue: Traduction du titre christologique Χριστός
  choice: le Messie
  alternative: le Christ
  rationale: « Le Messie » traduit le sens du titre grec sans ajouter d’interprétation doctrinale. La forme traditionnelle « le Christ » est conservée en note comme équivalent lexical possible.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme « la puissance de Dieu et la sagesse de Dieu » est maintenu, de même que la distinction explicite entre Juifs et Grecs.
