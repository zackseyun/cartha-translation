id: 1CO.1.7
reference: 1 Corinthians 1:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὥστε ὑμᾶς μὴ ὑστερεῖσθαι ἐν μηδενὶ χαρίσματι, ἀπεκδεχομένους τὴν ἀποκάλυψιν τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/007.yaml
  text: so that you do not lack any gift as you eagerly await the revelation of our Lord Jesus the Messiah[a][b][c].
translation:
  language: fr
  text: si bien qu’il ne vous manque aucun don[a], tandis que vous attendez avec impatience la révélation[b] de notre Seigneur Jésus-Christ[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « aucun don spirituel » ou « aucun don accordé par grâce ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « la manifestation » ou « l’apparition » de notre Seigneur Jésus-Christ.'
    reason: lexical_alternative
  - marker: c
    text: 'Grec : « Jésus Christ »; on peut aussi comprendre : « Jésus le Messie ».'
    reason: alternative_reading
lexical_decisions:
- source_word: ὥστε
  choice: si bien que
  rationale: Cette tournure exprime naturellement en français le résultat de la grâce et de l’enrichissement évoqués dans le contexte précédent.
- source_word: ὑμᾶς μὴ ὑστερεῖσθαι
  choice: qu’il ne vous manque
  rationale: Rend clairement l’idée de ne souffrir d’aucune insuffisance, dans une syntaxe française naturelle après « si bien que ».
- source_word: ἐν μηδενὶ χαρίσματι
  choice: aucun don
  rationale: « Don » est concis et naturel. Le contexte indique qu’il s’agit d’un don accordé par grâce, sans imposer ici l’explicitation plus interprétative « don spirituel ».
- source_word: ἀπεκδεχομένους
  choice: tandis que vous attendez avec impatience
  rationale: Le participe décrit une attente continue et intensément orientée vers son objet. « Avec impatience » conserve cette force d’attente ardente.
- source_word: ἀποκάλυψιν
  choice: révélation
  rationale: Équivalent direct du nom grec, qui préserve le vocabulaire eschatologique de Paul sans réduire le terme à la seule idée d’apparition.
- source_word: κυρίου
  choice: Seigneur
  rationale: Rendu français établi de κύριος dans cette désignation de Jésus.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jésus-Christ
  rationale: Dans cette combinaison familière, Χριστός fonctionne comme une désignation devenue proche d’un nom composé. La forme française usuelle « Jésus-Christ » convient, tout en signalant en note le sens titulaire « Jésus le Messie ».
theological_decisions:
- issue: Valeur de Χριστοῦ dans Ἰησοῦ Χριστοῦ
  choice: Jésus-Christ
  alternative: Jésus le Messie
  rationale: Le contexte ne met pas spécialement en relief le titre messianique; la combinaison fonctionne ici comme une désignation fixe. La note conserve toutefois explicitement la valeur du titre grec.
- issue: Nature de χαρίσματι
  choice: don
  alternative: don spirituel / don accordé par grâce
  rationale: Le grec désigne un don gracieux, mais le verset ne précise pas à lui seul sa catégorie. Le texte principal évite donc de trancher plus que la formulation source.
- issue: Sens eschatologique de ἀποκάλυψιν
  choice: révélation
  alternative: manifestation / apparition
  rationale: « Révélation » garde l’idée littérale de dévoilement et laisse ouverte la manière exacte dont cette venue sera rendue visible.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve son lien de conséquence avec le contexte précédent. « Avec impatience » exprime ici une attente ardente et confiante, non une irritation.
