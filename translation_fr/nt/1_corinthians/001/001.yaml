  text: Παῦλος κλητὸς ἀπόστολος ⸂Χριστοῦ Ἰησοῦ⸃ διὰ θελήματος θεοῦ καὶ Σωσθένης ὁ ἀδελφὸς
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/001.yaml
  text: Paul[a], a called apostle of Messiah Jesus by the will of God, and Sosthenes our brother,
translation:
  language: fr
  text: Paul, appelé à être apôtre du Messie Jésus[a] par la volonté de Dieu, et Sosthène, notre frère,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction : « du Christ Jésus ».'
    reason: Alternative lexicale traditionnelle pour Χριστοῦ Ἰησοῦ.
lexical_decisions:
- source_word: Παῦλος
  choice: Paul
  rationale: Forme française traditionnelle et courante de ce nom personnel.
- source_word: κλητὸς ἀπόστολος
  choice: appelé à être apôtre
  rationale: Cette formulation française exprime naturellement que l’appel de Paul porte sur sa fonction apostolique; « à être » explicite l’articulation implicite entre l’adjectif et le nom sans ajouter une idée étrangère.
- source_word: Χριστοῦ Ἰησοῦ
  choice: du Messie Jésus
  rationale: « Messie » rend Χριστός comme titre et l’ordre des deux éléments suit celui du grec, malgré une tournure moins habituelle en français.
- source_word: διὰ θελήματος θεοῦ
  choice: par la volonté de Dieu
  rationale: Avec le génitif, διά indique ici le moyen ou l’agent déterminant; cette expression est à la fois fidèle et idiomatique en français.
- source_word: Σωσθένης
  choice: Sosthène
  rationale: Forme française traditionnelle du nom grec.
- source_word: ὁ ἀδελφὸς
  choice: notre frère
  rationale: Dans cette adresse épistolaire, l’article défini désigne Sosthène comme le frère connu de la communauté; « notre frère » en exprime naturellement la relation communautaire implicite, sans neutraliser le terme masculin.
theological_decisions:
- issue: Valeur de Χριστός dans la formule Χριστοῦ Ἰησοῦ
  choice: du Messie Jésus
  alternative: du Christ Jésus
  rationale: Le terme est rendu comme un titre messianique plutôt que comme un élément presque nominal. L’autre traduction, traditionnelle et possible en français, est conservée en note afin de ne pas masquer la polyvalence de Χριστός.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe garde la forme d’ouverture d’une lettre et se termine donc par une virgule. « Appelé à être » privilégie l’intelligibilité française, tandis que « du Messie Jésus » conserve le titre et l’ordre grecs; la variante plus traditionnelle figure en note.
