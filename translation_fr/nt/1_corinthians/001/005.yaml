  text: because in him you were enriched in every way, in all speech and all knowledge,
translation:
  language: fr
  text: car en lui vous avez été enrichis à tous égards, en toute parole et en toute connaissance.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: car
  rationale: Dans le contexte, la proposition donne le motif de l’action de grâce exprimée au verset précédent. « Car » rend naturellement cette valeur causale.
- source_word: ἐν παντὶ
  choice: à tous égards
  rationale: Le neutre singulier a ici une portée générale. « À tous égards » exprime cette totalité de manière idiomatique, sans suggérer seulement des biens matériels.
- source_word: ἐπλουτίσθητε
  choice: vous avez été enrichis
  rationale: Le passé composé passif conserve à la fois l’action reçue et la métaphore de l’enrichissement.
- source_word: ἐν αὐτῷ
  choice: en lui
  rationale: Cette formulation préserve la valeur de sphère ou d’union de ἐν et le langage paulinien de l’existence en Christ, sans le réduire à un simple moyen.
- source_word: ἐν παντὶ λόγῳ
  choice: en toute parole
  rationale: λόγος peut désigner la parole, le discours ou l’expression verbale. « En toute parole » conserve la concision et le parallélisme du grec tout en laissant subsister sa largeur sémantique.
- source_word: πάσῃ γνώσει
  choice: en toute connaissance
  rationale: La formulation reproduit le parallélisme avec « en toute parole » et garde le sens large de γνῶσις.
