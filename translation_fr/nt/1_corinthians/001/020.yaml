revisions:
- from: Où est le sage ? Où est le spécialiste de la Loi ? Où est le débatteur de l’ère présente ? Dieu n’a-t-il pas rendu folle la sagesse du monde ?[a][b]
  to: Où est le sage ? Où est le scribe ? Où est le débatteur de l’époque actuelle ?[a] Dieu n’a-t-il pas fait de la sagesse du monde une folie ?[b]
  rationale: La révision remplace une explicitation interprétative de γραμματεύς par son équivalent direct « scribe », maintient la distinction voulue entre αἰών et κόσμος, améliore l’idiomaticité de la dernière question tout en conservant la causalité de ἐμώρανεν, et replace la première ancre de note auprès du mot qu’elle éclaire.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T11:18:16Z'
review_pass:
  verdict: revise
  source_fidelity: La série rhétorique et la distinction μεταξύ αἰών (« époque actuelle ») et κόσμος (« monde ») sont bien préservées. Toutefois, « spécialiste de la Loi » interprète γραμματεύς de façon plus étroite que ne le fait le grec, qui dit simplement « scribe ». « Faire de ... une folie » rend idiomatiquement la valeur causative de ἐμώρανεν.
  naturalness: « Scribe », bien qu’historique, est un terme courant et plus concis. « Époque actuelle » est naturel en français international moderne et maintient la distinction lexicale avec « monde ». « Faire de la sagesse du monde une folie » est plus idiomatique que « rendre folle la sagesse du monde ».
  terminology: « Scribe » conserve le terme historique sans imposer la spécialisation juridique. « Sage », « débatteur », « époque actuelle » et « monde » conviennent au registre et au parallélisme du verset.
  issues:
  - severity: medium
    issue: γραμματεύς est traduit par « spécialiste de la Loi ».
    rationale: Cette formulation explicite une fonction possible dans certains contextes juifs, mais le mot grec lui-même désigne un scribe et ne spécifie pas ici « de la Loi ». Elle restreint donc inutilement la portée du texte.
  - severity: low
    issue: L’ancre de la note sur « raisonneur » est placée en fin de verset.
    rationale: La note concerne spécifiquement συζητητής / « débatteur » et devrait suivre ce terme afin que son rattachement soit clair.
  - severity: low
    issue: « Rendu folle la sagesse » est moins idiomatique en français pour une abstraction.
    rationale: Le grec exprime une action causative; « a fait de la sagesse du monde une folie » la conserve tout en étant plus naturel.
  revised_text: Où est le sage ? Où est le scribe ? Où est le débatteur de l’époque actuelle ?[a] Dieu n’a-t-il pas fait de la sagesse du monde une folie ?[b]
