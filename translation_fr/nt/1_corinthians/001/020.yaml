  text: ποῦ σοφός; ποῦ γραμματεύς; ποῦ συζητητὴς τοῦ αἰῶνος τούτου; οὐχὶ ἐμώρανεν ὁ θεὸς τὴν σοφίαν τοῦ ⸀κόσμου;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/020.yaml
  text: Where is the wise man? Where is the scribe? Where is the debater of this age? Has not God made the wisdom of the world foolish?[a][b][c]
translation:
  language: fr
  text: Où est le sage ? Où est le scribe ? Où est le débatteur de l’époque actuelle ?[a] Dieu n’a-t-il pas fait de la sagesse du monde une folie ?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le raisonneur de l’époque actuelle ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « Dieu n’a-t-il pas montré que la sagesse du monde est folie ? »'
    reason: lexical_alternative
lexical_decisions:
- source_word: ποῦ σοφός
  choice: Où est le sage ?
  rationale: La tournure interrogative conserve le défi rhétorique du grec. « Le sage » est naturel en français et peut désigner de manière représentative toute personne tenue pour sage.
- source_word: γραμματεύς
  choice: le spécialiste de la Loi
  rationale: Dans ce contexte où Paul fait écho à Ésaïe 33.18 et met en parallèle diverses figures savantes, cette formulation rend la fonction du scribe plus clairement que le seul terme « scribe » pour le lectorat moderne, sans la réduire à un simple copiste.
- source_word: συζητητής
  choice: le débatteur
  rationale: « Débatteur » exprime clairement celui qui discute et argumente, tout en maintenant le parallélisme de la série.
- source_word: τοῦ αἰῶνος τούτου
  choice: de l’ère présente
  rationale: Cette expression distingue αἰών, l’ère actuelle, de κόσμος, « monde », employé ensuite dans le verset.
- source_word: οὐχὶ ἐμώρανεν
  choice: n’a-t-il pas rendu folle
  rationale: La question appelle une réponse affirmative, et « rendu folle » maintient la valeur causative du verbe grec.
- source_word: τὴν σοφίαν τοῦ κόσμου
  choice: la sagesse du monde
  rationale: Rend directement l’expression et préserve κόσμος comme « monde », distinct de αἰών.
theological_decisions:
- issue: Distinction entre αἰών et κόσμος
  choice: « l’ère présente » puis « le monde »
  alternative: Traduire les deux termes par « monde »
  rationale: Le grec emploie deux mots différents. Les distinguer préserve la tension entre l’ordre temporel présent et le monde comme cadre de la sagesse humaine.
- issue: Portée de ἐμώρανεν
  choice: « rendu folle »
  alternative: « montré que … est folie »
  rationale: La traduction retenue conserve la force causative du verbe sans décider si l’accent porte principalement sur l’action de réduire cette sagesse à la folie ou sur le fait de la dévoiler comme telle.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Les trois questions initiales gardent le rythme oratoire du grec. « Ère présente » évite de confondre αἰών avec κόσμος; « spécialiste de la Loi » explicite la fonction historique du γραμματεύς.
