id: 1CO.1.17
reference: 1 Corinthians 1:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὐ γὰρ ἀπέστειλέν με Χριστὸς βαπτίζειν ἀλλὰ εὐαγγελίζεσθαι, οὐκ ἐν σοφίᾳ λόγου, ἵνα μὴ κενωθῇ ὁ σταυρὸς τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/017.yaml
  text: For Messiah did not send me to baptize[a], but to proclaim the good news—not in wisdom of speech[c][b], so that the cross of Messiah might not be emptied.
translation:
  language: fr
  text: Car le Messie[a] ne m’a pas envoyé baptiser, mais annoncer la bonne nouvelle, non avec la sagesse du discours[b], afin que la croix du Messie ne soit pas vidée[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Grec Χριστός (Christos), traditionnellement rendu par « Christ ».
    reason: lexical_alternative
  - marker: b
    text: Ou « avec une sagesse de discours »; plus littéralement, « non dans une sagesse de parole ».
    reason: lexical_alternative
  - marker: c
    text: Ou « ne soit pas rendue vaine »; le sens peut être « ne soit pas vidée de sa force ».
    reason: lexical_alternative
lexical_decisions:
- source_word: Χριστὸς / τοῦ Χριστοῦ
  choice: le Messie / du Messie
  rationale: Χριστός est rendu comme un titre porteur de sens. « Messie » est compréhensible en français moderne et conserve le lien avec l’idée de l’Oint, tout en signalant en note l’usage traditionnel « Christ ».
- source_word: βαπτίζειν
  choice: baptiser
  rationale: Terme français établi, précis et naturel dans ce contexte; « immerger » imposerait ici une explicitation plus étroite que le grec.
- source_word: εὐαγγελίζεσθαι
  choice: annoncer la bonne nouvelle
  rationale: Rend directement le sens verbal d’annoncer une bonne nouvelle, dans une langue courante, sans dépendre du vocabulaire ecclésiastique « prêcher l’Évangile ».
- source_word: σοφίᾳ λόγου
  choice: la sagesse du discours
  rationale: Conserve les deux éléments de l’expression grecque et son ambiguïté entre sagesse exprimée verbalement, habileté rhétorique et éloquence. « Sans recourir à » rend naturellement en français la valeur instrumentale de ἐν dans ce contexte.
- source_word: κενωθῇ
  choice: soit vidée
  rationale: Maintient l’image concrète du verbe grec au passif sans ajouter dans le texte « de sa force », complément interprétatif seulement implicite.
- source_word: σταυρὸς
  choice: la croix
  rationale: Équivalent français direct et consacré, approprié à l’usage paulinien.
theological_decisions:
- issue: Traduire Χριστός comme titre ou conserver la forme traditionnelle « Christ »
  choice: Messie
  alternative: Christ
  rationale: Le grec garde la valeur d’un titre christologique; le traduire en restitue le sens, tandis que la forme traditionnelle est indiquée en note.
- issue: Expliciter ce dont la croix pourrait être « vidée »
  choice: Ne pas expliciter dans le texte principal
  alternative: ne soit pas vidée de sa force
  rationale: Le grec laisse le complément inexprimé. La formulation française conserve cette tension et la note fournit l’interprétation naturelle sans l’imposer.
translation_notes:
  register: Français international moderne, digne et accessible. La coordination « et cela sans recourir à » clarifie que l’expression grecque porte sur la manière d’annoncer, sans transformer « sagesse » en simple sottise. L’image abrupte de la croix « vidée » est volontairement conservée.
