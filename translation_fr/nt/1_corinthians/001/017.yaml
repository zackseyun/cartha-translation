  source_fidelity: 'Le sens fondamental est bien rendu : contraste entre baptiser et annoncer la bonne nouvelle, rejet d’une sagesse rhétorique, et conséquence concernant la croix. Toutefois, « et cela sans recourir à » explicite et réorganise inutilement la relation syntaxique de οὐκ ἐν σοφίᾳ λόγου. Une formulation plus proche peut rester naturelle sans introduire l’idée supplémentaire de « recourir à ».'
