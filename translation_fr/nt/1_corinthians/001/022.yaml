  text: For Jews ask for signs[c][b][a], and Greeks seek wisdom.
translation:
  language: fr
  text: En effet, les Juifs demandent des signes[a], et les Grecs recherchent la sagesse[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des signes miraculeux ».
    reason: lexical_alternative
  - marker: b
    text: Le mot « Grecs » peut être compris plus largement comme désignant les non-Juifs, mais Paul semble conserver ici le cadre culturel grec en raison de la référence à la sagesse.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπειδή
  choice: En effet
  rationale: La conjonction introduit ici la raison explicative du contraste développé dans le contexte. « En effet » rend naturellement cette valeur causale en français.
- source_word: Ἰουδαῖοι
  choice: les Juifs
  rationale: Dans ce contraste avec les Grecs, le terme désigne le groupe juif comme catégorie religieuse et culturelle; « les Juifs » est le rendu français courant.
- source_word: σημεῖα
  choice: des signes
  rationale: « Signes » conserve le terme grec et sa portée rhétorique, tout en laissant le contexte suggérer qu’il s’agit de manifestations miraculeuses.
- source_word: αἰτοῦσιν
  choice: demandent
  rationale: Le présent « demandent » rend simplement l’action continue, sans introduire la nuance plus forte d’une exigence autoritaire.
- source_word: Ἕλληνες
  choice: les Grecs
  rationale: Ce rendu préserve la formulation précise de Paul et le cadre culturel grec, particulièrement pertinent devant la mention de la sagesse.
- source_word: σοφίαν
  choice: la sagesse
  rationale: « Sagesse » est l’équivalent direct et maintient toute l’étendue du concept sans le réduire à la seule philosophie.
- source_word: ζητοῦσιν
  choice: recherchent
  rationale: « Recherchent » exprime naturellement en français la quête suivie indiquée par le présent grec et s’accorde bien avec « la sagesse ».
