  text: so that no flesh may boast before God[a].
translation:
  language: fr
  text: afin qu’aucun être humain ne puisse se vanter devant Dieu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement, « afin que toute chair ne se vante pas devant Dieu »; c’est-à-dire qu’aucun être humain ne puisse se vanter devant Dieu.
    reason: Signaler l’expression grecque πᾶσα σὰρξ (« toute chair »), dont le sens contextuel est l’humanité entière, tout en conservant un texte français naturel.
lexical_decisions:
- source_word: ὅπως
  choice: afin que
  rationale: Introduit ici une proposition de but ou de résultat. « Afin que » conserve nettement cette valeur en français courant et soutenu.
- source_word: μὴ
  choice: aucun… ne
  rationale: Avec le subjonctif, la négation exclut universellement la possibilité visée; la tournure française « aucun… ne » est naturelle.
- source_word: καυχήσηται
  choice: puisse se vanter
  rationale: Le subjonctif aoriste moyen, dans cette proposition introduite par ὅπως, est rendu par « puisse se vanter », qui exprime la possibilité exclue sans archaïsme.
- source_word: πᾶσα σὰρξ
  choice: aucun être de chair
  rationale: Sous la négation, l’expression signifie qu’aucun humain n’est excepté. « Être de chair » préserve l’image biblique de σάρξ tout en évitant l’ambiguïté française de « aucune chair ».
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: devant Dieu
  rationale: Expression idiomatique fidèle, désignant la présence et le jugement de Dieu.
theological_decisions:
- issue: Sens de σάρξ dans ce contexte paulinien
  choice: Conserver l’image de la chair par « être de chair »
  alternative: « être humain » ou « personne »
  rationale: Ici, σάρξ ne désigne pas une prétendue « nature pécheresse », mais l’humanité dans sa condition créée et fragile devant Dieu. La formulation retenue préserve cette tension et la texture rhétorique de Paul.
translation_notes:
  register: Français international moderne, digne et accessible. « Être de chair » maintient l’image source tout en étant plus intelligible que le calque isolé « chair ».
