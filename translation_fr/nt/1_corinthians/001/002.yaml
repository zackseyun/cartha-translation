source:
  edition: SBLGNT
  text: τῇ ἐκκλησίᾳ τοῦ θεοῦ, ⸂ἡγιασμένοις ἐν Χριστῷ Ἰησοῦ, τῇ οὔσῃ ἐν Κορίνθῳ,⸃ κλητοῖς ἁγίοις, σὺν πᾶσιν τοῖς ἐπικαλουμένοις τὸ ὄνομα τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ ἐν παντὶ τόπῳ ⸀αὐτῶν καὶ ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/002.yaml
  text: 'To the church of God that is in Corinth[a], to those sanctified in Messiah Jesus, called to be saints, together with all those who call on the name of our Lord Jesus the Messiah in every place[d][c][b], theirs and ours:'
translation:
  language: fr
  text: 'à l’Église de Dieu qui est à Corinthe, à ceux qui ont été sanctifiés en Jésus le Messie[a] et appelés à être saints[b], ainsi qu’à tous ceux qui, en tout lieu, invoquent le nom de notre Seigneur Jésus le Messie[c] — le leur comme le nôtre[d] :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans le Christ Jésus » ; littéralement, l’ordre grec est « dans le Messie Jésus ».
    reason: lexical_alternative
  - marker: b
    text: Ou « appelés saints » ou « saints par appel » ; le grec juxtapose « appelés » et « saints ».
    reason: lexical_alternative
  - marker: c
    text: Ou « Jésus-Christ ».
    reason: lexical_alternative
  - marker: d
    text: 'La formule grecque « le leur et le nôtre » est ambiguë : elle peut se rapporter à « Seigneur » (« leur Seigneur et le nôtre ») ou à « tout lieu » (« en tout lieu, le leur comme le nôtre »).'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκκλησίᾳ
  choice: Église
  rationale: « Église » est le terme français courant et digne pour la communauté chrétienne désignée ici, tout en conservant l’idée d’une assemblée appartenant à Dieu.
- source_word: ἡγιασμένοις
  choice: ont été sanctifiés
  rationale: Le parfait passif exprime une action accomplie dont l’effet demeure. Cette formulation conserve à la fois la voix passive et la portée théologique du verbe.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: en Jésus le Messie
  rationale: Cette formulation française naturelle conserve la valeur titulaire de Χριστός et exprime l’union ou la sphère relationnelle indiquée par ἐν, sans traiter « Christ » comme un nom de famille.
- source_word: κλητοῖς ἁγίοις
  choice: appelés à être saints
  rationale: Le grec juxtapose deux adjectifs, mais cette tournure rend naturellement en français l’appel divin qui qualifie les destinataires, sans suggérer qu’ils auraient acquis ce statut par eux-mêmes.
- source_word: ἐπικαλουμένοις τὸ ὄνομα
  choice: font appel au nom
  rationale: La locution exprime le fait d’invoquer le Seigneur dans la foi et le culte. « Faire appel au nom » est compréhensible en français moderne tout en gardant cette nuance religieuse.
- source_word: κυρίου
  choice: Seigneur
  rationale: « Seigneur » est l’équivalent français établi de κύριος dans la confession chrétienne primitive et convient au rapport exprimé par αὐτῶν καὶ ἡμῶν.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jésus le Messie
  rationale: « Messie » traduit le titre Χριστός au lieu de le laisser sous la forme traditionnelle « Christ »; l’article rend le titre idiomatique en français.
- source_word: ἐν παντὶ τόπῳ αὐτῶν καὶ ἡμῶν
  choice: en tout lieu — leur Seigneur et le nôtre
  rationale: Le groupe αὐτῶν καὶ ἡμῶν est syntaxiquement condensé et ambigu. Le rattacher à « Seigneur », compréhension ancienne et grammaticalement possible, produit un français clair, tandis qu’une note conserve l’autre rattachement possible à « lieu ».
theological_decisions:
- issue: Valeur de Χριστός
  choice: Messie dans les deux occurrences
  alternative: Christ
  rationale: Dans cette adresse confessionnelle, Χριστός garde une valeur de titre messianique. « Messie » la rend explicitement, tandis que la note signale la forme traditionnelle.
- issue: Rattachement de αὐτῶν καὶ ἡμῶν
  choice: « leur Seigneur et le nôtre »
  alternative: « en tout lieu, le leur et le nôtre »
  rationale: Le grec permet de rapporter les génitifs soit au Seigneur, soit au lieu. Le texte principal adopte le premier rattachement pour sa clarté en français, mais la note préserve expressément l’ambiguïté réelle.
- issue: Sens de κλητοῖς ἁγίοις
  choice: « appelés à être saints »
  alternative: « saints par appel » ou « appelés, saints »
  rationale: La formulation choisie est naturelle et exprime que leur sainteté relève de l’appel de Dieu; la note conserve une traduction plus proche de la juxtaposition grecque.
translation_notes:
  register: Français international moderne, digne et lisible. La phrase conserve la forme d’une adresse épistolaire se terminant par deux-points. « Sanctifiés » et « saints » sont maintenus en raison de leur précision théologique, tandis que la syntaxe environnante reste courante.
