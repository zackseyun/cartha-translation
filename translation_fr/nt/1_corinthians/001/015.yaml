lexical_decisions:
- source_word: ἵνα
  choice: afin que
  rationale: Introduit ici le but ou le résultat visé. « Afin que » restitue clairement la fonction de la proposition dans un français naturel et digne.
- source_word: μή τις
  choice: personne ne
  rationale: Cette combinaison grecque exprime naturellement un sujet indéfini nié ; « personne ne » est la tournure française idiomatique.
- source_word: εἴπῃ
  choice: dise
  rationale: Le subjonctif français après « afin que » rend naturellement le subjonctif aoriste grec et sa portée prospective.
- source_word: εἰς
  choice: dans
  rationale: Dans cette construction baptismale, « dans » demeure proche du mouvement ou de l'intégration exprimés par εἰς, tout en étant plus naturel en français que « en mon nom ». La variante « au nom de » est signalée en note.
- source_word: τὸ ἐμὸν ὄνομα
  choice: mon nom
  rationale: La construction possessive se rend directement et naturellement par « mon nom ».
- source_word: ἐβαπτίσθητε
  choice: vous avez été baptisés
  rationale: La forme passive est conservée. « Baptisés » est le terme français standard et transparent, sans préciser un mode baptismal particulier.
theological_decisions:
- issue: Rendu de εἰς τὸ ἐμὸν ὄνομα dans le contexte baptismal
  choice: dans mon nom
  alternative: au nom de moi / en mon nom
  rationale: « Dans mon nom » conserve autant que possible la force relationnelle et intégrative de εἰς sans la réduire d'emblée à l'idée d'autorité. Comme « au nom de » est la formulation française courante et une interprétation possible, elle est conservée en note.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste concise et suit la proposition grecque. Le masculin pluriel de « baptisés » fonctionne ici comme forme générique pour un groupe mixte.
