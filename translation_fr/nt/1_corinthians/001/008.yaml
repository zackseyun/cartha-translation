id: 1CO.1.8
reference: 1 Corinthians 1:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὃς καὶ βεβαιώσει ὑμᾶς ἕως τέλους ἀνεγκλήτους ἐν τῇ ἡμέρᾳ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/008.yaml
  text: who will also establish you to the end[c][b][a], blameless in the day of our Lord Jesus the Messiah.
translation:
  language: fr
  text: C’est lui qui vous affermira aussi[a] jusqu’à la fin, afin que vous soyez irréprochables[b] au jour de notre Seigneur Jésus le Messie[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vous rendra fermes » ou « vous fortifiera ».
    reason: lexical_alternative
  - marker: b
    text: Ou « à l’abri de tout reproche » ou « libres de toute accusation ».
    reason: lexical_alternative
  - marker: c
    text: 'Grec : « Christ »; « Messie » traduit ici le sens du titre.'
    reason: lexical_alternative
lexical_decisions:
- source_word: βεβαιώσει
  choice: affermira
  rationale: Le verbe exprime l’action de rendre ferme ou stable. « Affermira » conserve ce sens tout en restant naturel dans un registre biblique moderne.
- source_word: ἕως τέλους
  choice: jusqu’à la fin
  rationale: Cette formulation rend directement la durée qui s’étend jusqu’au terme, vraisemblablement eschatologique dans ce contexte.
- source_word: ἀνεγκλήτους
  choice: irréprochables
  rationale: Le terme désigne des personnes contre lesquelles aucune accusation fondée ne peut être portée. « Irréprochables » est concis et idiomatique; la nuance judiciaire est signalée en note.
- source_word: ἐν τῇ ἡμέρᾳ
  choice: au jour
  rationale: « Au jour de » est la tournure française naturelle qui conserve l’expression biblique désignant le jour eschatologique.
- source_word: κυρίου
  choice: Seigneur
  rationale: « Seigneur » est l’équivalent français établi de κύριος et convient au poids titulaire du mot dans ce passage.
- source_word: Χριστοῦ
  choice: le Messie
  rationale: « Le Messie » restitue le sens du titre Χριστός au lieu de le traiter comme un simple nom propre; l’article rend ce titre idiomatique en français.
theological_decisions:
- issue: Référent de ὃς (« qui »)
  choice: Le pronom relatif renvoie à « notre Seigneur Jésus le Messie » au verset 7; la traduction enchaîne par « C’est lui qui » afin de rendre ce lien intelligible en français.
  alternative: Le pronom pourrait être compris comme renvoyant plus largement à Dieu, mentionné auparavant dans le contexte.
  rationale: L’antécédent masculin singulier le plus proche est « notre Seigneur Jésus le Messie » à la fin du verset 7. La syntaxe immédiate favorise donc ce référent, sans qu’il soit nécessaire d’ajouter une précision doctrinale.
- issue: Rapport entre βεβαιώσει et ἀνεγκλήτους
  choice: « afin que vous soyez irréprochables » explicite en français la situation visée par l’affermissement.
  alternative: « il vous affermira… irréprochables » conserverait plus directement la construction grecque, mais serait peu naturelle et potentiellement obscure en français.
  rationale: L’accusatif ἀνεγκλήτους se rapporte à ὑμᾶς et indique l’état dans lequel les destinataires se trouveront au jour du Seigneur. La tournure finale est idiomatique sans préciser davantage le mécanisme théologique.
translation_notes:
  register: Français international moderne, digne et accessible. « C’est lui qui » assure un enchaînement naturel avec le verset précédent; « affermira », « au jour de » et « le Messie » maintiennent le registre biblique sans archaïsme excessif.
