reference: 1 Corinthians 1:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: πιστὸς ὁ θεὸς δι’ οὗ ἐκλήθητε εἰς κοινωνίαν τοῦ υἱοῦ αὐτοῦ Ἰησοῦ Χριστοῦ τοῦ κυρίου ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/009.yaml
  text: God is faithful[a], by whom you were called into fellowship with his Son[c][b], Jesus the Messiah our Lord.
translation:
  language: fr
  text: 'Dieu est fidèle : c’est par lui que vous avez été appelés à la communion[a] avec son Fils, Jésus le Messie, notre Seigneur.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot grec rendu par « communion » peut aussi signifier « participation » ou « partage ».
    reason: alternative_lexical_sense
lexical_decisions:
- source_word: πιστὸς
  choice: fidèle
  rationale: L’adjectif attribut exprime la fiabilité constante de Dieu; « fidèle » est naturel, digne et conserve la portée théologique du grec.
- source_word: δι’ οὗ
  choice: lui par qui
  rationale: διά avec le génitif marque ici l’intermédiaire ou l’agent de l’appel. « Lui par qui » conserve cette nuance sans rendre la phrase artificielle en français.
- source_word: ἐκλήθητε
  choice: vous avez été appelés
  rationale: Le passif aoriste de καλέω désigne l’appel reçu de Dieu. Cette formulation garde le passif et la résonance paulinienne sans préciser davantage son efficacité.
- source_word: εἰς κοινωνίαν
  choice: à vivre en communion
  rationale: La préposition εἰς indique l’entrée dans cette communion. L’ajout idiomatique de « vivre » produit un français naturel tout en laissant à κοινωνία ses dimensions relationnelle et participative.
- source_word: τοῦ υἱοῦ αὐτοῦ
  choice: avec son Fils
  rationale: Le génitif dépend de κοινωνία; en français, la relation personnelle se formule naturellement par « communion avec ».
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jésus le Messie
  rationale: Jésus est translittéré comme nom, tandis que Χριστός est rendu comme le titre « Messie »; l’article français rend cette suite idiomatique.
- source_word: τοῦ κυρίου ἡμῶν
  choice: notre Seigneur
  rationale: « Seigneur » est le rendu français usuel de κύριος et préserve ici le titre christologique.
theological_decisions:
- issue: Rendre Χριστοῦ comme un nom traditionnel (« Christ ») ou comme le titre traduit (« Messie »).
  choice: Jésus le Messie
  alternative: Jésus-Christ
  rationale: Dans cette désignation développée du Fils, le sens titulaire de Χριστός demeure perceptible. « Le Messie » le rend explicitement sans ajouter de contenu doctrinal.
- issue: Déterminer si κοινωνία désigne surtout une relation, une participation ou un partage.
  choice: communion avec son Fils
  alternative: participation à la vie de son Fils
  rationale: Le grec permet une portée à la fois relationnelle et participative. « Communion » conserve cette densité et évite de réduire le terme à une seule de ces dimensions.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La tournure « lui par qui » maintient le lien avec « Dieu » et la structure grecque; « à vivre en communion » évite le calque peu naturel « appelés dans la communion ».
