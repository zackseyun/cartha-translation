    issue: Ajout interprétatif de « vivre »
    rationale: Le grec dit littéralement que les destinataires ont été appelés « à/vers la communion » ; « vivre en communion » est fluide mais ajoute une action non exprimée.
  - severity: medium
    issue: Note alternative sémantiquement imprécise
    rationale: « Participer à la communion de son Fils » ne correspond pas clairement à « communion avec son Fils » et peut déplacer la relation exprimée par le grec. La note devrait présenter les sens alternatifs de κοινωνία sans modifier son complément.
  revised_text: 'Dieu est fidèle : c’est par lui que vous avez été appelés à la communion[a] avec son Fils, Jésus le Messie, notre Seigneur.'
