id: 1CO.1.13
reference: 1 Corinthians 1:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: μεμέρισται ὁ Χριστός; μὴ Παῦλος ἐσταυρώθη ὑπὲρ ὑμῶν, ἢ εἰς τὸ ὄνομα Παύλου ἐβαπτίσθητε;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/013.yaml
  text: Has Messiah been divided? Was Paul crucified for you? Or were you baptized into the name of Paul?[a][b]
translation:
  language: fr
  text: Le Messie a-t-il été divisé ? Paul a-t-il été crucifié pour vous ? Ou bien avez-vous été baptisés au nom de Paul ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression grecque traduite par « au nom de Paul » peut aussi suggérer l’entrée dans une relation d’appartenance ou d’allégeance envers Paul.
    reason: nuance_lexicale
lexical_decisions:
- source_word: μεμέρισται
  choice: a-t-il été divisé
  rationale: Le passé composé passif rend le parfait grec comme une action accomplie dont le résultat demeure, tout en conservant la question rhétorique.
- source_word: ὁ Χριστός
  choice: le Messie
  rationale: La présence de l’article met ici en relief la valeur de titre de Χριστός. « Le Messie » en transmet directement le sens en français moderne.
- source_word: μὴ
  choice: rendu par la forme interrogative
  rationale: La particule introduit une question rhétorique appelant une réponse négative. En français, la question elle-même suffit naturellement à produire cet effet.
- source_word: ἐσταυρώθη ὑπὲρ ὑμῶν
  choice: a-t-il été crucifié pour vous
  rationale: Cette formulation directe conserve le passif ainsi que la portée volontairement large de ὑπέρ, sans préciser davantage la nature du « pour ».
- source_word: εἰς τὸ ὄνομα Παύλου
  choice: au nom de Paul
  rationale: « Baptiser au nom de » est l’expression française naturelle. La note signale que εἰς peut aussi évoquer l’entrée dans une relation d’appartenance ou d’allégeance.
- source_word: ἐβαπτίσθητε
  choice: avez-vous été baptisés
  rationale: Le passif et la force interrogative du grec sont conservés dans une formulation française courante.
theological_decisions:
- issue: Valeur de Χριστός dans la question rhétorique
  choice: le Messie
  alternative: le Christ
  rationale: Avec l’article, le terme a ici une nette valeur titulaire. « Le Messie » rend ce contenu sémantique sans nier que « le Christ » soit l’équivalent traditionnel.
- issue: Portée de εἰς τὸ ὄνομα dans le contexte du baptême
  choice: au nom de Paul
  alternative: pour appartenir à Paul
  rationale: Le texte principal privilégie l’idiome français établi sans réduire l’expression à une seule interprétation théologique. La note conserve sa possible nuance relationnelle.
translation_notes:
  register: Français international moderne, direct et digne. Les trois questions brèves gardent la vigueur rhétorique du grec. « Ou bien » marque naturellement la progression vers la troisième question.
