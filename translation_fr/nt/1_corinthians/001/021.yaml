source:
  edition: SBLGNT
  text: ἐπειδὴ γὰρ ἐν τῇ σοφίᾳ τοῦ θεοῦ οὐκ ἔγνω ὁ κόσμος διὰ τῆς σοφίας τὸν θεόν, εὐδόκησεν ὁ θεὸς διὰ τῆς μωρίας τοῦ κηρύγματος σῶσαι τοὺς πιστεύοντας.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/021.yaml
  text: For since[a], in the wisdom of God, the world did not know God through wisdom[b], God was pleased through the foolishness of the proclamation to save those who believe.
translation:
  language: fr
  text: En effet, puisque dans la sagesse de Dieu, le monde n’a pas connu Dieu par la sagesse, il a plu à Dieu, par la folie de la proclamation[a], de sauver ceux qui croient.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « par la folie de la prédication ». La « folie » est celle que le monde attribue au message proclamé.'
    reason: alternative_reading_and_cultural_note
lexical_decisions:
- source_word: ἐπειδὴ γὰρ
  choice: En effet, puisque
  rationale: « En effet » reprend la fonction explicative de γάρ, tandis que « puisque » exprime la circonstance causale introduite par ἐπειδή.
- source_word: ἐν τῇ σοφίᾳ τοῦ θεοῦ
  choice: dans la sagesse de Dieu
  rationale: Cette formulation conserve l’ambiguïté de ἐν entre sphère et cadre déterminé par la sagesse divine, sans imposer une valeur instrumentale.
- source_word: οὐκ ἔγνω ὁ κόσμος
  choice: le monde n’a pas connu
  rationale: Le passé composé rend naturellement l’aoriste en français moderne; « connaître » préserve la portée à la fois cognitive et relationnelle de γινώσκω, et « le monde » demeure le rendu paulinien usuel de κόσμος.
- source_word: διὰ τῆς σοφίας
  choice: par la sagesse
  rationale: « Par » exprime ici naturellement le moyen indiqué par διά avec le génitif, sans préciser qu’il s’agirait exclusivement de la sagesse humaine.
- source_word: εὐδόκησεν ὁ θεὸς
  choice: il a plu à Dieu
  rationale: Cette tournure française digne et idiomatique conserve l’idée du bon plaisir divin plutôt que de réduire le verbe à une simple décision.
- source_word: διὰ τῆς μωρίας τοῦ κηρύγματος
  choice: par la folie de la proclamation
  rationale: « Proclamation » peut désigner le message proclamé tout en laissant résonner l’acte de le proclamer; « folie » conserve l’ironie du grec sans l’expliquer dans le corps du texte.
- source_word: σῶσαι
  choice: de sauver
  rationale: « Sauver » est le correspondant français direct et traditionnel de σῴζω et en préserve la portée sotériologique.
- source_word: τοὺς πιστεύοντας
  choice: ceux qui croient
  rationale: Cette expression rend clairement le participe présent substantivé sans ajouter de précision doctrinale absente du grec.
theological_decisions:
- issue: Sens de διὰ τῆς μωρίας τοῦ κηρύγματος
  choice: La formulation principale renvoie à la proclamation, surtout à son contenu perçu comme folie.
  alternative: « Par la folie de la prédication », mettant davantage l’accent sur l’acte ou la méthode de prêcher.
  rationale: κήρυγμα désigne couramment ce qui est proclamé, mais peut faire entendre en contexte l’activité publique de proclamation. « La proclamation » préserve mieux cette tension que « la prédication » seule.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe demeure relativement formelle afin de conserver l’enchaînement logique et les ambiguïtés du grec. Le pronom « il » dans « il a plu à Dieu » est impersonnel et non une reprise de « le monde ».
