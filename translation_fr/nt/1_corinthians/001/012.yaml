  text: λέγω δὲ τοῦτο ὅτι ἕκαστος ὑμῶν λέγει· Ἐγὼ μέν εἰμι Παύλου, Ἐγὼ δὲ Ἀπολλῶ, Ἐγὼ δὲ Κηφᾶ, Ἐγὼ δὲ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/012.yaml
  text: 'What I mean is this: each of you says[a], “I belong to Paul,” or “I belong to Apollos,” or “I belong to Cephas,” or “I belong to Messiah.”'
translation:
  language: fr
  text: 'Voici ce que je veux dire : chacun de vous dit : « Moi, j’appartiens à Paul », ou « Moi, j’appartiens à Apollos », ou « Moi, j’appartiens à Céphas », ou « Moi, j’appartiens au Messie[a] ».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « au Christ ».'
    reason: Variante de traduction du titre grec Χριστός, et non variante du texte grec.
lexical_decisions:
- source_word: λέγω δὲ τοῦτο
  choice: Voici ce que je veux dire
  rationale: Cette formulation française naturelle conserve la fonction explicative de la proposition grecque.
- source_word: ὅτι
  choice: ':'
  rationale: Les deux-points introduisent idiomatiquement en français le contenu annoncé par ὅτι.
- source_word: ἕκαστος ὑμῶν
  choice: chacun de vous
  rationale: Rend directement la valeur distributive de ἕκαστος.
- source_word: λέγει
  choice: dit
  rationale: Le présent simple correspond au présent grec et décrit les affirmations répétées au sein de la communauté.
- source_word: Ἐγὼ μέν εἰμι Παύλου / Ἐγὼ δὲ Ἀπολλῶ / Ἐγὼ δὲ Κηφᾶ / Ἐγὼ δὲ Χριστοῦ
  choice: Moi, j’appartiens à Paul… Moi, j’appartiens à Apollos… Moi, j’appartiens à Céphas… Moi, j’appartiens au Messie
  rationale: Le génitif après εἰμί exprime ici l’appartenance ou l’affiliation. La répétition de « Moi » et de « j’appartiens » garde l’insistance et le parallélisme des slogans grecs sans réduire ceux-ci au seul fait de suivre un enseignant.
- source_word: Κηφᾶ
  choice: Céphas
  rationale: Translittère le nom employé par Paul au lieu de lui substituer Pierre.
- source_word: Χριστοῦ
  choice: Messie
  rationale: Χριστός fonctionne comme un titre ; « Messie » en traduit le sens en français moderne, tandis que la forme traditionnelle « Christ » est signalée en note.
theological_decisions:
- issue: Traduction de Χριστοῦ dans un slogan d’appartenance
  choice: Messie
  alternative: Christ
  rationale: Le grec présente Χριστός comme un titre. « Messie » en rend le sens sans nier que « Christ » soit la forme traditionnelle française du même titre ; cette dernière est conservée en note.
- issue: Nature du dernier slogan
  choice: Le présenter parallèlement aux trois autres, sans commentaire interprétatif
  alternative: Le distinguer comme une affirmation correcte opposée aux slogans de parti
  rationale: La syntaxe grecque aligne les quatre déclarations. La traduction préserve cette tension sans décider si « Moi, j’appartiens au Messie » est un slogan factionnel ou une revendication d’un autre ordre.
translation_notes:
  register: Français international moderne, clair et digne. La répétition volontaire de « Moi, j’appartiens » reproduit l’insistance rhétorique du grec. « Céphas » conserve le nom employé dans la source, et « Messie » traduit le titre plutôt que de le translittérer.
