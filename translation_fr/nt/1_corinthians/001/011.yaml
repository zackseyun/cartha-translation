id: 1CO.1.11
reference: 1 Corinthians 1:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐδηλώθη γάρ μοι περὶ ὑμῶν, ἀδελφοί μου, ὑπὸ τῶν Χλόης ὅτι ἔριδες ἐν ὑμῖν εἰσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/011.yaml
  text: For it has been reported to me about you[a], my brothers, by Chloe’s people, that there are quarrels among you.
translation:
  language: fr
  text: En effet, mes frères et sœurs[a], des gens de l’entourage de Chloé m’ont appris qu’il y a des querelles parmi vous.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « mes frères ». Ici, le terme grec peut désigner l’ensemble de la communauté croyante, hommes et femmes.'
    reason: Préciser la forme grammaticale grecque et sa probable portée inclusive.
lexical_decisions:
- source_word: ἐδηλώθη
  choice: m’ont appris
  rationale: Le passif grec indique que l’information a été portée à la connaissance de Paul. La tournure active indéfinie avec la source exprimée est plus naturelle en français et conserve le sens.
- source_word: γάρ
  choice: En effet
  rationale: Marque naturellement le lien explicatif avec l’exhortation précédente.
- source_word: περὶ ὑμῶν
  choice: qu’il y a des querelles parmi vous
  rationale: Le complément concernant les Corinthiens est intégré idiomatiquement au contenu de ce qui a été appris, sans perte de sens.
- source_word: ἀδελφοί μου
  choice: mes frères et sœurs[a]
  rationale: Dans cette adresse à l’ensemble de la communauté croyante, le masculin pluriel grec a vraisemblablement une portée inclusive. Le français explicite naturellement cette inclusion, tandis que la note signale la forme littérale.
- source_word: ὑπὸ τῶν Χλόης
  choice: des gens de l’entourage de Chloé
  rationale: L’expression désigne des personnes associées à Chloé sans préciser s’il s’agit de sa maisonnée, de ses employés ou d’autres proches; « entourage » préserve cette indétermination.
- source_word: ἔριδες
  choice: querelles
  rationale: Le terme désigne des conflits ou rivalités interpersonnels; « querelles » est actuel, clair et plus précis ici que « divisions ».
- source_word: ἐν ὑμῖν εἰσιν
  choice: il y a … parmi vous
  rationale: Équivalent français idiomatique de la construction existentielle grecque.
theological_decisions:
- issue: Portée de ἀδελφοί dans une communauté composée d’hommes et de femmes
  choice: mes frères et sœurs
  alternative: mes frères
  rationale: Bien que le nom grec soit au masculin pluriel, l’adresse vise vraisemblablement toute l’assemblée. La traduction principale rend le référent inclusif; une note conserve l’accès à la forme grecque.
- issue: Identité des τῶν Χλόης
  choice: des gens de l’entourage de Chloé
  alternative: ceux de la maison de Chloé
  rationale: Le grec indique une association avec Chloé sans définir la nature exacte du groupe. Éviter « maison » empêche de transformer une possibilité en certitude.
translation_notes:
  register: Français international moderne, naturel et digne. « En effet » maintient l’enchaînement argumentatif; « entourage » évite de surinterpréter le lien avec Chloé.
