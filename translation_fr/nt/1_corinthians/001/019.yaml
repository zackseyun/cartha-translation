base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/019.yaml
  text: 'For it is written: “I will destroy the wisdom of the wise[a], and I will set aside the understanding of the intelligent.”'
translation:
  language: fr
  text: 'Car il est écrit : « Je détruirai la sagesse des sages et je réduirai à néant l’intelligence des intelligents.[a] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « je rejetterai l’intelligence de ceux qui savent discerner »; autre traduction possible : « je rendrai vaine la compréhension des gens avisés ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: γέγραπται
  choice: il est écrit
  rationale: Formule française consacrée pour introduire une citation de l’Écriture; elle rend la valeur résultative du parfait passif.
- source_word: γάρ
  choice: Car
  rationale: Marque le fondement explicatif de l’affirmation précédente et convient au registre littéraire de la citation.
- source_word: Ἀπολῶ
  choice: Je détruirai
  rationale: Rend directement le futur de ἀπόλλυμι sans atténuer la force de l’action annoncée.
- source_word: σοφίαν τῶν σοφῶν
  choice: la sagesse des sages
  rationale: Préserve le parallélisme et la répétition de mots apparentés du grec.
- source_word: σύνεσιν τῶν συνετῶν
  choice: l’intelligence des intelligents
  rationale: Reproduit autant que possible le jeu étymologique du grec et maintient le parallèle avec « la sagesse des sages ».
- source_word: ἀθετήσω
  choice: je réduirai à néant
  rationale: Exprime ici l’idée de rendre sans effet ou d’annuler; formulation naturelle et vigoureuse dans le contexte prophétique.
theological_decisions:
- issue: Force des deux verbes futurs dans la citation d’Ésaïe
  choice: 'Conserver des actions divines directes : « Je détruirai » et « je réduirai à néant »'
  alternative: « Je ferai disparaître » et « je rejetterai »
  rationale: Le grec présente deux futurs actifs affirmant l’action de Dieu contre la sagesse et l’intelligence humaines; la traduction en garde la force sans ajouter d’explication doctrinale.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme serré et les répétitions de la citation sont conservés. La note signale l’étendue sémantique de συνετός et de ἀθετέω sans résoudre artificiellement leur nuance.
