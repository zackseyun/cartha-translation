source:
  edition: SBLGNT
  text: Παρακαλῶ δὲ ὑμᾶς, ἀδελφοί, διὰ τοῦ ὀνόματος τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ ἵνα τὸ αὐτὸ λέγητε πάντες, καὶ μὴ ᾖ ἐν ὑμῖν σχίσματα, ἦτε δὲ κατηρτισμένοι ἐν τῷ αὐτῷ νοῒ καὶ ἐν τῇ αὐτῇ γνώμῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/010.yaml
  text: I urge you[a], brothers, by the name of our Lord Jesus the Messiah, that you all say the same thing, and that there be no divisions among you[e][d][c][b], but that you be joined together in the same mind and in the same judgment.
translation:
  language: fr
  text: 'Je vous exhorte, frères[a], au nom de notre Seigneur Jésus le Messie[b] : que vous disiez tous la même chose, qu’il n’y ait pas de divisions[c] parmi vous, mais que vous soyez pleinement unis[d] dans une même pensée et un même jugement[e].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « frères et sœurs » : le masculin pluriel grec peut désigner ici toute la communauté croyante.'
    reason: cultural_note
  - marker: b
    text: « Messie », traditionnellement « Christ ».
    reason: lexical_alternative
  - marker: c
    text: Ou « schismes » ; le mot grec est à l’origine du terme « schismes ».
    reason: lexical_alternative
  - marker: d
    text: Ou « soyez rétablis » ou « soyez ajustés ensemble ».
    reason: lexical_alternative
  - marker: e
    text: Ou « un même avis » ou « une même résolution ».
    reason: lexical_alternative
lexical_decisions:
- source_word: Παρακαλῶ
  choice: Je vous exhorte
  rationale: Le verbe introduit un appel pastoral pressant plutôt qu’un ordre abrupt. « Exhorter » conserve la dignité et la force de l’appel.
- source_word: δὲ
  choice: donc
  rationale: La particule marque ici la transition vers l’appel qui découle de ce qui précède; « donc » rend naturellement ce lien discursif sans valeur temporelle.
- source_word: ἀδελφοί
  choice: frères
  rationale: Le masculin pluriel grec est conservé dans le texte; la portée communautaire possiblement inclusive est signalée en note.
- source_word: διὰ τοῦ ὀνόματος
  choice: par le nom de
  rationale: διά avec le génitif indique ici le fondement ou l’autorité de l’appel. La formulation conserve l’expression source et sa portée solennelle.
- source_word: Χριστοῦ
  choice: le Messie
  rationale: Χριστός garde ici sa valeur de titre. L’article est requis en français idiomatique dans « Jésus le Messie »; la forme traditionnelle « Christ » est donnée en note.
- source_word: τὸ αὐτὸ λέγητε πάντες
  choice: soyez tous d’accord dans vos paroles
  rationale: Cette formulation française naturelle conserve la référence explicite à ce qui est dit, sans réduire l’expression à un accord purement intérieur.
- source_word: σχίσματα
  choice: divisions
  rationale: « Divisions » exprime clairement les ruptures et factions dans la communauté; « schismes » serait plus technique.
- source_word: κατηρτισμένοι
  choice: soyez parfaitement unis
  rationale: Le participe passif exprime l’état d’éléments remis en ordre, ajustés ou réunis. Dans le contexte des divisions, cette tournure rend le résultat d’une unité restaurée sans imposer une image particulière.
- source_word: νοῒ
  choice: manière de penser
  rationale: Cette expression actuelle rend νοῦς comme faculté ou orientation de pensée et permet de le distinguer de γνώμη.
- source_word: γνώμῃ
  choice: conviction
  rationale: Le terme peut désigner le jugement, l’avis ou la résolution. « Conviction » préserve cette amplitude pratique tout en restant distinct de la manière de penser.
theological_decisions:
- issue: Valeur christologique de Χριστός
  choice: Jésus le Messie
  alternative: Jésus-Christ / Jésus le Christ
  rationale: Le titre est traduit plutôt que simplement translittéré, tout en préservant le référent traditionnel et sans ajouter de contenu doctrinal.
- issue: Portée de l’adresse ἀδελφοί
  choice: « frères » dans le texte avec une note inclusive
  alternative: « frères et sœurs »
  rationale: Le texte principal respecte la forme masculine grecque, tandis que la note indique que l’adresse peut viser l’ensemble de la communauté croyante.
- issue: Nature de l’unité demandée
  choice: accord dans les paroles, la pensée et la conviction
  alternative: uniformité absolue de toute opinion
  rationale: Le grec souligne une unité communautaire profonde, mais ne précise pas qu’elle abolirait toute diversité individuelle; la traduction ne durcit donc pas l’appel en uniformité totale.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase est légèrement restructurée après les deux-points pour éviter un calque syntaxique lourd. « Soyez tous d’accord dans vos paroles » conserve la dimension verbale de λέγητε, tandis que « parfaitement unis » rend de façon naturelle la valeur passive et résultative de κατηρτισμένοι.
