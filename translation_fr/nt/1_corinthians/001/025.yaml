source:
  edition: SBLGNT
  text: ὅτι τὸ μωρὸν τοῦ θεοῦ σοφώτερον τῶν ἀνθρώπων ἐστίν, καὶ τὸ ἀσθενὲς τοῦ θεοῦ ἰσχυρότερον τῶν ⸀ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/025.yaml
  text: Because the foolishness of God is wiser than people, and the weakness of God is stronger than people.
translation:
  language: fr
  text: Car la folie de Dieu est plus sage que les êtres humains, et la faiblesse de Dieu est plus forte que les êtres humains.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: Car
  rationale: Introduit naturellement en français la raison donnée à l’affirmation précédente.
- source_word: τὸ μωρὸν τοῦ θεοῦ
  choice: ce qui est folie de Dieu
  rationale: Conserve la formulation paradoxale et l’article neutre substantivé, sans attribuer directement la folie à Dieu.
- source_word: σοφώτερον τῶν ἀνθρώπων
  choice: plus sage que les êtres humains
  rationale: Rend explicitement le comparatif grec et traduit ἀνθρώπων de manière inclusive et précise.
- source_word: τὸ ἀσθενὲς τοῦ θεοῦ
  choice: ce qui est faiblesse de Dieu
  rationale: Préserve le parallélisme avec la première proposition et la tension rhétorique du grec.
- source_word: ἰσχυρότερον τῶν ἀνθρώπων
  choice: plus fort que les êtres humains
  rationale: Restitue le comparatif et maintient le parallélisme antithétique entre faiblesse et force.
theological_decisions:
- issue: Le langage paradoxal concernant Dieu
  choice: Conserver « ce qui est folie de Dieu » et « ce qui est faiblesse de Dieu »
  alternative: Expliciter par « ce qui paraît être folie/faiblesse de Dieu »
  rationale: Le texte grec formule délibérément le paradoxe sans ajouter « paraît ». L’explication contextuelle ne doit pas être insérée dans la traduction.
translation_notes:
  register: Français international moderne, sobre et digne. La répétition de « les êtres humains » est maintenue pour refléter le parallélisme du grec, malgré une certaine lourdeur stylistique.
