source:
  edition: SBLGNT
  text: Ὁ λόγος γὰρ ὁ τοῦ σταυροῦ τοῖς μὲν ἀπολλυμένοις μωρία ἐστίν, τοῖς δὲ σῳζομένοις ἡμῖν δύναμις θεοῦ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/018.yaml
  text: For the message of the cross is foolishness to those who are perishing[b][a], but to us who are being saved it is the power of God.
translation:
  language: fr
  text: En effet, le message[a] de la croix est une folie pour ceux qui vont à leur perte, mais pour nous qui sommes en train d’être sauvés[b], il est la puissance de Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la parole de la croix ».
    reason: lexical_alternative
  - marker: b
    text: La formulation grecque présente ici le salut comme une réalité en cours.
    reason: aspectual_clarification
lexical_decisions:
- source_word: λόγος
  choice: message
  rationale: Dans ce contexte, λόγος désigne le contenu proclamé au sujet de la croix. « Message » est naturel en français moderne, tandis que « parole » demeure possible et figure en note.
- source_word: σταυροῦ
  choice: croix
  rationale: La traduction littérale conserve l’expression concise de Paul et sa force théologique, sans expliciter la métonymie par « crucifixion ».
- source_word: ἀπολλυμένοις
  choice: ceux qui vont à leur perte
  rationale: Cette formulation française naturelle rend le participe présent comme une réalité en cours, sans le réduire au simple état exprimé par « les perdus ».
- source_word: μωρία
  choice: folie
  rationale: « Folie » est l’équivalent idiomatique et digne qui exprime clairement le jugement porté sur le message de la croix.
- source_word: σῳζομένοις
  choice: nous qui sommes en train d’être sauvés
  rationale: La périphrase préserve explicitement l’aspect progressif du participe présent et maintient le pronom ἡμῖν, qui inclut Paul et ses lecteurs.
- source_word: δύναμις θεοῦ
  choice: la puissance de Dieu
  rationale: Cette formulation reste proche de la structure grecque et conserve le poids théologique du contraste avec « folie ».
theological_decisions:
- issue: Aspect du salut dans σῳζομένοις
  choice: nous qui sommes en train d’être sauvés
  alternative: nous qui sommes sauvés
  rationale: Le participe présent présente ici le salut comme une réalité en cours ou actuellement vécue. La traduction retenue préserve cette tension sans ramener le salut uniquement à un événement passé.
translation_notes:
  register: Français international moderne, naturel et digne. « En effet » rend la valeur explicative de γάρ. L’expression « vont à leur perte » évite une tournure passive lourde, tandis que « sommes en train d’être sauvés » assume une formulation plus marquée afin de préserver clairement l’aspect du grec.
