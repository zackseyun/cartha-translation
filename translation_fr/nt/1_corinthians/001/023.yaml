source:
  edition: SBLGNT
  text: ἡμεῖς δὲ κηρύσσομεν Χριστὸν ἐσταυρωμένον, Ἰουδαίοις μὲν σκάνδαλον ⸀ἔθνεσιν δὲ μωρίαν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/023.yaml
  text: but we preach the Messiah crucified[a], to Jews a stumbling block and to Gentiles foolishness[b],
translation:
  language: fr
  text: mais nous, nous proclamons le Messie crucifié[a], pour les Juifs une pierre d’achoppement et pour les non-Juifs une folie[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le Christ crucifié ».
    reason: alternative_reading
  - marker: b
    text: Littéralement « aux nations »; ici, il s’agit vraisemblablement des non-Juifs, par opposition aux Juifs.
    reason: lexical_alternative
lexical_decisions:
- source_word: κηρύσσομεν
  choice: nous proclamons
  rationale: « Proclamer » exprime naturellement en français l’annonce publique portée par le verbe grec, sans limiter le sens à l’acte moderne de prêcher.
- source_word: Χριστὸν
  choice: le Messie
  rationale: Dans ce contexte, Χριστός fonctionne comme un titre et désigne l’identité messianique de celui qui est proclamé.
- source_word: ἐσταυρωμένον
  choice: crucifié
  rationale: L’adjectif verbal français rend avec concision le participe parfait passif et maintient au premier plan l’état résultant de la crucifixion.
- source_word: Ἰουδαίοις
  choice: pour les Juifs
  rationale: Le passage établit une opposition rhétorique entre Juifs et non-Juifs, plutôt qu’une distinction strictement géographique.
- source_word: σκάνδαλον
  choice: une pierre d’achoppement
  rationale: Cette expression conserve l’image de l’obstacle qui fait trébucher, contrairement à « scandale », dont le sens courant français pourrait surtout évoquer une affaire choquante.
- source_word: ἔθνεσιν
  choice: pour les non-Juifs
  rationale: Le sens lexical premier est « nations », mais l’opposition explicite avec les Juifs désigne ici les peuples qui ne sont pas juifs. « Non-Juifs » est plus immédiatement compréhensible que « païens » et évite les connotations religieuses supplémentaires de ce dernier.
- source_word: μωρίαν
  choice: une folie
  rationale: « Folie » rend le jugement dépréciatif exprimé par μωρία et maintient le lien lexical avec l’argument environnant de Paul.
theological_decisions:
- issue: 'Χριστός : titre messianique ou forme assimilée à un nom propre'
  choice: le Messie
  alternative: le Christ
  rationale: Le contexte porte sur le contenu de la proclamation apostolique et sur le paradoxe d’un Messie crucifié; la valeur de titre demeure donc saillante.
- issue: Nature de l’obstacle exprimé par σκάνδαλον
  choice: une pierre d’achoppement
  alternative: un scandale
  rationale: La formulation retenue préserve la métaphore grecque sans expliquer pourquoi le Messie crucifié fait trébucher les Juifs, laissant intacte la tension théologique du texte.
translation_notes:
  register: Français international moderne, digne et accessible. La reprise « nous, nous » marque le contraste de ἡμεῖς δέ. Le deux-points explicite naturellement en français les deux réactions au contenu proclamé, sans ajouter de relation causale absente du grec.
