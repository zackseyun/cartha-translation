  text: Εὐχαριστῶ τῷ θεῷ ⸀μου πάντοτε περὶ ὑμῶν ἐπὶ τῇ χάριτι τοῦ θεοῦ τῇ δοθείσῃ ὑμῖν ἐν Χριστῷ Ἰησοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/004.yaml
  text: I thank my God always for you because of the grace of God given to you in Messiah Jesus[b][a],
translation:
  language: fr
  text: Je remercie toujours mon Dieu à votre sujet, à cause de la grâce de Dieu qui vous a été donnée dans le Messie Jésus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans le Christ Jésus ».
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐχαριστῶ τῷ θεῷ μου
  choice: Je remercie mon Dieu
  rationale: Cette formulation française naturelle conserve le présent de l’indicatif, le destinataire de la reconnaissance et le possessif explicite μου.
- source_word: πάντοτε
  choice: toujours
  rationale: Équivalent direct et courant qui préserve la portée temporelle générale de l’adverbe.
- source_word: περὶ ὑμῶν
  choice: à votre sujet
  rationale: Cette traduction conserve la valeur référentielle de περί avec le génitif sans imposer l’idée que l’action est accomplie au bénéfice des destinataires.
- source_word: ἐπὶ τῇ χάριτι
  choice: à cause de la grâce
  rationale: ἐπί avec le datif indique ici le fondement ou le motif de la reconnaissance; cette tournure l’exprime clairement en français.
- source_word: χάριτι τοῦ θεοῦ
  choice: la grâce de Dieu
  rationale: « Grâce » est l’équivalent établi de χάρις dans ce contexte paulinien, tandis que « de Dieu » préserve la souplesse du génitif, qui peut évoquer l’appartenance ou la source.
- source_word: τῇ δοθείσῃ ὑμῖν
  choice: qui vous a été donnée
  rationale: La relative rend naturellement en français le participe aoriste passif et maintient Dieu comme agent implicite du don.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: dans le Messie Jésus
  rationale: « Messie » traduit le titre Χριστός et « dans » conserve la formulation relationnelle et théologique de ἐν sans la préciser davantage.
theological_decisions:
- issue: Sens de ἐν Χριστῷ Ἰησοῦ
  choice: dans le Messie Jésus
  alternative: par le Messie Jésus
  rationale: La traduction retient la valeur large de ἐν et la formule paulinienne d’union ou de sphère, au lieu de réduire l’expression à un simple moyen instrumental.
translation_notes:
  register: Français international moderne, clair et digne. La phrase suit étroitement le mouvement du grec tout en employant une relative naturelle en français. Le marqueur [a] est placé immédiatement après l’expression concernée.
