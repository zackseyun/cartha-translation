  source_fidelity: 'Le texte rend fidèlement tous les éléments grecs : εὐχαριστῶ par « Je remercie », le datif τῷ θεῷ μου par « mon Dieu », πάντοτε par « toujours », περὶ ὑμῶν par « à votre sujet », et ἐπὶ τῇ χάριτι par « à cause de la grâce ». La relative « qui vous a été donnée » transmet correctement le participe aoriste passif τῇ δοθείσῃ ὑμῖν. « Dans le Messie Jésus » conserve sans la réduire la formulation ἐν Χριστῷ Ἰησοῦ et traduit Χριστός comme titre.'
