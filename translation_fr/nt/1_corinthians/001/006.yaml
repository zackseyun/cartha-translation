  text: καθὼς τὸ μαρτύριον τοῦ Χριστοῦ ἐβεβαιώθη ἐν ὑμῖν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/006.yaml
  text: just as the testimony about Messiah was confirmed among you[b][a],
translation:
  language: fr
  text: de même que le témoignage au sujet du Messie[a] a été confirmé parmi vous[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le témoignage du Messie ».'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « en vous ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς
  choice: de même que
  rationale: Cette locution introduit naturellement en français la correspondance avec l’affirmation précédente tout en conservant la valeur comparative du grec.
- source_word: μαρτύριον
  choice: témoignage
  rationale: « Témoignage » conserve à la fois la dimension de proclamation et la portée probante du terme grec, sans le réduire à un simple « message ».
- source_word: τοῦ Χριστοῦ
  choice: au sujet du Messie
  rationale: 'Le génitif est compris principalement comme objectif : le témoignage a le Messie pour objet. « Messie » rend la valeur de titre de Χριστός dans ce contexte.'
- source_word: ἐβεβαιώθη
  choice: a été confirmé
  rationale: Le passif exprime le fait d’avoir été rendu ferme ou établi. « A été confirmé » est précis, naturel et laisse ouverte la manière dont cette confirmation s’est produite.
- source_word: ἐν ὑμῖν
  choice: parmi vous
  rationale: Avec un destinataire pluriel désignant la communauté de Corinthe, « parmi vous » exprime naturellement une confirmation manifestée au sein de cette communauté.
theological_decisions:
- issue: Valeur du génitif dans τοῦ Χριστοῦ
  choice: 'Génitif objectif : « le témoignage au sujet du Messie »'
  alternative: 'Génitif subjectif ou génitif d’origine : « le témoignage du Messie »'
  rationale: Le contexte évoque vraisemblablement le témoignage apostolique concernant Jésus, confirmé dans la communauté. Toutefois, la forme grecque peut aussi désigner un témoignage venant du Messie ou lui appartenant ; cette ambiguïté réelle est signalée en note.
- issue: Portée de ἐν ὑμῖν
  choice: 'Dimension communautaire : « parmi vous »'
  alternative: 'Dimension intérieure ou personnelle : « en vous »'
  rationale: Le pluriel et le contexte ecclésial favorisent une manifestation au sein de la communauté, mais le grec peut également évoquer une confirmation opérée dans les destinataires eux-mêmes.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste étroitement liée au grec et à la phrase précédente. Les notes préservent les deux ambiguïtés authentiques sans imposer une interprétation confessionnelle.
