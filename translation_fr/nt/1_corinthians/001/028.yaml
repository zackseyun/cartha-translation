id: 1CO.1.28
reference: 1 Corinthians 1:28
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ τὰ ἀγενῆ τοῦ κόσμου καὶ τὰ ἐξουθενημένα ἐξελέξατο ὁ θεός, ⸀τὰ μὴ ὄντα, ἵνα τὰ ὄντα καταργήσῃ,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/028.yaml
  text: And God chose the lowborn things of the world and the despised things[a], the things that are not, to nullify the things that are[b],
translation:
  language: fr
  text: Et Dieu a choisi ce qui est de basse condition dans le monde et ce qui est méprisé[a], ce qui n’est pas, afin de réduire à rien ce qui est[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ce qui est tenu pour rien ».
    reason: lexical_alternative
  - marker: b
    text: Ou « rendre sans effet ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγενῆ
  choice: ce qui est de basse condition
  rationale: Cette expression actuelle rend le manque de naissance noble ou de rang social sans suggérer une infériorité morale, comme pourrait le faire « vil ».
- source_word: ἐξουθενημένα
  choice: ce qui est méprisé
  rationale: Le participe parfait désigne ce qui a été traité avec mépris ou tenu pour sans valeur. « Méprisé » en restitue la force de façon concise et naturelle.
- source_word: τὰ μὴ ὄντα
  choice: ce qui n’est pas
  rationale: La formulation proche du grec conserve l’opposition saisissante voulue par Paul et ne la réduit pas à la seule insignifiance sociale.
- source_word: τὰ ὄντα
  choice: ce qui est
  rationale: Cette traduction maintient le parallélisme exact avec « ce qui n’est pas » et préserve l’ambiguïté rhétorique du texte.
- source_word: καταργήσῃ
  choice: réduire à rien
  rationale: Dans ce contexte, l’expression indique que Dieu prive de poids et d’efficacité ce qui paraît établi. Elle s’accorde aussi naturellement avec l’opposition entre « ce qui n’est pas » et « ce qui est », sans imposer explicitement l’idée d’anéantissement matériel.
- source_word: ἐξελέξατο
  choice: a choisi
  rationale: « A choisi » exprime simplement et naturellement l’acte délibéré de Dieu et correspond à la répétition du verbe dans le contexte immédiat.
theological_decisions:
- issue: Faut-il interpréter τὰ μὴ ὄντα et τὰ ὄντα comme de simples catégories sociales ou comme des affirmations ontologiques absolues ?
  choice: Conserver l’opposition littérale « ce qui n’est pas » / « ce qui est ».
  alternative: 'Expliciter : « ceux qui ne comptent pour rien » / « ceux qui comptent ».'
  rationale: Le contexte concerne clairement le statut aux yeux du monde, mais la formulation de Paul est volontairement plus large et provocante. La traduction retenue préserve à la fois sa force sociale, son ambiguïté et sa tension théologique.
translation_notes:
  register: Français international moderne, digne et accessible. Le singulier collectif « ce qui » rend naturellement les neutres pluriels grecs et maintient leur portée générale. « De basse condition » marque le faible rang social sans connotation morale dépréciative.
