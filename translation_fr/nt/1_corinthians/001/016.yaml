  text: ἐβάπτισα δὲ καὶ τὸν Στεφανᾶ οἶκον· λοιπὸν οὐκ οἶδα εἴ τινα ἄλλον ἐβάπτισα.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/016.yaml
  text: I also baptized the household of Stephanas[a]; beyond that[b], I do not know if I baptized anyone else.
translation:
  language: fr
  text: J’ai aussi baptisé la maisonnée de Stéphanas[a]. À part cela, je ne sais pas si j’ai baptisé quelqu’un d’autre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la maison de Stéphanas ». Le terme grec peut désigner l’ensemble de la maisonnée, et non seulement le bâtiment.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐβάπτισα
  choice: j’ai baptisé
  rationale: Le verbe désigne ici l’administration du baptême. « Baptiser » est le terme français courant et transparent, sans préciser un mode particulier.
- source_word: δὲ καὶ
  choice: aussi
  rationale: 'L’ensemble a une valeur additive : Paul ajoute la maison de Stéphanas aux personnes déjà mentionnées. « Aussi » restitue naturellement cette progression.'
- source_word: τὸν Στεφανᾶ οἶκον
  choice: ceux de la maison de Stéphanas
  rationale: οἶκος désigne vraisemblablement ici la maisonnée, c’est-à-dire les personnes rattachées au foyer, plutôt que le bâtiment. Cette formulation française garde la portée sociale du terme sans la limiter à la famille biologique.
- source_word: λοιπὸν
  choice: pour le reste
  rationale: L’expression introduit ce qui demeure au-delà du cas qui vient d’être ajouté et convient au ton de la rectification de Paul.
- source_word: οὐκ οἶδα
  choice: je ne sais pas
  rationale: Cette traduction suit directement le grec. Le contexte concerne probablement la mémoire de Paul, mais le texte dit littéralement qu’il ne sait pas.
- source_word: εἴ τινα ἄλλον ἐβάπτισα
  choice: si j’ai baptisé quelqu’un d’autre
  rationale: εἰ introduit ici une interrogation indirecte exprimant l’incertitude. « Si » est naturel en français et conserve cette nuance.
theological_decisions:
- issue: Étendue de la « maison » de Stéphanas
  choice: ceux de la maison de Stéphanas
  alternative: la famille de Stéphanas
  rationale: Le grec ne précise ni la composition ni l’âge des membres concernés. « Maison » au sens de maisonnée préserve cette indétermination et évite d’en tirer une conclusion doctrinale sur les personnes baptisées.
translation_notes:
  register: Français international moderne, simple et digne. La syntaxe reste proche du mouvement de la phrase grecque, tandis que « ceux de la maison » rend explicitement le sens collectif de οἶκος sans réduire la maisonnée à la seule famille biologique.
