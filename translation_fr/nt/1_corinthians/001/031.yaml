id: 1CO.1.31
reference: 1 Corinthians 1:31
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἵνα καθὼς γέγραπται· Ὁ καυχώμενος ἐν κυρίῳ καυχάσθω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/031.yaml
  text: 'so that[a], just as it is written: “The one who boasts must boast in the Lord.”'
translation:
  language: fr
  text: 'afin que, comme il est écrit : « Que celui qui se glorifie se glorifie dans le Seigneur. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἵνα
  choice: afin que
  rationale: Introduit le but ou le résultat découlant du contexte précédent, tout en conservant la valeur finale de la conjonction grecque.
- source_word: καθὼς γέγραπται
  choice: comme il est écrit
  rationale: Formule française naturelle et consacrée pour introduire une citation de l’Écriture; le présent rend adéquatement la portée durable du parfait grec.
- source_word: Ὁ καυχώμενος
  choice: celui qui se glorifie
  rationale: Reproduit la valeur substantivée du participe et convient à la reprise de Jérémie, tout en désignant le fait de tirer fierté ou gloire de quelque chose.
- source_word: ἐν κυρίῳ
  choice: dans le Seigneur
  rationale: Conserve la préposition grecque et la formule paulinienne, où le Seigneur constitue la sphère et l’objet légitime de la fierté.
- source_word: καυχάσθω
  choice: qu’il se glorifie
  rationale: Le subjonctif à valeur injonctive rend naturellement en français moderne l’impératif grec à la troisième personne.
theological_decisions:
- issue: Force de l’impératif dans la citation
  choice: Que celui qui se glorifie se glorifie dans le Seigneur
  alternative: Celui qui se glorifie doit se glorifier dans le Seigneur
  rationale: La tournure avec « que » conserve directement la forme exhortative de l’impératif grec sans transformer explicitement celui-ci en obligation formulée avec « devoir ».
- issue: Sens de καυχάομαι
  choice: se glorifier
  alternative: se vanter
  rationale: « Se glorifier » préserve la tension entre une fierté humaine condamnable et une fierté légitimement orientée vers le Seigneur; « se vanter » risquerait d’imposer une nuance exclusivement négative.
- issue: Référent de κυρίῳ
  choice: le Seigneur
  alternative: le SEIGNEUR
  rationale: Le grec dit κύριος et Paul applique la citation dans son propre contexte. La traduction garde le titre « Seigneur » sans résoudre davantage l’articulation entre le texte prophétique cité et son usage paulinien.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve le parallélisme de καυχώμενος / καυχάσθω et la tournure scripturaire « comme il est écrit ».
