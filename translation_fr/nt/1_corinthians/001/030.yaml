source:
  edition: SBLGNT
  text: ἐξ αὐτοῦ δὲ ὑμεῖς ἐστε ἐν Χριστῷ Ἰησοῦ, ὃς ἐγενήθη ⸂σοφία ἡμῖν⸃ ἀπὸ θεοῦ, δικαιοσύνη τε καὶ ἁγιασμὸς καὶ ἀπολύτρωσις,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/030.yaml
  text: And it is from him that you are in Messiah Jesus[a], who became for us wisdom from God, and righteousness and sanctification and redemption,
translation:
  language: fr
  text: Or, c’est de lui que vous tenez d’être en Jésus le Messie, qui est devenu pour nous sagesse venant de Dieu, justice, sanctification et rédemption.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξ αὐτοῦ
  choice: grâce à lui
  rationale: Cette tournure française naturelle exprime que la présence des croyants dans le Messie a son origine en Dieu. « De lui » serait plus formellement proche, mais peu naturel ici en français.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: en Jésus le Messie
  rationale: « En » conserve la formulation paulinienne sans expliciter davantage la nature de l’union; « le Messie » rend le titre Χριστός de façon intelligible en français moderne.
- source_word: ἐγενήθη
  choice: est devenu
  rationale: Rend directement γίνομαι et conserve l’idée de ce que Jésus le Messie est devenu pour les croyants.
- source_word: σοφία ἡμῖν ἀπὸ θεοῦ
  choice: pour nous sagesse venant de Dieu
  rationale: La formulation garde ἀπὸ θεοῦ étroitement lié à « sagesse » tout en laissant ouverte sa relation avec les trois noms qui suivent.
- source_word: δικαιοσύνη
  choice: justice
  rationale: « Justice » est le correspondant français direct et traditionnel; selon le contexte, le terme peut évoquer à la fois ce qui est juste et la condition juste accordée par Dieu.
- source_word: ἁγιασμός
  choice: sanctification
  rationale: Terme français établi qui exprime l’action ou l’état de rendre saint, sans réduire le mot à la seule conduite morale.
- source_word: ἀπολύτρωσις
  choice: rédemption
  rationale: Terme théologique français courant qui conserve l’arrière-plan de libération associé au mot grec.
theological_decisions:
- issue: Rapport entre « sagesse venant de Dieu » et « justice, sanctification et rédemption »
  choice: Conserver la suite coordonnée et la syntaxe relativement ouverte du grec.
  alternative: Présenter les trois derniers noms comme une explication explicite de la sagesse, ou rattacher expressément « venant de Dieu » aux quatre noms.
  rationale: La ponctuation sobre évite de trancher une relation syntaxique et théologique que le grec laisse ouverte.
- issue: Sens de l’appartenance exprimée par ἐν Χριστῷ Ἰησοῦ
  choice: Maintenir « en Jésus le Messie ».
  alternative: Expliciter par « unis à Jésus le Messie ».
  rationale: La formulation retenue préserve le langage paulinien de participation ou d’union sans en imposer une explication particulière.
translation_notes:
  register: 'Français international moderne, digne et accessible. « Or » rend la transition δέ sans lourdeur. La traduction privilégie une équivalence optimale: elle conserve les termes théologiques structurants et la tension syntaxique de l’original, tout en employant une formulation française naturelle. La variante anglaise « justice » ne nécessite pas de note en français, puisque « justice » est précisément le choix principal.'
