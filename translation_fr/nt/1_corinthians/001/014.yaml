  yaml_path: translation/nt/1_corinthians/001/014.yaml
  text: I am thankful that I baptized none of you except Crispus and Gaius,
translation:
  language: fr
  text: Je suis reconnaissant de n’avoir baptisé aucun de vous, sauf Crispus et Gaïus,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐχαριστῶ
  choice: Je remercie Dieu
  rationale: En français biblique naturel, « remercier » appelle normalement un complément. Dans les lettres de Paul, εὐχαριστῶ employé absolument sous-entend régulièrement Dieu comme destinataire; l’explicitation produit donc une phrase française claire sans modifier le sens contextuel.
- source_word: ὅτι
  choice: de
  rationale: Après « Je remercie Dieu », l’infinitif passé introduit naturellement le motif de la reconnaissance; cette restructuration rend idiomatiquement le lien exprimé par ὅτι.
- source_word: οὐδένα ὑμῶν
  choice: aucun de vous
  rationale: Équivalent direct, clair et actuel de la tournure grecque négative.
- source_word: ἐβάπτισα
  choice: avoir baptisé
  rationale: « Baptiser » est l’équivalent français établi de βαπτίζω dans ce contexte et n’impose aucune conception confessionnelle du mode du baptême.
- source_word: εἰ μὴ
  choice: sauf
  rationale: Dans cette construction d’exception, « sauf » exprime exactement l’exclusion suivie des deux exceptions.
- source_word: Κρίσπον
  choice: Crispus
  rationale: Forme française traditionnelle et transparente de ce nom propre.
- source_word: Γάϊον
  choice: Gaïus
  rationale: Forme française usuelle du nom propre, avec tréma pour signaler la séparation des voyelles.
theological_decisions:
- issue: Destinataire implicite de l’action de grâce
  choice: Expliciter « Dieu »
  alternative: « Je suis reconnaissant » ou « Je rends grâce » sans complément
  rationale: Le grec ne nomme pas explicitement Dieu dans ce verset, mais l’usage épistolaire paulinien de εὐχαριστῶ indique qu’il est le destinataire de l’action de grâce. L’explicitation est nécessaire à une formulation française naturelle, tout en restant contextuellement fondée.
translation_notes:
  register: Français international moderne, naturel et digne. La virgule finale est conservée puisque le verset se poursuit syntaxiquement au verset 15.
