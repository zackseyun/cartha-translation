id: 1CO.1.27
reference: 1 Corinthians 1:27
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀλλὰ τὰ μωρὰ τοῦ κόσμου ἐξελέξατο ὁ θεός, ἵνα ⸂καταισχύνῃ τοὺς σοφούς⸃, καὶ τὰ ἀσθενῆ τοῦ κόσμου ἐξελέξατο ὁ θεός, ἵνα καταισχύνῃ τὰ ἰσχυρά,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/027.yaml
  text: But God chose the foolish things of the world so that he might shame the wise[c][b][a], and God chose the weak things of the world so that he might shame the strong.
translation:
  language: fr
  text: Mais Dieu a choisi ce qui est insensé aux yeux du monde[a] pour couvrir de honte les sages[b], et Dieu a choisi ce qui est faible aux yeux du monde[c] pour couvrir de honte ce qui est fort.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les choses insensées du monde »; le grec emploie un adjectif neutre pluriel comme nom.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « faire honte aux sages ».'
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « les choses faibles du monde »; le grec emploie de nouveau un adjectif neutre pluriel comme nom.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Mais
  rationale: Marque nettement le contraste avec l’affirmation précédente, dans un français naturel et concis.
- source_word: τὰ μωρὰ τοῦ κόσμου
  choice: ce qui est insensé aux yeux du monde
  rationale: Le neutre pluriel substantivé est rendu par « ce qui est » sans le limiter aux personnes ou aux choses; « aux yeux du monde » explicite naturellement le point de vue associé au génitif.
- source_word: ἐξελέξατο
  choice: a choisi
  rationale: Rend simplement l’action délibérée de Dieu et correspond à l’usage français courant du verbe « choisir ».
- source_word: ἵνα
  choice: pour
  rationale: Exprime clairement et naturellement la finalité de l’action en français.
- source_word: καταισχύνῃ
  choice: couvrir de honte
  rationale: Rend la force de καταισχύνω, qui signifie faire honte ou mettre dans la honte, tout en restant idiomatique.
- source_word: τοὺς σοφούς
  choice: les sages
  rationale: Le masculin pluriel substantivé désigne les personnes considérées comme sages; « les sages » conserve la formulation rhétorique concise.
- source_word: τὰ ἀσθενῆ τοῦ κόσμου
  choice: ce qui est faible aux yeux du monde
  rationale: Conserve le neutre substantivé et le parallélisme avec la première proposition sans préciser indûment s’il s’agit de personnes ou de choses.
- source_word: τὰ ἰσχυρά
  choice: ce qui est fort
  rationale: Préserve le neutre pluriel substantivé et le contraste formel entre ce qui est faible et ce qui est fort.
theological_decisions: []
