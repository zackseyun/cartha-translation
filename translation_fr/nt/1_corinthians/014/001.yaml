id: 1CO.14.1
reference: 1 Corinthians 14:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Διώκετε τὴν ἀγάπην, ζηλοῦτε δὲ τὰ πνευματικά, μᾶλλον δὲ ἵνα προφητεύητε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/001.yaml
  text: Pursue love[a], and earnestly desire the spiritual things[c][b], but especially that you may prophesy.
translation:
  language: fr
  text: Recherchez avec ardeur l’amour et aspirez aux réalités spirituelles[a], mais surtout à prophétiser[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « aux choses spirituelles » ou « aux dons spirituels ». Le grec a un sens plus large que « dons », mais le contexte concerne les manifestations accordées par l’Esprit dans l’Église.
    reason: lexical_alternative
  - marker: b
    text: Ou « mais plutôt à prophétiser ».
    reason: alternative_reading
lexical_decisions:
- source_word: Διώκετε
  choice: Recherchez avec ardeur
  rationale: L’impératif exprime une poursuite active et persévérante. Cette tournure naturelle en français conserve mieux cette intensité que le simple « recherchez ».
- source_word: τὴν ἀγάπην
  choice: l’amour
  rationale: « Amour » est le terme français courant et maintient le lien explicite avec le chapitre 13.
- source_word: ζηλοῦτε
  choice: aspirez à
  rationale: Le verbe désigne ici un vif désir ou un zèle positif. « Aspirez à » est clair, digne et idiomatique.
- source_word: τὰ πνευματικά
  choice: les réalités spirituelles
  rationale: Le neutre pluriel grec est plus large que « dons spirituels ». « Réalités spirituelles » préserve cette étendue, tandis que le contexte des chapitres 12 à 14 en précise l’application aux manifestations accordées par l’Esprit dans l’assemblée.
- source_word: μᾶλλον δὲ
  choice: mais surtout
  rationale: Cette expression marque une préférence ou une priorité, sans exclure les autres réalités spirituelles.
- source_word: ἵνα προφητεύητε
  choice: à prophétiser
  rationale: Après « aspirez », l’infinitif est la construction française la plus naturelle et restitue le contenu visé par ἵνα avec le subjonctif.
theological_decisions:
- issue: Portée de τὰ πνευματικά
  choice: les réalités spirituelles
  alternative: les dons spirituels ; les choses spirituelles
  rationale: Le grec ne contient pas explicitement le nom « dons ». La formulation retenue conserve sa largeur lexicale sans nier que le contexte porte principalement sur les manifestations de l’Esprit dans l’Église.
- issue: Préférence accordée à la prophétie
  choice: mais surtout à prophétiser
  alternative: mais plutôt à prophétiser
  rationale: « Mais surtout » exprime la priorité comparative de la prophétie sans laisser entendre qu’elle annule ou invalide toutes les autres manifestations spirituelles.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation conserve l’élan exhortatif des deux impératifs et évite d’ajouter au grec le mot « dons » dans le texte principal.
