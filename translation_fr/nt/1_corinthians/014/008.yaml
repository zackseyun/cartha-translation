base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/008.yaml
  text: For if the trumpet gives an unclear sound[b][a], who will prepare for battle?
translation:
  language: fr
  text: Car si la trompette émet un son indistinct, qui se préparera au combat ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ γὰρ
  choice: Car
  rationale: La combinaison introduit l’explication qui appuie l’argument précédent ; « Car » en restitue naturellement la valeur logique en français.
- source_word: ἐὰν
  choice: si
  rationale: La particule introduit ici une condition illustrative avec le subjonctif grec ; « si » est l’équivalent français direct et naturel.
- source_word: ἄδηλον
  choice: indistinct
  rationale: Le terme signifie « qui n’est pas clair ou reconnaissable ». Pour un signal de trompette, « indistinct » exprime précisément l’impossibilité d’identifier l’appel.
- source_word: φωνὴν
  choice: un son
  rationale: Bien que φωνή puisse signifier « voix », il désigne dans ce contexte le son produit par la trompette.
- source_word: σάλπιγξ
  choice: la trompette
  rationale: L’article défini convient en français pour présenter de manière générique l’instrument employé comme exemple.
- source_word: δῷ
  choice: émet
  rationale: Le grec dit littéralement « donne », mais « émettre un son » est la collocation française naturelle tout en conservant l’image acoustique.
- source_word: τίς
  choice: qui
  rationale: Le pronom interrogatif introduit directement la question rhétorique.
- source_word: παρασκευάσεται
  choice: se préparera
  rationale: 'La forme moyenne comporte une nuance réflexive : la personne se met elle-même en état d’agir. Le français « se préparera » la rend explicitement.'
- source_word: εἰς πόλεμον
  choice: au combat
  rationale: L’expression signifie littéralement « pour la guerre ». Dans le contexte d’un signal militaire appelant à l’action, « au combat » est plus naturel et précis en français.
