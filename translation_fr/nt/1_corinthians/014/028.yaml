reference: 1 Corinthians 14:28
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐὰν δὲ μὴ ᾖ ⸀διερμηνευτής, σιγάτω ἐν ἐκκλησίᾳ, ἑαυτῷ δὲ λαλείτω καὶ τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/028.yaml
  text: But if there is no interpreter[a], he must keep silent in the church and speak to himself and to God.
translation:
  language: fr
  text: Mais s’il n’y a pas d’interprète, qu’il garde le silence dans l’assemblée[a] et qu’il parle à lui-même et à Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans l’Église » ou « dans la communauté réunie ».
    reason: 'Alternative lexicale pour ἐν ἐκκλησίᾳ : le contexte désigne l’Église rassemblée, non nécessairement un lieu matériel.'
lexical_decisions:
- source_word: διερμηνευτής
  choice: interprète
  rationale: Désigne la personne qui rend intelligible aux autres une parole en langue. « Interprète » est le terme français courant et convient mieux ici que « traducteur ».
- source_word: σιγάτω
  choice: qu’il garde le silence
  rationale: L’impératif présent à la troisième personne exprime une directive. Cette formulation en conserve la force dans un français naturel et digne.
- source_word: ἐν ἐκκλησίᾳ
  choice: dans l’assemblée
  rationale: Dans ce contexte, ἐκκλησία désigne la communauté chrétienne réunie. « Assemblée » met clairement en avant le rassemblement plutôt qu’un bâtiment ou une institution.
- source_word: ἑαυτῷ
  choice: à lui-même
  rationale: Le pronom réfléchi au datif indique une parole qui n’est pas adressée à l’assemblée. La traduction directe évite d’ajouter « en privé » ou « intérieurement », absents du grec.
- source_word: λαλείτω
  choice: qu’il parle
  rationale: Le second impératif poursuit l’instruction relative à la parole. « Parler » est neutre, naturel et fidèle.
- source_word: τῷ θεῷ
  choice: à Dieu
  rationale: Le datif après le verbe « parler » indique que la parole est aussi adressée à Dieu.
- source_word: ἐὰν δὲ μὴ ᾖ
  choice: Mais s’il n’y a pas
  rationale: Cette tournure idiomatique rend naturellement la condition et l’absence éventuelle d’un interprète.
theological_decisions:
- issue: Portée de l’ordre de garder le silence lors du rassemblement
  choice: L’ordre interdit la prise de parole publique dans l’assemblée en l’absence d’interprète, tout en maintenant la possibilité de parler à soi-même et à Dieu.
  alternative: Comprendre soit une interdiction absolue de toute parole, soit l’autorisation de continuer à parler audiblement à l’assemblée.
  rationale: L’opposition entre « garder le silence dans l’assemblée » et « parler à lui-même et à Dieu » limite la parole publique sans préciser si la parole restante est silencieuse ou audible. La formulation conserve cette tension sans imposer une doctrine particulière des dons spirituels.
translation_notes:
  register: Français international moderne, clair et digne. Le double subjonctif exhortatif (« qu’il… et qu’il… ») reproduit le parallélisme des deux impératifs grecs. « Assemblée » évite l’ambiguïté de « église » entre communauté et bâtiment.
