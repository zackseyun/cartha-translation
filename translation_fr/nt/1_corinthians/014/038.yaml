  text: εἰ δέ τις ἀγνοεῖ, ⸀ἀγνοεῖται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/038.yaml
  text: But if anyone does not recognize this[b][a], he is not recognized.
translation:
  language: fr
  text: Mais si quelqu’un ne reconnaît pas[b], il n’est pas reconnu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Certains manuscrits portent : « si quelqu’un est dans l’ignorance, qu’il le reste ». Le texte adopté porte : « si quelqu’un ne reconnaît pas, il n’est pas reconnu ».'
    reason: textual_variant
  - marker: b
    text: 'Ou : « ignore ». Le grec emploie le même verbe à l’actif puis au passif : « ne reconnaît pas… n’est pas reconnu ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ
  choice: si
  rationale: Introduit naturellement en français la condition exprimée par le grec, sans préjuger de sa réalisation.
- source_word: δέ
  choice: mais
  rationale: Marque le contraste avec l’affirmation précédente, où Paul demande que ses paroles soient reconnues comme un commandement du Seigneur.
- source_word: τις
  choice: quelqu’un
  rationale: Rend l’indéfini singulier de façon générique et naturelle.
- source_word: ἀγνοεῖ
  choice: refuse de le reconnaître
  rationale: Dans le prolongement du verset 37, le verbe désigne vraisemblablement non une simple ignorance, mais le défaut de reconnaissance de l’enseignement apostolique. « Refuse » fait ressortir la portée potentiellement volontaire du verbe, tandis que le pronom « le » renvoie à ce qui vient d’être affirmé.
- source_word: ἀγνοεῖται
  choice: il n’est pas reconnu
  rationale: Rend le passif indicatif et conserve, autant que le permet un français naturel, la reprise rhétorique du même verbe à l’actif puis au passif, sans préciser l’agent de cette non-reconnaissance.
theological_decisions:
- issue: Sens du passif ἀγνοεῖται
  choice: La personne qui ne reconnaît pas l’instruction apostolique n’est elle-même pas reconnue.
  alternative: « Qu’il reste dans son ignorance », selon une variante manuscrite; ou « il est ignoré ».
  rationale: Le texte adopté par la SBLGNT porte un indicatif passif, non un impératif. La traduction maintient donc la réciprocité ou la portée judiciaire possible du propos, tout en laissant indéterminé celui qui ne reconnaît pas cette personne.
- issue: Degré d’intention dans ἀγνοεῖ
  choice: « refuse de le reconnaître »
  alternative: « ne le reconnaît pas » ou « l’ignore »
  rationale: Le contexte immédiat oppose la reconnaissance demandée au verset 37 à son rejet. Cette formulation exprime cette dimension sans identifier plus précisément l’objet ou les conséquences que ne le fait le grec.
translation_notes:
  register: Français moderne, sobre et digne. Le parallélisme « reconnaître / reconnu » conserve le jeu rhétorique grec. Les marqueurs sont placés au point précis auquel chaque note se rapporte.
