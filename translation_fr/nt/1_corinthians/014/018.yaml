lexical_decisions:
- source_word: εὐχαριστῶ
  choice: Je remercie
  rationale: Le présent actif à la première personne exprime directement l’action de remercier; cette formulation est naturelle en français moderne.
- source_word: τῷ θεῷ
  choice: Dieu
  rationale: Le datif désigne le complément de εὐχαριστῶ; en français, « remercier Dieu » est la construction idiomatique.
- source_word: πάντων ὑμῶν μᾶλλον
  choice: plus que vous tous
  rationale: Le génitif associé au comparatif μᾶλλον établit une comparaison avec l’ensemble des destinataires, sans devoir préciser davantage si chacun est envisagé individuellement.
- source_word: γλώσσαις
  choice: en langues
  rationale: Dans 1 Corinthiens 12–14, le pluriel désigne le phénomène spirituel en discussion. « Parler en langues » est l’expression française consacrée et laisse ouverte la nature exacte de ces langues.
- source_word: λαλῶ
  choice: de parler
  rationale: Après « Je remercie Dieu », l’infinitif français rend naturellement le contenu de l’action de grâce, tout en conservant la valeur générale du présent grec.
theological_decisions:
- issue: Sens de γλώσσαις dans le contexte des dons spirituels
  choice: en langues
  alternative: en diverses langues
  rationale: « En langues » reprend la terminologie traditionnellement associée au phénomène décrit dans les chapitres 12–14 sans trancher entre langues humaines, parole extatique ou catégorie plus large. L’alternative lexicale est signalée en note.
translation_notes:
  register: Français international moderne, naturel et digne. La tournure concise suit l’ordre logique du grec et conserve l’ambiguïté du terme γλώσσαις.
