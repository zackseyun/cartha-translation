source:
  edition: SBLGNT
  text: ὅμως τὰ ἄψυχα φωνὴν διδόντα, εἴτε αὐλὸς εἴτε κιθάρα, ἐὰν διαστολὴν τοῖς φθόγγοις μὴ ⸀δῷ, πῶς γνωσθήσεται τὸ αὐλούμενον ἢ τὸ κιθαριζόμενον;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/007.yaml
  text: Even lifeless things that produce sound—whether flute or harp—if they do not give a distinction in the notes[a], how will what is played on the flute or on the harp be recognized?
translation:
  language: fr
  text: Même les objets inanimés qui produisent un son — qu’il s’agisse d’une flûte ou d’une lyre — s’ils ne font pas entendre des notes distinctes, comment reconnaîtra-t-on ce qui est joué à la flûte ou à la lyre ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅμως
  choice: Même
  rationale: Introduit avec force l’exemple parallèle des instruments sans vie et s’intègre naturellement au raisonnement en français.
- source_word: τὰ ἄψυχα
  choice: les objets inanimés
  rationale: Désigne des choses dépourvues de vie, ici des instruments de musique. « Objets inanimés » est précis et courant.
- source_word: φωνὴν διδόντα
  choice: qui produisent un son
  rationale: Rend idiomatiquement l’expression littérale « qui donnent un son/une voix » sans attribuer une voix humaine aux instruments.
- source_word: εἴτε αὐλὸς εἴτε κιθάρα
  choice: qu’il s’agisse d’une flûte ou d’une lyre
  rationale: αὐλός désigne un instrument à vent de type flûte ou pipeau, et κιθάρα un ancien instrument à cordes proche de la lyre. « Lyre » est historiquement plus précis que « harpe ».
- source_word: ἐὰν διαστολὴν τοῖς φθόγγοις μὴ δῷ
  choice: s’ils ne font pas entendre des notes distinctes
  rationale: διαστολή exprime la différenciation et φθόγγοι les sons ou tons musicaux. La formulation française communique clairement que les notes doivent pouvoir être distinguées.
- source_word: πῶς γνωσθήσεται
  choice: comment reconnaîtra-t-on
  rationale: Le futur passif de γινώσκω exprime ici le fait que le morceau devient identifiable grâce à la distinction des notes.
- source_word: τὸ αὐλούμενον ἢ τὸ κιθαριζόμενον
  choice: ce qui est joué à la flûte ou à la lyre
  rationale: Les participes passifs substantivés renvoient à ce qui est exécuté sur chacun des deux instruments, sans préciser davantage s’il s’agit d’un air ou d’un morceau.
theological_decisions: []
