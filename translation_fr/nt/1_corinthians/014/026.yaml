source:
  edition: SBLGNT
  text: Τί οὖν ἐστιν, ἀδελφοί; ὅταν συνέρχησθε, ⸀ἕκαστος ψαλμὸν ἔχει, διδαχὴν ἔχει, ⸂ἀποκάλυψιν ἔχει, γλῶσσαν⸃ ἔχει, ἑρμηνείαν ἔχει· πάντα πρὸς οἰκοδομὴν γινέσθω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/026.yaml
  text: What then is it[a], brothers? When you come together, each one has a psalm, has a teaching, has a revelation, has a tongue, has an interpretation[b]. Let all things be done for building up.
translation:
  language: fr
  text: Que faut-il donc en conclure, frères[a] ? Lorsque vous vous réunissez, chacun a un psaume, un enseignement, une révélation, une parole en langue[b], une interprétation. Que tout se fasse pour l’édification.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ici, « frères » s’adresse de manière représentative à toute l’assemblée, femmes comprises.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « une langue ». Le terme grec peut désigner la langue comme organe ou comme langage ; dans ces chapitres, il désigne le phénomène du parler en langues sans en préciser à lui seul la nature exacte.'
    reason: alternative_reading
lexical_decisions:
- source_word: Τί οὖν ἐστιν
  choice: Que faut-il donc en conclure
  rationale: Rend naturellement en français la question rhétorique qui introduit la conclusion pratique de Paul, sans donner à ἐστιν un sens lexical artificiellement précis.
- source_word: ἀδελφοί
  choice: frères
  rationale: Conserve la forme masculine du grec comme adresse représentative à l’ensemble de l’assemblée; une note en explicite la portée inclusive.
- source_word: ὅταν συνέρχησθε
  choice: Lorsque vous vous réunissez
  rationale: Expression française naturelle qui garde la valeur temporelle et répétitive de ὅταν avec le subjonctif.
- source_word: ἕκαστος
  choice: chacun
  rationale: Reproduit clairement la valeur distributive du terme grec.
- source_word: ψαλμὸν
  choice: un psaume
  rationale: Préserve le terme spécifique du grec plutôt que de l’élargir à un chant quelconque.
- source_word: διδαχὴν
  choice: un enseignement
  rationale: Formulation courante et précise, moins systématique que « doctrine » dans ce contexte de participation à l’assemblée.
- source_word: ἀποκάλυψιν
  choice: une révélation
  rationale: Équivalent français usuel qui conserve l’idée d’un dévoilement communiqué dans l’assemblée.
- source_word: γλῶσσαν
  choice: une parole en langue
  rationale: Évite en français l’expression peu naturelle « avoir une langue », tout en maintenant le terme « langue » employé dans cette discussion et sans déterminer la nature exacte du phénomène.
- source_word: ἑρμηνείαν
  choice: une interprétation
  rationale: Correspond au contexte immédiat, où ce qui est dit en langue doit devenir intelligible pour l’assemblée.
- source_word: πάντα πρὸς οἰκοδομὴν γινέσθω
  choice: Que tout se fasse pour l’édification de tous
  rationale: Rend la force directive de γινέσθω et la métaphore constructive de οἰκοδομή dans un français clair; « de tous » explicite la portée communautaire indiquée par le contexte.
theological_decisions:
- issue: Portée de l’adresse masculine ἀδελφοί
  choice: Conserver « frères » dans le texte et préciser en note que toute l’assemblée est visée.
  alternative: frères et sœurs
  rationale: Cette solution garde la forme grammaticale du texte source sans exclure les femmes de la portée de l’exhortation.
- issue: Nature de la γλῶσσα en 1 Corinthiens 12–14
  choice: Employer « parole en langue » sans définir davantage le phénomène.
  alternative: une langue; un langage; une parole extatique
  rationale: Le passage ne tranche pas à lui seul entre langue humaine reconnue, parole extatique ou catégorie plus large; la traduction préserve cette tension.
- issue: Sens communautaire de οἰκοδομή
  choice: « l’édification de tous »
  alternative: la construction; l’affermissement de l’assemblée
  rationale: La métaphore vise ici le bien et la croissance spirituelle de la communauté réunie, non la construction matérielle.
translation_notes:
  register: Français international actuel, digne et accessible. La structure énumérative est légèrement allégée pour rester naturelle, tandis que les catégories de contributions sont conservées. « Édification » maintient la métaphore paulinienne tout en étant éclairé par « de tous ».
