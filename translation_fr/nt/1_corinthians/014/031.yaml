  text: δύνασθε γὰρ καθ’ ἕνα πάντες προφητεύειν, ἵνα πάντες μανθάνωσιν καὶ πάντες παρακαλῶνται
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/031.yaml
  text: For you can all prophesy one by one[b][a], so that all may learn and all may be encouraged.
translation:
  language: fr
  text: En effet, vous pouvez tous prophétiser l’un après l’autre[a], afin que tous apprennent et que tous soient encouragés[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « un à la fois ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « exhortés » ou « consolés » ; le verbe grec peut exprimer l’encouragement, l’exhortation ou la consolation selon le contexte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δύνασθε
  choice: vous pouvez
  rationale: Le présent de l’indicatif exprime ici la capacité ou la possibilité. « Vous pouvez » est naturel en français moderne et convient à cette instruction pratique.
- source_word: γὰρ
  choice: En effet
  rationale: La conjonction introduit l’explication qui fonde l’instruction précédente. « En effet » en rend clairement la valeur explicative.
- source_word: καθ’ ἕνα
  choice: l’un après l’autre
  rationale: L’expression indique une succession ordonnée, une personne à la fois. Cette formulation idiomatique convient au contexte de la prise de parole dans l’assemblée.
- source_word: πάντες
  choice: tous
  rationale: Le mot est répété trois fois dans le grec. « Tous » préserve cette insistance et ne précise pas davantage que le texte les groupes concernés.
- source_word: προφητεύειν
  choice: prophétiser
  rationale: Le terme français établi conserve la catégorie paulinienne sans la réduire à une paraphrase interprétative.
- source_word: ἵνα
  choice: afin que
  rationale: Cette tournure naturelle et digne exprime la visée de l’action, tout en restant ouverte à la nuance de résultat présente dans le contexte.
- source_word: μανθάνωσιν
  choice: apprennent
  rationale: Le présent du subjonctif après ἵνα exprime ici l’objectif pédagogique général. En français, « afin que tous apprennent » rend naturellement cette construction.
- source_word: παρακαλῶνται
  choice: soient encouragés
  rationale: Le passif de παρακαλέω peut évoquer l’encouragement, l’exhortation ou la consolation. Dans le contexte de l’édification de l’assemblée, « encouragés » conserve la portée la plus large, avec une note signalant les autres nuances possibles.
theological_decisions:
- issue: Portée de πάντες (« tous ») dans l’instruction adressée à l’assemblée
  choice: Conserver « tous » à chacune des trois occurrences sans ajouter « vous tous » ni « tous les prophètes ».
  alternative: Préciser « vous tous » ou « tous les prophètes » pour la première occurrence, et « tous les membres de l’assemblée » pour les suivantes.
  rationale: La première occurrence vise vraisemblablement ceux qui sont susceptibles de prophétiser, tandis que les deux suivantes concernent les bénéficiaires de ces paroles. Le grec garde néanmoins la même forme répétée ; la traduction en préserve donc l’ampleur rhétorique et laisse le contexte déterminer les référents.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proche du mouvement explicatif et final du grec. « L’un après l’autre » est idiomatique sans être familier ; les trois occurrences de « tous » sont maintenues pour préserver l’insistance du texte source.
