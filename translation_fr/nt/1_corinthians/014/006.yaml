  text: ⸀Νῦν δέ, ἀδελφοί, ἐὰν ἔλθω πρὸς ὑμᾶς γλώσσαις λαλῶν, τί ὑμᾶς ὠφελήσω, ἐὰν μὴ ὑμῖν λαλήσω ἢ ἐν ἀποκαλύψει ἢ ἐν γνώσει ἢ ἐν προφητείᾳ ἢ ἐν διδαχῇ;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/006.yaml
  text: Now[a], brothers, if I come to you speaking in tongues[b], what will I benefit you unless I speak to you either by revelation or by knowledge or by prophecy or by teaching?
translation:
  language: fr
  text: Maintenant, frères et sœurs[a], si je viens auprès de vous en parlant en langues[b], en quoi vous serai-je utile, à moins que je ne vous parle par une révélation, par une connaissance, par une prophétie ou par un enseignement ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « frères » ; en grec, ce terme peut s’adresser à une assemblée comprenant des hommes et des femmes.
    reason: lexical_alternative
  - marker: b
    text: Ou « en diverses langues » ; le grec peut désigner des langues, mais il renvoie ici au phénomène abordé dans 1 Corinthiens 12–14.
    reason: lexical_alternative
lexical_decisions:
- source_word: Νῦν δέ
  choice: À présent
  rationale: Marque la transition vers l’application immédiate de l’argument de Paul, sans accentuer excessivement une opposition.
- source_word: ἀδελφοί
  choice: frères et sœurs
  rationale: Dans cette adresse communautaire, le masculin pluriel grec désigne vraisemblablement l’ensemble de l’assemblée; cette formulation rend naturellement cette portée en français moderne.
- source_word: γλώσσαις λαλῶν
  choice: en parlant en langues
  rationale: Conserve le terme traditionnel et contextuel « langues » pour le phénomène discuté en 1 Corinthiens 12–14, sans en préciser la nature.
- source_word: τί ὑμᾶς ὠφελήσω
  choice: en quoi vous serai-je utile
  rationale: Rend naturellement l’idée de procurer un avantage ou une aide, tout en conservant la question rhétorique.
- source_word: ἐὰν μὴ ὑμῖν λαλήσω
  choice: à moins de vous communiquer
  rationale: « À moins de » rend la condition négative; « communiquer » explicite ici la parole intelligible adressée à l’assemblée sans ajouter de contenu.
- source_word: ἢ ἐν ἀποκαλύψει ἢ ἐν γνώσει ἢ ἐν προφητείᾳ ἢ ἐν διδαχῇ
  choice: une révélation, une connaissance, une prophétie ou un enseignement
  rationale: La coordination après « communiquer » produit un français idiomatique et conserve les quatre catégories parallèles, l’emploi de ἐν exprimant ici le contenu ou le mode de la communication.
theological_decisions:
- issue: Portée de ἀδελφοί dans l’adresse à l’assemblée
  choice: frères et sœurs
  alternative: frères
  rationale: Le mot grec est masculin pluriel, mais peut inclure une assemblée mixte. Le texte principal rend cette portée probable; la note signale la forme littérale.
- issue: Nature des γλῶσσαι en 1 Corinthiens 12–14
  choice: langues
  alternative: langages
  rationale: « Langues » correspond à l’usage chrétien français et maintient l’ambiguïté du grec quant à la nature précise du phénomène, sans décider s’il s’agit de langues humaines identifiables ou d’une autre forme de parole inspirée.
- issue: Relation entre les quatre termes introduits par ἐν
  choice: quatre contenus ou modes distincts de communication
  alternative: par une révélation, par une connaissance, par une prophétie ou par un enseignement
  rationale: La formulation française conserve la série sans définir les rapports théologiques entre révélation, connaissance, prophétie et enseignement.
translation_notes:
  register: Français international actuel, digne et oralement fluide. La question rhétorique est conservée. « Communiquer » évite la répétition lourde de « parler » et permet une énumération naturelle, sans résoudre la nature des langues ni les rapports entre les quatre formes de parole édifiante.
