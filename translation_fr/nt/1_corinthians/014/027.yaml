  yaml_path: translation/nt/1_corinthians/014/027.yaml
  text: If anyone speaks in a tongue[a], let there be two, or at most three, and each in turn, and let one interpret.
translation:
  language: fr
  text: Si quelqu’un parle en langue[a], qu’ils soient deux, ou trois tout au plus, l’un après l’autre, et que l’un interprète.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « dans une langue ». Le mot grec peut désigner une langue ou une manière de parler en langue. Ici, « en langue » reprend la terminologie employée dans ce chapitre sans trancher la question de la nature de ce don.'
    reason: Alternative lexicale
lexical_decisions:
- source_word: γλώσσῃ
  choice: en langue
  rationale: Cette expression reprend la terminologie établie en français pour le phénomène charismatique traité en 1 Corinthiens 12–14, sans préciser s’il s’agit d’une langue humaine ou d’une autre forme de parole.
- source_word: τις
  choice: quelqu’un
  rationale: Le pronom indéfini a ici une valeur générale et non spécifique dans la proposition conditionnelle.
- source_word: λαλεῖ
  choice: parle
  rationale: Le présent convient à cette règle générale et se rend naturellement par le présent simple en français.
- source_word: κατὰ δύο ἢ τὸ πλεῖστον τρεῖς
  choice: que deux personnes le fassent, ou trois tout au plus
  rationale: La tournure grecque limite à deux, ou au maximum trois, le nombre de personnes qui prennent la parole; cet léger explicitation produit une consigne claire en français.
- source_word: ἀνὰ μέρος
  choice: chacune à son tour
  rationale: L’expression exige une prise de parole successive, et non simultanée; « à son tour » en restitue naturellement la force distributive.
- source_word: εἷς
  choice: une seule personne
  rationale: Le numéral substantivé désigne une personne chargée de l’interprétation; « une seule personne » conserve explicitement l’idée d’unité.
- source_word: διερμηνευέτω
  choice: interprète
  rationale: Le présent impératif appelle à rendre la parole intelligible pour l’assemblée. « Interpréter » est le terme français consacré et n’impose pas le sens plus étroit de « traduire ».
theological_decisions:
- issue: Nature de la γλῶσσα dans le contexte des dons spirituels
  choice: Employer « en langue » dans le texte principal pour désigner le phénomène abordé en 1 Corinthiens 12–14, sans définir la nature de cette parole.
  alternative: Employer « dans une langue » ou préciser qu’il s’agit soit d’une langue humaine étrangère, soit d’une parole extatique.
  rationale: Le verset réglemente l’usage du don sans trancher le débat sur sa nature. La formulation retenue préserve cette ouverture et la tension théologique du texte.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve la forme conditionnelle et la valeur prescriptive du grec, tout en explicitant sobrement les personnes qui prennent successivement la parole.
