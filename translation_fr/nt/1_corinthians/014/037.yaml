id: 1CO.14.37
reference: 1 Corinthians 14:37
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Εἴ τις δοκεῖ προφήτης εἶναι ἢ πνευματικός, ἐπιγινωσκέτω ἃ γράφω ὑμῖν ὅτι κυρίου ⸀ἐστίν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/037.yaml
  text: If anyone thinks he is a prophet or spiritual[a], let him recognize that what I am writing to you is a command of the Lord.
translation:
  language: fr
  text: Si quelqu’un pense être prophète ou spirituel, qu’il reconnaisse que ce que je vous écris est un commandement du Seigneur.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autres traductions : « est du Seigneur » ou « appartient au Seigneur ». Le grec dit littéralement : « est du Seigneur » ; le mot « commandement » est ajouté dans la traduction principale pour expliciter l’ellipse.'
    reason: La formule grecque κυρίου ἐστίν est elliptique. La note conserve la formulation littérale et signale explicitement l'ajout interprétatif, sans en faire un élément exprimé dans le texte grec.
lexical_decisions:
- source_word: δοκεῖ
  choice: pense
  rationale: Dans ce contexte, le verbe exprime l’idée que quelqu’un se considère ou se prétend prophète ou spirituel. « Pense » est naturel et conserve la possible nuance corrective.
- source_word: προφήτης
  choice: prophète
  rationale: Équivalent français usuel dans le contexte des dons spirituels et de la parole prophétique.
- source_word: πνευματικός
  choice: spirituel
  rationale: Le terme peut désigner une personne qui se considère comme animée ou douée par l’Esprit. « Spirituel » préserve la concision et l’étendue du grec sans préciser davantage.
- source_word: ἐπιγινωσκέτω
  choice: qu’il reconnaisse
  rationale: L’impératif appelle à reconnaître ou admettre l’autorité de l’instruction apostolique. Cette formulation est naturelle et conserve cette force.
- source_word: ἃ γράφω ὑμῖν
  choice: ce que je vous écris
  rationale: Rend naturellement le relatif et le présent épistolaire du grec.
- source_word: κυρίου ἐστίν
  choice: est un commandement du Seigneur
  rationale: La construction grecque est elliptique, littéralement « est du Seigneur ». Dans le contexte, « un commandement » explicite l’autorité normative affirmée, tout en signalant en note la formulation plus littérale.
theological_decisions:
- issue: Valeur elliptique de κυρίου ἐστίν
  choice: « est un commandement du Seigneur »
  alternative: « est du Seigneur » ou « appartient au Seigneur »
  rationale: Le contexte porte sur l’autorité des directives écrites par Paul. L’ajout de « commandement » explicite l’ellipse probable sans masquer que ce nom n’apparaît pas dans le grec; la note conserve l’ambiguïté formelle.
- issue: Genre grammatical de τις … προφήτης … πνευματικός
  choice: Employer le masculin générique « quelqu’un… qu’il »
  alternative: Employer une formulation épicène ou reprendre par « cette personne »
  rationale: Le grec est au masculin singulier et vise de manière générique tout individu formulant cette prétention. Le français soutenu emploie ici naturellement le masculin générique.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proche du grec tout en étant idiomatique; « spirituel » conserve la brièveté et l’ambiguïté du terme source.
