id: 1CO.14.2
reference: 1 Corinthians 14:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ γὰρ λαλῶν γλώσσῃ οὐκ ἀνθρώποις λαλεῖ ⸀ἀλλὰ θεῷ, οὐδεὶς γὰρ ἀκούει, πνεύματι δὲ λαλεῖ μυστήρια·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/002.yaml
  text: For the one speaking in a tongue does not speak to people but to God, for no one understands; rather, he speaks mysteries in the Spirit.
translation:
  language: fr
  text: En effet, celui qui parle en langue ne parle pas aux êtres humains, mais à Dieu, car personne ne comprend[a] ; mais, en esprit[b], il dit des mystères.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « personne n’entend ». Le verbe grec peut signifier « entendre » ou, par implication dans ce contexte, « comprendre ».
    reason: lexical_alternative
  - marker: b
    text: L’expression grecque peut désigner l’Esprit Saint ou l’esprit de la personne qui parle.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ λαλῶν
  choice: celui qui parle
  rationale: L’article suivi du participe présent forme une expression substantive générique. « Celui qui parle » conserve le singulier du grec dans un français naturel.
- source_word: γλώσσῃ
  choice: en langue
  rationale: Le datif singulier désigne ici le phénomène du parler en langue. Cette formulation respecte le singulier sans préciser s’il s’agit d’une langue humaine identifiable.
- source_word: ἀνθρώποις
  choice: aux êtres humains
  rationale: Le pluriel est générique et ne vise pas uniquement les hommes de sexe masculin.
- source_word: θεῷ
  choice: à Dieu
  rationale: Le datif complète directement le verbe « parler ».
- source_word: ἀκούει
  choice: comprend
  rationale: Le verbe signifie littéralement « entend », mais il peut, dans ce contexte consacré à l’intelligibilité du discours, exprimer l’idée de comprendre. Le sens littéral est signalé en note.
- source_word: πνεύματι
  choice: dans l’Esprit
  rationale: Cette formulation rend le datif sans imposer explicitement une valeur instrumentale. La majuscule retient comme lecture principale une référence à l’Esprit Saint, tandis que l’autre interprétation est conservée en note.
- source_word: μυστήρια
  choice: mystères
  rationale: « Mystères » conserve la portée paulinienne du terme et évite de le réduire à de simples secrets.
- source_word: δὲ
  choice: ponctuation contrastive après le point-virgule
  rationale: Dans cette phrase, δέ introduit la précision contrastive finale. Le point-virgule et l’antéposition de « dans l’Esprit » rendent ce mouvement avec naturel sans ajouter un connecteur lourd.
theological_decisions:
- issue: Référent de πνεύματι
  choice: « dans l’Esprit » dans le texte principal
  alternative: « en esprit », au sens de l’esprit de la personne qui parle
  rationale: Le datif grec permet de comprendre soit l’Esprit Saint, soit l’esprit du locuteur. La lecture principale est indiquée sans supprimer l’autre possibilité, qui demeure explicitement présentée en note.
translation_notes:
  register: Français international moderne, digne et accessible. « En langue » conserve la formulation traditionnelle sans interpréter excessivement la nature du phénomène. La structure reste proche du grec tout en étant fluide en français.
