  text: ἀλλὰ ἐν ἐκκλησίᾳ θέλω πέντε λόγους ⸂τῷ νοΐ⸃ μου λαλῆσαι, ἵνα καὶ ἄλλους κατηχήσω, ἢ μυρίους λόγους ἐν γλώσσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/019.yaml
  text: But in the church I would rather speak five words with my mind[a], so that I may also instruct others, than ten thousand words in a tongue.
translation:
  language: fr
  text: Mais, dans l’Église, je préfère dire cinq paroles avec mon intelligence, afin d’instruire aussi les autres, plutôt que dix mille paroles en langue[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le mot grec peut désigner la langue, comme organe, ou une langue. Ici, il renvoie au genre de parole dont il est question dans 1 Corinthiens 12–14 ; on pourrait aussi traduire : « dans une langue ».'
    reason: Préserver l’ambiguïté lexicale et théologique de γλῶσσα sans imposer une interprétation du phénomène.
lexical_decisions:
- source_word: ἐν ἐκκλησίᾳ
  choice: dans l’Église
  rationale: Dans ce contexte, ἐκκλησία désigne la communauté chrétienne réunie. « Dans l’Église » est naturel en français et conserve la dimension communautaire sans réduire le terme au bâtiment.
- source_word: θέλω … ἢ
  choice: je préfère … plutôt que
  rationale: Bien que θέλω signifie littéralement « je veux », la construction comparative exprime ici une préférence; cette formulation française rend clairement le contraste.
- source_word: πέντε λόγους
  choice: cinq paroles
  rationale: Le choix de « paroles » préserve le décompte concret et le contraste rhétorique avec « dix mille paroles », tout en convenant mieux que « mots » à des énoncés prononcés.
- source_word: τῷ νοΐ μου
  choice: avec mon intelligence
  rationale: Cette expression conserve la référence au νοῦς et indique une parole comprise et mentalement engagée, sans la paraphraser simplement comme « de manière intelligible ».
- source_word: λαλῆσαι
  choice: prononcer
  rationale: Avec le complément « cinq paroles », « prononcer » est idiomatique en français et exprime l’acte public de parler.
- source_word: ἵνα καὶ ἄλλους κατηχήσω
  choice: afin d’instruire aussi les autres
  rationale: κατηχέω désigne ici l’instruction orale. « Instruire » en restitue le sens sans importer le sens ecclésial technique plus tardif de « catéchiser ».
- source_word: μυρίους λόγους
  choice: dix mille paroles
  rationale: La valeur numérique explicite de μύριοι maintient l’opposition frappante entre cinq et dix mille, même si le nombre a une portée hyperbolique.
- source_word: ἐν γλώσσῃ
  choice: en langue
  rationale: Cette tournure reprend l’expression française usuelle « parler en langue », respecte le singulier grec et ne tranche pas la question débattue de la nature exacte de cette parole.
theological_decisions:
- issue: Sens de γλῶσσα dans 1 Corinthiens 12–14
  choice: en langue
  alternative: dans une langue
  rationale: « En langue » conserve la terminologie propre au développement de Paul et l’ambiguïté du grec, sans définir le phénomène comme une langue étrangère ordinaire ni comme une parole extatique.
- issue: Portée de τῷ νοΐ μου
  choice: avec mon intelligence
  alternative: de manière intelligible
  rationale: La traduction retenue préserve le terme anthropologique « intelligence » et le contraste avec la parole en langue; l’alternative expliciterait l’effet communicatif au risque d’effacer la formulation grecque.
translation_notes:
  register: Français international moderne, clair et digne. Le balancement numérique « cinq… dix mille » est conservé. « Église » porte une majuscule pour désigner la communauté réunie, non un bâtiment; « en langue » maintient le vocabulaire du contexte sans explication confessionnelle.
