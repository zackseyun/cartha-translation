id: 1CO.14.24
reference: 1 Corinthians 14:24
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐὰν δὲ πάντες προφητεύωσιν, εἰσέλθῃ δέ τις ἄπιστος ἢ ἰδιώτης, ἐλέγχεται ὑπὸ πάντων, ἀνακρίνεται ὑπὸ πάντων,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/024.yaml
  text: But if all prophesy[a], and some unbeliever or uninstructed person enters, he is convicted by all; he is examined by all.
translation:
  language: fr
  text: Mais si tous prophétisent et qu’entre un non-croyant ou une personne non initiée[a], cette personne est convaincue par tous, examinée par tous.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une personne extérieure ». Le terme grec peut désigner quelqu’un qui n’est pas informé, qui n’est pas initié ou qui ne fait pas partie du groupe prenant la parole.
    reason: alternative_reading
lexical_decisions:
- source_word: πάντες
  choice: tous
  rationale: Conserve le quantificateur inclusif qui désigne, dans ce contexte, les membres de l’assemblée prenant la parole.
- source_word: προφητεύωσιν
  choice: prophétisent
  rationale: Maintient la catégorie paulinienne employée tout au long du chapitre, sans la réduire à une simple parole inspirée.
- source_word: ἄπιστος
  choice: quelqu’un qui ne croit pas
  rationale: Exprime naturellement en français actuel la personne qui ne partage pas la foi, sans suggérer seulement l’infidélité morale.
- source_word: ἰδιώτης
  choice: une personne non avertie
  rationale: Rend l’idée d’une personne qui ne connaît pas ou ne comprend pas les pratiques de l’assemblée, sans lui attribuer un statut ecclésiastique moderne.
- source_word: ἐλέγχεται
  choice: est convaincue
  rationale: Conserve l’idée que la parole entendue met la personne intérieurement en cause et lui fait reconnaître sa situation, sans expliciter un complément absent du grec.
- source_word: ἀνακρίνεται
  choice: examinée
  rationale: Rend l’idée d’un examen attentif ou d’une évaluation, sans aller jusqu’à une condamnation définitive.
- source_word: ὑπὸ πάντων
  choice: par tous
  rationale: Préserve la répétition rhétorique du grec et l’action collective de ceux qui prophétisent.
- source_word: δέ
  choice: Mais / et
  rationale: Le premier δέ marque le contraste avec le cas précédent; la seconde articulation est rendue naturellement dans la proposition conditionnelle française.
- source_word: τις
  choice: quelqu’un
  rationale: Préserve le caractère indéfini de la personne qui entre.
theological_decisions:
- issue: Sens de ἰδιώτης dans le contexte de l’assemblée
  choice: une personne non avertie
  alternative: une personne extérieure
  rationale: Le contexte immédiat porte sur l’intelligibilité et sur l’effet des paroles de l’assemblée auprès de quelqu’un qui n’en possède pas les repères. La traduction retenue ne décide pas que cette personne est nécessairement totalement extérieure à la communauté; l’autre lecture plausible est signalée en note.
- issue: Portée de ἐλέγχεται et ἀνακρίνεται
  choice: est convaincue… examinée
  alternative: est confondue… jugée
  rationale: Cette formulation garde la progression entre la mise en cause intérieure et l’examen, tout en évitant de transformer la scène en condamnation judiciaire ou eschatologique.
translation_notes:
  register: Français international moderne, clair et digne. La reprise « cette personne » évite une ambiguïté de référent et permet une formulation inclusive sans alourdir la phrase. La répétition « par tous » est conservée pour refléter l’insistance du grec.
