id: 1CO.14.33
reference: 1 Corinthians 14:33
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὐ γάρ ἐστιν ἀκαταστασίας ὁ θεὸς ἀλλὰ εἰρήνης), ὡς ἐν πάσαις ταῖς ἐκκλησίαις τῶν ἁγίων.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/033.yaml
  text: For God is not a God of disorder but of peace[b][a], as in all the churches of the saints.
translation:
  language: fr
  text: Car Dieu n’est pas un Dieu de désordre, mais de paix[a], comme dans toutes les Églises des saints[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Car Dieu n’est pas un Dieu de confusion, mais de paix. »'
    reason: Alternative lexicale pour ἀκαταστασίας.
  - marker: b
    text: 'Ou : « comme c’est le cas dans toutes les Églises du peuple saint de Dieu ». Certains rattachent cette proposition au verset suivant plutôt qu’à celui-ci.'
    reason: Formulation explicative de τῶν ἁγίων et préservation de l’autre rattachement syntaxique possible.
lexical_decisions:
- source_word: ἀκαταστασίας
  choice: désordre
  rationale: Dans le contexte du culte communautaire, le terme désigne un état de désorganisation ou de confusion. « Désordre » conserve sa portée concrète sans le réduire à la seule confusion mentale.
- source_word: εἰρήνης
  choice: paix
  rationale: « Paix » est l’équivalent français courant et maintient le contraste avec le désordre dans l’assemblée.
- source_word: ὁ θεὸς
  choice: Dieu
  rationale: En français, le nom propre « Dieu » s’emploie naturellement sans article ici; la répétition « un Dieu » rend la construction caractérisante du grec.
- source_word: ὡς
  choice: comme dans
  rationale: Cette formulation compacte conserve le lien comparatif avec ce qui précède, tout en laissant à la note la possibilité du rattachement au verset suivant.
- source_word: ἐκκλησίαις
  choice: Églises
  rationale: « Églises » est le terme ecclésial français établi pour les assemblées chrétiennes locales; la majuscule suit un usage biblique éditorial courant.
- source_word: τῶν ἁγίων
  choice: des saints
  rationale: « Saints » conserve la désignation paulinienne habituelle des croyants et son registre théologique, tandis qu’une formulation explicative est donnée en note.
- source_word: γάρ
  choice: Car
  rationale: « Car » exprime naturellement la justification apportée aux consignes précédentes sur l’ordre dans l’assemblée.
theological_decisions:
- issue: Rattachement de ὡς ἐν πάσαις ταῖς ἐκκλησίαις τῶν ἁγίων
  choice: Rattaché au verset 33 comme comparaison avec ce qui se passe dans toutes les Églises
  alternative: Rattaché au verset 34, comme début d’une nouvelle phrase sur la conduite dans les Églises
  rationale: La ponctuation fournie par la SBLGNT rattache la proposition au verset 33. Comme le grec ancien ne possédait pas la ponctuation moderne et que le rattachement syntaxique est débattu, l’autre lecture est signalée en note sans trancher silencieusement.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation reste proche de la structure grecque tout en étant idiomatique. « Désordre » convient au contexte du culte communautaire; « saints » préserve le vocabulaire paulinien traditionnel.
