source:
  edition: SBLGNT
  text: ἐὰν οὖν συνέλθῃ ἡ ἐκκλησία ὅλη ἐπὶ τὸ αὐτὸ καὶ πάντες ⸂λαλῶσιν γλώσσαις⸃, εἰσέλθωσιν δὲ ἰδιῶται ἢ ἄπιστοι, οὐκ ἐροῦσιν ὅτι μαίνεσθε;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/023.yaml
  text: Therefore[a], if the whole church comes together in one place and all speak in tongues, and uninstructed people or unbelievers enter[b], will they not say that you are out of your minds?
translation:
  language: fr
  text: Si donc l’Église tout entière se réunit au même endroit et que tous parlent en langues[a], et si des personnes non initiées[b] ou des non-croyants entrent, ne diront-ils pas que vous avez perdu la raison ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression grecque peut aussi se comprendre comme « parlent dans des langues ». Le terme peut désigner des langues, mais le grec ne précise pas ici la nature exacte du phénomène.
    reason: alternative_reading
  - marker: b
    text: Ou « des personnes sans connaissance particulière ». Le terme grec désigne probablement des gens qui ne sont pas au fait des pratiques de l’assemblée, et il est distingué ici de « non-croyants ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκκλησία
  choice: Église
  rationale: Dans l’usage paulinien, le terme désigne couramment la communauté chrétienne réunie. « Église » est naturel en français moderne, tandis que le rassemblement concret est déjà exprimé par « se réunit ».
- source_word: ὅλη
  choice: tout entière
  rationale: L’expression souligne que l’ensemble de la communauté est présent et s’accorde idiomatiquement avec « l’Église ».
- source_word: ἐπὶ τὸ αὐτό
  choice: au même endroit
  rationale: Cette locution indique ici la réunion en un même lieu et conserve sa dimension spatiale sans répéter simplement « ensemble ».
- source_word: λαλῶσιν γλώσσαις
  choice: parlent en langues
  rationale: « Parler en langues » est l’expression consacrée en français pour le phénomène charismatique de 1 Corinthiens 12–14. Elle garde aussi le lien lexical avec le sens ordinaire de γλῶσσα, sans déterminer la nature exacte du phénomène.
- source_word: ἰδιῶται
  choice: personnes non initiées
  rationale: Le terme désigne des personnes qui ne sont pas au fait de la pratique ou du cadre en question. « Non initiées » maintient leur distinction d’avec les « non-croyants », même si les catégories peuvent se recouper.
- source_word: ἄπιστοι
  choice: non-croyants
  rationale: Équivalent français actuel et clair pour ceux qui ne croient pas, distinct dans la formulation de ἰδιῶται.
- source_word: μαίνεσθε
  choice: vous avez perdu la raison
  rationale: Cette tournure française naturelle exprime l’accusation de folie sans archaïsme ni registre excessivement familier.
- source_word: οὐκ ἐροῦσιν ὅτι
  choice: ne diront-ils pas que
  rationale: La question négative appelle une réponse affirmative et conserve le futur du grec.
- source_word: οὖν
  choice: donc
  rationale: « Donc » marque clairement la conclusion tirée de l’argument précédent, dans un registre naturel.
- source_word: συνέλθῃ
  choice: se réunit
  rationale: Le verbe exprime le fait de se rassembler ; « se réunit » convient naturellement à une Église et évite la lourdeur de « se rassemble ensemble ».
theological_decisions:
- issue: Nature de γλώσσαι en 1 Corinthiens 14
  choice: « langues » dans l’expression « parler en langues »
  alternative: « langues étrangères » ou une formulation explicitant un langage extatique
  rationale: Le grec peut désigner des langues, mais le passage ne tranche pas à lui seul entre toutes les compréhensions du phénomène charismatique. L’expression française consacrée préserve cette ouverture et n’ajoute ni « étrangères » ni « extatiques ».
- issue: Relation entre ἰδιῶται et ἄπιστοι
  choice: 'Maintenir deux désignations distinctes : « personnes non initiées » et « non-croyants »'
  alternative: Fusionner les deux catégories sous « personnes de l’extérieur »
  rationale: La conjonction disjonctive ἤ et les deux termes grecs invitent à conserver une distinction, sans préciser davantage la relation exacte entre les groupes.
translation_notes:
  register: Français international moderne, digne et accessible. La structure conditionnelle et la question rhétorique du grec sont conservées. Les marqueurs [a] et [b] figurent dans le texte principal.
