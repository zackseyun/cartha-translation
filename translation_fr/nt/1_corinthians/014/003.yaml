id: 1CO.14.3
reference: 1 Corinthians 14:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ δὲ προφητεύων ἀνθρώποις λαλεῖ οἰκοδομὴν καὶ παράκλησιν καὶ παραμυθίαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/003.yaml
  text: But the one who prophesies speaks to people for edification and encouragement and consolation[a][b][c].
translation:
  language: fr
  text: Mais celui qui prophétise parle aux êtres humains pour les faire grandir[a], les encourager[b] et les réconforter[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « pour la construction »; on peut aussi traduire : « pour les édifier » ou « pour les affermir ».'
    reason: lexical_alternative
  - marker: b
    text: Le mot grec peut également signifier « les exhorter » ou, dans certains contextes, « les consoler ».
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « les consoler ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ προφητεύων
  choice: Mais celui qui prophétise
  rationale: Le participe présent substantivé désigne la personne qui accomplit l’action. « Celui qui prophétise » conserve cette structure en français naturel, tandis que « mais » rend le léger contraste marqué par δέ avec le verset précédent.
- source_word: ἀνθρώποις
  choice: aux êtres humains
  rationale: Le datif pluriel désigne les destinataires de la parole et s’applique ici sans distinction de sexe. Cette formulation rend explicite la portée générique du grec.
- source_word: λαλεῖ
  choice: parle
  rationale: Traduction directe du présent de λαλέω. Le complément indirect français « aux êtres humains » exprime naturellement les destinataires.
- source_word: οἰκοδομὴν
  choice: pour les faire grandir
  rationale: οἰκοδομή évoque littéralement la construction et, dans cet emploi paulinien, le développement ou l’affermissement de la communauté. « Faire grandir » exprime cette métaphore de manière actuelle et accessible; « pour » explicite la valeur d’effet ou de finalité de la série à l’accusatif.
- source_word: παράκλησιν
  choice: les encourager
  rationale: παράκλησις peut désigner l’encouragement, l’exhortation ou parfois le réconfort. « Encourager » reste naturel et le distingue du terme suivant, qui porte plus nettement l’idée d’apaisement.
- source_word: παραμυθίαν
  choice: les réconforter
  rationale: παραμυθία désigne une parole de consolation, de réconfort ou d’apaisement. « Réconforter » préserve la distinction avec παράκλησις tout en employant un français courant.
theological_decisions:
- issue: Sens de « prophétise » dans le cadre de l’assemblée
  choice: Conserver « prophétise » sans réduire le terme à la prédication ni le préciser comme une prédiction extatique.
  alternative: « prêche » ou « transmet une révélation »
  rationale: Le verset oppose la prophétie aux langues et décrit ses effets sur les autres. Le terme français « prophétise » maintient l’étendue et la tension théologiques du grec sans imposer une définition confessionnelle.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation verbale coordonnée évite les substantifs abstraits et rend clairement les trois effets de la parole prophétique. Les trois termes grecs restent distincts, et les notes signalent leur champ sémantique sans résoudre artificiellement leurs recoupements.
