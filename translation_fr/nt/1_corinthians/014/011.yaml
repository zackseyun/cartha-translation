  text: ἐὰν οὖν μὴ εἰδῶ τὴν δύναμιν τῆς φωνῆς, ἔσομαι τῷ λαλοῦντι βάρβαρος καὶ ὁ λαλῶν ἐν ἐμοὶ βάρβαρος.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/011.yaml
  text: Therefore[a], if I do not know the meaning of the voice, I will be a foreigner to the one speaking[b], and the one speaking will be a foreigner to me.
translation:
  language: fr
  text: Si donc je ne connais pas le sens de cette voix[a], je serai un étranger[b] pour celui qui parle, et celui qui parle sera un étranger pour moi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la force de la voix » ; il s’agit de la signification communiquée par ce qui est entendu.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « un barbare » ; ici, quelqu’un dont la langue ou la parole est étrangère ou incompréhensible pour l’autre, et non nécessairement une personne non civilisée.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν οὖν μὴ εἰδῶ
  choice: Si donc je ne connais pas
  rationale: « Si donc » conserve à la fois la condition exprimée par ἐὰν et le lien logique marqué par οὖν. « Je ne connais pas » reste proche du sens fondamental de οἶδα, sans exclure l’idée contextuelle de compréhension.
- source_word: τὴν δύναμιν τῆς φωνῆς
  choice: le sens de la voix
  rationale: Dans ce contexte, δύναμις désigne la valeur intelligible ou la signification portée par la voix ou le son. « Le sens de la voix » communique cette idée tout en gardant le terme concret φωνή.
- source_word: τῷ λαλοῦντι
  choice: pour celui qui parle
  rationale: Cette formulation française naturelle rend le participe substantivé et la relation exprimée par le datif.
- source_word: βάρβαρος
  choice: un étranger
  rationale: Ici, le mot désigne une personne dont la parole est étrangère ou inintelligible pour l’autre, sans impliquer nécessairement qu’elle soit inculte ou brutale.
- source_word: ἐν ἐμοὶ
  choice: pour moi
  rationale: Dans cette construction réciproque, « pour moi » exprime naturellement le point de vue relationnel indiqué par ἐν ἐμοί.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. La répétition « celui qui parle » et la réciprocité de la phrase grecque sont conservées. « Étranger » évite le sens péjoratif moderne de « barbare », tandis que la note maintient le lien avec le terme grec.
