  text: ἢ ἀφ’ ὑμῶν ὁ λόγος τοῦ θεοῦ ἐξῆλθεν, ἢ εἰς ὑμᾶς μόνους κατήντησεν;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/036.yaml
  text: Or did the word of God go out from you[b][a], or has it reached only you?
translation:
  language: fr
  text: Ou bien est-ce de chez vous que la parole de Dieu est sortie[a] ? Ou bien n’est-elle parvenue qu’à vous seuls[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « a-t-elle eu son origine chez vous ? »'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « est-elle arrivée à vous seuls ? »'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ
  choice: Ou bien… Ou…
  rationale: La particule disjonctive introduit les deux volets de la question rhétorique. « Ou bien » rend naturellement en français l’ouverture vive de la réplique, sans transformer la particule en exclamation.
- source_word: ἀφ’ ὑμῶν
  choice: de vous
  rationale: La préposition ἀπό avec le génitif marque ici la source ou l’origine. « De vous » conserve directement cette idée sans préciser davantage sa portée.
- source_word: ὁ λόγος τοῦ θεοῦ
  choice: la parole de Dieu
  rationale: Cette expression paulinienne garde toute son ampleur et son poids, sans la limiter explicitement à l’Évangile ou à une parole prophétique prononcée dans l’assemblée.
- source_word: ἐξῆλθεν
  choice: est partie
  rationale: Le verbe signifie littéralement « sortir, partir ». « Est partie » préserve l’image d’une parole qui se diffuse depuis un point de départ, tandis que la note signale le sens contextuel possible « avoir son origine ».
- source_word: εἰς ὑμᾶς μόνους
  choice: qu’à vous seuls
  rationale: 'Cette formulation française naturelle maintient l’accent de μόνους sur l’exclusivité : les Corinthiens ne sont pas les seuls destinataires.'
- source_word: κατήντησεν
  choice: est-elle parvenue
  rationale: Le verbe καταντάω exprime l’arrivée à une destination. « Parvenir » convient au déplacement figuré de la parole et conserve le contraste avec son point de départ.
theological_decisions:
- issue: Référent de « la parole de Dieu »
  choice: Conserver l’expression générale « la parole de Dieu »
  alternative: Préciser « le message de l’Évangile » ou « la parole prophétique dans l’assemblée »
  rationale: Dans ce contexte, Paul reproche aux Corinthiens de se comporter comme s’ils étaient la source ou les seuls destinataires du message divin faisant autorité. Le grec n’impose pas ici une restriction à un seul sens technique ; la traduction préserve donc cette ouverture.
translation_notes:
  register: Français international actuel, digne et direct. La structure en deux questions conserve la vigueur de la réprimande rhétorique. « Vous seuls » vise collectivement les membres de l’assemblée de Corinthe.
