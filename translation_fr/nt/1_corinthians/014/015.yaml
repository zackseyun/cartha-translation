  text: τί οὖν ἐστιν; προσεύξομαι τῷ πνεύματι, προσεύξομαι δὲ καὶ τῷ νοΐ· ψαλῶ τῷ πνεύματι, ψαλῶ δὲ καὶ τῷ νοΐ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/015.yaml
  text: What then is to be done? I will pray with the spirit[a], but I will also pray with the mind; I will sing praise with the spirit[c][b], but I will also sing praise with the mind.
translation:
  language: fr
  text: Que faut-il donc faire ? Je prierai avec l’esprit[a], mais je prierai aussi avec l’intelligence[b] ; je chanterai avec l’esprit[c], mais je chanterai aussi avec l’intelligence.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans l’esprit » ou « par l’esprit ». Le grec ne précise pas explicitement si « esprit » désigne l’Esprit Saint, l’esprit de celui qui parle ou une expression spirituelle.
    reason: lexical_alternative
  - marker: b
    text: Ou « avec la compréhension ».
    reason: lexical_alternative
  - marker: c
    text: Ou « je chanterai des louanges » ou « je ferai entendre une mélodie ».
    reason: lexical_alternative
lexical_decisions:
- source_word: τί οὖν ἐστιν;
  choice: Que faut-il donc faire ?
  rationale: La formule introduit ici la conclusion pratique du raisonnement. Cette tournure est naturelle en français moderne et rend mieux sa fonction rhétorique qu’un littéral « Qu’est-ce donc ? ».
- source_word: προσεύξομαι
  choice: je prierai
  rationale: Le futur de προσεύχομαι signifie simplement « je prierai » ; la voix moyenne n’exige pas de formulation réfléchie distincte en français.
- source_word: τῷ πνεύματι
  choice: avec l’esprit
  rationale: « Avec » préserve la valeur instrumentale ou modale du datif ainsi que le parallélisme avec « avec l’intelligence », sans décider s’il s’agit de l’esprit humain, de l’Esprit Saint ou d’une expression spirituelle.
- source_word: τῷ νοΐ
  choice: avec l’intelligence
  rationale: νοῦς désigne ici la faculté de comprendre et de penser consciemment. « Intelligence » exprime clairement ce sens en français et maintient le contraste avec « esprit ».
- source_word: ψαλῶ
  choice: je chanterai les louanges
  rationale: Dans ce contexte cultuel, ψάλλω désigne le chant de louange. Cette formulation explicite naturellement l’objet implicite sans imposer l’idée plus particulière d’un accompagnement instrumental.
- source_word: δὲ καὶ
  choice: mais… aussi
  rationale: 'La construction exprime une addition accompagnée d’un léger contraste : Paul ne choisit pas un seul mode, mais y joint l’autre.'
theological_decisions:
- issue: Sens de πνεῦμα dans le contraste entre esprit et intelligence
  choice: Conserver « l’esprit » sans préciser davantage dans le texte principal.
  alternative: « l’Esprit » ou « mon esprit »
  rationale: Le grec ne précise pas explicitement si Paul vise l’esprit humain, l’Esprit Saint ou une expression spirituelle. La traduction conserve donc cette ambiguïté réelle au lieu de trancher théologiquement.
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme des deux propositions grecques est conservé, tandis que la répétition de « les louanges » dans la dernière proposition est remplacée par le pronom « les » pour une expression française fluide.
