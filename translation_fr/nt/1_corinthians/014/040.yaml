  text: πάντα ⸀δὲ εὐσχημόνως καὶ κατὰ τάξιν γινέσθω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/040.yaml
  text: But let everything be done decently and in order[a].
translation:
  language: fr
  text: Mais que tout se fasse convenablement et avec ordre[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de manière appropriée et dans le bon ordre ». Le grec évoque ce qui convient ainsi qu’un déroulement ordonné.
    reason: Alternative lexicale permettant de préciser les nuances de εὐσχημόνως et κατὰ τάξιν.
lexical_decisions:
- source_word: πάντα
  choice: tout
  rationale: Le neutre pluriel a ici une portée globale. « Tout » est naturel en français et conserve le caractère général de la directive.
- source_word: δὲ
  choice: Mais
  rationale: La particule marque une légère opposition ou une transition récapitulative par rapport aux développements précédents. « Mais » rend clairement ce mouvement discursif.
- source_word: εὐσχημόνως
  choice: convenablement
  rationale: L’adverbe désigne ce qui se fait d’une manière appropriée, digne et conforme aux convenances. « Convenablement » en exprime le sens sans suggérer un modèle liturgique particulier.
- source_word: κατὰ τάξιν
  choice: avec ordre
  rationale: L’expression indique une organisation ou une succession ordonnée. « Avec ordre » est idiomatique et maintient la distinction avec l’idée de convenance exprimée juste avant.
- source_word: γινέσθω
  choice: que tout se fasse
  rationale: L’impératif présent à la troisième personne formule une directive générale. Cette tournure française restitue naturellement sa force sans durcir l’aspect en règlement ponctuel.
theological_decisions:
- issue: Portée du commandement de Paul dans le contexte du culte communautaire
  choice: Une directive générale demandant que tout se déroule de manière convenable et ordonnée dans l’assemblée, sans imposer un modèle liturgique confessionnel déterminé.
  alternative: Une prescription étroite d’un ordre liturgique fixe, ou un principe explicitement étendu à toute pratique ecclésiale au-delà du contexte immédiat.
  rationale: Le verset récapitule la discussion sur les prises de parole et leur organisation dans l’assemblée. La formulation générale du grec est conservée sans préciser davantage la structure ecclésiale.
translation_notes:
  register: Français international moderne, clair et digne. La tournure « que tout se fasse » garde la forme exhortative traditionnelle tout en restant courante; « convenablement » évite le possible sens moral étroit de « décemment ».
