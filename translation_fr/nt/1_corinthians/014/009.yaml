  variant: modern international French
source:
  edition: SBLGNT
  text: οὕτως καὶ ὑμεῖς διὰ τῆς γλώσσης ἐὰν μὴ εὔσημον λόγον δῶτε, πῶς γνωσθήσεται τὸ λαλούμενον; ἔσεσθε γὰρ εἰς ἀέρα λαλοῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/009.yaml
  text: 'So also with you: if through the tongue you do not give intelligible speech[a], how will what is spoken be understood? For you will be speaking into the air.'
translation:
  language: fr
  text: De même, vous aussi, si, par la langue, vous ne prononcez pas des paroles intelligibles[a], comment comprendra-t-on ce qui est dit ? Vous parlerez en effet en l’air.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des paroles distinctes » ou « un message clair ». Le grec désigne une parole reconnaissable et compréhensible pour ceux qui l’entendent.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως καὶ ὑμεῖς
  choice: De même, vous aussi
  rationale: Cette formulation reprend naturellement en français la comparaison avec l’exemple précédent tout en conservant l’adresse directe aux Corinthiens.
- source_word: διὰ τῆς γλώσσης
  choice: par la langue
  rationale: Le choix conserve l’image concrète de la langue et la valeur instrumentale de διά, sans interpréter d’emblée le terme comme désignant une langue particulière.
- source_word: ἐὰν μὴ εὔσημον λόγον δῶτε
  choice: si … vous ne prononcez pas des paroles intelligibles[a]
  rationale: « Prononcez » exprime idiomatiquement l’acte de produire un discours, tandis que le pluriel collectif « des paroles » rend λόγον sans le réduire à un mot isolé. « Intelligibles » met en avant le caractère reconnaissable et compréhensible de l’énoncé.
- source_word: πῶς γνωσθήσεται τὸ λαλούμενον
  choice: comment saura-t-on ce qui est dit ?
  rationale: La tournure impersonnelle française conserve le passif grec dans sa fonction sans préciser un sujet absent du texte. « Saura-t-on » reste proche de γινώσκω, tandis que le contexte indique qu’il s’agit de saisir le contenu exprimé.
- source_word: ἔσεσθε γὰρ εἰς ἀέρα λαλοῦντες
  choice: Vous parlerez en effet en l’air
  rationale: Cette traduction préserve la métaphore grecque de paroles qui n’atteignent aucun auditeur et la relation explicative marquée par γάρ.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et accessible. La structure comparative et l’image de la langue sont conservées, avec une syntaxe française naturelle. « Parler en l’air » est idiomatique et maintient l’image de l’inutilité communicative sans l’expliciter davantage.
