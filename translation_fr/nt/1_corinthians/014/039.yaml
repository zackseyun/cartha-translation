source:
  edition: SBLGNT
  text: ὥστε, ἀδελφοί ⸀μου, ζηλοῦτε τὸ προφητεύειν, καὶ τὸ λαλεῖν ⸂μὴ κωλύετε γλώσσαις⸃·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/039.yaml
  text: So then[a], my brothers, be eager to prophesy, and do not forbid speaking in tongues.
translation:
  language: fr
  text: Ainsi donc, mes frères[a], aspirez avec ardeur à prophétiser et n’interdisez pas de parler en langues.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « mes frères et sœurs »; le grec dit « mes frères », expression qui peut ici s’adresser à toute l’assemblée de manière inclusive.
    reason: alternative lexicale et clarification de la portée du masculin pluriel grec
lexical_decisions:
- source_word: ὥστε
  choice: Ainsi donc
  rationale: Cette conjonction introduit la conclusion pratique de l’enseignement précédent. « Ainsi donc » en conserve la valeur à la fois récapitulative et déductive.
- source_word: ἀδελφοί μου
  choice: mes frères
  rationale: Le vocatif grec est au masculin pluriel et comporte le possessif « mes ». Dans ce contexte, il peut désigner l’ensemble de l’assemblée; une note explicite cette portée possible sans effacer la forme du texte source.
- source_word: ζηλοῦτε
  choice: aspirez avec ardeur
  rationale: L’impératif présent exprime une recherche vive et soutenue. Cette formulation française naturelle restitue l’idée de zèle sans suggérer la jalousie.
- source_word: τὸ προφητεύειν
  choice: à prophétiser
  rationale: L’infinitif substantivé est l’objet de l’exhortation. Après « aspirer », l’infinitif français exprime naturellement l’action visée.
- source_word: μὴ κωλύετε
  choice: n’interdisez pas
  rationale: L’impératif présent accompagné de μή formule une interdiction directe. « N’interdisez pas » convient particulièrement à une consigne régissant la pratique de l’assemblée.
- source_word: τὸ λαλεῖν γλώσσαις
  choice: de parler en langues
  rationale: Cette expression désigne la pratique discutée dans tout le chapitre. « Parler en langues » est la formulation française courante et conserve le pluriel du grec.
theological_decisions:
- issue: Portée du vocatif masculin ἀδελφοί dans une assemblée comprenant des hommes et des femmes
  choice: mes frères, avec une note explicative
  alternative: mes frères et sœurs
  rationale: Le texte grec emploie explicitement le masculin pluriel, tout en pouvant s’adresser de manière inclusive à l’ensemble de l’assemblée. Le texte principal conserve la forme grammaticale et la note signale sa portée possible, sans trancher davantage que la source.
translation_notes:
  register: Français international moderne, clair et digne. « Aspirez avec ardeur » garde la force exhortative de ζηλοῦτε, tandis que « parler en langues » reprend l’expression couramment comprise dans ce contexte biblique.
