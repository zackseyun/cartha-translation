id: 1CO.14.4
reference: 1 Corinthians 14:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ λαλῶν γλώσσῃ ἑαυτὸν οἰκοδομεῖ· ὁ δὲ προφητεύων ἐκκλησίαν οἰκοδομεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/004.yaml
  text: The one who speaks in a tongue builds up himself[c][b][a], but the one who prophesies builds up the church.
translation:
  language: fr
  text: Celui qui parle en langue[a] s’édifie lui-même[b], tandis que celui qui prophétise édifie l’Église[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « dans une langue ». Dans ce chapitre, le terme renvoie vraisemblablement au don du parler en langues, mais la nature exacte de cette parole fait débat.'
    reason: lexical_alternative
  - marker: b
    text: Le grec dit « lui-même » au masculin singulier, employé ici de manière représentative.
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « l’assemblée » ou « la communauté ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ λαλῶν
  choice: Celui qui parle
  rationale: L’article suivi du participe présent désigne ici une personne représentative caractérisée par cette action. Cette formulation conserve aussi le parallélisme avec « celui qui prophétise ».
- source_word: γλώσσῃ
  choice: en langue
  rationale: Le datif singulier sans article est conservé dans une expression française courante en contexte biblique. « En langue » renvoie au phénomène discuté dans ce chapitre sans en définir précisément la nature.
- source_word: ἑαυτὸν
  choice: lui-même
  rationale: Le pronom réfléchi masculin singulier correspond grammaticalement au participe substantivé et garde la portée représentative de la formulation grecque.
- source_word: οἰκοδομεῖ
  choice: édifie
  rationale: Le verbe est employé métaphoriquement pour l’affermissement ou la croissance spirituelle. « Édifier » restitue directement cette image et demeure naturel dans ce contexte.
- source_word: ὁ δὲ προφητεύων
  choice: tandis que celui qui prophétise
  rationale: La tournure reproduit le participe substantivé et exprime le contraste modéré introduit par δέ, sans lui donner une force adversative excessive.
- source_word: ἐκκλησίαν
  choice: l’Église
  rationale: Dans ce contexte paulinien, le mot désigne la communauté chrétienne, particulièrement dans son rassemblement. « L’Église » est la formulation française la plus immédiatement compréhensible, tandis que les autres possibilités sont signalées en note.
theological_decisions:
- issue: Nature de γλώσσῃ dans 1 Corinthiens 12–14
  choice: Employer « en langue » pour désigner le parler en langues sans préciser davantage sa nature
  alternative: Comprendre exclusivement une langue humaine étrangère ou, à l’inverse, une parole extatique
  rationale: Le contexte concerne un don spirituel exercé dans le culte communautaire, mais ne permet pas à ce seul verset de trancher toutes les questions relatives à la nature du phénomène. La formulation retenue préserve cette tension.
- issue: Portée des formes masculines singulières
  choice: Conserver « celui qui… lui-même » avec une valeur représentative
  alternative: Neutraliser la formulation par « la personne qui… elle-même » ou employer un pluriel épicène
  rationale: Le grec présente des formes masculines singulières qui énoncent un principe général. Le français retenu reflète leur nombre et leur genre grammaticaux sans limiter l’énoncé aux hommes.
- issue: Sens communautaire de ἐκκλησίαν
  choice: Traduire par « l’Église » en visant la communauté chrétienne rassemblée
  alternative: « l’assemblée » ou « la communauté »
  rationale: Le contraste porte sur l’édification individuelle et l’édification collective. La traduction ne suppose donc pas ici une institution abstraite, mais la communauté des croyants.
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme du grec est conservé, avec « tandis que » pour rendre le contraste modéré. « En langue » maintient le vocabulaire biblique connu sans imposer une explication confessionnelle du phénomène.
