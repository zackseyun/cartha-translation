  text: ἐὰν δὲ ἄλλῳ ἀποκαλυφθῇ καθημένῳ, ὁ πρῶτος σιγάτω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/030.yaml
  text: But if a revelation is given to another who is seated[b][a], let the first be silent.
translation:
  language: fr
  text: Mais si une révélation est accordée à un autre qui est assis[a], que le premier se taise[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « si quelque chose est révélé à un autre qui est assis ».'
    reason: lexical_alternative
  - marker: b
    text: Autrement dit, le premier intervenant doit cesser de parler pour laisser l’autre prendre la parole.
    reason: contextual_clarification
lexical_decisions:
- source_word: ἐὰν δὲ
  choice: Mais si
  rationale: La conjonction ἐὰν introduit la condition, tandis que δὲ marque ici une légère opposition ou une nouvelle étape dans l’instruction.
- source_word: ἄλλῳ
  choice: à un autre
  rationale: Le datif désigne un autre participant, distinct de celui qui parle déjà.
- source_word: ἀποκαλυφθῇ
  choice: une révélation est accordée
  rationale: Le passif aoriste subjonctif signifie littéralement « soit révélé ». La formulation nominale est naturelle en français dans ce contexte, tout en conservant le passif et sans nommer explicitement l’auteur de la révélation.
- source_word: καθημένῳ
  choice: qui est assis
  rationale: Le participe au datif se rapporte à « un autre » et conserve l’image concrète d’un participant assis dans l’assemblée.
- source_word: ὁ πρῶτος
  choice: le premier
  rationale: Cette formulation reproduit l’expression grecque concise. Dans le contexte, il s’agit du premier intervenant, celui qui est déjà en train de parler.
- source_word: σιγάτω
  choice: que … se taise
  rationale: Cette tournure rend naturellement en français l’impératif à la troisième personne et indique que le premier intervenant doit cesser de parler.
theological_decisions:
- issue: Nature et origine de la révélation dans l’assemblée
  choice: « une révélation est accordée » sans préciser explicitement qui l’accorde
  alternative: « quelque chose est révélé » ou « un autre reçoit une révélation de Dieu »
  rationale: Le contexte laisse entendre une communication venant de Dieu, mais le verset ne nomme pas l’agent. La traduction conserve cette retenue et ne développe pas davantage l’affirmation théologique.
translation_notes:
  register: Français moderne, international et digne. « Est accordée » est idiomatique sans effacer le passif; « que le premier se taise » conserve la concision et la force directive du grec.
