  text: σὺ μὲν γὰρ καλῶς εὐχαριστεῖς, ἀλλ’ ὁ ἕτερος οὐκ οἰκοδομεῖται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/017.yaml
  text: For you are indeed giving thanks well[a], but the other person is not built up.
translation:
  language: fr
  text: Car toi, tu rends bien grâce, mais l’autre n’en est pas édifié.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σὺ
  choice: toi, tu
  rationale: La dislocation naturelle en français marque l’insistance portée par le pronom grec explicite et conserve l’adresse à une seule personne.
- source_word: μὲν γὰρ
  choice: Car toi, tu… mais
  rationale: « Car » garde la valeur explicative de γάρ, tandis que la construction emphatique suivie de « mais » restitue le mouvement concessif et contrastif de μέν… ἀλλά sans alourdir la phrase.
- source_word: καλῶς
  choice: bien
  rationale: Adverbe français courant qui conserve ici l’évaluation positive de l’action.
- source_word: εὐχαριστεῖς
  choice: tu rends grâce
  rationale: « Rendre grâce » exprime naturellement l’action de remercier Dieu dans le contexte de la prière communautaire.
- source_word: ἀλλ’
  choice: mais
  rationale: Conjonction adversative simple qui introduit le contraste principal.
- source_word: ὁ ἕτερος
  choice: l’autre
  rationale: Désigne sans surinterprétation l’autre participant, celui qui entend l’action de grâce.
- source_word: οὐκ οἰκοδομεῖται
  choice: n’en est pas édifié
  rationale: Le passif est conservé et « édifié » maintient en français la métaphore paulinienne de la construction spirituelle; « en » rend explicite le rapport naturel avec l’action précédente sans ajouter une cause étrangère au texte.
theological_decisions:
- issue: Métaphore paulinienne de οἰκοδομέω dans l’assemblée
  choice: n’en est pas édifié
  alternative: n’est pas fortifié
  rationale: « Édifié » préserve la métaphore de construction et son sens communautaire et spirituel, sans la réduire à une simple instruction intellectuelle.
translation_notes:
  register: Français international moderne, sobre et digne. La tournure « toi, tu » conserve l’emphase grecque; « rendre grâce » et « être édifié » sont des expressions bibliques encore compréhensibles et précises.
