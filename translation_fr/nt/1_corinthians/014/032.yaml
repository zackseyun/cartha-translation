  text: And the spirits of prophets are subject to prophets,[a]
translation:
  language: fr
  text: Et les esprits des prophètes sont soumis aux prophètes,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les esprits qui appartiennent aux prophètes sont soumis aux prophètes ». L’expression peut désigner des impulsions prophétiques ou l’activité spirituelle des prophètes et souligne que la prophétie n’abolit pas la maîtrise de soi.'
    reason: Alternative lexicale et clarification de l’ambiguïté contextuelle.
lexical_decisions:
- source_word: καὶ
  choice: Et
  rationale: Conjonction naturelle qui ajoute une affirmation à l’argument précédent et en maintient la continuité.
- source_word: πνεύματα
  choice: les esprits
  rationale: Le pluriel grec désigne le plus naturellement les « esprits ». Le contexte peut évoquer l’impulsion ou l’activité prophétique, mais il vaut mieux ne pas intégrer cette interprétation dans le texte principal.
- source_word: προφητῶν
  choice: des prophètes
  rationale: Le génitif pluriel est rendu simplement, sans trancher entre appartenance et association.
- source_word: προφήταις
  choice: aux prophètes
  rationale: Le datif avec ὑποτάσσεται indique les personnes auxquelles les esprits sont soumis. Cette formulation conserve l’ambiguïté quant à savoir s’il s’agit de chaque prophète ou des prophètes collectivement.
- source_word: ὑποτάσσεται
  choice: se soumettent
  rationale: Avec le sujet neutre pluriel grec, le verbe au singulier se rend naturellement au pluriel en français. La forme pronominale exprime la subordination ou la maîtrise sans préciser au-delà du texte le mécanisme en cause.
theological_decisions:
- issue: Sens de « les esprits des prophètes » et maîtrise de l’activité prophétique
  choice: Conserver l’expression littérale et indiquer en note qu’elle peut désigner les impulsions ou l’activité prophétiques, lesquelles ne soustraient pas les prophètes à la maîtrise de soi.
  alternative: Comprendre les esprits humains des prophètes comme soumis aux autres prophètes, ou comprendre l’expression comme désignant des messages prophétiques évalués par eux.
  rationale: Dans le contexte de l’ordre lors de l’assemblée, la phrase affirme la responsabilité des prophètes, mais sa formulation n’identifie pas explicitement les « esprits » à des impulsions, à des messages ou aux esprits humains. La traduction préserve donc cette tension.
translation_notes:
  register: Français international moderne, digne et direct. « Se soumettent » est plus naturel ici que « sont soumis » tout en gardant l’idée de subordination. La virgule avant l’appel de note suit la ponctuation fournie et marque la continuité avec le verset suivant.
