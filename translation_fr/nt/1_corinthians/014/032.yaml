    issue: Nuance de voix dans « se soumettent »
    rationale: La forme grecque ὑποτάσσεται exprime ici l’état de subordination. En français, « se soumettent » peut suggérer un acte volontaire des esprits; « sont soumis » est plus neutre et plus proche du texte.
  - severity: low
    issue: Accord ambigu dans la note
    rationale: Dans « les impulsions ou l’activité spirituelle associées », le pluriel féminin « associées » ne s’accorde nettement ni avec « impulsions » seul ni avec « activité » seule. Une reformulation élimine ce défaut sans modifier l’explication.
