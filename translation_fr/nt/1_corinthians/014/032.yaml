review_pass:
  verdict: revise
  source_fidelity: 'Le sens de la proposition grecque est bien rendu : πνεύματα προφητῶν désigne littéralement « les esprits des prophètes » et προφήταις marque ceux auxquels ils sont subordonnés. Toutefois, « se soumettent » donne au français une nuance plus active et volontaire que le passif/moyen ὑποτάσσεται. « Sont soumis » reproduit plus exactement la relation de subordination sans en préciser le mécanisme.'
  naturalness: « Les esprits des prophètes sont soumis aux prophètes » est une formulation claire, idiomatique et digne en français international moderne. La note doit également corriger un accord ambigu dans « les impulsions ou l’activité spirituelle associées ».
  terminology: « Esprits », « prophètes » et « soumis » conservent les termes clés et l’ambiguïté voulue. La note explique l’arrière-plan contextuel sans identifier dogmatiquement les « esprits » à une seule réalité.
  issues:
