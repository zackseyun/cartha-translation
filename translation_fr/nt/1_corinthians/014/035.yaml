id: 1CO.14.35
reference: 1 Corinthians 14:35
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἰ δέ τι ⸀μαθεῖν θέλουσιν, ἐν οἴκῳ τοὺς ἰδίους ἄνδρας ἐπερωτάτωσαν, αἰσχρὸν γάρ ἐστιν γυναικὶ ⸂λαλεῖν ἐν ἐκκλησίᾳ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/035.yaml
  text: But if they want to learn anything[a], let them ask their own husbands at home[b], for it is shameful for a woman to speak in the assembly.
translation:
  language: fr
  text: Mais si elles veulent apprendre quelque chose, qu’elles posent leurs questions à leur propre mari, chez elles, car il est honteux qu’une femme[a] parle dans l’assemblée[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qu’une épouse parle dans l’assemblée ». Le mot grec peut désigner soit une femme, soit une épouse, selon le contexte.
    reason: lexical_alternative
  - marker: b
    text: Ou « dans l’Église » ou « dans la communauté »; le grec désigne ici l’assemblée réunie.
    reason: lexical_alternative
lexical_decisions:
- source_word: μαθεῖν
  choice: apprendre
  rationale: L’infinitif exprime directement le fait d’apprendre ou de parvenir à savoir; « apprendre » est ici naturel et fidèle.
- source_word: ἐν οἴκῳ
  choice: chez elles
  rationale: Cette tournure française rend naturellement le cadre domestique et maintient le contraste avec l’assemblée réunie.
- source_word: τοὺς ἰδίους ἄνδρας
  choice: leur propre mari
  rationale: Avec ἰδίους et le contexte domestique, ἄνδρας a très probablement le sens de « maris ». Le singulier distributif est idiomatique en français.
- source_word: ἐπερωτάτωσαν
  choice: qu’elles posent leurs questions à
  rationale: Cette formulation restitue clairement l’impératif d’interroger ou de demander, sans la nuance parfois sévère du verbe français « interroger » employé seul.
- source_word: αἰσχρὸν
  choice: honteux
  rationale: « Honteux » conserve la force morale et sociale du terme grec sans l’atténuer en « inconvenant ».
- source_word: γυναικὶ
  choice: qu’une femme
  rationale: γυνή peut désigner une femme ou une épouse. « Femme » garde la portée générique possible dans le texte principal, tandis qu’une note signale l’autre lecture.
- source_word: λαλεῖν
  choice: parle
  rationale: « Parler » est assez large pour ne pas préciser indûment la nature de la prise de parole visée.
- source_word: ἐν ἐκκλησίᾳ
  choice: dans l’assemblée
  rationale: Dans ce contexte, ἐκκλησία désigne la communauté rassemblée. « Assemblée » évite de faire penser d’abord à un bâtiment ou à une institution.
theological_decisions:
- issue: Portée de l’interdiction concernant la parole des femmes
  choice: Traduire la proposition telle qu’elle est formulée, sans limiter dans le texte principal la parole à une catégorie particulière.
  alternative: Limiter le propos aux questions perturbatrices, à l’évaluation des prophéties, ou le traiter comme une citation de la position des Corinthiens.
  rationale: Le grec dit simplement qu’il est honteux qu’une femme parle dans l’assemblée. La traduction conserve cette tension et ne tranche pas une question exégétique que les mots eux-mêmes ne résolvent pas.
- issue: Sens marital ou générique de γυνή et ἀνήρ
  choice: Employer « mari » pour ἄνδρας et « femme » pour γυναικί, avec « épouse » en note.
  alternative: Employer systématiquement « épouse/mari » ou « femme/homme ».
  rationale: « Leur propre mari » est fortement indiqué par le contexte, mais le singulier γυναικί peut être générique ou marital. La formulation principale et la note préservent cette ambiguïté.
translation_notes:
  register: Français international moderne, naturel et digne. Le singulier distributif « leur propre mari » et la tournure « chez elles » évitent une formulation pesante, tandis que « assemblée » préserve le cadre concret de la communauté réunie.
