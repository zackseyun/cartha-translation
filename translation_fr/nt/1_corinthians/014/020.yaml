source:
  edition: SBLGNT
  text: Ἀδελφοί, μὴ παιδία γίνεσθε ταῖς φρεσίν, ἀλλὰ τῇ κακίᾳ νηπιάζετε, ταῖς δὲ φρεσὶν τέλειοι γίνεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/020.yaml
  text: Brothers[a], do not become children in your thinking, but be infants in evil[b]; yet in your thinking become mature.
translation:
  language: fr
  text: Frères[a], ne devenez pas des enfants dans votre manière de penser. Au contraire, soyez de tout petits enfants pour ce qui est du mal[b], mais, dans votre manière de penser, devenez mûrs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « Frères et sœurs » : le grec emploie le masculin pluriel « frères » pour s’adresser à la communauté.'
    reason: lexical_alternative
  - marker: b
    text: Ou « de la malveillance » ; le mot grec peut désigner le mal en général ou, plus précisément, la méchanceté et la malveillance.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀδελφοί
  choice: Frères
  rationale: Le vocatif masculin pluriel est conservé dans le texte, tandis qu’une note précise qu’il s’adresse ici à l’ensemble de la communauté, femmes comprises.
- source_word: παιδία
  choice: des enfants
  rationale: Le terme désigne des enfants sans imposer un âge précis et prépare le contraste avec les tout-petits et les adultes.
- source_word: γίνεσθε
  choice: ne devenez pas / devenez
  rationale: Cette formulation garde la valeur dynamique de γίνομαι ainsi que la répétition qui structure l’exhortation.
- source_word: ταῖς φρεσίν / ταῖς δὲ φρεσὶν
  choice: dans votre manière de penser
  rationale: φρήν désigne ici la faculté de comprendre et de raisonner. Cette expression est naturelle en français actuel et se répète sans ambiguïté.
- source_word: τῇ κακίᾳ
  choice: pour ce qui est du mal
  rationale: Cette formulation rend le datif de domaine et conserve la portée morale assez large de κακία, sans la réduire d’emblée à la seule malveillance.
- source_word: νηπιάζετε
  choice: soyez de tout petits enfants
  rationale: Le verbe évoque l’état ou la conduite du très jeune enfant. La traduction préserve la différence avec παιδία tout en restant idiomatique en français.
- source_word: τέλειοι
  choice: adultes
  rationale: Dans l’opposition avec les enfants, τέλειοι désigne ceux qui sont parvenus à l’âge adulte, donc mûrs, et non des êtres moralement parfaits.
- source_word: ἀλλὰ ... δὲ
  choice: au contraire ... mais
  rationale: Ces connecteurs rendent les deux contrastes successifs et donnent à la phrase une progression claire en français.
theological_decisions:
- issue: Adresse communautaire au masculin
  choice: Conserver « Frères » dans le texte et signaler en note que l’adresse inclut les femmes de la communauté.
  alternative: « Frères et sœurs »
  rationale: Le grec emploie explicitement le masculin pluriel ἀδελφοί, avec une portée communautaire vraisemblablement inclusive. Le texte garde la forme source et la note en explicite l’étendue.
- issue: Sens de τέλειοι
  choice: « adultes » au sens de personnes mûres dans leur manière de penser
  alternative: « parfaits »
  rationale: Le contraste direct avec παιδία et νηπιάζετε est celui de l’âge et de la maturité. Traduire par « parfaits » risquerait d’introduire ici l’idée de perfection morale absolue.
translation_notes:
  register: Français international moderne, digne et directement compréhensible. La répétition de « dans votre manière de penser » reproduit l’encadrement rhétorique du grec. « De tout petits enfants » évite le registre familier de « bébés », tandis que « adultes » rend nettement l’opposition contextuelle avec l’enfance.
