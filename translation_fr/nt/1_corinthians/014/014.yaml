  text: ἐὰν γὰρ προσεύχωμαι γλώσσῃ, τὸ πνεῦμά μου προσεύχεται, ὁ δὲ νοῦς μου ἄκαρπός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/014.yaml
  text: For if I pray in a tongue[a], my spirit prays[b], but my mind is unfruitful.
translation:
  language: fr
  text: Car si je prie en langue[a], mon esprit prie, mais mon intelligence[b] est sans fruit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « dans une langue ». Le mot grec peut désigner une langue humaine ou, dans le contexte de ce chapitre, la « langue » comme forme de parole inspirée.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « mon entendement ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν γὰρ
  choice: Car si
  rationale: « Car » conserve la valeur explicative de γάρ, tandis que « si » rend naturellement la condition introduite par ἐάν.
- source_word: προσεύχωμαι
  choice: je prie
  rationale: Le présent français convient naturellement à cette proposition conditionnelle et reflète le présent du verbe grec.
- source_word: γλώσσῃ
  choice: en langue
  rationale: Le singulier du grec est conservé. « Langue » peut désigner une langue humaine ou, dans le contexte du chapitre, une parole inspirée dont la nature exacte n’est pas précisée.
- source_word: τὸ πνεῦμά μου
  choice: mon esprit
  rationale: Cette traduction directe maintient le possessif et le contraste avec « mon intelligence », sans identifier explicitement l’esprit humain au Saint-Esprit.
- source_word: προσεύχεται
  choice: prie
  rationale: Le présent simple rend clairement et naturellement le verbe grec.
- source_word: ὁ δὲ νοῦς μου
  choice: mais mon intelligence
  rationale: νοῦς désigne ici la faculté de comprendre ou de penser. « Intelligence » exprime bien ce sens et préserve le contraste avec « esprit ».
- source_word: ἄκαρπός ἐστιν
  choice: reste sans fruit
  rationale: Cette formulation française naturelle conserve la métaphore du fruit portée par l’adjectif ἄκαρπος; « reste » exprime ici l’état sans ajouter une conclusion théologique.
theological_decisions:
- issue: Référent de « mon esprit » (τὸ πνεῦμά μου)
  choice: Conserver « mon esprit », qui désigne le plus naturellement l’esprit de la personne qui prie
  alternative: Le Saint-Esprit agissant dans la personne
  rationale: Le possessif « mon » et le parallèle avec « mon intelligence » favorisent une référence à l’esprit de la personne. La traduction littérale préserve néanmoins la tension du passage sans exclure une action de l’Esprit saint.
- issue: Nature de la « langue » (γλώσσῃ)
  choice: Ne pas préciser s’il s’agit d’une langue humaine ou d’une parole inspirée particulière
  alternative: Identifier explicitement une langue humaine ou une langue extatique
  rationale: Le terme grec et le contexte permettent un débat sur la nature de cette parole. La traduction « en langue », accompagnée d’une note, laisse intacte cette ambiguïté.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe concise suit de près le grec, tandis que « reste sans fruit » conserve l’image originale sans produire une tournure artificielle.
