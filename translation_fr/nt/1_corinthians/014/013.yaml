  text: Therefore[b][a], the one who speaks in a tongue should pray that he may interpret.
translation:
  language: fr
  text: C’est pourquoi celui qui parle en langue[a] doit prier afin d’interpréter[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans une langue ». Le grec dit littéralement « en langue », formulation habituelle dans ce chapitre pour une parole qui nécessite une interprétation.
    reason: lexical_alternative
  - marker: b
    text: 'Le grec emploie le masculin singulier de manière représentative : « celui qui parle » désigne toute personne qui parle en langue.'
    reason: grammatical_clarification
lexical_decisions:
- source_word: Διὸ
  choice: C’est pourquoi
  rationale: Cette conjonction marque une conclusion tirée de ce qui précède; « C’est pourquoi » en conserve clairement la valeur logique dans un français actuel.
- source_word: ὁ λαλῶν
  choice: celui qui parle
  rationale: Le participe présent substantivé désigne de manière générale toute personne qui parle; cette formulation conserve le singulier et l’idée verbale.
- source_word: γλώσσῃ
  choice: en langue
  rationale: Le datif singulier est conservé. Dans ce chapitre, le terme désigne une parole qui doit être interprétée pour être comprise par l’assemblée; « langue » maintient l’ambiguïté quant à la nature précise du phénomène.
- source_word: προσευχέσθω
  choice: doit prier
  rationale: L’impératif présent à la troisième personne exprime une exhortation nette; « doit prier » est naturel en français contemporain sans être archaïque.
- source_word: ἵνα
  choice: afin de pouvoir
  rationale: La tournure exprime ici le but ou le résultat recherché de la prière tout en restant idiomatique en français.
- source_word: διερμηνεύῃ
  choice: interpréter
  rationale: Le verbe désigne l’action de rendre cette parole intelligible aux autres. « Interpréter » convient au contexte sans réduire nécessairement l’acte à une traduction entre langues humaines.
theological_decisions:
- issue: Valeur générique du masculin singulier
  choice: celui qui… pouvoir interpréter
  alternative: la personne qui… pouvoir interpréter
  rationale: Le grec emploie un participe masculin singulier de portée représentative. Le texte français en conserve la forme singulière traditionnelle, tandis qu’une note précise qu’elle vise toute personne concernée et non uniquement les hommes.
- issue: Sens de γλώσσῃ dans 1 Corinthiens 12–14
  choice: en langue
  alternative: dans une langue
  rationale: « En langue » préserve le lien littéraire avec le phénomène charismatique décrit dans le chapitre et n’impose pas une identification précise comme langue humaine ou parole extatique.
- issue: Sujet implicite de διερμηνεύῃ
  choice: la personne qui parle prie afin de pouvoir elle-même interpréter
  alternative: elle prie afin que quelqu’un interprète
  rationale: Le sujet implicite du verbe grec se comprend naturellement comme identique à celui qui prie. La formulation française rend ce lien explicite sans ajouter un autre interprète.
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve le singulier, la force exhortative et l’ambiguïté de « langue », tout en évitant un vocabulaire propre à une tradition confessionnelle.
