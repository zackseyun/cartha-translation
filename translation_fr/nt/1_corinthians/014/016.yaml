source:
  edition: SBLGNT
  text: ἐπεὶ ἐὰν ⸀εὐλογῇς ⸀πνεύματι, ὁ ἀναπληρῶν τὸν τόπον τοῦ ἰδιώτου πῶς ἐρεῖ τὸ Ἀμήν ἐπὶ τῇ σῇ εὐχαριστίᾳ; ἐπειδὴ τί λέγεις οὐκ οἶδεν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/016.yaml
  text: Otherwise[a], if you bless in the spirit, how will the one filling the place of the uninstructed say the Amen at your thanksgiving[c][b], since he does not know what you are saying?
translation:
  language: fr
  text: Autrement, si tu bénis en esprit[b], comment celui qui occupe la place d’une personne sans instruction[a] pourra-t-il dire « Amen » lors de ton action de grâce[c], puisqu’il ne sait pas ce que tu dis ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « d’une personne ordinaire », « de quelqu’un de l’extérieur » ou « d’une personne non experte » ; le terme grec désigne une personne qui ne possède pas l’instruction ou la compétence pertinente.
    reason: lexical_alternative
  - marker: b
    text: Ou « avec l’esprit » ou « par l’Esprit » ; le grec ne précise pas davantage s’il s’agit de l’esprit humain ou d’une parole rendue possible par l’Esprit.
    reason: alternative_reading
  - marker: c
    text: Ici, « action de grâce » désigne le fait de remercier Dieu, sans être nécessairement le terme technique plus tardif « Eucharistie ».
    reason: cultural_note
lexical_decisions:
- source_word: ἐπεὶ ἐὰν
  choice: Autrement, si
  rationale: La combinaison introduit le cas qui découle de l’argument précédent avec une force corrective ou conséquentielle. « Autrement, si » rend ce lien sans réduire ἐπεί à une simple causalité.
- source_word: εὐλογῇς
  choice: tu prononces une bénédiction
  rationale: Dans ce contexte de parole cultuelle, εὐλογέω désigne l’acte oral de bénir. Cette formulation est plus claire en français que le seul verbe « bénir », dont le complément serait ici absent.
- source_word: πνεύματι
  choice: dans l’esprit
  rationale: Le datif peut exprimer le moyen ou la sphère. « Dans l’esprit » conserve cette ouverture et évite de préciser indûment s’il s’agit de l’esprit humain ou d’une parole rendue possible par l’Esprit.
- source_word: ὁ ἀναπληρῶν τὸν τόπον τοῦ ἰδιώτου
  choice: celui qui occupe la place d’une personne non initiée
  rationale: La formulation conserve l’image de quelqu’un qui occupe une place ou une position dans l’assemblée. « Personne non initiée » met en relief son manque de compréhension de la parole prononcée, sans en faire nécessairement un non-croyant.
- source_word: πῶς ἐρεῖ τὸ Ἀμήν
  choice: comment … pourra-t-il répondre « Amen »
  rationale: « Répondre “Amen” » exprime naturellement en français la réponse publique d’assentiment visée par la formule grecque, tandis que « pourra-t-il » fait ressortir l’impossibilité pratique soulignée par la question.
- source_word: ἐπὶ τῇ σῇ εὐχαριστίᾳ
  choice: à ton action de grâce
  rationale: Dans ce contexte, εὐχαριστία désigne les remerciements adressés à Dieu. « Action de grâce » est idiomatique et n’impose pas au mot le sens technique plus tardif d’« Eucharistie ».
- source_word: ἐπειδὴ τί λέγεις οὐκ οἶδεν
  choice: puisqu’il ne sait pas ce que tu dis
  rationale: La traduction suit directement οὐκ οἶδεν tout en laissant le contexte faire comprendre qu’il s’agit d’une parole inintelligible pour l’auditeur.
theological_decisions:
- issue: Référent et valeur de πνεύματι dans le cadre du culte
  choice: dans l’esprit
  alternative: par l’Esprit ; avec ton esprit
  rationale: Le grec ne tranche pas explicitement entre l’esprit du locuteur, l’Esprit Saint ou une parole produite sous son action, et le datif lui-même admet plusieurs nuances. La traduction ne résout donc pas cette tension.
- issue: Sens de εὐχαριστία
  choice: action de grâce
  alternative: Eucharistie
  rationale: Le contexte immédiat porte sur des remerciements prononcés à voix haute et compris par l’assemblée. Employer ici le terme technique « Eucharistie » importerait une précision sacramentelle que le grec n’exige pas.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe garde la progression argumentative et l’image de la place occupée dans l’assemblée, tout en employant l’expression française naturelle « répondre “Amen” ». Les formulations et les notes préservent les ambiguïtés lexicales et théologiques du grec.
