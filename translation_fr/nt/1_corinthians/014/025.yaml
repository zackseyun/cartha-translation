reference: 1 Corinthians 14:25
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸀τὰ κρυπτὰ τῆς καρδίας αὐτοῦ φανερὰ γίνεται, καὶ οὕτως πεσὼν ἐπὶ πρόσωπον προσκυνήσει τῷ θεῷ, ἀπαγγέλλων ὅτι ⸂Ὄντως ὁ θεὸς⸃ ἐν ὑμῖν ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/025.yaml
  text: the secrets of his heart become evident[a], and so, falling on his face, he will worship God, declaring that God truly is among you.
translation:
  language: fr
  text: 'les secrets de son cœur deviennent manifestes, et alors, tombant face contre terre, il adorera Dieu et déclarera : « Dieu est vraiment parmi vous[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Dieu est vraiment en vous. »'
    reason: Le grec ἐν ὑμῖν peut désigner la présence de Dieu au milieu de la communauté ou en elle.
lexical_decisions:
- source_word: τὰ κρυπτὰ
  choice: les secrets
  rationale: Le substantif neutre pluriel désigne ce qui est caché au-dedans de la personne. « Les secrets » est naturel en français et convient au contexte de dévoilement intérieur.
- source_word: τῆς καρδίας αὐτοῦ
  choice: de son cœur
  rationale: « Cœur » conserve le terme anthropologique biblique, qui désigne ici le siège des pensées et des dispositions intérieures.
- source_word: φανερὰ γίνεται
  choice: deviennent manifestes
  rationale: Cette formulation garde la valeur de processus de γίνεται et exprime que ce qui était caché vient au grand jour.
- source_word: καὶ οὕτως
  choice: et alors
  rationale: Dans ce contexte, οὕτως relie le dévoilement intérieur à la réaction qui en résulte. « Et alors » rend naturellement cette progression en français.
- source_word: πεσὼν ἐπὶ πρόσωπον
  choice: tombant face contre terre
  rationale: Cette expression française claire et actuelle restitue la posture concrète de prosternation.
- source_word: προσκυνήσει τῷ θεῷ
  choice: il adorera Dieu
  rationale: Le verbe désigne ici l'adoration adressée à Dieu; la posture physique est déjà exprimée par « tombant face contre terre ».
- source_word: ἀπαγγέλλων
  choice: et déclarera
  rationale: Le participe accompagne l'action principale et introduit l'aveu solennel prononcé par la personne.
- source_word: Ὄντως
  choice: vraiment
  rationale: « Vraiment » rend de façon naturelle l'insistance de l'adverbe sur la réalité de la présence divine.
- source_word: ἐν ὑμῖν
  choice: parmi vous
  rationale: Le contexte immédiat est celui de l'assemblée réunie; « parmi vous » exprime donc naturellement la présence de Dieu au milieu de la communauté, sans effacer l'autre sens possible.
theological_decisions:
- issue: Sens de ἐν ὑμῖν dans la déclaration finale
  choice: parmi vous
  alternative: en vous
  rationale: Le contexte porte sur l'assemblée chrétienne et sur la reconnaissance, par une personne extérieure, de la présence de Dieu au milieu d'elle. Toutefois, ἐν peut aussi exprimer une présence intérieure; cette ambiguïté réelle est conservée en note.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve le mouvement du grec, du dévoilement des réalités intérieures à la prosternation et à la confession. « Face contre terre » évite un calque moins idiomatique, tandis que « deviennent manifestes » préserve l'idée d'une mise au jour progressive.
