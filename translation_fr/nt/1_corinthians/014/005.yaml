id: 1CO.14.5
reference: 1 Corinthians 14:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: θέλω δὲ πάντας ὑμᾶς λαλεῖν γλώσσαις, μᾶλλον δὲ ἵνα προφητεύητε· μείζων ⸀δὲ ὁ προφητεύων ἢ ὁ λαλῶν γλώσσαις, ἐκτὸς εἰ μὴ ⸀διερμηνεύῃ, ἵνα ἡ ἐκκλησία οἰκοδομὴν λάβῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/005.yaml
  text: I want all of you to speak in tongues[a], but even more that you would prophesy. The one who prophesies is greater than the one who speaks in tongues, unless he interprets[b], so that the church may receive edification.
translation:
  language: fr
  text: Je veux que vous parliez tous en langues, mais plus encore que vous prophétisiez. Celui qui prophétise est plus grand que celui qui parle en langues, à moins que ce dernier n’interprète[a], afin que l’Église soit édifiée[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « à moins que quelqu’un n’interprète ». Le verbe grec au singulier peut désigner celui qui parle en langues ou, plus généralement dans ce contexte, indiquer qu’une interprétation est donnée.'
    reason: alternative_reading
  - marker: b
    text: 'Littéralement : « afin que l’Église reçoive une édification ». L’image évoque la construction et, au sens figuré, l’affermissement de la communauté rassemblée.'
    reason: lexical_alternative
lexical_decisions:
- source_word: θέλω
  choice: Je voudrais
  rationale: Exprime directement le souhait personnel de Paul dans un français naturel, sans introduire de marqueur temporel absent du grec.
- source_word: πάντας ὑμᾶς
  choice: que vous… tous
  rationale: Rend explicitement la totalité des destinataires tout en suivant l’ordre naturel du français.
- source_word: λαλεῖν γλώσσαις
  choice: parliez… en langues
  rationale: « Parler en langues » est l’expression française consacrée dans ce contexte et conserve le terme γλώσσαις sans décider s’il s’agit de langues humaines identifiables.
- source_word: μᾶλλον δὲ
  choice: mais plus encore
  rationale: Marque une préférence comparative, non un rejet du parler en langues.
- source_word: ἵνα προφητεύητε
  choice: que vous prophétisiez
  rationale: Après θέλω, la proposition exprime ce que Paul souhaite; le subjonctif français convient naturellement.
- source_word: μείζων
  choice: plus grand
  rationale: Conserve le comparatif du grec et laisse le but final préciser qu’il s’agit ici de la valeur pour l’édification communautaire.
- source_word: ὁ προφητεύων
  choice: Celui qui prophétise
  rationale: Rend naturellement le participe substantivé générique.
- source_word: ὁ λαλῶν γλώσσαις
  choice: celui qui parle en langues
  rationale: Maintient le parallélisme avec « Celui qui prophétise ».
- source_word: ἐκτὸς εἰ μὴ
  choice: à moins que
  rationale: Équivalent français idiomatique de la clause d’exception.
- source_word: διερμηνεύῃ
  choice: ce dernier n’interprète
  rationale: Le verbe singulier renvoie le plus naturellement, dans la syntaxe immédiate, à celui qui parle en langues; « ce dernier » clarifie ce renvoi sans exclure en note l’autre possibilité contextuelle.
- source_word: ἡ ἐκκλησία
  choice: l’Église
  rationale: Désigne ici la communauté chrétienne rassemblée; « Église » est naturel et usuel en français biblique moderne.
- source_word: οἰκοδομὴν λάβῃ
  choice: soit édifiée
  rationale: Rend idiomatiquement l’image de la construction appliquée à la croissance et à l’affermissement de la communauté.
theological_decisions:
- issue: Supériorité relative de la prophétie sur le parler en langues
  choice: Conserver « plus grand » tout en laissant la proposition finale en définir la portée communautaire.
  alternative: Rendre par « plus utile » ou comprendre une supériorité de rang spirituel.
  rationale: Le texte formule une comparaison forte, mais son but explicite est l’édification de l’Église. La traduction préserve les deux éléments sans transformer la comparaison en hiérarchie de valeur personnelle.
- issue: Sujet de διερμηνεύῃ
  choice: 'Comprendre en premier lieu celui qui parle en langues : « à moins que ce dernier n’interprète ».'
  alternative: « à moins que quelqu’un n’interprète » ou « à moins qu’il y ait une interprétation ».
  rationale: Sans sujet nouvellement exprimé, le singulier renvoie naturellement au locuteur mentionné juste avant. Toutefois, le contexte plus large permet qu’une autre personne interprète; cette ambiguïté est signalée en note.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve le vocabulaire théologique courant (« prophétiser », « parler en langues », « Église », « édifier »), tout en évitant l’expression moins naturelle « recevoir une édification ». Les deux appels de note figurent dans le texte.
