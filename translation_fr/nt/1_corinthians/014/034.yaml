reference: 1 Corinthians 14:34
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Αἱ ⸀γυναῖκες ἐν ταῖς ἐκκλησίαις σιγάτωσαν, οὐ γὰρ ⸀ἐπιτρέπεται αὐταῖς λαλεῖν· ἀλλὰ ⸀ὑποτασσέσθωσαν, καθὼς καὶ ὁ νόμος λέγει.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/034.yaml
  text: The women should keep silent in the churches[a], for they are not permitted to speak, but should be in submission[c][b], just as the law also says.
translation:
  language: fr
  text: Que les femmes gardent le silence dans les assemblées[a], car il ne leur est pas permis de parler[b]; mais qu’elles soient soumises, comme le dit aussi la loi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les épouses gardent le silence dans les assemblées »; le mot grec peut signifier « femme » ou « épouse » selon le contexte.
    reason: alternative_reading
  - marker: b
    text: Le verset ne précise pas lui-même de quel type de parole il s’agit; certains comprennent cette consigne de manière plus restreinte à partir du contexte.
    reason: lexical_alternative
  - marker: c
    text: Ou « la Loi »; Paul peut désigner précisément la Loi mosaïque ou, plus largement, l’Écriture.
    reason: alternative_reading
lexical_decisions:
- source_word: γυναῖκες
  choice: les femmes
  rationale: γυνή peut désigner une femme ou une épouse. Le verset ne mentionnant pas explicitement les maris, le sens plus large est retenu dans le texte, tandis que l’autre possibilité est signalée en note.
- source_word: ἐκκλησίαις
  choice: assemblées
  rationale: Dans ce contexte, ἐκκλησία désigne les communautés chrétiennes réunies. « Assemblées » rend clairement le cadre des rassemblements sans suggérer principalement des bâtiments.
- source_word: σιγάτωσαν
  choice: gardent le silence
  rationale: L’impératif présent exprime ici le fait de se taire ou de ne pas prendre la parole, comme dans les emplois voisins du même verbe au cours du chapitre.
- source_word: ἐπιτρέπεται
  choice: il ne leur est pas permis
  rationale: Cette formulation naturelle en français conserve la valeur passive et impersonnelle du grec.
- source_word: λαλεῖν
  choice: parler
  rationale: λαλέω est un verbe général qui signifie parler. La traduction n’en précise pas davantage la nature, puisque le verset lui-même ne le fait pas.
- source_word: ὑποτασσέσθωσαν
  choice: qu’elles se tiennent dans la soumission
  rationale: Le moyen-passif impératif décrit une attitude ou une conduite de soumission. Cette formulation conserve l’injonction sans préciser envers qui elle s’exerce, élément que le verset ne formule pas.
- source_word: νόμος
  choice: la loi
  rationale: La minuscule évite de trancher typographiquement entre une référence précise à la Loi mosaïque et une référence plus large à l’Écriture.
- source_word: καθὼς καὶ ὁ νόμος λέγει
  choice: comme le dit aussi la loi
  rationale: Cette formulation restitue la comparaison introduite par καθώς ainsi que la valeur additive de καί.
theological_decisions:
- issue: Référent de γυναῖκες
  choice: les femmes dans les assemblées
  alternative: les épouses dans les assemblées
  rationale: Le mot grec permet les deux sens, mais le verset ne mentionne pas de maris qui imposeraient le sens d’« épouses ». L’ambiguïté est conservée au moyen d’une note.
- issue: Portée de l’interdiction de parler
  choice: ne pas préciser dans le texte principal le type de parole visé
  alternative: limiter l’interdiction aux paroles perturbatrices ou à l’évaluation des prophéties
  rationale: Le grec dit simplement « parler ». Les limitations proposées à partir du contexte relèvent de l’interprétation et ne doivent pas être introduites silencieusement dans la traduction.
- issue: Référent de ὁ νόμος
  choice: la loi
  alternative: la Loi mosaïque précisément, ou l’Écriture plus largement
  rationale: Paul ne cite ici aucun passage particulier et le référent exact reste discuté. La traduction maintient cette ouverture.
translation_notes:
  register: Français international moderne, digne et directement compréhensible. « Assemblées » met en relief les communautés réunies; « se tiennent dans la soumission » préserve la tension du texte sans ajouter de destinataire absent du verset.
