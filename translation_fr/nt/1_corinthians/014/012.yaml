source:
  edition: SBLGNT
  text: οὕτως καὶ ὑμεῖς, ἐπεὶ ζηλωταί ἐστε πνευμάτων, πρὸς τὴν οἰκοδομὴν τῆς ἐκκλησίας ζητεῖτε ἵνα περισσεύητε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/012.yaml
  text: So also you[a], since you are eager for spiritual gifts, seek to abound for the building up of the church.
translation:
  language: fr
  text: De même, vous aussi, puisque vous aspirez aux dons spirituels[a], cherchez à abonder en vue de l’édification de l’Église.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « esprits ». Selon le contexte, le terme peut désigner des réalités, des dons ou des manifestations spirituels.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως καὶ ὑμεῖς
  choice: De même, vous aussi
  rationale: Reprend naturellement en français la comparaison et l’enchaînement avec l’argument précédent.
- source_word: ἐπεὶ
  choice: puisque
  rationale: Exprime le fondement de l’exhortation sans alourdir la phrase.
- source_word: ζηλωταί
  choice: passionnés par
  rationale: Rend le substantif désignant des personnes animées d’un vif désir; cette formulation est naturelle en français moderne.
- source_word: πνευμάτων
  choice: manifestations spirituelles
  rationale: Le pluriel grec est littéralement « esprits » et reste elliptique. Dans le contexte des chapitres 12–14, il vise les manifestations liées à l’Esprit, sans nécessairement se limiter à une liste de « dons »; l’ambiguïté est signalée en note.
- source_word: πρὸς τὴν οἰκοδομὴν τῆς ἐκκλησίας
  choice: pour faire grandir l’Église
  rationale: Communique clairement la finalité communautaire de l’image de la construction. « Faire grandir » reste accessible et inclut l’idée de fortifier la communauté.
- source_word: ζητεῖτε ἵνα περισσεύητε
  choice: cherchez à en avoir en abondance
  rationale: Conserve l’exhortation à rechercher et la notion d’abondance. Le pronom « en » reprend naturellement les manifestations spirituelles en français, même si l’objet de περισσεύητε demeure implicite en grec.
theological_decisions:
- issue: Sens de πνευμάτων
  choice: manifestations spirituelles
  alternative: esprits; réalités spirituelles; dons spirituels
  rationale: Le contexte concerne les manifestations de l’Esprit, notamment la prophétie et les langues. « Manifestations spirituelles » évite de faire croire qu’il s’agit de rechercher plusieurs esprits et résout moins étroitement le terme que « dons spirituels ». La note conserve la forme littérale et les principales possibilités.
- issue: Finalité de l’abondance
  choice: pour faire grandir l’Église
  alternative: afin d’abonder en vue de l’édification de l’Église
  rationale: La préposition πρὸς indique l’orientation vers la croissance de la communauté. La traduction ne fait pas de l’édification un don distinct, mais la finalité régulatrice de la recherche des manifestations spirituelles.
translation_notes:
  register: Français international moderne, naturel et digne. « Église » désigne ici la communauté rassemblée. La tournure évite le terme plus technique « édification », tout en conservant sa portée communautaire.
