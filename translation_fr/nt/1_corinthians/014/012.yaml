review_pass:
  verdict: revise
  source_fidelity: La formulation « en avoir en abondance » introduit un complément explicite (« en », les manifestations) que le grec ne formule pas. περισσεύητε est employé absolument et son abondance est orientée vers l’édification de l’Église. Une traduction française peut conserver cette ellipse par « abonder ».
  naturalness: « De même, vous aussi » et « puisque vous aspirez à » sont naturels en français moderne. « Abonder en vue de l’édification » est légèrement soutenu, mais précis, idiomatique dans ce registre et conserve la métaphore paulinienne sans paraphrase réductrice.
  terminology: « Dons spirituels » est contextuellement justifié dans 1 Corinthiens 12–14; la note doit toutefois signaler que πνευμάτων signifie littéralement « esprits » et peut avoir une portée plus large. « Édification » préserve le terme-clé οἰκοδομή mieux que « faire grandir », qui peut suggérer principalement une croissance numérique ou quantitative.
  issues:
  - severity: medium
    issue: Le pronom « en » dans « cherchez à en avoir en abondance » explicite l’objet de περισσεύητε.
    rationale: Le grec ne dit pas explicitement « abonder en dons »; il appelle à abonder avec l’édification de l’Église comme orientation. L’explicitation est possible en paraphrase, mais elle n’est pas nécessaire et réduit l’ellipse source.
  - severity: low
    issue: « Faire grandir l’Église » affaiblit la métaphore et l’étendue de οἰκοδομή.
    rationale: οἰκοδομή désigne l’édification, c’est-à-dire le renforcement de la communauté, et non nécessairement son accroissement. « Édification » est un terme français courant dans ce contexte et plus fidèle.
  revised_text: De même, vous aussi, puisque vous aspirez aux dons spirituels[a], cherchez à abonder en vue de l’édification de l’Église.
  revised_footnotes:
  - marker: a
    text: 'Littéralement : « esprits ». Selon le contexte, le terme peut désigner des réalités, des dons ou des manifestations spirituels.'
    reason: alternative_reading
  revision_rationale: La révision supprime l’objet ajouté à « abonder », conserve l’orientation exprimée par πρὸς (« en vue de ») et restitue οἰκοδομή par « édification ». Le choix contextuel « dons spirituels » demeure accompagné d’une note qui préserve les possibilités plus littérales ou plus larges du grec.
