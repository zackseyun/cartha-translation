revisions:
- from: De même, vous aussi, puisque vous êtes passionnés par les manifestations spirituelles[a], cherchez à en avoir en abondance pour faire grandir l’Église.
  to: De même, vous aussi, puisque vous aspirez aux dons spirituels[a], cherchez à abonder en vue de l’édification de l’Église.
  rationale: La révision supprime l’objet ajouté à « abonder », conserve l’orientation exprimée par πρὸς (« en vue de ») et restitue οἰκοδομή par « édification ». Le choix contextuel « dons spirituels » demeure accompagné d’une note qui préserve les possibilités plus littérales ou plus larges du grec.
