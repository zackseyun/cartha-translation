  text: ὥστε αἱ γλῶσσαι εἰς σημεῖόν εἰσιν οὐ τοῖς πιστεύουσιν ἀλλὰ τοῖς ἀπίστοις, ἡ δὲ προφητεία οὐ τοῖς ἀπίστοις ἀλλὰ τοῖς πιστεύουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/022.yaml
  text: So then[a], tongues are for a sign not to those who believe but to unbelievers[b], while prophecy is not to unbelievers but to those who believe.
translation:
  language: fr
  text: Ainsi donc, le parler en langues[a] est un signe, non pour ceux qui croient, mais pour les non-croyants[b] ; tandis que la prophétie n’est pas pour les non-croyants, mais pour ceux qui croient.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme grec peut aussi désigner des langues. Dans 1 Corinthiens 12–14, « le parler en langues » conserve la terminologie employée par Paul sans trancher la question débattue de la nature exacte de ce parler.
    reason: lexical_alternative
  - marker: b
    text: À la lumière de la citation précédente d’Ésaïe 28.11-12, certains comprennent ici « un signe » comme un signe de jugement.
    reason: cross_reference
lexical_decisions:
- source_word: ὥστε
  choice: Ainsi donc
  rationale: Introduit la conclusion tirée de l’argument précédent et en conserve clairement la force logique dans un français naturel.
- source_word: γλῶσσαι
  choice: les langues
  rationale: Le mot grec désigne littéralement des « langues » et, dans 1 Corinthiens 12–14, appartient au vocabulaire établi du parler en langues. Ce choix préserve l’ambiguïté sur la nature exacte du phénomène.
- source_word: εἰς σημεῖόν εἰσιν
  choice: sont un signe
  rationale: Rend de façon concise la fonction ou le résultat exprimé par εἰς avec l’accusatif, sans préciser si le signe est favorable ou judiciaire.
- source_word: τοῖς πιστεύουσιν
  choice: pour ceux qui croient
  rationale: Le participe substantivé garde ici sa valeur verbale ; cette formulation transparente maintient aussi le contraste avec les non-croyants.
- source_word: τοῖς ἀπίστοις
  choice: pour les non-croyants
  rationale: Rend avec concision le contraste religieux et communautaire entre ἄπιστοι et ceux qui croient.
- source_word: προφητεία
  choice: la prophétie
  rationale: Terme direct et consacré pour le don ou l’activité prophétique dont Paul traite dans ce chapitre.
- source_word: δὲ
  choice: tandis que
  rationale: Marque naturellement en français l’opposition parallèle entre les langues et la prophétie.
theological_decisions:
- issue: Sens de γλῶσσαι dans le contexte des dons spirituels
  choice: « les langues » sans les définir davantage
  alternative: « des langues étrangères » ou « des paroles extatiques »
  rationale: Le phénomène précis reste débattu. La formulation retenue correspond au vocabulaire paulinien traditionnel en français sans imposer une interprétation confessionnelle.
- issue: Valeur du signe pour les non-croyants
  choice: « un signe » sans qualification
  alternative: « un signe de confirmation » ou « un signe de jugement »
  rationale: Le contexte, notamment la citation précédente d’Ésaïe 28.11-12, permet plusieurs compréhensions. Le grec ne qualifie pas explicitement le signe, et la traduction conserve cette tension.
translation_notes:
  register: Français international moderne, clair et digne. La structure antithétique du grec est conservée, avec la répétition de « non-croyants » et de « ceux qui croient » pour maintenir le parallélisme et l’insistance du texte source.
