id: 1CO.14.29
reference: 1 Corinthians 14:29
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: προφῆται δὲ δύο ἢ τρεῖς λαλείτωσαν, καὶ οἱ ἄλλοι διακρινέτωσαν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/029.yaml
  text: Let two or three prophets speak[a], and let the others weigh what is said.
translation:
  language: fr
  text: Que deux ou trois prophètes parlent, et que les autres évaluent[a] ce qui est dit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « jugent », « discernent » ou « examinent ». Le verbe grec peut désigner l’évaluation d’une parole prophétique.
    reason: lexical_alternative
lexical_decisions:
- source_word: προφῆται
  choice: prophètes
  rationale: Le nom désigne des prophètes ou des personnes qui parlent prophétiquement. « Prophètes » est le rendu direct et convient aux instructions de Paul concernant la prise de parole dans l’assemblée.
- source_word: δὲ
  choice: et
  rationale: La particule marque ici une transition légère dans une suite d’instructions. « Et » assure un enchaînement naturel sans introduire un contraste trop appuyé.
- source_word: δύο ἢ τρεῖς
  choice: deux ou trois
  rationale: L’expression numérique est rendue directement.
- source_word: λαλείτωσαν
  choice: qu’ils parlent
  rationale: 'L’impératif grec à la troisième personne est rendu par une tournure française injonctive naturelle : « Que deux ou trois prophètes parlent ».'
- source_word: οἱ ἄλλοι
  choice: les autres
  rationale: Le grec ne précise pas s’il s’agit des autres prophètes, de responsables ou du reste de l’assemblée. « Les autres » conserve cette indétermination.
- source_word: διακρινέτωσαν
  choice: évaluent ce qui est dit
  rationale: Dans ce contexte, le verbe évoque l’examen ou le discernement de la parole prophétique. « Évaluent ce qui est dit » exprime clairement l’objet implicite du verbe sans suggérer une condamnation judiciaire.
theological_decisions:
- issue: Identité des « autres » dans l’assemblée
  choice: Conserver la formulation générale « les autres ».
  alternative: Préciser « les autres prophètes » ou « le reste de l’assemblée ».
  rationale: Le texte grec ne définit pas explicitement ce groupe. La traduction préserve donc l’ambiguïté et n’impose aucune conclusion ecclésiologique.
- issue: Objet de l’évaluation
  choice: Expliciter l’objet implicite par « ce qui est dit ».
  alternative: Traduire seulement « qu’ils discernent » ou « qu’ils jugent ».
  rationale: Le contexte indique qu’il s’agit d’évaluer la parole prophétique. Cette explicitation rend la phrase naturelle en français sans trancher la question de l’identité des évaluateurs.
translation_notes:
  register: Français international moderne, clair et digne. La tournure injonctive conserve la force de l’impératif grec, tandis que « évaluent ce qui est dit » rend explicitement et naturellement l’examen de la parole prophétique.
