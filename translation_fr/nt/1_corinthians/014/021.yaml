source:
  edition: SBLGNT
  text: ἐν τῷ νόμῳ γέγραπται ὅτι Ἐν ἑτερογλώσσοις καὶ ἐν χείλεσιν ⸀ἑτέρων λαλήσω τῷ λαῷ τούτῳ, καὶ οὐδ’ οὕτως εἰσακούσονταί μου, λέγει κύριος.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/021.yaml
  text: 'In the Law it is written: “By people of other tongues and by the lips of foreigners I will speak to this people[d][c][b][a], and not even in this way will they listen to me,” says the Lord.'
translation:
  language: fr
  text: 'Dans la Loi, il est écrit : « Par des gens parlant d’autres langues et par les lèvres d’étrangers, je parlerai à ce peuple[a]. Même ainsi, ils ne m’écouteront pas[b] », dit le Seigneur.[c][d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Par d’autres langues et par les lèvres d’autres personnes. »'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « ils ne me prêteront pas attention. »'
    reason: lexical_alternative
  - marker: c
    text: Cette citation fait écho à Ésaïe 28.11-12.
    reason: cross_reference
  - marker: d
    text: Puisqu’il s’agit d’une citation où parle le Dieu d’Israël, certaines traductions mettent « dit le SEIGNEUR » pour refléter l’arrière-plan hébreu.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν τῷ νόμῳ
  choice: Dans la Loi
  rationale: Dans ce contexte, νόμος désigne largement les Écritures d’Israël, puisque la citation vient d’Ésaïe et non du Pentateuque. La majuscule conserve cet emploi scripturaire reconnu.
- source_word: γέγραπται
  choice: il est écrit
  rationale: Formule habituelle et naturelle introduisant une citation de l’Écriture; le parfait grec présente le texte comme durablement établi.
- source_word: ἐν ἑτερογλώσσοις
  choice: Par des gens parlant d’autres langues
  rationale: Le datif instrumental désigne ceux qui emploient une langue différente. Cette formulation est naturelle en français et maintient le lien avec le thème des langues dans le chapitre.
- source_word: ἐν χείλεσιν ἑτέρων
  choice: par les lèvres d’étrangers
  rationale: L’image concrète des « lèvres » est conservée; dans ce contexte, ἑτέρων renvoie à des personnes étrangères par leur peuple ou leur langue.
- source_word: λαλήσω
  choice: je parlerai
  rationale: Équivalent direct et naturel du futur de λαλέω.
- source_word: τῷ λαῷ τούτῳ
  choice: à ce peuple
  rationale: λαός désigne ici le peuple auquel Dieu s’adresse dans la citation scripturaire; « peuple » est plus précis que « nation ».
- source_word: οὐδ’ οὕτως
  choice: Même ainsi
  rationale: La tournure exprime que, même par ce moyen extraordinaire, le peuple ne répondra pas. La négation portée par le verbe français restitue l’ensemble οὐδ’ ... εἰσακούσονται.
- source_word: εἰσακούσονταί μου
  choice: ils ne m’écouteront pas
  rationale: εἰσακούω peut signifier écouter avec attention et, par extension, prêter attention ou obéir. « Écouter » reste clair sans éliminer cette nuance.
- source_word: λέγει κύριος
  choice: dit le Seigneur
  rationale: Formule française naturelle de citation; « le Seigneur » traduit directement κύριος tout en laissant la note signaler l’arrière-plan hébreu.
theological_decisions:
- issue: Traduction de κύριος dans une citation où parle le Dieu d’Israël
  choice: le Seigneur
  alternative: le SEIGNEUR
  rationale: Le texte grec porte κύριος, normalement rendu par « Seigneur ». La citation renvoie toutefois à un passage hébreu où le nom divin est en arrière-plan; cette possibilité est donc indiquée en note sans remplacer le texte grec dans le corps du verset.
translation_notes:
  register: Français international actuel, digne et accessible. La formulation conserve l’image scripturaire des « lèvres », le vocabulaire des « langues » propre au contexte et l’ambiguïté entre simple audition et réponse obéissante.
