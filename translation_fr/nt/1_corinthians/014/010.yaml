  yaml_path: translation/nt/1_corinthians/014/010.yaml
  text: There are perhaps many kinds of languages in the world[a], and none is without meaning.
translation:
  language: fr
  text: Il y a peut-être tant de sortes de langues dans le monde[a], et aucune n’est dépourvue de sens.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Il y a peut-être tant de sortes de sons dans le monde, et aucun n’est muet. »'
    reason: φωνή peut désigner une langue, une voix ou un son ; ἄφωνον signifie littéralement « muet » ou « sans voix », tout en pouvant évoquer, dans ce contexte, l’absence de signification.
lexical_decisions:
- source_word: τοσαῦτα
  choice: tant de
  rationale: Rend naturellement le quantificateur démonstratif neutre pluriel, qui souligne le grand nombre sans le préciser.
- source_word: εἰ τύχοι
  choice: qui sait
  rationale: Cette tournure incidente et légèrement atténuante restitue l’idiome grec (« peut-être », « s’il se trouve ») sans faire porter une forte incertitude sur l’affirmation.
- source_word: γένη
  choice: sortes
  rationale: Terme français courant pour des catégories ou variétés.
- source_word: φωνῶν
  choice: de langues
  rationale: Dans le contexte de 1 Corinthiens 14, φωνή désigne vraisemblablement des langues ou formes de langage; « langues » rend clairement le propos, tandis que « sons » est conservé en note comme possibilité lexicale.
- source_word: ἐν κόσμῳ
  choice: dans le monde
  rationale: Équivalent direct et naturel de l’expression grecque.
- source_word: οὐδὲν ἄφωνον
  choice: aucune n’est dépourvue de sens
  rationale: Avec « langues » comme antécédent, la formule exprime naturellement qu’aucune n’est sans signification. La lecture plus littérale liée au son ou à la voix est signalée en note.
theological_decisions:
- issue: Rapport entre φωναί et ἄφωνον
  choice: « langues » et « dépourvue de sens »
  alternative: « sons » et « sans voix / sans son »
  rationale: Le contexte argumentatif porte sur l’intelligibilité des paroles. La traduction principale explicite cette portée sans exclure l’image lexicale plus littérale, préservée dans la note.
translation_notes:
  register: Français international moderne, clair et digne. « Qui sait » conserve le caractère incident de εἰ τύχοι; « dépourvue de sens » reste soutenu mais immédiatement compréhensible.
