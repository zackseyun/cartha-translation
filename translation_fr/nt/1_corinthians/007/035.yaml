id: 1CO.7.35
reference: 1 Corinthians 7:35
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τοῦτο δὲ πρὸς τὸ ὑμῶν αὐτῶν ⸀σύμφορον λέγω, οὐχ ἵνα βρόχον ὑμῖν ἐπιβάλω, ἀλλὰ πρὸς τὸ εὔσχημον καὶ ⸀εὐπάρεδρον τῷ κυρίῳ ἀπερισπάστως.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/035.yaml
  text: I say this for your own benefit, not to put a noose on you, but for what is proper and for undistracted devotion to the Lord.
translation:
  language: fr
  text: Je dis cela dans votre propre intérêt, non pour vous passer un nœud coulant autour du cou, mais en vue de ce qui est convenable et d’un dévouement sans distraction au Seigneur.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σύμφορον
  choice: intérêt
  rationale: Exprime ce qui est avantageux ou bénéfique pour les destinataires, dans une tournure française naturelle.
- source_word: βρόχον
  choice: nœud coulant
  rationale: Conserve l’image forte et concrète du piège ou lacet qui se resserre, plutôt que de l’atténuer en simple « contrainte ».
- source_word: εὔσχημον
  choice: ce qui est convenable
  rationale: Rend l’idée de conduite honorable, digne et appropriée sans la préciser indûment.
- source_word: εὐπάρεδρον
  choice: attachement
  rationale: Dans ce contexte, désigne le fait de se tenir assidûment auprès du Seigneur, avec une disponibilité constante.
- source_word: ἀπερισπάστως
  choice: sans distraction
  rationale: Préserve directement l’idée d’une attention qui n’est pas tiraillée ou détournée.
theological_decisions:
- issue: Nature du conseil apostolique
  choice: « dans votre propre intérêt » et « non pour vous passer un nœud coulant autour du cou »
  alternative: « pour vous imposer une contrainte »
  rationale: Le texte présente le conseil comme bénéfique plutôt que coercitif; l’image de βρόχος est maintenue sans transformer le conseil en commandement absolu.
- issue: Portée de l’attachement au Seigneur
  choice: « en vue de ce qui est convenable et d’un attachement sans distraction au Seigneur »
  alternative: « afin que vous serviez constamment le Seigneur sans distraction »
  rationale: La formulation conserve les substantifs et l’ambiguïté syntaxique du grec, sans ajouter explicitement la notion de service.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la vigueur métaphorique de βρόχος et la coordination grecque entre ce qui est convenable et l’attachement sans distraction.
