source:
  edition: SBLGNT
  text: Εἰ δέ τις ἀσχημονεῖν ἐπὶ τὴν παρθένον αὐτοῦ νομίζει ἐὰν ᾖ ὑπέρακμος, καὶ οὕτως ὀφείλει γίνεσθαι, ὃ θέλει ποιείτω· οὐχ ἁμαρτάνει· γαμείτωσαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/036.yaml
  text: But if anyone thinks he is behaving improperly toward his virgin[a], if she is past her youth and it ought to be so, let him do what he wants; he is not sinning. Let them marry.
translation:
  language: fr
  text: 'Mais si quelqu’un pense qu’il agit de manière inconvenante envers sa vierge[a], si elle a passé la fleur de l’âge et qu’il doit en être ainsi, qu’il fasse ce qu’il veut : il ne pèche pas. Qu’ils se marient.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « envers sa fiancée vierge » ou « envers sa femme promise vierge ». Traditionnellement, on a aussi compris : « envers sa fille vierge ». Le grec est ambigu.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσχημονεῖν
  choice: agir de manière inconvenante
  rationale: Le verbe désigne une conduite déplacée ou contraire aux convenances. Cette formulation française reste naturelle sans accentuer indûment l’idée d’indécence sexuelle.
- source_word: ἐπὶ τὴν παρθένον αὐτοῦ
  choice: envers sa vierge
  rationale: 'παρθένος signifie « vierge », tandis que le rapport exprimé par αὐτοῦ demeure ambigu : il peut s’agir de la fiancée d’un homme ou de la fille vierge placée sous l’autorité d’un père ou tuteur. La formulation principale conserve cette ambiguïté, explicitée en note.'
- source_word: ὑπέρακμος
  choice: a dépassé la fleur de l’âge
  rationale: Le terme indique que la personne a franchi le sommet ou la pleine floraison de la jeunesse. Cette expression garde l’image liée à l’âge sans fixer un seuil moderne précis.
- source_word: καὶ οὕτως ὀφείλει γίνεσθαι
  choice: et que les choses doivent se passer ainsi
  rationale: ὀφείλει exprime ici une nécessité ou une obligation, tandis que γίνεσθαι reste général. La traduction ne précise donc pas quelle circonstance impose cette issue.
- source_word: ὃ θέλει ποιείτω
  choice: qu’il fasse ce qu’il veut
  rationale: Cette tournure rend directement l’impératif permissif grec dans un français moderne.
- source_word: οὐχ ἁμαρτάνει
  choice: il ne pèche pas
  rationale: La formulation exprime clairement que l’action envisagée n’est pas un péché.
- source_word: γαμείτωσαν
  choice: qu’ils se marient
  rationale: L’impératif grec à la troisième personne du pluriel vise naturellement les deux personnes qui contractent mariage.
theological_decisions:
- issue: Identité de « sa vierge » (παρθένον αὐτοῦ)
  choice: Le texte principal conserve l’expression ambiguë « sa vierge ».
  alternative: On peut comprendre « sa fiancée vierge » ou « sa fille vierge placée sous sa responsabilité ».
  rationale: La syntaxe grecque ne tranche pas nettement entre les deux principales interprétations attestées. La traduction préserve donc cette tension au lieu de choisir silencieusement l’une d’elles.
translation_notes:
  register: Français international moderne, digne et accessible. « Sa vierge » est inhabituel en français, mais retenu afin de ne pas effacer l’ambiguïté réelle du grec ; la note fournit les lectures naturelles possibles.
