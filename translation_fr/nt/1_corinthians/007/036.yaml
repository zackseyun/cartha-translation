  source_fidelity: Le sens de l’ensemble et l’ambiguïté de παρθένον αὐτοῦ sont bien préservés. « Sa vierge » est certes inhabituel en français, mais c’est un choix défendable dans le texte principal, puisque la note explicite les deux lectures majeures. La proposition « les choses doivent se passer ainsi » est toutefois plus concrète et plus lourde que le grec, dont γίνεσθαι demeure délibérément général.
  naturalness: Le registre est globalement clair et moderne. « Elle a passé la fleur de l’âge » est plus idiomatique que « elle a dépassé la fleur de l’âge ». « Qu’il doit en être ainsi » rend plus naturellement la nécessité générale sans introduire le vague concret de « les choses ».
  terminology: « Agit de manière inconvenante », « il ne pèche pas » et « qu’ils se marient » conviennent. La note doit conserver explicitement l’alternative de la fiancée ou femme promise, ainsi que celle de la fille vierge, sans présenter l’une comme certaine.
