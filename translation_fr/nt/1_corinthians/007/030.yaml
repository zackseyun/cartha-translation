  text: καὶ οἱ κλαίοντες ὡς μὴ κλαίοντες, καὶ οἱ χαίροντες ὡς μὴ χαίροντες, καὶ οἱ ἀγοράζοντες ὡς μὴ κατέχοντες,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/030.yaml
  text: and those who weep as not weeping[a], and those who rejoice as not rejoicing, and those who buy as not possessing,
translation:
  language: fr
  text: et ceux qui pleurent, comme s’ils ne pleuraient pas[a] ; et ceux qui se réjouissent, comme s’ils ne se réjouissaient pas ; et ceux qui achètent, comme s’ils ne possédaient pas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi traduire plus littéralement : « comme ne pleurant pas… comme ne se réjouissant pas… comme ne possédant pas ». Le grec répète la tournure « comme ne… pas » pour décrire une manière de vivre, sans nier la réalité de ces expériences.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κλαίοντες
  choice: ceux qui pleurent
  rationale: Le participe présent substantivé désigne « ceux qui pleurent ». « Pleurer » rend directement l’action concrète sans préciser de façon interprétative la cause de la peine.
- source_word: ὡς μὴ κλαίοντες
  choice: comme s’ils ne pleuraient pas
  rationale: La tournure française exprime naturellement la manière de vivre ou l’attitude visée par ὡς μή avec le participe, sans nier la réalité des pleurs.
- source_word: χαίροντες
  choice: ceux qui se réjouissent
  rationale: « Se réjouir » correspond au sens courant de χαίρω chez Paul et maintient le parallélisme avec « pleurer » dans un registre digne et accessible.
- source_word: ὡς μὴ χαίροντες
  choice: comme s’ils ne se réjouissaient pas
  rationale: La même construction que dans le membre précédent est conservée afin de reproduire la symétrie rhétorique du grec.
- source_word: ἀγοράζοντες
  choice: ceux qui achètent
  rationale: « Acheter » est l’équivalent français moderne le plus direct pour l’activité commerciale ordinaire évoquée ici.
- source_word: κατέχοντες
  choice: possédaient rien
  rationale: κατέχω peut signifier tenir, garder ou posséder. En contraste avec l’achat, « posséder » exprime ici le fait de considérer comme durablement acquis ce que l’on achète ; « rien » complète naturellement le verbe en français sans désigner un bien particulier.
- source_word: καὶ
  choice: et ; articulation par points-virgules
  rationale: Les coordinations successives forment une série cumulative. Le français conserve les liens entre les groupes, tandis que les points-virgules rendent clairement leur parallélisme.
theological_decisions:
- issue: Portée des constructions répétées ὡς μή + participe
  choice: Une manière de vivre les émotions et les acquisitions sans s’y attacher comme à des réalités définitives
  alternative: Une interdiction ascétique des pleurs, de la joie ou de l’achat
  rationale: Dans le contexte immédiat, Paul évoque la détresse présente et le caractère passager de la figure de ce monde. La construction indique une attitude ou une manière d’agir, et non la négation absolue de ces expériences ; la traduction maintient cette tension sans transformer le verset en interdiction.
- issue: Nuance de κατέχω dans le contexte de l’achat
  choice: posséder
  alternative: tenir, garder ou retenir
  rationale: Le contraste avec « acheter » favorise l’idée de possession, mais la note reconnaît le champ sémantique plus large du verbe grec.
translation_notes:
  register: Français international moderne, sobre et digne. « Comme s’ils ne… pas » est plus idiomatique que le calque « comme ne… pas », tandis que la répétition et les points-virgules préservent le rythme des trois propositions parallèles.
