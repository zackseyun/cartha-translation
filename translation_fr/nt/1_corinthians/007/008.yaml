id: 1CO.7.8
reference: 1 Corinthians 7:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Λέγω δὲ τοῖς ἀγάμοις καὶ ταῖς χήραις, καλὸν ⸀αὐτοῖς ἐὰν μείνωσιν ὡς κἀγώ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/008.yaml
  text: 'I say to the unmarried and to the widows: it is good for them if they remain as I am[a][b].'
translation:
  language: fr
  text: 'Je dis aux non-mariés[a] et aux veuves : il est bon pour eux de rester comme moi[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « aux hommes non mariés » : la forme grecque est au masculin pluriel, mais ce masculin peut aussi avoir une portée représentative.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « comme moi aussi ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Λέγω δὲ
  choice: Je dis
  rationale: Le verbe est rendu directement. δέ marque ici une transition légère que le français peut laisser implicite sans introduire un contraste plus fort que le grec.
- source_word: τοῖς ἀγάμοις
  choice: aux non-mariés
  rationale: ἄγαμος désigne une personne non mariée. Le masculin pluriel grec peut viser précisément les hommes non mariés ou servir de forme représentative; « non-mariés » conserve cette ambiguïté en français.
- source_word: ταῖς χήραις
  choice: aux veuves
  rationale: χήρα désigne précisément une veuve; cette catégorie explicitement nommée doit rester distincte.
- source_word: καλὸν αὐτοῖς
  choice: il est bon pour eux
  rationale: καλόν exprime ce qui est bon ou souhaitable, sans porter en lui-même un comparatif. Le datif αὐτοῖς est naturellement rendu par « pour eux ».
- source_word: ἐὰν μείνωσιν
  choice: de rester
  rationale: 'Dans cette construction française, l’infinitif exprime naturellement la condition envisagée par ἐάν avec le subjonctif : continuer dans l’état non marié.'
- source_word: ὡς κἀγώ
  choice: comme moi
  rationale: κἀγώ est la contraction de καὶ ἐγώ, littéralement « moi aussi ». « Comme moi » est idiomatique et renvoie sans surcharge à la situation présente de Paul; la valeur additive est signalée en note.
theological_decisions:
- issue: Portée de τοῖς ἀγάμοις par rapport aux veuves
  choice: « aux non-mariés », en conservant une formulation masculine susceptible d’un emploi représentatif
  alternative: « aux hommes non mariés »
  rationale: La morphologie grecque est masculine, mais le contexte peut employer ce masculin de manière représentative. La traduction ne tranche donc pas silencieusement entre ces deux lectures.
- issue: Valeur de καλόν dans le conseil de Paul
  choice: « il est bon »
  alternative: « il est préférable »
  rationale: Le grec formule une appréciation positive, non un comparatif explicite. « Préférable » renforcerait indûment l’énoncé.
translation_notes:
  register: Français international moderne, simple et digne. « Non-mariés » est plus précis ici que « célibataires », qui pourrait suggérer uniquement des personnes n’ayant jamais été mariées. La syntaxe avec « il est bon pour eux de rester » garde le parallélisme et la sobriété du grec.
