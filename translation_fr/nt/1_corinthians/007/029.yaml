source:
  edition: SBLGNT
  text: τοῦτο δέ φημι, ἀδελφοί, ὁ καιρὸς συνεσταλμένος ⸂ἐστίν· τὸ λοιπὸν⸃ ἵνα καὶ οἱ ἔχοντες γυναῖκας ὡς μὴ ἔχοντες ὦσιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/029.yaml
  text: 'This is what I mean[a], brothers: the time has been shortened, so that from now on even those who have wives should be as though they had none[b],'
translation:
  language: fr
  text: 'Voici ce que je veux dire, frères et sœurs[a] : le temps[b] s’est raccourci ; désormais, afin que même ceux qui ont une femme soient comme s’ils n’en avaient pas,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec emploie le pluriel masculin « frères », qui peut s’adresser ici à un groupe de croyants comprenant des hommes et des femmes.
    reason: cultural_note
  - marker: b
    text: 'Ou : « le temps fixé s’est raccourci » ; le terme grec désigne un temps décisif ou déterminé.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο δέ φημι
  choice: Voici ce que je veux dire
  rationale: Cette formulation française naturelle présente la suite comme une explication, tout en restant proche de la formule discursive de Paul.
- source_word: ἀδελφοί
  choice: frères et sœurs
  rationale: Le masculin pluriel grec peut désigner ici l’ensemble des croyants, hommes et femmes. Cette formulation rend explicitement cette portée dans un français moderne.
- source_word: ὁ καιρός
  choice: le temps
  rationale: καιρός désigne ici un temps décisif ou fixé plutôt que la simple durée chronologique. « Le temps » reste concis et conserve l’ouverture du terme.
- source_word: συνεσταλμένος ἐστίν
  choice: s’est raccourci
  rationale: Le parfait périphrastique décrit un état présent résultant d’un raccourcissement. La tournure pronominale française préserve cet aspect sans préciser qui en est l’agent.
- source_word: τὸ λοιπὸν
  choice: Désormais
  rationale: Dans ce contexte, l’expression introduit la conduite à adopter pendant le temps qui reste.
- source_word: ἵνα
  choice: que
  rationale: Après l’énoncé de la situation et « Désormais », « que » introduit naturellement l’exhortation tout en laissant ouverte la nuance de but ou de conséquence portée par ἵνα.
- source_word: οἱ ἔχοντες γυναῖκας
  choice: ceux qui ont une femme
  rationale: Dans ce contexte matrimonial, γυναῖκας signifie « femmes » au sens d’épouses. La formulation reste proche du grec sans généraliser en « les gens mariés ».
- source_word: ὡς μὴ ἔχοντες
  choice: comme s’ils n’en avaient pas
  rationale: Cette formulation idiomatique conserve la comparaison abrupte du grec; le pronom « en » renvoie clairement à « une femme ».
theological_decisions:
- issue: Portée pastorale et théologique de l’instruction concernant le mariage
  choice: Conserver sans l’atténuer la formule « comme s’ils n’en avaient pas »
  alternative: Interpréter par « vivre avec détachement à l’égard du mariage » ou ajouter une précision sur le maintien des devoirs conjugaux
  rationale: Paul relativise ici, dans l’urgence liée au temps, une condition sociale ordinaire. La traduction doit préserver cette tension sans faire dire au verset qu’il abolit le mariage ni résoudre la difficulté par une paraphrase.
- issue: Agent du raccourcissement du temps
  choice: Ne pas expliciter l’agent
  alternative: Traduire « Dieu a raccourci le temps »
  rationale: Le grec emploie une construction passive sans nommer l’agent. Même si un passif divin est possible, l’expliciter dépasserait les données du texte.
translation_notes:
  register: Français international actuel, digne et accessible. La ponctuation distingue l’affirmation sur le temps de l’exhortation qui suit. La formulation conserve la vigueur et la tension du grec sans ajouter d’explication doctrinale.
