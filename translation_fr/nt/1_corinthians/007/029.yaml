  terminology: « Frères et sœurs » convient à l’audience vraisemblablement mixte tout en étant documenté par la note. « Une femme » est bien compris ici au sens d’épouse; « comme s’ils n’en avaient pas » conserve la formulation abrupte sans ajouter d’interprétation pastorale.
