  text: Each one should remain in the calling in which he was called[a][b].
translation:
  language: fr
  text: Que chacun demeure dans l’appel dans lequel il a été appelé[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « condition », « situation » ou « position dans la vie ». Le grec dit littéralement « appel », en écho à « a été appelé » dans le même verset.
    reason: lexical_alternative
  - marker: b
    text: 'Le terme grec rendu par « chacun » est au masculin singulier et a une portée représentative : l’instruction s’applique à chaque personne croyante.'
    reason: cultural_note
lexical_decisions:
- source_word: ἕκαστος
  choice: chacun
  rationale: Le singulier distributif est conservé et souligne l’application individuelle de l’instruction.
- source_word: κλήσει
  choice: appel
  rationale: Ce choix garde le sens lexical premier et préserve l’écho délibéré avec ἐκλήθη (« a été appelé »), sans réduire le terme à la seule situation sociale.
- source_word: ᾗ ἐκλήθη
  choice: dans lequel il a été appelé
  rationale: La tournure reprend la construction avec ἐν et maintient le parallèle ainsi que le passif, dont l’agent divin reste implicite.
- source_word: ἐν ταύτῃ
  choice: dans l’appel dans lequel
  rationale: Le démonstratif renvoie à l’appel déjà mentionné. La formulation française conserve ce renvoi et la répétition structurante du grec.
- source_word: μενέτω
  choice: Que chacun demeure
  rationale: Le présent impératif exprime la continuation dans l’état en question. Cette tournure restitue naturellement en français la force de l’impératif à la troisième personne.
theological_decisions:
- issue: Sens de κλῆσις dans le contexte
  choice: Conserver « appel » dans le texte principal.
  alternative: « condition », « situation » ou « position dans la vie »
  rationale: Le contexte immédiat concerne des situations telles que la circoncision et l’esclavage, mais Paul associe expressément κλήσει à ἐκλήθη. « Appel » maintient donc la tension entre l’appel de Dieu et la situation dans laquelle cet appel a atteint la personne.
- issue: Masculin singulier représentatif
  choice: Employer « chacun » et le masculin grammatical correspondant.
  alternative: Reformuler au pluriel ou avec une expression épicène.
  rationale: Le grec emploie un masculin singulier à valeur représentative. Le français « chacun » conserve cette forme sans limiter l’instruction aux hommes; une note explicite sa portée.
translation_notes:
  register: Français international moderne, sobre et digne. La répétition « appel… appelé », légèrement marquée en français, est conservée afin de rendre le jeu lexical et la tension théologique du grec.
