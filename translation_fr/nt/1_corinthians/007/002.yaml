id: 1CO.7.2
reference: 1 Corinthians 7:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: διὰ δὲ τὰς πορνείας ἕκαστος τὴν ἑαυτοῦ γυναῖκα ἐχέτω, καὶ ἑκάστη τὸν ἴδιον ἄνδρα ἐχέτω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/002.yaml
  text: But because of sexual immoralities[a], let each man have his own wife, and let each woman have her own husband.
translation:
  language: fr
  text: Mais, à cause des inconduites sexuelles[a], que chaque homme ait sa propre femme, et que chaque femme ait son propre mari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de l’inconduite sexuelle » au singulier. Le grec emploie le pluriel.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ δὲ
  choice: Mais, à cause de
  rationale: διά avec l’accusatif exprime ici la cause, tandis que δέ marque une légère opposition ou une progression par rapport à l’énoncé précédent.
- source_word: τὰς πορνείας
  choice: les inconduites sexuelles
  rationale: πορνεία désigne une conduite sexuelle immorale. Le pluriel grec est conservé; « inconduites sexuelles » reste compréhensible en français moderne sans réduire le terme à la seule fornication.
- source_word: ἕκαστος
  choice: chaque homme
  rationale: Le masculin singulier, mis en parallèle avec ἑκάστη et avec les termes désignant la femme et le mari, renvoie ici distributivement à chaque homme.
- source_word: τὴν ἑαυτοῦ γυναῖκα
  choice: sa propre femme
  rationale: Dans ce contexte matrimonial, γυνή signifie naturellement « femme » au sens d’épouse; ἑαυτοῦ souligne qu’il s’agit de la sienne propre.
- source_word: ἐχέτω
  choice: que … ait
  rationale: Cette tournure rend directement l’impératif présent à la troisième personne sans le transformer en verbe explicite de mariage ni en obligation formulée par « doit ».
- source_word: καὶ ἑκάστη
  choice: et que chaque femme
  rationale: La formulation garde le parallélisme distributif et symétrique du grec.
- source_word: τὸν ἴδιον ἄνδρα
  choice: son propre mari
  rationale: Dans le parallèle matrimonial, ἀνήρ signifie « mari »; ἴδιον met l’accent sur le conjoint propre à chacune.
theological_decisions:
- issue: Le verset commande-t-il de se marier pour éviter le péché sexuel, ou règle-t-il les relations conjugales?
  choice: Conserver l’expression littérale « que … ait » comme instruction concernant le fait, pour chaque homme et chaque femme, d’avoir son propre conjoint.
  alternative: Traduire plus explicitement par « que chacun se marie » ou par une formule relative aux devoirs conjugaux.
  rationale: Le grec emploie ἐχέτω, « qu’il ou elle ait », et non un verbe signifiant explicitement « se marier » ou « accomplir les devoirs conjugaux ». La formulation retenue préserve donc l’ambiguïté et la tension du texte.
translation_notes:
  register: Français international moderne, sobre et digne. Le parallélisme entre l’homme et la femme est maintenu, ainsi que la pluralité inhabituelle de πορνείας, expliquée en note.
