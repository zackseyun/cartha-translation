  text: ὁ δὲ γαμήσας μεριμνᾷ τὰ τοῦ κόσμου, πῶς ⸀ἀρέσῃ τῇ γυναικί,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/033.yaml
  text: But the married man is concerned with the things of the world[a], how he may please his wife,
translation:
  language: fr
  text: Mais l’homme marié se préoccupe des choses du monde[a], de la façon dont il peut plaire à sa femme,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « des affaires du monde » ou « des réalités de la vie ordinaire ».

      '
    reason: Alternative lexicale pour τὰ τοῦ κόσμου, qui peut désigner les affaires ordinaires de la vie sans connotation morale nécessaire.
lexical_decisions:
- source_word: ὁ δὲ γαμήσας
  choice: Mais l’homme marié
  rationale: Le participe aoriste substantivé désigne ici, par contraste avec l’homme non marié du contexte, un homme qui s’est marié. « L’homme marié » est naturel en français et conserve le masculin singulier.
- source_word: μεριμνᾷ
  choice: se préoccupe
  rationale: Le verbe peut exprimer le souci, la préoccupation ou l’inquiétude. Ici, il décrit les préoccupations liées à la vie conjugale sans nécessairement impliquer une anxiété coupable.
- source_word: τὰ τοῦ κόσμου
  choice: des choses du monde
  rationale: La formulation garde le caractère concret et pluriel de l’expression grecque tout en désignant, sans jugement moral ajouté, les réalités de la vie ordinaire.
- source_word: πῶς ἀρέσῃ
  choice: de la manière de plaire
  rationale: Cette formulation présente la manière de plaire à sa femme comme le contenu de sa préoccupation et reflète la nuance de πῶς avec le subjonctif, sans ajouter une intention étrangère au texte.
- source_word: τῇ γυναικί
  choice: à sa femme
  rationale: Dans ce contexte matrimonial, γυνή signifie clairement « femme » au sens d’épouse. Le possessif, implicite en grec, est nécessaire en français naturel.
theological_decisions:
- issue: Faut-il donner à κόσμος un sens moralement négatif dans ce verset ?
  choice: Traduction neutre par « les choses du monde »
  alternative: « les choses mondaines », avec une connotation péjorative
  rationale: Dans le contexte, Paul oppose les responsabilités pratiques du mariage à une disponibilité sans partage pour le Seigneur ; il ne condamne pas nécessairement le mariage ni les devoirs ordinaires. La formulation neutre préserve cette tension.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proche du grec tout en étant intelligible ; la virgule finale est conservée puisque le verset se poursuit syntaxiquement dans le contexte.
