  - severity: medium
    issue: La note b traduit πάλιν ἐπὶ τὸ αὐτὸ par « soyez de nouveau au même endroit ».
    rationale: Cette glose privilégie à tort une lecture spatiale. Dans le contexte et dans cet idiome, il s'agit d'être ou de revenir de nouveau ensemble, avec l'implication conjugale laissée implicite.
