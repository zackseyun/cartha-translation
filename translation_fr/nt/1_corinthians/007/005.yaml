  verdict: revise
  source_fidelity: 'Le sens général est bien rendu : l''interdiction est réciproque, l''exception dépend d''un accord mutuel et temporaire, et le but de la prière ainsi que la tentation par Satan sont conservés. Toutefois, « Ne vous privez pas l’un l’autre » est moins idiomatique et légèrement moins précis que « Ne vous privez pas l’un de l’autre » dans ce contexte. La note b présente ἐπὶ τὸ αὐτὸ de façon indûment spatiale (« au même endroit »), alors que l''expression idiomatique désigne le fait d''être de nouveau ensemble, ici dans la reprise de l''union conjugale.'
  naturalness: « Ne vous privez pas l’un de l’autre » est une tournure française établie dans le contexte conjugal. « Revenez ensuite l’un vers l’autre » est naturel, réciproque et conserve la retenue de l'expression grecque, mieux que « soyez de nouveau ensemble », qui paraît quelque peu statique.
  terminology: « Satan », « prière », « d’un commun accord » et « manque de maîtrise de vous-mêmes » sont justes et appropriés au registre. La formulation révisée ne rend pas plus explicite que le grec l'allusion à la reprise de l'union conjugale.
