source:
  edition: SBLGNT
  text: μὴ ἀποστερεῖτε ἀλλήλους, εἰ μήτι ἂν ἐκ συμφώνου πρὸς καιρὸν ἵνα ⸀σχολάσητε ⸀τῇ προσευχῇ καὶ πάλιν ἐπὶ τὸ αὐτὸ ⸀ἦτε, ἵνα μὴ πειράζῃ ὑμᾶς ὁ Σατανᾶς διὰ τὴν ἀκρασίαν ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/005.yaml
  text: Do not deprive one another[a], except perhaps by mutual agreement for a time, so that you may devote yourselves to prayer, and then come together again[b], so that Satan may not tempt you because of your lack of self-control.
translation:
  language: fr
  text: Ne vous privez pas l’un de l’autre, si ce n’est peut-être d’un commun accord[a], pour un temps, afin de vous consacrer à la prière. Revenez ensuite l’un vers l’autre[b], afin que Satan ne vous tente pas à cause de votre manque de maîtrise de vous-mêmes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « sauf peut-être par consentement mutuel ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « soyez de nouveau ensemble »; dans ce contexte, l’expression évoque la reprise de la vie conjugale, notamment des relations sexuelles.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποστερεῖτε
  choice: privez
  rationale: Dans ce contexte conjugal, le verbe désigne le fait de refuser à son conjoint ce qui lui est dû. « Priver » est naturel en français et conserve la force éthique du grec sans introduire une connotation commerciale.
- source_word: ἀλλήλους
  choice: l’un l’autre
  rationale: Cette expression réciproque souligne que l’instruction s’adresse également aux deux conjoints.
- source_word: εἰ μήτι ἂν
  choice: si ce n’est peut-être
  rationale: La tournure grecque introduit une exception nuancée ou éventuelle. « Si ce n’est peut-être » en préserve le caractère prudent sans transformer l’exception en règle absolue.
- source_word: ἐκ συμφώνου
  choice: d’un commun accord
  rationale: La locution exprime le consentement partagé des deux conjoints; cette formulation française en rend clairement la réciprocité.
- source_word: πρὸς καιρόν
  choice: pour un temps
  rationale: L’expression indique une durée limitée, sans en préciser la longueur.
- source_word: σχολάσητε
  choice: vous consacrer
  rationale: Dans ce contexte, le verbe signifie se rendre disponible pour une activité et s’y appliquer. « Vous consacrer » exprime naturellement cette disponibilité intentionnelle.
- source_word: τῇ προσευχῇ
  choice: à la prière
  rationale: Le singulier grec désigne ici la pratique de la prière en général.
- source_word: πάλιν ἐπὶ τὸ αὐτὸ ἦτε
  choice: soyez de nouveau ensemble
  rationale: La formulation conserve l’expression indirecte et pudique du grec. Dans le contexte, elle évoque la reprise de l’union conjugale sans l’expliciter davantage que le texte source.
- source_word: πειράζῃ
  choice: tente
  rationale: Avec Satan comme sujet, il s’agit ici d’une incitation au péché plutôt que d’une mise à l’épreuve neutre.
- source_word: Σατανᾶς
  choice: Satan
  rationale: La translittération usuelle en français conserve la référence personnelle du texte grec.
- source_word: ἀκρασίαν
  choice: manque de maîtrise de vous-mêmes
  rationale: Le nom désigne le défaut de maîtrise de soi, particulièrement dans le contexte sexuel du passage. Cette expression est claire et actuelle.
theological_decisions:
- issue: Faut-il expliciter πάλιν ἐπὶ τὸ αὐτὸ ἦτε comme une reprise des relations sexuelles?
  choice: Conserver la formulation indirecte « soyez de nouveau ensemble »
  alternative: « reprenez vos relations conjugales »
  rationale: Le contexte implique vraisemblablement la reprise de l’union sexuelle, mais le grec l’exprime avec retenue. La traduction préserve cette pudeur ainsi que la portée légèrement plus large de l’expression.
- issue: Σατανᾶς désigne-t-il un être personnel ou simplement un adversaire?
  choice: Employer le nom propre « Satan »
  alternative: « l’adversaire »
  rationale: Dans cet emploi paulinien, le terme renvoie à Satan comme agent personnel de la tentation; le rendre comme nom propre est donc le choix le plus direct.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la réciprocité de l’exhortation, le caractère temporaire et consensuel de l’exception, ainsi que la pudeur de l’expression grecque concernant la reprise de l’union conjugale.
