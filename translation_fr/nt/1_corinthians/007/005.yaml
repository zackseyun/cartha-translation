  to: Ne vous privez pas l’un de l’autre, si ce n’est peut-être d’un commun accord[a], pour un temps, afin de vous consacrer à la prière. Revenez ensuite l’un vers l’autre[b], afin que Satan ne vous tente pas à cause de votre manque de maîtrise de vous-mêmes.
  rationale: La révision emploie la construction française idiomatique « se priver l’un de l’autre » et remplace une note b spatialement trompeuse par une explication qui respecte l'idiome grec et sa pudeur. Le sens, le degré de réserve et la portée conjugale du texte source sont préservés.
