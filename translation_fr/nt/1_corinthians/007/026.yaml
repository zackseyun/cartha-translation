id: 1CO.7.26
reference: 1 Corinthians 7:26
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: νομίζω οὖν τοῦτο καλὸν ὑπάρχειν διὰ τὴν ἐνεστῶσαν ἀνάγκην, ὅτι καλὸν ἀνθρώπῳ τὸ οὕτως εἶναι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/026.yaml
  text: 'Therefore I think this is good because of the present distress: that it is good for a man to remain as he is[a][b][c].'
translation:
  language: fr
  text: 'Je pense donc que ceci est bon, à cause de la détresse présente : il est bon pour un homme[a] de rester comme il est[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour une personne » ; le mot grec traduit par « homme » peut être employé dans un sens générique.
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « d’être ainsi ».
    reason: lexical_alternative
lexical_decisions:
- source_word: νομίζω
  choice: Je pense
  rationale: Rend le jugement personnel et réfléchi de Paul sans en faire un commandement absolu.
- source_word: οὖν
  choice: donc
  rationale: Marque naturellement en français la conclusion tirée de la discussion précédente.
- source_word: τοῦτο καλὸν ὑπάρχειν
  choice: que ceci est bon
  rationale: Transforme naturellement la construction infinitive grecque en proposition complétive, tout en conservant le terme évaluatif « bon ».
- source_word: διὰ τὴν ἐνεστῶσαν ἀνάγκην
  choice: à cause de la détresse présente
  rationale: ἀνάγκη peut désigner une nécessité ou une situation pressante et pénible ; « détresse » convient au contexte, tandis que « présente » rend la situation en cours plutôt qu’une crise seulement future.
- source_word: ὅτι
  choice: ':'
  rationale: Le deux-points introduit naturellement en français l’explicitation du jugement formulé juste avant, sans imposer une valeur causale à ὅτι.
- source_word: καλὸν
  choice: il est bon
  rationale: Conserve la répétition lexicale de καλόν et évite de préciser indûment s’il s’agit de ce qui est convenable ou avantageux.
- source_word: ἀνθρώπῳ
  choice: pour un homme
  rationale: Préserve la forme masculine singulière du grec, tout en signalant en note que ἄνθρωπος peut avoir une portée générique.
- source_word: τὸ οὕτως εἶναι
  choice: de rester comme il est
  rationale: Expression française naturelle qui explicite la continuité impliquée par le contexte ; le sens littéral « être ainsi » est conservé en note.
theological_decisions:
- issue: Nature du propos de Paul
  choice: Présenter le verset comme un jugement pastoral lié à la détresse présente.
  alternative: Le formuler comme une interdiction universelle du mariage ou une préférence intemporelle contre celui-ci.
  rationale: « Je pense » et « à cause de la détresse présente » ancrent le conseil dans une situation donnée, sans supprimer la force réelle de l’évaluation de Paul.
translation_notes:
  register: Français international moderne, digne et direct. La syntaxe reste proche du grec tout en étant idiomatique. Le deux-points évite une répétition lourde de « que » et préserve l’ambiguïté explicative de ὅτι.
