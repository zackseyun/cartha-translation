  text: Γυνὴ ⸀δέδεται ἐφ’ ὅσον χρόνον ζῇ ὁ ἀνὴρ αὐτῆς· ἐὰν ⸀δὲ κοιμηθῇ ὁ ἀνήρ, ἐλευθέρα ἐστὶν ᾧ θέλει γαμηθῆναι, μόνον ἐν κυρίῳ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/039.yaml
  text: A wife is bound for as long as her husband lives[a]; but if her husband dies, she is free to be married to whom she wishes[b], only in the Lord.
translation:
  language: fr
  text: Une femme est liée à son mari aussi longtemps qu’il vit. Mais si son mari meurt[a], elle est libre de se marier avec qui elle veut, à condition que ce soit dans le Seigneur[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « s’endort ». Le grec emploie couramment le sommeil comme euphémisme pour la mort.'
    reason: lexical_alternative
  - marker: b
    text: '« Dans le Seigneur » est souvent compris comme signifiant : avec quelqu’un qui appartient au Seigneur, c’est-à-dire un autre croyant. La formule grecque peut aussi souligner que ce mariage doit se vivre dans l’attachement au Seigneur.'
    reason: alternative_reading
lexical_decisions:
- source_word: Γυνή
  choice: Une femme
  rationale: Dans ce contexte matrimonial, le français « une femme » désigne naturellement l’épouse tout en conservant la forme non possessive du grec.
- source_word: δέδεται
  choice: est liée
  rationale: Le parfait passif exprime un état durable; « est liée » conserve la portée relationnelle et quasi juridique sans ajouter « par la loi ».
- source_word: ἐφ’ ὅσον χρόνον ζῇ
  choice: aussi longtemps que … est en vie
  rationale: Cette tournure rend clairement et naturellement la durée exprimée par l’idiome grec.
- source_word: ὁ ἀνὴρ αὐτῆς
  choice: son mari
  rationale: Dans ce contexte, ἀνήρ signifie « mari », et αὐτῆς marque la relation conjugale.
- source_word: κοιμηθῇ
  choice: s’endort dans la mort
  rationale: Cette formulation française rend explicite le sens tout en conservant l’image grecque du sommeil comme euphémisme de la mort.
- source_word: ἐλευθέρα ἐστίν
  choice: elle est libre
  rationale: Rend directement la libération du lien conjugal antérieur.
- source_word: ᾧ θέλει γαμηθῆναι
  choice: d’épouser qui elle veut
  rationale: Le français emploie naturellement l’actif « épouser » là où le grec a un infinitif passif; le sens de la liberté de choix est intact.
- source_word: μόνον ἐν κυρίῳ
  choice: seulement dans le Seigneur
  rationale: La formulation concise conserve la restriction et l’expression paulinienne sans en imposer une seule interprétation.
theological_decisions:
- issue: Sens de « dans le Seigneur » dans l’instruction sur le remariage
  choice: Conserver « seulement dans le Seigneur » dans le texte principal.
  alternative: « seulement avec quelqu’un qui appartient au Seigneur » ou « d’une manière conforme à son attachement au Seigneur »
  rationale: La formule grecque est dense et peut viser notamment le choix d’un conjoint croyant, mais elle n’explicite pas elle-même cette paraphrase. La traduction préserve donc son ouverture interprétative.
- issue: Euphémisme de la mort
  choice: « s’endort dans la mort »
  alternative: « meurt » ou « s’endort »
  rationale: « Meurt » perdrait l’image du texte source, tandis que « s’endort » seul pourrait être mal compris en français moderne. La formulation retenue conserve à la fois l’image et le sens.
translation_notes:
  register: Français international moderne, clair et digne. « S’endort dans la mort » évite l’ambiguïté de « s’endort » seul tout en préservant la métaphore grecque. La syntaxe reste simple et accessible; « dans le Seigneur » est maintenu comme formule théologiquement chargée.
