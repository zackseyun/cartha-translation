source:
  edition: SBLGNT
  text: Δοῦλος ἐκλήθης; μή σοι μελέτω· ἀλλ’ εἰ καὶ δύνασαι ἐλεύθερος γενέσθαι, μᾶλλον χρῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/021.yaml
  text: Were you called as a servant? Do not let it trouble you. But if indeed you are able to become free[a], rather make use of it.
translation:
  language: fr
  text: As-tu été appelé alors que tu étais esclave ? Ne t’en inquiète pas. Mais si vraiment tu peux devenir libre, profite-en plutôt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « tire plutôt parti de ta condition présente », c’est-à-dire reste comme tu es. En grec, le complément de « tire parti » n’est pas exprimé, et la phrase a été comprise dans les deux sens.'
    reason: alternative_reading
lexical_decisions:
- source_word: Δοῦλος
  choice: esclave
  rationale: Le terme désigne ici une personne juridiquement asservie; la possibilité explicite de devenir libre rend « esclave » plus précis que « serviteur ».
- source_word: ἐκλήθης
  choice: as-tu été appelé
  rationale: La formulation conserve le passif et le langage paulinien de l’appel divin sans ajouter une précision absente du grec.
- source_word: μή σοι μελέτω
  choice: ne t’en inquiète pas
  rationale: Cette tournure française actuelle rend naturellement l’idée de ne pas se laisser préoccuper par sa condition.
- source_word: ἐλεύθερος γενέσθαι
  choice: devenir libre
  rationale: La traduction reproduit directement le changement de condition sociale exprimé par le grec.
- source_word: μᾶλλον χρῆσαι
  choice: profites-en plutôt
  rationale: Le verbe signifie faire usage ou tirer parti de quelque chose, mais son complément reste implicite. Dans le texte principal, « en » renvoie à la possibilité de devenir libre, tout en signalant en note l’autre interprétation ancienne.
theological_decisions:
- issue: Ambiguïté interprétative de μᾶλλον χρῆσαι
  choice: Paul invite l’esclave à profiter de la possibilité de devenir libre.
  alternative: Paul lui demande plutôt de tirer parti de sa condition présente, donc de rester esclave.
  rationale: La proposition immédiatement précédente fournit naturellement comme référent la possibilité de devenir libre. Toutefois, puisque le grec n’explicite pas le complément de χρῆσαι et que l’autre lecture est bien attestée, la note préserve cette réelle ambiguïté.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement singulier correspond aux formes grecques au singulier. « Alors que tu étais esclave » explicite avec naturel la circonstance attachée à l’appel sans préciser davantage la nature de celui-ci.
