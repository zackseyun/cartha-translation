source:
  edition: SBLGNT
  text: ἐὰν δὲ καὶ ⸀γαμήσῃς, οὐχ ἥμαρτες. καὶ ἐὰν γήμῃ ἡ παρθένος, οὐχ ἥμαρτεν. θλῖψιν δὲ τῇ σαρκὶ ἕξουσιν οἱ τοιοῦτοι, ἐγὼ δὲ ὑμῶν φείδομαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/028.yaml
  text: But even if you marry[a], you have not sinned; and if the virgin marries, she has not sinned. Yet such people will have tribulation in the flesh[b], and I am sparing you.
translation:
  language: fr
  text: Mais même si tu te maries, tu n’as pas péché ; et si la vierge se marie, elle n’a pas péché. Cependant, ceux qui se marient connaîtront des difficultés dans la chair[a] ; quant à moi, je veux vous épargner cela[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « auront de la détresse dans la chair ». L’expression peut désigner les difficultés concrètes de la vie humaine et conjugale ; elle ne vise pas nécessairement la « nature pécheresse ».'
    reason: Précise le sens probable de τῇ σαρκί tout en préservant dans le texte l’expression grecque et son ambiguïté.
  - marker: b
    text: 'Ou : « je vous épargne » ou « je veux vous ménager ». Paul exprime ainsi le but pastoral de son avertissement.'
    reason: Indique les nuances françaises possibles de φείδομαι sans affaiblir le présent grec.
lexical_decisions:
- source_word: γαμήσῃς
  choice: tu te maries
  rationale: Avec ἐάν et le subjonctif aoriste, la proposition exprime une éventualité future. « Si tu te maries » est naturel en français et garde le tutoiement singulier du grec.
- source_word: ἥμαρτες / ἥμαρτεν
  choice: tu ne pèches pas / elle ne pèche pas
  rationale: L’aoriste nie que le fait de se marier constitue un péché. Le présent français énonce clairement cette appréciation morale générale, sans suggérer un péché antérieur précis.
- source_word: ἡ παρθένος
  choice: la vierge
  rationale: Le terme littéral conserve la précision sexuelle et matrimoniale de παρθένος ainsi que l’article défini, sans réduire le référent à une catégorie plus générale comme « femme non mariée ».
- source_word: θλῖψιν
  choice: des détresses
  rationale: θλῖψις désigne ici pression, peine ou difficulté. « Détresses » garde la force du mot tout en évitant que « tribulation » soit compris exclusivement dans un sens eschatologique.
- source_word: τῇ σαρκί
  choice: dans leur condition humaine
  rationale: Dans ce contexte, σάρξ renvoie vraisemblablement à la vie humaine concrète et incarnée, non à une « nature pécheresse ». Cette formulation française communique ce sens sans introduire une lecture morale étrangère au passage.
- source_word: οἱ τοιοῦτοι
  choice: ceux qui se marient
  rationale: Le grec signifie littéralement « de telles personnes ». Le référent contextuel étant les personnes qui se marient, l’explicitation évite une tournure française vague ou artificielle.
- source_word: φείδομαι
  choice: je voudrais vous les épargner
  rationale: Le verbe exprime le fait d’épargner quelqu’un ou de le ménager. Le conditionnel rend naturellement en français l’intention pastorale de Paul sans affirmer qu’il peut garantir l’absence de ces difficultés.
theological_decisions:
- issue: Sens de σάρξ dans τῇ σαρκί
  choice: la condition humaine concrète et incarnée
  alternative: « dans la chair », éventuellement compris comme la nature pécheresse
  rationale: Le contexte porte sur les difficultés liées au mariage, non sur la dépravation humaine. La traduction évite donc le contresens théologique possible de « chair », tandis qu’une note conserve l’accès à la forme plus littérale.
- issue: Portée de φείδομαι
  choice: 'intention pastorale : « je voudrais vous les épargner »'
  alternative: 'constat direct : « je vous les épargne »'
  rationale: Le présent grec peut être rendu directement, mais le contexte indique que Paul motive son conseil par le désir de ménager ses lecteurs. Le français au conditionnel exprime cette visée sans transformer son avertissement en promesse.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement singulier est maintenu dans la première proposition, puis le pluriel dans l’adresse finale, conformément au grec. La répétition de « se marier » préserve le parallélisme, et « quant à moi » marque l’opposition introduite par ἐγὼ δέ.
