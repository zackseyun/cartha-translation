revisions:
- from: Mais même si tu te maries, tu ne pèches pas ; et si la vierge se marie, elle ne pèche pas. Cependant, ceux qui se marient connaîtront des détresses dans leur condition humaine[a] ; quant à moi, je voudrais vous les épargner[b].
  to: Mais même si tu te maries, tu n’as pas péché ; et si la vierge se marie, elle n’a pas péché. Cependant, ceux qui se marient connaîtront des difficultés dans la chair[a] ; quant à moi, je veux vous épargner cela[b].
  rationale: La révision rapproche les deux négations de l’acte de mariage des aoristes grecs, rétablit « dans la chair » dans le texte afin de ne pas résoudre par avance le sens de σάρξ, et remplace le conditionnel par un présent qui correspond à φείδομαι. Les deux ancres de notes restent correctement placées et les notes ont été ajustées à la formulation révisée.
