source:
  edition: SBLGNT
  text: Εἰ μὴ ἑκάστῳ ὡς ⸀ἐμέρισεν ὁ ⸀κύριος, ἕκαστον ὡς κέκληκεν ὁ ⸀θεός, οὕτως περιπατείτω· καὶ οὕτως ἐν ταῖς ἐκκλησίαις πάσαις διατάσσομαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/017.yaml
  text: Only[a], as the Lord has assigned to each one, as God has called each one, so let him walk[b]. And so I direct in all the churches.
translation:
  language: fr
  text: Seulement[a], comme le Seigneur a donné à chacun[b], comme Dieu a appelé chacun, que chacun marche ainsi[c]. Et c’est ainsi que je le prescris dans toutes les églises.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Toutefois » ou « Mais ». L’expression grecque introduit ici une restriction ou une transition, et non une condition littérale.
    reason: lexical_alternative
  - marker: b
    text: Ou « a attribué », « a accordé en partage » ou « a réparti ». Le verbe grec désigne ce que le Seigneur a distribué ou accordé à chacun.
    reason: lexical_alternative
  - marker: c
    text: « Marcher » est une métaphore biblique courante pour la manière de vivre; on pourrait aussi traduire « vive ainsi » ou « se conduise ainsi ».
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰ μὴ
  choice: Seulement
  rationale: Dans ce contexte, l’expression sert de transition restrictive ou adversative plutôt que de condition littérale. « Seulement » conserve cette fonction sans introduire une opposition plus forte que le grec.
- source_word: ἐμέρισεν
  choice: a attribuée
  rationale: Le verbe évoque la part répartie ou assignée à chacun. « Attribuer une part » est naturel en français et laisse ouverte la nature précise de cette part.
- source_word: ἑκάστῳ / ἕκαστον
  choice: à chacun / chacun
  rationale: La répétition de « chacun » maintient la portée distributive et personnelle du grec.
- source_word: κέκληκεν
  choice: a adressé [son] appel
  rationale: La tournure nominale française rend naturellement le verbe « appeler » tout en conservant l’idée de l’appel divin et sans préciser davantage les circonstances de cet appel.
- source_word: περιπατείτω
  choice: que chacun marche ainsi
  rationale: « Marcher » conserve la métaphore biblique de la conduite de vie. Le subjonctif exhortatif rend l’impératif grec à la troisième personne.
- source_word: διατάσσομαι
  choice: je le prescris
  rationale: « Prescrire » exprime une directive faisant autorité sans durcir inutilement le ton en commandement abrupt.
- source_word: ἐν ταῖς ἐκκλησίαις πάσαις
  choice: dans toutes les églises
  rationale: Dans le contexte paulinien, ἐκκλησίαι désigne les communautés chrétiennes locales; « églises » est ici le terme français courant et établi.
theological_decisions:
- issue: Distinction entre « le Seigneur » et « Dieu »
  choice: Conserver distinctement « le Seigneur » pour κύριος et « Dieu » pour θεός.
  alternative: Traiter les deux titres comme de simples variantes stylistiques désignant indistinctement le même référent.
  rationale: Le texte grec emploie deux désignations divines différentes dans des propositions parallèles. La traduction préserve cette distinction sans l’harmoniser.
- issue: Sens de l’appel divin et rapport avec la situation de chacun
  choice: Traduire « selon l’appel que Dieu lui a adressé » sans préciser si l’expression désigne surtout l’appel au salut ou la situation dans laquelle la personne a été appelée.
  alternative: Expliciter « dans la condition où Dieu l’a appelé » ou limiter le sens à l’appel au salut.
  rationale: Le contexte peut rapprocher l’appel de la condition de vie, mais la formulation grecque ne résout pas entièrement le rapport entre les deux. La traduction conserve cette tension.
- issue: Métaphore éthique de περιπατείτω
  choice: Conserver la métaphore avec « marche ».
  alternative: Rendre directement par « vive » ou « se conduise ».
  rationale: La métaphore désigne la manière de vivre, mais reste intelligible dans un registre biblique français et évite d’en réduire la portée.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe légèrement solennelle conserve le parallélisme du grec, la répétition de « chacun » et la métaphore de la marche, tout en restant lisible. « églises » porte une minuscule puisqu’il s’agit des communautés locales.
