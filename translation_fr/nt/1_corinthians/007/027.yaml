  source_fidelity: La structure interrogative et les impératifs sont bien rendus, et l’opposition entre être lié et être libéré doit être conservée. Toutefois, « de tout lien avec une femme » ajoute « tout » et transforme le complément grec (« d’une femme ») en une notion plus large. La note propose aussi « te remarier », qui suppose indûment un mariage antérieur alors que le grec dit simplement de ne pas chercher une épouse.
  naturalness: « Es-tu lié à une femme ? » et « Ne cherche pas d’épouse » sont naturels dans un registre biblique moderne et accessible. « Être libéré » est plus idiomatique que « être dégagé de ce lien » tout en conservant l’image de la libération.
  terminology: « Femme » convient dans les deux premières occurrences, où le contexte matrimonial donne à γυνή le sens de femme/épouse. « Épouse » dans la dernière clause rend clairement γυναῖκα sans l’interprétation plus développée « chercher à te marier ». Le couple « lié/libéré » maintient le parallélisme δέδεσαι/λύσις/λέλυσαι.
