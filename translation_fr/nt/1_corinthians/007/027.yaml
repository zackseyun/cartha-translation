  text: Are you bound to a wife? Do not seek release[a]. Are you released from a wife? Do not seek a wife.
translation:
  language: fr
  text: Es-tu lié à une femme ? Ne cherche pas à être libéré[a]. Es-tu libéré d’une femme ? Ne cherche pas d’épouse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de manière plus interprétative : « Es-tu marié ? Ne cherche pas à divorcer. Es-tu divorcé ? Ne cherche pas d’épouse. » Le grec parle plus littéralement d’être « lié » et « libéré ».'
    reason: alternative_reading
lexical_decisions:
- source_word: δέδεσαι γυναικί
  choice: Es-tu lié à une femme ?
  rationale: Le parfait de δέω exprime un état présent résultant d’un lien établi. « Lié à une femme » conserve l’image grecque et, dans ce contexte, désigne le lien conjugal sans la remplacer d’emblée par le terme interprétatif « marié ».
- source_word: μὴ ζήτει
  choice: Ne cherche pas
  rationale: Cette formulation naturelle conserve la valeur de l’impératif présent négatif et le sens courant de ζητέω.
- source_word: λύσιν
  choice: à être dégagé de ce lien
  rationale: λύσις désigne l’action de délier ou la libération. Cette formulation rend le sens en français idiomatique et maintient le rapport lexical avec λέλυσαι, tout en évitant de réduire explicitement le mot au seul divorce.
- source_word: λέλυσαι ἀπὸ γυναικός
  choice: Es-tu dégagé de tout lien avec une femme ?
  rationale: Le parfait de λύω décrit l’état de celui qui a été délié. « Dégagé de tout lien » préserve le contraste avec « lié » et laisse subsister l’étendue exacte de la situation envisagée, plutôt que de trancher entre divorce, veuvage ou autre état sans épouse.
- source_word: μὴ ζήτει γυναῖκα
  choice: Ne cherche pas à te marier
  rationale: Littéralement, il s’agit de ne pas « chercher une femme », mais en contexte γυναῖκα signifie une épouse. En français moderne, « chercher une femme » peut suggérer simplement la rechercher ou avoir une connotation inadéquate ; « chercher à te marier » exprime clairement la visée conjugale.
theological_decisions:
- issue: Faut-il expliciter les catégories « marié » et « divorcé », ou conserver l’image du lien et du dégagement ?
  choice: Conserver dans le texte principal l’image d’être « lié » et « dégagé » de ce lien.
  alternative: « Es-tu marié ? Ne cherche pas à divorcer. Es-tu divorcé ? Ne cherche pas à te remarier. »
  rationale: Le grec emploie le vocabulaire de lier et délier, non des termes juridiques explicites pour le mariage et le divorce. La formulation retenue respecte cette image et n’impose pas une interprétation plus étroite que le texte.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement singulier correspond aux formes grecques de deuxième personne du singulier. La répétition de « lien » rend explicite en français la métaphore structurante du grec sans imposer le divorce comme unique référent.
