  text: τί γὰρ οἶδας, γύναι, εἰ τὸν ἄνδρα σώσεις; ἢ τί οἶδας, ἄνερ, εἰ τὴν γυναῖκα σώσεις;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/016.yaml
  text: For how do you know[a], wife, whether you will save your husband? Or how do you know, husband, whether you will save your wife?
translation:
  language: fr
  text: Car comment peux-tu savoir, femme, si tu sauveras[a] ton mari ? Ou comment peux-tu savoir, mari, si tu sauveras ta femme ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec emploie le futur (« tu sauveras ») dans une question indirecte. Plus idiomatiquement, on pourrait rendre : « si tu pourrais sauver… »'
    reason: lexical_alternative
lexical_decisions:
- source_word: τί γὰρ οἶδας
  choice: Car comment peux-tu savoir
  rationale: L’expression interrogative τί + οἶδας se rend naturellement en français par « comment peux-tu savoir ». « Car » conserve la valeur explicative de γάρ et rattache le verset au raisonnement précédent.
- source_word: γύναι
  choice: femme
  rationale: Dans ce contexte conjugal, γυνή désigne l’épouse. En apostrophe, « femme » est une formulation française concise qui reste clairement conjugale grâce à « ton mari ».
- source_word: ἄνερ
  choice: mari
  rationale: Dans le cadre du mariage, le vocatif ἄνερ désigne le mari plutôt que l’homme en général.
- source_word: σώσεις
  choice: tu sauveras
  rationale: Le futur de σῴζω est conservé directement. Dans la question indirecte introduite par εἰ, il exprime une issue incertaine plutôt qu’une prédiction assurée.
- source_word: τὸν ἄνδρα
  choice: ton mari
  rationale: Le possessif est nécessaire en français courant pour exprimer naturellement la relation conjugale visée par l’article grec.
- source_word: τὴν γυναῖκα
  choice: ta femme
  rationale: Le possessif rend naturellement en français la relation conjugale déterminée par le contexte.
- source_word: ἢ
  choice: Ou
  rationale: « Ou » restitue simplement la coordination disjonctive entre les deux questions parallèles.
theological_decisions:
- issue: Sens de « sauver » dans le contexte conjugal
  choice: Conserver « sauver » et sa portée sotériologique possible
  alternative: « amener à la foi », « préserver le mariage » ou préciser une autre forme de salut
  rationale: σῴζω porte couramment chez Paul un sens lié au salut. Le texte envisage l’effet possible du conjoint croyant sur le conjoint non croyant sans expliquer le mode de cette action. « Sauver » préserve cette tension et n’impose pas une interprétation plus étroite.
translation_notes:
  register: Français moderne, international et digne. Le tutoiement singulier correspond à l’adresse directe à chacun des deux conjoints. Le parallélisme du grec est conservé. L’appel « femme » peut paraître plus marqué en français actuel, mais il maintient la distinction conjugale du contexte sans ajouter un possessif absent dans le vocatif.
