source:
  edition: SBLGNT
  text: περιτετμημένος τις ἐκλήθη; μὴ ἐπισπάσθω· ἐν ἀκροβυστίᾳ ⸂κέκληταί τις⸃; μὴ περιτεμνέσθω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/018.yaml
  text: Was anyone called while circumcised? He should not try to reverse it[a]. Was anyone called while uncircumcised? He should not be circumcised.
translation:
  language: fr
  text: Quelqu’un était-il circoncis lorsqu’il a été appelé ? Qu’il ne cherche pas à effacer les marques de sa circoncision[a]. Quelqu’un était-il incirconcis lorsqu’il a été appelé ? Qu’il ne se fasse pas circoncire.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « Qu’il ne devienne pas incirconcis », c’est-à-dire qu’il ne tente pas de dissimuler ou d’annuler les marques de la circoncision.'
    reason: alternative lexicale et éclaircissement historique
lexical_decisions:
- source_word: περιτετμημένος
  choice: était circoncis
  rationale: Le participe parfait exprime l’état résultant d’une circoncision antérieure. Cette formulation française rend cet état et s’accorde naturellement avec la proposition temporelle.
- source_word: ἐκλήθη / κέκληταί
  choice: lorsqu’il a été appelé
  rationale: Dans ce contexte, le verbe renvoie vraisemblablement à l’appel de Dieu reçu par le croyant. « Appelé » conserve toutefois la formulation de Paul sans la préciser excessivement par « converti ».
- source_word: ἐπισπάσθω
  choice: qu’il ne cherche pas à effacer les marques de sa circoncision
  rationale: Le verbe désigne le fait de rendre moins visibles ou de tenter d’annuler extérieurement les marques de la circoncision. La formulation choisie communique ce sens en français moderne; le rendu plus littéral figure en note.
- source_word: ἐν ἀκροβυστίᾳ
  choice: était incirconcis
  rationale: La locution désigne l’état d’incirconcision au moment de l’appel. « Incirconcis » est précis, naturel et maintient le parallélisme avec « circoncis ».
- source_word: περιτεμνέσθω
  choice: qu’il ne se fasse pas circoncire
  rationale: L’impératif présent négatif exprime ici une interdiction. La tournure pronominale indique naturellement en français que la personne ne doit pas entreprendre de recevoir la circoncision.
theological_decisions:
- issue: Sens de l’appel dans les deux propositions
  choice: L’appel de Dieu reçu par une personne alors qu’elle se trouvait dans une condition religieuse et corporelle donnée
  alternative: Un appel ou une invitation au sens général
  rationale: Dans le contexte immédiat de 1 Corinthiens 7, Paul rattache la condition du croyant à l’appel divin. La traduction conserve néanmoins le mot « appelé » afin de ne pas remplacer cette notion par une interprétation telle que « converti ».
translation_notes:
  register: Français international moderne, digne et accessible. Les deux questions et les deux impératifs sont construits en parallèle. « Incirconcis » est retenu pour sa précision malgré son emploi moins fréquent dans la langue courante.
