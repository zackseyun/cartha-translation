  source_fidelity: Le texte grec répète ἡγίασται et oppose ἀκάθαρτα à ἅγια ; « a été sanctifié » / « impurs » / « saints » maintient cette cohésion. La valeur relationnelle de ἐν est rendue plus naturellement par « par » dans ce contexte, sans trancher la portée précise de la sanctification. « Autrement, vos enfants seraient impurs » exprime en français la conséquence contraire à laquelle répond le raisonnement, tout en préservant l’opposition avec leur état présent (« mais maintenant ils sont saints »).
  naturalness: « Dans son union avec le frère » est pesant et peut produire une lecture malencontreuse avant que la note n’éclaire le référent. « Par le frère » est plus idiomatique, suit l’orientation de l’audit anglais (« through ») et laisse à la note l’explication lexicale nécessaire.
  terminology: « Non croyant », « sanctifié », « impurs » et « saints » conviennent au registre biblique moderne et préservent les liens lexicaux grecs. « Le frère » est conservé, conformément à ἀδελφῷ, avec une note indiquant son sens probable de mari croyant.
