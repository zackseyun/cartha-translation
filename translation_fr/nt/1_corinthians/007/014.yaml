    rationale: Le grec dit littéralement « en/dans la femme » et « en/dans le frère » ; dans ce contexte, le français « par » rend naturellement la relation ou médiation exprimée, sans introduire une formulation ambiguë.
  - severity: low
    issue: « Autrement, vos enfants sont impurs » est grammaticalement possible mais sonne moins naturellement en français dans une conséquence hypothétique.
    rationale: Après « autrement », le conditionnel (« seraient impurs ») restitue l’inférence argumentative de Paul ; « mais maintenant ils sont saints » conserve le contraste de νῦν δέ et le présent de l’état affirmé.
