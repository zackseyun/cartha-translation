source:
  edition: SBLGNT
  text: ἡγίασται γὰρ ὁ ἀνὴρ ὁ ἄπιστος ἐν τῇ γυναικί, καὶ ἡγίασται ἡ γυνὴ ἡ ἄπιστος ἐν τῷ ⸀ἀδελφῷ· ἐπεὶ ἄρα τὰ τέκνα ὑμῶν ἀκάθαρτά ἐστιν, νῦν δὲ ἅγιά ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/014.yaml
  text: For the unbelieving husband has been made holy through his wife[a], and the unbelieving wife has been made holy through the brother; otherwise your children are unclean, but as it is[b], they are holy.
translation:
  language: fr
  text: En effet, le mari non croyant a été sanctifié par sa femme[b], et la femme non croyante a été sanctifiée par le frère[a] ; autrement, vos enfants seraient impurs, mais maintenant ils sont saints.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « le frère », probablement au sens de « le mari croyant » ; Paul appelle couramment « frère » un autre croyant.'
    reason: lexical_alternative
  - marker: b
    text: Ici, « sanctifié » peut désigner un statut consacré ou mis à part dans le cadre de l’union avec le conjoint croyant et de la famille ; le terme n’affirme pas nécessairement le salut personnel du conjoint non croyant.
    reason: cultural_note
lexical_decisions:
- source_word: ἡγίασται
  choice: a été sanctifié
  rationale: Le parfait passif exprime une action accomplie dont l’effet demeure. « A été sanctifié » conserve le lien lexical avec « saints » sans préciser à tort qu’il s’agit nécessairement du salut personnel.
- source_word: ἄπιστος
  choice: non croyant / non croyante
  rationale: Dans ce contexte conjugal, l’adjectif désigne la personne qui ne partage pas la foi, plutôt qu’une personne infidèle ou indigne de confiance.
- source_word: ἐν
  choice: dans son union avec
  rationale: Cette formulation française rend la valeur relationnelle de ἐν dans le mariage sans présenter automatiquement le conjoint croyant comme la cause directe d’un salut personnel.
- source_word: ἀνήρ / γυνή
  choice: mari / femme
  rationale: Le contexte porte explicitement sur le mariage ; ces sens contextuels sont donc préférables à « homme / femme ».
- source_word: ἀδελφῷ
  choice: le frère
  rationale: Le texte grec emploie précisément « le frère », appellation paulinienne habituelle d’un croyant. La formulation est conservée dans le texte, avec une note explicative.
- source_word: ἐπεὶ ἄρα
  choice: autrement
  rationale: Le groupe introduit la conséquence qui s’ensuivrait si l’affirmation précédente n’était pas vraie.
- source_word: ἀκάθαρτα
  choice: impurs
  rationale: « Impurs » conserve la portée cultuelle et religieuse du terme, en contraste avec « saints ».
- source_word: νῦν δὲ
  choice: mais en réalité
  rationale: Dans ce raisonnement, νῦν δὲ oppose la situation réelle à la conséquence hypothétique, plutôt que de marquer simplement un moment chronologique.
- source_word: ἅγια
  choice: saints
  rationale: « Saints » maintient le lien avec le verbe « sanctifier » et préserve la portée théologique du vocabulaire grec.
theological_decisions:
- issue: Sens de la sanctification du conjoint non croyant
  choice: Conserver le langage de la sanctification tout en situant celle-ci dans l’union conjugale.
  alternative: Interpréter explicitement la formule comme le salut personnel du conjoint, ou seulement comme la légitimité sexuelle du mariage.
  rationale: Le raisonnement concerne le statut du mariage et celui des enfants, mais le verset ne définit pas entièrement la nature de cette sanctification. La traduction et la note préservent cette tension sans affirmer un salut automatique.
- issue: Référent de ἀδελφῷ
  choice: Maintenir « le frère » dans le texte, en l’expliquant comme le mari croyant probable.
  alternative: Remplacer directement par « le mari croyant » ou « le conjoint croyant ».
  rationale: Le maintien de « frère » rend visible le choix lexical particulier du grec, tandis que la note assure l’intelligibilité en français.
translation_notes:
  register: Français international moderne, digne et accessible. « Non croyant » est plus naturel ici qu’« incroyant ». La construction « dans son union avec » rend la relation conjugale exprimée par ἐν tout en évitant une causalité doctrinale trop précise. La répétition de « sanctifié » et le contraste « impurs / saints » reproduisent la cohésion lexicale et argumentative du grec.
