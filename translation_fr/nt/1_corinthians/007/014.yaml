revisions:
- from: En effet, le mari non croyant a été sanctifié dans son union avec sa femme[b], et la femme non croyante a été sanctifiée dans son union avec le frère[a] ; autrement, vos enfants sont impurs, mais en réalité, ils sont saints.
  to: En effet, le mari non croyant a été sanctifié par sa femme[b], et la femme non croyante a été sanctifiée par le frère[a] ; autrement, vos enfants seraient impurs, mais maintenant ils sont saints.
  rationale: La révision améliore l’idiomaticité française et évite d’expliciter inutilement « union » dans le texte principal. Elle maintient le vocabulaire théologique du grec, le terme source particulier « le frère » et l’ambiguïté délibérée concernant la nature de la sanctification. Les deux notes existantes restent correctement ancrées et conservent leurs fonctions.
