  text: Περὶ δὲ ὧν ⸀ἐγράψατε, καλὸν ἀνθρώπῳ γυναικὸς μὴ ἅπτεσθαι·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/001.yaml
  text: 'Concerning the matters you wrote about: it is good for a man not to touch a woman.[a]'
translation:
  language: fr
  text: 'Quant aux sujets sur lesquels vous avez écrit : il est bon pour un homme de ne pas toucher une femme.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ici, « toucher une femme » peut être une manière indirecte de parler de relations sexuelles.
    reason: La note éclaire l’emploi probablement euphémistique de ἅπτεσθαι sans imposer cette interprétation dans le texte principal.
lexical_decisions:
- source_word: Περὶ δὲ ὧν ἐγράψατε
  choice: Quant aux sujets sur lesquels vous avez écrit
  rationale: « Quant à » rend naturellement la transition περὶ δέ sans ajouter un adverbe temporel. Le pluriel « sujets » explicite sobrement le relatif neutre pluriel ὧν dans un français courant.
- source_word: καλόν
  choice: il est bon
  rationale: Cette formulation conserve l’évaluation générale du grec sans préciser s’il s’agit d’un bien moral, pratique ou circonstanciel.
- source_word: ἀνθρώπῳ
  choice: pour un homme
  rationale: Dans l’opposition avec γυναικός et dans le contexte immédiat, « homme » exprime ici le référent masculin plus clairement que le générique « être humain ».
- source_word: γυναικὸς μὴ ἅπτεσθαι
  choice: ne pas toucher de femme
  rationale: La traduction garde l’image concrète et l’euphémisme possible du verbe ἅπτομαι. La construction française avec « de femme » restitue naturellement la portée générale de l’expression.
theological_decisions:
- issue: Parole de Paul ou citation de la lettre des Corinthiens
  choice: Ne pas employer de guillemets
  alternative: Mettre « il est bon pour un homme de ne pas toucher de femme » entre guillemets comme citation des Corinthiens
  rationale: Le grec ne comporte aucun marqueur explicite de citation. L’absence de guillemets préserve la possibilité que Paul cite leur formule ou qu’il commence directement sa réponse.
- issue: Sens de « toucher une femme »
  choice: Conserver l’expression littérale dans le texte et signaler son sens possible en note
  alternative: Traduire directement par « ne pas avoir de relations sexuelles avec une femme »
  rationale: Le verbe peut fonctionner comme un euphémisme sexuel, mais une explicitation dans le corps du texte supprimerait l’image et rendrait le sens plus catégorique que la formulation grecque.
translation_notes:
  register: Français international moderne, sobre et digne. La phrase conserve la brièveté de l’original et évite d’ajouter « maintenant » ou « vous m’avez écrit », éléments qui ne sont pas exprimés explicitement en grec.
