source:
  edition: SBLGNT
  text: Τοῖς δὲ γεγαμηκόσιν παραγγέλλω, οὐκ ἐγὼ ἀλλὰ ὁ κύριος, γυναῖκα ἀπὸ ἀνδρὸς μὴ χωρισθῆναι—
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/010.yaml
  text: 'To the married I give this command—not I[a], but the Lord: a wife must not separate from her husband—'
translation:
  language: fr
  text: 'Aux personnes mariées, je donne cet ordre — non pas moi, mais le Seigneur : qu''une femme ne se sépare pas[a] de son mari —'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « qu''elle ne divorce pas de son mari ». Le verbe grec peut désigner une séparation conjugale qui, selon le contexte, peut inclure le divorce.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῖς δὲ γεγαμηκόσιν
  choice: À ceux qui sont mariés
  rationale: Le participe parfait désigne les personnes qui se trouvent dans l’état du mariage. La tournure française rend clairement le destinataire, tandis que δέ marque ici une transition légère que l’enchaînement naturel suffit à exprimer.
- source_word: παραγγέλλω
  choice: je donne cet ordre
  rationale: Cette formulation restitue la force d’une instruction autoritative tout en restant naturelle en français moderne.
- source_word: οὐκ ἐγὼ ἀλλὰ ὁ κύριος
  choice: non pas moi, mais le Seigneur
  rationale: La formulation conserve le contraste emphatique du grec sans expliquer dans le corps du texte la nature de ce contraste.
- source_word: γυναῖκα ἀπὸ ἀνδρὸς
  choice: la femme ... de son mari
  rationale: Dans ce contexte matrimonial, γυνή et ἀνήρ signifient respectivement « femme/épouse » et « mari ». Le possessif « son » rend naturellement la relation en français.
- source_word: μὴ χωρισθῆναι
  choice: que la femme ne se sépare pas
  rationale: L’infinitif exprime le contenu de l’ordre. « Se séparer » préserve l’étendue sémantique du verbe grec sans la réduire d’emblée au divorce juridique.
theological_decisions:
- issue: Sens de « non pas moi, mais le Seigneur »
  choice: Conserver littéralement le contraste entre Paul et le Seigneur
  alternative: Expliciter que Paul oppose un enseignement déjà donné par Jésus à sa propre application apostolique
  rationale: Le texte établit le contraste sans nier explicitement l’autorité de Paul. La traduction préserve cette tension sans ajouter d’interprétation doctrinale.
- issue: Portée de χωρισθῆναι dans le mariage
  choice: se sépare
  alternative: divorce
  rationale: Le verbe peut couvrir la séparation conjugale et, selon le contexte social ou juridique, le divorce. Le terme plus large respecte l’ambiguïté du grec et la suite immédiate du passage.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe conserve la structure solennelle de l’ordre et le tiret final, qui indique que la phrase se poursuit au verset suivant.
