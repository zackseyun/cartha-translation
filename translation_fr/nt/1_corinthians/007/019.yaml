id: 1CO.7.19
reference: 1 Corinthians 7:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἡ περιτομὴ οὐδέν ἐστιν, καὶ ἡ ἀκροβυστία οὐδέν ἐστιν, ἀλλὰ τήρησις ἐντολῶν θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/019.yaml
  text: Circumcision is nothing[a], and uncircumcision is nothing, but keeping the commandments of God.
translation:
  language: fr
  text: La circoncision n’est rien[a], et l’incirconcision n’est rien ; ce qui compte, c’est de garder les commandements de Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « n’a aucune importance », ici et pour la seconde occurrence de « n’est rien ».
    reason: Alternative lexicale exprimant explicitement la portée évaluative de οὐδέν ἐστιν.
lexical_decisions:
- source_word: περιτομή
  choice: la circoncision
  rationale: Le nom français usuel conserve la forme nominale et le contraste entre deux marqueurs de statut.
- source_word: οὐδέν ἐστιν
  choice: n’est rien
  rationale: Cette formulation directe reproduit l’affirmation abrupte et répétée du grec. La variante « n’a aucune importance » explicite davantage sa valeur évaluative.
- source_word: ἀκροβυστία
  choice: l’incirconcision
  rationale: Le terme forme l’antonyme direct de « circoncision » et préserve le parallélisme rhétorique, malgré son caractère moins courant en français général.
- source_word: ἀλλά
  choice: ce qui compte, c’est
  rationale: 'Cette tournure française exprime naturellement le contraste elliptique introduit par ἀλλά : les deux statuts ne comptent pas, contrairement à l’observation des commandements.'
- source_word: τήρησις
  choice: garder
  rationale: Le verbe « garder » associé aux commandements est naturel, concret et proche de l’idée d’observance portée par le nom grec.
- source_word: ἐντολῶν θεοῦ
  choice: les commandements de Dieu
  rationale: La formulation conserve le pluriel concret et la relation génitive du grec dans un registre français digne et courant.
theological_decisions:
- issue: La valeur accordée par Paul à la circoncision et à l’incirconcision
  choice: Le verset déclare que ni la circoncision ni l’incirconcision ne comptent, en les opposant au fait de garder les commandements de Dieu.
  alternative: Comprendre que le verset abolit toute signification morale possible de la circoncision dans tous les contextes.
  rationale: La traduction maintient la force du contraste dans l’argument immédiat sans tirer de conclusion théologique plus large que ne l’énonce le verset.
translation_notes:
  register: Français international moderne, clair et digne. « Incirconcision » est conservé pour la précision et la symétrie. La proposition « ce qui compte, c’est de garder » restitue en français naturel l’opposition elliptique du grec sans modifier son enjeu.
