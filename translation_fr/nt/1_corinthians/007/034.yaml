reference: 1 Corinthians 7:34
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸀καὶ μεμέρισται. καὶ ἡ γυνὴ ⸂ἡ ἄγαμος⸃ καὶ ἡ ⸀παρθένος μεριμνᾷ τὰ τοῦ κυρίου, ἵνα ᾖ ἁγία καὶ ⸀τῷ σώματι καὶ ⸁τῷ πνεύματι· ἡ δὲ γαμήσασα μεριμνᾷ τὰ τοῦ κόσμου, πῶς ⸀ἀρέσῃ τῷ ἀνδρί.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/034.yaml
  text: And she is divided. And the unmarried woman[a], that is, the virgin, is concerned about the things of the Lord, so that she may be holy both in body and in spirit. But the married woman is concerned about the things of the world, how she may please her husband.
translation:
  language: fr
  text: Et il est partagé. La femme non mariée, c’est-à-dire la vierge[a], se préoccupe de ce qui concerne le Seigneur, afin qu’elle soit sainte, de corps et d’esprit. Mais la femme mariée se préoccupe de ce qui concerne le monde, comment plaire à son mari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « La femme non mariée et la vierge se préoccupent de ce qui concerne le Seigneur. » Le grec peut présenter deux catégories au lieu d’identifier la femme non mariée à la vierge.'
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ μεμέρισται
  choice: Et il est partagé
  rationale: Le parfait passif de μερίζω exprime un état résultant et prolonge la pensée du verset précédent, où le sujet est l’homme marié. « Il est partagé » conserve la métaphore des intérêts divisés sans l’interpréter comme une simple distraction.
- source_word: ἡ γυνὴ ἡ ἄγαμος
  choice: la femme non mariée
  rationale: Dans ce contraste avec la femme mariée, γυνή désigne naturellement une femme et ἄγαμος son état non marié.
- source_word: ἡ παρθένος
  choice: la vierge
  rationale: « Vierge » conserve la précision lexicale de παρθένος, plutôt que de l’atténuer par un terme plus général.
- source_word: ἡ γυνὴ ἡ ἄγαμος καὶ ἡ παρθένος
  choice: La femme non mariée, c’est-à-dire la vierge
  rationale: La construction grecque est condensée. La forme verbale au singulier favorise une lecture appositionnelle, rendue naturellement par « c’est-à-dire »; la lecture coordonnée demeure signalée en note.
- source_word: μεριμνᾷ
  choice: se préoccupe de
  rationale: Dans ce contexte, le verbe décrit une préoccupation ou une attention soutenue, sans impliquer nécessairement une anxiété fautive.
- source_word: τὰ τοῦ κυρίου
  choice: ce qui concerne le Seigneur
  rationale: Cette formulation française naturelle garde l’idée des affaires ou intérêts liés au Seigneur et reste parallèle à « ce qui concerne le monde ».
- source_word: ἵνα ᾖ ἁγία
  choice: afin d’être sainte
  rationale: « Afin de » exprime la visée portée par ἵνα avec le subjonctif, tout en maintenant explicitement le vocabulaire de la sainteté.
- source_word: καὶ τῷ σώματι καὶ τῷ πνεύματι
  choice: de corps et d’esprit
  rationale: Les datifs indiquent les domaines dans lesquels la sainteté est envisagée. L’expression française est claire et n’accentue pas indûment une théorie anthropologique.
- source_word: ἡ δὲ γαμήσασα
  choice: Mais la femme mariée
  rationale: Le participe aoriste substantivé désigne ici la femme dans l’état matrimonial; « femme mariée » est idiomatique et marque nettement le contraste.
- source_word: τὰ τοῦ κόσμου
  choice: ce qui concerne le monde
  rationale: Le parallélisme avec « ce qui concerne le Seigneur » est préservé sans donner à κόσμος une nuance péjorative plus forte que ne l’exige le contexte.
- source_word: πῶς ἀρέσῃ τῷ ἀνδρί
  choice: cherchant comment plaire à son mari
  rationale: ἀνήρ signifie clairement « mari » dans ce contexte. L’ajout léger de « cherchant » rattache naturellement la proposition interrogative indirecte à la préoccupation mentionnée.
theological_decisions:
- issue: La femme non mariée et la vierge désignent-elles deux catégories ou une seule catégorie expliquée en apposition ?
  choice: 'Lecture appositionnelle : « la femme non mariée, c’est-à-dire la vierge »'
  alternative: 'Lecture coordonnée : « la femme non mariée et la vierge »'
  rationale: La syntaxe grecque permet les deux analyses. Le verbe singulier μεριμνᾷ favorise la lecture d’un sujet unifié, mais la coordination reste réellement possible; elle est donc conservée en note plutôt qu’écartée.
- issue: Sujet implicite de καὶ μεμέρισται
  choice: « Et il est partagé », rattaché à l’homme marié du verset précédent
  alternative: « Et elle est partagée », selon une ponctuation qui rattache la proposition à la femme
  rationale: La continuité syntaxique avec 1 Corinthiens 7.33 favorise le rattachement à l’homme marié. Le grec ne fournit toutefois aucun pronom sujet explicite; la traduction suit la ponctuation critique du SBLGNT et le contexte immédiat.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme entre « ce qui concerne le Seigneur » et « ce qui concerne le monde » est maintenu. « De corps et d’esprit » offre une formulation française fluide, tandis que la note conserve l’ambiguïté syntaxique principale du texte grec.
