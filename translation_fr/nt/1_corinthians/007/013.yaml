  text: καὶ γυνὴ ⸂εἴ τις⸃ ἔχει ἄνδρα ἄπιστον, καὶ ⸀οὗτος συνευδοκεῖ οἰκεῖν μετ’ αὐτῆς, μὴ ἀφιέτω ⸂τὸν ἄνδρα⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/013.yaml
  text: And if a woman has an unbelieving husband[a], and he consents to live with her, she must not leave her husband.
translation:
  language: fr
  text: Et si une femme a un mari non croyant et que celui-ci accepte de vivre avec elle, qu’elle ne quitte pas son mari.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qu’elle ne se sépare pas de son mari » ou « qu’elle ne divorce pas de son mari ». Le verbe grec peut signifier « laisser » ou « renvoyer » ; ici, il désigne la rupture de la relation conjugale.
    reason: lexical_alternative
lexical_decisions:
- source_word: γυνή
  choice: une femme
  rationale: Le nom peut désigner une femme ou une épouse. La mention de « son mari » établit clairement ici le cadre conjugal, tandis que « une femme a un mari » est naturel en français.
- source_word: εἴ τις
  choice: si une femme
  rationale: La tournure grecque introduit un cas général. Le français exprime naturellement cette valeur indéfinie sans traduire séparément τις.
- source_word: ἄνδρα ἄπιστον
  choice: un mari qui ne croit pas
  rationale: Dans ce contexte conjugal, ἀνήρ signifie « mari ». ἄπιστος désigne ici celui qui ne partage pas la foi chrétienne; la proposition « qui ne croit pas » évite que « infidèle » soit compris comme une infidélité conjugale.
- source_word: συνευδοκεῖ
  choice: accepte
  rationale: Le verbe exprime un accord volontaire. « Accepte » est actuel, clair et naturel dans le contexte de la poursuite de la vie commune.
- source_word: οἰκεῖν μετ’ αὐτῆς
  choice: de vivre avec elle
  rationale: L’expression désigne la continuation de la vie commune; « vivre avec elle » la rend directement en français moderne.
- source_word: μὴ ἀφιέτω τὸν ἄνδρα
  choice: qu’elle ne quitte pas son mari
  rationale: ἀφίημι peut signifier laisser ou renvoyer et, ici, vise la rupture de la relation conjugale. « Quitter » conserve la largeur du grec sans imposer exclusivement la catégorie juridique du divorce.
theological_decisions:
- issue: Portée de ἀφιέτω dans l’instruction concernant un mariage où un seul conjoint croit
  choice: qu’elle ne quitte pas son mari
  alternative: qu’elle ne divorce pas de son mari
  rationale: Le contexte concerne le maintien du mariage, mais le verbe grec reste plus large que le seul acte juridique du divorce. « Quitte » préserve cette latitude tout en indiquant, grâce au contexte, une rupture conjugale plutôt qu’une simple absence temporaire.
translation_notes:
  register: Français international moderne, clair et digne. La structure coordonnée avec « Et » maintient le lien avec le cas parallèle du verset précédent. Le subjonctif exhortatif « qu’elle ne quitte pas » restitue naturellement l’impératif grec à la troisième personne.
