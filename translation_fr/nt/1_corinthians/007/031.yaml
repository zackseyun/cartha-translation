reference: 1 Corinthians 7:31
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ οἱ χρώμενοι ⸂τὸν κόσμον⸃ ὡς μὴ καταχρώμενοι· παράγει γὰρ τὸ σχῆμα τοῦ κόσμου τούτου.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/031.yaml
  text: and those who use the world as not making full use of it[b][a]; for the present form of this world is passing away.
translation:
  language: fr
  text: et ceux qui font usage du monde comme s’ils n’en faisaient pas pleinement usage[a], car la forme actuelle de ce monde passe[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « comme s’ils n’en usaient pas pleinement » ; le verbe peut aussi signifier « comme s’ils n’en abusaient pas ».
    reason: lexical_alternative
  - marker: b
    text: Ou « l’aspect extérieur » ou « la configuration » de ce monde.
    reason: lexical_alternative
lexical_decisions:
- source_word: χρώμενοι (χράομαι)
  choice: se servent de
  rationale: Cette tournure française exprime naturellement l’usage et permet de conserver le jeu verbal avec καταχρώμενοι.
- source_word: τὸν κόσμον
  choice: du monde
  rationale: Dans ce contexte, κόσμος désigne le monde dans son ordre social et matériel présent ; la formulation directe préserve la portée du terme.
- source_word: ὡς μὴ καταχρώμενοι
  choice: comme n’en usant pas pleinement
  rationale: καταχράομαι intensifie ici χράομαι et peut évoquer le fait d’user pleinement d’une chose, voire d’en abuser. Cette formulation maintient le contraste verbal sans réduire le sens à l’abus moral.
- source_word: παράγει
  choice: est en train de passer
  rationale: Le présent grec décrit un processus en cours ; cette tournure française en rend clairement l’aspect duratif.
- source_word: τὸ σχῆμα
  choice: la forme actuelle
  rationale: σχῆμα désigne la configuration ou l’aspect présent plutôt que la nature essentielle. « Actuelle » explicite ici la dimension temporaire indiquée par le contexte.
- source_word: τοῦ κόσμου τούτου
  choice: de ce monde
  rationale: Le démonstratif τούτου est conservé afin de souligner qu’il s’agit de l’ordre présent du monde.
theological_decisions:
- issue: Sens de καταχρώμενοι par rapport à χρώμενοι
  choice: Paul appelle à se servir du monde sans en user pleinement ni s’y investir sans réserve.
  alternative: Paul condamne principalement l’usage abusif du monde.
  rationale: Le rapprochement de χρώμενοι et καταχρώμενοι produit un jeu verbal entre « se servir » et « user pleinement ». La traduction conserve cette tension, tandis qu’une note signale le sens possible d’« abuser ».
- issue: Sens de σχῆμα
  choice: Le terme renvoie à la configuration présente et passagère du monde.
  alternative: Le terme désigne uniquement l’apparence extérieure du monde, ou sa nature essentielle.
  rationale: Dans le contexte, σχῆμα souligne le caractère transitoire de la condition actuelle du monde sans porter un jugement sur l’essence de la création.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme « se servent / usant » conserve le jeu lexical grec, tandis que « est en train de passer » rend explicitement le processus en cours.
