id: 1CO.7.6
reference: 1 Corinthians 7:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τοῦτο δὲ λέγω κατὰ συγγνώμην, οὐ κατ’ ἐπιταγήν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/006.yaml
  text: But I say this as a concession[a], not as a command.
translation:
  language: fr
  text: Mais je dis cela comme une concession[a], non comme un commandement.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à titre de concession » ou « comme une permission ».
    reason: Alternative lexicale pour κατὰ συγγνώμην, qui désigne ici une latitude accordée plutôt qu’un ordre.
lexical_decisions:
- source_word: τοῦτο
  choice: cela
  rationale: Le démonstratif renvoie à la déclaration pertinente dans le contexte immédiat sans préciser indûment s’il vise ce qui précède ou ce qui suit.
- source_word: δὲ
  choice: Mais
  rationale: La particule marque ici une légère opposition, bien rendue par « Mais » dans le contraste entre concession et commandement.
- source_word: λέγω
  choice: je dis
  rationale: Le présent simple restitue naturellement le présent de l’indicatif grec.
- source_word: κατὰ συγγνώμην
  choice: comme une concession
  rationale: La locution présente les propos de Paul comme une permission ou un accommodement plutôt que comme une obligation; « comme une concession » est clair et naturel en français moderne.
- source_word: οὐ κατ’ ἐπιταγήν
  choice: non comme un commandement
  rationale: Cette formulation conserve le parallélisme avec « comme une concession » et exprime nettement l’absence d’injonction obligatoire.
theological_decisions:
- issue: Faut-il comprendre les propos de Paul comme une permission personnelle ou comme un commandement divin de moindre degré?
  choice: Paul présente explicitement cette déclaration comme une concession et non comme un commandement obligatoire.
  alternative: Ces conseils peuvent néanmoins conserver une autorité apostolique indirecte.
  rationale: Le texte oppose clairement concession et commandement. La traduction maintient cette distinction sans tirer de conclusion supplémentaire sur la portée générale de l’autorité apostolique de Paul.
translation_notes:
  register: Français international moderne, sobre et digne. « Commandement » convient mieux au registre biblique et théologique que « ordre », tandis que « concession » préserve le contraste précis du grec.
source_grounding:
  english_pob_role: consult_only
