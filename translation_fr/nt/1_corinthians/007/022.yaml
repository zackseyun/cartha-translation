id: 1CO.7.22
reference: 1 Corinthians 7:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ γὰρ ἐν κυρίῳ κληθεὶς δοῦλος ἀπελεύθερος κυρίου ἐστίν· ⸀ὁμοίως ὁ ἐλεύθερος κληθεὶς δοῦλός ἐστιν Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/022.yaml
  text: For the servant who was called in the Lord is the Lord’s freedman[a]; likewise[b], the free man who was called is Messiah’s servant.
translation:
  language: fr
  text: En effet, l’esclave qui a été appelé dans le Seigneur est un affranchi du Seigneur[a] ; de même, l’homme libre qui a été appelé est esclave du Messie[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une personne affranchie appartenant au Seigneur ». Le terme grec désigne quelqu’un qui a été libéré de l’esclavage.
    reason: lexical_alternative
  - marker: b
    text: Ou « esclave du Christ ». Le grec Χριστοῦ porte ici le titre « Messie ».
    reason: alternative_rendering
lexical_decisions:
- source_word: δοῦλος
  choice: esclave
  rationale: Le statut de personne asservie est essentiel au paradoxe voulu par Paul ; « serviteur » en atténuerait la force.
- source_word: ἐν κυρίῳ
  choice: dans le Seigneur
  rationale: Cette formulation conserve la nuance paulinienne de sphère ou d’union sans la préciser artificiellement.
- source_word: κληθεὶς
  choice: qui a été appelé
  rationale: Le passif rend le participe aoriste passif et préserve le langage de l’appel divin.
- source_word: ἀπελεύθερος
  choice: affranchi
  rationale: Le terme désigne spécifiquement une personne libérée de l’esclavage et maintient ainsi le contraste socio-juridique.
- source_word: κυρίου
  choice: du Seigneur
  rationale: Le génitif exprime l’appartenance au Seigneur dans une formulation française naturelle.
- source_word: ὁμοίως
  choice: de même
  rationale: Cette expression concise maintient le parallélisme entre les deux membres de la phrase.
- source_word: ἐλεύθερος
  choice: homme libre
  rationale: La formulation rend le masculin singulier représentatif et le statut social opposé à celui d’esclave.
- source_word: Χριστοῦ
  choice: du Messie
  rationale: Χριστός fonctionne ici comme le titre de l’Oint ; « Messie » en conserve explicitement la valeur titulaire.
- source_word: κύριος
  choice: Seigneur
  rationale: Ce titre théologiquement chargé dépasse la simple relation sociale maître-esclave.
theological_decisions:
- issue: Le paradoxe entre statut social et appartenance spirituelle
  choice: Maintenir l’opposition nette entre l’esclave devenu affranchi du Seigneur et l’homme libre devenu esclave du Messie.
  alternative: Employer « serviteur » ou généraliser ἀπελεύθερος par « personne libre ».
  rationale: Paul relativise le statut social terrestre par une inversion délibérée ; adoucir les termes affaiblirait cette tension.
- issue: Le rendu du titre Χριστός
  choice: du Messie
  alternative: du Christ
  rationale: Le titre de l’Oint demeure actif dans ce contexte d’appartenance et peut être rendu explicitement par « Messie ».
translation_notes:
  register: Français international moderne, digne et accessible. « Affranchi » conserve la précision historique et juridique ; « esclave » maintient la force du paradoxe. Les deux occurrences de « qui a été appelé » rendent clairement le parallélisme grec.
