  text: τιμῆς ἠγοράσθητε· μὴ γίνεσθε δοῦλοι ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/023.yaml
  text: You were bought with a price[a]; do not become servants of men.
translation:
  language: fr
  text: Vous avez été achetés à un prix ; ne devenez pas esclaves des êtres humains[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « esclaves des hommes ». Le mot grec désigne ici les êtres humains en général, par contraste avec le Seigneur.
    reason: Précise la portée représentative de ἀνθρώπων et signale une traduction plus traditionnelle.
lexical_decisions:
- source_word: τιμῆς
  choice: à un prix
  rationale: Le génitif indique le prix ou le coût de l’achat. Cette formulation conserve l’idée d’un achat coûteux sans ajouter « grand » ou « fort », absents du grec.
- source_word: ἠγοράσθητε
  choice: vous avez été achetés
  rationale: L’aoriste passif, à la deuxième personne du pluriel, exprime un achat accompli. « Achetés » préserve directement la métaphore commerciale employée par Paul.
- source_word: μὴ γίνεσθε
  choice: ne devenez pas
  rationale: γίνομαι signifie ici « devenir ». La traduction garde la portée de l’impératif présent négatif sans le réduire au simple état exprimé par « ne soyez pas ».
- source_word: δοῦλοι
  choice: esclaves
  rationale: Le contexte met en jeu l’appartenance et la domination d’un maître. « Esclaves » rend cette condition plus exactement que « serviteurs ».
- source_word: ἀνθρώπων
  choice: des êtres humains
  rationale: Le pluriel ἀνθρώπων désigne ici les humains en contraste avec le Seigneur, et non les seuls individus de sexe masculin. « Êtres humains » exprime naturellement cette portée représentative en français moderne.
theological_decisions:
- issue: Rendre δοῦλοι ἀνθρώπων dans le contraste entre l’achat des croyants et la domination humaine
  choice: esclaves des êtres humains
  alternative: serviteurs des hommes
  rationale: 'Le propos repose sur l’appartenance et l’allégeance : ceux qui ont été achetés ne doivent pas se placer sous une maîtrise humaine. « Esclaves » maintient cette force, tandis que « êtres humains » rend la portée générale de ἀνθρώπων sans limiter le référent aux hommes de sexe masculin.'
translation_notes:
  register: Français international moderne, sobre et digne. La structure brève et antithétique du grec est conservée. « À un prix » est volontairement plus précis que la formule traditionnelle « à grand prix », qui explicite une grandeur non exprimée lexicalement.
