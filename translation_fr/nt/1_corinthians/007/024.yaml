  text: ἕκαστος ἐν ᾧ ἐκλήθη, ἀδελφοί, ἐν τούτῳ μενέτω παρὰ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/024.yaml
  text: Brothers[b][a], let each one remain with God in that condition in which he was called.
translation:
  language: fr
  text: Frères et sœurs[b], que chacun demeure, dans la situation où il a été appelé, auprès de Dieu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « devant Dieu » ou « en présence de Dieu ».
    reason: lexical_alternative
  - marker: b
    text: Le grec dit littéralement « Frères »; dans ce contexte, cette adresse désigne l’ensemble de l’assemblée, femmes comprises.
    reason: cultural_note
lexical_decisions:
- source_word: ἕκαστος
  choice: chacun
  rationale: Le singulier distributif est rendu naturellement en français et maintient l’application individuelle de l’exhortation.
- source_word: ἐν ᾧ ... ἐν τούτῳ
  choice: dans la condition où ... dans la condition
  rationale: La construction répétée avec ἐν renvoie ici à la situation ou condition de vie évoquée dans le contexte, plutôt qu’à un lieu physique.
- source_word: ἐκλήθη
  choice: a été appelé
  rationale: Le passif grec est conservé sans expliciter l’agent; le contexte paulinien suggère l’appel de Dieu, mais le verset ne le nomme pas.
- source_word: ἀδελφοί
  choice: Frères et sœurs
  rationale: Dans cette adresse au pluriel, le masculin grec s’emploie pour l’ensemble de l’assemblée. La formulation française actuelle communique directement cette portée inclusive; une note signale la forme littérale.
- source_word: μενέτω
  choice: que ... demeure
  rationale: Cette tournure rend l’impératif à la troisième personne et conserve l’idée de persévérer dans sa condition présente.
- source_word: παρὰ θεῷ
  choice: devant Dieu
  rationale: παρά avec le datif peut exprimer la proximité ou la relation. « Devant Dieu » rend avec naturel l’idée de vivre dans sa présence ou sous son regard, tout en laissant les autres nuances possibles en note.
theological_decisions:
- issue: Faut-il expliciter l’action de Dieu dans ἐκλήθη?
  choice: Conserver le passif « a été appelé » sans ajouter « par Dieu ».
  alternative: « a été appelé par Dieu »
  rationale: L’agent divin est très probable dans le contexte, mais demeure implicite dans le grec; l’ajout résoudrait ce que le texte laisse sous-entendu.
- issue: Portée de l’adresse ἀδελφοί
  choice: « Frères et sœurs » dans le texte principal.
  alternative: « Frères » avec une note précisant la portée collective.
  rationale: L’adresse vise toute l’assemblée, y compris les femmes. Le français moderne exprime plus clairement cette portée par la formule inclusive, tandis que la note préserve la forme masculine du grec.
- issue: Sens relationnel de παρὰ θεῷ
  choice: « devant Dieu »
  alternative: « auprès de Dieu » ou « en présence de Dieu »
  rationale: La phrase grecque est concise et peut évoquer la proximité, la relation ou la présence de Dieu. Le choix principal reste ouvert à ces dimensions sans imposer une interprétation doctrinale particulière.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche de la structure grecque tout en étant idiomatique; « demeure » maintient le lien verbal avec le thème répété du passage.
