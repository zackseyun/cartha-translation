reference: 1 Corinthians 7:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐὰν δὲ καὶ χωρισθῇ, μενέτω ἄγαμος ἢ τῷ ἀνδρὶ καταλλαγήτω— καὶ ἄνδρα γυναῖκα μὴ ἀφιέναι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/011.yaml
  text: But if she does separate[a], let her remain unmarried[b], or else be reconciled to her husband—and a husband must not divorce his wife.
translation:
  language: fr
  text: Mais si elle se sépare[a], qu’elle reste non mariée, ou qu’elle se réconcilie avec son mari — et qu’un mari ne divorce pas de sa femme[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Mais même si elle se sépare ». Le grec peut avoir ici une nuance légèrement concessive.
    reason: lexical_alternative
  - marker: b
    text: Ou « qu’un mari ne renvoie pas sa femme ». Le verbe signifie plus littéralement « laisser partir » ou « renvoyer », mais, dans ce contexte conjugal, il désigne couramment le divorce.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν δὲ καὶ
  choice: Mais si… malgré tout
  rationale: La tournure française exprime naturellement la nuance concessive possible de καί, sans alourdir la condition.
- source_word: χωρισθῇ
  choice: elle se sépare
  rationale: χωρίζω désigne ici la séparation entre époux. « Se sépare » conserve la distinction avec ἀφίημι et n’impose pas la catégorie juridique précise du divorce.
- source_word: μενέτω
  choice: qu’elle reste
  rationale: L’impératif présent de μένω appelle la continuation dans un état; « qu’elle reste » est naturel et fidèle.
- source_word: ἄγαμος
  choice: sans se remarier
  rationale: Dans le cas d’une femme déjà mariée qui s’est séparée, ἄγαμος indique qu’elle doit demeurer non mariée; « sans se remarier » rend clairement cette situation en français moderne.
- source_word: καταλλαγήτω
  choice: qu’elle se réconcilie
  rationale: Le passif impératif de καταλλάσσω exprime le rétablissement de la relation; le français emploie idiomatiquement la forme pronominale « se réconcilier avec ».
- source_word: τῷ ἀνδρὶ
  choice: avec son mari
  rationale: Dans ce contexte conjugal, ἀνήρ signifie « mari ».
- source_word: ἄνδρα
  choice: un mari
  rationale: Le nom sans article a ici une portée générique et désigne l’époux.
- source_word: γυναῖκα
  choice: sa femme
  rationale: Dans le contexte conjugal, γυνή signifie « femme, épouse »; le possessif explicite naturellement le lien matrimonial en français.
- source_word: μὴ ἀφιέναι
  choice: qu’un mari ne divorce pas
  rationale: ἀφίημι peut signifier renvoyer ou laisser; dans ce contexte matrimonial, « divorcer de » communique clairement la portée de l’interdiction, tandis que le sens plus littéral est signalé en note.
theological_decisions:
- issue: Faut-il rendre χωρισθῇ et ἀφιέναι par le même terme français?
  choice: Rendre χωρισθῇ par « se sépare » et ἀφιέναι par « divorce »
  alternative: Rendre les deux verbes par « divorcer », ou les deux de manière générale par « se séparer/quitter »
  rationale: Paul emploie deux verbes différents. Maintenir cette distinction préserve la possibilité d’une différence entre séparation et divorce, sans introduire dans χωρισθῇ une précision juridique absente du grec.
- issue: Comment rendre ἄγαμος après la séparation?
  choice: « sans se remarier »
  alternative: « non mariée » ou « célibataire »
  rationale: « Sans se remarier » décrit clairement l’état demandé à une femme dont le mariage est présupposé, sans suggérer que son histoire conjugale est effacée. Cette formulation ne tranche pas à elle seule toutes les questions relatives au statut juridique ou théologique du lien.
- issue: Faut-il expliciter le sujet féminin du premier membre?
  choice: Employer « elle »
  alternative: Répéter « la femme »
  rationale: Le contexte immédiat fournit le sujet féminin; « elle » rend naturellement en français le singulier implicite du verbe grec et conserve la structure parallèle des consignes adressées à la femme puis au mari.
translation_notes:
  register: Français international moderne, digne et accessible. « Malgré tout » rend sans raideur la concession possible. « Sans se remarier » est plus naturel et contextuellement plus précis que « qu’elle reste non mariée ». Le tiret conserve l’articulation forte de la seconde consigne.
