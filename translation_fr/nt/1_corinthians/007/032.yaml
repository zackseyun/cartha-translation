  text: Θέλω δὲ ὑμᾶς ἀμερίμνους εἶναι. ὁ ἄγαμος μεριμνᾷ τὰ τοῦ κυρίου, πῶς ⸀ἀρέσῃ τῷ κυρίῳ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/032.yaml
  text: But I want you to be free from anxieties. The unmarried man is concerned with the things of the Lord[a], how he may please the Lord;
translation:
  language: fr
  text: 'Mais je veux que vous soyez sans inquiétude. Celui qui n’est pas marié[a] se préoccupe des choses du Seigneur : comment plaire au Seigneur ;'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « La personne qui n’est pas mariée. » Le grec est au masculin singulier (« celui qui n’est pas marié »), bien que, dans le contexte, Paul traite plus largement de la situation des personnes mariées et non mariées.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Θέλω δὲ
  choice: Mais je veux
  rationale: θέλω exprime directement la volonté ou le désir. δέ marque ici une transition légèrement contrastive avec ce qui précède ; « Mais » convient au contexte.
- source_word: ὑμᾶς ἀμερίμνους εἶναι
  choice: que vous soyez sans inquiétude
  rationale: ἀμέριμνος désigne l’absence d’inquiétude ou de souci accablant. Cette formulation française est naturelle et n’implique pas l’indifférence.
- source_word: ὁ ἄγαμος
  choice: Celui qui n’est pas marié
  rationale: Le grec emploie un substantif adjectival masculin singulier. Cette formulation conserve le masculin grammatical et l’état de non-mariage sans alourdir la phrase.
- source_word: μεριμνᾷ
  choice: se préoccupe
  rationale: Le verbe peut signifier « s’inquiéter » ou « se soucier de ». Ici, « se préoccupe » rend une attention légitime portée aux affaires du Seigneur, tout en maintenant le lien lexical avec ἀμερίμνους.
- source_word: τὰ τοῦ κυρίου
  choice: des choses du Seigneur
  rationale: L’expression grecque est large et désigne ce qui concerne ou appartient au Seigneur. Le rendu conserve cette ampleur sans préciser indûment la nature de ces réalités.
- source_word: κυρίου / κυρίῳ
  choice: Seigneur
  rationale: « Seigneur » est le titre français normal pour κύριος dans ce contexte chrétien et en préserve la portée théologique.
- source_word: πῶς ἀρέσῃ τῷ κυρίῳ
  choice: de la manière de plaire au Seigneur
  rationale: πῶς introduit la manière envisagée. Cette formulation s’intègre naturellement comme précision de ce dont l’homme non marié se préoccupe, sans transformer le subjonctif grec en certitude.
theological_decisions:
- issue: Référence masculine singulière dans le contraste entre personnes mariées et non mariées
  choice: 'Conserver le masculin singulier dans le texte principal : « Celui qui n’est pas marié »'
  alternative: « La personne qui n’est pas mariée »
  rationale: ὁ ἄγαμος est morphologiquement masculin singulier, et les versets voisins traitent séparément des cas masculin et féminin. Le texte principal respecte donc cette forme, tandis qu’une note signale que le passage environnant aborde plus largement les deux sexes.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « Seigneur » et l’expression large « choses du Seigneur » sont conservées. « Sans inquiétude » et « se préoccupe » rendent la parenté sémantique entre ἀμέριμνος et μεριμνάω sans donner une connotation négative au second emploi.
