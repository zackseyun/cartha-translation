source:
  edition: SBLGNT
  text: Περὶ δὲ τῶν παρθένων ἐπιταγὴν κυρίου οὐκ ἔχω, γνώμην δὲ δίδωμι ὡς ἠλεημένος ὑπὸ κυρίου πιστὸς εἶναι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/025.yaml
  text: Concerning virgins[a], I have no command from the Lord[c][b], but I give my judgment as one who by the Lord’s mercy is trustworthy.
translation:
  language: fr
  text: Au sujet des vierges[a], je n’ai pas de commandement du Seigneur, mais je donne mon avis[b], comme quelqu’un qui, par la miséricorde du Seigneur, est digne de confiance[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des femmes non mariées » ou, selon certaines interprétations du contexte, « des filles vierges ». Le grec dit littéralement « des vierges ».
    reason: lexical_alternative
  - marker: b
    text: Ou « mon jugement » ou « mon conseil ». Paul oppose ici son avis mûrement réfléchi à un commandement direct du Seigneur.
    reason: alternative_reading
  - marker: c
    text: Ou « fidèle ». Le grec peut signifier « fidèle » ou « digne de confiance, fiable »; le contexte peut évoquer la fiabilité de Paul comme conseiller, par la miséricorde du Seigneur.
    reason: lexical_alternative
lexical_decisions:
- source_word: Περὶ δὲ
  choice: Au sujet de
  rationale: Introduit un nouveau thème dans l’argumentation. « Au sujet de » est naturel en français et n’ajoute pas une valeur temporelle absente du grec.
- source_word: τῶν παρθένων
  choice: des vierges
  rationale: παρθένος désigne fondamentalement une personne vierge, souvent une jeune femme non mariée. Le terme littéral préserve ici l’incertitude sur le groupe précis visé.
- source_word: ἐπιταγὴν κυρίου
  choice: de commandement du Seigneur
  rationale: 'ἐπιταγή désigne un ordre ou commandement. Le génitif peut naturellement exprimer la source : un commandement venant du Seigneur.'
- source_word: γνώμην δὲ δίδωμι
  choice: mais je donne mon avis
  rationale: γνώμη désigne ici un avis réfléchi ou un jugement. « Je donne mon avis » conserve le contraste avec un commandement direct sans réduire nécessairement les paroles de Paul à une opinion désinvolte.
- source_word: ἠλεημένος ὑπὸ κυρίου
  choice: à qui le Seigneur a fait miséricorde
  rationale: Le participe parfait passif exprime l’état de celui qui a reçu miséricorde; la formulation française rend clairement le Seigneur comme agent.
- source_word: πιστὸς εἶναι
  choice: pour être digne de confiance
  rationale: πιστός peut signifier fidèle ou digne de confiance. Dans ce contexte, cette dernière nuance souligne la fiabilité de Paul lorsqu’il donne son avis, tout en laissant l’autre possibilité en note.
theological_decisions:
- issue: Nature de l’autorité de Paul en l’absence d’un commandement du Seigneur
  choice: Paul dit ne pas disposer d’un commandement du Seigneur sur ce point, mais formule néanmoins un avis en qualité d’homme rendu digne de confiance par la miséricorde du Seigneur.
  alternative: Comprendre ses paroles comme une simple opinion privée dépourvue d’autorité, ou supposer qu’il rapporte indirectement un commandement inconnu de Jésus.
  rationale: 'Le contraste entre ἐπιταγή et γνώμη doit être maintenu : Paul distingue son avis d’un commandement direct du Seigneur, sans pour autant présenter cet avis comme irréfléchi ou non fiable.'
- issue: Valeur de πιστός
  choice: digne de confiance
  alternative: fidèle
  rationale: Les deux sens sont possibles. Le contexte favorise la fiabilité de Paul comme conseiller, mais la note conserve l’ambiguïté lexicale réelle.
translation_notes:
  register: Français international moderne, digne et accessible. « En homme à qui… » rend naturellement ὡς avec son sujet masculin implicite. L’ordre des notes suit leur apparition dans le texte.
