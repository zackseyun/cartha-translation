  source_fidelity: 'Le sens du grec est bien rendu : le comparatif « plus heureuse », le maintien dans l’état présent, le caractère réfléchi de γνώμη et la revendication, modestement formulée, d’avoir l’Esprit de Dieu sont préservés. La note rend correctement l’alternative lexicale de μακαριωτέρα.'
