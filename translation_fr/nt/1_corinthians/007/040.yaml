id: 1CO.7.40
reference: 1 Corinthians 7:40
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: μακαριωτέρα δέ ἐστιν ἐὰν οὕτως μείνῃ, κατὰ τὴν ἐμὴν γνώμην, δοκῶ ⸀δὲ κἀγὼ πνεῦμα θεοῦ ἔχειν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/040.yaml
  text: But she is happier if she remains as she is[a], according to my judgment—and I think that I also have the Spirit of God.
translation:
  language: fr
  text: Mais elle est plus heureuse si elle reste comme elle est[a], selon mon jugement — et je pense avoir, moi aussi, l’Esprit de Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « plus bénie ». Le comparatif grec μακαριωτέρα peut désigner aussi bien un plus grand bonheur qu’un état de plus grande bénédiction.
    reason: lexical_alternative
lexical_decisions:
- source_word: μακαριωτέρα
  choice: plus heureuse
  rationale: Le comparatif de μακάριος peut exprimer un plus grand bonheur ou un état plus béni. Dans ce conseil pastoral pratique, « plus heureuse » est naturel en français moderne, tandis que la note conserve l’autre nuance possible.
- source_word: ἐὰν οὕτως μείνῃ
  choice: si elle reste comme elle est
  rationale: μένω signifie « rester, demeurer » et οὕτως renvoie à la situation de veuve non remariée évoquée dans le contexte. Cette formulation garde le renvoi implicite sans préciser davantage que le grec.
- source_word: κατὰ τὴν ἐμὴν γνώμην
  choice: selon mon jugement
  rationale: γνώμη désigne ici un avis réfléchi ou un jugement. « Selon mon jugement » conserve le ton mesuré du conseil de Paul et distingue celui-ci d’une parole directement attribuée au Seigneur.
- source_word: δοκῶ
  choice: je pense
  rationale: δοκέω exprime ici une affirmation formulée avec retenue. « Je pense » en préserve la modestie rhétorique sans transformer la phrase en doute réel.
- source_word: κἀγὼ
  choice: moi aussi
  rationale: La crase κἀγώ a une valeur additive. Le pronom tonique « moi » rend naturellement cette insistance en français et peut laisser entendre un contraste implicite avec d’autres personnes revendiquant une autorité spirituelle.
- source_word: πνεῦμα θεοῦ
  choice: l’Esprit de Dieu
  rationale: Dans l’usage paulinien et dans ce contexte d’autorité spirituelle, la formule renvoie vraisemblablement à l’Esprit Saint plutôt qu’à une simple disposition intérieure.
- source_word: ἔχειν
  choice: avoir
  rationale: « Avoir » traduit directement et naturellement l’infinitif complément de δοκῶ; « posséder » serait inutilement appuyé.
theological_decisions:
- issue: Référent de πνεῦμα θεοῦ
  choice: « l’Esprit de Dieu », compris comme l’Esprit Saint
  alternative: « un esprit venant de Dieu » ou une perspicacité spirituelle d’origine divine
  rationale: Chez Paul, πνεῦμα θεοῦ désigne normalement l’Esprit de Dieu. Cette lecture rend la portée spirituelle de son jugement sans en faire pour autant un commandement directement prononcé par le Seigneur.
- issue: Portée de δοκῶ ... πνεῦμα θεοῦ ἔχειν
  choice: Une revendication réelle, mais formulée avec modestie, d’un jugement guidé par l’Esprit
  alternative: Une incertitude véritable quant au fait d’avoir l’Esprit, ou une réplique explicitement ironique à des opposants
  rationale: « Je pense » maintient la retenue rhétorique de δοκῶ. Toutefois, le contexte ne justifie pas d’affaiblir l’énoncé jusqu’à en faire l’expression d’un doute; une ironie reste possible comme tonalité, mais elle n’est pas explicitée dans la traduction.
translation_notes:
  register: Français international moderne, digne et accessible. « Elle reste comme elle est » conserve le renvoi contextuel à son état présent. Le tiret marque la transition vers l’affirmation finale sans durcir le lien logique. L’ordre « je pense, moi aussi, avoir » rend l’insistance de κἀγώ de façon idiomatique.
