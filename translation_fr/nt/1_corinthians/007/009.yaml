  text: εἰ δὲ οὐκ ἐγκρατεύονται, γαμησάτωσαν, κρεῖττον γάρ ἐστιν ⸀γαμῆσαι ἢ πυροῦσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/009.yaml
  text: But if they do not have self-control[a], let them marry; for it is better to marry than to burn.
translation:
  language: fr
  text: Mais s’ils ne parviennent pas à se maîtriser, qu’ils se marient, car il vaut mieux se marier que brûler[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de manière plus explicite : « brûler de désir ». Dans ce contexte, le grec évoque très probablement un désir sexuel ardent, tout en disant simplement « brûler ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγκρατεύονται
  choice: parviennent à se maîtriser
  rationale: Le verbe désigne ici l’exercice de la maîtrise de soi, dans le contexte de la sexualité. La tournure négative « ne parviennent pas à se maîtriser » exprime naturellement en français l’incapacité envisagée sans réduire le terme à une simple possession abstraite.
- source_word: γαμησάτωσαν
  choice: qu’ils se marient
  rationale: Cette tournure rend directement l’impératif aoriste à la troisième personne du pluriel et conserve la force de l’instruction.
- source_word: κρεῖττον
  choice: il vaut mieux
  rationale: Formulation française idiomatique du comparatif prédicatif, qui exprime clairement la préférence établie par Paul.
- source_word: γαμῆσαι
  choice: se marier
  rationale: L’infinitif français correspond directement à l’infinitif grec et maintient le parallélisme avec « brûler ».
- source_word: πυροῦσθαι
  choice: brûler
  rationale: Le choix conserve la métaphore et l’implicite du grec. Le contexte indique très probablement qu’il s’agit de brûler de désir sexuel, précision donnée en note plutôt qu’insérée dans le texte.
- source_word: δὲ
  choice: Mais
  rationale: La conjonction marque ici un contraste avec le cas précédemment évoqué; « Mais » restitue naturellement ce mouvement.
theological_decisions:
- issue: Sens de πυροῦσθαι dans le contexte
  choice: brûler, avec le sens contextuel probable de brûler de désir
  alternative: brûler sous le jugement
  rationale: Le contexte immédiat oppose le manque de maîtrise de soi au mariage, ce qui favorise nettement l’idée d’un désir sexuel ardent. Toutefois, puisque le grec conserve la métaphore sans en préciser l’objet, le texte français garde lui aussi « brûler » et la note explicite le sens contextuel probable.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe reste concise et conserve l’enchaînement condition, impératif, puis justification. La métaphore finale demeure volontairement implicite dans le texte principal.
