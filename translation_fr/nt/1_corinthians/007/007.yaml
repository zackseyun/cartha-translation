  text: θέλω ⸀δὲ πάντας ἀνθρώπους εἶναι ὡς καὶ ἐμαυτόν· ἀλλὰ ἕκαστος ἴδιον ⸂ἔχει χάρισμα⸃ ἐκ θεοῦ, ⸀ὁ μὲν οὕτως, ⸁ὁ δὲ οὕτως.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/007.yaml
  text: But I want all men to be as I myself am. Yet each has his own gift from God, one in this way and another in that way.
translation:
  language: fr
  text: 'Je souhaite que tous soient comme moi. Mais chacun a son propre don de Dieu : l’un d’une manière, l’autre d’une autre.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θέλω
  choice: Je voudrais
  rationale: Exprime ici le souhait de Paul avec naturel, sans lui donner la force d’un ordre.
- source_word: πάντας ἀνθρώπους
  choice: tous
  rationale: Dans ce contexte, le pluriel générique désigne toutes les personnes concernées; « tous » est naturel en français et n’impose pas une restriction aux seuls hommes de sexe masculin.
- source_word: χάρισμα
  choice: don
  rationale: Rend le don accordé par grâce divine sans ajouter une qualification absente du grec.
- source_word: ὁ μὲν οὕτως, ὁ δὲ οὕτως
  choice: l’un de telle sorte, l’autre de telle autre
  rationale: Conserve le contraste volontairement non précisé entre des dons ou situations différents.
theological_decisions:
- issue: Nature exacte de la condition de Paul (« comme moi »)
  choice: Ne pas l’expliciter
  alternative: Ajouter « célibataires » ou « capables de continence »
  rationale: Le verset ne précise pas lui-même ce que recouvre cette comparaison; le contexte l’éclaire, mais la traduction doit préserver cette relative ambiguïté.
- issue: Rapport entre les deux sortes de dons
  choice: Maintenir une formulation générale et symétrique
  alternative: Identifier explicitement le célibat et le mariage comme deux dons
  rationale: Le grec dit seulement « l’un ainsi, l’autre ainsi »; nommer les deux dons résoudrait une question interprétative que le texte laisse implicite.
translation_notes:
  register: Français moderne, digne et accessible. La tournure finale, légèrement soutenue, reproduit la concision et l’indétermination du grec.
