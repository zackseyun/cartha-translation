reference: 1 Corinthians 7:37
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὃς δὲ ἕστηκεν ⸂ἐν τῇ καρδίᾳ αὐτοῦ ἑδραῖος⸃ μὴ ἔχων ἀνάγκην, ἐξουσίαν δὲ ἔχει περὶ τοῦ ἰδίου θελήματος, καὶ τοῦτο κέκρικεν ἐν τῇ ⸂ἰδίᾳ καρδίᾳ⸃, ⸀τηρεῖν τὴν ἑαυτοῦ παρθένον, καλῶς ⸀ποιήσει·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/037.yaml
  text: But whoever stands firm in his heart[a], having no necessity, but has authority over his own will[b], and has decided this in his own heart—to keep his own virgin—he will do well.
translation:
  language: fr
  text: Mais celui qui reste ferme dans son cœur, sans être soumis à aucune contrainte, qui est maître de sa propre volonté et qui a pris dans son cœur la décision de garder sa vierge[a], celui-là fera bien.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « sa vierge » peut désigner soit sa fille vierge, soit sa fiancée vierge ; le sens du grec est discuté.
    reason: alternative_reading
lexical_decisions:
- source_word: ἕστηκεν ἐν τῇ καρδίᾳ αὐτοῦ ἑδραῖος
  choice: reste ferme dans son cœur
  rationale: Le parfait de ἵστημι associé à ἑδραῖος exprime une résolution stable et arrêtée. Cette formulation conserve l’image grecque dans un français naturel.
- source_word: μὴ ἔχων ἀνάγκην
  choice: sans être soumis à aucune contrainte
  rationale: ἀνάγκη peut désigner une nécessité ou une contrainte. Ici, « contrainte » rend clairement l’absence de pression déterminante sans préciser indûment sa nature.
- source_word: ἐξουσίαν δὲ ἔχει περὶ τοῦ ἰδίου θελήματος
  choice: qui est maître de sa propre volonté
  rationale: ἐξουσία exprime l’autorité ou la capacité de décision, et θέλημα la volonté ou l’intention. La tournure française indique qu’il dispose réellement de sa décision sans introduire une connotation sexuelle absente du texte.
- source_word: τοῦτο κέκρικεν ἐν τῇ ἰδίᾳ καρδίᾳ
  choice: qui a pris dans son cœur la décision
  rationale: Le parfait κέκρικεν indique une décision déjà prise et désormais arrêtée; la répétition de « cœur » respecte celle du grec.
- source_word: τηρεῖν τὴν ἑαυτοῦ παρθένον
  choice: garder sa vierge
  rationale: τηρεῖν signifie garder ou maintenir, et παρθένον signifie vierge. La formulation demeure volontairement littérale afin de ne pas trancher entre une fille vierge et une fiancée vierge.
- source_word: καλῶς ποιήσει
  choice: celui-là fera bien
  rationale: Cette expression idiomatique rend naturellement le jugement favorable porté sur l’action envisagée.
theological_decisions:
- issue: Référent de τὴν ἑαυτοῦ παρθένον (« sa vierge »)
  choice: Conserver dans le texte l’expression ambiguë « sa vierge ».
  alternative: « sa fille vierge » ou « sa fiancée vierge »
  rationale: Le grec ne permet pas de déterminer avec certitude si Paul parle d’un père ou tuteur à propos de sa fille, ou d’un homme à propos de sa fiancée. Le texte principal préserve donc cette ambiguïté réelle, tandis que la note expose les deux interprétations.
translation_notes:
  register: Français international moderne, digne et accessible. La structure accumulative de la phrase grecque est conservée tout en étant articulée par des relatives naturelles. « Sa vierge » est inhabituel en français, mais retenu avec une note parce qu’une explicitation dans le texte trancherait une ambiguïté interprétative authentique.
