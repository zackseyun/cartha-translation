id: 1CO.7.4
reference: 1 Corinthians 7:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἡ γυνὴ τοῦ ἰδίου σώματος οὐκ ἐξουσιάζει ἀλλὰ ὁ ἀνήρ· ὁμοίως δὲ καὶ ὁ ἀνὴρ τοῦ ἰδίου σώματος οὐκ ἐξουσιάζει ἀλλὰ ἡ γυνή.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/004.yaml
  text: The wife does not have authority over her own body[a], but the husband does; likewise also the husband does not have authority over his own body, but the wife does.
translation:
  language: fr
  text: 'La femme n’a pas autorité sur son propre corps[a] : c’est son mari qui l’a. De même, le mari n’a pas autorité sur son propre corps : c’est sa femme qui l’a.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « n’exerce pas d’autorité sur ». Le verbe grec peut désigner le fait de posséder ou d’exercer une autorité ; ici, cette autorité conjugale est réciproque.
    reason: lexical_alternative
lexical_decisions:
- source_word: γυνή
  choice: la femme / sa femme
  rationale: Dans le contexte immédiat du mariage et en parallèle avec ἀνήρ, le terme désigne l’épouse. « La femme » est idiomatique au début de la phrase, tandis que « sa femme » explicite naturellement la relation conjugale dans la seconde moitié.
- source_word: ἀνήρ
  choice: son mari / le mari
  rationale: Associé à γυνή dans ce contexte conjugal, ἀνήρ désigne le mari plutôt que l’homme en général.
- source_word: ἰδίου σώματος
  choice: son propre corps
  rationale: Cette formulation naturelle conserve l’insistance de ἴδιος sur ce qui appartient en propre à la personne.
- source_word: ἐξουσιάζει
  choice: a autorité sur
  rationale: Le verbe peut exprimer la possession ou l’exercice d’une autorité. « A autorité sur » en préserve directement la force relationnelle sans ajouter l’idée plus forte de domination ou de maîtrise.
- source_word: ἀλλά
  choice: c’est … qui l’a
  rationale: La construction clivée rend clairement le contraste introduit par ἀλλά et évite une répétition française lourde de « mais … a autorité ».
- source_word: ὁμοίως δὲ καὶ
  choice: De même
  rationale: « De même » exprime avec naturel le parallélisme exact et la réciprocité de la seconde proposition.
theological_decisions:
- issue: Nature de l’autorité conjugale dans le verset
  choice: Conserver l’affirmation d’une autorité réciproque entre les époux, dans une structure strictement parallèle.
  alternative: Affaiblir le propos en parlant seulement d’appartenance, ou le renforcer en parlant de contrôle exercé sur le corps de l’autre.
  rationale: Le grec attribue symétriquement à chacun des époux l’autorité que l’autre n’a pas sur son propre corps. La traduction maintient cette tension sans introduire ni hiérarchie unilatérale ni connotation coercitive absente du texte.
translation_notes:
  register: Français international moderne, clair et digne. La reprise « c’est … qui l’a » rend le contraste naturel tout en conservant le parallélisme et la réciprocité du grec.
