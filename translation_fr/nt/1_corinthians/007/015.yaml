id: 1CO.7.15
reference: 1 Corinthians 7:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἰ δὲ ὁ ἄπιστος χωρίζεται, χωριζέσθω· οὐ δεδούλωται ὁ ἀδελφὸς ἢ ἡ ἀδελφὴ ἐν τοῖς τοιούτοις, ἐν δὲ εἰρήνῃ κέκληκεν ⸀ἡμᾶς ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/015.yaml
  text: But if the unbeliever separates[a], let him separate. The brother or the sister is not enslaved in such cases[c][b], but God has called us in peace.
translation:
  language: fr
  text: Mais si le non-croyant se sépare[a], qu’il se sépare. Le frère ou la sœur n’est pas réduit en esclavage dans de tels cas[b][c] ; mais Dieu nous a appelés à vivre dans la paix.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « si le conjoint non croyant se sépare ». Le contexte indique qu’il s’agit du conjoint, mais le grec dit simplement « le non-croyant ».
    reason: lexical_alternative
  - marker: b
    text: Ou « n’est pas lié ». Le verbe grec signifie littéralement « réduire en esclavage » ; ce n’est pas le verbe habituel pour « lier ».
    reason: lexical_alternative
  - marker: c
    text: Certains manuscrits portent « vous » au lieu de « nous ».
    reason: textual_variant
lexical_decisions:
- source_word: ὁ ἄπιστος
  choice: le non-croyant
  rationale: L’expression substantivée désigne, dans le contexte, le conjoint non croyant, sans que le grec emploie explicitement le mot « conjoint ».
- source_word: χωρίζεται / χωριζέσθω
  choice: se sépare / qu’il se sépare
  rationale: La répétition rend le lien lexical grec et évite de préciser s’il s’agit d’un départ physique ou d’un divorce juridique.
- source_word: οὐ δεδούλωται
  choice: n’est pas réduit en esclavage
  rationale: Le verbe vient de δουλόω, « réduire en esclavage », et non du verbe courant signifiant « lier ». Cette formulation conserve la force de l’image sans trancher la portée juridique ou matrimoniale de la liberté évoquée.
- source_word: ὁ ἀδελφὸς ἢ ἡ ἀδελφὴ
  choice: le frère ou la sœur
  rationale: La traduction maintient explicitement le langage familial employé pour les croyants des deux sexes.
- source_word: ἐν τοῖς τοιούτοις
  choice: dans de tels cas
  rationale: Expression française naturelle qui rend l’emploi idiomatique du pluriel grec et renvoie aux situations du type qui vient d’être décrit.
- source_word: ἐν δὲ εἰρήνῃ κέκληκεν ἡμᾶς ὁ θεός
  choice: mais Dieu nous a appelés à vivre dans la paix
  rationale: Le parfait est rendu par « a appelés ». « À vivre dans la paix » exprime naturellement en français la sphère de vie indiquée par ἐν εἰρήνῃ, sans la réduire à une simple disposition intérieure.
theological_decisions:
- issue: Portée de οὐ δεδούλωται pour la dissolution du mariage et le remariage
  choice: Traduire lexicalement par « n’est pas réduit en esclavage » sans définir toute l’étendue de cette liberté.
  alternative: « n’est pas lié », compris soit comme autorisation de se remarier, soit seulement comme absence d’obligation de retenir ou de poursuivre le conjoint qui part.
  rationale: Le verset ne précise pas explicitement toutes les conséquences de cette absence d’asservissement. La traduction préserve donc la tension interprétative.
- issue: Référent de ὁ ἄπιστος
  choice: « le non-croyant » dans le texte principal
  alternative: « le conjoint non croyant »
  rationale: Le contexte matrimonial identifie clairement le référent, mais « conjoint » serait un ajout explicatif absent de l’expression grecque.
- issue: Valeur de l’impératif χωριζέσθω
  choice: « qu’il se sépare », comme permission ou acceptation du départ
  alternative: Une formulation qui commanderait activement le divorce
  rationale: Dans ce contexte, l’impératif laisse partir la personne non croyante plutôt qu’il n’ordonne au croyant de provoquer la séparation.
translation_notes:
  register: Français international moderne, digne et accessible. « Le non-croyant » est naturel sans surinterpréter le substantif grec. « Réduit en esclavage » conserve l’image forte du texte source. L’ajout idiomatique « à vivre » avec « dans la paix » clarifie l’appel comme cadre de vie sans résoudre les débats doctrinaux du passage.
