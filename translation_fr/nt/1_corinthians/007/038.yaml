id: 1CO.7.38
reference: 1 Corinthians 7:38
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὥστε καὶ ὁ ⸀γαμίζων ⸂τὴν παρθένον ἑαυτοῦ⸃ καλῶς ποιεῖ, ⸂καὶ ὁ⸃ μὴ ⸁γαμίζων κρεῖσσον ⸀ποιήσει.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/038.yaml
  text: So then[a], the one who gives his own virgin in marriage does well, and the one who does not give her in marriage will do better.
translation:
  language: fr
  text: Ainsi donc, celui qui donne sa vierge[a] en mariage fait bien, et celui qui ne la donne pas en mariage fera mieux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « celui qui épouse sa fiancée vierge fait bien, et celui qui ne l’épouse pas fera mieux ». Une autre interprétation courante comprend : « sa fille vierge ». Le verbe grec signifie plus naturellement « donner en mariage »; le texte principal conserve donc ce sens sans préciser davantage le lien exact entre l’homme et la vierge.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὥστε
  choice: Ainsi donc
  rationale: Introduit la conclusion tirée du raisonnement précédent, dans un français naturel tout en conservant la valeur déductive.
- source_word: γαμίζων
  choice: donne… en mariage
  rationale: Le verbe causatif γαμίζω signifie plus naturellement « donner en mariage » que simplement « épouser »; cette traduction évite de le confondre avec γαμέω.
- source_word: τὴν παρθένον ἑαυτοῦ
  choice: sa vierge
  rationale: Cette formulation proche du grec conserve παρθένος (« vierge ») et la relation exprimée par ἑαυτοῦ sans décider s’il s’agit précisément d’une fille, d’une personne sous tutelle ou, selon une autre analyse, d’une fiancée.
- source_word: καλῶς ποιεῖ
  choice: fait bien
  rationale: Rend simplement le jugement positif exprimé par le grec, sans lui donner une portée absolue.
- source_word: μὴ γαμίζων
  choice: ne la donne pas en mariage
  rationale: Maintient le même sens causatif que dans la première proposition; « la » reprend explicitement l’objet déjà mentionné.
- source_word: κρεῖσσον ποιήσει
  choice: fera mieux
  rationale: Préserve le comparatif κρεῖσσον sans le transformer en superlatif.
theological_decisions:
- issue: Identité de « sa vierge » et sens de γαμίζω en 1 Corinthiens 7.38
  choice: Le texte principal conserve le sens causatif « donner en mariage » et ne précise pas davantage le lien entre l’homme et la vierge.
  alternative: '« Celui qui épouse sa fiancée vierge fait bien, et celui qui ne l’épouse pas fera mieux »; autre interprétation courante : « celui qui donne sa fille vierge en mariage ».'
  rationale: Le passage de 1 Corinthiens 7.36-38 présente une difficulté d’interprétation reconnue. γαμίζω favorise le sens causatif, mais l’identité sociale exacte de la vierge demeure discutée. La traduction garde donc la tension du grec et signale les principales lectures en note.
translation_notes:
  register: Français international moderne, sobre et digne. L’expression inhabituelle « sa vierge » est volontairement conservée afin de ne pas résoudre dans le texte une ambiguïté réelle du grec; la note fournit les formulations françaises plus explicites correspondant aux principales interprétations.
