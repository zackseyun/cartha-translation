  source_fidelity: 'Le texte rend fidèlement les principaux éléments grecs : « Quant aux autres » correspond à Τοῖς δὲ λοιποῖς ; l’incise « moi, non le Seigneur » conserve l’emphase de ἐγώ et la distinction exprimée par οὐχ ὁ κύριος ; « un frère » maintient le masculin singulier ; et la condition relative à une épouse qui ne croit pas et consent à vivre avec lui est bien reproduite. « Qu’il ne la quitte pas » rend de manière suffisamment directe μὴ ἀφιέτω αὐτήν sans réduire indûment le verbe à un seul registre juridique.'
