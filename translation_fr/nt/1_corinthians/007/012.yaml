id: 1CO.7.12
reference: 1 Corinthians 7:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Τοῖς δὲ λοιποῖς ⸂λέγω ἐγώ⸃, οὐχ ὁ κύριος· εἴ τις ἀδελφὸς γυναῖκα ἔχει ἄπιστον, καὶ αὕτη συνευδοκεῖ οἰκεῖν μετ’ αὐτοῦ, μὴ ἀφιέτω αὐτήν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/012.yaml
  text: But to the rest I say—I[a], not the Lord—if any brother has an unbelieving wife, and she consents to live with him, he must not divorce her.
translation:
  language: fr
  text: 'Quant aux autres, voici ce que je dis — moi, non le Seigneur : si un frère a une femme qui ne croit pas et qu’elle consent à vivre avec lui, qu’il ne la quitte pas[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qu’il ne la renvoie pas » ou « qu’il ne divorce pas d’elle ». Le verbe grec signifie littéralement « laisser » ou « renvoyer »; ici, il désigne la rupture du mariage.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῖς δὲ λοιποῖς
  choice: Quant aux autres
  rationale: Introduit naturellement en français le groupe restant, non traité par l’instruction précédente; δέ marque ici une transition légère.
- source_word: λέγω ἐγώ, οὐχ ὁ κύριος
  choice: voici ce que je dis — moi, non le Seigneur
  rationale: La formulation conserve l’insistance de ἐγώ et la distinction explicite entre la parole de Paul et une parole directe du Seigneur, sans expliquer cette distinction dans le corps du verset.
- source_word: ἀδελφὸς
  choice: un frère
  rationale: Le masculin singulier vise ici précisément un homme croyant, mis en relation avec sa femme; « frère » maintient l’expression communautaire paulinienne.
- source_word: γυναῖκα ἔχει ἄπιστον
  choice: a une femme qui ne croit pas
  rationale: « A une femme » rend l’expression matrimoniale, tandis que « qui ne croit pas » évite que « infidèle » soit compris comme une infidélité conjugale.
- source_word: καὶ αὕτη συνευδοκεῖ
  choice: et qu’elle consent
  rationale: « Consent » exprime l’accord volontaire indiqué par συνευδοκεῖ et convient au contexte de la poursuite de la vie commune.
- source_word: οἰκεῖν μετ’ αὐτοῦ
  choice: à vivre avec lui
  rationale: Expression française actuelle et naturelle pour la vie domestique commune.
- source_word: μὴ ἀφιέτω αὐτήν
  choice: qu’il ne la quitte pas
  rationale: La tournure rend directement l’impératif grec et préserve l’étendue lexicale de ἀφίημι, qui peut évoquer le fait de quitter ou de renvoyer son épouse; dans ce contexte, il s’agit de mettre fin au mariage.
theological_decisions:
- issue: « moi, non le Seigneur »
  choice: Maintenir sans l’expliquer dans le texte la distinction entre l’instruction de Paul et celle du Seigneur.
  alternative: Paraphraser comme une simple opinion personnelle de Paul dépourvue d’autorité.
  rationale: Le grec établit nettement cette distinction, mais ne dit pas ici que l’enseignement de Paul serait sans autorité. La traduction conserve donc la tension sans trancher par une glose doctrinale.
translation_notes:
  register: Français international moderne, naturel et digne. « Quant aux autres » assure une transition fluide; les tirets mettent en relief la parenthèse emphatique. « Femme qui ne croit pas » est plus clair que « femme infidèle », potentiellement ambigu en français. Le subjonctif jussif « qu’il ne la quitte pas » garde une tonalité biblique sobre sans archaïsme.
