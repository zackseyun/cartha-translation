  text: τῇ γυναικὶ ὁ ἀνὴρ τὴν ⸀ὀφειλὴν ἀποδιδότω, ὁμοίως δὲ καὶ ἡ γυνὴ τῷ ἀνδρί.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/003.yaml
  text: The husband must give to his wife her marital duty, and likewise the wife to her husband.
translation:
  language: fr
  text: Que le mari rende à sa femme ce qu’il lui doit[a], et que la femme fasse de même envers son mari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ce qui lui est dû » ; plus littéralement, « la dette » ou « l’obligation ». Dans ce contexte, il s’agit de l’obligation conjugale que les époux ont l’un envers l’autre.
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ γυναικί / ἡ γυνή
  choice: à sa femme / la femme
  rationale: Dans ce contexte explicitement matrimonial, γυνή désigne l’épouse, non la femme au sens général.
- source_word: ὁ ἀνήρ / τῷ ἀνδρί
  choice: le mari / envers son mari
  rationale: En parallèle avec γυνή et dans le cadre du mariage, ἀνήρ désigne le mari.
- source_word: τὴν ὀφειλήν
  choice: ce qu’il lui doit dans le mariage
  rationale: ὀφειλή désigne littéralement une dette ou une obligation. Cette formulation conserve l’idée de ce qui est dû tout en indiquant sobrement le cadre conjugal établi par le contexte.
- source_word: ἀποδιδότω
  choice: Que … rende
  rationale: L’impératif présent exprime une obligation à accomplir; « rendre » correspond naturellement à l’idée de remettre ce qui est dû.
- source_word: ὁμοίως δὲ καί
  choice: et que … fasse de même
  rationale: La tournure exprime nettement la réciprocité et la symétrie entre les deux époux.
theological_decisions:
- issue: Degré d’explicitation de l’obligation exprimée par ὀφειλή
  choice: « ce qu’il lui doit dans le mariage » dans le texte principal
  alternative: « le devoir conjugal » ou « ce qui lui est dû »
  rationale: Le contexte des versets 2 et 4–5 donne à l’obligation une portée conjugale, notamment sexuelle, mais le nom grec demeure plus large. La formulation choisie garde cette tension sans réduire l’expression à un droit juridique ni la rendre excessivement explicite.
- issue: Réciprocité de l’obligation conjugale
  choice: Conserver deux propositions parallèles plaçant mari et femme sous la même obligation
  alternative: Fusionner en une déclaration générale sur les époux
  rationale: La structure grecque souligne expressément la réciprocité; la traduction la maintient sans introduire de hiérarchie absente de ce verset.
translation_notes:
  register: Français international moderne, digne et accessible. La construction exhortative « Que… » rend l’impératif grec sans lourdeur. « Dans le mariage » explicite seulement le cadre contextuel, tandis que la note préserve le sens littéral et l’étendue lexicale de ὀφειλή.
