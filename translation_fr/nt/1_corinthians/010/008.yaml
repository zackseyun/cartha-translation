id: 1CO.10.8
reference: 1 Corinthians 10:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: μηδὲ πορνεύωμεν, καθώς τινες αὐτῶν ἐπόρνευσαν, καὶ ἔπεσαν μιᾷ ἡμέρᾳ εἴκοσι τρεῖς χιλιάδες.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/008.yaml
  text: Nor should we commit sexual immorality[a], as some of them committed sexual immorality[b], and twenty-three thousand fell in one day.
translation:
  language: fr
  text: Ne nous livrons pas non plus à l’immoralité sexuelle, comme certains d’entre eux s’y sont livrés ; vingt-trois mille tombèrent[a] en un seul jour[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « moururent » ou « furent frappés ». Le grec dit littéralement « tombèrent », expression courante pour évoquer la mort sous le jugement.
    reason: lexical_alternative
  - marker: b
    text: Nombres 25.9 mentionne vingt-quatre mille morts. Paul dit ici que vingt-trois mille tombèrent « en un seul jour » ; il est possible que ce nombre désigne ceux qui moururent ce jour-là, tandis que l’autre indique le total, mais la traduction conserve le texte de Paul sans l’harmoniser.
    reason: cross_reference
lexical_decisions:
- source_word: μηδὲ
  choice: Ne… pas non plus
  rationale: Cette tournure relie naturellement l’exhortation aux avertissements précédents et conserve la valeur additive et négative de μηδέ.
- source_word: πορνεύωμεν / ἐπόρνευσαν
  choice: nous livrons… à l’immoralité sexuelle / s’y sont livrés
  rationale: « Se livrer à l’immoralité sexuelle » rend clairement le comportement visé sans employer le terme vieilli ou plus étroit « fornication ». La reprise de la même expression reflète la répétition du verbe grec.
- source_word: καθώς
  choice: comme
  rationale: « Comme » introduit simplement et naturellement la comparaison avec l’exemple d’Israël.
- source_word: τινες αὐτῶν
  choice: certains d’entre eux
  rationale: Cette expression désigne sans ambiguïté une partie des Israélites de la génération du désert.
- source_word: ἔπεσαν
  choice: tombèrent
  rationale: Le verbe grec signifie littéralement « tomber » et désigne ici la mort sous le jugement. Le choix conserve l’image du texte au lieu de l’expliciter dans le corps du verset.
- source_word: μιᾷ ἡμέρᾳ
  choice: en un seul jour
  rationale: Cette formulation française naturelle souligne que les morts se sont produites dans l’espace d’une seule journée.
- source_word: εἴκοσι τρεῖς χιλιάδες
  choice: vingt-trois mille
  rationale: Le nombre donné par le texte grec est rendu directement, sans harmonisation avec Nombres 25.9.
theological_decisions:
- issue: Rapport avec le nombre indiqué en Nombres 25.9
  choice: Conserver « vingt-trois mille » dans le texte principal.
  alternative: Harmoniser avec les « vingt-quatre mille » de Nombres 25.9, ou présenter l’un des nombres comme un total et l’autre comme un sous-total.
  rationale: Le texte grec de 1 Corinthiens donne explicitement vingt-trois mille. La traduction préserve cette donnée et laisse en note l’éventuelle explication de l’écart, sans imposer une harmonisation conjecturale.
translation_notes:
  register: Français international actuel, digne et accessible. La tournure « se livrer à l’immoralité sexuelle » évite à la fois l’archaïsme de « forniquer » et une restriction indue du champ de πορνεύω. Le passé simple « tombèrent » convient au registre narratif bref et solennel du verset.
