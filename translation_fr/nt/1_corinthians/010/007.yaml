    rationale: 'La formule introduit l’Écriture comme illustration correspondante : « comme il est écrit ». « En effet » transforme ce lien en simple justification.'
  - severity: low
    issue: « Se divertir » atténue et modernise quelque peu le sens lexical de παίζειν.
    rationale: « S’amuser » correspond plus directement à « jouer », tout en laissant à la note le sens contextuel possible de réjouissances.
