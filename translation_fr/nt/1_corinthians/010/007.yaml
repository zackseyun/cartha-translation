  source_fidelity: 'Révision nécessaire : καθώς τινες αὐτῶν doit être complété naturellement en français (« comme certains d’entre eux le sont devenus »), et ὥσπερ γέγραπται est comparatif (« comme il est écrit »), non simplement confirmatif (« En effet »). La citation conserve les infinitifs de but et le contraste entre le collectif singulier « le peuple » et le pluriel narratif « ils ».'
  naturalness: « Comme certains d’entre eux » laissé seul après « Ne devenez pas idolâtres » est elliptique et peu naturel en français moderne. « Comme certains d’entre eux le sont devenus » est clair, idiomatique et maintient l’idée dynamique de γίνεσθε. « S’amuser » est une traduction plus directe de παίζειν que « se divertir », sans préciser indûment la nature des actes.
  terminology: « Idolâtres » est exact et usuel. La note doit signaler, sans l’imposer dans le texte, que παίζειν peut évoquer des réjouissances dans le cadre du festin idolâtre d’Exode 32.6.
