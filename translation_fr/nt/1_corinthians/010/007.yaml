  rationale: La révision restitue le lien comparatif de καθώς et de ὥσπερ, tout en donnant à la première comparaison une forme française complète. Elle choisit pour παίζειν un équivalent lexical simple dans le texte et réserve à la note l’éclairage contextuel d’Exode 32.6, sans définir de façon excessive l’activité visée.
