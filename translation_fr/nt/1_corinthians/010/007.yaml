reference: 1 Corinthians 10:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: μηδὲ εἰδωλολάτραι γίνεσθε, καθώς τινες αὐτῶν· ὥσπερ γέγραπται· Ἐκάθισεν ὁ λαὸς φαγεῖν καὶ πεῖν, καὶ ἀνέστησαν παίζειν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/007.yaml
  text: Do not become idolaters[a], as some of them were; just as it is written, “The people sat down to eat and drink, and rose up to play.”
translation:
  language: fr
  text: 'Ne devenez pas idolâtres, comme certains d’entre eux le sont devenus ; comme il est écrit : « Le peuple s’assit pour manger et boire, puis ils se levèrent pour s’amuser[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour se livrer à des réjouissances ». Ces paroles sont tirées d’Exode 32.6, où cet amusement est associé au festin idolâtre d’Israël autour du veau d’or.
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδὲ
  choice: Ne… pas
  rationale: Dans le contexte, μηδέ poursuit une série de mises en garde. Une interdiction directe est plus naturelle en français que « ni » isolé.
- source_word: εἰδωλολάτραι
  choice: idolâtres
  rationale: Terme français courant et concis pour désigner ceux qui rendent un culte aux idoles.
- source_word: γίνεσθε
  choice: devenez
  rationale: 'Préserve la valeur dynamique de γίνομαι : Paul avertit ses lecteurs de ne pas entrer dans cette conduite.'
- source_word: καθώς τινες αὐτῶν
  choice: comme certains d’entre eux
  rationale: La copule peut rester implicite en français, ce qui conserve l’ambiguïté entre leur identité et leur conduite sans répéter artificiellement « le devinrent ».
- source_word: ὥσπερ γέγραπται
  choice: En effet, il est écrit
  rationale: Rend naturellement la formule de citation et le lien confirmatif avec l’exemple évoqué, sans imposer en français un second « comme » lourd.
- source_word: Ἐκάθισεν ὁ λαὸς
  choice: Le peuple s’assit
  rationale: Reproduit le sujet collectif singulier et le mouvement narratif de la citation.
- source_word: φαγεῖν καὶ πεῖν
  choice: pour manger et boire
  rationale: Rend directement les deux infinitifs de but.
- source_word: ἀνέστησαν
  choice: ils se levèrent
  rationale: Le pluriel grec après le collectif « le peuple » est conservé en français par le pronom pluriel, reflétant l’accord selon le sens dans la citation.
- source_word: παίζειν
  choice: pour se divertir
  rationale: « Se divertir » conserve l’idée fondamentale de jeu ou d’amusement dans un registre digne; le sens contextuel possible de réjouissances débridées est signalé en note.
theological_decisions:
- issue: Degré d’explicitation de l’allusion à Exode 32 dans παίζειν
  choice: Conserver dans le texte une formulation non explicative, « se divertir », et signaler en note le sens contextuel possible de réjouissances.
  alternative: faire la fête / se livrer à des réjouissances
  rationale: Le contexte est celui du festin idolâtre autour du veau d’or, mais le verbe grec demeure moins précis. Le texte principal préserve cette latitude au lieu de définir la nature exacte de l’activité.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple maintient le registre d’une citation scripturaire sans archaïsme marqué. Le passage du collectif singulier « le peuple » au pluriel « ils » suit la syntaxe grecque et demeure intelligible en français.
