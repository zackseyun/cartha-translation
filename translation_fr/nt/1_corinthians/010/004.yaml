source:
  edition: SBLGNT
  text: καὶ πάντες τὸ αὐτὸ ⸂πνευματικὸν ἔπιον πόμα⸃, ἔπινον γὰρ ἐκ πνευματικῆς ἀκολουθούσης πέτρας, ἡ ⸂πέτρα δὲ⸃ ἦν ὁ Χριστός·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/004.yaml
  text: and all drank the same spiritual drink[a], for they were drinking from a spiritual rock that followed them[b], and the rock was the Messiah.
translation:
  language: fr
  text: et tous ont bu la même boisson spirituelle, car ils buvaient d’un rocher spirituel qui les suivait[a], et ce rocher était le Messie[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec peut aussi se traduire plus simplement par « qui les a suivis ». L’imparfait « suivait » rend toutefois mieux l’aspect continu du participe grec.
    reason: lexical_alternative
  - marker: b
    text: 'Grec : « le Christ ». Ici, Χριστός est rendu par « le Messie » parce que le mot fonctionne comme un titre.'
    reason: alternative_reading
lexical_decisions:
- source_word: πνευματικὸν ... πόμα
  choice: boisson spirituelle
  rationale: Cette formulation conserve le terme théologiquement chargé « spirituelle » ainsi que le parallélisme avec la « nourriture spirituelle » du verset précédent, sans le réduire à « symbolique » ou à « miraculeuse ».
- source_word: ἔπιον
  choice: ont bu
  rationale: Le passé composé exprime naturellement en français moderne l’action globale résumée par l’aoriste grec.
- source_word: ἔπινον
  choice: buvaient
  rationale: L’imparfait rend l’aspect continu ou répété de l’imparfait grec et le distingue de l’aoriste précédent.
- source_word: ἐκ πνευματικῆς ἀκολουθούσης πέτρας
  choice: à un rocher spirituel qui les suivait
  rationale: « Un rocher » reflète l’absence d’article dans cette première mention; « qui les suivait » préserve le sens et l’aspect duratif du participe présent ἀκολουθούσης. La préposition « à » rend idiomatiquement l’idée de boire en puisant à cette provenance, sans ajouter explicitement le mot « eau ».
- source_word: πέτρα
  choice: rocher
  rationale: « Rocher » désigne une masse rocheuse plutôt qu’une petite pierre et conserve la force typologique de l’image.
- source_word: ἡ πέτρα δὲ ἦν
  choice: et ce rocher était
  rationale: « Et » rend la liaison explicative de δέ sans exagérer un contraste; « ce rocher » reprend naturellement en français le rocher qui vient d’être mentionné.
- source_word: ὁ Χριστός
  choice: le Messie
  rationale: Dans cette proposition d’identification, Χριστός fonctionne comme un titre. « Le Messie » en restitue le sens plutôt que d’employer la forme devenue quasi nominale « le Christ ».
- source_word: πάντες τὸ αὐτὸ
  choice: tous ... la même
  rationale: Cette formulation maintient l’insistance de Paul sur l’expérience commune à tout le groupe.
theological_decisions:
- issue: L’affirmation « ce rocher était le Messie »
  choice: Conserver l’identification directe et typologique formulée par Paul.
  alternative: « Ce rocher représentait le Messie » ou une simple allusion à la tradition du rocher miraculeux.
  rationale: La proposition grecque est directement équative. La traduction ne doit ni réduire cette affirmation à un symbole seulement, ni expliquer comment le rocher et le Messie sont liés au-delà de ce que dit le texte.
- issue: Le sens de « spirituel » appliqué à la boisson et au rocher
  choice: Conserver « spirituel » dans les deux occurrences.
  alternative: « Symbolique », « surnaturel » ou « miraculeux ».
  rationale: πνευματικός garde ici une portée théologique délibérément ample, liée à la provision divine et à la signification typologique. Un terme plus explicatif en restreindrait indûment le sens.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche de l’enchaînement grec tout en distinguant naturellement le passé composé « ont bu » de l’imparfait « buvaient ». L’expression légèrement marquée « boire à un rocher » évite d’ajouter « eau » et préserve l’image de la source rocheuse.
