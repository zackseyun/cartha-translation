id: 1CO.10.15
reference: 1 Corinthians 10:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὡς φρονίμοις λέγω· κρίνατε ὑμεῖς ὅ φημι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/015.yaml
  text: I speak as to sensible people[b][a]; judge for yourselves what I say.
translation:
  language: fr
  text: 'Je vous parle comme à des personnes sensées[a] : jugez vous-mêmes ce que je dis.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des personnes avisées » ou « des personnes prudentes ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς
  choice: comme à
  rationale: Avec « parler », cette tournure française exprime naturellement la manière dont Paul considère ses destinataires en s’adressant à eux.
- source_word: φρονίμοις
  choice: des personnes sensées
  rationale: φρόνιμος évoque ici le bon sens et la capacité de discernement pratique. « Sensées » est actuel et mesuré, sans suraccentuer une sagesse pleinement acquise.
- source_word: λέγω
  choice: Je vous parle
  rationale: Le verbe « parler », avec le complément indirect rendu explicite par « vous », forme une phrase naturelle en français et introduit bien l’appel qui suit.
- source_word: κρίνατε
  choice: jugez
  rationale: L’impératif appelle les destinataires à porter eux-mêmes une appréciation sur l’affirmation de Paul. « Jugez » conserve directement la force évaluative de κρίνω.
- source_word: ὑμεῖς
  choice: vous-mêmes
  rationale: Le pronom grec explicite est emphatique. « Vous-mêmes » préserve cette insistance sans introduire l’idée légèrement différente de « par vous-mêmes ».
- source_word: ὅ
  choice: ce que
  rationale: « Ce que » est l’équivalent français naturel du pronom relatif neutre employé comme objet.
- source_word: φημι
  choice: je dis
  rationale: « Dire » rend sobrement φημί et conserve la légère variation entre λέγω, traduit par « parler », et φημί.
theological_decisions:
- issue: Caractérisation rhétorique des destinataires
  choice: Paul s’adresse aux Corinthiens comme à des personnes capables de discernement, sans approuver pour autant toute leur conduite.
  alternative: Comprendre l’expression soit comme une flatterie ironique, soit comme une reconnaissance sans réserve de leur sagesse.
  rationale: « Personnes sensées » garde l’appréciation positive mais modérée du grec et laisse ouverte la possibilité d’une nuance rhétorique, sans imposer l’ironie ni une pleine approbation.
translation_notes:
  register: Français moderne, clair et digne. Les deux propositions sont reliées par deux-points pour faire ressortir l’appel au discernement. L’ordre « jugez vous-mêmes » maintient l’emphase du pronom grec.
