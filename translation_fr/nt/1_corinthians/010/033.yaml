revisions:
- from: tout comme moi aussi, je cherche à plaire à tous en toutes choses[a], sans chercher mon propre avantage, mais celui du plus grand nombre[b], afin qu’ils soient sauvés.
  to: De même, moi aussi, je cherche à plaire à tous en toutes choses[a], sans chercher mon propre avantage, mais celui de la multitude[b], afin qu’ils soient sauvés.
  rationale: La révision remplace « le plus grand nombre », qui ajoute une idée de majorité ou de superlatif, par « la multitude », qui correspond plus exactement à τῶν πολλῶν. Elle allège aussi l’ouverture en « De même, moi aussi », sans modifier le sens comparatif ni la valeur additive du grec. Les ancres et les notes sont conservées et adaptées au texte révisé.
