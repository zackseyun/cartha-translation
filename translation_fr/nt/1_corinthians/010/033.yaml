  text: καθὼς κἀγὼ πάντα πᾶσιν ἀρέσκω, μὴ ζητῶν τὸ ἐμαυτοῦ ⸀σύμφορον ἀλλὰ τὸ τῶν πολλῶν, ἵνα σωθῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/033.yaml
  text: just as I also please everyone in everything[a], not seeking my own advantage but that of the many[b], so that they may be saved.
translation:
  language: fr
  text: De même, moi aussi, je cherche à plaire à tous en toutes choses[a], sans chercher mon propre avantage, mais celui de la multitude[b], afin qu’ils soient sauvés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « à tous en toutes choses » ; l’expression indique une large disposition à s’adapter aux autres pour leur bien.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « mon propre bien, mais celui de la multitude » ; ou, plus explicitement, « l’avantage de la multitude ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς κἀγὼ
  choice: tout comme moi aussi
  rationale: Rend la comparaison avec l’exhortation précédente et conserve la valeur additive de κἀγώ.
- source_word: πάντα πᾶσιν
  choice: à tous en toutes choses
  rationale: Reproduit aussi directement que possible la large portée de l’expression grecque, sans lui substituer la formulation différente de 1 Corinthiens 9.22.
- source_word: ἀρέσκω
  choice: je cherche à plaire
  rationale: En français, « chercher à plaire » exprime naturellement l’effort d’agir d’une manière qui convient aux autres; la suite précise qu’il ne s’agit ni de flatterie ni de recherche d’approbation.
- source_word: μὴ ζητῶν
  choice: sans chercher
  rationale: Le participe présent décrit la manière et le motif qui gouvernent l’action principale.
- source_word: τὸ ἐμαυτοῦ σύμφορον
  choice: mon propre avantage
  rationale: σύμφορον désigne ce qui est profitable ou avantageux; cette formulation conserve le contraste avec l’intérêt des autres.
- source_word: ἀλλὰ τὸ τῶν πολλῶν
  choice: mais celui du plus grand nombre
  rationale: Conserve la construction elliptique et rend οἱ πολλοί de façon idiomatique, sans le généraliser en « tous ».
- source_word: ἵνα σωθῶσιν
  choice: afin qu’ils soient sauvés
  rationale: Préserve la proposition de but, le passif et le sens sotériologique ordinaire du verbe dans ce contexte paulinien.
theological_decisions:
- issue: Portée et sens de σωθῶσιν
  choice: « qu’ils soient sauvés », au sens du salut
  alternative: « qu’ils soient secourus » ou « préservés »
  rationale: Le contexte évangélique et l’usage paulinien soutiennent le sens sotériologique. Le passif est maintenu sans préciser davantage l’agent.
- issue: Sens de l’action de « plaire » aux autres
  choice: s’adapter aux autres en vue de leur bien
  alternative: rechercher leur approbation ou faire des compromis pour leur complaire
  rationale: 'La précision « sans chercher mon propre avantage, mais celui du plus grand nombre » détermine le sens: Paul vise le bien et le salut d’autrui, non la popularité.'
translation_notes:
  register: Français international moderne, naturel et digne. « Tout comme » assure le lien avec le verset précédent. « Le plus grand nombre » garde la distinction entre « beaucoup » et « tous », tandis que les notes signalent les principaux équivalents possibles.
