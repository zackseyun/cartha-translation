id: 1CO.10.13
reference: 1 Corinthians 10:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: πειρασμὸς ὑμᾶς οὐκ εἴληφεν εἰ μὴ ἀνθρώπινος· πιστὸς δὲ ὁ θεός, ὃς οὐκ ἐάσει ὑμᾶς πειρασθῆναι ὑπὲρ ὃ δύνασθε, ἀλλὰ ποιήσει σὺν τῷ πειρασμῷ καὶ τὴν ἔκβασιν τοῦ ⸀δύνασθαι ὑπενεγκεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/013.yaml
  text: No temptation has overtaken you except what is common to man[a]. But God is faithful, who will not allow you to be tempted beyond what you are able, but with the temptation will also provide the way out[c][b], so that you may be able to endure it.
translation:
  language: fr
  text: 'Aucune tentation[a] ne vous est survenue qui ne soit commune aux êtres humains[b]. Mais Dieu est fidèle : il ne permettra pas que vous soyez tentés au-delà de vos forces et, avec la tentation, il procurera aussi une issue[c], afin que vous puissiez la supporter.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec rendu par « tentation » et « soyez tentés » peut aussi signifier « épreuve » et « être mis à l’épreuve ».
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « qui ne soit humaine ».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « une sortie » ou « un dénouement ». L’issue que Dieu procure permet de supporter la tentation; elle n’implique pas nécessairement sa suppression immédiate.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πειρασμός / πειρασθῆναι
  choice: tentation / être tentés
  rationale: Dans le contexte immédiat des avertissements contre les mauvais désirs et l’idolâtrie, le sens moral est au premier plan. Le grec peut toutefois aussi désigner l’épreuve ou la mise à l’épreuve, possibilité conservée en note.
- source_word: εἴληφεν
  choice: est survenue
  rationale: Le parfait de λαμβάνω décrit ici une tentation qui a atteint les destinataires. « Est survenue » est naturel en français et n’exagère pas l’idée de saisie.
- source_word: εἰ μὴ ἀνθρώπινος
  choice: qui ne soit humaine
  rationale: ἀνθρώπινος signifie ce qui est humain, propre à l’expérience humaine. Cette formulation concise préserve la portée générale sans ajouter explicitement l’idée de fréquence.
- source_word: πιστός
  choice: fidèle
  rationale: « Fidèle » exprime la fiabilité de Dieu et correspond directement à πιστός.
- source_word: οὐκ ἐάσει
  choice: il ne permettra pas
  rationale: Rend clairement l’idée de permission exprimée par ἐάω, dans un registre digne et courant.
- source_word: ὑπὲρ ὃ δύνασθε
  choice: au-delà de vos forces
  rationale: Formulation française idiomatique qui exprime la limite de leur capacité, sans préciser plus que le grec ce que recouvrent ces forces.
- source_word: ποιήσει ... τὴν ἔκβασιν
  choice: il ménagera aussi une issue
  rationale: ποιέω avec ἔκβασις désigne l’action de procurer ou d’aménager une issue. « Ménagera » souligne l’intervention de Dieu tout en restant naturel.
- source_word: σὺν τῷ πειρασμῷ
  choice: avec la tentation
  rationale: 'Préserve l’accompagnement marqué par σύν : l’issue est donnée avec la tentation, sans suggérer nécessairement sa suppression immédiate.'
- source_word: ἔκβασιν
  choice: une issue
  rationale: ἔκβασις peut désigner une sortie, une échappatoire ou un dénouement. « Une issue » conserve cette amplitude et s’accorde avec l’endurance mentionnée ensuite.
- source_word: τοῦ δύνασθαι ὑπενεγκεῖν
  choice: afin que vous puissiez la supporter
  rationale: L’infinitif articulé exprime ici le but ou le résultat. « Supporter » rend l’idée de tenir sous la charge; le pronom « la » reprend naturellement la tentation.
theological_decisions:
- issue: Sens de πειρασμός et πειρασθῆναι
  choice: « tentation » et « être tentés » dans le texte principal
  alternative: « épreuve » et « être mis à l’épreuve »
  rationale: Le contexte favorise la tentation morale, mais le champ lexical grec inclut aussi l’épreuve. La note préserve cette ambiguïté sans attribuer à Dieu l’incitation au mal ni résoudre la tension du passage.
- issue: Nature de l’issue donnée par Dieu
  choice: « une issue », orientée vers la capacité de supporter
  alternative: « la sortie », « le moyen d’en sortir » ou « le dénouement »
  rationale: La proposition finale indique que l’intervention divine permet l’endurance; elle ne promet donc pas sans nuance une suppression immédiate de toute difficulté.
- issue: Portée de ἀνθρώπινος
  choice: « humaine »
  alternative: « commune aux êtres humains » ou « à la mesure humaine »
  rationale: Le terme qualifie la tentation comme humaine. La traduction évite d’ajouter une affirmation absolue sur ce que chaque personne expérimente tout en gardant la portée universelle du qualificatif.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe conserve le contraste marqué par « Mais Dieu est fidèle ». « Au-delà de vos forces » et « ménagera une issue » sont idiomatiques sans effacer la relation entre l’issue et l’endurance.
