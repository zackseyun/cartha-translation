source:
  edition: SBLGNT
  text: Ταῦτα δὲ τύποι ἡμῶν ἐγενήθησαν, εἰς τὸ μὴ εἶναι ἡμᾶς ἐπιθυμητὰς κακῶν, καθὼς κἀκεῖνοι ἐπεθύμησαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/006.yaml
  text: These things became examples for us[a], so that we might not be people who desire evil things, just as they also desired them.
translation:
  language: fr
  text: Ces événements sont devenus des exemples pour nous[a], afin que nous ne soyons pas de ceux qui désirent des choses mauvaises, comme eux aussi les ont désirées.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des types pour nous » ou « des modèles pour nous ».
    reason: Le grec τύποι peut désigner des exemples, des types ou des modèles ; la note préserve cette amplitude lexicale.
lexical_decisions:
- source_word: Ταῦτα
  choice: Ces événements
  rationale: Le démonstratif neutre pluriel renvoie aux épisodes vécus par Israël dans le désert. « Ces événements » explicite naturellement ce référent sans ajouter d’interprétation substantielle.
- source_word: δὲ
  choice: non exprimé séparément
  rationale: La particule marque ici une transition légère. En français, l’enchaînement est naturel sans connecteur explicite ; « mais » accentuerait excessivement le contraste.
- source_word: τύποι
  choice: des exemples
  rationale: Dans ce contexte d’exhortation, le mot désigne des précédents instructifs. « Exemples » communique clairement cette fonction, tandis que « types » risquerait d’imposer un sens théologique trop technique. Les autres possibilités sont conservées en note.
- source_word: ἡμῶν
  choice: pour nous
  rationale: Avec τύποι, le génitif indique que ces exemples concernent et instruisent la communauté ; « pour nous » est l’expression française idiomatique.
- source_word: ἐγενήθησαν
  choice: sont devenus
  rationale: 'Cette formulation conserve l’idée exprimée par γίνομαι : ces événements en sont venus à servir d’exemples, plutôt que d’avoir simplement été tels.'
- source_word: εἰς τὸ μὴ εἶναι ἡμᾶς
  choice: afin que nous ne soyons pas
  rationale: La construction peut exprimer le but ou le résultat. « Afin que » rend naturellement la visée exhortative sans éliminer entièrement cette proximité sémantique.
- source_word: ἐπιθυμητὰς κακῶν
  choice: de ceux qui désirent le mal
  rationale: ἐπιθυμητάς est un nom désignant des personnes qui désirent ou convoitent. La périphrase française préserve cette forme personnelle, et « le mal » rend collectivement le pluriel neutre κακῶν sans la lourdeur de « choses mauvaises ».
- source_word: καθὼς κἀκεῖνοι ἐπεθύμησαν
  choice: comme eux aussi l’ont désiré
  rationale: La traduction maintient la comparaison, la valeur additive de καί dans κἀκεῖνοι et le lien lexical entre « désirent » et ἐπεθύμησαν. Le pronom « l’ » reprend « le mal ».
theological_decisions:
- issue: Portée de τύποι pour les expériences d’Israël au désert
  choice: « exemples » au sens de précédents servant d’avertissement moral
  alternative: « types » ou « modèles »
  rationale: Le contexte immédiat met l’accent sur l’exhortation adressée à la communauté. « Exemples » rend cette fonction sans exclure les résonances figuratives du terme grec ni imposer un système typologique particulier.
- issue: Portée morale du vocabulaire du désir
  choice: « désirent le mal »
  alternative: « convoitent des choses mauvaises »
  rationale: Le grec vise ici les mauvais désirs de manière générale, et non spécialement la convoitise sexuelle. « Désirer » conserve cette ampleur ainsi que la répétition lexicale du texte.
translation_notes:
  register: Français international moderne, clair et digne. La structure « de ceux qui désirent » demeure naturelle tout en respectant le nom grec ἐπιθυμητάς. Le texte évite aussi bien le jargon typologique dans le corps du verset qu’une formulation qui limiterait le désir mauvais au domaine sexuel.
