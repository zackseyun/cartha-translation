reference: 1 Corinthians 10:25
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: πᾶν τὸ ἐν μακέλλῳ πωλούμενον ἐσθίετε μηδὲν ἀνακρίνοντες διὰ τὴν συνείδησιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/025.yaml
  text: Eat whatever is sold in the meat market[a], asking no questions for the sake of conscience,
translation:
  language: fr
  text: Mangez de tout ce qui se vend au marché de la viande, sans poser de questions, pour des raisons de conscience[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sans faire aucune enquête » ou « sans rien examiner » ; il s’agit de ne pas chercher à connaître l’origine de la viande.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶν τὸ ... πωλούμενον
  choice: de tout ce qui se vend
  rationale: La tournure substantivée désigne globalement tout ce qui est mis en vente. « De tout ce qui se vend » est naturel en français après « mangez » et conserve cette portée générale.
- source_word: ἐν μακέλλῳ
  choice: au marché de la viande
  rationale: μάκελλον désigne un marché où l’on vend de la viande, et non un marché générique. Cette formulation garde le cadre concret pertinent dans le contexte.
- source_word: ἐσθίετε
  choice: Mangez
  rationale: L’impératif présent à la deuxième personne du pluriel est rendu directement par l’impératif français, sans surcharger le texte d’une nuance aspectuelle que le contexte suffit à porter.
- source_word: μηδὲν ἀνακρίνοντες
  choice: sans rien demander
  rationale: ἀνακρίνω peut évoquer le fait d’interroger, d’examiner ou d’enquêter. Ici, l’expression indique qu’il ne faut pas chercher à connaître l’origine ou l’histoire de la viande.
- source_word: διὰ τὴν συνείδησιν
  choice: par souci de conscience
  rationale: διά avec l’accusatif exprime ici le motif ou la considération en cause. « Par souci de conscience » est idiomatique et ne précise pas prématurément de quelle conscience il s’agit.
theological_decisions:
- issue: Référent de « conscience »
  choice: Garder la formulation générale « conscience » sans possessif.
  alternative: « votre conscience » ou « la conscience de l’autre »
  rationale: Le grec dit simplement « la conscience ». Le référent n’étant pas explicité dans ce verset seul, la traduction préserve l’ambiguïté jusqu’aux précisions apportées par la suite du contexte.
translation_notes:
  register: Français international moderne, clair et digne. « Marché de la viande » est plus précis que « marché » et plus fidèle au cadre antique que « boucherie ». La phrase conserve la concision impérative du grec.
