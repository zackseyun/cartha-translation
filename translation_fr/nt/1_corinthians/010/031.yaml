id: 1CO.10.31
reference: 1 Corinthians 10:31
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Εἴτε οὖν ἐσθίετε εἴτε πίνετε εἴτε τι ποιεῖτε, πάντα εἰς δόξαν θεοῦ ποιεῖτε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/031.yaml
  text: Therefore, whether you eat or drink, or whatever you do, do everything for the glory of God.
translation:
  language: fr
  text: Ainsi donc, que vous mangiez, que vous buviez ou quoi que vous fassiez, faites tout pour la gloire de Dieu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἴτε ... εἴτε ... εἴτε
  choice: que ... que ... ou quoi que
  rationale: Cette construction française naturelle conserve la succession des cas envisagés et son élargissement final, sans alourdir la phrase par « soit que ».
- source_word: οὖν
  choice: Ainsi donc
  rationale: L’expression marque clairement la conclusion tirée de la discussion précédente, dans un registre à la fois courant et digne.
- source_word: ἐσθίετε
  choice: vous mangiez
  rationale: Le subjonctif est exigé en français par la tournure « que vous… » et exprime ici une éventualité générale, comme le présent grec à valeur générique.
- source_word: πίνετε
  choice: vous buviez
  rationale: Comme pour « mangiez », le subjonctif français présente un cas général, sans donner au présent grec une valeur progressive.
- source_word: τι
  choice: quoi que
  rationale: Avec ποιεῖτε, « quoi que vous fassiez » rend naturellement l'indéfini et étend la portée à toute action.
- source_word: ποιεῖτε
  choice: vous fassiez / faites
  rationale: Le même verbe grec est rendu par le verbe français « faire » dans les deux occurrences; les formes différentes répondent à la syntaxe française, la seconde portant l'exhortation impérative.
- source_word: πάντα
  choice: tout
  rationale: « Tout » exprime la totalité de manière idiomatique et actuelle en français.
- source_word: εἰς δόξαν
  choice: pour la gloire
  rationale: « Pour » exprime ici le but ou l'orientation de l'action, tout en laissant intacte la force théologique de « gloire ».
- source_word: θεοῦ
  choice: de Dieu
  rationale: Le complément du nom rend directement le génitif grec et conserve l'expression reconnue « la gloire de Dieu ».
theological_decisions:
- issue: Portée de l'exhortation de Paul
  choice: Une exhortation générale qui oriente toute action, y compris les actes ordinaires, vers la gloire de Dieu.
  alternative: Une instruction limitée aux seules questions de nourriture et de boisson.
  rationale: Les exemples précis de manger et de boire débouchent sur les formulations englobantes « quoi que vous fassiez » et « tout ». La traduction conserve ce mouvement du contexte immédiat vers un principe général sans ajouter d'explication doctrinale.
translation_notes:
  register: Français international moderne, clair et digne. « Ainsi donc » maintient le lien logique; la répétition de « que vous » conserve le rythme rhétorique grec. Aucun archaïsme ni terme confessionnel n'est introduit.
