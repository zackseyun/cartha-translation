id: 1CO.10.18
reference: 1 Corinthians 10:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: βλέπετε τὸν Ἰσραὴλ κατὰ σάρκα· ⸀οὐχ οἱ ἐσθίοντες τὰς θυσίας κοινωνοὶ τοῦ θυσιαστηρίου εἰσίν;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/018.yaml
  text: 'Consider Israel according to the flesh: are not those who eat the sacrifices participants in the altar?[a][b][c]'
translation:
  language: fr
  text: 'Considérez Israël selon la chair[a] : ceux qui mangent les sacrifices ne sont-ils pas en communion avec l’autel[b] ?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Israël selon la descendance naturelle »; littéralement « Israël selon la chair ».
    reason: lexical_alternative
  - marker: b
    text: Ou « n’ont-ils pas part à l’autel ? »
    reason: lexical_alternative
lexical_decisions:
- source_word: βλέπετε
  choice: Considérez
  rationale: L’impératif pluriel appelle ici à examiner un exemple dans le raisonnement de Paul, plutôt qu’à simplement regarder.
- source_word: Ἰσραὴλ κατὰ σάρκα
  choice: Israël selon la chair
  rationale: Cette formulation conserve l’expression paulinienne et son ambiguïté réelle; dans ce contexte, elle désigne vraisemblablement Israël sous l’angle de la descendance naturelle, sans associer σάρξ à une « nature pécheresse ».
- source_word: οὐχ ... εἰσίν;
  choice: ne sont-ils pas… ?
  rationale: La question rhétorique introduite par οὐχ appelle une réponse affirmative.
- source_word: οἱ ἐσθίοντες
  choice: ceux qui mangent
  rationale: Rend naturellement le participe substantivé tout en conservant l’acte concret de manger.
- source_word: τὰς θυσίας
  choice: les sacrifices
  rationale: Traduction directe, claire et courante de θυσίας dans ce contexte cultuel.
- source_word: κοινωνοὶ τοῦ θυσιαστηρίου
  choice: en communion avec l’autel
  rationale: κοινωνοί exprime le fait d’avoir part ou d’être associé. « En communion avec l’autel » est naturel en français et rend la participation cultuelle signifiée par le génitif, sans suggérer littéralement que les personnes sont « dans » l’autel.
theological_decisions:
- issue: Sens de « Israël selon la chair »
  choice: Conserver la formule « Israël selon la chair » dans le texte, avec une note indiquant la référence probable à la descendance naturelle.
  alternative: « l’Israël selon la descendance naturelle » ou « l’Israël ethnique »
  rationale: La formule grecque renvoie ici très probablement à Israël considéré selon la filiation naturelle, mais la traduction littérale préserve le langage et la tension théologique de Paul sans trancher des débats plus larges sur Israël et l’Église.
- issue: Nature du rapport à l’autel
  choice: « en communion avec l’autel »
  alternative: « participants de l’autel » ou « associés à l’autel »
  rationale: Le contexte établit une participation cultuelle réelle par la consommation des sacrifices. La formulation retenue exprime cette solidarité sans définir davantage sa nature théologique.
translation_notes:
  register: Français international moderne, digne et accessible. La structure interrogative et l’expression paulinienne « selon la chair » sont conservées; « en communion avec l’autel » évite une tournure française artificielle tout en maintenant l’idée de participation cultuelle.
