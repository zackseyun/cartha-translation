  yaml_path: translation/nt/1_corinthians/010/022.yaml
  text: Or are we provoking the Lord to jealousy? Surely we are not stronger than he is, are we?
translation:
  language: fr
  text: Ou bien provoquons-nous le Seigneur à la jalousie ? Sommes-nous plus forts que lui ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραζηλοῦμεν
  choice: provoquer la jalousie
  rationale: Cette expression rend le sens causatif du verbe et conserve l’écho biblique à la jalousie divine, sans l’atténuer en simple irritation.
- source_word: τὸν κύριον
  choice: le Seigneur
  rationale: Équivalent français naturel de κύριος dans ce contexte, tout en maintenant ouverte la portée référentielle du titre.
- source_word: μὴ ἰσχυρότεροι αὐτοῦ ἐσμεν
  choice: Serions-nous plus forts que lui ?
  rationale: La question rhétorique avec μή appelle une réponse négative. Le conditionnel interrogatif français exprime naturellement cette attente sans ajouter d’adverbe absent du grec.
theological_decisions:
- issue: La jalousie attribuée au Seigneur
  choice: Conserver explicitement « la jalousie du Seigneur »
  alternative: « rendre le Seigneur jaloux » ou « irriter le Seigneur »
  rationale: Le grec évoque la jalousie liée à l’exclusivité de l’alliance et du culte. « Irriter » réduirait cette dimension, tandis que la formulation nominale reste digne et claire.
- issue: Force de la seconde question rhétorique
  choice: « Serions-nous plus forts que lui ? »
  alternative: « Nous ne sommes tout de même pas plus forts que lui, n’est-ce pas ? »
  rationale: La formulation choisie garde l’implicite négatif du grec et sa vigueur, sans développer la phrase par des éléments explicatifs.
translation_notes:
  register: Français international moderne, sobre et direct. La coordination « Ou bien » maintient le lien argumentatif avec le contexte précédent. Les deux questions conservent la tension et l’avertissement du grec.
