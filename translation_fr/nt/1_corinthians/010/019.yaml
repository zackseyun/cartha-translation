lexical_decisions:
- source_word: τί οὖν φημι
  choice: Que veux-je donc dire ?
  rationale: Formulation idiomatique en français moderne qui conserve la question rhétorique et la progression argumentative de Paul.
- source_word: εἰδωλόθυτόν
  choice: la viande sacrifiée aux idoles
  rationale: Dans le contexte de 1 Corinthiens 8–10, le terme désigne la nourriture, particulièrement la viande, provenant de sacrifices offerts aux idoles.
- source_word: τί ἐστιν (avec εἰδωλόθυτόν)
  choice: aurait une valeur en elle-même
  rationale: Rend l’idée idiomatique d’avoir une réalité ou une portée effective, sans attribuer au mets une puissance spirituelle intrinsèque.
- source_word: εἴδωλον
  choice: une idole
  rationale: Équivalent français courant et précis dans ce contexte cultuel.
- source_word: τί ἐστιν (avec εἴδωλον)
  choice: aurait une existence réelle
  rationale: Exprime naturellement en français la question de savoir si l’idole est réellement quelque chose, tout en laissant le contexte préciser en quel sens.
theological_decisions:
- issue: Portée de τί ἐστιν appliqué à l’offrande et à l’idole
  choice: Distinguer dans la formulation française la « valeur en elle-même » de la viande et l’« existence réelle » de l’idole.
  alternative: « Que ce qui est sacrifié aux idoles soit quelque chose, ou qu’une idole soit quelque chose ? »
  rationale: Le grec demeure volontairement bref et parallèle. La formulation retenue explicite légèrement l’idiome pour être naturelle en français, tandis que les notes préservent l’alternative plus littérale et évitent d’affirmer que les réalités démoniaques évoquées ensuite n’existent pas.
translation_notes:
  register: Français international moderne, clair et digne. La question rhétorique est rendue naturellement; les deux notes signalées dans le texte conservent l’ambiguïté du grec et la tension avec la suite du passage.
