source:
  edition: SBLGNT
  text: μηδὲ ἐκπειράζωμεν τὸν ⸀Χριστόν, ⸀καθώς τινες αὐτῶν ἐπείρασαν, καὶ ὑπὸ τῶν ὄφεων ⸀ἀπώλλυντο.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/009.yaml
  text: Nor should we put Messiah to the test[b][a], as some of them tested him and were being destroyed by the snakes.
translation:
  language: fr
  text: Ne mettons pas non plus le Messie à l’épreuve[a], comme certains d’entre eux l’ont mis à l’épreuve et périssaient à cause des serpents.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Certains manuscrits lisent « le Seigneur » au lieu de « le Messie » (grec : « Christ »).'
    reason: textual_variant
lexical_decisions:
- source_word: μηδὲ
  choice: Ne… pas non plus
  rationale: Cette tournure naturelle poursuit la série d’interdictions du contexte tout en conservant sa force exhortative.
- source_word: ἐκπειράζωμεν
  choice: mettons… à l’épreuve
  rationale: Le verbe désigne ici le fait de soumettre quelqu’un à une épreuve indue; cette expression est plus exacte que « tenter » lorsque le Messie est l’objet.
- source_word: τὸν Χριστόν
  choice: le Messie
  rationale: Χριστός fonctionne comme un titre; « le Messie » en rend le sens plutôt que de le translittérer. La variante « le Seigneur » est signalée en note.
- source_word: καθώς
  choice: comme
  rationale: Introduit simplement et naturellement la comparaison avec l’exemple des Israélites.
- source_word: τινες αὐτῶν
  choice: certains d’entre eux
  rationale: Désigne une partie de la génération d’Israël au désert sans expliciter davantage que le grec.
- source_word: ἐπείρασαν
  choice: l’ont mis à l’épreuve
  rationale: Reprend le sens du verbe précédent; le pronom objet implicite en grec est exprimé en français pour assurer la clarté syntaxique.
- source_word: ὑπὸ τῶν ὄφεων
  choice: sous les morsures des serpents
  rationale: Le grec signifie littéralement « par les serpents ». La formulation française rend naturellement le moyen concret de leur mort sans changer l’agent.
- source_word: ἀπώλλυντο
  choice: périssaient
  rationale: L’imparfait français reflète l’aspect imperfectif du verbe grec et « périr » convient au contexte de mort sans surtraduire par « être détruits ».
theological_decisions:
- issue: Référent et variante textuelle de τὸν Χριστόν
  choice: le Messie
  alternative: le Seigneur; le Christ
  rationale: Le texte principal du SBLGNT porte Χριστόν, ce qui crée une identification théologiquement forte entre le Messie et celui qu’Israël a mis à l’épreuve au désert. La traduction la conserve sans l’atténuer; la variante manuscrite « le Seigneur » est donnée en note.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition « mettre à l’épreuve » préserve le parallèle grec. « Serpents » est courant en français biblique comme général; aucune note lexicale n’est nécessaire.
