  text: ἀπρόσκοποι ⸂καὶ Ἰουδαίοις γίνεσθε⸃ καὶ Ἕλλησιν καὶ τῇ ἐκκλησίᾳ τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/032.yaml
  text: Give no offense either to Jews or to Greeks or to the church of God[b][a],
translation:
  language: fr
  text: 'Ne faites trébucher personne : ni les Juifs, ni les Grecs[b], ni l’Église de Dieu[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ne donnez à personne une occasion de chute » ou « soyez sans faire obstacle ».
    reason: lexical_alternative
  - marker: b
    text: Ici, « Grecs » peut désigner plus largement les non-Juifs dans le cadre de Paul ; le texte grec dit précisément « Grecs ».
    reason: cultural_note
lexical_decisions:
- source_word: ἀπρόσκοποι
  choice: ne soyez une cause de chute
  rationale: Dans ce contexte, l’adjectif exprime le fait de ne pas faire trébucher autrui ni de lui créer un obstacle. Cette formulation relationnelle s’accorde avec les trois groupes qui suivent et avec l’exhortation du contexte.
- source_word: γίνεσθε
  choice: soyez
  rationale: Le présent impératif appelle à une conduite continue. « Soyez » est naturel en français et n’impose pas l’idée d’un changement ponctuel.
- source_word: Ἰουδαίοις
  choice: les Juifs
  rationale: Le terme désigne ici le peuple juif comme groupe ethnoreligieux, et non seulement les habitants de la Judée.
- source_word: Ἕλλησιν
  choice: les Grecs
  rationale: La traduction conserve le terme précis du texte grec. Dans le cadre paulinien, il peut représenter plus largement les non-Juifs, ce qu’indique la note.
- source_word: ἐκκλησίᾳ τοῦ θεοῦ
  choice: l’Église de Dieu
  rationale: Chez Paul, ἐκκλησία désigne couramment la communauté des croyants. « Église de Dieu » est une formulation française établie qui conserve directement le génitif grec.
theological_decisions:
- issue: Répartition des groupes visés par l’exhortation
  choice: Le texte nomme distinctement les Juifs, les Grecs et l’Église de Dieu.
  alternative: Comprendre « les Grecs » comme une désignation explicite de tous les non-Juifs, ou réduire l’exhortation à une stratégie missionnaire.
  rationale: La traduction maintient les trois catégories énoncées sans préciser davantage leurs rapports ni limiter la portée éthique de l’exhortation.
- issue: Nature de l’absence d’offense
  choice: Rendre l’expression par « ne soyez une cause de chute » en mettant l’accent sur l’effet de la conduite sur autrui.
  alternative: « Soyez irréprochables » ou « ne scandalisez personne ».
  rationale: « Irréprochables » pourrait déplacer le sens vers une qualité morale générale, tandis que « scandaliser » a en français moderne des connotations d’indignation qui ne rendent pas toujours l’idée d’un obstacle faisant trébucher.
translation_notes:
  register: Français international moderne, clair et digne. La tournure impérative reste concise, et « cause de chute » conserve l’image relationnelle du terme grec sans employer le faux ami moderne « offense ».
