  text: Οὐ θέλω ⸀γὰρ ὑμᾶς ἀγνοεῖν, ἀδελφοί, ὅτι οἱ πατέρες ἡμῶν πάντες ὑπὸ τὴν νεφέλην ἦσαν καὶ πάντες διὰ τῆς θαλάσσης διῆλθον,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/001.yaml
  text: For I do not want you to be unaware[a], brothers, that our fathers were all under the cloud, and all passed through the sea,
translation:
  language: fr
  text: 'Car je ne veux pas que vous l’ignoriez, frères et sœurs[a] : nos pères étaient tous sous la nuée et tous ont traversé la mer.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « frères » ; en grec, ce terme peut s’adresser à une assemblée comprenant des hommes et des femmes.'
    reason: Préciser la forme du texte source et la portée inclusive de l’adresse.
lexical_decisions:
- source_word: Οὐ θέλω ... ἀγνοεῖν
  choice: je ne veux pas que vous l’ignoriez
  rationale: Cette tournure naturelle en français conserve la formulation négative marquée de l’expression paulinienne, sans employer « être ignorants », plus dur et moins idiomatique.
- source_word: γὰρ
  choice: Car
  rationale: « Car » rend le lien explicatif avec l’argument précédent dans un registre digne et courant.
- source_word: ἀδελφοί
  choice: frères et sœurs
  rationale: Dans cette adresse à toute l’assemblée, le pluriel grec masculin peut inclure les femmes. La formulation explicite le référent collectif en français moderne, tandis que la note signale la forme grecque.
- source_word: οἱ πατέρες ἡμῶν
  choice: nos pères
  rationale: Cette traduction préserve le langage familial et l’identification rhétorique des croyants de Corinthe à l’histoire d’Israël, plutôt que de généraliser en « nos ancêtres ».
- source_word: πάντες
  choice: tous
  rationale: La répétition de πάντες est conservée aux deux endroits, car elle structure l’argument qui suit.
- source_word: ὑπὸ τὴν νεφέλην ἦσαν
  choice: ont tous été sous la nuée
  rationale: La formulation conserve l’image de la nuée de l’Exode et suit la valeur locative du grec.
- source_word: διὰ τῆς θαλάσσης διῆλθον
  choice: tous ont traversé la mer
  rationale: « Traverser la mer » exprime naturellement en français le mouvement à travers celle-ci, sans ajouter de précision absente du grec.
theological_decisions:
- issue: Portée du vocatif ἀδελφοί dans une adresse ecclésiale mixte
  choice: frères et sœurs
  alternative: frères
  rationale: Le mot grec est morphologiquement masculin pluriel, mais il sert ici à interpeller l’ensemble de l’Église. « Frères et sœurs » communique ce sens contextuel en français moderne, et la note préserve la transparence formelle.
- issue: Identification collective de l’Église incluant des non-Juifs avec Israël dans « nos pères »
  choice: nos pères
  alternative: nos ancêtres
  rationale: Le choix maintient la force familiale et théologique de l’expression de Paul sans expliquer ni réduire la tension créée par l’inclusion des Corinthiens dans cette histoire.
translation_notes:
  register: Français international moderne, naturel et digne. « Nuée » est conservé comme terme biblique précis et largement intelligible. La répétition de « tous » ainsi que la formulation « nos pères » maintiennent la progression rhétorique et la tension du grec.
