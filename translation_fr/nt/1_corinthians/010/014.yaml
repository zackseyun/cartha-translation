id: 1CO.10.14
reference: 1 Corinthians 10:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Διόπερ, ἀγαπητοί μου, φεύγετε ἀπὸ τῆς εἰδωλολατρίας.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/014.yaml
  text: Therefore[a], my beloved, flee from idolatry.
translation:
  language: fr
  text: C’est pourquoi, mes bien-aimés, fuyez l’idolâtrie[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le culte des idoles ».
    reason: Alternative lexicale qui explicite le sens concret d’εἰδωλολατρία.
lexical_decisions:
- source_word: Διόπερ
  choice: C’est pourquoi
  rationale: Conjonction déductive qui tire une conclusion de l’argument précédent; « C’est pourquoi » restitue clairement ce lien logique en français courant.
- source_word: ἀγαπητοί μου
  choice: mes bien-aimés
  rationale: Apostrophe affectueuse au vocatif; « mes bien-aimés » conserve la chaleur du lien et le registre paulinien tout en restant intelligible.
- source_word: φεύγετε
  choice: fuyez
  rationale: Impératif présent, deuxième personne du pluriel; « fuyez » exprime la vigueur et l’urgence de l’ordre d’éviter un danger.
- source_word: ἀπὸ
  choice: —
  rationale: La valeur de séparation est intégrée idiomatiquement à la construction française directe « fuir l’idolâtrie »; rendre séparément la préposition produirait ici une tournure moins naturelle.
- source_word: τῆς εἰδωλολατρίας
  choice: l’idolâtrie
  rationale: Le terme désigne le culte ou le service des idoles. « Idolâtrie » est l’équivalent français précis, concis et usuel; la note donne une formulation explicative.
theological_decisions:
- issue: Portée de l’interdiction
  choice: Un ordre direct de fuir l’idolâtrie, comprenant la participation au culte des idoles et aux pratiques qui lui sont associées
  alternative: Un avertissement plus étroit visant seulement un attachement intérieur aux idoles
  rationale: Dans le contexte immédiat, Paul met en garde contre la participation aux repas et aux pratiques cultuelles païennes. Le sens de εἰδωλολατρία ne permet pas de réduire l’avertissement à une disposition intérieure; le terme général « idolâtrie » préserve cette portée sans la préciser au-delà du grec.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation conserve l’enchaînement logique, la chaleur de l’adresse et la force de l’impératif. « Mes bien-aimés » maintient le registre biblique paulinien sans archaïsme syntaxique.
