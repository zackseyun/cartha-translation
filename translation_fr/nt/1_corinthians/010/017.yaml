  text: ὅτι εἷς ἄρτος, ἓν σῶμα οἱ πολλοί ἐσμεν, οἱ γὰρ πάντες ἐκ τοῦ ἑνὸς ἄρτου μετέχομεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/017.yaml
  text: Because there is one bread[a], we who are many are one body, for we all partake of the one bread.
translation:
  language: fr
  text: Puisqu’il y a un seul pain[a], nous qui sommes nombreux, nous sommes un seul corps, car nous avons tous part à cet unique pain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une seule miche », ici et à la fin du verset. Le grec ἄρτος peut désigner un pain considéré comme une unité concrète, ce qui peut renforcer l’image de plusieurs personnes partageant une même source.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Puisqu’il y a
  rationale: ὅτι introduit ici le fondement explicatif de l’affirmation. « Puisque » exprime naturellement cette valeur causale en français; l’ajout de « il y a » rend explicite la proposition nominale grecque.
- source_word: εἷς ἄρτος
  choice: un seul pain
  rationale: ἄρτος peut désigner le pain ou un pain concret. « Un seul pain » conserve la résonance du repas évoqué par le contexte et souligne l’unicité grâce à « seul », tandis que « une seule miche » reste une possibilité plus concrète.
- source_word: ἓν σῶμα
  choice: un seul corps
  rationale: « Corps » est l’équivalent direct de σῶμα et préserve à la fois la portée communautaire et la densité théologique de l’image, sans l’interpréter davantage.
- source_word: οἱ πολλοί ἐσμεν
  choice: nous qui sommes nombreux, nous sommes
  rationale: Cette formulation française rend le contraste marqué entre la pluralité des croyants et leur unité, tout en reprenant explicitement le sujet pour assurer une syntaxe naturelle.
- source_word: γὰρ
  choice: car
  rationale: γὰρ introduit l’explication de l’affirmation précédente; « car » maintient clairement ce rapport logique.
- source_word: οἱ πάντες
  choice: nous avons tous
  rationale: « Tous » souligne que l’ensemble du groupe participe au même pain; son intégration au sujet verbal donne une formulation idiomatique en français.
- source_word: ἐκ τοῦ ἑνὸς ἄρτου
  choice: à cet unique pain
  rationale: Avec μετέχω, ἐκ indique ce dont tous reçoivent une part ou la source commune de leur participation. « Avoir part à » est idiomatique en français, et « cet unique pain » reprend sans lourdeur le pain déjà mentionné.
- source_word: μετέχομεν
  choice: avons part
  rationale: « Avoir part à » exprime une participation réelle et commune, convient au contexte du repas et évite le registre plus technique de « participer à ».
theological_decisions:
- issue: Rapport entre l’unique pain et l’unique corps
  choice: Maintenir le lien causal établi par Paul entre le partage du pain et l’unité des croyants, sans préciser la nature ontologique de ce rapport.
  alternative: Accentuer soit une lecture principalement symbolique de l’unité, soit une lecture sacramentelle selon laquelle la communion est produite par le pain.
  rationale: Le grec relie étroitement le fait d’être un seul corps à la participation de tous à l’unique pain, mais la traduction ne doit pas trancher des débats doctrinaux ultérieurs que le verset ne formule pas explicitement.
translation_notes:
  register: Français moderne, international et digne. La répétition de « nous » clarifie la structure sans effacer le contraste entre le grand nombre et l’unique corps. « Cet unique pain » évite une répétition mécanique tout en conservant avec force l’idée d’unicité.
