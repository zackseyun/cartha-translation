  text: ⸀Πάντα ἔξεστιν· ἀλλ’ οὐ πάντα συμφέρει. ⸁πάντα ἔξεστιν· ἀλλ’ οὐ πάντα οἰκοδομεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/023.yaml
  text: “All things are permitted,” but not all things are beneficial[a]. “All things are permitted,” but not all things build up.
translation:
  language: fr
  text: « Tout est permis », mais tout n’est pas utile[a]. « Tout est permis », mais tout n’édifie pas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Tout est licite. » Le grec peut désigner ce qui est permis ou licite. Les guillemets indiquent que Paul reprend probablement une formule employée par les Corinthiens, mais cette ponctuation reste interprétative.'
    reason: Alternative lexicale et ambiguïté concernant la citation d’un slogan corinthien.
lexical_decisions:
- source_word: Πάντα
  choice: Tout
  rationale: Le neutre pluriel substantivé a ici une portée générale. En français, « tout » restitue naturellement la formule catégorique et permet d’en conserver la répétition.
- source_word: ἔξεστιν
  choice: est permis
  rationale: Le verbe désigne ce qui est permis ou licite. « Est permis » est clair, actuel et moins juridique que « est licite ».
- source_word: ἀλλ’
  choice: mais
  rationale: Cette conjonction adversative simple marque directement la restriction apportée à la formule répétée.
- source_word: συμφέρει
  choice: est avantageux
  rationale: Le verbe exprime ce qui est profitable, utile ou bénéfique. « Avantageux » conserve l’idée d’un réel intérêt sans la limiter au domaine financier.
- source_word: οἰκοδομεῖ
  choice: est constructif
  rationale: Le verbe signifie littéralement « bâtir » et, métaphoriquement, contribuer à l’affermissement d’autrui ou de la communauté. « Est constructif » garde en français courant l’image sous-jacente de la construction, sans introduire un complément absent du grec.
theological_decisions:
- issue: La formule Πάντα ἔξεστιν est-elle une citation d’un slogan corinthien ?
  choice: La placer entre guillemets comme une formule que Paul reprend et nuance.
  alternative: Ne pas employer de guillemets et lire toute la phrase comme une affirmation directe de Paul.
  rationale: La répétition et les restrictions introduites par « mais » appuient fortement la lecture d’un slogan repris par Paul. Toutefois, les manuscrits grecs ne comportaient pas les guillemets modernes ; la note signale donc le caractère interprétatif de cette ponctuation.
translation_notes:
  register: Français international moderne, concis et digne. La structure parallèle et la répétition de « Tout est permis » sont conservées. « Est constructif » rend la métaphore de l’édification dans une expression immédiatement compréhensible.
