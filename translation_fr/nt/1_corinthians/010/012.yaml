  text: ὥστε ὁ δοκῶν ἑστάναι βλεπέτω μὴ πέσῃ,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/012.yaml
  text: Therefore[a], let the one who thinks he stands watch out lest he fall.
translation:
  language: fr
  text: Ainsi donc[a], que celui qui pense être debout prenne garde de ne pas tomber.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « C’est pourquoi, que celui qui pense être debout prenne garde de ne pas tomber. »'
    reason: Variante lexicale possible pour rendre la valeur déductive de ὥστε.
lexical_decisions:
- source_word: ὥστε
  choice: Ainsi donc
  rationale: La conjonction introduit la conclusion tirée des exemples d’avertissement précédents. « Ainsi donc » exprime clairement cette valeur déductive en français naturel.
- source_word: ὁ δοκῶν
  choice: celui qui pense
  rationale: Le participe présent substantivé désigne une personne représentative au singulier. « Celui qui pense » conserve aussi la possibilité que son assurance ne corresponde pas à la réalité.
- source_word: ἑστάναι
  choice: être debout
  rationale: L’infinitif parfait décrit l’état dans lequel la personne estime se trouver. « Être debout » garde l’image du texte grec sans ajouter l’idée plus précise de fermeté.
- source_word: βλεπέτω
  choice: prenne garde
  rationale: L’impératif présent appelle à une vigilance continue. « Prendre garde » est une formulation française actuelle, claire et adaptée au ton solennel de l’avertissement.
- source_word: μὴ πέσῃ
  choice: de ne pas tomber
  rationale: La négation μή avec le subjonctif aoriste, après l’impératif, exprime ici le résultat redouté ou le but négatif. Cette formulation est idiomatique et conserve la portée générale de la chute.
theological_decisions:
- issue: Nature de la « chute » dans l’avertissement de Paul
  choice: Conserver le verbe général « tomber » sans préciser la nature de la chute.
  alternative: Tomber dans le péché ; tomber sous le jugement ; abandonner la foi.
  rationale: Le contexte évoque les fautes d’Israël et met en garde contre l’excès de confiance, mais πέσῃ ne précise pas à lui seul s’il s’agit d’une faute morale, d’un jugement ou d’un abandon de la foi. La traduction préserve donc cette tension.
- issue: Expression représentative au masculin singulier
  choice: Employer « celui qui » et maintenir le singulier représentatif.
  alternative: Employer une formulation plurielle ou épicène.
  rationale: Le grec est au masculin singulier et fonctionne de manière représentative. Le français « celui qui » reproduit cette forme sans exclure la portée générale de l’avertissement.
translation_notes:
  register: Français international moderne, digne et direct. L’image coordonnée « être debout / tomber » est conservée, tandis que « prenne garde » restitue la force de l’impératif sans archaïsme marqué.
