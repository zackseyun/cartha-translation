  yaml_path: translation/nt/1_corinthians/010/024.yaml
  text: Let no one seek his own good[a], but that of the other person.
translation:
  language: fr
  text: Que personne ne cherche son propre intérêt[a], mais celui de l’autre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « Que personne ne cherche ce qui est à lui, mais ce qui est à l’autre. »'
    reason: Alternative lexicale signalant l’ellipse présente dans le grec.
lexical_decisions:
- source_word: μηδεὶς
  choice: Que personne ne
  rationale: Avec l’impératif ζητείτω, le pronom négatif exprime une interdiction générale. « Que personne ne… » en rend naturellement la force en français.
- source_word: ζητείτω
  choice: cherche
  rationale: ζητέω signifie couramment « chercher » ou « poursuivre ». « Chercher » conserve ici la simplicité et l’étendue sémantique du verbe grec.
- source_word: τὸ ἑαυτοῦ
  choice: son propre intérêt
  rationale: Le groupe nominal neutre est elliptique, littéralement « ce qui est à soi ». Dans ce contexte, « son propre intérêt » explicite sobrement l’idée d’avantage personnel sans la réduire aux biens matériels.
- source_word: ἀλλὰ
  choice: mais
  rationale: Conjonction adversative simple opposant la recherche de son propre intérêt à celle de l’intérêt d’autrui.
- source_word: τὸ τοῦ ἑτέρου
  choice: celui de l’autre
  rationale: Cette expression est elle aussi elliptique. « Celui » reprend « intérêt », tandis que « l’autre » conserve le contraste grec entre soi-même et une autre personne.
theological_decisions:
- issue: Explicitation de l’objet sous-entendu dans τὸ ἑαυτοῦ / τὸ τοῦ ἑτέρου
  choice: « son propre intérêt… celui de l’autre »
  alternative: « ce qui est à lui… ce qui est à l’autre » ou « son propre bien… celui de l’autre »
  rationale: Le grec laisse l’objet implicite. Le contexte de 1 Corinthiens 10.23-33 oppose l’avantage personnel au bien recherché pour autrui. « Intérêt » exprime cette orientation éthique tout en conservant une note qui signale la formulation plus littérale.
translation_notes:
  register: Français international moderne, naturel et digne. La tournure exhortative « Que personne ne… » garde la force de l’impératif grec; « l’autre » désigne clairement autrui sans alourdir la phrase.
