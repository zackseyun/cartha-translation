id: 1CO.10.20
reference: 1 Corinthians 10:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀλλ’ ὅτι ἃ ⸀θύουσιν, δαιμονίοις ⸂καὶ οὐ θεῷ θύουσιν⸃, οὐ θέλω δὲ ὑμᾶς κοινωνοὺς τῶν δαιμονίων γίνεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/020.yaml
  text: No[a], but what they sacrifice, they sacrifice to demons and not to God, and I do not want you to become sharers with demons.
translation:
  language: fr
  text: Non, mais ce qu’ils sacrifient, ils le sacrifient à des démons et non à Dieu. Or, je ne veux pas que vous deveniez associés aux démons.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « participants avec les démons » ou « en communion avec les démons ».
    reason: Alternative lexicale pour rendre la dimension relationnelle et participative de κοινωνούς.
lexical_decisions:
- source_word: ἀλλ’ ὅτι
  choice: Non, mais
  rationale: Dans le contexte, Paul corrige une déduction possible du verset précédent. Cette tournure française exprime naturellement la valeur adversative et corrective.
- source_word: ἃ θύουσιν
  choice: ce qu’ils sacrifient
  rationale: Le relatif neutre désigne globalement les offrandes sacrificielles sans les préciser davantage.
- source_word: θύουσιν
  choice: ils le sacrifient
  rationale: Le verbe a ici son sens cultuel d’offrir en sacrifice; le pronom « le » reprend naturellement « ce que » en français.
- source_word: δαιμονίοις
  choice: à des démons
  rationale: Dans l’usage néotestamentaire et dans ce contraste, le terme désigne des démons, et non de simples divinités secondaires neutres.
- source_word: καὶ οὐ θεῷ
  choice: et non à Dieu
  rationale: Le contexte monothéiste oppose les démons au vrai Dieu; l’absence d’article en grec n’impose pas « un dieu ».
- source_word: οὐ θέλω δὲ
  choice: Or, je ne veux pas
  rationale: δέ fait progresser l’argument avec une légère transition. « Or » rend cette articulation sans introduire une opposition trop forte.
- source_word: κοινωνοὺς
  choice: participants
  rationale: Le mot exprime une participation ou une mise en commun réelle. « Participants » est naturel et conserve la gravité relationnelle du contexte.
- source_word: τῶν δαιμονίων
  choice: avec les démons
  rationale: Après κοινωνούς, le génitif indique ceux avec qui la participation est partagée; « avec » est l’expression idiomatique française.
- source_word: γίνεσθαι
  choice: que vous deveniez
  rationale: Le verbe souligne l’entrée dans un état, et non simplement le fait de s’y trouver déjà.
theological_decisions:
- issue: Nature du culte sacrificiel païen
  choice: Paul affirme que ces sacrifices sont offerts à des démons et non à Dieu.
  alternative: Comprendre les démons comme une simple métaphore ou réduire l’énoncé à la portée sociale des repas idolâtres.
  rationale: Le contraste explicite du grec doit être conservé sans l’atténuer ni ajouter de spéculation sur la nature de ces êtres.
- issue: Portée de κοινωνοὺς τῶν δαιμονίων
  choice: Une participation ou association réelle avec les démons.
  alternative: Une simple fréquentation sociale des idolâtres, ou au contraire une allégeance totale et explicitement cultuelle aux démons.
  rationale: Le vocabulaire de κοινωνία dans le contexte exprime une participation véritable, sans que le verset définisse celle-ci comme une allégeance totale.
translation_notes:
  register: Français international moderne, naturel et digne. La répétition de « sacrifier » conserve l’insistance du grec. « Des démons » à la première occurrence puis « les démons » dans la reprise suit l’usage idiomatique français sans modifier le référent.
