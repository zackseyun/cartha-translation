source:
  edition: SBLGNT
  text: μηδὲ γογγύζετε, ⸀καθάπερ τινὲς αὐτῶν ἐγόγγυσαν, καὶ ἀπώλοντο ὑπὸ τοῦ ὀλοθρευτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/010.yaml
  text: And do not grumble[a], just as some of them grumbled and were destroyed by the destroyer.
translation:
  language: fr
  text: Ne murmurez pas non plus, comme certains d’entre eux ont murmuré et ont été détruits par le destructeur[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « par l’ange exterminateur ». Le grec dit « le destructeur » et peut faire allusion à l’agent destructeur intervenu lors des jugements contre Israël au désert.'
    reason: alternative_reading
lexical_decisions:
- source_word: μηδὲ
  choice: Ne… pas non plus
  rationale: Dans cette série de mises en garde, μηδέ relie cette interdiction aux précédentes. « Ne… pas non plus » rend ce lien de façon naturelle en français.
- source_word: γογγύζετε / ἐγόγγυσαν
  choice: murmurez / l’ont fait
  rationale: « Murmurer » exprime ici une plainte mécontente et récalcitrante, avec l’écho des murmures d’Israël au désert. La reprise « l’ont fait » évite une répétition lourde tout en conservant clairement le même acte.
- source_word: καθάπερ
  choice: comme
  rationale: « Comme » marque naturellement la comparaison avec l’exemple d’Israël; le renforcement de καθάπερ ressort suffisamment du contexte d’avertissement.
- source_word: τινὲς αὐτῶν
  choice: certains d’entre eux
  rationale: Rend directement l’expression partitive qui désigne certains des Israélites évoqués dans le contexte.
- source_word: ἀπώλοντο
  choice: furent anéantis
  rationale: Le verbe exprime leur perte sous l’action de l’agent nommé ensuite. « Furent anéantis » conserve cette action extérieure sans l’inélégante répétition « détruits par le destructeur ».
- source_word: ὑπὸ τοῦ ὀλοθρευτοῦ
  choice: par le destructeur
  rationale: Le grec emploie le substantif « le destructeur » sans préciser explicitement qu’il s’agit d’un ange. La traduction garde cette désignation ouverte.
theological_decisions:
- issue: Identité de ὁ ὀλοθρευτής
  choice: le destructeur
  alternative: l’ange exterminateur
  rationale: Le texte nomme un agent destructeur sans définir davantage son identité. Le texte principal préserve cette indétermination, tandis que l’identification plus explicite à un ange est signalée en note.
translation_notes:
  register: Français moderne, digne et accessible. « Murmurer » reste courant et conserve l’écho biblique des plaintes d’Israël au désert. Le passé simple « furent anéantis » convient au registre narratif soutenu de ce bref rappel historique.
