- from: Ne murmurez pas non plus, comme certains d’entre eux l’ont fait et furent anéantis par le destructeur[a].
  to: Ne murmurez pas non plus, comme certains d’entre eux ont murmuré et ont été détruits par le destructeur[a].
  rationale: La révision rétablit la répétition verbale présente dans le grec, emploie une expression de destruction plus directement correspondante et conserve l’ambiguïté quant à l’identité du destructeur. La note présente l’interprétation angélique comme une alternative sans l’imposer.
  reviewer_model: gpt-5.6-terra
