translation:
  language: fr
  text: Si je mange avec reconnaissance[a], pourquoi suis-je décrié à cause de ce pour quoi je rends grâce ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Si je mange par grâce, pourquoi suis-je décrié à cause de ce pour quoi je rends grâce ? » Le grec traduit par « avec reconnaissance » peut aussi signifier « par grâce ». Dans ce contexte, beaucoup comprennent qu’il s’agit de reconnaissance, en raison de l’expression suivante : « je rends grâce ».'
    reason: Alternative lexicale authentique pour χάριτι ; la formulation principale et l’alternative évitent d’expliciter un destinataire non nommé par le grec.
lexical_decisions:
- source_word: χάριτι
  choice: avec reconnaissance
  rationale: Dans ce contexte de nourriture, le datif exprime vraisemblablement la disposition reconnaissante qui accompagne le fait de manger; le verbe εὐχαριστῶ qui suit appuie ce sens.
- source_word: μετέχω
  choice: je prends part au repas
  rationale: Le verbe signifie «avoir part, participer». L'ajout contextuel «au repas» rend en français naturel le sens alimentaire sans préciser un aliment absent du grec.
- source_word: βλασφημοῦμαι
  choice: suis-je critiqué
  rationale: Appliqué ici à Paul, le verbe désigne des paroles hostiles ou désobligeantes à son sujet, non un blasphème au sens strict contre Dieu.
- source_word: ὑπὲρ οὗ
  choice: pour ce dont
  rationale: Cette formulation exprime la raison de la critique et s'articule naturellement avec «remercier de» en français.
- source_word: εὐχαριστῶ
  choice: je remercie Dieu
  rationale: Le verbe signifie «rendre grâce, remercier». En contexte de bénédiction alimentaire, Dieu est le destinataire implicite; le préciser évite l'expression française incomplète «ce dont je rends grâce».
- source_word: τί
  choice: pourquoi
  rationale: Dans cette question rhétorique, τί demande la raison.
theological_decisions:
- issue: Sens de χάριτι dans le contexte du repas
  choice: reconnaissance
  alternative: grâce
  rationale: Le rapprochement immédiat avec εὐχαριστῶ favorise l'idée de gratitude. La note conserve toutefois la possibilité lexicale de «grâce» sans lui imposer ici un sens sotériologique.
- issue: Destinataire implicite de l'action de grâce
  choice: Dieu explicité en français
  alternative: laisser le destinataire non exprimé
  rationale: Dieu est le destinataire naturel de l'action de grâce dans le contexte, et son explicitation produit une phrase française claire sans modifier la portée théologique du propos.
translation_notes:
  register: Français international moderne, digne et accessible. « Prendre part au repas » est plus naturel ici que « participer » employé absolument. « Critiqué » transmet clairement l'hostilité verbale sans la connotation religieuse trompeuse de « blasphémé ».
