id: 1CO.10.16
reference: 1 Corinthians 10:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τὸ ποτήριον τῆς εὐλογίας ὃ εὐλογοῦμεν, οὐχὶ κοινωνία ⸂ἐστὶν τοῦ αἵματος τοῦ Χριστοῦ⸃; τὸν ἄρτον ὃν κλῶμεν, οὐχὶ κοινωνία τοῦ σώματος τοῦ Χριστοῦ ἐστιν;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/016.yaml
  text: The cup of blessing that we bless—is it not a sharing in the blood of Messiah? The bread that we break—is it not a sharing in the body of Messiah?[a][b]
translation:
  language: fr
  text: La coupe de bénédiction que nous bénissons, n’est-elle pas une participation[a] au sang du Messie ? Le pain que nous rompons, n’est-il pas une participation au corps du Messie[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « communion avec » ou « fait d’avoir part à ».
    reason: lexical_alternative
  - marker: b
    text: 'Grec Christou, c’est-à-dire « du Messie » ; traduction traditionnelle : « du Christ ».'
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ ποτήριον
  choice: la coupe
  rationale: « Coupe » est le terme courant et digne en français moderne; « calice » introduirait un registre liturgique ultérieur que le grec n’impose pas.
- source_word: τῆς εὐλογίας
  choice: de bénédiction
  rationale: Ce rendu direct conserve le substantif grec εὐλογία ainsi que l’éventuel arrière-plan du repas juif, sans le réduire à la seule action de grâce.
- source_word: ὃ εὐλογοῦμεν
  choice: que nous bénissons
  rationale: La traduction conserve la répétition entre « bénédiction » et « bénissons », importante dans la formulation grecque.
- source_word: οὐχὶ
  choice: n’est-elle pas / n’est-il pas
  rationale: La forme interrogative française préserve la question rhétorique grecque, qui appelle une réponse affirmative.
- source_word: κοινωνία
  choice: participation à
  rationale: « Participation à » exprime le fait d’avoir part au sang et au corps sans réduire le propos à une simple association sociale ni imposer une théorie confessionnelle précise de la présence eucharistique.
- source_word: τοῦ αἵματος
  choice: au sang
  rationale: Le rendu direct maintient la portée sacrificielle et covenantale du terme sans ajout interprétatif.
- source_word: τοῦ Χριστοῦ
  choice: du Messie
  rationale: Χριστός garde ici sa valeur de titre, celui de l’Oint; « Messie » rend cette valeur explicitement en français.
- source_word: τὸν ἄρτον
  choice: le pain
  rationale: « Pain » est le rendu français naturel et n’impose pas la précision « miche », que ce verset ne requiert pas.
- source_word: ὃν κλῶμεν
  choice: que nous rompons
  rationale: « Rompre le pain » est une expression française établie qui conserve l’action concrète exprimée par le grec.
- source_word: τοῦ σώματος
  choice: au corps
  rationale: Le rendu direct préserve tout le poids christologique et eucharistique de l’expression sans en préciser doctrinalement le mode.
theological_decisions:
- issue: Sens de κοινωνία dans le contexte du repas du Seigneur
  choice: participation à
  alternative: communion avec; fait d’avoir part à
  rationale: Le texte affirme une relation réelle au sang et au corps du Messie, mais ne définit pas ici le mode de cette participation. « Participation à » garde cette force et la tension théologique sans trancher les débats confessionnels.
- issue: Rendu de Χριστός
  choice: Messie
  alternative: Christ
  rationale: Dans cette formulation, Χριστός désigne l’Oint et conserve une valeur titulaire. « Messie » rend cette valeur, tandis que « Christ » reste l’équivalent traditionnel signalé en note.
translation_notes:
  register: Français international moderne, naturel et digne. La structure parallèle des deux questions rhétoriques est conservée, de même que la répétition « bénédiction / bénissons ». Le choix de « participation » évite à la fois un affaiblissement purement symbolique et l’importation d’une terminologie sacramentelle confessionnelle trop précise.
