lexical_decisions:
- source_word: καὶ
  choice: et
  rationale: Conjonction de coordination ordinaire qui relie ce verset à l’énoncé précédent.
- source_word: πάντες
  choice: tous
  rationale: Conserve l’insistance sur la totalité du groupe d’Israël sans ajouter de pronom explicite.
- source_word: τὸ αὐτὸ
  choice: la même
  rationale: Rend naturellement l’idée d’identité exprimée par l’article suivi de αὐτό.
- source_word: πνευματικὸν
  choice: spirituelle
  rationale: Équivalent direct qui préserve la portée paulinienne et son ambiguïté, sans réduire l’expression à « surnaturelle » ni préciser « donnée par l’Esprit ».
- source_word: βρῶμα
  choice: nourriture
  rationale: Terme français courant et digne qui désigne ici la nourriture de manière générale.
- source_word: ἔφαγον
  choice: ont mangé
  rationale: Passé composé naturel en français moderne pour rapporter cette action passée dans le fil du discours.
theological_decisions:
- issue: Sens de « nourriture spirituelle » dans la typologie du désert
  choice: Maintenir « nourriture spirituelle » dans le texte principal, sans préciser qu’il s’agit de la manne ni expliciter un lien sacramentel.
  alternative: « nourriture surnaturelle », « nourriture donnée par l’Esprit », ou mention explicite de la manne ou de la cène
  rationale: Le contexte évoque vraisemblablement la manne et peut avoir une portée typologique, mais la formulation retenue préserve l’expression de Paul ainsi que sa tension théologique sans imposer une interprétation plus étroite.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe reste proche du grec tout en employant le passé composé, plus idiomatique ici que le passé simple.
