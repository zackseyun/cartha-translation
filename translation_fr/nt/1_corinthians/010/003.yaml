  text: et tous ont mangé la même nourriture spirituelle[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « nourriture surnaturelle » ; cette expression fait probablement allusion à la manne dans le désert et peut avoir ici une portée typologique.
