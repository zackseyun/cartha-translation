    issue: Périphrase de ηὐδόκησεν
    rationale: « N’a pas trouvé bon d’accorder sa faveur » ajoute l’idée d’une concession ou d’un octroi de faveur et affaiblit le rendu direct de « n’a pas été satisfait de / n’a pas pris plaisir en ». Le grec exprime ici la désapprobation de Dieu à l’égard de la plupart.
  - severity: low
    issue: Formulation de la note lexicale
    rationale: « Ont jonché le sol » ne constitue pas une alternative française bien parallèle pour le passif grec appliqué aux personnes. Des formulations comme « ont été étendus à terre » et « ont été renversés » rendent plus clairement l’image et la gamme sémantique.
  revised_text: Pourtant, Dieu n’a pas été satisfait de la plupart d’entre eux, car ils ont été abattus[a] dans le désert.
