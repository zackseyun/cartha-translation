source:
  edition: SBLGNT
  text: ἀλλ’ οὐκ ἐν τοῖς πλείοσιν αὐτῶν ηὐδόκησεν ὁ θεός, κατεστρώθησαν γὰρ ἐν τῇ ἐρήμῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/005.yaml
  text: Nevertheless[a], God was not pleased with most of them, for they were struck down in the wilderness.
translation:
  language: fr
  text: Pourtant, Dieu n’a pas été satisfait de la plupart d’entre eux, car ils ont été abattus[a] dans le désert.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ont été étendus à terre » ou « ont été renversés » dans le désert.
    reason: Alternative lexicale préservant l’image concrète de κατεστρώθησαν.
lexical_decisions:
- source_word: ἀλλ’
  choice: Pourtant
  rationale: Marque nettement le contraste avec les privilèges communs évoqués aux versets précédents, dans un français naturel.
- source_word: οὐκ ἐν τοῖς πλείοσιν αὐτῶν ηὐδόκησεν ὁ θεός
  choice: Dieu n’a pas trouvé bon d’accorder sa faveur à la plupart d’entre eux
  rationale: L’expression rend l’idée de εὐδοκέω construit avec ἐν sans suggérer une simple émotion divine; «la plupart» conserve la portée quantitative de τοῖς πλείοσιν.
- source_word: κατεστρώθησαν
  choice: ils ont été abattus
  rationale: Le verbe évoque des personnes étendues à terre, mortes dans le désert. «Abattus» conserve à la fois l’image et la force du jugement, tandis que la note signale des rendus plus littéraux.
- source_word: γὰρ
  choice: car
  rationale: Introduit de façon concise l’explication de la défaveur divine.
- source_word: ἐν τῇ ἐρήμῳ
  choice: dans le désert
  rationale: Dans le contexte de l’Exode et de l’errance d’Israël, «désert» est le terme français courant et évocateur.
theological_decisions:
- issue: Sens de la défaveur exprimée par ηὐδόκησεν
  choice: «n’a pas trouvé bon d’accorder sa faveur»
  alternative: «n’a pas pris plaisir» ou «n’a pas été satisfait»
  rationale: Ce rendu exprime la non-approbation de Dieu sans réduire le propos à un état affectif ni préciser au-delà du grec les motifs de son jugement.
- issue: Nature du jugement décrit par κατεστρώθησαν
  choice: Une mort sous le jugement de Dieu, exprimée par «ont été abattus»
  alternative: L’image plus neutre de corps «étendus» ou «jonchant le sol» dans le désert
  rationale: Le contexte d’avertissement présente la mort de la génération du désert comme la conséquence de la défaveur divine. La note maintient toutefois visible l’image lexicale du verbe.
translation_notes:
  register: Français international moderne, digne et accessible. «Pourtant» porte le contraste; «désert» correspond à l’usage biblique français courant. La formulation évite un calque maladroit de la construction grecque tout en conservant sa tension théologique.
