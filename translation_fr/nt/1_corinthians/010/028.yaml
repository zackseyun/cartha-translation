  text: ἐὰν δέ τις ὑμῖν εἴπῃ· Τοῦτο ⸀ἱερόθυτόν ἐστιν, μὴ ἐσθίετε δι’ ἐκεῖνον τὸν μηνύσαντα καὶ τὴν ⸀συνείδησιν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/028.yaml
  text: But if someone says to you, “This has been offered in sacrifice,” do not eat it, for the sake of the one who informed you and for conscience’ sake.
translation:
  language: fr
  text: 'Mais si quelqu’un vous dit : « Ceci a été offert en sacrifice[a] », n’en mangez pas, par égard pour celui qui vous en a informés et pour la conscience[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ceci est de la viande sacrificielle. » L’adjectif grec désigne quelque chose qui a été offert en sacrifice.'
    reason: lexical_alternative
  - marker: b
    text: Il s’agit de la conscience de l’autre personne, et non de la vôtre ; voir le verset suivant.
    reason: cross_reference
lexical_decisions:
- source_word: ἐὰν δέ τις ὑμῖν εἴπῃ
  choice: Mais si quelqu’un vous dit
  rationale: ἐὰν avec le subjonctif aoriste introduit une éventualité; τις reste indéfini avec « quelqu’un ». δέ marque le contraste avec le cas envisagé auparavant.
- source_word: Τοῦτο ἱερόθυτόν ἐστιν
  choice: Ceci a été offert en sacrifice
  rationale: ἱερόθυτος désigne ce qui a été offert lors d’un sacrifice. La tournure verbale française est naturelle et n’ajoute pas explicitement l’idée d’« idole », absente de ce terme précis.
- source_word: μὴ ἐσθίετε
  choice: n’en mangez pas
  rationale: Le présent impératif avec μή exprime l’interdiction. Le pronom « en » reprend naturellement en français la nourriture dont il est question.
- source_word: δι’ ἐκεῖνον τὸν μηνύσαντα
  choice: par égard pour celui qui vous en a informés
  rationale: διά avec l’accusatif indique ici le motif ou la considération due à cette personne. μηνύω signifie faire savoir ou informer; « en » explicite naturellement le contenu déjà mentionné.
- source_word: καὶ τὴν συνείδησιν
  choice: et pour sa conscience
  rationale: La coordination elliptique reprend l’idée de considération exprimée par διά. « Sa » identifie la conscience comme celle de l’informateur, conformément à l’explication immédiate du verset suivant.
theological_decisions:
- issue: À qui appartient la conscience mentionnée par τὴν συνείδησιν ?
  choice: La conscience de l’autre personne, celle qui a donné l’information.
  alternative: La conscience de celui qui mange, ou une référence volontairement non précisée à la conscience.
  rationale: Le verset suivant précise qu’il ne s’agit pas de la conscience du destinataire, mais de celle de l’autre. Le possessif français évite une expression artificielle tout en suivant cette clarification contextuelle immédiate.
translation_notes:
  register: Français international moderne, clair et digne. « Par égard pour » exprime naturellement le motif éthique; « informés » s’accorde avec le pluriel de « vous » dans l’adresse à la communauté.
