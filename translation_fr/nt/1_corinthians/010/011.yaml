  text: ταῦτα ⸀δὲ ⸂τυπικῶς συνέβαινεν⸃ ἐκείνοις, ἐγράφη δὲ πρὸς νουθεσίαν ἡμῶν, εἰς οὓς τὰ τέλη τῶν αἰώνων ⸀κατήντηκεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/011.yaml
  text: These things happened to them as examples[a], but they were written for our instruction[c][b], on whom the ends of the ages have come.
translation:
  language: fr
  text: Ces choses leur arrivaient à titre d’exemples[a], mais cela a été écrit pour notre instruction[b], nous que les fins des âges ont atteints[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « comme des figures » ou « de manière typologique » : Paul présente ces événements comme des modèles ayant une portée instructive pour les croyants des générations suivantes.'
    reason: lexical_alternative
  - marker: b
    text: Ou « pour notre avertissement » ou « pour nous mettre en garde » ; le terme grec associe instruction corrective et avertissement.
    reason: lexical_alternative
  - marker: c
    text: 'Ou « la fin des âges est arrivée ». Le grec emploie littéralement le pluriel : « les fins des âges ».'
    reason: alternative_reading
lexical_decisions:
- source_word: τυπικῶς
  choice: comme des exemples
  rationale: L’adverbe présente ces événements comme des modèles porteurs d’une signification instructive. « Comme des exemples » est clair en français moderne, tandis que « typologiquement » serait plus technique.
- source_word: συνέβαινεν
  choice: arrivaient
  rationale: L’imparfait grec évoque des faits qui se produisaient dans le passé; l’imparfait français en conserve naturellement l’aspect.
- source_word: ἐκείνοις
  choice: leur
  rationale: Le pronom renvoie à la génération du désert évoquée dans le contexte. « Leur arrivaient » rend simplement le datif.
- source_word: ἐγράφη
  choice: elles ont été mises par écrit
  rationale: La tournure explicite que ces événements ont été consignés dans l’Écriture. Le pluriel français reprend naturellement « ces choses », malgré le verbe grec au singulier avec un sujet neutre pluriel.
- source_word: πρὸς νουθεσίαν ἡμῶν
  choice: pour nous avertir
  rationale: νουθεσία désigne une instruction corrective qui comporte une mise en garde. « Pour nous avertir » convient au contexte immédiat et reste naturel, sans exclure la dimension pédagogique signalée en note.
- source_word: εἰς οὓς
  choice: nous sur qui
  rationale: 'Cette formulation conserve la direction de l’image grecque: la réalité eschatologique est arrivée sur les destinataires. Sa légère singularité prépare l’expression inhabituelle qui suit.'
- source_word: τὰ τέλη τῶν αἰώνων
  choice: les fins des âges
  rationale: Le pluriel des deux noms est conservé afin de ne pas réduire la formulation de Paul à « la fin du monde » ou à une seule époque.
- source_word: κατήντηκεν
  choice: sont arrivées
  rationale: Le parfait grec exprime une arrivée accomplie dont les effets demeurent présents. Le passé composé français communique naturellement cette pertinence actuelle.
theological_decisions:
- issue: La formulation relative à l’accomplissement de l’histoire du salut (τὰ τέλη τῶν αἰώνων)
  choice: sont arrivées les fins des âges
  alternative: est arrivée la fin des âges; est venu l’accomplissement des âges
  rationale: Le texte garde les pluriels et l’image de l’arrivée sans expliquer davantage leur rapport. Il préserve ainsi la tension eschatologique de Paul au lieu de la résoudre dans la traduction.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve volontairement l’expression inhabituelle « les fins des âges » ainsi que « sur qui », afin de respecter l’image et la tension du grec; les notes proposent les formulations françaises plus courantes.
