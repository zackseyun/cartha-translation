  text: τοῦ ⸂κυρίου γὰρ⸃ ἡ γῆ καὶ τὸ πλήρωμα αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/026.yaml
  text: For the earth is the Lord’s[a], and all that fills it.
translation:
  language: fr
  text: Car la terre appartient au Seigneur, ainsi que tout ce qu’elle contient.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Citation du Psaume 24.1. Plus littéralement : « la terre est au Seigneur, ainsi que tout ce qui la remplit ».'
    reason: cross_reference
lexical_decisions:
- source_word: κυρίου
  choice: au Seigneur
  rationale: Le génitif τοῦ κυρίου exprime ici l’appartenance. « appartient au Seigneur » est naturel en français et conserve le titre théologique κύριος sans introduire la graphie « Éternel », propre à certaines traductions de YHWH.
- source_word: γάρ
  choice: Car
  rationale: γάρ introduit le fondement scripturaire de l’argument précédent. « Car » rend clairement et sobrement ce lien explicatif.
- source_word: γῆ
  choice: la terre
  rationale: Dans cette citation du Psaume 24.1, γῆ désigne la terre dans son ensemble plutôt qu’un territoire particulier.
- source_word: πλήρωμα
  choice: tout ce qu’elle contient
  rationale: τὸ πλήρωμα αὐτῆς désigne ici l’ensemble de ce qui remplit ou peuple la terre. Cette formulation idiomatique transmet le sens sans l’expression française peu naturelle « sa plénitude ».
- source_word: αὐτῆς
  choice: elle
  rationale: Le pronom féminin renvoie à « la terre » et s’intègre naturellement dans « tout ce qu’elle contient ».
theological_decisions:
- issue: Rendu de κύριος dans une citation scripturaire à portée théologique
  choice: Seigneur
  alternative: Éternel
  rationale: Paul emploie κύριος. « Seigneur » respecte directement le texte grec du Nouveau Testament, tout en évitant d’importer dans cette citation la convention française qui rend parfois le tétragramme hébreu par « l’Éternel ».
translation_notes:
  register: Français international moderne, digne et accessible. La tournure possessive grecque est explicitée par « appartient au Seigneur »; « tout ce qu’elle contient » privilégie une expression française naturelle tout en préservant la portée universelle de la citation.
