  text: καὶ πάντες εἰς τὸν Μωϋσῆν ⸀ἐβαπτίσαντο ἐν τῇ νεφέλῃ καὶ ἐν τῇ θαλάσσῃ,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/002.yaml
  text: and all were baptized into Moses in the cloud and in the sea[b][a],
translation:
  language: fr
  text: Et tous ont été baptisés en Moïse[a], dans la nuée et dans la mer[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « unis à Moïse », « rattachés à Moïse » ou « pour appartenir à Moïse ». Le grec dit littéralement « en Moïse », ce qui préserve le parallèle typologique établi par Paul avec le baptême.
    reason: alternative_reading
  - marker: b
    text: Paul dit « dans la mer », et non « à travers la mer », maintenant ainsi le parallèle avec « dans la nuée ».
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντες
  choice: tous
  rationale: Le pluriel désigne collectivement tous les Israélites concernés et maintient l'insistance répétée de Paul sur « tous » dans le contexte.
- source_word: εἰς τὸν Μωϋσῆν
  choice: en Moïse
  rationale: Cette formulation inhabituelle mais intelligible conserve la construction grecque et le parallèle typologique avec le langage du baptême, sans réduire le sens à l'adhésion ou à l'identification.
- source_word: ἐβαπτίσαντο
  choice: ont été baptisés
  rationale: Le moyen aoriste se rend naturellement ici par une tournure passive en français. Le terme consacré « baptisés » préserve l'emploi typologique de Paul sans imposer l'idée plus étroite d'immersion.
- source_word: ἐν τῇ νεφέλῃ
  choice: dans la nuée
  rationale: « Dans » conserve ἐν et son ambiguïté possible de sphère, de moyen ou d'association; « nuée » convient au registre biblique digne et au motif de l'Exode.
- source_word: ἐν τῇ θαλάσσῃ
  choice: dans la mer
  rationale: Paul emploie ἐν, en parallèle exact avec « dans la nuée »; traduire « à travers la mer » expliciterait le récit au détriment de sa formulation.
theological_decisions:
- issue: Sens du baptême d'Israël « en Moïse »
  choice: Conserver « en Moïse », avec une note présentant des formulations explicatives possibles.
  alternative: « unis à Moïse », « rattachés à Moïse » ou « pour appartenir à Moïse »
  rationale: Paul établit un parallèle typologique entre l'expérience de l'Exode et le baptême chrétien. La traduction maintient la tension représentative et relationnelle du texte sans arrêter une interprétation doctrinale unique.
translation_notes:
  register: Français international moderne, naturel et digne. « Nuée » est retenu plutôt que « nuage » pour reconnaître le motif narratif bien établi de l'Exode, tandis que la syntaxe reste simple. Les marqueurs suivent les expressions qu'ils éclairent et figurent tous dans le texte.
