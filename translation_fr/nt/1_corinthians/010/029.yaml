  text: συνείδησιν δὲ λέγω οὐχὶ τὴν ἑαυτοῦ ἀλλὰ τὴν τοῦ ἑτέρου· ἱνατί γὰρ ἡ ἐλευθερία μου κρίνεται ὑπὸ ἄλλης συνειδήσεως;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/029.yaml
  text: I mean the other person's conscience[a], not your own[b]. For why is my freedom judged by another conscience?
translation:
  language: fr
  text: Je parle de la conscience de l’autre[a], non de la tienne. Car pourquoi ma liberté est-elle jugée par la conscience d’un autre[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « non de la sienne, mais de celle de l’autre ». Le contexte soutient le sens : « non de la tienne, mais de celle de l’autre ».'
    reason: lexical_alternative
  - marker: b
    text: Cette question rhétorique peut être comprise soit comme une question de Paul lui-même, soit comme une objection qu’il reprend sans que le grec comporte de marques explicites de citation.
    reason: alternative_reading
lexical_decisions:
- source_word: συνείδησιν
  choice: conscience
  rationale: Dans cet emploi paulinien, le terme désigne la faculté morale par laquelle une personne évalue ses actes. « Conscience » est l’équivalent français courant et précis.
- source_word: δὲ λέγω
  choice: Je parle de
  rationale: L’expression apporte une clarification à ce qui précède. « Je parle de » rend naturellement cette fonction explicative sans ajouter de marqueur temporel absent du grec.
- source_word: οὐχὶ τὴν ἑαυτοῦ ἀλλὰ τὴν τοῦ ἑτέρου
  choice: de la conscience de l’autre, non de la tienne
  rationale: Le contexte oppose la conscience du destinataire à celle de l’autre personne. La répétition de « conscience » rend en français le nom sous-entendu dans le second membre grec et l’ordre retenu reste naturel.
- source_word: ἱνατί γὰρ
  choice: Car pourquoi
  rationale: « Car » conserve le lien explicatif de γάρ, tandis que « pourquoi » restitue la question rhétorique de ἱνατί.
- source_word: ἐλευθερία
  choice: liberté
  rationale: « Liberté » est l’équivalent moderne direct et convient au contexte des actes permis.
- source_word: κρίνεται
  choice: serait-elle jugée
  rationale: Le conditionnel français convient à la portée rhétorique de la question. « Jugée » préserve le sens large de κρίνω sans préciser indûment qu’il s’agit d’une condamnation.
- source_word: ὑπὸ ἄλλης συνειδήσεως
  choice: par la conscience d’un autre
  rationale: Cette formulation française identifie clairement l’agent du jugement tout en restant proche de l’expression grecque.
theological_decisions:
- issue: Référent du possessif dans le contraste initial
  choice: 'Le texte principal explicite la conscience du destinataire : « non de la tienne »'
  alternative: « non de la sienne, mais de celle de l’autre »
  rationale: Bien que ἑαυτοῦ soit formellement à la troisième personne, le contexte d’adresse aux Corinthiens soutient une formulation à la deuxième personne. Une note conserve la forme plus littérale.
- issue: Identité de la voix dans la question rhétorique
  choice: La question est laissée sans changement explicite de locuteur
  alternative: La comprendre comme une objection formulée par un interlocuteur corinthien
  rationale: Le grec ne comporte aucun marqueur de citation ni changement de locuteur. La traduction préserve donc l’ambiguïté discursive au lieu de la résoudre.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe demeure proche du grec tout en évitant le calque maladroit. Les deux notes signalent l’ambiguïté du possessif et celle de la voix rhétorique sans imposer une lecture confessionnelle.
