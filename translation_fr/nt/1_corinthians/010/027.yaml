source:
  edition: SBLGNT
  text: ⸀εἴ τις καλεῖ ὑμᾶς τῶν ἀπίστων καὶ θέλετε πορεύεσθαι, πᾶν τὸ παρατιθέμενον ὑμῖν ἐσθίετε μηδὲν ἀνακρίνοντες διὰ τὴν συνείδησιν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/027.yaml
  text: If one of the unbelievers invites you and you want to go[a], eat whatever is set before you[b], asking no questions for the sake of conscience.
translation:
  language: fr
  text: Si l’un des non-croyants vous invite et que vous voulez y aller, mangez tout ce qu’on vous sert, sans poser de questions par motif de conscience.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « sans rien examiner » ou « sans faire d’enquête ». Il s’agit de ne pas chercher à connaître la provenance des aliments. Le verset suivant précise la question de la conscience.'
    reason: lexical_alternative_and_cross_reference
lexical_decisions:
- source_word: ἀπίστων
  choice: non-croyants
  rationale: Le génitif pluriel désigne ici des personnes qui ne partagent pas la foi chrétienne. « Non-croyants » est clair et courant en français moderne, sans ajouter de nuance hostile.
- source_word: καλεῖ
  choice: invite
  rationale: Dans le contexte d’un repas, καλέω signifie naturellement « inviter » plutôt que simplement « appeler ».
- source_word: θέλετε πορεύεσθαι
  choice: que vous vouliez y aller
  rationale: Cette formulation exprime la volonté d’accepter l’invitation et maintient le caractère conditionnel de la proposition.
- source_word: πᾶν τὸ παρατιθέμενον ὑμῖν
  choice: tout ce qu’on vous servira
  rationale: Le participe désigne ce qui est présenté aux convives. « Servira » rend naturellement le cadre du repas, tandis que « tout ce que » conserve la portée générale de πᾶν.
- source_word: ἐσθίετε
  choice: mangez
  rationale: L’impératif présent donne une consigne générale, rendue directement par l’impératif français.
- source_word: μηδὲν ἀνακρίνοντες
  choice: sans poser de questions
  rationale: ἀνακρίνω peut signifier examiner, enquêter ou interroger. Ici, Paul demande de ne pas chercher à connaître la provenance ou l’histoire cultuelle des aliments.
- source_word: διὰ τὴν συνείδησιν
  choice: par motif de conscience
  rationale: διά avec l’accusatif exprime ici le motif ou la considération. Cette tournure reste concise et ne précise pas prématurément de quelle conscience il s’agit.
theological_decisions:
- issue: Référent de συνείδησις dans le contexte
  choice: Conserver dans le texte principal la référence générale à la conscience
  alternative: Préciser qu’il s’agit soit de la conscience du croyant, soit de celle de l’autre personne
  rationale: Le verset formule la considération de manière brève, et le verset suivant apporte une précision. La traduction ne tranche donc pas ici ce que le grec laisse encore ouvert.
translation_notes:
  register: Français international moderne, naturel et digne. « Non-croyants » évite une formulation inutilement péjorative; « tout ce qu’on vous servira » correspond au cadre concret du repas. Le marqueur de note est placé après la proposition finale, qu’il éclaire à la fois lexicalement et contextuellement.
