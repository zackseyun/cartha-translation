id: 1CO.10.21
reference: 1 Corinthians 10:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὐ δύνασθε ποτήριον κυρίου πίνειν καὶ ποτήριον δαιμονίων· οὐ δύνασθε τραπέζης κυρίου μετέχειν καὶ τραπέζης δαιμονίων.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/021.yaml
  text: You cannot drink the cup of the Lord and the cup of demons[a]; you cannot partake of the table of the Lord and the table of demons.
translation:
  language: fr
  text: Vous ne pouvez pas boire la coupe du Seigneur et la coupe des démons ; vous ne pouvez pas avoir part à la table du Seigneur et à la table des démons.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐ δύνασθε
  choice: vous ne pouvez pas
  rationale: Rend directement l’impossibilité ou l’incompatibilité catégorique exprimée deux fois par Paul, sans la réduire à une simple défense explicite.
- source_word: ποτήριον
  choice: la coupe
  rationale: Équivalent français naturel qui conserve l’image concrète ainsi que ses résonances cultuelles et communautaires dans le contexte.
- source_word: κυρίου
  choice: du Seigneur
  rationale: Rend simplement le génitif et maintient le parallélisme solennel avec « des démons ».
- source_word: πίνειν
  choice: boire
  rationale: L’infinitif français correspond naturellement à l’infinitif grec après « vous ne pouvez pas ».
- source_word: δαιμονίων
  choice: des démons
  rationale: Terme transparent et usuel pour désigner les êtres spirituels visés, sans recourir à une paraphrase interprétative.
- source_word: τραπέζης
  choice: à la table
  rationale: Conserve l’image de la table commune et cultuelle sans préciser davantage qu’il s’agirait d’un autel ou d’un repas.
- source_word: μετέχειν
  choice: avoir part à
  rationale: Expression française actuelle et digne qui communique une participation réelle tout en évitant le tour vieilli « participer de ».
- source_word: καὶ
  choice: et
  rationale: Préserve la structure parallèle et l’opposition rhétorique des deux appartenances incompatibles.
theological_decisions:
- issue: Portée de la double négation concernant la table du Seigneur et le culte des démons
  choice: Une incompatibilité catégorique entre les deux participations
  alternative: Une simple exhortation à ne pas associer deux pratiques qui resteraient néanmoins compatibles
  rationale: La répétition de οὐ δύνασθε présente une impossibilité catégorique. « Vous ne pouvez pas » en garde la force tout en laissant subsister la tension entre incapacité morale, incompatibilité spirituelle et interdiction rhétorique.
translation_notes:
  register: Français international moderne, direct et solennel. Le parallélisme du grec est conservé. « Avoir part à » reste accessible tout en exprimant plus qu’une simple présence au repas.
