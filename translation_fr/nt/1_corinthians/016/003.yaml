source:
  edition: SBLGNT
  text: ὅταν δὲ παραγένωμαι, οὓς ⸀ἐὰν δοκιμάσητε δι’ ἐπιστολῶν, τούτους πέμψω ἀπενεγκεῖν τὴν χάριν ὑμῶν εἰς Ἰερουσαλήμ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/003.yaml
  text: And when I arrive[b][a], I will send with letters those whom you approve to carry your gift to Jerusalem.
translation:
  language: fr
  text: Lorsque je serai arrivé, j’enverrai, munis de lettres, ceux que vous aurez approuvés porter votre don[a] à Jérusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « votre don généreux ». Le mot grec peut aussi signifier « grâce », mais il désigne ici la contribution envoyée à Jérusalem.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν δὲ παραγένωμαι
  choice: Mais quand je serai arrivé
  rationale: ὅταν avec le subjonctif aoriste exprime une éventualité future. Le futur antérieur français rend naturellement l’arrivée comme préalable à l’envoi; δέ est conservé par « Mais », qui marque ici une transition légère.
- source_word: οὓς ἐὰν δοκιμάσητε
  choice: ceux que vous aurez approuvés
  rationale: δοκιμάζω désigne ici l’examen conduisant à l’approbation de délégués. Le futur antérieur situe cette approbation avant leur envoi sans alourdir le texte avec « examinés et approuvés ».
- source_word: δι’ ἐπιστολῶν
  choice: munis de lettres
  rationale: διά avec le génitif indique le moyen ou l’accompagnement. « Munis de lettres » rattache clairement les lettres aux délégués, sans préciser de façon interprétative qu’il s’agit de lettres de recommandation.
- source_word: τούτους πέμψω
  choice: j’enverrai … ceux
  rationale: Le démonstratif τούτους reprend avec insistance les personnes approuvées. La construction française avec « ceux » conserve explicitement cet objet tout en restant naturelle.
- source_word: ἀπενεγκεῖν
  choice: afin qu’ils portent
  rationale: L’infinitif exprime le but de l’envoi. « Porter » convient au transport concret de la collecte vers Jérusalem.
- source_word: τὴν χάριν ὑμῶν
  choice: votre don
  rationale: Dans le contexte de la collecte, χάρις désigne concrètement la contribution généreuse des Corinthiens. « Don » est clair et actuel, tandis qu’une note conserve la nuance possible de bienfait généreux.
- source_word: εἰς Ἰερουσαλήμ
  choice: à Jérusalem
  rationale: Avec un nom de ville, εἰς indique naturellement la destination, rendue en français par « à Jérusalem ».
theological_decisions:
- issue: Sens de χάρις dans le contexte de la collecte
  choice: Le don matériel destiné aux croyants de Jérusalem
  alternative: La grâce, ou un bienfait généreux
  rationale: Le contexte immédiat de 1 Corinthiens 16 concerne la collecte en faveur des saints. Le mot garde une connotation de générosité gracieuse, mais désigne ici la contribution concrète; la note préserve cette nuance sans transformer le terme en abstraction théologique.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe clarifie que les délégués sont munis de lettres, tout en restant proche de l’ordre grec. Le futur antérieur marque naturellement l’antériorité de l’arrivée de Paul et de l’approbation des délégués.
