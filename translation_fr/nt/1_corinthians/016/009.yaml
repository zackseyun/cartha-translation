id: 1CO.16.9
reference: 1 Corinthians 16:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: θύρα γάρ μοι ἀνέῳγεν μεγάλη καὶ ἐνεργής, καὶ ἀντικείμενοι πολλοί.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/009.yaml
  text: For a great and effective door has opened to me[a], and there are many opponents.
translation:
  language: fr
  text: Car une porte grande et féconde s’est ouverte pour moi[a], et les adversaires sont nombreux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « une occasion importante et féconde s’est présentée à moi ». Paul emploie l’image d’une « porte » pour parler d’une ouverture favorable à son ministère.'
    reason: Alternative lexicale et explication de la métaphore.
lexical_decisions:
- source_word: θύρα
  choice: porte
  rationale: Le sens littéral est « porte ». La conservation de cette métaphore paulinienne évite de la réduire à son interprétation, « occasion ».
- source_word: γάρ
  choice: car
  rationale: La conjonction introduit la raison des projets de voyage exposés dans le contexte; « car » exprime naturellement ce lien en français.
- source_word: μοι
  choice: pour moi
  rationale: Le datif marque ici la relation personnelle ou l’avantage; « pour moi » est idiomatique avec « s’est ouverte ».
- source_word: ἀνέῳγεν
  choice: s’est ouverte
  rationale: Le parfait exprime l’état présent résultant d’une ouverture antérieure. Cette formulation française le rend naturellement sans préciser une action divine que le grec laisse implicite.
- source_word: μεγάλη
  choice: grande
  rationale: « Grande » conserve la qualification de la porte et peut évoquer à la fois l’ampleur et l’importance de l’ouverture.
- source_word: ἐνεργής
  choice: féconde
  rationale: Dans ce contexte, le terme décrit une ouverture qui produit des résultats. « Féconde » est naturel avec la métaphore et rend mieux cette productivité que le calque peu idiomatique « efficace » appliqué à une porte.
- source_word: ἀντικείμενοι
  choice: adversaires
  rationale: Le participe substantivé désigne ceux qui s’opposent à Paul et à son activité. « Adversaires » conserve la force active du terme sans préciser davantage la nature de leur opposition.
- source_word: πολλοί
  choice: nombreux
  rationale: « Nombreux » rend directement la quantité et forme une tournure française naturelle avec « les adversaires ».
theological_decisions:
- issue: La « porte » comme métaphore d’une occasion de ministère
  choice: Conserver la métaphore « porte » dans le texte principal.
  alternative: Car une occasion importante et féconde s’est présentée à moi.
  rationale: Le grec emploie explicitement θύρα. Garder l’image préserve le langage de Paul et ne transforme pas l’interprétation contextuelle en texte.
- issue: Agent de l’ouverture
  choice: Ne pas nommer celui qui ouvre la porte.
  alternative: Dieu m’a ouvert une porte grande et féconde.
  rationale: La forme verbale permet de comprendre une ouverture accomplie, mais le verset ne nomme pas explicitement l’agent. La traduction conserve cette retenue.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proche du grec tout en étant naturelle. « Féconde » évite l’expression peu idiomatique « porte efficace » et communique l’idée d’une ouverture productive.
