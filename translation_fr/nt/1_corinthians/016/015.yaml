source:
  edition: SBLGNT
  text: Παρακαλῶ δὲ ὑμᾶς, ἀδελφοί· οἴδατε τὴν οἰκίαν Στεφανᾶ, ὅτι ἐστὶν ἀπαρχὴ τῆς Ἀχαΐας καὶ εἰς διακονίαν τοῖς ἁγίοις ἔταξαν ἑαυτούς·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/015.yaml
  text: 'I urge you[a], brothers: you know the household of Stephanas, that they are the firstfruits of Achaia[b], and they devoted themselves to the service of the saints.'
translation:
  language: fr
  text: 'Je vous exhorte, frères et sœurs[a] : vous connaissez la maisonnée de Stéphanas ; elle constitue les prémices de l’Achaïe[b], et ses membres se sont consacrés au service des saints.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « frères » ; en grec, cette forme d’adresse courante peut inclure toute l’assemblée, hommes et femmes.
    reason: lexical_alternative
  - marker: b
    text: Les « prémices » désignent probablement les premiers croyants de l’Achaïe, tout en conservant l’image de la première part mise à part pour Dieu.
    reason: lexical_alternative
lexical_decisions:
- source_word: Παρακαλῶ δὲ ὑμᾶς
  choice: Je vous adresse maintenant cette exhortation
  rationale: Παρακαλῶ exprime ici un appel pressant; «je vous adresse cette exhortation» en garde la force avec dignité. «Maintenant» rend la transition légère marquée par δέ, sans valeur temporelle forte.
- source_word: ἀδελφοί
  choice: frères et sœurs
  rationale: Dans cette adresse à l’assemblée, le masculin pluriel grec peut inclure les femmes; la formulation française explicite naturellement cette portée, tandis que la note signale la forme littérale.
- source_word: οἰκίαν Στεφανᾶ
  choice: la maison de Stéphanas
  rationale: οἰκία désigne ici la maisonnée, c’est-à-dire le groupe familial et domestique, non simplement le bâtiment. «Maison» conserve en français biblique moderne cette amplitude, explicitée par la note syntaxique implicite «ses membres» dans la suite.
- source_word: ἀπαρχὴ τῆς Ἀχαΐας
  choice: les prémices de l’Achaïe
  rationale: «Prémices» préserve la métaphore de la première part offerte à Dieu, tout en pouvant désigner les premiers croyants de la province.
- source_word: εἰς διακονίαν τοῖς ἁγίοις
  choice: au service des saints
  rationale: Cette expression rend le dévouement actif en faveur des croyants sans introduire l’idée d’une charge ecclésiastique officielle.
- source_word: ἔταξαν ἑαυτούς
  choice: se sont consacrés
  rationale: Le tour réfléchi indique qu’ils se sont volontairement assigné cette tâche et s’y sont voués durablement.
theological_decisions:
- issue: Portée de ἀδελφοί dans l’adresse à l’assemblée
  choice: frères et sœurs
  alternative: frères
  rationale: Le grec emploie le masculin pluriel, mais celui-ci fonctionne couramment comme une adresse collective à l’ensemble de l’Église. La traduction explicite cette portée sans nier la forme source, précisée en note.
- issue: Sens de ἀπαρχὴ τῆς Ἀχαΐας
  choice: les prémices de l’Achaïe
  alternative: les premiers convertis de l’Achaïe
  rationale: La formulation retenue conserve à la fois le sens chronologique probable et la métaphore cultuelle d’une première part mise à part pour Dieu.
- issue: Référent collectif de la maison de Stéphanas
  choice: Elle constitue… et ses membres se sont consacrés
  alternative: Ils sont… et ils se sont consacrés
  rationale: Le grec passe du singulier ἐστίν, accordé avec οἰκία/ἀπαρχή, au pluriel ἔταξαν, qui vise les membres de la maisonnée. Le français rend explicitement ce changement afin de préserver la tension grammaticale sans obscurité.
translation_notes:
  register: Français international moderne, digne et accessible. La ponctuation en deux phrases allège la longue construction grecque. «Saints» conserve le terme paulinien usuel pour les croyants; «Achaïe» est la forme française traditionnelle du nom provincial.
