id: 1CO.16.6
reference: 1 Corinthians 16:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: πρὸς ὑμᾶς δὲ τυχὸν ⸀παραμενῶ ἢ ⸀καὶ παραχειμάσω, ἵνα ὑμεῖς με προπέμψητε οὗ ἐὰν πορεύωμαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/006.yaml
  text: and perhaps I will stay with you[a], or even spend the winter, so that you may send me on my way wherever I may go.
translation:
  language: fr
  text: Peut-être resterai-je quelque temps chez vous, ou même y passerai-je l’hiver, afin que vous m’aidiez à poursuivre mon voyage[a], quelle que soit ma destination.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vous me fassiez partir dans de bonnes conditions ». Le verbe grec peut inclure l’idée d’accompagner un voyageur à son départ ou de lui fournir une aide matérielle pour la suite de son voyage.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸς ὑμᾶς
  choice: chez vous
  rationale: Avec un verbe exprimant le fait de rester, πρός + accusatif désigne la présence auprès des destinataires; « chez vous » convient naturellement au contexte d’un séjour à Corinthe.
- source_word: δὲ
  choice: Peut-être resterai-je
  rationale: La particule δέ assure ici une transition légère dans l’exposé des projets de voyage; en français, cette liaison peut rester implicite sans introduire un contraste artificiel.
- source_word: τυχὸν
  choice: peut-être
  rationale: Cet emploi adverbial exprime une possibilité ou une éventualité.
- source_word: παραμενῶ
  choice: resterai-je quelque temps
  rationale: παραμένω signifie demeurer ou prolonger son séjour; « quelque temps » explicite naturellement l’idée de rester sur place sans fixer de durée.
- source_word: ἢ καὶ
  choice: ou même
  rationale: 'La combinaison renchérit sur la première possibilité: Paul pourrait non seulement rester, mais passer tout l’hiver sur place.'
- source_word: παραχειμάσω
  choice: y passerai-je l’hiver
  rationale: Le verbe désigne précisément le fait de passer l’hiver dans un lieu.
- source_word: ἵνα
  choice: afin que
  rationale: La conjonction introduit le but du séjour envisagé.
- source_word: προπέμψητε
  choice: vous m’aidiez à poursuivre mon voyage
  rationale: Dans un contexte de voyage, προπέμπω peut désigner le fait d’accompagner quelqu’un au départ, de l’équiper ou de lui fournir une aide pour la suite du trajet; cette formulation conserve cette amplitude.
- source_word: οὗ ἐὰν πορεύωμαι
  choice: quelle que soit ma destination
  rationale: Le relatif avec ἐάν et le subjonctif exprime une destination encore indéterminée et éventuelle.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. L’inversion après « peut-être » donne une tenue littéraire modérée; « chez vous » et « passer l’hiver » restent immédiatement compréhensibles. La traduction évite de réduire προπέμπω soit à un simple adieu, soit exclusivement à un soutien financier.
