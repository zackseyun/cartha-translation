  text: μή τις οὖν αὐτὸν ἐξουθενήσῃ. προπέμψατε δὲ αὐτὸν ἐν εἰρήνῃ, ἵνα ἔλθῃ πρός ⸀με, ἐκδέχομαι γὰρ αὐτὸν μετὰ τῶν ἀδελφῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/011.yaml
  text: So then[a], let no one despise him. But send him on his way in peace, so that he may come to me, for I am expecting him with the brothers.
translation:
  language: fr
  text: Que personne donc ne le méprise. Aidez-le à poursuivre son voyage dans la paix, afin qu’il vienne auprès de moi, car je l’attends avec les frères.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avec les frères et sœurs », si Paul parle plus largement d’un groupe de croyants ou de collaborateurs qui l’accompagnent.
    reason: lexical_alternative
lexical_decisions:
- source_word: μή τις οὖν
  choice: Que personne donc ne
  rationale: μή avec le subjonctif aoriste exprime ici une interdiction. « Que personne… ne » est naturel en français, tandis que « donc » conserve le lien logique avec le contexte précédent.
- source_word: ἐξουθενήσῃ
  choice: le méprise
  rationale: Le verbe signifie considérer quelqu’un comme sans valeur ou le traiter avec dédain. « Mépriser » en garde la force et la concision.
- source_word: προπέμψατε
  choice: Aidez-le […] à poursuivre son voyage
  rationale: Le verbe désigne souvent l’aide apportée à un voyageur pour la suite de son trajet, éventuellement en l’accompagnant ou en pourvoyant à ses besoins. Cette formulation rend ce sens plus clairement qu’un simple « envoyez-le ».
- source_word: δὲ
  choice: plutôt
  rationale: Dans ce contexte, δέ marque le contraste entre le mépris interdit et l’accueil concret demandé. « Plutôt » exprime naturellement cette opposition sans la surcharger.
- source_word: ἐν εἰρήνῃ
  choice: dans la paix
  rationale: La formulation conserve l’expression grecque et évoque un départ paisible, sans conflit ni entrave.
- source_word: ἵνα ἔλθῃ πρός με
  choice: afin qu’il vienne auprès de moi
  rationale: « Afin que » maintient la valeur de but de ἵνα avec le subjonctif; « auprès de moi » rend πρός με dans un français digne et naturel.
- source_word: ἐκδέχομαι
  choice: je l’attends
  rationale: Le présent indique une attente en cours. « Je l’attends » est plus idiomatique en français que « je m’attends à lui » et laisse au contexte la nuance d’anticipation.
- source_word: μετὰ τῶν ἀδελφῶν
  choice: avec les frères
  rationale: ἀδελφῶν est un masculin pluriel pouvant désigner des frères au sens propre ou des compagnons croyants. Le texte principal en conserve la forme, tandis qu’une note signale la possible portée collective inclusive.
theological_decisions:
- issue: Portée de ἀδελφῶν dans un groupe chrétien potentiellement mixte
  choice: les frères
  alternative: les frères et sœurs
  rationale: Le grec porte le masculin pluriel et ne permet pas de déterminer avec certitude la composition du groupe. La traduction principale conserve cette forme sans exclure la possibilité que le terme désigne plus largement des croyants ou collaborateurs des deux sexes; cette ambiguïté est explicitée en note.
translation_notes:
  register: Français international moderne, clair et digne. La phrase reste proche de la structure grecque tout en explicitant dans προπέμψατε l’aide concrète à la poursuite du voyage. Le marqueur de note [a] est placé immédiatement après « les frères », l’expression qu’il précise.
