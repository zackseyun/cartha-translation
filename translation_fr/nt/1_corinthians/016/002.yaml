id: 1CO.16.2
reference: 1 Corinthians 16:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: κατὰ μίαν ⸀σαββάτου ἕκαστος ὑμῶν παρ’ ἑαυτῷ τιθέτω θησαυρίζων ὅ τι ⸀ἐὰν εὐοδῶται, ἵνα μὴ ὅταν ἔλθω τότε λογεῖαι γίνωνται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/002.yaml
  text: On the first day of every week[a], each of you is to set something aside, storing up whatever he may prosper in[c][b], so that collections will not be made when I come.
translation:
  language: fr
  text: Le premier jour de chaque semaine[a], que chacun de vous mette quelque chose de côté[b], constituant une réserve à la mesure de sa prospérité[c], afin qu’il n’y ait pas de collectes à faire au moment de mon arrivée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Le premier jour de la semaine ». L’expression grecque a ici une valeur distributive et indique une pratique hebdomadaire régulière.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « auprès de soi » ou « avec soi ». Cela peut signifier que chacun doit mettre personnellement cette somme de côté, peut-être chez lui.
    reason: lexical_alternative
  - marker: c
    text: Ou « selon la prospérité dont il bénéficie ». Chacun doit mettre de côté une somme correspondant à ses moyens.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ μίαν σαββάτου
  choice: Le premier jour de chaque semaine
  rationale: La construction avec κατά a ici une valeur distributive et décrit une pratique régulière, répétée chaque semaine. Cette formulation rend naturellement cette récurrence en français.
- source_word: ἕκαστος ὑμῶν
  choice: chacun de vous
  rationale: L’expression distributive vise individuellement tous les destinataires.
- source_word: παρ’ ἑαυτῷ τιθέτω
  choice: que chacun de vous mette quelque chose de côté
  rationale: Le présent impératif exprime une consigne suivie. La locution παρ’ ἑαυτῷ signifie littéralement « auprès de soi » et peut évoquer une mise de côté personnelle, éventuellement chez soi ; cette nuance est signalée en note sans imposer une localisation certaine dans le texte.
- source_word: θησαυρίζων
  choice: constituant une réserve
  rationale: Le participe décrit l’accumulation progressive de ce qui est mis de côté. « Constituant une réserve » conserve l’idée d’amasser ou d’épargner sans archaïsme.
- source_word: ὅ τι ἐὰν εὐοδῶται
  choice: à la mesure de sa prospérité
  rationale: La proposition indéfinie rattache la somme mise en réserve à la prospérité effective de chacun. Cette formulation évite de réduire le sens au seul salaire et conserve la nuance de prospérité du verbe.
- source_word: ἵνα μὴ ὅταν ἔλθω τότε λογεῖαι γίνωνται
  choice: afin qu’il n’y ait pas de collectes à faire au moment de mon arrivée
  rationale: La proposition finale indique que cette épargne régulière doit éviter des collectes de dernière minute lorsque Paul arrivera.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La tournure exhortative « que chacun… » conserve la force de l’impératif grec. Le texte reste volontairement prudent sur la question de savoir si la somme devait nécessairement être gardée au domicile.
