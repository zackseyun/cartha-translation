id: 1CO.16.16
reference: 1 Corinthians 16:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἵνα καὶ ὑμεῖς ὑποτάσσησθε τοῖς τοιούτοις καὶ παντὶ τῷ συνεργοῦντι καὶ κοπιῶντι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/016.yaml
  text: that you also submit yourselves to such people[b][a], and to everyone who works and labors.
translation:
  language: fr
  text: soumettez-vous, vous aussi, à de telles personnes[a], ainsi qu’à toute personne qui collabore et travaille dur[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « afin que vous aussi vous vous soumettiez à de telles personnes ».'
    reason: La traduction principale transforme en exhortation directe la proposition introduite par ἵνα, qui dépend de « je vous le demande » au verset précédent.
  - marker: b
    text: 'Ou : « qui œuvre avec les autres et se donne de la peine ».'
    reason: συνεργέω exprime la collaboration, tandis que κοπιάω souligne un travail pénible ou soutenu.
lexical_decisions:
- source_word: ἵνα καὶ ὑμεῖς
  choice: soumettez-vous, vous aussi
  rationale: Dans la continuité de l’exhortation du verset précédent, ἵνα introduit ici ce que Paul demande. Une exhortation directe est naturelle en français, tandis que « vous aussi » conserve l’idée d’inclusion et l’accent du grec.
- source_word: ὑποτάσσησθε
  choice: soumettez-vous
  rationale: Le présent au moyen/passif exprime ici le fait de se placer soi-même sous l’autorité ou la direction de personnes reconnues. La forme pronominale conserve cette nuance sans réduire le verbe à un simple état passif.
- source_word: τοῖς τοιούτοις
  choice: à de telles personnes
  rationale: L’expression désigne des personnes du même genre que celles qui viennent d’être mentionnées, sans faire du sexe masculin le point du propos.
- source_word: παντὶ τῷ συνεργοῦντι
  choice: à toute personne qui collabore
  rationale: Le participe désigne quiconque prend part au travail avec d’autres. « Collabore » garde sa force verbale et collective sans ajouter de complément absent du grec.
- source_word: καὶ κοπιῶντι
  choice: et travaille dur
  rationale: κοπιάω évoque un travail pénible et soutenu. « Travaille dur » est courant, clair et plus fort que le simple « travaille ».
theological_decisions:
- issue: Nature de la soumission demandée
  choice: Un appel à se placer volontairement sous la direction de personnes comme la famille de Stéphanas et de tous ceux qui prennent part au travail avec zèle.
  alternative: Un ordre général d’obéissance hiérarchique absolue.
  rationale: Le contexte immédiat concerne des croyants qui se consacrent au service et ceux qui collaborent avec eux. « Soumettez-vous » conserve la force du texte sans transformer cette exhortation contextuelle en doctrine institutionnelle illimitée.
- issue: Relation de ἵνα avec l’exhortation précédente
  choice: Rendre la proposition comme la suite directe de l’appel du verset précédent.
  alternative: Expliciter « afin que » ou « je vous demande de » dans ce verset pris isolément.
  rationale: Le grec dépend syntaxiquement de παρακαλῶ au verset 15. L’impératif français transmet naturellement cette dépendance exhortative, mais une note signale la structure littérale.
translation_notes:
  register: Français international moderne, clair et digne. La formulation inclusive « de telles personnes » et « toute personne » reflète la portée générique des expressions grecques. « Travaille dur » privilégie la compréhension courante tout en conservant l’intensité de κοπιάω.
