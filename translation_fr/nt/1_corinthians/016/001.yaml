id: 1CO.16.1
reference: 1 Corinthians 16:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Περὶ δὲ τῆς λογείας τῆς εἰς τοὺς ἁγίους, ὥσπερ διέταξα ταῖς ἐκκλησίαις τῆς Γαλατίας, οὕτως καὶ ὑμεῖς ποιήσατε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/001.yaml
  text: Concerning the collection for the saints[a], as I directed the churches of Galatia, so you also are to do.
translation:
  language: fr
  text: Quant à la collecte destinée aux saints[a], faites, vous aussi, comme je l’ai prescrit aux Églises de Galatie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « destinée aux membres du peuple de Dieu ».
    reason: Alternative lexicale explicitant l’emploi paulinien de « saints ».
lexical_decisions:
- source_word: Περὶ δὲ
  choice: Quant à
  rationale: Introduit naturellement en français un nouveau sujet, tout en rendant la valeur de transition de περὶ δὲ sans ajouter un adverbe temporel explicite.
- source_word: λογείας
  choice: collecte
  rationale: Désigne ici une collecte d’argent; « collecte » est clair et n’impose pas la connotation cultuelle que pourrait avoir « offrande ».
- source_word: τῆς εἰς τοὺς ἁγίους
  choice: destinée aux saints
  rationale: Exprime les bénéficiaires de la collecte et conserve le terme paulinien « saints ».
- source_word: διέταξα
  choice: j’ai prescrit
  rationale: Rend la force directive et l’autorité de διατάσσω sans la dureté possible de « ordonné ».
- source_word: ἐκκλησίαις
  choice: Églises
  rationale: Désigne les communautés chrétiennes locales; c’est le terme français établi dans ce contexte paulinien.
- source_word: Γαλατίας
  choice: Galatie
  rationale: Forme française usuelle du nom géographique.
- source_word: οὕτως καὶ ὑμεῖς ποιήσατε
  choice: faites, vous aussi, comme
  rationale: Conserve l’impératif ainsi que l’idée de correspondance avec les instructions données en Galatie, dans un ordre naturel en français.
theological_decisions:
- issue: Traduction de ἅγιοι dans le contexte d’une aide financière
  choice: saints
  alternative: membres du peuple de Dieu
  rationale: « Saints » maintient le vocabulaire caractéristique de Paul et sa continuité théologique, sans suggérer ici une catégorie ultérieure de personnes canonisées. Une note offre une formulation immédiatement explicite.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase est réorganisée légèrement pour éviter un calque lourd, tout en préservant la transition thématique, les bénéficiaires de la collecte et la force impérative.
