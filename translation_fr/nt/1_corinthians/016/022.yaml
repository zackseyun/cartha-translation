  text: εἴ τις οὐ φιλεῖ τὸν ⸀κύριον, ἤτω ἀνάθεμα. ⸂Μαράνα θά⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/022.yaml
  text: If anyone does not love the Lord[a], let him be accursed[b]. Marana tha.
translation:
  language: fr
  text: Si quelqu’un n’aime pas le Seigneur, qu’il soit maudit[a]. Marana tha[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, selon le terme traditionnel : « anathème », c’est-à-dire sous une malédiction.'
    reason: lexical_alternative
  - marker: b
    text: 'Expression araméenne. Peut-être : « Notre Seigneur, viens ! » ou « Notre Seigneur est venu. »'
    reason: alternative_reading
lexical_decisions:
- source_word: φιλεῖ
  choice: n’aime pas
  rationale: Le verbe φιλέω exprime ici l’amour ou l’attachement personnel envers le Seigneur. « Aimer » est le rendu français le plus naturel sans réduire le sens à l’amitié ou au seul sentiment.
- source_word: κύριον
  choice: le Seigneur
  rationale: « Seigneur » conserve le titre christologique usuel de κύριος dans le contexte paulinien.
- source_word: ἤτω
  choice: qu’il soit
  rationale: L’impératif présent de εἰμί a ici une valeur jussive, rendue naturellement en français par « qu’il soit ».
- source_word: ἀνάθεμα
  choice: maudit
  rationale: ἀνάθεμα désigne une personne placée sous malédiction ou vouée au jugement. « Maudit » en transmet avec clarté la force solennelle; le terme traditionnel « anathème » est signalé en note.
- source_word: Μαράνα θά
  choice: Marana tha
  rationale: L’expression araméenne transcrite en caractères grecs est conservée sous forme translittérée, puisque sa segmentation et son interprétation exactes restent discutées.
theological_decisions:
- issue: Sens de l’expression araméenne Μαράνα θά
  choice: Maintenir « Marana tha » dans le texte principal.
  alternative: « Notre Seigneur, viens ! » ou « Notre Seigneur est venu. »
  rationale: La translittération préserve la forme liturgique ou exclamative de la source et ne tranche pas une ambiguïté réelle liée à la division et à l’analyse de l’araméen.
translation_notes:
  register: Français international moderne, direct et solennel. La tournure « Si quelqu’un… qu’il soit » conserve la force de l’avertissement, tandis que la translittération « Marana tha » préserve l’ambiguïté de l’expression araméenne.
