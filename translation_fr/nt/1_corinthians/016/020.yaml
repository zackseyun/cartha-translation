  text: ἀσπάζονται ὑμᾶς οἱ ἀδελφοὶ πάντες. ἀσπάσασθε ἀλλήλους ἐν φιλήματι ἁγίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/020.yaml
  text: All the brothers greet you[b][a]. Greet one another with a holy kiss.
translation:
  language: fr
  text: Tous les frères vous saluent[a]. Saluez-vous les uns les autres par un saint baiser[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Tous les frères et sœurs vous saluent », car le mot traduit par « frères » peut désigner collectivement les croyants.'
    reason: lexical_alternative
  - marker: b
    text: Le saint baiser était une salutation habituelle entre croyants, exprimant leur communion dans la sainteté.
    reason: cultural_note
lexical_decisions:
- source_word: ἀσπάζονται
  choice: saluent
  rationale: Dans ce contexte épistolaire, le verbe désigne l’action d’adresser ses salutations. « Saluent » est naturel, concis et permet de conserver le même verbe que dans l’impératif qui suit.
- source_word: οἱ ἀδελφοὶ πάντες
  choice: Tous les frères
  rationale: Cette formulation respecte le masculin pluriel du grec. Comme ἀδελφοί peut aussi désigner collectivement les croyants, hommes et femmes, cette possibilité est signalée en note sans être imposée dans le texte.
- source_word: ἀσπάσασθε
  choice: Saluez-vous
  rationale: L’impératif est rendu directement, tandis que la forme pronominale française s’accorde naturellement avec le complément réciproque « les uns les autres ».
- source_word: ἀλλήλους
  choice: les uns les autres
  rationale: Équivalent réciproque courant, clair et adapté au registre digne de la lettre.
- source_word: ἐν φιλήματι ἁγίῳ
  choice: par un saint baiser
  rationale: « Par » exprime ici le moyen ou la manière. « Saint baiser » conserve à la fois le geste concret et sa qualification comme expression consacrée de la communion entre croyants.
theological_decisions:
- issue: Portée de ἀδελφοί dans un contexte communautaire
  choice: frères
  alternative: frères et sœurs
  rationale: Le texte principal conserve la forme masculine du grec, tout en reconnaissant en note que le terme peut englober l’ensemble des croyants de la communauté.
translation_notes:
  register: Français international moderne, clair et digne. La répétition de « saluer » reflète la répétition du verbe grec. « Saint baiser » est conservé comme expression biblique intelligible, avec une note culturelle brève.
