  text: οὐ θέλω γὰρ ὑμᾶς ἄρτι ἐν παρόδῳ ἰδεῖν, ἐλπίζω ⸀γὰρ χρόνον τινὰ ἐπιμεῖναι πρὸς ὑμᾶς, ἐὰν ὁ κύριος ⸀ἐπιτρέψῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/007.yaml
  text: For I do not want to see you now in passing[a], for I hope to remain with you for some time, if the Lord permits.
translation:
  language: fr
  text: En effet, je ne veux pas vous voir maintenant en passant[a], car j’espère rester quelque temps auprès de vous, si le Seigneur le permet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « au cours d’un voyage » ou « en chemin ».
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ θέλω
  choice: je ne veux pas
  rationale: Exprime naturellement en français moderne le désir ou l’intention personnelle de Paul, sans donner au verbe un sens excessivement formel.
- source_word: ἄρτι
  choice: maintenant
  rationale: Marque la circonstance présente de façon concise et idiomatique.
- source_word: ἐν παρόδῳ
  choice: seulement en passant
  rationale: Désigne une visite brève au cours d’un trajet. « En passant » conserve l’image, et « seulement » rend explicite le contraste contextuel avec le séjour prolongé espéré.
- source_word: ἰδεῖν
  choice: vous voir
  rationale: Reste proche du sens littéral tout en évoquant naturellement une visite dans ce contexte.
- source_word: ἐλπίζω
  choice: j’espère
  rationale: Conserve l’attente souhaitée de Paul sans la transformer en certitude.
- source_word: χρόνον τινά
  choice: quelque temps
  rationale: Exprime une durée indéfinie mais substantielle dans un français naturel.
- source_word: ἐπιμεῖναι
  choice: rester
  rationale: Rend directement l’idée de prolonger sa présence.
- source_word: πρὸς ὑμᾶς
  choice: auprès de vous
  rationale: Avec « rester », cette formulation française exprime naturellement la présence en compagnie des destinataires.
- source_word: ἐὰν ὁ κύριος ἐπιτρέψῃ
  choice: si le Seigneur le permet
  rationale: Formule idiomatique qui maintient la dépendance du projet de Paul à l’autorisation du Seigneur.
- source_word: κύριος
  choice: Seigneur
  rationale: Équivalent établi qui conserve le titre grec sans préciser davantage son référent.
theological_decisions:
- issue: Référent de « Seigneur »
  choice: Conserver simplement « le Seigneur »
  alternative: Préciser « le Seigneur Jésus » ou « Dieu »
  rationale: Le grec emploie κύριος sans complément explicatif. La traduction préserve donc cette ouverture au lieu d’identifier le référent au-delà de ce que dit le verset.
translation_notes:
  register: Français international moderne, naturel et digne. « En effet » rend le lien explicatif de γάρ en tête de phrase; le second γάρ est rendu par « car ». La tournure « seulement en passant » souligne sans lourdeur le contraste entre une visite brève et le séjour envisagé.
