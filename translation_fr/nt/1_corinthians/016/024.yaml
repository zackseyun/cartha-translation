  text: ἡ ἀγάπη μου μετὰ πάντων ὑμῶν ἐν Χριστῷ ⸀Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/024.yaml
  text: My love be with all of you in Messiah Jesus[a].
translation:
  language: fr
  text: Que mon amour soit avec vous tous en Jésus, le Messie[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « en Christ Jésus ». Le titre grec Χριστός peut être traduit par « Messie » ou rendu, selon l’usage chrétien traditionnel, par « Christ ».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγάπη
  choice: amour
  rationale: « Amour » exprime naturellement en français actuel l’affection personnelle et le don de soi, sans l’archaïsme ni les connotations modernes restrictives de « charité ».
- source_word: μου
  choice: mon
  rationale: Le possessif indique directement l’amour personnel de Paul pour les destinataires.
- source_word: μετὰ
  choice: soit avec
  rationale: La phrase grecque ne comporte pas de verbe. « Soit avec » restitue comme un souhait la formule de clôture sans transformer implicitement celle-ci en simple constat.
- source_word: πάντων ὑμῶν
  choice: vous tous
  rationale: 'Cette formulation naturelle conserve la portée inclusive de πάντων : Paul adresse son amour à l’ensemble des destinataires.'
- source_word: ἐν
  choice: dans
  rationale: « Dans » préserve l’expression paulinienne de sphère ou d’union sans la réduire à une valeur instrumentale comme « par ».
- source_word: Χριστῷ Ἰησοῦ
  choice: le Messie Jésus
  rationale: Χριστός est rendu selon sa valeur de titre par « le Messie », tandis que Ἰησοῦ reste le nom « Jésus ». L’article français est nécessaire devant le titre commun « Messie » dans cette construction.
theological_decisions:
- issue: Traduction de Χριστός dans la formule paulinienne ἐν Χριστῷ Ἰησοῦ
  choice: dans le Messie Jésus
  alternative: en Christ Jésus
  rationale: « Messie » rend explicitement le sens du titre grec, tandis que « Christ » en est la forme traditionnelle, devenue en partie un nom propre. La variante est signalée afin de conserver cette possibilité légitime.
- issue: Interprétation de la phrase nominale comme souhait ou comme constat
  choice: Que mon amour soit avec vous tous
  alternative: Mon amour est avec vous tous
  rationale: Le grec ne précise aucun verbe. Le contexte de bénédiction finale favorise un souhait, mais la formulation source demeure grammaticalement ouverte; l’ajout de « soit » est donc une explicitation contextuelle minimale.
translation_notes:
  register: Français international actuel, digne et accessible. La tournure « Que… soit » porte le ton d’un souhait final. « Dans le Messie Jésus » est moins traditionnel que « en Christ Jésus », mais rend explicitement le titre et conserve l’ordre grec; la forme traditionnelle figure en note.
