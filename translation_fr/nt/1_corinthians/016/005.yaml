  text: But I will come to you when I have gone through Macedonia[a], for I am going through Macedonia.
translation:
  language: fr
  text: Mais je viendrai chez vous quand j’aurai traversé la Macédoine[a], car je vais traverser la Macédoine.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « quand je passerai par la Macédoine ». Le grec peut être rendu par un futur simple français ; « quand j’aurai traversé » fait ressortir que la traversée précède la visite de Paul.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐλεύσομαι
  choice: je viendrai
  rationale: Le futur de ἔρχομαι exprime l’intention future de Paul, orientée vers les destinataires; « venir » convient naturellement avec πρὸς ὑμᾶς.
- source_word: δὲ
  choice: Mais
  rationale: La particule marque ici une transition légèrement contrastive par rapport au projet évoqué auparavant, sans forte opposition.
- source_word: πρὸς ὑμᾶς
  choice: chez vous
  rationale: Après un verbe de mouvement, l’expression indique que Paul se rendra auprès des Corinthiens; « chez vous » est idiomatique et suggère une visite sans surinterpréter sa durée.
- source_word: ὅταν … διέλθω
  choice: quand j’aurai traversé
  rationale: Avec l’aoriste subjonctif, la proposition situe la traversée de la Macédoine comme antérieure à la visite; le futur antérieur français restitue clairement ce rapport temporel.
- source_word: Μακεδονίαν
  choice: la Macédoine
  rationale: Forme française usuelle du nom de la province, employée avec l’article conformément à l’usage moderne.
- source_word: γὰρ
  choice: car
  rationale: La conjonction introduit l’explication du moment choisi pour la visite.
- source_word: διέρχομαι
  choice: je suis en train de traverser
  rationale: Le présent indique la traversée comme parcours actuel ou engagé. Cette formulation conserve le contraste aspectuel avec « j’aurai traversé », tout en laissant au contexte la possibilité d’un itinéraire déjà en cours de réalisation.
