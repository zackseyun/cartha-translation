revisions:
- from: Car ils ont réconforté mon esprit comme le vôtre. Sachez donc reconnaître de tels hommes[a].
  to: Car ils ont réconforté mon esprit et le vôtre. Accordez donc de la considération à de tels hommes[a].
  rationale: La révision rétablit la coordination explicite « mon esprit et le vôtre » et remplace une exhortation un peu indirecte par une formulation française plus naturelle qui appelle à donner aux personnes visées la reconnaissance qui leur est due. Elle préserve le registre moderne, le masculin contextuellement justifié et l’absence de surinterprétation doctrinale.
