language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀνέπαυσαν γὰρ τὸ ἐμὸν πνεῦμα καὶ τὸ ὑμῶν. ἐπιγινώσκετε οὖν τοὺς τοιούτους.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/018.yaml
  text: For they refreshed my spirit and yours[a]. Therefore acknowledge such men.
translation:
  language: fr
  text: Car ils ont réconforté mon esprit et le vôtre. Accordez donc de la considération à de tels hommes[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « reconnaissez de tels hommes » ou « appréciez de tels hommes ». Le grec est masculin et renvoie ici précisément aux hommes mentionnés juste avant.
    reason: La valeur de ἐπιγινώσκετε dépasse probablement la simple identification, tandis que τοὺς τοιούτους a dans ce contexte des référents masculins précis.
lexical_decisions:
- source_word: ἀνέπαυσαν
  choice: ont réconforté
  rationale: Le verbe désigne ici un soulagement ou un renouvellement intérieur, et non un repos physique. « Réconforté » exprime naturellement cet effet en français moderne.
- source_word: γὰρ
  choice: Car
  rationale: La conjonction introduit la raison de la recommandation précédente et conserve explicitement le lien logique.
- source_word: πνεῦμα
  choice: esprit
  rationale: Dans ce contexte, le terme renvoie à l'être intérieur ou à l'état intérieur de Paul et des Corinthiens, sans désigner nécessairement l'Esprit Saint. « Esprit » préserve l'expression paulinienne.
- source_word: τὸ ἐμὸν πνεῦμα καὶ τὸ ὑμῶν
  choice: mon esprit comme le vôtre
  rationale: La formulation restitue l'ellipse grecque après « le vôtre » et exprime clairement que le réconfort concerne Paul aussi bien que les Corinthiens.
- source_word: ἐπιγινώσκετε
  choice: Sachez donc reconnaître
  rationale: Dans cette exhortation, le verbe appelle à reconnaître à ces hommes leur juste valeur, et non simplement à les identifier. La tournure française conserve toutefois la latitude du grec.
- source_word: οὖν
  choice: donc
  rationale: Le mot marque la conclusion pratique tirée de ce qui précède.
- source_word: τοὺς τοιούτους
  choice: de tels hommes
  rationale: L'expression renvoie immédiatement à Stéphanas, Fortunatus et Achaïcos, trois hommes nommés dans le contexte. Le masculin spécifique est donc conservé.
theological_decisions:
- issue: Genre grammatical et référents de τοὺς τοιούτους
  choice: de tels hommes
  alternative: de telles personnes ; des personnes comme eux
  rationale: Même si l'expression peut être générale ailleurs, elle désigne ici les trois collaborateurs masculins qui viennent d'être mentionnés. La traduction maintient ce référent précis sans transformer l'exhortation en règle exclusivement masculine.
- issue: Portée de πνεῦμα
  choice: esprit, au sens de l'être intérieur
  alternative: l'Esprit Saint ; le moral
  rationale: Le possessif « mon » puis « le vôtre » favorise ici une référence à la disposition ou à l'être intérieur humain. La traduction garde néanmoins le terme théologiquement ouvert « esprit » plutôt qu'une paraphrase réductrice.
translation_notes:
  register: Français international moderne, naturel et digne. « Réconforté mon esprit » conserve l'image intérieure de l'original sans lourdeur littérale. « Sachez reconnaître » rend l'impératif de façon idiomatique tout en laissant la note préciser sa portée.
