review_pass:
  verdict: revise
  source_fidelity: 'Le sens fondamental est bien rendu : ἀνέπαυσαν désigne un réconfort/renouvellement intérieur, πνεῦμα vise l’être intérieur humain, et τοὺς τοιούτους renvoie dans l’immédiat aux hommes nommés. Toutefois, « comme le vôtre » atténue la coordination explicite καὶ (« et le vôtre »).'
  naturalness: « Ils ont réconforté mon esprit et le vôtre » est à la fois idiomatique et plus proche de la syntaxe source. « Sachez donc reconnaître de tels hommes » est compréhensible, mais moins direct et moins naturel comme impératif d’exhortation que « Accordez donc de la considération à de tels hommes ».
  terminology: « Esprit » conserve utilement le terme paulinien sans l’identifier à l’Esprit Saint. Le masculin « de tels hommes » est justifié par les référents contextuels précis. « Considération » exprime la reconnaissance active et appropriée demandée par ἐπιγινώσκετε, sans imposer l’idée plus forte d’un honneur officiel.
  issues:
  - severity: low
    issue: La coordination de « mon esprit » et « le vôtre » est rendue par « comme le vôtre ».
    rationale: Le grec porte explicitement καὶ, « et ». La formulation avec « comme » reste possible en français, mais elle rend moins exactement l’addition des deux compléments.
  - severity: low
    issue: « Sachez donc reconnaître » est une formulation exhortative indirecte.
    rationale: Elle peut évoquer la capacité ou le discernement plus que l’injonction présente du grec. Une exhortation explicite à accorder une juste considération rend plus naturellement la portée contextuelle de ἐπιγινώσκετε.
