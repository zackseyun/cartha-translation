source:
  edition: SBLGNT
  text: Περὶ δὲ Ἀπολλῶ τοῦ ἀδελφοῦ, πολλὰ παρεκάλεσα αὐτὸν ἵνα ἔλθῃ πρὸς ὑμᾶς μετὰ τῶν ἀδελφῶν· καὶ πάντως οὐκ ἦν θέλημα ἵνα νῦν ἔλθῃ, ἐλεύσεται δὲ ὅταν εὐκαιρήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/012.yaml
  text: Concerning Apollos our brother[a], I strongly urged him to come to you with the brothers; but it was not at all his will to come now[b]. Yet he will come when he has opportunity.
translation:
  language: fr
  text: Quant à Apollos, notre frère[a], j’ai beaucoup insisté auprès de lui pour qu’il vienne chez vous avec les frères ; mais il ne voulait absolument pas venir maintenant[b]. Il viendra toutefois lorsqu’il en aura l’occasion.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « le frère », sans pronom possessif explicite en grec.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « ce n’était absolument pas sa volonté de venir maintenant ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Περὶ δὲ Ἀπολλῶ
  choice: Quant à Apollos
  rationale: « Quant à » introduit naturellement en français un nouveau sujet épistolaire et rend Περὶ δὲ sans ajouter un adverbe temporel.
- source_word: τοῦ ἀδελφοῦ
  choice: le frère
  rationale: Le grec porte l’article défini, sans possessif explicite. Cette forme directe conserve cette particularité, tout en laissant une note signaler l’idiome français possible « notre frère ».
- source_word: πολλὰ παρεκάλεσα
  choice: je l’ai vivement encouragé
  rationale: πολλὰ renforce παρακαλέω. « Vivement encouragé » exprime une sollicitation insistante sans suggérer nécessairement un ordre.
- source_word: ἵνα ἔλθῃ πρὸς ὑμᾶς
  choice: à aller chez vous
  rationale: L’infinitif rend naturellement le contenu de l’exhortation ; « chez vous » exprime ici le mouvement vers les Corinthiens.
- source_word: μετὰ τῶν ἀδελφῶν
  choice: avec les frères
  rationale: Le masculin pluriel désigne vraisemblablement les hommes chargés du déplacement mentionnés dans le contexte ; aucune expansion inclusive n’est nécessaire.
- source_word: καὶ πάντως οὐκ ἦν θέλημα
  choice: Mais il ne voulait vraiment pas
  rationale: La tournure française explicite le sujet contextuel, Apollos, et rend l’intensité de πάντως avec « vraiment pas », tout en conservant en note la formulation nominale plus littérale.
- source_word: νῦν
  choice: maintenant
  rationale: Rend directement l’indication temporelle.
- source_word: ἐλεύσεται δὲ ὅταν εὐκαιρήσῃ
  choice: il ira lorsqu’il en aura l’occasion
  rationale: εὐκαιρέω désigne le fait de disposer d’un moment ou d’une occasion favorable ; cette traduction évite de réduire le sens à la simple convenance personnelle.
theological_decisions:
- issue: Référent et sens de οὐκ ἦν θέλημα
  choice: 'La volonté exprimée est celle d’Apollos : il ne voulait pas venir à ce moment-là.'
  alternative: Ce n’était pas la volonté de Dieu qu’il vienne alors.
  rationale: Apollos est le référent immédiat et naturel. Rien dans la phrase grecque n’indique que θέλημα désigne ici la volonté divine ; l’introduire ajouterait une affirmation théologique absente du texte.
translation_notes:
  register: Français international moderne, naturel et digne. Le texte privilégie une syntaxe courante tout en signalant par des notes les formulations grecques susceptibles d’être rendues autrement.
