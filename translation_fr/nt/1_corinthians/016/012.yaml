  verdict: revise
  source_fidelity: 'Le sens général est bien rendu et le refus concerne correctement Apollos. Toutefois, « il ira » affaiblit le mouvement vers les destinataires exprimé par ἔλθῃ / ἐλεύσεται : « il viendra » est plus fidèle. L’intensité de πάντως mérite aussi « absolument pas » plutôt que « vraiment pas ».'
  naturalness: « Apollos, le frère » est grammaticalement possible mais peu naturel et quelque peu opaque en français moderne. « Notre frère » est l’expression française idiomatique dans ce contexte, avec une note précisant l’absence de possessif explicite en grec. « J’ai beaucoup insisté auprès de lui » rend plus naturellement l’insistance répétée de πολλὰ παρεκάλεσα que « je l’ai vivement encouragé ».
  terminology: « Notre frère » conserve le registre chrétien fraternel sans imposer de lecture doctrinale. « Les frères » convient pour le groupe masculin concret mentionné dans le texte.
  issues:
  - severity: medium
    issue: « il ira » traduit ἐλεύσεται
    rationale: Le verbe grec σημαίνει venir vers les Corinthiens ; en français, « il viendra » maintient ce point de vue déictique, tandis que « il ira » le déplace inutilement.
  - severity: low
    issue: « le frère » est peu idiomatique en français moderne
    rationale: Bien que le grec ait l’article sans possessif, le français requiert naturellement « notre frère » dans cette désignation relationnelle. La note peut préserver l’observation lexicale.
  - severity: low
    issue: Force de πολλὰ παρεκάλεσα et πάντως
    rationale: « J’ai beaucoup insisté auprès de lui » exprime clairement l’insistance, et « absolument pas » rend plus nettement la négation intensifiée par πάντως.
  revised_text: Quant à Apollos, notre frère[a], j’ai beaucoup insisté auprès de lui pour qu’il vienne chez vous avec les frères ; mais il ne voulait absolument pas venir maintenant[b]. Il viendra toutefois lorsqu’il en aura l’occasion.
