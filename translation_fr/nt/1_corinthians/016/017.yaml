  text: χαίρω δὲ ἐπὶ τῇ παρουσίᾳ Στεφανᾶ καὶ Φορτουνάτου καὶ Ἀχαϊκοῦ, ὅτι τὸ ⸀ὑμέτερον ὑστέρημα οὗτοι ἀνεπλήρωσαν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/017.yaml
  text: And I rejoice at the coming of Stephanas and Fortunatus and Achaicus[a], because these men have made up for your absence.
translation:
  language: fr
  text: Je me réjouis de la venue de Stéphanas, de Fortunatus et d’Achaïcus[a], car ils ont suppléé à ce qui manquait de votre part.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ils ont compensé votre absence ». Le grec parle littéralement de « ce qui manquait de votre part »; il peut s’agir ici de l’impossibilité pour les Corinthiens d’être personnellement auprès de Paul.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χαίρω
  choice: Je me réjouis
  rationale: Le présent à la première personne exprime directement la joie de Paul et convient au ton épistolaire.
- source_word: δὲ
  choice: omis explicitement
  rationale: Connecteur léger; en français, l’enchaînement demeure naturel sans « et » ni « mais », qui alourdiraient ou accentueraient indûment le lien.
- source_word: ἐπὶ τῇ παρουσίᾳ
  choice: de la venue
  rationale: Dans ce contexte, παρουσία désigne l’arrivée personnelle des trois hommes; « venue » est naturel et n’introduit pas de sens eschatologique.
- source_word: Στεφανᾶ καὶ Φορτουνάτου καὶ Ἀχαϊκοῦ
  choice: Stéphanas, Fortunatus et Achaïcus
  rationale: Translittérations françaises usuelles des noms propres, avec coordination naturelle en français.
- source_word: ὅτι
  choice: car
  rationale: Introduit la raison de la joie de Paul dans un français fluide et digne.
- source_word: τὸ ὑμέτερον ὑστέρημα
  choice: ce qui manquait de votre part
  rationale: Cette formulation conserve la notion générale de manque ou d’insuffisance et évite de réduire sans certitude le sens à la seule absence physique des Corinthiens.
- source_word: οὗτοι
  choice: ils
  rationale: Le pronom renvoie clairement aux trois hommes déjà nommés; le français n’a pas besoin de répéter « ces hommes » pour conserver la référence.
- source_word: ἀνεπλήρωσαν
  choice: ont suppléé à
  rationale: Rend l’idée de combler ou fournir ce qui manque, tout en formant une expression française naturelle avec « ce qui manquait ».
theological_decisions:
- issue: Nature du manque des Corinthiens
  choice: Conserver la formulation ouverte « ce qui manquait de votre part »
  alternative: « votre absence »
  rationale: Le contexte peut viser l’impossibilité pour les Corinthiens d’être présents auprès de Paul, mais le grec ὑστέρημα ne précise pas à lui seul que le manque est exclusivement leur absence. La traduction préserve donc cette ambiguïté sans suggérer nécessairement une faute morale.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe reste accessible, tandis que la note rend compte de l’interprétation contextuelle « votre absence » sans l’imposer dans le texte principal.
