lexical_decisions:
- source_word: ἐπιμενῶ
  choice: je resterai
  rationale: Le futur actif de ἐπιμένω exprime ici, dans le contexte d’un projet de voyage, le fait de demeurer quelque temps dans un lieu. « Je resterai » est naturel en français moderne.
- source_word: δὲ
  choice: Mais
  rationale: δέ marque une légère opposition ou une transition par rapport aux projets de voyage évoqués auparavant. « Mais » conserve ici cette nuance contrastive.
- source_word: ἐν Ἐφέσῳ
  choice: à Éphèse
  rationale: ἐν suivi du datif a un sens locatif. En français, le nom de ville s’emploie naturellement avec la préposition « à ».
- source_word: ἕως τῆς πεντηκοστῆς
  choice: jusqu’à la Pentecôte
  rationale: ἕως suivi du génitif indique la durée jusqu’à un moment déterminé. « La Pentecôte » est l’appellation française établie de cette fête dans le contexte du Nouveau Testament.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La phrase brève conserve le léger contraste exprimé par δέ et le caractère direct du projet de voyage de Paul.
