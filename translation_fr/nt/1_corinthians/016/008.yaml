  text: But I will stay in Ephesus until Pentecost[a].
translation:
  language: fr
  text: Mais je resterai à Éphèse jusqu’à la Pentecôte[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « jusqu’à la fête des Semaines ».
