source:
  edition: SBLGNT
  text: Ἐὰν δὲ ἔλθῃ Τιμόθεος, βλέπετε ἵνα ἀφόβως γένηται πρὸς ὑμᾶς, τὸ γὰρ ἔργον κυρίου ἐργάζεται ὡς ⸀κἀγώ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/010.yaml
  text: If Timothy comes[a], see that he may be with you without fear, for he is doing the Lord’s work[b], as I also am.
translation:
  language: fr
  text: Si Timothée vient, veillez à ce qu’il soit parmi vous sans crainte[a], car il accomplit l’œuvre du Seigneur[b], tout comme moi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qu’il soit auprès de vous sans crainte ». L’expression grecque peut souligner sa présence parmi eux dans une situation où il n’a rien à craindre.
    reason: lexical_alternative
  - marker: b
    text: Ou « car il fait l’œuvre du Seigneur, tout comme moi aussi ».
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐὰν δὲ
  choice: Si
  rationale: « Si » rend naturellement la condition éventuelle introduite par ἐάν. La nuance de transition portée par δέ reste légère et n’exige pas ici un « mais » potentiellement trop adversatif.
- source_word: ἔλθῃ Τιμόθεος
  choice: Timothée vient
  rationale: L’aoriste subjonctif après ἐάν exprime une éventualité future; le présent français après « si » est la tournure idiomatique appropriée.
- source_word: βλέπετε ἵνα
  choice: veillez à ce que
  rationale: Cette formulation rend l’impératif de vigilance et introduit naturellement la proposition de but ou de résultat.
- source_word: ἀφόβως γένηται πρὸς ὑμᾶς
  choice: il puisse être parmi vous sans crainte
  rationale: La traduction conserve à la fois l’idée de présence ou de situation auprès des destinataires et celle d’une absence de crainte, sans réduire le sens à un simple sentiment subjectif de sécurité.
- source_word: τὸ ἔργον κυρίου ἐργάζεται
  choice: il accomplit l’œuvre du Seigneur
  rationale: « Accomplir l’œuvre » restitue en français courant l’activité continue exprimée par ἐργάζεται tout en gardant explicitement « l’œuvre du Seigneur »; une traduction plus formelle est signalée en note.
- source_word: ὡς κἀγώ
  choice: tout comme moi
  rationale: κἀγώ signifie « moi aussi ». La formulation française conserve l’ellipse du grec et associe le travail de Timothée à celui de Paul sans répétition lourde.
theological_decisions:
- issue: Référent de κυρίου
  choice: « du Seigneur » sans autre précision
  alternative: « du Seigneur Jésus »
  rationale: Dans le contexte paulinien, le référent est très probablement Jésus, mais le grec dit seulement « du Seigneur ». La traduction ne rend pas explicite ce que le texte laisse implicite.
translation_notes:
  register: Français international moderne, clair et digne. « Veillez à ce que » garde la force de l’exhortation; « parmi vous sans crainte » préserve l’ambiguïté relationnelle du grec sans préciser indûment la source éventuelle de la crainte.
