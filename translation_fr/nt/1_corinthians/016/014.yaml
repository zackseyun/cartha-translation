  text: πάντα ὑμῶν ἐν ἀγάπῃ γινέσθω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/014.yaml
  text: Let all that you do be done in love[a].
translation:
  language: fr
  text: Que tout ce que vous faites soit fait dans l’amour[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « Que tout ce qui est à vous soit dans l’amour. » Le grec est elliptique et peut désigner tout ce qui relève de vous.'
    reason: La formulation grecque πάντα ὑμῶν est elliptique ; la note conserve l’alternative plus littérale sans imposer une interprétation plus étroite.
lexical_decisions:
- source_word: πάντα
  choice: tout
  rationale: Le neutre pluriel de πᾶς a ici une portée globale. Le singulier collectif « tout » est naturel en français et conserve cette portée universelle.
- source_word: ὑμῶν
  choice: ce que vous faites
  rationale: Le génitif dépend de πάντα dans une expression elliptique, littéralement « tout de vous ». Dans ce contexte exhortatif, « ce que vous faites » exprime naturellement ce qui relève des destinataires ou procède d’eux, sans restreindre le champ à une catégorie particulière d’actions.
- source_word: ἐν ἀγάπῃ
  choice: dans l’amour
  rationale: La préposition ἐν peut indiquer ici la manière ou la sphère. « Dans l’amour » suit de près la formulation grecque et garde ouverte cette nuance, tandis que « avec amour » insisterait davantage sur la seule manière d’agir.
- source_word: γινέσθω
  choice: se fasse
  rationale: L’impératif présent à la troisième personne de γίνομαι appelle une exhortation continue. « Se fasse » rend idiomatiquement en français l’idée de « se produire / avoir lieu » dans cette construction.
theological_decisions: []
translation_notes:
  register: Français international moderne, simple et digne. La tournure exhortative « Que… se fasse » conserve la force de l’impératif grec. « Dans l’amour » maintient la formulation et l’ambiguïté entre sphère et manière.
