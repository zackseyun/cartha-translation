  text: Que la grâce du Seigneur Jésus soit avec vous.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χάρις
  choice: grâce
  rationale: « Grâce » est l’équivalent français établi qui exprime ici la faveur bienveillante et la bénédiction venant du Seigneur, tout en conservant la portée théologique du terme paulinien.
- source_word: κύριος
  choice: Seigneur
  rationale: « Seigneur » rend naturellement le titre κύριος dans une bénédiction chrétienne et en préserve la force christologique.
- source_word: Ἰησοῦ
  choice: Jésus
  rationale: Le nom propre est rendu sous sa forme française usuelle.
- source_word: μεθ’ ὑμῶν
  choice: soit avec vous
  rationale: Le grec signifie littéralement « avec vous », sans verbe exprimé. Le subjonctif « soit » restitue en français la valeur souhaitée de cette formule de bénédiction.
- source_word: τοῦ κυρίου Ἰησοῦ
  choice: du Seigneur Jésus
  rationale: Cette formulation respecte directement le génitif grec, qui peut évoquer l’appartenance ou la source, sans trancher plus précisément que le texte.
theological_decisions:
- issue: Formule de bénédiction elliptique sans verbe explicite
  choice: Que la grâce du Seigneur Jésus soit avec vous.
  alternative: La grâce du Seigneur Jésus avec vous.
  rationale: Le grec ne comporte aucun verbe, mais la construction française naturelle d’un souhait appelle « que… soit ». Cet ajout grammatical explicite la valeur conventionnelle de la bénédiction sans ajouter de contenu théologique.
translation_notes:
  register: Français international moderne, naturel et digne. La tournure « Que… soit » marque clairement la bénédiction et convient aussi bien à la lecture publique qu’à la lecture personnelle.
