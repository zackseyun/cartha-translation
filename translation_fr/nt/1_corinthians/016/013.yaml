reference: 1 Corinthians 16:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Γρηγορεῖτε, στήκετε ἐν τῇ πίστει, ἀνδρίζεσθε, κραταιοῦσθε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/013.yaml
  text: Stay alert[a], stand firm in the faith, act courageously[b], be strong.
translation:
  language: fr
  text: Veillez, tenez ferme dans la foi, agissez avec courage[a], soyez forts[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « comportez-vous en hommes »; cette expression grecque signifie ici agir avec courage ou bravoure.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « laissez-vous fortifier » ou « devenez forts ». La forme grecque peut avoir une nuance passive.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Γρηγορεῖτε
  choice: Veillez
  rationale: L’impératif présent appelle à une vigilance continue. « Veillez » est bref, naturel et conserve aussi l’image d’éveil portée par le verbe grec.
- source_word: στήκετε
  choice: tenez ferme
  rationale: Le verbe exprime ici la constance et la fermeté plutôt qu’une simple position debout.
- source_word: ἐν τῇ πίστει
  choice: dans la foi
  rationale: L’article grec favorise ici la foi comprise comme le domaine ou le contenu auquel les croyants doivent demeurer attachés, sans exclure entièrement la dimension personnelle de la confiance.
- source_word: ἀνδρίζεσθε
  choice: agissez avec courage
  rationale: Le verbe, formé sur le mot grec désignant l’homme adulte, emploie une image masculine pour appeler idiomatiquement à une conduite courageuse. La traduction principale communique ce sens en français actuel, tandis qu’une note conserve l’image littérale.
- source_word: κραταιοῦσθε
  choice: soyez forts
  rationale: Cette formulation rend naturellement l’exhortation dans la série d’impératifs brefs. Une note signale que la forme grecque peut aussi être comprise avec une nuance passive ou de développement.
theological_decisions:
- issue: Sens de πίστις avec l’article
  choice: dans la foi
  alternative: dans votre confiance fidèle
  rationale: L’article et le contexte d’exhortation communautaire soutiennent « la foi », probablement comme réalité confessée et vécue, sans définir plus étroitement son contenu doctrinal.
- issue: Image masculine de ἀνδρίζεσθε
  choice: agissez avec courage
  alternative: comportez-vous en hommes
  rationale: En grec, l’image littérale est masculine, mais sa fonction idiomatique est d’exhorter toute la communauté au courage. La note préserve cette image afin de ne pas effacer la forme du texte source ni faire croire que l’exhortation vise seulement les hommes.
- issue: Voix de κραταιοῦσθε
  choice: soyez forts
  alternative: laissez-vous fortifier
  rationale: La forme est morphologiquement moyenne ou passive. « Soyez forts » convient au contexte et reste sémantiquement ouvert; la note présente la lecture passive sans préciser qui fortifie.
translation_notes:
  register: Français international moderne, sobre et exhortatif. La cadence de quatre impératifs est conservée. « Veillez » appartient au registre biblique courant sans être archaïque; « agissez avec courage » évite qu’une image masculine grecque soit comprise comme excluant les femmes, tout en la signalant explicitement en note.
