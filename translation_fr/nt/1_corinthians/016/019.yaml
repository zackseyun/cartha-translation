source:
  edition: SBLGNT
  text: Ἀσπάζονται ὑμᾶς αἱ ἐκκλησίαι τῆς Ἀσίας. ⸀ἀσπάζεται ὑμᾶς ἐν κυρίῳ πολλὰ Ἀκύλας καὶ ⸀Πρίσκα σὺν τῇ κατ’ οἶκον αὐτῶν ἐκκλησίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/019.yaml
  text: The churches of Asia greet you[a]. Aquila and Prisca, together with the church in their house[b], greet you warmly in the Lord.
translation:
  language: fr
  text: Les Églises d’Asie vous saluent[a]. Aquilas et Prisca[b], ainsi que l’Église qui se réunit dans leur maison, vous saluent chaleureusement dans le Seigneur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ici, « Asie » désigne la province romaine d’Asie, située dans l’ouest de l’Asie Mineure, et non le continent asiatique actuel.
    reason: cultural_note
  - marker: b
    text: Le grec porte « Prisca »; elle est aussi appelée « Priscille » dans d’autres passages (par exemple Actes 18.2, 18, 26; Romains 16.3).
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀσπάζονται / ἀσπάζεται
  choice: vous saluent
  rationale: Le verbe ἀσπάζομαι signifie couramment « saluer » ou « adresser ses salutations ». « Vous saluent » est naturel, digne et conserve le même verbe dans les deux propositions.
- source_word: αἱ ἐκκλησίαι
  choice: les Églises
  rationale: Dans cet emploi paulinien, ἐκκλησία désigne les communautés chrétiennes locales. « Églises » est le terme français courant et clair.
- source_word: τῆς Ἀσίας
  choice: d’Asie
  rationale: La traduction garde la forme concise du grec; une note précise qu’il s’agit de la province romaine d’Asie et non du continent moderne.
- source_word: ἐν κυρίῳ
  choice: dans le Seigneur
  rationale: Cette formulation préserve l’expression paulinienne et sa portée à la fois théologique et relationnelle sans l’expliciter excessivement.
- source_word: πολλὰ
  choice: chaleureusement
  rationale: Employé adverbialement, πολλὰ intensifie ici les salutations. « Chaleureusement » en rend le sens idiomatique en français moderne.
- source_word: Ἀκύλας καὶ Πρίσκα
  choice: Aquilas et Prisca
  rationale: Les noms suivent leur forme grecque dans ce verset. « Aquilas » est la forme française biblique usuelle d’Ἀκύλας, tandis que « Prisca » reproduit Πρίσκα; son autre forme, Priscille, est signalée en note.
- source_word: σὺν τῇ κατ’ οἶκον αὐτῶν ἐκκλησίᾳ
  choice: ainsi que l’Église qui se réunit dans leur maison
  rationale: L’expression désigne naturellement la communauté chrétienne rassemblée dans leur demeure. L’ajout idiomatique « qui se réunit » rend ce sens clairement en français sans confondre l’Église avec la maisonnée.
theological_decisions:
- issue: Sens de ἐκκλησία dans un cadre domestique
  choice: « l’Église qui se réunit dans leur maison » désigne une communauté chrétienne locale accueillie chez Aquilas et Prisca
  alternative: « l’Église dans leur maison », formulation plus littérale mais potentiellement moins claire
  rationale: L’expression grecque κατ’ οἶκον désigne le cadre domestique de cette Église, non simplement la famille du couple. La traduction explicite sobrement le rassemblement sans introduire de conception confessionnelle particulière.
- issue: Traduction de κύριος
  choice: Seigneur
  alternative: Maître
  rationale: « Seigneur » est le rendu français normal de κύριος dans cette formule paulinienne et préserve sa portée confessionnelle et relationnelle.
- issue: Portée de ἐν κυρίῳ
  choice: rattacher « dans le Seigneur » aux salutations d’Aquilas, de Prisca et de l’Église domestique
  alternative: comprendre l’expression comme qualifiant plus étroitement l’intensité ou la manière de saluer
  rationale: La syntaxe associe la formule à l’ensemble de la seconde salutation. La traduction conserve sa relative souplesse plutôt que de la paraphraser comme « en tant que croyants ».
translation_notes:
  register: Français international moderne, naturel et digne. Le vocabulaire ecclésial traditionnel (« Églises », « Seigneur ») est conservé parce qu’il correspond précisément à l’usage paulinien. La répétition de « vous saluent » reflète celle du grec, tandis que « chaleureusement » rend l’intensification de πολλὰ.
