  text: ἐὰν δὲ ⸂ἄξιον ᾖ⸃ τοῦ κἀμὲ πορεύεσθαι, σὺν ἐμοὶ πορεύσονται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/004.yaml
  text: And if it is worthwhile for me to go also, they will go with me.
translation:
  language: fr
  text: Et s’il convient que j’aille moi aussi[a], ils iront avec moi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « si cela vaut la peine que j’aille moi aussi ». L’expression grecque peut désigner ce qui est approprié, indiqué ou justifié par les circonstances.
    reason: Alternative lexicale pour ἄξιον ᾖ, dont la portée peut relever soit de la convenance, soit de l’opportunité pratique.
lexical_decisions:
- source_word: ἐὰν δὲ
  choice: Et si
  rationale: ἐάν introduit la condition et δέ assure ici une transition légère; « Et si » prolonge naturellement le verset précédent sans créer une opposition trop forte.
- source_word: ἄξιον ᾖ
  choice: s’il convient
  rationale: L’adjectif neutre avec ᾖ forme une expression impersonnelle indiquant ce qui est approprié ou justifié dans les circonstances. « Il convient » rend ce sens plus précisément que le calque « il est digne ».
- source_word: τοῦ κἀμὲ πορεύεσθαι
  choice: que j’y aille moi aussi
  rationale: L’infinitif articulé précise l’action jugée convenable, et κἀμέ ajoute Paul aux personnes qui feront le déplacement. Le pronom « y » explicite naturellement en français la destination déjà donnée par le contexte.
- source_word: σὺν ἐμοὶ
  choice: avec moi
  rationale: σύν suivi du datif exprime directement l’accompagnement.
- source_word: πορεύσονται
  choice: ils partiront
  rationale: Le futur indique le déplacement des délégués. « Partiront » est idiomatique ici et évite la répétition peu naturelle de « aller » en français, sans renforcer le sens jusqu’à « m’accompagneront ».
theological_decisions:
- issue: Sens de la condition concernant le déplacement de Paul avec la délégation
  choice: Paul affirme que, si son propre déplacement est jugé approprié, les délégués partiront avec lui.
  alternative: Le don serait assez important pour justifier le déplacement de Paul; ou Paul serait lui-même digne d’y aller.
  rationale: ἄξιον est employé impersonnellement, et le groupe infinitif désigne l’action dont le caractère approprié est évalué. Le texte ne porte donc pas directement sur la dignité morale de Paul. Une note conserve toutefois la nuance possible de valeur pratique ou d’opportunité.
translation_notes:
  register: Français international moderne, naturel et digne. « Il convient » conserve le caractère impersonnel de l’expression grecque; « moi aussi » maintient la valeur additive de κἀμέ. La note préserve l’ambiguïté lexicale réelle sans suggérer que le texte évalue la dignité personnelle de Paul.
