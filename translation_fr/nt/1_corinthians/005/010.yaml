id: 1CO.5.10
reference: 1 Corinthians 5:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸀οὐ πάντως τοῖς πόρνοις τοῦ κόσμου τούτου ἢ τοῖς πλεονέκταις ⸀καὶ ἅρπαξιν ἢ εἰδωλολάτραις, ἐπεὶ ⸀ὠφείλετε ἄρα ἐκ τοῦ κόσμου ἐξελθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/010.yaml
  text: not at all meaning the sexually immoral of this world[a], or the greedy and swindlers, or idolaters[b], since then you would have to go out of the world.
translation:
  language: fr
  text: Je ne voulais absolument pas parler de ceux de ce monde qui vivent dans l’immoralité sexuelle, ni des gens avides et des escrocs[a], ni des idolâtres. Autrement, vous devriez sortir du monde[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «des voleurs» ou «des extorqueurs». Le terme grec désigne ceux qui s’emparent du bien d’autrui par la force ou l’exploitation.
    reason: lexical_alternative
  - marker: b
    text: Paul précise qu’il ne demandait pas aux croyants d’éviter toutes les personnes immorales extérieures à l’Église; voir 1 Corinthiens 5.11.
    reason: cross_reference
lexical_decisions:
- source_word: οὐ πάντως
  choice: Je ne voulais absolument pas parler de
  rationale: Dans le contexte, Paul précise la portée d’une consigne antérieure. Cette formulation française rend naturellement la négation emphatique sans transformer πάντως en négation d’une fréquence.
- source_word: πόρνοις
  choice: ceux ... qui vivent dans l’immoralité sexuelle
  rationale: La formulation conserve la spécificité sexuelle de πόρνοις tout en restant claire, actuelle et non archaïque.
- source_word: τοῦ κόσμου τούτου
  choice: de ce monde
  rationale: κόσμος désigne ici le monde humain extérieur à la communauté chrétienne; «de ce monde» en conserve la concision et l’opposition contextuelle.
- source_word: πλεονέκταις
  choice: des gens avides
  rationale: πλεονέκταις désigne des personnes dominées par le désir d’avoir davantage, souvent aux dépens d’autrui. «Avides» est idiomatique et accessible.
- source_word: καὶ ἅρπαξιν
  choice: et des escrocs
  rationale: ἅρπαξιν évoque ceux qui s’emparent du bien d’autrui par la force ou l’exploitation. «Escrocs» exprime clairement l’exploitation, tandis qu’une note conserve les autres nuances possibles.
- source_word: εἰδωλολάτραις
  choice: des idolâtres
  rationale: Terme français précis, concis et couramment compris pour ceux qui rendent un culte aux idoles.
- source_word: ἐπεὶ ... ἄρα
  choice: Autrement
  rationale: La combinaison introduit la conséquence absurde qui résulterait d’une interprétation absolue de la consigne antérieure.
- source_word: ὠφείλετε
  choice: vous devriez
  rationale: Dans ce raisonnement conditionnel implicite, l’imparfait exprime une nécessité qui découlerait de l’hypothèse. «Vous devriez» la rend sans ajouter une obligation morale indépendante.
- source_word: ἐκ τοῦ κόσμου ἐξελθεῖν
  choice: sortir du monde
  rationale: Cette traduction conserve l’image vive et volontairement radicale de quitter le monde lui-même.
theological_decisions:
- issue: Portée de la séparation demandée dans le contexte
  choice: Paul nie que sa consigne antérieure exige une séparation totale d’avec les personnes non croyantes qui pratiquent ces comportements.
  alternative: Paul ordonnerait un retrait social complet d’avec toute personne immorale.
  rationale: La conséquence énoncée — devoir sortir du monde — montre que Paul limite explicitement la portée de sa consigne. La traduction conserve cette clarification sans anticiper plus que le verset.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase a été légèrement restructurée pour rendre explicite en français la clarification elliptique de Paul. «Sortir du monde» préserve la force rhétorique de la conclusion.
