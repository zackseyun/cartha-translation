  naturalness: « On rapporte bel et bien qu’il y a… » est naturel en français moderne et restitue à la fois le passif de ἀκούεται et l’accent de ὅλως. « Immoralité sexuelle » est plus idiomatique et usuel dans ce registre que « inconduite sexuelle ».
  terminology: « Non-Juifs » rend de façon claire et non péjorative ἔθνεσιν dans le contraste paulinien; la note conserve les alternatives. « La femme de son père » préserve la formulation non spécialisée du grec sans imposer « belle-mère ».
