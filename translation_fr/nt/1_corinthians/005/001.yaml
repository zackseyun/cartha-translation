id: 1CO.5.1
reference: 1 Corinthians 5:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ὅλως ἀκούεται ἐν ὑμῖν πορνεία, καὶ τοιαύτη πορνεία ἥτις οὐδὲ ἐν τοῖς ⸀ἔθνεσιν, ὥστε γυναῖκά τινα τοῦ πατρὸς ἔχειν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/001.yaml
  text: 'It is actually reported that there is sexual immorality among you, and sexual immorality of such a kind as is not even found among the Gentiles: a man has his father’s wife.'
translation:
  language: fr
  text: 'On rapporte bel et bien qu’il y a parmi vous de l’immoralité sexuelle, et même une immoralité sexuelle telle qu’on n’en trouve pas parmi les non-Juifs[a] : un homme a la femme de son père[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « parmi les nations »; on peut aussi traduire « parmi les païens ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « avoir la femme de son père », c’est-à-dire être engagé dans une relation sexuelle avec elle. Il s’agit peut-être de sa belle-mère.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅλως
  choice: partout
  rationale: Dans ce contexte, l’adverbe souligne que l’affaire est largement connue et rapportée. « On entend partout parler » rend naturellement la tournure Ὅλως ἀκούεται tout en conservant sa force scandalisée.
- source_word: ἀκούεται
  choice: on entend parler
  rationale: Le passif indique qu’une chose se raconte ou est rapportée. La tournure impersonnelle française est naturelle et reste proche de l’image auditive du grec.
- source_word: ἐν ὑμῖν
  choice: parmi vous
  rationale: La formule situe la conduite au sein de la communauté corinthienne.
- source_word: πορνεία
  choice: inconduite sexuelle
  rationale: Le terme grec désigne largement des relations sexuelles illicites. « Inconduite sexuelle » est actuel, compréhensible et moins étroit que « fornication ».
- source_word: τοιαύτη πορνεία
  choice: une inconduite telle
  rationale: Cette formulation conserve la force qualitative et emphatique de τοιαύτη sans alourdir le français.
- source_word: ἥτις οὐδὲ ἐν τοῖς ἔθνεσιν
  choice: qu’on n’en trouve même pas parmi les non-Juifs
  rationale: La relative précise le caractère exceptionnel de l’inconduite. « On n’en trouve » explicite naturellement en français l’ellipse grecque; « les non-Juifs » rend ici clairement le contraste exprimé par ἔθνη.
- source_word: ὥστε
  choice: ':'
  rationale: Ici, ὥστε introduit le fait concret qui caractérise l’inconduite dénoncée. Les deux-points remplissent cette fonction naturellement en français.
- source_word: γυναῖκά τινα τοῦ πατρὸς
  choice: la femme de son père
  rationale: Cette expression suit l’idiome grec sans imposer le terme interprétatif « belle-mère ».
- source_word: ἔχειν
  choice: a
  rationale: Le grec emploie « avoir » de manière concise, vraisemblablement pour une relation conjugale ou sexuelle. Garder « a » préserve cette retenue et cette ambiguïté relative.
theological_decisions:
- issue: Sens de ἔθνεσιν dans le contraste paulinien
  choice: les non-Juifs
  alternative: les nations; les païens
  rationale: « Non-Juifs » exprime clairement le contraste ethno-religieux sans la connotation potentiellement péjorative de « païens ». La note conserve les autres possibilités lexicales.
- issue: Identification de la femme
  choice: la femme de son père
  alternative: sa belle-mère
  rationale: Le grec ne donne pas un terme de parenté spécialisé. La traduction retenue n’affirme donc pas davantage que le texte, même si une belle-mère est probablement en vue.
- issue: Portée de ἔχειν
  choice: un homme a la femme de son père
  alternative: un homme entretient une relation sexuelle avec la femme de son père
  rationale: La formulation littérale conserve l’euphémisme et ne tranche pas entre possession conjugale, cohabitation et relation sexuelle, même si le contexte indique clairement une union sexuelle illicite.
translation_notes:
  register: Français international moderne, digne et direct. La phrase conserve le ton d’indignation de Paul sans vocabulaire archaïque. « Inconduite sexuelle » est accessible tout en gardant la portée générale de πορνεία; les notes signalent les principales possibilités sans les imposer au texte.
