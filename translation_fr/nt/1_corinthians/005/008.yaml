source:
  edition: SBLGNT
  text: ὥστε ἑορτάζωμεν, μὴ ἐν ζύμῃ παλαιᾷ μηδὲ ἐν ζύμῃ κακίας καὶ πονηρίας, ἀλλ’ ἐν ἀζύμοις εἰλικρινείας καὶ ἀληθείας.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/008.yaml
  text: Therefore let us keep the feast[a], not with old leaven, nor with the leaven of malice and wickedness[b], but with the unleavened bread of sincerity and truth.
translation:
  language: fr
  text: Célébrons donc la fête[a], non avec du vieux levain, ni avec le levain de la malice et de la méchanceté, mais avec les pains sans levain[b] de la sincérité et de la vérité.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « faisons la fête » ou « observons la fête ». Le grec prolonge l’image de la fête de la Pâque employée au verset précédent.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « les [choses] sans levain de la sincérité et de la vérité » ; « pains » est ajouté pour rendre clairement l’image de la Pâque.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: donc
  rationale: Marque naturellement en français la conclusion tirée de l’argument précédent.
- source_word: ἑορτάζωμεν
  choice: Célébrons la fête
  rationale: Le subjonctif présent a ici une valeur exhortative. Cette formulation naturelle conserve l’image de la fête de la Pâque développée dans le contexte immédiat.
- source_word: ζύμῃ παλαιᾷ
  choice: avec du vieux levain
  rationale: « Levain » préserve l’image biblique et pascale; « avec » rend idiomatiquement la préposition ἐν dans cette métaphore.
- source_word: κακίας
  choice: méchanceté
  rationale: Exprime ici la mauvaise disposition morale ou la malignité, tout en restant distinct de πονηρία.
- source_word: πονηρίας
  choice: perversité
  rationale: Rend la notion de mal moral actif et conserve une distinction intelligible avec « méchanceté ».
- source_word: ἀλλ’ ἐν ἀζύμοις
  choice: mais avec les pains sans levain
  rationale: Le grec emploie substantivement l’adjectif pluriel « sans levain ». L’ajout de « pains », signalé en note, explicite naturellement l’image pascale en français.
- source_word: εἰλικρινείας
  choice: sincérité
  rationale: Rend l’idée de pureté sans mélange et d’authenticité, en contraste avec l’action corruptrice du levain.
- source_word: ἀληθείας
  choice: vérité
  rationale: Équivalent direct et naturel qui conserve la coordination avec « sincérité ».
theological_decisions:
- issue: Image de la Pâque et de la fête dans l’exhortation de Paul
  choice: Conserver « Célébrons la fête » et « les pains sans levain ».
  alternative: Employer une exhortation plus générale telle que « célébrons » ou « vivons dans la sincérité et la vérité ».
  rationale: Le contexte immédiat présente le Christ comme l’agneau pascal (v. 7). Garder l’image de la fête et des pains sans levain respecte donc le développement de Paul sans décider si ses paroles prescrivent l’observance littérale d’une fête.
translation_notes:
  register: Français international moderne, digne et accessible. « Levain » et « pains sans levain » maintiennent la résonance biblique sans recourir au terme plus spécialisé « azymes ».
