  text: ἐν τῷ ὀνόματι τοῦ κυρίου ἡμῶν ⸀Ἰησοῦ, συναχθέντων ὑμῶν καὶ τοῦ ἐμοῦ πνεύματος σὺν τῇ δυνάμει τοῦ κυρίου ἡμῶν ⸁Ἰησοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/004.yaml
  text: In the name of our Lord Jesus[a], when you are assembled, and my spirit is with you, with the power of our Lord Jesus,
translation:
  language: fr
  text: Au nom de notre Seigneur Jésus, lorsque vous serez rassemblés et que mon esprit sera avec vous, avec la puissance de notre Seigneur Jésus,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν τῷ ὀνόματι
  choice: Au nom de
  rationale: Expression française naturelle qui conserve l’idiome grec et peut évoquer l’autorité sous laquelle l’action est accomplie.
- source_word: κυρίου
  choice: Seigneur
  rationale: Titre néotestamentaire usuel, qui préserve ici sa portée christologique.
- source_word: Ἰησοῦ
  choice: Jésus
  rationale: Forme française conventionnelle du nom propre.
- source_word: συναχθέντων ὑμῶν
  choice: lorsque vous serez rassemblés
  rationale: Rend le génitif absolu et le participe aoriste passif par une proposition temporelle naturelle, sans préciser abusivement qui rassemble l’assemblée.
- source_word: τοῦ ἐμοῦ πνεύματος
  choice: que mon esprit sera avec vous
  rationale: Explicite avec retenue la construction grecque elliptique et exprime la participation non corporelle de Paul sans en définir le mécanisme.
- source_word: σὺν
  choice: avec
  rationale: Rend simplement l’idée d’accompagnement portée par la préposition.
- source_word: δυνάμει
  choice: puissance
  rationale: Conserve le sens de force efficace, plus large que la seule autorité institutionnelle.
- source_word: τοῦ κυρίου ἡμῶν Ἰησοῦ
  choice: de notre Seigneur Jésus
  rationale: Maintient le génitif, laissant ouverte sa nuance précise de possession ou de source.
theological_decisions:
- issue: Nature de la présence de Paul dans l’assemblée
  choice: « mon esprit sera avec vous » affirme une présence réelle mais non corporelle.
  alternative: Comprendre « mon esprit » comme la seule disposition ou intention de Paul, ou comme une présence mystique définie plus fortement.
  rationale: Le grec affirme la participation de l’esprit de Paul sans expliquer son mode; la traduction préserve cette tension.
- issue: Rapport syntaxique de « au nom de notre Seigneur Jésus » et de « avec la puissance de notre Seigneur Jésus »
  choice: Conserver l’enchaînement grec sans rattacher explicitement ces groupes à un verbe du verset suivant.
  alternative: Les rattacher par anticipation à l’action disciplinaire commandée en 1 Corinthiens 5.5.
  rationale: Le verset constitue une phrase syntaxiquement suspendue qui se poursuit au verset suivant; une explicitation ici trancherait une ambiguïté de rattachement.
translation_notes:
  register: Français international moderne, digne et lisible. La ponctuation sobre conserve le caractère condensé et syntaxiquement inachevé du verset, qui se poursuit en 1 Corinthiens 5.5.
