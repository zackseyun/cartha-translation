source:
  edition: SBLGNT
  text: Οὐ καλὸν τὸ καύχημα ὑμῶν. οὐκ οἴδατε ὅτι μικρὰ ζύμη ὅλον τὸ φύραμα ζυμοῖ;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/006.yaml
  text: Your boasting is not good[a]. Do you not know that a little leaven leavens the whole batch of dough?
translation:
  language: fr
  text: Il n’est pas bon que vous vous vantiez. Ne savez-vous pas qu’un peu de levain fait lever toute la pâte ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καλὸν
  choice: bon
  rationale: Dans cette réprimande, καλόν porte une appréciation morale et pratique. « Bon » rend directement cette évaluation sans l’alourdir.
- source_word: καύχημα
  choice: que vous vous vantiez
  rationale: La tournure verbale est plus naturelle en français moderne que « votre vantardise » tout en conservant l’idée de se glorifier ou de tirer fierté de quelque chose.
- source_word: οὐκ οἴδατε
  choice: Ne savez-vous pas
  rationale: Cette formulation garde la question rhétorique et la tournure caractéristique employée par Paul.
- source_word: μικρὰ ζύμη
  choice: un peu de levain
  rationale: « Levain » correspond à l’image boulangère ancienne et maintient sa portée proverbiale et métaphorique.
- source_word: ὅλον τὸ φύραμα
  choice: toute la pâte
  rationale: φύραμα désigne ici la pâte pétrie; « toute la pâte » est clair, idiomatique et exprime la totalité marquée par ὅλον.
- source_word: ζυμοῖ
  choice: fait lever
  rationale: En français courant, le levain « fait lever » la pâte. Cette expression traduit naturellement l’action causative du verbe ζυμόω.
theological_decisions:
- issue: Image métaphorique du levain
  choice: Conserver l’image du levain sans en expliciter le référent moral dans le verset.
  alternative: Développer l’image en disant qu’un peu de péché corrompt toute l’Église.
  rationale: Paul énonce un proverbe imagé dont le contexte indique l’application. L’expliciter dans la traduction supprimerait la force de l’image et résoudrait ce que le texte laisse au lecteur d’appliquer.
translation_notes:
  register: Français moderne, naturel et digne. La première proposition est restructurée verbalement pour éviter le tour peu idiomatique « votre vantardise n’est pas bonne ». La question rhétorique et l’image proverbiale restent proches de la forme grecque.
