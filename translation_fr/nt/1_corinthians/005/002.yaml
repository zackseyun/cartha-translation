id: 1CO.5.2
reference: 1 Corinthians 5:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ὑμεῖς πεφυσιωμένοι ἐστέ, καὶ οὐχὶ μᾶλλον ἐπενθήσατε, ἵνα ⸀ἀρθῇ ἐκ μέσου ὑμῶν ὁ τὸ ἔργον τοῦτο ⸀ποιήσας;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/002.yaml
  text: And you are puffed up[a], and should you not rather have mourned, so that the one who did this deed might be removed from among you?
translation:
  language: fr
  text: Et vous, vous êtes gonflés d’orgueil ! N’auriez-vous pas dû plutôt prendre le deuil, afin que celui qui a commis cet acte soit ôté du milieu de vous[a] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « soit retiré d’entre vous ». Dans ce contexte, il s’agit probablement de sa mise à l’écart de l’assemblée dans le cadre d’une mesure disciplinaire.
    reason: alternative lexicale et clarification contextuelle
lexical_decisions:
- source_word: πεφυσιωμένοι
  choice: gonflés d’orgueil
  rationale: Cette expression conserve l’image de l’enflure employée par Paul tout en rendant explicite, en français naturel, qu’il s’agit d’orgueil. Le parfait décrit un état installé.
- source_word: οὐχὶ μᾶλλον
  choice: N’auriez-vous pas dû plutôt
  rationale: Cette tournure restitue la question rhétorique de reproche et oppose nettement leur attitude réelle à la réaction attendue.
- source_word: ἐπενθήσατε
  choice: prendre le deuil
  rationale: Le verbe exprime un deuil profond, plus fort qu’une simple tristesse. La locution française garde la dimension collective et solennelle du grec.
- source_word: ἵνα ἀρθῇ
  choice: afin que … soit ôté
  rationale: La construction conserve le passif et la valeur de but ou de résultat visé, sans préciser qui accomplit l’action.
- source_word: ἐκ μέσου ὑμῶν
  choice: du milieu de vous
  rationale: Cette formulation proche de l’idiome grec demeure claire en français et maintient le sens communautaire.
- source_word: ὁ τὸ ἔργον τοῦτο ποιήσας
  choice: celui qui a commis cet acte
  rationale: Cette formulation identifie l’auteur de l’acte sans ajouter de précision absente de la construction grecque; « commis » convient à la gravité du contexte.
theological_decisions:
- issue: Nature de l’action demandée envers l’auteur de l’acte
  choice: soit ôté du milieu de vous
  alternative: soit exclu de l’assemblée ; soit enlevé par Dieu
  rationale: Le contexte immédiat favorise une mise à l’écart disciplinaire, mais le passif grec ne nomme ni l’agent ni explicitement le mécanisme. La traduction conserve donc cette ouverture au lieu d’imposer « excommunié » ou une intervention divine mortelle.
translation_notes:
  register: Français international moderne, digne et direct. « Gonflés d’orgueil » préserve la métaphore paulinienne; « prendre le deuil » rend la force de la lamentation attendue. La ponctuation souligne le reproche sans durcir le texte au-delà du grec.
