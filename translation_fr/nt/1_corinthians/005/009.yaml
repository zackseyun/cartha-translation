  text: I wrote to you in the letter not to associate with sexually immoral people[c][b][a],
translation:
  language: fr
  text: Je vous ai écrit dans la lettre de ne pas fréquenter ceux qui vivent dans l’immoralité sexuelle[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans ma lettre ». Le grec peut désigner soit une lettre antérieure de Paul, soit un passage antérieur de la présente lettre.
    reason: alternative_reading
  - marker: b
    text: Ou « de ne pas vous mêler à » ou « de ne pas vous associer à ».
    reason: lexical_alternative
  - marker: c
    text: L’expression désigne des personnes dont la conduite est caractérisée par l’immoralité sexuelle.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔγραψα
  choice: Je vous ai écrit
  rationale: L’aoriste renvoie ici naturellement à un acte d’écriture antérieur. Le passé composé est idiomatique en français moderne et n’impose pas à lui seul l’idée d’une lettre aujourd’hui perdue.
- source_word: ὑμῖν
  choice: vous
  rationale: Le pronom au datif désigne les destinataires de l’écrit et se rend naturellement par le complément indirect « vous ».
- source_word: ἐν τῇ ἐπιστολῇ
  choice: dans la lettre
  rationale: Cette formulation respecte l’article défini grec et laisse ouverte la question de savoir s’il s’agit d’une lettre antérieure ou de la présente lettre.
- source_word: μὴ συναναμίγνυσθαι
  choice: de ne pas fréquenter
  rationale: Le verbe exprime le fait de se mêler à des personnes ou d’entretenir des relations avec elles. « Ne pas fréquenter » est clair et naturel, tout en évitant de suggérer nécessairement une interdiction de tout contact.
- source_word: πόρνοις
  choice: ceux qui vivent dans l’immoralité sexuelle
  rationale: Le nom pluriel désigne des personnes caractérisées par une conduite sexuellement immorale. Cette formulation moderne évite l’archaïsme et le sens potentiellement trop étroit de « débauchés » ou « fornicateurs ».
theological_decisions:
- issue: Identification de « la lettre »
  choice: Conserver la formulation définie « dans la lettre » sans identifier davantage l’écrit.
  alternative: Traduire « dans ma précédente lettre » ou comprendre une section antérieure de 1 Corinthiens.
  rationale: Le grec ἐν τῇ ἐπιστολῇ désigne une lettre déterminée connue des destinataires, mais ne tranche pas explicitement entre une lettre antérieure et la lettre présente.
- issue: Portée relationnelle de συναναμίγνυσθαι
  choice: Employer « fréquenter » sans préciser ici le degré ou le cadre des relations visées.
  alternative: Employer « avoir des relations avec », « se mêler à » ou « garder compagnie à ».
  rationale: Le verbe implique une association sociale, mais le verset isolé n’en définit pas encore précisément les limites. La traduction évite d’élargir l’interdiction à tout contact fortuit.
translation_notes:
  register: Français international moderne, clair et digne. Le passé composé convient à l’usage narratif courant. « Fréquenter » rend l’association sociale sans archaïsme; la périphrase finale explicite la référence personnelle de πόρνοις sans la réduire à une seule catégorie d’actes.
