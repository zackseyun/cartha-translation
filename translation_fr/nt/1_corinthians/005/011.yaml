revisions:
- from: Mais maintenant, je vous ai écrit de ne pas fréquenter quelqu’un qui, tout en se disant frère, vit dans l’immoralité sexuelle, est avide, idolâtre, insultant, ivrogne ou escroc. Avec une telle personne, ne mangez même pas.
  to: Mais maintenant, je vous ai écrit de ne pas vous associer à quelqu’un qui porte le nom de frère et qui est sexuellement immoral, avide, idolâtre, insultant, ivrogne ou escroc ; ne mangez même pas avec une telle personne.
  rationale: La révision corrige la voix et la portée de ὀνομαζόμενος, explicite la relation « manger avec » de συνεσθίειν, et choisit une expression plus exacte pour συναναμίγνυσθαι. Elle ne précise ni la nature du repas ni le statut spirituel réel de la personne.
