source:
  edition: SBLGNT
  text: νῦν δὲ ἔγραψα ὑμῖν μὴ συναναμίγνυσθαι ἐάν τις ἀδελφὸς ὀνομαζόμενος ᾖ πόρνος ἢ πλεονέκτης ἢ εἰδωλολάτρης ἢ λοίδορος ἢ μέθυσος ἢ ἅρπαξ, τῷ τοιούτῳ μηδὲ συνεσθίειν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/011.yaml
  text: But now I wrote to you not to associate with anyone who is called a brother if he is sexually immoral or greedy or an idolater or abusive or a drunkard or a swindler—not even to eat with such a person.
translation:
  language: fr
  text: Mais maintenant, je vous ai écrit de ne pas vous associer à quelqu’un qui porte le nom de frère et qui est sexuellement immoral, avide, idolâtre, insultant, ivrogne ou escroc ; ne mangez même pas avec une telle personne.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νῦν δὲ ἔγραψα
  choice: Mais maintenant, je vous ai écrit
  rationale: Le passé composé rend naturellement l’aoriste épistolaire ou rétrospectif en français, tout en conservant le contraste introduit par νῦν δέ.
- source_word: μὴ συναναμίγνυσθαι
  choice: de ne pas fréquenter
  rationale: Le verbe désigne le fait de se mêler étroitement à quelqu’un ou d’entretenir des rapports avec lui; «fréquenter» est naturel ici sans suggérer nécessairement une absence absolue de tout contact.
- source_word: ἀδελφὸς ὀνομαζόμενος
  choice: qui, tout en se disant frère
  rationale: Cette formulation préserve la portée déclarative de ὀνομαζόμενος sans trancher explicitement la question de l’authenticité spirituelle de la personne.
- source_word: πόρνος
  choice: vit dans l’immoralité sexuelle
  rationale: Le substantif caractérise une personne par une conduite sexuelle immorale; cette tournure est claire et idiomatique en français moderne.
- source_word: πλεονέκτης
  choice: avide
  rationale: «Avide» exprime le désir cupide d’avoir davantage et convient à une liste de traits caractérisant une personne.
- source_word: λοίδορος
  choice: insultant
  rationale: Le terme désigne quelqu’un qui outrage ou injurie autrui; «insultant» est compréhensible et vise une conduite habituelle.
- source_word: ἅρπαξ
  choice: escroc
  rationale: Le mot évoque une personne rapace qui s’empare du bien d’autrui ou exploite les autres; «escroc» communique concrètement cette prédation.
- source_word: μηδὲ συνεσθίειν
  choice: ne mangez même pas
  rationale: Rend directement l’intensification de μηδέ et l’infinitif «manger avec», sans préciser de façon injustifiée s’il s’agit d’un repas ordinaire ou cultuel.
theological_decisions:
- issue: Statut de la personne appelée «frère»
  choice: «qui, tout en se disant frère»
  alternative: «qui porte le nom de frère» / «qui est appelé frère»
  rationale: Le grec indique qu’elle est désignée comme frère, mais ne décide pas explicitement si cette profession est authentique; la traduction conserve cette tension.
- issue: Portée du repas interdit
  choice: «Avec une telle personne, ne mangez même pas» sans qualification
  alternative: Préciser «ne partagez même pas le repas du Seigneur» ou «aucun repas»
  rationale: Le texte ne nomme ni la Cène ni une catégorie précise de repas; aucune interprétation confessionnelle n’est donc ajoutée.
translation_notes:
  register: Français international moderne, direct et digne. La liste conserve sa force morale sans archaïsmes. «Tout en se disant frère» explicite naturellement la construction grecque tout en maintenant son ambiguïté théologique.
