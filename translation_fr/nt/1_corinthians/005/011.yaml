review_pass:
  verdict: revise
  source_fidelity: La liste et l’interdiction finale reflètent bien le grec. Toutefois, « tout en se disant frère » transforme le passif ὀνομαζόμενος (« appelé / connu comme frère ») en une auto-désignation et réduit l’ambiguïté conservée par le texte. « Ne mangez même pas » sans complément explicite est aussi moins fidèle et moins clair que la construction grecque, qui vise le fait de manger avec cette personne.
  naturalness: Le français est globalement moderne et naturel. « Ne pas vous associer à » exprime plus précisément συναναμίγνυσθαι que « ne pas fréquenter », lequel peut avoir en français contemporain des connotations sociales ou sentimentales non pertinentes. La reprise explicite de « avec une telle personne » rend la dernière injonction idiomatique.
  terminology: « Porte le nom de frère » conserve la formulation désignative sans juger de la sincérité de l’appartenance communautaire. « Sexuellement immoral », « avide », « idolâtre », « insultant », « ivrogne » et « escroc » sont des équivalents modernes acceptables pour les catégories grecques; « escroc » est retenu conformément à l’orientation « swindler » de la piste d’audit anglaise.
  issues:
  - severity: medium
    issue: « qui, tout en se disant frère » rend ὀνομαζόμενος comme une auto-affirmation.
    rationale: 'Ὀνομαζόμενος est un participe passif : la personne est appelée ou connue comme « frère ». Le grec ne dit pas qu’elle se donne elle-même ce titre; « porte le nom de frère » préserve la nuance et l’ambiguïté.'
  - severity: medium
    issue: La dernière phrase ne dit pas explicitement « manger avec » cette personne.
    rationale: Συνεσθίειν comporte le partage du repas avec autrui. « Ne mangez même pas avec une telle personne » restitue ce complément et évite une lecture où l’on ne devrait simplement pas manger en sa présence.
  - severity: low
    issue: « Fréquenter » est légèrement moins précis pour συναναμίγνυσθαι.
    rationale: « Ne pas vous associer à » rend plus directement l’idée de ne pas se mêler à / entretenir une association avec quelqu’un, sans importer une connotation particulière.
  revised_text: Mais maintenant, je vous ai écrit de ne pas vous associer à quelqu’un qui porte le nom de frère et qui est sexuellement immoral, avide, idolâtre, insultant, ivrogne ou escroc ; ne mangez même pas avec une telle personne.
