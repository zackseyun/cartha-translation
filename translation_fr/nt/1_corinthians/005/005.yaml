reference: 1 Corinthians 5:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: παραδοῦναι τὸν τοιοῦτον τῷ Σατανᾷ εἰς ὄλεθρον τῆς σαρκός, ἵνα τὸ πνεῦμα σωθῇ ἐν τῇ ἡμέρᾳ τοῦ ⸀κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/005.yaml
  text: to hand such a man over to Satan for the destruction of the flesh[b][a], so that the spirit may be saved in the day of the Lord.
translation:
  language: fr
  text: livrer un tel homme à Satan pour la destruction de la chair[a], afin que l’esprit soit sauvé au jour du Seigneur.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour la ruine de la chair ». L’expression peut désigner un jugement corporel sévère, ou, dans un sens plus figuré, la destruction de l’orientation charnelle et pécheresse de cet homme.
    reason: lexical_alternative
  - marker: b
    text: Certains manuscrits portent « de notre Seigneur Jésus » ou « du Seigneur Jésus » au lieu de simplement « du Seigneur ».
    reason: textual_variant
lexical_decisions:
- source_word: παραδοῦναι
  choice: livrer
  rationale: L’infinitif aoriste exprime l’action que Paul demande à l’assemblée d’accomplir. « Livrer à » est une tournure française naturelle et ferme qui correspond bien à παραδίδωμι.
- source_word: τὸν τοιοῦτον
  choice: un tel homme
  rationale: L’expression désigne l’auteur précis de la faute tout en conservant la portée catégorielle et le masculin singulier du grec.
- source_word: τῷ Σατανᾷ
  choice: à Satan
  rationale: Le nom propre est rendu selon sa forme française conventionnelle; le datif marque ici la personne à qui l’homme est livré.
- source_word: εἰς ὄλεθρον
  choice: pour la destruction
  rationale: ὄλεθρος peut désigner la destruction ou la ruine. « Destruction » conserve la gravité du terme sans préciser si les conséquences sont physiques ou figurées.
- source_word: τῆς σαρκός
  choice: de la chair
  rationale: « Chair » préserve l’ambiguïté de σάρξ entre le corps soumis à un jugement sévère et l’orientation charnelle ou pécheresse de l’homme.
- source_word: ἵνα
  choice: afin que
  rationale: Cette locution introduit clairement en français le but ou le résultat visé par l’action.
- source_word: τὸ πνεῦμα
  choice: l’esprit
  rationale: Le grec ne comporte aucun possessif explicite. « L’esprit » suit donc sa formulation et évite d’ajouter « son » dans le texte principal.
- source_word: σωθῇ
  choice: soit sauvé
  rationale: Le subjonctif aoriste passif après ἵνα exprime l’issue visée et conserve le langage sotériologique du grec.
- source_word: ἐν τῇ ἡμέρᾳ
  choice: au jour
  rationale: « Au jour » est une expression française naturelle dans ce contexte eschatologique et correspond à la valeur temporelle de la préposition.
- source_word: τοῦ κυρίου
  choice: du Seigneur
  rationale: Le texte SBLGNT fourni porte simplement κυρίου. La traduction n’ajoute ni « Jésus » ni « notre ».
theological_decisions:
- issue: Sens de « destruction de la chair »
  choice: Conserver dans le texte principal la formule ambiguë « destruction de la chair ».
  alternative: Un jugement corporel sévère, éventuellement la mort; ou la destruction de l’orientation charnelle et pécheresse de l’homme.
  rationale: Le grec ne tranche pas nettement entre ces interprétations. La traduction préserve donc cette tension et l’explicite en note.
- issue: Référent de « l’esprit »
  choice: Traduire τὸ πνεῦμα par « l’esprit » sans possessif.
  alternative: « son esprit »
  rationale: Le contexte peut désigner l’esprit de l’homme concerné, mais le grec n’emploie aucun possessif explicite; il convient de ne pas l’ajouter silencieusement.
- issue: Forme de l’expression eschatologique finale
  choice: Traduire le texte retenu par « au jour du Seigneur ».
  alternative: « au jour de notre Seigneur Jésus » ou « au jour du Seigneur Jésus »
  rationale: Ces formes plus longues sont attestées dans certains manuscrits, mais le texte source fourni lit simplement « du Seigneur ».
translation_notes:
  register: Français international moderne, naturel et digne. La formulation conserve les termes théologiquement chargés « chair », « esprit », « sauvé » et « Seigneur », sans résoudre les ambiguïtés du grec. Les marqueurs de notes sont placés immédiatement après les segments auxquels ils se rapportent.
