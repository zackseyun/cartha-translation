source:
  edition: SBLGNT
  text: τοὺς δὲ ἔξω ὁ θεὸς ⸀κρίνει; ⸀ἐξάρατε τὸν πονηρὸν ἐξ ὑμῶν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/013.yaml
  text: But God judges those outside[c][b][a]. Remove the evil person from among yourselves.
translation:
  language: fr
  text: Mais ceux du dehors[a], c’est Dieu qui les juge[b]. Enlevez le méchant du milieu de vous[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les gens de l’extérieur ».
    reason: lexical_alternative
  - marker: b
    text: 'Le verbe grec est au présent (« juge »), bien que certaines traductions emploient le futur : « jugera ».'
    reason: lexical_alternative
  - marker: c
    text: Ou « Chassez de votre milieu celui qui fait le mal ». La formulation fait écho aux injonctions du Deutéronome demandant d’ôter le mal du milieu d’Israël.
    reason: cross_reference
lexical_decisions:
- source_word: τοὺς ... ἔξω
  choice: ceux du dehors
  rationale: L’adverbe avec article désigne ici les personnes extérieures à la communauté chrétienne. « Ceux du dehors » conserve ce repère relationnel sans préciser davantage leur statut.
- source_word: δὲ
  choice: Mais
  rationale: La particule marque le contraste avec les membres de la communauté évoqués au verset précédent.
- source_word: κρίνει
  choice: juge
  rationale: Le présent de l’indicatif est conservé. Il peut exprimer une affirmation générale sur le jugement exercé par Dieu, sans imposer le futur adopté par certaines traductions.
- source_word: ἐξάρατε
  choice: Enlevez
  rationale: L’impératif aoriste appelle une action nette et décisive. « Enlevez » reste proche du verbe grec et n’ajoute aucun détail sur la procédure disciplinaire.
- source_word: τὸν πονηρὸν
  choice: le méchant
  rationale: L’adjectif substantivé au masculin singulier désigne concrètement l’auteur du mal dans ce contexte et reprend une formule du Deutéronome. « Le méchant » préserve à la fois la caractérisation morale et la forme singulière masculine.
- source_word: ἐξ ὑμῶν αὐτῶν
  choice: du milieu de vous
  rationale: Cette formulation française naturelle exprime l’exclusion d’une personne qui se trouve au sein de la communauté, tout en restant proche de l’idiome grec.
theological_decisions:
- issue: Nature de l’ordre relatif à la discipline communautaire
  choice: Le verset ordonne à la communauté d’écarter de son sein l’homme qui fait le mal, tandis que le jugement des personnes extérieures relève de Dieu.
  alternative: L’ordre peut être compris plus généralement comme l’élimination du mal au sein de la communauté, sans désigner explicitement une exclusion formelle.
  rationale: Le contexte immédiat concerne un cas précis d’inconduite au sein de l’Église et oppose la responsabilité de la communauté envers les siens au jugement divin des personnes extérieures. La traduction rend cette action communautaire sans introduire une terminologie ecclésiastique ultérieure.
translation_notes:
  register: Français international actuel, clair et digne. La tournure disloquée « ceux du dehors, c’est Dieu qui les juge » rend naturellement l’accent placé sur Dieu en grec. « Le méchant » conserve l’écho scripturaire et la référence masculine singulière du contexte, sans ajouter de vocabulaire confessionnel.
