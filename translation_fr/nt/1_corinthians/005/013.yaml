review_pass:
  verdict: approve
  source_fidelity: Le contraste introduit par δέ est bien rendu par « Mais ». « Ceux du dehors » reflète correctement l’expression substantivée τοὺς ἔξω sans définir abusivement qui sont ces personnes. Le présent κρίνει est conservé, et « c’est Dieu qui les juge » restitue naturellement l’opposition avec la responsabilité communautaire évoquée dans le contexte. « Enlevez le méchant du milieu de vous » rend l’impératif aoriste ἐξάρατε, le masculin singulier substantivé τὸν πονηρόν et l’expression communautaire ἐξ ὑμῶν αὐτῶν sans ajouter de procédure ecclésiale.
  naturalness: Le français est clair, actuel et convient à un registre biblique international. La dislocation « ceux du dehors, c’est Dieu qui les juge » est idiomatique et met utilement Dieu en relief. « Le méchant » a une tonalité scripturaire appropriée et reste compréhensible; « du milieu de vous » est naturel dans ce registre.
  terminology: 'Les choix maintiennent les distinctions importantes : personnes extérieures à la communauté, jugement divin, et retrait d’un homme concret de la communauté. Le masculin de « le méchant » correspond à la forme grecque et au référent masculin du contexte immédiat. Les notes présentent des alternatives légitimes sans imposer une lecture confessionnelle.'
