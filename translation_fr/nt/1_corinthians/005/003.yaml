    rationale: Cette expression est possible en français, mais elle atténue la double référence grecque à l’acte (« ceci ») et à sa manière (« ainsi »). « Cet acte de cette manière » garde ces deux composantes sans imposer une interprétation supplémentaire.
  revised_text: En effet, moi, absent de corps mais présent en esprit[b], j’ai déjà jugé[a], comme si j’étais présent, celui qui a commis cet acte de cette manière.
