source:
  edition: SBLGNT
  text: Ἐγὼ μὲν γάρ, ⸀ἀπὼν τῷ σώματι παρὼν δὲ τῷ πνεύματι, ἤδη κέκρικα ὡς παρὼν τὸν οὕτως τοῦτο κατεργασάμενον
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/003.yaml
  text: For I[a], though absent in body but present in spirit, have already judged, as though present[b], the one who has done this thing.
translation:
  language: fr
  text: En effet, moi, absent de corps mais présent en esprit[b], j’ai déjà jugé[a], comme si j’étais présent, celui qui a commis cet acte de cette manière.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « j’ai déjà rendu mon jugement ».'
    reason: lexical_alternative
  - marker: b
    text: « Présent en esprit » renvoie très probablement à l’esprit propre de Paul plutôt qu’au Saint-Esprit.
    reason: lexical_alternative
lexical_decisions:
- source_word: γάρ
  choice: En effet
  rationale: Introduit naturellement en français l’explication qui se rattache au contexte précédent.
- source_word: ἀπὼν τῷ σώματι
  choice: absent de corps
  rationale: Conserve le contraste concis entre σώματι et πνεύματι sans suggérer que Paul est mort ou séparé métaphysiquement de son corps.
- source_word: παρὼν δὲ τῷ πνεύματι
  choice: mais présent en esprit
  rationale: Préserve l’expression et son contraste rhétorique avec l’absence corporelle, sans imposer une théorie précise de cette présence.
- source_word: ἤδη κέκρικα
  choice: j’ai déjà jugé
  rationale: Le passé composé rend un jugement déjà formulé et toujours valable; « jugé » reste proche de κρίνω.
- source_word: ὡς παρὼν
  choice: comme si j’étais présent
  rationale: Formulation française naturelle qui maintient la valeur comparative de ὡς.
- source_word: τὸν οὕτως τοῦτο κατεργασάμενον
  choice: celui qui a commis un tel acte
  rationale: Le participe substantivé désigne l’auteur, tandis que « un tel acte » exprime de façon idiomatique l’ensemble οὕτως τοῦτο sans ajouter explicitement « homme ».
theological_decisions:
- issue: Sens de « présent en esprit »
  choice: La traduction conserve l’expression comme renvoyant vraisemblablement à l’esprit propre de Paul et à sa présence non corporelle auprès de l’assemblée dans sa préoccupation et son jugement.
  alternative: Comprendre qu’il parle de la présence ou de l’inspiration du Saint-Esprit, ou encore d’une forme plus forte de présence mystique.
  rationale: Le contraste immédiat entre σώματι et πνεύματι favorise le corps et l’esprit de Paul. Une note signale cette lecture probable sans éliminer totalement l’ambiguïté de l’expression.
translation_notes:
  register: Français moderne, digne et accessible. La phrase garde la structure argumentative et le contraste corps-esprit du grec, tout en rendant οὕτως τοῦτο par l’expression française naturelle « un tel acte ».
