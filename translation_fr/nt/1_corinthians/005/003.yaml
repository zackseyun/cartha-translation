  source_fidelity: La phrase rend correctement le contraste entre l’absence corporelle et la présence « en esprit », ainsi que le parfait κέκρικα. Toutefois, « un tel acte » tend à fondre οὕτως (« ainsi/de cette manière ») et τοῦτο (« ceci/cet acte ») en une seule notion. Une formulation qui exprime les deux éléments est préférable.
  naturalness: Le français est moderne, clair et d’un registre approprié. « Absent de corps » est concis et idiomatique dans ce contexte, et « comme si j’étais présent » rend naturellement ὡς παρών.
  terminology: « En esprit » préserve volontairement l’ambiguïté du grec; la note propose avec prudence l’identification la plus probable à l’esprit de Paul. « Jugé » est juste dans le contexte disciplinaire et la note fournit une alternative légitime.
