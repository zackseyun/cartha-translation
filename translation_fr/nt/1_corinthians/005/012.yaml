  text: For what is it to me to judge outsiders? Is it not those inside that you are to judge?[a][b]
translation:
  language: fr
  text: En effet, est-ce à moi de juger ceux du dehors ? N’est-ce pas ceux du dedans que vous jugez[a] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'C’est-à-dire ceux qui font partie de la communauté chrétienne. On peut aussi comprendre : « N’est-ce pas ceux du dedans que vous devez juger ? »'
    reason: La note explicite le sens communautaire de « ceux du dedans » et signale la nuance possible de devoir portée par la question rhétorique et son contexte.
lexical_decisions:
- source_word: τί γάρ μοι
  choice: En effet, est-ce à moi
  rationale: La tournure idiomatique demande en quoi cette responsabilité incombe à Paul. « Est-ce à moi » est naturel en français, conserve la question rhétorique et rend γάρ par « en effet ».
- source_word: τοὺς ἔξω
  choice: ceux du dehors
  rationale: L’expression substantivée désigne les personnes extérieures à la communauté chrétienne. « Ceux du dehors » conserve nettement le contraste spatial et communautaire avec « ceux du dedans ».
- source_word: κρίνειν / κρίνετε
  choice: juger / vous jugez
  rationale: « Juger » garde la portée assez large du verbe grec, tout en permettant au contexte de préciser qu’il s’agit du jugement disciplinaire. L’indicatif « vous jugez » préserve l’ambiguïté entre constat et responsabilité implicite, sans transformer explicitement la forme en obligation.
- source_word: οὐχὶ
  choice: N’est-ce pas
  rationale: Cette formulation introduit naturellement en français une question qui attend une réponse affirmative.
- source_word: τοὺς ἔσω
  choice: ceux du dedans
  rationale: Ce choix reproduit le parallélisme avec « ceux du dehors » et désigne les membres de la communauté, précision donnée en note plutôt qu’intégrée au texte.
theological_decisions:
- issue: Portée du jugement opposant ceux du dehors à ceux du dedans
  choice: Conserver l’opposition entre personnes extérieures et intérieures à la communauté, dans le cadre du jugement évoqué par Paul.
  alternative: Formuler explicitement une obligation de discipline ecclésiale ou une règle générale concernant tout jugement moral.
  rationale: Le contexte concerne la discipline au sein de la communauté, mais le verset garde une formulation rhétorique concise. La traduction n’étend ni ne restreint davantage l’affirmation et préserve l’indicatif grec.
translation_notes:
  register: Français international moderne, digne et direct. Le parallélisme « ceux du dehors / ceux du dedans » suit étroitement le grec et évite de surinterpréter ὑμεῖς κρίνετε.
