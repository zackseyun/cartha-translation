  text: ἐκκαθάρατε τὴν παλαιὰν ζύμην, ἵνα ἦτε νέον φύραμα, καθώς ἐστε ἄζυμοι. καὶ γὰρ τὸ πάσχα ⸀ἡμῶν ἐτύθη Χριστός·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/007.yaml
  text: Clean out the old leaven[a], so that you may be a new batch, just as you are unleavened. For Messiah, our Passover lamb[b], has been sacrificed.
translation:
  language: fr
  text: Faites disparaître le vieux levain, afin que vous soyez une pâte nouvelle, comme vous êtes sans levain. Car le Messie, notre Pâque[a], a été sacrifié.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « notre Pâque ». Dans ce contexte, l’expression peut désigner l’agneau ou la victime offerte pour la Pâque.'
    reason: 'Précision lexicale : πάσχα peut désigner la Pâque ainsi que son sacrifice ; « agneau » est implicite, non exprimé dans le grec.'
lexical_decisions:
- source_word: ἐκκαθάρατε
  choice: Faites disparaître
  rationale: L’impératif aoriste appelle la communauté à ôter entièrement ce qui corrompt. « Faites disparaître » est naturel en français et conserve la force du préverbe ἐκ- sans employer une tournure archaïque.
- source_word: τὴν παλαιὰν ζύμην
  choice: le vieux levain
  rationale: « Levain » maintient l’image de la Pâque et son lien avec « sans levain »; « vieux » exprime παλαιάν et évoque l’ancienne influence corruptrice.
- source_word: ἵνα ἦτε νέον φύραμα
  choice: afin d’être une pâte nouvelle
  rationale: « Afin de » rend la finalité exprimée par ἵνα. φύραμα désigne une masse de pâte; « pâte nouvelle » restitue clairement l’image boulangère en français courant.
- source_word: καθώς ἐστε ἄζυμοι
  choice: comme vous êtes sans levain
  rationale: La formulation conserve le rapport comparatif de καθώς ainsi que la tension entre l’exhortation à devenir une pâte nouvelle et l’identité déjà affirmée des destinataires.
- source_word: τὸ πάσχα ἡμῶν
  choice: notre Pâque
  rationale: Le grec dit littéralement « notre Pâque ». Cette formulation française préserve l’ambiguïté entre la fête et, dans ce contexte sacrificiel, la victime pascale, explicitée en note plutôt que dans le texte.
- source_word: ἐτύθη
  choice: a été sacrifié
  rationale: Le passif aoriste de θύω désigne ici la mise à mort sacrificielle. Le passé composé est idiomatique et exprime nettement ce sens.
- source_word: Χριστός
  choice: le Messie
  rationale: Dans ce contexte pascal, Χριστός garde une valeur nettement titulaire; « le Messie » la rend explicitement plutôt que de traiter le terme comme un nom propre.
theological_decisions:
- issue: Identification du Messie à τὸ πάσχα ἡμῶν
  choice: le Messie, notre Pâque
  alternative: le Messie, notre agneau pascal
  rationale: Le contexte et le verbe « sacrifier » orientent vers la victime pascale, mais le substantif « agneau » n’apparaît pas dans le grec. Le texte principal conserve donc la formulation concise et potentiellement plurivoque de Paul, tandis que la note en précise le référent probable.
- issue: Rapport entre l’exhortation et l’identité des destinataires
  choice: afin d’être une pâte nouvelle, comme vous êtes sans levain
  alternative: afin de devenir une pâte nouvelle, puisque vous êtes sans levain
  rationale: Le choix maintient sans l’aplanir la tension rhétorique entre ce que la communauté doit être et ce qu’elle est déjà déclarée être. Il évite de transformer καθώς en une relation causale univoque.
translation_notes:
  register: Français international moderne, digne et accessible. L’image cohérente du levain et de la pâte est conservée. La phrase finale reste concise et solennelle, sans ajouter « agneau » au texte principal.
