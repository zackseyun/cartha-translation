reference: 1 Corinthians 2:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τίς γὰρ ἔγνω νοῦν κυρίου, ὃς συμβιβάσει αὐτόν; ἡμεῖς δὲ νοῦν Χριστοῦ ἔχομεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/016.yaml
  text: For who has known the mind of the Lord[b][a], that he may instruct him? But we have the mind of Messiah.
translation:
  language: fr
  text: En effet, qui a connu la pensée du Seigneur[a] ? Qui l’instruira ? Mais nous, nous avons la pensée du Messie[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Paul fait écho à Ésaïe 40.13.
    reason: cross_reference
  - marker: b
    text: 'Ou : « la pensée du Christ ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τίς γὰρ
  choice: En effet, qui
  rationale: « En effet » marque naturellement en français le lien explicatif introduit par γάρ, tandis que « qui » conserve la forme directe de la question rhétorique.
- source_word: ἔγνω
  choice: a connu
  rationale: 'Le passé composé exprime l’accompli grec et maintient la portée actuelle de la question : personne n’est parvenu à connaître ainsi la pensée du Seigneur.'
- source_word: νοῦν
  choice: la pensée
  rationale: « Pensée » rend ici νοῦς de façon naturelle et digne, en englobant la compréhension et la manière de penser; le même terme est conservé dans les deux propositions pour préserver leur correspondance.
- source_word: κυρίου
  choice: du Seigneur
  rationale: « Seigneur » est le rendu établi de κύριος et préserve la résonance scripturaire de la citation d’Ésaïe 40.13.
- source_word: ὃς συμβιβάσει αὐτόν
  choice: pour pouvoir l’instruire
  rationale: 'Cette formulation française exprime naturellement la qualification ou la conséquence impliquée par la proposition relative grecque : qui le connaîtrait assez pour être en mesure de l’instruire.'
- source_word: ἡμεῖς δὲ
  choice: Mais nous, nous
  rationale: La dislocation avec reprise du pronom rend l’insistance explicite de ἡμεῖς et le contraste marqué par δέ dans un français courant.
- source_word: Χριστοῦ
  choice: du Messie
  rationale: Χριστός garde ici sa valeur de titre; « Messie » préserve sa portée d’oint attendu sans modifier l’affirmation théologique.
- source_word: ἔχομεν
  choice: avons
  rationale: Le présent simple reproduit la force déclarative directe du grec.
theological_decisions:
- issue: Sens de « la pensée du Seigneur » et du pronom dans « l’instruire »
  choice: Conserver la formulation de la citation sans expliciter davantage l’identité du référent
  alternative: Remplacer le pronom par « le Seigneur »
  rationale: Le grec emploie αὐτόν, et l’explicitation supprimerait inutilement la forme pronominale de la citation ainsi que sa tension rhétorique.
- issue: Rendu de Χριστοῦ dans νοῦν Χριστοῦ
  choice: la pensée du Messie
  alternative: la pensée du Christ
  rationale: Dans ce contexte, Χριστός peut être entendu comme un titre. Le texte principal rend cette valeur par « Messie », tout en signalant dans une note le rendu traditionnel également possible.
translation_notes:
  register: 'Français international moderne, naturel et soutenu sans archaïsme. La répétition « nous, nous » est intentionnelle : elle restitue l’emphase du pronom grec et souligne le contraste. La ponctuation garde la citation sous forme de question rhétorique.'
