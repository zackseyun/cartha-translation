  text: ἵνα ἡ πίστις ὑμῶν μὴ ᾖ ἐν σοφίᾳ ἀνθρώπων ἀλλ’ ἐν δυνάμει θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/005.yaml
  text: so that your faith might not be in the wisdom of men[a], but in the power of God.
translation:
  language: fr
  text: afin que votre foi ne repose pas sur la sagesse humaine, mais sur la puissance de Dieu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἵνα
  choice: afin que
  rationale: Introduit la proposition de but et en conserve clairement la valeur finale dans un français naturel.
- source_word: πίστις
  choice: foi
  rationale: Désigne ici la réponse croyante des Corinthiens; «foi» est le terme français courant et théologiquement non restrictif.
- source_word: μὴ ᾖ ἐν
  choice: ne repose pas sur
  rationale: Le grec dit littéralement «ne soit pas dans». Dans ce contexte, «reposer sur» exprime naturellement l'idée de fondement ou d'appui de la foi, tout en conservant le contraste parallèle.
- source_word: σοφίᾳ ἀνθρώπων
  choice: la sagesse humaine
  rationale: ἀνθρώπων désigne ici les êtres humains en général, sans opposition entre hommes et femmes. «Sagesse humaine» rend exactement ce sens générique en français moderne.
- source_word: δυνάμει θεοῦ
  choice: la puissance de Dieu
  rationale: 'Conserve le contraste entre ce qui sert d''appui à la foi: non la sagesse humaine, mais la puissance qui vient de Dieu.'
theological_decisions:
- issue: Portée de ἀνθρώπων
  choice: «humaine», au sens de l'humanité en général
  alternative: «des hommes»
  rationale: Le génitif pluriel est générique ici. En français contemporain, «sagesse humaine» transmet directement cette portée sans suggérer à tort une restriction au sexe masculin.
- issue: Valeur de ἐν dans le contraste
  choice: «repose sur»
  alternative: «soit dans»
  rationale: La formulation française explicite l'appui ou le fondement de la foi sans trancher davantage la relation théologique entre foi et puissance divine que ne le fait le contexte.
translation_notes:
  register: Français moderne, international et digne. La phrase demeure concise et conserve la structure de but ainsi que l'opposition nette entre sagesse humaine et puissance divine.
