  rationale: Remplacement de « l’époque actuelle » par « l’âge présent » afin de mieux rendre αἰών dans son sens temporel et paulinien, sans imposer une interprétation spatiale (« monde »). Une virgule après « car » améliore légèrement la ponctuation française. Le relatif féminin et les temps verbaux sont conservés, car ils correspondent à la sagesse évoquée dans le contexte et à la condition contraire aux faits du grec.
