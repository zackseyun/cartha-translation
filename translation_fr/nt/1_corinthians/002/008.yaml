  variant: modern international French
source:
  edition: SBLGNT
  text: ἣν οὐδεὶς τῶν ἀρχόντων τοῦ αἰῶνος τούτου ἔγνωκεν, εἰ γὰρ ἔγνωσαν, οὐκ ἂν τὸν κύριον τῆς δόξης ἐσταύρωσαν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/008.yaml
  text: which none of the rulers of this age has known[a], for if they had known it, they would not have crucified the Lord of glory.
translation:
  language: fr
  text: qu’aucun des dirigeants de l’âge présent n’a connue[a] ; car, s’ils l’avaient connue, ils n’auraient pas crucifié le Seigneur de gloire.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les « dirigeants de l’âge présent » peuvent désigner des autorités humaines, des puissances spirituelles, ou les deux.
    reason: alternative_reading
lexical_decisions:
- source_word: ἣν
  choice: qu’… connue
  rationale: Le pronom relatif féminin singulier renvoie à la sagesse mentionnée auparavant. L’accord du participe « connue » rend ce lien explicite et naturel en français.
- source_word: ἀρχόντων
  choice: dirigeants
  rationale: « Dirigeants » désigne ceux qui exercent un pouvoir tout en laissant ouverte la possibilité qu’il s’agisse d’autorités humaines, de puissances spirituelles, ou des deux.
- source_word: αἰῶνος τούτου
  choice: de l’époque actuelle
  rationale: Cette expression conserve le sens temporel de αἰών dans un français courant. « Ce monde » risquerait de privilégier une nuance spatiale.
- source_word: ἔγνωκεν / ἔγνωσαν
  choice: n’a connue / l’avaient connue
  rationale: « Connaître » traduit directement γινώσκω sans imposer le sens plus interprétatif de « comprendre ». Le plus-que-parfait convient à la condition contraire aux faits.
- source_word: κύριον
  choice: Seigneur
  rationale: Traduction consacrée de κύριος, qui préserve ici la portée du titre.
- source_word: δόξης
  choice: gloire
  rationale: « Gloire » est l’équivalent français usuel de δόξα et conserve sa résonance théologique.
- source_word: κύριον τῆς δόξης
  choice: le Seigneur de gloire
  rationale: Le maintien de la construction avec « de » préserve l’expression grecque, sa densité et son caractère élevé, sans la réduire à « le Seigneur glorieux ».
- source_word: ἐσταύρωσαν
  choice: crucifié
  rationale: « Crucifier » exprime directement le mode d’exécution précis désigné par σταυρόω.
theological_decisions:
- issue: Identité des « dirigeants de l’époque actuelle »
  choice: Formulation neutre qui ne précise pas leur identité
  alternative: Les autorités politiques et religieuses humaines ; les puissances spirituelles ou démoniaques ; ou une référence à la fois aux unes et aux autres
  rationale: L’expression grecque permet ces différentes lectures. La traduction conserve cette ambiguïté au lieu de trancher au-delà de ce que dit le verset.
translation_notes:
  register: Français moderne, digne et accessible. « Époque actuelle » est plus idiomatique que « âge présent » dans l’usage international courant, tandis que « Seigneur de gloire » conserve volontairement la formulation élevée et théologiquement dense du grec.
