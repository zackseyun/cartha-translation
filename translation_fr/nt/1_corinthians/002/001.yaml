review_pass:
  verdict: revise
  source_fidelity: 'La formulation proposée inverse légèrement la portée syntaxique : « vous annoncer ... avec des discours grandioses » peut faire des discours le moyen de l’annonce, alors que le grec qualifie d’abord la manière dont Paul est venu. La révision replace donc ce complément auprès de « je ne suis pas venu » et conserve le participe de proclamation.'
  naturalness: « Une éloquence ou une sagesse supérieure » est naturel dans un français international actuel, tout en étant plus proche de l’opposition grecque que « des discours grandioses ou une sagesse impressionnante ». « Vous annonçant » rend souplement le participe présent.
  terminology: « Frères et sœurs » communique le référent communautaire inclusif; la note indique la forme grecque littérale. « Témoignage de Dieu » conserve l’ambiguïté du génitif. L’appel de note de la variante est déplacé sur « témoignage », le mot effectivement concerné.
  issues:
