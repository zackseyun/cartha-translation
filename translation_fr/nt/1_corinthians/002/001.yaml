revisions:
- from: Et moi, frères et sœurs[a], lorsque je suis venu chez vous, je ne suis pas venu vous annoncer le témoignage de Dieu[b] avec des discours grandioses ou une sagesse impressionnante.
  to: Et moi, frères et sœurs[a], lorsque je suis venu chez vous, je ne suis pas venu avec une éloquence ou une sagesse supérieure, vous annonçant le témoignage[b] de Dieu.
  rationale: La révision rétablit la relation syntaxique du grec entre « je ne suis pas venu » et « avec une éloquence ou une sagesse supérieure », tout en gardant la répétition de « venu », le caractère proclamatoire de καταγγέλλων, l’ambiguïté de « témoignage de Dieu » et la variante textuelle signalée. Aucun choix doctrinal additionnel n’est introduit.
