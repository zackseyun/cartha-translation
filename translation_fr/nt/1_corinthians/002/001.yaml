    issue: Portée du complément « avec des discours grandioses ou une sagesse impressionnante »
    rationale: Dans le projet, ce complément suit « vous annoncer le témoignage de Dieu » et se lit facilement comme qualifiant l’annonce. En grec, οὐ καθ’ ὑπεροχὴν λόγου ἢ σοφίας dépend de ἦλθον (« je ne suis pas venu »); καταγγέλλων est ensuite participial.
  - severity: low
    issue: Ancre de la note textuelle
    rationale: La note sur μυστήριον porte sur μαρτύριον (« témoignage »), non sur « Dieu ». L’ancre est déplacée pour une référence textuelle précise.
