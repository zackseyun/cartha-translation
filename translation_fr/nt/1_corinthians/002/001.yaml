id: 1CO.2.1
reference: 1 Corinthians 2:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Κἀγὼ ἐλθὼν πρὸς ὑμᾶς, ἀδελφοί, ἦλθον οὐ καθ’ ὑπεροχὴν λόγου ἢ σοφίας καταγγέλλων ὑμῖν τὸ ⸀μαρτύριον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/001.yaml
  text: And I[a], when I came to you, brothers, did not come with lofty speech or wisdom[b], proclaiming to you the testimony of God.
translation:
  language: fr
  text: Et moi, frères et sœurs[a], lorsque je suis venu chez vous, je ne suis pas venu avec une éloquence ou une sagesse supérieure, vous annonçant le témoignage[b] de Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « frères »; dans ce contexte, le terme grec s’adresse à l’ensemble des croyants, femmes comprises.'
    reason: cultural_note
  - marker: b
    text: 'Certains manuscrits portent : « le mystère de Dieu ».'
    reason: textual_variant
lexical_decisions:
- source_word: Κἀγὼ
  choice: Et moi
  rationale: Conserve à la fois le lien exprimé par καί et la légère mise en relief du pronom sujet.
- source_word: ἐλθὼν πρὸς ὑμᾶς … ἦλθον
  choice: lorsque je suis venu chez vous, je ne suis pas venu
  rationale: Rend naturellement en français le participe circonstanciel suivi du verbe principal, tout en conservant la répétition rhétorique de la venue.
- source_word: ἀδελφοί
  choice: frères et sœurs
  rationale: Dans l’adresse à l’ensemble de la communauté, le masculin pluriel grec inclut ici naturellement les croyantes aussi bien que les croyants; cette formulation française moderne rend explicite cette portée sans employer un terme peu idiomatique.
- source_word: καθ’ ὑπεροχὴν λόγου ἢ σοφίας
  choice: avec des discours grandioses ou une sagesse impressionnante
  rationale: ὑπεροχή évoque la supériorité ou la prééminence; la formulation française communique l’éloquence et la sagesse qui cherchent à impressionner, sans réduire λόγος au seul style oratoire.
- source_word: καταγγέλλων
  choice: vous annoncer
  rationale: L’infinitif lié au verbe de mouvement est idiomatique en français et conserve l’idée d’une proclamation publique.
- source_word: μαρτύριον
  choice: le témoignage
  rationale: Suit le texte imprimé du SBLGNT et conserve le poids du substantif grec.
- source_word: τοῦ θεοῦ
  choice: de Dieu
  rationale: Le génitif français préserve l’ambiguïté entre un témoignage venant de Dieu et un témoignage à son sujet.
theological_decisions:
- issue: Variante textuelle en μαρτύριον
  choice: le témoignage de Dieu
  alternative: le mystère de Dieu
  rationale: Le texte de base SBLGNT porte μαρτύριον (« témoignage »). La variante μυστήριον (« mystère »), significative pour la traduction, est signalée en note.
- issue: Portée de ἀδελφοί
  choice: frères et sœurs
  alternative: frères
  rationale: Le vocatif masculin pluriel désigne dans ce contexte la communauté mixte de Corinthe. La traduction inclusive transmet le référent contextuel sans modifier l’identité théologique du groupe.
translation_notes:
  register: Français international actuel, digne et accessible. La phrase conserve la répétition grecque de « venir » et l’ambiguïté de « de Dieu ». Les deux appels de note [a] et [b] figurent dans le texte principal.
