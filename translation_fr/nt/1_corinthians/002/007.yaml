  to: 'Mais nous parlons de la sagesse de Dieu, mystérieuse[a] : la sagesse cachée que Dieu avait destinée d’avance[b], avant les siècles[c], pour notre gloire.'
  rationale: La révision remplace seulement « sous la forme d’un mystère », qui déplaçait le sens de la construction grecque, par « mystérieuse ». Cette solution est idiomatique en français moderne et, avec l’apposition « la sagesse cachée » ainsi que la note, conserve la portée paulinienne de μυστήριον sans en faire une énigme ni imposer une interprétation doctrinale.
