review_pass:
  verdict: revise
  source_fidelity: La phrase rend correctement l’opposition (« Mais »), la sagesse provenant de Dieu, son caractère caché, la détermination antérieure de Dieu, l’antériorité « avant les siècles » et la finalité « pour notre gloire ». Cependant, « sous la forme d’un mystère » interprète ἐν μυστηρίῳ comme une forme de présentation et ne rend pas bien la construction paulinienne, où « mystère » qualifie la sagesse comme auparavant cachée.
  naturalness: Le français est globalement clair et d’un registre approprié. « Sous la forme d’un mystère » est néanmoins peu idiomatique ici et suggère une apparence ou un format. « Mystérieuse » est plus naturel dans la syntaxe française tout en conservant l’ancrage lexical explicité par la note.
  terminology: « Sagesse de Dieu », « cachée », « destinée d’avance », « avant les siècles » et « gloire » sont recevables. « Destinée d’avance » traduit sans imposer de système doctrinal la détermination préalable de προώρισεν. La note sur « mystère » doit continuer de signaler le sens paulinien de dessein autrefois caché et désormais révélé.
