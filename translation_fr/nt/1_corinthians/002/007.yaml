source:
  edition: SBLGNT
  text: ἀλλὰ λαλοῦμεν ⸂θεοῦ σοφίαν⸃ ἐν μυστηρίῳ, τὴν ἀποκεκρυμμένην, ἣν προώρισεν ὁ θεὸς πρὸ τῶν αἰώνων εἰς δόξαν ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/007.yaml
  text: But we speak God's wisdom in a mystery[c][b][a], the hidden wisdom that God predestined before the ages for our glory.
translation:
  language: fr
  text: 'Mais nous parlons de la sagesse de Dieu, mystérieuse[a] : la sagesse cachée que Dieu avait destinée d’avance[b], avant les siècles[c], pour notre gloire.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans un mystère » ou « en secret ». Chez Paul, le mot grec traduit par « mystère » désigne souvent un dessein de Dieu autrefois caché et désormais révélé.
    reason: lexical_alternative
  - marker: b
    text: Ou « avait prédestinée » ou « avait décidée d’avance ».
    reason: lexical_alternative
  - marker: c
    text: Ou « avant tous les siècles ».
    reason: lexical_alternative
lexical_decisions:
- source_word: λαλοῦμεν
  choice: nous parlons
  rationale: Rend directement le verbe λαλέω et maintient le contraste introduit par ἀλλά sans renforcer indûment le sens en « proclamons ».
- source_word: θεοῦ σοφίαν
  choice: la sagesse de Dieu
  rationale: Le complément du nom exprime naturellement en français une sagesse qui appartient à Dieu et vient de lui.
- source_word: ἐν μυστηρίῳ
  choice: sous la forme d’un mystère
  rationale: Cette formulation française exprime la manière dont cette sagesse est communiquée tout en conservant le terme paulinien « mystère », qui désigne un dessein divin autrefois caché et désormais révélé.
- source_word: τὴν ἀποκεκρυμμένην
  choice: la sagesse cachée
  rationale: Le participe féminin renvoie à σοφίαν ; la répétition de « sagesse » clarifie l’apposition en français.
- source_word: προώρισεν
  choice: avait destinée d’avance
  rationale: Cette traduction garde la force de la détermination préalable exprimée par προορίζω, sans faire dépendre le verset d’un vocabulaire doctrinal spécialisé.
- source_word: πρὸ τῶν αἰώνων
  choice: avant les siècles
  rationale: Rendu formel de αἰῶνες qui conserve la perspective temporelle et cosmique du texte sans la paraphraser par « avant la création du monde ».
- source_word: εἰς δόξαν ἡμῶν
  choice: pour notre gloire
  rationale: Rend directement le but exprimé par εἰς et préserve le poids théologique de δόξα sans préciser davantage la nature de cette gloire.
theological_decisions:
- issue: La portée doctrinale de προώρισεν
  choice: avait destinée d’avance
  alternative: avait prédestinée
  rationale: Le choix retenu exprime une décision divine antérieure et ferme. La variante « prédestinée » demeure lexicalement possible, mais peut évoquer en français un système doctrinal plus large que l’affirmation précise du verset ; une note conserve cette possibilité sans affaiblir le grec.
- issue: Le sens paulinien de μυστήριον
  choice: mystère
  alternative: secret
  rationale: '« Mystère » conserve le terme théologique de Paul : non une énigme incompréhensible, mais un dessein de Dieu auparavant caché. « Secret » est possible, mais moins riche et plus réducteur.'
translation_notes:
  register: Français international moderne, digne et accessible. La structure appositionnelle du grec est rendue par deux-points pour faire comprendre que « la sagesse cachée » précise « la sagesse de Dieu ». Les notes maintiennent les principales possibilités lexicales sans résoudre les tensions théologiques du texte.
