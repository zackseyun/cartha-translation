id: 1CO.2.2
reference: 1 Corinthians 2:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὐ γὰρ ἔκρινά ⸂τι εἰδέναι⸃ ἐν ὑμῖν εἰ μὴ Ἰησοῦν Χριστὸν καὶ τοῦτον ἐσταυρωμένον·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/002.yaml
  text: For I decided to know nothing among you except Jesus the Messiah—and him crucified[a].
translation:
  language: fr
  text: Car j’ai décidé de ne rien savoir parmi vous, sinon Jésus le Messie — et lui, crucifié[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « Jésus-Christ ». Littéralement en grec : « Jésus Messie ».'
    reason: Signale la traduction traditionnelle possible de Χριστός et la forme littérale du titre grec.
lexical_decisions:
- source_word: ἔκρινά
  choice: j’ai décidé
  rationale: Dans ce contexte, κρίνω exprime une détermination arrêtée plutôt qu’un jugement judiciaire. « J’ai décidé » est naturel en français moderne et rend clairement la résolution de Paul.
- source_word: τι εἰδέναι
  choice: ne rien savoir
  rationale: 'Avec οὐ et εἰ μὴ, la tournure a une valeur restrictive : Paul affirme avoir décidé de ne rien savoir, à l’exception de ce qu’il nomme ensuite.'
- source_word: ἐν ὑμῖν
  choice: parmi vous
  rationale: L’expression situe Paul dans le cadre de sa présence et de son ministère auprès des Corinthiens. « Parmi vous » en conserve la portée relationnelle sans explicitation excessive.
- source_word: εἰ μὴ
  choice: sinon
  rationale: « Sinon » rend avec concision et naturel la construction exceptive grecque.
- source_word: Ἰησοῦν Χριστόν
  choice: Jésus le Messie
  rationale: 'Χριστός conserve ici sa valeur de titre associé à Jésus. En français idiomatique, ce titre appelle l’article : « Jésus le Messie ».'
- source_word: καὶ τοῦτον ἐσταυρωμένον
  choice: — et lui, crucifié
  rationale: « Lui » reprend Jésus avec l’insistance du démonstratif τοῦτον, tandis que « crucifié » préserve la formulation participiale ramassée et l’accent sur son état de crucifié.
theological_decisions:
- issue: Traduction de Χριστός
  choice: le Messie
  alternative: Christ
  rationale: Le contexte présente Χριστός comme le titre messianique de Jésus et le relie immédiatement à sa crucifixion. « Christ », forme traditionnelle devenue aussi proche d’un nom propre, reste signalé en note afin de préserver l’alternative lexicale familière.
- issue: Portée de « et lui, crucifié »
  choice: Conserver l’insistance sur Jésus dans son état de crucifié
  alternative: et sa crucifixion
  rationale: Le grec ne désigne pas abstraitement l’événement de la crucifixion ; il met l’accent sur la personne de Jésus, qualifiée par le participe parfait passif. La traduction maintient cette tension christologique sans la paraphraser.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la structure restrictive et la forte insistance finale du grec. Le tiret et la virgule rendent lisible la formulation condensée « καὶ τοῦτον ἐσταυρωμένον » sans en atténuer le poids.
