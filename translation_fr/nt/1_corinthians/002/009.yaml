base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/009.yaml
  text: But just as it is written[a], “What no eye has seen, and no ear has heard[b], and what has not entered into the heart of man—what God has prepared for those who love him.”
translation:
  language: fr
  text: 'Mais comme il est écrit : « Ce que l’œil n’a pas vu, ce que l’oreille n’a pas entendu, et ce qui n’est pas monté au cœur humain[a] — voilà ce que Dieu a préparé pour ceux qui l’aiment. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « n’est pas monté au cœur d’un être humain » ; on peut aussi comprendre : « n’est venu à l’esprit de personne ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Mais
  rationale: Marque naturellement le contraste avec la pensée précédente.
- source_word: καθὼς γέγραπται
  choice: comme il est écrit
  rationale: Conserve la formule d’introduction d’une citation scripturaire et la valeur résultative du parfait grec.
- source_word: Ἃ ... ὅσα
  choice: Ce que ... voilà ce que
  rationale: Reproduit la reprise corrélative des neutres pluriels grecs tout en donnant une structure poétique naturelle en français.
- source_word: ὀφθαλμὸς ... οὖς
  choice: l’œil ... l’oreille
  rationale: Conserve les singuliers génériques et leur parallélisme.
- source_word: ἐπὶ καρδίαν ἀνθρώπου οὐκ ἀνέβη
  choice: ce qui n’est pas monté au cœur humain
  rationale: Préserve la métaphore grecque de la montée vers le cœur, ainsi que le rôle biblique du cœur comme siège de la pensée et de la perception intérieure. « Humain » rend clairement la portée générique de ἀνθρώπου.
- source_word: ἡτοίμασεν
  choice: a préparé
  rationale: Le passé composé exprime en français une action accomplie dont le résultat demeure pertinent.
- source_word: τοῖς ἀγαπῶσιν αὐτόν
  choice: pour ceux qui l’aiment
  rationale: Rend naturellement le participe présent grec comme une caractéristique continue.
theological_decisions:
- issue: Portée générique de ἀνθρώπου
  choice: au cœur humain
  alternative: au cœur de l’homme
  rationale: Le nom grec est générique et vise l’être humain en général. « Cœur humain » en communique directement la portée inclusive sans ajouter de distinction théologique.
- issue: Sens de καρδία
  choice: cœur
  alternative: pensée
  rationale: « Cœur » conserve l’anthropologie et l’imagerie bibliques sans réduire le terme à la seule activité intellectuelle.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation garde le rythme ternaire de la citation et sa métaphore inhabituelle, tandis que « voilà ce que » clarifie la reprise de ὅσα sans résoudre au-delà du grec la relation syntaxique.
