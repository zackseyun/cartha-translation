id: 1CO.2.15
reference: 1 Corinthians 2:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ δὲ πνευματικὸς ἀνακρίνει ⸀τὰ πάντα, αὐτὸς δὲ ὑπ’ οὐδενὸς ἀνακρίνεται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/015.yaml
  text: But the spiritual person evaluates all things[b][a], yet he himself is evaluated by no one.
translation:
  language: fr
  text: Mais la personne spirituelle[a] examine toutes choses[b], tandis qu’elle-même n’est examinée par personne.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « La personne spirituelle » traduit un adjectif masculin singulier employé comme substantif; il désigne ici, de manière générique, une personne caractérisée par l’Esprit.
    reason: cultural_note
  - marker: b
    text: Ou « évalue », « discerne » ou « juge »; le même verbe grec est employé dans les deux propositions.
    reason: lexical_alternative
lexical_decisions:
- source_word: πνευματικὸς
  choice: la personne spirituelle
  rationale: L’adjectif masculin singulier est employé comme substantif et désigne génériquement une personne caractérisée par l’Esprit. « La personne spirituelle » est naturel en français et n’en limite pas le référent à un homme.
- source_word: ἀνακρίνει
  choice: examine
  rationale: Dans ce contexte, le verbe évoque une appréciation attentive ou un discernement. « Examine » rend ce sens sans suggérer nécessairement une condamnation judiciaire.
- source_word: τὰ πάντα
  choice: toutes choses
  rationale: Cette formulation conserve la portée générale et non qualifiée de l’expression grecque.
- source_word: αὐτὸς
  choice: elle-même
  rationale: Le pronom grec est emphatique. En français, « elle-même » reprend grammaticalement « la personne » tout en conservant cette insistance.
- source_word: ὑπ’ οὐδενὸς
  choice: par personne
  rationale: La tournure idiomatique française avec « ne… par personne » préserve la négation absolue du grec.
- source_word: ἀνακρίνεται
  choice: n’est examinée
  rationale: La répétition d’« examiner » reproduit celle du même verbe grec dans les deux propositions, et la forme passive est maintenue.
theological_decisions:
- issue: Portée de l’affirmation concernant la personne spirituelle
  choice: Conserver sans restriction explicite « toutes choses » et « par personne ».
  alternative: Préciser dans le texte principal que l’affirmation se limite aux réalités spirituelles.
  rationale: Le verset formule l’affirmation sans qualification; c’est le contexte immédiat qui en fournit le cadre. Ajouter une restriction explicite résoudrait une tension que le grec laisse subsister.
translation_notes:
  register: Français international moderne, naturel et digne. Le féminin grammatical de « personne » est repris par « elle-même » sans indiquer que le référent est nécessairement une femme. La répétition d’« examine » conserve le parallélisme lexical du grec.
