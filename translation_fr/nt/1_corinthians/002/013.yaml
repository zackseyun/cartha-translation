  text: ἃ καὶ λαλοῦμεν οὐκ ἐν διδακτοῖς ἀνθρωπίνης σοφίας λόγοις, ἀλλ’ ἐν διδακτοῖς ⸀πνεύματος, πνευματικοῖς πνευματικὰ συγκρίνοντες.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/013.yaml
  text: These things we also speak[a], not in words taught by human wisdom, but in those taught by the Spirit, interpreting spiritual things to spiritual people.
translation:
  language: fr
  text: Nous en parlons aussi, non avec des paroles enseignées par la sagesse humaine, mais avec celles qu’enseigne l’Esprit, en exprimant les réalités spirituelles par des paroles spirituelles.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « en interprétant les réalités spirituelles pour des personnes spirituelles ». Le grec peut aussi être compris ainsi, car πνευματικοῖς peut désigner des personnes spirituelles plutôt que des paroles spirituelles sous-entendues.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἃ καὶ λαλοῦμεν
  choice: Et nous en parlons
  rationale: Le pronom « en » reprend naturellement en français les réalités révélées mentionnées dans le contexte; « parlons » conserve la dimension verbale de λαλοῦμεν, tandis que καί est rendu par « Et ».
- source_word: οὐκ ἐν διδακτοῖς ἀνθρωπίνης σοφίας λόγοις
  choice: non avec des paroles enseignées par la sagesse humaine
  rationale: « Avec » exprime naturellement la valeur instrumentale de ἐν. La formulation conserve l’opposition entre l’origine humaine et l’origine spirituelle de l’enseignement.
- source_word: ἀλλ’ ἐν διδακτοῖς πνεύματος
  choice: mais avec celles qu’enseigne l’Esprit
  rationale: « Celles » reprend « paroles » sans répétition pesante. La majuscule à « Esprit » identifie le Saint-Esprit d’après le contexte immédiat.
- source_word: πνευματικοῖς πνευματικὰ συγκρίνοντες
  choice: en exprimant les réalités spirituelles par des paroles spirituelles
  rationale: Cette lecture prend πνευματικοῖς comme un datif instrumental avec « paroles » sous-entendu et συγκρίνοντες au sens de mettre en relation ou communiquer de manière appropriée. Elle s’accorde avec le contraste immédiat entre deux sortes de paroles, tout en laissant l’autre analyse possible en note.
theological_decisions:
- issue: Référent de πνεύματος
  choice: l’Esprit, c’est-à-dire le Saint-Esprit
  alternative: un esprit ou une source spirituelle au sens général
  rationale: Dans 1 Corinthiens 2, Paul parle à plusieurs reprises de l’Esprit de Dieu comme source de révélation, en contraste avec la sagesse humaine.
- issue: Sens de πνευματικοῖς πνευματικὰ συγκρίνοντες
  choice: exprimer les réalités spirituelles par des paroles spirituelles
  alternative: interpréter les réalités spirituelles pour des personnes spirituelles; ou rapprocher des réalités spirituelles de réalités spirituelles
  rationale: La syntaxe grecque reste véritablement ambiguë. Le texte principal suit le fil du propos sur les paroles enseignées par l’Esprit; la note préserve la lecture masculine de πνευματικοῖς et l’amplitude sémantique de συγκρίνοντες.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase garde le parallélisme grec tout en évitant une tournure artificielle; « réalités » rend le neutre pluriel πνευματικά sans le réduire à de simples objets.
