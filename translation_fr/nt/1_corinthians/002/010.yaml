id: 1CO.2.10
reference: 1 Corinthians 2:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἡμῖν ⸀γὰρ ⸂ἀπεκάλυψεν ὁ θεὸς⸃ διὰ τοῦ ⸀πνεύματος, τὸ γὰρ πνεῦμα πάντα ἐραυνᾷ, καὶ τὰ βάθη τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/010.yaml
  text: For God has revealed these things to us through the Spirit[a], for the Spirit searches all things[b], even the depths of God.
translation:
  language: fr
  text: Car Dieu nous a révélé ces choses[a] par l’Esprit. En effet, l’Esprit sonde tout, même les profondeurs de Dieu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « nous les a révélées »; en grec, le complément direct est sous-entendu et se déduit du contexte précédent.
    reason: alternative_reading
  - marker: b
    text: Ou « les réalités profondes de Dieu ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκάλυψεν
  choice: a révélé
  rationale: Le passé composé exprime naturellement en français l’acte accompli de révélation dont les effets demeurent présents.
- source_word: ἡμῖν
  choice: nous
  rationale: 'Le pronom rend le datif de destinataire : Dieu a adressé cette révélation à « nous ».'
- source_word: '[complément implicite de ἀπεκάλυψεν]'
  choice: ces choses
  rationale: Le grec n’exprime pas le complément direct; « ces choses » le reprend du contexte précédent sans en préciser davantage le contenu.
- source_word: διὰ τοῦ πνεύματος
  choice: par l’Esprit
  rationale: διά avec le génitif indique ici le moyen ou l’agent de la révélation; « par » est idiomatique et fidèle en français.
- source_word: πνεῦμα
  choice: Esprit
  rationale: La majuscule signale que le contexte désigne l’Esprit de Dieu, qui révèle et connaît jusqu’aux profondeurs de Dieu.
- source_word: ἐραυνᾷ
  choice: sonde
  rationale: « Sonder » conserve l’idée d’une exploration pénétrante et convient naturellement à la métaphore des profondeurs.
- source_word: πάντα
  choice: tout
  rationale: « Tout » rend de façon claire et concise la portée universelle du pluriel grec.
- source_word: καὶ
  choice: même
  rationale: 'Dans ce contexte, καί a une valeur intensive et introduit le point culminant : jusqu’aux profondeurs de Dieu.'
- source_word: τὰ βάθη τοῦ θεοῦ
  choice: les profondeurs de Dieu
  rationale: Cette formulation préserve directement la métaphore grecque de la profondeur sans l’interpréter.
theological_decisions:
- issue: Référent de πνεῦμα dans ses deux occurrences
  choice: l’Esprit de Dieu
  alternative: l’esprit humain pris dans un sens général
  rationale: Le contexte attribue à l’Esprit la révélation divine et la connaissance des profondeurs de Dieu, ce qui indique fortement l’Esprit de Dieu.
- issue: Sens du verbe « sonder » appliqué à l’Esprit
  choice: conserver le langage actif du texte sans suggérer une ignorance préalable
  alternative: remplacer par « connaît parfaitement »
  rationale: Le grec emploie explicitement ἐραυνᾷ; « sonde » préserve cette image et la tension du texte au lieu de la résoudre par une paraphrase théologique.
translation_notes:
  register: Français international moderne, clair et digne. « En effet » distingue naturellement la seconde proposition explicative, tandis que « sonde » et « profondeurs » maintiennent le réseau métaphorique du grec.
