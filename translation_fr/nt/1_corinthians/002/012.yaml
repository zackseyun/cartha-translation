id: 1CO.2.12
reference: 1 Corinthians 2:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἡμεῖς δὲ οὐ τὸ πνεῦμα τοῦ κόσμου ἐλάβομεν ἀλλὰ τὸ πνεῦμα τὸ ἐκ τοῦ θεοῦ, ἵνα εἰδῶμεν τὰ ὑπὸ τοῦ θεοῦ χαρισθέντα ἡμῖν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/012.yaml
  text: But we have not received the spirit of the world[a], but the Spirit from God[b], so that we may know the things graciously given to us by God.
translation:
  language: fr
  text: Mais nous, nous n’avons pas reçu l’esprit du monde, mais l’Esprit qui vient de Dieu, afin que nous connaissions[a] ce que Dieu nous a accordé par grâce[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « comprenions ».
    reason: lexical_alternative
  - marker: b
    text: Ou « nous a donné gratuitement » ou « nous a donné en cadeau ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμεῖς δὲ
  choice: Mais nous, nous
  rationale: Le pronom exprimé met « nous » en relief, tandis que « mais » conserve le contraste avec ce qui précède et avec l’esprit du monde.
- source_word: πνεῦμα τοῦ κόσμου
  choice: l’esprit du monde
  rationale: La minuscule distingue cette influence ou disposition propre au monde de l’Esprit venant de Dieu, sans préciser davantage sa nature.
- source_word: πνεῦμα τὸ ἐκ τοῦ θεοῦ
  choice: l’Esprit qui vient de Dieu
  rationale: Cette formulation française naturelle conserve l’idée de provenance exprimée par ἐκ; la majuscule indique que le contexte désigne très probablement l’Esprit Saint.
- source_word: ἐλάβομεν
  choice: nous n’avons pas reçu
  rationale: Le passé composé rend naturellement en français l’action passée dont les effets demeurent pertinents dans l’argument.
- source_word: ἵνα εἰδῶμεν
  choice: afin que nous connaissions
  rationale: « Afin que » marque explicitement le but; « connaissions » reste proche de οἶδα, tout en laissant « comprenions » comme possibilité contextuelle.
- source_word: τὰ ὑπὸ τοῦ θεοῦ χαρισθέντα ἡμῖν
  choice: ce que Dieu nous a accordé par grâce
  rationale: « Ce que » garde la portée large du neutre pluriel, et « accordé par grâce » fait entendre la nuance de don gracieux de χαρίζομαι sans limiter le propos aux dons spirituels.
theological_decisions:
- issue: L’identité de πνεῦμα τὸ ἐκ τοῦ θεοῦ
  choice: « l’Esprit qui vient de Dieu », avec une majuscule
  alternative: « l’esprit qui vient de Dieu »
  rationale: Dans le contexte immédiat, Paul paraît opposer l’Esprit donné par Dieu à l’esprit du monde. La majuscule signale cette lecture probable sans ajouter « Saint », absent du grec.
- issue: La portée de τὰ ... χαρισθέντα
  choice: « ce que Dieu nous a accordé par grâce »
  alternative: « les dons que Dieu nous a faits »
  rationale: Le neutre pluriel est général et ne désigne pas nécessairement les charismes; la traduction choisie préserve cette ampleur.
translation_notes:
  register: Français international moderne, clair et digne. La répétition « nous, nous » est idiomatique et restitue l’emphase du pronom grec. Les marqueurs de notes sont placés précisément après les expressions auxquelles leurs variantes se rapportent.
