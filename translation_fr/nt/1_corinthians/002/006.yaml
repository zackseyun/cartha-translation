source:
  edition: SBLGNT
  text: Σοφίαν δὲ λαλοῦμεν ἐν τοῖς τελείοις, σοφίαν δὲ οὐ τοῦ αἰῶνος τούτου οὐδὲ τῶν ἀρχόντων τοῦ αἰῶνος τούτου τῶν καταργουμένων·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/006.yaml
  text: Yet we do speak wisdom among the mature[a], but not a wisdom of this age or of the rulers of this age[c][b], who are being brought to nothing.
translation:
  language: fr
  text: Nous parlons pourtant de sagesse parmi les personnes mûres[a], mais ce n’est pas une sagesse de cette époque ni une sagesse des dirigeants de cette époque[b], qui sont en train d’être réduits à néant[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les parfaits »; il s’agit ici probablement de personnes spirituellement mûres.
    reason: lexical_alternative
  - marker: b
    text: Les « dirigeants de cette époque » peuvent désigner des autorités humaines, des puissances spirituelles, ou les deux.
    reason: alternative_reading
  - marker: c
    text: Ou « qui disparaissent », « qui sont abolis » ou « qui sont privés de leur pouvoir ».
    reason: lexical_alternative
lexical_decisions:
- source_word: Σοφίαν δὲ λαλοῦμεν
  choice: Cependant, c’est bien de sagesse que nous parlons
  rationale: « Cependant » marque le contraste avec le contexte précédent. La tournure emphatique « c’est bien… que » restitue naturellement l’insistance contextuelle, tandis que « parler de sagesse » conserve le sens ordinaire de λαλέω et la place saillante de σοφίαν.
- source_word: ἐν τοῖς τελείοις
  choice: parmi les personnes mûres
  rationale: Dans ce contexte, τέλειοι désigne vraisemblablement des personnes parvenues à la maturité plutôt qu’une perfection sans défaut. « Parmi » rend idiomatiquement ἐν sans effacer l’alternative littérale.
- source_word: οὐ τοῦ αἰῶνος τούτου
  choice: non d’une sagesse de l’ère présente
  rationale: « Ère » préserve la valeur temporelle de αἰών et évite de le confondre avec κόσμος, « monde ». La répétition de « sagesse » est explicitée en français pour la clarté.
- source_word: τῶν ἀρχόντων τοῦ αἰῶνος τούτου
  choice: de celle de ses dirigeants
  rationale: Le pronom « ses » renvoie clairement à l’ère présente. « Dirigeants » reste assez large pour ne pas trancher entre autorités humaines, puissances spirituelles, ou les deux.
- source_word: τῶν καταργουμένων
  choice: qui sont en train d’être réduits à néant
  rationale: La formule exprime le processus en cours indiqué par le participe présent passif et la notion de suppression d’efficacité ou d’anéantissement portée par καταργέω.
theological_decisions:
- issue: Référence des « dirigeants de l’ère présente »
  choice: Maintenir le terme général « dirigeants » sans identifier leur nature.
  alternative: Autorités politiques ou religieuses humaines; puissances spirituelles; ou les deux à la fois.
  rationale: L’expression grecque ne permet pas de choisir avec certitude entre ces référents. La traduction conserve donc cette ambiguïté théologique réelle.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation garde le contraste rhétorique, la répétition de « sagesse », l’aspect progressif du participe et l’ambiguïté du référent des dirigeants.
