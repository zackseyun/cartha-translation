  source_fidelity: Le texte rend fidèlement le parallèle grec entre « les réalités propres à une personne » et « les réalités propres à Dieu ». « En effet » exprime correctement γάρ; « De même » rend οὕτως καί. Le présent « connaît » est recevable pour le parfait ἔγνωκεν, qui a ici une valeur de connaissance actuelle et générale. « L’esprit de cette personne qui est en elle » conserve explicitement la qualification τὸ ἐν αὐτῷ sans la réduire ni l’interpréter davantage.
