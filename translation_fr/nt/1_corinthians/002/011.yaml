id: 1CO.2.11
reference: 1 Corinthians 2:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τίς γὰρ οἶδεν ἀνθρώπων τὰ τοῦ ἀνθρώπου εἰ μὴ τὸ πνεῦμα τοῦ ἀνθρώπου τὸ ἐν αὐτῷ; οὕτως καὶ τὰ τοῦ θεοῦ οὐδεὶς ⸀ἔγνωκεν εἰ μὴ τὸ πνεῦμα τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/011.yaml
  text: For who among people knows the things of a person except the spirit of the person that is in him? In the same way[b][a], no one has known the things of God except the Spirit of God.
translation:
  language: fr
  text: En effet, qui parmi les humains connaît ce qui est propre à une personne[a], sinon l’esprit de cette personne qui est en elle ? De même, personne ne connaît ce qui est propre à Dieu, sinon l’Esprit de Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les pensées d’une personne ».
    reason: Alternative plus fluide, mais plus étroite que l’expression grecque, qui peut englober l’ensemble de ses réalités intérieures.
lexical_decisions:
- source_word: ἀνθρώπων / ἀνθρώπου
  choice: parmi les humains / à une personne
  rationale: Le grec a ici une portée générique, sans force spécifiquement masculine. Ces formulations sont naturelles en français moderne et maintiennent la distinction entre l’ensemble des humains et l’individu évoqué.
- source_word: τὰ τοῦ ἀνθρώπου
  choice: ce qui est propre à une personne
  rationale: L’expression désigne largement les réalités intérieures ou personnelles connues de l’individu. Cette traduction évite de la réduire aux seules pensées et préserve le parallélisme avec τὰ τοῦ θεοῦ.
- source_word: πνεῦμα τοῦ ἀνθρώπου τὸ ἐν αὐτῷ
  choice: l’esprit de cette personne qui est en elle
  rationale: 'La formulation suit explicitement la structure grecque : l’esprit appartenant à la personne, qualifié comme étant en elle. Le pronom féminin reprend grammaticalement « personne » sans attribuer un sexe au référent.'
- source_word: οὕτως καὶ
  choice: De même
  rationale: Cette expression française marque clairement l’analogie étroite entre la connaissance humaine de l’intériorité d’une personne et la connaissance divine.
- source_word: ἔγνωκεν
  choice: ne connaît
  rationale: Le parfait grec exprime ici un état de connaissance résultant et actuel. Le présent français rend naturellement cette valeur dans la maxime, tout en évitant de suggérer que seul le passé est visé.
- source_word: τὰ τοῦ θεοῦ
  choice: ce qui est propre à Dieu
  rationale: La traduction conserve la portée large de l’expression et son parallélisme avec « ce qui est propre à une personne », sans la restreindre aux seules pensées de Dieu.
- source_word: πνεῦμα τοῦ θεοῦ
  choice: l’Esprit de Dieu
  rationale: Dans le contexte immédiat, l’expression renvoie à l’Esprit divin qui connaît et révèle ce qui est propre à Dieu. La majuscule correspond à l’usage français pour cette désignation personnelle.
theological_decisions:
- issue: La désignation πνεῦμα τοῦ θεοῦ est-elle personnelle et titulaire, ou doit-elle rester non titulaire ?
  choice: l’Esprit de Dieu
  alternative: l’esprit de Dieu
  rationale: Le contexte de 1 Corinthiens 2 présente cet Esprit comme connaissant et révélant les réalités de Dieu. La majuscule signale ce référent personnel selon l’usage français, sans ajouter de précision doctrinale absente du verset.
- issue: Faut-il identifier τὰ τοῦ ἀνθρώπου et τὰ τοῦ θεοῦ uniquement aux pensées ?
  choice: ce qui est propre à une personne / ce qui est propre à Dieu
  alternative: les pensées d’une personne / les pensées de Dieu
  rationale: Le neutre pluriel grec a une portée plus large que les seules pensées. La traduction principale conserve cette ampleur et la tension du parallélisme.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme du grec est maintenu par la répétition de « ce qui est propre à ». « En effet » rend la valeur explicative de γάρ, et « parmi les humains » évite toute lecture exclusivement masculine.
