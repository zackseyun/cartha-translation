  source_fidelity: 'Le texte rend avec fidélité la progression du grec : le ψυχικὸς ἄνθρωπος n’accueille pas les réalités relevant de l’Esprit de Dieu, les tient pour folie et ne peut les connaître, car elles relèvent d’un discernement spirituel. Le singulier collectif « ce qui relève de » est une transposition française recevable du neutre pluriel τὰ τοῦ πνεύματος.'
