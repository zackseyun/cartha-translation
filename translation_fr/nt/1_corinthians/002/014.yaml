id: 1CO.2.14
reference: 1 Corinthians 2:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ψυχικὸς δὲ ἄνθρωπος οὐ δέχεται τὰ τοῦ πνεύματος τοῦ θεοῦ, μωρία γὰρ αὐτῷ ἐστίν, καὶ οὐ δύναται γνῶναι, ὅτι πνευματικῶς ἀνακρίνεται·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/014.yaml
  text: But the natural person does not accept the things of the Spirit of God[a], for they are foolishness to him, and he is not able to know them[b], because they are spiritually discerned.
translation:
  language: fr
  text: Mais l’être humain naturel[a] n’accueille pas ce qui relève de l’Esprit de Dieu, car, pour lui, c’est une folie, et il ne peut pas le connaître, parce que cela se discerne spirituellement[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’être humain non spirituel ».
    reason: lexical_alternative
  - marker: b
    text: Ou « s’examine » ou « s’évalue ».
    reason: lexical_alternative
lexical_decisions:
- source_word: Ψυχικὸς
  choice: naturel
  rationale: Le terme s’oppose ici à πνευματικός. « Naturel » conserve ce contraste sans préciser davantage que le grec la condition de la personne ainsi décrite.
- source_word: ἄνθρωπος
  choice: être humain
  rationale: Le masculin grec a ici une portée représentative; « être humain » exprime naturellement cette valeur générale en français.
- source_word: δέχεται
  choice: n’accueille pas
  rationale: « Accueillir » exprime la réception favorable ou l’acceptation, plutôt que la simple acquisition d’une information.
- source_word: τὰ τοῦ πνεύματος τοῦ θεοῦ
  choice: ce qui relève de l’Esprit de Dieu
  rationale: Cette formulation garde l’expression large et respecte le génitif grec sans réduire son sens à un contenu précis.
- source_word: μωρία
  choice: une folie
  rationale: Ce choix maintient le vocabulaire récurrent de Paul opposant la sagesse de Dieu au jugement humain.
- source_word: γνῶναι
  choice: le connaître
  rationale: « Connaître » reflète directement le verbe grec, tout en laissant au contexte la nuance de saisie ou de reconnaissance.
- source_word: πνευματικῶς
  choice: spirituellement
  rationale: L’adverbe français préserve la manière ou la sphère du discernement sans expliciter indûment « par l’Esprit ».
- source_word: ἀνακρίνεται
  choice: se discerne
  rationale: Le verbe peut désigner l’examen, l’évaluation ou le discernement; « se discerne » convient au contraste contextuel avec l’être humain naturel.
theological_decisions:
- issue: Sens de ψυχικὸς ἄνθρωπος face au discernement spirituel
  choice: l’être humain naturel
  alternative: l’être humain non spirituel
  rationale: « Naturel » préserve la tension entre ψυχικός et πνευματικός sans définir explicitement cette personne comme privée de l’Esprit, précision que le grec n’énonce pas directement.
- issue: Agent ou mode du discernement spirituel
  choice: cela se discerne spirituellement
  alternative: cela est discerné par l’Esprit
  rationale: Le grec emploie l’adverbe πνευματικῶς et ne nomme pas explicitement l’Esprit comme agent; la traduction conserve cette ambiguïté.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure collective « ce qui relève de » permet de reprendre naturellement l’ensemble par « le » et « cela », tout en conservant l’étendue de l’expression grecque.
