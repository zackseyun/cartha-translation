  text: καὶ ὁ λόγος μου καὶ τὸ κήρυγμά μου οὐκ ἐν ⸂πειθοῖ σοφίας⸃ ἀλλ’ ἐν ἀποδείξει πνεύματος καὶ δυνάμεως,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/004.yaml
  text: And my speech and my proclamation were not with persuasive wisdom, but with a demonstration of the Spirit and of power,
translation:
  language: fr
  text: Mon discours et ma proclamation ne se faisaient pas par des paroles persuasives de sagesse[b], mais par une démonstration de l’Esprit[a] et de puissance.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de l’esprit ».
    reason: alternative_reading
  - marker: b
    text: Ou « par une sagesse persuasive ».
    reason: lexical_alternative
lexical_decisions:
- source_word: λόγος
  choice: parole
  rationale: Dans ce contexte, « parole » désigne la manière de s’exprimer de Paul tout en restant distincte de κήρυγμα. Ce choix naturel conserve aussi l’écho du grec sans réduire le terme à un simple mot isolé.
- source_word: κήρυγμα
  choice: proclamation
  rationale: « Proclamation » garde la dimension publique et annonciatrice du terme grec, tout en le distinguant de λόγος.
- source_word: πειθοῖ σοφίας
  choice: sur une sagesse persuasive
  rationale: Le grec n’exprime pas explicitement le nom « paroles ». Cette formulation évite donc de l’ajouter dans le texte principal et rend l’idée d’une sagesse qui cherche à convaincre par ses moyens rhétoriques. La variante syntaxique possible est signalée en note.
- source_word: ἀποδείξει
  choice: démonstration
  rationale: Le terme indique une manifestation probante ou une mise en évidence, en contraste avec la seule persuasion rhétorique.
- source_word: πνεύματος
  choice: l’Esprit
  rationale: Le contexte proche, qui oppose la sagesse humaine à l’action venant de Dieu, favorise une référence à l’Esprit de Dieu. L’ambiguïté avec « esprit » est conservée en note.
- source_word: δυνάμεως
  choice: puissance
  rationale: « Puissance » est l’équivalent français clair et usuel, et conserve la coordination littérale avec « l’Esprit ».
theological_decisions:
- issue: πνεύματος désigne-t-il l’Esprit de Dieu ou l’esprit au sens non spécifié ?
  choice: l’Esprit
  alternative: l’esprit
  rationale: La progression de 1 Corinthiens 2 favorise l’Esprit de Dieu, mais la forme grecque permet en elle-même une lecture non explicitement déterminée. La majuscule est retenue dans le texte et l’autre possibilité reste visible en note.
- issue: Relation syntaxique de « puissance » avec « démonstration »
  choice: une démonstration de l’Esprit et de puissance
  alternative: une démonstration de l’Esprit et de la puissance
  rationale: L’absence d’article devant les deux génitifs et la coordination grecque sont préservées autant que le permet un français intelligible, sans identifier silencieusement « puissance » comme une entité déterminée.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase garde le parallélisme négatif/adversatif du grec. « Reposaient sur » rend idiomatiquement ἐν dans les deux membres sans faire de la sagesse ou de la démonstration un simple accompagnement instrumental.
