  naturalness: « Ma parole » est possible, mais « mon discours » désigne plus naturellement la prise de parole de Paul et se distingue bien de « ma proclamation ». « Par des paroles persuasives de sagesse » est idiomatique en français moderne et rend explicitement le substantif sous-entendu par l’adjectif grec, sans trancher une question théologique.
