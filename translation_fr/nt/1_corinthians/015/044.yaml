review_pass:
  verdict: revise
  source_fidelity: Le parallélisme, les deux occurrences de « corps », la condition introduite par εἰ et la valeur additive de καί sont bien rendus. Toutefois, « il est ressuscité » peut se comprendre en français comme un parfait/intransitif (« il a ressuscité ») plutôt que comme le présent passif grec ἐγείρεται. « Il est relevé » rend sans ambiguïté le passif présent et convient au contexte de résurrection.
  naturalness: La formulation actuelle est compréhensible, mais « semé corps naturel » est très elliptique pour le français international moderne. L’ajout de « comme un » conserve l’opposition qualitative sans alourdir excessivement la phrase.
  terminology: « Corps naturel » et « corps spirituel » sont des choix établis et appropriés pour σῶμα ψυχικόν / σῶμα πνευματικόν. La note fournit utilement l’alternative littérale « corps psychique » et évite à juste titre de présenter l’opposition comme matériel contre immatériel.
  issues:
  - severity: medium
    issue: Ambiguïté de « il est ressuscité »
    rationale: Le grec emploie le présent passif ἐγείρεται, en parallèle avec σπείρεται. En français, « est ressuscité » est facilement reçu comme une forme intransitive ou un état résultant; « est relevé » préserve plus clairement la voix passive et le présent du texte source.
  - severity: low
    issue: Ellipse nominale peu naturelle dans « semé corps naturel »
    rationale: Bien qu’elle imite le parallélisme grec, cette construction sans « comme un » est moins idiomatique en français moderne. La révision maintient le contraste sans lui attribuer un sens doctrinal supplémentaire.
  revised_text: Il est semé comme un corps naturel ; il est relevé comme un corps spirituel. S’il y a un corps naturel[a], il y a aussi un corps spirituel.
  revised_footnotes:
