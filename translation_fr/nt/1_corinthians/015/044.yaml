    text: Ou « corps psychique »… « corps spirituel ». Paul n’oppose pas ici un corps matériel à une réalité immatérielle, mais un corps animé par la vie humaine ordinaire à un corps animé par l’Esprit.
    reason: lexical_alternative
  revision_rationale: La révision rend explicitement le présent passif de ἐγείρεται par « est relevé » et améliore l’idiomaticité française par « comme un corps ». Elle conserve les termes clés, le parallélisme et l’ambiguïté lexicale que la note signale.
