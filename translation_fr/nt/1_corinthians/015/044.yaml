source:
  edition: SBLGNT
  text: σπείρεται σῶμα ψυχικόν, ἐγείρεται σῶμα πνευματικόν. ⸀Εἰ ἔστιν σῶμα ψυχικόν, ⸂ἔστιν καὶ⸃ πνευματικόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/044.yaml
  text: It is sown a natural body; it is raised a spiritual body. If there is a natural body[a], there is also a spiritual body.
translation:
  language: fr
  text: Il est semé comme un corps naturel ; il est relevé comme un corps spirituel. S’il y a un corps naturel[a], il y a aussi un corps spirituel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « corps psychique »… « corps spirituel ». Paul n’oppose pas ici un corps matériel à une réalité immatérielle, mais un corps animé par la vie humaine ordinaire à un corps animé par l’Esprit.
    reason: lexical_alternative
lexical_decisions:
- source_word: σπείρεται
  choice: il est semé
  rationale: Conserve le présent passif et l’image de la semence développée dans le contexte immédiat.
- source_word: σῶμα
  choice: corps
  rationale: Équivalent direct et naturel; le contexte concerne l’être humain corporel dans la mort et la résurrection.
- source_word: ψυχικόν
  choice: naturel
  rationale: Rend le contraste paulinien avec πνευματικόν sans suggérer à tort une opposition entre matière et immatérialité. « Psychique » serait aujourd’hui ambigu, et « animé » trop interprétatif.
- source_word: ἐγείρεται
  choice: il est ressuscité
  rationale: Dans ce contexte, le passif de ἐγείρω appartient au langage de la résurrection; « est ressuscité » est idiomatique et précis en français.
- source_word: πνευματικόν
  choice: spirituel
  rationale: Préserve le terme et la tension du grec. Ici, « spirituel » qualifie un corps sans signifier qu’il serait incorporel.
- source_word: Εἰ
  choice: si
  rationale: Conserve explicitement la forme conditionnelle du grec plutôt que de la transformer en affirmation causale.
- source_word: καὶ
  choice: aussi
  rationale: Exprime clairement la valeur additive de la seconde proposition.
theological_decisions:
- issue: Sens de l’opposition entre « corps naturel » et « corps spirituel »
  choice: Le texte principal maintient l’opposition entre un corps relevant de la vie humaine ordinaire et un corps caractérisé par l’Esprit.
  alternative: Comprendre l’expression comme une opposition entre un corps matériel et un corps immatériel, ou traduire littéralement « corps psychique » et « corps spirituel ».
  rationale: La présence répétée de σῶμα interdit de réduire le second état à une existence sans corps. La note éclaire la portée de ψυχικόν et πνευματικόν tout en préservant la formulation et la tension de Paul.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation compacte « semé corps naturel… ressuscité corps spirituel » reproduit le parallélisme grec tout en restant intelligible; l’absence d’article devant les deux qualificatifs évite de transformer ces expressions en catégories trop figées.
