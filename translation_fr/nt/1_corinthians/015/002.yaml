  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: δι’ οὗ καὶ σῴζεσθε, τίνι λόγῳ εὐηγγελισάμην ὑμῖν, εἰ κατέχετε, ἐκτὸς εἰ μὴ εἰκῇ ἐπιστεύσατε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/002.yaml
  text: through which you also are being saved, if you hold firmly to the message I proclaimed as good news to you—unless you believed in vain.
translation:
  language: fr
  text: par laquelle vous êtes aussi sauvés[a], si vous tenez ferme au message que je vous ai annoncé[b] — à moins que vous n’ayez cru en vain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « vous êtes en train d’être sauvés ». Le présent grec peut décrire un processus en cours ou, plus généralement, une réalité actuelle.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement, le grec dit : « si vous tenez ferme à quel message/parole je vous ai annoncé comme bonne nouvelle ». Le tour peut renvoyer au contenu précis du message ou à sa formulation.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δι’ οὗ
  choice: par laquelle
  rationale: διά avec le génitif exprime ici le moyen. Le pronom relatif renvoie à la Bonne Nouvelle mentionnée au verset précédent; le féminin français suit ce référent.
- source_word: σῴζεσθε
  choice: vous êtes sauvés
  rationale: Le présent passif grec peut exprimer une réalité actuelle ou un processus en cours. Le présent français reste naturel et laisse cette portée ouverte; la note signale explicitement l’autre formulation possible.
- source_word: τίνι λόγῳ
  choice: le message
  rationale: Dans cette construction liée à κατέχετε, λόγος désigne le contenu ou la formulation de l’annonce. « Le message » est idiomatique en français moderne, tandis qu’une note conserve le tour grec plus littéral.
- source_word: εὐηγγελισάμην
  choice: je vous ai annoncé comme Bonne Nouvelle
  rationale: Cette formulation rend le sens verbal d’annoncer une bonne nouvelle et conserve le lien avec l’Évangile sans réduire le verbe au seul acte de prêcher.
- source_word: κατέχετε
  choice: retenez fermement
  rationale: Le verbe exprime ici le fait de maintenir son attachement ou de conserver avec fermeté.
- source_word: ἐκτὸς εἰ μὴ
  choice: à moins que
  rationale: Cette locution introduit naturellement une exception ou une réserve.
- source_word: εἰκῇ
  choice: en vain
  rationale: L’expression indique ici une foi qui serait vide, vaine ou sans résultat; « en vain » garde la force et la concision du grec.
- source_word: ἐπιστεύσατε
  choice: vous n’ayez cru
  rationale: Le passé composé au subjonctif, exigé après « à moins que », renvoie naturellement à l’acte passé par lequel les Corinthiens ont cru.
theological_decisions:
- issue: Aspect du salut dans σῴζεσθε
  choice: présent « vous êtes sauvés », avec possibilité d’un processus en cours signalée en note
  alternative: « vous êtes en train d’être sauvés »
  rationale: Le présent français peut couvrir une situation actuelle et une action en cours sans imposer une formulation lourde. La note préserve la tension entre le caractère actuel et le déroulement du salut.
- issue: Condition εἰ κατέχετε
  choice: 'condition réelle : « si vous retenez fermement »'
  alternative: condition comprise comme preuve d’une foi authentique ou comme condition rhétorique supposée remplie
  rationale: La traduction maintient la forme conditionnelle de Paul sans trancher les débats doctrinaux sur la persévérance ou l’assurance.
translation_notes:
  register: Français international moderne, naturel et digne. « Bonne Nouvelle » explicite la valeur évangélique du verbe grec; le tiret conserve la brusque réserve finale. La formulation évite d’expliciter doctrinalement la condition ou l’aspect du salut.
