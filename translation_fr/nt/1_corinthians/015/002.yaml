    rationale: « Si vous retenez fermement par quelle parole je vous ai annoncé la Bonne Nouvelle » ne reflète pas clairement le lien de τίνι λόγῳ avec κατέχετε et n’est pas une formulation française acceptable. La note doit expliquer l’ambiguïté sans produire une traduction défectueuse.
