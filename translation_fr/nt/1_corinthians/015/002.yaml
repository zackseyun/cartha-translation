  source_fidelity: 'Le sens général est fidèle : διά exprime le moyen, le présent passif de σῴζεσθε demeure ouvert entre état actuel et processus, et la condition suivie de l’exception finale est conservée. Toutefois, « annoncé comme Bonne Nouvelle » est peu idiomatique et la note b ne rend pas correctement ni naturellement la construction τίνι λόγῳ liée à κατέχετε.'
  naturalness: « Vous tenez ferme au message » est plus naturel et plus direct en français moderne que « vous retenez fermement le message ». « Que je vous ai annoncé » est idiomatique et, dans le contexte immédiat où le référent est la Bonne Nouvelle, restitue adéquatement εὐηγγελισάμην sans la tournure française artificielle « annoncer comme Bonne Nouvelle ».
  terminology: « Bonne Nouvelle » convient pour le référent de δι’ ἧς, avec une majuscule cohérente pour désigner l’Évangile. « Message » convient pour λόγος dans cette construction. La note b doit présenter τίνι λόγῳ comme une expression pouvant renvoyer au message précis ou à sa formulation, non comme la question française maladroite « par quelle parole » après « retenez fermement ».
