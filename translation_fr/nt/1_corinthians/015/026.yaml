  text: ἔσχατος ἐχθρὸς καταργεῖται ὁ θάνατος,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/026.yaml
  text: The last enemy to be abolished is death[a].
translation:
  language: fr
  text: Le dernier ennemi à être réduit à l’impuissance, c’est la mort[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Le dernier ennemi qui est aboli, c’est la mort »; ou : « Le dernier ennemi détruit, c’est la mort. »'
    reason: Variantes légitimes pour καταργεῖται, qui peut exprimer l’abolition, la destruction ou la réduction à l’impuissance.
lexical_decisions:
- source_word: ἔσχατος
  choice: dernier
  rationale: L’adjectif désigne ce qui vient en dernier dans une série et préserve ici l’ordre eschatologique de l’argument de Paul.
- source_word: ἐχθρὸς
  choice: ennemi
  rationale: Le nom présente la mort comme une puissance hostile personnifiée; « ennemi » est naturel, clair et fidèle.
- source_word: καταργεῖται
  choice: à être réduit à l’impuissance
  rationale: Le présent passif exprime la mise hors d’action ou la suppression de l’efficacité de l’ennemi. Cette formulation rend la portée de καταργέω sans imposer l’idée plus précise d’un anéantissement.
- source_word: ὁ θάνατος
  choice: la mort
  rationale: L’article et la construction identifient la mort comme le dernier ennemi; le français exige naturellement l’article défini.
theological_decisions:
- issue: Portée de καταργεῖται appliqué à la défaite de la mort
  choice: à être réduit à l’impuissance
  alternative: à être aboli / qui est détruit
  rationale: Le verbe peut désigner le fait de rendre inopérant, de supprimer ou de mettre fin. Le choix retenu préserve cette amplitude et la tension théologique sans préciser indûment le mode métaphysique de la disparition de la mort.
translation_notes:
  register: Français moderne, international et digne. La tournure disloquée « c’est la mort » est naturelle et met clairement en relief l’identification de la mort comme dernier ennemi.
