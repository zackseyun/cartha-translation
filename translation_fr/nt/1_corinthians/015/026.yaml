  source_fidelity: 'Le texte rend fidèlement ἔσχατος ἐχθρός (« le dernier ennemi ») et l’identification emphatique de ὁ θάνατος (« c’est la mort »). « À être réduit à l’impuissance » est une traduction sémantiquement recevable de καταργεῖται : elle exprime la mise hors d’action sans affirmer un mode d’anéantissement que le verbe ne précise pas. La construction française rend naturellement la valeur eschatologique de l’énoncé grec.'
  naturalness: « Le dernier ennemi à être réduit à l’impuissance, c’est la mort » est idiomatique en français moderne international, clair et d’un registre biblique digne sans être archaïque. La dislocation avec « c’est » est naturelle et souligne l’identification finale.
