  text: Where[a], O death, is your victory? Where, O death, is your sting?
translation:
  language: fr
  text: Où est ta victoire, ô mort[a] ? Où est ton aiguillon, ô mort ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Certains manuscrits portent dans la première proposition : « Où est ton aiguillon, ô mort ? »'
