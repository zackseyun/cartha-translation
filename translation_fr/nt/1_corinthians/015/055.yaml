lexical_decisions:
- source_word: ποῦ
  choice: Où est
  rationale: L’adverbe interrogatif introduit une question rhétorique de défi. En français, « Où est » exprime naturellement cette force sans ajouter d’emphase absente du grec.
- source_word: σου
  choice: ta / ton
  rationale: Le génitif du pronom de deuxième personne marque ici la possession ; les possessifs français s’accordent avec « victoire » et « aiguillon ».
- source_word: θάνατε
  choice: ô mort
  rationale: Le vocatif personnifie la mort et l’interpelle directement. « Ô mort » conserve la portée poétique et solennelle de l’apostrophe grecque.
- source_word: νῖκος
  choice: victoire
  rationale: Le terme désigne la victoire ou le triomphe. « Victoire » est clair, précis et fait écho au contexte immédiat du verset 54.
- source_word: κέντρον
  choice: aiguillon
  rationale: Le mot peut désigner une pointe, un aiguillon ou un dard. « Aiguillon », traditionnel mais toujours compréhensible, convient à l’image que Paul explicite au verset 56 et préserve sa portée métaphorique.
theological_decisions:
- issue: Lecture du texte critique dans la première proposition
  choice: Traduire νῖκος par « victoire » dans le texte principal
  alternative: Suivre la variante qui porte « aiguillon » dans la première proposition
  rationale: Le SBLGNT fourni lit νῖκος, « victoire ». Cette lecture s’accorde aussi avec l’affirmation du verset 54 selon laquelle la mort a été engloutie dans la victoire. La variante ancienne est signalée en note sans remplacer le texte source retenu.
translation_notes:
  register: Français moderne, digne et poétique. L’ordre « Où est ta victoire, ô mort ? » reste naturel tout en conservant l’interpellation solennelle. « Aiguillon » maintient le lien lexical et métaphorique avec l’explication du verset suivant.
