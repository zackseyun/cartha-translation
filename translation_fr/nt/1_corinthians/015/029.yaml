id: 1CO.15.29
reference: 1 Corinthians 15:29
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἐπεὶ τί ποιήσουσιν οἱ βαπτιζόμενοι ὑπὲρ τῶν νεκρῶν; εἰ ὅλως νεκροὶ οὐκ ἐγείρονται, τί καὶ βαπτίζονται ὑπὲρ ⸀αὐτῶν;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/029.yaml
  text: Otherwise[a], what will those do who are being baptized on behalf of the dead? If the dead are not raised at all, why then are they being baptized on their behalf?
translation:
  language: fr
  text: Autrement, que feront ceux qui sont baptisés pour les morts[a] ? Si les morts ne ressuscitent absolument pas, pourquoi donc sont-ils baptisés pour eux ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en faveur des morts », « à cause des morts » ou, moins probablement, « au-dessus des morts ». La préposition grecque peut être comprise de plusieurs manières, et la pratique exacte à laquelle Paul fait allusion demeure incertaine.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐπεὶ
  choice: Autrement
  rationale: Dans ce raisonnement, le terme introduit la conséquence qui découlerait de la négation de la résurrection. « Autrement » rend naturellement cette transition rhétorique.
- source_word: τί ποιήσουσιν
  choice: que feront
  rationale: Le sens large de ποιέω est conservé sans préciser ce que ces personnes pourraient obtenir ou devenir.
- source_word: οἱ βαπτιζόμενοι
  choice: ceux qui sont baptisés
  rationale: Cette formulation respecte le participe présent passif et évoque une pratique en cours ou habituelle, sans se prononcer sur sa légitimité.
- source_word: ὑπὲρ τῶν νεκρῶν
  choice: pour les morts
  rationale: « Pour » conserve en français la souplesse de ὑπέρ avec le génitif et interprète moins nettement la pratique que « à la place des morts » ou « au nom des morts ».
- source_word: εἰ ὅλως
  choice: Si ... absolument pas
  rationale: « Absolument » restitue la valeur intensive de ὅλως dans une tournure française naturelle.
- source_word: νεκροὶ οὐκ ἐγείρονται
  choice: les morts ne ressuscitent ... pas
  rationale: Le verbe français « ressusciter » est idiomatique ici et conserve le langage de la résurrection, bien que la forme grecque soit passive.
- source_word: τί καὶ
  choice: pourquoi donc
  rationale: Dans la reprise rhétorique, « pourquoi donc » exprime naturellement la force argumentative de τί καί.
- source_word: βαπτίζονται
  choice: sont-ils baptisés
  rationale: Le passif est maintenu et reste parallèle au premier emploi du verbe.
- source_word: ὑπὲρ αὐτῶν
  choice: pour eux
  rationale: Le pronom renvoie aux morts et « pour » maintient le parallélisme ainsi que l'ambiguïté de la première occurrence.
theological_decisions:
- issue: Sens du baptême « pour les morts »
  choice: Conserver la formule peu interprétative « baptisés pour les morts » sans définir la pratique évoquée ni l'approuver.
  alternative: « baptisés en faveur des morts », « baptisés à cause des morts » ou, moins probablement, « baptisés au-dessus des morts »
  rationale: La pratique exacte demeure incertaine et le verset a reçu de nombreuses interprétations. Paul l'emploie ici dans son argument sur la résurrection ; la traduction ne doit donc pas lui imposer une explication confessionnelle.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe interrogative conserve la vigueur de l'argument, tandis que « pour » laisse ouverte l'interprétation de la pratique.
