id: 1CO.15.18
reference: 1 Corinthians 15:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἄρα καὶ οἱ κοιμηθέντες ἐν Χριστῷ ἀπώλοντο.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/018.yaml
  text: Then those also who have fallen asleep in Messiah have perished[a][b].
translation:
  language: fr
  text: Ainsi, ceux qui se sont endormis[a] dans le Messie[b] ont eux aussi péri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Se sont endormis » est une manière grecque adoucie de parler de ceux qui sont morts, en particulier des croyants.
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « en Christ ».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἄρα
  choice: Ainsi
  rationale: La particule introduit la conséquence logique tirée de l’argument précédent; « Ainsi » exprime clairement cette inférence en français courant.
- source_word: καὶ
  choice: eux aussi
  rationale: Cette tournure restitue la valeur additive de καί tout en adoptant un ordre des mots naturel en français.
- source_word: οἱ κοιμηθέντες
  choice: ceux qui se sont endormis
  rationale: Le participe emploie l’image conventionnelle du sommeil pour parler de la mort. La traduction conserve cette métaphore au lieu de l’expliciter dans le corps du texte.
- source_word: ἐν Χριστῷ
  choice: dans le Messie
  rationale: « Messie » traduit la valeur titulaire de Χριστός, tandis que « dans » préserve la formulation paulinienne d’appartenance et d’union sans l’interpréter davantage.
- source_word: ἀπώλοντο
  choice: ont péri
  rationale: Le passé composé rend naturellement en français l’aoriste et sa conséquence décisive dans ce raisonnement hypothétique. « Périr » conserve l’idée forte de perte ou de ruine.
theological_decisions:
- issue: Traduction de Χριστῷ dans la formule paulinienne ἐν Χριστῷ
  choice: dans le Messie
  alternative: en Christ
  rationale: Le grec emploie le titre Χριστός. « Le Messie » en traduit le sens, tandis que la formulation traditionnelle « en Christ » est signalée en note en raison de son usage bien établi.
- issue: Portée de ἀπώλοντο dans l’argument sur la résurrection
  choice: ont péri
  alternative: sont perdus
  rationale: « Ont péri » conserve la force du verbe grec sans préciser la nature exacte ou la durée de cette perte, que ce seul verset ne développe pas.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe reste naturelle tout en conservant la métaphore du sommeil, le titre « Messie » et la vigueur de la conclusion de Paul.
