id: 1CO.15.50
reference: 1 Corinthians 15:50
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Τοῦτο δέ φημι, ἀδελφοί, ὅτι σὰρξ καὶ αἷμα βασιλείαν θεοῦ κληρονομῆσαι οὐ ⸀δύναται, οὐδὲ ἡ φθορὰ τὴν ἀφθαρσίαν κληρονομεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/050.yaml
  text: 'I say this[a], brothers: flesh and blood cannot inherit the kingdom of God[b], nor does the perishable inherit the imperishable.'
translation:
  language: fr
  text: 'Voici ce que je dis, frères[a] : la chair et le sang ne peuvent hériter du royaume de Dieu[b], et ce qui est périssable n’hérite pas de ce qui est impérissable.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « frères et sœurs » ; le grec dit « frères », terme qui peut s’adresser ici à toute l’assemblée.
    reason: lexical_alternative
  - marker: b
    text: « La chair et le sang » est une expression qui désigne la vie humaine mortelle dans sa condition présente ; elle ne nie pas la résurrection du corps.
    reason: cultural_note
lexical_decisions:
- source_word: Τοῦτο δέ φημι
  choice: Voici ce que je dis
  rationale: Rend directement l’introduction explicative de Paul en français naturel. « Voici » exprime la valeur présentative de τοῦτο sans introduire un marqueur temporel absent du grec.
- source_word: ἀδελφοί
  choice: frères
  rationale: Conserve la forme masculine du grec et le terme d’adresse traditionnel, tout en signalant en note qu’il peut inclure l’ensemble de l’assemblée.
- source_word: σὰρξ καὶ αἷμα
  choice: la chair et le sang
  rationale: Préserve l’expression imagée grecque, qui désigne ici l’existence humaine mortelle dans sa condition présente.
- source_word: βασιλείαν θεοῦ
  choice: le royaume de Dieu
  rationale: Formulation française claire et consacrée, qui maintient la construction et la portée théologique du grec.
- source_word: κληρονομῆσαι / κληρονομεῖ
  choice: hériter / n’hérite pas
  rationale: Conserve le parallélisme lexical du verset ainsi que la nuance successorale et eschatologique de κληρονομέω.
- source_word: οὐ δύναται
  choice: ne peuvent
  rationale: Accord idiomatique avec le groupe coordonné « la chair et le sang » en français, exprimant clairement l’incapacité.
- source_word: ἡ φθορά
  choice: ce qui est périssable
  rationale: Exprime de manière accessible l’état soumis à la dégradation et permet de préserver le contraste avec ἀφθαρσία.
- source_word: τὴν ἀφθαρσίαν
  choice: ce qui est impérissable
  rationale: Maintient l’opposition exacte avec « périssable » sans confondre ἀφθαρσία avec le terme distinct désignant l’immortalité.
theological_decisions:
- issue: Sens de « la chair et le sang » par rapport à la résurrection
  choice: Expression désignant la vie humaine mortelle et périssable dans sa condition présente.
  alternative: Affirmation selon laquelle toute réalité corporelle ou matérielle serait exclue du royaume de Dieu.
  rationale: Le contexte immédiat décrit la transformation du corps périssable en condition impérissable, et non l’abandon de toute corporéité. Le texte conserve néanmoins l’expression imagée sans incorporer cette interprétation dans la traduction.
- issue: Portée de l’adresse ἀδελφοί
  choice: « frères » dans le texte, avec une note indiquant la portée inclusive possible.
  alternative: « frères et sœurs » dans le texte principal.
  rationale: Cette solution conserve la forme lexicale grecque tout en informant le lecteur que, dans l’usage paulinien, l’adresse peut viser toute l’assemblée.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation maintient le parallélisme de Paul et l’opposition entre le périssable et l’impérissable, sans résoudre abusivement la tension théologique de l’expression « la chair et le sang ».
