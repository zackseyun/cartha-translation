source:
  edition: SBLGNT
  text: εἰ κατὰ ἄνθρωπον ἐθηριομάχησα ἐν Ἐφέσῳ, τί μοι τὸ ὄφελος; εἰ νεκροὶ οὐκ ἐγείρονται, Φάγωμεν καὶ πίωμεν, αὔριον γὰρ ἀποθνῄσκομεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/032.yaml
  text: If[a], speaking in merely human terms, I fought with wild beasts in Ephesus, what does it profit me? If the dead are not raised[b], “Let us eat and drink[c], for tomorrow we die.”
translation:
  language: fr
  text: Si, humainement parlant[a], j’ai combattu des bêtes sauvages[b] à Éphèse, quel avantage en ai-je ? Si les morts ne ressuscitent pas, « mangeons et buvons, car demain nous mourrons[c] » !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou peut-être : « Si, d’un point de vue purement humain, j’ai combattu des bêtes sauvages à Éphèse… » L’expression grecque peut qualifier la manière de parler de Paul ou le point de vue adopté.'
    reason: lexical_alternative
  - marker: b
    text: « J’ai combattu des bêtes sauvages » peut désigner un combat littéral ou, par métaphore, une lutte contre des adversaires humains brutaux ; le texte principal conserve l’image grecque sans trancher.
    reason: alternative_reading
  - marker: c
    text: Citation ou allusion à Ésaïe 22.13.
    reason: cross_reference
lexical_decisions:
- source_word: κατὰ ἄνθρωπον
  choice: humainement parlant
  rationale: Cette tournure française naturelle conserve l’idée d’une manière de parler ou d’un point de vue purement humain, sans trancher entièrement la portée de l’expression grecque.
- source_word: ἐθηριομάχησα
  choice: j’ai combattu des bêtes sauvages
  rationale: La traduction garde l’image concrète du verbe grec sans décider si Paul évoque un combat littéral ou, par métaphore, des adversaires humains brutaux.
- source_word: ἐν Ἐφέσῳ
  choice: à Éphèse
  rationale: Forme française usuelle du nom de lieu et préposition idiomatique avec un nom de ville.
- source_word: τί μοι τὸ ὄφελος
  choice: quel avantage en ai-je retiré ?
  rationale: Formulation française claire qui exprime le bénéfice personnel visé par la question rhétorique; le passé composé s’accorde naturellement avec le combat évoqué.
- source_word: νεκροὶ οὐκ ἐγείρονται
  choice: les morts ne ressuscitent pas
  rationale: En français biblique moderne, « ressusciter » rend naturellement le passif grec dans ce contexte, tout en laissant implicite l’action divine plutôt que de l’expliciter.
- source_word: Φάγωμεν καὶ πίωμεν
  choice: mangeons et buvons
  rationale: Les impératifs français à la première personne du pluriel rendent directement la valeur exhortative des subjonctifs grecs.
- source_word: αὔριον γὰρ ἀποθνῄσκομεν
  choice: car demain nous mourrons
  rationale: Le futur français exprime la portée future conventionnelle du présent grec et reproduit naturellement l’écho d’Ésaïe 22.13.
theological_decisions:
- issue: Sens littéral ou figuré de ἐθηριομάχησα
  choice: Conserver « j’ai combattu des bêtes sauvages » dans le texte principal sans préciser si le combat était littéral.
  alternative: Comprendre l’expression comme une métaphore désignant une lutte contre des adversaires humains brutaux à Éphèse.
  rationale: Le lexique grec porte l’image des bêtes sauvages, tandis que le contexte ne contraint pas la traduction à résoudre la question historique; la note préserve donc les deux possibilités.
- issue: Voix passive de ἐγείρονται et agent de la résurrection
  choice: Employer le verbe français « ressuscitent » sans nommer explicitement l’agent.
  alternative: Traduire « ne sont pas ressuscités », formulation plus formellement passive.
  rationale: « Les morts ne ressuscitent pas » est la formulation française la plus naturelle dans ce contexte. Elle n’exclut pas l’action de Dieu et évite d’ajouter un agent absent de la proposition grecque.
translation_notes:
  register: Français international moderne, digne et accessible. « Humainement parlant » est idiomatique sans être familier; « bêtes sauvages » préserve l’image vive; la citation finale garde une cadence proverbiale reconnaissable.
