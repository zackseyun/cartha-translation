id: 1CO.15.57
reference: 1 Corinthians 15:57
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τῷ δὲ θεῷ χάρις τῷ διδόντι ἡμῖν τὸ νῖκος διὰ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/057.yaml
  text: But thanks be to God[a], who gives us the victory through our Lord Jesus the Messiah.
translation:
  language: fr
  text: Mais que Dieu soit remercié, lui qui nous donne la victoire par notre Seigneur Jésus le Messie[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionnellement : « Jésus-Christ ». Le titre grec Χριστός signifie « Messie ».'
    reason: alternative_reading
lexical_decisions:
- source_word: χάρις
  choice: que Dieu soit remercié
  rationale: Dans la formule τῷ θεῷ χάρις, χάρις exprime l’action de grâce, non la grâce accordée par Dieu. Cette tournure française conserve la force doxologique de l’expression.
- source_word: δὲ
  choice: Mais
  rationale: δέ marque ici le contraste avec la puissance de la mort et introduit le mouvement de reconnaissance envers Dieu.
- source_word: τῷ θεῷ
  choice: Dieu
  rationale: Le datif désigne celui à qui s’adresse l’action de grâce; la construction française « que Dieu soit remercié » l’exprime naturellement.
- source_word: τῷ διδόντι
  choice: lui qui nous donne
  rationale: Le participe présent substantivé désigne Dieu comme celui qui donne la victoire, avec une valeur actuelle ou caractéristique.
- source_word: ἡμῖν
  choice: nous
  rationale: Le datif indique les bénéficiaires du don de Dieu.
- source_word: τὸ νῖκος
  choice: la victoire
  rationale: L’article et le contexte renvoient à la victoire précise sur la mort exposée dans les versets précédents.
- source_word: διὰ
  choice: par
  rationale: Avec le génitif, διά indique ici le moyen ou la médiation; « par » est naturel en français.
- source_word: τοῦ κυρίου ἡμῶν
  choice: notre Seigneur
  rationale: Rendu usuel du titre christologique κύριος avec le possessif ἡμῶν.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jésus le Messie
  rationale: Χριστός garde sa valeur de titre, équivalent grec de « Messie ». L’article ajouté en français rend ce titre de manière idiomatique sans prétendre reproduire un article grec.
theological_decisions:
- issue: Traduction de Χριστοῦ dans Ἰησοῦ Χριστοῦ
  choice: « le Messie » dans le texte principal
  alternative: « Christ » (« Jésus-Christ » ou « Jésus Christ »)
  rationale: Le terme Χριστός signifie « Messie » et sa valeur titulaire demeure pertinente dans cette confession. La forme traditionnelle « Christ » est signalée en note afin de préserver la familiarité liturgique et la transparence éditoriale.
translation_notes:
  register: Français international moderne, digne et accessible. « Que Dieu soit remercié » évite l’expression plus figée « grâces soient rendues à Dieu » tout en conservant le ton solennel d’action de grâce. Le pronom détaché « lui » clarifie que Dieu est celui qui donne la victoire.
