id: 1CO.15.25
reference: 1 Corinthians 15:25
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: δεῖ γὰρ αὐτὸν βασιλεύειν ἄχρι ⸀οὗ θῇ πάντας τοὺς ἐχθροὺς ὑπὸ τοὺς πόδας αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/025.yaml
  text: For he must reign until he has put all his enemies under his feet[a][b].
translation:
  language: fr
  text: Car il faut qu’il règne jusqu’à ce qu’il ait mis tous ses ennemis sous ses pieds[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « jusqu’à ce qu’il mette tous ses ennemis sous ses pieds ». La formulation grecque n’impose pas à elle seule de choisir entre ces deux manières d’envisager l’accomplissement de l’action en français.
    reason: lexical_alternative
  - marker: b
    text: L’image des ennemis placés « sous ses pieds » exprime dans la Bible leur soumission complète ; comparer Psaume 110.1.
    reason: cross_reference
lexical_decisions:
- source_word: δεῖ
  choice: il faut
  rationale: Exprime une nécessité, ici comprise dans le cadre de l’accomplissement du dessein divin. « Il faut » est naturel en français et conserve la force du grec sans explicitation excessive.
- source_word: γὰρ
  choice: Car
  rationale: Introduit le fondement explicatif de l’affirmation précédente. « Car » rend clairement ce lien logique dans un registre digne et courant.
- source_word: αὐτὸν
  choice: qu’il
  rationale: En grec, le pronom à l’accusatif est le sujet de l’infinitif après δεῖ. La tournure française idiomatique « il faut qu’il règne » en restitue correctement la fonction.
- source_word: βασιλεύειν
  choice: règne
  rationale: Rend directement l’exercice de la royauté et préserve la nuance royale du verbe.
- source_word: ἄχρι οὗ
  choice: jusqu’à ce que
  rationale: Marque un terme temporel. Cette expression française n’affirme pas en elle-même que le règne cessera ensuite.
- source_word: θῇ
  choice: ait mis
  rationale: Le subjonctif passé après « jusqu’à ce que » présente comme accompli l’abaissement de tous les ennemis au terme envisagé. Le grec permet aussi une formulation française au présent, signalée en note.
- source_word: πάντας τοὺς ἐχθροὺς
  choice: tous ses ennemis
  rationale: Conserve la totalité exprimée par πάντας et rend naturellement le rapport des ennemis au Messie dans le contexte.
- source_word: ὑπὸ τοὺς πόδας αὐτοῦ
  choice: sous ses pieds
  rationale: Préserve directement l’image biblique traditionnelle de la soumission complète, en écho au Psaume 110.1.
theological_decisions:
- issue: Portée temporelle de ἄχρι οὗ (« jusqu’à ce que »)
  choice: Traduire « jusqu’à ce que » sans suggérer que le règne du Messie cesse ensuite.
  alternative: Formuler la phrase de façon à laisser entendre que son règne prend fin dès que les ennemis sont soumis.
  rationale: La locution grecque fixe le terme jusqu’auquel l’action est ici envisagée, mais elle n’affirme pas à elle seule la cessation de cette action au-delà de ce terme. La traduction maintient cette tension sans imposer de conclusion théologique.
translation_notes:
  register: Français international moderne, naturel et digne. La structure explicative introduite par « Car », le vocabulaire royal « règne » et l’image « sous ses pieds » conservent la densité et les échos bibliques du texte source.
