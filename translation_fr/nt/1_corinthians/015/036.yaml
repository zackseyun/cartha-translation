  text: ⸀ἄφρων, σὺ ὃ σπείρεις, οὐ ζῳοποιεῖται ἐὰν μὴ ἀποθάνῃ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/036.yaml
  text: Foolish one[b][a], what you sow is not made alive unless it dies.
translation:
  language: fr
  text: Insensé[a] ! Ce que tu sèmes ne reçoit pas la vie[b] à moins de mourir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Sot » ou « personne dépourvue de bon sens ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « ne prend pas vie ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄφρων
  choice: Insensé
  rationale: Le vocatif exprime une réprimande directe et vive. « Insensé » en conserve la force sans recourir à une tournure inutilement familière ou doctrinalement chargée.
- source_word: σὺ
  choice: tu
  rationale: Le pronom grec est emphatique. En français, la deuxième personne est clairement portée par « tu sèmes » ; ajouter « toi » alourdirait la phrase et risquerait de déplacer l’accent.
- source_word: ὃ σπείρεις
  choice: ce que tu sèmes
  rationale: Cette formulation suit de près le grec, reste naturelle en français et conserve précisément l’image des semailles sans expliciter l’objet comme « graine » ou « semence ».
- source_word: ζῳοποιεῖται
  choice: ne reçoit pas la vie
  rationale: La tournure conserve la valeur passive du verbe grec tout en restant idiomatique. Elle évite la formulation lourde « n’est pas rendu vivant » et maintient la nuance de vie communiquée.
- source_word: ἐὰν μὴ
  choice: à moins de
  rationale: Cette locution rend naturellement la condition exceptive en français dans une construction à l’infinitif, sans modifier le rapport logique.
- source_word: ἀποθάνῃ
  choice: mourir
  rationale: L’infinitif est imposé par la tournure française « à moins de » et exprime fidèlement la mort requise dans la condition, sans ajouter « d’abord ».
theological_decisions:
- issue: Rapport métaphorique entre la mort de ce qui est semé et la vie de résurrection
  choice: Conserver l’image agricole sans l’expliciter en formule doctrinale.
  alternative: Présenter explicitement la phrase comme une affirmation sur la résurrection corporelle.
  rationale: Paul répond au scepticisme concernant la résurrection au moyen de l’analogie des semailles. La traduction garde cette image et sa tension sans ajouter une explication absente du verset.
translation_notes:
  register: Français international moderne, direct et digne. La réprimande demeure vive, tandis que la syntaxe reste accessible. La métaphore des semailles et la valeur conditionnelle sont conservées sans développement explicatif.
