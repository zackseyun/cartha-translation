reference: 1 Corinthians 15:54
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὅταν δὲ τὸ ⸂φθαρτὸν τοῦτο ἐνδύσηται ἀφθαρσίαν καὶ τὸ⸃ θνητὸν τοῦτο ἐνδύσηται ⸀ἀθανασίαν, τότε γενήσεται ὁ λόγος ὁ γεγραμμένος· Κατεπόθη ὁ θάνατος εἰς νῖκος.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/054.yaml
  text: 'But when this perishable puts on imperishability[a], and this mortal puts on immortality[d][c][b], then the written word will come to pass: “Death has been swallowed up in victory.”'
translation:
  language: fr
  text: 'Mais lorsque ce qui est périssable aura revêtu l’incorruptibilité et que ce qui est mortel aura revêtu l’immortalité, alors se réalisera la parole écrite[a] : « La mort a été engloutie dans la victoire. »[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « alors s’accomplira la parole qui est écrite ». Le verbe grec signifie plus littéralement « arriver » ou « devenir réalité ».
    reason: alternative_reading
  - marker: b
    text: Citation d’Ésaïe 25.8, selon une formulation qui reflète la tradition grecque citée par Paul.
    reason: cross_reference
lexical_decisions:
- source_word: φθαρτὸν
  choice: ce qui est périssable
  rationale: L’adjectif substantivé désigne ici la condition présente de ce qui est exposé à la dégradation. Cette formulation reste générale comme le grec, sans ajouter explicitement « corps ».
- source_word: ἐνδύσηται
  choice: aura revêtu
  rationale: Le verbe conserve la métaphore du vêtement. Le futur antérieur exprime naturellement en français l’action achevée introduite par « lorsque » et antérieure à la réalisation annoncée ensuite.
- source_word: ἀφθαρσίαν
  choice: l’impérissable
  rationale: Dans la tournure française « revêtir l’impérissable », l’adjectif substantivé est plus naturel que le nom abstrait « impérissabilité », tout en préservant l’opposition avec « périssable ».
- source_word: θνητὸν
  choice: ce qui est mortel
  rationale: Cette traduction concise respecte l’adjectif substantivé et maintient le parallélisme avec « ce qui est périssable ».
- source_word: ἀθανασίαν
  choice: l’immortalité
  rationale: Équivalent français direct et courant du nom grec désignant l’état où la mort n’a plus de prise.
- source_word: γενήσεται
  choice: se réalisera
  rationale: Le verbe signifie ici que la parole citée deviendra réalité. « Se réalisera » est naturel en français sans introduire explicitement une formule technique d’accomplissement.
- source_word: ὁ λόγος ὁ γεγραμμένος
  choice: la parole écrite
  rationale: La formule désigne l’énoncé scripturaire cité. « La parole écrite » est concise, naturelle et plus proche du grec que l’ajout explicite de « Écriture ».
- source_word: Κατεπόθη
  choice: a été engloutie
  rationale: Le passé composé rend naturellement l’aoriste passif comme un fait désormais réalisé au moment futur envisagé, sans préciser l’agent.
- source_word: εἰς νῖκος
  choice: dans la victoire
  rationale: 'Cette formulation garde l’image et la construction de la citation grecque : la mort est entièrement absorbée dans la victoire.'
theological_decisions:
- issue: Valeur de γενήσεται dans l’introduction de la citation
  choice: se réalisera
  alternative: s’accomplira
  rationale: « Se réalisera » indique que la parole deviendra réalité tout en évitant d’imposer au verbe γίνομαι un vocabulaire technique de l’accomplissement qui n’est pas explicitement présent.
- issue: Aspect de Κατεπόθη dans une déclaration orientée vers l’avenir
  choice: a été engloutie
  alternative: sera engloutie
  rationale: 'Le passé composé conserve la forme déclarative de la citation : au moment évoqué, la victoire sur la mort est présentée comme un fait acquis. Le futur expliciterait l’orientation temporelle au prix d’une modification de l’aoriste cité.'
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme grec est conservé, de même que la métaphore du vêtement. La traduction n’ajoute pas le mot « corps », implicite dans le contexte mais absent de ce verset.
