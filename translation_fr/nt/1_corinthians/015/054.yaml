  timestamp: '2026-07-14T11:20:00Z'
review_pass:
  verdict: revise
  source_fidelity: 'Le sens et la structure du grec sont globalement bien rendus : les deux adjectifs substantivés sont conservés, la métaphore du revêtement demeure, et le passé composé de la citation est défendable dans ce cadre futur. Toutefois, « revêtir l’impérissable » ne rend pas clairement le nom abstrait ἀφθαρσίαν et sonne elliptique en français.'
  naturalness: « L’impérissable » après « revêtir » est peu naturel et peut être compris comme une chose ou un être impérissable plutôt que comme la qualité ou condition opposée au périssable. « L’incorruptibilité » est le terme français biblique usuel pour ἀφθαρσία et s’emploie naturellement avec « revêtir ». La phrase révisée conserve un français moderne et accessible.
  terminology: « Incorruptibilité » rend précisément ἀφθαρσία, en parallèle avec « périssable », sans confondre ce terme avec ἀθανασία (« immortalité »). « Parole écrite », « se réalisera » et « engloutie dans la victoire » peuvent être maintenus.
  issues:
  - severity: medium
    issue: « aura revêtu l’impérissable »
    rationale: Le grec emploie le substantif abstrait ἀφθαρσίαν (« incorruptibilité », condition impérissable), non l’adjectif substantivé « l’impérissable ». La formulation française est également inhabituelle après « revêtir » et manque de clarté.
