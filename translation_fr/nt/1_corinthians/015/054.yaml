revisions:
- from: 'Mais lorsque ce qui est périssable aura revêtu l’impérissable et que ce qui est mortel aura revêtu l’immortalité, alors se réalisera la parole écrite[a] : « La mort a été engloutie dans la victoire. »[b]'
  to: 'Mais lorsque ce qui est périssable aura revêtu l’incorruptibilité et que ce qui est mortel aura revêtu l’immortalité, alors se réalisera la parole écrite[a] : « La mort a été engloutie dans la victoire. »[b]'
  rationale: La seule correction nécessaire remplace « l’impérissable » par « l’incorruptibilité », équivalent établi et précis de ἀφθαρσίαν. Elle préserve la distinction grecque entre ἀφθαρσία (« incorruptibilité ») et ἀθανασία (« immortalité »), ainsi que le parallélisme et la métaphore du verset. Les ancres de notes restent correctement placées et les notes demeurent pertinentes.
