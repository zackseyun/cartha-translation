  text: οὐ πᾶσα σὰρξ ἡ αὐτὴ σάρξ, ἀλλὰ ἄλλη μὲν ἀνθρώπων, ἄλλη δὲ σὰρξ κτηνῶν, ἄλλη δὲ ⸂σὰρξ πτηνῶν⸃, ἄλλη δὲ ⸀ἰχθύων.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/039.yaml
  text: Not all flesh is the same flesh[a], but one kind is of humans, another flesh of animals, another of birds[b], and another of fish.
translation:
  language: fr
  text: 'Toute chair n’est pas la même chair[a] : autre est celle des êtres humains, autre la chair des animaux, autre celle des oiseaux, et autre celle des poissons.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus idiomatiquement : « Toutes les chairs ne sont pas identiques. »'
    reason: lexical_alternative
lexical_decisions:
- source_word: σὰρξ
  choice: chair
  rationale: Le terme désigne ici la réalité corporelle des différentes créatures, et non la nature pécheresse. « Chair » conserve le sens concret ainsi que la répétition voulue par Paul.
- source_word: οὐ πᾶσα σὰρξ ἡ αὐτὴ σάρξ
  choice: Toute chair n’est pas la même chair
  rationale: Cette formulation suit de près la construction grecque et en préserve la répétition et l’opposition catégorielle. Une formulation plus idiomatique est donnée en note.
- source_word: ἄλλη
  choice: autre
  rationale: La répétition de « autre » reproduit l’anaphore grecque et souligne la distinction entre les catégories de créatures.
- source_word: ἀνθρώπων
  choice: êtres humains
  rationale: Le mot vise l’humanité en général, sans distinction de sexe. « Êtres humains » rend clairement cette portée générique.
- source_word: κτηνῶν
  choice: animaux
  rationale: Dans cette énumération, le terme désigne les animaux par opposition aux humains, aux oiseaux et aux poissons. « Animaux » est le terme français courant le moins restrictif.
- source_word: πτηνῶν
  choice: oiseaux
  rationale: Dans ce classement des créatures, « oiseaux » est le rendu français naturel du terme désignant les êtres volants.
- source_word: ἰχθύων
  choice: poissons
  rationale: Le pluriel générique français correspond au génitif pluriel grec et désigne cette catégorie de créatures.
- source_word: σὰρξ κτηνῶν / σὰρξ πτηνῶν / ἰχθύων
  choice: la chair des animaux… celle des oiseaux… celle des poissons
  rationale: Le français emploie « celle » pour reprendre naturellement « chair ». Cette reprise maintient le parallélisme tout en respectant l’ellipse de σάρξ dans le dernier membre grec.
theological_decisions:
- issue: Sens de σάρξ dans ce passage paulinien
  choice: chair au sens concret
  alternative: corps ; nature
  rationale: Le contexte porte sur les différentes formes de vie créée et sur la résurrection. σάρξ a donc ici son sens corporel concret, sans connotation de nature pécheresse.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure légèrement littéraire « autre est celle de… » conserve le rythme rhétorique et le parallélisme du grec sans introduire de catégorie théologique absente du texte.
