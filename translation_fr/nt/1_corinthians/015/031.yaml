source:
  edition: SBLGNT
  text: καθ’ ἡμέραν ἀποθνῄσκω, νὴ τὴν ὑμετέραν ⸀καύχησιν, ἣν ἔχω ἐν Χριστῷ Ἰησοῦ τῷ κυρίῳ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/031.yaml
  text: I die every day—by the boasting in you that I have in Messiah Jesus our Lord[a][b][c].
translation:
  language: fr
  text: Chaque jour[a], je meurs — j’en jure par la fierté que j’ai à votre sujet[b] dans le Messie Jésus[c], notre Seigneur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « quotidiennement, je meurs ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « aussi vrai que vous êtes pour moi un sujet de fierté » ; on peut aussi comprendre : « par votre fierté ». L’expression grecque a la forme d’un serment, et le rapport grammatical du mot traduit par « fierté » est discuté.'
    reason: alternative_reading
  - marker: c
    text: 'Traduction traditionnelle : « dans le Christ Jésus ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθ’ ἡμέραν
  choice: chaque jour
  rationale: Cette expression idiomatique signifie « chaque jour » ou « quotidiennement ». « Chaque jour » est naturel en français et conserve la force répétitive.
- source_word: ἀποθνῄσκω
  choice: je meurs
  rationale: Le présent actif à la première personne est rendu directement afin de préserver la formulation vive et rhétorique de Paul, sans l’expliciter par « je risque la mort ».
- source_word: νὴ
  choice: j’en jure par
  rationale: La particule introduit une affirmation solennelle de type serment. Cette formulation française en restitue la force tout en gardant le complément qui suit comme objet du serment.
- source_word: τὴν ὑμετέραν καύχησιν
  choice: la fierté que j’ai à votre sujet
  rationale: καύχησις peut désigner l’action de se glorifier ou un sujet de fierté. Avec ὑμετέραν et la relative ἣν ἔχω, le sens le plus probable est la fierté de Paul à l’égard des Corinthiens. La note conserve l’ambiguïté grammaticale.
- source_word: ἣν ἔχω
  choice: que j’ai
  rationale: La relative est rendue simplement et naturellement, sans ajouter d’interprétation.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: dans le Messie Jésus
  rationale: « Messie » rend Χριστός comme titre, tandis que « dans » conserve l’expression paulinienne théologiquement significative.
- source_word: τῷ κυρίῳ ἡμῶν
  choice: notre Seigneur
  rationale: Rendu français direct et idiomatique du titre κύριος accompagné du possessif.
theological_decisions:
- issue: 'Valeur de Χριστῷ : titre ou forme devenue quasi nominale'
  choice: le Messie Jésus
  alternative: le Christ Jésus
  rationale: « Messie » fait entendre la valeur titulaire de Χριστός. La formulation traditionnelle « le Christ Jésus » est signalée en note.
- issue: Rapport de καύχησις avec ὑμετέραν
  choice: la fierté de Paul au sujet des Corinthiens
  alternative: la fierté appartenant aux Corinthiens (« votre fierté »)
  rationale: La relative « que j’ai » favorise l’idée d’une fierté que Paul éprouve à leur sujet, mais la construction grecque permet aussi formellement « votre fierté » ; cette ambiguïté est conservée en note.
- issue: Force de la formule νὴ τὴν…
  choice: 'formule de serment : « j’en jure par… »'
  alternative: 'formule comparative : « aussi vrai que… »'
  rationale: νὴ marque une affirmation solennelle. Le français principal conserve la forme du serment, tandis que la note donne une reformulation naturelle possible.
translation_notes:
  register: Français international moderne, digne et oralement fluide. La tournure inhabituelle « j’en jure par » est maintenue parce qu’elle reflète le caractère solennel et frappant de la formule grecque ; les lectures plus idiomatiques et l’ambiguïté syntaxique sont documentées en note.
