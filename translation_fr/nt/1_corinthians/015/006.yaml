  text: ἔπειτα ὤφθη ἐπάνω πεντακοσίοις ἀδελφοῖς ἐφάπαξ, ἐξ ὧν οἱ ⸀πλείονες μένουσιν ἕως ἄρτι, τινὲς ⸀δὲ ἐκοιμήθησαν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/006.yaml
  text: Then he appeared to more than five hundred brothers at one time[a], most of whom remain until now[b], though some have fallen asleep.
translation:
  language: fr
  text: Ensuite, il est apparu à plus de cinq cents frères à la fois[a]. La plupart d’entre eux sont encore en vie jusqu’à présent, mais quelques-uns se sont endormis[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « frères et sœurs » ; le grec dit « frères », terme qui, dans l’usage des premières communautés chrétiennes, peut parfois désigner plus largement l’ensemble des croyants.
    reason: lexical_alternative
  - marker: b
    text: C’est-à-dire qu’ils sont morts. Paul emploie l’image de ceux qui se sont « endormis », expression courante chez les premiers chrétiens pour parler de la mort à la lumière de l’espérance de la résurrection.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔπειτα
  choice: Ensuite
  rationale: Marque naturellement la succession des apparitions dans l’énumération de Paul.
- source_word: ὤφθη
  choice: il est apparu
  rationale: Dans les récits d’apparition après la résurrection, cette forme de ὁράω exprime idiomatiquement le fait de se manifester ou d’apparaître. Le sujet implicite est le Christ, mentionné dans le contexte précédent.
- source_word: ἐπάνω πεντακοσίοις
  choice: à plus de cinq cents
  rationale: Avec un nombre, ἐπάνω signifie ici « plus de ».
- source_word: ἀδελφοῖς
  choice: frères
  rationale: Conserve le masculin pluriel du grec, tout en signalant en note que l’usage communautaire peut inclure l’ensemble des croyants.
- source_word: ἐφάπαξ
  choice: à la fois
  rationale: Exprime que l’apparition a eu lieu simultanément devant ce grand groupe, plutôt que séparément pour chacun.
- source_word: ἐξ ὧν οἱ πλείονες
  choice: La plupart d’entre eux
  rationale: Rend clairement et naturellement en français la construction partitive grecque.
- source_word: μένουσιν ἕως ἄρτι
  choice: sont encore en vie aujourd’hui
  rationale: Dans l’opposition avec ceux qui se sont endormis, μένουσιν désigne ceux qui demeurent vivants jusqu’au moment où Paul écrit. La formulation française explicite ce que le contexte grec implique.
- source_word: τινὲς δὲ
  choice: mais quelques-uns
  rationale: δέ introduit un contraste modéré entre la majorité encore vivante et la minorité décédée.
- source_word: ἐκοιμήθησαν
  choice: se sont endormis
  rationale: Préserve la métaphore du sommeil employée pour la mort, particulièrement significative dans un chapitre consacré à la résurrection.
theological_decisions:
- issue: Portée de ἀδελφοῖς dans une communauté possiblement mixte
  choice: frères
  alternative: frères et sœurs
  rationale: Le texte principal conserve la forme masculine du grec sans exclure une possible portée communautaire plus large, indiquée en note.
- issue: Métaphore du sommeil pour la mort
  choice: se sont endormis
  alternative: sont morts
  rationale: La métaphore est conservée parce qu’elle appartient au langage de Paul et résonne avec l’espérance de la résurrection développée dans le chapitre.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe est fluide pour un lectorat général, tandis que les images et les tensions lexicales importantes du grec sont préservées.
