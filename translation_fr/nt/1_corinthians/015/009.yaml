reference: 1 Corinthians 15:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐγὼ γάρ εἰμι ὁ ἐλάχιστος τῶν ἀποστόλων, ὃς οὐκ εἰμὶ ἱκανὸς καλεῖσθαι ἀπόστολος, διότι ἐδίωξα τὴν ἐκκλησίαν τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/009.yaml
  text: For I am the least of the apostles[a], who am not worthy to be called an apostle, because I persecuted the church of God.
translation:
  language: fr
  text: Car je suis le moindre des apôtres, moi qui ne suis pas digne d’être appelé apôtre, parce que j’ai persécuté l’Église de Dieu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γάρ
  choice: Car
  rationale: Marque naturellement en français le lien explicatif avec le verset précédent.
- source_word: ἐλάχιστος
  choice: le moindre
  rationale: Exprime le rang ou l’importance relative parmi les apôtres, et non la taille physique.
- source_word: ἀπόστολος / ἀποστόλων
  choice: apôtre / apôtres
  rationale: Conserve ici le sens reconnu et spécifique du rôle apostolique.
- source_word: ἱκανός
  choice: digne
  rationale: Dans ce contexte d’abaissement motivé par la persécution passée, « digne » rend bien le sentiment d’indignité, tout en laissant au terme sa nuance générale d’aptitude ou de capacité.
- source_word: καλεῖσθαι
  choice: être appelé
  rationale: Rend directement et idiomatiquement l’infinitif passif grec.
- source_word: διότι
  choice: parce que
  rationale: Introduit clairement la raison explicite donnée par Paul.
- source_word: ἐδίωξα
  choice: j’ai persécuté
  rationale: Le contexte désigne sans ambiguïté une poursuite hostile contre les croyants.
- source_word: ἐκκλησίαν τοῦ θεοῦ
  choice: l’Église de Dieu
  rationale: Désigne la communauté appartenant à Dieu; « Église » est le terme français courant dans ce contexte paulinien et conserve la construction génitive.
- source_word: ὃς
  choice: et je
  rationale: La coordination rend en français naturel la relative grecque rattachée à un antécédent de première personne, sans changer son sens.
theological_decisions:
- issue: Nature de l’affirmation de Paul concernant son apostolat
  choice: Paul se compte réellement parmi les apôtres tout en se déclarant indigne d’en porter le titre.
  alternative: Comprendre qu’il nie entièrement son apostolat, ou qu’il parle seulement d’un rang social inférieur.
  rationale: « Je suis le moindre des apôtres » l’inclut dans leur groupe, tandis que son indignité déclarée découle de la persécution passée. La traduction maintient cette tension.
translation_notes:
  register: Français international moderne, naturel et digne. La tournure « et je ne suis pas digne » évite la relative française maladroite « moi… qui ne suis pas » tout en conservant le lien logique du grec. Majuscule à « Église » selon l’usage éditorial français lorsqu’il s’agit de la communauté universelle des croyants.
