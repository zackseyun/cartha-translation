  text: et qu’il est apparu à Céphas[a][b], puis aux Douze[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « il a été vu par Céphas ». Le verbe grec est formellement au passif, mais, dans les contextes d’apparitions après la résurrection, il est couramment traduit par « est apparu ».'
    reason: lexical_alternative
  - marker: b
    text: Céphas est le nom araméen correspondant à Pierre.
    reason: cross_reference
