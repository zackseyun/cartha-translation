lexical_decisions:
- source_word: ὤφθη
  choice: est apparu
  rationale: L’aoriste passif de ὁράω est couramment employé avec le sens idiomatique d’« apparaître » dans les récits d’apparitions après la résurrection. Cette formulation est naturelle en français et n’explicite pas davantage le mode de la manifestation.
- source_word: Κηφᾷ
  choice: à Céphas
  rationale: Le datif grec indique le destinataire de l’apparition. « Céphas » conserve la forme du nom employée dans le texte au lieu de l’harmoniser avec « Pierre ».
- source_word: εἶτα
  choice: puis
  rationale: « Puis » marque avec concision la succession des apparitions dans la tradition citée par Paul.
- source_word: τοῖς δώδεκα
  choice: aux douze
  rationale: La traduction conserve littéralement la désignation collective reconnue du cercle apostolique, sans la remplacer par « les Onze » ni par « les apôtres ».
- source_word: καὶ ὅτι
  choice: et que
  rationale: Cette formulation maintient le lien syntaxique avec la série de propositions introduites dans les versets précédents.
theological_decisions:
- issue: Formulation de l’apparition après la résurrection
  choice: il est apparu
  alternative: il a été vu par Céphas
  rationale: « Est apparu » rend naturellement l’usage du passif grec dans ce contexte tout en affirmant l’apparition sans en définir le mode. La variante en note conserve la forme passive possible.
- issue: Désignation « les douze » malgré l’absence de Judas
  choice: les douze
  alternative: les Onze ; les apôtres
  rationale: Le grec emploie la désignation traditionnelle τοῖς δώδεκα. La conserver évite d’harmoniser le verset avec une reconstruction tirée d’autres passages.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe brève préserve le caractère formulé de la tradition transmise en 1 Corinthiens 15. La minuscule à « douze » convient au texte courant tout en conservant la valeur de désignation collective.
