review_pass:
  verdict: revise
  source_fidelity: Le parallélisme corrélatif οἷος … τοιοῦτοι est bien rendu par « Tel est … tels sont aussi … ». « Céleste » rend justement ἐπουράνιος sans importer « venu du ciel ». En revanche, « tiré de la poussière » peut évoquer l’extraction ou la provenance; χοϊκός qualifie plus directement une condition ou une constitution de poussière. « Fait de poussière » exprime plus nettement cette valeur tout en conservant l’allusion à Adam.
  naturalness: La phrase est claire, soutenue et naturelle en français international moderne. La répétition équilibrée de « fait(s) de poussière » et de « céleste(s) » maintient la structure rhétorique de Paul.
  terminology: « L’homme céleste » et « ceux qui sont célestes » conservent le contraste personnel et adjectival du grec. « Fait de poussière » est plus précis et idiomatique que « tiré de la poussière » pour χοϊκός.
  issues:
  - severity: low
    issue: Nuance de « tiré de la poussière » pour χοϊκός
    rationale: Cette expression peut se comprendre comme une origine ou un déplacement depuis la poussière, alors que l’adjectif grec caractérise l’homme et les siens comme étant de poussière. « Fait de poussière » rend mieux cette caractérisation sans surinterpréter.
  revised_text: Tel est l’homme fait de poussière, tels sont aussi ceux qui sont faits de poussière ; et tel est l’homme céleste, tels sont aussi ceux qui sont célestes.
