  text: οἷος ὁ χοϊκός, τοιοῦτοι καὶ οἱ χοϊκοί, καὶ οἷος ὁ ἐπουράνιος, τοιοῦτοι καὶ οἱ ἐπουράνιοι·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/048.yaml
  text: As is the man of dust[a], so also are those of dust; and as is the heavenly man, so also are those who are heavenly.
translation:
  language: fr
  text: Tel est l’homme fait de poussière, tels sont aussi ceux qui sont faits de poussière ; et tel est l’homme céleste, tels sont aussi ceux qui sont célestes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἷος ... τοιοῦτοι
  choice: Tel est… tels sont aussi…
  rationale: Cette tournure corrélative française conserve la correspondance entre la figure représentative et ceux qui lui appartiennent, ainsi que le parallélisme marqué du grec.
- source_word: χοϊκός
  choice: tiré de la poussière
  rationale: L’expression évoque clairement l’origine d’Adam dans la poussière, déjà présente au verset 47, sans employer « poussiéreux », qui évoquerait surtout une apparence couverte de poussière.
- source_word: ὁ χοϊκός
  choice: l’homme tiré de la poussière
  rationale: Le contexte oppose Adam et le Christ comme figures humaines représentatives. L’ajout d’« homme », implicite dans l’adjectif substantivé masculin, rend le français naturel.
- source_word: οἱ χοϊκοί
  choice: ceux qui sont tirés de la poussière
  rationale: Cette formulation désigne des personnes partageant la condition de l’homme tiré de la poussière et maintient le lien lexical avec le singulier.
- source_word: ἐπουράνιος
  choice: céleste
  rationale: « Céleste » exprime l’appartenance au ciel et préserve l’opposition adjectivale avec χοϊκός, sans reprendre indûment la formule « venu du ciel » du verset 47.
- source_word: ὁ ἐπουράνιος
  choice: l’homme céleste
  rationale: Le contexte identifie cette figure au Christ en contraste avec Adam. « L’homme céleste » conserve le parallélisme personnel et représentatif.
- source_word: οἱ ἐπουράνιοι
  choice: ceux qui sont célestes
  rationale: La formulation garde la force adjectivale du grec et, dans ce contexte sur l’humanité et la résurrection, renvoie aux personnes correspondant à l’homme céleste plutôt qu’aux anges.
theological_decisions:
- issue: Faut-il expliciter par « homme » le contraste Adam-Christ dans les deux syntagmes singuliers ?
  choice: Employer « l’homme tiré de la poussière » et « l’homme céleste ».
  alternative: Employer « celui qui est tiré de la poussière » et « celui qui est céleste ».
  rationale: Les versets 45 à 49 opposent Adam et le Christ comme figures représentatives. « Homme » clarifie les référents sans ajouter une affirmation étrangère au contexte.
- issue: οἱ ἐπουράνιοι désigne-t-il des êtres célestes ou des humains correspondant à l’homme céleste ?
  choice: Le rendre par « ceux qui sont célestes », avec des référents humains déterminés par le contexte.
  alternative: « les êtres célestes »
  rationale: Paul traite ici de l’humanité, de la résurrection et de ceux qui porteront l’image de l’homme céleste, non des anges. La traduction préserve néanmoins la formulation adjectivale concise du grec.
translation_notes:
  register: Français international moderne, digne et accessible. La structure balancée « Tel est… tels sont aussi… » reproduit volontairement le parallélisme rhétorique du grec. Aucun marqueur de note n’est nécessaire.
