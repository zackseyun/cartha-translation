source:
  edition: SBLGNT
  text: ὁ δὲ θεὸς ⸂δίδωσιν αὐτῷ⸃ σῶμα καθὼς ἠθέλησεν, καὶ ἑκάστῳ τῶν σπερμάτων ⸀ἴδιον σῶμα.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/038.yaml
  text: But God gives it a body as he willed[a], and to each of the seeds its own body.
translation:
  language: fr
  text: Mais Dieu lui donne un corps comme il l’a voulu, et à chacune des semences un corps qui lui est propre.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à chaque semence son propre corps ». Le grec dit littéralement « à chacune des semences » ; cette expression peut avoir un sens distributif.
    reason: Alternative lexicale et précision sur la construction distributive grecque.
lexical_decisions:
- source_word: δίδωσιν αὐτῷ
  choice: lui donne
  rationale: Le présent « donne » traduit directement δίδωσιν, et le pronom datif « lui » renvoie à la semence mentionnée dans le contexte précédent.
- source_word: σῶμα
  choice: un corps
  rationale: « Corps » est l’équivalent courant de σῶμα et maintient le lien lexical avec le thème du corps ressuscité dans l’ensemble du chapitre.
- source_word: καθὼς ἠθέλησεν
  choice: comme il l’a voulu
  rationale: Cette formulation naturelle conserve l’aoriste et souligne la volonté de Dieu sans préciser davantage la nature ou le moment de cette décision.
- source_word: ἑκάστῳ τῶν σπερμάτων
  choice: à chacune des semences
  rationale: Le féminin « chacune » s’accorde avec « semences » et reproduit la construction distributive avec génitif partitif, sans introduire la notion interprétative d’« espèce ».
- source_word: ἴδιον σῶμα
  choice: un corps qui lui est propre
  rationale: Cette expression française naturelle rend la relation particulière exprimée par ἴδιον et évite l’ambiguïté possible de « son propre corps » dans cette phrase.
theological_decisions:
- issue: Action et volonté divines dans l’analogie de la semence et du corps
  choice: Dieu donne à la semence le corps qu’il a voulu et attribue à chacune un corps qui lui est propre.
  alternative: Expliciter que Dieu donne un type ou une espèce de corps à chaque catégorie de semence.
  rationale: Le texte affirme l’action et la volonté de Dieu ainsi que la particularité du corps donné à chaque semence, mais il ne contient pas explicitement les mots « type », « espèce » ou « catégorie ».
translation_notes:
  register: Français international moderne, clair et digne. La coordination elliptique de la seconde proposition est conservée, comme en grec, tout en restant naturelle en français.
