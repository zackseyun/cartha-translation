language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: πάντα γὰρ ὑπέταξεν ὑπὸ τοὺς πόδας αὐτοῦ. ὅταν δὲ εἴπῃ ὅτι πάντα ὑποτέτακται, δῆλον ὅτι ἐκτὸς τοῦ ὑποτάξαντος αὐτῷ τὰ πάντα.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/027.yaml
  text: For he has subjected all things under his feet. But when it says that all things have been subjected[a], it is clear that this excludes the one who subjected all things to him.
translation:
  language: fr
  text: En effet, « il a tout soumis sous ses pieds ». Mais lorsqu’il est dit[a] que tout a été soumis, il est évident que cela exclut celui qui lui a tout soumis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « lorsqu’il dit ». Le sujet implicite peut être compris comme Dieu ou comme la déclaration scripturaire citée.'
    reason: ambiguïté grammaticale du sujet implicite
lexical_decisions:
- source_word: πάντα / τὰ πάντα
  choice: tout
  rationale: Le neutre pluriel a une portée globale. « Tout » est naturel en français et conserve l’écho de l’affirmation scripturaire selon laquelle toute réalité est placée sous les pieds du Messie.
- source_word: ὑπέταξεν
  choice: a soumis
  rationale: Le verbe exprime la mise en position subordonnée. Le passé composé rend naturellement l’aoriste dans cette déclaration scripturaire dont l’effet demeure.
- source_word: ὑπὸ τοὺς πόδας αὐτοῦ
  choice: sous ses pieds
  rationale: L’image biblique de domination est conservée littéralement afin de préserver son lien avec le Psaume 8.
- source_word: ὅταν δὲ εἴπῃ
  choice: Mais lorsqu’il est dit
  rationale: La tournure impersonnelle renvoie naturellement à la déclaration scripturaire sans préciser indûment un sujet que le grec laisse implicite. Une autre analyse grammaticale est signalée en note.
- source_word: ὑποτέτακται
  choice: a été soumis
  rationale: Le parfait passif décrit une soumission accomplie dont l’état résultant demeure. Le passif composé est idiomatique et conserve cette orientation.
- source_word: δῆλον
  choice: il est évident
  rationale: Cette expression rend l’inférence explicite attendue par Paul, dans un registre clair et digne.
- source_word: ἐκτὸς τοῦ ὑποτάξαντος αὐτῷ τὰ πάντα
  choice: cela exclut celui qui lui a tout soumis
  rationale: 'ἐκτός marque ici une exception. Cette formulation française explicite le raisonnement : celui qui soumet tout au Messie ne fait pas lui-même partie de ce qui lui est soumis.'
- source_word: αὐτῷ
  choice: lui
  rationale: Le datif désigne celui auquel tout est soumis; dans le contexte, il s’agit du Fils ou Messie. « Lui » conserve la référence contextuelle sans ajout explicatif.
theological_decisions:
- issue: Rapport entre le Fils et celui qui lui soumet tout
  choice: Le texte exclut clairement de « tout » celui qui soumet tout au Fils.
  alternative: « excepté celui qui lui a tout soumis », formulation plus littérale de l’exception
  rationale: La traduction maintient la distinction relationnelle exprimée par Paul sans développer au-delà du texte la manière dont cette relation doit être comprise.
- issue: Sujet implicite de ὅταν δὲ εἴπῃ
  choice: 'Lecture impersonnelle renvoyant à l’énoncé de l’Écriture : « lorsqu’il est dit »'
  alternative: « lorsqu’il dit », avec Dieu comme sujet implicite
  rationale: Le grec permet que le sujet soit compris comme Dieu, mais ne l’énonce pas. La traduction principale évite de trancher silencieusement, et la note préserve l’autre lecture.
translation_notes:
  register: Français international moderne, clair et digne. Les guillemets signalent l’allusion citationnelle au Psaume 8. L’expression imagée « sous ses pieds » est maintenue pour sa résonance scripturaire; la structure logique de l’exception reste explicite.
