  text: ὁ πρῶτος ἄνθρωπος ἐκ γῆς χοϊκός, ὁ δεύτερος ⸀ἄνθρωπος ἐξ οὐρανοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/047.yaml
  text: The first man was from the earth[a], made of dust; the second man is from heaven.
translation:
  language: fr
  text: Le premier homme est de la terre, fait de poussière[a] ; le deuxième homme est du ciel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « terrestre » ou « de poussière ». L’adjectif grec évoque la création d’Adam à partir de la poussière.
    reason: alternative lexicale et allusion au récit de la création
lexical_decisions:
- source_word: πρῶτος
  choice: premier
  rationale: L’adjectif ordinal ouvre le contraste représentatif entre Adam et le Christ et se traduit naturellement par « premier ».
- source_word: ἄνθρωπος
  choice: homme
  rationale: Dans les deux propositions, le singulier renvoie respectivement à Adam et au Christ. « Homme » conserve le parallélisme délibéré et la typologie adamique.
- source_word: ἐκ γῆς
  choice: tiré de la terre
  rationale: La préposition exprime l’origine. « Tiré de la terre » est naturel en français et fait entendre l’allusion au récit de la création d’Adam.
- source_word: χοϊκός
  choice: fait de poussière
  rationale: L’adjectif désigne ce qui est constitué de poussière et rappelle la création d’Adam. Cette formulation évite l’ambiguïté moderne de « terrestre », qui peut seulement signifier « appartenant à la terre ».
- source_word: δεύτερος
  choice: deuxième
  rationale: L’ordinal maintient le contraste formel avec « premier » sans ajouter d’identification absente du verset.
- source_word: ἐξ οὐρανοῦ
  choice: vient du ciel
  rationale: L’expression indique l’origine céleste. En français, « vient du ciel » rend naturellement la proposition nominale grecque et son sens dynamique de provenance.
theological_decisions:
- issue: Portée christologique de « le deuxième homme »
  choice: Conserver « le deuxième homme » sans ajouter « Christ ».
  alternative: « Le deuxième homme, le Christ, vient du ciel. »
  rationale: Le contexte identifie ce deuxième homme au Christ, mais le verset grec ne le nomme pas explicitement. La traduction préserve donc la formulation et la tension du texte.
- issue: Temps implicite dans les deux propositions sans copule exprimée
  choice: 'Employer le présent : « est fait » et « vient ».'
  alternative: 'Employer le passé dans la première proposition : « était tiré de la terre » ou « fut fait de poussière ».'
  rationale: Le grec juxtapose deux propositions nominales sans verbe exprimé. Le présent français formule clairement les qualités et origines mises en contraste sans imposer une dissymétrie temporelle absente de la syntaxe grecque.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme « premier homme… deuxième homme » est conservé. Le point-virgule marque nettement les deux membres du contraste paulinien.
