  source_fidelity: Le texte français rend fidèlement la progression temporelle et les deux emplois passif de ὑποτάσσω. « Mais quand », « alors », « le Fils lui-même », « à celui qui lui aura soumis toutes choses » et « afin que Dieu soit tout en tous » correspondent au grec sans introduire de qualification doctrinale étrangère au verset. Le futur antérieur dans les deux subordonnées est idiomatique en français pour présenter l’accomplissement préalable à l’étape eschatologique annoncée.
  naturalness: Le français est moderne, clair et d’un registre biblique sobre. « Toutes choses » est légèrement soutenu, mais demeure intelligible et sert utilement la répétition structurante de τὰ πάντα. La formule conclusive « tout en tous » est dense mais établie et appropriée à la concision volontaire du grec.
  terminology: 'La répétition de « toutes choses » préserve la portée cosmique de τὰ πάντα. « Soumis » garde la voix passive et évite d’interpréter la relation du Fils. Les notes sont correctement ancrées : a éclaire l’alternative « tout », b signale à juste titre l’ambiguïté de πάντα ἐν πᾶσιν, sans réduire πᾶσιν aux seules personnes.'
