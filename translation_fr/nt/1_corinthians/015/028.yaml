reference: 1 Corinthians 15:28
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὅταν δὲ ὑποταγῇ αὐτῷ τὰ πάντα, ⸀τότε αὐτὸς ὁ υἱὸς ὑποταγήσεται τῷ ὑποτάξαντι αὐτῷ τὰ πάντα, ἵνα ᾖ ὁ θεὸς ⸀πάντα ἐν πᾶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/028.yaml
  text: But when all things are subjected to him[a], then the Son himself will also be subjected to the one who subjected all things to him[b], so that God may be all in all.
translation:
  language: fr
  text: Mais quand toutes choses lui auront été soumises[a], alors le Fils lui-même sera soumis à celui qui lui aura soumis toutes choses, afin que Dieu soit tout en tous[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « tout ». Le grec emploie à plusieurs reprises l’expression « toutes choses » (τὰ πάντα), qui souligne ici la portée cosmique de l’argument.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « tout en chacun ». L’expression grecque est très condensée et peut se rendre plus littéralement par « toutes choses en tous » ; le dernier pluriel peut désigner des personnes ou avoir une portée plus générale.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὅταν δὲ
  choice: Mais quand
  rationale: ὅταν introduit une circonstance temporelle future, tandis que δέ marque ici une légère transition contrastive dans la progression de l’argument.
- source_word: ὑποταγῇ
  choice: auront été soumises
  rationale: L’aoriste passif subjonctif est rendu par un futur antérieur français, naturel après « quand » dans ce contexte futur, tout en conservant le sens passif.
- source_word: αὐτῷ
  choice: lui
  rationale: Le pronom datif renvoie au Fils dans le contexte et indique à qui toutes choses sont soumises.
- source_word: τὰ πάντα
  choice: toutes choses
  rationale: Cette formulation conserve la répétition grecque et la portée cosmique du neutre pluriel, sans le réduire aux seules personnes.
- source_word: τότε
  choice: alors
  rationale: L’adverbe marque l’étape qui suit dans la séquence eschatologique.
- source_word: αὐτὸς ὁ υἱὸς
  choice: le Fils lui-même
  rationale: « lui-même » restitue l’emphase portée par αὐτός sur le Fils en personne.
- source_word: ὑποταγήσεται
  choice: sera soumis
  rationale: Le futur passif est conservé, ainsi que la cohérence lexicale avec la première occurrence de ὑποτάσσω. Aucun « aussi » n’est ajouté, puisqu’il n’est pas exprimé dans le texte grec fourni.
- source_word: τῷ ὑποτάξαντι
  choice: à celui qui lui aura soumis
  rationale: Le participe aoriste substantivé désigne celui qui accomplit la soumission de toutes choses. Le futur antérieur situe naturellement cet accomplissement avant la soumission alors annoncée du Fils.
- source_word: ἵνα ᾖ
  choice: afin que … soit
  rationale: Cette tournure garde la valeur de but ou de résultat de ἵνα avec le subjonctif, sans trancher entre ces deux nuances proches.
- source_word: ὁ θεὸς
  choice: Dieu
  rationale: Rendu direct du sujet nominatif.
- source_word: πάντα ἐν πᾶσιν
  choice: tout en tous
  rationale: Cette expression française concise préserve la densité, l’ampleur et la force rhétorique de la formule paulinienne sans en préciser indûment les référents.
theological_decisions:
- issue: La soumission du Fils à celui qui lui soumet toutes choses
  choice: Exprimer directement que le Fils sera soumis, en conservant le passif du grec.
  alternative: Paraphraser la relation pour éviter toute idée de subordination, ou préciser qu’il s’agit uniquement d’une subordination fonctionnelle ou eschatologique.
  rationale: Le texte affirme cette soumission dans le cadre de l’achèvement eschatologique. La traduction ne doit ni l’atténuer ni lui ajouter une explication ontologique absente du verset.
- issue: La portée de τὰ πάντα et de πάντα ἐν πᾶσιν
  choice: Employer « toutes choses » puis la formule globale « tout en tous ».
  alternative: Employer « tout », « tout en chacun » ou « toutes choses en toutes choses ».
  rationale: La répétition du vocabulaire de totalité est essentielle à l’argument. La formulation retenue conserve sa portée universelle et l’ambiguïté du dernier pluriel grec.
translation_notes:
  register: Français international moderne, digne et accessible. « Toutes choses » est légèrement soutenu mais justifié par la répétition structurante du grec. La formule « tout en tous » garde volontairement le caractère dense et solennel de la conclusion.
