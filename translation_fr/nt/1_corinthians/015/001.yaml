  text: Γνωρίζω δὲ ὑμῖν, ἀδελφοί, τὸ εὐαγγέλιον ὃ εὐηγγελισάμην ὑμῖν, ὃ καὶ παρελάβετε, ἐν ᾧ καὶ ἑστήκατε,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/001.yaml
  text: I make known to you[a], brothers, the good news that I proclaimed to you, which you also received, in which you also stand,
translation:
  language: fr
  text: Je vous fais connaître, frères[a], la bonne nouvelle que je vous ai annoncée, que vous avez aussi reçue et dans laquelle vous tenez ferme.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « frères » ; en grec, le masculin pluriel peut ici s’adresser à l’ensemble de la communauté croyante, femmes comprises.
    reason: lexical_alternative
lexical_decisions:
- source_word: Γνωρίζω
  choice: Je vous fais connaître
  rationale: Rend directement le présent actif « faire connaître, informer ». Le contexte peut avoir une fonction de rappel, mais le verbe grec n’est pas le terme habituel pour « rappeler ».
- source_word: δὲ
  choice: non rendu séparément
  rationale: La particule marque ici une transition légère. En français, l’enchaînement est naturel sans ajouter « maintenant », qui risquerait d’introduire une nuance temporelle absente.
- source_word: ἀδελφοί
  choice: frères et sœurs
  rationale: Dans cette adresse paulinienne à l’ensemble de l’Église, le masculin pluriel grec inclut vraisemblablement les croyants des deux sexes. La formulation française explicite cette portée communautaire, avec une note signalant la forme littérale.
- source_word: τὸ εὐαγγέλιον
  choice: la bonne nouvelle
  rationale: Rend le sens transparent de εὐαγγέλιον dans un français courant et accessible.
- source_word: εὐηγγελισάμην
  choice: je vous ai annoncée
  rationale: Exprime l’annonce de la bonne nouvelle et conserve naturellement en français le lien sémantique avec εὐαγγέλιον.
- source_word: παρελάβετε
  choice: vous avez aussi reçue
  rationale: Le verbe désigne ici la réception d’un message ou d’une tradition, sans imposer la nuance subjective plus forte d’« accepter ».
- source_word: ἐν ᾧ
  choice: dans laquelle
  rationale: Renvoie à la bonne nouvelle comme réalité ou fondement dans lequel les Corinthiens se tiennent; « par laquelle » anticiperait indûment le verset suivant.
- source_word: ἑστήκατε
  choice: vous tenez ferme
  rationale: Le parfait exprime un état présent résultant d’une action antérieure. « Vous tenez ferme » est idiomatique et fait entendre la stabilité impliquée par la forme grecque.
theological_decisions:
- issue: Portée de ἀδελφοί dans une adresse à une assemblée mixte
  choice: « frères et sœurs » dans le texte, avec une note sur la forme grecque
  alternative: « frères » dans le texte, avec une note inclusive
  rationale: Dans cet emploi vocatif, le masculin grec désigne vraisemblablement toute la communauté croyante. « Frères et sœurs » communique cette portée en français moderne sans exclure les femmes, tandis que la note préserve l’information formelle.
- issue: Nature de la relation exprimée par ἐν ᾧ
  choice: « dans laquelle »
  alternative: « par laquelle » ou « sur laquelle »
  rationale: La formulation conserve l’image de la bonne nouvelle comme sphère ou réalité dans laquelle les croyants demeurent, sans faire de cette proposition l’énoncé instrumental du salut développé au verset 2.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la progression du grec tout en évitant une succession lourde de relatives; « et » relie naturellement les deux dernières propositions. Le marqueur [a] figure immédiatement après l’expression concernée.
