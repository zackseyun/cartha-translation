  text: Et nous, pourquoi sommes-nous à tout moment en danger ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τί
  choice: pourquoi
  rationale: Dans cette question rhétorique, τί porte sur la raison de l’action. « Pourquoi » exprime naturellement la force argumentative du passage.
- source_word: καὶ
  choice: et… aussi, rendu par « Et nous » dans la phrase
  rationale: καὶ ajoute Paul et ses compagnons aux exemples précédents. En français, l’ouverture « Et nous » exprime naturellement cette valeur additive sans alourdir la phrase avec « aussi ».
- source_word: ἡμεῖς
  choice: nous
  rationale: 'Le pronom explicite est conservé et mis en relief par son détachement initial : « Et nous ».'
- source_word: κινδυνεύομεν
  choice: sommes-nous… en danger
  rationale: Cette formulation rend directement l’idée d’être exposé au danger, sans préciser davantage la nature du risque.
- source_word: πᾶσαν ὥραν
  choice: à tout moment
  rationale: L’expression désigne une exposition continuelle au danger. « À tout moment » est idiomatique en français moderne tout en restant proche du sens grec.
theological_decisions:
- issue: Force rhétorique dans l’argument de Paul sur la résurrection
  choice: Une question rhétorique qui souligne l’incohérence du danger couru par les apôtres si les morts ne ressuscitent pas
  alternative: Une simple demande d’information sur la cause de leur danger
  rationale: La syntaxe grecque et le contexte immédiat favorisent nettement la lecture rhétorique, sans qu’il soit nécessaire d’ajouter dans le verset la condition formulée par le contexte.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation détachée « Et nous » préserve l’ajout et la légère mise en relief du pronom grec. La note signale la tournure plus littérale sans encombrer le texte principal.
