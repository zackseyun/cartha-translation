translation_notes:
  register: Français international moderne, clair et digne. La tournure proverbiale est signalée par des guillemets français. « Bonnes mœurs » conserve la portée éthique sans sonner excessivement technique ; « fréquentations » est idiomatique et compréhensible dans l’ensemble de la francophonie.
