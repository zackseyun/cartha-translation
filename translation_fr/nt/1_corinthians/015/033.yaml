  text: 'Do not be deceived: bad company corrupts good morals[a].'
translation:
  language: fr
  text: 'Ne vous laissez pas tromper : « Les mauvaises fréquentations corrompent les bonnes mœurs[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Les mauvaises conversations corrompent les bonnes mœurs. » Le terme grec peut désigner les relations ou les conversations ; dans ce contexte, « fréquentations » exprime mieux son sens large.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ πλανᾶσθε
  choice: Ne vous laissez pas tromper
  rationale: Cette formulation naturelle conserve la valeur passive ou moyenne sans préciser indûment si la tromperie vient de soi-même ou d’autrui. Elle exprime clairement l’interdiction portée par μή avec l’impératif présent.
- source_word: φθείρουσιν
  choice: corrompent
  rationale: Le verbe décrit ici une détérioration morale. « Corrompent » convient au contexte éthique et garde la force concise de la maxime.
- source_word: ἤθη
  choice: mœurs
  rationale: Dans ce contexte, le terme désigne les habitudes et la conduite morales. « Mœurs » est une expression française établie et concise, sans réduire le sens aux simples manières sociales.
- source_word: χρηστὰ
  choice: bonnes
  rationale: L’adjectif qualifie positivement les mœurs dans un sens moral. « Bonnes » est direct, naturel et n’ajoute aucune nuance absente du grec.
- source_word: ὁμιλίαι
  choice: fréquentations
  rationale: Le nom peut évoquer les relations, les échanges ou les conversations. « Fréquentations » rend naturellement ici le sens relationnel large — les personnes que l’on côtoie — tout en laissant l’autre possibilité dans une note.
- source_word: κακαί
  choice: mauvaises
  rationale: « Mauvaises » exprime simplement la nocivité morale de ces fréquentations et forme en français une maxime naturelle, sans intensifier le grec par « perverses » ou « mauvaises au sens absolu ».
