  source_fidelity: Le texte rend fidèlement la comparaison introduite par Οὕτως καί, la « résurrection des morts », ainsi que le parallélisme passif σπείρεται / ἐγείρεται. « Périssable / impérissable » restitue avec justesse l’opposition φθορά / ἀφθαρσία dans son sens de condition soumise ou non à la destruction et à la mort. La formulation prédicative française explicite naturellement la valeur de ἐν sans modifier le sens.
