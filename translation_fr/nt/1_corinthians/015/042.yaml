source:
  edition: SBLGNT
  text: Οὕτως καὶ ἡ ἀνάστασις τῶν νεκρῶν. σπείρεται ἐν φθορᾷ, ἐγείρεται ἐν ἀφθαρσίᾳ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/042.yaml
  text: 'So also is the resurrection of the dead: it is sown in corruption[a]; it is raised in incorruption.'
translation:
  language: fr
  text: 'Il en va de même pour la résurrection des morts : ce qui est semé est périssable, ce qui est ressuscité est impérissable.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οὕτως καὶ
  choice: Il en va de même pour
  rationale: Cette tournure française naturelle conserve la valeur comparative et conclusive qui relie le verset à l’image de la semence dans le contexte précédent.
- source_word: ἡ ἀνάστασις τῶν νεκρῶν
  choice: la résurrection des morts
  rationale: Formulation française consacrée et syntaxiquement fidèle au génitif grec, sans déplacer le sens vers « d’entre les morts ».
- source_word: σπείρεται
  choice: ce qui est semé
  rationale: Le passif et la métaphore agricole sont maintenus. L’ajout du pronom neutre « ce qui » rend en français le sujet implicite du grec sans préciser davantage que le texte.
- source_word: ἐν φθορᾷ
  choice: est périssable
  rationale: Dans ce contexte, φθορά exprime l’état soumis à la dégradation et à la mort. « Périssable » est plus clair en français moderne que « dans la corruption », qui évoquerait facilement la dépravation morale.
- source_word: ἐγείρεται
  choice: ce qui est ressuscité
  rationale: Le passif est conservé et « ressuscité » exprime sans ambiguïté le sens du verbe dans ce contexte, tout en maintenant le parallélisme.
- source_word: ἐν ἀφθαρσίᾳ
  choice: est impérissable
  rationale: « Impérissable » rend naturellement l’opposition directe avec φθορά et désigne l’état qui n’est plus soumis à la dégradation ni à la mort.
theological_decisions:
- issue: Nature du corps dans la résurrection
  choice: Conserver l’image de ce qui est semé puis ressuscité, avec des formes passives, sans réduire la résurrection à une réalité seulement spirituelle.
  alternative: Expliciter le sujet par « le corps est enseveli… il ressuscite impérissable » ou interpréter le contraste dans un sens principalement moral.
  rationale: Le contexte traite de la résurrection corporelle au moyen de l’analogie de la semence. Le grec laisse ici le sujet implicite; la traduction préserve donc à la fois la continuité et la transformation sans ajouter « corps » dans ce verset.
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme « semé / ressuscité » et « périssable / impérissable » restitue l’antithèse grecque sans employer « corruption / incorruptibilité », termes plus ambigus ou techniques en français courant.
