id: 1CO.15.10
reference: 1 Corinthians 15:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: χάριτι δὲ θεοῦ εἰμι ὅ εἰμι, καὶ ἡ χάρις αὐτοῦ ἡ εἰς ἐμὲ οὐ κενὴ ἐγενήθη, ἀλλὰ περισσότερον αὐτῶν πάντων ἐκοπίασα, οὐκ ἐγὼ δὲ ἀλλὰ ἡ χάρις τοῦ θεοῦ ⸀ἡ σὺν ἐμοί.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/010.yaml
  text: But by the grace of God I am what I am[a], and his grace toward me did not prove empty. On the contrary, I labored more than all of them—yet not I, but the grace of God that was with me.
translation:
  language: fr
  text: Mais par la grâce de Dieu, je suis ce que je suis, et sa grâce envers moi n’a pas été vaine[a]. Au contraire, je me suis donné plus de peine qu’eux tous — non pas moi toutefois, mais la grâce de Dieu qui était avec moi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ne s’est pas révélée sans effet » ; littéralement, « n’est pas devenue vide ».
    reason: 'Alternative lexicale : κενή peut évoquer ce qui est vide, vain ou dépourvu de résultat.'
lexical_decisions:
- source_word: χάριτι δὲ θεοῦ
  choice: Mais par la grâce de Dieu
  rationale: Le datif χάριτι est compris comme instrumental. « Mais » rend le léger contraste introduit par δέ avec ce qui précède, tandis que « grâce » conserve le terme central de Paul.
- source_word: εἰμι ὅ εἰμι
  choice: je suis ce que je suis
  rationale: Cette formulation française naturelle conserve la répétition et laisse ouverte la portée exacte de l’affirmation sur l’identité et la situation présentes de Paul.
- source_word: ἡ χάρις αὐτοῦ ἡ εἰς ἐμὲ
  choice: sa grâce envers moi
  rationale: « Envers moi » garde l’idée d’une grâce dirigée vers Paul, exprimée par εἰς.
- source_word: οὐ κενὴ ἐγενήθη
  choice: n’a pas été vaine
  rationale: Dans ce contexte, κενή désigne ce qui reste sans effet ou sans résultat. « N’a pas été vaine » est idiomatique et conserve cette idée sans surinterpréter la métaphore du vide.
- source_word: ἀλλὰ περισσότερον αὐτῶν πάντων ἐκοπίασα
  choice: Au contraire, je me suis donné plus de peine qu’eux tous
  rationale: « Au contraire » rend la forte opposition de ἀλλά. L’expression « se donner de la peine » communique l’effort pénible impliqué par κοπιάω, et « qu’eux tous » conserve la comparaison.
- source_word: οὐκ ἐγὼ δὲ ἀλλὰ ἡ χάρις τοῦ θεοῦ
  choice: non pas moi toutefois, mais la grâce de Dieu
  rationale: 'Cette tournure maintient la correction paradoxale de Paul : son travail vient d’être affirmé, mais l’efficacité décisive est attribuée à la grâce de Dieu.'
- source_word: ἡ σὺν ἐμοί
  choice: qui était avec moi
  rationale: La proposition relative française explicite naturellement le lien de l’expression prépositionnelle avec « la grâce de Dieu ». L’imparfait s’accorde avec le travail passé évoqué dans la phrase.
theological_decisions:
- issue: Rapport entre le travail de Paul et la grâce divine
  choice: Affirmer à la fois l’effort réel de Paul et l’action efficace de la grâce de Dieu.
  alternative: Présenter explicitement Dieu et Paul comme des collaborateurs, ou réduire l’effort humain à une apparence.
  rationale: Le grec affirme que Paul s’est donné plus de peine que tous les autres, puis rectifie cette affirmation par « non pas moi… mais la grâce de Dieu ». La traduction préserve cette tension sans la résoudre selon un système théologique ultérieur.
translation_notes:
  register: Français international moderne, digne et accessible. « Je me suis donné plus de peine » exprime l’intensité de l’effort sans recourir à un registre archaïque. Le tiret met en relief la rectification de Paul tout en gardant la phrase fluide.
