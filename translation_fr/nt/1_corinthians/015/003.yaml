id: 1CO.15.3
reference: 1 Corinthians 15:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Παρέδωκα γὰρ ὑμῖν ἐν πρώτοις, ὃ καὶ παρέλαβον, ὅτι Χριστὸς ἀπέθανεν ὑπὲρ τῶν ἁμαρτιῶν ἡμῶν κατὰ τὰς γραφάς,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/003.yaml
  text: 'For I delivered to you as of first importance what I also received: that Messiah died for our sins according to the Scriptures[b][a],'
translation:
  language: fr
  text: 'Car je vous ai transmis comme étant de première importance ce que j’avais moi-même reçu : le Messie[a] est mort pour nos péchés, selon les Écritures[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le Christ ». Le titre grec Χριστός signifie « Messie » ; il est traditionnellement rendu par « Christ ».
    reason: alternative_reading
  - marker: b
    text: Ou « conformément aux Écritures ».
    reason: lexical_alternative
lexical_decisions:
- source_word: Παρέδωκα
  choice: j’ai transmis
  rationale: Dans ce contexte, παραδίδωμι désigne la transmission d’un enseignement reçu. « Transmis » exprime naturellement en français cette communication fidèle sans suggérer une simple remise matérielle.
- source_word: γὰρ
  choice: Car
  rationale: γάρ introduit l’explication de l’affirmation précédente. « Car » en conserve explicitement la valeur logique dans un registre soutenu mais courant.
- source_word: ἐν πρώτοις
  choice: en tout premier lieu
  rationale: Cette expression marque la priorité, notamment l’importance primordiale du contenu transmis. La formulation française demeure naturelle et conserve une certaine ouverture entre priorité logique et priorité d’importance.
- source_word: ὃ καὶ παρέλαβον
  choice: ce que j’avais moi-même reçu
  rationale: Le plus-que-parfait rend clairement la réception antérieure à la transmission. « Moi-même » fait ressortir καί et le parallélisme entre recevoir et transmettre.
- source_word: ὅτι
  choice: ':'
  rationale: Les deux-points introduisent naturellement en français le contenu précis de ce que Paul a reçu et transmis, là où le grec emploie ὅτι.
- source_word: Χριστὸς
  choice: le Messie
  rationale: Χριστός garde ici sa valeur de titre dans cette formulation confessionnelle. « Le Messie » rend explicitement cette portée juive et messianique; l’article est requis par l’usage français.
- source_word: ἀπέθανεν
  choice: est mort
  rationale: L’aoriste énonce sobrement un événement accompli; le passé composé est le temps narratif naturel en français moderne.
- source_word: ὑπὲρ τῶν ἁμαρτιῶν ἡμῶν
  choice: pour nos péchés
  rationale: « Pour nos péchés » conserve la portée salvifique de ὑπέρ sans imposer une explication particulière du rapport entre la mort du Messie et les péchés.
- source_word: κατὰ τὰς γραφάς
  choice: selon les Écritures
  rationale: « Selon » exprime la correspondance ou la conformité aux Écritures tout en conservant le pluriel du grec.
theological_decisions:
- issue: Traduction de Χριστός
  choice: le Messie
  alternative: le Christ
  rationale: Dans ce résumé confessionnel, le mot fonctionne nettement comme un titre. « Le Messie » en manifeste le sens sans nier l’équivalent traditionnel « le Christ », indiqué en note.
- issue: Portée de ὑπὲρ τῶν ἁμαρτιῶν ἡμῶν
  choice: pour nos péchés
  alternative: à cause de nos péchés
  rationale: La traduction retenue préserve l’affirmation sotériologique et son ampleur sans trancher entre les diverses manières d’expliquer la fonction de cette mort.
- issue: Rapport aux Écritures exprimé par κατά
  choice: selon les Écritures
  alternative: conformément aux Écritures
  rationale: « Selon » laisse intacte l’étendue du rapport affirmé — accomplissement, conformité ou correspondance — au lieu de le préciser au-delà du grec.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve le lien explicatif « Car », le mouvement de réception puis de transmission, ainsi que la cadence confessionnelle de la seconde proposition.
