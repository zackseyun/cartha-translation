id: 1CO.15.22
reference: 1 Corinthians 15:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὥσπερ γὰρ ἐν τῷ Ἀδὰμ πάντες ἀποθνῄσκουσιν, οὕτως καὶ ἐν τῷ Χριστῷ πάντες ζῳοποιηθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/022.yaml
  text: For just as in Adam all die[a], so also in Messiah all will be made alive.
translation:
  language: fr
  text: En effet, de même qu’en Adam tous meurent, de même aussi dans le Messie[a] tous seront rendus vivants.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans le Christ ». Le titre grec Χριστός peut être transcrit traditionnellement par « Christ » ou traduit par « Messie » ; il est ici traduit selon son sens.
    reason: alternative_reading
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: En effet, de même que
  rationale: « En effet » restitue la fonction explicative de γάρ, tandis que « de même que » marque clairement la comparaison introduite par ὥσπερ.
- source_word: ἐν τῷ Ἀδὰμ
  choice: en Adam
  rationale: Cette formulation concise préserve le langage représentatif ou collectif de Paul sans préciser abusivement le sens de ἐν par « par l’intermédiaire d’Adam » ou « unis à Adam ».
- source_word: πάντες
  choice: tous
  rationale: Le terme reste sans restriction dans les deux propositions, conformément au parallélisme du grec.
- source_word: ἀποθνῄσκουσιν
  choice: meurent
  rationale: Le présent français exprime naturellement la réalité générale énoncée par le présent grec.
- source_word: οὕτως καὶ
  choice: de même aussi
  rationale: Cette tournure conserve à la fois la corrélation avec ὥσπερ et la valeur additive de καί.
- source_word: ἐν τῷ Χριστῷ
  choice: dans le Messie
  rationale: Χριστός fonctionne ici comme un titre. « Messie » en traduit le sens, tandis que « dans » maintient le parallèle formel avec « en Adam » sans expliciter davantage la relation.
- source_word: ζῳοποιηθήσονται
  choice: seront rendus vivants
  rationale: La formulation conserve le futur et la voix passive, qui présente la vie comme le résultat d’une action exercée sur les personnes concernées.
theological_decisions:
- issue: Portée de « tous » dans les deux propositions
  choice: Conserver « tous » sans restriction dans les deux membres de la phrase.
  alternative: Préciser « tous les croyants » dans le second membre, ou affirmer explicitement que les deux emplois ont exactement la même portée.
  rationale: Le grec établit le parallèle πάντες… πάντες sans en expliciter ici toutes les limites ni les modalités. La traduction préserve donc cette tension théologique.
- issue: Sens relationnel de ἐν dans « en Adam » et « dans le Messie »
  choice: Maintenir les expressions compactes du texte source.
  alternative: Traduire par « unis à Adam / au Messie » ou par « à cause d’Adam / grâce au Messie ».
  rationale: Ces solutions préciseraient la nature de la relation au-delà de ce qu’énonce directement la préposition grecque.
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme de la phrase grecque est conservé. « Seront rendus vivants » est légèrement soutenu, mais reste compréhensible et permet de préserver la voix passive.
