id: 1CO.15.20
reference: 1 Corinthians 15:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Νυνὶ δὲ Χριστὸς ἐγήγερται ἐκ νεκρῶν, ἀπαρχὴ τῶν ⸀κεκοιμημένων.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/020.yaml
  text: But now Messiah has been raised from the dead[c][b][a], the firstfruits of those who have fallen asleep.
translation:
  language: fr
  text: Mais maintenant, le Messie[a] a été ressuscité d’entre les morts, prémices[b] de ceux qui se sont endormis[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le Christ ». Le mot grec signifie « l’Oint », c’est-à-dire le Messie.
    reason: alternative_reading
  - marker: b
    text: Les « prémices » étaient la première part d’une récolte offerte à Dieu; elles annonçaient la récolte entière à venir.
    reason: cultural_note
  - marker: c
    text: Ici, « se sont endormis » est une image pour parler de ceux qui sont morts.
    reason: lexical_alternative
lexical_decisions:
- source_word: Νυνὶ δὲ
  choice: Mais maintenant
  rationale: Marque le contraste décisif avec l’hypothèse précédente et introduit l’affirmation présente de la résurrection.
- source_word: Χριστὸς
  choice: le Messie
  rationale: Rend le sens du titre grec plutôt que de le translittérer; l’article français est nécessaire dans cet emploi.
- source_word: ἐγήγερται
  choice: a été ressuscité
  rationale: 'Conserve le parfait passif grec : l’acte est accompli et son résultat demeure, sans préciser explicitement l’agent.'
- source_word: ἐκ νεκρῶν
  choice: d’entre les morts
  rationale: Expression française naturelle qui conserve l’idée de sortir du nombre des personnes mortes.
- source_word: ἀπαρχὴ
  choice: les prémices
  rationale: Terme cultuel français établi pour la première part de la récolte, laquelle annonce et représente la récolte à venir.
- source_word: τῶν κεκοιμημένων
  choice: de ceux qui se sont endormis
  rationale: Préserve la métaphore grecque du sommeil pour la mort dans le contexte de la résurrection.
theological_decisions:
- issue: Voix et agent de la résurrection
  choice: a été ressuscité
  alternative: est ressuscité
  rationale: La formulation passive respecte la voix grecque et laisse l’agent sous-entendu, sans effacer ni expliciter davantage l’action divine.
- issue: Rendu du titre Χριστός
  choice: le Messie
  alternative: le Christ
  rationale: Dans cet argument théologique, le terme fonctionne comme un titre; sa traduction en restitue directement le sens.
- issue: Portée représentative des prémices
  choice: il est les prémices
  alternative: comme prémices
  rationale: La formulation appositionnelle affirme que la résurrection du Messie constitue le commencement représentatif de celle des autres morts, sans développer au-delà du texte la nature précise de ce rapport.
translation_notes:
  register: Français international moderne, digne et accessible. La métaphore du sommeil et l’image cultuelle des prémices sont conservées; les notes en éclairent le sens sans les remplacer dans le texte.
