  text: καὶ ὅτι ἐτάφη, καὶ ὅτι ἐγήγερται τῇ ⸂ἡμέρᾳ τῇ τρίτῃ⸃ κατὰ τὰς γραφάς,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/004.yaml
  text: and that he was buried[a], and that he has been raised on the third day according to the Scriptures[b],
translation:
  language: fr
  text: et qu’il a été enseveli, et qu’il a été ressuscité le troisième jour, conformément aux Écritures[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le verbe grec est au parfait : la résurrection est présentée comme un acte accompli dont les effets demeurent.'
    reason: aspectual_clarification
lexical_decisions:
- source_word: ἐτάφη
  choice: il a été enseveli
  rationale: L’aoriste passif de θάπτω désigne simplement la mise au tombeau. « A été enseveli » est naturel en français, conserve la voix passive et n’ajoute aucun détail absent du grec.
- source_word: ἐγήγερται
  choice: il a été ressuscité
  rationale: Le parfait passif de ἐγείρω présente la résurrection comme un acte accompli dont la portée demeure. « A été ressuscité » conserve clairement la voix passive; une note signale la valeur persistante du parfait, que le français ne reproduit pas entièrement.
- source_word: τῇ ἡμέρᾳ τῇ τρίτῃ
  choice: le troisième jour
  rationale: Cette expression temporelle au datif signifie idiomatiquement « le troisième jour ». La préposition « le » suffit en français; ajouter « après » préciserait la chronologie au-delà du texte grec.
- source_word: κατὰ τὰς γραφάς
  choice: conformément aux Écritures
  rationale: La formule exprime la conformité au témoignage scripturaire. Cette traduction est claire et naturelle, sans préciser quels passages sont visés.
- source_word: γραϕάς
  choice: les Écritures
  rationale: Dans cet emploi paulinien, le terme renvoie aux écrits sacrés reconnus, et non à des écrits quelconques. La majuscule indique ce référent conventionnel en français.
- source_word: ὅτι
  choice: que
  rationale: La répétition de « que » conserve la succession structurée des propositions de cette formulation confessionnelle.
- source_word: καὶ
  choice: et
  rationale: La répétition du connecteur est maintenue afin de préserver le rythme coordonné du grec.
theological_decisions:
- issue: Aspect et voix du verbe de résurrection
  choice: il a été ressuscité
  alternative: il est ressuscité
  rationale: Le choix principal garde explicitement la voix passive, sans identifier l’agent. Le parfait grec indique à la fois un événement accompli et sa portée actuelle; la variante française peut mieux suggérer l’état présent, mais risque d’être comprise comme une construction intransitive et de ne plus rendre nettement le passif.
- issue: Référence des « Écritures »
  choice: les Écritures
  alternative: les écrits sacrés
  rationale: Paul renvoie au corpus scripturaire reconnu sans le définir davantage. Une explicitation telle que « les Écritures juives » introduirait dans le texte une précision absente du grec.
translation_notes:
  register: Français international moderne, digne et accessible. La coordination répétée (« et que… et que… ») conserve le rythme confessionnel du grec. « Enseveli » et « ressuscité » sont courants dans le registre biblique sans être archaïques.
