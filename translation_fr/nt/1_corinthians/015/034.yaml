id: 1CO.15.34
reference: 1 Corinthians 15:34
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐκνήψατε δικαίως καὶ μὴ ἁμαρτάνετε, ἀγνωσίαν γὰρ θεοῦ τινες ἔχουσιν· πρὸς ἐντροπὴν ὑμῖν ⸀λαλῶ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/034.yaml
  text: Come to your senses rightly[a], and do not go on sinning; for some have ignorance of God[b]. I say this to your shame.
translation:
  language: fr
  text: Reprenez vos esprits, comme il convient[a], et ne continuez pas à pécher[b], car certains ne connaissent pas Dieu. Je le dis à votre honte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe grec évoque littéralement le fait de sortir de l’ivresse et de retrouver sa sobriété ; il est probablement employé ici comme une image du retour à un jugement lucide.
    reason: lexical_alternative
  - marker: b
    text: Ou « ne péchez pas » ou « cessez de pécher » ; le présent impératif peut évoquer une action continue ou habituelle.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκνήψατε
  choice: Revenez à votre bon sens
  rationale: L’aoriste impératif appelle à un ressaisissement décisif. Le verbe évoque littéralement le retour à la sobriété après l’ivresse, mais il est employé ici de manière métaphorique ; cette formulation française en restitue naturellement le sens.
- source_word: δικαίως
  choice: comme il se doit
  rationale: Cette locution adverbiale exprime une manière juste ou convenable et modifie l’appel à retrouver son bon sens, sans donner au mot une valeur technique liée à la justification.
- source_word: μὴ ἁμαρτάνετε
  choice: ne continuez pas à pécher
  rationale: Le présent impératif avec μή permet une interdiction envisagée dans sa durée. La traduction fait entendre cette nuance sans affirmer plus précisément que tous les destinataires commettent alors un même péché.
- source_word: ἀγνωσίαν θεοῦ
  choice: sont dans l’ignorance à l’égard de Dieu
  rationale: Cette formulation conserve le substantif ἀγνωσία et rend le génitif θεοῦ comme l’objet de l’ignorance, sans transformer explicitement l’expression en simple manque d’informations au sujet de Dieu ni en déclaration plus technique.
- source_word: τινες
  choice: certains
  rationale: Le pronom désigne de façon indéfinie une partie des personnes concernées.
- source_word: πρὸς ἐντροπὴν ὑμῖν
  choice: à votre honte
  rationale: La tournure française conserve la vigueur du reproche ainsi que le rapport de la parole de Paul à la honte de ses destinataires, sans imposer exclusivement une intention de les humilier.
- source_word: λαλῶ
  choice: Je le dis
  rationale: Dans ce contexte discursif, cette formulation française renvoie naturellement à l’admonestation qui précède.
theological_decisions:
- issue: Portée morale de δικαίως
  choice: comme il se doit
  alternative: dans la justice / justement
  rationale: Le contexte est moral, mais l’adverbe qualifie d’abord la manière correcte de revenir à un jugement lucide. La traduction garde cette portée éthique sans importer un sens paulinien technique de la justice.
- issue: Nature de l’ignorance de Dieu
  choice: dans l’ignorance à l’égard de Dieu
  alternative: ne connaissent pas Dieu / ignorent Dieu
  rationale: Le génitif peut être compris comme portant sur Dieu, objet de l’ignorance, tandis que la formulation peut aussi suggérer une absence réelle de connaissance de Dieu. Le choix retenu préserve cette tension sans la réduire à une connaissance purement intellectuelle ni la définir en termes doctrinaux.
translation_notes:
  register: Français international moderne, direct et digne. « Revenez comme il se doit à votre bon sens » rend l’image grecque de façon intelligible sans employer une expression française artificielle. La ponctuation maintient l’enchaînement serré de l’exhortation, de sa justification et du reproche final.
