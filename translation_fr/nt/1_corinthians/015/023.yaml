id: 1CO.15.23
reference: 1 Corinthians 15:23
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἕκαστος δὲ ἐν τῷ ἰδίῳ τάγματι· ἀπαρχὴ Χριστός, ἔπειτα οἱ τοῦ Χριστοῦ ἐν τῇ παρουσίᾳ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/023.yaml
  text: 'But each in his own order: Messiah the firstfruits[b][a], then those who belong to Messiah at his coming.'
translation:
  language: fr
  text: 'Mais chacun selon l’ordre qui lui revient : le Messie[a] comme prémices, puis ceux qui appartiennent au Messie, lors de sa venue[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le Christ ». Le titre grec Χριστός signifie « l’Oint » et correspond à « Messie ».
    reason: alternative_reading
  - marker: b
    text: Le mot grec παρουσία peut aussi signifier « présence » ou « arrivée » ; ici, il désigne la venue future du Messie.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕκαστος
  choice: chacun
  rationale: Le terme distribue les personnes ou groupes évoqués selon l’ordre de la résurrection. « Chacun » est concis et naturel en français.
- source_word: ἐν τῷ ἰδίῳ τάγματι
  choice: selon l’ordre qui lui revient
  rationale: τάγμα peut désigner un rang, une disposition ordonnée ou une place dans une séquence. Cette formulation française exprime l’ordre propre à chacun sans imposer une image militaire.
- source_word: ἀπαρχὴ
  choice: prémices
  rationale: « Prémices » conserve l’image biblique de la première part de la récolte, qui annonce et garantit la suite.
- source_word: Χριστός
  choice: le Messie
  rationale: Dans cette construction, Χριστός met en relief le titre et le rôle messianique de Jésus. « Le Messie » rend explicitement le sens d’« Oint ».
- source_word: οἱ τοῦ Χριστοῦ
  choice: ceux qui appartiennent au Messie
  rationale: Le génitif exprime ici l’appartenance. Cette traduction est claire et garde la force relationnelle de l’expression grecque.
- source_word: ἐν τῇ παρουσίᾳ αὐτοῦ
  choice: lors de sa venue
  rationale: Dans ce contexte eschatologique, παρουσία désigne la venue future du Messie. « Lors de sa venue » rend également la valeur temporelle de ἐν.
theological_decisions:
- issue: Traduction de Χριστός comme titre dans l’ordre de la résurrection
  choice: le Messie
  alternative: le Christ
  rationale: Le passage présente Χριστός dans son rôle messianique et eschatologique. « Le Messie » préserve ce caractère de titre, tandis qu’une note signale la traduction traditionnelle « le Christ ».
- issue: Portée eschatologique de παρουσία
  choice: venue
  alternative: présence ou arrivée
  rationale: « Venue » exprime naturellement l’événement futur visé par le contexte sans préciser davantage sa nature ni son déroulement.
- issue: Rapport entre Χριστός et ἀπαρχή
  choice: le Messie comme prémices
  alternative: le Messie, les prémices
  rationale: « Comme » rend en français naturel la relation prédicative de l’apposition grecque sans ajouter de précision doctrinale sur le mécanisme de la résurrection.
translation_notes:
  register: Français international moderne, sobre et digne. « Prémices » est conservé pour son image biblique et sa portée intertextuelle ; la syntaxe reste accessible tout en respectant la concision du grec.
