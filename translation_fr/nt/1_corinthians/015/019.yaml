id: 1CO.15.19
reference: 1 Corinthians 15:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἰ ἐν τῇ ζωῇ ταύτῃ ⸂ἐν Χριστῷ ἠλπικότες ἐσμὲν⸃ μόνον, ἐλεεινότεροι πάντων ἀνθρώπων ἐσμέν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/019.yaml
  text: If we have hoped in Messiah for this life only[c][b][a], we are more pitiable than all people.
translation:
  language: fr
  text: Si c’est pour cette vie seulement que nous avons mis notre espérance dans le Messie[a], nous sommes plus à plaindre que tous les autres êtres humains[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en Christ ». Le titre grec Χριστός peut être rendu par « Christ » ou « Messie » ; « Messie » en rend ici le sens explicite.
    reason: alternative_reading
  - marker: b
    text: Ou « nous sommes les plus à plaindre de tous les êtres humains ». Le comparatif grec peut avoir ici une portée proche du superlatif.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ
  choice: Si
  rationale: Introduit normalement la condition qui structure l’argument de Paul.
- source_word: ἐν τῇ ζωῇ ταύτῃ … μόνον
  choice: pour cette vie seulement
  rationale: Cette formulation française naturelle rattache clairement « seulement » à la portée temporelle de l’espérance, sans suggérer que l’espérance serait la seule action accomplie.
- source_word: ἐν Χριστῷ
  choice: dans le Messie
  rationale: Conserve la préposition paulinienne « dans » et rend Χριστός comme un titre, « le Messie », plutôt que comme un simple nom propre.
- source_word: ἠλπικότες ἐσμὲν
  choice: nous avons mis notre espérance
  rationale: Rend la périphrase au parfait par un passé composé français exprimant une espérance placée dans le Messie et demeurant pertinente au présent.
- source_word: ἐλεεινότεροι
  choice: plus à plaindre
  rationale: Expression française idiomatique qui conserve la forme comparative et l’idée de personnes dignes de pitié.
- source_word: πάντων ἀνθρώπων
  choice: que tous les autres êtres humains
  rationale: Le comparatif appelle naturellement « autres » en français; « êtres humains » inclut explicitement l’ensemble des personnes, sans restriction de sexe.
theological_decisions:
- issue: Valeur de Χριστῷ dans la formule paulinienne ἐν Χριστῷ
  choice: dans le Messie
  alternative: en Christ
  rationale: « Messie » maintient la valeur de titre de Χριστός, tandis que la note donne la formulation traditionnelle sans imposer une interprétation confessionnelle.
- issue: Portée de μόνον et limite de l’espérance
  choice: pour cette vie seulement
  alternative: si, dans cette vie seulement, nous avons espéré dans le Messie
  rationale: Le texte principal exprime que l’espérance serait limitée à la vie présente, tout en évitant de développer les conséquences doctrinales au-delà de l’énoncé conditionnel de Paul.
- issue: Force du comparatif ἐλεεινότεροι
  choice: plus à plaindre que tous les autres êtres humains
  alternative: les plus à plaindre de tous les êtres humains
  rationale: La traduction retient formellement le comparatif grec; la note signale l’expression superlative idiomatique possible.
translation_notes:
  register: Français international moderne, naturel et digne. La tournure clivée « c’est pour cette vie seulement que » clarifie la portée de « seulement ». « Plus à plaindre » est courant et précis, tandis que « êtres humains » évite que « hommes » soit compris comme désignant uniquement les personnes de sexe masculin.
