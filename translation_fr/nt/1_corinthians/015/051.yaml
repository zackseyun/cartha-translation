  yaml_path: translation/nt/1_corinthians/015/051.yaml
  text: 'Behold[a], I tell you a mystery: we will not all sleep, but we will all be changed[b],'
translation:
  language: fr
  text: 'Voici, je vous dis un mystère : nous ne nous endormirons pas tous[a], mais nous serons tous transformés[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de manière plus interprétative : « nous ne mourrons pas tous ». Le grec dit « s’endormir », métaphore courante de la mort dans le Nouveau Testament à la lumière de la résurrection.'
