lexical_decisions:
- source_word: ἰδοὺ
  choice: Voici
  rationale: Conserve la fonction solennelle d’appel à l’attention de ἰδού dans un français actuel et digne.
- source_word: μυστήριον
  choice: mystère
  rationale: Dans cet emploi paulinien, le mot désigne une réalité divine jusque-là cachée et maintenant révélée, et non une simple énigme. « Mystère » en préserve la portée théologique.
- source_word: ὑμῖν λέγω
  choice: je vous révèle
  rationale: Cette formulation est naturelle en français avec « mystère » et exprime ici l’acte de faire connaître ce qui était caché. Elle rend le sens contextuel de λέγω sans ajouter le contenu d’une doctrine particulière.
- source_word: πάντες οὐ κοιμηθησόμεθα
  choice: nous ne nous endormirons pas tous
  rationale: 'La négation porte sur la totalité : certains seront encore vivants. « Nous endormir » conserve la métaphore néotestamentaire de la mort dans la perspective de la résurrection.'
- source_word: πάντες δὲ ἀλλαγησόμεθα
  choice: mais nous serons tous transformés
  rationale: « Transformés » exprime clairement le changement eschatologique indiqué par ἀλλάσσω. « Mais » marque le contraste entre le fait que tous ne mourront pas et celui que tous subiront cette transformation.
theological_decisions:
- issue: Sens du sommeil dans le contexte de la résurrection
  choice: Conserver « nous endormir » comme métaphore de la mort physique
  alternative: Traduire explicitement par « nous mourrons »
  rationale: La métaphore appartient au langage de Paul et présente la mort à la lumière de la résurrection. La conserver n’impose aucune doctrine particulière sur l’état de l’âme.
- issue: Variante textuelle concernant les deux propositions
  choice: 'Suivre le SBLGNT : « nous ne nous endormirons pas tous, mais nous serons tous transformés »'
  alternative: 'Une variante notable donne, en substance : « nous nous endormirons tous, mais nous ne serons pas tous transformés »'
  rationale: Le texte principal traduit directement la leçon grecque fournie. La variante, significative sur le plan interprétatif, est signalée en note plutôt qu’intégrée au texte.
translation_notes:
  register: Français international moderne, clair et digne. « Voici » maintient la solennité de l’annonce; « révèle » rend idiomatiquement l’expression associant λέγω à μυστήριον; la métaphore du sommeil et le contraste syntaxique sont préservés.
