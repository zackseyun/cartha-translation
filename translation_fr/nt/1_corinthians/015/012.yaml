source:
  edition: SBLGNT
  text: Εἰ δὲ Χριστὸς κηρύσσεται ὅτι ἐκ νεκρῶν ἐγήγερται, πῶς λέγουσιν ⸂ἐν ὑμῖν τινες⸃ ὅτι ἀνάστασις νεκρῶν οὐκ ἔστιν;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/012.yaml
  text: If the Messiah is proclaimed as having been raised from the dead[a], how can some among you say that there is no resurrection of the dead?
translation:
  language: fr
  text: Or, si l’on proclame que le Messie[a] a été relevé d’entre les morts, comment certains parmi vous peuvent-ils dire qu’il n’y a pas de résurrection des morts ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le Christ ». Le grec Χριστός peut se traduire par « Messie » ou « Christ » ; le texte principal conserve ici le sens du titre.'
    reason: alternative_reading
lexical_decisions:
- source_word: Χριστὸς
  choice: le Messie
  rationale: Le terme garde ici sa valeur de titre christologique. « Le Messie » en traduit le sens, tandis que « Christ » demeure possible et figure en note.
- source_word: κηρύσσεται
  choice: l’on proclame
  rationale: Le présent passif désigne l’annonce publique et continue. La tournure impersonnelle française est naturelle et conserve la mise au premier plan du contenu proclamé.
- source_word: ἐκ νεκρῶν
  choice: d’entre les morts
  rationale: Cette expression française usuelle rend la préposition ἐκ et le pluriel substantivé νεκρῶν sans suggérer que tous les morts sont déjà ressuscités.
- source_word: ἐγήγερται
  choice: a été relevé
  rationale: Le parfait passif présente une action accomplie dont le résultat demeure. « A été relevé » conserve le passif, qui laisse l’agent implicite, et le lien lexical avec la résurrection.
- source_word: πῶς
  choice: comment … peuvent-ils
  rationale: La question est rhétorique et souligne l’incohérence entre la proclamation reçue et l’affirmation de certains membres.
- source_word: ἐν ὑμῖν τινες
  choice: certains parmi vous
  rationale: Cette formulation identifie naturellement un sous-groupe au sein de la communauté, conformément à ἐν ὑμῖν.
- source_word: ἀνάστασις νεκρῶν
  choice: résurrection des morts
  rationale: Le génitif désigne ici la résurrection générale des personnes mortes, non seulement une sortie particulière d’entre les morts.
- source_word: οὐκ ἔστιν
  choice: il n’y a pas de
  rationale: Cette tournure rend naturellement en français la valeur existentielle de εἰμί.
theological_decisions:
- issue: Traduction de Χριστός dans l’argument paulinien
  choice: le Messie
  alternative: le Christ
  rationale: Le mot fonctionne comme un titre porteur de sens. « Le Messie » explicite ce titre sans ajouter de précision doctrinale; la forme traditionnelle « le Christ » est signalée en note.
- issue: Voix passive de ἐγήγερται
  choice: a été relevé
  alternative: est ressuscité
  rationale: Le passif grec est préservé afin de ne pas effacer l’action implicite de Dieu ni de transformer silencieusement la construction en forme intransitive.
translation_notes:
  register: Français international moderne, digne et accessible. « Mais si » rend explicitement εἰ δέ et son contraste argumentatif. La formulation évite un « maintenant » absent du grec. Le vocabulaire de « relever » maintient le lien avec l’idée de résurrection tout en conservant le passif.
