source:
  edition: SBLGNT
  text: δεῖ γὰρ τὸ φθαρτὸν τοῦτο ἐνδύσασθαι ἀφθαρσίαν καὶ τὸ θνητὸν τοῦτο ἐνδύσασθαι ἀθανασίαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/053.yaml
  text: For this perishable body must put on imperishability[a], and this mortal body must put on immortality.
translation:
  language: fr
  text: Car il faut que ce corps périssable revête l’impérissabilité[a], et que ce corps mortel revête l’immortalité.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus formellement : « ce qui est périssable doit revêtir l’impérissabilité, et ce qui est mortel doit revêtir l’immortalité ». Le grec ne répète pas explicitement le mot « corps » dans ce verset, mais le contexte indique clairement qu’il s’agit du corps.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δεῖ
  choice: il faut que
  rationale: Exprime clairement la nécessité de la transformation annoncée, dans un français naturel et ferme.
- source_word: γὰρ
  choice: Car
  rationale: Conserve le lien explicatif avec le verset précédent dans un registre soutenu mais courant.
- source_word: τὸ φθαρτὸν τοῦτο
  choice: ce corps périssable
  rationale: L’adjectif substantivé désigne ce qui est sujet à la corruption. « Corps » est explicité d’après le contexte immédiat de la résurrection corporelle.
- source_word: ἐνδύσασθαι
  choice: revête
  rationale: Préserve la métaphore du vêtement tout en restant naturel et digne en français.
- source_word: ἀφθαρσίαν
  choice: l’impérissabilité
  rationale: Maintient l’opposition lexicale avec « périssable » et désigne l’état de ce qui n’est plus soumis à la corruption.
- source_word: καὶ
  choice: et
  rationale: Reproduit simplement la coordination des deux propositions parallèles.
- source_word: τὸ θνητὸν τοῦτο
  choice: ce corps mortel
  rationale: « Mortel » exprime ce qui est soumis à la mort; « corps » est explicité à partir du contexte et assure le parallélisme.
- source_word: ἀθανασίαν
  choice: l’immortalité
  rationale: Équivalent français standard, précis et immédiatement compréhensible pour l’état de ce qui n’est plus soumis à la mort.
theological_decisions:
- issue: Explicitation du mot « corps », absent du grec de ce verset
  choice: Traduire les adjectifs substantivés par « ce corps périssable » et « ce corps mortel »
  alternative: « ce qui est périssable… ce qui est mortel »
  rationale: Le contexte immédiat, notamment les versets 42 à 54, traite explicitement de la résurrection et de la transformation du corps. L’ajout contextuel clarifie le référent sans introduire une affirmation doctrinale étrangère au passage; la note conserve la formulation plus formelle.
translation_notes:
  register: Français international moderne, clair et digne. « Revêtir » conserve la métaphore vestimentaire de Paul; les noms abstraits « impérissabilité » et « immortalité » maintiennent le parallélisme précis du grec.
