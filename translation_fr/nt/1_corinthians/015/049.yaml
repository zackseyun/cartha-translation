reference: 1 Corinthians 15:49
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ καθὼς ἐφορέσαμεν τὴν εἰκόνα τοῦ χοϊκοῦ, ⸀φορέσομεν καὶ τὴν εἰκόνα τοῦ ἐπουρανίου.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/049.yaml
  text: And just as we have borne the image of the man of dust[a], we will also bear the image of the heavenly man.
translation:
  language: fr
  text: Et de même que nous avons porté l’image de l’homme fait de poussière, nous porterons aussi l’image de l’homme céleste.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Certains manuscrits portent : « portons aussi l’image de l’homme céleste » et en font ainsi une exhortation.'
    reason: textual_variant
lexical_decisions:
- source_word: καθὼς
  choice: de même que
  rationale: Marque naturellement en français la correspondance entre la condition héritée du premier homme et la condition future liée à l’homme céleste.
- source_word: ἐφορέσαμεν
  choice: nous avons porté
  rationale: Le passé composé rend l’aoriste de façon idiomatique et exprime une condition dont les lecteurs ont fait l’expérience et qui demeure pertinente.
- source_word: εἰκόνα
  choice: l’image
  rationale: Équivalent usuel de εἰκών, il conserve le lien typologique avec Adam et le Christ sans explicitation excessive.
- source_word: τοῦ χοϊκοῦ
  choice: de l’homme fait de poussière
  rationale: χοϊκός évoque la poussière de Genèse et, dans le contexte immédiat, qualifie le premier homme; l’ajout de « l’homme » explicite le référent sous-entendu et maintient le parallèle.
- source_word: φορέσομεν
  choice: nous porterons aussi
  rationale: Le futur de l’édition SBLGNT exprime la transformation future; « aussi » rend la valeur additive de καί.
- source_word: τοῦ ἐπουρανίου
  choice: de l’homme céleste
  rationale: Le substantif sous-entendu est éclairé par le contraste contextuel entre les deux hommes; « céleste » rend ἐπουράνιος avec concision et dignité.
theological_decisions:
- issue: Futur de l’indicatif ou subjonctif d’exhortation pour le second verbe
  choice: nous porterons aussi
  alternative: portons aussi
  rationale: Le texte imprimé du SBLGNT porte φορέσομεν, futur de l’indicatif, qui présente la conformité future à l’homme céleste. La variante exhortative est suffisamment importante pour être signalée en note sans remplacer le texte retenu.
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme entre « l’homme fait de poussière » et « l’homme céleste » est conservé, ainsi que l’image concrète de la poussière issue du contexte adamique.
