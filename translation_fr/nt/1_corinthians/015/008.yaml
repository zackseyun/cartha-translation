  text: ἔσχατον δὲ πάντων ὡσπερεὶ τῷ ἐκτρώματι ὤφθη κἀμοί.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/008.yaml
  text: And last of all[a], as to one untimely born, he appeared also to me.
translation:
  language: fr
  text: En tout dernier, il m’est apparu à moi aussi, comme à un avorton[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec ἔκτρωμα désigne littéralement le produit d’une fausse couche ou d’un avortement. Paul emploie pour lui-même une image particulièrement dure.
    reason: Alternative lexicale et explicitation de la force de la métaphore grecque ἔκτρωμα.
lexical_decisions:
- source_word: ἔσχατον
  choice: en tout dernier
  rationale: L’accusatif neutre a ici une valeur adverbiale. « En tout dernier » exprime naturellement la dernière place de Paul dans la série des apparitions.
- source_word: δὲ
  choice: Et
  rationale: Dans ce contexte, δέ poursuit l’énumération plus qu’il ne marque une opposition forte.
- source_word: πάντων
  choice: tout
  rationale: Le génitif pluriel complète ἔσχατον dans le sens de « en dernier de tous »; la tournure française « en tout dernier » restitue cet ensemble de façon concise et idiomatique.
- source_word: ὡσπερεὶ
  choice: comme à
  rationale: La particule introduit une comparaison approximative. « Comme à » en conserve la force sans transformer l’image en affirmation littérale.
- source_word: τῷ ἐκτρώματι
  choice: à un enfant né avant terme
  rationale: ἔκτρωμα désigne littéralement le produit d’une fausse couche ou un enfant avorté. Le texte principal garde l’idée d’une naissance anormale et déshonorante dans une formulation compréhensible, tandis que la note signale la rudesse du terme grec.
- source_word: ὤφθη
  choice: il m’est apparu
  rationale: Dans les récits d’apparitions après la résurrection, le passif aoriste de ὁράω se rend naturellement par « apparaître », qui exprime clairement une manifestation visible.
- source_word: κἀμοί
  choice: aussi à moi
  rationale: Cette crase de καί et ἐμοί a une valeur additive et inclut Paul dans la série des témoins, tout en soulignant son cas.
theological_decisions:
- issue: La métaphore par laquelle Paul se décrit, ἐκτρώματι
  choice: Conserver dans le texte l’image d’un enfant né avant terme, avec une note donnant le sens plus littéral et plus brutal.
  alternative: « à l’avorton » ou « à l’enfant avorté »
  rationale: Le grec exprime une forte autodépréciation, mais le verset n’en précise pas toute la portée théologique. La traduction conserve donc l’anomalie et l’humiliation de l’image sans imposer une interprétation particulière de l’apostolat de Paul.
translation_notes:
  register: Français international moderne, simple et digne. La formulation suit le mouvement de la phrase grecque et maintient la tension entre lisibilité du texte principal et rudesse de la métaphore originale.
