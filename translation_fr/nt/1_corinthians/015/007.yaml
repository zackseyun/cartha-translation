  text: ἔπειτα ὤφθη Ἰακώβῳ, εἶτα τοῖς ἀποστόλοις πᾶσιν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/007.yaml
  text: Then he appeared to James[a], then to all the apostles.
translation:
  language: fr
  text: Ensuite, il est apparu à Jacques[a], puis à tous les apôtres.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « il a été vu par Jacques… par tous les apôtres ».'
    reason: Alternative lexicale reflétant la forme passive grecque de ὤφθη.
lexical_decisions:
- source_word: ἔπειτα
  choice: Ensuite
  rationale: Adverbe temporel qui marque l’étape suivante dans l’énumération des apparitions. « Ensuite » est naturel en français et conserve clairement la succession.
- source_word: ὤφθη
  choice: il est apparu
  rationale: Aoriste passif de ὁράω employé idiomatiquement pour une apparition, notamment dans les récits liés à la résurrection. « Il est apparu » rend naturellement cet emploi, tandis que la formulation plus littérale est signalée en note.
- source_word: Ἰακώβῳ
  choice: à Jacques
  rationale: Le datif désigne la personne à qui le Christ est apparu. « Jacques » est la forme française traditionnelle et courante du nom Ἰάκωβος.
- source_word: εἶτα
  choice: puis
  rationale: Second adverbe séquentiel. « Puis » maintient la progression de la liste tout en donnant une tournure française fluide.
- source_word: ἀποστόλοις
  choice: apôtres
  rationale: Dans ce contexte, le terme désigne des témoins reconnus comme apôtres plutôt que de simples messagers. « Apôtres » conserve ce sens établi sans préciser davantage l’identité du groupe.
- source_word: πᾶσιν
  choice: tous
  rationale: Le mot insiste sur la totalité du groupe désigné par « les apôtres ». « Tous les apôtres » est direct et fidèle.
theological_decisions:
- issue: Identité et étendue de « tous les apôtres » par rapport à Jacques
  choice: Conserver simplement « tous les apôtres », sans délimiter le groupe.
  alternative: Comprendre l’expression comme désignant précisément les Douze, ou un groupe plus large de témoins mandatés distinct des Douze.
  rationale: Le grec ne définit pas ici la composition exacte de ce groupe. La traduction préserve donc l’expression et la distinction entre l’apparition à Jacques et celle, ultérieure, à « tous les apôtres », sans imposer d’harmonisation.
translation_notes:
  register: Français international moderne, naturel et digne. La répétition grecque des deux adverbes de succession est rendue par « Ensuite… puis » pour préserver la progression tout en évitant une lourdeur stylistique. Le pronom « il » reprend le Christ mentionné dans le contexte immédiat.
