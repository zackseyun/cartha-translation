  text: καὶ σώματα ἐπουράνια, καὶ σώματα ἐπίγεια· ἀλλὰ ἑτέρα μὲν ἡ τῶν ἐπουρανίων δόξα, ἑτέρα δὲ ἡ τῶν ἐπιγείων.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/040.yaml
  text: And there are heavenly bodies and earthly bodies; but the glory of the heavenly is one kind[a], and the glory of the earthly is another.
translation:
  language: fr
  text: Il y a aussi des corps célestes et des corps terrestres ; mais la gloire des corps célestes est différente de celle des corps terrestres.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σώματα
  choice: corps
  rationale: « Corps » rend directement σῶμα et préserve l’étendue possible de l’image sans préciser indûment s’il s’agit d’astres, de corps ressuscités ou d’autres formes corporelles.
- source_word: ἐπουράνια
  choice: célestes
  rationale: « Célestes » exprime ce qui appartient au ciel et forme en français un contraste naturel avec « terrestres », tout en gardant ouverte la portée exacte du terme.
- source_word: ἐπίγεια
  choice: terrestres
  rationale: « Terrestres » rend ce qui est sur la terre ou lui appartient et s’accorde naturellement avec « corps ».
- source_word: ἀλλὰ
  choice: mais
  rationale: « Mais » reproduit simplement la valeur adversative du grec.
- source_word: ἑτέρα μὲν ... ἑτέρα δὲ
  choice: autre est… autre celle…
  rationale: Cette tournure française conserve le parallélisme et souligne la différence entre les deux gloires sans ajouter explicitement la notion de « sorte ».
- source_word: δόξα
  choice: gloire
  rationale: « Gloire » maintient le vocabulaire théologique de Paul tout en pouvant désigner ici l’éclat ou la splendeur propre à chaque catégorie.
- source_word: τῶν ἐπουρανίων ... τῶν ἐπιγείων
  choice: des corps célestes… des corps terrestres
  rationale: Le grec sous-entend σώματα dans ces groupes nominaux. Le répéter une première fois puis employer « celle » rend l’ellipse clairement et naturellement en français.
theological_decisions:
- issue: Référent des « corps célestes » et des « corps terrestres »
  choice: Conserver les expressions génériques « corps célestes » et « corps terrestres » sans en restreindre le référent.
  alternative: « astres et corps terrestres » ou « êtres célestes et êtres terrestres »
  rationale: Le grec dit σώματα (« corps »), non « êtres », et le contexte développe une analogie sur diverses formes corporelles et leur gloire. La formulation retenue évite aussi de réduire nécessairement les corps célestes aux seuls astres.
translation_notes:
  register: Français moderne, digne et accessible. Le parallélisme concis du grec est conservé. Aucun appel de note n’est nécessaire, puisque « corps célestes » et « corps terrestres » expriment directement l’ambiguïté lexicale plutôt que de proposer une variante distincte.
