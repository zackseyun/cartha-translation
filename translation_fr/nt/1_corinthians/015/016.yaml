id: 1CO.15.16
reference: 1 Corinthians 15:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἰ γὰρ νεκροὶ οὐκ ἐγείρονται, οὐδὲ Χριστὸς ἐγήγερται·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/016.yaml
  text: For if the dead are not raised[a], not even Messiah has been raised.
translation:
  language: fr
  text: Car si les morts ne sont pas ressuscités, même le Messie[a] n’a pas été ressuscité.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le Christ ». Le titre grec Χριστός peut être rendu par « Messie » ou, selon la tradition, par « Christ ».
    reason: alternative_reading
lexical_decisions:
- source_word: εἰ γὰρ
  choice: Car si
  rationale: Rend à la fois la condition introduite par εἰ et la fonction explicative de γάρ dans l’enchaînement de l’argument.
- source_word: νεκροὶ
  choice: les morts
  rationale: L’adjectif substantivé désigne ici, de manière générale, les personnes mortes; « les morts » est la formulation française naturelle et concise.
- source_word: οὐκ ἐγείρονται
  choice: ne sont pas ressuscités
  rationale: Le présent passif exprime la résurrection des morts sans transformer le verbe en tournure purement intransitive.
- source_word: οὐδὲ
  choice: même … ne … pas
  rationale: 'Cette construction restitue la conséquence renforcée portée par οὐδέ : dans cette hypothèse, pas même le Messie n’a été ressuscité.'
- source_word: Χριστὸς
  choice: le Messie
  rationale: Χριστός conserve ici sa valeur de titre, « l’Oint »; « le Messie » en communique directement le sens en français.
- source_word: ἐγήγερται
  choice: n’a pas été ressuscité
  rationale: Le passé composé passif rend l’acte accompli et son résultat durable exprimés par le parfait grec, tout en conservant la voix passive.
theological_decisions:
- issue: Valeur de Χριστός dans l’argument sur la résurrection
  choice: le Messie
  alternative: le Christ
  rationale: Le contexte permet de faire entendre clairement la valeur titulaire de Χριστός. La traduction traditionnelle « le Christ » reste légitime et est signalée en note, sans imposer une distinction théologique absente du grec.
translation_notes:
  register: Français moderne, clair et digne. La répétition de « ressuscités / ressuscité » reproduit le parallélisme logique serré du grec; « même » préserve l’insistance de οὐδέ.
