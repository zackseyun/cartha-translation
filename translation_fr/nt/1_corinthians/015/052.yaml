source:
  edition: SBLGNT
  text: ἐν ἀτόμῳ, ἐν ῥιπῇ ὀφθαλμοῦ, ἐν τῇ ἐσχάτῃ σάλπιγγι· σαλπίσει γάρ, καὶ οἱ νεκροὶ ἐγερθήσονται ἄφθαρτοι, καὶ ἡμεῖς ἀλλαγησόμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/052.yaml
  text: in an instant[a], in the blink of an eye, at the last trumpet. For the trumpet will sound, and the dead will be raised imperishable, and we will be changed.
translation:
  language: fr
  text: en un instant[a], en un clin d’œil, à la dernière trompette. Car la trompette sonnera, les morts seront ressuscités impérissables, et nous serons changés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec évoque littéralement un laps de temps indivisible, donc extrêmement bref.
    reason: Précision sur l’image et la force temporelle de ἀτόμῳ.
lexical_decisions:
- source_word: ἐν ἀτόμῳ
  choice: en un instant
  rationale: ἄτομος désigne littéralement ce qui ne peut être divisé et, dans cette expression temporelle, un laps de temps extrêmement bref. « En un instant » en restitue naturellement le sens.
- source_word: ἐν ῥιπῇ ὀφθαλμοῦ
  choice: en un clin d’œil
  rationale: Cette expression évoque un mouvement de l’œil d’une extrême rapidité. « En un clin d’œil » est l’expression française courante qui en préserve l’image et la soudaineté.
- source_word: ἐν τῇ ἐσχάτῃ σάλπιγγι
  choice: à la dernière trompette
  rationale: La préposition ἐν a ici une valeur temporelle liée à la sonnerie de la trompette. Cette formulation conserve directement ἐσχάτῃ, « dernière », sans préciser davantage le scénario eschatologique.
- source_word: σαλπίσει
  choice: la trompette sonnera
  rationale: Le verbe signifie « sonner de la trompette ». Le français demande ici un sujet explicite, naturellement fourni par la trompette qui vient d’être mentionnée.
- source_word: οἱ νεκροὶ
  choice: les morts
  rationale: L’adjectif substantivé désigne collectivement les personnes mortes. « Les morts » est la formulation française directe et naturelle.
- source_word: ἐγερθήσονται
  choice: seront ressuscités
  rationale: Le futur passif de ἐγείρω, dans ce contexte, exprime la résurrection. « Seront ressuscités » conserve la voix passive et le sens contextuel.
- source_word: ἄφθαρτοι
  choice: impérissables
  rationale: Le terme décrit ce qui n’est plus soumis à la corruption ni à la décomposition. « Impérissables » est clair en français moderne et convient à l’argument sur la résurrection.
- source_word: ἡμεῖς
  choice: nous, nous
  rationale: Le pronom grec est explicite et emphatique. La dislocation française « nous, nous » rend son relief et marque le contraste avec « les morts » sans expliciter davantage l’identité du groupe.
- source_word: ἀλλαγησόμεθα
  choice: serons changés
  rationale: Le futur passif de ἀλλάσσω signifie directement « être changé ». Cette traduction préserve la forme passive et évite d’ajouter une interprétation au type de changement.
theological_decisions:
- issue: Interprétation de « la dernière trompette »
  choice: à la dernière trompette
  alternative: au son de la trompette finale
  rationale: Le texte qualifie explicitement la trompette de « dernière », mais ne développe pas ici un système chronologique des événements de la fin. La formulation choisie conserve cette donnée tout en laissant ouverte sa portée précise.
- issue: Portée du pronom « nous »
  choice: et nous, nous serons changés
  alternative: et ceux d’entre nous qui seront encore vivants seront transformés
  rationale: Le grec emploie simplement la première personne du pluriel en contraste avec « les morts ». La traduction conserve ce contraste sans développer une explication tirée du contexte plus large.
- issue: Agent de la résurrection
  choice: les morts seront ressuscités
  alternative: les morts ressusciteront
  rationale: Le passif grec laisse l’agent implicite. Le passif français préserve cette caractéristique sans nommer explicitement Dieu, bien que son action puisse être comprise dans le contexte.
translation_notes:
  register: Français international moderne, naturel et digne. Le rythme ternaire du début est conservé. « En un clin d’œil » rend l’image de façon idiomatique, tandis que « nous, nous » maintient l’emphase du pronom grec et le contraste avec les morts.
