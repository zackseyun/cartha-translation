  source_fidelity: 'Le sens grec est bien représenté : Paul oppose le corps futur au grain semé, et l’exemple éventuel du blé ou d’une autre espèce est conservé. Toutefois, « grain nu » est trop peu idiomatique en français courant dans ce contexte; « simple grain » rend naturellement γυμνὸν κόκκον sans atténuer le contraste.'
  naturalness: « Tu ne sèmes pas le corps qui sera » est plus fluide que la dislocation « ce n’est pas le corps à venir que tu sèmes ». « Un simple grain » est une expression française naturelle pour la semence seule, sans la forme corporelle future.
  terminology: « Corps » maintient le terme paulinien σῶμα. « Semer », « blé » et « autre espèce » sont précis et adaptés à un français international moderne. La note conserve les possibilités plus littérales pour γυμνός et pour le participe futur.
