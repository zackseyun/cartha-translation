source:
  edition: SBLGNT
  text: καὶ ὃ σπείρεις, οὐ τὸ σῶμα τὸ γενησόμενον σπείρεις ἀλλὰ γυμνὸν κόκκον εἰ τύχοι σίτου ἤ τινος τῶν λοιπῶν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/037.yaml
  text: And what you sow[a], you do not sow the body that will be, but a bare kernel[c][b], perhaps of wheat or of some other kind.
translation:
  language: fr
  text: Et ce que tu sèmes, tu ne sèmes pas le corps qui sera[a], mais un simple grain[b], peut-être de blé ou de quelque autre espèce.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « le corps à venir ». Littéralement : « le corps qui viendra à l’existence » ou « qui sera ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « un grain nu » ; ou « un grain dépouillé ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: σπείρεις
  choice: tu sèmes
  rationale: « Semer » est le terme agricole direct et maintient l’image de la semence ainsi que la répétition du verbe grec.
- source_word: σῶμα
  choice: corps
  rationale: « Corps » conserve le terme central de l’argument de Paul sur la résurrection, sans l’affaiblir en « forme » ni le réduire à la seule plante.
- source_word: τὸ γενησόμενον
  choice: à venir
  rationale: Cette tournure française naturelle exprime l’existence future du corps sans préciser indûment qu’il s’agit simplement de croissance botanique.
- source_word: γυμνὸν κόκκον
  choice: un grain nu
  rationale: « Grain » convient à κόκκος dans l’exemple du blé, et « nu » préserve l’image frappante de γυμνός ainsi que le contraste avec le corps futur.
- source_word: εἰ τύχοι
  choice: peut-être
  rationale: L’expression introduit un exemple éventuel; « peut-être » en restitue de manière concise la valeur contingente.
- source_word: σίτου
  choice: de blé
  rationale: Dans ce contexte, σῖτος désigne naturellement le blé, présenté comme exemple concret.
- source_word: τινος τῶν λοιπῶν
  choice: de quelque autre espèce
  rationale: Le grec évoque l’un des autres types de grains sans les nommer; cette formulation explicite naturellement l’ellipse en français.
theological_decisions:
- issue: Rapport entre le grain semé et le corps ressuscité
  choice: Conserver « corps » et une formulation orientée vers l’avenir, sans expliquer davantage le rapport entre continuité et transformation.
  alternative: Paraphraser par « la plante qui poussera ».
  rationale: Paul emploie une analogie agricole au service de son enseignement sur la résurrection corporelle. La traduction garde à la fois l’image et le mot « corps », sans imposer au verset une explication doctrinale plus développée.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement singulier suit l’adresse rhétorique grecque. Le tiret met naturellement en relief les exemples sans modifier leur rapport syntaxique.
