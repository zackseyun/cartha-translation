id: 1CO.15.41
reference: 1 Corinthians 15:41
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἄλλη δόξα ἡλίου, καὶ ἄλλη δόξα σελήνης, καὶ ἄλλη δόξα ἀστέρων, ἀστὴρ γὰρ ἀστέρος διαφέρει ἐν δόξῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/041.yaml
  text: There is one glory of the sun[a], and another glory of the moon, and another glory of the stars; for star differs from star in glory.
translation:
  language: fr
  text: Autre est la gloire du soleil[a], autre celle de la lune, et autre celle des étoiles ; en effet, une étoile diffère d’une autre en gloire.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « splendeur » ou « éclat » dans tout le verset. Ici, le grec δόξα peut désigner un rayonnement visible, mais « gloire » préserve le mot répété par Paul dans l’ensemble de son argumentation.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλη
  choice: autre… autre… autre
  rationale: La répétition de ἄλλη distingue les différentes sortes de corps célestes. La tournure française « Autre est… autre celle… » conserve ce contraste et évite de répéter lourdement le nom « gloire ».
- source_word: δόξα
  choice: gloire
  rationale: Dans cette comparaison cosmologique, le mot désigne notamment l’éclat visible, mais « gloire » maintient la répétition lexicale de Paul et le lien avec son argument sur le corps ressuscité.
- source_word: ἡλίου
  choice: du soleil
  rationale: Le génitif dépend de δόξα et se rend naturellement par « du soleil ».
- source_word: σελήνης
  choice: de la lune
  rationale: Le génitif dépend de δόξα, en parallèle avec « du soleil ».
- source_word: ἀστέρων
  choice: des étoiles
  rationale: Le génitif pluriel complète la série formée par le soleil, la lune et les étoiles.
- source_word: ἀστὴρ… ἀστέρος
  choice: une étoile… d’une autre
  rationale: Cette formulation française naturelle préserve la comparaison entre deux membres d’une même catégorie.
- source_word: γὰρ
  choice: en effet
  rationale: γάρ introduit l’explication de l’affirmation précédente ; « en effet » exprime clairement cette relation en français moderne.
- source_word: διαφέρει
  choice: diffère
  rationale: Le verbe indique une différence sans imposer l’idée plus forte de supériorité.
- source_word: ἐν δόξῃ
  choice: en gloire
  rationale: La formulation précise le domaine dans lequel les étoiles diffèrent et conserve le terme clé répété dans le verset.
theological_decisions:
- issue: Traduction de δόξα dans une comparaison cosmologique intégrée au discours sur la résurrection
  choice: gloire
  alternative: éclat ; splendeur
  rationale: Le référent immédiat comprend l’éclat différent des corps célestes, mais « gloire » préserve la continuité rhétorique et théologique avec l’argument environnant sans réduire le terme à la seule luminosité physique.
translation_notes:
  register: Français international moderne, digne et accessible. La construction parallèle conserve la cadence du grec, tandis que l’ellipse « celle » évite une répétition peu naturelle. Le point-virgule rend le lien explicatif introduit par γάρ.
