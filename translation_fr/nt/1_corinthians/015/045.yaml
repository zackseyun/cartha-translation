id: 1CO.15.45
reference: 1 Corinthians 15:45
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὕτως καὶ γέγραπται· Ἐγένετο ὁ πρῶτος ἄνθρωπος Ἀδὰμ εἰς ψυχὴν ζῶσαν· ὁ ἔσχατος Ἀδὰμ εἰς πνεῦμα ζῳοποιοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/045.yaml
  text: 'So also it is written: “The first man[a], Adam, became a living being”[b]; the last Adam became a life-giving spirit.'
translation:
  language: fr
  text: 'C’est aussi ce qui est écrit : « Le premier homme, Adam, devint un être vivant[a] » ; le dernier Adam devint un esprit qui donne la vie[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une âme vivante », selon la traduction traditionnelle de Genèse 2.7.
    reason: lexical_alternative
  - marker: b
    text: Ou « un esprit vivifiant ». L’expression décrit le dernier Adam par contraste avec le premier ; en grec, elle a une valeur qualitative et n’identifie pas nécessairement de manière explicite le Christ au Saint-Esprit comme personne distincte.
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως καὶ γέγραπται
  choice: C’est aussi ce qui est écrit
  rationale: Cette formulation naturelle conserve à la fois le lien marqué par καί avec l’argument précédent et la formule habituelle introduisant une citation de l’Écriture.
- source_word: Ἐγένετο
  choice: devint
  rationale: Le verbe exprime ici l’accès à un état ou le résultat de l’acte créateur. « Devint » est concis, idiomatique et convient également au verbe sous-entendu dans le second membre.
- source_word: ὁ πρῶτος ἄνθρωπος
  choice: le premier homme
  rationale: Dans ce contraste typologique entre Adam et le dernier Adam, « homme » conserve la référence masculine et représentative du texte, là où « être humain » affaiblirait le parallélisme.
- source_word: Ἀδὰμ
  choice: Adam
  rationale: Forme française consacrée du nom propre.
- source_word: εἰς ψυχὴν ζῶσαν
  choice: un être vivant
  rationale: Dans l’écho à Genèse 2.7, ψυχή désigne Adam comme créature animée, comme personne vivante, sans imposer l’idée d’une composante immatérielle séparable. La traduction traditionnelle « une âme vivante » est signalée en note.
- source_word: ὁ ἔσχατος Ἀδὰμ
  choice: le dernier Adam
  rationale: « Le dernier Adam » est la formulation française établie et préserve le contraste typologique et eschatologique voulu par Paul.
- source_word: εἰς πνεῦμα ζῳοποιοῦν
  choice: un esprit qui donne la vie
  rationale: La formulation rend le caractère qualitatif de πνεῦμα sans article et le sens actif de ζῳοποιέω. Elle reste naturelle en français sans transformer l’expression en identification dogmatique explicite avec le Saint-Esprit.
theological_decisions:
- issue: Portée anthropologique de ψυχὴν ζῶσαν dans la citation de la Genèse
  choice: Traduire par « un être vivant ».
  alternative: « une âme vivante »
  rationale: L’expression présente Adam comme un être animé et vivant, non principalement comme possédant une âme immatérielle distincte. La note conserve toutefois la traduction traditionnelle et l’écho lexical qu’elle rend visible.
- issue: Sens de l’expression « le dernier Adam devint un esprit qui donne la vie »
  choice: Maintenir le contraste typologique sous une forme qualitative, sans explicitation doctrinale.
  alternative: « le dernier Adam devint l’Esprit qui donne la vie »
  rationale: L’absence d’article devant πνεῦμα favorise une description qualitative plutôt qu’une identification grammaticale explicite du Christ avec le Saint-Esprit comme personne distincte. La traduction préserve ainsi la tension de l’énoncé sans la résoudre par une paraphrase théologique.
translation_notes:
  register: Français international moderne, clair et digne. « Devint » donne au parallélisme une forme concise et soutenue sans archaïsme marqué. Les guillemets ne portent que sur la citation de Genèse 2.7 ; la seconde proposition reprend l’argument de Paul.
