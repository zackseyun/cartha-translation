  text: σπείρεται ἐν ἀτιμίᾳ, ἐγείρεται ἐν δόξῃ· σπείρεται ἐν ἀσθενείᾳ, ἐγείρεται ἐν δυνάμει·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/043.yaml
  text: It is sown in dishonor; it is raised in glory. It is sown in weakness; it is raised in power.
translation:
  language: fr
  text: Il est semé dans le déshonneur, il est ressuscité dans la gloire ; il est semé dans la faiblesse, il est ressuscité dans la puissance.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σπείρεται
  choice: il est semé
  rationale: Le passif présent est conservé, de même que l’image de la semence développée dans le contexte. Le pronom « il » reprend naturellement « le corps » du verset précédent.
- source_word: ἀτιμίᾳ
  choice: dans le déshonneur
  rationale: « Déshonneur » rend directement le contraste avec « gloire » sans réduire le sens à un sentiment subjectif de honte.
- source_word: ἐγείρεται
  choice: il est ressuscité
  rationale: Dans ce contexte consacré à la résurrection des morts, « ressuscité » exprime naturellement le sens de ἐγείρω. Le passif maintient implicite l’agent divin, comme dans le grec.
- source_word: δόξῃ
  choice: dans la gloire
  rationale: « Gloire » conserve la portée du terme et son opposition au déshonneur.
- source_word: ἀσθενείᾳ
  choice: dans la faiblesse
  rationale: « Faiblesse » est une traduction directe et suffisamment large pour inclure la fragilité corporelle sans limiter le terme à celle-ci.
- source_word: δυνάμει
  choice: dans la puissance
  rationale: « Puissance » préserve le contraste paulinien avec la faiblesse et ne réduit pas la réalité de la résurrection à la seule force physique.
theological_decisions:
- issue: Voix et agent de la résurrection
  choice: Conserver les formes passives sans nommer explicitement Dieu comme agent.
  alternative: Dieu le ressuscite.
  rationale: Le grec emploie le passif. Le conserver respecte la formulation de Paul tout en laissant l’action divine implicite.
- issue: Référent du sujet sous-entendu
  choice: Employer « il », qui renvoie au corps mentionné dans le contexte immédiat.
  alternative: Répéter « le corps » dans chaque proposition.
  rationale: Le pronom assure une lecture naturelle en français et évite une répétition absente du grec, sans modifier le référent.
translation_notes:
  register: Français moderne, international et digne. Le parallélisme antithétique du grec est conservé, avec une ponctuation qui fait ressortir les deux couples déshonneur/gloire et faiblesse/puissance.
