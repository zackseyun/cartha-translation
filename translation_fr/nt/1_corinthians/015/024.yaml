id: 1CO.15.24
reference: 1 Corinthians 15:24
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἶτα τὸ τέλος, ὅταν ⸀παραδιδῷ τὴν βασιλείαν τῷ θεῷ καὶ πατρί, ὅταν καταργήσῃ πᾶσαν ἀρχὴν καὶ πᾶσαν ἐξουσίαν καὶ δύναμιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/024.yaml
  text: Then comes the end[a], when he hands over the kingdom to God the Father[c][b], when he abolishes every rule and every authority and power.
translation:
  language: fr
  text: Puis viendra la fin[a], lorsqu’il remettra le royaume à Dieu, le Père[b], lorsqu’il abolira[c] toute domination, toute autorité et toute puissance.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’accomplissement ». Le grec peut désigner la fin, le but ou l’achèvement.
    reason: lexical_alternative
  - marker: b
    text: Ou, plus littéralement, « à Dieu et Père ».
    reason: lexical_alternative
  - marker: c
    text: Ou « réduira à rien » ou « mettra hors d’action ».
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶτα
  choice: Puis
  rationale: Marque naturellement l’étape suivante dans la séquence exposée par Paul.
- source_word: τὸ τέλος
  choice: la fin
  rationale: Rend le sens temporel le plus direct dans ce contexte eschatologique, sans exclure l’idée d’accomplissement signalée en note.
- source_word: ὅταν παραδιδῷ
  choice: lorsqu’il remettra
  rationale: Exprime un événement futur et le transfert du royaume, dans un français actuel et digne.
- source_word: τὴν βασιλείαν
  choice: le royaume
  rationale: Équivalent français naturel qui conserve l’image royale, tout en pouvant inclure la notion dynamique de règne.
- source_word: τῷ θεῷ καὶ πατρί
  choice: à Dieu, le Père
  rationale: La mise en apposition est naturelle en français et identifie le Père comme celui à qui le royaume est remis, sans effacer la formulation grecque.
- source_word: ὅταν καταργήσῃ
  choice: après avoir aboli
  rationale: Le participe composé rend clairement que l’abolition des puissances est accomplie au moment de la remise du royaume; « aboli » exprime leur suppression effective sans imposer l’idée d’anéantissement métaphysique.
- source_word: πᾶσαν ἀρχὴν
  choice: toute domination
  rationale: Dans cette série, ἀρχή désigne vraisemblablement une puissance dominatrice; « domination » préserve mieux qu’un terme exclusivement personnel l’ambiguïté entre fonction, domaine et puissance personnifiée.
- source_word: πᾶσαν ἐξουσίαν
  choice: toute autorité
  rationale: Équivalent courant et précis pour l’autorité détenue ou exercée.
- source_word: δύναμιν
  choice: toute puissance
  rationale: Rend le dernier élément de la triade avec un terme large et idiomatique.
theological_decisions:
- issue: Rapport entre « Dieu » et « Père » dans τῷ θεῷ καὶ πατρί
  choice: 'Lecture appositionnelle : « à Dieu, le Père »'
  alternative: 'Lecture coordonnée ou plus littérale : « à Dieu et Père »'
  rationale: L’apposition donne un français clair et naturel tout en reflétant l’identification contextuelle de Dieu comme le Père; elle ne tire aucune conclusion supplémentaire sur la christologie.
- issue: Portée de καταργήσῃ appliqué aux puissances
  choice: Abolition ou mise hors d’action décisive
  alternative: Anéantissement total, ou simple neutralisation
  rationale: « Abolir » conserve la force du verbe — mettre fin à leur efficacité ou à leur pouvoir — sans préciser au-delà du texte leur sort métaphysique.
- issue: Référent de ἀρχή
  choice: « domination », pouvant désigner un pouvoir ou une puissance dominante
  alternative: « chef », lecture explicitement personnelle; ou « pouvoir », lecture abstraite
  rationale: Le contexte autorise une compréhension personnelle ou institutionnelle. « Domination » maintient cette ouverture sans résoudre indûment la nature exacte des puissances.
translation_notes:
  register: Français international moderne, fluide et solennel. La répétition grecque de ὅταν est rendue par « lorsqu’il… après avoir… » afin d’exprimer naturellement le rapport temporel entre les deux actions. Les marqueurs de notes sont placés immédiatement après les expressions concernées.
