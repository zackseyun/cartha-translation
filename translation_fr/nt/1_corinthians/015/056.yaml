  text: τὸ δὲ κέντρον τοῦ θανάτου ἡ ἁμαρτία, ἡ δὲ δύναμις τῆς ἁμαρτίας ὁ νόμος·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/056.yaml
  text: The sting of death is sin[b][a], and the power of sin is the law.
translation:
  language: fr
  text: L’aiguillon de la mort, c’est le péché, et la puissance[a] du péché, c’est la loi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « force » : « la force du péché, c’est la loi ».'
    reason: lexical_alternative
  - marker: b
    text: 'Dans l’argument de Paul, « la loi » désigne probablement surtout la loi mosaïque, mais la formulation permet aussi un sens plus large : la loi révèle le péché et en intensifie l’action.'
    reason: alternative_reading
lexical_decisions:
- source_word: κέντρον
  choice: aiguillon
  rationale: Le terme désigne une pointe qui blesse ou un aiguillon; dans cette personnification de la mort et en continuité avec le verset précédent, « aiguillon » rend naturellement l’image sans la réduire à un insecte précis.
- source_word: θανάτου
  choice: de la mort
  rationale: 'Le génitif exprime simplement l’association ou l’appartenance : l’aiguillon propre à la mort.'
- source_word: ἁμαρτία
  choice: péché
  rationale: Le singulier est conservé, car Paul présente ici le péché comme une puissance ou un principe, et non seulement comme une série d’actes.
- source_word: δύναμις
  choice: puissance
  rationale: « Puissance » exprime la capacité d’action ou l’efficacité attribuée au péché dans l’argument de Paul; « force » reste également possible.
- source_word: νόμος
  choice: la loi
  rationale: La minuscule et la formulation générale préservent à la fois la probable résonance de la loi mosaïque et la portée plus large que le grec permet.
- source_word: δὲ
  choice: et
  rationale: Les deux occurrences structurent ici une explication et une progression plutôt qu’une opposition forte; un seul « et » relie naturellement les deux propositions nominales en français.
theological_decisions:
- issue: Sens de « la loi » comme puissance du péché
  choice: « la loi », sans majuscule, avec une note signalant la référence probablement mosaïque
  alternative: « la Loi », comme désignation explicite et exclusive de la loi mosaïque, ou « une loi », au sens d’un principe général
  rationale: Le contexte paulinien évoque fortement la loi mosaïque, mais la formulation grecque permet de ne pas enfermer l’énoncé dans cette seule précision. La traduction conserve cette tension.
translation_notes:
  register: Français international moderne, digne et accessible. La structure « c’est » restitue clairement les deux propositions nominales grecques sans ajouter de verbe théologiquement chargé. L’image traditionnelle de l’« aiguillon » est conservée parce qu’elle demeure intelligible et relie ce verset au précédent.
