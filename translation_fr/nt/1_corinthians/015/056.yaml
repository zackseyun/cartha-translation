  source_fidelity: 'Le texte rend fidèlement les deux propositions nominales grecques : « L’aiguillon de la mort, c’est le péché » pour τὸ κέντρον τοῦ θανάτου ἡ ἁμαρτία, puis « la puissance du péché, c’est la loi » pour ἡ δύναμις τῆς ἁμαρτίας ὁ νόμος. « Aiguillon » conserve l’image de κέντρον dans le prolongement direct du verset précédent, sans réduire indûment le terme à un insecte ou à un sens littéral unique. L’absence d’un « Or » ou « Mais » explicite est recevable : les δέ ont ici une valeur de développement et la juxtaposition française est fluide.'
