source:
  edition: SBLGNT
  text: εὑρισκόμεθα δὲ καὶ ψευδομάρτυρες τοῦ θεοῦ, ὅτι ἐμαρτυρήσαμεν κατὰ τοῦ θεοῦ ὅτι ἤγειρεν τὸν Χριστόν, ὃν οὐκ ἤγειρεν εἴπερ ἄρα νεκροὶ οὐκ ἐγείρονται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/015.yaml
  text: Then we are even found to be false witnesses about God[a], because we testified about God that he raised the Messiah[b], whom he did not raise if in fact the dead are not raised.
translation:
  language: fr
  text: Nous sommes même reconnus comme de faux témoins au sujet de Dieu, car nous avons porté témoignage contre Dieu en affirmant qu’il a ressuscité le Messie[a], celui qu’il n’a pas ressuscité si vraiment les morts ne ressuscitent pas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Grec : « le Christ » ; le terme signifie « le Messie », c’est-à-dire l’Oint.'
    reason: alternative_reading
  - marker: b
    text: 'Littéralement : « les morts ne sont pas relevés » ou « ne sont pas ressuscités ». Le grec emploie le présent passif.'
    reason: literal_rendering
lexical_decisions:
- source_word: εὑρισκόμεθα δὲ καὶ
  choice: Nous sommes même convaincus d’être
  rationale: « Être convaincu de » exprime ici le fait d’être reconnu ou démontré tel, tout en conservant la forme passive et la conséquence emphatique marquée par δὲ καὶ.
- source_word: ψευδομάρτυρες τοῦ θεοῦ
  choice: de faux témoins au sujet de Dieu
  rationale: 'Le génitif désigne vraisemblablement l’objet du faux témoignage : un témoignage qui concerne Dieu. Cette formulation française est claire sans faire des témoins des personnes appartenant à Dieu.'
- source_word: ἐμαρτυρήσαμεν κατὰ τοῦ θεοῦ
  choice: nous avons témoigné contre Dieu
  rationale: κατά avec le génitif porte normalement un sens adversatif. Paul souligne ainsi que leur affirmation les placerait en opposition avec Dieu si elle lui attribuait un acte qu’il n’a pas accompli.
- source_word: ἤγειρεν τὸν Χριστόν
  choice: il a ressuscité le Messie
  rationale: « Ressusciter » est le verbe français naturel pour l’action de relever d’entre les morts; l’article et le contexte favorisent ici le sens titulaire de Χριστός, rendu par « le Messie ».
- source_word: ὃν οὐκ ἤγειρεν
  choice: alors qu’il ne l’a pas ressuscité
  rationale: La formulation reprend le même verbe pour préserver le contraste rhétorique, tandis que « alors que » rend naturelle en français la relative explicative.
- source_word: εἴπερ ἄρα
  choice: si, en réalité
  rationale: Cette expression marque une prémisse conditionnelle avancée pour les besoins de l’argument et lui donne une force appuyée.
- source_word: νεκροὶ οὐκ ἐγείρονται
  choice: les morts ne ressuscitent pas
  rationale: Le présent énonce la proposition générale discutée. En français, la forme intransitive « ressuscitent » est plus idiomatique que le passif littéral, sans trancher explicitement l’agent de la résurrection.
theological_decisions:
- issue: Sens de κατὰ τοῦ θεοῦ
  choice: contre Dieu
  alternative: au sujet de Dieu
  rationale: 'Le sens adversatif courant de κατά avec le génitif conserve la gravité de l’argument : un témoignage mensonger sur l’acte de Dieu constituerait aussi un témoignage porté contre lui. La distinction avec τοῦ θεοῦ, rendu « au sujet de Dieu », reste visible.'
- issue: Valeur de Χριστός
  choice: le Messie
  alternative: le Christ
  rationale: Dans cette argumentation sur la résurrection, le terme conserve nettement sa valeur de titre. « Messie » traduit ce titre plutôt que de le traiter comme un nom propre.
- issue: Voix de οὐκ ἐγείρονται
  choice: ne ressuscitent pas
  alternative: ne sont pas ressuscités
  rationale: La formulation française idiomatique préserve la proposition générale sans préciser que les morts se relèvent par leur propre puissance; une note signale la voix passive grecque.
translation_notes:
  register: Français international moderne, digne et lisible. La phrase conserve la progression judiciaire (« témoins », « témoigné »), distingue le témoignage au sujet de Dieu du témoignage contre Dieu, et évite un calque lourd du passif grec dans la proposition finale.
