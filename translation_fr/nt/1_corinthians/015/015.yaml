  source_fidelity: 'La formulation « sommes convaincus d’être » ne rend pas εὑρισκόμεθα : le verbe signifie être trouvé, constaté ou reconnu comme tel, et non être persuadé. La relative doit aussi rester sous la portée de la condition (« celui qu’il n’a pas ressuscité, si vraiment… »), plutôt que « alors qu’il ne l’a pas ressuscité », qui présente l’énoncé comme concessif et affirmé indépendamment.'
  naturalness: La révision conserve un français moderne et soutenu. « Reconnus comme » est clair dans le registre argumentatif et judiciaire; « porter témoignage contre Dieu » est plus idiomatique que « témoigner contre Dieu » suivi d’une complétive.
  terminology: « Faux témoins », « au sujet de Dieu », « contre Dieu », « ressuscité » et « le Messie » rendent adéquatement les termes grecs et maintiennent la distinction entre τοῦ θεοῦ et κατὰ τοῦ θεοῦ. La note b est corrigée pour ne pas transformer le présent passif ἐγείρονται en passé composé.
  issues:
  - severity: medium
    issue: « Nous sommes même convaincus d’être » pour εὑρισκόμεθα
    rationale: « Être convaincu » signifie normalement être persuadé, ou, dans un emploi judiciaire, être déclaré coupable; il ne traduit pas le passif de εὑρίσκω (« être trouvé/reconnu »).
  - severity: medium
    issue: « alors qu’il ne l’a pas ressuscité » pour ὃν οὐκ ἤγειρεν εἴπερ ἄρα…
    rationale: « Alors que » dissocie indûment la négation de la condition. En grec, l’affirmation qu’il ne l’a pas ressuscité dépend de l’hypothèse concernant les morts.
  - severity: low
    issue: 'Note b : « ne sont pas ressuscités »'
    rationale: La forme grecque est un présent passif, non un parfait/passé composé. La note doit signaler « ne sont pas relevés » ou « ne sont pas ressuscités » au présent, si elle est conservée.
