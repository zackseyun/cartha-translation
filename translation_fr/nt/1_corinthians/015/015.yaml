  to: Nous sommes même reconnus comme de faux témoins au sujet de Dieu, car nous avons porté témoignage contre Dieu en affirmant qu’il a ressuscité le Messie[a], celui qu’il n’a pas ressuscité si vraiment les morts ne ressuscitent pas[b].
  rationale: La révision corrige le sens de εὑρισκόμεθα, préserve la portée de la condition εἴπερ ἄρα sur « celui qu’il n’a pas ressuscité », et rectifie la note portant sur le présent passif final. Elle ne modifie pas l’interprétation retenue de κατά avec le génitif ni le rendu titulaire de Χριστός.
