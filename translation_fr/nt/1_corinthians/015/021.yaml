reference: 1 Corinthians 15:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐπειδὴ γὰρ δι’ ἀνθρώπου ⸀θάνατος, καὶ δι’ ἀνθρώπου ἀνάστασις νεκρῶν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/021.yaml
  text: For since death came through a man[b][a], the resurrection of the dead also came through a man.
translation:
  language: fr
  text: En effet, puisque la mort est venue par un homme[a][b], la résurrection des morts est aussi venue par un homme.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « par l’intermédiaire d’un homme » dans les deux propositions ; la préposition grecque peut exprimer aussi bien l’agent que le moyen.
    reason: lexical_alternative
  - marker: b
    text: Dans le contexte, Paul identifie ces deux hommes à Adam et au Christ (voir 15.22, 45).
    reason: cross_reference
lexical_decisions:
- source_word: ἐπειδὴ γὰρ
  choice: En effet, puisque
  rationale: Cette tournure rend à la fois la valeur explicative de γάρ et la valeur causale de ἐπειδή, dans un français naturel.
- source_word: δι’ ἀνθρώπου
  choice: par un homme
  rationale: Avec le génitif, διά peut exprimer l’intermédiaire ou l’agent. « Par un homme » conserve le singulier sans article et convient aux deux membres parallèles.
- source_word: θάνατος
  choice: la mort est venue
  rationale: La proposition grecque est sans verbe exprimé. « Est venue » explicite naturellement le lien tout en présentant la mort comme entrée dans la condition humaine.
- source_word: καὶ
  choice: aussi
  rationale: « Aussi » met en relief la correspondance entre les deux propositions.
- source_word: ἀνάστασις νεκρῶν
  choice: la résurrection des morts
  rationale: Cette formulation usuelle et directe conserve la référence concrète à la résurrection de ceux qui sont morts.
- source_word: δι’ ἀνθρώπου
  choice: par un homme
  rationale: La répétition exacte préserve le parallélisme délibéré entre Adam et le Messie.
theological_decisions:
- issue: Contraste représentatif entre Adam et le Messie
  choice: Conserver « un homme » dans les deux propositions sans nommer les deux figures dans le texte principal.
  alternative: « par un seul homme » ou « par Adam… par le Christ »
  rationale: Le contexte identifie ces hommes, mais le verset formule lui-même le contraste de manière générale et symétrique. Ajouter « seul » ou les noms dépasserait son libellé.
- issue: Nature de la résurrection
  choice: Traduire par « la résurrection des morts ».
  alternative: « la vie après la mort » ou « une résurrection spirituelle »
  rationale: Le passage affirme la résurrection réelle des morts; une paraphrase plus vague ou spiritualisante atténuerait cette affirmation.
- issue: Valeur de διά avec le génitif
  choice: Employer « par » tout en signalant la nuance possible d’intermédiaire ou de moyen.
  alternative: « par l’intermédiaire d’un homme »
  rationale: Le français « par » peut exprimer l’agent ou le moyen et préserve donc utilement l’amplitude du grec sans alourdir le texte.
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme grec est conservé par la répétition de « par un homme » et de « est venue ». Les marqueurs suivent l’ordre alphabétique dans le texte.
