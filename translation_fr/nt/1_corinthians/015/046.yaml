id: 1CO.15.46
reference: 1 Corinthians 15:46
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀλλ’ οὐ πρῶτον τὸ πνευματικὸν ἀλλὰ τὸ ψυχικόν, ἔπειτα τὸ πνευματικόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/046.yaml
  text: But the spiritual is not first[a], but the natural[b]; afterward the spiritual.
translation:
  language: fr
  text: Mais ce qui est spirituel ne vient pas en premier[a] ; c’est ce qui est naturel[b], puis ce qui est spirituel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le corps spirituel ne vient pas en premier […] le corps naturel ». Paul omet ici le mot « corps », bien qu’il figure explicitement dans le contexte immédiat.'
    reason: alternative_reading
  - marker: b
    text: '« Naturel » traduit le grec psychikon, qui désigne ce qui relève de la vie animée ordinaire ; plus littéralement : « psychique ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πρῶτον
  choice: en premier
  rationale: L’adverbe indique l’ordre ou la succession. « En premier » exprime directement et naturellement cette priorité temporelle.
- source_word: πνευματικόν
  choice: ce qui est spirituel
  rationale: L’adjectif grec, articulé au neutre singulier, est employé comme substantif. Cette formulation conserve la concision et l’ouverture du grec sans ajouter « corps », que le verset omet.
- source_word: ψυχικόν
  choice: ce qui est naturel
  rationale: Dans ce contexte, le terme désigne ce qui relève de la vie animée ordinaire, par contraste avec la vie spirituelle. « Naturel » évite aussi bien la littéralité obscure de « psychique » que la connotation morale possible de « non spirituel ».
- source_word: ἔπειτα
  choice: puis
  rationale: Le mot marque l’étape suivante dans une succession ; « puis » rend clairement et sobrement cette progression.
- source_word: ἀλλ’ οὐ ... ἀλλὰ
  choice: Mais ... ne ... pas ; c’est ...
  rationale: 'Cette structure française exprime la correction contrastive du grec de manière naturelle : l’ordre supposé est nié, puis l’ordre véritable est affirmé.'
theological_decisions:
- issue: Portée du contraste entre ψυχικόν et πνευματικόν
  choice: Un contraste successif entre ce qui relève de la vie naturelle et ce qui est spirituel dans l’argument sur la résurrection.
  alternative: Un contraste limité explicitement au « corps naturel » et au « corps spirituel », ou un contraste entre personnes non spirituelles et spirituelles.
  rationale: Le contexte immédiat parle du corps, mais ce verset omet le substantif. La traduction conserve donc les adjectifs substantivés et ne restreint pas silencieusement la portée de l’énoncé.
translation_notes:
  register: Français international actuel, digne et accessible. La tournure « ce qui est… » rend naturellement les adjectifs substantivés neutres du grec et préserve l’ambiguïté contextuelle concernant le corps.
