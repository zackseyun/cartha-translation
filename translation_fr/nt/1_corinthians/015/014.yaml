id: 1CO.15.14
reference: 1 Corinthians 15:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἰ δὲ Χριστὸς οὐκ ἐγήγερται, κενὸν ⸀ἄρα τὸ κήρυγμα ἡμῶν, ⸀κενὴ καὶ ἡ πίστις ⸀ὑμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/014.yaml
  text: And if Messiah has not been raised[a], then our proclamation is empty[c][b], and your faith is empty.
translation:
  language: fr
  text: Et si le Messie[a] n’a pas été ressuscité, alors notre proclamation est vide[b], et votre foi est vide.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « le Christ » (grec : Christos).'
    reason: alternative_reading
  - marker: b
    text: Ou « vaine » au lieu de « vide », ici et à la fin du verset.
    reason: lexical_alternative
lexical_decisions:
- source_word: Χριστὸς
  choice: le Messie
  rationale: Le titre « Messie » rend explicitement la valeur de Χριστός et maintient la portée messianique de l’argument de Paul; « Christ » demeure une possibilité traditionnelle.
- source_word: ἐγήγερται
  choice: a été ressuscité
  rationale: Le parfait passif exprime une action accomplie dont le résultat demeure. Cette formulation conserve la voix passive et laisse l’agent divin implicite, comme en grec.
- source_word: κενὸν / κενὴ
  choice: vide
  rationale: « Vide » convient aux deux occurrences et préserve le parallélisme rhétorique, avec l’idée d’une proclamation et d’une foi privées de contenu ou de validité.
- source_word: ἄρα
  choice: alors
  rationale: « Alors » marque naturellement en français la conséquence logique de la proposition conditionnelle.
- source_word: κήρυγμα
  choice: proclamation
  rationale: « Proclamation » conserve l’idée d’une annonce publique, sans réduire le terme à l’acte de prêcher un sermon.
- source_word: πίστις
  choice: foi
  rationale: Dans ce contexte, le mot désigne la réponse croyante des Corinthiens; « foi » est la formulation française la plus naturelle et la plus établie.
theological_decisions:
- issue: Formulation de la résurrection et agent de l’action
  choice: n’a pas été ressuscité
  alternative: n’est pas ressuscité
  rationale: Le grec emploie une forme passive. La conserver maintient la nuance théologique de l’agent implicite sans résoudre davantage la question que ne le fait le texte.
- issue: Valeur titulaire de Χριστός
  choice: le Messie
  alternative: le Christ
  rationale: « Le Messie » fait entendre le sens du titre grec plutôt que de le traiter comme un simple nom propre, tout en signalant l’équivalent traditionnel en note.
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme des deux occurrences de « vide » est conservé; la tournure passive respecte la forme grecque.
