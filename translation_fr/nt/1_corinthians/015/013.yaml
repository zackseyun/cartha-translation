  text: εἰ δὲ ἀνάστασις νεκρῶν οὐκ ἔστιν, οὐδὲ Χριστὸς ἐγήγερται·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/013.yaml
  text: But if there is no resurrection of the dead[b][a], then not even Messiah has been raised.
translation:
  language: fr
  text: Mais s’il n’y a pas de résurrection des morts, le Messie[a] non plus n’a pas été ressuscité[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le Christ ».'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « n’est pas ressuscité ». Le grec emploie un passif, qui peut suggérer l’action de Dieu sans en nommer explicitement l’auteur.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ
  choice: Mais s’il
  rationale: εἰ introduit la condition et δέ marque ici un contraste léger dans la progression de l’argument. « Mais s’il » est naturel et conserve ce mouvement.
- source_word: ἀνάστασις νεκρῶν
  choice: résurrection des morts
  rationale: Cette formulation française consacrée rend le nom ἀνάστασις et le génitif pluriel νεκρῶν, qui désigne les morts comme catégorie.
- source_word: οὐκ ἔστιν
  choice: il n’y a pas
  rationale: Cette tournure exprime naturellement en français la négation existentielle du grec.
- source_word: οὐδὲ
  choice: non plus
  rationale: Après la proposition négative conditionnelle, « non plus » rend clairement la conséquence négative renforcée sans ajouter un connecteur absent du texte.
- source_word: Χριστός
  choice: le Messie
  rationale: Χριστός porte ici sa valeur de titre, « l’Oint »; « le Messie » en communique le sens en français moderne.
- source_word: ἐγήγερται
  choice: n’a pas été ressuscité
  rationale: Le parfait passif grec décrit un acte accompli dont le résultat demeure. Le passif français conserve l’action exercée sur le Messie sans nommer explicitement son auteur.
theological_decisions:
- issue: Valeur de Χριστός
  choice: le Messie
  alternative: le Christ
  rationale: Le contexte permet de comprendre Χριστός comme un titre. « Le Messie » en traduit le contenu, tandis que la variante traditionnelle « le Christ » est signalée en note.
- issue: Voix de ἐγήγερται
  choice: n’a pas été ressuscité
  alternative: n’est pas ressuscité
  rationale: Le passif explicite respecte la forme grecque et laisse implicite l’auteur de l’action, au lieu de transformer celle-ci en action intransitive du Messie lui-même.
translation_notes:
  register: Français international moderne, sobre et digne. La structure conditionnelle et la logique concise de l’argument grec sont conservées; le passif théologiquement significatif n’est pas aplani.
