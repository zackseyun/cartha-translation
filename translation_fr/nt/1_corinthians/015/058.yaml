reference: 1 Corinthians 15:58
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ὥστε, ἀδελφοί μου ἀγαπητοί, ἑδραῖοι γίνεσθε, ἀμετακίνητοι, περισσεύοντες ἐν τῷ ἔργῳ τοῦ κυρίου πάντοτε, εἰδότες ὅτι ὁ κόπος ὑμῶν οὐκ ἔστιν κενὸς ἐν κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/058.yaml
  text: Therefore[a], my beloved brothers, become steadfast, immovable, always abounding in the work of the Lord, knowing that your labor in the Lord is not in vain.
translation:
  language: fr
  text: Ainsi donc, mes frères bien-aimés[a], devenez fermes, inébranlables, abondez toujours dans l’œuvre du Seigneur, sachant que votre labeur dans le Seigneur n’est pas vain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot grec traduit par « frères » peut désigner collectivement les croyants, femmes comprises, selon le contexte.
    reason: Préciser la portée inclusive possible du masculin pluriel grec dans l’adresse à l’ensemble de l’Église.
lexical_decisions:
- source_word: Ὥστε
  choice: Ainsi donc
  rationale: Marque naturellement en français la conclusion tirée de l’argument sur la résurrection développé auparavant.
- source_word: ἀδελφοί μου ἀγαπητοί
  choice: mes frères bien-aimés
  rationale: Conserve le masculin pluriel du grec et l’affection exprimée par ἀγαπητοί; dans ce contexte épistolaire, l’appellation vise collectivement les croyants, femmes comprises, ce que précise la note.
- source_word: ἑδραῖοι γίνεσθε
  choice: devenez fermes
  rationale: « Devenez » rend la valeur verbale de γίνεσθε plutôt qu’une simple copule, tandis que « fermes » exprime l’idée d’une position solidement établie.
- source_word: ἀμετακίνητοι
  choice: inébranlables
  rationale: Exprime le fait de ne pas être déplacé ou détourné de sa position, dans un français naturel et digne.
- source_word: περισσεύοντες
  choice: progressant
  rationale: Dans le cadre d’une œuvre, le verbe περισσεύω peut exprimer le fait d’exceller ou de croître abondamment; « progressant » est idiomatique sans réduire l’idée à la seule quantité.
- source_word: ἐν τῷ ἔργῳ τοῦ κυρίου πάντοτε
  choice: toujours dans l’œuvre du Seigneur
  rationale: Préserve l’étendue de ἔργον et place « toujours » de manière naturelle tout en maintenant sa portée sur l’activité continuelle.
- source_word: εἰδότες
  choice: sachant
  rationale: Conserve le lien participial et laisse ouverte sa nuance circonstancielle, notamment causale.
- source_word: ὁ κόπος ὑμῶν
  choice: votre peine
  rationale: « Peine » évoque l’effort pénible et fatigant contenu dans κόπος, davantage que le simple « travail ».
- source_word: οὐκ ἔστιν κενὸς
  choice: n’est pas vaine
  rationale: Formulation française idiomatique pour une peine qui n’est ni vide de sens ni sans résultat.
- source_word: ἐν κυρίῳ
  choice: dans le Seigneur
  rationale: Maintient la formulation paulinienne et sa richesse relationnelle sans la réduire à « grâce au Seigneur » ou à une paraphrase particulière.
theological_decisions:
- issue: Portée de ἀδελφοί
  choice: « frères » dans le texte, avec une note indiquant la portée collective possible
  alternative: « frères et sœurs »
  rationale: Le grec emploie un masculin pluriel qui, dans l’adresse à toute l’assemblée, peut inclure les femmes. Le texte conserve la forme tandis que la note en explicite la portée contextuelle.
- issue: Rattachement de ἐν κυρίῳ
  choice: « votre peine dans le Seigneur n’est pas vaine »
  alternative: « votre peine n’est pas vaine grâce au Seigneur »
  rationale: Le rattachement à la peine des croyants est naturel dans l’usage paulinien et préserve la largeur théologique de l’expression.
- issue: Traduction de κύριος
  choice: Seigneur
  alternative: Maître
  rationale: « Seigneur » est l’équivalent usuel dans ce contexte christologique et ne requiert aucune précision interprétative supplémentaire.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve la progression exhortation–motif de l’original, ainsi que la répétition théologiquement significative de « Seigneur ».
