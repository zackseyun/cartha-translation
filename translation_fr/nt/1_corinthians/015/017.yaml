id: 1CO.15.17
reference: 1 Corinthians 15:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἰ δὲ Χριστὸς οὐκ ἐγήγερται, ματαία ἡ πίστις ⸀ὑμῶν, ἔτι ἐστὲ ἐν ταῖς ἁμαρτίαις ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/017.yaml
  text: But if Messiah has not been raised[a], your faith is futile[b]; you are still in your sins.
translation:
  language: fr
  text: 'Mais si le Messie[a] n’a pas été ressuscité, votre foi est vaine[b] : vous êtes encore dans vos péchés.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le Christ ».
    reason: alternative_reading
  - marker: b
    text: Ou « inutile » ou « sans effet ».
    reason: lexical_alternative
lexical_decisions:
- source_word: Χριστὸς
  choice: le Messie
  rationale: Le terme grec est rendu comme un titre messianique. « Le Messie » est clair en français moderne et conserve le sens de l’Oint; « le Christ » est signalé en note comme formulation traditionnelle possible.
- source_word: ἐγήγερται
  choice: n’a pas été ressuscité
  rationale: Le parfait passif grec est rendu par un passé composé passif, qui exprime l’événement accompli et ses conséquences présentes sans nommer explicitement l’agent.
- source_word: ματαία
  choice: vaine
  rationale: « Vaine » exprime ici une foi dépourvue d’efficacité et de fondement dans l’hypothèse envisagée. Le mot demeure naturel dans un registre biblique digne; « inutile » est donné comme possibilité plus courante.
- source_word: πίστις
  choice: foi
  rationale: Dans ce contexte, πίστις désigne la foi des Corinthiens, c’est-à-dire leur adhésion croyante, plutôt que leur fidélité.
- source_word: ἔτι
  choice: encore
  rationale: « Encore » rend naturellement la persistance de leur état si le Messie n’a pas été ressuscité.
- source_word: ἐν ταῖς ἁμαρτίαις ὑμῶν
  choice: dans vos péchés
  rationale: La formulation conserve l’image grecque et l’expression théologique selon laquelle ils demeureraient dans la condition liée à leurs péchés.
- source_word: δὲ
  choice: Mais
  rationale: La conjonction marque ici le contraste avec l’argument précédent.
theological_decisions:
- issue: Formulation de la résurrection et agent implicite
  choice: n’a pas été ressuscité
  alternative: n’est pas ressuscité
  rationale: La tournure passive respecte la forme grecque et laisse implicite l’agent de la résurrection, comme dans le texte source. Elle évite aussi de transformer silencieusement la proposition en un actif réfléchi ou intransitif.
- issue: Traduction de Χριστός
  choice: le Messie
  alternative: le Christ
  rationale: Dans cette affirmation théologique, Χριστός garde sa valeur de titre désignant l’Oint. La variante traditionnelle française est conservée en note sans remplacer le sens titulaire dans le texte principal.
translation_notes:
  register: Français international moderne, sobre et digne. La ponctuation avec deux-points fait ressortir que la dernière proposition explicite la conséquence de la foi vaine dans l’hypothèse formulée, sans ajouter de lien absent du raisonnement grec.
