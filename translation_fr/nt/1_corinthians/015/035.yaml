  text: But someone will say[a], “How are the dead raised, and with what kind of body do they come?”
translation:
  language: fr
  text: 'Mais quelqu’un dira : « Comment les morts sont-ils ressuscités, et avec quelle sorte de corps viennent-ils ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀλλὰ
  choice: Mais
  rationale: Introduit naturellement en français l’objection ou la question anticipée, avec la valeur contrastive du grec.
- source_word: ἐρεῖ τις
  choice: quelqu’un dira
  rationale: Conserve le futur de l’indicatif et la formulation rhétorique avec un interlocuteur indéfini.
- source_word: Πῶς ἐγείρονται οἱ νεκροί
  choice: Comment les morts sont-ils ressuscités
  rationale: Rend directement l’interrogatif et maintient la voix passive de ἐγείρονται, sans expliciter l’agent.
- source_word: ποίῳ ... σώματι
  choice: avec quelle sorte de corps
  rationale: « Quelle sorte de » restitue la valeur qualitative de ποίῳ, tandis que « avec » rend naturellement le datif.
- source_word: δὲ
  choice: et
  rationale: Relie ici les deux questions sans imposer une opposition plus forte que celle du grec.
- source_word: ἔρχονται
  choice: viennent-ils
  rationale: Préserve le verbe grec distinct de celui de la résurrection, sans le paraphraser par « apparaissent-ils » ou « ressuscitent-ils ».
theological_decisions:
- issue: Formulation de la résurrection et agent implicite
  choice: les morts sont-ils ressuscités
  alternative: les morts ressuscitent-ils
  rationale: La voix passive du grec est conservée afin de laisser ouverte la résonance d’une action divine, sans nommer un agent que ce verset ne précise pas.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. La syntaxe interrogative avec inversion garde un ton digne et naturel. Aucune note n’est nécessaire, puisque le texte français peut conserver directement la voix passive et son ambiguïté théologique.
