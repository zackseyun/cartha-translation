  text: εἴτε οὖν ἐγὼ εἴτε ἐκεῖνοι, οὕτως κηρύσσομεν καὶ οὕτως ἐπιστεύσατε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/011.yaml
  text: Whether then it was I or they[a], so we proclaim and so you believed.
translation:
  language: fr
  text: Ainsi donc, que ce soit moi ou eux, voilà ce que nous proclamons, et voilà ce que vous avez cru.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἴτε οὖν ἐγὼ εἴτε ἐκεῖνοι
  choice: Ainsi donc, que ce soit moi ou eux
  rationale: La tournure française conserve l’alternative corrélative entre Paul et les autres témoins, tandis que « ainsi donc » marque la conclusion tirée du contexte précédent.
- source_word: οὕτως κηρύσσομεν
  choice: voilà ce que nous proclamons
  rationale: « Voilà ce que » renvoie naturellement en français au contenu de l’annonce qui vient d’être résumé; « proclamons » garde l’idée d’une annonce publique portée par κηρύσσω.
- source_word: καὶ οὕτως ἐπιστεύσατε
  choice: et voilà ce que vous avez cru
  rationale: La reprise identique de « voilà ce que » reflète la répétition de οὕτως et relie étroitement le message proclamé au message accueilli par la foi. Le passé composé exprime naturellement l’acte passé désigné par l’aoriste.
theological_decisions:
- issue: Portée de l’unité de la proclamation apostolique
  choice: Paul affirme que, qu’elle vienne de lui ou des autres apôtres évoqués dans le contexte, la proclamation a le même contenu, celui que les Corinthiens ont cru.
  alternative: 'Comprendre οὕτως principalement comme une indication de manière : « c’est ainsi que nous prêchons et c’est ainsi que vous avez cru ».'
  rationale: Le double οὕτως peut concerner le contenu ou la manière. La traduction choisie exprime le renvoi au message résumé en 15.1-10 tout en évitant d’ajouter des conclusions ecclésiologiques que le verset ne formule pas.
translation_notes:
  register: Français international moderne, clair et digne. « Que ce soit moi ou eux » est idiomatique sans effacer le contraste grec; la répétition volontaire de « voilà ce que » préserve le parallélisme du texte source.
