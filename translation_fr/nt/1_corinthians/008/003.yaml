id: 1CO.8.3
reference: 1 Corinthians 8:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἰ δέ τις ἀγαπᾷ τὸν θεόν, οὗτος ἔγνωσται ὑπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/003.yaml
  text: But if anyone loves God[a], this one is known by him.
translation:
  language: fr
  text: Mais si quelqu’un aime Dieu, celui-là est connu de lui.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « est reconnu par lui » ou « a été connu de lui ». Le parfait passif grec peut évoquer l’état durable de quelqu’un qui est connu de Dieu.
    reason: Alternative lexicale et valeur aspectuelle du parfait passif grec.
lexical_decisions:
- source_word: εἰ δέ
  choice: Mais si
  rationale: εἰ introduit la condition, tandis que δέ marque un léger contraste avec l’opposition précédente entre la connaissance qui enfle d’orgueil et l’amour qui construit.
- source_word: τις
  choice: quelqu’un
  rationale: Le pronom indéfini a ici une portée générale et inclusive; « quelqu’un » est naturel en français moderne.
- source_word: ἀγαπᾷ
  choice: aime
  rationale: Le présent actif est rendu directement par « aime », terme courant et fidèle au champ lexical de l’amour.
- source_word: τὸν θεόν
  choice: Dieu
  rationale: En français, le nom propre divin s’emploie naturellement sans article dans cette construction.
- source_word: οὗτος
  choice: celui-là
  rationale: Le démonstratif reprend avec une certaine insistance la personne qui vient d’être décrite; « celui-là » conserve mieux cette mise en relief qu’un simple pronom.
- source_word: ἔγνωσται
  choice: est connu
  rationale: Le parfait passif exprime un état présent résultant d’une action accomplie. « Est connu » reste idiomatique tout en préservant la portée relationnelle possible du verbe.
- source_word: ὑπ’ αὐτοῦ
  choice: de lui
  rationale: Le pronom renvoie naturellement à Dieu. Après un passif exprimant la connaissance, « connu de lui » est une tournure française naturelle et conserve la reprise pronominale du grec.
theological_decisions:
- issue: Portée de la connaissance divine dans l’affirmation de Paul
  choice: « est connu de lui », formulation large pouvant inclure une reconnaissance relationnelle
  alternative: « est reconnu par lui », « est approuvé par lui » ou « a été connu de lui »
  rationale: Avec Dieu comme agent, γινώσκω peut dépasser la simple connaissance factuelle et évoquer une reconnaissance relationnelle ou favorable. Le grec n’impose toutefois pas une précision doctrinale plus étroite; la traduction maintient donc cette ampleur et cette tension.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation conserve le contraste, l’insistance du démonstratif et l’ambiguïté théologique de la connaissance divine sans ajouter d’interprétation confessionnelle.
