id: 1CO.8.13
reference: 1 Corinthians 8:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: διόπερ εἰ βρῶμα σκανδαλίζει τὸν ἀδελφόν μου, οὐ μὴ φάγω κρέα εἰς τὸν αἰῶνα, ἵνα μὴ τὸν ἀδελφόν μου σκανδαλίσω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/013.yaml
  text: Therefore, if food causes my brother to stumble, I will certainly never eat meat forever, so that I may not cause my brother to stumble.
translation:
  language: fr
  text: C’est pourquoi, si un aliment fait tomber mon frère, je ne mangerai plus jamais de viande, afin de ne pas faire tomber mon frère.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βρῶμα
  choice: un aliment
  rationale: Terme général désignant ce qui se mange; « aliment » conserve la distinction avec κρέα, « viande », dans la proposition principale.
- source_word: σκανδαλίζει / σκανδαλίσω
  choice: fait tomber / faire tomber
  rationale: Dans ce contexte, le verbe évoque le fait d’entraîner un autre croyant dans une chute morale ou spirituelle. La répétition française reflète celle du grec.
- source_word: τὸν ἀδελφόν μου
  choice: mon frère
  rationale: Rend directement l’expression grecque et désigne ici un membre de la communauté croyante sans ajouter d’explication dans le texte.
- source_word: οὐ μὴ φάγω
  choice: je ne mangerai plus jamais
  rationale: La double négation avec le subjonctif exprime une résolution future particulièrement ferme.
- source_word: κρέα
  choice: de viande
  rationale: Le pluriel grec désigne ici la viande comme catégorie alimentaire; le singulier collectif est naturel en français.
- source_word: εἰς τὸν αἰῶνα
  choice: jamais
  rationale: 'Dans une proposition négative, l’expression idiomatique renforce la durée sans limite: « ne… jamais ». « Plus jamais » exprime naturellement en français la renonciation définitive envisagée.'
- source_word: ἵνα μὴ
  choice: afin de ne pas
  rationale: Conserve explicitement la valeur finale de la proposition grecque.
theological_decisions:
- issue: Nature de la chute exprimée par σκανδαλίζω
  choice: faire tomber
  alternative: être une occasion de péché pour
  rationale: « Faire tomber » préserve l’image et la portée morale du verbe sans préciser au-delà du contexte la forme exacte de la chute.
- issue: Portée de la renonciation
  choice: je ne mangerai plus jamais de viande
  alternative: je ne mangerai pas de viande pour toujours
  rationale: Le grec formule une résolution emphatique et illimitée. La tournure retenue est idiomatique en français et ne réduit pas cette force, tout en laissant la condition initiale gouverner l’engagement.
translation_notes:
  register: Français international moderne, clair et digne. La structure conditionnelle, la répétition de « mon frère » et le contraste entre l’aliment en général et la viande sont conservés. Aucun marqueur de note n’est requis.
