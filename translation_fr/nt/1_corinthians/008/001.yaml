source:
  edition: SBLGNT
  text: Περὶ δὲ τῶν εἰδωλοθύτων, οἴδαμεν ὅτι πάντες γνῶσιν ἔχομεν. ἡ γνῶσις φυσιοῖ, ἡ δὲ ἀγάπη οἰκοδομεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/001.yaml
  text: 'Concerning food sacrificed to idols: we know that we all have knowledge[a]. Knowledge puffs up[b], but love builds up.'
translation:
  language: fr
  text: 'Au sujet des aliments sacrifiés aux idoles : nous savons que nous avons tous de la connaissance[a]. La connaissance gonfle d’orgueil, mais l’amour édifie.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « de la viande offerte aux idoles » ou « des choses sacrifiées aux idoles ». La proposition « nous avons tous de la connaissance » est peut-être une formule employée par certains Corinthiens et reprise ici par Paul.'
    reason: alternative_reading
lexical_decisions:
- source_word: Περὶ δὲ
  choice: Au sujet de
  rationale: Introduit naturellement en français moderne un nouveau sujet, sans ajouter une valeur temporelle absente du grec.
- source_word: τῶν εἰδωλοθύτων
  choice: des aliments sacrifiés aux idoles
  rationale: Rend clairement la réalité cultuelle visée sans limiter indûment le terme à la viande.
- source_word: οἴδαμεν
  choice: nous savons
  rationale: Traduction directe et idiomatique du parfait grec employé avec un sens présent.
- source_word: ὅτι πάντες γνῶσιν ἔχομεν
  choice: que « nous avons tous de la connaissance »
  rationale: Préserve l’affirmation et le lien lexical avec la phrase suivante. Les guillemets signalent prudemment la possibilité d’une formule corinthienne sans trancher la question.
- source_word: ἡ γνῶσις
  choice: La connaissance
  rationale: Maintient la reprise exacte de γνῶσιν et le contraste avec l’amour.
- source_word: φυσιοῖ
  choice: gonfle d’orgueil
  rationale: Conserve l’image de l’enflure tout en explicitant naturellement en français sa portée morale.
- source_word: ἡ δὲ ἀγάπη
  choice: mais l’amour
  rationale: Rend le contraste et le sens générique de ἀγάπη dans un français courant et digne.
- source_word: οἰκοδομεῖ
  choice: construit
  rationale: Préserve la métaphore architecturale de Paul; le verbe transitif absolu reste compréhensible et laisse ouverte la question de l’objet construit.
theological_decisions:
- issue: Portée rhétorique de « nous avons tous de la connaissance »
  choice: Conserver la première personne du pluriel et placer la proposition entre guillemets, avec une note signalant l’incertitude.
  alternative: 'Traduire sans guillemets comme une affirmation directe de Paul : « nous savons que nous avons tous de la connaissance ».'
  rationale: Le texte grec ne comporte pas de marque explicite de citation, mais le contexte permet d’y voir une formule corinthienne reprise par Paul. La formulation et la note préservent cette ambiguïté sans imposer une résolution doctrinale.
- issue: Objet implicite de οἰκοδομεῖ
  choice: Traduire simplement « construit ».
  alternative: « fait grandir les autres » ou « édifie ».
  rationale: Le grec ne précise pas ici l’objet. Garder la métaphore sans complément évite d’ajouter une interprétation, tandis que « édifie » serait moins transparent pour de nombreux lecteurs modernes.
translation_notes:
  register: Français international moderne, naturel et digne. « Aliments » est plus large et plus courant que « viandes »; « gonfle d’orgueil » conserve l’image grecque tout en restant immédiatement intelligible; « construit » maintient volontairement la métaphore et l’absence de complément du texte source.
