  text: ⸀εἴ τις δοκεῖ ⸀ἐγνωκέναι τι, ⸀οὔπω ⸀ἔγνω καθὼς δεῖ γνῶναι·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/002.yaml
  text: If anyone thinks he knows something[a], he does not yet know as he ought to know.
translation:
  language: fr
  text: Si quelqu’un pense connaître quelque chose[a], il ne connaît pas encore comme il faut connaître.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Si quelqu’un pense être parvenu à connaître quoi que ce soit, il n’a pas encore connu de la manière dont il faut connaître. »'
    reason: La variante explicite davantage la valeur du parfait ἐγνωκέναι et reproduit plus formellement les formes verbales grecques, au prix d’un français moins fluide.
lexical_decisions:
- source_word: εἴ τις
  choice: Si quelqu’un
  rationale: Rend naturellement la condition et la portée générale du pronom indéfini singulier.
- source_word: δοκεῖ
  choice: pense
  rationale: Exprime ici l’estimation subjective et possiblement trop assurée de son propre savoir.
- source_word: ἐγνωκέναι τι
  choice: connaître quelque chose
  rationale: Le présent français est idiomatique après « pense » et exprime l’état de connaissance revendiqué; « quelque chose » conserve l’objet indéfini.
- source_word: οὔπω ἔγνω
  choice: il ne connaît pas encore
  rationale: « Pas encore » préserve la nuance d’un état incomplet; le présent convient à la portée évaluative de l’aoriste dans cette formulation.
- source_word: καθὼς δεῖ γνῶναι
  choice: comme il faut connaître
  rationale: Conserve la nuance de manière ou de norme portée par καθὼς et la nécessité exprimée par δεῖ, sans préciser indûment l’objet de la connaissance.
theological_decisions:
- issue: Portée générique du singulier
  choice: « quelqu’un… il »
  alternative: « ceux qui… ils » ou une reformulation au pluriel
  rationale: Le grec emploie le singulier indéfini τις avec une portée générale. Le français permet ici une reprise singulière naturelle, sans limiter le propos aux hommes.
- issue: Nature de la critique de Paul
  choice: Une connaissance encore inadéquate dans sa manière
  alternative: Une négation absolue de toute connaissance humaine
  rationale: La proposition finale fixe une norme quant à la manière dont il faut connaître. La traduction maintient donc la tension du texte sans transformer l’avertissement contre la présomption en rejet de toute connaissance.
- issue: Valeur aspectuelle de ἐγνωκέναι
  choice: « connaître » dans le texte, avec précision en note
  alternative: « être parvenu à connaître »
  rationale: Le parfait peut évoquer une connaissance acquise et désormais possédée, mais le français courant préfère ici l’infinitif présent. La note conserve l’autre nuance possible.
translation_notes:
  register: Français international moderne, sobre et digne. La répétition de « connaître » est volontaire afin de préserver le jeu lexical du grec. « Comme il faut connaître » conserve l’ambiguïté entre manière et norme, sans ajouter de complément absent du texte.
