id: 1CO.8.9
reference: 1 Corinthians 8:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: βλέπετε δὲ μή πως ἡ ἐξουσία ὑμῶν αὕτη πρόσκομμα γένηται τοῖς ⸀ἀσθενέσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/009.yaml
  text: But take care that this right of yours does not somehow become a stumbling block to the weak[a][b].
translation:
  language: fr
  text: Mais veillez à ce que ce droit que vous avez ne devienne pas, d’une manière ou d’une autre, une occasion de chute pour les faibles[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « cette liberté que vous avez ». Le mot grec peut signifier « autorité », « droit » ou « liberté » ; ici, il désigne la liberté que certains croyants revendiquaient de manger des aliments associés aux idoles.
    reason: lexical_alternative
  - marker: b
    text: Ici, « les faibles » désigne ceux dont la conscience est faible dans ce domaine.
    reason: cultural_note
lexical_decisions:
- source_word: βλέπετε
  choice: veillez
  rationale: L’impératif appelle à la vigilance. « Veillez à ce que » exprime naturellement en français moderne une mise en garde suivie d’un résultat à éviter.
- source_word: δὲ
  choice: Mais
  rationale: Marque ici une légère opposition et le passage de l’affirmation d’un droit à l’avertissement concernant son usage.
- source_word: μή πως
  choice: ne… pas, d’une manière ou d’une autre
  rationale: Rend la précaution négative et la nuance d’éventualité sans donner à entendre que l’issue est certaine.
- source_word: ἡ ἐξουσία ὑμῶν αὕτη
  choice: ce droit que vous avez
  rationale: Dans le contexte, ἐξουσία désigne la liberté ou le droit revendiqué de manger des aliments associés aux idoles. Cette formulation est claire et naturelle, tout en laissant en note l’autre traduction possible « liberté ».
- source_word: πρόσκομμα
  choice: une occasion de chute
  rationale: Préserve l’image d’un obstacle qui amène autrui à tomber moralement ou spirituellement, dans une formulation française courante et digne.
- source_word: γένηται
  choice: devienne
  rationale: Correspond directement au sens de « venir à être, devenir » dans la construction de précaution.
- source_word: τοῖς ἀσθενέσιν
  choice: pour les faibles
  rationale: Conserve l’expression concise du grec. Le contexte et la note précisent qu’il s’agit de personnes dont la conscience est faible dans ce domaine.
theological_decisions:
- issue: Sens de ἐξουσία dans le contexte
  choice: Le droit ou la liberté que certains Corinthiens revendiquaient au sujet des aliments offerts aux idoles.
  alternative: Une autorité ou un pouvoir au sens plus général.
  rationale: Le contexte immédiat de 1 Corinthiens 8 porte sur la conduite permise à ceux qui possèdent cette connaissance. « Droit » exprime l’enjeu éthique concret sans introduire une notion d’autorité institutionnelle.
- issue: Sens de τοῖς ἀσθενέσιν
  choice: Les croyants dont la conscience est faible ou vulnérable dans cette question.
  alternative: Les personnes faibles au sens général ou physique.
  rationale: Dans ce chapitre, la faiblesse est explicitement liée à la conscience. Le texte principal garde toutefois l’expression grecque concise afin de ne pas surinterpréter.
translation_notes:
  register: Français international moderne, naturel et digne. « Veillez à ce que » porte clairement l’avertissement ; « occasion de chute » conserve la métaphore sans employer le calque moins courant « pierre d’achoppement ».
