source:
  edition: SBLGNT
  text: ⸂ἀπόλλυται γὰρ⸃ ὁ ἀσθενῶν ⸀ἐν τῇ σῇ γνώσει, ⸂ὁ ἀδελφὸς⸃ δι’ ὃν Χριστὸς ἀπέθανεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/011.yaml
  text: For the weak one is destroyed by your knowledge—the brother for whom Messiah died[a][b][c].
translation:
  language: fr
  text: Car, par ta connaissance, celui qui est faible court à sa perte — ce frère pour qui le Messie est mort[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « est détruit » ou « périt ». Le grec peut désigner une ruine ou une destruction grave; il ne précise pas à lui seul si Paul parle d’une dévastation spirituelle présente, de la perdition finale ou des deux.
    reason: alternative_reading
  - marker: b
    text: Ici, « frère » désigne un autre croyant; dans ce contexte, l’application peut concerner un frère ou une sœur dans la foi.
    reason: lexical_alternative
  - marker: c
    text: Grec « Christ »; rendu ici par « Messie » parce que Χριστός est employé comme un titre.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπόλλυται
  choice: court à sa perte
  rationale: Cette tournure française exprime au présent un processus ou un résultat de ruine grave, sans décider à elle seule s’il s’agit d’un désastre spirituel temporel, de la perdition finale ou des deux.
- source_word: γάρ
  choice: Car
  rationale: Le connecteur introduit l’explication de l’avertissement formulé au verset précédent.
- source_word: ὁ ἀσθενῶν
  choice: celui qui est faible
  rationale: Le participe substantivé désigne littéralement « celui qui est faible »; cette formulation conserve le singulier sans anticiper le nom « frère » qui vient ensuite.
- source_word: ἐν τῇ σῇ γνώσει
  choice: par ta connaissance
  rationale: 'Dans ce contexte, ἐν marque le moyen ou la sphère causale : c’est l’usage que le destinataire fait de sa connaissance qui nuit au faible.'
- source_word: γνῶσις
  choice: connaissance
  rationale: Ce terme reprend le vocabulaire central du contexte immédiat et maintient l’ironie d’une « connaissance » exercée sans amour.
- source_word: ὁ ἀδελφός
  choice: ce frère
  rationale: Le masculin singulier grec est conservé. Le démonstratif produit en français une apposition naturelle après « celui qui est faible ».
- source_word: δι’ ὃν
  choice: pour qui
  rationale: Avec διά suivi de l’accusatif, l’expression indique ici la personne en faveur de qui le Messie est mort.
- source_word: Χριστός
  choice: le Messie
  rationale: Χριστός fonctionne ici comme un titre et met en relief la portée rédemptrice de sa mort.
- source_word: ἀπέθανεν
  choice: est mort
  rationale: Le passé composé est la manière naturelle de rendre en français l’événement passé exprimé par l’aoriste.
theological_decisions:
- issue: Le degré et la nature de la destruction exprimée par ἀπόλλυται
  choice: court à sa perte
  alternative: est détruit ; périt
  rationale: La formulation principale garde toute la gravité du verbe tout en évitant de trancher la question débattue de savoir si Paul parle d’une dévastation spirituelle présente, de la perdition eschatologique ou des deux. Les rendus plus directs figurent en note.
- issue: La portée du masculin ἀδελφός
  choice: ce frère
  alternative: ce frère ou cette sœur ; ce croyant
  rationale: Le texte principal reflète le masculin singulier de la source, tandis que la note précise qu’il s’agit d’un membre de la communauté croyante et que l’application peut inclure une femme.
- issue: La valeur de Χριστός
  choice: le Messie
  alternative: le Christ
  rationale: Le terme grec est ici compris comme un titre. « Messie » rend explicitement sa valeur titulaire sans introduire une doctrine confessionnelle particulière.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la progression argumentative de l’original, ainsi que l’apposition emphatique qui identifie la personne faible comme le frère pour qui le Messie est mort. Le tiret met en relief cette dernière proposition sans alourdir la syntaxe.
