source:
  edition: SBLGNT
  text: Περὶ τῆς βρώσεως οὖν τῶν εἰδωλοθύτων οἴδαμεν ὅτι οὐδὲν εἴδωλον ἐν κόσμῳ, καὶ ὅτι οὐδεὶς ⸀θεὸς εἰ μὴ εἷς.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/004.yaml
  text: Therefore[a], concerning the eating of food sacrificed to idols, we know that an idol is nothing in the world[b], and that there is no God except one.
translation:
  language: fr
  text: Donc, pour ce qui est de manger des aliments sacrifiés aux idoles, nous savons qu’une idole n’est rien dans le monde[a] et qu’il n’y a aucun dieu, si ce n’est un seul[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « une idole n’a aucune existence réelle dans le monde ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « il n’y a de Dieu qu’un seul ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: βρώσεως
  choice: manger
  rationale: Le nom désigne l’acte de manger. La tournure « pour ce qui est de manger » en conserve le sens verbal dans un français naturel.
- source_word: εἰδωλοθύτων
  choice: des aliments sacrifiés aux idoles
  rationale: Le terme désigne des aliments liés à des sacrifices païens; « aliments » évite de limiter indûment le sens à la viande.
- source_word: οἴδαμεν
  choice: nous savons
  rationale: Cette traduction directe conserve l’appel rhétorique de Paul à un savoir partagé.
- source_word: οὐδὲν εἴδωλον
  choice: une idole n’est rien
  rationale: La formulation garde la force concise et l’ambiguïté du grec entre nullité et absence d’existence réelle.
- source_word: ἐν κόσμῳ
  choice: dans le monde
  rationale: Cette expression naturelle rend le domaine de la réalité créée évoqué par κόσμος.
- source_word: οὐδεὶς θεὸς εἰ μὴ εἷς
  choice: il n’y a aucun dieu, si ce n’est un seul
  rationale: Cette formulation préserve l’assertion monothéiste tout en maintenant l’indétermination grammaticale de θεός et la structure restrictive du grec.
- source_word: οὖν
  choice: Donc
  rationale: « Donc » marque clairement et naturellement la transition inférentielle depuis le raisonnement précédent.
theological_decisions:
- issue: La nullité de l’idole
  choice: « une idole n’est rien dans le monde »
  alternative: « une idole n’a aucune existence réelle dans le monde »
  rationale: Le texte principal conserve la formulation compacte et sa tension possible entre inexistence réelle et nullité, sans imposer une explication métaphysique.
- issue: L’affirmation monothéiste
  choice: « il n’y a aucun dieu, si ce n’est un seul »
  alternative: « il n’y a pas d’autre Dieu que le Dieu unique »
  rationale: La traduction choisie affirme nettement l’unicité divine sans ajouter « autre », répéter « Dieu » ni expliciter une formulation théologique ultérieure absente du grec.
translation_notes:
  register: Français international moderne, digne et accessible. « Pour ce qui est de » rend naturellement περὶ avec le nom verbal; « aliments » reste plus large que « viande ». La minuscule à « dieu » dans la formulation principale permet de préserver la construction grecque et son contraste avec les prétendues divinités, tandis que la note donne la lecture référant explicitement au Dieu unique.
