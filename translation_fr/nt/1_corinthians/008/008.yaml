  text: βρῶμα δὲ ἡμᾶς οὐ ⸀παραστήσει τῷ θεῷ· οὔτε ⸂γὰρ ἐὰν φάγωμεν, περισσεύομεν, οὔτε ἐὰν μὴ φάγωμεν, ὑστερούμεθα⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/008.yaml
  text: But food will not commend us to God[a]; for neither if we eat do we abound[b], nor if we do not eat do we lack.
translation:
  language: fr
  text: 'Mais la nourriture ne nous rapprochera pas de Dieu[a] : en effet, si nous mangeons, nous n’avons rien de plus, et si nous ne mangeons pas, nous n’avons rien de moins[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « la nourriture ne nous présentera pas à Dieu »; ou encore : « ne nous rendra pas agréables à Dieu ».'
    reason: lexical_alternative
  - marker: b
    text: 'Autre traduction : « si nous mangeons, nous ne sommes pas mieux lotis, et si nous ne mangeons pas, nous ne sommes pas moins bien lotis ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: βρῶμα
  choice: la nourriture
  rationale: Le terme désigne la nourriture en général, et non spécialement la viande ou un repas particulier.
- source_word: παραστήσει
  choice: ne nous rapprochera pas
  rationale: Dans ce contexte, cette formulation naturelle exprime que la nourriture ne procure pas un meilleur accès ni une meilleure position auprès de Dieu, tout en signalant en note le sens plus formel de « présenter ».
- source_word: τῷ θεῷ
  choice: de Dieu
  rationale: La préposition exigée par « rapprocher » rend naturellement le datif grec et conserve l’orientation vers Dieu.
- source_word: οὔτε γὰρ ἐὰν φάγωμεν, περισσεύομεν
  choice: en effet, si nous mangeons, nous n’avons rien de plus
  rationale: περισσεύω indique ici un surplus ou un avantage; « rien de plus » garde cette image sans préciser abusivement s’il s’agit d’un mérite ou d’un bénéfice spirituel.
- source_word: οὔτε ἐὰν μὴ φάγωμεν, ὑστερούμεθα
  choice: et si nous ne mangeons pas, nous ne manquons de rien
  rationale: Cette traduction conserve le sens de manque ou de déficit exprimé par ὑστερέω et forme un parallèle clair avec « rien de plus ».
- source_word: δὲ
  choice: Mais
  rationale: Le connecteur marque un contraste modéré avec ce qui précède.
- source_word: γὰρ
  choice: en effet
  rationale: Cette locution introduit naturellement en français l’explication de l’affirmation précédente.
theological_decisions:
- issue: La nourriture concerne-t-elle ici l’accès à Dieu, l’approbation divine ou plus généralement un avantage spirituel ?
  choice: Dire qu’elle ne « nous rapprochera pas de Dieu », sans définir davantage la nature de cette proximité.
  alternative: « La nourriture ne nous présentera pas à Dieu » ou « ne nous rendra pas agréables à Dieu ».
  rationale: Le verbe peut évoquer le fait de présenter quelqu’un devant Dieu, tandis que le contexte porte sur la valeur spirituelle du fait de manger ou de s’abstenir. La formulation retenue communique l’enjeu relationnel sans affirmer que Paul traite exclusivement de justification, d’acceptabilité rituelle ou de mérite.
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme des deux conditions est conservé, tandis que « en effet » rend l’explication plus naturelle qu’un « car » placé dans une structure négative corrélative lourde.
