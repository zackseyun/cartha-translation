    issue: La dernière proposition « nous ne manquons de rien » élargit légèrement le sens.
    rationale: ὑστερούμεθα exprime ici l’absence de déficit ou de désavantage corrélatif au « rien de plus » précédent, non une affirmation générale selon laquelle les personnes ne manquent de rien. « Nous n’avons rien de moins » préserve cette opposition.
