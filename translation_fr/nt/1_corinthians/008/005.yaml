  naturalness: La révision emploie un français international moderne et fluide. « Des êtres qu’on appelle des dieux » est naturel dans ce contexte et évite la tournure moins idiomatique « il existe de prétendus dieux ».
  terminology: '« Dieux » et « seigneurs » en minuscules conservent les pluriels θεοί et κύριοι sans les confondre avec Dieu et le Seigneur du verset 6. Les guillemets ne sont pas nécessaires dans la seconde occurrence : le grec ne les marque pas et le contexte, ainsi que la note, suffit à signaler le statut de titres attribués.'
