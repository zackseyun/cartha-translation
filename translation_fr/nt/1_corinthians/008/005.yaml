id: 1CO.8.5
reference: 1 Corinthians 8:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ γὰρ εἴπερ εἰσὶν λεγόμενοι θεοὶ εἴτε ἐν οὐρανῷ εἴτε ἐπὶ γῆς, ὥσπερ εἰσὶν θεοὶ πολλοὶ καὶ κύριοι πολλοί,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/005.yaml
  text: For even if there are so-called gods[b][a], whether in heaven or on earth—as indeed there are many gods and many lords—
translation:
  language: fr
  text: Car même s’il y a des êtres qu’on appelle des dieux[a], soit dans le ciel, soit sur la terre — comme il y a, en effet, beaucoup de dieux et beaucoup de seigneurs[b] —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « de prétendus dieux ». Le participe grec signifie littéralement « appelés » ; dans ce contexte, il peut aussi marquer la distance de Paul envers ces divinités alléguées.'
    reason: lexical_alternative
  - marker: b
    text: « Seigneurs » traduit ici le pluriel du même mot grec souvent rendu par « Seigneur ». Il désigne les nombreux êtres ou pouvoirs auxquels ce titre est attribué, et non le seul Seigneur mentionné au verset 6.
    reason: cross_reference
lexical_decisions:
- source_word: καὶ γὰρ
  choice: Car même
  rationale: « Car » conserve le lien explicatif de γάρ avec le verset précédent, tandis que « même » rend l’accent ajouté par καί.
- source_word: εἴπερ
  choice: même s’il existe
  rationale: La tournure concessive française exprime naturellement l’hypothèse admise pour les besoins du raisonnement, sans la transformer en affirmation théologique.
- source_word: λεγόμενοι θεοὶ
  choice: de prétendus dieux
  rationale: 'Cette expression marque la distance de Paul envers ceux qui reçoivent le nom de dieux, tout en gardant en note l’autre valeur possible du participe : « appelés dieux ».'
- source_word: εἴτε ἐν οὐρανῷ εἴτε ἐπὶ γῆς
  choice: soit dans le ciel, soit sur la terre
  rationale: La construction corrélative restitue les deux domaines envisagés et demeure naturelle en français moderne.
- source_word: ὥσπερ
  choice: et de fait
  rationale: Dans ce contexte, l’expression introduit la reconnaissance parenthétique qu’il existe effectivement de nombreux êtres ou pouvoirs auxquels ces titres sont attribués.
- source_word: θεοὶ πολλοὶ καὶ κύριοι πολλοί
  choice: beaucoup de « dieux » et beaucoup de « seigneurs »
  rationale: La répétition de « beaucoup » conserve le parallélisme grec. Les guillemets signalent qu’il s’agit de titres reconnus ou revendiqués, sans identifier ces êtres au Dieu unique et au seul Seigneur du verset 6.
theological_decisions:
- issue: Distance rhétorique de Paul envers les divinités païennes
  choice: Traduire λεγόμενοι θεοὶ par « de prétendus dieux »
  alternative: « ceux qu’on appelle des dieux » ou « des dieux ainsi nommés »
  rationale: Le contexte des versets 4 à 6 distingue ces divinités alléguées du Dieu unique. « Prétendus » rend cette distance, tandis que la note préserve l’ambiguïté lexicale du participe.
- issue: Emploi de κύριοι au pluriel face au seul Seigneur du verset 6
  choice: Employer « seigneurs » en minuscule et entre guillemets
  alternative: « maîtres »
  rationale: « Seigneurs » maintient le lien lexical avec κύριος sans confondre ces multiples titulaires avec le seul Seigneur confessé au verset suivant. « Maîtres » affaiblirait le possible sens religieux ou cosmique.
- issue: Statut des nombreux dieux et seigneurs
  choice: Conserver « de fait il y a » tout en marquant les titres par des guillemets
  alternative: 'Paraphraser : « beaucoup sont considérés comme des dieux et des seigneurs »'
  rationale: Le grec affirme littéralement qu’il y en a beaucoup, mais le contexte et λεγόμενοι portent sur leur désignation. Cette formulation garde la tension rhétorique sans affirmer qu’ils possèdent la même divinité que le Dieu unique.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase conserve le mouvement explicatif et concessif du grec, ainsi que l’incise finale. Les guillemets français clarifient la valeur de titres attribués sans effacer la tension entre l’existence de nombreux prétendants ou puissances reconnus et la confession du verset suivant.
