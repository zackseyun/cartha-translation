source:
  edition: SBLGNT
  text: ἐὰν γάρ τις ἴδῃ σὲ τὸν ἔχοντα γνῶσιν ἐν εἰδωλείῳ κατακείμενον, οὐχὶ ἡ συνείδησις αὐτοῦ ἀσθενοῦς ὄντος οἰκοδομηθήσεται εἰς τὸ τὰ εἰδωλόθυτα ἐσθίειν;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/010.yaml
  text: For if someone sees you[a], who have knowledge, reclining in an idol’s temple, will not his conscience, being weak, be built up to eat food sacrificed to idols?
translation:
  language: fr
  text: Car, si quelqu’un te voit, toi qui as de la connaissance, installé à table dans un temple d’idoles, la conscience de cet homme, qui est faible, ne sera-t-elle pas édifiée[a] au point de le pousser à manger des aliments sacrifiés aux idoles ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « encouragée » ou « enhardie ». Le grec dit littéralement « édifiée » : Paul emploie ici son vocabulaire habituel de l’édification, probablement avec ironie.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γάρ
  choice: En effet
  rationale: Introduit l’explication qui justifie l’avertissement précédent et maintient clairement le mouvement argumentatif.
- source_word: τις
  choice: quelqu’un
  rationale: Conserve le caractère indéfini et hypothétique de la personne observatrice.
- source_word: ἴδῃ
  choice: voit
  rationale: Avec ἐὰν, le subjonctif aoriste forme une condition éventuelle que le présent français rend naturellement après « si ».
- source_word: σὲ τὸν ἔχοντα γνῶσιν
  choice: te voit, toi qui as de la connaissance
  rationale: La reprise par « toi » restitue l’insistance de la construction grecque, tandis que « connaissance » préserve le terme clé du chapitre.
- source_word: ἐν εἰδωλείῳ
  choice: dans un temple d’idole
  rationale: Désigne un sanctuaire associé au culte d’une idole, sans préciser davantage la nature du lieu.
- source_word: κατακείμενον
  choice: installé à table
  rationale: Exprime naturellement en français la posture de quelqu’un qui prend part à un repas, sans imposer l’image peu idiomatique de la position allongée.
- source_word: ἡ συνείδησις αὐτοῦ ἀσθενοῦς ὄντος
  choice: sa conscience, qui est faible
  rationale: Maintient la conscience comme sujet grammatical et conserve le lien entre sa faiblesse et la personne qui observe.
- source_word: οἰκοδομηθήσεται
  choice: sera-t-elle édifiée
  rationale: Conserve le verbe habituel de l’édification chez Paul et son emploi probablement ironique ici, malgré le résultat nuisible.
- source_word: εἰς τὸ τὰ εἰδωλόθυτα ἐσθίειν
  choice: si bien qu’il mangera des viandes sacrifiées aux idoles
  rationale: Rend la conséquence ou la tendance exprimée par εἰς τό avec l’infinitif, tout en indiquant sans ambiguïté que c’est la personne, non sa conscience, qui mange.
theological_decisions:
- issue: Sens d’οἰκοδομηθήσεται dans le contexte d’une imitation spirituellement nuisible
  choice: sera-t-elle édifiée
  alternative: sera-t-elle encouragée / enhardie
  rationale: Le grec emploie le vocabulaire paulinien normal de l’édification, vraisemblablement avec une pointe d’ironie. Le conserver évite d’effacer cette tension, tandis que la note donne le sens idiomatique probable.
translation_notes:
  register: Français international actuel, digne et accessible. « Installé à table » privilégie l’image fonctionnelle du repas plutôt qu’un calque de la posture antique. La formulation garde la question rhétorique et le vocabulaire thématique de la connaissance et de l’édification.
