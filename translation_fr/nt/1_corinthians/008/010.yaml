revisions:
- from: En effet, si quelqu’un te voit, toi qui as de la connaissance, installé à table dans un temple d’idole, sa conscience, qui est faible, ne sera-t-elle pas édifiée[a], si bien qu’il mangera des viandes sacrifiées aux idoles ?
  to: Car, si quelqu’un te voit, toi qui as de la connaissance, installé à table dans un temple d’idoles, la conscience de cet homme, qui est faible, ne sera-t-elle pas édifiée[a] au point de le pousser à manger des aliments sacrifiés aux idoles ?
  rationale: La révision améliore l’idiome français et restitue plus précisément le lien entre la conscience du croyant faible et l’acte de manger, sans résoudre l’ironie de « édifiée » par une paraphrase dans le texte principal.
  reviewer_model: gpt-5.6-terra
