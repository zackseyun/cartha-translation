review_pass:
  verdict: revise
  source_fidelity: Le sens général, la question rhétorique et l’ironie vraisemblable d’οἰκοδομηθήσεται sont bien rendus. Toutefois, « si bien qu’il mangera » transforme la construction εἰς τὸ + infinitif, qui exprime l’aboutissement ou l’incitation, en une prédiction directe. Une formulation explicitant que la conscience conduit cet homme à manger reflète plus exactement le grec.
  naturalness: « Temple d’idole » est peu idiomatique en français actuel; « temple d’idoles » est plus naturel dans ce contexte cultuel. « Aliments sacrifiés aux idoles » est plus large et plus fidèle à εἰδωλόθυτα que « viandes », qui restreint indûment le référent.
  terminology: « Connaissance » et « édifiée » préservent les termes thématiques du chapitre et de Paul. La note maintient utilement l’alternative idiomatique sans effacer le lexique d’édification du texte.
  issues:
  - severity: medium
    issue: « si bien qu’il mangera »
    rationale: Cette tournure présente l’action comme une conséquence future assurée et détache l’acte de la conscience. Le grec décrit la conscience du faible comme « édifiée » en vue de/au point de le conduire à manger.
  - severity: low
    issue: « dans un temple d’idole »
    rationale: La formulation est inhabituelle; « dans un temple d’idoles » est plus idiomatique et rend naturellement le cadre idolâtre générique.
  - severity: low
    issue: « viandes sacrifiées aux idoles »
    rationale: εἰδωλόθυτα désigne les aliments/choses sacrifiés aux idoles; « viandes » peut être exact dans nombre de cas, mais est plus étroit que le grec.
