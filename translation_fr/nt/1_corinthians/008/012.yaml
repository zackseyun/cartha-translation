reference: 1 Corinthians 8:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὕτως δὲ ἁμαρτάνοντες εἰς τοὺς ἀδελφοὺς καὶ τύπτοντες αὐτῶν τὴν συνείδησιν ἀσθενοῦσαν εἰς Χριστὸν ἁμαρτάνετε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/012.yaml
  text: And so[a], by sinning against the brothers in this way and wounding their weak conscience[c][b], you are sinning against Messiah.
translation:
  language: fr
  text: Ainsi, en péchant de cette manière contre les frères[a] et en blessant leur conscience faible, vous péchez contre le Messie[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ici, « frères » désigne les autres croyants ; selon le contexte, le terme peut inclure des hommes et des femmes.
    reason: lexical_alternative
  - marker: b
    text: Ou « le Christ ». Le titre grec est Χριστός.
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως δὲ
  choice: Ainsi
  rationale: L’expression relie la phrase au raisonnement précédent et renvoie à la manière d’agir qui vient d’être décrite. « Ainsi » restitue naturellement en français à la fois le lien et la portée rétrospective.
- source_word: ἁμαρτάνοντες εἰς τοὺς ἀδελφοὺς
  choice: en péchant de cette manière contre les frères
  rationale: 'Le participe présent exprime la manière ou la circonstance du verbe principal. Avec ἁμαρτάνω, εἰς marque ici la direction hostile : « contre ». Le masculin pluriel « frères » suit la forme grecque, avec une note sur sa portée communautaire.'
- source_word: τύπτοντες
  choice: en blessant
  rationale: Le verbe signifie littéralement frapper, mais son emploi métaphorique avec la conscience décrit le tort qui lui est infligé. « Blesser » conserve la force de l’image tout en étant idiomatique en français.
- source_word: αὐτῶν τὴν συνείδησιν ἀσθενοῦσαν
  choice: leur conscience qui est faible
  rationale: Le singulier grec « la conscience » avec le pronom pluriel a une valeur distributive. Le singulier français « leur conscience » reste naturel et proche de la forme source. La relative rend le participe présent ἀσθενοῦσαν sans effacer son caractère descriptif.
- source_word: εἰς Χριστὸν ἁμαρτάνετε
  choice: vous péchez contre le Messie
  rationale: Le second εἰς exprime de nouveau l’orientation contre quelqu’un. Le présent « vous péchez » convient à une affirmation générale et actuelle. Χριστός est rendu comme un titre par « le Messie ».
theological_decisions:
- issue: Portée de ἀδελφοὺς dans la communauté croyante
  choice: les frères
  alternative: les frères et sœurs ; les croyants
  rationale: La forme grecque est un masculin pluriel, mais dans ce contexte ecclésial elle peut désigner collectivement les croyants, hommes et femmes. Le texte principal conserve la forme, et la note en explicite la portée possible.
- issue: Traduction de Χριστόν
  choice: le Messie
  alternative: le Christ
  rationale: Χριστός conserve ici sa valeur de titre appliqué à Jésus. « Le Messie » rend explicitement ce titre sans modifier l’affirmation selon laquelle pécher contre un autre croyant revient à pécher contre lui.
- issue: Lien entre le tort fait au croyant et le péché contre le Messie
  choice: conserver l’affirmation directe
  alternative: expliciter par « c’est contre le Messie que… »
  rationale: Le grec établit directement le parallèle sans expliquer son mécanisme théologique. La traduction préserve cette tension et n’ajoute aucune interprétation.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la construction participiale du grec sans lourdeur excessive. « Blesser la conscience » est plus naturel en français que le littéral « frapper la conscience », tandis que « qui est faible » maintient le lien grammatical avec la conscience.
