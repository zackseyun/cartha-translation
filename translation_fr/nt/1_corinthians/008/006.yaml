reference: 1 Corinthians 8:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀλλ’ ἡμῖν εἷς θεὸς ὁ πατήρ, ἐξ οὗ τὰ πάντα καὶ ἡμεῖς εἰς αὐτόν, καὶ εἷς κύριος Ἰησοῦς Χριστός, δι’ οὗ τὰ πάντα καὶ ἡμεῖς δι’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/006.yaml
  text: yet for us there is one God[a], the Father, from whom are all things and we for him, and one Lord, Jesus the Messiah[c][b], through whom are all things and we through him.
translation:
  language: fr
  text: mais pour nous, il y a un seul Dieu, le Père, de qui viennent toutes choses et pour qui nous sommes, et un seul Seigneur, Jésus le Messie[a], par qui toutes choses existent et par qui nous sommes[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Jésus-Christ ». Le grec Χριστός peut fonctionner comme le titre « Messie » ou, selon le contexte, comme une désignation proche d’un nom propre, « Christ ».
    reason: alternative_reading
  - marker: b
    text: 'L’expression grecque est très concise: littéralement, « et nous par lui ». Elle peut évoquer notre existence, notre vie ou notre condition de croyants par Jésus, sans préciser davantage.'
    reason: ambiguity
lexical_decisions:
- source_word: ἀλλ’ ἡμῖν
  choice: mais pour nous
  rationale: « Mais » marque le contraste avec les prétendus dieux et seigneurs mentionnés auparavant; « pour nous » rend naturellement le datif de référence.
- source_word: εἷς θεὸς ὁ πατήρ
  choice: un seul Dieu, le Père
  rationale: Cette formulation conserve la force confessionnelle et le parallélisme avec « un seul Seigneur ».
- source_word: ἐξ οὗ τὰ πάντα
  choice: de qui viennent toutes choses
  rationale: ἐξ indique la source ou l’origine. L’ajout idiomatique de « viennent » explicite l’ellipse sans préciser davantage la nature de cette origine.
- source_word: καὶ ἡμεῖς εἰς αὐτόν
  choice: et pour qui nous sommes
  rationale: εἰς peut exprimer la direction, le but ou la finalité. « Pour qui nous sommes » garde cette orientation vers Dieu comme fin sans adopter le français peu naturel « vers qui nous sommes ».
- source_word: εἷς κύριος
  choice: un seul Seigneur
  rationale: « Seigneur » conserve le poids christologique de κύριος et la structure parallèle de la confession.
- source_word: Ἰησοῦς Χριστός
  choice: Jésus le Messie
  rationale: Dans cette formule confessionnelle, Χριστός garde nettement sa valeur de titre; l’article français est requis pour une expression naturelle.
- source_word: δι’ οὗ τὰ πάντα
  choice: par qui toutes choses existent
  rationale: διά avec le génitif exprime ici la médiation. En français, « par qui » est naturel; « existent » complète l’ellipse tout en évitant de réduire τὰ πάντα aux seules choses créées.
- source_word: καὶ ἡμεῖς δι’ αὐτοῦ
  choice: et par qui nous sommes
  rationale: La formulation reprend l’ellipse grecque en français compréhensible et laisse ouverte la portée précise de l’existence ou de la vie des croyants par le Christ.
theological_decisions:
- issue: Rapport entre « un seul Dieu » et « un seul Seigneur »
  choice: 'Maintenir la confession parallèle: « un seul Dieu, le Père ... et un seul Seigneur, Jésus le Messie »'
  alternative: Atténuer « Seigneur » ou expliciter dans le verset une formulation trinitaire postérieure
  rationale: Le grec distingue le Père et Jésus tout en les intégrant à une confession monothéiste d’une grande densité christologique. La traduction conserve cette tension sans la réduire ni la développer.
- issue: Rôles exprimés par ἐξ, εἰς et διά
  choice: Distinguer la source (« de qui »), la finalité (« pour qui ») et la médiation (« par qui »)
  alternative: Uniformiser les prépositions ou traduire εἰς par une formulation uniquement directionnelle
  rationale: Les prépositions structurent l’affirmation de Paul. Le maintien de leurs différences évite de confondre les relations attribuées au Père et à Jésus.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme confessionnel est conservé, tandis que les ellipses grecques sont légèrement complétées pour obtenir une phrase française claire. Les deux appels de note figurent dans le texte.
