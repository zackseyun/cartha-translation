  source_fidelity: Le sens général est bien rendu, mais « encore habitués à l’idole aujourd’hui » est peu idiomatique et ne restitue pas clairement la construction difficile συνήθεια ... ἕως ἄρτι τοῦ εἰδώλου. « Parce qu’elle est faible » transforme aussi la participiale grecque en relation causale explicite. La reformulation proposée conserve l’ambiguïté syntaxique tout en exprimant une accoutumance persistante liée à l’idole.
  naturalness: « Encore habitués à l’idole aujourd’hui » sonne maladroitement en français moderne. « En raison de leur accoutumance à l’idole, encore aujourd’hui » est plus naturel et garde la valeur continue de ἕως ἄρτι. « Leur conscience, faible, se trouve souillée » est une formulation fluide et proche du grec.
  terminology: « Connaissance », « idole », « nourriture sacrifiée à une idole », « conscience », « faible » et « souillée » conviennent au registre paulinien et au français international. « Nourriture » évite de limiter εἰδωλόθυτον à la viande.
