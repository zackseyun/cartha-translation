source:
  edition: SBLGNT
  text: Ἀλλ’ οὐκ ἐν πᾶσιν ἡ γνῶσις· τινὲς δὲ τῇ ⸀συνηθείᾳ ⸂ἕως ἄρτι τοῦ εἰδώλου⸃ ὡς εἰδωλόθυτον ἐσθίουσιν, καὶ ἡ συνείδησις αὐτῶν ἀσθενὴς οὖσα μολύνεται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/007.yaml
  text: But not everyone has this knowledge[a]. Some, through familiarity with the idol until now, eat it as food sacrificed to an idol, and their conscience, being weak[b], is defiled.
translation:
  language: fr
  text: Mais tous n’ont pas cette connaissance. Certains, en raison de leur accoutumance à l’idole, encore aujourd’hui[a], mangent cette nourriture comme une nourriture sacrifiée à une idole, et leur conscience, faible, se trouve souillée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La construction grecque est difficile. Littéralement : « par accoutumance, jusqu’à présent, de l’idole ». Elle peut évoquer l’influence persistante de leur ancienne relation au culte des idoles. Certains manuscrits lisent « conscience » à la place d’« accoutumance »; le texte suivi ici lit « accoutumance ».'
    reason: lexical_alternative_and_textual_variant
lexical_decisions:
- source_word: γνῶσις
  choice: connaissance
  rationale: Terme paulinien courant qui maintient le lien avec ce que les Corinthiens « savent » au sujet des idoles dans le contexte immédiat.
- source_word: συνήθεια
  choice: habitués
  rationale: Rend l’idée d’une habitude ou familiarité acquise par une fréquentation antérieure, sans expliciter davantage que le grec la nature exacte de ce lien.
- source_word: ἕως ἄρτι τοῦ εἰδώλου
  choice: encore … à l’idole aujourd’hui
  rationale: Intègre la valeur temporelle de ἕως ἄρτι et rattache l’expression à συνήθεια, tout en gardant une formulation française compréhensible.
- source_word: εἰδωλόθυτον
  choice: ayant été offerte à une idole
  rationale: Exprime clairement le rapport cultuel de la nourriture à un sacrifice, sans présenter l’idole comme une divinité réelle.
- source_word: συνείδησις
  choice: conscience
  rationale: Équivalent français normal pour la faculté de discernement moral évoquée ici par Paul.
- source_word: ἀσθενής
  choice: faible
  rationale: Conserve le terme structurant du chapitre pour une conscience qui manque d’assurance ou de fermeté sur cette question.
- source_word: μολύνεται
  choice: en est souillée
  rationale: Le passif exprime une contamination morale de la conscience; « en » rend explicite en français le lien avec l’acte de manger.
theological_decisions:
- issue: Statut de la nourriture offerte à une idole
  choice: mangent cette nourriture comme ayant été offerte à une idole
  alternative: mangent de la viande sacrifiée aux idoles
  rationale: La formulation conserve la perception cultuelle qu’en ont ces personnes sans suggérer que Paul reconnaît l’idole comme un dieu réel; elle maintient ainsi la tension du contexte.
- issue: Nature de la faiblesse de la conscience
  choice: leur conscience, parce qu’elle est faible
  alternative: leur conscience faible
  rationale: La faiblesse qualifie ici la conscience dans cette question précise; la traduction évite d’en faire un jugement global sur la valeur morale ou spirituelle des personnes.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe a été légèrement réorganisée pour rester naturelle, tandis que la note préserve la difficulté et l’ambiguïté de la construction grecque.
