source:
  edition: SBLGNT
  text: φεύγετε τὴν πορνείαν· πᾶν ἁμάρτημα ὃ ἐὰν ποιήσῃ ἄνθρωπος ἐκτὸς τοῦ σώματός ἐστιν, ὁ δὲ πορνεύων εἰς τὸ ἴδιον σῶμα ἁμαρτάνει.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/018.yaml
  text: Flee sexual immorality. Every sin that a person may commit is outside the body[a], but the one who commits sexual immorality sins against his own body.
translation:
  language: fr
  text: Fuyez l’immoralité sexuelle. Tout péché qu’une personne peut commettre est en dehors du corps[a] ; mais celui qui se livre à l’immoralité sexuelle pèche contre son propre corps.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’affirmation selon laquelle tout péché est « en dehors du corps » est formulée directement en grec ; son sens précis est discuté.
    reason: Préserver la difficulté exégétique sans la résoudre dans le texte principal.
lexical_decisions:
- source_word: φεύγετε
  choice: Fuyez
  rationale: L’impératif présent, à la deuxième personne du pluriel, exprime un ordre pressant et une conduite durable d’évitement. « Fuyez » en conserve la force avec concision.
- source_word: πορνείαν
  choice: l’immoralité sexuelle
  rationale: πορνεία désigne largement les conduites sexuelles illicites, et non uniquement les relations sexuelles avant le mariage. Cette expression moderne en préserve l’étendue.
- source_word: πᾶν ἁμάρτημα
  choice: Tout péché
  rationale: La formulation rend naturellement la portée générique et globale de l’expression grecque.
- source_word: ὃ ἐὰν ποιήσῃ ἄνθρωπος
  choice: qu’une personne peut commettre
  rationale: ἄνθρωπος a ici un sens humain générique. En français contemporain, « une personne » exprime clairement cette valeur représentative, tandis que « peut commettre » restitue la nuance éventuelle de ἐὰν avec le subjonctif aoriste.
- source_word: ἐκτὸς τοῦ σώματός ἐστιν
  choice: est extérieur au corps
  rationale: Cette formulation conserve l’image spatiale et le contraste explicite avec la proposition suivante, sans chercher à résoudre la difficulté exégétique.
- source_word: ὁ δὲ πορνεύων
  choice: mais celui qui se livre à l’immoralité sexuelle
  rationale: Le participe présent substantivé désigne la personne qui pratique cet acte. « Se livre à » maintient la valeur verbale et le lien lexical avec πορνεία.
- source_word: εἰς τὸ ἴδιον σῶμα ἁμαρτάνει
  choice: pèche contre son propre corps
  rationale: Dans ce contexte, « contre » rend idiomatiquement la direction exprimée par εἰς, tandis que « son propre » préserve l’insistance réflexive de ἴδιον.
theological_decisions:
- issue: Valeur générique de ἄνθρωπος
  choice: une personne
  alternative: un homme
  rationale: Bien que le nom grec soit morphologiquement masculin, il désigne ici tout être humain de manière représentative. « Une personne » rend ce sens sans restreindre l’énoncé aux hommes.
- issue: Portée de l’affirmation selon laquelle tout péché est extérieur au corps
  choice: Conserver directement l’affirmation et sa tension
  alternative: La présenter comme un slogan corinthien cité, ou la nuancer dans le texte
  rationale: Le grec énonce la proposition directement. La traduction n’impose donc ni l’hypothèse d’une citation ni une harmonisation doctrinale.
translation_notes:
  register: Français international moderne, clair et digne. Le vocabulaire demeure accessible tout en conservant l’urgence de l’impératif, la répétition de « l’immoralité sexuelle » et la tension du contraste paulinien.
