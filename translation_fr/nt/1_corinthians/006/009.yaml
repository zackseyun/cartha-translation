id: 1CO.6.9
reference: 1 Corinthians 6:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἢ οὐκ οἴδατε ὅτι ἄδικοι ⸂θεοῦ βασιλείαν⸃ οὐ κληρονομήσουσιν; μὴ πλανᾶσθε· οὔτε πόρνοι οὔτε εἰδωλολάτραι οὔτε μοιχοὶ οὔτε μαλακοὶ οὔτε ἀρσενοκοῖται
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/009.yaml
  text: 'Or do you not know that the unrighteous will not inherit the kingdom of God? Do not be deceived: neither the sexually immoral[a], nor idolaters, nor adulterers, nor effeminate men[b], nor men who have sex with men'
translation:
  language: fr
  text: 'Ou bien ne savez-vous pas que les injustes n’hériteront pas du royaume de Dieu ? Ne vous y trompez pas : ni ceux qui vivent dans l’immoralité sexuelle, ni les idolâtres, ni les adultères, ni les hommes efféminés[a], ni les hommes qui ont des rapports sexuels avec des hommes[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « mous ». Le mot grec peut évoquer la mollesse, l’efféminement ou la faiblesse morale ; dans ce contexte, il désigne peut-être les partenaires passifs dans des rapports sexuels entre hommes, voire des prostitués.
    reason: lexical_alternative
  - marker: b
    text: Le terme grec est rare et son sens exact est discuté. On peut aussi traduire « hommes qui pratiquent des rapports homosexuels » ou, plus largement, « hommes qui ont des rapports sexuels illicites avec des personnes de sexe masculin ». Beaucoup le rapprochent de la formulation grecque du Lévitique.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἢ
  choice: Ou bien
  rationale: Introduit naturellement en français la reprise rhétorique et corrective de l’argument précédent.
- source_word: οὐκ οἴδατε
  choice: ne savez-vous pas
  rationale: Conserve la formule rhétorique paulinienne tout en restant idiomatique.
- source_word: ἄδικοι
  choice: les injustes
  rationale: Rend la catégorie morale générale sans la réduire à une liste d’actes ponctuels.
- source_word: θεοῦ βασιλείαν
  choice: le royaume de Dieu
  rationale: Expression biblique française usuelle, transparente et fidèle au génitif grec.
- source_word: οὐ κληρονομήσουσιν
  choice: n’hériteront pas
  rationale: Préserve l’image de l’héritage ainsi que ses résonances eschatologiques et liées à l’alliance.
- source_word: μὴ πλανᾶσθε
  choice: Ne vous y trompez pas
  rationale: Formulation française naturelle qui maintient l’avertissement contre l’illusion ou l’égarement.
- source_word: πόρνοι
  choice: ceux qui vivent dans l’immoralité sexuelle
  rationale: Rend largement le terme sans recourir au mot vieilli « fornicateurs » ni le limiter à une seule forme d’inconduite sexuelle.
- source_word: εἰδωλολάτραι
  choice: les idolâtres
  rationale: Équivalent direct, concis et courant.
- source_word: μοιχοὶ
  choice: les adultères
  rationale: Équivalent direct qui conserve la référence spécifique à l’adultère.
- source_word: μαλακοὶ
  choice: les hommes efféminés
  rationale: Rendu relativement direct de « mous » dans ce contexte humain, sans trancher dans le texte principal la question débattue de son éventuel sens sexuel précis.
- source_word: ἀρσενοκοῖται
  choice: les hommes qui ont des rapports sexuels avec des hommes
  rationale: Rendu descriptif de l’activité masculine visée, évitant les catégories modernes d’identité et signalant en note le caractère rare et débattu du terme.
theological_decisions:
- issue: Interprétation conjointe de μαλακοὶ et ἀρσενοκοῖται dans la liste de vices
  choice: Traduire séparément par « hommes efféminés » et « hommes qui ont des rapports sexuels avec des hommes »
  alternative: « partenaires passifs dans des rapports sexuels entre hommes » et « hommes ayant des rapports sexuels avec des hommes » ; ou « prostitués » et « hommes qui couchent avec des hommes »
  rationale: La juxtaposition peut suggérer deux rôles ou deux catégories liées aux rapports sexuels entre hommes, mais le sens exact de μαλακοί et l’étendue de ἀρσενοκοῖται demeurent discutés. Le texte principal conserve la distinction lexicale, tandis que les notes exposent les principales possibilités sans imposer une reconstruction historique précise.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve la cadence d’une liste de vices et le vocabulaire biblique de l’héritage et du royaume, tout en évitant les termes identitaires modernes et les archaïsmes. Les marqueurs [a] et [b] figurent dans le texte principal.
