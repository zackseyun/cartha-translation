  text: ⸀ἢ οὐκ οἴδατε ὅτι ὁ κολλώμενος τῇ πόρνῃ ἓν σῶμά ἐστιν; Ἔσονται γάρ, φησίν, οἱ δύο εἰς σάρκα μίαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/016.yaml
  text: Or do you not know that the one who joins himself to a prostitute is one body with her? For[a], as he says[b], “The two will become one flesh.”
translation:
  language: fr
  text: 'Ou bien, ne savez-vous pas que celui qui s’unit à une prostituée ne fait avec elle qu’un seul corps ? Car il est dit[a] : « Les deux deviendront une seule chair »[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « il dit »; la citation vient de Genèse 2.24.'
    reason: cross_reference
  - marker: b
    text: Genèse 2.24.
    reason: cross_reference
lexical_decisions:
- source_word: ἢ
  choice: Ou bien
  rationale: Introduit la poursuite rhétorique de l’argument de Paul; « Ou bien » est naturel en français et marque clairement l’alternative.
- source_word: οὐκ οἴδατε
  choice: ne savez-vous pas
  rationale: Conserve la formule rhétorique paulinienne et le sens direct de οἶδα.
- source_word: ὁ κολλώμενος
  choice: celui qui s’unit
  rationale: κολλάομαι exprime l’idée de s’attacher ou de s’unir; dans ce contexte sexuel, « s’unit » est clair, actuel et évite une tournure passive pesante.
- source_word: τῇ πόρνῃ
  choice: à une prostituée
  rationale: πόρνη désigne précisément une prostituée; l’article grec a ici une valeur générique, rendue naturellement par l’indéfini en français.
- source_word: ἓν σῶμά ἐστιν
  choice: devient un seul corps avec elle
  rationale: La formule décrit l’union corporelle qui résulte de l’acte. « avec elle » explicite la relation implicite en grec; « devient » exprime naturellement en français le résultat sans modifier le propos.
- source_word: Ἔσονται γάρ
  choice: Car ... deviendront
  rationale: Dans la citation de Genèse 2.24, le futur de εἰμί suivi de εἰς a le sens contextuel de « devenir ».
- source_word: φησίν
  choice: est-il dit
  rationale: Rend le singulier grec sans identifier explicitement comme sujet Dieu, l’Écriture ou le texte; la tournure française introduit naturellement la citation tout en préservant cette indétermination.
- source_word: οἱ δύο
  choice: les deux
  rationale: Correspond directement au grec et conserve la formulation concise de la citation.
- source_word: εἰς σάρκα μίαν
  choice: une seule chair
  rationale: Rendu établi et formellement proche de la citation de Genèse 2.24; « chair » désigne ici l’union corporelle et relationnelle, non une nature pécheresse.
theological_decisions:
- issue: Portée de la citation de Genèse 2.24 appliquée à l’union sexuelle hors mariage
  choice: Traduire directement la citation comme fondement de l’affirmation selon laquelle l’union avec une prostituée produit une réelle union corporelle, « un seul corps » et « une seule chair ».
  alternative: Limiter la citation au mariage, ou ajouter dans la traduction une conclusion morale et doctrinale plus développée.
  rationale: Paul applique lui-même Genèse 2.24 à l’union avec une prostituée. La traduction doit conserver cette tension et cette portée analogique sans ajouter ce que le verset ne formule pas.
- issue: Sujet non exprimé de φησίν
  choice: Employer « est-il dit », qui laisse le locuteur implicite.
  alternative: Traduire « Dieu dit », « l’Écriture dit » ou simplement « il dit ».
  rationale: Le grec porte littéralement « il dit » sans antécédent explicite dans ce verset. La tournure impersonnelle française préserve l’indétermination tout en restant idiomatique.
translation_notes:
  register: Français international moderne, clair et digne. « Prostituée », « un seul corps » et « une seule chair » préservent la précision lexicale et l’écho scripturaire. La syntaxe reste rhétorique sans être archaïque.
