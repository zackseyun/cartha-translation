id: 1CO.6.1
reference: 1 Corinthians 6:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Τολμᾷ τις ὑμῶν πρᾶγμα ἔχων πρὸς τὸν ἕτερον κρίνεσθαι ἐπὶ τῶν ἀδίκων, καὶ οὐχὶ ἐπὶ τῶν ἁγίων;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/001.yaml
  text: Does any one of you dare[a], when he has a case against another[b], to be judged before the unrighteous and not before the saints?
translation:
  language: fr
  text: L’un de vous ose-t-il, lorsqu’il a un litige avec un autre, se faire juger devant les injustes[a], et non devant les saints[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les gens injustes ». Certaines traductions explicitent par « les non-croyants », mais le grec dit littéralement « les injustes ».
    reason: lexical_alternative
  - marker: b
    text: Ici, les « saints » sont ceux qui appartiennent à Dieu, c’est-à-dire les croyants.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τολμᾷ τις ὑμῶν
  choice: L’un de vous ose-t-il
  rationale: La tournure interrogative restitue la question rhétorique de Paul et la nuance d’audace, voire de présomption, portée par τολμάω. « L’un de vous » conserve la référence indéfinie singulière et l’adresse directe à la communauté.
- source_word: πρᾶγμα ἔχων πρὸς τὸν ἕτερον
  choice: lorsqu’il a un litige avec un autre
  rationale: Dans ce contexte judiciaire, πρᾶγμα désigne une affaire ou un différend. « Litige » exprime clairement cette dimension sans préciser indûment la nature du procès; « avec un autre » rend naturellement la relation d’opposition marquée par πρός.
- source_word: κρίνεσθαι
  choice: se faire juger
  rationale: Cette formulation conserve la forme passive du grec et son sens judiciaire, tout en restant idiomatique en français.
- source_word: ἐπὶ τῶν ἀδίκων
  choice: devant les injustes
  rationale: « Devant » convient au cadre judiciaire. « Les injustes » rend directement l’adjectif substantivé ἄδικοι, sans le remplacer par l’interprétation « les non-croyants ».
- source_word: καὶ οὐχὶ
  choice: et non
  rationale: La formulation reproduit sobrement le contraste explicite du grec, dont la force ressort déjà de la question rhétorique.
- source_word: ἐπὶ τῶν ἁγίων
  choice: devant les saints
  rationale: « Saints » conserve la désignation paulinienne habituelle du peuple consacré à Dieu et maintient le parallèle lexical avec « les injustes ».
theological_decisions:
- issue: Contraste entre ἀδίκων et ἁγίων
  choice: les injustes… les saints
  alternative: les non-croyants… les croyants
  rationale: Le contexte permet de comprendre qu’il s’agit de magistrats extérieurs à la communauté chrétienne, mais le grec emploie des termes chargés sur le plan moral et théologique. La traduction préserve ce contraste sans en résoudre implicitement la portée.
- issue: Portée représentative du singulier masculin ἔχων
  choice: lorsqu’il a
  alternative: lorsqu’on a
  rationale: Le pronom « il » reprend le singulier « l’un de vous » et respecte la construction grammaticale représentative du texte grec, sans limiter l’application du propos.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve la vigueur de la question rhétorique, tandis que « litige » et « se faire juger » rendent clairement le cadre judiciaire. Les termes théologiquement marqués « injustes » et « saints » sont maintenus, avec des notes destinées à prévenir les contresens.
