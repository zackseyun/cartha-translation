  text: nor thieves[a], nor the greedy, nor drunkards, nor revilers[c][b], nor swindlers will inherit the kingdom of God.
translation:
  language: fr
  text: ni les voleurs, ni les gens avides, ni les ivrognes, ni ceux qui insultent, ni les rapaces[a] n’hériteront du royaume de Dieu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les extorqueurs »; autre possibilité : « les escrocs » (ἅρπαγες).'
    reason: lexical_alternative
  - marker: b
    text: Autrement dit, ils ne recevront aucune part dans le royaume de Dieu.
    reason: inheritance_idiom
lexical_decisions:
- source_word: κλέπται
  choice: les voleurs
  rationale: Équivalent français courant et précis pour ceux qui dérobent, adapté à une liste de vices.
- source_word: πλεονέκται
  choice: les gens avides
  rationale: Exprime en français moderne des personnes caractérisées par le désir insatiable d’avoir davantage; « cupides » serait possible, mais mettrait plus exclusivement l’accent sur l’argent.
- source_word: μέθυσοι
  choice: les ivrognes
  rationale: Désigne ceux que caractérise l’ivrognerie, et non toute personne qui s’est enivrée une fois; le terme reste concis et naturel dans cette liste.
- source_word: λοίδοροι
  choice: ceux qui insultent
  rationale: Rend la conduite verbale injurieuse ou outrageante sans la limiter à la calomnie; formulation plus accessible que « insulteurs » ou « outrageux ».
- source_word: ἅρπαγες
  choice: les gens qui exploitent les autres
  rationale: Le mot évoque ceux qui s’emparent avec rapacité de ce qui appartient à autrui ou tirent d’eux un gain prédateur. Cette formulation garde une portée assez large; « extorqueurs » et « rapaces » sont signalés en note.
- source_word: βασιλείαν θεοῦ
  choice: le royaume de Dieu
  rationale: Formule française consacrée qui préserve la portée théologique du règne ou royaume de Dieu chez Paul.
- source_word: κληρονομήσουσιν
  choice: n’hériteront
  rationale: Conserve l’image de l’héritage et sa nuance eschatologique, sans la paraphraser dans le corps du texte.
theological_decisions:
- issue: Portée de la liste de vices et langage de l’héritage
  choice: La traduction emploie des désignations de personnes correspondant aux substantifs pluriels grecs, sans ajouter « non repentants » ni préciser explicitement une habitude de vie.
  alternative: Traduire par des actes isolés, ou ajouter que seuls ceux qui persistent sans repentance sont visés.
  rationale: La forme de la liste présente des catégories de personnes caractérisées par ces conduites, mais le verset lui-même n’énonce pas les qualifications interprétatives proposées. La traduction maintient donc la tension du texte et conserve littéralement l’image de l’héritage.
translation_notes:
  register: Français international moderne, digne et accessible. La série varie légèrement entre noms et périphrases afin d’éviter des termes rares ou artificiels. Les marqueurs [a] et [b] figurent tous deux dans le texte principal.
