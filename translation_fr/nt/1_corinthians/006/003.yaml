  text: Do you not know that we will judge angels? How much more[a], the things of this life!
translation:
  language: fr
  text: Ne savez-vous pas que nous jugerons les anges ? À plus forte raison[a] les affaires de la vie courante !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « sans parler des affaires de la vie courante » ; aussi : « combien plus les affaires de la vie courante ».'
    reason: alternative lexicale pour μήτιγε
lexical_decisions:
- source_word: οὐκ οἴδατε
  choice: Ne savez-vous pas
  rationale: Conserve la question rhétorique caractéristique de Paul dans une formulation française naturelle et soutenue.
- source_word: ὅτι
  choice: que
  rationale: Introduit directement la proposition qui exprime ce que les destinataires devraient savoir.
- source_word: ἀγγέλους
  choice: des anges
  rationale: Dans ce contexte judiciaire et eschatologique, le terme désigne naturellement des êtres célestes plutôt que des messagers humains.
- source_word: κρινοῦμεν
  choice: nous jugerons
  rationale: Le futur rend l’indicatif futur grec, tandis que « juger » préserve la portée judiciaire sans préciser indûment la nature ou les modalités de ce jugement.
- source_word: μήτιγε
  choice: à plus forte raison
  rationale: 'Cette expression rend l’argument du plus grand au moindre : si les croyants jugeront des anges, ils sont d’autant plus aptes à traiter les affaires ordinaires.'
- source_word: βιωτικά
  choice: les affaires de la vie courante
  rationale: L’adjectif substantivé désigne les questions relevant de la vie terrestre ordinaire; « affaires » convient également au contexte de litiges sans réduire le mot aux seules procédures judiciaires.
theological_decisions:
- issue: Nature du jugement des anges par les croyants
  choice: Conserver littéralement « nous jugerons des anges » sans précision interprétative.
  alternative: « nous gouvernerons les anges » ou « nous jugerons les anges déchus »
  rationale: Le texte affirme ce jugement futur, mais n’en précise ni les modalités ni la catégorie d’anges concernée. La traduction maintient donc l’ambiguïté et la tension théologique du grec.
- issue: Force logique de μήτιγε
  choice: Exprimer un raisonnement du plus grand au moindre par « à plus forte raison » dans le texte.
  alternative: « combien plus », « sans parler de » ou « à plus forte raison pour »
  rationale: Le contexte montre que les affaires ordinaires constituent le cas moindre. La formulation choisie restitue clairement cette logique, tandis que la note signale une autre manière de comprendre ou d’exprimer la particule.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure « Ne savez-vous pas » conserve l’idiome rhétorique paulinien; « affaires de la vie courante » reste naturelle tout en s’accordant avec le contexte judiciaire immédiat.
