source:
  edition: SBLGNT
  text: ⸀ἢ οὐκ οἴδατε ὅτι οἱ ἅγιοι τὸν κόσμον κρινοῦσιν; καὶ εἰ ἐν ὑμῖν κρίνεται ὁ κόσμος, ἀνάξιοί ἐστε κριτηρίων ἐλαχίστων;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/002.yaml
  text: Or do you not know that the saints will judge the world? And if the world is judged by you[b][a], are you unworthy of the smallest courts?
translation:
  language: fr
  text: Ou bien ne savez-vous pas que ceux qui sont consacrés à Dieu jugeront le monde ? Et si le monde est jugé par vous[a], êtes-vous indignes de trancher les affaires les plus insignifiantes[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « parmi vous » : littéralement, le grec peut se lire « si le monde est jugé parmi vous » ; dans ce contexte, il indique que les croyants participent à ce jugement.'
    reason: lexical_alternative
  - marker: b
    text: Ou « de si petits tribunaux ». Le mot grec peut désigner soit un tribunal, soit une affaire soumise au jugement.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ
  choice: Ou bien
  rationale: Introduit avec naturel la nouvelle étape de l’argument rhétorique de Paul.
- source_word: οὐκ οἴδατε
  choice: ne savez-vous pas
  rationale: Conserve la formule rhétorique paulinienne et la valeur usuelle de οἶδα.
- source_word: οἱ ἅγιοι
  choice: ceux qui appartiennent à Dieu
  rationale: Exprime en français courant le sens paulinien des personnes consacrées à Dieu, sans suggérer la catégorie plus restreinte de personnes canonisées que « les saints » peut évoquer aujourd’hui.
- source_word: τὸν κόσμον
  choice: le monde
  rationale: Rend directement κόσμος et préserve l’étendue humaine ou cosmique de l’affirmation.
- source_word: κρινοῦσιν
  choice: jugeront
  rationale: Conserve le futur et le sens judiciaire de κρίνω sans préciser le mode de participation au jugement.
- source_word: ἐν ὑμῖν
  choice: par vous
  rationale: Dans ce contexte judiciaire, rend clairement la participation des croyants au jugement; la formulation grecque plus littérale est signalée en note.
- source_word: ἀνάξιοί ἐστε
  choice: êtes-vous indignes
  rationale: Préserve la force évaluative et la pointe rhétorique de ἀνάξιος.
- source_word: κριτηρίων ἐλαχίστων
  choice: de juger les affaires les plus insignifiantes
  rationale: κριτήριον peut désigner un tribunal ou une affaire soumise au jugement. Ici, l’aptitude des destinataires à trancher des différends mineurs fournit une formulation française cohérente et naturelle; l’autre lecture est conservée en note.
theological_decisions:
- issue: Identité de οἱ ἅγιοι
  choice: L’ensemble des croyants comme personnes appartenant à Dieu
  alternative: Un groupe restreint de croyants particulièrement saints
  rationale: Dans l’usage paulinien, le terme désigne normalement collectivement le peuple de Dieu, non une élite spirituelle.
- issue: Participation des croyants au jugement du monde
  choice: Une participation réelle à un jugement futur, sans en préciser les modalités
  alternative: Une simple évaluation morale métaphorique, ou une autorité judiciaire indépendante
  rationale: Le texte affirme leur participation, mais n’explique ni sa forme ni son rapport exact à l’autorité divine.
- issue: Sens de κριτηρίων ἐλαχίστων
  choice: Les affaires judiciaires les plus insignifiantes
  alternative: Les tribunaux les moins importants
  rationale: Les deux sens sont lexicalement possibles. Le contexte immédiat des différends entre croyants favorise ici les affaires à juger, tout en laissant l’autre possibilité en note.
translation_notes:
  register: Français international moderne, naturel et digne. « Ceux qui appartiennent à Dieu » évite le possible contresens moderne de « saints » tout en rendant la portée collective du terme paulinien. La seconde question conserve le ton incisif de l’original.
