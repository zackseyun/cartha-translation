id: 1CO.6.5
reference: 1 Corinthians 6:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: πρὸς ἐντροπὴν ὑμῖν λέγω. οὕτως οὐκ ἔνι ἐν ὑμῖν ⸂οὐδεὶς σοφὸς⸃ ὃς δυνήσεται διακρῖναι ἀνὰ μέσον τοῦ ⸀ἀδελφοῦ αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/005.yaml
  text: I say this to your shame[a]. Is it really so[b], that there is not among you even one wise man who will be able to judge between his brothers?
translation:
  language: fr
  text: Je dis cela pour vous faire honte. Est-il donc vrai qu’il ne se trouve parmi vous pas même un seul sage[a] qui pourra trancher entre ses frères[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une seule personne sage ». Le grec est au masculin singulier, mais Paul s’adresse à toute l’assemblée.
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « entre son frère »; la seconde partie du litige est sous-entendue. Ici, « frère » désigne un autre membre de l’assemblée et peut donc aussi inclure une sœur.
    reason: source_ambiguity
lexical_decisions:
- source_word: πρὸς ἐντροπὴν ὑμῖν
  choice: pour vous faire honte
  rationale: Cette tournure rend naturellement en français la visée de la parole de Paul et conserve la force directe de sa réprimande.
- source_word: λέγω
  choice: Je dis cela
  rationale: Le présent simple convient au discours direct; « cela » reprend les propos précédents.
- source_word: οὕτως
  choice: Est-il donc vrai
  rationale: Dans ce contexte, l’adverbe introduit une question rhétorique indignée. Cette formulation française en restitue la force sans en faire une simple conclusion logique.
- source_word: οὐκ ἔνι ἐν ὑμῖν
  choice: il ne se trouve parmi vous
  rationale: La formulation exprime l’existence au sein de la communauté et reste naturelle en français moderne.
- source_word: οὐδεὶς σοφὸς
  choice: pas même un seul sage
  rationale: « Pas même un seul » fait ressortir la négation emphatique; « sage » conserve le masculin singulier du grec, qui peut avoir ici une portée représentative.
- source_word: δυνήσεται
  choice: qui pourra
  rationale: Le futur français préserve la nuance prospective du futur grec.
- source_word: διακρῖναι
  choice: trancher
  rationale: Dans le contexte de litiges, le verbe désigne l’action de départager les parties ou de rendre une décision. « Trancher » est précis sans imposer un cadre judiciaire officiel.
- source_word: ἀνὰ μέσον τοῦ ἀδελφοῦ αὐτοῦ
  choice: entre ses frères
  rationale: Le grec transmis est elliptique après « entre » et ne nomme explicitement qu’« son frère ». Le pluriel français rend le rapport entre les parties intelligible tout en conservant le langage familial de la communauté.
theological_decisions:
- issue: Masculin représentatif dans une assemblée mixte
  choice: un seul sage
  alternative: une seule personne sage
  rationale: Le grec emploie un masculin singulier. Le texte principal en garde la forme, tandis qu’une note précise que toute l’assemblée est visée.
- issue: Sens communautaire du terme ἀδελφός
  choice: ses frères
  alternative: les autres croyants
  rationale: Le langage familial de Paul est conservé. Une note indique qu’en contexte le terme désigne les membres de l’assemblée, hommes ou femmes.
- issue: Ellipse grecque après « entre »
  choice: entre ses frères
  alternative: entre son frère et l’autre partie
  rationale: La formulation retenue évite d’ajouter explicitement une seconde partie absente du texte grec, tout en produisant une phrase française compréhensible. La note signale l’ellipse originale.
translation_notes:
  register: Français international moderne, direct et digne. La question rhétorique garde le ton de vive réprimande. Le vocabulaire communautaire de parenté est maintenu, avec clarification en note de sa portée inclusive et de l’ellipse du grec.
