  text: καὶ ταῦτά τινες ἦτε· ἀλλὰ ἀπελούσασθε, ἀλλὰ ἡγιάσθητε, ἀλλὰ ἐδικαιώθητε ἐν τῷ ὀνόματι τοῦ κυρίου ⸀Ἰησοῦ καὶ ἐν τῷ πνεύματι τοῦ θεοῦ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/011.yaml
  text: And such were some of you[a]. But you washed yourselves, but you were sanctified[c][b], but you were justified in the name of the Lord Jesus and in the Spirit of our God.
translation:
  language: fr
  text: Et c’est ce que certains d’entre vous étaient. Mais vous avez été lavés[a], mais vous avez été sanctifiés, mais vous avez été justifiés au nom du Seigneur Jésus et par l’Esprit de notre Dieu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La forme grecque peut aussi se comprendre : « vous vous êtes lavés ».'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « dans l’Esprit de notre Dieu ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ταῦτά τινες ἦτε
  choice: Et c’est ce que certains d’entre vous étaient
  rationale: Cette formulation française naturelle conserve le renvoi démonstratif de ταῦτα aux catégories énumérées auparavant, sans parler maladroitement de « choses ».
- source_word: ἀλλὰ
  choice: mais
  rationale: La triple répétition de « mais » reproduit l’insistance rhétorique de Paul et le contraste avec leur état passé.
- source_word: ἀπελούσασθε
  choice: vous avez été lavés
  rationale: Le sens passif s’accorde avec les deux passifs qui suivent et avec la série d’actions salvatrices; la forme moyenne grecque et sa lecture réfléchie sont toutefois signalées en note.
- source_word: ἡγιάσθητε
  choice: vous avez été sanctifiés
  rationale: « Sanctifiés » conserve le vocabulaire théologique paulinien tout en restant courant dans le registre biblique français.
- source_word: ἐδικαιώθητε
  choice: vous avez été déclarés justes
  rationale: Cette expression rend clairement la valeur judiciaire de δικαιόω sans dépendre du sens moderne parfois imprécis de « justifier ».
- source_word: ἐν τῷ ὀνόματι
  choice: au nom
  rationale: Expression française idiomatique qui peut évoquer l’autorité, le fondement ou l’action associés au nom de Jésus.
- source_word: ἐν τῷ πνεύματι τοῦ θεοῦ ἡμῶν
  choice: par l’Esprit de notre Dieu
  rationale: « Par » exprime naturellement l’agence probable de l’Esprit dans cette série d’actions, tandis que la possibilité de comprendre « dans » est conservée en note.
theological_decisions:
- issue: Voix et agent de ἀπελούσασθε
  choice: vous avez été lavés
  alternative: vous vous êtes lavés
  rationale: Malgré la morphologie moyenne, la proximité de deux formes passives favorise ici une compréhension passive ou moyenne à effet passif. La note maintient l’ambiguïté réelle sans attribuer explicitement l’action à un agent absent du texte.
- issue: Valeur de ἐν devant πνεύματι
  choice: par l’Esprit de notre Dieu
  alternative: dans l’Esprit de notre Dieu
  rationale: La valeur instrumentale convient à la séquence, mais la préposition grecque peut également décrire la sphère dans laquelle ces actions ont lieu.
- issue: Référence de πνεύματι
  choice: l’Esprit de notre Dieu
  alternative: l’esprit de notre Dieu
  rationale: Dans ce contexte paulinien, l’expression désigne très probablement l’Esprit saint; la majuscule signale ce référent sans ajouter le mot « saint ».
translation_notes:
  register: Français international moderne, digne et accessible. La triple reprise de « mais », un peu marquée en français, est maintenue pour restituer le rythme emphatique du grec.
