source:
  edition: SBLGNT
  text: βιωτικὰ μὲν οὖν κριτήρια ἐὰν ἔχητε, τοὺς ἐξουθενημένους ἐν τῇ ἐκκλησίᾳ, τούτους καθίζετε;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/004.yaml
  text: So if you have courts for matters of this life[c][b][a], do you appoint as judges those who are of no standing in the church?
translation:
  language: fr
  text: Si donc vous avez des litiges de la vie courante[a] à régler, désignez-vous comme juges ceux qui sont sans considération dans l’Église[b] ?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les affaires de cette vie » ; le grec désigne les affaires ordinaires, terrestres ou civiles.
    reason: lexical_alternative
  - marker: b
    text: Ou « ceux qui sont méprisés dans l’Église ». L’expression grecque peut désigner, avec ironie, soit des personnes jugées insignifiantes au sein de l’Église, soit des personnes qui n’ont aucun statut à ses yeux.
    reason: alternative_reading
  - marker: c
    text: 'Certains comprennent cette proposition comme un impératif sarcastique : « désignez donc comme juges ceux qui sont sans considération dans l’Église ! »'
    reason: alternative_reading
lexical_decisions:
- source_word: βιωτικὰ
  choice: affaires de la vie courante
  rationale: L’adjectif désigne les affaires ordinaires de la vie terrestre, notamment civiles ou matérielles. Cette formulation est naturelle en français et évite la connotation morale que pourrait suggérer « mondaines ».
- source_word: κριτήρια
  choice: affaires … à faire juger
  rationale: Le nom peut désigner des tribunaux, des procédures judiciaires ou des affaires soumises au jugement. Dans cette construction, « affaires … à faire juger » rend clairement la situation judiciaire sans supposer que l’Église possède déjà des tribunaux constitués.
- source_word: ἐὰν ἔχητε
  choice: si donc vous avez
  rationale: Cette formulation directe conserve la condition exprimée par le grec ainsi que l’enchaînement argumentatif marqué par μὲν οὖν.
- source_word: τοὺς ἐξουθενημένους
  choice: ceux qui sont sans considération
  rationale: Le participe désigne des personnes tenues pour rien, méprisées ou jugées insignifiantes. « Sans considération » préserve la nuance de statut sans identifier trop précisément ces personnes.
- source_word: ἐν τῇ ἐκκλησίᾳ
  choice: dans l’Église
  rationale: La traduction littérale maintient l’ambiguïté entre des personnes peu considérées au sein de la communauté et des personnes sans statut du point de vue de celle-ci.
- source_word: τούτους καθίζετε
  choice: établissez-vous comme juges
  rationale: καθίζω signifie littéralement « faire asseoir » et peut, dans un cadre judiciaire, évoquer l’installation ou la désignation de juges. La formulation française explicite cette fonction tout en conservant la question rhétorique.
theological_decisions:
- issue: Valeur interrogative ou impérative de la proposition et identité des personnes sans considération
  choice: 'Traduire comme une question de reproche : « établissez-vous comme juges ceux qui sont sans considération dans l’Église ? »'
  alternative: 'Comprendre un impératif sarcastique : « établissez donc comme juges ceux qui sont sans considération dans l’Église ! » ; ou identifier ces personnes précisément comme des juges extérieurs à l’Église.'
  rationale: La syntaxe grecque permet plusieurs analyses. La ponctuation interrogative du SBLGNT et le ton de reproche du contexte favorisent la question rhétorique. La formulation retenue ne tranche pas si les personnes visées sont des membres insignifiants ou des personnes extérieures dépourvues de statut aux yeux de l’Église.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve le ton de reproche de Paul ainsi que l’ambiguïté syntaxique et sociale du grec, explicitée dans les notes.
