id: 1CO.6.20
reference: 1 Corinthians 6:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἠγοράσθητε γὰρ τιμῆς· δοξάσατε δὴ τὸν θεὸν ἐν τῷ σώματι ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/020.yaml
  text: For you were bought with a price[b][a]; therefore glorify God in your body.
translation:
  language: fr
  text: Car vous avez été achetés à un prix[a] ; glorifiez donc Dieu dans votre corps[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vous avez été acquis moyennant un prix ». Le grec conserve l’image d’un achat dont le prix a été payé.
    reason: lexical_alternative
  - marker: b
    text: L’expression grecque peut aussi se traduire par « par votre corps ». « Dans votre corps » laisse ouverte sa valeur locative ou instrumentale.
    reason: source_ambiguity
lexical_decisions:
- source_word: ἠγοράσθητε
  choice: vous avez été achetés
  rationale: L’aoriste passif de ἀγοράζω exprime littéralement l’achat. Cette formulation naturelle en français conserve sans l’expliciter davantage l’image commerciale du texte grec.
- source_word: γὰρ
  choice: car
  rationale: γάρ introduit la raison de l’exhortation précédente. « Car » en conserve clairement et sobrement la valeur explicative.
- source_word: τιμῆς
  choice: à un prix
  rationale: Le génitif de prix indique le coût de l’achat. « À un prix » est idiomatique en français et maintient l’image d’une acquisition ayant un coût.
- source_word: δοξάσατε
  choice: glorifiez
  rationale: L’impératif aoriste appelle à une action résolue. « Glorifiez » correspond directement à δοξάζω et en préserve la portée théologique.
- source_word: δὴ
  choice: donc
  rationale: La particule δή renforce ici la conclusion exhortative. « Donc » rend naturellement son caractère à la fois inférentiel et pressant.
- source_word: ἐν τῷ σώματι ὑμῶν
  choice: dans votre corps
  rationale: Cette traduction garde le singulier σῶμα associé au pluriel ὑμῶν et préserve la largeur possible de ἐν, sans réduire l’expression au seul moyen instrumental.
theological_decisions:
- issue: Image commerciale de la rédemption
  choice: 'Conserver la métaphore de l’achat : « vous avez été achetés à un prix »'
  alternative: « vous avez été rachetés au prix de… »
  rationale: Paul emploie explicitement le vocabulaire de l’achat. Le conserver évite d’ajouter un objet du prix non exprimé dans ce verset ou d’imposer une formulation doctrinale plus précise que le grec.
- issue: Éthique corporelle
  choice: Traduire concrètement σῶμα par « corps »
  alternative: « personne » ou « vie »
  rationale: Le contexte immédiat porte sur la conduite sexuelle corporelle. « Corps » préserve donc le mouvement précis de l’argument sans élargissement paraphrastique.
translation_notes:
  register: Français international moderne, clair et digne. Le pluriel « achetés » s’adresse à la communauté, tandis que « votre corps » reproduit le singulier distributif du grec. La ponctuation met en relief le passage de la raison à l’exhortation.
