id: 1CO.6.15
reference: 1 Corinthians 6:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὐκ οἴδατε ὅτι τὰ σώματα ὑμῶν μέλη Χριστοῦ ἐστιν; ἄρας οὖν τὰ μέλη τοῦ Χριστοῦ ποιήσω πόρνης μέλη; μὴ γένοιτο.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/015.yaml
  text: Do you not know that your bodies are members of Messiah? Shall I then take the members of Messiah and make them members of a prostitute? May it never be[a][b].
translation:
  language: fr
  text: Ne savez-vous pas que vos corps sont des membres du Messie[a] ? Vais-je donc prendre les membres du Messie et en faire les membres d’une prostituée ? Que cela n’arrive jamais ![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « du Christ ». Le titre grec Χριστός peut être traduit par « Messie » ou fonctionner comme la désignation traditionnelle « Christ ».'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « Certainement pas ! » ou « Loin de là ! » Le grec exprime une répudiation très énergique.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ οἴδατε
  choice: Ne savez-vous pas
  rationale: Cette formulation naturelle conserve la question rhétorique par laquelle Paul fait appel à un savoir que ses lecteurs sont censés posséder.
- source_word: σώματα
  choice: corps
  rationale: Le pluriel désigne les croyants dans leur réalité corporelle; « corps » reste direct et n’introduit pas l’idée plus étroite de simples parties anatomiques.
- source_word: μέλη
  choice: membres
  rationale: « Membres » préserve l’image organique de parties appartenant à un corps et convient au double emploi théologique et corporel du terme dans la phrase.
- source_word: Χριστοῦ
  choice: du Messie
  rationale: Χριστός garde ici sa valeur de titre désignant l’Oint auquel les croyants appartiennent. « Messie » en exprime le sens, tandis que « Christ » demeure une traduction traditionnelle possible signalée en note.
- source_word: ἄρας … ποιήσω
  choice: Vais-je donc prendre … et en faire
  rationale: La tournure française exprime naturellement l’action envisagée par la question délibérative, tout en conservant l’enchaînement entre prendre les membres du Messie et en faire ceux d’une prostituée.
- source_word: πόρνης
  choice: d’une prostituée
  rationale: Le nom grec désigne spécifiquement une prostituée dans ce contexte; cette traduction moderne évite aussi bien l’archaïsme que la généralisation à toute femme sexuellement immorale.
- source_word: μὴ γένοιτο
  choice: Que cela n’arrive jamais !
  rationale: Cette formule conserve à la fois la force de la répudiation et la nuance volitive de l’optatif grec.
theological_decisions:
- issue: Valeur de Χριστός dans l’affirmation de l’appartenance corporelle
  choice: le Messie
  alternative: le Christ
  rationale: Le terme peut être entendu comme titre ou comme désignation devenue proche d’un nom propre. Le texte retient le sens titulaire sans modifier l’affirmation de l’union et de l’appartenance, et la note maintient l’autre rendu légitime.
- issue: Force de μὴ γένοιτο
  choice: Que cela n’arrive jamais !
  alternative: Certainement pas ! / Loin de là !
  rationale: La traduction principale rend l’intensité et la forme volitive de la répudiation, tandis que la note donne des équivalents français plus idiomatiques sans affaiblir le rejet.
translation_notes:
  register: Français international moderne, digne et accessible. La question « Vais-je donc… ? » restitue sans lourdeur la construction participiale grecque, et le parallélisme des deux emplois de « membres » est volontairement conservé.
