source:
  edition: SBLGNT
  text: τὰ βρώματα τῇ κοιλίᾳ, καὶ ἡ κοιλία τοῖς βρώμασιν· ὁ δὲ θεὸς καὶ ταύτην καὶ ταῦτα καταργήσει. τὸ δὲ σῶμα οὐ τῇ πορνείᾳ ἀλλὰ τῷ κυρίῳ, καὶ ὁ κύριος τῷ σώματι·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/013.yaml
  text: Food is for the stomach[a], and the stomach for food—but God will do away with both it and them. But the body is not for sexual immorality, but for the Lord[c][b], and the Lord for the body.
translation:
  language: fr
  text: Les aliments sont pour le ventre, et le ventre pour les aliments[a][c] — mais Dieu mettra fin à l’un comme aux autres[b]. Cependant, le corps n’est pas pour l’immoralité sexuelle, mais pour le Seigneur, et le Seigneur pour le corps.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « La nourriture est pour le ventre, et le ventre pour la nourriture. » Le grec emploie le pluriel.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « Dieu détruira l’un comme les autres. » Le verbe grec peut aussi signifier « abolir » ou « rendre inopérant ».'
    reason: lexical_alternative
  - marker: c
    text: Beaucoup d’interprètes considèrent que « Les aliments sont pour le ventre, et le ventre pour les aliments » est une formule des Corinthiens que Paul cite avant de la corriger. Le texte grec ne marque toutefois pas explicitement une citation.
    reason: alternative_reading
lexical_decisions:
- source_word: βρώματα
  choice: les aliments
  rationale: Le pluriel grec est conservé naturellement en français. « Les aliments » convient à la portée générale de la formule et évite le caractère plus abstrait de « la nourriture ».
- source_word: κοιλίᾳ / κοιλία
  choice: ventre
  rationale: Dans ce contexte, le terme désigne l’organe associé aux aliments et à l’appétit corporel. « Ventre » est courant, clair et plus naturel que « estomac » dans cette formule parallèle.
- source_word: καταργήσει
  choice: mettra fin à
  rationale: Le verbe exprime ici la suppression ou la cessation de la fonction. « Mettra fin à » rend cette idée sans imposer celle d’un anéantissement matériel.
- source_word: ταύτην καὶ ταῦτα
  choice: à l’un comme aux autres
  rationale: Le féminin singulier renvoie au ventre et le neutre pluriel aux aliments. Cette tournure française marque les deux référents sans lourdeur.
- source_word: σῶμα
  choice: corps
  rationale: Équivalent français direct et usuel, qui conserve la réalité corporelle ainsi que sa portée théologique dans le raisonnement de Paul.
- source_word: πορνείᾳ
  choice: immoralité sexuelle
  rationale: Cette expression moderne garde la portée générale de πορνεία et demeure plus claire aujourd’hui que « fornication », souvent compris dans un sens plus étroit ou vieilli.
- source_word: κυρίῳ / κύριος
  choice: Seigneur
  rationale: Traduction habituelle de κύριος dans ce contexte christologique, préservant à la fois le titre et la relation d’autorité exprimée.
- source_word: δὲ
  choice: mais / cependant
  rationale: Les deux occurrences structurent des contrastes. La première est rendue par « mais » après le tiret; la seconde par « cependant » afin de faire entendre le passage à l’affirmation décisive sur le corps.
theological_decisions:
- issue: La première proposition est-elle une formule des Corinthiens citée par Paul ou une affirmation de Paul?
  choice: La présenter sans guillemets ni formule introductive.
  alternative: La mettre entre guillemets comme slogan corinthien, ou ajouter « Vous dites ».
  rationale: Le grec ne comporte aucun signal explicite de citation. Le tiret fait ressortir le contraste sans trancher une question interprétative que le texte laisse ouverte.
- issue: Sens de καταργήσει concernant le ventre et les aliments
  choice: Exprimer leur cessation par « mettra fin à ».
  alternative: « Détruira », « abolira » ou « rendra inopérants ».
  rationale: La formulation retenue exprime le caractère temporaire de cette relation fonctionnelle sans affirmer plus précisément une destruction matérielle.
- issue: Portée de « le Seigneur pour le corps »
  choice: Conserver la formulation réciproque, concise et non développée.
  alternative: Expliciter par « le Seigneur prend soin du corps » ou « le Seigneur est pour le bien du corps ».
  rationale: Le grec reste elliptique et construit un parallèle exact. Une explicitation déterminerait la nature de cette relation au-delà de ce qui est formulé.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme du grec est maintenu, ainsi que la brièveté théologique de la dernière proposition. Les guillemets sont évités pour ne pas transformer en certitude l’hypothèse du slogan corinthien.
