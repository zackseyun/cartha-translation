review_pass:
  verdict: revise
  source_fidelity: Le référent explicite d’ἀδελφούς est placé à la fin et constitue l’objet des deux verbes. « les autres » introduit un référent indéterminé qui affaiblit ce lien et doit être remplacé. L’emphase de ὑμεῖς et l’effet aggravant de καὶ τοῦτο sont autrement bien rendus.
  naturalness: « Mais vous, vous... » est une formulation moderne et idiomatique qui rend l’insistance sans la lourdeur de « c’est vous-mêmes qui ». « Faire du tort à » et « dépouiller » conviennent au contexte et permettent d’exprimer clairement que les frères et sœurs sont les victimes des deux actions.
  terminology: « Frères et sœurs » rend naturellement en français moderne la portée communautaire vraisemblablement inclusive de ἀδελφούς; la note conserve utilement la forme masculine du grec. « Dépouiller » maintient l’idée de priver autrui de ce qui lui est dû.
  issues:
