  text: But you yourselves do wrong and defraud—and this to your brothers[a].
translation:
  language: fr
  text: Mais vous, vous faites du tort à vos frères et sœurs et vous les dépouillez — et cela !
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλλὰ
  choice: Mais
  rationale: Marque nettement le contraste avec l’affirmation précédente, de manière naturelle en français.
- source_word: ὑμεῖς
  choice: c’est vous-mêmes qui
  rationale: La tournure clivée et « vous-mêmes » rendent l’insistance portée par le pronom grec explicite.
- source_word: ἀδικεῖτε
  choice: commettez des injustices
  rationale: Exprime l’action injuste sans en restreindre indûment la nature.
- source_word: ἀποστερεῖτε
  choice: dépouillez les autres
  rationale: Le verbe désigne le fait de priver quelqu’un de ce qui lui revient; « dépouiller » convient au contexte judiciaire et économique, tandis que « les autres » fournit en français un complément naturel sans identifier trop étroitement les victimes.
- source_word: καὶ τοῦτο
  choice: et cela
  rationale: Conserve la reprise rhétorique qui souligne le caractère aggravant de la conduite.
- source_word: ἀδελφούς
  choice: des frères et sœurs
  rationale: Dans l’adresse communautaire paulinienne, le masculin pluriel grec peut désigner collectivement les croyants des deux sexes; la note signale la forme littérale.
theological_decisions:
- issue: Portée de ἀδελφούς dans un contexte ecclésial mixte
  choice: frères et sœurs
  alternative: frères
  rationale: Le référent contextuel est vraisemblablement l’ensemble des membres de la communauté. La formulation inclusive communique cette portée en français moderne, tout en préservant dans une note l’information selon laquelle le grec emploie le masculin pluriel.
translation_notes:
  register: Français moderne, direct et digne. La tournure « c’est vous-mêmes qui » préserve l’emphase accusatrice; le point d’exclamation restitue la force rhétorique de la proposition, sans ajouter de contenu doctrinal.
