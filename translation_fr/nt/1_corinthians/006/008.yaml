    rationale: Le grec désigne des « frères » (dans le contexte, des coreligionnaires), non des « autres » de façon générale. La formulation actuelle dissocie en outre ce complément des deux verbes alors que le grec le place comme leur objet partagé.
  - severity: low
    issue: « envers des frères et sœurs » est moins direct et moins naturel que de construire les verbes avec leur complément.
    rationale: En français, « faire du tort à ... et dépouiller ... » rend clairement la relation grammaticale et la force de l’accusation.
  revised_text: Mais vous, vous faites du tort à vos frères et sœurs et vous les dépouillez — et cela !
