  text: But brother goes to court against brother[b][a], and this before unbelievers?
translation:
  language: fr
  text: Mais un frère va en justice contre un frère[a], et cela devant des non-croyants[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La répétition du mot « frère » désigne ici des membres de la communauté chrétienne.
    reason: cultural_note
  - marker: b
    text: 'Littéralement : « devant des non-croyants ». Le contexte évoque probablement des tribunaux publics où siègent des personnes extérieures à l’Église.'
    reason: lexical_and_contextual_note
lexical_decisions:
- source_word: ἀλλὰ
  choice: Mais
  rationale: Marque nettement le contraste avec la situation souhaitée évoquée au verset précédent.
- source_word: ἀδελφὸς ... ἀδελφοῦ
  choice: un frère ... un frère
  rationale: Conserve la répétition et le langage familial de Paul; ici, « frère » désigne un membre de la communauté chrétienne.
- source_word: μετὰ
  choice: contre
  rationale: Dans ce contexte judiciaire, la préposition exprime l’opposition entre les parties plutôt que le simple accompagnement.
- source_word: κρίνεται
  choice: va en justice
  rationale: Rend naturellement en français le sens judiciaire du verbe, dans le contexte immédiat des procès.
- source_word: καὶ τοῦτο
  choice: et cela
  rationale: Reproduit l’ajout rhétorique qui souligne le caractère choquant de la situation.
- source_word: ἐπὶ ἀπίστων
  choice: devant des non-croyants
  rationale: Préserve le sens général du grec sans préciser qu’il s’agit de juges, même si le contexte judiciaire le suggère.
theological_decisions:
- issue: Valeur représentative de ἀδελφός dans l’Église
  choice: un frère
  alternative: un autre croyant; un frère ou une sœur
  rationale: Le masculin singulier et le langage familial du texte sont conservés. Une note précise que l’expression vise les membres de la communauté chrétienne.
- issue: Portée de ἀπίστων
  choice: des non-croyants
  alternative: des juges non croyants; des gens du dehors
  rationale: Cette formulation maintient le contraste entre la communauté chrétienne et ceux qui ne partagent pas la foi, sans restreindre explicitement le terme aux juges.
- issue: Force de l’énoncé final
  choice: point d’exclamation
  alternative: point d’interrogation
  rationale: Le grec peut se lire comme une question indignée ou comme une exclamation elliptique. En français, l’exclamation rend naturellement le reproche, tandis qu’une note signale l’autre ponctuation possible.
translation_notes:
  register: Français international moderne, clair et digne. « Va en justice » est idiomatique sans être familier. La répétition « un frère ... un frère » conserve l’insistance du grec; « non-croyants » évite les connotations parfois péjoratives d’« infidèles ».
