  text: But the one who joins himself to the Lord is one spirit with him[a][b][c].
translation:
  language: fr
  text: Mais celui qui s’unit au Seigneur ne fait qu’un seul esprit avec lui[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « celui qui est uni au Seigneur ». La forme grecque peut se comprendre avec une valeur réfléchie (« s’unit ») ou passive (« est uni »).'
    reason: lexical_alternative
  - marker: b
    text: 'On pourrait aussi traduire simplement : « ne fait qu’un seul esprit ». « Avec lui » est implicite en grec. Certains comprennent ici « Esprit » avec une majuscule, mais l’expression désigne plus naturellement l’union de la personne croyante avec le Seigneur en un seul esprit.'
    reason: alternative_reading
lexical_decisions:
- source_word: κολλώμενος
  choice: s’unit à
  rationale: Le participe moyen-passif exprime ici un attachement étroit. « S’unit à » est naturel en français et maintient le parallèle avec l’union évoquée au verset précédent, sans imposer un sens exclusivement actif ou passif.
- source_word: τῷ κυρίῳ
  choice: au Seigneur
  rationale: Dans ce contexte paulinien, κύριος désigne le Seigneur Jésus et porte davantage qu’une simple idée d’autorité.
- source_word: ἓν πνεῦμα
  choice: un seul esprit
  rationale: La tournure conserve la force du numéral ἓν et exprime une unité réelle sans confondre la personne croyante avec le Seigneur.
- source_word: ὁ δὲ ... ἐστιν
  choice: Mais celui qui… est
  rationale: L’article suivi du participe est substantivé. « Celui qui » restitue naturellement en français sa valeur singulière et représentative.
theological_decisions:
- issue: Nature de l’union exprimée par « un seul esprit »
  choice: Présenter une union spirituelle réelle avec le Seigneur, tout en maintenant la distinction entre eux.
  alternative: Comprendre soit une identification mystique plus forte, soit une simple communauté d’intention.
  rationale: Le contexte oppose l’union charnelle du verset 16 à l’union avec le Seigneur. La formulation garde la force de cette unité sans suggérer une fusion ontologique.
- issue: Ajout de « avec lui »
  choice: Ajouter « avec lui » pour expliciter la relation.
  alternative: Traduire littéralement « est un seul esprit » sans complément.
  rationale: Le grec laisse le partenaire de l’unité implicite. En français, « avec lui » clarifie que l’unité concerne la personne croyante et le Seigneur, sans changer le sens contextuel.
- issue: Minuscule ou majuscule à « esprit »
  choice: Employer la minuscule.
  alternative: Écrire « Esprit » et y voir une référence directe au Saint-Esprit.
  rationale: La phrase décrit le plus naturellement l’union de la personne croyante avec le Seigneur « en un seul esprit ». Les manuscrits grecs ne permettent pas de trancher la question par la casse; l’autre lecture mérite donc une note.
translation_notes:
  register: Français international moderne, sobre et digne. « S’unit au Seigneur » est idiomatique, tandis que « un seul esprit avec lui » conserve la densité et la tension théologique du grec.
