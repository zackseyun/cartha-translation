  text: ὁ δὲ θεὸς καὶ τὸν κύριον ἤγειρεν καὶ ἡμᾶς ἐξεγερεῖ διὰ τῆς δυνάμεως αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/014.yaml
  text: And God raised the Lord and will also raise us by his power.
translation:
  language: fr
  text: Et Dieu, qui a ressuscité le Seigneur, nous ressuscitera aussi par sa puissance.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Et
  rationale: Ici, δέ assure une transition légère dans l’argumentation plutôt qu’une opposition marquée; « Et » convient au mouvement de la phrase.
- source_word: θεὸς
  choice: Dieu
  rationale: Équivalent français courant de θεός; Dieu est explicitement le sujet de l’action de ressusciter.
- source_word: τὸν κύριον
  choice: le Seigneur
  rationale: Rend le titre christologique κύριος de façon traditionnelle, claire et naturelle dans ce contexte.
- source_word: ἤγειρεν
  choice: a ressuscité
  rationale: Dans ce contexte, l’aoriste de ἐγείρω désigne l’acte passé par lequel Dieu a relevé Jésus d’entre les morts; « ressusciter » exprime clairement ce sens en français.
- source_word: ἡμᾶς
  choice: nous
  rationale: Pronom objet inclusif désignant Paul et les croyants.
- source_word: ἐξεγερεῖ
  choice: nous ressuscitera aussi
  rationale: Le futur de ἐξεγείρω est mis en parallèle avec la résurrection du Seigneur; cette formulation conserve le futur et la valeur additive de καί sans créer en français une distinction artificielle entre les deux verbes grecs.
- source_word: διὰ τῆς δυνάμεως αὐτοῦ
  choice: par sa puissance
  rationale: διά suivi du génitif exprime ici le moyen; « par sa puissance » est idiomatique et attribue clairement la résurrection à la puissance de Dieu.
theological_decisions:
- issue: Référence de la proposition au futur
  choice: La résurrection future des croyants, exprimée sans ajout explicatif
  alternative: Une élévation spirituelle métaphorique ou une vindication divine générale
  rationale: Le contexte immédiat porte sur le corps (1 Co 6.13-20), et le parallèle avec la résurrection du Seigneur favorise fortement une résurrection réelle à venir. La traduction conserve néanmoins la formulation concise du grec sans ajouter « corporelle » ni « d’entre les morts ».
translation_notes:
  register: Français international moderne, naturel et digne. La relative « qui a ressuscité le Seigneur » évite une coordination française pesante tout en maintenant Dieu comme sujet commun des deux actions et leur parallèle théologique.
