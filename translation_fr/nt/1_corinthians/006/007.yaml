id: 1CO.6.7
reference: 1 Corinthians 6:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἤδη μὲν ⸀οὖν ὅλως ἥττημα ὑμῖν ἐστιν ὅτι κρίματα ἔχετε μεθ’ ἑαυτῶν· διὰ τί οὐχὶ μᾶλλον ἀδικεῖσθε; διὰ τί οὐχὶ μᾶλλον ἀποστερεῖσθε;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/007.yaml
  text: Indeed[a], then, it is already altogether a defeat for you that you have lawsuits among yourselves[c][b]. Why not rather be wronged? Why not rather be defrauded?
translation:
  language: fr
  text: C’est donc déjà une défaite totale pour vous que d’avoir des procès entre vous[a]. Pourquoi ne pas plutôt subir l’injustice ? Pourquoi ne pas plutôt vous laisser dépouiller[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des litiges judiciaires entre vous ». Le mot grec peut désigner des affaires ou des différends portés en justice.
    reason: lexical_alternative
  - marker: b
    text: Ou « vous laisser léser » ou « vous laisser priver de vos biens ». Le verbe grec peut exprimer le fait d’être dépouillé, lésé ou privé de quelque chose.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤδη μὲν οὖν ὅλως
  choice: C’est donc déjà… totale
  rationale: « Déjà » marque un état atteint avant même l’issue des procès, « donc » rend l’inférence, et « totale » conserve la force intensive de ὅλως dans un français naturel.
- source_word: ἥττημα
  choice: défaite
  rationale: 'Le nom désigne une perte ou une défaite. « Défaite » restitue avec force le constat de Paul : l’existence même de ces procès constitue déjà un échec pour la communauté.'
- source_word: ὑμῖν ἐστιν
  choice: pour vous
  rationale: Cette formulation conserve le datif de référence sans ajouter une notion telle que la honte, qui n’est pas exprimée explicitement.
- source_word: κρίματα
  choice: procès
  rationale: Dans le contexte judiciaire immédiat, le pluriel désigne des litiges portés devant les tribunaux ; « procès » est précis et courant.
- source_word: μεθ’ ἑαυτῶν
  choice: entre vous
  rationale: Rend naturellement la réciprocité et souligne que les conflits judiciaires opposent des membres de la même communauté.
- source_word: διὰ τί οὐχὶ μᾶλλον
  choice: Pourquoi ne pas plutôt
  rationale: Conserve la forme de la question rhétorique et la valeur comparative de μᾶλλον.
- source_word: ἀδικεῖσθε
  choice: subir l’injustice
  rationale: Rend clairement le passif et la dimension morale du fait d’être traité injustement.
- source_word: ἀποστερεῖσθε
  choice: vous laisser dépouiller
  rationale: Le verbe peut évoquer le fait d’être privé d’un bien, lésé ou spolié. Cette expression française garde le passif toléré que demande la question rhétorique et convient au contexte matériel ou judiciaire.
theological_decisions:
- issue: Portée de l’évaluation des procès entre croyants
  choice: « défaite totale »
  alternative: « échec complet » ou « perte »
  rationale: 'La traduction conserve le jugement moral vigoureux de Paul sans préciser une catégorie doctrinale absente du texte : indépendamment de l’issue judiciaire, le recours à de tels procès représente déjà une défaite communautaire.'
- issue: Appel à accepter le tort ou la privation
  choice: Questions rhétoriques formulées sans explicitation supplémentaire
  alternative: Ajouter que le croyant doit toujours renoncer à tout recours juridique
  rationale: Le verset oppose ici le fait de subir l’injustice à celui d’entretenir des procès internes. La traduction ne transforme pas cette exhortation contextuelle en règle absolue que le texte n’énonce pas explicitement.
translation_notes:
  register: Français international moderne, digne et direct. La construction « que d’avoir » évite une phrase lourde tout en conservant le lien explicatif introduit par ὅτι. Les deux questions parallèles gardent la vigueur rhétorique du grec.
