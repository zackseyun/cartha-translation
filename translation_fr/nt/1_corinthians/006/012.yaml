source:
  edition: SBLGNT
  text: Πάντα μοι ἔξεστιν· ἀλλ’ οὐ πάντα συμφέρει. πάντα μοι ἔξεστιν· ἀλλ’ οὐκ ἐγὼ ἐξουσιασθήσομαι ὑπό τινος.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/012.yaml
  text: “All things are lawful for me,” but not all things are beneficial[c][b][a]. “All things are lawful for me,” but I will not be mastered by anything.
translation:
  language: fr
  text: « Tout m’est permis », mais tout n’est pas bénéfique.[a][b] « Tout m’est permis », mais je ne me laisserai dominer par rien.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, sans guillemets : Tout m’est permis. Beaucoup comprennent cette proposition comme une formule employée par les Corinthiens, que Paul cite avant de la nuancer.'
    reason: alternative_reading
  - marker: b
    text: 'Ou : avantageux, profitable ou utile.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : mais je ne serai placé sous le pouvoir de quoi que ce soit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάντα μοι ἔξεστιν
  choice: Tout m’est permis
  rationale: Cette formulation naturelle et concise conserve la portée générale et la répétition frappante du grec. « Permis » rend directement l’idée d’autorisation portée par ἔξεστιν.
- source_word: ἀλλ’ οὐ πάντα συμφέρει
  choice: mais tout n’est pas bénéfique
  rationale: συμφέρει désigne ici ce qui est avantageux, profitable ou utile. « Bénéfique » exprime cette valeur positive sans introduire une nuance exclusivement financière.
- source_word: οὐκ ἐγὼ ἐξουσιασθήσομαι
  choice: mais je ne me laisserai dominer
  rationale: Le futur passif exprime le refus d’être placé sous le pouvoir de quelque chose. La tournure pronominale française est naturelle et garde la nuance d’autorité ou de maîtrise.
- source_word: ὑπό τινος
  choice: par rien
  rationale: Le pronom indéfini grec peut viser une personne ou une chose. Dans le contexte des conduites et des appétits, « rien » est le choix français le plus naturel, tout en laissant au principe sa portée générale.
theological_decisions:
- issue: Faut-il présenter Πάντα μοι ἔξεστιν comme une formule citée des Corinthiens ?
  choice: 'Mettre la proposition répétée entre guillemets : « Tout m’est permis »'
  alternative: Ne pas employer de guillemets et lire la proposition comme une affirmation de Paul immédiatement nuancée
  rationale: 'Beaucoup comprennent cette proposition comme une devise corinthienne que Paul reprend pour la corriger. Les manuscrits grecs ne comportent pas de guillemets : la décision reste donc interprétative. La note conserve explicitement l’autre lecture.'
translation_notes:
  register: Français international moderne, simple et digne. La structure antithétique et la répétition du grec sont conservées. Les guillemets signalent la lecture probable d’une devise corinthienne, tandis qu’une note maintient l’ambiguïté réelle du texte ancien.
