  text: ἢ οὐκ οἴδατε ὅτι τὸ σῶμα ὑμῶν ναὸς τοῦ ἐν ὑμῖν ἁγίου πνεύματός ἐστιν, οὗ ἔχετε ἀπὸ θεοῦ; καὶ οὐκ ἐστὲ ἑαυτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/019.yaml
  text: Or do you not know that your body is a temple of the Holy Spirit within you[a], whom you have from God? And you are not your own[b],
translation:
  language: fr
  text: Ou bien, ne savez-vous pas que votre corps est un temple de l’Esprit Saint qui est en vous[a], et que vous tenez de Dieu ? Vous ne vous appartenez pas à vous-mêmes[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « de l’Esprit Saint présent en vous ».'
    reason: lexical_alternative
  - marker: b
    text: Le grec emploie « corps » au singulier avec « votre » au pluriel. L’expression peut désigner le corps de chacun ou avoir une portée représentative.
    reason: alternative_reading
lexical_decisions:
- source_word: ἢ
  choice: Ou bien
  rationale: Introduit avec naturel la vive relance rhétorique de Paul et la rattache à l’argument précédent.
- source_word: οὐκ οἴδατε
  choice: ne savez-vous pas
  rationale: Reproduit la formule rhétorique paulinienne courante sans en atténuer la force.
- source_word: τὸ σῶμα ὑμῶν
  choice: votre corps
  rationale: Conserve le singulier « corps » associé au possessif pluriel, comme dans le grec, sans trancher entre une portée distributive et représentative.
- source_word: ναὸς
  choice: un temple
  rationale: Rend l’idée du sanctuaire sacré visée par ναός dans une formulation française claire et traditionnelle.
- source_word: τοῦ ἐν ὑμῖν ἁγίου πνεύματός
  choice: de l’Esprit Saint qui est en vous
  rationale: Rattache le génitif à « temple » et exprime explicitement la présence de l’Esprit indiquée par ἐν ὑμῖν.
- source_word: οὗ ἔχετε ἀπὸ θεοῦ
  choice: que vous tenez de Dieu
  rationale: Le relatif renvoie personnellement à l’Esprit Saint; « tenir de Dieu » rend idiomatiquement la possession dont Dieu est la source, sans transformer explicitement ἔχετε en verbe de réception.
- source_word: καὶ οὐκ ἐστὲ ἑαυτῶν
  choice: Vous ne vous appartenez pas à vous-mêmes
  rationale: Exprime clairement en français la valeur possessive du génitif réflexif tout en conservant la portée directe de l’affirmation.
theological_decisions:
- issue: Référent et caractère personnel du pronom relatif οὗ
  choice: Le relatif renvoie à l’Esprit Saint et est rendu par « que », dont le caractère personnel ressort de l’antécédent.
  alternative: Employer une tournure plus littérale mais lourde, telle que « lequel vous avez reçu de Dieu ».
  rationale: Le lien grammatical avec ἁγίου πνεύματός établit l’Esprit Saint comme référent. La syntaxe française choisie respecte ce lien sans ajouter de formulation doctrinale.
- issue: Singulier « corps » avec destinataires au pluriel
  choice: Conserver « votre corps ».
  alternative: Traduire distributivement par « le corps de chacun de vous » ou pluraliser en « vos corps ».
  rationale: Le grec associe le singulier τὸ σῶμα au pluriel ὑμῶν. Le maintien de cette forme préserve l’ambiguïté entre compréhension distributive et représentative.
translation_notes:
  register: Français international moderne, digne et accessible. « Ou bien » porte la transition rhétorique; « que vous tenez de Dieu » évite un calque maladroit tout en restant proche du grec. Les marqueurs [a] et [b] figurent dans le texte.
