reference: 1 Corinthians 13:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸂καὶ ἐὰν⸃ ἔχω προφητείαν καὶ εἰδῶ τὰ μυστήρια πάντα καὶ πᾶσαν τὴν γνῶσιν, ⸄καὶ ἐὰν⸅ ἔχω πᾶσαν τὴν πίστιν ὥστε ὄρη ⸀μεθιστάναι, ἀγάπην δὲ μὴ ἔχω, οὐθέν εἰμι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/002.yaml
  text: And if I have prophecy and understand all mysteries and all knowledge[a], and if I have all faith so as to move mountains, but do not have love, I am nothing.
translation:
  language: fr
  text: Et si j’ai le don de prophétie, si je comprends tous les mystères et possède toute la connaissance, et si j’ai toute la foi[a], au point de déplacer des montagnes, mais que je n’ai pas l’amour, je ne suis rien.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « toute la confiance »; moins probablement « toute la fidélité ». Le mot grec peut avoir plusieurs sens, mais il désigne probablement ici une foi extraordinaire.
    reason: Alternative lexicale pour πίστις, dont l’étendue sémantique comprend la foi, la confiance et, dans certains contextes, la fidélité.
lexical_decisions:
- source_word: προφητείαν
  choice: le don de prophétie
  rationale: En français, « avoir la prophétie » ne serait pas naturel. Dans le contexte des dons spirituels, « le don de prophétie » exprime clairement le sens du nom sans le réduire à une fonction officielle.
- source_word: εἰδῶ
  choice: je comprends
  rationale: « Comprendre » convient naturellement avec « tous les mystères » et permet de distinguer ce verbe du nom γνῶσις, rendu par « connaissance ».
- source_word: μυστήρια
  choice: mystères
  rationale: Ce terme paulinien établi conserve l’idée de réalités divines cachées ou révélées sans l’aplatir en « secrets ».
- source_word: πᾶσαν τὴν γνῶσιν
  choice: toute la connaissance
  rationale: Cette traduction directe préserve l’ampleur hyperbolique de πᾶσαν et distingue la connaissance de l’acte de comprendre exprimé juste avant.
- source_word: πᾶσαν τὴν πίστιν
  choice: toute la foi
  rationale: « Foi » est ici le sens le plus probable, dans un contexte de capacité extraordinaire. L’expression demeure volontairement absolue et hyperbolique.
- source_word: ὥστε ὄρη μεθιστάναι
  choice: au point de déplacer des montagnes
  rationale: « Au point de » rend naturellement la construction de conséquence ὥστε avec l’infinitif, tout en conservant l’image frappante du grec.
- source_word: ἀγάπην
  choice: l’amour
  rationale: « Amour » est le terme moderne, large et digne qui correspond à ἀγάπη; « charité » risquerait aujourd’hui de réduire le sens à l’aide matérielle.
- source_word: οὐθέν εἰμι
  choice: je ne suis rien
  rationale: La formulation littérale est naturelle et conserve toute la force de l’affirmation de Paul.
theological_decisions:
- issue: Sens de πίστις dans le contexte d’une capacité extraordinaire à déplacer des montagnes
  choice: foi
  alternative: confiance; moins probablement fidélité
  rationale: Le contexte favorise une foi extraordinaire capable d’accomplir l’impossible, sans imposer ici une catégorie technique comme la foi qui sauve. « Confiance » reste possible selon l’étendue sémantique de πίστις, tandis que « fidélité » convient moins bien à la syntaxe et au contexte.
translation_notes:
  register: Français international moderne, clair et digne. La répétition de « si » maintient la structure cumulative du grec. « Possède » est ajouté pour obtenir une formulation française naturelle avec « toute la connaissance », sans modifier la portée du propos.
