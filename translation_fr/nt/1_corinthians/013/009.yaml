  text: For we know in part[a], and we prophesy in part.
translation:
  language: fr
  text: Car nous connaissons en partie[a] et nous prophétisons en partie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « partiellement » ; littéralement, « d’une partie ». L’expression est répétée dans les deux propositions.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ μέρους
  choice: en partie
  rationale: Cette locution signifie « en partie » ou « partiellement ». « En partie » conserve sa répétition dans les deux propositions et prépare le contraste avec ce qui est complet au verset suivant.
- source_word: γὰρ
  choice: car
  rationale: La conjonction introduit l’explication de l’affirmation précédente ; « car » exprime clairement ce lien dans un registre digne et courant.
- source_word: γινώσκομεν
  choice: nous connaissons
  rationale: Le verbe désigne ici le fait de connaître. Cette traduction directe préserve la portée épistémique du texte sans la préciser excessivement.
- source_word: καὶ
  choice: et
  rationale: La conjonction relie simplement deux propositions parallèles et en maintient la symétrie.
- source_word: προφητεύομεν
  choice: nous prophétisons
  rationale: Dans le contexte des dons spirituels, ce rendu conserve le terme prophétique sans le réduire à la prédiction de l’avenir ni à la prédication en général.
theological_decisions:
- issue: Nature de l’activité prophétique dans l’Église
  choice: « nous prophétisons », sans préciser davantage la nature de cette activité
  alternative: « nous prédisons l’avenir » ou « nous prêchons »
  rationale: Le contexte immédiat concerne les dons spirituels, et le verbe grec peut désigner une parole prophétique inspirée dans un sens plus large que la seule prédiction. Le rendu retenu préserve cette latitude théologique.
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme et la répétition du grec sont conservés.
