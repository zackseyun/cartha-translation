source:
  edition: SBLGNT
  text: νυνὶ δὲ μένει πίστις, ἐλπίς, ἀγάπη· τὰ τρία ταῦτα, μείζων δὲ τούτων ἡ ἀγάπη.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/013.yaml
  text: 'And now these three remain: faith[a], hope, and love[c][b]. But the greatest of these is love.'
translation:
  language: fr
  text: 'Mais maintenant, ces trois réalités demeurent[b] : la foi[a], l’espérance et l’amour. Or le plus grand des trois, c’est l’amour.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la confiance »; le mot grec peut exprimer la foi ou la confiance, mais « foi » est le sens habituel dans cette triade.
    reason: alternative_reading
  - marker: b
    text: Le verbe traduit par « demeurent » peut aussi signifier « subsistent » ou « continuent ».
    reason: lexical_alternative
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: Mais maintenant
  rationale: νυνί situe l’énoncé dans le présent ou dans l’état final de l’argument, tandis que δέ marque ici une transition légèrement contrastive. « Mais maintenant » reste naturel et conserve ce contraste sans le renforcer excessivement.
- source_word: μένει
  choice: demeurent
  rationale: Le singulier grec s’accorde avec une série envisagée collectivement. En français, le pluriel « demeurent » est requis avec « ces trois réalités » et exprime la continuité ou la permanence, en contraste avec ce qui disparaît.
- source_word: πίστις
  choice: la foi
  rationale: Dans la triade paulinienne avec l’espérance et l’amour, « foi » est le terme français établi et le plus probable. « Confiance » demeure une nuance possible.
- source_word: ἐλπίς
  choice: l’espérance
  rationale: « Espérance » rend la portée théologique habituelle du terme chez Paul mieux que le simple mot « espoir », tout en restant courant et compréhensible.
- source_word: ἀγάπη
  choice: l’amour
  rationale: « Amour » est le rendu moderne, large et naturel de ἀγάπη dans ce contexte; il évite l’ambiguïté contemporaine de « charité ».
- source_word: τὰ τρία ταῦτα
  choice: ces trois réalités
  rationale: Le grec substantivé signifie littéralement « ces trois ». L’ajout discret de « réalités » donne une phrase française naturelle sans définir plus précisément leur nature.
- source_word: μείζων δὲ τούτων
  choice: Or le plus grand des trois
  rationale: Bien que μείζων soit morphologiquement comparatif, la comparaison à l’intérieur d’un ensemble de trois se rend idiomatiquement en français par le superlatif « le plus grand ». « Des trois » explicite naturellement le groupe désigné par τούτων.
theological_decisions:
- issue: Sens de πίστις dans la triade
  choice: la foi
  alternative: la confiance; la fidélité
  rationale: La triade « foi, espérance, amour » favorise nettement « foi ». « Confiance » peut en préciser une dimension, mais « fidélité » orienterait ici le terme vers une qualité morale moins probable.
- issue: Force de μείζων
  choice: le plus grand des trois, c’est l’amour
  alternative: l’amour est plus grand que les autres
  rationale: Le comparatif grec établit la prééminence de l’amour parmi les trois. Le superlatif français restitue cette relation clairement sans expliquer pourquoi l’amour est suprême.
- issue: Portée temporelle de μένει
  choice: demeurent
  alternative: subsistent; continuent
  rationale: Le texte affirme leur continuité dans le cadre du contraste précédent, mais ne précise pas à lui seul toutes les modalités eschatologiques de cette permanence. « Demeurent » préserve cette ouverture.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la structure rhétorique brève du grec. « Or » dans la seconde proposition marque la nouvelle mise en relief portée par δέ sans créer une opposition forte.
