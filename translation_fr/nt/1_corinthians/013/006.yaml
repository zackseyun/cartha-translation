  text: οὐ χαίρει ἐπὶ τῇ ἀδικίᾳ, συγχαίρει δὲ τῇ ἀληθείᾳ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/006.yaml
  text: it does not rejoice in unrighteousness, but rejoices with the truth.
translation:
  language: fr
  text: Il ne se réjouit pas de l’injustice[a], mais il se réjouit avec la vérité[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « du mal » ou « d’une conduite injuste ».
    reason: lexical_alternative
  - marker: b
    text: Ou « se réjouit de la vérité ». Le verbe grec composé peut exprimer le fait de partager la joie avec quelqu’un ou de se réjouir à propos de quelque chose.
    reason: lexical_alternative
lexical_decisions:
- source_word: χαίρει
  choice: se réjouit
  rationale: « Se réjouir » rend naturellement l’idée de joie exprimée par χαίρω et maintient le parallélisme verbal avec συγχαίρει.
- source_word: ἐπὶ τῇ ἀδικίᾳ
  choice: de l’injustice
  rationale: Avec χαίρω, ἐπί suivi du datif indique ici le motif ou l’occasion de la joie. « Se réjouir de » est idiomatique en français. « Injustice » conserve la portée morale large de ἀδικία, tout en laissant « mal » et « conduite injuste » comme possibilités en note.
- source_word: συγχαίρει
  choice: se réjouit avec
  rationale: Le préfixe συν- exprime une joie partagée. « Se réjouit avec » préserve cette nuance, même si le complément peut aussi être compris comme l’objet de la joie.
- source_word: δὲ
  choice: mais
  rationale: « Mais » exprime clairement le contraste entre ce dont l’amour ne se réjouit pas et ce avec quoi il se réjouit.
- source_word: τῇ ἀληθείᾳ
  choice: la vérité
  rationale: « La vérité » conserve l’article grec et le contraste conceptuel avec ἀδικία, sans préciser indûment s’il s’agit de paroles vraies, d’une conduite conforme à la vérité ou de la vérité au sens plus large.
theological_decisions:
- issue: Sens de ἀδικία dans le contraste éthique paulinien
  choice: injustice
  alternative: mal, conduite injuste
  rationale: « Injustice » appartient au champ justice/injustice et peut désigner en français moderne ce qui est moralement contraire au juste. La note préserve la possibilité d’un sens plus général, « mal », afin de ne pas limiter le terme aux seules injustices sociales ou judiciaires.
- issue: Relation exprimée par συγχαίρει avec τῇ ἀληθείᾳ
  choice: se réjouit avec la vérité
  alternative: se réjouit de la vérité
  rationale: La traduction principale rend explicitement la valeur associative du composé συγχαίρω. La variante reconnaît que le datif peut aussi être compris comme indiquant ce qui suscite la joie, sans trancher une ambiguïté réelle.
translation_notes:
  register: Français moderne, clair et digne. La répétition de « se réjouit » reproduit le parallélisme rhétorique du grec. Le pronom masculin singulier reprend « l’amour » (masculin en français) dans le contexte immédiat.
