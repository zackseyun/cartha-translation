reference: 1 Corinthians 13:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὅτε ἤμην νήπιος, ⸂ἐλάλουν ὡς νήπιος, ἐφρόνουν ὡς νήπιος, ἐλογιζόμην ὡς νήπιος⸃· ⸀ὅτε γέγονα ἀνήρ, κατήργηκα τὰ τοῦ νηπίου.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/011.yaml
  text: When I was a child[a], I spoke like a child, I thought like a child, I reasoned like a child. When I became a man, I put away the things of the child.
translation:
  language: fr
  text: Quand j’étais enfant, je parlais comme un enfant, je pensais comme un enfant, je raisonnais comme un enfant. Quand je suis devenu un homme, j’ai mis de côté ce qui était propre à l’enfant[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les choses de l’enfant » ; autres traductions possibles : « les comportements enfantins » ou « les façons d’agir d’un enfant ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: νήπιος
  choice: enfant
  rationale: Le terme désigne un jeune enfant et peut évoquer son immaturité. « Enfant » rend naturellement la métaphore sans la limiter au nourrisson.
- source_word: ἐλάλουν
  choice: je parlais
  rationale: Rend directement l’acte de parler et conserve le rythme de la triple répétition.
- source_word: ἐφρόνουν
  choice: je pensais
  rationale: Dans cette série, « je pensais » exprime clairement la manière de penser propre à l’enfant.
- source_word: ἐλογιζόμην
  choice: je raisonnais
  rationale: Distingue le raisonnement réfléchi de la pensée exprimée par ἐφρόνουν, tout en respectant la progression rhétorique.
- source_word: γέγονα
  choice: je suis devenu
  rationale: Le passé composé est naturel en français après « quand » et présente le passage à l’état adulte.
- source_word: ἀνήρ
  choice: un homme
  rationale: Le grec emploie explicitement un nom masculin désignant un homme adulte, en contraste avec l’enfant.
- source_word: κατήργηκα
  choice: j’ai mis de côté
  rationale: Dans la métaphore du passage à l’âge adulte, l’expression signifie que les réalités propres à l’enfance ne gouvernent plus la conduite. Cette formulation française reste claire sans suggérer leur destruction matérielle.
- source_word: τὰ τοῦ νηπίου
  choice: ce qui était propre à l’enfant
  rationale: Cette tournure naturelle conserve l’indétermination de l’expression grecque, littéralement « les choses de l’enfant », sans la réduire seulement aux actes ou aux habitudes.
theological_decisions:
- issue: Contraste genré exprimé par ἀνήρ
  choice: un homme
  alternative: un adulte
  rationale: « Un homme » préserve le masculin singulier du texte grec et l’exemple autobiographique de Paul. Le contexte illustre la maturité et n’affirme aucune supériorité masculine.
- issue: Portée de τὰ τοῦ νηπίου
  choice: ce qui était propre à l’enfant
  alternative: les comportements enfantins
  rationale: Le grec demeure général. La traduction évite de décider s’il s’agit uniquement de comportements, de raisonnements, de paroles ou de l’ensemble des réalités liées à l’enfance.
translation_notes:
  register: Français international moderne, simple et digne. La répétition de « comme un enfant » est conservée pour reproduire la cadence du grec. « Quand » est préféré à « lorsque » pour une expression courante sans être familière.
