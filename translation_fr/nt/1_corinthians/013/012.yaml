    issue: « mais alors, ce sera face à face »
    rationale: 'La proposition grecque sous-entend βλέπομεν : « mais alors [nous verrons] face à face ». La formulation actuelle fait de « face à face » un simple état et perd l’action de voir. Il convient d’écrire « mais alors nous verrons face à face ».'
  - severity: low
