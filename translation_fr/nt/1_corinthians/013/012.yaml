  text: βλέπομεν γὰρ ἄρτι δι’ ἐσόπτρου ἐν αἰνίγματι, τότε δὲ πρόσωπον πρὸς πρόσωπον· ἄρτι γινώσκω ἐκ μέρους, τότε δὲ ἐπιγνώσομαι καθὼς καὶ ἐπεγνώσθην.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/012.yaml
  text: For now we see in a mirror[a], dimly, but then face to face. Now I know in part, but then I will know fully, just as I also have been fully known.
translation:
  language: fr
  text: Car maintenant, nous voyons au moyen d’un miroir, de manière énigmatique[a], mais alors nous verrons face à face. Maintenant, je connais en partie, mais alors, je connaîtrai pleinement, tout comme moi aussi, j’ai été pleinement connu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « dans une énigme ». Le grec souligne une perception indirecte, obscure ou difficile à déchiffrer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: βλέπομεν
  choice: nous voyons
  rationale: Conserve la métaphore visuelle et rend naturellement le présent de l’indicatif.
- source_word: ἄρτι
  choice: maintenant
  rationale: Marque clairement l’état présent, en contraste avec τότε, « alors ».
- source_word: δι’ ἐσόπτρου
  choice: au moyen d’un miroir
  rationale: Rend la valeur instrumentale ou médiatrice de διά avec le génitif sans suggérer que l’on regarde matériellement à travers un miroir.
- source_word: ἐν αἰνίγματι
  choice: de manière énigmatique
  rationale: Préserve le sens d’αἴνιγμα — une perception indirecte et difficile à déchiffrer — dans une formulation française naturelle.
- source_word: πρόσωπον πρὸς πρόσωπον
  choice: face à face
  rationale: Expression française consacrée qui traduit fidèlement l’idée d’une rencontre directe, sans médiation.
- source_word: γινώσκω ἐκ μέρους
  choice: je connais en partie
  rationale: Reproduit simplement l’expression idiomatique grecque et le parallélisme du passage.
- source_word: ἐπιγνώσομαι
  choice: je connaîtrai pleinement
  rationale: Exprime une connaissance plus pleine en contraste avec la connaissance partielle, sans affirmer une omniscience exhaustive.
- source_word: καθὼς καὶ ἐπεγνώσθην
  choice: tout comme j’ai moi-même été pleinement connu
  rationale: Maintient la correspondance lexicale avec ἐπιγνώσομαι, rend καί par « moi-même » et laisse l’auteur de la connaissance implicite comme en grec.
theological_decisions:
- issue: Portée de la connaissance future exprimée par ἐπιγνώσομαι
  choice: je connaîtrai pleinement
  alternative: je connaîtrai tout / je connaîtrai parfaitement
  rationale: Le texte oppose la connaissance présente, partielle, à une connaissance future plus pleine, sans déclarer que le croyant possédera une connaissance exhaustive ou égale à celle de Dieu.
- issue: Identité de celui qui a pleinement connu Paul
  choice: laisser l’agent du passif implicite
  alternative: ajouter « par Dieu »
  rationale: Le contexte peut orienter vers Dieu, mais le grec ne nomme pas l’agent; la traduction conserve donc cette implicitation et l’ambiguïté formelle.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme antithétique « maintenant… mais alors » est conservé. « Au moyen d’un miroir » évite l’image trompeuse d’un regard à travers du verre, tandis que « de manière énigmatique » maintient la force lexicale d’αἴνιγμα.
