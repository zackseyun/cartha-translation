reference: 1 Corinthians 13:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἐὰν ταῖς γλώσσαις τῶν ἀνθρώπων λαλῶ καὶ τῶν ἀγγέλων, ἀγάπην δὲ μὴ ἔχω, γέγονα χαλκὸς ἠχῶν ἢ κύμβαλον ἀλαλάζον.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/001.yaml
  text: If I speak in the tongues of men and of angels[a], but do not have love[c][b], I have become sounding bronze or a clashing cymbal.
translation:
  language: fr
  text: Si je parle dans les langues des êtres humains et des anges[a], mais sans avoir l’amour, je suis devenu un bronze qui résonne[b] ou une cymbale retentissante.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans les langages ». Le mot grec peut désigner des langues ou des langages ; « langues » conserve aussi le lien avec la discussion du parler en langues à Corinthe.
    reason: lexical_alternative
  - marker: b
    text: Ou « un cuivre qui résonne », voire « un gong retentissant ». Le grec évoque un métal sonore sans nommer avec certitude un instrument précis.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐὰν
  choice: Même si
  rationale: Dans cette série d’hypothèses rhétoriques, « même si » exprime naturellement en français la condition poussée à l’extrême, sans affirmer que le cas se réalise.
- source_word: ταῖς γλώσσαις
  choice: dans les langues
  rationale: γλῶσσα peut désigner la langue comme organe ou comme langage. « Langues » conserve en français le lien avec la discussion corinthienne du parler en langues tout en laissant ouverte la nuance de langages.
- source_word: τῶν ἀνθρώπων
  choice: des êtres humains
  rationale: ἄνθρωποι désigne ici l’humanité par contraste avec les anges, et non les hommes de sexe masculin. Cette formulation rend explicitement ce contraste en français moderne.
- source_word: λαλῶ
  choice: je parle
  rationale: Le présent du subjonctif dans la protase conditionnelle se rend naturellement par le présent français.
- source_word: τῶν ἀγγέλων
  choice: des anges
  rationale: Le contraste avec les êtres humains favorise nettement le sens d’êtres célestes plutôt que celui de simples messagers.
- source_word: ἀγάπην
  choice: l’amour
  rationale: « Amour » est le terme français courant, digne et suffisamment large; « charité » pourrait aujourd’hui évoquer surtout l’aumône ou une vertu formulée dans un registre confessionnel.
- source_word: δὲ μὴ ἔχω
  choice: mais que je n’ai pas
  rationale: La formulation conserve l’opposition marquée par δέ et exprime idiomatiquement l’absence de l’amour.
- source_word: γέγονα
  choice: je suis devenu
  rationale: Le parfait grec présente un état résultant; « je suis devenu » en conserve mieux la valeur que le simple « je suis ».
- source_word: χαλκὸς ἠχῶν
  choice: un bronze qui résonne
  rationale: χαλκός nomme du cuivre ou du bronze, éventuellement un objet fait de ce métal, sans identifier précisément un instrument. La formulation garde l’image sonore et son indétermination.
- source_word: κύμβαλον ἀλαλάζον
  choice: une cymbale retentissante
  rationale: κύμβαλον désigne une cymbale et ἀλαλάζον un son fort et éclatant. « Retentissante » restitue ce caractère sonore sans ajouter un geste précis non exprimé.
theological_decisions:
- issue: Sens des « langues des êtres humains et des anges »
  choice: Conserver le contraste rhétorique entre langues humaines et angéliques sans préciser le statut de ces dernières.
  alternative: Comprendre soit de véritables langues célestes, soit une hyperbole désignant la parole la plus élevée qui soit.
  rationale: Le texte ne tranche pas entre une référence littérale et une amplification rhétorique; la traduction préserve donc cette tension.
- issue: Portée de ἀγάπη
  choice: Traduire simplement par « l’amour ».
  alternative: Employer « la charité ».
  rationale: Le grec désigne ici la réalité centrale développée dans tout le chapitre. « Amour » reste naturel et n’impose pas une définition confessionnelle ou le sens moderne restreint d’aide aux pauvres.
- issue: Nature du « bronze qui résonne »
  choice: Ne pas identifier un instrument particulier.
  alternative: Traduire par « gong », « cloche » ou « instrument de bronze ».
  rationale: Le grec nomme un métal sonore ou un objet de ce métal, mais ne permet pas d’établir avec certitude l’instrument envisagé.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase garde l’intensification rhétorique, le contraste entre humanité et anges, ainsi que l’image volontairement sonore. « Êtres humains » évite l’ambiguïté de « hommes » en français contemporain.
