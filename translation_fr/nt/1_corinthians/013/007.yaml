reference: 1 Corinthians 13:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: πάντα στέγει, πάντα πιστεύει, πάντα ἐλπίζει, πάντα ὑπομένει.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/007.yaml
  text: It bears all things[a], believes all things, hopes all things[b], endures all things.
translation:
  language: fr
  text: Il supporte tout[a], croit tout[b], espère tout, endure tout.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « couvre tout »; στέγει peut évoquer le fait de couvrir ou de protéger aussi bien que celui de supporter.
    reason: lexical_alternative
  - marker: b
    text: Ou « fait confiance en toute circonstance »; il ne s'agit pas de crédulité, mais d'une disposition à faire confiance.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα
  choice: tout
  rationale: Le neutre pluriel accusatif a ici une portée globale avec chacun des quatre verbes. La répétition de « tout » reproduit avec naturel en français l'anaphore et l'ampleur rhétorique du grec.
- source_word: στέγει
  choice: supporte
  rationale: στέγω peut signifier « couvrir, protéger » ou, par extension, « supporter ». « Supporte » convient au contexte des qualités persévérantes de l'amour et maintient la formulation concise, tandis que le sens possible de « couvrir » est signalé en note.
- source_word: πιστεύει
  choice: croit
  rationale: πιστεύω signifie couramment « croire » ou « faire confiance ». « Croit » reste lexicalement direct et préserve le parallélisme serré; la nuance de confiance est donnée en note afin de ne pas laisser entendre une crédulité irréfléchie.
- source_word: ἐλπίζει
  choice: espère
  rationale: Le présent décrit une disposition caractéristique. « Espère » est la traduction directe et conserve le rythme lapidaire du grec.
- source_word: ὑπομένει
  choice: endure
  rationale: ὑπομένω exprime le fait de tenir sous la pression, d'endurer ou de persévérer. « Endure » est concis, digne et garde au dernier membre sa force culminante.
theological_decisions:
- issue: Portée des quatre emplois de πάντα appliqués à l'amour
  choice: Conserver quatre fois « tout » comme expression rhétorique de la constance sans réserve de l'amour.
  alternative: Comprendre ces formulations comme affirmant que l'amour approuve tout ou croit naïvement n'importe quoi.
  rationale: Le contexte décrit poétiquement le caractère de l'amour. La traduction garde la portée universelle et la tension du texte sans y introduire l'idée d'une crédulité ou d'une absence de discernement moral.
translation_notes:
  register: Français international moderne, sobre et digne. La répétition exacte de « tout » et les quatre verbes brefs préservent l'anaphore et le rythme de l'original. « Endure » est retenu malgré sa fréquence moindre dans la conversation, car il est clair dans ce registre et distingue ὑπομένει de στέγει.
