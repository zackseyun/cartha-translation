translation:
  language: fr
  text: Il n’agit pas de façon inconvenante[a], il ne cherche pas son propre intérêt[b], il ne s’irrite pas[c], il ne tient pas compte du mal[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ne se conduit pas de manière honteuse » ou « n’agit pas avec indécence ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « ne cherche pas ce qui est à lui » ; autrement dit, il ne recherche pas égoïstement ses propres intérêts.'
    reason: lexical_alternative
  - marker: c
    text: Ou « ne se laisse pas provoquer ». Le grec ne dit pas explicitement « facilement ».
    reason: alternative_reading
  - marker: d
    text: 'Ou « ne met pas le mal en compte ». Dans ce contexte, on peut aussi comprendre : « ne tient pas le compte des torts subis ».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσχημονεῖ
  choice: agit de façon inconvenante
  rationale: Le verbe désigne une conduite indécente, honteuse ou contraire aux convenances. Cette formulation conserve sa portée morale et sociale sans la réduire à la seule impolitesse.
- source_word: ζητεῖ τὰ ἑαυτῆς
  choice: cherche son propre intérêt
  rationale: L’expression signifie littéralement « cherche ce qui est à elle ». En français courant, « son propre intérêt » rend clairement l’idée de recherche égoïste sans introduire l’idée plus précise d’imposer sa volonté.
- source_word: παροξύνεται
  choice: s’irrite
  rationale: Le verbe exprime le fait d’être vivement stimulé, irrité ou poussé à la colère. « S’irrite » est naturel et n’ajoute pas l’adverbe « facilement », absent du grec.
- source_word: λογίζεται τὸ κακόν
  choice: tient compte du mal
  rationale: λογίζεται relève du calcul ou de la mise en compte, tandis que τὸ κακόν peut désigner le mal ou le tort. La formulation française préserve l’image comptable de manière idiomatique, tout en laissant la note expliciter le sens relationnel possible.
- source_word: ἀγάπη (sujet implicite repris du contexte)
  choice: il
  rationale: Le sujet est « l’amour » dans le contexte précédent. Comme « amour » est masculin en français, sa reprise naturelle se fait par « il ».
theological_decisions:
- issue: Faut-il intensifier παροξύνεται en ajoutant « facilement » ?
  choice: il ne s’irrite pas
  alternative: il ne se met pas facilement en colère
  rationale: Aucun adverbe correspondant à « facilement » ne figure dans le grec. La traduction évite donc cette précision interprétative.
- issue: Faut-il expliciter λογίζεται τὸ κακόν comme la tenue d’un registre des torts subis ?
  choice: il ne tient pas compte du mal
  alternative: il ne tient pas le compte des torts subis
  rationale: Le grec emploie un verbe comptable et un objet singulier, « le mal ». La traduction principale conserve cette forme et son ambiguïté, tandis que la note signale l’interprétation relationnelle courante sans l’imposer.
translation_notes:
  register: Français international moderne, clair et digne. La répétition de « il » maintient le rythme de l’énumération et reprend naturellement « l’amour », sujet établi par le contexte. Les formulations évitent à la fois l’archaïsme et les expansions confessionnelles.
