reference: 1 Corinthians 13:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἡ ἀγάπη μακροθυμεῖ, χρηστεύεται ἡ ἀγάπη, οὐ ζηλοῖ ⸂ἡ ἀγάπη⸃, οὐ περπερεύεται, οὐ φυσιοῦται,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/004.yaml
  text: Love is patient[a], love is kind. It does not envy, it does not boast[b], it is not puffed up.
translation:
  language: fr
  text: L’amour est patient, l’amour agit avec bonté. Il n’est pas envieux[a], il ne se vante pas, il ne s’enfle pas d’orgueil[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « il n’est pas jaloux ». Le verbe grec peut aussi exprimer le zèle, mais le contexte négatif indique ici l’envie ou la jalousie.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « il n’est pas orgueilleux ». Le grec emploie l’image de quelqu’un qui se gonfle sous l’effet de l’orgueil.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγάπη
  choice: l’amour
  rationale: « Amour » rend le sens large de ἀγάπη dans ce passage éthique et théologique, sans le réduire à l’aumône ou à la bienfaisance comme pourrait le faire « charité » en français moderne.
- source_word: μακροθυμεῖ
  choice: est patient
  rationale: Le verbe exprime une patience durable, notamment envers autrui. Cette formulation est claire, naturelle et fidèle à la valeur éthique du présent grec.
- source_word: χρηστεύεται
  choice: agit avec bonté
  rationale: Ce verbe rare décrit l’exercice concret de la bonté. « Agit avec bonté » en conserve la valeur active plus nettement que le simple adjectif « est bon ».
- source_word: ζηλοῖ
  choice: n’est pas envieux
  rationale: Dans cette série négative, le verbe désigne vraisemblablement l’envie ou la jalousie plutôt qu’un zèle positif. « Envieux » exprime clairement le désir jaloux de ce qu’un autre possède.
- source_word: περπερεύεται
  choice: ne se vante pas
  rationale: Le verbe évoque l’ostentation et la vantardise. Cette traduction est actuelle, digne et directement compréhensible.
- source_word: φυσιοῦται
  choice: ne s’enfle pas d’orgueil
  rationale: Cette expression conserve l’image paulinienne de quelqu’un qui se gonfle sous l’effet de l’orgueil, tout en en explicitant naturellement le sens en français.
- source_word: ἡ ἀγάπη … ἡ ἀγάπη … ⸂ἡ ἀγάπη⸃
  choice: L’amour… l’amour… Il
  rationale: La répétition initiale est gardée pour son effet rhétorique. Le pronom « Il » reprend ensuite naturellement « l’amour » et évite une répétition pesante dans la série négative.
- source_word: οὐ
  choice: n’est pas / ne se… pas
  rationale: Les différentes formes de négation française sont adaptées à la syntaxe propre de chaque verbe tout en reproduisant la succession catégorique des négations grecques.
theological_decisions:
- issue: Traduction de ἀγάπη dans ce passage bien connu
  choice: amour
  alternative: charité
  rationale: « Amour » conserve l’étendue relationnelle, morale et théologique du terme grec. En français contemporain, « charité » risque d’évoquer surtout l’aide matérielle ou l’aumône.
- issue: Sens de ζηλοῖ dans un contexte négatif
  choice: n’est pas envieux
  alternative: n’est pas jaloux
  rationale: Le contexte exclut le sens positif de « manifester du zèle ». « Envieux » désigne plus précisément ici la convoitise ressentie devant le bien d’autrui, tandis que « jaloux » reste une autre traduction possible.
- issue: Maintien de la métaphore de φυσιοῦται
  choice: ne s’enfle pas d’orgueil
  alternative: n’est pas orgueilleux
  rationale: Le maintien de l’image respecte l’expression caractéristique de Paul sans imposer une interprétation doctrinale particulière; l’ajout « d’orgueil » rend la métaphore immédiatement intelligible.
translation_notes:
  register: Français international moderne, naturel et digne. La cadence brève de l’énumération est conservée, de même que la répétition rhétorique initiale de « l’amour » et la métaphore paulinienne de l’enflure orgueilleuse.
