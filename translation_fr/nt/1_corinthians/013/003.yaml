reference: 1 Corinthians 13:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸂καὶ ἐὰν⸃ ψωμίσω πάντα τὰ ὑπάρχοντά μου, ⸄καὶ ἐὰν⸃ παραδῶ τὸ σῶμά μου, ἵνα ⸀καυθήσομαι, ἀγάπην δὲ μὴ ἔχω, οὐδὲν ὠφελοῦμαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/003.yaml
  text: And if I give away all my possessions[a], and if I hand over my body so that I may be burned, but do not have love, I gain nothing.
translation:
  language: fr
  text: Et si je distribue tous mes biens, et si je livre mon corps pour être brûlé[a], mais si je n’ai pas l’amour, cela ne me sert à rien.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Certains manuscrits ont : « afin que je puisse me vanter » au lieu de : « pour être brûlé ».'
    reason: textual_variant
lexical_decisions:
- source_word: ψωμίσω
  choice: je distribue
  rationale: Le verbe désigne ici la distribution, portion par portion, de ses ressources. « Distribuer » exprime naturellement l’action de donner ses biens à d’autres sans ajouter de bénéficiaire absent du grec.
- source_word: πάντα τὰ ὑπάρχοντά μου
  choice: tous mes biens
  rationale: L’expression renvoie à l’ensemble des possessions matérielles. « Tous mes biens » est clair, courant et concis en français moderne.
- source_word: παραδῶ τὸ σῶμά μου
  choice: je livre mon corps
  rationale: « Livrer » conserve l’idée de remettre ou d’abandonner son corps sans préciser une forme de sacrifice que le texte ne formule pas.
- source_word: ἵνα καυθήσομαι
  choice: pour être brûlé
  rationale: Cette formulation française rend naturellement le but ou le résultat visé par ἵνα et le passif de καίω, conformément au texte du SBLGNT.
- source_word: ἀγάπην
  choice: l’amour
  rationale: « L’amour » est le terme moderne et général qui convient à ἀγάπη dans ce passage, sans le réduire à l’aumône ni employer l’ancien « charité ».
- source_word: οὐδὲν ὠφελοῦμαι
  choice: je n’y gagne rien
  rationale: Cette expression idiomatique garde l’accent du passif grec sur l’absence totale de bénéfice personnel.
- source_word: καὶ ἐὰν ... καὶ ἐὰν
  choice: Et si… et si
  rationale: La répétition de la construction conditionnelle est conservée afin de respecter la progression rhétorique de Paul.
theological_decisions:
- issue: Variante textuelle dans la proposition introduite par ἵνα
  choice: Le texte principal traduit καυθήσομαι par « pour être brûlé » conformément au SBLGNT.
  alternative: Certains manuscrits portent καυχήσωμαι, « pour pouvoir m’en vanter » ou « afin que je me glorifie ».
  rationale: La leçon retenue par l’édition source doit paraître dans le texte principal. Comme la variante modifie sensiblement l’interprétation — exposition du corps au feu ou motif de fierté — elle est signalée en note plutôt que résolue silencieusement.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe répétée conserve l’élan des hypothèses successives, tandis que « mais que je n’aie pas l’amour » maintient clairement le contraste central. Le marqueur de note est placé après la proposition concernée par la variante textuelle.
