    rationale: Le grec oppose les hypothèses par ἀγάπην δὲ μὴ ἔχω. En français, « mais si je n’ai pas l’amour » rend plus clairement cette condition que « mais que je n’aie pas l’amour ».
  - severity: low
    issue: Référent de « y » imprécis
    rationale: « Je n’y gagne rien » est possible, mais « cela ne me sert à rien » exprime sans pronom à référent diffus le sens de οὐδὲν ὠφελοῦμαι.
