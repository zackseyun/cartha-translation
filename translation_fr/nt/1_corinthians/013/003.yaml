  to: Et si je distribue tous mes biens, et si je livre mon corps pour être brûlé[a], mais si je n’ai pas l’amour, cela ne me sert à rien.
  rationale: La révision conserve la structure répétée « et si … et si », la leçon principale du SBLGNT et son alternative textuelle. Elle rend plus explicite en français moderne la condition oppositive finale et l’absence de bénéfice, sans ajouter d’interprétation.
