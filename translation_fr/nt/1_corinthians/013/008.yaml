review_pass:
  verdict: revise
  source_fidelity: Le projet rend correctement l’affirmation principale et conserve la distinction entre παύσονται (« cesseront ») et les deux occurrences de καταργέω. Toutefois, « prendront/prendra fin » atténue la voix passive et la nuance de mise hors fonction de καταργέω, que l’audit anglais rend par « will be set aside ». Une formulation passive française est préférable. La reprise explicite de la construction hypothétique elliptique εἴτε... εἴτε... rend également mieux la série grecque.
  naturalness: Le français est globalement naturel et le registre est approprié. « L’amour ne faillit jamais » est idiomatique dans un registre légèrement soutenu mais accessible. La formulation révisée avec « S’il y a... » est claire, sans alourdir excessivement la répétition rhétorique du grec.
  terminology: « Amour », « prophéties », « langues » et « connaissance » conviennent. « Langues » maintient le terme du contexte sans décider de la nature du phénomène. « Seront rendues sans effet » rend καταργέω de manière plus précise que « prendront fin », sans imposer l’idée que les réalités elles-mêmes seraient annihilées.
  issues:
  - severity: medium
    issue: Rendu de καταργηθήσονται / καταργηθήσεται par « prendront/prendra fin »
    rationale: Le grec emploie deux fois le même futur passif de καταργέω, qui évoque l’abolition ou la mise hors fonction. « Prendre fin » est possible au sens large, mais gomme la voix passive et rapproche indûment ce verbe de παύσονται, rendu à juste titre par « cesseront ».
  - severity: low
    issue: La structure εἴτε... εἴτε... εἴτε... n’est pas exprimée
    rationale: La succession française de noms peut se comprendre, mais la construction grecque introduit explicitement des cas éventuels (« qu’il y ait / s’il y a »). L’expliciter améliore la fidélité sans ajouter d’interprétation.
  - severity: low
    issue: 'Note b : « langages » comme alternative à « langues »'
    rationale: « Langages » est moins naturel ici et ne clarifie pas réellement l’alternative française. « Langues parlées » indique mieux la possibilité lexicale tout en laissant ouverte la question de la référence exacte.
  revised_text: L’amour ne faillit jamais[a]. Mais, s’il y a des prophéties, elles seront rendues sans effet ; s’il y a des langues[b], elles cesseront ; s’il y a de la connaissance, elle sera rendue sans effet[c].
