source:
  edition: SBLGNT
  text: Ἡ ἀγάπη οὐδέποτε ⸀πίπτει. εἴτε δὲ προφητεῖαι, καταργηθήσονται· εἴτε γλῶσσαι, παύσονται· εἴτε γνῶσις, καταργηθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/008.yaml
  text: Love never fails[a]. But whether there are prophecies, they will be set aside; whether tongues, they will cease; whether knowledge[c][b], it will be set aside.
translation:
  language: fr
  text: L’amour ne faillit jamais[a]. Mais, s’il y a des prophéties, elles seront rendues sans effet ; s’il y a des langues[b], elles cesseront ; s’il y a de la connaissance, elle sera rendue sans effet[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « L’amour ne tombe jamais » ou « L’amour ne prend jamais fin ».
    reason: lexical_alternative
  - marker: b
    text: Le mot grec peut aussi désigner des « langues parlées ».
    reason: alternative_reading
  - marker: c
    text: Le verbe rendu par « seront rendues sans effet » est le même dans la proposition sur les prophéties et dans celle sur la connaissance.
    reason: cross_reference
lexical_decisions:
- source_word: ἀγάπη
  choice: amour
  rationale: « Amour » est l’équivalent français courant et suffisamment large du terme grec dans ce passage.
- source_word: οὐδέποτε
  choice: jamais
  rationale: Rend directement la négation absolue du grec dans un français naturel.
- source_word: πίπτει
  choice: ne faillit jamais
  rationale: Dans ce contexte, le verbe est employé de manière non spatiale et souligne la permanence et la fiabilité de l’amour, sans le confondre avec les verbes de cessation qui suivent.
- source_word: προφητεῖαι
  choice: prophéties
  rationale: Terme français usuel qui peut désigner ici les manifestations ou paroles prophétiques sans en préciser davantage la nature.
- source_word: καταργηθήσονται / καταργηθήσεται
  choice: prendront fin / prendra fin
  rationale: Cette formulation naturelle indique la cessation de ces réalités ou de leur fonction. Le même choix lexical est conservé dans les deux propositions où apparaît καταργέω.
- source_word: γλῶσσαι
  choice: langues
  rationale: « Langues » conserve le terme traditionnel du contexte de 1 Corinthiens 12–14 tout en laissant ouverte la nature exacte du phénomène.
- source_word: παύσονται
  choice: cesseront
  rationale: Rend clairement le sens de cessation tout en maintenant une distinction verbale avec καταργέω.
- source_word: γνῶσις
  choice: connaissance
  rationale: Équivalent courant qui correspond au développement sur la connaissance partielle dans les versets suivants.
theological_decisions:
- issue: Sens de πίπτει dans l’affirmation sur l’amour
  choice: L’amour ne faillit jamais
  alternative: L’amour ne tombe jamais ; l’amour ne prend jamais fin
  rationale: « Ne faillit jamais » exprime la permanence et la fiabilité de l’amour dans le contraste avec les dons temporaires, tout en préservant dans une note les autres nuances possibles du verbe.
- issue: Sens de γλῶσσαι dans ce chapitre
  choice: langues
  alternative: langages ; paroles en langues
  rationale: « Langues » maintient le vocabulaire contextuel de Paul sans trancher la question débattue de la nature précise de ce don.
- issue: Relation entre les deux occurrences de καταργέω
  choice: Employer « prendre fin » dans les deux propositions
  alternative: être aboli ; être rendu inopérant ; être écarté
  rationale: La répétition française reflète la répétition grecque et évite de suggérer deux processus différents pour les prophéties et la connaissance.
translation_notes:
  register: Français international moderne, naturel et digne. « Ne faillit jamais » conserve une légère élévation de registre adaptée au passage tout en restant compréhensible. La ponctuation met en relief les trois éléments contrastés sans ajouter au texte une interprétation confessionnelle.
