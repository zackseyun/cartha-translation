revisions:
- from: L’amour ne faillit jamais[a]. Mais les prophéties prendront fin ; les langues[b] cesseront ; la connaissance prendra fin[c].
  to: L’amour ne faillit jamais[a]. Mais, s’il y a des prophéties, elles seront rendues sans effet ; s’il y a des langues[b], elles cesseront ; s’il y a de la connaissance, elle sera rendue sans effet[c].
  rationale: La révision conserve les choix terminologiques fondamentaux du projet, mais rend les deux passifs de καταργέω par la même expression passive (« être rendu sans effet »), distincte de « cesser » pour παύω. Elle restitue aussi, en français naturel, la série conditionnelle elliptique introduite par εἴτε. Les notes sont conservées, avec une clarification de l’alternative associée à γλῶσσαι.
