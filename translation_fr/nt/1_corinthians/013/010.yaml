id: 1CO.13.10
reference: 1 Corinthians 13:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὅταν δὲ ἔλθῃ τὸ τέλειον, ⸀τὸ ἐκ μέρους καταργηθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/010.yaml
  text: But when the perfect comes[b][a], the partial will be set aside.
translation:
  language: fr
  text: Mais quand viendra ce qui est parfait[a], ce qui est partiel prendra fin[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ce qui est complet » ou « ce qui est arrivé à maturité ». L’expression grecque est diversement comprise comme désignant la perfection, l’état complet, la maturité ou l’accomplissement final, par opposition à l’état présent qui n’est que partiel.
    reason: alternative_reading
  - marker: b
    text: Ou « sera aboli », « disparaîtra » ou « sera rendu sans effet ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: quand
  rationale: Introduit ici un événement futur attendu. « Quand » est naturel en français et convient mieux au contexte que la valeur répétitive possible de « chaque fois que ».
- source_word: δὲ
  choice: mais
  rationale: Marque un contraste modéré avec l’état présent, caractérisé par ce qui n’est que partiel.
- source_word: ἔλθῃ
  choice: viendra
  rationale: L’aoriste subjonctif après ὅταν renvoie ici à un événement futur. Le futur français rend clairement cette orientation temporelle.
- source_word: τὸ τέλειον
  choice: ce qui est parfait
  rationale: Le substantif neutre peut désigner ce qui est parfait, complet ou arrivé à maturité. Cette formulation française conserve l’indétermination du référent sans lui attribuer d’avance une interprétation précise.
- source_word: τὸ ἐκ μέρους
  choice: ce qui est partiel
  rationale: L’expression prépositionnelle précédée de l’article est substantivée. « Ce qui est partiel » reproduit clairement son contraste avec « ce qui est parfait ».
- source_word: καταργηθήσεται
  choice: prendra fin
  rationale: Le futur passif exprime la cessation ou la mise hors d’usage de ce qui est partiel. « Prendra fin » communique cette disparition fonctionnelle sans suggérer nécessairement un anéantissement.
theological_decisions:
- issue: Référent de τὸ τέλειον
  choice: La traduction « ce qui est parfait » ne précise pas le référent.
  alternative: « Ce qui est complet », « ce qui est arrivé à maturité », ou l’accomplissement eschatologique associé au retour du Christ et à la connaissance face à face.
  rationale: Le grec ne nomme pas explicitement le référent. La traduction doit donc préserver l’ambiguïté et la tension théologique plutôt que privilégier une interprétation doctrinale, notamment celle de la maturité, de l’accomplissement final ou de l’achèvement du canon des Écritures.
translation_notes:
  register: Français international moderne, simple et digne. La structure parallèle « ce qui est parfait / ce qui est partiel » rend le contraste grec avec clarté, tandis que les notes préservent les principales possibilités lexicales et interprétatives.
