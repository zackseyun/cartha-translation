  rationale: Révision limitée à deux expressions françaises afin d’éviter une ambiguïté lexicale non présente dans le grec et de rendre plus nettement l’image de l’immaturité. Le sens, le registre sobre, le parallélisme des comparaisons et le choix terminologique « Messie » sont conservés.
