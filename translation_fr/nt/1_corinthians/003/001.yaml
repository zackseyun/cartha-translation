    issue: « êtres spirituels »
    rationale: En français moderne, cette expression évoque spontanément des esprits ou des êtres surnaturels plutôt que des membres humains de la communauté caractérisés comme πνευματικοί. « Personnes spirituelles » supprime cette ambiguïté sans ajouter d’interprétation.
  - severity: low
    issue: « petits enfants » pour νηπίοις
    rationale: La formule est possible, mais « enfants en bas âge » exprime plus nettement le stade de très jeune enfance suggéré par νηπίοις et reste idiomatique dans ce contexte métaphorique.
