reference: 1 Corinthians 3:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Κἀγώ, ἀδελφοί, οὐκ ἠδυνήθην ⸂λαλῆσαι ὑμῖν⸃ ὡς πνευματικοῖς ἀλλ’ ὡς ⸀σαρκίνοις, ὡς νηπίοις ἐν Χριστῷ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/001.yaml
  text: And I[a], brothers, was not able to speak to you as spiritual people, but as fleshly people[b], as infants in Messiah.
translation:
  language: fr
  text: Et moi, frères[a], je n’ai pas pu vous parler comme à des personnes spirituelles, mais comme à des êtres de chair, comme à des enfants en bas âge dans le Messie[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « frères et sœurs » ; le grec dit « frères ».
    reason: lexical_alternative
  - marker: b
    text: Ou « en Christ ».
    reason: lexical_alternative
lexical_decisions:
- source_word: Κἀγώ
  choice: Et moi
  rationale: Conserve à la fois le lien exprimé par καί et le pronom personnel explicite, qui met Paul en contraste avec ce qui précède sans le suraccentuer.
- source_word: ἀδελφοί
  choice: frères
  rationale: Rend directement le vocatif masculin pluriel grec. La possibilité que l’adresse englobe aussi les femmes de l’assemblée est signalée en note.
- source_word: οὐκ ἠδυνήθην
  choice: je n’ai pas pu
  rationale: Expression française naturelle qui conserve l’idée d’incapacité et la valeur passée de l’aoriste.
- source_word: λαλῆσαι ὑμῖν
  choice: vous parler
  rationale: Rend simplement et naturellement l’infinitif accompagné de son complément au datif.
- source_word: πνευματικοῖς
  choice: à des êtres spirituels
  rationale: L’adjectif est substantivé. « Êtres spirituels » reste proche du grec sans préciser indûment s’il s’agit de personnes dirigées par l’Esprit ou caractérisées comme spirituelles.
- source_word: σαρκίνοις
  choice: à des êtres de chair
  rationale: Préserve le lien lexical avec la chair ainsi que le contraste avec « spirituels », sans introduire une interprétation plus moralisante comme « mondains » ou « pécheurs ».
- source_word: νηπίοις
  choice: à de petits enfants
  rationale: Conserve l’image de l’immaturité tout en employant une formulation française naturelle et digne.
- source_word: ἐν Χριστῷ
  choice: dans le Messie
  rationale: Rend Χριστός comme un titre et conserve la construction relationnelle ἐν, sans réduire l’expression à une simple identification confessionnelle.
theological_decisions:
- issue: Sens de l’opposition entre πνευματικοῖς et σαρκίνοις
  choice: êtres spirituels / êtres de chair
  alternative: personnes conduites par l’Esprit / personnes charnelles
  rationale: La formulation retenue préserve la tension et l’ambiguïté lexicales du grec, sans transformer explicitement l’opposition en jugement moral ni développer le rôle de l’Esprit au-delà du texte.
- issue: Traduction de Χριστῷ
  choice: dans le Messie
  alternative: en Christ
  rationale: Dans ce contexte, Χριστός peut garder sa valeur de titre. La traduction principale l’explicite, tandis que la formulation française traditionnelle est donnée en note.
translation_notes:
  register: Français international moderne, sobre et digne. Le parallélisme « êtres spirituels / êtres de chair » maintient le contraste grec et évite les paraphrases confessionnelles. « Petits enfants » est plus soutenu que « bébés » tout en restant immédiatement compréhensible.
