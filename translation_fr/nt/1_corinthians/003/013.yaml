  text: ἑκάστου τὸ ἔργον φανερὸν γενήσεται, ἡ γὰρ ἡμέρα δηλώσει· ὅτι ἐν πυρὶ ἀποκαλύπτεται, καὶ ἑκάστου τὸ ἔργον ὁποῖόν ἐστιν τὸ πῦρ ⸀αὐτὸ δοκιμάσει.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/013.yaml
  text: each one’s work will become evident[a], for the Day will disclose it, because it is revealed in fire[b], and the fire itself will test what sort of work each one has.
translation:
  language: fr
  text: L’œuvre de chacun apparaîtra clairement, car le Jour[a] la fera connaître, puisqu’il est révélé dans le feu[b] ; et le feu lui-même mettra à l’épreuve la qualité de l’œuvre de chacun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Le Jour » désigne vraisemblablement le jour futur où Dieu procédera à l’évaluation ou au jugement.
    reason: cross_reference
  - marker: b
    text: 'Ou : « par le feu ». L’expression grecque ἐν πυρί peut signifier « dans le feu » ou avoir un sens instrumental, « par le feu ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑκάστου τὸ ἔργον
  choice: l’œuvre de chacun
  rationale: Cette formulation conserve la force distributive de ἑκάστου et le sens large de ἔργον, qui désigne ici ce que chaque bâtisseur a réalisé.
- source_word: φανερὸν γενήσεται
  choice: apparaîtra clairement
  rationale: Rend naturellement en français le fait que l’œuvre deviendra manifeste, sans suggérer qu’elle serait simplement devenue intellectuellement « évidente ».
- source_word: ἡ ἡμέρα
  choice: le Jour
  rationale: L’article et le contexte orientent vers le jour futur de l’évaluation divine ; la majuscule signale ce référent particulier sans développer l’expression.
- source_word: δηλώσει
  choice: la fera connaître
  rationale: Le pronom reprend « l’œuvre » et la locution exprime clairement l’action de mettre en lumière, tout en distinguant ce verbe de ἀποκαλύπτεται.
- source_word: ἐν πυρὶ
  choice: dans le feu
  rationale: La traduction formellement transparente garde ouverte la valeur locale ou instrumentale de la préposition grecque ; l’autre possibilité est indiquée en note.
- source_word: ἀποκαλύπτεται
  choice: il se révèle
  rationale: Le pronom renvoie au « Jour », sujet le plus naturel de ce verbe au singulier dans la construction grecque, tout en conservant l’idée de dévoilement.
- source_word: ὁποῖόν ἐστιν
  choice: la qualité de l’œuvre
  rationale: Dans ce contexte d’évaluation, l’expression porte sur la nature ou la valeur qualitative de l’œuvre ; cette formulation est concise et idiomatique en français.
- source_word: τὸ πῦρ αὐτὸ δοκιμάσει
  choice: le feu lui-même éprouvera
  rationale: « éprouvera » exprime l’examen destiné à établir la qualité, et « lui-même » conserve l’insistance de αὐτό.
theological_decisions:
- issue: Sens de ἡ ἡμέρα
  choice: « le Jour », compris comme le jour futur de l’évaluation divine
  alternative: « le jour », au sens non précisé ou générique
  rationale: Le contexte immédiat de l’épreuve de l’œuvre de chacun favorise un référent eschatologique, mais la note reste sobre afin de ne pas préciser davantage la nature du jugement.
- issue: Référent implicite de ἀποκαλύπτεται
  choice: Le Jour se révèle dans le feu
  alternative: L’œuvre est révélée dans le feu
  rationale: Le sujet exprimé le plus proche, ἡ ἡμέρα, fournit naturellement le sujet sous-entendu de ἀποκαλύπτεται. La syntaxe grecque permet toutefois que certains comprennent l’œuvre comme ce qui est révélé ; la traduction suit la lecture syntaxique privilégiée sans ajouter d’explication doctrinale.
translation_notes:
  register: Français international moderne, digne et accessible. « Apparaîtra clairement » évite le caractère technique de « deviendra manifeste », tandis que « éprouvera » conserve le registre solennel et précis du contexte. Les marqueurs de notes sont placés directement après les expressions qu’ils expliquent.
