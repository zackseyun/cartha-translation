source:
  edition: SBLGNT
  text: γάλα ὑμᾶς ἐπότισα, ⸀οὐ βρῶμα, οὔπω γὰρ ἐδύνασθε. ἀλλ’ ⸀οὐδὲ ἔτι νῦν δύνασθε,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/002.yaml
  text: I fed you milk[a], not solid food, for you were not yet able. But even now you are still not able[b],
translation:
  language: fr
  text: Je vous ai donné du lait à boire, non de la nourriture solide[a], car vous n’en étiez pas encore capables. Mais même maintenant, vous n’en êtes toujours pas capables,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « non de la nourriture » ; le qualificatif « solide » ressort du contraste avec le lait.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γάλα
  choice: du lait
  rationale: Équivalent direct qui conserve l’image de l’alimentation et le contraste avec une nourriture plus consistante.
- source_word: ἐπότισα
  choice: j’ai donné … à boire
  rationale: Le verbe signifie proprement « donner à boire ». Cette formulation est naturelle en français et respecte précisément l’image grecque.
- source_word: βρῶμα
  choice: nourriture solide
  rationale: Le nom désigne la nourriture en général, mais le contraste avec le lait appelle en français « nourriture solide » pour rendre clairement l’opposition contextuelle.[a]
- source_word: οὔπω
  choice: pas encore
  rationale: Rend directement la négation temporelle.
- source_word: ἐδύνασθε
  choice: vous n’en étiez pas encore capables
  rationale: L’imparfait exprime leur incapacité à ce moment antérieur; le pronom « en » reprend naturellement la nourriture solide, sans expliciter davantage la métaphore.
- source_word: οὐδὲ ἔτι νῦν
  choice: Et même maintenant … toujours pas
  rationale: Cette tournure fait entendre à la fois l’insistance sur le présent et la persistance de l’incapacité.
- source_word: δύνασθε
  choice: vous n’en êtes toujours pas capables
  rationale: Le présent marque leur capacité actuelle et maintient le parallèle avec la proposition précédente.
theological_decisions:
- issue: Interprétation de la métaphore alimentaire de Paul
  choice: Conserver l’image du lait et de la nourriture solide sans l’expliquer dans le corps du texte.
  alternative: Paraphraser en parlant d’un enseignement élémentaire opposé à un enseignement avancé.
  rationale: Le grec formule une métaphore et ne précise pas ici son application. La conserver évite d’imposer une interprétation théologique plus étroite que le texte.
translation_notes:
  register: Français international moderne, naturel et digne. « Donner du lait à boire » garde la valeur concrète de ἐπότισα, tandis que « nourriture solide » rend explicite en français le contraste contextuel sans développer la métaphore.
