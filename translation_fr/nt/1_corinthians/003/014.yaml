  text: εἴ τινος τὸ ἔργον μενεῖ ὃ ἐποικοδόμησεν, μισθὸν λήμψεται·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/014.yaml
  text: If anyone’s work that he built on remains[b][a], he will receive a reward.
translation:
  language: fr
  text: Si l’œuvre que quelqu’un a bâtie sur le fondement subsiste[a], il recevra une récompense[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « demeure » ou « résiste » pour « subsiste ».
    reason: lexical_alternative
  - marker: b
    text: Ou « un salaire » ou « une rétribution » pour « une récompense ».
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴ
  choice: Si
  rationale: Introduit simplement une proposition conditionnelle.
- source_word: τινος τὸ ἔργον
  choice: l’œuvre que quelqu’un
  rationale: Cette formulation française naturelle conserve le pronom indéfini et rattache clairement l’œuvre à la personne concernée.
- source_word: μενεῖ
  choice: subsiste
  rationale: Le verbe signifie demeurer ou continuer d’exister. « Subsiste » convient au contexte où l’œuvre est éprouvée, sans expliciter davantage l’image du feu.
- source_word: ὃ ἐποικοδόμησεν
  choice: a bâtie dessus
  rationale: Le verbe composé exprime l’action de bâtir sur une fondation. « Dessus » conserve cette relation sans répéter dans ce verset l’objet sous-entendu par le contexte.
- source_word: μισθὸν
  choice: une récompense
  rationale: Dans ce contexte d’évaluation, « récompense » exprime naturellement la rétribution sans réduire le terme au salaire économique.
- source_word: λήμψεται
  choice: il recevra
  rationale: Rend directement le futur de λαμβάνω dans un registre courant et digne.
theological_decisions:
- issue: Nature de la récompense
  choice: Ne pas préciser sa nature
  alternative: Interpréter la récompense comme le salut, une fonction ou un avantage particulier
  rationale: Le verset affirme qu’une récompense sera reçue, mais n’en définit pas ici la nature.
translation_notes:
  register: Français international moderne, naturel et digne. Le masculin singulier « il » correspond à la formulation représentative du grec. La tournure « bâtie dessus » maintient le lien avec la fondation mentionnée dans le contexte immédiat.
