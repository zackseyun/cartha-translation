  naturalness: « Si l’œuvre que quelqu’un a bâtie dessus subsiste » n’est pas idiomatique en français moderne. « Si l’œuvre que quelqu’un a bâtie sur le fondement subsiste » est naturel, clair et maintient l’image de construction.
  terminology: « Œuvre », « subsiste », « recevra » et « récompense » conviennent au registre et au contexte. « Récompense » rend naturellement μισθός sans trancher sur la nature de la rétribution. Les alternatives proposées en note restent recevables.
  issues:
