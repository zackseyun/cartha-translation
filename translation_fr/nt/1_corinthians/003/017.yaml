id: 1CO.3.17
reference: 1 Corinthians 3:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἴ τις τὸν ναὸν τοῦ θεοῦ φθείρει, φθερεῖ τοῦτον ὁ θεός· ὁ γὰρ ναὸς τοῦ θεοῦ ἅγιός ἐστιν, οἵτινές ἐστε ὑμεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/017.yaml
  text: If anyone destroys God's temple[a], God will destroy him; for God's temple is holy[b], and you are that temple.
translation:
  language: fr
  text: Si quelqu’un détruit le temple de Dieu[a], Dieu le détruira, car le temple de Dieu est saint, et ce temple, c’est vous[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « corrompt » ou « détériore ». Le même verbe grec est employé dans les deux propositions.
    reason: lexical_alternative
  - marker: b
    text: 'Le pronom « vous » est pluriel : Paul présente ici la communauté dans son ensemble comme le temple de Dieu.'
    reason: cultural_note
lexical_decisions:
- source_word: ναός
  choice: temple
  rationale: « Temple » est naturel en français et désigne ici le lieu saint où Dieu demeure. « Sanctuaire » serait également possible, mais risquerait de mettre l’accent sur une partie particulière du temple plutôt que sur l’image d’ensemble.
- source_word: φθείρει / φθερεῖ
  choice: détruit / détruira
  rationale: La répétition du même verbe français reproduit celle du grec et conserve la gravité ainsi que la réciprocité de l’avertissement. Le verbe grec peut aussi évoquer l’idée de corrompre ou de détériorer.
- source_word: τοῦτον
  choice: le
  rationale: Le pronom reprend naturellement « quelqu’un » en français. Cette formulation directe conserve la référence personnelle singulière sans imposer un genre dans la traduction.
- source_word: ἅγιος
  choice: saint
  rationale: « Saint » est le terme français courant qui exprime à la fois le caractère sacré et la mise à part pour Dieu.
- source_word: οἵτινές ἐστε ὑμεῖς
  choice: et ce temple, c’est vous
  rationale: Cette tournure idiomatique rend explicite le lien avec « le temple » tout en gardant l’identification forte exprimée par le grec.
- source_word: ὑμεῖς
  choice: vous
  rationale: « Vous » conserve le pluriel grec. Associé au singulier « temple », il désigne collectivement la communauté des croyants.
theological_decisions:
- issue: Le temple désigne-t-il principalement chaque croyant individuellement ou la communauté collectivement ?
  choice: Le texte présente collectivement les destinataires comme le temple de Dieu.
  alternative: On peut appliquer l’image à chaque croyant individuellement à partir d’autres passages bibliques.
  rationale: Dans cette phrase, le singulier « temple » est identifié au pronom pluriel « vous ». Dans le contexte de 1 Corinthiens 3, cela renvoie le plus naturellement à la communauté dans son ensemble.
- issue: Le rapport entre les deux emplois de φθείρω
  choice: Employer « détruire » dans les deux propositions.
  alternative: Traduire selon le contexte par « corrompre », « détériorer » ou « profaner », éventuellement avec deux verbes français différents.
  rationale: 'La reprise exacte du verbe grec crée un avertissement solennel : Dieu répondra à celui qui porte gravement atteinte à son temple. Conserver un même verbe évite d’atténuer ou de résoudre la portée précise du terme.'
translation_notes:
  register: Français moderne, international et digne. La phrase reste concise et solennelle. La tournure « ce temple, c’est vous » clarifie naturellement le relatif grec, tandis que les notes préservent l’étendue sémantique de φθείρω et la portée collective du pluriel.
