reference: 1 Corinthians 3:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Οὐκ οἴδατε ὅτι ναὸς θεοῦ ἐστε καὶ τὸ πνεῦμα τοῦ θεοῦ ⸂οἰκεῖ ἐν ὑμῖν⸃;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/016.yaml
  text: Do you not know that you are God’s temple and that God’s Spirit dwells in you?[a][b][c]
translation:
  language: fr
  text: Ne savez-vous pas que vous êtes le temple de Dieu[a][b] et que l’Esprit de Dieu habite en vous[c] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le sanctuaire de Dieu ».
    reason: lexical_alternative
  - marker: b
    text: 'Le pronom « vous » est au pluriel : Paul s’adresse collectivement à la communauté.'
    reason: cultural_note
  - marker: c
    text: Ou « parmi vous ».
    reason: alternative_reading
lexical_decisions:
- source_word: ναὸς
  choice: temple
  rationale: « Temple » rend naturellement ναός, qui désigne le sanctuaire lui-même plutôt que l’ensemble plus vaste de l’enceinte sacrée. Le terme préserve l’image communautaire d’un lieu où Dieu demeure.
- source_word: θεοῦ
  choice: de Dieu
  rationale: Le complément du nom est la tournure française la plus naturelle dans « le temple de Dieu » et « l’Esprit de Dieu ».
- source_word: ἐστε
  choice: vous êtes
  rationale: Le verbe est à la deuxième personne du pluriel. La formulation française conserve ce pluriel sans ajouter « ensemble », absent du grec.
- source_word: τὸ πνεῦμα τοῦ θεοῦ
  choice: l’Esprit de Dieu
  rationale: Cette formulation claire et traditionnelle conserve directement la relation exprimée par le génitif grec.
- source_word: οἰκεῖ
  choice: habite
  rationale: « Habite » exprime la présence durable suggérée par οἰκέω et s’accorde avec l’image du temple.
- source_word: ἐν ὑμῖν
  choice: en vous
  rationale: La traduction directe garde ouverte la nuance collective du pluriel grec; selon le contexte, la préposition peut aussi se comprendre comme « parmi vous ».
- source_word: Οὐκ οἴδατε
  choice: Ne savez-vous pas
  rationale: Cette question rhétorique, naturelle dans un registre digne, conserve la force du grec sans la paraphraser par « ne vous rendez-vous pas compte ».
theological_decisions:
- issue: Le verset vise-t-il principalement chaque croyant individuellement ou la communauté dans son ensemble ?
  choice: Le texte principal conserve « vous êtes » sans expliciter davantage, tandis qu’une note indique que le pluriel vise collectivement la communauté.
  alternative: « Vous êtes ensemble le temple de Dieu » ou, à l’inverse, une formulation individualisante telle que « chacun de vous est le temple de Dieu ».
  rationale: Le grec emploie la deuxième personne du pluriel et, dans le contexte, Paul s’adresse à la communauté de Corinthe. Toutefois, il n’ajoute aucun équivalent explicite de « ensemble » ni de « chacun »; la traduction évite donc de résoudre dans le texte une tension que la formulation source laisse ouverte.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe rhétorique de Paul est conservée. « Temple » et « habite » maintiennent le lien imagé entre le sanctuaire et la présence de l’Esprit; les notes préservent les possibilités lexicales et la portée communautaire du pluriel.
