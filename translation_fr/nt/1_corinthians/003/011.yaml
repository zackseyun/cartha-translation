id: 1CO.3.11
reference: 1 Corinthians 3:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: θεμέλιον γὰρ ἄλλον οὐδεὶς δύναται θεῖναι παρὰ τὸν κείμενον, ὅς ἐστιν Ἰησοῦς Χριστός·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/011.yaml
  text: For no one can lay another foundation besides the one already laid[a], which is Jesus the Messiah.
translation:
  language: fr
  text: 'Car personne ne peut poser un autre fondement que celui qui est déjà posé : Jésus le Messie[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Jésus-Christ ».'
    reason: Signale la forme française traditionnelle de Ἰησοῦς Χριστός, tandis que le texte principal traduit explicitement le titre Χριστός.
lexical_decisions:
- source_word: θεμέλιον
  choice: fondement
  rationale: Le terme désigne le fondement d’un bâtiment et s’inscrit dans l’image de la construction développée par Paul.
- source_word: γὰρ
  choice: car
  rationale: La conjonction introduit l’explication de l’affirmation précédente et conserve explicitement ce lien logique.
- source_word: ἄλλον οὐδεὶς δύναται θεῖναι
  choice: personne ne peut poser un autre
  rationale: Cette formulation française rend directement l’universalité de οὐδεὶς, la possibilité exprimée par δύναται et l’emploi architectural de θεῖναι.
- source_word: παρὰ τὸν κείμενον
  choice: que celui qui est déjà posé
  rationale: Après une négation, « que » exprime naturellement l’exclusion portée par παρά. « Déjà posé » fait ressortir l’état résultant exprimé par κείμενον.
- source_word: ὅς ἐστιν
  choice: ':'
  rationale: Les deux-points identifient naturellement en français le fondement déjà posé à la personne nommée ensuite, sans ajouter d’explication étrangère au texte.
- source_word: Ἰησοῦς Χριστός
  choice: Jésus le Messie
  rationale: Ἰησοῦς est translittéré comme nom propre, tandis que Χριστός est rendu selon son sens de titre, « le Messie », dans une tournure française idiomatique.
theological_decisions:
- issue: Valeur de Χριστός dans Ἰησοῦς Χριστός
  choice: Jésus le Messie
  alternative: Jésus-Christ
  rationale: La traduction principale rend la portée titulaire de Χριστός au lieu de la traiter comme un simple nom. La forme traditionnelle française est signalée en note.
- issue: Identification du fondement
  choice: Le fondement est explicitement identifié à Jésus le Messie
  alternative: Reformuler comme un fondement posé par Jésus
  rationale: Le relatif ὅς renvoie à θεμέλιον et l’attribut Ἰησοῦς Χριστός identifie le fondement lui-même à Jésus ; la traduction maintient cette affirmation sans la résoudre en une autre métaphore.
translation_notes:
  register: Français international moderne, sobre et digne. « Poser un fondement » maintient l’image architecturale. Les deux-points évitent la lourdeur de « lequel est » tout en conservant l’identification nette du grec.
