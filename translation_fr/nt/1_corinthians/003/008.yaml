id: 1CO.3.8
reference: 1 Corinthians 3:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ φυτεύων δὲ καὶ ὁ ποτίζων ἕν εἰσιν, ἕκαστος δὲ τὸν ἴδιον μισθὸν λήμψεται κατὰ τὸν ἴδιον κόπον,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/008.yaml
  text: The one who plants and the one who waters are one[a], and each will receive his own reward according to his own labor.
translation:
  language: fr
  text: Celui qui plante et celui qui arrose ne font qu’un[a], et chacun recevra sa propre récompense selon son propre travail.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sont unis » ou « ont un même but ».
    reason: lexical_alternative
lexical_decisions:
- source_word: φυτεύων
  choice: celui qui plante
  rationale: Le participe présent substantivé est rendu par une tournure française naturelle qui conserve l’image agricole et la fonction continue du serviteur.
- source_word: ποτίζων
  choice: celui qui arrose
  rationale: Cette formulation parallèle rend naturellement le participe substantivé et maintient la métaphore agricole.
- source_word: ἕν
  choice: ne font qu’un
  rationale: Cette expression française idiomatique préserve la formulation compacte du grec et exprime l’unité sans confondre les deux personnes; une note signale les principales nuances possibles.
- source_word: μισθὸν
  choice: récompense
  rationale: « Récompense » convient au contexte du service et désigne la rétribution sans réduire le terme à un salaire monétaire.
- source_word: λήμψεται
  choice: recevra
  rationale: Le futur simple rend directement et naturellement le futur grec.
- source_word: κατὰ
  choice: selon
  rationale: « Selon » conserve le rapport entre la rétribution et le travail accompli, sans préciser davantage que le grec la nature exacte de cette correspondance.
- source_word: κόπον
  choice: travail
  rationale: « Travail » est clair en français moderne; dans ce contexte, il peut inclure l’effort et la peine inhérents au service.
- source_word: ἴδιον
  choice: sa propre / son propre
  rationale: La répétition de « propre » reproduit l’insistance du grec sur la responsabilité et la rétribution individuelles.
theological_decisions:
- issue: Sens de ἕν εἰσιν (« ne font qu’un »)
  choice: Conserver une expression d’unité qui distingue néanmoins celui qui plante de celui qui arrose.
  alternative: « sont unis » ou « ont un même but »
  rationale: Le neutre ἕν indique l’unité plutôt que l’identité personnelle. Le contexte s’oppose aux divisions autour des serviteurs, mais le verset maintient aussi la distinction de leur travail et de leur récompense; la traduction ne réduit donc pas explicitement cette unité à la seule égalité de statut ni au seul partage d’un objectif.
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme agricole est conservé, ainsi que la double insistance sur ce qui revient en propre à chacun.
