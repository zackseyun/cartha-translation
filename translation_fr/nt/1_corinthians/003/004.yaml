id: 1CO.3.4
reference: 1 Corinthians 3:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὅταν γὰρ λέγῃ τις· Ἐγὼ μέν εἰμι Παύλου, ἕτερος δέ· Ἐγὼ Ἀπολλῶ, ⸂οὐκ ἄνθρωποί⸃ ἐστε;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/004.yaml
  text: For whenever someone says[a], “I am of Paul,” and another, “I am of Apollos,” are you not merely human?
translation:
  language: fr
  text: 'En effet, quand l’un dit : « Moi, je suis de Paul », et un autre : « Moi, d’Apollos », n’êtes-vous pas de simples humains ?[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « n’êtes-vous pas des humains ? » Autre traduction possible : « ne vous comportez-vous pas en simples humains ? »'
    reason: Précise le sens rhétorique de ἄνθρωποι et conserve à la fois sa forme littérale et son implication comportementale.
lexical_decisions:
- source_word: ὅταν
  choice: quand
  rationale: Dans ce contexte, « quand » introduit naturellement en français une situation générale ou répétée; « chaque fois que » serait possible, mais plus appuyé.
- source_word: γὰρ
  choice: en effet
  rationale: Cette expression marque clairement le lien explicatif avec l’argument précédent sans alourdir la phrase.
- source_word: λέγῃ τις
  choice: l’un dit
  rationale: Avec « un autre » dans la proposition suivante, « l’un » restitue naturellement la construction indéfinie et le contraste.
- source_word: Ἐγὼ μέν εἰμι Παύλου
  choice: Moi, je suis de Paul
  rationale: La formule française conserve le génitif grec condensé et son sens d’affiliation partisane, sans préciser davantage la nature de cette relation.
- source_word: ἕτερος δέ
  choice: et un autre
  rationale: Cette formulation rend le contraste μέν…δέ dans un français fluide.
- source_word: Ἐγὼ Ἀπολλῶ
  choice: Moi, d’Apollos
  rationale: L’ellipse du verbe et de la tournure « je suis de » est conservée, comme en grec, tout en restant intelligible grâce au parallélisme.
- source_word: οὐκ ἄνθρωποί ἐστε;
  choice: n’êtes-vous pas de simples humains ?
  rationale: « De simples humains » communique en français la portée réprobatrice de la question rhétorique; le rendu strictement littéral risquerait de paraître demander s’ils appartiennent à l’espèce humaine.
theological_decisions:
- issue: Portée de ἄνθρωποι dans la question rhétorique
  choice: de simples humains
  alternative: des humains; ne vous comportez-vous pas en humains
  rationale: Le texte reproche une conduite régie par des critères purement humains. Le texte principal conserve la forme avec « être », tandis que la note signale le littéral et l’interprétation comportementale sans imposer une lecture doctrinale particulière.
translation_notes:
  register: Français international moderne, digne et oralement fluide. Les slogans d’appartenance restent volontairement condensés, et la répétition emphatique de « Moi » reproduit le contraste grec.
