  text: If anyone builds on the foundation with gold, silver, precious stones, wood, hay, straw,
translation:
  language: fr
  text: Si quelqu’un bâtit sur le fondement avec de l’or, de l’argent, des pierres précieuses, du bois, du foin, de la paille,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰ δέ τις
  choice: Si quelqu’un
  rationale: La tournure introduit une condition tout en marquant une légère progression dans l’argument. En français, « Si quelqu’un » suffit naturellement ici, sans rendre δέ par un connecteur lourd ou artificiel.
- source_word: ἐποικοδομεῖ ἐπὶ τὸν θεμέλιον
  choice: bâtit sur le fondement
  rationale: Le verbe et la préposition expriment l’action de construire sur une base déjà posée. « Bâtir sur le fondement » conserve clairement la métaphore architecturale du contexte.
- source_word: χρυσόν
  choice: de l’or
  rationale: Désignation directe du matériau; l’article partitif convient à l’énumération française.
- source_word: ἄργυρον
  choice: de l’argent
  rationale: Désignation directe du matériau, coordonnée à l’or.
- source_word: λίθους τιμίους
  choice: des pierres précieuses
  rationale: Rend le sens de pierres de grande valeur sans décider s’il s’agit de gemmes ou de matériaux de construction coûteux.
- source_word: ξύλα
  choice: du bois
  rationale: Le nom collectif français est naturel pour désigner ce matériau dans une énumération.
- source_word: χόρτον
  choice: du foin
  rationale: Dans cette liste de matériaux combustibles, « foin » rend naturellement la matière végétale sèche visée.
- source_word: καλάμην
  choice: de la paille
  rationale: « Paille » est le terme français courant qui convient à la métaphore de construction et au contraste avec les matériaux précieux.
