  text: καὶ πάλιν· Κύριος γινώσκει τοὺς διαλογισμοὺς τῶν σοφῶν ὅτι εἰσὶν μάταιοι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/020.yaml
  text: And again[a], “The Lord knows the thoughts of the wise[c][b], that they are futile.”
translation:
  language: fr
  text: 'Et encore : « Le Seigneur connaît les pensées des sages : elles sont vaines. »[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « raisonnements » pour « pensées » ; ou « futiles » ou « vaines » pour l’expression finale. Citation du Psaume 94.11 (93.11 dans la Septante).
    reason: Indique les alternatives lexicales pertinentes et la source de la citation.
lexical_decisions:
- source_word: καὶ πάλιν
  choice: Et encore
  rationale: Introduit naturellement en français une seconde citation venant appuyer l’argument.
- source_word: Κύριος
  choice: Le Seigneur
  rationale: Équivalent français usuel et digne de κύριος dans une citation scripturaire.
- source_word: γινώσκει
  choice: connaît
  rationale: Rend directement le verbe grec sans ajouter l’idée plus interprétative de compréhension.
- source_word: διαλογισμοὺς
  choice: les raisonnements
  rationale: Dans ce contexte portant sur la sagesse, « raisonnements » exprime les démarches de pensée visées par le terme grec; « pensées » reste possible.
- source_word: τῶν σοφῶν
  choice: des sages
  rationale: Rend naturellement l’adjectif substantivé et conserve le lien avec le thème de la sagesse dans le contexte.
- source_word: ὅτι
  choice: il sait que
  rationale: Explicite en français que la proposition suivante constitue le contenu de ce que le Seigneur connaît, sans lui donner une valeur causale.
- source_word: μάταιοι
  choice: vains
  rationale: Conserve la force de μάταιος, qui évoque ce qui est vide, sans valeur ou sans résultat; l’accord masculin renvoie à « raisonnements ».
theological_decisions:
- issue: Portée de ὅτι
  choice: 'Le comprendre comme introduisant le contenu de la connaissance : « il sait qu’ils sont vains »'
  alternative: 'Le comprendre causalement : « parce qu’ils sont vains »'
  rationale: La construction et le sens de la citation favorisent une proposition complétive indiquant ce que le Seigneur sait.
translation_notes:
  register: Français international moderne, naturel et digne. La reprise « il sait » évite une tournure française raide tout en préservant la valeur complétive de ὅτι. Le marqueur [a] figure dans le texte principal.
