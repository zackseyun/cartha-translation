  source_fidelity: Le sens central est bien rendu. Toutefois, « la grâce que Dieu m’a accordée » reformule correctement l’origine divine, mais « la grâce de Dieu qui m’a été accordée » reproduit plus explicitement la construction grecque sans alourdir indûment. L’avertissement βλεπέτω πῶς est plus directement rendu par « prenne garde à la manière dont » que par « veille à la manière dont ».
  naturalness: Le texte est globalement naturel et de registre digne. « Prendre garde à la manière dont il bâtit » est une formulation française plus idiomatique et plus nettement avertissante que « veiller à la manière dont il bâtit ».
  terminology: « Maître d’œuvre » rend adéquatement ἀρχιτέκτων dans son sens antique de responsable de construction; la note lexicale est utile. « Fondement », « bâtit » et « grâce » sont appropriés et conservent la métaphore ainsi que le vocabulaire paulinien.
