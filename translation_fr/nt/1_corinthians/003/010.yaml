source:
  edition: SBLGNT
  text: Κατὰ τὴν χάριν τοῦ θεοῦ τὴν δοθεῖσάν μοι ὡς σοφὸς ἀρχιτέκτων θεμέλιον ⸀ἔθηκα, ἄλλος δὲ ἐποικοδομεῖ. ἕκαστος δὲ βλεπέτω πῶς ἐποικοδομεῖ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/010.yaml
  text: According to the grace of God given to me[a], like a wise master builder I laid a foundation, and another builds on it[c][b]. But let each one be careful how he builds.
translation:
  language: fr
  text: Selon la grâce de Dieu qui m’a été accordée, j’ai posé un fondement comme un maître d’œuvre sage[a], et un autre bâtit dessus. Mais que chacun prenne garde à la manière dont il bâtit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « architecte »; le mot grec désigne ici le responsable principal qui dirige les travaux de construction.
    reason: lexical_alternative
lexical_decisions:
- source_word: Κατὰ
  choice: Conformément à
  rationale: Exprime la conformité de l’action de Paul à la grâce reçue, plutôt qu’un simple moyen.
- source_word: χάριν τοῦ θεοῦ τὴν δοθεῖσάν μοι
  choice: la grâce que Dieu m’a accordée
  rationale: Conserve le poids paulinien de χάρις tout en rendant naturellement l’idée d’un don divin fait à Paul.
- source_word: ὡς σοφὸς ἀρχιτέκτων
  choice: comme un maître d’œuvre sage
  rationale: Dans l’Antiquité, ἀρχιτέκτων désigne le responsable principal de la construction; « maître d’œuvre » communique mieux ce rôle que le français moderne « architecte ». « Sage » préserve σοφός et son lien avec le thème de la sagesse dans le contexte.
- source_word: θεμέλιον ἔθηκα
  choice: j’ai posé un fondement
  rationale: « Poser un fondement » est une formulation française naturelle et respecte l’absence d’article devant θεμέλιον.
- source_word: ἄλλος δὲ ἐποικοδομεῖ
  choice: et un autre bâtit dessus
  rationale: Le verbe composé indique que la construction se poursuit sur le fondement déjà posé; « dessus » explicite en français son complément implicite.
- source_word: ἕκαστος δὲ βλεπέτω
  choice: Mais que chacun veille
  rationale: Rend l’impératif de vigilance de façon concise, digne et idiomatique.
- source_word: πῶς ἐποικοδομεῖ
  choice: à la manière dont il bâtit
  rationale: Préserve l’attention portée à la façon de construire, sans répéter lourdement « dessus ».
theological_decisions:
- issue: Portée du masculin singulier dans ἕκαστος ... ἐποικοδομεῖ
  choice: « que chacun veille à la manière dont il bâtit »
  alternative: « que chaque personne veille à sa manière de bâtir »
  rationale: Le masculin singulier grec a ici une portée représentative. Le français générique « chacun ... il » maintient le singulier et reste fidèle à cette construction sans restreindre l’avertissement aux hommes.
- issue: Nature de la grâce donnée à Paul
  choice: Ne pas expliciter davantage que « la grâce que Dieu m’a accordée »
  alternative: « la grâce du ministère que Dieu m’a confié »
  rationale: Le contexte suggère une grâce habilitante liée au ministère, mais le grec conserve une formulation plus large; l’explicitation introduirait une interprétation absente du verset.
translation_notes:
  register: Français international moderne, naturel et digne. La métaphore architecturale est conservée, ainsi que la répétition de l’idée de bâtir. « Maître d’œuvre » est plus transparent aujourd’hui que « architecte » pour le rôle antique visé.
