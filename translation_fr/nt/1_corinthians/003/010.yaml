  to: Selon la grâce de Dieu qui m’a été accordée, j’ai posé un fondement comme un maître d’œuvre sage[a], et un autre bâtit dessus. Mais que chacun prenne garde à la manière dont il bâtit.
  rationale: La révision resserre la correspondance avec « la grâce de Dieu qui m’a été accordée » et rend βλεπέτω par une tournure française plus idiomatique et avertissante. Elle ne modifie ni la métaphore, ni l’ambiguïté limitée du texte, ni la portée représentative de « chacun ».
