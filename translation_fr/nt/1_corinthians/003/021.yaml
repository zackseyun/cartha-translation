lexical_decisions:
- source_word: ὥστε
  choice: Ainsi donc
  rationale: Introduit la conclusion logique de l’argument précédent, dans un français naturel et soutenu.
- source_word: μηδεὶς
  choice: personne ne
  rationale: Rend clairement l’interdiction générale exprimée par le pronom indéfini.
- source_word: καυχάσθω
  choice: que personne ne mette sa fierté
  rationale: Exprime l’impératif présent et conserve l’idée de tirer fierté ou gloire de quelqu’un, sans la réduire à une simple parole vantarde.
- source_word: ἐν ἀνθρώποις
  choice: dans des êtres humains
  rationale: Préserve autant que possible la construction grecque et le caractère générique de ἀνθρώποις; dans le contexte, il s’agit notamment de dirigeants humains.
- source_word: πάντα
  choice: tout
  rationale: Rend de façon idiomatique et globale le neutre pluriel grec, sans restreindre sa portée.
- source_word: γὰρ
  choice: car
  rationale: Introduit avec concision le fondement de l’interdiction.
- source_word: ὑμῶν ἐστιν
  choice: est à vous
  rationale: Exprime directement la relation de possession; le singulier français s’accorde naturellement avec « tout ».
theological_decisions:
- issue: Portée de ἀνθρώποις dans le contexte des factions corinthiennes
  choice: êtres humains
  alternative: dirigeants humains
  rationale: Le texte grec emploie un terme générique. Le contexte vise probablement les responsables humains mentionnés auparavant, mais cette précision interprétative est laissée en note afin de ne pas réduire l’ambiguïté du texte.
translation_notes:
  register: Français moderne, international et digne. « Ainsi donc » marque nettement l’inférence; « mettre sa fierté dans » reste compréhensible tout en conservant le lien avec la construction grecque.
