  text: ὥστε μηδεὶς καυχάσθω ἐν ἀνθρώποις· πάντα γὰρ ὑμῶν ἐστιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/021.yaml
  text: So then[a], let no one boast in people[b], for all things are yours.
translation:
  language: fr
  text: Ainsi donc, que personne ne se glorifie d’êtres humains[a], car tout est à vous.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dans le contexte, il peut s’agir plus précisément de dirigeants humains.
