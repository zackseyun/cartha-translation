  text: εἴ τινος τὸ ἔργον κατακαήσεται, ζημιωθήσεται, αὐτὸς δὲ σωθήσεται, οὕτως δὲ ὡς διὰ πυρός.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/015.yaml
  text: If anyone’s work is burned up[a], he will suffer loss, but he himself will be saved—yet as through fire.
translation:
  language: fr
  text: Si l’œuvre de quelqu’un est consumée, il subira une perte ; lui-même sera sauvé, mais comme à travers le feu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « mais seulement comme à travers le feu » ; ou : « mais comme quelqu’un qui s’échappe à travers le feu ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴ τινος
  choice: Si … de quelqu’un
  rationale: La tournure introduit simplement une condition et conserve la valeur indéfinie de τινος.
- source_word: τὸ ἔργον
  choice: l’œuvre
  rationale: « L’œuvre » garde le sens large du travail accompli et reste cohérent avec l’image de la construction dans le contexte.
- source_word: κατακαήσεται
  choice: est consumée par le feu
  rationale: Le verbe exprime une destruction complète par combustion ; cette formulation restitue cette intensité de façon naturelle.
- source_word: ζημιωθήσεται
  choice: il subira une perte
  rationale: La traduction exprime la perte sans préciser qu’il s’agit d’une récompense ou d’une peine, éléments que le verbe seul n’explicite pas.
- source_word: αὐτὸς δὲ σωθήσεται
  choice: lui-même sera sauvé
  rationale: « Lui-même » rend l’emphase de αὐτός et souligne le contraste entre la destruction de l’œuvre et le salut de la personne.
- source_word: οὕτως δὲ ὡς διὰ πυρός
  choice: mais comme au travers du feu
  rationale: Cette formulation conserve l’image concise ainsi que son ambiguïté, sans décider si elle évoque surtout un passage éprouvant ou une échappée de justesse.
theological_decisions:
- issue: La portée théologique de l’expression finale liée au feu.
  choice: mais comme au travers du feu
  alternative: mais seulement comme au travers du feu ; mais comme quelqu’un qui échappe au feu
  rationale: Le grec ne développe pas précisément la fonction du feu. La traduction maintient donc la tension métaphorique sans imposer une lecture purificatrice, punitive ou celle d’un simple sauvetage de justesse.
translation_notes:
  register: Français international moderne, clair et digne. Le point-virgule met en relief le contraste entre la perte de l’œuvre et le salut de la personne. Le marqueur de note est placé après l’expression ambiguë à laquelle la note se rapporte.
