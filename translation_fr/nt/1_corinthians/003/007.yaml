  text: ὥστε οὔτε ὁ φυτεύων ἐστίν τι οὔτε ὁ ποτίζων, ἀλλ’ ὁ αὐξάνων θεός.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/007.yaml
  text: So neither the one planting is anything[a], nor the one watering, but God who causes the growth.
translation:
  language: fr
  text: Ainsi, celui qui plante n’est rien, pas plus que celui qui arrose, mais Dieu qui fait croître.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὥστε
  choice: Ainsi
  rationale: Introduit naturellement en français la conséquence tirée de l’argument précédent.
- source_word: ὁ φυτεύων
  choice: celui qui plante
  rationale: Rend le participe substantivé avec clarté et conserve le parallélisme verbal.
- source_word: ἐστίν τι
  choice: n’est rien
  rationale: Reproduit l’idiome grec dans un français naturel, sans nier la fonction des serviteurs mais leur importance intrinsèque dans la production de la croissance.
- source_word: ὁ ποτίζων
  choice: celui qui arrose
  rationale: Maintient le parallélisme avec « celui qui plante ».
- source_word: ἀλλ’
  choice: seul compte
  rationale: 'Exprime idiomatiquement le contraste fort : ni l’un ni l’autre ne compte en lui-même, contrairement à Dieu. La note conserve une traduction plus formelle.'
- source_word: ὁ αὐξάνων θεός
  choice: Dieu, qui fait croître
  rationale: Respecte l’accent final porté sur Dieu et rend le participe causal sans préciser indûment l’objet de la croissance.
theological_decisions:
- issue: Contraste entre les ouvriers humains et Dieu
  choice: « seul compte Dieu »
  alternative: « mais Dieu, qui fait croître »
  rationale: Le français idiomatique explicite la valeur contrastive de οὔτε… οὔτε… ἀλλά sans enseigner que les ministères humains seraient inutiles en tout sens ; le contexte attribue à Dieu seul l’efficacité décisive.
translation_notes:
  register: Français international moderne, simple et digne. Le parallélisme agricole est conservé ; la ponctuation met en relief Dieu comme source de la croissance.
