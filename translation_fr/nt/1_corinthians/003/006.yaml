  text: I planted[a], Apollos watered, but God gave the growth.
translation:
  language: fr
  text: J’ai planté, Apollos a arrosé, mais Dieu faisait pousser.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « mais Dieu donnait la croissance » ; « mais Dieu faisait grandir ».'
    reason: 'Variantes lexicales possibles pour ηὔξανεν : formulation centrée sur la croissance ou formulation causative plus générale.'
lexical_decisions:
- source_word: ἐγὼ
  choice: Moi, j’ai
  rationale: Le pronom grec explicite est emphatique. La dislocation « Moi, j’ai » rend naturellement ce contraste en français, en parallèle avec Apollos et Dieu.
- source_word: ἐφύτευσα
  choice: planté
  rationale: « Planter » conserve directement et naturellement l’image agricole développée par Paul.
- source_word: Ἀπολλῶς
  choice: Apollos
  rationale: La forme française conventionnelle du nom propre est conservée.
- source_word: ἐπότισεν
  choice: a arrosé
  rationale: « Arroser » est l’équivalent français naturel dans le cadre de la métaphore agricole.
- source_word: ἀλλὰ
  choice: mais
  rationale: « Mais » exprime clairement le contraste fort entre le travail des serviteurs et l’action décisive de Dieu.
- source_word: ὁ θεὸς
  choice: Dieu
  rationale: Le sujet est rendu simplement et directement; la formulation grecque met Dieu en contraste avec Paul et Apollos.
- source_word: ηὔξανεν
  choice: faisait grandir
  rationale: L’imparfait français reflète l’aspect imperfectif de la forme grecque et « faire grandir » exprime naturellement l’action causative de Dieu sans introduire un objet absent du texte.
theological_decisions:
- issue: L’action divine par rapport au ministère humain
  choice: « mais Dieu faisait grandir » attribue à Dieu l’action continue et décisive qui produit la croissance, tout en maintenant la réalité du travail de Paul et d’Apollos.
  alternative: « mais Dieu a donné la croissance »
  rationale: Le choix retenu suit directement αὐξάνω et son imparfait, sans transformer la croissance en objet donné ni effacer la tension entre l’activité humaine réelle et l’efficacité divine.
translation_notes:
  register: Français international moderne, naturel et digne. La structure brève et contrastive du grec est préservée; « Moi, j’ai » marque l’emphase du pronom sans alourdir excessivement la phrase.
