review_pass:
  verdict: revise
  source_fidelity: Le grec oppose les deux aoristes ponctuels (« j’ai planté », « Apollos a arrosé ») à l’imparfait ηὔξανεν, qui présente l’action de Dieu comme en cours. « faisait grandir » rend bien cette valeur et l’action divine causative. Toutefois, sans complément, « faisait grandir » est légèrement elliptique en français; « faisait pousser » maintient plus immédiatement l’image agricole et explicite naturellement ce qui croît, sans ajouter de contenu.
  naturalness: « Moi, j’ai planté » est possible, mais la dislocation est plus marquée et orale que nécessaire dans ce verset concis. « J’ai planté » conserve suffisamment l’emphase contextuelle du pronom grec explicite, tandis que l’opposition est portée par la série des sujets et par « mais ». « Dieu faisait pousser » est idiomatique et clair dans une métaphore agricole.
  terminology: « Apollos » est la forme française usuelle. « planter », « arroser » et « faire pousser » conservent le réseau agricole. Le terme « croissance » dans la note reste recevable comme alternative, mais la note doit présenter les alternatives de manière exacte et ne pas qualifier improprement l’action comme un simple « résultat ».
