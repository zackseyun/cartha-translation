  yaml_path: translation/nt/1_corinthians/003/022.yaml
  text: whether Paul or Apollos or Cephas or the world or life or death or things present or things to come—all are yours,
translation:
  language: fr
  text: 'que ce soit Paul, Apollos, Céphas, le monde, la vie, la mort, le présent ou l’avenir : tout est à vous,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἴτε … εἴτε
  choice: que ce soit … ou
  rationale: Cette tournure française naturelle conserve la succession rhétorique des éléments envisagés.
- source_word: Παῦλος
  choice: Paul
  rationale: Forme française traditionnelle du nom propre.
- source_word: Ἀπολλῶς
  choice: Apollos
  rationale: Forme française usuelle du nom propre.
- source_word: Κηφᾶς
  choice: Céphas
  rationale: Le texte grec emploie la forme sémitique du nom; « Céphas » la préserve au lieu de lui substituer « Pierre ».
- source_word: κόσμος
  choice: le monde
  rationale: Équivalent français naturel et assez large pour désigner ici le monde ou l’ordre créé.
- source_word: ζωή
  choice: la vie
  rationale: Équivalent direct et naturel dans cette énumération.
- source_word: θάνατος
  choice: la mort
  rationale: Équivalent lexical direct, sans atténuer la force du contraste avec la vie.
- source_word: ἐνεστῶτα
  choice: le présent
  rationale: Le participe substantivé désigne les réalités présentes; « le présent » est concis et forme un couple naturel avec « l’avenir ».
- source_word: μέλλοντα
  choice: l’avenir
  rationale: Le participe substantivé désigne les réalités à venir; « l’avenir » rend ce sens clairement en français moderne.
- source_word: πάντα
  choice: tout
  rationale: Le neutre pluriel récapitule l’ensemble de la liste; le singulier collectif « tout » est idiomatique en français.
- source_word: ὑμῶν
  choice: est à vous
  rationale: Le génitif exprime ici la possession; « est à vous » rend directement la conclusion emphatique de Paul.
theological_decisions: []
translation_notes:
  register: Français moderne, international et digne. La structure cumulative est conservée, tandis que « le présent ou l’avenir » évite une formulation artificielle comme « les choses présentes ou à venir ». La virgule finale est maintenue parce que le verset se poursuit syntaxiquement au verset 23.
