    text: 'Litt. : « vous êtes au Messie, et le Messie est à Dieu ».'
    reason: Formulation plus littérale reproduisant l’ellipse et les génitifs d’appartenance du grec.
  revision_rationale: La révision remplace une formulation française littérale mais marquée par une expression moderne, claire et strictement parallèle de l’appartenance. Elle rend δέ par « et », conformément à la progression de la chaîne rhétorique, et maintient « Messie » ainsi que la réserve théologique du texte.
