- from: mais vous, vous êtes au Messie[a], et le Messie est à Dieu.
  to: et vous appartenez au Messie, et le Messie appartient à Dieu.
  rationale: La révision remplace une formulation française littérale mais marquée par une expression moderne, claire et strictement parallèle de l’appartenance. Elle rend δέ par « et », conformément à la progression de la chaîne rhétorique, et maintient « Messie » ainsi que la réserve théologique du texte.
