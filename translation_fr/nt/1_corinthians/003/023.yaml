  variant: modern international French
source:
  edition: SBLGNT
  text: ὑμεῖς δὲ Χριστοῦ, Χριστὸς δὲ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/023.yaml
  text: and you are Messiah's[b][a], and Messiah is God's.
translation:
  language: fr
  text: et vous appartenez au Messie, et le Messie appartient à Dieu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑμεῖς
  choice: vous, vous
  rationale: Le pronom pluriel désigne l’ensemble des destinataires. Sa reprise après « mais » rend en français le contraste porté par le pronom grec exprimé.
- source_word: δὲ
  choice: mais
  rationale: 'Dans le contexte de la chaîne d’appartenance, δέ introduit un contraste avec ce qui précède : toutes choses sont aux croyants, mais eux-mêmes sont au Messie.'
- source_word: Χριστοῦ
  choice: au Messie
  rationale: Le génitif exprime ici l’appartenance. « Être au Messie » garde la formulation concise et relationnelle du grec, tandis que « Messie » conserve la valeur de titre de Χριστός.
- source_word: Χριστὸς
  choice: le Messie
  rationale: La répétition du titre est maintenue afin de préserver le parallélisme rhétorique entre les deux propositions.
- source_word: θεοῦ
  choice: à Dieu
  rationale: Le génitif d’appartenance est rendu parallèlement par « être à Dieu », sans préciser davantage la nature de cette relation.
theological_decisions:
- issue: Rendre les deux génitifs d’appartenance sans expliquer ni atténuer la relation énoncée.
  choice: « vous êtes au Messie, et le Messie est à Dieu »
  alternative: « vous appartenez au Messie, et le Messie appartient à Dieu »
  rationale: La construction « être à » reste compréhensible en français, reproduit la brièveté et le parallélisme du grec, et préserve la tension théologique de l’affirmation sans définir la nature de l’appartenance.
translation_notes:
  register: Français international moderne, concis et digne. La reprise « vous, vous » marque naturellement le contraste. « Être à » est légèrement plus soutenu que « appartenir à », mais demeure courant et permet de conserver l’ellipse et la symétrie du texte grec.
