  text: ἡ γὰρ σοφία τοῦ κόσμου τούτου μωρία παρὰ τῷ θεῷ ἐστιν· γέγραπται γάρ· Ὁ δρασσόμενος τοὺς σοφοὺς ἐν τῇ πανουργίᾳ αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/019.yaml
  text: For the wisdom of this world is foolishness with God[a]. For it is written[b], “He catches the wise in their craftiness.”
translation:
  language: fr
  text: 'Car la sagesse de ce monde est folie aux yeux de Dieu[a]. En effet, il est écrit : « Il prend les sages dans leur ruse[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « auprès de Dieu » ; c’est-à-dire selon son regard ou son jugement.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « dans leur habileté retorse ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: σοφία
  choice: sagesse
  rationale: Rend le terme grec courant et maintient le contraste paulinien entre la sagesse revendiquée par le monde et le jugement de Dieu.
- source_word: κόσμου τούτου
  choice: de ce monde
  rationale: κόσμος désigne ici le monde dans son ordre présent; cette formulation est naturelle en français et conserve le contraste du texte.
- source_word: μωρία
  choice: folie
  rationale: Équivalent français usuel dans ce contexte paulinien; il exprime non une maladie, mais ce que Dieu juge insensé.
- source_word: παρὰ τῷ θεῷ
  choice: aux yeux de Dieu
  rationale: La construction avec παρά et le datif exprime ici le point de vue ou le jugement de Dieu. La formulation française en communique naturellement la valeur évaluative.
- source_word: γέγραπται
  choice: il est écrit
  rationale: Formule française consacrée et fidèle au parfait passif grec qui introduit une citation de l’Écriture.
- source_word: δρασσόμενος
  choice: il prend … au piège
  rationale: Le participe substantivé décrit celui qui saisit ou attrape. Cette tournure française transmet clairement l’idée que Dieu retourne contre les sages leur propre habileté.
- source_word: σοφοὺς
  choice: les sages
  rationale: Le pluriel substantivé désigne les personnes tenues pour sages sans préciser inutilement leur genre.
- source_word: πανουργίᾳ
  choice: ruse
  rationale: Le mot porte ici une nuance négative d’habileté retorse; « ruse » est clair, actuel et adapté au contexte.
theological_decisions:
- issue: Sujet implicite de la citation de Job 5.13
  choice: « Il prend les sages au piège de leur ruse »
  alternative: « Celui qui prend les sages dans leur ruse »
  rationale: L’article avec le participe grec désigne Dieu comme celui qui agit. Le pronom « Il », éclairé par la mention immédiatement précédente de Dieu, donne une citation naturelle sans ajouter de précision doctrinale.
- issue: Évaluation de la sagesse du monde
  choice: « folie aux yeux de Dieu »
  alternative: « folie auprès de Dieu »
  rationale: Le français explicite la portée évaluative de παρὰ τῷ θεῷ sans atténuer l’opposition entre le jugement du monde et celui de Dieu.
translation_notes:
  register: Français international moderne, clair et digne. La répétition causale du grec est rendue par « Car » puis « En effet » afin d’éviter une lourdeur tout en préservant le lien argumentatif. La citation reste concise et proverbiale.
