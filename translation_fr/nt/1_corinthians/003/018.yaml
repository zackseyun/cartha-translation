source:
  edition: SBLGNT
  text: Μηδεὶς ἑαυτὸν ἐξαπατάτω· εἴ τις δοκεῖ σοφὸς εἶναι ἐν ὑμῖν ἐν τῷ αἰῶνι τούτῳ, μωρὸς γενέσθω, ἵνα γένηται σοφός,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/018.yaml
  text: Let no one deceive himself[a]. If anyone among you thinks he is wise in this age, let him become foolish[b], so that he may become wise.
translation:
  language: fr
  text: Que personne ne se trompe lui-même. Si quelqu’un parmi vous pense être sage à notre époque[a], qu’il devienne fou[b] afin de devenir sage.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « selon les critères de notre époque ».
    reason: lexical_alternative
  - marker: b
    text: Ou « insensé ».
    reason: lexical_alternative
lexical_decisions:
- source_word: Μηδεὶς ἑαυτὸν ἐξαπατάτω
  choice: Que personne ne se trompe lui-même
  rationale: Cette formulation conserve la défense universelle et le pronom réfléchi explicite, tout en rendant naturellement en français l’idée de s’abuser soi-même.
- source_word: δοκεῖ σοφὸς εἶναι
  choice: pense être sage
  rationale: Dans ce contexte, δοκεῖ exprime l’opinion que la personne a d’elle-même plutôt qu’une simple apparence extérieure.
- source_word: ἐν ὑμῖν
  choice: parmi vous
  rationale: Rend idiomatiquement l’appartenance au sein de la communauté de Corinthe.
- source_word: ἐν τῷ αἰῶνι τούτῳ
  choice: dans le temps présent
  rationale: Cette expression française garde la dimension temporelle de αἰών et le contraste paulinien entre l’ordre présent et la sagesse de Dieu, sans employer le peu naturel « dans cet âge ».
- source_word: μωρὸς γενέσθω
  choice: qu’il devienne fou
  rationale: Le nom prédicatif français « fou » restitue directement le paradoxe et la force de μωρός avec l’impératif de γίνομαι.
- source_word: ἵνα γένηται σοφός
  choice: afin de devenir sage
  rationale: Conserve nettement la relation de but et le paradoxe entre devenir fou et devenir véritablement sage.
theological_decisions:
- issue: Portée de αἰών dans le contraste de Paul
  choice: dans le temps présent
  alternative: dans ce monde ; selon les critères du temps présent
  rationale: Le choix retient la nuance temporelle de l’époque présente sans réduire le sens à l’espace du monde ni ajouter explicitement l’idée de critères, qui demeure implicite.
- issue: Force paradoxale de μωρός
  choice: qu’il devienne fou
  alternative: qu’il devienne insensé
  rationale: « Fou » préserve le caractère abrupt et paradoxal de l’exhortation, sans transformer celle-ci en jugement clinique ni expliquer d’avance en quel sens la personne doit le devenir.
- issue: Référence masculine singulière à valeur représentative
  choice: Si quelqu’un… qu’il
  alternative: reformulation au pluriel ou répétition de « cette personne »
  rationale: La construction française demeure naturelle et correspond au singulier représentatif du grec sans restreindre l’exhortation aux hommes.
translation_notes:
  register: Français international moderne, digne et direct. La syntaxe conserve l’exhortation, le singulier représentatif et le paradoxe du grec. « Le temps présent » est plus idiomatique que « cet âge » tout en maintenant la nuance temporelle de αἰών.
