  - severity: low
    issue: Formulation principale de κατὰ ἄνθρωπον
    rationale: « Purement humaine » explicite la restriction éthique. « À la manière des êtres humains » reste idiomatique tout en étant plus proche de la formulation grecque et moins interprétative.
