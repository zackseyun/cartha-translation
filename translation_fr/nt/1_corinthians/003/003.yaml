  text: ἔτι γὰρ σαρκικοί ἐστε. ὅπου γὰρ ἐν ὑμῖν ζῆλος καὶ ⸀ἔρις, οὐχὶ σαρκικοί ἐστε καὶ κατὰ ἄνθρωπον περιπατεῖτε;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/003.yaml
  text: For you are still fleshly. For where there is jealousy and strife among you[a], are you not fleshly and walking according to man?
translation:
  language: fr
  text: Car vous êtes encore charnels. Car là où il y a parmi vous de la jalousie et des querelles, n’êtes-vous pas charnels et ne vous conduisez-vous pas à la manière des êtres humains[a] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « selon l’être humain » ; ou : « d’une manière purement humaine ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔτι
  choice: encore
  rationale: Marque la persistance de leur état et conserve naturellement la portée du reproche.
- source_word: γὰρ
  choice: en effet / car
  rationale: Les deux occurrences gardent leur fonction explicative, avec une variation française naturelle qui respecte la progression de l’argument.
- source_word: σαρκικοί
  choice: charnels
  rationale: Maintient le lien lexical avec la chair sans développer l’adjectif en une explication doctrinale telle que « dominés par la nature pécheresse ».
- source_word: ὅπου
  choice: puisqu’il y a
  rationale: Dans ce contexte probatoire, la tournure française exprime naturellement que la présence de jalousie et de rivalité révèle leur état, sans changer la logique du grec.
- source_word: ζῆλος
  choice: jalousie
  rationale: Le contexte négatif, en association avec ἔρις, indique une jalousie relationnelle plutôt qu’un zèle positif.
- source_word: ἔρις
  choice: rivalité
  rationale: Rend le conflit et la discorde au sein de la communauté dans un français actuel; « querelle » serait possible mais légèrement plus événementiel.
- source_word: οὐχὶ
  choice: n’êtes-vous pas
  rationale: Conserve la question rhétorique qui attend une réponse affirmative.
- source_word: κατὰ ἄνθρωπον
  choice: d’une manière purement humaine
  rationale: Exprime en français naturel une conduite conforme à des critères seulement humains, tout en laissant en note une formulation plus proche de la structure grecque.
- source_word: περιπατεῖτε
  choice: marchez-vous
  rationale: Préserve la métaphore paulinienne de la marche comme manière de vivre, encore compréhensible en français biblique moderne.
theological_decisions:
- issue: Rendu du langage de la chair dans σαρκικοί
  choice: charnels
  alternative: mondains; dominés par la chair
  rationale: « Charnels » garde le motif de la chair et la tension entre l’identité des destinataires et leur conduite, sans assimiler explicitement la chair à une construction doctrinale particulière.
- issue: Sens éthique de κατὰ ἄνθρωπον
  choice: d’une manière purement humaine
  alternative: selon l’être humain
  rationale: Le texte oppose ici leur conduite à celle qui devrait caractériser des personnes spirituelles. La formulation principale est intelligible sans préciser davantage la nature de cette opposition; la note conserve la forme plus littérale.
translation_notes:
  register: Français international moderne, digne et direct. La répétition de « charnels » et la métaphore de la marche sont maintenues afin de préserver la force et les images de l’argument de Paul.
