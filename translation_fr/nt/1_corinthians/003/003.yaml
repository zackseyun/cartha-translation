  source_fidelity: 'Le sens général est bien rendu : ἔτι, σαρκικοί, ζῆλος, ἔρις et la question rhétorique sont conservés. Toutefois, « puisqu’il y a » transforme ὅπου (« là où/où il y a ») en une relation causale plus explicite. La phrase grecque présente la présence de jalousie et de conflit comme le constat qui atteste leur condition ; le français peut conserver cette formulation sans surinterpréter. La note doit aussi correspondre exactement à l’ancre : elle concerne κατὰ ἄνθρωπον, non l’ensemble de la proposition de façon indistincte.'
  naturalness: « En effet ... Car » est possible, mais l’enchaînement est plus naturel et plus proche de la répétition de γάρ avec « Car » dans les deux propositions. « Rivalité » peut désigner une compétition plutôt qu’une discorde effective ; « querelles » est plus direct et idiomatique ici. « Vous conduisez-vous » rend naturellement περιπατεῖτε dans une question française moderne tout en préservant le sens figuré ; une note peut signaler « marchez-vous ».
  terminology: « Charnels » est le bon choix, car il maintient le lien avec σάρξ sans imposer « mondains » ou une paraphrase doctrinale. « D’une manière purement humaine » est recevable pour κατὰ ἄνθρωπον, mais « purement » est une explicitation interprétative ; « à la manière des êtres humains » est plus naturel et laisse la portée exacte ouverte. La note conserve la possibilité littérale au singulier.
