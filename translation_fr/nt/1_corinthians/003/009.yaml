  edition: SBLGNT
  text: θεοῦ γάρ ἐσμεν συνεργοί· θεοῦ γεώργιον, θεοῦ οἰκοδομή ἐστε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/009.yaml
  text: For we are God’s fellow workers; you are God’s field[a], God’s building.
translation:
  language: fr
  text: Car nous sommes les collaborateurs de Dieu[a] ; vous êtes le champ de Dieu, l’édifice de Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « collaborateurs avec Dieu ».
    reason: Le génitif θεοῦ peut exprimer soit l’appartenance et le service, soit la personne avec laquelle Paul et Apollos travaillent.
lexical_decisions:
- source_word: γάρ
  choice: Car
  rationale: Conserve la valeur explicative qui relie cette affirmation au raisonnement précédent.
- source_word: συνεργοί
  choice: collaborateurs
  rationale: Terme français naturel et actuel qui exprime l’idée de personnes travaillant ensemble.
- source_word: θεοῦ (avec συνεργοί)
  choice: de Dieu
  rationale: 'Le génitif peut naturellement indiquer l’appartenance ou le service : Paul et Apollos sont des collaborateurs qui appartiennent à Dieu et œuvrent pour lui. L’autre analyse possible est conservée en note.'
- source_word: γεώργιον
  choice: champ
  rationale: Rend clairement et avec concision la métaphore agricole d’un terrain cultivé.
- source_word: οἰκοδομή
  choice: édifice
  rationale: Désigne naturellement ce qui est bâti et prépare la métaphore de la construction développée dans les versets suivants.
- source_word: ἐστε
  choice: vous êtes
  rationale: Représente explicitement la deuxième personne du pluriel du grec.
theological_decisions:
- issue: 'Sens de θεοῦ συνεργοί : « collaborateurs de Dieu » ou « collaborateurs avec Dieu »'
  choice: collaborateurs de Dieu
  alternative: collaborateurs avec Dieu
  rationale: Dans le contexte immédiat, Paul souligne que les serviteurs appartiennent à Dieu et sont à son service, tandis que les Corinthiens sont le champ et l’édifice de Dieu. Cependant, le génitif grec permet aussi l’idée d’une collaboration avec Dieu ; cette ambiguïté réelle est donc préservée en note.
translation_notes:
  register: Français international moderne, clair et digne. La répétition de « Dieu » est conservée afin de reproduire l’insistance et le parallélisme du grec.
