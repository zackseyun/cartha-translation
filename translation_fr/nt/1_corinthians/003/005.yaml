source:
  edition: SBLGNT
  text: ⸀Τί οὖν ἐστιν ⸂Ἀπολλῶς; τί δέ ἐστιν Παῦλος⸃; ⸀διάκονοι δι’ ὧν ἐπιστεύσατε, καὶ ἑκάστῳ ὡς ὁ κύριος ἔδωκεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/005.yaml
  text: What then is Apollos? And what is Paul? Servants through whom you believed[c][b][a], as the Lord gave to each one.
translation:
  language: fr
  text: Qu’est-ce donc qu’Apollos ? Et Paul, qu’est-il ? Des serviteurs par qui vous avez cru, selon ce que le Seigneur a donné à chacun[c][b][a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi traduire : « Qui donc est Apollos ? Et qui est Paul ? » Le grec emploie le neutre τί (« quoi »), ce qui met l’accent sur leur rôle plutôt que sur leur identité.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « ministres ». Le mot grec désigne ici des serviteurs ou des agents au service d’une œuvre, sans renvoyer nécessairement à la fonction ecclésiale de diacre.'
    reason: lexical_alternative
  - marker: c
    text: 'L’expression grecque est elliptique : elle ne précise pas ce que le Seigneur a donné à chacun. On pourrait aussi comprendre : « selon ce que le Seigneur a assigné à chacun ».'
    reason: alternative_reading
lexical_decisions:
- source_word: Τί
  choice: Qu’est
  rationale: Le pronom interrogatif neutre porte ici sur le rôle ou le statut d’Apollos et de Paul plutôt que sur leur identité personnelle. « Qu’est » conserve cette nuance rhétorique.
- source_word: οὖν
  choice: donc
  rationale: « Donc » rend la valeur inférentielle et transitionnelle du terme dans un français naturel.
- source_word: δέ
  choice: Et
  rationale: Dans cette paire de questions, δέ introduit une légère transition ou mise en parallèle ; « Et » convient mieux qu’une opposition forte.
- source_word: διάκονοι
  choice: serviteurs
  rationale: Le mot désigne ici des personnes au service d’une œuvre, et non nécessairement les titulaires de la fonction ecclésiale de diacre.
- source_word: δι’ ὧν
  choice: par l’intermédiaire desquels
  rationale: Cette expression conserve clairement la valeur de moyen ou d’intermédiaire de διά avec le génitif.
- source_word: ἐπιστεύσατε
  choice: vous avez cru
  rationale: La formulation directe rend l’acte de croire sans ajouter un complément ou une interprétation absents du grec.
- source_word: καὶ ἑκάστῳ ὡς ὁ κύριος ἔδωκεν
  choice: selon ce que le Seigneur a donné à chacun
  rationale: Cette formulation française reste concise et laisse indéterminée la nature de ce qui a été donné, tout en rendant intelligible la construction elliptique grecque.
- source_word: κύριος
  choice: Seigneur
  rationale: « Seigneur » est l’équivalent français établi et laisse le référent implicite comme dans le texte grec.
theological_decisions:
- issue: Référent de κύριος
  choice: Conserver simplement « le Seigneur » dans le texte.
  alternative: Préciser « le Seigneur Jésus » ou comprendre plus généralement « Dieu ».
  rationale: Le contexte paulinien peut orienter vers Jésus-Christ, mais le verset lui-même ne précise pas le référent ; la traduction ne doit donc pas le surdéterminer.
- issue: Ellipse de « selon ce que le Seigneur a donné à chacun »
  choice: Ne pas nommer ce qui a été donné.
  alternative: Ajouter « une tâche », « un rôle » ou « un ministère ».
  rationale: Le grec ne donne pas de complément explicite à ἔδωκεν. La formulation retenue reste naturelle en français sans résoudre cette ouverture interprétative.
translation_notes:
  register: Français international moderne, digne et accessible. Les questions inhabituelles avec « qu’est » sont maintenues pour préserver l’accent du grec sur le rôle des deux hommes. « Par l’intermédiaire desquels » est légèrement soutenu, mais précis et idiomatique dans ce contexte.
