id: 1CO.9.2
reference: 1 Corinthians 9:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἰ ἄλλοις οὐκ εἰμὶ ἀπόστολος, ἀλλά γε ὑμῖν εἰμι, ἡ γὰρ σφραγίς ⸂μου τῆς⸃ ἀποστολῆς ὑμεῖς ἐστε ἐν κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/002.yaml
  text: If I am not an apostle to others[a], yet I certainly am to you, for you are the seal of my apostleship in the Lord.
translation:
  language: fr
  text: Si, pour d’autres, je ne suis pas apôtre, je le suis du moins pour vous, car vous êtes le sceau[a] de mon apostolat dans le Seigneur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la preuve » ou « l’attestation ». Le grec dit littéralement « le sceau », image de ce qui confirme l’authenticité.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπόστολος
  choice: apôtre
  rationale: Dans cette défense où Paul parle de lui-même, le terme désigne sa charge et son mandat reconnus, et non simplement un messager.
- source_word: ἀλλά γε
  choice: je le suis du moins
  rationale: « Du moins » exprime à la fois le contraste et l’insistance portée par γε, dans une tournure française naturelle.
- source_word: σφραγίς
  choice: sceau
  rationale: Le mot évoque un sceau qui atteste l’authenticité. « Sceau » conserve cette image tout en laissant entendre sa valeur probante.
- source_word: ἀποστολή
  choice: apostolat
  rationale: Le nom renvoie ici à la charge ou au mandat apostolique de Paul ; « apostolat » en garde la portée institutionnelle et personnelle.
- source_word: ἐν κυρίῳ
  choice: dans le Seigneur
  rationale: Cette formulation paulinienne est conservée sans la réduire à une simple idée de moyen ou d’agent.
- source_word: ἄλλοις
  choice: pour d’autres
  rationale: Le datif exprime ici la relation entre l’apôtre et ceux auprès de qui son apostolat est reconnu ou exercé ; « pour d’autres » est idiomatique en français.
theological_decisions:
- issue: Portée de l’affirmation de Paul concernant son apostolat
  choice: 'La formulation conditionnelle et rhétorique est conservée : même si son apostolat n’est pas reconnu en relation avec d’autres, les Corinthiens attestent eux-mêmes qu’il est apôtre pour eux.'
  alternative: Comprendre que Paul limite réellement son apostolat aux seuls Corinthiens.
  rationale: Le contexte est celui d’une défense de son apostolat. La syntaxe n’oblige toutefois pas à expliciter dans le texte qu’il s’agit seulement de l’opinion d’autrui ; la traduction préserve donc la tension de l’original.
- issue: Portée de « dans le Seigneur »
  choice: La locution est maintenue en fin de phrase, comme en grec, afin de ne pas préciser excessivement son rattachement.
  alternative: La rattacher explicitement soit au fait que les Corinthiens sont le sceau, soit à l’apostolat de Paul.
  rationale: L’expression situe l’attestation que représentent les Corinthiens dans la sphère de leur relation au Seigneur, mais sa position permet une certaine souplesse syntaxique qu’il convient de préserver.
translation_notes:
  register: Français moderne, digne et accessible. La reprise « je le suis » évite une lourde répétition, tandis que « du moins » restitue l’insistance contrastive. L’ordre final de « dans le Seigneur » maintient la densité et une part de l’ambiguïté syntaxique du grec.
