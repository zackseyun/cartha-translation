source:
  edition: SBLGNT
  text: καὶ ἐγενόμην τοῖς Ἰουδαίοις ὡς Ἰουδαῖος, ἵνα Ἰουδαίους κερδήσω· τοῖς ὑπὸ νόμον ὡς ὑπὸ νόμον, ⸂μὴ ὢν αὐτὸς ὑπὸ νόμον⸃, ἵνα τοὺς ὑπὸ νόμον κερδήσω·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/020.yaml
  text: And to the Jews I became as a Jew[a], so that I might win Jews; to those under the law[b], as under the law—though I myself am not under the law—so that I might win those under the law.
translation:
  language: fr
  text: Avec les Juifs, je me suis fait comme un Juif, afin de gagner[a] les Juifs. Avec ceux qui sont sous la loi[b], je me suis fait comme quelqu’un qui est sous la loi — sans être moi-même sous la loi — afin de gagner ceux qui sont sous la loi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe grec peut aussi signifier « gagner » ou « acquérir » ; appliqué à des personnes, il peut exprimer l’idée de les gagner.
    reason: lexical_alternative
  - marker: b
    text: Ici, « la loi » désigne très probablement la loi de Moïse.
    reason: cultural_note
lexical_decisions:
- source_word: ἐγενόμην
  choice: je me suis fait
  rationale: Dans ce contexte, le verbe exprime l’adoption volontaire d’une manière d’agir adaptée à différents groupes. « Je me suis fait » est naturel en français et évite de suggérer que Paul aurait changé d’identité ethnique.
- source_word: τοῖς Ἰουδαίοις ... ὡς Ἰουδαῖος
  choice: Avec les Juifs ... comme un Juif
  rationale: « Avec » rend naturellement la relation exprimée par le datif, tandis que « comme un Juif » conserve la comparaison marquée par ὡς sans nier que Paul soit lui-même juif.
- source_word: ἵνα ... κερδήσω
  choice: afin de gagner
  rationale: κερδαίνω signifie proprement « gagner, obtenir un gain » et, appliqué à des personnes dans ce contexte missionnaire, « gagner à sa cause ». Le français « gagner » conserve cette image et reste idiomatique.
- source_word: τοῖς ὑπὸ νόμον
  choice: avec ceux qui sont sous la loi
  rationale: La formulation conserve la métaphore grecque de personnes placées « sous » la loi et traite le groupe prépositionnel substantivé de façon naturelle en français.
- source_word: ὡς ὑπὸ νόμον
  choice: comme quelqu’un qui est sous la loi
  rationale: Cette formulation développe légèrement l’expression grecque elliptique pour obtenir un français clair, tout en maintenant le parallèle avec « comme un Juif ».
- source_word: μὴ ὢν αὐτὸς ὑπὸ νόμον
  choice: sans être moi-même sous la loi
  rationale: Le participe présent négatif constitue une précision simultanée. « Sans être » conserve cette relation et les tirets en marquent le caractère incident.
- source_word: αὐτὸς
  choice: moi-même
  rationale: Le pronom intensif souligne que Paul parle expressément de sa propre situation.
- source_word: νόμος
  choice: la loi
  rationale: Dans le voisinage immédiat de la mention des Juifs, il s’agit très probablement de la loi mosaïque. Le texte garde néanmoins l’expression plus générale de Paul, et la note précise le référent probable.
theological_decisions:
- issue: Sens de l’affirmation de Paul selon laquelle il n’est pas « sous la loi »
  choice: Traduire directement « sans être moi-même sous la loi », sans précision explicative.
  alternative: « sans être moi-même sous la loi de Moïse » ou une formulation harmonisée avec le verset 21
  rationale: Le grec de ce verset affirme seulement que Paul n’est pas sous la loi. Ajouter « de Moïse » dans le texte ou importer la formulation du verset suivant réduirait une tension théologique que le texte laisse ici ouverte.
translation_notes:
  register: Français international moderne, clair et digne. La répétition de « sous la loi » et de « gagner » est maintenue pour reproduire la structure rhétorique du grec. Les tirets signalent l’incise sans transformer l’affirmation en explication doctrinale.
