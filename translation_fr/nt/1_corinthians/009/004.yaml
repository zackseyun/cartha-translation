  language: fr
  text: N’avons-nous pas le droit de manger et de boire ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot grec traduit par « droit » peut aussi désigner une autorité ou une liberté légitime. Dans l’argument de Paul, il s’agit probablement du droit de recevoir une aide matérielle, notamment de quoi manger et boire.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ οὐκ
  choice: N’avons-nous pas
  rationale: Cette tournure rend naturellement en français la question rhétorique qui attend une réponse affirmative.
- source_word: ἔχομεν
  choice: avons
  rationale: Le présent du verbe « avoir » correspond directement au grec et convient au ton de l’argument.
- source_word: ἐξουσίαν
  choice: le droit
  rationale: Dans ce contexte, le terme désigne une prérogative ou une liberté légitime, plutôt qu’un pouvoir exercé sur autrui. « Le droit » exprime clairement cette idée sans préciser excessivement sa portée.
- source_word: φαγεῖν καὶ πεῖν
  choice: de manger et de boire
  rationale: Les deux infinitifs coordonnés sont rendus par la construction française naturelle « de… et de… », qui conserve les deux actions distinctes.
theological_decisions:
- issue: Portée du droit apostolique évoqué
  choice: Le texte principal conserve la formulation générale « le droit de manger et de boire ».
  alternative: Préciser dans le texte qu’il s’agit du droit de recevoir une aide matérielle ou d’être nourri aux frais des communautés.
  rationale: Le contexte de 1 Corinthiens 9 indique probablement le soutien matériel dû aux apôtres, mais le verset lui-même formule ce droit sans expliciter qui fournit la nourriture et la boisson. La traduction préserve donc cette retenue et laisse la note éclairer le contexte.
translation_notes:
  register: Français international moderne, naturel et digne. La question rhétorique reste concise et conserve l’attente d’une réponse affirmative.
