id: 1CO.9.11
reference: 1 Corinthians 9:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἰ ἡμεῖς ὑμῖν τὰ πνευματικὰ ἐσπείραμεν, μέγα εἰ ἡμεῖς ὑμῶν τὰ σαρκικὰ θερίσομεν;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/011.yaml
  text: If we have sown spiritual things among you[a], is it too much if we reap material things from you?
translation:
  language: fr
  text: Si nous avons semé parmi vous des biens spirituels, serait-ce trop que nous récoltions de vous des biens matériels[a] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des biens liés à la vie ordinaire ». Le grec oppose ici les biens spirituels à ceux qui relèvent de la vie corporelle ou matérielle.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ πνευματικὰ
  choice: des biens spirituels
  rationale: L’adjectif neutre pluriel employé comme nom désigne largement ce qui relève du domaine spirituel, notamment les bienfaits reçus par le ministère apostolique. « Biens spirituels » reste naturel en français sans préciser indûment leur nature.
- source_word: ἐσπείραμεν
  choice: avons semé
  rationale: Le passé composé exprime naturellement en français l’action antérieure de Paul et de ses collaborateurs tout en conservant son incidence présente dans l’image des semailles et de la moisson.
- source_word: ὑμῖν
  choice: parmi vous
  rationale: Dans ce contexte de semailles métaphoriques, « parmi vous » indique idiomatiquement le champ de l’activité apostolique. « Pour vous » serait également possible, mais rendrait moins nettement l’image.
- source_word: μέγα
  choice: serait-ce trop
  rationale: Dans cette question rhétorique, μέγα demande si la contrepartie envisagée serait excessive ou déraisonnable. Le conditionnel français convient naturellement à cette construction.
- source_word: τὰ σαρκικὰ
  choice: des biens matériels
  rationale: Le terme désigne ici les ressources liées à la vie corporelle et ordinaire, notamment le soutien matériel, par contraste avec les biens spirituels. « Choses charnelles » risquerait à tort d’évoquer le péché ou les désirs mauvais.
- source_word: θερίσομεν
  choice: que nous récoltions
  rationale: Le verbe prolonge l’image agricole. Après « serait-ce trop que », le subjonctif présent est idiomatique en français et exprime la perspective future ou éventuelle portée par le futur grec.
- source_word: ὑμῶν
  choice: de vous
  rationale: 'Le génitif marque ici la provenance de ce qui serait récolté : le soutien matériel viendrait des Corinthiens.'
- source_word: ἡμεῖς
  choice: nous
  rationale: Le pronom explicite souligne les acteurs du ministère apostolique. La répétition de « nous » dans les deux propositions conserve suffisamment cette insistance en français.
theological_decisions:
- issue: Sens de σαρκικὰ en contraste avec πνευματικὰ
  choice: Les ressources matérielles ou corporelles destinées au soutien du ministère
  alternative: Les choses charnelles au sens moralement négatif
  rationale: Le contexte défend le droit des apôtres à recevoir un soutien concret. L’opposition porte donc sur deux domaines, spirituel et matériel, et non sur une opposition entre sainteté et conduite pécheresse.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation conserve la métaphore agricole ainsi que la force de la question rhétorique. « Biens » rend les deux adjectifs substantivés sans les réduire à des objets précisément définis.
