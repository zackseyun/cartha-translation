source:
  edition: SBLGNT
  text: ἢ δι’ ἡμᾶς πάντως λέγει; δι’ ἡμᾶς γὰρ ἐγράφη, ὅτι ⸂ὀφείλει ἐπ’ ἐλπίδι⸃ ὁ ἀροτριῶν ἀροτριᾶν, καὶ ὁ ἀλοῶν ⸂ἐπ’ ἐλπίδι τοῦ μετέχειν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/010.yaml
  text: Or is he speaking entirely for our sake? Yes[a], it was written for our sake, because the one who plows ought to plow in hope[b], and the one who threshes ought to thresh in hope of sharing.
translation:
  language: fr
  text: 'Ou bien parle-t-il vraiment pour nous ? Oui[a], c’est pour nous que cela a été écrit : celui qui laboure doit labourer dans l’espérance, et celui qui bat le grain, dans l’espérance d’avoir sa part[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot grec traduit ici par « vraiment » peut aussi signifier « entièrement » ou « certainement » ; il renforce la question rhétorique.
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « dans l’espérance d’avoir part ». L’objet de cette participation n’est pas précisé en grec ; le contexte agricole suggère le produit du travail.
    reason: implicit_meaning
lexical_decisions:
- source_word: πάντως
  choice: vraiment
  rationale: Dans la question rhétorique, l’adverbe renforce l’affirmation. « Vraiment » reste naturel en français tout en préservant une certaine ambiguïté entre totalité et certitude.
- source_word: δι’ ἡμᾶς
  choice: pour nous
  rationale: Cette formulation rend simplement la valeur bénéficiaire de διά avec l’accusatif et convient à la répétition dans l’argument de Paul.
- source_word: ἐγράφη
  choice: cela a été écrit
  rationale: Le passé composé passif est idiomatique dans une formule française renvoyant à un texte scripturaire écrit antérieurement et toujours pertinent.
- source_word: ὀφείλει
  choice: doit
  rationale: « Doit » exprime nettement l’obligation ou ce qui est légitimement attendu, sans la lourdeur de « est tenu de ».
- source_word: ἐπ’ ἐλπίδι
  choice: avec l’espoir
  rationale: Cette expression française rend la disposition et l’attente motivant le travail agricole.
- source_word: ὁ ἀροτριῶν ἀροτριᾶν
  choice: celui qui laboure doit labourer
  rationale: La tournure générique conserve le parallélisme et le rapport entre le participe substantivé et l’infinitif.
- source_word: ὁ ἀλοῶν
  choice: celui qui bat le grain
  rationale: « Battre le grain » est une formulation actuelle et compréhensible pour l’action agricole désignée par ἀλοάω.
- source_word: τοῦ μετέχειν
  choice: d’avoir sa part
  rationale: Cette tournure exprime naturellement l’idée de participer ou de recevoir une part, tout en laissant implicite l’objet précis comme en grec.
theological_decisions:
- issue: Objet implicite de μετέχειν
  choice: 'Ne pas préciser l’objet : « avoir sa part »'
  alternative: « avoir sa part de la récolte »
  rationale: Le contexte agricole permet de comprendre la récolte, mais le grec ne nomme pas l’objet. La formulation retenue préserve cette ellipse tout en restant claire en français.
- issue: Portée de πάντως dans la question rhétorique
  choice: « vraiment », accompagné d’une note
  alternative: « entièrement » ou « certainement »
  rationale: Le mot peut intensifier soit la totalité (« entièrement »), soit l’assurance rhétorique (« certainement »). Le texte et la note conservent cette tension sans imposer une seule nuance.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme agricole est conservé, avec une légère variation (« doit le faire ») pour éviter une répétition pesante. « Battre le grain » privilégie la compréhension courante plutôt que le terme technique « dépiquer ».
