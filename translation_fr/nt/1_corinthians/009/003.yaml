  text: Ἡ ἐμὴ ἀπολογία τοῖς ἐμὲ ἀνακρίνουσίν ⸂ἐστιν αὕτη⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/003.yaml
  text: This is my defense to those who examine me[a].
translation:
  language: fr
  text: Voici ma défense devant ceux qui m'examinent[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Voici ma défense à ceux qui me jugent. »
    reason: 'Alternative lexicale : le verbe grec peut évoquer l''examen critique ou le jugement, et le datif peut désigner les destinataires de la défense.'
lexical_decisions:
- source_word: ἀπολογία
  choice: défense
  rationale: Dans ce contexte, Paul répond à l'examen critique de son apostolat, de ses droits et de sa conduite. « Défense » rend naturellement une réponse à des critiques sans suggérer, comme le ferait « excuses », l'expression d'un regret.
- source_word: ἀνακρίνουσίν
  choice: examinent
  rationale: Le verbe désigne ici une évaluation critique ou un interrogatoire. « Examinent » conserve cette portée sans impliquer aussi fortement qu'« jugent » un verdict définitif.
- source_word: Ἡ ἐμὴ
  choice: ma
  rationale: Le possessif français simple rend adéquatement le grec ; « ma propre » ajouterait une insistance qui n'est pas nécessaire ici.
- source_word: τοῖς ἐμὲ ἀνακρίνουσίν
  choice: devant ceux qui m'examinent
  rationale: Le datif indique les personnes auxquelles ou devant lesquelles la défense est présentée. Avec « défense », « devant » est idiomatique en français et fait ressortir la nuance quasi judiciaire du contexte.
- source_word: ἐστιν αὕτη
  choice: Voici
  rationale: « Voici » rend de façon naturelle la construction identificatrice grecque et peut désigner la défense que Paul va exposer ou la réponse liée au contexte immédiat.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve la tonalité de défense face à un examen critique sans rendre le cadre plus strictement judiciaire que ne l'impose le grec.
