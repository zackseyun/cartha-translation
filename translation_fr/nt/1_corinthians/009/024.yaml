id: 1CO.9.24
reference: 1 Corinthians 9:24
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Οὐκ οἴδατε ὅτι οἱ ἐν σταδίῳ τρέχοντες πάντες μὲν τρέχουσιν, εἷς δὲ λαμβάνει τὸ βραβεῖον; οὕτως τρέχετε ἵνα καταλάβητε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/024.yaml
  text: Do you not know that those who run in a stadium all run[a], but one receives the prize? Run in this way[b], so that you may obtain it.
translation:
  language: fr
  text: Ne savez-vous pas que ceux qui courent dans un stade[a] courent tous, mais qu’un seul reçoit le prix ? Courez ainsi, afin de l’obtenir[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « sur une piste de course ». Le grec στάδιον désigne le lieu où se déroule la course : un stade ou une piste.'
    reason: lexical_alternative
  - marker: b
    text: Ou « afin de le saisir » ou « afin de le remporter ». Le grec καταλάβητε peut signifier « obtenir », « saisir » ou « atteindre ».
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐκ οἴδατε
  choice: Ne savez-vous pas
  rationale: Conserve la question rhétorique habituelle chez Paul et le sens direct de οἶδα, dans une formulation française naturelle.
- source_word: ἐν σταδίῳ
  choice: dans un stade
  rationale: Désigne concrètement le lieu aménagé pour la course et maintient l’image sportive du texte grec.
- source_word: οἱ ... τρέχοντες ... πάντες ... τρέχουσιν
  choice: ceux qui courent ... courent tous
  rationale: Reproduit la répétition de τρέχω et reste intelligible en français, tout en conservant l’insistance sur l’ensemble des participants.
- source_word: πάντες μὲν ... εἷς δὲ
  choice: tous, mais ... un seul
  rationale: Rend clairement l’opposition μέν…δέ sans alourdir la phrase par une traduction mécanique des particules.
- source_word: λαμβάνει
  choice: reçoit
  rationale: Correspond au sens direct du verbe et évite de confondre ce verbe avec l’idée de gagner, déjà suggérée par le contexte sportif.
- source_word: τὸ βραβεῖον
  choice: le prix
  rationale: Terme français courant pour la récompense remise au vainqueur d’une compétition.
- source_word: οὕτως
  choice: ainsi
  rationale: Expression concise qui relie l’exhortation à l’image précédente, sans préciser excessivement la manière de courir.
- source_word: τρέχετε
  choice: Courez
  rationale: Impératif direct, énergique et naturel. Le présent grec peut impliquer une action continue, mais le français n’a pas besoin de l’expliciter.
- source_word: ἵνα καταλάβητε
  choice: afin de l’obtenir
  rationale: Rend le but exprimé par ἵνα et un sens contextuellement approprié de καταλαμβάνω. Le pronom renvoie naturellement au prix mentionné juste avant.
theological_decisions:
- issue: Application de la métaphore sportive à la persévérance chrétienne
  choice: Conserver l’image compétitive et l’exhortation à poursuivre résolument le prix, sans définir la nature de celui-ci.
  alternative: Traduire de façon plus interprétative par « Courez pour gagner » ou préciser qu’il s’agit du salut ou d’une récompense particulière.
  rationale: Le verset exhorte par analogie, mais ne précise ici ni la nature exacte du prix ni son rapport doctrinal au mérite, au salut ou à la récompense. La traduction préserve cette tension.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « courent » est conservée pour refléter l’insistance du grec, malgré une légère lourdeur rhétorique assumée.
