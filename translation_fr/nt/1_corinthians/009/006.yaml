  text: ἢ μόνος ἐγὼ καὶ Βαρναβᾶς οὐκ ἔχομεν ἐξουσίαν ⸀μὴ ἐργάζεσθαι;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/006.yaml
  text: Or is it only Barnabas and I who have no right not to work?[a]
translation:
  language: fr
  text: Ou bien, sommes-nous les seuls, Barnabas et moi, à ne pas avoir le droit de ne pas travailler ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’autorité de ne pas travailler » ou « la liberté de ne pas exercer un travail ». Dans ce contexte, il s’agit du droit de renoncer à un travail manuel destiné à subvenir à ses besoins afin de recevoir un soutien matériel pour son ministère.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ
  choice: Ou bien
  rationale: Introduit naturellement en français une nouvelle possibilité dans la série de questions rhétoriques de Paul.
- source_word: μόνος
  choice: les seuls
  rationale: Le singulier grec porte sur le sujet coordonné « moi et Barnabas » ; le pluriel français est requis et souligne leur prétendue exception.
- source_word: ἐγὼ καὶ Βαρναβᾶς
  choice: Barnabas et moi
  rationale: Cet ordre est idiomatique en français moderne et ne modifie pas le sens du grec.
- source_word: οὐκ ἔχομεν
  choice: à ne pas avoir
  rationale: Dans la construction interrogative « sommes-nous les seuls… », cette formulation rend naturellement l'indicatif présent nié.
- source_word: ἐξουσίαν
  choice: le droit
  rationale: Dans ce contexte, le terme désigne une prérogative légitime liée au soutien matériel, plutôt qu'une autorité exercée sur autrui.
- source_word: μὴ ἐργάζεσθαι
  choice: de ne pas travailler
  rationale: Rend directement le contenu du droit revendiqué, sans ajouter dans le corps du verset la précision contextuelle concernant le travail manuel destiné à subvenir à ses besoins.
theological_decisions:
- issue: Portée de l'ἐξουσία revendiquée par Paul
  choice: Le droit apostolique de ne pas exercer un travail pour subvenir à ses besoins et de recevoir un soutien matériel.
  alternative: Une autorité ou une liberté générale, sans référence précise au soutien matériel.
  rationale: Le contexte immédiat porte sur les droits des apôtres à recevoir nourriture et soutien. La traduction conserve néanmoins la formulation concise du grec et réserve l'explicitation à la note.
translation_notes:
  register: Français international moderne, naturel et digne. La double négation reflète étroitement le grec et demeure compréhensible dans cette question rhétorique ; la note précise le sens contextuel sans le surinterpréter dans le texte.
