id: 1CO.9.27
reference: 1 Corinthians 9:27
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀλλὰ ὑπωπιάζω μου τὸ σῶμα καὶ δουλαγωγῶ, μή πως ἄλλοις κηρύξας αὐτὸς ἀδόκιμος γένωμαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/027.yaml
  text: But I discipline my body and make it my servant[a], lest somehow, after preaching to others[c][b], I myself should become disqualified.
translation:
  language: fr
  text: Mais je traite durement mon corps et je l’asservis[a], de peur qu’après avoir prêché aux autres, je ne sois moi-même disqualifié[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « je frappe durement mon corps et j’en fais mon esclave ». Le premier verbe grec désigne littéralement le fait de frapper sous l’œil ; il évoque ici une discipline corporelle sévère.
    reason: lexical_alternative
  - marker: b
    text: Ou « rejeté », « non approuvé » ou « reconnu inapte ». « Disqualifié » correspond à l’image sportive du contexte sans préciser à lui seul la portée ultime de l’avertissement.
    reason: alternative_reading
lexical_decisions:
- source_word: ὑπωπιάζω
  choice: je traite durement
  rationale: Le verbe évoque littéralement le fait de frapper sous l’œil, puis, métaphoriquement, une discipline sévère. « Traiter durement » conserve la vigueur de l’image sans suggérer nécessairement une automutilation littérale.
- source_word: σῶμα
  choice: mon corps
  rationale: Le terme concret « corps » est maintenu, puisque Paul désigne explicitement son corps comme objet de cette discipline.
- source_word: δουλαγωγῶ
  choice: je le réduis en esclavage
  rationale: Le verbe signifie assujettir ou réduire en esclavage. Cette formulation préserve la force du statut servile dans la métaphore, plutôt que de l’atténuer en simple maîtrise de soi.
- source_word: μή πως
  choice: de peur que… ne
  rationale: Cette tournure française exprime naturellement l’appréhension introduite par la locution grecque.
- source_word: ἄλλοις
  choice: aux autres
  rationale: Le datif désigne naturellement les destinataires de la proclamation.
- source_word: κηρύξας
  choice: après avoir proclamé le message
  rationale: Le participe aoriste indique une action antérieure. « Proclamer le message » rend l’idée d’une annonce publique sans réduire nécessairement le terme au cadre d’un sermon.
- source_word: ἀδόκιμος
  choice: disqualifié
  rationale: Dans le contexte de la course, de la maîtrise de soi et du prix, « disqualifié » restitue bien l’idée de ne pas être reconnu apte après examen, tout en laissant ouverte la portée théologique exacte de l’avertissement.
- source_word: γένωμαι
  choice: je ne sois… disqualifié
  rationale: Le subjonctif dans la proposition d’appréhension exprime un résultat redouté; la syntaxe française appelle ici « sois » plutôt qu’une reproduction littérale de « devienne ».
- source_word: ἀλλὰ
  choice: Mais
  rationale: La conjonction marque le contraste avec ce qui précède et se rend naturellement par « Mais ».
theological_decisions:
- issue: Portée de la crainte de devenir ἀδόκιμος
  choice: « disqualifié », sans préciser s’il s’agit du salut, de la récompense ou de l’aptitude au ministère
  alternative: « rejeté » dans un sens ultime, ou seulement privé d’une récompense ou d’une fonction
  rationale: Le contexte sportif favorise « disqualifié », mais le grec ne tranche pas explicitement entre les interprétations théologiques proposées. La traduction conserve donc la gravité et l’ambiguïté de l’avertissement.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation conserve la vigueur des deux métaphores grecques — traitement sévère du corps et esclavage — ainsi que la tension théologique de l’adjectif final.
