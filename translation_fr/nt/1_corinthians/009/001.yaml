id: 1CO.9.1
reference: 1 Corinthians 9:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Οὐκ εἰμὶ ⸂ἐλεύθερος; οὐκ εἰμὶ ἀπόστολος⸃; οὐχὶ ⸀Ἰησοῦν τὸν κύριον ἡμῶν ἑόρακα; οὐ τὸ ἔργον μου ὑμεῖς ἐστε ἐν κυρίῳ;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/001.yaml
  text: Am I not free? Am I not an apostle? Have I not seen Jesus our Lord? Are you not my work in the Lord?[a]
translation:
  language: fr
  text: Ne suis-je pas libre ? Ne suis-je pas apôtre ? N’ai-je pas vu Jésus, notre Seigneur[a] ? N’êtes-vous pas mon œuvre dans le Seigneur ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, selon un ordre des mots plus courant : « notre Seigneur Jésus ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλεύθερος
  choice: libre
  rationale: Le terme affirme directement la liberté de Paul et ses droits dans le prolongement du contexte précédent.
- source_word: ἀπόστολος
  choice: apôtre
  rationale: Ici, le mot désigne la fonction apostolique reconnue de Paul, et non simplement un messager ou un envoyé quelconque.
- source_word: Ἰησοῦν τὸν κύριον ἡμῶν
  choice: Jésus, notre Seigneur
  rationale: Cette formulation suit de près l’ordre grec tout en restant naturelle en français ; « Seigneur » conserve la portée christologique de κύριος.
- source_word: ἑόρακα
  choice: n’ai-je pas vu
  rationale: Le passé composé français exprime naturellement l’acte accompli dont la portée demeure pertinente pour l’argument de Paul.
- source_word: ἔργον
  choice: œuvre
  rationale: Paul présente les croyants de Corinthe comme le fruit de son activité apostolique ; « œuvre » garde l’image sans l’expliciter.
- source_word: ἐν κυρίῳ
  choice: dans le Seigneur
  rationale: Cette expression paulinienne familière conserve la relation ou la sphère dans laquelle les Corinthiens sont l’œuvre de Paul.
- source_word: οὐκ / οὐχὶ / οὐ
  choice: Ne suis-je pas… ? / N’ai-je pas… ? / N’êtes-vous pas… ?
  rationale: Les négations introduisent des questions rhétoriques qui attendent une réponse affirmative ; les interrogations négatives françaises en rendent directement la force.
theological_decisions:
- issue: Portée de l’affirmation selon laquelle Paul a vu Jésus
  choice: Conserver la formulation simple « j’ai vu Jésus » dans un contexte où elle appuie son apostolat
  alternative: Préciser dans le texte que Paul a vu Jésus ressuscité
  rationale: Le contexte permet de comprendre une référence à la vision du Jésus ressuscité comme fondement de l’apostolat de Paul, mais le grec ne dit pas explicitement « ressuscité » ; la traduction préserve donc cette retenue et la tension du texte.
translation_notes:
  register: Français international moderne, clair et digne. La série de quatre questions rhétoriques est conservée, ainsi que les termes théologiquement établis « apôtre » et « Seigneur », sans ajout explicatif dans le corps du texte.
