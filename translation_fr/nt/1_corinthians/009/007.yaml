reference: 1 Corinthians 9:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τίς στρατεύεται ἰδίοις ὀψωνίοις ποτέ; τίς φυτεύει ἀμπελῶνα καὶ ⸂τὸν καρπὸν⸃ αὐτοῦ οὐκ ἐσθίει; ⸀τίς ποιμαίνει ποίμνην καὶ ἐκ τοῦ γάλακτος τῆς ποίμνης οὐκ ἐσθίει;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/007.yaml
  text: Who ever serves as a soldier at his own expense? Who plants a vineyard and does not eat its fruit? Or who shepherds a flock and does not drink from the milk of the flock?[a][b]
translation:
  language: fr
  text: Qui a jamais servi comme soldat à ses propres frais[a] ? Qui plante une vigne et ne mange pas de son fruit ? Ou qui fait paître un troupeau et ne boit pas du lait de ce troupeau[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « avec sa propre solde ». Le mot grec désigne la solde ou les rations d’un soldat ; l’idée est qu’il ne prend pas lui-même en charge le coût de son service.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « ne mange pas du lait de ce troupeau ». En français, on dit normalement « boire » lorsqu’il s’agit de lait.'
    reason: lexical_alternative
lexical_decisions:
- source_word: στρατεύεται
  choice: sert comme soldat
  rationale: Le verbe désigne l’accomplissement du service militaire. « Servir comme soldat » conserve l’analogie professionnelle sans la limiter au combat actif.
- source_word: ἰδίοις ὀψωνίοις
  choice: à ses propres frais
  rationale: ὀψώνιον peut désigner la solde ou les rations d’un soldat. Dans cette question rhétorique, l’idée est qu’un soldat ne finance pas lui-même son service ; cette tournure l’exprime clairement en français actuel.
- source_word: ποτέ
  choice: jamais
  rationale: Dans une question rhétorique, ποτέ signifie « jamais » ou « à un moment quelconque ». Le passé composé rend ici l’expression « Qui a jamais… ? » naturelle en français.
- source_word: φυτεύει ἀμπελῶνα
  choice: plante une vigne
  rationale: Traduction directe et idiomatique de l’image agricole.
- source_word: τὸν καρπὸν αὐτοῦ
  choice: de son fruit
  rationale: καρπός désigne ici le fruit ou le produit de la vigne. « Son fruit » reste proche du grec et se comprend naturellement.
- source_word: ποιμαίνει ποίμνην
  choice: fait paître un troupeau
  rationale: ποιμαίνω signifie faire paître, garder ou prendre soin d’un troupeau. « Fait paître » préserve clairement l’image pastorale.
- source_word: ἐκ τοῦ γάλακτος τῆς ποίμνης
  choice: du lait de ce troupeau
  rationale: La préposition ἐκ exprime ici la provenance ou la participation à ce que produit le troupeau. La formulation française conserve cette relation.
- source_word: ἐσθίει
  choice: mange / boit
  rationale: Le même verbe, littéralement « manger », apparaît dans les deux questions. Avec le lait, le français courant exige normalement « boire ».
theological_decisions:
- issue: Masculin singulier générique dans les questions répétées introduites par τίς
  choice: Conserver le singulier représentatif, notamment dans « à ses propres frais »
  alternative: Employer une formulation au pluriel ou explicitement inclusive
  rationale: Le grec présente des exemples professionnels au singulier masculin de portée générale. Le français peut conserver cette forme sans restreindre le principe énoncé aux seuls hommes.
translation_notes:
  register: Français international actuel, digne et accessible. Les trois questions rhétoriques parallèles sont conservées. Le passé composé dans la première (« Qui a jamais servi… ? ») rend naturellement la valeur de ποτέ, tandis que les deux images agricoles restent au présent comme dans le grec.
