source:
  edition: SBLGNT
  text: μὴ οὐκ ἔχομεν ἐξουσίαν ἀδελφὴν γυναῖκα περιάγειν, ὡς καὶ οἱ λοιποὶ ἀπόστολοι καὶ οἱ ἀδελφοὶ τοῦ κυρίου καὶ Κηφᾶς;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/005.yaml
  text: Do we not have the right to take along a sister as a wife[a], as also the rest of the apostles and the brothers of the Lord and Cephas?
translation:
  language: fr
  text: N’avons-nous pas le droit d’emmener avec nous une épouse croyante[a], comme le font aussi les autres apôtres, les frères du Seigneur et Céphas ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « une sœur, une épouse » ; probablement une épouse qui partage la foi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξουσίαν
  choice: le droit
  rationale: Dans ce contexte, le terme désigne une prérogative apostolique légitime plutôt qu’une autorité abstraite.
- source_word: ἀδελφὴν γυναῖκα
  choice: une sœur pour épouse
  rationale: Cette formulation conserve les deux éléments grecs et indique qu’il s’agit d’une épouse qui appartient aussi à la communauté croyante, sans réduire le sens à une simple compagne de voyage.
- source_word: περιάγειν
  choice: emmener avec nous
  rationale: Le verbe évoque le fait de faire voyager quelqu’un avec soi; cette tournure est naturelle en français dans le contexte des déplacements missionnaires.
- source_word: ὡς καὶ
  choice: comme le font aussi
  rationale: La tournure explicite naturellement en français la comparaison additive implicite dans le grec.
- source_word: οἱ λοιποὶ ἀπόστολοι
  choice: les autres apôtres
  rationale: « Les autres » exprime naturellement le reste du groupe auquel Paul se compare.
- source_word: οἱ ἀδελφοὶ τοῦ κυρίου
  choice: les frères du Seigneur
  rationale: Traduction directe qui ne tranche pas la nature exacte de leur lien familial.
- source_word: Κηφᾶς
  choice: Céphas
  rationale: Le nom employé dans le texte grec est conservé plutôt que remplacé par Pierre.
theological_decisions:
- issue: Sens de « les frères du Seigneur »
  choice: Conserver « les frères du Seigneur » sans préciser la nature de leur parenté.
  alternative: Les frères biologiques de Jésus; ses demi-frères ou frères par alliance; des proches parents.
  rationale: L’expression grecque ne tranche pas à elle seule les débats ultérieurs sur leur lien familial exact.
- issue: Sens de ἀδελφὴν γυναῖκα
  choice: Traduire « une sœur pour épouse » et expliquer en note qu’il s’agit d’une épouse croyante.
  alternative: Une épouse croyante; une femme chrétienne; une sœur comme épouse.
  rationale: La traduction garde la forme inhabituelle et les deux substantifs du grec, tandis que la note clarifie le sens le plus probable sans effacer complètement la formulation source.
translation_notes:
  register: Français international moderne, digne et accessible. La question rhétorique est conservée. « Comme le font aussi » évite une comparaison elliptique peu naturelle, et « Céphas » respecte la forme du nom présente dans le grec.
