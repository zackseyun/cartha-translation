  source_fidelity: 'Le sens général est fidèle : « le droit » rend bien ἐξουσίαν dans ce contexte, « emmener avec nous » rend naturellement περιάγειν, et « les frères du Seigneur » ainsi que « Céphas » préservent les expressions et le nom grecs sans trancher de débats ultérieurs. Cependant, ἀδελφὴν γυναῖκα désigne idiomatiquement une épouse qui est aussi une sœur dans la foi ; la formulation actuelle peut être comprise en français comme « prendre une sœur [familiale] pour épouse ».'
  naturalness: « Une sœur pour épouse » est très peu idiomatique et crée une ambiguïté involontaire et grave en français moderne. « Une épouse croyante » est naturel, précis dans le contexte, et la note conserve utilement la forme littérale inhabituelle du grec.
  terminology: « Épouse croyante » exprime la double qualification portée par ἀδελφή et γυνή sans employer l’anachronique « chrétienne ». « Seigneur » et « Céphas » sont correctement conservés. La note ne doit pas présenter son explication contextuelle comme si elle était la seule valeur lexicale possible ; « probablement » convient.
