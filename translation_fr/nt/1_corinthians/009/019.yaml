id: 1CO.9.19
reference: 1 Corinthians 9:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἐλεύθερος γὰρ ὢν ἐκ πάντων πᾶσιν ἐμαυτὸν ἐδούλωσα, ἵνα τοὺς πλείονας κερδήσω·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/019.yaml
  text: For though I am free from all[a], I made myself a servant to all, so that I might win more of them.
translation:
  language: fr
  text: Car, bien que je sois libre à l’égard de tous[a], je me suis fait l’esclave de tous afin d’en gagner davantage.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « libre de tous » ou « libre par rapport à tous ».'
    reason: La formulation grecque compacte peut exprimer la liberté à l’égard de toute personne; la note en conserve la forme plus littérale.
lexical_decisions:
- source_word: Ἐλεύθερος
  choice: libre
  rationale: Le terme désigne une personne qui n’est ni asservie ni soumise à l’autorité d’autrui. « Libre » rend directement le grec et maintient le contraste avec le langage de l’esclavage.
- source_word: ἐκ πάντων
  choice: à l’égard de tous
  rationale: Dans ce contexte, ἐκ exprime la liberté de Paul par rapport à toute personne, et non un mouvement hors d’un groupe. Cette formulation française est naturelle tout en préservant la portée relationnelle de l’expression.
- source_word: πᾶσιν
  choice: de tous
  rationale: Avec « se faire l’esclave de », le complément introduit naturellement par « de » désigne toutes les personnes auxquelles Paul choisit de se soumettre. La répétition de « tous » conserve le parallélisme grec.
- source_word: ἐμαυτὸν ἐδούλωσα
  choice: je me suis fait l’esclave
  rationale: Le verbe δουλόω appartient explicitement au vocabulaire de l’esclavage. La tournure réflexive indique une soumission volontaire et conserve le contraste central entre « libre » et « esclave ».
- source_word: ἵνα
  choice: afin de
  rationale: Cette locution exprime clairement et naturellement le but en français moderne.
- source_word: τοὺς πλείονας
  choice: davantage
  rationale: Le comparatif signifie que Paul veut gagner un nombre plus élevé de personnes. « Davantage » préserve la comparaison sans introduire l’idée plus forte de « autant que possible » ni affirmer une majorité absolue.
- source_word: κερδήσω
  choice: gagner
  rationale: Le verbe conserve la métaphore d’un gain appliqué ici à des personnes dans le cadre de la mission de Paul.
theological_decisions:
- issue: Rendu du vocabulaire de l’esclavage dans ἐμαυτὸν ἐδούλωσα
  choice: je me suis fait l’esclave
  alternative: je me suis fait le serviteur
  rationale: « Esclave » garde la force du verbe grec et rend perceptible l’opposition rhétorique voulue entre la liberté de Paul et la soumission radicale qu’il choisit. « Serviteur » atténuerait cette tension.
- issue: Portée de τοὺς πλείονας
  choice: en gagner davantage
  alternative: gagner le plus grand nombre
  rationale: Le grec est comparatif (« plus »), sans préciser explicitement le point de comparaison. « Davantage » conserve cette relative indétermination, tandis que « le plus grand nombre » peut suggérer une majorité ou un superlatif.
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme « libre à l’égard de tous / esclave de tous » est maintenu, ainsi que la métaphore du gain. La virgule avant « afin de » est omise pour une lecture fluide, le complément de but étant étroitement lié à l’action.
