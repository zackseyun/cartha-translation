  naturalness: La phrase est naturelle, claire et sobre en français international moderne. « Proclament » convient au caractère public de καταγγέλλω, et « vivre de l’Évangile » est une formulation française établie et intelligible dans ce contexte.
  terminology: « Seigneur » et « Évangile » sont des équivalents cohérents et non interprétatifs. La note explique justement que « vivre de l’Évangile » vise les moyens de subsistance dans l’argument environnant, sans remplacer dans le texte l’expression plus compacte du grec.
