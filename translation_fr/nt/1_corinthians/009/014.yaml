id: 1CO.9.14
reference: 1 Corinthians 9:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὕτως καὶ ὁ κύριος διέταξεν τοῖς τὸ εὐαγγέλιον καταγγέλλουσιν ἐκ τοῦ εὐαγγελίου ζῆν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/014.yaml
  text: In the same way[b][a], the Lord also commanded that those who proclaim the gospel should live from the gospel.
translation:
  language: fr
  text: De même, le Seigneur a ordonné à ceux qui proclament l’Évangile de vivre de l’Évangile[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: C’est-à-dire tirer de la proclamation de l’Évangile leurs moyens de subsistance.
    reason: clarification_contextuelle
lexical_decisions:
- source_word: οὕτως
  choice: De même
  rationale: Exprime naturellement l’analogie avec les exemples précédents tout en restant concis.
- source_word: καὶ
  choice: aussi (rendu par la progression contextuelle, sans terme distinct)
  rationale: Le grec ajoute le commandement du Seigneur aux exemples précédents. En français, « De même, le Seigneur a ordonné » porte naturellement cette progression; ajouter « aussi » serait possible, mais légèrement plus lourd.
- source_word: ὁ κύριος
  choice: le Seigneur
  rationale: Correspond au titre grec et conserve la formulation de la source sans expliciter son référent.
- source_word: διέταξεν
  choice: a ordonné
  rationale: Rend la force d’une directive donnée avec autorité.
- source_word: τοῖς ... καταγγέλλουσιν
  choice: à ceux qui proclament
  rationale: Traite le participe articulé comme un groupe substantivé et conserve l’idée d’une annonce publique.
- source_word: τὸ εὐαγγέλιον
  choice: l’Évangile
  rationale: Terme établi, compréhensible et cohérent dans le contexte paulinien.
- source_word: ἐκ τοῦ εὐαγγελίου
  choice: de l’Évangile
  rationale: Préserve la formulation concise de la source, où ἐκ indique la source des moyens d’existence.
- source_word: ζῆν
  choice: de vivre
  rationale: L’infinitif dépend directement de « a ordonné »; dans ce contexte, vivre signifie tirer ses moyens d’existence de l’activité liée à l’Évangile.
theological_decisions:
- issue: Référent de « le Seigneur »
  choice: Conserver « le Seigneur », qui désigne très probablement Jésus dans ce contexte
  alternative: Expliciter « le Seigneur Jésus » ou comprendre une référence divine plus générale
  rationale: Le contexte paulinien renvoie naturellement à l’enseignement de Jésus, mais le grec ne comporte pas le nom « Jésus »; la traduction préserve donc la formulation et l’ambiguïté de la source.
- issue: Nature du soutien impliqué par « vivre de l’Évangile »
  choice: Soutien matériel permettant aux proclamateurs de l’Évangile de subsister
  alternative: Vie spirituelle provenant de l’Évangile
  rationale: L’argument environnant traite du droit des ouvriers à recevoir un soutien matériel. La formulation littérale est néanmoins conservée, avec une note qui explicite le sens contextuel sans l’insérer dans le verset.
translation_notes:
  register: Français international moderne, sobre et digne. « Proclament » garde la nuance d’annonce publique; « vivre de l’Évangile » conserve l’expression compacte et théologiquement évocatrice du grec, tandis que la note en précise le sens matériel dans le contexte.
