  text: ἐν γὰρ τῷ Μωϋσέως νόμῳ γέγραπται· Οὐ ⸀κημώσεις βοῦν ἀλοῶντα. μὴ τῶν βοῶν μέλει τῷ θεῷ,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/009.yaml
  text: For it is written in the law of Moses[a], “You shall not muzzle an ox while it is threshing.” Is God concerned about oxen?
translation:
  language: fr
  text: 'Car il est écrit dans la loi de Moïse : « Tu ne muselleras pas le bœuf pendant qu’il foule le grain[a]. » Dieu se soucie-t-il des bœufs ?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « pendant qu’il bat le grain ».'
    reason: Variante lexicale possible pour ἀλοῶντα, qui désigne l’action de battre ou de fouler les céréales sur l’aire.
lexical_decisions:
- source_word: ἐν γὰρ τῷ Μωϋσέως νόμῳ
  choice: Car il est écrit dans la loi de Moïse
  rationale: « Dans la loi de Moïse » rend naturellement la construction avec ἐν et conserve la relation exprimée par le génitif. « Car » maintient le lien argumentatif introduit par γάρ.
- source_word: γέγραπται
  choice: il est écrit
  rationale: Formule française consacrée et naturelle pour introduire une citation de l’Écriture, correspondant au parfait passif grec.
- source_word: Οὐ κημώσεις
  choice: Tu ne muselleras pas
  rationale: Le futur grec employé comme interdiction est rendu par le futur français de style juridique, qui convient à une citation de la Loi. « Museler » est l’équivalent direct de κημόω.
- source_word: βοῦν
  choice: le bœuf
  rationale: Le singulier désigne ici un bovin employé au travail. L’article défini français convient à la formulation générale d’une règle.
- source_word: ἀλοῶντα
  choice: pendant qu’il foule le grain
  rationale: Le participe présent décrit l’activité en cours. « Fouler le grain » évoque clairement l’action du bœuf sur l’aire de battage. Le mot « grain » est implicite dans le verbe grec et rend l’expression compréhensible en français courant.
- source_word: μὴ τῶν βοῶν μέλει τῷ θεῷ
  choice: Dieu se soucie-t-il des bœufs ?
  rationale: Cette question naturelle conserve la force rhétorique de μή sans ajouter « seulement », absent du texte, ni transformer la question en affirmation catégorique.
theological_decisions:
- issue: La question rhétorique de Paul concernant le souci de Dieu pour les animaux
  choice: Dieu se soucie-t-il des bœufs ?
  alternative: Dieu se préoccupe-t-il seulement des bœufs ?
  rationale: Le texte grec pose une question rhétorique introduite par μή. La traduction en maintient la portée argumentative sans ajouter « seulement » et sans nier explicitement toute sollicitude divine envers les animaux.
translation_notes:
  register: Français international moderne, clair et digne. Le futur « tu ne muselleras pas » conserve la tonalité juridique de la citation, tandis que la question finale reste directe et volontairement non résolue.
