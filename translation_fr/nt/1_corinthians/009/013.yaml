id: 1CO.9.13
reference: 1 Corinthians 9:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὐκ οἴδατε ὅτι οἱ τὰ ἱερὰ ἐργαζόμενοι ⸀τὰ ἐκ τοῦ ἱεροῦ ἐσθίουσιν, οἱ τῷ θυσιαστηρίῳ ⸀παρεδρεύοντες τῷ θυσιαστηρίῳ συμμερίζονται;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/013.yaml
  text: Do you not know that those who work in the temple eat from the temple[b][a], and those who serve at the altar share in what is offered on the altar?
translation:
  language: fr
  text: Ne savez-vous pas que ceux qui accomplissent le service sacré[a] mangent ce qui vient du temple, et que ceux qui servent à l’autel ont part à ce qui est offert sur l’autel[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « ceux qui travaillent aux choses sacrées ».'
    reason: lexical_alternative
  - marker: b
    text: 'Plus littéralement : « partagent avec l’autel » ; ils reçoivent donc une part des sacrifices qui y sont offerts.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὐκ οἴδατε
  choice: Ne savez-vous pas
  rationale: Cette formule interrogative conserve la tournure rhétorique caractéristique de Paul dans un français naturel et digne.
- source_word: οἱ τὰ ἱερὰ ἐργαζόμενοι
  choice: ceux qui accomplissent le service sacré
  rationale: L’expression grecque évoque littéralement ceux qui travaillent aux choses sacrées. Le choix français exprime clairement leur fonction cultuelle sans la limiter artificiellement à une structure ecclésiale ultérieure.
- source_word: τὰ ἐκ τοῦ ἱεροῦ ἐσθίουσιν
  choice: mangent ce qui vient du temple
  rationale: La formulation garde l’image concrète de l’action de manger et indique que leur nourriture provient des ressources du temple.
- source_word: ἱεροῦ
  choice: temple
  rationale: ἱερόν désigne ici le temple ou son enceinte sacrée; « temple » est le terme courant le plus clair dans ce contexte.
- source_word: παρεδρεύοντες
  choice: ceux qui servent à
  rationale: Le participe désigne ceux qui se tiennent auprès de l’autel pour y assurer leur service. « Servent à » communique naturellement cette fonction cultuelle.
- source_word: θυσιαστηρίῳ
  choice: autel
  rationale: « Autel » est l’équivalent français précis et usuel du terme grec désignant l’autel sacrificiel.
- source_word: συμμερίζονται
  choice: ont part à ce qui est offert sur l’autel
  rationale: Le verbe signifie recevoir ou prendre une part avec quelqu’un ou quelque chose. La formulation explicite sobrement qu’il s’agit d’une part des offrandes associées à l’autel, tandis qu’une note préserve la construction grecque plus littérale.
theological_decisions:
- issue: Image cultuelle et soutien matériel de ceux qui assurent le service sacré
  choice: Le texte présente les serviteurs du temple et de l’autel comme recevant leur nourriture de ce service sacré.
  alternative: Traduire littéralement la dernière proposition par « partagent avec l’autel ».
  rationale: Cette traduction préserve l’analogie de Paul entre le service cultuel et la subsistance qui en découle, sans importer dans le verset des structures ecclésiales postérieures. La note signale la formulation littérale et maintient sa tension métaphorique.
translation_notes:
  register: Français international moderne, clair et digne. La question rhétorique paulinienne est conservée, ainsi que le parallélisme entre le temple et l’autel. Les notes rendent visibles les formulations grecques plus littérales sans alourdir le texte principal.
