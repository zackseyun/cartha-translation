id: 1CO.9.25
reference: 1 Corinthians 9:25
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: πᾶς δὲ ὁ ἀγωνιζόμενος πάντα ἐγκρατεύεται, ἐκεῖνοι μὲν οὖν ἵνα φθαρτὸν στέφανον λάβωσιν, ἡμεῖς δὲ ἄφθαρτον.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/025.yaml
  text: Everyone who competes exercises self-control in all things. They do so in order to receive a perishable crown[a], but we an imperishable one.
translation:
  language: fr
  text: Tous ceux qui participent à une compétition se maîtrisent en tout. Eux le font pour recevoir une couronne périssable[a], mais nous, une couronne impérissable.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « couronne de vainqueur » ; le mot grec désigne ici la couronne, ou guirlande, remise au vainqueur d’une compétition sportive.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς ὁ ἀγωνιζόμενος
  choice: Tous ceux qui participent à une compétition
  rationale: Le singulier grec a une portée générale. Le pluriel inclusif est naturel en français et, dans le contexte immédiat, ἀγωνίζομαι évoque la participation à une compétition sportive.
- source_word: πάντα ἐγκρατεύεται
  choice: se maîtrisent en tout
  rationale: Le verbe exprime une maîtrise de soi habituelle, et πάντα en indique l’étendue sans la limiter à l’alimentation ou à l’entraînement.
- source_word: ἐκεῖνοι μὲν οὖν ἵνα … λάβωσιν
  choice: Eux le font pour recevoir
  rationale: « Eux » reprend les concurrents et marque le contraste avec « nous ». « Le font » restitue naturellement l’action sous-entendue, tandis que « pour » exprime le but indiqué par ἵνα.
- source_word: φθαρτὸν στέφανον
  choice: une couronne périssable
  rationale: « Couronne » conserve l’image concise de la récompense honorifique; « périssable » forme avec « impérissable » l’opposition directe du grec.
- source_word: ἡμεῖς δὲ ἄφθαρτον
  choice: mais nous, une couronne impérissable
  rationale: Le grec sous-entend στέφανον dans le second membre. Sa répétition en français rend l’ellipse immédiatement intelligible tout en conservant la forte opposition entre les deux récompenses.
theological_decisions:
- issue: Nature de la récompense figurée par la couronne
  choice: Conserver l’image sportive d’une couronne périssable opposée à une couronne impérissable, sans définir davantage cette dernière.
  alternative: Identifier explicitement la couronne impérissable à la vie éternelle ou à des récompenses célestes.
  rationale: Le verset ne précise pas lui-même le référent doctrinal de l’image. Une formulation non explicative préserve sa portée et sa tension théologique.
translation_notes:
  register: Français international moderne, clair et digne. Le vocabulaire sportif reste explicite, et le parallélisme final est conservé sans archaïsme.
