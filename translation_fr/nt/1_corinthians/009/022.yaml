  text: ἐγενόμην τοῖς ⸀ἀσθενέσιν ἀσθενής, ἵνα τοὺς ἀσθενεῖς κερδήσω· τοῖς πᾶσιν ⸀γέγονα πάντα, ἵνα πάντως τινὰς σώσω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/022.yaml
  text: To the weak I became weak[a], so that I might win the weak. I have become all things to all people[b], so that by all means I might save some.
translation:
  language: fr
  text: Pour les faibles, je me suis fait faible[a], afin de gagner les faibles. Je me suis fait tout à tous, afin d’en sauver quelques-uns par tous les moyens[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ceux dont la conscience est vulnérable » ; dans 1 Corinthiens, « les faibles » peut désigner particulièrement des personnes dont la conscience est vulnérable.
    reason: lexical_alternative
  - marker: b
    text: Ou « de toutes les manières possibles » ou « à tout prix » ; l’expression indique le recours à tous les moyens possibles en vue du but recherché.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγενόμην / γέγονα
  choice: je me suis fait
  rationale: Dans ce contexte, γίνομαι décrit l’adaptation volontaire de Paul aux personnes qu’il sert. Le passé composé est naturel en français et peut couvrir ici l’action passée ainsi que la conduite qui en résulte.
- source_word: ἀσθενέσιν / ἀσθενής / ἀσθενεῖς
  choice: faible(s)
  rationale: La répétition du même terme conserve la force rhétorique du grec. « Faibles » reste assez large pour inclure, sans s’y limiter, ceux dont la conscience est fragile.
- source_word: κερδήσω
  choice: gagner
  rationale: Dans ce contexte missionnaire, le verbe exprime le fait de gagner des personnes, plutôt qu’un avantage matériel.
- source_word: τοῖς πᾶσιν … πάντα
  choice: tout pour tous
  rationale: Cette formulation française concise et naturelle conserve le parallélisme et l’ampleur de l’expression grecque.
- source_word: πάντως
  choice: par tous les moyens
  rationale: L’expression rend l’idée d’employer tous les moyens possibles pour atteindre le but, sans suggérer en elle-même un compromis contraire à l’éthique.
- source_word: τινὰς
  choice: quelques-uns
  rationale: 'Le pronom indéfini exprime la modestie de l’objectif formulé : Paul ne prétend pas que tous seront sauvés par son ministère.'
- source_word: σώσω
  choice: j’en sauver
  rationale: « Sauver » préserve la portée sotériologique réelle de σῴζω. Le pronom « en » renvoie naturellement à l’ensemble des personnes évoquées.
theological_decisions:
- issue: Sens de « faibles »
  choice: Conserver le terme général « faibles » dans le texte principal.
  alternative: « Ceux dont la conscience est fragile » ou « les sans-force ».
  rationale: Dans 1 Corinthiens, le terme peut viser particulièrement une conscience vulnérable, mais le verset ne restreint pas explicitement sa portée. Le texte principal préserve donc cette amplitude.
- issue: Rôle de Paul dans le salut
  choice: Traduire directement « afin d’en sauver quelques-uns ».
  alternative: « Afin de contribuer au salut de quelques-uns » ou « d’en conduire quelques-uns au salut ».
  rationale: Le grec attribue grammaticalement l’action de sauver à Paul dans son rôle d’instrument missionnaire. Une paraphrase affaiblirait le verbe ou introduirait une précision doctrinale absente du verset.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « faibles » reproduit l’insistance grecque. « Je me suis fait » exprime une adaptation volontaire sans suggérer la tromperie, et « tout pour tous » conserve la formule frappante de l’original.
