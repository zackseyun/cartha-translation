revisions:
- from: Je me suis fait faible avec les faibles[a], afin de gagner les faibles. Je me suis fait tout pour tous, afin d’en sauver quelques-uns par tous les moyens[b].
  to: Pour les faibles, je me suis fait faible[a], afin de gagner les faibles. Je me suis fait tout à tous, afin d’en sauver quelques-uns par tous les moyens[b].
  rationale: Les corrections rétablissent les datifs grecs dans les deux formules d’adaptation (« pour les faibles »; « à tous »), tout en conservant la répétition de « faibles », la concision de l’original et l’expression non restrictive du but salvifique. Les notes ont été harmonisées avec le texte révisé et conservent les alternatives lexicales pertinentes.
