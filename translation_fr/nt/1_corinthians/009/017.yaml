revisions:
- from: En effet, si je fais cela de mon plein gré, j’ai une récompense ; mais si je le fais contre mon gré, une responsabilité[a] m’a été confiée.
  to: En effet, si je fais cela de mon plein gré, j’ai une récompense ; mais si je le fais contre mon gré, une charge m’a été confiée.
  rationale: La révision remplace « responsabilité » par « charge », terme français courant qui représente plus fidèlement l’administration ou la fonction confiée exprimée par οἰκονομία. Elle maintient l’ambiguïté du contraste paulinien entre récompense et devoir confié, sans en tirer de conclusion doctrinale.
  reviewer_model: gpt-5.6-terra
