  text: εἰ γὰρ ἑκὼν τοῦτο πράσσω, μισθὸν ἔχω· εἰ δὲ ἄκων, οἰκονομίαν πεπίστευμαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/017.yaml
  text: For if I do this willingly[a], I have a reward; but if unwillingly, I have been entrusted with a stewardship.
translation:
  language: fr
  text: En effet, si je fais cela de mon plein gré, j’ai une récompense ; mais si je le fais contre mon gré, une charge m’a été confiée.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἑκὼν
  choice: de mon plein gré
  rationale: Cette expression française naturelle rend l’action volontaire et maintient le contraste direct avec ἄκων.
- source_word: τοῦτο πράσσω
  choice: je fais cela
  rationale: La formulation reste sobre et renvoie à l’activité apostolique évoquée dans le contexte sans la préciser au-delà du grec.
- source_word: μισθὸν
  choice: une récompense
  rationale: « Récompense » convient mieux ici que « salaire », car le terme désigne la contrepartie d’un service volontaire sans réduire le propos à une rémunération matérielle.
- source_word: ἄκων
  choice: contre mon gré
  rationale: Cette expression est l’antonyme naturel de « de mon plein gré » et n’ajoute pas la nuance affective que comporterait « à contrecœur ».
- source_word: οἰκονομίαν
  choice: une responsabilité
  rationale: Dans ce contexte, le mot désigne une fonction ou une charge confiée à quelqu’un. « Responsabilité » est clair en français moderne, tandis que la note conserve la métaphore plus littérale de l’intendance.
- source_word: πεπίστευμαι
  choice: m’a été confiée
  rationale: Le parfait passif indique qu’une responsabilité a été confiée à Paul et demeure la sienne ; cette tournure française exprime naturellement l’acte passé et son résultat présent.
theological_decisions:
- issue: Nature du ministère de Paul dans la seconde proposition
  choice: Même lorsqu’il n’agit pas de son plein gré, Paul demeure chargé d’une responsabilité qui lui a été confiée.
  alternative: Paul oppose la récompense du service volontaire au simple devoir accompli contre son gré.
  rationale: La traduction maintient l’opposition entre μισθὸν ἔχω et οἰκονομίαν πεπίστευμαι sans nier l’appel reçu ni définir davantage la relation entre obligation et récompense.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme « de mon plein gré / contre mon gré » rend nettement l’opposition grecque. « Responsabilité » évite l’archaïsme d’« intendance », dont la nuance est néanmoins signalée en note.
