    reason: Le grec οἰκονομία désigne une administration ou une charge confiée ; selon le contexte, il peut aussi évoquer une mission reçue.
  revision_rationale: La révision remplace « responsabilité » par « charge », terme français courant qui représente plus fidèlement l’administration ou la fonction confiée exprimée par οἰκονομία. Elle maintient l’ambiguïté du contraste paulinien entre récompense et devoir confié, sans en tirer de conclusion doctrinale.
