review_pass:
  verdict: revise
  source_fidelity: 'Le sens de l’ensemble est correctement rendu : le contraste entre l’action volontaire et non volontaire, la « récompense » (μισθός) et la charge confiée (οἰκονομία, parfait passif πεπίστευμαι) est préservé. Toutefois, « responsabilité » affaiblit la notion plus spécifique d’une fonction/charge administrée pour le compte d’autrui.'
  naturalness: La formulation est fluide et convient au français international moderne. « Une charge m’a été confiée » est tout aussi naturel et rend plus précisément le contexte d’une mission reçue, sans employer l’archaïsme relatif « intendance » dans le texte principal.
  terminology: « De mon plein gré / contre mon gré » rend bien ἑκών / ἄκων. « Récompense » convient à μισθός. Pour οἰκονομία, « charge » est préférable à « responsabilité », car le terme désigne ici une fonction ou administration confiée, non seulement l’obligation morale qui peut en découler.
  issues:
  - severity: low
    issue: « responsabilité » est sémantiquement plus général que οἰκονομία.
    rationale: οἰκονομία évoque l’administration d’une charge ou d’un bien confié. « Charge » conserve mieux l’idée d’un mandat/fonction, tout en restant idiomatique et sans imposer une lecture ecclésiologique.
  - severity: low
    issue: La note « une charge d’intendant » est moins naturelle que nécessaire.
    rationale: La note peut présenter directement l’image de l’administration confiée, sans suggérer que Paul est nécessairement désigné par le titre moderne ou institutionnel d’« intendant ».
  revised_text: En effet, si je fais cela de mon plein gré, j’ai une récompense ; mais si je le fais contre mon gré, une charge m’a été confiée.
