id: 1CO.9.16
reference: 1 Corinthians 9:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐὰν γὰρ εὐαγγελίζωμαι, οὐκ ἔστιν μοι καύχημα, ἀνάγκη γάρ μοι ἐπίκειται· οὐαὶ ⸀γάρ μοί ἐστιν ἐὰν μὴ ⸀εὐαγγελίσωμαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/016.yaml
  text: For if I preach the gospel[a], I have no ground for boasting, for necessity is laid upon me[b]. For woe is me if I do not preach the gospel.
translation:
  language: fr
  text: En effet, si j’annonce l’Évangile[a], je n’ai pas de quoi m’en vanter, car une nécessité s’impose à moi. Car malheur à moi si je n’annonce pas l’Évangile !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « je proclame la bonne nouvelle », ici et à la fin du verset.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐαγγελίζωμαι / εὐαγγελίσωμαι
  choice: j’annonce l’Évangile
  rationale: Le verbe désigne l’action de proclamer une bonne nouvelle. Dans ce contexte paulinien, le message implicite est l’Évangile. « Annoncer l’Évangile » est naturel en français moderne et conserve la force publique de la proclamation; le même rendu est employé aux deux occurrences.
- source_word: καύχημα
  choice: de quoi m’en vanter
  rationale: Cette tournure idiomatique exprime l’absence de motif légitime de fierté personnelle et restitue naturellement en français l’idée de fondement ou de sujet de vantardise.
- source_word: ἀνάγκη
  choice: une nécessité
  rationale: Le terme exprime une obligation contraignante. « Nécessité » en préserve la portée sans préciser indûment si sa source est intérieure, extérieure ou explicitement divine.
- source_word: ἐπίκειται
  choice: s’impose à moi
  rationale: Le verbe présente la nécessité comme pesant sur Paul ou lui étant imposée. Cette formulation française rend clairement la contrainte sans en expliciter la source.
- source_word: οὐαί
  choice: malheur à moi
  rationale: « Malheur » conserve la gravité prophétique de l’exclamation et évoque des conséquences redoutables plutôt qu’un simple regret.
- source_word: ἐὰν μὴ
  choice: si je n’annonce pas
  rationale: Le tour conditionnel direct est clair et correspond à la structure grecque.
- source_word: γάρ
  choice: en effet / car
  rationale: Le premier γάρ relie le verset au raisonnement précédent par « En effet »; les deux suivants sont rendus par « car » afin de préserver leur fonction explicative et l’insistance argumentative.
theological_decisions:
- issue: Nature de l’obligation de Paul d’annoncer l’Évangile
  choice: « une nécessité s’impose à moi » sans en préciser la source
  alternative: « Dieu m’a imposé cette mission » ou « je me sens contraint »
  rationale: Le grec affirme qu’une nécessité pèse sur Paul, mais ce verset n’en définit pas explicitement la source. Le rendu conserve cette ouverture et n’importe pas dans le texte une explication doctrinale tirée du contexte plus large.
- issue: Portée de « malheur à moi »
  choice: Conserver l’exclamation solennelle sans définir la nature du malheur
  alternative: Expliciter une condamnation divine ou de simples difficultés personnelles
  rationale: οὐαί signale une perspective grave, mais la phrase ne précise pas ici la forme exacte des conséquences. La traduction maintient cette tension.
translation_notes:
  register: Français moderne, courant et digne. « Je n’ai pas de quoi m’en vanter » évite une formulation abstraite tout en conservant exactement l’idée de καύχημα. La répétition de « car », légèrement marquée en français, a été maintenue afin de refléter les deux γάρ successifs et la progression logique du grec.
