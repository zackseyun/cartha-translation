- from: Est-ce d’après une perspective purement humaine[a] que je dis cela ? Ou bien la Loi ne dit-elle pas, elle aussi, la même chose ?
  to: Est-ce d’un point de vue purement humain que je dis cela, ou bien la Loi ne dit-elle pas elle aussi cela ?
  rationale: La révision améliore l’idiomaticité française et aligne les deux occurrences de ταῦτα sur « cela ». Elle conserve la double portée rhétorique, l’addition marquée par « elle aussi » et le renvoi scripturaire de « la Loi ».
