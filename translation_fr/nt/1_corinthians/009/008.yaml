  text: Μὴ κατὰ ἄνθρωπον ταῦτα λαλῶ ἢ ⸂καὶ ὁ νόμος ταῦτα οὐ⸃ λέγει;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/008.yaml
  text: Am I saying these things from a merely human perspective[a], or does not the Law also say these things?
translation:
  language: fr
  text: Est-ce d’un point de vue purement humain que je dis cela, ou bien la Loi ne dit-elle pas elle aussi cela ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μὴ
  choice: Est-ce… que… ?
  rationale: La particule introduit une question qui attend une réponse négative. Cette tournure interrogative française, mise en contraste avec la seconde question négative, en restitue naturellement la force.
- source_word: κατὰ ἄνθρωπον
  choice: d’après une perspective purement humaine
  rationale: L’expression désigne une manière de raisonner fondée seulement sur un point de vue humain. « Purement » rend ici le contraste implicite avec le témoignage de la Loi sans transformer l’expression en affirmation sur l’autorité.
- source_word: ταῦτα
  choice: cela / la même chose
  rationale: Le démonstratif pluriel renvoie aux propos précédents de Paul. Le français idiomatique emploie volontiers le singulier collectif « cela » ; dans la seconde proposition, « la même chose » rend clairement la reprise.
- source_word: λαλῶ
  choice: je dis
  rationale: Le présent indique ce que Paul est en train d’énoncer dans son argumentation ; « je dis » est naturel et précis en français.
- source_word: ἢ
  choice: ou bien
  rationale: Cette expression introduit nettement l’autre branche de la question rhétorique.
- source_word: καὶ
  choice: elle aussi
  rationale: 'L’adverbe a une valeur additive : la Loi apporte également son témoignage. Son placement auprès du sujet est idiomatique en français.'
- source_word: ὁ νόμος
  choice: la Loi
  rationale: Le contexte immédiat, qui cite Deutéronome 25.4 au verset suivant, indique la Loi de Moïse comme corpus scripturaire. La majuscule signale ce référent reconnu sans l’expliciter davantage dans le texte.
- source_word: οὐ λέγει
  choice: ne dit-elle pas
  rationale: La question négative attend une réponse affirmative. La formulation conserve la structure rhétorique du grec au lieu de l’aplatir en déclaration positive.
theological_decisions:
- issue: Référent de « la Loi » dans l’argument de Paul
  choice: La Loi de Moïse, en tant que corpus scripturaire
  alternative: Une loi ou un principe général
  rationale: Le verset suivant cite directement Deutéronome 25.4. « La Loi » conserve donc le renvoi canonique précis sans ajouter de conclusion doctrinale.
translation_notes:
  register: Français international moderne, digne et accessible. La double question rhétorique et le contraste entre raisonnement humain et témoignage scripturaire sont conservés. « Cela » évite un pluriel français lourd tout en gardant le lien avec l’argument précédent.
