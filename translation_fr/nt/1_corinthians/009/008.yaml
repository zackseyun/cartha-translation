    rationale: Le grec répète simplement ταῦτα dans les deux membres. « Cela » maintient la reprise sans introduire l’expression interprétative « la même chose ».
  - severity: low
    issue: Formulation un peu lourde de « d’après une perspective purement humaine ».
    rationale: « D’un point de vue purement humain » est plus naturel tout en rendant exactement la valeur de κατὰ ἄνθρωπον.
