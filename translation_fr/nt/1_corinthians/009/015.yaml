source:
  edition: SBLGNT
  text: Ἐγὼ δὲ ⸂οὐ κέχρημαι οὐδενὶ⸃ τούτων. οὐκ ἔγραψα δὲ ταῦτα ἵνα οὕτως γένηται ἐν ἐμοί, καλὸν γάρ μοι μᾶλλον ἀποθανεῖν ἤ— τὸ καύχημά μου ⸂οὐδεὶς κενώσει⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/015.yaml
  text: But I have made use of none of these things[a]. Yet I did not write these things so that it should be done this way for me[b], for I would rather die than—no one will nullify my boasting.
translation:
  language: fr
  text: Mais moi, je n’ai fait usage d’aucune de ces choses[a]. Et je n’ai pas écrit cela pour qu’on agisse ainsi envers moi, car j’aimerais mieux mourir que… Personne ne réduira à néant mon sujet de fierté[b] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, en explicitant le contexte : « d’aucun de ces droits ».'
    reason: lexical_alternative
  - marker: b
    text: 'Le grec s’interrompt après « que… », puis reprend : « mon sujet de fierté, personne ne le réduira à néant ». On peut aussi lisser la phrase ainsi : « car j’aimerais mieux mourir que de laisser quelqu’un réduire à néant mon sujet de fierté ».'
    reason: alternative_reading
lexical_decisions:
- source_word: κέχρημαι
  choice: je n’ai fait usage
  rationale: Le parfait exprime ici que Paul ne s’est prévalu d’aucun des droits évoqués et que cette situation demeure. « Faire usage de » restitue naturellement le sens sans suggérer un abus.
- source_word: οὐδενὶ τούτων
  choice: d’aucune de ces choses
  rationale: Cette formulation reste proche du grec et renvoie aux droits liés au soutien matériel exposés dans le contexte; la note explicite ce référent possible.
- source_word: ἔγραψα ... ταῦτα
  choice: je n’ai pas écrit cela
  rationale: Le passé composé convient au français actuel pour l’aoriste dans ce contexte épistolaire. Le singulier collectif « cela » renvoie à ce que Paul vient d’écrire.
- source_word: ἵνα οὕτως γένηται ἐν ἐμοί
  choice: pour qu’on agisse ainsi envers moi
  rationale: 'La tournure française rend le but nié et le sens contextuel de la formule grecque condensée: Paul n’écrit pas afin d’obtenir lui-même le soutien dont il vient d’affirmer le droit.'
- source_word: καλὸν γάρ μοι μᾶλλον ἀποθανεῖν
  choice: car j’aimerais mieux mourir
  rationale: Cette expression française naturelle traduit la préférence fortement marquée par καλὸν ... μᾶλλον.
- source_word: τὸ καύχημά μου
  choice: mon sujet de fierté
  rationale: καύχημα peut désigner non seulement l’acte de se glorifier, mais aussi ce qui fonde cette fierté. Ici, il s’agit pour Paul d’annoncer la bonne nouvelle sans réclamer de rémunération.
- source_word: κενώσει
  choice: réduira à néant
  rationale: 'Cette expression restitue le sens métaphorique de « vider »: enlever toute réalité, toute portée ou tout contenu au sujet de fierté de Paul.'
theological_decisions:
- issue: Rupture syntaxique après ἤ
  choice: Conserver l’interruption sous la forme « que… », puis reprendre par une phrase indépendante.
  alternative: « car j’aimerais mieux mourir que de laisser quelqu’un réduire à néant mon sujet de fierté »
  rationale: Le grec s’interrompt après ἤ (« que… ») et reprend brusquement. Préserver cette anacoluthe maintient l’intensité rhétorique et évite de fournir silencieusement les mots sous-entendus.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation conserve la brusque rupture du grec tout en clarifiant la reprise par la ponctuation. « Sujet de fierté » évite la connotation exclusivement négative que peut avoir « vantardise » en français.
