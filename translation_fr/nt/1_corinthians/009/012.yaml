id: 1CO.9.12
reference: 1 Corinthians 9:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἰ ἄλλοι τῆς ⸂ὑμῶν ἐξουσίας⸃ μετέχουσιν, οὐ μᾶλλον ἡμεῖς; Ἀλλ’ οὐκ ἐχρησάμεθα τῇ ἐξουσίᾳ ταύτῃ, ἀλλὰ πάντα στέγομεν ἵνα μή ⸂τινα ἐγκοπὴν⸃ δῶμεν τῷ εὐαγγελίῳ τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/012.yaml
  text: If others share in this right over you[a], do not we even more? But we have not made use of this right; instead[b], we endure everything so that we may give no hindrance to the gospel of the Messiah.
translation:
  language: fr
  text: Si d’autres bénéficient de ce droit à votre égard[a], à plus forte raison nous, n’est-ce pas ? Mais nous n’avons pas usé de ce droit ; au contraire, nous supportons tout afin de ne créer aucun obstacle à l’Évangile du Messie[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « participent à cette prérogative à votre égard » ou « ont des droits sur vous ». L’expression grecque désigne probablement le droit des apôtres de recevoir un soutien matériel des Corinthiens.
    reason: lexical_alternative
  - marker: b
    text: 'Grec : « du Christ ». Ici, « Messie » rend Χριστός comme un titre.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐξουσίας / ἐξουσίᾳ
  choice: droit
  rationale: Dans ce contexte, ἐξουσία désigne la prérogative légitime des apôtres de recevoir un soutien matériel. « Droit » exprime cette faculté plus naturellement que « autorité ».
- source_word: τῆς ὑμῶν ἐξουσίας
  choice: ce droit sur vous
  rationale: 'Le génitif ὑμῶν situe le droit par rapport aux Corinthiens : il s’agit d’une prétention légitime à leur soutien, et non d’un droit qui leur appartiendrait. Une note signale d’autres formulations possibles.'
- source_word: μετέχουσιν
  choice: ont part à
  rationale: Cette expression conserve l’idée de participation ou de bénéfice attachée au verbe μετέχω.
- source_word: οὐ μᾶλλον ἡμεῖς;
  choice: ne l’avons-nous pas à plus forte raison ?
  rationale: La formulation garde la question rhétorique et la force comparative de μᾶλλον dans un français naturel.
- source_word: ἐχρησάμεθα
  choice: n’avons pas fait usage de
  rationale: Le verbe signifie ici se servir d’un droit ou s’en prévaloir. La formulation française maintient cette idée sans suggérer que le droit aurait été abandonné.
- source_word: πάντα στέγομεν
  choice: nous supportons tout
  rationale: Dans ce contexte, στέγω évoque le fait de prendre sur soi et d’endurer les difficultés. « Supportons tout » conserve la portée générale de πάντα.
- source_word: τινα ἐγκοπὴν δῶμεν
  choice: créer aucun obstacle
  rationale: La tournure française rend naturellement l’idée de causer ou d’introduire un empêchement, exprimée par ἐγκοπή avec δίδωμι.
- source_word: εὐαγγελίῳ
  choice: Évangile
  rationale: « Évangile » est le terme français établi dans le contexte paulinien et désigne ici le message proclamé.
- source_word: Χριστοῦ
  choice: du Messie
  rationale: Avec l’article, Χριστός garde ici clairement sa valeur de titre. « Messie » rend explicitement cette fonction, tandis que « Christ » demeure une traduction traditionnelle possible.
theological_decisions:
- issue: Valeur de Χριστοῦ
  choice: du Messie
  alternative: du Christ
  rationale: Le terme fonctionne ici comme un titre et non simplement comme un nom propre. Le texte principal en explicite donc le sens messianique, tandis que la note préserve la formulation traditionnelle.
- issue: Nature de l’ἐξουσία apostolique
  choice: un droit légitime au soutien des Corinthiens
  alternative: une autorité exercée sur les Corinthiens
  rationale: Le contexte immédiat concerne la possibilité de recevoir un soutien matériel. « Droit » évite de transformer ce passage en affirmation générale d’autorité, tout en laissant en note la nuance relationnelle de l’expression grecque.
translation_notes:
  register: Français international moderne, clair et digne. La question rhétorique reste vive ; « pourtant » et « au contraire » rendent l’opposition marquée du grec sans alourdir la phrase. La formulation conserve la relation délicate exprimée par « droit sur vous » et l’éclaire en note.
