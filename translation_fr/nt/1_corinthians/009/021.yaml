reference: 1 Corinthians 9:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τοῖς ἀνόμοις ὡς ἄνομος, μὴ ὢν ἄνομος ⸀θεοῦ ἀλλ’ ἔννομος ⸀Χριστοῦ, ἵνα ⸀κερδάνω ⸀τοὺς ἀνόμους·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/021.yaml
  text: To those outside the law[b][a], as one outside the law—though not being outside God’s law but under Messiah’s law—so that I might win those outside the law.
translation:
  language: fr
  text: Pour ceux qui sont sans la Loi[a], je me suis fait comme quelqu’un qui est sans la Loi — bien que je ne sois pas sans la loi de Dieu, mais sous la loi du Messie[b] — afin de gagner ceux qui sont sans la Loi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « hors de la Loi ». L’expression désigne ici ceux qui ne sont pas soumis à la Loi de Moïse, et non nécessairement des personnes qui vivent sans aucune règle morale.
    reason: lexical_alternative
  - marker: b
    text: Le grec peut aussi se rendre par « dans la loi du Messie » ou « soumis à la loi du Messie ».
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνόμοις / ἄνομος / ἀνόμους
  choice: ceux qui sont sans la Loi / quelqu’un qui est sans la Loi
  rationale: Dans le contraste de 1 Corinthiens 9.20-21, l’expression désigne ceux qui ne sont pas soumis à la Loi mosaïque, et non nécessairement des personnes moralement rebelles. La répétition française préserve celle du grec.
- source_word: ὡς
  choice: comme
  rationale: Marque la posture d’adaptation de Paul sans affirmer qu’il devient réellement étranger à toute loi.
- source_word: μὴ ὢν
  choice: bien que je ne sois pas
  rationale: La proposition participiale a ici une valeur concessive, rendue naturellement en français.
- source_word: ἔννομος
  choice: sous la loi
  rationale: Exprime l’appartenance à la sphère d’une loi ou la soumission à celle-ci, tout en formant un contraste clair avec « sans la Loi ».
- source_word: Χριστοῦ
  choice: du Messie
  rationale: Χριστός fonctionne ici comme un titre; « Messie » en restitue le sens tout en restant naturel dans l’expression « la loi du Messie ».
- source_word: ἵνα
  choice: afin de
  rationale: Introduit explicitement le but de l’adaptation de Paul.
- source_word: κερδάνω
  choice: gagner
  rationale: Dans ce contexte missionnaire, le verbe signifie gagner des personnes, c’est-à-dire les amener à adhérer au message, plutôt qu’obtenir un bénéfice matériel.
theological_decisions:
- issue: Sens de ἄνομος dans le contexte
  choice: Les personnes qui sont sans la Loi mosaïque, notamment les non-Juifs
  alternative: Les gens sans loi au sens de personnes méchantes ou rebelles
  rationale: Le contexte oppose ceux qui sont sous la Loi à ceux qui sont sans la Loi. La précision apportée par Paul exclut l’idée qu’il revendique une absence de responsabilité envers Dieu.
- issue: Portée de ἔννομος Χριστοῦ
  choice: « sous la loi du Messie »
  alternative: « dans la loi du Messie » ou « lié par la loi envers le Messie »
  rationale: La formulation retenue exprime clairement la soumission de Paul à la norme liée au Messie, sans identifier silencieusement cette norme à l’ensemble de la Loi mosaïque ni définir plus précisément sa portée.
- issue: Traduction de Χριστοῦ
  choice: « du Messie »
  alternative: « du Christ »
  rationale: Le terme grec conserve ici sa valeur de titre dans une relation théologique (« la loi du Messie »); « Messie » rend cette valeur explicitement.
translation_notes:
  register: Français international moderne, digne et accessible. La majuscule à « Loi » dans « sans la Loi » signale la Loi mosaïque visée par le contexte; la minuscule dans « la loi de Dieu » et « la loi du Messie » rend les relations légales exprimées sans présumer qu’il s’agit chaque fois d’un titre technique identique. L’incise conserve la tension et la précision du grec.
