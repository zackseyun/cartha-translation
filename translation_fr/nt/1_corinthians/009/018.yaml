  revision_rationale: La révision remplace « salaire » par « récompense », rend le participe par « en annonçant » et simplifie « le droit qui est le mien » en « mon droit ». Elle conserve l’explicitation française nécessaire de ἐν τῷ εὐαγγελίῳ et regroupe les alternatives pertinentes sous un seul ancrage placé sur cette expression. Aucun changement théologique ou interprétatif n’est introduit.
