review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est bien rendu : Paul décrit sa « récompense » comme le fait d’annoncer la bonne nouvelle sans frais et de ne pas exercer pleinement son droit. Toutefois, « lorsque j’annonce » atténue la valeur circonstancielle/instrumentale du participe εὐαγγελιζόμενος et, surtout, le pronom « la » après « la bonne nouvelle » rend moins nettement la répétition intentionnelle de εὐαγγέλιον et peut créer une légère lourdeur référentielle. Une reformulation plus directe conserve mieux la structure source.'
  naturalness: Le français est globalement naturel et de registre moderne. « Le droit qui est le mien » est toutefois plus pesant que nécessaire. « Mon droit » est idiomatique, précis et conserve l’insistance possessive du grec μου.
  terminology: « Récompense » rend μισθός plus largement et plus justement dans cette question rhétorique, sans exclure l’arrière-plan du soutien matériel. « Bonne nouvelle », « gratuitement », « droit » et « user pleinement de » sont appropriés. « Dans l’annonce de la bonne nouvelle » est une explicitation défendable de ἐν τῷ εὐαγγελίῳ, mais « dans la bonne nouvelle » serait trop littéral et peu naturel; la note peut signaler « dans le service de la bonne nouvelle ».
  issues:
  - severity: low
    issue: « salaire » pour μισθός
    rationale: Le terme est possible, mais « récompense » couvre plus naturellement la portée rhétorique de μισθός dans ce contexte sans suggérer prioritairement une paie salariale.
  - severity: medium
    issue: « lorsque j’annonce » pour εὐαγγελιζόμενος
    rationale: « Lorsque » marque surtout une relation temporelle. La construction grecque présente l’annonce comme l’activité dans laquelle Paul rend la bonne nouvelle gratuite; « en annonçant » restitue plus directement cette valeur.
  - severity: low
    issue: Pronom « la » pour le second εὐαγγέλιον
    rationale: Le pronom est compréhensible, mais la répétition lexicale est significative dans la formulation grecque et se lit naturellement en français dans une phrase légèrement resserrée.
  revised_text: Quelle est donc ma récompense ? C’est qu’en annonçant la bonne nouvelle, je la rende gratuite, afin de ne pas user pleinement de mon droit dans l’annonce de la bonne nouvelle[a].
  revised_footnotes:
