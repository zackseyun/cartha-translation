reference: 1 Corinthians 9:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τίς οὖν ⸀μού ἐστιν ὁ μισθός; ἵνα εὐαγγελιζόμενος ἀδάπανον θήσω τὸ ⸀εὐαγγέλιον, εἰς τὸ μὴ καταχρήσασθαι τῇ ἐξουσίᾳ μου ἐν τῷ εὐαγγελίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/018.yaml
  text: What then is my reward? That in preaching the good news I may present the good news free of charge[b][a], so as not to make full use of my right in the good news.
translation:
  language: fr
  text: Quelle est donc ma récompense ? C’est qu’en annonçant la bonne nouvelle, je la rende gratuite, afin de ne pas user pleinement de mon droit dans l’annonce de la bonne nouvelle[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « dans le service de la bonne nouvelle ». « Bonne nouvelle » peut aussi être traduit par « Évangile » tout au long du verset.'
    reason: La formule grecque ἐν τῷ εὐαγγελίῳ peut désigner le domaine de l’annonce ou du ministère lié à la bonne nouvelle; la note signale aussi l’équivalent français traditionnel de εὐαγγέλιον.
lexical_decisions:
- source_word: μισθός
  choice: salaire
  rationale: 'Le mot peut désigner un salaire, une rémunération ou une récompense. « Salaire » maintient ici le jeu rhétorique : le « salaire » de Paul consiste précisément à annoncer sans se faire payer.'
- source_word: εὐαγγελιζόμενος
  choice: lorsque j’annonce la bonne nouvelle
  rationale: Le participe décrit l’activité contemporaine de Paul. Cette formulation française conserve sa valeur verbale et le lien temporel avec la proposition principale.
- source_word: ἀδάπανον
  choice: gratuitement
  rationale: L’adjectif signifie « sans frais » ou « sans occasionner de dépense ». « Gratuitement » exprime naturellement que Paul ne demande aucune rémunération aux destinataires.
- source_word: θήσω τὸ εὐαγγέλιον
  choice: la présenter
  rationale: Le grec dit littéralement « placer/poser la bonne nouvelle », avec ici le sens de la mettre à disposition ou de la présenter. Le pronom évite en français une répétition inutile tout en gardant le même référent.
- source_word: εὐαγγέλιον
  choice: bonne nouvelle
  rationale: Cette expression rend directement le sens courant du terme grec, dans une langue moderne et accessible. L’alternative traditionnelle « Évangile » est signalée en note.
- source_word: καταχρήσασθαι
  choice: user pleinement de
  rationale: Dans ce contexte, le verbe évoque l’exercice complet d’un droit légitime, non nécessairement son exploitation abusive. Cette traduction préserve cette nuance.
- source_word: ἐξουσίᾳ
  choice: droit
  rationale: Le contexte du chapitre porte sur le droit légitime de l’apôtre à recevoir un soutien matériel. « Droit » est donc plus précis ici que le terme plus général « autorité ».
- source_word: ἐν τῷ εὐαγγελίῳ
  choice: dans l’annonce de la bonne nouvelle
  rationale: La préposition marque le domaine ou le cadre dans lequel ce droit s’exerce. L’explicitation par « annonce » donne un français intelligible sans imposer que le droit provienne de la bonne nouvelle elle-même.
theological_decisions:
- issue: Nature de l’ἐξουσία de Paul
  choice: Le droit légitime de recevoir un soutien dans le cadre de l’annonce de la bonne nouvelle, droit dont Paul choisit de ne pas user pleinement.
  alternative: L’autorité apostolique au sens large, ou un usage abusif de cette autorité.
  rationale: Le contexte immédiat de 1 Corinthiens 9 traite à plusieurs reprises du droit des apôtres à un soutien matériel. Le texte ne présente pas ce droit comme illégitime ni son exercice comme nécessairement abusif.
- issue: Portée de ἐν τῷ εὐαγγελίῳ
  choice: Le cadre de l’annonce ou du service de la bonne nouvelle.
  alternative: Un droit conféré par la bonne nouvelle elle-même.
  rationale: La formule grecque est concise et peut désigner un rapport général à la bonne nouvelle. La traduction évite d’affirmer explicitement une origine du droit que la préposition ne précise pas.
- issue: Traduction de εὐαγγέλιον
  choice: bonne nouvelle
  alternative: Évangile
  rationale: « Bonne nouvelle » communique directement le sens du grec en français courant, tandis que la formulation traditionnelle reste disponible en note.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure interrogative et le paradoxe du « salaire » consistant à servir gratuitement sont conservés. La répétition grecque de « bonne nouvelle » est partiellement allégée par un pronom, conformément à l’usage naturel du français, sans perte de référent.
