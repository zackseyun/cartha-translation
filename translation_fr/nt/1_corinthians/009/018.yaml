revisions:
- from: Quel est donc mon salaire ? C’est, lorsque j’annonce la bonne nouvelle, de la présenter gratuitement[a], afin de ne pas user pleinement du droit qui est le mien dans l’annonce de la bonne nouvelle[b].
  to: Quelle est donc ma récompense ? C’est qu’en annonçant la bonne nouvelle, je la rende gratuite, afin de ne pas user pleinement de mon droit dans l’annonce de la bonne nouvelle[a].
  rationale: La révision remplace « salaire » par « récompense », rend le participe par « en annonçant » et simplifie « le droit qui est le mien » en « mon droit ». Elle conserve l’explicitation française nécessaire de ἐν τῷ εὐαγγελίῳ et regroupe les alternatives pertinentes sous un seul ancrage placé sur cette expression. Aucun changement théologique ou interprétatif n’est introduit.
