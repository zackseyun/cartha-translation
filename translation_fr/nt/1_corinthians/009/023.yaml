revisions:
- from: Mais je fais tout à cause de la bonne nouvelle[a], afin d’y avoir part avec d’autres[b].
  to: Mais je fais tout pour la bonne nouvelle[a], afin d’en devenir moi aussi participant[b].
  rationale: La révision remplace une causalité trop marquée par « pour », plus adéquat pour διὰ dans le contexte, et restitue l’idée de devenir exprimée par γένωμαι. « Moi aussi participant » transmet de façon idiomatique la dimension associative de συγκοινωνός, tout en laissant indéterminé ce qui est partagé dans la bonne nouvelle.
