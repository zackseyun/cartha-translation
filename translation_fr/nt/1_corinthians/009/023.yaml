    rationale: « À cause de la bonne nouvelle » peut évoquer principalement une cause circonstancielle. Dans la phrase de Paul, « pour la bonne nouvelle » rend mieux la motivation orientée vers son intérêt, tout en restant bref et non interprétatif.
  - severity: medium
