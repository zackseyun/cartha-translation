  text: ⸀πάντα δὲ ποιῶ διὰ τὸ εὐαγγέλιον, ἵνα συγκοινωνὸς αὐτοῦ γένωμαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/023.yaml
  text: But I do all things for the sake of the good news[b][a], so that I may become a fellow participant in it.
translation:
  language: fr
  text: Mais je fais tout pour la bonne nouvelle[a], afin d’en devenir moi aussi participant[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « pour l’Évangile ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « afin que je devienne co-participant de celle-ci » ; ou : « afin d’y prendre part moi aussi » ou « afin d’en devenir partenaire ».'
    reason: alternative_reading
lexical_decisions:
- source_word: πάντα
  choice: tout
  rationale: Le neutre pluriel employé de manière globale se rend naturellement en français par « tout », qui conserve l’ampleur de l’affirmation.
- source_word: δὲ
  choice: Mais
  rationale: δέ marque ici un léger contraste avec ce qui précède ; « Mais » le rend clairement sans durcir l’opposition.
- source_word: ποιῶ
  choice: je fais
  rationale: Le présent exprime l’action habituelle de Paul ; le présent simple français convient naturellement.
- source_word: διὰ τὸ εὐαγγέλιον
  choice: à cause de la bonne nouvelle
  rationale: διά avec l’accusatif peut indiquer le motif ou la visée. « À cause de » garde cette latitude, tandis que « bonne nouvelle » rend εὐαγγέλιον dans une langue accessible.
- source_word: ἵνα
  choice: afin de
  rationale: La tournure introduit le but de l’action et conserve la valeur finale de ἵνα.
- source_word: συγκοινωνὸς
  choice: avoir part avec d’autres
  rationale: Cette formulation française naturelle exprime à la fois la participation et la valeur associative du préfixe συν-, sans préciser indûment s’il s’agit des bienfaits, de la diffusion ou du ministère de la bonne nouvelle.
- source_word: αὐτοῦ
  choice: y
  rationale: Le pronom renvoie le plus naturellement à εὐαγγέλιον ; « y » correspond idiomatiquement à « à la bonne nouvelle » dans la construction « avoir part à ».
- source_word: γένωμαι
  choice: avoir part
  rationale: Dans la locution française, l’idée de devenir participant est exprimée naturellement par « afin d’y avoir part ». Une note signale la traduction plus formelle « devenir participant ».
theological_decisions:
- issue: Nature de la participation de Paul à la bonne nouvelle
  choice: 'Maintenir une formulation large : « y avoir part avec d’autres »'
  alternative: Partager ses bienfaits, contribuer à sa diffusion ou devenir partenaire dans son annonce
  rationale: συγκοινωνός ne précise pas l’aspect exact de cette participation. La traduction évite de la réduire à une doctrine sacramentelle, à l’union mystique, aux seuls bienfaits du salut ou au seul ministère.
- issue: Valeur de διά avec l’accusatif
  choice: « à cause de », avec « pour la bonne nouvelle » en note
  alternative: « en faveur de la bonne nouvelle » ou « pour l’amour de la bonne nouvelle »
  rationale: Le grec permet une nuance de motif, de but ou d’intérêt. Le texte principal et la note conservent cette amplitude sans trancher excessivement.
translation_notes:
  register: Français international moderne, clair et digne. « Bonne nouvelle » privilégie l’intelligibilité tout en donnant « Évangile » comme équivalent traditionnel. La syntaxe reste concise et conserve l’indétermination du grec quant à la nature précise de la participation.
