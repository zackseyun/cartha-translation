  text: For they can neither curse kings nor bless them[a].
translation:
  language: de
  text: Denn sie können Könige weder verfluchen noch segnen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Denn sie werden Könige gewiss weder verfluchen noch segnen.“ Die nachdrückliche Verneinung bezeichnet hier im Zusammenhang, dass sie zu beidem unfähig sind.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὔτε γὰρ
  choice: Denn ... weder
  rationale: γάρ begründet die vorherige Aussage; οὔτε eröffnet die zweiteilige Verneinung, die im Deutschen natürlich mit „weder ... noch“ wiedergegeben wird.
- source_word: βασιλεῦσιν
  choice: Könige
  rationale: Der Dativ Plural bezeichnet hier die Personen, auf die sich Verfluchen und Segnen richten. Im Deutschen stehen beide Verben idiomatisch mit Akkusativ.
- source_word: οὐ μὴ καταράσωνται
  choice: können ... nicht verfluchen
  rationale: οὐ μή mit Aorist Konjunktiv ist eine nachdrückliche Verneinung. Im Kontext der Machtlosigkeit der Götzen bringt „können ... nicht“ die gemeinte Unfähigkeit natürlich zum Ausdruck.
- source_word: οὔτε μὴ εὐλογήσωσι
  choice: noch segnen
  rationale: Die zweite, parallele Verbalform wird in die deutsche weder-noch-Konstruktion einbezogen. Das gemeinsame Objekt „Könige“ gilt ohne Wiederholung auch für „segnen“.
theological_decisions:
- issue: Bedeutung der nachdrücklichen Verneinung in der Polemik gegen Götzen
  choice: 'Als Unfähigkeit wiedergegeben: „können ... weder ... noch“'
  alternative: 'Als nachdrückliche zukünftige Verneinung: „werden Könige gewiss weder verfluchen noch segnen“'
  rationale: Die griechische Konstruktion kann formal eine entschiedene Verneinung ausdrücken. Der Zusammenhang handelt jedoch von der Machtlosigkeit der Götzen; die Fähigkeitsformulierung gibt diesen Sinn verständlich wieder, ohne ihnen eine bloße Entscheidung zum Nicht-Handeln zuzuschreiben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe parallele Struktur des Griechischen bleibt durch „weder ... noch“ erhalten; das Objekt wird im zweiten Glied nicht unnötig wiederholt.
