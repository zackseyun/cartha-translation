  text: And just as the courts are secured around one who has wronged a king[a], as one being led away to death, so the priests fortify their houses with doors and locks and bars[b], so that they may not be plundered by robbers.
translation:
  language: de
  text: Und wie Höfe um jemanden herum abgeschlossen sind, der einem König Unrecht getan hat[a] und zum Tod abgeführt wird, so sichern die Priester ihre Häuser mit Türen, Schlössern und Riegeln[b], damit sie nicht von Räubern geplündert werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »wie die Höfe um jemanden herum abgeschlossen sind, der den König beleidigt hat«. Der griechische Satzanfang ist syntaktisch schwierig; der Vergleich schildert offenbar die strenge Sicherung eines Menschen, der zum Tod abgeführt wird.'
    reason: lexical_alternative
  - marker: b
    text: Mit »ihre Häuser« sind die Häuser oder Tempelbauten der Götzen gemeint, die von den Priestern bewacht werden.
    reason: cultural_note
lexical_decisions:
- source_word: περιτετράχηλαι εἰσὶν αἱ αὐλαί
  choice: die Höfe rings um einen gesichert sind
  rationale: Die schwierige Perfekt-Passiv-Konstruktion bezeichnet offenbar ringsum geschützte oder abgeschlossene Höfe. Die Wiedergabe wahrt das räumliche Bild und lässt die syntaktische Unschärfe erkennen.
- source_word: τινὶ ἠδικηκότι βασιλέα
  choice: einen, der einem König Unrecht getan hat
  rationale: ἀδικέω bezeichnet hier ein Unrechttun gegenüber dem König. Die Formulierung ist verständlich und vermeidet die stärkere Festlegung auf ein bestimmtes Rechtsdelikt.
- source_word: ὡς ἐπὶ θάνατον ἀπηγμένῳ
  choice: und zum Tod abgeführt wird
  rationale: ἀπάγω bezeichnet das Abführen unter Bewachung; „zum Tod“ erhält die Ausdrucksweise des Griechischen, ohne ausdrücklich „Hinrichtung“ einzutragen.
- source_word: ὀχυροῦσιν
  choice: sichern
  rationale: Das Verb bedeutet befestigen oder sichern. Hier passt „sichern“ natürlich zu Türen, Schlössern und Riegeln und erhält zugleich den satirischen Gedanken, dass die Götzen Schutz benötigen.
- source_word: τοὺς οἴκους αὐτῶν
  choice: ihre Häuser
  rationale: οἴκους bedeutet wörtlich „Häuser“. Der kultische Bezug wird in einer Fußnote erläutert, statt im Haupttext interpretierend „Tempel“ oder „Heiligtümer“ zu setzen.
- source_word: θυρώμασιν τε καὶ κλείθροις καὶ μοχλοῖς
  choice: mit Türen, Schlössern und Riegeln
  rationale: Die drei Begriffe bezeichnen bauliche Sicherungsmittel. Die Reihung ist im modernen Deutsch klar und bewahrt die kumulative Wirkung.
- source_word: ὑπὸ τῶν λῃστῶν
  choice: von Räubern
  rationale: λῃσταί bezeichnet Räuber oder Banditen, häufig mit dem Beiklang gewaltsamen Raubes. „Räuber“ ist hier die direkte und natürliche Entsprechung.
- source_word: συληθῶσι
  choice: geplündert werden
  rationale: συλάω bedeutet berauben, ausplündern oder Beute wegnehmen. „Geplündert werden“ trifft den möglichen Raub von Gegenständen aus den Götzenhäusern.
theological_decisions:
- issue: Bezug von „ihre Häuser“ im Kontext der Götzenkritik
  choice: Wörtlich „ihre Häuser“ im Haupttext; Erläuterung des Bezugs auf die Häuser beziehungsweise Tempelbauten der Götzen in einer Fußnote.
  alternative: „ihre Tempel“ oder „ihre Heiligtümer“
  rationale: Die wörtliche Wiedergabe bewahrt die Formulierung des Griechischen und die polemische Wirkung, ohne den kultischen Gebäudetyp im Haupttext stärker zu bestimmen als die Vorlage.
- issue: Schwieriger Vergleich am Versanfang
  choice: Die Höfe sind rings um den verurteilten Übeltäter gesichert.
  alternative: Die Höfe oder Vorhöfe sind umschlossen; möglicherweise ist allgemeiner eine stark bewachte Umgebung gemeint.
  rationale: Die griechische Syntax ist ungewöhnlich. Die Übersetzung gibt den wahrscheinlichsten Sinn wieder, während die Fußnote die verbleibende Unsicherheit offenlegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die mehrfachen Sicherungsbegriffe bleiben als deutliche Reihung erhalten. „Zum Tod abgeführt“ wahrt die ernste, leicht fremdartige Formulierung der Vorlage; die schwierige Anfangskonstruktion wird lesbar gefasst, aber durch eine Fußnote nicht vorschnell vereindeutigt.
