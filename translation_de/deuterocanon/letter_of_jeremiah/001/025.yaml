  text: Without feet they are carried on shoulders, showing their own disgrace to men; and even those who serve them are put to shame,
translation:
  language: de
  text: Ohne Füße werden sie auf Schultern getragen und führen so den Menschen ihre eigene Schande vor Augen; auch die, die ihnen dienen, schämen sich.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄνευ ποδῶν
  choice: Ohne Füße
  rationale: Gibt die knappe, betonte Feststellung des griechischen Textes unmittelbar wieder.
- source_word: ἐπʼ ὤμοις φέρονται
  choice: werden sie auf Schultern getragen
  rationale: Bewahrt das Passiv und den Kontrast zwischen ihrer angeblichen Göttlichkeit und ihrer tatsächlichen Unbeweglichkeit.
- source_word: ἐνδεικνύμενοι
  choice: führen so … vor Augen
  rationale: Drückt das öffentliche Sichtbar- beziehungsweise Erkennbarwerden idiomatisch aus; „so“ macht den sachlichen Zusammenhang deutlich, ohne einen neuen Gedanken einzuführen.
- source_word: τὴν ἑαυτῶν ἀτιμίαν
  choice: ihre eigene Schande
  rationale: Bewahrt die reflexive Betonung ἑαυτῶν und den abwertenden Sinn von ἀτιμία.
- source_word: τοῖς ἀνθρώποις
  choice: den Menschen
  rationale: Natürliches, inklusives Standarddeutsch für den generischen Plural ἄνθρωποι.
- source_word: οἱ θεραπεύοντες αὐτά
  choice: die, die ihnen dienen
  rationale: θεραπεύω bezeichnet hier den Dienst beziehungsweise Kultdienst an den Götzen; „dienen“ erhält den religiösen Zusammenhang, ohne ihn unnötig auszudeuten.
- source_word: αἰσχύνονται
  choice: müssen sich schämen
  rationale: Gibt die Scham der Diener idiomatisch wieder. „müssen“ bringt die sich aus der Lage ergebende Beschämung zum Ausdruck, ohne eine äußere Verpflichtung zu behaupten.
theological_decisions:
- issue: Bezeichnung des Kultdienstes an den Bildern
  choice: ihnen dienen
  alternative: sie verehren
  rationale: „Dienen“ bleibt näher an θεραπεύοντες und lässt offen, welche konkreten kultischen Handlungen gemeint sind.
- issue: Deutung von ἀτιμία
  choice: Schande
  alternative: Unehre / Würdelosigkeit
  rationale: „Schande“ bewahrt die polemische Schärfe des Verses und passt zum anschließenden Sich-Schämen, ohne eine zusätzliche dogmatische Aussage einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzführung. Der Spott des griechischen Textes bleibt erhalten; unnötige Fach- und Kirchensprache wurde vermieden.
