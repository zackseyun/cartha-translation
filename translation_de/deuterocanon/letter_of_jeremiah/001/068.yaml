translation:
  language: de
  text: Daher ist uns in keiner Weise ersichtlich, dass sie Götter sind; deshalb fürchtet euch nicht vor ihnen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατʼ οὐδένα ... τρόπον
  choice: auf keine Weise
  rationale: Die Wendung drückt eine uneingeschränkte Verneinung aus. „Auf keine Weise“ bewahrt diese kategorische Kraft in würdigem, verständlichem Deutsch.
- source_word: φανερὸν
  choice: erkennbar
  rationale: Das prädikative φανερόν bezeichnet hier, was offenbar beziehungsweise als wahr feststellbar ist. „Erkennbar“ erhält den erkenntnisbezogenen Akzent, ohne die Aussage über das Griechische hinaus zu verschärfen.
- source_word: θεοί
  choice: Götter
  rationale: Der gewöhnliche Plural „Götter“ gibt θεοί direkt wieder und bewahrt die polemische Aussage, dass den besprochenen Bildern keine Göttlichkeit anzusehen ist.
- source_word: διό
  choice: deshalb
  rationale: διό zieht aus der vorherigen Feststellung die Folgerung. „Deshalb“ macht diesen logischen Zusammenhang im Deutschen deutlich.
- source_word: μὴ φοβῆσθε αὐτούς
  choice: fürchtet euch nicht vor ihnen
  rationale: Die Formulierung gibt das verneinte Imperativgefüge natürlich und direkt wieder; „ihnen“ verweist grammatisch auf die zuvor besprochenen vermeintlichen Götter beziehungsweise Götzenbilder.
theological_decisions:
- issue: Bezug von αὐτούς im Schlusssatz
  choice: „ihnen“ bezeichnet die im Abschnitt behandelten Götzenbilder, die für Götter gehalten werden
  alternative: Explizit „diese Götzenbilder“ einsetzen
  rationale: Das Pronomen bleibt wie im Griechischen stehen und lässt seinen im Kontext klaren Bezug erkennen, ohne eine auslegende Bezeichnung in den Haupttext einzufügen.
- issue: Aussagekraft von φανερὸν ὅτι εἰσὶν θεοί
  choice: „erkennbar, dass sie Götter sind“
  alternative: „offenkundig, dass sie Götter sind“ oder eine direkte Aussage „sie sind keine Götter“
  rationale: Die Übersetzung wahrt die erkenntnisbezogene Formulierung des Ausgangstextes. Sie wandelt sie nicht stillschweigend in eine anders formulierte ontologische Verneinung um, auch wenn diese im polemischen Zusammenhang nahegelegt wird.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, unmittelbar verständlichem Stil. Die doppelte Folgerungsstruktur οὖν ... διό wird mit „Daher ... deshalb“ erhalten. Keine Fußnoten erforderlich.
