  text: But these are not preserved from rust and moths[a], though they are clothed in purple garments.
translation:
  language: de
  text: Diese aber werden nicht vor Rost und Fraß bewahrt, obwohl sie mit purpurfarbenem Gewand bekleidet sind.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὗτοι
  choice: Diese
  rationale: Das Demonstrativpronomen verweist auf die zuvor behandelten Götzenbilder; ein ergänzendes Substantiv wäre deutlicher, aber stärker auslegend.
- source_word: οὐ διασώζονται
  choice: bleiben … nicht bewahrt
  rationale: Die Form bezeichnet hier das Ausbleiben materieller Erhaltung; die Wiedergabe vermeidet den in diesem Zusammenhang missverständlichen theologischen Klang von „gerettet werden“.
- source_word: ἀπὸ ἰοῦ
  choice: vor Rost
  rationale: ἰός bezeichnet im Zusammenhang mit dem Verfall materieller Gegenstände am ehesten Rost beziehungsweise Korrosion.
- source_word: βρωμάτων
  choice: Fraß
  rationale: Das Wort bezeichnet wörtlich verzehrende oder fressende Einwirkungen. „Fraß“ bewahrt diese Breite und passt zugleich zu den anschließend genannten Gewändern, ohne den Text ausdrücklich auf Motten festzulegen.
- source_word: περιβεβλημένων αὐτῶν
  choice: obwohl sie … bekleidet sind
  rationale: Der Genitivus absolutus wird konzessiv verstanden; dies bringt den ironischen Gegensatz zwischen prächtiger Bekleidung und fortschreitendem Verfall natürlich zum Ausdruck.
- source_word: ἱματισμὸν πορφυροῦν
  choice: mit purpurfarbenen Gewändern
  rationale: ἱματισμός bezeichnet Kleidung beziehungsweise Gewandung; der deutsche Plural gibt den kollektiven Sinn idiomatisch wieder, während „purpurfarben“ die kostbare Färbung ausdrückt.
theological_decisions:
- issue: Bedeutung von διασώζονται im Kontext der Götzenkritik
  choice: materielle Bewahrung vor Verfall
  alternative: Rettung oder Befreiung in einem umfassenderen Sinn
  rationale: Rost, Fraß und Kleidung bestimmen den unmittelbaren Zusammenhang. Daher ist körperlich-materielle Erhaltung gemeint, nicht geistliche Rettung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Diese“ erhält die knappe Rückverweisung des Griechischen; „Fraß“ wahrt dessen lexikalische Breite. Der konzessive Satzbau macht den im Kontext angelegten Gegensatz verständlich.
