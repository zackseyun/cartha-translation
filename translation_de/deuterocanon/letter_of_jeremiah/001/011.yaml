  source_fidelity: Die Wiedergabe trifft die Aussage über die fehlende materielle Bewahrung grundsätzlich. „Bleiben … nicht bewahrt“ fügt jedoch einen durativen Aspekt hinzu, der in οὐ διασώζονται nicht ausdrücklich liegt. Die Singularform ἱματισμὸν wird mit einem kollektiven Singular genauer abgebildet.
  naturalness: „Diese aber werden nicht vor Rost und Fraß bewahrt“ ist modernes, würdiges und idiomatisches Deutsch. „Fraß“ bewahrt die offene Bedeutung von βρωμάτων besser als eine Festlegung auf Motten.
  terminology: „Rost“ ist im Kontext eine vertretbare konkrete Wiedergabe von ἰός; die Fußnote hält „Korrosion“ als weitere Möglichkeit fest. „Purpurfarbenes Gewand“ gibt die kostbare purpurne Kleidung ohne unnötige Auslegung wieder.
