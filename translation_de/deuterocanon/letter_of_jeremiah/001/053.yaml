  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/053.yaml
  text: They cannot judge their own case[a], nor can they rescue one who is wronged, because they are powerless;
translation:
  language: de
  text: Sie können weder über ihre eigene Rechtssache urteilen[a] noch jemanden retten, dem Unrecht geschieht; denn sie sind machtlos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Sie können für sich selbst kein Urteil fällen und auch nicht aus dem Unrecht befreien.« Das Griechische ist knapp formuliert; ἀδίκημα kann »Unrecht« oder »Vergehen« bezeichnen, hier dem Sinn nach aber auch auf den Menschen bezogen werden, dem Unrecht geschieht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κρίσίν
  choice: Rechtssache
  rationale: κρίσις bezeichnet hier im Zusammenhang mit διακρίνω eine gerichtliche Entscheidung oder Streitsache. »Rechtssache« bewahrt den juristischen Sinn und klingt im modernen Deutsch verständlich.
- source_word: διακρίνωσιν
  choice: urteilen
  rationale: In Verbindung mit κρίσις hat διακρίνω hier den Sinn, eine Sache zu entscheiden oder darüber zu urteilen. »urteilen« gibt diese richterliche Tätigkeit knapp und natürlich wieder.
- source_word: ἑαυτῶν
  choice: ihre eigene
  rationale: Das Reflexivpronomen bezieht die Rechtssache auf die Götzen selbst. »ihre eigene« ist die natürliche deutsche Entsprechung, ohne die genaue Art dieses Bezugs weiter festzulegen.
- source_word: ῥύσωνται
  choice: retten
  rationale: ῥύομαι bedeutet aus Gefahr, Bedrängnis oder Unterdrückung retten beziehungsweise befreien. »retten« ist allgemeinverständlich und verlangt hier keine spezifisch heilsgeschichtliche Deutung.
- source_word: ἀδίκημα
  choice: jemanden, dem Unrecht geschieht
  rationale: ἀδίκημα bezeichnet gewöhnlich Unrecht, Vergehen oder erlittene Schädigung. Nach »retten« ist im Deutschen eine konkrete Wiedergabe mit der betroffenen Person am verständlichsten; die sachliche Alternative »aus dem Unrecht befreien« wird in der Fußnote bewahrt.
- source_word: ἀδύνατοι ὄντες
  choice: denn sie sind machtlos
  rationale: Die partizipiale Wendung nennt den Grund für das zuvor beschriebene Unvermögen. »denn sie sind machtlos« drückt diese kausale Beziehung und die polemische Aussage klar aus.
theological_decisions:
- issue: Art des Unvermögens der Götzen
  choice: Die Aussage beschreibt ihre praktische und richterliche Machtlosigkeit.
  alternative: Die Formulierung könnte möglichst wörtlich als »Sie werden gewiss kein Urteil für sich entscheiden und auch nicht aus Unrecht retten« wiedergegeben werden.
  rationale: Der griechische Satz ist gedrängt und teilweise mehrdeutig. Die Übersetzung macht seine konkrete Aussage verständlich, ohne daraus eine weitergehende metaphysische oder konfessionelle Lehre abzuleiten.
- issue: Bezug von ἀδίκημα
  choice: Das Unrecht wird konkret auf den davon betroffenen Menschen bezogen.
  alternative: ἀδίκημα kann abstrakt als »Unrecht«, »Ungerechtigkeit« oder »Vergehen« verstanden werden.
  rationale: Das konkrete Verständnis ergibt mit dem Verb »retten« einen natürlichen deutschen Satz, während die Fußnote die echte lexikalische Mehrdeutigkeit offenhält.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die paarige Konstruktion »weder … noch« gibt die doppelte starke Verneinung flüssig wieder; das Semikolon hebt die abschließende Begründung hervor.
