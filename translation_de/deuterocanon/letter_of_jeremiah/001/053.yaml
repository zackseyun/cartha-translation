  source_fidelity: 'Die Übersetzung gibt die beiden Aussagen der griechischen Vorlage sachgerecht wieder: Die Götzen sind außerstande, eine sie selbst betreffende Rechtssache zu entscheiden, und sie können keinem von Unrecht Betroffenen Hilfe bzw. Rettung bringen. »denn sie sind machtlos« gibt ἀδύνατοι ὄντες als begründende Schlusswendung treffend wieder. Die starke griechische Verneinung ist durch die Unfähigkeitskonstruktion mit »weder … noch« idiomatisch und ohne Sinnverlust wiedergegeben.'
