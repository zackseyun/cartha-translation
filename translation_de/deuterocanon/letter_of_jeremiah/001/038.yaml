  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/038.yaml
  text: The wooden things and the gold-covered and silver-covered things are like stones from the mountain[a], and those who serve them will be put to shame.
translation:
  language: de
  text: Die hölzernen Dinge, die goldüberzogenen Dinge und die silberüberzogenen Dinge gleichen Steinen vom Berg; die ihnen dienen[a], werden beschämt werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die sie verehren“. Das griechische Verb kann sowohl Dienen als auch kultische Verehrung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῖς ἀπὸ τοῦ ὄρους λίθοις
  choice: Steinen vom Berg
  rationale: Die Dativgruppe bezeichnet nach ὡμοιωμένοι das Vergleichsobjekt. Die Formulierung bewahrt das Bild gewöhnlicher, lebloser Steine, ohne das im Griechischen nicht ausdrücklich genannte Behauen einzutragen.
- source_word: ὡμοιωμένοι εἰσὶν
  choice: gleichen
  rationale: Die periphrastische Perfekt-Passiv-Form beschreibt hier idiomatisch einen bestehenden Vergleich. „Gleichen“ gibt diesen Zustand in natürlichem Deutsch wieder.
- source_word: τὰ ξύλινα
  choice: die hölzernen Dinge
  rationale: Das substantivierte Adjektiv bezeichnet wörtlich hölzerne Dinge. „Götzenbilder“ wäre kontextuell möglich, würde den in diesem Satz nicht ausdrücklich genannten Bezug aber explizit machen.
- source_word: τὰ περίχρυσα
  choice: die goldüberzogenen
  rationale: περίχρυσος bezeichnet etwas, das mit Gold überzogen ist. Die substantivierte deutsche Form wahrt die Parallelstruktur und vermeidet den technischeren Ausdruck „vergoldet“.
- source_word: τὰ περιάργυρα
  choice: die silberüberzogenen
  rationale: Die Wiedergabe entspricht der parallelen Bildung περίχρυσα und hält das Bild eines äußeren Metallüberzugs fest.
- source_word: οἱ δὲ θεραπεύοντες αὐτά
  choice: alle, die ihnen dienen
  rationale: θεραπεύω kann bedienen, dienen oder im kultischen Zusammenhang verehren bedeuten. „Dienen“ bewahrt diese Bedeutungsbreite und passt zugleich zum Götzendienst des Kontextes.
- source_word: κατασχυνθήσονται
  choice: werden beschämt werden
  rationale: Die Formulierung erhält sowohl den Zukunftsbezug als auch die passive Aussage des griechischen Verbs und dessen Sinn von öffentlicher Schande.
theological_decisions:
- issue: Wiedergabe von θεραπεύοντες im Zusammenhang des Götzendienstes
  choice: die ihnen dienen
  alternative: die sie verehren
  rationale: Der kultische Kontext macht „verehren“ sachlich möglich. „Dienen“ wahrt jedoch die weitere Bedeutung des griechischen Verbs und lässt offen, ob der Akzent auf Pflege, Kultdienst oder ausdrücklicher Verehrung liegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholten substantivierten Adjektive bilden die drei griechischen Gruppen sichtbar nach; „Dinge“ vermeidet, den kontextuell eindeutigen, im Satz aber unausgesprochenen Begriff „Götzenbilder“ in den Haupttext einzutragen.
