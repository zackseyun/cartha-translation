  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/048.yaml
  text: For when war and calamities come upon them[a], the priests consult among themselves where they may hide with them.
translation:
  language: de
  text: Denn wenn Krieg und Unheil über sie kommen[a], beraten die Priester miteinander, wo sie sich zusammen mit ihnen verstecken können.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint sind die Götzen beziehungsweise Götterbilder, von denen im Zusammenhang die Rede ist.
    reason: cross_reference
lexical_decisions:
- source_word: ὅταν
  choice: wenn
  rationale: Leitet einen allgemein wiederkehrenden künftigen Fall ein; »wenn« ist im Deutschen natürlich und lässt diesen Aspekt offen.
- source_word: ἐπέλθῃ
  choice: über sie kommen
  rationale: Bewahrt mit »über« die gegen die Bildwerke gerichtete Bewegung des mit ἐπί zusammengesetzten Verbs.
- source_word: πόλεμος
  choice: Krieg
  rationale: Die übliche und im Zusammenhang umfassendere Wiedergabe gegenüber »Kampf« oder »Schlacht«.
- source_word: κακά
  choice: Unheil
  rationale: Bezeichnet hier schlimme Ereignisse und Notlagen, nicht sittlich Böses; »Unheil« ist würdig, verständlich und kann wie das griechische Neutrum pluralisch mehrere Nöte zusammenfassen.
- source_word: βουλεύονται πρὸς ἑαυτούς
  choice: beraten ... miteinander
  rationale: Gibt die wechselseitige Beratung der Priester idiomatisch wieder, ohne sie als bloß inneres Nachdenken zu verstehen.
- source_word: ποῦ
  choice: wo
  rationale: Schlichte Ortsfrage, die den Inhalt der Beratung einleitet.
- source_word: συγκαρυβῶσι
  choice: sich zusammen ... verstecken
  rationale: Das seltene Verb bezeichnet ein Verbergen; »zusammen« erhält die durch σύν ausgedrückte Gemeinsamkeit.
- source_word: μετʼ αὐτῶν
  choice: mit ihnen
  rationale: Bewahrt den pronominalen Rückbezug und die Ironie, dass sich die Priester gemeinsam mit den von ihnen verehrten Bildwerken verstecken wollen.
theological_decisions:
- issue: Bezugswort von αὐτά / αὐτῶν
  choice: Die Pronomen bleiben im Haupttext als »sie/ihnen« stehen und beziehen sich im Zusammenhang auf die Götzen beziehungsweise Götterbilder.
  alternative: Die Bezugsgröße im Haupttext ausdrücklich als »Götzenbilder« benennen.
  rationale: Der griechische Text verwendet Pronomen; die Übersetzung bewahrt diese Form und erklärt den aus dem Kontext eindeutigen Bezug in einer Fußnote, statt ihn stillschweigend zu präzisieren.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. »Unheil« vermeidet eine moralische Deutung von κακά. Die etwas auffällige Wiederholung »sie ... ihnen« bewahrt den pronominalen und ironischen Charakter des griechischen Textes.
