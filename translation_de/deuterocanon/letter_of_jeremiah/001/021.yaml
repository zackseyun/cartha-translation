translation:
  language: de
  text: Auf ihren Körper und auf ihren Kopf lassen sich Fledermäuse, Schwalben und Vögel nieder[a], ebenso auch Katzen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: fliegen auf sie; das griechische Verb kann sowohl das Heranfliegen als auch das Sichniederlassen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὶ τὸ σῶμα αὐτῶν καὶ ἐπὶ τὴν κεφαλήν
  choice: auf ihre Körper und ihre Köpfe
  rationale: Die zweimalige Präposition und die beiden Körperteile werden ausdrücklich wiedergegeben. Der Plural ergibt sich sinngemäß aus αὐτῶν und dem Zusammenhang, in dem von mehreren Götzen die Rede ist.
- source_word: ἐφίπτανται
  choice: setzen sich … nieder
  rationale: Das Verb bezeichnet das Heranfliegen beziehungsweise Sichniederlassen auf etwas. „Sich niedersetzen“ ist im Deutschen sowohl für die genannten Flugtiere als auch für Katzen natürlich und bewahrt die gemeinsame Prädikation des griechischen Satzes.
- source_word: νυκτερίδες
  choice: Fledermäuse
  rationale: Die übliche und sachlich eindeutige Bedeutung des griechischen Tiernamens.
- source_word: χελιδόνες
  choice: Schwalben
  rationale: Die konkrete Vogelart wird entsprechend dem griechischen Wort beibehalten.
- source_word: τὰ ὄρνεα
  choice: Vögel
  rationale: Die allgemeine Bezeichnung folgt nach den eigens genannten Schwalben. Der griechische Artikel muss bei einer solchen Aufzählung im Deutschen nicht eigens wiedergegeben werden.
- source_word: ὡσαύτως δὲ καὶ
  choice: ebenso auch
  rationale: Die Formulierung erhält die additive und leicht hervorhebende Kraft der griechischen Wendung, ohne im Deutschen schwerfällig zu wirken.
- source_word: οἱ αἴλουροι
  choice: Katzen
  rationale: αἴλουροι bezeichnet gewöhnlich Katzen. Der bestimmte Artikel wird in der deutschen Aufzählung idiomatisch nicht wiederholt.
theological_decisions:
- issue: Polemik gegen die Machtlosigkeit der Götzen
  choice: Die Tierdarstellung wörtlich wiedergeben
  alternative: Die Tiere symbolisch deuten oder die Verspottung erklärend verstärken
  rationale: Der griechische Text zeigt schlicht, dass sich Tiere ungehindert auf Körper und Köpfe der Götzen setzen. Die wörtliche Wiedergabe bewahrt diese anschauliche Polemik, ohne zusätzliche Symbolik oder konfessionelle Deutung einzutragen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, knappem Satzbau. Die wiederholte räumliche Angabe bleibt erhalten; das Prädikat ist so gewählt, dass es bei Fledermäusen, Vögeln und Katzen gleichermaßen natürlich klingt.
