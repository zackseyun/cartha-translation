  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/026.yaml
  text: Therefore[a], if one of them falls to the ground, they cannot raise themselves up; and if someone sets it upright, it will not move by itself; and if it is tilted, it will certainly not be made straight. Rather[b], gifts are set before them as before the dead.
translation:
  language: de
  text: Deshalb kann einer von ihnen, wenn er zu Boden fällt, nicht aus eigener Kraft wieder aufstehen.[a] Und wenn jemand ihn aufrecht hinstellt, wird er sich nicht von selbst bewegen; wenn er sich neigt, wird er ganz gewiss nicht wieder aufgerichtet. Vielmehr stellt man ihnen Gaben[b] hin wie den Toten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Formulierung ist gedrängt und wörtlich schwer wiederzugeben. Gemeint ist: Wenn ein Götze zu Boden fällt, kann er nicht aus eigener Kraft wieder aufstehen.'
    reason: lexical_alternative
  - marker: b
    text: „Gaben“ kann in diesem kultischen Zusammenhang auch mit „Opfergaben“ wiedergegeben werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τό
  choice: Deshalb
  rationale: Kennzeichnet im Zusammenhang die Folgerung aus der zuvor beschriebenen Hilflosigkeit der Götzen; die knappe deutsche Entsprechung erhält den logischen Anschluss.
- source_word: μή ποτε ἐπὶ τὴν γῆν πέσῃ, δι' αὐτῶν ἀνίστασθαι
  choice: falls einer von ihnen zu Boden fällt, nicht aus eigener Kraft wieder aufstehen
  rationale: Die griechische Konstruktion ist gedrängt und formal ungewöhnlich. Die Wiedergabe bewahrt den Sinn, dass ein umgefallener Götze sich nicht selbst wieder erheben kann, ohne die syntaktische Unebenheit zu verschleiern.
- source_word: μήτε ἐὰν τις αὐτὸ ὀρθὸν στήσῃ
  choice: wenn jemand ihn aufrecht hinstellt
  rationale: Gibt die von außen vorgenommene Aufstellung des Götzen natürlich und konkret wieder.
- source_word: δι' ἑαυτοῦ κινηθήσεται
  choice: wird er sich nicht von selbst bewegen
  rationale: Bewahrt die Aussage über die fehlende Eigenbewegung und entspricht idiomatischem modernen Deutsch.
- source_word: μήτε ἐὰν κλιθῇ, οὐ μὴ ὀρθωθῇ
  choice: wenn er sich neigt, wird er ganz gewiss nicht wieder aufgerichtet
  rationale: „Sich neigt“ bildet κλιθῇ ab; „ganz gewiss nicht“ bringt die nachdrückliche Verneinung οὐ μή zum Ausdruck. Das Passiv „aufgerichtet“ wahrt die grammatische Offenheit darüber, wer handeln müsste.
- source_word: ἀλλ' ὥσπερ νεκροῖς
  choice: Vielmehr … wie Toten
  rationale: Markiert den Gegensatz und erhält den scharfen Vergleich der Götzen mit Verstorbenen.
- source_word: τὰ δῶρα αὐτοῖς παρατίθεται
  choice: werden ihnen Gaben hingestellt
  rationale: „Gaben“ bewahrt die weitere Bedeutung von δῶρα; „hingestellt“ gibt die räumliche Vorstellung von παρατίθεται wieder, ohne den kultischen Bezug auszuschließen.
theological_decisions:
- issue: Numerus und Bezug der Pronomen bei den Götzen
  choice: In den Bedingungssätzen steht ein einzelner Götze stellvertretend im Singular; im Schlusssatz werden die Götzen als Gruppe im Plural bezeichnet.
  alternative: Durchgehend Plural oder durchgehend Singular verwenden.
  rationale: Der griechische Text wechselt in seiner verallgemeinernden Beschreibung zwischen Bezügen. Der Wechsel im Deutschen erhält diesen repräsentativen Singular und den abschließenden kollektiven Bezug, ohne eine zusätzliche theologische Deutung einzutragen.
- issue: Handlungsfähigkeit beim Wiederaufrichten
  choice: Das Passiv „wird … nicht wieder aufgerichtet“ beibehalten.
  alternative: „richtet er sich nicht wieder auf“ als rein reflexive Aussage.
  rationale: Das griechische ὀρθωθῇ ist formal passiv. Die gewählte Fassung bewahrt diese Form und die Spannung zur zuvor ausdrücklich verneinten Eigenbewegung.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die konkreten Bewegungsbilder und die nachdrückliche Verneinung bleiben erhalten; unnötige Archaismen und konfessionell geprägte Begriffe werden vermieden.
