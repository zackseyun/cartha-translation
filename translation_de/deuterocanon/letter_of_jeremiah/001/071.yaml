  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/071.yaml
  text: From the purple and the marble rotting upon them it will be known that they are not gods; and in the end they themselves will be eaten[a], and they will become a disgrace in the land.
translation:
  language: de
  text: An dem Purpur und dem Marmor, die auf ihnen verfallen, wird man erkennen, dass sie keine Götter sind. Sie selbst aber werden schließlich gefressen werden[a] und im Land zur Schande werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sie selbst werden später verzehrt werden.“ Wörtlich steht im Griechischen „werden gefressen werden“; gemeint sein kann, dass sie von Tieren oder Schädlingen gefressen oder allgemein aufgezehrt werden.'
    reason: Lexikalische Alternative und Bewahrung der Unbestimmtheit des Bildes.
lexical_decisions:
- source_word: πορφύρας
  choice: Purpur
  rationale: Das Substantiv bezeichnet hier wahrscheinlich purpurfarbenen Stoff oder Purpurschmuck auf den Götzenbildern. „Purpur“ bewahrt die knappe Ausdrucksweise des Griechischen.
- source_word: μαρμάρου
  choice: Marmor
  rationale: Die direkte Entsprechung gibt das kostbare Schmuckmaterial wieder, ohne es als Verkleidung oder Einsatz näher zu bestimmen.
- source_word: τῆς ἐπ’ αὐτοὺς σηπομένης
  choice: die auf ihnen verrotten
  rationale: Das Partizip bezeichnet fortschreitenden Verfall. Die ungewöhnliche Verbindung auch mit Marmor wird nicht geglättet, sondern als Teil der polemischen Bildsprache bewahrt.
- source_word: γνωσθήσεται
  choice: wird man erkennen
  rationale: 'Die unpersönliche deutsche Form gibt den Sinn des griechischen Futur Passiv natürlich wieder: Der Verfall macht die Wahrheit öffentlich erkennbar.'
- source_word: οὐκ εἰσὶν θεοί
  choice: dass sie keine Götter sind
  rationale: Dies ist die klare und unmittelbare Wiedergabe der Aussage, mit der den Götzenbildern Göttlichkeit abgesprochen wird.
- source_word: ἐξ ὑστέρου
  choice: schließlich
  rationale: Das Wort bezeichnet einen späteren oder letztendlichen Ausgang; „schließlich“ lässt offen, wie lang dieser Prozess dauert.
- source_word: βρωθήσονται
  choice: werden ... gefressen werden
  rationale: Das Verb bedeutet wörtlich „gegessen werden“. „Gefressen“ passt im Deutschen zu unbelebten Gegenständen, die etwa von Tieren oder Schädlingen verzehrt werden, ohne einen bestimmten Verursacher festzulegen.
- source_word: ὄνειδος
  choice: zur Schande
  rationale: „Schande“ gibt den Gedanken öffentlicher Beschämung oder Schmach in natürlichem, würdigem Deutsch wieder.
- source_word: ἐν τῇ χώρᾳ
  choice: im Land
  rationale: „Land“ wahrt die räumliche Weite von χώρα, ohne die Bedeutung unnötig auf eine bestimmte Gegend einzugrenzen.
theological_decisions:
- issue: Bezug von αὐτά in den Schlussaussagen
  choice: „sie selbst“ bezieht sich im Haupttext auf die Götzenbilder.
  alternative: Das Pronomen könnte grammatisch oder gedanklich auf die zuvor genannten Schmuckmaterialien zurückweisen.
  rationale: Der weitere Zusammenhang richtet die Polemik gegen die Götzenbilder, und das betonte αὐτά legt nahe, dass diese selbst schließlich verzehrt und zur Schande werden. Die deutsche Formulierung bewahrt jedoch den pronominalen Ausdruck und fügt keine ausdrücklich benannte Bezugsgröße ein.
- issue: Art des in βρωθήσονται bezeichneten Verfalls
  choice: Die konkrete Wendung „gefressen werden“ bleibt erhalten, ohne den Handelnden zu nennen.
  alternative: „aufgezehrt“ oder „verzehrt werden“ könnte allgemeineren materiellen Verfall bezeichnen.
  rationale: Das Griechische verwendet ein anschauliches Verb für Essen oder Verzehren. Eine Festlegung auf Tiere, Schädlinge oder bloße Zersetzung wäre eine nicht ausdrücklich gegebene Deutung.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die polemische Konkretheit des griechischen Textes und seine ungewöhnliche Aussage vom Verrotten des Marmors bleiben erhalten.
