base_translation:
  language: en
  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/069.yaml
  text: For just as in a cucumber patch there is nothing guarding it[a], so their gods are wooden and overlaid with gold and silver.
translation:
  language: de
  text: Denn wie eine Vogelscheuche[a] in einem Gurkenfeld nichts bewacht, so sind ihre Götter aus Holz und mit Gold und Silber überzogen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hier mit „Vogelscheuche“ wiedergegebene griechische Wort ist in seiner überlieferten Form lexikalisch schwierig. Gemeint ist wahrscheinlich eine im Gurkenfeld aufgestellte Schreck- oder Wächterfigur, die tatsächlich nichts bewachen kann.
    reason: textual_variant
lexical_decisions:
- source_word: σικυηράτῳ
  choice: Gurkenfeld
  rationale: Das Substantiv bezeichnet eine mit Gurken oder ähnlichen Kürbisgewächsen bepflanzte Fläche. „Gurkenfeld“ gibt das landwirtschaftliche Bild natürlich und konkret wieder.
- source_word: προβάσκάινόν
  choice: Vogelscheuche
  rationale: Die überlieferte Form ist lexikalisch schwierig; im Satzgefüge bezeichnet sie am ehesten eine aufgestellte Schreck- oder Wächterfigur im Gurkenfeld. „Vogelscheuche“ ergibt zusammen mit dem Partizip φυλάσσον den naheliegenden Vergleich, ohne die Unsicherheit zu verschweigen.
- source_word: οὐδὲν φυλάσσον
  choice: nichts bewacht
  rationale: 'φυλάσσω bedeutet „bewachen“ oder „Wache halten“. Das Neutrum οὐδέν wird als Objekt aufgefasst: Die aufgestellte Figur vermag nichts wirklich zu bewachen.'
- source_word: θεοὶ
  choice: Götter
  rationale: Der griechische Text nennt sie ausdrücklich „Götter“. Diese polemische Bezeichnung bleibt erhalten; „Götzen“ wäre bereits eine interpretierende Ersetzung.
- source_word: ξύλινοι
  choice: aus Holz
  rationale: Die natürliche deutsche Formulierung bezeichnet eindeutig das Material und bewahrt die entlarvende Wirkung der Aussage.
- source_word: περίχρυσοι καὶ περιάργυροι
  choice: mit Gold und Silber überzogen
  rationale: Die beiden zusammengesetzten Adjektive bezeichnen keine Gegenstände aus massivem Edelmetall, sondern eine äußere Bedeckung mit Gold beziehungsweise Silber. Die zusammengezogene deutsche Form ist klar und wahrt den Parallelismus.
theological_decisions:
- issue: Wiedergabe von θεοὶ im Zusammenhang der Götzenpolemik
  choice: Götter
  alternative: Götzen
  rationale: Die Bezeichnung „Götter“ bewahrt die Rhetorik des Ausgangstextes, der den Anspruch dieser Figuren auf Göttlichkeit durch den anschließenden Hinweis auf ihr Material verspottet. „Götzen“ würde diese Schlussfolgerung schon in das Substantiv eintragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der knappe Vergleich und der polemische Ton bleiben erhalten; die schwer verständliche griechische Form wird im Haupttext sinnvoll wiedergegeben und in der Fußnote transparent als unsicher gekennzeichnet.
