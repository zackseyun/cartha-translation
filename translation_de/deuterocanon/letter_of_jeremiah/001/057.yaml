  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/057.yaml
  text: From them the strong will strip away the gold and the silver[a], and they will go off with the clothing that is wrapped around them[b]; yet they certainly will not help themselves.
translation:
  language: de
  text: Von ihnen werden die Mächtigen das Gold und das Silber abnehmen und mit den Kleidern, die ihnen umgelegt sind, davonziehen; doch die Götzenbilder selbst werden sich gewiss nicht helfen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ ἰσχύοντες
  choice: die Starken
  rationale: Das substantivierte Partizip bezeichnet Menschen, die über Stärke oder Macht verfügen. »Die Starken« ist knapp und bewahrt diese Offenheit.
- source_word: περιελοῦνται
  choice: abnehmen
  rationale: Das Verb bezeichnet hier das Entfernen dessen, was sich an oder um den Götzenbildern befindet. »Abnehmen« ist im Deutschen konkret und natürlich, ohne den Vorgang unnötig auszumalen.
- source_word: τὸ χρυσίον καὶ τὸ ἀργύριον
  choice: das Gold und das Silber
  rationale: Die bestimmten Artikel und beide Metalle werden ohne einen im Griechischen nicht ausgedrückten Possessivzusatz wiedergegeben.
- source_word: τὸν ἱματισμὸν τὸν περικείμενον αὐτοῖς
  choice: die Kleider, die ihnen angelegt sind
  rationale: ἱματισμός bezeichnet Kleidung, während περικείμενον das Um- oder Anliegen ausdrückt. Die Formulierung passt zu bekleideten Götzenbildern und wahrt das konkrete Bild.
- source_word: ἀπελεύσονται ἔχοντες
  choice: mit … davonziehen
  rationale: Das begleitende Partizip besagt, dass die Plünderer beim Fortgehen die Kleider bei sich haben. »Mit … davonziehen« gibt dies idiomatisch und würdig wieder.
- source_word: οὔτε ἑαυτοῖς οὐ μὴ βοηθήσωσιν
  choice: doch sich selbst werden sie ganz gewiss nicht helfen können
  rationale: Die Häufung der Negationen, besonders οὐ μή, ist nachdrücklich. »Ganz gewiss nicht« bewahrt diese Emphase; »helfen können« bringt im Deutschen die im Kontext ausgesagte völlige Hilflosigkeit natürlich zum Ausdruck.
theological_decisions:
- issue: Bezug des abschließenden Satzteils
  choice: 'Das Reflexivpronomen bezieht sich auf die Götzenbilder: Sie können sich selbst nicht helfen.'
  alternative: Der Satz könnte allgemeiner als Aussage ihrer Hilflosigkeit verstanden werden.
  rationale: ἑαυτοῖς verlangt einen reflexiven Bezug; im Zusammenhang der Schrift steht die Handlungsunfähigkeit der Götzenbilder im Vordergrund. Die Übersetzung bleibt bei dieser grammatisch naheliegenden Aussage, ohne sie dogmatisch auszuweiten.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch in würdigem Ton. Die Satzstruktur folgt dem griechischen Gedankengang, während idiomatische Wendungen wie »mit … davonziehen« ein hölzernes Deutsch vermeiden.
