revisions:
- from: Von ihnen werden die Starken das Gold und das Silber abnehmen und mit den Kleidern, die ihnen angelegt sind, davonziehen; doch sich selbst werden sie ganz gewiss nicht helfen können.[a]
  to: Von ihnen werden die Mächtigen das Gold und das Silber abnehmen und mit den Kleidern, die ihnen umgelegt sind, davonziehen; doch die Götzenbilder selbst werden sich gewiss nicht helfen.
  rationale: Die Revision beseitigt den deutschen Subjektbezugskonflikt im Schlusssatz, ohne eine zusätzliche theologische Aussage einzutragen. Sie entfernt die nicht ausdrücklich vorhandene Modalergänzung »können«, erhält die griechische Nachdrücklichkeit und präzisiert die räumliche Aussage über die Bekleidung. Die Fußnote wird an die geänderte Formulierung und ihre notwendige Referenzklärung angepasst.
