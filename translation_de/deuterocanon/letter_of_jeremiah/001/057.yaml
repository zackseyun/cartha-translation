review_pass:
  verdict: revise
  source_fidelity: Die Übersetzung gibt das Abnehmen von Gold, Silber und Bekleidung sowie das Fortgehen der Plünderer im Wesentlichen zutreffend wieder. Im abschließenden Satzteil verschiebt das Griechische im Kontext jedoch offenbar auf die beraubten Götzenbilder. Das bloße »sie« nach »die Starken« lässt im Deutschen fast zwingend die Plünderer als Subjekt verstehen und widerspricht damit der angegebenen Referenz. Das ergänzte »können« ist zudem nicht im griechischen Wortlaut ausgedrückt; die nachdrückliche Verneinung lässt sich ohne diese Modalergänzung wiedergeben.
  naturalness: »Die Starken« ist möglich, aber »die Mächtigen« klingt im heutigen Standarddeutsch für Personen mit Durchsetzungs- bzw. Gewaltmacht natürlicher. »Kleider, die ihnen angelegt sind« ist verständlich; »die ihnen umgelegt sind« bildet das Umherliegende/Umgelegte von περικείμενον konkreter ab. Die explizite Wiederaufnahme »die Götzenbilder selbst« klärt den im Deutschen sonst missverständlichen Subjektwechsel.
  terminology: Die Bezeichnung »Götzenbilder« wird nur zur notwendigen Referenzklärung ergänzt und entspricht dem unmittelbaren Kontext der Polemik. Gold, Silber und Kleidung bleiben ohne unberechtigten Possessivzusatz. Die emphatische Negation οὐ μή wird mit »gewiss nicht« angemessen wiedergegeben.
  issues:
  - severity: medium
    issue: Mehrdeutiger bzw. im Deutschen fehlgeleiteter Bezug von »sie« im Schlusssatz
    rationale: Nach »die Starken« bezieht sich »sie« im Deutschen regulär auf die Plünderer. Laut Kontext und vorgelegter Auslegungsentscheidung bezeichnet der Schluss dagegen die beraubten Götzenbilder. Eine explizite Benennung ist zur sachlichen Treue erforderlich.
  - severity: low
    issue: Modalverb »können« ist hinzugefügt
    rationale: Die Form βοηθήσωσιν bedeutet »helfen werden/sollen«; die Unfähigkeit ergibt sich kontextuell, wird aber nicht durch ein Modalverb ausgedrückt. Die Emphase von οὐ μή kann direkt wiedergegeben werden.
  - severity: low
    issue: »angelegt« schwächt die räumliche Nuance von περικείμενον
    rationale: περικείμενον bezeichnet etwas, das um jemanden herum bzw. auf jemanden gelegt ist. »Umgelegt« bewahrt dieses Bild etwas genauer.
  revised_text: Von ihnen werden die Mächtigen das Gold und das Silber abnehmen und mit den Kleidern, die ihnen umgelegt sind, davonziehen; doch die Götzenbilder selbst werden sich gewiss nicht helfen.
  revised_footnotes:
