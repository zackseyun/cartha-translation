    text: 'Die griechische Verneinung ist nachdrücklich: »werden sich gewiss nicht helfen«. Der Schlusssatz bezieht sich im Kontext auf die Götzenbilder.'
    reason: Erklärt sowohl die Emphase von οὐ μή als auch den im Deutschen ausdrücklich gemachten, im Kontext erschließbaren Subjektwechsel.
