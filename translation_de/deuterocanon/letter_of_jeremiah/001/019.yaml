  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/019.yaml
  text: They are indeed like a beam from a house[a], but they say that their hearts are licked away; while the creeping things from the ground devour them and their clothing, they do not perceive it.
translation:
  language: de
  text: Sie sind zwar wie ein Balken aus einem Haus, doch heißt es, ihre Herzen[a] würden weggeleckt. Während Kriechtiere vom Erdboden sie selbst und ihre Kleidung auffressen, merken sie nichts davon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: ihr Inneres. Im Griechischen steht wörtlich „ihre Herzen“; damit bleibt das spöttisch vermenschlichende Bild erhalten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δοκός
  choice: Balken
  rationale: Das Wort bezeichnet hier ein bearbeitetes, als Bauteil verwendetes Holzstück; „Balken“ bewahrt den Vergleich mit einem Bestandteil des Hauses.
- source_word: καρδίας
  choice: Herzen
  rationale: Die konkrete Wiedergabe erhält die spöttische Vermenschlichung der hölzernen Götzen; zugleich kann das Wort in diesem Zusammenhang auf ihr Inneres zielen.
- source_word: ἐκλείχεσθαι
  choice: würden weggeleckt
  rationale: Die Form beruht auf dem Verb für „lecken“. „Weggeleckt“ gibt das anschauliche Bild wieder, ohne es durch „abgenagt“ erklärend umzudeuten.
- source_word: ἑρπετῶν
  choice: Kriechtiere
  rationale: Der Ausdruck bezeichnet allgemein am Boden kriechende Lebewesen und ist nicht auf Reptilien im modernen zoologischen Sinn beschränkt.
- source_word: κατεσθιόντων
  choice: auffressen
  rationale: Das Verb beschreibt kräftiges oder vollständiges Verzehren; „auffressen“ wirkt im Zusammenhang mit Ungeziefer natürlich und anschaulich.
- source_word: ἱματισμόν
  choice: Kleidung
  rationale: „Kleidung“ ist eine klare, moderne Wiedergabe für die Gewänder, mit denen die Götzen bedeckt sind.
- source_word: οὐκ αἰσθάνονται
  choice: merken sie nichts davon
  rationale: Die Formulierung bringt die fehlende Wahrnehmungsfähigkeit der Götzen in natürlichem Deutsch zum Ausdruck.
theological_decisions:
- issue: Bezug des abschließenden Verbs und der Pronomen
  choice: 'Die Götzen bleiben die Bezugsgröße: Kriechtiere fressen sie und ihre Kleidung, ohne dass sie es merken.'
  alternative: Ein Teil der Aussage könnte auf die Verehrer bezogen werden, besonders das unbestimmte „heißt es“ für φασίν.
  rationale: Die nächsten grammatischen Bezüge der Pronomen und des Schlussverbs sind die Götzen; auch der Zusammenhang verspottet gerade ihre Empfindungslosigkeit.
- issue: Wiedergabe der verzehrten „Herzen“
  choice: Das anthropomorphe Bild „Herzen“ bleibt im Haupttext erhalten.
  alternative: Deutende Wiedergabe als „Inneres“ oder „Innenleben“.
  rationale: Die körperhafte Sprache für Holzfiguren trägt die Ironie des Verses. Eine rein deutende Übersetzung würde diese Spannung glätten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Zwar … doch“ bildet die griechische Gegenüberstellung ab; „heißt es“ gibt das unbestimmte φασίν wieder, ohne ausdrücklich Verehrer als Subjekt einzuführen.
