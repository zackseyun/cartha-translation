  language: de
  text: Und auch die, die sie angefertigt haben, werden keineswegs lange leben.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αὐτοί τε
  choice: Und auch die
  rationale: αὐτοί hebt die Hersteller selbst hervor; τε bindet den Satz an den vorherigen Gedankengang an. Die Kombination „Und auch die“ gibt beides in natürlichem Deutsch wieder.
- source_word: οἱ κατασκευάσαντες
  choice: die … angefertigt haben
  rationale: Das substantivierte Aoristpartizip bezeichnet diejenigen, die die Götzenbilder hergestellt haben. „Angefertigt“ passt zu handwerklich geschaffenen Gegenständen und klingt im modernen Standarddeutsch natürlich.
- source_word: αὐτά
  choice: sie
  rationale: Das Pronomen verweist auf die im Kontext genannten Götzenbilder; im Deutschen ist der Bezug durch „sie“ knapp und verständlich.
- source_word: οὐ μὴ γένωνται
  choice: werden keineswegs … leben
  rationale: οὐ μή mit dem Konjunktiv drückt eine nachdrückliche Verneinung aus. Zusammen mit πολυχρόνιοι wird die griechische Wendung idiomatisch als sichere Verneinung langen Lebens wiedergegeben.
- source_word: πολυχρόνιοι
  choice: lange leben
  rationale: Das Prädikatsadjektiv bedeutet „langlebig“ beziehungsweise „lange lebend“. Bei Menschen ist „lange leben“ die natürlichste deutsche Formulierung.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die emphatische Verneinung bleibt durch „keineswegs“ erhalten; die Formulierung vermeidet unnötig gehobenes oder altertümliches Vokabular.
