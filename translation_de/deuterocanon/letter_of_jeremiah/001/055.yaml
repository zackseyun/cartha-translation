- source_word: οὐ μὴ ἀντιστῶσιν
  choice: werden sie keinesfalls widerstehen
  rationale: Die emphatische Verneinung οὐ μή wird mit „keinesfalls“ wiedergegeben; der Aoristkonjunktiv hat in dieser Konstruktion entschieden futurischen Sinn.
theological_decisions:
- issue: Unausgesprochenes Subjekt
  choice: „sie“ beibehalten, ohne die Götzen im Vers ausdrücklich neu zu benennen
  alternative: „diese Götter“
  rationale: Das griechische Verb enthält nur das aus dem Kontext erschließbare Subjekt. Die pronominale Wiedergabe wahrt die knappe Kohäsion des Ausgangstextes.
translation_notes:
  register: Knappes, würdiges Standarddeutsch. „Doch“ bildet den adversativen Anschluss ab; „widerstehen“ bewahrt die direkte Aussage über die völlige Machtlosigkeit der zuvor genannten Götzen.
