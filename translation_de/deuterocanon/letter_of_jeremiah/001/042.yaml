translation:
  language: de
  text: Die Frauen aber sitzen auf den Straßen, mit Schnüren um sich[a], und verbrennen Kleie[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „nachdem sie Schnüre um sich gelegt haben“ beziehungsweise „mit umgelegten Schnüren“. Der griechische Text erklärt nicht, welche symbolische Bedeutung die Schnüre haben.'
    reason: lexical_alternative
  - marker: b
    text: Das griechische Verb bezeichnet Räuchern beziehungsweise das Erzeugen von Rauch; es steht hier mit „Kleie“ als Objekt, nicht mit dem üblichen Wort für Weihrauch. Das entsprechende griechische Partizip steht auffällig im Singular, obwohl von mehreren Frauen die Rede ist.
    reason: cultural_and_textual_note
lexical_decisions:
- source_word: περιθέμεναι
  choice: um sich gelegt
  rationale: Das mediale Partizip bezeichnet, dass die Frauen die Schnüre um sich gelegt haben. Die Formulierung wahrt den reflexiven Sinn, ohne eine im Text nicht erklärte rituelle Bedeutung festzulegen.
- source_word: σχοινία
  choice: Schnüre
  rationale: Das Wort bezeichnet Schnüre oder Seile. „Schnüre“ ist hier neutral und legt weder ihre Stärke noch ihre kultische Funktion näher fest.
- source_word: ἐν ταῖς ὁδοῖς
  choice: auf den Straßen
  rationale: Im öffentlichen beziehungsweise städtischen Zusammenhang ist „auf den Straßen“ die natürliche deutsche Entsprechung.
- source_word: ἐγκάθηνται
  choice: sitzen
  rationale: Die Verbform beschreibt, dass die Frauen dort sitzen; das schlichte Präsens entspricht dem fortlaufenden beschreibenden Stil.
- source_word: θυμιῶσα
  choice: verbrennen … als Räucherwerk
  rationale: θυμιάω bezeichnet das Erzeugen von Rauch, besonders durch Räuchern. Die Wendung gibt diese Funktion wieder, ohne Kleie mit gewöhnlichem Weihrauch gleichzusetzen. Der griechische Singular steht grammatisch auffällig neben dem pluralischen Subjekt und wird für einen verständlichen deutschen Satz sinngemäß pluralisch wiedergegeben.
- source_word: τὰ πίτυρα
  choice: Kleie
  rationale: πίτυρα bedeutet gewöhnlich „Kleie“; „Spreu“ würde ein anderes Nebenprodukt des Getreides bezeichnen.
theological_decisions:
- issue: Bedeutung der Schnüre und der beschriebenen Handlung
  choice: Die sichtbaren Handlungen werden beschrieben, ohne ihnen eine bestimmte kultische oder sexuelle Symbolik zuzuschreiben.
  alternative: Die Schnüre und das Sitzen auf den Straßen könnten als Bestandteile eines bestimmten Fruchtbarkeits- oder Kultbrauchs gedeutet werden.
  rationale: Der griechische Text nennt die Handlungen, erklärt aber ihre symbolische Bedeutung nicht. Eine genauere kultische Deutung würde über den Wortlaut hinausgehen.
- issue: Grammatische Spannung beim Räuchern
  choice: Das singularische θυμιῶσα wird im Haupttext entsprechend dem pluralischen Subjekt idiomatisch auf alle Frauen bezogen; die Unregelmäßigkeit wird in der Fußnote offengelegt.
  alternative: 'Wörtlich könnte man abrupt formulieren: „… während eine Kleie räuchert“, doch der Text kennzeichnet keinen Wechsel zu einer einzelnen Frau.'
  rationale: Der überlieferte griechische Wortlaut weist einen Numeruswechsel auf. Die Übersetzung soll lesbar bleiben, ohne diese quellenkritisch relevante Spannung zu verschweigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung bleibt anschaulich und nah am griechischen Ablauf. „Als Räucherwerk“ verdeutlicht die Funktion des Verbrennens, ohne Kleie als regulären Weihrauch auszugeben; beide sachlichen Unsicherheiten werden in den Fußnoten offengelegt.
