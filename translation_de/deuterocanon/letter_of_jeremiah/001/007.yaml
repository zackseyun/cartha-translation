base_translation:
  language: en
  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/007.yaml
  text: For their tongue has been scraped by a craftsman[a], and they are overlaid with gold and silver[b], but they are false and cannot speak.
translation:
  language: de
  text: Denn ihre Zunge ist von einem Handwerker zurechtgeschabt worden[a]; sie selbst sind mit Gold und Silber überzogen. Doch sie sind Trug[b] und können nicht sprechen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ist von einem Handwerker geglättet/geschnitzt worden“. Das griechische Verb hebt die schabende oder glättende Arbeit des Handwerkers am Götzenbild hervor.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „sie sind falsch“ oder „sie sind Lügen“. Das griechische Wort kann die Götzen als falsche Dinge oder als Verkörperungen der Falschheit bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: Γλῶσσα
  choice: Zunge
  rationale: Gemeint ist die körperliche Zunge; der abschließende Hinweis, dass die Götzen nicht sprechen können, bestätigt dieses konkrete Bild.
- source_word: κατεξυσμένη
  choice: abgeschabt worden
  rationale: Das Perfektpartizip bezeichnet die am Werkstück ausgeführte Arbeit des Schabens beziehungsweise Glättens. „Abgeschabt“ bewahrt den konkreten handwerklichen Vorgang, ohne die Glättung ausdrücklich hinzuzufügen.
- source_word: ὑπὸ τέκτονος
  choice: von einem Handwerker
  rationale: τέκτων bezeichnet hier allgemein den Hersteller des Götzenbildes; eine Festlegung auf einen Zimmermann wäre unnötig eng.
- source_word: περίχρυσα καὶ περιάργυρα
  choice: mit Gold und Silber überzogen
  rationale: Die beiden Adjektive beschreiben eine äußere Bedeckung mit Gold und Silber. Die gemeinsame Formulierung ist im Deutschen natürlich und erhält die materielle Aussage.
- source_word: ψευδῆ
  choice: Trug
  rationale: Das substantivisch gebrauchte „Trug“ gibt das prädikative Neutrum Plural als Charakterisierung der Götzen wieder und lässt offen, ob sie als falsche Dinge oder als Verkörperungen der Lüge bezeichnet werden.
- source_word: οὐ δύνανται λαλεῖν
  choice: können nicht sprechen
  rationale: Dies ist eine unmittelbare, idiomatische Wiedergabe der Unfähigkeit zu sprechen und bildet den pointierten Gegensatz zur gefertigten Zunge.
theological_decisions:
- issue: Bedeutung von ψευδῆ als Prädikat der Götzen
  choice: sie sind Trug
  alternative: sie sind falsch; sie sind Lügen
  rationale: „Trug“ erhält die scharfe Verwerfung der Götzen und zugleich die griechische Offenheit zwischen falschen Gegenständen und Verkörperungen der Falschheit, ohne eine genauere metaphysische Deutung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit konkreter handwerklicher Bildsprache. Der Semikolon- und Satzrhythmus bewahrt die Abfolge von Herstellung, äußerer Pracht und abschließendem polemischem Gegensatz.
