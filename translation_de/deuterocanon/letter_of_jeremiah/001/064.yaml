translation:
  language: de
  text: Da ihr also wisst, dass sie keine Götter sind, fürchtet euch nicht vor ihnen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γνόντες
  choice: da ihr wisst
  rationale: Das Aoristpartizip von γινώσκω ist hier begleitend und wahrscheinlich begründend gebraucht. „Da ihr wisst“ gibt diesen Zusammenhang in natürlichem Deutsch wieder, ohne einen im Griechischen nicht ausdrücklich markierten zeitlichen Ablauf zu betonen.
- source_word: οὖν
  choice: also
  rationale: Die Folgerung aus der vorausgehenden Beweisführung wird im modernen Deutschen klar und idiomatisch mit „also“ ausgedrückt.
- source_word: οὐκ εἰσὶν θεοί
  choice: sie keine Götter sind
  rationale: „Keine Götter“ entspricht der verneinten Prädikatsaussage und klingt im Deutschen natürlicher als „nicht Götter“, ohne den polemischen Sinn gegen die Götzen abzuschwächen.
- source_word: μὴ φοβῆσθε
  choice: fürchtet euch nicht
  rationale: Die verneinte Imperativform wird direkt und würdevoll wiedergegeben; zusammen mit „vor ihnen“ ist dies die natürliche deutsche Konstruktion.
- source_word: αὐτούς
  choice: ihnen
  rationale: Das Pronomen verweist auf die zuvor behandelten Götzen. Die pronominale Wiedergabe bewahrt den griechischen Wortlaut, ohne im Haupttext eine erklärende Bezeichnung einzufügen.
theological_decisions:
- issue: Wiedergabe von θεοί im Kontext der Götzenkritik
  choice: Götter
  alternative: göttliche Wesen
  rationale: Der Text bestreitet den Götzen den Anspruch, Götter zu sein. „Götter“ entspricht θεοί unmittelbar und bewahrt die Schärfe der Aussage, ohne eine zusätzliche ontologische Deutung einzutragen.
translation_notes:
  register: Modernes, klares Standarddeutsch mit würdigem biblischem Ton. Die Anrede im Plural und die knappe Aufforderung bleiben erhalten; auf eine Fußnote wurde verzichtet, da „keine Götter“ die griechische Aussage im Deutschen direkt und eindeutig wiedergibt.
