  text: Wild animals are better than they are[a], because they can escape into shelter and help themselves.
translation:
  language: de
  text: Die wilden Tiere sind ihnen überlegen, denn sie können in einen Unterschlupf entkommen und sich selbst helfen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰ θηρία
  choice: die wilden Tiere
  rationale: θηρία bezeichnet gewöhnlich wilde Tiere beziehungsweise Tiere außerhalb menschlicher Obhut; die Formulierung ist modern und wahrt den Kontrast zu den Götzenbildern.
- source_word: κρείττω αὐτῶν
  choice: sind ihnen überlegen
  rationale: κρείττων bezeichnet hier praktische Überlegenheit, nicht moralische Güte. „Ihnen“ verweist im Zusammenhang auf die zuvor behandelten Götzenbilder.
- source_word: ἃ δύνανται
  choice: denn sie können
  rationale: Der Relativsatz begründet die behauptete Überlegenheit; „denn“ gibt diese erklärende Funktion natürlich wieder.
- source_word: ἐκφυγόντα εἰς σκέπην
  choice: fliehen, Schutz suchen
  rationale: Der überlieferte griechische Wortlaut ist syntaktisch auffällig; sinngemäß können die Tiere einer Gefahr entkommen und sich an einen geschützten Ort begeben. Die deutsche Formulierung bewahrt beide Aspekte, ohne die Unebenheit nachzuahmen.
- source_word: αὐτὰ ὠφελῆσαι
  choice: sich selbst helfen
  rationale: 'Das Pronomen wird reflexiv verstanden: Anders als die Götzenbilder können Tiere zu ihrem eigenen Nutzen beziehungsweise ihrer eigenen Rettung handeln.'
theological_decisions:
- issue: Bezugswort von αὐτῶν im Vergleich
  choice: „ihnen“ mit Bezug auf die Götzenbilder des Zusammenhangs
  alternative: 'Wörtlich und ohne im Vers selbst genanntes Bezugswort: „besser als sie“'
  rationale: Der Zusammenhang setzt die Götzenbilder eindeutig als Vergleichsgröße voraus. Das deutsche Pronomen lässt diesen Rückbezug bestehen, ohne das Substantiv ergänzend in den Haupttext einzufügen.
- issue: Sinn von ὠφελῆσαι
  choice: praktische Selbsthilfe beziehungsweise Selbsterhaltung
  alternative: allgemein „sich selbst nützen“
  rationale: Im Kontext besteht die Überlegenheit der Tiere darin, dass sie vor Gefahr Schutz finden können; daraus folgt kein weitergehender theologischer Anspruch.
translation_notes:
  register: Natürliches, gegenwärtiges Standarddeutsch in würdig-knapper Form. Die praktische Pointe der Götzensatire bleibt erhalten; die syntaktische Unebenheit des griechischen Textes wird behutsam geglättet.
