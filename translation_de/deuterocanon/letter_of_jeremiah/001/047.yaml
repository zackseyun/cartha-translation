  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/047.yaml
  text: How then can the things made by them endure? For they have left behind lies and disgrace for those who come after[a][b].
translation:
  language: de
  text: Wie sollen denn die von ihnen angefertigten Dinge Bestand haben?[a][b] Denn sie haben denen, die nach ihnen kommen, Lügen und Schande hinterlassen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die von ihnen hergestellten Gegenstände“. Die griechische Form bezeichnet allgemein etwas, das Menschen angefertigt oder zugerichtet haben.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „Wie soll es denn mit den von ihnen angefertigten Dingen weitergehen?“ Der griechische Ausdruck ist knapp und lässt die genaue Ergänzung der zukunftsbezogenen Aussage offen.'
    reason: alternative_reading
lexical_decisions:
- source_word: πῶς τε δὴ
  choice: Wie sollen denn
  rationale: πῶς leitet die rhetorische Frage ein; die Partikeln τε δὴ verleihen ihr folgernden und nachdrücklichen Charakter. „Denn“ gibt diesen Ton im heutigen Deutsch natürlich wieder.
- source_word: μέλλει
  choice: Bestand haben
  rationale: Das Verb bezeichnet hier eine in die Zukunft gerichtete Erwartung oder Aussicht. Da im überlieferten Wortlaut kein ergänzender Infinitiv steht, gibt „Bestand haben“ die im Zusammenhang bestrittene Fortdauer der von Menschen gefertigten Gegenstände idiomatisch wieder, ohne aus ihnen ausdrücklich „Götter“ zu machen.
- source_word: τὰ ὑπʼ αὐτῶν κατασκευασθέντα
  choice: die von ihnen angefertigten Dinge
  rationale: Das substantivierte Partizip bezeichnet von Menschen hergestellte oder zugerichtete Gegenstände. „Dinge“ bewahrt die allgemeine Formulierung des Griechischen; der Zusammenhang weist auf Götzen- oder Kultbilder.
- source_word: κατέλιπον
  choice: sie haben … hinterlassen
  rationale: Das Verb beschreibt, was späteren Menschen als Vermächtnis oder bleibende Folge zurückgelassen wurde.
- source_word: ψεύδη
  choice: Lügen
  rationale: Der Plural bezeichnet Unwahrheiten oder Täuschungen. „Lügen“ ist unmittelbar und entspricht dem polemischen Zusammenhang.
- source_word: ὄνειδος
  choice: Schande
  rationale: Das Wort kann öffentliche Schmach, Beschämung oder Vorwurf bezeichnen. „Schande“ ist knapp, würdig und im Deutschen gut verständlich.
- source_word: τοῖς ἐπιγινομένοις
  choice: denen, die nach ihnen kommen
  rationale: Das substantivierte Partizip meint nachfolgende Menschen beziehungsweise spätere Generationen. Die gewählte Formulierung erhält die zeitliche Offenheit.
theological_decisions:
- issue: Bezug der von Menschen angefertigten Gegenstände
  choice: Die allgemeine Bezeichnung „Dinge“ bleibt im Haupttext erhalten; aus dem Zusammenhang sind Götzen- oder Kultbilder gemeint.
  alternative: „Götzenbilder“ ausdrücklich in den Haupttext einsetzen.
  rationale: Der weitere Zusammenhang handelt von Götzenbildern, doch der griechische Vers verwendet hier eine allgemeine substantivierte Partizipialform. Die Übersetzung benennt daher nicht mehr, als der Vers selbst sagt.
- issue: Sinn des elliptischen μέλλει
  choice: 'Als rhetorische Frage nach dem Fortbestand wiedergegeben: „Bestand haben“.'
  alternative: 'Zukunftsbezogen: „Wie soll es denn mit den von ihnen angefertigten Dingen weitergehen?“'
  rationale: Der griechische Wortlaut lässt die erwartete Ergänzung unausgesprochen. Die Hauptfassung folgt der im Zusammenhang naheliegenden Frage nach Dauerhaftigkeit, während die Fußnote die sprachliche Offenheit kenntlich macht.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem, polemisch zugespitztem Ton. Die rhetorische Frage bleibt erhalten; weder „Götzen“ noch „Götter“ werden gegen den allgemeinen Wortlaut ausdrücklich in den Haupttext eingefügt.
