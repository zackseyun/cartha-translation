  terminology: „Bestand haben“, „hinterlassen“, „Lügen“ und „Schande“ passen zum polemischen, aber nicht unnötig verstärkten Register. Es werden weder konfessionelle Deutungen noch zusätzliche Bezeichnungen wie „Götzen“ in den Haupttext eingetragen. Die Fußnoten kennzeichnen sowohl die lexikalische Alternative als auch die elliptische Zukunftsaussage angemessen.
