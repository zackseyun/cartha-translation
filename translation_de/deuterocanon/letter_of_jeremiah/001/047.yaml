review_pass:
  verdict: approve
  source_fidelity: 'Die Übersetzung gibt die rhetorische Frage πῶς τε δὴ angemessen wieder. „Wie sollen denn ... Bestand haben?“ überträgt die zukunftsbezogene, im Griechischen elliptische Aussage von μέλλει idiomatisch und ohne die im Kontext naheliegende Dauerhaftigkeitsfrage übermäßig zu spezifizieren. τὰ ὑπʼ αὐτῶν κατασκευασθέντα bleibt mit „die von ihnen angefertigten Dinge“ bewusst allgemein. Der zweite Satz trifft κατέλιπον, ψεύδη, ὄνειδος und τοῖς ἐπιγινομένοις vollständig und in der richtigen Beziehung: Als bleibendes Erbe für Nachkommende hinterließen sie Lügen und Schande.'
