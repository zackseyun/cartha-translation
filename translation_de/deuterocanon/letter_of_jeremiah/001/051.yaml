lexical_decisions:
- source_word: Τίνι
  choice: Wem
  rationale: Der Dativ des Fragepronomens wird unmittelbar mit „wem“ wiedergegeben und bewahrt die unpersönliche griechische Konstruktion.
- source_word: οὖν
  choice: also
  rationale: „Also“ gibt den folgernden beziehungsweise fortführenden Zusammenhang wieder, ohne ihn stärker als nötig als zwingende Schlussfolgerung zu markieren.
- source_word: γνωστὸν ἐστὶν
  choice: ist bekannt
  rationale: Die unpersönliche Wendung bedeutet unmittelbar „ist bekannt“. Die im Deutschen etwas auffällige Form bleibt verständlich und spiegelt die griechische Syntax.
- source_word: ὅτι
  choice: dass
  rationale: „Dass“ leitet wie ὅτι den Inhalt dessen ein, was bekannt ist.
- source_word: οὐκ εἰσὶν
  choice: sie … keine … sind
  rationale: In Verbindung mit dem prädikativen Substantiv θεοί wird die verneinte Kopula im Deutschen natürlich mit „keine Götter sind“ ausgedrückt, ohne eine zusätzliche Aussage über ihre Existenz einzutragen.
- source_word: θεοί
  choice: Götter
  rationale: Im Zusammenhang der Götzenpolemik ist „Götter“ die direkte und allgemein verständliche Wiedergabe.
theological_decisions:
- issue: Formulierung der Götzenpolemik
  choice: dass sie keine Götter sind
  alternative: dass sie nicht Götter sind
  rationale: „Keine Götter“ ist die natürliche deutsche Form der griechischen Aussage οὐκ εἰσὶν θεοί. Sie bestreitet ihren Götterstatus, ohne die Aussage zu einer Behauptung auszuweiten, dass die dargestellten Gegenstände überhaupt nicht existierten.
translation_notes:
  register: Gehobenes, aber gegenwärtiges Standarddeutsch. Die leicht markierte Frageform „Wem ist … bekannt?“ bewahrt bewusst die unpersönliche Struktur des Griechischen; die Fußnote bietet die geläufigere deutsche Ausdrucksweise.
