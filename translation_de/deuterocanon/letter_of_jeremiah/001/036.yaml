translation:
  language: de
  text: Einen blinden Menschen können sie keinesfalls zum Sehen bringen[a]; ebenso wenig können sie einen Menschen retten, der in Not ist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „einen Blinden sehen machen“. Die griechische Wendung ist knapp; wörtlich lässt sie sich nicht ohne Weiteres ins Deutsche übertragen und kann allgemein das Bewirken des Sehens bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄνθρωπον τυφλὸν
  choice: einen blinden Menschen
  rationale: ἄνθρωπος bezeichnet hier einen einzelnen Menschen in allgemeiner, stellvertretender Weise. „Mensch“ ist im modernen Deutschen natürlich und gibt den generischen Sinn wieder; τυφλός wird schlicht mit „blind“ wiedergegeben.
- source_word: εἰς ὅρασιν … περιστήσωσιν
  choice: zum Sehen bringen
  rationale: Die ungewöhnlich knappe Verbindung bezeichnet, dass die Götzen einen Blinden nicht in den Zustand des Sehens versetzen können. „Zum Sehen bringen“ bewahrt den Ergebnisbezug, ohne die Formulierung unnötig auf eine bestimmte Art der Heilung festzulegen.
- source_word: οὐ μὴ
  choice: keinesfalls / ebenso wenig können
  rationale: Die doppelte emphatische Verneinung schließt die behauptete Fähigkeit entschieden aus. Im Deutschen vermitteln „keinesfalls“ und die parallele Wendung „ebenso wenig können“ diese Stärke idiomatisch.
- source_word: ἐν ἀνάγκῃ … ὄντα
  choice: der in Not ist
  rationale: ἀνάγκη bezeichnet hier eine bedrängende Notlage. Das Partizip ὄντα wird als natürlicher deutscher Relativsatz wiedergegeben.
- source_word: ἐξέλωνται
  choice: retten
  rationale: Die mediale Form von ἐξαιρέω bedeutet in diesem Zusammenhang, jemanden aus Bedrängnis oder Gefahr herauszuretten.
theological_decisions:
- issue: Aussage über die Unfähigkeit der Götzen
  choice: können sie keinesfalls …; ebenso wenig können sie
  alternative: sie werden gewiss nicht …
  rationale: οὐ μή ist eine emphatische Verneinung. Die Übersetzung bewahrt die uneingeschränkte Unfähigkeit der Götzen, ohne die Aussage unnötig als bloße Zukunftsaussage zu deuten.
- issue: Generischer Singular ἄνθρωπον
  choice: einen … Menschen
  alternative: einen Mann
  rationale: ἄνθρωπος meint hier repräsentativ einen Menschen, nicht ausdrücklich eine männliche Person. Das grammatisch maskuline „einen Menschen“ wahrt den Singular und gibt den allgemeinen Bezug im Deutschen klar wieder.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Satzstruktur und die entschiedene Verneinung tragen den polemischen Ton des Zusammenhangs; die schwerfällige wörtliche Wiedergabe „zum Sehen hinstellen“ wurde zugunsten einer verständlichen, dennoch offenen Formulierung vermieden.
