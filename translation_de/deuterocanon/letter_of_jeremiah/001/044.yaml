  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/044.yaml
  text: Everything that happens to them is false[a]; how then should one suppose or call them gods?
translation:
  language: de
  text: Alles, was mit ihnen geschieht, ist Trug[a]. Wie kann man sie da für Götter halten oder Götter nennen?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „Alles, was ihnen widerfährt, ist falsch.“ Der griechische Ausdruck kann auch das umfassen, was an ihnen oder für sie getan wird. Am Satzende steht ausdrücklich ein Verb des Seins beziehungsweise Existierens; daher ist auch möglich: „Wie kann man da meinen oder sagen, dass sie als Götter existieren?“'
    reason: Die griechischen Formulierungen γενόμενα αὐτοῖς und αὐτοὺς ὑπάρχειν lassen sich im Deutschen unterschiedlich auffassen; die Fußnote bewahrt diese lexikalische und syntaktische Mehrdeutigkeit.
lexical_decisions:
- source_word: πάντα τὰ γενόμενα αὐτοῖς
  choice: Alles, was mit ihnen geschieht
  rationale: Die umfassende und bewusst offene Formulierung gibt wieder, was in Bezug auf die Götzen geschieht, ohne eine handelnde Person oder bestimmte Vorgänge einzutragen.
- source_word: ψευδῆ
  choice: Trug
  rationale: Das prädikative Neutrum Plural kennzeichnet alles Genannte als falsch beziehungsweise trügerisch. „Trug“ ist im Deutschen knapp, würdevoll und inhaltlich weiter als das missverständliche „falsch“ bei Geschehnissen.
- source_word: πῶς οὖν
  choice: Wie … da
  rationale: '„Da“ vermittelt in natürlichem Gegenwartsdeutsch den folgernden Sinn von οὖν: Angesichts des zuvor Festgestellten ist eine solche Einschätzung nicht zu rechtfertigen.'
- source_word: νομιστέον
  choice: kann man sie … für Götter halten
  rationale: Die unpersönliche Verbaladjektivkonstruktion ist als rhetorische Frage wiedergegeben. „Für Götter halten“ bezeichnet die geforderte gedankliche Einschätzung natürlich und präzise.
- source_word: ἢ κλητέον
  choice: oder Götter nennen
  rationale: Die parallele Konstruktion unterscheidet zwischen innerer Einschätzung und Benennung. Die Wiederholung von „Götter“ sorgt im Deutschen für Klarheit.
- source_word: ὡς θεοὺς αὐτοὺς ὑπάρχειν
  choice: sie für Götter halten
  rationale: 'ὑπάρχειν gehört zur indirekten Aussage mit αὐτούς und dem Prädikatsausdruck ὡς θεούς: sie als Götter ansehen beziehungsweise annehmen, dass sie Götter seien. Die idiomatische deutsche Fassung vermeidet eine künstliche zusätzliche Existenzbehauptung, während die Fußnote die griechische Form sichtbar hält.'
theological_decisions:
- issue: Reichweite der Existenzverneinung bei den Götzen
  choice: Der Haupttext bestreitet rhetorisch ihren Anspruch, als Götter zu gelten oder so genannt zu werden.
  alternative: 'Den Schluss ausdrücklich existenziell wiedergeben: „… und annehmen, sie existierten als solche?“'
  rationale: Das griechische ὑπάρχειν ist vorhanden, fungiert hier aber natürlich als Verb der indirekten Aussage zu αὐτούς mit ὡς θεούς. Eine eigenständige Aussage, die Gegenstände existierten überhaupt nicht, wäre stärker als der Kontext verlangt. Die Fußnote bewahrt die formale Existenznuance und die syntaktische Offenheit.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem, allgemein verständlichem Ton. Die rhetorische Schärfe bleibt erhalten; „Trug“ vermeidet eine hölzerne Aussage wie „Geschehnisse sind falsch“. Die beiden griechischen Verbaladjektive werden als natürliche unpersönliche Frage wiedergegeben.
