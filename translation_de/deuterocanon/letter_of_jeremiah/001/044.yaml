review_pass:
  verdict: approve
  source_fidelity: Der Haupttext gibt πάντα τὰ γενόμενα αὐτοῖς angemessen weit als „Alles, was mit ihnen geschieht“ wieder und gibt ψευδῆ mit dem im Deutschen idiomatischen prädikativen „ist Trug“ wieder. Die rhetorische Folgerung von πῶς οὖν sowie die beiden parallelen Verbaladjektive νομιστέον und κλητέον sind in der Frage natürlich und sachgerecht abgebildet. Die Fassung „für Götter halten oder Götter nennen“ vermittelt den Sinn von ὡς θεοὺς αὐτοὺς ὑπάρχειν, ohne eine unhaltbar absolute Behauptung zu erzeugen, die Bildwerke existierten überhaupt nicht.
  naturalness: Flüssiges modernes Standarddeutsch mit angemessen würdigem Register. „Wie kann man sie da …“ ist als rhetorische Frage idiomatisch; „da“ trägt die Schlussfolgerung klar.
  terminology: „Götter“ ist die direkte und registergerechte Wiedergabe von θεούς. „Trug“ ist hier eine vertretbare, prägnante Wiedergabe von ψευδῆ und vermeidet die im Deutschen unnatürliche Aussage, Ereignisse seien schlicht „falsch“.
