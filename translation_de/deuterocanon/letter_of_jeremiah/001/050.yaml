base_translation:
  language: en
  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/050.yaml
  text: For since they are wooden, overlaid with gold and overlaid with silver, it will afterward be known that they are false; to all the nations and to the kings it will be evident that they are not gods but works of human hands, and there is no work of God in them.
translation:
  language: de
  text: Denn weil sie aus Holz sind und mit Gold und Silber überzogen, wird sich später zeigen, dass sie falsch sind. Allen Völkern und den Königen wird offenbar werden, dass sie keine Götter sind, sondern Werke von Menschenhänden, und dass kein Werk Gottes in ihnen ist.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ξύλινα
  choice: aus Holz
  rationale: Gibt die stoffliche Beschaffenheit der Bilder im Deutschen natürlich und genau wieder.
- source_word: περίχρυσα καὶ περιάργυρα
  choice: vergoldet und versilbert
  rationale: Bewahrt die beiden parallelen Aussagen des Griechischen und bezeichnet jeweils einen Überzug, nicht massives Gold oder Silber.
- source_word: ψευδῆ
  choice: Trug
  rationale: Das substantivisch gebrauchte Adjektiv bezeichnet die Bilder als falsch beziehungsweise trügerisch; „Trug“ erhält diese Bedeutungsbreite in knapper, würdiger Form.
- source_word: ἔργα χειρῶν ἀνθρώπων
  choice: Werke von Menschenhänden
  rationale: Nahe Wiedergabe der geläufigen biblischen Wendung bei zugleich verständlichem modernem Deutsch.
- source_word: ἐν αὐτοῖς
  choice: an ihnen
  rationale: Im Zusammenhang mit gefertigten Kultbildern ist „an ihnen“ idiomatischer als „in ihnen“, ohne die Aussage inhaltlich zu verengen.
theological_decisions:
- issue: Aussage über Gottes Wirken an den Bildern
  choice: dass nichts an ihnen Gottes Werk ist
  alternative: dass kein Werk Gottes in ihnen ist
  rationale: Die gewählte Fassung hält die starke Verneinung des griechischen οὐθὲν θεοῦ ἔργον fest, vermeidet aber eine unnötig räumliche Deutung von ἐν αὐτοῖς.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Doppelung „vergoldet und versilbert“ folgt bewusst der parallelen griechischen Formulierung. Die Bezeichnung „Trug“ lässt den Sinn zwischen Falschheit und Täuschung offen.
