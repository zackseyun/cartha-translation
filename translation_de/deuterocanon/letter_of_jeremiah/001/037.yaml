  text: They will never show mercy to a widow[b][a], nor do good to an orphan.
translation:
  language: de
  text: Einer Witwe werden sie niemals Erbarmen zeigen[a] und einer Waise nichts Gutes tun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Einer Witwe werden sie ganz gewiss kein Mitleid erweisen.« Im Griechischen steht eine nachdrückliche Verneinung (οὐ μή).'
    reason: lexical_alternative
lexical_decisions:
- source_word: χήραν
  choice: einer Witwe
  rationale: Der Akkusativ Singular bezeichnet eine Witwe als repräsentative Angehörige einer besonders schutzbedürftigen Gruppe. Im Deutschen steht nach »Erbarmen zeigen« idiomatisch der Dativ.
- source_word: οὐ μὴ ἐλεήσωσιν
  choice: werden sie niemals Erbarmen zeigen
  rationale: οὐ μή mit dem Aorist Konjunktiv drückt eine nachdrückliche Verneinung aus. »niemals Erbarmen zeigen« bewahrt sowohl diese Verstärkung als auch den ethischen Gehalt von ἐλεέω.
- source_word: οὔτε
  choice: und … nichts
  rationale: Die zweite negative Aussage wird im natürlichen Deutschen durch »und … nichts« eng mit der ersten verbunden; sachlich entspricht dies dem griechischen »noch/nor«.
- source_word: ὀρφανῷ
  choice: einer Waise
  rationale: Der Dativ Singular bezeichnet repräsentativ ein verwaistes Kind. »Waise« ist die klare, moderne und geschlechtsneutrale deutsche Entsprechung.
- source_word: εὖ ποιήσουσιν
  choice: nichts Gutes tun
  rationale: εὖ ποιεῖν bedeutet, jemandem Gutes zu tun oder ihn zu unterstützen. Wegen der koordinierten Verneinung wird dies idiomatisch als »nichts Gutes tun« wiedergegeben.
theological_decisions:
- issue: Wiedergabe des sozialethischen Begriffspaars χήρα / ὀρφανός
  choice: Witwe / Waise
  alternative: Witwe / vaterloses Kind
  rationale: Das Begriffspaar steht für besonders schutzbedürftige Menschen. »Witwe / Waise« ist im modernen Deutschen geläufig und bewahrt die biblisch-sozialethische Prägung ohne unnötige Festlegung darauf, dass nur der Vater fehlt.
- issue: Unfähigkeit der Götzen statt moralischer bloßer Unwilligkeit
  choice: Die Aussage bleibt formal als zukünftige Verneinung stehen
  alternative: Sie können weder Erbarmen zeigen noch Gutes tun
  rationale: Der Kontext mag die Unfähigkeit der Götzen voraussetzen, doch der griechische Wortlaut formuliert mit nachdrücklicher zukünftiger Verneinung. Die Übersetzung löst diese Spannung nicht durch das ergänzte Modalverb »können« auf.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die repräsentativen Singularformen des Griechischen bleiben erhalten. Die emphatische Negation wird mit »niemals« markiert; der Parallelismus klingt dabei natürlich und klar.
