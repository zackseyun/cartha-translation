  text: How then can one fail to perceive that they are not gods[b][a], since they neither save themselves from war nor from calamities?
translation:
  language: de
  text: Wie sollte man da nicht erkennen[a], dass sie keine Götter sind, da sie sich weder vor Krieg noch vor Unheil[b] retten?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Wie ist es da nicht möglich zu erkennen …?“ Die griechische rhetorische Verneinung unterstreicht, wie offenkundig die Folgerung ist.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Unglück“, „Not“ oder „Übel“. Das griechische Wort kann sowohl Böses als auch schädliche Ereignisse und Notlagen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πῶς οὖν οὐκ ἔστιν αἰσθέσθαι
  choice: Wie sollte man da nicht erkennen
  rationale: Die natürliche deutsche rhetorische Frage bewahrt die griechische Verneinung und hebt hervor, dass die Schlussfolgerung offenkundig ist. „Erkennen“ gibt αἰσθέσθαι im Sinn von wahrnehmen oder bemerken idiomatisch wieder.
- source_word: ὅτι οὐκ εἰσὶν θεοί
  choice: dass sie keine Götter sind
  rationale: „Keine Götter“ entspricht der polemischen Aussage direkt und klingt im modernen Deutschen natürlicher als „nicht Götter“.
- source_word: οἳ
  choice: da sie
  rationale: Das Relativpronomen leitet hier den begründenden Sachverhalt ein; „da sie“ macht diesen Zusammenhang natürlich verständlich, ohne den Inhalt zu erweitern.
- source_word: οὔτε σώζουσιν ἑαυτοὺς
  choice: sie sich weder … retten können
  rationale: „Sich retten“ bewahrt die Ironie, dass die vermeintlichen Götter nicht einmal sich selbst zu schützen vermögen. Das deutsche Modalverb macht die im Zusammenhang ausgesagte Unfähigkeit idiomatisch deutlich.
- source_word: ἐκ πολέμου
  choice: vor Krieg
  rationale: Bei „sich retten“ bezeichnet „vor“ im Deutschen natürlich die Gefahr, aus der Rettung nötig wäre; πόλεμος wird allgemein als „Krieg“ wiedergegeben.
- source_word: ἐκ κακῶν
  choice: vor Unheil
  rationale: κακά bezeichnet hier schädliche Widerfahrnisse oder Notlagen. „Unheil“ lässt den Ausdruck weit genug und vermeidet eine vorschnelle Beschränkung auf moralisch Böses.
theological_decisions:
- issue: Bezeichnung der verehrten Bilder als θεοί innerhalb der Götzenpolemik
  choice: keine Götter
  alternative: keine göttlichen Wesen; bloße Götzen
  rationale: Die Übersetzung bewahrt die ausdrückliche Behauptung des griechischen Textes, dass sie keine Götter sind, statt θεοί bereits durch eine deutende Bezeichnung zu ersetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Zuspitzung und die polemische Spannung des Ausgangstextes bleiben erhalten; die Formulierung ist zugleich für heutige Leser unmittelbar verständlich.
