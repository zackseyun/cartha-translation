revisions:
- from: Und er hält ein Zepter wie ein Mensch, ein Richter über ein Land, der den, der gegen ihn sündigt, nicht beseitigen kann.[a]
  to: Und er hält ein Zepter wie ein Richter eines Landes, der denjenigen, der gegen ihn sündigt, nicht beseitigen wird.[a]
  rationale: Die Revision bewahrt das Futur des griechischen οὐκ ἀνελεῖ mit „nicht beseitigen wird“ und entfernt die nicht ausdrücklich markierte Modalität „kann“. Die Vergleichsgruppe wird im Deutschen klar und idiomatisch als „wie ein Richter eines Landes“ gefasst. Die Fußnote dokumentiert die lexikalische Spannweite von ἀναιρέω, ohne eine kontextuelle Folgerung als Bedeutung des Verses auszugeben.
