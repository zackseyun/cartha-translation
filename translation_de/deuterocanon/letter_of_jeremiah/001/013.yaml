  text: And he holds a scepter like a man[a], a judge of a country[b], who will not destroy the one who sins against him.
translation:
  language: de
  text: Und er hält ein Zepter wie ein Richter eines Landes, der denjenigen, der gegen ihn sündigt, nicht beseitigen wird.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Verb kann auch „töten“ oder „wegnehmen“ bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: σκήπτρον
  choice: Zepter
  rationale: Bezeichnet einen Stab als Zeichen von Herrschaft oder Amtsgewalt; „Zepter“ bewahrt die königliche und richterliche Symbolik.
- source_word: κριτὴς χώρας
  choice: Richter über ein Land
  rationale: „Richter“ gibt κριτής direkt wieder; „über ein Land“ drückt den Zuständigkeitsbereich idiomatisch aus, ohne χώρας auf eine bestimmte politische Einheit festzulegen.
- source_word: ἀνελεῖ
  choice: beseitigen kann
  rationale: ἀναιρέω kann „wegnehmen“, „beseitigen“ oder „töten“ bedeuten. Im Zusammenhang steht die Unfähigkeit des Götzen im Vordergrund; das im Griechischen formale Futur wird daher als Unvermögen wiedergegeben.
- source_word: τὸν εἰς αὐτὸν ἁμαρτάνοντα
  choice: den, der gegen ihn sündigt
  rationale: Bewahrt den moralisch-religiösen Gehalt von ἁμαρτάνω und die gegen die Person gerichtete Bedeutung von εἰς αὐτόν.
- source_word: ὡς ἄνθρωπος
  choice: wie ein Mensch
  rationale: Gibt den Vergleich geschlechtsneutral und im modernen Deutschen natürlich wieder.
theological_decisions:
- issue: Der Götze trägt das Zeichen menschlicher richterlicher Gewalt, besitzt aber keine tatsächliche Strafmacht.
  choice: Die Rechts- und Herrschaftssymbolik bleibt ausdrücklich erhalten, während „nicht beseitigen kann“ seine Ohnmacht hervorhebt.
  alternative: „wird ... nicht beseitigen“ als rein formale Wiedergabe des Futurs oder „wird ... nicht töten“ mit engerer Bedeutung.
  rationale: Der polemische Kontrast zwischen äußerem Amtszeichen und tatsächlicher Machtlosigkeit bestimmt den Zusammenhang. Die Übersetzung macht diesen pragmatischen Sinn deutlich, ohne die Art der möglichen Strafe unnötig auf Tötung einzuengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am Griechischen; „Richter über ein Land“ ist idiomatischer als „Richter eines Landes“. Die Fußnote bewahrt die formale Futurlesart und die Bedeutungsbreite von ἀναιρέω.
