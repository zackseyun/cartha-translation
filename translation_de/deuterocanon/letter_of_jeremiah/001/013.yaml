  source_fidelity: Die Wiedergabe von σκήπτρον, κριτής, χώρα und der Partizipialgruppe ist grundsätzlich zutreffend. Das griechische Futur οὐκ ἀνελεῖ wird jedoch im Entwurf durch „nicht beseitigen kann“ als Unfähigkeitsmodalität wiedergegeben. Die Ohnmacht des Götzen ist zwar im weiteren Kontext naheliegend, wird in diesem Vers aber nicht durch eine Modalform ausgedrückt und sollte nicht in den Text eingetragen werden.
  naturalness: „wie ein Mensch, ein Richter über ein Land“ ist im Deutschen eine unklare und holprige Apposition. „wie ein Richter eines Landes“ bildet den Vergleich natürlich und eng am griechischen Ausdruck.
  terminology: „Zepter“, „Richter“ und „sündigt“ sind passende, verständliche Begriffe in würdigem modernem Standarddeutsch. „Beseitigen“ kann als bewusst weiter Ausdruck für ἀνελεῖ stehen bleiben, sofern die Futurform erhalten bleibt.
