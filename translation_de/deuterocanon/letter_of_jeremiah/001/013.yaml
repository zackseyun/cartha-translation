    rationale: Die Erklärung, „gemeint ist hier“ die Unfähigkeit zu bestrafen, verengt die textliche Futurbehauptung. Die lexikalische Fußnote sollte die Bandbreite des Verbs erläutern, ohne die Modalität in den Übersetzungstext zurückzulesen.
