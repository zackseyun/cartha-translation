  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/063.yaml
  text: Therefore they are to be regarded neither as gods nor to be called gods, since they are unable either to judge a case or to do good to people.
translation:
  language: de
  text: Daher darf man sie weder für Götter halten noch Götter nennen, denn sie sind weder imstande, Recht zu sprechen, noch den Menschen Gutes zu tun.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅθεν
  choice: Daher
  rationale: Leitet als Folgerung aus dem vorausgehenden Gedankengang die Schlussaussage ein und bewahrt die inferentielle Kraft knapp und natürlich.
- source_word: νομιεῖσθαι
  choice: für Götter halten
  rationale: Gibt das wertende Anerkennen oder Dafürhalten idiomatisch wieder, ohne eine tatsächliche Göttlichkeit vorauszusetzen.
- source_word: κλητέον ὑπάρχειν αὐτοὺς θεούς
  choice: Götter nennen
  rationale: Die Konstruktion bezeichnet, wie sie genannt werden sollen beziehungsweise dürfen; die knappe deutsche Form wahrt den Parallelismus mit »für Götter halten«.
- source_word: οὐ δυνατῶν ὄντων αὐτῶν
  choice: denn sie sind weder imstande
  rationale: Der Genitivus absolutus begründet die Folgerung; »denn« macht diese kausale Beziehung in natürlichem Deutsch deutlich.
- source_word: κρίσιν κρῖναι
  choice: Recht zu sprechen
  rationale: Die figura etymologica bezeichnet die Ausübung richterlicher Entscheidung. »Recht sprechen« erhält den gerichtlichen Sinn und klingt im Deutschen würdig und verständlich.
- source_word: εὖ ποιεῖν
  choice: Gutes zu tun
  rationale: Bewahrt die einfache idiomatische Bedeutung des Wohltuns beziehungsweise Begünstigens.
- source_word: ἀνθρώποις
  choice: den Menschen
  rationale: Bezeichnet Menschen allgemein; die Form ist geschlechtsübergreifend und natürlich.
theological_decisions:
- issue: Bestreitung der Göttlichkeit der Götzen
  choice: weder für Götter halten noch Götter nennen
  alternative: weder als Götter gelten lassen noch Götter heißen
  rationale: Die Übersetzung bewahrt die doppelte Zurückweisung sowohl ihrer Anerkennung als auch ihrer Benennung als Götter, ohne eine weitergehende metaphysische Erklärung in den Text einzutragen.
- issue: Bedeutungsumfang von κρίσιν κρῖναι
  choice: Recht zu sprechen
  alternative: einen Rechtsfall zu entscheiden
  rationale: Der gerichtliche Sinn bleibt erhalten, während offenbleibt, ob ein einzelner Rechtsfall oder die Fähigkeit zum Richten allgemein gemeint ist.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem polemischem Ton. Der parallele Satzbau und die doppelte Negation des Griechischen bleiben erkennbar; unnötig technische oder konfessionell geprägte Begriffe werden vermieden.
