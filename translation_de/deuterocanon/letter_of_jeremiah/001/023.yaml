base_translation:
  language: en
  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/023.yaml
  text: For the gold with which they are adorned for beauty—unless someone wipes off the rust—it will certainly not shine; for not even when they were being cast did they perceive it.
translation:
  language: de
  text: 'Denn das Gold, mit dem man sie zur Zierde überzieht: Wenn niemand den Rost abwischt, werden sie gewiss nicht glänzen; denn selbst als sie gegossen wurden, nahmen sie nichts wahr.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: περιτίθενται εἰς κάλλος
  choice: mit dem man sie zur Zierde überzieht
  rationale: Gibt das passive περιτίθενται und den Zweckausdruck εἰς κάλλος natürlich wieder; gemeint ist das zur Verschönerung angebrachte Gold.
- source_word: ἐκμάξῃ τὸν ἰόν
  choice: den Rost abwischt
  rationale: ἐκμάσσω bezeichnet Ab- oder Wegwischen; ἰός kann Rost bzw. Korrosion bezeichnen. Die konkrete Bildsprache des Ausgangstextes bleibt erhalten.
- source_word: οὐ μὴ στίλψωσιν
  choice: glänzt gewiss nicht
  rationale: Die verstärkte griechische Verneinung οὐ μή wird mit „gewiss nicht“ ausgedrückt; im Deutschen richtet sich der Singular „glänzt“ natürlich nach „das Gold“.
- source_word: ἐχωνεύοντο
  choice: gegossen wurden
  rationale: Das Verb χωνεύω bezeichnet hier die Verarbeitung durch Schmelzen bzw. Gießen; im Zusammenhang mit den Götzenbildern ist „gegossen wurden“ prägnant.
- source_word: ᾐσθάνοντο
  choice: nahmen sie nichts wahr
  rationale: Bewahrt die Aussage mangelnder Wahrnehmungsfähigkeit und damit die Ironie des Verses, ohne sie erklärend auszuweiten.
theological_decisions:
- issue: Unempfindlichkeit der Götzenbilder
  choice: „nahmen sie nichts wahr“ als direkte Aussage beibehalten
  alternative: „spürten sie nichts“ oder eine erklärende Wiedergabe ihrer Leblosigkeit
  rationale: Der Text spricht den Bildern Wahrnehmungsfähigkeit ab. Die direkte Form wahrt die polemische Personifizierung und fügt keine dogmatische Erklärung hinzu.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau wurde gegenüber dem Griechischen leicht geglättet, die begründende Doppelstruktur mit „denn“ jedoch bewahrt. Keine Fußnoten erforderlich.
