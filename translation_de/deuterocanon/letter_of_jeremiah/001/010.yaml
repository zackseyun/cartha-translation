  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/010.yaml
  text: They even give some of their things to the prostitutes on the roof[b][a]. And they adorn them with clothing like human beings—silver gods and gold gods and wooden ones.
translation:
  language: de
  text: 'Sie geben den Prostituierten auf dem Dach[a][b] etwas davon. Sie schmücken sie wie Menschen mit Gewändern: Götter aus Silber, Götter aus Gold und aus Holz.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »davon« oder »von ihnen«; das Pronomen bezieht sich wahrscheinlich auf Gegenstände, die im Zusammenhang zu den Götzen stehen.'
    reason: lexical_alternative
  - marker: b
    text: Manche verstehen die »Prostituierten auf dem Dach« als Prostituierte im Umfeld eines Kultes; ausdrücklich von »Tempelprostituierten« spricht der griechische Text jedoch nicht.
    reason: alternative_reading
lexical_decisions:
- source_word: δώσουσιν
  choice: sie geben
  rationale: Obwohl die Form futurisch ist, beschreibt der Abschnitt typische Handlungen; das deutsche Präsens gibt diese allgemeine Schilderung natürlich wieder.
- source_word: ἀπʼ αὐτῶν
  choice: etwas davon
  rationale: Die knappe Wendung bewahrt den unbestimmten Bezug des Pronomens auf Dinge aus dem Umfeld der Götzen, ohne diese näher zu bestimmen.
- source_word: ταῖς ἐπὶ τοῦ στέγους πόρναις
  choice: den Prostituierten auf dem Dach
  rationale: πόρναι bezeichnet Prostituierte; ἐπὶ τοῦ στέγους wird örtlich und ohne zusätzliche kultische Festlegung wiedergegeben.
- source_word: κοσμοῦσί
  choice: sie schmücken
  rationale: κοσμέω bezeichnet hier das Ausschmücken beziehungsweise Ausstatten der Bildnisse.
- source_word: ὡς ἀνθρώπους
  choice: wie Menschen
  rationale: ἀνθρώπους meint Menschen allgemein und enthält keine Beschränkung auf Männer.
- source_word: τοῖς ἐνδύμασιν
  choice: mit Gewändern
  rationale: Der instrumentale Dativ nennt die Kleidung als Mittel des Schmückens; „Gewänder“ entspricht dem würdigen literarischen Register.
- source_word: θεοὺς ἀργυροῦς καὶ θεοὺς χρυσοῦς καὶ ξυλίνους
  choice: die silbernen, goldenen und hölzernen Götter
  rationale: Die koordinierte deutsche Form ist klar und bewahrt die dreifache Stoffangabe; „Götter“ wird einmal gesetzt, da die griechische Wiederholung im Deutschen schwerfällig wäre.
theological_decisions:
- issue: Mögliche kultische Bedeutung von πόρναι
  choice: Prostituierte
  alternative: Kultprostituierte / Tempelprostituierte
  rationale: Der griechische Text nennt sie lediglich πόρναι und lokalisiert sie auf dem Dach. Eine ausdrückliche Zuordnung zum Tempelkult wäre eine nicht im Wortlaut enthaltene Präzisierung.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem Ton. Der etwas spöttische Gegensatz zwischen menschengleicher Bekleidung und den aus Silber, Gold und Holz bestehenden Göttern bleibt erhalten; unklare Bezüge und die nicht ausdrücklich kultische Bezeichnung der Prostituierten werden nicht vereindeutigt.
