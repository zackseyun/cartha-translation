lexical_decisions:
- source_word: ἔστι δὲ καὶ ὅτε
  choice: Es kommt auch vor, dass
  rationale: Die Wendung bezeichnet einen wiederholt vorkommenden Umstand. Diese Formulierung gibt sowohl καί („auch“) als auch den allgemeinen zeitlichen Sinn idiomatisch wieder.
- source_word: ὑφαιρούμενοι
  choice: wegnehmen
  rationale: Das Partizip bezeichnet ein Wegnehmen und kann Heimlichkeit oder unrechtmäßige Aneignung einschließen. „Wegnehmen“ bleibt nahe am griechischen Wortlaut; die stärkeren möglichen Nuancen werden in der Fußnote genannt.
- source_word: οἱ ἱερεῖς
  choice: die Priester
  rationale: Direkte und natürliche Wiedergabe des bestimmten Subjekts.
- source_word: ἀπὸ τῶν θεῶν αὐτῶν
  choice: von ihren Göttern
  rationale: Die Präposition bezeichnet die Quelle, von der die Wertstoffe entfernt werden. Zugleich bleibt die Ironie erhalten, dass die Priester gerade die von ihnen verehrten Götter berauben.
- source_word: χρυσὸν καὶ ἀργύριον
  choice: Gold und Silber
  rationale: Der griechische Text nennt nur die Materialien und legt nicht fest, ob es sich um Geld, Schmuck oder Verzierungen handelt.
- source_word: εἰς ἑαυτοὺς
  choice: für sich selbst
  rationale: Die Wendung drückt aus, dass der Verbrauch dem eigenen Nutzen der Priester dient.
- source_word: καταναλοῦσιν
  choice: ausgeben
  rationale: Das Verb kann „verbrauchen“, „aufbrauchen“ oder „ausgeben“ bedeuten. Bei Gold und Silber ist „ausgeben“ im Deutschen klar und idiomatisch, ohne die genaue Form der Wertgegenstände festzulegen.
theological_decisions:
- issue: Darstellung des Fehlverhaltens der Priester gegenüber den Götzen
  choice: Die Priester nehmen den Göttern Wertstoffe weg und geben sie für sich selbst aus.
  alternative: Das Partizip könnte ausdrücklich mit „stehlen“ oder „heimlich entwenden“ wiedergegeben werden.
  rationale: Die Übersetzung bewahrt die satirische Aussage über die Ohnmacht der Götzen und die Selbstsucht ihrer Priester, ohne die im Partizip liegende mögliche kriminelle oder heimliche Nuance im Haupttext zwingend festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz bleibt wegen des nachfolgenden Kommas als Teil eines größeren Satzgefüges offen. Die knappe Formulierung wahrt die polemische Ironie des Ausgangstextes.
