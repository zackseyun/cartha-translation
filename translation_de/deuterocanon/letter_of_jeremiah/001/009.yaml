  text: And there are times when the priests[a], taking gold and silver from their gods, spend it on themselves,
translation:
  language: de
  text: Es kommt auch vor, dass die Priester Gold und Silber von ihren Göttern wegnehmen[a] und für sich selbst ausgeben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „heimlich entwenden“ oder „stehlen“.'
