base_translation:
  language: en
  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/014.yaml
  text: In his right hand he holds a dagger and an axe[a], but he cannot rescue himself from war and robbers. Therefore it is evident that they are not gods[b]; so do not fear them.
translation:
  language: de
  text: In seiner rechten Hand hält er einen Dolch[a] und eine Axt; doch sich selbst kann er nicht vor Krieg und Räubern[b] retten. Daran ist zu erkennen, dass sie keine Götter sind. Fürchtet sie also nicht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Kurzschwert“. Das griechische Wort bezeichnet eine in der Hand geführte Waffe.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Banditen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγχειρίδιον
  choice: Dolch
  rationale: Das Wort bezeichnet eine in der Hand geführte Waffe, meist einen Dolch oder ein Kurzschwert. „Dolch“ ist im Deutschen natürlich und passt zur Verbindung mit der Axt.
- source_word: δεξιᾷ
  choice: in seiner rechten Hand
  rationale: Der Dativ bezeichnet hier bei ἔχει den Ort beziehungsweise die Art des Haltens; die gewählte Formulierung ist idiomatisches Deutsch.
- source_word: πέλεκυν
  choice: Axt
  rationale: „Axt“ gibt die gewöhnliche Bedeutung des griechischen Wortes wieder, ohne die nicht gesicherte Einschränkung auf ein kleineres Beil.
- source_word: ἐξελεῖται
  choice: kann er … retten
  rationale: Das Futur in Verbindung mit ἑαυτόν bezeichnet, dass das Götzenbild sich selbst nicht aus der Gefahr befreien kann. Die deutsche Modalformulierung gibt die faktische Unfähigkeit im Kontext natürlich wieder.
- source_word: λῃστῶν
  choice: Räubern
  rationale: Das Wort kann Räuber oder gewalttätige Banden bezeichnen. „Räuber“ ist die breite, geläufige Wiedergabe; „Banditen“ bleibt als mögliche Nuance in der Fußnote erhalten.
- source_word: ὅθεν
  choice: Daran
  rationale: Das Adverb leitet eine Folgerung aus der zuvor beschriebenen Hilflosigkeit des Götzenbildes ein. „Daran ist zu erkennen“ bildet diesen begründenden Rückbezug natürlich ab.
- source_word: γνῶριμοί εἰσιν οὐκ ὄντες θεοί
  choice: ist zu erkennen, dass sie keine Götter sind
  rationale: Die Formulierung bewahrt den Erkenntnischarakter von γνῶριμοί und gibt die partizipiale Aussage in verständlichem, idiomatischem Deutsch wieder.
- source_word: μὴ οὖν φοβηθῆτε αὐτούς
  choice: Fürchtet sie also nicht
  rationale: Die Formulierung erhält sowohl den folgernden Anschluss von οὖν als auch die auffordernde Kraft des Verbots.
theological_decisions:
- issue: Numeruswechsel von der Beschreibung eines einzelnen Götzenbildes zur Folgerung über mehrere
  choice: In der Beschreibung bleibt der Singular („er“, „sich selbst“) erhalten; in Folgerung und Aufforderung steht wie im Griechischen der Plural („sie“).
  alternative: Den gesamten Vers zur stilistischen Glättung in den Plural setzen.
  rationale: Der griechische Text beschreibt zunächst ein einzelnes, stellvertretendes Götzenbild und wendet die Schlussfolgerung dann auf alle solchen Bilder an. Der Numeruswechsel gehört zur Argumentation und wird deshalb nicht eingeebnet.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierung bleibt nahe an der griechischen Gedankenfolge, ohne unnatürliche Satzstrukturen zu übernehmen. Die Waffen in der Hand des Götzenbildes werden konkret benannt, während seine tatsächliche Hilflosigkeit durch den Gegensatz „doch“ hervorgehoben wird.
