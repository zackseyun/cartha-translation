  text: They touch their sacrifices while sitting apart and lying with women. Therefore[a], knowing from these things that they are not gods, do not fear them.
translation:
  language: de
  text: Frauen, die abgesondert sitzen, und Wöchnerinnen berühren ihre Opfergaben. Erkennt also daran, dass sie keine Götter sind, und fürchtet euch nicht vor ihnen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκαθημένη
  choice: eine Frau, die abgesondert sitzt
  rationale: Das substantivisch gebrauchte feminine Partizip bezeichnet wörtlich eine Frau, die abseits beziehungsweise abgesondert sitzt. Wahrscheinlich klingt rituelle Absonderung an; die Übersetzung bewahrt jedoch das konkrete Bild und legt den genauen Anlass nicht fest.
- source_word: λεχώ
  choice: eine Wöchnerin
  rationale: Das feminine Substantiv bezeichnet gewöhnlich eine Frau im Kindbett. „Wöchnerin“ gibt diesen Sinn im heutigen Deutsch knapp und verständlich wieder.
- source_word: ἅπτονται
  choice: berühren
  rationale: Das Verb bedeutet hier, etwas anzurühren oder zu berühren; mit dem Genitiv τῶν θυσιῶν bezeichnet es den Kontakt mit den Opfergaben.
- source_word: γνόντες
  choice: Erkennt
  rationale: Das aoristische Partizip fordert dazu auf, aus den genannten Beobachtungen eine Schlussfolgerung zu ziehen. Die koordinierte Imperativform ist im Deutschen natürlich und erhält den folgernden Sinn.
- source_word: θεοί
  choice: Götter
  rationale: Dies ist die unmittelbare und kontextgemäße Wiedergabe im gegen Götzen gerichteten Argument.
- source_word: μὴ φοβηθῆτε αὐτούς
  choice: fürchtet euch nicht vor ihnen
  rationale: Die Formulierung bewahrt den ausdrücklichen Bezug auf die vermeintlichen Götter und den Nachdruck des verneinten Befehls.
theological_decisions:
- issue: Rituelle Unreinheit der Frauen und Verunreinigung der Götzen
  choice: Die beiden femininen Ausdrücke werden als Bezeichnungen für eine abgesondert sitzende Frau und eine Wöchnerin verstanden.
  alternative: Die knappe Formulierung könnte allgemeiner auf eine abseits sitzende und eine im Bett liegende Frau bezogen werden.
  rationale: Der griechische Wortlaut legt besonders bei λεχώ das Kindbett nahe; bei ἀποκαθημένη ist rituelle Absonderung wahrscheinlich, aber nicht ausdrücklich benannt. Daher wird die antike Reinheitsthematik erkennbar gehalten, ohne Menstruation oder eine bestimmte kultische Vorschrift in den Haupttext hineinzulesen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche antike Situation bleibt sichtbar; der Satzbau wird nur so weit geglättet, dass die Folgerung für heutige Leser unmittelbar verständlich ist.
