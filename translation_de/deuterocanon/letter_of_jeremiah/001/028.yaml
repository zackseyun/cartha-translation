  naturalness: Der Satz ist verständlich und würdig. Die plurale, generische Formulierung für beide Frauengruppen ist im Deutschen idiomatischer als zwei mit „eine“ eingeleitete Einzelfiguren und macht den Plural von ἅπτονται klarer.
  terminology: „Wöchnerinnen“ ist modernes Standarddeutsch und wahrt die historische, kultisch relevante Bedeutung von λεχώς. „Abgesondert sitzen“ erhält die wörtliche Bildlichkeit von ἀποκαθημένη; die Fußnote erläutert die wahrscheinliche rituelle Konnotation als Möglichkeit, nicht als festgelegte Diagnose.
