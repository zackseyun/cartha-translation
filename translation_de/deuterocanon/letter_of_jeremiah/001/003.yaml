  text: But now in Babylon you will see gods of silver and gold and wood[a], being carried on shoulders, showing fear to the nations.
translation:
  language: de
  text: Nun aber werdet ihr in Babylon silberne, goldene und hölzerne Götter sehen, die auf Schultern getragen werden und bei den Völkern Furcht erregen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „den Völkern Furcht zeigen“; auch möglich: „unter den Völkern Furcht verbreiten“. Die griechische Wendung lässt offen, ob die Zurschaustellung selbst oder ihre Wirkung auf die Betrachtenden gemeint ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: Nun aber
  rationale: Bewahrt sowohl den zeitlichen Übergang durch νυνί als auch die leicht entgegensetzende Funktion von δέ in natürlichem Deutsch.
- source_word: ὄψεσθε
  choice: werdet ihr … sehen
  rationale: Gibt das Futur von ὁράω schlicht und kontextgerecht wieder.
- source_word: ἐν Βαβυλῶνι
  choice: in Babylon
  rationale: Die lokale Bedeutung ist eindeutig und im Deutschen idiomatisch.
- source_word: θεοὺς
  choice: Götter
  rationale: Übersetzt das griechische Substantiv unmittelbar. „Götzen“ würde die polemische Bewertung bereits in das Wort hineintragen.
- source_word: ἀργυροῦς καὶ χρυσοῦς καὶ ξυλίνους
  choice: silberne, goldene und hölzerne
  rationale: Die drei Adjektive bezeichnen das Material; die attributive Reihe ist prägnant und natürlich.
- source_word: ἐπʼ ὤμων αἰρομένους
  choice: die auf Schultern getragen werden
  rationale: Gibt den passivischen Sinn des Partizips und das Bild des Tragens auf den Schultern klar wieder.
- source_word: δεικνύντας φόβον
  choice: Furcht erregen
  rationale: Im Zusammenhang mit τοῖς ἔθνεσιν ist dies eine natürliche deutsche Wiedergabe der Wirkung der zur Schau getragenen Bilder. Da das Griechische wörtlicher „Furcht zeigen“ lautet und semantisch gedrängt bleibt, wird diese Spannung in der Fußnote offengelegt.
- source_word: τοῖς ἔθνεσιν
  choice: bei den Völkern
  rationale: Passt idiomatisch zur wirkungsbezogenen Wiedergabe „Furcht erregen“; „Völker“ wahrt den allgemeinen Sinn von ἔθνη.
theological_decisions:
- issue: θεοὺς als „Götter“ oder deutend als „Götzen“ wiedergeben
  choice: Götter
  alternative: Götzen
  rationale: Der Ausgangstext nennt die Kultbilder „Götter“. Diese Bezeichnung bewahrt die Ironie und überlässt die polemische Einordnung dem Zusammenhang.
- issue: Die gedrängte Wendung δεικνύντας φόβον τοῖς ἔθνεσιν wiedergeben
  choice: bei den Völkern Furcht erregen
  alternative: den Völkern Furcht zeigen / unter den Völkern Furcht verbreiten
  rationale: Die Hauptfassung ist verständliches heutiges Deutsch und gibt die wahrscheinliche Wirkung der Bilder wieder. Die Fußnote bewahrt den wörtlicheren Ausdruck und macht deutlich, dass das Griechische die genaue Beziehung zwischen dem Zeigen und der Furcht nicht ausdrücklich entfaltet.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt nah am griechischen Bild, vermeidet jedoch unnatürliche Wörtlichkeit. Die Bezeichnung „Götter“ erhält die Ironie des Textes; die semantische Spannung bei δεικνύντας φόβον wird durch eine Fußnote sichtbar gemacht.
