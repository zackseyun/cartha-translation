  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/001.yaml
  text: Because of your sins[a], which you committed against God, you will be carried away captive to Babylon by Nebuchadnezzar king of the Babylonians.
translation:
  language: de
  text: Wegen eurer Sünden[a], die ihr gegen Gott begangen habt, werdet ihr von Nebukadnezar, dem König der Babylonier, als Gefangene nach Babylon weggeführt werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „wegen eurer Sünden, die ihr gegen Gott gesündigt habt“. Das Griechische wiederholt den Wortstamm von „Sünde“ und „sündigen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ τὰς ἁμαρτίας ὑμῶν
  choice: Wegen eurer Sünden
  rationale: διά mit Akkusativ bezeichnet hier den Grund. „Wegen“ gibt den kausalen Zusammenhang knapp und natürlich wieder; ἁμαρτία entspricht dem üblichen deutschen Begriff „Sünde“.
- source_word: ἃς ἡμαρτήκατε
  choice: die ihr begangen habt
  rationale: Das Griechische verwendet die etymologische Wiederholung „Sünden, die ihr gesündigt habt“. Im heutigen Deutsch wäre dies unnatürlich; „begangen habt“ bewahrt Aussage und persönliche Verantwortlichkeit. Die wörtlichere Form wird in der Fußnote dokumentiert.
- source_word: ἐναντίον τοῦ θεοῦ
  choice: gegen Gott
  rationale: Im Zusammenhang von Schuld und Gericht bezeichnet ἐναντίον nicht nur Gottes Gegenwart, sondern die gegen ihn gerichtete Verfehlung.
- source_word: ἀχθήσεσθε
  choice: werdet ... weggeführt werden
  rationale: Das Futur Passiv von ἄγω bezeichnet hier die erzwungene Deportation. „Weggeführt werden“ ist im Deutschen idiomatisch und wahrt das Passiv.
- source_word: εἰς Βαβυλῶνα
  choice: nach Babylon
  rationale: εἰς gibt das Ziel der Deportation an; bei Städtenamen ist „nach Babylon“ die natürliche deutsche Form.
- source_word: αἰχμάλωτοι
  choice: als Gefangene
  rationale: Das pluralische Prädikativ bezeichnet den Zustand, in dem die Angeredeten weggeführt werden. „Als Gefangene“ erhält diesen Sinn und den kollektiven Plural.
- source_word: ὑπὸ Ναβουχοδονοσὸρ
  choice: von Nebukadnezar
  rationale: ὑπό kennzeichnet beim Passiv den handelnden Urheber. „Nebukadnezar“ ist die geläufige deutsche Namensform.
- source_word: βασιλέως τῶν Βαβυλωνίων
  choice: dem König der Babylonier
  rationale: Die Wiedergabe folgt der ausdrücklichen ethnischen Formulierung des Griechischen und glättet sie nicht zu „König von Babylon“.
theological_decisions:
- issue: Wiedergabe der figura etymologica ἁμαρτίας ... ἡμαρτήκατε
  choice: Im Haupttext natürlich „Sünden, die ihr ... begangen habt“, mit Hinweis auf die griechische Wiederholung in der Fußnote.
  alternative: „Sünden, die ihr gegen Gott gesündigt habt“
  rationale: Die Alternative bildet die Wortwiederholung formaler ab, klingt im modernen Standarddeutsch jedoch schwerfällig. Die Fußnote bewahrt die rhetorische Eigenart, ohne den Haupttext unnatürlich zu machen.
- issue: Bedeutung von ἐναντίον τοῦ θεοῦ
  choice: „gegen Gott“
  alternative: „vor Gott“ oder „in Gottes Gegenwart“
  rationale: Der Kontext stellt die Sünden als Grund des Exilsurteils dar. „Gegen Gott“ wahrt daher die moralische und relationale Ausrichtung der Verfehlung, ohne darüber hinaus eine konfessionelle Deutung einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung nennt zunächst den Grund und lässt dann Gericht, Urheber, Zustand und Ziel der Deportation klar hervortreten. Der im Deutschen sperrige verwandte Akkusativ des Griechischen wird im Haupttext behutsam geglättet und durch die Fußnote transparent gemacht.
