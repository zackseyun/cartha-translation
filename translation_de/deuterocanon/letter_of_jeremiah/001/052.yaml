  text: For they will certainly not raise up a king for a land, nor will they certainly give rain to men,
translation:
  language: de
  text: Denn sie werden keinesfalls einen König über ein Land[a] einsetzen und den Menschen ebenso wenig Regen geben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „einen König eines Landes“. Das griechische χώρα kann Land, Gebiet oder Gegend bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: βασιλέα
  choice: einen König
  rationale: Der Akkusativ Singular ist das Objekt von ἀναστήσωσιν; der unbestimmte Ausdruck entspricht hier dem artikellosen Griechisch.
- source_word: χώρας
  choice: über ein Land
  rationale: Der Genitiv bezeichnet den territorialen Herrschaftsbereich des Königs. Die deutsche Wendung „einen König über ein Land einsetzen“ gibt diesen politischen Bezug natürlich wieder, ohne χώρας auf einen modernen Nationalstaat einzuengen.
- source_word: οὐ μὴ ἀναστήσωσιν
  choice: werden keinesfalls … einsetzen
  rationale: οὐ μή mit dem Aorist Konjunktiv drückt eine nachdrückliche Verneinung mit Zukunftsbezug aus. „Keinesfalls“ bewahrt den Nachdruck; „einsetzen“ trifft im Zusammenhang die Einsetzung eines Herrschers besser als das wörtlichere „aufrichten“.
- source_word: ὑετόν
  choice: Regen
  rationale: Die schlichte und übliche deutsche Entsprechung für ὑετός.
- source_word: ἀνθρώποις
  choice: den Menschen
  rationale: Der Dativ Plural bezeichnet Menschen allgemein. „Den Menschen“ ist im Deutschen quellennah, natürlich und eindeutig generisch.
- source_word: οὔτε … οὐ μὴ δῶσιν
  choice: und … ebenso wenig … geben
  rationale: οὔτε verbindet die zweite verneinte Aussage mit der ersten; das erneute οὐ μή verstärkt auch diese Verneinung. „Ebenso wenig“ nimmt die nachdrückliche erste Verneinung auf und vermeidet eine schwerfällige Wiederholung.
- source_word: γάρ
  choice: Denn
  rationale: Die begründende oder erläuternde Verknüpfung mit dem vorausgehenden Zusammenhang wird durch „Denn“ bewahrt.
theological_decisions:
- issue: Allgemeiner Bezug von ἀνθρώποις
  choice: den Menschen
  alternative: den Leuten / den Männern
  rationale: Die Aussage betrifft die gesamte Menschheit. Das deutsche „Menschen“ bewahrt diesen allgemeinen Bezug, ohne eine nur männliche Personengruppe nahezulegen.
- issue: Aussageweise der doppelten Verneinung οὐ μή
  choice: nachdrückliche zukünftige Verneinung
  alternative: Wiedergabe als bloßes Unvermögen mit „können nicht“
  rationale: Der griechische Wortlaut verneint nachdrücklich, dass die genannten Handlungen eintreten werden. Die Übersetzung wahrt diese Aussageweise und macht daraus nicht stillschweigend eine reine Fähigkeitsaussage.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung der emphatischen griechischen Verneinung wird durch „keinesfalls … ebenso wenig“ natürlich wiedergegeben; der abschließende Satzanschluss bleibt wie in der Vorlage offen.
