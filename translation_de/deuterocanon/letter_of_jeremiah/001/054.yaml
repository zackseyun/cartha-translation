base_translation:
  language: en
  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/054.yaml
  text: For just as a crow is between heaven and earth[a], so also when fire falls into a house of wooden or gold-covered or silver-covered gods, their priests will flee and be saved[b], but they themselves will be burned up like beams in the middle.
translation:
  language: de
  text: Denn wie eine Krähe zwischen Himmel und Erde ist,[a] so werden auch, wenn Feuer in ein Haus hölzerner oder mit Gold oder Silber überzogener Götter fällt,[b] ihre Priester fliehen und gerettet werden; sie selbst aber werden wie Balken im Inneren völlig verbrennen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Vergleich ist im Griechischen elliptisch und bricht zunächst unvermittelt ab.
    reason: cultural_note
  - marker: b
    text: 'Oder: „in einen Tempel hölzerner oder mit Gold oder Silber überzogener Götter“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥσπερ ... καὶ γὰρ
  choice: denn wie ... so werden auch
  rationale: Gibt die knappe, elliptische Vergleichsstruktur des Griechischen mit nur geringer syntaktischer Glättung wieder.
- source_word: κορώνη
  choice: Krähe
  rationale: Die konkrete gewöhnliche Bedeutung wird beibehalten; eine Verallgemeinerung zu „Vogel“ ist nicht nötig.
- source_word: ἀνὰ μέσον τοῦ οὐρανοῦ καὶ τῆς γῆς
  choice: zwischen Himmel und Erde
  rationale: Natürliche deutsche Wiedergabe des räumlichen Ausdrucks, die das Bild wahrt.
- source_word: ἐμπέσῃ ... πῦρ
  choice: Feuer ... fällt
  rationale: Bewahrt das Bild eines plötzlich hereinbrechenden Feuers näher als die deutende Formulierung „ausbricht“.
- source_word: οἰκίαν θεῶν
  choice: ein Haus ... Götter
  rationale: οἰκία bedeutet wörtlich „Haus“; der kontextuell naheliegende Sinn „Tempel“ wird in einer Fußnote genannt.
- source_word: ξύλινων ἢ περιχρύσων ἢ περιηργύρων
  choice: hölzerner oder mit Gold oder Silber überzogener
  rationale: Bewahrt sowohl die drei Materialangaben als auch den Unterschied zwischen aus Holz gefertigten und mit Edelmetall überzogenen Götterbildern.
- source_word: φεύξονται καὶ διασωθήσονται
  choice: werden fliehen und gerettet werden
  rationale: Hält Flucht und anschließende Rettung als zwei Aussagen auseinander.
- source_word: δοκοὶ μέσοι
  choice: Balken im Inneren
  rationale: δοκοί bezeichnet Balken; μέσοι verweist wahrscheinlich auf ihre Lage mitten im Gebäude. Die Formulierung bleibt anschaulich, ohne „Hauptbalken“ hineinzulesen.
- source_word: κατακαυθήσονται
  choice: werden ... völlig verbrennen
  rationale: Das präfigierte Verb bezeichnet ein vollständiges Verbrennen; „völlig“ macht diese Intensivierung im Deutschen deutlich.
theological_decisions:
- issue: Elliptischer Vergleich am Versanfang
  choice: Das Krähenbild wird mit minimaler syntaktischer Glättung beibehalten.
  alternative: Den Vergleich ausdeuten oder den fragmentarischen Anfang auslassen.
  rationale: Der überlieferte griechische Text ist abrupt. Seine rhetorische Spannung und die Hilflosigkeit der Götterbilder sollen nicht durch eine im Haupttext ergänzte Erklärung aufgelöst werden.
- issue: Bedeutung von οἰκίαν θεῶν
  choice: Im Haupttext steht „Haus ... Götter“.
  alternative: „Tempel ... Götter“
  rationale: „Haus“ entspricht dem Wortlaut; „Tempel“ ist im Kontext plausibel, aber stärker deutend und wird deshalb als Alternative in der Fußnote bewahrt.
- issue: Rettung der Priester im Gegensatz zur Vernichtung der Götterbilder
  choice: „ihre Priester [werden] fliehen und gerettet werden; sie selbst aber ... völlig verbrennen“
  alternative: „die Priester werden entkommen“
  rationale: Die beiden griechischen Verben für Fliehen und Gerettetwerden sowie der polemische Gegensatz zwischen handlungsfähigen Priestern und hilflosen Götterbildern bleiben ausdrücklich erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche Anfangskonstruktion bleibt erkennbar, wird aber durch „wie ... so“ lesbar gemacht. Der konkrete Spott des Ausgangstextes wird weder abgeschwächt noch konfessionell ausgedeutet.
