review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt Gold, das Herstellen von Kronen und „ihre Götter“ zutreffend wieder. Die Verbindung „wie für eine … junge Frau“ macht die Vergleichskonstruktion jedoch semantisch zu einer Zweckangabe („für eine Frau“) und verfehlt damit ὥσπερ. Die syntaktisch auffällige griechische Konstruktion wird mit einer natürlichen deutschen Vergleichsfügung wiedergegeben, ohne die im Text vorliegende Zuordnung weiter auszudeuten.
  naturalness: „Schmuckliebende junge Frau“ und „Kronen für die Köpfe ihrer Götter“ sind verständliches modernes Standarddeutsch. Die revidierte Satzstellung ist deutlich idiomatischer als „wie für eine … nehmen sie Gold“.
  terminology: „Junge Frau“ ist als kontextuelle Wiedergabe von παρθένῳ vertretbar, sofern die Fußnote die engeren Bedeutungen „Jungfrau“ und „Mädchen“ sichert. „Schmuckliebend“, „Gold“, „Kronen“ und „Götter“ sind angemessen; „Götter“ vermeidet die nicht im griechischen Wortlaut stehende Einengung auf „Götzenbilder“.
  issues:
  - severity: medium
    issue: Die Formulierung „wie für eine schmuckliebende junge Frau“ missversteht die Vergleichspartikel als Teil einer Zweckbestimmung.
    rationale: ὥσπερ leitet einen Vergleich ein. Das deutsche „für eine“ legt nahe, die Kronen würden für die junge Frau hergestellt, während der griechische Satz die junge Frau als Vergleichsgröße anführt.
  revised_text: Und wie eine schmuckliebende junge Frau nehmen sie Gold und fertigen Kronen für die Köpfe ihrer Götter an.
  revised_footnotes:
  - marker: a
    text: 'Wörtlich: eine Jungfrau oder ein Mädchen.'
    reason: Das griechische παρθένος kann eine Jungfrau beziehungsweise eine unverheiratete junge Frau oder ein Mädchen bezeichnen. Die Fußnote bewahrt die wörtlichere Bedeutungsbreite.
  revision_rationale: Die Vergleichsfügung wurde von der irreführenden Zweckangabe „wie für eine“ zu „wie eine“ korrigiert. Damit bleibt der Vergleich erhalten und der deutsche Satz ist grammatisch sowie idiomatisch klar. Die Fußnote bleibt am Ausdruck „junge Frau“ verankert und wurde lediglich knapp und konsistent formuliert.
