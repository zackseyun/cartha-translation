  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/008.yaml
  text: And as for a woman who loves adornment[a], taking gold they make crowns for the heads of their gods;
translation:
  language: de
  text: Und wie eine schmuckliebende junge Frau nehmen sie Gold und fertigen Kronen für die Köpfe ihrer Götter an.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὥσπερ
  choice: wie
  rationale: Leitet unmittelbar einen Vergleich ein; das schlichte „wie“ bewahrt diese Funktion ohne die Konstruktion erklärend aufzulösen.
- source_word: παρθένῳ
  choice: für eine junge Frau[a]
  rationale: Der Dativ gehört zum Vergleich. „Junge Frau“ gibt die weibliche, gewöhnlich unverheiratete Figur im heutigen Deutsch natürlich wieder; die wörtlicheren Möglichkeiten werden in der Fußnote genannt.
- source_word: φιλοκόσμῳ
  choice: schmuckliebende
  rationale: Das zusammengesetzte Adjektiv bezeichnet jemanden, der Schmuck beziehungsweise äußere Zierde liebt. „Schmuckliebend“ ist knapp und quellennah.
- source_word: λαμβάνοντες χρυσίον
  choice: nehmen sie Gold
  rationale: Bewahrt das Partizip als begleitende beziehungsweise vorausgehende Handlung und lässt χρυσίον unbestimmt als „Gold“ stehen.
- source_word: κατασκευάζουσιν
  choice: fertigen … an
  rationale: Das Verb bezeichnet hier das Herstellen oder Anfertigen eines Gegenstands; „anfertigen“ passt idiomatisch zu Kronen.
- source_word: στεφάνους
  choice: Kronen
  rationale: Der Ausdruck kann Kränze oder Kronen bezeichnen. Wegen des Goldes und der Anbringung auf den Köpfen der Götterbilder ist „Kronen“ die naheliegende deutsche Wiedergabe.
- source_word: ἐπὶ τὰς κεφαλὰς
  choice: für die Köpfe
  rationale: Bei einem Verb des Anfertigens bezeichnet die Präpositionalverbindung die vorgesehene Platzierung; „für die Köpfe“ ist im Deutschen natürlich und wahrt den Bezug.
- source_word: τῶν θεῶν αὐτῶν
  choice: ihrer Götter
  rationale: Gibt die Genitivverbindung direkt wieder. Obwohl der Zusammenhang Götterbilder meint, steht im griechischen Wortlaut „Götter“.
theological_decisions:
- issue: θεῶν als „Götter“ oder deutend als „Götzen/Götterbilder“
  choice: ihrer Götter
  alternative: ihrer Götzen / ihrer Götterbilder
  rationale: Der polemische Zusammenhang betrifft Kultbilder, doch der griechische Text sagt hier θεῶν. Die Hauptübersetzung bewahrt diese Bezeichnung und legt die Deutung nicht zusätzlich in den Wortlaut.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die etwas ungewöhnliche Vergleichskonstruktion des griechischen Satzes bleibt erkennbar, wird aber grammatisch flüssig wiedergegeben. „Schmuckliebend“ hält die knappe Bildsprache des Originals fest.
