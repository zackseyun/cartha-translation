  rationale: Die Vergleichsfügung wurde von der irreführenden Zweckangabe „wie für eine“ zu „wie eine“ korrigiert. Damit bleibt der Vergleich erhalten und der deutsche Satz ist grammatisch sowie idiomatisch klar. Die Fußnote bleibt am Ausdruck „junge Frau“ verankert und wurde lediglich knapp und konsistent formuliert.
