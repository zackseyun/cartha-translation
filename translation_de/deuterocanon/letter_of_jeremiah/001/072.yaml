  text: So a righteous man who has no idols is better[b][a], for he will be far from reproach.
translation:
  language: de
  text: Darum ist ein gerechter Mann[a], der keine Götzen hat, besser; denn er wird fern von Schmach sein.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein gerechter Mensch“. Der griechische Text hat hier den maskulinen Singular und kann den Mann zugleich beispielhaft beziehungsweise repräsentativ bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: „Schmach“ kann auch mit „Schande“ oder „Vorwurf“ wiedergegeben werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: κρείσσον
  choice: besser
  rationale: Die prädikative Vergleichsform zieht das Fazit aus dem vorausgehenden Gegensatz. „Besser“ bewahrt die knappe Wertung, ohne den im Zusammenhang erkennbaren Vergleich ausdrücklich zu ergänzen.
- source_word: οὖν
  choice: darum
  rationale: Das Wort kennzeichnet eine Schlussfolgerung aus der vorausgehenden Argumentation; „darum“ ist im modernen Deutsch klar und natürlich.
- source_word: ἄνθρωπος δίκαιος
  choice: ein gerechter Mann
  rationale: Der griechische Ausdruck steht im maskulinen Singular und bezeichnet hier einen Mann mit beispielhafter beziehungsweise repräsentativer Aussagekraft. „Gerecht“ entspricht dem biblisch-ethischen Gehalt von δίκαιος.
- source_word: οὐκ ἔχων εἴδωλα
  choice: der keine Götzen hat
  rationale: Der attributive Partizipialausdruck wird als natürlicher deutscher Relativsatz wiedergegeben. „Götzen“ bezeichnet hier die zuvor verspotteten Kultbilder.
- source_word: ἔσται
  choice: er wird … sein
  rationale: Die deutsche Futurform bildet das griechische Futur von εἰμί direkt und verständlich ab.
- source_word: μακρὰν ἀπὸ ὀνειδισμοῦ
  choice: fern von Schmach
  rationale: „Schmach“ umfasst den öffentlichen Vorwurf und die damit verbundene Entehrung, die ὀνειδισμός hier ausdrücken kann, und passt zum würdevollen Register des Textes.
theological_decisions:
- issue: Maskuliner Singular ἄνθρωπος
  choice: ein gerechter Mann
  alternative: ein gerechter Mensch
  rationale: Die Hauptfassung lässt die maskuline Einzelfigur des griechischen Textes sichtbar, ohne die Aussage auf alle Menschen zu neutralisieren. Die repräsentative Bedeutung bleibt als mögliche Lesart in der Fußnote erhalten.
- issue: Art des ὀνειδισμός
  choice: Schmach
  alternative: Schande oder Vorwurf
  rationale: Der Zusammenhang kann sowohl öffentliche Beschämung als auch tadelnden Vorwurf einschließen. „Schmach“ hält beide Aspekte zusammen, ohne einen davon dogmatisch festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt nahe an der knappen griechischen Schlussfolgerung; die Relativkonstruktion vermeidet zugleich eine schwerfällige wörtliche Partizipialwendung.
