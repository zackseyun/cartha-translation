  text: For the sun and the moon and the stars, being bright and sent out for needs, are obedient.
translation:
  language: de
  text: Denn Sonne, Mond und Sterne sind hell, werden zum Dienst ausgesandt[a] und gehorchen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „für notwendige Aufgaben“; die griechische Wendung kann den Dienst zur Erfüllung eines Bedarfs oder einer bestimmten Funktion bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἥλιος, σελήνη, ἄστρα
  choice: Sonne, Mond und Sterne
  rationale: Die gewöhnlichen deutschen Bezeichnungen geben die konventionelle Dreiergruppe der Himmelskörper unmittelbar wieder.
- source_word: ὄντα λαμπρά
  choice: sind hell
  rationale: Die finite Formulierung ist im Deutschen natürlicher als eine wörtliche Partizipialkonstruktion und bewahrt die Aussage über ihren leuchtenden Zustand.
- source_word: ἀποστελλόμενα
  choice: werden … ausgesandt
  rationale: Das Passiv und das Bild einer Beauftragung bleiben erhalten, ohne den im Vers nicht ausdrücklich genannten Sendenden einzufügen.
- source_word: ἐπὶ χρείας
  choice: zum Dienst
  rationale: Die Wendung bezeichnet Bedarf, nützlichen Dienst oder notwendige Aufgaben. „Zum Dienst“ ist idiomatisches Deutsch und lässt den funktionalen Sinn offen; die lexikalische Spannweite wird in der Fußnote ausgewiesen.
- source_word: εὐήκοά
  choice: gehorchen
  rationale: Das Verb gibt die prädikative Bedeutung „gehorsam sein“ natürlich wieder und bewahrt den Gegensatz zwischen den gehorsamen Himmelskörpern und handlungsunfähigen Götzen.
theological_decisions:
- issue: Handlungsmacht und Zweck der Himmelskörper
  choice: Die Himmelskörper werden als ausgesandt und gehorchend dargestellt, ohne die handelnde Autorität ausdrücklich zu benennen.
  alternative: Die Aussage lediglich als unpersönlichen Hinweis auf die regelmäßigen Abläufe der Natur wiederzugeben.
  rationale: Das Passiv „ausgesandt“ und εὐήκοα („gehorsam“) legen eine ordnende Autorität nahe. Da der griechische Satz Gott jedoch nicht ausdrücklich nennt, wird er auch in der Übersetzung nicht ergänzt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Reihung mit finiten Verben vermeidet eine schwerfällige Partizipialkonstruktion, während Passiv, Zweckbezug und Gehorsamsmotiv des Griechischen erhalten bleiben.
