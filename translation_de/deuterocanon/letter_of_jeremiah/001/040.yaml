review_pass:
  verdict: revise
  source_fidelity: 'Die Wiedergabe von τὸν Βῆλον als Akkusativobjekt („Bel herbei“) folgt zu Recht dem überlieferten griechischen Text, auch wenn die Szene dadurch auffällig wirkt. Die Deutung „dass er den Stummen zum Sprechen bringt“ ist jedoch im Haupttext zu weitgehend: φωνῆσαι bedeutet unmittelbar „sprechen“, und der Akkusativ τὸν Βῆλον legt Bel als denjenigen nahe, der zum Sprechen aufgefordert wird. Die kausative Deutung kann nur als Kontextalternative in einer Anmerkung erscheinen.'
  naturalness: Der Entwurf ist überwiegend modernes Standarddeutsch. „Bel herbeibringen“ ist absichtlich ungewohnt, aber als quellentreue Wiedergabe vertretbar und sollte durch eine knappe Anmerkung erläutert werden. „Als könnte er überhaupt etwas wahrnehmen“ verstärkt den Text unnötig; „als ob er wahrnehmen könnte“ ist idiomatisch und genauer.
  terminology: '„Chaldäer“, „Götzen“ und „Bel“ sind passend. „Stummer Mensch“ ist respektvoll und gibt die doppelte griechische Umschreibung sachlich wieder. Die kulturelle Erläuterung zu Bel soll direkt an dessen Namen stehen. Die Alternative zur Deutung von φωνῆσαι muss umgekehrt formuliert werden: Nicht das Sprechen Bels ist die Alternative, sondern die im Kontext mögliche kausative Lesart, dass Bel den stummen Menschen sprechen lassen solle.'
  issues:
  - severity: high
    issue: Der Haupttext macht Bel zum Verursacher des Sprechens des stummen Menschen.
    rationale: Das ist eine mögliche kontextuelle Ergänzung, aber nicht die unmittelbarste Wiedergabe von φωνῆσαι. Der überlieferte Akkusativ τὸν Βῆλον und der Infinitiv sprechen dafür, dass sie Bel herbeibringen und ihn auffordern zu sprechen.
  - severity: medium
    issue: Die Fußnote zur syntaktischen Schwierigkeit steht nicht an der problematischen Formulierung und die Fußnoten b/c sind inhaltlich falsch zugeordnet.
    rationale: Die Bel-Notiz gehört an „Bel“; die Erläuterung der Wahrnehmung an die Schlusswendung; die alternative Auslegung von φωνῆσαι an „zu sprechen“.
  - severity: low
    issue: „überhaupt“ fügt eine nicht ausdrücklich markierte Verstärkung hinzu.
    rationale: Die Ironie liegt bereits in ὡς; die zusätzliche Totalisierung ist nicht erforderlich.
  revised_text: 'Außerdem entehren sogar die Chaldäer selbst diese Götzen: Wenn sie einen stummen Menschen sehen, der nicht sprechen kann, bringen sie Bel[a] herbei und fordern ihn auf zu sprechen[b] – als ob er wahrnehmen könnte.[c]'
  revised_footnotes:
  - marker: a
    text: 'Im überlieferten griechischen Text ist „Bel“ das Akkusativobjekt: wörtlich „nachdem sie Bel herbeigebracht haben“. Wegen der auffälligen Syntax verstehen manche Übersetzungen die Szene sinngemäß so, dass sie den stummen Menschen vor Bel bringen.'
    reason: textual_syntactic_note
  - marker: b
    text: Der Infinitiv bedeutet unmittelbar „sprechen“. Im Zusammenhang mit dem stummen Menschen wird er auch so verstanden, dass Bel ihn zum Sprechen bringen solle.
    reason: lexical_alternative
  - marker: c
    text: Bel ist ein babylonischer Gottesname beziehungsweise Titel, der besonders mit Marduk verbunden war. „Wahrnehmen“ kann auch „verstehen“ oder „bemerken“ bedeuten.
    reason: cultural_note; lexical_alternative
  revision_rationale: Die Revision folgt zunächst der überlieferten griechischen Syntax und belässt deren auffälligen Befund im Haupttext. Die kontextuell mögliche, aber grammatisch stärker ergänzende Lesart, Bel solle den stummen Menschen zum Sprechen bringen, wird transparent als Alternative vermerkt. Fußnotenanker und Inhalte wurden an ihre jeweiligen Bezugswörter gesetzt.
