base_translation:
  language: en
  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/040.yaml
  text: 'Moreover[a], even the Chaldeans themselves dishonor them: whenever they see a mute person unable to speak, they bring him before Bel and ask that he make him speak[c][b], as though he were able to perceive.'
translation:
  language: de
  text: 'Außerdem entehren sogar die Chaldäer selbst diese Götzen: Wenn sie einen stummen Menschen sehen, der nicht sprechen kann, bringen sie Bel herbei[a] und verlangen von ihm, dass er den Stummen zum Sprechen bringt – als könnte er überhaupt etwas wahrnehmen.[b][c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht im griechischen Text: „Sie bringen Bel herbei.“ Manche Übersetzungen verstehen die Szene sinngemäß so, dass sie den stummen Menschen vor Bel bringen.'
    reason: textual_syntactic_note
  - marker: b
    text: Bel ist ein babylonischer Gottesname beziehungsweise Titel, der besonders mit Marduk verbunden war.
    reason: cultural_note
  - marker: c
    text: Der knappe griechische Ausdruck kann auch bedeuten, dass sie von Bel verlangen, selbst zu sprechen oder eine Stimme zu geben.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔτι δὲ καὶ
  choice: Außerdem … sogar
  rationale: Gibt die weiterführende Bedeutung von ἔτι δέ und die Hervorhebung durch καί in natürlichem Deutsch wieder.
- source_word: αὐτῶν τῶν Χαλδαίων
  choice: die Chaldäer selbst
  rationale: Das intensive αὐτῶν wird mit „selbst“ wiedergegeben; eine Einschränkung auf nur einige Chaldäer steht nicht im griechischen Text.
- source_word: ἀτιμαζόντων αὐτά
  choice: entehren … diese Götzen
  rationale: „Entehren“ entspricht ἀτιμάζω; „diese Götzen“ macht den Rückbezug des sächlichen αὐτά im Deutschen verständlich.
- source_word: ἐνεὸν οὐ δυνάμενον λαλῆσαι
  choice: einen stummen Menschen …, der nicht sprechen kann
  rationale: Sachlich genaue und heute respektvolle Wiedergabe; die erklärende Wiederholung des Griechischen bleibt erhalten.
- source_word: προσενεγκάμενοι τὸν Βῆλον
  choice: bringen sie Bel herbei
  rationale: Im überlieferten griechischen Wortlaut ist „Bel“ das Akkusativobjekt des Partizips. Daher wird nicht gegen die Syntax formuliert, sie brächten den stummen Menschen vor Bel.
- source_word: ἐξιοῦσιν φωνῆσαι
  choice: verlangen von ihm, dass er den Stummen zum Sprechen bringt
  rationale: Gibt die im Zusammenhang naheliegende Aufforderung an Bel verständlich wieder. Da der knappe griechische Ausdruck auch anders bezogen werden kann, wird die Unsicherheit in einer Fußnote dokumentiert.
- source_word: ὡς δυνατοῦ ὄντος αὐτοῦ αἰσθέσθαι
  choice: als könnte er überhaupt etwas wahrnehmen
  rationale: Bewahrt den irreal-ironischen Vergleich und den Wahrnehmungsbegriff von αἰσθάνομαι; „überhaupt“ macht die polemische Zuspitzung idiomatisch deutlich.
theological_decisions:
- issue: Worin die Entehrung der Götzen besteht
  choice: Das Verhalten der Chaldäer wird als praktische Bloßstellung der Ohnmacht des Götzen beschrieben.
  alternative: Die Aussage könnte allgemeiner besagen, dass die Chaldäer ihre eigenen Götter geringschätzig behandeln.
  rationale: Das unmittelbar folgende Beispiel konkretisiert ἀτιμάζω, ohne daraus eine weitergehende dogmatische Behauptung über die Absicht der Verehrer abzuleiten.
- issue: Subjekt und Ergänzung von φωνῆσαι
  choice: Bel wird aufgefordert, den stummen Menschen zum Sprechen zu bringen.
  alternative: Der knappe Ausdruck kann auch als Aufforderung verstanden werden, Bel selbst solle sprechen beziehungsweise eine Stimme geben.
  rationale: Der Kontext mit dem stummen Menschen stützt die gewählte Lesart, doch die grammatische Kürze erlaubt keine völlig eindeutige Auflösung; deshalb wird die Alternative vermerkt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdig-polemischem Ton. „Stummer Mensch“ vermeidet eine substantivierende oder abwertende Personenbezeichnung. Der Gedankenstrich trägt die ironische Schlusswendung, ohne die Aussage konfessionell auszudeuten.
