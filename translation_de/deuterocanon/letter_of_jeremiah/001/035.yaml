  text: They will certainly not rescue a man from death[a], nor will they deliver the weaker from the strong.
translation:
  language: de
  text: Einen Menschen werden sie ganz gewiss nicht vor dem Tod retten, und den Schwächeren werden sie nicht aus der Hand des Starken befreien.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκ θανάτου
  choice: vor dem Tod
  rationale: Bei einem Verb des Rettens gibt ἐκ θανάτου die Gefahr oder Macht des Todes an, aus der jemand gerettet würde. „Vor dem Tod retten“ ist im Deutschen idiomatisch und legt nicht unnötig fest, ob unmittelbar drohender oder bereits eingetretener Tod gemeint ist.
- source_word: ἄνθρωπον
  choice: einen Menschen
  rationale: ἄνθρωπος bezeichnet hier generisch einen Menschen. Die deutsche Wiedergabe bewahrt den Singular und ist geschlechtsübergreifend, ohne den Sinn zu erweitern.
- source_word: οὐ μὴ ῥύσωνται
  choice: werden sie ganz gewiss nicht … retten
  rationale: Die Verbindung οὐ μή mit dem Futur ist eine nachdrückliche Verneinung. „Ganz gewiss nicht“ gibt diese Verstärkung natürlich und würdig wieder; ῥύομαι wird im Zusammenhang passend mit „retten“ übersetzt.
- source_word: ἥττονα
  choice: den Schwächeren
  rationale: Der substantivisch gebrauchte Komparativ bezeichnet den im Kräfteverhältnis Schwächeren und wahrt den knappen Gegensatz zu ἰσχυροῦ.
- source_word: ἀπὸ ἰσχυροῦ
  choice: aus der Hand des Starken
  rationale: ἀπό bezeichnet die stärkere Person, aus deren Gewalt der Schwächere befreit werden müsste. „Aus der Hand“ macht diese Relation im Deutschen natürlich deutlich, ohne eine zusätzliche konkrete Handlung einzutragen.
- source_word: μὴ ἐξέλωνται
  choice: werden sie nicht … befreien
  rationale: ἐξαιρέω im Medium kann das Herausnehmen oder Befreien aus Gefahr beziehungsweise Gewalt ausdrücken. „Befreien“ bildet den parallelen Rettungssinn klar ab.
