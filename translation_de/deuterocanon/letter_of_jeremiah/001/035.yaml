  source_fidelity: Die Übersetzung gibt beide parallel konstruierten Aussagen des Griechischen zuverlässig wieder. „Ganz gewiss nicht“ bildet die emphatische Verneinung οὐ μή mit Futur angemessen ab. „Vor dem Tod retten“ ist idiomatisch und entspricht ἐκ θανάτου im Sinn einer Rettung aus der Todesgefahr bzw. vom Tod. Der Gegensatz zwischen ἥττων und ἰσχυρός bleibt in „den Schwächeren“ und „dem Starken“ klar erhalten. „Aus der Hand des Starken“ ist eine behutsame, natürliche Explizierung der Befreiung von einer stärkeren Person und verändert den Sinn nicht.
