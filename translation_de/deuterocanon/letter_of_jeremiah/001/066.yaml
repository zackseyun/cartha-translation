  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/066.yaml
  text: They will certainly not show signs in the heavens among the nations[a], nor will they shine like the sun, nor give light like the moon.
translation:
  language: de
  text: Sie werden unter den Völkern ganz gewiss keine Zeichen am Himmel zeigen; auch werden sie weder wie die Sonne strahlen noch wie der Mond Licht geben.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σημεῖα
  choice: Zeichen
  rationale: „Zeichen“ ist die weiteste und natürlichste Wiedergabe und lässt offen, ob ausdrücklich Vorzeichen oder Wunderzeichen gemeint sind.
- source_word: ἐν ἔθνεσιν
  choice: unter den Völkern
  rationale: Die Formulierung entspricht dem üblichen Sinn von ἔθνη in der Septuaginta und vermeidet die stärker religiös geprägte Wiedergabe „unter den Heiden“.
- source_word: ἐν οὐρανῷ
  choice: am Himmel
  rationale: Im Zusammenhang mit Sonne und Mond bezeichnet die Wendung den sichtbaren Himmel; das deutsche „Himmel“ bewahrt zugleich die Bedeutungsweite des griechischen οὐρανός.
- source_word: οὐ μὴ δείξωσιν
  choice: werden … ganz gewiss keine … zeigen
  rationale: „Ganz gewiss nicht“ gibt die nachdrückliche Verneinung οὐ μή klar und in natürlichem modernem Deutsch wieder.
- source_word: λάμψουσιν
  choice: strahlen
  rationale: „Strahlen“ ist im Vergleich mit der Sonne idiomatisch und unterscheidet sich deutlich vom anschließenden Geben von Licht.
- source_word: φωτιοῦσιν
  choice: Licht geben
  rationale: Die Wendung bezeichnet das Spenden von Licht und bewahrt den Unterschied zu λάμπω.
- source_word: σελήνη
  choice: Mond
  rationale: Dies ist die eindeutige Standardbezeichnung für den genannten Himmelskörper.
theological_decisions:
- issue: Bezug der Verben im Plural und unausgesprochenes Subjekt
  choice: Das aus dem Zusammenhang übernommene Subjekt wird lediglich mit „Sie“ wiedergegeben.
  alternative: Das Subjekt ausdrücklich als „die Götzen“ oder „die falschen Götter“ benennen.
  rationale: Im griechischen Vers steht kein ausdrückliches Subjekt. „Sie“ hält den Rückbezug offen und vermeidet eine über den unmittelbaren Wortlaut hinausgehende Präzisierung.
- issue: Bedeutung der himmlischen Zeichen
  choice: „Zeichen“ bleibt ohne nähere Bestimmung stehen.
  alternative: „Vorzeichen“ oder „Wunderzeichen“.
  rationale: Der Text sagt nicht ausdrücklich, ob ominöse Vorzeichen, Wunder oder allgemein erkennbare Zeichen gemeint sind; diese Bedeutungsbreite soll erhalten bleiben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Stellung „Zeichen am Himmel“ ist idiomatisch und verbindet die Zeichen klar mit dem Bereich von Sonne und Mond. Die doppelte Vergleichsstruktur wird durch „weder … noch“ flüssig wiedergegeben, ohne die emphatische Verneinung des ersten Satzglieds abzuschwächen.
