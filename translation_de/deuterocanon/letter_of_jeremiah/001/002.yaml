base_translation:
  language: en
  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/002.yaml
  text: So when you enter Babylon[a], you will be there for many years and a long time, until seven generations; but after this I will bring you out from there in peace.
translation:
  language: de
  text: Wenn ihr nun nach Babylon kommt, werdet ihr dort viele Jahre und lange Zeit bleiben, bis sieben Generationen vergangen sind.[a] Danach aber werde ich euch von dort in Frieden herausführen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „bis sieben Generationen“; möglich ist auch: „sieben Generationen lang“. Die Zeitangabe kann die Dauer des Exils in gerundeter oder stilisierter Form bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσελθόντες οὖν εἰς Βαβυλῶνα
  choice: Wenn ihr nun nach Babylon kommt
  rationale: Das Aoristpartizip wird angesichts des zukünftigen Hauptverbs natürlich als temporaler Nebensatz wiedergegeben. „Nun“ bewahrt die fortführende beziehungsweise folgernde Kraft von οὖν.
- source_word: ἔσεσθε ἐκεῖ ἔτη πλείω καὶ χρόνον μακρόν
  choice: werdet ihr dort viele Jahre und lange Zeit bleiben
  rationale: „Bleiben“ gibt im Deutschen die aus dem Zusammenhang hervorgehende Dauer des Dortseins idiomatisch wieder. Beide Zeitangaben bleiben erhalten, sodass die rhetorische Verstärkung des Griechischen hörbar ist.
- source_word: ἕως γενεῶν ἑπτά
  choice: bis sieben Generationen vergangen sind
  rationale: Die Wiedergabe bewahrt ἕως als „bis“ und den Plural „sieben Generationen“, formuliert die im Griechischen knappe Zeitangabe jedoch als verständlichen deutschen Satz.
- source_word: μετὰ τοῦτο δὲ
  choice: Danach aber
  rationale: Die Formulierung erhält sowohl den zeitlichen Übergang als auch den leichten Gegensatz von δέ.
- source_word: ἐξάξω ὑμᾶς ἐκεῖθεν
  choice: werde ich euch von dort herausführen
  rationale: „Herausführen“ entspricht der Bewegungsrichtung des Verbs, ohne ausdrücklich eine Rückkehr oder Rettung hinzuzufügen.
- source_word: μετ’ εἰρήνης
  choice: in Frieden
  rationale: Die geläufige deutsche Wendung bewahrt Frieden als Zustand oder begleitenden Umstand des Herausführens.
theological_decisions:
- issue: Ob die abschließende Verheißung als Rückkehr oder Rettung präzisiert werden soll
  choice: werde ich euch von dort in Frieden herausführen
  alternative: werde ich euch von dort in Frieden zurückführen / retten
  rationale: ἐξάξω bezeichnet das Herausführen, nennt aber weder das Ziel noch ausdrücklich eine Rettung. Die Übersetzung vermeidet daher eine stärkere heilsgeschichtliche Präzisierung.
- issue: Wie die sieben Generationen zeitlich zu verstehen sind
  choice: bis sieben Generationen vergangen sind
  alternative: sieben Generationen lang / bis zur siebten Generation
  rationale: Der griechische Wortlaut hat ἕως mit dem Plural „sieben Generationen“. Die gewählte Fassung erhält diese Struktur, ohne sie zur „siebten Generation“ umzudeuten; die mögliche stilisierte oder gerundete Zeitangabe wird in der Fußnote offengehalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur ist flüssig, hält aber die doppelte Zeitangabe und den Gegensatz zwischen langem Aufenthalt und anschließendem friedlichem Herausführen fest.
