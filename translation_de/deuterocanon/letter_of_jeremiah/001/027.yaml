  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/027.yaml
  text: And their priests[a], taking back their sacrifices, make use of them; likewise their women, preserving some from them[b], give none to the poor or the helpless.
translation:
  language: de
  text: Ihre Priester verkaufen ihre Opfergaben[a] und nutzen sie für sich. Auch die Frauen pökeln etwas davon ein[b], geben aber weder einem Armen noch einem Hilflosen etwas ab.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „nehmen ihre Opfergaben zurück“. Das griechische Wort kann hier sowohl das Verkaufen als auch das Zurücknehmen beziehungsweise Wiederempfangen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Gemeint ist das Haltbarmachen von Lebensmitteln, wahrscheinlich von Opferfleisch durch Einsalzen.
    reason: cultural_note
lexical_decisions:
- source_word: ἀποδιδόμενοι
  choice: verkaufen
  rationale: Das Medium von ἀποδίδωμι kann im Zusammenhang mit Waren oder Besitz „verkaufen“ bedeuten. Bei Opfergaben passt dies zum Bild, dass die Priester die Gaben wirtschaftlich verwerten. Die ebenfalls mögliche Deutung „zurücknehmen/empfangen“ bleibt in einer Fußnote erhalten.
- source_word: καταχρῶνται
  choice: nutzen sie für sich
  rationale: καταχράομαι bezeichnet hier den Gebrauch beziehungsweise die volle Nutzung der Opfergaben. „Für sich nutzen“ gibt die im Kontext erkennbare eigennützige Aneignung wieder, ohne das stärker wertende „missbrauchen“ in den Text einzutragen.
- source_word: ταριχεύουσαι
  choice: pökeln … ein
  rationale: Das Verb bezeichnet das Haltbarmachen, besonders durch Salzen. „Einpökeln“ ist im Deutschen für die Konservierung von Fleisch präzise und verständlich.
- source_word: μεταδῶσιν
  choice: etwas abgeben
  rationale: μεταδίδωμι bedeutet, jemandem einen Anteil an etwas zu geben. „Etwas abgeben“ bringt den Gedanken des Teilens von den vorhandenen Vorräten idiomatisch zum Ausdruck.
- source_word: πτωχῷ
  choice: einem Armen
  rationale: Der substantivierte Singular bezeichnet repräsentativ einen armen Menschen; der deutsche Singular bewahrt die Form des Griechischen.
- source_word: ἀδυνάτῳ
  choice: einem Hilflosen
  rationale: ἀδύνατος bezeichnet einen Menschen ohne Kraft oder Möglichkeit, sich selbst zu helfen. „Hilfloser“ passt hier zur sozialen Bedürftigkeit und ist kontextuell treffender als das allgemeinere „Schwacher“.
theological_decisions:
- issue: Moralische Wertung der Aneignung von Opfergaben
  choice: Die Handlungen beschreibend wiedergeben und die eigennützige Nutzung nur aus dem Ausdruck „für sich“ hervortreten lassen.
  alternative: καταχρῶνται ausdrücklich mit „missbrauchen“ übersetzen.
  rationale: Der Zusammenhang übt deutliche Kritik, doch das Verb muss nicht zwingend die ausdrücklich moralische Bedeutung „missbrauchen“ tragen. Die beschreibende Wiedergabe bewahrt die Spannung und vermeidet eine zusätzliche Wertung.
- issue: Bezug von αἱ γυναῖκες
  choice: „ihre Frauen“
  alternative: „die Frauen“ oder „ihre Ehefrauen“
  rationale: Das Possessivpronomen ist im Griechischen an dieser Stelle nicht wiederholt; aus dem Zusammenhang liegt ein Bezug zu den Priestern beziehungsweise ihrem Umfeld nahe. „Ihre Frauen“ bewahrt dabei die mögliche Bedeutung „Ehefrauen“, ohne sie ausdrücklich festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Kurze, klare Satzglieder bewahren den polemisch-beschreibenden Ton. „Opfergaben“ vermeidet das im Deutschen mögliche Missverständnis, bei „Opfern“ seien Personen gemeint; „pökeln … ein“ macht die antike Konservierungspraxis konkret verständlich.
