  source_fidelity: Der erste Satz gibt Urheberschaft und handwerkliche Herstellung zuverlässig wieder. Im zweiten Satz schwächt „wozu die Handwerker sie machen wollen“ jedoch die im Griechischen ausdrücklich wiederholte Aussage des Werdens (γένηται / γενέσθαι) ab und kann eher Zweck als beabsichtigtes Ergebnis bezeichnen. „was die Handwerker aus ihnen machen wollen“ gibt die Abhängigkeit von der Gestaltung durch die Hersteller idiomatisch und quellentreu wieder.
