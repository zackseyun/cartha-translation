  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/045.yaml
  text: They are made by carpenters and goldsmiths; they can become nothing other than what the craftsmen want them to become.
translation:
  language: de
  text: Sie sind von Zimmerleuten und Goldschmieden gefertigt; sie können nichts anderes werden als das, was die Handwerker aus ihnen machen wollen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὑπὸ τεκτόνων
  choice: von Zimmerleuten
  rationale: Ὑπό mit Genitiv bezeichnet die handelnden Urheber; τέκτονες meint hier im Zusammenhang der Götzenherstellung konkret Holzhandwerker beziehungsweise Zimmerleute.
- source_word: χρυσοχόων
  choice: Goldschmieden
  rationale: Das Wort bezeichnet Handwerker, die Gold bearbeiten; „Goldschmiede“ ist die präzise und geläufige deutsche Entsprechung.
- source_word: κατεσκευασμένα εἰσίν
  choice: sind … angefertigt
  rationale: Die passive Perfektkonstruktion stellt die Figuren als von Menschen hergestellte Gegenstände dar. „Angefertigt“ bewahrt den handwerklichen Bezug und klingt im Deutschen natürlich.
- source_word: οὐθὲν ἄλλο μὴ γένηται
  choice: sie können nichts anderes werden
  rationale: Die ungewöhnlich formulierte griechische Aussage schließt aus, dass die Figuren unabhängig von ihren Herstellern etwas anderes werden. Die deutsche Fassung gibt diese Begrenzung verständlich wieder.
- source_word: βούλονται
  choice: wollen
  rationale: Das Verb bezeichnet den Willen beziehungsweise Wunsch der Handwerker; „wollen“ ist direkt und wahrt die Wiederholung in der Konstruktion.
- source_word: οἱ τεχνῖται
  choice: die Handwerker
  rationale: Der allgemeine Ausdruck für kundige Hersteller wird mit dem natürlichen und umfassenden deutschen Begriff „Handwerker“ wiedergegeben.
- source_word: αὐτὰ γενέσθαι
  choice: wozu … sie machen
  rationale: Wörtlich steht „dass sie werden“. In Verbindung mit dem Willen der Handwerker bezeichnet es die von ihnen bestimmte Gestalt oder Art. „Wozu … sie machen wollen“ drückt dies idiomatisch aus, ohne den Gedanken eigenständiger Entwicklung einzutragen.
theological_decisions:
- issue: Abhängigkeit der Götzen von menschlichen Herstellern
  choice: Die Figuren sind vollständig von den Absichten ihrer menschlichen Hersteller bestimmt und besitzen keine unabhängige Gestaltungsmacht.
  alternative: Eine streng wörtliche Fassung könnte lediglich sagen, dass nichts anderes geschehe, als die Handwerker sie werden lassen wollen.
  rationale: Der zweite Satzteil führt die Aussage über ihre menschliche Herstellung weiter und betont ihre völlige Abhängigkeit. Die Übersetzung wahrt die gegen den Götzendienst gerichtete Aussage, ohne zusätzliche Behauptungen über ihr Wesen einzuführen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, knappem Satzbau. „Zimmerleute“, „Goldschmiede“ und „Handwerker“ erhalten die konkrete handwerkliche Bildwelt; „angefertigt“ vermeidet sowohl einen industriellen Klang als auch unnötig altertümliche Sprache.
