  text: After taking garments from them[a], the priests clothe their wives and children.
translation:
  language: de
  text: Nachdem die Priester ihnen die Gewänder abgenommen haben,[a] kleiden sie damit ihre Frauen und Kinder.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint sind die Götzenbilder; das Pronomen verweist auf die im Zusammenhang beschriebenen Bilder.
    reason: cross_reference
lexical_decisions:
- source_word: ἀπὸ τοῦ ἱματισμοῦ αὐτῶν
  choice: ihnen die Gewänder
  rationale: Die Wendung bezeichnet die Entfernung der kollektiv verstandenen Kleidung von ihnen; die deutsche Dativ-Akkusativ-Konstruktion mit „abnehmen“ gibt dies natürlich und genau wieder.
- source_word: ἀφελόμενοι
  choice: Nachdem … abgenommen haben
  rationale: Das Aoristpartizip bezeichnet eine der Haupthandlung vorausgehende Handlung. Der temporale Nebensatz bildet diese Abfolge im modernen Deutsch klar ab.
- source_word: οἱ ἱερεῖς
  choice: die Priester
  rationale: Entspricht dem bestimmten griechischen Ausdruck ohne Hinzufügung eines Possessivpronomens.
- source_word: ἐνδύουσιν
  choice: kleiden … damit
  rationale: „Kleiden“ trifft das Anziehen anderer Personen; „damit“ macht im Deutschen natürlich deutlich, dass die zuvor abgenommenen Gewänder verwendet werden.
- source_word: τὰς γυναῖκας αὐτῶν καὶ τὰ παιδία
  choice: ihre Frauen und Kinder
  rationale: „Frauen“ bewahrt die gewöhnliche Bedeutung von γυναῖκας im Sinn von Ehefrauen, während παιδία allgemein und natürlich mit „Kinder“ wiedergegeben wird.
theological_decisions:
- issue: Bezugswort von αὐτῶν bei den Gewändern
  choice: Das Pronomen bleibt im Haupttext als „ihnen“ erhalten und bezieht sich kontextuell auf die Götzenbilder.
  alternative: Zur Verdeutlichung ausdrücklich „den Götzenbildern“ schreiben.
  rationale: Der griechische Vers nennt nur ein Pronomen. Die Übersetzung wahrt diese Form und erklärt den durch den Zusammenhang bestimmten Bezug in einer Fußnote, ohne die implizite Angabe in den Haupttext einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge bewahrt die zeitliche Beziehung des Partizips. „Damit“ vermeidet die mögliche Fehlauffassung, die Priester nähmen lediglich einzelne Gewänder an sich, und stellt den instrumentalen Zusammenhang mit dem Kleiden ihrer Familien natürlich her.
