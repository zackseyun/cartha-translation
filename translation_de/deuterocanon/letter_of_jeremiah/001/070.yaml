  text: In the same way[a], their wooden gods overlaid with gold and silver are made like a scarecrow in a garden, on which every bird sits, and also like a dead body thrown out in the dark.
translation:
  language: de
  text: Ebenso gleichen ihre hölzernen, mit Gold und Silber überzogenen Götter einer Vogelscheuche[a] in einem Garten, auf die sich jeder Vogel setzt, und auch einem Leichnam, der im Dunkeln hingeworfen wurde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „einem Pfahl / einer Wächterfigur in einem Garten“. Das griechische Wort ist selten; gemeint ist ein im Garten aufgestellter Gegenstand, auf dem die Vögel ungehindert sitzen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸν αὐτὸν τρόπον
  choice: Ebenso
  rationale: Die knappe Vergleichsformel gibt den Anschluss an das Vorhergehende natürlich und mit voller vergleichender Kraft wieder.
- source_word: βάμψῳ
  choice: einer Vogelscheuche
  rationale: Der seltene griechische Ausdruck bezeichnet im Zusammenhang einen in einem Garten aufgestellten Gegenstand, auf dem Vögel ungehindert sitzen. „Vogelscheuche“ vermittelt das Bild verständlich; die mögliche wörtlichere Deutung wird in der Fußnote bewahrt.
- source_word: ἐν κήπῳ
  choice: in einem Garten
  rationale: κήπος bedeutet gewöhnlich „Garten“; der Kontext verlangt keine Einengung auf einen Obstgarten.
- source_word: ἐφ’ ἧς πᾶν τὸ ὄρνεον ἐπικάθηται
  choice: auf die sich jeder Vogel setzt
  rationale: Die Relativkonstruktion und das Bild von Vögeln, die auf dem wirkungslosen Gegenstand Platz nehmen, werden direkt und in natürlichem Deutsch wiedergegeben.
- source_word: τῷ νεκρῷ ἐρριμμένῳ ἐν σκότει
  choice: einem Leichnam, der im Dunkeln hingeworfen wurde
  rationale: νεκρός wird hier konkret als „Leichnam“ verstanden; ἐρριμμένῳ bezeichnet das Hinwerfen oder achtlose Ablegen. „Im Dunkeln“ wahrt die räumliche Bildsprache von ἐν σκότει, ohne sie metaphysisch auszudeuten.
- source_word: ἀφωμοίωνται
  choice: gleichen
  rationale: Das Verb drückt Gleichsetzung beziehungsweise Ähnlichkeit aus. Das deutsche „gleichen“ ist idiomatisch und bewahrt die vergleichende Aussage, ohne eine zusätzliche handelnde Instanz einzuführen.
- source_word: οἱ θεοὶ αὐτῶν ξύλινοι καὶ περίχρυσοι καὶ περιάργυροι
  choice: ihre hölzernen, mit Gold und Silber überzogenen Götter
  rationale: ξύλινοι bezeichnet das Material als Holz; περίχρυσοι und περιάργυροι bezeichnen die äußere Bedeckung mit Gold und Silber. Die Formulierung ist klar und vermeidet die ungesicherte technische Präzisierung „vergoldet und versilbert“.
theological_decisions:
- issue: Aussagekraft des Vergleichs im Zusammenhang der Götzenkritik
  choice: 'Die Götterbilder werden mit leblosen und wirkungslosen Dingen verglichen: einer Gartenfigur, auf der Vögel sitzen, und einem hingeworfenen Leichnam.'
  alternative: Das Gartenbild könnte enger und wörtlicher als „Pfahl“ oder „Wächterfigur“ wiedergegeben werden.
  rationale: Die Übersetzung bewahrt die polemische Aussage über die Machtlosigkeit der Götterbilder, fügt aber keine ausdrückliche theologische Deutung hinzu. Die lexikalische Unsicherheit des ersten Vergleichs bleibt durch die Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt trotz der beiden Vergleiche gut verständlich; „Leichnam“ und „hingeworfen“ erhalten die schroffe Bildsprache des griechischen Textes.
