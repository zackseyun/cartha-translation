revisions:
- from: Denn mein Engel ist bei euch; er selbst sucht nach eurem Leben.[a]
  to: Denn mein Engel ist bei euch, und er selbst nimmt sich eures Lebens an.[a]
  rationale: Die Revision beseitigt die im Deutschen gegensinnige Assoziation von „nach jemandes Leben suchen“. „Sich eines Lebens annehmen“ wahrt den fürsorglich-zugewandten Sinn, der im Kontext von ἐκζητέω mit ψυχαί naheliegt, ohne ihn zu einer ausdrücklich genannten Schutz- oder Bewachungsfunktion auszubauen. Die Fußnote bleibt als Kennzeichnung der legitimen Alternative „Seelen“ erhalten; ihr Genitiv wird an die Satzkonstruktion angepasst.
