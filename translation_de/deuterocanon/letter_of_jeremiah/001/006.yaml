translation:
  language: de
  text: Denn mein Engel ist bei euch, und er selbst nimmt sich eures Lebens an.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »eurer Seelen«. Das griechische Wort kann »Seelen«, »Leben« oder »Personen« bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ γὰρ ἄγγελός μου
  choice: Denn mein Engel
  rationale: ἄγγελος kann »Bote« oder »Engel« bedeuten. In der göttlichen Rede und bei der hier vorausgesetzten Begleitung liegt die himmlische Bedeutung »Engel« näher; γάρ wird mit »denn« wiedergegeben.
- source_word: μεθʼ ὑμῶν ἐστίν
  choice: ist bei euch
  rationale: μετά mit Genitiv bezeichnet Gemeinschaft beziehungsweise Begleitung. »Bei euch« ist im modernen Deutsch natürlich und bewahrt den Sinn von »mit euch« ohne die mögliche Nebenbedeutung einer bloßen Zugehörigkeit.
- source_word: αὐτὸς
  choice: er selbst
  rationale: Das ausdrücklich gesetzte Pronomen ist emphatisch; »er selbst« erhält diese Hervorhebung.
- source_word: ἐκζητῶν
  choice: sucht nach
  rationale: ἐκζητέω bezeichnet ein nachdrückliches Suchen oder Aufsuchen. Die Wiedergabe bleibt nahe am griechischen Bild und deutet es nicht vorschnell als »beschützt« oder »wacht über« aus.
- source_word: τὰς ψυχὰς ὑμῶν
  choice: eurem Leben
  rationale: ψυχή kann Seele, Leben oder Person bezeichnen. Der kollektive Singular »euer Leben« ist im Deutschen idiomatisch und bringt hier die Sorge um das konkrete Leben der Angeredeten zum Ausdruck; die formal nähere Alternative »eure Seelen« wird in der Fußnote bewahrt.
theological_decisions:
- issue: Bedeutung von ψυχή im Zusammenhang göttlicher Begleitung
  choice: eurem Leben
  alternative: euren Seelen
  rationale: »Leben« wahrt den möglichen Bezug auf die ganze Person und vermeidet eine nicht ausdrücklich vorgegebene Trennung von Seele und Körper. Da »Seelen« lexikalisch und traditionell ebenfalls möglich ist, bleibt diese Lesart als Fußnote sichtbar.
- issue: Art des Wirkens des Engels
  choice: sucht nach
  alternative: wacht über
  rationale: Der griechische Wortlaut spricht vom Suchen, kann im Zusammenhang jedoch fürsorgliche oder schützende Aufmerksamkeit nahelegen. Die Übersetzung erhält das ungewöhnliche und mehrdeutige Bild, statt die Schutzfunktion ausdrücklich einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bleibt knapp und erhält durch »er selbst« die griechische Hervorhebung. Das semantisch offene Bild des Suchens wird nicht erklärend geglättet.
