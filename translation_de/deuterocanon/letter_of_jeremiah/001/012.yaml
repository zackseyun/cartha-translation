  text: They wipe off their faces because of the dust from the house[a], which is thick upon them.
translation:
  language: de
  text: Ihre Gesichter werden wegen des Staubs aus dem Haus abgewischt, der reichlich auf ihnen liegt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „der mehr auf ihnen ist“, das heißt: der in größerer Menge auf ihnen liegt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκμάσσονται
  choice: wischt man ihnen … ab
  rationale: Die mediale/passive Form steht hier in einem Zusammenhang, in dem die Götzen als hilflose Gegenstände menschlicher Pflege verspottet werden. Die unpersönliche deutsche Wendung mit „man“ gibt den Vorgang natürlich wieder, ohne die Götzen als selbstständig Handelnde darzustellen.
- source_word: τὸ πρόσωπον αὐτῶν
  choice: ihre Gesichter
  rationale: Der griechische Singular ist distributiv auf mehrere Götzen bezogen. Der deutsche Plural ist idiomatisch und bewahrt den Bezug auf die einzelnen Gesichter.
- source_word: διὰ τὸν … κονιορτόν
  choice: wegen des Staubs
  rationale: διά mit Akkusativ bezeichnet hier den Grund; κονιορτός meint konkret Staub, nicht allgemein Schmutz.
- source_word: ἐκ τῆς οἰκίας
  choice: aus dem Haus
  rationale: „Haus“ entspricht οἰκία formal und vermeidet die interpretierende Präzisierung als Tempel oder Heiligtum.
- source_word: ὃς ἐστιν πλείω ἐπʼ αὐτοῖς
  choice: der reichlich auf ihnen liegt
  rationale: πλείω bezeichnet hier eine größere beziehungsweise übermäßige Menge. „Reichlich“ ist im Deutschen verständlich, während die Fußnote den ungewöhnlicheren wörtlichen Ausdruck offenlegt.
theological_decisions:
- issue: Wer das Gesicht abwischt
  choice: Eine ungenannte menschliche Person wischt den Götzen die Gesichter ab.
  alternative: Die Form könnte formal so verstanden werden, als wischten die Götzen selbst ihre Gesichter ab.
  rationale: Der Kontext verspottet Götzen als hilflose Gegenstände, die menschlicher Pflege bedürfen. Das unpersönliche „man“ macht keine bestimmte Personengruppe zum Subjekt und bewahrt zugleich diese Pointe.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdig-sachlichem Ton. Die Satzstellung bleibt nahe am griechischen Bild; „Haus“ wahrt die lexikalische Offenheit des Ausgangstextes.
