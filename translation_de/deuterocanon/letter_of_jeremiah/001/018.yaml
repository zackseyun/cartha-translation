  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/018.yaml
  text: They light lamps for them, more than for themselves, though they cannot see a single one of them.
translation:
  language: de
  text: Sie zünden für sie mehr Lampen an als für sich selbst, doch die Götzen können keine einzige davon sehen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λύχνους
  choice: Lampen
  rationale: λύχνος bezeichnet konkret eine Lampe, gewöhnlich eine Öllampe; „Lampen“ bewahrt das Bild der kultischen Beleuchtung.
- source_word: καίουσιν
  choice: zünden … an
  rationale: Das Verb kann „brennen“ oder „entzünden“ bedeuten; mit „Lampen“ ist „anzünden“ im Deutschen natürlich und sachlich genau.
- source_word: πλείους ἢ ἑαυτοῖς
  choice: mehr … als für sich selbst
  rationale: Die Formulierung erhält den Vergleich zwischen den für die Götzen und den für die Verehrer selbst bestimmten Lampen, ohne ihn unnötig auszudeuten.
- source_word: ὧν οὐδένα
  choice: keine einzige davon
  rationale: Das Relativpronomen bezieht sich auf die Lampen; „keine einzige davon“ gibt die nachdrückliche Verneinung idiomatisch wieder.
- source_word: δύνανται ἰδεῖν
  choice: können … sehen
  rationale: Die schlichte Wiedergabe drückt unmittelbar die Unfähigkeit zum Sehen aus.
theological_decisions:
- issue: Unausgesprochenes Subjekt von δύνανται ἰδεῖν
  choice: „die Götzen“ ausdrücklich genannt
  alternative: Das Subjekt nur durch „sie“ wiederaufnehmen
  rationale: Der unmittelbare Zusammenhang verspottet die empfindungslosen Götzen; sie sind die Empfänger der Lampen und können diese dennoch nicht sehen. Die ausdrückliche Benennung verhindert im Deutschen, dass „sie“ fälschlich auf die Verehrer bezogen wird, ohne eine sachliche Mehrdeutigkeit des Kontexts aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der konkrete kultische Vorgang und die ironische Gegenüberstellung werden knapp und verständlich bewahrt.
