  text: Likewise[a], when lightning appears, it is clearly seen; and in the same way the wind blows in every land.
translation:
  language: de
  text: Ebenso ist auch der Blitz, wenn er erscheint, deutlich zu sehen; und genauso weht der Wind[a] in jedem Land.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort πνεῦμα kann auch „Geist“ oder „Atem“ bedeuten; hier sprechen der Zusammenhang mit Naturerscheinungen und das Verb „weht“ für „Wind“.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡσαύτως
  choice: Ebenso
  rationale: Gibt die vergleichende Anknüpfung an die vorangehenden Aussagen knapp und natürlich wieder.
- source_word: ἀστραπή
  choice: Blitz
  rationale: Bezeichnet einen Blitz beziehungsweise einen Blitzschein; „Blitz“ ist im Deutschen die natürliche Entsprechung.
- source_word: ὅταν ἐπιφάνῃ
  choice: wenn er erscheint
  rationale: Bewahrt die Grundbedeutung von ἐπιφαίνω, sichtbar zu werden oder in Erscheinung zu treten, ohne sie unnötig zu „aufblitzen“ zu spezifizieren.
- source_word: εὔοπτός ἐστιν
  choice: ist … deutlich zu sehen
  rationale: Gibt die Bedeutung „leicht erkennbar, klar sichtbar“ in natürlichem Deutsch wieder.
- source_word: τὸ δʼ αὐτό
  choice: und genauso
  rationale: Führt die parallele Beobachtung idiomatisch fort und erhält die vergleichende Funktion der Wendung.
- source_word: πνεῦμα
  choice: Wind
  rationale: Der Zusammenhang mit Naturerscheinungen sowie das Verb πνεῖ („weht“) sprechen hier deutlich für die meteorologische Bedeutung.
- source_word: ἐν πάσῃ χώρᾳ
  choice: in jedem Land
  rationale: χώρα kann Land, Gebiet oder Gegend bezeichnen; „in jedem Land“ wahrt den umfassenden Sinn und klingt würdig und verständlich.
- source_word: πνεῖ
  choice: weht
  rationale: Das Präsens formuliert eine allgemeine Beobachtung; „weht“ ist die übliche deutsche Verbindung mit „Wind“.
theological_decisions:
- issue: Bedeutung des potenziell theologisch geprägten Wortes πνεῦμα
  choice: Wind
  alternative: Geist oder Atem
  rationale: Obwohl πνεῦμα auch „Geist“ oder „Atem“ bedeuten kann, nennt der Vers beobachtbare Naturerscheinungen. Die Verbindung mit πνεῖ („weht“) und die Ortsangabe „in jedem Land“ stützen die Bedeutung „Wind“, ohne einen hier nicht geforderten pneumatologischen Sinn einzutragen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Satzbau. Die Wiederaufnahme des Vergleichs durch „Ebenso“ und „genauso“ bleibt erkennbar; das Semikolon bildet die Zweiteilung des griechischen Satzes ab.
