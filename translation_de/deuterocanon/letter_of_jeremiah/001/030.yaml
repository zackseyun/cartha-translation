translation:
  language: de
  text: Und in ihren Häusern sitzen die Priester auf ihren Sitzen[a]. Sie tragen zerrissene Untergewänder, ihre Köpfe und Bärte sind rasiert, und ihre Köpfe sind unbedeckt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sitzen feierlich da“. Das griechische Verb kann das Sitzen auf einem besonderen oder zeremoniellen Sitz bezeichnen; die wörtlich mögliche Verbindung mit einem Wagensitz ist in diesem Zusammenhang weniger wahrscheinlich.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διφρεύουσιν
  choice: sitzen ... auf ihren Sitzen
  rationale: Das seltene Verb ist mit δίφρος, einem Sitz beziehungsweise Wagen- oder Zeremonialsitz, verbunden. Im Zusammenhang mit den Häusern ist ein Sitzen auf Sitzen wahrscheinlicher als Wagenfahren. Die bewusst konkrete Wiedergabe vermeidet zugleich die stärker deutende Aussage, die Priester würden „thronen“.
- source_word: χιτῶνας
  choice: Untergewänder
  rationale: χιτών bezeichnet gewöhnlich das unmittelbar am Körper getragene Gewand. „Untergewänder“ ist im Deutschen verständlich und genauer als das allgemeinere „Kleider“, ohne ein prächtiges Obergewand anzudeuten.
- source_word: διερρωγότας
  choice: zerrissene
  rationale: Das Perfektpartizip beschreibt Gewänder, die zerrissen worden sind und sich in diesem Zustand befinden. „Zerrissen“ ist eine klare, gegenwärtige Wiedergabe.
- source_word: ἐξυρημένους
  choice: kahl geschoren
  rationale: Das Partizip bezeichnet die Entfernung der Haare. „Kahl geschoren“ lässt sich natürlich auf Kopf und Bart beziehen und gibt die sichtbare vollständige Rasur deutlich wieder.
- source_word: ἀκάλυπτοί
  choice: unbedeckt
  rationale: Das Adjektiv bedeutet unmittelbar „nicht bedeckt“ und bezieht sich hier ausdrücklich auf die Köpfe.
- source_word: οἴκοις
  choice: Häusern
  rationale: Die Grundbedeutung des griechischen Wortes wird bewahrt. Eine engere Deutung als „Tempel“ oder „Heiligtümer“ wird nicht in den Haupttext eingetragen.
theological_decisions:
- issue: Kultische Beschreibung der heidnischen Priester
  choice: Die sichtbaren Handlungen und Merkmale werden ohne ausdrückliche Deutung als Trauer- oder Ekstaseritus wiedergegeben.
  alternative: Die zerrissenen Gewänder und geschorenen Haare ausdrücklich als Trauerbräuche bezeichnen oder das Sitzen als kultisches Thronen deuten.
  rationale: Der griechische Text nennt konkrete äußere Merkmale, erklärt jedoch ihre rituelle Bedeutung nicht. Die Übersetzung wahrt diese Offenheit.
- issue: Mögliche zeremonielle Bedeutung von διφρεύουσιν
  choice: Die konkrete Sitzhaltung wird im Haupttext wiedergegeben und die mögliche zeremonielle Nuance in einer Fußnote erläutert.
  alternative: „thronen“ oder „sitzen feierlich da“ in den Haupttext setzen.
  rationale: Solche Formulierungen wären idiomatisch, würden aber eine zeremonielle oder herrschaftliche Bedeutung stärker festlegen, als das seltene griechische Verb sicher erkennen lässt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzfolge wurde zur besseren Verständlichkeit geteilt. Die Wiederholung von „Köpfe“ bleibt erhalten, weil auch der griechische Text den Körperteil erneut ausdrücklich nennt. Der Ausdruck „auf ihren Sitzen“ ist absichtlich konkret und etwas markiert, um das seltene griechische Verb nicht vorschnell als „thronen“ zu deuten.
