  text: Therefore you will know that they are not gods[a]; therefore do not fear them.
translation:
  language: de
  text: Daran werdet ihr erkennen, dass sie keine Götter sind.[a] Fürchtet euch also nicht vor ihnen!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Sie sind keine Götter.“ Die Pronomen beziehen sich auf die hier behandelten Götzenbilder und darüber hinaus auf die vermeintlichen Götter, die sie darstellen.'
    reason: Die Anmerkung verdeutlicht den Bezug der griechischen Pronomen, ohne die im Haupttext bewahrte Ausdrucksweise aufzulösen.
lexical_decisions:
- source_word: ὅθεν
  choice: Daran
  rationale: ὅθεν leitet hier die aus dem Vorhergehenden gewonnene Erkenntnis ein. „Daran“ verbindet die Aussage natürlich mit den zuvor genannten Beweisen für die Ohnmacht der Götzenbilder.
- source_word: γινώσεσθε
  choice: werdet ihr erkennen
  rationale: Das Futur von γινώσκω bezeichnet die Einsicht, zu der die Angesprochenen aufgrund des Vorhergehenden gelangen werden. „Erkennen“ passt zu diesem folgernden Zusammenhang.
- source_word: οὐκ εἰσὶν θεοί
  choice: sie keine Götter sind
  rationale: Die schlichte Verneinung bewahrt die polemische Aussage des griechischen Textes, ohne „Götter“ durch eine deutende Bezeichnung zu ersetzen.
- source_word: μὴ οὖν φοβεῖσθε
  choice: Fürchtet euch also nicht
  rationale: Die verneinte Aufforderung wird im Deutschen idiomatisch mit „Fürchtet euch nicht“ wiedergegeben; „also“ bewahrt die folgernde Kraft von οὖν.
- source_word: αὐτά
  choice: vor ihnen
  rationale: Das griechische Neutrum bezieht sich auf die behandelten Götzenbilder. Das deutsche Pronomen greift die als „Götter“ bezeichneten Gegenstände natürlich auf, ohne ein im Ausgangstext unausgesprochenes Substantiv einzufügen.
theological_decisions:
- issue: Bezug der Pronomen bei der Leugnung der Göttlichkeit und beim Verbot der Furcht
  choice: Die Pronomen bleiben unaufgelöst und beziehen sich im unmittelbaren Zusammenhang auf die Götzenbilder als vermeintliche Götter.
  alternative: Sie können darüber hinaus auf die durch die Bilder dargestellten heidnischen Götter bezogen werden.
  rationale: Der Kontext richtet sich unmittelbar gegen hergestellte Kultbilder, während die Aussage zugleich den Anspruch der von ihnen dargestellten Götter bestreitet. Die Übersetzung erhält diese Reichweite, statt sie im Haupttext einzuengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Daran … erkennen“ stellt den Schluss aus dem vorangehenden Zusammenhang flüssig dar; der Ausruf im zweiten Satz gibt der eindringlichen Aufforderung natürliches Gewicht.
