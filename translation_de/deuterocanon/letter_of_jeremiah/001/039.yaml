translation:
  language: de
  text: Wie sollte man sie also für Götter halten oder Götter nennen?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Förmlicher: „Wie sind sie also als Götter anzusehen oder zu bezeichnen?“'
    reason: lexical_alternative
lexical_decisions:
- source_word: πῶς οὖν
  choice: Wie … also
  rationale: Die Verbindung leitet eine rhetorische Schlussfolgerung aus der vorhergehenden Kritik an den Götzen ein; die deutsche Satzstellung gibt sowohl die Frage als auch die Folgerung natürlich wieder.
- source_word: νομιστέον
  choice: kann man sie … für Götter halten
  rationale: Das Verbaladjektiv hat unpersönlich-deontischen Sinn. In der rhetorischen Frage bringt „kann man“ die bestrittene Angemessenheit der Einschätzung idiomatisch zum Ausdruck, ohne eine bloße Fähigkeit zu behaupten.
- source_word: ἢ
  choice: oder
  rationale: Bewahrt die einfache Disjunktion zwischen Einschätzung und Benennung.
- source_word: κλητέον
  choice: Götter nennen
  rationale: Gibt die deontische Aussage über die Benennung direkt und in natürlichem Deutsch wieder.
- source_word: αὐτούς
  choice: sie
  rationale: Bezieht sich auf die zuvor behandelten Götzen und bleibt wie im Griechischen pronominal.
- source_word: ὑπάρχειν
  choice: für … halten
  rationale: Der Infinitiv ergänzt νομιστέον und bezeichnet, als was sie gelten sollen. Die deutsche Konstruktion „für Götter halten“ gibt diese Funktion natürlich wieder.
- source_word: θεούς
  choice: Götter
  rationale: Die direkte Wiedergabe wahrt die polemische Frage, ob den Götzen diese Bezeichnung zukommt.
theological_decisions:
- issue: Rhetorische und deontische Kraft von νομιστέον und κλητέον
  choice: Als rhetorische Frage formuliert, ob man die Götzen für Götter halten oder so nennen kann
  alternative: Wie sollte man sie also als Götter ansehen oder bezeichnen?
  rationale: Die Formulierung bestreitet die Berechtigung sowohl der Einschätzung als auch der Benennung, ohne über die Aussage des griechischen Textes hinaus eine zusätzliche metaphysische Behauptung einzuführen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem rhetorischem Ton. Die Wiederholung von „Götter“ vermeidet die im Deutschen missverständliche Lesart „sie Götter nennen“ und hält beide griechischen Prädikationen klar zusammen.
