  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/043.yaml
  text: But whenever one of them is dragged away by one of the passersby and lies with him[a], she reproaches the one next to her because she was not deemed worthy as she was[c][b], nor was her cord broken.
translation:
  language: de
  text: Wenn aber eine von ihnen von einem der Vorübergehenden fortgezogen wird[a] und mit ihm schläft[b], macht sie derjenigen neben ihr Vorwürfe, weil diese nicht wie sie selbst für würdig erachtet worden ist und auch ihre Schnur nicht zerrissen wurde[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „weggezogen“ beziehungsweise „fortgeführt“. Das griechische Wort bezeichnet ein Mit- oder Fortziehen; wie gewaltsam dies geschieht, bleibt offen.'
    reason: lexical_alternative
  - marker: b
    text: „Mit ihm schläft“ ist hier eine verhüllende Ausdrucksweise für Geschlechtsverkehr.
    reason: cultural_note
  - marker: c
    text: Die „Schnur“ ist wahrscheinlich eine Befestigung am Götzenbild. Die Satire stellt die weiblich dargestellten Figuren so dar, als wetteiferten sie um sexuelle Aufmerksamkeit.
    reason: cultural_note
lexical_decisions:
- source_word: ἐφελκυσθεῖσα
  choice: fortgezogen wird
  rationale: Das passive Partizip bezeichnet ein Ziehen oder Fortführen. „Fortgezogen“ bewahrt den körperlichen Zug der Szene, ohne eine Gewaltintensität festzulegen, die das griechische Wort allein nicht eindeutig bestimmt.
- source_word: ὑπό τινος τῶν παραπορευομένων
  choice: von einem der Vorübergehenden
  rationale: Die Formulierung gibt sowohl die unbestimmte Einzelperson als auch die Gruppe der Vorübergehenden direkt und idiomatisch wieder.
- source_word: κοιμηθῇ
  choice: mit ihm schläft
  rationale: Das Verb „schlafen“ wird hier euphemistisch für Geschlechtsverkehr gebraucht. Die deutsche Wendung wahrt den Euphemismus und macht den kontextuellen Sinn verständlich.
- source_word: τὴν πλησίον
  choice: der neben ihr
  rationale: Das substantivierte Femininum bezeichnet die unmittelbar benachbarte weiblich dargestellte Gestalt. Die räumliche Formulierung ist genauer als „ihrer Nächsten“.
- source_word: ὀνειδίζει
  choice: macht … Vorwürfe
  rationale: Die Wendung gibt das Tadeln oder Beschimpfen in natürlichem modernem Deutsch wieder und wahrt den spöttischen Ton.
- source_word: οὐκ ἠξίωται
  choice: nicht … für würdig erachtet worden ist
  rationale: Das Perfekt Passiv und der wertende Gehalt von ἀξιόω werden formal deutlich wiedergegeben.
- source_word: ὥσπερ καὶ αὐτή
  choice: wie sie selbst
  rationale: Die knappe Vergleichsformulierung bewahrt den Bezug auf die zuerst genannte Gestalt, ohne den Satz unnötig auszubauen.
- source_word: τὸ σχοινίον αὐτῆς διεράγη
  choice: ihre Schnur nicht zerrissen wurde
  rationale: „Schnur“ ist die direkte Bedeutung von σχοινίον; „zerrissen wurde“ bildet den passiven Aorist von διαρρήγνυμι sachgerecht ab und lässt das ungewöhnliche Bild stehen.
theological_decisions:
- issue: Bezug der weiblichen Gestalten
  choice: Der Haupttext stellt weiblich personifizierte Götzenbilder dar.
  alternative: Gemeint sein könnten Frauen, die mit einem Götzenheiligtum verbunden sind.
  rationale: Die weiblichen Formen, die benachbarte Stellung und die erwähnte Schnur passen im unmittelbaren satirischen Zusammenhang am besten zu personifizierten Götzenbildern. Die Anmerkung zur Schnur kennzeichnet die verbleibende Unsicherheit.
- issue: Bezug der Pronomen im Begründungssatz
  choice: „diese“ bezeichnet die benachbarte Gestalt; „sie selbst“ die fortgezogene Gestalt.
  alternative: Die gedrängte griechische Pronominalfolge könnte bei isolierter Betrachtung anders bezogen werden.
  rationale: 'Die gewählte Zuordnung ergibt den natürlichen Kontrast: Die fortgezogene Gestalt verhöhnt die benachbarte, weil diese nicht dieselbe vermeintliche Auszeichnung erfahren hat. Der satirische Gedankengang bleibt dadurch nachvollziehbar.'
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst beibehaltenem satirischem und groteskem Bild. Die ungewöhnliche Wertung „für würdig erachtet“ bleibt erhalten, weil sie den Spott des griechischen Textes trägt; die Euphemismen und die Unsicherheit um die Schnur werden nicht geglättet.
