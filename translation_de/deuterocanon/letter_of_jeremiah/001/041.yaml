  text: And they themselves cannot[a], even though they perceive it, leave them behind, for they have no perception.
translation:
  language: de
  text: Und sie selbst können sie nicht zurücklassen, auch wenn sie Einsicht hätten; denn sie haben keine Wahrnehmung.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐ δύνανται
  choice: können … nicht
  rationale: Gibt die ausgesagte Unfähigkeit knapp und idiomatisch wieder.
- source_word: αὐτοὶ
  choice: sie selbst
  rationale: Bewahrt die emphatische Stellung des Pronomens und betont die eigene Handlungsunfähigkeit der Götzen.
- source_word: νοήσαντες
  choice: auch wenn sie es erkennen
  rationale: Der Aoristpartizip kann im polemischen Zusammenhang konzessiv verstanden werden; „erkennen“ wahrt den Bezug auf geistiges Erfassen, ohne es mit αἴσθησις gleichzusetzen.
- source_word: καταλιπεῖν αὐτά
  choice: sie zurücklassen
  rationale: Bewahrt sowohl den knappen pronominalen Bezug als auch den räumlichen Grundsinn von καταλείπω, ohne den nicht ausdrücklich genannten Referenten festzulegen.
- source_word: αἴσθησιν
  choice: Wahrnehmung
  rationale: Bezeichnet Wahrnehmungsvermögen beziehungsweise Empfindungsfähigkeit und passt zur Polemik gegen leblose Götzen.
- source_word: οὐκ ἔχουσιν
  choice: sie haben keine
  rationale: Natürliche deutsche Wiedergabe der verneinten Besitzangabe.
theological_decisions:
- issue: Bezug und rhetorische Funktion innerhalb der Götzenpolemik
  choice: „sie selbst“ bezeichnet emphatisch die Götzen als handlungsunfähig und wahrnehmungslos.
  alternative: Das Pronomen könnte ohne besonderen Nachdruck nur mit „sie“ wiedergegeben werden.
  rationale: Der griechische Gebrauch von αὐτοὶ trägt Nachdruck; dieser wird bewahrt, ohne über die Aussage des Textes hinauszugehen.
- issue: Sinn des Partizips νοήσαντες
  choice: 'Konzessiv: „auch wenn sie es erkennen“'
  alternative: 'Umstand beziehungsweise Vorzeitigkeit: „nachdem sie es erkannt haben“ oder „obwohl sie erkannt haben“'
  rationale: 'Die konzessive Fassung erhält die Ironie und die Spannung des Satzes: Selbst unter der angenommenen Voraussetzung des Erkennens sind die Götzen nicht handlungsfähig. Die wörtlichere Möglichkeit bleibt in der Fußnote sichtbar.'
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der knappe polemische Satzbau und die absichtliche Spannung zwischen einem zugestandenen Erkennen und fehlender Wahrnehmung bleiben erhalten; der unbestimmte Bezug des sächlichen Plurals αὐτά wird nicht erläuternd aufgelöst.
