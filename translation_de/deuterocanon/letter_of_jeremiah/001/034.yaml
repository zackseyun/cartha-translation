base_translation:
  language: en
  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/034.yaml
  text: Likewise[a], they are certainly not able to give either wealth or bronze; if someone makes a vow to them and does not pay it back[b], they will certainly not seek it.
translation:
  language: de
  text: Ebenso sind sie keinesfalls imstande, Reichtum oder Bronze[a] zu geben. Wenn jemand ihnen ein Gelübde ablegt und es nicht erfüllt, werden sie es ganz gewiss nicht einfordern.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Kupfer“; möglicherweise sind Geld oder Wertgegenstände aus Bronze beziehungsweise Kupfer gemeint.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „werden sie ganz gewiss nicht danach suchen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡσαύτως
  choice: Ebenso
  rationale: Leitet knapp und natürlich ein weiteres paralleles Beispiel für die Machtlosigkeit der Götzen ein.
- source_word: πλοῦτον
  choice: Reichtum
  rationale: Bezeichnet allgemein Wohlstand oder Reichtümer und ist hier weiter gefasst als bloßes Geld.
- source_word: χαλκόν
  choice: Bronze
  rationale: Gibt die ausdrückliche Metallbezeichnung des Griechischen wieder; Kupfer und ein Bezug auf Geld oder metallene Wertgegenstände bleiben als Möglichkeiten in der Fußnote erhalten.
- source_word: οὐ μὴ δύνωνται δοῦναι
  choice: sind sie keinesfalls imstande ... zu geben
  rationale: Die Formulierung bewahrt die nachdrückliche Verneinung durch οὐ μή, ohne im Deutschen schwerfällig zu wirken.
- source_word: ἐάν τις αὐτοῖς εὐχὴν εὐξάμενος
  choice: Wenn jemand ihnen ein Gelübde ablegt
  rationale: Die figura etymologica aus εὐχή und εὔχομαι bezeichnet idiomatisch das Ablegen eines Gelübdes.
- source_word: μὴ ἀποδῷ
  choice: es nicht erfüllt
  rationale: Bei einem Gelübde bedeutet ἀποδίδωμι, das Gelobte zu leisten beziehungsweise das Gelübde zu erfüllen; dies ist im Deutschen natürlicher und genauer als „zurückzahlen“.
- source_word: οὐ μὴ ἐπιζητήσωσιν
  choice: werden sie es ganz gewiss nicht einfordern
  rationale: ἐπιζητέω kann „suchen“ oder „einfordern“ bedeuten. Im Zusammenhang eines nicht erfüllten Gelübdes drückt „einfordern“ die gemeinte Rechenschaft verständlich aus; die wörtlichere Möglichkeit steht in der Fußnote. „Ganz gewiss nicht“ bewahrt die emphatische Negation.
theological_decisions:
- issue: Art der Machtlosigkeit der Götzen im Blick auf Gelübde
  choice: Die Götzen können weder materiellen Wohlstand geben noch die Erfüllung eines ihnen abgelegten Gelübdes einfordern.
  alternative: Der letzte Satz kann wörtlicher mit „sie werden nicht danach suchen“ wiedergegeben werden; χαλκόν kann außerdem konkret Geld oder metallene Wertgegenstände meinen.
  rationale: Der Text verspottet die Götzen als machtlos, ohne weitergehende theologische Behauptungen einzuführen. Die Übersetzung wahrt sowohl die materielle Aussage als auch den Gedanken fehlender Rechenschaftsforderung.
translation_notes:
  register: 'Modernes, würdevolles Standarddeutsch. Die zweimalige emphatische Verneinung mit οὐ μή wird unterschiedlich, aber jeweils deutlich wiedergegeben: „keinesfalls“ und „ganz gewiss nicht“. Die Fußnotenmarker stehen unmittelbar bei den jeweils erläuterten Ausdrücken.'
