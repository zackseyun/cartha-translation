  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/004.yaml
  text: Therefore be on your guard[a], lest you too, having become like the foreigners, become like them, and fear seize you because of them,
translation:
  language: de
  text: Hütet euch also, damit nicht auch ihr, den Fremden gleich geworden, ihnen gleich werdet[a] und euch ihretwegen die Furcht ergreift.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich wiederholt das Griechische dasselbe Verb: „den Fremden gleich geworden, ihnen gleich werdet“. Die Wiederholung verstärkt die Warnung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλαβήθητε
  choice: Hütet euch
  rationale: Der Aorist-Passiv-Imperativ steht hier als eindringliche Warnung. „Hütet euch“ ist im heutigen Deutsch klar und würdig, ohne die mögliche, hier aber irreführende Bedeutung „seid ehrfürchtig“ aufzunehmen.
- source_word: οὖν
  choice: also
  rationale: „Also“ kennzeichnet knapp und natürlich die Folgerung aus der vorausgehenden Warnung.
- source_word: μὴ καὶ ὑμεῖς
  choice: damit nicht auch ihr
  rationale: Die Formulierung gibt die warnende Negativkonstruktion wieder und bewahrt die Hervorhebung, dass auch die Angesprochenen dieser Gefahr ausgesetzt sind.
- source_word: ἀφομοιωθέντες ... ἀφομοιωθῆτε
  choice: gleich geworden ... gleich werdet
  rationale: Die Wiederholung desselben Verbs im Partizip und in der finiten Verbform bleibt trotz ihrer auffälligen Redundanz erhalten; so wird die emphatische, im Griechischen nicht vollständig geglättete Formulierung nicht stillschweigend aufgelöst.
- source_word: τοῖς ἀλλοφύλοις
  choice: den Fremden
  rationale: ἀλλόφυλοι bezeichnet Menschen eines anderen Volkes. „Die Fremden“ ist verständlich und vermeidet die später technisch-theologische Färbung von „Heiden“.
- source_word: φόβος ὑμᾶς λάβῃ
  choice: euch ... Furcht ergreift
  rationale: Die Wendung bewahrt das lebhafte Bild der Furcht, die einen Menschen ergreift.
- source_word: ἐπʼ αὐτοῖς
  choice: ihretwegen
  rationale: Die kausale beziehungsweise anlassbezogene Bedeutung von ἐπί wird idiomatisch wiedergegeben. Das Pronomen bleibt stehen, ohne seinen Bezug über das Griechische hinaus ausdrücklich festzulegen.
theological_decisions:
- issue: Tragweite der Warnung mit ἀφομοιόω
  choice: Die allgemeine Formulierung einer Angleichung an die Fremden bleibt erhalten.
  alternative: Die Warnung ausdrücklich auf die Übernahme ihres Götzendienstes einengen.
  rationale: Der nähere Zusammenhang legt eine Warnung vor Angleichung im Umgang mit fremden Göttern nahe; der Vers selbst nennt diese Einschränkung jedoch nicht ausdrücklich. Daher wird sie nicht in den Haupttext eingetragen.
- issue: Bezug von αὐτοῖς in ἐπʼ αὐτοῖς
  choice: Das mehrdeutige Pronomen wird mit „ihretwegen“ wiedergegeben.
  alternative: Den Bezug ausdrücklich als „vor den Fremden“ oder „wegen der Götzen“ bestimmen.
  rationale: Form und Zusammenhang lassen den Anlass der Furcht erkennen, bestimmen den Bezug im vorliegenden Satz aber nicht so eindeutig, dass die Übersetzung ihn ohne Weiteres festlegen sollte.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die auffällige griechische Wiederholung wird im Haupttext bewahrt und in der Fußnote erläutert; „Fremde“ vermeidet eine unnötige konfessionelle oder ethnisch wertende Zuspitzung.
