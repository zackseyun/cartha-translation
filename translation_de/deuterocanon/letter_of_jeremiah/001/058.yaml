  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/058.yaml
  text: So a king who displays his own courage is better than the false gods[a], or a useful vessel in a house, which its owner will use, or a door in a house that keeps safe the things in it, or the false gods, and a wooden pillar in palaces is better than the false gods.
translation:
  language: de
  text: Daher ist ein König, der seinen eigenen Mut beweist, besser als die falschen Götter, oder ein nützliches Gefäß in einem Haus, das sein Besitzer gebrauchen wird, besser als die falschen Götter; auch eine Tür in einem Haus, die schützt, was sich darin befindet, ist besser als die falschen Götter; ebenso ist eine Holzsäule in Palästen besser als die falschen Götter.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Griechischen wird „als die falschen Götter“ dreimal wiederholt. Die Wiederholung unterstreicht den polemischen Gegensatz.
    reason: Die wiederholte griechische Vergleichsformel ist für Rhythmus und Aussagegewicht des Verses bedeutsam.
lexical_decisions:
- source_word: ὥστε
  choice: Daraus folgt
  rationale: Kennzeichnet eine Schlussfolgerung aus dem vorhergehenden Gedankengang; die Formulierung ist im heutigen Deutsch klar und würdevoll.
- source_word: κρεῖσσον
  choice: besser
  rationale: Gibt den wertenden Komparativ unmittelbar wieder und trägt den polemischen Gegensatz zu den Götzen.
- source_word: βασιλέα ἐπιδεικνύμενον τὴν ἑαυτοῦ ἀνδρείαν
  choice: ein König, der seinen eigenen Mut beweist
  rationale: Bewahrt den generischen Sinn von βασιλέα, den aktiven Gehalt von ἐπιδεικνύμενον und die reflexive Betonung von ἑαυτοῦ.
- source_word: σκεῖος ἐν οἰκίᾳ χρήσιμον
  choice: ein nützliches Gefäß in einem Haus
  rationale: „Gefäß“ wahrt die breite Bedeutung von σκεῖος, während „nützlich“ den entscheidenden Gegensatz zur Nutzlosigkeit der Götzen ausdrückt.
- source_word: ἐφʼ ᾧ χρήσεται ὁ κεκτημένος
  choice: das sein Besitzer gebrauchen wird
  rationale: Gibt den praktischen Nutzen des Gegenstands in natürlichem Deutsch wieder; ὁ κεκτημένος bezeichnet hier den Besitzer.
- source_word: οἱ ψευδεῖς θεοί
  choice: die falschen Götter
  rationale: ψευδεῖς kennzeichnet sie als unecht und der Wahrheit nicht entsprechend; „falsche Götter“ ist die klare, idiomatische Wiedergabe.
- source_word: θύρα ἐν οἰκίᾳ διασώζουσα τὰ ἐν αὐτῇ ὄντα
  choice: eine Tür in einem Haus, die bewahrt, was sich darin befindet
  rationale: Erhält die Schutzfunktion der Tür und lässt den Bezug des griechischen αὐτῇ auf den Hauskontext in ähnlich knapper Weise stehen.
- source_word: ξύλινος στύλος ἐν βασιλείοις
  choice: eine Holzsäule in Palästen
  rationale: Gibt das gewöhnliche architektonische Objekt und den Plural der königlichen Gebäude knapp und anschaulich wieder.
theological_decisions:
- issue: Polemische Vergleiche mit οἱ ψευδεῖς θεοί
  choice: Die wiederholte ausdrückliche Gegenüberstellung mit den falschen Göttern wird beibehalten.
  alternative: Alle nützlichen Personen und Gegenstände in einer einzigen geglätteten Aufzählung zusammenfassen und den Vergleich nur einmal nennen.
  rationale: Die Wiederholung gehört zur rhetorischen Wirkung des griechischen Textes und unterstreicht die Nutzlosigkeit der Götzen, ohne eine weitergehende dogmatische Deutung einzutragen.
- issue: Lockere Syntax des ersten Vergleichs
  choice: König und Gefäß werden als zwei Alternativen gemeinsam vor die erste ausdrückliche Vergleichsformel gestellt.
  alternative: „Besser“ nach jedem einzelnen Glied ergänzen oder die erste Folge von ἤ ausschließlich als direkte Einzelvergleiche auffassen.
  rationale: Die griechische Folge verbindet König und nützliches Gefäß mit ἤ, bevor οἱ ψευδεῖς θεοί genannt werden. Die deutsche Fassung macht diese Struktur verständlich, ohne zusätzliche Vergleichsformeln in den Text einzutragen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die lockere Reihung des griechischen Satzes wird vorsichtig geordnet, während seine wiederholte polemische Vergleichsstruktur erhalten bleibt.
