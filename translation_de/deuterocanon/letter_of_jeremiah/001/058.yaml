- from: 'Daraus folgt: Besser als die falschen Götter[a] ist ein König, der seinen eigenen Mut beweist, oder ein nützliches Gefäß in einem Haus, das sein Besitzer gebrauchen wird. Auch eine Tür in einem Haus, die bewahrt, was sich darin befindet, ist besser als die falschen Götter; ebenso eine Holzsäule in Palästen.'
