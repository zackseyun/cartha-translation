  naturalness: Der Satz ist grundsätzlich verständlich, aber „Daraus folgt:“ ist als Schlussmarker etwas schwerer als nötig, und die Verbindung von König und Gefäß mit nur einer Vergleichsformel kann im Deutschen klarer gegliedert werden. „schützt“ ist für die Funktion einer Tür idiomatischer als „bewahrt“.
  terminology: „falsche Götter“, „König“, „Mut“, „nützliches Gefäß“, „Tür“ und „Holzsäule“ sind sachgerecht. Die Fußnote muss die tatsächlich dreimalige griechische Wiederholung benennen und darf nicht behaupten, sie werde im weiteren Satz nur zweimal wiederholt, wenn der Zieltext eine Wiederholung auslässt.
