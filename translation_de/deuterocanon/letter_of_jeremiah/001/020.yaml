lexical_decisions:
- source_word: μεμελανωμένον
  choice: geschwärzt
  rationale: Das Perfektpassiv-Partizip von μελανόω bezeichnet einen eingetretenen und fortbestehenden Zustand. »Geschwärzt« gibt die konkrete sichtbare Wirkung natürlich und präzise wieder.
- source_word: τὸ πρόσωπον αὐτῶν
  choice: ihre Gesichter
  rationale: Obwohl πρόσωπον im Griechischen im Singular steht, bezeichnet es bei dem pluralischen Besitzer αὐτῶν distributiv das Gesicht jedes Einzelnen. Im Deutschen ist dafür der Plural »ihre Gesichter« idiomatisch.
- source_word: ἀπὸ τοῦ καπνοῦ
  choice: vom Rauch
  rationale: ἀπό bezeichnet hier Ursache beziehungsweise Ursprung der Schwärzung; »vom Rauch geschwärzt« ist im Deutschen natürlich und quellennah.
- source_word: τοῦ ἐκ τῆς οἰκίας
  choice: aus dem Haus
  rationale: ἐκ bezeichnet die Herkunft des Rauchs. οἰκία bedeutet grundsätzlich »Haus«; diese Wiedergabe bewahrt die lexikalische Offenheit, während der kultische Kontext auch ein Heiligtum oder einen Tempel nahelegen kann.
theological_decisions:
- issue: Ob οἰκία im Zusammenhang mit Götzenbildern deutend als »Heiligtum« oder »Tempel« wiederzugeben ist
  choice: Haus
  alternative: Heiligtum; Tempel
  rationale: Der griechische Text verwendet das allgemeine Wort οἰκία und keinen ausdrücklich kultischen Gebäudebegriff. Daher bleibt »Haus« im Haupttext stehen; die kontextuell möglichen Deutungen werden in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die partizipiale Struktur des griechischen Satzfragments bleibt erhalten; die Wortstellung »vom Rauch aus dem Haus geschwärzt« macht eindeutig, dass »aus dem Haus« den Rauch näher bestimmt.
