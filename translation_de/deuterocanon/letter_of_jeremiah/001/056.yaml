base_translation:
  language: en
  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/056.yaml
  text: How then can it be accepted or supposed that they are gods? Wooden gods overlaid with silver and overlaid with gold will certainly not save themselves from thieves or robbers[a][b].
translation:
  language: de
  text: Wie kann man also anerkennen oder annehmen, dass sie Götter sind?[a] Götter aus Holz, mit Silber und Gold überzogen,[b] werden sich ganz gewiss weder vor Dieben noch vor Räubern retten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »Wie sollte man also gelten lassen oder meinen, dass sie Götter sind?« Die beiden griechischen Verbaladjektive verstärken die rhetorische Frage.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »hölzerne Götter, silberüberzogen und goldüberzogen«. Die Formulierung hebt ironisch hervor, dass diese vermeintlichen Götter angefertigte Gegenstände sind.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πῶς οὖν
  choice: Wie kann man da
  rationale: Gibt die folgernde Kraft von οὖν und den rhetorischen Charakter der Frage in natürlichem modernem Deutsch wieder.
- source_word: ἐκδεκτέον ἢ νομιστέον
  choice: akzeptieren oder annehmen
  rationale: Die beiden unpersönlichen Verbaladjektive fordern dazu heraus, die behauptete Göttlichkeit gelten zu lassen oder gedanklich anzunehmen. Die Doppelung des Griechischen bleibt erhalten.
- source_word: ὅτι εἰσὶν θεοί
  choice: dass sie Götter sind
  rationale: Bewahrt die ausdrückliche Bezeichnung θεοί und damit die Ironie der Polemik, ohne sie im Haupttext durch »Götzen« auszudeuten.
- source_word: Οὔτε ἀπὸ κλεπτῶν οὔτε ἀπὸ ληστῶν
  choice: weder vor Dieben noch vor Räubern
  rationale: Bewahrt die korrelative Verneinung und den Unterschied zwischen κλέπται und λῃσταί in idiomatischem Deutsch.
- source_word: οὐ μὴ διασώσωνται
  choice: werden sich ganz gewiss … nicht retten
  rationale: Die verstärkte Verneinung οὐ μή wird durch »ganz gewiss« ausgedrückt; die mediale Form erscheint reflexiv und unterstreicht, dass die vermeintlichen Götter nicht einmal sich selbst retten können.
- source_word: θεοὶ ξύλινοι
  choice: Götter aus Holz
  rationale: Gibt die Materialangabe ξύλινοι klar wieder und behält θεοί wegen der beabsichtigten Ironie bei.
- source_word: περιάργυροι καὶ περίχρυσοι
  choice: mit Silber und Gold überzogen
  rationale: Die beiden Zusammensetzungen bezeichnen eine äußere Bedeckung mit Silber beziehungsweise Gold. Die knappe deutsche Verbindung vermeidet eine schwerfällige Wiederholung.
theological_decisions:
- issue: Wiedergabe von θεοί in der Polemik gegen den Götzendienst
  choice: Götter
  alternative: Götzen; sogenannte Götter
  rationale: Der griechische Text nennt die Gegenstände ausdrücklich θεοί, während ihre Ohnmacht den Anspruch ironisch widerlegt. »Götter« bewahrt diese Spannung und fügt keine Deutung in den Wortlaut ein.
- issue: Eigenrettung der vermeintlichen Götter
  choice: werden sich … nicht retten
  alternative: werden keinesfalls gerettet werden; werden nicht entkommen
  rationale: 'Die mediale Form lässt eine reflexive Wiedergabe zu und verschärft die Ironie: Sie können nicht einmal sich selbst vor menschlichen Tätern bewahren. Die passive beziehungsweise intransitive Nuance bleibt als Übersetzungsalternative möglich.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Schärfe und die Ironie des griechischen Textes bleiben erhalten; »ganz gewiss« bildet die emphatische Verneinung ab. Die Bezeichnungen »Götter«, »Diebe« und »Räuber« folgen der konkreten Wortwahl der Vorlage.
