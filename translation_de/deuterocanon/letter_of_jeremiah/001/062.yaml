  text: And the fire sent from above[a], to consume mountains and forests, does what it was appointed to do[b]; but these are not comparable to it either in appearance or in power.
translation:
  language: de
  text: Auch das Feuer, das von oben gesandt wurde, um Berge und Wälder zu verzehren, tut, was angeordnet ist[a]; diese aber sind ihm weder an Gestalt noch an Kraft vergleichbar[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „tut, was festgesetzt worden ist“ oder „tut das Aufgetragene“. Der griechische Ausdruck kann das Angeordnete, Aufgetragene oder Festgesetzte bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „sind ihm weder an Gestalt noch an Kraft gleichgemacht“ beziehungsweise „ähnlich gemacht“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τό τε πῦρ
  choice: Auch das Feuer
  rationale: πῦρ bezeichnet wörtlich „Feuer“; τε bindet dieses Beispiel an die vorausgehende Argumentation an und wird im Deutschen natürlich mit „auch“ wiedergegeben.
- source_word: ἐξαποσταλὲν ἄνωθεν
  choice: das von oben ausgesandt wird
  rationale: Die Formulierung bewahrt Herkunft und Bewegung des griechischen Ausdrucks, ohne „Himmel“ oder „Gott“ ausdrücklich hinzuzufügen.
- source_word: ἐξαναλῶσαι
  choice: um … zu verzehren
  rationale: Der Infinitiv bezeichnet hier Ziel oder Wirkung des Feuers; „verzehren“ ist im Zusammenhang mit Feuer idiomatisch und gibt die vollständige Zerstörung wieder.
- source_word: ὄρη καὶ δρυμούς
  choice: Berge und Wälder
  rationale: ὄρη meint Berge, δρυμοί bewaldete Gebiete beziehungsweise Wälder.
- source_word: ποιεῖ τὸ συνταχθέν
  choice: tut, was ihm aufgetragen ist
  rationale: τὸ συνταχθέν bezeichnet das Angeordnete, Aufgetragene oder Festgesetzte. Die gewählte Formulierung ist verständlich und lässt die genaue Art der Anordnung offen.
- source_word: ταῦτα
  choice: diese
  rationale: Das Pronomen verweist auf die im Kontext behandelten Götzenbilder. Die knappe Ausdrucksweise des Griechischen bleibt erhalten, ohne das Bezugswort ausdrücklich zu ergänzen.
- source_word: οὔτε ταῖς ἰδέαις
  choice: weder an Gestalt
  rationale: ἰδέα bezeichnet hier die sichtbare Gestalt oder Erscheinung. „Gestalt“ passt zur konkreten Gegenüberstellung mit den Bildern.
- source_word: οὔτε ταῖς δυνάμεσιν
  choice: noch an Kraft
  rationale: δύναμις bezeichnet wirksame Kraft oder Macht. „Kraft“ hebt hier die tatsächliche Wirksamkeit des Feuers gegenüber der Ohnmacht der Götzenbilder hervor.
- source_word: ἀφωμοιωμένα ἐστίν
  choice: sind ihm … vergleichbar
  rationale: Die perfekte Passivform bedeutet wörtlich, dass sie ihm nicht gleichgemacht beziehungsweise nicht als ihm ähnlich erwiesen sind. „vergleichbar“ gibt den evaluativen Sinn natürlich wieder.
theological_decisions:
- issue: Ursprung des Feuers „von oben“
  choice: „von oben“ beibehalten
  alternative: „vom Himmel“ oder „von Gott“
  rationale: ἄνωθεν deutet im Zusammenhang einen himmlischen oder göttlichen Ursprung an, nennt aber weder den Himmel noch Gott ausdrücklich. Die Übersetzung bewahrt diese Andeutung, ohne sie dogmatisch zu präzisieren.
- issue: Handelnde Instanz hinter dem Auftrag des Feuers
  choice: Die passive und unbestimmte Formulierung „was ihm aufgetragen ist“
  alternative: „was Gott ihm befohlen hat“
  rationale: Der griechische Text setzt eine Anordnung voraus, benennt deren Urheber in diesem Satz jedoch nicht. Deshalb wird kein ausdrückliches Subjekt ergänzt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz bleibt eng am griechischen Aufbau, wird aber durch Relativsatz und idiomatische Vergleichsform natürlich lesbar. Die Pronomenreferenz „diese“ und die ungenannte Instanz hinter dem Auftrag bleiben entsprechend dem Ausgangstext offen.
