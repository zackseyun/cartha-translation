  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/005.yaml
  text: When you see a crowd in front of them and behind them bowing down to them[a], say in your mind, ‘It is you whom one must worship, Master.’
translation:
  language: de
  text: 'Wenn ihr seht, wie eine Menschenmenge vor und hinter ihnen sich vor diesen niederwirft[a], dann sagt in Gedanken: »Dich muss man anbeten, Gebieter.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »sie anbetet«. Das griechische Verb kann sowohl die körperliche Niederwerfung als auch religiöse Anbetung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντας
  choice: Wenn ihr seht
  rationale: Das formal akkusativische Partizip wird im Zusammenhang mit dem folgenden Imperativ als temporale Umstandsangabe zu den angesprochenen Personen verstanden. Die deutsche Wiedergabe macht diesen Bezug natürlich deutlich.
- source_word: ὄχλον
  choice: eine Menschenmenge
  rationale: ὄχλος bezeichnet eine Menge beziehungsweise Menschenansammlung; „Menschenmenge“ ist hier klar und gegenwärtig.
- source_word: ἔμπροσθεν καὶ ὄπισθεν αὐτῶν
  choice: vor und hinter ihnen
  rationale: Die räumliche Anordnung auf beiden Seiten der Götzenbilder wird knapp und unmittelbar bewahrt.
- source_word: προσκυνοῦντας αὐτά
  choice: sich vor ihnen niederwirft
  rationale: προσκυνέω kann sowohl die körperliche Niederwerfung als auch religiöse Anbetung bezeichnen. Hier wird zunächst die sichtbare Handlung wiedergegeben, während die Alternative in einer Fußnote genannt wird.
- source_word: εἴπατε δὲ τῇ διανοίᾳ
  choice: dann sagt in Gedanken
  rationale: διάνοια bezeichnet das Denken beziehungsweise den inneren Sinn. „In Gedanken“ macht deutlich, dass die Aussage innerlich und nicht notwendig hörbar erfolgt.
- source_word: Σοί
  choice: Dich allein
  rationale: Das vorangestellte betonte Dativpronomen wird durch die deutsche Spitzenstellung hervorgehoben. „Allein“ ist nicht als eigenes griechisches Lexem vorhanden, bringt aber im Kontrast zu den Götzen die exklusive Zielrichtung der betonten Konstruktion zum Ausdruck; diese Explizierung wird in einer Fußnote kenntlich gemacht.
- source_word: δεῖ
  choice: muss man
  rationale: δεῖ drückt Notwendigkeit aus, ohne im Griechischen ein bestimmtes Subjekt zu nennen. Das unpersönliche „man muss“ bewahrt dies.
- source_word: προσκυνεῖν
  choice: anbeten
  rationale: In der unmittelbaren Anrede Gottes steht der religiöse Sinn von προσκυνέω im Vordergrund.
- source_word: Δέσποτα
  choice: Gebieter
  rationale: Δέσποτα wird von κύριος unterschieden. „Gebieter“ wahrt den Gedanken souveräner Herrschaft und eignet sich als würdevolle Gottesansprache besser als das im heutigen Deutsch leicht missverständliche „Meister“.
theological_decisions:
- issue: Gottesbezeichnung Δέσποτα
  choice: Gebieter
  alternative: Herr; Meister; Souverän
  rationale: Der Text verwendet Δέσποτα und nicht κύριε. „Gebieter“ bewahrt die lexikalische Unterscheidung und den Gedanken uneingeschränkter Autorität, ohne den Ausdruck an den üblichen Titel „Herr“ anzugleichen.
- issue: Exklusivität der Anbetung im betonten Σοί
  choice: Dich allein muss man anbeten
  alternative: Dich muss man anbeten; Vor dir muss man sich niederwerfen
  rationale: Die Frontstellung von Σοί und der unmittelbare Gegensatz zur Götzenverehrung legen eine exklusive Betonung nahe. Da „allein“ jedoch nicht ausdrücklich als separates Wort im Griechischen steht, wird dies transparent in einer Fußnote erläutert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Anrede im Plural folgt dem griechischen Imperativ εἴπατε. Der Satz bleibt verständlich und bewahrt zugleich die Spannung zwischen sichtbarer Niederwerfung und eigentlicher Anbetung.
