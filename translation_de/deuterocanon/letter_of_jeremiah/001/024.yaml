  text: They are bought at every price[a], but there is no breath in them.
translation:
  language: de
  text: Sie sind um jeden Preis gekauft worden, doch in ihnen ist kein Hauch.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „kein Geist“. Das griechische Wort πνεῦμα kann „Hauch“, „Geist“ oder „Wind“ bedeuten; hier geht es darum, dass die Götzen leblos sind.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ πάσης τιμῆς
  choice: um jeden Preis
  rationale: Die Wendung bezeichnet den Erwerb gegen Bezahlung, ungeachtet des verlangten Preises. „Um jeden Preis“ ist knapp und verständlich, ohne eine bestimmte Höhe der Kosten festzulegen.
- source_word: ἠγορασμένα
  choice: gekauft worden
  rationale: Das Perfekt Passiv von ἀγοράζω stellt die Götzen als käuflich erworbene Gegenstände dar. Das deutsche Perfekt Passiv gibt sowohl den vollzogenen Erwerb als auch die passive Aussage wieder.
- source_word: πνεῦμα
  choice: Lebenshauch
  rationale: Im Zusammenhang der Götzenpolemik steht die Leblosigkeit der Bilder im Vordergrund. „Lebenshauch“ gibt die konkrete Verbindung von Atem und Leben wieder; die ebenfalls mögliche Bedeutung „Geist“ bleibt in der Fußnote erhalten.
- source_word: ἐν οἷς
  choice: in ihnen
  rationale: Das Pronomen verweist auf die zuvor genannten gekauften Gegenstände. „In ihnen“ ist im Deutschen natürlich und bewahrt den örtlichen Sinn.
theological_decisions:
- issue: Bedeutung von πνεῦμα in der Götzenpolemik
  choice: Lebenshauch
  alternative: Geist
  rationale: Die Aussage hebt hervor, dass die kostspielig erworbenen Götzen kein Leben haben. „Lebenshauch“ wahrt diese konkrete Aussage, ohne eine weitergehende metaphysische Behauptung einzutragen. Da πνεῦμα auch „Geist“ bedeuten kann, wird diese Möglichkeit in der Fußnote dokumentiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz folgt der griechischen Passivkonstruktion, bleibt aber flüssig; „doch“ macht den sachlichen Gegensatz zwischen Kaufpreis und Leblosigkeit deutlich.
