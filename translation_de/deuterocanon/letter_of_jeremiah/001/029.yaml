  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/029.yaml
  text: For how could they be called gods[b][a], since women set out offerings before silver and gold and wooden gods?
translation:
  language: de
  text: Denn wie könnten sie Götter genannt werden, da Frauen Göttern aus Silber, Gold und Holz etwas vorsetzen?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Woher könnten sie Götter genannt werden?“ Das griechische Verb kann auch „vor jemanden hinstellen“ oder „darreichen“ bedeuten; was die Frauen vorsetzen, wird nicht genannt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πόθεν
  choice: wie
  rationale: In der rhetorischen Verbindung mit κληθείησαν fragt Πόθεν nach der möglichen Grundlage oder Berechtigung der Bezeichnung. „Wie“ gibt diese Funktion im heutigen Deutsch natürlich wieder; die wörtlichere Alternative wird in einer Fußnote genannt.
- source_word: κληθείησαν
  choice: könnten sie … genannt werden
  rationale: Der passive Aorist-Optativ bezeichnet hier eine bloße Möglichkeit, die rhetorisch in Zweifel gezogen wird.
- source_word: θεοί / θεοῖς
  choice: Götter / Göttern
  rationale: Die ausdrückliche Bezeichnung des griechischen Textes bleibt erhalten. Dadurch wird die polemische Spannung nicht durch die interpretierende Wiedergabe „Götzen“ vorweggenommen.
- source_word: ὅτι
  choice: weil
  rationale: Die kausale Bedeutung wird unmittelbar wiedergegeben. Als eigene rhetorische Frage bleibt zugleich die auffällige argumentative Spannung des griechischen Wortlauts sichtbar.
- source_word: γυναῖκες
  choice: Frauen
  rationale: Direkte und geschlechtsspezifische Wiedergabe des griechischen Substantivs.
- source_word: παρατιθέασιν
  choice: Gaben vorsetzen
  rationale: Das Verb bedeutet, jemandem etwas vorzusetzen oder vor ihn hinzustellen. Da das gesetzte Objekt im Griechischen unausgesprochen bleibt, bezeichnet „Gaben“ knapp den im kultischen Zusammenhang vorausgesetzten Gegenstand.
- source_word: ἀργυροῖς καὶ χρυσοῖς καὶ ξυλίνοις
  choice: silbernen, goldenen und hölzernen
  rationale: Die drei Materialadjektive werden in ihrer koordinierten Form bewahrt und beziehen sich wie im Griechischen auf „Göttern“.
theological_decisions:
- issue: θεοί als „Götter“ oder „Götzen“ wiedergeben
  choice: Götter
  alternative: Götzen
  rationale: Der Text nennt die Bildwerke ausdrücklich „Götter“, während die rhetorische Frage gerade die Berechtigung dieser Bezeichnung bestreitet. „Götter“ bewahrt diese polemische Spannung.
- issue: Den nicht genannten Gegenstand von παρατιθέασιν verdeutlichen
  choice: Gaben vorsetzen
  alternative: etwas vorsetzen / vor … hinstellen
  rationale: „Gaben“ macht die kultische Handlung verständlich, ohne sie enger als „Opfergaben“ zu bestimmen. Eine Fußnote weist darauf hin, dass das Objekt im Ausgangstext unausgesprochen ist.
- issue: Das Verhältnis von ὅτι zur vorausgehenden Frage
  choice: als zweite, anschließende rhetorische Frage mit „Weil“
  alternative: 'als kausalen Nebensatz: „da/weil Frauen …“'
  rationale: Der griechische Wortlaut setzt nach der ersten Frage mit ὅτι fort. Die gewählte Interpunktion wahrt den kausalen Ausdruck, ohne die auffällige Logik durch ergänzende Wörter wie „nur“ oder „etwa deshalb“ stillschweigend zu erklären.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die zwei kurzen Fragen erhalten die rhetorische Schärfe und lassen die ungewöhnliche kausale Verknüpfung des griechischen Wortlauts erkennbar, statt sie durch eine konfessionelle oder sachlich ergänzende Deutung aufzulösen.
