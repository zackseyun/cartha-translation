  text: But when the clouds are commanded by God to move over the whole inhabited world[a], they accomplish what was appointed.
translation:
  language: de
  text: Wenn aber den Wolken von Gott befohlen wird, über die ganze bewohnte Welt zu ziehen, vollbringen sie, was angeordnet wurde.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „führen sie aus, was ihnen aufgetragen wurde“. Das griechische τὸ ταχθέν kann stärker das Angeordnete oder den ihnen zugewiesenen Auftrag betonen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: νεφέλαις
  choice: den Wolken
  rationale: Der Dativ Plural wird in der unpersönlichen deutschen Passivkonstruktion „den Wolken wird befohlen“ unmittelbar wiedergegeben.
- source_word: ἐπιταγῇ
  choice: befohlen wird
  rationale: Der Aorist Passiv Konjunktiv von ἐπιτάσσω bezeichnet einen erteilten Befehl; das unpersönliche deutsche Passiv ist hier natürlich und bewahrt die göttliche Urheberschaft.
- source_word: ὑπὸ τοῦ θεοῦ
  choice: von Gott
  rationale: Ὑπό mit Genitiv kennzeichnet den handelnden Urheber der passiven Verbform.
- source_word: ἐπιπορεύεσθαι
  choice: zu ziehen
  rationale: Das Verb bezeichnet hier die Bewegung der Wolken. „Ziehen“ ist im modernen Deutschen für Wolken idiomatisch und bewahrt den Bewegungssinn.
- source_word: ἐφʼ ὅλην τὴν οἰκουμένην
  choice: über die ganze bewohnte Erde
  rationale: Οἰκουμένη bezeichnet die bewohnte Welt beziehungsweise Erde; „bewohnte Erde“ erhält diese Bedeutungsnuance und passt zur Bewegung von Wolken über ein Gebiet.
- source_word: συντελοῦσι
  choice: vollbringen sie
  rationale: Συντελέω bezeichnet das wirksame Ausführen oder Vollenden einer Aufgabe. „Vollbringen“ bewahrt den Aspekt der erfolgreichen Erfüllung.
- source_word: τὸ ταχθέν
  choice: was angeordnet wurde
  rationale: Das substantivierte passive Partizip von τάσσω bezeichnet das Angeordnete oder Aufgetragene. Die Formulierung wahrt das Passiv und lässt offen, ob der Akzent stärker auf der Anordnung oder auf der zugewiesenen Aufgabe liegt.
theological_decisions:
- issue: Wiedergabe von τὸ ταχθέν im Blick auf Gottes ordnendes Handeln
  choice: was angeordnet wurde
  alternative: was ihnen aufgetragen wurde
  rationale: „Angeordnet“ bringt Gottes bestimmendes Handeln zum Ausdruck, ohne daraus eine über den unmittelbaren Zusammenhang hinausgehende Aussage über Determination abzuleiten. Die Fußnote bewahrt die mögliche Betonung des konkreten Auftrags.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung ist nah am griechischen Satzbau, bleibt jedoch natürlich verständlich; „ziehen“ ist die übliche Bezeichnung für die Bewegung von Wolken.
