  naturalness: „So sind ihre Götter, in den Häusern aufgestellt“ ist als isolierte Partizipialfügung im modernen Standarddeutsch sperrig und lässt den Anschluss unvollständig wirken. Eine Nebensatzlösung ist natürlich und wahrt die im Griechischen vorhandene Umstandsangabe.
