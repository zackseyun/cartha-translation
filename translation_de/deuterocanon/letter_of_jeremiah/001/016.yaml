  text: Such are their gods[a], set up in houses. Their eyes are full of dust from the feet of those who enter.
translation:
  language: de
  text: So sind ihre Götter[a], wenn sie in den Häusern aufgestellt sind. Ihre Augen sind voller Staub, der von den Füßen der Eintretenden kommt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ihre Götzenbilder«. Im griechischen Text steht »ihre Götter«; damit wird die polemische Bezeichnung der Bilder beibehalten, die von den Völkern verehrt werden.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: τοιοῦτοι ὑπάρχουσιν
  choice: So sind
  rationale: Gibt die zusammenfassende, demonstrative Aussage knapp und rhetorisch wieder; ὑπάρχουσιν hat hier kopulative Funktion.
- source_word: οἱ θεοὶ αὐτῶν
  choice: ihre Götter
  rationale: Bewahrt die ausdrückliche und polemische Bezeichnung des griechischen Textes, statt sie im Haupttext als »Götzenbilder« auszudeuten.
- source_word: καθιδρυμένων αὐτῶν ἐν τοῖς οἴκοις
  choice: in den Häusern aufgestellt
  rationale: Das passive Partizip bezeichnet die feste Aufstellung der Bilder. Die knappe partizipiale Fügung bewahrt den Bezug auf »ihre Götter«, ohne eine zusätzliche zeitliche Deutung einzutragen.
- source_word: οἱ ὀφθαλμοὶ αὐτῶν
  choice: Ihre Augen
  rationale: Die wörtliche Körperteilbezeichnung trägt zur Satire über die leblosen Bilder bei.
- source_word: πλήρεις εἰσὶν κονιορτοῦ
  choice: sind voller Staub
  rationale: Eine natürliche, zugleich genaue Wiedergabe des Bildes von Staubansammlung und Unfähigkeit.
- source_word: ἀπὸ τῶν ποδῶν τῶν εἰσπορευομένων
  choice: der von den Füßen der Eintretenden kommt
  rationale: ἀπό bezeichnet die Herkunft des Staubs; die substantivierte Form »der Eintretenden« erhält den allgemeinen, fortdauernden Sinn des Präsenspartizips.
theological_decisions:
- issue: Bezeichnung der verehrten Bilder als »Götter«
  choice: »ihre Götter« im Haupttext beibehalten
  alternative: »ihre Götzen« oder »ihre Götzenbilder«
  rationale: Obwohl der Zusammenhang leblose Kultbilder verspottet, lautet der griechische Ausdruck ausdrücklich »ihre Götter«. Diese Formulierung bewahrt die polemische Spannung des Ausgangstextes.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe partizipiale Wendung »in den Häusern aufgestellt« spiegelt die gedrängte griechische Form und vermeidet eine nicht ausdrücklich markierte zeitliche Verknüpfung.
