base_translation:
  language: en
  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/033.yaml
  text: Whether they suffer some harm from anyone or receive some good[a], they will not be able to repay it[b]; they cannot set up a king or remove one.
translation:
  language: de
  text: Ob sie von jemandem etwas Schlimmes erleiden oder etwas Gutes erfahren, sie werden es nicht vergelten können.[a] Auch können sie weder einen König einsetzen noch einen absetzen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Vergelten“ kann hier sowohl die Erwiderung auf etwas Schlimmes als auch die Gegenleistung für etwas Gutes bezeichnen.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „wegnehmen“; als Objekt ist „einen König“ aus dem vorhergehenden Satzglied mitzudenken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὔτε ἐὰν ... οὔτε ἐὰν
  choice: Ob ... oder
  rationale: Die gepaarte Konstruktion stellt zwei alternative Bedingungen gegenüber; „Ob ... oder“ gibt dies im Deutschen natürlich wieder.
- source_word: κακόν τι πάθωσιν ὑπό τινος
  choice: von jemandem etwas Schlimmes erleiden
  rationale: πάσχω bezeichnet hier das Erleiden oder Erfahren einer schädlichen Behandlung; ὑπό τινος nennt einen unbestimmten Urheber.
- source_word: ἀγαθόν
  choice: etwas Gutes erfahren
  rationale: Das im zweiten Bedingungssatz ausgelassene Verb wird sinngemäß ergänzt. „Etwas Gutes“ bewahrt den Gegensatz zu κακόν τι, ohne die Art der Wohltat näher festzulegen.
- source_word: δυνήσονται ἀνταποδοῦναι
  choice: sie werden es nicht vergelten können
  rationale: ἀνταποδίδωμι meint eine entsprechende Erwiderung auf Gutes wie auf Schlimmes. „Vergelten“ trägt im Deutschen beide Möglichkeiten und bewahrt zugleich das Futur von δυνήσονται.
- source_word: καταστῆσαι βασιλέα
  choice: einen König einsetzen
  rationale: καθίστημι kann hier das Einsetzen oder Bestellen eines Königs bezeichnen; „einsetzen“ ist präzise und gegenwärtig verständlich.
- source_word: ἀφελέσθαι
  choice: einen absetzen
  rationale: Der König ist als Objekt aus dem ersten Glied mitzudenken. Im politischen Zusammenhang gibt „absetzen“ das Wegnehmen aus dem Königsamt natürlich wieder.
theological_decisions:
- issue: Umfang der Machtlosigkeit der Götzen
  choice: Die Götzen können weder auf erlittenes Schlimmes noch auf empfangenes Gutes entsprechend reagieren und haben keine Macht, Könige einzusetzen oder abzusetzen.
  alternative: Das Vergelten könnte allein auf erlittenes Unrecht bezogen oder das politische Verb allgemeiner mit „wegnehmen“ wiedergegeben werden.
  rationale: Die griechische Gegenüberstellung von κακόν und ἀγαθόν umfasst sowohl Schlimmes als auch Gutes; der anschließende politische Parallelismus beschreibt umfassende Handlungsunfähigkeit, ohne eine weitergehende Lehrbehauptung hinzuzufügen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Wechsel vom griechischen Futur („werden ... können“) zum Präsens („können“) bleibt erhalten; die parallele Struktur und die Spannung zwischen Gutem und Schlimmem werden nicht eingeebnet.
