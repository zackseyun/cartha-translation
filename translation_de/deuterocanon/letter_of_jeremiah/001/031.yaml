  text: But they howl, shouting before their gods, like some at a funeral meal for the dead.
translation:
  language: de
  text: Doch sie heulen und schreien vor ihren Göttern wie manche bei einem Totenmahl.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „bei einem Mahl für einen Toten“; gemeint ist ein Trauer- oder Bestattungsmahl im Zusammenhang mit einem Verstorbenen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὠρύονται
  choice: sie heulen
  rationale: Das Verb bezeichnet ein lautes, teils tierähnliches oder klagendes Rufen. „Heulen“ bewahrt die anschauliche und spöttische Wirkung.
- source_word: βοῶντες
  choice: und schreien
  rationale: Das Partizip beschreibt lautes Rufen. Die Beiordnung mit „und“ ergibt im Deutschen einen natürlichen Satz und erhält die Verstärkung durch zwei Verben des lauten Rufens.
- source_word: ἐναντίον
  choice: vor
  rationale: 'Hier steht die räumliche Bedeutung im Vordergrund: Das Rufen geschieht vor den als Götter verehrten Gegenständen.'
- source_word: τῶν θεῶν αὐτῶν
  choice: ihren Göttern
  rationale: Der griechische Text sagt ausdrücklich „ihren Göttern“. Diese Bezeichnung wird trotz des götzenkritischen Zusammenhangs beibehalten.
- source_word: ὥσπερ τινὲς
  choice: wie manche
  rationale: Die knappe Vergleichsformulierung gibt sowohl ὥσπερ als auch das indefinite τινὲς idiomatisch wieder.
- source_word: ἐν περιδείπνῳ νεκροῦ
  choice: bei einem Totenmahl
  rationale: περίδειπνον bezeichnet ein mit Bestattung und Trauer verbundenes Mahl für beziehungsweise im Zusammenhang mit einem Verstorbenen. „Totenmahl“ ist knapp, verständlich und wahrt den kulturellen Bezug.
theological_decisions:
- issue: Wiedergabe von θεῶν im götzenkritischen Kontext
  choice: Göttern
  alternative: Götzen
  rationale: Obwohl die bezeichneten Größen im Kontext Götzenbilder sind, nennt der Ausgangstext sie „ihre Götter“. Die wörtliche Bezeichnung bewahrt die polemische Spannung, ohne sie im Haupttext auszulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Heulen und schreien“ erhält die drastische Doppelung des Griechischen; „Totenmahl“ gibt den kulturell geprägten Ausdruck knapp wieder. Der Fußnotenmarker steht unmittelbar nach der betreffenden Wendung.
