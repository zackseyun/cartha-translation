base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/001/022.yaml
  text: And Ahiacharus interceded for me[a], and I came to Nineveh. Now Ahiacharus was the cupbearer, keeper of the signet ring, administrator, and accountant, and Sacherdonos appointed him second in rank. He was my cousin.
translation:
  language: de
  text: Und Achiachar legte sich für mich ein, und ich kam nach Ninive. Achiachar war Mundschenk, Hüter des Siegelrings, Verwalter und Rechnungsführer. Sacherdonos setzte ihn zum Zweiten ein.[a] Er war mein Cousin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: »zum Sohn aus zweiter [Stellung]«. Der griechische Ausdruck ist ungewöhnlich und textlich schwierig; meist wird er so verstanden, dass Achiachar unmittelbar nach dem König den zweiten Rang einnahm.'
    reason: textual_variant
lexical_decisions:
- source_word: ἠξίωσεν ... περὶ ἐμοῦ
  choice: legte sich für mich ein
  rationale: Die Wendung bezeichnet hier Achiach​ars Fürsprache zugunsten Tobits. „Sich für jemanden einsetzen“ gibt dies natürlich wieder, ohne ein förmliches Rechtsverfahren vorauszusetzen.
- source_word: ἦλθον εἰς Νινευήν
  choice: ich kam nach Ninive
  rationale: Die schlichte Wiedergabe bewahrt die Bewegungsangabe des Griechischen; „kehrte zurück“ würde einen nicht ausdrücklich genannten Gedanken ergänzen.
- source_word: οἰνοχόος
  choice: Mundschenk
  rationale: Der etablierte deutsche Hoftitel bezeichnet den Amtsträger, der dem Herrscher den Wein reichte.
- source_word: ἐπὶ τοῦ δακτυλίου
  choice: Hüter des Siegelrings
  rationale: Wörtlich steht „über dem Ring“; im höfischen Zusammenhang ist der königliche Siegelring und die damit verbundene Amtsgewalt gemeint.
- source_word: διοικητής
  choice: Verwalter
  rationale: Das Wort bezeichnet jemanden, der Angelegenheiten leitet oder verwaltet, ohne das konkrete Amt enger festzulegen.
- source_word: ἐκλογιστής
  choice: Rechnungsführer
  rationale: Der Ausdruck gehört zum Bereich des Rechnens und der Rechnungslegung. „Rechnungsführer“ passt zum antiken Hofamt besser als die stark moderne Berufsbezeichnung „Buchhalter“.
- source_word: κατέστησεν αὐτὸν
  choice: setzte ihn ... ein
  rationale: καθίστημι bezeichnet in diesem Amtszusammenhang die Einsetzung in eine Stellung.
- source_word: υἱὸς ἐκ δευτέρας
  choice: als Zweiten im Reich
  rationale: Die griechische Formulierung ist wörtlich und textlich schwierig. Im Zusammenhang der Hofämter wird sie gewöhnlich als Bezeichnung des zweithöchsten Ranges verstanden; die Fußnote hält die Unsicherheit sichtbar.
- source_word: ἐξάδελφός μου
  choice: mein Cousin
  rationale: ἐξάδελφος bezeichnet hier einen Cousin beziehungsweise nahen Seitenverwandten; „Cousin“ ist die präzise und verständliche Wiedergabe.
