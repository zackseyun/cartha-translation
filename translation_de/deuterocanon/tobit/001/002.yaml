  register: Modernes, würdiges Standarddeutsch. Der lange griechische Relativsatz wird zur besseren Verständlichkeit in zwei Sätze gegliedert. Ungewisse Ortsnamen und räumliche Beziehungen bleiben bewusst unharmonisiert; die Fußnotenmarker stehen jeweils unmittelbar bei der betreffenden Namens- beziehungsweise Ortsangabe.
