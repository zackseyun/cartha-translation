base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/001/002.yaml
  text: who was taken captive in the days of Enemessaros king of the Assyrians[a], from Thisbe, which is to the south of Kedesh of Naphtali in Galilee[b], above Asher.
translation:
  language: de
  text: der in den Tagen des Enemessaros, des Königs der Assyrer,[a] aus Thisbe gefangen weggeführt wurde. Thisbe liegt rechts von Kydios in Naftali, in Galiläa, oberhalb von Ascher.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Enemessaros wird mitunter mit dem assyrischen König Salmanassar gleichgesetzt; der griechische Text bietet hier jedoch die Namensform „Enemessaros“.
    reason: alternative_reading
  - marker: b
    text: Die Ortsangaben in diesem Vers sind schwer zu deuten und möglicherweise textlich oder geografisch unsicher. Kydios wird teilweise mit einem anders benannten Ort identifiziert. Die Angaben „rechts von“ und „oberhalb von Ascher“ sind relativ wörtlich wiedergegeben und nicht in bestimmte Himmelsrichtungen umgedeutet.
    reason: cultural_note
lexical_decisions:
- source_word: ᾐχμαλωτεύθη
  choice: gefangen weggeführt wurde
  rationale: Die passive Verbform bezeichnet die gewaltsame Verschleppung als Gefangener; die Wendung bewahrt sowohl den Zwang als auch die Ortsveränderung.
- source_word: ἐν ἡμέραις
  choice: in den Tagen
  rationale: Die formnahe Wiedergabe ist im Deutschen verständlich und lässt offen, ob ausschließlich die Regierungszeit gemeint ist.
- source_word: Ἐνεμεσσαάρου
  choice: Enemessaros
  rationale: Die im griechischen Text belegte Namensform wird transliteriert und nicht stillschweigend mit Salmanassar gleichgesetzt.
- source_word: ἐκ Θίσβης
  choice: aus Thisbe
  rationale: ἐκ bezeichnet hier die Herkunft; „aus Thisbe“ gibt diese Beziehung natürlich wieder.
- source_word: ἐκ δεξιῶν
  choice: rechts von
  rationale: Die wörtliche räumliche Angabe wird beibehalten, da eine Umdeutung zu einer bestimmten Himmelsrichtung die unsichere Geografie stärker festlegen würde als der griechische Text.
- source_word: Κυδίως
  choice: Kydios
  rationale: Der schwer identifizierbare Ortsname wird nach der bezeugten griechischen Form transliteriert, statt ihn spekulativ mit Kedesch gleichzusetzen.
- source_word: τῆς Νεφθαλεὶμ
  choice: in Naftali
  rationale: Der Genitiv ordnet Kydios dem Gebiet Naftali zu; im Deutschen drückt „in Naftali“ diese geografische Zugehörigkeit natürlich aus.
- source_word: ἐν τῇ Γαλειλαίᾳ
  choice: in Galiläa
  rationale: Dies ist die übliche und klare deutsche Wiedergabe der geografischen Angabe.
- source_word: ὑπεράνω Ἀσήρ
  choice: oberhalb von Ascher
  rationale: „Oberhalb von“ bewahrt die räumliche Ausdrucksweise und ihre mögliche geografische Mehrdeutigkeit, ohne sie vorschnell als „nördlich von“ festzulegen.
