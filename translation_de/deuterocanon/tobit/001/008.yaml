translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholte Handlung des Imperfekts wird ausdrücklich markiert. Die ungewöhnliche konkrete Verwandtschaftsangabe und die spannungsreiche Aussage über das Zurücklassen als Waise bleiben im Haupttext sichtbar und werden nur in den Fußnoten erläutert.
