  verdict: revise
  source_fidelity: Der Entwurf gibt die Verteilung des dritten Anteils, den iterativen Imperfekt und die konkrete Verwandtschaftsangabe insgesamt treffend wieder. Die aktive Umformung „mein Vater hatte mich ... zurückgelassen“ verschiebt jedoch die auffällige passive griechische Formulierung und kann im Deutschen unnötig den Eindruck eines aktiven Verlassens erwecken. Die passive Form wahrt sowohl die Syntax als auch die im Griechischen bestehende Spannung.
  naturalness: „Gab ich gewöhnlich“ ist modernes, verständliches Standarddeutsch und gibt den gewohnheitsmäßigen Imperfekt angemessen wieder. Die passive Formulierung ist absichtlich ungewohnt, aber als quellennahe Form mit erklärender Fußnote vertretbar. „Durch den Tod beziehungsweise Verlust“ in der bisherigen Fußnote ist stilistisch und sachlich zu festlegend.
  terminology: „Anteil“, „zustand“, „Debora“ und „die Mutter meines Vaters“ sind angemessen. Die Fußnote zu τὴν τρίτην sollte präzise von einem ausgelassenen Substantiv sprechen, nicht von einem unausgesprochenen „Wort für ...“. Die Erklärung zu „Waise“ soll den wahrscheinlichen Sinn „vaterlos“ nennen, ohne den Tod als ausdrücklich vom griechischen Wortlaut behauptete Ursache festzuschreiben.
