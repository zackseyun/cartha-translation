revisions:
- from: Und den dritten Anteil gab ich gewöhnlich denen, denen er zustand,[a] wie Debora, die Mutter meines Vaters,[b] es mir geboten hatte; denn mein Vater hatte mich als Waise zurückgelassen.[c]
  to: Und den dritten Anteil gab ich gewöhnlich denen, denen er zustand,[a] wie Debora, die Mutter meines Vaters,[b] es mir geboten hatte; denn ich war von meinem Vater als Waise zurückgelassen worden.[c]
  rationale: Die Revision bewahrt die passive, im Griechischen auffällige Ausdrucksweise bei „als Waise zurückgelassen“, statt sie in eine aktivische Aussage über den Vater umzudeuten. Die Fußnote erläutert den naheliegenden Sinn vorsichtig, ohne eine im Wortlaut nicht ausdrücklich genannte Todesursache festzuschreiben. Außerdem wird die Beschreibung der griechischen Ellipse präzisiert.
