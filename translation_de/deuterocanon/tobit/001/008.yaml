base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/001/008.yaml
  text: And the third I would give to those to whom it was due[a], just as Deborah, my father's mother, commanded[c][b], because I was left an orphan by my father.
translation:
  language: de
  text: Und den dritten Anteil gab ich gewöhnlich denen, denen er zustand,[a] wie Debora, die Mutter meines Vaters,[b] es mir geboten hatte; denn ich war von meinem Vater als Waise zurückgelassen worden.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: „den dritten“; das Substantiv für den gemeinten Anteil bleibt im Griechischen unausgesprochen und ist aus dem Zusammenhang zu ergänzen.'
    reason: lexical_alternative
  - marker: b
    text: 'Das heißt: meine Großmutter väterlicherseits.'
    reason: clarification
  - marker: c
    text: 'Wörtlich: „Ich wurde von meinem Vater als Waise zurückgelassen.“ Die ungewöhnliche Formulierung meint im Zusammenhang wohl, dass er nach dem Verlust seines Vaters vaterlos war.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὴν τρίτην
  choice: den dritten Anteil
  rationale: Das substantivierte feminine Zahlwort setzt aus dem Zusammenhang einen Anteil voraus. Im Deutschen ist die Ergänzung „Anteil“ natürlicher und macht die Ellipse verständlich.
- source_word: ἐδίδουν
  choice: gab ich gewöhnlich
  rationale: Der Imperfekt bezeichnet hier eine wiederholte Praxis in der Vergangenheit; „gewöhnlich“ bringt diesen durativen bzw. iterativen Aspekt klar zum Ausdruck.
- source_word: οἷς καθήκει
  choice: denen, denen er zustand
  rationale: καθήκει kann das Angemessene, Gebührende oder Zustehende bezeichnen. „zustand“ wahrt den Gedanken rechtmäßiger Empfänger, ohne sie näher zu bestimmen.
- source_word: καθὼς ἐνετείλατο
  choice: wie ... es mir geboten hatte
  rationale: ἐντέλλομαι bezeichnet einen verbindlichen Auftrag oder ein Gebot. Das Plusquamperfekt gibt im Deutschen natürlich wieder, dass Deboras Anweisung der beschriebenen Gewohnheit vorausging; „mir“ ist aus der Konstruktion sinngemäß ergänzt.
- source_word: Δεββώρα
  choice: Debora
  rationale: „Debora“ ist die im modernen deutschen Bibelgebrauch geläufige Form des Namens.
- source_word: ἡ μήτηρ τοῦ πατρός μου
  choice: die Mutter meines Vaters
  rationale: Die konkrete griechische Verwandtschaftsbezeichnung wird beibehalten, statt sie im Haupttext zu „meine Großmutter“ zu glätten.
- source_word: διότι
  choice: denn
  rationale: Die Konjunktion führt die Begründung für Deboras erzieherische Autorität ein. „denn“ verbindet die Aussagen in würdigem, natürlichem Deutsch.
- source_word: ὀρφανὸς κατελείφθην ὑπὸ τοῦ πατρός μου
  choice: mein Vater hatte mich als Waise zurückgelassen
  rationale: Diese Wiedergabe bewahrt die auffällige Formulierung des Griechischen, meint im Zusammenhang jedoch, dass Tobit durch den Verlust seines Vaters vaterlos geworden war.
