  text: And the Most High gave me favor and good standing before Enemessar[b][a], and I was his buyer.
translation:
  language: de
  text: Und der Höchste schenkte mir vor Enemessar Gunst und ein ansprechendes Äußeres[a], und ich war sein Einkäufer[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Gunst und Ansehen“. Das griechische Wort μορφή bezeichnet Gestalt oder äußere Erscheinung; seine genaue Bedeutung in diesem höfischen Zusammenhang ist nicht völlig sicher.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „sein Beauftragter für Einkäufe“. Wörtlich steht im Griechischen „Einkäufer“; wahrscheinlich ist eine amtliche Zuständigkeit für Beschaffungen gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ὕψιστος
  choice: der Höchste
  rationale: Der etablierte biblische Gottesname bleibt als Titel erhalten und wird nicht zum allgemeineren „Gott“ verflacht.
- source_word: χάριν
  choice: Gunst
  rationale: Im höfischen Zusammenhang bezeichnet das Wort die wohlwollende Aufnahme durch den Herrscher; „Gunst“ ist hier treffender als das theologisch stärker geprägte „Gnade“.
- source_word: μορφήν
  choice: ein ansprechendes Äußeres
  rationale: μορφή bezeichnet zunächst Gestalt oder äußere Erscheinung. „Ein ansprechendes Äußeres“ gibt im Zusammenhang des königlichen Dienstes die offenbar positive Wertung wieder, ohne das Wort ausschließlich als gesellschaftliches Ansehen zu deuten.
- source_word: ἐνώπιον
  choice: vor
  rationale: „Vor“ bewahrt knapp die räumliche beziehungsweise höfische Perspektive des griechischen Ausdrucks.
- source_word: Ἐνεμεσσάρου
  choice: Enemessar
  rationale: Der Personenname wird entsprechend der vorliegenden griechischen Textform transliteriert und nicht mit einem bekannteren historischen Namen harmonisiert.
- source_word: ἀγοραστής
  choice: Einkäufer
  rationale: Das Substantiv bezeichnet wörtlich jemanden, der einkauft. „Einkäufer“ ist im Deutschen verständlich und kann zugleich eine amtliche Beschaffungsfunktion bezeichnen.
theological_decisions:
- issue: Gottesbezeichnung ὁ ὕψιστος
  choice: der Höchste
  alternative: Gott
  rationale: Die Wiedergabe erhält den im griechischen Text verwendeten Hoheitstitel und seine biblisch-jüdische Prägung.
- issue: Bedeutung von μορφή im höfischen Kontext
  choice: ein ansprechendes Äußeres
  alternative: Ansehen
  rationale: Die Grundbedeutung „Gestalt/äußere Erscheinung“ soll nicht stillschweigend in gesellschaftliche Stellung umgedeutet werden; die mögliche kontextuelle Nuance wird in der Fußnote offengehalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt eng am Griechischen; „ansprechendes Äußeres“ ist allgemein verständlich, während die Fußnote die mögliche Bedeutung „Ansehen“ ausdrücklich offenhält.
