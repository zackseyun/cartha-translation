lexical_decisions:
- source_word: καθότι
  choice: weil
  rationale: Die Konjunktion leitet den Grund für den vorausgehenden Sachverhalt ein; „weil“ gibt ihre kausale Funktion klar und natürlich wieder.
- source_word: ἐμεμνήμην
  choice: ich dachte an
  rationale: Das griechische Verb bezeichnet hier ein bewusstes Erinnern beziehungsweise beständiges Gedenken. Die idiomatische deutsche Verbindung „an Gott denken“ bewahrt diesen Sinn, ohne das Erinnern an zuvor Vergessenes nahezulegen.
- source_word: τοῦ θεοῦ
  choice: an Gott
  rationale: Der Genitiv ist vom griechischen Verb abhängig; die entsprechende deutsche Konstruktion lautet idiomatisch „an Gott denken“.
- source_word: ἐν ὅλῃ τῇ ψυχῇ μου
  choice: mit ganzer Seele
  rationale: Die Wendung drückt ungeteilte innere Hingabe aus und bewahrt mit „Seele“ den anthropologischen Ausdruck ψυχή. „Mit ganzer Seele“ ist im Deutschen zugleich natürlich und bibelsprachlich würdig.
theological_decisions:
- issue: Anthropologische Bedeutung von ψυχή
  choice: Seele
  alternative: ganzem Wesen
  rationale: „Seele“ erhält das konkrete anthropologische Gewicht des griechischen Ausdrucks, ohne eine weitergehende Lehre über die Beschaffenheit des Menschen in den Text hineinzutragen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Klang. Der kurze Kausalsatz bleibt eng an der griechischen Syntax, während „an Gott dachte“ gegenüber dem missverständlichen „mich an Gott erinnerte“ idiomatischer ist.
