base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/001/007.yaml
  text: And I would give them to the priests[a], the sons of Aaron, for the altar, from the produce; I would give the tenth to the sons of Levi who minister in Jerusalem[b], and I would sell the second tenth and go and spend it in Jerusalem each year.
translation:
  language: de
  text: Und diese gab ich jeweils den Priestern, den Söhnen Aarons, für den Altar aus den Erträgen. Den Zehnten gab ich den Söhnen Levis, die in Jerusalem Dienst taten. Den zweiten Zehnten verkaufte ich[a], ging nach Jerusalem und gab den Erlös dort jedes Jahr aus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „machte ich zu Geld“. Das griechische Verb kann hier das Verkaufen beziehungsweise die Umsetzung des zweiten Zehnten in Geld bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐδίδουν
  choice: gab ich jeweils
  rationale: Der Imperfekt beschreibt hier eine regelmäßig wiederholte Handlung in der Vergangenheit. „Jeweils“ macht diesen gewohnheitsmäßigen Sinn im Deutschen deutlich.
- source_word: αὐτὰς
  choice: diese
  rationale: Das feminine Pluralpronomen verweist auf die zuvor genannten Abgaben oder Gaben. „Diese“ wahrt den Rückbezug, ohne den nicht im Vers selbst genannten Gegenstand näher festzulegen.
- source_word: τοῖς ἱερεῦσιν τοῖς υἱοῖς Ἀαρών
  choice: den Priestern, den Söhnen Aarons
  rationale: Die erklärende Apposition und die ausdrücklich genannte Abstammung werden beibehalten.
- source_word: πρὸς τὸ θυσιαστήριον τῶν γενημάτων
  choice: für den Altar, aus den Erträgen
  rationale: Die knappe griechische Wendung verbindet die Bestimmung für den Altar mit der Herkunft aus den landwirtschaftlichen Erträgen. Die deutsche Fassung bewahrt diese Kompaktheit und setzt zur Verständlichkeit ein Komma.
- source_word: τὴν δεκάτην
  choice: den Zehnten
  rationale: „Der Zehnte“ ist zugleich die wörtliche und die geläufige deutsche Bezeichnung für eine Abgabe des zehnten Teils.
- source_word: τοῖς υἱοῖς Λευεί
  choice: den Söhnen Levis
  rationale: Die ausdrückliche Formulierung des Griechischen wird gegenüber der zusammenfassenden Bezeichnung „den Leviten“ bewahrt.
- source_word: τοῖς θεραπεύουσιν εἰς Ἱερουσαλήμ
  choice: die in Jerusalem Dienst taten
  rationale: Im kultischen Zusammenhang bezeichnet θεραπεύω einen Dienst. Die Formulierung ist verständlich, ohne den Dienst über den griechischen Text hinaus näher zu bestimmen.
- source_word: τὴν δευτέραν δεκάτην
  choice: den zweiten Zehnten
  rationale: Die Zählung des griechischen Textes wird unmittelbar wiedergegeben und nicht durch eine erklärende Bezeichnung ersetzt.
- source_word: ἀπεπρατιζόμην
  choice: verkaufte ich
  rationale: Das Verb bezeichnet ein Verkaufen oder eine Veräußerung. Der anschließende Gang nach Jerusalem und das dortige Ausgeben sprechen dafür, dass der Zehnte in Geld umgesetzt wurde; die alternative Verdeutlichung wird in der Fußnote genannt.
- source_word: ἐδαπάνων αὐτὰ
  choice: gab den Erlös dort aus
  rationale: Nach dem Verkauf bezieht sich das griechische Pluralpronomen sinngemäß auf das dadurch Verfügbare. „Den Erlös“ stellt den natürlichen deutschen Zusammenhang her, ohne einen zusätzlichen Verwendungszweck zu behaupten.
- source_word: καθʼ ἕκαστον ἐνιαυτόν
  choice: jedes Jahr
  rationale: Dies ist eine knappe und natürliche Wiedergabe der distributiven Zeitangabe.
theological_decisions:
- issue: Bezeichnung der verschiedenen Zehntabgaben
  choice: „den Zehnten“ und „den zweiten Zehnten“
  alternative: „die Zehntabgabe“ und „die zweite Zehntabgabe“
  rationale: Die gewählte Fassung entspricht sowohl der wörtlichen Bedeutung von δεκάτη als auch dem etablierten, allgemein verständlichen deutschen Sprachgebrauch und lässt das Verhältnis der Abgaben zueinander unaufgelöst.
- issue: Deutung von ἀπεπρατιζόμην
  choice: „verkaufte ich“
  alternative: „tauschte ich gegen Geld ein“ beziehungsweise „machte ich zu Geld“
  rationale: „Verkaufen“ gibt die lexikalische Grundbedeutung knapp wieder. Da der Zusammenhang auch als Umsetzung in Geld erläutert werden kann, bleibt diese Nuance in der Fußnote sichtbar, statt im Haupttext festgeschrieben zu werden.
translation_notes:
  register: Moderne, würdige Standardsprache. Die wiederholten Vergangenheitsformen geben den berichtenden Stil wieder; „jeweils“ und „jedes Jahr“ machen den gewohnheitsmäßigen Charakter deutlich. Die kultischen Bezeichnungen bleiben nah am griechischen Wortlaut, ohne konfessionelle Zusatzdeutung.
