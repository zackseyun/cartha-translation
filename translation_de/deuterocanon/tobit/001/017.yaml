base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/001/017.yaml
  text: I gave my bread to the hungry and clothing to the naked[a], and if I saw any of my kin dead and thrown behind the wall of Nineveh, I buried him.
translation:
  language: de
  text: Mein Brot gab ich den Hungrigen und Kleidung den Nackten. Und wenn ich jemanden aus meiner Sippe tot und hinter der Mauer von Ninive hingeworfen liegen sah, begrub ich ihn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort für „Sippe“ kann Verwandte oder eine weiter gefasste Abstammungsgruppe meinen. Wörtlich heißt es „hinter der Mauer von Ninive“; gemeint können Leichen sein, die außerhalb der Stadtmauer hingeworfen worden waren.
    reason: Bewahrt die Mehrdeutigkeit von γένος und erläutert die mögliche räumliche Bedeutung von ὀπίσω τοῦ τείχους, ohne diese als zwingend auszugeben.
lexical_decisions:
- source_word: τοὺς ἄρτους μου
  choice: mein Brot
  rationale: Der deutsche Sammelbegriff „Brot“ gibt den Plural ἄρτους in diesem Zusammenhang natürlicher wieder als „Brote“ und bewahrt das Possessivpronomen.
- source_word: ἐδίδουν
  choice: gab ich
  rationale: Der Imperfekt beschreibt hier eine wiederholte Gewohnheit; im Deutschen ergibt sich diese Bedeutung aus dem autobiografischen Zusammenhang und der parallelen Wenn-Konstruktion.
- source_word: τοῖς πεινῶσιν
  choice: den Hungrigen
  rationale: Das substantivierte Partizip lässt sich knapp und idiomatisch mit „den Hungrigen“ wiedergeben.
- source_word: ἱμάτια τοῖς γυμνοῖς
  choice: Kleidung den Unbekleideten
  rationale: ἱμάτια bezeichnet allgemein Kleidungsstücke. γυμνοῖς kann völlige Nacktheit oder unzureichende Bekleidung bezeichnen; „Unbekleidete“ wahrt den direkten Sinn, ohne umgangssprachlich zu wirken.
- source_word: ἐκ τοῦ γένους μου
  choice: aus meinem Volk
  rationale: γένος kann die Verwandtschaft, Abstammungsgruppe oder Volkszugehörigkeit bezeichnen. Im Exilkontext ist „aus meinem Volk“ natürlich, während die mögliche verwandtschaftliche Bedeutung in der Fußnote erhalten bleibt.
- source_word: ἐθεώρουν τεθνηκότα καὶ ἐρριμμένον
  choice: tot und … geworfen liegen sah
  rationale: Die beiden Partizipien beschreiben den vorgefundenen Zustand. „liegen sah“ ist im Deutschen erforderlich, damit „geworfen“ nicht wie eine gleichzeitig beobachtete Handlung klingt.
- source_word: ὀπίσω τοῦ τείχους Νινευή
  choice: hinter die Mauer von Ninive
  rationale: ὀπίσω mit Genitiv bedeutet wörtlich „hinter“. Die Richtungsform „hinter die Mauer geworfen“ verbindet sich natürlich mit dem deutschen Verb und lässt offen, ob die Außenseite der Stadtmauer gemeint ist.
- source_word: ἔθαπτον αὐτόν
  choice: begrub ich ihn
  rationale: Der Imperfekt bezeichnet wiederum Tobits wiederholtes Handeln; die knappe deutsche Vergangenheitsform passt zur Erzählung.
theological_decisions:
- issue: Bedeutungsumfang von γένος μου
  choice: aus meinem Volk
  alternative: aus meiner Verwandtschaft
  rationale: Der Ausdruck kann sowohl engere Verwandtschaft als auch die gemeinsame Abstammungs- oder Volksgruppe bezeichnen. Der Haupttext folgt dem wahrscheinlichen exilischen Bezug, die Fußnote bewahrt die engere Möglichkeit.
- issue: Lage der unbegrabenen Toten bei der Stadtmauer
  choice: hinter die Mauer von Ninive
  alternative: außerhalb der Mauer von Ninive
  rationale: Der griechische Wortlaut sagt „hinter der Mauer“ und legt im Kontext vermutlich die Außenseite nahe, bestimmt sie aber nicht ausdrücklich. Deshalb wird „außerhalb“ nicht in den Haupttext aufgenommen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung behält den autobiografischen Nachdruck bei; die wiederholte Wohltätigkeit wird ohne zusätzliche erklärende Wörter aus dem Zusammenhang erkennbar. Der Fußnotenmarker steht nach dem gesamten mehrdeutigen Satzteil.
