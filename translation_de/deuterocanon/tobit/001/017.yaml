    rationale: γένος kann Verwandtschaft bzw. eine weitere Abstammungsgruppe bezeichnen. „Volk“ legt den Bezug stärker auf die gesamte ethnische Gemeinschaft fest, als der griechische Ausdruck verlangt.
  - severity: low
