- from: Mein Brot gab ich den Hungrigen und Kleidung den Unbekleideten. Und wenn ich einen aus meinem Volk tot und hinter die Mauer von Ninive geworfen liegen sah, begrub ich ihn.[a]
  to: Mein Brot gab ich den Hungrigen und Kleidung den Nackten. Und wenn ich jemanden aus meiner Sippe tot und hinter der Mauer von Ninive hingeworfen liegen sah, begrub ich ihn.[a]
  rationale: Die Revision korrigiert die im Deutschen fälschlich richtungsweisende Präposition zur griechischen Ortsangabe, wahrt den offenen Umfang von γένος μου mit „Sippe“ und ersetzt die unnatürliche Bezeichnung „Unbekleidete“ durch die quellentreue, idiomatische Formulierung „Nackte“. Die imperfektische Gewohnheitsbedeutung bleibt durch die allgemeine „wenn ich … sah, begrub ich ihn“-Konstruktion im autobiografischen Rückblick angemessen erkennbar.
