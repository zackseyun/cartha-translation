  source_fidelity: 'Die Richtungsangabe „hinter die Mauer“ ist gegenüber griechisch ὀπίσω τοῦ τείχους („hinter der Mauer“) nicht sachgemäß: Das Griechische bezeichnet die Lage des bereits hingeworfenen Toten, nicht die Richtung des Werfens. „Aus meinem Volk“ verengt bzw. verschiebt γένος μου gegenüber dem hier naheliegenden, aber bewusst nicht enger festgelegten Sinn von „meiner Sippe/meinen Angehörigen“.'
  naturalness: Die Fassung ist überwiegend verständlich und würdig, doch „den Unbekleideten“ wirkt im heutigen Standarddeutsch unnötig verwaltungssprachlich. „Den Nackten“ ist hier direkt, idiomatisch und entspricht dem parallelen biblischen Sprachgebrauch.
  terminology: „Sippe“ gibt γένος als Verwandtschafts- oder Abstammungsgruppe wieder, ohne es auf die Kernfamilie oder auf das ganze Volk festzulegen. „Ninive“ und „begrub ich ihn“ sind angemessen. Die Fußnote soll die räumliche Deutungsmöglichkeit als solche kennzeichnen, nicht als sichere Aussage ausgeben.
