  yaml_path: translation/deuterocanon/tobit/001/015.yaml
  text: And when Enemessar died[a], Achreil his son became king in his place, and his roads became unsafe[b], and I was no longer able to go into Media.
translation:
  language: de
  text: Als Enemessar starb, wurde sein Sohn Achreil[a] an seiner Stelle König; seine Reisewege wurden unsicher[b], und ich konnte nicht mehr nach Medien reisen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Königsnamen lauten in der hier zugrunde gelegten griechischen Textform Enemessar und Achreil. Andere Textüberlieferungen des Buches Tobit bieten abweichende Schreibweisen und teilweise auch andere Namen.
    reason: textual_variant
  - marker: b
    text: Die hier mit „wurden unsicher“ wiedergegebene griechische Verbform ist ungewöhnlich und schwer zu deuten. Im Zusammenhang mit Tobits Reise nach Medien kann sie bedeuten, dass die Reisewege in Unordnung gerieten oder nicht mehr sicher waren.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέθανεν
  choice: starb
  rationale: Das schlichte deutsche Erzählverb gibt den griechischen Aorist ohne Beschönigung wieder.
- source_word: ἐβασίλευσεν
  choice: wurde … König
  rationale: Im Zusammenhang mit dem Tod des Vorgängers bezeichnet der Aorist den Regierungsantritt; diese Wiedergabe macht den Thronwechsel natürlich und klar.
- source_word: ἀντʼ αὐτοῦ
  choice: an seiner Stelle
  rationale: Die Wendung bezeichnet hier die Nachfolge beziehungsweise Ablösung des verstorbenen Königs.
- source_word: αἱ ὁδοὶ αὐτοῦ
  choice: die Straßen unter seiner Herrschaft
  rationale: Wegen der anschließenden Reise nach Medien sind konkrete Straßen oder Reiserouten gemeint. Die Formulierung macht deutlich, dass αὐτοῦ wohl die dem neuen König unterstehenden Wege bezeichnet, nicht sein persönliches Eigentum.
- source_word: ἠκαταστάτησαν
  choice: wurden … unsicher
  rationale: Die ungewöhnliche und schwierige Verbform weist im Reisekontext auf Unordnung oder mangelnde Sicherheit hin. „Unsicher“ benennt die praktische Folge, ohne völlige Unpassierbarkeit zu behaupten.
- source_word: οὐκέτι ἠδυνάσθην
  choice: ich nicht mehr … konnte
  rationale: Natürliche deutsche Wiedergabe der nicht länger bestehenden Möglichkeit.
- source_word: πορευθῆναι εἰς τὴν Μηδείαν
  choice: nach Medien reisen
  rationale: „Reisen“ entspricht dem konkreten Fortbewegungskontext; bei einem Ländernamen wird das griechische εἰς im Deutschen idiomatisch mit „nach“ wiedergegeben.
